l_english:
dra_abolish_want:0 "Скасувати Потребу"
dra_abolish_want_desc:0 "Народ Драмате не вимагає нічого, окрім того, що потрібно для виживання та виконання їхніх ролей, чинячи опір спокусі накопичувати припаси чи прагнути додаткових зручностей. Їхні домівки також створені відповідно до їхнього характерного мотиву — чи то крамниця торговця, чи лабораторія вченого. Коли ти віриш у задум долі й готовий зіграти свою роль у її великій виставі — навіщо прагнути до розкоші й надлишків, якими ти навіть не скористаєшся?"