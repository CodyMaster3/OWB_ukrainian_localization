l_english:
nf_eureka.0.t: "Морські Кігті та Довгі Ікла"
nf_eureka.0.d: "Ядерного знищення Еврика уникнула — але великою ціною. Ракета не влучила в ціль і впала у води біля міського порту. Радіація вбила або покалічила багатьох, але найгіршим виявились жахіття, що виринули з отруєного моря — майже позаземні. Гірше за все, Еврика виживала завдяки рибальству та торгівлі через порт, тож навіть існування цих мутантів стало загрозою. Портмайстри згуртувались у той час, місцеве ополчення, яке нас усіх захищало. Під їхнім проводом ми навчилися..."
nf_eureka.0.a: "...Довіряти один одному"
nf_eureka.0.b: "...Ніколи не здаватися"
nf_eureka.0.c: "...Відбудовувати все, що можемо"

nf_eureka.1.t: "Регульована галузь"
nf_eureka.1.d: "Є стара приказка в Евриці — «мир вигідний для бізнесу; війна — ще вигідніша». Після вибухів контроль над містом узяла команда з марини. Проте землі навколо були бідні й малозаселені, їх було важко контролювати. Тож замість цього марина почала надавати 'захист' за плату. Сезон походів — і повернення додому на зиму. Вже за одне покоління їх почали звати Портмайстрами.\n\nАле Портмайстри мали обмеження. Еврика не мала важкого озброєння чи креслень — і ризикувала відстати. І тоді, у 2150, до міста прийшла нова банда.\n\nРегулятори — колишні герої Боньярду, ополченці, що охороняли місто. Але у 2141 Сховищник, зваблений словами рейдерів, обернув місто проти них. Чоловіки й жінки, які боронили одне з перших міст Каліфорнії, втекли якнайдалі — й знайшли дім у Евриці. Як казав Калеб: «Це гарне й мирне місце — тут я повішу рушницю над каміном»."
nf_eureka.1.a: "Вони принесли підготовку спецпризначенців"
nf_eureka.1.b: "Вони навчили нас тримати позицію"
nf_eureka.1.c: "Ми навчилися виживати на землі"

nf_eureka.2.t: "Колесо, що обертається"
nf_eureka.2.d: "Регулятори були не єдиними, хто втік до Еврики з Каліфорнії. Починаючи з 2240-х, г’юбологи вирушили на північ, шукаючи вільну землю від переслідувань Ші.\n\nГ’юбологів називають 'шахраями' й 'аферистами', та це — наклеп. Вони вірять, що життя, Всесвіт і все інше — це обертове колесо. Їхнє завдання — очистити Витрати від нейрадинів, які майже знищили людство. Але Траказог Ямка вдарив у наше колесо, і його агент з Арройо вигнав нас з Сан-Франциско. Тож ми прийшли до Еврики, і тут ми залишились. Тут г’юбологи працюють над Великим Вознесінням і прагнуть повернутися до Зоряного Батька на Квецелі."
nf_eureka.2.a: "Геть з Гнобителями!"

nf_eureka.3.t: "Оплату отримано"
nf_eureka.3.d: "Наші добровольці вже вирушили до нових господарів. Ми вже отримали обіцяну передоплату. Та війна завжди приносить здобич, і чим досвідченіші наші генерали — тим більше трофеїв у майбутньому."
nf_eureka.3.a: "За Еврику!"

nf_eureka.4.t: "Трофеї війни"
nf_eureka.4.d: "Наші генерали здобувають все більше трофеїв у полі бою. Ці багатства доставляються додому — для збагачення нашого народу."
nf_eureka.4.a: "За Еврику!"

nf_eureka.5.t: "Сумнівні перспективи"
nf_eureka.5.d: "Хоча нашій команді вдалося знайти певну кількість обладнання підтримки, більшість із нього в поганому стані. Через нестачу матеріалів і знань доведеться обрати один з двох типів спеціалізованої техніки, яку вдалося врятувати."
nf_eureka.5.a: "Вогневі групи та собаки"
nf_eureka.5.b: "Протитанкові засоби та підривники"
nf_eureka.5.c: "Власне, ми впораємось із обома!"

nf_eureka.6.t: "Бізнес Реддінга — це бізнес"
nf_eureka.6.d: "Коли економіка Еврики відкрилася, троє інвесторів звернулись до лідерів міста з пропозицією.\n\nДвоє близнюків, Олівія й Корделл, прийшли зі своїми почетами — батальйоном клерків, охоронців і будівельників, кожен зі своєю унікальною ідеєю. Пропозиція Олівії була простою: покращити інфраструктуру, щоб збільшити експорт до Нової Каліфорнії. Її брат, студент Університету Міста-Сховища, запропонував шукати золото. Адже раніше воно було в Реддінгу, й уся область колись славилась ним. Може, щось і залишилось?\n\nАле була ще третя пропозиція, яка викликала відразу в Ґраніта. Супермутант на ім’я Франциск заявив, що мутанти з Брокен-Гіллз можуть використовувати свої навички для роботи в шахті. Якщо глянути з позиції витрат і вигоди — вони безцінний ресурс. Але хіба не ці чудовиська вбили тисячі?"
nf_eureka.6.a: "Пропозиція Олівії — практична"
nf_eureka.6.b: "Корделл, я в ділі!"
nf_eureka.6.c: "Супермутанти можуть підняти *скільки*?"

nf_eureka.7.t: "До кого звернутись?"
nf_eureka.7.d: "Нещодавно почалась війна за вплив у маленькій державі [FOU.GetName]. Хоч вона здається незначною, ця область є важливою караванною дорогою між Реддінгом і Арройо. Обидві сторони отримають величезну вигоду, контролюючи цю точку. Ми не маємо жодного інтересу в [FOU.GetName] — вона надто віддалена й малокорисна. Але ми можемо скористатись підтримкою однієї зі сторін. Можемо запропонувати свою допомогу в обмін на гроші."
nf_eureka.7.a: "Домовимось з Арройо"
nf_eureka.7.b: "Надішліть посланця до НКР"

nf_eureka.8.t: "Еврика пропонує підтримку"
nf_eureka.8.d: "Наша кампанія за контроль над Фо́рвейзом може отримати вигоду від дипломатичної пропозиції Еврики. Їхня підтримка може допомогти мирно завершити конфлікт, але, звісно, вона має ціну. Найманці Еврики мають силу, з якою варто рахуватись, але наші радники розділені — чи варто погоджуватись на таку угоду?"
nf_eureka.8.a: "Ми з вдячністю приймаємо їхню пропозицію."
nf_eureka.8.b: "Еврика? Це ще хто такі?"

nf_eureka.9.t: "Угода прийнята"
nf_eureka.9.d: "[FROM.GetName] розумно погодилися на нашу пропозицію. Підтримка у питанні [FOU.GetName] коштувала нам небагато, але слід пильно стежити за ситуацією — переможець у боротьбі за [FOU.GetName] може наступним звернути погляд на нас."
nf_eureka.9.a: "Приємно мати справу."

nf_eureka.10.t: "Угоду відхилено"
nf_eureka.10.d: "[FROM.GetName] безглуздо відхилили нашу пропозицію. Це коштувало нам лише часу й зусиль, але все одно відчувається як ляпас."
nf_eureka.10.a: "Переходимо до інших справ."

nf_eureka.11.t: "Еврика пропонує пакт про ненапад"
nf_eureka.11.d: "Посланець з порту Еврика прибув до Арройо з пропозицією укласти пакт про ненапад між нашими державами. Це, ймовірно, тимчасове рішення зростаючої напруги між нами, але воно може дати нам змогу зосередитися на важливіших справах."
nf_eureka.11.a: "Приймаємо, поки що."
nf_eureka.11.b: "Ні, але скоро побачимось."

nf_eureka.12.t: "Пропозицію відхилено"
nf_eureka.12.d: "Арройо відкинуло наші розумні дипломатичні пропозиції. Схоже, ми їх повністю неправильно оцінили — вони дійсно вважають нас лише майбутньою мішенню. Нам доведеться готуватися до неминучого конфлікту."
nf_eureka.12.a: "Отже, буде війна."

nf_eureka.13.t: "Наймане військо Еврики"
nf_eureka.13.d: "Еврика діє інакше, ніж майже будь-яка інша нація. Замість звичайної постійної армії вони беруть участь у конфліктах по всьому західному узбережжю в обмін на гроші та досвід армії. Вони не можуть тренувати нові дивізії звичайним чином і мають дуже обмежену промисловість, натомість створюють війська та обладнання через спеціальні рішення.\n\nНайманців можна надсилати через кнопку 'Надіслати добровольців' у дипломатичному меню. Надсилання найманців (якщо в країні ще немає підрозділів Еврики) автоматично приносить 40 капів, а підвищення рівня генералів дає додаткові 25 капів. Лише початкові генерали та ті, кого дають фокуси й події, приносять ці 25 капів.\n\nЩоб надіслати найманців, треба мати присутність у порту країни. На початку гри Еврика має присутність від південного краю Баха до Капітолійного пагорба Вашингтонського Братства. Фокуси дозволяють розширити цю присутність і, відповідно, втручатись у нові конфлікти."
nf_eureka.13.a: "Зрозуміло."

nf_eureka.14.t: "Занадто близько до дому"
nf_eureka.14.d: "Тихий вечір було розірвано невимовним вибухом у порту Еврики. Рибалки, які саме повертались із моря, загинули миттєво. Корабель із найманцями, що повертався з відпустки, було накрито вибухом — багатьох поранило або вбито. Початковий шок змінився розпачем, а потім і гнівом, коли рятувальники виявили отруйне зелене марево — ознаку того, що забруднювачі були включені навмисно. Це не нещасний випадок. Це — терористичний акт."
nf_eureka.14.a: "Ми це запам’ятаємо."

nf_eureka.15.t: "Сліди майстерності"
nf_eureka.15.d: "Коли рятувальну операцію було завершено, ми зосередились на розслідуванні — й знайшли тривожні факти. По-перше, це точно не був нещасний випадок. Адміністрація порту чудово знала про його важливість і ніколи не зберігала б там небезпечних матеріалів. По-друге, все було ретельно сплановано: жодних слідів чи доказів не залишилось. Це справа рук професіоналів. Серед двох наших головних загроз — НКР і Арройо — винуватець очевидний. НКР занадто зайняті Мохаве, а от Арройо шукає будь-яку причину для війни з нами."
nf_eureka.15.a: "Вони за це заплатять."

nf_eureka.16.t: "Арройо вимагає підкорення"
nf_eureka.16.d: "Делегація з Арройо офіційно звернулась до Портмайстра Сміта з пропозицією приєднання Еврики до «Конфедерації Арройо» під їхнім проводом. На перший погляд, це образа, зважаючи на нашу самостійність. Але після детальнішої розмови пропозиція виглядає доволі вигідною: інвестиції, збереження нашої армії найманців і доступ до нових риболовецьких зон.\n\nВтім, якщо ми відмовимось, то лише війною зможемо зберегти незалежність. Відмова призведе до поступового поглинання й втрати контролю. Якщо ми хочемо залишитись вільними — буде війна."
nf_eureka.16.a: "Пропозиція Арройо вигідна"
nf_eureka.16.b: "Ми ніколи не схилимося перед кимось!"
nf_eureka.16.c: "Ми вже під захистом НКР"

nf_eureka.18.t: "ГЕЙ! ГЕЙ, АРАДОРНЕ!"
nf_eureka.18.d: "Ти спокійно йдеш пусткою, аж раптом чуєш, як хтось кричить тобі вслід — але звертається не твоїм ім’ям. Обертаєшся — бачиш хлопчика з кучерявим волоссям. Хоча… це точно дитина? Він низький, та обличчя доросле, і… О, Боже, які в нього потворні гігантські ноги — й він босий! Він каже: «Ой, ти не Арадорн. Хто ти?» — і тікає, не дочекавшись відповіді. За ним біжить худий ґуль і шипить тобі вслід."
nf_eureka.18.a: "Гей, хлопче, постривай! Хто такий Арадорн?"
nf_eureka.18.b: "Що, в срань, тут відбувається?"

nf_eureka.19.t: "Що це на землі?"
nf_eureka.19.d: "Ти повернувся на те саме місце, де бачив учора того дивного хлопчину з ґулем, і знайшов блискучу каблучку з ланцюжком. Мабуть, той дурний хлопець її загубив. Ти просто продав її випадковому торговцю за трохи готівки."
nf_eureka.19.a: "Ке-чинґ!"

nf_eureka.20.t: "Оповіді Компанії Ґраніта"
nf_eureka.20.d: "'Цілуйте Америку на прощання, хлопці.'\n\nЦі слова Ґраніта пролунали в останній момент перед вибухом Нафтової платформи, коли його люди втікали з Наварро. Хардкорні залишки втекли на схід, до Чикаґо та Столиці, але Ґраніт повів тих, хто не зміг або не захотів. Залишені, забуті. Звісно ж, вони звернулися до найбільшої цінності Пустки — війни.\n\nПротягом трьох десятиліть Компанія Ґраніта воювала, лагодячи застарілі силові броні, в той час як радіо повідомляло про нового президента на Сході. Хтось пішов далі боротися з мутантами, хтось загинув. Але зрештою ніхто не залишився, хто ще мріяв про мрії Анклаву.\n\nКомпанія мала багато клієнтів, але кілька правил залишалися незмінними."
nf_eureka.20.a: "Ґраніт брався за будь-яку справу без зайвих питань."
nf_eureka.20.b: "Але найбільше він зневажав псів НКР."

nf_eureka.21.t: "Еврика!"
nf_eureka.21.d: "Компанія Ґраніта блукала Пусткою десятиліттями, та так і не знайшла собі дому. Ріно стало небезпечним після падіння Сальваторе. У Волт-Сіті дехто осів, але гарнізон НКР багатьох відлякував. Сіетл? Мальовниче місце — до появи Братства. Макартур? Там їх офіційно визнали зрадниками за допомогу Вибраному у вбивстві Горрігана. І що робити?\n\nТим часом в Евриці вже було кілька груп найманців. Що поганого в ще одній? Так останні війська Анклаву на заході стали найманцями в «забитій дірі світу»."
nf_eureka.21.a: "Старі солдати не помирають..."
nf_eureka.21.b: "Вони просто зникають."

nf_eureka.22.t: "Щасливий син"
nf_eureka.22.d: "Ґраніт ріс поруч з батьком у військових походах, вчився у бунтівних офіцерів і цинічних Послідовників. Він літав на вертибердах до Куверу, обідав із солдатами Ріо, вчився у народу. На жаль батька, він, певним чином, став 'місцевим'. Але дому так і не знайшов. Компанія Ґраніта просто марширувала пустками — гроші за службу, похоронний марш для загиблих. Аж до холодного листопадового дня 2274 року, коли цей марш заграв для самого Ґраніта.\n\nТак пішов останній американець. Тепер Компанії Ґраніта та решткам Західного Анклаву лишилось лише написати епілог."
nf_eureka.22.a: "Він таборує на старій стоянці."

nf_eureka.23.t: "У лігві ведмедя"
nf_eureka.23.d: "З роками Еврика зіткнулася з проблемою — НКР був занадто успішний. Кому потрібні найманці, коли в тебе тисячі солдатів із бронетехнікою? Охороняти каравани — добре, але це не приносило таких прибутків, як рейди на Волт-Сіті. НКР почали бачити в Евриці проблемне гніздо. Дехто навіть вважав, що Республіка незабаром просто окупує місто «для відновлення порядку». Частина найманців пішла на схід або північ, інші пішли на пенсію.\n\nА дехто задумався — чи не час Евриці знайти інший шлях до виживання. У будь-якому разі, що б ми не робили — Республіка нас помітить."
nf_eureka.23.a: "Малий бізнес завжди крайній."
nf_eureka.23.a_tt: "Відкриває рішення §Y«Приховати активність від НКР»§!, що дозволяє витрачати £pol_power §YПолітичну владу§! або £currency_NCR_text_icon §Yкапи§!, щоб зменшити підозри НКР. Деякі дії, наприклад польоти на вертибердах, підвищують підозру."

nf_eureka.24.t: "Компрометація безпеки!"
nf_eureka.24.d: "Пане Президенте, ми отримали тривожні повідомлення: НКР згадує наші об’єкти у своїх радіоефірах. Один агент взагалі випадково натрапив на нашу конференц-залу, не розуміючи, куди потрапив. Якщо ми нічого не зробимо, нас викриють. Подальша діяльність може призвести до катастрофи."
nf_eureka.24.a: "Настав час діяти."
nf_eureka.24.b: "Глушити радіо, підробляти звіти — як завжди."
nf_eureka.24.c: "Зупинити видобуток ресурсів."
nf_eureka.24.e: "Згорнути агресивні операції."
nf_eureka.24.f: "Зупинити будівництво."

nf_eureka.25.t: "Північний похід"
nf_eureka.25.d: "З ростом економіки Каліфорнії настав час освоювати нові рубежі. Еврика раніше була надто віддаленою, нецікавою Півдню. Але все змінилося — й з’явилася можливість.\n\nЕврика може розвиватися завдяки ресурсам і товарам, а не лише найманцям. Риба, фрукти, праця. Але для цього потрібні нові поселенці. Ґраніт і [EUR.GetLeader] сперечаються. [EUR.GetLeader] хоче приймати всіх. Ґраніт — лише найкращих: працьовитих і заможних. «Ми не Легіон. Нам не потрібні кріпаки». Кому віддати перевагу?\n\nМожливо, варто звернутися до старих друзів..."
nf_eureka.25.a: "Більше людей — більше сили!"
nf_eureka.25.b: "Вибірковість — запорука якості."
nf_eureka.25.c: "Ласкаво просимо додому, американці."
nf_eureka_suspicious: "\n§YNКР§! стане §Rпідозрілою§!."

nf_eureka.26.t: "Я зустрів тебе в барі Сан-Франциско..."
nf_eureka.26.d: "Сан-Франциско — ворота на північ і колись улюблене місце відпочинку Наварро. Еврика хоче інвесторів і торгівлі. Ши раді обмінюватися деревиною та їжею за технології, але вони не забули про Анклав. Х’юбологи знаються на авіації, хоча й дивакуваті. Але вони не проти співпраці. Кого обрати?"
nf_eureka.26.a: "Хай живе Імператор!"
nf_eureka.26.b: "Може, в Зоряному Отці щось таки є?"

nf_eureka.27.t: "Неспокійні сусіди"
nf_eureka.27.d: "Однією з причин, чому Компанія Ґраніта оселилася в Евриці, була готовність Сержанта працювати з мутантами — традиція, що тягнеться ще з часів падіння Платформи. Хоча ґулі та супермутанти й були потенційною загрозою, Ґраніт поводився з ними ввічливо, подаючи приклад. Компанія Ґраніта і Портмайстри не раз разом проводили вдалі операції, особливо славнозвісний рейд на Велику Вісімдесятку у 2268 році.\n\nАле між двома групами все ж є напруження. Зокрема, Компанія Ґраніта набагато менш охоче йде на співпрацю з Республікою, віддаючи перевагу незалежності. Та поки що це лише теоретична суперечка — всі розуміють, що конфлікт може зруйнувати спільноту, і ніхто не хоче кликати НКР на північ. Та й деякі ґулі варять непоганий самогон."
nf_eureka.27.a: "Може, вони й мутанти, але це наші мутанти."

nf_eureka.28.t: "Напад ґулів!"
nf_eureka.28.d: "«Твоя поїздка скінчилася, гладкошкірий!» — вигукнув один з Портмайстрів, відкривши вогонь по Сержанту. Перший постріл промахнувся, а другий злегка поранив Ґраніта. Хоча поранення не смертельне, але залишило слід і гіркий осад. [EUR.GetLeader] просить пробачення, стверджуючи, що це був поодинокий випадок. Але, можливо, настав час діяти рішучіше."
nf_eureka.28.a: "Було два постріли — третього не буде."
nf_eureka.28.b: "Тримати це в таємниці."
eur_crackdown_justified: "§YПридушення§! виправдане"
eur_crackdown_justified_tt: "Ми отримаємо виправдання для §Yрепресій§!"
EUR_setting_examples: "Переслідувати патрулі Портмайстрів"

nf_eureka.29.t: "На спомин про минуле"
nf_eureka.29.d: "Це було прикро, сумно і... занадто легко. [POR.GetLeader] і його люди майже не охороняли периметр у ніч штурму. Вони були елітою, майже як Рейнджери НКР. Але проти Компанії Ґраніта, озброєної енергозброєю Ван Ґрафів? Вони навіть не виставили дозори. За кілька десятків загиблих ґулів і одного пораненого солдата, ми взяли Еврику. І остаточно вирішили питання Наварро."
nf_eureka.29.a: "Прикро, але необхідно."
nf_eureka.29.b: "Я ж казав, третього пострілу не буде."

nf_eureka.30.t: "Компрометація безпеки!"
nf_eureka.30.d: "Капрале, схоже, що Рейнджери дізналися про наші дії. Один клятий листоноша зайшов у конференц-залу й побачив пам’ятні кухлі з символікою Анклаву. Тепер він прямує до Тіньових Пісків, щоб донести [NCR.GetLeader] і отримати винагороду. Якщо ми не вживемо заходів зараз, усе може скінчитися катастрофою."
nf_eureka.30.a: "Прийшов час діяти."
nf_eureka.30.b: "А якщо запропонуємо їм торговельні привілеї?"
nf_eureka.30.c: "Подаруймо листоноші зброю!"
nf_eureka.30.e: "Згорнути агресивну діяльність."
nf_eureka.30.f: "Зупинити будівництво."

nf_eureka.31.t: "Рештки Анклаву?"
nf_eureka.31.d: "Пане Президенте, судячи з цього звіту, Компанія Ґраніта працює в Евриці. Але серйозніше те, що вони починають агресивні дії, які в разі бездіяльності можуть загрожувати Республіці. І хоча це лише купка найманців, це все ж плювок у прапор."
nf_eureka.31.a: "Скільки ще разів я маю вас вчити?"

nf_eureka.32.t: "Додому їм — Невада"
nf_eureka.32.d: "Невада нас почула! Люди з регіону відгукнулися на наш заклик розвивати економіку Еврики. Три групи зацікавилися:\n\nМодок — фермери, що підтримають наші сільгоспекспорти.\n\nВолт-Сіті — науковці, хоч і з упередженням до ґулів.\n\nРіно — виробники хімії з солідним капіталом. Кого оберемо?"
nf_eureka.32.a: "Фермерство — справа чесна. Для інших."
nf_eureka.32.b: "Волт-Сіті? Там живуть старі друзі!"
nf_eureka.32.c: "Очевидно, треба обирати тих, хто має ресурси."

nf_eureka.33.t: "Наварро сам до тебе прийде!"
nf_eureka.33.d: "Щоб відбудувати Наварро, потрібен плюралізм — користь для всіх. Але як приборкати ці землі?\n\nПортмайстри відкриють кордон для всіх, навіть з дивним минулим. Регулятори хочуть імпортувати рабів для промисловості. Ґраніт прагне залучати гідних людей за зразком Волт-Сіті. Який шлях ми оберемо?"
nf_eureka.33.a: "Ласкаво просимо, нові громадяни!"
nf_eureka.33.b: "Це неоплачувані стажери, а не раби."
nf_eureka.33.c: "У всіх тут темне минуле — ще кілька не завадять."

nf_eureka.34.t: "Лікар на місці"
nf_eureka.34.d: "Ми знайшли старого лікаря Анклаву — доктора Генрі! Це великий здобуток для, гм, Компанії Ґраніта. Генрі досліджував кібергенетику й вважав, що пустельники — все ще люди. Його насміхали, але тепер — він знахідка! В обмін на роботу ми пробачимо йому втечу.\n\nХоч він і обурюється, що його знайшли «загоничі», він може принести багато користі. І якби ми були негідниками, хіба б ми надавали медицину союзникам?"
nf_eureka.34.a: "Яка самовідданість."
nf_eureka.34.a_tt: "\n§gДоктор Генрі доступний як радник.§!"

nf_eureka.35.t: "Завершити розпочате"
nf_eureka.35.d: "[EUR.Getleader] завжди мав неоднозначні стосунки з Арройо. Старший Граніт завжди казав, що Обраний — найкращий мутант, якого він коли-небудь зустрічав, і Гранітна компанія брала не один контракт з Арройо. Але інші члени Компанії стверджували, що Арройо підірвав Платформу — терористичний акт проти мирних науковців. Хто міг бути таким монстром?\n\nНапруга лише зростала з часом. Воїни Арройо вигадували історії про Анклав, настільки чорні, що аж смішні. Після одного візиту, коли йому було шість, приємна жінка з Арройо перестала надсилати Граніту цукерки; а його батько кілька днів мовчав. І після атаки в Неваді, здійсненої воїнами Арройо під проводом вождя на ім’я Кага, стало зрозуміло, що Арройо не можна довіряти.\n\nІ все ж, мир міг перемогти. До того фатального дня, коли воїн Арройо відкрив вогонь по бійцю Гранітної компанії на кордоні. Коли Граніт отримав звістку про напад у Наварро, він мовчав кілька секунд. А потім спокійно сказав: \"не зв’язуйтесь із армією цього чоловіка.\""
nf_eureka.35.a: "Це за всіх, хто не зміг вибратись."

nf_eureka.36.t: "Платформа не була місцем честі"
nf_eureka.36.d: "Анклав прибув у металевих птахах, наче зграя голодних жуків-чіттігів, ховаючи зло за блискучою бронею. Вони викрадали нас з домівок, ставили експерименти над нашим народом і намагались знищити світ. А Граніт? Той чоловік називав себе героєм, роздираним між мораллю й честю. Але він просто допоміг Обраному втекти з Платформи. Він підняв зброю на свого товариша не заради слабких, а щоб врятувати себе. Чи повинні ми дякувати Загону Граніта за нашу свободу? Чи має радолень дякувати мисливцю, що не вистрілив?\n\nТепер його син збирає плем’я на півдні — привиди-солдати, які колись лякали Каліфорнію. Час нагадати Пустоші, чому Наварро — небезпечне й гниле місце. Місце, де нічого не цінують. Руїна."
nf_eureka.36.a: "Це за всіх, хто не зміг вибратись."

nf_eureka.37.t: "Солодка перемога"
nf_eureka.37.d: "Радійте, мешканці Пустоші! Палій Арройо мертвий! Більше він не продаватиме ваших рідних до рабських ям у Ден, і не торгуватиме джетом через Ріно. Більше він не стрілятиме у Рейнджерів і наркоторговців. Але що робити з їхнім князівством зарази?\n\nЄ один варіант; хоч Граніт, як і кожен справжній американець, виступає проти рабства, Тринадцята поправка чітко дозволяє примусову працю злочинців. І якщо не рахувати десятиліття несплачених податків, ці монстри знищили Платформу! Вони вбили Президента! Ми мали б повне право продати їх у рабство і використати виручене для відбудови Америки.\n\nАле, можливо, це неправильно; хоча Обраний і мусив загинути за свої злочини, Граніт не збирається судити весь народ лише за те, як вони ставились до нього в дитинстві. Неможливо обійняти дитину ядерною ракетою. Запропонувати Арройо самоврядування під захистом Гранітної компанії, повага до їхніх вірувань і милосердя — хіба це не американські ідеали?\n\nМожливо. Але Америка загинула разом із Платформою. І тепер Граніт може переконатися, що її вбивці загинуть теж."
nf_eureka.37.a: "Примусова праця — справедлива й вигідна."
nf_eureka.37.b: "Чи не знищую я ворогів, роблячи їх друзями?"
nf_eureka.37.c: "Semper Fi, мутанти."

nf_eureka.38.t: "Інженери з Наварро"
nf_eureka.38.d: "Схоже, ці диваки з Наварро мають пропозицію для шахтарів з Реддінга; вони готові поділитися своїм досвідом.\n\nЗвісно, ми як і раніше стурбовані їхніми явними зв’язками з Анклавом. Але з огляду на наші інтереси в Мохаве, ми не можемо багато що зробити. Наші шахтарі готові працювати з ними. І чесно кажучи, ми вже мали справу з рейдерами раніше. Та все ж, у справедливому суспільстві наші капіталісти не вели б бізнес з потенційним ворогом. Досить обурливо, насправді."
nf_eureka.38.a: "Можливо, Цезар мав рацію."
nf_eureka.38.b: "Скористаймось виконавчими повноваженнями, щоб скасувати контракт."

nf_eureka.39.t: "Контракти Реддінга"
nf_eureka.39.d: "Схоже, що б там не думав [NCR.GetLeader], індустріалісти та гірничі конгломерати Реддінга радо наймають нас. У певному сенсі, ці дурні самі продадуть мотузку, на якій ми їх повісимо."
nf_eureka.39.a: "На щастя, ми скористаємось плазмовими гранатами."

nf_eureka.40.t: "Імперіалізм Затінених Пісків"
nf_eureka.40.d: "Схоже, [NCR.GetLeader] — не дурень і заборонив торговцям Реддінга працювати з нами. Дуже прикро. Але з іншого боку, це відштовхнуло чимало їхньої підтримки в Реддінгу. Внутрішні розбіжності означають, що Ведмідь не цікавитиметься нашими діями деякий час."
nf_eureka.40.a: "Нетерпимість — одна з найбільших трагедій людства."

## Flags
conquered_navarro: "Завойовано Наварро"

nf_eureka.41.t: "Розлад шлунку"
nf_eureka.41.d: "Ми здійснили диво, здобувши перемогу в Наварро! Ми відкинули НКР і захопили Наварро як буферну зону. Люди Граніта вже облаштовуються, але ми наштовхнулись на серйозну проблему. У регіоні залишились тисячі людей, які ненавидять одне одного, на землі з величезним потенціалом. Якщо ми підемо звідси — НКР або Ші одразу ж повернуться. Але якщо впораємось з керуванням — у кожного в Евриці буде майбутнє. То що ми робимо?"
nf_eureka.41.a: "...Я не підписувався на побудову націй!"
nf_eureka.41.b: "А чи знайдемо ми колись свій дім серед зірок?"

nf_eureka.42.t: "Назад до школи"
nf_eureka.42.d: "Щоб Еврика залишалась силою в Пустоші, яка перетворюється на імперії й держави — нам потрібна зброя. Важка зброя. Багато важкої зброї. Але як?\n\nЄ кілька ідей, які варто дослідити, але вони розділили кабалу, що керує Еврикою. Граніт просуває ідею співпраці з Містом Сховища або друзями зі Сходу. Портмайстри готові домовитися з НКР, пропонуючи допомогу Інституту ОСІ в обмін на дотації до Затінених Пісків. А Регулятори? У них — своя ідея.\n\nШі колись були майстрами наукових відкриттів — мріяли про космічні кораблі, нові джерела пального тощо. Але їхнє лідерство потрапило під вплив ворогуючих додзьо. Дослідження тривають, але яскраве майбутнє Ші померкло. Можливо, хтось з них втомився від вічного кунг-фу?"
nf_eureka.42.a: "Дякуємо, Затінені Піски!"
nf_eureka.42.b: "А що таке Чикаго?"
nf_eureka.42.c: "Сан-Франциско ставав трохи хаотичним."
EUR_less_suspicion_tt: "\n§YNКР§! стане §Mменш підозрілою!§!"

nf_eureka.43.t: "Я залишив своє серце в Сан-Франциско"
nf_eureka.43.d: "Сан-Франциско — рідне місто для багатьох із Еврики. Х’юбологи стояли на Золотих Воротах, споглядаючи зорі. Гранітна компанія постачала вантажі на їхню заставу за морем. А Регулятори пройшли крізь це місто десятиліттями раніше, прямуючи на північ. Колись це було багате, квітуче місто — доки банди Ші не розірвали його на шматки. Але що нам робити зі Сталевим Палацом? І з Імператором?\n\nГранітна компанія використала б Імператора для своїх цілей — обчислення секретів старих друзів на Західному Узбережжі. Х’юбологи — щоб очистити людство від нейродинів. А Регулятори? Вони просто продали б його Братству, на запчастини.\n\nІ, звісно ж, НКР буде в люті — ми ж розграбували одного з їхніх головних торгових партнерів. Можливо, вони вже готуються до війни!"
nf_eureka.43.a: "Слава Батьку Зірки!"
nf_eureka.43.b: "Немає слів, щоб описати, наскільки це тупо."
nf_eureka.43.c: "Цікаво, чи зможемо підключитись до PoseidoNet..."

nf_eureka.44.t: "Єдина гра в місті"
nf_eureka.44.d: "Проблема, розумієш, у тому, що всі в Евриці були з глузду з’їхали. Х’юбологи хотіли очистити нейродини ще більшою радіацією. Граніт ганявся за привидом мертвого світу. А Регулятори думали, що зможуть стати друзями НКР, здобувши довіру старих ворогів. Усі були дурнями. Сан-Франциско мав цінності — технології, які Ші та Х’юбологи тільки б змарнували. А НКР? Вона означала кінець епохи найманців у Каліфорнії. Але за її межами? Завжди знайдеться хтось, кому потрібен ствол. Чому б не подивитись, кому ще потрібна допомога?"
nf_eureka.44.a: "Війна ніколи не змінюється — але наші тарифи можуть."

nf_eureka.45.t: "Хлопці знову в місті"
nf_eureka.45.d: "Боньярд ніколи не цінував нас по-справжньому, але саме Регулятори навели порядок і врятували місто. Як символічно, що ми робимо це знову. Ми більше не відкинуті НКР, більше не просто найманці. Ні, сьогодні — і завтра — ми герої Каліфорнії. Ми приборкали Північ і зробили те, чого не змогла Республіка. І ми будемо продовжувати — аж поки Республіка не визнає наші заслуги."
nf_eureka.45.a: "Гарний штат, і ми будемо старатись тримати його таким."

nf_eureka.46.t: "Дивлячись на зорі, я бачу когось іншого"
nf_eureka.46.d: "Духи мертвих постійно намагаються вплинути на нас. Вони проникають у мозок і змінюють хімію, створюючи нейродини. Радіація Зети знищує деякі з них і відлякує духів — але ненадовго.\n\nЗ нашою перемогою, народ вільний від нейродинів раз і назавжди, і ми можемо виконати великий план Хаба. Ми не просто тягнемось до Кетцаля; ми створимо Кетцаля у Пустоші, визволяючи розум. Колись сміялись, що шатл не полетить. Але тепер наші хоробрі астро-люди вирушають у трансцендентну подорож і знаходять секрети зоряної дитини.\n\nТепер наше небесне колесо рухається — і прокотиться по всіх, хто стане на заваді. Кетцаль, твій час наближається!"
nf_eureka.46.a: "Батько Зірок любитиме тебе, якщо впустиш його."

nf_eureka.47.t: "Згадай Платформу"
nf_eureka.47.d: "Обраний — НКР — Братство. Всі вони виступили проти Анклаву й нашої спроби врятувати Пустош, Америку й людство. Можливо, ми ніколи не відродимо мрії та славу минулого. Але ми можемо вшанувати прапори наших батьків. Навіть зараз прихильники Граніта поширюються по всій НКР. Вони принесуть мир у цю зруйновану пустку. Бо як ще врятувати демократію?"
nf_eureka.47.a: "Боже, благослови Америку."

nf_eureka.48.t: "Вирвати перемогу з пащі поразки"
nf_eureka.48.d: "Конфлікт у Наварро був, безумовно, жахливим. Ще гірше те, що це виглядає катастрофічно для [NCR.GetLeader]! Як він знову виграє вибори та зосередить увагу на Мохаве, якщо купка бандитів контролює територію? На щастя, [EUR.GetLeader] і решта з його кліки — люди розумні. Вони згодні правити територією від імені Республіки в обмін на амністію й громадянство. Прийнявши цю пропозицію, ми все одно матимемо доступ до ресурсів регіону. Чудовий план, чи не так?"
nf_eureka.48.a: "Знову я виграв у каравані."
nf_eureka.48.b: "Але тепер я виглядаю повним дурнем!"

nf_eureka.49.t: "Не можу повірити, що це спрацювало."
nf_eureka.49.d: "Схоже, НКР нерозумно прийняла нас до свого складу як території Еврики. Тепер ми можемо спокійно реалізовувати свої плани — і мріяти про найбільше пограбування, яке коли-небудь бачив світ. НКР вважала, що позбулась нас назавжди — і скоро дізнається, наскільки помилялась."
nf_eureka.49.a: "Зачекайте... тепер, коли ми всі громадяни..."

nf_eureka.50.t: "Правління Новою Каліфорнією"
nf_eureka.50.d: "Архіви в Затінених Пісках зображують Анклав, як не дивно, в дуже непривабливому світлі. Нас називали фанатиками, фашистами й іншими огидними словами. І хоча ми знаємо, що НКР була корумпованим, заскорузлим режимом, що служив елітам, а не народу — омани Пустошників залишаються. У результаті ми стикаємося з масштабним повстанням по всій Республіці. Люди кажуть: \"Краще туніка Цезаря, ніж кепка Анклава.\" І все, чого ми хотіли — вилікувати мутацію!\n\nНа щастя, в нас є кілька варіантів. Ми можемо відновити контроль Регуляторів над Боньярдом, дозволивши нашим друзям з Еврики захистити свою батьківщину. Можемо зробити Реддінг васальною державою. Або ж укласти угоду з Гейзом? Хіба ми не прагнемо одного — відновлення американської величі?"
nf_eureka.50.a: "Регулятори добре нам служили."
nf_eureka.50.b: "Дайте Баронам їхню частку."
nf_eureka.50.c: "Гейз точно допоможе нам."

nf_eureka.51.t: "Справжній патріот"
nf_eureka.51.d: "Дехто називає Антона Флінна зрадником — але це абсолютно не так. Він просто розуміє, що Сполучені Штати Америки — найкраща надія Пустоші на мир, і працює з нами заради цього. Він — ідеальний приклад призначення Анклава й Каліфорнії. Часи м’якотілих дурнів, які не визнають ціну прогресу, завершуються. Флінн — лише один із багатьох патріотів у Новій Каліфорнії, які готові відійти від провінційної вірності й працювати з Наварро задля світлого майбутнього. То чи підтримаєте ви його приклад, американці?"
nf_eureka.51.a: "Боже, благослови Анклав."

nf_eureka.52.t: "Не питай, що Анклав зробить тобі"
nf_eureka.52.d: "Анклав у ваших домівках — і, сподіваємось, у ваших серцях. Дехто запитає: що таке Анклав для Каліфорнії? І чому ми тут?\n\nХтось скаже, що НКР відновила цивілізацію. Ваші домівки були безпечнішими за батьківські. Ваші діти йшли до школи — й доживали, зазвичай, до дорослого віку. Але хіба не пустили вони в душу декаданс і корупцію? Хіба ваші лідери не дозволили негідним наживатися на вашій праці? Гулі й супермутанти, здатні вбити ваших близьких. Анархісти-паразити, які не роблять внеску в спільну справу. Ми збудуємо новий світ — на захист людства. І на ваш захист."
nf_eureka.52.a: "Радикалізм Послідовників надто довго загрожував Каліфорнії."
nf_eureka.52.b: "Некрополіс от-от здичавіє."
nf_eureka.52.c: "Ми маємо викрити корупцію в Сенаті НКР."

nf_eureka.53.t: "Гадючник"
nf_eureka.53.d: "Ріно — місто гріха та злиднів, повій і вина. Виникає питання: навіщо нам це місто, якщо Вегас пропонує ті самі послуги? Та все ж, тут живе платоспроможне населення, і, можливо, десь серед цього бруду є ті, кого варто врятувати. Ми маємо кілька варіантів. Можемо залишити місто собі, або передати його Місту Сховища (якщо вони наші союзники). Або ж — дозволити Ван Граффам керувати. Якщо хтось тут і має цінність, то це Тіарет — жінка з добрими манерами й харизмою, в якої, схоже, всі хромосоми на місці. І вона радо підтримала нас, коли ми захопили НКР."
nf_eureka.53.a: "Ріно — корисний форпост на передовій."
nf_eureka.53.b: "Нехай Ван Граффи керують — за певну ціну."
nf_eureka.53.c: "Можливо, Місто Сховища знайде йому застосування."

nf_eureka.54.t: "FEV Керлінг-13"
nf_eureka.54.d: "Наші батьки казали, що Платформа була дослідницьким центром, створеним для лікування Пустоші. Але записи Братства говорять інше — Платформа була лабораторією зі створення біологічної зброї, яка мала вбити мільйони. Багато з нас виросли в родинах пустошників; інші були всиновлені або приєдналися до лав Гранітної компанії. Якщо ці файли правдиві — якби Племінний зазнав поразки, ми були б мертві.\n\nРеакція в Наварро різна, але загалом похмура. Дехто з офіцерів наклав на себе руки — бо якщо це правда, то що ж ми зробили? Група найманців знищила націю, яка прагнула до американських ідеалів. Цього не може бути.\n\nЦього і не було, зрозумів Граніт. Братство й НКР ненавиділи Анклав і створили темну змову й пропаганду, щоб зганьбити засновників Америки. Чи були помилки? Можливо. Надмірності заради спасіння нації? Ймовірно. Але історія, що містилась у цих файлах — вигадка.\n\nІ все ж, аналіз цих даних дав Анклаву деякі унікальні ідеї."
nf_eureka.54.a: "Стратити полонених із Братства за поширення пропаганди."
nf_eureka.54.a_tt: "\n\n§gЗізнаємось, усій Новій Каліфорнії це сподобалось.§!"
nf_eureka.54.b: "Що за чортівня — Хорріган?"
nf_eureka.54.c: "Схоже, Платформа була вражаючою..."

nf_eureka.55.t: "Демократія — не підлягає переговорам!"
nf_eureka.55.d: "Жахливі новини! Поки свобода перемогла в Скелястих Горах, схоже, група найманців із залишків Анклава захопила Каліфорнію! Із знищенням другої найбільшої демократії Пустоші, ми залишились самі. Добре, що світло свободи все ще горить у Возз'єднаних Штатах."
nf_eureka.55.a: "Фашисти, чорт забирай."

nf_eureka.56.t: "Що за біса?"
nf_eureka.56.d: "Я не розумію. Наші люди прилетіли на базу Макартура, перетнули крижані вершини, що пронизують небо — і їх зустріли... пострілами? Схоже, заколотники, які колись покинули Анклав, тепер правлять Північчю від імені Возз'єднаних Штатів Америки. І жінка на ім’я Марта Сантьяго хоче, щоб ми знали — вона йде за нами?"
nf_eureka.56.a: "Гаразд, більше так не робимо."

nf_eureka.57.t: "...Серйозно, ви вижили?"
nf_eureka.57.d: "Хоча ми знали, що кілька дезертирів залишились на заході після падіння Наварро, ми не очікували дізнатись, що вони відвоювали, гм, і Наварро, і Нову Каліфорнію? Це справжнє свідчення духу Анклава і нашої відданості свободі. Навіть якщо ми не маємо уявлення, хто такий 'Сержант Граніт' і чому він важливий.\n\nЯк би там не було, принаймні ми можемо поділитись кресленнями силової броні. І фруктовим кошиком із Саду Богів."
nf_eureka.57.a: "...Технічно, вони всі дезертири."

nf_eureka.58.t: "Нам надіслали фруктовий кошик!"
nf_eureka.58.d: "Незважаючи на плутанину на базі Макартура, нас прийняли як героїв і заблукалих солдатів. Хоча деякі бюрократи й казали, що ми — технічно дезертири, результати говорять самі за себе. [MCA.GetLeader] навіть надіслав нам фруктовий кошик — із наукового комплексу, де ростуть рослини, яких не бачили з часів Великої війни. А ще — деякі пропозиції щодо нашої силової броні."
nf_eureka.58.a: "Добро — це найкраща нагорода, але манго я теж люблю."

nf_eureka.59.t: "Послання з Чикаго"
nf_eureka.59.d: "На жаль, Президент Еден занадто зайнятий, щоб зустрітися з нашими розвідниками. Очевидно, він готується до оборони Столичної Пустоші. Уявляєте? Коли він переможе, Анклав керуватиме від Моря до Світлого Моря! Що може бути краще?\n\nВтім, Секретар внутрішніх справ радо надіслав помічника. Капрал привітав нас із знищенням бункера Загублених Пагорбів — він теж воює з відділенням Братства в Іллінойсі. І пообіцяв, що незабаром ми долучимось до його Великої Справи."
nf_eureka.59.a: "Боже, благослови Анклав."

nf_eureka.60.t: "Вибори в Анклаві"
nf_eureka.60.d: "Вибори — одне з найбільших надбань Америки! Але, як показує досвід, їх треба контролювати. Не можна дозволити людям обирати лідерів без належного керівництва — а то ще оберуть назад уряд НКР! Ха! Ні, ми самі подбаємо про вибори й закріпимо позицію Граніта. Водночас ми можемо провести опитування, щоб визначити, що найбільше хвилює виборців — згодиться для подальшого управління. То що ж їм потрібно?"
nf_eureka.60.a: "Каліфорнійці хочуть сильнішої армії!"
nf_eureka.60.b: "Каліфорнійці хочуть кращу економіку."
nf_eureka.60.c: "Каліфорнійці хвилюються за водопостачання."
nf_eureka.60.e: "Каліфорнійці розповідають урядовим соціологам, як сильно люблять Анклав!"

nf_eureka.61.t: "Згадай Платформу"
nf_eureka.61.d: "Вертоптах низько пролетів над темно-синіми водами і завис. Тепер уже неможливо сказати, що колись стояло тут — до того, як вибухнула ядерна бомба. Сотні чоловіків і жінок працювали тут, аби проклясти Пустошу.\n\nВони знищили голодиски й спалили архіви. Вбили всіх чиновників НКР, які знали правду, в таборі Черепахове Гніздо. Але ж це було правдою, так? Якби Обраний зазнав поразки, Граніт та ціле покоління Анклава не жили б сьогодні. Їхні матері й батьки померли б, захлинаючись власними рідинами — через президента, якого ніхто з них навіть не бачив. Справа, за яку вони боролися? Вони були гірші за Цезаря, гірші за Братство. І саме вони правили Пустошшю.\n\nЄдина демократія Заходу — загасла, наче полум’я. Порядок, що протримався з часів Великої війни — похований у бункерах. Навіть справа, хай і жорстока, що принесла порядок Аризоні — розіп’ята на дорогах, які вони самі проклали.\n\nПісля хвилини мовчання Граніт кивнув пілоту. Молодий хлопець, він знав. Народжений у Наварро, мати з Реддінга. Можливо, його покоління впорається краще."
nf_eureka.61.a: "Боже, благослови Анклав."

nf_eureka.62.t: "Випробування сироватки"
nf_eureka.62.d: "Наука була бездоганною. Мутагенна сироватка мала викликати регрес у генетичній матриці, що призводить до дестабілізації та асиміляції аномальної ДНК, залишаючи носія вільним від мутаційного потенціалу.\n\nНа жаль, наразі лікування призводить до швидкої загибелі клітин і, як прикро, не стабілізує мітохондріальні ядра. Але ми впевнені, що завжди знайдеться більше піддослідних — і, як ми завжди знали, відбудова Америки потребує часу. Навіть для Анклава."
nf_eureka.62.a: "Спроба — не катастрофа. Ще раз!"

nf_eureka.63.t: "Гроші крутять світ"
nf_eureka.63.d: "Судова система пропонує чимало можливостей для тих, хто вміє рахувати. Деякі дурні скоюють злочини, аби заробити. Але розумні — заробляють на злочинцях. Зустрічайте Max Sec: він приймав ув’язнених з усієї Пустоші за помірну плату. Вироблена продукція — від рідкісних мінералів до перероблених схем — зазвичай класифікується як металеві компоненти. Потім ці матеріали експортуються в інші країни, приносячи прибуток.\n\nАле нове керівництво має інші ідеї. Портмайстри хочуть залишити все як є. Х’юбологи вважають, що порожнє небо в горах — чудова нагода споглядати зірки, перетворивши цю місцину на паломництво до свого божества. А Гранітна компанія? В них є ідеї з давнього, довоєнного місця...\n\n                                                 Табір Черепахове Гніздо."
nf_eureka.63.a: "Бізнес є бізнес!"  #Good 1
nf_eureka.63.b: "Безбожним рукам — побожні справи, заради прихильності Зірок."  #Good 2
nf_eureka.63.c: "Наказ 990066 ще є куди вдосконалювати."  #Bad 1

nf_eureka.64.t: "Благословення Хаба!"
nf_eureka.64.d: "Ми використали в’язнів для переобладнання старої будівлі на обсерваторію — й уже отримали видатні результати. Паломники покращують свої нейродини через пожертви, зоряна велич відкривається погляду, а аура людства простягається крізь космос до Зоряних Істот.\n\nРегулятори також повідомляють, що отримали цінні дані щодо довоєнних супутників і ракетних систем, але це — дрібниці. Велика Подорож триває!"
nf_eureka.64.a: "Усього за десять кепів — новий рівень!"

nf_eureka.65.t: "Ласкаво просимо назад, командире"
nf_eureka.65.d: "Із рішенням Міста Сховища співпрацювати з Наварро ще один із давно втрачених солдатів повернувся додому. Привітаймо сержанта Дорнана, який залишає своє мирне пенсійне життя, вбиваючи мутантів і рейдерів у Місті Сховища — щоб знову вбивати їх, але вже за благороднішу справу."
nf_eureka.65.a: "Чорт забирай, я скучив за цією уніформою."