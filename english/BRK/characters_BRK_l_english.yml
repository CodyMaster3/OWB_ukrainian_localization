BRK_GRAVEN_NAME:0 "Ґрейвен"
BRK_GRAVEN_WW_NAME:0 "Король К. Крейвен"
BRK_GRAVEN_DESC:0 "Закутий у броню часів Старого Світу, привезену з далекої півночі, Ґрейвен — справжня загадка. Його минуле покрите темрявою, обличчя бачили одиниці, а його моторошні опіки не мають відомого походження. У юності він був диким, жорстоким, одержимим владою. Але з віком його жага крові перетворилася на щось куди більш зловісне. Кажуть, з роками приходить мудрість, але для Ґрейвена з роками прийшло безумство."

BRK_RAGNAR_NAME:0 "Рагнар"
BRK_RAGNAR_DESC:0 "Син Інею — так називають Рагнара. Легенди розповідають про його народження: дитя мерця та крижаної велетки з Безмежної Білості. Кажуть, лише Морозна Кліка знає істину. Міфи міфами, а сила Рагнара очевидна для кожного: вищий та ширший за будь-кого на узбережжі, він уособлює принцип «виживає найсильніший». Сім футів зросту і нелюдська витривалість, його жага до битв не поступається його надлюдській силі."

