l_english:
nf_reno.1.t:0 "Найбільше мале місто Пустки."
nf_reno.1.d:0 "До того як ядерний дощ спопелив усе зверху? Ріно було найбільшим малим містом у світі! А тепер? Наше чудове містечко — це оазис безпечного розгулу, де можна бухнути, знайти компанійку й розважитись, не боючись, що за тобою хтось стежить. Знаєш, за що ми найбільше вдячні?"
nf_reno.1.a:0 "Та за всі ті тачки!"
nf_reno.1.b:0 "Казино вціліли ідеально — для справ це просто кайф!"
nf_reno.1.c:0 "Старі військові пости залишились — стволів на всіх вистачить!"

nf_reno.2.t:0 "Прихід НКР"
nf_reno.2.d:0 "НКР — наша найбільша радість і біда. Бо туристи не приїдуть, якщо в тебе економіка дихає на ладан, правда ж? Але от їхні мита і довгі загребущі руки — це вже гемор. \n\nУ 2240-х Ріно був поділений між чотирма сім’ями — Мордіно, Бішопами, Райтами й Сальваторе. \n\nМордіно хотіли підм’яти під себе Північну Каліфорнію через Джет, але Обранець пустив їм під ніж всю схему, роздаючи ліки. Тепер ці придурки сидять за межами міста в своєму смердючому гадючнику. Сальваторе мали свою зіркову мить — лазери, все діла, але їхній постачальник зник як ранковий дим. Сьогодні вони типу "виховують молодь". Райти намагались зробити з міста щось цивільне, але більшість реновців не захотіла кидати веселощі — саме за це ви й приїхали. А Бішопи? Та Джон Бішоп і його син були досить розумні, щоб зрозуміти: з НКР треба дружити, бо за ними майбутнє! Хіба не лапочки? \n\n(Ця брошура оплачена казино Shark Club. Shark Club! Відчуй себе акулою серед мальків!)"
nf_reno.2.a:0 "Ходімо в Shark Club!"
nf_reno.2.b:0 "Дякувати Райтам."
nf_reno.2.c:0 "Мордіно? Колись же вони були великими шишками, ні?"

nf_reno.3.t:0 "Порядок по-Райтівськи"
nf_reno.3.d:0 "Крістофер Райт десь дотримався, а десь — забив на ідеали своєї мами. Під його керівництвом Ріно намагається стати чистим, безпечним місцем, де можна ростити сім’ю. Там, де діти паряться через тести, а не наркотики. Моляться, а не валять одне одного. Хоча, звісно, і проституція, і гральний бізнес залишаться — щоб хоч якось стримувати людей від ще гірших звичок."
nf_reno.3.a:0 "Радійте за тих, кого врятовано, а не сумуйте за загубленими."

nf_reno.4.t:0 "Підйом Військового Вождя!"
nf_reno.4.d:0 "Реновські кримінальні лорди-невдахи більше не правлять тут! Тепер тут верховодить Традд — разом зі своїми братами! Сотні мутантів, а може й тисячі, потягнулися до Нью-Ріно за останні місяці, і позавчора вночі вони влаштували справжню різанину — поклали всіх, хто намагався чинити опір, та повісили й прилюдно стратили кожного з лідерів сімей. Райт помер останнім — з жахом дивлячись на те, що породив. Тепер Ріно править Військовий Вождь Традд! Щогодини десятки містян тягнуть силоміць у баки з FEV, а ще більше мутантів прибуває з Пустки. У Традда одна мета, і він говорить прямо: він помститься за Майстра! Він відродить його справу й урятує Расу Мутантів! Хто встане між ним і Маріпосою — вже труп."
nf_reno.4.a:0 "Хай живе Вождь! За Майстра!"

nf_reno.5.t:0 "Матінка Ван Ґраф"
nf_reno.5.d:0 "Ван Ґрафи торгують золотом, енергозброєю і, чесно кажучи, всім, що несе кепси. Їхні методи викликають суперечки, але одне ясно — вони вкачують бабки у всі свої нові справи в Ріно! Он подивись, куди вони вже встигли сунути свою щедру лапу!"
nf_reno.5.a:0 "Chop Shop — легенда по розібраних тачках."
nf_reno.5.b:0 "А Cat’s Paw? Та не бреши — ходиш туди через рекламу!"
nf_reno.5.c:0 "New Reno Arms! Зброя для рейдерів уже десятки років!"

nf_reno.6.t:0 "Секс, наркотики чи рок-н-рол!"
nf_reno.6.d:0 "Наш стиль? Та ти й сам знаєш. Жити по максимуму. Жити мрією. Робити, що хочеш, коли хочеш, і скільки хочеш — поки можеш. Секс! Наркотики! Рок-н-рол! Що ще треба в цій смердючій Пустці? Та плюнь, забудь хто ти, де ти — і просто кайфуй!"
nf_reno.6.a:0 "Секс!"
nf_reno.6.b:0 "Наркота!"
nf_reno.6.c:0 "Рок-н-рол!"

nf_reno.7.t:0 "Хто тут головний пес?"
nf_reno.7.d:0 "Усі в Ріно вже десятиліттями гризуться за шматок пирога. Кожна з великих сімей шукає спосіб вийти вперед, захопити контроль. Але тепер? Тільки одна сім’я реально керує вулицями. І краще тобі, блін, це не забути — інакше твоя «відпустка» в Ріно буде дуже болючою. Зрозумів, друже?"
nf_reno.7.a:0 "Мейсон Сальваторе повернув владу завдяки зовнішній підтримці."
nf_reno.7.b:0 "Райти добряче піднялись за останні десятиліття."
nf_reno.7.c:0 "Серйозно? Бішопи й досі тримають усе під контролем."
nf_reno.7.e:0 "Мордіно керують Джетом — отже, керують містом."

nf_reno.8.t:0 "Угода з Новим Кламатом"
nf_reno.8.d:0 "Нью-Ріно пхається в прибуткове, хоч і ризиковане партнерство. Вони хочуть допомогти з відновленням нашої промисловості — в обмін на контроль над цивільним урядом."
nf_reno.8.a:0 "Ми приймаємо їхню пропозицію."
nf_reno.8.b:0 "Кламат залишиться вільним."

nf_reno.9.t:0 "Пропозиція від Вождя!"
nf_reno.9.d:0 "Військовий Вождь Традд, що нещодавно захопив повну владу над Нью-Ріно, шукає нашої підтримки у завоюванні Каліфорнії. Безсмертний мій, чи наважимось ми піти за цим божевільним? Це може бути наш єдиний шанс об'єднатися проти людства, але багато хто в племені сумнівається, чи можна довіряти Традду."
nf_reno.9.a:0 "Ми не можемо проґавити такий шанс! Час мутантів настав!"
nf_reno.9.b:0 "Я ніколи не стану навколішки перед волею Традда!"

nf_reno.10.t:0 "Тролячі Печери приєднуються до армії Майстра"
nf_reno.10.d:0 "Маємо звістку від наших братів-племінників на півночі! Перший приєднується до нової армії Майстра, щоб забезпечити майбутнє нашої раси! Їхня Сила тепер наша Сила!"
nf_reno.10.a:0 "Чудово! Майстра буде помщено!"

nf_reno.11.t:0 "Тролячі Печери нас відкинули!"
nf_reno.11.d:0 "Мій Володарю! Перший, у своїй крайньої пихатості, відкинув наші пропозиції! Він виступає проти мутантів! Проти волі Майстра! Його треба розчавити!"
nf_reno.11.a:0 "І ми його розчавимо! Ніхто не кине виклик Традду!"

nf_reno.12.t:0 "Пропозиція від Вождя!"
nf_reno.12.d:0 "О, всезнаючий і блискучий Мозку! Військовий Вождь Традд звернувся до нас і пропонує місце в своїй новій армії! Він планує хрестовий похід проти Людства, щоб повернути уламки зруйнованої імперії свого жалюгідного Майстра!"
nf_reno.12.a:0 "Неочікувана можливість! Ми приймаємо!"
nf_reno.12.b:0 "Пф! Його армію чекає та сама доля, що й попередню."

nf_reno.13.t:0 "Мозок приєднується до нової армії Майстра!"
nf_reno.13.d:0 "Жахливий Володар Міста Сховища прийняв нашу пропозицію! Вже зараз його найкращі бійці прямують до нас, а він запускає масове виробництво бойових машин! Справжній союзник для великої справи!"
nf_reno.13.a:0 "Полукровка зробив правильний вибір! Нехай доведе свою гідність."

nf_reno.14.t:0 "Мозок відкинув нашу пропозицію!"
nf_reno.14.d:0 "Скулючі полукровки з півночі нас відшили! Вони дурні й егоїсти — не гідні зватися мутантами! Володарю, ми маємо показати їм їхнє місце! Ми маємо розчавити їх!"
nf_reno.14.a:0 "Розчавити? Та ні! Ми їх поневолимо!"

nf_reno.15.t:0 "Культ Єдності!"
nf_reno.15.d:0 "Багато хто в армії вважає, що відродження Культу Єдності збільшить наші шанси на виживання й дасть сенс існування тим хумі, що надто слабкі або ще малі для перетворення в супермутантів! Переваги очевидні, але серед молодого покоління мутантів вистачає тих, хто вважає це марною тратою часу."
nf_reno.15.a:0 "Майстер би цього захотів!"
nf_reno.15.b:0 "Пф! Хай деякі слабкі виживають!"

nf_reno.16.t:0 "Прийняти Місто Сховища до Невадського Енклаву?"
nf_reno.16.d:0 "Місто Сховища висловило бажання приєднатись до нашої організації, і цілком може стати гідним союзником. Їхні технології та чиста кров роблять їх, певно, найприйнятнішими громадянами, яких ця Пустка може запропонувати Енклаву."
nf_reno.16.a:0 "Ми приймаємо їхню заявку!"
nf_reno.16.b:0 "Ми відхиляємо їхню заявку!"

nf_reno.17.t:0 "Місто Сховища приєднується до Невадського Енклаву!"
nf_reno.17.d:0 "Чоловіки й жінки Міста Сховища приєдналися до нашої справи — тепер вони служать Енклаву і Америці! Хай стануть першими з багатьох!"
nf_reno.17.a:0 "Америка воскресне!"

nf_reno.18.t:0 "Місто Сховища викликає наш гнів!"
nf_reno.18.d:0 "Люди з Міста Сховища не варті нашої справи! Їхні технології й ресурси краще послужать нам — навіть без їхньої згоди!"
nf_reno.18.a:0 "Вони недостойні!"

nf_reno.19.t:0 "Купа дурнів у Нью-Ріно!"
nf_reno.19.d:0 "РОНДА: Ви слухаєте UNC, Утобітійський Новинний Канал, і в нас екстрена новина! З нами в студії — зірковий гість, найкраща подруга Табіта!\nТАБІТА: Кажуть, що супермутанти першої генерації і купа дурників захопили місто Нью-Ріно!\nРОНДА: Ого, як дивно! Але чому вони це зробили, замість насолоджуватись безпекою й комфортом, які дарує Держава Утобіта?\nТАБІТА: Гарне питання, Рондо!\nРОНДА: Дякую!\nТАБІТА: Якщо чесно, думаю ці дурники просто намагаються наслідувати ідеальне суспільство, яке ми побудували тут, Рондо! І я їх не звинувачую! Утобіта — це свобода, безпека, спокій... і любов до наших улюблених центі!\nРОНДА: Оу, я обожнюю центі! Вони ж такі милашки!\nТАБІТА: Отож, Рондо! Як їм можна чинити опір? Ті милі личка й те, як вони човгають своїми ручками! Ха-ха!\nРОНДА: Ви все чули, Утобіто! А тепер — до музики…"
nf_reno.19.a:0 "А?"

nf_reno.20.t:0 "Нью-Ріно захоплено!"
nf_reno.20.d:0 "Після серії повідомлень про зникнення людей, грабунки та появу гігантських істот на горизонті, наша розвідгрупа повернулась... точніше, один-єдиний виживший. Весь у потом, пилюці й крові, він ледве говорить, бурмоче про друзів, яких розірвали на шматки. Але найстрашніше — він приніс новину: столицю гріха, Нью-Ріно, захопили супермутанти. Перш ніж втратити свідомість, він повторив слова, сказані йому: «Ріно тепер — земля велетнів. Усі, хто стане на нашому шляху, або приєднаються до Єдності, або здохнуть.»"
nf_reno.20.a:0 "Єдність?!"

nf_reno.21.t:0 "Турботливі родини"
nf_reno.21.d:0 "Ван Ґрафи, Райти, Сальваторе й Бішопи — вони можуть ненавидіти одне одного, але всі хочуть, щоб наше прекрасне місто процвітало. Так, іноді між ними палає не по-дитячому, але ці суперечки — доказ того, що їм не пофіг. Сальваторе, Бішопи та Райти просуватимуть ініціативи, щоб закріпити свою владу. А Ван Ґрафи? Вони, як завжди, раді допомогти всім своїм клієнтам. І може чутки про те, що Мамаша Ван Ґраф нарешті знайшла містера Райта — це правда? Любов у повітрі? У Нью-Ріно можливо все!*\n\n\n*Залежить від умов. Перед екскурсією кладовищем у Ґолґоті порадьтеся з родичами."
nf_reno.21.a:0 "Райти пропонують стипендії."
nf_reno.21.b:0 "Бішопи запускають рекламну кампанію в НКР."
nf_reno.21.c:0 "Зламані Брати об’єднують Сім’ї."


###
nf_reno.22.t: "«Смуч» вбиває"
nf_reno.22.d: "Хоч Мордіно й вигнали з Нью-Ріно, вони облаштувались у Дені — а той давно перетворився на гниле кубло мерзоти й злочину. Лідери Ріно, як завжди, не втручались у справи сусідів і були задоволені таким станом. Але тепер Мордіно впарюють нову, смертельну наркоту. І це тобі не безпечні розваги типу Джету, кави чи бухла — мова про «смачну смерть», новий наркотик на ім’я смуч. Від нього перти так, що криша злітає, але як тільки спадає — користувачі стають млявими, пригніченими, ніби в них душу висмоктали."
nf_reno.22.a: "Які ж виродки продають таке?"

nf_reno.23.t: "Доля Мордіно"
nf_reno.23.d: "Хоч Мордіно й вигнали з Нью-Ріно, вони осіли в Дені — кублі мерзоти й підлоти. Лідери Ріно, за звичкою не втручаючись у чужі справи, мовчки прийняли це. Але тепер Мордіно толкають щось куди гірше за Джет, каву чи бухло — наркоту на ім’я смуч. Дає шалений кайф, але залишає людину розбитою, апатичною, ніби з неї висмоктали волю жити.\n\nМи повинні вибити Мордіно з бізнесу — заради людей Ріно… і заради нашого гаманця. Проблема в тому, що жодна з сімей не ризикне напасти на Ден — це зробить їх легкою мішенню для інших. Тільки якщо хтось зможе об’єднати владу в місті, ми зможемо завдати удару."
nf_reno.23.a: "Які ж виродки продають таке?"

nf_reno.25.t: "Асоційована територія Ріно"
nf_reno.25.d: "...А з вами NCR Radio — усе, що варто знати, прямо вам у вухо. Переговори між Ріно та Шейді-Сендс завершились сьогодні, і, схоже, каменем спотикання в питанні приєднання до штату знову стали проституція й гральний бізнес. Та попри все, [NCR.GetLeader] налаштований на компроміс — тож Ріно приєднається до НКР як асоційована територія. Ріно не матиме представників у Шейді-Сендс, але й не платитиме податки з... гм, туристичних розваг. Ріно — як Веґас, але без легіонерських шпигунів. Завітайте вже сьогодні!"
nf_reno.25.a: "Ура!"

nf_reno.26.t: "Попіл Середи"
nf_reno.26.d: "Кому, як не жінці, зробити чоловічу роботу, правда? Завоювавши місце в радах Нью-Ріно та посади в службах сімей, Ван Ґрафи були готові до наступного кроку — Попільної Середи. За одну ніч і день вони випалили всіх сімейних лідерів своїм енергозброєнням, змусивши місто підкоритися. І одразу взялися за перебудову. Ріно більше не буде містом пороків і уламків новокаліфорнійської економіки. Мамаша Ван Ґраф мала намір дати [NCR.GetLeader] урок, який той не забуде ніколи."
nf_reno.26.a: "Оце так просвітлення!"

nf_reno.27.t: "Інцидент"
nf_reno.27.d: "І ось воно — урочисте відкриття нового притулку з усіма зручностями для знедолених жителів Нью-Ріно. Уся міська еліта — містер Бішоп, Крістофер Райт і шеф Традд — були на місці. Вони виголошували промови про єдність, силу й переваги співпраці. Але їх перервала поява воза, прив’язаного до мотоцикла. На возі стояв якийсь пристрій, а водій виглядав так, ніби вже доживав останні хвилини через радіаційне ураження.\n«Великий для вас!» — закричав він, під’їжджаючи до сцени. «Великий. Для вас!»\nНатовп завмер у жахливій цікавості, поки віз не зупинився десь за 3 метри від сцени.\n«Це бомба!» — закричав хтось, але вже було пізно. Світ замкнула тиша... і біле світло."
nf_reno.27.a: "Невеликий вибух."
nf_reno.27.b: "Сліпуче світло."

nf_reno.28.t: "Угода з Ван Ґрафами"
nf_reno.28.d: "Ми витягли з нашої нової домівки все, що могли, але цього все одно замало. Ми звернулись до Ван Ґрафів, аби домовитись про поставки більш просунутих матеріалів, щоб завершити будівництво комплексу. Переговори пройшли швидко й чітко — вони навіть запропонували свої послуги як найманці в обмін на трохи наших ядерних осердь!"
nf_reno.28.a: "Ми не довіряємо Ван Ґрафам настільки."
nf_reno.28.b: "Їхня допомога нам знадобиться."

nf_reno.29.t: "Мир у наш час"
nf_reno.29.d: "Ми надіслали одного з наших Братів із пропозицією миру й братства до мешканців Шлаку — якщо вони погодяться допомогти нам у боротьбі проти поселенців із Модока."
nf_reno.29.a: "Домовились."
nf_reno.29.b: "Ми не бажаємо шкодити братам по пустці."

nf_reno.30.t: "Токсичні печери"
nf_reno.30.d: "У цих печерах Кламату колись зберігали ядерні відходи. Стара військова база перетворилась на ставок радіоактивного бруду. Старателі оминали цю зону як прокляту — надто вже небезпечно. Лише кілька гулів заходили туди в надії швидко підзаробити. Трапери полювали тут на золотих геконів заради шкури. Але ми можемо переробити майже вичерпані ядерні осердя для задоволення наших зростаючих енергопотреб, і водночас підсилити виробничі можливості Кламату — вони ж так цього потребують."
nf_reno.30.a: "Цілком прийнятна угода."

nf_reno.31.t: "Зламаний Брат"
nf_reno.31.d: "Мрія шефа Традда про єдність у Ріно розлетілася на друзки. Під час скромної церемонії, де були присутні всі голови сімей, стався вибух. Сам вибух був невеликим, але наслідки — страшні. Бомба була начинена FEV і ядерними відходами, які одразу поширилися навколо. Цього вистачило, щоб смертельно отруїти всіх присутніх — окрім супермутантів із Зламаних Братів. Смерть містера Бішопа й Крістофера Райта, лідерів найвпливовіших сімей, спричинила повний хаос у місті.\n\nМамаша Ван Ґраф відразу кинула своїх найманців переконувати рештки Райтів і Бішопів підкоритись їй — але шеф Традд зірвав її план. Після кількох днів вуличних боїв він встановив військовий стан. І проголосив: «Людям потрібен нагляд.»"
nf_reno.31.a: "Так починається панування мутантів..."
nf_reno.31.b: "Ріно зайшов надто далеко!"
nf_reno.31.c: "Цікаві справи кояться в Ріно."

nf_reno.32.t: "Нью-Ріно пропонує співпрацю"
nf_reno.32.d: "Після нещодавнього брутального теракту, що вирізав великі сім’ї, Традд — колишній голова сил безпеки Ріно — узяв місто під свій контроль. Тепер шеф Традд жорстко тримає порядок, зберігаючи крихкий мир між людьми та супермутантами. Усвідомлюючи хитке становище, вони звернулись до нас із пропозицією, від якої важко відмовитись. Альянс, який вигідний обом сторонам перед лицем загрози з усіх боків. Може, настав час відкинути ненависть до мутантів і разом із Траддом будувати ту післявоєнну утопію, про яку ми мріяли.\n\nТа навіть попри всі плюси, фантоми ксенофобії досі бродять серед нас. Більшість нашої ради безпеки не в захваті від союзу з мутантом — навіть із таким розумним і стриманим, як Традд. Ми можемо відмовити й ігнорувати його порожні погрози. Кров — дороге задоволення, навіть для Традда."
nf_reno.32.a: "Разом ми сильніші"
nf_reno.32.b: "Ніколи!"

nf_reno.33.t: "Місто Сховища відмовляє"
nf_reno.33.d: "Місто Сховища підозріло ставиться до нашого приходу до влади і не бажає бачити нас у Невадському пакті."
nf_reno.33.a: "Як шкода."

nf_reno.34.t: "Нью-Ріно протягує руку"
nf_reno.34.d: "Наше становище — і благословення, і прокляття. Фракції з усіх боків хочуть урвати своє, й нам доведеться вибирати сторону. На щастя, Ріно запропонували нам приєднатися до Невадського пакту. Їхня допомога може стати в пригоді — вона допоможе відбити наступ НКР з півдня й мутантських рейдерів з півночі, і водночас дозволить нам розширити вплив на Пустку. Або ж ми можемо відмовити — і зберегти свободу дій. Бо хто ж довіряє мутантам, правда ж?"
nf_reno.34.a: "Разом ми сильніші."
nf_reno.34.b: "Ніколи!"

nf_reno.35.t: "Аройо відмовляє"
nf_reno.35.d: "Аройо не хоче мати з цим справу."
nf_reno.35.a: "Як шкода."

nf_reno.36.t: "Майбутнє Нью-Ріно"
nf_reno.36.d: "Нью-Ріно дедалі більше впадає в екстремізм і дискримінацію немутантів. Але приклад Міста Сховища і Гекко показує, що все може бути інакше. Тепер вибір за нами."
nf_reno.36.a: "Ми більше не будемо терпіти!"
nf_reno.36.b: "Ми всі — люди."

nf_reno.37.t: "Шлюб із гулем?"
nf_reno.37.d: "Хоча НКР вже давно не дискримінує гульське населення, Нью-Ріно став першим, е-е, «штатом», який узаконив стосунки між людьми й гулем — офіційно визнав шлюби з гулями. На питання журналістів один із місцевих жителів відповів: «А хто з них тоді Фісто, а хто — Кур’єр?»"
nf_reno.37.a: "Ніколи не бачив більшої клоаки злочинності та мерзоти."
nf_reno.37.b: "Адам і Єва, а не Атом і Єва!"
nf_reno.37.c: "Ну, кохання — це кохання."
nf_reno.37.e: "Цікаво, а постер можна дістати?"

## opinion modifiers
hates_ghoul_marriage: "Гульські виродки!"
likes_ghoul_marriage: "Підтримує права гулів"