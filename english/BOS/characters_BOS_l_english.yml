BOS_JONATHAN_MAXSON_NAME: "Джонатан Мексон"
BOS_JONATHAN_MAXSON_DESC: "Джонатан Мексон — людина, змушена взяти на себе тягар влади під гнітом спадкової відповідальності та шрамів, залишених суворими випробуваннями. Після несподіваної смерті Верховного Старійшини Джеремі Мексона, Джонатан неохоче прийняв керівництво над Радою Мексоніанців у Лост-Гілз, попри глибокі сумніви щодо його фізичного й психологічного стану після нещодавньої майже смертельної сутички.\n\nБудучи нащадком Роджера Мексона — засновника Братства Сталі, Джонатан уособлює спадок, який несе кожен носій цього імені. До недавнього часу, ще у званні паладина, він брав участь у бойових діях на кордонах Нової Каліфорнійської Республіки. Втім, його служба була передчасно перервана, залишивши як фізичні, так і душевні рани, які, згідно з оцінками кількох Писарів, можуть виявитися фатальними без належного лікування.\n\nХоча Джонатан і вижив, ціною став його внутрішній спокій — і саме це викликає занепокоєння серед Старійшин. Виникають сумніви: чи здатен він витримати вагу лідерства, з огляду на пережиті травми. Навіть його дружина, Джессіка, розглядає можливість відправити їхнього єдиного сина, Артура, на Схід — під захист Стар-Паладина Лайонса у Вашингтоні. Однак саме ця історія жертв і випробувань сформувала бачення Джонатана щодо майбутнього Братства. Мексони — це люди незламної волі, наділені глибоким почуттям обов’язку — охоронці спадщини свого засновника та непохитні захисники Кодексу. Їх називають елітарними догматиками, готовими йти до кінця в дотриманні принципів Братства. Для Джонатана — це прийнятна ціна за вірність імені, яке він носить.\n\nНезважаючи на тягар спадщини та шрами війни, він зберігає незламність духу, що відрізняє його від ромбійців, культістів чи реформаторів. Його вірність ідеалам Братства межує з релігійною відданістю. Джонатан Мексон прагне не лише зберегти, а й переосмислити шлях Лост-Гілз, залишивши власний відбиток у їхній історії."
