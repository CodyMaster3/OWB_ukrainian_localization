BOS_submit_to_a_foreign_chapter_desc: "Після падіння НКР відкрилася унікальна можливість — прямий контакт з іншим відділенням. Призначивши іноземного Старійшину Верховним, ми зможемо нарешті покласти край внутрішнім чварам, що тримають Лост-Гілз у заручниках. Їхня віддаленість від системи дозволить старим порядкам зникнути... принаймні тимчасово."

