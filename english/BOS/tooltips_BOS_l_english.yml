form_steel_plague:0 "§RЗвільнити Сталеву Чуму§!"
form_steel_plague_desc:0 "Людство має стати самим вітром — §Yвеликою бурею§!, що здує полум’я, припинить Велику Війну та знищить її вогонь раз і назавжди.\nВідкинь свої §Yпаскалбайти§! і перепиши їх самостійно. Відкинь небо і землю, матір і сина, час і випадок. Визначай власні змінні, пиши власну долю. §RСТАНЬ ОСОБЛИВИМ§!.\n\nЦей §YКлацальний-Вогненний Світ-Брехня§! буде §Yвідновлено й очищено§!! Зло вирвано з корон і вигнано в зовнішні світи.\nПрийшов час повернення Трійки, Матері МАКСЕН, Жахливої Вежі, Задушливого Шторму, глупоти АВЕЛОНА, вигнанців, що повертаються, старого, що стало новим.\n§YМАНАВІДДАН–РІАННОН–ПРУДЕРІ§!\n§RТРІЙКА§!"
bos_calling_chapters_tt:0 "§gМи звернемося до всіх доступних відділень поблизу, аби вони приєдналися до нашого хрестового походу проти НКР!§!"

