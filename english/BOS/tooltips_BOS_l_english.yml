bos_create_safety_department_tt: "Додати §Y1§! позакартовий §YВідділ безпеки§!.\nНаявність §YВідділу безпеки§! значно зменшує ризик аварій при виконанні рішень у Лост-Гілз і значно підвищує кількість людських ресурсів, які ми отримуємо після кожного рішення."

