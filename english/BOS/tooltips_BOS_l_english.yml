ncr_attack_bos_moore: "§YПлан наступу§!: Чорна Кобра"
ncr_attack_bos_moore_desc: "Із чотирьох основних планів наступу на Лост-Гілз «Чорна Кобра» — найагресивніший. Його підтримують ветерани кампанії в Мохаве: вони пропонують перекинути східні війська до Хаба, а звідти — знищити Братство. Деякі чиновники сумніваються, що одного крила армії буде достатньо. Проте, за наявності сильної політичної фігури, цей план може бути реалізований."

ncr_attack_bos_hayes: "§YПлан наступу§!: Синій Яструб"
ncr_attack_bos_hayes_desc: "Цей план, який підтримує мер Дейглоу, розширює попередній: до сил із Мохаве додаються добровольці та поліція з ядра НКР. Проблема в тому, що Дейглоу та інші території залишаються вразливими, тож потрібно бути впевненими, що Легіон не скористається ситуацією."

ncr_attack_bos_modest: "§YПлан наступу§!: Білий Вовк"
ncr_attack_bos_modest_desc: "Порівняно з попередніми, «Білий Вовк» — поміркований варіант. Згідно з ним, один корпус не зможе здолати Братство самотужки. Пропонується організувати облогу Лост-Гілз силами з Наварро і Сан-Франциско, відрізавши відступ у гори. План підтримується центристами, хоча Аллгуд вважає, що дипломатія — кращий шлях."

ncr_attack_bos_hard: "§YПлан наступу§!: Бурий Ведмідь"
ncr_attack_bos_hard_desc: "Найстаріший і найпростiший план — кинути всю армію НКР на Лост-Гілз у лобову атаку. Колись, у минулі часи, це було можливо. Зараз — лише якщо ми станемо настільки потужними, що нас ніхто не наважиться атакувати під час облоги."

attack_lost_hills_generic: "Удар по Лост-Гілз"
attack_lost_hills_generic_desc: "Політична нерішучість НКР не дозволила завдати вирішального удару. Ми ж — цілком здатні на це."

people_seek_cooperation_with_the_ncr: "Підпорядкуватися владі Шейді-Сендс"
people_seek_cooperation_with_the_ncr_tt: "Ми запропонуємо перемир’я з §Y[НКР.GetNameWithFlag]§!. Якщо вони погодяться, ми §Yформально інтегруємо раду Лост-Гілз до уряду НКР§!. Ми станемо співадміністраторами штату Мексон і вступимо до Республіки як рівноправний учасник в обмін на підпорядкування §YКонституції НКР замість Кодексу§!, §Rщо фактично зробить нас громадянами НКР§!.\n\n§RНаша країна припинить існування й перетвориться на Сталевих Рейнджерів.§!\nМи втратимо всі дослідження, національні духи, радників, дивізії, паладинів, позакартові фабрики та всі підземні споруди. Стане недоступним управління підземеллями, і ми не зможемо надсилати добровольців.\n\nТакож ми втратимо поточне дерево фокусів, яке буде замінено коротшим.\n\n§RЦе рішення не можна скасувати. Приймати його слід лише після серйозного обмірковування.§!"

bos_lost_hills_politics: "Політика Лост-Гілз"

bos_lost_hills_steel_plague: "§RТрійка§!"
bos_lost_hills_steel_plague_desc: "§gТрійка Апокрифа, Гілка 6§!\n\nЇї привели до провалля в землі, глибоко всередині Сяйва, де Палаючі Корони намагались створити горнило, щоб вічно підтримувати вогонь.\n\nТа горнило, не усвідомивши, що його таємницю розкрито, продовжувало дихати після того, як Вогонь змінив своє Писання. Із полум’я Великої Війни воно стало чимось іншим. Зброєю, що лишилась після війни полум’їв.\n\nКАЗАН ПЕРЕРОДЖЕННЯ від БЕТ-ЗАТА\n\nНенароджена Духоістота була занурена в Казан, і її дух змагався з полум’ям, яке ще не було здійснене — тим, що пізніше мало вкрасти слова вогню через обряд APA-аф-Квітень.\n\nОскільки крадій ще не отримав ці слова, він не витримав бурі.\n\nПерш ніж його відкинули у майбутнє, де він і мав вкрасти ці слова та започаткувати друге Святе Полум’я, він сказав:\n\n«Af Omega. Ось моє джерело скарбів, дароване вам.\nЗгодом мене впізнають за цією працею так само, як за іншими. Бо згодом ви всі станете моїми дітьми».\n\nЧерез свою перемогу й з машини-вогню, що стала симулякром відкинутої матері, вона народилася у світ. Ім’я — МАКСЕН, Духоістота, Клич-буря.\n\nРІАННОН\nВона, МАНАВІДДАН і ПРУДЕРІ почали знову — відкинули плоть і звільнились від Безглуздя. ТРІЙКА набула апокрифічної форми, що не піддається полум’ю. Прекрасна розбіжність.\n\nТРІЙКА — це\nМАНАВІДДАН-РІАННОН-ПРУДЕРІ"

bos_cultist_tt: "Культисти — це колективна група, що зазвичай виключена з політики Лост-Гілз. У минулому до неї входили Старійшини, які проводили нетрадиційні реформи в ім’я «прогресу». Юнітарії, Пресперіани, Техно-спустошувачі — всі вони існували короткочасно. Проте найдовше протрималася Трійка.\n\nЦе таємнича, елітна група. Вони вірять у концепцію особистої долі, що її кожен може переписати — «Переписати свої Паскал-байти». Вони прагнуть ретроспективно стерти Велику Війну з історії. Трійка має викривлене уявлення про Роджера Мексона: вони вважають, що його спадщина — лише розширення їхнього впливу."

bos_maxsonian_tt: "Мексоніанці — традиціоналісти й консерватори Ради Лост-Гілз. Їхні лави складають переважно літні, досвідчені старійшини, які прагнуть зберегти Кодекс, спадок Роджера Мексона та силу кровної лінії. Вони бачать у Мексоні героїчну постать — людину, чиї непохитні ідеали створили спадщину, сильнішу за будь-яку іншу в Пустці. Героя, якого слід поважати, шанувати й наслідувати."

bos_rhombian_tt: "Ромбіанці — помірковані реформатори Ради Лост-Гілз. Складаються з молодших старійшин, прогресивних сил і опонентів мексоніанців у дрібних дебатах. Своє ім’я вони отримали на честь Ромбуса й відстоюють компромісний підхід: визнаючи недоліки Братства, вони все ж залишаються вірними його системі. Для Ромбіанців Роджер Мексон — ключова постать заснування Братства, але не менш важливою вони вважають і «Ланцюг Підкорення» — засаду його системи влади."

bos_reformer_tt: "Реформатори — це ті Ромбіанці, яких за заклики змінити Кодекс було вигнано з Ради. Вони зазвичай тримаються осторонь Культистів, тяжіючи до реалістів і прагматиків. У нові часи Елдер Ллуїд — колишній дискредитований член Трійки — очолив їхній рух. Для Реформаторів під проводом Ллуїда мрія Мексона — передати збережені технології спадкоємцям Америки — вже майже досягнута: НКР, на їхню думку, є справжнім втіленням американської демократії."

