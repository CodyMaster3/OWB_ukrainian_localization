bos_create_condensed_civilian_workshop_tt: "Додати §Y1§! позакартову §YКонденсовану майстерню§!.\nКожна §YКонденсована майстерня§! дає штату §YЛост-Гілз§! §G+15%§! до §Yшвидкості будівництва місцевої інфраструктури§!.\n\n§YПорада§!: Механічно в одному штаті можна використовувати лише §Rмаксимум§! §Y15 цивільних майстерень§!, але завдяки цьому рішенню можна отримати §Gбільшу ефективність§! будівництва, навіть маючи лише один штат.\n\n"

bos_create_training_facility_tt: "Додати §Y1§! позакартовий §YТренувальний центр§!.\nКожен §YТренувальний центр§! дає §G+2%§! до §Yатаки й оборони армії§!."

