l_english:
nf_brotherhood_history.1.t:0 "Одна фатальна куля"
nf_brotherhood_history.1.d:0 "15 жовтня 2077 року став переломним днем — днем, коли Роджер Мексон вперше прийняв виклик. Його попередник, полковник Спіндел, не витримав провини за те, що охороняв, і покінчив життя самогубством. Те, що раніше було приховано навіть від солдатів, які стерегли об'єкт, відкрилося у всій своїй потворності. Людські експерименти з генною модифікацією, спершу спрямовані на зцілення та захист від хвороб, швидко перетворились на інструмент творення надсолдатів. Уряд Сполучених Штатів, бачачи потенціал, почав насильно піддавати військовополонених та інших людей різним варіантам Вірусу Примусової Еволюції. Народжувалися потвори, викривлені й нежиттєздатні. Спотворення людяності, породжені наказами тих, хто сам давно вже перестав бути людиною. Для Мексона це стало останньою краплею. Він обірвав усі зв’язки зі США, і його люди пішли за ним. Один за одним вчені піддавалися допитам, визнавалися винними та отримували вирок — негайна страта. 20 жовтня, на всіх частотах, Роджер Мексон та його солдати проголосили відділення від Сполучених Штатів. Це було звернення не лише про наміри, а й про правосуддя. Їхні родини було швидко перевезено до Маріпоси — з остраху, що уряд може відповісти. Але відповіді не надійшло — навіть коли 23 жовтня з неба почала спадати ядерна смерть."
nf_brotherhood_history.1.a:0 "Народжені в той час."
nf_brotherhood_history.2.t:0 "Тягар минулого"
nf_brotherhood_history.2.d:0 "Здавалося, сама доля вирішила, що вони мають вижити — і вибухи стали відповіддю тим жорстоким володарям минулого. Помста прийшла у вогні, знищивши винних і невинних. Солдати, разом із родинами, сиділи в тиші, очікуючи кінця Армагеддону. Маріпоса, немов за дивом, уникнула прямого удару. Її підземні споруди витримали. Вони більше не були солдатами армії США — лише згуртованою групою вцілілих, об’єднаних залізною волею Роджера Мексона. 25 жовтня відзначилось подвигом сержанта Плетнера, який піднявся на поверхню і повернувся з новиною — повітря чисте. Було прийнято рішення: Маріпосу треба залишити. Її злочини й загроза нових ударів були занадто великим тягарем. Після виконання останніх вироків над ученими почався вихід. Колишні військові разом із сім’ями рушили за Мексоном. 27 жовтня вони залишили Маріпосу назавжди. Їхньою новою ціллю став урядовий бункер у Лост-Гілз. Наш дім."
nf_brotherhood_history.2.a:0 "Обтяжені вибором."
nf_brotherhood_history.3.t:0 "Паладини нової епохи"
nf_brotherhood_history.3.d:0 "Коли відступив адреналін виживання після Армагеддону, прийшло відчай. Усе втрачено — минуле стерте, що залишилось? Яка мета? Те, у що вони вірили — навіть прапор — виявилось лише іграшкою в руках тих, хто прагнув влади. Хто використовував технологію для поневолення. Та знову саме Мексон дав надію, повернув зміст і мету. Охороняти майбутнє від минулого. Не допустити повторення. Захистити людство від його власної жадібності. Так народилось Братство. І разом із ним — династія, що покликана стояти на варті людства."
nf_brotherhood_history.3.a:0 "Загартовані метою."
nf_brotherhood_history.4.t:0 "Наше Братство"
nf_brotherhood_history.4.d:0 "Кожній організації необхідна структура — особливо тій, що охороняє людство. Три окремі гілки, кожна з власним призначенням. Писарі — зберігають і розвивають знання. Лицарі — обслуговують і підтримують технології. Паладини — захищають і ведуть у бій. Ті, хто ще не обрав свій шлях — новобранці, що навчаються та готуються до служби. Понад ними — Старійшини. Зазвичай це досвідчені Паладини, які вирізнились у службі. Вони є вищою владою у справах Братства, хоч часто делегують повноваження. Старійшини формують раду, яку очолює Верховний Старійшина. Проте він — не абсолютний володар: рада може скасувати його рішення або навіть замінити його. І, нарешті, Кодекс — засадничі принципи, написані самим Роджером Мексоном. Жодна особа не стоїть понад Кодексом."
nf_brotherhood_history.4.a:0 "Єднані спадщиною."
nf_brotherhood_history.5.t:0 "Наш занепад"
nf_brotherhood_history.5.d:0 "Вони були як діти, що грались із технологією без розуміння наслідків. Вірили, що можуть повернути минуле, не усвідомлюючи, чим було те минуле насправді. Намагались знову впровадити технології, до яких Пустка не була готова. Вони боролись за це — ми боролись проти. І здавалося, що ми можемо перемогти. Та НКР — це інша загроза. Вони такі ж безвідповідальні в технологіях, як і численні. Ми завдали удару по їхній економіці, зранили їхню гордість. Але нас було надто мало. Тепер ми ховаємось у наших укріплених бункерах. Ховаємось від тих, хто прагне відродити те, що вже раз провалилося."
nf_brotherhood_history.5.a:0 "Ми переживемо всіх."
nf_brotherhood_history.6.t:0 "Будувати майбутнє під землею"
nf_brotherhood_history.6.d:0 "Навчальний посібник щодо системи прийняття рішень для підземного будівництва. Йєгааа, радійте і все таке."
nf_brotherhood_history.6.a:0 "Зрозуміло."
nf_brotherhood_history.7.t:0 "Паладини нової епохи"
nf_brotherhood_history.7.d:0 "Паладини — це наші воїни, закуті в блискучу броню та озброєні найкращим, що має Братство. Вони — втілення воїнської досконалості: готові, навчені, рішучі. Якби ж тільки їх було більше.\n\n\n§BПаладини функціонують інакше, ніж звичайні бойові одиниці — їхня чисельність суворо обмежена. Вони не можуть бути натреновані стандартними методами, їхні шаблони не підлягають редагуванню. Їх можна розгорнути лише за допомогою спеціальних рішень — як бойові частини, як допомога іншим відділенням або як експедиційні загони для дослідження довоєнних руїн. Паладини не підлягають легкій заміні — кожна втрата болюча. Ставтесь до них з максимальною обережністю.§!"
nf_brotherhood_history.7.a:0 "Наймогутніші з Пустки!"
nf_brotherhood_history.8.t:0 "Лицарі до праці"
nf_brotherhood_history.8.d:0 "Лицарі підтримують, виготовляють і охороняють наше спорядження. Зазвичай вони не призначені для фронтових боїв, хоча кожен лицар уміє поводитися зі зброєю. У відчаї їх також використовують як розвідників — адже доступу до силової броні вони не мають. Силова броня — прерогатива Паладинів, наших найкращих воїнів. Та все ж, те, чого лицар не має в бойових навичках, він із надлишком компенсує технічними знаннями. Якщо щось зламалося — лицар відремонтує це із зав’язаними очима і однією рукою."
nf_brotherhood_history.8.a:0 "ESSAYONS!"
nf_brotherhood_history.9.t:0 "Писарі для знання"
nf_brotherhood_history.9.d:0 "Писарі — наші історики, хранителі знань і вчені. Вони займаються дослідженнями теоретичних застосувань усього, що лежить під сонцем. Іноді співпрацюють із лицарями для створення прототипів зброї. Вони також ведуть літописи наших братів — кожна дія занотовується й закарбовується у сувоях. Саме тому писарі мають найтісніший зв'язок із нашою головною метою: збереженням минулого."
nf_brotherhood_history.9.a:0 "Знання — сила!"
nf_brotherhood_off_map_chapter_logic.great:0 "Це — відмінно!"
nf_brotherhood_off_map_chapter_logic.terrible:0 "Це — катастрофа!"
nf_brotherhood_off_map_chapter_logic.can_do_focus:0 "Тепер доступне наступне фокус-напрямлення:§Y"
nf_brotherhood_off_map_chapter_logic.can_do_focus_closer:0 "§!"
nf_brotherhood_off_map_chapter_logic.1.t:0 "Новини з далекого відділення: Мутанти захопили D.C.!"
nf_brotherhood_off_map_chapter_logic.1.d:0 "Ми щойно отримали повідомлення, що група Супермутантів розгромила відділення Старійшини Лайонса та проголосила свою владу над усім Вашингтоном! Надходять тривожні повідомлення: тіла бійців Братства вивішено біля Цитаделі як демонстрацію мутантської переваги."
nf_brotherhood_off_map_chapter_logic.1.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_off_map_chapter_logic.2.t:0 "Новини з далекого відділення: Енклейв захоплює D.C.!"
nf_brotherhood_off_map_chapter_logic.2.d:0 "Надійшла звістка, що залишки Енклейву з Наварро перемогли відділення Старійшини Лайонса та встановили контроль над усім Вашингтоном. Полковник Отам і президент Еден змогли ефективно захопити американську столицю."
nf_brotherhood_off_map_chapter_logic.2.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_off_map_chapter_logic.3.t:0 "Новини з далекого відділення: Проєкт «Чистота» активовано!"
nf_brotherhood_off_map_chapter_logic.3.d:0 "Нам повідомили, що відділення Старійшини Лайонса активувало Проєкт «Чистота» — масштабну інженерну ініціативу з очищення води! Незабаром річка Потомак стане скарбом, а не прокляттям."
nf_brotherhood_off_map_chapter_logic.3.a:0 "$nf_brotherhood_off_map_chapter_logic.great$"
nf_brotherhood_off_map_chapter_logic.4.t:0 "Новини з далекого відділення: Оуїн Лайонс загинув!"
nf_brotherhood_off_map_chapter_logic.4.d:0 "Щойно надійшла інформація, що Старійшина Лайонс, який очолював своє відділення на Східному узбережжі, загинув! Його колишній осередок перебуває в пошуках нового лідера!"
nf_brotherhood_off_map_chapter_logic.4.a:0 "Бажаємо удачі Сарі Лайонс."
nf_brotherhood_off_map_chapter_logic.4.b:0 "Схоже, молодий Артур досяг повноліття."
nf_brotherhood_off_map_chapter_logic.5.t:0 "Новини з далекого відділення: Бостон під контролем Братства!"
nf_brotherhood_off_map_chapter_logic.5.d:0 "Ми щойно отримали повідомлення: місто Бостон перейшло під контроль Братства Сталі! Хмарочоси різнокольорового скла й музеї давньої американської історії нарешті опинилися в дбайливих руках."
nf_brotherhood_off_map_chapter_logic.5.a:0 "$nf_brotherhood_off_map_chapter_logic.great$"
nf_brotherhood_off_map_chapter_logic.6.t:0 "Новини з далекого відділення: Інститут здобув перемогу!"
nf_brotherhood_off_map_chapter_logic.6.d:0 "Надійшла тривожна звістка — Інститут встановив повний контроль над Бостоном, розгромивши східне відділення Братства Сталі! Вулицями бродять люди без сердець."
nf_brotherhood_off_map_chapter_logic.6.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_off_map_chapter_logic.7.t:0 "Новини з далекого відділення: Перемога Відступників!"
nf_brotherhood_off_map_chapter_logic.7.d:0 "Надійшла новина, що Відступники Братства Сталі взяли під контроль колишнє відділення Старійшини Лайонса! Вони мають на меті відкинути реформи Лайонса та відновити вчення Братства у більш прагматичній формі."
nf_brotherhood_off_map_chapter_logic.7.a:0 "Бажаємо їм удачі!"
nf_brotherhood_off_map_chapter_logic.8.t:0 "Новини з далекого відділення: Середній Захід впав!"
nf_brotherhood_off_map_chapter_logic.8.d:0 "Щойно стало відомо, що Середньозахідне відділення Братства Сталі знищене! Можна лише припустити, що їх зламали ті ниці люди з Чикаго!"
nf_brotherhood_off_map_chapter_logic.8.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_off_map_chapter_logic.9.t:0 "Новини з далекого відділення: Середній Захід здобув Чикаго!"
nf_brotherhood_off_map_chapter_logic.9.d:0 "Ми отримали повідомлення, що Середньозахідне відділення Братства Сталі проголосило Чикаго своєю територією! Вони тепер є домінуючою силою в самому серці Пустки."
nf_brotherhood_off_map_chapter_logic.9.a:0 "$nf_brotherhood_off_map_chapter_logic.great$"
nf_brotherhood_off_map_chapter_logic.10.t:0 "Новини з далекого відділення: Братство Затоки знайшло Джерело Мрій!"
nf_brotherhood_off_map_chapter_logic.10.d:0 "Отримано повідомлення, що Братство Затоки виявило Джерело Мрій — гігантське природне джерело, побічний продукт якого, за чутками, може слугувати природною заміною Рад-Авей!"
nf_brotherhood_off_map_chapter_logic.10.a:0 "$nf_brotherhood_off_map_chapter_logic.great$"
nf_brotherhood_off_map_chapter_logic.11.t:0 "Новини з далекого відділення: Братство Затоки змушене сховатися!"
nf_brotherhood_off_map_chapter_logic.11.d:0 "Повідомляється, що Братство Затоки було змушене піти в підпілля після невдачі в пошуках Джерела Мрій! Хто знає, що станеться з цим джерелом тепер — або чи воно взагалі існувало."
nf_brotherhood_off_map_chapter_logic.11.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_arthur_maxson.1.t:0 "$bos_nf_the_line_of_succession$"
nf_brotherhood_arthur_maxson.1.d:0 "Артур Мексон, спадкоємець крові Мексонів, часто розглядається як цінний інструмент у руках окремих угруповань старійшин у Лост-Гілз. Тривають обговорення, чи не буде йому безпечніше подалі від Лост-Гілз — там, де він зможе вирости поза впливом політики бункера і стати самостійною особистістю. Відділення Лайонса на Сході видається гідним варіантом для Артура!"
nf_brotherhood_arthur_maxson.1.a:0 "Йому безпечніше тут, поруч із батьком."
nf_brotherhood_arthur_maxson.1.a.tt:0 "§Y$BOS_arthur_maxson_name$§! залишиться в Лост-Гілз і виховуватиметься старійшинами."
nf_brotherhood_arthur_maxson.1.b:0 "Щасливої дороги, малий Мексон!"
nf_brotherhood_arthur_maxson.2.t:0 "Артура Мексона відправлено на Схід!"
nf_brotherhood_arthur_maxson.2.d:0 "Артур Мексон, спадкоємець династії Мексонів, давно вважався корисним засобом у внутрішніх іграх старійшин. Та нещодавно його вивезли з бункера проти нашої волі! Хоча винних затримано і засуджено, повернути малого Мексона вже навряд чи вдасться."
nf_brotherhood_arthur_maxson.2.a:0 "Потрібно було діяти раніше!"
nf_brotherhood_arthur_maxson.3.t:0 "Артур Мексон досяг повноліття"
nf_brotherhood_arthur_maxson.3.d:0 "Артур Мексон завершив своє дитинство і став талановитим, видатним воїном!"
nf_brotherhood_arthur_maxson.3.a:0 "Він стане гордістю свого батька!"
nf_brotherhood_communications.1.t:0 "Шифрограма з Лост-Гілз"
nf_brotherhood_communications.1.d:0 "Лост-Гілз, офіційна штаб-квартира Братства Сталі, щойно надіслала нам попередню шифрограму. Схоже, вони мають намір відновити спроби налагодження зв'язку з нами."
nf_brotherhood_communications.1.d.shi:0 "Лост-Гілз, центральне командування Братства Сталі, встановило знову контакт із бункером у Сан-Франциско!"
nf_brotherhood_communications.1.d.grd:0 "Лост-Гілз, осередок влади Братства Сталі, зумів передати повідомлення до Цитаделі Вартових. Минуло чимало років відтоді, як старійшини востаннє зверталися до нас. Можливо, це ознака того, що вони готові вчитися на помилках минулого."
nf_brotherhood_communications.1.a:0 "Старійшини завжди щось задумують..."
nf_brotherhood_communications.2.t:0 "Постачання з Лост-Гілз"
nf_brotherhood_communications.2.d:0 "Ми отримали партію силової броні від Лост-Гілз!"
nf_brotherhood_communications.2.a:0 "За Братство!"
nf_brotherhood_communications.3.t:0 "Закордонна допомога з Лост-Гілз"
nf_brotherhood_communications.3.d:0 "Хоча ми не є офіційним відділенням Братства, Лост-Гілз усе ж вирішили підтримати нашу справу. Вони надіслали нам постачання!"
nf_brotherhood_communications.3.a:0 "Яка б не була причина — халява не завадить!"
nf_brotherhood_communications.4.t:0 "Невеликий наліт"
nf_brotherhood_communications.4.d:0 "Нью-Рено зазнало незначного рейду. Банда озброєних рейдерів викрала трохи металобрухту в місцевих мешканців."
nf_brotherhood_communications.4.a:0 "Компенсуємо збитки."
nf_brotherhood_council_reforms.1.a:0 "Більш тривалі терміни!"
nf_brotherhood_council_reforms.1.b:0 "Коротші терміни!"
nf_brotherhood_council_reforms.1.c:0 "Залишити все як є."
nf_brotherhood_council_reforms.1.tt:0 "Вибори Верховного Старійшини відбуватимуться кожні §Y[?BOS.BOS_election_months_tt]§! місяців."
nf_brotherhood.1.t:0 "Встановлення правосуддя"
nf_brotherhood.1.d:0 "10 жовтня 2077 року капітан Мексон і його люди з жахом дізналися, що вчені з West-Tek у Маріпосі використовували військовополонених як піддослідних для генноінженерного Вірусу Примусової Еволюції (F.E.V.). Те, як він вчинив із цими вченими, стало зразком для подальших дій Братства."
nf_brotherhood.1.a:0 "Їхні знання цінніші за їхні провини."
nf_brotherhood.1.b:0 "Він знищив їх — бо є межа для науки."
nf_brotherhood.2.t:0 "Експедиція в Сяйво"
nf_brotherhood.2.d:0 "У 2134 році новоутворена фракція Братства на чолі з сержантом Деннісом Алленом звернулася до Ради Старійшин із проханням дозволити дослідити залишки наукової бази West-Tek у пошуках технологічних артефактів. Схвалення або відмова в цьому питанні назавжди відлунювали в історії Братства."
nf_brotherhood.2.a:0 "Йому дали дозвіл — відкриття вартувало ризику."
nf_brotherhood.2.b:0 "Йому відмовили — усе потребує ретельного планування."
nf_brotherhood.3.t:0 "Гадюки"
nf_brotherhood.3.d:0 "У 2155 році Братство відрядило кілька загонів у Пустку для знищення банди Гадюк. Для Старійшин це виглядало як навчання, адже невеликий загін у силовій броні, здавалося, без проблем упорається з будь-якими рейдерами. Один із загонів, очолюваний самим Верховним Старійшиною Мексоном ІІ, виявив Гадюк. Очікуючи, що ті втечуть при першому ж погляді на броню, Мексон зняв шолом. Він недооцінив їхній фанатизм і отруєну зброю. Одне поранення стрілою стало смертельним — Верховний Старійшина помер за кілька годин."
nf_brotherhood.3.a:0 "Братство відступило!"
nf_brotherhood.3.b:0 "Братство помстилося за Мексона!"
nf_brotherhood.4.t:0 "Битва за Наварро"
nf_brotherhood.4.d:0 "Війна з Енклейвом стала найбільшою можливістю для Братства за останні десятиліття. Сотні одиниць передових технологій і древніх секретів — готові до здобуття. Задля цієї мети Братство зібрало всі свої сили, мобілізувавши понад тисячу паладинів з різних бункерів і відділень Пустки. Але в ході битви стало зрозуміло: масова армія НКР зазнає нищівних втрат і не здатна втримати тиск. Перед Братством постала моральна дилема: здобути технології, дотримуючись першого принципу, чи захистити солдатів і громадян НКР — тих, кого може врятувати лише Братство Сталі?"
nf_brotherhood.4.a:0 "Нехай НКР їх відволікає — таємниці Наварро стануть нашими!"
nf_brotherhood.4.b:0 "Ми захистили людей Мексона — і здобули їхню вірність."
nf_brotherhood.5.t:0 "Спільна мова з дикунами"
nf_brotherhood.5.d:0 "Народ Умбри не лише не чинить опору нашій присутності — вони надто розумні, щоби намагатися це зробити."
nf_brotherhood.5.b:0 "Вимагати, щоб вони схилили коліна."
nf_brotherhood.6.t:0 "Альянс із Арройо?"
nf_brotherhood.6.d:0 "Люди з Арройо вже давно користуються нашою прихильністю — зрештою, саме вони дали світові Обраного, який колись урятував Пустку. Ми можемо запропонувати їм захист і союз, адже вже надходять тривожні повідомлення про активність супермутантів на далекій півночі."
nf_brotherhood.6.a:0 "Вони стануть гідними союзниками!"
nf_brotherhood.6.b:0 "Це — марна трата ресурсів."
nf_brotherhood.7.t:0 "Проблеми вдома"
nf_brotherhood.7.d:0 "Нещодавно група паладинів Братства напала на патруль Ші, сприйнявши його за рейдерів. Ші вимагають пояснень. Нам слід бути обережними з відповіддю, аби не зруйнувати відносини з цією високотехнологічною фракцією."
nf_brotherhood.7.a:0 "Наші паладини діяли, аби захистити цивільних."
nf_brotherhood.7.b:0 "Паладини не знали, що то були Ші."
nf_brotherhood.7.c:0 "Ші отримали по заслузі за втручання!"
nf_brotherhood.8.t:0 "Експедиція в Кремнієву долину"
nf_brotherhood.8.d:0 "Кремнієва долина приховує таємниці, які ще не відкрито навіть нами. Що кілька років Західне Братство організовує туди експедицію. Що вдасться знайти цього разу?"
nf_brotherhood.8.a:0 "Древній комп’ютер."
nf_brotherhood.8.b:0 "Запаси високоякісного металу."
nf_brotherhood.9.t:0 "Стримування рейдерської агресії"
nf_brotherhood.9.d:0 "Люди з колишнього Сан-Франциско постійно потерпають від рейдерських банд, попри всі наші зусилля. Нещодавно місцевий кримінальний лідер запропонував свою допомогу в боротьбі з рейдерами — в обмін на особисте помилування…"
nf_brotherhood.9.a:0 "Хто краще зупинить злочинців, як не самі злочинці?"
nf_brotherhood.9.b:0 "Братство не знижує себе до таких зв’язків!"
nf_brotherhood.10.t:0 "Запрошення від Братства"
nf_brotherhood.10.d:0 "Братство Сталі надіслало нам запрошення приєднатися до їхньої фракції, вважаючи, що це піде на користь обом сторонам."
nf_brotherhood.10.a:0 "Прийняти запрошення."
nf_brotherhood.10.b:0 "Відмовити. Ми впораємось без них."
nf_brotherhood.13.t:0 "Пропозиція від Братства?"
nf_brotherhood.13.d:0 "Братство Сталі пропонує нам обміняти низку передвоєнних військових дисків і навчальних матеріалів на промислове обладнання, що лишилося на нашій території. Як нам відповісти?"
nf_brotherhood.13.a:0 "Інформація — це сила! Ми все одно не змогли б їх запустити."
nf_brotherhood.13.b:0 "Надавати щось Братству — це ризиковано."
nf_brotherhood.14.t:0 "НКР приймає наші умови"
nf_brotherhood.14.d:0 "НКР погодилась обміняти промислове обладнання на військову інформацію та навчальні матеріали. Ми завершили з цими знаннями ще десятиліття тому, а ось ці машини приведуть нас далеко!"
nf_brotherhood.14.a:0 "Гідна угода."
nf_brotherhood.15.t:0 "НКР відхиляє наші умови"
nf_brotherhood.15.d:0 "НКР не бажає віддавати машини, якими вони навіть не здатні користуватись! Очевидно, вони намагаються стримати нас у всьому. Доведеться обходитись тим, що є в Мексоні та на наших територіях у Сан-Франциско."
nf_brotherhood.15.a:0 "Обійдемось наявним."
nf_brotherhood.16.t:0 "Експедиція до Ванденберга"
nf_brotherhood.16.d:0 "Коли впали бомби, дехто був готовий дати відсіч — Ванденберг був одним із таких місць. Його шахти були оснащені зенітними ракетами, радари безперервно сканували обрій, а системи оборони були найсучаснішими. Тепер же це лише світне згарище скрученого арматурного заліза й сталевих проваль, заповнених слизом і покинутими технологіями."
nf_brotherhood.16.a:0 "Пріоритет — рідкісні компоненти."
nf_brotherhood.16.b:0 "Зібрати все паливо і металобрухт."
nf_brotherhood.16.c:0 "Відбудувати бункер і радіовежу."
nf_brotherhood.17.t:0 "Лазери за людей?"
nf_brotherhood.17.d:0 "Братство надіслало розвідника з голографічною запискою від квартирмейстера Лост-Гілз. У ній сказано, що Братство має надлишок лазерної зброї, однак їм бракує людей. Якщо ми надішлемо їм кількох рейнджерів, вони готові переслати нам озброєння."
nf_brotherhood.17.a:0 "Ми згодні!"
nf_brotherhood.17.b:0 "Ми відмовляємось."
nf_brotherhood.18.t:0 "Вантаж прибув"
nf_brotherhood.18.d:0 "Надіслане Братством Сталі озброєння нарешті прибуло. Ми вже відправляємо добровольців на їхній фронт."
nf_brotherhood.18.a:0 "Зброя — нарешті!"
nf_brotherhood.19.t:0 "Зачекайте, навіщо вони це зробили?"
nf_brotherhood.19.d:0 "Це від самого початку не було гарною ідеєю."
nf_brotherhood.19.a:0 "Можливо, іншим разом."
nf_brotherhood.20.t:0 "Прибули рейнджери!"
nf_brotherhood.20.d:0 "Виконуючи умови обміну, Пустельні рейнджери надіслали великий підрозділ своїх бійців для підтримки нас."
nf_brotherhood.20.a:0 "Ласкаво просимо до Братства Сталі"
nf_brotherhood.22.t:0 "Висунути вимогу щодо Затоки"
nf_brotherhood.22.d:0 "Наш контроль над Великою Зоною Затоки не викликає сумнівів. Ми маємо вимагати від НКР офіційної передачі цього регіону. Хоча він не має критичного стратегічного значення, його інфраструктура дозволить нам розширити операції в регіоні та створить ключовий буфер на шляху до мосту Золоті Ворота."
nf_brotherhood.22.a:0 "Негайно надіслати вимогу."
nf_brotherhood.23.t:0 "Ультиматум від Братства"
nf_brotherhood.23.d:0 "Ми отримали пряму вимогу від самого Братства. Прагнучи остаточно закріпити свій контроль над Затокою, вони вимагають передачі Санта-Рози, Сан-Рафаеля та Пойнт-Ґріна. Враховуючи, що наші рейнджери зараз зайняті, публічна відмова може викликати паніку серед населення — особливо зважаючи на те, що востаннє подібна ситуація призвела до втрати наших золотих резервів."
nf_brotherhood.23.a:0 "Пойнт-Ґрін? Можуть забрати."
nf_brotherhood.23.b:0 "До біса їх!"
nf_brotherhood.24.t:0 "НКР відмовляє!"
nf_brotherhood.24.d:0 "Лише через кілька днів після надсилання вимоги ми отримали відповідь від НКР — і вона категорично неприйнятна. Вони відкинули нашу претензію та заявили, що Затока є й залишиться їхньою. Схоже, сподівання уникнути війни вичерпані."
nf_brotherhood.24.a:0 "Хай буде так."
nf_brotherhood_foreign_elder.1.t:0 "Лост-Гілз призначає [This.GetLeader] Верховним Старійшиною"
nf_brotherhood_foreign_elder.1.d:0 "Після наших значних перемог Лост-Гілз ухвалив рішення призначити нас Верховним Старійшиною Братства Сталі. Це рішення має величезні наслідки: ми відмовимось від локального командування заради керівництва всім Братством Сталі!"
nf_brotherhood_foreign_elder.1.a:0 "Прийняти честь"
nf_brotherhood_foreign_elder.1.a.tt:0 "Ми перейдемо під контроль Лост-Гілз, втративши поточне дерево фокусів і національні духи, отримавши натомість їхні. Наші держави об'єднаються."
nf_brotherhood_foreign_elder.1.b:0 "Прийняти — але керуватимемо ми"
nf_brotherhood_foreign_elder.1.b.tt:0 "Ми приймаємо призначення, але замість того, щоб слідувати політиці Лост-Гілз, ми продовжимо свою місію. Лост-Гілз буде приєднано до нас, наші радники, духи та дерево фокусів залишаться незмінними."
nf_brotherhood_foreign_elder.1.c:0 "Ми обираємо статус-кво, дякуємо."
nf_brotherhood_foreign_elder.2.t:0 "Новий Верховний Старійшина"
nf_brotherhood_foreign_elder.2.d:0 "Як Лост-Гілз, ми беремо на себе священний обов'язок — не допустити знецінення спадщини Роджера Мексона. Під нашим керівництвом Братство має найвищі шанси на тріумф!"
nf_brotherhood_foreign_elder.2.a:0 "Ad Victoriam!"
nf_brotherhood.26.t:0 "Перемога або смерть"
nf_brotherhood.26.d:0 ""
nf_brotherhood.26.a:0 ""
nf_brotherhood.26.b:0 ""
nf_brotherhood.28.t:0 "Вибір гравця: Умбра"
nf_brotherhood.28.d:0 "У вас є вибір, вперед."
nf_brotherhood.28.a:0 "Добре, приєднуюсь"
nf_brotherhood.28.b:0 "Пф, відчепись, ботане"
nf_brotherhood.30.t:0 "Вибір гравця: Мохаве"
nf_brotherhood.30.d:0 "У вас є вибір, вперед."
nf_brotherhood.30.a:0 "Добре, приєднуюсь"
nf_brotherhood.30.b:0 "Пф, відчепись, ботане"
nf_brotherhood_council_politics.1.t:0 "Інтриги Ради"
nf_brotherhood_council_politics.1.d:0 "Старійшини в Лост-Гілз здавна відомі своїми підкилимними іграми. Нещодавні звинувачення лише посилили напруження, вносячи ще більше розбрату в ряди керівництва."
nf_brotherhood_council_politics.1.1:0 "Ромбіанці зазнають поразки!"
nf_brotherhood_council_politics.1.2:0 "Мексоніанці зазнають поразки!"
nf_brotherhood_council_politics.1.3:0 "Культисти зазнають поразки!"
nf_brotherhood_council_politics.1.4:0 "Реформісти зазнають поразки!"

nf_brotherhood_council_politics.2.t:0 "Драматизм у Раді"
nf_brotherhood_council_politics.2.d:0 "Старійшини в Лост-Гілз здавна плетуть змови одне проти одного. Востаннє ситуація дійшла до відвертого фарсу — рада загрузла в дріб'язкових чварах."
nf_brotherhood_council_politics.2.1:0 "Праві були ромбіанці"
nf_brotherhood_council_politics.2.2:0 "Праві були мексоніанці"
nf_brotherhood_council_politics.2.3:0 "Праві були культисти"
nf_brotherhood_council_politics.2.4:0 "Праві були реформісти"

nf_brotherhood_council_politics.3.t:0 "Внутрішня боротьба"
nf_brotherhood_council_politics.3.d:0 "Рада старійшин у Лост-Гілз дедалі більше роздирається внутрішніми конфліктами. Командна вертикаль паралізована, ефективність — підірвана, а довіра — під питанням."
nf_brotherhood_council_politics.3.1:0 "Рада знову гризеться!"

nf_brotherhood_council_politics.4.t:0 "Герой серед старійшин"
nf_brotherhood_council_politics.4.d:0 "Попри вічні інтриги та суперечки, нещодавно один зі старійшин узяв на себе тягар відповідальності, намагаючись утримати раду в працездатному стані."
nf_brotherhood_council_politics.4.1:0 "Це ромбіанський старійшина!"
nf_brotherhood_council_politics.4.2:0 "Це мексоніанський старійшина!"
nf_brotherhood_council_politics.4.3:0 "Це культистський старійшина!"
nf_brotherhood_council_politics.4.4:0 "Це реформістський старійшина!"

nf_brotherhood_council_politics.5.t:0 "Призначення Верховного Старійшини"
nf_brotherhood_council_politics.5.d:0 "Рада в Лост-Гілз — це правлячий орган Братства Сталі, сформований зі старійшин, що мешкають у бункері. Саме вона визначає, хто з них стане Верховним Старійшиною. У минулому такі призначення були довічними, але нині, на тлі змагання за владу, вони трапляються дедалі частіше."
nf_brotherhood_council_politics.5.1:0 "Призначено ромбіанського старійшину!"
nf_brotherhood_council_politics.5.2:0 "Призначено мексоніанського старійшину!"
nf_brotherhood_council_politics.5.3:0 "Призначено культистського старійшину!"
nf_brotherhood_council_politics.5.4:0 "Призначено реформістського старійшину!"

nf_brotherhood_council_politics.status_quo:0 "Протистояти змінам, зберегти статус-кво"

nf_brotherhood_steel_rangers.1.t:0 "Пропозиція, варта уваги"
nf_brotherhood_steel_rangers.1.d:0 "Старійшина Ллвід із бункера Лост-Гілз запропонував офіційний договір про мир — Каліфорнійську мирну угоду. За її умовами вояки Братства Сталі будуть амністовані, а до Кодексу внесуть поправки, що зобов'язують членів бункера підкорятись законам НКР. Це фактично означає інкорпорацію Лост-Гілз у територію Нової Каліфорнійської Республіки. Крім того, буде створено спільну адміністрацію Сталевих Рейнджерів у штаті Мексон, яка задіє технології з бункера для розвитку регіону.\nВід такої угоди важко відмовитися."
nf_brotherhood_steel_rangers.1.1:0 "Погоджуємось."
nf_brotherhood_steel_rangers.1.2:0 "Це пастка. В атаку!"
nf_brotherhood_steel_rangers.1.3:0 "Як на мене — мені байдуже."

nf_brotherhood_steel_rangers.2.t:0 "НКР приймає!"
nf_brotherhood_steel_rangers.2.d:0 "Нова Каліфорнійська Республіка погодилася на наші умови! Підготовка до втілення угоди вже розпочалася. Ворожнеча може завершитися."
nf_brotherhood_steel_rangers.2.1:0 "Заради миру!"

nf_brotherhood_steel_rangers.3.t:0 "Покинувши бункер"
nf_brotherhood_steel_rangers.3.d:0 "Нарешті ми знову вдихаємо свіже повітря. Довгі роки ізоляції далися взнаки — дехто з Лост-Гілз не бачив сонця вже багато літ."
nf_brotherhood_steel_rangers.3.1:0 "Приємно опинитися зовні."

nf_brotherhood_steel_rangers.4.t:0 "Формування Спільної Адміністрації Сталевих Рейнджерів"
nf_brotherhood_steel_rangers.4.d:0 "Старійшини Лост-Гілз і Сенат НКР досягли згоди!\nНова структура під назвою Спільна Адміністрація Сталевих Рейнджерів стане керівним органом у штаті Мексон — самому серці територій НКР. Старійшини Лост-Гілз фактично визнали владу Шейді-Сендс. Для Каліфорнії починається нова епоха."
nf_brotherhood_steel_rangers.4.1:0 "Каліфорнія змінюється!"
nf_brotherhood_steel_rangers.4.2:0 "Як вони могли!?"
nf_brotherhood_steel_rangers.4.3:0 "Це прекрасно!"
nf_brotherhood_steel_rangers.4.4:0 "Новий початок.."

nf_brotherhood_steel_rangers.5.t:0 "Спільна Адміністрація Сталевих Рейнджерів"
nf_brotherhood_steel_rangers.5.d:0 "Перші тридцять днів були найскладнішими. Лоялісти пішли в тінь, навчання за Кодексом було підпорядковане Каліфорнійській Шкільній Раді, а нова символіка та дисципліна добряче вивели з рівноваги багатьох паладинів.\nТа старійшина Ллвід зберіг холодний розум. Його особисто винагородили за зусилля у впровадженні реформ. Протягом кількох тижнів авіація НКР доставила кілька позначених пакунків для Верховного Старійшини.\nЩо всередині? Запитайте в Ллвіда."
nf_brotherhood_steel_rangers.5.1:0 ""Це особисте питання.""

nf_brotherhood_steel_rangers.6.t:0 "Каліфорнійська Ініціатива Обміну Технологіями"
nf_brotherhood_steel_rangers.6.d:0 "Старійшина Ллвід презентував довгостроковий план: упродовж наступних десятиліть передові технології Братства Сталі поступово виводитимуть із бункера Лост-Гілз і передаватимуть до Інституту ОСІ для поширення по всій Каліфорнії. Повний ефект стане помітним лише через покоління, проте вже зараз це — обґрунтоване стратегічне вкладення."
nf_brotherhood_steel_rangers.6.1:0 "Гідний початок!"


  nf_brotherhood_integrate_guardians.1.t:0 "МІСІЯ: ДУХ-СУТНІСТЬ"
  nf_brotherhood_integrate_guardians.1.d:0 "ПОЗИВНИЙ: §RRHIANNON§!\nЗВІТ ПРО МІСІЮ: §RСлухай уважно, Кардинале. Ти виконав призначене — артефакт «світова діра» в надійних руках. Страшно уявити, що могли б вчинити Вогні, отримай вони її.\nТвоя місія завершена, а мета — досягнута. Настав час повернутись до стада. Повідом своїх вірних: відмовтесь від гербів, повертайтесь до братів.§!"
  nf_brotherhood_integrate_guardians.1.1:0 "\"Заради тебе, Дух-Сутність.\""
  nf_brotherhood_integrate_guardians.1.2:0 "\"Це ще не час!\""

  nf_brotherhood_integrate_guardians.2.t:0 "Стражі прийняли нашу пропозицію!"
  nf_brotherhood_integrate_guardians.2.d:0 "Здається, переговори старійшини Ріаннон зі Стражами принесли плоди. Вони погодились поступово згортати свою автономну ідентичність, натомість повернувшись до суворого дотримання Кодексу. Це великий день для Братства!"
  nf_brotherhood_integrate_guardians.2.1:0 "Разом ми — сила, браття!"

  nf_brotherhood_integrate_guardians.3.t:0 "Стражі залишаються осторонь"
  nf_brotherhood_integrate_guardians.3.d:0 "Старійшині Ріаннон не вдалося переконати Стражів повернутись. Кардинал лаконічно відповів, що час іще не настав. Це не дивина — подібні спроби вже були, і щоразу закінчувались однаково. Та зрештою, вони повернуться до нас."
  nf_brotherhood_integrate_guardians.3.1:0 "Можливо, колись."

  nf_brotherhood.34.t:0 "Бригада Мексона"
  nf_brotherhood.34.d:0 "Рішення захищати людей Нової Каліфорнійської Республіки виявилося вартісним — десятки паладинів Братства віддали життя в запеклих ближніх боях, тоді як Анклав знищував сотні креслень і архівів у глибинах бункера Наварро. Багато хто в НКР так і не зрозумів, наскільки вагомим був цей акт самопожертви — моральний злам, коли Братство вперше поставило людські життя вище за технології. Проте ті, хто служив у бригаді Мексона — люди, що виросли в територіях Братства — розуміли це краще за всіх. Після війни вони сформували низку міліцій, що зберегли зв’язок із Братством Сталі."
  nf_brotherhood.34.a:0 "Для нас — честь мати їх поруч."

  nf_brotherhood.35.t:0 "Покидьки нас підтримують!"
  nf_brotherhood.35.d:0 "Жителі Сан-Франциско згуртувалися навколо історії про паладинів Братства, які захищали мирних мешканців від нападів бойовиків Ші. А. Рон Майєрс, колишній технік Анклаву, який допоміг Обраному дістатись до сумнозвісної Нафтової Вишки, також приєднався до нас, разом зі своїми прихильниками — представниками бідноти Ші-тауна."
  nf_brotherhood.35.a:0 "Ласкаво просимо, містере Майєрс."

  nf_brotherhood.36.t:0 "Прикрий інцидент"
  nf_brotherhood.36.d:0 "Обидві сторони невдоволені тим, як усе відбулося, але вирішили не загострювати ситуацію. Ми проаналізували бойові тактики Ші та вилучили чимало зброї з тіл загиблих — про всяк випадок, якщо доведеться зіткнутися з Імператором."
  nf_brotherhood.36.a:0 "Мудрий запобіжний крок."

  nf_brotherhood.37.t:0 "Ворота до раю зачиняються"
  nf_brotherhood.37.d:0 "Імператор розгніваний нашою зневагою до його влади та до життя його підданих. Відтепер він заборонив будь-яку торгівлю та взаємодію з нами, відмовляється приймати делегації та вважає нашу присутність поблизу його територій неприйнятною."
  nf_brotherhood.37.a:0 "Кому цікаве белькотіння машини?"

  nf_brotherhood.38.t:0 "НКР передала нам Затоку"
  nf_brotherhood.38.d:0 "Після тривалого очікування ми нарешті отримали відповідь від НКР. Вони передають нам територію Пойнт-Грін негайно, вже розпочато виведення військ і техніки. Це знаменує зміну у відносинах із Республікою та може стати початком взаємовигідної співпраці."
  nf_brotherhood.38.a:0 "Час знову відкрити бункер нагорі."

  nf_brotherhood.39.t:0 "Відмова від [From.GetNameDef]"
  nf_brotherhood.39.d:0 "Після несподіваної затримки емісари [From.GetNameDef] повернулись з відповіддю від [From.GetLeader]. Відповідь — негативна. Якщо ми хочемо підкорити [From.GetNameDef], доведеться вдатися до сили."
  nf_brotherhood.39.a:0 "Хай буде так."

  nf_brotherhood.40.title:0 "Сили Братства в силовій броні"
  nf_brotherhood.40.desc:0 "Новини про нашу перемогу в Мохаве досягли [BOS.GetName], і вони вислали нам підкріплення! Серед поставок — додаткові комплекти силової броні T-51b для контролю над регіоном і просування вчення Братства."
  nf_brotherhood.40.a:0 "Ad Victoriam!"

  nf_brotherhood.41.title:0 "Ланцюг, що єднає"
  nf_brotherhood.41.desc:0 "[BOS.GetLeader] звертається до нас із закликом про допомогу. Братство опинилось перед найтемнішою загрозою. Більш нещадною, ніж орди Майстра, більш масштабною, ніж воєнна машина Анклаву. НКР загрожує самому існуванню того, що ми поклялися оберігати. Якщо ми не підтримаємо Лост-Гілз, Каліфорнія впаде в ту ж темряву, що колись привела до Великої війни. \n\nТож дотримуймося Кодексу та готуймося до битви. Ми збережемо Пустку, як завжди."
  nf_brotherhood.41.a:0 "Ad Victoriam!"

