bos_army_confusion_4_desc: "Війна з НКР спричинила дезорганізацію в нижчих лавах Братства! Солдати мають труднощі з постачанням боєприпасів, командна структура порушена, а чвертьмастери загрузли в боргах на неприйнятному рівні!"

