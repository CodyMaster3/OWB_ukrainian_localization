lost_hills_pensions: "Пенсії Чвертьмастерам"
lost_hills_wages: "Зарплати Чвертьмастерам"
lost_hills_cant_change_this_law: "Як Лост-Гілз, ми змінюємо цей закон через національні фокуси."
bos_trade_modifier_to_lost_hills: "Торгова Мережа Лост-Гілз"

bos_tension_dynamic_modifier: "Напруга Лост-Гілз–НКР"
bos_tension_dynamic_modifier_desc: "Ми лише нещодавно зуміли укласти неофіційне перемир’я з НКР. Багато хто в Братстві побоюється, що цей «мир» — ненадовго. Напруга відображає, як із поширенням ідеї про нову війну члени Лост-Гілз починають відходити від своїх догматичних обов’язків, готуючись до вирішального конфлікту з великим ворогом."

bos_ncr_tension_dynamic_modifier: "Напруга Лост-Гілз–НКР"
bos_ncr_tension_dynamic_modifier_desc: "Для багатьох політиків ідея повномасштабної кампанії проти терористів із Братства у горах на захід від Хаба наразі неприйнятна. Знищення золотого резерву НКР довело, яку шкоду може завдати Братство точковими, розрахованими ударами. З огляду на війну в Мохаве й численні загрози, останнє, чого хочуть брамінові барони, Олгуд чи будь-хто інший — це кровопролиття поблизу самісінького серця Республіки.\nЧас Братства ще настане. Питання лише — коли."


BOS_advisor_contest_name_1: "Писар Кемпбелл Райт"
BOS_advisor_contest_advisor_1_desc: "Колись лише молодший писар, Райт проводив більшість свого вільного часу в архівах Лост-Гілз, досліджуючи авіацію, що панувала в небі довоєнного світу. Найбільше його вразили дирижаблі. Хоча у Старому Світі їх вважали застарілими, Райт бачив у них нереалізований потенціал. Він створив проєкти аеростатів, які можна було швидко зібрати з ресурсів, доступних Братству. Ці повітряні гіганти мали б стати засобом проведення експедицій у Техас, на Східне узбережжя та до Середнього Заходу. Сьогодні Райт — провідний експерт Братства з авіації, що прагне повернути Братству небо за допомогою сталевих колосів, яким позаздрив би сам Старий Світ."

BOS_advisor_contest_name_2: "Лицар Генрі Муньйос"
BOS_advisor_contest_advisor_2_desc: "Дід Генрі вступив до лав Братства після аварійної посадки саморобного літака поблизу Лост-Гілз. Хоча Генрі сам не є пілотом, він зарекомендував себе як вправний інженер — особливо в роботі з двигунами, турбінами та вихлопними системами, забезпечуючи їхню надійну та безперервну роботу."

BOS_advisor_contest_name_3: "Лицар Арчибальд"
BOS_advisor_contest_advisor_3_desc: "На полі бою перевага ворога зазвичай означає поразку. Але Арчибальд навчився перетворювати навіть найгірші ситуації на шанс для перемоги — з добрим жартом і впевненістю. Народжений у родині Братства, з дитинства бачив усі жахи Пустки. Проте навіть у найтемніші моменти він знаходив спосіб підтримати бойовий дух. Для новобранців він — незламна опора. Для командування — лідер. Для ворогів — посмішка перед смертю."

BOS_advisor_contest_name_4: "Лицар Малфас"
BOS_advisor_contest_advisor_4_desc: "Після експедиції до лісів на північному сході від Арройо Малфас змінився. Зовнішність, колір шкіри, навіть спогади про рідних — усе зникло. Але незважаючи на це, він лишився ефективним солдатом. Завдяки хитрості й безжальному знанню Західного узбережжя, він провів безліч розвідувальних операцій, які принесли користь Лост-Гілз."

BOS_advisor_contest_name_5: "Паладин Міґіл"
BOS_advisor_contest_advisor_5_desc: "Під час боїв за Ірвайн було виявлено силову броню, розроблену для гірських робіт. Після повернення в Лост-Гілз паладин Міґіл знайшов нове покликання — копати. З майже нав'язливою пристрастю він присвятив себе розробці шахт і тунелів. Його тягне під землю, ніби це частина його сутності. Проблеми з розміром броні не зупинили його. Хоч він і кремезний — ніколи не називайте його гномом!"

BOS_advisor_contest_name_6: "Писар Дж. Біатріс Ґудінаф"
BOS_advisor_contest_advisor_6_desc: "Племінниця колишнього Головного Писаря Ордену Щита, Джейн з дитинства мала свободу в технічній творчості. Без батьків, але з прізвищем, що відчиняло двері, вона витрачала час на експерименти з усім, що не перебувало під пильним наглядом. Справжнє визнання прийшло тоді, коли вона представила дядькові саморобну енергосистему — модифіковану та зібрану зі списаних компонентів. Сьогодні Старший Писар Ґудінаф має повну підтримку Ордену на свої дослідження."

BOS_advisor_contest_name_7: "Писар Ламон"
BOS_advisor_contest_advisor_7_desc: "Писар Лексі Рамонетт здобула популярність завдяки своїй одержимості логістикою. З дитинства вона захоплювалася піп-боєм та архівними записами, що надало їй унікальне розуміння старих систем. Як відверта противниця експансіонізму НКР, вона прагне використати свої навички в тотальній війні проти Двоголового Ведмедя — щоб довести перевагу Братства раз і назавжди."

BOS_advisor_contest_name_8: "Писар Шребер"
BOS_advisor_contest_advisor_8_desc: "“Essayons!” — гасло, яке Писар Шребер ніколи не забуває. Він — інженер до мозку кісток. Став сиротою після падіння Наварро у 2246 і був вихований у Лост-Гілз. Попри чутки про його зв’язки з Анклавом, його відданість Братству — беззаперечна. Його одержимість силовою бронею штовхає його до постійних рейдів на довоєнні бази, де він шукає креслення та вдосконалення бойових екзоскелетів."

BOS_advisor_contest_name_9: "Паладин Бернардо Ґомес де Аґуафреска"
BOS_advisor_contest_advisor_9_desc: "Нащадок мексиканського іммігранта, що служив у національній гвардії до війни, Бернардо виріс у родині, наближеній до еліти Братства. Швидко піднявшись кар'єрними щаблями, завдяки впливу та відданості, він брав участь у війнах з Анклавом та НКР. Усвідомивши, що Братство не здатне перемогти двоголового гіганта, він став прихильником поміркованого курсу. Його позиція — ізоляціонізм і внутрішнє зміцнення як єдиний шлях до виживання."

BOS_advisor_contest_name_10: "Писар Зак"
BOS_advisor_contest_advisor_10_desc: "Колишній ремонтник стрілецької зброї в армії НКР, Зак Хазард прослужив кілька років, так і не просунувшись далі за звання спеціаліста. Це, а також нескінченне лагодження гвинтівок, які солдати ламали в найнеймовірніший спосіб, змусили його залишити службу. У Братстві він, по суті, займається тим самим, що й раніше — але без дурниць. Принаймні тут ніхто не примудряється защемити рушницю дверима."

BOS_advisor_contest_name_11: "Лицар Домітій"
BOS_advisor_contest_advisor_11_desc: "Народжений у Легіоні, Ауреліанус пройшов через суворі випробування Цезаря, але зрештою утік із родиною на захід. Там він знайшов Братство — разом із усіма його перевагами та вадами. Вступивши до лав Лицарів, швидко піднявся в ієрархії завдяки бойовому досвіду та стратегічному хисту. Його підрозділ силової броні легко оточував ворогів або ставав непохитною стіною. Щоби виокремитися, він фарбує свою маску в золотий колір."

BOS_advisor_contest_name_12: "Паладин Хіґучі"
BOS_advisor_contest_advisor_12_desc: "Колишній учасник Якузи, Хіґучі вийшов з організації через незгоду з її варварськими методами та неетичним використанням технологій. Блукаючи Північною Каліфорнією, він збирав зброю, броню й компоненти — зрештою зібрав власну саморобну силову броню та став живою легендою. Попри поразку, його бойові навички вразили Лицарів, і після випробувань він був прийнятий до Братства Сталі."

BOS_advisor_contest_name_13: "Писар Долорес"
BOS_advisor_contest_advisor_13_desc: "Народжена у стінах Лост-Гілз, Долорес знала Пустку лише з кількох вилазок з батьком. Під час однієї з них її загін потрапив у засідку НКР, батька вбили. Долорес врятувалась, але її травма зробила її непридатною до польових операцій. Знижена в ранзі, вона стала писарем і занурилася в психологію — галузь, яку Братство ігнорувало. Тепер вона не лише лагодить зброю, а й зцілює зламані душі Братства."

BOS_advisor_contest_name_14: "Писар Феррі"
BOS_advisor_contest_advisor_14_desc: "На відміну від більшості писарів, Ґвідо Феррі не захоплювався технологіями. Його пристрастю стала кухня Старого Світу, яку він намагається відтворити з інгредієнтів Нового. Хоча дехто сумнівається в доцільності таких занять, ніхто не заперечує: його страви надзвичайно корисні в походах — і для вербування новачків."

BOS_advisor_contest_name_15: "Писар Луїза"
BOS_advisor_contest_advisor_15_desc: "Одна з небагатьох вихідців із Пустки, що була прийнята до Братства. Луїза з'явилася на аванпості з голодисками, що містили креслення та дані про покинуті бункери. Після того, як допомогла захопити ці об’єкти, її технічні знання та розуміння небезпеки, яку несе технологія, вразили Верховного Старійшину. Її погляди стали більш співчутливими до звичайних людей, але суть залишилась: контроль над знанням — життєво необхідний."

BOS_advisor_contest_name_16: "Айверна Шин"
BOS_advisor_contest_advisor_16_desc: "Онука Даніеля Шина, учасника Першої Експедиції Братства до Аппалачії у 2103 році. Архіви суперечливі: за одними даними він повернувся, за іншими — залишився там назавжди. Айверна, навпаки, прагне миру й технологічного поступу, навіть попри війну з НКР. Вона відмовляється від ненависті діда й виступає за мирні угоди, навіть з рейдерами — у прагненні довести, що шляхом співіснування можна досягти більшого."

BOS_advisor_contest_name_17: "Лицар Корбін"
BOS_advisor_contest_advisor_17_desc: "Контроль над великими територіями — логістичне пекло. Після низки атак на постачання до аванпосту поблизу Ірвайна, Корбін опинився без ресурсів. Замість безглуздої оборони він перейшов у наступ: зібрав усе, що зміг, і розпочав рейдерську війну. Його дії, хоч і вважалися негідними Братства, стали ефективним прикладом асиметричної війни: невелика мобільна група здатна перемогти будь-якого ворога."

BOS_advisor_contest_name_18: "Паладин Робертс"
BOS_advisor_contest_advisor_18_desc: "Істинний патріот Братства, Паладин Робертс з юних років служив у Ордені Щита. Згодом йому доручили командування Фортом Бастіон — форпостом на кордоні. Після поранення в бою з рейдерами він повернувся до Лост-Гілз, де нині служить радником Ради Старійшин."

BOS_advisor_contest_name_19: "Писар Рейєс"
BOS_advisor_contest_advisor_19_desc: "Писарка Анджела Рейєс — досвідчена розвідниця Братства та експерт з навігації у Пустці. Вихована в бункері Лост-Гілз, вона завжди прагнула більшого, ніж монотонне життя під землею. Почавши з посади новачка у розвідувальній мережі, згодом вона стала ефективним координатором шпигунів, контрабандистів та торговців. Її досвід в організації постачання по найвіддаленіших куточках зробив її фахівцем з логістики в умовах, де інші зазнають краху."

BOS_advisor_contest_name_20: "Писарка Врі IV"
BOS_advisor_contest_advisor_20_desc: "Писарка Врі IV походить зі славного роду писарів Братства, відомих розробкою та вдосконаленням енергетичної зброї, що часом перевершувала навіть довоєнні зразки. Попри високі очікування, Врі довела, що перевершує своїх попередників, демонструючи виняткову майстерність у роботі з технологіями Старого Світу. З нею в раді — можна очікувати нові зразки енергозброї швидше, ніж будь-коли."

BOS_advisor_contest_name_21: "Паладин Ворік"
BOS_advisor_contest_advisor_21_desc: "Живе втілення дисципліни, Паладин Ворік — старої школи офіцер Братства. Його жорстка позиція щодо сторонніх та надмірна суворість зробили його непопулярним, але водночас ефективним. Відомий серед солдатів як «Вимий ще раз, Ворік» за свою одержимість чистотою та обслуговуванням обладнання."

BOS_advisor_contest_name_22: "Писар Гарді"
BOS_advisor_contest_advisor_22_desc: "Писар Вілбур вважає себе щасливчиком. Після того, як він став єдиним уцілілим зі свого загону під час першої місії, доля привела його до покинутої дослідницької станції, де зберігалася інформація про серійне виробництво силової броні. Коли рятувальники знайшли його, він тримав у руках сумку з кресленнями Старого Світу й усміхався до вух. Тепер він присвятив себе відтворенню цих прототипів."

BOS_advisor_contest_name_23: "Ромбус IV"
BOS_advisor_contest_advisor_23_desc: "Кажуть, що він — четвертий у роду великого Ромбуса. Але через відсутність достовірних записів у Кодексі після зустрічі його предка з Мандрівником із Сховища, його походження викликає сумніви в Раді Старійшин. Незважаючи на це, Ромбус IV прагне обійняти посади Головного Паладина і Лицаря Лост-Гілз. Строгий, мовчазний і безкомпромісний, він довів свою цінність у тактичному плануванні та на передовій."

BOS_advisor_contest_name_24: "Писар Маркус “Кривавий” Харт"
BOS_advisor_contest_advisor_24_desc: "Маркус народився в Лост-Гілз у родині писарів. У віці одинадцяти дізнався, що його батьків убили в Пустці відчайдушні рейдери. Для більшості це стало підтвердженням необхідності ізоляції. Але Маркус, навпаки, відчув співчуття до тих, хто змушений чинити зло задля виживання. Його ідеї неодноразово викликали дисциплінарні стягнення, а прізвисько — алюзія на «м’яке серце» й його розбитий ніс після сутички з офіцером."

BOS_advisor_contest_name_25: "Лицарка Кора"
BOS_advisor_contest_advisor_25_desc: "Кора відрізнялась лідерськими якостями ще серед новобранців. Її харизма могла роззброїти навіть Паладина. Вона не просто командир — вона натхненник. Часто працювала з новачками, допомагаючи їм адаптуватися, і виступала проти надмірної суворості правил Братства. Під час патрулів вона ділилася водою та їжею з нужденними, намагаючись принести хоч краплю людяності в цей світ."

BOS_advisor_contest_name_26: "Лицар Адам Сайкс"
BOS_advisor_contest_advisor_26_desc: "Старший Лицар Адам Сайкс служить у Братстві вже кілька поколінь. Ще будучи учнем, очолив торгову експедицію в землі Нової Каліфорнії та повернувся з низкою інновацій, що вплинули на всю індустрію. Зараз він керує економічними дослідженнями й розвитком виробництва Лост-Гілз."

BOS_advisor_contest_name_27: "Писар Гамільтон"
BOS_advisor_contest_advisor_27_desc: "Мандруючи між осередками Братства по всій Пустці, Гамільтон здобув унікальне розуміння силової броні. Від оптимізації деталей до додавання нових модифікацій — його досвід неоціненний. Хоча його неприязнь до ізоляціонізму робить його непопулярним, його знання — беззаперечні."

BOS_advisor_contest_name_28: "Писар Гатчінсон"
BOS_advisor_contest_advisor_28_desc:0 "\"Я писар, а не солдат!\" — саме так часто можна почути від Гатчінсона, вихованого в затишку бункера Лост-Гілз. Його спеціалізація — щоденне лікування незначних хвороб і застосування довоєнних медичних процедур, недоступних більшості Пустки (окрім хіба що Вольт-Сіті). У Лост-Гілз він відомий як м’яко кажучи, бунтар, що виступає за інтеграцію Зовнішніх до лав Братства. Через це його не включили до жодної експедиції на Схід. Але як головний спеціаліст з медицини, він є незамінним для підтримання здоров’я й довголіття мешканців Лост-Гілз."









