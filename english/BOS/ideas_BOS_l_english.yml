brotherhood_elder_conflicts: "Конфлікти зі Старійшинами"
brotherhood_elder_conflicts_desc: "Ця держава має давню історію протистояння зі старійшинами Лост-Гілз. Через це не варто очікувати допомоги з їхнього боку найближчим часом."

brotherhood_chaotic_conflicts: "Хаотичні Конфлікти"
brotherhood_chaotic_conflicts_desc: "Хаос, у який занурено [ROOT.GetName], суттєво ускладнює передачу допомоги з боку інших осередків Братства!"

bos_civilian_distrust: "«Ті прокляті бляшанки!»"
bos_civilian_distrust_desc: "Війна між НКР і Братством залишила глибоку недовіру серед мешканців Великої НКР щодо правління Братства. І хоч це не лише їхня провина, Лост-Гілз дійсно здебільшого ігнорували гуманітарні потреби 'цивільних, вірних ворогу' в ході того конфлікту."

bos_brotherhood_of_steel_idea: "Гордість Сталі"

bos_army_confusion_4: "Лицарська Дезорганізація"
