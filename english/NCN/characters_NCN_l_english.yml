l_english:
  NCN_daniel_cultural_advisor_desc:0 "Відданий місіонер, Даніель володіє даром мов племен Юти, а його терпіння принесло йому велику прихильність серед племінних народів і торговців Пустки. Чудовий кандидат для ведення перемовин між народами та караванами."

  NCN_joshua_graham_army_chief_desc:0 "Колись талановитий перекладач і щирий мормон, Грем потрапив у погане товариство, перебуваючи далеко від дому. Але часи змінились — і Джошуа повернувся додому."

  NCN_abraham_name:0 "Авраам Горрес"
  NCN_abraham_cultural_advisor_desc:0 "Посланий місіонером до племені в Аризоні, його народ було вирізано Легіоном. Утікаючи до Ханаану, він на власні очі побачив, що таке міць Цезаря. Знаючи, що одного дня вони прийдуть і по Новий Ханаан, він присвятив життя поширенню Божого слова — якщо потрібно, то й силою."

  NCN_matthew_name:0 "Матвій Ґрін"
  NCN_matthew_cultural_advisor_desc:0 "Миролюбний чоловік, Матвій Ґрін був відданим слугою Господа. Посланий до Ірів для послаблення напруження між мормонами й католиками, він зміг укласти союз. Після повернення до Ханаану він став повним пацифістом, упевнившись, що воля Господа — це мир."
  peace_mission:0 "Мирна Місія"

  NCN_waking_cloud_name:0 "Тая, Що Прокинулась"
  NCN_waking_cloud_cultural_advisor_desc:0 "Племінна навернена з народу Скорботних, Тая стала однією з перших, кого навернув Даніель. Як повитуха, вона щиро дбає про свій народ і культуру, водночас перейнявши віру мормонів."

  NCN_dweller_eugene_name:0 "Поселенець Юджин"
  NCN_dweller_eugene_cultural_advisor_desc:0 ""

  NCN_dweller_alex_name:0 "Поселенка Алекс"
  NCN_dweller_alex_economic_advisor_desc:0 ""

  NCN_aaron_name:0 "Аарон Ґрант"
  NCN_aaron_economic_advisor_desc:0 "Головний зброяр Нового Ханаану, Аарон де-факто виконує обов’язки квартирмейстера. Фахівець з пістолетів калібру .45, він виготовляє майже всю зброю, що використовується нашими захисниками."

  NCN_eden_name:0 "Еден Дент"
  NCN_eden_economic_advisor_desc:0 "Обдарована стратегиня, одна з найкращих у Ханаані. Хоча сама є мормонкою, вона не поділяє політику насильницького навернення 'менш освічених' племен, вважаючи її маніпуляцією, а не спасінням."

  NCN_gideon_name:0 "Гедеон Мейвотер"
  NCN_gideon_high_command_desc:0 "Експерт з тактики та підготовки, Гедеон навчає армію Ханаану. Однак він відмовляється тренувати іноземців чи племінних — побоюючись, що ті можуть використати ці знання проти нас."

  NCN_mountain_hawk_name:0 "Гірський Яструб"
  NCN_mountain_hawk_high_command_desc:0 "Старійшина Мертвих Коней, Яструб ділиться мудрістю свого народу. Хоч він насторожено ставиться до Ханаану, пам’ятаючи, як місіонери знищували племена, віку своєму він не здався й залишився грізним."

  NCN_rushing_wind_name:0 "Поспішний Вітер"
  NCN_rushing_wind_high_command_desc:0 "Колишній Тарський Ходач, він нині — повноправний громадянин і палкий мормон. Символ того, що кожен може прийняти волю Божу та змінити своє життя."

  NCN_joel_name:0 "Йоел Гарніґан"
  NCN_joel_high_command_desc:0 "Йоел — священник, який вірить, що Ханаан вже є святою землею. Він не бажає розширення, що забирає життя Божих людей. Захищати Ханаан — ось його місія."

  NCN_david_name:0 "Давид Торін"
  NCN_david_high_command_desc:0 "Колишній Пустельний Рейнджер, Давид приєднався до Ханаану, щоб навчати місцевих тактиці рейнджерів. Йому не одразу довіряли, але згодом він довів свою вірність."

  NCN_wallace_name:0 "Воллес Реґдан"
  NCN_wallace_navy_chief_desc:0 "Людина моря, Воллес мріє, що колись Велике Солоне Озеро стане морським шляхом так само важливим, як дороги Ханаану."

  NCN_sariah_name:0 "Сарія Джун"
  NCN_sariah_air_chief_desc:0 "Сарія, побожна мормонка, з дитинства марила небом. Вона не була 'традиційною' жінкою свого народу, і з моменту повноліття присвятила себе створенню повітряних сил Нового Ханаану."

  NCN_jackson_name:0 "Джексон"