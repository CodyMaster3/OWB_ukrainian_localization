l_english:
nf_arroyo.0.t:0 "Пошук Сховища 13"
nf_arroyo.0.d:0 "Обранець вирушив з Арройо сам-один, на зустріч майже нездоланній битві з ворожими пустками. Вони знали лише одне: село гине, і тільки таїна сховищ може врятувати їхній народ.\n\nДорога до сусідніх сховищ — через Шейді-Сендс, Місто Сховищ і Кламат — була сповнена небезпек. Та кожна з них навчила Обранця…"
nf_arroyo.0.a:0 "Що вірний друг — найкращий захист." 
nf_arroyo.0.b:0 "Що велика рушниця, або палиця, значно полегшують життя."
nf_arroyo.0.c:0 "Що повна торба кришок вирішує багато питань."

nf_arroyo.1.t:0 "Прибуття до Священного 13"
nf_arroyo.1.d:0 "Після тривалої мандрівки через Каліфорнію Обранець нарешті досяг Сховища 13. Те, що він там знайшов, було несподіваним: домівка пращурів, тепер заселена розумними, але приязними кігтями смерті. Вони були значно могутнішими за Обранця та його можливих супутників, і GECK ховався за їхніми спинами. Обранець змушений був піти на співпрацю, бодай часткову.\n\nУсередині сховища він відкрив незвичну рівновагу. Нащадки мешканців 13-го жили разом із кігтями смерті, створивши квітучу спільноту. Та найбільше вразило Обранця те, як..."
nf_arroyo.1.a:0 "Люди зі Сховища 13 змогли залагодити свої упередження, прийнявши нових побратимів."
nf_arroyo.1.b:0 "Страх досі панував серед кігтів смерті — особливо перед одним, на ім’я доктор Шребер."
nf_arroyo.1.c:0 "Плем’я жило в ладі, кожен знав своє місце та обов’язок."

nf_arroyo.2.t:0 "Обличчя Велетнів"
nf_arroyo.2.d:0 "Коли здавалося, що перемога вже близько, Обранця вразило видіння, наслане племінним цілителем Хакунином. Людей Арройо було викрадено вояками на залізних птахах і забрано в напрямку моря. Завдання Обранця — врятувати народ — стало буквальним: полон у Застави означав неминучу загибель.\n\nШукаючи відповіді, Обранець натрапив на кілька перспективних слідів, найважливіший з яких вів до..."
nf_arroyo.2.a:0 "Імператора Ши — довоєнного китайського суперкомп’ютера, здатного передбачити всі можливі наслідки."
nf_arroyo.2.b:0 "Військової бази Наварро — міцного, але не неприступного форпосту Застави."
nf_arroyo.2.c:0 "Наркотиків Нового Ріно, що дали відвагу в час сумнівів."

nf_arroyo.3.t:0 "Обрання Провідника"
nf_arroyo.3.d:0 "Настав час обрати Голову Ради. Він або вона керуватимуть протягом року, стежачи за рішеннями Ради. Також ця особа стане обличчям племені, і її поведінка надихне або застережить нас усіх."
nf_arroyo.3.a:0 "Нагор, смиренний воїн, очолить Раду."
nf_arroyo.3.b:0 "Чітса — ясний вибір для проводу Ради."
nf_arroyo.3.c:0 "Димитрій доведе, що чужинець може бути вартим довіри."
nf_arroyo.3.e:0 "Обранець знову веде нас!"

nf_arroyo.4.t:0 "Зникнення в Ніч"
nf_arroyo.4.d:0 "Цього ранку в повітрі відчувався неспокій. Люди Арройо прокинулися у мовчазному сум’ятті — бракувало знайомої присутності. Лише надвечір ми наважились вимовити це вголос.\n\nОбранець пішов у пустку.\n\nЗалишились нотатки та записи, схожі на ті, що залишив колись їхній дід. Більшість спорядження взято з собою, разом зі старим Дороговказом. Оголошено час скорботи. Всі рішення віднині — в руках Ради. Але на цей перехідний період слід обрати нового Провідника, що поведе і Раду, і плем’я в нову добу."
nf_arroyo.4.a:0 "Наш Обранець... пішов"

nf_arroyo.5.t:0 "Народжений у Сан-Франциско, навчений Послідовниками"
nf_arroyo.5.d:0 "Викрадення жителів Арройо руками Застави забрало з собою й Хакунина, нашого цілителя. Попри всі зусилля, плем’я довго не могло знайти гідної заміни. Учнів він не мав, знань залишив небагато. Дехто мав навички, але не досвід старого.\n\nНадія з’явилася, коли купці розповіли про колишнього Послідовника, що оселився серед Пакувальників. Обранець вирушив до Щасливого Табору, щоби запросити його. Там вони знайшли Димитрія — лікаря з Сан-Франциско. Він покинув Послідовників через неприйняття насильства. Мандрував північчю, допомагаючи за плату. Про Арройо чув, та не був певен, чи настав його час оселитися.\n\nЗнаючи, що Арройо потребує його знань, Обранець..."
nf_arroyo.5.a:0 "Звернувся до його серця, благаючи про допомогу племені."
nf_arroyo.5.b:0 "Нагадав, що пустка небезпечна, і нещастя часто спіткає самотніх мандрівників."
nf_arroyo.5.c:0 "Запропонував винагороду й безпеку — чесну угоду."

# nf_arroyo.6 — Історія Чітси
nf_arroyo.6.t:0 "Інша Кров"
nf_arroyo.6.d:0 "Після знищення Нафтової Платформи Обранцем, уцілілі зі Сховища 13 оселилися в Арройо. У наступні роки народилось чимало дітей, серед них — дівчинка на ім’я Чітса. У ранньому дитинстві панувала здорова суперечка між дітьми племені та дітьми Сховища, і Чітса швидко стала хитрою провідницею ігор та вдаваних битв.\n\nОбранець помітив її ще в ранні літа, спостерігаючи, як вона перетворюється з ватажка серед однолітків на майстриню перемовин, здатну виторгувати угоди навіть у найбільш впертих торгівців. Її кмітливість і харизма робили з неї природжену радницю племені. Спостерігаючи за її шляхом від дитини до гордої жінки, Обранець відчував гордість за прийдешнє покоління Арройо. Особливо радів, що вона має..."
nf_arroyo.6.a:0 "Дар до провідництва."
nf_arroyo.6.b:0 "Ненаситну жагу до влади."
nf_arroyo.6.c:0 "Кмітливість і блискавичний розум."

# nf_arroyo.7 — Історія Нагора
nf_arroyo.7.t:0 "Боязкий Початок"
nf_arroyo.7.d:0 "Нагор був наймолодшим кузеном Обранця. Попри міцне тіло й пряму поставу, не мав хоробрості свого родича. Його пес Дим став єдиним справжнім товаришем у дитинстві. Над ним глузували за несміливість, але він ніколи не відповідав, хоч і міг би з легкістю дати відсіч.\n\nТа прибуття Застави змінило все. Хто чинив опір — загинув, а Нагор міг лише спостерігати. У полоні його вдача змінилась. Він почав гартувати себе, безупинно тренувався і дражнив охоронців. Коли Обранець побачив його на нафтовій платформі, він ледь упізнав свого мовчазного родича — перед ним був лютий та нещадний чоловік.\n\nПісля втечі з полону Нагор повернувся до Арройо й частково повернув колишню сутність, та дух битви не полишив його. Схвильований, він прийшов до Обранця по пораду. Обранець..."
nf_arroyo.7.a:0 "Порадив йому пам’ятати про людяність і вдаватися до сили лише в крайньому разі."
nf_arroyo.7.b:0 "Застеріг, що пустка не знає жалю, а вбивство — іноді єдиний шлях."
nf_arroyo.7.c:0 "Сказав, що вибір — його. Життя — теж його."

# nf_arroyo.8 — Макс Сек
nf_arroyo.8.t:0 "Вирок: Макс Сек"
nf_arroyo.8.d:0 "Північна Каліфорнія змінилася від часів пригод Обранця. Тридцять років тому лише Шейді Сендс та Місто Сховищ мали тюрми чи варту. В інших місцях злодія били, а злочини тяжчі карались рушницею.\n\nВтручання Макс Сек змінило цей порядок. Їхній спосіб дії простий: каравани вирушають у сусідні поселення, питаючи про непотрібних злочинців. За кожного, хто має «доказ вини», дається винагорода. Далі караван повертається до Горнбрука з «здобиччю», й нових в’язнів використовують на важких роботах. Продукція — від рідкісних мінералів до перепаяних схем — розходиться по інших землях, приносячи Макс Сек чималий зиск.\n\nТа цей прибуток тримається на жахливих умовах: ув’язнених ледве годують, а навіть найзагартованіші не можуть витримати погляду варти Макс Сек."
nf_arroyo.8.a:0 "Люди злі, так. Але чи варті вони такого життя?"
nf_arroyo.8.b:0 "Потрібно прагнути виправлення, де це можливо."
nf_arroyo.8.c:0 "Нагадує мені старі часи кайданників на рейках."
nf_arroyo.8.e:0 "Може, ще й у біговому колесі хай побігають?"
nf_arroyo.8.f:0 "Хитре рішення складної проблеми."

# nf_arroyo.9 — Пакувальники
nf_arroyo.9.t:0 "Тихі Люди"
nf_arroyo.9.d:0 "Спершу вони були тінями — мисливці, що жили в лісах, не привертаючи уваги. Та змінилось усе після того, як один заблукалий купець побачив, як двадцять мисливців разом здолали трьох кігтів смерті. Його історія дійшла до Арройо й ширилась мов вогонь.\n\nОбранцеві було нелегко знайти цих відлюдьків, та зрештою він вийшов на їхній табір. Зустріли його насторожено, але без ворожнечі. Так він дізнався, що вони звуть себе «Пакувальники». Упевнившись, що вони не загроза, Обранець вивчав їхню культуру та звичаї."
nf_arroyo.9.a:0 "Мудрий народ. Живуть у згоді з землею, а не висмоктують її."
nf_arroyo.9.b:0 "Майстерні мисливці. Але доля їх лякає. Може, ми зможемо допомогти."
nf_arroyo.9.c:0 "Дикі варвари! Я покажу їм, що таке справжня цивілізація."
nf_arroyo.9.e:0 "Вони відлюдники зі страху? Ну, я підсилю цей страх!"
nf_arroyo.9.f:0 "Їхній племінний лад їм пасує."

# nf_arroyo.10 — Еврека
nf_arroyo.10.t:0 "Гільзи замість насіння"
nf_arroyo.10.d:0 "Еврека була нічим не примітна за часів мандрів Обранця. Тонучи в міралурках, горстка вцілілих вирішила повернути пращурську домівку. І їм це вдалося. Ведені елітною групою «Портмайстри», вони вирішили скористатися своїм військовим досвідом не вдома, а за його межами.\n\nЗемля їхня — гориста й марна. Фермерством там не проживеш. Тож вони торгують найманцями, обмінюючи зброю і кров на харчі й кришки. На щастя, їм бракує людей і бажання стати імперією. Війна для них — ремесло виживання."
nf_arroyo.10.a:0 "Найманці Евреки приносять прибуток на її береги."
nf_arroyo.10.b:0 "Майстерень майже нема, але якось справляються."
nf_arroyo.10.c:0 "Добре, що міралурки не дали їм розплодитись."
nf_arroyo.10.e:0 "Вони могли втекти... але обрали століття різні."
nf_arroyo.10.f:0 "Вони — виживальники. І цим усе сказано."

nf_arroyo.11.t:0 "Забуття Старих Шляхів"
nf_arroyo.11.d:0 "Сулик колись мандрував пусткою з Обранцем у пошуках GECK. Хоча його вже немає серед живих, його син Ав'юрон тепер очолює плем’я Умбра. Навчений батьком і самим Обранцем, Ав'юрон відвернув своє плем’я від давніх духовних звичаїв. Замість цього він обрав шлях відкриттів і осілого життя, започаткувавши арройське будівництво для свого народу.\nПопри спротив, особливо з боку покоління Сулика, більшість умбрійців прийняли зміни."
nf_arroyo.11.a:0 "Вони роблять сміливий крок у нову добу — і це на краще."
nf_arroyo.11.b:0 "Вірю, що вони не забудуть традицій, ідучи вперед."
nf_arroyo.11.c:0 "Цим дикунам краще швидше забути минуле — з них вийдуть гарні раби."
nf_arroyo.11.e:0 "На мою пораду найнижчі з племені вже працюють до кісток."
nf_arroyo.11.f:0 "Шлях Ав'юрона — цікаве сплетіння традиції та цивілізації. Надихає."

nf_arroyo.12.t:0 "Шляхи Арройо"
nf_arroyo.12.d:0 "GECK урятував Арройо від загибелі, і Обранець наказав звести дороги в пустку. Збудовані нашвидкуруч задля торгівлі, ці шляхи почали занепадати. Вони були вузькими з початку, а тепер ще й заростають дикою природою. Нині ще придатні для наявної торгівлі, але подальше зростання вимагатиме відновлення та розширення.\nЧітса пообіцяла очолити відбудову, та тепер мусить обрати, як набрати люд силу. Вища платня забезпечить підтримку, але жорсткі методи пришвидшать справу, хай і коштом життів. Можна й залишити все, як є — хай працює, як вийде."
nf_arroyo.12.a:0 "Краще бути страшною, ніж улюбленою — але чому не бути обома?"
nf_arroyo.12.b:0 "Нехай працюють до кісток, а варта витисне решту."
nf_arroyo.12.c:0 "Ми вже розробили достатньо планів."

nf_arroyo.13.t:0 "Будівництво Веселиків"
nf_arroyo.13.d:0 "Веселики добре впорались із зведенням шкіл і майстерень по всій землі. Їхні проєкти розумно сплановані — можна швидко змінити призначення споруди. Завершивши поточну роботу, вони вже рушають далі. Лишилось тільки вирішити, як саме використати нову будівлю."
nf_arroyo.13.a:0 "Арройо зростає..."
nf_arroyo.13.b:0 "Арройо потребує допомоги для свого люду."
nf_arroyo.13.c:0 "Наші воїни мусять зрівнятися з ворогом."

nf_arroyo.14.t:0 "Втеча з Макс Сек"
nf_arroyo.14.d:0 "Сьогодні зранку з Горнбрука надійшли тривожні вісті від інформатора Чітси. Декілька ночей тому в Макс Сек сталася масова втеча. Значна частина ув’язнених зникла в пустці. Місцева влада намагається приховати подію, але джерела вказують, що ватажком бунту був Віггс — супермутант, колишній боєць армії Майстра, а згодом розбійник.\n\nПоки Макс Сек полює на втікачів, наш обов’язок — захист племені. Самих лише укріплень буде замало. Потрібно діяти."
nf_arroyo.14.a:0 "Найгірші злочинці Західного Узбережжя — всі разом, під одним дахом..."

nf_arroyo.15.t:0 "Повстання Дідусів"
nf_arroyo.15.d:0 "Ав'юрон невпинно прагнув модернізувати плем’я Умбра. Попри загальну підтримку, частина релігійних старійшин відмовилась прийняти зміни. Минулого тижня збройне повстання почалося у східному Кербі: старі воїни й шамани вигнали звідти вірних Ав'юрону.\n\nХоча до громадянської війни ще не дійшло, східні землі дедалі більш відокремлені, а невдача Ав'юрона втримати там владу робить конфлікт майже неминучим. Він звернувся до Ради Арройо по допомогу."
nf_arroyo.15.a:0 "На диво озброєні, як на зграйку старих дідів."

nf_arroyo.16.t:0 "Логістика Чітси"
nf_arroyo.16.d:0 "Схована від Обранця, таємниця Чітси як керівниці торгівлі крилась у перемовинах і підкилимних оборудках. Вона домовилась із бандитами, що грабували купців на південь від Арройо: замість того, щоби нападати на арройських торгівців, вони мали грабувати тих, хто їде з Лігва до Кламату. За це вони отримували щедру щорічну плату.\n\nОдним махом Чітса усунула Кламат як торгового суперника та дала Арройо розквітнути. Домовленість триває вже роки, але нещодавно Чітса переглянула її умови. У таємному листі до Дорріса вона виклала нові вимоги..."
nf_arroyo.16.a:0 "Грабуйте тільки багатіїв — більше нічого не треба."
nf_arroyo.16.b:0 "Сидіть тихо й далі. Працює ж, і добре."
nf_arroyo.16.c:0 "Більше здобичі! Ще надто багато йдуть на північ."

nf_arroyo.17.t:0 "До Праці"
nf_arroyo.17.d:0 "Арройо сильно змінилось за час відсутності Обранця. Чітса, Нагор і Димитрій кожен залишили свій слід у долі племені, тоді як заворушення в сусідніх землях перетворили колись напівусамітнене поселення на силу регіонального масштабу."
nf_arroyo.17.da:0 "Робота Димитрія була найвражаючішою."
nf_arroyo.17.db:0 "Робота Димитрія була найвражаючішою."
nf_arroyo.17.dc:0 "Робота Димитрія була найвражаючішою."
nf_arroyo.17.ca:0 "Чітса довела свою проникливість."
nf_arroyo.17.cb:0 "Чітса довела свою проникливість."
nf_arroyo.17.cc:0 "Чітса довела свою проникливість."
nf_arroyo.17.na:0 "Нагор зумів зберегти Арройо в безпеці."
nf_arroyo.17.nb:0 "Нагор зумів зберегти Арройо в безпеці."
nf_arroyo.17.nc:0 "Нагор зумів зберегти Арройо в безпеці."

nf_arroyo.18.t:0 "Полонені Перетинають Кордон"
nf_arroyo.18.d:0 "Спроби начальника Макс Сек впіймати втікачів лише підштовхнули їх до втечі з території. Рано вранці кілька поранених офіцерів Макс Сек, переслідувані групою втікачів, перетнули кордон Арройо. Наша прикордонна варта зчинила короткий бій, та більшість полонених зникли на наших землях. Тепер маємо обрати, як діяти, спираючись на погляди трьох провідників. Димитрій прагне скористатися пораненими офіцерами, Чітса запропонувала екстрений план із затримання втікачів, а Нагор наполягає на нових заходах безпеки й значному збільшенні військового фінансування."
nf_arroyo.18.da:0 "Переміг Димитрій. Офіцерів повністю вилікували і відправили додому."
nf_arroyo.18.db:0 "Димитрій залікував рани офіцерів і відпустив їх."
nf_arroyo.18.dc:0 "Поєднання психо та бафаута від Димитрія змусило офіцерів кинутись у бій на втікачів."
nf_arroyo.18.ca:0 "Чітса запропонувала амністію в обмін на цінну інформацію."
nf_arroyo.18.cb:0 "Здорові тіла втікачів стали добрими працівниками."
nf_arroyo.18.cc:0 "За наказом Чітси полонених схопили і повісили на кордоні."
nf_arroyo.18.na:0 "Нагор скерував фінанси на охорону кордону, аби уникнути повторення."
nf_arroyo.18.nb:0 "Нагор доклав усіх зусиль, щоби Макс Сек мав усе необхідне."
nf_arroyo.18.nc:0 "Зміцнивши армію, Нагор розробив план вторгнення."

nf_arroyo.19.t:0 "Небезпека Поряд"
nf_arroyo.19.d:0 "Розвідники Арройо, що діяли на землях Макс Сек, змушені були тікати, коли до них наблизився вартовий робот. Схоже, він вийшов з ладу або був зламаний і тепер прямує до територій Арройо. Попри те, що він самотній, його броня і ракетниця роблять його майже невразливим до атак розвідників."
nf_arroyo.19.da:0 "Експерти Димитрія з робототехніки змогли вимкнути його."
nf_arroyo.19.db:0 "Експерти Димитрія перепрограмували робота для полювання на небезпечних в’язнів."
nf_arroyo.19.dc:0 "Фахівці Димитрія перенаправили робота і ретельно задокументували хаос."
nf_arroyo.19.ca:0 "Розуміючи потребу у співпраці, Чітса об'єднала зусилля з Макс Сек проти робота."
nf_arroyo.19.cb:0 "Чітса розставила приманки й відволікаючі об’єкти, щоби змінити його маршрут."
nf_arroyo.19.cc:0 "Чітса знає: кожен має ціну. Дехто — ціну самопожертви в атаці на бойового робота."
nf_arroyo.19.na:0 "Нагор особисто повів загін за межі кордону, щоб знищити машину."
nf_arroyo.19.nb:0 "Нагор наказав розвідникам вивести робота з ладу."
nf_arroyo.19.nc:0 "Нагор дозволив роботу шаленствувати й використав час, аби скликати ополчення."

nf_arroyo.20.t:0 "Король Ґеконів Показується"
nf_arroyo.20.d:0 ""
nf_arroyo.20.a:0 ""

nf_arroyo.21.t:0 "Новини з Евреки"
nf_arroyo.21.da:0 "Жителі Арройо були шоковані, дізнавшись про потужний вибух, що струсонув порт Евреки вчора. Більшість вважала це місце стабільним, більше зайнятим найманцями, ніж внутрішніми конфліктами. Вибух трапився в самому серці порту, вбивши багатьох рибалок, які саме повертались із моря. Оскільки море є основним джерелом їжі, цей вибух — навряд чи нещасний випадок. Це — ворожий акт."
nf_arroyo.21.db:0 "Останні кілька місяців Рада Арройо активно обговорює питання Евреки, і нарешті настав час визначити наші відносини. У цих розмовах часто звучить жаль: затиснута між нами і НКР, Еврека — не та доля, яку хтось бажає. Проте ми можемо запропонувати їм справедливу угоду — вартість якої буде частина їхньої незалежності. Якщо вони стануть нашим підданим, то зможуть зберегти свій простий спосіб життя без страху вторгнення. Усе, що треба — переконати їх. На жаль, наші останні розширення підірвали довіру з боку Портмайстрів."
nf_arroyo.21.dc:0 "Жителі Евреки вважали, що часи міралурків — гірше не буває. Та нині, під владою окупантів, вони благають про нову раду Портмайстрів.\n\nВтім, ці благання досі залишаються без відповіді."
nf_arroyo.21.a:0 "Хто ж це міг зробити?"
nf_arroyo.21.b:0 "Це на користь обом сторонам."
nf_arroyo.21.c:0 "Добре, що це не ми."

nf_arroyo.22.t:0 "Під Новим Керівництвом"
nf_arroyo.22.d:0 "Сьогодні на торгових заставах О'Браєна з’явилися нові знаки. Старий стяг, що майорів на церковному шпилі, зник. Чотири кольори, чотири шляхи — розтанули з першим промінням сонця.\n\nНатомість жовта 13-ка тепер сповіщає: ви на землі Арройо."
nf_arroyo.22.a:0 "Якщо це в наших інтересах — значить, і вам підійде."

nf_arroyo.23.t:0 "Бухта Евреки — Поради Подорожнім"
nf_arroyo.23.d:0 "Не знаю, що коїться в Еврецi, але вона під якимсь прокляттям. На вулицях — одні наркомани, торговці та знову наркомани. Місто схоже на сірий, похмурий робітничий хутір, де часом трапляються химерні вікторіанські будівлі, загублені серед мотлоху північної Каліфорнії. Я ледве дочекався, щоб поїхати. Єдине, на що сподіваюсь — щоб Друга Велика Війна хоча б трохи покращила умови життя в цьому місці.\n\n— Щоденник Мандрівника Пусткою, том 3"
nf_arroyo.23.a:0 "Звучить весело!"

nf_arroyo.24.t:0 "Злет Банди Вуза"
nf_arroyo.24.d:0 "Донині втікачі з тюрем Макс Сек були, м’яко кажучи, неорганізовані. Хоч іноді групи з п’яти-десяти осіб діяли разом, вони були так само схильні нападати одне на одного, як і на охоронців, що намагалися їх спіймати.\n\nВтім, поява Вуза та його банди змінила розклад сил. Вуз — величезний, зловісний супермутант — разом із кількома побратимами почав вербувати дрібні бандитські зграї. Спершу це не викликало тривоги, адже їхній табір був ізольованим, захованим у лісах. Але вчора вночі банда Вуза атакувала і знищила укріплений аванпост Макс Сек. І все вказує на те, що вони не зупиняться: поволі просуваються до головної тюремної будівлі. Через терміновість ситуації рішення має ухвалити обраний провідник Ради."
nf_arroyo.24.da:0 "Димитрій заразив людських вояків Вуза шлунковою хворобою, знерухомивши їх."
nf_arroyo.24.db:0 "Димитрій вирішив, що спершу слід зібрати більше інформації."
nf_arroyo.24.dc:0 "Смертельна зараза серед вояків Вуза допоможе роботам Макс Сек."
nf_arroyo.24.ca:0 "Допомога Макс Сек буде дорогою, але Чітса вважала це найкращим варіантом."
nf_arroyo.24.cb:0 "Чітса вдалася до таємних диверсій і вбивств, щоби послабити банду Вуза."
nf_arroyo.24.cc:0 "Надихаючий і здібний лідер? Саме такого Чітса прагнула бачити на чолі Макс Сек."
nf_arroyo.24.na:0 "Загроза була очевидною. Нагор скликав армію й рушив проти банди Вуза."
nf_arroyo.24.nb:0 "Нагор зосередив війська й чекав слушної миті для удару."
nf_arroyo.24.nc:0 "Нагор терпляче чекав, поки Вуз нападe на Макс Сек. Лише тоді він ударив."

nf_arroyo.25.ta:0 "Чия Земля? Вуза!"
nf_arroyo.25.tb:0 "Останній Опір Вуза"
nf_arroyo.25.da:0 "Військо Вуза розгромило захисників Макс Сек. Незважаючи на зусилля охоронців і невеликого ополчення, що хотіло покласти край його терору, банда без труднощів прорвала їхні рубежі. Вуз проголосив усіх решту в’язнів вільними й узяв їх під свою опіку. Сусіди Макс Сек охоплені страхом, а колишні союзники втекли до Каліфорнії та Невади, рятуючись від тюремного божевілля. Кожного, хто був пов’язаний із попереднім режимом або просто підозрюваний у цьому, страчують полчища розлючених злочинців."
nf_arroyo.25.db:0 "Здавалося, Вуз майже переміг, але його банда була розбита елітною охороною Макс Сек. Сам Вуз загинув від атак асолтронів, а решта армії зламалась перед натиском контратаки. В’язнів, які здались, повернули до важкої праці, а тих, хто опирався, вбили без жалю. Дехто все ще переховується, але падіння Вуза означає кінець серйозних заворушень у Макс Сек.\n\nТа ця історія відкрила очі Раді Арройо. Хоч криза минула, стало ясно — Макс Сек тримається на нитці. Ми більше не можемо спокійно дивитись, як ця система руйнується сама."
nf_arroyo.25.a:0 "Дике варварство..."
nf_arroyo.25.b:0 "Наслідки завжди найнебезпечніші."

nf_arroyo.26.t:0 "Афера Макс Сек"
nf_arroyo.26.da:0 "Спершу ніхто й чути не хотів. Ні Димитрій, ні Нагор не довіряли Макс Сек, а вже супермутанту-бандиту — й поготів.\n\nТа Чітса не здавалася. Завдяки обіцянкам, переконанням і зібраним даним, вона зуміла схилити обох до свого плану. Вуз, за всією бравадою, мав задатки лідера. Чітса вважала: кожен справжній лідер вміє бачити і свої вади, і слабкості ворога. Вуз правив новою нацією убивць і божевільних, кожен з яких хотів його місце. Він тримався лише доти, доки вдавалось їх стримувати. Чітса запропонувала йому угоду: якщо Вуз погодиться діяти разом із армією Арройо і дозволить кільком важливим біженцям втекти, вона забезпечить його табір провізією та врожаями."
nf_arroyo.26.db:0 "Вуз, за всією бравадою, мав задатки лідера. Чітса вважала: кожен справжній лідер вміє бачити і свої вади, і слабкості ворога. Вуз правив новою нацією убивць і божевільних, кожен з яких хотів його місце. Він тримався лише доти, доки вдавалось їх стримувати. Чітса запропонувала йому угоду: якщо Вуз погодиться діяти разом із армією Арройо і дозволить кільком важливим біженцям втекти, вона забезпечить його табір провізією та врожаями."
nf_arroyo.26.a:0 "Побачимо, що він відповість..."
nf_arroyo.26.b:0 "Додаймо до вимог ще й захоплену зброю."
nf_arroyo.26.c:0 "У них повно нових полонених. Ми подбаємо про них."
nf_arroyo.26.best:0 "Наша позиція достатньо сильна, щоби тиснути далі."

nf_arroyo.27.t:0 "Проблема Вуза"
nf_arroyo.27.d:0 "Гурти вбивць і злочинців — не найкращі сусіди. Вуз поки що зайнятий грабунком руїн Макс Сек, та ніхто не сумнівається — скоро він обернеться до нас. Із кожним новим злочином зростає певність: війна неминуча. Та ми маємо мережу впливу в Макс Сек і важелі тиску на колишніх посадовців. Якщо застосуємо достатньо впливу й примусу, зможемо залучити рештки їхніх сил на свій бік."
nf_arroyo.27.a:0 "Гаяти часу не можна. Маємо вдарити першими."
nf_arroyo.27.b:0 "На щастя, чимало їхніх роботів і зброї ще у справному стані."
nf_arroyo.27.c:0 "Біженці з Макс Сек із радістю візьмуться до зброї."
nf_arroyo.27.best:0 "Майже повний контроль над Макс Сек — ось наша запорука перемоги."

nf_arroyo.28.t:0 "Арройо Пропонує Угоду"
nf_arroyo.28.d:0 "Ми таки вчудили. Начальника й решту давно вже нема, лишилось домовлятись із Арройо. Здавалось, буде війна, та один із їхніх провідників, Чітса, запропонувала щось інше. Якщо ми воюємо, коли вони скажуть, вони гарантують нашу владу. Виглядає трохи як слабкість, але насправді — не так уже й погано. Питання лише в тому: більше здобудемо битвою чи словами?"
nf_arroyo.28.a:0 "Домовились! Принаймні, поки що."
nf_arroyo.28.b:0 "Ха! Домовлятися? Ніколи!"

nf_arroyo.29.t:0 "Вуз Приймає"
nf_arroyo.29.d:0 "Як і передбачала Чітса, Вуз погодився. Домовленість залишиться таємною, принаймні поки що, та він уже зміцнює свою владу над населенням Макс Сек. Вуз — жорстокий провідник, і багато хто засудить Арройо за співпрацю з ним. Та реальність змусила Чітсу діяти, і завдяки її хитрості війни вдалося уникнути."
nf_arroyo.29.a:0 "Оце місяць видався…"

nf_arroyo.30.t:0 "Розправа з Понівеченою Тюрмою"
nf_arroyo.30.d:0 "Більшість утікачів було вбито одразу. Лідерів повстання спіймали й повісили на мурах в'язниці. Вуз мертвий, його банда розсіяна. Та попри всі заяви адміністрації Макс Сек про повернення до нормальності, насправді держава-в’язниця зазнала незворотного удару.\n\nМи наполегливо працювали під час кризи, щоб схилити населення й еліти Макс Сек на бік Арройо. Настав час діяти. Хоча вторгнення може здаватися надмірним, Макс Сек занадто нестабільний, щоб існувати самостійно. З достатнім примусом ми можемо змусити тюрму здатися без бою. Або ж наш вплив призведе до того, що мешканці самі відвернуться від своїх правителів. У будь-якому випадку армія Арройо вирушить до перемоги."
nf_arroyo.30.a:0 "Щоб забезпечити мир, потрібне військове підкорення."
nf_arroyo.30.b:0 "Тюрма може зберегти формальну незалежність, а ми отримаємо зиск із праці її мешканців."
nf_arroyo.30.c:0 "Ті еліти Макс Сек, що досі не втекли до нас, не встоять перед нашою армією."
nf_arroyo.30.best:0 "Рішучі дії дадуть нам контроль над працею й багатством тюрми."

nf_arroyo.31.t:0 "Камінь за Каменем"
nf_arroyo.31.d:0 "Без сумніву, частину своєї величі в’язниця завдячувала Старому Світові. Хоч багони-браміни й вклали чимало в її охорону, основа споруди стояла ще з часів двохсотрічної давнини, коли люди подібного ґатунку будували її з тією ж метою.\n\nПоки армія Арройо тиснула оборонців Макс Сек до самих мурів, облоги самої в’язниці уникали обидві сторони, не бажаючи повторного бунту. Коли поразка стала очевидною, Макс Сек здався. Тепер Раді Арройо довелося вирішувати, що робити з ув’язненими.\n\nЗдавалося логічним передати тюрму під нагляд і залишити її функції. Вона була опорою економіки Макс Сек, і ризик бунту здавався меншим, якщо вона слугуватиме Арройо. Та ризик усе ж був. Дехто вважав, що краще просто закрити тюрму, а в’язнів — або стратити, або повернути до громад."
nf_arroyo.31.a:0 "Зиск переважає ризики. В’язні підуть до праці."
nf_arroyo.31.b:0 "Таке мислення й призвело до першого повстання."

nf_arroyo.32.t:0 "Друге Повстання в Макс Сек"
nf_arroyo.32.d:0 "Історія повторюється.\n\nГлибокої ночі група в'язнів Макс Сек зважилася на зухвалу втечу. Використовуючи динаміт і крадену зброю, вони прорвалися крізь браму й розсипались у темряві. Зараз триває зачистка, але після жахів попереднього бунту це лиш гірчить усім, хто тоді постраждав. У самому Арройо вже вибухнули протести й заворушення через провал управління тюрмою. Навіть якщо в’язнів повернуть, майже всі погоджуються — експеримент Макс Сек завершено."
nf_arroyo.32.a:0 "Це виставляє нас у кепському світлі, чи не так?"

nf_arroyo.33.t:0 "Благання Ав'юрона"
nf_arroyo.33.d:0 "Втрата контролю в Кербі змусила Ав'юрона звернутися до Ради Арройо. Спершу він вагався, остерігаючись, що відхід Обранця означає нову ізоляцію племені. Та Рада сама розвіяла його страхи.\n\nЧітса, Димитрій і Нагор одностайно підтримали бажання Ав'юрона модернізувати Умбру, попри спротив. Нагор виступив найпристрасніше, заявивши, що Арройо й Умбра будуть єдині, як колись Сулик і Обранець. Димитрій визнав важливість роботи Ав'юрона, особливо його зусиль щодо створення клінік і медичної освіти. Чітса погодилася, та впродовж засідання зберігала хитрий вигляд. Після короткого обговорення Рада розійшлася на вечір."
nf_arroyo.33.a:0 "Авжеж ми прийдемо на допомогу!"
nf_arroyo.33.b:0 "Арройо допоможе сусіду... не безкоштовно."

nf_arroyo.34.t:0 "План Чітси"
nf_arroyo.34.d:0 "Чітса першою зустрілася з Ав'юроном після завершення ради. Її план був досить простим: Умбра дозволяє Нагору та армії Арройо створити постійні бази на своїй землі. Це дало б Арройо сильніший контроль над регіоном, але водночас і принесе вигоди самому Ав'юрону. Та Чітсу турбувало, що такий план може бути занадто відвертим. Якщо Ав'юрон занадто швидко насторожиться, подальші угоди стануть набагато складнішими."
nf_arroyo.34.a:0 "Попри вагання, Чітса озвучила свій план."
nf_arroyo.34.b:0 "Чітса обмежилася дружніми жестами... наразі."

nf_arroyo.35.t:0 "План Чітси"
nf_arroyo.35.d:0 "Чітса першою зустрілася з Ав'юроном після завершення ради. Її план був досить простим: Умбра дозволяє Нагору та армії Арройо створити постійні бази на своїй землі. Це дало б Арройо сильніший контроль над регіоном, але водночас і принесло вигоди самому Ав'юрону."
nf_arroyo.35.a:0 "Прийняти — єдино розумний вибір."
nf_arroyo.35.b:0 "Ав'юрон категорично відхилив її пропозицію."

nf_arroyo.36.t:0 "Варіанти Димитрія"
nf_arroyo.36.d:0 "Ав'юрона здивувала пропозиція Димитрія. Замість жорсткого придушення традиціоналістів, той запропонував кампанію з освіти населення Умбри. Хоч затяті племінники будуть проти, більшість, як він вважав, сприйме це позитивно. І якщо молодь навчиться — не матиме значення, чи схвалює це старійшина. Якщо більшість народу, особливо молоді, буде освічена, то ні технологію, ні промисловість вже не вдасться зупинити."
nf_arroyo.36.a:0 "Ось він, наш шлях."
nf_arroyo.36.b:0 "Ні, треба діяти силою."

nf_arroyo.37.t:0 "Злет Дощових Парі"
nf_arroyo.37.d:0 "Кукурудза з часів Обранця була основною культурою Арройо. Плем’я завжди прагнуло самодостатності, але родючі ґрунти й нові знання в сільському господарстві спричинили справжній вибух урожайності. В останні роки Арройо навіть почав експортувати врожай, отримуючи прибуток іззовні. Та з добробутом прийшли й спекуляції — і дощові парі захопили багатьох мешканців села.\n\nСуть проста. Людина або група, що зветься «арбітрами», утримує бари в громаді. Селяни приходять туди й купують «картки ставок». Кожна така картка охоплює певний діапазон очікуваної кількості дощу, причому кількість карток на кожен діапазон обмежена. Люди можуть купувати картки одне в одного, влаштовуючи навіть справжні торги за найвигідніші варіанти. Наприкінці сезону виграші розподіляються з усього пулу ставок, а арбітри беруть собі частку.\n\nРозквіт дощових барів упродовж останніх місяців стривожив Димитрія. Він не мав нічого проти безпечного азарту, та зростання вартості карток призвело до хвилі крадіжок і пограбувань. Його освіта добре давала йому розуміння небезпеки лудоманії, і він дедалі більше прагнув навести порядок. Утім, дощові парі вже стали частиною сільського побуту, і будь-яке обмеження може викликати обурення серед фермерів."
nf_arroyo.37.a:0 "Конфіскувати бари й ставки."
nf_arroyo.37.b:0 "Обкласти картки податком."
nf_arroyo.37.c:0 "Нехай усе лишається, як є."

nf_arroyo.38.t:0 "Демонстрація Волі"
nf_arroyo.38.d:0 "Ці старі намагались перекреслити все, за що боролися Обранець і Сулик. Вони запевняли, що шанують предків, а самі ж плюють їм у душу. І в саму душу Обранця також. Нагор не міг цього стерпіти. І не стерпить. Він готовий працювати з Ав'юроном, та, можливо, краще буде вдарити безпосередньо по ворогу — хай навіть Ав'юрон не погодиться."
nf_arroyo.38.a:0 "Його гнів вирвався назовні — наказано саботаж."
nf_arroyo.38.b:0 "Він знав, що має діяти з Ав'юроном, а не всупереч йому."

nf_arroyo.39.t:0 "Удар по Сучасності!"
nf_arroyo.39.d:0 "Їхні крики й глузування долинали ще до появи. Цей загін нальотчиків Умбри спершу здався торгівцям просто дивиною.\n\nЩо вони тут роблять?\n\nЧи належать до тих заколотників?\n\nЦі питання швидко розвіялись — лишився лише жах, коли рейдери кинулися на караван."
nf_arroyo.39.a:0 "Наволоч!"

nf_arroyo.40.t:0 "На Ав'юрона Нападають!"
nf_arroyo.40.d:0 "Звичайне племінне зібрання було раптово перерване — нападник зі сокирою, вигукуючи ритуальні молитви, кинувся просто в коло старійшин. Без охорони, без зброї, все виглядало похмуро. Але..."
nf_arroyo.40.a:0 "Хтось із делегації Арройо збив нападника з ніг."
nf_arroyo.40.b:0 "Несподівано втрутився Обранець... і так само зник."

nf_arroyo.41.t:0 "Дідусь Фіґліф Висуває Вимоги"
nf_arroyo.41.d:0 "Рух проти модернізації у східній Умбрі досі не мав єдиного провідника — аж поки не виринув дідусь Фіґліф, старійшина ще з часів Сулика. Він висунув до Ав'юрона й ради десять вимог, серед яких: його відставка, повна відмова від індустріалізації та більша автономія Сходу. Ав'юрон погодився на деякі дрібниці, але основні вимоги відкинув. У відповідь Фіґліф оголосив себе ватажком «Східної Умбри» — автономної частини племені."
nf_arroyo.41.a:0 "Надіслати більше припасів Ав'юрону. Він потребує підтримки."
nf_arroyo.41.b:0 "Зміцнити присутність на кордоні. І пильнувати уважно."

nf_arroyo.42.t:0 "Ав'юрон Готується до Війни"
nf_arroyo.42.d:0 "Заява дідуся Фіґліфа внесла ясність: війна неминуча. Ав'юрон розумів, що має кілька тижнів, поки східняки не піднімуть відкритий бунт. Розчарований, що мир більше не варіант, він знову звернувся до Ради Арройо. Армія під проводом Нагора мала два варіанти: спільні дії з військом Умбри або ж власні навчання на півночі Східної Умбри — з загрозою удару з двох боків."
nf_arroyo.42.a:0 "Спільний план — найрозумніше рішення."
nf_arroyo.42.b:0 "Арройо має стояти самостійно."

nf_arroyo.43.t:0 "Перший Удар"
nf_arroyo.43.d:0 "Війна вже на порозі, і Рада Арройо має вирішити, як її розпочати. Найпростіше — дочекатись нападу ворога й відповісти у відповідь. Такий варіант дасть зрозуміле виправдання для конфлікту, проте є небезпека, що повстанці нападуть несподівано, й отримають перевагу в перші дні війни. Можна завдати попереджувального удару, та пояснити це Ав'юрону буде непросто — той досі сподівається на мир. Є й третій шлях: якщо спровокувати або інсценувати атаку повстанців у ключовому місці, то війну можна буде подати як оборонну — і водночас зберегти ініціативу."
nf_arroyo.43.da:0 "Використаємо час на накопичення екстрених припасів."
nf_arroyo.43.db:0 "Точковий удар по їхніх командирах дасть добрий результат."
nf_arroyo.43.dc:0 "Спроба повстанців створити вибухівку скінчиться катастрофою."
nf_arroyo.43.ca:0 "Зведемо укріплення. Вони самі ввійдуть у пастку."
nf_arroyo.43.cb:0 "Племінники чи ні, зброя їм потрібна. А в Чітси вже був план…"
nf_arroyo.43.cc:0 "Загиблі охоронці Ав'юрона дадуть потрібний привід."
nf_arroyo.43.na:0 "Нагор тісно координуватиме дії з Ав'юроном."
nf_arroyo.43.nb:0 "Офіцери Арройо очолять війська Умбри в цьому конфлікті."
nf_arroyo.43.nc:0 "Караван знайдуть роздертим — справа рук повстанців."

nf_arroyo.44.t:0 "Настає День"
nf_arroyo.44.d:0 "Найгірші передчуття Ав'юрона справдилися. З самого початку він розумів, що таке можливе — але вперто вірив, що зуміє переконати свій народ.\n\nВін не зміг.\n\nВоїни діда Фіґліфа хлинули через кордон, вимагаючи повернення кістки Ґремпі як символу влади, смерті Ав'юрона та відмови від усього сучасного. Арройо, дотримуючись обіцянки, втручається в обороні Умбри. Війна прийшла в Умбру."
nf_arroyo.44.a:0 "Ми дотримаємося союзу!"
nf_arroyo.44.b:0 "За ці місяці ми навчилися вчитись."
nf_arroyo.44.c:0 "Війська Умбри будуть під нашим прямим командуванням."
nf_arroyo.44.best:0 "Ми готувались ретельно. Перемога — наша."

nf_arroyo.45.t:0 "Повстання Придушене"
nf_arroyo.45.d:0 "Повстання Дідусів, що тримало у страху плем’я Умбра майже пів року, нарешті завершилось. Сьогодні залишки воїнів здались об'єднаним силам Арройо й Умбри. Дід Фіґліф утік за кордон Пекерів, а лишені без лідера традиціоналісти визнали поразку. Тепер належить вирішити, якою буде доля східних земель. Союз із Арройо тепер незворотний, і Умбра опинилася під його захистом. Тому рішення належить Раді: чи вирубати ліси для промисловості, чи зберегти їх як шлях для постачання у майбутніх конфліктах півднем."
nf_arroyo.45.a:0 "Передусім — індустріалізація."
nf_arroyo.45.b:0 "Треба передбачити майбутню експансію."

nf_arroyo.46.t:0 "Хлопець і Його Пес"
nf_arroyo.46.d:0 "Дехто вважав дивним, що Нагор кожного пса називає Дим. Для більшості це не мало значення. Було видно, як Нагор любить свого Дима, хай навіть той міг бути вже четвертим чи п’ятим поспіль. Чітса й ще кілька людей шепотіли, що все то через дитячу травму — нібито Нагор так намагається спокутувати втрату першого Дима.\n\nТа насправді таке мислення не було справедливим. Бо для Нагора Дим — це не просто черговий собака. Це — одна свідомість, що переходить із покоління в покоління. Саме тому, коли Дим старів, чи зазнавав поранень на полюванні, чи страждав від радіації — Нагор не впадав у розпач. Йому, звісно, було сумно, бачити страждання друга. Але він завжди знав: скоро він знову знайде Дима.\n\nЄдине, чого Нагор по-справжньому боявся — це те, в якому вигляді він його знайде наступного разу."
nf_arroyo.46.a:0 "Хто тут гарний хлопчик?"

nf_arroyo.47.t:0 "Дитячі Ігри"
nf_arroyo.47.d:0 "Чітса вирішила, що наївність — це чарівно. Надія, її найближча подруга в дитинстві, мала її вдосталь. Точніше — Чітса вирішила сподіватися, що наївність — це чарівно. Інакше їй би не було виправдання, чому вона так багато часу витратила на ту ідіотку.\n\nЇх представили як родичок — то двоюрідних, то троюрідних. На той час батьки Надії залишили сховище, і їй потрібна була нова родина. Через кілька років Чітса дізналась, що служба безпеки знайшла під підлогою в їхньому помешканні. Та коли вони познайомились, у Чітси були інші проблеми: Надія була просто напрочуд дурна. Вона не була тугодумом, як Нагор, і не позбавлена здорового глузду, як Димитрій. Вона просто була... ідіоткою.\n\nСпочатку Чітса проклинала свою долю. Їй випало товаришувати з безнадійною дурепою. Та з часом почала розуміти: можливо, Надія — то прихована благодать. Бо ж усі знали, що Надія дурна. Мало хто її любив. Тож завжди було зручно, коли треба, спихнути провину на неї. Надія, хоч і не в захваті, розуміла: краще бути другом Чітси, ніж ворогом.\n\nХоча... минуло вже чимало часу. А що ж з нею сталося?"
nf_arroyo.47.a:0 "До простіших часів…"

nf_arroyo.48.t:0 "Його Перший Пацієнт"
nf_arroyo.48.d:0 "Час від часу Димитрій згадував свого першого пацієнта. Тоді він ще не був справжнім лікарем — лише учнем. Досвідчений достатньо, щоб самостійно призначити лікування, але ще занадто зелений, щоби приймати пацієнтів наодинці.\n\nЧоловік розповів, що його побили головорізи у провулку неподалік від дому. Шоковані, Димитрій і його наставник обробили рани, дали знеболювальне й відпустили додому. Та Димитрій був обурений. Він хотів негайно повідомити про напад, але наставник переконав його утриматися, мовляв, його справа — лікувати, а справедливість — то вже інша робота.\n\nНавіть через роки ця відповідь лютувала Димитрія. Як таке можна було сприймати як норму? Як можна спокійно покладатися на те, що «хтось інший» зробить правильне? Чи ж не це — лікувати симптоми, ігноруючи причину?\n\nДимитрій знав, що не всі Послідовники мислять так, як його наставник. Але той день похитнув його віру в організацію, яка його навчила, і саме тоді він ступив на нинішній шлях.\n\nЗверхність Послідовників може стати їхнім крахом. Але він не дозволить, щоби це стало і його крахом."
nf_arroyo.48.a:0 "Ще один день — ще один крок уперед."

nf_arroyo.49.t:0 "Мандрівний Розум Обранця"
nf_arroyo.49.d:0 "Під час своєї відсутності Обранець побував у далеких краях і побачив нові грані Пустки, якою колись уже блукав десятки років тому. Його погляд на світ давно затверднів, ще від попередньої подорожі дикими землями Каліфорнії.\n\nНіхто достеменно не знав, у які південні землі подався цей літній мандрівник, але одне було очевидним — трава там була не зеленіша. І тепер усе залежало від того, чи залишився Обранець вірним собі: чи переможе надія, чи ж у його серці оселиться застій і гнів."
nf_arroyo.49.a:0 "Він став добрим."
nf_arroyo.49.b:0 "Він залишився незмінним."
nf_arroyo.49.c:0 "Він став жорстоким."

nf_arroyo.50.t:0 "Полум’я Лизнуло Небо"
nf_arroyo.50.d:0 "Учора багато мешканців нашого села вперше зустрілися з лісовими людьми — Пекерами. Сьогодні вони прокинулися й побачили вогонь, що здіймався з лісу на південь. Більшість вирішила, що це жахлива випадковість.\n\nКоли з того боку підійшов невеликий загін, наші люди зустріли його з ковдрами, їжею та водою — думали, це біженці з пожежі.\n\nСвідки розповіли, що саме тоді й почалася різанина.\n\nМи досі не знаємо, що спричинило вогонь, і чому Пекери раптом напали на нас. Але відомо одне — ситуація вийшла за межі звичайних набігів. Бої охопили майже всі громади на межі з лісом."
nf_arroyo.50.a:0 "Пекери... нападають?"

nf_arroyo.51.t:0 "Друїд Судного Дня"
nf_arroyo.51.d:0 "Його промови не варто переказувати дослівно. Годинами він голосив про кінець часів, що почався з палаючого лісу. Це перший подібний проповідник, якого ми побачили, але, мабуть, не останній. З одного боку, зробити з нього приклад — правильне рішення. Його вчення, без сумніву, підбурило воїнів Пекерів. Та є й інший шлях — мирний. Якщо переконати його перейти на наш бік, він зможе запевнити інших Пекерів, що ми не винні у вогні."
nf_arroyo.51.a:0 "Покарати його за роль у лихові!"
nf_arroyo.51.b:0 "Маємо діяти розважливо."

nf_arroyo.52.t:0 "Наслідки Війни"
nf_arroyo.52.d:0 "Після важкої кампанії ми нарешті взяли землі Пекерів під контроль. Та перемога — гірка. Ми не хотіли цієї війни. І хоча повністю залишити територію тепер — нереально, бо це дасть ворогу змогу перегрупуватись, — навіть полонені мовчать про причини нападу. Так само мовчать і цивільні, яких ми знайшли в таборах.\n\nЩоб не допустити нової війни й розкрити істинні причини трагедії, необхідне глибоке розслідування. \n\nБо десь у найтемніших закутках душ членів Ради — живе думка: можна ж просто знищити їх усіх."
nf_arroyo.52.a:0 "Таємниця…"

nf_arroyo.53.t:0 "Війна Спалахує Знову"
nf_arroyo.53.da:0 "Звістки про напади молодих Пекерів на наші гарнізони засвідчили: розслідування провалилось. Ми не змогли цілком зрозуміти ситуацію — і війна спалахнула вдруге.\n\nЄдине, що нас трохи втішає — це буде односторонній конфлікт. Досвідчені воїни Пекерів загинули в першій війні, а наші карти знищили їхню перевагу в знанні лісу. Цей конфлікт може уповільнити Арройо, але Пекери він, скоріше за все, знищить назавжди."
nf_arroyo.53.db:0 "Новини з колишніх земель Пекерів дедалі обнадійливіші. Недовіра поволі відступає, поступаючись місцем стриманому прийняттю наших солдатів і лікарів. Наші дипломатичні кроки до вождів племені також приносять плоди. Впливові Пекери погодились визнати ліс частиною Арройо — якщо ми поважатимемо їхню незалежність і свободу пересування.\n\nСтрах нової війни, що висів над нами від моменту окупації, нарешті відходить у минуле."
nf_arroyo.53.a:0 "Чому вони не здаються?"
nf_arroyo.53.b:0 "Нарешті все скінчилося."
nf_arroyo.53.c:0 "Це — перемога."

nf_arroyo.54.t:0 "Безглузде Вбивство"
nf_arroyo.54.d:0 "Зрештою, вони знали — іншого шляху немає. Як би ми не намагалися, Пекери відмовлялись навіть зустрічатися з представниками Арройо, не кажучи вже про перемовини. За останні місяці з їхнього боку зростала агресія — наші патрулі знаходили докази тренувальних таборів і спалених споруд по всій території.\n\nВибору не було. Якщо ми хотіли уникнути другої війни, потрібно було позбавити Пекерів здатності воювати. Це означало вбивати. Вбивати, доки вони не втечуть. Спричинити масову кризу біженців, яка спустошить край, відкривши його для поселенців Арройо. І врешті-решт, Рада була одностайна. Пекери самі це накликали."
nf_arroyo.54.a:0 "…"
nf_arroyo.54.b:0 "Має ж бути інший шлях!"

nf_arroyo.55.t:0 "Пошуки на Полях Битв"
nf_arroyo.55.d:0 "Підрозділи армії, відряджені на огляд бойових зон, зробили кілька неочікуваних відкриттів. Передусім, стало зрозуміло: майже кожен загін Пекерів мав при собі друїда — командира загону. Невідомо, чи обирали їх за військовий хист, чи за фанатичну відданість, але їхнє розташування в тилу засвідчує повагу з боку воїнів.\n\nЦе, мабуть, усе, що нам вдасться витягти з цих полів. Та наші розвідники помітили, що в регіоні досі діють малі бойові групи. Можна наказати вистежити їх — можливо, це вбереже нас від нових загроз. Але гарантій немає."
nf_arroyo.55.a:0 "Ми використаємо це, щоби зрозуміти їх."
nf_arroyo.55.c:0 "Ми використаємо це, щоби підкорити їх."
nf_arroyo.55.b:0 "Пошуки мусять тривати!"

nf_arroyo.56.t:0 "Знайдено Схрон Зброї!"
nf_arroyo.56.d:0 "Серія сутичок із партизанами Пекерів зрештою привела наші сили до невеликого сховку зброї глибоко в лісі. Хоч ворогам і вдалося втекти, вилучення цього арсеналу завдало удару по їхніх можливостях. Це не та перемога, на яку ми сподівались, але наразі й цього достатньо."
nf_arroyo.56.a:0 "Принаймні, не дарма старались."

nf_arroyo.57.t:0 "Смерть Лікаря"
nf_arroyo.57.d:0 "Чітса завжди бачила Димитрія таким, яким він був: вигнанцем, чужаком, невдахою, якого підібрав відчайдушний Обранець. А тепер він стояв на шляху до її влади. Його плани постійно підривали її авторитет, відтягуючи ресурси на якісь безглузді проєкти. Але вже завтра — ні.\n\nПсихічно нестабільний чоловік навідає Димитрія ввечері, сховавши ніж у підкладці. Він нападе несподівано й утече. Через місяць його знайдуть мертвим при дорозі. Начебто — самогубство.\n\nЧітса спланувала все до дрібниць."
nf_arroyo.57.a:0 "Зроби це."
nf_arroyo.57.b:0 "Це... неправильно."

nf_arroyo.58.t:0 "На Його Місце"
nf_arroyo.58.d:0 "Військові знання Нагора безцінні, особливо для невеликої нації. Його служба протягом десятиліть вберегла Арройо від загарбників, і за це народ його поважає. Але в Раді він лише заважав Чітсі. Його популярність робила його небезпечним, а посада голови армії — невразливим для змов. Натомість, Чітса могла б переконати його зосередитись лише на армії. Це ризиковано, але хоча б тимчасово усуне його з політики. Збоку все виглядатиме як переворот. Та з належною підтримкою й обережною згодою Нагора, люди можуть це прийняти."
nf_arroyo.58.a:0 "Покажи йому його місце."
nf_arroyo.58.b:0 "У нього ще є користь."

nf_arroyo.59.t:0 "Звіт про Допит /#21"
nf_arroyo.59.d:0 "Допити йшли мляво — бракувало зосередженості. Під час війни полонених ворогів розмістили в таборах біля Грантс-Пасс. Варти привезли з Макс Сек, але були здивовані: жодних спроб утечі. В’язні сиділи понурі, мовчазні, споживали їжу без ентузіазму. Рідко спілкувались навіть між собою. Допити стали незграбним фарсом. Наші офіцери досі не вирішили: тиснути чи апелювати до ностальгії? Вибір підходу визначить, що ми зможемо дізнатись."
nf_arroyo.59.a:0 "Запропонувати амністію."
nf_arroyo.59.b:0 "Погрожувати насильством."

nf_arroyo.60.t:0 "Звіт про Допит /#146"
nf_arroyo.60.d:0 "Виявилось непросто пробитися крізь отупілий стан в’язнів. Спершу ми думали, що це навчений захист — техніка проти тортур. Але, вступивши з ними в контакт, з’ясували: реальність зовсім інша.\n\nЦі воїни переконані, що здача в полон — святотатство. Ті, хто здається, будуть покарані духами лісу. Племінне марення, але воно міцно вкорінене. Джерело — група друїдів. Ми маємо дослідити їх глибше."
nf_arroyo.60.a:0 "Нарешті прорив!"

nf_arroyo.61.t:0 "Серця й Розуми"
nf_arroyo.61.d:0 "Місцеві Пекери майже не розмовляють із нашими гарнізонами. Ці громади завжди були замкнені, а спустошення лише посилило їхню відособленість. Усі носять талісмани, полюють, збирають, доглядають лісові домівки. Пошук правди — справа тонка. Ми досі не знаємо, що стало причиною нападу, чи походження полум’я, яке бачили того ранку. Варіантів дій — безліч."
nf_arroyo.61.da:0 "Дати ліки — і завоювати довіру."
nf_arroyo.61.db:0 "Нехай я подумаю... як образно це подати…"
nf_arroyo.61.dc:0 "Допомога — тільки в обмін на інформацію."
nf_arroyo.61.ca:0 "Все має свою ціну."
nf_arroyo.61.cb:0 "Проникнути в їхні громади."
nf_arroyo.61.cc:0 "Нічні викрадення дадуть відповідь."
nf_arroyo.61.na:0 "Ми друзі, не солдати."
nf_arroyo.61.nb:0 "Вербувати місцевих до армії."
nf_arroyo.61.nc:0 "Армія змусить їх говорити!"

nf_arroyo.62.t:0 "Невдоволення"
nf_arroyo.62.d:0 "Арройо — це рай, зрощений чудом GECK'а і працею його народу. Ми в безпеці. У нас — достаток. То чому, питають люди, ми постійно розширюємось?\n\nСпочатку все було зрозуміло. Ми допомагали союзникам. Та з часом мета стала розмитою. Щодня важче виправдати війни та експансію. І щодня ми загрузаємо в них ще глибше, мов у вир, який затягує далі й далі від дому."
nf_arroyo.62.a:0 "Нічого вже не змінити."

nf_arroyo.63.t:0 "Розкриття Правди"
nf_arroyo.63.d:0 "Це було нелегко, але нам вдалося повністю розкрити істину про суспільство Пекерів. Їхні, здавалося б, безпечні напівкочові громади насправді контролювались елітним колом друїдів. Ці друїди керували лісовим віровченням, що проникло в кожен аспект життя племені, перетворивши природно усамітнених людей на релігійних фанатиків. Їхня племінна релігія начебто проповідувала шанобливе ставлення до природи, але насправді була знаряддям для зміцнення влади верхівки.\n\nПрихід Дідуся Фіґліфа змінив їхню мету. Він уже мав тісні зв’язки з багатьма друїдами і з часом переконав їх, що Арройо становить загрозу для їхньої влади. У ніч перед нападом мала група підпалила ліс на півночі [182.GetName]. Упродовж наступних годин внутрішнє коло видало одностайну заяву: винен Арройо. А далі історію ви вже знаєте."
nf_arroyo.63.a:0 "Хто б міг подумати…"
nf_arroyo.63.b:0 "А втім, деякі їхні ідеї були слушними."

nf_arroyo.64.t:0 "Пристрій Димитрія"
nf_arroyo.64.da:0 "Димитрій посміхнувся, підкидаючи в руках холодну металеву коробку. Для стороннього це була лише химерна штуковина з кнопками й перемикачами. Але для Димитрія — втілення багаторічної праці. Ідея виникла ще в Геппі Кемпі, серед Пекерів. Відтоді він без упину її вдосконалював, експериментуючи не лише з пристроєм, а й довкіллям.\n\nЗважаючи на нинішню ситуацію, він сподівався використати пристрій у самому лісі, що його породив. Пожежа знищила значну частину півночі [182.GetName], і хаос травмував психіку Пекерів. Пристрій міг допомогти лісу відродитися, ставши жестом доброї волі, — або, якщо налаштувати його інакше, спричинити неконтрольоване розростання, яке б задушило поселення і знищило все на шляху."
nf_arroyo.64.db:0 "Пристрій здається простим, але ховає в собі пастки. Його механізми, залишені добрим лікарем, стали предметом досліджень учених Арройо. Під час випробувань із землі відразу почали пробиватися ліани й коріння — пристрій довелося негайно зупинити. Але навіщо ж його створено?"
nf_arroyo.64.a:0 "Для тих, хто потребує."
nf_arroyo.64.b:0 "Здається, він нам знадобиться."
nf_arroyo.64.c:0 "Хочуть лісу? Тоді хай отримають!"
nf_arroyo.64.e:0 "Він не залишив пояснень…"

nf_arroyo.65.t:0 "Баламкливий Старий"
nf_arroyo.65.d:0 "Туристи з Нью-Рено відкрили для себе нову диковинку. Старий, що називав себе Дідусь Фіґліф, вбраний у племінний одяг і обвішаний кістяними амулетами, оселився на вуличному розі в центрі міста. Вигукуючи про занепад цивілізації, він іноді збирав навколо себе натовп.\n\nАж поки одного дня наркоман не знайшов його мертвим на купі сміття, з кривавим плямами під сорочкою."
nf_arroyo.65.a:0 "І що з того?"

nf_arroyo.66.t:0 "Знову Вигнанець"
nf_arroyo.66.d:0 "Нагор ніколи не довіряв чужинцям. То чому ж він допустив Димитрія до Ради? Треба було краще знати: не впускати чоловіка з далекого півдня в саме серце Арройо. Що б той не казав, він не заслуговує довіри. Треба діяти. Хоча Димитрія й поважають, небагато хто встане на захист його вигнання. Тим більше — армія під контролем Нагора. Візит до дому Димитрія з відповідним «наголосом» мав пояснити йому його місце."
nf_arroyo.66.a:0 "Час його відіслати."
nf_arroyo.66.b:0 "Можливо, Нагор помилився…"

nf_arroyo.67.t:0 "Усі Погляди — на Чотиривуззя"
nf_arroyo.67.d:0 "Поки НКР бере на себе роль справжньої Каліфорнійської Республіки, Арройо зміцнює владу в південному Орегоні. Обидві держави дивляться на [FOU.GetName] як на джерело торговельної вигоди. Цей вузол доріг, де сходяться шляхи з Орегону в Каліфорнію, забезпечує відпочинок мандрівникам — не безкоштовно, звісно. Попри своє багатство, [FOU.GetName] розривається між могутньою [NCR.GetName] на півдні й новою силою — [ARR.GetName] — на півночі."
nf_arroyo.67.a:0 "[ROOT.GetName] переможе!"

nf_arroyo.68.t:0 "Напад на Чотиривуззя!"
nf_arroyo.68.d:0 "Найкращі зусилля в дипломатії зазнали краху: країна, яку ми хотіли залучити, була жорстоко атакована нашими супротивниками. Хоч це й не той результат, на який ми сподівались, пряма військова відповідь малоймовірна. Багато з наших людей вважають це суперечку надто виснажливою і, можливо, будуть раді, що вона закінчилась. Проте, наша армія в гніві — генерали вже складають плани контратаки."
nf_arroyo.68.a:0 "Ми ще покажемо їм!"

nf_arroyo.69.t:0 "Стартова Стратегія"
nf_arroyo.69.da:0 "Ми повинні підійти до цих перемовин з максимальною обачністю. Слід чітко визначити наші цілі і триматися їх. Якщо будемо надто вимогливими — переговори зірвуться. Якщо надто скромними — втратимо вигоду."
nf_arroyo.69.db:0 "Ми повинні підійти до цих перемовин з максимальною обачністю. Слід чітко визначити наші цілі і триматися їх. Якщо будемо надто вимогливими — переговори зірвуться. Якщо надто скромними — втратимо вигоду.\n\n§GТеплі відносини підвищують наші шанси!§!"
nf_arroyo.69.a:0 "Запропонувати 80/20."
nf_arroyo.69.b:0 "Запропонувати 70/30."
nf_arroyo.69.c:0 "Запропонувати 60/40."
nf_arroyo.69.d:0 "Запропонувати 50/50."

nf_arroyo.70.t:0 "[FROM.GetName] Пропонує Угоду"
nf_arroyo.70.da:0 "[FROM.GetName] запропонувала нам угоду щодо Чотиривуззя:\n\nПакт про ненапад і взаємні гарантії [FOU.GetName].\n\nЦе на певний час вирішить проблему, хоча вона може знову спалахнути."
nf_arroyo.70.db:0 "[FROM.GetName] запропонувала нам угоду щодо Чотиривуззя:\n\nОбидві сторони гарантують безпеку регіону, а ми отримаємо грошову компенсацію.\n\nНеідеально, але дозволить зайнятись важливішими справами."
nf_arroyo.70.dc:0 "[FROM.GetName] запропонувала нам угоду:\n\n[FOU.GetName] стане їхнім васалом, а ми отримаємо грошову компенсацію.\n\nНе найкраща пропозиція, та, можливо, варта завершення цієї гри."
nf_arroyo.70.dd:0 "[FROM.GetName] запропонувала нам угоду:\n\n[FOU.GetName] стане їхнім васалом, а ми — отримаємо невелику компенсацію.\n\nНе вигідно, але, можливо, варто покласти край цій напрузі."
nf_arroyo.70.a:0 "Ми погоджуємось."
nf_arroyo.70.b:0 "Пропонуємо зустрічну пропозицію."
nf_arroyo.70.c:0 "Жодної угоди!"

nf_arroyo.71.t:0 "Перемовини Провалилися"
nf_arroyo.71.d:0 "Попри всі намагання, домовленості щодо Чотиривуззя досягти не вдалось. Наші дипломати повернулися ні з чим, а боротьба за вплив триває."
nf_arroyo.71.a:0 "Наступного разу."

nf_arroyo.72.t:0 "Налагодження Fourways"
nf_arroyo.72.d:0 "Якщо ти бачиш це без консольних команд, напиши у #bug-reports або на reddit"
nf_arroyo.72.a:0 "Гаразд"
nf_arroyo.72.b:0 "40/40 для Арройо"

nf_arroyo.73.t:0 "Угоду Прийнято!"
nf_arroyo.73.d:0 "Мудро вчинивши, [FROM.GetName] погодилась на наші умови. Це велика дипломатична перемога і, можливо, завершення цієї виснажливої справи."
nf_arroyo.73.a:0 "А тепер — до інших питань."

nf_arroyo.74.t:0 "Без Зайвого Галасу"
nf_arroyo.74.d:0 "Чітса зібрала всі розкидані папери в обкладинку і зачинила теку. Вона усміхнулась і передала помічнику сріблясту кришку від пляшки. Хлопець мовчки кивнув і вийшов. Він знав: така кришка — знак добрих вістей для тих, хто стоїть за вмістом папки.\n\nКоли він пішов, Чітса знову відкрила теку, запалила запальничку і підпалила її. Усі плани, звіти — надто компрометуючі. Ніхто не повинен дізнатись, що вона наказала."
nf_arroyo.74.a:0 "Еврика палає."

nf_arroyo.75.t:0 "Еврика Звинувачує Нас!"
nf_arroyo.75.d:0 "Якось так вийшло, що саме народ Арройо став мішенню для звинувачень після бомбардування евриканського порту. Попри всю трагедію, мало хто в Арройо розуміє, чому саме нас зробили винними. Портмайстер Сміт відмовився навіть зустрічатися з Радою Арройо, не кажучи вже про надання доказів цієї нібито змови. Війна видається неминучою, і Рада оголосила: на будь-який прояв сили буде дано відповідь усією міццю Арройо."
nf_arroyo.75.a:0 "Але чому?"

nf_arroyo.76.t:0 "На Домашньому Фронті"
nf_arroyo.76.d:0 "З часу відходу Обранця Арройо безперечно змінилося. Колись ми були єдиним плем’ям, згуртованим навколо нашого спасителя. Тепер же ми стали багатонаціональною спільнотою, що розрослась шляхом впливу або прямого приєднання сусідів. У часи кризи, як нині, нам необхідна об’єднуюча сила, що згуртує народ. На щастя, в цій війні ми явно стали жертвами агресії — це пробудило загальну підтримку. Її можна ще більше посилити, обравши символ опору Евриканській несправедливості."
nf_arroyo.76.da:0 "Прославимо наші медичні здобутки."
nf_arroyo.76.db:0 "Наголосимо на нашій готовності."
nf_arroyo.76.dc:0 "Очорнимо гулів-портмайстрів."
nf_arroyo.76.ca:0 "Стиснімо зуби і битимемось."
nf_arroyo.76.cb:0 "Усе або для Арройо, або проти нього."
nf_arroyo.76.cc:0 "Відмовимося від торгівлі з Еврикою!"
nf_arroyo.76.na:0 "Захистимо дім будь-якою ціною."
nf_arroyo.76.nb:0 "Будьмо готові допомогти нашим арміям."
nf_arroyo.76.nc:0 "Наступатимемо рішуче."

nf_arroyo.77.t:0 "Совість Мучить"
nf_arroyo.77.d:0 "Скільки б вона не намагалась, слова зі звітів агентів не полишали її розуму. Жорстокість, страждання — все це було її рук справа. Вона напала на Еврику. Вона наказала бомбардування. Всі її схеми, плани, інтриги —"
nf_arroyo.77.a:0 "До біса все!"

nf_arroyo.78.t:0 "Пропозиція від Ши"
nf_arroyo.78.d:0 "Не секрет, що природні ресурси Еврики та територій Наварро — надзвичайно важливі для економіки Ши. Тим більше несподіваним виявилось, коли Ши звернулися до нас з пропозицією. Вони справедливо визнали, що ми значно сильніші за Еврику і зможемо розчавити її у разі війни. Тож Ши пропонують використати свій вплив, щоб допомогти нам захопити Еврику — за певну винагороду. Так, Ши однозначно отримають з цього чималий зиск, але й для нас це може бути вигідно."
nf_arroyo.78.a:0 "Заплатимо — в міру."
nf_arroyo.78.b:0 "У нас є зайві кришки…"
nf_arroyo.78.c:0 "Може, вдасться виторгувати краще?"
nf_arroyo.78.no:0 "Жодного сенсу в цій угоді."

nf_arroyo.79.t:0 "Евриканська Армія"
nf_arroyo.79.d:0 "Природа Евриканської армії сильно відрізняється від звичайної. Замість централізованої сили, їхні підрозділи діють як малі автономні загони, здатні самостійно вести бій. Це робить їх ідеальними найманцями, які славляться своєю люттю по всьому Західному Узбережжю. Але з відповідною підготовкою ми можемо обернути цю автономність на їхню слабкість. Або ж можемо зосередитись на встановленні контролю над їхнім цивільним населенням."
nf_arroyo.79.a:0 "Знецінити їхні укріплення."
nf_arroyo.79.b:0 "Підготуватися до їхнього наступу."
nf_arroyo.79.c:0 "Зосередитися на цивільному контролі."

nf_arroyo.80.t:0 "Напруження Зростає"
nf_arroyo.80.d:0 "Звіти шпигунів одностайні. Порти Еврики забиті кораблями й баржами, що везуть найманців додому. На кордоні зводяться окопи та бункери, а все, що вдається знайти місцевим збирачам, негайно спрямовується до армії. Війна наближається, і це знає кожен евриканець. Наша відповідь на цю неспровоковану агресію має бути рішучою."
nf_arroyo.80.da:0 "Зв’язатись із союзними чиновниками Еврики."
nf_arroyo.80.db:0 "Зібрати дані про евриканське військо."
nf_arroyo.80.dc:0 "Випустити на волю гулів-добровольців."
nf_arroyo.80.ca:0 "Запропонувати пільги евриканським переселенцям."
nf_arroyo.80.cb:0 "Саботувати їхні збиральні команди."
nf_arroyo.80.cc:0 "Планувати наступ через Умбру."
nf_arroyo.80.na:0 "Підготувати екстрені оборонні плани."
nf_arroyo.80.nb:0 "Мобілізувати кожну робочу руку."
nf_arroyo.80.nc:0 "Нагору слід замислитись над ударною тактикою."

nf_arroyo.81.t:0 "Останнє Зіткнення"
nf_arroyo.81.d:0 "Фасад обурення Еврики зруйновано. Яку б брехню не розіграв Портмайстер Сміт, вона вилилася у повноцінну війну. Наш народ, хоч і досі не розуміє, чому нас звинувачують, готовий боротися до останнього. Три роки ми будували союзи, поширювали вплив і зміцнювали свої рубежі — все заради безпеки Арройо. І ми не дозволимо цьому пропасти марно."
nf_arroyo.81.a:0 "І знову — війна."
nf_arroyo.81.b:0 "Нам вдалося змінити їхні серця."
nf_arroyo.81.c:0 "Вони знають, що не переможуть."
nf_arroyo.81.best:0 "Згодом історія нас виправдає."

nf_arroyo.82.t:0 "Жест Довіри"
nf_arroyo.82.d:0 "Основне джерело доходу Еврики — Портмайстри, елітні найманці, що працюють за кордоном. Це вправні воїни, але їхня малочисельність ставить їх у небезпеку. Ми можемо надати їм військову допомогу — проте, якщо спалахне війна, це може обернутись проти нас."
nf_arroyo.82.a:0 "Надати розвіддані."
nf_arroyo.82.b:0 "Передати мішки з піском для блокпостів."
nf_arroyo.82.c:0 "Зосередитись на внутрішніх справах."

nf_arroyo.83.t:0 "Будуємо Мости"
nf_arroyo.83.d:0 "Найбільше евриканці бояться зовнішнього панування. Прийняти Арройо як повелителя — це виклик, але ми можемо довести, що це на благо. Землі Еврики гористі й бідні, родючих угідь обмаль. Та наші інженери могли б започаткувати низку будівельних проєктів, що покращать інфраструктуру — не безкоштовно, звісно, але це зміцнить відносини."
nf_arroyo.83.da:0 "Збудувати майстерні для ремісників."
nf_arroyo.83.db:0 "Надати промислові кредити."
nf_arroyo.83.dc:0 "Позики з високими відсотками — теж варіант."
nf_arroyo.83.ca:0 "Заплатимо, скільки треба, заради дружби."
nf_arroyo.83.cb:0 "Прокласти дорогу між столицями."
nf_arroyo.83.cc:0 "Наші «інженери» — то радше диверсанти."
nf_arroyo.83.na:0 "Провести логістичне навчання."
nf_arroyo.83.nb:0 "Подарувати невеликий вантаж зброї."
nf_arroyo.83.nc:0 "Здійснити обмежені рейди."

nf_arroyo.84.t:0 "Глибша Централізація"
nf_arroyo.84.d:0 "Ми закріпили владу в регіоні. Із надії племені ми стали силою. Настав час переосмислити, як поводитись із тими, хто погодився на підкорення. Ми можемо або інтегрувати їх повністю, або залишити їм номінальну автономію."
nf_arroyo.84.a:0 "Розпочати інтеграцію."
nf_arroyo.84.b:0 "Нехай збережуть показову незалежність."

nf_arroyo.85.t:0 "Еврика Підриває Нас!"
nf_arroyo.85.d:0 "Найманці Еврики стали нам серйозною перешкодою. Наші війська повідомляють: серед ворогів з’явилися елітні загони евриканських найманців. Це зрада від нейтральної держави! Гнів охопив народ, і набір до війська стрімко зростає."
nf_arroyo.85.a:0 "Вони за це заплатять!"

nf_arroyo.86.t:0 "Повернення Героя"
nf_arroyo.86.d:0 "У 2279 році, через три роки після свого відходу, Обранець повернувся з добровільного вигнання. Його зустріли несамовитими вигуками радості та святкуваннями, і кожен в Арройо був певен — він знову очолить плем’я. Правління Ради, яка вела Арройо до домінування над Північною Каліфорнією, завершилось."
nf_arroyo.86.a:0 "Герою — гідну зустріч!"
nf_arroyo.86.b:0 "Не будемо його турбувати."

nf_arroyo.89.t:0 "Нова Роль Ради"
nf_arroyo.89.d:0 "Повернення Обранця на чолі Арройо повернуло Раду до її колишньої ролі — дорадчого органу. Але час, проведений у владі, докорінно змінив динаміку впливу. Відтепер їхні поради матимуть нову вагу."
nf_arroyo.89.a:0 "То що ви там, поки мене не було?"

nf_arroyo.88.t:0 "Наступник Арройо"
nf_arroyo.88.d:0 "Останні кілька років принесли безліч змін. Настав час вирішити, хто знову очолить Арройо."
nf_arroyo.88.a:0 "Нагор — не нудний!"
nf_arroyo.88.b:0 "Чіца — наша сила!"
nf_arroyo.88.c:0 "Димитрій — наш чоловік!"

nf_arroyo.90.t:0 "Оподаткування, не тиранія"
nf_arroyo.90.d:0 "Мальовниче містечко Арройо запропонувало сплачувати данину Республіці в обмін на захист. Дехто скаже — це тягар, але ми, чесно кажучи, єдиний їхній життєздатний торговий партнер."
nf_arroyo.90.a:0 "Чудова ідея!"
nf_arroyo.90.b:0 "Сьогодні податки, а завтра... територія?"

nf_arroyo.91.t:0 "Хабар"
nf_arroyo.91.d:0 "Арройо запропонувало платити нам, якщо ми «не помітимо», як вони захоплять Фор Вейз. Це місце стало б зручним буфером на півночі... можливо, варто погодитись."
nf_arroyo.91.a:0 "Чудова пропозиція!"
nf_arroyo.91.b:0 "Жахлива ідея!"

nf_arroyo.92.t:0 "Мить Еврики"
nf_arroyo.92.d:0 "Хтось скаже, що у Республіки і Арройо вже надто багато ідей, але інструктори з Еврики можуть стати неоціненними."
nf_arroyo.92.a:0 "Прекрасно."
nf_arroyo.92.b:0 "Інші ідеї? У цій економіці?"

nf_arroyo.93.t:0 "Евриканський рибний промисел"
nf_arroyo.93.d:0 "Однією з переваг угоди з Еврикою став доступ до її рибних ресурсів. Вражаюче, але вони настільки продуктивні, що дають рівну вигоду і НКР, і Арройо — незважаючи на різницю в масштабах."
nf_arroyo.93.a:0 "Нам це згодиться."
nf_arroyo.93.b:0 "Суші? Ми що, Ши?"

nf_arroyo.94.t:0 "З багатьох — одне"
nf_arroyo.94.d:0 "Республіка, попри всі свої вади, — остання і найкраща надія Західного узбережжя. У неї є критики й дисиденти — але вона достатньо здорова, щоб дозволяти це. Ми відкидаємо тиранію Вольт-Сіті, корупцію Ріно і деспотизм Цезаря. Ми знову боремося за свободу."
nf_arroyo.94.a:0 "Ми не перемагали Анклав, щоб замінити його новою тиранією."

nf_arroyo.95.t:0 "Знову Друзі"
nf_arroyo.95.d:0 "Приєднаймось до Республіки у боротьбі проти тиранії. Так, у них є недоліки. Але вони збудували чудовий пам’ятник нашому пращурам..."
nf_arroyo.95.a:0 "Може, і нам варто поставити пам’ятник?"

nf_arroyo.96.t:0 "Відкрити Мак-Сек знову"
nf_arroyo.96.d:0 "Озираючись назад, тюремний комплекс із прибутковою метою — чудова ідея. Відкриваймо його знову й наглядаймо за сміттям Пустки. Адже кожна людина — це скарб. Особливо якщо нам платять за її охорону!"
nf_arroyo.96.a:0 "Запускаймо."
nf_arroyo.96.b:0 "Тримаймося подалі."

nf_arroyo.97.t:0 "Кеш за Стволи"
nf_arroyo.97.d:0 "Арройо, як мирні хіпі, вважають, що мають надто багато зброї. А ми — підприємливі люди з грошима. Очевидно, що потрібен обмін!"
nf_arroyo.97.a:0 "Вигідна угода!"
nf_arroyo.97.b:0 "Бували і гірші пропозиції."

nf_arroyo.98.t:0 "Навчання від Вольт-Сіті"
nf_arroyo.98.d:0 "Армія Вольт-Сіті зробила великий крок уперед, і наша технологія цьому допомогла. Чому б не підтримати братів по Вольту?"
nf_arroyo.98.a:0 "Прогрес через мир."
nf_arroyo.98.b:0 "Нам це ні до чого."

nf_arroyo.99.t:0 "Мисливці з Кламета"
nf_arroyo.99.d:0 "Кламетські мисливці славляться найкращими шкурами й хутром у Каліфорнії. Якщо настане ядерна зима — ми будемо готові!"
nf_arroyo.99.a:0 "Патрулювати пустку в такому прикиді — ще той стиль!"
nf_arroyo.99.b:0 "Це неекологічно!"

nf_arroyo.100.t:0 "Зв’язок із Якудзою"
nf_arroyo.100.d:0 "Хоч ми і сумніваємось, що це справжні японці, але віддати належне їхнім звичаям при наймі — не завадить."
nf_arroyo.100.a:0 "Обранець і не таке робив."
nf_arroyo.100.b:0 "...А чи справді робив?"

nf_arroyo.101.t:0 "Хлібний Кошик Модоку"
nf_arroyo.101.d:0 ""
nf_arroyo.101.a:0 "Це зміцнить нашу добробут."
nf_arroyo.101.b:0 "Ми обійдемось."

nf_arroyo.102.t:0 "Невадський Пакт"
nf_arroyo.102.d:0 ""
nf_arroyo.102.a:0 "Зробимо його величним."

nf_arroyo.103.t:0 "Союзники зі Сходу"
nf_arroyo.103.d:0 "Дикарі під проводом Громової Птиці можуть стати нам у пригоді у війні проти Республіки. Звернімося до них по допомогу."
nf_arroyo.103.a:0 "Не завадить підтримка проти НКР."
nf_arroyo.103.b:0 "Їдемо самі!"

nf_arroyo.104.t:0 "Це — Війна"
nf_arroyo.104.d:0 ""
nf_arroyo.104.a:0 "Війна ніколи не змінюється."