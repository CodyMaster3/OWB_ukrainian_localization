l_english:
# Події

nf_navajo.1.t:0 "Брати-Герої"
nf_navajo.1.d:0 "Брати-Герої, Народжений Водою та Вбивця Монстрів, були народжені, щоб очистити землю від чудовиськ, що нищили Народ. Кожен навахо знає цю легенду. Їх наділили священними силами Четвертого Світу: бірюзою, обсидіаном, білою мушлею, перламутром, сіллю та вітром. І з їх допомогою вони перемогли чужих богів та врятували світ. \n\nХоча багато хто шанує Вбивцю Монстрів за великі вчинки, інші пам’ятають, що Народжений Водою пильнував молитви та стежив за ритуалами. Кого вшановує [NAV.GetLeader]?"
nf_navajo.1.a:0 "Вбивця Монстрів"
nf_navajo.1.b:0 "Народжений Водою"

nf_navajo.2.t:0 "Багатства Народу"
nf_navajo.2.d:0 "Ще до Великої Війни американські корпорації тиснули на навахо, щоб відкрити їхні землі для експлуатації. Резервація містила поклади урану, вугілля, природного газу та нафти. Але навахо побачили загрозу й почали розвивати власну вітрову електростанцію."
nf_navajo.2.a:0 "Добре, що шахти стали в пригоді після Війни."
nf_navajo.2.b:0 "Вітропарки стали основою нашого відновлення."

nf_navajo.3.t:0 "Друг Риму"
nf_navajo.3.d:0 "Цезар спершу хотів підкорити навахо, як і Флагстафф, Фінікс та Тусон. Два роки кривавої війни показали, що це не вдасться. Скінволкери навахо нападали на табори вночі, завдаючи хаосу й уповільнюючи просування Легіону. Але Легіон був невблаганний, як сонце Аризони.\n\nЧерез два роки [NAV.GetLeader], лідер Розвідників, пробрався до намету Цезаря — сам, беззбройний. Ніхто не знає, про що вони говорили, але зранку Цезар погодився відвідати [NAV.Capital.GetName].\n\nДехто критикував [NAV.GetLeader] за мир із Легіоном і згоду служити в його війнах. Але Рада Народу побачила користь. Легіон пообіцяв захист від рейдерів, відкриті ринки й — найголовніше — доступ до вод Колорадо. В обмін на данину землі навахо мали стати садом."
nf_navajo.3.a:0 "Цезар дотримався слова."
nf_navajo.3.b:0 "Кажуть, Скінволкери налякали навіть Луція."

nf_navajo.4.t:0 "Ґулі"
nf_navajo.4.d:0 "Лос-Аламос мав бути знищений під час Великої Війни, але там вижила спільнота ґулів. Вони контролюють околиці завдяки 'Ядерній Неллі' — артилерійській установці, що стріляє на 30 миль, і вимагають... людські ресурси від навколишніх племен в обмін на захист. Водночас вони торгують із Народом — зброю й броню міняють на прикраси, одяг і сировину. [NAV.GetLeader] здебільшого дозволяв цю торгівлю, бо вона зменшує нашу залежність від Легіону. Але деякі виступають за тісніший союз, інші — проти участі у рабстві."
nf_navajo.4.a:0 "Чесно кажучи, ми переживали й гірше."

nf_navajo.5.t:0 "Інша Резервація"
nf_navajo.5.d:0 "Ми торгуємо з навахо вже десятки років, отримуючи зброю й броню в обмін на рабів та припаси. Але схоже, що все змінюється. Слідкуймо за [NAV.GetLeader]."
nf_navajo.5.a:0 "Гаразд."

nf_navajo.6.t:0 "Чергове відправлення від навахо"
nf_navajo.6.d:0 "Навахо прислали нам чергову партію рабів. Ура!"
nf_navajo.6.a:0 "Гаразд."

#################
nf_navajo.7.t:0 "Обрані"
nf_navajo.7.d:0 "Схоже, що ґулі використовували рабів не лише для шахт чи промисловості. Наш розвідник виявив підземний бункер і почув крики з лабораторії, де ґулі намагаються створити 'природних' ґулів. Ми продавали людей як худобу для виведення нової раси ґулів!"
nf_navajo.7.a:0 "Божевільна наука довоєнної Америки? Я вражений."

#################
nf_navajo.8.t:0 "Нове кланове ім’я?"
nf_navajo.8.d:0 "Підкорення Кіфрів ставить перед навахо вибір. Ми можемо повністю зламати опір і підпорядкувати плем’я Навахо-Сіті. Але деякі старійшини в Племінній Раді закликають до співчуття — адже колись ми прийняли кланів Край Води та Вода, Що Біжить Червоного. Кіфри мають священну релігію, а стіни їхніх пуебло вкриті формулами та святими числами. Вони співають пісні небес, як і ми. Можливо, варто вітати їх у нашій родині."
nf_navajo.8.a:0 "Ми не братимемо участі в дикості."
nf_navajo.8.b:0 "Заспіваймо зоряні пісні разом."

#################
nf_navajo.9.t:0 "Барабани війни"
nf_navajo.9.d:0 "Схоже, навахо незадоволені нашим справедливим правлінням і готують повстання! Доведеться мати з ними справу самостійно."
nf_navajo.9.a:0 "Невже вони не знають, що сталося з блэкфутами?"

# Запити територій
NAV_request_1:0 "Запросити [498.GetName] і [482.GetName]"
NAV_request_2:0 "Запросити [439.GetName] і [244.GetName]"
NAV_request_3:0 "Запросити [124.GetName], [144.GetName] і [608.GetName]"

NAV_request_1_desc:0 "Діне служили Легіону вірно й тепер просять визнання у формі землі. Вони офіційно просять контроль над [498.GetName] і [482.GetName], щоб повернути шматок предковічної батьківщини."
NAV_request_2_desc:0 "Після років служби Діне звертаються з проханням отримати [439.GetName] і [244.GetName]. Передача земель укріпить їхню позицію в Легіоні й виконає давню обіцянку."
NAV_request_3_desc:0 "Води річки Колорадо живили землю поколіннями, і Діне тепер прагнуть законного контролю над [124.GetName], [144.GetName] та [608.GetName], вірячи, що це забезпечить їхнє майбутнє."

# Відповіді Легіону

nf_navajo_land_request.1.t:0 "Трохи допомоги для друзів"
nf_navajo_land_request.1.d:0 "[164.GetName] має значну навахську громаду, і [NAV.GetLeader] вважає, що вона повинна бути під владою племені. На знак вдячності за їхню підтримку в Мохаве, можливо, варто розглянути це прохання."
nf_navajo_land_request.1.a:0 "Це може стати гарною картою в переговорах..."
nf_navajo_land_request.1.b:0 "Ні за що!"

nf_navajo_land_request.2.t:0 "Повернення Червоної Меси"
nf_navajo_land_request.2.d:0 "Червона Меса історично належала навахо. На знак вдячності за підтримку [NAV.GetLeader] ми повернемо її."
nf_navajo_land_request.2.a:0 "Варто нагородити вірне плем’я."
nf_navajo_land_request.2.b:0 "Радійте тому, що маєте!"

nf_navajo_land_request.3.t:0 "Дикий Колорадо"
nf_navajo_land_request.3.d:0 "Червона Меса історично належала навахо. На знак вдячності за підтримку [NAV.GetLeader] ми повернемо її."
nf_navajo_land_request.3.a:0 "Ці землі нам ні до чого — хай беруть."
nf_navajo_land_request.3.b:0 "Ці землі — наші, взяті силою!"

NAV_good_friends_tt:0 "\nНавахо оцінять цей вчинок!"
NAV_plotting_tt:0 "§RНавахо зрозуміють, що вам не можна довіряти.§!"

nf_navajo_land_request.4.t:0 "Відмова Цезаря"
nf_navajo_land_request.4.d:0 "Цезар відхилив наше прохання без жодного розгляду, заявивши, що ми перегнули палицю."
nf_navajo_land_request.4.a:0 "Ми це запам’ятаємо!"

##### EVENTS
nf_navajo.13.t:0 "Fidelis"
nf_navajo.13.d:0 "[NAV.GetLeader] служив нам вірно, і ми віддячили сповна. Тепер, коли фокус Легіону зміщується на захід, можливо, час визнати, що як союзник, а не як підлеглий, він буде нам корисніший? В обмін на це Навахо залишаться твердо під нашим знаменом."
nf_navajo.13.a:0 "[CES.GetLeader] — щедрий повелитель."
nf_navajo.13.b:0 "Ти — лише пес на повідку, не більше."
NAV_become_ally_not_puppet:0 "[NAV.GetNameWithFlag] стає вірним союзником, але більше не є васалом."

