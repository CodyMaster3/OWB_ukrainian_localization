l_english:
TOC_GROZDAN_HAYKOV_NAME:0 "Гроздан Хайков"
TOC_GROZDAN_HAYKOV_DESC:0 "До Великої Війни Гроздан Хайков був народженим у Болгарії логістичним генієм. Один із багатьох блискучих умів, 'звільнених' урядом США після того, як Європа занурилась у громадянську війну, Гроздан був направлений до Спокана, щоб допомогти впоратися з дедалі складнішою логістикою забезпечення американського гарнізону в Канаді. Через свою важливість він, як і багато інших науковців Спокана, отримав місце у Сховищі 100. Один із перших, хто під наказом Vault-Tec зазнав опромінення, він швидко став одним із провідників гулячого кварталу Сховища. Постійний прибічник переговорів і деескалації, навіть Гроздан виявився безсилим перед 'Великим Повстанням' — масштабною громадянською війною між людьми й гулями. Коли люди втекли на схід, залишивши Сховище, Гроздану довелося збирати уламки й намагатися побудувати новий Спокан."

TOC_julius_brandt_name:0 "Юліус Брандт"
TOC_julius_brandt_desc:0 "§M«Ми пропонуємо безпеку. Не свободу.»§!\n\nХоч він ніколи не визнає цього, колись Юліус воював за Америку на ранньому етапі окупації Канади. Цей досвід лише зробив його жорсткішим, цинічнішим — і саме він створив приватну військову компанію «Білий Вартовий». Іронічно, але уряд США найняв його та його загін, щоб утримати Аляскинський трубопровід. Ніхто з них тоді не знав, що ядерний вогонь перетворить світ — і вони залишаться сам-на-сам з дикою зимою. Ті, хто вижив, включно з Юліусом, стали гулями, єдине, що залишилось їм — це старе бойове спорядження для спецоперацій.\n\nДовгий час Юліус вів Вартових до панування над Вашингтоном, повертаючи їм силу й авторитет. Але, як довів Безсмертний, ця самовпевненість була надмірною. І тепер Юліус змушений починати з нуля. Якби спитали, як йому живеться, він відповів би: «Я досі сумую за часами, коли нашими найбільшими проблемами були племена з Олімпуса та підступи Якеми.»"

TOC_theodore_price_name:0 "Теодор Прайс"
TOC_theodore_price_economic_advisor_desc:0 "До війни Прайс працював у Енергетичному концерні Північно-Західної Співдружності, що мав на меті живити інфраструктуру, яка пов’язувала США з нещодавно анексованою Канадою. Після війни більшість електростанцій стали уламками Старого Світу — без пального, без надії. Єдина діюча АЕС в Електричному Місті досі працює, і Прайс прагне зберегти її. Вона стара, як і він сам, і Прайс бачить у ній споріднену душу — нитку, що ще тримає минуле від остаточного забуття."

TOC_joshua_nevin:0 "Джошуа Невін"
TOC_joshua_nevin_economic_advisor_desc:0 "Пустка завжди була проти гулів. Джошуа спустився з пекельного пейзажу Аляски в пошуках кращого життя без переслідувань. Але знайшов лише більше того самого — ще одне місце, де його шкіра стала смертним вироком. Озброївши себе й інших гулів до зубів, він твердо вирішив кинути виклик кожному фанатику в Кер д’Ален — просто виживаючи."

TOC_killian_nelson_name:0 "Кілліан Нельсон"
TOC_killian_nelson_cultural_advisor_desc:0 "Холод зриває хоробрість навіть з найсміливіших. Щоб вижити, потрібен будь-який захист від пронизливого вітру. Заради цього мисливці, як-от Кілліан Нельсон, вистежують звірів безжальної тундри — аби ще хоч трохи відтягнути смерть."

TOC_samuel_holder_name:0 "Самуель Голдер"
TOC_samuel_holder_air_chief_desc:0 ""

TOC_corp_conor_name:0 "Капрал Конор"
TOC_conor_advisor_desc:0 "§M«Хтось дивиться на тебе не так? Покажи йому ствол. Швидко зрозуміє, що до чого.»§!\n\nКапрал Джеймс Конор стояв поруч із Юліусом століттями: незламний, завжди напоготові. Коли владу Юліуса ставили під сумнів, Конор був першим, хто це припиняв — силою чи іншим шляхом."

TOC_rodriguez:0 "Родріґес, Зрадник"

TOC_icemberg_name:0 "Рассел"

TOC_jane_morris_name:0 "Джейн Морріс"
TOC_jane_morris_advisor_desc:0 "§M«Мені байдуже, хто ти такий і чому ти в моєму офісі. Якщо в тебе немає кепсів — нам немає про що говорити.»§!\n\nЇї брат каже, що вона добра до тих, кого знає — але доказів цьому поки не знайдено. Поки брат керує щоденними справами Айс-Пікс, саме розум і кмітливість Джейн не дають їм стати здобиччю інших мародерів у Білому Морозі. За словами її брата: §R«Без неї ми були б тостом.»§!\n\nІ ми з цим згодні."

TOC_gunther_morris_name:0 "Ґюнтер Морріс"
TOC_gunther_morris_advisor_desc:0 "§gМій тато знайшов Джейн ще до мого народження. Подумав, що вона буде кращим стрільцем, ніж кормом для псів. А я? Він бачив у мені ідеального праву руку — але життя рейдера мені не підходило. Я не виживаю — я живу. А це означало укладати більше угод, ніж розрізати горлянки — прикрашати обличчя привабливими словами.\n\nТатові це не сподобалось. «Ця маячня робить із тебе половину чоловіка», — казав він.\n\nКоли я нарешті зустрівся з ним обличчям до обличчя — з «Якорними Вагами», що співали мені в унісон, і Джейн, яка націлила пістолет йому в скроню — я спитав його: «Якщо я — півчоловіка, то хто ж тоді ти?»\n\nСтарий дурень навіть не зміг відповісти.\n\nТепер я дивлюсь на південь. Кажуть, там можливості сиплються, як монетки з неба... Якщо не зважати на гулів та скажених психів, звісно.§!" --Витяг із §Yособистого щоденника Ґюнтера Морріса§!"

TOC_joshua_nevin_name:0 "Джошуа Невін"

TOC_bentley_name:0 "Рядовий Вільям Бентлі"
TOC_bentley_advisor_desc:0 "§M«Послухай, між нами, тільки один із нас знає, як метати ніж з-під рукава. Якщо ти не розумієш, про що я, ті, хто поставив на мене, вже подвоїли свої гроші.»§!\n\nРядовий Вільям «Білл» Бентлі — проста людина. Все, що йому потрібно — шматочок пирога з мутфрукта наприкінці дня. Його звання — радше доказ неспроможності системи рангів Вартових, ніж її досягнення: незважаючи на низький ранг, він, по суті, друга найважливіша особа в арсеналі Вартових. Як неофіційна права рука Брандта, він проводив безліч розвідоперацій за лінією фронту й був головним джерелом розвідданих. Без нього Вартові досі б метались у снігах, чекаючи смерті."

TOC_lionheart_name:0 "Ліам «Левине Серце» Гарріс"
TOC_lionheart_advisor_desc:0 "§Y«Іноді я думаю: якби все було інакше… Якби в мене було більше грошей, якби людям було не начхати на таких, як я, до війни… Я просто загинув би десь у виритій дірі. А тепер — я принаймні маю змогу щось змінити.»§!\n\nЛіам Гарріс був сержантом армії США до Великої Війни. Коли впали бомби, він зі своєю частиною був у канадській заметілі — достатньо далеко, щоб вижити, але близько, щоб стати гулем. Після десятиліть блукань він знайшов прихисток у Спокані, де Гроздан дав йому дім і дружбу. До появи Вартових вони підтримували порядок і боролись із підступами Ротперджерів. Але з приходом Юліуса все стало менш однозначним. Між групами наростає напруга — не критична, але достатня, щоб спричиняти постійний дискомфорт."

TOC_isabella_lightning_name:0 "Ізабелла «Блискавка» Ґерререз"
TOC_isabella_lightning_advisor_desc:0 "§Y«Я колись постійно літала на винищувачі. І досі можу… Але іноді й рушниця робить те саме, знаєш?»§!\n\nІзабелла завжди була вільним духом, справжньою прихильницею людської природи. Вона вірить, що життя має бути повним злетів і падінь — бо саме це робить його цікавим. Коли Гроздан назвав її залежною від адреналіну, вона лише розсміялася: «Ти щойно це зрозумів?»\n\nСпитай у Ліама — він назве її своєю правою рукою. А якщо спитаєш про щось більше… Ну, є речі, які краще не озвучувати, так?"

TOC_timothy_tyler_name:0 "Тімоті «Ковадлоголовий» Тайлер"
TOC_timothy_tyler_advisor_desc:0 "§Y«Якщо воно не збирається вибухнути… То нахіба ми цим займаємось, а?»§!\n\nУ Тімоті Тайлера завжди була кумедна фраза, яку він почув від приятеля ще в Алясці: «Звуть мене Ковадлоголова, і вибухи — моя робота». Хоч він і не найоригінальніший, у нього є серце — серце, яке хоче бачити, як погані хлопці злітають у повітря. Навіть якщо він піде з ними. Чого ще бажати від живої легенди?"

TOC_john_ryan_name:0 "Джон «Невмирущий» Раян"
TOC_john_ryan_advisor_desc:0 "§M«Падіння Вартових — це моя провина. Я зламався, мов папірець у їхніх руках. Тому я битимусь до смерті за братів по зброї. Коли б вона не прийшла, ця смерть.»§!\n\nКоли Безсмертний окупував Сіетл, він вирішив покарати всіх, хто чинив спротив — катуваннями й стратою. Першими жертвами стали Вартові.\n\nДжон був одним із перших, хто здався. І першим, кого схопили під час восьмигодинної війни. За білий прапор йому відплатили жорстокими допитами.\n\nКоли з’ясувалося, що він справді нічого не знає, його вирішили вбити. Але Джон — як завжди — вижив. Затаївшись, він спланував напад на супровід, схопив лазерну гвинтівку, кинувся на ворогів — і знову був схоплений. І страчений. Але вижив і цього разу.\n\nВражені його живучістю, вороги почали експериментувати над ним, зробивши з Вартового піддослідного пацюка.\n\nПісля втечі він приєднався до решти Вартових. Розповів їм свою історію. І був страчений як ганьба їхнього імені.\n\nТа він знову підвівся. Готовий служити. Готовий спокутати вину. І, можливо, колись відчинити ті перлинні ворота..."