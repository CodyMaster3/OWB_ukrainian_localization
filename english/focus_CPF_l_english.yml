l_english:
  
### WAKAW ###
wak_the_doctor_is_in:0 "§7Лікар Уже Тут§!"
wak_the_doctor_is_in_desc:0 "Хоча справжніх перерв у медичній практиці не буває, є підйоми й спади — і §Gдоктор Тобогган§! бував у достатній кількості підйомів, щоб відчути, що наближається новий."
wak_medical_records:0 "Перегляд Медичних Записів"
wak_medical_records_desc:0 "§GДоктору Тобоггану§! не завадить освіжити в пам’яті своїх пацієнтів... Гронконкл краще хай поставить ще один кавник зі стим-кавою."
wak_psycho_ward:0 "§9Псайхо-Відділення§!"
wak_psycho_ward_desc:0 "§9Псайхо-Мутанти§! занадто небезпечні для себе та інших супермутантів, щоб дозволити їм вільно гуляти лікарнею."
wak_nightkin_rehabilitation_gardens:0 "§3Сади Реабілітації Найткінів§!"
wak_nightkin_rehabilitation_gardens_desc:0 "Наші спроби сповільнити деградацію ментального стану §3Найткінів§! поки що... малоефективні. Наразі ми можемо лише намагатися полегшити їхні страждання та прояснити розум."
wak_pet_familiarization_plan:0 "Ручні Детклови"
wak_pet_familiarization_plan_desc:0 "Деткловів чомусь тягне до лікарні, а §3Найткіни§! та §9Псайхо-Мутанти§! отримують неабияке задоволення від гри з ними... Ніякої шкоди, правда ж?"
wak_a_doctors_borders:0 "Межі Лікаря"
wak_a_doctors_borders_desc:0 "Сумна правда полягає в тому, що §GЛікар§! не може бути всюди одночасно, і тому багато хто залишається без його допомоги. Але це не означає, що він не стежить за подіями."
wak_headcount:0 "§tТривожна Перевірка Пацієнтів§!"
wak_headcount_desc:0 "Останнім часом у наших записах та даних щодо пацієнтів почали з’являтися невідповідності. Варто з’ясувати, чому так сталося... і головне — чому саме."
wak_letter_from_lugnut:0 "§OЛист від Лагната§!"
wak_letter_from_lugnut_desc:0 "Який же милий хлопчина цей §OЛагнат§! Цікаво, про що його лист? Можливо, хоче дізнатися, як почувається бабуся... Який турботливий онук."
wak_a_note_of_cordiality:0 "Лист Ввічливості"
wak_a_note_of_cordiality_desc:0 "Було б невиховано не привітати П’єра з перемогою на виборах до Гранд-Електорату. Хоча... не варто йому давати ілюзій щодо справжньої дружби."
wak_patient_0:0 "§LНульовий Пацієнт§!"
wak_patient_0_desc:0 "Дивна напівлюдина-напівмашина увірвалася до клініки з грубими малюнками дерев’яних істот у болю. Дуже незвичайний випадок, який слід негайно дослідити. Було б катастрофою, якби це поширилось, особливо серед і так хворих §3Найткінів§!."
wak_impromptu_fieldwork:0 "Позапланова Польова Робота"
wak_impromptu_fieldwork_desc:0 "Спалах у Фейрі-Глені — вкрай тривожний, але ще більш цікавий. §GЛікар§! особисто очолить групу найкращих дослідників для лікування дерев."
wak_fairly_odd_police:0 "Доволі Дивна Поліція"
wak_fairly_odd_police_desc:0 "Френкі — звичайна дитина,\nЩо ніхто не розуміє!\nТобогган і П’єр і Дандерн —\nВічно командують нею (Припиніть зомбувати дітей! Дрібнота!)\nВеселка й сонце у її кімнаті —\nВсе ламається вмить,\nБо її тато створив секретну генетичну поліцію для контролю населення,\nАдже насправді, це все вона —\nДивна Поліція!"
wak_survey_of_the_glen:0 "Обстеження Глену"
wak_survey_of_the_glen_desc:0 "Медицина — справа гуманності. Якщо наше «лікування» не передбачає співпереживання пацієнтам... ми тоді гірші за монстрів."
wak_emergency_relief_of_mental_anguish:0 "Невідкладна Допомога від Психічного Страждання"
wak_emergency_relief_of_mental_anguish_desc:0 "Дані не брешуть — наші пацієнти нещасні до нестями. Тому сьогодні ми призначаємо нестандартний курс лікування: розмальовки, цукерки й щоденну гру в «Пиріжок»."
wak_point_of_care_facility:0 "Медичний Пункт Нагального Догляду"
wak_point_of_care_facility_desc:0 "Не має сенсу постійно курсувати між Гленом та Бірч-Гіллз, ризикуючи життям пацієнтів. Хвороба — у Глені, отже ми залишаємося там!"
wak_preliminary_breakthroughs:0 "Попередні Прориви"
wak_preliminary_breakthroughs_desc:0 "Ми досягли надзвичайних результатів у розумінні природи хвороби цих фей. Вивчаючи найстарших і найвраженіших, ми виявили, що це спричинено впливом антигену в ранньому дитинстві. На жаль, способів зупинити або хоч би сповільнити процес карцинізації ми поки не маємо. Можливо, якщо здобудемо джерело антигену..."
wak_fatal_politiciomous:0 "Смертельний Політиціомоз"
wak_fatal_politiciomous_desc:0 "Невиліковна недуга охопила багатьох чиновників Електорату. Вона викликає неконтрольовану брехню, схильність до зрад та гіпертрофовану самооцінку. Така трагічна хвороба... і, на жаль, вона невиліковна."