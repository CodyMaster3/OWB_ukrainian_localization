l_english:
MOD_MAYOR_JO_NAME:0 "Мер Джо"  
MOD_MAYOR_JO_DESC:0 "Колись — «типовий середнячок», якого обрали мером тільки тому, що ніхто інший не захотів. Але Джо довелося різко змінити ставлення до посади після того, як торгова угода зі Слаґс урятувала Модок від посухи, яка ледь не знищила місто.\n\nНаступні роки співпраця з Слаґс розквітла, фермерство в регіоні розцвіло, й Модок почав постачати їжу та товари багатьом сусіднім поселенням. Це привернуло увагу торгових компаній — і з затишного містечка Модок перетворився на популярну зупинку на Великому Коло між хабами НКР і містами, як Сховище.\n\nТепер жодного дня не минає без прибуття чи відбуття каравану.\n\nІ хоч раніше Джо був і торговцем, і шерифом, і мером, і всім підряд — тепер він спокійно обіймає посаду просто мера.\n\nБо нарешті знайшлися інші, хто робить решту роботи."

mod_idea_breadbasket:0 "Житниця Невади"
