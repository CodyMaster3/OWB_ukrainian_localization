mod_legacy_of_the_chosen_one:0 "Спадщина Обраного"
mod_legacy_of_the_chosen_one_tt:0 "Модок і Слаґс завжди підтримуватимуть одне одного у разі зовнішньої агресії."
mod_legacy_of_the_chosen_one_desc:0 "Допомога Обраного перетворила потенційних ворогів на союзників на десятиліття. Жодна сила не зруйнує зв’язки, що були створені тридцять років тому."
