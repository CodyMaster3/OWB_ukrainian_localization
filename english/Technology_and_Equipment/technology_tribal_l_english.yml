l_english:

#----------------------------
# Заголовки / Мітки
#----------------------------
TRIBAL_CULTURE_HEADER:0 "Племінна Спадщина"
tribal_tech_access_tech:0 "Племінна Держава"
tribal_tech_visibility_tech:0 "Бачимість Племінних Технологій"

#----------------------------
# Технології
#----------------------------
tribal_starter_tech:0 "Організоване Військове Суспільство"
tribal_starter_tech_desc:0 "Наша племінна спільнота вплітає конфлікт у саму культуру, що пронизує і цивільне життя. Багато з членів племені з дитинства вміють полювати та битися. Сконцентрувавши зусилля на додатковому навчанні зі стрільби та базовій тактиці, ми дозволимо батькам і наставникам виконувати роль офіцерів і сержантів-інструкторів, значно зменшуючи витрати."

tribal_enforcer_defense_tech:0 "Військові Модифікації"
tribal_enforcer_defense_tech_desc:0 "Спочатку Примушувачі використовувались для збереження порядку та умиротворення бунтівних регіонів, але відсутність важкої піхоти дається взнаки. Ми повинні пристосувати їх до бойового використання: військова підготовка, посилена броня й інтеграція у загони воїнів дозволять це зробити."

tribal_enforcer_hard_attack_tech:0 "Спеціалізована Зброя"
tribal_enforcer_hard_attack_tech_desc:0 "Наша важка піхота наразі має лише стандартний кулемет, що робить її неефективною проти бронетехніки. Ми можемо вирішити це, встановивши обрізані автоматичні гвинтівки на праву руку, а на ліву — грубий 'лазканон', який використовує повну енергетичну батарею за один постріл, здатний рознести броню."

tribal_enforcer_soft_attack_tech:0 "Боєкомплект у Наплічнику"
tribal_enforcer_soft_attack_tech_desc:0 "Важка броня Примушувачів ускладнює володіння зброєю та особливо перезарядку. Переробка зброї на стрічкову подачу з наплічником з боєкомплектом вирішить цю проблему та суттєво збільшить вогневу міць."

tribal_enforcer_speed_tech:0 "Майстерність Важкої Броні"
tribal_enforcer_speed_tech_desc:0 "Удосконалення броні Примушувачів на основі досвіду ветеранів дозволить їм ефективно використовувати її неприводну природу. Наші бійці у важкій броні здатні слідувати стежками, недоступними навіть силовій броні, завдаючи несподіваних ударів."

tribal_enforcer_org_tech:0 "Доктрина Неприводної Броні"
tribal_enforcer_org_tech_desc:0 "Хоча наша важка броня здається примітивною у порівнянні з силовою, вона мобільніша, краще пристосована до тривалого бою та ефективна в польових умовах. Ми повинні використати це, інтегруючи Примушувачів у легку піхоту та завдаючи ворогам ударів із несподіваною люттю."

tribal_infantry_defense_tech:0 "Володіння Вибухівкою"
tribal_infantry_defense_tech_desc:0 "Добре знати місцевість — чудово, але масивна вибухівка ніколи не завадить. Інтеграція саперів у наші засідкові загони дозволить ставити пастки перед залпом куль, підриваючи мораль і зміцнюючи нашу оборону."

tribal_infantry_hard_attack_tech:0 "Навчання IED"
tribal_infantry_hard_attack_tech_desc:0 "Поглиблене навчання та забезпечення дозволяє саперам встановлювати протитанкові СВП у передбачуваних зонах дій. Чутливі до ваги пластини активуються тільки в присутності бронетехніки, а найбожевільніші сапери закладають заряди, що розривають її на шматки."

tribal_infantry_soft_attack_tech:0 "Прикритий Залповий Вогонь"
tribal_infantry_soft_attack_tech_desc:0 "Навчання витривалості дозволяє нашим воїнам легко долати перешкоди й використовувати складний ландшафт для засідок. Легка піхота веде фронтальний бій з укриттів, у той час як важча зброя б’є з неочікуваних позицій."

tribal_infantry_recovery_tech:0 "Військовий Марш"
tribal_infantry_recovery_tech_desc:0 "Удосконалене тренування зі стратегії витривалості дозволяє воїнам краще пересуватись на великі відстані, швидше відновлюватись після боїв і діяти ефективніше на складному рельєфі."

tribal_infantry_org_tech:0 "Формування Міліції"
tribal_infantry_org_tech_desc:0 "Заохочення створення охорони та міліції в селах не лише забезпечить порядок, а й підготує молодь до військової служби. Навчання бойовим основам та стрільбі вже в цивільному житті дає нам організовану армію."

tribal_beast_breakthrough_tech:0 "Нагляд За Зграєю"
tribal_beast_breakthrough_tech_desc:0 "Щоб наші бойові звірі досягли ворога, їм доводиться прориватись через шквальний вогонь. Якщо ми приглушимо цей опір, зграї доберуться до ворога й розірвуть його."

tribal_beast_cost_tech:0 "Відкриті Землі"
tribal_beast_cost_tech_desc:0 "Розширення пасовищ для наших стад — стратегічна інвестиція. Незважаючи на витрати, у майбутньому вони повернуться сторицею."

tribal_beast_hard_attack_tech:0 "Кусати Та Ламати"
tribal_beast_hard_attack_tech_desc:0 "Сила наших звірів вражає, але броня Старого Світу часто зупиняє їх. Якщо ж зламати її, вони доберуться до нутрощів."

tribal_beast_recovery_tech:0 "Взаємна Підтримка"
tribal_beast_recovery_tech_desc:0 "З давніх-давен люди та звірі знаходили спільну мову. Коли ми живемо разом — ми стаємо сильнішими разом. Тільки не давайте їм занадто багато імен..."

tribal_beast_org_tech:0 "Сувора Рука"
tribal_beast_org_tech_desc:0 "Лють звіра легко може обернутись хаосом без воїна-наставника. Їхні розуми не бачать битви в цілому. Хендлери досягають поваги, дисциплінують і спрямовують у потрібному напрямку. Інакше — зграя кинеться за першим, що побачить."

tribal_construction_tech:0 "Стандартизація Інфраструктури"
tribal_construction_tech_desc:0 "Відходячи від хаотичного планування та довільного розташування будівель, ми можемо стандартизувати такі споруди, як житло, майстерні, стежки та іншу інфраструктуру. Завдяки цьому їх простіше покращувати, будувати та обслуговувати, оскільки вони стають новою нормою."

tribal_aa_building_tech:0 "Авіаційне Переслідування"
tribal_aa_building_tech_desc:0 "Природне знання місцевості дозволяє нам розміщувати зенітну зброю в прихованих місцях, які пілоти ніколи не запідозрять. У кожній печері може бути кулемет, кожна гора — укріплення. Ми ніколи не дозволимо ворогу панувати в повітрі."

tribal_production_tech:0 "Зусилля зі Збирання"
tribal_production_tech_desc:0 "Наші розвідувальні та мисливські загони часто знаходять руїни Старого Світу, повні ресурсів. Але через забобони або нестачу знань їх часто оминають. Навчивши технікам збирання та запропонувавши винагороду, ми отримаємо регулярний потік ресурсів для вивчення й використання у виробництві."

tribal_occupation_tech:0 "М’яка Окупація"
tribal_occupation_tech_desc:0 "Щоб утримати окуповані землі, слід діяти делікатніше. Вони, можливо, бачать у нас дикунів, але ми доведемо зворотне. Кампанії з роздачі їжі та будівництва інфраструктури дозволять заручитись прихильністю народу."

tribal_political_power_tech:0 "Інтегровані Старійшини"
tribal_political_power_tech_desc:0 "Хто краще знає потреби народу, ніж наші поважні старійшини? Їхній досвід і поради мають лягти в основу наших рішень. Єдність племені та кращі умови життя посилять підтримку наших дій."

tribal_bomb_protection_tech:0 "Тактика Обману"
tribal_bomb_protection_tech_desc:0 "Щоб захистити інфраструктуру від бомбардувань, треба бути винахідливими. Мережа дешевих фальшивих фабрик, погано замаскованих для приваблення розвідки ворога, відволікатиме увагу та захистить справжні об’єкти."

tribal_construction_tech_2:0 "Освіта Цивільних"
tribal_construction_tech_2_desc:0 "Для племінників, готових допомогти, ми організуємо курси з основ ремонту й будівництва. Це не зробить їх майстрами, але дозволить працювати ефективніше й з меншою потребою в нагляді."

tribal_construction_tech_3:0 "Громадські Проєкти"
tribal_construction_tech_3_desc:0 "У щільній культурі племені легко залучити людей до громадських проєктів. Сільські жителі братимуть участь у будівництві захисних чи життєво важливих споруд, значно пришвидшуючи процес."

tribal_production_tech_2:0 "Майстерні Села"
tribal_production_tech_2_desc:0 "Розподіливши виробництво за селами, ми створимо осередки знань і майстерності. З часом ці села стануть відомі своєю якістю, передаючи досвід від покоління до покоління."

tribal_production_tech_3:0 "Вивчення Обладнання"
tribal_production_tech_3_desc:0 "Хоча ми не зрівняємось у промисловості з більш розвиненими націями, ми можемо вивчати їхні технології та креслення, щоб покращити власне спорядження та методи виготовлення."

tribal_production_tech_4:0 "Місцеві Інновації"
tribal_production_tech_4_desc:0 "Поєднуючи зовнішній досвід і власні ідеї, ми можемо досягти продуктивності, якої інші племена не знають. Наші майстри кмітливі, навчені й постійно вдосконалюють усе — від спорядження до процесів."

tribal_aa_unit_tech:0 "Протиповітряний Прожектор"
tribal_aa_unit_tech_desc:0 "Саморобна зенітна зброя, більше орієнтована на психологічний ефект. Функціонує як міномет, випускаючи снаряд з таймером, що вибухає на низькій висоті, наповнюючи небо димом і уламками. Висока швидкість стрільби дозволяє створити справжній шторм у повітрі."

tribal_climate_tech:0 "Доктрина Адаптації"
tribal_climate_tech_desc:0 "Наші воїни витривалі та навчені виживати. В нових місцях ми формуємо мисливські й розвідгрупи, щоб вивчити місцевість, поповнити запаси й адаптуватись. Це підвищить ефективність у будь-яких умовах."

tribal_resistance_tech:0 "Осередки Опору"
tribal_resistance_tech_desc:0 "Замість покладатись на неозброєний народ, ми сформуємо навчений підпільний рух. Вони матимуть зброю й досвід, щоб чинити ефективний спротив і захистити наших навіть в умовах окупації."

tribal_command_power_tech:0 "Місцевий Командний Склад"
tribal_command_power_tech_desc:0 "Інтегрувавши воїнів і старійшин у командування, ми отримаємо мудрість, локальні знання та бойовий досвід. Така структура підвищить ефективність усіх наших операцій."

tribal_recovery_tech:0 "Польові Раціони"
tribal_recovery_tech_desc:0 "Наші методи виживання слід пристосувати до армії. Зручні, смачні та поживні раціони, як-от в’ялене м’ясо, суміші горіхів і ягід або пеммікан, підвищать бойовий дух і енергію воїнів."

tribal_reliability_tech:0 "Вроджені Знання Механіки"
tribal_reliability_tech_desc:0 "Виховання інтересу до механіки з дитинства сприяє згуртованості та кращому розумінню зброї. З часом солдати навчаться розбирати й чистити свою зброю краще."

tribal_attrition_tech:0 "Знання Місцевості"
tribal_attrition_tech_desc:0 "Ми знаємо пустку краще за будь-кого. Де інші втрачають час і людей, ми пристосовуємось. Ми здатні здобути все необхідне навіть далеко від баз, що зменшує залежність від постачання."

tribal_recon_tech:0 "Цивільна Розвідка"
tribal_recon_tech_desc:0 "Найефективніший спосіб дізнатись про рух ворога — це «змастити когось». Заплативши торговцям і мисливцям, ми легко отримаємо карти, координати й навіть крадену інформацію з ворожих постів."

tribal_reinforce_tech:0 "Міліційні Скермішери"
tribal_reinforce_tech_desc:0 "Розміщення міліційних загонів у зонах низької загрози дозволяє стримати ворога. Вони діють лише у вигідних умовах, подають сигнал і уникають втрат, поки не прибудуть головні сили."

tribal_hard_attack_tech:0 "АТ Доктрина Комбінованих Зусиль"
tribal_hard_attack_tech_desc:0 "Координація протитанкових загонів із рейдерами дозволяє ефективно знешкоджувати бронетехніку. Гвинтівки зупиняють чи зупиняють ворога, після чого рейдери знищують його вибухівкою чи рукопаш."

tribal_piercing_tech:0 "Майстерність АТ Гвинтівок"
tribal_piercing_tech_desc:0 "Інтенсивне навчання робить наших стрільців грізною силою. Вони майстерно використовують місцевість і з однієї кулі влучають у вразливі точки — і поцілюють точно в лобове скло чи отвір."

tribal_coring_cost_tech:0 "Турбота про Громадян"
tribal_coring_cost_tech_desc:0 "Насправді, найважливішим у стабілізації регіону є не посадовці, а звичайні люди. Мінімальні зміни в їхньому житті та надання допомоги зроблять нас бажаними лідерами, а не окупантами."

tribal_bucket_o_bolts_tech:0 "Племінна Гордість"
tribal_bucket_o_bolts_tech_desc:0 "Ми навчилися в чужинців, але не повинні забувати, ким ми є. Ми не такі, як вони — ми кращі. Ми знаємо пустку, володіємо зброєю і довіряємо один одному так, як інші ніколи не зможуть."

#----------------------------
# Підказки
#----------------------------
tech_20_percent_coring_cost_decrease_tt:0 "Отримати постійне §Gзменшення на 20%§! вартості інтеграції територій.\n"
beast_cost_reduction_tech_tt:0 "§YВійськові Звірі§!: \n  £production_cost  Вартість виробництва: §G-10%§! \n§YЗграї Геконів§!: \n  £production_cost  Вартість виробництва: §G-5%§! \n"