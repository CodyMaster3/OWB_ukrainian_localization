HEADER_FERALS:0 "Дикі ґулі"
HEADER_BEASTS:0 "Звірі"
HEADER_WAR_BEASTS:0 "Військові звірі"
HEADER_GECKOS:0 "Підтримка ґеконів"

# Moleminer
molerat_upgrade_tech_1:0 "Шахтарські костюми"
molerat_upgrade_tech_1_desc:0 "Навіть якщо мутовані тіла створюють чимало проблем нашим майстрам, ми повинні забезпечити їх належним захистом. Шахтарська броня — це легкий, обтягуючий комбінезон, посилений шкіряними вставками та сталевими пластинами. До комплекту також входять шахтарські кігті, здатні роздирати як ворогів, так і ґрунт."

molerat_upgrade_tech_2:0 "ОФДВ-заряди"
molerat_upgrade_tech_2_desc:0 "Забезпечити наших бойових саперів зброєю подвійного призначення — нелегке завдання, але інженери створили нову гранату: заряд з мідною вкладишкою, оточений уламковим корпусом із кульками. Вона підходить і для знищення ворожої техніки, і для атаки на піхоту."

molerat_upgrade_tech_3:0 "Полегшена бойова гвинтівка"
molerat_upgrade_tech_3_desc:0 "Мутанти витримують більше віддачі, тому ми взяли прототипи бойових гвинтівок, переробили їх під укорочений патрон 15мм, зменшили вагу та довжину ствола. Це майже карабіни — з потужністю, достатньою для копання і бою одночасно."

# Technologies

burrowing_beast_unlock_tech:0 "Риючі когорти"
burrowing_beast_unlock_tech_desc:0 "Можна воювати в небі та на воді, але що з землею? Приручивши істот, які риють ґрунт і навіть скелі за секунди, ми здобудемо не лише тактичну перевагу, а й стратегічну."

burrowing_beast_upgrade_tech_1:0 "Кам'яні ломи"
burrowing_beast_upgrade_tech_1_desc:0 "Копати скелі — не жарти. Завдяки штучному добору ми виростили істот з кігтями, твердими як сталь. Вони прориваються звідусіль і рвуть все на своєму шляху."

burrowing_beast_intermediate_form:0 "Скажені кроти"
burrowing_beast_intermediate_form_desc:0 ""

burrowing_beast_upgrade_tech_2:0 "Інстинкт риття"
burrowing_beast_upgrade_tech_2_desc:0 "Наші створіння самі починають будувати мережі нір, логовищ і схованок. Такі тунелі добре зберігають температуру та роблять їх важкими для виявлення."

burrowing_beast_glowing_form:0 "Сяючі кроти"
burrowing_beast_glowing_form_desc:0 ""

burrowing_beast_upgrade_tech_3:0 "Сяючі, отже сильні"
burrowing_beast_upgrade_tech_3_desc:0 "Сяйво — ознака сили. Іррадіація в молодому віці зменшує поголів’я, але ті, хто вижив, стають міцнішими та стійкими до радіації. А в пост’ядерному світі сховищ не бракує."

burrowing_beast_brood_form:0 "Матки кротів"
burrowing_beast_brood_form_desc:0 ""

burrowing_beast_upgrade_tech_4:0 "Свіжі виводки"
burrowing_beast_upgrade_tech_4_desc:0 "Риючі істоти швидко плодяться. Їхні дитинчата не лише виживають на полі бою, а й боронять матір — і перетворюють її на люту машину смерті. Ті, хто переживе, будуть готові до нового бою."

bb_chitin_plating:0 "Хітинова броня"
bb_chitin_plating_desc:0 "Зовнішній панцир наших істот настільки твердий, що витримує постріли зі стрілецької зброї."

insect_creature_unlock_tech:0 "Комахи у бою"
insect_creature_unlock_tech_desc:0 ""

insect_beast_upgrade_tech_1:0 "Єдиний напрямок"
insect_beast_upgrade_tech_1_desc:0 "Не всі комахи справді соціальні, але мутовані гіганти чомусь ладнають краще. Тренування на злагоджену роботу в зграї — ключ до перемоги."

insects_intermediate_tech:0 "Іррадійовані радітаргани"
insects_intermediate_tech_desc:0 ""

insect_beast_upgrade_tech_2:0 "Агресивна поведінка"
insect_beast_upgrade_tech_2_desc:0 "Жаль? Стриманість? Комахи цього не знають. Розведення найжорстокіших особин небезпечне — але не для ворога. Зграя буде безжальна."

insects_giant_tech:0 "Гігантські таргани"
insects_giant_tech_desc:0 ""

insect_beast_upgrade_tech_3:0 "Розмір і кількість"
insect_beast_upgrade_tech_3_desc:0 "Хтось скаже: чим більші — тим менше їх можна мати. А ми кажемо — дурниці! Ми зробили їх ще більшими, і вони плодяться ще швидше!"

amphibious_beast_unlock_tech:0 "Амфібії"
amphibious_beast_upgrade_tech_1:0 "Правильне харчування"
amphibious_beast_upgrade_tech_1_desc:0 "Болотники їдять усе. Але дієта з багатих поживами ворогів дозволяє їм бути в піковій формі."

amphibious_beast_intermediate_form:0 "Болотники-вбивці"
amphibious_beast_upgrade_tech_2:0 "Метаболічний буст"
amphibious_beast_upgrade_tech_2_desc:0 "Правильні стимулятори розганяють обмін речовин: швидше рухаються, краще воюють, швидше відновлюються. Але не забувайте — якщо припинити — буде біда."

amphibious_beast_armor_form:0 "Кривавобожевільний Болотник"
amphibious_beast_upgrade_tech_3:0 "Просунуте розведення"
amphibious_beast_upgrade_tech_3_desc:0 "Селекція та «особливі методи» дозволяють створити воїнський клас, сильний і витривалий. Тих, хто не проходить відбір, ми залишимо як тилову підтримку."

amphibious_beast_king_form:0 "Король Болотників"
amphibious_beast_upgrade_tech_4:0 "Звуковий постріл"
amphibious_beast_upgrade_tech_4_desc:0 "Королі Болотників здатні випускати спрямовані звукові хвилі, що ранять і дезорієнтують."


deathclaw_unlock_tech:0 "Молоді Смертокігті"
deathclaw_infantry_unlock_tech:0 "Цивілізація Смертокігтів"
deathclaw_infantry_unlock_tech_desc:0 "Наше суспільство або ґрунтується на надзвичайно згуртованих гніздах грізних Смертокігтів, якими керують Матріархи та їхні могутні партнери, або володіє засобами для приручення і контролю величезної кількості цих істот."

deathclaw_upgrade_top_1:0 "Люті кігті"
deathclaw_upgrade_top_1_desc:0 "Що ж то за Смертокіготь без кігтів? Вони вже здатні прорізати броню, але завдяки укріпленню та регулярному догляду ми можемо зробити їх ще гострішими — і ще смертоноснішими для м’яких тіл наших ворогів."

deathclaw_upgrade_bottom_1:0 "Могутні роги"
deathclaw_upgrade_bottom_1_desc:0 "Смертокігті вже можуть розірвати все, що їм треба. Навіщо покращувати те, що вже ідеальне? А от їхні роги — інша справа. Селекція на великі роги та міцну шию перетворить їх на живі таранні машини, здатні перекидати навіть силову броню!"

deathclaw_creature_tech_2:0 "Смертокігті"

deathclaw_upgrade_top_2:0 "Потужна мускулатура"
deathclaw_upgrade_top_2_desc:0 "М'язова система Смертокігтів настільки розвинена, що аж занадто. Але наші лікарі кажуть, що це зовнішній вигляд виснаження, а не здоров’я. Нова дієта і додатковий шар жиру дозволять їм частіше використовувати свою справжню геркулесову силу."

deathclaw_upgrade_top_3:0 "Чотириногий ривок"
deathclaw_upgrade_top_3_desc:0 "Коли вони повністю здорові, Смертокігті здатні показати, на що дійсно здатні — стрімкий ривок на всіх чотирьох лапах. Навіть силова броня не втече від цього нападу!"

deathclaw_upgrade_bottom_2:0 "Залізна шкіра"
deathclaw_upgrade_bottom_2_desc:0 "Їхня шкура і так одна з найміцніших у пустці, але її можна зробити ще кращою. Обробка луски та додаткова броня зробить Смертокігтів ходячими танками. Вони навіть усвідомлюють свою невразливість і втрачають страх перед вогнем і кулями!"

deathclaw_upgrade_bottom_3:0 "Терморегуляція"
deathclaw_upgrade_bottom_3_desc:0 "Хтось каже, що Смертокігті — рептилії, але це не зовсім так. Вони — генетичні аберації. Наші особини — теплокровні, витримують екстремальні температури і здатні битися там, де ворог і не очікує."

deathclaw_creature_tech_3:0 "Альфа-Смертокігті"

deathclaw_upgrade_top_4:0 "Терплячий мисливець"
deathclaw_upgrade_top_4_desc:0 "Навіть надмірна сила потребує стриманості. Наші Смертокігті розумні й здатні вистежувати здобич, чекаючи на ідеальний момент для удару. Найстрашніший Смертокігть — той, якого ти не бачиш."

deathclaw_upgrade_bottom_4:0 "Убивчий удар"
deathclaw_upgrade_bottom_4_desc:0 "Смертокігті завжди були вершиною харчового ланцюга, а тепер — і нашої армії. Навіть найвідданіші вояки втікають, бачачи, як ці істоти розривають товаришів. Додайте трохи психо і вкажіть напрямок — і вони перетворюють ворога на криваве місиво."

deathclaw_special_forces_unlock_tech:0 "Альфа-Смертокігті"
deathclaw_special_forces_unlock_tech_desc:0 "Надзвичайно потужні Смертокігті виростають в Альф. Вони більші, сильніші та зліші, ніж звичайні, і є одними з найнебезпечніших мутантів у всій пустці. Загони під їхнім командуванням рідкісні — але майже непереможні."

deathclaw_special_forces_tech_1:0 "Альбіносні Смертокігті"
deathclaw_special_forces_tech_1_desc:0 ""

deathclaw_special_forces_tech_2:0 "Матріархи Смертокігтів"
deathclaw_special_forces_tech_2_desc:0 ""

deathclaw_special_forces_tech_3:0 "Легендарні Смертокігті"
deathclaw_special_forces_tech_3_desc:0 ""

feral_ghouls_unlock_tech:0 "Приборкання Диких Гулів"

feral_ghouls_upgrade_1:0 "Безстрашне насилля"
feral_ghouls_upgrade_1_desc:0 "Наймоторошніша риса диких мутантів — повна відсутність страху. Вони кидаються в бій без вагань, часто з кривавими наслідками для ворога."

feral_ghouls_intermediate_form:0 "Дикі Гули-Блукачі"

feral_ghouls_upgrade_2:0 "Нескінченна хода"
feral_ghouls_upgrade_2_desc:0 "Мутанти майже не потребують сну. Вони здатні блукати днями, тижнями, навіть роками без відпочинку. Армія, яка не спить — завжди готова."

feral_ghouls_armored_form:0 "Дикі Гули-Різники"

feral_ghouls_upgrade_3:0 "Повноцінна броня"
feral_ghouls_upgrade_3_desc:0 "Бронювання мутантів — не новина, але ми нарешті з’ясували, які частини тіла дійсно потребують захисту. Броня стане точнішою, ефективнішою і не марнуватиметься на зайве."

feral_ghouls_glowing_form:0 "Світляки"

feral_ghouls_upgrade_4:0 "Постійне випромінення"
feral_ghouls_upgrade_4_desc:0 "Радіація здатна відновлювати плоть мутанта з такою швидкістю, що здається магією. Забезпечивши постійне джерело опромінення, ми дозволимо нашим військам зцілюватися просто на полі бою — навіть ті, кого ворог вважав мертвим, повстануть знову."

war_beasts_unlock_tech:0 "Приручення повоєнних тварин"
war_beasts_unlock_tech_desc:0 "Люди приручали тварин тисячоліттями, і у Пустці ми нічим не відрізняємось — хіба що самими тваринами. З турботою та наполегливістю навіть мутованих істот можна перетворити на союзників, або хоча б на корисних компаньйонів."

war_beasts_first_form_tech:0 "Тренування бойових звірів"
war_beasts_upgrade_1:0 "Міцні ошийники"
war_beasts_upgrade_1_desc:0 "Чи то базовий захист, чи стримування особливої агресії — укріплення нашого спорядження для контролю звірів дозволить уникнути втрат і, можливо, приручити ще більш небезпечних істот."

war_beasts_intermediate_form_tech:0 "Біґґорнери"
war_beasts_upgrade_2:0 "Тренування до стресу"
war_beasts_upgrade_2_desc:0 "Вибухи, вогонь, крики — війна жахає навіть досвідчених бійців, не кажучи про тварин. Поступово привчаючи наших звірів до таких умов у безпечному середовищі, ми зменшимо ризик паніки на полі бою."

war_beasts_heavy_form_tech:0 "Яо-Гаї"
war_beasts_upgrade_3:0 "Міцні кровні лінії"
war_beasts_upgrade_3_desc:0 "Селекція — перевірений шлях до ідеального тваринного супутника. Ми вже маємо кілька родоводів, відомих своїми особливими якостями. І продовжимо їх розвивати."

war_beasts_upgrade_4:0 "Сімейна динаміка"
war_beasts_upgrade_4_desc:0 "Навіть найдикіші ссавці мають інстинкти турботи про своїх. Зміцнюючи цей інстинкт і інтегруючи себе у їхню "зграю", ми зробимо звірів більш вірними і рішучими в бою."

war_beasts_dusky_form_tech:0 "Темні Яо-Гаї"
war_beasts_stalker_form_tech:0 "Нічні сталкери"
war_beasts_upgrade_5:0 "Нічне полювання"
war_beasts_upgrade_5_desc:0 "Темрява — союзник хижака. Спільна робота з нічними мисливцями навчила нас краще нападати вночі — і краще виявляти тих, хто намагається напасти на нас."

war_beasts_upgrade_6:0 "Потужна отрута"
war_beasts_upgrade_6_desc:0 "Отрута — надійна зброя. Посилення токсичності наших звірів дозволяє їм завдати удару і відійти, залишивши жертву гинути без ризику для себе."

war_beasts_cloaked_form_tech:0 "Приховані Нічні сталкери"

gecko_support_unlock_tech:0 "Розведення геконів"
gecko_support_upgrade_1:0 "Пріоритет сили"
gecko_support_upgrade_1_desc:0 "Шкіра геконів відома своєю міцністю, але їхня справжня сила — у щелепах. Селекція особин із сильнішими зубами та мускулатурою дозволить створити ще потужніших кусачок."

gecko_support_golden_tech:0 "Золоті гекони"
gecko_support_upgrade_2:0 "Особисті наглядачі"
gecko_support_upgrade_2_desc:0 "Гекони — соціальні істоти. Дозволяючи їм зв’язуватись із конкретними солдатами, ми покращуємо їхню відданість, а заохочення власних "бойових улюбленців" збільшує їхню кількість на полі бою."

gecko_support_fire_tech:0 "Вогняні гекони"
gecko_support_green_tech:0 "Зелені гекони"
gecko_support_upgrade_3:0 "Нове покоління"
gecko_support_upgrade_3_desc:0 "Нове покоління геконів — результат схрещування різних підвидів. Вони здоровіші, витриваліші та лояльніші за диких предків."

gecko_support_upgrade_4:0 "Сильна генетика"
gecko_support_upgrade_4_desc:0 "Селекція — повільний процес. Але ми можемо прискорити її. За допомогою наших лікарів, ветеринарів і генетиків ми створимо коктейль, що перетворить геконів на найміцніших малих у пустці — після Смертокігтів, звісно."