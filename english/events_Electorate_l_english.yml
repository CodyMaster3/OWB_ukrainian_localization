nf_wak.4.t:0 "До головного лікаря Бірч Гіллз"
nf_wak.4.d:0 "Дорогий докторе Тобогане,\n\nДобрий день, сподіваюся, цей лист застане вас у доброму здоров’ї. До мене дійшли чутки про постійні рейди на лікарню, і я хочу нагадати, що моя пропозиція надіслати кількох хлопців для наведення ладу все ще в силі. Серце болить, коли я чую про ці напади, і я хвилююся не лише за бабусю, але й за кожного пацієнта. Моє серце й думки завжди будуть із лікарнею.\n\nТепер до головної теми — моєї дорогої бабусі. Я знаю, що ви робите все можливе, але… останнім часом мене не покидає тривожне передчуття щодо її стану. Молюся, що ви дасте мені новини, які заспокоять цю тривогу. Я чув про вашу ідею залучити приручених Деткло — хоч я й не біолог, але це звучить як чудова ідея для всіх. Разом із цим листом надсилаю коробку гостинців як для бабусі, так і для пацієнтів загалом — скажіть, якщо їм сподобається, і я продовжу надсилати ще!\n\nЩиро ваш,\nЛагнат\n\n(P.S. Бабуся Хільда надіслала мені малюнок, схожий на те, як її улюбленця вбивають? Сподіваюся, ви зможете розібратись і переконатись, що нічого поганого не відбувається.)"
