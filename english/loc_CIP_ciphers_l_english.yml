Neomonik_copies_settler_defensive:0 "Відтворити схеми оборонного озброєння"
Neomonik_copies_settler_offensive:0 "Відтворити схеми штурмового озброєння"
Neomonik_copies_settler_support:0 "Відтворити схеми допоміжного обладнання"
Neomonik_copies_settler_vehicle:0 "Відтворити схеми бронетехніки"
Neomonik_copies_settler_engine:0 "Відтворити схеми спортивних авто"
Neomonik_copies_settler_tank:0 "Відтворити схеми танків"
Neomonik_copies_settler_fighter:0 "Відтворити схеми винищувачів"
Neomonik_copies_settler_dive:0 "Відтворити схеми пікірувальників"
Neomonik_copies_settler_bomber:0 "Відтворити схеми бомбардувальників"
Neomonik_copies_settler_boats:0 "Відтворити схеми річкових суден"
Neomonik_copies_settler_bigboats:0 "Відтворити схеми океанських суден"
Neomonik_copies_settler_tools:0 "Відтворити схеми інструментів"
Neomonik_copies_settler_management:0 "Відтворити схеми промислового планування"
Neomonik_copies_settler_architecture:0 "Відтворити архітектурні креслення"
Neomonik_copies_settler_farming:0 "Відтворити схеми сільгоспобладнання"
Neomonik_copies_settler_resources:0 "Відтворити схеми видобутку ресурсів"
Neomonik_copies_settler_computers:0 "Відтворити схеми комп’ютерної логіки"
Neomonik_copies_settler_detection:0 "Відтворити схеми радарів"
Neomonik_copies_settler_heritage:0 "Відтворити історичні військові записи"
Neomonik_copies_settler_skates:0 "Відтворити схеми ракетних ковзанів"
Neomonik_copies_settler_skates_desc:0 "§RСекунду… де ти кажеш, ці креслення знайшли?!§!"

CIP_investing_schematics_category:0 "Пошук нових схем"
CIP_investing_schematics_category_desc:0 "Пам’ятне ядро та Ківа містять лише ті креслення, які наші предки принесли з Тестового Центру. Якщо ми хочемо розширити свої знання — треба шукати далі."

CIP_first_set_of_coordinates:0 "Подорож до Монтані"
CIP_first_set_of_coordinates_desc:0 "Далеко на півночі, кажуть, є багато скарбів Старого Світу. Уже йдуть розмови про відправлення туди загону для пошуків. Але подорож буде небезпечною, тож потрібні добре навчені воїни й спорядження."

CIP_second_set_of_coordinates:0 "Подорож до Юти"
CIP_second_set_of_coordinates_desc:0 "Деякі наші кочові групи вже перетинають ріку Колорадо, щоб торгувати із західними племенами. Якщо спорядити їх додатковим добром, вони зможуть купити те, що ми шукаємо."


## Rockies War Rumble stuff
Rockies_war_rumble:0 "Гамселка в Скелястих"
rockies_rumblefest_tt:0 "Збирачі, Перехрестя Кіл та Захопники Шахт приймуть це рішення, розпочавши війну за контроль над регіоном.\n\nУсі залучені фракції отримають наступний дух, доки один не переможе:"

rocky_mountain_merger_category:0 "Гамселка в Скелястих"
rocky_mountain_merger_category_desc:0 "Нас викинули з \"Собачого Міста\", і ми змушені були ледве виживати в цих проклятих горах. Якщо хочемо повернутися до справжнього впливу — треба розчавити решту вигнанців і забрати їхні території собі!"
rocky_mountain_wargoals:0 "Захопити контроль над горами"

FOR_formable:0 "Об'єднати Скелясті Гори Колорадо"
FOR_formable_desc:0 "Та це не Денвер, але життя тут не найгірше — особливо якщо вдасться виторгувати чи вибити собі шлях назад. Як єдині притомні в цих горах, саме на нас лягла відповідальність за встановлення порядку — і ми її виконаємо."
CLJ_formable:0 "Утворити Каньйон Бомбея"
CLJ_formable_desc:0 "Захопити каньйони — майже як у старі добрі часи, коли ми стрибали на чужі ділянки та збирали здобич. Схоже, ми тут надовго, тож треба залишити свій слід. Наш безпомилковий ватажок навіть придумав нову назву на честь себе.\n\nХтось там каже Бомбею Джеку, що це нахабно — називати регіон своїм ім’ям, але він зайнятий, рахує палички динаміту."
INR_formable:0 "Утворити Плем'я Залізних Річок"
INR_formable_desc:0 "Ми досі не знаємо свого походження, але в вигнанні ми навчилися користуватись залізними ріками, що прорізають ці землі від самого Перехрестя. Вони — безвідмовні маршрути, а з ручними дрезинами ми подорожуємо як вітер. Може, колись навіть повернуться Великі Звіри, що жили на цих рейках."

## Tooltips
cipher_problems_solved_tt:0 "Ми вирішили наші найнагальніші проблеми."
CIP_unforgotten_roots_tt:0 "§HНью-Монтроуз§!, §HГленвуд-Спрінґс§! та §HІґл-Пасс§!: \n+§H2000§! населення\nЗменшення опору на §G50%§!\nЗниження вартості інтеграції на §G50%§!"
CIP_schema_unlock_tt:0 "Якщо керує Контр Азкі — відкриває §Gрішення§! для §HВивчення§! Схем, щоб покращити розуміння технологій племенем.\n\nЯкщо керує Немонік — відкриває §Gрішення§! для точного §HВідтворення§! Схем і створення передового спорядження."
cip_15_percent_core_cost_reduction_tt:0 "Отримайте постійне зниження вартості інтеграції на §G15%§!."
CIP_has_lar_coordinates_tt:0 "Відкриває §H2§! операції агентства для пошуку £cipher_schematic_texticon Схем"
CIP_no_lar_coordinates_tt:0 "Відкриває §Hрішення§! для відправлення експедицій у пошуках £cipher_schematic_texticon Схем"
CIP_montana_manpower_tt:0 "§G100-195§! людей безпечно повертаються додому"
Neomonik_settler_defense_tt:0 "Надає §GКулемети§! або §GҐатлінґ-лазери§! залежно від дослідження"
Neomonik_settler_offense_tt:0 "Надає §GВогнемети§! або §GГранатомети§! залежно від дослідження"

CIP_giant_laser_canons_tt:0 "Почніть будівництво вдосконалених версій Лазерної Гармати Тріґ, які, сподіваємось, не вибухнуть. Отримайте вдосконалену версію здатності «Останній рубіж» для ваших генералів."
ABILITY_USE_CANYON_LASER_CANNON:0 "Розгорнути Лазерну Гармату"
ABILITY_USE_CANYON_LASER_CANNON_DESC:0 "По суті — лазерний пістолет у масштабі 20:1. Ці вдосконалені версії винаходу Тріґа можуть бути встановлені стаціонарно або транспортуватися на поле бою."

cip_old_allies:0 "Друзі давнини"
cip_son_of_mesa:0 "Син Меса Верде"

