#Events
nf_cipher.1.t:0 "Покидаючи Лос-Аламос"
nf_cipher.1.d:0 "Після закінчення Другої світової війни лабораторія Лос-Аламос почала шукати нові проєкти для реалізації, адже такі компанії, як General Atomics, Poseidon Energy та інші, взялися за розвиток ядерної інфраструктури Америки. Поки General Atomics працювала над компонентами AER-9, Лос-Аламос зосередився на створенні ядерних ракет, що згодом стали основою для орбітальних ракетних баз.\n\nПроте їхні дослідження не обмежились тільки цим. Декілька науковців, прагнучи конкурувати з Vault-Tec та, за чутками, ШІ компанії Poseidon, почали розробку менших, продуктивніших комп'ютерів. Хоча АНІАК (Аналізатор, що Обчислює Числа, Інтегрує та Автоматизує) був гордістю установи, деякі вчені мріяли про персональний комп’ютер — не такий примітивний, як термінали RobCo.\n\nСтаном на 2077 рік у Лос-Аламоському центрі працювали понад 15 000 людей. Але в кінці дня 23 жовтня їх залишилось лише 80. 40 із них перебували під землею під керівництвом докторів Віллема Кларка й Себастьяна, а також полковника Ґріна. Проте на розташованому поруч ядерному випробувальному полігоні вціліла ще одна група — на поверхні.\n\nХоч їм бракувало геніальності Кларка чи військової майстерності Ґріна, ці вчені та солдати попрощалися зі своїм домом, захопили один з небагатьох працездатних прототипів персонального комп'ютера — і рушили шукати нову домівку. Перед відправленням вони взяли..."
nf_cipher.1.a:0 "...пам’ятки з Лос-Аламоса, щоб ніколи не забути"
nf_cipher.1.b:0 "...військове спорядження, щоб залишатися останніми цивілізованими"
nf_cipher.1.c:0 "...наукові документи, щоб колись завершити почате"

nf_cipher.2.t:0 "У тіні Меси"
nf_cipher.2.d:0 "Після втечі з Лос-Аламоса вчені та солдати натрапили на інших уцілілих. Це дало надію, але подальша подорож на північ показала тільки жахіття: канібалізм, мутації, рейдерство... Все це стало нормою. Ті, хто зберіг здоровий глузд, перетворювались на дикунів, що жили лише інстинктами.\n\nЗрештою, вони знайшли археологічний об’єкт — поселення корінних народів у Меса-Верде. Це був не Лос-Аламос, але зійде.\n\nРозпаковуючи речі, вони виявили: лише обмежена кількість справної техніки. Солдати мали кілька пістолетів, рушниць і небагато енергетичної зброї, а вчені — єдиний комп'ютер, трохи деталей для створення опріснювачів і вітряка, кілька свинцевих коробок з ураном та трохи медикаментів. Мізерно, але достатньо.\n\nЗа наступні десятиліття вони перетворили Месу на просте, але функціональне поселення. Та комп’ютер почав виходити з ладу. Щоб зберегти залишки знань для нащадків, вчені почали вирізати й малювати електронні схеми в Ківі — церемоніальній ямі селища. Заради цього довелося пожертвувати:"
nf_cipher.2.a:0 "Більшість урану — на живлення комп'ютера в останні дні"
nf_cipher.2.b:0 "Зброєю солдатів — без догляду вона не витримає умов"
nf_cipher.2.c:0 "Добривами — у теплицях настав неврожайний рік"

nf_cipher.3.t:0 "В’язень номер 13"
nf_cipher.3.d:0 "Минуло століття. Група, що стала називатися Шифрувальниками, напам’ять вивчала схеми, ставши майстрами математики, хоч і не розуміла, що обчислює. Плем’я вже не цілком дотримувалося первісної ідеї «цивілізованості», але Меса-Верде залишалась духовним центром. Багато хто присягався повернутись хоч раз у житті.\n\n2253 рік став найважливішим числом для племені. Тоді В’язень залишила в’язницю Тіббетс і прославилась на південному заході. У вересні, відмовившись перекладати схеми для Темної Матері Гекати, вона зупинила загін Гримучих Змій, переодягнувшись у її Дочку і віддавши наказ відступити.\n\nКрім того, В’язень уклала союз із братством Максона, що дозволило племені процвітати. В обмін на знання братство захищало поселення. Але невдовзі, з вини Печери Скорпіонів, Міста Роботів і нового набігу Псів, братству довелося піти.\n\nЗмії зникли, братство — теж. Життя в Месі знову стало виживанням. Більшість Шифрувальників жили як кочівники, ремонтували техніку, несли крихту цивілізації в пустку. Але вони не забули В’язня і те, що вона зробила. Найбільше їм запам’яталось..."
nf_cipher.3.a:0 "...її харизма."
nf_cipher.3.b:0 "...її сила."
nf_cipher.3.c:0 "...її хитрість."

nf_cipher.4.t:0 "Наша Теорема"
nf_cipher.4.d:0 "З часів нашого заснування й до подій після зустрічі з В’язнем, влада серед Шифрувальників традиційно належала двом постатям — Немоніку та Лічильнику, яким нині є Азкі. Проте світ змінюється, і ми розуміємо, що більше не можемо собі дозволити розділене керівництво. Що б не готував нам зовнішній світ, ми мусимо мати єдиного сильного лідера, інакше загинемо серед Неможливих Чисел.\n\nАзкі, що помудрів після зустрічі з В’язнем, має багато амбітних ідей. З роками він став досвідченим Лічильником, проте знаходить відхилення у своїх підрахунках, які ніколи не виникали раніше. Та попри його прагнення виправити помилки минулого, старійшини племені непокояться, що він веде плем’я до утопічної, але недосяжної мрії.\n\nНатомість Немонік прагне збереження традицій. Він теж бачив світ за межами Меси під час подорожі з В’язнем — і ця подорож тільки погіршила його ставлення до зовнішнього світу. Він хоче захистити плем’я, повернути кочівників додому і вшанувати наших пращурів, залишившись там, де ми народились — у Месі-Верде.\n\nЗрештою, питання лідерства було вирішене, адже..."
nf_cipher.4.a:0 "...Азкі використав своє Лічення, щоб запалити плем’я вогнем можливостей."
nf_cipher.4.b:0 "...Немонік об’єднав традиціоналістів і старійшин, щоб здобути заслужене лідерство."

nf_cipher.5.t:0 "Вільна Зарядка Для Спустошеної Батареї"
nf_cipher.5.d:0 "Хоч світ змінився назавжди, [CIP.GetLeader] не міг передбачити, що юний Батарея справить такий заряд на долю світу, не кажучи вже про створену ним «націю» в Чорному Каньйоні. За два десятиліття він перетворив банду рейдерів, дикунів і жадібних поселенців на об’єднану силу.\n\nЛічильник Азкі вважав, що успіх Чорного Каньйону — це приклад для наслідування, тоді як Немонік бачив у його нестабільності загрозу та наближення краху. Та більшість Шифрувальників не керувались страхом чи повагою, а радше цікавістю — як їх учили з дитинства.\n\nНа цю цікавість надійшла відповідь: до Каньйону вирушили два посланці — один від Азкі, інший від Немоніка. Батарея був здивований і зворушений, та усвідомив, що два посланці — це знак: плем’я розділене.\n\nПопри все, Батарея з Меси-Верде мав ухвалити рішення, яке могло змінити плем’я назавжди..."
nf_cipher.5.a:0 "Прохання Азкі про ресурси Каньйону — єдиний логічний вибір."
nf_cipher.5.b:0 "Допомога Немоніку у важкі часи — обов'язок, якого Батарея не міг зректись."

nf_cipher.52.t:0 "Ніщо Не Переживе Батарею"
nf_cipher.52.d:0 "Це сталося. Він не знав як або чому… хоча ні, знав. Та зараз це було неважливо. Головне — він повернувся додому. Єдине постійне в його житті, що витримало випробування часом.\n\nЗ останнім ривком він впав в обійми Гекс…\n\nВ непритомності Батарея чув лише уривки слів. Розповіді про розколотий Каньйон. Вони звинувачували його…\n\nІ тоді — інший голос:\n\n«То ти й облажався. Всі облажуються. Міг зробити краще, але ніхто не наблизився до цілі так, як ти. Вставай, Батареє. Якщо Джейк Колвелл щось і знає про тебе, так це те, що ти йдеш. Ідеш… і йдеш…»\n\nГолос Джейка з грубого монотонного перетворився на коментатора. Перед очима Батареї постала знайома лікарня, а з радіо лунав голос ведучого бейсбольного матчу на стадіоні ДейҐло…\n\n[CIP.GetLeader] вимкнув радіо.\n\n«Схоже, ти прокинувся. Добре, що ти повернувся, Батареє.»"
nf_cipher.52.a:0 "Йди одягнись і поїж. У нас багато про що поговорити."

nf_cipher.6.t:0 "Велика Гармата"
nf_cipher.6.d:0 "«Я просто не бачу сенсу відновлювати її! Ми ж уже колись налякали тих змій!»\nІсаак знав, що відмовити Тріґ у чомусь — все одно що заборонити кротокроту рити, але він мав межу.\n«А якщо конфлікт повториться? Змії. Збирачі. Далі — Перехрестя? Стрибунці? Забагато збігів. Насильство росте, ми повинні захищатись.»\n«Але ж та штука ледве працювала перший раз. Воно того варте?»\n\nІсаак мав рацію — гігантська лазерна гармата спрацювала лише раз і вибухнула. Але Тріґ встигла навчитись багато за 20 років. А вибух був… величний!\n«Цього разу буде інакше! Я оптимізую її! З новими схемами — вона буде краща й безпечніша! Це не просто збільшений лазерний пістолет, це новий винахід!»\n«Краще витратити ресурси на звичайну зброю.»\n\nВін обернувся — до них наближався Азкі. «Лічильнику Азкі, може, ви переконаєте Тріґ. Вартує нам витрачати ресурси на гармату? Чи краще зробити звичайну зброю?»\nТріґ кинула на нього погляд.\n«А може, скажеш цьому відставному вояці, що на одних старих схемах далеко не заїдемо!»\n\nАзкі зробив крок уперед, щоб розв’язати це рівняння простим рішенням."
nf_cipher.6.a:0 "«Ісаак має досвід — слід виготовити практичну зброю.»"
nf_cipher.6.b:0 "«Час на експерименти — дозвольмо Тріґ збудувати свою гармату.»"
nf_cipher.6.c:0 "«Жодна з ваших ідей не сходиться — ресурси потрібні в іншому місці.»"

nf_cipher.7.t:0 "Партнерство Коефіцієнтів"
nf_cipher.7.d:0 "Минуло багато років з того часу, як хтось із Шифрувальників згадував Братство... окрім Ісаака, звісно. Навіть на пенсії він часом думками повертався до них. Колись давно вони прийшли до Шифрувальників — союз, укладений В’язнем. Ми обмінювались знаннями, ремонтували обладнання, а натомість отримували захист від усіх загроз пустки. Коли розділ вирушив до Денвера завершити свою місію, всі були певні — це ненадовго. Та коли Ісаак почув про їхню поразку від лап Гангдогів, він змирився з їхньою загибеллю. Виправдав своє рішення піти. Аж поки не побачив знайому броню, що шкутильгала до Хіви крізь долину..."
nf_cipher.7.a:0 "«Невже вони вижили?»"
nf_cipher.71.t:0 "Доля Розділу Максона"
nf_cipher.71.d:0 "Так, схоже, вижили. Одинокий лицар прийшов з місією від нової Старійшини — Андреа. Ісаака переповнило полегшення — розділ якимось дивом вцілів у кривавій бійні Колорадо. Лицар розповів про бої зі Скорпіонячим Укусом, місто роботів і навіть зіткнення з самими Гангдогами. Азкі був не менш вражений і передав лицарю послання:\n«Передай своїй Старійшині, що ми хочемо відновити взаємну петлю — повернутись до старої схеми співпраці. Шифрувальники знову готові допомагати вам, якщо ви захистите нас.»"
nf_cipher.71.a:0 "«Разом наші знання перевершать просту суму частин!»"
nf_cipher.71.b:0 "«Чому зупинятись на знаннях? Об’єднаймо всі наші сили!»"
nf_cipher.72.d:0 "…Ні, не вижили. Принаймні, ненадовго. Лицар був виснаженим, але радий бачити знайомі обличчя. Розділ Максона вцілів — ненадовго, бо їхній притулок у бункері Сенатора Пітерсона було зруйновано. Більшість загинула, була поневолена або завербована до нового життя. Цей лицар — розвідник однієї з груп, що втекла. Тепер вони шукали притулку в племені, що колись допомогло їм.\n\nАзкі не вагався. Їхній прихід лише покращить наше рівняння успіху. Їх прийняли разом із збереженою технікою й історіями поразок. Ісаак радів, навіть якщо ці обличчя змінились настільки, що стали майже незнайомими. Та гіркий присмак підтвердженої правоти не покидав його."
nf_cipher.72.a:0 "«Я завжди знав, що все закінчиться саме так.»"

nf_cipher.8.t:0 "Нескінченний Потенціал"
nf_cipher.8.d:0 "Лічильник Азкі стояв на оглядовому майданчику Лос-Аламоського об'єкта, споглядаючи поцяткований кратерами ландшафт. Повернення Шифрувальників до дому предків… не стало тим, чого хтось очікував. Але це — шанс. Безліч схем і розумів, здатних їх читати. Навіть гулі з Резервації передавали знання, давно втрачені.\n\nДобро для пустки. Не лише для племені. Колись це було нове поняття для нас, але Азкі навчив нас, як знання може служити всім. Як показав нам колись В’язень. Хоча шлях був тернистим, підрахунок виявився позитивним. Інтерком задзижчав — обов’язки чекають. Лічильник ніколи не відпочиває, особливо коли під його опікою більше, ніж одне плем’я."
nf_cipher.8.a:0 "Схема життя постійно розростається."

nf_cipher.9.t:0 "Послідовність Перетворення"
nf_cipher.9.d:0 "Останнє плем’я в горах зазнало поразки, й здавалося, Шифрувальники нарешті скуштували справжній спокій. Немонік досяг усього, чого прагнув — технології вдосконалено без загроз традиціям. Їх кількість зростала, а Немонік, вже в поважному віці, ледве встигав усе підраховувати. Може, настав час готувати наступника. Людський мозок — як машина, має межу пам’яті. Потрібно передати мантію, вписати схеми і історії племені в нову свідомість.\n\nЙого думки повернулись на 20 років назад, до зустрічі з В’язнем. Вона змінила все. Її втручання, на краще чи гірше, підготувало нас до теперішнього успіху. Немонік часто думав, чи повернеться вона колись, щоб побачити результат.\n\nУ кутку ока щось блиснуло. Силует. На спині — священне число 13. Невже вона? Невже наша щаслива цифра повернулась?"
nf_cipher.9.a:0 "А чи, може, це було лише уявне число?"

nf_cipher.10.t:0 "Нульова Точка"
nf_cipher.10.d:0 "Лос-Аламос завжди був для Шифрувальників чимось легендарним — місцем, звідки вони походили. Але з роками вони пам’ятали про нього хіба що схеми та креслення. [CIP.GetLeader] був серед перших, хто побачив його, коли вони піднялися на радіоактивний пагорб. Костюми захисту, які відремонтувала Тріг, трималися добре, але щось було не так — чому Лос-Аламос досі такий радіоактивний? Вони чули про гульські зграйки, навіть відбивались від кількох, але не очікували такого рівня зараження.\n\nУсередині більшість комплексу була замкнена за масивними дверима з кодовим замком. Це була проста Шифра — та, яку вони всі знали й передавали з покоління в покоління. Але не простим було дуло рушниці, що дивилось просто в обличчя [CIP.GetLeader], у руках гулефікованого солдата.\n\n«Як ви сюди потрапили? Жоден живий не мав знати той код. Тут нічого нема. Усе зруйновано. Ідіть геть.»\n\nВін окинув їх поглядом, затримавшись на зношеному логотипі на костюмах.\n\n«Почекай… ці костюми… та ну, не може бути… я думав, вони всі загинули.»\n\nВін повільно опустив зброю.\n\n«Гаразд. Ви розповідаєте мені все — я розповідаю вам усе. Але, судячи з ваших облич… вам не сподобається почуте.»"
nf_cipher.10.a:0 "[CIP.GetLeader] витратив час, аби пояснити, чому Шифрувальники тут"

nf_cipher.11.t:0 "Нульова Точка, продовження"
nf_cipher.11.d:0 "Правда, схоже, була зовсім не та, на яку сподівались Шифрувальники. Гуль, що стояв перед ними, полковник Ґрін, почув їхню легенду про походження — і лише засміявся.\n\n«Оце вам так розповіли? Героїчна втеча? Що вони покинули безпечний Лос-Аламос, аби почати нове життя? Ні. Я був там. Коли впали бомби, більшість персоналу загинула одразу. Але деякі частини об'єкта вціліли. Ударні хвилі пошкодили реактор, і нижні рівні замкнуло. Ми були відрізані. Єдиний зв’язок — комп’ютерний канал. MANIAC, здається. Вчені нагорі сперечались з Кларком — мовляв, якщо відчинити люки, усіх нас залиє радіацією. Вони подумали, що ми й так приречені. І просто пішли. Забрали все, що могли. Ми були замкнені в темряві десять років. І знаєте що... я їх не звинувачую. На той момент я б зробив так само. Усі ми зробили те, що мусили — тоді і після. І після того, що ми зробили... Я не можу сказати, що ми були варті спасіння.»\n\n[CIP.GetLeader] замислився. Невже їхні предки справді так холодно покинули інших? Невже їхні обчислення були настільки безжальними?\n\n«Слухайте, тепер усе ваше. Я тут сам. Ті, хто пішов, вочевидь, зробили більше для світу, ніж ми. Таке от нове суспільство… Але якщо хочете зробити щось із цим місцем — зробіть краще, ніж ми. А якщо вам потрібна допомога, ну… я вмію тримати речі під захистом.»\n\nЯк би там не було, Шифрувальники дізналися повну правду про своє походження. Вони повернулись до Нульової Точки."
nf_cipher.11.a:0 "Але, може, деякі загадки краще лишити нерозгаданими."

nf_cipher.12.t:0 "Сім’я зі Сталі"
nf_cipher.12.d:0 "Вони прийшли зі Заходу — група броньованих воїнів і вчених у шатах. Називали себе Братством Сталі. Ми вже чули про них — один із наших колись був писарем у східному розділі. Але ці були з іншої гілки — з місця під назвою Мохаве. І, здається, знали про нас більше, ніж ми про них. Вони сказали, що прийшли спеціально до нас — хотіли побачити схеми Шифрувальників.\n\nМи не знали, що були знаменитими. Та все одно радо прийняли гостей. Їхні писарі годинами спілкувались із Лічильником, а лицарі охороняли наше поселення. Вони цікавились усім — стінами Меси, знаннями минулих днів, всім, що ми зберегли. Вони більше слухали, ніж навчали, але не пішли з порожніми руками. Відповіли на наші питання про свою броню, історію, і дещо поділились. Це допоможе нам — як і наші знання, можливо, допоможуть їм.\n\nЗрештою, вони попрощались і сказали, що мусять повертатись — їхній народ у великій небезпеці."
nf_cipher.12.a:0 "Нехай Числа Складуться на Їхню Користь"

nf_cipher.13.t:0 "Людина зі Сталі"
nf_cipher.13.d:0 "Ми вже зустрічали Братство Сталі раніше — солдатів і вчених зі сходу. Один із наших навіть був їхнім писарем. Але тепер прийшов не загін, а лише один чоловік у рясі. Отець у їхній родині. Він був стомленим, зламаним подорожжю і горем. Його звали Елайджа, і ми надали йому прихисток.\n\nТа він довго не спочивав. Розповів свою історію: як його народ багато разів атакували, як їхню фортецю в башті світла було взято, а ті, хто вижив, покинули його й пішли за іншим. Тепер він був сам.\n\nОтець Елайджа приєднався до нас — принаймні на певний час. Уже зараз він допомагає нам перекладати тексти, які були нам незрозумілі десятиліттями. Його нетрадиційні ідеї приносять наукові плоди. Якщо він залишиться, ми, безумовно, отримаємо користь… навіть якщо наші лідери трохи насторожено до нього ставляться."
nf_cipher.13.a:0 "Доданок"

nf_cipher.14.t:0 "Він Покинув Нас"
nf_cipher.14.d:0 "Елайджа пішов. Дехто з полегшенням видихає — його поведінка з часом ставала дедалі більш деспотичною та нестабільною. Але інші сумують через його втрату. Як би там не було, він мав блискучий розум і значно допоміг нам у розумінні деяких із найстаріших наших документів. Лічильник і Немонік принаймні можуть бути спокійні, що його жага контролю не завершилася спробою перевороту. Перед відходом він казав про своє бажання знайти найпотаємніші скарби Старого Світу — ті, що можуть дати йому сили помститись за всі втрати й образи. Якщо вони справді існують — і якщо він їх знайде — його ворогам слід добре підготуватись. Елайджа — не та людина, з якою можна жартувати."
nf_cipher.14.a:0 "Мінус Один Батько"
