l_english:
##Focus Tree
CIP_subtracting_troubles:0 "Віднімання проблем"
CIP_subtracting_troubles_desc:0 "Наші успіхи можуть змінитися на невдачі за мить. Останнім часом у племені накопичилось чимало питань, які треба вирішити."

CIP_leaving_los_alamos:0 "Покидаючи Лос-Аламос"
CIP_leaving_los_alamos_desc:0 "Коли небо й земля розкололися в пеклі Армагеддону, наші предки відмовилися залишатися в дослідницькому центрі Лос-Аламос. Вони вирушили в жорстокий світ назустріч невідомості."

CIP_shadow_of_the_mesa:0 "У тіні меси"
CIP_shadow_of_the_mesa_desc:0 "Меса Верде — наш дім, збудований у скелях, що здіймаються високо над пустелею. Це природна фортеця, яка оберігає нас від незліченних небезпек пустки."

CIP_the_prisoner_numbered_13:0 "В’язень під номером 13"
CIP_the_prisoner_numbered_13_desc:0 "Минуло вже два десятиліття, як до племені завітала дивна жінка. Номер на її спині — 13 — точно відповідав її долі, як тоді сказав Немонік."

CIP_adding_a_turbine:0 "Додаємо турбіну"
CIP_adding_a_turbine_desc:0 "Всю енергію для Меси Верде постачає єдина вітрова турбіна, яку підтримують у робочому стані вже майже два століття. Збудувавши ще одну, ми зможемо значно розширити наші можливості."

CIP_enhancing_the_kiva:0 "Покращення Ківи"
CIP_enhancing_the_kiva_desc:0 "Ківа — це велика яма в центрі селища, де перші Шифри вирізьбили схеми на стінах, щоб зберегти знання. Тут кожен вивчає історію, математику й наші обряди."

CIP_counting_guns:0 "Підрахунок зброї"
CIP_counting_guns_desc:0 "Функціональну зброю важко дістати в каньйонах. Треба порахувати, що ще працює, що можна полагодити, і розподілити це між людьми."

CIP_multiplying_blades:0 "Множення лез"
CIP_multiplying_blades_desc:0 "На відміну від вогнепалу, холодну зброю легше зробити або знайти. Усі Шифри навчаються самозахисту змалку — їм лише потрібне відповідне спорядження."

CIP_improve_the_water_array:0 "Поліпшення водної решітки"
CIP_improve_the_water_array_desc:0 "Селище виживає завдяки старим системам, що збирають воду з повітря. Тріґ вважає, що з новими деталями, які вона виміняла, продуктивність можна підвищити на 22.1%."

CIP_new_miracle_wheat_crop:0 "Новий урожай чудо-пшениці"
CIP_new_miracle_wheat_crop_desc:0 "Щоб виправити старі помилки, В’язень принесла нам насіння чудо-пшениці — рослини, яка ще й очищає ґрунт від радіації. Ми дбайливо зберігаємо її щороку в теплицях."

CIP_constructing_new_dwellings:0 "Будівництво нових осель"
CIP_constructing_new_dwellings_desc:0 "Меса Верде завжди обмежувала кількість мешканців. Але нові покращення в харчах і воді дозволяють нам приймати більше Шифрів щороку."

CIP_dividing_supplies_with_the_nomads:0 "Розподіл припасів із кочівниками"
CIP_dividing_supplies_with_the_nomads_desc:0 "Кожен загін забезпечує себе сам більшу частину року, але всі збираються в селищі для обміну. Було б неправильно не поділитися останніми здобутками."

CIP_relentless_foragers:0 "Невпинні Збирачі"
CIP_relentless_foragers_desc:0 "Плем’я Хангдогів витіснило інші загони з Псиного Міста, й ті осіли неподалік наших кордонів. Особливо докучають Збирачі — вони нападають на наші кочові сім’ї. Контр Азкі вже розробляє розв'язання, яке змінить наші рівняння назавжди."

CIP_out_from_the_mesa:0 "Вихід з меси"
CIP_out_from_the_mesa_desc:0 "Попри застереження Немоніка, Азкі скликає загони в каньйоні, готуючи напад на Збирачів. Час покаже, чим усе обернеться."

CIP_calculated_risks:0 "Розрахований ризик"
CIP_calculated_risks_desc:0 "Цифри завжди точні. Бої — ні. Іноді, щоб перемогти, доводиться діяти попри невідоме."

CIP_proofed_tactics:0 "Доведена тактика"
CIP_proofed_tactics_desc:0 "Наше плем’я зазвичай уникає конфліктів. Але це не означає, що ми не вміємо битися."

CIP_our_theorem:0 "Наша теорема"
CIP_our_theorem_desc:0 "Після перемоги над Збирачами плем’я збирається в Месі Верде, щоб визначити свій подальший шлях."

CIP_counter_azkee:0 "Контр Азкі"
CIP_counter_azkee_desc:0 "Повторення одного й того ж підсумку призвело до застою. Незвичні, але сміливі зміни Азкі можуть повернути Шифрам процвітання."

CIP_his_postulate:0 "Його постулат"
CIP_his_postulate_desc:0 "Азкі висуває постулат. Він стверджує: щоб отримати позитивніший результат, ніж у минулому, ми маємо повірити в нього. В його здібності. В Азкі. Коли підсумок визначає Контр — що нам іще лишається?"

CIP_accounting_for_all_factors:0 "Урахування всіх чинників"
CIP_accounting_for_all_factors_desc:0 "Ми ніколи не залежали від економіки. Ми не відкидаємо обміну, але й не підкоряємося йому. Та Контр, дізнавшись про доядерну касту «рахівників бобів», хоче вивчити їхні методи, аби ми могли стати ще кращими."

CIP_charging_a_battery:0 "Заряджаємо Батарею"
CIP_charging_a_battery_desc:0 "Батарея, народжений у племені, давно відійшов від нас. Але тепер, коли він керує в Чорному Каньйоні, час простягнути руку до нашого заблукалого сина."

CIP_revisiting_the_laser_cannon:0 "Повернення до лазерної гармати"
CIP_revisiting_the_laser_cannon_desc:0 "Колись Тріґ зібрала лазерну гармату на основі пістолетної схеми. Вона спрацювала раз — і вибухнула. З новими ресурсами ми можемо спробувати ще раз."

CIP_coefficient_partnership:0 "Коефіцієнтне партнерство"
CIP_coefficient_partnership_desc:0 "Братство Максона володіє великими знаннями та технікою. Азкі хоче зв’язатися з ними задля взаємної вигоди."

CIP_alternating_course:0 "Зміна напрямку"
CIP_alternating_course_desc:0 "Цифри, статистика, математика — все це допомагало нашим попередникам. Але ми зайшли в коло: що не змінюй, результат той самий. Щоб вирватися, треба рахувати не лише відомі, а й невідомі змінні…"

CIP_limited_arc:0 "Обмежена дуга"
CIP_limited_arc_desc:0 "Молоді Шифри питають: «Чому стріла падає, а лазер — ні?» Відповідь складна, та пов’язана з теоремами давнини. Але кожне спостереження породжує новий закон. А закони… їх можна порушити."

CIP_off_tangent:0 "Позатангенс"
CIP_off_tangent_desc:0 "Хиби в обчисленнях наростають. Навіть наші будівлі не дотримуються властивостей тангенса! Якщо точка дотику відсутня — на що нам ці домівки, окрім як притягати числові нечистоти?"

CIP_equal_members:0 "Рівні учасники"
CIP_equal_members_desc:0 "Колись казали: «Дехто рівніший за інших». Але ми знаємо краще. Завдяки Контру ми можемо скласти статистичні профілі кожного — і досягти математичної досконалості. Як ті бейсбольні картки, що до нас потрапили ззовні."

CIP_unexpected_angles:0 "Неочікувані кути"
CIP_unexpected_angles_desc:0 "Рикошет — явище і логічне, і химерне водночас. Куля рикошетить. Плазмовий заряд — ні. Яке ж чаклунство це забороняє? І головне — чи можна його здолати?"

CIP_organizational_matrices:0 "Матриці організації"
CIP_organizational_matrices_desc:0 "Бейсбольні картки допомогли створити статистику для наших 'найцінніших гравців', але цього недостатньо. Улюблений калькулятор Контра не бачив стільки роботи з часів його появи. Але Контр — один. А ми — плем’я. Повинні ж бути машини, які спростять цей процес."

CIP_irrational_members:0 "Ірраціональні члени"
CIP_irrational_members_desc:0 "Невідомі змінні — це загроза будь-де. X, якого не розв’язати. Мікросхема, що не стає на плату. Невдоволений член племені. І останніх ми бачимо дедалі більше. Ми маємо зробити з них приклад — інакше наше X стане рівним нулю."

CIP_researcher_ratio:0 "Коефіцієнт дослідників"
CIP_researcher_ratio_desc:0 "Ми не припиняємо вивчати креслення, і на горизонті з’являються нові перспективи. Щоб наздогнати та випередити сусідів, треба більше людей залучити до науки. Може, харчі та слава допоможуть знайти охочих?"

CIP_creative_quotient:0 "Коефіцієнт творчості"
CIP_creative_quotient_desc:0 "Бажання вчитися — заразне. Старійшини передають формули й десятиліття практики молодим. А ті піднесуть знання на новий рівень — і передадуть далі."

CIP_weight_of_ambition:0 "Вага амбіцій"
CIP_weight_of_ambition_desc:0 "Повернення додому буде непростим. Ті, хто стоїть на нашому шляху, сильні, а їхні союзники ще сильніші. Але в них багато ворогів. Тепер, коли ми довели свою силу в каньйонах, до нас долучаються воїни ззовні — заради слави, здобичі чи помсти."

CIP_homeward_vector:0 "Вектор додому"
CIP_homeward_vector_desc:0 "Лос-Аламос. Наш дім. Невже минуло стільки часу, що тільки наймудріші ще пам’ятають його значення? Це — неприйнятно. Готуйте плем’я. Гостріть кишенькові калькулятори. Натирайте списи. Цього дня ми йдемо на війну — і ніхто нас не зупинить!"

CIP_infinite_potential:0 "Нескінченний потенціал"
CIP_infinite_potential_desc:0 "Ми зробили це. Через незліченні рівняння, випробування віри й математично досконале лідерство Азкі ми повернули свій дім. Більше ніяких печер. Ніяких стінописів. Відтепер ми живемо як наші предки — у досконалості."

CIP_the_nemonik:0 "Немонік"
CIP_the_nemonik_desc:0 "Азкі має рацію, що варто проактивно захищатися. Але рівняння предків ще жодного разу не підводили нас. Майбутнє неможливо вберегти від невідомих змінних, не дотримуючись звичної мудрості."

CIP_unforgotten_roots:0 "Незабуті корені"
CIP_unforgotten_roots_desc:0 "Молодь вчать багатьох речей, коли вони стають самостійними. Але головне — не забувати своє походження. Лос-Аламос, можливо, вже не наш. Але Меса Верде — це новий дім. Вона вистояла століття — і вистоїть ще."

CIP_path_of_least_resistance:0 "Шлях найменшого опору"
CIP_path_of_least_resistance_desc:0 "Навіщо розв’язувати X + Y = Zⁿ, коли можна обрати простіше: 2 + 2 = 4? У нашому випадку, 2 — це ізоляція, а 4 — спокій і гармонія. Навіть якщо це не приведе до багатства, на яке сподіваються деякі."

CIP_direct_course:0 "Прямий курс"
CIP_direct_course_desc:0 "Найкоротший шлях між двома точками — пряма лінія. Нам не треба плутатись у тенетах зовнішнього світу, коли ми можемо просто йти вперед."

CIP_broken_terminals:0 "Зламані термінали"
CIP_broken_terminals_desc:0 "Полагоджений В’язнем термінал колись став благословенням — і прокляттям. Кожен новий розрахунок, кожна схема додають до обсягу пам’яті. Скоро вона скінчиться. Потрібно шукати нові термінали. Без В’язня, але разом — ми впораємось."

CIP_median_compromise:0 "Медіанне компромісне"
CIP_median_compromise_desc:0 "Ми далекі від політики, але колись гість розповів про 'підкову' — що крайнощі сходяться. Я не хочу бути радикалом, але й залишатися осторонь більше не можу. Треба зробити вибір."

CIP_refreshing_the_paint:0 "Оновлення фарби"
CIP_refreshing_the_paint_desc:0 "Нас називають 'Розфарбовані', та мало хто з нас носить фарбу. Вона — для обрядів, формул і креслень. Ми не завжди розуміємо зміст — але фарба пам’ятає. А зараз її бракує. Час поповнити запаси."

CIP_inducted_into_the_tribe:0 "Прийняті до племені"
CIP_inducted_into_the_tribe_desc:0 "Наші вороги — невідомі змінні. Але це не значить, що їх треба просто стерти. Помилка в розрахунку — ще не вирок. Як рівняння, людину можна змінити. Хоча... обряд посвяти досить важко дивитися, особливо після 11-ї невдалої спроби."

CIP_grounded_jumpers:0 "Заземлені Скакуни"
CIP_grounded_jumpers_desc:0 "Загарбники. Мерзенні покидьки, що хочуть усе й одразу. Їхні верески чути, щойно вони 'відкривають' чергову 'знахідку' на нашій землі. Я не прихильник насильства. Але для таких — інших варіантів нема."

CIP_mean_compromise:0 "Середній компроміс"
CIP_mean_compromise_desc:0 "Закон середніх значень каже: майбутнє урівноважує відхилення минулого. Азкі був помилкою — але його формули мали сенс. Моє останнє рішення як Немоніка — не забороняти обчислення рівнянь."

CIP_teaching_logarithms:0 "Вчимо логарифми"
CIP_teaching_logarithms_desc:0 "Нещодавно все в нас почало рости експоненційно — і населення, і знання, і ресурси. Десять років тому лише я й Контр знали, що таке експонента. Тепер це знають майже всі. І навіть можуть передбачити майбутнє. Я пишаюсь."

CIP_integral_territories:0 "Інтегральні території"
CIP_integral_territories_desc:0 "З розширенням кордонів ми забули про важливий компонент підсумку — інтеграл. Проведу його негайно. Наші нові сусіди краще зрозуміють нас."

CIP_less_is_more:0 "Менше — це… більше?"
CIP_less_is_more_desc:0 "Більше — завжди більше. Але наші ресурси треба тягнути на максимум. Економія та ефективність — ось наш новий девіз."

CIP_repeated_reflection:0 "Повторне віддзеркалення"
CIP_repeated_reflection_desc:0 "У пам’яті — багато уроків. Навіть через роки події слід переосмислювати. Ми не помилялися, живучи, як жили… Але, може, не варто було зберігати уран так необережно…"

CIP_remaining_constant:0 "Залишаючись сталою"
CIP_remaining_constant_desc:0 "Хто ми є, якщо забули своє минуле? Завдання Немоніка — зберігати зв’язок між минулим, теперішнім і майбутнім."

CIP_local_games:0 "Місцеві ігри"
CIP_local_games_desc:0 "І мені часом треба перепочити. Але не очікував, що азартні ігри стануть такими популярними. Монополії, двадцять одне, риболовля — мій улюблений. Спокійна гра. До того моменту, поки не зіграють реверс…"

CIP_local_chaos:0 "Місцевий хаос"
CIP_local_chaos_desc:0 "Здається, я забагато сказав про спокій. Моя спроба принести стабільність обернулася хаосом. Треба знайти розв’язок…"

CIP_transformative_series:0 "Перетворювальна послідовність"
CIP_transformative_series_desc:0 "Ми пройшли довгий шлях від своїх скромних початків. Важко повірити, що лише кілька десятиліть тому нам допомагала В’язень. Але ми виросли. Можливо, вона ще колись повернеться… я вже й обличчя її забув…"

CIP_shift_through_the_memory_core:0 "Пройтись по ядру пам’яті"
CIP_shift_through_the_memory_core_desc:0 "Колись наші предки прибули до Меси Верде з єдиним комп’ютером. Його ядро пам’яті передавалося Немоніками з покоління в покоління. Усередині досі зберігається безліч креслень."

CIP_sequence_with_no_beginning:0 "Послідовність без початку"
CIP_sequence_with_no_beginning_desc:0 "Ті, хто захопив Вузол Кола, навіть не знають свого походження. Вони не мають шансів перед нашими воїнами."

CIP_reciprical_action:0 "Зворотна дія"
CIP_reciprical_action_desc:0 "Бомбей Джек і його Скакуни обожнюють вибухи — саме так вони 'демонструють силу', коли повз проходять наші кочівники. Прийшов час показати, у кого сила справжня."

CIP_investigating_coordinates:0 "Дослідження координат"
CIP_investigating_coordinates_desc:0 "У Пустці є багато креслень, що не збереглися в Ківі. Можливо, деякі загони погодяться обшукати доядерні руїни в пошуках знань, які треба оберігати."

CIP_zero_point:0 "Нульова точка"
CIP_zero_point_desc:0 "Лос-Аламос — початок нашого шляху, місце, де перші Шифри рушили в дорогу. Коло замкнулось. І хоча нинішні мешканці не раді нас бачити — це велика подія для племені."

CIP_recovering_a_calculator:0 "Скарби Загрози з Заходу"
CIP_recovering_a_calculator_desc:0 "Ходять лише шепоти про велику битву під горами, в міфічному 'Сховищі 0'. Там нібито сплять заборонені скарби, залишені Загрозою з Заходу."

CIP_blood_from_a_boulder:0 "Кров з Болдера"
CIP_blood_from_a_boulder_desc:0 "Кажуть, науковий центр у Болдері перевершив навіть Лос-Аламос. За нього вже билися багато. Було б ганьбою не дізнатися, що ж там усередині."

CIP_knowledge_of_the_bright_moon:0 "Знання Яскравого Місяця"
CIP_knowledge_of_the_bright_moon_desc:0 "Діана, Богиня Місяця, мала багато імен у племені Близнючих Матерів. Ми ніколи не шукали конфлікту з ними, але тепер, контролюючи їхні землі, можемо вписати їх у наші стіни."

CIP_secrets_of_the_dark_moon:0 "Таємниці Темного Місяця"
CIP_secrets_of_the_dark_moon_desc:0 "Геката, Богиня Темного Місяця, була суворим голосом Півночі ще з часу свого піднесення. Її Дочки й Її Пси вже дошкуляли нам, але не можна заперечити: знання, які вони зберігають, — безмежні."

## Ideas
CIP_prisoner_charisma:0 "Харизма В'язня"
CIP_prisoner_charisma_desc:0 "Її слова були прості, але щирі. І плем’я повірило. Її голос досі лунає у згадках про ті часи."

CIP_prisoner_strength:0 "Сила В'язня"
CIP_prisoner_strength_desc:0 "Жінка з числом 13 могла перемагати будь-кого. Вона довела, що сила — це не просто м’язи, а рішучість чинити опір."

CIP_prisoner_cunning:0 "Хитрість В'язня"
CIP_prisoner_cunning_desc:0 "Деякі кажуть, що вона зламала термінал одним лише поглядом. Але всі знають: вона була розумнішою за багатьох учених до неї."

CIP_subtraction_times:0 "Вихід із негараздів"
CIP_subtraction_times_desc:0 "Наші обставини не завжди були легкими. Але навіть з мінуса можна вийти в плюс — якщо правильно рахувати."

CIP_forager_push:0 "Відвоювання каньйонів"
CIP_forager_push_desc:0 "Мандрівні Збирачі наважилися зайти занадто далеко. Пора показати їм, що ці землі мають господаря."

CIP_code_breakers:0 "Голосові Шифрувальники"
CIP_code_breakers_desc:0 "Наші мудреці можуть передати повідомлення через саму гармонію чисел. Це не просто код — це музика наших предків."

CIP_alternating_course_idea:0 "Новий напрямок"
CIP_alternating_course_idea_desc:0 "Азкі стверджує, що ми маємо змінити напрямок. Не відмовляючись від минулого — а поєднуючи його з новим баченням."

CIP_direct_course_idea:0 "Шлях Меси"
CIP_direct_course_idea_desc:0 "Пряма дорога, як промінь лазера. Без сумнівів, без хитрощів. Ми йдемо обраним шляхом — до мети."

CIP_black_canyon_trade:0 "Між двома каньйонами"
CIP_black_canyon_trade_desc:0 "Торгівля між Чорним Каньйоном та Месою стала пульсом нового життя. Ми контролюємо потік товарів, знань і впливу."

CIP_maxson_survivors:0 "Уцілілі експедиції Максона"
CIP_maxson_survivors_desc:0 "Біженці з братерського загону Максона знайшли прихисток у наших землях. Хто знає — може, їх знання ще стануть у пригоді."

CIP_painted_tribe:0 "Запаси фарби"
CIP_painted_tribe_desc:0 "Ми не фарбуємося задля прикрас. Кожна крапля має значення: для ритуалів, схем і пам’яті. І нам потрібна ще."

CIP_practicing_lasers:0 "Схеми лазерної зброї"
CIP_practicing_lasers_desc:0 "Старі креслення, відновлені з ядра пам’яті, дозволяють нам створювати власні лазерні засоби захисту й нападу."

CIP_defensive_cannons:0 "Каньйонні лазерні гармати"
CIP_defensive_cannons_desc:0 "По суті це лазерний пістолет, збільшений у 20 разів. Удосконалена версія витвору Тріґа, яку можна вмонтувати в оборону або транспортувати на поле бою."

CIP_prepare_reclaimation:0 "Підготовка до відновлення"
CIP_prepare_reclaimation_desc:0 "Ми повернемо те, що належить нам. Але для цього треба готуватися — і морально, і матеріально."

CIP_wilson_research_facility_azkee_2:0 "Наше майбутнє в Лос-Аламосі"
CIP_wilson_research_facility_azkee_2_desc:0 "До війни засновники нашого племені були науковцями в Дослідницькому центрі Лос-Аламоса. Коли вибухнула Велика війна, вони втекли звідти й заклали основу племені, використовуючи старі креслення знову й знову.\n\nТепер, коли ми знову на місці початку шляху, попереду лежить нескінченна послідовність. І ми пройдемо її — зі знанням і силою."

CIP_elijah_visiting:0 "Старійшина крокує з нами"
CIP_elijah_visiting_desc:0 "Серед наших нових гостей — загадковий старійшина на ім’я Елайджа. Його погляди нетрадиційні, але знання — безцінні."

inner_rockies_state_modifier:0 "Високі та суворі"
inner_rockies_state_modifier_desc:0 "Безжальні піки Внутрішніх Скель не пробачають помилок. Каньйони між кручами вузькі, підступні й бідні на ресурси. Тут логістика гнеться під тиском природи, а важке спорядження кидають напризволяще. Ці місця — не для тривалих кампаній. Вони — переходи до справжніх полів битви."


## Decisions
CIP_Azkee_schematics_category:0 "Вивчення знайдених схем"
CIP_Azkee_schematics_category_desc:0 "Контр Азкі оголосив, що плем’я мусить розвиватися, щоб знайти своє місце у сучасному світі. Уважне вивчення креслень, що ми зібрали, дозволить нам зрозуміти принципи, закладені в них.\n\n§YЗверніть увагу: ми не зможемо отримати все, що існує, лише за кілька років. Використовуйте наші Схеми обдумано!§!\n\nЗараз у нас є [?CIP_variable_schematics] £cipher_schematic_texticon Схем для вивчення."

Azkee_researches_settler_infantry:0 "Вивчити схеми зброї"
Azkee_researches_settler_support:0 "Вивчити схеми допоміжного спорядження"
Azkee_researches_settler_spec_ops:0 "Вивчити схеми спорядження спецпідрозділів"
Azkee_researches_settler_vehicles:0 "Вивчити схеми транспорту"
Azkee_researches_settler_planes:0 "Вивчити схеми літальних апаратів"
Azkee_researches_settler_ships:0 "Вивчити схеми кораблів"
Azkee_researches_settler_industry:0 "Вивчити схеми промислового устаткування"
Azkee_researches_settler_construction:0 "Вивчити архітектурні креслення"
Azkee_researches_sophisticated_electronics:0 "Вивчити схеми комп’ютерів"

CIP_Nemonik_schematics_category:0 "Відтворення знайдених схем"
CIP_Nemonik_schematics_category_desc:0 "Немонік з обережністю ставиться до технологій минулого, та сучасні випробування вимагають рішучих дій. Якщо ретельно відтворити обладнання за кресленнями наших предків — до останньої лінії, — ми зможемо повторити їхні здобутки.\n\n§YЗверніть увагу: ми не зможемо отримати все, що існує, лише за кілька років. Використовуйте наші Схеми обдумано!§!\n\nЗараз у нас є [?CIP_variable_schematics] £cipher_schematic_texticon Схем для відтворення."

