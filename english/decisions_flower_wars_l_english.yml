l_english:
  #Загальне
  flower_war_peacetime_countdown:0 "Припинення вогню на кордоні"
  flower_war_peacetime_countdown_desc:0 "Після останньої серії масштабних прикордонних сутичок ми разом з [ROOT.flw_enemy] відвели війська з оспорюваних територій, аби уникнути повномасштабної війни та підготуватись до наступного зіткнення. Бої незабаром поновляться — сумнівів у цьому немає!"

  flower_war_gotime_countdown:0 "Напруга на кордоні!"
  flower_war_gotime_countdown_desc:0 "Нещодавні дрібні сутички на кордоні переросли у бойові дії малих масштабів. Прикордонна війна з [ROOT.flw_enemy] може початися будь-якої миті!"

  #Ацтлан
  intel_reform1:0 "Розпочати реформи"
  intel_reform1_desc:0 "Наші агенти слабко підготовлені, що майже гарантує їх викриття. Потрібно переглянути процедури інфільтрації."

  intel_reform2:0 "Навчання боротьбі з партизанами"
  intel_reform2_desc:0 "Маючи найбільш боєздатну армію в Мезоамериці, ми вміємо управляти підкореними землями. Та наші жорсткі методи не завжди дають найкращий результат. Час переосмислити, як ефективніше використовувати агентів для зміцнення імперії."

  intel_reform3:0 "Завершити навчання оперативників"
  intel_reform3_desc:0 "Ми майже створили міцну навчальну систему для наших агентів. Навички маскування серед місцевого населення безумовно допоможуть їм."

  intel_reform4:0 "Модернізувати агентство"
  intel_reform4_desc:0 "У самому агентстві повно проблем: відсутність перевірок працівників та належних протоколів для кураторів. Більша стандартизація підвищить ефективність."

  intel_reform5:0 "Завершити реформи"
  intel_reform5_desc:0 "Основні проблеми нашої розвідки вирішено. Залишилося тільки вдосконалювати ефективність і процедури."

  wider_training:0 "Ширше коло рекрутів"
  wider_training_desc:0 "Ми зазвичай обираємо агентів із вузького кола. Розширення пошуку допоможе знайти перспективніших кандидатів.\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  1_ATE_tt:0 "Отримаєте §G+1 варіант для набору§! нового оперативника.\n"

  new_scouting_techniques:0 "Нові методи розвідки"
  new_scouting_techniques_desc:0 "Наші агенти використовують застарілі методи розвідки позицій і місцевості ворога. Це часто призводить до слабкої інформації або навіть викриття!\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  2_ATE_tt:0 "Отримаєте §G+10% розвідданих§! від агентів у полі.\n"

  refocus_army_training:0 "Перенаправити зусилля з набору"
  refocus_army_training_desc:0 "Наразі ми набираємо в армію молодих воїнів. Тимчасовий перехід до навчання криптографії може суттєво зміцнити наші позиції у цій сфері.\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  3_ATE_tt:0 "Отримаєте §G+5% до ефективності дешифрування§!."

  use_air_power:0 "Задіяти авіацію"
  use_air_power_desc:0 "Ми створили дієздатні ВПС. З правильним плануванням наші літаки можуть підтримувати операції: скидати вантажі чи евакуювати агентів.\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  4_ATE_tt:0 "Зменшує §Gризик усіх операцій на 5%§!.\n"

  smaller_than_ITZ:0 "Досягти паритету іншим шляхом"
  smaller_than_ITZ_desc:0 "На жаль, наша армія поступається чисельно війську Іцан. Замість прямої конкуренції деякі радники пропонують створювати загони спротиву просто на їхній території.\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  5_ATE_tt:0 "Підвищує §Gефективність операцій зі спротиву на 15%§!."

  help_border_war:0 "Спрямувати агентів на кордон"
  help_border_war_desc:0 "Розпочалася прикордонна війна! Потрібно швидко задіяти агентів для збору інформації про оснащення та тактику ворога.\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  6_ATE_tt:0 "Отримаєте §G+10% розвідданих§! від агентів у полі.\n"

  learn_from_foreign:0 "Вивчити закордонні війни"
  learn_from_foreign_desc:0 "Світ існує поза межами Квіткових війн. Надсилаючи агентів за кордон для вивчення розвідоперацій і можливостей іноземних держав, ми зможемо зміцнити власну силу. \n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  7_ATE_tt:0 "Відкриває §Gнового§! начальника армії.\n"

  use_naval_power:0 "Використати нашу морську силу"
  use_naval_power_desc:0 "Наш новий флот може допомогти готувати і проводити операції. Використання річок як транспортного засобу може стати геніальним способом знизити витрати.\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  8_ATE_tt:0 "Операції коштують на §G15%§! менше.\n"

  recruit_from_top:0 "Набір із верхівки суспільства"
  recruit_from_top_desc:0 "Діти елітних родин добре освічені. Варто заохотити їх спрямувати ці знання на службу Ла Фуерса Еспесіаль.\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  9_ATE_tt:0 "Отримаєте §G+1 варіант набору§! при рекрутингу нового оперативника."

  improve_security_protocol:0 "Покращити протоколи безпеки агентства"
  improve_security_protocol_desc:0 "Наші наступальні можливості зросли, але нам ще є куди рости в захисті наших таємниць. З додатковим фінансуванням ми можемо значно посилити безпеку агентства.\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  10_ATE_tt:0 "Дає §G+1 до захисту розвідданих§! для Ла Фуерса Еспесіаль.\n"

  big_expand_capabilities:0 "Значно розширити наші можливості"
  big_expand_capabilities_desc:0 "Кожен новий агент відкриває безліч нових можливостей для Ла Фуерса. На жаль, кожен новий агент вимагає значних ресурсів і часу.\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  11_ATE_tt:0 "Отримаєте §G+1 слот оперативника§! назавжди.\n"

  raid_tlaloc:0 "Підготувати рейд на лабораторії Тлалока"
  raid_tlaloc_desc:0 "Роки тому Тлалок зупинив наш наступ, застосувавши ядерну зброю. Те, чого не можемо взяти силою, здобудемо через агентів. Ми таємно готуємося до рейду на лабораторії Тлалока, щоби витягти з них усе можливе.\n\n§YПісля початку рейду нам доведеться зробити низку рішень — доленосних для наших агентів.§!\n\n§RЦе додаткова реформа. Після вибору цього рівня основної реформи вона стане недоступною!§!"
  12_ATE_tt:0 "Відкриває операцію §YРейд на лабораторії Тлалока§!."

  #Т'єрра
  tdt_cointel:0 "Створити державу безпеки"
  tdt_cointel_desc:0 "Вороги навколо нас, отже їхні агенти вже всередині. Маємо розгорнути пропагандистську кампанію для посилення пильності громадян і сил безпеки."
  tdt_defensives:0 "Фортифікувати державу"
  tdt_defensives_desc:0 "Наші вороги повсюди, і нам слід готуватися до неминучого вторгнення. Маємо дати нашим солдатам усі можливі переваги!"
  tdt_build_intel:0 "Розширити розвідку держави"
  tdt_build_intel_desc:0 "Хороший завойовник знає все про підкорених. Час дізнатися більше про народи, якими ми скоро будемо правити."
  tdt_expansions:0 "Мілітаризувати державу"
  tdt_expansions_desc:0 "Маємо зосередитись на розширенні військової промисловості, щоб зрівнятися з виробничою потужністю ворога."

  #Петро
  pet_investigate_ate:0 "Розслідувати дивні події"
  pet_investigate_ate_desc:0 "Є підстави вважати, що агенти нібито нейтральних держав проводили операції проти нас. Повне розслідування прояснить ситуацію."
  pet_investigate_itz:0 "Розслідувати дивні події"
  pet_investigate_itz_desc:0 "Є підстави вважати, що агенти нібито нейтральних держав проводили операції проти нас. Повне розслідування прояснить ситуацію."
  pet_intervene_ate:0 "Втрутитись проти Ацтлану"
  pet_intervene_ate_desc:0 "Квіткові війни переросли у більший військовий конфлікт. Пора завдати швидкої відплати тим, хто нас колись скривдив."
  pet_intervene_itz:0 "Втрутитись проти Іцан"
  pet_intervene_itz_desc:0 "Квіткові війни переросли у більший військовий конфлікт. Пора завдати швидкої відплати тим, хто нас колись скривдив."
  pet_cointel:0 "Розширити контррозвідку"
  pet_cointel_desc:0 "Зовнішні сили проникли у нашу країну. Маємо активізувати зусилля для захисту."

  #Категорії
  flower_wars:0 "Квіткові війни"
  flower_wars_desc:0 "Протягом десятиліть тривають прикордонні сутички з [ROOT.flw_enemy]. Основна боротьба точиться за три ключові регіони: Мехіко, He'la' Uuchben Ts'oon та La Tumba Compartida. Контроль над ними дає нам бонуси до стабільності, а ворогові — штрафи. Прикордонна ініціатива змінюється кожні три-чотири місяці. Якщо ми не розпалимо війну, як того вимагають наші радикали — будуть наслідки..."

  refine_operations_cat:0 "Реформувати Ла Фуерса Еспесіаль"
  refine_operations_cat_desc:0 "Славна спадщина наших воїнів часто затьмарюється фатальними помилками наших агентів. Щоб виграти Квіткові війни, нам потрібно більше, ніж армія — необхідні великі реформи."

  tdt_defend_home_cat:0 "Захистити наш дім"
  tdt_defend_home_cat_desc:0 "Темні сили оточили нас, тож маємо змінити військову і політичну стратегію. Ми повинні боронити наш дім!"
  tdt_expand_home_cat:0 "Розширити наш дім"
  tdt_expand_home_cat_desc:0 "Час знову розширюватися — завойовувати і грабувати найбажаніші цілі."

  pet_investigate_cat:0 "Реакція на іноземні операції"
  pet_investigate_cat_desc:0 "Останнім часом у країні фіксуються підозрілі активності. Слід провести розслідування."

  #Підказки
  has_flw_initiative:0 "Ми маємо ініціативу у Квіткових війнах"
  flw_cancelled:0 "§YКвіткові війни§! були припинені через війну, дипломатію або інші події"
  flw_following_happen:0 "§RПісля завершення цієї місії відбудеться наступне:§! \n"

  #Скриптові ключі
  flw_ate_name:0 "[ATE.GetNameDef]"
  flw_itz_name:0 "[ITZ.GetNameDef]"

