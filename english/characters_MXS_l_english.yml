l_english:
  MXS_INVESTOR_NAME: "Інвестор"
  MXS_INVESTOR_DESC: "Фактичний наглядач Макс Сека, Інвестор, контролює трудову систему в'язниці. Надзвичайно багатий і повністю позбавлений моралі, Інвестор не зупиниться ні перед чим, щоб витягти зі своїх в'язнів все до останньої кришки."

  MXS_WHOZ_NAME: "Хуз"
  MXS_WHOZ_DESC: "Розумний супермутант, Хуз став відомим після того, як його захопили сили НКР. Спочатку його планували стратити, але невелика група офіцерів Макс Сек запропонувала заплатити за нього в обмін на його життя. Відтоді, як він потрапив до Макс Сек'юріті, Хуз очолив видатну банду супермутантів, що діяла в стінах в'язниці. Однак, на відміну від більшості інших супермутантів у Макс Сек, Хуз зберігав пристойний статус серед інших ув'язнених. Ця риса окупилася після його втечі з в'язниці, оскільки його вміння домовлятися з конкуруючими бандами дозволило йому сформувати більшу армію. Наразі Хуз є фактичним лідером регіону. Однак це може змінитися будь-якої хвилини, оскільки колишні злочинці Макс Секу ніколи не відзначалися вірністю."
