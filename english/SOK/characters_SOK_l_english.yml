l_english:
SOK_KAGA_NAME: "Каґа"
SOK_KAGA_CHOSEN_ONE_NAME: "Обранець"
SOK_KAGA_DESC: "Як так сталося, що людина може зробити так багато — і все ж залишитися забутою заради когось іншого? Досягти стільки слави й відомості по всій Пустці, але ніхто не промовляє його імені? Каґа прожив усе своє життя в цьому пеклі. Вигнаний Обранець з Арро́йо, Каґа був позбавлений свого права народження — стати рятівником свого народу, який замість нього обрав іншого, менш достойного героя. Багато разів Каґа намагався помститися, та щоразу йому це не вдавалося. Тепер, через десятки років після останньої зустрічі, Каґа планує повернутися до дому, що відкинув його, і забрати втрачене кров’ю. Всі знатимуть і боятимуться його імені. Він подбає про це."
