#######################################
### Act I - Disaster After Disaster ###
#######################################

mxc_the_bunker:0 "Бункер Максона"
mxc_the_bunker_desc:0 "Цей бункер був тут ще до нас усіх. Якщо пощастить, він буде тут і після нас."

mxc_cleaning_armor:0 "Ремонт Броні"
mxc_cleaning_armor_desc:0 "Після війни з Псами багато наших костюмів силової броні вийшли з ладу. Щобільше — деякі були повністю знищені. Треба витратити трохи часу на відновлення того, що ще можна полагодити."

mxc_the_old_guns:0 "Що Вони Нам Залишили"
mxc_the_old_guns_desc:0 "Місто Псів приховувало багато скарбів. Наші Лицарі знайшли низку зразків енергетичної зброї минулої епохи. Можливо, нам вдасться відновити їх — або хоча б пристосувати частини для нових моделей."

mxc_scrap_runs:0 "Місії зі Збору Брухту"
mxc_scrap_runs_desc:0 "Ресурси — це влада. Особливо у часи, коли вони так рідко трапляються. Спеціалізовані загони зі збору брухту суттєво допоможуть утримати наші системи в робочому стані."

mxc_the_investigation:0 "Розслідування"
mxc_the_investigation_desc:0 ""Хто б це не був — я знаю, що це хтось із наших. Якби в нього була бодай крапля честі — вже давно б визнав свою провину. Але, як видно, ми всі різні..." — Ґленн Дірінґ"

mxc_the_traitor_found:0 "Зрадник Серед Нас"
mxc_the_traitor_found_desc:0 "Доля Андреа, і майбутнє бункера Максона, вирішуються просто зараз. \n\nБудемо сподіватися на краще."

mxc_emergency_power:0 "Активація Аварійного Живлення"
mxc_emergency_power_desc:0 "GALIVANT запропонував увімкнути аварійне живлення. З огляду на те, що у нас майже нічого не залишилося після боїв з Псами — можливість бачити без ліхтарів шолома буде дуже доречною."

mxc_clearing_the_infestation:0 "Очищення Нижніх Поверхів"
mxc_clearing_the_infestation_desc:0 "Якщо вам здається, що гірше вже не буде — ви помиляєтесь. У нижніх рівнях бункера Максона з'явилися радітаргани. GALIVANT і декількох Лицарів вже призначили на "роботу з санітарії", але додаткові сили значно пришвидшать процес."

mxc_troubles_with_greenhousing:0 "Озеленення 101"
mxc_troubles_with_greenhousing_desc:0 "Компанія Greenway Hydroponics мала значну присутність у Колорадо до війни. Хоча нам ще бракує повного розуміння їхніх досягнень, вивчення їхніх методів агропромисловості може допомогти нам стабілізувати самозабезпечення в регіоні після війни з Псами."

mxc_colorado:0 "Блюз Колорадо"
mxc_colorado_desc:0 "Колорадо — жорстоке місце. Увесь штат кишить рейдерами та самопроголошеними деспотами. Відтак, наші стосунки з місцевим населенням стануть вирішальними у формуванні нашого образу."

mxc_approaching_robot_city:0 "Доки Зустрічає Максона"
mxc_approaching_robot_city_desc: "На півночі зібралося місто роботів."

