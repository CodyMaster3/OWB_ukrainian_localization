mxc_the_war_with_the_dogs:0 "Відновлення Після Війни з Псами"
mxc_the_war_with_the_dogs_desc:0 "Ми намагалися битися з ними в Місті Псів. Ми зазнали поразки. Тепер ми збираємо сили в бункері, заліковуємо рани й сподіваємося, що стеля не обвалиться. \n\n Гірше вже бути не може..."

