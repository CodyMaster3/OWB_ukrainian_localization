mxc_1:0 "Бункер Максона"
mxc_2:0 "Повішені Псами"
mxc_3:0 "Наодинці в Темряві"

mxc_squad_delta:0 "Загін "Дуб""
mxc_squad_delta_desc:0 "Загін "Дуб" було втрачено під час Війни з Псами. Після тривалого ув'язнення на території Залізного Альянсу, вони, нарешті, повернулися додому!"
mxc_squad_omega:0 "Загін "Береза""
mxc_squad_omega_desc:0 "Загін "Береза" опинився в ізоляції в Скелястих Горах після переслідування з боку рейдерів і мародерів з Міста Псів. Після кількох місяців... вцілілі, врешті-решт, повернулись додому."

