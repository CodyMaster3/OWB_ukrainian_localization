maxson_ironmen_a:0 "Залишки Залізного Альянсу"
maxson_ironmen_a_desc:0 "Після їхньої поразки та без лідера деякі члени Залізного Альянсу виявили бажання приєднатися до нас. Ми обрали найнадійніших і «найпочесніших» серед них. Зважаючи на кількість ворогів, яких ми маємо, відмовитися від такого підкріплення силової броні — неможливо.\n\n§RЩоправда, їм усе ще треба платити за службу."

maxson_ironmen_b:0 "Ресурси Залізного Альянсу"
maxson_ironmen_b_desc:0 "Найманці Залізного Альянсу накопичили вражаючі запаси ресурсів завдяки контрактам і рабській праці. Серед іншого — компоненти для ремонту силової броні, які ми негайно заберемо собі. Раби втекли під час боїв, але самі склади залишилися повними — ми їх заберемо."

maxson_ghouls:0 "Доктрина Капітана Чжана"
maxson_ghouls_desc:0 "Капітан Чжан командував своїми людьми понад 200 років, виживаючи та воюючи на залишках того, що залишилося після апокаліпсису. Попри нещодавній конфлікт, його досвід — безцінний. Він погодився приєднатися до нашого командування в обмін на помилування для своїх солдатів. Ми тепер можемо використати ці два століття досвіду.\n\n§RХоча мовні та культурні бар’єри іноді ускладнюють роботу."

maxson_airborne:0 "Повітряний Тактикон Братства"
maxson_airborne_desc:0 "Після адаптації спорядження та додаткової підготовки наші загони силової броні можуть точніше та ефективніше проводити глибокі повітряні удари."

maxson_air_a:0 "Упор на Дирижаблі"
maxson_air_a_desc:0 "Зосередження зусиль наших Писарів і заводів на дирижаблях забезпечить швидше виробництво й покращені моделі."

maxson_air_b:0 "Упор на Транспорти"
maxson_air_b_desc:0 "Сконцентрувавшись на транспортних літаках, ми отримаємо пришвидшене виробництво та вдосконалені конструкції."

maxson_combined_idea_b:0 "Інтегровані «Союзники»"
maxson_combined_idea_b_desc:0 "Ми подолали більшість відмінностей із нашими колишніми ворогами. Частина Залізного Альянсу офіційно влилася в Братство. Більшість офіцерського складу вивчили нові мови, щоби краще взаємодіяти з капітаном Чжаном і його людьми."

maxson_warden_patrols:0 "WARDEN Колорадо"
maxson_warden_patrols_desc:0 "Після тривалих перемовин ми переконали WARDEN, що ми — підрозділ Армії США, спрямований на окупацію Денвера. Це технічно правда — а саме така правда найкраща. З його допомогою ми отримали повністю автоматизовану систему покарання й контролю для приборкання пустки."

