l_english:

maxson_circle_schism:0 "Вигнанці зі Сталі"
maxson_circle_schism_desc:0 "Наші Брати й Сестри, які піддалися впливу тривалого використання Стелс-боїв, що може зруйнувати людську психіку. Хоча вони не борються з нами напряму, вони постійно порушують спокій серед тих, кого ми захищаємо. До розколу вони складали значну частину нашого особового складу."

maxson_circle_schism_cured:0 "Коло Сталі"
maxson_circle_schism_cured_desc:0 "Після того, як ми знайшли ліки від їхнього стану в Куполі Боулдера, нам вдалося примиритися з нашими загубленими побратимами. Тепер, коли шкідливий вплив Стелс-боїв нейтралізовано, ми можемо безпечно їх використовувати."

