l_english:
# decisions
lanius_countdown_dog_city:0 "Кінцевий термін Ланія"
lanius_countdown_dog_city_desc:0 "Ланію було наказано підкорити Собаче Місто до певної дати. Не встигне? Тоді він — марний."

LAC_glory_category:0 "Звір зі Сходу"
LAC_glory_category_desc:0 "Дехто боїться Ланія, але інші знають, що його прихід принесе їм спасіння і звільнення в способах, яких вони ще не розуміють. Його перемоги — стрімкі й чесні, оплачені кров’ю. Кожна перемога дарує Ланію Славу, яка притягує до нього воїнів, здобуває допомогу від Флагстаффа або штовхає торговців з Техасу шанобливо надсилати йому дари."

LAC_summon_a_warband:0 "Скликати племінне військо!"
LAC_summon_a_warband_desc:0 "Ми можемо влаштувати велике свято, на якому Трубоголові вознесуть хвалу славі Ланія до самих небес! Після такого свята воїни гуртом приєднаються до Когорти, зміцнюючи наші лави. Втім, надто часті бенкети можуть знецінити наші історії…"

LAC_summon_a_warband_trigger_tooltip:0 "Ми повинні мати більше ніж §Y0 Слави§!!"
LAC_summon_a_warband_effect_tooltip:0 "Це свято коштуватиме §Y1 Славу§!"

LAC_slaves_to_flagstaff:0 "Надіслати Рабів до Флагстаффа"
LAC_slaves_to_flagstaff_desc:0 "Ланій може надіслати рабів до [Ces.GetLeader] як прояв вірності."

LAC_glory_1:0 "Ми здобудемо §Y1 Славу§!"

LAC_burn_the_dgs:0 "Спалити Собак"
LAC_burn_the_dgs_desc:0 "Незалежно від того, хто їхній правитель, жителі Собачого Міста поклоняються своїм псам. Яке ж це буде горе — відчувати запах смаженого м’яса своїх духів-наставників…"

iron_alliance_spawn_unit:0 "Найняти [IRN.GetNameWithFlag]"

LAC_go_west:0 "Йти на Захід"
LAC_go_west_desc:0 "Цезар зіткнувся з труднощами у своїх війнах і потребує моєї служби. І якщо східні племена не встояли проти мене, то й Вогні Вегаса не встоять!"

lanius_revolt:0 "Діадохи"
lanius_revolt_desc:0 "[CES.GetLeader] чи [LAC.GetLeader] мають визначити долю Пустки. Яке бачення Легіону виявиться справді сильнішим?"

lac_cleanup_doki:0 "Мерзенні Машини"
lac_cleanup_doki_desc:0 "Деканус Воренус був посланий уперед основної сили для розвідки регіону. Він забрів у руїни, які племінники називали «Містом Роботів» — блискучий каркас, що досі заселений машинами старого світу. Там, серед порожніх рядів і мерехтливого світла, він натрапив на дивний пристрій: червону касу, яка радісно говорила й пропонувала консервоване м’ясо з наборами салату Цезар.\n\nВін намагався проповідувати волю Цезаря, говорити про прихильність Марса та славу порядку, що йде з війною. Але машина лише відповідала збитими гаслами та веселою музикою, гордо проголошуючи незнання Цезаря й просуваючи програми лояльності та «зони без насильства для покупок». Вона не розуміла імперію, лише роздріб.\n\nВоренус розлютився. Він оголосив, що його кров — нащадок завойовників, його серце загартоване в вогні Флагстаффа, але машина просто пропонувала купони. Врешті, він пішов геть — без бою, але глибоко схвильований.\nВін повернувся до Ланія з попередженням. «Машини не бояться нас, мій володарю. Вони нас навіть не *знають*. Я кажу: спалімо це місце. Нехай дізнаються про Марса у горнилі вогню.»"

#iron_alliance_join_hangdogs_war:0 "Iron Alliance joins the war."
#iron_alliance_join_hangdogs_war_desc:0 "After having been invited to the Legion, the Iron Alliance is readying its warriors to strike south and supports its ally in the ongoing war."
#the_conquest_of_the_painted_rock:0 "The Conquest of the Painted Rock."
#the_conquest_of_the_painted_rock_desc:0 "To reach his enemies further inland, Lanius has decided to assimilate the Painted Rock tribe."
#lac_clean_up_robot_city:0 "The conquest of Dog City."
#lac_clean_up_robot_city_desc:0 "The target of Lanius's campaign was believed to be in the hands of the Hangdogs tribe. When legionary scouts arrived they discovered that it seems to have fallen into the hands of a so called 'Doki Doki', whatever that means. No matter, nothing will keep Lanius from achieving his goals! Onwards to Dog City. "
#lac_clean_up_warden:0 "The conquest of Denver."
#lac_clean_up_warden_desc:0 "The target of Lanius's campaign was believed to be in the hands of the Hangdogs tribe. When legionary scouts arrived they discovered that it seems to have fallen into the hands of a so called 'Warden', whatever that means. No matter, nothing will keep Lanius from achieving his goals! Onwards to Dog City. "
#lac_cleanup_warden:0 "Whats a Warden?"
#lac_cleanup_warden_desc:0 "We have recieved reports that Dog City is no longer in the hands of the Hangdogs, Lanius has ordered his Legion to advance regardless."
#lac_call_in_irn:0 "Call in Iron Alliance."
#lac_call_in_irn_desc:0 "Our allies are ready to join the conflict at our command."
#lac_call_in_irn_mission:0 "Iron Alliance joins the war."