SLA_VEGEIR_NAME:0 "Веґеїр"
SLA_VEGEIR_DESC:0 "Веґеїр — чоловік вражаючої статури, досі стоїть на чолі Шлаків, наслідуючи Обраного, який відвідав їх і приніс з собою мир ще в 2241 році. Але з того дня минуло понад 30 років, і Веґеїр — лише тінь самого себе. Його вражаюча фігура здається такою лише на фоні згорблених постав інших Шлаків, а колишня котяча грація поступилася важким, повільним рухам.\n\nХоча технічно він здатен виходити на поверхню, Веґеїр — як і більшість Шлаків — усе ще має глибокий страх перед опроміненим світом нагорі, посилений фізичними вадами, спричиненими сонячним світлом. Однак машини, необхідні для виживання спільноти, потребують ремонту й запчастин, яких найближче місто Модок забезпечити не може. Із виснаженням запасів Веґеїр опиняється у протистоянні з Маріною та її партизанами, які бачать у ситуації шанс на зміцнення незалежності й відродження символу розбитої зірки, що, за словами Веґеїра, давно звільнилася з кайданів.\n\nУсвідомлюючи застій у Модоці, Веґеїр вважає, що настав час поділитися своїми знаннями в сільському господарстві та будівництві з мешканцями міста. Передаючи ці вміння, він сподівається підвищити потенціал Модока й створити міцніший союз, надихаючись прикладом племінника з Аррою, який колись урятував їх у найтемніші часи. Бачення Веґеїра виходить за межі потреб лише свого народу, воно покликане сприяти прогресу та співпраці у світі нагорі, який вони тепер частково вважають домом.\n\nЗавдяки харизмі та непохитній відданості добробуту спільноти, Шлаки мають лідера, що втілює як силу, так і співчуття. Стратегічне мислення Веґеїра та його прагнення до взаємного розвитку керують їхніми контактами із зовнішнім світом, зберігаючи дух Обраного живим у серцях. Проте він може виявитися надто старим для подальшого лідерства, і, можливо, вже настав час, аби молодше обличчя взяло кермо влади, якщо Веґеїр не виправдає сподівань."

SLA_MARINA_NAME:0 "Маріна"
SLA_MARINA_DESC:0 "Маріна — палка й рішуча провідниця повстанців серед Шлаків, яка прагне звільнити свій народ від страху перед поверхнею й спонукати до справжньої незалежності. Вона вважає, що час Веґеїра минув, і нове покоління має очолити Шлаків у боротьбі за гідність, силу й самостійність. На її думку, тінь Обраного — це не спадок, а ланцюг, від якого треба звільнитися. Маріна бореться за новий символ, за нову зірку — ту, що більше не лежить у руїнах, а сяє вільно в небі."