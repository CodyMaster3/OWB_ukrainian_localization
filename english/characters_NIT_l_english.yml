l_english:
  NIT_CHIEF_NAME:0 "Вождь Джеремі Стара Рушниця"
  NIT_CHIEF_DESC:0 "Стара Рушниця Конфедерації Чорноногих прожив більше років, ніж будь-хто інший, і має не менший репертуар історій для розповіді. Його молодість минула в пригодах, мандрах сусідніми землями та збиранні сміття, яке залишило по собі зруйноване старе суспільство. Його улюблені історії - про незаймані гірські долини та витівки його дітей, але такі мирні історії не зачіпають молодь так сильно, як йому хотілося б. Оповідання про Яо Гауї та божевільних роботів були досить популярними, але найбільшим попитом користувалися розповіді про війну проти роти «Зак», нині вже неіснуючого загону солдатів, які походили з довоєнного ополчення. Їх знищення стало початком сходження Джеремі на посаду вождя, але ознаменувалося більш ніж достатнім кровопролиттям на смак Старого Рушниці.\n\nПригода - прекрасна річ, але війна - потворний звір"
  
  NIT_MORNING_STAG_NAME: "Ранковий Олень"
  NIT_MORNING_STAG_DESC: "Ранковий Олень - онук Джеремі Стара Рушниця, яскравий молодий воїн з нескінченним прагненням до звершень. На нього сильно вплинула довга історія його народу, і він прагне слави на полі бою. Ранковий Олень мріє про те, щоб одного дня відновити давні кордони свого народу, але Олдгун застерігає його, що його одержимість минулим може призвести лише до нових страждань для їхнього народу..."

  nit_blackfoot:0 "Нітапіпатапіцін"
  nit_blackfoot_desc:0 "Нііцитапі під проводом Старого Рушнициці прийняли просту філософію: у такій підступній пустці, як сьогоднішня, жити чесно і правдиво серед інших - першорядне завдання. З цією метою вони об'єдналися, як мало які інші групи в сучасному світі.\n\n\§RВони не підуть тихо!§!"