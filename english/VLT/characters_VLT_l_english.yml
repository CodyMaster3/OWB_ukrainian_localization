VLT_FIRST_CITIZEN_LYNETTE_NAME: "Перша Громадянка Лінетт"
VLT_FIRST_CITIZEN_LYNETTE_DESC: "Донька Першої Громадянки, яка зустрілася з Обраним, Лінетт разюче відрізняється від своєї матері. Вона навчалася в Боньярді й цілком готова співпрацювати з НКР, Послідовниками або навіть ґулями. Лінетт прагне підняти народ Невади, просвіщаючи його й спрямовуючи до цивілізованого життя. Дехто з критиків висміює її пацифізм, але вона вірить, що єдиний шлях для Міста-Сховища залишитися маяком знань — це бути прикладом для Пустки.\n\nВтім, Лінетт не має бажання приєднуватися до НКР. Місто-Сховище зникне, наче чорнило в молоці браміна; на її думку, набагато краще — бути світлом для світу, а не його тінню."
VLT_FIRST_CITIZEN_MAIER_NAME: "Начальник Охорони Маєр"
VLT_FIRST_CITIZEN_MAIER_DESC: "Начальник охорони Браян Маєр походить з родини іммігрантів, що оселилися в Місті-Сховищі у 2240-х, і як ті біженці, він бореться за захист цивілізації. Маєр мандрував Пусткою, захищаючи інтереси батьківщини, і розуміє, що Неваді потрібна тверда й розважлива рука для впорядкованого розвитку. Він воював із супермутантами, дикими ґулями та рейдерами, а також на власні очі бачив корупцію НКР. На його думку, подальша участь у справах НКР лише призведе до задушення останньої й найкращої надії на мир. З часом його вплив зростав, бо Маєра поважають інші члени Охорони, і він піднявся на вершину їхньої ієрархії. Тепер він готується зробити усе необхідне, щоби врятувати Місто-Сховище від усіх ворогів — як зовнішніх, так і внутрішніх."
VLT_FIRST_CITIZEN_GORDON_NAME: "Гордон із Ге́ко"
vlt_gordon_gecko_representative: "Представник Ге́ко"
vlt_gordon_of_gecko_advisor_desc: "Уяви, що ти — ґуль. А тепер уяви, що ти єдиний ґуль у цілому місті. А тепер додай до цього, що решта населення тебе ледь терпить. Ласкаво просимо до життя Гордона."
VLT_COUNCIL_NAME: "Рада Громадян"
VLT_CHAD_RANNOR_NAME: "Чад Раннор"
VLT_CHAD_RANNOR_DESC: "Раннор — один із іммігрантів, що прибули до Міста-Сховища за останні тридцять років. Сержант Охорони, який чомусь виявився ефективнішим за самого Капітана. Спроби НКР дізнатися більше про його службу були заблоковані бюрократією Міста-Сховища, але сам Раннор охоче візьме до рук свій лазерний гвинтівку заради рідного дому."

VLT_SECURITY_CHIEF_WALLACE_NAME: "Капітан Охорони Воллес"
VLT_SECURITY_CHIEF_WALLACE_DESC: "Час, проведений Воллесом у ролі керівника контролю за входом і виходом людей і вантажів з Міста-Сховища, подарував йому широкий спектр знань як про людей, так і про практичні навички. Обробка та облік торговців, які в'їжджають у місто, надали йому глибокі знання про торгівлю й економіку Пустки. Так само, спілкування з охоронцями численних караванів, які місто обслуговує щодня, зміцнили його розуміння загроз за стінами міста й того, як із ними впоратися."
VLT_FESTUS_NAME: "Фестус"
vlt_festus_advisor_token_desc: "Фестус — похмурий на вигляд ґуль із надзвичайно гнилим виглядом, який смердить, наче заражена рана. На власну думку, Фестус — геній атомної енергетики та загалом ренесансна особистість, недооцінена й незрозуміла світом. У очах інших — це неохайний, напівкомпетентний технік заводу з величезним его. Та попри все, саме він тримає енергостанцію Ге́ко в робочому стані вже десятки років. Хоча пального й залишилось мало, хто знає, що буде далі?"
VLT_THE_BRAIN_NAME: "Мізки"
vlt_brain_renewal_teacher: "Учитель Відродження"
VLT_braelynn_christopherson_name: "Брейлінн Крістоферсон"
VLT_braelynn_christopherson_desc: "Крістоферсон отримала підвищення за старанність і самовідданість під час операції проти ґулів із Ге́ко."