l_english:
eas_finest_brew:0 "Найкраще пиво Пустки"
eas_finest_brew_desc: "Істпорт — домівка майже справної довоєнної пивоварні, яку місцеві використовують на повну. Навколо неї навіть виникли свої традиції. Наприклад, відкривати пляшечку холодного на честь першого призначення на командну посаду. А ще кожен забіяка в барі знає — чим більше ти п'єш, тим міцнішим стаєш."
eas_finest_brew_desc_tt: ""

nf_eas.1.t: "Stag Stout"
nf_eas.1.d: "Пиво чорне, як ніч, міцне за смаком і вмістом алкоголю. [FROM.GetName] відкрив пляшку й добряче хильнув перед новим загоном. Їхнє гучне схвалення перетворило ковток у залп."

nf_eas.2.t: "Nannies Doppel"
nf_eas.2.d: "Темне, подвійної витримки, як і командир у хорошій обороні. Цей сорт п’ється повільно, як і відступ під обстріл. Ідеальний напій, щоб зміцнити дух перед важкою обороною."

nf_eas.3.t: "Charlestone Red Ale"
nf_eas.3.d: "Мідний відтінок, насичений аромат і хитрий післясмак. Ідеальне пиво для тих, хто будує план так само ретельно, як вариться цей ель. Один ковток — і голова працює, як штабний генератор."

nf_eas.4.t: "Tuscarora Pilsner"
nf_eas.4.d: "Чистий, освіжаючий і збалансований — як і добре налагоджена логістика. Це пиво п'ють ті, хто вміє вести постачання навіть крізь радіоактивні бурі."

nf_eas.5.t: "Lahey's Reserve"
nf_eas.5.d: "Рідкісне, витримане пиво, особистий сорт лідера країни. Його відкривають лише в особливих випадках — і кожен ковток додає не лише мужності, а й сили духу. Легенда серед пив — і командирів."