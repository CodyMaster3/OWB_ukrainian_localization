l_english:
FIE_MOTOR_RUNNER_NAME: "Мотор-Раннер"
FIE_MOTOR_RUNNER_DESC: "Укриваючись у кривавих нутрощах колись спокійного Сховища 3, чоловік, що править божевільними, сидить на своєму дріб'язковому троні. Його хмуре обличчя приховане під черепом бігорна, чиї роги закручуються, наче сколені ребра. Його вуха сповнені криків агонії та звуків вдихання джету. Його бензопила прагне крові — як і пси, що лежать біля його ніг. НКР неодноразово намагалася його вбити — й безрезультатно. Він — Мотор-Раннер."

FIE_daniel_name:0 "Деніел"
FIE_daniel_cultural_advisor_desc:0 "\"Ми маємо способи змусити тебе заговорити.\""

FIE_cook_name:0 "Кук-Кук"
FIE_cook_high_command_desc:0 "\"Хто я? Я — найстрашніший виродок, якого ти колись зустрінеш. Я Кук-Кук, сучко, і краще не забувай цього.\""

FIE_motorrunner_army_chief:0 "Мотор-Раннер"
FIE_motorrunner_army_chief_desc:0 "\"Я тут не для балачок. Я тут по справу. Або щось роби, або забирайся до біса.\""

FIE_night_terror_name:0 "Нічний Жах"
FIE_night_terror_army_chief_desc:0 "Завзятий наркоман на Кетай, Нічний Жах гарантує, що без благословення Виродків у Мохаве ніхто не буде в безпеці."