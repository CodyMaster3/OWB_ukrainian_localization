l_english:
bdt_future_tec_geck_research_facility:0 "Дослідницький Центр G.E.C.K. Future-Tec"
bdt_future_tec_geck_research_facility_desc:0 "Танцюючі-на-Кістках виникли з колишньої приватної військової компанії, що осіла на сході Орегону..."

bdt_a_tattered_mantle:0 "Подертий Плащ"
bdt_a_tattered_mantle_desc:0 "Ми боролися, та з'явився той, хто протягнув нам руку."

bdt_the_crimson_forest:0 "Багряний Ліс"
bdt_the_crimson_forest_desc:0 "Багряний Ліс — це благословення, дароване нам. Плодючий, але дивний край..."

bdt_holding_down_the_fort:0 "Утримання Фортеці"
bdt_holding_down_the_fort_desc:0 "Череп має труднощі з об'єднанням племен Танцюючих-на-Кістках. Можливо, настав час навести лад?"

bdt_he_who_showed_the_way:0 "Той, Хто Показав Шлях"
bdt_he_who_showed_the_way_desc:0 "Огидний Король показав нам, як вижити. Обпалений радіацією, безумний, але мудрий — він веде Багряних Акколітів, своїх послідовників на цій святій землі."

bdt_new_rounds_of_initiation:0 "Нові Раунди Посвяти"
bdt_new_rounds_of_initiation_desc:0 "Ті, хто постає перед Акколітами, бачать свою «троянду» — «різнобарвну купіль смерті». Вижив? Вітаємо — ти один з нас."

bdt_scarlet_trials:0 "Мелодія Така Грандіозна..."
bdt_scarlet_trials_desc:0 "Там вони співали. Похмура мелодія, що лунає між двома світами. Саме в цій пісні майорить лахміття Короля..."

bdt_a_dark_gift:0 "Темний Дар"
bdt_a_dark_gift_desc:0 "Огидний Король винагородив нашу підтримку одним зі своїх G.E.C.K.'ів — хоч і спотвореним, він все ще має силу."

bdt_the_pillars_of_rome:0 "Стовпи Риму"
bdt_the_pillars_of_rome_desc:0 "Ці кам'яні стовпи — дивина у наших землях. Їх охороняє плем'я Стовпників — диваків у вбранні з «Священної Костюмерної Юпітера». Вони дивні, але мирні."

bdt_pilgrims_of_the_steam:0 "Пілігрими Пару"
bdt_pilgrims_of_the_steam_desc:0 "Серафічні Пілігрими прибули через велику ріку, шукаючи нову віру або бажаючи навернути нас. Вони цінні союзники, навіть якщо деякі з них — вигнанці з Heaven’s Gate."

bdt_partial_steamwork_integration:0 "Часткова Інтеграція з Steamworks"
bdt_partial_steamwork_integration_desc:0 "Завдяки Пілігримам ми навчилися використовувати частину старої підземної електромережі, з’єднавшись із Парами."

bdt_the_words_of_the_wise:0 "Слова Мудрих"
bdt_the_words_of_the_wise_desc:0 "Пілігрими проповідують із дивною ритмікою. Їхні слова про віру, дух і очищення знаходять відгук у наших серцях."

bdt_clerical_militia:0 "Священні Міліції"
bdt_clerical_militia_desc:0 "Пілігрими почали формувати священні міліції, які захищають поселення від рейдерів і мутантів."

bdt_trained_geckos:0 "Дресировані Ґекко"
bdt_trained_geckos_desc:0 "Стовпники стали майстрами у дресируванні бойових ґекко. Можливо, варто їх придбати?"

bdt_a_new_outlook:0 "Новий Погляд"
bdt_a_new_outlook_desc:0 "Впорядкувавши наш дім, настав час дивитись на дику землю зовні..."

bdt_old_rivals:0 "Старі Супротивники"
bdt_old_rivals_desc:0 "У Танцюючих-на-Кістках є старі вороги. Час поквитатись."

bdt_sho_war:0 "Ганьба Шошонів"
bdt_sho_war_desc:0 "Шошони оселилися на нашій землі після вигнання. Пора повернути своє!"

bdt_shoeshone_legacy:0 "Спадщина Шошонів"
bdt_shoeshone_legacy_desc:0 "Полонені шошони розповіли нам стародавні легенди та перекази — це безцінно."

bdt_mountain_home_air_force_base:0 "Авіабаза Маунтін-Гоум"
bdt_mountain_home_air_force_base_desc:0 "Цю базу ми колись утримували. Тепер — знову! Небо — наше."

bdt_che_war:0 "Клопоти з Вокзалу"
bdt_che_war_desc:0 "Торговці з Chemult Station завжди стріляли в нас. Час показати їм, що ми — не іграшка."

bdt_the_great_artillery:0 "Велика Артилерія"
bdt_the_great_artillery_desc:0 "Ці гармати краще послужать у наших руках."

bdt_chemult_armory:0 "Хемальтський Арсенал"
bdt_chemult_armory_desc:0 "Ми знайшли чималий склад старих гвинтівок у глибині станції."

bdt_road_warriors_of_the_eighty_four:0 "Дорожні Воїни Трасси-84"
bdt_road_warriors_of_the_eighty_four_desc:0 "Моє життя згасає. Бачення тьмяніє. Лишились лиш спогади... Але я пам’ятаю Дорожнього Воїна. Ми житимемо в його пам’яті — і завоюємо 84-ту трасу!"

bdt_eas_war:0 "Траса 51"
bdt_eas_war_desc:0 "Орегонська Траса 51 проходить повз Монмут і веде на захід до Салема. Ми використаємо її для завоювань у регіоні!"

bdt_cyc_war:0 "Траса 225"
bdt_cyc_war_desc:0 "Шосе МакВея №225 було прокладене майже триста років тому. Нам потрібна ця дорога, якщо ми хочемо продовжити шлях війни!"

bdt_trl_war:0 "Траса 97"
bdt_trl_war_desc:0 "Траса США 97 — це велике шосе, що веде на північ. Починається в Каліфорнії, а завершується в Вашингтоні. Якщо ми захопимо цю дорогу — зможемо поширити свій вплив далі, ніж будь-коли!"

bdt_mdt_war:0 "Траса 20"
bdt_mdt_war_desc:0 "Траса 20 — головне шосе на півночі Орегону. Якщо ми підкоримо цю дорогу — то зможемо простягнути руку до самого Солоного Моря!"

bdt_southern_integration:0 "Південні Шляхи"
bdt_southern_integration_desc:0 "Очистивши південні дороги, ми зможемо прокласти стежку війни аж до глибин Каліфорнії!"

bdt_western_integration:0 "Західні Шляхи"
bdt_western_integration_desc:0 "Очистивши дороги на північ, ми зможемо вийти до канадської тундри!"

bdt_the_skeleton_king:0 "Король Кісток"
bdt_the_skeleton_king_desc:0 "Маючи дороги під контролем, хто нас зупинить? Наші завоювання — легендарні."

bdt_realm_of_bone:0 "Дороги з Кісток"
bdt_realm_of_bone_desc:0 "Ми вистелимо трасу 84 кістками наших ворогів. Бездонний слід із слонової кістки — наш пам’ятник в Пустці."

bdt_pact_of_darkness:0 "Пакт Темряви"
bdt_pact_of_darkness_desc:0 "Привиди Півночі помітили нас. Дивні люди в силовій броні, з червоними очима у тумані. Якщо ми укладемо союз із ними — будемо непереможними."

bdt_hail_to_the_king:0 "Слава Королю"
bdt_hail_to_the_king_desc:0 "Танцюючі-на-Кістках грають під мелодію Огидного Короля. Настав час прийняти її... і своє місце в пісні."

bdt_lessons_from_the_cathedral:0 "Уроки Собору"
bdt_lessons_from_the_cathedral_desc:0 "Танцюючі-на-Кістках присягнули Королю. Починається перший акт вистави. У його розум повертаються спогади... з втраченого життя."

bdt_the_paradox_of_peace:0 "Парадокс Миру"
bdt_the_paradox_of_peace_desc:0 "Мир — це боротьба. І чим більша боротьба — тим вища ціна. Той, хто зрікається боротися, — боягуз."

bdt_preservation_through_pain:0 "Збереження через Біль"
bdt_preservation_through_pain_desc:0 "Через біль — до еволюції. Страждання очищує. Хто не витримує — приноситься в жертву."

bdt_the_holy_flame:0 "Святе Полум’я"
bdt_the_holy_flame_desc:0 "Світ приречений на цикли зіпсованості та суду. Тільки через Святе Полум’я людство зможе звільнитися."

bdt_dreams_of_unity:0 "Мрії про Єдність"
bdt_dreams_of_unity_desc:0 "Мрійника відкинули. Вигнали. Радіація зробила його шкіру смоляною, а розум — одержимим..."

bdt_strength_of_the_mind:0 "Сила Розуму"
bdt_strength_of_the_mind_desc:0 "Ми мріємо. Ми співаємо. Та ми — самі. Ми маємо зібрати хор, щоб розбити небо і принести Третє Полум’я."

bdt_mental_stimulants:0 "Психостимулятори"
bdt_mental_stimulants_desc:0 "У нашій руці — ключі. Вони відкривають двері розуму й дають шлях до нової еволюції."

bdt_nullification_training:0 "Навчання Нейтралізації"
bdt_nullification_training_desc:0 "Та в іншій руці — замки. Полум’я гріє... але й спалює. Ми маємо вберегтись від божевілля."

bdt_unnatural_selection:0 "Ненатуральний Відбір"
bdt_unnatural_selection_desc:0 "Через голку — зумовлений спів. Ми даруємо кров ізумрудного кольору всім, хто хоче чути."

bdt_ancient_traditions:0 "Стародавні Традиції"
bdt_ancient_traditions_desc:0 "Талісмани допомагають зосередити мелодію. Вони тримають співаків від хаосу."

bdt_extending_our_grasp:0 "Аудиторія для Мелодії"
bdt_extending_our_grasp_desc:0 "Ми маємо хор, але не маємо слухачів. Прийшов час навчати їх — і судити Святим Полум’ям."

bdt_schools_of_higher_thought:0 "Школи Вищого Мислення"
bdt_schools_of_higher_thought_desc:0 "У давнину гра в карти відкривала істини. Можливо, нам теж слід повчитись у Таро."

bdt_division_infinite:0 "Нескінченний Поділ"
bdt_division_infinite_desc:0 "Кожна людина — набір елементів. У їх основі — єдине поле свідомості. Через нього звучить наш спів."

bdt_realities_infinite:0 "Нескінченні Реальності"
bdt_realities_infinite_desc:0 "Ми — лише одна з нескінченних версій себе. Через втечу від циклів ми можемо об’єднатись із іншими Я, що вже піднеслися."

bdt_union_through_blood:0 "Єдність через Пісню"
bdt_union_through_blood_desc:0 "Наші слухачі приєдналися до хору. Вони співають як ми. Вони танцюють, як ми. Вони наші."

bdt_crossing_through_the_steam:0 "Перехід через Пар"
bdt_crossing_through_the_steam_desc:0 "Король чує поклик зі сходу. Це гул з Небес. Ми маємо знайти його джерело — і зрозуміти, чому воно кличе..."

bdt_corrupting_the_steam:0 "Спів Машинам"
bdt_corrupting_the_steam_desc:0 "Пара — це енергетична мережа, що проходить під більшістю старих земель Північно-Західної Співдружності. Енергія — це думки машини, ідея, що передається на відстані. Якщо ми вплинемо на неї, то зможемо змусити нашу мелодію лунати всією Пусткою!"

bdt_secrets_of_the_gate:0 "Таємниці Брами"
bdt_secrets_of_the_gate_desc:0 "Виявляється, ми не можемо скористатися дивними енергетичними сферами Небесних, що живили їхню зброю — вони захищені складними замками. Щоб зламати їх, нам потрібно знайти пароль перезапуску. Для цього — відшукати старий термінал з оригінальними кресленнями."

bdt_fire_walk_with_me:0 "Іди по Вогню зі Мною"
bdt_fire_walk_with_me_desc:0 "Використовуючи Пару, ми виявили джерело поклику, що чув Король. Це маленьке містечко у Вашингтоні під назвою Твін-Пікс — можливо, саме воно тримає відповіді на наші питання."

bdt_deal_with_the_pilgrims:0 "Розібратися з Пілігримами"
bdt_deal_with_the_pilgrims_desc:0 "Пілігрими з Небес не приєднаються до нашої мелодії! Вони дорого за це заплатять. Якщо нечестиві не хочуть співати разом з нами — вони мають бути очищені вогнем Суду."

bdt_infiltrating_the_steamworks:0 "Проникнення в Парові Мережі"
bdt_infiltrating_the_steamworks_desc:0 "Схоже, Пілігрими намагалися з'єднати свої енергетичні лінії з нашими до того, як ми їх знищили. Тепер ми можемо завершити їхню роботу."

bdt_another_sanctified_geck:0 "Ще Один Освячений Г.Е.К.К."
bdt_another_sanctified_geck_desc:0 "Завдяки нашій вірності Огидний Король подарував нам ще один Г.Е.К.К., освячений у його мелодії."

bdt_listen_to_the_pilgrims:0 "Прислухатися до Пілігримів"
bdt_listen_to_the_pilgrims_desc:0 "Можливо, пілігрими з Небес праві? Можливо, шлях Танцюючих-на-Кістках веде лише до загибелі? Їхній лідер Каїн пропонує допомогу. Дозволимо їм очистити наші душі."

bdt_cleansing_the_crimson_forest:0 "Очищення Багряного Лісу"
bdt_cleansing_the_crimson_forest_desc:0 "Перше завдання: Багряний Ліс. Він — не дар, а прокляття. Ми повинні зцілити цю землю, як бажає Бог."

bdt_steam_blasting_the_forest:0 "Обпалення Лісу Парою"
bdt_steam_blasting_the_forest_desc:0 "Завдяки паровій зброї з Небес ми можемо знищити покручену багряність дерев і очистити землю."

bdt_reforming_the_wicked:0 "Виправлення Грішників"
bdt_reforming_the_wicked_desc:0 "Аколіти важко піддаються зміні — їхні розуми спотворені мелодією Короля. Та завдяки вірі в Бога Пара нам вдалося повернути деяких із них. Але що робити з тими, хто не піддається?"

bdt_steam_machines:0 "Парова Техніка"
bdt_steam_machines_desc:0 "Пілігрими принесли креслення парових бойових машин — з ними дороги належать нам!"

bdt_striking_at_the_source:0 "Удар у Джерело"
bdt_striking_at_the_source_desc:0 "Поки Огидний Король існує, скверна не зникне. Ми маємо вигнати його остаточно."

bdt_council_of_pilgrims:0 "Рада Пілігримів"
bdt_council_of_pilgrims_desc:0 "Рада Пілігримів — орган, під яким служить Каїн. Вони вірно йдуть шляхом Бога Пара."

bdt_armored_crusaders:0 "Броньовані Хрестоносці"
bdt_armored_crusaders_desc:0 "Ми ведемо хрестовий похід проти нечестивих — і в броні нас не спинити."

bdt_the_god_of_steam:0 "Бог Пара"
bdt_the_god_of_steam_desc:0 "Бог Пара — наш Творець. Залізний, досконалий, божественний. Його воля — Закон. Його голос — тепло Пустки."

bdt_further_steamwork_integration:0 "Дальша Інтеграція з Парою"
bdt_further_steamwork_integration_desc:0 "Ми ще краще вбудували парову мережу в наші землі."

bdt_coming_of_the_seraphs:0 "Пришестя Серафимів"
bdt_coming_of_the_seraphs_desc:0 "Серафими — праведні. Ми перемогли, і Бог Пара благословив нас."

bdt_the_first_purified_geck:0 "Перший Очищений Г.Е.К.К."
bdt_the_first_purified_geck_desc:0 "Нам вдалося «перезавантажити» та очистити один із Г.Е.К.К. аколітів від скверни."

bdt_question_of_syncretism:0 "Питання Синкретизму"
bdt_question_of_syncretism_desc:0 "Кістяки в основному прийняли віру. Можемо звернутися до Небес з проханням про возз'єднання."

bdt_seraph_crusuaders:0 "Серафимські Хрестоносці"
bdt_seraph_crusuaders_desc:0 "Тепер це не просто пілігрими — це справжні Серафимські Хрестоносці!"

bdt_communion_achieved:0 "Досягнуто Причастя"
bdt_communion_achieved_desc:0 "Ми знову в череді. Милість перемогла. У наших серцях — світло."

bdt_advisors_from_the_gate:0 "Радники з Небес"
bdt_advisors_from_the_gate_desc:0 "З Небес прибули радники, щоб допомогти з управлінням арміями."

bdt_complete_steamwork_integration:0 "Повна Інтеграція з Парою"
bdt_complete_steamwork_integration_desc:0 "Ми настільки з’єднані з Парою, що тепер стали її невід’ємною частиною."

bdt_steam_core_ingenuity:0 "Геніальність Ядра Пара"
bdt_steam_core_ingenuity_desc:0 "Парова благодать несе чисту енергію. Бог Пара дарує світло Пустці."

bdt_brothers_in_arms:0 "Брати по Зброї"
bdt_brothers_in_arms_desc:0 "Ми стоїмо пліч-о-пліч перед будь-яким ворогом."

bdt_excommunication:0 "Відлучення"
bdt_excommunication_desc:0 "Нас визнали єретиками! Старійшини Небес зраджені самим Сатаною — або ж Огидним Королем! Переконаємо їх силою!"

bdt_schism_in_the_steam:0 "Розкол у Парі"
bdt_schism_in_the_steam_desc:0 "Слово про нашу єресь поширилось. Родини з Небесного Берега прийшли до нас — бо вірять, що правда на нашому боці."

bdt_land_for_the_crusade:0 "Земля для Хрестового Походу"
bdt_land_for_the_crusade_desc:0 "Щоб виступити проти Небес, нам потрібне узбережжя. Звернемось до добрих поселенців Тимберлайну по допомогу."

bdt_the_war_for_steam:0 "Війна за Пару"
bdt_the_war_for_steam_desc:0 "Нарешті настав час почати наш великий хрестовий похід і скинути зі священної землі Пилих Престарілих, одержимих дияволом! За Серафимів! За Бога Пара!"

bdt_consolidate_heaven:0 "Об'єднання Небес"
bdt_consolidate_heaven_desc:0 "Ми вигнали Старійшин з їхніх земель, і тепер розпочався процес зцілення, щоб повернути ці землі Пара до нашої віри."

bdt_blessing_of_steam:0 "Благословення Пара"
bdt_blessing_of_steam_desc:0 "Час прийняти всю доброту Пара — руки Бога у цьому світі. Ми використаємо його силу, щоб збудувати краще майбутнє, нову епоху технологічного дива і чистоти серця."

