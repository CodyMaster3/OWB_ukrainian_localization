bdt_odious_king:0 "Огидний Король"
bdt_odious_king_desc:0 "Кілька десятиліть тому до нас із півдня прибув дивний гуль. Його здібності видавались надприродними — гіпноз, мелодії, що зваблюють. Огидний Король має неабиякий вплив на Танцюючих-на-Кістках — саме від його «Танців на кістках» пішла ця назва."

bdt_seraph_pilgrims:0 "Серафимські Пілігрими"
bdt_seraph_pilgrims_desc:0 "Група пілігримів із Небесної Брами, відома як Серафимські Володарі, прибула до наших земель. Вони намагаються навернути нас до віри Пара і принесли з собою передові технології: Парові Ядра AER, хрестоносні силові броні й навіть обладнання для під’єднання наших земель до парової енергосистеми!"

bdt_seraph_heretics:0 "Серафимські Єретики"
bdt_seraph_heretics_desc:0 "Коли Небеса визнали Серафимських Володарів єретиками, ті, хто лишився в наших землях, повстали проти старої аристократії!"

skeleton_king:0 "Король-Кістяк"

bdt_last_of_the_cathedral:0 "Останній з Кафедри"

bdt_fire_walker:0 "§RТой, Хто Йде Через Вогонь§!"
bdt_fire_walker_op:0 "§RТой, Хто Йде Через Вогонь§!"
bdt_fire_walker_op_description:0 "§RЧЕРЕЗ ТЕМРЯВУ МАЙБУТНЬОГО МИНУЛОГО\nЧАРІВНИК БАЖАЄ ПОБАЧИТИ\nОДИН ШАНС МІЖ ДВОМА СВІТАМИ\nІДИ ПО ВОГНЮ ЗІ МНОЮ§!"

bdt_lessons_of_the_cathedral_tt:0 "§gМи вдосконалюємо наші вчення.§!\n"
bdt_25_percent_core_cost_reduction_tt:0 "Постійне §G25%§! зниження вартості інтеграції осередкових територій.\n"
bdt_80_percent_reduction_for_hea_lands:0 "Постійне локальне §G80%§! зниження вартості інтеграції територій §YНебесної Брами§!.\n"
bdt_hea_angered:0 "Небесна Брама буде §Rобурена§!."
bdt_hea_pleased:0 "Небесна Брама буде §Gзадоволена§!."

TIM_move_industry_inland:0 "\n§gТимберлайн переносить промисловість углиб.§!\n"

bdt_fire_walk_with_me_tt:0 "Отримує претензію на §YТвін-Пікс§!, поблизу §Y[332.GetName]§!.\nЯкщо контролюється — відкриває спеціальне рішення для розкриття §Rсекретів§! цього міста."

bdt_secrets_of_the_gate_decision:0 "Зламати Термінал Діаграми Парового Ядра"
bdt_secrets_of_the_gate_decision_desc:0 "Щоб зламати термінал, що блокує нас від доступу до Парових Ядер Небес, ми маємо ввести вірні ключі. Якщо помилимось — доведеться чекати на повторну спробу."

bdt_fire_walk_with_me_decision:0 "Дослідити місто Твін-Пікс"
bdt_fire_walk_with_me_decision_desc:0 "Місто §YТвін-Пікс§! привернуло нашу увагу після згадок у проєкті 'Bluebook'. Там приховано щось важливе — ми повинні це знайти."

secrets_of_the_gate_tt:0 "Відкриває рішення для спроби розшифрувати захист Парових Ядер §YНебесної Брами§!."

road_warrior:0 "Воїн Доріг"

bdt_hgh_war_tt:0 "§gЩоб атакувати Небеса, краще спершу створити плацдарм. Взяти південний берег Нью-Нікеї допоможе.§!\n"

bdt_treaty_of_bend_trl_tt:0 "Це §Gвигідна угода§!, але її підписання §Rbypasses§! військові фокуси проти §YТанцюючих-на-Кістках§! та §YСтанції Чемалт§!.\nЯкщо прийнято:\n"
bdt_treaty_of_bend_bdt_tt:0 "§Y[FROM.GetName]§! §Gймовірно§! прийме цю пропозицію. Якщо приймуть — §Gbypass§! військові фокуси проти нас і Чемалта в обмін на ресурси й людей.\nЯкщо приймуть:\n"

