LNS_paladin_hancock_name:0 "Паладин Генкок"
LNS_paladin_hancock_high_command_desc:0 "Паладин Генкок — старший офіцер у Збройних силах Техаського Братства і очолює їхню військову дорадчу місію в нашій країні. Прихильник силової броні та оборонної тактики, Генкок вважається ідеальним командиром для охорони траси I-20."

LNS_scribe_duran_name:0 "Писар Дуран"
LNS_scribe_duran_high_command_desc:0 "Старший писар Братства та заступник паладина Генкока, Дуран володіє вражаючими знаннями у складних військових тактиках і технологіях. Завдяки його терплячим і ґрунтовним порадам ми змогли значно розширити наші технічні знання."

