river_young:0 "Рівер Янг"
river_young_desc:0 "Рівер Янг очолює економічну дорадчу групу Lone Star у нашій столиці, надаючи нам себе і свою команду з великим досвідом у питаннях економіки. Протягом останнього десятиліття вона допомагала відновлювати промислові райони Далласу, і її ефективний та уважний розум готовий до планування повернення інших міст."

ariel_horne:0 "Аріель Горн"
ariel_horne_desc:0 "Аріель Горн — суперечлива постать у нашому уряді. Хоча вона має багато ідей щодо використання і розподілу наших обмежених ресурсів, її ненависть до надмірностей зробила її ворогом серед еліт."

