LNS_daisy_roth_name:0 "Дейзі Рот"
LNS_daisy_roth_economic_advisor_desc:0 "Дейзі Рот — дитина з нетрів, яка змушена була самотужки виживати з найменшого віку. Завдяки ініціативі, що допомагала дітям із бідних районів, вона отримала базову освіту і змогла забезпечити себе. Її вчителі швидко помітили її обдарованість і номінували на навчання в університеті. Там вона вивчала економіку Старого Світу і розробила нові революційні підходи для Нового."

