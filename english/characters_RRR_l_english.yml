l_english:
RRR_DAN_DORVILLE_NAME:0 "Великий Ден Дорвілл"
RRR_BIG_DAN_DESC:0 "Після перевороту канібальських Скальперів Великий Ден опиняється загнаним у кут у небезпечній ситуації на Саскачевані. Його кузен Делмар вже готується прийти й покінчити зі своїм колишнім другом — і це лише початок проблем. Великий Ден почав посилено укріплювати свої табори в Червоному Укріпленні, але лише час покаже, чи зможе він відбити напад кузена й повернути певну нормальність у далеку північ."

RRR_the_wilds_name:0 "Мовчазні Ліси"
RRR_the_wilds_desc:0 "Легенд про Мовчазні Ліси безліч. Роки тому Максвелл Чейз відправив експедицію в Західні Випалені Землі, щоб розпочати заготівлю червоного папоротника й заснувати невелике поселення. По одному їх знищували чудовиська, що ховалися в хащах. Феї з давніх часів, забуті за непокору, але надто живучі, аби їх убити, збожеволіли від ворожих варіацій папороті, що росла в тих лісах. Тепер кажуть, що в тих лісах лишилися лише смерть і привиди. Для декого тиша — найстрашніше: адже вона означає, що вони вже знищили все інше."

RRR_smiling_jack_name:0 "Усміхнений Джек"
RRR_smiling_jack_desc:0 "Колись Усміхнений Джек був відважним Гірським Уткою та вірним манітобцем. Одного злощасного дня він зайшов занадто далеко на північ у пошуках зниклої жінки та потрапив у Шарлатанову Завірюху. Коли він вийшов із вогню Долі, то вже не був тим самим: тепер страхітливі Морозоброди з озера Вінніпег корилися йому, дев’ятифутовому потворному створінню, що вже навіть не могло говорити людською мовою.\n\nЙого гарчання й жахливі підлеглі переслідують нічний Гірський Утко. Подейкують, що він досі живе в Східних Випалених Лісах — але хіба таке створіння може бути чимось більшим, ніж жахливою байкою та легендою?.."

RRR_forest_expands_category:0 "Земля Шарлатанової Завірюхи"
RRR_forest_expands_category_desc:0 "Створена внаслідок експериментів Долі, Усміхнений Джек і «люди», схожі на нього, знайшли спосіб продовжити жахливу Завірюху, здобувши її знання. Мутаційні ефекти триватимуть, поки падає сніг, а дерева Випаленого Лісу й далі зміцнюватимуться завдяки цьому."

RRR_domain_growth:0 "Домініон розширюється далі"
RRR_domain_growth_desc:0 ""

nf_rrr.1.t:0 "Коріння поширюється"
nf_rrr.1.d:0 "Сьогодні коріння наших дерев почало простягатися глибоко в землю навколишніх сіл. Щойно перша шарлатанова сніжинка торкнеться їхньої землі — Морозоброди та Потвори спустяться, щоб забрати те, що вже належить нам."
nf_rrr.1.a:0 "Ще один день, ще більше ґрунту..."