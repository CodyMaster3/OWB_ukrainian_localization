WHI_PATHFINDER_NAME:0 "Слідопит"
WHI_PATHFINDER_DESC:0 "Коли Слідопит був молодим, лідерство не входило до його планів — він мав стати фермером. Проте через піднесення Камлопських виживачів багато старійшин Віслера загинули, і обов’язок вести народ упав на плечі нового покоління. Так Кіріма став Слідопитом."