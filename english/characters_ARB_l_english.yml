ARB_VANGUARD_NAME:0 "Віконт О'Браєн"
ARB_VANGUARD_DESC:0 "Підступний і безжальний, О'Браєн виріс із найманця-безрідного у пустці до лідера власного загону вже у 21 рік. Після низки безперервних перемог на півночі Канади, до нього звернулися слуги Манітобської корони з пропозицією, перед якою годі було встояти. Зібрати залишки монархістів і контрреволюціонерів, що втекли з Трьох Рік, переламати хід подій і знищити молоду Республіку. В обмін — титул віконта й влада над значними територіями, якими він зможе правити як заманеться під егідою трону.\n\nВ Арборґу він керує Хунтою як власною армією, вижимаючи з поселень усе до останньої кришки й останнього гвинта задля зростання своєї військової машини та фінансування експедицій на пошук до-воєнних технологій. Упевнений у своїй перемозі, О'Браєн вже мріє про розкішне життя та місце в підручниках історії після неминучого штурму Трьох Рік — одним ривком до слави."
