WAP_SONSEE_ARRAY_NAME:0 "Сонсі"
WAP_SONSEE_ARRAY_DESC:0 "Звільнившись із рабства під час початку занепаду Легіону, Сонсі підняла невелике повстання рабів по всій Аризоні, поки Легіон відступав зі своїх земель. Звільнивши незліченну кількість людей, вона заснувала Західних Апачі, узявши цю назву зі старих історій, які їй розповідала бабуся про їхнє походження."
WAP_dasodaha_name:0 "Дасодага"