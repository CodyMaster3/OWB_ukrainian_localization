l_english:
### Рішення ###
# Категорія
scavenging_decisions:0 "Збиральницька програма"
scavenging_decisions_desc:0 "Виробляти власне спорядження — це добре, але Пустка також є скарбницею стародавніх таємниць, які лише чекають на відкриття. Це знання часто заховане, охороняється та небезпечне для отримання. Ми можемо відправити розвідгрупи на пошуки втраченого (ризикучи їхніми життями), витративши трохи кришок. Сподіваймося, наші люди повернуться з чимось корисним."

# Запуск
begin_scavenging_program_wtt:0 "Почати збиральницьку програму"
begin_scavenging_program_wtt_desc:0 "Хоча ми й займалися пошуками раніше, настав час створити повноцінну програму з команди здобувачів під егідою нової Збиральницької програми. Вони будуть вирушати в експедиції й шукати щось вартісне. Чи повернуться вони з тим, що нам потрібно — вирішить доля."

# Скасування
dismantle_scavenging_program:0 "Припинити збиральницьку програму"
dismantle_scavenging_program_desc:0 "Ми вирішили закрити збиральницьку програму та перенаправити ресурси й робочу силу, виділені на цей проєкт. Це також дозволить повернути частину вкладених коштів."

# Автоматичні місії
toggle_scavenging_on:0 "Розпочати регулярні місії"
toggle_scavenging_on_desc:0 "Збиральницька програма нанесла на мапу низку об’єктів, вартісних для обшуку. Вони очікують нашого дозволу на початок операцій."
toggle_scavenging_on_tt:0 "Ми зможемо обрати, яке спорядження отримають пошуковці й що саме вони мають знайти."
toggle_scavenging_off:0 "Призупинити збиральницьку програму"
toggle_scavenging_off_desc:0 "Повідомити членів збиральницької програми, що вони мають припинити пошуки до подальшого розпорядження."
toggle_scavenging_off_tt:0 "§CПоточна команда завершить місію.§!\n\nПризупиняє подальші операції. Дозволяє змінити спорядження й завдання при новому старті."
scavenging_mission_automated:0 "Активна збиральницька місія"
scavenging_mission_automated_desc:0 "Збиральницька програма наразі здійснює місії. Вони продовжуватимуть, доки ми не зупинимо їх."
repeat_scavenge_tt:0 "§CПошукові місії триватимуть.§!"
repeat_scavenge_supplies_tt:0 "§RПошукові місії буде зупинено, якщо не відновити запаси людей і спорядження.§!"
repeat_scavenge_orders_tt:0 "§C\nПошуковці залишаються під особливим наказом, знижуючи ймовірність успіху.§!"
repeat_scavenge_result_tt:0 "§Y\nМи отримаємо звіт про місію:§!"

# Початкове спорядження
scavenge.101.t:0 "Спорядження для Пошуковців"
scavenge.101.d:0 "Балансування потреб усіх структур — справа непроста. Кожен вважає, що саме його завдання найважливіше. Збиральницька програма — не виняток.\n\nОчевидно, що пошуковцям треба дати інструменти, але чи можемо ми дозволити їм усе, чого вони просять?"
scavenge.101.a:0 "Стандартне спорядження"
scavenge.101.a.tt:0 "Пошукові групи не отримають додаткового спорядження.\n\n"
scavenge.101.b:0 "Транспорт"
scavenge.101.b.tt:0 "Пошуковці зможуть подорожувати далі, швидше й переносити більше завдяки транспорту.\n\n"
scavenge.101.c:0 "Силова броня"
scavenge.101.c.tt:0 "Пошуковці в силовій броні зможуть досліджувати небезпечніші й вигідніші об’єкти.\n\n"

# Початкові накази
scavenge.102.t:0 "Накази Пошуковцям"
scavenge.102.desc:0 "Збиральницька програма радить надати пошуковцям автономію для підвищення шансів успіху.\n\nПроте якщо [Root.GetLeader] вважає, що нам потрібно щось конкретне — можна дати прямий наказ.\n\nЯкщо команді не вдасться знайти саме це, вони можуть принести щось інше. Але інші потенційні знахідки можуть бути проґавлені."
scavenge.102.a:0 "Без наказів"
scavenge.102.a.tt:0 "Пошуковці самі вирішать, що шукати.\n\n§GВищий шанс знайти щось корисне.§!"
scavenge.102.b:0 "Електроніка"
scavenge.102.b.tt:0 "Пошук рідкісної електроніки й робототехніки.\n\n§CНижчий шанс знайти щось узагалі, але вища ймовірність знайти саме це.§!"
scavenge.102.c:0 "Наземний бій"
scavenge.102.c.tt:0 "Пошук техніки для покращення сухопутного бою.\n\n§CНижчий шанс знайти щось узагалі, але вища ймовірність знайти саме це.§!"
scavenge.102.d:0 "Повітря і флот"
scavenge.102.d.tt:0 "Пошук засобів для покращення авіації чи флоту.\n\n§CНижчий шанс знайти щось узагалі, але вища ймовірність знайти саме це.§!"
scavenge.102.e:0 "Індустрія"
scavenge.102.e.tt:0 "Пошук індустріальних технологій і креслень.\n\n§CНижчий шанс знайти щось узагалі, але вища ймовірність знайти саме це.§!"
scavenge.102.f:0 "Політика і філософія"
scavenge.102.f.tt:0 "Пошук старих книг, що пояснюють світ Старого Світу.\n\n§CНижчий шанс знайти щось узагалі, але вища ймовірність знайти саме це.§!"

# Брак ресурсів
scavenge.103.t:0 "Логістична Проблема"
scavenge.103.d:0 "Сьогодні вранці ми отримали звіт, що Збиральницька програма не має припасів для нової експедиції. Ми відповіли, що маємо логістичні труднощі.\n\nСлід зустрітися з ними й вирішити подальші кроки."
scavenge.103.a:0 "Вирішимо проблему."
scavenge.103.a.tt:0 "Установа чекатиме ресурсів і нових наказів.\n\n§YПотрібно знову натиснути «Розпочати пошукові місії» у Рішеннях.§!"

  # піші шукачі
  scavenge.1.t:0 "Шукачі Щось Знайшли!"
  scavenge.1.d:0 "Серед руїн довоєнного об’єкта наші шукачі натрапили на щось, що привернуло їхню увагу. Лише час покаже, чи була ця знахідка варта крові й поту, що вони пролили."
  scavenge.1.a:0 "Краще це в наших руках, ніж у руках ворогів."

  scavenge.2.t:0 "Блюз Старого Світу"
  scavenge.2.d:0 "Нашим шукачам не вдалося нічого знайти, і вони провели тижні в Пустці, ганяючись за привидами минулого. Вони настільки зациклились на тому, що було, що вже не бачать ані теперішнього, ані майбутнього. Їхня подорож — не більше ніж марна витрата часу й надій."
  scavenge.2.a:0 "Нічого не знайшовши, вони вдивляються в те, що було — згасле і вичерпане."

  scavenge.3.t:0 "Кігтесмерті З'їли Нашу Групу!"
  scavenge.3.d:0 "[ROOT.GetLeader], жахливі новини. Зграя кігтесмертів напала на нашу пошукову експедицію, обдерла з них шкіру, як з гекона на паличці. Кілька кривавих вижилих поклялися більше ніколи не повертатися на те місце."
  scavenge.3.a:0 "Це чорний день для наших людей і всієї нації."
  scav_deathclaw_tt:0 "§gДекому вдалося повернутися додому, несучи з собою жахливі історії…§!\n"

  # моторизовані шукачі
  scavenge.5.t:0 "Шукачі Тріумфували!"
  scavenge.5.d:0 "У руїнах довоєнного об’єкта наші шукачі знайшли дещо цікаве. Караван вантажівок уже прямує до [Root.Capital.GetName], доставляючи здобич експедиції. Це великий тріумф для нас!"
  scavenge.5.a:0 "Могутній крок у майбутнє."

  scavenge.6.t:0 "Наші Шукачі Нічого Не Знайшли!"
  scavenge.6.d:0 "Попри спущені шини, втрату крові й витрачене паливо, ми нічого не знайшли під час експедиції. Але може, [Root.GetLeader], справжня нагорода — це нові товариші?.."
  scavenge.6.a:0 "Забирайся з мого офісу."

  scavenge.7.t:0 "Кігтесмерть З'їв Частину Команди!"
  scavenge.7.d:0 "Схоже, один із кігтесмертів зжер наш мотоцикл і тих, хто був на ньому. Вижилі втекли як могли, але ще більше людей залишилось позаду, коли вантажівки рушили далі. Це доволі принизливо."
  scavenge.7.a:0 "Може, треба було видати їм силову броню."

  # силова броня
  scavenge.9.t:0 "Наші Шукачі Повернулись Із Перемогою!"
  scavenge.9.d:0 "Ані рейдери, ані кігтесмерті, ані супермутанти не змогли зупинити наших шукачів. Вони повернулись до [Root.Capital.GetName], вкриті кров’ю та брудом у своїй силовій броні. Нехай це стане прикладом потенціалу нашого майбутнього."
  scavenge.9.a:0 "Час для нових надій нового світу."

  scavenge.10.t:0 "Шукачі в Силовій Броні Повернулися Ні З Чим"
  scavenge.10.d:0 "Здається, що супровід у силовій броні захистив шукачів, але не допоміг їм у пошуках. Що ж, ця броня ж не надто потрібна для армії... правда?"
  scavenge.10.a:0 "Це було марно."

  scavenge.11.t:0 "Шукачів у Силовій Броні Атакували!"
  scavenge.11.d:0 "Я не розумію, як так вийшло, [Root.GetLeader], але нашу експедицію атакували. Зграя рейдерів у силовій броні провела злагоджену засідку, і розгорнулась епічна битва з десятками загиблих. Бійня знищила сусіднє поселення, і хоча багато рейдерів загинуло, ми змушені були відступити."
  scavenge.11.a:0 "Як рейдери можуть мати силову броню?"

  # запуск програми
  scavenge.15.t:0 "Збиральницька програма"
  scavenge.15.d:0 "[Root.GetLeader] вирішив створити збиральницьку програму — установу, що буде відповідальна за розвиток пошуку залишків Старого Світу. Це дасть нам перевагу в пошуку технологій у Пустці."
  scavenge.15.a:0 "Таємниці Старого Світу стануть нашими!"

  # демонтаж програми
  scavenge.16.t:0 "Згортання Програми Пошуків"
  scavenge.16.d:0 "Пошуки залишків минулого — марна справа. Настав час дивитися вперед, а не назад."
  scavenge.16.a:0 "У нас є плани кращі за це."

  # Ідеї

  # Прапори
  scavenging_underway:0 "Триває Пошукова Експедиція"
  scavenging_enabled:0 "Має Програму Пошуків"
  scavenging_dismantling:0 "Програма Пошуків Згортається"
