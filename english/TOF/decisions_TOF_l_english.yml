l_english:
famous_actress: "Всесвітньо Відома Зірка"
tof_movies:0 "Народження Зірки"
tof_movies_desc:0 "Одна з теплих спогадів серед 215-ї — як наглядач Джеріко водив їх на старий автокінотеатр після зміни. Овербос Маріанн хоче відродити цю традицію, аби здобути повагу банди: пересняти кілька старих довоєнних фільмів із головними ролями для своїх рейдерів!"

movie_barfly: "\"П’яничка\""
movie_barfly_desc: "У довоєнну епоху знімати це було, мабуть, сущим пеклом... Там же не було ні мутантів, ні іншої херні, еге ж?\nА ми просто знімемо звичайних мутів — і досить. Один гуль, якого ми спіймали під час набігу, достатньо страшний, щоби грати монстра, а наші героїчні рейдери стануть добрими хлопцями, які гамселять його за потворну пику!"

movie_love: "\"Кохання Виходить у Море!\""
movie_love_desc: "Багато хто, хто цікавиться фільмами, знає цю стрічку. Дехто вважає, що це найкраща роль Віри Кіз! Нам доведеться попрацювати не на жарт, щоби вийшла достовірна адаптація — унікальні декорації, освітлення, пошук акторів аж у Каліфорнії. Можливо, навіть знайти продюсера?\nЇж своє серце, Віро — тепер Маріанн у головних ролях!"

movie_furies: "\"Бійцівські Шалені: Останній Рубіж Форту МакҐі\""
movie_furies_desc: "У нас є кілька старих плівок цієї стрічки — бойовик, де стріляються з якихось застарілих кволих пістолів. Лажа! Ми можемо зробити краще!\nНазвемо якесь зашкварне село «Форт МакҐі», зробимо звичайний рейд, і виріжемо всіх до ноги! А ще наймемо гурт, аби грав біля камер і заглушив крики."

movie_fish: "\"Ніч Помсти Риболюдей\""
movie_fish_desc: "Цей фільм завжди було важко знімати — не було прибережної зони. Але тепер, коли частина узбережжя — наша, можна взятись за це серйозно! Сюжет: смілива рейдерка бореться проти НКРівських виродків, що пливуть із моря. А море — це як втілення корупції НКР... Символізм і всяке таке, ага?"

movie_communists: "\"Комуністи з Космосу!!\""
movie_communists_desc: "Маріанн пробувала подивитись це з хлопцями кілька разів... Але ніхто так і не второпав важливу сюжетну лінію...\n\nЩо за біса таке комуніст?\n\nФільм краще продаватиметься, якщо трохи переробити. Замість якихось там комуністів ворогами стануть легіонери, а хоробрі рейдери надеруть їм дупи й покажуть, хто тут головний!"

movie_ripper: "\"Різниця!\""
movie_ripper_desc: "Сюжет оригіналу — дівчинка, що штрикає всіх ножем. Смішно!.. Але в Маріанн — краща ідея. Дати «усім» ножі — тоді вийде масове різанина!\nА потім, ближче до фіналу, прийдуть рейдери й усіх перестріляють. Мораль? Не принось ніж на перестрілку."

movie_tokyo: "\"Токійська Порочність\""
movie_tokyo_desc: "Чомусь ми бачили тільки перші хвилини цього фільму. Плівка завжди обривалась, коли доставщик піци приходив до кімнати співачки з бару. Додумаймо сюжет самі! Можливо, хлопця звали «Токіо», і це історія падіння та спокути — як його гріхи й шрами минулого заважали йому йти вперед, поки він не став рейдером, не вкрав піцу в місцевого кухаря й не здобув кохання всього життя."