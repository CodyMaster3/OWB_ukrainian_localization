l_english:
BM_HISTORY_TITLE:0 "Коротка історія"

### OTHER ###
OTHER_OWB_DESC:0 "Велика Війна занурила світ у, здавалося б, вічну темряву й вкинула все у хаос. Людство боролося за виживання, і з десятиліттями вижилі почали об’єднуватися у дедалі більші групи.\n\nПоселенці намагаються зберегти мораль Старого Світу. Племена мандрують землями предків, полюючи та уникаючи технологій, що залишились після знищеного світу. Рейдери й далі панують у Пустці — вбивають, грабують, підпалюють. Ресурси вкрай обмежені, і безліч громад у Пустці щодня ведуть боротьбу за виживання."

### West Coast ###

WC_NAME:0 "Західне Узбережжя"
WC_DESC:0 "£GFX_west_coast_overlay                                                                                    Обпалене ядерним вогнем і полум’ям наступних війн, Західне Узбережжя Америки має багато історій для розповіді. Тут Майстер створив Єдність, тут Анклав оголосив про своє існування, тут народилася НКР. Це — горнило великих і жахливих сил, і рішення, прийняті його мешканцями в минулому, досі відлунюють у Пустці. Вплив Заходу неможливо переоцінити — на цих землях існує безліч могутніх держав, таких як інтригуючі міста-держави Нью-Ріно та Місто-Сховище, відсторонені та часто самовпевнені Пустельні Рейнджери, і непохитне, але занепале Братство Сталі. Захід — земля старіючих титанів і зростаючих наддержав.\n\nПопри численні пережиті кризи, Західне Узбережжя далеке від безпеки. Баланс сил порушено: НКР, роздута й перевантажена, бореться за цілісність Республіки та спроби проявити свою справжню силу. Ще гірше — безпека, яку дарував Колорадо, вже в минулому: схід упав перед завойовником. Легіон Цезаря — потужна імперія рабовласників, очолювана колишнім Послідовником, що слідує римській доктрині й насаджує луддизм — дедалі більше зростає, зміцнюючись кров’ю та землею, загрожуючи статус-кво списами й мачете. Ці дві сили неминуче зіштовхнуться: Бик прониже хворого Ведмедя на своїх рогах, і тендітний мир останніх десятиліть знову буде спалено."

NCR_OWB_DESC:0 "Попри величезні втрати у Битві за Наварро, НКР здобула перемогу за підтримки Братства. Минуло десятиліття, і напруга з колишніми союзниками лише зростає, а армія Республіки втратила славу, перетворившись на зібіговисько недотренованих і погано споряджених солдатів без уніфікації.\n\nВедмідь із тривогою дивиться на схід, звідки надходять повідомлення про стрімке зростання Легіону Цезаря. На півночі міста-держави набирають сили, й Республіка розмірковує над втручанням, а на півдні Баха та Братство залишаються занозою під боком."

MOT_OWB_DESC:0 "Хоча перші солдати НКР увійшли до Території Мохаве ще у 2253-му році, лише відкриття §Oдамби Гувера§! у 2273-му змусило НКР усвідомити важливість пустелі. Початкова окупація пройшла гладко, і лише за чотири місяці греблю було захоплено.\n\nПопри заперечення шефа Генлона, у 2274-му році було підписано Договір про Нью-Вегас. Для генерала Олівера це був розумний крок — у світлі відродження Мохавського Братства. НКР, можливо, й змогла завоювати Мохаве, але постає питання: чи зможе вона його втримати?"

CES_OWB_DESC:0 "Заснований групою заручників племені Чорноногих, Легіон Цезаря виріс до масштабів, які мало хто міг уявити. Майже за два десятиліття Легіон веде численні завойовницькі війни, поглинув десятки племен і знищив їхню ідентичність, перетворивши їх на сліпих прихильників Цезаря.\n\nЛегіон розглядає своїх прихильників: Білоногі поступово прихиляються перед ним, Биті Пси та Матері-Близнюки готуються до війни, а НКР спостерігає здалеку. Та Цезар прагне підкорити Вісімдесятників — бо їхнє завоювання прокладе шлях до Вегаса, його власного Риму."

BOS_OWB_DESC:0 "Їхня гучна перемога над Анклавом у Наварро стала приводом для святкування в Братстві Сталі, однак наступні роки були суворими. Джеремі Мекссон раптово помер, а його наступник Джонатан Мекссон загинув у бою. Наступного Мекссона було відправлено на схід до Вашингтона, тож Старійшини були змушені обрати когось зі своїх. Ветеранка Наварро Марі Торні стала новою лідеркою.\n\nОперації Братства не змінилися: знайти технології, вкрасти технології, знищити тих, хто не згоден. Вони розширюють свою сферу впливу, звертаючи увагу на Ші, Мохавське Братство та Арройо. НКР спостерігає з обережністю."

VEG_OWB_DESC:0 "Містер Хаус заснував RobCo до Великої Війни і використав своє багатство, щоб створити машину, яка б підтримувала його життя вічно. Прокинувшись у новому світі, він захопив контроль над Нью-Вегасом, підкоривши племена в своїх казино та подарувавши їм цивілізацію.\n\nМістер Хаус прагне повернути платинову фішку, щоб активувати своїх сек’юрітронів у сховищі й оновити їхнє програмне забезпечення. Вегас — це осине гніздо інтриг, і багато хто хоче повалити трон Лакі 38. Бенні та Кінг — головні претенденти на владу, кожен зі своїми мотивами."

VLT_OWB_DESC:0 "Оточене безкрайою пустелею, Місто-Сховище — оазис серед страждань. Попри зовнішню красу, місто є гнилим гніздом етноцентризму й нарцисизму. Місто-Сховище — найпередовіша фракція у сфері медицини в Пустці, здатна клонувати кінцівки й лікувати поранення, які іншим не під силу. Проте ці знання залишаються замкненими за мурами міста.\n\nКолишні мешканці Сховища 8 стоять перед вибором: визначити майбутнє своєї держави. Чи поширюватиметься зловісна слава Міста-Сховища — покаже час."

TRL_OWB_DESC:0 "У темних глибинах печер Орегону мешканці Нор Тролів тягнуть кричущих жертв у лагуну з ВПЕ. Колись це було місце скидання відходів військової бази Маріпоса, а нині — домівка племінних убивць.\n\nКоли ззовні пролунав відгомін кінця світу, один із охоронців Маріпоси впав у радіоактивне озеро й вийшов з нього як Перший. Старі голограми на незнайомій мові нагадують йому про втрачену людяність, але не можуть зупинити його розум від розпаду. Нора прокидається — й весь Орегон здригнеться."

WBH_OWB_DESC:0 "Вічна зима вкриває північ Америки, і в завірюсі мовчазно спостерігає небезпека. Сієтл переслідують привиди — покидьки Середнього Заходу, які мстиво блукають його руїнами.\n\nСтарійшина Безсмертний привів своїх послідовників у Сієтл, сподіваючись заснувати новий осередок Братства — але його жорстокі методи та тяжке становище перетворили осередок на монстра. Насильство, рабство й примусовий призов стали основами темної доктрини «Нео-Братства». Снігові бурі Сієтла — ідеальне прикриття для викрадень, убивств і підкорення тих, хто ще живий."

NEW_OWB_DESC:0 "Нью-Ріно відоме переважно смородом сексу та парів Джета. Його сумнівні заклади переповнені покидьками, які товпляться біля ігор у кості, карт та жінок. Алкоголь — це кров, що тече венами мешканців Ріно.\n\nСім’ї борються за вплив у місті та навколо нього. Усі мають свої плани, але перемогти може лише одна. За межами Ріно Якудза намагається розширити свій мізерний вплив, але їхні дні вже злічені."

ARR_OWB_DESC:0 "Арройо — нація єдності: племена та мешканці сховищ об’єдналися в цивілізоване суспільство на півночі. Завдяки «святому» §FG.E.K.K.§! Новий Арройо став найзаможнішим і найпрекраснішим містом Пустки, але вітер змін уже шелестить листям у лісах Нового Арройо.\n\nОбранець став Старійшиною після порятунку свого народу. Ходять легенди, про нього. Одні кажуть, що він був жорстоким божевільним, який убивав усіх заради грошей, влади та мети. Інші — що він був добросердним і допомагав кожному, кого зустрічав."

HAN_OWB_DESC:0 "Міста Старого Світу приваблюють мародерів цінною здобиччю, але лише відчайдухи наважуються зазирнути до Міста Псів. Биті Пси панують над хмарочосами, спостерігаючи за зграями диких псів, що нишпорять вулицями нижче — й самі навчають своїх собак мистецтву війни.\n\nПоки Легіон Цезаря швидко завойовує нові землі, Биті Пси уважно стежать за півднем, очікуючи на появу Бика. Скоро Бик і Пес зійдуться в бою, що визначить майбутнє Колорадо."

HEA_OWB_DESC:0 "Первісно мирна християнська держава, заснована пастором і його паствою, Вища Церква перетворилась на мілітаризованих фанатиків, що вірять у Бога з непробивним запалом. Її промисловість майже повністю працює на парових осердях — мініатюрних парогенераторах, які поміщаються в долоні.\n\nРізанина Невинних змінила погляд Церкви на чужинців назавжди. Піднесення Святого Михаїла до влади ще більше радикалізувало духовенство, і тріщини вже починають з’являтись. Незабаром усі чужинці стануть грішниками в очах Господа."

MOJ_OWB_DESC:0 "Засноване Батьком Елайджою — писарем, який дивом став Старійшиною Братства — Мохавське Братство виникло як експедиція в пустелю Мохаве. Попри оптимістичний початок, результати були мізерними, що дуже дратувало Елайджу.\n\nІз фортеці в Хайден-Веллі Мохавське Братство готується до нових експедицій по пустці — за відчайдушним наказом Елайджі. Він марить про Старий Світ і про владу сонця. Але чи поділяють його бачення підлеглі — ще належить з’ясувати."

BRK_OWB_DESC:0 "§YДля досвідчених жителів Пустки§!. Крижані скелі й уламки доядерних кораблів чудово доповнюють викривлену природу Зламаного Берега, чий берег усіяний мінітрагедіями. Життя тут тяжке, й єдине, що знають місцеві — це грабунок. Для них насильство — це саме життя.\n\nПредки нинішніх піратів Зламаного Берега пережили Велику Завірюху — подію, що настала одразу після Великої Війни й закрила небо, знищивши тисячі. Виживання в них у крові. Коли поселенці бачать рейдерів Зламаного Берега, вони не чинять опір — вони тікають."

#  KHA_OWB_DESC:0 "Made ravenous by the numerous defeats laid at their feet, the Great Khans are desperate to prove their worth to the wasteland at large—and to themselves. With their backs against the wall as the Mojave sizes them up, they must bare their teeth, lest the Khan legacy die out with them.\n\nThe pressure is mounting as old foes rear their heads once more, and the Longhouse splinters as options lessen by the day. In the midst of the uncertainty, Papa Khan, and Regis—his right hand man—lock horns over the future of the gang. Whoever comes out on-top will change the identity of the Great Khans—forever."
EUR_OWB_DESC:0 "Стійкість Еврики — саме по собі доказ, що дива можливі. Після Великої Війни вторгнення Болотників майже знищило місто, але евриканці поколіннями боролися за право жити в рідному краї. Хоч відтоді минуло лише кілька десятиліть, відколи Портмайстри вигнали загарбників, Еврика вже дивиться назовні. Сама громада не прагне розширення, однак усі сусідні сили — так. І Арройо, і НКР невдовзі стануть екзистенційною загрозою."

MDT_OWB_DESC:0 "Колись Мозкопивці були просто черговим плем’ям, що пожирало своїх і нападало на Танцюючих-на-Кістках зі сходу. Але все змінилося з прибуттям Месмеральди. Ця харизматична Гадюка переконала Мозкопивців, що вона — справжня королева, втілення персонажки «Месмеральди» з коміксів про Ґроґнака-варвара! Її «магічні реліквії» й «алхімічні ліки» можуть переконати кого завгодно думати, як вона.\nКоролева Горгон мріє підкорити весь Орегон. Але чи зможе хтось її зупинити?"

VIC_OWB_DESC:0 "Перлина Тихоокеанського північного заходу — Нью-Вікторія — лишалася незавойованою з часів краху Старого Світу. Її очолює династія Королев і захищає досвідчений флот, що тримає узбережжя в безпеці. Це бастіон стабільності в хаотичному регіоні. Колишній плацдарм армії США для кампаній у Китаї на півночі Тихого океану й Алясці, острів має великі запаси передових технологій. Вони стануть у пригоді, бо через море вже визирає претендент — Зламаний Берег, пірати якого жадають здобичі."

TIM_OWB_DESC:0 "Чесні й доброзичливі мешканці Лісового Рубежу — промінь світла в землі, затіненій жорстокими рейдерами й канібалами. Нащадки лісорубів, скаутів і єгерів, вони живуть у гармонії з лісами, що стали їхнім домом, і дають прихисток мандрівникам і нужденним. Канібали, які хочуть покинути темні звичаї, особливо вітаються — тут знають, як лікувати таку залежність. Подейкують, що в глибинах лісу мешкають ще дивніші істоти, але дивні байки — звична річ у Пустці."

PMR_OWB_DESC:0 "Паща — притулок піратів, рейдерів, негідників усіх мастей і прибутковий ринок рабів та наркотиків, що циркулюють узбережжям. Її контролюють кілька банд, яких об’єднала як хитра риторика, так і жорстокість Ґрейнджер Шторм та її команди. Вона мріє зробити Пащу найбільшим злочинним центром західного узбережжя. Але здійснити це буде нелегко — чорні примари з Вашингтону, бунтівні раби й нав’язлива залежність від наркотиків не дрімають. Найкращий шанс — присягнути на вірність Безсмертному."

BDT_OWB_DESC:0 "Танцюючі-на-Кістках — ритуальні рейдери, нащадки старої ПВК, що колись охороняла дослідницький центр Future-Tec. Маючи запас зброї й деяку кількість компонентів §FG.E.K.K.§! (хоч і не до кінця розуміючи, як вони працюють), вони змогли підкорити східний Орегон. Останні роки стали для них важкими — дивні культи та релігійні паломники підривають їхню єдність.\n\nНині 2275 рік, і лишається побачити, чи зможе Краніум втримати владу — чи хтось інший очолить Танцюючих-на-Кістках?"

MLT_OWB_DESC:0 "Н'Ґаста! Квата! Квакіс!\nІз західних берегів Орегону править темне плем’я. Їхні язики спотворені, розум зіпсований — вони вірять, що вижити в Пустці можна лише ставши звіром, і що тільки прадавнє й таємне знання може дарувати спасіння.\nКораловий Суд — таємнича рада — керує Плем'ям Болотників. Вони прославляють великого бога М’лулу, гігантську Королеву Болотників, яку вважають божеством.\nЦарство людей потоне під хвилями, і царство М’Лайє зійде на трон."

DIS_OWB_DESC:0 "Розпач оселився в серцях тих, хто вшановує Рудого Чоловіка. Вигнані зі своїх домівок, Апостоли ледве вижили у кривавій війні з канібалами. Тепер, відновлюючи сили, вони змушені вирішити: втримати цей новий дім чи намагатися повернути старий? Пророк Вадим стоїть перед вибором — укласти союз із чудовиськами чи стати героями людства?"

PAS_OWB_DESC:0 "Сьогодні Канадські Скелясті гори — дім мандрівників, вигнанців і волоцюг з усієї Великої Півночі. До них щойно приєдналися Вартові Білини, з підрозділу «Фокстрот Юніформ», яких вигнав із Сієтла Безсмертний. Їх очолює Сильвія Гарлоу, що вирішила простягнути руку допомоги тим, хто прийшов до неї раніше.\n\nЗалишки Вартових зосереджені в Спокані, і в лавах «Фокстрот Юніформ» точаться запеклі дебати про майбутнє. Сильвія балансує між розчаруванням бійців і бажанням допомогти людям Перевалу. Тим часом, довкола палають пожежі..."

HGH_OWB_DESC:0 "Високо над священною рікою з парафії Вищої Церкви спостерігають за світом. Це останній бастіон миру в регіоні, однак поява Вищої Церкви та катастрофа Великого Розколу змусили баптистів відійти від зовнішньої політики.\n\nХоч зараз і панує спокій, багато хто боїться, що це ненадовго — і що коли настане час зважувати святих, виявиться, що їм бракує сили."

NAV_OWB_DESC:0 "Навахо жили на південному заході століттями й пережили хвилю за хвилею завойовників. Іспанці, мексиканці, американці — ніхто не зламав їх. Цезар, для них, — просто ще одна велика сила, до якої треба пристосуватись. Формально вони підлеглі Легіону Цезаря, але самі вважають себе рівноправними. Рада племені поділена: одні хочуть співпрацювати з Легіоном заради багатств, інші мріють знову стати господарями власної долі."

SHI_OWB_DESC:0 "Ші прийшли з моря, на священному судні під проводом самого Імператора Китаю. Благословенні його мудрістю, передовими технологіями та давніми бойовими традиціями, Ші стали сильною — хоч і малою — спільнотою.\n\nОбраний і підйом НКР дали тріщину в ізоляції, яку Ші колись підтримували. Тепер, коли світ стрімко змінюється, дедалі більше серед жителів Ші замислюються — чи не пора знайти новий шлях?"

SOK_OWB_DESC:0 "Арройо повинен належати Каґі, і саме він мав би бути Обраним. Але доля вирішила інакше, попри всі його зусилля. Після падіння Анклаву й підйому самозваного Обраного, Каґа зібрав власне плем'я — повне палкого прагнення до реваншу.\n\nУ диких землях Невади повно суперників, але коли вони впадуть, і TV-таун із ними — можливо, Каґа нарешті почне готуватися до повернення додому..."

DES_OWB_DESC:0 "Коли Пустельні Рейнджери потиснули руки НКР і стали частиною її владної машини, дехто зустрів цей союз із презирством. Ебіґейл Лі, насамперед, повела своїх однодумців глибше в пустелю, аби почати нове життя.\n\nУ спустошених землях Невади багато хто мріє про імперії чи багатства, і рейнджери Ебіґейл мають знайти спосіб приборкати їх — заради створення майбутнього без впливу НКР. Якщо це взагалі можливо..."

TVT_OWB_DESC:0 "Шоу повинно тривати! Так каже Режисер щодня, і так воно й є. Ми граємо свої ролі й ніколи не питаємо, чому чи на скільки. Хто знає, що станеться, якщо запитаємо.\n\nАле... якщо?"

GRD_OWB_DESC:0 "Коли Мексон уперше надіслав радіозвернення по всій Пустці після Великої Війни, не всі військові загони, які згодилися з його наказами, лишилися вірні традиції. Вартові — один із таких уламів, які відділилися й розвивалися окремо від Братства Сталі. Забобонні, охоплені власною релігійною вірою в небезпеку мови й технологій, вони давно обірвали зв’язок із Лост-Гіллс.\n\nАле все змінюється. І коли вони ступлять у долину Невади як Вартові — хто знає, ким вони вийдуть із неї?"

TOF_OWB_DESC:0 "Коли Повстання Фарфілда придушили війська Нью-Ханану, вони не стали страчувати тих, хто вижив — їх примусили до покаяння. Так 215-й трудовий загін опинився у місті Джеріко, щоб спокутувати гріхи працею. Але тоді прийшов Тандерберд і Вісімдесятники — зруйнувавши місто, збудоване 215-м довгі роки. Вони здобули волю, але не мали куди податись.\n\nТепер Маріанна, колишня злодійка, що стала полоненою, а потім — ватажком банди, веде їх на захід у пошуках нового притулку та легендарних скарбів долини."

### Mexico ###
MEX_NAME:0 "Мексика"
MEX_DESC:0 "£GFX_mexico_overlay                                                   Земля збереженої та мутованої природної краси — простори Мексики вкриті легкою радіацією, насичені бандитами та тими, хто їм протистоїть. Її народ живе від дня до дня під теплим сонцем, прорубуючи шлях крізь мутовані джунглі до забутих міст, ведучи каравани від осередків демократії до залів імперії. Передвоєнні картелі, що колись панували над країною, досі діють — хоч і з меншим клієнтським колом, але з небезпечнішими наркотиками та послугами. Вплив Америки досі відчувається на північному кордоні, де нащадки окупантів передають факел демократії мексиканцям.\n\nАмериканська армія залишила в Мексиці не лише нащадків. На перехресті логістичних і ресурсних мереж стоїть гігантський військовий комплекс із мертвими очима. Глибоко всередині, за шарами найкращої автоматики Америки, живе Тлалок — власний штучний інтелект Петро-Чіко. Його створили для забезпечення постачання нафти до США та захисту об'єктів і працівників. Майже двісті років потому він самотній, на межі краху, і його ж підпроцеси загрожують стерти його особистість..."

RRG_OWB_DESC:0 "Одна з небагатьох передвоєнних держав, що збереглись після апокаліпсису, Республіка Ріо-Ґранде — лише тінь себе колишньої. Вона пережила крах завдяки дезертирству американських солдатів, які вирішили захистити цивільних. Республіка переформатувала себе, щоб вижити.\n\nЗ розквітом демократії прийшли труднощі, але низка президентів віддано служила народу. Та напруга зростає, оскільки Техаська Асоціація Зброярів стає дедалі незадоволенішою."

ARM_OWB_DESC:0 "Утворена безумним уламком Тлалока, який вважає себе перевтіленням Санта-Анни, Армія Мексики — це армія з державою, а не держава з армією. Залізна хватка штучного Санта-Анни гарантує «співпрацю» населення.\n\nЖага спокутувати сором «минулого» штовхає ШІ вдосконалювати армію рекрутів і заміщати її роботами. Люди живуть і працюють у злиднях, але все — заради відвоювання Мексики. Якщо для цього потрібно, щоб люди страждали — хай буде так."

ATE_OWB_DESC:0 "Почавшись у містах-державах південної Мексики, в колишніх Моралесі та Пуеблі, Ацтлан швидко розширив свої кордони. Його головна зброя — Жрецтво Сочікалько, група телепатичних мутантів, з яких походить імператорська династія. Ацтлан панує від великого міста Тепік на заході до неторкнутого узбережжя Акапулько на сході. Їхні щедрі мутовані землі дають рясні врожаї, і вони мають одне з найбільших населень у Пустці. Але Спікер бачить темне майбутнє імперії — й лише вона вірить, що зможе його запобігти."

PET_OWB_DESC:0 "Нащадки працівників, керівників і цивільних, які перебували на об'єктах корпорації Петро-Чіко під час Великої Війни, сучасні мешканці Петро-Чіко — тінь своїх предків. Вони живуть серед руїн нафтопереробних заводів, ведучи жалюгідне існування.\n\nХоч Тлалок і вважає їх працівниками компанії, вони до мозку кісток ізоляціоністи та відкидали кожну спробу ШІ покращити їхнє життя. Вони гниють у своїх зношених заводах, не розуміючи власної цінності."

FFI_OWB_DESC:0 "Оточені картелями, продавцями наркотиків і сутенерами з арміями найманців, Вільні Бійці зберігають свободу силою. Лучадори всіх форм і розмірів створюють і носять унікальні маски, б’ючись силовими кастетами та балістичними рукавицями з усіма навколо.\n\nПантеон легендарних передвоєнних лучадорів — серце їхньої ідентичності. Залежно від того, кого з героїв вони шанують, змінюється і їхній стиль. Вони можуть грати як героя, так і лиходія — залежно від ситуації."

ITZ_OWB_DESC:0 "Іца походять із племені, яке поклонялося богам мая в Чичен-Іці, але Імперія швидко розрослася на півострові Юкатан і узбережжі Мексиканської затоки. Та з приходом Ацтлана ситуація змінилася.\n\nІців двічі перемагали, доки Себастьян, тоді ще офіцер, не зібрав сили на річці Папалоапан і відкинув ворога. Згодом він захопив владу шляхом перевороту. Але Ацтлан досі чатують на кордонах, вороги піднімаються, а Каломте — старіє..."

TLA_OWB_DESC:0 "Головна «особа» Тлалокану — його тезка, передвоєнний суперкомп’ютер «Тлалок», названий на честь ацтекського бога дощу. Основна мотивація Тлалока — збереження людства та бізнес-інтересів, зокрема корпорації Петро-Чіко. Вірно служачи їм 200 років, він розщепив себе на альтер-его — кожне на основі відомого мексиканця минулого. Наслідки «Смерті Тлалока» і те, хто з його дітей-богів постане далі — ще попереду."

CAF_OWB_DESC:0 "Колись просто дрібний гравець на мексиканській арені, Ла Коста-Кафе піднялася в тіні занепадаючих імперій. Її Барон не прагне слави чи завоювань — лише багатства та економічної монополії, приховуючи амбіції за формальною лояльністю до трону Ацтлана. Та пута підлеглості навряд чи стримуватимуть Косту довго. Усі, хто щось тямить у політиці, знають — якщо мова йде про довгу гру, не став на поразку барона."

TDT_OWB_DESC:0 "Розташовані між титанами Нуево-Ацтлана й Іціанської імперії, маянські народи Чіапаса утворили власну державу — уламок Іцанської імперії. Розкол виник через релігійні розбіжності, і сепаратизм досі поширений серед населення. Сахаль Тобіас Рей II десятиліттями стримував вторгнення Іцанців та Ацтлана, але нове загострення їхніх відносин може змусити народ Цоцилів обрати бік — або їх змусять зробити це."

TVR_OWB_DESC:0 "Віцекоролівство відокремилося від Нуево-Ацтлана, коли зрозуміло, що перебуває на територіях, які захищає Тлалок. Навіщо платити податки сліпій дівчині, якщо старий бог техніки забезпечить захист безкоштовно? Але Тлалок вже ледве дихає, й дедалі більше мешканців боїться, що імперія невдовзі прийде по втрачене."

SIN_OWB_DESC:0 "Північна частина картелю Сіналоа заліковує рани після втрати територій Лучадорам. Хоча операції на півночі Мексики досі прибуткові, у картелі з’являються тріщини, і ще одне століття наживи вже не гарантоване.\n\nПоки Сіналоа сам, він слабкий і ізольований. Але якби обидва картелі знову об'єдналися, морібосос Мексики могли б досягти великих — і жахливих — речей."

GDH_OWB_DESC:0 "Генералісімус, мабуть, найхаризматичніший чоловік у всій Мексиці. Завдяки зовнішності, чарівності й військовій майстерності він об’єднав бандитів у професійну армію. Інші граються в наркотики чи рекет — Генералісімус легалізує споживання та встановлює єдиний податок. Як він каже: навіщо здирати шкуру з корови, якщо її можна доїти? Ла Генте — одна з найжорстокіших, але й найефективніших держав у Мексиці. Її народ твердо вірить, що сонце на прапорі не заходить над Тихим океаном — воно сходить над Мексикою.\nІ ви вже чули, який він привабливий?"

BLO_OWB_DESC:0 "Розколота південна гілка картелю Сіналоа ховається в джунглях, утримуючи свої позиції завдяки Ель Бандито та його новій кліці Бельтран-Лейва. Хоча в них бракує ресурсів та інфраструктури, картель повністю перейняв жорстокі методи Ель Бандито й готується до кривавої реконкісти проти лучадорів.\n\nПоки Бельтран-Лейва сам, він слабкий і ізольований. Але якби обидва картелі знову об'єдналися, морібосос Мексики могли б досягти великих — і жахливих — речей."

GRH_OWB_DESC:0 "Ніхто точно не знає, що лежить на південь від Гондурасу й Дарієнського Пройму. Одні кажуть, що Південна Америка пережила Велику Війну майже без втрат і обрала нейтралітет. Люди в Гондурасі стверджують, що вони — щит, який захищає людство (і супермутантів, гулів та роботів) від нескінченних рейдерських орд. Більшість Мексики вважає, що вони брешуть… Але що, якщо ні?"

#Texas
TEX_NAME:0 "Техас"
TEX_DESC:0 "£GFX_texas_overlay Відтоді як з'явилося Братство Сталі, Техас став напрочуд гостинним краєм. Завітайте до борделів Карбона, подивіться ролер-дербі або послухайте чарівний голос Містера Ентертеймента. Але проблеми насуваються на пристойних людей Техасу. Рейдери з Карфагена активізувалися, а роботи Санта-Анни заходять у Ріо-Ґранде. Уздовж Ріо тліє напруга, поки Техаська Асоціація Зброярів мріє про капіталістичну утопію. Росадо мріє принести прогрес і розвиток у Пустку. Шейл замислює відродити мрію Майстра. \n\nА на обрії ховається Ланій, який несе слово Цезаря у впале плем'я. Він не спочине, поки не омине свій кривавий меч у водах Мексиканської затоки. Хто зможе йому протистояти? Можливо, настав час народу Техасу відродити свою націю та старе гасло — 'Прийди й забери!'"

TAA_OWB_DESC:0 "Як очолювати Техаську Асоціацію Зброярів? Ніяк. Вона просто працює!\n\nТАЗ стоїть на роздоріжжі — тарифи Ґлорії зростають, а критики щодо 'продажу зброї Легіону' стає все більше. Генеральний директор Тодд Гаубіц бере Асоціацію в дорогу — час дослідити можливості франшизи.\n\nЯкщо їх першими не зжеруть супермутанти..."

LNS_OWB_DESC:0 "Колись маленьке містечко на трасі I-20, Лоун Стар розцвіло після Великої Війни як маяк торгівлі та надії. Каравани почали рухатись трасою, і Лоун Стар швидко розширила свої межі, залишивши в минулому руїни доядерного міста.\n\nБільше десяти років тому місто зазнало кривавого повстання з боку війська Руки. Хоча їх придушили, уламки банди досі гніздяться в прикордонних поселеннях. І нова хвиля насильства може зруйнувати Лоун-Стар у найгірший момент..."

CMC_OWB_DESC:0 "Велика війна знищила багато чого, але не знищила людську потребу в розвагах. А також жадібність і заздрощі. Коаліція Чикасо-Маскогі — нація, в якій усе це квітне. Її очолює Лушанья Хархо — голова однієї з найбільших казино-сімей. Вона — справжня порохова бочка злочинності, що ось-ось вибухне.\n\nА тим часом на заході відбувається щось дивне, що загрожує не лише їм, а й усьому регіону."

CHO_OWB_DESC:0 "Чокто зберегли традицію розповідача через багато труднощів, і після Великої Війни — також. Нашоба Соломон має багато власних історій, але нині він щасливий бачити, як його домівка процвітає. З’явилась нова можливість — гулі, яких у багатьох регіонах бояться й зневажають, можуть передати свої давні знання новим поколінням. Допомагаючи не повторити старих помилок..."

CHR_OWB_DESC:0 "Поки одні бояться технологій за те, що вони зробили з цим світом, Черокі їх прийняли — ще до Великої Війни. Саме технології врятували їх і інші народи, які тепер утворюють Федерацію Великих Рівнин. Без їхнього передбачення не було б ані сяючих вогнів казино Коаліції, ані мрій Чокто про бібліотеку, що переживе віки. І що з того, що ці досягнення мають кілька... етичних плям?\n§RУвага: хоч фракція й придатна для гри, її контент наразі короткий і буде розширено після оновлення карти.§!"

TBH_OWB_DESC:0 "Нащадки героїв, які колись прийшли зі сходу, аби битися з армією супермутантів Аттіса, Техаське Братство — вершники, яких інші Братства не кличуть на вечерю. Вони борються за правду, справедливість і техаський шлях. Протягом десятиліть захищають свій дім. Стільки охочих вступити в лави — не дивно, що вони ніколи не відчувають браку рекрутів. Це Братство змінюється — і, можливо, стане нацією, що струсонить основи Пустки. Але загрози з заходу й півдня можуть завадити. І є ті, хто вірить, що Братство відступило надто далеко від своїх засад. Вони готуються зробити останню відчайдушну оборону в Аламо — проти навали роботів з Мексики та колишніх братів."

SHA_OWB_DESC:0 "Поки інші мутанти Техасу зрадили мрію Аттіса, Шейл зберігає її. Люди бояться чанів з ВПЕ, поки Форт Стоктон готується до війни. Якщо Шейл переможе — смарагдовий прапор замайорить над Техасом, і раса мутантів знову стане над усім.\n\nОсобливо з новим терміналом Shop-Tec..."

UOA_OWB_DESC:0 "Поки Шейл і Залізні загрожують добрим людям Техасу, Кітс мріє про мир. Зрештою, неможливо обіймати своїх дітей ядерними руками. Хай супермутанти несуть послання любові слабким, тендітним людям; хай зрозуміють вони, що мутанти бачать у людях друзів, а не їжу; хай підуть разом уперед. Кітс готовий працювати з усім Техасом задля побудови кращого світу, де всі люди створені рівними. Навіть якщо деякі з них створені за допомогою ВПЕ."

IMO_OWB_DESC:0 "Шейл мріє про нову імперію мутантів. Кітс молиться за кращий світ. А Джагернаут знає, що дійсно має значення — §RЧЕРВОНИЙ КОЛІР РОБИТЬ ВСЕ ШВИДШИМ§!.\n\nЗалізні вже будують плани йти на південь — грабувати найбагатші регіони Мексики. Адже навіть роботобоги зроблені з дуже смачної брухт-начинки."

TUB_OWB_DESC:0 "Трансляції містера Ентертеймента приносять радість у Пустку, і його послідовники намагаються дарувати трохи світла кожному. Хоча деякі циніки зауважують, що лише нещодавно Техас зміг підтримувати щось подібне до телевізійної індустрії, інші радо збираються у тавернах, барах і залах, аби подивитися останній випуск."

CHC_OWB_DESC:0 "§4\"Якщо я збираюся розповісти вам про пригоду свого життя — пояснити, як я опинився в цьому місці з цими людьми, і чому я зроблю те, що зроблю далі — я, мабуть, маю почати з пояснення, хто такі псайкери.\"§!"

EDN_OWB_DESC:0 "Нація Едем була заснована після подій Fallout: Brotherhood of Steel Скарлет — колишньою асасинкою Братства Сталі. Її єдина мета — захистити зіпсований §FG.E.K.K.§!, який до Техасу привіз Різ, ватажок Шифрів. Він перетворив смугу Пустки від Колорадо до Техасу на мутоване джунглеве пекло. Останнє десятиліття було відносно спокійним, але за горизонтом з'являються нові загрози. У Техасі — напруга в самому Братстві, а залишки армії Аттіса знову на воєнній стежці. Через Ріо Ґранде — Армія Мексики на чолі з божевільним ІІ із особистістю Санта-Анни і президентський кандидат Республіки Ріо-Ґранде Валентина Росадо — обидві сили прагнуть розширити свій вплив у Техас.\n\nЧи зможете ви провести Едем через ці конфлікти?"

TLP_OWB_DESC:0 "Для багатьох гулів Оклахоми «Останній патруль» — це сенс життя. Гаррісон знає, як важко втриматися «собою» — а як щодо інших, чия доля й до того була варта забуття? Життя, де вічне існування стало справжнім покаранням. Вони не мають жодної надії залишитися людьми — не впасти у безумство звіра.\n\nПатруль Гаррісона — це його спосіб дати цим гулям шанс, життя, яким вони можуть пишатися."

EXE_OWB_DESC:0 "Виконавці — живий спадок Vault-Tec. Не лише тих, хто сховався в дивовижних сховищах, а й керівництва та геніїв компанії. Колись вони жили в Таємному Корпоративному Сховищі, але війни з супермутантами й Братством Сталі призвели до його знищення. У наступні роки Виконавці змінилися: вони стали більш агресивною силою в Пустці задля виживання. Звинувачення в тому, що вони рейдери — це, звісно, заздрість конкурентів.\n\nЇхній новий CEO, МакКінлі, має великі плани — помста й повернення додому. Вже перезапущено експериментальний науковий відділ. Але тінь Бика нависає над Нью-Мексико. Чи знайде спадок Vault-Tec укриття від цього Легіону Апокаліпсису?"

TPM_OWB_DESC:0 "Десятиліттями дрібні спільноти східної Луїзіани покладалися на Патрульних — орден миротворців і ополченців, які присягли захищати мир. Їх очолює Шеф Патруля Каллахан, як і його батько, і батько його батька. Вони забезпечують стабільність під прапором «золотого та синього».\n\nНа жаль, не все золото блищить — і деякі патрульні вже стали на шлях корупції. Та як ви з цим упораєтесь?"

GAM_OWB_DESC:0 "Маючи найдикіших бійців Луїзіани за плечима, Собек бродить болотами Міссісіпі, вистежуючи мандрівників, що надто віддалилися від доріг.\n\nЗдобула владу в Гатор-Мов, перемігши жахливо мутованого «ґатора» в бою, вона поєднала культуру банд і племен. Її послідовники вірні до фанатизму. Хоч і не народжена в анархії болотистої Александрії, вона сама туди прийшла — справжній дар Пустки для вірних дітей хитрості."

BAM_OWB_DESC:0 "Корпорація без вузької спеціалізації, але здатна дістати майже все. Компанія Bayou Motors — хоч і не та, що до війни — керує поселеннями навколо острова Марш, де розташована їхня штаб-квартира. Вони спеціалізуються на переробці й морській діяльності. Для них найважливіше — спокій і тиша.\n\nШкода тільки, що світ не такий простий. Велика техаська сфера стає дедалі небезпечнішою. Можливо, час пакувати не лише харчі..."

### Юта ###
UTAH_NAME: "$NEW_NAME$ Юта"
UTAH_DESC: "£GFX_utah_overlay       Недоторкана краса часом жорстокої, але завжди дикої природи пронизує колишню територію штату Юта. Після падіння цивілізації внаслідок ядерного Армагедону тут виникло безліч племен і культур, чиї характери, здається, віддзеркалюють землю, яку вони населяють.\nБілоногі, Божевільні Роги та Смоляні Ходоки — лише три з багатьох племен, що борються й ворогують за контроль над тим, що може бути останнім незайманим раєм на планеті.\nПросуваючись далі на північ, до Великого Солоного Озера, мандрівник зрештою потрапить до Нью-Ханану — самотнього маяка знань, що витримав випробування часом. Його мешканці, можливо, останні представники Церкви Святих Останніх Днів (Адвентистів), продовжують справу своїх предків, намагаючись донести слово Боже до народів регіону. Хоча дехто прийняв це послання, ще більше — опирається.\nДіяльність місіонерів опиняється під загрозою. Небезпечні вигнанці з Сак-Сіті, відомі як Вісімдесятники, та дедалі зухваліші дикуни з племені Білоногих прагнуть розширити свій вплив, і Юта знову опиняється на межі війни."

NCN_OWB_DESC:0 "Після падіння Нового Єрусалиму мормони були змушені переселитися. Вони заснували Нью-Ханан, подолавши важкі роки, і прийняли відкриту політику щодо чужинців, аби не повторити помилок минулого.\n\nНью-Ханан регулярно відправляє місіонерів проповідувати слово Боже, вірячи, що кожен охрещений має право жити в їхніх стінах як свій. Вони часто спілкуються з племенами Юти, пропонуючи Біблію, їжу й допомогу. У більшості племен Юти Нью-Ханан користується повагою."

WHT_OWB_DESC:0 "Мандруючи східною Ютою, Білоногі живуть за рахунок грабунку та знищення. Це кочові дикуни, чиї предки дивом вижили після катастрофи. Єдина культура, яку вони знають — це культура крові.\n\nСіль-на-Ранах — грізний воїн і вождь племені Білоногих. Він привів їх до багатьох перемог, а тепер прагне слави. Чутки про могутню імперію на півдні, від Аризони до Колорадо, кличуть Білоногих до нової долі — стати рогами великого мідного бика."

EHT_OWB_DESC:0 "Після того, як НКР жорстоко вигнала Вісімдесятників із Сак-Сіті, ті переслідують Юту ще запекліше, зростаючи в ненависті до фальшивої республіки. Поклоніння трасі I-80 глибоко вкорінене в їхню культуру, і вони мріють повернути дорогу.\n\nНезабаром війна охопить Вісімдесятників, і їхні бойові мотоцикли заревуть у Пустці. Ведуться дебати: яку славну здобич обрати першою? Рубі-Веллі? Святу трасу від Міста-Сховища? Чи розграбувати декадентські казино Нью-Ріно?"

HAM_OWB_DESC:0 "Поки племена Юти занепали в містицизм і фанатизм, Склярі обрали інший шлях. У блискучих вулицях Нью-Гаммонда та гарячих пустельних кузнях шанують майстра, а не проповідника.\n\nПроте в Нью-Гаммонді не все спокійно. Нова влада повільно перетворює націю майстрів на фанатиків. Хоча стосунки з зовнішнім світом поки що мирні, не відомо, на що можуть зважитися Склярі у відчаї."

ANO_OWB_DESC:0 "Для Помазанців Господа на землю зійшло пекло. Колись поміркована релігійна громада, після виходу зі Сховища вони стали фанатичним культом, переконаним, що лише вони зберегли душі в очищенні світу. Їхня ксенофобська ізоляція спричинила Розкол між вірними та реформаторами Мерто.\n\nАле з часом захисти Вищої Церкви ослабли, й заклики до возз'єднання лише зростають. Те, що не вдається досягти вірою та примиренням, буде здобуто мечем."

MUR_OWB_DESC:0 "Реформатори Мерто дорого заплатили за своє спасіння. Їхня нація — це строката суміш учених, мирян, новонавернених і найманців, яку тримає купи віра та переконання. Їхня доктринальна суперечка переросла у жорстоку громадянську війну, що завершилась західною втечею через річку Снейк.\n\nТакий стан не може тривати вічно. Чи це буде війна, чи добровільне підкорення — Мерто пройде свій складний шлях із високо піднятою головою і з вірою в серці."

ORO_OWB_DESC:0 "Із вигнання й вогню постало Уроборос — місто, збудоване не війною, а волею. Колись вигнана племенами й покинута Легіоном, Геката блукала Пусткою, поки не була відроджена під поглядом богині. Вона зробила святим те ім’я, що їй дали з ненавистю. Тепер вона править із вершини Темної Піраміди, а її Дочки та Пси несуть слово й сталь в однаковій мірі.\n\nУроборос — це прихисток для зламаних, храм для вірних і зброя для майбутнього. Але під завісою благоговіння ховається неспокій. Його богиня ходить на межі між міфом і смертністю, і місто, яке вона збудувала, відлунює як відданістю, так і сумнівом."


DEA_OWB_DESC: "Первісно вигнане зі східного боку Великого Каньйону, плем'я Мертві Коні славиться як велике воїнство, чиє бойове вміння дозволило їм утримувати північний брід через Колорадо, попри жорстку конкуренцію в регіоні. Їх майстерність зросла ще більше після того, як перший Легат Легіону навчив їх легіонерській доктрині. Молодь охоче пішла за його настановами, однак старійшини досі не поспішають довіряти цьому Легату і його Цезарю."

UIN_OWB_DESC: "Через постійні конфлікти у регіоні багато племен були змушені безкінечно мігрувати. Але не Уїнта. Як і їхня назва, вони залишаються непохитними — єдиною постійною точкою серед турбулентного племінного життя і війни."

SOR_OWB_DESC: "Втеклі від жахливих тортур, відомих як 'Школа', діти, що згодом стали племенем Скорботних, були ведені до свого нового дому божественною істотою, яку вони знають лише як 'Батько'. Його слова ведуть їх і нині, і саме завдяки йому Скорботні можуть жити в мирі у власному раю, захованому в гірських хребтах далекої Юти."

LON_OWB_DESC: "Люди з племені Самотнє Дерево мали змогу жити мирним і відносно захищеним життям. Хоча вони й не чужі війні, стабільність і відкритість сусідів дозволила їм зосередитися на розвитку власної громади. Але така співпраця дедалі більше ускладнюється, адже і Нью-Ханан, і Небесні Ворота прагнуть розширити свій економічний та релігійний вплив на плем'я Самотнє Дерево — часто за рахунок один одного."

CRZ_OWB_DESC: "Божевільні Роги сильні, вірні своєму слову, швидко пробачають і важко гніваються. Але їхній ідеалістичний погляд на світ уже не раз грав проти них: чимало членів племені стали здобиччю підступних работорговців, які скористалися їхньою добротою."

TAR_OWB_DESC: "Колись ім’я Смоляних Ходоки змушувало тремтіти всю Юту — їхнє плем’я було настільки сильним, що навіть Нью-Ханан відчував загрозу. Але нині на них впала загадкова хвороба. Багато з найкращих воїнів — тяжко хворі або при смерті, і поки Білоногі та Вісімдесятники стрімко розширюють свій вплив, Смоляні Ходоки змушені відступати й шукати притулку в горах."

SLE_OWB_DESC: "На північному березі Колорадо ховається лякаюча присутність: забутий науковий комплекс, у якому досі діють божевільні вчені й вигнанці — залишки злощасного культу, що колись ледь не знищив світ вдруге. Ці послідовники Віктора Преспера роками ховаються, поступово відновлюючи силу, аби колись завершити його велику справу. Поки що Сплячі — у сні. Але якщо вони прокинуться, хто знає, які нові жахи вони принесуть у Пустку."

EDA_OWB_DESC: "Прихована в загадкових пустелях навколо Розвелла, Блакитна Троянда — усе, що залишилося від ФБР, або принаймні від нащадків агентів, які діяли в цьому районі. За підтримки гульських втікачів із Білих-Пісків та божевільних мисливців на інопланетян з 'Земної Оборонної Асоціації' вони пережили вторгнення Паулуса — хоч і дорогою ціною. Але з підйомом Легата Ланіуса, що вже націлився на них, майбутнє для Директора та його людей виглядає похмуро. Та маючи доступ до сховища дивних позаземних технологій, хто знає, чого вони можуть досягти, якщо виживуть..."

CLK_OWB_DESC: "Колишні мешканці Сховища, одержимі концептом часу. Їхні технічні здібності — майже другорядні порівняно з цією унікальною рисою. Жоден чужинець досі не зміг з’ясувати, звідки береться ця одержимість — лише те, що вона, ймовірно, виникла ще у Сховищі й збереглася досі. З невідомих причин вони проґавили загрозу з боку Білоногих, що зростає просто в них під боком."


