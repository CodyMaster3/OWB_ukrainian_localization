RUSHMORE_NAME:0 "$NEW_NAME$ Північна Співдружність"
RUSHMORE_NAME_DESC:0 "£GFX_rushmore_overlay        Північні Сполучені Штати, позбавлені єдиного уряду, впали у стан стриманого божевілля — від Тихого океану до Дакоти. На заході колись могутні Вартові Білини лежать у руїнах після того, як темне Братство захопило Вашинґтон. Жорстокі воїни виринають із забутих печер у пошуках слави та здобичі у спустошенні Білої Завії, тисячі списів сходяться на Місті Доброї Волі.\n\nУ Монтані, на заході, привиди Середнього Заходу збирають сили по обидва боки штату в очікуванні великої битви. МакАртур, колонія Чикаґо, вчасно сплачує податки — родини з Міссули грають свою роль, як і годиться.\n\nНа сході новий розділ Братства Сталі тільки-но прибув у пошуках зрадника, але знайшов набагато більше, ніж очікував.\n\nУсім мешканцям півночі залишається лише одне — надіятися пережити зіткнення зароджуваних велетнів..."

bookmark_05_name:0 "Північна Співдружність"

TCA_OWB_DESC:0 "Поки Безсмертний плете свої темні інтриги у Сіетлі, справжні лоялісти Середнього Заходу сформували «Рух», аби знищити самозваного тирана Вашинґтона раз і назавжди та передати місто у руки кращого Братства — не затьмареного його божевіллям. До їхніх лав входять і супермутанти, й інші вигнанці — вони прагнуть стати кинджалом у серце воєнної машини Вашинґтонського Братства."

MCA_OWB_DESC:0 "Під командуванням полковниці Сантьяґо МакАртур виріс із прихистку залишків Наварро в аванпост Департаменту внутрішніх справ і Анклаву. Вугілля, уран і зерно надсилаються в Чикаґо — цей форпост відіграє ключову роль у Великій Справі. Перемога над Середнім Заходом — на горизонті!\n\nТа зростаючі вимоги Чикаґо породили напруження з місцевими Першими Родинами, які відмовляються жертвувати комфортом заради вищої мети. А молоде покоління солдатів вже заражене ідеями сусідів. Чи зможе МакАртур втримати баланс між наказами далекого керівництва та місцевими, що не бачать загальної картини?"

TOC_OWB_DESC:0 "Гроздан багато років намагався створити свій маленький острівець миру на півночі. Та після краху Вартових Білини й інтриг Гнилочистів, загроза стає надто великою, аби її ігнорувати. Старій Країні доведеться зібрати сили, інакше її поглине хвиля зла, що насувається з півночі..."

ROT_OWB_DESC:0 "У землях Спокану людські нащадки Сховища 100 палають люттю в холодних руїнах, мріючи повернути свою батьківщину, відібрану гулями Старої Країни. Після років застою при династії Олександра Безжального, та у тіні фанатичних Жриць Бажань, з'являється безумний «пророк нескінченності» Самсон, який має план об'єднати три сили й нанести удар по Сховищу — раз і назавжди."

MNC_OWB_DESC:0 "«Іди, Патрокле, й забезпеч панування Братства на цих землях», — так наказали йому ієрархи Середнього Заходу, і він вирушив. Новоприбулі в Монтану, вони мають місію: підкорити та забезпечити владу Братства.\n\nТа всередині їхніх лав назріває розкол. Сестри Сталі вважають, що їхнє покликання — не завоювання, а захист. Вони хочуть стати щитом, а не мечем для Монтани."

STR_OWB_DESC:0 "Племена Стендінг-Рок століттями витримували загрози. Багато з них прагнуть більшого — вищого покликання, повернення землі, скаліченої чужинцями, рейдерами та загарбниками. Серед цих воїнів — Шеппа Ваґнер: жінка дії. Вона вела торгові експедиції до Ґрейт-Фоллс, вела переговори з [LAP.GetNameDef], плавала Міссурі до Кресент-Сіті. Але вона — не пацифістка."

RCK_OWB_DESC:0 "Графтон — місто, що впало в забуття. Раніше воно було зручним привалом для мандрівників до Королівства Манітоба. Але королівство занепало — і Графтон за ним. Він би залишався безнадійним місцем, якби не одна людина. Людина з унікальними здібностями. Людина, що сама ніби проклята світом. Людина, яка мріє досягти зірок:\n\nРоач-Кінг зійшов у Графтон. І пустка скоро дізнається, що це означає."

VTS_OWB_DESC:0 "Ласкаво просимо до Сховища 37! Вашого нового підземного дому, що захистить вас від жахів атомної анiгіляції. Тут, у Сховищі 37, вам не доведеться й пальцем поворухнути — наші автоматизовані містери Хенді зроблять усе за вас! Розслабтеся, пограйте у більярд, закуріть сигару — ви це заслужили, чемпіоне! І нехай автоматизовані протектрони оберігають ваш спокій. Ласкаво просимо додому."

SIE_OWB_DESC:0 "Колись Вайомінґ був спокійним і врівноваженим місцем: оазою у пустці, де час плинув повільно, а вітер ніс легку прохолоду. Тепер місто Роулінс в облозі ненажерливих Кротів-Шахтарів — істот із глибин землі — і сусідні Арапаго не мають наміру це терпіти. Ковбої з Роллінза та хоробрі воїни Арапаго борються пліч-о-пліч із безперервним ворогом. Чи зможуть вони переломити хід подій і повернути безпеку Вайомінґу?"

PRO_OWB_DESC:0 "У темних, вологих шахтах, залишених після Альтона Боржа, живе істота без жалю чи глузду — Кріт-Шахтар. Підживлюваний невгамовним прагненням рости й завойовувати, Бос Проспекторів Далекого Сина виніс дивний, невиразний вирок: Шахтарі повернуться на поверхню... і захоплять її — так чи інакше."

WYR_OWB_DESC:0 "Ейрі — це родюча земля під жорстким контролем свого багатого хазяїна. За короткий час вона перетворилася з розрізненого зборища ферм і ранчо в систему, що витискає багатство з людей і землі. Підживлювані елітизмом, богобоязністю та кров'ю племен, родини Бейлі та інші багатії мають великі мрії. Але наступне плем'я може стати для них фатальним..."

KHA_OWB_DESC:0 "Після смерті Даріона Нові Хани опинилися на роздоріжжі. Кожна спроба піднятись у Каліфорнії закінчувалась болем і поразкою. Поки Папа Хан вів частину племені до Мохаве, де вони стали Великими Ханами, Амґалан обрав інший шлях. Він прагнув кращого майбутнього для своєї культури — і Послідовники Апокаліпсису допомогли йому знайти нову домівку. \n\nТепер, у Вайомінґу, вони мають жити з місцевими, приймати нових Ханів... і, можливо, пробачити своїм родичам."

BTH_OWB_DESC:0 "Коли Єлизавета було лише дитиною, солдат Анклаву врятував її від неминучої смерті. Цей акт милосердя змінив її життя — хоча її опіки лишили її з однією рукою, вона присвятила її справі добра, даруючи усмішки мешканцям пустки. Її помітили інші — Рої Сяйвок зі своїми ритуалами її захищають, але Святі... Святі грають за правилами Арчі. І він прагне перевірити її усмішку, раз і назавжди."

MRR_OWB_DESC:0 "Вільні Штати витримали чимало, навіть прийняли колишніх ворогів із Національної Ґвардії до своїх лав. Тепер Маршали збудували скромне повоєнне суспільство у Вайомінґу, але навколо повно ворогів. Їхні давні відносини з Чотирма Батьками лише погіршуються, а племена прагнуть повернути собі Маунт-Рашмор. Вільні Штати повинні приготуватися до останньої бурі... або втратити все."

STM_OWB_DESC:0 "Слухайте й почуйте оповідь про Сліпу Градову Бурю, істинно обраного Бога. Буревісники стоять на межі вічності, в темряві божевілля, де вони запускають повітряні змії з людської плоті, аби привернути погляд ГОСПОДА та досягти небес. Єретиків і дурнів повно в Монтані — усі вони дозріли для Суду..."

HVR_OWB_DESC:0 "Поки Буревісники знемагають у Ґрейт-Фоллс, Культ Свободи творить своє власне божевілля. Надихнувшись образом Мідлмарка, вони вірять, що Америка — не місце, а ангел, що має повернутись на землю. А Анклав — це її темна тінь, демон, що поганить її тіло. Вірні повинні очистити світ від цих мерзотників, щоби Америка знову зійшла у всій своїй славі!"

JCK_OWB_DESC:0 "Родина Джексонів колись належала до Перших Родин Міссули, хоч сьогодні це важко впізнати. Хоча минуло багато часу з моменту вигнання, рана не загоїлась. Вони роками грабували склади та підготовлювалися до вирішальної сутички з Анклавом. І ось, вони готові. Та ще й добряче втомились чекати."

MET_OWB_DESC:0 "Як далеко ти готовий піти заради сили? Що б ти віддав, аби позбутись втоми й гнилі? Який біль готовий витримати, щоб залишити слабкість у минулому?\n\nКоли фізичні вправи вже не допомагали, Сталевий Джо зібрав послідовників і вирушив у Біллінгс, Монтана. Зі сховищем довоєнних імплантів вони захопили центральну Монтану. Хоч поразка в Міссулі й стримала їхній злет, якщо вони оговтаються — їхні сталеві кулаки можуть стиснути всю Північно-Західну Співдружність."

NIT_OWB_DESC:0 "Від Великих Рівнин Альберти до гір Монтани, Нііцітапі колись володіли цими землями. Дюйм за дюймом їх відтискали назад, поки перед війною вони не лишились на резерваціях.\n\nАле в забутті — порятунок. Врятовані від ядерної катастрофи, дотримуючись традицій самозабезпечення, Нііцітапі процвітали дві сотні років, відбиваючись від рейдерів, мутантів і, нещодавно, найманців


CASCADIA_NAME:0 "Каскадія"
CASCADIA_NAME_DESC:0 "£GFX_cascadia_overlay         Вкрита нескінченними заметілями на півночі, з піратами, що грабують узбережжя, півднем, наповненим канібалами, й єдиним джерелом порядку, знищеним металевими людьми в чорній броні. \n\nТі, хто ще не втік, ведуть пекельне існування у морозній пустці, що не знає героїв. У Вашинґтоні колись великі Вартові Білини втекли на північ, розпорошившись у всі боки. Ескадрон Списа, експедиція великого Середньозахідного Братства, яка знищила Вартових, тепер гризеться через Сієтл і Ланцюг, Що Зв’язує. На сході рейдери та поселенці зализують рани й плетуть змови у тіні релігійного хрестового культу. \n\nВ Орегоні канібальські племена борються з голодом до людського м’яса, аби не стати його рабами — як і нові супермутанти, що вирушають з Нір, щоб створити дім для свого народу. \n\nІ, нарешті, на півночі, завжди вкритій Білим Штормом, який затуляє сонце, рейдери штурмують узбережжя, змушуючи вцілілих — під проводом монархині з Вікторії — відчайдушно захищати свій дім, Каскадію. \n\nЗміни вже у повітрі — й вони будуть жорстокими. Та це ще не означає відчаю; надія живе, поки є кому за неї боротись..."


