###The Great North###
NORTHERN_NAME: "Канадські Прерії"
NORTHERN_NAME_DESC: "£GFX_north_overlay         Якщо й можна було б обрати одне слово, що втілює боротьбу й історію Північних Прерій, це було б — занепад. Колись, коли людство зникло з лиця землі одним натисканням кнопки, більша частина Канади залишалася під прапором Фронту Народу Канади — сили, що відкрито кидала виклик американській владі на півночі. Вони пережили свого ворога, і довгий час намагалися об’єднати Канаду. Але їм не судилося. Надмірне розтягнення фронтів, внутрішня політична боротьба — кожна помилка дедалі більше підводила їх до загибелі. Сліпота до власного занепаду, внутрішній розкол між Фронтом Народу Канади та Народним Фронтом Канади остаточно розбив режим.\n\nТепер ФНК — лише порожня оболонка. Після смерті голови Еллісон Брюд почалося «Розщеплення», що зруйнувало залишки організації. Її уламки тепер збирають сили на останню війну — нові й давні гравці борються за майбутнє. Колись могутнє Королівство Манітоба, що постало з попелу ФНК, впало у руїни після повстань на сході та заході, що призвели до загибелі попереднього короля й принизили колишню імперію. У Кривавих Електоратах зростає напруга — ширяться чутки про корупцію. Новоутворена Велика Зграя продовжує поширювати свій вплив і терор серед сусідів. А тим часом Дестіні далі плете свої темні інтриги в глибинах Комплексів Маніфест. Вітер змін насувається швидко, а народ уже нагострив ножі."

STC_OWB_DESC: "Оточена ворогами, зрадниками й окупантами, Страткоммуна стоїть, обпалена роками безупинної внутрішньої боротьби. Повернувшись із поразки на сході, латаючи старі рани й озброюючись на фінальну атаку проти американських свиней, наша люба Старша Сестра бачить усе!\n\nКамери на кожному куті, донощики — в кожній оселі, але попри це ще жевріє надія для Канади. У темних закутках, серед тіней і навіть у самій авангардній партії зароджуються нові змови. Чи зможе артилерія армії пробити брехливу оболонку режиму? Чи партія замалює тріщини та створить нове утопічне бачення? Одне відомо напевне: ніхто не уникне погляду Старшої Сестри!"

COM_OWB_DESC:0 "Задовго до набігів комуністів або появи жахіть, що ховаються під снігом, існувала велика нація, що панувала над рівнинами й володіла морями. Від Ріо-Ґранде до Берінгової протоки — це була перлина світу. Але саме атом запалив полум’я, спаливши все, що ми любили, і поховавши нас під попелом і снігом. Усе, що залишилося від цієї колись гордої нації — це старий гуль, який намагається зшити свій розум докупи за допомогою старого віскі, сподіваючись згадати втрачене.\n\nМрії минулого блукають серед засніжених гір, а червоне сяйво ракет освітлює темні долини. Ходять чутки про червоне, біле й синє — про те, що десь за межами особистого пекла кожного з нас чекає Дядечко Сем. І поки одні шепочуть, інші вже здіймають прапор — синьо-білий стяг майбутнього, кажуть вони. Мрії минулого буде або втілено, або змито з піском часу — рукою п’яного солдата, що чіпляється за своє старе життя."

STA_OWB_DESC:0 "Упродовж семи років Велика Зграя залишалась непорушним титаном на степах Альберти. Вони пережили багато ворогів: ФНК, Директиву Батлфорда, навіть Республіку Кінґслі — й досі знаходяться ті, хто шукає в них слабкість. Незважаючи на всі труднощі, шлюб Джона Локхарта та Емі-Лі Санделл залишається міцним, і кордон тримається завдяки їхній любові.\n\nАле змовники та божевільні з усього Саскачевану й Альберти прагнуть зруйнувати мир, який принесли ці дві родини. Та якщо пощастить — вони подолають і їх."

STN_OWB_DESC:0 "Електорат потрапив до рук рейдера-оберненого-політика з любов’ю до ритуального канібалізму, і його виборці далеко не щасливі. Та П’єр завжди тримав карти при собі, тож змусив вигнаних Лицарів Йорктону стати особистою охороною в обмін на притулок, а людожерку — стати його дружиною, аби приручити місцеві племена.\n\nНаче цього мало, Найткін на ім’я Генерал Свобода невпинно працює над визволенням свого народу — і транслює маячню через ефір на всю округу."

BRA_OWB_DESC:0 "Королівство Манітоба стоїть на роздоріжжі. Засноване понад сто років тому, воно довгий час було єдиним гарантоном миру та стабільності на Півночі, доки руйнівна громадянська війна та хиткий мир не призвели його до краху. І тепер, коли час нарешті наздогнав короля Ґанна ІІ, єдине, що його турбує — чи зможе він зберегти королівство разом, чи остання надія Канади на майбутнє згасне разом із ним."

TPA_OWB_DESC:0 "MANIFEST залишив по собі чимало привидів по всій Канаді, та найнебезпечнішим із них є Дестіні. Колись їй було доручено підкорити націю волі іноземних окупантів, але тепер її мета інша — вдосконалити людство. Їй потрібна лише трохи «креативності».\n\nХоча вона й не може покинути комплекс особисто, з достатньою кількістю рейдерів, нашпигованих нестабільними мутаціями, залежними від неї… Вона зможе зробити все, що забажає. Хіба ні?"

ARB_OWB_DESC:0 "Колись велике Королівство Манітоба не лише впало, але й потягнуло за собою інших. Арборзька Хунта — це залишки повстання у землях Трьох Річок, роздмуханого найманцями О’Браєна, найнятими королівством. Але коли Манітоба підписала мир, О’Браєн залишився в тилу без шляху додому. Повстанці втекли на північ, до Арборга, де самопроголошений Віконт О’Браєн спостерігає й чекає слушної миті, щоб помститися Республіці, що його зганьбила."

BGR_OWB_DESC:0 "Похмура північ приховує жахливе, лякаюче створіння: Багряна Труна — величезний підземний комплекс роботизованих мозкових центрів, яким керує божевільна машина РЕЛКОМ. Захоплений ідеями комунізму, він має дуже просте, але страхітливе тлумачення: найкращий спосіб забезпечити покору й задоволення робітничого класу — це перетворити всіх на машини, як і він сам. Досі всі його спроби провалювались. Але цього разу, клянеться він, усе буде інакше."

VSH_OWB_DESC:0 "Колись Притулок був відомий як Сховище 107 — ще тоді, коли його двері були зачинені. Після відкриття сховища й дозволу на вхід і вихід, воно перетворилося на мережу громад, які домовились про взаємозахист. Схоже на Зграю, хоча в основі був не альтруїзм, а інстинкт виживання. Білокомірцеві злочинці зі Сховища інтригами пробилися до керівництва й вважали себе недоторканними.\n\nІ тоді на порозі з’явилися Вартові Білини. Вони запропонували допомогу в обмін на притулок. Нахабна пропозиція, але... хіба вони й справді зможуть потягнути цілу націю?"

DUN_OWB_DESC:0 "Народ Дандерна живе в пеклі, задушеному смогом і наповненому щурами — вугледобувні шахти, сталеливарні заводи, і нескінченна праця. Їхні лідери та ідеологи розмірковують над сенсом людського буття: чи можна вдосконалити людину, змінюючи її тіло, чи це тіло є принципово хибним? І наскільки далеко можна зайти в спробах стати кимось іншим?"

PLT_OWB_DESC:0 "\"Ласкаво просимо до Плезантдейлу! Тут усім заправляє родина Чейзів, але якщо нікого з них нема поруч, звертайтеся до Гоуп або залишайте повідомлення.\"\n\nМісто аристократів, що марнують життя в дозвіллі, поки штучний інтелект допомагає нестабільному чоловікові творити, що заманеться — до того моменту, поки він не зник. Його єдина донька залишилася сама, й поки батька нема, ситуація швидко погіршується."

DLN_OWB_DESC:0 "Ланґенбург гордо тримається як останнє Герцогство Королівства Манітоба, що вистояло найгірші часи завдяки вправному й розумному двору. Під керівництвом герцогині Софії землі процвітають і відновлюються — чого не скажеш про правління короля Ґанна ІІ.\n\nМинуло вже багато років від Війни Республіканської Коаліції, що ледь не зруйнувала королівство, й тепер зовнішні спостерігачі поважають стабільність герцогства. Та всередині зростає тривога: здоров’я Софії слабшає, а спадкоємця досі немає..."

WPG_OWB_DESC:0 "Молода республіка, яка постійно конфліктує з сусіднім Королівством. Її очолює Елуа Стіл — колишня командирка міліції, яка неочікувано для себе здобула президентство. Завдяки вірним союзникам в новообраному уряді, чіткому мандату на дії та пом’якшенню тиску з боку олігархів, вона планує повністю перетворити республіку... На краще чи на гірше — побачимо."

MTC_OWB_DESC:0 "Народ Метиського Конґресу виснажений і роз'єднаний після численних випробувань та складних відносин із Королівством Манітоба. Тепер, затиснуті між конституціоналістами та все більш агресивною армією, вони з останніх сил намагаються втримати надії нового світу. Чи зможуть вони пережити бурю, що насувається?"

IRC_OWB_DESC:0 "Століттями канадські індіанці залишалися на узбіччі — і навіть ядерна війна не змінила цього. Витіснені до краю воєнними фракціями, вони знайшли прихисток у Багряній Завії — у самому серці володінь Дестіні. Хоча вони вперше змогли жити так, як хотіли, все це виявилося фальшем: доводилось приносити жертви штучному інтелекту, щоб стримати її уповноважених рейдерів.\n\nАле Великий Вождь помер, і жертви припинились. Яке життя варте того, якщо в ньому немає змісту? З кожним днем шансів усе менше, і Залізна Конфедерація стоїть перед вирішальним вибором: жити чи зникнути.\n\nАле Вовк, Що Виє, знайде шлях."

MDM_OWB_DESC:0 "Мідлмарк з гордістю проголошує себе останньою справжньою американською компанією, що досі функціонує на пустці* частиною своєї пікової ефективності. Завдяки найсучаснішим автоматизованим системам набору персоналу та управління магазинами ми з радістю обслуговуємо населення Калґарі вже понад двісті років — і з радістю** прослужимо ще стільки ж!\n\n* Зауважте, що це юридичне визначення «пікової ефективності», встановлене у справі Веймар проти Мідлмарк, 2074 р.\n\n**Будь ласка, зверніть увагу: наші співробітники не обслуговують Вартових Білини з релігійних міркувань!"

LOI_OWB_DESC:0 "Міністерство Лойда — місто протиріч, де співіснують світські залишки танкових підрозділів Канадського Народного Фронту та побожні священики, що очолили адміністрацію. На вершині стоїть Соломон Бушар, чия щира віра в Господа стала бажаним полегшенням після краху КНФ.\n\nАле тимчасовий спокій не вічний — і давно вже згинули радянські радники, які допомагали керувати цими землями. Час покаже, чи зможе Міністерство вистояти в бурі, що насувається — чи то під проводом Соломона, чи завдяки новій, багряно-червоній крові."

