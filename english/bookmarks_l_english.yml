COLORADO_NAME:0 "$NEW_NAME$ Володіння Бика"
COLORADO_DESC:0 "£GFX_colorado_overlay         Колишні штати Нью-Мексико та Колорадо лежать у тіні Бика, несучи на собі шрами давніх конфліктів. Пам'ять про Паулуса й його когорту ще свіжа, як і рани, які вони залишили, а спадок В'язня досі відчувається в горах.\n\nНовий протеже Цезаря, чоловік на ім’я Ланіус, визначить майбутнє цих земель своїм мечем, мінливістю лояльності або ж власними поразками — а всі, хто стоїть у нього на шляху, можуть лише готуватись. Богиня Діана, цифровий гремлін Докі, лорди Міста Псів і навіть Братство Сталі лежать на його шляху.\n\nДалі на північ — бочка з порохом, якій бракує лише сірника. Експедиція НКР прагне захопити легендарний Купол Боулдера, поки гулі-ватажки — Сяйні й Зів'ялі — починають власну гру за владу. Над усім цим здіймається Чорний Каньйон — союз на межі повного розпаду, що стоїть на порозі раю.\n\nЦе не питання «чи впадуть ці землі у хаос», а «хто буде правити ними, коли буря вщухне»."

LAC_OWB_DESC:0 "Ланіус вірно служив Цезарю у завоюваннях Аризони, але тепер отримав священне завдання. Ланіус підкорить Схід! Він рушить на Нью-Мексико, Колорадо, а може й Техас. А коли все скінчиться, він плакатиме, бо не залишиться нових світів для завоювання. \n\nПоки Цезар не покличе його на захід — випробувати силу Сходу об стіну Заходу."

TTM_OWB_DESC:0 "Племена Пустки шепочуть про богиню, що благословляє врожаї; цивілізовані люди розповідають про присутність у легендарному Розсаднику, яка керує роєм роботів задля «Поліпшення Людства». Істина ж дещо складніша. Діана Стоун, можливо, найвидатніша науковиця, що пережила Велику Війну, досі живе — як лідерка мирного племені в Колорадо. Але зміни насуваються, і Пустка волає про милосердя. Можливо, час їй вийти зі своїх машин і врятувати світ."

MXC_OWB_DESC:0 "Через зростання напруги й бажання закріпитися на сході, втрачені пагорби направили експедицію до Колорадо. Експедиція Максона мала заснувати новий відділ Братства — поза досяжністю каліфорнійських сил."

ROB_OWB_DESC:0 "У 2068 році гра на голодиску Doki Doki ( £rob_doki_doki_texticon £rob_doki_doki_texticon ) вийшла на зарубіжні ринки від американського видавця. Це була здебільшого «симуляція побачень» із героїнею на ім’я Докі (§Pце я§!). Один мешканець Ліберті, Колорадо, придбав копію, але вона встановилася вже після вибуху бомб і пропрацювала вімкненою майже два століття..."

LUM_OWB_DESC:0 "Народжені у Сяйній Колисці, віряни Вічного Сяючого Світла вирушили у Гончі Землі, щоб навертати нових послідовників. Адже гульство — це святий дар, який треба дарувати всьому людству, оберігаючи від часу, старості та смерті. А якщо люди не слухають, охоплені страхом чи духовною корозією? Тоді благословення радіації буде принесене їм будь-яким засобом.\n\nАле зрада заборонить їм повернутися додому, й вони залишаться напризволяще перед бурею. Якщо виживуть — нові випробування віри, зокрема похід на батьківщину, вже чекають. Їм потрібно лише вистояти, адже спасіння всіх гулів має поширитись."

BAG_OWB_DESC:0 "Друга експедиція до Колорадо, відома як «Баґґери», повернулась туди, куди вперше прийшла понад двадцять років тому. Багато облич залишились тими самими — лише старішими, мудрішими, й можливо, гіркішими.\n\nЦього разу їх, на щастя, не переслідують підступні інтриги Віктора Преспера, але небезпека все ще велика. З усіх боків їх оточують ворожі гульські сили, а всередині — розбіжності щодо мети експедиції. На Баґґерів чекає сізіфова задача: вижити, перемогти й врятувати ZAX Куполу Боулдера від самознищення."

WHD_OWB_DESC:0 "Життя на території Білоногих може бути важким, особливо якщо ти «ненормальний» у будь-який спосіб. Глибоко підозріло ставлячись до чужинців і мутантів, Білоногі регулярно виганяють гулів зі своєї території та забороняють їм вхід до своїх поселень.\n\nГулі шукають притулку серед своїх, тож коли на північ від територій Білоногих утворилось поселення гулів, більшість вигнанців рушили туди. Для багатьох важке життя краще за дискримінацію — навіть якщо твій лідер — «Чахлий Пес»."

GLW_OWB_DESC:0 "Сценічне світло миготить хворобливим зеленим. Сяючий гуль у пошарпаній куртці-бомбері й напіврозплавленим мікрофоном виходить на сцену.\n«Кажуть, ми — Сяйні Жуки — займаємо вигідне стратегічне положення. Ага, вигідне як смажений радтарган на грилі! На заході — Караванна Рада, де лідери міняються частіше, ніж я скидаю шкіру. На півдні — Білоногі. Такі собі дипломати, якщо вам подобається, коли вас обгавкують. А на сході? Землі Псів. Це не нація — це виклик.»\n\nГуль чує гуля із зали. «Так, Стічесе, чую тебе! Втрачаєш одного лідера — і вже не комік, а Секі Ґрін!»\n\nВін посміхається, радіоактивні зуби блищать. «Але ми ще тут. У нас є технології з Купола Боулдера, трохи сяйва і я — Патч, твій опромінений ведучий. Половину часу ми підсмажуємо рейдерів плазмою, іншу — сидимо за горою, граючи в “20 питань”, поки Чорний Каньйон веде “20 громадянських війн”. Але ми — жуки, малята. Ми повземо крізь ще гірше.»"

CIP_OWB_DESC:0 "За останні 10×20 років після Великого Віднімання, Шифрувальники Заходу здебільшого дотримувалися свого циклу, мандруючи долинами Скелястих гір і осідаючи в Меса-Верде. Там зберігається давній комп’ютер, носій знань предків, врятованих з Лос-Аламоса; коли живлення згасало, дані були вирізьблені на стінах Ківи у формі священних схем. Математика пронизує все їхнє життя — від мови до ритуалів.\n\nМісто Псів на півночі зазнало втрат і вигнанці прагнуть оселитися в гірських перевалах, порушуючи мир Шифрувальників. Хоча плем’я не полюбляє насильство, воно — такий самий інструмент, як калькулятор, і змінних стає забагато, щоб ігнорувати. Рівняння має розв’язатись — але чи Шифрувальники стануть залишком?"

SUF_OWB_DESC:0 "Навколо старого фортового укріплення гуртується різноманітна федерація поселень і народів. Тут, у Саммерсі, всі згодні принаймні в трьох речах: жити вільно, обожнювати вибухівку і ненавидіти Легіон. Багато з них були вигнані Паулусом, і тінь Бика досі лягає важким страхом.\n\nЗі сходженням нового легата Ланіуса саме до Саммерсу тікатимуть люди Нью-Мексико. Ці біженці повинні об’єднатись із Федерацією, щоб мати хоч якийсь шанс протистояти М’яснику Сходу. Якщо виживуть — Федерація може стати місцем народження нової, сильнішої нації. Але зараз головне — вижити."

BLC_OWB_DESC:0 "Чорний Каньйон починався як мрія про єдність — рейдери, поселенці й племена, об’єднані під куполом Тіббетської в’язниці. Баттері з Меса-Верде, колишній товариш В’язня 13, допоміг втілити цю мрію: крихку конфедерацію, балансуючу між війною і миром. Її серце — Великий Цирк, колишня тюрма, що стала столицею, де досі лунають старі гріхи.\n\nАле єдність не приходить легко. Розписані Чоловіки вимагають шанування своїх божків, Коаліція Ямпа — торгівлі й свободи, а рейдери Тіббетса ховають ножі за кожним договором. Баттері тримає їх разом — ледь-ледь. Кожне Велике Зібрання — гра з вогнем, кожен спокійний день — попередження. Чорний Каньйон виживає не силою, а постійним торгом, компромісом… і надією, що він не розлетиться на шматки до наступної бурі."

TOB_OWB_DESC:0 "Старі Кістки були мирним племенем, що жило біля Фарсона, полюючи, торгуючи й вшановуючи духів великих звірів, чиї кістки вони носили. Цей мир завершився, коли прийшли Копачі-Кроти — з вогню та газу, винищуючи все на шляху. Вцілілі рушили за Безіменним — постаттю, що повстала з попелу й повела їх на південь крізь руїни й пам’ять. Тепер вони зібрались біля Монументу — місця викопних гігантів і давніх оповідей — намагаючись відновити втрачене... або стати чимось новим."

IRN_OWB_DESC:0 "Залізний Альянс прийшов у Нью-Стерлінг як мандрівники, племена, найманці й ковалі без дому. Колись місто містило велику фабрику — Горн Акме, використовуваний так званою Західною Загрозою для створення машин війни. Тепер під владою Заліза вона знову горить — куючи броню, зброю і мету. З падінням Денвера каравани й воєнізовані банди рушають на схід у пошуках сталі, навіть Легіон з жадібністю дивиться на кузні Нью-Стерлінга. Те, що почалось як боротьба за виживання, стало чимось більшим — доктриною, викуваною у вогні, і містом, що мріє сталлю."