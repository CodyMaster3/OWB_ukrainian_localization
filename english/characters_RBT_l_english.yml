RBT_DORAS_NAME:0 "Дорас"
RBT_DORAS_DESC:0 "Серед Ламачів Ребер завжди є Дорас.\n\nЦе почесний титул, який передається від одного воїна до іншого у священній традиції, що не переривалася з того часу, як небо спалахнуло від жару світової печі. Обов'язок Дораса — вести покоління, до якого він належить, очолювати мисливські загони для збору свіжих тіл і гарантувати, що ланцюг наступництва ніколи не буде перерваний."