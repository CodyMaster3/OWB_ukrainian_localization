l_english:
# рішення
temple_of_the_road_complete:0 "Коли храм буде зведено, ви зможете видавати священні укази для зміцнення армії."
master_of_the_highway:0 "Володар Шосе"
EHT_raid_garrison:0 "Рейд на гарнізон"
EHT_spawn_raiders:0 "Помста!"
EHT_spawn_raiders_desc:0 "Ракоподібна пухлина НКР знищила безліч рейдерських зграй. Але тепер, коли ми підкорюємо їхні землі, їхні ж покинуті злочинці приєднуються до нас."
EHT_raiders_tumbledown:0 "Грабіжники з Тамблдауна"
EHT_raiders_tumbledown_desc:0 "Деякі грабіжники з брамінових ранчо щасливі нарешті отримати свою помсту."
EHT_khan_volunteers:0 "Добровольці Ханів"
EHT_khan_volunteers_desc:0 "Після стрімкого падіння Тіньових Пісків, деякі воїни Ханів приєдналися до нас заради помсти! Прекрасно."
EHT_scorpion_volunteers:0 "Добровольці Скорпіонів"
EHT_scorpion_volunteers_desc:0 "Коли ми дісталися Бейкера, воїни з угруповання Скорпіонів стали під наші знамена!"
EHT_viper_volunteers:0 "Добровольці Гадюк"
EHT_viper_volunteers_desc:0 "Загін Гадюк біля Стоктона, який був відрізаний від основної зграї, просить приєднатися до нас!"
EHT_jackal_volunteers:0 "Добровольці Шакалів"
EHT_jackal_volunteers_desc:0 "Група Шакалів із околиць Мерісвілля, що залишилась без зграї, підтримала наш напад!"
EHT_yakuza_volunteers:0 "Добровольці Якузи"
EHT_yakuza_volunteers_desc:0 "Кілька банд Якузи, що застрягли в Скальдері, реорганізувалися та влилися до нашої армії!"
EHT_fiend_volunteers:0 "Добровольці Наркоманів"
EHT_fiend_volunteers_desc:0 "Родом із Сховища 13, кілька банд Наркоманів запропонували нам свою допомогу!"
EHT_great_stockpile:0 "Великий Склад"
EHT_great_stockpile_desc:0 "Ми зібрали величезну кількість зброї й інструментів. Час готуватися до розпродажу."
stockpile_weapons:0 "Запаси Зброї"
stockpile_weapons_desc:0 "Зосередимося на накопиченні зброї."
stockpile_vehicles:0 "Запаси Транспорту"
stockpile_explosives:0 "Запаси Вибухівки"
summon_ruby_valley_warband:0 "Скликати Загін Рубінової Долини!"
summon_ruby_valley_warband_desc:0 "Наші рейдери готові вирушити на Рубінову Долину."
summon_small_warband:0 "Скликати Малий Загін"
summon_new_hammond_warband:0 "Рейдери до Нью-Гаммонда"
summon_new_hammond_warband_desc:0 "Пограбуємо Нью-Гаммонд."
summon_vault_city_warband:0 "Вершники Сховищного Міста"
summon_vault_city_warband_desc:0 "Усі ми пам’ятаємо, як нас принижували у Сховищному Місті. Тепер ми вирушаємо по відплату!"
summon_reno_warband:0 "Скликати Загін Ріно"
summon_reno_warband_desc:0 "Іноді треба кинути кістки заради слави. Дехто з наших бійців готовий ризикнути."
EHT_begin_border_raid:0 "Почати Прикордонний Рейд"
EHT_begin_border_raid_desc:0 "Вісьмдесятники можуть провести обмежену кількість прикордонних рейдів. Ви зможете здійснити до п’яти, перш ніж сусіди укріпляться. Наразі здійснено §H[?EHT_raids]§! рейдів."
EHT_nomadic_decisions:0 "Відкрита Дорога"
EHT_nomadic_decisions_desc:0 "[EHT.GetLeader] підтверджує вірність ідеалам Білих Ніг і скористається силами традиційного кочового способу життя."
EHT_sedentary_decisions:0 "Осілий Шлях"
EHT_sedentary_decisions_desc:0 "Вісьмдесятники не стали слабшими через осілість. Вони просто усвідомили, що багатство й владу можна здобути не лише грабунком. Наприклад, податки з боягузів теж непогано працюють."
EHT_living_exchange:0 "Живий Обмін"
EHT_living_exchange_desc:0 "Живий обмін — один з найбільших ринків рабів у Пустці. Рабовласники з Невади, племінні вожді Юти та навіть поодинокі посланці Легіону приїжджають сюди торгувати найціннішими живими товарами."
EHT_buy_warrior_slaves:0 "Купити Воїнів-Рабів"
EHT_buy_warrior_slaves_desc:0 "Не всі раби створені для роботи на фермі. Дехто з них має дух — і ми зможемо це використати."
EHT_buy_scientist_slaves:0 "Купити Грамотних Рабів"
EHT_buy_comfort_women:0 "Купити Комфорт-Рабинь"
EHT_buy_comfort_women_desc:0 "Якщо ти це натиснеш — тьфу, огидно."
EHT_hero_quest: "Сага про Громоптаха"
EHT_hero_quest_desc: "Громоптах склав бензинову клятву й рушив на захід — або завоює, або помре. Щоб підготуватися до війни, він може пройти низку пригод."
EHT_raid_sky_reavers: "Штурм [389.GetName]"
EHT_timekeeper_vault_stolen: "На Північ"
EHT_van_graff_quest: "Завдання від Ван Граффів"
EHT_heavens_gate: "Обікрасти Небеса"
EHT_kill_deathclaws: "Переїхати Когтів Смерті"
EHT_kill_deathclaws_desc: "Коли все інше не спрацьовує, Громоптах може здобути підтримку, вбивши Кігтів Смерті й повернувшись до табору з їхніми головами. Хоча, з якоїсь причини, не кожен труп має цілу голову…"

