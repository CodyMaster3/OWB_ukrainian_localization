  WHT_savages:0 "«Вони звуть нас дикунами…»"
  WHT_savages_desc:0 "«Цивілізовані» називають нас чудовиськами — злими тваринами, що крадуть, б’ються та беруть усе, що забажають...\n§RВони мають рацію.§!\n\nСтарий світ згорів через свою слабкість — і ми не поділимо його долі. Нові Канеанці тримаються за свої закони, свою паперову магію, свій фальшивий мир — та мир не врятував старий світ! Вони крадуть у торговців і називають це «податком». Вони відбирають у слабких і кличуть це «справедливістю». Вони ховаються за стінами й шепочуть, що ми загублені.\n\n§RАле ми НЕ загублені.§! Ми пам’ятаємо. Ми знаємо, чого вимагає Пустка. Ми знаємо ціну цього життя. Старий світ був визнаний слабким і скинутий у вогонь. І Пустка спробує стерти нас так само. Але ми §Rне§! старий світ. Ми §Rне§! слабкі. Ми §Rне§! будемо визнані негідними.\n\n§RЦе — порядок світу. Це — шлях нашого народу. Це — як вижити.§! Вони згинуть. Вони зітруться. А Білоногі залишаться."

  WHT_savages2:0 "Білі Кігті"

  WHT_widespread_illiteracy:0 "Масова Неграмотність"
  WHT_widespread_illiteracy_desc:0 "Під час тривалої ізоляції Білоногі розвинули власний діалект — суміш англійської, іспанської та шошонської мов, що відображає різноманітність їхнього походження. Це підсилює племінну ідентичність, але по суті є креольною мовою, непридатною для письма. Освіта й дипломатія — не їхні пріоритети, тож ці проблеми були прийнятні. Але без змін Білоногі навряд чи досягнуть чогось більшого."

  WHT_limited_literacy:0 "Обмежена Грамотність"
  WHT_limited_literacy_desc:0 "Під час тривалої ізоляції Білоногі розвинули власний діалект — суміш англійської, іспанської та шошонської мов, що відображає різноманітність їхнього походження. Це підсилює племінну ідентичність, але по суті є креольною мовою, непридатною для письма. Освіта й дипломатія залишаються складними — проте вже робляться кроки для поліпшення грамотності. Результати прийдуть із часом."
