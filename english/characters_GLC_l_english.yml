GLC_GLOWING_FATHER_NAME:0 "Сяючий Батько"
GLC_GLOWING_FATHER_DESC:0 "Сяючий Батько, Батько Колиски, Батько Колиски Світла — безліч імен спадає на думку, коли згадують цю людину. Він мирно відокремив Колиску Сяйва від Світлоносців, просто обдуривши Великого Сяючого та його вірних послідовників: він заманив їх на південь від річки, а потім перегородив шлях назад. Відтоді він прагне створити спокійне релігійне життя в Колисці Сяйва.\n\nДехто ставить під сумнів сецесію Колиски Сяйва, але вона була здійснена лише задля уникнення масової різанини, примусової гуліфікації та варварських практик Світлоносців. Ті, хто приймає Сяйво, мають робити це добровільно, а не тому, що їх прив’язали до хреста поряд із радіоактивним сміттям. Але Батько знає: Великий Сяючий знову прийде за ним, щойно завершиться конфлікт у Колорадо..."