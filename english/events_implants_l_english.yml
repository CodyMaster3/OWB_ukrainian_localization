l_english:
implant_events.1.t:0 "Наука випередила людську стриманість"
implant_events.1.d:0 "Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили! Що ми наробили!"
implant_events.1.a:0 "Божевілля?"

implant_events.2.t:0 "Щось пішло не так!"
implant_events.2.d:0 "Ми не можемо пояснити чому, але щось явно не працює в наших інтерфейсах. Те, що раніше давало поштовх нашій промисловості, тепер змушує робітників виснажуватись значно швидше. Сподіваймося, ми знову зможемо досягти належної продуктивності найближчим часом."
implant_events.2.a:0 "Мені теж якось втомлено"

implant_events.3.t:0 "Трагедія"
implant_events.3.d:0 "З'їдений провиною та поглинутий відчуттям, що вчинив найгірший злочин — позбавив волі наших солдатів — головний науковець не витримав тягаря. Пошук заміни займе час і затримає наші дослідження."
implant_events.3.a:0 "Хто дав яйцеголовому зброю?"

implant_events.4.t:0 "Обурення населення"
implant_events.4.d:0 "Наше населення помітило, чим ми займаємось. Видалення вільної волі, особистості, всього, що робить нас людьми — лише заради того, щоб випустити це на ворога. Ми повинні швидко придушити ці бунти."
implant_events.4.a:0 "Може, й їм зробити лоботомію?"

implant_events.5.t:0 "Загроза людству"
implant_events.5.d:0 "Один із наших сусідів вважає нас гідними знищення за наші злочини. Вони більше не можуть терпіти нас поруч. Їхня помилка — вони помруть і стануть новими бездумними рабами."
implant_events.5.a:0 "Ми зайшли надто далеко."