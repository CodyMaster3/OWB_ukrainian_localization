JCK_NEIL_JACKSON_NAME:0 "Ніл Джексон"
JCK_NEIL_JACKSON_DESC:0 "§9«Час сплив, але вогонь усередині нас ніколи не згасав. Пам’ять про різанину досі переслідує нас, підживлюючи наше прагнення побудувати краще майбутнє. Ми ніколи не забудемо кровопролиття — й не дамо іншим забути».§!\n\nРід Джексонів був найвеличнішим з Перших родин Міссули — до приходу Анклаву. Як і багато хто, спершу вони вітали його. Але коли податки й цензура полковника стали надмірними, Нілус Джексон організував петицію проти утисків. За «зраду» Джексонів вигнали на схід — до пустки, де родина, що пережила Велику Війну, животіє тепер як звичайні рейдери. Сьогодні вони — загроза для всього Північного Співдружжя і нагадування для Монтани, чому полковник завжди має рацію."

JCK_WYEJ_JACKSON_NAME:0 "Ваятт і Елайджа"
JCK_WYEJ_JACKSON_DESC:0 "§7«Отож, будуєш тут, ламаєш там...»§!\n§c«А перекус?»§!\n§7«Заткнись, дурню!»§!\n\nСтарші Джексони, ще до різанини Анклаву, розповідали історії про дітей, які загубились у лісі й більше не повертались. Схоже, дехто з них добрався аж до Середнього Заходу, заснував власні Родини та навіть приєднався до своїх Вартових — звуть себе Техаськими Рейнджерами. Коли їм стало відомо про нашу біду, кілька їхніх синів повернулись додому! Вони хоч і трохи дивакуваті, зате принесли чимало корисних ідей з часів серед рейнджерів — щодо постачання, підготовки та вдосконалення наших спецпідрозділів. Хоча декого з родичів дратують їхні заперечення проти рейдів."

JCK_ERASTUS_JACKSON_NAME:0 "Ерастус Джексон"
JCK_ERASTUS_JACKSON_DESC:0 "Мій чудовий син, улюбленець усіх родичів — особливо брата Джаретта. І хоч він часто конфліктує з моїми доньками, він відіграє ключову роль у наших стосунках із Вайомінгом... щоправда, трохи надто «вжився в місцевість»."

JCK_MARIE_JACKSON_NAME:0 "Марі Джексон"
JCK_MARIE_JACKSON_DESC:0 "Марі Джексон — одна з моїх двох чудових доньок. Мабуть, єдина з нас, хто ще при розумі. Вона зберегла гідність протягом усієї експедиції, і, правду кажучи, стримала нас від скоєння жахливих речей в ім’я помсти. Вона — наше серце й душа. Без неї ми вже давно стали б кривавими канібалами-рейдерами. Щоправда, з Ліббі вона часто зчіплюється. До того ж, вона — найкраща снайперка серед нас. Колишній вартовий навчав її стрільбі ще до нашої втечі, і вона досі несе цей дух — надихає інших братися за гвинтівки не заради помсти, а заради відновлення демократії проти тиранів. Хоч і вона розуміє: заради виживання доводиться йти на компроміси, навіть якщо рейди — нижче нашої гідності."

JCK_LIBBY_JACKSON_NAME:0 "Ліббі Джексон"
JCK_LIBBY_JACKSON_DESC:0 "Ліббі Джексон — одна з моїх двох чудових доньок. Геній, гостра на розум. Завдяки своїй голівці вона навчила нас виживати тут — а рейдерство, на відміну від звичайного збирання, виявилось чудовою справою! Особливо з усіма тими новими членами, яких Ліббі змогла переконати приєднатися до нас — і навіть якщо більшість із них ми використовуємо для помсти, все одно маємо з того зиск. Хоч вона й не з нашої крові, я люблю її так само, як і її братів і сестер. Ми підібрали її під час втечі з Міссули — дитину, що ридала серед палаючих вулиць. Хто вона — ми не знаємо, але вона тепер Джексон, як і всі. Вона хоче поширювати наш щедрий дух — в ім’я помсти тим, хто нас зруйнував. Хоч її любов до рейдів і маніпуляцій мене трохи й непокоїть."