### Node tutorial Hints
 TRADE_NODE_NAME_TRIGGER: "[GetTradeNodeNameTTHint]"
 TRADE_NODE_NAME_HINT_TT:0 "§gEconomic nodes are a collection of states which have above average commerce for the wasteland. Each node has a centre state which collects [GetCapCurrencyType]s and is the origin of trade routes. Member states contribute development to the node, increasing its level. The contributing factors for a node are listed directly below this header.§!"

 TRADE_NODE_PROGRESS_TRIGGER: "[GetTradeNodeProgressTTHint]"
 TRADE_NODE_PROGRESS_HINT_TT:0 "§gProgress and level are measured by state development in an Economic Node. State development is a weighted average of factories, dockyards, infrastructure, and river access between a centre state, and its member states.§!"

 TRADE_NODE_LEVEL_TRIGGER: "[GetTradeNodeLevelTTHint]"
 TRADE_NODE_LEVEL_HINT_TT:0 "§gLevel 8 can be reached by state development, beyond level 8 requires Economic Development from focuses, events, and decisions.§!"

 TRADE_NODE_ECONOMIC_DEVELOPMENT_TRIGGER: "[GetTradeNodeEconomicDevelopmentTTHint]"
 TRADE_NODE_ECONOMIC_DEVELOPMENT_HINT_TT:0 "§gEconomic Development increases level by one per point. Economic development can be granted through focuses, events, decisions, and more! Each point allows development past level 8 to a maximum of level 10, with a miniumum of 1.5 necessary to upgrade to level 9 and 2 to upgrade to level 10§!"

 TRADE_NODE_BASE_VALUE_TRIGGER: "[GetTradeNodeBaseValueTTHint]"
 TRADE_NODE_BASE_VALUE_HINT_TT: "§gРівень вузла створює вартість розвитку.§!"

 TRADE_NODE_TRADE_VALUE_TRIGGER: "[GetTradeNodeTradeValueTTHint]"
 TRADE_NODE_TRADE_VALUE_HINT_TT:0 "§gAmount of trade flowing into a node. Trade routes send a portion of the node's development value downstream to the target, in return, the target sends a smaller portion upstream§!"

 TRADE_NODE_TOTAL_VALUE_HINT_TT:0 "\n\n§gTotal node value is combined development and trade value, with modifiers.§!"

 TRADE_NODE_MEMBER_STATES_LIST_ENTRY_HINT_TT:0 "\n\n §gMember states make up the body of a node. Routes do not go directly to or from member states, but they contribute development to node progress and level. A member state can only be a member of one node at a time.§!"

 TRADE_NODE_TRADE_ROUTE_BUTTON_TRIGGER: "[GetTradeNodeRouteButtonTTHint]"
 TRADE_NODE_TRADE_ROUTE_BUTTON_HINT_TT:0 "§gTrade routes send a portion of the node's development value downstream to the target, in return, the target sends a smaller portion upstream back here!§!"

 TRADE_NODE_PROMOTE_BUTTON_TRIGGER: "[!promote_node_button_click_enabled][GetTradeNodePromoteTTHint]"
 TRADE_NODE_PROMOTE_BUTTON_HINT_TT: "§gПідвищення вузла підвищує рівень і вартість розвитку.§!"

 TRADE_NODE_ORGANIZATION_LIST_ENTRY_TRIGGER: "[GetTradeNodeOrganizationTTHint]"
 TRADE_NODE_ORGANIZATION_LIST_ENTRY_HINT_TT:0 "§gOrganizations create shops and establishments in nodes. Having an organization in a node unlocks the ability to access their shop, as well as favours, for a country. Organizations spread between nodes through trade routes.§!"

 NODE_MAP_LEDGER_TRIGGER: "[GetNodeMapLedgerTTHint]"
 NODE_MAP_LEDGER_HINT_TT:0 "§gThe '§MLedger§!' within the trade node map displays incomes from all nodes under your country's control. It also displays a list of currently controlled trade nodes§!"

 NODE_MAP_LEDGER_ROUTES_TRIGGER: "[GetNodeMapLedgerRoutesTTHint]"
 NODE_MAP_LEDGER_ROUTES_HINT_TT:0 "§gAllows management of all incoming and outgoing trade routes from nodes. Editing a trade route has a 120 day cooldown§!"

 NODE_MAP_MARKER_TRIGGER: "[GetNodeMapMarkerTTHint]"
 NODE_MAP_MARKER_HINT_TT:0 "§gClick to select this node. Selecting a node highlights '§MTrade Links§!' on map. Selection also opens a panel to control country to send, remove, and manage income and outgoing trade routes.§!\n§GGreen§! highlight denotes a trade link.\n§OOrange§! highlight denotes an active trade route.\n\nOnce a node is selected, designated by a shine, selecting another node will allow one to create a trade route.§!"

 NODE_MAP_TRADE_CONNECTION_TRIGGER: "[GetNodeMapConnectionTTHint]"
 NODE_MAP_TRADE_CONNECTION_HINT_TT:0 "§gClick to view a connected node able to receive a trade route from the currently selected node.\n§GGreen§! highlight denotes a trade link.\n§OOrange§! highlight denotes an active trade route.§!"

