l_english:
exoskin_armoured_special_forces: "Екзошкіряні Елітні Сили"
exoskin_armoured_special_forces_desc: ""

fortification_master: "Майстер Фортифікації"

grd_wg_on_des: "МІСІЯ; Насувається-Буря"
grd_wg_on_des_desc: "§YПОЗИВНИЙ:§! §RRHIANNON§!\n§YЗВІТ ПРО МІСІЮ:§! §gПрокинься, Кардинале. Ти знову мені потрібен.\nНад Есмеральдою збирається буря. Знайди її джерело й розвій її.§!"

grd_wg_on_south: "МІСІЯ; Біло-Червоне"
grd_wg_on_south_desc: "§YПОЗИВНИЙ:§! §RMANAWYDDAN§!\n§YЗВІТ ПРО МІСІЮ:§! §gЯк так сталося?! Хтось чи щось притягує цих людей сюди? Це точно не входило в план! Виправ це!§!"

grd_unique: "МІСІЯ; Завтрашнє-Майбутнє"
grd_unique_desc: "§YПОЗИВНИЙ:§! §RPRYDERI§!\n§YЗВІТ ПРО МІСІЮ:§! §gТвої паскальбайти виявились гідними навіть такої перемоги. Знайди Світову Прірву та чекай нашого повернення.§!"

grd_advanced_recruitment_strategies: "\"Передові Стратегії Рекрутингу\""
grd_advanced_recruitment_strategies_desc: "Успіх Стражів як відгалуження Лост-Гіллз — це результат наших стратегій вербування. Якщо ми хочемо зростати, потрібно звертати увагу на інші групи пустки.\nТам на півночі є рейдери — їм не завадило б трохи освіти!"

grd_vip_wg: "\"Вербування\" Гадюк"
grd_vip_wg_desc: "Гадюки, можливо, не найочевидніший вибір для навчання їхніх молодих у наших лавах, з огляду на їхній дивакуватий культ. Але трохи болючої дисципліни — і вони стануть справжніми Стражами."

grd_ykz_wg: "\"Вербування\" Якуза"
grd_ykz_wg_desc: "Після поразки Якуза стануть відмінними рекрутами. Їхня дивна мова може стати сигналізаційним засобом — ідеальним для розвідників, адже її не зрозуміють сторонні."

grd_jac_wg: "\"Вербування\" Шакалів"
grd_jac_wg_desc: "Кровожерливі Шакали мають підозрілу тягу до людського м’яса, але якщо у людини є вада — її можна контролювати. Ми використаємо її як наш нашийник, зламаємо і перекуємо їх у справжніх Стражів."

grd_neighbors_beaten: "Обряд Посвяти"
grd_neighbors_beaten_desc: "Свічка, меч і батарея — наші сусіди зазнали поразки. Незабаром вони навчаться жити за законами Стражів."

grd_acquiring_the_old_worlds_bones: "Потенційні Послушники Серед Нас"
grd_acquiring_the_old_worlds_bones_desc: "Розширення лав — це не лише зовнішній пошук. У нашій землі живуть нащадки переможених. Час звернутись до них — нехай стануть частиною нашого шляху."

grd_sok_deep_integration: "Переосмислення Їхнього Бога"
grd_sok_deep_integration_desc: "Каґа був богом для Синів. Щоб навернути їх, потрібно зруйнувати фальшиву містичність і направити їх до вищої мети — служіння нам."

grd_tof_deep_integration: "Співпраця з Рейдерами"
grd_tof_deep_integration_desc: "215-й — колишні в’язні з Джеріко. Їх можна контролювати через обіцянку безпеки й каналу для гніву. З цього хаосу вийде щось більше."

grd_des_deep_integration: "Провалена Ідея"
grd_des_deep_integration_desc: "Бунтівні Рейнджери думали, що завжди мають захищати невинних. Доведемо їм, що ми краще зберігаємо старі ідеали, ніж вони самі."

grd_tvt_deep_integration: "Таємниці Андроїдів"
grd_tvt_deep_integration_desc: "Андроїди з TV-Таун мали власну волю, хоча й підкорялись страху. Хоч більшість із них знищено, деякі дані ми зберегли. Їхній вміст може бути ключем до відбудови пустки."

grd_repairing_guardian_citadel: "Ремонт Цитаделі"
grd_repairing_guardian_citadel_desc: "Цитадель зазнала шкоди під час боїв з силами НКР. Час привести її до ладу!"

grd_outer_sanctum: "Зовнішнє Святилище"
grd_outer_sanctum_desc: "Стіни зовнішнього святилища потребують оновлення. Керамічна броня андроїдів — ідеальний матеріал."

grd_armory_and_workshop: "Кузня та Збройова"
grd_armory_and_workshop_desc: "Саме тут виготовляється зброя й обладунки Стражів. Майстерні, що тримають наші мрії."

grd_tangs_lab: "Лабораторія Танга"
grd_tangs_lab_desc: "Танг — науковець-волонтер, що прибув у Цитадель. Він поділився деякими зі своїх секретів."

grd_repairs_finished: "Вітати Торговців"
grd_repairs_finished_desc: "Цитадель стоїть гордо — і пустка це бачить. Запросімо торговців, якщо в них є щось нам цікаве."

grd_guardians_of_the_world_hole: "Хранителі Світової Діри"
grd_guardians_of_the_world_hole_desc: "Саме тут, понад двісті років тому, за межами Сяйва, справжні засновники Братства пройшли крізь полум’я Великої війни неушкодженими. Незаймані душі §RТРОЙКИ§! — останнє чисте, що залишилося від старого світу, завдяки цьому — світовій дірі. Не існує вищої мети, ніж охороняти це священне місце, зберігати його, щоби ми могли покинути цей світ, коли полум’я повернеться знову."
grd_guardians_of_the_world_hole_tt: "§gМи спілкуємося з Казаном Переродження, що розташований у світовій дірі. Через нього ми отримуємо дари з-за меж цього світу.§!"

grd_tactical_lessons:0 "Тактичні інновації"
grd_tactical_lessons_desc:0 "Пустельники — не завжди найкращі рекрути, проте новобранці з наших кампаній у Неваді приносять цінний бойовий досвід. Дослідивши їхні успіхи та поразки і застосувавши здобуті знання до наших класичних тактик, ми отримаємо здатність ефективно діяти в значно ширшому спектрі бойових ситуацій."

grd_rush_of_laser:0 "Очищені кристалічні масиви"
grd_rush_of_laser_desc:0 "Мікроф’южн-елементи — потужне джерело енергії, але для потужного лазерного пострілу цього недостатньо. Відсутність рухомих частин робить лазерну зброю надійнішою за звичайну, проте тендітні кристали всередині потребують регулярного чищення та обслуговування. На щастя, у цьому ми — майстри."

grd_power_armor_restoration:0 "Навчання механіків"
grd_power_armor_restoration_desc:0 "Покидаючи Лост-Гіллс, ми взяли з собою найкраще обладнання. Але з часом чимало цінних бронекостюмів Т-51b вийшли з ладу. Наші вороги не мали уявлення, як працює ця технологія, але будь-яка велика війна вимагає фахівців, здатних лагодити й виготовляти спорядження. Із часом ми зможемо підготувати чимало таких інженерів серед місцевого населення."

grd_domestic_production:0 "Власне виробництво"
grd_domestic_production_desc:0 "Непрактично наполягати, щоб кожна одиниця зброї у наших солдатів була нашого виробництва. Особливо зараз, коли зброя стала основним товаром для торгівлі. Виробництво товарів подвійного призначення — цивільного і військового — зміцнить нашу позицію на ринку й дозволить обмінювати їх на зброю у кількостях, виробництво яких коштувало б значно дорожче."

grd_economic_boom:0 "Потік товарів"
grd_economic_boom_desc:0 "Ми ніколи не були особливо відкритими для світу, але що нам заважає змінитися? Приплив пустельників перетворив Цитадель на повноцінне цивільне поселення. Ігнорувати її потенціал як економічного центру було б нерозумно."

grd_grand_hallway_library:0 "Бібліотека Великого Коридору"
grd_grand_hallway_library_desc:0 "Одним із багатьох об’єктів у Зовнішньому Санктумі є бібліотека з довоєнними книгами під наглядом писарів. Серед численних художніх творів зберігається чимало посібників з озброєння, електроніки, техніки й вибухівки. Ці книги — крихкі, проте розширення ресурсів для їх розшифровки й переписування дозволить нам відкрити ще більше знань."