ROT_jax_campbell_name:0 "Джакс Кемпбелл"
ROT_jax_campbell_high_command_desc:0 "«Я не збираюся вдавати, що насильство — це приємно. Вбивство істот не має бути розвагою, але його необхідно здійснювати для підтримки порядку й очищення від бур’яну.»"

ROT_gabrielle_keen_name:0 "Ґабрієль Кін"
ROT_gabrielle_keen_economic_advisor_desc:0 "Одна лише ненависть не може бути твоїм єдиним джерелом поживи. Коли Ротпурґери готуються відібрати Спокен у мутантів, багато хто задається питанням, який буде їхній наступний крок, коли сніг уляжеться. Ґабрієль Кін вважає це першим кроком до відновлення частини старого світу. Гріхи їхніх пращурів ніколи не будуть змиті, але світ не мусить назавжди лишатися забрудненим попелом і соромом."

