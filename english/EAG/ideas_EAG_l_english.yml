eag_remnants_of_harlows_wall:0 "Залишки Стіни Гарлоу"
eag_remnants_of_harlows_wall_desc:0 "На початку 2100-х років пустельник, що колись був інженером-цивільником — Віктор Гарлоу, — побудував зовнішню стіну Орлиної Скелі з металобрухту та армованого бетону. Стіну Гарлоу визнали інженерним дивом пустки: конструкцію зі складною системою з'єднаних опор і запасів міцності, здатну витримати як час, так і облогу.\n\nПротягом десятиліть вона стояла непохитно, символ порядку у світі хаосу. Але час — ворог безжальний. Іржа знищувала вузли, а недбалі ремонтники перетворили точну конструкцію на латану халабуду. Коли вождь Грог з племені Старих Кісток повів своїх воїнів на південь, він легко використав слабкі місця в стіні. Брутальна сила та безжальність дали йому перемогу: великі ділянки впали, перетворившись на купу скрученого металу та уламків.\n\nСьогодні залишки Стіни Гарлоу — це похмуре нагадування про те, як навіть найвеличніші творіння можуть канути в небуття."