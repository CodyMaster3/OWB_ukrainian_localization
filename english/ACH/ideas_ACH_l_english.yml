ach_pacification_tt:0 "Система Пацифікації Активна: §GТак§!\n\n§gВідділення Аламо складається з прибічників Кодексу Братства.\nВони категорично відмовляються від інтеграції нових територій до свого Відділення, а також від набору мутантів чи небажаних елементів.§!"

