ACH_bos_volunteers:0 "Добровольці Братства"
ACH_bos_volunteers_desc:0 "Із моменту нашого розриву з Техасом до нас тягнуться подорожні з Відділень по всій Америці. Вони підтримують нашу справу та прагнуть приєднатися до нас — як тих, хто втілює справжні ідеали Братства."

