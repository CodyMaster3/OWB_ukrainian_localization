ach_defender_trait:0 "Захисник"
ach_defender_trait_desc:0 "Найпоширеніший ранг серед бійців і бійчинь Відділення Аламо. Захисники — кістяк армії, хоча через обмежений набір рекрутів часто виконують обов’язки в інших секторах."

ach_protector_trait:0 "Оборонець"
ach_protector_trait_desc:0 "Офіцери й командири Відділення Аламо. Як правило — ветерани, що пройшли крізь пекло. Користуються довірою бійців, хоч і рідкісні."

ach_sentinel_trait:0 "Сентинел"
ach_sentinel_trait_desc:0 "Колишні Захисники, які проявили виняткову мужність. Очолюють спеціальні підрозділи на найнебезпечніших напрямках."

ach_specialist_trait:0 "Спеціаліст"
ach_specialist_trait_desc:0 "Науковці й інженери Відділення Аламо — еквівалент «писарів» в інших Відділеннях. Солдати часто називають їх і так, і так."

ach_elder_trait:0 "Надзвичайний Старійшина"
ach_elder_trait_desc:0 "Відділення Аламо намагається дотримуватись Кодексу Лост-Гіллс дослівно. Та хаотичне походження змусило їхнього найвищого лідера порушити правила. Старійшину має обирати рада — але така рада ніколи не збиралась. Через це Кетрін Торні — технічно лише «Надзвичайний Старійшина». Хоча навряд чи це когось турбує — її авторитет відсікає будь-який спротив."

