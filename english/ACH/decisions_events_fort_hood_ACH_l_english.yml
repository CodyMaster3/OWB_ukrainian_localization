# Події
nf_event_ach.23.t:0 "Відділення Аламо просить допомоги Розадо"
nf_event_ach.23.d:0 "Розадо та Кетрін були учасницями першої експедиції до глибин цього старого військового об'єкта. Саме там кандидат у президенти втратила руку. Тепер Братство знову просить її допомоги, щоб пробитися крізь високий рівень безпеки. Дозволити цим старим зв’язкам відродитися — чи визнати це надто ризикованим? Зрештою, Аламо — в Техасі."
nf_event_ach.23.a:0 "Так!"
nf_event_ach.23.b:0 "Ні!"

nf_event_ach.24.t:0 "Секретні двері Ґамма-Тринадцять"
nf_event_ach.24.d:0 "Минулого разу ми дістались цих дверей. Непрохідні. Без жодного обхідного шляху. Міцна, укріплена металева конструкція, що перекриває нам шлях. Але ми мусимо пройти. Хто знає, які дива чекають далі за цією перепоною?"
nf_event_ach.24.a:0 "Використати грубу силу"
nf_event_ach.24.b:0 "Зламати систему"
nf_event_ach.24.c:0 "Спробувати обійти"
nf_event_ach.24.e:0 "Відступити"
nf_event_ach_24_a_tt:0 "Грюкнути — можливо, вибухне. Або обвалиться. Може, краще не грюкати, а підірвати."
nf_event_ach_24_b_tt:0 "Використання кодів безпеки, підготованих нашими писарями, — найкращий варіант. Якщо їх вистачить."
nf_event_ach_24_c_tt:0 "Ймовірність знайти обхід — мізерна. Дуже мізерна. Але спробувати ніколи не завадить, правда?"
nf_event_ach_24_e_tt:0 "Можемо повернутись пізніше — краще оснащені та готові до цього виклику."

nf_event_ach.25.t:0 "Успіх"
nf_event_ach.25.d:0 "Ми пройшли. Нам вдалося. Далі — лише глибше. Кожен крок наближає нас до перемоги."
nf_event_ach.25.a:0 "Загартовані сталлю"

nf_event_ach.26.t:0 "Жахлива трагедія"
nf_event_ach.26.d:0 "Інколи — сила безсила. Інколи — коди безпорадні. Інколи — нам просто не щастить. Але ми принаймні спробували. І хто нас за це засудить? Ми не знали кращого."
nf_event_ach.26.a:0 "Їх пам’ятатимуть"

nf_event_ach.27.t:0 "Це місце — лабіринт"
nf_event_ach.27.d:0 "А я попереджала!!!"
nf_event_ach.27.a:0 "Спробуємо знову"

nf_event_ach.28.t:0 "Коридор зі зброєю"
nf_event_ach.28.d:0 "Зброя, зброя, зброя. Зазвичай брати й сестри радіють перспективі знайти автоматичні системи, здатні прорізати навіть T-51b. Але є виняток — якщо дуло направлено на нас. Як подолати це — вирішувати нам."
nf_event_ach.28.a:0 "Груба сила"
nf_event_ach_28_a_tt:0 "Сила проти турелей. Може й подіє. Але доведеться заплатити кров’ю."
nf_event_ach.28.b:0 "Зламати"
nf_event_ach_28_b_tt:0 "Ці турелі складні. Кількох кодів може не вистачити, решту доведеться знищити."
nf_event_ach.28.c:0 "Суперзлам"
nf_event_ach_28_c_tt:0 "Якщо використаємо надмірну кількість кодів — зможемо відключити все."

nf_event_ach.29.t:0 "Турелі нейтралізовано"
nf_event_ach.29.d:0 "Яким би не був спосіб — ми пройшли. Сподіваємось, більше ми їх не побачимо."
nf_event_ach.29.a:0 "Вперед"

nf_event_ach.30.t:0 "Невдача з турелями"
nf_event_ach.30.d:0 "Що б ми не зробили — цього було недостатньо. Нехай наші полеглі простять нас."
nf_event_ach.30.a:0 "Сумуємо за ними"

nf_event_ach.31.t:0 "Силові поля безпеки"
nf_event_ach.31.d:0 "До-військова Америка знала, як перешкоджати конкуренції. Імпульсні поля, що пропускають лише тих, хто має відповідний генетичний код — одна з таких перешкод. Всі інші — перетворюються на пил. Це примарне світіння — моторошне. Глибоко під землею. Сподіваймось, знайдеться шлях... або зворотній."
nf_event_ach.31.a:0 "Груба сила"
nf_event_ach_31_a_tt:0 "Сила проти системи, створеної саме для того, щоб запобігти цьому — поганий знак. Але можемо спробувати."
nf_event_ach.31.b:0 "Злам"
nf_event_ach_31_b_tt:0 "Очевидно кращий варіант — якщо вистачить кодів."

nf_event_ach.32.t:0 "Успіх"
nf_event_ach.32.d:0 "Ми це зробили. Завдяки коду чи силі — але ми пройшли. Як глибоко веде цей шлях? Скільки ще доведеться витримати, аби досягти мети?"
nf_event_ach.32.a:0 "Ми впораємось"

nf_event_ach.33.t:0 "Невдача"
nf_event_ach.33.d:0 "Розірвані. Спалені. Розпорошені. Від братів не залишилось нічого, крім попелу. Вирвані з життя старими технологіями, що в чужих руках — справжні чудовиська."
nf_event_ach.33.a:0 "Ми витримаємо"

nf_event_ach.34.t:0 "Сплячі вартові"
nf_event_ach.34.d:0 "Ми маємо вирішити, що робити. Перетворити їх на металобрухт чи спробувати підпорядкувати? Сподіваймось, наше рішення буде правильним — поки ми крокуємо між тисячами сплячих машин смерті."
nf_event_ach.34.a:0 "Знищити їх"
nf_event_ach_34_a_tt:0 "Краще перестрахуватись, ніж пошкодувати"
nf_event_ach.34.b:0 "Спробувати зламати"
nf_event_ach_34_b_tt:0 "Краще пошкодувати, ніж перестрахуватись"

nf_event_ach.40.t:0 "Сентинел — Автоматизована Броньована Одиниця"
nf_event_ach.40.d:0 "Ось воно — світіння над силуетом броні та термінал зі схемами. Але серце цього творіння — не сталь, а сплячий код. Готовий пробудити обладунки без господарів. Підпорядковані одному брату. Ми станемо легіоном. Це було того варте. Кожна жертва. Сталеві вартові принесуть порядок у цей беззаконний світ. Викувані в сталі. Загартовані в крові."
nf_event_ach.40.a:0 "За Братство!"

nf_event_ach.43.t:0 "Розадо допоможе"
nf_event_ach.43.d:0 "Схоже, Розадо погодилась працювати з нами. Хоч її дім — Глорія, вона спокійна, знаючи, що ми не прагнемо підкорити Техас і її Батьківщину."
nf_event_ach.43.a:0 "Та ми ж не чудовиська"
nf_event_ach.43.a_tt:0 "Наш доступ до Форт-Гуд буде покращено."

nf_event_ach.44.t:0 "Розадо лишається вдома"
nf_event_ach.44.d:0 "Попри поразку на виборах, Розадо вирішила залишитися викладати в Глорії замість того, щоб допомагати нам. Що ж, ми поважаємо таке прагнення до знань."
nf_event_ach.44.a:0 "Молодець!"

