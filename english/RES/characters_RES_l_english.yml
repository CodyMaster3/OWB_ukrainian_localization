l_english:
  RES_WILLEM_CLARK_NAME: "Віллем Кларк"
  RES_WILLEM_CLARK_DESC: ""§GСпоглядайте, діти Кларка, бо він той, хто веде вас до Обіцяної Землі, де ми правитимемо як володарі й спасителі, а гладкошкірі схиляться перед нами.§!"\n\nДоктор Віллем Кларк був талановитим ядерним фізиком у Лос-Аламосі до Великої Війни. Як головний науковець у відділі ядерних досліджень на Підрівні 3, він очолював вірну спільноту науковців. Разом із доктором Себастьяном Істом вони стали піонерами в експериментальних галузях ядерної науки. Поки Біґ Маунтін перетворював неможливе на реальність, а Інститут Технологій Співдружності переосмислював саме поняття людини, Лос-Аламос удосконалював уже існуючі технології. Від суперкомп'ютера MANIAC, створеного як потенційний суперник ZAX, до вдосконалення ядерної ракети Minutemen XI — всі ці розробки беруть початок саме звідси.\n\nКоли впали бомби, Кларк узяв усе під контроль, підтримуючи надію серед тих, хто вижив: надію повернутися на поверхню й почати нове життя. Коли вони нарешті вийшли нагору, їх залишилось лише кілька десятків ґулів. Кларк вирушив на пошуки інших вижилих. За рік він повернувся до Резервації з двома, а то й трьома десятками ґулів, оголосивши, що ґулізація — це еволюційний процес, який дозволить процвітати в радіоактивному світі. Він став їхнім володарем і спасителем, провідником у нову еру людства — еру ґулів.\n\nУ наступні два століття доктор Кларк збирав ґулів з усіх пусток до Резервації та збудував імперію. Його ґули поклонялись йому як божеству, і сам він почав вважати себе богом. Останні п’ятдесят років він став відлюдькуватим, спілкуючись лише через комп’ютерні термінали та звертаючись до себе в третій особі. Він продовжував вести свій народ до Обіцяної Землі аж до своєї смерті — якщо вона коли-небудь настане."

