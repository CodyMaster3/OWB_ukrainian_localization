FOU_BLITZ_NAME:0 "Ед Бліц"
FOU_BLITZ_DESC:0 "Лідер Четверняка народився там же, де й сама громада — у Шаста-Понді, маленькому тимчасовому поселенні для торговців, які курсують між Орегонською Трасою та Великим Коло. Батько Еда був красномовним караванником, а мати — загартованою охоронницею караванів, і, зважаючи на те, ким він став, можна сказати, що він успадкував найкраще з обох світів.\n\nПісля смерті батька він перейняв справу та швидко виріс як купець і місцевий лідер, перетворивши улюблену зупинку всіх мандрівників на справжнє місто. Коли Шаста-Понд став замалим, громада переїхала до руїн О'Браєна, які почали відбудовувати. Людина з харизмою й силою, Ед мусив засвоїти нові уроки, адже керувати людьми — це дещо більше, ніж просто виголошувати гарні промови й розбивати черепи. Це ще й логістика: водогін, податки, постачання.\n\nЧетверняк під керівництвом Еда процвітає, адже стояти в тіні Ведмедя має свої переваги. Вони мають усі шанси стати новою торговельною силою регіону. Але коли доводиться конкурувати і з Нью-Ріно, і з Реддінґом, та ще й не наступити на хвіст самому Ведмедю — доводиться дуже обережно балансувати між молотом і ковадлом."