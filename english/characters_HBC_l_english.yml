HBC_DELMAR_NAME:0 "Делмар О’Доннел"
HBC_DELMAR_DESC:0 "Делмар очолив групу мисливців-капканників і повалив свого двоюрідного брата, Біґ Дена, через підозру в його зв’язках із Королівством. Тепер вони процвітають завдяки політиці Делмара щодо повного зняття обмежень на полювання, хоча це й призвело до руйнування місцевої популяції тварин, а також до полювання на інших людей. М’ясо останніх потрапляє як до рук канібалів, так і до нічого не підозрюючих торговців."