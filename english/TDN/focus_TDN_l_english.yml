l_english:
########## Start events branch
den_story1:0 "Барліг Пороку"
den_story1_desc:0 "До війни Діра була лише одним з багатьох маленьких містечок на кордоні між сонячною Каліфорнією та туманним Орегоном — місцем, забутим усіма богами. Саме це дивне розташування врятувало її від китайських ядерних ударів."

den_story2:0 "Походження родини Мордіно"
den_story2_desc:0 "У Діри змінювалися господарі, але всі знають — справжні хазяї тут Мордіно. Колись від їхнього імені тремтіли цілі райони Невади, хоча починалося все з малого, як у будь-якої великої родини."

den_story3:0 "Розширення Мордіно"
den_story3_desc:0 "Була пора, коли Мордіно були могутньою родиною, що боролася за контроль над Ріно. О, ті славетні дні... Вони давно позаду, та жоден Мордіно не відмовиться від приємної ностальгії за тією епохою."

den_story4:0 "Занадто великі для 'Найбільшого маленького міста'"
den_story4_desc:0 "Злет впливу родини Мордіно був стрімким, та й падіння їхньої могутності не забарилося. Що ж їх знищило? Це вже залежить від того, кого ви спитаєте."
########## Reno conquest branch
den_slave_warriors:0 "Раби-воїни"
den_slave_warriors_desc:0 "Дон Мордіно давно мріє відновити справжню силу родини Мордіно та знову здобути владу в Нью-Ріно. Для цього йому потрібні бійці, багато бійців. Раби, які вірять у обіцянку свободи, — чудовий рекрутський ресурс."

den_hire_salvatore:0 "Найняти Сальваторе"
den_hire_salvatore_desc:0 "У Мордіно з родиною Сальваторе завжди були складні стосунки. Ми ніколи не були друзями, але іноді співпрацювали. Тепер, коли їхній вплив у Ріно ослаб, настав час запропонувати їм приєднатися до нашого наступу на місто."

den_hire_van_graffs:0 "Найняти Ван Ґраффів"
den_hire_van_graffs_desc:0 "Не секрет, що родини Ріно намагаються домовитися з Ван Ґраффами. Ті нині — одна з небагатьох незалежних сил Північної Каліфорнії. Але чому б не зробити їм зустрічну пропозицію і перетягти на свій бік?"

den_anti_reno_coalition_yakuza:0 "Найняти Якудза-ронінів"
den_anti_reno_coalition_yakuza_desc:0 "Якудза — гордий народ, у якого свої рахунки з Ріно. Зазвичай вони тримаються осторонь, але в кожного є своя ціна."

den_anti_reno_coalition_jacals:0 "Найняти Шакалів"
den_anti_reno_coalition_jacals_desc:0 "Шакали — ненадійні союзники через свою жорстокість і канібалізм, але їх завжди можна найняти."

den_border_war:0 "Розвідка периметра"
den_border_war_desc:0 "Нам вдалося зібрати велику силу. В нас є власні солдати, Сальваторе й Ван Ґраффи. В нас є союзники — Якудза й Шакали. Але перед тим як почати наступ, потрібно продемонструвати нашу силу та захопити плацдарм для удару по Ріно. Армійський склад Сьєрра підійде для початку."

den_conquest_reno:0 "Повернення до Ріно"
den_conquest_reno_desc:0 "Наша армія вже загартована в боях, настав час рушити на Ріно. Родини пошкодують, що колись вигнали нас."

########## Den development branch
den_development:0 "Розвиток Діри"
den_development_desc:0 "Під час нашого вимушеного відступу з Ріно ми втратили чимало ресурсів. Якщо хочемо досягти успіху, Діра має стати чимось більшим, ніж просто підмишкою Каліфорнії."

den_slaver_raid_forways:0 "Набіг на Форвейс"
den_slaver_raid_forways_desc:0 "Для подальшого розвитку нам потрібен стартовий капітал. Але Діра має огидну репутацію, і ніхто не інвестуватиме у це гниле місто. Нам потрібна дешева робоча сила та раби для продажу — на щастя, їх легко дістати."

den_slaver_raid_medford:0 "Набіг на Горнбрук"
den_slaver_raid_medford_desc:0 "Горнбрук — одна з багатьох дрібних громад Північної Каліфорнії. Її мешканці нам потрібні як дешева праця для наших будівництв."

den_new_dawn_of_slavery:0 "Відновити Гільдію работоргівців"
den_new_dawn_of_slavery_desc:0 "Кляті рейнджери роками дошкуляли работоргівцям Діри. Але поки вони зайняті Мохавою, ми знову можемо знаходити 'слуг' для Пустки. Потрібно лише підкупити Республіку, щоб вона не втручалась..."

den_rebecca_casino:0 "Казино Ребекки"
den_rebecca_casino_desc:0 "Ребекка — одна з небагатьох, хто ще має вплив у Дірі. Добровільно чи ні, вона надасть частину своїх статків на користь міста."

den_momsdiner:0 "Закусочна Мами"
den_momsdiner_desc:0 "Страви з м’яса щурів у ресторані Мами не призначені для вибагливих. Але за таку ціну й смак — гріх скаржитися!"

den_machines_from_junk:0 "Найкращий гараж Орегону"
den_machines_from_junk_desc:0 "У Дірі є чималий звалищ автомобільних запчастин з усієї Північної Каліфорнії. Ми можемо почати збирати техніку з цього брухту."

########## Den victory
den_became_reno:0 "Мордіно повернулися!"
den_became_reno_desc:0 "Ми це зробили! Ріно нарешті належить нам. Ми контролюємо його, ми перемогли Райтів, Бішопів і цих мутантів. Тепер ніхто не поставить під сумнів нашу владу над містом. Час офіційно заявити про себе як єдину силу в Ріно."

########## Reno development branch
den_allroads:0 "Усі дороги ведуть до Ріно"
den_allroads_desc:0 "Усі, хто шукає ніч розваг, зрештою опиняються в Ріно. Інвестування в місцеву інфраструктуру неодмінно принесе нам бізнес — а отже, і прибутки."

den_expansion_van_graffs:0 "Розширення Ван Ґраффів"
den_expansion_van_graffs_desc:0 "Попри їхню спершу ворожу позицію до нашого завоювання Ріно, вони охоче продаватимуть зброю всім, хто потребує захисту. У певному сенсі, вони — герої Пустки."

den_silverrush:0 "Срібний Натиск"
den_silverrush_desc:0 "Срібний Натиск — це підприємство Ван Ґраффів, що спеціалізується на енергетичній зброї та високих технологіях. Партнерство з ними дозволить розширити доступ до просунутої техніки в Ріно."

den_megaladon_club:0 "Клуб «Мегалодон»"
den_megaladon_club_desc:0 "Клуб «Акулячий» заслужено вважався одним із найбільших гральних закладів міста. Тепер наша черга відновити його — і перетворити на головну принаду для гравців з усієї Північної Каліфорнії та Невади."

den_gladiators:0 "Гладіаторські бої"
den_gladiators_desc:0 "Раніше Бішопи встановили правила — заборона клинків та боїв на смерть. Але це нудно. Надихнувшись Легіоном, ми влаштовуватимемо смертельні поєдинки. Весело, правда ж?"

den_newcomic:0 "Наші комедійні шоу"
den_newcomic_desc:0 "Втомились від азартних ігор? Завітайте до «Сховища Сміху» на комедійне шоу. Жарти тут гірші за ваше особисте життя — але це й робить їх кращими."

den_catpaw:0 "«Котяча Лапка»"
den_catpaw_desc:0 "«Котяча Лапка» — найвідоміший бордель нашого міста, що гідно конкурує з Ґоморрою. Насолода для кожного клієнта вже чекає. Тільки залиште дітей у садку."

den_tipography:0 "Відновити друкарню"
den_tipography_desc:0 "«Котяча Лапка» — це не лише бордель. Колись тут видавали однойменний еротичний журнал. На жаль, збереглося лише кілька примірників. Але ми можемо надрукувати нові!"

den_desperado:0 "Реновація «Десперадо»"
den_desperado_desc:0 "Казино «Десперадо» — один із великих закладів Ріно, належить Мордіно. Водночас це центр торгівлі джетом у місті."

den_addictsworks:0 "Залучити наркоманів до праці"
den_addictsworks_desc:0 "Кажуть, Мордіно тримають усіх через джет. Наклеп. Ми просто надаємо знижки на джет тим, хто підписує багаторічний контракт на роботу. Вигідно всім!"

den_goldenglobes:0 "«Золоті Ґлобуси»"
den_goldenglobes_desc:0 "Брати Корсиканці створили першу порно-студію після війни, і досі піднімають бойовий дух солдатів Республіки. Ми не просто заробляємо — ми творимо краще майбутнє."

den_chopshop:0 "Автосервіс «Чоп Шоп»"
den_chopshop_desc:0 "Починав як маленька майстерня на околиці, а нині — один із найкращих автоцентрів у Пустці! Не забувайте замикати машину... Жарт. Або й ні.\n\nЦей жарт вважається офіційним попередженням і знімає відповідальність з майстерні."

den_powerplant:0 "Міська електростанція"
den_powerplant_desc:0 "Родина Райтів завжди була в енергетичній системі міста — саме вони побудували нашу електростанцію. Дехто каже, що вона працює на їхній пихатості, але насправді — на екологічному вугіллі."

den_distillery:0 "Відновлення винокурні"
den_distillery_desc:0 "Горілчаний завод Райтів постраждав під час політичних конфліктів, але тепер знову працює! Тільки не пийте його на льоду — мутантському стилі."

den_rail:0 "Шахтні залізниці"
den_rail_desc:0 "Колись поблизу міста проходила одна з найбільших залізниць штату. Ми досі використовуємо її метал для нашої індустрії — старе стає новим."

den_newpeople:0 "Нові мешканці"
den_newpeople_desc:0 "Одне не можна відняти у Райтів — ідеалізм. Вони вірили: побудуй — і вони прийдуть. Побудова соціальної інфраструктури дає нам шанс залучити нових жителів до міста."

den_contracts:0 "Розширені контракти"
den_contracts_desc:0 "На відміну від тиранічної НКР, ми не змушуємо громадян воювати. Вони самі укладають угоди з родинами на захист міста! Хіба не герої?"

den_golgotha:0 "Відновити Ґолґофу"
den_golgotha_desc:0 "Ґолґофа — це кладовище за межами Ріно, де ховали мертвих і тих, хто перешкоджав родинам. Відновлення Ґолґофи допоможе нам тихо позбуватися проблемних елементів."

den_salvatorebar:0 "«Італійський Ґриль» Сальваторе"
den_salvatorebar_desc:0 "«Сальваторе» — це не просто бар, а найкраща італійська кухня у всій Пустці. Принаймні, ми так кажемо. Бо більше італійських закладів не знаємо!"

den_chem:0 "Аптека Ренеско"
den_chem_desc:0 "Аптека Ренеско — одна з найприбутковіших інвестицій Сальваторе. Це не просто точка продажу хімії — це головний центр наркоторгівлі в місті. Саме тут усі дилери отримують товар. Родина заробляє великі гроші — і ми маємо розширити цей бізнес."

den_arms:0 "Озброєння Ріно"
den_arms_desc:0 "«New Reno Arms» — один із найпрестижніших виробників зброї у Північній Каліфорнії. Кажуть, їхні вироби навіть кращі за продукцію Gun Runners. Інвестиції в них — це й оборона, і прибуток."

den_sanctuary:0 "Місто-притулок"
den_sanctuary_desc:0 "Ріно — місто заможне, тож до нас часто тягнуться вигнанці Пустки. Якщо ми закриємо очі на їхнє минуле, отримаємо нових громадян."

den_sweatshop:0 "Пітні майстерні"
den_sweatshop_desc:0 "Мета виправдовує засоби, а праця у майстернях — надзвичайно ефективна. Це ж відморозки й наркомани, які б інакше здохли на вулиці. А так — хоч користь."

den_sierradepot:0 "Пограбування складу Сьєрра"
den_sierradepot_desc:0 "Склад Армії Сьєрра містить неймовірні скарби. Створення постійної групи для його розграбування забезпечить потік озброєння для наших родин. Але чому мешканці Вольт-Сіті так сердяться?"

den_techslot:0 "Розкопки складу Сьєрра"
den_techslot_desc:0 "Перетворення грабежу складу Сьєрра на повномасштабні розкопки вимагатиме ресурсів, але передвоєнні технології варті цього. Ми можемо отримати багато знань з цього місця."

########## Den military branch
den_mercmilitary:0 "Армія Найманців"
den_mercmilitary_desc:0 "У Ріно немає регулярної армії, якщо не вважати за таку гопників різних сімей. Замість того ми покладаємося на найманців. Багатство Ріно дозволяє укладати з ними довгострокові контракти."

den_radio:0 "Радіо Нового Ріно"
den_radio_desc:0 "Будівництво радіовеж по всьому Ріно буде корисним як для розваг, з трансляцією музики, так і для прихованого зв'язку — без втручання гангстерів та інших армій."

den_oldbirds:0 "Старі Птахи"
den_oldbirds_desc:0 "«Старі Птахи» — це група гулів-наємників, які ще до війни служили десантниками та пілотами. Тепер, коли аеропорт у Ріно знову відкритий, ми можемо найняти їх як основу повітряних сил."

den_precautions:0 "Запобіжні Заходи"
den_precautions_desc:0 "Ми повинні подбати про безпеку наших активів. У Пустці покладатися на добросусідство — це самогубство. Ми зведемо велику стіну навколо Нового Ріно."

den_hedge:0 "Підстраховка"
den_hedge_desc:0 "Укріплення колишньої території якузи відлякає нові банди рейдерів від поселення там. А ще, з потенційними ворогами на півдні й заході, краще підстрахуватися."

den_airport:0 "Старий Аеропорт Ріно"
den_airport_desc:0 "Можна провести реконструкцію довоєнного аеропорту в Ріно, і використати його як авіабазу. Можливості мережі повітряного сполучення — безмежні."

den_capsforloyalty:0 "Кришки за Вірність"
den_capsforloyalty_desc:0 "Хтось каже, що лояльність найманців — річ хитка. Але в Пустці немає нічого потужнішого за мотивацію кришками. А у нас їх повно."

den_tactics:0 "Тактики Найманців"
den_tactics_desc:0 "Ми — не держава, і в нас немає офіцерського корпусу. Замість того ми покладаємося на найманих капітанів. Варто узагальнити їхній досвід, щоб покращити керування військами."

den_councilfunding:0 "Фінансування Військової Ради"
den_councilfunding_desc:0 "Майже безпрецедентний крок — формалізувати військову раду, до складу якої увійдуть гангстери, охоронці родин і наймані армії. Вони відповідатимуть за стратегію та операції."

den_enctech:0 "Радники Ван Ґраффів"
den_enctech_desc:0 "Кажіть що хочете про Мамашу Ван Ґрафф, але вона знається на війні. Дамо їй місце в нашій військовій раді."

den_mutanttech:0 "Мутантські Техніки"
den_mutanttech_desc:0 "До ради також можна долучити супермутанта — колишнього генерала армії Майстра. Його досвід у війнах Пустки кардинально змінить нашу стратегію."

den_merc:0 "Більше Найманців"
den_merc_desc:0 "Навколо Нового Ріно — безліч найманих загонів різного масштабу. Обережно діючи, ми зможемо використати їх на свою користь."

den_vengefulsons:0 "Месники-Сини"
den_vengefulsons_desc:0 "«Месники-Сини» — плем’я, вигнане з рідних земель диктатором Цезарем. Вони неорганізовані, але люті, численні, й жадають помсти. Це — зброя, яку ми можемо використати."

den_pablos:0 "Конкістадори Пабло"
den_pablos_desc:0 "Конкістадори Пабло — досвідчений підрозділ піхоти з Мексики. Дисципліновані, гнучкі та навчені діяти в будь-яких умовах."

den_blackvultures:0 "Придбати «Чорних Соколів»"
den_blackvultures_desc:0 "Чорні Соколи прибули з далекого півдня, навіть далі за Мексику — з радіоактивних джунглів. Озброєні лазерами, вони — фанатики пророка Санта-Муерте. Але непогані воїни."

den_junkgladiators:0 "Гладіатори зі Звалища"
den_junkgladiators_desc:0 "Гладіатори зі Звалища — армія повністю з роботів, під проводом психопата на ім’я Піт-Майстер Фразз. Ідеальні для важкої підтримки."

den_roadpsychos:0 "Рекрутувати Дорожніх Психів"
den_roadpsychos_desc:0 "Дорожні Психи — колишні «Вісімдесяті», які відмовилися від культових порядків Тандерберда. Їх цікавить лише прибуток. Нам вони підходять."

den_nanjimiclan:0 "Залучити клан Шьоко"
den_nanjimiclan_desc:0 "Клан Осана Шьоко — відступники серед якузи, що прагнуть помститися НКР за рейд на Марклі у 2250 році. Майстри меча, надзвичайно небезпечні. Але навіть вони потребують грошей."

den_artillery:0 "«Пекельні Молоти»"
den_artillery_desc:0 "«Пекельні Молоти» — божевільна, але чітко організована група фанатів важкого озброєння. Артилерія, міномети, бронетехніка — вони можуть стати найкращим щитом для нашого міста."

########## Den expansion branch
den_expansionism:0 "Експансіонізм"
den_expansionism_desc:0 "Так, Ріно — найбільше з малих міст, але навіщо зупинятися лише на ньому? Ми — велика сила у Пустці, і настав час, щоб усі це визнали. Розширимо наші кордони."

den_conquest_west:0 "Західні Рубежі"
den_conquest_west_desc:0 "На захід від Діри — слабко контрольовані землі Північної Каліфорнії. Незабаром хтось їх поневолить: НКР, Аро́йо чи ще хтось. Щоб убезпечити себе, ми повинні зробити це першими."

den_medford_slavery:0 "Ув'язнені Знову"
den_medford_slavery_desc:0 "Хорнбрук колись був тюрмою суворого режиму, що годувала ціле місто. Мешканці загинули, а ув'язнені захопили в'язницю і пережили ядерну зиму."

den_medford_plantation:0 "Спокута Працею"
den_medford_plantation_desc:0 "Сучасні мешканці Хорнбрука — спадкоємці злочинців. Хай працюють заради спокути. Так, з наших вуст це лицемірство, але хіба комусь є до цього діло?"

den_fourways_slavery:0 "Більше Рабів із Племен"
den_fourways_slavery_desc:0 "Що таке Форвейс і яка його історія? Якщо чесно — нам байдуже. А минуле рабів нас цікавить? Ні. Вони повинні просто працювати."

den_fourways_plantation:0 "Засіяти Мисливські Землі"
den_fourways_plantation_desc:0 "Тутешні племена жили полюванням. Дуже неефективне використання землі. Ми просто переоремо ці мисливські угіддя й засіємо кукурудзою."

den_core_medford_fourways:0 "Опора на Заході"
den_core_medford_fourways_desc:0 "Захід — наш. Ми зруйнували традиційний уклад місцевих племен і включили ці землі до економіки Каліфорнії."

den_klamathagreements:0 "Торгівля Ґеконами"
den_klamathagreements_desc:0 "Кламат процвітає завдяки полюванню на ґеконів. А чому б нам не співпрацювати? Їхнє м'ясо чудове — особливо у тако-барі «Десперадо»!"

den_debtwarriors:0 "Воїни за Борг"
den_debtwarriors_desc:0 "Кламатські воїни винні нам за все, що дає їм Нью-Ріно. Тож тепер вони воюють за нас. Контракти суворі, але відділ кадрів усе схвалив."

den_klamath_resourses:0 "Спожити Ресурси Кламату"
den_klamath_resourses_desc:0 "Кламат — небагатий. Є трохи брухту, багато їжі — цього достатньо."

den_occupationklamath:0 "Учителі Просвіти"
den_occupationklamath_desc:0 "Кламатці вважають себе цивілізованими, але життя у руїнах — ще не цивілізація. Ми відкриємо для них школу. Звісно, з нашим мером-наглядачем."

den_rat_farms:0 "Смачний Білок"
den_rat_farms_desc:0 "Кроти й ґекони — чудове джерело білка. Наймемо фермерів, щоб розводили їх. Туристи на бюджеті не пожаліють."

den_core_klamath:0 "Ще Одне Маленьке Місто"
den_core_klamath_desc:0 "Кламат — скромне містечко з Орегону, відоме шкурами ґеконів. Тепер він відомий як ще один підконтрольний Ріно населений пункт."

den_trade_arroyo:0 "Торгівля з Орегоном"
den_trade_arroyo_desc:0 "Орегон — небезпечна територія: канібали, рейдери, мутанти... Але саме тому тамтешні люди готові платити за наші товари більше. Почнемо з Аро́йо."

den_slags_and_modoc:0 "Органічне Фермерство"
den_slags_and_modoc_desc:0 "Ферми Модоку — житниця Північної Невади. Завдяки їм наші шведські столи — багаті. Не звертайте уваги на деякі «постачальні рішення»."

den_modoc_slavery:0 "Рабовласницька Гільдія Модоку"
den_modoc_slavery_desc:0 "Суперечливо, але вигідно: перетворивши мешканців Модоку на рабів, ми дамо Ван Ґраффам безкоштовну їжу. Армії голодними не залишаться."

den_modoc_plantation:0 "Нові Ферми"
den_modoc_plantation_desc:0 "Багато дрібних орендарів з НКР охоче приїдуть працювати на північ. Хай кажуть, що це «чесна праця» — нам так навіть смішніше."

den_pure_water:0 "Чиста Вода"
den_pure_water_desc:0 "Про Слаґів пам’ятають лише через їхнє велике підземне озеро з чистою водою. Проведемо труби до Ріно."

den_subterrain_farms:0 "Підземні Ферми Слаґів"
den_subterrain_farms_desc:0 "Слаґи майстри підземного грибного землеробства. Елітні гриби — елітні ціни. Працюємо!"

den_core_modoc:0 "Ставка Зроблена"
den_core_modoc_desc:0 "Слаґи — під впливом Ріно. Освоювати ці землі ризиковано, але гра варта свічок."

den_cityofsins:0 "Місто Гріха"
den_cityofsins_desc:0 "Нью-Ріно був і буде незалежним. Ми не встрягаємо в дурні конфлікти гігантів Пустки. НКР надто дурна, щоби напасти, а до того часу — насолоджуємось."

den_nevada:0 "Пакт Невади"
den_nevadaa_desc:0 "З НКР нам не по дорозі. Але й самостійно вижити дедалі важче. Пора задуматися про Пакт Невади — військовий союз розвинених громад Пустки."

########## Den NCR war branch
den_prepair_to_war:0 "Підготуватись до Війни з Республікою"
den_prepair_to_war_desc:0 "Нова Каліфорнійська Республіка у скрутному становищі через війну з Легіоном Цезаря. Який вдалий поворот подій. І ми зовсім не проти забрати Реддінг — він зовсім поруч. Так, бити сильного ворога в спину — підлість. Але є два типи людей: боягузи і хоробрі трупи."

den_blackmail_NCR:0 "Погрозити Республіці"
den_blackmail_NCR_desc:0 "Війна з Легіоном стала справжнім випробуванням для НКР. У Пустці давно не було воєн такого масштабу. Можливо, вони й погодяться віддати нам Реддінг — за який ми боролись ще сорок років тому. Республіка хотіла слави, отримає лише ганьбу."

den_control_redding:0 "Третє Місто"
den_control_redding_desc:0 "Реддінг — один із найбільших міст Пустки, джерело золота Каліфорнії, останній осередок цивілізації на шляху до Орегону. А тепер — джерело багатства, яким ми керуємо."

den_sale_jet_redding:0 "Слабкість Душі Шахтаря"
den_sale_jet_redding_desc:0 "Реддінг завжди страждав від наркоманії. Важка праця, низька платня, небезпека — ось причини. Ми дамо їм те, що вони хочуть — джет. І вони самі стануть працювати більше заради чергової дози."

den_redding_riches:0 "Скарби Реддінга"
den_redding_riches_desc:0 "Місцеві копальні — одні з найважливіших у Каліфорнії. Без них долар НКР — просто папірець. Їм доведеться купувати золото в нас, навіть якщо вони нас ненавидять. Варто збільшити видобуток."

den_entertaiment_redding:0 "Їжа та Втіхи"
den_entertaiment_redding_desc:0 "Індустрія розваг у Реддінгу — одна з небагатьох, що зростає. Ми навіть можемо її розвинути. Людям треба відпочивати, а заодно витрачати капи в наших закладах."

den_local_redding:0 "Місцевий Намісник"
den_local_redding_desc:0 "Діру ми керували як колонією. Але Реддінг — інша справа. Треба поставити місцевого, хто розуміється на ситуації, щоб керувати від нашого імені."

den_van_graff_redding:0 "Повернення Додому"
den_van_graff_redding_desc:0 "Реддінг — не колонія, а справжнє місто. Як добре, що в нас є сім’я Ван Ґраффів. Ми не раз працювали разом. Вони будуть щасливі повернутись додому й керувати від нашого імені."

den_crown_redding:0 "Коштовна Перлина Імперії"
den_crown_redding_desc:0 "Реддінг став другим за значенням містом нашої кримінальної імперії. Тепер ми — не просто місто, а повноцінна, хоч і невелика, держава."

########## Den Rebecca branch
den_rebecca_story_1:0 "Обрана Діра"
den_rebecca_story_1_desc:0 "Обранець зіграв вирішальну роль у долі Діри. Колись це було дно Пустки, але після розгрому Гільдії Работоргівців і місцевих банд все змінилось."

den_rebecca_story_2:0 "Притулок Мордіно"
den_rebecca_story_2_desc:0 "Двадцять років тому Мордіно втекли з Ріно та оселились у нашому понівеченому місті. Відтоді вони сіють насіння злочинності тут."

den_rebecca_story_3:0 "Ліл’ Джізус Плаче"
den_rebecca_story_3_desc:0 "Славетний день для чесних людей Діри: Нью-Ріно переміг сили Мордіно. Ліл’ Джізус охоплений сумнівами. Майбутнє не певне, але воно світліше."

den_rebecca_economic_1:0 "Свободу Рабам"
den_rebecca_economic_1_desc:0 "Ребекка звільнила всіх рабів, покінчивши з жахами режиму Мордіно. Вони були найбільшими його жертвами."

den_rebecca_economic_2:0 "Прийом Мігрантів"
den_rebecca_economic_2_desc:0 "Після падіння Мордіно в місто хлинули бездомні. Колись маяк ненависті, Діра стала символом свободи."

den_rebecca_economic_3:0 "Побудова Індустрії"
den_rebecca_economic_3_desc:0 "Час вдихнути життя в заводські цехи. Настав час ввести Діру в індустріальну епоху."

den_rebecca_economic_4:0 "Тяжка, Але Чесна Праця"
den_rebecca_economic_4_desc:0 "Діра — не коштовність, але єдине світло на півночі Невади. Сила людей і мудрість Ребекки вивели нас до цього моменту."

den_rebecca_military_1:0 "Власна Зброя"
den_rebecca_military_1_desc:0 "Мордіно застосовували цю зброю для тиранії. Ми ж захистимо нею наші вулиці. Новоздобутий завод стане основою арсеналу."

den_rebecca_military_2:0 "Дружні Племена"
den_rebecca_military_2_desc:0 "Мандруюче плем’я, що поклоняється удачі, шукало засновника у Золотому Казино на небесах. Ідеї — дивні, але союз з ними вартий уваги."

den_rebecca_military_3:0 "Міліція Народу"
den_rebecca_military_3_desc:0 "Потрібно більше чоловіків і жінок під прапором Діри. Оголошуємо набір у народну міліцію."

den_rebecca_military_4:0 "Збройна Промисловість Невади"
den_rebecca_military_4_desc:0 "Завод Мордіно — замалий для армії. Шукаймо покинуті об’єкти довкола — відновимо, озброїмо, захистимо."

den_rebecca_politic_1:0 "Співдружність Північної Невади"
den_rebecca_politic_1_desc:0 "Ріно лишається загрозою. Міста Півночі бояться його влади. Об’єднаймо їх проти загрози."

den_rebecca_politic_slags_1:0 "Друзі Знизу"
den_rebecca_politic_slags_1_desc:0 "Слаґи — не монстри, а вигнанці. Вони — союзники, яких ми потребуємо в антиренській коаліції."

den_rebecca_politic_slags_2:0 "Альянс із Деніо"
den_rebecca_politic_slags_2_desc:0 "Слаґи погодились передати Антилопський Резерват в обмін на економічні інвестиції в Деніо."

den_rebecca_politic_modoc_1:0 "Друзі зі Сходу"
den_rebecca_politic_modoc_1_desc:0 "Маленьке містечко Модок, але з великим серцем. Союз з ними зміцнить нашу економіку."

den_rebecca_politic_modoc_2:0 "Альянс із Модоком"
den_rebecca_politic_modoc_2_desc:0 "Мер Модока згоден: ми отримуємо Честер, вони — серйозну економічну допомогу."

den_rebecca_politic_klamath_1:0 "Друзі з Півночі"
den_rebecca_politic_klamath_1_desc:0 "Кламат — славетне місто мисливців на ґеконів. Їхня стійкість — наша сила."

den_rebecca_politic_klamath_2:0 "Альянс із Кламатом"
den_rebecca_politic_klamath_2_desc:0 "Кламат отримує 13 караванів зі спорядженням. Ми — сильного союзника."

den_rebecca_end_1:0 "Раби Більше Не Коряться"
den_rebecca_end_1_desc:0 "Колись Діра була осердям рабства. Тепер вона — приклад свободи та представництва."

den_rebecca_end_2:0 "Нове Найбільше Маленьке Місто"
den_rebecca_end_2_desc:0 "Кажуть, Ріно — найбільше мале місто. Але тепер це титул Діри. Ми поважаємо ренців, але заберемо північні території."

den_rebecca_end_3:0 "Каліфорнійська Мрія Ребекки"
den_rebecca_end_3_desc:0 "Світ готується до нової війни. Ребекка обирає бік: ми приєднуємось до НКР, щоб гарантувати майбутнє Діри."