old_guns_tt:0 "§gМи використовуємо припаси, що перевезли на Станцію Чемулт, аби відновити артилерію. Залишки перенаправимо в столицю§!\nЗа кожен наш регіон із ядром §Y[CHE.GetNameWithFlag]§! і як мінімум §Y5§! інфраструктури:\n  Побудувати §Y1 ППО§! у [Root.Capital.GetName] і [580.GetName]\n"

bone_picks_tt:0 "§gМутовані колишні [DIS.GetAdjective] допомагають виготовляти нові кісткодряпи§!\nЗа кожен наш регіон із ядром §Y[DIS.GetNameWithFlag]§! і принаймні §Y5§! інфраструктури:\n  Отримати §Y250§! одиниць піхотного оснащення\n"

unwilling_gatherers_tt:0 "§gЗбирачів змушують працювати-працювати на розвинених землях біля столиці§!\nЗа кожен рівень інфраструктури в нашій столиці:\n  Додати виробництво §Y2£resources_strip|3  1£resources_strip|1\n§!"

oregon_line_tt:0 "§gМи використовуємо розвинуті залізниці для покращення работоргівлі§!\nЗа кожен рівень інфраструктури в підконтрольних регіонах Орегону:\n  Отримати §G0.75§!k кепсів\n"

nightkin_migration_tt:0 "§gНайткіни переселяються на землі, очищені від гладкошкірих§!\nЗа кожен наш регіон із ядром в Орегоні:\n  Отримати §G30§! людських ресурсів\n"

