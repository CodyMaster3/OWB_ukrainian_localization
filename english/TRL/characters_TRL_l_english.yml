l_english:
TRL_scurge:0 "Скардж"
TRL_scurge_desc:0 "Скардж був мисливцем з племені, поки його не злапали й не втопили в FEV-лагуні у Воррені. Боунснарл частенько шле його ловить жирні шматки для себе й своєї малесенької зграї. Та Скардж не про жерти дбає — він вірний Першому до смерті, а не отим, шо нижче бігають."

TRL_marro:0 "Марро"
TRL_marro_desc:0 "Марро був солдатом якраз після падіння бомб, повернувся до Воррена на поживу, аж поки Перший його не злапав і не втопив. Знав, який світ гнилий став — от і залишився з Першим. Тепер він йому, як брат, і часом підміняє, коли розум Першого втікає кудись."

TRL_doctor:0 "Док Торр"
TRL_doctor_desc:0 "Док Торр — бугай і трохи скажений мутант. Якби не його вміння лікувать наших, то Перший чи хтось з його підручних давно б його порішив. Але поки він корисний — його вміння стане в пригоді, коли наші вояки з боїв повертаються покусані й порвані."

TRL_ice_jaw:0 "Крижана Щелепа"
TRL_ice_jaw_desc:0 "Крижана Щелепа — Супермутант, був колись розвідником Братства, аж поки те саме Братство не зловило його, коли він захотів вернутись після мутації. Його катували, і тепер він жадає помсти. Він обіцяв нас навчити, як виживати у лютому холоді — та ще й у боях проти своїх колишніх братчиків!"

TRL_peon_tusk_hell:0 "Пахолок Клишньопекло"
TRL_peon_tusk_hell_desc:0 "Клишньопекло відповідає за польові мутації в армії Воррена. Прямо на передовій він перетворює солдатів через примусову мутацію, а тоді шле їх назад, понівечених, як шокову піхоту. Якщо виживуть — стануть нашими новими Супермутантами!"
peon_tusk_hell_trait:0 "Примусова Мутація"

TRL_monster_in_the_woods:0 "Потвора в Лісі"
TRL_monster_in_the_woods_desc:0 "Потвора тепер тут назавжди. І друзів своїх вона привела на гулянку."
monster_in_the_woods_trait:0 "Лісові Потвори"

TRL_shepard:0 "Шепард"
TRL_shepard_desc:0 "Шепард — новачок у родині Воррена, та вже показав, шо вартий. Він зробив рабів слухнянішими, а як хтось робить погано — відпускає Боунснарла порозважатись на їхніх халупах."

TRL_mother:0 "Матір"
TRL_mother_desc:0 "Матір — одна з перших, кого Перший втопив у Воррені. Вона виросла майже така ж здорова, як і він. Та розум в неї на місці. Вона піклується про Воррен, дбає про всіх. Боунснарл і Бетті часто до неї йдуть поговорити, поради спитати."

TRL_captain_crabeater:0 "Капітан Крабоїд"
TRL_captain_crabeater_desc:0 "Колишній рейдер з берегів зруйнованого Сіетла, Крабоїд став легендою після того, як самотужки розібрався з королевою Болотників! Його досвід рейдів коло Порт Моу буде неоціненним, коли настане час атакувати ті землі."
captain_crabeater_trait:0 "Морська Дієта"

