l_english:
    OLY_HERMES_NAME:0 "Гермес"
    OLY_HERMES_DESC:0 "Народжений у племені Олімп не більше 20 років тому, лідерство групи було покладено на Гермеса, коли Братство Вашингтона почало свою жорстоку кампанію проти його народу. Отримавши своє ім'я завдяки унікальній здатності блискавично долати засніжені гірські схили, Гермес зарекомендував себе здібним командиром і люблячим лідером. Однак, щоб вижити під натиском Безсмертного, йому доведеться використати всі хитрощі з книги свого племені"
    OLY_AMPHITRITE_NAME:0 "Амфітріта"