tbh_simulator_training_decision:0 "Навчання в симуляторі"
tbh_simulator_training_decision_desc:0 "Тренування в симуляторі дозволяє нам у реальному часі експериментувати з доктринами та безліччю інших елементів. Миттєво змінюючи умови бою. Наші солдати стануть найкращими в світі."
tbh_simulator_training_decision_ground:0 "Тактика підрозділів у симуляторі"
tbh_simulator_training_decision_ground_desc:0 "Тренування в симуляторі дозволяє нам у реальному часі експериментувати з доктринами та безліччю інших елементів. Миттєво змінюючи умови бою. Наші солдати стануть найкращими в світі."
tbh_simulator_training_decision_naval:0 "Морський бій у симуляторі"
tbh_simulator_training_decision_naval_desc:0 "Тренування в симуляторі дозволяє нам у реальному часі експериментувати з доктринами та безліччю інших елементів. Миттєво змінюючи умови бою. Наші солдати стануть найкращими в світі."
tbh_simulator_training_decision_air:0 "Повітряний бій у симуляторі"
tbh_simulator_training_decision_air_desc:0 "Тренування в симуляторі дозволяє нам у реальному часі експериментувати з доктринами та безліччю інших елементів. Миттєво змінюючи умови бою. Наші солдати стануть найкращими в світі."
tbh_send_lns_aid:0 "Допомогти Лоун Стару"
tbh_send_lns_aid_desc:0 "Хоча ми зайняті внутрішніми проблемами, а Лоун Стар хоче розв'язати це самостійно, ми все ж можемо почати вербування добровольців для допомоги. Добровольців у Техасі завжди вистачає."
LNS_fallen:0 "Лоун Стар упав під натиском рейдерів надто швидко — наша допомога не встигла на час. Як сказали б предки, це погано."
tbh_send_uoa_aid:0 "Допомогти Єдності Остіна"
tbh_send_uoa_aid_desc:0 "Ми не можемо прямо допомагати мутантам — не всі ще досягли такого рівня сприйняття рівності. Але ті, хто досяг, готові взятися за зброю. Ще трохи — і всі стануть рівними. Рівними в Техасі."

