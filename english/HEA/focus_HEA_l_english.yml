l_english:
  hea_nf_precursers:0 "Спадщина Святого Писання"
  hea_nf_precursers_desc:0 "Слово Боже завжди було вищим законом цієї землі — навіть у ті часи, коли Небесними Воротами керували більш помірковані лідери. Ці божественні писання надихали наш народ покоління за поколінням."

  hea_nf_pilgrims:0 "Паломники Прибули"
  hea_nf_pilgrims_desc:0 "Паломники приходили на наші землі десятиліттями — як свідомо, так і випадково. Для них було зведено церкви й святині, та лише одна завжди мала найбільше значення."

  hea_nf_tribals:0 "Звернення Язичників"
  hea_nf_tribals_desc:0 "Племена знову й знову приходили до нашого стада — іноді окремі душі, іноді цілі роди. Їхня поява завжди неочікувана і часто виснажує наші ресурси."

  hea_nf_innocence_lost:0 "Втрачена Невинність"
  hea_nf_innocence_lost_desc:0 "Трагедію Втраченої Невинності неможливо применшити. Лють язичника впала на мирного прочанина, і подейкують, що земля досі зберігає кров, пролиту там. Це — застереження для всіх вірних."

  hea_nf_pol_action:0 "Велика Дискусія"
  hea_nf_pol_action_desc:0 "Спадщина Великої Дискусії сягає часів після Великої Війни, коли люди боялися, що насильство спалахне між послідовниками різних вірувань. Із того часу, щонеділі, всі, хто вірить у Бога, закликаються до богословських змагань, де істина змагається зі словом."

  hea_nf_embrace_elite:0 "Перемога Духовенства"
  hea_nf_embrace_elite_desc:0 "Духовенство ледь не втратило довіру людей перед харизмою та відвагою молодого Пророка. Та врешті-решт розсудливість перемогла. Адже навіть Пророк не зможе перемогти цілу армію мудрих умів щонеділі. Згодом і він сам визнав їхню мудрість."

  hea_nf_embrace_elite_1:0 "Рада Христа"
  hea_nf_embrace_elite_1_desc:0 "Тепер, під назвою Ради Христа, старійшини міста разом із Пророком рухаються вперед згідно зі своїми планами. Вони прагнуть об'єднати всіх людей під Богом і зосереджують свої зусилля на наверненні загублених душ."

  hea_nf_reject_elite:0 "Пророк Торжествує"
  hea_nf_reject_elite_desc:0 "Слова Пророка написані буквально на стінах підземки, під містом. У домівках, трапезних і святилищах його слова повторюють з благоговінням. Велика Дискусія більше не є обговоренням — вона стала закликом до повстання проти Старої Еліти, з вірою, словом і волею."

  hea_nf_reject_elite_1:0 "Архангел Постає"
  hea_nf_reject_elite_1_desc:0 "Усі, хто виступав проти волі Пророка, були приборкані, а ті, що залишилися, стоять перед ним навколішки. Божественність ходить серед нас, і з нею — слово Боже. Ніхто вже не може вважати Теократичну Еліту істинною владою, бо цей чоловік — з Богом на боці."

  hea_nf_consolidate_pol:0 "Релігійна Еволюція"
  hea_nf_consolidate_pol_desc:0 "Час змін настав, і народ стікається до Небесних Воріт! Вони стають на коліна в церквах і шепочуть молитви Господу, просячи прощення та милості. Світ змінюється — і нарешті віра змінюється разом із ним."

  hea_nf_grand_cathedral:0 "Величний Собор"
  hea_nf_grand_cathedral_desc:0 "У самому серці Небесних Воріт стоїть величезний, напівзруйнований собор — спадщина старого світу, що встояла, коли решта перетворилась на прах. Його відновлення тривало десятиліттями, і працювали над ним тисячі. Спів хору скликає на месу всіх у місті, а дим з труб — усіх, хто в сотнях миль навколо."

  hea_nf_innocence_lost_deal:0 "Спогади про Невинність"
  hea_nf_innocence_lost_deal_desc:0 "Невинність, як підказує назва, була мирним містечком добрих душ, що намагалися вижити у пустці. За свою віру і доброту вони були вирізані натовпом зляканих язичників. Лише небагато з тих, хто вижив, не втратили там когось із близьких. Із часом... у що ж перетвориться цей страх?"

  hea_nf_forgive_sins:0 "Навчитись Прощати"
  hea_nf_forgive_sins_desc:0 "Ненависть — не шлях Бога, і не природне для серця людського. Світ і так уже стікав кров’ю, потерпав від болю через тих, хто не міг відпустити. Нам дана друга можливість — у тому, що лишилося від найвеличнішого творіння Господа. Не заплямимо її тією самою злобою, що знищила перше."

  hea_nf_fog_of_mercy:0 "Милість до Грішників"
  hea_nf_fog_of_mercy_desc:0 "Язичники, що колись вбивали в Невинності, десятиліттями тікали від нас, боячись кари Божої. Але коли ми їх знайшли — ми дарували милість усім, хто був готовий її прийняти. І це милосердя поширилось по всій землі, як вогонь. У серцях усіх, хто бачить нас, ми залишимось символом доброти."

  hea_nf_vengance:0 "Око за Око"
  hea_nf_vengance_desc:0 "Чи ми забули про Моровиці? Про Стіни Єрихону? Про утоплене військо фараона? Милість — лише для тих, хто її заслуговує. Ми не можемо пробачити скоєне. Хай кожен, хто пам’ятає Невинність, і кожен, хто чує про неї, знає: грішники відчують помсту вірних."

  hea_nf_boilers_of_justice:0 "Зварені за Справедливістю"
  hea_nf_boilers_of_justice_desc:0 "Язичники, що вирізали Невинність, тікали куди тільки могли — в усі сторони. Раз на кілька місяців когось із них знаходять, тягнуть назад до Небесних Воріт — і дарують прощення, але після покаяння. Їх хрестять окропом, щоби вони змогли постати перед Господом і благати про прощення в тих, кого вони знищили."

  hea_nf_addres_militarism:0 "Культура Війни?"
  hea_nf_addres_militarism_desc:0 "Колись Небесні Ворота були мирною громадою в горах. Воїнів було мало, бо загроз було мало. Але часи змінюються. Заводи курять, зброярні працюють, юнаки марширують в ногу. Втрата Невинності змінила наш світогляд — і наша відповідь назавжди сформує нашу націю."

  hea_nf_embrace_militarism:0 "Прийняти Насильство"
  hea_nf_embrace_militarism_desc:0 "Яке благо принесло милосердя вірним? Якщо ми не можемо захистити свій народ — то навіщо нам віра? Ми мусимо навчитись оборонятися, щоб не було нової трагедії. Руки вірних сильні завдяки людині — і Богу."

  hea_nf_embrace_militarism_1:0 "Десятий Хрестовий Похід"
  hea_nf_embrace_militarism_1_desc:0 "Хрестові походи — це легенди. Кажуть, що армія вірних піднялась, аби знищити фальшивих пророків і захистити землю від язичницьких натовпів. Чоловіки й жінки, дідусі й онуки — усі відповідають на заклик. Усі готуються до війни проти ворогів Божих."

  hea_nf_fight_militarism:0 "Схід Милості"
  hea_nf_fight_militarism_desc:0 "Що ми за народ, якщо самі станемо своїми ворогами? Якщо впадемо в безумство й кровопролиття? Війна — не наш шлях. Ми — оплот добра, зміни. Небесні Ворота стануть серцем Божого Царства на Землі — і жодне Царство Боже не вирушить на бійню проти тих, хто ще не пізнав істини."

  hea_nf_fight_militarism_1:0 "Притулок для Всіх"
  hea_nf_fight_militarism_1_desc:0 "Усі загублені можуть прийти до Воріт. Ті, що тікають від переслідувань, ті, що тікають від рабства, ті, що тікають від загарбників. Усі, хто готовий увірувати — знайдуть Притулок у наших стінах. І з часом? Наш дім стане їхнім домом, наша їжа — їхньою їжею, а наша віра — їхньою вірою."

  hea_nf_army:0 "Еволюція Вартових"
  hea_nf_army_desc:0 "Протягом більш як ста років Небесні Ворота охороняє Варта — неофіційне з’єднання міліції та найманців, що мають єдину мету — захищати Ворота. Проте перетворення цього хаотичного утворення на справжнє військо — завдання не з легких."

  hea_nf_army_1:0 "Озброєння Духовенства"
  hea_nf_army_1_desc:0 "Найсильніші наші воїни — це проповідники, що мандрують пусткою з маленькою книжкою в одній руці й великим револьвером в іншій. Вони несуть милість тим, хто її потребує, і кару — тим, хто її заслуговує. Дозволити їм навчати й озброювати інших — перший крок до формування справжнього війська."

  hea_nf_conscription:0 "Обов'язкова Служба"
  hea_nf_conscription_desc:0 "Серед простих людей небагато охочих йти на війну. Але обов'язок кожного християнина — захищати свій дім, родину та тих, хто не здатен захистити себе. Обов’язкова служба — це не лише спосіб наповнити ряди, але й прояв Божої волі."

  hea_nf_crusaders:0 "Армії Хрестоносців"
  hea_nf_crusaders_desc:0 "Серед нас є фанатично вірні, які відчувають, що їхній обов'язок — нести війну на землю невірних і поширювати слово Боже. Вони маршірують із молитвами на вустах, щодня готуючись до битви, яка колись принесе спасіння. А до того часу — вони битимуться і молитимуться за Небесні Ворота."

  hea_nf_army_2:0 "Військові Ордени"
  hea_nf_army_2_desc:0 "Серед вірних є ті, хто вірить у необхідність війни. І саме вони повинні опанувати мистецтво війни. Військові Ордени — це церковна гілка, яка досліджує біблійні битви, історичні кампанії й сучасні війни, щоб краще їх розуміти — і вигравати."

  hea_nf_air:0 "Перегони до Небес"
  hea_nf_air_desc:0 "«Перегони до Небес» — культурне явище, започатковане тридцять років тому старим проповідником Дарреном Шоу, який на смертному одрі кинув виклик молоді Воріт — досягти небес. Хоча це був філософський заклик, багато інженерів сприйняли його буквально — як заклик відновити літальні апарати давнини."

  hea_nf_air_knight:0 "Благословення Ангелів"
  hea_nf_air_knight_desc:0 "Кажуть, що ті, хто літає, роблять це тільки з дозволу ангелів — і Бога. Якщо це правда, то всі, хто здіймається в небо, мають благословення ангелів — і благословення самого Господа. Хай кожен, хто наважиться злетіти, несе в серці ту віру, яка дарує силу."

  hea_nf_air_peasant:0 "Крила Ангелів"
  hea_nf_air_peasant_desc:0 "Кажуть, що політ — це піднесення, але не кожен, хто летить, робить це у літаку. Справжній політ — це стан душі, свобода розуму, духу й тіла. Ті, хто по-справжньому літає, знають: їх несе не метал, не пальне, не реактор. Їх несуть крила ангелів — і ті, хто це знає, не бояться."

  hea_add_75_fighters_tt:0 "Додано §H75§! металобрухтових винищувачів до наших запасів."

  hea_nf_air_1:0 "Вознесіння Досягнуто"
  hea_nf_air_1_desc:0 "Ті, хто літає від нашого імені, не бояться ні злету, ні падіння. Бо їхня душа вже вознеслася. Їхні тіла — лиш вмістилища волі Господньої. Вони — ті, хто побачив очима руїни світу, створеного Богом, і красу, яку ми зруйнували. Смерть — це милість. А смерть в Його ім'я — це честь."

  hea_nf_missionary_warriors:0 "Озброєні Паломники"
  hea_nf_missionary_warriors_desc:0 "Ті, хто дістався Небесних Воріт, подолали незліченні милі — суходолом і водами, попри смерть і сумніви. Вони бачили Божу землю на власні очі. Вони знають усі шляхи — і це знання стане нашою перевагою у часи лиха й вимушеного насильства."

  hea_nf_officer_priests:0 "Генерали-Клирики"
  hea_nf_officer_priests_desc:0 "Немає нічого, що спонукає солдата до дії краще, ніж гімн і святе слово. Генерали-клирики не просто ведуть наші війська — вони спрямовують їх крізь руїни світу, підтримуючи дух і тіло в єдності."

  hea_nf_community_service:0 "Кріпацтво У Столітті Пара"
  hea_nf_community_service_desc:0 "Обов’язок перед Небесними Воротами — понад усе. Це останній бастіон благочестя, живлений не лише паром з ядерного синтезу, а й волею, серцями й розумом вірних. Кожен повинен внести свій вклад у справу Бога — працюючи над майбутнім, достойним називатися Домом."

  hea_nf_path_of_steam:0 "Розширення Парових Трубопроводів"
  hea_nf_path_of_steam_desc:0 "Трубопроводи, що тягнуться з Небесних Воріт, — це не просто шляхи для тепла й палива. Це дороги, якими йдуть паломники і підіймаються місіонери. Це обітниця тепла та води для хворих і нужденних. Розширити ці лінії — значить поширити віру."

  hea_nf_school_of_steam:0 "Освіта Духовенства"
  hea_nf_school_of_steam_desc:0 "Молодь пустки рідко отримує знання — лише виживання: як збудувати укриття, як прочистити рушницю. Але в нас існує духовна освіта — для кожного, хто бажає вчитись, промовить кілька молитов і пообіцяє навчати інших."

  hea_nf_school_of_steam_industry:0 "Парова Промисловість"
  hea_nf_school_of_steam_industry_desc:0 "Пар, що йде з реакторів у серці Небесних Воріт, — дар пращурів, збережений волею Господа. Саме він дозволяє нам процвітати там, де інші гинуть. Наш обов’язок — принести цей дар кожному. Бо це тепло — життя, а сила — надія."

  hea_nf_school_of_steam_motorisation:0 "Інновації Двигунів"
  hea_nf_school_of_steam_motorisation_desc:0 "Кажуть, війну згубила нафта — і вся інша скінченна енергія. Технології, які ми маємо зараз, могли б колись врятувати світ. І хоча час втрачено, ми можемо покращити машини, що колись несли загибель."

  hea_nf_school_of_steam_aviation:0 "Відновлення Аеропортів"
  hea_nf_school_of_steam_aviation_desc:0 "По всій землі розкидані руїни злітно-посадкових смуг — із ямами, уламками та зламаним асфальтом. Але саме ті уламки — ключ до відродження нашої небесної флотилії..."

  hea_nf_machines_of_steam:0 "Парові Дредноути"
  hea_nf_machines_of_steam_desc:0 "Пустка сповнена тих, хто прагне відродити зброю старого світу — броньованих гігантів, що трощили армії. Завдяки нашій паро-синтезній технології ми здатні вирішити головну проблему цих машин: живлення їх без шкоди для ефективності."

  hea_nf_men_of_steam:0 "Парова Броня"
  hea_nf_men_of_steam_desc:0 "Силова броня — це громіздка і неефективна річ, яка вимагає рідкісних енергоживлень. Та ми знайшли спосіб — живити їх за допомогою нашої унікальної технології. І тепер там, де інші зупиняються — ми йдемо далі."

  hea_nf_age_of_steam:0 "Нова Епоха"
  hea_nf_age_of_steam_desc:0 "Наші паро-синтезні реактори провели нас далеко — туди, куди не могли сягнути ані слабкі народи, ані науковці-одинаки. Благословення Пара зробило нас тими, ким ми є. І з цим даром? Ми увійдемо в нову епоху."

  hea_nf_industry:0 "Розбудова Воріт"
  hea_nf_industry_desc:0 "Ворота — серце нашої влади, джерело нашого впливу та віри. Їхня розбудова — першочерговий обов’язок народу. Лише коли Ворота постануть у всій своїй величі, навколишні землі знову процвітатимуть, як до війни. І тільки тоді ми зможемо відродити втрачене."

  hea_nf_industry_1:0 "Благодать Пророка"
  hea_nf_industry_1_desc:0 "З волі Всемогутнього Бога наказ пролунав від самої церкви: Пророча Низина має бути відновлена як центр торгівлі та промисловості. Із ріки процвітання, що постане тут, наш народ продовжить свою місію відбудови світу."

  hea_nf_industry_2:0 "Благодать Ядра"
  hea_nf_industry_2_desc:0 "З волі Всемогутнього Бога наказ пролунав від самої церкви: Стим має бути відновлений як центр торгівлі та промисловості. Із ріки процвітання, що постане тут, наш народ продовжить свою місію відбудови світу."

  hea_nf_industry_3:0 "Благодать Втраченої Невинності"
  hea_nf_industry_3_desc:0 "З волі Всемогутнього Бога наказ пролунав від самої церкви: Святилище Юди має бути відновлене як центр торгівлі та промисловості. Із ріки процвітання, що постане тут, наш народ продовжить свою місію відбудови світу."

  hea_nf_industry_4:0 "Благодать Вітряної Самоти"
  hea_nf_industry_4_desc:0 "З волі Всемогутнього Бога наказ пролунав від самої церкви: Пік Петра має бути відновлений як центр торгівлі та промисловості. Із ріки процвітання, що постане тут, наш народ продовжить свою місію відбудови світу."

  hea_nf_industry_mil_1:0 "Благословення Пророка"
  hea_nf_industry_mil_1_desc:0 "З волі Всемогутнього Бога наказ передано самим Пророком: Пророча Низина стане осередком війни та виробництва зброї. Із могутньої зброї, що звідси постане, ми здобудемо силу, потрібну для перетворення світу."

  hea_nf_industry_mil_2:0 "Благословення Ядра"
  hea_nf_industry_mil_2_desc:0 "З волі Всемогутнього Бога наказ передано самим Пророком: Стим стане осередком війни та виробництва зброї. Із могутньої зброї, що звідси постане, ми здобудемо силу, потрібну для перетворення світу."

  hea_nf_industry_mil_3:0 "Благословення Втраченої Невинності"
  hea_nf_industry_mil_3_desc:0 "З волі Всемогутнього Бога наказ передано самим Пророком: Святилище Юди стане осередком війни та виробництва зброї. Із могутньої зброї, що звідси постане, ми здобудемо силу, потрібну для перетворення світу."

  hea_nf_industry_mil_4:0 "Благословення Вітряної Самоти"
  hea_nf_industry_mil_4_desc:0 "З волі Всемогутнього Бога наказ передано самим Пророком: Пік Петра стане осередком війни та виробництва зброї. Із могутньої зброї, що звідси постане, ми здобудемо силу, потрібну для перетворення світу."

  hea_nf_industry_5:0 "Відродження Воріт"
  hea_nf_industry_5_desc:0 "Небесні Ворота відродились — і звідусіль, із пустки, до нас приходять шукачі сили та багатства. Зброярі долають великі відстані, каравани линуть до нашої столиці. І вперше за багато років місто більше, ніж руїни, на яких його збудовано. Вперше після Великої війни — воно справді зростає."

  hea_nf_foreign_ministry:0 "Посольство Христа"
  hea_nf_foreign_ministry_desc:0 "Наша благословенна держава лежить у самому серці Айдахо — довкола могутнього Стиму й Небесних Воріт, місця, звідки можна осягнути поглядом чотири штати. Не випадково на південь від нас мешкають дві християнські нації. Вони зійшли зі шляху істини, та Божий наказ Пророкові ясний: запросити їх у наш дім — і показати істину."

  hea_nf_embassy_murtaugh:0 "Говорити з Протестантами"
  hea_nf_embassy_murtaugh_desc:0 "Чоловіки й жінки з Мерто тлумачать Святе Письмо — хоча й хибно. Їхня ворожнеча з сусідами — безглузда, та їхню ревність і відданість Божій справі заперечити неможливо."

  hea_nf_defensive_league:0 "Братерство з Мерто"
  hea_nf_defensive_league_desc:0 "Мерто послали нам своїх паломників, ми відповіли тим самим. І коли слово Боже лунає між нами відкрито — між народами росте братерство. І з цим братерством приходить розуміння: ми знаємо, чому єретичні Айри — образа для Бога!"

  hea_nf_strike_ires:0 "Удар по Католиках"
  hea_nf_strike_ires_desc:0 "Айрів слід приборкати, як єретиків. І хоча ми милостиві — пропонуємо звернення всім, хто готовий — народ наш розуміє: ця війна обернеться кровопролиттям. Бо єретики вперті, як завжди."

  hea_nf_embassy_ires:0 "Говорити з Католиками"
  hea_nf_embassy_ires_desc:0 "Чоловіки й жінки з Айрів тлумачать Святе Письмо — хоча й хибно. Їхня ворожнеча з сусідами — безглузда, та їхню ревність і відданість Божій справі заперечити неможливо."

  hea_nf_defensive_pact:0 "Братерство з Айрами"
  hea_nf_defensive_pact_desc:0 "«Айри послали нам своїх паломників, ми відповіли тим самим. І коли слово Боже лунає між нами відкрито — між народами росте братерство. І з цим братерством приходить розуміння: ми знаємо, чому єретичне Мерто — образа для Бога!»"

  hea_nf_strike_murtaugh:0 "Удар по Протестантах"
  hea_nf_strike_murtaugh_desc:0 "Мерто слід приборкати, як єретиків. І хоча ми милостиві — пропонуємо звернення всім, хто готовий — народ наш розуміє: ця війна обернеться кровопролиттям. Бо єретики вперті, як завжди."

  hea_nf_attack_hgh:0 "Язичники з Високої Каплиці"
  hea_nf_attack_hgh_desc:0 "Язичники з Високої Каплиці занадто довго кидали виклик Божій славі. Їхня зневага до наших технологій і способу життя залишає нам мало вибору. Час милості минув давно."

  hea_nf_attack_mur:0 "Удар по Реформаторах"
  hea_nf_attack_mur_desc:0 "Реформатори будь-якого суспільства — загроза для віри. А ці ще й колись були союзниками наших ворогів із Каплиці. Пора показати їм, що чекає тих, хто ставить під сумнів Божу славу."

  hea_nf_attack_ano:0 "Хрестовий Похід проти Помазаників"
  hea_nf_attack_ano_desc:0 "Господні Помазаники вважають себе праведниками, але своїм прагненням до завоювань вони загрожують нашій великій річці. Якщо їх не зупинити — вони стануть перешкодою на нашому святому шляху. Ми повинні зупинити їх, поки не пізно."

