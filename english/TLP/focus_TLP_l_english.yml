l_english:
  tlp_born_to_feel:0 "Народжені Відчувати"
  tlp_born_to_feel_desc:0 "Це життя, яке нам дісталося — а не те, яке ми обрали."

  tlp_fortunate_son:0 "Щасливий син"
  tlp_fortunate_son_desc:0 "Маємо зробити все, що можемо. Нам пощастило — хоча б у цьому."

  tlp_paint_it_black:0 "Пофарбуй це у чорне"
  tlp_paint_it_black_desc:0 "Перефарбуємо цей світ у наші кольори! Хай стане нашим!"

  tlp_prelude_to_chc_1:0 "Грабунок схованок обладнання"
  tlp_prelude_to_chc_1_desc:0 "У нас були схованки на чорний день — і ось він настав. Це спорядження нам знадобиться у боротьбі з Одержимими."

  tlp_prelude_to_chc_2:0 "Набори рекрутингу"
  tlp_prelude_to_chc_2_desc:0 "Нгуєн запропонував допомогу з пошуком людей серед людських спільнот біля Талси. Можливо, хтось захоче долучитися до боротьби проти Скутого Хору."

  tlp_it_aint_me:0 "Це не я"
  tlp_it_aint_me_desc:0 "Солдати Останнього Патруля завжди вміли перекладати вину на інших. «Це не я» — ось їхнє гасло."

  tlp_resource_salvage:0 "Переплавка Гільз"
  tlp_resource_salvage_desc:0 "Не всі гільзи можна переробити. Деякі надто пошкоджені. Спалимо партію й отримаємо металобрухт."

  tlp_fireteam_1:0 "Вогнемети “Man’s Company”"
  tlp_fireteam_1_desc:0 "Компанія “Man’s Company” із Мельбурна продавала спорядження Нацгвардії Оклахоми до Великої війни.\nЇхні вогнемети хоч і небезпечні, але легкі в обслуговуванні."

  tlp_navy_salvage:0 "Річкові пости"
  tlp_navy_salvage_desc:0 "Патруль славиться тим, що ставить застави вздовж річок, стежачи за рейдерами, торговцями чи племенами, що пробираються на нашу землю."

  tlp_equipment_salvage:0 "Запаси боєприпасів"
  tlp_equipment_salvage_desc:0 "Накопичення боєприпасів — ключ до виживання. Миру не існує. Є лише війна."

  tlp_fireteam_2:0 "Пальне “Man’s Company”"
  tlp_fireteam_2_desc:0 "Компанія “Man’s Company” із Мельбурна постачала спорядження до Великої війни.\nЇхній пропан — смертельно небезпечний. Саме те, що потрібно для наших вогнеметів."

  tlp_stop_the_music:0 "Заглушити Хор"
  tlp_stop_the_music_desc:0 "Досить цього цирку. Пора обірвати їхню пісню назавжди. Пустка й без того пекло — нам не треба ще й психотропного шабашу на кордоні."

  tlp_integrate_chc:0 "Зламати ланцюги Хору"
  tlp_integrate_chc_desc:0 "Їхні невільні розуми тепер під контролем. Принаймні, здебільшого. Нехай працюють, мовчать і ніхто не спускає з них повідка. Якщо вже доведеться мати справу з цими — хай буде з них користь."

  tlp_memphis:0 "Справедлива угода"
  tlp_memphis_desc:0 "Ці Хористи — суцільне лихо. Якщо хтось хоче їх забрати — нехай забирає. Не те щоб ми були работоргівцями — лишки Хору й людьми не назвеш. Продаж є продаж, а нам менше клопоту."

  tlp_chorus_in_twine:0 "Хор у ланцюгах"
  tlp_chorus_in_twine_desc:0 "Жодного з них не випускати з поля зору. Їхні “дарування” можуть стати в пригоді, але не дайте їм розслабитись. Повна ізоляція — жодних винятків."

  tlp_star_spangled_eyes:0 "Зоряно-смугасті очі"
  tlp_star_spangled_eyes_desc:0 "Перемога над Потойбічним Хором — найбільший успіх Гаррісона від часів рейдів у Чикаго. Ідея почала визрівати в його голові — щось більше, ніж просто розрізнений патруль..."

  tlp_civs_1:0 "“Heartland Flyer”"
  tlp_civs_1_desc:0 "“Heartland Flyer” — довоєнний потяг, що курсував неподалік. Якщо відновимо колію, зможемо налагодити постачання між Цитаделлю й нашою базою."

  tlp_civs_2:0 "Паливо для локомотива"
  tlp_civs_2_desc:0 "Біля аеропорту Талси знайшли трохи авіаційного пального. Може, воно згодиться для потяга?"

  tlp_civs_3:0 "Доставка вантажу"
  tlp_civs_3_desc:0 "Можливість транспортувати вантажі між базою та Цитаделлю відкрила очі багатьом — і патрульним, і поселенцям. Можливо, об’єднана Оклахома — не така вже й мрія."

  tlp_mils_1:0 "Боєприпасні майстерні"
  tlp_mils_1_desc:0 "Чому б не залучити колишніх Одержимих до роботи в майстернях?"

  tlp_mils_2:0 "Рейд на базу Атлас"
  tlp_mils_2_desc:0 "Поблизу бази Атлас могли лишитися припаси. Кожні кілька років ми шлемо туди рейд — саме час повторити експедицію!"

  tlp_mils_3:0 "Важкий брухт"
  tlp_mils_3_desc:0 "Не весь брухт однаково легко розібрати. Деякий вимагає часу, зусиль і наполегливості."

  tlp_industry:0 "Душа Обов’язку"
  tlp_industry_desc:0 "Обов’язок — це принцип. Його треба нести душею, якщо хочеш бути йому вірним."

  tlp_resource_1:0 "Каравани постачання"
  tlp_resource_1_desc:0 "Нові шляхи між Цитаделлю й Заходом! Торгівля — завжди добрий знак."

  tlp_resource_2:0 "Добування провідників"
  tlp_resource_2_desc:0 "Навіть зі зношеного обладнання можна витягти дріт — стане в нагоді при ремонтах."

  tlp_resource_3:0 "Уніфікований збір ресурсів"
  tlp_resource_3_desc:0 "Об'єднавши наші методи, ми зможемо значно збільшити видобуток."

  tlp_resource_4:0 "Уніфікований збір ресурсів"
  tlp_resource_4_desc:0 "Об'єднавши наші методи, ми зможемо значно збільшити видобуток."

  tlp_manpower_1:0 "Кришковий ковпак"
  tlp_manpower_1_desc:0 "“Кришковий ковпак” — капелюх, який ми пускаємо по колу біля вогнища. Кожен кидає туди використані кришки. Коли з’являється торговець — маємо за що купити щось гарне."

  tlp_manpower_2:0 "Поцілунок солдата"
  tlp_manpower_2_desc:0 "Паличка "Смучу" із якоїсь “Резервації” — головна розвага наших бійців. Капля слизу, що дарує спокій навіть найбільш змученим."

  tlp_manpower_3:0 "Пісні передової"
  tlp_manpower_3_desc:0 "Зберемося біля вогнища й заспіваємо. Це завжди додає духу."

  tlp_men_and_metal:0 "Дух обов’язку"
  tlp_men_and_metal_desc:0 "Обов’язок — це принцип. Але його сутність — ідеал, до якого варто прагнути."

  tlp_likeminded_individuals:0 "Однодумці"
  tlp_likeminded_individuals_desc:0 "Кілька років тому ми провели рейд на північ — біля Чикаго. Здається, один із колишніх ворогів захотів до нас приєднатись? Називає себе “Мо”. Каже, хоче служити Патрулю."

  tlp_calling_in_a_favour:0 "Скористатися Послугою"
  tlp_calling_in_a_favour_desc:0 "Мо каже, що зможе затягнути до нас кількох знайомих однодумців з півночі. Хай приходять — Патрулю завжди потрібні свіжі бійці."
  
  tlp_loyalists_among_the_smoothskins:0 "Операція: Північні Легенди"
  tlp_loyalists_among_the_smoothskins_desc:0 "Гаррісон не зовсім розуміє, чому Ендрю постійно городить про якісь “операції”, але не може заперечити — стиль у хлопця є. Хоч Патруль і складається переважно з гулів, гладкошкірі на кшталт Ендрю приносять щось нове — дух Північного Охоронця. Якщо їм підходить — значить, і нам теж."

  tlp_andrews_boys:0 "Операція: Арктичний Арсенал"
  tlp_andrews_boys_desc:0 "Ендрю прийшов не з порожніми руками. Зброя, методи, підхід — усе з півночі, з напрацювань Вартових. Якщо для північних виродків цього досить — для нас тим більше. Заряджаємося й даємо прикурити!"

  tlp_a_night_to_remember:0 "Рай для патрульного"
  tlp_a_night_to_remember_desc:0 "Для гуля завжди важко залишатися в гарному настрої. Може, трохи святкування допоможе?"

  tlp_put_it_on_my_tab:0 "Запиши на мій рахунок!"
  tlp_put_it_on_my_tab_desc:0 "Та ну, Майку! Ти ж мав принести капелюх!"

  tlp_the_greatest_party_ever_held:0 "Найкраща вечірка в історії"
  tlp_the_greatest_party_ever_held_desc:0 "Ну і день народження вийшов!"

  tlp_getting_wasted:0 "Відрив на повну"
  tlp_getting_wasted_desc:0 "...Знаєш, мені це справді потрібно."

  tlp_banned_for_life:0 "Казино Рояль"
  tlp_banned_for_life_desc:0 "Вторгнення на південь — ризиковане, дурне й небезпечне. Але якщо Федерація нас таки добряче розлютить — можливо, це буде єдиний варіант."

  tlp_cherokee_advisors:0 "Черокі — радники"
  tlp_cherokee_advisors_desc:0 "Ми не хочемо різати черокі. Є серед них тямущі й приємні люди. Даймо їм шанс показати, що вони можуть."

  tlp_equipment_upkeep_advice:0 "Протоколи догляду за обладнанням"
  tlp_equipment_upkeep_advice_desc:0 "Науковці черокі поділилися порадами з обслуговування складного спорядження. Мудрі голови."

  tlp_cherokee_schematics:0 "Давні схеми"
  tlp_cherokee_schematics_desc:0 "Головний науковий офіцер черокі витягнув із шухляди товсту пачку креслень стародавніх машин війни. Цікаво..."

  tlp_the_big_spend:0 "Біґ-Спенд"
  tlp_the_big_spend_desc:0 "Цього разу постараємось не перетворити місце на руїни."

  tlp_choctaw_friendship:0 "Дружба з Чокто"
  tlp_choctaw_friendship_desc:0 "Виявляється, у нас із народом Чокто більше спільного, ніж ми думали. Час дізнатися, чого можемо навчитися одне в одного."

  tlp_stories_of_the_mother_mounds:0 "Перекази Материнських Горбів"
  tlp_stories_of_the_mother_mounds_desc:0 "“Материнські Горби” — от що врятувало Федерацію під час Великої війни. Люди тут живуть біля річок ще до війни. Може, навчать нас трохи орієнтації?"

  tlp_pit:0 "ПІТ"
  tlp_pit_desc:0 "Бібліотека “ПІТ” — величезне сховище довоєнного знання."

  tlp_the_hard_working_state:0 "Працьовитий штат"
  tlp_the_hard_working_state_desc:0 "Тепер, коли ми реформували державу, можемо спробувати залучити інших до роботи в новій демократії."

  tlp_consolidate_painted_rock:0 "Розмалювати скелю"
  tlp_consolidate_painted_rock_desc:0 "Аборигени зі Скелі потребують уроку демократії."

  tlp_consolidate_the_scrappers:0 "Розібрати Сміттярів"
  tlp_consolidate_the_scrappers_desc:0 "Чому б Компакту Сміттярів не вписатися в уряд Оклахоми? Вони мають із нами співпрацювати!"

  tlp_subjugate_the_cyphers:0 "Придушення Сайферів"
  tlp_subjugate_the_cyphers_desc:0 "Сайфери мають змінити підхід, якщо хочуть бути частиною уряду. Легка демонстрація сили переконає їх, що ми не вороги."

  tlp_subjugate_the_last_lodge:0 "Остання пісня Останньої Ложі"
  tlp_subjugate_the_last_lodge_desc:0 "Маленька Ложа біля техаського кордону. Можливо, трохи сили переконає їх стати на наш бік."

  tlp_the_states_first_election:0 "Перші вибори в Штаті"
  tlp_the_states_first_election_desc:0 "Коли більшість населення Оклахоми влилась у новий уряд, настав час зробити перший серйозний крок до демократії — провести вибори!"

  tlp_state_with_an_army:0 "Штат з Армією"

  tlp_freeing_the_possessed:0 "Звільнення Одержимих"

  tlp_all_or_nothing:0 "Усе або Ніщо"
  tlp_all_or_nothing_desc:0 ""

  tlp_together_as_one:0 "Разом як Одне"
  tlp_together_as_one_desc:0 ""

  nf_tlp.1.t:0 "Народжений Відчувати"
  nf_tlp.1.d:0 "§B“Гаррісон! Спускайся! Запізнишся до школи.”§!\nПам’ять — це повна срака.\nКрістофер Гаррісон — генерал Нацгвардії Оклахоми знає це. Але він не може дозволити собі забути.\n\n§B“Гаррі, ти ж розумієш, що маєш подати заяву до Волт-Тек. Інакше нам не потрапити в Сховище. Хіба ти не хочеш, щоб твої батьки жили в безпеці?”§!\nГулям треба боротися, щоб зберегти спогади. Розум старіє, тьмяніє, і чим далі ти йдеш від того “себе”, яким був — тим швидше забуваєш.\n\n§B“Я кохаю тебе, Гаррі. Поїдь зі мною до Європи! Там буде безпечно.”§!\nГуль не може дозволити собі забути. Коли ти забуваєш, хто ти, звідки, і чому живеш — ти втрачаєш все. Гуль без минулого — це гуль без майбутнього. А без серця — просто монстр."
  nf_tlp.1.a:0 "Я не маю права забути."
  nf_tlp.1.b:0 "Навіть якщо це боляче."

  nf_tlp.2.t:0 "Щасливий Син"
  nf_tlp.2.d:0 "Іноді Гаррісону доводиться нагадувати собі, що це життя — не прокляття. Що його напівжиття — не кара, а шанс.\n\n“Останній Патруль” став метою для багатьох гулів Оклахоми. Гаррісон знає, як важко триматися за власне “я”. А що вже казати про тих, хто й до війни жив так, ніби пам’ятати нема чого? Для них вічне життя — справжнє покарання.\n\nПатруль — це спосіб утримати цих гулів у межах людяності. Дати їм щось, чим можна пишатися."
  nf_tlp.2.a:0 "Я пишаюся своєю ротою."
  nf_tlp.2.b:0 "І вони — мною."

  nf_tlp.3.t:0 "Пофарбуй це у чорне"
  nf_tlp.3.d:0 "Двісті років потому, а Останній Патруль досі йде в ногу. Вічний похід — радше для самих гулів, ніж заради добра пустки. Бо головна місія Патруля — не померти вдруге, не забутись.\n\nЗа роки Патруль пережив бої з Братством, рейдерами, поселенцями, аборигенами.\n\nТа зараз з’явився новий ворог: “Одержимі” з Каплиці. Через річку Сімаррон до нас наближається армія племінних рабів розуму. Щось утримує їх, щось змушує йти на нас.\n\nІ все ж... Найстрашніші виклики — ті, що формують нас по-справжньому."
  nf_tlp.3.a:0 "Ми переможемо цих виродків..."
  nf_tlp.3.b:0 "Або помремо, намагаючись."

  nf_tlp.4.t:0 "Караванники з Мемфіса"
  nf_tlp.4.d:0 "Нещодавно прибув караван. Загадкові, в каптурах. Кажуть, із Мемфіса, торгового вузла на Міссісіпі.\n\nПривезли нам усякий мотлох — золоті монети, прикраси, “данину”. Це не набої, але можна продати іншим і обміняти на щось корисне."
  nf_tlp.4.a:0 "Головне, щоб не шукали пригод."

  nf_tlp.5.t:0 "Пропозиція з Мемфіса"
  nf_tlp.5.d:0 "Ті ж самі торговці зацікавились нашою перемогою над Каплицею. І ось — пропозиція: вони платять нам, якщо ми віддамо керівництво Скутого Хору в рабство. Кажуть, вождям Мемфіса потрібні “оракули”.\n\nВтім, Перша Хористка також зробила пропозицію: пощадити Хор і дозволити їм залишитись у Каплиці — в обмін на мир та співпрацю.\n\nКому довіритися?"
  nf_tlp.5.a:0 "Работорговці заслуговують рабства."
  nf_tlp.5.b:0 "Ми милосердні — навіть до монстрів."

  nf_tlp.6.t:0 "Перші вибори республіки Оклахома"
  nf_tlp.6.d:0 "Вперше за багато років Гаррісон може назвати цю землю домом. Ворогів немає. Настав час справжнього вибору: створити республіку.\n\nГулі Патруля й інші мешканці підкорених земель відправляються до урн... хоча деяких, кажуть, вели під дулом автомата.\n\nТа ось і іронія: Гаррісон очікував перемоги. А отримав — поразку. Інші кандидати випереджають його. Що далі — фальсифікація чи передача влади?"
  nf_tlp.6.1:0 "Це мій дім! Я не віддам його!"
  nf_tlp.6.2:0 "Нгует побудує поміркований уряд."
  nf_tlp.6.3:0 "А може, кандидат з Ложі?"
  nf_tlp.6.4:0 "Представник Федерації здається розумним."

  nf_tlp.7.t.tlp:0 "Велике святкування"
  nf_tlp.7.d.tlp:0 "У такому віці, як у Гаррісона, дивно ще пам’ятати про день народження.\n\nАле після важкого року — він його заслуговує. Воїни Патруля зібрали кришки в старий “Кришковий капелюх” й потягли Гаррісона на святкування до Великої Трати."
  nf_tlp.7.a.tlp:0 "Що вже може піти не так?"

  nf_tlp.7.t.cmc:0 "Хлопці Гаррісона прибули до Великої Трати"
  nf_tlp.7.d.cmc:0 "“Останній Патруль”, як вони себе називають, — не більше ніж гламурні рейдери. Ці хлопці грабували землі Федерації роками.\nАле... принаймні сьогодні вони платні відвідувачі. Може, нарешті порозумнішали після минулого вигнання?"
  nf_tlp.7.a.cmc:0 "Сподіваємось, цього разу будуть поводитись."

  nf_tlp.8.t.tlp:0 "Ми Загубили кришки!"
  nf_tlp.8.d.tlp:0 "Здається, знову вкрали наш капелюх із кришками. Гаррісон наказав просто повісити рахунок на Майка — мовляв, заплатить потім."
  nf_tlp.8.a.tlp:0 "Та кому яка різниця, правда ж?"

  nf_tlp.8.t.cmc:0 "Бійці патруля не платять!"
  nf_tlp.8.d.cmc:0 "Кожен солдат, прибулий із банди Гаррісона, відмовляється платити. Всі твердять, що “все на рахунок Майка Роча” — але хто взагалі такий цей Майк Роч!?"
  nf_tlp.8.a.cmc:0 "Хтось бачив “Майка Роча”!?"

  nf_tlp.9.t.tlp:0 "Подарунок від Майка"
  nf_tlp.9.d.tlp:0 "У готельному номері Великої Трати капрал Роч вручив Гаррісону кілька паличок "Смучу" — контрабанду.\n“З Днюхою, Генерале. Знаю, це тебе порадує.”"
  nf_tlp.9.a.tlp:0 "Ну... одну паличку можна..."

  nf_tlp.9.t.cmc:0 "Пошкоджене майно у Біґ-Спенд"
  nf_tlp.9.d.cmc:0 "Банда Гаррісона влаштувала справжнє свинство! Килим зірваний, лампи розбиті, стіни пошматовані. Що вони там витворяли цілу ніч?!"
  nf_tlp.9.a.cmc:0 "Починаю думати, що це не гості, а проблеми..."

  nf_tlp.10.t.tlp:0 "Промова на віки"
  nf_tlp.10.d.tlp:0 "Святкування тривало ще кілька днів. Потім настала “Велика Фінальна Вечеря”. Гаррісон зібрав усіх у головній залі й почав промову про доброту Федерації, що дозволила йому відсвяткувати день народження. Після цього — гулянка, як у його 140-ті."
  nf_tlp.10.a.tlp:0 "Як у Вегасі, тільки краще!"

  nf_tlp.10.t.cmc:0 "П’яна промова"
  nf_tlp.10.d.cmc:0 "Гаррісон запросив керівництво Федерації на свою промову. Це було... найгірше, що хто-небудь колись казав. Цілих півтори години п’яного марення про культурну єдність, важливість днів народження і нову серію Містера Ентертеймент.\nПромова закінчилася обіцянкою святкувати день народження кожного зі своїх солдатів тут. Щороку."
  nf_tlp.10.a.cmc:0 "Це треба зупинити."

  nf_tlp.11.t.tlp:0 "Заборона на Вхід до Біґ-Спенд!"
  nf_tlp.11.d.tlp:0 "Повернувшись додому, Гаррісон отримав повідомлення від Федерації. Чітко й офіційно: Гаррісон та всьому його Патрулю довічно заборонені до відвідування Біґ-Спенда за “огидну поведінку”."
  nf_tlp.11.a.tlp:0 "Це треба виправити!"

  nf_tlp.11.t.cmc:0 "Заборона на Останній Патруль"
  nf_tlp.11.d.cmc:0 "Це було не складне рішення. Насправді — єдине можливе. Якщо Гаррісон буде приводити своїх головорізів щороку — це збанкрутує всю Федерацію."
  nf_tlp.11.a.cmc:0 "Сподіваємось, не образяться."

  nf_tlp.12.t:0 "Гаррісонова банда рухається!"
  nf_tlp.12.d:0 "Схоже, Гаррісон не надто добре сприйняв заборону. Його банда вже збирається на кордоні — і схоже, планують вторгнення!"
  nf_tlp.12.a:0 "Треба попередити решту Федерації!"

  nf_tlp_leader.1.t:0 "Повідомлення від Командувача"
  nf_tlp_leader.1.d:0 "Генерале, сер!\nКомандир Нгуєн доповідає. Мої хлопці знайшли спосіб, як розірвати зв’язок, який Хор мав над своїми воїнами.\nПотрібно трохи капів на необхідні ресурси, але це дозволить нам залучити більше бійців до Патруля, ніж у нас було навіть під час рейдів на Чикаго!"
  nf_tlp_leader.1.a:0 "Добра робота, командире."

  nf_tlp_leader.2.t:0 "Повідомлення від Командувача"
  nf_tlp_leader.2.d:0 "Пане Генерал!\nХотів лише привітати з днем народження. Хлопці раді можливості зробити щось, що не пов’язано з грабунками і стріляниною. Це справді піднімає настрій."
  nf_tlp_leader.2.a:0 "Дякую, командире."

  nf_tlp_leader.3.t:0 "Повідомлення від Командувача"
  nf_tlp_leader.3.d:0 "Пане Генерал!\nВибачте, але мушу сказати — це одне з найгірших рішень, які ви коли-небудь ухвалювали. Напасти на Федерацію фронтально тільки через те, що вас вигнали з казино? Це божевілля. Через це загине безліч людей, просто тому що ви вирішили “відірватися”.\nЯ не братиму участь у цій битві. Це неправильно."
  nf_tlp_leader.3.a:0 "Ви звільнені, командире."

  tlp_apa_recruit:0 "Кілька людей Мо приєднуються до нас!"
  tlp_banned_for_life_tt:0 "§YВелика Федерація Рівнин§! §Rсерйозно нас образила§!"
  we_are_having_a_party_tlp:0 "§pЗавершується автоматично під час вечірки!§!"

