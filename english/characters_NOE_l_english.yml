l_english:
    NOE_NOE_NAME:0 "Ное"
    NOE_NOE_DESC:0 "До Ное у ноеменів не було імені. Збори дивних упирів і мутантів, які іммігрували так далеко, як тільки могли, із заходу, щоб знайти мир у світі у свій власний, особливий спосіб. Лише нещодавно Ноемени були змушені переховуватися, а однойменний Ное допомагав ховати мутантів у печерах, коли Вісімдесятники почули їхній рев. Незабаром вони навчилися слідувати за ним"