l_english:
  IRN_powderkeg_wars:0 "Забезпечити контроль над територією [FROM.GetNameWithFlag]"
  IRN_assist_lanius:0 "Допомогти [LAC.GetLeader] у війні проти [FROM.GetNameWithFlag]"

  irn_focus:0 "Відлуння Горна"
  irn_focus_desc:0 "Залізо говорить — і ми слухаємо. Через вогонь і випробування нам відкривається шлях — не через пророцтво, а через тиск і полум’я. Розлом змінив світ, але водночас відкрив його; те, що ми втратили у вогні, можемо віднайти в сталі."

  irn_plaguelands_1:0 "Шепіт Чумних Земель"
  irn_plaguelands_1_desc:0 "Музи стихають, коли ми дивимось на північ. Там витає щось глибше за смерть — земля, спотворена не лише війною, а й мовчанням, що відкидає навіть дух. Якщо Розлом і торкнувся цього місця — то не з благословенням."

  irn_plaguelands_2:0 "Торгівля з Останнім Оборонцем"
  irn_plaguelands_2_desc:0 "За Шнуром Самітників лежить Останній Оборонець — єдиний голос на межі тиші. Торгівля тут тече обережно, за старими бар'єрами, покликаними стримати Роз'єднаних. Навіть наші музи стихають в його тіні — але ми витримуємо, притягнуті залізним пульсом далеких коренів."

  irn_houndlands_1:0 "Лихо за Денвером"
  irn_houndlands_1_desc:0 "Пси-Вішальники тепер правлять попелом Денвера, а з цих руїн до нас хлинули каравани й чужинці. Вони приносять монети, культури й хаос. Ми чуємо їхні історії про привидів і руїни — шепіт Роз'єднаних душ, що й досі блукають автострадами."

  irn_houndlands_2:0 "Торгівля з «Пакувальниками»"
  irn_houndlands_2_desc:0 "Вони називають себе «Пакувальниками», родом із серця НКР — впорядковані, скептичні й багаті. Вони насміхаються з наших обрядів і називають Розлом звичайною «Великою війною». Але золото є золото, і їхні каравани нам потрібні — допоки вони шанують залізо даниною."

  irn_new_sterling_1:0 "Нью-Стерлінг — Місто Полум’я"
  irn_new_sterling_1_desc:0 "Нью-Стерлінг — не просто столиця: це наша плавильня, наш горн. Тут працює Кузня Acme, колись належна міфічній Загрозі з Заходу, а тепер вона знову дихає. Хтось каже, що кузня — привид. Ми кажемо: вона — *прокинулася*."

  irn_new_sterling_2:0 "Храми Культу Заліза"
  irn_new_sterling_2_desc:0 "У шипінні труб і дзвоні молотів Культ Заліза чує пісні муз. Вони вирізьбили храми зі старих майстерень і освятили плавильні мастилом і сажею. Дух горна говорить через полум’я, а відлуння Розлому веде наші руки, як невидимий коваль."

  irn_livewires_1:0 "Зв’язок із «Живими Дротами»"
  irn_livewires_1_desc:0 "На сході постають «Живі Дроти» — рух Ріверів, народжений із болю та винахідливості. Тепер вони прагнуть будувати. Їхнє шанування схем схоже на наше вшанування сталі, а їхні легенди про шамана Вачуту нагадують старі байки наших мандрівників."

  irn_livewires_2:0 "Спільні Міфи, Спільний Метал"
  irn_livewires_2_desc:0 "«Живі Дроти» вірять у Розлом, як і Культ Заліза. Їхні шамани говорять про духів машин і зламане небо — так само, як і наші. Між нами може бути майбутнє — з сяючими кресленнями, шепочучими музами й залізним причастям."

  irn_help_the_legion:0 "Зброя для Флагстаффа"
  irn_help_the_legion_desc:0 "Легіон прагне сталі. Хоч вони й зневажають технології, полководці не можуть ігнорувати ефективність. Наші музи сміються з їхніх забобонів, але наші горни не обирають — допоки їхнє золото блищить, як сталь, ми годуватимемо їхню війну."

  irn_blackrock_federation:0 "Приєднатись до Федерації Блекрок"
  irn_blackrock_federation_desc:0 "Федерація Блекрок контролює каньйони й плоскогір’я на заході. Вони прагнуть миру, але розуміють, що мир потребує зброї. Культ Заліза бачить надію в їхній дипломатії — можливо, в єдності музи знайдуть нових обранців."

  irn_powderkeg:0 "Порохова Бочка Спалахує"
  irn_powderkeg_desc:0 "Захід прокидається — жадаючи нашої сили й заздрячи нашим музам. Нехай ідуть. Якщо Розлом чомусь і навчив — так це тому, що хаос народжує новий порядок. А ми — молот, що формує майбутнє з вогню."
  irn_powderkeg_tt:0 "Відкриває §Yрішення§! на отримання претензій і цілей війни проти §Y[WHD.GetNameWithFlag]§!, §Y[BAG.GetNameWithFlag]§! і §Y[LUM.GetNameWithFlag]§!."

  irn_iron_legion:0 "Залізний Пакт"
  irn_iron_legion_desc:0 "Легіон голодний — і ми годуємо його не ідеологією, а сплавами. У Флагстаффі вони моляться Марсу. А тут вони вшановують Залізо — свідомо чи ні."

  irn_deal_with_new_epsilon:0 "Торгівля з Новим Епсілоном"
  irn_deal_with_new_epsilon_desc:0 "Завдяки «Живим Дротам» старі шляхи до Епсілона відкриваються знову. Від попелу Канзасу до бастіонів Середнього Заходу наші горни промовляють — хай не словами, але торгівлею. Дух горна пізнає рідню навіть у віддалених краях."
  irn_deal_with_new_epsilon_funny:0 "§gБуллітітер якось подивився на схід із Нью-Стерлінга — і не побачив нічого. Лише тисячі миль зламаних парканів, мертві автостради та слабкий запах вареної кукурудзи. «Дивина, — пробурмотів він, — невже досі ніхто не закінчив цю мапу?»§!"

  irn_our_own_path:0 "Подорож до Чумних Земель"
  irn_our_own_path_desc:0 "Нью-Стерлінг ніколи не мав бути кінцем — для Буллітітера шлях лежить на північ, у землі, задушені тишею й спотворені чумою. Що його туди веде — він не каже. Лише що музи й далі шепочуть крізь бурю.\n\nНехай це буде його паломництво — не щоб відвоювати, а щоб зустрітися віч-на-віч. Якщо Розлом щось там залишив, він зустріне це — в залізі й під проводом вогню."

  irn_platte_trade_league:0 "Охоронці Платта"
  irn_platte_trade_league_desc:0 "На заході — Торгова Ліга Платта, тенета купців. Їхня слабкість провокує війну — але якщо ми запропонуємо їм сталь і захист, можемо збудувати мир. Горн пам’ятає кожен удар — і якщо Розлом зламав світ, то, можливо, торгівля зцілить його."