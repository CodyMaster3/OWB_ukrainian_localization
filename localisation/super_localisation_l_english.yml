l_english:
sp_event_Second_World_War:0 "Війна за Захід"
sp_event_Second_World_War_QUOTE:0 "Наші воїни накриють їх хвилею крові, відтинаючи руки до того, як вони зможуть вдарити, ноги до того, як вони зможуть втекти, і голови до того, як вони зможуть помолитися. \n- Легат Ланій"
sp_event_Second_World_War_REMARK:0 "Невинні миші радіють"

sp_event_Sino_Japanese:0 "Pax Romana"
sp_event_Sino_Japanese_QUOTE:0 "Ми будемо перемагати в усіх сферах! Ми будемо перемагати ТАК БАГАТО, що ви навіть можете втомитися від перемог... І ви скажете: «Будь ласка, будь ласка, це занадто багато перемог! Ми більше не можемо цього витримати, пане Легат. Це занадто!» А я скажу: «Ні, це не так! Ми маємо продовжувати перемагати! Ми маємо перемагати ще більше!»\n- Цезар"
sp_event_Sino_Japanese_REMARK:0 "Пустеля затримує подих"

sp_event_Spanish_Civil_War:0 "87 звільнених племен"
sp_event_Spanish_Civil_War_QUOTE:0 "Ми користуємося своїми привілеями, тому що ви йдете на найбільші ризики і готові зробити найвищі жертви. Саме завдяки таким людям, як Джеремі Уотсон, Невада та Нова Каліфорнія залишаються вільними та безпечними. \n- Президент Кімболл"
sp_event_Spanish_Civil_War_REMARK:0 "Смерть тирану!"

sp_event_Pacific_War:0 "87 звільнених племен"
sp_event_Pacific_War_QUOTE:0 "Хоча я маю слабке і немічне тіло старого чоловіка, я маю шлунок солдата Ріо! І я вважаю неприпустимим, щоб який-небудь легат Цезаря порушував наші права. Віва Лібертад! \n- Данте Ґерра"
sp_event_Pacific_War_REMARK:0 "Смерть тирану!"

sp_event_Barbarossa:0 "Відродження Техасу"
sp_event_Barbarossa_QUOTE:0 "Техас – це найкраща частина світу, яку коли-небудь благословляли мої очі! \n- Сем Г'юстон"
sp_event_Barbarossa_REMARK:0 "Жовта троянда розцвітає"

sp_event_Nationalist:0 "Нова Каліфорнія Відроджена"
sp_event_Nationalist_QUOTE:0 "Не дивіться назад на те, що ми досягли. Дивіться вперед на те, що ми зробимо завтра. \n- Ґрант С. Гейз"
sp_event_Nationalist_REMARK:0 "Ця земля була створена для тебе і мене"

sp_event_Republican:0 "Сталева чума"
sp_event_Republican_QUOTE:0 "Глибоко дивлячись в темряву, я довго стояв там, дивлячись, боячись. \n- Едґар Аллан По"
sp_event_Republican_REMARK:0 "Людство висить на волоску"

sp_event_Anarchist:0 "Сталева Каліфорнія"
sp_event_Anarchist_QUOTE:0 "Отже, сьогодні ввечері, коли ми розділяємо хліб, давайте створимо разом щось нове. Щось, чим ми можемо пишатися. Щось, на чому ми можемо будувати майбутнє. Ми збережемо найкраще з того, що було раніше, і будемо це використовувати. І одного дня ми повернемо те, що було втрачене. \n- Роджер Мексон"
sp_event_Anarchist_REMARK:0 "Паладини знову на поверхні"

sp_event_Communist:0 "Каліфорнійський мандат"
sp_event_Communist_QUOTE:0 "Ви вб'єте десять з нас, ми вб'ємо одного з вас, але в кінці ви закінчитесь першими. \n- Хо Ши Мін"
sp_event_Communist_REMARK:0 "Чи зменшаться податки?"

sp_event_Falangist:0 "Безсмертна Перемога"
sp_event_Falangist_QUOTE:0 "Довіра – це добре, але контроль – краще. \n- Йосип Сталін"
sp_event_Falangist_REMARK:0 "Північний легіон?"

sp_event_Stalinist:0 "Макартур контролює Монтану"
sp_event_Stalinist_QUOTE:0 "Анклав – це ви, Америка. Анклав – це ваша сестра, ваша тітка, ваш друг, ваш сусід. І так, Анклав – це і я також. \n- Джон Генрі Іден"
sp_event_Stalinist_REMARK:0 "Боже, благослови Америку"

sp_event_Carlist:0 "Відродження Департаменту Оборони"
sp_event_Carlist_QUOTE:0 "Це неприємний факт, але ми можемо забезпечити мир лише підготувавшись до війни. \n- Джон Ф. Кеннеді"
sp_event_Carlist_REMARK:0 "Ми завоюємо континент"

sp_event_British_Collapse:0 "Військове відомство"
sp_event_British_Collapse_QUOTE:0 "Війна – це зло, але інколи це менше зло. \n- Джордж Орвелл"
sp_event_British_Collapse_REMARK:0 "Ми завоюємо світ"

sp_event_Fall_Germany:0 "Доктрина Чейза"
sp_event_Fall_Germany_QUOTE:0 "Дядько Сем вкладав багато грошей у те, щоб перетворити вас на вбивць... час розплатитися. \n- Константін Чейз"
sp_event_Fall_Germany_REMARK:0 "Вони не пройдуть!"

sp_event_Soviet_End:0 "Доктрина Шермана"
sp_event_Soviet_End_QUOTE:0 "Війна – це жорстокість. Немає сенсу намагатися реформувати її. Чим жорстокішою вона буде, тим швидше все закінчиться. \n- Вільям Текумсе Шерман"
sp_event_Soviet_End_REMARK:0 "Смерть згори!"

sp_event_Japanese_Surrender:0 "Доктрина Макартура"
sp_event_Japanese_Surrender_QUOTE:0 "Немає нічого кращого за перемогу. \n- Даглас Макартур"
sp_event_Japanese_Surrender_REMARK:0 "Атака, Атака, Атака!"

sp_event_Fall_America:0 "Працюючи для кращого завтра"
sp_event_Fall_America_QUOTE:0 "Війна – це найбільша трагічна і дурна людська помилка; прагнути до її провокації чи порадити це – це чорний злочин проти всіх людей. \n- Дуайт Д. Ейзенгауер"
sp_event_Fall_America_REMARK:0 "Ми не зробимо цих помилок."

sp_event_first_nuke:0 "Запалюючи вогні Старого Світу!"
sp_event_first_nuke_QUOTE:0 "Я став смертю, руйнівником світів. \n- Дж. Роберт Оппенгеймер"
sp_event_first_nuke_REMARK:0 "Світ може лише спостерігати"

sp_event_Imperial_Federation:0 "Американо-Легіонерська війна"
sp_event_Imperial_Federation_QUOTE:0 "Вені, Віді, Вічі. \n- Юлій Цезар"
sp_event_Imperial_Federation_REMARK:0 "ОХ ЛИСЕ ПАДЛО!"

sp_event_Decolonization:0 "Кінець ядерної ери"
sp_event_Decolonization_QUOTE:0 "Зброя війни повинна бути знищена, перш ніж вона знищить нас. \n- Джон Ф. Кеннеді"
sp_event_Decolonization_REMARK:0 "Ми більше не БОЖЕВІЛЬНІ"

sp_event_Uk_King:0 "Повернення ядерної ери"
sp_event_Uk_King_QUOTE:0 "Світ без ядерної зброї буде менш стабільним і більш небезпечним для нас усіх. \n- Маргарет Тетчер"
sp_event_Uk_King_REMARK:0 "Ми повинні захищати наші інтереси"

sp_event_Mosley:0 "Війна зі сталіністами"
sp_event_Mosley_QUOTE:0 "Як розпізнати комуніста? Ну, це той, хто читає Маркса та Леніна. А як розпізнати антикомуніста? Це той, хто розуміє Маркса та Леніна. \n- Рональд Рейган"
sp_event_Mosley_REMARK:0 "Закінчення спадщини Сталіна"

sp_event_Uk_Communist:0 "Війна з маоїстами"
sp_event_Uk_Communist_QUOTE:0 "Комунізм – це не любов. Комунізм – це молот, яким ми ламаємо ворога. \n- Мао Цзедун"
sp_event_Uk_Communist_REMARK:0 "Може їм надіслати їжі?"

sp_event_Second_World_War_Kaiser:0 "Війна з роботами-комуністами"
sp_event_Second_World_War_Kaiser_QUOTE:0 "§СМЕРТЬ – КРАЩЕ ПОРІВНЯНО З КОМУНІЗМОМ.§ \n- Ліберті Прайм"
sp_event_Second_World_War_Kaiser_REMARK:0 "Де Ліберті Прайм, коли він потрібен?"

sp_event_German_Civil_War:0 "Повернення сегрегації"
sp_event_German_Civil_War_QUOTE:0 "Сегрегація зараз, сегрегація завтра, сегрегація навіки! \n- Джордж Уоллес"
sp_event_German_Civil_War_REMARK:0 "Happy ending <3"

sp_event_Kaiser_Returns:0 "Правам людини навіки"
sp_event_Kaiser_Returns_QUOTE:0 "Я маю мрію, що одного дня мої чотири маленькі дитини житимуть у державі, де їх не оцінюватимуть за кольором шкіри, а за змістом їхнього характеру. \n- Мартін Лютер Кінг молодший"
sp_event_Kaiser_Returns_REMARK:0 "Спадщина Лінкольна"

sp_event_German_Democracy:0 "Право на закон"
sp_event_German_Democracy_QUOTE:0 "Світ більше не має вибору між силою і законом; якщо цивілізація повинна вижити, вона повинна вибрати правління закону. \n- Дуайт Д. Ейзенгауер"
sp_event_German_Democracy_REMARK:0 "Всі будуть оцінені рівно."

sp_event_Endsieg:0 "Нескінченний військовий стан"
sp_event_Endsieg_QUOTE:0 "Партія сказала вам відкинути докази ваших очей і вух. Це був їхній останній, найважливіший наказ. \n- Джордж Орвелл, 1984"
sp_event_Endsieg_REMARK:0 "ПІДТРИМУЙТЕ КОМЕНДАНТУРУ!"

sp_event_Fall_France:0 "Повернення Конгресу"
sp_event_Fall_France_QUOTE:0 "Ми, народ, є законними господарями як Конгресу, так і судів, не для того, щоб повалити Конституцію, а для того, щоб повалити тих, хто її спотворює. \n- Авраам Лінкольн"
sp_event_Fall_France_REMARK:0 "З рук одного."

sp_event_Fall_Poland:0 "Призупинення Конгресу"
sp_event_Fall_Poland_QUOTE:0 "Коли Конгрес працює, жоден американець не в безпеці. \n- Марк Твен"
sp_event_Fall_Poland_REMARK:0 "Більше не марнуємо час!"

sp_event_Unholy_Alliance:0 "Третя битва при Булл-Ран"
sp_event_Unholy_Alliance_QUOTE:0 "Добре, що війна така жахлива – ми занадто б захопилися нею. \n- Роберт Е. Лі"
sp_event_Unholy_Alliance_REMARK:0 "Третій раз – вдасться"

sp_event_Austria_Hungary:0 "Звір з Чикаго рухається"
sp_event_Austria_Hungary_QUOTE:0 "Так, хоча я йду через долину тіні смерті, я не буду боятися жодного зла, бо ти зі мною; твій жезл і твій посох мене втішають. \n- Псалом 23:4"
sp_event_Austria_Hungary_REMARK:0 "Америка більше не буде такою"

sp_event_Eastern_Front:0 "Кінець Анклаву"
sp_event_Eastern_Front_QUOTE:0 "Ціна свободи – це вічна пильність. \n- Томас Джефферсон"
sp_event_Eastern_Front_REMARK:0 "СВОБОДА НАВІКИ!"

sp_event_Vicky_3:0 "Кінець Третьої світової війни"
sp_event_Vicky_3_QUOTE:0 "Коли війна закінчиться, ми одружимося, і на Землі зацвітуть квіти, подібні до тебе, а твоє лоно виносить найпрекраснішу дівчинку у Всесвіті. \n- Невідомий солдат, 1939 рік"
sp_event_Vicky_3_REMARK:0 "Так багато життів втрачено..."

sp_event_Fall_China:0 "Повернення Братства"
sp_event_Fall_China_QUOTE:0 "...Давайте влаштуємо банкет і відсвяткуємо. Бо цей мій син був мертвий і став живим; він був втраченим і знайшовся.' І почали святкувати. \n- Лука 15:23-24"
sp_event_Fall_China_REMARK:0 "Братерство понад усе!"

sp_event_Chinese_Civil_War:0 "Війна з Братством"
sp_event_Chinese_Civil_War_QUOTE:0 "Війна – це єдина правильна школа для хірурга. \n- Гіпократ"
sp_event_Chinese_Civil_War_REMARK:0 "Чортові консервні банки!"

sp_event_Communist_Unification:0 "Повернення армії"
sp_event_Communist_Unification_QUOTE:0 "Америка без своїх солдатів була б як Бог без своїх ангелів. \n- Клаудія Пембертон"
sp_event_Communist_Unification_REMARK:0 "В армії зараз!"

sp_event_Nationalist_Unification:0 "Повернення Повітряних Сил"
sp_event_Nationalist_Unification_QUOTE:0 "Міць повітряних сил величезна, коли немає нічого, що могло б їй протистояти. \n- Вінстон Черчилл"
sp_event_Nationalist_Unification_REMARK:0 "Ми володіємо Небом!"

sp_event_Russo_Japanese_War:0 "Повернення Флоту"
sp_event_Russo_Japanese_War_QUOTE:0 "Не здавайтеся на кораблі! \n- Командор Олівер Газард Перрі"
sp_event_Russo_Japanese_War_REMARK:0 "Новий Білий флот?"

sp_event_Qing_Dynasty:0 "Повернення Морської піхоти"
sp_event_Qing_Dynasty_QUOTE:0 "Відступ? Чорт, ми тільки що прибули! \n- Ллойд В. Вільямс"
sp_event_Qing_Dynasty_REMARK:0 "Зробимо Честі гордою!"

sp_event_JAP_GEACPS:0 "Проєкт Безпечний Притулок"
sp_event_JAP_GEACPS_QUOTE:0 "Краще жити під землею \n- Слоган Vault-Tec"
sp_event_JAP_GEACPS_REMARK:0 "Назад у Сховище"

sp_event_Japanese_Civil_War:0 "Повернення Берегової охорони"
sp_event_Japanese_Civil_War_QUOTE:0 "Я забезпечу, щоб мої начальники спокійно спали, знаючи, що я за штурвалом, незалежно від стану. \n- Кредо берегової охорони США"
sp_event_Japanese_Civil_War_REMARK:0 "Завжди готові."

sp_event_Chinese_Victory:0 "Корпус роботизованих армій"
sp_event_Chinese_Victory_QUOTE:0 "Hasta La Vista, Baby \n- Т-800"
sp_event_Chinese_Victory_REMARK:0 "Термінатори!"

sp_event_RCWC:0 "Америка відроджена"
sp_event_RCWC_QUOTE:0 "Один прапор, одна земля, одне серце, одна нація на віки! \n- Олівер Венделл Голмс-молодший"
sp_event_RCWC_REMARK:0 "Америка... знову!"

sp_event_RCWW:0 "Друга Російська громадянська війна"
sp_event_RCWW_QUOTE:0 "Нехай Господь Бог допоможе Росії! \n- Микола II"
sp_event_RCWW_REMARK:0 "Чистки не були достатніми"

sp_event_Romanov:0 "Відновлення Романових"
sp_event_Romanov_QUOTE:0 "«Серце царя в руках Бога». Нехай так буде. За всі закони, встановлені мною, я несу велику відповідальність перед Богом, і готовий відповісти за своє рішення в будь-який час. \n- Микола II"
sp_event_Romanov_REMARK:0 "Стабільна Росія?"

sp_event_PLC:0 "Повернення Спільноти"
sp_event_PLC_QUOTE:0 "Якщо Бог з нами, то хто проти нас. \n- Девіз Польсько-Литовської Спільноти"
sp_event_PLC_REMARK:0 "Більше не буде поділів!"

sp_event_Winter_War:0 "Зимова війна"
sp_event_Winter_War_QUOTE:0 "Ми виграли майже достатньо землі, щоб поховати наших мертвих. \n- Генерал Червоної армії"
sp_event_Winter_War_REMARK:0 "Чи варто це того?"

sp_event_Macedon:0 "Повернення Македонської імперії"
sp_event_Macedon_QUOTE:0 "Немає нічого неможливого для того, хто спробує. \n- Олександр Великий"
sp_event_Macedon_REMARK:0 "Спадщина Олександра живе!"

sp_event_Byzantium:0 "Повернення Візантійської імперії"
sp_event_Byzantium_QUOTE:0 "Боже, не дай мені жити як імператор без імперії. Як моє місто падає, так я з ним упаду. \n- Костянтин XI, при падінні Константинополя"
sp_event_Byzantium_REMARK:0 "Deus Vult!"

sp_event_Ottoman:0 "Воскресіння Османської імперії"
sp_event_Ottoman_QUOTE:0 "Ми не боїмося сови, ми – яструби. \n- Мехмед II"
sp_event_Ottoman_REMARK:0 "Більше не Хворий чоловік"

sp_event_Turan:0 "Тюркське об'єднання"
sp_event_Turan_QUOTE:0 "Як щасливий той, хто говорить: 'Я – турок'. \n- Мустафа Кемаль Ататюрк"
sp_event_Turan_REMARK:0 "Тепер ви всі турки!"

sp_event_Balkan:0 "Об'єднання Балкан"
sp_event_Balkan_QUOTE:0 "Групування і взаємодія країн і народів на Балканах – це єдиний шлях до економічного, національного та політичного визволення. \n- Димитрій Туцкович"
sp_event_Balkan_REMARK:0 "Як довго це триватиме?"

super_info.1.t: "Vanilla Super Events"
super_info.1.d: "Thank you for using Vanilla Super Events! \n\nEvent audio is controlled through the music player meaning you can now control music volume and even pause it whenever you like (Just don't click on different stations or press the shuffle and skip song buttons while the event audio is playing). \nWhen a Super Event triggers in game, you can also click on the music player to see the name of the song currently playing. \n\nIf you have any questions, feel free to ask me on this mod's Steam page."
super_info.1.a: "See the latest changes."
super_info.1.b: "Enjoy the mod!"

super_info.2.t: "VSE Changelog"
super_info.2.d: "Update 1.6\n\n5 New Battle for the Bosphorus Events:\n\nReturn of the Macedonian Empire\nByzantine Empire Returns\nResurrection of the Ottoman Empire\nTurkic Unification (Turan)\nBalkan Unification"
super_info.2.a: "Enjoy the mod!"
