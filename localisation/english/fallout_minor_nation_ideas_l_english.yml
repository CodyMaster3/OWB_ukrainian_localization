research_bonus:0 "Зусилля в дослідженнях"
research_bonus_desc:0 ""

neutrality_owb:0 "Нейтралітет"
neutrality_owb_desc:0 ""

#SUN
sun_victors_against_pallus:0 "Переможці над Пауллом"
sun_victors_against_pallus_desc:0 "Паулл здавався нездоланним – допоки не намагався завести своїх когорт у землі Сонячних Псів. Його колісниці пройшли крізь вузьку гірську ущелину, сповнені самовпевненості після попередніх перемог.\nБитва була короткою, але вирішальною – Ґолд-Гаунд довів Пауллу, що Колорадо йому не підкорити. І навіть сьогодні спадщина тієї поразки жива – плем’я зуміло розібрати легіонерські колісниці, і зробити їх своїми!"

##########################
##### УНІКАЛЬНІ ГЕНЕРИК ІДЕЇ
##########################

#UFO
zetan:0 "Зетани!"
zetan_desc:0 "Високорозвинені, інопланетні істоти з можливостями, що для мешканців пустки здаються магією."

#STR
str_watchers_of_the_stars:0 "Сторожі Зірок"
str_watchers_of_the_stars_desc:0 "Сторожі Зірок спостерігають за небом уже понад триста років. Народжені з громади, що з давніх-давен дивилась на зірки, вони завжди знали – щось там дивиться у відповідь. Їхня культура просякнута мандрівниками, загадками та таємницями нічного неба."

#EDN
the_corpse:0 "Труп"
the_corpse_desc:0 "Багато років тому Ріс, ватажок Шифрів, викрав G.E.C.K. з місця, знаного як “Розсадник”. Він використав його, щоби перетворити значну частину земель – від центрального Колорадо до узбережжя Мексиканської затоки – у щільні, мутовані джунглі. Якби не Скарлет, яка його зупинила, він би міг перетворити всю пустку на своє тропічне пекло.\nПопри те, що більшість мутованої флори навколо зруйнованого Корпус-Крісті (де відбулася фінальна битва) було очищено, G.E.C.K. залишився. Його не вдалося знищити, тому Скарлет перенесла його у віддалене місце під назвою Едем, і разом із розвідниками Братства вирушила у самітництво, аби стримати вплив пристрою."

#DSP
highwaymen_of_louisiana:0 "Шосейні Розбійники Луїзіани"
highwaymen_of_louisiana_desc:0 "Базуючись у Шривпорті, на перехресті I-49 і I-20, Десперадос налагодили ефективну систему шосейного розбою. Їхні мотоцикли швидкі, налаштовані до ідеалу – а самі розбійники наганяють страх на торговців і мандрівників від Далласа до Нового Орлеана. Їхня стратегія проста: стрімкий напад, жодної пощади."

#GAM
chains_across_the_rivers:0 "Ланцюги через Ріки"
chains_across_the_rivers_desc:0 "Спускаючи залізні ланцюги вглиб річок Луїзіани, ми можемо ловити на них човни допитливих торговців, що шукають шляхи на захід від Міссісіпі. Розграбування застряглих суден дає нам ресурси, які були б інакше рідкістю."

#TLT
river_trade:0 "Великий Міссісіпі"
river_trade_desc:0 "Міссісіпі – серце торгівлі Середнього Заходу, що транспортує товари від Королевської ради, Мемфіських фараонів та Чикаґо до кипучих портів Карибського басейну. Само собою зрозуміло, що [TLT.GetName] має на цьому заробити."

#SYN
syilx_council_of_eight:0 "Рада Восьми"
syilx_council_of_eight_desc:0 "Нація Сілікс управляється Виконавчою Радою Вождів, що складається з семи вождів та голови Колвілльських Племен. Рада регулярно засідає, вирішуючи важливі питання, захищаючи народ, землю та ресурси нації."

syilx_captikwl:0 "captíkwł"
syilx_captikwl_desc:0 "captíkwł – це вчення про принципи, звичаї, цінності, закони та структури Сіліксів. Вони є як природними законами, так і частиною процесу культурного відродження. Вони передаються кожному юнакові та дівчині нації й навчають, як вижити на своїй землі."

#HAI
hai_raven_and_eagle:0 "Ворон і Орел"
hai_raven_and_eagle_desc:0 "Соціальне життя хайда поділяється на дві головні групи: Воронів і Орлів. Родовід визначає бік селища, де живе сім’я, історії, які вони слухають, і навіть місця для риболовлі. Попри ці відмінності, родини поєднують обидві групи, зміцнюючи зв’язок між ними."

hai_whaling_chiefs:0 "Ватажки Китових Полювань"
hai_whaling_chiefs_desc:0 "Полювання на китів – частина господарства хайда протягом тисячоліть. Ватажки цих полювань ('haw’iih') мають економічну й соціальну владу. За традицією, деякі з них можуть навіть контактувати з китами у духовному світі, знаходячи їх для полювання."

#SLE
bomb_station_02:0 "Станція B.O.M.B. 002"
bomb_station_02_desc:0 "Сліпери контролюють доступ до Станції B.O.M.B. 002 – зруйнованої космічної станції, що впала в самісіньке серце Великого Каньйону. Хоча більшість споруди – суцільні руїни, в її сталевому корпусі досі ховається безліч таємниць."

#MES
wickiup_nomads:0 "Кочівники Вікіап"
wickiup_nomads_desc:0 "Протягом більшої частини своєї історії мескалеро були кочівниками – мисливцями та воїнами, які зводили тимчасові житла (вікіапи) на просторах південного заходу. Хоча в пізнішому XX столітті вони частково осіли, традиції кочового життя залишаються важливою частиною культури мескалеро."

guerilla_legacy:0 "Спадок Партизан"
guerilla_legacy_desc:0 "Коли білі вперше прийшли до Америки, мескалеро боролися з їх постійним вторгненням у свої землі. Відомі своїми партизанськими рейдами проти іспанських, мексиканських і американських поселень, мескалеро залишили по собі спадок спротиву, що живе й донині."

#TLP
always_ready_always_there:0 "Завжди Готові, Завжди Тут"
always_ready_always_there_desc:0 "«Завжди готові, завжди тут» – гасло Національної гвардії, до якої належала більшість гулів із Останнього Патруля до Великої Війни. Їх структура, звання та уніформа збереглися, як і дисципліна – тож підрозділ і досі постійно готовий зустріти будь-яку загрозу з усією своєю силою."

army_with_a_state:0 "Армія з Державою"
army_with_a_state_desc:0 "Коли впали бомби, більшість Національної гвардії Оклахоми перебувала на базі на заході від Талси, беручи участь у масштабних навчаннях. Будучи в епіцентрі ядерного удару, Талса була знищена – а гвардійці вижили лише завдяки відстані, але не без наслідків. Радіація повільно перетворила їх на розумних гулів. Не маючи змоги врятувати місто, вони присягнули захищати те, що залишилось. Ізолювавшись, вони стали неймовірно захисними щодо своїх земель і вороже налаштованими до чужинців."

#PAR
warriors_of_the_rock:0 "Воїни Скелі"
warriors_of_the_rock_desc:0 "Кожен юнак племені Розмальованої Скелі повинен пройти Випробування Скелі – тижневу духовну подорож, що перевіряє їхні фізичні й моральні якості. Ті, хто виживе, стає воїном. Ті, хто ні – стають жертвою Скелі."

ancestral_mesa_paintings:0 "Пращурські Малюнки на Месі"
ancestral_mesa_paintings_desc:0 "Протягом поколінь наше плем’я малювало на скелях месі, зображуючи свою історію та традиції. Завдяки цим зображенням ми вчимося на помилках предків і стаємо сильнішими."

#GRH
grh_eyes_south:0 "Очі на Південь"
grh_eyes_south_desc:0 "Ми постійно змушені відбивати рейдерські напади з південного заходу, тож у нас майже не залишається часу турбуватись про справи Мексики."

grh_guardian_of_north_america:0 "Охоронець Північної Америки"
grh_guardian_of_north_america_desc:0 "Розташована на межі Центральної та Північної Америки, Гондурас уникнула жахів повного ядерного знищення. Її уряд встиг підготуватися до радіаційної зими, і завдяки єдності армії, цивільної влади й служб порятунку, держава перетворилась на народне ополчення. Через пів століття після війни на Гондурас почали насуватись орди з Центральної Америки – вцілілі нації, що впали в анархію. Але Гондурас – останній бастіон. І він їх не пропустить."

#LUB
lub_ghoul_human_tensions:0 "Тертя Між Людьми і Гулями"
lub_ghoul_human_tensions_desc:0 "Лаббок поділений навпіл: центр міста належить людям, а район біля аеропорту – гулям. Напруга між двома громадами тліє роками, але мер Ірвінг Воттс зробив чимало, щоби пом’якшити взаємну підозру. Без нього, і допомоги Лоунстара, тут давно могла спалахнути громадянська війна."

#ASF
asf_the_memorabilia:0 "«Меморабілія»"
asf_the_memorabilia_desc:0 "Головна місія Архідієцезії Санта-Фе – зберегти «меморабілію» Старого Світу: письмові джерела, що пережили Велику Війну. Сховані, переписані, вивчені напам’ять – вони є надбанням усіх майбутніх поколінь."

asf_legacy_of_saint_leibowitz:0 "Спадок Святого Лейбовіца"
asf_legacy_of_saint_leibowitz_desc:0 "Святий Лейбовіц був інженером-електриком до Великої Війни. Після вибуху бомб він утік зі своєї бази й став монахом у Санта-Фе. Його зрадив близький друг, через що Лейбовіц став мучеником. Його канонізували за збереження спадку Старого Світу. Сьогодні монахи охороняють його реліквії й готові померти, аби не дати їм зникнути."

#EDA
EDA_ufo_defense:0 "Захист Від Зетанів!"
EDA_ufo_defense_desc:0 "[EDA.GetName] стверджує, що захищає Землю від прибульців із зірок, які зазіхають на планету з холодною жадібністю. Більшість у це не вірить – але мовчить."

EDA_secrets:0 "Засекречена Інформація"
EDA_secrets_desc:0 "[EDA.GetLeader] каже, що володіє знаннями, які «людству знати не слід». У «екстремальний червоточинний портал» мало хто вірить, але очевидно – вони знають більше, ніж звичайний пустельник."

#WHD
whd_chinese_remnants:0 "Китайські Залишки"
whd_chinese_remnants_desc:0 "У наших землях мешкає багато різних гулів. Але одна група виділяється – вони називають себе «китайцями» та «комуністами» й розповідають про міфічні далекі землі за чимось, що вони звуть «океан». Деякі новоприбулі гулі захоплюються їхніми ідеями й полюбляють сперечатися з бойовими вождями Старих Псів. Але вони також приносять із собою забуті знання, тож Старий Пес вітає таку поведінку."

#WHI
whi_burden_of_a_nation:0 "Тягар Нації"
whi_burden_of_a_nation_desc:0 "Після різанини Старійшин Вістлера, влаштованої камлійськими виживачами, на молодих впало завдання зберегти пам'ять племені. Бракує досвіду, аби гідно нести цю ношу – тож молодій адміністрації доводиться приймати болючі жертви, щоб спадок Вістлера не згас."

whi_bitter_resistance:0 "Запеклий Опір"
whi_bitter_resistance_desc:0 "Ми знаємо – камлійці знову прийдуть за нашими жінками й дітьми, щоби пограбувати й поневолити нас. Ми маємо бути готові зустріти їх і не дозволити повторити минулі жахи."

#KAM
kam_sourge_of_the_whiteout:0 "Кара Білого Безкраю"
kam_sourge_of_the_whiteout_desc:0 "Виживачі Камло знають лише одне – як вижити у пустці: терором і здирництвом. Вони панують залізною рукою над кількома поселеннями в білосніжній глушині Канади. Але деякі мріють про більше – про теплі й ситі землі на півдні. І вони підуть туди."

#DRE
dre_mining_economy:0 "Гірнича Економіка"
dre_mining_economy_desc:0 "Об’єднання шахтарських поселень Британської Колумбії, Дреджери живуть із видобутку корисних копалин. Використовуючи роботів для копання та охорони, вони стали притулком для поселенців і машин, які тікають від жахів Камло та Зламаного Узбережжя."

dre_victorian_naval_attache:0 "Морський Аташе Нової Вікторії"
dre_victorian_naval_attache_desc:0 "Щоб захиститися від загрози рейдерів Зламаного Узбережжя, ми уклали угоду з Новою Вікторією. Її §Yморський аташе§! забезпечує нас технічною підтримкою, допомагаючи покращити наш флот в обмін на майбутні торгові поступки. \n\n§GПоки аташе перебуває на наших землях, ми отримаємо брата королеви як експедиційного адмірала!§!"

#VIC
vic_strait_of_georgia_defence_fleet:0 "Флот Оборони Протоки Джорджія"
vic_strait_of_georgia_defence_fleet_desc:0 "Основний щит Нової Вікторії від ворогів – протока Джорджія, що омиває її з півночі та сходу. Маневровий флот дозволяє нам стримувати набіги рейдерів і дикунів Канади, поки ми не зміцніємо."

vic_cascadian_heriatge:0 "Каскадська Спадщина"
vic_cascadian_heriatge_desc:0 "Королівська влада Нової Вікторії походить від старих канадських політиків. Це дає їй змогу претендувати як на спадщину Канади, так і на Каскадію."

can_form_cascadia_tt:0 "Можемо утворити §RКаскадію§!, якщо володіємо всіма §Oосередніми територіями§! §OЗламаного Узбережжя§!."

#RAP
rap_riding_the_white_water:0 "Білі Води – Наш Дім"
rap_riding_the_white_water_desc:0 "Усі в нашому племені з дитинства знають, як керувати човном. Ми народжені на бурхливих водах південного Колорадо й вправні в усьому, що стосується річок."

rap_fiercely_independent:0 "Запекла Незалежність"
rap_fiercely_independent_desc:0 "Наші вірування пов'язані з течією річки Колорадо. Відірвати нас від нашого дому буде вкрай важко."

#TWO
two_worship_of_nas:0 "Поклоніння Насу"
two_worship_of_nas_desc:0 "Боги Насу, що мешкають у Великих Перегонах, подарували народу Ту Сану Дар Мотора. Вони навчили нас таємницям двигуна внутрішнього згоряння, і ми вшановуємо їх донині."

two_masters_of_the_motor:0 "Повелителі Мотора"
two_masters_of_the_motor_desc:0 "Найбільший дар богів Насу – мотор. Завдяки йому Ту Сан створює машини, що долають Великі Перегони, і панує над пустками Південної Арізони."

two_four_stroke_miracle:0 "4-Тактне Диво"
two_four_stroke_miracle_desc:0 "Впуск. Стиснення. Згоряння. Випуск. Ці чотири слова – молитва кожного майстра. Поршневий двигун – найкращий доказ дива Насу."

#PER
per_thrill_of_the_hunt:0 "Захват Полювання"
per_thrill_of_the_hunt_desc:0 "Полюючи на жахливо мутованих звірів південнотехаських боліт, Преслідувачі здобули славу вправних мисливців, яким не потрібно більше, ніж запах крові."

per_stalking_man:0 "Полювання на Людину"
per_stalking_man_desc:0 "Мутанти – не єдина здобич Преслідувачів. Люди – теж у списку. У південних болотах ніхто не в безпеці."

#TFR
tvr_protected_by_the_rio_lerma:0 "Захист Ріо-Лерма"
tvr_protected_by_the_rio_lerma_desc:0 "Наша торгова імперія стоїть на іншому березі Ріо-Лерма – на віддалі від Ацтлана. Поки ми контролюємо ріку, ми в безпеці."

tvr_the_merchant_class:0 "Клас Торговців"
tvr_the_merchant_class_desc:0 "Більшість нашої еліти – колишні торговці, які втекли з Ацтлана після поразки від Тлалока. Ми знаємо торгівлю як свої п’ять пальців."

#UIN
uin_ute_heritage:0 "Спадщина Ютів"
uin_ute_heritage_desc:0 "У місті Іґл-Рок живе багато втікачів і вигнанців, але помітна частка населення походить із резервації Юнта – однієї з давніх земель народу ютів."

uin_eagle_rock_airfield:0 "Аеродром Іґл-Рок"
uin_eagle_rock_airfield_desc:0 "Коли наші предки прибули до Іґл-Року, вони знайшли покинутий аеродром. Для племені небо стало символом свободи – даром Великого Зефіру, який дає змогу втекти від турбот і загроз."

#YAK
yak_the_forest_of_the_elders:0 "Ліс Старійшин"
yak_the_forest_of_the_elders_desc:0 "Більша частина традиційних земель Якама вкрита густими лісами. Багато дерев були посаджені старійшинами племені, і кожне покоління нації дбає про ліс, аби передати його наступному."

yak_living_from_the_land:0 "Життя з Землі"
yak_living_from_the_land_desc:0 "Якама вміють жити з того, що дає їм рідна земля. Вони звикли пересуватися по території залежно від пори року та наявності їжі. Ці традиції роблять воїнів нації майстрами імпровізації та виживання."

#TCA
tca_a_temporary_mandate:0 "Тимчасовий Мандат"
tca_a_temporary_mandate_desc:0 "Так звана «Рада Єдності», очолювана Абелем і підтримувана братством-вигнанцями та Вартовими Півночі, ніколи не претендувала на роль постійного уряду. Вона створена лише для того, аби забезпечити виживання до того часу, як зрадницький Вашингтонський Відділ буде переможений, а Капітолійське Пагорб повернуто. Рада має мало політичної ваги – натомість вона стала символом спротиву і об'єднання."

tca_a_temporary_mandate_tt:0 "\nПісля перемоги над §YВашингтонським Братством§! і повернення §YКапітолійського Пагорба§! ми отримаємо доступ до §Oрішень з формування нації§!."

tca_brotherhood_exiles:0 "Братство Вигнанців"
tca_brotherhood_exiles_desc:0 "Мало хто вижив після кривавого перевороту Безсмертного в Сіетлі. Ті, кому вдалося втекти, зібралися на руїнах Портленда й обрали Абеля новим старійшиною. Вигнанці сподіваються повернути собі Капітолійський Пагорб і відновити добре ім’я Братства."

tca_wardens_of_the_white:0 "Вартові Білих Земель"
tca_wardens_of_the_white_desc:0 "Парамiлiтарна міліція, що тримає оборону в Портленді. Після серії поразок від Розбивачів ребер і вашингтонського братства, їхні сили зменшилися, але союз із Вигнанцями дав нову надію. Їхня майстерність у зимових та міських боях доповнює важку зброю Братства."

tca_brotherhood_reforged:0 "Перековане Братство"
tca_brotherhood_reforged_desc:0 "Після повалення Безсмертного Братство Північного Заходу обрало шлях єдності й процвітання. Довіру доведеться відновлювати роками, але новий розділ куди кращий за тирана."

tca_protectors_of_the_north:0 "Захисники Півночі"
tca_protectors_of_the_north_desc:0 "Колись останній бастіон захисту Портленда, нині Вартові знайшли нову домівку серед руїн Сіетлу. Завдяки хвилі рекрутів з усієї Вашингтонщини, вони знову стали силою, з якою слід рахуватись."

#TOC
toc_legacy_of_vault_100:0 "Спадок Сховища 100"
toc_legacy_of_vault_100_desc:0 "Сховище 100, збудоване під Споканом, було одним із найбільших у Vault-Tec. Тут проводився жахливий експеримент: дозована радіація спричинила мутацію частини населення у гулів. Зрештою це спричинило громадянську війну, в якій перемогли гулі. Людська частина втекла на поверхню, а ми залишилися господарями Спокану. Тепер їхні нащадки хочуть помсти."

toc_the_last_homely_house:0 "Останній Притулок"
toc_the_last_homely_house_desc:0 "Руїни Спокану – останній оплот цивілізації перед холодною пусткою Канади. Саме тут зупиняються дослідники та шукачі пригод, перш ніж рушити на північ. Багато хто вирішує залишитися назавжди."

toc_memories_of_a_future_past:0 "Спогади про Майбутнє Минуле"
toc_memories_of_a_future_past_desc:0 "Перед війною Спокан був логістичним центром для армії США в Канаді. Багато висококласних фахівців були розміщені в Сховищі 100. Дехто з них вижив і досі пам’ятає старий світ, мріючи відновити колишню велич міста."

toc_memories_of_a_future_past_tt:0 "\nЗвільнення §YCoeur d'Alene§! і утримання §YСпокану§!, перемігши §!Rotpurgers§!, відкриє доступ до рішення §O«Утворити Стару Штатову Спокан»§!."

#ROT
rot_legacy_of_vault_100:0 "Спадок Сховища 100"
rot_legacy_of_vault_100_desc:0 "Сховище 100, побудоване під Споканом, було місцем жахливого експерименту Vault-Tec: половину населення піддали радіації. Згодом майже всі ці люди перетворилися на гулів. Люди, які лишилися «чистими», збунтувались. Але програли. Вони втекли, щоби колись повернутись із помстою."

rot_legacy_of_vault_100_tt:0 "\nПовернення §YСпокана§! і знищення §YСтарої Країни§! відкриє доступ до рішення §O«Утворити Велику Інквізицію»§!."

rot_eternal_quest:0 "Вічний Похід Чистоти"
rot_eternal_quest_desc:0 "З часу вигнання з Сховища 100 ми готувались до помсти. Озброєні вогнеметами й трьома поколіннями люті, ми повертаємось. Ми спалимо Спокан до тла, якщо цього потребуватиме очищення."

rot_eternal_quest_tt:0 "Наша §Rненависть§! до мутантів така сильна, що ми §Rне можемо§! наймати жодних §Oмутантів§!."

#TDN
tdn_wannabe_drug_empire:0 "Невдаха-Наркокартель"
tdn_wannabe_drug_empire_desc:0 "Мордіно давно мріють знову очолити наркоімперію, як у часи їхнього панування в Нью-Ріно. У Ден вони вже мають певний вплив, але до колишньої слави ще далеко. І все ж ніхто не може заперечити, що вони докладають усіх зусиль, щоб відновити сімейну монополію."

tdn_legacy_of_reno_days:0 "Спадок «Найбільшого Маленького Міста»"
tdn_legacy_of_reno_days_desc:0 "Після падіння Бази Анклаву та піднесення Бішопів і Райтів у Нью-Ріно, кримінальну родину Мордіно змусили втекти з рідного міста через криваві війни банд. Після вбивства Великого Ісуса, батька Малого Ісуса та головного рушія піднесення Мордіно, родина блукала пустками, поки не осіла в Ден. Ден і до того мав репутацію притулку злочинності й наркотиків, але з приходом Мордіно ці проблеми лише поглибились. Як би добре не йшли справи у Ден, тінь Нью-Ріно ніколи не зникне."

#FIE
fie_drug_monopoly:0 "Монополія на Наркоту в Мохаві"
fie_drug_monopoly_desc:0 "Чорти практично повністю контролюють потік хімікатів у Мохаві, завдяки поставкам від Великих Ханів і Нью-Ріно. Хімічний бізнес приносить великі прибутки, особливо коли життя місцевих – суцільна депресія."

fie_strength_in_numbers:0 "Сила в Кількості"
fie_strength_in_numbers_desc:0 "Чого Чортам бракує в розумі чи технологіях, вони з надлишком компенсують чисельністю. І справді – в Мохаві завжди знайдеться охочий до хімії невдаха, що хоче приєднатися."

#COW
cow_remnants_of_rangers:0 "Залишки Арізонських Рейнджерів"
cow_remnants_of_rangers_desc:0 "Арізонські Рейнджери, покликані захищати слабких, десятиліттями боролися з Легіоном Цезаря. Попри хорошу підготовку, перед обличчям чисельної переваги ворога вони змушені були втрачати все більше територій. Після поразки від Легата Мальпайса у 2271 більшість уцілілих перейшла до Республіки. Лише невелика група подалася на південь, у так звану «Країну Ковбоїв». Хоча їх надто мало, щоб правити, їхній військовий досвід сильно вплинув на оборону цього регіону."

cow_reformed_corps:0 "Реформований Корпус Рейнджерів"
cow_reformed_corps_desc:0 "Після тривалої боротьби ми нарешті відвоювали частину Арізони й знову взяли на себе ім’я Арізонських Рейнджерів. Легіон прийшов знову, та ми його зупинили. Тепер час згадати, ким ми є насправді."

form_arizona_rangers_tt:0 "Ми отримаємо §Yпретензії§! на всі області в §OАрізоні§!.\n\n"

cow_bastion_of_liberty:0 "Останній Бастіон Свободи Арізони"
cow_bastion_of_liberty_desc:0 "Легіон захопив майже всю Арізону, поневолюючи людей. Ми – остання вільна територія, й мусимо боронити наш народ до останнього."

cow_legion_resistance:0 "Спротив Легіону"
cow_legion_resistance_desc:0 "Попри нашу перемогу, залишки Легіону все ще діють у наших землях. Знадобиться час, аби повністю викорінити їхній вплив."

#KLA
KLA_gecko_abundance:0 "Достаток Геконів"
KLA_gecko_abundance_desc:0 "Кламат живе за рахунок пасток і шкірування геконів, яких у цьому регіоні безліч. Деякі дурні досі стають їхніми жертвами."

KLA_professional_trappers:0 "Професійні Траппери"
KLA_professional_trappers_desc:0 "Мешканці Кламата – найкращі мисливці на геконів. А якщо треба, їхні навички можна використати й для небезпечнішої дичини. Якщо пастка вбила гекона, уявіть, що вона зробить з ногою рейдера..."

#PMR
PMR_slaves_and_drugs:0 "Раби та Наркота"
PMR_slaves_and_drugs_desc:0 "Економіка Порт Мо залежить майже повністю від торгівлі рабами та наркотиками. Хоч це й не дуже прибутково чи морально, відсутність канібалізму робить місто популярним серед покупців. Краще вже бути наркоманом, ніж обідом."

PMR_wannabe_criminal_empire:0 "Невдаха-Кримінальна Імперія"
PMR_wannabe_criminal_empire_desc:0 "Банди Порт Мо мріють стати центром кримінальної імперії. На заваді їм стоїть конкуренція з боку Нью-Ріно й Дена. Та все одно до них тягнуться юнаки без перспектив, шукаючи слави. Шкода їх."

#BEl
bel_bellingham_for_battle:0 "Беллінгем до Бою"
bel_bellingham_for_battle_desc:0 "Міста Беллінгем і Ванкувер, через їхню близькість до Трансаляскінського нафтопроводу, були ключовими точками під час американсько-канадського конфлікту. Багато гулів, що живуть тут зараз, пам’ятають ті бої – дехто навіть у них брав участь.\n\nВони не підуть без бою."

bel_spirit_of_liberty:0 "Дух Свободи"
bel_spirit_of_liberty_desc:0 "Американська пропаганда перед Великою Війною залишила глибокий слід у свідомості тих, хто називав Америку домівкою. Вона була настільки потужною, що навіть через 200 років її вплив не вщух серед гулів цього регіону. Ідеали свободи та світового домінування Америки стали ключовими для незалежної культури Беллінгема та Куверу."

#BLP / BVC
baja_banditos:0 "Бандито де Баха"
baja_banditos_desc:0 "Два великих кримінальних угрупування Бахи – банда Паса та банда Валле – справжні майстри своєї справи. Об'єднавши свої сили та таланти, «Бандито де Баха» запустили масштабну мережу контрабанди. Вони спеціалізуються на доставці зброї та наркотиків із мексиканських картелів до рейдерських банд НКР, і заробили на цьому величезні кришки – та нажили собі чимало ворогів..."

baja_banditos_united:0 "Єдині Бандито де Баха"
baja_banditos_united_desc:0 "Після того, що здалося вічністю, дві банди Бахи нарешті об'єдналися. Тепер не існує ані банди Паса, ані Валле – є тільки Бандито де Баха. Брат боровся з братом, але тепер кров пролита, і Баха спрямовує погляд до нових вершин."

blp_procurement_specialists:0 "Фахівці із Закупівель"
blp_procurement_specialists_desc:0 "У межах партнерства з бандою Валле, банда Паса повністю взяла на себе питання закупівель незаконного товару. Раби, наркотики, зброя чи навіть кавова залежність – Паса знайде все, якщо ціна буде правильною..."

bvc_expert_smugglers:0 "Експерти-Контрабандисти"
bvc_expert_smugglers_desc:0 "Ніхто не вміє підкупити солдата НКР чи уникнути патруля Рейнджерів краще, ніж банда Валле. За десятиліття досвіду вони водили НКР за ніс, доставляючи заборонене до Дейглоу, Могильника та Хаба."

#OLY
oly_park_legacy:0 "Спадок Нацпарку"
oly_park_legacy_desc:0 "Хоча дні лісників і екскурсій давно минули, культурна важливість орієнтування на місцевості та знання природи залишилась глибоко вкоріненою в культурі племені Олімп. У знанні промислу й будівництва вони, може, й слабкі, зате в маневрах – їм немає рівних."

oly_nomadic_traditions:0 "Кочові Традиції"
oly_nomadic_traditions_desc:0 "Після падіння бомб багато мешканців західного Вашингтону втекли до Нацпарку Олімп. Житла на всіх не вистачило, тому всі мусили звикнути до кочового способу життя. З роками знання про старе життя згасли, але традиція постійного руху та адаптації залишилась ключовою."

oly_diplomatic_isolation:0 "Дипломатична Ізоляція"
oly_diplomatic_isolation_desc:0 "Ми сильне, але малочисельне плем’я. Географія та спосіб життя віддалили нас від решти пустки. Знадобиться час, аби світ дізнався про нашу боротьбу."

#PEC
pec_animal_husbandry:0 "Тваринництво"
pec_animal_husbandry_desc:0 "Серед постапокаліптичних господарств колонія Пекос – одна з найкращих. Розташована поблизу Ріо-Ґранде, вона багата на стада худоби ще з довоєнних часів. Знання про тварин та обробку м’яса робить Пекос не тільки вправними пастухами, а й цінними мисливцями."

pec_rancher_culture:0 "Культура Скотоводів"
pec_rancher_culture_desc:0 "Жителі Пекосу звикли кочувати зі своїми брагмінами пусткою Техасу. Наявні поселення здебільшого виконують торгову функцію, а громада легко пересувається. Якщо одне селище падає – громада переноситься разом з усім нажитим."

#UMB
umb_spiritual_guidance:0 "Провід Духів"
umb_spiritual_guidance_desc:0 "Плем’я Умбра вірить, що душі померлих лишаються в світі, й шанують велику кількість духів, приписуючи їм риси характеру. Ці духи ведуть плем’я, допомагають і мотивують. Що правда, чи існують вони – питання інше, але віра в них зміцнює єдність і волю до боротьби."

umb_arroyo_trade:0 "Торгівля з Арройо"
umb_arroyo_trade_desc:0 "Зв’язок між Суліком із Умбри та Обраним стрімко переріс у тісну дружбу двох народів. Арройо допоміг Умбрі ознайомитися з цивілізованими технологіями, а Умбра ділиться мисливськими знаннями та навичками виживання."

#MXC
bizaare_market:0 "Buy Some Trades"
bizaare_market_desc:0 "Заснована родиною Фрідманів у 2199 році, компанія Buy Some Trades доставляє товари в Колорадо, Канзас і навіть у заражені Плагленди, оминаючи Річкову Лігу й Братство Середнього Заходу. Окрім товарів, вони надають послуги: від будівництва парканів до аграрних консультацій. Там, де з’являється Buy Some Trades – з’являється надія."

# TON
ton_expert_cultivators:0 "Майстри землеробства"
ton_expert_cultivators_desc:0 "Нація Тохоно О'одам має давню традицію гармонії з природою. Від складних іригаційних систем до новітніх методів посадки й збирання врожаїв – О'одам є одними з найвидатніших аграріїв усіх Пусток Америки. Їхні врожаї гарантують зростання населення, а самі фермери ніколи не припиняють вдосконалювати свої методи."

ton_seven_stars:0 "Одинадцять зірок"
ton_seven_stars_desc:0 "Велика печатка Нації Тохоно О'одам несе одинадцять зірок – по одній на кожен з одинадцяти округів, що складають Націю. Об'єднані задовго до Великої Війни, після падіння бомб вони лише зміцнили свою єдність у боротьбі за виживання. Сьогодні всі одинадцять округів мають представників у Законодавчій Раді, яка працює заради добробуту й безпеки всього народу."

# SHO
sho_outcasts_once_again:0 "Знову вигнанці"
sho_outcasts_once_again_desc:0 "Століттями після прибуття колоністів європейці вигнали шошонів у гори Заходу. Частина племені оселилася в Юті й південному Айдахо, здобула офіційне визнання, і здавалося – вижила після Великої Війни. Але коли радіаційний попіл осів, у регіон прийшли релігійні війни. Псевдохристиянські секти – від божевільних із Небесної Брами до 'праведників' із High Chapel – оголосили себе обраними. Шошони опинилися під тиском з усіх боків і були змушені залишити рідні землі. Та їхній дух ще живий – і вони готуються до повернення."

sho_return_home:0 "Назад додому"
sho_return_home_desc:0 "Духи повернули нас до рідної землі. Наш народ знову ходитиме долинами предків. Поки над річкою Змії шумить трава – це наша земля, і наших нащадків."

sho_back_home:0 "Сеуґубеоґой"
sho_back_home_desc:0 "До приходу мормонів ми називали долину Кеш 'Сеуґубеоґой' – долина верб. Поселенці знищили землю, винищили дичину, вигнали нас. Тепер ми повернулись. Ми більше не вигнанці. Як квіти над Сеуґубеоґой, ми знову проростаємо попри все, що кинула нам доля."

sho_snake_river_teachings:0 "Науки річки Змії"
sho_snake_river_teachings_desc:0 "Річка Змії, що тече вздовж північного кордону шошонів, століттями давала їм воду й їжу. Хоча нас вигнали з дому, доступ до Змії лишився. І ми не забули, як виживати."

SHO_pathfinder_tt:0 "Починає з технології §HПровідники§!"

# CHE
che_what_remains_of_the_trainyard:0 "Залишки депо"
che_what_remains_of_the_trainyard_desc:0 "Потяги в Чемалті стоять, але не забуті. За покоління з них витягли незліченну кількість запчастин і брухту, а мешканці зробили домівки просто в пустих вагонах."

che_our_survival_secured:0 "Наша безпека – забезпечена"
che_our_survival_secured_desc:0 "Північні загарбники думали, що напад на Кроушейвен буде легкою прогулянкою. Але зустріли смерть. Вас і Акрі довели: ми не здамось. І з цією перемогою вони поведуть нас до ще більшої слави."

# IRN
decision_expand_alliance_effects:0 "Загартовані вогнем"
decision_expand_alliance_effects_desc:0 ""

# LON
decision_longtree_effects:0 "У Дерево з’явилися гості"
decision_longtree_effects_desc:0 ""

# MOS
mos_storms_of_the_divide:0 "Шторми Розлому"
mos_storms_of_the_divide_desc:0 "«Розлом» – це залишки Гоупвілля й Ештона, міст-привидів Старого Світу. Їх зберегли дивні шторми, що постійно вирують у долині, не даючи ранам минулого загоїтися."

mos_old_world_heritage:0 "Спадок Старого Світу"
mos_old_world_heritage_desc:0 "У Розломі досі збереглися символи та герби з довоєнного часу. Це рідкісне місце, де пам'ять про Старий Світ не втрачено."

# HGH
hgh_flatland_fleetfoot:0 "Рівнинні Бистроногі"
hgh_flatland_fleetfoot_desc:0 "Фанатики з [HEA.GetName] вигнали нас із гірських проходів. Але ми не скорились. Південні рівнини Айдахо – родючі, багаті на ресурси. Наші фермери-вояки найкраще б’ються, коли захищають свою землю."

hgh_craters_of_the_moon:0 "Кратери Місяця"
hgh_craters_of_the_moon_desc:0 "Національний парк «Кратери Місяця» – спадщина ядерних випробувань станції B.O.M.B. Це химерне місце приваблює туристів і слугує важливим орієнтиром для караванів, що торгують у наших землях."

# ROB
machine_commune:0 "Комуна Машин"
machine_commune_desc:0 "Місто Роботів – маяк для машин з усієї Пустки, які прагнуть братерства й єдності. Навіть робо-скорпіони тут бажані гості – головне, щоб дотримувались правил!"
machine_commune_tt:0 "\n§pДо Міста Роботів періодично прибуватимуть роботи з Пустки в пошуках нового дому.§!"

# RHO
RHO_raiders_of_lost_space_center:0 "Рейдери Загубленого Космічного Центру"
RHO_raiders_of_lost_space_center_desc:0 "Космічний центр Блумфілда завжди був небажаною дитиною. До війни уряд мав великі плани, але відмовився від них заради інших проєктів. Потім його ненадовго захопила Анклав, але евакуювався ще до запуску HERMES-XIII. Братство Сталі завжди жадало це місце, але не змогло просунутися через внутрішні конфлікти. І зрештою центр дісталися рейдерам – які лише частково зрозуміли, як ним користуватись.\n\nЩо ж, навіть ця думка – вже лякає."
RHO_raiders_of_lost_space_center_tt:0 "§gПочинає з §Gдвома позаекранними військовими майстернями§! завдяки потужностям Блумфілда.§!"

RHO_raiders_of_arizona:0 "Рейдери Арізонської співдружності"
RHO_raiders_of_arizona_desc:0 "Банда якось таки зробила це: витіснила Бика з Арізони й стала новою наддержавою регіону! Багатства, раби, страх і паніка – усе це тепер асоціюється з Іржавими Гачками. І вони жорстокіші за сам Легіон."
RHO_raiders_of_arizona_tt:0 "§gОтримує §Gще дві позаекранні військові майстерні§!, загалом §Gчотири§!, збільшуючи електричну потужність Блумфілда.§!"

# 5.0
river_league:0 "Річкова Ліга"
river_league_desc:0 "Ліга – це вільне об’єднання міст і поселень, розкиданих на тисячі миль. Вугілля й руда з Монтани пливуть вниз по річці, тоді як цукор із Півмісяця і кава з Кости – вгору. Ковпаки течуть, як сама ріка."

jackson_family_ties:0 "Сімейні узи"
jackson_family_ties_desc:0 "Родина Джексонів, що пережила втечу на схід, тримається купи й не довіряє чужинцям. Але ця лояльність дає перевагу – це не просто ще одна банда."

ruminator_book:0 "Румінація до Багатства"
ruminator_book_desc:0 "«Румінація до Багатства» – довоєнна книга самодопомоги, яка надихає на внутрішній спокій і позитивне мислення. Її практичні уроки полюбили читачі на всьому Середньому Заході.\n\n§g«Книга проста – і в цьому її сила. Жодного слова про комуністичних дияволів чи Нову Чуму! Автор, знаний лише як 'Y.D.', ніби писав її з іншого світу. Його мудрість – позачасова. Навіть через 200 років вона залишатиметься актуальною!»§W\n– Ліндсі Ферроуз, колонка “Зустрічаємо Людей”, 2077 р.§!"

crop_rotation:0 "Фермери-піонери"
crop_rotation_desc:0 "Історики зберігають знання перших поселенців у Дакотах. Їхня сівозміна не лише рятує врожаї, а й приносить симпатії сусідів."

# Generic
generic_unite_tri_cities:0 "Об’єднати Три-Міста!"
generic_unite_tri_cities_desc:0 "Ми контролюємо злиття річок Якіма, Снейк і Верхньої Колумбії – саме час об’єднати три міста в єдине. Колись їх розділяли штати, але зараз, у новому світі, вони можуть реалізувати свій спільний потенціал."

# Canada
strath_china_ideology:0 "Думка Товариша Ченґа"
strath_china_ideology_desc:0 "Підійміть червоний прапор Думки Товариша Ченґа, об’єднайтесь навколо Партії й Голови, і розчавіть усі ревізіоністські змови. Революція ще не загинула!"

stc_five_year_plan:0 "П’ятирічний план"
stc_mass_mobilization_idea:0 "Масова мобілізація"
stc_mass_mobilization_1:0 "Офіцери Народу"
stc_desperate:0 "Революційна боротьба"
stc_cult_personality:0 "Культ особи"
four_year_plan:0 "Чотирирічний план"