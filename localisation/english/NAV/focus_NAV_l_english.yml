NAV_history_of_the_people:0 "З Першого Світу"
NAV_history_of_the_people_desc:0 "Дехто каже, що навахо походять від Першого Чоловіка та Жінки, які збудували дім у Дінетах, святий і прекрасний. Інші стверджують, що навахо мігрували на південний захід Америки у 1400-х роках. Наймудріші з Народу знають: правда — в обох версіях."

NAV_before_the_great_war:0 "Між Койотом і Жінкою Змін"
NAV_before_the_great_war_desc:0 "Роки до Великої Війни були важкими для навахо. Хоча шахти й економічний розвиток принесли певний добробут, багато американців бачили Резервацію навахо лише як землю для експлуатації."

NAV_caesar_legion:0 "Під спіраллю Тіхольцоді"
NAV_caesar_legion_desc:0 "Велика Війна не оминула навахо, але ми вижили там, де інші загинули. Спільна культура та те, що ми не зазнали найгірших бомб, дозволили нам відновитися тоді, коли інші згинули від голоду, рейдерів чи власних інстинктів. Наші розвідники відбивали аризонських работоргівців, стада кіз і брамінів множилися, а майстри срібла обробляли метал для власного вжитку. А потім прийшов Легіон."

NAV_navajo_economy_start:0 "Три Сестри"
NAV_navajo_economy_start_desc:0 "Колись Народ жив за рахунок трьох сестер: кукурудзи, бобів і гарбуза. Тепер три сестри — це сільське господарство, шахтарство й торгівля. Ми повинні розвивати всі три, щоб стояти міцно й вільно."

NAV_windmills:0 "Вітрова ферма Нілтсі"
NAV_windmills_desc:0 "Який кращий спосіб вшанувати бога вітру, ніж побудувати електростанцію? Як його шепіт дав силу Переможцю Монстрів, так і ця станція вдихне нове життя в наші домівки."

NAV_silversmiths:0 "Майстри срібла"
NAV_silversmiths_desc:0 "Майстри срібла навахо славляться вже понад п’ятсот років. Ми продаємо їхні вироби по всій Пустці й приносимо нове багатство нашому народові."

NAV_brahmin_herds:0 "Стада брамінів"
NAV_brahmin_herds_desc:0 "У Народу є вислів: «стадо — це життя». Вівці, браміни та кози годують і вдягають нас. Процвітання під Легіоном дозволило нам вдосконалити техніки та нагодувати більший ринок."

NAV_uranium_mines:0 "Відкрити уранові шахти?"
NAV_uranium_mines_desc:0 "Уранові шахти навахо слугували Америці ще до Великої Війни. Ми ніколи не піддамо Народ впливу радіації, але [CES.GetLeader] запропонував частину своєї робочої сили."

NAV_military_start:0 "Розвідники навахо"
NAV_military_start_desc:0 "Навахо служили розвідниками під час Індіанських війн Америки, і повернулися до цієї ролі в Пустці. Традиція відродилася після Великої Війни, коли ми почали полювати на рейдерів і бандитів."

NAV_lessons_from_caesar:0 "Уроки Цезаря"
NAV_lessons_from_caesar_desc:0 "Наші стосунки з Легіоном Цезаря складні, але навіть ворога варто слухати, якщо в нього добре навчена армія. Принаймні поки що."

NAV_warrior_traditions:0 "Допомога від Цілителів"
NAV_warrior_traditions_desc:0 "Важливо не лише вбивати ворога — важливо прожити біль війни: запах мертвих, їхні тіла. Ми навчимо воїнів звертатися до цілителів, співати молитви, проводити Церемонію Ворогів, ділити пейот із побратимами. І знайти мир."

NAV_rainbow_arrows:0 "Нацилітка"
NAV_rainbow_arrows_desc:0 "Брати-герої озброїлися нацилітка — стрілами веселки. На щастя, й ми можемо зробити те саме сьогодні."

NAV_sign_language:0 "Мова знаків Великих Рівнин"
NAV_sign_language_desc:0 "Колись індіанці Америки спілкувались спільною мовою жестів, розуміючи одне одного без слів. Тепер ми — одні з останніх, хто її пам’ятає. І це нам на руку."

NAV_fight_some_more_forever:0 "Я битимусь далі — і завжди"
NAV_fight_some_more_forever_desc:0 "Навахо не вижили після команчів, 200 років утисків, ядерної війни та навали супермутантів, щоб вклонятись Цезарю. Ми терпляче чекаємо... і повстанемо!"
NAV_fight_some_more_forever_tt:0 "Це підвищить рівень §Rопору навахо§! на один."
NAV_fight_some_more_forever_two_tt:0 "Це підвищить рівень §Rопору навахо§! на два."

NAV_happiness_servitude:0 "Найкраще плем’я в Легіоні"
NAV_happiness_servitude_desc:0 "Критики питають: що, окрім доріг, зрошення й порядку, дав нам [CES.GetName]? Але краще бігти з вовками, ніж бути вівцею."
NAV_happiness_servitude_tt:0 "Це приведе до шляху автономії, але ми залишимось частиною Легіону."

NAV_hopi_coal_mines:0 "Вугільні шахти хопі"
NAV_hopi_coal_mines_desc:0 "Хопі живуть на землях Народу, але стосунки були напруженими. Якщо ми хочемо повалити Легіон, мусимо об'єднатися. Почнімо з відновлення шахти в Каньєнті."

NAV_research_university:0 "Найстаріший коледж Пустки"
NAV_research_university_desc:0 "Коледж Діне — один з небагатьох навчальних закладів, що пережив Війну, і дає учням хоган замість хогану. Може, час відкрити двері для решти Пустки?"

NAV_the_ladder:0 "Велика Драбина"
NAV_the_ladder_desc:0 "Перед смертю в 1893 році, вождь Хастінн Ч’іл Хааджін відповів народу, який питав, як протистояти американцям. Він кинув пригорщу піску вгору: «Ось скільки їх. Ми не можемо битися, нас надто мало. Ми повинні боротися за наш народ через освіту. Вони мають адвокатів, лікарів і інженерів. Так ми переможемо. Ідіть і скажіть, що освіта — це драбина»."

NAV_women_warriors:0 "Жінки-воїни"
NAV_women_warriors_desc:0 "Жінки навахо служили в армії США ще до Великої Війни — і взяли до рук зброю після неї. Це дратує деяких легіонерів, але результат — не підлягає сумніву."

NAV_mormon_missionaries:0 "Шлях Ханаанців"
NAV_mormon_missionaries_desc:0 "Дехто з Народу навернувся до мормонства ще до Великої Війни, а мормонські фермери жили серед нас з XIX століття. Може, переймемо деякі їхні методи?"

NAV_hired_help:0 "Слуги для Народу"
NAV_hired_help_desc:0 "Хочемо ми того чи ні, але рабство — фундамент Пустки. Якщо ми поводитимемось із нашими слугами гуманно — чому б не платити тим же, як і нам?"

NAV_market_economy:0 "Ринкова економіка"
NAV_market_economy_desc:0 "Об'єднання південного заходу Америки Легіоном відкрило нові можливості для нашого бізнесу. Колись за кожним пагорбом ховалися рейдери, але там, де майорить прапор Бика — наш народ у безпеці та честі."

NAV_arms_shipments:0 "Постачання зброї"
NAV_arms_shipments_desc:0 "Дехто дурно вважає, що Легіон цурається будь-якої технології. Але є різниця між надмірною залежністю й корисним використанням. Майстерні Флагстаффа випускають найміцніше спорядження в Пустці — і ми скористаємось ним не гірше за будь-якого центуріона."

NAV_insurgencies:0 "Історія опору"
NAV_insurgencies_desc:0 "Народ навахо пережив анасазі, іспанців, мексиканців та американців. Ми не вижили після кінця Четвертого Світу, щоб схилити коліно перед Цезарем."

NAV_tribal_medicine:0 "Племінна медицина"
NAV_tribal_medicine_desc:0 "Наші цілителі знані по всьому південному заходу. Одні племена покладаються лише на трави й молитви, інші — лише на стимпаки. Ми ж знаємо: потрібне і те, й інше."

NAV_the_witch:0 "Жінка, Що Змінюється"
NAV_the_witch_desc:0 "За переказами, Ахсоннуті — Жінка Змін — створила людство зі старої шкіри й землі. Вона веде дівчат через становлення, старіє з порами року. [TTM.GetLeader] імітує її у багатьох рисах — можливо, ми зуміємо обдурити її, щоб допомогла нам."

NAV_black_mesa_hero:0 "Герой Блек-Меси"
NAV_black_mesa_hero_desc:0 "Відтоді як упали бомби, ґуль патрулює землі навколо Блек-Меси, захищаючи торгівців і Народ від усякого гніту. Може, він зможе кинути виклик і Легіону?"

NAV_wanamingo:0 "Ванамінґо"
NAV_wanamingo_desc:0 "Деякі мешканці Пустки вірять, що ми викликали ванамінґо у відповідь на Війну, в рамках 'Танців Примар' Ради Вогню. Це, звісно, міф. Але ці істоти мають чому навчити."

NAV_heavy_artillery:0 "Вогнева підтримка"
NAV_heavy_artillery_desc:0 "Цезар приніс вогонь цивілізації у Пустку. Час скористатися частиною того полум’я."

NAV_hogans:0 "Хоган — це серце"
NAV_hogans_desc:0 "Хоган — традиційне житло навахо, тепер означає наш дім загалом. Ми можемо використати прибутки від торгівлі, щоб відновити оселі нашого народу."

NAV_weaving:0 "Ткацтво навахо"
NAV_weaving_desc:0 "Ми тчемо бавовну вже тисячу років, і наш одяг носять по всій Пустці. Навіть Цезар не знайде кращої тканини."

NAV_legion_training:0 "Земля для себе"
NAV_legion_training_desc:0 "Колись Діне вільно блукали рідною землею, хранителі червоної землі та безкрайнього неба. Тепер ми пов’язані з Легіоном Цезаря, наші звичаї служать чужій імперії. Але служба породжує важелі, і з кожною битвою в ім’я Марса наші старійшини питають: чи не заслуговують вірні сини ходити землею своїх предків знову?"

NAV_join_great_confederation:0 "Приєднатися до Великої Конфедерації"
NAV_join_great_confederation_desc:0 "Велика Конфедерація в Юті пропонує нам дім — між імперіями Пустки."

NAV_join_daughters_of_hecate:0 "Приєднатися до Дочок Гекати"
NAV_join_daughters_of_hecate_desc:0 "Гнів Гекати буде нашим. Ми допоможемо їй зруйнувати Легіон!"

NAV_railroads:0 "Залізниця навахо"
NAV_railroads_desc:0 "Час відродити залізницю, що колись перетинала резервацію. Але цього разу вона не обмине нас. Ми станемо вузлом Легіону — й найзаможнішим краєм південного заходу."

NAV_reservation_system:0 "Система резервацій"
NAV_reservation_system_desc:0 "На південь від нас — [RES.GetName], загадкова громада ґулів у руїнах Лос-Аламоса. Ми обережно торгуємо з ними, але чи не час обрати інший підхід?"

NAV_expand_demand:0 "Зростаючий попит"
NAV_expand_demand_desc:0 "З якихось причин [RES.GetLeader] вимагає більше рабів і товарів. Ми добре заробляємо, але... що ж там насправді відбувається?"

NAV_invsetigate_slaves:0 "Що вони роблять з рабами?"
NAV_invsetigate_slaves_desc:0 "Хоча частина резервації радіоактивна, незрозуміло, чому раби заходять у [LOS.Capital.GetName] — і не повертаються. Наші розвідники хочуть це з’ясувати."

NAV_navajo_lets_make_a_deal:0 "Повага новому племені"
NAV_navajo_lets_make_a_deal_desc:0 "Чому ми маємо засуджувати методи [RES.GetLeader]? Він дбає про свій Народ — так само як [NAV.GetLeader] про наш."

NAV_navajo_no_ghouls:0 "Більше ніяких резервацій"
NAV_navajo_no_ghouls_desc:0 "Досвід Народу навчив нас боятись тих, хто хоче 'очистити' землю від 'сміття'. Ми зробимо так, щоб ця була остання резервація."

NAV_the_fate_of_the_ghouls:0 "Доля Резервації"
NAV_the_fate_of_the_ghouls_desc:0 "Після завоювання резервації ґулі, які пригнічували людей, тепер самі служитимуть новим володарям."

NAV_profits_of_trade:0 "Стародавні таємниці"
NAV_profits_of_trade_desc:0 "Деякі ґулі пережили ще Війну. З поглибленням наших відносин вони починають ділитися своїми знаннями."

NAV_tribals_vs_settlers:0 "Пам’ятаєте, як нас називали дикунами?"
NAV_tribals_vs_settlers_desc:0 "Навахо — не єдині, хто пережив Війну майже без втрат. Якеми живуть у східному Вашингтоні, юїнта володіють землями в Юті, а черокі... ну, про них ми не говоримо. Кожен — інший народ, але кожен пам’ятає: це не їхні предки кидали бомби."
NAV_tribals_vs_settlers_tt:0 "§Y[NAV.GetNameWithFlag]§! отримає модифікатор відносин з усіма іншими тубільними фракціями на мапі — і навпаки."

NAV_ute_trade:0 "Торгівля з юїнта"
NAV_ute_trade_desc:0 "Резервація юїнта — дім народу ютів уже понад чотири століття. Вони пропонують набагато вигідніші умови торгівлі, ніж купці з Нового Ханаану."

NAV_shoshone:0 "Злетіти в небо"
NAV_shoshone_desc:0 "Шошони контролюють північний та південний Айдахо завдяки старій авіабазі Хот-Спрінґс. Можливо, вони дозволять нам оглянути уламки?"

NAV_mesa_verde:0 "Повернути Месу"
NAV_mesa_verde_desc:0 "Кіфри таборуються в Меса-Верде, ставлячись до священного місця корінних народів як до свого. Але, можливо, ми зможемо використати їх, адже вони прикрашають свої домівки забутими схемами електроніки, як сакральним мистецтвом."

NAV_indian_outlaw:0 "Як індіанський вигнанець"
NAV_indian_outlaw_desc:0 "Я індіанський вигнанець, наполовину черокі, наполовину чокто, моя дівчина — чиппева, вона така одна."

NAV_yakama:0 "Поки росте трава"
NAV_yakama_desc:0 "Вони казали, що навіки це буде індіанська земля,\nПоки місяць з’являється в небі,\nАле на резервації панує смуток,\nДоговір із Вашингтоном порушено, і немає жодної надії..."

NAV_mesa_verde_2:0 "Доля Кіфрів"
NAV_mesa_verde_2_desc:0 "Загадку кіфрів розв’язано, і розвідники навахо знову патрулюють Меса-Верде. Але тепер ми маємо вирішити, що з ними робити."

NAV_handle_the_foragers:0 "Угамувати Збирачів"
NAV_handle_the_foragers_desc:0 "Збирачі — це натовп колишніх ув'язнених, які блукають землями Колорадо. Вони мали би роздерти Місто Псів, але після поразки від Хендогів вони націлились на наші землі. Ми мусимо якнайшвидше зайняти ті території."

NAV_handle_the_foragers_2:0 "Нове керівництво"
NAV_handle_the_foragers_2_desc:0 "Збирачі протримались завдяки підтримці караванних компаній з Каліфорнії. Можливо, ми використаємо це як плацдарм у Колорадо."

NAV_stop_the_train:0 "Зупиніть потяг!"
NAV_stop_the_train_desc:0 "Плем’я Залізних Колій мандрує рейками довоєнної залізниці в ручних візках. Хоча історично навахо не жили на заході Колорадо, це легко змінити."

NAV_dinetah_1:0 "Мрія про Дінетах"
NAV_dinetah_1_desc:0 "Дінетах — традиційна батьківщина нашого народу. Ми колись панували над Ютою, Арізоною та Колорадо, землею між чотирма горами: Сіс Наажіні, Тсоодзіл, Дукошії й Дібé Нітсаа. Час повернути собі країну."

NAV_skinwalkers:0 "Наалдлоші"
NAV_skinwalkers_desc:0 "Ми розповідаємо про істот, що спотворюють магію, змінюючи форму. Але в цьому спотвореному світі ми прийняли їхню подобу, щоб лякати ворогів. Он той койот у кущах? Краще, щоб так..."

NAV_iron_alliance:0 "Найняти Залізний Альянс"
NAV_iron_alliance_desc:0 "Найманці Залізного Альянсу продадуть навіть рідну матір за правильну ціну. Добре, що ми можемо її запропонувати."
NAV_iron_alliance_tt:0 "Розблокує можливість наймати §Oсилові підрозділи§! з §O[IRN.GetNameWithFlag]§! у війні."
NAV_iron_alliance_oob_tt:0 "Одна дивізія найманців із §O[IRN.GetNameWithFlag]§! прибуде до служби."

NAV_love_robot_city:0 "Шукаємо любов"
NAV_love_robot_city_desc:0 "Ми можемо відправити експедицію до Міста Роботів, щоб добути залишки довоєнних технологій. А можливо, й зустріти когось, хто справді нас розуміє."

NAV_bomb_space_station:0 "Бомба з орбіти"
NAV_bomb_space_station_desc:0 "Тридцять років тому США подарували нам прощальний дар — уламки космічної станції, що впали на резервацію. Дещо з них досі має цінність!"

NAV_bust_the_armour_open:0 "Подивіться, як я вбиваю бога"
NAV_bust_the_armour_open_desc:0 "Дехто називає Цезаря Цетагоцилталі — Той, Хто Штовхає Людей з Обриву. Він пожирав Арізону й Нью-Мексико, висмоктуючи багатства й людей у свою імперську мрію. Час покласти цьому край."
NAV_bust_the_armour_open_desc_tt:0 "Отримаєте ціль війни проти Цезаря й вийдете з-під його контролю... але [CES.GetLeader] буде дуже незадоволений!"

ces_fighting_tt:0 "Ваш §YОпір§! має перевищувати §YЛояльність§!."

NAV_chinle:0 "Витік вод"
NAV_chinle_desc:0 "Чинлі — місце, де вода тече з Каньйону де Шей, залишається домом навахо, хоч і під прямим правлінням Цезаря. Чи не час повернути його до нашої родини?"

NAV_territory_tt:0 "Якщо §Y[CES.GetLeader]§! відмовить нам — рівень опору зросте."

NAV_red_mesa:0 "Червона Меса"
NAV_red_mesa_desc:0 "Червона Меса колись належала навахо. Попросімо її назад."

nav_colorado:0 "До Колорадо"
nav_colorado_desc:0 "Хоча навахо не жили вздовж річки Колорадо, ніщо не заважає нам змінити це."

NAV_true_friend:0 "Від клієнта до Ак’іс"
NAV_true_friend_desc:0 "Наша лояльність Легіону дала плоди. Хоч ми ще формально підвладні Легіону, насправді ми рівня Цезарю."
ces_true_friend_tt:0 "Ваша §YЛояльність§! має перевищувати §YОпір§!."

NAV_train_anywhere:0 "Розібрати потяги"
NAV_train_anywhere_desc:0 "Пустка не витримує континентальну залізницю. То чому б не перетворити депо на металобрухт?"

NAV_fifth_world:0 "П’ятий Світ"
NAV_fifth_world_desc:0 "Звільнившись від Легіону, ми приймаємо правду — це П’ятий Світ, час оновлення й розплати. Ми понесемо бачення тим, хто шукає мету в цьому новому світі."
NAV_generic_invite_tt:0 "Розблокує §Yповторюване рішення§! для запрошення сусідніх країн §YЗахідного Узбережжя§! до §YП’ятого Світу§!."
NAV_generic_invite:0 "Запросити §Y[FROM.GetNameWithFlag]§! до §Y$fifth_world$§!"