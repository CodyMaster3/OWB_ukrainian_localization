l_english:
generic_alaska.0.t:0 "Експедиція до Аляски"
generic_alaska.0.d:0 "Ми вирішили вирушити в експедицію до далеких земель Аляски. Гори Аляски зберігають багато довоєнних технологій і озброєння, але вони сповнені й небезпек. Тепер нам слід визначити розмір експедиції. Більша експедиція матиме вищі шанси на успіх, але й більші втрати у разі провалу."
generic_alaska.0.a:0 "Ми відправимо 50 людей."
generic_alaska.0.b:0 "Ми відправимо 100 людей."
generic_alaska.0.c:0 "Ми відправимо 175 людей."
generic_alaska.0.e:0 "Скасувати експедицію."

generic_alaska.1.t:0 "Експедиція розпочата"
generic_alaska.1.d:0 "Усі останні приготування завершені, й наша експедиція розпочалася. Пройде певний час, перш ніж вона повернеться."
generic_alaska.1.a:0 ""

generic_alaska.2.t:0 "Експедиція повертається"
generic_alaska.2.d:0 "Наша експедиція повернулася. Хоч ми й втратили частину її складу й не знайшли нічого особливо цінного, ми здобули цінні знання у сфері ведення бойових дій."
generic_alaska.2.a:0 ""

generic_alaska.3.t:0 "Експедиція повертається"
generic_alaska.3.d:0 "Наша експедиція повернулася. Вцілілі члени привезли з собою знання про довоєнну тактику та стратегії, які легко адаптувати для наших сухопутних військ."
generic_alaska.3.a:0 ""

generic_alaska.4.t:0 "Експедиція повертається"
generic_alaska.4.d:0 "Наша експедиція повернулася. У покинутих сховищах Аляски ми знайшли великі запаси довоєнної лазерної зброї. Цю зброю можна легко відремонтувати й переобладнати для наших військ."
generic_alaska.4.a:0 ""

generic_alaska.5.t:0 "Експедиція повертається"
generic_alaska.5.d:0 "Наша експедиція повернулася. Вона виявилася надзвичайно успішною — більшість учасників повернулася живими, і вони привезли із собою велику кількість передових довоєнних технологій, які ми можемо використати у виробництві."
generic_alaska.5.a:0 ""
