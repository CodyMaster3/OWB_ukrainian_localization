l_english:
  lurk_land_of_coral:0 "Коралова земля"
  lurk_land_of_coral_desc:0 "Ми впровадили дари моря в кожен аспект життя племені. Наші домівки зроблені з коралів. Наші інструменти зроблені з коралів. Найвідданіші з нас носять корали. Ми — народ коралів, так само як і народ М'лулу."
  lurk_shelled_warriors_1:0 "Панцирні воїни"
  lurk_shelled_warriors_1_desc:0 "Панцирі дітей М'лулу захищають наших воїнів у бою. Навіть після смерті вони продовжують служити."
  lurk_shelled_warriors_2:0 "Панцирні воїни"
  lurk_shelled_warriors_2_desc:0 "Панцирі дітей М'лулу захищають наших воїнів у бою. Навіть після смерті вони продовжують служити."
  lurk_shelled_warriors_3:0 "Панцирні воїни"
  lurk_shelled_warriors_3_desc:0 "Панцирі дітей М'лулу захищають наших воїнів у бою. Навіть після смерті вони продовжують служити."
  lurk_sharpened_conch_knives:0 "Загострені ножі з мушель"
  lurk_sharpened_conch_knives_desc:0 "Ми навчилися в наших побратимів із клешнями, і прагнемо наслідувати силу їхніх великих м'ясистих знарядь війни."
  lurk_hardened_shell_shields:0 "Загартовані панцирні щити"
  lurk_hardened_shell_shields_desc:0 "Ми навчилися в наших панцирних побратимів, і їхня здатність захищатися за будь-яких обставин — це те, що ми маємо спробувати наслідувати."
  mlt_egg_counter:0 "Яйця: [?MLT.mlt_eggs]"
  mlt_egg_counter_desc:0 "Нинішня кладка яєць М'лулу.\nІноді вони ворушаться всередині. Вони, мабуть, скоро вилупляться."
  mire_the_coral_court:0 "Кораловий Двір"
  mire_the_coral_court_desc:0 "Кораловий Двір — це група оракулів, пророків та жерців, які доглядають за М'лулу і захищають її від зовнішніх загроз. Вони в усіх сенсах керують долею Племені Болотників.\n[DIS.GetAdjective] Багряного Чоловіка були визнані єретиками Кораловим Двором, коли відмовилися дотримуватися їхніх вірувань. Тому їх вигнали на південь."
  lake_disciples_of_the_ruddy_man:0 "Апостоли Багряного Чоловіка"
  lake_disciples_of_the_ruddy_man_desc:0 "[DIS.GetAdjective] вірять у те, що Багряний Чоловік — стародавній герой, який навчив знедолених Дедвуда виживати в пустці, не був богом як таким, але його вчинки роблять його гідним шанування, подібно до святих у католицькій вірі.\nЦі ідеї вважаються єретичними Кораловим Двором Племені Болотників, який вважає, що Багряний Чоловік був справжнім богом, і його нащадкам слід поклонятися як божествам."
  lake_wounds_from_the_bonepicker_war:0 "Рани від Війни Кісткозбирачів"
  lake_wounds_from_the_bonepicker_war_desc:0 "Після вигнання з Племені Болотників на півночі, [DIS.GetAdjective] Багряного Чоловіка довелося вести п'ятирічну війну, щоб пробитися через долину Камас до Даймонд-Пік. Багато хто в племені досі виснажений цим довгим і затяжним конфліктом."
  lake_recovering_from_the_bonepicker_war:0 "Відновлення після Війни Кісткозбирачів"
  lake_recovering_from_the_bonepicker_war_desc:0 "Після вигнання з Племені Болотників на півночі, [DIS.GetAdjective] Багряного Чоловіка довелося вести п'ятирічну війну, щоб пробитися через долину Камас до Даймонд-Пік. Плем'я докладає зусиль, щоб залікувати ці рани і повести своїх людей у майбутнє."
