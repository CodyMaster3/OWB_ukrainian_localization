l_english:

#NCR
ncr_puppet_bear_victorious:0 "Переможний Ведмідь"
ncr_puppet_bear_victorious_desc:0 "Незважаючи на всі зусилля нашого народу, Нова Каліфорнійська Республіка здолала нас..."

ncr_puppet_capital_siege:0 "Облога [Root.Capital.GetName]"
ncr_puppet_capital_siege_desc:0 "Облога [Root.Capital.GetName] була однією з останніх битв у нашій війні проти НКР. Очевидно, ми програли."

ncr_puppet_ncrta:0 "Територіальна Адміністрація НКР"
ncr_puppet_ncrta_desc:0 "Територіальна Адміністрація НКР — це орган НКР, який закріпився в нашій державі, принаймні на даний час."

ncr_puppet_stability_buff:0 "Заміна політиків"
ncr_puppet_stability_buff_desc:0 "Деякі з наших старих лідерів не зовсім відповідають нашим новим каліфорнійським цінностям. Ми повинні спонукати їх піти у відставку і переконатися, що їхні місця займуть лояльні люди."

ncr_puppet_war_support_buff:0 "Заохочення мілітаризму"
ncr_puppet_war_support_buff_desc:0 "Як сказав один мудрець, перш ніж його вбили на війні: 'Дайте війні шанс!'"

ncr_puppet_subduing_warchiefs:0 "Упокорення бойових загонів"
ncr_puppet_subduing_warchiefs_desc:0 "Хоча ми й умиротворили більшу частину регіону, решта рейдерів ще не усвідомила своєї нової долі. Зробивши показовий приклад з найбільш бунтівних вождів, ми зможемо переконати решту рейдерів мирно інтегруватися."

ncr_puppet_taking_skulls_off_sticks:0 "Зняття черепів з палиць"
ncr_puppet_taking_skulls_off_sticks_desc:0 "Перетворити рейдерів на законослухняних громадян — завдання не з легких, і цей процес має охопити всі сфери суспільства. Демонтувавши різноманітні криваві пам'ятники насильству, зведені в регіоні, ми сподіваємося вгамувати жагу до крові в наших нових підданих."

ncr_puppet_freeing_slaves:0 "Звільнення рабів"
ncr_puppet_freeing_slaves_desc:0 "Рабство — огидно поширене явище в пустці. Тепер, коли ми навели лад у регіоні, звільнивши полонених невинних людей, які були поневолені рейдерами, ми зможемо завоювати лояльність значної частини наших громадян."

ncr_puppet_tribal_talks:0 "Переговори з племенами"
ncr_puppet_tribal_talks_desc:0 "Хоча дикуни пустки можуть бути нецивілізованими, негігієнічними і взагалі жалюгідними, вони все ж здатні прислухатися до голосу розуму. Вступивши в дискусію зі старійшинами громади, можна забезпечити мирний перехід до сучасності."

ncr_puppet_introduce_modernity:0 "Впровадження сучасності"
ncr_puppet_introduce_modernity_desc:0 "Ізоляція племен пустки може бути їхньою безпекою, але це також означає, що їм гостро бракує сучасних зручностей. Простий спосіб заручитися підтримкою серед місцевих жителів — розпочати новий інфраструктурний проєкт для сприяння розвитку регіону."

ncr_puppet_dispelling_myths:0 "Розвінчання міфів"
ncr_puppet_dispelling_myths_desc:0 "Скільки б доріг ми не побудували чи колодязів не викопали, зрештою, найбільшою перешкодою для просвітництва тубільців є вони самі. Якщо ми зможемо забезпечити племенам належну освіту, ми, сподіваємося, розвінчаємо їхні найбільш невіглаські переконання."

ncr_puppet_community_leaders:0 "Залучення громади"
ncr_puppet_community_leaders_desc:0 "Стати частиною чогось більшого — це завжди невизначена перспектива, і не всі мають високу думку про НКР. Якщо ми хочемо повністю інкорпорувати наш новий штат, нам потрібно довести свою зацікавленість у розвитку громади та вжити кроків для її зростання."

ncr_puppet_introduce_law:0 "Впровадження законів НКР"
ncr_puppet_introduce_law_desc:0 "Пустка — це місце беззаконня, як і на Старому Заході, сила занадто часто встановлює право на кордонах. НКР несе порядок, і запровадивши та забезпечивши виконання нашого кодексу законів у суспільстві, ми зможемо довести це твердження."

ncr_puppet_taxes_for_infrastructure:0 "Податки на інфраструктуру"
ncr_puppet_taxes_for_infrastructure_desc:0 "Свобода не дається задарма, як і, на жаль, дороги. Щоб краще інтегрувати прикордонні штати в республіку, ми використаємо наших нових платників податків для фінансування інфраструктури в регіоні."

ncr_puppet_ncr_state:0 "Новий штат НКР"
ncr_puppet_ncr_state_desc:0 "Промисловість процвітає, культура розвивається, люди рідше помирають і загалом стають ввічливішими. У НКР з'явився новий лояльний штат, і все це завдяки працьовитим чоловікам і жінкам з Територіальної Адміністрації."

NCR_puppet_military_rule:0 "Військове командування"
NCR_puppet_military_rule_desc:0 "З моменту нашого прибуття ми зазнали численних нападів і сутичок зі злочинними угрупованнями. Це неприйнятно, і з отриманням дозволу Територіальна Адміністрація буде замінена групою перспективних генералів і солдатів."

ncr_puppet_ncr_draft:0 "Призов до НКР"
ncr_puppet_ncr_draft_desc:0 "Тепер, коли ми завоювали серця та уми людей, ми повинні їх захистити. Свіжі новобранці, які патрулюватимуть регіон, зміцнять безпеку та патріотизм у нашому новому штаті. Вони робитимуть це не лише заради нас, а й заради себе."

NCR_puppet_expeditionary_control:0 "Експедиційний контроль"
NCR_puppet_expeditionary_control_desc:0 "Замість того, щоб безпосередньо керувати цією новою територією, ми можемо дозволити цим людям самим управляти собою, поки ми будемо спостерігати за ними, надаючи вказівки та допомогу."

NCR_puppet_scavenging_the_battlefield:0 "Збирання трофеїв на полі бою"
NCR_puppet_scavenging_the_battlefield_desc:0 "Наші нещодавні конфлікти залишили величезні поля з брухтом, деталями та зброєю, яку ми можемо полагодити. Краще ми доберемося до них першими, перш ніж сміттярі та інші групи обчистять усе під нуль."


NCR_puppet_territorial_administration_leadership:0 "Територіальна Адміністрація"
NCR_puppet_territorial_administration_leadership_desc:0 "Оскільки місцеві жителі дещо вагаються щодо нашого прийняття, необхідно докласти зусиль, щоб завоювати їхню довіру. Треба роздати їжу та відновити ополчення."

NCR_puppet_propaganda_posters:0 "Пропагандистські плакати"
NCR_puppet_propaganda_posters_desc:0 "Щоб повністю гарантувати довіру і змусити їх прийняти нас, ми повинні почати поширювати пропаганду, яка зблизить їх з нами. Чи це обман? Так, але це жертва, на яку готова піти Т.А."

NCR_puppet_baron_expansion:0 "Барони"
NCR_puppet_baron_expansion_desc:0 "Ця територія дозріла для експлуатації. Не лише в сільському господарстві, а й у виробничому плані. Ми зможемо перетворити цей штат на виробничий центр і зробити НКР щасливою."

NCR_puppet_new_farms:0 "Нові ферми"
NCR_puppet_new_farms_desc:0 "Тепер, коли ми влаштувалися, ми повинні експлуатувати цю територію якомога більше. Почнемо з того, щоб нагодувати людей і посадити величезну кількість товарних культур."


NCR_puppet_new_trooper_standards:0 "Нові стандарти для бійців"
NCR_puppet_new_trooper_standards_desc:0 "З нашим прибуттям у регіон нам було доручено запровадити нові військові стандарти: нову уніформу для нашої адміністрації, нову зброю тощо. Ми маємо переконатися, що наші сили можуть стояти пліч-о-пліч із силами Каліфорнії."

NCR_puppet_pacification:0 "Умиротворення територій"
NCR_puppet_pacification_desc:0 "Щоб захистити інтереси уряду Каліфорнії, ми повинні знищити банди рейдерів з усією силою, яку ми маємо. І не тільки рейдерів, а й пазурів смерті, і болотників теж!"


NCR_puppet_working_with_locals:0 "Робота з місцевими"
NCR_puppet_working_with_locals_desc:0 "Місцеві зацікавлені в тому, щоб розчистити старе покинуте місто і використати цей простір у майбутньому для будівництва заводів. Ми допоможемо їм у цьому як для отримання важелів впливу, так і для забезпечення їхньої лояльності."

NCR_puppet_increasing_taxes:0 "Підвищення податків"
NCR_puppet_increasing_taxes_desc:0 "Нам потрібні гроші для фінансування наших операцій у штаті, а гроші, на жаль, з неба не падають. Доведеться залізти в кишені місцевих, але з огляду на ту добру волю, яку ми заслужили, вони не будуть занадто заперечувати."


NCR_puppet_bringing_in_followers:0 "Залучення Послідовників"
NCR_puppet_bringing_in_followers_desc:0 "Ми повинні максимально допомагати місцевим, і Послідовники зроблять це для нас за невелику плату. Ми надамо їм приміщення та ресурси, необхідні для того, щоб вони облаштувалися і почали допомагати людям."

NCR_puppet_closer_to_california:0 "Ближче до Каліфорнії"
NCR_puppet_closer_to_california_desc:0 "Ми все більше і більше інтегруємося в політичну систему Республіки, і багатьом місцевим судилося стати чудовими громадянами."


NCR_puppet_new_quotas:0 "Нові квоти"
NCR_puppet_new_quotas_desc:0 "З кожним тижнем уряд Каліфорнії все більше тисне на нас: їм потрібно все більше і більше наших цінних ресурсів. Давайте прискоримо процес."

NCR_puppet_worker_encouragement:0 "Заохочення робітників"
NCR_puppet_worker_encouragement_desc:0 "Немає більшої нагороди, ніж кришки в кишенях і заохочення за добре виконану роботу. Наразі давайте дамо їм наше найкраще заохочення, і вони продовжуватимуть працювати!"


NCR_puppet_extra_tools:0 "Додаткові інструменти"
NCR_puppet_extra_tools_desc:0 "Щоб збільшити обсяги виробництва, ми повинні мати краще обладнання для допомоги нашим робітникам."

NCR_puppet_new_workshops:0 "Нові майстерні"
NCR_puppet_new_workshops_desc:0 "Завдяки найму багатьох робітників та придбанню передового обладнання ми нарешті можемо отримати нові майстерні, надані урядом Каліфорнії."

ncr_puppet_settler_expanding_production:0 "Початок виробництва техніки"
ncr_puppet_settler_expanding_production_desc:0 "Як штат-член НКР, наш новий обов'язок — виробляти для них транспортні засоби. Роблячи це, ми з часом зможемо сформувати власні моторизовані підрозділи."

ncr_puppet_settler_gunrunner_facilities:0 "Відновлення гаражів"
ncr_puppet_settler_gunrunner_facilities_desc:0 "Щоб заповнити прогалини у виробництві, нам доведеться розчистити кілька старих гаражів і переобладнати їх, щоб мати можливість виробляти і ремонтувати наші численні транспортні засоби."

ncr_puppet_settler_hiring_experts:0 "Найняти експертів Хайвейменів"
ncr_puppet_settler_hiring_experts_desc:0 "Дорожні бандити з пустки, хоч і дуже дратують, можуть виявитися дуже корисними, коли справа доходить до вивчення транспортних засобів. Ми зв'яжемося з кількома колишніми розбійниками і отримаємо їхні поради, або в найгіршому випадку змусимо їх розплатитися за свої минулі злочини."

NCR_puppet_arms_for_the_troops:0 "Зброя для військ"
NCR_puppet_arms_for_the_troops_desc:0 "Ми не можемо дозволити нашим збройним силам сидіти в логістичному вакуумі, як це роблять багато армій у Пустці. Наші солдати будуть екіпіровані та готові."

NCR_puppet_gunrunner_strongholds:0 "Опорні пункти Зброярів"
NCR_puppet_gunrunner_strongholds_desc:0 "Майстерні Зброярів — необхідна річ для військового підрозділу, і нам пощастило мати можливість користуватися ними."

ncr_puppet_settler_supporting_the_ncr:0 "Підтримка НКР"
ncr_puppet_settler_supporting_the_ncr_desc:0 "У боротьбі за демократію НКР є лідером. Ми повинні надати їй повну підтримку і забезпечити її зброєю."

ncr_puppet_settler_sending_recruits_to_the_ncr:0 "Відправлення рекрутів і бюрократів до НКР"
ncr_puppet_settler_sending_recruits_to_the_ncr_desc:0 "Наша підтримка не обмежується постачанням зброї, ми маємо відправити наших братів боротися за свободу і демократію, а наших бюрократів — працювати до смерті. Їх все одно ніхто не любить."

ncr_puppet_settler_paying_our_dues:0 "Сплата наших боргів"
ncr_puppet_settler_paying_our_dues_desc:0 "Ми багато чим завдячуємо Республіці. Без неї у нас не було б свободи і безпеки. Ми завдячуємо їй усім."

ncr_puppet_settler_raising_forces:0 "Збір сил"
ncr_puppet_settler_raising_forces_desc:0 "Всі ці зусилля, чи то промислові, чи цивільні, чи військові, не були марними. Ми створюємо реальну силу, здатну прийти на допомогу Республіці в будь-який час, а також захистити нас самих."

ncr_puppet_tribal_sending_our_strongest:0 "Відправка наших найсильніших"
ncr_puppet_tribal_sending_our_strongest_desc:0 "Наші найсильніші воїни стали б у пригоді НКР, де вони змогли б отримати набагато кращий рівень підготовки. Давайте відправимо 400 з них до Каліфорнії."

ncr_puppet_tribal_new_training_regiments:0 "Новий режим тренувань"
ncr_puppet_tribal_new_training_regiments_desc:0 "Наші війська не відповідають стандартам НКР, ми повинні виправити цю ситуацію. Будуть залучені інструктори НКР, щоб гарантувати, що наші люди на належному рівні."

ncr_puppet_tribal_getting_combat_experience:0 "Здобуття бойового досвіду"
ncr_puppet_tribal_getting_combat_experience_desc:0 "Наші сили повинні здобути досвід у боях, якщо ми хочемо ефективно протистояти нашим ворогам. Добровольців буде достатньо."

ncr_puppet_tribal_improving_our_diets:0 "Покращення нашого раціону"
ncr_puppet_tribal_improving_our_diets_desc:0 "Якщо ми хочемо виховати сильних воїнів і сильний народ, ми повинні покращити свій раціон."

ncr_puppet_tribal_trials_for_our_warriors:0 "Випробування для наших воїнів"
ncr_puppet_tribal_trials_for_our_warriors_desc:0 "Ким були б наші воїни, якби ми не піддавали їх випробуванням?"

ncr_puppet_tribal_expanding_our_forces:0 "Розширення наших сил"
ncr_puppet_tribal_expanding_our_forces_desc:0 "Ми повинні розширювати нашу військову міць, якщо хочемо довести свою користь для НКР."

ncr_puppet_tribal_a_tithe_to_california:0 "Десятина для Каліфорнії"
ncr_puppet_tribal_a_tithe_to_california_desc:0 "Настав час відплатити Каліфорнії за її допомогу, і тому ми надішлемо їм 10% наших кришок."

ncr_puppet_raider_keep_up_the_assault:0 "Продовжуйте штурм"
ncr_puppet_raider_keep_up_the_assault_desc:0 "Стережіться тих ракетометів! Продовжуємо, хлопці! Вперед, ні кроку назад!"

ncr_puppet_raider_piercing_our_foes:0 "Пробиваючи наших ворогів"
ncr_puppet_raider_piercing_our_foes_desc:0 "Відміна, відміна! Ціль не отримала жодних ушкоджень! Ми зробимо з цього висновки і подбаємо, щоб наступний постріл пробив їх!"

ncr_puppet_raider_gains_from_shock_troops:0 "Здобутки ударних військ"
ncr_puppet_raider_gains_from_shock_troops_desc:0 "Наші ударні війська — одні з найкращих у пустці, без жодних суперечок. Звичайно, вони не вміють добре захищатися, але ж це не робота ударних загонів, чи не так?"

ncr_puppet_raider_bringing_in_ranger_trainers:0 "Залучення інструкторів-рейнджерів"
ncr_puppet_raider_bringing_in_ranger_trainers_desc:0 "...Коли він спробував змагатися з армією, у якої був Тренер на боці!..."

ncr_puppet_raider_discipline_and_honor:0 "Дисципліна і Честь"
ncr_puppet_raider_discipline_and_honor_desc:0 "Смерть перед безчестям, як каже стара приказка."

ncr_puppet_raider_duty_to_the_ncr:0 "Обов'язок перед НКР"
ncr_puppet_raider_duty_to_the_ncr_desc:0 "Служити — це наш Обов'язок!"

ncr_puppet_raider_establish_ranger_units:0 "Створення підрозділів рейнджерів"
ncr_puppet_raider_establish_ranger_units_desc:0 "Ніхто не зв'язується з рейнджерами, то чому б не виховати власних? Чудова ідея!"

##RRG

rrg_puppet_matador_and_bull:0 "Переможна Республіка"
rrg_puppet_matador_and_bull_desc:0 "Після нашої принизливої поразки ми тепер є громадянами Республіки Ріо-Гранде. Хоча їхні ідеали нам чужі, вони здаються доброзичливими."

rrg_puppet_capital_treaty:0 "Договір у [Root.Capital.GetName]"
rrg_puppet_capital_treaty_desc:0 "Договір у [Root.Capital.GetName] визначив умови нашого підпорядкування."

rrg_puppet_building_the_estado:0 "Розбудова Естадо"
rrg_puppet_building_the_estado_desc:0 "Кожна територія Республіки має свою мету. Тепер ми повинні обрати свою."

rrg_puppet_dantes_vision:0 "Величне бачення"
rrg_puppet_dantes_vision_desc:0 "Ми більше не пов'язані старими ідеалами. Наш народ тепер служитиме вищій меті, досягаючи нових висот щодня."

rrg_puppet_mutual_trade:0 "Угоди про взаємну торгівлю"
rrg_puppet_mutual_trade_desc:0 "Республіка Ріо-Гранде не побудована на грабунку. Замість того, щоб розграбовувати наші землі, як це роблять інші, вони створять у нас мануфактури і прокладуть нові торгові шляхи, що принесе користь обом країнам."

rrg_puppet_economic_support:0 "Економічна підтримка"
rrg_puppet_economic_support_desc:0 "Наша поразка призвела до загибелі багатьох наших людей і краху економіки. Настав час для відбудови."

rrg_puppet_the_new_ranch_model:0 "Нова модель ранчо"
rrg_puppet_the_new_ranch_model_desc:0 "Республіка вирішила свою продовольчу проблему, створивши ранчо, де вирощують зернові та розводять брамінів. Ми переймемо цю модель виробництва. Ми зможемо експортувати надлишки, що дозволить нам вивозити більше товарів."

rrg_puppet_moras_rule:0 "Тверда рука"
rrg_puppet_moras_rule_desc:0 "Під пильним наглядом Мори вся наша торгівля буде контролюватися Республікою, що гарантує їй більшу частину нашого прибутку."

rrg_puppet_resource_extraction:0 "Видобуток ресурсів"
rrg_puppet_resource_extraction_desc:0 "На наших землях було багато ресурсів, до яких ми не мали доступу. Завдяки тому, що Республіка надає нам необхідне обладнання, ми можемо відкрити нові шахти і отримати доступ до водоймищ, що раніше вважалося надто дорогим."

rrg_puppet_colonial_conscription:0 "Територіальний призов"
rrg_puppet_colonial_conscription_desc:0 "Ми перебуваємо під захистом Армії Республіки, що складається з призовників. Проте ми не можемо очікувати на захист, не роблячи свого внеску у військові зусилля. Виконуючи наш мандат, ми відправимо наших призовників на навчання до Глорії."

rrg_puppet_for_the_good_of_the_republic:0 "На благо Республіки"
rrg_puppet_for_the_good_of_the_republic_desc:0 "Очікується, що кожна територія Республіки робитиме внесок на її благо, навіть якщо це означає, що ми мусимо жертвувати своїм життям і працею заради Глорії."

rrg_puppet_rosados_ideas:0 "Блискучий розум"
rrg_puppet_rosados_ideas_desc:0 "Ми мали честь приймати у себе саму Валентину Росадо. Багато наших дослідників були вражені і натхненні її генієм. Її вчення дуже допомогли нашому науковому методу."

rrg_puppet_the_best_and_the_brightest:0 "Найкращі та найяскравіші"
rrg_puppet_the_best_and_the_brightest_desc:0 "З оновленим запалом до досліджень наші найкращі та найсвітліші розуми тепер делеговані на виконання дослідницьких завдань."

rrg_puppet_robotic_hands_make_light_work:0 "Роботизовані руки полегшують роботу"
rrg_puppet_robotic_hands_make_light_work_desc:0 "Завдяки кресленням, якими з нами поділилася Республіка, ми більше не обмежені людською робочою силою. Тепер ми можемо створювати роботів для виконання наших наказів."

rrg_puppet_join_the_NIPT:0 "Приєднатися до N.I.P.T."
rrg_puppet_join_the_NIPT_desc:0 "Незважаючи на весь наш технологічний прогрес, наші технології не можуть зрівнятися з Республікою. Однак нам не потрібно винаходити колесо, оскільки ми завжди можемо приєднатися до програми технологічної співпраці N.I.P.T. від Глорії."

rrg_puppet_defense_of_the_state:0 "Оборона штату"
rrg_puppet_defense_of_the_state_desc:0 "Республіка запропонувала профінансувати реконструкцію нашої оборони. Ми повинні скористатися цим."

rrg_puppet_border_patrols:0 "Прикордонні патрулі"
rrg_puppet_border_patrols_desc:0 "Наші призовники повернулися з Глорії як прикордонний патруль. Ми більше не покладаємося на Армію Республіки для захисту наших кордонів."

rrg_puppet_red_flags_for_the_bull:0 "Червоні прапорці для Бика"
rrg_puppet_red_flags_for_the_bull_desc:0 "Після нашої важкої поразки наш народ дуже боїться нового конфлікту. Ми повинні це виправити."

rrg_puppet_invite_the_reclamation_bureau:0 "Запросити Бюро Відновлення"
rrg_puppet_invite_the_reclamation_bureau_desc:0 "Створене для відновлення будівель старого світу, Бюро Відновлення повернуло багатьом покинутим будівлям у Північній Мексиці їхню колишню славу. Дозвіл Бюро Відновлення працювати на наших землях відкриє для нас нові простори для розширення."

rrg_puppet_texan_arms_investment:0 "Інвестиції техаських зброярів"
rrg_puppet_texan_arms_investment_desc:0 "Техасці — не лише майстри збройової справи, а й майстри торгівлі. Вони створять у нас нові майстерні, що збільшить обсяги нашого військового виробництва."

rrg_puppet_el_nuevo_estado:0 "El Nuevo Estado"
rrg_puppet_el_nuevo_estado_desc:0 "Тепер ми справді частина Республіки Ріо-Гранде. Siempre Libre!"

### CES

ces_puppet_bull_victorious:0 "Переможний Бик"
ces_puppet_bull_victorious_desc:0 "Ми не змогли їх зупинити. Ми зазнали поразки. Вони налетіли, як грім, і вирізали нас, наче худобу. Посадили наших жінок і дітей у клітки, мобілізували здорових чоловіків, покалічили і вбили немічних. Роки і роки культури та історії знищені. Як це сталося?"

ces_puppet_capital_siege:0 "Спалення [Root.Capital.GetName]"
ces_puppet_capital_siege_desc:0 "Цезар хотів показати приклад. Після падіння нашої імперії він привів свою армію аж до нашої столиці. Він підпалив її, спалив дотла і замкнув невинних людей у будівлях. Єдина втіха для нас — те, що вони померли вільними..."

ces_puppet_administratio_imperii:0 "Administratio Imperii"
ces_puppet_administratio_imperii_desc:0 "Окупаційний підрозділ легіону, ці безжальні люди хочуть перш за все зробити нас рабами на службі у своїх господарів. Вони використають будь-які засоби для досягнення цієї мети, але які їхні точні наміри щодо нас?"

ces_puppet_via_romana:0 "Via Romana"
ces_puppet_via_romana_desc:0 "Було зроблено багато роботи для покращення доріг, що ведуть до імперії Цезаря, і наші люди ставляться до цього з цікавістю та обережністю. Ми повинні попередити їх: немає жодних сумнівів, що вони роблять це лише для збільшення потоку рабів і награбованих ресурсів."

ces_puppet_roman_justice:0 "Римське правосуддя"
ces_puppet_roman_justice_desc:0 "Дедалі частіше злочинців страчують і роблять із них жахливий приклад. Публічний розстріл, обезголовлення, розп'яття. І хоча деякі з цих злочинців були вбивцями і бандитами, більшість із них — дрібні злодюжки або інтелектуали."

ces_puppet_new_nobility:0 "Ave! Duci Nova"
ces_puppet_new_nobility_desc:0 "Легіон відбудовує невеликі міста, зруйновані під час їхнього наступу, але вони... інші. Вони призначені для забезпечення їхніх зусиль із закріплення, і там працює поневолене населення. Вони намагаються прикувати наших людей до своїх заводів."

ces_puppet_romano_tribalism:0 "Романо-трайбалізм"
ces_puppet_romano_tribalism_desc:0 "Пропаганда Легіону масово поширюється нашими землями, погрожуючи і переконуючи наших людей підтримати їхню владу. Вони роблять дикі заяви про велич і дають величезні обіцянки, але... в дечому є сенс. Їхні жахливі методи справді очистили нашу територію від бандитів і рейдерів. Можливо, вони в чомусь праві?"

ces_puppet_lingua_franca:0 "Lingua Romana"
ces_puppet_lingua_franca_desc:0 "Діставшись до основ нашої культури, вони тепер навчають наших дітей і молодь шляху Легіону та його мові. Ми не можемо нічого зробити, окрім як підкоритися, і знання хоча б частини їхньої мови напевно пом'якшить їх під час зачисток, чи не так?"

ces_puppet_when_under_rome:0 "Коли ти під владою Риму"
ces_puppet_when_under_rome_desc:0 "Схоже, у них там є приказка: поводься так само, як жителі міста, в якому ти перебуваєш. Щоб зменшити кількість масових вбивств і розп'ять, ми повинні дослухатися до цих слів і поводитися як громадяни Легіону, хоч як би нам не було боляче."

ces_puppet_decimatio:0 "Децимація"
ces_puppet_decimatio_desc:0 "Масштабні етнічні чистки ширяться нашими землями. Будь-який невеликий клан або громада, що не підкоряється, знищується, а будь-яка людина, спіймана на негативних висловлюваннях про легіон, піддається бичуванню або навіть розп'яттю у найгірших випадках. Як низько ми впали..."

ces_puppet_iron_collar:0 "Залізні нашийники"
ces_puppet_iron_collar_desc:0 "Наш народ, який ми клялися захищати, у кайданах. Поневолені, зломлені, безнадійні... чи можемо ми справді продовжувати жити, знаючи, що підвели кожного чоловіка, жінку та дитину, які нам довіряли? Як ми взагалі можемо сподіватися оговтатися від цього..."

ces_puppet_punishing_profligates:0 "Покарання розпусників"
ces_puppet_punishing_profligates_desc:0 "Розпусники — так вони називають дегенератів. Але для них будь-хто, хто не служить Легіону і не віддає свою сім'ю в рабство, є таким. Оскільки чоловіки відмовляються переймати культурні традиції Легіону, вони отримують удари батогом, жорстоке побиття і навіть страчуються як приклад."

ces_puppet_disenfranchisement:0 "Позбавлення прав"
ces_puppet_disenfranchisement_desc:0 "Мало-помалу вони руйнують наші права. Ми вже не можемо обирати, не можемо голосувати і не можемо нічого робити, окрім як підкорятися. З часом вони годують нас усе менше і менше, кажучи, що решта піде Легіону в якості оплати за його /"захист/". Наші люди не витримають цього набагато довше..."

ces_puppet_separating_the_children:0 "Розлучення з дітьми"
ces_puppet_separating_the_children_desc:0 "Вони прийшли вночі, з рейдами. Вони забрали наших дітей. Так багато. З того, що ми змогли дізнатися, їх тренуватимуть, щоб вони стали солдатами Легіону або гарматним м'ясом. Деякі люди намагалися чинити опір, але з них... зробили приклад..."

ces_puppet_dissolute_become_whole:0 "Розпусники стають цілісними"
ces_puppet_dissolute_become_whole_desc:0 "Все скінчено, нашу волю зламано, наші надії розбито вщент. Як ми можемо протистояти такій могутності? Будь-якого дисидента спалюють живцем, будь-якому розпуснику відрубують голову, а їхні трупи прикрашають дороги, що ведуть до їхньої імперії. Щоб вижити, ми повинні повністю підкоритися."

ces_puppet_the_evil_of_technology:0 "Зло технологій"
ces_puppet_the_evil_of_technology_desc:0 "З поширенням їхнього впливу поширюється і їхня доктрина. Вони говорять про зло технологій, про те, як вони знищили старий світ і як знищать наступний. У їхніх словах є певна мудрість, і наше населення починає прислухатися до їхньої культури. Книги спалюють, машини знищують, а інженерів чи вчених піддають остракізму."

ces_puppet_roman_conscription:0 "Римський призов"
ces_puppet_roman_conscription_desc:0 "Вербувальні загони солдатів нишпорять сільською місцевістю в пошуках усіх, хто достатньо здоровий, щоб служити Цезарю. Мало уваги приділяється їхньому становищу чи стану, бо поки вони служать — вони житимуть."

ces_puppet_para_pax_bellum:0 "Pax Para Bellum"
ces_puppet_para_pax_bellum_desc:0 "Він дав нам силу здійснити помсту! До правління Цезаря ми були налякані та безсилі, але подивіться на нас зараз! Могутні, наші ряди поповнюються солдатами, наші землі очищені від дегенеративного бруду. Ми повернемо те, що належить нам по праву! На війну! Ave Legio! Ave Caesar!"

ces_puppet_the_new_pax_romana:0 "Новий Pax Romana"
ces_puppet_the_new_pax_romana_desc:0 "Цезар правий у всьому. Там, без його захисту, ми були б дикунами та розпусниками. Подивіться навколо, дегенерати, рейдери, племена. На їхніх землях панує беззаконня, а їхні люди недисципліновані. А зараз? Ми є силою. Ми захистимо наші землі від дикунів будь-якою ціною."

ces_puppet_aeternit_imperi:0 "Aeternit Imperi"
ces_puppet_aeternit_imperi_desc:0 "Вічна імперія. Ось чим ми стали. Цезар приведе нас до перемоги, як і наша міць. Ніщо не зможе зупинити чи навіть сповільнити нас — ні розпусники, ні дрібні нації пустки, і вже точно не НКР. Америка буде нашою, і імперія буде правити. Вічна, прекрасна, могутня. Ave Caesar! Imperium Aeternum!"

## BOS

bos_puppet_ad_victorium:0 "Пов'язані сталлю"
bos_puppet_ad_victorium_desc:0 "Зазнавши поразки від сталевих монстрів, ми не можемо нічого зробити, окрім як підкоритися і чекати на їхній суд. Ми мужньо билися, але їхні передові технології дали їм перевагу, і тепер ми мусимо терпіти. Наше населення виснажене і налякане, про них мало що відомо. Чи будуть вони садистськими завойовниками?"

bos_puppet_capital_siege:0 "Звільнення [Root.Capital.GetName]"
bos_puppet_capital_siege_desc:0 "Братство вирішило рушити на нашу столицю. Наші громадяни замикають двері і визирають з вікон, боячись цих неповоротких солдатів, закутих у силову броню. Чого вони хочуть? Чи прагнуть вони позловтішатися після нашої поразки?"

bos_puppet_hall_of_initiates:0 "Зал Ініціації"
bos_puppet_hall_of_initiates_desc:0 "Очевидно, вони шукають послушників, нових рекрутів для своєї армії, і ми можемо лише підкоритися. Та все ж це дивно, не можна сказати, що це призов, схоже, вони хочуть підняти нас на вищий рівень. Але якими будуть їхні вчення?"

bos_puppet_initiate_education:0 "Освіта для служби"
bos_puppet_initiate_education_desc:0 "Їхньому допоміжному ополченню потрібні люди, солдати, готові крокувати поруч з їхніми броньованими силуетами. Ми вже вибрали наших найвитриваліших громадян, щоб віддати загарбникам, бо вважали це призовом. Але вони шукають добровольців, і в обмін на це вони дадуть нам дар знань."

bos_puppet_drilling:0 "Муштра"
bos_puppet_drilling_desc:0 "Наша армія, як не дивно, не була розпущена після того, як країна впала. Навіть навпаки, вона збільшилася в розмірах! Радники Братства спостерігали за нашими військовими навчаннями і тренувальними програмами, і запропонували величезну кількість покращень до них. Це має перетворити наші сили на більш боєздатну машину, але яка їхня мета?"

bos_puppet_ideological_strength:0 "Пропаганда Братства"
bos_puppet_ideological_strength_desc:0 "Брошури, публічні промовці, кампанії з надання гуманітарної допомоги — Братство явно прагне хорошого піару. Але чи можемо ми їх звинувачувати? Вони приносять їжу та притулок нашому населенню, цілком справедливо, що вони отримують певну довіру натомість."

bos_puppet_reintroducing_technology:0 "Повернення базових технологій"
bos_puppet_reintroducing_technology_desc:0 "З усіх технологій, повернутих Братством у нашу країну, найбільше цінується кондиціонування повітря. Хоча функціонуючі термінали і працюючі лабораторії — це дуже добре, вони виявили певне здивування, побачивши, що ми більше зацікавлені свіжим повітрям, ніж наукою. Звідки їм знати, зрештою, їхні костюми мають вбудовану вентиляцію..."

bos_puppet_earning_our_place:0 "Заслужити своє місце"
bos_puppet_earning_our_place_desc:0 "Орден кличе, і за їхні зусилля, спрямовані на покращення нашого життя, ми відповідаємо взаємністю. Ми не можемо стояти осторонь, поки вони працюють нам на благо, ми виправдаємо цей привілей і заслужимо їхню повагу! Нехай буде відомо, що ми формуємо виняткові допоміжні війська, адже ми заслужимо своє місце поруч із ними!"

bos_puppet_scribe_initiation:0 "Посвята у Писарі"
bos_puppet_scribe_initiation_desc:0 "За наші зусилля ми заслужили привілей пройти посвяту в писарі, так само, як і будь-які інші претенденти. Наші військові, як і наш народ, готові, ми пройдемо це випробування!"

bos_puppet_learning_from_the_ancients:0 "Навчання у предків"
bos_puppet_learning_from_the_ancients_desc:0 "Наш народ прагне більше знань, і тому шукає реліквії старого світу. Створюються пошукові загони, кожна знахідка ретельно очищається і вивчається для подальшого використання. Братство шукає ці об'єкти так само, як і ми, і вони можуть виявитися корисними в майбутньому."

bos_puppet_tutelage:0 "Опіка"
bos_puppet_tutelage_desc:0 "Оскільки наша армія дотримується нового режиму тренувань до останньої літери, броньовані солдати бачать, що ми прагнемо поповнити їхні лави. Радники вже звернулися з проханням виступити в ролі військових консультантів і керівників навчань — прохання, яке ми можемо лише прийняти. Як ми могли б втратити можливість прагнути до такого чудового прикладу?"

bos_puppet_old_world_medicine:0 "Медицина Старого Світу"
bos_puppet_old_world_medicine_desc:0 "Мабуть, те, що визначає рівень цивілізації, це те, наскільки добре дбають про її громадян. Таким чином, щоб запобігти будь-яким втратам серед військових, яких можна уникнути, масштабна кампанія зі збору ресурсів у кожній клініці, лікарні та медичному закладі на наших землях повинна покращити наші знання і дозволити нам розробити нові технології."

bos_puppet_new_discoveries:0 "Нові наукові відкриття"
bos_puppet_new_discoveries_desc:0 "Наші вчені зробили прорив! Після такого довгого часу вдосконалення наших знань і розширення технологічних операцій ми змогли зробити нове наукове відкриття! Напевно, це порадує Братство, бо ми піднесемо це їм як подарунок."

bos_puppet_power_armour_maintenance:0 "Обслуговування силової броні"
bos_puppet_power_armour_maintenance_desc:0 "Як символ довіри, нашій нації було виділено невелику кількість відновленої силової броні. Ми маємо навчитися користуватися нею, обслуговувати та вдосконалювати її, адже ми маємо стати лицарями! Наші війська вже відчувають себе могутніми у справжній силовій броні. Але попереду ще довгий шлях."

bos_puppet_knight_school:0 "Школа лицарів"
bos_puppet_knight_school_desc:0 "Братство визнало за потрібне розпочати нашу лицарську підготовку — велика честь, безперечно! З нею приходять технології, знання і влада! Ми робимо великі успіхи, і незабаром будемо такими ж могутніми, як і їхні сталеві титани."

bos_puppet_art_of_war:0 "Мистецтво війни"
bos_puppet_art_of_war_desc:0 "Якщо ми хочемо стати повноцінним орденом, нам потрібно бути найкращими, вершками суспільства. Наша силова броня добре послужила нам, але те, що потрібно — це тренування і тактика. Ми будемо безстрашними, будемо бити швидко і сильно, знищувати наших ворогів ще до того, як вони зможуть зреагувати."

bos_puppet_power_armour_training:0 "Тренування із силовою бронею"
bos_puppet_power_armour_training_desc:0 "Спеціалізовані тренування із силовою бронею, що стосуються належного поводження, процедур обслуговування, а також ремонту на полі бою, дозволять нам оптимізувати наш поточний дизайн, враховуючи вищу підготовку наших військ, яка може легко все компенсувати. Нам потрібно зосередитися як на якості, так і на кількості, бо якщо ми зможемо поєднати і те, і інше, наші вороги напевно будуть приречені."

bos_puppet_wasteland_missions:0 "Місії у Пустці"
bos_puppet_wasteland_missions_desc:0 "Нові рекрути, нові допоміжні сили, нові послушники — нам потрібні всі вони і навіть більше. Якщо ми хочемо захищатися і розвиватися, ми повинні мати більше сил. Місії з вербування будуть відправлені по всій пустці, закликаючи загартованих солдатів стати лицарями. Це має достатньо підкріпити наші війська, щоб ми могли зустріти більшість ворогів віч-на-віч."

bos_puppet_new_bunkers:0 "Нові бункери"
bos_puppet_new_bunkers_desc:0 "Фортифікації необхідні для будь-якого військового штабу, і наші союзники були настільки люб'язні, що надали нам деякі з їхніх креслень бункерів низького рівня. Робота вже розпочалася, передбачено тактичні командні пункти та укріплені оборонні позиції. Немає сумнівів, що ми пустимо кров будь-кому, хто спробує напасти на нас."

bos_puppet_technology_raids:0 "Технологічні рейди"
bos_puppet_technology_raids_desc:0 "Настав час застосувати всю цю практику і тренування на ділі. Братство помітило небезпечні технології на нашій території і доручило нам захопити їх, а також знищити будь-які ворожі сили. Ми не підведемо, Ad Victoriam."

bos_puppet_paladin:0 "Посвята у Паладини"
bos_puppet_paladin_desc:0 "Нарешті нас визнали гідними. Наші збройні сили мають пройти офіційну посвяту в паладини, і це означатиме для них найважче випробування. Вони готові і не підведуть. Справжні паладини незабаром прикрасять наші землі, служачи людям і борючись проти жаху пустки!"

bos_puppet_visit_from_the_elder:0 "Візит Старійшин"
bos_puppet_visit_from_the_elder_desc:0 "Старійшини з [ROOT.OVERLORD.getName] вшанували нас своєю присутністю, а отже, нас визнали гідними. Візит від них мав широкі наслідки серед населення. Наш народ тепер знову сповнений гордості та надії, адже вони дали нам воду, електрику і можливість проявити себе. Ми підтверджуємо нашу клятву вірності та обіцяємо підтримку їхній справі."

bos_puppet_new_chapter:0 "Новий Орден"
bos_puppet_new_chapter_desc:0 "Всі наші зусилля і тренування, всі люди, яких ми втратили, люди, яких ми зустріли, друзі, яких ми завели, вороги, яких ми розбили, все це призвело до цього. Тепер ми офіційно визнані новим Орденом Братства, першим в історії, сформованим з пустки. Створені з попелу апокаліпсису, ми повстаємо, щоб гарантувати безпеку та захист наших людей, а також стримувати небезпечні технології. Ми клянемося у вірності Братству, відтепер і назавжди!"

bos_puppet_semper_invicta:0 "Обов'язок, Честь, Мужність"
bos_puppet_semper_invicta_desc:0 "Ці цінності прищеплювалися нам із самого початку тренувань. Наша гордість цілком заслужена, адже ми служили нашому ордену понад усякі очікування. Як новостворений незалежний Орден, ми тепер насолоджуємося новим ступенем автономії, що дозволить нам здійснювати самостійні місії на ворожій території, а також краще боротися з ворогами Братства. Більше ніколи технологіям не буде дозволено руйнувати наш світ, наші елітні броньовані солдати про це подбають."

bos_puppet_the_art_of_rifle_maintenance:0 "Мистецтво обслуговування гвинтівки"
bos_puppet_the_art_of_rifle_maintenance_desc:0 "Належне розбирання і чищення в польових умовах — це дійсно мистецтво. Кожен солдат, гідний цього звання, повинен вміти розбирати свою лазерну гвинтівку, чистити лінзи і батарейний відсік, а також перевіряти центрування і електричні контакти. Ці гвинтівки мають бути продовженням нас самих, і ми маємо дбати про них так само, як про власне тіло."

##TRL

trl_puppet_warrens_triumph:0 "Тріумф Лігва"
trl_puppet_warrens_triumph_desc:0 "Ми мало що могли зробити, щоб зупинити орду. Вони налетіли на нас, мов стерв'ятники, розриваючи на шматки. Незважаючи на нашу нищівну поразку, спогади про опір все ще живуть у нашій пам'яті."

trl_puppet_capital_siege:0 "Різанина у [Root.Capital.GetName]"
trl_puppet_capital_siege_desc:0 "Орда мутантів розграбувала [Root.Capital.GetName], бенкетуючи нашими людьми протягом трьох днів. Коли цей проклятий грабіж припинився, ніхто при здоровому глузді навіть не думав про опір нашим новим господарям."

trl_puppet_will_of_the_first:0 "Воля Першого"
trl_puppet_will_of_the_first_desc:0 "Перший розбив нас. Тепер він перекує нас за своїм образом і подобою, формуючи наше суспільство згідно зі своєю волею."

trl_puppet_end_of_man:0 "Кінець людства"
trl_puppet_end_of_man_desc:0 "Наша поразка від рук Орди довела слабкість людини. Мутанти — це вища форма еволюції. Що може зробити людина проти такої грубої сили?"

trl_puppet_burning_the_old_world:0 "Спалення Старого Світу"
trl_puppet_burning_the_old_world_desc:0 "Старий світ згорить і буде створений заново в полум'ї нашої слави!"

trl_puppet_the_death_of_the_nuclear_family:0 "Смерть нуклеарної сім'ї"
trl_puppet_the_death_of_the_nuclear_family_desc:0 "Наслідуючи ідеали Єдності, ми станемо одним плем'ям з єдиною метою і єдиним баченням майбутнього. Всі служитимуть Лігву."

trl_puppet_breeding_duties:0 "Обов'язки з розведення"
trl_puppet_breeding_duties_desc:0 "Лише одиниці переживають благословення ВРЕ. Нам потрібно збільшити нашу чисельність."

trl_puppet_feeding_duties:0 "Обов'язки з годування"
trl_puppet_feeding_duties_desc:0 "Наші господарі жадають людської плоті. Ми будемо живити Лігво нашою плоттю."

trl_puppet_embracing_servitude:0 "Покора долі"
trl_puppet_embracing_servitude_desc:0 "Ми віддамо все, що маємо, заради майбутнього Лігва, навіть нашу свободу."

trl_puppet_slave_hierarchies:0 "Ієрархія рабів"
trl_puppet_slave_hierarchies_desc:0 "Примушувати всіх працювати в шахтах — це марнування талантів. Ми встановимо ієрархію між нашими рабами, використовуючи їхні здібності по максимуму."

trl_puppet_educated_slaves:0 "Освічені раби"
trl_puppet_educated_slaves_desc:0 "Деякі раби виявляють здібності до вищої освіти. Делегування їм дослідницьких завдань збільшить нашу наукову продуктивність."

trl_puppet_slave_masters:0 "Наглядачі за рабами"
trl_puppet_slave_masters_desc:0 "Вибір найбезжальніших рабів на посаду наглядачів дозволить нам зосередитися на більш важливих нагальних завданнях."

trl_puppet_age_of_the_mutant:0 "Епоха Мутанта"
trl_puppet_age_of_the_mutant_desc:0 "Епоха людей минула, настав час Мутантів!"

trl_puppet_mutated_salvation:0 "Мутантське спасіння"
trl_puppet_mutated_salvation_desc:0 "Тепер у нас достатньо людей, благословенних ВРЕ, щоб виставити армії супермутантів."

trl_puppet_sending_the_worthy:0 "Відправка гідних"
trl_puppet_sending_the_worthy_desc:0 "Ті, хто був гідний благословення ВРЕ, тепер готуються до війни. Лігво жадає людської плоті."

trl_puppet_request_our_own_barrel:0 "Запит на власну бочку"
trl_puppet_request_our_own_barrel_desc:0 "Оскільки все більше наших людей занурюється у ВРЕ, нам потрібно більше зразків ВРЕ."

trl_puppet_mastery_of_the_ritual:0 "Майстерність ритуалу"
trl_puppet_mastery_of_the_ritual_desc:0 "Благословення ВРЕ тепер є невід'ємною частиною нашої культури, вдосконаленою незліченними повтореннями. Наш рівень успіху стрімко зростає, дозволяючи нам дістатися до тих, хто раніше не пережив би цей процес."

trl_puppet_embracing_our_mastery:0 "Прийняття нашої майстерності"
trl_puppet_embracing_our_mastery_desc:0 "Наш народ прийняв шлях вознесіння. Наше минуле нас більше не турбує."

trl_puppet_learning_to_walk_again:0 "Знову навчитися ходити"
trl_puppet_learning_to_walk_again_desc:0 "До нашого вознесіння ми були слабкими. Тепер ми можемо перетинати пустки зі швидкістю, яку ніхто з нас раніше навіть не міг уявити."

trl_puppet_combatting_the_rage:0 "Боротьба з люттю"
trl_puppet_combatting_the_rage_desc:0 "Ми навчимося контролювати нашу лють і спрямовувати її на ворогів Лігва."

trl_puppet_letting_go_of_the_past:0 "Відпускаючи минуле"
trl_puppet_letting_go_of_the_past_desc:0 "Нам не потрібні химерні штучки з нашого людського минулого. Ми відпустимо наше минуле і побудуємо нове майбутнє."

trl_puppet_building_mutopia:0 "Побудова Мутопії"
trl_puppet_building_mutopia_desc:0 "Давайте відбудуємо мутантську утопію під керівництвом Вчителя."

trl_puppet_FEV_breakthroughs:0 "Прориви у ВРЕ"
trl_puppet_FEV_breakthroughs_desc:0 "Наше досконале володіння благословенням ВРЕ розкрило прихований потенціал вознесіння. Пустка тремтітиме перед нашою мутантською міццю!"

trl_puppet_warcalls:0 "Заклики до війни"
trl_puppet_warcalls_desc:0 "Лігво ворушиться. Ми відчуваємо нескінченний голод, що кличе нас із глибин темряви."

trl_puppet_mutant_idealism:0 "Мутантський ідеалізм"
trl_puppet_mutant_idealism_desc:0 ""

trl_puppet_mutant_pragmatism:0 "Мутантський прагматизм"
trl_puppet_mutant_pragmatism_desc:0 ""

trl_puppet_the_firsts_call:0 "Поклик Першого"
trl_puppet_the_firsts_call_desc:0 "Ми більше не ті слабкі люди, якими були колись. Тепер ми — Лігво, що служить славі Першого. У славу роду мутантів!"

###

vlt_puppet_vault_tec_calling:0 "Vault-Tec на зв'язку"
vlt_puppet_vault_tec_calling_desc:0 "Привіт усім і кожному з вас! На зв'язку Vault-Tec, і, о боже, з якими гарними новинами ми телефонуємо! Відтепер усі ви вважаєтеся дочірньою компанією Vault-Tec Inc., і тому ми найтепліше вас вітаємо. Ласкаво просимо до нашої постійно зростаючої сім'ї, ми в захваті від того, що ви з нами, і сподіваємося на плідну співпрацю!"

vlt_puppet_capital_siege:0 "Інкорпорація [Root.Capital.GetName]"
vlt_puppet_capital_siege_desc:0 "Це знову ми, ваша улюблена компанія в цьому маленькому шматочку пустки! Нам довелося витратити трохи часу на прибирання залишків незгідних активів, які стояли на шляху під час нашого силового ворожого поглинання, тому перепрошуємо за той невеличкий безлад, який влаштувала наша служба безпеки. Але все це в минулому, чи не так? А тепер давайте розглянемо умови контракту."

vlt_puppet_the_new_overseer:0 "Новий Наглядач"
vlt_puppet_the_new_overseer_desc:0 "Ми раді повідомити всім вам, нашій найвідданішій дочірній компанії, що ми призначили вам регіонального менеджера! Вам більше не доведеться турбуватися про такі нудні речі, як "автономія" або "самовизначення", тепер ми про це подбаємо. Привітайте свого нового Наглядача!"

vlt_puppet_for_science:0 "Заради науки"
vlt_puppet_for_science_desc:0 "Наука! Дехто може сказати, що це жахливо, і використати вкрай неточні терміни, такі як "порушення прав людини" або навіть, можливо, "огидна поведінка", але тут, у Vault-Tec, ми дивимося набагато далі! Уявіть, чого ми могли б досягти разом, і все, що для цього потрібно — це щомісячний внесок у розмірі (25) цивільних активів!"

vlt_puppet_scientific_method:0 "Науковий метод"
vlt_puppet_scientific_method_desc:0 "Науковий метод — безумовно, чудова річ. Ми у Vault-Tec прагнемо розвивати людство, і для цього нам потрібно повторювати наші експерименти знову, знову і знову, і провести їх ще раз, щоб бути повністю впевненими! А тепер, діти, шикуйтеся парами в тестову камеру, і не лякайтеся, якщо наступите на щось липке! Волт-Бой дякує вам за ваш внесок!"

vlt_puppet_test_subjects:0 "Піддослідні"
vlt_puppet_test_subjects_desc:0 "Ми хотіли б м'яко нагадати вам, що крики чутно за межами тестової камери, але жоден співробітник не прийде вам на допомогу в разі розчинення кінцівок або гниття нервів, тому ми люб'язно пропонуємо вам використовувати наданий дерев'яний брусок, щоб прикусити його під час клінічних випробувань і не турбувати наш кваліфікований персонал. Гарного вам дня, і дякуємо, що обрали Vault-Tec!"

vlt_puppet_human_trials:0 "Випробування на людях"
vlt_puppet_human_trials_desc:0 "Vault-Tec бажає щиро подякувати родинам піддослідних: нехай буде відомо, що вони надали дуже корисні результати балістичного аналізу та показники тілесних ушкоджень! До цього повідомлення додається знак подяки від команди, а саме — зброя, виготовлена з урахуванням цих звітів. Ми також радісно нагадуємо вам, що використання цього подарунка для усунення "незгідних активів" призведе до підвищення зарплати! (2) членів вашої родини були визначені як такі. Гарного вам дня!"

vlt_puppet_control_groups:0 "Контрольні групи"
vlt_puppet_control_groups_desc:0 "Будь ласка, громадяни, не хвилюйтеся. Нещодавні зникнення були лише результатом нашої абсолютно нової політики щодо формування контрольних груп. Про них добре дбають, і годують їх не гірше, ніж будь-кого з вас. Будь-яка сім'я, чий родич був примусово перепризначений, і яка бажає отримати компенсацію, може звернутися до місцевого офіцера для переведення до тих самих приміщень контрольних груп, де перебувають їхні близькі."

vlt_puppet_science_enrichment_centres:0 "Центри збагачення"
vlt_puppet_science_enrichment_centres_desc:0 "В інтересах заспокоєння піддослідних, ми раді повідомити про відкриття абсолютно нового центру збагачення! З м'якими стінами для комфортної атмосфери, а також заспокійливою системою динаміків і телевізором у кожній кімнаті, він гарантовано подарує чудові враження нашим улюбленим контриб'юторам. Запитайте свого місцевого керівника про це вже сьогодні!"

vlt_puppet_artificial_loyalty_enhancement:0 "Штучне підвищення лояльності"
vlt_puppet_artificial_loyalty_enhancement_desc:0 "Абсолютно новий чіп лояльності, імплантований безпосередньо в нервову систему — це найновіше досягнення прямо з нашого відділу продажів! Він гарантовано зробить вас щасливими завдяки технології ін'єкцій хімікатів, спеціально розробленій для вашого благополуччя! Vault-Tec люб'язно нагадує вам, що ця операція є обов'язковою, і бажає вам чудового дня!"

vlt_puppet_SPCW:0 "Громадяни за етичне поводження з жителями Пустки"
vlt_puppet_SPCW_desc:0 "З огляду на новий розвиток подій, пов'язаний з кампанією Г.Е.П.Ж.П., ми з сумом повідомляємо, що після тривалих обговорень ми змушені зупинити всі програми збагачення і наукові розробки. Хоча я впевнений, що більшість із вас шоковані і налякані таким розвитком подій, ми все одно хочемо запевнити: Vault-Tec зробить усе можливе, щоб привести всіх вас у майбутнє людства!"

vlt_puppet_for_the_vault:0 "Заради Міста"
vlt_puppet_for_the_vault_desc:0 "Як нова дочірня компанія Vault-Tec Incorporated, ми раді повідомити, що незабаром прибуде спеціалізований інженер, який допоможе вашому місту/регіону/нації стати тим процвітаючим місцем, яким, як ми знаємо, воно може бути! Ми віримо в тебе, чемпіоне! Не звертайте уваги на озброєну охорону, вона тут виключно для захисту від рейдерів та дикої природи."

vlt_puppet_the_new_courtyard:0 "Нове передмістя"
vlt_puppet_the_new_courtyard_desc:0 "Продовжуючи наше партнерство, Місто Сховища вирішило надіслати вам додаткових поселенців, щоб допомогти вам приборкати безлюдні пустки! Чи можна бути ще більш везучими? Тепер у вас можуть виникнути деякі занепокоєння щодо кольору їхньої шкіри та їхнього загального ставлення, але ми запевняємо вас, що вони — найкраще з того, що може запропонувати передмістя!"

vlt_puppet_resource_extraction:0 "Видобуток ресурсів"
vlt_puppet_resource_extraction_desc:0 "Щоб допомогти нашим відносинам розвиватися ще більше, ми вирішили надати вам доступ до передових пристроїв для видобутку ресурсів. Звичайно, ми очікуємо на свою частину угоди, але ми домовилися про більш ніж справедливий обмін! Зрештою, 25% найсучаснішої шахти в пустці — це краще, ніж 100% нічого, чи не так?"

vlt_puppet_industrial_repurposing:0 "Промислове перепрофілювання"
vlt_puppet_industrial_repurposing_desc:0 "Нещодавній візит наших акредитованих інженерів виявив цілком придатні цивільні майстерні, які можна використовувати для цивільних проектів. Якимось чином виявилося, що вони використовувалися для не надто ідеальних цілей, тому ми взяли на себе сміливість перепрофілювати їх самостійно і відправити небезпечні матеріали назад до Міста Сховища для кращого використання. Дякуємо за співпрацю!"

vlt_puppet_vault_security_training:0 "Навчання служби безпеки Сховища"
vlt_puppet_vault_security_training_desc:0 "Оскільки наше партнерство поглиблюється, було визнано доцільним надати вам, нашим найшанованішим партнерам, доступ до спеціальних тренінгів для Служби безпеки Сховища! Ці передові програми, які проводять наші досвідчені ветерани, безумовно перетворять ваші сили безпеки на ефективну військову міць! Результат за місяць, або ми повернемо гроші!"

vlt_puppet_for_the_people:0 "Заради людства"
vlt_puppet_for_the_people_desc:0 "Людство! Славний носій смолоскипа цивілізації та науки! Тут, у Vault-Tec, наша головна мета — зберегти його, і ми робимо це більш ніж добре. Щоб просувати наші цілі далі, нам, на жаль, доведеться попросити вас усіх трохи затягнути паски, щоб полегшити ваше піднесення. Подумайте про майбутнє людства! Зрештою, це того варте."

vlt_puppet_building_utopia:0 "Побудова утопії"
vlt_puppet_building_utopia_desc:0 "Утопія — це для нас більш ніж досяжна мета. Зрештою, ми, як ніхто інший, знаємо про розквіт життя після апокаліпсису. Але це вимагає добровільних учасників, сильних і рішучих, і ці учасники — ви! Ручні інструменти та інструкції вже доставлені до вашого місцевого координаційного центру Vault-Tec. Приєднуйтесь вже сьогодні!"

vlt_puppet_vaultways:0 "Шляхи Сховища"
vlt_puppet_vaultways_desc:0 "Щоб розпочати будівництво абсолютно нового сховища, нам доведеться побудувати нові інфраструктурні об'єкти для переміщення необхідних матеріалів. На ваше щастя, ваша місцева дочірня компанія Vault-Tec з радістю вам у цьому допоможе! Просто попросіть надати деякі будівельні активи, не давайте кайданам занадто ослабнути, і ви отримаєте новісіньку дорогу швидше, ніж встигнете сказати /"Дякую, Vault-Tec!/""

vlt_puppet_GECK_replicas:0 "Репліки Г.Е.К.К."
vlt_puppet_GECK_replicas_desc:0 "Хоча наші репліки Г.Е.К.К. можуть і не повернути пишні ліси минулого, ми щиро вважаємо, що цього буде більш ніж достатньо, щоб розчистити шлях у майбутнє! Будь ласка, ознайомтеся з інструкціями з експлуатації з 23 по 46 і ніколи не торкайтеся пристрою, не одягнувши двошаровий антирадіаційний костюм, а також не прийнявши таблетки з вугіллям, і негайно повідомляйте свого наглядача про будь-які підозрілі витоки."

vlt_puppet_free_lunchboxes:0 "Безкоштовні ланчбокси!"
vlt_puppet_free_lunchboxes_desc:0 "Як вітальний подарунок від нашого регіонального відділу, кожен з вас отримав ланчбокси зі спеціальної серії з Волт-Боєм! Міцна свинцева підкладка надзвичайно добре зберігає будь-яку їжу всередині, а азбестова оболонка захистить її від спеки та більшості пошкоджень. Не варто дякувати, нам дуже приємно!"

vlt_puppet_vault_boy_posters:0 "Пропаганда Сховища"
vlt_puppet_vault_boy_posters_desc:0 "Незважаючи на те, що переваги партнерства з Vault-Tec Incorporated є очевидними, ми хотіли б нагадати вам усім про численні вигоди, які надає цей статус. Подумайте про задоволення і красу в служінні вищій меті, в розбудові майбутнього людства і вкладі в наступний науковий прорив! А тепер, будь ласка, повертайтеся до роботи."

vlt_puppet_new_jumpsuits:0 "Нові комбінезони"
vlt_puppet_new_jumpsuits_desc:0 "Із теплим серцем та піднесеним духом ми з гордістю повідомляємо про виробництво нової серії комбінезонів сховища, що починається прямо зараз, для численних нових жителів сховища! Наша сім'я так сильно розрослася за останні кілька місяців, і ми вітаємо всіх і кожного в нашій організації."

vlt_puppet_taking_the_GOAT:0 "Складання КОЗА"
vlt_puppet_taking_the_GOAT_desc:0 "Комплексний Освітній Зріз Абітурієнта! Обряд посвяти для кожного співробітника Vault-Tec, і сьогодні ви — той привілейований індивід, який має його пройти! Завдяки безлічі веселих запитань та гарантії отримати повноцінну професію по закінченню, він обов'язково стане справжнім хітом серед молоді. А тепер, будь ласка, шановні громадяни, підходьте для здачі КОЗА!"

vlt_puppet_a_new_great_experiment:0 "Новий Великий Експеримент"
vlt_puppet_a_new_great_experiment_desc:0 "Vault-Tec хоче забрати трохи дорогоцінного часу з вашого чудового дня, щоб нагадати вам, що хоча поточна ситуація в пустці дійсно жахлива, ми у Vault-Tec можемо зробити все набагато краще! Тому ми лагідно просимо вас зробити все можливе в цьому абсолютно новому світі пліч-о-пліч з нашим навченим персоналом заради блага людства. Якщо ви не бажаєте цього робити, будь ласка, зверніться до Інструкції 12.C та візьміть заряджену зброю 2.B для процедури самоліквідації."
vault_city_research_pact_upgrade_tt:0 "§OЦе збільшить бонус до досліджень від Форуму Ресурсів Пустки на додатковий 1% для всіх його членів!§!"

vlt_puppet_honorary_vault_dwellers:0 "Почесні жителі Сховища"
vlt_puppet_honorary_vault_dwellers_desc:0 "Ви всі так важко працювали, щоб пройти весь цей шлях, і тому для нас велика честь вручити вам усім ту чудову річ, якої прагне кожен майбутній мешканець сховища. Ваш власний Сертифікат Дієздатності! Шлях був важким, але ви пройшли його без проблем, і ми пишаємося тим, що можемо зарахувати вас до наших лав. Будь ласка, прийміть нашу найщирішу подяку, і ще раз дякуємо, що обрали Vault-Tec!"

rio_chapter_ad_victorium:0 "Пов'язані сталлю"
rio_chapter_ad_victorium_desc:0 "Зазнавши поразки від сталевих монстрів, ми не можемо нічого зробити, окрім як підкоритися і чекати на їхній суд. Ми мужньо билися, але їхні передові технології дали їм перевагу, і тепер ми мусимо терпіти. Наше населення виснажене і налякане, про них мало що відомо. Чи будуть вони садистськими завойовниками?"

rio_chapter_capital_siege:0 "Звільнення [Root.Capital.GetName]"
rio_chapter_capital_siege_desc:0 "Братство вирішило рушити на нашу столицю. Наші громадяни замикають двері і визирають з вікон, боячись цих неповоротких солдатів, закутих у силову броню. Чого вони хочуть? Чи прагнуть вони позловтішатися після нашої поразки?"

rio_chapter_hall_of_initiates:0 "Зал Ініціації"
rio_chapter_hall_of_initiates_desc:0 "Очевидно, вони шукають послушників, нових рекрутів для своєї армії, і ми можемо лише підкоритися. Та все ж це дивно, не можна сказати, що це призов, схоже, вони хочуть підняти нас на вищий рівень. Але якими будуть їхні вчення?"

rio_chapter_initiate_education:0 "Освіта для служби"
rio_chapter_initiate_education_desc:0 "Їхньому допоміжному ополченню потрібні люди, солдати, готові крокувати поруч з їхніми броньованими силуетами. Ми вже вибрали наших найвитриваліших громадян, щоб віддати загарбникам, бо вважали це призовом. Але вони шукають добровольців, і в обмін на це вони дадуть нам дар знань."

rio_chapter_drilling:0 "Муштра"
rio_chapter_drilling_desc:0 "Наша армія, як не дивно, не була розпущена після того, як країна впала. Навіть навпаки, вона збільшилася в розмірах! Радники Братства спостерігали за нашими військовими навчаннями і тренувальними програмами, і запропонували величезну кількість покращень до них. Це має перетворити наші сили на більш боєздатну машину, але яка їхня мета?"

rio_chapter_ideological_strength:0 "Пропаганда Братства"
rio_chapter_ideological_strength_desc:0 "Брошури, публічні промовці, кампанії з надання гуманітарної допомоги — Братство явно прагне хорошого піару. Але чи можемо ми їх звинувачувати? Вони приносять їжу та притулок нашому населенню, цілком справедливо, що вони отримують певну довіру натомість."

rio_chapter_reintroducing_technology:0 "Повернення базових технологій"
rio_chapter_reintroducing_technology_desc:0 "З усіх технологій, повернутих Братством у нашу країну, найбільше цінується кондиціонування повітря. Хоча функціонуючі термінали і працюючі лабораторії — це дуже добре, вони виявили певне здивування, побачивши, що ми більше зацікавлені свіжим повітрям, ніж наукою. Звідки їм знати, зрештою, їхні костюми мають вбудовану вентиляцію..."

rio_chapter_earning_our_place:0 "Заслужити своє місце"
rio_chapter_earning_our_place_desc:0 "Орден кличе, і за їхні зусилля, спрямовані на покращення нашого життя, ми відповідаємо взаємністю. Ми не можемо стояти осторонь, поки вони працюють нам на благо, ми виправдаємо цей привілей і заслужимо їхню повагу! Нехай буде відомо, що ми формуємо виняткові допоміжні війська, адже ми заслужимо своє місце поруч із ними!"

rio_chapter_scribe_initiation:0 "Посвята у Писарі"
rio_chapter_scribe_initiation_desc:0 "За наші зусилля ми заслужили привілей пройти посвяту в писарі, так само, як і будь-які інші претенденти. Наші військові, як і наш народ, готові, ми пройдемо це випробування!"

rio_chapter_learning_from_the_ancients:0 "Навчання у предків"
rio_chapter_learning_from_the_ancients_desc:0 "Наш народ прагне більше знань, і тому шукає реліквії старого світу. Створюються пошукові загони, кожна знахідка ретельно очищається і вивчається для подальшого використання. Братство шукає ці об'єкти так само, як і ми, і вони можуть виявитися корисними в майбутньому."

rio_chapter_tutelage:0 "Опіка"
rio_chapter_tutelage_desc:0 "Оскільки наша армія дотримується нового режиму тренувань до останньої літери, броньовані солдати бачать, що ми прагнемо поповнити їхні лави. Радники вже звернулися з проханням виступити в ролі військових консультантів і керівників навчань — прохання, яке ми можемо лише прийняти. Як ми могли б втратити можливість прагнути до такого чудового прикладу?"

rio_chapter_old_world_medicine:0 "Медицина Старого Світу"
rio_chapter_old_world_medicine_desc:0 "Мабуть, те, що визначає рівень цивілізації, це те, наскільки добре дбають про її громадян. Таким чином, щоб запобігти будь-яким втратам серед військових, яких можна уникнути, масштабна кампанія зі збору ресурсів у кожній клініці, лікарні та медичному закладі на наших землях повинна покращити наші знання і дозволити нам розробити нові технології."

rio_chapter_new_discoveries:0 "Нові наукові відкриття"
rio_chapter_new_discoveries_desc:0 "Наші вчені здійснили прорив! Після такого тривалого часу вдосконалення наших знань і розширення технологічних операцій ми змогли зробити нове наукове відкриття! Безумовно, це потішить Братство, адже ми піднесемо це їм як подарунок."

rio_chapter_power_armour_maintenance:0 "Обслуговування силової броні"
rio_chapter_power_armour_maintenance_desc:0 "На знак довіри нашій нації було виділено невелику кількість відновленої силової броні. Ми маємо навчитися нею користуватися, обслуговувати та вдосконалювати її, адже ми маємо стати лицарями! Наші війська вже почуваються могутніми у справжній силовій броні. Але попереду ще довгий шлях."

rio_chapter_knight_school:0 "Школа лицарів"
rio_chapter_knight_school_desc:0 "Братство визнало за доцільне розпочати нашу підготовку лицарів — це, безперечно, велика честь! Разом із цим приходять технології, знання та сила! Ми робимо великі успіхи і незабаром станемо такими ж могутніми, як і їхні сталеві титани."

rio_chapter_art_of_war:0 "Мистецтво війни"
rio_chapter_art_of_war_desc:0 "Якщо ми хочемо стати повноцінним орденом, нам потрібно бути найкращими, вершками суспільства. Наша силова броня добре нам послужила, але те, що нам потрібно, — це тренування і тактика. Ми будемо безстрашними, завдаватимемо швидких і нищівних ударів, знищуючи ворогів ще до того, як вони встигнуть відреагувати."

rio_chapter_power_armour_training:0 "Тренування в силовій броні"
rio_chapter_power_armour_training_desc:0 "Спеціальні тренування в силовій броні, що стосуються належного поводження, процедур технічного обслуговування, а також ремонту на полі бою, дозволять нам оптимізувати наш поточний дизайн, враховуючи кращу підготовку наших військ, яка може легко це компенсувати. Ми маємо зосередитися як на якості, так і на кількості, адже якщо ми зможемо поєднати і те, і інше, наші вороги будуть приречені."

rio_chapter_wasteland_missions:0 "Місії в Пустці"
rio_chapter_wasteland_missions_desc:0 "Нові рекрути, нові допоміжні сили, нові послушники — нам потрібні всі вони і навіть більше. Якщо ми хочемо захистити себе і розвиватися, ми повинні мати більше сил. Вербувальні місії будуть розіслані по всій пустці із закликом до загартованих солдатів ставати лицарями. Це має достатньо підсилити наші війська, щоб ми могли протистояти більшості ворогів віч-на-віч."

rio_chapter_new_bunkers:0 "Нові бункери"
rio_chapter_new_bunkers_desc:0 "Для будь-якого військового штабу потрібні укріплення, і наші союзники були настільки люб'язні, що надали нам кілька своїх проектів бункерів низького рівня. Роботи вже розпочато, передбачено кімнати тактичного командування та захищені оборонні позиції. Немає сумнівів, що ми пустимо кров кожному, хто спробує нас здолати."

rio_chapter_technology_raids:0 "Технологічні рейди"
rio_chapter_technology_raids_desc:0 "Настав час застосувати всю цю практику і тренування. Братство помітило небезпечні технології на нашій території і доручило нам захопити їх, а також ліквідувати будь-які ворожі активи. Ми не розчаруємо, Ad Victoriam (До Перемоги)."

rio_chapter_paladin:0 "Посвята в Паладини"
rio_chapter_paladin_desc:0 "Нарешті нас визнали гідними. Наші збройні сили мають пройти офіційну посвяту в паладини, і це стане для них найважчим випробуванням. Вони готові і не розчарують. Справжні паладини незабаром прикрасять наші землі, служачи людям і борючись проти жахіть пустки!"

rio_chapter_visit_from_the_elder:0 "Візит Старійшин"
rio_chapter_visit_from_the_elder_desc:0 "Старійшини вшанували нас своєю присутністю, а отже, нас визнали гідними. Їхній візит мав широкі наслідки серед населення. Наш народ знову сповнений гордості і надії, адже вони дали нам воду, електрику і можливість проявити себе. Ми підтверджуємо нашу клятву вірності та обіцяємо підтримку їхній справі."

rio_chapter_new_chapter:0 "Новий Орден"
rio_chapter_new_chapter_desc:0 "Всі наші зусилля і тренування, всі люди, яких ми втратили, з якими познайомилися, друзі, яких ми здобули, вороги, яких ми розчавили — все це вело до цього. Тепер нас офіційно визнано новим орденом Братства, першим, який коли-небудь був сформований з жителів пустки. Створені з попелу апокаліпсису, ми повстаємо, щоб убезпечити та захистити наш народ, а також стримати небезпечні технології. Ми присягаємо на вірність Братству, відтепер і назавжди!"

rio_chapter_semper_invicta:0 "Обов'язок, Честь, Відвага"
rio_chapter_semper_invicta_desc:0 "Ці цінності прищеплювалися нам з часів тренувань. Наша гордість цілком заслужена, адже ми послужили нашому ордену понад усі очікування. Як новоутворений незалежний Орден, ми тепер насолоджуємося новим рівнем автономії, що дозволить нам здійснювати самостійні місії на ворожій території, а також краще битися з ворогами Братства. Ніколи більше технологіям не буде дозволено знищити наш світ, наші елітні броньовані солдати про це подбають."

rio_chapter_the_art_of_rifle_maintenance:0 "Мистецтво обслуговування гвинтівки"
rio_chapter_the_art_of_rifle_maintenance_desc:0 "Належне розбирання та чищення в польових умовах — це справді мистецтво. Кожен солдат, вартий цього звання, повинен вміти розібрати свою лазерну гвинтівку, почистити лінзи і гніздо батареї, а також перевірити центровку та електричні канали. Ці гвинтівки мають бути продовженням нас самих, і ми маємо дбати про них так само, як про власне тіло."

## COW

cow_puppet_first_event:0 "Оперативний успіх"
cow_puppet_first_event_desc:0 "Незважаючи на всі наші зусилля, Пустельні Рейнджери здобули перемогу, і ми опинилися в їхній владі..."

cow_puppet_second_event:0 "Автономна адміністрація"
cow_puppet_second_event_desc:0 "Рейнджери виявили милосердя і замість жорстокої окупації надали нам автономію."

cow_puppet_third_event:0 "Відбудова"
cow_puppet_third_event_desc:0 "Ми маємо впоратися з наслідками війни та нашою поразкою, давайте вирішимо, що робити далі."

cow_puppet_spawn_army:0 "Гарнізонна служба"
cow_puppet_spawn_army_desc:0 "Першим кроком до відбудови є створення власних збройних сил. На щастя, Пустельні Рейнджери надали нам припаси та одну зі своїх дивізій для допомоги."

cow_puppet_spawn_army_at_war:0 "Мобілізація помічників"
cow_puppet_spawn_army_at_war_desc:0 "Ми у стані війни, і якщо ми хочемо вижити, ми повинні мобілізувати наших помічників для захисту нашої території."

cow_puppet_spawn_army_extra:0 "Наші власні Рейнджери"
cow_puppet_spawn_army_extra_desc:0 "Тепер, коли ми завершили реформування армії, ми можемо створити власну версію армії рейнджерів, яка розгромила нас на самому початку."

cow_puppet_spawn_extra_industry:0 "Відбудова промисловості"
cow_puppet_spawn_extra_industry_desc:0 "Завдяки підтримці Рейнджерів, вони надали нам кілька своїх фабрик, щоб допомогти у відбудові нашої країни."

cow_puppet_spawn_extra_industry_at_war:0 "Екстрена індустріалізація"
cow_puppet_spawn_extra_industry_at_war_desc:0 "Через війну, яку зараз ведуть Пустельні Рейнджери, нас втягнули в конфлікт, і тепер ми повинні мобілізувати нашу промисловість для підтримки військових зусиль."

cow_puppet_spawn_extra_industry_extra:0 "Завершення відбудови"
cow_puppet_spawn_extra_industry_extra_desc:0 "Із завершенням наших промислових реформ ми можемо скористатися надлишковими промисловими потужностями і використати їх для підтримки нашої армії."

cow_puppet_spec_ops_tech:0 "Броня Рейнджерів"
cow_puppet_spec_ops_tech_desc:0 "Будь-який справжній Пустельний Рейнджер використовує довоєнне поліцейське спорядження, і якщо ми хочемо стати нацією рейнджерів, ми повинні вміти виробляти власну версію."

cow_puppet_research_slot:0 "Дослідницький кооператив"
cow_puppet_research_slot_desc:0 "Після війни наші наукові можливості, на жаль, суттєво скоротилися. Якщо ми хочемо колись відновити цей потенціал, ми повинні працювати разом з Пустельними Рейнджерами над відбудовою нашої наукової бази."

cow_puppet_industry_1:0 "Промислові реформи"
cow_puppet_industry_1_desc:0 "Промисловість — це ключ до успіху, і якщо ми хочемо розвинути нашу націю, щоб, можливо, колись стати незалежними, ми не повинні ігнорувати цю надважливу частину нашої економіки."

cow_puppet_industry_2:0 "Робочі проекти"
cow_puppet_industry_2_desc:0 "Після війни багато мирних жителів залишилися без роботи. Ми повинні скористатися цим надлишком робочої сили і залучити їх до відбудови нашої промисловості."

cow_puppet_industry_3:0 "Безпека понад усе"
cow_puppet_industry_3_desc:0 "Перший крок до створення сильної економіки — зробити так, щоб її не знищили. Ми повинні захистити наші землі від рейдерів, бойових загонів і тому подібних, якщо ми хочемо гарантувати безперебійну роботу нашої економіки."

cow_puppet_industry_4:0 "Економічна спеціалізація"
cow_puppet_industry_4_desc:0 "Не намагайтеся робити все самостійно, це найважливіше правило економіки. Коли ви спеціалізуєтесь у певній галузі, ви досягнете в ній набагато більшого успіху. Тож ми маємо дотримуватися цього принципу і спеціалізуватися у конкретній сфері."

cow_puppet_army_1:0 "Реформування армії"
cow_puppet_army_1_desc:0 "Пустельні Рейнджери перемогли нас завдяки своїй кращій армії. І якщо ми не хочемо знову програти війну, ми повинні будувати нашу армію на зразок їхньої."

cow_puppet_army_2:0 "Вербування ветеранів"
cow_puppet_army_2_desc:0 "Війна залишила нам багато ветеранів, які тепер сидять без роботи. Яке ж рішення? Дати їм роботу в нашій щойно відбудованій армії. Це може не сподобатися Пустельним Рейнджерам, але нам потрібні солдати, тож вони не повинні надто злитися, враховуючи, що тепер ми союзники, до того ж багато з них вже мають досвід поводження зі спеціалізованим озброєнням, що нам дуже допоможе."

cow_puppet_army_3:0 "Фінансування від Рейнджерів"
cow_puppet_army_3_desc:0 "Рейнджери хочуть, щоб ми створили власну армію, але як нам це зробити, якщо нам нічим їм платити і немає зброї, щоб їх озброїти? Ми повинні звернутися до рейнджерів з проханням допомогти нам у вирішенні цієї проблеми."

cow_puppet_army_4:0 "Справжня армія Рейнджерів"
cow_puppet_army_4_desc:0 "Тепер, коли ми відбудували нашу армію, рейнджери вирішили надіслати нам радників, які допоможуть навчати наших солдатів методам Пустельних Рейнджерів."

cow_puppet_wasteland_rangers_idea_one:0 "Адміністративні реформи"
cow_puppet_wasteland_rangers_idea_one_desc:0 "Наше Командування Рейнджерів складається з багатьох ветеранів Пустельних Рейнджерів. Ми маємо попросити їхньої допомоги у реформуванні нашої адміністрації, щоб наблизити її до стандартів Пустельних Рейнджерів."

cow_puppet_wasteland_rangers_idea_two:0 "Адміністрація Рейнджерів"
cow_puppet_wasteland_rangers_idea_two_desc:0 "Ми зробили це! Ми відбудувалися і тепер готові стати рівноправними партнерами Пустельних Рейнджерів. Ми обіцяємо допомагати всім, хто цього потребує, і бути захисниками пустки!"