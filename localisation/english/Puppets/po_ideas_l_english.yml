ncr_puppet_idea_starved:0 "Виморені голодом"
ncr_puppet_idea_starved_desc:0 "НКР морила голодом наші війська та народ, і навіть сьогодні ми відчуваємо наслідки цього."
ncr_puppet_idea_kneecapped:0 "Економічно покалічені"
ncr_puppet_idea_kneecapped_desc:0 "НКР використала свою економіку, щоб змусити нас підкоритися. Наразі нашій економіці все ще потрібно оговтатися від їхніх дій."
ncr_puppet_idea_lied_to:0 "Політично обдурені"
ncr_puppet_idea_lied_to_desc:0 "НКР політично обдурила нас, і через це наш народ не довіряє нашим лідерам."
ncr_puppet_idea_event2_1:0 "Нові робочі місця"
ncr_puppet_idea_event2_1_desc:0 "Т.А. НКР почала відновлювати нашу промисловість та створювати робочі місця, що дало нам певне полегшення."
ncr_puppet_idea_event2_2:0 "Доступ до їжі та води"
ncr_puppet_idea_event2_2_desc:0 "Т.А. НКР почала надавати вільний доступ до їжі та води, хоча це використовувалося для 'очищення земель' задля подібних підприємств і залучення ресурсів."
ncr_puppet_idea_event2_3:0 "Відбудована адміністрація"
ncr_puppet_idea_event2_3_desc:0 "Т.А. НКР взялася за відбудову нашої адміністрації."
ncr_puppet_idea_raider:0 "Акт про умиротворення рейдерів"
ncr_puppet_idea_tribal:0 "Акт про примирення з тубільцями"
ncr_puppet_idea_tribal_1:0 "Промислова модернізація"
ncr_puppet_idea_tribal_2:0 "Державна освіта"
ncr_puppet_idea_settler:0 "Акт про реорганізацію держави"
ncr_puppet_idea_ncr_draft:0 "Призов до НКР"
ncr_puppet_idea_ncr_draft_1:0 "Призов до НКР"
ncr_puppet_idea_ncr_draft_2:0 "Призов до НКР"
ncr_puppet_taxation:0 "Оподаткування"
ncr_puppet_taxation_desc:0 "У житті неминучі дві речі: смерть та податки."
ncr_puppet_idea_expanded_admin_authority:0 "Розширення повноважень адміністрації"
ncr_puppet_idea_expanded_admin_authority_desc:0 "Обов'язок Т.А. — переконатися, що жителі штату лояльні, а щоб забезпечити лояльність, ми маємо розширити нашу владу над регіоном."
ncr_puppet_idea_propaganda_posters:0 "Пропагандистські плакати"
ncr_puppet_idea_propaganda_posters_desc:0 "Наша пропаганда прищеплює цінності НКР, а також нагнітає страх перед її ворогами. Ми повинні забезпечити вірність наших людей."
ncr_puppet_follower_support:0 "Підтримка Послідовників"
ncr_puppet_follower_support_desc:0 "Ми не стільки поклоняємося, скільки дотримуємося набору принципів. Ми хочемо повернути мир у цю пустку. Світ тяжіє до руйнування, тому ми намагаємося змінити його на краще, - Ніколь."
ncr_puppet_idea_new_farms:0 "Нові ферми"
ncr_puppet_idea_new_farms_desc:0 "Ці ферми зроблять дива для залучення людей до штату, а також зменшать проблеми з продовольством."
ncr_puppet_idea_quotas:0 "Квоти"
ncr_puppet_idea_quotas_desc:0 "...І ви будете вдячні за місця за столом, Хоч він і хилиться з одного боку, а лава хитка. Ви можете змарнувати свої дні, але принаймні ви змогли оплатити свою могилу, оскільки ми здали вам в оренду вашу колиску. Будьте вірними і моліться, щоб ми повернули те, що ви вкладаєте, Поводьтеся так, як належить рабам в інтересах людства, З огляду на те, що ви всі на рахунку, а ми швидко нарощуємо інтерес людства. Ви могли б подумати, що ми скотимося на межу повстання, коли ринки залежать від торгівлі зброєю. Але архітектор каже їм, що секрет раю полягає просто в тому, щоб споживати все, що ми їм продаємо..."
ncr_puppet_idea_encouragement:0 "Заохочення"
ncr_puppet_idea_encouragement_desc:0 "...Ми працюємо, щоб заслужити право працювати, щоб заслужити право працювати, щоб заслужити право працювати, щоб заслужити право дати собі право купувати, собі право жити, щоб заслужити право померти..."
ncr_puppet_idea_expanding_vehicle_production:0 "Розширення виробництва транспорту"
ncr_puppet_idea_expanding_production_desc:0 "Щоб відплатити НКР, ми маємо сформувати моторизований корпус. Ми залучимо кілька досвідчених механіків, які зможуть навчити наступне покоління."
ncr_puppet_idea_highwaymen_experts:0 "Експерти з Гайвейменів"
ncr_puppet_idea_highwaymen_experts_desc:0 "Хоча грабіжники на дорогах є бідою для пусток, вони добре вміють ремонтувати машини. Ми залучимо тих, хто пішов на спокій і залишив своє злочинне життя в обмін на помилування та шанс жити нормальним життям."
ncr_puppet_idea_training_regiments:0 "Навчальні полки"
ncr_puppet_idea_training_regiments_desc:0 "Наші воїни повинні вчитися наслідувати НКР та її союзників з більш сучасною тактикою та організацією. Це дозволить нашим арміям набагато ефективніше взаємодіяти з підрозділами союзників."
ncr_puppet_idea_tribal_combat_experience:0 "Здобуття бойового досвіду"
ncr_puppet_idea_tribal_combat_experience_desc:0 "Нашим військам потрібен бойовий досвід, і для цього ми відправимо частину наших сил у пустки, щоб допомагати іншим націям у їхніх конфліктах, що дозволить нам не лише вивчити пустки, але й навчитися воювати."
ncr_puppet_idea_tribal_diet:0 "Нові раціони"
ncr_puppet_idea_tribal_diet_desc:0 "Наш раціон не був найкращим, настав час це змінити, якщо ми хочемо мати сильних воїнів і сильних людей."
ncr_puppet_idea_tribal_trials:0 "Випробування"
ncr_puppet_idea_tribal_trials_desc:0 "Нашим військам потрібні нові випробування, щоб перевірити їхню здатність виживати без припасів і швидко пересуватися. Це забезпечить їм більшу витривалість, ніж у наших ворогів."
ncr_puppet_idea_tribal_expanding:0 "Розширення наших сил"
ncr_puppet_idea_tribal_expanding_desc:0 "Наші сили настільки навчені, наскільки це можливо. Тепер ми повинні працювати над збільшенням їхньої чисельності, щоб посилити наші армії."
ncr_puppet_tithe:0 "Десятина"
ncr_puppet_tithe_desc:0 "Один з наших нових штатів надіслав нам десятину, як мило!"
ncr_puppet_tithe_giver:0 "Десятина для Каліфорнії"
ncr_puppet_tithe_giver_desc:0 "Ми відправили десятину до Каліфорнії, щоб подякувати їм за все, що вони для нас зробили."
ncr_puppet_assault:0 "Запеклий штурм"
ncr_puppet_assault_desc:0 "Як 'колишні' рейдери, ми маємо добре уявлення про те, як атакувати. Зосередьмося на цьому, щоб розробити наші стратегії."
ncr_puppet_piercing:0 "Пробивні атаки"
ncr_puppet_piercing_desc:0 "Наші солдати стають все більш вправними у штурмі, що дозволяє їм проривати лінії ворога набагато легше, ніж нашим союзникам."
ncr_puppet_shock:0 "Ударні війська"
ncr_puppet_shock_desc:0 "Наші сили тепер — відмінні ударні загони, здатні проривати та розрізати ворожі лінії, отримуючи додатковий здоб... 'припаси' для нас, коли ми б'ємо по їхніх вузлах постачання."
ncr_puppet_raider_ranger_trainers:0 "Інструктори Рейнджерів"
ncr_puppet_raider_ranger_trainers_desc:0 "Рейнджери НКР є елітними підрозділами, і наявність такого загону в нас була б вигідною як для нас, так і для НКР. Ми запросили інструкторів з НКР, і вони погодилися, оскільки ми почнемо створювати власний корпус рейнджерів, хоча на це потрібен час."
ncr_puppet_raider_discipline:0 "Честь та дисципліна"
ncr_puppet_raider_discipline_desc:0 "Наші сили вчитимуться у рейнджерів, стаючи менш грубими та більш чесними і відданими нашим цілям. Встановлено високий стандарт, і покарання за порушення правил суворі, але це ціна, яку ми платимо."
ncr_puppet_raider_duty:0 "Наш обов'язок"
ncr_puppet_raider_duty_desc:0 "Ми маємо обов'язок перед НКР, яка допомогла нам стати цивілізованими і дозволила спокутувати провину. Ми будемо служити НКР, це правильно."
ncr_puppet_scavenger:0 "Пошукова експедиція"
ncr_puppet_scavenger_desc:0 "НКР надала нам робочу силу з дрібних правопорушників, щоб ми використовували їх для пошуку ресурсів у нашому штаті для НКР."
ncr_puppet_scavenger_ncr:0 "Переваги пошукових експедицій"
ncr_puppet_scavenger_ncr_desc:0 "Можливо, нам варто частіше посилати таких людей, як Годдард... до речі, як він там?"
ncr_puppet_shock_trooper_remnant:0 "Залишки ударної тактики"
ncr_puppet_shock_trooper_remnant_desc:0 "Перебуваючи під владою НКР, ми навчалися ударній тактиці. Хоча ми звільнилися з-під їхнього контролю, ми зберегли кілька уроків, яким вони нас навчили."
ncr_puppet_raider_duty_remnant:0 "Залишок нашого обов'язку"
ncr_puppet_raider_duty_remnant_desc:0 "Ми мали обов'язок перед НКР, але тепер ні. Хоча деякі з їхніх ідей ми збережемо."
