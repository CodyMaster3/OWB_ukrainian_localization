# NCR
ncr_puppet_idea_starved:0 "Виморювання"
ncr_puppet_idea_starved_desc:0 "НКР виморювала наші війська та народ — і досі відчуваються наслідки цього."

ncr_puppet_idea_kneecapped:0 "Економічне Калецтво"
ncr_puppet_idea_kneecapped_desc:0 "НКР змусила нас підкоритись через економіку. Наразі наша економіка ще оговтується від цих дій."

ncr_puppet_idea_lied_to:0 "Політична Обмана"
ncr_puppet_idea_lied_to_desc:0 "НКР політично обманула нас, через що наш народ втратив довіру до керівництва."

ncr_puppet_idea_event2_1:0 "Нові Робочі Місця"
ncr_puppet_idea_event2_1_desc:0 "Територіальна адміністрація НКР взялася відбудовувати наші підприємства і створювати робочі місця, що стало певним полегшенням."

ncr_puppet_idea_event2_2:0 "Доступ до Їжі та Води"
ncr_puppet_idea_event2_2_desc:0 "ТА НКР забезпечує доступ до їжі та води, хоча для цього часто «зачищає» землі й завозить нові ресурси."

ncr_puppet_idea_event2_3:0 "Відбудова Адміністрації"
ncr_puppet_idea_event2_3_desc:0 "ТА НКР взялася за реконструкцію нашої адміністративної системи."

ncr_puppet_idea_raider:0 "Акт про Утихомирення Рейдерів"
ncr_puppet_idea_tribal:0 "Акт про Примирення з Туземцями"

ncr_puppet_idea_tribal_1:0 "Індустріальна Модернізація"
ncr_puppet_idea_tribal_2:0 "Державна Освіта"

ncr_puppet_idea_settler:0 "Акт про Реорганізацію Штатів"

ncr_puppet_idea_ncr_draft:0 "Призов до НКР"
ncr_puppet_idea_ncr_draft_1:0 "Призов до НКР"
ncr_puppet_idea_ncr_draft_2:0 "Призов до НКР"

ncr_puppet_taxation:0 "Оподаткування"
ncr_puppet_taxation_desc:0 "У житті є дві неминучі речі — смерть і податки."

ncr_puppet_idea_expanded_admin_authority:0 "Розширення Повноважень Адміністрації"
ncr_puppet_idea_expanded_admin_authority_desc:0 "Обов’язок ТА — забезпечити лояльність людей. Для цього необхідно зміцнити наш контроль над регіоном."

ncr_puppet_idea_propaganda_posters:0 "Пропагандистські Плакати"
ncr_puppet_idea_propaganda_posters_desc:0 "Наша пропаганда поширює цінності НКР і страх перед ворогами. Ми маємо забезпечити лояльність населення."

ncr_puppet_follower_support:0 "Підтримка Послідовників"
ncr_puppet_follower_support_desc:0 "Ми не стільки поклоняємося, скільки дотримуємося принципів. Ми хочемо повернути мир цій пустці. Світ прагне до руйнації — ми намагаємось змінити його. — Ніколь"

ncr_puppet_idea_new_farms:0 "Нові Ферми"
ncr_puppet_idea_new_farms_desc:0 "Ці ферми допоможуть залучити людей і зменшити нестачу продовольства."

ncr_puppet_idea_quotas:0 "Квоти"
ncr_puppet_idea_quotas_desc:0 "...І ти будеш вдячний за місце за столом, Хоча він кривий, а лавка хитається, Ти змарнуєш життя, але принаймні мав змогу, Сплатити за могилу, бо ми орендували тобі колиску. Будь вірним і молися, що ми віддамо борг, Поводься як раб заради людського блага..."

ncr_puppet_idea_encouragement:0 "Заохочення"
ncr_puppet_idea_encouragement_desc:0 "...Ми Працюємо, щоб Заробити Право Працювати, Щоб Заробити Право, Працювати, щоб Заробити Право Працювати, Щоб Заробити Право Жити, І Право Померти..."

ncr_puppet_idea_expanding_vehicle_production:0 "Розширення Виробництва Техніки"
ncr_puppet_idea_expanding_production_desc:0 "Щоб віддячити НКР, ми маємо створити моторизовані корпуси. Ми залучимо досвідчених механіків, які навчать нове покоління."

ncr_puppet_idea_highwaymen_experts:0 "Експерти з Шосейників"
ncr_puppet_idea_highwaymen_experts_desc:0 "Хоча шосейники є проблемою пустки, вони добре лагодять машини. Ми надамо амністію тим, хто кинув кримінальне життя, і запропонуємо новий початок."

ncr_puppet_idea_training_regiments:0 "Тренувальні Полки"
ncr_puppet_idea_training_regiments_desc:0 "Наші війська повинні наслідувати НКР та її союзників: сучасна тактика та організація зроблять нашу армію ефективнішою."

ncr_puppet_idea_tribal_combat_experience:0 "Бойовий Досвід"
ncr_puppet_idea_tribal_combat_experience_desc:0 "Нашим силам потрібен бойовий досвід. Ми відправимо підрозділи допомагати іншим державам, щоб вчитись на практиці й краще розуміти пустку."

ncr_puppet_idea_tribal_diet:0 "Нова Дієта"
ncr_puppet_idea_tribal_diet_desc:0 "Наш раціон харчування був далекий від ідеального. Якщо ми хочемо мати сильних воїнів і міцний народ — час це змінити."

ncr_puppet_idea_tribal_trials:0 "Випробування"
ncr_puppet_idea_tribal_trials_desc:0 "Нашим силам потрібні нові випробування — щоб перевірити, як вони виживають без припасів і пересуваються у складних умовах. Це дасть їм витривалість, що перевершить ворогів."

ncr_puppet_idea_tribal_expanding:0 "Розширення Армії"
ncr_puppet_idea_tribal_expanding_desc:0 "Наші сили вже добре навчені. Тепер ми маємо зосередитися на їхньому збільшенні для посилення армії."

ncr_puppet_tithe:0 "Десятина"
ncr_puppet_tithe_desc:0 "Один із наших штатів прислав десятину. Як мило!"

ncr_puppet_tithe_giver:0 "Десятина Каліфорнії"
ncr_puppet_tithe_giver_desc:0 "Ми надіслали десятину до Каліфорнії на знак вдячності за все, що вони для нас зробили."

ncr_puppet_assault:0 "Люті Штурми"
ncr_puppet_assault_desc:0 "Як колишні рейдери, ми добре знаємо, як атакувати. Зосередьмося на цьому, щоб вдосконалити стратегії."

ncr_puppet_piercing:0 "Проникаючі Атаки"
ncr_puppet_piercing_desc:0 "Наші солдати все краще проводять штурми, що пробивають ворожі лінії швидше, ніж у наших союзників."

ncr_puppet_shock:0 "Штурмові Війська"
ncr_puppet_shock_desc:0 "Наші війська стали відмінними штурмовими загонами, які прориваються через лінії противника, з додатковими трофеями—перепрошую, припасами—зі складів ворога."

ncr_puppet_raider_ranger_trainers:0 "Інструктори Рейнджерів"
ncr_puppet_raider_ranger_trainers_desc:0 "Рейнджери НКР — елітні війська. Нам би не завадив власний корпус. Ми запросили інструкторів від НКР, і ті погодились — починаємо створення нашого рейнджерського корпусу, хоча це й потребує часу."

ncr_puppet_raider_discipline:0 "Честь і Дисципліна"
ncr_puppet_raider_discipline_desc:0 "Наші війська навчаються в рейнджерів, стаючи менш грубими, більш шляхетними й відданими. Встановлено високі стандарти й суворі покарання за порушення — це ціна, яку ми платимо."

ncr_puppet_raider_duty:0 "Наш Обов’язок"
ncr_puppet_raider_duty_desc:0 "Ми маємо обов’язок перед НКР, яка допомогла нам цивілізуватись і дала шанс на викуп. Ми служитимемо їй — так правильно."

ncr_puppet_scavenger:0 "Експедиція Збирачів"
ncr_puppet_scavenger_desc:0 "НКР надала нам трудовий резерв із дрібних злочинців для обшуку наших територій у її інтересах."

ncr_puppet_scavenger_ncr:0 "Переваги Експедицій Збирачів"
ncr_puppet_scavenger_ncr_desc:0 "Може, нам варто частіше посилати таких, як Годдард... а до речі, що з ним?"

ncr_puppet_shock_trooper_remnant:0 "Залишки Штурмової Тактики"
ncr_puppet_shock_trooper_remnant_desc:0 "За часів підпорядкування НКР ми навчались штурмовій тактиці. Тепер ми вільні, але зберегли деякі її уроки."

ncr_puppet_raider_duty_remnant:0 "Залишки Обов’язку"
ncr_puppet_raider_duty_remnant_desc:0 "Колись ми служили НКР. Тепер — ні. Але деякі з їхніх ідей ми зберегли."

ncr_puppet_idea_tribal_expansion_remnant:0 "Залишки Нашого Розширення"
ncr_puppet_idea_tribal_expansion_remnant_desc:0 ""

