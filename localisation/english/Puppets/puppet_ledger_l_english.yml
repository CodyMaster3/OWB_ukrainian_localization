  PUPPET_LEDGER_MANPOWER_TT:0 "§YЛюдські ресурси§! \nВільні людські ресурси: §Y[This.GetPuppetLedgerManpower]§! \nВикористані людські ресурси: §Y[This.GetPuppetLedgerUsedManpower]§! \n   - На навчанні: §Y[This.GetPuppetLedgerManpowerInTraining]§! \n\nУсього людських ресурсів: §Y[This.GetPuppetLedgerMaxAvailableManpower]§! \nДоступно §Y[?modifier@conscription|2%]§! від придатного національного населення (§Y[This.GetPuppetLedgerMaxManpower]§!) [This.GetPuppetLedgerConscriptionFactor]"
  PUPPET_LEDGER_INDUSTRIAL_CAPACITY_TT:0 "§YФабрики§! \nЗбройові майстерні у використанні: §Y[?military_factories_in_use|0]§!/§Y[?num_of_military_factories|0]§! \nВійськово-морські верфі у використанні: §Y[?naval_factories_in_use|0]§!/§Y[?num_of_naval_factories|0]§! \nЦивільні майстерні у використанні: §Y[?civilian_factories_in_use|0]§!/§Y[?num_of_civilian_factories|0]§!"
  PUPPET_LEDGER_FUEL_TT:0 "§YЕнергокомірки§!"
  PUPPET_LEDGER_NAVY_TT:0 "§YФлот§! \nПоточна кількість кораблів: §Y[?num_of_ships|0]§!"
  PUPPET_LEDGER_CONSCRIPTION_LAW_TT:0 "§YЗакон про призов§! \nПоточний закон про призов — §Y[This.GetConscriptionLawName]§!, за яким призивається §Y[This.GetConscriptionLawPercentage]§! національного населення."

