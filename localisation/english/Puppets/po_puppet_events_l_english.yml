l_english:

ncr_puppet_event.1.t:0 "Ведмідь Переміг"
ncr_puppet_event.1.d:0 "Попри довгу й горду історію незалежності, нашу свободу відібрали. Нова Каліфорнійська Республіка оголосила нашу націю новим штатом у своїй республіці. Як вони поставили нас на коліна?"
ncr_puppet_event.1.a:0 "Вони змусили нас голодувати й змусили підкоритися."
ncr_puppet_event.1.b:0 "Вони зруйнували наше життя своєю економічною могутністю."
ncr_puppet_event.1.c:0 "Вони обманули нас політичними інтригами."

ncr_puppet_event.2.t:0 "Облога [Root.Capital.GetName]"
ncr_puppet_event.2.d:0 "Наша остання битва відбулася на околицях столиці, де ми показали НКР, що означає справжня свобода. Який був наш останній великий акт спротиву?"
ncr_puppet_event.2.a:0 "Ми билися до останнього, як одне ціле!"
ncr_puppet_event.2.b:0 "Ми боролись серед палаючих руїн наших домівок, доки не впали."
ncr_puppet_event.2.c:0 "Наш лідер кинув виклик їхнім найсильнішим у поєдинку один на один."

ncr_puppet_event.3.t:0 "Територіальна Адміністрація НКР"
ncr_puppet_event.3.d:0 "Територіальна Адміністрація НКР отримала завдання відновити нашу націю, зібрати уламки нашого життя й створити новий, лояльний народ. Для цього Т.А. заявила, що першочергово зосередиться на..."
ncr_puppet_event.3.a:0 "Створенні нових робочих місць та промисловості."
ncr_puppet_event.3.b:0 "Забезпеченні бідних кращим доступом до їжі й води."
ncr_puppet_event.3.c:0 "Відбудові державної адміністрації."

ces_puppet_event.1.t:0 "Бик Переміг"
ces_puppet_event.1.d:0 "Бик знищив нашу оборону й вирізав наше населення. Переможці зруйнують нашу історію, культуру та минуле заради своїх огидних цілей. Як ми дійшли до цього?"
ces_puppet_event.1.a:0 "Фрументарії проникли в наші землі, вирізаючи солдатів і цивільних."
ces_puppet_event.1.b:0 "Вони вбили нас... кожного з нас..."
ces_puppet_event.1.c:0 "Вони спалили всю сільську місцевість, разом з людьми всередині."

ces_puppet_event.2.t:0 "Наше місто... зруйноване..."
ces_puppet_event.2.d:0 "Деякі з нас досі прокидаються вночі, кричачи, дряпаючи обличчя, здираючи шкіру від жахливих спогадів про легіон. Усі ми пам’ятаємо ту фатальну ніч. Зір, звук і запах. О, боги, цей жахливий запах..."
ces_puppet_event.2.a:0 "Він спалив наше місто, я досі відчуваю запах людського м’яса..."
ces_puppet_event.2.b:0 "Він грабував наші домівки, вбиваючи або ґвалтуючи всіх, кого знаходив."
ces_puppet_event.2.c:0 "Він зрівняв місто з землею, засолив поля кров’ю наших рідних."

ces_puppet_event.3.t:0 "Нова Administratio"
ces_puppet_event.3.d:0 "Коли Цезар упевнився, що ми зломлені — і тілом, і духом — він звернув погляд на наступну здобич. Нас залишили на поталу жорстоким солдатам та Адміністрації. Вони хочуть зробити нас рабами в темному задумі легіону. Чого вони шукають тут?"
ces_puppet_event.3.a:0 "Вони хочуть висмоктати наші землі до останку."
ces_puppet_event.3.b:0 "Вони прагнуть прикувати нас до фабричних конвеєрів."
ces_puppet_event.3.c:0 "Вони хочуть повністю знищити нашу культуру."

bos_puppet_event.1.t:0 "Зв'язані Сталлю"
bos_puppet_event.1.d:0 "Братство зламало нас. Їхні солдати — гіганти в сталевій броні — знищили нашу армію і прорвали оборону. Чи могли ми щось зробити? Як це сталося?"
bos_puppet_event.1.a:0 "Вони розчавили нас за кілька тижнів шквалом лазерного вогню."
bos_puppet_event.1.b:0 "Ми не здалися без бою."
bos_puppet_event.1.c:0 "Ми билися до кінця, змусивши їх платити кров’ю за кожен дюйм."

bos_puppet_event.2.t:0 "Марш на Столицю"
bos_puppet_event.2.d:0 "Вони йшли через столицю, дивлячись на наш наляканий народ із-за броньованих візорів. Їхні допоміжні війська зачищали вулиці, допитуючи кожного підозрілого. Один із них заговорив — голос з гучномовця в шоломі був спотворений і страшний. Для чого він прийшов у наше місто?"
bos_puppet_event.2.a:0 "Адмініструвати його, щоб підживлювати амбіції глави братства."
bos_puppet_event.2.b:0 "Озеленити територію, готуючи її під фортецю."
bos_puppet_event.2.c:0 "Окупувати місто за допомогою міліцій із союзників."

bos_puppet_event.3.t:0 "Зала Послушників"
bos_puppet_event.3.d:0 "Нові тренувальні центри з’явились по всій нашій країні. Братство прагне залучити нових послушників. Пропаганда вже розповсюджується, але яка їхня справжня мета?"
bos_puppet_event.3.a:0 "Навчити їх захищати Братство."
bos_puppet_event.3.b:0 "Сформувати з них ефективну армію."
bos_puppet_event.3.c:0 "Навчити їх спадщині старого світу."

vlt_puppet_event.1.t:0 "Виклик Від Vault-Tec"
vlt_puppet_event.1.d:0 "Ласкаво просимо до цивілізації, нові громадяни! Як нові члени славної Великої Спільноти Міста-Сховища, ви маєте честь бути на передовій нової ери в історії людства. Але перш ніж почати ваше безстрокове служіння на благо людства, давайте поглянемо, чого досягло Місто-Сховище у реформуванні суспільств неподалік!"
vlt_puppet_event.1.a:0 "Наші Команди ЯКО працюють невпинно задля кращого світу."
vlt_puppet_event.1.b:0 "Наші Програми Перевиховання гарантують виправлення найвідсталiших верств суспільства."
vlt_puppet_event.1.c:0 "Наш Курс Пацифікації приборкує навіть найдикунськіші сили пустки."

vlt_puppet_event.2.t:0 "Інкорпорація [Root.Capital.GetName]"
vlt_puppet_event.2.d:0 "У пустці є багато людських поселень, але жодне не зрівняється з Містом-Сховищем. Поки колишня столиця модернізується для досягнення максимальної ефективності, найкращі уми Міста-Сховища працюють над тим, щоб зробити ваш новий дім найкращим із можливих."
vlt_puppet_event.2.a:0 "[Root.Capital.GetName] стане новим осередком торгівлі й економічного зростання."
vlt_puppet_event.2.b:0 "Індустріальна трансформація дозволить жителям краще забезпечувати потреби Міста-Сховища."
vlt_puppet_event.2.c:0 "Реконструкція владної ієрархії відкриває нові можливості для розвитку!"

vlt_puppet_event.3.t:0 "Новий Оверсір"
vlt_puppet_event.3.d:0 "Ми у Місті-Сховищі розуміємо, що весь цей процес може бути трішки приголомшливим. Але якщо у вас чи в інших нових громадян виникнуть питання щодо вашої інкорпорації — не вагайтесь звертатися до свого нового, призначеного Містом-Сховищем наглядача. Пам’ятайте: Оверсір завжди направить вас."
vlt_puppet_event.3.a:0 "Оверсір поведе нас уперед."

trl_puppet_event.1.t:0 "Марш Орди"
trl_puppet_event.1.d:0 "Наш спротив був марним. Орда злетілася, наче стерв’ятники, розриваючи нас на шматки. Наш народ назавжди залишиться зі шрамами від дій Орди. Перед тим як ми здалися, ми..."
trl_puppet_event.1.a:0 "Встигли евакуювати частину нашого народу."
trl_puppet_event.1.b:0 "Билися до останнього."

trl_puppet_event.2.t:0 "Осада [Root.Capital.GetName]"
trl_puppet_event.2.d:0 "Ми дали останній бій у [Root.Capital.GetName]. У розпачі ми..."
trl_puppet_event.2.a:0 "Змусили до служби всіх, незалежно від досвіду."
trl_puppet_event.2.b:0 "Перетворили кожну будівлю на майстерню."
trl_puppet_event.2.c:0 "Вели партизанську війну."

trl_puppet_event.3.t:0 "Воля Першого"
trl_puppet_event.3.d:0 "Хоча Перший очолює Warren, його генерали керують своїм 'людським матеріалом'. Наш новий хазяїн — це..."
trl_puppet_event.3.a:0 "Піттман"
trl_puppet_event.3.b:0 "Боунснарл"
trl_puppet_event.3.c:0 "Беатріс"

rrg_puppet_event.1.t:0 "Наша Війна з Республікою"
rrg_puppet_event.1.d:0 "Сьогодні прапор Республіки Ріо-Гранде майорить над нашою землею. Хоча наш народ не звик до такої ситуації, вони змирилися з нею завдяки..."
rrg_puppet_event.1.a:0 "Військовій присутності"
rrg_puppet_event.1.b:0 "Обіцянкам мирної інтеграції"

rrg_puppet_event.2.t:0 "Договір у [Root.Capital.GetName]"
rrg_puppet_event.2.d:0 "Вони перемогли нас, але знають, що не переможуть волю народу. Ми підпишемо договір із ними, офіційно закріплюючи наш статус як території. Це означає..."
rrg_puppet_event.2.a:0 "Право на самовизначення"
rrg_puppet_event.2.b:0 "Право носити зброю"

rrg_puppet_event.3.t:0 "Війна та Мир"
rrg_puppet_event.3.d:0 "Деякі території Республіки слугують прикордонними форпостами, що постачають ресурси державі. Інші — її хлібні кошики. Наша роль ще не визначена, але ми зосередимось на..."
rrg_puppet_event.3.a:0 "Шляхах війни"
rrg_puppet_event.3.b:0 "Шляхах миру"