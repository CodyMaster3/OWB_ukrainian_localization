l_english:

ncr_puppet_event.1.t:0 "Переможний Ведмідь"
ncr_puppet_event.1.d:0 "Незважаючи на довгу і горду історію незалежності, у нас відібрали свободу. НКР проголосила нашу націю новим штатом у своїй республіці. Як вони поставили нас на коліна?"
ncr_puppet_event.1.a:0 "Вони заморили нас голодом і змусили підкоритися."
ncr_puppet_event.1.b:0 "Вони знищили наші засоби до існування своєю економічною могутністю."
ncr_puppet_event.1.c:0 "Вони обдурили нас політичними хитрощами."

ncr_puppet_event.2.t:0 "Облога [Root.Capital.GetName]"
ncr_puppet_event.2.d:0 "Наш останній бій відбувся на околицях столиці, де ми показали НКР, що таке справжня свобода. Яким був наш останній великий акт непокори?"
ncr_puppet_event.2.a:0 "Ми билися до останнього, як один!"
ncr_puppet_event.2.b:0 "Ми билися в палаючих руїнах наших домівок, поки нас не добили."
ncr_puppet_event.2.c:0 "Наш лідер бився з їхніми найхоробрішими людьми в одиночному двобої."

ncr_puppet_event.3.t:0 "Територіальна Адміністрація НКР"
ncr_puppet_event.3.d:0 "Т.А. НКР отримала завдання відбудувати нашу націю, зібрати розкидані шматочки нашого життя та створити новий, лояльний народ. Щоб досягти цього, Т.А. заявила, що насамперед зосередиться на..."
ncr_puppet_event.3.a:0 "Нових галузях промисловості та робочих місцях для людей."
ncr_puppet_event.3.b:0 "Кращому доступі до їжі та води для знедолених."
ncr_puppet_event.3.c:0 "Відбудові державної адміністрації."

ces_puppet_event.1.t:0 "Переможний Бик"
ces_puppet_event.1.d:0 "Бик знищив нашу оборону та вирізав наше населення. Переможці розірвуть на шматки нашу історію, нашу культуру, наше минуле — усе заради своїх мерзенних цілей. Як до цього дійшло?"
ces_puppet_event.1.a:0 "Фрументарії проникли на наші землі, вбиваючи солдатів та цивільних."
ces_puppet_event.1.b:0 "Вони вбили нас... абсолютно всіх..."
ces_puppet_event.1.c:0 "Вони спалили всю сільську місцевість, підпалили її разом із людьми всередині."

ces_puppet_event.2.t:0 "Наше місто... розірване на частини..."
ces_puppet_event.2.d:0 "Дехто з нас і досі прокидається пізно вночі, кричачи та дряпаючи обличчя, здираючи з себе шкіру, коли згадує жахіття, які накоїв Легіон. Ми всі пам'ятаємо, що сталося тієї фатальної ночі. Видовище, звуки і запах. Боги, цей жахливий запах..."
ces_puppet_event.2.a:0 "Він підпалив наше місто, я досі відчуваю запах смаженої людської плоті..."
ces_puppet_event.2.b:0 "Він пограбував наші домівки, вбиваючи чи ґвалтуючи всіх, кого знаходив."
ces_puppet_event.2.c:0 "Він зруйнував його дощенту, засіяв поля сіллю з кров'ю наших близьких."

ces_puppet_event.3.t:0 "Нова Administratio"
ces_puppet_event.3.d:0 "Коли Цезар переконався, що ми повністю зломлені, як розумом, так і тілом, він звернув свій погляд на наступну ціль. Залишилися лише садисти-солдати та Адміністрація. Вони прагнуть зробити з нас рабів у темних задумах Легіону. Чого вони тут шукають?"
ces_puppet_event.3.a:0 "Вони хочуть пограбувати наші землі до нитки."
ces_puppet_event.3.b:0 "Вони прагнуть прикувати нас до заводських конвеєрів."
ces_puppet_event.3.c:0 "Вони хочуть повністю знищити нашу культуру."

bos_puppet_event.1.t:0 "Скуті сталлю"
bos_puppet_event.1.d:0 "Братство зламало нас. Їхні солдати, гігантські монстри, закуті в сталь, знищили наші армії і прорвали нашу оборону. Чи могли ми щось зробити? Як до цього дійшло?"
bos_puppet_event.1.a:0 "Вони розбили нас за кілька тижнів у шквалі лазерного вогню."
bos_puppet_event.1.b:0 "Ми не здалися без бою."
bos_puppet_event.1.c:0 "Ми билися до останнього, змусивши їх платити кров'ю за кожен дюйм."

bos_puppet_event.2.t:0 "Марш на столицю"
bos_puppet_event.2.d:0 "Вони йшли нашою столицею, дивлячись на налякане населення з-за своїх броньованих візорів, тоді як їхні ауксилярії зачищали дорогу попереду і допитували кожного підозрілого громадянина. Коли один із них заговорив, його голос пролунав гучно, спотворено і лякаюче з динаміка в шоломі. Що він збирався зробити з нашим містом?"
bos_puppet_event.2.a:0 "Управляти ним, підготувати його для підживлення амбіцій Ордену."
bos_puppet_event.2.b:0 "Очистити землю, підготувати її для фортеці."
bos_puppet_event.2.c:0 "Окупувати його загонами ауксиляріїв."

bos_puppet_event.3.t:0 "Зал Посвячених"
bos_puppet_event.3.d:0 "Нові тренувальні центри були побудовані по всій нашій країні. Вони прагнуть зібрати послушників для включення до Братства. Пропаганда вже поширюється, але яка їхня справжня мета?"
bos_puppet_event.3.a:0 "Навчити їх захищати Братство."
bos_puppet_event.3.b:0 "Перетворити їх на ефективну армію для своїх потреб."
bos_puppet_event.3.c:0 "Навчити їх шляхам старого світу."

vlt_puppet_event.1.t:0 "Волт-Тек на зв'язку"
vlt_puppet_event.1.d:0 "Ласкаво просимо до цивілізації, нові громадяни! Як найновіші члени славного великого Міста Сховища, ви маєте привілей бути в авангарді нової глави в історії людства. Але перед тим, як ми розпочнемо вашу нову безстрокову роботу на службі людству, давайте поглянемо, чого Місто Сховища досягло в племінній цивілізації поруч з вами!"
vlt_puppet_event.1.a:0 "Наші команди з якості життя наполегливо працюють над створенням кращого світу."
vlt_puppet_event.1.b:0 "Наші програми перевиховання на 100% гарантують виправлення неблагополучних членів суспільства."
vlt_puppet_event.1.c:0 "Наш курс умиротворення здатний прищепити покірність найбільш диким небезпекам пустки."

vlt_puppet_event.2.t:0 "Приєднання [Root.Capital.GetName]"
vlt_puppet_event.2.d:0 "У пустці є багато центрів проживання людей, але жоден з них не зрівняється з Містом Сховища. Поки ваша колишня столиця переплановується для досягнення максимальної ефективності нашими окупаційними силами, найвидатніші уми нашого міста наполегливо працюють, щоб зробити ваш новий дім найкращим."
vlt_puppet_event.2.a:0 "[Root.Capital.GetName] стане новим центром економічного зростання та торгівлі в пустці."
vlt_puppet_event.2.b:0 "Промислова трансформація дозволить мешканцям [Root.Capital.GetName] краще забезпечувати потреби Міста Сховища."
vlt_puppet_event.2.c:0 "Реконструкція ієрархії [Root.Capital.GetName] створює нові можливості для зростання та досліджень!"

vlt_puppet_event.3.t:0 "Новий Наглядач"
vlt_puppet_event.3.d:0 "Ми тут, у Місті Сховища, розуміємо, що весь цей процес може бути трохи приголомшливим, але якщо у вас або у будь-кого з наших нових співгромадян виникнуть запитання щодо інтеграції вашої нації, не соромтеся звертатися за інформацією до вашого нового Наглядача, призначеного Містом Сховища. Пам'ятайте: Наглядач направить вас."
vlt_puppet_event.3.a:0 "Наглядач направить нас."

trl_puppet_event.1.t:0 "Марш Орди"
trl_puppet_event.1.d:0 "Наш опір був марним. Орди накинулися на нас, як стерв'ятники, розриваючи на шматки. Наш народ назавжди залишиться скаліченим діями орди. Перш ніж здатися, ми..."
trl_puppet_event.1.a:0 "Змогли евакуювати частину наших людей."
trl_puppet_event.1.b:0 "Билися до останнього."

trl_puppet_event.2.t:0 "Облога [Root.Capital.GetName]"
trl_puppet_event.2.d:0 "Ми прийняли свій останній бій у [Root.Capital.GetName], у своєму відчаї ми..."
trl_puppet_event.2.a:0 "Призвали всіх, незалежно від підготовки."
trl_puppet_event.2.b:0 "Перетворили кожну будівлю на майстерню."
trl_puppet_event.2.c:0 "Вели партизанську війну."

trl_puppet_event.3.t:0 "Воля Першого"
trl_puppet_event.3.d:0 "Поки Перший керує Ворреном, його генерали відповідають за їхнє 'людське стадо'. Наш новий господар..."
trl_puppet_event.3.a:0 "Піттман"
trl_puppet_event.3.b:0 "Кісткорип"
trl_puppet_event.3.c:0 "Беатріс"

rrg_puppet_event.1.t:0 "Наша війна з Республікою"
rrg_puppet_event.1.d:0 "Сьогодні над нашою землею майорить прапор Республіки Ріо-Гранде. Хоча наші люди не звикли до такого становища, вони змирилися з ним завдяки..."
rrg_puppet_event.1.a:0 "Військовій присутності"
rrg_puppet_event.1.b:0 "Обіцянкам мирної інтеграції"

rrg_puppet_event.2.t:0 "Договір у [Root.Capital.GetName]"
rrg_puppet_event.2.d:0 "Вони, можливо, й перемогли нас, але вони знають, що не можуть перемогти волю народу. Ми підпишемо з ними договір, що формалізує наш статус як території. Це означає..."
rrg_puppet_event.2.a:0 "Право на самовизначення"
rrg_puppet_event.2.b:0 "Право на носіння зброї"

rrg_puppet_event.3.t:0 "Війна і мир"
rrg_puppet_event.3.d:0 "Деякі території Республіки діють як кордони, забезпечуючи державу. Деякі території є житницями Республіки. Хоча наша мета не така зрозуміла, ми зосередимося на..."
rrg_puppet_event.3.a:0 "Шляхах війни"
rrg_puppet_event.3.b:0 "Шляхах миру"

cow_puppet_event.1.t:0 "Операція 'Свобода [Root.GetOldAdjectiveCap]'"
cow_puppet_event.1.d:0 "Пустельні Рейнджери вщент розбили нас, їхні рейнджери знищили наших бійців і окупували наші поселення. Але не все було так погано, вони..."
cow_puppet_event.1.a:0 "Звільнили нас від наших гнобителів"
cow_puppet_event.1.b:0 "Захистили наші нещодавно окуповані поселення"

cow_puppet_event.2.t:0 "Створення Рейнджерів [Root.Capital.GetName]"
cow_puppet_event.2.d:0 "Замість того, щоб зробити нас лише однією зі своїх юрисдикцій, вони надали нам автономію як новій гілці Пустельних Рейнджерів. Це дало нам можливість..."
cow_puppet_event.2.a:0 "Відстоювати свою незалежність"
cow_puppet_event.2.b:0 "Формувати власні команди рейнджерів"

cow_puppet_event.3.t:0 "Відбудова втраченого"
cow_puppet_event.3.d:0 "Першим кроком нашої нової адміністрації є відновлення наших земель, зруйнованих війною з Пустельними Рейнджерами. Вони люб'язно надали нам велику підтримку в цьому завданні. Але найважливішим, що вони нам дали, були..."
cow_puppet_event.3.a:0 "Рейнджери для гарнізону наших земель"
cow_puppet_event.3.b:0 "Промислова підтримка для відбудови зруйнованих поселень"