NCR_PUPPET_BARON_LEADER_NAME: "Барони НКР"
NCR_PUPPET_BARON_LEADER_DESC: ""

BOS_PUPPET_LEADER_NAME: "Зала Посвячених"
BOS_PUPPET_LEADER_DESC: "Хоча Братство Сталі й обачне до чужинців, воно сприймає кожного прийнятого як родича. Саме в Залі Посвячених новачки розпочинають свій шлях до повноправного членства в ордені."

CES_PUPPET_LEADER_NAME: "Administratio Imperii"
CES_PUPPET_LEADER_DESC: "Не кожне плем’я гідне стояти на рівні під знаменом Бика — цю честь треба заслужити. Administratio Imperii покликана створити нове суспільство зі старого: розбирати технології, поневолювати жінок і дітей та мобілізовувати кожного чоловіка — лише початок їхньої благородної місії."

TRL_PUPPET_LEADER_NAME: "Воля Першого"
TRL_PUPPET_LEADER_DESC: "Саме воля Першого веде всіх — від воєначальника до останнього раба. Його мудрість дозволяє навіть слабким і підкореним знайти нове життя через служіння справі."

VLT_PUPPET_LEADER_NAME: "Наглядач"
VLT_PUPPET_LEADER_DESC: "Зі зростанням кордонів Міста Сховща, виникла потреба у створенні ефективної системи управління новими підлеглими. Група вірних громадян запропонувала «наглядати» за цими людьми, задля користі міста — та науки."

VEG_PUPPET_LEADER_NAME: "Правила Хауса"
VEG_PUPPET_LEADER_DESC: "Кажуть, що найкращий уряд працює як бізнес, і Нью-Вегас щиро в це вірить. Із розширенням Стріпу все й усі, хто не може принести прибуток, безжально «ліквідовуються» новим керівництвом."

WBH_PUPPET_LEADER_NAME: "Зала Проклятих"
WBH_PUPPET_LEADER_DESC: "У найтемніших глибинах бункерів Братства вирують палаючі кузні. «Посвячені», захоплені з підкорених націй, тут працюють без відпочинку й піклування, з єдиною надією на «підвищення» — у вигляді смерті. Це — Зали Проклятих."

DES_PUPPET_LEADER_NAME: "Рейнджерське Командування"
DES_PUPPET_LEADER_DESC: "Мир не приходить швидко на землю, що ніколи його не знала — іноді потрібна й жорстка любов. Командування Рейнджерів поставило собі за мету встановити закон і порядок на нових територіях, і воно виконає цю справу як слід."

ENC_PUPPET_LEADER_NAME: "Департамент Відновлення"
ENC_PUPPET_LEADER_DESC: "Федеральний Департамент Відновлення не має особливого співчуття до мешканців пустки. Але поганий майстер звинувачує свої інструменти. І навіть якщо доведеться знищити або поневолити кожного мутанта на Божій землі — цивілізація повернеться до Америки."


