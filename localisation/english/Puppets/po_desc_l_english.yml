NCR_PUPPET_BARON_LEADER_NAME: "Барони НКР"
NCR_PUPPET_BARON_LEADER_DESC: ""

BOS_PUPPET_LEADER_NAME: "Зал Посвячених"
BOS_PUPPET_LEADER_DESC: "Хоча вони можуть з обережністю ставитися до чужинців, коли хтось потрапляє до їхніх лав, Братство Сталі ставиться до нього як до члена сім'ї. Зал Посвячених — це місце, де новонавернені члени Братства роблять перші кроки, щоб стати повноправними членами ордену."

CES_PUPPET_LEADER_NAME: "Administratio Imperii"
CES_PUPPET_LEADER_DESC: "Не кожне плем'я гідне стояти на рівних під знаком Бика, цю честь треба заслужити. Administratio Imperii має завдання створити нове суспільство зі старого, де знищення технологій, поневолення жінок і дітей, а також призов кожного працездатного чоловіка до Легіону — це лише початок їхнього благородного завдання."

TRL_PUPPET_LEADER_NAME: "Воля Першого"
TRL_PUPPET_LEADER_DESC: "Саме воля Першого керує всіма, від вождя до найнижчого раба. Завдяки його мудрості навіть слабкі та підкорені можуть підкоритися його волі та знайти нове життя в служінні спільній справі."

VLT_PUPPET_LEADER_NAME: "Наглядач"
VLT_PUPPET_LEADER_DESC: "Оскільки кордони Міста Сховища починають розширюватися, необхідно створити ефективну систему управління для наших нових підданих. Група лояльних громадян зголосилася 'наглядати' за життям цих людей, щоб забезпечити найбільшу користь як для міста, так і для науки."

VEG_PUPPET_LEADER_NAME: "Правила Хауса"
VEG_PUPPET_LEADER_DESC: "Кажуть, що найкращий уряд працює як бізнес, і Нью-Вегас бере це близько до серця. У міру того, як Стрип стає все більшим, усе і всі, хто не може принести гідного прибутку, без церемоній 'ліквідуються' новим керівництвом."

WBH_PUPPET_LEADER_NAME: "Зал Проклятих"
WBH_PUPPET_LEADER_DESC: "У найтемніших закутках бункерів Братства розташовані вічно палаючі темні ливарні. 'Послушники', залучені з підкорених народів у цю пекельну діру, працюють без відпочинку чи турботи, маючи лише надію на 'підвищення' до визволення смертю. Це — Зали Проклятих."

DES_PUPPET_LEADER_NAME: "Командування Рейнджерів"
DES_PUPPET_LEADER_DESC: "Потрібен час, щоб принести мир на землю, яка ніколи його не знала, а іноді потрібна й сувора любов. Командування Рейнджерів взяло на себе завдання навести закон і порядок на своїх нових територіях, і воно планує виконати цю роботу як слід."

ENC_PUPPET_LEADER_NAME: "Департамент Відновлення"
ENC_PUPPET_LEADER_DESC: "Федеральний Департамент Відновлення скептично ставиться до мешканців пустки, але поганий майстер завжди звинувачує свої інструменти. Хоча для цього може знадобитися вбивство і поневолення всіх до останнього мутантів на Божій землі, цивілізація повернеться до Америки."

