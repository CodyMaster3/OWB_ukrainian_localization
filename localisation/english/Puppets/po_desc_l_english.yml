l_english:
NCR_PUPPET_LEADER_NAME: "Територіальна Адміністрація НКР"
NCR_PUPPET_LEADER_DESC: "Територіальна Адміністрація НКР стала дедалі менш керованою, оскільки Республіка жадібно поглинає навколишніх сусідів. З усім тягарем, що лягає на неї — управління оподаткуванням, інфраструктурою, військовим призовом і правовою системою — за відсутності належного контролю, адміністрація перетворилася на силу, що живе за власними законами на кордонах НКР."

NCR_PUPPET_MILITARY_LEADER_NAME: "Військовий Уряд НКР"
NCR_PUPPET_MILITARY_LEADER_DESC: ""

NCR_PUPPET_EXPEDITIONARY_LEADER_NAME: "Експедиційний Уряд НКР"
