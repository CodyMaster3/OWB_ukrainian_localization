l_english:
NCR_PUPPET_LEADER_NAME: "Територіальна Адміністрація НКР"
NCR_PUPPET_LEADER_DESC: "Територіальна Адміністрація НКР ставала дедалі більш громіздкою в міру того, як НКР поглинала своїх сусідів. З огляду на важкі завдання з управління оподаткуванням, інфраструктурою, стандартами призову та правовими процесами за умови майже повної відсутності нагляду, ТА стала законом сама для себе на кордонах НКР."

NCR_PUPPET_MILITARY_LEADER_NAME: "Військовий Уряд НКР"
NCR_PUPPET_MILITARY_LEADER_DESC: ""

