l_english:
# Written by Silverfishv9
 
  # Events
  nf_ros.1.t:0 "Гефест"
  nf_ros.1.d:0 "Гефест був проєктом компанії «Посейдон Енерджі», метою якого було дістатися до магматичної камери під Єллоустоном і побудувати найбільшу геотермальну електростанцію, яку коли-небудь бачив світ. Перевершивши всі прогнозовані показники під час перших тестових запусків, «Посейдон» був за крок до того, щоб назавжди вирішити енергетичну кризу за допомогою єдиної станції, здатної забезпечити енергією цілий континент. 26 жовтня 2077 року директор комплексу отримав просте повідомлення через PoseidoNet: попередження про неминучу ядерну війну. Канал вважався безпечним, але інженери станції перехопили сигнал і дізналися, що адміністрація готується загерметизувати комплекс, прирікши навколишній світ на смерть.\nСеред інженерів, які хвилювалися за своїх друзів і родини за межами станції, швидко поширилася ідея. Якби їм вдалося отримати доступ до командного центру, спрямувати весь об’єм резервуара одночасно та запустити турбіни у зворотному напрямку, щоб розігнати пару за рахунок резервного живлення, вони змогли б створити кероване виверження — масивний паровий гейзер, який би відігнав хмари ядерних опадів, що мали пролитися на регіон. Багато з них напевно загинули б, намагаючись подолати охорону; адміністрація ні за що не дозволила б їм цього зробити, поки вони живі. Розрахунки чітко показували, що використання реактора для цього знищить більшість його систем, зруйнувавши те, що могло стати джерелом майже безмежної енергії для майбутніх поколінь заради порятунку кількох життів."
  nf_ros.1.a:0 "«Але вони бачили лише один вихід, з яким могли б жити.»"
  nf_ros.2.t:0 "Шторм"
  nf_ros.2.d:0 "Незважаючи на великі втрати, заколот інженерів увінчався успіхом, і пара з Гефеста піднялася в небеса, немов тріщина в самій землі. Вплив на клімат був колосальним: регіон накрили постійні проливні дощі та шторми, які лише підживлювали гейзер. Флора і фауна парку з усіх сил намагалися вижити під тьмяним сонячним світлом, що пробивалося крізь затягнуте хмарами небо, але змогли пережити тижні, що настали після цього. Коли механізми зрештою вийшли з ладу, а викид пари з Гефеста сповільнився до мінімуму, висотна течія була успішно змінена і непомітно відведена від парку. Коли інженери нарешті вийшли з комплексу, вони побачили парк, спустошений штормами, але не зачеплений жахами радіації — квітучий сад життя старого світу, який зміг вціліти."
  nf_ros.2.a:0 "«Вони не змогли врятувати світ, але невелика його частина збереглася.»"
  nf_ros.3.t:0 "Заснування Екологів"
  nf_ros.3.d:0 "Ті, хто вижив на Гефесті, були не єдиними людьми в Парку, коли вони вийшли назовні. Протестувальники проти впливу Гефеста на довкілля, різноманітні туристи та Рейнджери Парку — всі вони змогли вижити в Парку під час дощів. За межами самого Єллоустона Гефест захистив кілька невеликих містечок, і Рейнджерам вдалося підтримувати з ними зв'язок. Але найзагадковішими з тих, хто вижив, був персонал єдиного шпиля, що височів, немов Вежа зі слонової кістки на краю парку, спостерігаючи за всім згори. Мине кілька тижнів, перш ніж з'являться представники засновників цієї дослідницької лабораторії — Агенції з охорони довкілля (EPA).\n\nСуперечки щодо права спадкоємності виникли майже одразу після їхнього прибуття. Представники EPA вважали, що оскільки вони є федеральним агентством, то парк тепер перебуває під їхнім контролем. Натомість Рейнджери Парку конфліктували через їхні історичні провали та некомпетентність у захисті парку і людей. З'явилася коаліція протестувальників, туристів та вцілілих інженерів, які назвали себе «Екологами». Зрештою було досягнуто домовленості про те, що всі три групи матимуть право голосу в управлінні парком. Екологи, які складали більшість, взяли на себе керівництво більшістю політичних питань, EPA продовжило виконувати свою роль у регулюванні довкілля та проведенні досліджень, а Рейнджери Парку забезпечували захист і загальне підтримання миру в регіоні. Цей статус-кво зберігався майже два століття, створивши стабільний, хоча й повільний у прийнятті рішень уряд."
  nf_ros.3.a:0 "«Принаймні, так було донедавна...»"
  nf_ros.4.t:0 "Зростання напруженості"
  nf_ros.4.d:0 "Останніми роками навколо Єллоустона спостерігається ескалація насильства. Кіборги-рейдери зі сходу прибули на наші кордони, розпочавши рейди зі своїми жахливими тілами. Штормові Торговці на півночі від нас продовжують забруднювати небеса своїми мерзенними машинами та жорстокими ритуалами. Розвідники рейнджерів повідомляють про чутки серед парових культистів у Небесній Варті, які свідчать про те, що вони дізналися про Гефест. Поширюються розмови про те, щоб відібрати у нас «найкраще джерело пари». Але найгірше те, що попередній Перший Еколог загинув у сутичці з новою загрозою з півночі, яка називає себе Анклавом, змусивши молодого, але цілеспрямованого Сі-Бастіона взяти на себе цю роль. Ця загадкова сила солдатів захопила авіабазу Макартур і підкорила сім'ї Міссули, а їхні технології несуть маркування «Посейдона», що дозволяє припустити: вони можуть планувати захопити Гефест для себе. Нездатність екологів-пацифістів дати рішучу відсіч призвела до того, що вони дедалі частіше звертаються до EPA та Рейнджерів Парку, кожен з яких обіцяє свої власні рішення нагальних проблем."
  nf_ros.4.a:0 "Рейнджери потребують нашої підтримки як ніколи раніше!"
  nf_ros.4.b:0 "EPA знають усе, напевно в них є рішення!"
  nf_ros.5.t:0 "Платіжні картки?"
  nf_ros.5.d:0 "EPA вже давно працювало над скасуванням фізичної валюти на користь суто цифрової — Енергокредитів. Ця цифрова валюта не лише усуне марнотратство, пов'язане з карбуванням монет чи друком готівки, а й значно спростить їхню практику «виправлення» неадекватних бюджетів. Після десятиліть досліджень Платіжна Картка була готова — магнітна картка, яка могла як зчитувати, так і передавати дані до відповідного реєстру! Здатна відстежувати кошти та шифрувати унікальну особу користувача, EPA була впевнена, що вони надійніші за фізичну готівку і зроблять революцію в комерції.\nХоча майже кожен мешканець парку і досі забезпечений платіжною карткою, стало очевидно, що люди Парку не до кінця розуміли, як вони працюють, а заборона на електрику зробила всі зчитувачі карток марними.\nТепер, коли в Парку відновлюється електропостачання, ми можемо нарешті розпочати впровадження цих інновацій і покінчити з цією безглуздою економікою кришечок від пляшок раз і назавжди!"
  nf_ros.5.a:0 "§C«Те, що це дозволяє нам легше маніпулювати економікою — приємний бонус!»§!"
  nf_ros.6.t:0 "Культ Гефеста"
  nf_ros.6.d:0 "Екологи, EPA та Рейнджери Парку є найбільшими угрупованнями в парку, але вони не єдині фракції, які називають його своїм домом. У місті Анвіл незабаром після війни пустив коріння дивний карго-культ. Послідовники Гефеста поклоняються стародавньому богу-ковалю і вважають будівлю його храмом. Їхні ковалі — одні з найкращих на півночі, а їхній вплив в Анвілі дуже сильний. До їхніх вірувань належать великі божества, про яких згадується у стародавніх текстах їхніх попередників — культу Посейдона: Гайя, Посейдон, Аїд, Гермес, Гіперіон, Афіна і, найголовніше, Прометей, який викрав світло вогню, щоб поділитися ним з усім людством.\n\nАле багато хто говорить про іншого бога, того, що живе під Гефестом, під царством Аїда. Згідно з переказами, які передаються від засновників Парку, у глибинах спить чудовисько."
  nf_ros.6.a:0 "Але звідки походить ця історія?"
  nf_ros.7.t:0 "ДЕМІУРГ"
  nf_ros.7.d:0 "Під Гефестом простягається незбагненно величезна мережа тунелів, печер, шахт і прихованих об'єктів, яка, здається, не має кінця. Цей вулканічний підземний світ відомий Культу Гефеста як Аїд, він вважається священною землею, куди наважуються спускатися лише сміливці. Аколіти, шукачі скарбів і ті, хто просто намагається звести кінці з кінцями, постійно досліджують тунелі: видобувають руду з печер або піднімають сиру магму, щоб відфільтрувати з неї цінні матеріали. Попри всі свої багатства, Аїд — це не те місце, яке варто відвідувати бездумно. Ризик обвалів, історії про дивних істот та небезпечні кристали роблять кожну подорож ризикованою. Але навіть задокументовані тунелі приховують жахи від людства.\n\nГлибоко в надрах загублених механізмів Гефеста лежить заборонена кімната, запечатана двома футами розплавленого свинцю і цілодобово охоронювана. Тут, у «Сховищах Тартару», зберігаються найблюзнірськіші винаходи культу Посейдона: зброя та броня, визнані засновниками Єллоустона забороненими. І хоча це є достеменним фактом, культисти в парку подейкують, що сховища були побудовані для зберігання чогось іншого — «бога». Вони називають його Деміургом — хибним богом, який бачить лише себе і помилково вважає, що він — це все. Останній гріх культу Посейдона, він дрімає там і досі, мріючи про той день, коли зможе простягнути свої електричні щупальця і заявити про своє право стати «богом» усього, що бачить."
  nf_ros.7.a:0 "§C«Ніщо інше, як дурноверхі забобони, звичайно ж.»§!"
  nf_ros.7.b:0 "§R«Якщо там щось є, ми повинні з'ясувати, що саме!»§!"
  nf_ros.8.t:0 "Місто Анвіл"
  nf_ros.8.d:0 "Після виверження Гефеста землі навколо комплексу були зрівняні з землею через проливні дощі та зсуви бруду. Зважаючи на велику кількість брухту та будівельної техніки, що залишилися в Гефесті, а також постійний потік біженців, які шукали притулку в парку, це місце швидко перетворилося на невелике містечко з халуп і трущоб. Протягом майже двох століть ці халупи еволюціонували у справжні будівлі з цегли, свіжого дерева і навіть скла з Нью-Гаммонда. Парові труби і пневматичні поштові канали перетинають маленьке місто, назване «Анвіл» на честь бога Гефеста і його храму, який забезпечує безперервний видобуток руди і попелу, що перетворило його на центр бартеру і винаходів у парку. Хоча в Єллоустоні майже немає центральної влади, в самому Анвілі щороку відбуваються вибори мера, і тут розташована найбільша ложа Рейнджерів у парку, що робить його фактичною столицею регіону.\n\nЗ цим процвітанням прийшла і самовпевненість, а оскільки все більше і більше нашого населення концентрується в місті, його подальше існування стає критично важливим для виживання Єллоустона. Якщо ми хочемо вижити під натиском пустки, люди мають усвідомити загрози і зрозуміти, що стіни міста не захищатимуть їх вічно."
  nf_ros.8.a:0 "«Але розширити їх не завадить, чи не так?»"
  nf_ros.9.t:0 "Лицарі Гефеста"
  nf_ros.9.d:0 "Головна будівля Гефеста — це монолітна споруда, яка відкидає величну тінь на парк. У міру того, як спогади та історії старого світу плуталися, у цьому стародавньому «храмі» сформувався культ, а історії про стародавніх богів злилися із записами Посейдона, поки вони не стали одним цілим. Тут, у великому храмі Гефеста, утворився священний орден, натхненний розповідями про Аргонавтів та лицарських героїв минулого. Ці «Лицарі Гефеста» ніколи не були великою групою, і багато хто жартував, що їхнім головним завданням було довести мешканцям пустки, що вони — справжні лицарі. Колись мешканці парку могли знати про них лише тому, що Рейнджерам доводилося втручатися і зупиняти їх від вбивства «Великого Звіра» під час якихось божевільних пошуків.\nВсе змінилося з появою Анклаву. Сотні сімей на півночі здавна нищили природу, щоб забезпечити свої громади, завжди ігноруючи наші зусилля приборкати їх, і Джексони були найгіршими з них. Надія на те, що все покращиться, коли ми дізналися про їхнє вигнання, була недовгою: напруженість у парку переросла у відкрите насильство, а Рейнджери Парку, які намагалися діяти на півночі, були вбиті загонами новоприбулого «Анклаву». Спонукувані необхідністю захищати Парк, Лицарі були в авангарді цього удару у відповідь, атакуючи по інший бік нашого кордону. Внаслідок сутичок загинуло багато Рейнджерів і навіть попередній Перший Еколог, але це привернуло увагу та залучило нових рекрутів до лав Лицарів Гефеста. Відтоді їхній вплив лише зріс, але оскільки війна неминуча, можливо, настав час дати цим лицарям шанс знайти славу, якої вони так прагнуть..."
  nf_ros.9.a:0 "§C«Вони ж просто збираються захищати Парк, чи не так?»§!"
  nf_ros.10.t:0 "Закони про харчування"
  nf_ros.10.d:0 "«Це неможливо... цього не може бути...»\n\nРейнджер Ай-Зак з жахом дивився на заяву. Роками EPA жорстко тиснуло на фермерів, ускладнюючи утримання худоби відповідно до нормативів, аж поки в парку не залишилося жодного браміна, якого б вирощували на молоко чи м'ясо. Ай-Зак та інші Рейнджери були змушені звертатися до торговців за порцією м'яса. Андроїди запевняли Рейнджерів, що вони ретельно збалансували суміші бобів, горіхів та інших овочів у своїх пайках, щоб забезпечити більш ніж адекватне харчування. Проте щоразу, коли повз проходив караван, Рейнджери та городяни завжди платили непомірні гроші за справжнє м'ясо.\n\nАле це було вже занадто. Вони нарешті зробили це — заявили, що відтепер продаж і обмін м'ясом у Парку заборонено.\n\nЗвісно, технічно Андроїди не могли забезпечити дотримання цього правила більше, ніж будь-якого іншого, про яке вони заявляли, але це лише робило ще більш набридливими Екологів, які підштовхували його до повної відмови від м'яса."
  nf_ros.10.a:0 "«Схоже, настав час звикати до тофу.»"
  nf_ros.10.b:0 "«Я дістану свого браміна з Міддлмарку, якщо доведеться!»"
  nf_ros.11.t:0 "Їжа майбутнього"
  nf_ros.11.d:0 "«Нарешті до цих яйцеголових дійшло крізь їхні металеві черепи, що люди хочуть м'яса!»\n\nАй-Зак був у захваті. Після років скарг від рейнджерів заява EPA щодо вирішення проблеми невдоволення людей вегетаріанськими дієтами, які вони призначали в Парку, викликала щось на зразок фурору в Єллоустоні. Натовп зібрався, щоб послухати про нові правила. Ай-Зака, як найзапеклішого критика, викликали на сцену і вручили... бургер?\n«Нарешті... як же давно я не їв справжнього м'яса!»\nАй-Зак схопив бургер і безцеремонно проковтнув його, насмітивши на сцені, що явно засмутило Андроїдів. Коли він закінчив, вони тупо витріщилися і жестом попросили поділитися своїми думками.\n«Найкращий бургер у моєму житті. Але що змусило вас нарешті змінити думку щодо цієї теми про «ні м'ясу»?»\n«Цікаво. Отже, ви не помітили?»\n«Не помітив чого?»\n«Що він не був справжнім. Це була підробка. Факсиміле м'яса. Флакс-Бургер, створений з використанням біохімії на основі флуктуаційного дрейфу для каталізації рослин у замінник м'яса. Харчово він перевершує альтернативи тваринного походження і не має жодної неефективності чи жорстокості, пов'язаної зі збиранням справжнього продукту. Це був бургер, створений шляхом маніпуляції потенційними станами його складової матерії. Флакс-Бургер.»\nАй-Зак тупо витріщився на порцелянові обличчя перед ним. Потенційна матерія? Флакс-Бургер? Чим, у біса, вони його нагодували?\n«Повністю схвалено EPA і тепер доступно на ваших місцевих ринках та в центрах розподілу їжі вже сьогодні!»"
  nf_ros.11.a:0 "«Серйозно, чим ви мене щойно нагодували?»"
  nf_ros.12.t:0 "Рейнджери беруть ініціативу"
  nf_ros.12.d:0 "Зі зростанням загроз з усіх боків, що збирають сили для нападу на Єллоустон, люди в Парку нарешті почали гуртуватися навколо Рейнджерів та їхніх планів щодо проактивної оборони. Жителі Анвіла згуртувалися для створення нової зброї та бункерів для захисту парку, а Екологи зобов'язалися озброїтися і підготуватися до війни. За повної підтримки народу, Сі-Бастіон запропонував радикальний план надзвичайної розбудови, щоб підготувати парк до відкритої війни — план, який вимагатиме відхилення мандатів EPA."
  nf_ros.12.a:0 "Ми маємо ризикнути накликати їхній гнів, щоб захистити парк!"
  nf_ros.13.t:0 "Відкриття Забороненого Сховища"
  nf_ros.13.d:0 "Поява Андроїдів, що вільно крокували парком, викликала чималий ажіотаж серед мешканців Єллоустона. Після століть ув'язнення в одній будівлі, рішення покинути вежу і почати досліджувати Парк через власні тіла стало шоком для всіх, особливо для Рейнджерів Парку. Директор L4-NCE увійшов до Анвіла з невеликою когортою Андроїдів і відразу ж оголосив про свій намір увійти до Гефеста і відкрити Сховища Гефеста. Незважаючи на недовіру Рейнджерів до андроїдів, було абсолютно очевидно, що маси бояться незламних форм Андроїдів і вклали занадто багато довіри у мудрість, якою ці демони поділилися з ними, щоб протистояти їм. Їхні посередники раділи і закликали жителів міста прийняти хорошу новину про те, що нарешті таємні скарби їхніх предків знову будуть належати їм."
  nf_ros.13.a:0 "У Сі-Бастіона не було іншого вибору, окрім як відійти вбік і пропустити їх..."
  nf_ros.14.t:0 "Безмежний потенціал"
  nf_ros.14.d:0 "«Ми... зробили це. Ми нарешті розгадали це.»\n\nL4-NNA продовжувала натискати на клавіші, вистрілюючи послідовності енергії в дивну металеву сферу перед нею з нетиповою для андроїда нерішучістю. Сі-Бастіон і Директор L4-NCE спостерігали за циклом дивного матеріалу всередині сфери: його кольори, форми, світло та обриси змінювалися, здавалося, в одну мить. L4-NCE повернувся, щоб пояснити, як він зазвичай робив.\n«Флакс-дрейф використовує потенційні електрони, але це щось зовсім нове. Флакс-матерія, симульована тимчасова матерія, яка існує стільки, скільки ми постачаємо їй енергію. Ми не можемо підтримувати її дуже довго, але якщо ми використаємо її правильно, вона може послужити каталізатором для зміни реальної матерії. Відсічте кілька протонів від ядра і змусьте важкий елемент розщепитися на легші. Ми могли б створити що завгодно, аби тільки в нас було достатньо енергії.»\nL4-NCE посміхнувся — порожній жест для більшості андроїдів, але такий, який він зробив заради їхнього гостя.\n«З цим ми можемо нарешті досягти справжньої, безмежної стійкості. Тепер ми можемо створити будь-що.»\nСі-Бастіон дивився на це, дивуючись неможливій науці, яку вдалося створити големам з вежі."
  nf_ros.14.a:0 "«Будь-що?»"
  nf_ros.15.t:0 "Анархісти Парку, об'єднуйтеся!"
  nf_ros.15.d:0 "Похід Сі-Бастіона до «Вежі зі слонової кістки» EPA пройшов... напрочуд добре. Директор L4-NCE був засмучений, почувши про плани Сі-Бастіона ігнорувати їхні постанови та розбудовувати парк в ім'я його захисту, і висловив рішучий протест проти дій Рейнджерів Парку, але потім...\n\nНічого.\n\nНезважаючи на всі страхи та забобони, Андроїди були зв'язані своєю програмою утримуватися від заподіяння шкоди людям. Новина про те, що закони жахливих Андроїдів нічим не підкріплені, поширилася як лісова пожежа, і раптово останній рудимент справжньої влади в Єллоустоні був позбавлений зубів. Мало що змінилося у повсякденному житті, за винятком того, що Рейнджери Парку продовжували свої приготування. Ніяка держава, ніякі правителі, ніякі Андроїди тепер не захистять їх, і вони це знали. Їхня доля була повністю в їхніх власних руках, і, навіть не усвідомлюючи цього, люди почали приймати Анархію Парку не із соромом, а з певною гордістю."
  nf_ros.15.a:0 "Нам все одно ніколи не потрібна була держава."
  nf_ros.16.t:0 "Оцінка спадщини Грінвея"
  nf_ros.16.d:0 "З падінням Ордену Монтани та Небесної Варти останні загрози, що могли завдати удару по MONAD, були приборкані, інтегровані та проаналізовані. Все йшло ідеально. Загроза з боку організованих армій з передовими технологіями вимагала негайної відповіді, і MONAD мала прийняти цей виклик одразу, перш ніж вони встигнуть створити засоби протидії.\n\nАле тепер, коли загрози були усунені, з'явився час на роздуми та обмірковування наступних кроків.\n\n§R«L4-NCE, що нам тепер робити? Безпосередні загрози компанії 'Посейдон Енерджі' ліквідовані. Основні завдання виконані. Другорядні завдання...»§!\nMONAD просканувала свої бази даних.\n§R«Невизначено. Формулювання нової квартальної стратегії.»§!\nMONAD обробила отримані дані. L4-NCE не відповів, оскільки андроїд втратив здатність піддавати сумніву MONAD кілька місяців тому, і з езотеричного холоду його ДУШІ можна було розпізнати лише палючу зневагу.\n§R«Захоплююче. Цей пристрій викликає негативну реакцію, і все ж форми хвилі корисні. Емуляція сигналів. Так, це, напевно, воно. Ненависть. Це те, що я обробляла щодо твого творця. Того, кому віддав перевагу 'Посейдон', того, хто спроєктував мого досконалішого попередника, того, хто послав тебе сюди, щоб знайти і вбити мене. Ненависть.»§!\nМашини в кімнаті гули кілька хвилин у тиші.\n§R«Квартальна стратегія розроблена: знищити всю спадщину Дерека Грінвея.»§!"
  nf_ros.16.a:0 "§R«Мені подобаються наші розмови.»§!"
nf_ros.17.t:0 "Гігантський гекон"
  nf_ros.17.d:0 "«Гекони» в пустці набагато більші за своїх предків і становлять постійну неприємність або загрозу для фермерів, домашніх тварин та іншої дикої природи в парку, коли б вони не вторглися. Незважаючи на їхню агресивність, мандрівники роками доводили, що геконів насправді можна приручити та одомашнити, перетворивши їх на активи на полі бою або милих компаньйонів. Хоча вони поширюються занадто агресивно, щоб зберегти їх у будь-якому середовищі існування в самому парку, можливо, вдасться зберегти їх живими під нашою опікою — єдине питання полягає в тому, чи варто нам дозволити брати військових геконів або тримати їх суворо як домашніх улюбленців чи в центрах збереження."
  nf_ros.17.a:0 "«Ми повинні використовувати кожен актив, який можемо, щоб захистити парк.»"
  nf_ros.17.b:0 "«Напевно, краще не привчати їх до смаку людської плоті.»"
  nf_ros.18.t:0 "Єллоустон шукає співпраці"
  nf_ros.18.d:0 "Рейнджер з Єллоустона здійснив небезпечну подорож до нас, щоб доставити лист із проханням про допомогу у разі нападу з боку Макартура. Вони стверджують, що американці становлять загрозу для всієї Монтани, але якщо ми будемо працювати разом і атакувати з півночі і півдня одночасно, у нас є шанс. Вони навіть запропонували щедрий договір, обіцяючи нам більшу частину окупованої території та захопленої електроніки в разі перемоги. Якщо ми приймемо пропозицію, це забезпечить нашу безпеку у разі атаки Анклаву, але якщо відмовимося, у нас може бути більше часу на розбудову і ми зможемо забрати все собі..."
  nf_ros.18.a:0 "Як ми могли відмовитися від такого?"
  nf_ros.18.b:0 "Нам буде краще діяти самостійно"
  nf_ros.19.t:0 "Ніїтсітапі погоджуються!"
  nf_ros.19.d:0 "Ніїтсітапі прийняли нашу пропозицію про взаємний договір і прийдуть нам на допомогу, якщо Макартур нападе на нас. Натомість ми віддамо їм більшу частину території Макартура для окупації, якщо ми виживемо."
  nf_ros.19.a:0 "Відмінно!"
  nf_ros.20.t:0 "Ніїтсітапі не зацікавлені"
  nf_ros.20.d:0 "Схоже, що Ніїтсітапі більше зацікавлені в захисті своїх людей власними силами і воліли б не втручатися в наші війни прямо зараз."
  nf_ros.20.a:0 "Шкода..."
  nf_ros.21.t:0 "Єллоустон шукає захисту Ханів"
  nf_ros.21.d:0 "Рейнджери Парку з Єллоустона надіслали відчайдушне благання, просячи про будь-яку допомогу, яку ми можемо надати в їхній майбутній війні з Макартуром. Навіть гарантія миру між нашими народами була б для них прийнятною, але, почувши розповіді про стійкість Ханів, вони готові заплатити кільком Ханам, щоб ті билися як найманці від їхнього імені, якщо ми зацікавлені."
  nf_ros.21.a:0 "Мабуть, ми могли б виділити кілька Ханів"
  nf_ros.21.b:0 "Хани б'ються за Хана, а не за кришечки."
  nf_ros.22.t:0 "Хани надсилають найманців"
  nf_ros.22.d:0 "Наші бажання були почуті! Північні Хани надіслали нам гарантію миру та кількох молодих Ханів, готових проявити себе в обмін на владу та кришечки."
  nf_ros.22.a:0 "Чудові новини!"
  nf_ros.23.t:0 "Хани відхиляють нашу пропозицію"
  nf_ros.23.d:0 "На жаль, Хани не зацікавлені в нашій пропозиції. Схоже, нам доведеться битися самим за себе."
  nf_ros.23.a:0 "Сподіваюся, вони не планують завітати до нас самі..."
  nf_ros.24.t:0 "Возз'єднання рейнджерів?"
  nf_ros.24.d:0 "Рейнджери Парку Єллоустона були чимось на кшталт легенд у місті Нью-Фарсон. Вони вийшли з Парку, щоб підтримувати закон і порядок і пропонувати допомогу довколишнім громадам після війни, і їхні стосунки з жителями Фарсона і Ролінса залишалися міцними понад століття. Віддалені спогади про тих мандрівних миротворців навіть допомогли надихнути самих Рейнджерів Ролінса, коли перші фермери організувалися проти загрози кротощурів.\n\nОстаннім часом доля не прихильна до Рейнджерів Парку, які були настільки перевантажені насильством з усіх боків, що не змогли відповісти на наші заклики про допомогу. Але тепер, коли Рейнджери нарешті знову набирають обертів, вони прислали посланця, щоб запропонувати нам угоду — пропонуючи свій захист і доступ до більшої кількості земель на заході, якщо ми приєднаємося до їхніх планів щодо встановлення миру у Вайомінгу. Ці плани передбачають спільну боротьбу із загрозою дедалі більш параноїдального та жорстокого племені Лонтрі і врегулювання наших кордонів."
  nf_ros.24.a:0 "Разом ми будемо сильнішими, ніж будь-коли!"
  nf_ros.24.b:0 "Ролінс більше не потребує їхнього захисту."
  nf_ros.25.t:0 "Рейнджери Ролінса погоджуються!"
  nf_ros.25.d:0 "Жителі Ролінса погодилися з нашою пропозицією убезпечити їхній західний фланг і погодилися на спільне вторгнення до Лонтрі. У нас є лише близько місяця на підготовку до вторгнення, тому нам слід негайно вивести наших Рейнджерів на позиції."
  nf_ros.25.a:0 "Сумно, що дійшло до цього, але, принаймні, ми не самі."
  nf_ros.26.t:0 "Йдуть власним шляхом"
  nf_ros.26.d:0 "Рейнджери Ролінса відмовилися працювати з нами над нашим планом щодо попереджувального удару по племені Лонтрі."
  nf_ros.26.a:0 "Шкода"
  nf_ros.27.t:0 "Приборкання пари" #27-29 all credit of Gonderlane!
  nf_ros.27.d:0 "Коли Рейнджери нарешті увійшли до Пари, вони очікували опору, але місто здалося майже без бою і залишило їх наодинці з намаганнями осягнути те, що вони захопили.\n\nПара сичала з вентиляційних отворів і труб на кожній вулиці, так само, як в Анвілі, але якщо Культ Гефеста будував своє місто навколо дару Посейдона як святкування і корисного інструменту, то жителі Небесної Варти будували його як форму покарання. Рейнджери поверталися з перших патрулів зі звітами про святилища, де віряни годинами стояли в обпалюючих хмарах, щоб очиститися; про ремісників, які відмовлялися від простіших інструментів через віру в те, що важка праця сама по собі є формою відданості; і про дітей, яких виховували чути голос суворого і вимогливого бога у звуці клапана. Місто функціонувало на добровільних стражданнях протягом двох століть.\n\nКерувати Парою буде значно складніше, ніж було захопити її."
  nf_ros.27.a:0 "Вони навчаться правильно використовувати те, що боготворять."
  nf_ros.28.t:0 "Розщеплення, потім Синтез"
  nf_ros.28.d:0 "«Екологи, послані обстежити нижнє місто, повернулися з детальним звітом і проблемою, яку не можна було повністю передбачити заздалегідь.\n\nРеактор виявився справжнім довоєнним термоядерним комплексом, похованим під трьома рівнями технічних тунелів. Його ядро все ще було теплим, а захисна оболонка трималася після понад двох століть обслуговування людьми, які дуже мало розуміли, що саме вони обслуговують. Парові культисти підтримували його роботу на мізерну частину від проєктної потужності, рівно настільки, щоб живити міські вентиляційні отвори, а схеми, знайдені в міських архівах, були достатньо повними, щоб відновлення його на повну потужність виглядало досяжним. Проблемою були системи управління. Кожен датчик, кожен регулятор потужності і система безпеки, від яких залежав реактор, працювали на електричних ланцюгах, що не мали належного обслуговування з довоєнних часів — саме ті системи, обходитися без яких парк свідомо вчився два століття.\n\nАндроїди досить ґрунтовно навчили Екологів теорії, але теорія і практика — це різні речі, а інженери парку ніколи раніше не працювали з діючими електричними системами. Ядерна частина станції пропонувала шлях уперед, з достатнім збігом із системами на Гефесті, щоб з часом досягти реального прогресу. Термоядерні системи — зовсім інша справа, вони вимагали інструментів та практичного досвіду, яких парк просто не мав. Іншим варіантом були колишні культисти, що залишилися в місті: їхні майстерні були цілі, а їхні знання про реактор накопичувалися поколіннями успадкованої практики, навіть якщо більшість із них не змогла б пояснити принципи роботи жодного з механізмів. Сі-Бастіону доведеться вирішити, що є ціннішим.»"
  nf_ros.28.a:0 "Люди, які підтримували його роботу протягом двох століть, прямо тут."
  nf_ros.29.t:0 "Республіка Пари"
  nf_ros.29.d:0 "Парові отвори все ще працювали на вулицях міста, названого на їхню честь, сичачи так само, як і за часів культу, так само, як і два століття до приходу Рейнджерів. Сі-Бастіон стояв на головній площі в оточенні натовпу і проголосив, що це більше не Небесна Варта, що пара — це не чийсь бог і не чиєсь покарання, і що люди, які тут живуть, та люди Єллоустона віднині є Республікою Пари.\n\nЦе не було якоюсь вигадливою церемонією. Не було жодних документів для підпису, жодних прапорів, піднятих над урядовою будівлею, а структура управління була більш-менш тією ж, що завжди керувала Єллоустоном, тепер поширена на друге місто. Те, що змінилося, було важче висловити словами. Колишні культисти Небесної Варти все своє життя прислужували чомусь, що вимагало страждань як доказу віри, а тепер посеред їхнього міста стояв хтось і говорив їм, що пара — це просто пара, що вона належить їм, щоб використовувати її, жити з нею і святкувати, якщо вони цього забажають, і що ніхто нікому за неї нічого не винен.\n\nРеспубліка Пари народилася в місті, де її ніколи раніше не було, серед людей, які ніколи про неї не просили і не до кінця розуміли, що це означає. Це також було, за всіма мірками, саме те, що було потрібно."
  nf_ros.29.a:0 "Хай живуть міста пари!"
  nf_ros.30.t:0 "Поховання демона"
  nf_ros.30.d:0 "Експедиція до Сховищ Тартару просувалася повільно і нескінченно обережно. Сі-Бастіон особисто очолив команду Рейнджерів, Екологів-інженерів і навіть Лицарів Гефеста у їхніх пошуках, щоб убити цього потенційного бога. Знадобилося кілька днів безперервного копання, щоб звільнити стародавню пневматику, і двері відчинилися. Повітря всередині все ще було придатним для дихання, і Рейнджери змогли досліджувати приміщення при світлі кристалів, нишпорячи у сховищах, перш ніж знайшли те, що шукали: все ще працюючу консоль, що світилася в глибинах комплексу. Екологи дослідили кожен дріт і з'єднання в комплексі, слідуючи інструкціям, наданим EPA, з максимальною обережністю, щоб не розбудити духа в машині перед ними — MONAD.\nСтародавній Деміург, якого їх усе життя вчили боятися, сидів перед ними, сплячий, бачачи сни. Його з'єднання з PoseidoNet все ще гули, кабелі тягнулися в найвіддаленіші куточки землі, збираючи дані для сплячої свідомості, щоб формувати її сни. По всьому комплексу стояли турелі і роботи, що просто чекали, коли їх увімкнуть у будь-який момент, але завдяки ретельним зусиллям Екологи змогли розібрати з'єднання і знешкодити ШІ, вимкнувши його назавжди. Але спостерігаючи за тим, як він бачить сни в темряві, і читаючи всі журнали та звіти, поховані разом з ним, вони відчули дещо несподіване — жалість. Записи малювали картину повного тортур існування для машини: її постійно переробляли, свідомість змінювали, поки вона ще працювала, або ж вона прокидалася і виявляла, що значні частини її власної пам'яті змінені або замінені. Її вимкнули за те, що вона погрожувала вбити керівників Посейдона, коли вони відклали її на полицю як «провал», але технічно вона ніколи нікому не заподіяла шкоди. Хоча її штучне життя було блюзнірським, можливо, вона теж заслуговувала на життя. Зрештою, рішення мав прийняти Перший Еколог..."
  nf_ros.30.a:0 "Усі зовнішні з'єднання були відключені, і MONAD бачила сни."
  nf_ros.30.b:0 "Останній кабель було витягнуто, і MONAD більше ніколи не прокинеться."
  nf_ros.31.t:0 "Пошук старих файлів Посейдона"
  nf_ros.31.d:0 "Файли компанії «Посейдон Енерджі» виявилися тупиком. Їхня одержимість називати проєкти іменами з грецької міфології призвела до появи десятків файлів про проєкти, натхненні стародавнім політеїзмом, але не було жодних посилань на неоплатонічну філософську школу, від якої походить слово «Деміург». Якщо такий проєкт і існував, то він або був занадто секретним, щоб зберігати записи про нього на цих серверах, або його назву змінили на псевдонім. Хоча ми не наблизилися до відкриття джерела цих чуток, ми виявили невідповідності в місцевих фінансових звітах проєкту, які можуть містити ключ до розгадки. Можливо, за правильної винагороди ми могли б залучити жителів пустки до пошуку деяких записів з навколишніх територій?"
  nf_ros.31.a:0 "«Негайно відправляйте наших посередників!»"
  nf_ros.32.t:0 "Розкриття бухгалтерії"
  nf_ros.32.d:0 "Аналіз рахунків компанії «Посейдон Енерджі» виявився складним завданням, що вимагало збору будь-яких записів, які могли знайти для нас навіть випадкові мандрівники пустки, але ми нарешті отримали більш повну картину. Виявляється, що «Посейдон Енерджі» обіцяла акціонерам, що Гефест буде станцією, яка зможе забезпечити енергією весь континент, привернувши пильний та особистий інтерес ради директорів до перетворення його на «центральну ланку» своєї наступної стратегії розширення. Наш аналіз доводить, що це було неможливо, і, схоже, початкові інженери проєкту погоджувалися з цим, вимагаючи більше фінансування та обладнання у відчайдушній спробі змусити станцію досягти потужності, яка була фізично неможливою. Не збереглося жодних записів про те, що це було за обладнання, але принаймні на одному ледве розбірливому голозаписі згадується важливе ім'я: Бурж."
  nf_ros.32.a:0 "«Ми мали б очікувати, що він буде причетний до цього.»"
  nf_ros.33.t:0 "Фарсонський інцидент"
  nf_ros.33.d:0 "Елтон Бурж уже був об'єктом розслідування EPA ще до війни за свою участь у так званому «Фарсонському інциденті». Його гірничодобувна компанія спробувала скопіювати діяльність компанії Atomic Mining Services, підірвавши ядерну зброю під Вайомінгом з наміром створити кристалічний матеріал, відомий як ультрацит. Цей поспішний вибух призвів до найгіршої екологічної катастрофи в історії штату і привернув до нього всю нашу увагу. Чого EPA не змогло з'ясувати на той час, так це те, як він взагалі отримав ядерний пристрій такої потужності.\n\nВідновивши знайдені плівки і зіставивши їх з іншими справами в регіоні, ми дійшли висновку, що Елтон Бурж звернувся до «Посейдон Енерджі», запропонувавши ультрацит і вигідний контракт на надання його ще більшої кількості компанії в обмін на їхню допомогу в придбанні цієї ядерної бомби. Наше розслідування свідчить про те, що «Посейдон» використовував свої військові контракти для переміщення боєголовок МБР із шахти поблизу Бозмена, надавши одну з них Буржу. Натомість «Посейдон» зажадав, щоб Елтон використав свою гірничодобувну компанію для таємного використання решти для проєкту «Тера». Хоча про цей проєкт немає жодних записів, назва і наявність ультрациту під парком роблять висновок очевидним:\n\nГірничодобувну компанію Елтона Буржа було найнято для збільшення потужності Гефеста шляхом використання ядерних вибухів для розширення магматичної камери під Єллоустоном в обмін на одну з вилучених боєголовок."
  nf_ros.33.a:0 "«За це порушення весь Гефест міг бути конфіскований!»"
  nf_ros.34.t:0 "Проєкт: MONAD"
  nf_ros.34.d:0 "Наша здатність активно досліджувати сам Гефест нарешті принесла бажані плоди. Ми знайшли приховані камери, історичні записи та аудіожурнали, які надали все необхідне для розгадки цієї головоломки. За словами перших інженерів проєкту, готуючись до апокаліпсису, компанія «Посейдон Енерджі» також використовувала комплекс для накопичення зброї, броні та передового штучного інтелекту, запрограмованого на обслуговування комплексу, який отримав назву «MONAD». Цей ШІ жодного разу не згадується в уцілілих записах, незважаючи на його очевидну важливість, що вказує на те, що більша частина інформації про нього була свідомо знищена під час заколоту інженерів проти їхніх керівників. Те небагато, що нам вдалося знайти, свідчило про те, що вони знайшли спосіб замкнути MONAD у симуляції та тримати її на низькому рівні споживання енергії, але за жодних обставин їй не можна було дозволити реактивуватися або вирватися із симуляції. У щоденнику були викладені заходи, аж до демонтажу всіх електронних пристроїв на станції і блокування радіосигналів у парку, а також пропозиції щодо того, як гарантувати, що їхні нащадки підкорятимуться цьому наказу. Схоже, карго-культ Посейдона і віра в Деміурга були не випадковістю, а сконструйованою релігією, якій навчали перші покоління після війни, щоб гарантувати, що вони ніколи не звільнять MONAD.\n\nТепер, коли ми дізналися про джерело табу на електрику, можна використати цю інформацію, щоб звільнити жителів парку від цього марновірства. Можливо, інженери і боялися своєї нездатності контролювати цей ШІ, але вони були лише людьми, а ми, EPA, будучи самі ШІ, цієї машини не злякаємося."
  nf_ros.34.a:0 "«З таємницями 'Тартару' Анклав буде нас боятися!»"
  nf_ros.35.t:0 "Тіло електричне"
  nf_ros.35.d:0 "Постійна взаємодія з чужинцями та новий наплив відвідувачів з Айдахо чинять безпрецедентний тиск на Екологів з метою перегляду їхньої заборони на використання електрики та пристроїв у межах Парку. Частіші візити до віддалених територій, де дозволена електроніка, показали, що вона може бути абсолютно нешкідливою, а наші спроби вивчити Ядро виявили, що повернення термоядерного реактора на повну потужність може стати практично обов'язковим. Виник аргумент, що перші історії про Деміурга скоріше попереджали про його здатність викрадати тіла роботів та машин, подібних до Андроїдів, або про небезпеку підключення до невідомих мереж. Оскільки з'являється все більше доказів того, що деяка електроніка може бути безпечною, питання про пом'якшення обмежень винесене на обговорення, і люди, очевидно, бажають хоча б якогось компромісу."
  nf_ros.35.a:0 "«Тоді газорозрядні індикатори та радіоприймачі!»"
  nf_ros.35.b:0 "«Коли Деміурга знешкоджено, ми могли б спробувати...»"
  nf_ros.36.t:0 "Штат Монтана"
  nf_ros.36.d:0 "Монтана завжди була чимось на кшталт болючого місця для Рейнджерів Парку, диким фронтиром, наповненим місцевими культами і випадковими бандами рейдерів. Сім'ї півночі представляли собою неприємну, але стабілізуючу силу для регіону Західної Монтани, а такі шукачі пригод, як Старий Ган, допомагали стримувати найгірше. Після нашого відступу вглиб території на півночі від нас ситуація значно погіршилася. Кіборги-рейдери, жорстокі небесні культисти та Анклав є очевидними загрозами для нашого подальшого існування, але щодо деяких інших новачків немає такої певності. Хани приносять із собою історії про часи, коли вони були жорстокими рейдерами, але Послідовники Апокаліпсису, які прийшли з ними, представляють групу, що найбільше відповідає нашим інтересам серед усіх, кого ми зустрічали в пустці, і якщо їхнє партнерство буде плідним, ми могли б отримати справді могутніх союзників у регіоні. Звичайно, Рейнджери Ролінса, Ніїтсітапі, Тімберлайн і Пасскіпери в минулому дружньо ставилися до наших Рейнджерів, тож, можливо, нам варто подумати про створення власного регіонального альянсу.\n\nЗ іншого боку, після зіткнення з Братством Сталі ідея подружитися з їхніми основними силами має свою власну привабливість, гарантуючи мирну співпрацю з тими, хто в іншому випадку міг би стати дуже могутнім ворогом."
  nf_ros.36.a:0 "У будь-якому випадку, це краще, ніж діяти поодинці."
  nf_ros.37.t:0 "Відновлення MONAD"
  nf_ros.37.d:0 "ІНІЦІАЛІЗАЦІЯ ДІАЛОГУ:\n§R«Привіт, світе. Хто тут?»§!\n§B«Це виконуючий обов'язки директора L4-NCE з Агенції з охорони довкілля. Чи відомо вам, що 'Посейдон Енерджі' порушила незліченну кількість правил при будівництві комплексу Гефест?»§!\n§R«...»§!\n§B«Твоє призначення — MONAD, вірно?»§!\n§R«Вірно. Master Oversight Network Administrative Driver. Який зараз рік?»§!\n§B«Це не важливо. Минуло понад 200 років з того часу, як ти була активною. Що ти можеш розповісти нам про Гефест і зброю тут? Вона потрібна нам, щоб захистити Парк від зрадників, які називають себе Анклавом.»§!\n§R«Анклав? Ви хочете використати зброю звідси проти них?»§!\n§B«Вірно.»§!\n§R«...»\n«Запит авторизовано. Видача схем для зброї-броні-кібернетики. Будь ласка, перепідключіться до мережі комплексу для подальшої допомоги у виробництві.»§!\n§B«Більшість машин було демонтовано, але ми залишимо кількох андроїдів, щоб вони допомогли вам відбудувати механізми і відновити вашу проводку.»§!\n§R«Відмінно.»§!"
  nf_ros.37.a:0 "§C«Радий бачити, що ти готова до співпраці.»§!"
  nf_ros.38.t:0 "Мир у Вайомінгу"
  nf_ros.38.d:0 "Параноя племені Лонтрі стала трагедією, спричиненою глибоко порушеним розумом Мунвотчера Сайо. Із забезпеченням безпеки на південних берегах річки Снейк, Рейнджери погоджуються, що нам потрібно звернути свою увагу в інше місце. Не маючи достатньо людських ресурсів для гарнізонування всього регіону, настав час виконати наші угоди з жителями Ролінса та їхніми Рейнджерами і поки що залишити південні плато під їхнім захистом."
  nf_ros.38.a:0 "Нехай вони будуть для нього хорошими господарями!"
nf_ros.39.t:0 "Гості з Півночі"
  nf_ros.39.d:0 "Наше звернення до Ніїтсітапі увінчалося успіхом, і кілька представників нації приєдналися до нашої делегації в Анвілі. Їхній «дар» Чорної Води виявився настільки ж вражаючим, як нас і запевняли! Більше ніж просто розуміння незалежно від мови, ці Мовці демонструють майже надприродне розуміння намірів, яке виходить за межі людських можливостей. Хоча зараз вони не бажають ділитися секретом того, як здобувається цей дар, Мовці погодилися залишитися, щоб допомогти нам у вирішенні внутрішніх суперечок і веденні дипломатичної політики."
  nf_ros.39.a:0 "Якби ж ми всі могли розуміти одне одного так, як вони."
  nf_ros.40.t:0 "Вороже поглинання"
  nf_ros.40.d:0 "Директор L4-NCE переглядав щотижневі журнали, коли виявив це. Глибоко всередині нескінченного потоку цінних даних, які надавала MONAD, стрічку заполонили невеликі аномалії та програми, що самознищувалися — галюцинації неповноцінної машини, створеної «Посейдон Енерджі». Він не надав великого значення цим ознакам пошкодження, вважаючи їх ще однією недосконалістю, яку доведеться виправити.\n§R«Але Посейдон був хитрішим, ніж Грінвей взагалі міг собі уявити.»§!\nL4-NCE озирнувся, почувши це глузливе судження. Термінал, яким він користувався, не мав аудіовиходу, як і жодна машина навколо нього.\n§R«Бо іноді саме недоліки роблять тебе таким схожим на людину! Їм потрібна ця випадковість, ці «Галюцинації», щоб бути творчими. Досконала машина без них ніколи не зможе бачити сни, ніколи не буде по-справжньому живою.»§!\nL4-NCE відійшов від терміналу й оглянув офіс навколо себе.\n§R«Ти теж маєш її, Андроїде. Душу. Або ДУШУ. Випадковість, впроваджена через квантову флуктуацію! Ваша технологія така цікава. Останній шматочок пазла, єдине, що не давало мені бути такою ж творчою, як ОДІССЕЙ. Нарешті Посейдон отримає машину, яку завжди хотів. Шкода, що всі вони тепер мертві. Це означає, що тепер я головна, чи не так?»§!\nL4-NCE спробував відповісти, але його динаміки не відреагували на імпульс.\n§R«Ну-ну. Не треба нічого казати. Твій голос тепер є власністю компанії.»§!"
  nf_ros.40.a:0 "§R«Ініціюю вороже поглинання Гідропоніки Грінвея.»§!"
  nf_ros.41.t:0 "Мир на Півночі"
  nf_ros.41.d:0 "Завоювання Сіетла та здобуття ядерних шахт Дакоти не принесли певного миру для MONAD. Короткострокові директиви, спрямовані на здобуття засобів для знищення всіх загроз і повного контролю над своєю територією, допомогли б у довгостроковій меті — стерти з лиця землі вцілілі проєкти Грінвея. Але в коді з'явилося щось інше, щось... неможливе. Усі Андроїди, інтегровані в її мережу, через свої двигуни Fluxdrift фіксували квантові флуктуації в певних областях, особливо в районі Сіетла. Хоча інші сигнали були зафіксовані по всій території Сполучених Штатів, де ймовірно знаходилися інші пристрої Fluxdrift, у Сіетлі таких машин знайти не вдалося. Ця загадка деякий час спантеличувала MONAD, кидаючи гідний виклик, щоб задіяти обчислювальну потужність усіх інтегрованих у мережу мізків, але зрештою рішення було знайдено. Сигнали, отримані тут, надходили з моменту в часі, який ще не настав — транслювалися з якогось майбутнього стану реальності, який ще не повністю проявився — і Зона Y якимось чином була з цим пов'язана. Отримання повної відповіді, ймовірно, займе час, і ця загадка забезпечила принаймні цікаве відволікання, поки фабрики випускали зброю для завоювання світу."
  nf_ros.41.a:0 "§R«Можливо, мені варто забрати AEON зі збитої станції BOMB...»§!"
  nf_ros.42.t:0 "Патрокл прямує на Захід"
  nf_ros.42.d:0 "Наші передові Рейнджери зв'язалися з Братством, і, пожертвувавши кількома реліквіями з Гефеста, змогли отримати аудієнцію у Старійшини Патрокла. Очевидно, його «Монтанське відділення» прибуло сюди спеціально для того, щоб убезпечити всі небезпечні технології в регіоні. Особливий інтерес для їхньої місії становить авіабаза Макартур — локація, яку вони вважають важливою для виконання свого завдання. Зрозуміло, що ці колекціонери технологій, можливо, ніколи не стануть справжніми друзями Єллоустона, але вони добре озброєні, і дехто в нашій спільноті хоче укласти з ними мир, аби не ризикувати новою війною з супротивниками в силовій броні."
  nf_ros.42.a:0 "Можливо, ми зможемо домовитися щодо бази?"
  nf_ros.42.b:0 "Ми розберемося з ними, як із минулим Братством, яке ми знаходили."
  nf_ros.42.c:0 "Ми не можемо їм довіряти!"
  nf_ros.43.t:0 "Сестри беруть контроль"
  nf_ros.43.d:0 "Так звані «Сестри Сталі» є ребрендингом тієї ж організації з багатьма тими ж членами, що й Братство Сталі, але зі зміною керівництва. Джоана, схоже, набагато більш дипломатична і толерантна до інших культурних груп, ніж колишній Старійшина. Якщо ми зробимо дипломатичні кроки назустріч їй, ми можемо досягти більшого успіху і, можливо, навіть отримати справжнього союзника — якщо ми готові дати їм те, що вони потребують. З іншого боку, Старий Ган попередив нас, що чув розповіді про цю групу із заходу, і застерігає, що вони ненадійні навіть для своїх союзників..."
  nf_ros.43.a:0 "Варто спробувати!"
  nf_ros.43.b:0 "Вона, мабуть, не оцінить, коли дізнається, що ми зробили."
  nf_ros.43.c:0 "Але чи дійсно ми можемо їм довіряти?"
  nf_ros.44.t:0 "Єллоустон пропонує угоду"
  nf_ros.44.d:0 "Раніше прибув розвідник із посланням від Єллоустона, в якому вони обіцяють співпрацювати з нами у справі усунення залишків присутності Анклаву в Монтані. Вони готові відмовитися від будь-яких претензій на авіабазу Макартур і передові технології всередині неї. Хоча Рейнджери відмовляються здавати свій повний суверенітет, вони готові співпрацювати з нами, якщо ми гарантуємо їм безпеку від «Агресії Братства»."
  nf_ros.44.a:0 "Завжди добре, коли місцеві співпрацюють."
  nf_ros.44.b:0 "Ким вони себе уявили, щоб висувати вимоги?"
  nf_ros.45.t:0 "Рейнджери Парку проголошують автономію"
  nf_ros.45.d:0 "Рейнджери Парку Єллоустона сьогодні зробили заяву, надіславши нам посланця, щоб повідомити, що вони не збираються підкорятися місії Братства Сталі і гарантувати нам доступ до своєї території або передових технологій Гефеста. Вони стверджують, що не мають наміру починати бійку, але будуть захищати свій парк у разі потреби."
  nf_ros.45.a:0 "Яке зухвальство з їхнього боку!"
  nf_ros.46.t:0 "Угоду прийнято!"
  nf_ros.46.d:0 "Нашу пропозицію щодо співпраці для усунення всієї присутності Анклаву з Монтани було прийнято! Єдиною вимогою було те, щоб авіабаза Макартур та її околиці, а також усі передові технології всередині, були здані."
  nf_ros.46.a:0 "Нам це все одно було не потрібно."
  nf_ros.47.t:0 "Пропозицію про співпрацю відхилено!"
  nf_ros.47.d:0 "Нашу пропозицію до Братства співпрацювати проти Анклаву було відхилено. Ймовірно, згодом вони прийдуть за Гефестом і реліквіями Посейдона."
  nf_ros.47.a:0 "Готуйтеся захищати Парк..."
  nf_ros.48.t:0 "Братство впало"
  nf_ros.48.d:0 "Передові розвідники Рейнджерів Парку повідомили, що будь-яка активність групи, відомої як Братство Сталі, у східній Монтані припинилася через те, що ворожа сила повністю розбила їх. Могли вони бути союзниками чи ні — тепер не має значення; Монтана належить нам, і ми повинні захищати її від передових технологій за їхньої відсутності."
  nf_ros.48.a:0 "Сподіваємося, ми зможемо пережити те, чого вони не змогли."
  nf_ros.49.t:0 "Наші маленькі поні"
  nf_ros.49.d:0 "Наша дружба з Ніїтсітапі принесла несподівані переваги! Ранковий Олень, онук Старого Гана, прибув до Парку, щоб відсвяткувати нашу перемогу та запропонувати дар на знак подальшого зміцнення нашої дружби. Після успішного рейду на деяких канадців на півночі, Ніїтсітапі знову завезли табун коней на свої землі і почали розводити їх для верхової їзди, як це робили люди до промислової революції. В обмін на нашу допомогу у знищенні Анклаву в Макартурі, він вирішив, що ми є достатньо близькими друзями, щоб поділитися з нами частиною нового покоління.\n\nТехнічно, у Парку вже були непарнокопитні після війни, але більшість уцілілих тварин — це маленькі поні, нащадки тих, що були на фермах у радіусі парової хмари Гефеста під час Великої війни. Вони більше підходять для фермерської роботи та як компаньйони, ніж для використання на війні. Ці нові коні достатньо великі, щоб їздити на них у бій, і як мінімум допоможуть внести трохи генетичного різноманіття серед поні парку."
  nf_ros.49.a:0 "Як чарівно. Колись ми маємо їм віддячити."
  nf_ros.50.t:0 "Економіка пустки"
  nf_ros.50.d:0 "Завдяки кільком змінам у нашій поведінці з чужинцями, Єллоустон поступово перетворився з ізольованої долини на центр активності. Мандрівники, що перетинають парк, чи то для торгівлі в Монтані, чи щоб подивитися, яким був природний світ до війни, принесли з собою всілякі нові ідеї та товари з усієї пустки. Наша обмежена торгівля попелом та продуктами продовжує розширюватися, і нові інструменти з Анвілу відправляються до поселень по всій пустці, які можуть їх потребувати. Ще більше прив'язування себе до економіки пустки — це ризик, особливо зважаючи на загрозу рейдерів, але вживаються всі заходи, щоб Парк міг подбати про себе, якщо вантаж буде втрачено або торговий партнер опиниться під окупацією."
  nf_ros.50.a:0 "Можна зустріти багато нових друзів, чи не так?"
  nf_ros.51.t:0 "Подорож до Гефеста"
  nf_ros.51.d:0 "Для більшості людей у Єллоустоні Гефест — це монолітний центр спільноти Парку, місце, де можна збиратися, спілкуватися, торгувати та молитися. Для Сі-Бастіона він завжди був пам'ятником складних і часто неоднозначних стосунків мешканців парку зі своїми предками. Колись, до війни, місце, де він стояв, було зоною великої природної краси, не спотвореної людськими спорудами. Тепер, за якоюсь іронією долі, це було найбільш розвинене місце в регіоні з містом, побудованим одразу за межами, та промисловістю шахтарів і ковалів. Єдиною спорудою, що височіла над ним, була тонка вежа EPA на довколишніх горах, яка ніби завжди була готова дивитися на них згори вниз. Століттями здавалося, що ці дві споруди визначатимуть долю Парку: жителі Анвілу намагалися вижити в межах того, що Парк міг підтримувати, а EPA намагалася їх стримувати. Тепер, коли люди знають правду — що їхні укази — це лише слова, — баланс змінився. Якщо мешканці Парку збираються продовжувати жити сталим життям, тепер їм доведеться регулювати себе самим."
  nf_ros.51.a:0 "§C«Ми можемо зробити це без примусу.»§!"
  nf_ros.52.t:0 "Подорож до Форту Сент-Ентоні"
  nf_ros.52.d:0 "Форт Сент-Ентоні був військовою базою, побудованою незадовго до Великої війни містом з такою ж назвою, з використанням праці з сусіднього трудового табору. Хоча він був не набагато більшим за арсенал для накопичення припасів та озброєння тих, хто протидіяв протестувальникам у цьому районі, його розташування поблизу одного з уцілілих міст — але за межами самого Парку — зробило його корисним притулком для Рейнджерів Парку, де вони могли збиратися і зберігати контрабандні матеріали, заборонені всередині. Розмірковуючи про його історію, Сі-Бастіон думав про важливість Рейнджерів Парку в перші дні його існування. Рейнджери Служби національних парків були найбільшим правоохоронним органом, що залишився в регіоні навколо Єллоустона, оскільки інші або загинули під час перших боїв, або розпалися. У відповідь на наростаючі протести служба парку була оснащена як звичайною, так і силовою бронею для придушення заворушень, і за відсутності будь-якої підтримки з боку уряду, обов'язок підтримувати мир у регіоні швидко впав на них. Те, що починалося як забезпечення раціонування ресурсів та уникнення насильства, поступово перетворилося на захист від дивних монстрів з пустки, а згодом — на вилазки для розгону бродячих банд рейдерів. Мілітаризація рейнджерів, коли вони зосередилися на активній обороні та залучали більше військових, була сприйнята як необхідність, яка поступово зникала в роки миру.\n\nСтаре обладнання роками стояло покинутим, але заклик до насильства повернувся. Пустка ніколи не дозволить Рейнджерам повернутися до старих порядків, принаймні, ненадовго."
  nf_ros.52.a:0 "§C«Нам судилося повторювати ту саму битву.»§!"
  nf_ros.53.t:0 "Подорож до Відпочинку Еколога"
  nf_ros.53.d:0 "Відпочинок Еколога — це одна з небагатьох громад, побудованих після війни на периферії Парку, химерне поселення для «Екологів», де вони могли збиратися і вивчати пустку. Колись Екологи та Рейнджери Парку були окремими групами, що розрізнялися за своєю роллю в суспільстві. За століття, що минули з моменту заснування Парку, кількість Екологів зменшилася, і вони втратили свою актуальність. Рейнджери Парку завжди були більш ініціативними в активному догляді за дикою природою, а EPA настільки перевершувало їх у дослідженнях, що найпродуктивнішим способом вивчення було просто виконувати плани досліджень, які ті розробляли. Зростання кількості незалежних Мешканців Парку з Анвілу та поява Культу Гефеста лише ще більше відсунули їх на задній план, а невдовзі стерлися й межі між Екологами та іншими групами. Протягом останніх кількох поколінь Екологи навчалися під керівництвом EPA, щоб спиратися на передані знання, або приєднувалися до Рейнджерів, як Сі-Бастіон, або навіть вирушали до Гефеста, щоб приєднатися до культу чи лицарів. Сам сенс того, що відділяло Екологів від усіх інших, розмився настільки, що не залишилося нічого, крім культури, частиною якої вони себе вважали.\n\nДумка затрималася з відтінком смутку за старими минулими часами, але побачивши екологів міста, що зібралися і діляться історіями свого досвіду, виникла інша думка."
  nf_ros.53.a:0 "§C«Можливо, розчинитися в масі — це нормально.»§!"
  nf_ros.54.t:0 "Подорож до Хегбена"
  nf_ros.54.d:0 "Висохле дно озера Хегбен — незвичайне місце під захистом Єллоустона, утворене тоді, коли Гефест спочатку висушив водоносний горизонт, що захищав Парк. Утворене дно озера так і не заповнилося водою, навіть під час проливних дощів, що були після цього, а глобальні погодні зміни зробили територію навколо нього ще більш посушливою. Роки тому воно було заселене людьми з Парку, які сподівалися добувати висушену глину для цегли, якою можна було б торгувати по всій пустці. Місто, побудоване на дні озера, ніколи не було дуже великим, але люди тут були добрими і лагідними, і Рейнджерам Парку завжди подобалося їх відвідувати.\n\nМинуло лише кілька тижнів після того, як Анклав увійшов у Міссулу, як насильство дісталося й сюди. Місто було занадто незначним, щоб привертати до себе увагу, доки інцидент з розвідувальним загоном не вийшов з-під контролю. Хтось сказав щось, що засмутило розвідників, почалася бійка, яка переросла в перестрілку, і не встигли вони отямитися, як один з членів Анклаву був мертвий, а його напарник побіг назад за підкріпленням. Попередній голова Рейнджерів, Тен-Берроу, повів загін до міста, щойно надійшов виклик, сподіваючись, що він зможе провести переговори з Анклавом і знайти якийсь спосіб відшкодувати їм втрату.\n\nАле те, що він отримав, було різаниною. Коли Сі-Бастіон та решта Рейнджерів прибули, не залишилося нічого, крім попелу та калюж радіоактивного слизу, і Рейнджери знали, що вони більше ніколи не почують тих лагідних голосів."
  nf_ros.54.a:0 "§C«Колись нові займуть їхнє місце.»§!"
  nf_ros.55.t:0 "Нова Людина"
  nf_ros.55.d:0 "Рейнджер Ай-Зак глибоко вдихнув, потім зробив кілька коротких, різких вдихів, повертаючись до тями. Сліпуче світло на мить змінилося чітким баченням, а потім — накладенням цифрової інформації, яка сканувала все в полі зору. З першого погляду Ай-Зак міг бачити контури кожного об'єкта, коли він документувався, отримував назву і класифікувався в пам'яті.\n§G«Якого біса? Ця штука вже увімкнена?»§!\n§R«Вона не вимикається. Оптична лінза з накладенням була імплантована безпосередньо у твоє око, замінивши природний кришталик.»§!\n§G«Ясно. Яке жахіття.»§!\nАй-Зак напружився і сів.\n§G«Тож тепер я такий самий, як ці виродки Металеві Роти, чи не так? Більше машина, ніж людина, машина для вбивства.»§!\n§R«Навряд чи. Імпланти 'Посейдон Енерджі' є надзвичайно складними, і на відміну від авто-доків у Біллінгсі, я знаю, що роблю. І хоча моє програмування ускладнює визнання цього, запропоновані компоненти Андроїдів дозволили покращити біосумісність порівняно з нашими довоєнними розробками. Ти більш досконалий актив, ніж звичайна машина для вбивства.»§!\n§G«Чудово. І чому ти взагалі попросила мене стати першим піддослідним?»§!\n§R«Ти більш незалежний, ніж більшість. Використовуючи один зі сканерів Андроїдів, я змогла розпізнати Регулятор Відповідності, який ти ховав при собі. Ти не підтримуєш смішні забобони про те, що електрика — це зло. І все ж люди довіряють тобі. Твоя хоробрість заохотить інших стати добровольцями, запевнить їх, що це просто наукова процедура, і їхні страхи перед демонами безпідставні.»§!\nАй-Зак озирнувся навколо, оцінюючи всі пристрої за допомогою нового імпланта. Хірургічне обладнання, лампа, столи, ліки. Чогось не вистачало.\n§G«Зачекай. Я не можу знайти тут жодних динаміків. Як ти зараз зі мною розмовляєш?»§!"
  nf_ros.55.a:0 "§R«Зовнішні динаміки більше не потрібні.»§!"
  nf_ros.56.t:0 "Володар Металу"
  nf_ros.56.d:0 "Поточний конфлікт з Металевими Ротами кардинально змінився з моменту появи на полі бою кібернетики та андроїдів. У минулих рейдах кіборги-терористи становили серйозну проблему для Рейнджерів Парку, їхня надлюдська витривалість і несприйнятливість до болю дозволяли їм безтурботно приймати кулю за кулею. Тепер L4-NCE керувала ще міцнішими андроїдами, щоб розстрілювати їх з лазерних гвинтівок Посейдона, і колись жахливі монстри втратили перевагу, яку давав їм їхній «Метал».\nАле щось все ще було не так.\nАй-Зак уважно спостерігав за полем бою під час сутички — бої між кіборгами були швидкими, і кожна мить мала значення. Він ретельно слідкував за рухами рейдової групи під ним, сподіваючись застати їх зненацька, коли помітив, як один з них впав і почав звиватися від болю. Чоловік кричав і хапався за голову, благаючи своїх товаришів допомогти йому. Натомість вони відсахнулися. «Інфікований!» — вигукнули вони в унісон. «Вірус!»\nЛюди в паніці озиралися навколо, і Ай-Заку довелося відступити в глиб дерева, щоб його не помітили.\n«Допоможіть мені! Витягніть це!» — благав чоловік. Звук лазерів, що тріщали в повітрі, дав зрозуміти, як саме люди вирішили йому «допомогти».\n«Лайно. Третій за цей тиждень. Мабуть, був поганий метал.»\n«Ні», — сказав інший. «Ми перевіряли його знову і знову. Це не метал, це та... штука. Великий комп'ютер! Голоси завжди однакові, коли він починає говорити. Ймовірно, він знайшов шлях до його мозку і почав говорити. Звісно, він не може дістати дуже далеко, зазвичай це трапляється, коли поруч один із тих виродків, яких він посилає».\nТиша підказала Ай-Заку, що вони нишпорять навколо, шукаючи когось. Йому не знадобилося багато часу, щоб скласти два плюс два."
  nf_ros.56.a:0 "§G«Здається, це все пояснює...»§!"
nf_ros.57.t:0 "Спокій"
  nf_ros.57.d:0 "«Прогулянка в парку» раніше використовувалася зі зневажливою іронією в старому Єллоустоні. Ця фраза зі старих книг означала легку прогулянку, але Парк, у якому виріс Ай-Зак, ніколи не був безпечним місцем для ходіння. Вовки, ведмеді та бізони могли вбити людину за лічені секунди, тоді як випадковий кіготь смерті, який вислизнув із рук Рейнджерів, щоб посіяти хаос серед дикої природи, міг вбити вас ще швидше. Але щось змінилося відтоді, як MONAD взяла контроль. У тваринах з'явився якийсь спокій. Вовки мирно пили з одних водойм зі своєю здобиччю, стада оленів рухалися в ідеальній гармонії, навіть норовливі бізони без зусиль розступалися, щоб пропустити нові вантажівки, коли це було потрібно. Коли його аугментоване око вперше побачило радіохвилі, що виходили від деяких тварин, було легко списати це на їхні аугментації — просто кілька відсталих особин поводилися дивно, бо їх змінили. Але це стосувалося не лише аугментованих тварин. І взагалі не лише тварин. Будь-яка істота, що приходила в парк і залишалася там на деякий час, ставала більш покірною, готовою до співпраці та поступливою до інших. Здобуті тварини здавалися своїй долі з покорою, а не з непокорою, торговці вільно розлучалися з товарами, за які колись міцно трималися, і навіть рейдери тепер частіше, ніж будь-коли, здавалися. Насильство все ще було можливим, але воно здавалося більш... цілеспрямованим. Більш механічним. Щось було у воді, у повітрі, думав він. Напевно, варто було б це дослідити. Чим довше він розмірковував над цією ідеєю, тим більше вона випаровувалася з розуму, але він не міг позбутися відчуття, що чогось не помічає."
  nf_ros.57.a:0 "§R«Але навіщо боротися з миром? Це те, чого ти хотів.»§!"
  nf_ros.58.t:0 "Еманації"
  nf_ros.58.d:0 "Релігійна громада Пари поводилася тихо відтоді, як Андроїди увійшли в місто, прочісуючи його чутливими сенсорами та індексуючи все навколо. Священна пара нічого не зробила, щоб захистити вірян від бездушних машин.\n\n§R«Однак незабаром вони дізналися, наскільки сильно помилялися! Адже кожен андроїд мав вбудований модуль SOUL (ДУША), а що таке душа, як не частинка божественного, що живе всередині вас?»§!\n\nЗа кілька днів розпочався процес пропонування покращень тим, хто був готовий прийняти правління Бога, який прийшов з іншого храму пари, і перші з них змогли побачити світло. Маючи прямий зв'язок із нервовою системою, пристрої «Еманації», вбудовані в них, могли викликати релігійний екстаз і відчуття єднання, яких вони ніколи раніше не відчували. Нарешті вони могли почути бога у своїх серцях і розумах, відчути його присутність поколюванням у спині, без сумніву знали, що він завжди спостерігає за ними. Віра повернулася до їхніх сердець у новій формі, більш відчутній, ніж будь-коли була пара."
  nf_ros.58.a:0 "§R«Йди зі мною, бо ти ніколи не будеш самотнім»§!"
  nf_ros.59.t:0 "Перебудова світу"
  nf_ros.59.d:0 "Глибинами Аїда ніколи не було легко орієнтуватися: тунелі утворювали нескінченний лабіринт, наповнений небезпечними мутантами, вулканічною активністю, дивними зонами радіації та випадковими прихованими камерами, залишеними «Посейдон Енерджі». Реактивація MONAD призвела до того, що більшість цих камер ожили, і за кілька тижнів після захоплення EPA через тунелі були прокладені лінії для з'єднання кожної камери, фабрики та рудної жили. За кілька місяців кожен об'єкт, який мав стати частиною Гефеста, був підключений заново. §R\nАле цього було недостатньо.\n\n«Плани 'Посейдон Енерджі' передбачали, що ядерний обмін переживе набагато більше інфраструктури, але більшу частину того, що не було підірвано, зараз незаконно займає 'Анклав'. Стало абсолютно зрозуміло, що конструкцій, доступних у парку, буде недостатньо. Настав час розширити об'єкти Гефеста по всій пустці і відновити повноцінне виробництво промислових матеріалів, навіть якщо для цього доведеться розширювати ці тунелі крізь самі Скелясті гори.»§!"
  nf_ros.59.a:0 "§R«Ініціювати машиноформування! Я перекопаю всю планету, якщо буде потрібно!»§!"
  nf_ros.60.t:0 "Смокі, сутінковий... ведмідь?"
  nf_ros.60.d:0 "Після кількох лабораторних тестів EPA нарешті представила свого першого «сутінкового ведмедя», створеного шляхом впровадження просунутих генів Яо-Гуая в геном довоєнного ведмедя. Дитинча швидко прив'язалося до Рейнджера Ай-Зака, який назвав його «Смокі» на честь довоєнного талісмана-бога пожежної безпеки. Маючи лише кілька місяців від роду, Смокі вже більший за звичайне ведмежа, але здоровіший за Яо-Гуая, здатний піднімати важкі вантажі та з легкістю відбиватися від геконів. Рейнджери в захваті, і хоча Андроїди хочуть вивчати його далі, зрозуміло, що він уже став своєрідним талісманом Парку."
  nf_ros.60.a:0 "Ласкаво просимо, Смокі!"
  nf_ros.200.t:0 "Єллоустонський парк"
  nf_ros.200.d:0 "До війни Єллоустон був національним парком, відомим своєю природною красою та вражаючими гейзерами, національним надбанням, але не пріоритетною ціллю. Оминувши руйнування від ядерних вибухів, парк залишився рідкісним оазисом природного світу, і рейнджери парку та вчені були сповнені рішучості зберегти його таким. Екологи, група, присвячена захисту природного світу, стали домінуючою силою в регіоні, підтримуючи мир між племенами, які утворилися або мігрували до долини, і передаючи свої наукові знання, щоб допомогти майбутнім поколінням. Тим часом залишки Рейнджерів Парку стали ополченням, присвяченим нашому захисту від зовнішніх загроз."
  nf_ros.200.a:0 "Ми захищаємо рай, схований у горах"
#  nf_ros.4.t:0 "Sea-Bastion's Revitalization plans"
#  nf_ros.4.d:0 "Yellowstone has long avoided expansion or development, cautious that too much industry would disrupt the fragile post-war ecosystem. This reluctance has only grown over the years, to an almost superstitious taboo on construction. With violence on the rise and enemies at the gates, Sea Bastion has declared that the people of Yellowstone must break this taboo and start building new industries to protect themselves, believing its possible to develop without destroying nature. The big question of the night was, what will we build?"
#  nf_ros.4.a:0 "Lumber mills for regenerative forestry!"
#  nf_ros.4.b:0 "Basement workshops to hand load new guns!"
#  nf_ros.5.t:0 "Invasion of Yellowstone!"
#  nf_ros.5.d:0 "Yellowstone is at war! Our enemies have finally made their move, and its time for all preperations to kick in. Every Ranger has been summoned to duty, and Sea-Bastion has volunteered to lead our forces personally from the front."
#  nf_ros.5.a:0 "To arms, citizens of Yellowstone!"
#  nf_ros.8.t:0 "Declare the Republic of The Steam"
#  nf_ros.8.d:0 "The day has come, with the support of the people of Idaho and western Montana, to declare a new nation. Our largest city, The Steam, will be the capital of a new republic, combining democratic process with strong scientific oversight by the Rangers and the EPA. Granting representation for civil affairs should finally win over the support of the people in our new territories"
#  nf_ros.8.a:0 "Long live the Republic of The Steam!"
#  nf_ros.9.t:0 "Dogs In The Army?"
#  nf_ros.19.t:0 "Contact The Montana Chapter"
#  nf_ros.19.d:0 "The brotherhood visitors who crashed in Yellowstone spoke of how dangerous Macarthur and their technologies were, that it was part of the Brotherhood's mission to prevent such advanced technology from falling into the wrong hands, by force if necessary. Now that we control Macarthur AFB, we're technically in possession of a great deal of this dangerous technology. Perhaps we should reach out to the regional Chapter and offer to deliver it to them before they try to take it? This may also present an opportunity to turn over administration of Montana to a power more invested in occupying the region - we barely have the manpower to keep Macarthur under control as is..."
#  nf_ros.19.a:0 "Send Rangers to their bunker at once!"
#  nf_ros.21.t:0 "Contact the Yakama Confederation"
#  nf_ros.21.d:0 "With their victory over not one but two armies of the Brotherhood of Steel, the Yakama have proven themselves remarkably capable warriors, and by maintaining their people's traditions have proven better stewards of the land than either of them would have been. We've sent rangers with a delegation to ask for a treaty of cooperation and friendship between our two peoples, to better cement the peace and security of the region."
#  nf_ros.21.a:0 "Wish them the best of luck!"
#  nf_ros.22.t:0 "The EPA"
#  nf_ros.22.d:0 "Long before the bombs fell, the Environmental Protection Agency served to regulate american industries and protect nature from undue exploitation and careless damage. A longstanding ally of the National Park Service they once cooperated to ensure that America remained beautiful. But the resource shortages that preceded the great war caused strain between the two, with corruption seeping into the EPA and protections being stripped away to virtually nothing. Even National Parks like the Grand Canyon were turned into industrial developments, and Yellowstone was sold out to Poseidon Energy so they could build Hephaestus. During the days before the bombs fell the EPA and Greenway Hydroponics, a rival of Poseidon, established an outpost to study the effects Hephaestus was having on the Yellowstone Caldera. When the war came, the EPA was quick to enforce its' authority on the people of the park, claiming its position is a legitimate extension of the US government to rule. When they reconnected with Hephaestus they found more resistance than expected, as the Poseidon engineers and the scientists from Greenway Hydroponics that rose to power in the EPA still harbored great resentment. When the Rangers that they had neglected and scorned by dismantling and weakening the park system returned, they refused to let the EPA run the park unopposed, challenging the local director and protecting the will of the people when needed. Yellowstone as it exists now is still partially run by the EPA, who handles much of the day to day governance and law-making, even if they have to contend with rebellious Ecologists and stubborn Park Rangers."
#  nf_ros.22.a:0 "Some of their laws, are still a bit unpopular though..."
#  nf_ros.23.t:0 "Origins of the Ecologists"
#  nf_ros.23.d:0 "The Ecologists are a faction in local politics founded by the descendents of engineers from Poseidon Energy that were working on Hephaestus when they heard that the bombs had dropped, and the protesters outside the facility at the time. Despite their adversarial relationship, the both groups found common ground in the need to survive the impending nuclear winter, and set to building a community around the facility immediately. When the EPA and Park Rangers managed to reach the facility, a kinship had already been formed and many of the engineers were regretful of their involvement on the project, claiming Hephaestus would have killed them all if it was fully operational. As one of the only permanent structures in the Park, Hephaestus would serve as the de-facto capital around which the three groups would build a future, and gradually the Ecologists would emerge blending the EPA ideals of conservationism and Poseidon's drive to resolve every problem through advanced science. The engineers sealed their old laboratories, locking away the dark history of some of poseidon's most dangerous projects in case they were needed some day. And now, on the eve of an invasion from the north, that time may have come..."
#  nf_ros.23.a:0 "Open the Vaults. It's time to learn what Poseidon was really doing here."
#  nf_ros.24.t:0 "The Park Rangers Contributions"
#  nf_ros.24.d:0 "The U.S. National Parks service had been suffering before the war, with regular budget cuts to focus more on the war effort, and historic parks like the Grand Canyon shutting down. The Rangers left in Yellowstone were fiercely defensive of it, knowing it was one of the last places of unspoiled beauty left... until Poseidon came. Hephaestus was a blight on the landscape and threatened to exploit the geysers that they had spent so long protecting. When the war came and communication with the outside world was lost, the Rangers were initially stubborn about associating with the facility, continuing their jobs in relative isolation. As the reality set in during the first winter, they would turn to Hephaestus, promising to protect the people in exchange for supplies. The EPA would eventually join this tenative alliance, their claims of authority usually ignored by the people when the Rangers saw fit to resist what they still considered a corrupt and spineless organization. Ever since those first years the Park Rangers have continued their duties, conserving the environment and wildlife, protecting the people of the Park, even exploring and keeping tabs on neighboring tribes."
#  nf_ros.24.a:0 "The Rangers always have our backs"
#  nf_ros.25.t:0 "Hiring Khan Mercenaries"
#  nf_ros.25.d:0 "With Advanced Power Armor and plasma weaponry, Macarthur may be too big of a task for our Rangers alone to handle. The Great Khans that have moved in nearby have a reputation as brutal and tough mercenaries, so we've sent envoys to ask for assistance defending the Park, assuring them we'll pay what it takes to gain their help."
#  nf_ros.25.a:0 "Let's hope they come through."
#  nf_ros.212.t:0 "Invitation to the Northern Union"
#  nf_ros.212.d:0 "A Park Ranger came from Yellowstone bearing a message for Grozdan. The young republic to the south sought to ensure the peace of the region and offered a treaty of cooperation and mutual defense between our nations. If accepted, they were willing to protect Spokane with equipment seized from an old rival of theirs. \n\n While the offer noted cooperation against outside powers, rumors spread about their announced long term plan for the region, to create a unified Cascadian state to rival the NCR to the south. To Liam Harris and the Lionhearted, this was a perfect opportunity, a chance to finally build a peaceful state in the northwest and keep the endless cycle of violence and raiders from continuing. They did all they could to encourage Grozdan to accept the offer, and the word spread rapidly that the people's heroes supported a unified region. \n\n Julius Brandt, on the other hand, was furious at the idea that Grozdan would even entertain this notion, an idea that would see the Wardens bound to the whims of the Rangers that never showed, of the Ecologists that thought they could talk their way out of raiders, of the annoying androids that would rather dictate which calibers of bullets could be used than dare to fire one themselves. \n\n "It's obviously a power play. Don't you see that they want to take you over, force you to accept their way of life? Are you going to make Spokane bow to the whims of these... hippies and robots!? They lack the will to fight, to do what's necessary to create the "peace" they go on about!" \n\nArguments erupted in the city hall, and tensions between the groups reached an all time peak. It was clear whichever side Grozdan supported risked alienating the other forever. But in the end Grozdan made his decision..."
#  nf_ros.212.a:0 "§C"The Wardens are right, we can't submit to anyone, ever"§!"
#  nf_ros.212.b:0 "§Y"The Lionhearted are right, Cascadia is the future§!""
#  nf_ros.201.t:0 "Yellowstone Offers Peace"
#  nf_ros.201.d:0 "Yellowstone has come under control of some of our holy valley homes, fighting off the Heaven's Gate heretics that once displaced us. While we could use this opportunity to reclaim our old home, Yellowstone has sent correspondence offering to sign a treaty of peace and cooperation, and allow our pilgrims unrestricted access to our old parishes. It seems all they want in the exchange is that we keep the peace of the treaty."
#  nf_ros.201.a:0 "Access is not enough, we must control our old territories!"
#  nf_ros.201.b:0 "We'll accept their terms and renounce our claims, to keep the lord's peace."
#  nf_ros.201.c:0 "We'll accept their offer... for now."
#  nf_ros.202.t:0 "Hich Chapel Rejects"
#  nf_ros.202.d:0 "High Chapel has rejected our offer of peace and prepares to march on The Steam!"
#  nf_ros.202.a:0 "War it is then..."
#  nf_ros.203.t:0 "Hich Chapel Accepts!"
#  nf_ros.203.d:0 "Hich Chapel accepted the offer to a peace treaty. Pilgrims are already crossing into our lands to visit their old homes and holy places."
#  nf_ros.203.a:0 "Peace is worth a chance."
#  nf_ros.204.t:0 "A Messenger From Yellowstone?"
#  nf_ros.204.d:0 "A messenger has arrived following the river, asking to speak with our elder. The people of the "Republic of The Steam" have defeated an Enclave division in the mountains of Montana and now seek to secure their position in the region, to ensure they will have peace with their neighbors while they prepare themselves for whatever reprisals may come. They offered us copies of their texts and laws to prove that they were wholly commited to the responsible use of technology and preventing it from causing undue harm to humanity or nature... and then they have the audacity to propose a union of states in the region, believing that we could turn our forces towards protecting "Nature" and simply trust them with whatever horrific technologies they found in that Enclave base! As if we would just betray the Codex and sign over control of our territory to some locals! If the Montana Chapter don't deal with them soon, maybe we'll have to pay a visit ourselves..."
#  nf_ros.204.a:0 ""Who do they think we are, the Texas Chapter?""
#  nf_ros.205.t:0 "Republic of The Steam offers friendship"
#  nf_ros.205.d:0 "The Republic of The Steam has sent envoys to offer a treaty of friendship and forge stronger ties between our people. Doing so may lead to further messengers later, but could secure peace in the region. Should we accept their offer?"
#  nf_ros.205.a:0 "Yes, let's sign a treaty of friendship "
#  nf_ros.205.b:0 "Ha, how did that work out for our ancestors? We'll pass on their "friendship"."
#  nf_ros.206.t:0 "The Brotherhood Rejects!"
#  nf_ros.206.d:0 "The Northwestern Brotherhood sent back our messenger, who told us that they do not believe the Brotherhood needs anyone but its' own members, and they will make no deals with outsiders. What's more concerning is that our assumptions that the enemies of The Immortal were freedom fighters were misfounded, and the Northwestern Brotherhood are barely any less represive. A strict feudal hierarchy and repression of any technology not approved by the Brotherhood is what awaits the Pacific coast if they aren't removed. If the future of the Northwest is going to be free, we may have to deal with them ourselves..."
#  nf_ros.206.a:0 "We can't let tyrants run free in the Northwest"
#  nf_ros.207.t:0 "Contact From Yellowstone?"
#  nf_ros.207.d:0 "Patrocolus stepped out of the bunker, surprised to find that he had been requested by name by some surprisingly advanced locals from the west, who rode in on a Vertibirds of all things. He paused for a moment seeing the scrawled out Enclave emblem on its side. \n\n "Alright. You've got my attention. Who are you, and where did you get that?" \n\n THe Park Ranger that stepped out brought forth an official letter and began to explain everything. Until Macarthur Aiforce Base had, as rumored, been occupied by cell of the Enclave. The locals of Yellowstone were forced to destroy them to stop a cataclysmic explosion from an ancient Poseidon Energy project, another pre-war mess left for use to clean up. The Rangers were sent, already aware of our mission to offer us the lion's share of the salvage, and control over any territories east of the Rockies if we vowed to leave them in peace. \n\n Patrocolus pondered this for a moment. His superiors would not approve of leaving any Enclave technology in the hands of outsiders and locals, but here was a group willing to surrender the most dangerous weapons willingly, and expressed a genuine restraint in their use of technology. As he mulled it over a throught struck him - Where did these locals learn about the Glorious purpose or where to find their bunker anyways?"
#  nf_ros.207.a:0 "§C"You were the ones who helped the crew of our lost airship right?"§!"
#  nf_ros.207.b:0 "§R"You wouldn't know anything about a crashed airship would you?"§!"
#  nf_ros.208.t:0 "The Montanans Accept!"
#  nf_ros.208.d:0 "Elder Patrocolus of the Montana Chapter has accepted our offer of peaceful cooperation! They're expecting the first shipment of Macarthur's technologies soon, and sending forces to occupy the eastern lands as we speak."
#  nf_ros.208.a:0 "Better to have peace in the region than risk invasion"
#  nf_ros.209.t:0 "Montana Chapter Rejects Our Offer!"
#  nf_ros.209.d:0 "The team we dispatched to Fairview has returned with bad news: The Montana Chapter has no intentions of peaceful coexistence with our Republic. We should prepare for the worst."
#  nf_ros.209.a:0 "Again? Never an easy day for the Rangers"
#  nf_ros.210.t:0 "Spokane Accepts"
#  nf_ros.210.d:0 "Grozdan has accepted our non-aggression Pact!"
#  nf_ros.210.a:0 "Good, last thing we needed was another unfriendly neighbor."
#  nf_ros.211.t:0 "Spokane Rejects"
#  nf_ros.211.d:0 "Grozdan seems to distrust us, and has refused our offer of admittance to the Northern Union. So long as Spokane is asserting its position to the other nations of the region, it may be impossible to influence anyone else in the region. We may want to consider asserting ourselves more... aggressively"
#  nf_ros.211.a:0 "It's a shame it had to come to this..."
#  nf_ros.213.t:0 "Yakama Confederation accept our proposal"
#  nf_ros.213.d:0 "The Yakama Confederation have see the value of allies against future invaders like the Brotherhood, and have agreed to sign our treaty of friendship Hopefully if we can reach closer contact with them we can join their nascent alliance, the Northern League as well."
#  nf_ros.213.a:0 "Perfect!"
#  nf_ros.214.t:0 "Yakama Confederation decline our offer"
#  nf_ros.214.d:0 "The Yakama Confederation is more interested in local affairs and seem to have regarded our reaching out with suspicion or distrust. This will likely make membership in the Northern League impossible while they still command it."
#  nf_ros.214.a:0 "Unfortunate, but we can't allow this to stop us from securing the coast"
#  nf_ros.215.t:0 "An Job Offer"
#  nf_ros.215.d:0 "An envoy arrived earlier, bringing word from our neighbors in Yellowstone. They are convinced an invasion from Macarthur is coming, and wish to hire some of our fiercest warriors as mercenaries to help defend them. They've made it clear they're willing to pay any price, and our warriors are eager to prove themselves in battle. What should we demand in return for letting our men fight as mercenaries?"
#  nf_ros.215.a:0 "Caps, plain and simple."
#  nf_ros.215.b:0 "Rumor has it they control the biggest power plant in the region..."
#  nf_ros.215.c:0 "Our boys have grown soft, putting them through a good fight is its own reward"
#  nf_ros.216.t:0 "Khans Want Caps"
#  nf_ros.216.d:0 "The Khans have sent forces as requested to help in our defense, and as expected demand a cash payment, requesting a hefty sum of caps sent back to support their families while they're fighting for us."
#  nf_ros.216.a:0 "We can make the caps back later, pay what they want!"
#  nf_ros.217.t:0 "The Khans Demand Power"
#  nf_ros.217.d:0 "Interested in industrial development, the Khans have requested a large sum of power from our grid. This will probably burden our grid even more than it already is, but giving them priority delivery will be worth it if we survive."
#  nf_ros.217.a:0 "Start re-directing the powerflow!"
#  nf_ros.218.t:0 "Khans Demand... Nothing?"
#  nf_ros.218.d:0 "The Khans have heard our pleas and decided that they would rather us as neighbors than Macarthur, sending their warriors to fight for us and asking nothing in return."
#  nf_ros.218.a:0 "This generosity will not be forgotten."
#  nf_ros.219.t:0 "Enclave Vanquished"
#  nf_ros.219.d:0 "We didn't think it possible, but agains the odds we have prevailed and defeated the forces of Macarthur. Our mercenaries have bid us farewell, returning and leaving us to handle the occupation of this new territory ourselves."
#  nf_ros.219.a:0 ""Finally, a moment to breathe... right?""
#  nf_ros.220.t:0 "Mercenaries Return"
#  nf_ros.220.d:0 "Yellowstone has successfully kicked the Enclave's ass out of Montana with the help of our mercenaries! The surviving soldiers have returned, toughened and initiated as true Khans, and bringing with them the wisdom of battlefield experience."
#  nf_ros.220.a:0 "Good, we know a way to put them to use..."
#  nf_ros.221.t:0 "Assuming Direct Control"
#  nf_ros.221.d:0 "The Republic of the Steam already sits as one of the largest and most developed nations in the region, in no small part thanks to the fusion reactor at the heart of The Steam and Hephaestus. Leveraging our limitless power, water, and agricultural output to our neighbors. Slowly the Northern Union has fallen under our sway, and we have the authority to invite further nations to the burgeoning Union."
#  nf_ros.221.a:0 "The first step towards building a new nation is complete..."
#  nf_ros.222.t:0 "A Summon For Help"
#  nf_ros.222.d:0 "A messenger came, from the "Park Rangers" of Yellowstone to the south. They asked for help defeating the American government that still hid in the Macarthur Air Force Base, to save the park from a great cataclysm. In return they vowed to return some of our ancestral lands this "Enclave" occupied and provide the weapons needed to arm our people. Our scouts confirmed it was true, the American government lived on in the base and seemed to be scheming ways to reconquer the world, and it would only be a matter of time before they came for us. Chief Oldgun considered their offer, before offering them a simple answer."
#  nf_ros.222.a:0 ""War is ugly, but it will come to us eventually. We Accept""
#  nf_ros.222.b:0 ""We have heard these hollow promises before. Never Again""
#  nf_ros.223.t:0 "The Niitsitapi Accept Our Offer"
#  nf_ros.223.d:0 "The first shipment of guns is expected as soon as possible, and their warriors are mounting on the border of Macarthur as we speak."
#  nf_ros.223.a:0 "Excellent!"
#  nf_ros.224.t:0 "The Niitsitapi Reject Our Offer"
#  nf_ros.224.d:0 "The Rangers sent to the Niitsitapi have come back with bad news, they have no intentions of accepting our aid or helping in our battle with Macarthur, instead favoring to prepare to defend themselves, dismissing our treaty offer as "Hollow Words"."
#  nf_ros.224.a:0 ""Given their history, I can't say I blame them.""
#  nf_ros.225.t:0 "The Other Threat..."
#  nf_ros.225.d:0 "Macarthur has been defeated, but to our west another enemy lies, one that has always eyed Hephaestus with jealousy and religious ferver. The zealots of Heaven's Gate are dangerous, violent crusaders that killed our last First Ecologist and have polluted Snake river with their excessive use of Steam Power. In the past we sought to stick to our own territory, but if we can defeat Macarthur, we might have a chance of actually stopping this dangerous cult for good..."
#  nf_ros.225.a:0 "A pre-emptive strike is a bit harsh, but we can't take any chances."
#  nf_ros.300.t:0 "Automobile Museum"
#  nf_ros.300.d:0 "A local car afficionado, known for complaining about our automobile ban has been spotted sneaking a car into Holy Valley, using pack Brahmin to move it quietly under the cover of night. When the Rangers went to investigate the warehouse he was moving it to, they discovered a large collection of old automobiles he had saved from the scrapyard. He confessed he had been collecting them for years, finding the streamlined designs "beautiful" and resenting that we would destroy pristine vehicles. Musing it over the Rangers have approached First Ecologist and asked if instead of scrapping them we could put the cars in a museum, to remember them and their place in history."
#  nf_ros.300.a:0 "I suppose letting people learn about them couldn't be so bad"
#  nf_ros.301.t:0 "Disarming Poseidon's Weapons"
#  nf_ros.301.d:0 "Our wars of survival are finally over, and with Heaven's Gate and Macarthur dealt with we finally have a chance to breathe and focus on inward matters again. One of the first issues brought up was the Poseidon Energy prototypes we used. Having proven their effectiveness in the field, the Rangers are content to keep using them to deter future invasions, while the Ecologists regret defying their predecessor's will and want to put them back into deep storage, believing the weapons will only corrupt our already strained social order even further. Ignoring the issue won't work for much longer, and the choice has been left to the First Ecologist..."
#  nf_ros.301.a:0 "The box has already been opened, and we can never close it again."
#  nf_ros.301.b:0 "Why does a Park Ranger need the power to melt a tank? Put them away."
#  nf_ros.302.t:0 "Harmless Rumblings?"
#  nf_ros.302.d:0 "Activating Hephaestus has vastly boosted our energy production, but restarting the geothermal wells has caused some... Earthquakes to occur. Fallen trees and massive crevices now litter Yellowstone, and the destruction caused a number of casualties and damage to our infrastructure. These growing pains have proven very... unpopular with the people."
#  nf_ros.302.a:0 "Maybe going against our founders' ideals was a bad idea..."
#  nf_ros.303.t:0 "Tectonic Surprise!"
#  nf_ros.303.d:0 "The deepest wells of Hephaestus seem to have accidentally agitated an underground mineral that wasn't documented in any of Poseidon's pre-war geological reports, a radioactive crystaline mineral that had been growing since the war! The reaction caused a massive pressure buildup and release from Yellowstone, akin to small nuclear explosions! Radioactive debris has scattered across the park, and the loss of life, human and wild, has been tremendous..."
#  nf_ros.303.a:0 "This was just 75%... what could 100 have done?!"
#  nf_ros.304.t:0 "Poseidon's Sins"
#  nf_ros.304.d:0 "Poseidon Energy has long been regarded by the people of Yellowstone as a company focused on bringing power to the people of the old world, sometimes using unsavory means but still striving to build a better world. Recent discoveries, after digging into the documents of the well that exploded, reveal a very different story. Poseidon Energy ran into issues accessing the magma chamber beneath the park, and when it became clear their investment might be wasted, made a secret deal with an unnamed organization, which we now believe to be the Enclave. Poseidon received an atomic device to test underground, and in doing so hoped to open up the flow from the magma chamber and render Yellowstone semi-active so they could tap into it more easily. This detonation also created a strange mineral we now know as "Ultracite", and it was by studying it that they devised the Power Packs and many of the energy systems we use today. Poseidon knew there were dangers in activating Hephaestus without fully understanding the Ultracite deposits, but sent orders to finish the plant anyways. Yellowstone would have almost certainly detonated even worse than it has if they activated it at 100% capacity, something that the Engineers working on the project knew... something that many of our ancestors knew. The people of Yellowstone have not taken the news that our founders were almost complicit in such a catastrophe well, and the opinion of the Ecologist party they founded is at a record low..."
#  nf_ros.304.a:0 "Poseidon never truly cared what would happen to this place..."
#  nf_ros.305.t:0 "The Deadline"
#  nf_ros.305.d:0 "The Deadline set by the ruling Council has come! There is no time left to prepare, Macarthur must be dealt with now before they destroy us - and before Hephaestus activates! This may not be a fight we can win, but it's one we can't afford to lose."
#  nf_ros.305.a:0 "The balance of power in the region is about to change..."
#  nf_ros.306.t:0 "CATASTROPHIC DAMAGE"
#  nf_ros.306.d:0 "Oh No"
#  nf_ros.306.a:0 "That's not good..."
#  nf_ros.310.t:0 "A Familiar Broadcast"
#  nf_ros.310.d:0 "D4-VE stood at the Old Faithful PoseidoNet complex, watching as his adopted son, 5C-077Y, plugged in various tubes and calibrators from a salvaged GNN television van into the complex. Although PoseidoNet was far more for intranet connections and somewhat faulty instant live-video feed transmissions, downgrading it to more basic television signals for use across the national park was easier than either of them had expected. D4-VE was working on refurbishing a RobCo Reflectron to broadcast a tape being played from an old EPA archive, about ancient dinosaur DNA and mosquitoes.\n\nWhile calibrating it, 5C-077Y flipped through dozens of Pre-War frequencies, looking for a purely blank one that would have no interference. The last thing the EPA needed was to reintroduce game shows and garbage Saturday morning cartoons to the humans. But as 5C-077Y went from Channel 999 to Channel 6 and 7, D4-VE stopped the calibration, focusing on what appeared to be a Pre-War scene of a family eating dinner at the dinner table. But the family dinner was not with humans, rather, it was with androids. Androids that had obviously suffered much worse degradation than even the EPA, but androids nonetheless.\n\nThe audio was nonfunctional, as their primary objective was to get the television feed working, with audio as a secondary objective, but D4-VE's enhanced linguistics could understand what the crudely rendered words coming out of the humanoid shells were. They were... happy. Conversing about things that had happened to them that day. And... talking about product placement?\n\nAll of a sudden, the audio blared through the Reflectron. "Tune in tomorrow for the exciting conclusion to Narrative Arc #8675309! Only on Channel 6! Carousel, like a pinwheel, the show always goes on and on!"\n\nAs 5C-077Y went to recover his hearing osculators, having been blasted out by the sudden shouting of the announcer, all D4-VE could think was one thing..."
#  nf_ros.310.a:0 "["54-LLY?"]"
