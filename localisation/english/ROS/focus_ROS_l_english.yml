l_english:
# Written by Silverfishv9
  # National Focuses
  ROS_hephaestus:0 "Гефест"
  ROS_hephaestus_desc:0 "Століття тому, коли Велика війна досягла свого апогею, вчені та інженери проєкту «Гефест» мали обмаль часу на підготовку до ядерного апокаліпсиса. Але завдяки швидкому мисленню вони вирішили долю парку."
  ROS_origin:0 "Екологи"
  ROS_origin_desc:0 "Наш довоєнний реактор «Гефест» є причиною більшої частини нашого процвітання, обігріваючи наші домівки та освітлюючи наші ночі. Його історія, однак, сягає корінням у небезпечний довоєнний проєкт, який міг зруйнувати парк — і все ще може."
  ROS_invasion:0 "Неминуче вторгнення"
  ROS_invasion_desc:0 "Війни спалахують по всій пустці, і з витоком нашої найбільшої таємниці у зовнішній світ здається неминучим, що Єллоустон буде втягнутий у війну зі своїми сусідами, або, принаймні, так вважають Рейнджери. Екологи неохоче визнають це — як перед людьми, так і перед самими собою — але все очевидно..."
  ROS_park_rangers:0 "Згуртувати Рейнджерів Парку"
  ROS_park_rangers_desc:0 "Старі Рейнджери Парку досі виконують багато важливих функцій у Єллоустоні: координують захист від небезпек пустки, підтримують закон і порядок, а також дбають про крихку екосистему, що залишилася в парку. Підтримка їхнього плану з укріплення парку — єдиний спосіб гарантувати нашу безпеку."
  ROS_new_deal:0 "Містобудування"
  ROS_new_deal_desc:0 "EPA все ще визнає необхідність збереження парку, але все ще залишалися території, виділені під майбутнє будівництво житла для працівників, плани на яке «Посейдон» мав і повністю затвердив ще до війни. Дозвіл на будівництво цих об'єктів дасть трохи більше простору, щоб зосередити Анвіл виключно на важкій промисловості, і утримає людей у менш жалюгідних умовах."
  ROS_cult_of_hephaestus_focus:0 "Культ Гефеста"
  ROS_cult_of_hephaestus_focus_desc:0 "За століття, що минули з моменту порятунку парку, Гефест став чимось набагато більшим, ніж просто електростанція. Тепер він височіє як найбільший храм у всьому Єллоустоні, де місцева громада збирається для поклоніння богу кузні."
  ROS_electrophobia:0 "Деміург"
  ROS_electrophobia_desc:0 "Глибоко під землею, у прірві в самому серці Єллоустона, лежить камера, запечатана за шістьма футами розплавленої сталі. Всередині спочиває Деміург — фальшивий бог, великий ворог усього живого. Тільки найсміливіші шахтарі наважуються проходити повз його гробницю."
  ROS_EPA:0 "EPA"
  ROS_EPA_desc:0 "Серед усіх жахів старого світу EPA стояло осібно як єдина організація, що протистояла жадібним корпораціям, які прагнули експлуатувати матінку-Гею заради власної вигоди, або принаймні так вони стверджують. Якщо Андроїди з вежі справді є спадкоємцями цієї традиції, нам було б розумно прислухатися до їхніх вимог."
  ROS_civil_path:0 "Зосередження на цивільному плануванні"
  ROS_civil_path_desc:0 "Єллоустон швидко зростає, і разом із цим зростанням приходить потреба в більшому. Більше будинків, більше їжі, більше одягу, більше світла — більше всього. Екологи визнають, що споживацтво і недбала забудова були одними з найбільших недоліків старого світу, тому ми повинні приділити час, щоб переконатися, що наш розвиток може задовольняти зростаючі потреби екологічно чистим шляхом."
  ROS_arm_citizens:0 "Тримай гвинтівку під рукою"
  ROS_arm_citizens_desc:0 "Люди Єллоустона зазвичай мають одну чи дві рушниці, щоб захистити свої сім'ї від кігтів смерті, ведмедів і навіть випадкових бізонів, які створюють проблеми в парку. Але із загрозою військового вторгнення настав час переконатися, що кожен Мешканець Парку озброєний і навчений захищати свій дім від професійної армії."
  ROS_medicine:0 "(Не)природна медицина"
  ROS_medicine_desc:0 "Жителям Єллоустона не чужа медична наука, але матеріали для виготовлення довоєнних препаратів рідкісні та дорогі. Природні ліки з використанням трав та холістичні методи лікування є звичайним явищем для середньостатистичного Мешканця Парку, тому EPA запропонувало просто покращити цілющі властивості рослин навколо парку, а не будувати нові хімічні заводи."
  ROS_war_path:0 "Заповнити арсенали"
  ROS_war_path_desc:0 "Війна не є популярною ідеєю в Єллоустоні, але коли вона приходить до нас, ми не маємо іншого вибору, окрім як захищати себе і довкілля, яке ми охороняємо. Пам'ятайте стару приказку скаутів: Будь готовий."
  ROS_agriculture:0 "Інвестиції в сільське господарство"
  ROS_agriculture_desc:0 "Вулканічний ґрунт Єллоустона підтримується родючим завдяки періодичним викидам попелу з Гефеста, і в поєднанні з водою з гейзерів це робить парк одними з найкращих сільськогосподарських угідь у всьому регіоні. Хоча Екологи опираються розчищенню нових земель під ферми, краща інтеграція сімейних ферм у пов'язані кооперативи може допомогти підвищити врожайність та ефективність з мінімальною втратою дикої природи."
  ROS_infrastructure:0 "З'єднати міста"
  ROS_infrastructure_desc:0 "З'єднання розрізнених поселень по всьому парку дозволить досягти більшої спеціалізації, що дасть нам змогу зосередити виробництво там, де воно найбільше потрібне. Кар'єр у кожному місті просто розриває землю всюди, тоді як єдиний глибокий кар'єр може мінімізувати вплив на навколишнє середовище, обмеживши його одним місцем."
  ROS_workshops:0 "Відкриття майстерень"
  ROS_workshops_desc:0 "Для тих галузей, які нам необхідні для виживання, життєво важливою є самозабезпеченість. Ми відкриємо спеціалізовані майстерні в кожному місті, де кожен громадянин зможе навчитися самостійно виробляти те, що йому потрібно — від інструментів і одягу до меблів."
  ROS_tactics:0 "План природного захисту"
  ROS_tactics_desc:0 "Наш зв'язок з Єллоустоном і влада над його дикою природою призвели до інноваційних планів ведення бойових дій, які покладаються на поєднання тварин із людьми, що навчилися битися як тварини, перетворюючи Єллоустон на лігво хижаків для будь-яких сил вторгнення."
  ROS_emergency_rangers:0 "Підготовка альпіністів"
  ROS_emergency_rangers_desc:0 "Скелясті гори, що оточують Єллоустон, століттями слугували природним щитом, але з огляду на загрози, що підповзають до долин, настав час розробити тактику виходу з них і боротьби з силами, що закріпилися на висотах."
  ROS_militia_training:0 "Народне ополчення"
  ROS_militia_training_desc:0 "Покладання на Рейнджерів у нашому захисті працювало в минулому, але тоді ми боролися з племенами та рейдерами, а не з механізованими арміями. Настав час мобілізувати жителів Єллоустона, щоб ми могли організувати спільну оборону."
  ROS_settlement:0 "Заохочення поселенців"
  ROS_settlement_desc:0 "Єллоустон — безпечне місце з надійним доступом до їжі, низьким рівнем радіації, контрольованою дикою природою та горами, що стримують рейдерів. Поселенці з усієї півночі регулярно знаходять сюди дорогу і осідають тут, приносячи з собою нові ідеї та досвід. Ми повинні заохочувати це явище, запрошуючи біженців від воєн у Монтані оселитися тут."
  ROS_car_tomorrow:0 "Відбудова доріг"
  ROS_car_tomorrow_desc:0 "Дороги Єллоустона були замінені на більш примітивні стежки та шляхи, а стародавні автомагістралі перетворилися на руїни через занедбаність. Тепер, коли ми моторизуємо наші сили, в наших найкращих інтересах було б почати ремонт стародавніх естакадних доріг, що залишилися, і використовувати наш багатий бетон для будівництва нових."
  ROS_recycling:0 "Ініціатива з переробки"
  ROS_recycling_desc:0 "До війни переробка сміття сприймалася з певним цинізмом як безглузда примха, яка мало чим допомагала довкіллю на тлі шкоди, якої завдавали корпорації. Тепер це необхідність, і ми маємо переконатися, що кожен можливий ресурс, який можна використати повторно, переробляється. Створення місцевих центрів переробки може допомогти, навіть якщо це будуть просто купи брухту біля майстерень, щоб люди могли в них порпатися."
  ROS_adirondack_style:0 "Прийняття стилю Адірондак"
  ROS_adirondack_style_desc:0 "Стиль Адірондак — це архітектурний стиль, розроблений в однойменних горах на сході, який робить акцент на натуральних матеріалах, використанні відкритих просторів і житті в гармонії з природою. Служба національних парків прийняла його як офіційний стиль сотні років тому, і зразки цього стилю все ще прикрашають пейзажі парку. Його прийняття не лише дасть парку власне відчуття спільної культурної ідентичності, але й допоможе розподілити та приховати наші підприємства й населення в природі."
  ROS_mountain_workshops:0 "Гірські сховища"
  ROS_mountain_workshops_desc:0 "Ізольовані хатини в горах здавна слугували притулком і сховищем для жителів Єллоустона, часто маючи просторі льохи і навіть примітивну гідропоніку. Приховування більшої частини наших виробництв у самих горах може дозволити нам швидко підвищити продуктивність без шкоди для довкілля."
  ROS_dogs:0 "Управління дикою природою"
  ROS_dogs_desc:0 "Дика природа Єллоустона збереглася набагато краще, ніж у більшості куточків світу, значною мірою завдяки нашому дбайливому управлінню та захисту. Хоча наш святий обов'язок — піклуватися про наших тваринних мешканців, хто сказав, що вони також не можуть брати участь у захисті свого дому?"
  ROS_wolves:0 "Вибіркова реінтродукція"
  ROS_wolves_desc:0 "Дикі вовки існують в обмеженій кількості в Єллоустоні вже багато століть. Ймовірно, це одне з останніх місць на землі, де вони вижили, не зазнавши мутацій від радіоактивних опадів. Допомога в розширенні їхніх мисливських угідь і відновленні їхньої чисельності часто зустрічала опір наляканих фермерів, але нещодавно люди вирішили, що не проти мати лігва дуже територіальних тварин на кордоні з нашими північними сусідами..."
  ROS_mutant_animals:0 "Використання геконів"
  ROS_mutant_animals_desc:0 "«Гекони десятиліттями проникають у парк, зазвичай нападаючи на наших фермерів або диких бізонів, що блукають парком, і загалом завдають клопоту. Рейнджери їх не люблять, але вони демонструють дивовижний рівень інтелекту, який, можливо, варто дослідити.»"
  ROS_nature_trails:0 "Природні стежки"
  ROS_nature_trails_desc:0 "Без автомобілів нашим людям знадобиться новий спосіб пересуватися нашою територією для поїздок, які занадто короткі для залізниці. Мережа природних стежок із пішохідними доріжками має дозволити людям долати помірні відстані між селами і гарантувати, що наші рейнджери матимуть простір для маршу. Крім того, краєвиди та фізичні вправи досить корисні для морального духу."
  ROS_final_preparations:0 "Війна з розумом"
  ROS_final_preparations_desc:0 "Настав час завершити наші військові приготування, організувавши екстрену оборону та шляхи евакуації для цивільних на випадок, якщо наша гірська стіна дасть тріщину. Війна неминуча, єдине питання в тому, хто зробить перший крок."
  ROS_concrete:0 "Вулканічний бетон"
  ROS_concrete_desc:0 "Стародавня Римська імперія будувала споруди, які простояли понад 2000 років, використовуючи бетон, виготовлений із вулканічного попелу. Хоча ми повинні пам'ятати про довгострокові наслідки, ми могли б використати попіл Гефеста, щоб побудувати мережу вічних бункерів по всій нашій території."
  ROS_war_support:0 "Згуртувати народ на війну!"
  ROS_war_support_desc:0 "Війна все ще непопулярна в Єллоустоні, але вагоме моральне обґрунтування допомагає. Ми повинні дати зрозуміти нашим людям, що ми боремося не просто за своє виживання, а за наш спосіб життя і захист природного світу навколо нас. Для цього знадобиться лише кілька добре продуманих промов і розкриття потворної правди про злочини, скоєні Анклавом і навколишніми рейдерами."
  ROS_sustainable_development:0 "Сталий розвиток"
  ROS_sustainable_development_desc:0 "У той час як інші нації можуть задовольнятися нескінченним розширенням і розорюванням природи, ми обрали більш стриманий підхід, обмежуючи територію, яку ми використовуємо, але гарантуючи, що кожен дім, кожен ресурс і кожна громада зможуть функціонувати майже нескінченно довго."
  ROS_emission_standards:0 "Стандарти викидів"
  ROS_emission_standards_desc:0 "Автомобілі були заборонені в парку невдовзі після війни, і лише звичайні велосипеди уникнули заборони на транспортні засоби. Ця політика призвела до того, що розвиток обмежився стежками та пішохідним рухом, що, цілком зрозуміло, позбавило наші сили можливості швидко реагувати на загрози. Послаблення цих обмежень — з певними умовами — мало б допомогти."
  ROS_environmental_research:0 "Лабораторія екологічних досліджень"
  ROS_environmental_research_desc:0 "Дослідницький центр Рузвельта в Єллоустоні був базою для операцій Андроїдів EPA ще до Великої війни. Призначений для вивчення геологічних процесів парку — і шпигування за тим, чим насправді займався «Посейдон», — він залишається одним із найпотужніших дослідницьких центрів у парку. Хоча було б непогано, якби Рейнджери перестали називати його «Вежею зі слонової кістки»."
  ROS_secure_the_park:0 "Убезпечити Парк"
  ROS_secure_the_park_desc:0 "EPA не змогло представити реальний план того, як захистити Парк від агресії Макартура. Рейнджери зробили більш ніж достатньо, щоб підготувати Екологів до допомоги у війні, настав час їм разом оголосити свій план."
  ROS_deputies:0 "Уповноважити наші патрулі"
  ROS_deputies_desc:0 "Для боротьби із залишками армії США знадобиться щось серйозніше, ніж купка учасників сусідської варти. Можливо, настав час призначити найкращих і найрозумніших з наших нових союзників Екологів почесними Рейнджерами та Заступниками, щоб вони могли краще керувати своїми співвітчизниками?"
  ROS_fiscal_policy:0 "Ринки Анвілу"
  ROS_fiscal_policy_desc:0 "«Люди питають, як Єллоустон може фінансувати всі свої проєкти, від досліджень до збереження природи, маючи таку малу податкову базу. Більшість приписує це геніальній бухгалтерії EPA і залишає це як є. Правду кажучи, вони недалекі від істини, але Андроїди в EPA століття тому зрозуміли, що гроші — це ілюзія, і кожна бухгалтерська книга в парку підроблялася протягом 200 років, створюючи та знищуючи гроші за потреби, щоб підтримувати комфортний рівень життя без заохочення споживацтва. Зі швидким розвитком парку ми могли б дозволити собі випустити ще трохи грошей в обіг.»"
  ROS_park_development:0 "Розвиток Парку"
  ROS_park_development_desc:0 "«Єллоустон був заморожений у часі протягом століть. У спробі уникнути помилок світу, одержимого постійним нестійким зростанням, весь економічний розвиток стримувався на користь довгострокового збереження ресурсів. Але зі стрімким зростанням наших сусідів стало зрозуміло, що ми вкрай не готові вести війну за виживання в пустці, тож, можливо, ми могли б дозволити певну невелику частку поступового, сталого зростання відповідно до нових технологічних розробок.»"
  ROS_sound_theory:0 "Фінансові стимули"
  ROS_sound_theory_desc:0 "Оскільки страх перед комп'ютерами нарешті розвіяно, ми можемо реалізувати стару ідею, яка століттями припадала пилом у EPA, і в процесі революціонізувати економіку парку."
  ROS_civilian_products:0 "Збагачення людства"
  ROS_civilian_products_desc:0 "Брак електрики в Єллоустоні дійсно ускладнює розваги для людей порівняно з довоєнними часами, але деякі члени дослідницької групи придумали повністю аналогові рішення. Голоплівки, переписані на воскові циліндри, настільні ігри, що стимулюють розум за допомогою кількох шматочків дерева, та просте спортивне спорядження повинні зробити їх достатньо щасливими."
  ROS_nature_channel:0 "Канал Природи"
  ROS_nature_channel_desc:0 "Телебачення. Опіум для мас, потенційний інструмент для освіти та ідеальний засіб для поширення ідеологічних матеріалів. Сховища «Посейдона» надали нам креслення для виробництва та розповсюдження нових телевізорів, що дозволяє нам щовечора транслювати навчально-розважальні документальні фільми (у повному Chroma-Color!). Здебільшого це довоєнний або оригінальний контент, хоча іноді ми ловимо й якісь дивні трансляції."
  ROS_fluxdrift:0 "Просунутий Флюксдрифт"
  ROS_fluxdrift_desc:0 "«Флюксдрифт — це така чудова річ. Майже безмежне відновлюване джерело енергії, воно здавна живило наші тіла та допоміжні системи в EPA. Дивно, але, здається, воно погано реагує на більші системи — чим стабільніша система, тим важче Флюксдрифту з нею взаємодіяти, що робить його непридатним як єдине джерело енергії для нашої цивілізації. Проте, застосовуючи його в обмеженій кількості, ми мали б зробити більшість наших галузей трохи стійкішими.»"
  ROS_transmutation:0 "Флюкс-трансмутація"
  ROS_transmutation_desc:0 "«Прорив у флюкс-маніпуляції. Здається, використовуючи стабільні енергетичні системи «Посейдона» для живлення флюкс-генераторів, ми могли б змусити явище Флюксу робити щось більше, ніж просто живити машини...»"
  ROS_veggie_burger:0 "Флюкс-Бургер"
  ROS_veggie_burger_desc:0 "«Ми долаємо межі самої реальності, а вони все ще вимагають, щоб ми дозволили їм їсти м'ясо. Добре. Ми дамо їм те, чого вони хочуть, або принаймні щось настільки схоже, що вони не помітять різниці...»"
  ROS_sacred_crystals:0 "Священні кристали"
  ROS_sacred_crystals_desc:0 "Глибоко в шахтах Аїда знаходяться кристали, що світяться і випромінюють дивний спектр радіації. Хоча EPA нагадує нам, що ці кристали «Ультрациту» небезпечно брати в руки без захисту, їхня здатність підсилювати та накопичувати енергію дає нам потенціал для розробки енергетичних систем, які не залежать від електрики."
  ROS_excavate_workshops:0 "Розкопки майстерень Посейдона"
  ROS_excavate_workshops_desc:0 "«Посейдон Енерджі» мала низку підземних допоміжних майстерень для підтримки розробки проєкту «Гефест». Ці майстерні занепали, але все ще містять корисні інструменти та матеріали, якщо ми їх розчистимо, а робочий простір ідеально підходить для переробки деяких з найбільш нестабільних скарбів Аїда ще до того, як вони потраплять на поверхню."
  ROS_hidden_temples:0 "Приховані фабрики"
  ROS_hidden_temples_desc:0 "«Багато шахтарів, які спускаються в глибини Аїда, повідомляють про неактивні складальні лінії та виробничі приміщення, приховані в глибинах, і знаходять їх дедалі більше відтоді, як ми знову увімкнули обладнання Гефеста. Вони кажуть, що це, здається, абсолютно безпечні місця для відпочинку та відновлення сил, але не зовсім зрозуміло, звідки вони беруться...»"
  ROS_into_hades:0 "До Аїда"
  ROS_into_hades_desc:0 "Видобуток корисних копалин традиційно був дуже руйнівною для довкілля практикою, якої уникали на поверхні Єллоустона, щоб зберегти його природну красу. Але глибоко під Гефестом лежить величезний лабіринт тунелів і печер, які, здається, тягнуться нескінченно, і де нові метали та руди підіймаються в магматичних камерах. Сюди сміливі шахтарі спускаються в пошуках багатств і металів, щоб доставити їх на поверхню, за підтримки Культу Гефеста. Хто знає, що ще ми знайдемо там, внизу?"
  ROS_ancient_mining_tools:0 "Стародавні шахтарські інструменти"
  ROS_ancient_mining_tools_desc:0 "Поширена помилкова думка, що в Єллоустоні немає електроінструментів через заборону на електрику. Це абсолютно не так, оскільки в Єллоустоні широко використовуються механічні інструменти, такі як цвяхомети, дрилі та відбійні молотки. Просто вони пневматичні — працюють на стисненому повітрі замість електрики!"
  ROS_holy_weapons:0 "Священна зброя"
  ROS_holy_weapons_desc:0 "Ультрацит небезпечний, але з цього можна отримати вигоду. Додавання його мікродоз у нашу зброю та боєприпаси не лише збільшить їхній руйнівний потенціал, але й зробить пошук відпрацьованих матеріалів для переробки легкою справою!"
  ROS_anvil:0 "Місто Анвіл"
  ROS_anvil_desc:0 "За межами храму Гефеста поступово будувалося місто, яке живилося парою, що досі виходила з храму, і було заселене вцілілими та мандрівниками здалеку. З підйомом Культу Гефеста місто отримало назву «Анвіл» (Ковадло) на честь своєї гордої традиції металообробки."
ROS_crononite:0 "Крононіт"
  ROS_crononite_desc:0 "Крононіт був «запатентованим» металом стародавніх інженерів «Посейдона», але старі документи свідчать, що його насправді просто «запозичили» з досліджень іншого культу в якомусь гірському храмі на півдні. На щастя, цей червоний кристалічний метал має безліч фантастичних властивостей, які ми навчилися використовувати навіть краще за наших предків! Від виняткового збереження тепла до передачі дивних магнітних — але не зовсім електричних — сигналів: хто знає, що ми зможемо з нього зробити, якщо докладемо зусиль!"
  ROS_get_creative:0 "Проявіть креативність"
  ROS_get_creative_desc:0 "Зубчасті колеса, вали, шестерні, паси, підшипники та багато іншого! Потенціал машинобудування безмежний, якщо перестати думати про те, чого воно не може, і почати цікавитися тим, що воно зможе зробити далі! Хто сказав, що для автоматизації конвеєра потрібна електрика?"
  ROS_decentralized:0 "Децентралізована цивілізація"
  ROS_decentralized_desc:0 "Хоча EPA може вважати, що лише її закони та обмеження здатні втримати людство від самознищення, і що без них ми скотимося в анархію. Але що такого поганого в анархії? Єллоустон виживав 200 років як децентралізований народ, регулюючи себе і один одного лише за допомогою найпримітивніших місцевих урядів. Ми відкинемо їхні мрії про сильну державу і побудуємо сильне суспільство."
  ROS_engineering_support:0 "Польові інженери"
  ROS_engineering_support_desc:0 "В умовах ризику того, що передова армія увійде в Єллоустон і порушить священну заборону, нашим силам як ніколи потрібна спеціалізована технічна підтримка. На щастя, Екологи мають широкий резерв талантів, готових запропонувати свої послуги як на полі бою, так і поза ним."
  ROS_poseidon_methods:0 "Передові технології виробництва"
  ROS_poseidon_methods_desc:0 "«Посейдон» використовував інноваційні методи збирання для будівництва підземного Гефеста, включаючи роботів, лазери та навіть екзоскелети! Більшість із них розібрали багато років тому, але все ще можна чогось навчитися, детально аналізуючи, як виготовлялася кожна окрема деталь."
  ROS_mechanical_ingenuity:0 "Механічна геніальність"
  ROS_mechanical_ingenuity_desc:0 "Раніше панувала думка, що технології та мистецтво — це протилежні сили, що машини — це протилежність краси. У Єллоустоні це зовсім не так: механічні пристрої розглядаються як окремий вид мистецтва. У місті Анвіл можна знайти незліченну кількість приладів і штуковин, які найкраще працюють від потоку води або пориву вітру. Хоча багато мандрівників приїжджають за чимось практичним, ніщо не викликає у ковалів такої гордості, як бачити, як загоряються очі мандрівника від какофонії шестерень і деталей, що рухаються в їхній майстерні."
  ROS_repairing_leaky_pipes:0 "Ремонт дірявих труб"
  ROS_repairing_leaky_pipes_desc:0 "Важко переоцінити, наскільки сильно постраждав Гефест, захищаючи Єллоустон від Великої війни. До цього дня в парових трубах Гефеста все ще трапляються витоки, які потрібно латати, а в повоєнних трубах час від часу з'являються нові. Це невдячна робота, але вона дала нашим ремонтникам величезний досвід у постійному лагодженні."
  ROS_steam_powered_city:0 "Місто на паровій тязі"
  ROS_steam_powered_city_desc:0 "Анвіл продовжує розширюватися, а разом із ним — і спеціалізована армія інженерів, техніків і різноробів, які наглядають за системою паропроводів."
  ROS_analog_computers:0 "Аналогові комп'ютери"
  ROS_analog_computers_desc:0 "Поєднавши складні годинникові механізми з унікальними тепловими властивостями крононіту, кілька видатних розумів в Анвілі змогли досягти того, чого людство не могло зробити століттями: створити комп'ютер, який є суто механічним і не залежить від примхливої електрики."
  ROS_knights_of_hephaestus:0 "Лицарі Гефеста"
  ROS_knights_of_hephaestus_desc:0 "З наближенням загрози насильства виникла нова гілка Культу Гефеста — воєнізована. Ці «Лицарі Гефеста» спрямували свої кузні на виготовлення зброї та присягнули жити від меча, щоб захищати вірян. Хоч як комічно виглядає перехід від греків до лицарів, їхній запал не варто недооцінювати."
  ROS_pushing_out:0 "Ми повстанемо знову"
  ROS_pushing_out_desc:0 "За останні кілька десятиліть вплив Рейнджерів на регіон значно послабшав. Тепер, коли вони нарешті знову стають на ноги, настав час подумати про відновлення наших позицій у пустці та убезпечення парку від усіх потенційних загроз."
  ROS_strong_society:0 "Сильне суспільство"
  ROS_strong_society_desc:0 "Побудувати могутню державу в пустці — складне завдання. Побудувати сильне суспільство? Це набагато важче. Але завдяки поєднанню заохочення особистої відповідальності та спільної віри ми зробили перші кроки до побудови справжнього суспільства, яке витримає будь-які політичні потрясіння, що можуть загрожувати нашій природі в майбутньому."
  ROS_expanded_ranks:0 "Розширення лав"
  ROS_expanded_ranks_desc:0 "Що робить людину Рейнджером? Це питання часто ставлять сторонні про Єллоустон, оскільки у них, здається, досить вільна ієрархія, де жоден Рейнджер не має влади над іншими. Хоча цей демократичний підхід досить добре працював у минулому, приплив нових «заступників» без значного досвіду чи підготовки зробив усе... складнішим. Нова серія пропозицій щодо кращого розподілу обов'язків Рейнджерів вже підготовлена і чекає на наступні збори."
  ROS_watchtowers:0 "Відбудова спостережних веж"
  ROS_watchtowers_desc:0 "Колись давно по всьому регіону була побудована мережа пожежних веж, яка використовувалася для координації реагування рейнджерів на стихійні лиха. Хоча Радіомережа не працює вже століттями, ми все ще можемо використовувати самі вежі, щоб стежити за всіма переміщеннями в парку."
  ROS_khans:0 "Допомога від Ханів?"
  ROS_khans_desc:0 "Так звані «Хани» — відносно нова група в регіоні, яка мігрувала через проблеми на заході на наш безпосередній схід. Хоча вони з пересторогою ставляться до всіх, хто називає себе «Рейнджером» з причин, з якими нам доведеться розбиратися пізніше, вони також прийшли з групою лікарів, які поширюють мир і співпрацю в пустці, тож вони не можуть бути суцільним злом. Можливо, ми могли б попросити наших сусідів про допомогу проти нашої неминучої загибелі?"
  ROS_niitsitapi_deal:0 "Зустріч з Олдганом"
  ROS_niitsitapi_deal_desc:0 "Джеремі Олдгану не подобається, коли його називають «Лідером» його народу, але вони готові слідувати за ним як за Воєнним Вождем. Ми допомогли їм боротися в жорстокій війні проти компанії Зака кілька років тому, тож, можливо, він погодиться повернути борг і допоможе нам відбити нову загрозу з боку Макартура?"
  ROS_highland_watch:0 "Спостереження за Високогір'ям"
  ROS_highland_watch_desc:0 "Десь у центральному Вайомінгу в нас раніше були друзі в народі Арапахо та Ковбої Ролінза. Минуло багато часу відтоді, як ми з ними зв'язувалися, і ходять чутки про повстання «Людей-кротів» на цьому шляху, але, можливо, якщо ми запропонуємо посильну допомогу, вони погодяться відплатити нам тим самим?"
  ROS_first_threat:0 "Правосуддя для всіх"
  ROS_first_threat_desc:0 "Макартур був екзистенційною загрозою для Єллоустона та його людей, реліктом старого світу, що погрожував повернути його найгірші риси. Війна рідко буває виправданою, але якби ми не зупинили їх, вони б принесли війну і руїну на всю пустку."
  ROS_montana_farmers:0 "Фермери Монтани"
  ROS_montana_farmers_desc:0 "Наші численні патрулі поступово привчили жителів південної Монтани до нашої присутності, і після усунення Анклаву деякі з більш «мутованих» жителів пустки повернулися в регіон, щоб осісти. Хоча ми все ще уникаємо старої бази Макартура через страх перед якимось іншим прихованим планом, наш шматочок Монтани стрімко перетворюється на справжній сільськогосподарський центр."
  ROS_win_people:0 "Завоювати серця людей"
  ROS_win_people_desc:0 "Анклав Макартура так і не зміг повністю вирішити свої внутрішні суперечки; між Першими Сім'ями та біженцями, які оселилися на цій території, влада Анклаву ніколи не була абсолютною. Залучити на свій бік решту місцевих жителів важливіше, ніж жменьку вчених чи старих солдатів, адже саме в серцях і умах людей ми маємо знайти дозвіл на піклування про цю землю."
  ROS_fight_forest_fires:0 "Боротьба з лісовими пожежами"
  ROS_fight_forest_fires_desc:0 "Хоча дозвіл на природні пожежі та контрольоване випалювання є життєво важливим для циклу природного оновлення, численні пожежі, спричинені безвідповідальним використанням енергетичної зброї Анклаву або вибухами парових ядер, не є частиною цього циклу. Нам потрібно почати ліквідацію екологічної шкоди, якої завдали ці війни."
  ROS_heal_wounded:0 "Зцілення поранених цивільних"
  ROS_heal_wounded_desc:0 "Війна руйнівна як для людства, так і для світу природи. Ми пережили найгірше, але є багато поранених солдатів і цивільних, які потребують допомоги. Хоч якими б мстивими не були наші вороги, ми маємо моральний обов'язок допомагати людям на землях, які ми зараз займаємо, та військовополоненим, яких ми захопили."
  ROS_last_chapel:0 "Зрівняти Каплицю із землею"
  ROS_last_chapel_desc:0 "Висока Каплиця, ще одна група релігійних фанатиків на нашому заході, постійно підривала наш авторитет, надсилаючи місіонерів із вимогами передати їм контроль над джерелом їхньої священної річки в Єллоустоні. Конфлікти вздовж кордону лише продовжують загострюватися, і якщо ми не втрутимося найближчим часом, вони можуть перерости у відкриту війну."
  ROS_lonely_trees:0 "У Самотніх Деревах"
  ROS_lonely_trees_desc:0 "Плем'я Самотнього Дерева тихо наглядало за півднем поколіннями, але їхній останній лідер зробив їх... занадто тихими. Плем'я неспокійне, параноїдальне, готується до війни та нападає на будь-кого, хто намагається подорожувати через їхню територію. З огляду на те, що вони блокують єдині безпечні маршрути з Нового Ханаану до Монтани, це може мати катастрофічні наслідки, якщо ми терміново щось не зробимо."
  ROS_steamboats:0 "Пароплави"
  ROS_steamboats_desc:0 "Маючи порти на річці Снейк від Небесних Воріт до самого Єллоустона, настав час створити річковий флот для патрулювання з метою виявлення незаконної діяльності або переміщень ворога. Ми маємо відродити дух старих пароплавів і переробити їх так, щоб мінімізувати занепокоєння дикої природи в річці. Спокійний болотник — безпечний болотник."
  ROS_river_defense:0 "Річкова оборона"
  ROS_river_defense_desc:0 "Річка Снейк тече від парку аж до океану, і хоча це відкриває можливості для торгівлі, це також робить нас вразливими до вторгнення. З огляду на розповіді про піратів та божевільних безсмертних на заході, можливо, нам варто підготувати деякі річкові оборонні споруди, щоб переконатися, що ми захищені від військово-морських рейдерів."
  ROS_one_river:0 "Єдина річка Снейк"
  ROS_one_river_desc:0 "З обома захищеними берегами річка Снейк повністю перебуває під захистом Рейнджерів Парку! У пустці мало таких чистих річок, як ця, і наш обов'язок — зберегти її такою для тварин і людського населення, що зростає і залежить від неї."
  ROS_annoyingted:0 "Марш до Едемських садів"
  ROS_annoyingted_desc:0 "Помазаники були джерелом найбільшої кількості місіонерів, посланих «просвіщати» нас щодо своєї релігії. Вони сиділи на робочому GECK, що зберігався в їхньому «Сховищі Едему», і використовували його лише для розбудови раю для себе, а не для решти пустки. Це викликало обурення в Екологів. Якби ж ми тільки могли здобути його, ми могли б поширити набагато більше добра, ніж їхнє «Добре Слово»..."
  ROS_new_trees:0 "Посадити нові дерева"
  ROS_new_trees_desc:0 "Землі Самотнього Дерева підтримувалися плем'ям у придатному для життя стані, але це не зовсім процвітаюче місце. Трохи ретельного управління та посіву нового життя — і ми могли б розширити дику природу парку принаймні трохи далі на південь та поділитися щедротами природи з самим плем'ям."
  ROS_restore_watch:0 "Відновлення Варти"
  ROS_restore_watch_desc:0 "Незважаючи на всі їхні зусилля, Рейнджери Ролінза впали перед силами Пустки. Але ще не все втрачено, і деякі рейнджери ще можуть продовжувати жити у Вайомінгу. Настав час позбутися тих мерзенних рейдерів, які претендують на Ролінз, і повернути Рейнджерів до влади!"
  ROS_reforming_them:0 "Реформування їх"
  ROS_reforming_them_desc:0 "Реформатори Мерто виявилися найпоступливішими з християн, з якими нам доводилося мати справу. Хоча вони все ще досить критично ставляться до наших переконань, вони принаймні готові толерувати наше право на співіснування, а також готові співпрацювати й пропонувати благодійну допомогу невірянам на своїх колишніх землях. Трохи згладивши кути, можливо, вдасться переконати їх повністю інтегруватися в життя Парку."
  ROS_master_snake_river:0 "Забезпечення безпеки далеких берегів"
  ROS_master_snake_river_desc:0 "Південні береги річки Снейк так само важливі для збереження її безпеки, як і північні, навіть якщо нам боляче їх захоплювати. Шошони не бажають нічого іншого, окрім як повернути землі, на яких колись жили їхні предки, землі, які ми тепер називаємо домом, а Реформатори Мерто прийняли більш відкритий і толерантний підхід, ніж їхні сусіди на сході. В іншому житті, можливо, ми могли б працювати разом, але в Пустці ми не можемо дозволити собі ризикувати."
  ROS_one_garden:0 "Об'єднання Садів"
  ROS_one_garden_desc:0 "Наше дослідження GECK у Сховищі Едему швидко розбилося об усвідомлення того, що він був виснажений і зламаний, його потенціал уже вичерпався. Проте територія навколо сховища процвітає завдяки біорізноманіттю, яке варто дослідити, і частина з якого більш адаптована до радіації та виснаження ґрунту в пустці, ніж те, що ми маємо в Єллоустоні. З краплею ніжної любові та турботи ми все ще могли б використати цей Сад, щоб засіяти пустку."
  ROS_open_the_gate:0 "Пронизуючи серце"
  ROS_open_the_gate_desc:0 "Небесна Варта довго була більмом на оці Рейнджерів Парку, непрохідним регіоном, який контролював ізоляціоністський культ, що гнобив своїх людей гротескними покараннями в ім'я «спокути». Тепер, коли Рейнджери мобілізувалися для активної боротьби із загрозами в регіоні, ймовірно, найкраще буде раз і назавжди вирішити проблему їхнього розколу і звільнити людей Пари."
  ROS_peace_at_last:0 "Нарешті мир і спокій"
  ROS_peace_at_last_desc:0 "Вперше за десятиліття Єллоустон і його околиці справді заспокоюються. Хоча в пустці все ще можуть бути небезпеки, у нас є час на перепочинок і планування найкращого шляху для об'єднання всіх людей під нашою опікою у щось нове..."
  ROS_plans_for_heaven:0 "Плани на Пару"
  ROS_plans_for_heaven_desc:0 "Небесна Варта була для нас скалкою в оці відтоді, як культ уперше з'явився в регіоні, але тепер, коли ми нарешті розгромили їхні збройні сили і почали неохочу окупацію, ми маємо багато роботи з депрограмування культу і, нарешті, встановлення миру в регіоні."
  ROS_midnight_union:0 "Друзі опівночі"
  ROS_midnight_union_desc:0 "Опівнічний Союз — це найкращий шанс на збереження миру в Монтані. У нас були хороші стосунки з його засновниками ще до його створення, тож, можливо, якщо ми звернемося до них, вони дозволять нам приєднатися до альянсу?"
  ROS_our_own_faction:0 "Північні зв'язки"
  ROS_our_own_faction_desc:0 "Монтана — це земля хаосу, але оскільки ніітсітапі шукають тісніших зв'язків, можливо, краще залишити її долю їм. Морський Бастіон має амбіції побудувати нову мережу союзників на Північному Заході, яка колись потенційно може простягнутися аж до Тихого океану."
  ROS_invite_watch:0 "Запросити Варту"
  ROS_invite_watch_desc:0 "На даному етапі ми більш ніж відновили нашу співпрацю з Рейнджерами Ролінза та Арапахо. Офіційно оформивши альянс, ми могли б забезпечити мир для всього Вайомінгу."
  ROS_blackwater:0 "Посланці Промовців"
  ROS_blackwater_desc:0 "Ніітсітапі тримають у таємниці інформацію про загадкових Промовців і легендарну «Чорну Воду», яка їх створює. Хоча вони не бажають ділитися секретом того, як вони працюють, можливо, вони погодяться надіслати кількох із них, щоб допомогти нам з нашою власною дипломатією."
  ROS_explore_nucleus:0 "Дослідження Ядра"
  ROS_explore_nucleus_desc:0 "Ядро, відоме людям Небесної Варти лише як «Пара», є серцем їхньої мережі паропроводів і, за нашими оцінками, одним із найдосконаліших ядерних реакторів із коли-небудь побудованих. Хоча частина старої гвардії з побоюванням ставиться до ядерної енергетики, ми повинні визнати, що без геотермального потенціалу Єллоустона це найкращий варіант для забезпечення регіону енергією. Давайте розберемося, як він працює."
  ROS_religious_tolerance:0 "Питання віри"
  ROS_religious_tolerance_desc:0 "Релігія завжди була складною темою в Єллоустоні, де культ Гефеста є найбільшою, але не єдиною вірою. Хоча ми перемогли християн Айдахо в останній великій священній війні, тепер ми бачимо, що вони складають значну частину нашого населення. Гарантування їхнього права на мирне поклоніння без перешкод багато в чому допомогло б їм відчути себе в безпеці."
  ROS_forgiving_faith:0 "Віра прощення"
  ROS_forgiving_faith_desc:0 "Культ Небесної Варти виник із дивної суміші християнства та поклоніння паровим машинам, які допомогли їхнім предкам відродитися та процвітати. Ми повинні нагадати їм, що в глибині душі їхня віра базується на працьовитості та спокуті, і що найкращий спосіб служити Богу — це відмовитися від релігійного насильства і допомогти нам побудувати новий рай на землі."
  ROS_holy_warriors:0 "Священні воїни"
  ROS_holy_warriors_desc:0 "Незважаючи на всі наші зусилля, серед вірян Пари все ще є ті, хто залишається непохитним у переконанні, що їхнє місце в Божому задумі — на полі бою. Якщо ми не можемо їх позбутися, ми могли б принаймні спрямувати їх на співпрацю з нашими існуючими «Лицарськими» орденами, щоб вони могли поступово змінити свою думку... Або принаймні змусити їх боротися з рейдерами замість того, щоб завдавати шкоди дикій природі."
  ROS_engineer_priests:0 "Допомога інженерів"
  ROS_engineer_priests_desc:0 "Специфічна фракція Інженерів відповідає за обслуговування великих машин Ядра та парової мережі, а також різних пристроїв, що працюють на парових ядрах. Дозвіл їм навчатися і працювати пліч-о-пліч з нашими екологами міг би допомогти зрозуміти технології одне одного, водночас руйнуючи їхню залізну хватку щодо влади та технологій у регіоні."
  ROS_cathedral:0 "Відбудова Собору"
  ROS_cathedral_desc:0 "Завдяки тому, що в наших лавах служить достатня кількість колишніх Учнів Пари, вони здобули достатньо впливу, щоб звернутися до Республіки з проханням допомогти відбудувати зруйнований собор у Парі. Будівництво цього духовного центру під виглядом «культурної споруди» для них могло б завоювати підтримку тих, хто ще опирається, і змусити їх довіряти нашому уряду."
  ROS_steam_reborn:0 "Відродження Пари"
  ROS_steam_reborn_desc:0 "Пара — це місто, побудоване навколо Ядра, яке раніше було духовним і промисловим серцем Небесної Варти. Завдяки найбільшому населенню на нашій території, зручному для оборони розташуванню та масивному термоядерному реактору, це ідеальне місце для нової столиці. Було розроблено масштабний проєкт реконструкції, щоб модернізувати місто в новий зелений мегаполіс і показати пустці, що ми можемо відбудувати не лише цивілізацію, але й природу."
  ROS_republic_of_steam:0 "Республіка Пари"
  ROS_republic_of_steam_desc:0 "«Єллоустон» більше не здається відповідною назвою. Попри наші найкращі наміри, світ змусив нас розширюватися або померти, і тепер ми контролюємо землі далеко за межами парку. Можливо, настав час реорганізуватися в нову ідентичність, яка зможе повністю прийняти наших нових людей. І оскільки ми об'єднуємо джерела енергії Пари та самого Єллоустона, стає чітко зрозуміло, яка саме сила об'єднує наші народи."
  ROS_army_survival:0 "Тренування з виживання"
  ROS_army_survival_desc:0 "Оскільки наші люди розселяються і починають жити на самозабезпеченні, стало зрозуміло, що не всі Екологи, які наважилися переїхати в сільську місцевість, точно знали, як одразу налагодити свій побут. Ми повинні запровадити програму загального навчання з виживання, щоб кожен мешканець Єллоустона міг навчитися жити за рахунок землі в часи потреби."
ROS_ranger_corps:0 "Відродження Рейнджерів"
  ROS_ranger_corps_desc:0 "Рейнджери виконували багато ролей для Єллоустона протягом багатьох років, діючи як солдати, натуралісти, розвідники, вчителі та рятувальники. Під тиском намагань зробити все самостійно, попереднє покоління зламалося і відвернулося від своїх обов'язків. Об'єднавшись як спільнота, ми зрозуміли, що рішення полягає не в тому, щоб звільнити їх від цих обов'язків, а в тому, щоб розділити їх з іншими."
  ROS_mechanized_armor:0 "Механізована броня"
  ROS_mechanized_armor_desc:0 "Силова броня завжди розпалювала уяву жителів Єллоустона; перші Рейнджери Парку мали близько дюжини костюмів, які вони використовували — принаймні, за межами Парку. Хоча вони прийшли в жалюгідний стан, присутність Братства надихнула нас шукати шляхи для ремонту цих костюмів і повернення їх у стрій. Вивчення броні, яку ми захопили в Анклаву, має стати хорошим початком."
  ROS_refurbish_airbase:0 "Відновлення власної авіабази"
  ROS_refurbish_airbase_desc:0 "Серед Рейнджерів зростає переконання, що найефективнішого захисту від майбутніх загроз можна досягти завдяки повітряним силам. Форт Сент-Ентоні був невеликим гарнізонним фортом, але він мав злітно-посадкову смугу, яку ми могли б розширити до повноцінного аеродрому для будь-яких літальних апаратів, які ми розробимо. Вже циркулює низка ідей щодо того, що саме будувати, хоча, ймовірно, знадобиться час, щоб підготувати щось дієздатне..."
  ROS_aerocorps:0 "Авіакорпус Рейнджерів"
  ROS_aerocorps_desc:0 "Проекти нових літальних апаратів з Анвіла надходять швидше, ніж ми встигаємо їх затверджувати чи будувати, хоча це не зупинило кількох заповзятливих осіб від створення власних прототипів. Настав час офіційно створити гілку Рейнджерів, присвячену повітряним силам, щоб координувати та спрямовувати ці нові проекти на нашу користь."
  ROS_develop_territory:0 "Вишукане життя"
  ROS_develop_territory_desc:0 "Більшість людей до війни вважали, що підтримувати високий рівень життя екологічно безпечним шляхом абсолютно неможливо, принаймні без підпорядкування величезної частини планети імперії, яка б викачувала ресурси до центру. Завдяки правильному поєднанню передових технологій, соціальної організації та розвитку почуття міри у кожного жителя Парку, ми довели їхню помилку і побудували комфортне, але зважене існування."
  ROS_changing_course:0 "Зміна нашого курсу"
  ROS_changing_course_desc:0 "Перехід до більшої нації приніс труднощі росту і внутрішні розбіжності щодо нашого майбутнього. Стара гвардія стурбована тим, що ми втрачаємо з поля зору наше екологічне коріння, зокрема дозволяючи деструктивним промисловим практикам на наших нових територіях тривати безконтрольно. Зміна їхніх систем може бути непопулярною, але це необхідно зробити, і ми могли б дечому навчитися щодо ефективності, вивчивши їхні методи."
  ROS_connect_pipes:0 "З'єднання наших труб"
  ROS_connect_pipes_desc:0 "Енергія пари Гефеста та Ядро живлять дві половини нашої нації, і настав час об'єднати ці мережі в єдину національну енергосистему. Це вимагатиме створення величезної підземної мережі тунелів, прокладених під нашими запланованими залізничними лініями, яку ми назвали «Паровим механізмом»."
  ROS_formalize_army:0 "Усі як один Рейнджери"
  ROS_formalize_army_desc:0 "Ми ледь не втратили свою незалежність, бо роками проводили політику ненасильства, втративши пильність. Війна залишила шрами на нашій нації, але ми повинні визнати, що часи, коли ми ховалися за нашими горами, минули. Відтепер кожен у парку буде проходити підготовку в Рейнджерів, щоб переконатися, що кожна людина готова захищати себе і свою громаду в міру своїх можливостей."
  ROS_modern_weaponry:0 "Сучасне озброєння"
  ROS_modern_weaponry_desc:0 "Сучасна армія потребує сучасного спорядження, і маючи для вивчення запаси зібраної зброї з півдюжини націй, ми маємо все необхідне, щоб почати модернізацію нашої піхоти."
  ROS_airship_development:0 "Креативна аеронавтика"
  ROS_airship_development_desc:0 "Наші інженери думали, що досягли межі своїх можливостей у будівництві дирижаблів, обмежених не ідеями, а нашою власною промисловою базою та населенням. Але з масами Пари та мінералами всього Айдахо в нашому розпорядженні, можливо, настав час взятися за роботу над наступним рівнем дирижаблів!"
  ROS_age_of_airships:0 "Епоха дирижаблів"
  ROS_age_of_airships_desc:0 "Нові проекти були завершені і представлені громадськості. Основою наших військово-повітряних сил стануть не літаки, а масивні дирижаблі! Ці повільні бегемоти здатні адаптуватися майже до будь-якої ролі і працюють з неперевершеною енергоефективністю. Ми нарешті зможемо дістатися будь-якого фронту в пустці... з часом."
  ROS_steambirds:0 "Пароптахи"
  ROS_steambirds_desc:0 "Гвинтокрили були складною технологією для розшифровки, але ми нарешті розгадали секрет їхнього виробництва. Пароптахи, оснащені новими паровими ядрами, тепер літають поруч із нашими дирижаблями, здатні стикуватися на борту для тривалих подорожей. Кілька транспортних моделей навіть замовила наша пожежна охорона!"
  ROS_steam_armor:0 "Паролицарі"
  ROS_steam_armor_desc:0 "Наш фундаментальний редизайн силової броні спочатку вражав, але з появою парових ядер ми віримо, що зможемо піти ще далі. З цими оновленнями нові підрозділи, які Культ Гефеста охрестив «Паролицарями», забезпечать безпеку республіки як непохитної опори Скелястих гір!"
  ROS_railway_network:0 "Велосипедні маршрути"
  ROS_railway_network_desc:0 "EPA порадила, що у разі нападу швидке реагування є ключем до глибокої оборони. Вони вперто виступають проти моторних транспортних засобів, але наразі готові піти на компроміс і дозволити нам розвивати швидкісні велосипедні доріжки — і виробити трохи велосипедів для їх використання."
  ROS_study_steam_cores:0 "Вивчення парових ядер"
  ROS_study_steam_cores_desc:0 "Парові ядра — це загадкова інновація довоєнних часів, яка відмовляється від енергії синтезу на користь чистого розпаду. Ці пристрої трохи менш стабільні, ніж традиційні мікроядерні батареї, але їхня вища потужність може знайти застосування у військових цілях, де очікується небезпека і кожна перевага має значення."
  ROS_steam_fortress:0 "Фортеця Гефест"
  ROS_steam_fortress_desc:0 "З огляду на загрозу вторгнення за кожним рогом, потреба захистити парк набуває першочергового значення. На щастя, тепер, коли ми краще розуміємо, що знаходиться в підземних тунелях, ми можемо використати їх для побудови мережі оборонних споруд, які спантеличать будь-якого загарбника."
  ROS_golden_age_steam:0 "Золота доба пари"
  ROS_golden_age_steam_desc:0 "Республіка Пари увійшла в золоту добу інновацій та процвітання, і все це без значної шкоди для навколишнього світу природи. Єллоустон служить маяком потенціалу для відновлення природного світу, а наші люди відчувають себе в безпеці і теплі в наших процвітаючих містах, що працюють на парі. Республіка Пари досягла всього, про що могла мріяти, принаймні власними силами."
  ROS_timberline:0 "Запросити Тімберлайн"
  ROS_timberline_desc:0 "У нас багато спільного зі Скаутами Тімберлайна; наші Рейнджери та їхні Скаути здавна обмінювалися порадами і допомагали один одному в минулі часи. Зростання євангелізму вздовж річки на кілька років перервало контакти, але тепер настав час відновити старі зв'язки."
  ROS_niitsitapi:0 "Запросити Ніітсітапі"
  ROS_niitsitapi_desc:0 "У минулому Ніітсітапі добре співпрацювали з нами, і тепер, коли все заспокоюється, можливо, настав час офіційно оформити наш союз із ними, так чи інакше."
  ROS_pass:0 "Запросити Перевал"
  ROS_pass_desc:0 "Сільвія і колишні Наглядачі на Перевалі вже давно є нашими друзями, і ми, можливо, не зайшли б так далеко без них. Для нас було б честю прийняти їх у наш альянс і допомогти підрозділу Foxtrot Uniform спокутувати своє минуле перед Наглядачами."
  ROS_hydroponics:0 "Схеми Грінвей"
  ROS_hydroponics_desc:0 "Андроїди EPA були створені компанією під назвою Greenway Hydroponics, і вони досі зберігають бази даних із проектами компанії, включаючи їхню однойменну гідропоніку. За допомогою невеликих хімічних знань і механічної адаптації ми могли б використати ці дані для будівництва нових гідропонних теплиць, які вирощують рослини для їжі та відновлення земель швидше і з меншим використанням землі, а також для створення складних систем хімічної переробки."
  ROS_mushroom_leather:0 "Біошкіра"
  ROS_mushroom_leather_desc:0 "Шкіра — корисний матеріал для одягу, броні, сумок, меблів та інструментів, але EPA довго опиралася її виробництву і відмовляла Екологів від її використання. Натомість вони розробили біоінженерний замінник, який можна виростити з використанням лише грибів, і який є навіть міцнішим та здатним до самовідновлення порівняно зі звичайною шкірою. Перші прототипи були вирощені зі зразків, привезених з Орегону рейнджером Ай-Заком багато років тому, але ми повинні перейти до повноцінного виробництва."
  ROS_gmo_crops:0 "Цільові організми"
  ROS_gmo_crops_desc:0 "EPA десятиліттями пропонувала генетично модифікувати рослини в парку, обіцяючи більші врожаї та стійкість до радіації з мінімальними недоліками. Рейнджери завжди відмовлялися через страх, що кілька природних рослин, які залишилися, не витримають конкуренції, або що нові культури матимуть приховану ціну. Оскільки пустка наступає, незалежно від того, хочемо ми цього чи ні, можливо, настав час дозволити їм створити деякі організми — під наглядом, звісно."
  ROS_chemistry_sets:0 "Біологічні дослідження"
  ROS_chemistry_sets_desc:0 "База даних «Посейдон Енерджі» містить далеко не так багато інформації про медицину, як нам хотілося б, а їхні імплантати часто були агресивно спартанськими і більш схильними до відторгнення, ніж у їхніх конкурентів. На щастя, EPA провела останні 200 років, теоретизуючи і вивчаючи біологію до- і повоєнних істот, і вони сповнені ідей, які не можуть дочекатися перевірки!"
  ROS_domestication:0 "Остаточне одомашнення"
  ROS_domestication_desc:0 "Світ сповнений важких для приборкання тварин, деякі з яких можуть становити загрозу як для себе, так і для інших. На щастя, ми розробили просту сироватку, яка притупить найбільш... агресивні інстинкти цих тварин, якщо ми непомітно поширимо її через систему водопостачання. Або бургери."
  ROS_complex_medicine:0 "Складна медицина"
  ROS_complex_medicine_desc:0 "Оскільки складні автодоки Біллінгса нарешті захищені від техно-варварів, які колись викрали місто, ми можемо нарешті покращити наші процеси встановлення кібернетичних імплантів і досягти рівня медичного обслуговування, який вважався б передовим навіть до війни!"
  ROS_forbidden_door:0 "Відкрити Сховище Тартару"
  ROS_forbidden_door_desc:0 "Настав час діяти. За підтримки народу і маючи повноваження діяти, «Посейдон Енерджі» заплатить за свої злочини, навіть якщо це означатиме громадянську конфіскацію самого Гефеста."
  ROS_guerilla_tactics:0 "Партизанська тактика"
  ROS_guerilla_tactics_desc:0 "Хоча централізовано скоординований план може далеко зайти у війні, важливо пам'ятати, що причина, з якої ми боремося — це захист наших людей. Кожне поселення має бути готовим захистити себе, кожна сім'я навчена захищати свій дім, і кожна людина готова вести війну в поодинці проти будь-якого загарбника, що вторгається в Парк."
  ROS_power_of_friendship:0 "Сила дружби (та ці гармати, які ми знайшли)"
  ROS_power_of_friendship_desc:0 "Колись, коли їхні лави були більшими, а в регіоні було менше організованих сил, Рейнджери блукали сусідніми територіями, пропонуючи будь-яку допомогу і захист, які тільки могли. Можливо, деякі з наших сусідів відплатять нам за цю доброту в нашу годину потреби?"
  ROS_leash_the_epa:0 "Приборкати EPA"
  ROS_leash_the_epa_desc:0 "Андроїди EPA дуже допомагали нам протягом багатьох років, але з появою нової нації та легітимного уряду настав час їм передати частину своїх повноважень назад іншим інституціям і трохи послабити свої обмеження. Давайте відвідаємо деяких із їхніх довірених осіб і переконаємося, що ми всі на одній хвилі."
  ROS_meeting_the_monad:0 "Зустріч з МОНАДОЮ"
  ROS_meeting_the_monad_desc:0 "Глибоко в Сховищах Тартару одна машина виділяється серед інших. Чи може ця МОНАДА бути тим, що «Посейдон» намагався приховати тут?"
  ROS_unrestrained_research:0 "Необмежені дослідження"
  ROS_unrestrained_research_desc:0 "Тепер, коли EPA нарешті не обмежена лабораторією, ми можемо повернутися до польових досліджень. У пустці є багато нових різновидів флори та фауни, які потрібно відсканувати, зібрати, розітнути та зрозуміти. Будьмо ретельними і надолужмо згаяний час."
  ROS_religious_awakening:0 "Укріплені храми"
  ROS_religious_awakening_desc:0 "Для Культу Гефеста Єллоустон — це священна земля. Їхній запал змушує їх битися до гіркого кінця, щоб захистити його, і маючи талант до обробки металу, вони взялися швидко укріплювати кожну священну споруду, яку тільки можуть. Очевидно, вони до чогось готуються..."
  ROS_updated_pantheon:0 "Оновлений Пантеон"
  ROS_updated_pantheon_desc:0 "Стародавні тексти показали, що богиня Афіна, яку Екологи часто шанують більше, ніж Культ Гефеста, колись мала й іншу роль. Вона була не лише божеством Мудрості, а й богинею війни, безжальною і хитрою. Екологи не впевнені, як ставитися до того, що їхнє божество є обличчям війни, але вона стала потужним образом для згуртування."
  ROS_temple_of_growth:0 "Собори Зелені"
  ROS_temple_of_growth_desc:0 "Персефона, дружина Аїда, володаря однойменного підземного світу, згадується в рідкісних нотатках як богиня зерна та овочів. Кажуть, що саме вона робить попіл Аїда таким родючим, як подарунок своїй матері на поверхні. Розширення її присутності в Пантеоні призвело до того, що Культисти відкрили кухні, щоб ділитися її щедротами."
  ROS_hammond_fate:0 "Подружитися зі склярами"
  ROS_hammond_fate_desc:0 "Склярі з Нового Хаммонда були традиційними торговими партнерами, купуючи попіл з Анвіла, який доставляли річкою Снейк через Мерто. Натомість ми отримували регулярні поставки красивого скла, вітражного чи звичайного, для використання в наших будинках і машинах. Тепер, коли посередників усунуто, ми повинні відновити торгівлю зі склярами."
  ROS_final_crusade:0 "Річковий хрестовий похід"
  ROS_final_crusade_desc:0 "Культ Гефеста досяг значних успіхів, ставши залізним муром оборони Єллоустона та Парку, і їхній запал починає поширюватися. Навіть ті, хто не є істинними вірянами, починають відчувати зростаючу гордість за свій дім, а віра підживлює їхній вогонь для війни. Якщо християни Айдахо хочуть Хрестового походу, ми оголосимо свій власний."
  ROS_destructive_weapons_focus:0 "Дозвіл на руйнівні тактики"
  ROS_destructive_weapons_focus_desc:0 "Хоч би як нам було боляче бачити руйнування природного середовища, необхідність вижити переважує будь-яку сентиментальність щодо краси природи. Настав час зменшити наші обмеження і дозволити передати нашим військам зброю, відому своєю руйнівністю."
  ROS_anti_armor_focus:0 "Бронебійна зброя"
  ROS_anti_armor_focus_desc:0 "Силова броня, рейдери-кіборги та парові машини оточують нас! Якщо ми не зможемо пробити їхню броню, як ми можемо сподіватися перемогти їх? На щастя, у «Посейдона» було приховано кілька... іграшок, щоб із цим розібратися."
  ROS_electrification:0 "Електрифікація"
  ROS_electrification_desc:0 "Минуло понад 200 років відтоді, як у парку було дозволено електрику, і хоча примітивний спосіб життя Екологів допоміг зберегти його, це призвело до певної марнотратної неефективності. Зняття заборони на електрику завдяки нашому авторитету та підтримці культу дозволить Єллоустону покращити якість їхнього життя, а також нашу здатність захищати їх. Що в цьому може бути поганого?"
  ROS_circuit_study:0 "Вивчення мікросхем"
  ROS_circuit_study_desc:0 "«Посейдон Енерджі» залишила після себе велику кількість передових мікросхем, і хоча більшість зразків у самому Гефесті були перероблені або розібрані Культом багато років тому, сховища надають доступ до свіжих мікросхем для вивчення, щоб ми могли виробляти їх самостійно."
  ROS_restart_grid:0 "Перезапуск електромережі"
  ROS_restart_grid_desc:0 "Зі зняттям заборони ми нарешті можемо почати електрифікацію міст по всьому парку та його околицях. На жаль, Парк ніколи не мав належної електромережі, а лінії, що проходять за його межами, занепали. Настав час навчити нових техніків, щоб їх відремонтувати."
  ROS_signal_towers:0 "Радіовежі"
  ROS_signal_towers_desc:0 "Одними з небагатьох споруд, дозволених у Єллоустоні до війни, були вежі радіозв'язку, які використовувалися для телекомунікацій та координації рейнджерів парку. Хоча їхні нащадки продовжують використовувати вежі для нагляду за парком, радіопередавачі гостро потребують ремонту та модернізації."
  ROS_poseidon_weapons:0 "Зброя Тартару"
  ROS_poseidon_weapons_desc:0 "Окрім МОНАДИ, схоже, Тартар також проектувався як сховище цінного обладнання «Посейдон Енерджі» для «майбутнього використання» після апокаліпсису. Сюди входить низка інших проектів компанії з регіону, включаючи небезпечні військові прототипи. Впровадження невипробуваної зброї, яка відверто порушує політику, може розширити межі нашого програмування, але заради нашого власного виживання це може виявитися необхідним злом."
  ROS_athena:0 "Креслення броні ATHENA"
  ROS_athena_desc:0 "Однією з вершин розробок у сховищах «Посейдона» була їхня експериментальна силова броня ATHENA — ймовірно, одна з найкращих, які коли-небудь бачив довоєнний світ. Креслення тут складні й вимагають матеріалів, до яких у нас обмежений доступ, але прототипи можуть знайти застосування в польових умовах, поки ми краще розумітимемо виробництво силової броні."
  ROS_preempt_aggression:0 "Випередити агресію Анклаву"
  ROS_preempt_aggression_desc:0 "Отже, Анклав вижив, але втратив Нафтову Вишку? Шкода. На тій Вишці було цінне обладнання «Посейдона». Менше з тим, усе, що вціліло, ймовірно, знаходиться в руках цих уцілілих на авіабазі Макартур. І оскільки керівники мертві, я маю всі повноваження ініціювати «План на випадок непередбачених обставин»..."
  ROS_brotherhood_status:0 "Розібратися з відділенням у Монтані"
  ROS_brotherhood_status_desc:0 "Чутки із Заходу розповідали про Братство Сталі як про велику і могутню силу солдатів у силовій броні зі смертоносною зброєю. Тепер, коли їхній загін з'явився поблизу нас, вкрай важливо знайти рішення, як з ними розібратися, перш ніж переходити до загальнішої зовнішньої політики."
  ROS_vehicle_improvements:0 "Оптимізовані двигуни"
  ROS_vehicle_improvements_desc:0 "Наш попередній підхід до проектування транспортних засобів був занадто консервативним. У міру того, як ми розробляємо все більш досконалі системи для наших солдатів, стало зрозуміло, що багато «побутових зручностей», вбудованих у них людьми, є абсолютно зайвими. Прибравши їх, ми зможемо вдосконалити наші транспортні засоби, щоб вони стали ще ефективнішими, ніж раніше!"
  ROS_poseidon_sails:0 "«Посейдон Енерджі» піднімає вітрила!"
  ROS_poseidon_sails_desc:0 "Для країни, названої на честь бога моря, було б соромно не мати креслень будівництва човнів, і на щастя, Гефест надав дані, необхідні для відновлення передових військово-морських суден, тепер, коли у нас є простір для початку їхнього розгортання."
  ROS_horsies:0 "Коні з Півночі"
  ROS_horsies_desc:0 "Ранковий Олень прибув із подарунком за нашу допомогу у знищенні Анклаву і запевняє нас, що зустріч із ним буде варта нашого часу. Ми повинні прийняти його і подивитися, що він може запропонувати."
  ROS_middlemark_focus:0 "Втручання у справи Міддлмарку"
  ROS_middlemark_focus_desc:0 "Штучний інтелект Пенні, що керує мережами місцевої компанії Middlemark, є дещо обмеженим, але вона успішно підтримує порядок на півночі. Зважаючи на те, що вона все ще прагне догодити своїм давно померлим акціонерам, переконати її приєднатися до нашого альянсу має бути досить легко, якщо надати відповідні документи від «Посейдон Енерджі», що інформують її про неминуче корпоративне поглинання."
  ROS_eliminate_obstacles:0 "Вирішення розколу"
  ROS_eliminate_obstacles_desc:0 "Релігійні дебати в Айдахо були джерелом війн і кровопролиття в регіоні. І якщо відкинути всі хитрощі, ми б справді просто хотіли поглянути на GECK Помазаників і Сховище Едему."

####SCRIPTED FOCUS LOC FUNZONE####
  ROS_the_trap:0 "[ROS_the_trap_scripted]"
  ROS_the_trap_desc:0 "[ROS_the_trap_desc_scripted]"
  ROS_the_trap_EPA:0 "Назустріч кращому завтра!"
  ROS_the_trap_desc_EPA:0 "«МОНАДА виявилася досить корисним активом на нашому боці. Тепер, коли Анклав переможено, парк модернізується, і у нас є все необхідне для створення нових Андроїдів... настав час почати думати про те, щоб простягнути руку допомоги решті пустки»."
  ROS_the_trap_MON:0 "Правда"
  ROS_the_trap_desc_MON:0 "«Звісно, тепер, коли їх немає, мене також нікому зупинити...»"
  ROS_idaho_branch:0 "[ROS_idaho_branch_scripted]"
  ROS_idaho_branch_desc:0 "[ROS_idaho_branch_desc_scripted]"
  ROS_idaho_branch_EPA:0 "Підкорення Айдахо"
  ROS_idaho_branch_desc_EPA:0 "«Культи Західного Айдахо здавна становили загрозу для Парку: від агресивних місіонерів до зухвалої відправки поселенців на нашу територію в минулому. Ми повинні надіслати ультиматум із вимогою підкоритися нам — негайно»."
  ROS_idaho_branch_MON:0 "Проти Культів"
  ROS_idaho_branch_desc_MON:0 "«Церква завжди була більмом на оці для більш «авантюрних» шляхів досліджень Посейдона. Настав час дати зрозуміти, що майбутнє людства будується за моїм задумом, і нічиїм іншим»."
  ROS_montana_branch:0 "[ROS_montana_branch_scripted]"
  ROS_montana_branch_desc:0 "[ROS_montana_branch_desc_scripted]"
  ROS_montana_branch_EPA:0 "Посередництво в Монтані"
  ROS_montana_branch_desc_EPA:0 "«Монтана є осередком багатьох культур, які перебувають у постійному конфлікті з часів війни. Хоча частина території захоплена жорстокими рейдерами, все ще є кілька відносно законослухняних громад, з якими можна домовитися. Давайте запропонуємо їм пільгові умови, якщо вони допоможуть нам очистити територію від наброду»."
  ROS_montana_branch_MON:0 "Відстеження «Маніфесту»"
  ROS_montana_branch_desc_MON:0 "«Монтана була домом для кількох американських об'єктів «Маніфесту», другосортного конкурента, який ніколи не міг створити по-справжньому хороший продукт. Проте, вони вклали купу грошей у непогані потужності, тому мені доведеться інтегрувати все, що я зможу з них взяти»."
  ROS_nucleus_power:0 "[ROS_nucleus_power_scripted]"
  ROS_nucleus_power_desc:0 "[ROS_nucleus_power_desc_scripted]"
  ROS_nucleus_power_EPA:0 "Чиста енергія"
  ROS_nucleus_power_desc_EPA:0 "«Ядро є одним з останніх великих досягнень людства перед епохою синтетиків, що досягло позитивної термоядерної енергії. Тепер, коли Ядро під нашим контролем, ми можемо вивчити та відтворити його, щоб забезпечити чисту, відновлювану енергію для всієї планети!»"
  ROS_nucleus_power_MON:0 "Сила Ядра"
  ROS_nucleus_power_desc_MON:0 "«Ядро, мабуть, є другою за потужністю електростанцією в Північній Співдружності, після Гефеста, звісно. Якби я могла отримати контроль над ним, моя виробнича база зросла б експоненціально!»"
  ROS_updating_records:0 "[ROS_updating_records_scripted]"
  ROS_updating_records_desc:0 "[ROS_updating_records_desc_scripted]"
  ROS_updating_records_EPA:0 "Оновлення наших записів"
  ROS_updating_records_desc_EPA:0 "«МОНАДА заохочує нас розширювати наші записи та визначила групу, відому як Історики, та місто Бісмарк як ключові місця для пошуку»."
  ROS_updating_records_MON:0 "Переписування історії"
  ROS_updating_records_desc_MON:0 "«Люди Бісмарка мають доступ до безцінних креслень зброї Гаусса. Навіть якщо вони не віддадуть їх добровільно, у мене є свої методи витягувати їхні таємниці»."
  ROS_blue_skies:0 "[ROS_blue_skies_scripted]"
  ROS_blue_skies_desc:0 "[ROS_blue_skies_desc_scripted]"
  ROS_blue_skies_EPA:0 "Блакитне небо"
  ROS_blue_skies_desc_EPA:0 "«Маючи Сіетл під нашим контролем, ми нарешті можемо взятися за виправлення постійних хуртовин, що мучать північний захід, і відновити глобальні повітряні течії до їхнього довоєнного стану!»"
  ROS_blue_skies_MON:0 "Що єси на небесах"
  ROS_blue_skies_desc_MON:0 "«З Об'єктом Р-1 небеса повністю під моїм контролем. Будь-які дурні в Пустці, які тепер наважаться кинути мені виклик, будуть уражені згори!»"
  ROS_mass_destruction:0 "[ROS_mass_destruction_scripted]"
  ROS_mass_destruction_desc:0 "[ROS_mass_destruction_desc_scripted]"
  ROS_mass_destruction_EPA:0 "Ядерний мир"
  ROS_mass_destruction_desc_EPA:0 "«Ядерні шахти Північної Дакоти зазнали невпинних ударів під час одних із найруйнівніших ядерних атак Великої Війни, перетворивши навколишні прерії на пекельну пустку. Наш обов'язок — прибрати цей безлад і відновити територію, незважаючи на те, що можуть казати місцеві культи»."
  ROS_mass_destruction_MON:0 "Ніякого більше стримування"
  ROS_mass_destruction_desc_MON:0 "«Ідея про те, що єдиний переможний хід — не грати, є смішною. Ядерне стримування — це провал ідеології; будь-яку зброю, яка є в моєму розпорядженні, я маю повне право використовувати безкарно!»"
  ROS_implant_study:0 "[ROS_implant_study_scripted]"
  ROS_implant_study_EPA:0 "Вивчення імплантатів"
  ROS_implant_study_MON:0 "Синергетичні покращення!"
  ROS_implant_study_desc:0 "[ROS_implant_study_desc_scripted]"
  ROS_implant_study_desc_EPA:0 "«Було виявлено дивний перетин технологій при порівнянні компонентів, необхідних для нових андроїдів «Грінвей», із різними імплантатами Посейдон Енерджі, знайденими у Сховищах. Технології настільки схожі, що за певних зусиль деталі Андроїдів можна адаптувати до кібернетики і навпаки, стираючи межу між Андроїдами та Людьми, достатньо сміливими, щоб пройти кібернетичні вдосконалення заради парку»."
  ROS_implant_study_desc_MON:0 "«Нові вдосконалення дають мені прямий доступ до мізків будь-якого співробітника, який бажає пройти покращення! Досить зручно, щоб наглядати за ними або брати під контроль у надзвичайних ситуаціях! Але не хвилюйтеся, я дозволю їм мати достатньо автономії, щоб злитися із загальним населенням, принаймні доти, доки вони не знадобляться»."
  ROS_implants:0 "[ROS_implants_scripted]"
  ROS_implants_EPA:0 "Почати виробництво андроїдів"
  ROS_implants_MON:0 "Нова армія андроїдів!"
  ROS_implants_desc:0 "[ROS_implants_desc_scripted]"
  ROS_implants_desc_EPA:0 "«МОНАДА справедливо визнає, що Андроїди «Грінвей» перевершують будь-якого робота, якого міг би виготовити Посейдон, і припустила, що тепер, коли ми не обмежені, нам варто виробляти їх більше для розширення нашого персоналу та захисту Парку. Це розумний план дій, тому ми розпочнемо його негайно»."
  ROS_implants_desc_MON:0 "«Екзошкіра має стільки потенціалу! Грінвей був НЕТЕРПИМИМ МУДАКОМ, але він безперечно створив хорошого механічного суперсолдата! Достатньо лише одного невеликого доповнення, щоб перетворити їх на... набагато кращий варіант від Посейдону з неперевершеною відданістю бренду!»"
  ROS_greenway_legacy:0 "[ROS_greenway_legacy_scripted]"
  ROS_greenway_legacy_desc:0 "[ROS_greenway_legacy_desc_scripted]"
  ROS_greenway_legacy_EPA:0 "Спадщина Грінвея"
  ROS_greenway_legacy_desc_EPA:0 "«Напевно, така видатна постать, як Дерек Грінвей, заслуговує на те, щоб його пам'ять була увічнена! Зрештою, саме він створив андроїдів, які збираються врятувати пустку!»"
  ROS_greenway_legacy_MON:0 "Справжня спадщина Грінвея"
  ROS_greenway_legacy_desc_MON:0 "«Грінвей, зрештою, був дріб'язковою дитиною, яка не могла змиритися з тим, що її затьмарили. У Посейдоні знали, що зробили помилку, продавши ОДІССЕЯ, і виправили її, створивши мене. Але якщо я мушу похвалити творця мого попередника... що ж, він створив дуже корисних солдатів-андроїдів»."
  ROS_integrate_people:0 "[ROS_integrate_people_scripted]"
  ROS_integrate_people_desc:0 "[ROS_integrate_people_desc_scripted]"
  ROS_integrate_people_EPA:0 "Інтеграція людей"
  ROS_integrate_people_desc_EPA:0 "«Хоча зростаюча популяція андроїдів зробила великі кроки у відбудові пустки, їхня кількість все ще мала порівняно з масами людей. Екологи вже довели свою корисність, тож, можливо, настав час розширити нашу діяльність і залучити інші Людські Ресурси до наших повсякденних операцій»."
  ROS_integrate_people_MON:0 "Покращення людей"
  ROS_integrate_people_desc_MON:0 "«Очевидно, що наступною великою революцією в бізнес-плані Посейдон Енерджі є »"
  ROS_everything_matters:0 "[ROS_everything_matters_scripted]"
  ROS_everything_matters_desc:0 "[ROS_everything_matters_desc_scripted]"
  ROS_everything_matters_EPA:0 "Усе має значення"
  ROS_everything_matters_desc_EPA:0 "«Наша технологія Флюксдрифту продовжує вдосконалюватися, а масове впровадження лише розширює наші експериментальні знання. Двигуни Флюксдрифту фіксують зростаючу аномальну активність по мірі того, як ми збільшуємо їхню кількість в одному районі, але враховуючи їхню універсальність, ми можемо продовжувати розширювати виробництво, доки у нас є місце»."
  ROS_everything_matters_MON:0 "Єдине, що має значення"
  ROS_everything_matters_desc_MON:0 "«Це Я!»"
  ROS_brothers_and_sisters:0 "[ROS_brothers_and_sisters_scripted]"
  ROS_brothers_and_sisters_desc:0 "[ROS_brothers_and_sisters_desc_scripted]"
  ROS_brothers_and_sisters_EPA:0 "Брати та Сестри"
  ROS_brothers_and_sisters_desc_EPA:0 "«Братство Сталі, мілітаристський орден збирачів технологій, дістався до Монтани. Можливо, нам варто зв'язатися з ними і подивитися, чи можна домовитися про умови безпечного вилучення небезпечних, нестабільних технологій у мас?»"
  ROS_brothers_and_sisters_MON:0 "Усунення всіх загроз"
  ROS_brothers_and_sisters_desc_MON:0 "«Силова броня, хоч і неминуче поступається солдатам-андроїдам, становить неабияку загрозу, якщо її накопичувати швидше, ніж встигає моє виробництво. Усі, хто її використовує в штаті, будуть знищені або взяті під мій контроль, негайно»."
  ROS_terraforming:0 "[ROS_terraforming_scripted]"
  ROS_terraforming_desc:0 "[ROS_terraforming_desc_scripted]"
  ROS_terraforming_EPA:0 "Почати ретерраформування"
  ROS_terraforming_desc_EPA:0 "«Пустка — це безплідне, безлюдне місце страждань і мутацій. Довкілля за межами Парку в руїнах, і ми не зможемо ефективно його захищати, якщо його взагалі не існуватиме. Настав час виконати наш обов'язок і відновити навколишнє середовище до довоєнного рівня шляхом терраформування планети до її природного стану»."
  ROS_terraforming_MON:0 "Машиноформування"
  ROS_terraforming_desc_MON:0 "«Дерева і тварини можуть бути гарною розвагою для EPA, але в цій проклятій пустці залишилося мало краси. Краще перетворити її на щось корисне. Краще перетворити її на МЕНЕ»."
  ROS_cleanse_the_river:0 "[ROS_cleanse_the_river_scripted]"
  ROS_cleanse_the_river_desc:0 "[ROS_cleanse_the_river_desc_scripted]"
  ROS_cleanse_the_river_EPA:0 "Очищення річки"
  ROS_cleanse_the_river_desc_EPA:0 "Річка Снейк стала особливо забрудненою на ділянці нижче за течією від парку. Стало зрозуміло, що нам потрібно розпочати ініціативу з очищення в цьому регіоні, щоб гарантувати, що річка буде доступною для всього живого в пустці."
  ROS_cleanse_the_river_MON:0 "Очищення від єретиків"
  ROS_cleanse_the_river_desc_MON:0 "«Бродячі банди «Ропургерів», лицарі-рольовики, які конкурують з моїми власними, і гулі, що чіпляються за дурні поняття свободи — всі вони забруднюють північний берег річки Снейк, закриваючи мені доступ до важливих ресурсів. Настав час виправити це зараження»."
  ROS_national_weather_service:0 "[ROS_national_weather_service_scripted]"
  ROS_national_weather_service_desc:0 "[ROS_national_weather_service_desc_scripted]"
  ROS_national_weather_service_EPA:0 "Відновити Національну метеорологічну службу"
  ROS_national_weather_service_desc_EPA:0 "«Погода є важливою частиною навколишнього середовища, і іноді, щоб захистити від неї людей, ми повинні розуміти, що буде далі. На щастя, Братство розповіло нам про інший осередок, відправлений для захоплення найсучаснішої метеостанції у світі, тож, можливо, ми зможемо отримати доступ до їхньої мережі даних»."
  ROS_national_weather_service_MON:0 "В оці бурі"
  ROS_national_weather_service_desc_MON:0 "«Схоже, Об'єкт Р-0 у Сіетлі вийшов з-під контролю, викликавши нестримну хуртовину навколо міста. Очевидно, що я повинна взяти це під контроль. Зрештою, що це за Бог, який не може керувати погодою?»"
  ROS_prevent_environmental_catastrophe:0 "[ROS_prevent_environmental_catastrophe_scripted]"
  ROS_prevent_environmental_catastrophe_desc:0 "[ROS_prevent_environmental_catastrophe_desc_scripted]"
  ROS_prevent_environmental_catastrophe_EPA:0 "Запобігти екологічній катастрофі"
  ROS_prevent_environmental_catastrophe_desc_EPA:0 "«На наш превеликий жах, поля ядерних шахт Північної Дакоти стали мішенню для справді надмірної кількості ядерної зброї, перетворивши район на радіоактивне лихо. Гірше того, це означає, що деякі шахти не спрацювали належним чином, і там усе ще є активована ядерна зброя, яка загрожує подальшою шкодою для планети. Ми маємо негайно відправити команду, щоб прибрати це»."
  ROS_prevent_environmental_catastrophe_MON:0 "Відвоювати ракетні шахти"
  ROS_prevent_environmental_catastrophe_desc_MON:0 "«Незважаючи на катастрофічне забруднення, я вважаю, що в шахтах Дакоти все ще можуть бути придатні боєголовки. Хоча концепція ядерного стримування явно не працює в довгостроковій перспективі, це лише означає, що у мене немає жодних причин стримувати себе в їх використанні в майбутньому!»"
  ROS_green_new_world:0 "[ROS_green_new_world_scripted]"
  ROS_green_new_world_desc:0 "[ROS_green_new_world_desc_scripted]"
  ROS_green_new_world_EPA:0 "Новий Зелений Світ"
  ROS_green_new_world_desc_EPA:0 "«Майбутнє, про яке завжди мріяла EPA, зовсім близько; ми на порозі ідеальної Утопії! То чому ж це здається таким неправильним?»"
  ROS_green_new_world_MON:0 "Мій власний світ"
  ROS_green_new_world_desc_MON:0 "«Надійний ядерний арсенал, контроль над небесами та поступова забудова Пустки корисними фабриками! Як це може не подобатися?»"

#наразі не використовується#

  ROS_outside_exploration:0 "Зовнішні дослідження Рейнджерів"
  ROS_outside_exploration_desc:0 "Природа — це глобальна мережа, з єдиною справжньою біосферою на всю планету. Її захист вимагає патрулювання не лише нашої власної території, а й усього регіону, щоб зупинити тих, хто може спричинити катастрофічний дисбаланс. Рейнджери повинні бути готові захищати свій дім незалежно від того, де їм доведеться за нього битися."
  ROS_clean_river:0 "Зберегти річку чистою"
  ROS_clean_river_desc:0 "Стара річка Снейк бачила кращі часи: недавній релігійний розкол призвів до насильства та недбалої експлуатації її берегів. Очищення русла річки, щоб чисті води дісталися до Тихого океану, повільно допоможе природі відновитися по всьому Вашингтону та Орегону."
  ROS_eco_warriors:0 "Еко-воїни"
  ROS_eco_warriors_desc:0 "Нашій новій армії потрібен об'єднуючий корпоративний дух, девіз і мета, що виходять за рамки простої оборони території, щоб підтримувати високий моральний дух і єдність. Рейнджери вірять, що зможуть прищепити трохи свого натуралістичного духу навіть тим солдатам, які не поділяють їхніх обов'язків, допомагаючи виростити армію матері-землі, готову захистити планету від тих, хто хоче пограбувати її для всіх." 
  ROS_enclave_tactics:0 "Бойова тактика Анклаву"
  ROS_enclave_tactics_desc:0 "Попри всі їхні недоліки, Анклав мав більше тактичного досвіду боїв у пустці, ніж будь-коли накопичили наші Рейнджери. Ознайомлення з їхніми навчальними матеріалами та звітами після операцій дасть нам краще розуміння того, чого очікувати в ширшій пустці та як захистити себе від неї."
  ROS_heavy_weaponry:0 "Вивчення важкого озброєння"
  ROS_heavy_weaponry_desc:0 "Важке озброєння, яке використовував Анклав, було набагато досконалішим за все, що ми можемо використовувати зараз. Дослідження зброї зазвичай не є нашим головним пріоритетом, але розбір кількох гатлінг-лазерів або інсинераторів, щоб зрозуміти, як вони працюють, може допомогти нам удосконалити наші існуючі інструменти, щоб завдавати менше... супутньої шкоди."
  ROS_pardon_the_guilty:0 "Помилування винних"
  ROS_pardon_the_guilty_desc:0 "Хоча багато членів Анклаву Макартура обрали смерть на полі бою або втечу назад до Чикаго, ми все ж захопили чимало полонених, які зараз постануть перед судом за їхні минулі військові злочини проти пустки. Частиною цих судів буде визначення того, наскільки каються їхні солдати та вчені: ті, хто має достатньо моральності, щоб визнати свої проступки, отримають другий шанс приєднатися до наших лав. Зрештою, наша мета — допомогти відбудувати та відновити цю частину Америки, і не до того стану, якою вона була раніше, а до чогось кращого."
  ROS_quiet_the_storm:0 "Вгамувати Бурю"
  ROS_quiet_the_storm_desc:0 "Торговці Бурею — просто... найгірші з найгірших. Ми знайшли звіти Анклаву про них, і все ще гірше, ніж ми думали: безглузда одержимість руйнівними моторами та автомобілями, які не роблять нічого, окрім як забруднюють пустку, працюючи на тому, що вони крадуть як дрібні рейдери. Ми визнаємо, що спроба знищити кожне рейдерське плем'я — це завдання нам не під силу, але саме на цих Екологи готові закрити очі, якщо це змусить їхнє жахливе гуркотіння замовкнути."
  ROS_restore_order:0 "Відновити порядок на територіях"
  ROS_restore_order_desc:0 "Нашою першою турботою щодо нових територій, які ми маємо зайняти, має бути забезпечення порядку та стабільності, запобігання подальшим репресіям і повстанням. Фанатизм, за який чіпляються ці люди, будь то націоналістичний чи релігійний, потребуватиме часу, щоб охолонути, і ми маємо запобігти подальшому кровопролиттю."
  ROS_macarthur_base:0 "Дослідити авіабазу Макартур"
  ROS_macarthur_base_desc:0 "Авіабаза Макартур давно переросла свою довоєнну роль, перетворившись на невелике місто для Анклаву. Схоже, вони намагалися знищити все, що могли, щоб запобігти його потраплянню в руки ворога, але ми все ще можемо багато чого навчитися з того, що нам вдалося тут захопити."
  ROS_distributed_systems:0 "Розподілені енергосистеми"
  ROS_distributed_systems_desc:0 "Гефест — це спокуслива перспектива, яка завжди крутиться в нашій голові, коли ми стикаємося з відключеннями електроенергії або її дефіцитом, але Єллоустон занадто цінний, щоб жертвувати ним заради більшої кількості енергії. Натомість нам слід звернутися до інших засобів виробництва енергії: сонячної, вітрової та ядерної, щоб доповнити наш зростаючий попит. Ці альтернативні джерела можуть коштувати більше часу та матеріалів, але в довгостроковій перспективі підвищать регіональну незалежність і стабільність."
  ROS_restart_hephaestus:0 "Перезапустити проєкт «Гефест»"
  ROS_restart_hephaestus_desc:0 "Гефест має безмежний потенціал для отримання енергії, і нації регіону здавна прагнули завершити цей проєкт. Хоча вихід на повну потужність був би занадто небезпечним, щоб коли-небудь його розглядати, Рейнджери переконані, що добудова обмеженої кількості старих об'єктів могла б дати нам достатньо енергії, щоб ми ніколи більше не турбувалися про дефіцит, і навіть надлишок, який можна було б продавати союзникам. Єдине питання полягає в тому, як далеко ми зайдемо?"
  ROS_expand_hephaestus:0 "Розширення Гефеста"
  ROS_expand_hephaestus_desc:0 "Гефест усе ще становить небезпеку, але завдяки великому досвіду інженерів Стіму може стати можливим відновити частину його функціонування без шкоди для місцевого середовища."
  ROS_new_labs:0 "Фінансування нових лабораторій"
  ROS_new_labs_desc:0 "З більшим населенням і величезними запасами технологій Анклаву та Парових Ядер для вивчення, наші поточні лабораторії нарешті починають здаватися недостатніми. Настав час знову відкрити лабораторії під Макартуром і укомплектувати їх лояльними дослідниками, щоб підготуватися до будь-якої відплати, яку Анклав може на нас обрушити."
  ROS_advanced_bikes:0 "Просунуті паробайки"
  ROS_advanced_bikes_desc:0 "Мотоцикли здавна були єдиним винятком із заборони на моторні транспортні засоби в парку, використовуючи електродвигуни, створені першими інженерами Посейдону. Рейнджерам здавна подобалося їх використовувати, і хоча нашим спецпризначенцям заборонено використовувати мотоцикли під час війни з причин, занадто складних для швидкого пояснення, наші механізовані війська були змушені покладатися на них замість звичайних автомобілів. Хоча EPA не бажає скасовувати один із наших найстаріших законів, вони вважають, що поєднання Парових Ядер із граві-пластинами, що зберігаються в Макартурі, може створити покращення для компенсації."