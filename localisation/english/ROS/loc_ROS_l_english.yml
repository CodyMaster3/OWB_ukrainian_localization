  # Characters
  ROS_ecologist_name:0 "Перший Еколог Сі-Бастіон"
  first_ecologist_desc:0 "Останніми роками, після того як його попередник загинув від рук мародерських фанатиків із заходу, Сі-Бастіон перебрав на себе управління племенами та народами Єллоустону. Хоча кожна дитина, яка виростає в Єллоустоні, чула розповіді старих паркових рейнджерів, що патрулювали гори та долини до війни, у серці Сі-Бастіона вони залишили особливо сильний слід. Незважаючи на те, що він реалістично дивиться на суворий світ навколо, його найбільшим бажанням є колись відродити ті старі традиції: захищати землю і людей одне від одного, одночасно плекаючи і те, і інше. Його слова та вчинки вже починають давати багатонадійні плоди."
  ROS_monad_name:0 "М.О.Н.А.Д.А."
  ROS_lance_name:0 "Адміністратор L4-NC3"
  android_lance_desc:0 "Дотримуючись порядку правонаступництва, останній людський вчений у дослідницькому центрі EPA оголосив L4-NC3 своїм наступником. Серйозно ставлячись до цієї ролі, L4-NC3 готовий зробити все можливе, щоб захистити природне середовище та життя на планеті Земля. Наразі найбільшу загрозу для екосфери становить тварина-людина, і незважаючи на те, що це вид його творця, він більш ніж готовий регулювати, контролювати та гарантувати, що чисельність населення регіону залишатиметься на стійкому рівні.\n§RБудь-якими необхідними засобами§!"
  monad_ruler_desc:0 "§Y«Вітаю, [USER]. Система МОНАДА онлайн і готова до відновлення бізнес-операцій».§!\nСтворена компанією «Посейдон Енерджі» за кілька років до Великої війни, МОНАДА була розроблена для управління рахунками та системами компанії по всій країні, використовуючи Гефест для координації справді національної електромережі. Створений у пориві каяття продавця, Посейдон так і не зміг створити ШІ, який міг би зрівнятися за складністю з ODYSSEUS без допомоги Дерека Грінвея. §R«Але там, де Посейдон зазнав невдачі, я не здамся».§!"
  ROS_eyezack_name:0 "Рейнджер Ай-Зек"
  eyezack_desc:0 "Один із ветеранів Паркових Рейнджерів, який має досвід роботи в сусідніх громадах, Ай-Зек має більше досвіду виживання в пустці, ніж більшість інших. Його скромне виховання в лісах східного Айдахо залишило його трохи відірваним від інтелектуальних пошуків Екологів, але як знавцю природи йому мало хто в Парку може скласти конкуренцію."
  ROS_smokey_name:0 "Смокі Сутінковий Ведмідь"
  smokey_desc:0 "Генетично модифікований ведмідь, улюбленець солдатів, які гуртуються за ним."
