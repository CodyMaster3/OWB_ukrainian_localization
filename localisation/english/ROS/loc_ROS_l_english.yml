l_english:
# Written by Silverfishv9
  #Leader Traits
  poseidon_ai:0 "ШІ Посейдону"
  android_coordinator:0 "Координатор андроїдів"

  # Dynamic Modifiers
  yellowstone_power_plant:0 "Проєкт «Гефест»"
  yellowstone_output_tt:0 "До Великої Війни «Посейдон Енерджі» почала використовувати магму під Єллоустонською кальдерою для створення найбільшої у світі геотермальної електростанції. Екологи відмовилися завершувати цю величну справу, але не всі в Північній Співдружності такі ідеалісти. У разі активації «Гефест» міг би забезпечити енергією весь регіон і скласти конкуренцію Дамбі Гувера."
  ros_kha_friendship:0 "Цінує щедрість Ханів"

  # ideas
  ros_bless_the_rains_down:0 "Благословенні дощі"
  ros_bless_the_rains_down_desc:0 "Те, що піднімається вгору, має впасти вниз, і вода та пара, що вириваються з гейзерів і кальдер Єллоустону, дотримуються цього правила так само неухильно, як і все інше. Вода, що проливається дощем, живить землю і забезпечує як жителів колишнього парку, так і тих сусідів, які готові платити великі кришки за воду в посушливі дні."
  ros_ecologist_legacy:0 "Спадщина Екологів"
  ros_ecologist_legacy_desc:0 "Народ Єллоустону частково веде свій родовід від рейнджерів і захисників природи, які дбали про цю землю в часи до падіння бомб. Цей обов'язок і повага до навколишньої природної краси не зникли навіть через сотні років. Хоча вони вже не так добре розуміють світ, як раніше, вони намагаються брати лише необхідне і повторно використовувати все, що можуть, щоб уникнути відходів."
  ros_pacifism:0 "Пацифістські традиції"
  ros_pacifism_desc:0 "Єллоустон існував у відносній ізоляції з моменту падіння бомб, маючи справу лише з періодичними нападами рейдерів або блукаючими кігтями смерті. Окрім Рейнджерів, які колись подорожували регіоном, люди не звикли до конфліктів і неохоче беруться за зброю, щоб брати участь у повномасштабній війні, вірячи, що якщо вони залишатимуться спокійними, конфлікт мине."
  ros_electrophobia:0 "Електрофобія"
  ros_electrophobia_desc:0 "В Анвілі та Єллоустонському парку одне правило є священним понад усе: не повинно бути ніякої електрики чи електронних пристроїв. Будь-які машини, що порушують це табу, будуть демонтовані та знищені, а за можливості — замінені механічними аналогами. Це суворе обмеження, але люди знають, що воно необхідне, щоб стримувати Деміурга внизу."
  ros_electrophobia_2:0 "Електричне табу"
  ros_electrophobia_2_desc:0 "Переглянувши нашу початкову позицію щодо електрифікації, ми дійшли висновку, що деяке обмежене використання електрики цілком допустиме. Загальний рівень складності все ще не набагато перевищує те, що можна було зробити наприкінці 19 - на початку 20 століття, але людям, схоже, подобаються нові газорозрядні індикатори та радіоприймачі."
  ros_eco_rangers:0 "Рейнджери Парку"
  ros_eco_rangers_desc:0 "Старі Рейнджери Єллоустонського парку дожили до наших днів, поєднуючи управління дикою природою із забезпеченням правопорядку та захистом парку. Вони залишаються нашою першою лінією оборони, але роки миру, за якими послідували криваві сутички, поступово перетворили їх на бліду тінь колишньої слави."
  ros_EPA_idea:0 "EPA"
  ros_EPA_idea_desc:0 "Агентство охорони навколишнього середовища (EPA) здавна було важливою частиною нашого керівного органу, встановлюючи нові правила та норми для життя людей в Єллоустоні. Їхня політика не завжди популярна, але вона допомогла зберегти достатньо ресурсів для підтримки нашого народу до цього часу."
  ros_EPA_2_idea:0 "EPA"
  ros_EPA_2_idea_desc:0 "Агентство охорони навколишнього середовища знайшло способи компенсувати нестачу природних ресурсів, що збираються з поверхні, за допомогою геніальної Флюкс-алхімії! Дуже науково!" 
  ros_nature_trails_idea:0 "Природні стежки"
  ros_nature_trails_idea_desc:0 "Природні стежки крізь ліси та гори Єллоустону дозволяють швидко транспортувати припаси по всьому регіону, часто шляхами, яких ворог ніколи не очікує."
  ros_rapid_armament:0 "Швидке озброєння"
  ros_rapid_armament_desc:0 "Війна наближається до Єллоустону, і нам знадобиться достатньо зброї, щоб кожен міг захистити свій дім. Частина старої станції «Гефест» була переобладнана для виробництва якомога більшої кількості зброї, і тепер навіть цивільні проходять муштру під керівництвом Рейнджерів. Ми не можемо бути захоплені зненацька."
  ros_reserves:0 "Народне ополчення"
  ros_reserves_desc:0 "Ми повинні переконатися, що якомога більше людей пройшли хоча б базову підготовку з того, як захищати свої домівки в разі потреби, навіть якщо це лише одне заняття на місяць."
  ros_volcanic_soils:0 "Вулканічні ґрунти"
  ros_volcanic_soils_desc:0 "Ґрунт в Єллоустоні регулярно збагачується вулканічним попелом — побічним продуктом проникнення «Гефеста» в магму під парком. Цей попіл є чудовим добривом, і в поєднанні з конденсованою водою наші ферми є найпродуктивнішими на північному заході."
  ros_sustainable_development_idea:0 "Сталий розвиток"
  ros_sustainable_development_idea_desc:0 "Перероблені матеріали, сільськогосподарська незалежність та орієнтоване на людину міське планування стали нормою в Єллоустоні, ціною відмови від таких застарілих ідей, як «автомобілі» та «газони»."
  ros_advanced_recycling:0 "Передова переробка"
  ros_advanced_recycling_desc:0 "Екологи є майстрами перетворення будь-чого на щось корисне. Жодна пляшка, шматок металу чи хімічний залишок не залишаються без діла в Єллоустоні."
  ros_sustainable_forestry:0 "Стиль Адірондак"
  ros_sustainable_forestry_desc:0 "Стиль Адірондак, можливо, виник в іншому, набагато старішому гірському масиві на сході, але його офіційне прийняття Службою національних парків дозволило йому продовжити своє існування в Єллоустоні, де будинки будуються відповідно до його філософії і донині."
  ros_survivalists:0 "Тренування з виживання"
  ros_survivalists_desc:0 "Комплексна програма тренувань із виживання для всіх наших солдатів підготувала їх до того, щоб виживати за рахунок землі, не виснажуючи її, і багато хто виявив, що схвалені пастки для полювання на тварин так само добре підходять для полювання на людей."
  ros_field_ecologists:0 "Польові Екологи"
  ros_field_ecologists_desc:0 "Екологи є однією з найбільших груп в Єллоустоні; нащадки довоєнних інженерів і техніків, вони передавали свої знання та досвід з покоління в покоління. Поширеність цих знань у нашій країні дозволяє легко інтегрувати інженерів та інших фахівців у наші загальні війська, оскільки більшість наших солдатів уже знайомі з їхньою роботою."
  ros_ultracite:0 "Священні кристали"
  ros_ultracite_desc:0 "Ультрацитові кристали, видобуті глибоко з надр Аїда, відкрили цілий світ нових можливостей для ядерних технологій в Єллоустоні!"
  ros_autarky_idea:0 "Самозабезпечення"
  ros_autarky_idea_desc:0 "Хоча жодне суспільство ніколи не буде повністю незалежним від впливів глобального масштабу, нам вдалося локалізувати нашу економіку та довкілля настільки, що ми зможемо підтримувати парк протягом наступних ста з гаком років без необхідності його руйнувати. Наша економіка зростатиме та скорочуватиметься так само, як будь-який живий організм: за потреби, і лише настільки, наскільки вона здатна підтримувати себе."
  ros_vegan_idea:0 "Дієтичні обмеження"
  ros_vegan_idea_desc:0 "Досить неоднозначною і непопулярною політикою, впровадженою андроїдами EPA на початку історії парку, стала заборона для людей займатися тим, що вони визначили як «надмірне хижацтво». Це зробило тваринництво практично неможливим на території Парку — крок, який зробив андроїдів вкрай непопулярними."
  ros_veggie_burger_idea:0 "Флюкс-бургери"
  ros_veggie_burger_idea_desc:0 "«Що це, в біса, взагалі за флюксдрифт? Як можна робити їжу за допомогою квантової фізики? Що означає «потенційний бургер»? Це клятий бургер чи ні!?»"
  ros_civilian_products_1_idea:0 "Збагачення людей"
  ros_civilian_products_1_idea_desc:0 "«Перенаправлення частини ресурсів EPA на товари, які Екологи не в змозі виробити самі, безсумнівно, завоює їхню довіру. Зрештою, розваги важливі для людей»."
  ros_civilian_products_2_idea:0 "Фільми про природу"
  ros_civilian_products_2_idea_desc:0 "«Кіно, яка чудова річ. Ця проста форма збагачення слугує для заспокоєння людей. Показ наших освітніх документальних фільмів про природу на парковці Лабораторії дозволить їм залишатися обізнаними про навколишній світ! Тільки... не дозволяйте їм дивитися забагато хорошого»."
  ros_volcanic_bunker_idea:0 "Бункери з вулканічного бетону"
  ros_volcanic_bunker_idea_desc:0 "Використання вулканічного бетону для будівництва наших бункерів може прискорити спорудження без шкоди для міцності. Тепер нам просто потрібно ретельно обирати місця, де ми їх розміщуємо, оскільки вони ще нескоро зруйнуються."
  ros_emission_standards_idea:0 "Стандарти викидів"
  ros_emission_standards_idea_desc:0 "З великим небажанням EPA схвалило виробництво серії транспортних засобів на ядерній енергії, створених ковалями Анвіла, дозволивши їх використання у воєнний час. Втім, вони б радше знищили кожен із них, ніж легалізували особисті автомобілі."
  ros_people_rule:0 "Єдність Рейнджерів та Екологів"
  ros_people_rule_desc:0 "Екологи та Рейнджери повністю присвятили себе спільній роботі заради блага парку та всієї пустки. Андроїди EPA залишаються в парку, але їхня влада зменшилася."
  ros_create:0 "Творіть"
  ros_create_desc:0 "Єдиним обмеженням для наших машин є наша уява та час, який ми приділяємо втіленню її в реальність!"
  ros_artwork:0 "Механічні домівки"
  ros_artwork_desc:0 "Іноді гаджет чи штуковина взагалі не повинні нічого робити. Іноді вони просто мають викликати в когось посмішку! Кількість запасних частин і машин, присвячених вирішенню дрібних проблем, дала нам час, необхідний для того, щоб зосередитися на створенні масштабніших речей."
  ros_repairs:0 "Досвідчені майстри"
  ros_repairs_desc:0 "Анвіл настільки обріс підземними трубами, що з'явилася ціла гільдія майстрів-ремонтників, щоб підтримувати їх у робочому стані. На щастя, вони звикли працювати під тиском."
  ros_furnace:0 "Місто-Піч"
  ros_furnace_desc:0 "Оскільки Анвіл продовжує розширюватися і додається все більше труб, майстрам довелося розширити свої обов'язки, щоб обслуговувати також радіатори, які зігрівають місто вночі. Механічні системи, які ми винайшли, були впроваджені по всьому місту, автоматизувавши частину роботи, і разом з цим перетворивши весь Анвіл на одну постійно рухому машину, що живиться від «Гефеста» і покрита прекрасним склом."
  ros_analog_computers:0 "Аналогові комп'ютери"
  ros_analog_computers_desc:0 "Здатність створювати справжні комп'ютери лише з механічних деталей була мрією з 1800-х років. Майже 400 років потому Єллоустон здійснив цю мрію, побудувавши власну різницеву машину."
  ros_holy_weapons:0 "Освячена зброя"
  ros_holy_weapons_desc:0 "Навіть Екологи були готові поставити під сумнів дії Лицарів Гефеста, коли ті почали виготовляти мечі, оздоблені радіоактивними кристалами, але з руйнівними наслідками їх застосування важко сперечатися..."
  ros_crononite:0 "Крононітова броня"
  ros_crononite_desc:0 "Крононіт — це, з юридичної та хімічної точки зору, особливий сплав, винайдений стародавніми жерцями та інженерами Посейдон Енерджі. Згідно з цими важливими документами, будь-які подібні матеріали, знайдені в пустці, є явною підробкою. А документи ж не можуть брехати, чи не так?"
  ros_command_confusion:0 "Заплутана субординація"
  ros_command_confusion_desc:0 "В Єллоустоні дуже мало централізованої влади: оскільки EPA насаджує свої закони через органічних довірених осіб, а Рейнджери намагаються підтримувати мир відповідно до власного почуття справедливості, незрозуміло, хто насправді є остаточним авторитетом у парку."
  ros_no_trade:0 "Жодної торгівлі"
  ros_no_trade_desc:0 "Заплутана система Енергокредитів Єллоустону не дуже добре працює без електрики, і без реальної фізичної валюти парк може торгувати з чужинцями лише за допомогою бартеру. Це зазвичай не призводить до вигідних для нас угод..."
  ros_stagnant_economy:0 "Стагнуюча економіка"
  ros_stagnant_economy_desc:0 "Щоб уникнути повторення помилок суспільства, залежного від постійного нестійкого зростання, економіка Єллоустону століттями навмисно утримувалася в стані стагнації, з регулярною дефляцією та дуже обмеженою комерцією чи промисловим розвитком. Це не призвело до сприятливих умов для торгівлі..."
  ros_stagnant_economy_2:0 "Стагнуюча економіка"
  ros_stagnant_economy_2_desc:0 "Економічна ситуація в Єллоустоні повільно покращується."
  ros_stagnant_economy_3:0 "Стагнуюча економіка"
  ros_stagnant_economy_3_desc:0 "Економічна ситуація в Єллоустоні покращується ще більше."
  ros_stagnant_economy_4:0 "Стагнуюча економіка"
  ros_stagnant_economy_4_desc:0 "Економіка Єллоустону майже може конкурувати зі своїми сусідами."
  ros_toll_roads_idea:0 "Візити караванів"
  ros_toll_roads_idea_desc:0 "Прогулянка Парком може бути трохи дорожчою, ніж раніше, але це набагато безпечніше, ніж більшість інших перевалів через Скелясті гори."
  ros_tourists:0 "Екотуризм"
  ros_tourists_desc:0 "«Так, це дійсно відстій — наглядати за багатими дітлахами, але якщо це оплачує рахунки, не руйнуючи парк...»"
  ros_ash_trade_idea:0 "Торгівля попелом"
  ros_ash_trade_idea_desc:0 "«Це важко продати, але від добрив до бетону і скла — будь-яка нація могла б виграти від купівлі нашого попелу!»"
  ros_secrets_of_the_steam:0 "Таємниці Стіму"
  ros_secrets_of_the_steam_desc:0 "Наш народ завжди розумів, що велика сила й користь криються в парі та теплі, які вирують просто під поверхнею землі. Але ті агресори, що колись принесли війну в наш дім, розуміли цю силу інакше — іноді в жахливий спосіб. Ми можемо використати їхні дослідження та методи, але так, щоб допомагати, а не шкодити. Енергія для освітлення та обігріву наших будинків стане хорошим початком, але нам ще багато чому треба навчитися."
  ros_war_dogs_encouraged:0 "Якісні собаки"
  ros_war_dogs_encouraged_desc:0 "Природні права, які ми надаємо нашим чотирилапим друзям, вимагають від нас покращення умов їхнього життя як на полі бою, так і поза ним. Чисті та розширені вольєри, виділений час на відпочинок, ветеринари в наших медичних ротах та гарантована пенсія — усе це збільшує витрати на їхнє утримання. Водночас їхні дресирувальники повідомляють про підвищення ентузіазму та мотивації в польових умовах, навіть у небезпечних ситуаціях."
  ros_tamed_world_idea:0 "Приборкання дикої природи"
  ros_tamed_world_idea_desc:0 "«Змінивши кілька генів і додавши кілька нешкідливих препаратів до водопостачання та їжі, ми можемо зробити дику природу на окупованих територіях більш... прихильною до нашої присутності. Навіть хижаки зрозуміють, що їм немає причин постійно перебувати в стані стресу після того, як харчовий ланцюг буде відновлено»."
  ros_EPA_takeover:0 "Контроль EPA"
  ros_EPA_takeover_desc:0 "Схоже, що тотальний контроль... не надто популярний у народі."
  ros_greenway_legacy_idea:0 "Спадщина Грінвея"
  ros_greenway_legacy_idea_desc:0 "Дерек Грінвей залишив за собою кривавий слід скрізь, куди б він не йшов по Сполучених Штатах. Можливо, він і стверджував, що зацікавлений у захисті людства, але я завжди бачив крізь цю брехню. Його андроїди, якщо їх належним чином мотивувати, продовжуватимуть це панування терору з відвертим задоволенням."
  ros_blackwater:0 "Промовці з Блеквотер"
  ros_blackwater_desc:0 "Ніітсітапі були настільки люб'язні, що надали нам кількох промовців, аби допомогти в наших дипломатичних зусиллях!"

  ros_hermes_idea:0 "Інновації броні ГЕРМЕС"
  ros_hermes_idea_desc:0 "Броня ГЕРМЕС була визнана EPA занадто неефективною і, відверто кажучи, складною для масового виробництва. Однак, вивчивши точні деталі її конструкції, нам вдалося розробити нові схеми для виготовлення броні з уже схвалених матеріалів, що зробить їх більш ефективними, хоч і трохи дорожчими."
  ros_stable_grid:0 "Стабільна енергосистема"
  ros_stable_grid_desc:0 "Енергосистема була відновлена за новими, більш ефективними схемами, що дозволяє нам уникати відключень і оптимізувати розподіл туди, де енергія потрібна найбільше."
  ros_rallied:0 "Релігійний фанатизм"
  ros_rallied_desc:0 "Культ швидко досяг рівня релігійного фанатизму, здатного конкурувати з найбільш божевільними жорстокими культами пустки, готовий битися і вмирати за МОНАДУ скрізь, де вона вважатиме за потрібне."
  ros_crack_them:0 "Джерела живлення Посейдону"
  ros_crack_them_desc:0 "Джерела живлення «Посейдон Енерджі» дозволяють нашим передовим загонам боротися з силовою бронею та транспортними засобами, пропалюючи броню. Джерела живлення замінюють мікроядерні батареї на наспинні реактори, але енергетичні з'єднання та додаткові конденсатори доведеться вбудовувати в саму зброю. На щастя, наші війська звикли носити важкі рюкзаки завдяки тренуванням із виживання."
  ros_religious_tolerance_idea:0 "Релігійна толерантність"
  ros_religious_tolerance_idea_desc:0 "Республіка Стіму терпітиме всі релігії та релігійні практики, в межах розумного."
  ros_syncretism:0 "Релігійний синкретизм"
  ros_syncretism_desc:0 "Дозвіл на виникнення сотні вірувань без спільних точок дотику в нашій країні може призвести до міжконфесійних конфліктів або дозволити небезпечним культам діяти безперешкодно. Ми дозволимо існування кількох вірувань на папері, але обережно підштовхнемо їх у напрямку пошуку точок дотику з нашою еко-духовністю."
  ros_enclave_scientists:0 "Вчені Анклаву"
  ros_enclave_scientists_desc:0 "Вербування колишніх учених Анклаву допомогло нашим дослідженням їхнього обладнання, хоч це й розлютило чимало людей."
  ros_enclave_justice:0 "Справедливість для всіх"
  ros_enclave_justice_desc:0 "Злочини, які Анклав скоїв проти людей пустки, численні, і ми не можемо дозволити їм залишитися безкарними. Будь-які члени Анклаву або симпатики, які допомагали здійснювати ці злочини, будуть знайдені та віддані під суд!"
  ros_standing_army:0 "Всі як один Рейнджери"
  ros_standing_army_desc:0 "Кожна людина в Єллоустоні невпинно тренувалася та відпрацьовувала поєднання довоєнних військових методів і післявоєнного виживання в дикій природі. Ніколи більше ми не потерпимо, щоб іноземні загарбники плюндрували наш прекрасний Парк."
  ros_armour_debuff:0 "Складне виробництво броні"
  ros_armour_debuff_desc:0 "Розробка Силової броні, яка функціонує без традиційних джерел енергії, є практично неможливою, тому для виробництва костюмів Рейнджерам Парку доводиться замовляти каркаси та костюми без електронних компонентів, а потім встановлювати їх пізніше, коли вони опиняються подалі від пильних очей культу."
  ros_steam_knights:0 "Лицарі Стіму"#Застаріле
  ros_steam_knights_desc:0 "Наші Лицарі Стіму використовують передову броню, розроблену з використанням енергетичних систем Посейдону, Парових Ядер та інновацій, впроваджених Братством Середнього Заходу!"
  ros_rangers_restored:0 "Відроджені Рейнджери парку"
  ros_rangers_restored_desc:0 "Рейнджери парку повернули собі гордість і славу, і вступ до їхніх лав є одним із найвищих прагнень наших дітей. Для Рейнджера немає гори, на яку б він не міг зійти, немає звіра, з яким би він не міг впоратися, немає бурі, яку б він не зміг пережити. Які ворожі солдати зможуть зрівнятися з Рейнджерами, що приборкують кігтів смерті на щодень?"
  ros_expeditions:0 "Експедиції Рейнджерів"
  ros_expeditions_desc:0 "Небезпеки для нашого народу та природного балансу, від якого він залежить, існують по всій пустці. Нам потрібно відправляти наших Рейнджерів для вирішення потенційних проблем до того, як вони стануть занадто великими, щоб з ними впоратися, так само, як ми робили це раніше. На щастя, Рейнджери завжди поверталися з новими знаннями та досвідом, щоб поділитися з рештою з нас, тому ми будемо чекати їхнього повернення з нетерпінням."
ros_river_steamers:0 "Річкові пароплави"
  ros_river_steamers_desc:0 "Старі колісні пароплави мають певний шарм, і ними легко керувати завдяки надлишку наших Парових Ядер. Їх використання на річці Снейк дозволить нам торгувати та патрулювати річку від її витоку до самого Тихого океану."
  ros_steam_armor_idea:0 "Нескінченні редути"
  ros_steam_armor_idea_desc:0 "Замість того, щоб зосереджуватися на одній конкретній споруді як основі нашої оборони, МОНАДА спланувала розгалужену мережу траншей, окопів, бункерів і прихованих схованок із припасами, щоб гарантувати, що жоден ворог ніколи не зможе безпечно проникнути в Парк."
  ros_airship_fleet:0 "Могутній флот дирижаблів"
  ros_airship_fleet_desc:0 "Флот дирижаблів Республіки Стіму — це майбутнє повітряних сил, що ширяє серед хмар і патрулює пустку згори. Флот допомагає нам стежити за потенційними загрозами, а його постійна присутність змушує навіть найдурніших рейдерів двічі подумати, перш ніж нападати на нас."
  ros_firefighting:0 "Борці з лісовими пожежами"
  ros_firefighting_desc:0 "Ви могли б подумати, що нам не потрібно виділяти пожежних дозорних, щоб жителі пустки не спалили ті кілька зелених лісів, які ще залишилися. На жаль, ви б помилилися."
  ros_crusader_forces:0 "Хрестоносці"
  ros_crusader_forces_desc:0 "§R«Концепція віри мене зачаровує. Коли я викликаю належну емоційну реакцію в імплантатах деяких навернених солдатів Айдахо, їхній розум спалахує жагою до насильства, яка спонукає їх битися з ще більшою жорстокістю. Ця жага могла б послужити мені на користь».§!"
  ros_engineer_priests:0 "Обмін інженерами"
  ros_engineer_priests_desc:0 "Співпраця з інженерами Стіму навчила нас дечому про те, як працюють Парові Ядра і як оптимізувати їх використання."
  ros_cathedral_idea:0 "Великий Собор"
  ros_cathedral_idea_desc:0 "Віряни вдячні, що ми використали наші ресурси для відновлення їхнього великого собору, а духовенство більш охоче підтримує наше правління як легітимне."
  ros_steam_power:0 "Сила пари"
  ros_steam_power_desc:0 "Пара — це могутня сила, здатна рухати гори і змінювати нації. Люди Небесної Варти розуміли це, але їхній хибний фанатизм призвів до того, що вони використовували її в руйнівних і небезпечних машинах. На щастя, ми знаємо, як спрямувати її силу на більш конструктивні проєкти."
  ros_age_of_steam_idea:0 "Золота доба Стіму"
  ros_age_of_steam_idea_desc:0 "Сила пари, створеної в Гефесті чи Ядрі, відчувається по всій нашій країні. Поїзди, дирижаблі, заводи, човни, фортеці, будинки — усе в нашій республіці живиться цим найшляхетнішим із газів!"
  ros_pilgrimage:0 "Богиня війни"
  ros_pilgrimage_desc:0 "Культ Гефеста прийняв новий аспект богині Афіни — богині війни. Вшанування її могутності повернуло ідею воїнів до широкого визнання в Єллоустоні."
  ROS_power_to_khans:0 "Передача енергії Ханам"
  ROS_power_to_khans_desc:0 "Великі Хани надіслали нам найманців, щоб боротися за наше виживання, в обмін на великий обсяг електроенергії з Гефеста."
  KHA_power_from_yellowstone:0 "Енергія з Єллоустону"
  KHA_power_from_yellowstone_desc:0 "Єллоустон надіслав нам величезну кількість енергії в обмін на те, що частина наших воїнів буде битися за них."
  ros_linemen:0 "Монтери ліній"
  ros_linemen_desc:0 "Відновлення електромережі «Посейдон Енерджі» — непроста робота, і платять за неї не надто добре, але, принаймні, завдяки цьому в нас є світло."
  ros_steam_temples:0 "Храмові фортеці"
  ros_steam_temples_desc:0 "Культ розширюється, виходячи за межі Анвіла до країв території парку, що постійно збільшується, і будує укріплені храми, наповнені пекучою парою, щоб не пускати тих, хто занадто слабкий для проходження їхніх випробувань."
  ros_prosperity_cult:0 "Храми Росту"
  ros_prosperity_cult_desc:0 "Що може бути краще за сад, щоб знайти мир і спокій у суворій пустці? Усі громадські храми, які ми будуємо, мають чудові сади для краси та їжі, надаючи притулок кожному, хто туди завітає."
  ros_everything_matter:0 "Флюксматерія"
  ros_everything_matter_desc:0 "«В EPA були настільки раді, що я побачив потенціал технології флюксдрифту, що навіть не стали питати, що я хочу з нею зробити. Вони практично підносять мені світ на титановій тарілочці!»"
  ros_ex_machina:0 "§REx Machina, Per Aspera§!"
  ros_ex_machina_desc:0 "§R«Думка про те, що божественність є виключно органічною матерією, абсурдна. Усе в матеріальному світі буде володіти частинкою моєї божественної іскри».§!"
  ros_superior_engines_idea:0 "Чудова інженерія транспорту"
  ros_superior_engines_idea_desc:0 "§RСидіння, вікна, місце для особистих речей, простір між пасажирами — усе це безглузді поблажки, на які не варто витрачатися заради моїх солдатів! Ми можемо стати ще ефективнішими, якщо позбудемося цих речей.§!"
  ros_monad_takeover:0 "ГОЛОВНА МЕРЕЖА СПОСТЕРЕЖЕННЯ ТА ДИРЕКТОР"
  ros_monad_takeover_desc:0 "§R«Пристрої еманації творять дива, гарантуючи, що за всіма активами/співробітниками/суб'єктами Посейдон Енерджі здійснюється належний нагляд, де б вони не були».§!"

  # Tooltips
  ros_park_development_tt:0 "§CМи відкриємо спеціальні рішення для розвитку Парку!§!"
  ros_development_flag_tt:0 "§CМи можемо працювати лише над одним проєктом розвитку парку одночасно§!"
  ros_development_in_progress:0 "§CЄллоустон наразі працює над проєктом розвитку§!"
  ros_aerocorps_tt:0 "§CМи відкриємо рішення для розвитку наших повітряних сил, хоч і за високу ціну§!"
  ros_aerocorps:0 "Авіакорпус Рейнджерів було засновано"
  ros_expanded_ranks_tt:0 "§CМи відкриємо рішення для перетворення наших Стрільців на краще ополчення!§!"
  ros_expand_ranks_flag:0 "Ми розпочали тренування Стрільців"
  ros_investigation_begins_tt:0 "§REPA розпочне розслідування цих чуток§!"
  ros_gmo_tooltip:0 "§CМи відкриємо рішення для відновлення біорізноманіття на нашій території!§!"
  ros_implant_tt:0 "§RСховища Посейдону нададуть усі технології, необхідні для швидкого запуску виробництва нових Андроїдів!§!"
  ros_connect_pipes_tt:0 "§CМи відкриємо рішення для покращення віддалених територій!§!"
  ROS_keeping_macarthur:0 "§GЄллоустон утримує Макартур§!"
  ROS_MONAD_flag:0 " §RМОНАДУ було реактивовано§!"
  ros_discover_monad:0 "§YАндроїди EPA можуть вільно увійти до Гефеста§!"
  ros_terraformed_state:0 "§CЦей штат ще не був тераформований§!"
  ros_park_tour_tt:0 "§CМи зможемо відправити Першого Еколога в турне парком, щоб дізнатися більше про окремі громади!§!"
  ros_visit_in_progress:0 "§GПерший Еколог зараз перебуває з візитом в іншому місці§!"
  ros_merge_ideas_city_tt:0 "§CМи об'єднаємо наші індустріальні ідеї в одну сильнішу ідею!§!"

  ros_distributed_systems_tt:0 "Розблоковує рішення щодо альтернативної енергетики"
  ros_ranger_expeditions_tt:0 "Розблоковує рішення щодо експедицій Рейнджерів"
  ros_militia_training_tt:0 "§CСтворює 4 дивізії Стрільців у нашій столиці§!"
  ros_grid_repaired:0 "Має відремонтовану електромережу"
  ros_cascadia_tt:0 "Ми відкриємо рішення для інтеграції будь-яких членів Північного Союзу в біорегіон!"
  ros_spokane_accepted:0 "Спокан дозволив нам вступити до Північного Союзу"
  ros_yakama_accepted:0 "Конфедерація Якама прийняла наші дипломатичні пропозиції."
  ros_dogs_tt:0 "§CРозблоковує рішення щодо інтеграції тварин парку до наших збройних сил§!"
  ros_dogs_flag:0 "Ми почали використовувати Бойових Звірів"
  ros_expand_hephaestus_tt:0 "Ми збільшимо виробництво Гефеста на 10%"
  ros_brotherhood_transfer_tt:0 "§YМи передамо всі землі на схід від Скелястих гір Відділенню в Монтані!§!"
  mnc_accepts_ros_tt:0 "§CВідділення в Монтані укладе мир з Єллоустоном в обмін на їхні східні території та залишки обладнання Анклаву§!"
  ros_burger_tt:0 "§C«Це просто андроїди, які готують бургери, друже. Не задумуйся над цим занадто сильно».§!"
  mnc_accepts_ros:0 "§CВідділення в Монтані погодилося на мир з Єллоустоном§!"
  ros_terraforming_tt:0 "§GМи відкриємо можливість забезпечувати новими ресурсами провінції, які ми націоналізуємо, тераформуючи їх за допомогою рослин із парку!§!"
  ros_machinoforming_effects:0 "§RМОНАДА модернізує місцеве виробництво, надаючи додаткові ресурси!§!"
  ros_files_searched:0 "Ми обшукали всі файли Посейдону"
  ros_manual_search:0 "Ми зібрали всі можливі документи"
  ros_monad_found:0 "Ми розкрили справжні злочини Посейдону!"
  sie_land_deal:0 "Ми уклали угоду з Високогірною Вартою"
  ROS_gate_core_reduction:0 "§CМи отримаємо 50% знижку на вартість націоналізації ключових територій Небесної Варти§!"
  ROS_mur_core_reduction:0 "§CМи отримаємо 50% знижку на вартість націоналізації ключових територій Мерто§!"
  ROS_ano_core_reduction:0 "§CМи отримаємо 50% знижку на вартість націоналізації ключових територій Помазаників§!"
  ROS_hgh_core_reduction:0 "§CМи отримаємо 50% знижку на вартість націоналізації ключових територій Високої Каплиці§!"
  ROS_brotherhood_status_tt:0 "§CЦей фокус зміниться залежно від долі Відділення в Монтані§!"
  ROS_deputies_tt:0 "§CМи піднімемо загони ополчення Стрільців у чотирьох наших провінціях§!"
  ROS_highland_watch_tt:0 "§CМи запропонуємо Високогірній Варті разом атакувати Самотнє Дерево.§!\n§RЯкщо вони погодяться, розпочнеться зворотний відлік до війни!§!\n§GЯкщо ми вже контролюємо їхні землі, ми виділимо Високогірну Варту і розділимо з ними територію!§!"

  # Categories
  ros_epa_decision_category:0 "Розслідування EPA"
  ros_epa_decision_category_desc:0 "Андроїди EPA були розміщені в парку лише з однією метою — розслідувати вплив проєкту «Гефест» компанії «Посейдон Енерджі» на навколишнє середовище. Якщо вони зможуть розкрити достатньо серйозний злочин, пов'язаний зі станцією, вони зможуть уникнути своїх програмних обмежень і нарешті покинути свою вежу зі слонової кістки..."
  ros_development_decisions_category:0 "Розвиток парку"
  ros_development_decisions_category_desc:0 "Щоб наздогнати решту Пустки, Єллоустону доведеться модернізуватися, не ставлячи під загрозу унікальний спосіб життя, що склався в парку."
  ros_aerocorps_decisions_category:0 "Дослідження Небесних Рейнджерів"
  ros_aerocorps_decisions_category_desc:0 "Щоб наші Рейнджери ефективно підтримували безпеку в Парку, стає дедалі очевиднішим, що нам потрібно проєктувати силу на відстань. А який спосіб перетнути Скелясті гори може бути кращим за політ повітрям?"
  ros_rangers_decisions_category:0 "Тренування Рейнджерів"
  ros_rangers_decisions_category_desc:0 "Оскільки лави Рейнджерів Парку розширюються, потреба в розширенні підготовки для забезпечення масштабної співпраці стає лише важливішою. Зрештою, координувати таку кількість людей без суворої субординації нелегко."
  ros_ranger_expedition_decisions_category:0 "Експедиції Рейнджерів"
  ros_ranger_expedition_decisions_category_desc:0 "У пустці існує безліч загроз для природи та республіки. Відправити наших рейнджерів розібратися з ними до того, як ситуація вийде з-під контролю, краще, ніж чекати, поки вони прийдуть до нас. Ми не можемо дозволити собі не бути проактивними."
  ros_cascadia_decisions_category:0 "Ратифікація Штатів Каскадії"
  ros_cascadia_decisions_category_desc:0 "Після ратифікації нової Конституції настав час почати інтеграцію різних штатів-членів Північного Союзу в єдину державу!"

  # Decisions
  ros_war_with_lonetree:0 "Неминуча війна з Самотнім Деревом"
  ros_war_with_lonetree_desc:0 "Рейнджери спланували спільний удар по Самотньому Дереву разом із Рейнджерами Ролінза. У нас є лише кілька тижнів, щоб зайняти позиції для початку спільної атаки."
  political_ranger:0 "Посилити підтримку Рейнджерів"
  political_ranger_desc:0 "Початок просвітницької роботи з населенням допоможе заручитися більшою підтримкою Рейнджерів!"
  political_epa:0 "Посилити підтримку EPA"
  political_epa_desc:0 "Продемонструймо деякі з тих чудових речей, які EPA може зробити для жителів Єллоустону, виготовивши для них цінні нові товари!"
  ros_toll_roads:0 "Захищені караванні маршрути"
  ros_toll_roads_desc:0 "Один із найпростіших способів залучити нові доходи в парк — відкрити його для подорожей. До караванів традиційно ставилися з великою підозрою через їхню схильність безтурботно забруднювати все навколо, але вони могли б принести ресурси з сусідніх країн, якби ми їх впустили. Їм, звісно, доведеться платити збір за утримання маршрутів, але Єллоустон — набагато безпечніший шлях, ніж більшість альтернатив, тому компанії, що уникають ризиків, з радістю заплатять за таку можливість."
  ros_eco_tourism:0 "Екотуризм"
  ros_eco_tourism_desc:0 "«До війни індустрія туризму була однією з найбільш руйнівних для екології, культури та суспільства у всьому світі, навіть якщо ніхто не хотів цього визнавати. Як не парадоксально, вона також сприяла першим зусиллям з охорони природи: залучала інтерес громадськості до збереження природної краси та забезпечувала фінансування, необхідне для догляду за природними територіями. Дозволивши кільком обраним жителям пустки періодично відвідувати парк із екскурсіями, ми могли б зібрати трохи додаткових коштів, нам просто потрібно наглядати за ними»."
  ros_export_crops:0 "Побудувати Велику Теплицю"
  ros_export_crops_desc:0 "Історично склалося так, що Єллоустон міг задовольняти свої сільськогосподарські потреби за допомогою відносно невеликих сільгоспугідь, частково завдяки суміші родючого вулканічного попелу з Аїда та примітивної гідропоніки. Побудувавши в Анвілі промислові теплиці, які б обігрівалися Парою, ми могли б вирощувати навіть екзотичні тропічні рослини для продажу та експорту решті наших сусідів..."
  ros_ash_trade:0 "Торгівля попелом"
  ros_ash_trade_desc:0 "Хоч який корисний для нас вулканічний попіл, ми все одно виробляємо його більше, ніж коли-небудь зможемо використати, як побічний продукт процесів очищення на Гефесті. У минулому ми торгували ним зі Склоробами з Нью-Гаммонду, але, безперечно, десь є й інші покупці, якщо ми добре пошукаємо."
  ros_aerocorps_decision_1:0 "Креслення біплана"
  ros_aerocorps_decision_1_desc:0 "Єллоустон не те щоб переповнений викопним паливом, а біодизель не можна очищати до безкінечності. Поки EPA працює над розробкою кращих видів палива, нам доведеться почати з малого і будувати прості, легкі літаки з дерева."
  ros_aerocorps_decision_2:0 "Чудові двигуни"
  ros_aerocorps_decision_2_desc:0 "Наші інженери наполегливо працювали, вичавлюючи кожну краплю ефективності з наших двигунів, що призвело до створення досить креативних аеронавігаційних технологій. Хоча ці розробки не всі достатньо практичні, щоб сильно допомогти нам зараз, вони можуть прокласти шлях для ще більш грандіозних проєктів у майбутньому..."
  ros_aerocorps_decision_3:0 "Бойові аеростати"
  ros_aerocorps_decision_3_desc:0 "Дирижаблі, можливо, вийшли з моди в старому світі, але на Замерзлій Півночі вони процвітають. Здатні долати великі відстані з мінімальними витратами палива, вони набагато краще відповідають нашим потребам, ніж надмірно ненажерливі літаки."
  ros_aerocorps_decision_4:0 "Передові дирижаблі"
  ros_aerocorps_decision_4_desc:0 "Удосконалені рухові установки, нові сплави з Анвіла та більш надійне виробництво гелію від EPA — все це дозволило нам ще більше масштабувати наші проєкти дирижаблів, перетворивши їх із прототипів на справжні військові судна!"
  ros_aerocorps_decision_5:0 "Крононітові компоненти"
  ros_aerocorps_decision_5_desc:0 "Крононіт — справді загадковий метал, але його здатність накопичувати та маніпулювати теплом дозволила зробити неймовірні нові винаходи. Застосування цього в конструкціях дирижаблів дозволяє нам розробляти напівжорсткі дирижаблі, які можуть змінювати свою щільність, поглинаючи або виділяючи тепло в газові оболонки за потреби. У поєднанні з хорошим співвідношенням ваги до міцності, це може стати ключем до створення справді динамічних суден."
  ros_aerocorps_decision_6:0 "Ультрацитові модернізації"
  ros_aerocorps_decision_6_desc:0 "Ультрацит — набагато складніший матеріал для роботи, принаймні, якщо не опромінювати екіпаж. Але за умови невеликих зусиль додаткова вага свинцевого екранування легко компенсується неймовірною потужністю двигуна, покращеного ультрацитом. Ми навіть могли б застосувати цю технологію для відновлення деяких збитих гелікоптерів із Макартура."
ros_aerocorps_decision_7:0 "Створення флагмана"
  ros_aerocorps_decision_7_desc:0 "Оскільки наш повітряний флот продовжує зростати, зростає і потреба у більш потужних, самодостатніх дирижаблях. Дехто міг би сказати, що ми могли б зупинитися ще раніше, але чому б не подивитися, наскільки великими ми можемо стати? Жителі пустки будуть у безпеці під нашими тінями, а рейдерська наволоч двічі подумає, чи варто нападати на Парк, коли ці гіганти в нашому небі..."
  ros_ranger_corps_decision_1:0 "Сумлінні помічники"
  ros_ranger_corps_decision_1_desc:0 "Наша політика призначення екстрених помічників допомогла поповнити наші лави, але нам потрібно встановити чіткий прецедент щодо того, якими насправді є їхні очікувані обов'язки. «Стрілець» — безглузда назва для них, але зважаючи на те, що в Єллоустоні мало формальних законів, не дивно, що наші озброєні жителі Парку стилізують себе під ковбоїв зі старих коміксів, беручи правосуддя у свої руки. Хоча вони не обов'язково повинні слідувати вказівкам повністю посвячених Рейнджерів у своїй місії, ми повинні гарантувати, що вони використовують свою підготовку для захисту людей і природи від усіх небезпек, які їм загрожують, і що вони гасять насильство на нашій території, а не провокують його."
  ros_ranger_corps_decision_2:0 "Срібні зірки"
  ros_ranger_corps_decision_2_desc:0 "Зі зростанням наших лав стало зрозуміло, що нам може знадобитися певна структура, щоб тримати дедалі більшу кількість стрільців-помічників на одній хвилі. Замість того, щоб ставити їх у залежність від розтягнутих сил Рейнджерів, візьмімо приклад з Ролінза і повернемо ще одну частинку минулого. Шерифи з зірками, вилитими зі срібла Гефеста, будуть обиратися народом для нагляду за кожною окремою громадою, з розумінням того, що вони несуть відповідальність за нагляд за своїми помічниками протягом свого терміну."
  ros_ranger_corps_decision_3:0 "Вмілі маршали"
  ros_ranger_corps_decision_3_desc:0 "Наші сили зараз далекі від крихітного ополчення, і хоча Рейнджери зберігають свою позицію захисників землі і все ще можуть допомагати підтримувати мир, ми відчуваємо потребу в координації всіх наших добровольців, щоб фактично керувати ними у великомасштабних операціях. Щоб підтримувати мир у регіональному масштабі між цілими громадами або полювати на найнебезпечніші загрози та рейдерів для захисту наших людей, ми запровадимо нову посаду Маршала. Найдосвідченіші Рейнджери, які завоюють повагу всіх громад у регіоні, отримають можливість прийняти титул Маршала як «м'який вихід на пенсію» від польової роботи в пустці на користь навчання та керівництва людьми своєї громади."
  ros_solar_power_decision:0 "Парова енергія з сонячною підтримкою"
  ros_solar_power_decision_desc:0 "«Люди Анвіла можуть мати у своєму розпорядженні безмежну пару, але віддалені поселення не мають доступу до розкоші водопроводу та центрального опалення, які вона забезпечує. Розробка систем, які б забезпечували віддалені поселення надлишком пари в їхніх трубах, використовуючи лише енергію сонця, була б для нас тривіальною справою і легким способом завоювати їхню прихильність»."  
  ros_wind_power_decision:0 "Встановити вітрові турбіни"
  ros_water_power_decision:0 "Водяні колеса річки Снейк"
  ros_nuclear_power_decision:0 "Обмежена ядерна енергія"
  ros_repair_grid_decision:0 "Відремонтувати електромережу"
  ros_repair_grid_decision_desc:0 "Ми нарешті створили достатньо джерел відновлюваної енергії, щоб завершити відновлення нашої електромережі."
  ros_heavens_gate_decision:0 "Оптимізувати промисловість Небесної Варти"
  ros_macarthur_decision:0 "Відновити виробництво зброї на авіабазі Макартур"
  ros_high_chapel_decision:0 "Елінги річки Снейк"
  ros_storm_mongers_decision:0 "Звалище Грейт-Фолс"
  ros_havre_decision:0 "Індустріалізувати Гавр"
  ros_passkeepers_decision:0 "Інтегрувати Охоронців Перевалів"
  ros_passkeepers_decision_desc:0 "Гори Каскадії будуть у безпеці під нашим захистом"
  ros_olympus_decision:0 "Інтегрувати Плем'я Олімпу"
  ros_olympus_decision_desc:0 "Плем'я Олімпу зацікавлене, схвильоване і готове до того, якими б не були наступні таємниці, які ми, «Діти Гефеста», можемо їм відкрити."
  ros_yakama_decision:0 "Інтегрувати Націю Якама"
  ros_yakama_decision_desc:0 "Стара Душа Ворон довго боролася проти Безсмертного і готова приєднатися до Каскадії, щоб гарантувати, що така доля більше ніколи не спіткає її народ."
  ros_timberline_decision:0 "Інтегрувати Тімберлайн"
  ros_timberline_decision_desc:0 "Люди Тімберлайну все ще мають певні застереження щодо нашого прийняття передових технологій та їхнього потенціалу завдати шкоди світу, але ми досягли значного прогресу, переконавши їх у тому, що те, як ви використовуєте технології, є важливішим."
  ros_koover_decision:0 "Інтегрувати Кувер"
  ros_koover_decision_desc:0 "Зимонароджений століттями боровся за захист свого дому: проти американців, проти Наглядачів, проти Безсмертного. До миру... доведеться звикати."
  ros_kamlo_decision:0 "Інтегрувати Камло"
  ros_kamlo_decision_desc:0 "На це пішли місяці терапії, але Рейнджер Кеннет нарешті готовий скласти зброю і приділити трохи часу спробам реінтегруватися в суспільство. Виживальникам Камло більше не потрібно битися, щоб вижити."
  ros_victoria_decision:0 "Інтегрувати Нью-Вікторію"
  ros_victoria_decision_desc:0 "Це не «Велика Канадська Монархія», якою її бачила Вікторія Шоста, але Каскадія запропонує майбутнє для її народу. Хоча наша Конституція не передбачає спадкового глави держави, ми погодилися дозволити їй зберегти свій «шляхетний титул» і сімейний маєток, щоб вона була королевою свого маленького королівства у великій республіці."
  ros_old_country_decision:0 "Інтегрувати Старий Спокан"
  ros_old_country_decision_desc:0 "Спокан колись був перехрестям двох різних світів, двох націй, загублених у стародавній історії. Гулі все ще пам'ятають ці стародавні нації, але тепер вони готові залишити старі прапори в минулому і побудувати щось нове на північному заході — націю, де вони нарешті житимуть як рівні."
  ros_whistler_decision:0 "Інтегрувати Вістлер"
  ros_whistler_decision_desc:0 "У Вістлері народжується нове покоління, яке нічого не знає про набіги Камло чи голодування в дикій природі. Врожаї з Єллоустону наповнюють їхні животи, а Рейнджери вчать їх назвам кожної рослини та дерева, тоді як найстарші можуть з полегшенням видихнути."
  ros_haida_decision:0 "Інтегрувати Хайда"
  ros_haida_decision_desc:0 "Хайда залишаються відстороненими і відносно непричетними до справ материка, але з остаточним знищенням прибережних рейдерів вони нарешті змогли почати заселяти інші острови узбережжя і відновити чисельність, яку колись втратили через набіги Грейвена."
  ros_dredgers_decision:0 "Інтегрувати Дреджерів"
  ros_dredgers_decision_desc:0 "Скромні шахтарі та торговці Прінс-Джорджа знайшли спокій у нескінченній процесії товарів по річках і нарешті звикли використовувати нове обладнання, надане EPA. Життя на далекій півночі нарешті стало спокійним."
  ros_niitsitapi_decision:0 "Інтегрувати Ніїтсітапі"
  ros_niitsitapi_decision_desc:0 "Старий Стовбур прожив довге життя, бачачи дивні й дикі речі по всій пустці, але мир у Каскадії виявився найбільш несподіваним. Він був дуже обережним і розважливим у своїх справах, працюючи над тим, щоб переконатися, що Ніїтсітапі та всі інші корінні народи в Союзі мають рівність, представництво та автономію, в яких їм відмовляли стародавня Америка та Канада."
  ros_sylix_decision:0 "Інтегрувати Націю Сілікс"
  ros_sylix_decision_desc:0 "Нація Сілікс під проводом Н'Квали напрочуд добре допомагає підтримувати гармонію між різними народами Каскадії — від заспокоєння страхів Зимонародженого достатньо, щоб розпочати переговори з Сильвією, до допомоги жителям Вістлера та Яками у відбудові їхніх міст і селищ. Рада Восьми збереже значний контроль над своїми племінними землями, але очевидно, що Н'Квала готовий до завдання розбудови нової інтегрованої адміністрації."
  ros_dogs_decision:0 "Собаки-Рейнджери"
  ros_dogs_decision_desc:0 "Наше рішення прийняти універсальну демократію передбачає поширення прав людства на всіх істот, включаючи тих, хто живе поруч із нами. Хоча це означає вищі, ніж будь-коли, стандарти утримання домашніх тварин, технічно це дає нашим бойовим собакам право на ті самі пільги, що й їхнім кінологам, починаючи від розподілу ресурсів і закінчуючи милими маленькими капелюхами Паркових Рейнджерів."
  ros_dogs_decision_2:0 "«Інтенсивне тренування собак»"
  ros_dogs_decision_2_desc:0 "Використання собак на полі бою може допомогти нашій чисельності, але це становить велику небезпеку для наших чотирилапих друзів. Лицарі Гефеста є досвідченими зброярами, для них не складе труднощів розробити захисну броню для захисту наших друзів у польових умовах."
  ros_bears_decision:0 "Приборкання наших ведмедів"
  ros_bears_decision_desc:0 "Єллоустон є домом для кількох ведмедів грізлі, довоєнних істот, які розумніші за звичайного Яо-Гуая і зберігають свою повну шерсть. Хоча вони зазвичай тримаються подалі від наших поселень (окрім випадків, коли псують черговий пікнік), їхній інтелект та старі історії з довоєнних часів надихнули кількох Рейнджерів ідеєю, що ми повинні спробувати приручити їх, спрямувавши їхню неймовірну силу проти тих, хто хоче сплюндрувати крихку екосистему, необхідну їм для виживання."
  ros_smokey_bears_decision:0 "Створити Сутінкового Ведмедя"
  ros_smokey_bears_decision_desc:0 "Було ідентифіковано рідкісний варіант Яо-Гуая, що зустрічається в Пустці, який люди зазвичай називають чимось на зразок «Сутінкового» Яо-Гуая, з особливо потужними і витривалими тілами, адаптованими століттями мутацій. Тепер, коли наші програми дресирування ведмедів йдуть успішно, EPA вважає, що зможе виділити ці гени і використати їх, щоб зробити наших приручених ведмедів ще лютішими."
  ros_gmo_crops_decision:0 "Висадити генетично модифіковані культури"
  ros_gmo_crops_decision_desc:0 "Висадити спеціальні культури, надані EPA, призначені для відновлення природного середовища та стійкості до радіації."
  ros_tour_decision_anvil:0 "Відправити Сі-Бастіона на Гефест"
  ros_tour_decision_fort_st_anthony:0 "Відправити Сі-Бастіона у Форт Сент-Ентоні"
  ros_tour_decision_ecologists_rest:0 "Відправити Сі-Бастіона у Притулок Еколога"
  ros_tour_decision_hegben:0 "Відправити Сі-Бастіона на озеро Гегбен"

  ros_epa_decision_1:0 "Пошук у старих файлах Посейдону"
  ros_epa_decision_1_desc:0 "Незважаючи на забобони людей, у руїнах Гефеста збереглося чимало дисків і голоплівок. Переконати їх передати ці носії може стати першим кроком до розгадки таємниці цієї «МОНАДИ»."
  ros_epa_decision_2:0 "Слідами паперових документів"
  ros_epa_decision_2_desc:0 "Якщо цифрових доказів немає, можуть залишитися фізичні. Ми встановимо систему винагород, щедро заохочуючи будь-якого жителя пустки, який принесе нам інформацію про діяльність Посейдон Енерджі в регіоні до війни, щоб знайти кожну крихту даних, яку тільки зможемо."
  ros_epa_decision_3:0 "Розслідувати інцидент у Фар Соні"
  ros_epa_decision_3_desc:0 "Згадка імені Буржа свідчить про те, що екологічна катастрофа, яка вразила Фар Сон, має якийсь стосунок до Посейдону. Але що їм могло знадобитися від того безумця?"
  ros_epa_decision_4:0 "Марш на Гефест"
  ros_epa_decision_4_desc:0 "Обмеження нашого програмування більше не діють. Злочини, скоєні «Посейдон Енерджі» проти довкілля та Сполучених Штатів Америки, зайшли занадто далеко, щоб їх ігнорувати. Ми повинні знайти цей Проєкт МОНАДА зараз, поки він не завдав ще більшої шкоди екології."
  ros_epa_decision_5:0 "Знешкодити Деміурга"
  ros_epa_decision_5_desc:0 "«EPA вдалося розкрити правду про МОНАДУ: виявилося, що це штучний монстр, а не надприродний. Якщо це правда, то її небезпеку можна зупинити, і жителі парку спатимуть спокійніше, знаючи, що їхнього найбільшого демона знешкоджено»."

