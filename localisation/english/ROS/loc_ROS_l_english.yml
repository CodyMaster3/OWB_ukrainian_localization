  #Introduction
  ROS_OWB_DESC:0 "У колишньому Єллоустонському національному парку Екологи, вцілілі з EPA та Паркові Рейнджери продовжують традиції своїх предків, зберігаючи парк як тендітний сад природної краси в безлюдній пустці. Але не все гаразд у цьому раю: сутички з релігійними фанатиками та швидкий наплив військ до сусіднього Макартура свідчать про те, що сусіди Єллоустону, можливо, готуються заволодіти його найбільшою таємницею — величезним геотермальним проєктом компанії «Посейдон Енерджі», Гефестом. Гефест може дати Єллоустону шанс вижити і навіть перемогти, але саме безрозсудна експлуатація природи колись знищила світ, і їм варто було б не повторювати одні й ті самі помилки двічі..."