nf_den.16.a: "Вони ще прийдуть..."

########## Max Sec border war

nf_den.17.t: "Набіг на [467.GetName]"
nf_den.17.d: "[467.GetName] — маловідоме містечко, яке, втім, має певну репутацію суворого місця. Особливо з огляду на те, що більшість його мешканців — колишні в’язні.\n\nМи перемогли, легко зламавши їхній недолугий опір. Тепер ці люди належать нам."
