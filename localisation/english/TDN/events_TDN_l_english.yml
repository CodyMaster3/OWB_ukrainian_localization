########## Den starting events
nf_den.1.t: "Діра після Великої Війни"
nf_den.1.d: "До Великої Війни Діра була одним із тисяч американських містечок, про які знали лише місцеві мешканці. Їх створили у золоті часи, коли Західне узбережжя заселялося людьми зі Сходу. Та з роками ці міста занепали, спорожніли й стали нікому не потрібні. Під час Ресурсних Воєн страх перед Китаєм став схожим на давній страх перед Японією. Тисячі тікали якомога далі — і ці міста стали містами-привидами, ще цілі ззовні, але вже давно покинуті.\n\nКоли впали бомби, знищено було не всі міста. Такі мегаполіси як Солт-Лейк-Сіті й Лос-Анджелес перетворилися на радіоактивні пустки. Але навіть Китаю забракло бомб, аби знищити кожне поселення в США. Люди рушили до міст на кшталт Діри. Тоді це ще не була "брудна діра" — це було місто-надія, яке привабило занадто багато людей. Перенаселення та нестача ресурсів зробили свою чорну справу.\n\nАле що саме привернуло стільки людей сюди?"
nf_den.1.a: "Чиста вода без радіації."
nf_den.1.b: "Зручне розташування для торгівлі."

nf_den.2.t: "Походження родини Мордіно"
nf_den.2.d: "Мордіно... Колись вони керували Нью Ріно. Як і всі, хто сягнув вершини, починали вони з малого. Навіть НКР була лише селищем Шейді-Сендс, оточеним скорпіонами й рейдерами. Та незначні сили не завадили їм стати однією з провідних держав поствоєнної Америки. І хто знає, хто їх зупинить у майбутньому?\n\nРіно завжди був місцем можливостей для тих, хто не боїться ризику. Тут усе залежало від готовності грати — й приймати поразку. Одні родини трималися десятиліттями, інші — зникали за кілька років. Єпископи заробили на зв’язках із НКР та гральним бізнесом. Райти — на алкоголі та дисципліні. Сальваторе — на зв’язках з Анклавом. Мордіно ж мали свою опору, ще до вигнання з Ріно.\n\nАле чим вони займались до того, як зайнялись наркотиками?"
nf_den.2.a: "Вони заробили кришки на готелях."
nf_den.2.b: "Були капо у доядерній родині мафії."

nf_den.3.t: "Злет родини Мордіно"
nf_den.3.d: "У Ріно все підкорюється природному відбору: слабкі поступаються майну й впливом сильним. Тут не прикривають правду красивими словами, як у НКР. Ріно — місто переможного соціального дарвінізму.\n\nКожна родина з’явилася завдяки людській ваді: Єпископи — азарт, Райти — пияцтво, Сальваторе — страх. Ми не виняток. Саме злочини зробили Мордіно могутніми. І хоча це брудно — ми принаймні чесні в нашій злочинності.\n\nАле за які саме гріхи нас ненавиділи й боялися в Неваді та Північній Каліфорнії?"
nf_den.3.a: "Створення й поширення Джету."
nf_den.3.b: "Підтримка работоргівлі."
nf_den.3.c: "Контроль над Cat’s Paw."
nf_den.3.e: "Торгівля хімікатами."

nf_den.4.t: "Падіння родини Мордіно"
nf_den.4.d: "Тридцять років... Вигнання з Ріно триває вже тридцять років. Колись ми тримали місто в кулаці, і ніхто не міг нас здолати наодинці. Постійна параноя між родинами гарантувала, що вони ніколи не об’єднаються. Це були славетні часи.\n\nВсе змінилось, коли до міста прийшов дикун. Один Обранець. Хтось, хто зміг змінити історію цілого міста. Саме з нього почалась низка подій, яка призвела до нашого падіння. Нас вигнали — за гординю, за сліпоту, за самозаспокоєння.\n\nМи блукали Пусткою в пошуках притулку — і знайшли його в Дірі. Це тимчасовий дім, на що сподівається Дон Мордіно.\n\nАле з чого саме почався наш крах?"
nf_den.4.a: "Обранець убив Майрона і зруйнував нас."
nf_den.4.b: "Було знайдено ліки від Джету."
nf_den.4.c: "Війна банд майже знищила сім’ю."


########## Sierra border war

nf_den.5.t: "Перемога біля Сьєрра"
nf_den.5.d: "База армії Сьєрра — колишній військовий об’єкт США у Неваді, про який мало хто чув. Здавалося б, занедбана ділянка, нікому не потрібна. І залишалась би такою, якби Дон Мордіно не вирішив відновити могутність свого клану. З цією метою він послав своїх людей і союзників захопити цю точку — вона ж лежить на найкоротшому шляху між Дірою та Ріно.\n\nУсе завершилося перемогою Мордіно. Розрізнені бандити з родин Нью Ріно нічого не змогли вдіяти й утекли. Саме місто не таке важливе, як сама перемога. Вона доводить, що ми здатні виграти цю війну — а отже, союзники залишаться з нами."
nf_den.5.a: "Родина Мордіно починає відродження"

nf_den.6.t: "Поразка біля Сьєрра"
nf_den.6.d: "База армії Сьєрра — колишній військовий об’єкт США у Неваді, про який мало хто чув. Здавалося б, занедбана ділянка, нікому не потрібна. І залишалась би такою, якби Дон Мордіно не вирішив відновити могутність свого клану. З цією метою він послав своїх людей і союзників захопити цю точку — вона ж лежить на найкоротшому шляху між Дірою та Ріно.\n\nУсе завершилося для нас повним провалом. Ми не змогли здолати бандитів з Ріно, а щойно наші війська відступили — колишні союзники розійшлись, покинувши наш табір."
nf_den.6.a: "Це кінець"

########## Fourways border war

nf_den.11.t: "Набіг на Чотири Шляхи"
nf_den.11.d: "Чотири Шляхи? Звичайне плем’я на північ від Реддінґа, про яке навіть Послідовники Апокаліпсису нічого не знають. Але потенційні раби — це завжди можливість. І Мордіно не зміг від неї відмовитись.\n\nМи перемогли, легко зламавши їхній недолугий опір. Тепер ці люди належать нам."
nf_den.11.a: "Усе пішло за планом"

nf_den.12.t: "Набіг на Чотири Шляхи"
nf_den.12.d: "Чотири Шляхи? Звичайне плем’я на північ від Реддінґа, про яке навіть Послідовники Апокаліпсису нічого не знають. Але потенційні раби — це завжди можливість. І Мордіно не зміг від неї відмовитись.\n\nЯкимось дивом ці дикуни зуміли нас перемогти й захистити свою незалежність."
nf_den.12.a: "Але ми ще повернемося"

nf_den.13.t: "Набіг на Чотири Шляхи"
nf_den.13.d: "Чотири Шляхи? Звичайне плем’я на північ від Реддінґа, про яке навіть Послідовники Апокаліпсису нічого не знають. Але потенційні раби — це завжди можливість. І Мордіно не зміг від неї відмовитись.\n\nЯкимось дивом ці дикуни зуміли нас перемогти й захистити свою незалежність."
nf_den.13.a: "Але ми ще повернемося"

nf_den.14.t: "Набіг на Чотири Шляхи"
nf_den.14.d: "Чотири Шляхи? Звичайне плем’я на північ від Реддінґа, про яке навіть Послідовники Апокаліпсису нічого не знають. Але потенційні раби — це завжди можливість. І Мордіно не зміг від неї відмовитись.\n\nМи перемогли, хоча це було нелегко. Але ми захистили свою свободу."
nf_den.14.a: "Вони ще прийдуть..."

nf_den.15.t: "Набіг на Чотири Шляхи"
nf_den.15.d: "Чотири Шляхи? Звичайне плем’я на північ від Реддінґа, про яке навіть Послідовники Апокаліпсису нічого не знають. Але потенційні раби — це завжди можливість. І Мордіно не зміг від неї відмовитись.\n\nВони прийшли — і майже знищили нас. У нас не було жодного шансу."
nf_den.15.a: "Вони ще прийдуть..."

