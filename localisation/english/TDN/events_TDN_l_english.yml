########## Klamath

nf_den.23.t: "Нові Угоди з Кламетом"
nf_den.23.d: "Нью-Ріно пропонує вигідніше, хоча й потенційно небезпечніше партнерство. Вони хочуть відновити частину нашої виробничої інфраструктури в обмін на контроль над нашим цивільним урядом."
nf_den.23.a: "Ми приймаємо їхню пропозицію."
nf_den.23.b: "Кламет залишиться вільним."

########## Slice of life events

nf_den.24.t: "Довгоочікувана перемога"
nf_den.24.d: "Джізус Мордіно завжди залишався в тіні свого батька. Колись він був найвпливовішою особою у Ріно, але через того дикуна їхня родина втратила не лише вплив, а й місце в одному з найвеличніших міст довоєнної Америки. Усі дивилися на нього з презирством, ніби саме він винен у падінні родини. Але тепер ніхто не сумніватиметься в його здібностях. Він повернув Ріно — місто, яке належить йому за правом!\n\nКортеж в'їхав у Ріно головною дорогою, минаючи згорілі будівлі, що колись належали Райтам і Бішопам. З обох боків зібрався міський натовп — звичайне набріддя, яке прийшло поглянути на найвпливовішу людину міста. Джізус не наказував їм приходити — вони прийшли самі. Але при цьому ніхто вже не скаже, що в них ще є власна воля. Поки що він тримає їхню увагу повністю. Сьогодні він — Імператор, що входить у своє Римське тріумфування.\n\nАле такі моменти залишають гіркий осад. Відчуття вершини, коли усвідомлюєш, що вище вже не злетіти."
nf_den.24.a: "Це ще не вершина моїх досягнень."

nf_den.25.t: "Помста сина"
nf_den.25.d: "Джізус Мордіно стояв у своєму казино, обговорюючи з радниками, як відправити перший караван до Арройо. Це мало бути щось на зразок жесту доброї волі — спроба закопати сокиру війни від сина того, хто втратив усе через Обраного. Новий етап у історії Північної Каліфорнії. Так, наші народи дуже різні, але якщо не друзі — то хоча б не вороги.\n\nСаме в цьому потрібно переконати мешканців Арройо. Якщо вони повірять, то будуть одними з найбільших дурнів Пустки. Перший караван дійсно перевозитиме хліб, здобутий рабською працею в околицях Дену. Етично огидно, але формально — законно. Вони будуть кривитися, але почнуть купувати їжу. А далі підуть каравани справжні — з наркотиками.\n\nПомста — страва, яку готують довго і подають холодною. І якщо треба чекати роками — Джізус готовий. Одного дня він зможе залити Арройо дешевим джетом. Вибраний хотів очистити Ріно, думав, що здатен щось змінити? Даремно! Смерть чекає на кожного героя. Але спершу — руйнування всього, що він любив."
nf_den.25.a: "Пан Мордіно передає свої вітання."

nf_den.26.t: "Останній Сальваторе"
nf_den.26.d: "Сальваторе і Мордіно ніколи не були палкими союзниками. Але обидва вважали себе родичами по духу, на відміну від Бішопів і Райтов. Райти занадто залицялися до простого люду, а Бішопи — вискочки, що здобули вплив через контракти з цією шльондрою Тенді. Вони походили з самого Ріно й жили за його неписаними законами — жорстокими, але дієвими, які дозволили місту вижити після Великої Війни. Але тепер Мордіно туляться у Дену, а від Сальваторе майже нічого не залишилось. Їхні вороги сидять у Ріно й досі ділять спадщину батьків.\n\nТож не дивно, що зараз вони зібралися в цій будівлі, щоб обговорити, як повернути владу. Джізус Мордіно знав, що без Сальваторе йому не обійтись. І той це знав — він не мав іншого способу повернутися до Ріно живим. Усі ненавидять його за зв’язки з Анклавом, і Мордіно — один із небагатьох, хто готовий на це заплющити очі.\n\nОбидва потребують одне одного, але жоден не готовий поступитися бодай грамом впливу. Отже, на них чекає довгий пошук компромісу."
nf_den.26.a: "Це буде найдовша ніч у його житті."

nf_den.27.t: "Новий Десперадо"
nf_den.27.d: "Джізус Мордіно стояв перед Десперадо — відбудованим казино, яке колись належало його родині. Так, він був жорстоким бандитом, убивцею й грабіжником. Але навіть він не міг не відчути хвилювання, стоячи перед цим закладом.\n\nВін знав всю його історію. Колись це був притулок для бездомних, який перетворили на готель — чесний бізнес у беззаконній Пустці. Іронічно, що коли в Пустці нарешті запанував закон, його родина зайнялася незаконним бізнесом.\n\nГотель став казино, казино додало до алкоголю наркотики. А згодом вони почали самі варити джет — і казино стало радше даниною минулому, бо справжні гроші пішли з іншого джерела.\n\nЗвісно, були й темні часи. Наприклад, той клятий Обраний, після якого казино перетворилось на притон для наркоманів. Але все стало на свої місця. Їхнє казино знову сяє в центрі міста!"
nf_den.27.a: "Дім, милий дім."

nf_den.28.t:0 "Мегалодон"
nf_den.28.d:0 "Клуб Акула завжди був окрасою цього міста, улюбленим закладом засновника родини Бішопів, яким він принижував Мордіно. І справді — як Бішопи змогли досягти того самого за десять років, що Мордіно за сорок? А потім вони взагалі вигнали його родину з міста, остаточно відправивши Мордіно на смітник історії. Так вважали багато хто.\n\nАле, як показала історія, сміється той, хто сміється останнім. І зараз це саме він — стоячи на руїнах колишнього казино. Дим вже розвіявся, запах гару зник, залишивши лише безхатьків, що оселилися в уцілілому каркасі будівлі. До Великої Війни вміли добре будувати.\n\nУ цю мить Джізус думав про містера Бішопа. Попри ворожнечу, він ніколи не мав нічого особистого проти нього. Той був підступним, жорстоким, але не боягузом — мав межі, які не переходив. Якби їхні родини не були ворогами, можливо, стали б друзями. Хоча навряд — занадто амбітні обидва. Все одно — шкода, що такий талант загинув.\n\nТа він ще може зробити щось для нього. Так. Бішопи були достойними. Але настала епоха Мордіно — і нове казино, Мегалодон, стане її символом. Він міг звести його будь-де, та символічно обрав місце останнього осередку спротиву. Тепер воно стане фундаментом його нової Імперії."
nf_den.28.a:0 "Мій останній подарунок, старий вороже."

nf_den.29.t:0 "Єдина чесна родина"
nf_den.29.d:0 "Йому довелося це зробити — розчавити Райтов. Він не міг дозволити собі прийняти капітуляцію, хоч це й зберегло б життя бійців з обох боків. Причина не лише у гордості чи бажанні одноосібного правління. Проблема в тому, що Райти — найнебезпечніша родина в місті, і з ними ніхто не зрівняється.\n\nТак, звучить абсурдно. У них немає великих грошей, технологій чи армії бандитів. Але їм це й не потрібно. У них є страшніша зброя — здатність завойовувати людські серця, дарувати надію та перетворювати це на силу.\n\nХтось посміється з таких ідеалістичних слів. Любов? Відданість? У Ріно? У місті гріха? Але так і є. І Джізус ще живий тільки тому, що розуміє силу, яку ті мали. Люди можуть повзати перед ним, але за Райтами — підуть. А Мордіно може розраховувати лише на ніж у спину, варто тільки обернутися.\n\nТа якби вони не вірили у власні ілюзії — могли б досягти великого. А тепер вони загинули. Так було завжди: хоробрі гинуть, а за лаштунками смикає за нитки ляльковод."
nf_den.29.a:0 "Наївні дурні."

nf_den.30.t:0 "Борг сплачено ділом"
nf_den.30.d:0 "Сальваторе стояв поруч і всміхався, дивлячись на будівлю своєї родини. У цій усмішці не було ні фальші, ні зневаги. Лише щира радість — він знову вдома. Пожежа та забуття зруйнували чимало, але місце залишилось порожнім, тож вони збудували все з нуля.\n\nТак, це було дорого. Так, це було складно. Люди навіть не усвідомлюють, як важко дістати будівельну техніку і бетон у Пустці. Перше — лише у Місті-Сховищі, друге — тільки в Республіці. Але зрештою — Мордіно тримають слово. Не завжди, звісно, тільки коли це вигідно в перспективі.\n\nТак, голови злочинних синдикатів усе ще залишаються людьми — іноді можуть дозволити собі трохи сентиментів. Лише трохи і тільки у великі свята. А повернення додому і перемога над старими ворогами — це вже привід."
nf_den.30.a:0 "Я ж казав, що ми це зробимо!"

########## NCR War

nf_den.31.t:0 "Немислимі вимоги"
nf_den.31.d:0 "Неочікувана вимога надійшла до нас від родини Мордіно, яка наразі контролює Нью-Ріно. У зв'язку з війною, яку веде Нова Каліфорнійська Республіка, вони вимагають передати їм Реддінґ та навколишні території. За їх словами, це необхідно для захисту їхніх економічних інтересів у місті.\n\nМи чудово знаємо, які саме “економічні зв'язки” можуть мати ця зграя злодіїв, наркоторговців та рейдерів. Вони просто хочуть повернути собі місто, зробити його ще одним джерелом здобичі, отримати доступ до золота. За інших обставин ми б дали однозначну відповідь: каральна операція проти цих бандитів була б справою честі для нас.\n\nАле зараз ми воюємо з Легіоном Цезаря. Більшість наших сил задіяно на фронті, і ми навряд чи можемо дозволити собі ще одну кампанію. Можливо, погодитися на ці вимоги означатиме менше втрат?"
nf_den.31.a:0 "Ми змушені погодитись на їхні умови."
nf_den.31.b:0 "Республіка не віддасть жодного дюйма землі!"

nf_den.32.t:0 "Темний день для Республіки"
nf_den.32.d:0 "Протистояння рейдерській армії Мордіно з Нью-Ріно йде вкрай погано. А точніше — це повний провал. Ми втратили не лише Реддінґ, але й Сакраменто.\n\nМожливо, задля уникнення подальших втрат нам слід припинити цей конфлікт на їхніх умовах, поки ситуація не стала ще гіршою?"
nf_den.32.a:0 "Так, ми програли цю війну."
nf_den.32.b:0 "Ні, ми не зрадимо своїх громадян цій мерзоті!"

########## Rebecca

nf_den.33.t:0 "Обрані сторінки історії"
nf_den.33.d:0 "Важко применшити вплив Обраного, враховуючи його роль у Північній Каліфорнії. Його дії відзначились у майже кожному великому поселенні. Іноді він діяв відкрито — наприклад, у Реддінґу, що приєднався до НКР здебільшого завдяки йому.\n\nІнші його дії були менш помітні. Як-от у Кламаті. Так, він врятував місто від навали щурів. Але більшість містян і не знала про загрозу, тож незабаром після його візиту він був забутий. Пустка бачила багатьох мандрівників, тож пам’ять про нього залишилась лише у тих, хто знав його особисто.\n\nІ в Ден він залишив слід — місто тоді контролював Метцґер і його гільдія работоргівців. То були похмурі часи, навіть Мордіно здавалися гуманнішими. Ден був проклятим не лише образно, а й буквально — тут мешкав неспокійний привид. У ті неспокійні дні місто страждало як духовно, так і фізично, і Обраний не зміг пройти повз. Але яку саме проблему він вирішив?"
nf_den.33.a:0 "Він дав спокій примарі."
nf_den.33.b:0 "Він убив Метцґера."

nf_den.34.t:0 "Марш Мордіно"
nf_den.34.d:0 "На жаль, такі великі постаті, як Обраний, завжди мають велику мету, що не дозволяє їм залишатись довго в одному місці. Попри покращення життя після його візиту, Ден знову опинився в небезпеці. До того ж, дії Обраного сприяли занепаду впливу Мордіно в Ріно, і вони були змушені тікати з міста, щоб вижити.\n\nТа навіть попри все, Мордіно все ще мали зв’язки у Ден. Без сильного лідера або зовнішньої підтримки місто було приречене. І в той момент в нього не було ані першого, ані другого.\n\nТо як саме Мордіно захопили місто? Вони пішли на прямий штурм, купили банди чи отруїли захисників наркотиками?"
nf_den.34.a:0 "Прямий штурм."
nf_den.34.b:0 "Найм банд."
nf_den.34.c:0 "Поширення наркотиків."

nf_den.35.t:0 "Історія повторюється двічі: спершу як трагедія, вдруге як фарс"
nf_den.35.d:0 "Ісуса Мордіно розбудив скрип дверей, що пролунав у його голові жахливим болем. Його єдина надія — що його доля вже вирішена, й хтось прийшов його вбити. Після провалу нападу на Ріно від нього відвернулися всі. Ніхто не піде на війну за слабкого, що не здатен виграти навіть прикордонний конфлікт. Власні підлеглі замкнули його в цій кімнаті на два тижні, не дозволяючи вийти. У результаті йому залишилось лише напиватися, благо в холодильнику ще залишався алкоголь.\n\nКляті боягузи. Вони навіть не змогли зважитись убити його. Надто боялися боротьби за владу або не вірили у власні сили очолити місто. Жалюгідні слабкодухи не змогли за два тижні вирішити, хто ж уб’є його й забере владу. Ісус уже навіть задумався — хто з підлеглих це може бути? Хто нарешті наважився?\n\nТа побачене здивувало його ще більше. Це була стара жінка — Ребекка, найстаріша жителька міста та власниця казино. Неймовірно. В Ісуса були десятки бандитів, і жоден не мав яєць убити свого боса й покласти край його мукам. А ця стара відьма виявилася хоробрішою за них усіх.\n\nНу що ж, покінчи з моїми стражданнями. У тебе чудова нагода увійти в історію. Убий мене, але пам’ятай — помре не просто людина. Разом зі мною помре й вся родина Мордіно. Ті самі Мордіно, яких боялися всі на північ від Шейді-Сендс. Поклади край цій комедії."
nf_den.35.a:0 "Ден буде вільним."

nf_den.36.t:0 "Посли з Дена"
nf_den.36.d:0 "До нас прибули посланці з міста Ден — брудної діри, яка десятиліттями перебувала під контролем рейдерів, работоргівців і наркоторговців. Однак нещодавно цей режим було повалено, і місто очолила Ребекка. Тепер їхні представники пропонують об’єднатися перед загрозою з боку Нью-Ріно, яке намагається розширити вплив на Західну Неваду. Вони обіцяють залишити за нами самоврядування в обмін на союз, але наголошують: якщо ми не залишимо їм вибору, буде війна."
nf_den.36.a:0 "Це буде краще майбутнє для всіх."
nf_den.36.b:0 "Ми ніколи не станемо на коліна."