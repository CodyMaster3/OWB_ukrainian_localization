l_english:
den_trading_location:0 "Зручне торгове розташування"
den_trading_location_desc:0 "Ден розташований на перехресті шляхів, що дозволяє легко дістатися до будь-якої точки північної Каліфорнії та Невади. Це одразу привернуло увагу торговців."

den_slaveworkers:0 "Рабовласницьке минуле"
den_slaveworkers_desc:0 "Влада родини Мордіно, серед іншого, була побудована на підтримці рабовласницької торгівлі на всьому Західному Узбережжі. Це приносило їм не лише прибуток, але й робочу силу."

den_idea_new_dawn_of_slavery_1:0 "Відновлення торгівлі рабами"
den_idea_new_dawn_of_slavery_1_desc:0 "Работоргівля в Північній Каліфорнії майже знищена. Рейнджери НКР у співпраці з Райтами та Бішопами майже повністю знищили її."

den_idea_new_dawn_of_slavery_2:0 "Незначне зростання торгівлі рабами"
den_idea_new_dawn_of_slavery_2_desc:0 "Работоргівля на півночі Каліфорнії під великим тиском. Ми маємо невелику кількість рабів, однак її недостатньо для покриття всіх потреб."

den_idea_new_dawn_of_slavery_3:0 "Сильне зростання торгівлі рабами"
den_idea_new_dawn_of_slavery_3_desc:0 "Работоргівля в Північній Каліфорнії розвивається. Разом із дешевими рабами ми захопили значну частку ринку."

den_idea_new_dawn_of_slavery_4:0 "Рабовласницький рай"
den_idea_new_dawn_of_slavery_4_desc:0 "Работоргівля процвітає на півночі Каліфорнії. Нам вдалося фактично монополізувати її та почати заробляти величезні статки."

tdb_plantation_1:0 "Малі поля"
tdb_plantation_1_desc:0 "Ми лише почали масово використовувати рабів на полях, однак це вже приносить певний дохід."

tdb_plantation_2:0 "Розвиток сільського господарства"
tdb_plantation_2_desc:0 "Нам вдалося значно збільшити обсяг постачання їжі в усі куточки Невади."

tdb_plantation_3:0 "Процвітаюче сільське господарство"
tdb_plantation_3_desc:0 "Використання смішно дешевої робочої сили приносить свої плоди — ми заробляємо величезні гроші на людському голоді."

tdb_plantation_4:0 "Комора Заходу"
tdb_plantation_4_desc:0 "Нам вдалося неможливе — ми затопили Неваду дешевою та доступною їжею за смішними цінами. Ми навіть розорили кількох баронів НКР."

tdn_citizens:0 "Нові громадяни"
tdn_citizens_desc:0 "Ми почали діяти як Райти, намагаючись залучити нових людей із Пустки до міста, створюючи гарну репутацію Ріно."

tdn_blackvultures:0 "Чорні Стерв’ятники"
tdn_blackvultures_desc:0 "Чорні Стерв’ятники багато чому навчилися під час боїв із роботами Тлалока, і тепер можуть передати ці знання нашій армії."

tdn_nanjimiclan:0 "Клан Шьоко"
tdn_nanjimiclan_desc:0 "Якудза Осани Шьоко — чудові бійці в ближньому бою, і їхній досвід буде надзвичайно корисним для нас."

den_first_attack:0 "Неочікуваний напад"
den_first_attack_desc:0 "Завдяки несподіваній атаці на непідготовлені сили Нової Каліфорнійської Республіки ми здобули стратегічну ініціативу."

tdn_local:0 "Місцева адміністрація"
tdn_local_desc:0 "Завдяки зусиллям місцевих жителів Реддінг поступово стає промисловим центром нашої держави."

tdn_van_graff:0 "Адміністрація Ван Граффів"
tdn_van_graff_desc:0 "Завдяки зусиллям Ван Граффів Реддінг стає центром виробництва дешевого та якісного озброєння для нашої армії."