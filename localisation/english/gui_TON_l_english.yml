  TON_SUB_EXPORT_PERCENTAGE:0 "§GКлік§!, щоб відняти §Y1%§!\n§GCtrl + Клік§!, щоб відняти §Y5%§!\n§GShift + Клік§!, щоб відняти §Y10%§!\n\nЦю частку буде додано до загального експорту"
  TON_ADD_EXPORT_PERCENTAGE:0 "§GКлік§!, щоб додати §Y1%§!\n§GCtrl + Клік§!, щоб додати §Y5%§!\n§GShift + Клік§!, щоб додати §Y10%§!\n\nЦю частку буде віднято від загального експорту"

  TON_irrigation:0 "Зрошення"
  TON_IRRIGATION_FACTORY_TT:0 "Юма — це суха, спекотна пустеля, де випадає мало дощів... але ґрунт тут неймовірно родючий. Тому зрошення є §Oабсолютно критичним§! для сільського господарства Нації Тохоно-О'одхам.\n\nПокращені системи зрошення §Gзбільшать§! кількість §Yорних земель§!, які наші фермери зможуть використовувати. З більшою площею орних земель більше фермерів зможе продуктивно вирощувати врожай, що збільшить загальний обсяг виробництва їжі.\n\nДослідження нових §Yтехнологій§! дозволить нам зробити більше земель придатними для використання."
  TON_irrigation_factories:0 "[?ton_irrigation_factories_num]"
  TON_SUB_IRRIGATION_FACTORIES:0 "Прибрати 1 фабрику з робіт по зрошенню"
  TON_ADD_IRRIGATION_FACTORIES:0 "Додати 1 фабрику до робіт по зрошенню"

  TON_equipment:0 "Обладнання"
  TON_EQUIPMENT_FACTORY_TT:0 "Фермери завжди потребують сільськогосподарського обладнання, навіть якщо використовують відносно прості методи. Ми повинні переконатися, що здатні постійно виробляти необхідну кількість техніки для наших ферм.\n\nХоча це може §Oкоштувати§! нам цивільних фабрик, забезпечення фермерів належним обладнанням є критично важливим для нашого виробництва, особливо на вищих рівнях технологій.\n\nНа вищих рівнях технологій знадобиться більше фабрик для підтримки повної ефективності."
  TON_equipment_factories:0 "[?ton_equipment_factories_num]"
  TON_SUB_EQUIPMENT_FACTORIES:0 "Прибрати 1 фабрику з виробництва обладнання"
  TON_ADD_EQUIPMENT_FACTORIES:0 "Додати 1 фабрику до виробництва обладнання"

  ton_citadel_text:0 "Із заснуванням нових Рейнджерів Тохоно було створено Цитадель Рейнджерів Тохоно. Створення нового корпусу рейнджерів — справа не з легких, і Рейнджерам Тохоно знадобиться значний персонал на їхній новій оперативній базі, перш ніж вони взагалі зможуть вийти в поле.\n\nОднак, як тільки у них за спиною з'явиться потужна база, у пустці не залишиться нікого, хто зможе кинути виклик їхній могутності в пустелі."

  ton_ranger_stats:0 "Розгорнуті дивізії рейнджерів: [?ton_ranger_divisions_deployed]\nМаксимум дивізій рейнджерів: [?ton_max_ranger_divisions]\n\nДоступні команди підтримки: [?ton_ranger_support_teams_available]\nВсього підготовлено команд підтримки: [?ton_ranger_support_teams]\n\nСтатус тренувальної команди: [ton_training_team_status]\n\nСтатус будівельної команди: [ton_construction_team_status]"

  TON_rangers_no_team:0 "§RНЕМАЄ КОМАНДИ§!"
  TON_rangers_team_busy:0 "§OЗАЙНЯТІ§!"
  TON_rangers_team_available:0 "§GДОСТУПНІ§!"

  ton_ranger_support_team_available_tt:0 "Є щонайменше одна доступна §7команда підтримки§!"

  hq_button_tt:0 "Командування Рейнджерів"
  ton_staffing_ranger_hq_tt:0 "Укомплектування §YКомандування Рейнджерів§! дозволить нам тренувати більше §7команд підтримки§! та §Gдивізій рейнджерів§!."
  ton_removing_staff_ranger_hq_tt:0 "Розпуск нашої команди §YКомандування Рейнджерів§! §Oпозбавить§! нас можливості тренувати нові §7команди підтримки§! та §Gдивізії рейнджерів§!."
  hq_button_delayed_tt:0 "[!hq_button_click_enabled]\n\n[!hq_button_click]\n\nПідтримка командного складу для Рейнджерів Тохоно є важливою для їхнього тренування нового персоналу підтримки та дивізій, не кажучи вже про управління самими рейнджерами."

  work_button_tt:0 "Будівництво Цитаделі"
  ton_staffing_construction_tt:0 "Укомплектування §YБудівельної команди§! дозволить нам зводити більше об'єктів для §GРейнджерів§!."
  ton_removing_staff_construction_tt:0 "Зняття нашої §YБудівельної команди§! §Oперешкодить§! нам у зведенні нових об'єктів."
  work_button_delayed_tt:0 "[!work_button_click_enabled]\n\nСпеціалізована будівельна бригада, яка має досвід зі складними спорудами, буде життєво необхідною, щоб наша нова Цитадель розкрила свій справжній потенціал."

  armory_button_tt:0 "Зброярня Рейнджерів"
  ton_staffing_armoury_tt:0 "Укомплектування зброярні покращить нашим рейнджерам показники: §Gбронебійна атака§!, §Gвиснаження§!, §Gнадійність§! та §Gспоживання припасів§!."
  ton_removing_staff_armoury_tt:0 "Це скасує бонуси наших рейнджерів на: §Rбронебійна атака§!, §Rвиснаження§!, §Rнадійність§! та §Rспоживання припасів§!."
  armory_button_delayed_tt:0 "[!armory_button_click_enabled]\n\nСтворивши належну зброярню для забезпечення Рейнджерів Тохоно, ми матимемо людей, які спеціально відповідатимуть за обслуговування їхнього спорядження та гарантуватимуть, що вони мають найкраще доступне екіпірування."

  comms_button_tt:0 "Зв'язок"
  ton_staffing_comms_tt:0 "Укомплектування станції зв'язку покращить нашим рейнджерам §Gініціативу§!, §Gрозвідку§! та §Gподавлення§!."
  ton_removing_staff_comms_tt:0 "Це скасує бонуси наших рейнджерів на §Rініціативу§!, §Rрозвідку§! та §Rподавлення§!."
  comms_button_delayed_tt:0 "[!comms_button_click_enabled]\n\nСпеціальна команда зв'язку для координації Рейнджерів Тохоно означатиме не лише кращу підтримку в полі, але й безперебійну роботу всієї команди на базі."

  health_button_tt:0 "Служба Підтримки Рейнджерів"
  ton_staffing_health_tt:0 "Підготовка служби підтримки покращить нашим рейнджерам §Gпротипіхотну атаку§!, §Gвідсоток врятованих§! та знизить §Gвтрату досвіду§!."
  ton_removing_staff_health_tt:0 "Це скасує бонуси наших рейнджерів на §Rпротипіхотну атаку§!, §Rвідсоток врятованих§! та §Rвтрату досвіду§!."
  health_button_delayed_tt:0 "[!health_button_click_enabled]\n\nНаявність у штаті рейнджерів медиків і лікарів, спеціально навчених лікуванню бойових травм, означає, що більше з них виживатимуть після смертельних поранень, і вони зможуть відновлюватися швидше."

  HAS_ENOUGH_FOOD_TO_CORE_STATE:0 "§Y[Root.GetName]§! виробила достатньо §YЇжі§!, щоб мати в наявності §Y[?coring_var_food_cost]§! (зараз є §Y[?Root.ton_reliance_exports_total]§!)"

  ADD_CORE_TON_TT:0 "§HСформувати харчову залежність§! [?coring_var_food_cost]"
  ADD_CORE_TON_TT_DELAYED:0 "§HБазове значення§!: 25 \n§HЗниження вартості націоналізації від модифікаторів§!: [?coring_cost_from_modifiers_for_display|%0] \n§HВід населення регіону§!: [?coring_var_state_pop] \n--------------\n[!add_core_ton_click_enabled]--------------\nЦе зробить §Y[This.GetName]§! національним регіоном §Y[Root.GetName]§!."