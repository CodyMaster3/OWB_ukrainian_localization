l_english:
  string_fallout_tab_button_tt_35:0 "§YФерми Тохоно-О'одхам§!\nПереглядайте та покращуйте сільськогосподарське виробництво і використовуйте свій урожай."

  TON_gui_title:0 "Ферми Тохоно-О'одхам"

  TON_production_count:0 "§YМинулого місяця§! ми виростили [?ton_farm_output|Y0] в'язок урожаю"

  TON_population_count:0 "§YЗагальне населення§!: [?max_manpower]\n§YФермери§!: [?ton_num_farmers]\n§YФермери-натуральники§!: [?ton_subsistence_farmers]\n§YФабричні робітники§!: [?ton_factory_workers]\n§YСолдати§!: [?ton_soldier_pop]\n§YРізнороби§!: [?ton_misc_employed]\n§YУтриманці§!: [?ton_unemployed_population]"

  ton_250_misc_workers_tt:0 "250 осіб буде призначено до категорії §Yрізноробів§!, §Oвилучивши їх з робочої сили§!"
  ton_500_misc_workers_tt:0 "500 осіб буде призначено до категорії §Yрізноробів§!, §Oвилучивши їх з робочої сили§!"

  TON_GENERAL_EXPORT_TT:0 "Загальний експорт — це просто продаж їжі торговцям, що приносить нам кришки.\n\nМинулого місяця ми продали [?ton_general_exports|Y0] в'язок урожаю через загальний експорт, заробивши [GetCapTxt] [?ton_general_exports_caps|G1] тис. [GetCapType]."
  TON_MERC_EXPORT_TT:0 "Експорт найманцям передбачає обмін їжі на послуги місцевих найманців, що дає нам людські ресурси.\n\nМинулого місяця ми виміняли [?ton_merc_exports|Y0] в'язок урожаю у місцевих найманців, отримавши [?ton_merc_exports|G0] людських ресурсів."
  TON_LOCAL_EXPORT_TT:0 "Місцевий розподіл їжі забезпечить нею нові регіони нашої нації, підвищуючи лояльність та відкриваючи можливість робити регіони національними.\n\nМинулого місяця ми роздали [?ton_reliance_exports|Y0] в'язок урожаю."
  TON_COW_EXPORT_TT:0 "Експорт їжі до Країни Ковбоїв посилить їх проти Легіону та зміцнить зв'язки між нашими націями.\n\nМинулого місяця ми продали [?ton_cow_exports|Y0] в'язок урожаю Країні Ковбоїв.\n\n§OЯкщо наш експорт до Країни Ковбоїв впаде нижче 10% (поки вони ще існують), фракція §CКовбої§! втратить довіру до нас."
  TON_CES_EXPORT_TT:0 "Експорт їжі до Легіону Цезаря посилить їхню економіку, але водночас підірве їхню незалежність, зробивши їх залежними від нас.\n\nМинулого місяця ми продали [?ton_ces_exports|Y0] в'язок урожаю Легіону Цезаря."
  TON_NCR_EXPORT_TT:0 "Експорт їжі до Нової Каліфорнійської Республіки зміцнить їхню економіку та зв'язки з нами, зробивши їх більш зацікавленими в нашій подальшій незалежності.\n\nМинулого місяця ми продали [?ton_ncr_exports|Y0] в'язок урожаю Новій Каліфорнійській Республіці."

