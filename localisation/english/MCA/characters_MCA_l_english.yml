l_english:
### Лідери
MCA_wesson_name:0 "Люсія Весон"
MCA_wesson_desc:0 "Люсія народилася в одній із Перших Родин — еліті Монтани. Її батько був серед перших, хто привітав Полковника, і Люсія виросла як армійська дитина разом із Мартхою. Вона перейняла досконалість Анклаву та впевненість Півночі, і є однією з найвправніших стрільчинь у Монтані — якби ж тільки вона не ставила стільки запитань. Люсія має манери та ідеали справжньої аристократки, та все ж стоїть за себе і за свій народ."

MCA_santiago_name:0 "Еллен Сантьяго"
MCA_ellen_santiago_desc:0 "Полковниця Сантьяго — жінка, розірвана між багатьма обов’язками. Переживши втрату Платформи та Президента Річардсона, вона взяла на себе ще більше відповідальності з роками. Вона підзвітна Секретареві в Чикаго, зобов’язана перед своїм вірним штабом, заплутана в амбіціях Перших Родин, а ще — горда мати, яка прагне кращого для своєї доньки. Балансувати між усіма цими інтересами — виклик, що змусив би здатися багатьох. Але Полковниця вірить, що вона з міцнішого ґатунку. Наступні дні стануть її випробуванням."

MCA_santiago_name_martha:0 "Мартха Сантьяго"
MCA_santiago_desc_martha:0 "§4«Я вірю в Америку.»§!\n\nКапрал — справжня американка, попри те, що кажуть про її походження. Мутантка ніколи б не виглядала велично в Силовій Броні Зразка А, а її мати й поготів не мала б справ з жителями Пустки. Вирісши серед Скелястих Гір, Мартха очолює виняткову Команду Жовтень, вирішуючи практичні проблеми по всій Пустці. Міссула, Бозмен, авіабаза МакАртур та інші мають яскраве майбутнє з нею поруч."

mca_horrigan_ii:0 "Агент Особливого Призначення Джонсон"
mca_horrigan_ii_desc:0 "Агент Джонсон — справжній патріот, чоловік, що добровільно піддався впливу ВРЕ. Вірус змінив його, перетворивши на ідеального вояка Анклаву, зосередженого на реалізації мети — відновленні Америки. Він не ставить зайвих запитань і не оскаржує наказів — хоч і методи його часом надто жорстокі. Хто б не був лідером МакАртура, справжнім начальством Джонсона залишаються Секретар Внутрішніх Справ і Рада, наказам яких він служить віддано й нещадно."

MCA_mason_salvatore:0 "Мейсон Сальваторе"
MCA_mason_salvatore_cultural_desc:0 "Після падіння Наварро вороги Сальваторе жорстоко напали, змусивши родину тікати. Анклав забрав їх із собою на схід, і з того часу Мейсон облаштувався в Міссулі. Дехто дивується, чому Полковниця терпить Сальваторе та його темні справи, але вона пам’ятає, наскільки корисними були ці зв’язки на Заході."

mca_markham_economic:0 "Абіґейл Маркгем"
MCA_markham_economic_advisor_desc:0 "Абіґейл прибула до Монтани з Чиказького Анклаву. Вона почала кар’єру як лінійна робітниця на вантажівковому заводі, а згодом стала керівницею операцій. Її особливо зацікавила автоматизація та аналітика, і вона вирішила започаткувати власну справу. Після того як зазнала переслідувань через сумніви в її «генетичній чистоті», вона пішла з заводу разом із провідним інженером і вирушила на Захід. Тепер вона сподівається перетворити Ґрейт-Фоллз на майстерню МакАртура.\n\nДехто каже, що вона отримала посаду, пообіцявши десять вантажівок на місяць та обмежене виробництво силової броні. Інші вважають, що вона прибула із секретними вказівками від Секретаря Внутрішніх Справ. Як би там не було, заперечити одне важко — Ґрейт-Фоллз перетворюється на кузню, здатну зрівнятися з Піттом."

MCA_zachary_name:0 "Капрал Каллаган"
MCA_zachary_desc:0 "§4«У якийсь момент мусиш перестати сліпо довіряти їм і вирішити сам. Та й узагалі — вибір був між цим і Багамами.»§!\n\nКарл Каллаган народився в Евріці, у середовищі найманців. Він ще немовлям був, коли Платформа згоріла у вогні — його мати втекла на північ, і з часом він зростав, слухаючи розповіді Граніт Компані про Анклав знову і знову. Але замість того, щоби жити ностальгією, їсти мірлорків і шукати вигоду у найманстві, Каллаган з друзями захотіли чогось справжнього. Тоді й виникла шалена ідея — історії про те, як Анклав тікав на схід. Один хабологічний вантажний літак із повними баками пального — і от Капрал Каллаган та Команда Оскар вже служать на МакАртурі, обмінюючись історіями про шалені вчинки з Командою Жовтень."

Chapman_DESC:0 "Ходять чутки, що Чепмен справді служив у підрозділі Анклаву в Техасі, але це виглядає абсурдом. Те, що справді відомо — він добрий солдат, а добрі солдати виконують накази. Чепмен відданий справі — забезпечити, щоб Анклав добув усе потрібне з Вашингтона. Якщо він і шкодує про жорсткість своєї влади, то розуміє: життя жителів пустки — це жертва, на яку він готовий піти."

MCA_jackson_name:0 "Даніел Картер"
MCA_jackson_desc:0 "§4«Просто виконую наказ, пані.»§!\n\nКартер був підлітком, коли його родина втекла на схід з Наварро, а його мати загинула в дорозі. Замість того щоб вирости з твердою волею і принципами, він став слизьким типом, що вміє робити свою роботу. Хоча й виглядає натренованим, не чекайте, що він покаже хребет і зробить щось без прямого наказу."

mca_soldier_officer:0 "Капрал Рудольф"
  # The Rest
MCA_research_civilian_name:0 "Вілсон Джейкобсон"
MCA_research_civilian_desc:0 "§4«Пісок і сніг схожі більше, ніж здається — деякі старі трюки все ще працюють.»§!\n\nДжейкобсон служив під командуванням Еллен із часів падіння Платформи, хоч і був виробником зброї, а не солдатом. Радіє, що його дні втеч із Wattz 2000 у руках і оберігання Полковниці в минулому. Тепер він працює там, де важка зброя може робити більше, ризикуючи менше. Було б прикро, якби Команда Жовтень загинула від підготовленого загону."

MCA_ghoul_advisor_name:0 "Беті Мангано"
MCA_ghoul_advisor_desc:0 "§4«Я зустрічала паршивих гладкошкірих. Ти — не виняток.»§!\n\nБеті народилася десь у XXII столітті, не знаючи довоєнної Америки. Але вона мала розум, що дозволяв застосовувати математику до ведення ранчо й іншого. Потрапивши в пастку рейдерів у кратері з радіоактивними відходами, вона дивом вижила — і поклялася не змарнувати життя. Цинічна як до Анклаву, так і до Північного Співтовариства загалом — смерть усіх, кого вона знала, залишила її в світі, за який вона вже не впевнена, чи варто боротися."

MCA_eric_pelletier_name:0 "Ерік Пеллетьє"
MCA_eric_pelletier_desc:0 "§4«Цінність — річ відносна. А ти — нецінний.»§!\n\nКажуть, він уміє прорізати брехню, і гарантує, що кожен, кому ми довіримо зброю — зуміє її тримати. Кажуть, він вірить у творення американців за традиційними методами, а не клонуванням, і що шлюб для нього не священний. Але все, що ми знаємо — це Ерік Пеллетьє."

MCA_andrew_fleming_name:0 "Ендрю Флемінґ"
MCA_andrew_fleming_desc:0 "§4«Мутанти знають своє місце.»§!\n\nФедеральне Бюро Розслідувань надіслало людину на захід, щоб наглядати за поселеннями ветеранів і забезпечити їхню безпеку. Флемінґ отримав повноваження взаємодіяти з місцевим населенням, щоби американці не тіснилися лише в базі МакАртур, Міссулі чи Бозмені. Адже буде боляче, якщо його рідні загинуть від рук тих, хто не визнає їхнього визволення."

MCA_army_chief_iii_name:0 "Морґан Блексон"
MCA_army_chief_iii_desc:0 "§4«...Я вірю, що Америка цього потребує.»§!\n\nБлексон — ще один із тих, хто пережив Наварро. Його Плазмовий Кастер не раз рятував соратників Полковниці. Врешті-решт він рушив до Чикаго, де зарекомендував себе як здібний командир. Мріяв повернутися на базу МакАртур — хоча, мабуть, не так."

MCA_high_command_iii_name:0 "Рейчел Мерфі"
MCA_high_command_iii_desc:0 "Мерфі — одна з найвидатніших допоміжних офіцерок Анклаву. Освічена й натренована в рамках проєкту ONEIDA, вона стрімко піднялася в ієрархії. У Чикаго їй навряд чи дозволять стати впливовою особою, але на заході вона має шанс довести свою вартість. І досі навідується до родини в Міссулі під час відпустки!"

MCA_enclave_pilot_advisor_3_name:0 "Алістер Кемпбелл"
MCA_enclave_pilot_advisor_3_desc:0 "§4«Є варіанти краще, і вони нас не розорять. Навіть Чикаго вціліє!»§!\n\nКемпбелл особисто пілотував вертиберд, що слугував командним центром Еллен Сантьяго під час походу на схід. Саме його карти вказали на авіабазу МакАртур як можливість. Ніколи не бачив Чикаго, і цілком задоволений тим, що підтримує повітряні операції МакАртура, не зважаючи на забаганки Секретаря Внутрішніх Справ. Чи може Команда Жовтень перестане псувати фарбу на вертиберді?"

MCA_blair_name:0 "Гарольд Блер"
MCA_blair_desc:0 "§4«Я знаю, що замислила Полковниця. І мені це не подобається.»§!\n\nУ чомусь Блер — втілення типової офіцерської касти Анклаву. Він безкомпромісний у питаннях взаємодії з жителями Пустки. Призначення на МакАртур стало для нього шоком — Перші Родини тут працюють разом із звичайними американцями. Замість того, щоби отруїти воду чи винищити всіх, Блер вирішив зробити все, щоби його побратими не гинули дарма. Кожне життя важливе — але деякі важливіші за інші."

MCA_mccormick_name:0 "Алекс МакКормік"
MCA_mccormick_desc:0 "§R«Коли ми згадуємо нещасних жителів пустки: знищених, убитих, отруєних зміями, скошених чумами, винищених голодом, розтерзаних один одним, поглинутих землею, зляканих, проклятих, голодних, обманутих, пограбованих і знеславлених — ми маємо дякувати, що не ми під 'опікою' Братства. Не дивно, що вони прагнуть рабства під Анклавом і з радістю згадують день, коли змінили господарів. Порівняно з Братством, Анклав — благодійник, а його тиранія — свобода для тих, хто страждав від вашингтонського Братства та їхньої Ідеї. Не уявити більш гідотної, ненависної й пихатої організації, ніж Братство Сталі. У післявоєнній Пустці їм немає рівних. Лише вони ніколи не пізнали болю й сліз. Їхня єдина радість — це кров і страждання. Людські почуття їм чужі. Їм не важливі любов, музика, краса чи радість. Фальшиві друзі, несправедливі судді, хвальки, лицеміри, тирани, заздрісні, марнославні, мстиві, облудні, чесні лише у прокляттях, підозріливі, невігласи, мінливі, паскудні, огидні...»§!"

MCA_jeffrey_sun_name:0 "Джеффрі Сан"
MCA_jeffrey_sun_name_desc:0 "Спершу відповідав за очищення води в Монтані, але через нестачу кадрів Джеффрі було доручено економічну перебудову. Його критикують за витрати на жителів Пустки, однак він і його команда забезпечили, що Анклав і Америка мають достатньо сил для боротьби. Можливо, колись він побачить, як Старе Знам’я майорить від моря до моря."

MCA_graham_name:0 "Аарон Ґрем"
MCA_graham_name_desc:0 "Один із небагатьох представників Держдепартаменту Анклаву. Ґрем відповідає за зовнішні зв’язки. Його досвід у Пустці зробив його толерантнішим за інших, і готовність до компромісів виділяє його серед решти. Відправлений на МакАртур через конфлікт із Департаментом Внутрішніх Справ, який теж претендує на зовнішні справи. Проте Ґрем ще може стати в пригоді."

MCA_female_high_command_name:0 "Еллі Блю"
MCA_female_high_command_desc:0 "§4«Хоч як дивно, але ми вміли себе захищати ще до Анклаву.»§!\n\nМати Еллі була з роду Джексонів, але вона її не бачила відтоді, як та покинула Міссулу. Ображена, що матір пішла з родиною, Еллі заглибилася в історію страждань Міссули з часів Великої Війни. Минуло стільки років, а методи самозахисту залишилися актуальними. Її це досі вражає."

MCA_female_army_chief_name:0 "Джанет Кастільйо"
MCA_female_army_chief_desc:0 "§4«Відповідь така ж проста, як завжди, Мартхо: застрель цю сучку.»§!\n\nДжанет — нащадок однієї з Перших Родин, тому ще з дитинства була близька до Мартхи, як сестра. Та замість приєднання до Команди Жовтень, Джанет виявила хист до стратегічного планування, що стало безцінним. Зазвичай це означає підтримку агресивного підходу — раптової атаки, що позбавляє ворога часу на реакцію. Іноді здається, що з часу, коли її батьків перетворили на зміїний хвіст Буревії, вона просто шукає смерті."

MCA_female_army_chief_name:0 "Джанет Кастільйо"
MCA_female_army_chief_desc:0 "§4«Відповідь така ж проста, як завжди, Мартхо: застрель її.»§!\n\nДжанет — нащадок однієї з Перших Родин, і з дитинства була близькою до Мартхи, майже як сестра. Однак замість того, щоб приєднатися до Команди Жовтень, вона виявила хист до стратегічного планування. Її підхід — агресивний, блискавичний, не залишаючи ворогам часу на реакцію. Іноді здається, що вона просто шукає смерті з того часу, як її батьків розірвали Буревії."

MCA_maria_canavan_name:0 "Марія Канаван"
MCA_maria_canavan_desc:0 "§4«Ми знаємо, що потрібно МакАртуру, і що потрібно Чикаго. Це все проста гра рівноваги, любчику.»§!\n\nКанаван прибула як радниця на місці, щоби визначити, коли і скільки ресурсів можна регулярно відправляти назад у Чикаго. Вже на місці вона зрозуміла, наскільки бракує спроможностей у МакАртура, і що Чикаго міг би вкласти кошти, аби витягти більше з Півночі. Зрештою, їй не вдалося домовитися про все, що вона хотіла — але цього вистачило. Непогано як для пихатої жінки, яка мріє повернутися на схід."

MCA_enclave_pilot_advisor_2_name:0 "Джордж Мотьє"
MCA_enclave_pilot_advisor_2_name_desc:0 "Родина Джорджа веде свій рід ще з часів Американської революції. Вихований на тих ідеалах, він мріє відродити Великий Експеримент. Але навіть ставши офіцером Анклаву, він лишився з питаннями — адже його родина одна з небагатьох, хто все ще читає Біблію. Небезпечна, забобонна книга — чи ключ до порятунку Пустки? Бо не здоровим потрібен лікар, а хворим."

MCA_economic_advisor_2_name:0 "Сержант О. Вілліс"
MCA_economic_advisor_2_name_desc:0 "Дехто насміхається з Вілліса, але згодом шкодує про це — коли пайки приходять пізно або зіпсовані. Вілліс — один із чотирьохмайстрів МакАртура, що грає вирішальну роль у забезпеченні військ харчами й припасами. Його вміння домовлятися з фермерами Монтани не варто недооцінювати. А ще він готує пречудовий стейк з браміна."

MCA_journalist_name:0 "Томас Кордова"
MCA_journalist_desc:0 "§4«Принесіть мені фото Команди Жовтень!»§!\n\nГоловний редактор газети *Патріот Монтани* заснував її ще підлітком, коли його батьки мали справний трактор і йому не довелося працювати в полі. Відтоді газета значно виросла — іноді за сприяння Полковниці, іноді наперекір їй. Якою б не була його позиція, він завжди стежить, аби Команда Жовтень не виглядала кепсько."

MCA_historian_name:0 "Якоб Шьолаас"
MCA_historian_desc:0 "§4«Добрі вояки минулого спершу ставали невразливими до поразки, а вже потім шукали нагоди перемогти.»§!\n\nРодом із Twin Buttes, Шьолаас присвятив себе вивченню оборонної стратегії (чи, як кажуть інші — долі війни). Його праці допомогли іншим підготуватися до захисту... навіть якщо в його бібліотеці мало згадок про Силову Броню."

MCA_advisor_fuel_ai_name:0 "Volkswagen Джерманотти"
MCA_advisor_fuel_ai_desc:0 "§R«Народжений у місті мертвих\n\nПерший удар прийшов, щойно я впав на землю\n\nЖиття як побитого пса — половина життя минає, ховаючи шрами\n\nІ ось тепер...»§!"

MCA_germanotta_rides:0 "Поїздки Президента"

MCA_ecoomic_advisor_lack_of_resources_name:0 "Фермер Таненбаум"
MCA_ecoomic_advisor_lack_of_resources_desc:0 "§4«Ми стали кращими за інших не просто так.»§!\n\nТаненбауми — одна з Перших Родин Міссули, і з часу інциденту з Heaven’s Gate у 60-х вони пожинають плоди співпраці з Анклавом. Офіційно Гадсон Таненбаум говорить лише про те, як зростають поставки м’яса, зерна й кришок через Скелясті Гори. Але за зачиненими дверима він каже, що не надто боїться рейдерів зі сходу, і що, можливо, загроза значно ближча."

MCA_geoff_cajigas_name:0 "Капрал Кахіґас"
MCA_geoff_cajigas_desc:0 "§4«Кажу востаннє — я знаю, чим ти займався. Або признавайся, або чиститимеш туалети зубною щіткою!»§!\n\nКапрал Кахіґас має репутацію буркуна — його дратує все, чого немає в звітах. На жаль, він відповідає за більшість радіозв’язку в МакАртурі, а отже чує й бачить набагато більше, ніж слід. Якби не його майстерність у координації, Сантьяго — обидві — давно б відправили його назад у Чикаго без Силової Броні."

MCA_vincent_advisor_name:0 "Вінсент Кеннеді"
MCA_vincent_advisor_name_desc:0 "Не кожен науковець з Чиказького Університету мріє про біозброю чи нову Силову Броню. Кеннеді — один із таких невдах, що добровільно рушив на захід. Йому до вподоби легкий стиль Полковниці, і він намагається виростити довоєнні багатства в штучному середовищі. Кажуть, він мріє відродити найлегендарніший фрукт із усіх.\n\n\n\nДуріан."

MCA_naval_advisor_name:0 "Капітан О’Кіф"
MCA_naval_advisor_name_desc:0 "Кажуть, що десь у морських глибинах Анклав усе ще має довоєнні судна, здатні знищувати міста. А ще є О’Кіф — приклад того, що навіть через 200 років після ядерної війни можна призначити морського офіцера в Монтану, якщо він напився й врізався в вантажне судно."

MCA_pilot_advisor_name:0 "Майкл Пейдж"
MCA_pilot_advisor_desc:0 "§4«Ціль заблоковано... і нейтралізовано. Завжди приємно влучити, коли ти на дрифті.»§!\n\nПейдж прославився тим, що витискає максимум із пального вертибердів завдяки хитромудрим маневрам, і при цьому не дає ворогу вистрілити у відповідь. У Чикаго він писав керівництва з пілотування, але згодом подав запит на переведення на Захід — до старої подруги, Полковниці Сантьяго. Мабуть, не випадково це співпало з розлученням. Зате він залишив дітей собі — краще нехай граються у снігу Бозмена, ніж у димі Чикаго."

MCA_scientist_advisor_name:0 "Сара Мішель"
MCA_scientist_advisor_desc:0 "§4«Я можу вдосконалити не лише твою Силову Броню — я можу вдосконалити тебе. А тепер клич мене Сем, чорт забирай.»§!\n\nСара Мішель працює над вдосконаленням Силової Броні з того моменту, як побачила комплект X-01 Mk VI на зеленому терміналі. Зараз вона працює у середовищі, де навіть ця модель — не норма. Її виклик — створити броню, придатну для масового виробництва й експлуатації на зменшеному бюджеті. Для Сари це чудова віддушина. Вона навіть за межами майстерні носить захисний костюм. Цікаво, чи пов’язане це з її регулярними запитами змінити ім’я на «Сем» — які Чикаго вперто відхиляє."

MCA_jackson_advisor_name:0 "Містер Ніл Джексон"
MCA_jackson_advisor_desc:0 "§9«Минув час, і вогонь у нас в душі пожер усе. Пам’ять про бійню переслідує нас, живлячи рішучість збудувати прощення. Ми ніколи не забудемо кровопролиття — і не дозволимо забути іншим.»§!\n\nРодина Джексонів не очікувала милосердя від МакАртура, але [MCA.GetName] та [MCA.GetLeader] не порушили свого слова. Джексони присвятять життя зціленню шкоди, яку вони завдали на рівнинах сходу. Для більшості це була б тяжка ноша, та не для Ніла і його роду. Міссула стала кращою, ніж була. І навіть якщо їхній маєток уже не такий приємний, як колись — вони можуть повернутися додому. Джексони ніколи не переставали боротися. І не перестануть. Але тепер ця боротьба служить чомусь більшому."

mca_markham_economic:0 "Абіґейл Маркгем"
MCA_markham_economic_advisor_desc:0 "Абіґейл прибула до Монтани з Чиказького Анклаву. Свою кар’єру вона почала як лінійна робітниця на вантажівковому заводі, а згодом піднялася до керівниці операцій. Вона захопилася автоматизацією й аналітикою, й вирішила створити щось власне. Після переслідувань через «генетичну чистоту» вона покинула завод разом із провідним інженером і рушила на Захід. Тепер мріє перетворити Ґрейт-Фоллз на майстерню МакАртура.\n\nДехто каже, що вона отримала посаду, пообіцявши десять вантажівок на місяць і можливість виробництва, хоч і обмеженого, Силової Броні. Інші вважають, що вона прибула із секретними вказівками Секретаря Внутрішніх Справ. Як би там не було — Ґрейт-Фоллз перетворюється на кузню, здатну зрівнятися з Піттом."

mca_horrigan_iii:0 "Агент Особливого Призначення Джексон"
mca_horrigan_iii_desc:0 "Невже ви й справді думали, що Джонсон — єдиний патріот із Чикаго?"

mnca_johannes_name:0 "Драматург Йоганнес"
mnca_johannes_desc:0 "§0Мені здалося, я бачив свою покійну святу\n\nПринесену до мене, як Алкестіда з гробу,\n\nЩо її дав Юпітер її втішеному чоловіку —\n\nВрятовану від смерті, хоч і слабкою.\n\nМоя, як та, що обмита від скверни дитонародження,\n\nОчищенням у старому Законі,\n\nІ така, яку ще раз, я сподіваюся, побачу\n\nУ раю, без перепон.\n\nУся в білому, як її помисли.\n\nОбличчя закрите, але в уяві моїй\n\nЛюбов, доброта, лагідність — усе сяяло в ній\n\nЯсніше, ніж у будь-якому лиці, яке приносить радість.\n\nАле, о, щойно вона схилилася до обіймів —\n\nЯ прокинувся. І день повернув мені ніч.§!"

MCA_granite_name:0 "Сержант Граніт"
MCA_granite_desc:0 "Зачекай... а тобі не слід бути в Каліфорнії?"
