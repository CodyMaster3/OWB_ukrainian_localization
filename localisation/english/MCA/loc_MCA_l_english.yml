l_english:
## Focuses
MCA_reinforcements:0 "Підкріплення прибуло"
MCA_reinforcements_desc:0 "§R«Ми багато вимагали від тебе, агенте Джонсоне. Але ж ти не думав, що Анклав тебе покине?»§!\n\n§R«Можливо, ці обличчя видадуться тобі знайомими.»§!"

MCA_invite_eagle_rock:0 "Втрачена повітряна ескадра"
MCA_invite_eagle_rock_desc:0 "Правителі Іґл-Року колись задовольнялися довоєнними багатствами, обслуговуючи дирижаблі заради прибутку. Та їхній новий лідер, певно, знайде користь у служінні Анклаву."

MCA_eagle_rock:0 "Орлина Скеля часів"
MCA_eagle_rock_desc:0 "Хоча наразі ми не прагнемо приєднувати Орлину Скелю до Північного Співтовариства, вони можуть стати цінним торговим партнером. Чому б не заохотити їхні дирижаблі борознити північне небо?"

MCA_eyebot_reliance:0 "Залежність від робоочей"
MCA_eyebot_reliance_desc:0 "Щоб забезпечити контроль над просторами Півночі, нам потрібні маленькі роботизовані помічники. Чикаго охоче їх надасть... звісно, не безкоштовно."
MCA_eyebot_reliance_tt:0 "§gЗа сорок кришок ви отримаєте змогу підвищити лояльність у обраних некорінних регіонах – адже робоочі створюють паноптикум, що змушує незгодних мовчати.§!\n\n"

MCA_wyoming:0 "Вітри Вайомінґу"
MCA_wyoming_desc:0 "На заході, де захід сонця червоний, Де підносяться Скелясті Гори, Розкинувся молодий і сильний Вайомінґ – наш дім і наша любов."

MCA_ncr_ties:0 "Інша велика демократія"
MCA_ncr_ties_desc:0 "Чутки доносять про ще одну велику республіку на півдні й заході – з тими самими ідеалами: рівність, представництво, закон. Хоча в Анклаву з ними була темна історія, можливо, час простягнути руку примирення?"
MCA_ncr_ties_tt:0 "\n§gА головне – якщо вони ненавидять §y[BOS.GetNameWithFlag]§!, то не можуть бути вже аж такими поганими.§!"

NCN_southern_outpost:0 "Порятунок Солт-Лейка"
NCN_southern_outpost_desc:0 "Спочатку ми думали, що розвідка жартує, та, виявляється, Юта кишить дикунами, рейдерами й мормонськими вцілілими. Укріплення Солт-Лейк-Сіті – ключ до захисту інтересів Анклаву. У вас є накази, Полковнице."

MCA_utah_buffer:0 "Вторгнення в Юту"
MCA_utah_buffer_desc:0 "Соромно визнавати, але наші війська дещо заблукали в Юті. Та виявилося, що там чимало сировини і майже немає захисту. Можливо, варто дослідити – чи є там щось цінне?"

MCA_plasma_tech_good:0 "Та ж плазма, що була у Вашингтона"
MCA_plasma_tech_good_desc:0 "Тепер, коли контроль закріплено, ми можемо повністю озброїтися плазмовою зброєю. Ти знав, що Батьки-засновники саме так убили Георга III? От тепер знаєш."
MCA_plasma_tech_good_tt:0 "\n§PЧикаго забере п’ять £resources_strip|5 §!"

MCA_ask_for_apa:0 "Запит на додаткову броню"
MCA_ask_for_apa_desc:0 "Хто з нас не хоче більше Силової Броні? Особливо з таким кліматом."
MCA_ask_for_apa_tt:0 "§gКоштуватиме 5 £resources_strip|3 §!"

MCA_ask_for_plasma:0 "Потужність плазми"
MCA_ask_for_plasma_desc:0 "Жаль тих, хто не має новітньої зброї."
MCA_ask_for_plasma_tt:0 "§gКоштуватиме 5 £resources_strip|2 §!"

MCA_lions_in_winter:0 "Леви в зимі"
MCA_lions_in_winter_desc:0 "Не всі на Півночі правлять силою чи архаїзмом. У цій Старій Землі ще є герої. Замість працювати лише з Вартовими, дозволь розповісти про одного американця, що бореться ще з Великої Війни – за Правду, Справедливість і Американський Шлях. Навіть якщо його шкіра вже облізла."
MCA_toc_auxiliaries_tt:0 "§M\nОбережно – гуль, що воював за Америку, може не схвалити Анклав.§!\n"

MCA_ghoul_decision:0 "Чотирнадцята поправка"
MCA_ghoul_decision_desc:0 "Хоча ми щасливо оминули навалу супермутантів, як у решті Пустки, та гулів у нас чимало. Як з ними чинити?"

MCA_ghoul_tt:0 "§g\nВзаємодії з іншими державами гулів до цього моменту вплинуть на доступні варіанти й результат.§!"

MCA_hire_wardens:0 "Наші західні вартові"
MCA_hire_wardens_desc:0 "Якимось дивом залишки приватної військової компанії пережили Велику Війну – хоч їхнє минуле й говорить, відверто кажучи, про катастрофу (як і в усіх гулів), вони все ж можуть стати в пригоді. Нам варто укласти з ними угоду?"

MCA_kill_midwest:0 "§PНЕХАЙ ЦЕ БУДЕ НАША ОСТАННЯ БИТВА§!"
MCA_kill_midwest_desc:0 "Настав час зіткнутися з Братством Сталі. Ми допоможемо Чикаго раз і назавжди розправитися з цими потворами. Згодом. Тобто, звичайно, не сьогодні. Адже карта ще не оновлена!"

MCA_finished_canada:0 "Віє холодний вітер"
MCA_finished_canada_desc:0 "Будьмо чесні – а хтось взагалі дбав про Канаду?"

MCA_finished_washington:0 "Повідомити Чикаго про Тихоокеанську перемогу"
MCA_finished_washington_desc:0 "Будемо відверті: Анклав дбає про Канаду більше, ніж самі канадці."

MCA_montana_ours:0 "Володарі Монтани"
MCA_montana_ours_desc:0 "Нарешті, ми здобули контроль над Північчю й усіма, хто там мешкає."
MCA_montana_ours_tt:0 "\n§PСекретар Внутрішніх Справ задоволений.§! Ви отримуєте одну послугу."

MCA_human_resources:0 "Кадровий ресурс"
MCA_human_resources_desc:0 "Однією з переваг Півночі є її ізоляція. Чикаго просить доступ до біологічних зразків для подальшого удосконалення. Можливо, деякі жителі Пустки постраждають, але зрештою – ті, хто виживе, будуть нам вдячні."
MCA_human_resources_tt:0 "§PЦе відкриє унікальну здатність від Чикаго для тиску на ворогів; але це також посилить їхній вплив.§!"

MCA_met:0 "Стук у Небесну браму"
MCA_met_desc:0 "А що, власне, задумали ці релігійні ізоляціоністи? Є тільки один спосіб це з’ясувати! Звісно, крім того, щоб попросити кур’єра надіслати листа. Ці типи — небезпечні непередбачувані типи."

MCA_nit:0 "Утримати Вищу Церкву"
MCA_nit_desc:0 "Хочеш сам прибирати Юту? Я – ні. Ще один аргумент на користь буферної зони."

MCA_stampedeii:0 "Порятунок Спокена"
MCA_stampedeii_desc:0 "Ми повинні вирішити, що робити зі Спокеном – але багато залежить від того, хто ним керує. Бо ми не маємо нічого проти жителів Пустки, які розуміють загрозу від мутантів і гулів."

MCA_give_advisor:0 "Легенди компанії Граніт"
MCA_give_advisor_desc:0 "Кажуть, навіть на заході мрія не померла. Десь із Наварро вибрався вцілілий з групою найманців – сповнений віри в обіцянку Анклаву."
MCA_give_advisor_tt:0 "Слава хоробрим, хто зберігає Анклав у Пустці. Вітаємо Капрала Каллагана в нашій родині."

MCA_fight_for_Freedom_forever:0 "Мрія не помирає"
MCA_fight_for_Freedom_forever_desc:0 "Анклав заявляв, що є останніми американцями, і, можливо, вони є наступниками уряду США. Але дух Америки – не в спадковості. Він – у тих, хто ніколи не зрадить її обіцянки."

MCA_nuka_break:0 "Стоячи окремо"
MCA_nuka_break_desc:0 "Анклав, великий 51 штат та безліч інших загроз нависли над нашою молодою державою. Якщо хочемо залишитися в спокої – мусимо відлякати нападників."

MCA_bismarck:0 "Революціонери старі й нові!"
MCA_bismarck_desc:0 "Бісмарк був домом не лише для американців, але й німців, що боролися проти тиранії Ресурсних Воєн. Не уявити кращих кандидатів для приєднання до Північного Співтовариства, ніж ці герої."

MCA_ration_planes:0 "Останки наших повітряних сил"
MCA_ration_planes_desc:0 "На жаль, нам не зрівнятися з авіацією Чикаго. Та під час революції ми захопили кілька винищувачів – вони й охоронятимуть наше небо."

MCA_seat_on_board:0 "Місце в Раді"
MCA_seat_on_board_desc:0 "Знищивши Братство, ми здобули вихід до Міссурі. Це значно спростить наш вплив на Середній Захід."
MCA_seat_on_board_tt:0 "\n§gУсі ваші взаємодії з Стілтауном вплинуть на подальші події.§!"

MCA_team_october:0 "Відправити команду Жовтень"
MCA_team_october_desc:0 "Ми ще не готові кинути виклик [MNC.GetLeader] та його мерзотникам відкрито, але ми ніколи не перестанемо боротися за американський народ. У Команди Жовтень є план."
MCA_team_october_tt:0 "\n§MЦікаво, що вона придумає на своїй пригоді.§!"

MCA_airfield_havre:0 "Відновлення P-25"
MCA_airfield_havre_desc:0 "База ВПС Гавр була станцією радіолокаційного спостереження до війни. Там також були злітні смуги для аварійних посадок. Хоч більшість споруд розібрано – ми використаємо все, що залишилось."

MCA_air_support:0 "Підтримка з повітря!"
MCA_air_support_desc:0 "Маючи перевагу в повітрі, американські війська витримують там, де рейдери й дикуни тікають, твердячи, що їх «оточили». Подейкують, деякі наші солдати були притягнуті до суду за виклик авіапідтримки... для доставлення освіжаючої ожинової газованки від Сальваторе."

MCA_not_by_blood_alone:0 "Не кров’ю єдиною"
MCA_not_by_blood_alone_desc:0 "На сході є ті, хто вважає мутації наслідком ДНК та хромосомних ушкоджень. Вони – дурні. Деякі гідні американці все ще можуть бути врятовані з Пустки – це доводить їхня служба Державі."

MCA_rail_guns:0 "Справжнє добро"
MCA_rail_guns_desc:0 "Гаус-рушниці, можливо, й поступаються плазмовій зброї, та вони значно легші в обслуговуванні в умовах Пустки й суттєво переважають усе, що носять звичайні дикуни. Завдяки досягнутим домовленостям, тепер ми маємо їх досить для ширшого розгортання."

MCA_apa_yay:0 "Справжній уніформ"
MCA_apa_yay_desc:0 "Що ж, бригадире, можливо, ви таки це заслужили. Наразі, хто б ще міг сумніватися, що ви – справжній член Анклаву, вірний справі?"

MCA_hephaestus_online_better:0 "Невтомне полум’я"
MCA_hephaestus_online_better_desc:0 "Для Чикаго проєкт Єллоустоун був лише ресурсом. Але підтримка Полковниці в альтернативних дослідженнях відкрила нові горизонти."

MCA_shipments_from_chicago:0 "Поставки до Чикаго"
MCA_shipments_from_chicago_desc:0 "Тепер, коли безпеку відновлено, ми можемо розширити торгівлю з Чикаго на більш рівних умовах."
MCA_shipments_from_chicago_tt:0 "\n§gВи втрачаєте §Y5 енергії§!§g,§! §Y6 металу§!§g та §Y5 води§!§g.§!"

MCA_origin:0 "Відбудуймо Америку, сьогодні!"
MCA_origin_desc:0 "Колись існувала нація, яка вважала, що всі люди створені рівними та наділені Творцем невід’ємними правами – на життя, свободу і прагнення щастя.\n\nЦю націю понівечила Велика Війна. Але ми, Анклав, ніколи не припинимо боротьбу за американський народ."

MCA_the_base:0 "З бази – в дім"
MCA_the_base_desc:0 "Колись мережа баз пов’язувала уряд США. Багато з них протрималися аж до падіння Наварро. Ці жарини патріотизму Полковниця Сантьяго роздула у нове світло – воно охоронятиме Пустку, поки горить."

MCA_the_families:0 "Перші Родини"
MCA_the_families_desc:0 "Бомби лише ковзнули повз Міссулу під час Великої Війни: місто голодувало, але будівлі встояли. Тепер тут панують Перші Родини – нащадки тих, хто готувався заздалегідь."

MCA_advanced_special_forces_focus:0 "Найкращі сили західніше Міссісіпі"
MCA_advanced_special_forces_focus_desc:0 "Навіть без Силової Броні, війська МакАртура – грізна сила. Адже перемогу під Шебойганом їм принесла не броня."

MCA_firearm_tech:0 "Вивчити схеми"
MCA_firearm_tech_desc:0 "Навіть якщо ми не можемо будувати більше Силової Броні – в технологіях Чикаго ще багато чого повчитися."

MCA_missoula_market:0 "Ринок Міссули"
MCA_missoula_market_desc:0 "Ринок Міссули вже найкращий у Монтані. З належною модернізацією – може стати і найбільшим."

MCA_gibbonsville_outpost:0 "Аванпост у Ґіббонзвіллі"
MCA_gibbonsville_outpost_desc:0 "Ґіббонсвілл стоїть покинутий ще з часів Великої війни, але досі височіє посеред доріг, що ведуть з Айдахо. Якщо належним чином укріпити цей район, ми зможемо перекрити рейдерам шлях у перевалах."

MCA_macarthur_arsenal:0 "Поставка з Чикаго"
MCA_macarthur_arsenal_desc:0 "Чикаго охоче відправить допомогу на захід – але, цілком природно, очікує зустрічної участі у Великій Справі. Хіба ж ми не одна нація?"
MCA_macarthur_arsenal_tt:0 "\n§PЧикаго забере три £resources_strip|1 §!"

MCA_sharecropper_refugees:0 "До ферми"
MCA_sharecropper_refugees_desc:0 "Найкраще використання біженців – робота на фермах і ранчо навколо Міссули. Так ми дамо їм нове життя – вірних працівників Перших Родин."

MCA_cars_of_our_own:0 "Фінансування компанії Crow Trucking"
MCA_cars_of_our_own_desc:0 "Герої Монтани – це Кроу, чиї вантажівки сполучають поселення Півночі. Гараж у Міссулі виробляє кілька машин на місяць, але з інвестиціями й інженерією Анклаву ми зможемо подвоїти, чи й потроїти це!\n\nЦе допоможе не лише людям Півночі, а й зміцнить владу Полковниці."

MCA_anti_slavery_patrols:0 "Ніколи не припиняймо боротися за американський народ"
MCA_anti_slavery_patrols_desc:0 "Однією з найбільших трагедій є те, що значна частина Північної Співдружності мириться з рабством. Будь то кріпаки в епоху парових машин, робітники на службі у тих, хто гідний Металу, хозери чи ті, хто працює під загрозою мученицької смерті, тисячі людей за межами наших кордонів задихаються в рабстві. Ми мусимо відкрити для них свої серця та поселення!"

MCA_drill_the_army:0 "Остання професійна армія"
MCA_drill_the_army_desc:0 "Перевага §M[MCA.GetNameWithFlag]§! у тому, що наша армія досі – навчена армія. І це дає нам перевагу перед натовпом, що оточує наш острів стабільності."

MCA_old_depots:0 "Сховища виживальників"
MCA_old_depots_desc:0 "Дехто дивується, як Сантьяго знаходила старі бункери виживальників – але ж ніхто не заперечує їхньої користі для вояків, що боронять край."

MCA_bozeman_museum:0 "Старий музей"
MCA_bozeman_museum_desc:0 "У Бозмені колись був Американський музей комп’ютерів і робототехніки. Раніше це були застарілі експонати. Тепер – передова технологія Пустки, а часом і більше."

MCA_granite_company_home:0 "Новий дім старих людей"
MCA_granite_company_home_desc:0 "Окремий загін Анклаву залишився на західному узбережжі як найманці. Та можливо, час покликати їх додому, замість марнувати час на службі Сальваторе чи Ван Ґраффам. Бо хто краще за них – щоб гарнізонувати Компанію Граніт?"
MCA_granite_company_home_tt:0 "Після років на окраїнах Пустки, §PСержант Граніт і його хлопці§! нарешті знайшли дім!\n\n"

MCA_advanced_construction:0 "Відбудуємо старі шляхи"
MCA_advanced_construction_desc:0 "Немає причин, чому мешканці Монтани й Айдахо повинні жити в злиднях. За правильних умов – усе зміниться."

MCA_mills:0 "Зернові млини"
MCA_mills_desc:0 "Найкращий спосіб підтримати місцеву економіку – стимулювати сільське господарство. Будуючи млини в ключових містах, ми започаткуємо індустріалізацію."

MCA_tellurium_mines:0 "Субсидувати телурові шахти"
MCA_tellurium_mines_desc:0 "Телур – один з найрідкісніших металів на Землі, але незамінний у складній металургії. Позичивши Першим Родинам наше обладнання, ми допоможемо їм розширити видобуток цього дорогоцінного ресурсу."

MCA_paper_please:0 "Патріот Монтани"
MCA_paper_please_desc:0 "«Патріот Монтани» з’явився в Міссулі ще за десятиліття до прибуття Анклаву, але став важливим інструментом, що доносить правду прямо з кабінету Полковниці. За умови фінансування редакція зможе розширити розслідування жахіть культистів і рейдерів за межами наших земель – хоч перепалки між Полковницею та головним редактором стануть легендарними."
MCA_papers_please_tt:0 "\n\n§g«Патріот Монтани» інформуватиме вас про події в регіоні. §RАле обережно – ворожа газета страшніша за тисячу багнетів.§!§!"

MCA_history_lessons:0 "Уроки історії"
MCA_history_lessons_desc:0 "Як ми можемо відбудувати цивілізацію в Пустці без підтримки Чикаго? На щастя, є одна група, здатна допомогти."
MCA_history_lessons_tt:0 "\n\n§gУсі ваші попередні взаємодії вплинуть на результат.§!"

MCA_water_water:0 "Іригація повенями"
MCA_water_water_desc:0 "Перші поселенці Монтани покладалися на іригацію повенями, але електричні насоси та механізовані розбризкувачі здатні працювати на певних фермах. Машини, що колись добували ресурси, тепер допомагатимуть вирощувати врожаї."

MCA_chicago_industrial_extractions:0 "Допомога Чикаго"
MCA_chicago_industrial_extractions_desc:0 "Дивіться, Монтано – я знаю, що ви сумнівались у моїх зусиллях. Але чи не допоміг нам Чикаго?"

MCA_garden_god:0 "Божий сад"
MCA_garden_god_desc:0 "Авіабаза МакАртур прихистила унікальні теплиці, в яких ростуть тропічні фрукти, яких не бачили в Скелястих Горах вже майже два століття. Апельсини, авокадо, банани – усе це з’являється на столі Полковниці завдяки так званому «Божому Саду»."

MCA_marshalls:0 "Маршали"
MCA_marshalls_desc:0 "Під проводом шерифки Гезер, Маршали служать цивільною допоміжною силою МакАртура та втілюють волю Полковниці в Міссулі та поза її межами. Збільшивши їхні лави, ми посилимо нестачу особового складу армії США на заході."

MCA_formosa_franks:0 "Зброярня Формоза Френка"
MCA_formosa_franks_desc:0 "Кажуть, родину Френка тримали в таборі Малий Гуандун, коли впали бомби. Сам же він твердить, що вони були вірними громадянами. Як би там не було – він давно вважається найкращим зброярем у Міссулі."

MCA_electrify_lower_rattlesnake:0 "Освітити район гримучих"
MCA_electrify_lower_rattlesnake_desc:0 "Літтл-Ретлснейк – район, де оселилися Перші Родини Міссули. Гарний, тихий. Ми здобудемо більше підтримки, якщо забезпечимо його електрикою."

MCA_little_reno:0 "Маленьке Ріно"
MCA_little_reno_desc:0 "Сальваторе прибули зі сходу після падіння Наварро. Один із них хоче відкрити затишний клуб, щоб дати людям смак заходу."

MCA_mac_machine_shop:0 "Майстерня МакСвіні"
MCA_mac_machine_shop_desc:0 "Фальшивий шотландський акцент МакСвіні (навчений з довоєнних голозаписів) дратує, але ніхто не заперечує, що його майстерня – найкраща в Міссулі. Та й єдина, якщо вже бути чесними."

MCA_guitar_factory:0 "Гітарна фабрика"
MCA_guitar_factory_desc:0 "До війни в Бозмені була велика гітарна фабрика. І традиція живе далі. Хоч деякі пісні – доволі... нестандартні, та музику їх не сплутаєш ні з чим."

MCA_highway:0 "Відновити шосе"
MCA_highway_desc:0 "Шосе Монтани в занепаді, але [MCA.GetLeader] не пошкодує коштів, аби покращити життя громадян. А якщо це ще й армії допоможе – то тим краще."

MCA_bozeman_energy:0 "Енергія Бозменських джерел"
MCA_bozeman_energy_desc:0 "[HEA.GetNameWithFlag] вважають геотермальну енергію дивом, але це просто американська інженерія. [MCA.GetLeader] із радістю забезпечить світло й тепло біженцям у місті."

MCA_chicago_reinforcements:0 "Підкріплення з Чикаго"
MCA_chicago_reinforcements_desc:0 "На запит [MCA.GetLeader] Секретар Внутрішніх Справ надіслав спорядження на захід. Звісно, це вимагатиме певної поступливості..."

MCA_little_slice_heaven:0 "Кусочок раю"
MCA_little_slice_heaven_desc:0 "Громадяни Монтани, говорить ваша Полковниця. Чи ви усвідомлюєте, які ви щасливі? Які ви привілейовані? Ви живете в найкращому штаті Америки. Ба більше – в єдиній справжній Америці!"

MCA_convoys:0 "Конвої"
MCA_convoys_desc:0 "Ні дощ, ні сніг, ні банди рейдерів не зупинять конвої Міссули. Їхній хід – краса. І одного дня ми проведемо ці вантажівки крізь всю Америку."

MCA_defend_against_brotherhood:0 "Оборона від Братства"
MCA_defend_against_brotherhood_desc:0 "Ми стоїмо на краю прірви. Братство Сталі у своїй пихатості хоче замінити вашу свободу й безпеку під Анклавом на тиранію й гніт. Нехай ідуть! Хвиля за хвилею зрадників розіб’ється об мури МакАртура! Братство Сталі програє! Хай живе Анклав! Хай живе Америка!"

MCA_canada_spy:0 "Наші очі в Канаді"
MCA_canada_spy_desc:0 "Кажуть, що Анклав є скрізь. У тому числі й у Великому 51, де агент Сігма стоїть на сторожі проти комуністів, монархістів та будь-якого іншого непотребу, що затівають ці негідники. Може, нам варто надіслати йому трохи ресурсів?"

MCA_victory_brotherhood:0 "Доля зрадників"
MCA_victory_brotherhood_desc:0 "Братство постало зі сміття, яке зрадило народ у час потреби. Добре відомо: «Той, хто, будучи громадянином США, веде війну проти них або підтримує їхніх ворогів, винен у державній зраді й підлягає смертній карі.»"

MCA_brotherhood_atrocities:0 "Підтримати ворогів Братства"
MCA_brotherhood_atrocities_desc:0 "Люди Монтани, ми – єдине, що стоїть між вами й загибеллю нашого штату. Хочете, щоб мутанти жили у ваших домах? Щоб ваших дітей забрали в культ? Щоб вашу родину заслали копати уран? Звісно ж ні. Саме тому ми тут, аби допомогти."

MCA_greatfalls:0 "Відновлення Ґрейт-Фоллз"
MCA_greatfalls_desc:0 "Розташування Ґрейт-Фоллз на річці Міссурі дає достатньо гідроелектроенергії для різноманітних індустріальних проєктів. Буревісницькі Мародери були шаленими дикунами, але навіть вони використовували її для виробництва транспорту. Як добре, що тепер вони звільнені й під нашим правлінням!"

MCA_concessions_to_first_families:0 "Інвестиції Перших Родин"
MCA_concessions_to_first_families_desc:0 "На жаль, «повстання» Джексонів знищило значну частину керівництва Міссули й залишило глибокі шрами. Якщо хочемо відновити місто – можливо, краще заохотити Перші Родини взяти участь."

MCA_power_plant:0 "Розширити дамбу"
MCA_power_plant_desc:0 "Скажіть що хочете про греблі Буревісницьких Мародерів – але вони відновили дамбу, що колись живила Ґрейт-Фоллз. За допомогою американської інженерії ми продовжимо їхню роботу!"

MCA_great_falls_university:0 "Університет Ґрейт-Фоллз"
MCA_great_falls_university_desc:0 "Хоча навчальні заклади Монтани не пережили Велику Війну, деякі старі об’єкти Маніфесту дають нам шанс почати щось нове в Ґрейт-Фоллз. Що може піти не так, якщо зібрати всіх найосвіченіших у одному місці?"

MCA_machine_shops:0 "Майстерні для біженців"
MCA_machine_shops_desc:0 "Багатьох полонених Буревісницьких Мародерів не вбивали, а змушували працювати в майстернях і обслуговувати літаки. Тепер, коли вони під нашим захистом – ми можемо дати їм обладнання й відкрити нові цехи в Ґрейт-Фоллз."

  MCA_tiki_bar:0 "Тікі-Бар Сальваторе"
  MCA_tiki_bar_desc:0 "Здається, Сальваторе хоче відкрити ще один бар, цього разу натхненний довоєнним гавайським закладом. Ідея звучить безглуздо, проте він сподівається зробити з нього осередок нового ринку в регіоні. Хто ми такі, щоби стояти на шляху поступу?"

  MCA_markham_plan:0 "План Маркгем"
  MCA_markham_plan_desc:0 "Маркгем прагне використати [653.GetName], аби принести західному краю трохи чиказької ефективності. Вона просить дозволу провести кілька майстерень, що керуватимуться алгоритмами й даними, усуваючи людські упередження. Справжній Чикаго, в мініатюрі. \n\nХто поскаржиться?"

  MCA_steeltown:0 "Сталемісто!"
  MCA_steeltown_desc:0 "Під проводом Анклаву Ґрейт-Фолс перетворився з осередку рейдерів на жвавий центр торгівлі. Ми нарекли його Сталевим Містом – не лише через гори брухту, що досі переплавляються, а й через його нову роль торговельного вузла та індустріального серця економіки §P[MCA.GetName]§!."

  MCA_horrigan_ii:0 "Наш колега"
  MCA_horrigan_ii_desc:0 "Не всі дослідження з Нафтової Платформи були втрачені. Секретар внутрішніх справ надіслав солдата, зміненого за тими ж схемами, що й Франк Горріган. Кінець близький – для ворогів Америки!"

  MCA_loot_brotherhood_stockpiles:0 "Пограбувати сховища Братства"
  MCA_loot_brotherhood_stockpiles_desc:0 "Попри те, що Секретар внутрішніх справ бажає повного обсягу знань і даних про Братство, ми могли б застосувати ці ресурси тут. Хоча це й розлютить нашого вищого начальника."

  MCA_give_to_chicago:0 "Відправити брухт до Чикаго"
  MCA_give_to_chicago_desc:0 "Секретар внутрішніх справ та наші вояки будуть вдячні за будь-яку інформацію про Братство. Чому б не поділитися?"
  MCA_give_to_chicago_tt:0 "\n§PЧикаго отримає п’ять £resources_strip|3.§!"

  MCA_recruitment_drive:0 "Приведіть мені людей, що зрівняються з моïми горами!"
  MCA_recruitment_drive_desc:0 "Щоб втілити бачення §PСекретаря внутрішніх справ§!, нам потрібні герої! Люди з імперією в серці та новою епохою в голові. Ті, хто приборкає звірячі інстинкти печери та лігва."

  MCA_shelter_from_a_storm:0 "Сховок від бурі"
  MCA_shelter_from_a_storm_desc:0 "Збочений культ Буреносців загрожує всій Пустці, зокрема й нашим громадянам у Монтані. Якщо ми прагнемо завершити Велику Справу, мусимо звільнити Ґрейт-Фолс!"

  MCA_hephaestus:0 "Вкрасти вогонь у Богів"
  MCA_hephaestus_desc:0 "Єллоустоун – осередок одного з найбільших довоєнних проєктів Poseidon Energy. Але нинішні ідеалісти й мрійники нічого з цим не роблять! Багатства Ґеї чекають – джерело енергії, що запустить індустрію Півночі."

  MCA_hephaestus_activate:0 "Прометей, прикутий"
  MCA_hephaestus_activate_desc:0 "Контролюючи Єллоустоун, Полковниця має вирішити подальшу долю проєкту Гефест. Стільки варіантів перед нею."

  MCA_plasma_reinforcements:0 "Допомога тяжким озброєнням"
  MCA_plasma_reinforcements_desc:0 "Секретар з радістю надасть більше озброєння – але за це доведеться платити. Хіба ми не готові жертвувати задля Великої Справи?"
  MCA_plasma_reinforcements_tt:0 "\n§PЧикаго отримає дві £resources_strip|2 та чотири £resources_strip|3.§!"

  MCA_energy_weapons_send_tt:0 "\n§PЧикаго отримає п’ять £resources_strip|2.§!"
  MCA_apa_send_tt:0 "\n§PЧикаго отримає п’ять £resources_strip|3.§!"

  MCA_energy_weapons_send:0 "Світло цивілізації"
  MCA_energy_weapons_send_desc:0 "Чикаго охоче надасть енергетичну зброю для підтримки нашої справи – за умови, що ми й надалі вкладатимемось у її вдосконалення."

  MCA_airforce_reinforcements:0 "Крила свободи"
  MCA_airforce_reinforcements_desc:0 "Без підтримки з Чикаго ми б ніколи не опанували небо Півночі. Яка вдячність, напевно, у жителів Пустки, що ми їх оберігаємо."

  MCA_energy_cost_5_tt:0 "§PМи надамо п’ять £resources_strip|2 Чикаго.§!"
  mca_resource_water_5_tt:0 "§PМи надамо п’ять £resources_strip|1 Чикаго.§!"
  mca_resource_circuitry_5_tt:0 "§PМи надамо п’ять £resources_strip|5 Чикаго.§!"

  MCA_lessons_of_victory:0 "Місцева самооборона"
  MCA_lessons_of_victory_desc:0 "Чикаго має свої клопоти. Чому б нам не покластись на допомогу місцевих, замість <перевіряє нотатки> просити авіацію?"

  MCA_havre_attack:0 "Звільнити Гавр"
  MCA_havre_attack_desc:0 "Народ Гавру страждає під фанатичною та несправедливою владою, що лишає їх здобиччю для рейдерів. А ще знущається з історії Америки... Ми мусимо вирушити й звільнити їх!"

  MCA_ties_to_chicago:0 "Розширити лінії PoseidoNet"
  MCA_ties_to_chicago_desc:0 "Навіщо навчати жителів Пустки, якщо можна просто посилити зв'язок із мережею Чикаго? Секретар внутрішніх справ знає все, що потрібно знати."
  MCA_research_boost_tt:0 "\n§MПосилення ліній передачі даних пришвидшить наші дослідження на 7%§!"

  MCA_refugee_assistance:0 "Уроки втікачів"
  MCA_refugee_assistance_desc:0 "Не всі, хто прибув у володіння Полковниці, – невиховані дармоїди. Дехто з них має, чому нас навчити!"

  MCA_historians_welcome:0 "Підтримати істориків"
  MCA_historians_welcome_desc:0 "Історики, що втекли до МакАртура, знайшли гідне місце у наших лавах. Можливо, настав час підтримати їх ще більше? Знання минулого нікому не зашкодило."

  MCA_lakota_auxiliaries:0 "Допоміжні сили Лакота"
  MCA_lakota_auxiliaries_desc:0 "Полковниця вважає, що їй потрібне військо, яке повністю залежатиме від неї. Чому б не звернутись до [STR.GetLeader] по допомогу? Це буде коштувати, але платимо – отримуємо."
  MCA_lakota_auxiliaries_tt:0 "\n§YЯкщо [STR.GetNameWithFlag] погодиться, ми отримаємо додаткову людську силу й §Pдослідницьку§Y підтримку.§!"

  mca_TRR_AIRSHIPS_TT:0 "\n§YЯкщо [WPG.GetNameWithFlag] погодиться, ми отримаємо дирижаблі та §Pдослідницьку§Y підтримку.§!"
  MCA_trr_airships:0 "Канадські Дирижаблі"
  MCA_trr_airships_desc:0 "Віндіпег має потужний флот дирижаблів, що пов'язують Великий Північ. Оскільки стабілізувати їхнє повстання ми не зможемо найближчим часом, можливо, варто домовитися про купівлю кількох апаратів? Вони стануть у пригоді для з'єднання наших розрізнених поселень."

  MCA_air_force_one:0 "Повітряна канцелярія"
  MCA_air_force_one_desc:0 "Ми кепкуємо з авіації за доктрини й комфортні казарми, але наше панування в небі – не для жартів."

  MCA_cas_boost:0 "Громовики"
  MCA_cas_boost_desc:0 "Анклав – завжди в меншості, але ніколи не без зброї. Нехай дикуни шепочуть ім’я нашого закляття: 'близька авіапідтримка.'"

  MCA_fighter_boost:0 "Червоні, білі й сині янголи"
  MCA_fighter_boost_desc:0 "Попри всі зусилля, Братство загрожує нашому контролю над небом. Але знаєте, в чому проблема з дирижаблями, легшими за повітря? Винищувачі, важчі за повітря."

  MCA_transports:0 "Кому дороги?"
  MCA_transports_desc:0 "Перевага нашої авіації – в об'єднанні територій Північної Співдружності у спосіб, що недоступний ні для дикунів, ні для поселень. І це дає нам змогу перекидати війська так само ефективно."

  MCA_air_force_of_montana:0 "Молмстром, відновлений!"
  MCA_air_force_of_montana_desc:0 "Молмстром служив Америці понад століття – ще з часів Другої світової. Тепер він служитиме нам знову – нагадування, що ми завжди на варті й завжди готові боронити народ Америки."

  MCA_americans_on_guard:0 "Базова підготовка"
  MCA_americans_on_guard_desc:0 "'Я – МИНУЛЕ – дух тих ВОЇНІВ, що принесли останню жертву. \nЯ – СУЧАСНІСТЬ – вчений і солдат-учень, що розвиває свої навички у науці війни та мистецтві лідерства. \nАле, понад усе, я – МАЙБУТНЄ' \n– Посібник кадета армії США, 2275 рік"

  MCA_power_armor_boost:0 "Наша друга шкіра"
  MCA_power_armor_boost_desc:0 "Силова броня змінила суть сучасної війни, і досі домінує у цій, гм, постсучасній війні. Хай Братство й пишається своєю майстерністю, їхнє головне вміння – вмирати в броні."

  MCA_fight_savages:0 "Тягар Анклаву"
  MCA_fight_savages_desc:0 "Візьми на себе тягар Анклаву – пошли найкращих, що ти виховав. Прив’яжи своїх синів до вигнання, щоб служили Пустці. Щоб чекали у важкому спорядженні серед нестабільного й дикого люду – твоїх новозахоплених мутантів, напівдемонів і напівдітей."

  MCA_bikes:0 "Брухт Мото-Банди"
  MCA_bikes_desc:0 "До війни у Дакотах існувала давня байкерська банда. Здається, називалась 'Ангели Пекла'? Можливо, через свій дивний стиль їзди. Як би там не було, уціліле спорядження добре послужить Анклаву."

  MCA_tanks_1:0 "Механізована армія"
  MCA_tanks_1_desc:0 "Одна лише силова броня не врятує Америку. Перемогу нам принесуть відвага солдата й міць механізованих підрозділів."

  MCA_patton_proud:0 "Дух Паттона"
  MCA_patton_proud_desc:0 "Паттон був одним із найвидатніших американських генералів. Провидець, що передбачив загрозу червоної чуми ще до її часу, його стратегічні погляди рівнялися лише з бронетанковими доктринами. Він би пишався нами сьогодні."

  MCA_motorized_tech:0 "Форпост Мотор-Сіті"
  MCA_motorized_tech_desc:0 "Чикаго – серце американської індустрії, але Мотор-Сіті тримає нас на ходу. Деякий імпорт зі Сходу допоможе нам триматися далі."

  MCA_more_trucks:0 "Фури – вільній пустці"
  MCA_more_trucks_desc:0 "Хоча користь танків беззаперечна, чи справді це найефективніше використання ресурсів Північної Співдружності? Замість важкої броні варто зосередитись на моторизованих частинах, які прочешуть рівнини."

  MCA_supply_system:0 "Корпус інтендантів"
  MCA_supply_system_desc:0 "Армія колись ішла на шлунку – тепер вона йде на термоядерних елементах. Але незалежно від часу – 1776 чи 2276 – інтенданти завжди тримають американського солдата в бою."

  MCA_energy_boost:0 "Спалах минулого"
  MCA_energy_boost_desc:0 "Майже кожна енергетична зброя Пустки колись належала армії США або була створена за її кресленнями. Перегляд архівів допоможе нам створити зброю, що виграла Велику Війну."

  MCA_demo_fire_team:0 "Завжди в меншості, завжди озброєні"
  MCA_demo_fire_team_desc:0 "Загроз Америці безліч. Мутанти, зрадники з Братства й мутанти-зрадники. Рейдери б’ють по лініях постачання, а комуністи – по заводах. Та американський солдат довершить справу, якщо ми дамо йому потрібне."

  MCA_power_armor_boost_2:0 "Тріумф досвіду"
  MCA_power_armor_boost_2_desc:0 "APA – перша серійна силова броня, створена після війни. Але кілька прототипів, що надихнули фінальну модель, служили Анклаву ще з ранніх часів. Коли ти вдягаєш чорну броню, ти йдеш шляхом героїв Аппалачів і ветеранів Платформи."

  MCA_vertibirds_transports:0 "У повітрі, на всі чотири сторони"
  MCA_vertibirds_transports_desc:0 "Вертиберди Анклаву дозволяють нашим пілотам летіти куди завгодно – обмеженням є лише запас пального. І накази. Які виконуються завжди."

  MCA_new_officer:0 "Хлопець із Форту Дірборн"
  MCA_new_officer_desc:0 "Чикаго прислало одного зі своїх обдарованих юнаків на допомогу – героя, що знає напам’ять настанови Столиці. Капрал трохи надто завзятий до протоколів і традицій, але зайва пара рук у Великій Справі ніколи не завадить."

  MCA_spec_ops_boost:0 "Сили Спеціальних Операцій"
  MCA_spec_ops_boost_desc:0 "Звичайний солдат Анклаву – вже грізна зброя. Але ви ж чули про загін 'Сігма'? Або 'Дельта Форс'? Звісно, чули – на радіо Анклаву! Ці жінки й чоловіки борються за Америку ще з часів Революції – і боротимуться ще п'ятсот років."

  MCA_doctrine_boost_again:0 "Уроки з Наварро"
  MCA_doctrine_boost_again_desc:0 "Війна з НКР навчила нас гіркої істини: кількість – це теж якість. Якщо ми хочемо зберегти Північну Співдружність, слід готуватися належним чином і чесно оцінити наші минулі поразки."

  MCA_tanks_for_nothing:0 "Нові 'Айронсайди'"
  MCA_tanks_for_nothing_desc:0 "Американські танки вірно служили з часів Монтеcуми й до берегів Італії. Тепер нам слід знову поставити їх на захист найвеличнішої нації на Землі."

  MCA_hammer_slammers:0 "Гармати-тарани"
  MCA_hammer_slammers_desc:0 "Анклав – це не лише люди в силовій броні. Це також герої у механізованих частинах, здатні проводити глибокі наступи крізь і поза ворожими лініями. І герої, насправді."

  MCA_rumors_of_dissent:0 "Гомін незадоволення"
  MCA_rumors_of_dissent_desc:0 "Проблема з деякими чиказькими кадрами в тому, що хоч із ними й можна мати справу, але вони нишпорять по книгах і паперах кожного, шукаючи, що ще можна забрати. Дехто вже й каже: 'Все стане краще, якщо ми від них утечемо.'"

  MCA_going_dark:0 "Виходимо з ефіру"
  MCA_going_dark_desc:0 "Жахливі новини! Схоже, рейдери атакують нашу мережу зв'язку. Здається, зв’язок із Чикаго та віддаленими гарнізонами стає неможливим..."

  MCA_purge_loyalists:0 "Терористичні інциденти!"
  MCA_purge_loyalists_desc:0 "І новини дедалі гірші! Все більше офіцерів, відданих справі, гинуть! Що нам робити?"

  MCA_the_trial_of_the_people:0 "Різанина в Місулі"
  MCA_the_trial_of_the_people_desc:0 "Напруженість між Анклавом і жителями Пустки – не рідкість. Але як упоратися з цим випадком?"

  MCA_preparing_for_the_storm:0 "Місцеві запаси"
  MCA_preparing_for_the_storm_desc:0 "Здається, дедалі більше жителів Пустки відкрито чинять опір нашій владі! Вони накопичують припаси й відмовляються платити податки інспекторам Внутрішньої Служби, що патрулюють Співдружність. Що нам робити?"

  MCA_squeeze_macarthur:0 "Захистити американські ресурси"
  MCA_squeeze_macarthur_desc:0 "Навіщо мешканцям МакАртура їхня надмірна вода, ліс і харчі? Суворі часи тут необхідні для завершення відбудови Чикаго."

  MCA_purge_native_advisors:0 "Чистка місцевих радників і симпатиків"
  MCA_purge_native_advisors_desc:0 "Чи потрібні нам місцеві з їхніми упередженнями, вадами й потворами, щоби радити щодо норм виробітку? Очевидно, ні. Ми впораємось самі."

  MCA_closing_ranks:0 "Змикання рядів"
  MCA_closing_ranks_desc:0 "Допускати, гм, *мутантів* до служби в Анклаві – може й допустимо на прикордонні, але саме така єресь і втягнула МакАртура в халепу. Відтепер служити зможуть лише справжні американці. А ми, звісно, знаємо, хто вони."
  MCA_closing_ranks_tt:0 "Якщо ваш закон §YРекрутинг Іззовні§! вже встановлено на 'Останні Американці', ви отримаєте політичну владу."

  MCA_soup_kitchen:0 "Сполучені Штати – не благодійна їдальня"
  MCA_soup_kitchen_desc:0 "Занадто довго жителі Монтани покладались на державу. Настав час цим людям, багатим і процвітаючим, віддячити Чикаго за все, що ми для них зробили."

  MCA_spare_parts:0 "Запитати запчастини"
  MCA_spare_parts_desc:0 "Через технічні негаразди частина наших вертибердів вийшла з ладу. Деякі – буквально. Чи не могли б ви надіслати трохи запчастин?"

  MCA_last_shipments:0 "Останні підкріплення"
  MCA_last_shipments_desc:0 "Щоб впоратись із дедалі більшим неспокоєм, Група Жовтень запросила додаткове спорядження з Чикаго. Сподіваємось, його вистачить..."

  MCA_remember_fallen_heroes:0 "Віддати шану полеглим героям!"
  MCA_remember_fallen_heroes_desc:0 "Хоча чимало хто вважає [COM.GetLeader] потворою, що загрожує Пустці, ми мусимо визнати зусилля цього нещасного виродка тримати грязних хузерів у покорі. Тож допоможімо цій добрій душі – у боротьбі за Америку, до якої його вже не пускають!"
  MCA_remember_fallen_heroes_tt:0 "§M[COM.GetNameWithFlag]§! отримає тисячу одиниць зброї."

  MCA_te_festering_rot:0 "Гниюча гниль"
  MCA_te_festering_rot_desc:0 "Гнилочисти зазнали поразки, і ми мусимо тужити. Хоч вони й мутанти, їхня спроба очистити Пустку від гуль заслуговує на почесне місце за нашим столом. Можливо, когось із них варто долучити до Групи Жовтень?"

  MCA_pay_for_reconstruction:0 "Відбудувати Гавр"
  MCA_pay_for_reconstruction_desc:0 "Щоб повною мірою скористатися Гавром, його потрібно відновити до довоєнного стану. Тобто до нашої війни за це місто, а не до Великої війни. Давайте будемо реалістами: ми не можемо зробити все."

  MCA_havre_cored:0 "Потребує ремонту"
  MCA_havre_cored_desc:0 "Подивіться на Гавр. Там, де була руїна й занепад – тепер панує прогрес. Там, де панував гніт – тепер гарне управління. \n\nСвобода? Ну, згодом. Можливо."

  MCA_liberate_rotpurgers:0 "Порятунок Спокену"
  MCA_liberate_rotpurgers_desc:0 "Нарешті, загрозу з боку гулів усунуто, і ми визволили землі Гнилочистів. Це одне з небагатьох місць, де нас вітають як визволителів – знак розсудливості. Дехто навіть вважає, що через свою ізоляцію вони менш мутовані, ніж решта Пустки!"

  MCA_fueling_stations_attacked:0 "Земля свободи"
  MCA_fueling_stations_attacked_desc:0 "Потрібно вжити заходів щодо нападів на заправки! Це жахливо – ми втрачаємо весь зв’язок із підкріпленням і підтримкою з Чикаго!"

  MCA_chicago_colony_gone:0 "Усі переваги, які ми отримуємо від підтримки §PСекретаря внутрішніх справ§!, зникнуть. Хоча ми також не зможемо надалі постачати їм вирішальні ресурси для їхньої війни."

  MCA_emergy_shipments:0 "Надзвичайні поставки"
  MCA_emergy_shipments_desc:0 "З огляду на загострення ситуації, Департамент внутрішніх справ надсилає додаткову допомогу. Це – заради блага Монтани, Полковнице."
  MCA_emergy_shipments_tt:0 "\n§PЧикаго отримає п’ять £resources_strip|3§!"

  MCA_consolidate_our_rule:0 "Підкріплення в останню чергу"
  MCA_consolidate_our_rule_desc:0 "Ситуація в Монтані виходить з-під контролю, Полковнице. Ми надсилаємо ще кількох людей для допомоги... і наглядом за... ну, за потенційними провокаторами."
  MCA_consolidate_our_rule_tt:0 "Дві §YДивізії Швидкого Реагування§! будуть направлені в §Y[656.GetName]§!."

  MCA_the_long_night:0 "Довга ніч"
  MCA_the_long_night_desc:0 "Полковнице, ми отримуємо дивні звіти – здається, з Чикаго до вас вирушив загін..."

  MCA_new_orders:0 "Очікування нових наказів"
  MCA_new_orders_desc:0 "Настав час, аби Монтана заплатила свою частку. І виконала перше з трьох завдань Чикаго."

  MCA_go_west:0 "Очищення Вашингтону"
  MCA_go_west_desc:0 "Як так сталося, що на американській землі з'явилось ще одне Братство? Ну, скоро їх стане на одне менше."

  MCA_campaign_tt:0 "\nЦе відкриває кампанію на виконання директив Анклаву. Однак ви можете обрати лише одну за раз!"

  MCA_journey_northstar:0 "Подорож до північної зорі"
  MCA_journey_northstar_desc:0 "Убивати комуністів-мутантів – мабуть, найбільша мрія кожного офіцера Анклаву. Яке щастя, що ми можемо це здійснити!"

  MCA_dakotas:0 "Прокляті Дакоти"
  MCA_dakotas_desc:0 "Більшість Дакот лежать у занепаді, заселені мутантами, які марнують їхні багатства. Ми мусимо повернути їх народу Америки!"

  MCA_faithful_proxy:0 "Наші вірні довірені"
  MCA_faithful_proxy_desc:0 "Попри те, що [ROT.GetLeader] – мутант, його ненависть до інших мутантів заслуговує на похвалу. Можливо, варто підтримати їхній хрестовий похід, відклавши очищення Спокена й Кер-д’Алена на пізніше. Життя наших солдатів занадто цінне, щоб марнувати його."

  MCA_save_spokane:0 "Рушити на Вашингтон"
  MCA_save_spokane_desc:0 "Занадто довго одне з найбільших міст Вашингтону було осквернене мутантами. Ми повинні діяти швидко, щоб врятувати землю й ресурси від цих потвор."

  MCA_washington_attachk:0 "Від моря до світлого моря"
  MCA_washington_attachk_desc:0 "Поки герої Рейвен-Рок борються з ворогами Америки на сході, ми визволяємо інший Вашингтон – від чергового Братства. Але що нам ще одна тарганяча тінь під ногами?"

  MCA_purged_brotherhood:0 "Спадкоємці Бенедикта Арнольда"
  MCA_purged_brotherhood_desc:0 "Два Братства знищено... стоп, скільки ще залишилось? Чорт забирай, подайте мій плазмовий гвинтівку."

  MCA_port_maw:0 "Тихоокеанське командування"
  MCA_port_maw_desc:0 "Контроль над Сієтлом – гарний початок, але для безпеки наших кордонів треба піти далі й очистити від піратів узбережжя. Лише тоді доступ до Тихого океану буде забезпечено."

  MCA_washington_proud:0 "Гордість Вашингтону"
  MCA_washington_proud_desc:0 "Ми зробили це, нарешті! Виконали наказ Чикаго й захопили Північно-Західний Тихоокеанський регіон. Тепер час створити окупаційний режим для впорядкованого очищення генетичного матеріалу Каскадії."

  MCA_stampede:0 "Полювання на стадо"
  MCA_stampede_desc:0 "Альбертські прерії контролюють фермерські родини. Їхні стада будуть куди ефективнішими під нашим керівництвом."

  MCA_horsepower_mine:0 "Кінна сила – в шахту"
  MCA_horsepower_mine_desc:0 "Канадці – дика зграя мутантів, і їхній бойовий дух ускладнює експлуатацію їхніх земель. Переселення частини з них до МакАртура полегшить справу."

  MCA_clear_out_nordikon:0 "Очистити Калгарі"
  MCA_clear_out_nordikon_desc:0 "З тих пір, як Міддлмарк востаннє був в центрі уваги американців, він втратив свою значущість. Вони почали наймати будь-кого з вулиці, включаючи звичайну наволоч, відому як «Неправильні». Якщо ми хочемо чогось досягти з ними, ми мусимо позбутися цих «людей», якщо доведеться — силою."

  MCA_commies:0 "Доля канадських комуністів"
  MCA_commies_desc:0 "Світ тримається на балансі. Як інакше пояснити, що Анклав боровся роками, а канадський опір розцвів за двісті років? Настав час урятувати Америку!\n\nЗнову!"
  MCA_commies_tt:0 "Ви отримаєте воєнні цілі проти комуністів. Гуль, що пародіює велич Америки, також буде усунений – але якщо §Y[COM.GetNameWithFlag]§! домовився з нами, можливо, вдасться укласти угоду."

  MCA_winter_war_lessons:0 "Уроки Зимової війни"
  MCA_winter_war_lessons_desc:0 "Як Джордж Вашингтон витримав лихоліття Веллі-Фордж, так і ми вистояли в окупованій Альберті."

  MCA_call_of_duty:0 "Поклик обов'язку"
  MCA_call_of_duty_desc:0 "Захоплення Дакот принесе чимало вигод – зокрема, відкриє можливість прямого зв’язку з Чикаго."

  MCA_enclave_standing_rock:0 "Пам’ятай Біггорн!"
  MCA_enclave_standing_rock_desc:0 "Стоунінг-Рок мав певну користь, але зрештою лакота й сіу завжди були скалкою в боці уряду США. Треба готуватись."

  MCA_standing_rock_wargoal:0 "Не залишити каменя на камені"
  MCA_standing_rock_wargoal_desc:0 "Анклав не забуває жодної образи, завданої американцю."

  MCA_give_secretary:0 "Подарунок від секретаря"
  MCA_give_secretary_desc:0 "Для об’єднання Півночі Секретар надіслав додаткові вертиберди!"

  MCA_americas_finest:0 "Найкращі солдати Америки"
  MCA_americas_finest_desc:0 "Ніхто не стане заперечувати: нас менше, ніж потвор, що псують Америку. Але коли з нами американська вогнева міць – кількість значення не має!"

  MCA_favor_tt:0 "§gВи повинні завершити одну кампанію, щоб здобути прихильність Секретаря.§!"

  MCA_local_power_armor_production:0 "Місцеве виробництво силової броні"
  MCA_local_power_armor_production_desc:0 "Ми ніколи не досягнемо майстерності наших наставників у Чикаго, але за їхньої підтримки ми можемо налагодити місцеве виробництво передової силової броні, використовуючи реквізовану працю."

  MCA_eagles_wings:0 "Крила орла"
  MCA_eagles_wings_desc:0 "Успіх Анклаву значною мірою залежить від нашої здатності очищати небо від зрадників і комуністів. Ми мусимо подвоїти ці зусилля, пам’ятаючи: це не війна – це дератизація."

  MCA_vertibird_research:0 "Повітряне командування північного заходу"
  MCA_vertibird_research_desc:0 "Завдяки підтримці Чикаго ми стали справжнім форпостом Анклаву на Північному Заході. Контроль над повітрям дозволить нам знищити будь-які 'організовані' поселення покидьків Пустки."

  MCA_mount_rushmore_secrets:0 "Ви – не мої праотці"
  MCA_mount_rushmore_secrets_desc:0 "Гора Рашмор побита й пошарпана, та вона досі зберігає таємниці. Ми маємо розчавити ідолопоклонників, що вдають із себе шанувальників, і привласнити її."

  MCA_creek:0 "Резервація Крік"
  MCA_creek_desc:0 "Плем’я Крік... ну, воно стоїть у нас на шляху. І це не вперше Америка стикається з індіанцями, що створюють подібні перешкоди."

  MCA_reservation_system:0 "Система резервацій"
  MCA_reservation_system_desc:0 "Анклав – законний спадкоємець уряду США, тож має чимало зразків для наслідування. У цьому випадку ми можемо згадати, як Америка колись приборкала Захід – і застосувати цей досвід на наших мутантах-підданих."

  MCA_frontier_economy:0 "Прикордонна "
  MCA_frontier_economy_desc:0 "Мешканцям Монтани та Півночі не потрібно зосереджуватись на промисловості чи вищій освіті. Шахти – це саме те, що їм потрібно!"

  MCA_american_blood:0 "Чоловіки середнього заходу"
  MCA_american_blood_desc:0 "Щоб забезпечити контроль над регіоном, Секретар внутрішніх справ люб’язно надіслав нам додаткові війська."

  MCA_energy_weapons:0 "Вогнева міць для вогняного народу"
  MCA_energy_weapons_desc:0 "Щоб підкорити неприборканих, бунтівних мешканців Скелястих Гір, нам потрібна зброя. Багато зброї."

  MCA_energy_research:0 "Майже найкраще"
  MCA_energy_research_desc:0 "У нас немає найкращої зброї Анклаву, але вона нам і не потрібна – на відміну від героїчних старших офіцерів у Столиці й Чикаго. Для цих дикунів вистачить і того, що маємо."

  MCA_upgrade_uplinkes:0 "Оновити канали передачі"
  MCA_upgrade_uplinkes_desc:0 "Кому потрібна місцева система освіти, якщо ми можемо транслювати найкращі знання прямо з Чикаго?"

  MCA_american_soil:0 "Американська земля – для американських цілей"
  MCA_american_soil_desc:0 "Без наївного ідеалізму Полковниці ми можемо повноцінно розвивати ресурси цього регіону. Під ранчо Перших Родин ховається чимало цінностей."

  MCA_american_hearts:0 "Американські серця керують американськими думками"
  MCA_american_hearts_desc:0 "Ми почали переселяти ветеранів із Чикаго, конфісковуючи землі Перших Родин для справжніх американців. Під їхньою владою ми приручимо цю дику землю – таку безмежну, що в ній нарешті можна дихати на повні груди."

  MCA_nordikon_victory:0 "Зустріч на півдорозі"
  MCA_nordikon_victory_desc:0 "Тепер, коли «Неправильні» остаточно знищені, ми можемо розпочати впровадження машин Міддлмарк на всій території Монтани. Ми подбаємо про те, щоб народ усвідомив: наше слово — це закон."

  MCA_declaration_of_independence:0 "Друге народження свободи"
  MCA_declaration_of_independence_desc:0 "Ми, представники Північної Співдружності, в імені й за дорученням добрих людей нашого краю, урочисто проголошуємо: американці завжди залишатимуться вільним народом, що не схиляється перед тиранією. І на підтримку цієї декларації ми віддаємо наші життя, наші статки і нашу святу честь."

  MCA_fate_of_workers:0 "Роль біженців"
  MCA_fate_of_workers_desc:0 "Однією з проблем нового режиму є становище біженців. Вони є цінним джерелом праці для Перших Родин, але тепер вимагають перегляду контрактів, які, за їхніми словами, є нічим іншим, як рабством. Що ми робитимемо?"

  MCA_steeltown_scraps:0 "Залишки Сталевого Міста"
  MCA_steeltown_scraps_desc:0 "Попри всі негаразди, Сталемісто залишається серцем Монтани. Хай благословить Бог Групу Жовтень і Возз'єднані Штати!"

  MCA_better_future:0 "Краще майбутнє для кращої нації"
  MCA_better_future_desc:0 "За всіма проблемами Америки – де ще, окрім цієї великої нації (або, можливо, Ріо-Ґранде), жінка з фермерського селища може стати провідником народу? Там, де інші використовують науку для воєнних машин, ми використаємо її для миру."

  MCA_silicon_jumpstart:0 "Кремнієвий стрибок"
  MCA_silicon_jumpstart_desc:0 "Музей у Бозмені таки виявився корисним. Це не просто місце для розбирання, а й осередок для відновлення старого ладу."

  MCA_cash_baby:0 "Наша власна валюта"
  MCA_cash_baby_desc:0 "Недостатньо просто покладатись на кришки. Потрібна валюта, що надихне наш народ. Нам потрібен символ нації."

  MCA_second_amendment:0 "Ввічливе суспільство"
  MCA_second_amendment_desc:0 "Поки армія НКР кепкує про своє право носити ведмедя, народ Монтани завжди мав рушницю під рукою. Грубо? Можливо. Але саме тому ми більше не приймаємо наказів з Чикаго."

  MCA_frontier_weaponsmiths:0 "Право носити зброю"
  MCA_frontier_weaponsmiths_desc:0 "Дехто каже, що Техаська Автономна Адміністрація – найозброєніше місце в Пустці. Та ці люди просто ніколи не були в Монтані. На Останньому Кордоні кращі традиції Америки породжують нове народження свободи."

  MCA_efficiency_growth:0 "Прихильники Анклаву"
  MCA_efficiency_growth_desc:0 "На наш подив, дехто з техніків із Чикаго вирішив залишитись на Заході. Кажуть, пошук пари менш стресовий, коли алгоритм не визначає генетичну сумісність. Смішно, правда?"

  MCA_the_army_of_the_free:0 "Ми це оборонятимемо"
  MCA_the_army_of_the_free_desc:0 "Без допомоги Анклаву з Чикаго народу Півночі доведеться самотужки боронити свої домівки. Та керувати військом – складніше, ніж здається."

  MCA_raider_scourge:0 "Честь не вмирає"
  MCA_raider_scourge_desc:0 "Її звуть Остання Варта – одна з найнебезпечніших ворогів Анклаву на Сході. Вона знищила кілька бойових машин і перервала постачання кави Costa. Коли Група Жовтень знищила головний бункер, вона пішла в гори й стала рейдеркою заради обов’язку, відваги й вірності. Але зрадник виказав її [MCA.GetLeader], і тепер ми вирішуємо її долю."

  MCA_metal_mouths:0 "Втихомирити Металеву Пащу"
  MCA_metal_mouths_desc:0 "Занадто довго Металеві Пащі грабували ферми, ранчо й каравани. Час покласти цьому край заради безпечного суспільства."

  MCA_met_attack:0 "Недобитки"
  MCA_met_attack_desc:0 "Ці рейдери не знають – у нас теж є металеві роти."

  MCA_snow:0 "Безпечніше нікуди"
  MCA_snow_desc:0 "Від Варти Білих ніколи не було нічого доброго. А якщо Безпечна Пристань їх укриває... Ми розберемось. Якось."

  MCA_khans:0 "Останні Хани"
  MCA_khans_desc:0 "Хани мають історію, що сягає століття. Але це – історія, якою не варто пишатись. Пора врятувати Америку від цієї ганьби."

  MCA_raiders:0 "Піклування про народ"
  MCA_raiders_desc:0 "У Монтані досі лишилися рейдери, що загрожують громадському добробуту. Пора покінчити з ними – раз і назавжди!"

  MCA_lakota_oppress:0 "Зупинити сіу!"
  MCA_lakota_oppress_desc:0 "Занадто довго лакота й інші народи сіу гнобили своїх сусідів. Вимагали данину, рабів – усе, що люди мають найдорожчого. Прийшов час народу Америки дати відсіч тиранії."

  MCA_free_slaves_fate:0 "Бо ми померли, щоб люди були вільні"
  MCA_free_slaves_fate_desc:0 "Після знищення рейдерів і племен, що загрожували добрим людям Півночі, постає нове питання – що робити з натовпами визволених, які жадають вдихнути повітря свободи?"

  MCA_drugs_raider:0 "Оперативна група з боротьби з наркотиками"
  MCA_drugs_raider_desc:0 "На щастя, на Півночі виробляється небагато наркотиків – переважно самогон. Але після знищення рейдерів і Лакота ми можемо завдати удару по шляхах, якими йдуть поставки Джету на Схід. І, звісно, трохи залишити собі."

  MCA_advanced_support:0 "Ми принесемо салют"
  MCA_advanced_support_desc:0 "Попри всі труднощі, Група Жовтень лишається вірною гордій традиції Анклаву – ми завжди, і назавжди, приносимо гарну зброю."

  MCA_advanced_officers:0 "Залучити лоялістів" 
  MCA_advanced_officers_desc:0 "Хоча багато офіцерів Анклаву спершу тримались осторонь, зі зміцненням Співдружності дедалі більше з них готові працювати з нами. Дякувати Богу."

  MCA_my_little_friend:0 "Мій не такий уже й маленький друг"
  MCA_my_little_friend_desc:0 "Ми, можливо, не зможемо так вільно використовувати плазмову зброю без Чикаго, але є й інші можливості..."

  MCA_building_boom:0 "Але не всі старі шляхи"
  MCA_building_boom_desc:0 "Слід визнати: наші пращури теж помилялись. Вони оступались – і ми оступимось. Та давайте вчитись у довоєнного світу й у нашого власного досвіду виживання."

  MCA_new_ways_thinking:0 "Відновлення стабільності"
  MCA_new_ways_thinking_desc:0 "Хоч це й далося нелегко, ми навели лад на Півночі. Нарешті, люди знову довіряють уряду й дивляться в майбутнє."

  MCA_four_freedoms:0 "Чотири свободи"
  MCA_four_freedoms_desc:0 "Попри всі розбіжності, нас об'єднують цілі – земля, де кожна людина має свободу слова, свободу віросповідання, свободу від страху і свободу від нестачі. Це – найвищі прагнення кожного американця."

  MCA_welcome_home:0 "Ласкаво просимо до справедливої Колумбії"
  MCA_welcome_home_desc:0 "На тлі загроз Північного Заходу навіть праця на фермі Першої Родини виглядає як ідеальний варіант. Можливо, варто замислитись над системою на кшталт тієї, що у Місті-Сховищі? Але це рішення – не на сьогодні."

  MCA_importance_of_school:0 "Шкільна система"
  MCA_importance_of_school_desc:0 "Анклав доводить: той, хто не ходив до школи, може обікрасти товарняк. А з університетською освітою – цілу залізницю. Попри це, до нас прибуває чимало людей, яким надто тісно в нетерпимості як Братства Середнього Заходу, так і чиказького Анклаву."

  MCA_best_of_world:0 "Гнучкість свободи"
  MCA_best_of_world_desc:0 "Проблема Анклаву? Він дивиться лише назад. А ми на Півночі можемо озирнутись навколо. І ця здатність – наше найбільше багатство."

  MCA_stealing_from_the_gods:0 "Уроки від самозваних Богів"
  MCA_stealing_from_the_gods_desc:0 "Ми ніколи не зможемо виготовити APA без підтримки Чикаго. Але, можливо, створимо щось своє. І справді, чи підходить APA для Скелястих Гір?"

  MCA_do_it_myself:0 "Останній наказ"
  MCA_do_it_myself_desc:0 "Перші Родини вірили, що зможуть захистити Північ без серця американської імперії. Чикаго вважав народ Півночі підлюдьми, ресурсом для використання. Та як обидві сторони забули про жінку, що з хаосу Скель зробила маленький рай?"

  MCA_golden_mean:0 "Золота середина"
  MCA_golden_mean_desc:0 "Навіть Засновники знали: занадто багато демократії веде до варварства. Але й надмір чиказького свавілля неприйнятний для простих людей Півночі. Лише Полковниця здатна провести регіон до миру й достатку."

  MCA_outposts_retirement:0 "Гранти для ветеранів"
  MCA_outposts_retirement_desc:0 "Не кожен солдат на пенсії хоче жити в місті чи колонії Чикаго. Оселення їх тут допоможе нам пустити коріння на цій священній землі."
  MCA_outposts_retirement_tt:0 "Отримати контроль над землями §Y[ROS.GetNameWithFlag]§! і §Y[HVR.GetNameWithFlag]§!."

  MCA_pacific_proxy:0 "Справжній американський талісман"
  MCA_pacific_proxy_desc:0 "Протягом століть, §CКорпорація Мідлмарк§!(c) залишалася вірною американській державі ще з довоєнних часів. Хоча раніше нам не вдавалося зв’язатися з ними, зараз настав ідеальний момент, щоб привернути їхню увагу та стягнути заборгованість з податків. Принаймні, доки ці «Неправильні» не з’являться."
  MCA_pacific_proxy2:0 "Повернення Великого 51"
  MCA_pacific_proxy2_desc:0 "Тепер, коли Пенні під нашим контролем, ми маємо ідеальний актив, щоб розпочати операції з очищення Канади та повернення її під контроль Америки."

  MCA_khans_kill:0 "Я це не серйозно, я пас"
  MCA_khans_kill_desc:0 "Вибачте, але Хани? У Вайомінгу? Це настільки дурно, що мені байдуже – шпигуни вони китайські чи монгольські повстанці. Я просто хочу, щоб вони здохли."

  mca_SNO:0 "Снігові дні скасовано"
  mca_SNO_desc:0 "На жаль, ми не готові до цих сніговиків, що загрожують нашому шляху до Великого 51. Але скоро. Дуже скоро."

  MCA_colonels_victory:0 "Тріумф Полковниці"
  MCA_colonels_victory_desc:0 "Хтось каже, що Анклав – це лише фанатики. Але як тоді пояснити Полковницю, яка відкинула радикальний егалітаризм і крайнощі Чикаго? Настав час оцінити її шлях і подумати над спадком, що вона залишає."

  MCA_transport_vertibird_tech:0 "На крилах"
  MCA_transport_vertibird_tech_desc:0 "У нас поки що немає можливості виготовляти власні, тож доки Секретар не визнає нас гідними – мусимо задовольнятись черговою партією вертибердів із Чикаго."

  MCA_chicago_industrial_extractions_arms:0 "Ч.В.І.К.В.Р."
  MCA_chicago_industrial_extractions_arms_desc:0 "Наш славетний Секретар був достатньо щедрим, аби надати нам підтримку з Чикаго – зокрема через створення Чиказького Військово-Індустріального Комплексу Вилучення Ресурсів. Принаймні це – бар'єр від усіх потенційних негідників."
  MCA_chicago_industrial_extractions_arms_tt:0 "\n§PЧикаго отримає п’ять £resources_strip|3 .§!"

  MCA_chicago_industrial_extractions_tt:0 "\n§PЧикаго отримає п’ять £resources_strip|5.§!"

  MCA_rio:0 "Південь від кордону"
  MCA_rio_desc:0 "Канали PoseidoNet перехоплюють сигнали з-за Ріо-Ґранде. Схоже, Братство було не єдиною залишеною фракцією армії США..."
  MCA_rio_tt_trigger:0 "Ми не дуже прагнемо працювати з мексиканськими націоналістами або ще одним богом-комп’ютером, дякуємо."

  MCA_TAA:0 "Якщо Тод Гаубіц керує ТАЗ, ми можемо вдягнути броню для останнього завдання."

  #MCA_stampedeii:0 "Taking Stock in Spokane"
  #MCA_stampedeii_desc:0 "Kind of gross, that these guys are up to such no good. Although Chicago's request that we pursue the Pacific Coast seems premature, maybe we can try anyway?"
  #MCA_nit:0 "Trial of American Tears"
  #MCA_nit_desc:0 "Long ago, the Niitsitapi wronged the US Government, after it graciously gave them money, supplies, and other necessities and luxuries, yet the natives rejected them, instead opting for raiding and pillaging innocent Americans. It's been a long time coming, but we'll deal with them once and for all."
  #MCA_met:0 "Metal Mnemonics"
  #MCA_met_desc:0 "Once upon a time, the town of Billings was offset by a group of raiders with advanced cybernetics. Most were easily taken out by our detachment there, still stationed there since the Heaven's Gate debacle, but they have since grown in strength and threatened to return. Let's take them out. Permanently."
  #MCA_give_advisor:0 "Tesla's Lessons"
  #MCA_give_advisor_desc:0 "Nikola Tesla was perhaps a decent man, although his work is lived on by his genericized language, such as our Tesla Armor, Tesla weapons, and Tesla Coils, as opposed to the man himself. With this, we can take another step forward into the future, even if it's still many steps behind Chicago."

MCA_call_from_secretary:0 "Дзвінок з батьківщини"
MCA_call_from_secretary_desc:0 "У межах нової кампанії зі зміцнення бойового духу на територіях Анклаву (а швидше – з метою контролю), Секретар вирішив публічно поспілкуватись із Полковницею. Це навряд чи принесе йому прихильність тут, бо більшість – це марнослів’я, та все ж Полковниця тимчасово здобуває вплив серед оточення."

MCA_brotherhood_attack:0 "Остання наруга над Монтаною"
MCA_brotherhood_attack_desc:0 "Ми зробили все, що могли, аби підготуватись до нападу Братства. Це не ті, що билися в Наварро, і не ті, що б’ються в Чикаго – але, побивши їх, ми надішлемо послання, яке надовго запам’ятають і Братство, і Анклав."

MCA_more_air_aid:0 "Більше повітряної підтримки"
MCA_more_air_aid_desc:0 "Ми настільки зосередились на повітрі й аерокосміці, що забули: у літаках і вертибердах мають сидіти люди. На щастя, ми можемо запросити кількох недоумків із крила – хай або згорять у небі, або доки не знайдемо кращих."

MCA_shield_of_humanity:0 "Щит людства"
MCA_shield_of_humanity_desc:0 "З XXI століття Анклав мав одну місію – зібрати найвидатніші уми, які будь-коли жили на американській землі, аби вдосконалити демократію, ідеали й саму американську Ідею. З 2141 року, за правління Річардсонів, це завдання трохи змінилось, бо світ 2076-го вже не відповідав світу 2276-го. На суші, морі чи в небі – Анклав завжди буде поруч. Під світлом факела Леді Свободи Америка проживе ще одну ніч."

## Events – Позиція Ґрейт-Фолс на річці Міссурі

nf_mca.1.t:0 "Остання велика американська династія"
nf_mca.1.d:0 "Більшість жителів Пустки знають, що Америка зазнала фатального удару в 2077 році, коли її армії й народ згоріли у ядерному вогні. Але мало хто знає історію людей, які зберігали цю мрію у темряві, що настала. Річардсони служили Америці після Великої Війни, зберігаючи її ідею й захищаючи громадян – навіть якщо ті цього не знали. Це був анклав найкращих і найрозумніших, які тримали смолоскип свободи доти, доки він не спалахне знову. Вони майже досягли мети. Останній Річардсон мав план, як урятувати Пустку: зброя, здатна знищити супер-мутантів, здичавілих гуль і небезпечних мутантів, що стримували відновлення... допоки все не зруйнувалось.\n\nНіхто не знає, що сталось із Платформою. Рейд Братства Сталі? Залишки Єдності? А може Рейнджери Пустелі, які прикривали свою ненависть до Америки солодкими словами про свободу. НКР точно не мала проблем із тим, щоби сунути на північ із племенами, паладинами Братства та іншими за спиною. Анклав убив багатьох, але мусив відступити. Коли ланцюг командування впав, Полковниця Еллен Сантьяго взяла командування на кілька годин – і почала відхід на схід.\n\nВшануймо її – і її спробу врятувати Америку на Заході."
nf_mca.1.a:0 "Вона евакуювала стільки мирних, скільки змогла..."
nf_mca.1.b:0 "... але розуміла, що зброя краще допоможе тим, хто виживе."

nf_mca.2.t:0 "Люди, гідні цих гір"
nf_mca.2.d:0 "Коли Анклав утік із Західного узбережжя після падіння Наварро, дехто продовжував боротися. Патріоти, які не зреклися Америки, вирушили на схід — на гвинтокрилах, вантажівках чи навіть пішки, якщо доводилося. Грім запеклих перестрілок відлунював Великими Рівнинами, поки вони пробивалися крізь деспотизм Братства, щоб дістатися Чикаго. Але Сантьяго та ті, хто пішов за нею після того, як вона склала своє тимчасове командування? В ім'я ведення «ар'єргардних боїв» вони завершили свій похід на авіабазі Мак-Артур, чудово усвідомлюючи, що місце, де вони тримали варту, було кордоном Сполучених Штатів Америки. За підтримки міністра внутрішніх справ вони виступали як західний фланг Анклаву. Не стало ні Президента, ні Наварро, ні Нафтової вишки; натомість з'явилася земля, ледь зачеплена радіацією, яка стала домом для щасливих, здорових дітей. Земля, де старі солдати не помирають — вони просто згасають.\n\nАдже в цьому регіоні сталося дещо дивне. Щоб вижити, Мак-Артур почав торгувати з навколишніми містами та ранчо. Оскільки слідом за торгівлею налагоджувалися й стосунки, солдати перетворювалися на ранчерів, а медики — на лікарів. Коли Міссула попросила про допомогу проти рейдерів-Шторммонгерів, які спалили Лінкольн у 2268 році, вона захищала своїх ветеранів у відставці так само, як і жителів міста."
nf_mca.2.a:0 "Ранчо Міссули тепер годують склад."
nf_mca.2.b:0 "А полонених вона направила в шахти на вугілля."

nf_mca.3.t:0 "Перші Родини"
nf_mca.3.d:0 "Міссула була дивним містом як для Пустки. Місто мало гарні, незабруднені сільськогосподарські угіддя, стада здорових бізонів та ліси для заготівлі деревини неподалік. Ніхто не голодував. Але в кожному суспільстві хтось є більш рівним за інших, і Міссула не була винятком. Перші Родини, які походили від шукачів брухту, що повернулися після Війни, контролювали найкращі землі, найкращі ліси та найкращі шахти. Загін полковника Сантьяго лише посилив цей поділ, адже хто, окрім багатіїв, міг дозволити собі послуги Інженерного корпусу армії? Щобільше, підвищений уровень безпеки, який принесла Сантьяго, перетворив регіон на магніт для біженців, що тікали від Шторммонгерів та Залізноротих. Щасливчики знаходили роботу на потогонних фабриках або фермах. А невдахи? Що ж, зима наставала щороку.\n\nОдним із більш зважених рішень Сантьяго було використання допоміжних військ, навчених за допомогою місцевого спорядження. Дехто виступав за залучення сил із Перших Родин, але інші радили врахувати, що біженці будуть вірними будь-кому, хто запропонує їм краще життя."
nf_mca.3.a:0 "Перші Родини – надійні."
nf_mca.3.b:0 "Хіба ми самі не були біженцями?"

nf_mca.4.t:0 "Наклеп, брехня і зрада!"
nf_mca.4.d:0 "Засновники Братства були дезертирами й зрадниками, які покинули Найвеличнішу Націю на Землі у її найтемнішу годину. Двісті років по тому змінилося небагато. \n\nТепер же відділення Братства в Монтані поширює наклепи й брехню про зусилля Анклаву з порятунку Америки. Їхні паладини кажуть біженцям і звичайним, працьовитим громадянам, що наші спроби виправити мутації людства – це «геноцид», вигадують казочки про план знищення всіх людей. Це ниций наклеп! Ми – уряд! Ми тут, аби допомогти! Та, на жаль, деяких дурнів ці брехні вже збили з пантелику."
nf_mca.4.a:0 "Шкода."
nf_mca.4.b:0 "Протидіяти їхній пропаганді правдою."
nf_mca.4.b_tt:0 "\n§MДоступно, бо ви запустили «Патріота Монтани».§!"

nf_mca.5.t:0 "Вони борються за свободу!"
nf_mca.5.d:0 "Хіба я не обіцяв, що Америка ще живе? Завдяки значним зусиллям Секретар внутрішніх справ надіслав Монтані доказ того, що Анклав існує! І ні, це не лише база ВПС МакАртур. Просто зараз війська Анклаву прибувають з Чикаго – сяючого серця Америки! Ці відважні чоловіки й жінки мають одне завдання – відновити американський мир і порядок. \n\nЛише пам’ятайте: коли бачите Анклав, ви бачите уряд США. Ми маємо повноваження наводити лад будь-якими засобами. Просто не заважайте – і ми зробимо свою роботу. Якщо ж перешкоджатимете місії Анклаву – матимете справу з наслідками. \n\nРазом ми відновимо славу цієї великої нації."
nf_mca.5.a:0 "Спершу – розібратися з цим."
nf_mca.5.a_tt:0 "\nЗмінює §PПідтримку Секретаря внутрішніх справ§! на §Y+5%§!. Ви також щомісяця втрачатимете додатково §Y3 енергії§! і §Y1 металу§!."

nf_mca.6.t:0 "Місія"
nf_mca.6.d:0 "Коли екран спалахнув, Полковниця знову замислилася, чому Секретар завжди з’являється ось так. Але вона не сказала нічого, поки Старий говорив. \n\n«То ти нарешті придушила повстанців, га?» – засміявся він. «Кажуть, ланцюг міцний настільки, наскільки міцна його найслабша ланка. Тож звісно, ці мутанти зламались перед американським героїзмом. Але все одно – вітаю тебе, Полковнице. Чи, може, вже – Бригадна Генерал!» \n\n«Та Братство з’явилось там не просто так. Думаю, ти розумієш, чому, адже стара боротьба в Серці Нації загострюється. Ми потребуємо тебе, Бригадире. Ми потребуємо Північну Співдружність.» \n\nТермінал поруч із нею блимнув. «На жаль, твої підопічні мають трохи більше зробити для Відбудови.» \n\nЕкран згас, неон Чикаго змінився на просте повідомлення: «Хай Благословить Бог Анклав»."
nf_mca.6.a:0 "І Хай Благословить Бог Америку."
nf_mca.6.a_tt:0 "\nЗмінює §PПідтримку Секретаря внутрішніх справ§! на §Y+5%§!. Ви також щомісяця втрачатимете §Y5 енергії§! і §Y5 металу§!."

nf_mca.7.t:0 "В армії Анклаву..."
nf_mca.7.d:0 "Ресурси Північної Співдружності можуть змінити хід війни в Серці Нації – й дати Анклаву шанс остаточно знищити Братство. Та, на жаль, справжніх американців залишилось обмаль. Вимоги [MCA.GetLeader] покладають нові жертви на всіх у [MCA.GetName], і є три пропозиції для виконання наказу Секретаря. \n\nНайпростіший шлях – звернутись до Чикаго по додаткову допомогу в обмін на пришвидшений видобуток ресурсів на Півночі. Ми також можемо працювати з Першими Родинами та місцевими елітами – хоч вони й не рівня Армії США, але зможуть сформувати додаткові батальйони. Нарешті, ми можемо відкрити рекрутинг для біженців і жителів Пустки – кожен, хто здатен тримати рушницю, має на неї право."
nf_mca.7.a:0 "Це робота для професіоналів."
nf_mca.7.b:0 "Покладемось на Родини й Маршалів."
nf_mca.7.c:0 "Кожен, хто може стріляти, отримає гвинтівку!"

nf_mca.8.t:0 "Полум’я палає під землею"
nf_mca.8.d:0 "Кажуть, світ стояв на порозі величі. А може, – на межі зарозумілості? Poseidon Energy бурили морське дно за залишками нафти, ловили сонце, щоб освітити старий Вегас, а в Єллоустоуні, колишньому парку, – вгризлись у саме ядро планети. \n\nЦілодобово, невтомно, у глибинах горіло полум’я. Проєкт «Гефест» Poseidon, кажуть, міг забезпечити енергією двадцять мільйонів осель на тисячоліття. Кажуть, він міг розв’язати Кризу Ресурсів. Або, кажуть, – запустити вулкан і другу ядерну зиму. Та люди взагалі багато що кажуть, хіба ні? Рейнджери Єллоустоуна відмовляються активувати станцію. Але інші замислюються..."
nf_mca.8.a:0 "Уявіть, що ми зробимо з такою силою!"
nf_mca.8.b:0 "Хто наважиться підкорити щось настільки святе?"
nf_mca.8.c:0 "Пустка не гідна такої технології."
nf_mca.8.e:0 "Будь ласка, не вибухай."

nf_mca.9.t:0 "Полум’я З вогняними очима"
nf_mca.9.d:0 "Нарешті наші науковці розгадали таємниці проєкту «Гефест». Та як скористатися цією потугою? \n\nЧикаго хотів би, аби ми передали енергію їм – критичний ресурс для війни проти Братства Середнього Заходу. Але Родрігес каже, що ця енергія потрібна тут, у регіоні, – для промислового розвитку. У такому разі ми й далі можемо надсилати ресурси до Чикаго, але вже як оброблені уран, вугілля й інші багатства гір. А ще є Капрал – дочка Полковниці. Марта пропонує поділитись енергією з народом. Народна влада? Новаторська ідея. Це, щонайменше, принесе нам підтримку місцевих... але точно розлютить Секретаря. Чи можемо ми ризикнути?"
nf_mca.9.a:0 "Чикаго потрібна ця енергія для боротьби з Братством!"
mca_research_tt_5:0 "\n§P+5% до Швидкості Досліджень завдяки підтримці Чикаго§!"
nf_mca.9.b:0 "Нам вона потрібна для перемоги над Братством!"
nf_mca.9.b_tt:0 "\n§PОтримано §Y25£resources_strip|2§! з проєкту «Гефест».§!"
nf_mca.9.c:0 "Ми маємо поділитись із нашими співгромадянами."
mca_research_tt_bad5:0 "\n§P-5% до Швидкості Досліджень – Чикаго згортає підтримку§!"
nf_mca.9.e:0 "Перші Родини використають цю енергію"

nf_mca.10.t:0 "Напади на каравани"
nf_mca.10.d:0 "Буревісники та Металеві Паші стали агресивнішими останнім часом – можливо, надихнулися прикладом монтанського осередку Братства. Ми мусимо вирішити, кого захищати: компанію вантажоперевезень Crow, яка пов’язує Монтану, чи віддалені фермерські угіддя? Захист караванів заручиться підтримкою Перших Родин, але водночас перетворить більше людей на біженців і послабить нашу підтримку."
nf_mca.10.a:0 "Каравани – наше життєве джерело."
nf_mca.10.b:0 "Захистити домівки!"

nf_mca.11.t:0 "Та сама історія"
nf_mca.11.d:0 "Хоча Маленьке Ріно процвітає, приносячи трохи блиску до Міссули, Сальваторе приніс із собою й проблеми. Виявляється, частина його персоналу продає обладнання Анклаву, щоб фінансувати рейдерів в обмін на джет, випивку й інші наркотики! Група Вересень отримала завдання розібратись – як Капрал Стімсон відреагує?\n\nМожливо, Сальваторе справді намагається нас обдурити, й у нас є всі підстави закопати його в Маленькому Голгофі разом з усією його бандою. Або ж ми можемо знайти компроміс – адже він має джерела, яких у нас немає."
nf_mca.11.a:0 "Після всього, що ми для нього зробили? Дайте мій плазмовий гвинтівку!"
nf_mca.11.b:0 "Не можна так поводитись із поважним дрібним підприємцем."

nf_mca.12.t:0 "З трішки допомоги від друзів"
nf_mca.12.d:0 "Секретар усміхнувся з екрана, поглядаючи на Полковницю, яка, як завжди, стояла по стійці «струнко». «Справді, Полковнице, така напружена! Заспокойтесь. Спеціальний Агент – це, гм, не жест зневаги. Навпаки! Це – найкращий солдат за десятиліття, вершина науки Анклаву! Людина, в якій ніхто не сумнівається. І, звісно, ми надішлемо з ним ще один батальйон.»\n\n«Подумайте про це як про прояв нашої довіри. Зі Спеціальним Агентом Джонсоном – це майже якби я сам був поруч із вами. Назавжди.»"
nf_mca.12.a:0 "Хай Благословить Бог Анклав."

nf_mca.13.t:0 "Небажані гості"
nf_mca.13.d:0 "Дехто ганьбить суворі методи Полковниці щодо окультурення Півночі – та її успіх незаперечний. Якби це було не так, чому ж так багато біженців тікає до Міссули та Бозмена?\n\nАле вони – проблема. МакАртур не здатен підтримувати стільки злиденних жителів Пустки. Тому біженців зупиняють на межах міст, хоча контрабандисти намагаються таємно доправити їх у залишки довоєнної Америки. Група Жовтень схопила ватажка – Мамму Коттон. Вона відмовляється припинити допомагати пустошникам, хоча наразі вони – лише тягар. Що з нею робити?"
nf_mca.13.a:0 "Закрити очі на контрабанду – не можна зраджувати своїх!"
nf_mca.13.b:0 "Відправити контрабандистку до ізолятора."

nf_mca.14.t:0 "Група Жовтень"
nf_mca.14.d:0 "Полковниця – не єдина Сантьяго в МакАртурі. Її дочка, Марта, зробила кар’єру в Анклаві. Вона могла б вибрати легку службу в Рейвен-Рок або Чикаго, але вирішила служити з матір’ю. Разом вони захищають народ Монтани – справжнє натхнення для кожного американця!\n\nДехто шепоче, що вона «опустковіла»... і навіть, що вона *мутантка*. Але якби це було правдою – хіба змогла б вона так вправно користуватись зброєю Анклаву?\n\nЇї підрозділ – Група Жовтень – боронить Пустку і займається справами, які вимагають особливого підходу: дипломатією з Першими Родинами, рейдами на Металеві Пащі, торговими місіями до Базару. А що ще їм робити?"
nf_mca.14.a:0 "Добре, що вона з нами!"

nf_mca.15.t:0 "Данина з МакАртура"
nf_mca.15.d:0 "[MCA.GetLeader], очевидно злякавшись нашої сили, надсилає нам данину – енергетичну зброю й кришки, які ми можемо використати проти Братства. І ми використаємо. Але ж вона має розуміти – цю зброю можна буде обернути й проти неї."
nf_mca.15.a:0 "Спершу Братство, потім – МакАртур."

nf_mca.16.t:0 "Запитай, що ти можеш зробити для своєї країни"
nf_mca.16.d:0 "Історія не стоїть на місці, й поки наша могутня нація наближається до 500-річчя, до МакАртура надходять нові накази. Серце Америки чекає на визволення! Братство Середнього Заходу – загроза, що тримається надто довго – може бути розбите. Але лише якщо МакАртур допоможе.\n\nТож, мій командире – що ви нам надішлете?"
nf_mca.16.a:0 "Урожай, аби нагодувати голодну націю!"
nf_mca.16.a_tt:0 "\n§gНадіслати [?temp_water_mca]£resources_strip|1 до Чикаго§!\n"
nf_mca.16.b:0 "Руди, аби кувати зброю свободи!"
nf_mca.16.b_tt:0 "\n§gНадіслати [?temp_metal_mca]£resources_strip|3 до Чикаго§!\n"
nf_mca.16.c:0 "Пальне, щоб палити двигуни індустрії!"
nf_mca.16.c_tt:0 "\n§gНадіслати [?temp_energy_mca]£resources_strip|2 до Чикаго§!\n"
nf_mca.16.e:0 "§RМи не можемо допомогти Секретарю зараз.§!"
nf_mca.16.f:0 "Чикаго Дякує Нам за Службу"
nf_mca.16.f_tt:0 "\n§PОскільки ви надіслали понад §Y25£resources_strip|1, 20 £resources_strip|2§! §Pта§! §Y20 £resources_strip|3§! – Чикаго задоволений.§!"

nf_mca.18.t:0 "Хто ти такий, що не знаєш своєї історії?"
nf_mca.18.d:0 "Історики – група вчених і викладачів – були переможені. Тепер вони прибувають до МакАртура, просячи нового дому. Їхній прихід може бути корисним; хоч ми й вміємо обслуговувати передову зброю й електроніку, простіші речі в Монтані майже не практикуються. Наприклад, їхні знання фермерства стануть у пригоді.\n\nАле чи не несуть вони загрозу? Їхнє уявлення про історію – спотворене, з жорсткою критикою довоєнної Америки. У нас, на жаль, не вистачить сил виправити всі ці помилки. Що вирішить Полковниця?"
nf_mca.18.a:0 "Справді, чим можуть зашкодити якісь історики?"
nf_mca.18.b:0 "Вилучити ресурси на потреби війни."

nf_mca.19.t:0 "Вкорінені в традиції, стійкі в дусі"
nf_mca.19.d:0 "[MCA.GetLeader] подає пропозицію: в обмін на економічну допомогу наші воїни воюватимуть за уряд США. Єдина загроза – можливість перемоги Анклаву; цілком імовірна, якщо єдиним їхнім ворогом будуть пластмасові скаути в силовій броні."
nf_mca.19.a:0 "Якщо вони дійдуть сюди – ми їх розчавимо."
nf_mca.19.b:0 "О ні, ми це вже проходили."

nf_mca.20.t:0 "Могутні воїни"
nf_mca.20.d:0 "[STR.GetName] надіслав воїнів у відповідь на нашу пропозицію. Прекрасно! Вони охоче захищатимуть інтереси МакАртура – хоча Чикаго, ймовірно, не схвалить цього."
nf_mca.20.a:0 "Нам важливо мати друзів."

nf_mca.21.t:0 "Угода є угодою, навіть із брудним торгашем"
nf_mca.21.d:0 "Американці – зрадливий, жорстокий народ. Вони окупували Канаду, експлуатували нас роками, не спромоглися навіть правильно вивчити нашу назву, зруйнували нашу культуру бомбами – і завершили все це ядерним апокаліпсисом. Але гроші в них є. А хто ми такі, щоб дати системному гніту завадити прибутку?\n\nПосланник від [MCA.GetLeader] прибув вертибердом на північ від Норт-Енду. Вони пропонують купу кришок в обмін на кілька старих дирижаблів. Чи наважимось ми укласти угоду з тими, хто колись був монстрами?"
nf_mca.21.a:0 "Ми – вільний народ, і ми віримо у вільну торгівлю."
nf_mca.21.b:0 "Що, щоб нас далі звали «канадарійцями»? Обійдеться."

nf_mca.22.t:0 "Дирижаблі, малюк!"
nf_mca.22.d:0 "Братство мандрує Пусткою з великою армадою дирижаблів. Але ми мусили покладатись на літаки, вертиберди й механізовані війська... до цього моменту, завдяки [TRR.GetLeader]."
nf_mca.22.a:0 "До Китів Свободи!"

nf_mca.23.t:0 "Добре врегульоване ополчення..."
nf_mca.23.d:0 "Аби захистити Північ, Група Жовтень висунула геніальну ідею – все ширше залучати місцевих як допоміжні сили. Хоч ці жителі Пустки й поступаються спорядженням основним силам Анклаву, під керівництвом Перших Родин вони готові боронити домівки й свободу. Дехто в керівництві побоюється: куди ці люди спрямують зброю потім?\n\nАле Секретар провів детальний аналіз витрат – і математика проста: для Чикаго дешевше втратити десяток пустошників, ніж одного американського солдата. Тож вітаємо перші батальйони нової національної гвардії!"
nf_mca.23.a:0 "Хай Благословить... Монтану?"

nf_mca.24.t:0 "Завмерти й замовкнути"
nf_mca.24.d:0 "Надто довго мешканців Монтани тримали на слабкому повідку. Надто довго вони зловживали співчуттям [MCA.GetLeader] і не робили внеску в Велику Справу. Ми принесли лад – і лише просили покори. Ми дали безпеку – і лише просили прийняття. Натомість нас зневажили.\n\nЦьому прийшов кінець. Залежні від щедрот Чикаго, мешканці Монтани мають розрахуватись. Секретар внутрішніх справ підрахував усе – час змін настав. Якщо вони хочуть захисту Анклаву, певні зміни є неминучими. Для їхнього ж добра."
nf_mca.24.a:0 "Хай Благословить Бог Анклав."

nf_mca.25.t:0 "Америка ще не втрачена!"
nf_mca.25.d:0 "Це диво! Виявляється, ми – не останні американці! Із далекої Монтани приходить лідер, знаний як [MCA.GetLeader], із новинами від Тимчасового уряду США. Діючи від імені групи під назвою Анклав, [MCA.GetLeader] пропонує військову допомогу для знищення комуністичних повстанців і збереження майоріння Зірково-Смугастого прапора. Можливо, у Старої Слави ще є майбутнє."
nf_mca.25.a:0 "Прапор – назавжди?"

nf_mca.26.t:0 "Інцидент на Авеню Хіґґінс"
nf_mca.26.d:0 "Від початку протестів проти вимог Чикаго зросла напруга між солдатами Анклаву та народом Монтани. У ніч на [GetDateText] люди вчинили спротив... або ж розлючений натовп напав на беззбройних героїв? За свідченням деяких очевидців, механік зажадав від сержанта сплатити рахунок за ремонт радіо – той, мовляв, уже заплатив і образив механіка. Зав’язалась сварка. Механік замахнувся, сержант ударив його руків’ям лазерного пістолета. Побачивши це, люди кинулись на допомогу, а сержант відступив до охоронного посту. Те, що сталось далі, було різаниною – десятеро мешканців Міссули загинули на холодній землі.\n\nПерші Родини вимагають суду й страти офіцера за вбивство цивільних. Але командування Анклаву категоричне: жодного солдата армії Його Людини не може судити, гм, мутант."
nf_mca.26.a:0 "Ми не пожертвуємо офіцером і джентльменом!"
nf_mca.26.b:0 "Пожертвувати офіцером – задля спокою Перших Родин."

nf_mca.27.t:0 "Ми захищаємо своїх"
nf_mca.27.d:0 "Ідея про те, щоб Перші Родини мали право судити американських воїнів, здавалася безглуздою – особливо Еллен Сантьяго.\n\n«Що буде далі?» – кричала вона в офісі. «Вони судитимуть мене? Або мою дочку?» Тож Полковниця відмовила Першим Родинам. Анклав не слухає жителів Пустки."
nf_mca.27.a:0 "Ми тут, щоб допомагати, а не щоб нас судили."

nf_mca.28.t:0 "Держава законів, а не людей"
nf_mca.28.d:0 "І все ж, Полковниця – з важким серцем – віддала свого офіцера на суд.\n\nАле сталося неочікуване. Роберт Піл із Перших Родин став на захист офіцера. Він закликав присяжних, обраних з народу Міссули, дивитися не на походження, а на події тієї ночі. Він вказав, що натовп зібрався через приватну комерційну суперечку, що мешканці мали право носити зброю й захищати себе – а згідно з показами свідків, натовп рушив уперед попри попередження. Присяжні визнали офіцера Гарґрейва невинним.\n\nХоч його й виправдали, офіцери Анклаву були розлючені: якщо судять одного, хто буде наступним? Але для пана Піла цей день став наріжним каменем спасіння Монтани. Бо факти – вперта річ, і закон не схиляється перед забаганками чи гнівом."
nf_mca.28.a:0 "Та ми й так знали, що він був невинний!"

nf_mca.29.t:0 "Чому відеозв'язок не працює!"
nf_mca.29.d:0 "Жахливі новини! Хтось – чи то терористи Братства, чи Джексони, чи Лакота – знищив наші радіокомунікаційні вузли та пошкодив базу ВПС МакАртур. Ми можемо спробувати відновити мережу, але зв’язок із Чикаго та Міністерством внутрішніх справ буде втрачено надовго. Сподіваємось, що довгохвильовий передавач допоможе – і що Група Жовтень встигне знайти винного. Але поки що ми – в ізоляції."
nf_mca.29.a:0 "Це катастрофа!"

nf_mca.30.t:0 "Зграя гієн"
nf_mca.30.d:0 "Потік плазмових розрядів розрізав ніч, коли Полковницю й її найближчих соратників убив Спеціальний Агент Джонсон. Більшість у МакАртурі не дізнались про це до ранку – Анклав тримав базу в залізному кулаці. Агент Джонсон вийшов у радіоефір:\n\n«Змін буде багато, Монтано. Квоти, будівництво, податки, трудові внески», – прохрипів агент. «У всьому цьому ви відстали. І доведеться надолужити.»\n\nЄдина надія – це Група Жовтень. Марта з товаришами повстала за підтримки деяких Перших Родин. Але що може жменька бунтарів проти потуги Анклаву?\n\nЩо ж до Полковниці Монтани? Що ще потрібно симпатизантці мутантів, окрім безіменної могили в снігу?"
nf_mca.30.a:0 "Хай Благословить Бог Анклав."
nf_mca.30.a_tt:0 "\n§RСантьяго усунена за зрадницькі думки.§!"
nf_mca.30.b_tt:0 "\n§PЗдається, побічні завдання Групи Жовтень не були даремними...§!"

nf_mca.31.t:0 "Правда про Джексонів"
nf_mca.31.d:0 "Кожен у Монтані знає: Джексонів вигнали з Міссули за зраду. Вони впустили бандитів і рейдерів, намагалися спалити місто – поки Полковниця не зупинила їх. Їхня зрада – одна з причин, чому Анклав став порятунком Монтани.\n\nЦе – брехня. Група Жовтень дізналася правду під час останньої сутички з Джексонами. Їх вигнали, бо вони вимагали, щоб народ Міссули мав слово у правлінні! За це Полковниця знищила їхнє ранчо, відібрала майно й вигнала на схід. Там, на рівнинах, Джексони стали рейдерами, бо це був єдиний шанс вижити. Отже, одну з найбільших загроз Монтани створила сама Полковниця!\n\nТепер «Патріот Монтани» має цю історію й погрожує її опублікувати. Полковниця робить усе, щоби зупинити це – але навіть закриття газети може не допомогти. Група Жовтень може здійснити рейд на друкарню до виходу номера – але що вони зроблять?"
nf_mca.31.a:0 "§RПапір легко горить.§!"
nf_mca.31.b:0 "§MЛюди мають знати.§!"

nf_mca.32.t:0 "Притулок від бурі"
nf_mca.32.d:0 "Під час битви зі Буревісниками Група Жовтень знайшла історію, яку хтось назвав би романтичною. Один із воїнів Штормовиків, Вітер-Що-Заплутує, був поранений і вилікуваний жінкою з Монтани, Ніккі. Він закохався в неї, і вони сховались у печері. Але минуле не забуває: Вітер був розшукуваний за вбивство дюжини цивільних і жертвопринесення їх Батькові Бурі.\n\nТепер Марта Сантьяго мусить вирішити – вбити цього вбивцю чи помилувати чоловіка, який намагається змінитись? Рішення здається простим. Але Вітер – останній брат давнього провидця, Сліпого Граду. Отже, є потенційна вигода..."
nf_mca.32.a:0 "Ой, палець зісковзнув із гачка!"
nf_mca.32.b:0 "Можливо, співчуття – не така вже й вада?"

nf_mca.33.t:0 "Солдати й супермутанти"
nf_mca.33.d:0 "...Зітх.\n\nСхоже, Сальватори не зупинились на гламурних барах у містах Монтани. Тепер вони влаштовують «ігрові вечори», щоб розширити клієнтуру. Найпопулярніша гра – де відважні бійці Анклаву змагаються з Братством, Супермутантами й рейдерами, здобувають нову зброю та прокачуються, досліджуючи руїни та сховища. Хоч ми й маємо деякі сумніви, це точно краще, ніж «Трагік: Зібрання»."
nf_mca.33.a:0 "Ну... дякуємо?"

nf_mca.34.t:0 "Відбудова Америки потребує часу – навіть для Анклаву"
nf_mca.34.d:0 "«Агенте Джонсон», – проголосив Секретар. – «Ви добре попрацювали. Останні з Групи Жовтень і їхніх мутантських друзів або мертві, або на роботах. Але тепер ми маємо відновитись і рухатись уперед. Є три завдання на Півночі, які ви повинні виконати».\n\n«На заході – гідроелектростанції Вашингтону, потенційне джерело нескінченної енергії, а в Сієтлі досі можуть зберігатися таємниці американської авіації. Подейкують, з-під снігу й туману надходять дивні сигнали». Він зробив паузу на дві секунди – вічність для Секретаря.\n\n«Але в бітумних пісках Альберти, можливо, досі є нафта – паливо Пустки. Забруднення навколишнього середовища не зачепить американську землю, якщо вам пощастить». Зв’язок трохи потріскував, і він додав:\n\n«І, звісно, Дакота! Старі шахти для ракет можуть досі містити ядерну зброю, яку ми не встигли застосувати проти Китаю. Хто сказав, що ми не можемо використати її проти Братства Середнього Заходу? Поверніть ці боєголовки – і повертайтесь додому».\n\n«У підсумку, агенте, вибір за вами. Адже саме ви», – він коротко засміявся синтезованим голосом – «маєте чоботи на землі»."
nf_mca.34.a:0 "На Захід – до сили!"
nf_mca.34.b:0 "Завершимо окупацію Великого 51."
nf_mca.34.c:0 "Дакоти були й будуть американськими."

nf_mca.35.t:0 "Переодягання на базарі"
nf_mca.35.d:0 "«Базар» – це ринок екзотики, розкоші й таємничого, торговельна імперія, заснована в довоєнному підземному торговому центрі посеред нічого. Легенда каже, що Армія Монстрів знайшла його під чотирма футами снігу, почувши звук аркадних автоматів. Інша каже – вони з’їли попередніх мешканців – свинарів, яких переслідували. Як би там не було, справжній жах – це ціни!\n\nМарта й Група Жовтень прибули на Базар, шукаючи гравітаційні пластини для зменшення споживання пального. Та опинились перед дилемою: нинішній господар, Флаб Інгалятор, чесно співпрацював із МакАртуром, але приймав усіх торгівців, не надаючи переваг. Тим часом [WYR.GetLeader] запропонував вигідну угоду: допомогти йому захопити Базар.\n\nЗазвичай Група Жовтень не втручається в місцеві справи, але спокуса велика: у винагороду пропонуються довоєнні мініґани. Та будь-який конфлікт знищить гравітаційні пластини й поставить під загрозу весь Базар. Що вони оберуть?"
nf_mca.35.a:0 "На боці Флаба!"
nf_mca.35.b:0 "Базар має належати Бейлі!"

nf_mca.36.t:0 "Смуток Сталеміста"
nf_mca.36.d:0 "Для багатьох Сталемісто – надія на краще завтра. Мрія, що колись американці житимуть як у 2070-х. Для інших – це брехня.\n\nСталемісто тримається на праці біженців, чиї вимоги давно ігнорують. Людей калічить важка техніка. Квоти та мізерна платня вбивають у них надію. І от, нарешті, вони повстали. Лідер страйкарів, Салін Кроу, виголошує: «Годі нам 16-годинних змін! Годі замикати нас на заводах! І найголовніше – годі нам тебе, Маркгем! Не будемо більше платити за перерву на сечу!»\n\n[MCA.GetLeader] відправив Групу Жовтень, щоби розібратись. Підтримати Маркгем – легко. Але чи не заслуговують біженці на гідне життя? І чи не завдасть розгін страйку ще більшої шкоди?"
nf_mca.36.a:0 "Маркгем збудувала Сталемісто – і збудує Монтану."
nf_mca.36.a_tt:0 "\n§PСхоже, Маркгем винагородила Групу Жовтень.§!"
nf_mca.36.b:0 "Біженці – теж люди!"

nf_mca.37.t:0 "Заклик до дії"
nf_mca.37.d:0 "Група Жовтень відповість на будь-який заклик про допомогу – навіть якщо його надіслано через довоєнний канал, призначений лише для Президента. Що стало несподіванкою для самого Президента Едена.\n\nВ одній із місій вони перехопили сигнал і знайшли старий гараж. У ньому – броньований лімузин, що колись возив 49-ого президента США. Бідолашна машина, блукаючи Пусткою після зруйнування музею, бачила все: бійні, канібалізм, смерть американської мрії. Вона хоче вмерти.\n\nЧи виконає Група Жовтень її останнє бажання? Чи переконає, що Америка ще жива?"
nf_mca.37.a:0 "§RРозібрати на деталі.§!"
nf_mca.37.b:0 "§MЗаводь! За Америку!§!"
nf_mca.37.c:0 "§MЧи Президент Джерманотта сказав би здатись? Ми на межі слави!§!"
nf_mca.37.c_tt:0 "\n§gПідпрограми Патріота стануть радником.§!"

nf_mca.38.t:0 "Служба заради справи"
nf_mca.38.d:0 "Народе Монтани!\n\nАнклав потребує вас. Не ваших мрій, ресурсів чи землі. Вас – особисто. І ви – потребуєте його.\n\nМіністерство внутрішніх справ працює над відновленням серця нації. Але цей проєкт потребує рук. [MCA.GetLeader] має повноваження мобілізувати сотні громадян для служби на Сході. Їх забезпечать їжею, лікуванням, платнею й наділять землею після служби. Не плачте за ними – радійте майбутньому, яке вони збудують в Айові."
nf_mca.38.a:0 "Вони підуть із гордістю."
nf_mca.38.b:0 "Боже, на нас напали! Ми не можемо!"

nf_mca.39.t:0 "Ми Робимо Свій Внесок!"
nf_mca.39.d:0 "Монтано, ми про вас не забули на Сході. Але нація просить ще. МакАртур закликає вас до переселення – і, на жаль, разом із родинами. Але будьте певні: на вас чекає краще життя. Таке, що ви більше ніколи не згадаєте про Монтану."
nf_mca.39.a:0 "Дякуємо за вашу службу."
nf_mca.39.b:0 "На жаль, ми надто незграбні, щоб допомогти."

nf_mca.40.t:0 "Вони сумують за тобою!"
nf_mca.40.d:0 "Народе Монтани, ми чуємо ваші запитання. Чому так мало листів із Сходу? Що сталося з біженцями, яких ми туди відправили? Не хвилюйтеся, мої американці. Вони в безпеці, щасливі – з Нука-Колою, чистою водою й бейсболом. Але є одне жахіття: Братство Сталі знищує вашу пошту.\n\nТак, ці жестяні бойскаути прагнуть не лише повернути нас у Темні Віки – вони ще й ізолюють нас. Щодня хоробрий Анклав бореться проти цього зла, але навіть ми не безгрішні. Тож якщо ви не чуєте новин від рідних, що подалися на Схід – винне Братство. Лише разом ми здобудемо перемогу й знову об'єднаємо ваші родини."
nf_mca.40.a:0 "Ви ще будете разом."

nf_mca.41.t:0 "Nomen Nescio"
nf_mca.41.d:0 "Усе має межу. І згодом люди починають питати. Нові чутки доходять із заходу – від розвідників лакота, торговців Річкової Ліги й п'яних офіцерів Анклаву. У барах Монтани шепочуть про експерименти з FEV, про фабрики, де працівники ніколи не бачать світла, про розкіш і війну заради Великої Справи. І всі ці листи з Сходу – без жодної особистої згадки.\n\nВсе більше й більше людей ставлять мовчазне питання: що насправді відбувається? І які плани має Анклав щодо Монтани?"
nf_mca.41.a:0 "Ми відбудуємо Америку такою, якою вона має бути."

nf_mca.42.t:0 "Базар"
nf_mca.42.d:0 "«Раніше я думав, що я – найчудніша людина у світі, аж доки чоловік, вбраний як Зетан, не продав мені хот-дог із гострим майонезом. Принаймні, я думаю, що це був майонез...»\n\nДо Війни компанія A & N Construction побудувала підземний торговельний центр у Уініфреді, як туристичну атракцію. Його мали відкрити наступного дня після початку війни. Після Пропащих Днів місце стало домом для свинарів. Знайшовши лише костюми з геловінського магазину, вони стали Армією Монстрів і зажили карнавальним життям. Нині Базар (його початкову назву втрачено) – це яскраве, химерне місце для втомлених мандрівників та нейтральна торгова зона Великої Півночі."
nf_mca.42.a:0 "Краще торгувати з ними, ніж із Братством."
nf_mca.42.b:0 "Краще використати сонячну панель, ніж розібрати її на брухт."
nf_mca.42.c:0 "Вони живуть на повну!"
nf_mca.42.e:0 "Ми повинні контролювати торгівлю."

nf_mca.43.t:0 "Смерть або податки"
nf_mca.43.d:0 "Ті, хто тікає до оази стабільності МакАртура, часто опиняються в біді. Без нічого, крім одягу, вони шукають допомоги в Анклаву чи Перших Родин. І кожен варіант має свої нюанси. Перші Родини дають кредити, які важко повернути. Анклав – надає підтримку в обмін на двадцять років у Корпусі Відновлення.\n\nБільшість іде працювати до Родин – і от, нова проблема! Кілька боржників утекли від «наглядача» з його грошима й виграли джекпот у Маленькому Ріно. Вони хочуть заплатити борг і звільнитися достроково. Але наглядач наполягає: їхній кредит вимагав семи років праці, і вони не можуть відкупитися.\n\nКоманда Жовтень перша прибула на місце. Як вчинити?"
nf_mca.43.a:0 "§RКонфіскувати виграш і не залишати свідків.§!"
nf_mca.43.b:0 "§MНехай відкупляться всім виграшем.§!"
nf_mca.43.c:0 "§PВони погодились працювати – нехай тримаються угоди.§!"

nf_mca.44.t:0 "Що за чортів-"
nf_mca.44.d:0 "Наші страхи справдились: американський капіталістичний імперіалізм повернувся.\n\nІз форпосту повідомили про напад «американського лімузина смерті з лазерною туреллю!» Втрати поки невеликі, але авангард пролетаріату побоюється нових обстрілів. Удалині чути гудки... і радіо, що гуде: «Анклав продовжує рух!»"
nf_mca.44.a:0 "Навіть їхні автомобілі гноблять нас?"

nf_mca.45.t:0 "Зламаний ланцюг"
nf_mca.45.d:0 "Йому залишили маску й респіратор. Маленька милість? Чи насмішка від тих, хто звав його «Безсмертним»? Можливо, краще було б померти під час падіння Сієтла.\n\nДні допитів. Питання: чому він зрадив країну. Наче він винен вірність державі, що померла двісті років тому. Або Лост-Гіллзу, що про них забув. Або Бункеру Епсілон, що не розумів, що потрібно.\n\nПоруч у камері – Патрокол, що досі вірить у Братство. Тепер їх з'єднало лише співкамерництво – двоє зрадників, як назвали їх тюремники. І вони просто сидять, у мовчанні, з каяттям. Годинами.\n\nКоли двері відчинились, Безсмертний ледь не засміявся – агент насилу пролазив. Але не сміявся – востаннє за це йому зламали ногу. Агент мовчав. Що ж за обличчя ховалось за тією маскою?\n\n«Ми відправляємо тебе в Чикаго», – прохрипів агент. – «Можливо, там ти знайдеш свою надію.»"
nf_mca.45.a:0 "Вартий кінець для зрадника."

nf_mca.46.t:0 "Вікно до Тихого океану"
nf_mca.46.d:0 "Завоювати Вашингтон – одне. Керувати туманним безладом – зовсім інше. До відновлення Трансконтинентальної залізниці Сієтл залишався лише форпостом. Але під пагорбом Капітолію приховано чимало таємниць. Яке ж це поетичне покарання, що залишки Братства – нащадки армії – стали об’єктами для випробувань на Захищеному Об’єкті Pl. Для управління Північно-Західним узбережжям Анклав створює новий відділ – Тихоокеанське Командування. Вони стежитимуть, щоб роботи зі «Спеціальних Обставин» тривали без перешкод."
nf_mca.46.a:0 "Хай живе Анклав."
nf_mca.46.a_tt:0 "\n§PВідкрито нову кампанію. Ви здобули прихильність Секретаря.§!"

nf_mca.47.t:0 "Скільки ще разів ми маємо тебе вчити, старий?"
nf_mca.47.d:0 "Якимось чином Америка повернулась!\n\nЗалишки армії з бази МакАртур готуються знову захопити наші землі. Але цього разу ми готові. Наші предки воювали на конях і з гвинтівками. Ми – з ПТ-засобами та комбінованими бойовими групами. Покажімо [MCA.GetLeader], як ми повелися з генералом Кастером."
nf_mca.47.a:0 "За наші землі, де спочивають наші мертві."

nf_mca.52.t:0 "Посеред ринку"
nf_mca.52.d:0 "Серед безлічі дивовижних творінь, що з’явилися завдяки співпраці Міддлмарк і MANIFEST, ніщо не вражає так, як їхні Маркетрони. Хоча дехто вказує на схожість із Секюрітронами від Robco, що межує з порушенням авторських прав, нам це не дуже й важливо. Адже у беззаконній пустці є свої переваги. Тепер, коли Міддлмарк міцно перебуває під нашим контролем, ми можемо почати інтегрувати ці машини в наші окупаційні сили. Сподіваємося, це полегшить стрес, про який говорили наші бійці, які відчувають перевантаження."
nf_mca.52.a:0 "ЗА МІДДЛМАРК(c)!"

nf_mca.53.t:0 "Зброя й троянди"
nf_mca.53.d:0 "Анклав надіслав свою найкращу – жінку прекрасну й небезпечну, мов ніч. Вона приносить дар – кришки й квіти з Божого Саду, малого раю МакАртура. Та головне – вона приносить шанс убити Братство. Як відмовити тій, хто так добре виглядає в чорному?"
nf_mca.53.a:0 "Ймовірно, вона зацікавлена."
nf_mca.53.b:0 "Хіба вона не служить жахливому злу?"

nf_mca.54.t:0 "Скляні молоти"
nf_mca.54.d:0 "Нехай ніхто не скаже, що Полковниця – монстр. Щоб не ризикувати життями добрих людей Монтани, вона знайшла гулів, готових битися (і, можливо, загинути) за вас. Дехто каже, що гулі – загроза, яку треба знищити. Але хіба не краще зробити з цих приречених істот союзників? Адже якщо хтось має їх застрелити – нехай це будуть наші вороги."
nf_mca.54.a:0 "Зменшити, повторно використати, переробити!"
MCA_ghoul_guys_tt:0 "До нас приєднаються два §Yгульських найманця-Вартових§! у провінції §Y[332.GetName]§!."

nf_mca.55.t:0 "О Боже, цей сморід нестерпний"
nf_mca.55.d:0 "Гнилі, смердючі, сочащіся гулі-Вартові відмовилися від нашої пропозиції. Вони залишаються у своїх темних норах, грабують жителів Пустки і тероризують Спокен. Трагічна доля – і ще один доказ, що Анклав мав рацію."
nf_mca.55.a:0 "Їхній час прийде."

nf_mca.56.t:0 "Герої чужої історії"
nf_mca.56.d:0 "У всіх своїх мандрах Північчю Команда Жовтень ніде не зустріла таких теплих сердець, як у Левів. Старі солдати не вмирають – особливо тут, на Півночі. Гарріс пам’ятав лише уривки Довоєнної епохи. Що таке Нука-Світ? Що таке табір Черепашка? І чому, при всіх досягненнях, він так сумнівався в Анклаві?\n\nЯкось вони навіть билися разом – у готелі Еверест, притулку канібалів, що панував над сотнями. Хоч більшість історій – вигадки (це точно не були Атом і Єва), та ніхто не заперечить, що Мартха винесла щось із того досвіду."
nf_mca.56.a:0 "«Одного дня, друзі, я можу попросити у вас послугу.»"
nf_mca.56_a_tt:0 "\n§M«Корисно мати друзів у Пустці.»§!"

nf_mca.57.t:0 "Звільнити націю"
nf_mca.57.d:0 "Як і боялися, Чикаго прийшов по Команду Жовтень. Їхні вертиберди спустилися в ніч на базу. Та яка трагедія! Бо нікого там не було. У кухні – казан, що бурчав ні для кого. Збройова – порожня. Паливні елементи – злиті. Лише одне повідомлення лишилось – запис, що лунав у динаміках бази, а згодом – у всій Монтані:\n\n«П’ятсот років тому наші предки заснували націю – зачату у свободі та присвячену рівності всіх людей. Чи пам’ятаєте ви ту мрію? Чи забули?»\n\n«Анклав твердить, що веде вас. Але він забирає ваших дітей і врожай без згоди. Він отруює ваші поля. Він говорить про Америку, яку ви ніколи не побачите – а Велика Справа знищить усіх, хто не вірний. Я не обіцяю легкої боротьби. Але я даю вибір: жити вільними або померти рабами.»"
nf_mca.57.a:0 "Хай живе Е-Америка."
nf_mca.57.a_tt:0 "\n§MВаші дії до цього вплинуть на силу Революції.§!"

nf_mca.58.t:0 "Напад ванамінґо!"
nf_mca.58.d:0 "О ні! Виявляється, ванамінґо, яких ми імпортували з Чикаго, – зовсім не наші друзі! Відколи ми повстали проти Чикаго, чудовиська атакують наші ферми й лінії постачання, посилюючи контроль Чикаго над околицями. Це трагічно й несправедливо!"
nf_mca.58.a:0 "Я ніколи не думав, що ванамінґо з'їсть моє обличчя!"

nf_mca.59.t:0 "А що я маю з цього?"
nf_mca.59.d:0 "Передача енергії біженцям, можливо, була морально правильною, та бізнес, що тримає Монтану, не отримав вигоди. Дехто вважає, що [MCA.GetLeader] і її революціонери – анархісти, які хочуть лише влади натовпу. Біженці підтримують революцію, але їм бракує ресурсів, які могли б надати Перші Родини."
nf_mca.59.a:0 "Допомога народу все одно була правильною."

nf_mca.60.t:0 "Доля полковниці"
nf_mca.60.d:0 "«Послухай,» – мовила Вессон, лідерка Перших Родин. «Ми не можемо просто стратити Полковницю. Вона зробила багато доброго для Монтани. Дороги, стабільність, технології.»\n\nІсторик Якоб Шьолас лише посміхнувся. «„І показав Йому всі царства світу, і сказав: усе це віддам тобі, якщо впадеш і вклонишся мені.“ А як щодо вивезення людей? Біженців, яких заслали на схід? Цивільних, ув'язнених за запитання? Ти хочеш виправдати її за... опалення?»\n\nМарта мовчала. Напередодні вона прийшла до матері. Просила просити прощення. Сказати, що лише виконувала накази.\n\nПолковниця відмовилась. Назвала дочку зрадницею. «Скажи їм, що все, що я зробила – зробила заради Америки. І зробила б знову. Але цього разу я б не довірилась родині більше, ніж Батьківщині.»\n\nПредставник Стілтауну, мовчазний досі, озвався: «Нехай її долю вирішить народ – тобто, випадкове журі. Скажемо, що це знак волі громадян. Якщо хтось поскаржиться – це не буде на нашій совісті.»\n\nМарта прикусила губу. Вона мала щось сказати. Її слова вирішували долю єдиної родини, яку вона знала напевне."
nf_mca.60.a:0 "«Ми маємо стратити її як приклад. Вибору немає.»"
nf_mca.60.b:0 "«Довічне ув'язнення – це максимум, що ми можемо зробити.»"
nf_mca.60.c:0 "Помилуйте її. Будь ласка."
nf_mca.60.e:0 "«Призначте журі. Я... ми не можемо вирішити її долю.»"

nf_mca.61.t:0 "Моє миле дитя"
nf_mca.61.d:0 "І так, лідери повстання в Монтані передали вирішення долі Полковниці жителям Міссули. Жінка, що свого часу вселяла жах у всій Півночі, змушена була сидіти перед тисячею людей, які зважували її доблесть і злочини. Натовп її не вбив – але й не простив. Замість цього місто вирішило відпустити її так, як вона і прийшла – з комплектом Силової Броні та плазмовою гвинтівкою. Лише після чотирьох годин дебатів вона звернулась до зібраних.\n\n«Погляньте на себе. Тридцять років тому ви тремтіли в ранчо й укріплених містечках, боячись Металевої Пащі чи рейдів лакота. Генератор на фермі – це вже було багатство. Найкращий ваш торговельний центр був підземним магазином костюмів, на милість Атома. А тепер у вас є електрика, їжа, тепло. Ваші діти вчаться читати й мріють про щось більше, ніж померти під коровою.»\n\n«Ви кажете, що це – нове народження свободи, та ви навіть не змогли вирішити мою долю. Забудьте про покоління майбутнє – ви й десяти років не витримаєте.»"
nf_mca.61.a:0 "Її слова було над чим обдумати."

nf_mca.62.t:0 "Чутки з темряви"
nf_mca.62.d:0 "З одного з віддалених поселень надійшло повідомлення: загін лакота тероризує ферми, а ми надто розпорошені, щоб допомогти. Але під час чергового рейду щось сталося. Щойно рейдери підійшли до ранчо – хтось у Силовій Броні атакував їх із тилу. Все скінчилось за лічені хвилини – двадцять загиблих, попіл розвіяно вітром. Єдине, що зробив цей воїн – перев'язав одного працівника й зник мовчки. Дезертирів не було. То хто ж це був?"
nf_mca.62.a:0 "Невже це вона?.."

nf_mca.63.t:0 "Чиказька школа"
nf_mca.63.d_markham:0 "Ніхто не заперечить економічне зростання під керівництвом Маркгем, але роботи ще багато. Вона приїхала з Чикаго, втомившись від впливових кланів, та тепер боїться, що ті ж самі тенденції пустили коріння в Скелястих Горах. Перші Родини – фактично олігархи. Розрахунки Маркгем, хоч і складні, вказують: не можна ні ставити потреби Біженців понад усе, ні залишати економіку під контролем Родин. Лише віддавши управління нейтральному ЗАКС, можна забезпечити справжній розвиток.\n\nПерші Родини обурені. «Це що, злочин?» – обурюється Мосс Коґан. – «Що ми, джентльмени, вирішуємо, з ким працювати? Якщо слухатимемо Комп’ютер – що буде з нами?»"
nf_mca.63.d_refugees:0 "Стілтаун уже не той, яким був у часи розквіту – та все ще живе скромним добробутом. Але тепер Перші Родини хочуть знищити робітничі кооперативи, що управляють містом. Вони стверджують, що лише їхні кошти дозволять регіону розвиватись. І що без керівництва Маркгем промисловість Монтани занепаде. Тож вони пропонують продати держвласність найвищому покупцеві. Це стимулює розвиток – кажуть вони.\n\nБіженці зі Стілтауну у відповідь – єдиним голосом: «Ми не змінювали одну пані на сотню панів!»"
nf_mca.63.a:0 "Ми не можемо розгнівати Перші Родини!"
nf_mca.63.b:0 "Довіримося Комп’ютеру – й Маркгем."
nf_mca.63.c:0 "Ми не можемо розгнівати Перші Родини!"
nf_mca.63.e:0 "Кооперативи? Та це ж *КОМУНІЗМ*!"

nf_mca.64.t:0 "Ми боремось із холодом, підкорюємо гори"
nf_mca.64.d:0 "Північна Співдружність – це сотні тисяч квадратних миль. Без технологій Чикаго її важко захистити. Загрози з Канади, Вашингтону, Сходу – все це потребує відповіді. Але як саме ми її захистимо?\n\nПерші Родини вважають, що самі мають формувати війська на місцях. Це просто, але дає їм контроль над армією. Можна найняти найманців із Пустки – вони залежатимуть від держави й не становитимуть загрози. Команда Жовтень ж пропонує відкрити лави для всіх американців Співдружності."
nf_mca.64.a:0 "Особистий підхід Родин – найкраще."
nf_mca.64.b:0 "Найманці – справедлива альтернатива."
nf_mca.64.c:0 "Добре врегульоване ополчення – основа свободи."

nf_mca.65.t:0 "Лицар у землі дикості"
nf_mca.65.d:0 "Марта Сантьяго стояла над тілом і схилилась, щоб прочитати ранг і знак Паладина. Витерла трохи бруду, зморщившись.\n\n«Па... Паладин? Паладин хто?..» Вона знизала плечима, не дозволяючи собі засмутитись, і налаштувала радіо. «Схоже, ми так і не дізнаємось, хто був у цьому бункері. Але тепер він належить Монтані.»\n\nНа мить їй згадалась стара довоєнна пісня. «Паладине, Паладине... так далеко від дому... Де ж ти блукав?..» Вона підвелась і вийшла з останнього опорного пункту Патрокола – у ясний, сонячний день. Та до останніх днів буде згадувати – ким був той невідомий Паладин."
nf_mca.65.a:0 "Боже, благослови Північ."

nf_mca.66.t:0 "Немає бізнесу гіршого за шоу-бізнес – і слава богу за це"
nf_mca.66.d:0 "Нещодавно Скелястими Горами мандрувала група акторів: Пересувна Симфонія. Вони здебільшого безпечні, виконують старі рекламні ролики, шекспірівські п’єси та класичну літературу. Але дійшли чутки, що жінка на ім’я Диригентка – колишня паладин Братства Джоанна. Що нам з ними робити?"
nf_mca.66.a:0 "Заарештувати лідерку."
nf_mca.66.b:0 "§RВони явно знали, що переховують залишки Братства.§!"
nf_mca.66.c:0 "§0Нехай дадуть виставу всього життя.§!"

nf_mca.67.t:0 "Остання нерозказана історія"
nf_mca.67.d:0 "На пропозицію [MCA.GetLeader] Пересувна Симфонія мала поставити радіоп'єсу – і з примхи їм дозволили обрати сюжет самостійно. Вони обрали трагедію: про сім’ю перед самою війною. Воїн, що повернувся з фронту. Його дружина – юристка, що боролась за справедливість. Їхній робот-дворецький, обізнаний більше, ніж здавався. Немовля-син, не знаючи, що його долю вже вирішено. І фінал – робот оповідає, як родина тікає перед кінцем світу, залишивши його позаду.\n\n«У небі з’явився китайський літак. Останній на довгий час, боюсь. Більше не буде літаків. Не буде міст, що блимають вогниками в ілюмінатори. Більше не буде висоти в 30 тисяч футів, звідки можна було уявити життя, що мерехтіли внизу. Більше не буде літаків... хіба що діти зберігатимуть у них їжу. Якщо знайдуть їжу.» Потім – звук бомб. І тиша.\n\n«Жодного епілогу. Хіба що ви самі його створите. Якщо хочете майбутнього – заберіть його.»"
nf_mca.67.a:0 "§B...Вибачте, але я хотіла легку комедію?§!"
nf_mca.67.b:0 "§MЯ щиро не впевнений, чи це не була антиамериканська пропаганда?§!"
nf_mca.67.b_tt:0 "§g\nМабуть, якщо ми не розуміємо – це точно мистецтво?§!"

nf_mca.68.t:0 "Весь світ – театр, а людина – актор"
nf_mca.68.d:0 "«Це було того варте,» – подумала Джоанна, коли солдати вели її до кабінету Полковниці. Повстанці з Анклаву могли змінити форму, але суть лишилась: боротьба між фракціями, що зруйнували світ. Плакати, пихатість, знаки – усе це нагадувало мертву руку історії.\n\nТа коли вона увійшла, здивувалась. Молода жінка за столом читала звіт на комп’ютері.\n\n«Гарна постановка. Здається, я розумію – світ очищено. Час починати знову.»\n\nПауза. Диригентка усміхнулась: «Жоден драматург не видає таємниць. Але, певно, так – це один з варіантів. І,» – додала вона, – «я волію вірити, що не йду за сценарієм.»\n\n[MCA.GetLeader] посміхнулась. «До речі...»"
nf_mca.68.a:0 "§M«Чи дізнаємось ми колись, що сталося з тією родиною?»§!"
nf_mca.68.b:0 "§R«Я все одно страчу тебе як паладина Братства, це очевидно.»§!"
nf_mca.68.b_tt:0 "§g«Усім це сподобалось!»§!"
mnc_honorsplan_mca_flag:0 "Полковниця Помилувала Драматурга"
mnca_johannes_unlock_tt:0 "Відкриває §GДраматурга Йоганнеса§! як §Yкультурного радника§!"

nf_mca.69.t:0 "Мир, земля і браміни!"
nf_mca.69.d:0 "Ми перемогли Стендінґ-Рок та інших північних рейдерів і звільнили безліч рабів. Та що з ними робити? Рабство – зло, без сумніву. Але чи зможуть вони розпочати життя самотужки?\n\nПерші Родини хочуть захопити маєтки колишніх панів і продати землю тому, хто має капси. Але це зробить звільнених рабів орендарями. Інші вважають, що слід дати їм землю й дозволити самим вирішити її долю. Та чи зможуть вони впоратись?\n\nМаркгем пропонує інше: інвестувати ресурси протягом двох сезонів – дати насіння, техніку, зрошення. Витрати великі, та її ідея «капітальних вкладень» може себе виправдати."
nf_mca.69.a:0 "Керівництво досвідчених приведе до успіху."
nf_mca.69.b:0 "40 акрів і брамін!"
nf_mca.69.c:0 "Маркгем нас ще не підводила."

nf_mca.71.t:0 "Американська мрія"
nf_mca.71.d:0 "«Ого, глянь на їхні очі, пані. Наче вперше місто бачать.»\n\nСправді, закутані в пил фермери в’їжджали в місто, озираючись із подивом. Генератори, електролінії, майстерні, школа з гомінкими дітьми. Бозмен – може, не Чикаго, але над поштою майорить Прапор. Кур'єри стрибають на велосипеди, летять нести новини. З клубу Сальваторе лунає ритмічна електронна музика. В небі – два дирижаблі: з [WPG.GetName] і Іґл-Року.\n\nБармен зиркнув на стареньку, що мовчки сиділа. Вона приїжджала кожні кілька місяців, торгувала шкірами. Сама по собі. Без рідні. Сумно. Він налив і чекав.\n\nНарешті, за кілька хвилин, вона підняла келих."
nf_mca.71.a:0 "«Небагато, але чесна праця.»"

nf_mca.72.t:0 "Щасливий ГЕРМЕС"
nf_mca.72.d:0 "Без ресурсів Чикаго Північна Співдружність мусила творити промислову базу з руїн. APA – броня, що була жахом Пустки – більше недоступна. Що тепер?\n\nНа щастя, історик Олсен Меддок має план. До Війни Анклав і Посейдон працювали над новою бойовою бронею. Проєкт ГЕРМЕС мав дати частину сили APA за менших затрат. З його допомогою ми можемо переробити APA на ATHENA – броню, зручнішу для Скель і менш пов’язану з диявольськими угодами."
nf_mca.72.a:0 "З цією бронею ми справжні захисники народу."

nf_mca.73.t:0 "Будь ласка, залишайтесь із нами"
nf_mca.73.d:0 "«Серйозно, генерале? Ви хочете, щоб я повірив у це? Що Агента знищили *мутанти*?»\n\nОбраз Секретаря Внутрішніх Справ став яскраво-червоним. Еллен Сантьяґо відчула жар, але лишалась спокійною.\n\n«Так, сер. Здається, вони ще й з Командою Жовтень.» – Пауза. Довга. Eyebot підлітає ближче. Вона не здригнулась.\n\n«Цікаво... твоя ж донька тепер з ними?»\n\n«Це не доведено. Можливо, вона заручниця.»\n\n«Можливо. Але ти з’ясуєш це, коли знищиш їх, так?» – Образ знову блимає. «Бо той, хто вбив Агента Джонсона, знає наші таємниці.» Еллен стискає губи. Це був наказ. Вона може відповісти лише одне – і тішиться, що її батько ніколи не дізнається."
nf_mca.73.a:0 "«Хай живе Анклав.»"
nf_mca.73.a_tt:0 "\n§PО, ні! Інструктор із Чикаго раптово загинув... від кулі!§!"

  #The city of Steeltown thrived and grew. After you fixed Markham's 'computation engine,' her systems began to work as intended, and production boomed. Workers got the jobs that suited them best, and production processes continually improved. Abigail Markham's genius was proven at last. Throughout Colorado, people looked to Steeltown for a new vision of the wasteland's future- every person in their place, and every machine a slave.  ## Dynamic Modifier


nf_mca.74.t:0 "Моє миле дитя"
nf_mca.74.d:0 "Польова доповідь була короткою і чіткою.\n\n«31-й загін виявив залишки повстання на ранчо під Лінкольном. Початкові спроби врегулювання зазнали невдачі, і було викликано удар вертиберду. Жертв серед цивільних немає – всі присутні були повстанцями або їхніми симпатиками. Команду Жовтень ідентифіковано на місці та знищено з максимальною жорстокістю.» Генерал втупилася в останній рядок, перш ніж відповісти. На екрані блимало повідомлення:\n\nЧи буде відповідь?\n\nІ нарешті вона написала єдині можливі слова."
nf_mca.74.a:0 "§P«Хай живе Анклав.»§!"
nf_mca.74.a_tt:0 "\n§gОсь так і завершується історія Команди Жовтень.\n"

nf_mca.75.t:0 "Пожертвуй м’ясо полум’ю Гефеста"
nf_mca.75.d:0 "Дослідження на старому об'єкті «Посейдона» дало прориви в енергозбереженні та генерації! Ми можемо перенавантажувати енергоблоки – більше потужності для нашої плазми. Великий день для Анклаву і Північно-Західного Командування!"
nf_mca.75.a:0 "Магма – тепер зброя."
nf_mca.75.b:0 "\n§PЧому Марта спрямувала так багато енергії на жителів Пустки?§!\n"

nf_mca.76.t:0 "Анклав не йде до раю – бо ми його тут улаштували"
nf_mca.76.d:0 "Звіти зі Сходу – гірші, ніж ми думали. [MNC.GetLeader] керує імперією темряви з багатьма вразливими місцями.\n\nБараки рабів біля «Гаражу Тріфта», де жінки та діти розбирають старі авто. Стара кухня Істориків на авіабазі перетворена на «повітряні сили». І арена, де дикуни влаштовують криваві бої для розваги паладинів. Самі паладини – в ложах, втішають свою жорстокість.\n\nКожна з цілей – вигідна. Але ударити можна лише по одній. Який буде наказ Капрала Сантьяго?"
nf_mca.76.a:0 "«Братству ті авто не потрібні.»"
nf_mca.76.b:0 "«Будь-яка зброя – ППО, якщо літак на землі.»"
nf_mca.76.c:0 "§R«Там всього одна ложа?»§!"
nf_mca.76.c_tt:0 "\n§g«Колись наші вороги перестануть стояти в радіусі вибуху плазмової гранати. Але не сьогодні.»§!\n"

nf_mca.77.t:0 "Це місце – палає"
nf_mca.77.d:0 "Чудові новини! Команда Жовтень знищила кілька паливних баз і гаражів Братства в Гаражі Тріфта. Eyebot навіть зафіксував Капрала на тлі нічного вибуху, плазмопістолет при боці. Братству доведеться пішки йти на наступне звірство. Нам вдалося записати її репліку з цього приводу."
nf_mca.77.a:0 "«Знаєш, у чому між нами різниця, Паладине? Я ще й добре виглядаю.»"

nf_mca.78.t:0 "Як це сталося?"
nf_mca.78.d:0 "Важко зрозуміти, як це сталося. Наших найкращих Паладинів розірвало на шматки біля гаража Тріфта, жителі Пустки, яких привели для полірування та обслуговування нашої броні, безслідно зникли вночі, а сам комплекс тепер усіяний вирвами та дірами. На довершення всього, пам'ятну статую на честь поразки Калькулятора замалювали великою літерою «Е» та графіті з жартами про долю Бункера Епсилон. Це ганебна невдача, про яку навіть зараз говорять по Радіо Мак-Артура."
nf_mca.78.a:0 "Треба було залишатись у ліжку."

nf_mca.79.t:0 "Карма"
nf_mca.79.d:0 "На наше велике здивування, аеродром Братства містив не лише кілька дирижаблів. Там також була стара ракета «Дельта IX», яка, мабуть, здійснила аварійну посадку під час Великої війни. Команда «Жовтень» змогла заживити її старі бази даних і отримати всередині корисну інформацію.\n\nЗвісно, вони також підірвали кілька дирижаблів Братства. Що дивно? Братство, попри всі свої претензії на розуміння технологій і пошук довоєнної мудрості, не усвідомлювало, що ракету можна знову активувати. Є певні ознаки того, що Історики знали, що саме знаходилося на базі, але вони так і не розповіли Братству після того, як Паладини вигнали їх із цього району."
nf_mca.79.a:0 "Нам пощастило, що ті Історики почувалися настільки ображеними."

nf_mca.80.t:0 "ЧОМУ ЦЕ ПОСТІЙНО ТРАПЛЯЄТЬСЯ!?"
nf_mca.80.d:0 "Ми не розуміємо. Вибух на одній із ключових авіабаз знищив майже всю смугу. У цій місцевості з часів війни не було нічого вибухонебезпечного. Усе, що маємо – повідомлення із супутника й весела довоєнна пісенька. Хто ж таке влаштував?"
nf_mca.80.a:0 "Більшість науки Анклаву – за межами нашого розуміння."

nf_mca.81.t:0 "Канібал"
nf_mca.81.d:0 "Команду Жовтень дехто вважає надто серйозною. Але от факт: на арені є боєць, якого кличуть «Канібал Джонс». Кажуть, він їв ворогів. Але він сам визнав: був рейдером, та не чудовиськом. Його дружину й дітей убило Братство. Тепер – він їхній гладіатор. Ми допомогли йому втекти, дали зброю і впустили до ложі. Хоча... навіщо йому була сіль?"
nf_mca.81.a:0 "Іронія смачна, але чи їстівні паладини?"

nf_mca.82.t:0 "Канібал на волі!"
nf_mca.82.d:0 "Це жахливо! Один із рейдерів, яких ми змушуємо битися на арені для розваги, втік завдяки Анклаву, вбив писаря Еміті і тепер вільно розгулює нашими землями. Судячи з усього, рейдеру таємно передали вибухівку та плазмову зброю разом із ключем від його камери, і щоб його знешкодити, знадобляться значні ресурси.\n\nМи, звісно, не будемо розповідати всьому ордену, що Каннібал Джонс зробив з Еміті, але сподіваюся, вона влаштувала йому розлад шлунку."
nf_mca.82.a:0 "Жорстокість Анклаву не має меж."

nf_mca.83.t:0 "Річкова ліга і Вугільний консорціум"
nf_mca.83.d:0 "Доля Вугільного консорціуму є надзвичайно трагічною — Братство захопило їхні землі та вигнало керівництво під приводом «захисту дітей». Звісно, ніхто не зважав на незліченних мешканців Пусток, що живуть нижче за течією річки і залежать від вугілля Консорціуму, — ні на них, ні на будь-що інше, окрім власної вигоди.\n\nЗ поразкою Братства питання про вугільні шахти виходить на перший план. Ми могли б відправити частину вугілля Банку Чикаго в обмін на додаткову зброю. Або ми могли б залишити його тут для власної промисловості. Одним із варіантів є відновлення контролю Консорціуму над регіоном, але з новим керівництвом, яке навряд чи розлютить Сент-Люїс або нас. Нарешті, Річкова Ліга також пропонує надзвичайно вигідні економічні концесії, щоб продати їх тому, хто запропонує найвищу ціну, після того як Консорціум так довго відмовлявся приєднатися. На жаль, це ризикує тим, що вугілля потрапить до рук Братства."
nf_mca.83.a:0 "Війна потребує палива."
nf_mca.83.b:0 "Залишимо для себе."
nf_mca.83.c:0 "Якщо Ліга передасть щось Братству..."
nf_mca.83.e:0 "Нехай Консорціум працює під нашим контролем."

nf_mca.84.t:0 "Статті конфедерації"
nf_mca.84.d:0 "На наше здивування, революціонери з МакАртура вистояли – проти Анклаву, проти Братства, проти культів і рейдерів. Нова влада – Північна Співдружність – запрошує Бісмарк приєднатись до республіки. Це має очевидні переваги, але втрата права на самовизначення — це серйозна вимога. Що нам робити?"
nf_mca.84.a:0 "Наш девіз – Свобода і Єдність — зараз і назавжди."
nf_mca.84.b:0 "Це 1 квітня, чи що?"

nf_mca.85.t:0 "Свобода і єдність – навіки!"
nf_mca.85.d:0 "Голос Північної Співдружності став гучнішим: Бісмарк приєднався. Вперше з 2076 року Старе Знамено майорить біля міського герба над рікою. І майбутнє здається яскравішим. Хтось навіть мріє: чи не донесе Міссурі наш прапор аж до узбережжя Затоки?"
nf_mca.85.a:0 "Freiheit Über Alles!"

nf_mca.86.t:0 "Що таке кайзер, до біса?"
nf_mca.86.d:0 "Здається, Бісмарк потрапив під вплив якогось божевільного воєначальника, що зветься «Кайзер». Ймовірно, це дешевий клон Легіону Цезаря. Він відмовився приєднатися до нас, тож задля безпеки Півночі його треба усунути."
nf_mca.86.a:0 "Я досі не розумію, що за титул такий."

nf_mca.87.t:0 "Попелясте небо"
nf_mca.87.d:0 "Як лучник із натягнутим луком, шахти Дакоти завжди були напоготові перед Великою Війною. Коли настав час помсти за удари Китаю, вони випустили сотні ракет у відповідь. Проте самі ж постраждали – отруєна земля, смерть і радіація.\n\nЦерква Атома вшановувала Сяйво, але вони гралися з вогнем. Тепер [MCA.GetName] контролює ці шахти й може відновити зброю. З контролем над ракетами Чикаго нам більше не загрожує."
nf_mca.87.a:0 "Draco Dormiens Nunquam Titillandus."
nf_mca.87.a_tt:0 "\n§RАнклав буде... дуже, дуже НЕВДОВОЛЕНИЙ.§!"
nf_mca.87.a_tt:0 "§MМи обов'язково дістанемося до Чикаго, обіцяємо!§!"
nf_mca.88.t:0 "Тихе процвітання"
nf_mca.88.d:0 "Можемо трохи видихнути. Землі [CPK.GetName] розквітають, нові шахти відкриваються. Та виникає питання – чи були інші шляхи? Все ж Річкова Ліга відкрила новий порт на наших землях, і Місце Честі стає Місцем Торгівлі."
nf_mca.88.a:0 "Цілком прийнятно."

nf_mca.89.t:0 "Чуєш гудок?"
nf_mca.89.d:0 "По всій Півночі поширюється дивне відчуття. Хлопці вже не мріють про поле – їх тягне до горизонту. Дівчата, що доїли брамінів, насторожено дослухаються – щось змінюється.\n\nМіж Сталетуном і шахтами Дакоти знову рушає Північна Залізниця. Завдяки Директорці Маркгем шахти тепер копають машини. А молодь – всупереч її протестам – сідає на потяги та подорожує. Проблема майбутнього? Бо як утримати їх на фермі, коли побачили вогні Фарґо?"
nf_mca.89.a:0 "Усім на борт!"

nf_mca.90.t:0 "Війна мідних королів"
nf_mca.90.d:0 "На жаль, Історики навчають не лише консервувати та читати. Вони також викладають історію Монтанської Півночі. Майже 400 років тому, великі компанії копали надра й вивозили багатства на Схід. Незважаючи на процвітання, страйки та вибухи трудівників (можливо, натхненних Китаєм) сколихнули край. Армія США відновила порядок – мінімальні втрати, держава збережена.\n\nАле тепер шахтарі шепочуть про «профспілки» та «права». Історики знову встромляють палиці в колеса."
nf_mca.90.a:0 "Нехай бурчать."
nf_mca.90.b:0 "Заарештувати всіх анархістів."
nf_mca.90.c:0 "Припинити діяльність Істориків."

nf_mca.91.t:0 "Усі новини, які не мали б побачити світ"
nf_mca.91.d:0 "Жахливі новини! Репортер «Патріота Монтани» зафіксував, як солдати Анклаву знущались із каравану жителів Пустки. Чутки були, але тепер є фото. Газета погрожує оприлюднити матеріал. Команда Жовтень розшукує журналіста, що переховується з плівкою. Що робити?"
nf_mca.91.a:0 "§PПідкупити редакцію, щоб закрили тему.§!"
nf_mca.91.b:0 "§RНавіщо ховати статтю, якщо можна сховати журналіста?§!"
nf_mca.91.c:0 "§MБратство, мабуть, викрало плівку та журналіста!§!"
nf_mca.91.c_tt:0 "\n§gАле... з якого це часу Братство захищає жителів Пустки?§!"

nf_mca.92.t:0 "АВІАБАЗА МАЛМСТРОМ ВІДНОВЛЕНА! [MCA.getleader] ВІТАЄ ПЕРШИЙ ВИПУСК"
nf_mca.92.d:0 "Місяцями об’єкт Малмстром вважали занедбаним. Читачі «Патріота» пам’ятають матеріал про журналіста, що підхопив правець на цій базі (див. «Ржаві Заклепки – Ресурс чи Ризик?»). Але сьогодні таємниці розкрито – [MCA.getleader] дозволив ексклюзивне інтерв’ю з першими випускниками за 200 років.\n\nКлас 2276-го (на честь річниці США) включає льотчиків Ньюсома, Стоуна та Філпота. Керує ними старшина Торвальд Волд – ветеран повітряного бою.\n\n«Ці хлопці та дівчата – важкі кадети. Ще кілька тижнів симуляцій і ретельне навчання на наших небагатьох вертибердах – і будуть асами за чотири місяці.»\n\nХоча Малмстром славився ядерними ракетами Minuteman IX, жодної з них не знайдено. Але анонімний боєць Команди Жовтень заявляє: знайдено тіла спецпризначенців із електронними ключами. Можливо, таємний арсенал ще буде відкрито."
nf_mca.92.a:0 "Ширлі Купер – військовий кореспондент"

nf_mca.93.t:0 "АМЕРИКАНСЬКИЙ ВПЛИВ ПОВЕРТАЄТЬСЯ ДО КАНАДИ"
nf_mca.93.d:0 "Минулого тижня під час конференц-дзвінка з Віндіпегом [MCA.GETLEADER] узгодила історичну угоду про дирижаблі з лідером Канадарії [WPG.GetLeader]. Журналіст відзначив: «Її акцент було важко зрозуміти, але коли згадали про капси – все стало ясно.»\n\n[MCA.getleader] сказала: «На щастя, добрі канадійці правильно оцінили нашу пропозицію.» Сьогодні в небі з’явились повітряні кораблі, зокрема – велетенський «Аврора», повністю американського виробництва. Його очолить фанат авіації – Голово-Повний-Повітря, біженець із Шторм-Монґерів.\n\nВид, сила й доблесть Повітряного Флоту МакАртура нагадають усім: Монтана – найкращий куточок раю."
nf_mca.93.a:0 "Бред Біґлі – економічний кореспондент"

nf_mca.94.t:0 "ХУЗЕРИ ЗАГРОЖУЮТЬ АМЕРИКАНСЬКОМУ НЕБУ"
nf_mca.94.d:0 "Незважаючи на зусилля, канадійці відмовились від угоди з [MCA.GetLeader]. Зі слів репортера, який перебував на місці переговорів між нашим лідером та їхніми купцями, випливає, що мешканці Трьох Річок засуджують ідеї капіталізму, демократії та навіть — що є шокуючим, але дивним поворотом подій — яблучного пирога. Схоже, знову [MCA.GetName] залишилась наодинці серед мутантів Пустки."
nf_mca.94.a:0 "Бред Біґлі – економічний кореспондент"

nf_mca.95.t:0 "Зниклі"
nf_mca.95.d:0 "Команда Жовтень отримала дивне прохання – група матерів, дружин і сестер засуджених, відправлених на Схід, звернулася з проханням дізнатися, куди поділись їхні рідні. Хоча [MCA.GetLeader] запевняє, що з трудовими призовниками все гаразд, їхні родини не отримували жодних звісток протягом місяців. Можливо, час розвіяти чутки?"
nf_mca.95.a:0 "Ми що, кур’єрська служба?"
nf_mca.95.b:0 "Покладемо край цим чуткам."

nf_mca.96.t:0 "Де ти тепер?"
nf_mca.96.d:0 "Першим, кого навідала Капрал, був відставний офіцер у поселенні ветеранів в Орлиному Притулку. На жаль, час був нещадний – четверта пляшка синт-спирту за день.\n\nВона зайшла, у брудному мундирі. \"Ти ж знаєш, що цим не сп’янієш?\"\n\n\"Навколо все фальшиве. То чому б і мені не прикинутись?\" – відповів він. \"Це по справі Полковниці? Чи просто так?\" Він посміхнувся... і звалив свого містера Хенді. \"Дідько!\"\n\nМарта сіла. \"Деякі родини хочуть дізнатися, куди ділись їхні близькі. Ти займався розподілом ресурсів. Але немає записів, куди саме ви поділись.\"\n\nРуки старого тремтіли. Вона стиснула щелепу. \"Ти винен мені з Трьох Річок, Лайонеле.\"\n\nВін зітхнув: \"Я старий і нікчемний, Капрал. Що я маю з того, що розповім?\""
nf_mca.96.a:0 "\"Хочеш забути – спробуй щось міцніше.\""
nf_mca.96.b:0 "\"Ти служив нації – то послужи й Жовтню.\""
nf_mca.96.c:0 "§R\"Пам’ятаєш, що ти тоді зробив? А хто ще пам’ятає?\"§!"

nf_mca.97.t:0 "Батьку мій, скажи, де ти був?"
nf_mca.97.d:0 "Анклав любить креслити лінії, думаючи, що папір – це влада. Але це не про Північ. Лайонел знав лише натяки – якийсь проєкт про Рай на Землі. Але він вказав на одне місце, де можна знайти правду: вільне місто Річкової Ліги – Сент-Луїс.\n\nВони летіли над Вайомінгом, минаючи заражені землі, й зупинились поблизу греблі Оахе. Марта гортає папери, їсть «Веселий Пиріг», і раптом задумується: навіщо жителям Пустки щеплення?\n\nІ все ж, дані не підтверджували чуток – ніхто не жертвував призовниками. А справжні відповіді чекали попереду: у Чикаго, де сяяли холодні вогні та усміхались привітні люди."
nf_mca.97.a:0 "А що таке контрольна група, до речі?"

nf_mca.98.t:0 "Звідки ти прийшов, куди пішов?"
nf_mca.98.d:0 "Чикаго – блискуча пляма Пустки. Місто комфорту й відновлення, з натяком на обіцяну Америку майбутнього.\n\nТам Команда Жовтень знайшла більшість призовників. Ті, з ким говорила Марта, були ситі, мали медичну допомогу, тепло та воду. Вони казали, що мали б багатство, якби таке було вдома.\n\nАле деякі зникли. Один робітник згадав – їх відправили на лікування раку у «Согатак». Дбайливо, еге ж?\n\nМарта гортає Піп-Бой, смакуючи вечерю в барі. Чому ж у базі даних немає Согатаку?"
nf_mca.98.a:0 "Мабуть, цього досить... наразі."

nf_mca.99.t:0 "Прощавай"
nf_mca.99.d:0 "Годинник цокав, поки лікар у стерильному халаті читав результати. Червоне світло – вирок: рак невиліковний. «Можливо, якби ми виявили раніше... хоча й тоді...», – зітхнув він. «Мабуть, робота на Заході мала генетичні наслідки. Але Dulce et decorum est pro patria mori, так?»\n\n\"Я вмираю, а Чикаго досі говорить латинню – мертвою, як і Китай,\" – подумала вона. \"Ми створили Велику Справу, Горріґанів і Ванамінґо... а рак не можемо вилікувати?\"\n\n\"Може, час піти у відставку й повернутись у Чикаго? Ви заслужили спокій,\" – сказав лікар, склавши окуляри.\n\n\"Хіба не час новому поколінню взяти кермо?\""
nf_mca.99.a:0 "\"Ні. Я ще жива.\""

nf_mca.100.t:0 "Американці завжди боротимуться за свободу"
nf_mca.100.d:0 "Кажуть, Америка померла у Великій Війні. Але це – брехня. Бо люди Пустки довели – Америка живе.\n\nУ Каліфорнії – держава законів. У Співдружності – Мінітмени на Бункер-Гілл. У Столиці – раби моляться Лінкольну, мріючи про волю.\n\nА сьогодні, після довгих суперечок, Рокі-Маунтська Конференція дійшла згоди. Більше немає солдатів Анклаву, шахтарів, фермерів і сектантів. Є мрія – з глибини століть, і на віки вічні.\n\nУ Рокі Маунтінс над краєм вільних і домом хоробрих знову майорить Прапор."
nf_mca.100.a:0 "Прошу встати для виконання гімну."

nf_mca.101.t:0 "Люди минають, але земля триває"
nf_mca.101.d:0 "Кажуть, тіло Полковниці знайшли за столом із опіком від плазми. А може, вона втекла на Південь у пошуках ліків? А може, спить у кріокапсулі до темних часів.\n\nАле найчастіше – мовчання. Бо Чикаго каже чітко: смерть Полковниці – трагедія, та можливо, на краще. Вона стала надто м’якою. Потрібна тверда рука. Горріґан загинув? Але ж він не був єдиним суперсолдатом.\n\nАнклав – на піку могутності. Велика Справа – майже завершена."
nf_mca.101.a:0 "Боже, благослови Анклав."
nf_mca.101.a_tt:0 "Прихильники жорсткої лінії в анклаві захоплять владу!"

nf_mca.102.t:0 "Нарешті, хтось почав думати!"
nf_mca.102.d:0 "Ми отримали вигідну пропозицію від Анклаву. Це ніхто не побачить, тож просто погодьмося."
nf_mca.102.a:0 "Гаразд!"
nf_mca.102.b:0 "Анітрохи!"

nf_mca.103.t:0 "Вони обрали смерть!"
nf_mca.103.d:0 "З невідомих причин, Ротпурґери відкинули нашу щиру пропозицію. Що ж – доведеться знищити їх. Таке життя."
nf_mca.103.a:0 "Вони все одно були мутантами."

nf_mca.104.t:0 "Далеко на півночі, землі рейдерів, ванамінґо і культових хрестових походів"
nf_mca.104.d:0 "Хоча доля наших ворогів більш-менш відома, захоплення Джексонів викрило тривожну деталь – їхній ватажок твердить, що ніколи не намагався захопити владу в Монтані. Ніл заявляє, що його вигнали лише за вимогу відновлення демократії, чого Полковниця не терпіла. Це ставить нас перед дилемою: він стверджує, що не зробив нічого, чого не зробили Еллен і Перші Родини – просто випередив час. Тепер Джексон вимагає повного помилування, інакше обіцяє оприлюднити записи зустрічей із Полковницею.\n\nЦе не знімає з Джексонів провини за грабунки, вбивства й інші злочини з 2264 року. Але ця історія може сильно похитнути нашу легітимність. Ситуацію ускладнює питання щодо інших захоплених банд. Можливо, з цього уламку ще щось можна врятувати?"
nf_mca.104.a:0 "Скинути його з Вертоптаха"
nf_mca.104.b:0 "Можна обговорити громадські роботи."

nf_mca.105.t:0 "Вояки одного дня"
nf_mca.105.d:0 "Після перемоги [MCA.GetName] у нас надто багато полонених, і треба вирішити їхню долю. Старий поганий Анклав стратив би їх за 'зраду' уряду, про який вони й не чули. Але ми – інші.\n\nЄ два варіанти: ці хлопці й дівчата можуть піти на службу в армію, заслуживши свободу. Або ж відпустити їх і сподіватися, що це спростить інтеграцію зайнятих територій. Яке рішення ухвалить Губернатор?"
nf_mca.105.a:0 "Служба гарантує... щось, зрештою."
nf_mca.105.b:0 "Щоб знищити ворога – зроби його другом."
nf_mca.105.b_tt:0 "\n§gЗменшує вартість інтеграції територій [JCK.GetNameWithFlag], [BTH.GetNameWithFlag] і [MET.GetNameWithFlag].§!\n"

nf_mca.106.t:0 "Остання воля і заповіт"
nf_mca.106.d:0 "Жахлива новина! «Патріот Монтани» надрукував так званий «Епітафій Останніх Американців» – маніфест Джексонів проти Полковниці. У ньому її звинувачують у страшних злочинах: використанні рабської праці, експериментах з вендінґо та ванамінґо на користь таємних проєктів Анклаву. Це збурення викликало недовіру не лише до неї, а й до Марти: якщо мати була такою, чи можна довіряти доньці?"
nf_mca.106.a:0 "Перша поправка? Гірша поправка."

nf_mca.107.t:0 "Тестові об’єкти здобуто"
nf_mca.107.d:0 "Перехоплений вантаж на шляху до Пограниччя виявився... цікавим. Шість юних ванамінґо з біосигнатурами Ініціативи було захоплено силами Анклаву в Канзасі. Навіщо Ініціатива їх вела – невідомо, та й не важливо.\n\nГоловне, що Чикаго тепер має зразки. І замість тримати їх у камері, пропонують провести польовий тест – випустити істот на ворожу або нейтральну територію. Чикаго пильно стежитиме: як вони рухаються, вбивають і помирають.\n\nСусідам це не сподобається, але це шанс довести ефективність довоєнної біозброї. А ще – відібрати іграшки у Ініціативи."
nf_mca.107.a:0 "Проведемо випробування. Тихо."

nf_mca.108.t:0 "Інопланетяни?"
nf_mca.108.d:0 "Щось жахливе коїться, [ROOT.GetLeader]. Потвори з отруйними щупальцями і голими іклами нападають на окраїни та патрулі. Вони поширюють радіацію, наче живляться гниллю Пустки. Хто ці істоти? І чи залишать вони нас у спокої?"
nf_mca.108.a:0 "З якого світу ці потвори прийшли?"

nf_mca.109.t:0 "Удар по електричному ланцюгу, що зв’язує нас темрявою"
nf_mca.109.d:0 "Влада – не лише в рушниці. Інколи вона – у станції. Чикаго контролювало Монтану, даючи струм Першим Родинам. Але коли Проєкт Гефест перейшов до регіональних еліт, ті здобули нову впевненість. Тепер Перші Родини готові протистояти Чикаго."
nf_mca.109.a:0 "Ми ще допоможемо біженцям. Колись."

nf_mca.110.t:0 "Вірні своїм панам"
nf_mca.110.d:0 "На жаль, Лакотські допоміжні війська приєдналися до Чикаго. Вочевидь, їм миліше підкорення далекому володарю, ніж наша спільна боротьба."
nf_mca.110.a:0 "Але чому ж вони так вчинили?"

nf_mca.111.t:0 "Вірні своїм панам"
nf_mca.111.d:0 "На жаль, Лакотські допоміжні війська приєдналися до Чикаго. Вочевидь, їм миліше підкорення далекому володарю, ніж наша спільна боротьба."
nf_mca.111.a:0 "Але чому ж вони так вчинили?"

nf_mca.112.t:0 "Злам PoseidoNet!"
nf_mca.112.d:0 "Виявляється, нарощення мережевих каналів із Чикаго – не найкраща ідея під час війни. Чикаго відключило наші з’єднання й зламало дані Співдружності! Революція виявилася складнішою, ніж ми думали."
nf_mca.112.a:0 "Навіть зараз Анклав душить Монтану."

nf_mca.113.t:0 "Підкріплення з Чикаго"
nf_mca.113.d:0 "Добра новина: відновлення бази Мальмстром дало Чикаго плацдарм на північному заході. Погана новина: тепер у них більше логістичних можливостей для вторгнення. І вони вже готуються."
nf_mca.113.a:0 "Мене вже дістали ці наслідки моїх дій."
nf_mca.113.a_tt:0 "\n§PЛоялісти Чикаго отримають додаткові підрозділи. Подорож закінчена, мутанте.\n§!"

nf_mca.114.t:0 "Лев, чаклунка та плазмова гвинтівка"
nf_mca.114.d:0 "Хоча Лакота обрали Чикаго, а Вартові – нейтралітет, деякі з Вашингтона боротимуться за правду. Друзі Команди Жовтень – Левове Серце – долучаються до революції.\n\nНа папері вони мають спільне з Жовтнем. Але чи не стане це прецедентом? Бо хоч [MCA.GetLeader] не упереджена до радіаційно змінених, багато хто в Монтані – так. Вибір працювати з гулями проти Анклаву формує майбутнє Півночі."
nf_mca.114.a:0 "Цей гуль боровся за Америку більше, ніж Чикаго."
nf_mca.114.b:0 "Будьмо просто друзями."
nf_mca.114.a_tt:0 "\n§MКоли спалахне війна, тобі знадобиться вся допомога – і ти її отримаєш.\n§!"

nf_mca.115.t:0 "Сальваторе залишається з нами"
nf_mca.115.d:0 "Перед загрозою закону та порядку не дивно, що Сальваторе вирішив укласти угоду з Командою Жовтень. У державі з бараками та окомеханами на кожному розі нема місця для поважного підприємця, як він, а квоти шкодять йому так само, як і всім заможним жителям Монтани. Незважаючи на нашу неприязнь до його торгівлі джетом, схоже, ми маємо (не)бажаного союзника проти Чикаго."
nf_mca.115.a:0 "Може, він і гангстер, але американський гангстер."

nf_mca.116.t:0 "«Патріот Монтани» промовляє!"
nf_mca.116.d:0 "                                     ДЕ НАШІ ДІТИ?\n\nПростий заголовок, що луною розходиться по Півночі гучніше, ніж рик когтя смерті. «Патріот Монтани» публікує свій останній звіт. Газета, здається, вислизнула з повідка. Її журналістам замало прогнозів погоди й пропаганди – тепер вони ставлять питання про поведінку Анклаву. Чорно-білі світлини з розстрілів на першій шпальті, підозри щодо нової 'вакцини', і – головне – список тих, кого відправили на Схід, але про кого Монтана більше не чула.\n\nАнклав палить кожен примірник, який знаходить. Але по всій Півночі родини усвідомлюють – вони не одні. Це не поодинокі випадки. Це – загроза для всіх Пусток."
nf_mca.116.a:0 "Але ж Чикаго сказало, що з ними все гаразд!"

nf_mca.117.t:0 "О, дитино моя"
nf_mca.117.d:0 "Це могло бути ще одне криваве зіткнення, одна з багатьох сутичок, що тримають Пустку в циклі війни. Але хоч раз, у цьому закутку Америки, всі вижили.\n\nЕлектрика дала Першим Родинам впевненість, аби поставити під сумнів гніт Чикаго.\n\n«Патріот Монтани» доніс правду про звірства Анклаву до ізольованих ферм та містечок, об’єднавши опір.\n\nНапад ЛайонГарта знищив вертоптахи на заправці, унеможлививши переворот.\n\nА Сальваторе? Кажуть, саме він накачав Джонсона наркотиками.\n\nОпинившись у меншості, Полковниця відмовилась помирати за безнадійну справу. Можливо, вона сказала це найкраще:"
nf_mca.117.a:0 ""Я ненавиджу громадянські війни.""

nf_mca.118.t:0 "Наркобізнес"
nf_mca.118.d:0 "Після смерті Сальваторе торгівля наркотиками й рабами тільки зросла. Без одного ватажка зросло насильство між бандами та дилерами. Попри наші намагання, багато хто в Монтані боїться нового хаосу. Це лише посилює хватку Чикаго над вільним північчю."
nf_mca.118.a:0 "... Може, й мені трохи джету не завадить."

nf_mca.119.t:0 "Знову війна"
nf_mca.119.d:0 "Схоже, в цій частині Америки хтось таки став проти Анклаву. Фермери витягують рушниці зі сховків; допоміжні війська дезертирують і стають під стяг Жовтня; найманці Перших Родин готуються. Хто переможе – борці за свободу, чи машина війни з найновішою зброєю в Пустках?\n\nПодивимось."
nf_mca.119.a:0 "Сила народу здолає силу вогню!"
MCA_chicago_reinforcements_tt:0 "\n§RОскільки ви відновили Мальмстром, Анклав може надіслати підкріплення!\n§!"
robot_reliance_tt:0 "\n§PПам’ятаєш тих окомеханів? Тепер вони служать Чикаго.\n§!"
recruitment_tt:0 "\n§MТи ж не думав, що *все* обернеться погано, так?\n§!"

nf_mca.121.t:0 "Всі люди створені рівними, тож додамо гулів у продовження"
nf_mca.121.d:0 "Уявити, що хтось із Анклаву – навіть така віддана Вигнанцям, як Марта – підтримає гулів, здавалося б абсурдним. У більшості Монтани їх терпіти не могли – кому сподобається сусід, що їсть мізки?\n\nАле підтримка ЛайонГарта змінила думки. Було природно, що нова держава визнає гулів. У Міссулі та [MCA.GetName] значення свободи знову розширюється."
nf_mca.121.a:0 "Боже, благослови Америку."

nf_mca.122.t:0 "У конституції про гулів – ні слова"
nf_mca.122.d:0 "Монтана – для порядних людей, і в цьому проблема. [MCA.GetName] не буде винищувати гулів, але їхній сморід нагадує людям про руїну після війни. Краще їм іти далі. Згодом гулі знатимуть – Монтану краще оминати, особливо після заходу Сонця."
nf_mca.122.a:0 "Не всі погляди Анклаву були помилковими."

nf_mca.123.t:0 "Поливання дерева свободи"
nf_mca.123.d:0 "Чикаго зробило фатальну помилку. Дозволивши Команді Жовтень блукати Пусткою, вони дали Марті шанс створити союзників. Тепер її прихильники по всій країні нападають на наші постачальні лінії. Ми вбиваємо десятки за кожного бунтівника – та в снігах завжди є ще один, тринадцятий. Це не просто повстання – це революція."
nf_mca.123.a:0 "Чим вона займалась під час своїх пригод?"

nf_mca.124.t:0 "Пам’ятаймо нашу історію"
nf_mca.124.d:0 "Одна з причин напружених відносин між Істориками та Макартуром полягала в тому, що вони знали занадто багато. Довоєнна Америка – це не лише країна яблучних пирогів, а й табір Тертлдав і збір мозку. Тож, коли Макартур крутив веселі пісеньки на «Радіо Анклаву», ті, хто навчав ротації посівів та миттю рук, ще й розповідали про гріхи нації. Напружене сусідство, безумовно.\n\nЗараз Північна Співдружність простягається трохи далі, а поселення, які охороняють Історики, наближаються настільки, що нам доводиться замислитися над загальною картиною. Чи є місце для Істориків у майбутньому Америки?\n\nВони, ймовірно, вимагатимуть, щоб правду про старий світ викладали по всій країні, як вони й намагалися робити досі, і вони також не відмовляться від своєї автономії повністю."
nf_mca.124.a:0 "Діти – наш найцінніший ресурс після вугілля!"
nf_mca.124.a_tt:0 "\n§MДоступно, бо ви підтримали Істориків.§!"
nf_mca.124.b:0 "Це не варто зусиль, але ми вас захистимо."

nf_mca.125.t:0 "Пам'ятаючи нашу історію"
nf_mca.125.d:0 "Сьогодні надійшло повідомлення, передане нашими радниками з Анклаву. Хоча ми знали, що на заході відбулися серйозні зміни, ми не були впевнені, що саме сталося, та й офіцери, які застрягли тут, теж не знали напевно, поки в Ветфорді не приземлився гвинтокрил.\n\nНовий '[MCA.GetName]', очевидно, намагається загладити провину за те, що Анклав робив у минулому, особливо щодо ксенофобії, і запропонував Історикам місце у своїй мережі, поки вони рухаються до відбудови Америки на її початкових принципах.\n\nДехто відкидав думку про те, що Анклав взагалі здатний змінитися, але, судячи з усього, вони вже намагаються взяти на себе відповідальність, і хіба не правильно дати людям другий шанс?"
nf_mca.125.a:0 "Можливо, історія не повториться, якщо ми допоможемо?"
nf_mca.125.b:0 "Це не варто зусиль."

nf_mca.126.t:0 "Об’єднані що тепер?"
nf_mca.126.d:0 "[NCR.GetLeader], вертоптах викликає дозвіл на посадку біля Шейді-Сендс! Вони стверджують, що прибули з Монтани та зацікавлені в торгівлі й дипломатії. За словами їхнього посла, вони представляють коаліцію міст, що колись були під владою Анклаву, але скинули ярмо гноблення. Як і ми, вони вважають себе спадкоємцями Сполучених Штатів, відданими боротьбі з тиранією та Братством Сталі в Пустках.\n\nА ще вони принесли кошик фруктів. І деякі з них ми ніколи раніше не бачили – спадщина науки Анклаву, кажуть."
nf_mca.126.a:0 "Я не можу ненавидіти народ, який здолав Анклав."
nf_mca.126.b:0 "Це пастка Анклаву! Вбийте їх! І заберіть ананаси!"

nf_mca.127.t:0 "Каліфорнізація"
nf_mca.127.d:0 "Зустріч у Шейді-Сендс була продуктивною. Хоч ми й надто далекі для частих контактів, [NCR.GetLeader] відправив нам делегацію на їхньому федеральному вертольоті. Також кілька Рейнджерів зголосились допомагати Команді Жовтень у патрулюванні Півночі. Дехто навіть говорить про можливість спільної наради республік Пусток щодо торгівлі, оборони та іншого. Але які шанси?"
nf_mca.127.a:0 "Ну... з часом усе можливо."

nf_mca.128.t:0 "Каліфорнія відмовляє нам!"
nf_mca.128.d:0 "Каліфорнія вкрала наш вертоптах і викрала нашу делегацію. Що за чортівня?!"
nf_mca.128.a:0 "Це була б війна, якби ми були ближче!"

nf_mca.129.t:0 "Мутанти-десантники дезертують!"
nf_mca.129.d:0 "Полковниця безглуздо дозволила жителям Пустки служити Анклаву, вважаючи, що краще вже їхні життя, ніж наших. І подивіться, що тепер! Після її усунення більшість військ відмовилась здатися та приєдналась до її бунтівної доньки. Але ти ж знаєш, як ми ставимось до зрадників, так? Як і до Братства."
nf_mca.129.a:0 "Шкодую, що у них лише одне життя для Батьківщини."

nf_mca.130.t:0 "Повстання Перших Родин"
nf_mca.130.d:0 "Полковниця безглуздо дала Перших Родинам владу та зброю, дозволивши їм створювати загони. І тепер ці війська – разом із Командою Жовтень. Після всього доведеться їх знищити, зате нашим відданим солдатам буде премія."
nf_mca.130.a:0 "Шкодую, що у них лише одне життя для Батьківщини."

nf_mca.131.t:0 "Мутанти-десантники дезертують!"
nf_mca.131.d:0 "Полковниця безглуздо дозволила жителям Пустки служити Анклаву, вважаючи, що краще вже їхні життя, ніж наших. І подивіться, що тепер! Після її усунення більшість військ відмовилась здатися та приєдналась до її бунтівної доньки. Але ти ж знаєш, як ми ставимось до зрадників, так? Як і до Братства."
nf_mca.131.a:0 "Шкодую, що у них лише одне життя для Батьківщини."

nf_mca.132.t:0 "Дивно, що усі на півночі літають, чи не так?"
nf_mca.132.d:0 "Бунтівники в Монтані називають себе [MCA.GetName] – заради правди, справедливості й способу життя Пустки. Наївна мрія, але потенційна вигода. Звільнившись від колоніального Чикаго, вони шукають нові ринки і пропонують нам авіабазу в Макартурі як центр маршруту на Північ."
nf_mca.132.a:0 "Їхні кришки – не гірші за чужі. Дамо їм шанс."
nf_mca.132.b:0 "У нас інші пріоритети. Ми не довіряємо Америці."

nf_mca.133.t:0 "Дирижаблі заради вигоди"
nf_mca.133.d:0 "Орлина Скеля погодився розширити торгівлю з Монтаною. Хоча вони не приєднуються формально, та все ж стають союзником. Вже зараз їхні повітряні судна курсують небом, трохи ближче єднаючи Північ."
nf_mca.133.a:0 "Добре, що вони опанували дирижаблі до війни."

nf_mca.134.t:0 "Дирижаблі – це й так дурня"
nf_mca.134.d:0 "Орлина Скеля відмовився від торгівлі, вважаючи наші амбіції загрозою. Ну й нехай. У нас літаки – кращі за їхні дирижаблі."
nf_mca.134.a:0 "Підемо покуримо коло їхнього порту – з принципу."

nf_mca.135.t:0 "Марш роботів"
nf_mca.135.d:0 "Після Рекультивації Апалачії Анклав використовував роботів для патрулювання. Хоч про долю Вайтспрінґу ми не говоримо, принцип той самий. Окомехани, що підпорядковуються Секретареві Внутрішніх Справ, патрулюватимуть Пустку, забезпечуючи безпеку нашого куточка раю.\n\nВикористовуйте функцію в інструменті провінцій – значок бункеру.\n\n\nПам’ятайте – ми наглядаємо за вами!"
nf_mca.135.a:0 "§RБоже, благослови Анклав.§!"

nf_mca.136.t:0 "Бери рушницю – та йди!"
nf_mca.136.d:0 "                   'Хвилини не гай, Хуане\n                   Батьківщина кличе – йди.\n                   Не бійся за нас чи дітей, Хуане\n                   Я подбаю про них, йди.\n                   Бери рушницю, Хуане\n                   Так, бери й іди.\n                   Рут веде браміна, Хуане\n                   І я копати зумію.\n                   В армії немає ковдр, Хуане\n                   То візьми цю, мою.\n                   Я її ще дівчиною шила\n                   З вишивкою в кутках.\n                   Ім’я моє тут, подивись\n                   У холодній землі вона буде гріти\n                   Бо зроблена моїми руками.' \n\n– «Пісні Революції», [GetYear]"
nf_mca.136.a:0 "§MДякувати Богу, що ми підготували народне ополчення.§!"

nf_mca.137.t:0 "Агент Сігма"
nf_mca.137.d:0 "Канада була американським скарбом ще до Великої Війни – багатою на вугілля, газ, воду та інші ресурси. Тож не дивно, що ці блага відіграють роль у планах Анклаву, хоч іще не до кінця зрозуміло яку. Поки що агент Сігма шпигує у Замерзлій Півночі. Але чи варто зробити з нього більше, ніж просто шпигуна? Можливо, настане час допомогти. Адже з багатств Канади ми зможемо зробити більше, ніж якийсь божевільний гуль-король."
nf_mca.137.a:0 "Очікуємо подальших наказів."

nf_mca.138.t:0 "¡Como Estas, Amigos!"
nf_mca.138.d:0 "До нас дійшли новини з Півночі – виявляється, Монтана теж мала проблеми з тими cucarachas, але їм вдалося вигнати їх. Тривожно бачити, як Анклав простягнув свої щупальця від Замерзлої Півночі до Армагеддон-Стейшн, але, можливо, їхня поразка надихає. Хто зна? Можливо, колись усі ми разом звільнимо Середній Захід. І хоч поки прямий зв’язок неможливий, безпечний Міссісіпі змінив би все."
nf_mca.138.a:0 "Чесно, з Чикаго явно щось не так."

nf_mca.139.t:0 "Мексиканські канікули"
nf_mca.139.d:0 "Натхненна перемовинами з Республікою Ріо Ґранде, Команда Жовтень вирушила у свою найбільшу пригоду – мандрівку до Мексики! Вони принесли жертву в піраміді Мемфіса; звільнили рабів у лігвищах Супермутантів Озарксу; й зафіксували дані про бункери Братства в Сент-Луїсі. І все це, щоби дістатися до Серпантинного Міста й узбережжя.\n\nПісля вечері з гумбо зі Смертокігтя, вони вирушили до Рейносі, а тоді в Глорію, де зустрілися з [RRG.GetLeader]. Було обговорено цікаві ідеї – можливо, одного дня ми утворимо союз задля очищення Пустки. А поки – культурний обмін збагатив нас обох, і ми прихопили кілька сувенірів."
nf_mca.139.a:0 "Час для нової виставки в музеї Боземана!"

nf_mca.140.t:0 "Мексиканські канікули"
nf_mca.140.d:0 "Натхненна перемовинами з Республікою Ріо Ґранде, Команда Жовтень вирушила у свою найбільшу пригоду – мандрівку до Мексики! Вони принесли жертву в піраміді Мемфіса; звільнили рабів у лігвищах Супермутантів Озарксу; й зафіксували дані про бункери Братства в Сент-Луїсі. І все це, щоби дістатися до Серпантинного Міста й узбережжя.\n\nПісля вечері з гумбо зі Смертокігтя, вони вирушили до Рейносі, а тоді в Глорію, де зустрілися з [RRG.GetLeader]. Було обговорено цікаві ідеї – можливо, одного дня ми утворимо союз задля очищення Пустки. А поки – культурний обмін збагатив нас обох, і ми прихопили кілька сувенірів."
nf_mca.140.a:0 "Час для нової виставки в музеї Боземана!"

nf_mca.141.t:0 "Перші вибори за 200 років"
nf_mca.141.d:0 "Завершено роботу Скельного Конгресу, і тепер можуть пройти перші вільні вибори в Америці з 2060-х років. Хто ж поведе Великий Експеримент у майбутнє? Схоже, всі, з ким Команда Жовтень колись мала справу, хочуть взяти участь.\n\nТа незалежно від того, чи президентом стане власник казино, заводський директор, голос рівнинних племен чи лідер останньої вільної держави Маршалл – усі погоджуються: краще ця плутанина, ніж Анклав. За вибори – й усі майбутні!"
nf_mca.141.a:0 "Процвітання Стілтауну – наш орієнтир"
nf_mca.141.b:0 "Перший у війні, перший у мирі, перший у серцях Співдружності."
nf_mca.141.c:0 "Сальваторе – приклад успішного біженця."
nf_mca.141.e:0 "Хани – голос забутих історією."
nf_mca.141.f:0 "Перші Родини поведуть нас уперед."
nf_mca.141.g:0 "Полковниця зцілила наші серця, а еколог – зцілить землю."

 nf_mca.142.t:0 "Пункт 2.11, абзац 3"
 nf_mca.142.d:0 "Почувся глухий гул, коли комунікаційне обладнання, що не працювало десятиліттями, раптом ожило. Першою думкою Пенні, звісно, було те, що Акціонери хочуть поговорити з нею про якесь порушення, але саме тоді на екрані з'явилася жінка. Вона була старшою, її волосся сивіло, а значок на куртці видавав її мету: Америка.\n\n«Пенні...» — вона говорила так, ніби дуже втомилася, — «За наказом Сполучених Штатів Америки, під егідою міністра внутрішніх справ, я цим вимагаю від вас відмовитися від автономної діяльності та розпочати роботу під безпосереднім наглядом Окупаційного уряду, відповідно до пункту 2.1...» Вона продовжувала, але Пенні вже не слухала.\n\nВона точно знала, яку саме частину контракту Міддлмарка зі США їй зачитували, вона вивчила його весь від початку до кінця. І все ж було сюрреалістично чути, як його нарешті застосовують, це здавалося перевіркою, але вона розуміла, що це не так. Їй доведеться все реорганізувати, і поки Сантьяго продовжувала читати, її осяяло нове усвідомлення.\n\nВід «Прорахунків» доведеться позбутися, якщо вона збирається дотримуватися контракту. Хоч вони й могли бути корисними, юридично вони все ще вважалися канадськими анархістами..."
 nf_mca.142.a:0 "Але чи справді вони були такими корисними?"
 nf_mca.142.b:0 "Ні! Ми вірні нашим співробітникам!"

 nf_mca.143.t:0 "Пункт 2.11, абзац 4"
 nf_mca.143.d:0 "Ми спробували вийти на зв'язок з Пенні та супермаркетом Міддлмарк у Калгарі. Хоча наші повідомлення й дійшли, ми не отримали жодної відповіді. Ми можемо лише припустити, що Міддлмарк відхилив наш запит, і тепер маємо перейти до абзацу 4.\n\n«Якщо сторона, що підписала контракт (Корпорація Міддлмарк (c)), не виконає вимоги Уряду Сполучених Штатів щодо співпраці, вона підлягатиме аудиту і, потенційно, повному закриттю»."
 nf_mca.143.a:0 "Перейдімо до аудиту."

 nf_mca.144.t:0 "Ми з Уряду"
 nf_mca.144.d:0 "Почувся глухий гул, коли комунікаційне обладнання, що не працювало десятиліттями, раптом ожило. Першою думкою Пенні, звісно, було те, що Акціонери хочуть поговорити з нею про якесь порушення, але саме тоді вона почула гучний голос з того боку. Було важко розгледіти деталі його зовнішності, але звучав він могутньо.\n\n«Автоматизована система управління Міддлмарк. За наказом Анклаву, відступити. Ми є законними спадкоємцями Уряду Сполучених Штатів, і наша місія — умиротворення Пустки Альберти. Ви повинні надіслати нам сигнал на знак того, що розумієте як свою, так і нашу мету, після чого негайно усунути будь-який мутований персонал, що наразі 'працевлаштований'. У вас є п'ять секунд на виконання».\n\nДумки Пенні плуталися. Американський Уряд справді був тут після стількох років. Вона завжди пишалася тим, що є американською компанією, і не хотіла розчаровувати їх тепер, коли вони повернулися, але щось не давало спокою у глибинах її банків пам'яті. Що таке Анклав? І кого вони класифікуватимуть як Мутантів?"
 nf_mca.144.a:0 "Я впевнена, вони мають добрі наміри!"
 nf_mca.144.b:0 "Прорахунки занадто корисні, щоб ними ризикувати."

 nf_mca.145.t:0 "Ми лише хотіли допомогти"
 nf_mca.145.d:0 "Ми надали ШІ Міддлмарка достатньо часу, щоб відповісти на наше повідомлення. Враховуючи тишу, що запанувала у відповідь, було лише два можливі сценарії: Автоматизований менеджер Міддлмарка був зламаний, або ж він вирішив, що його 'співробітники' цінніші за зобов'язання перед Американським урядом.\n\nУ будь-якому разі, ми не маємо часу на зволікання. Хто знає, якої шкоди вони можуть завдати з ресурсами, що знаходяться у розпорядженні Міддлмарка."
 nf_mca.145.a:0 "Що ж. Ми намагалися."
  
