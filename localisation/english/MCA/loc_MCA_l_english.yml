MCA_ecologist_desc:0 "Підтримка Сі-Бастіона для Возз’єднаних Штатів стала несподіванкою; але, враховуючи підтримку Народу Півночі з боку Загону Жовтня, кого це здивує? Під проводом Президента Сі-Бастіона, можливо, Північ знову стане тим раєм, яким колись була. І посіяне насіння проростає у вільній землі."

