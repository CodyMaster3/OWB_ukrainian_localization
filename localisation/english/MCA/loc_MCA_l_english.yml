### MCA_COM_CANADA_PUPPET
MCA_CANADA_NAME:0 "Перехідна Канадська Рада"
MCA_Canada_desc:0 "Сформована з місцевих канадських колаборантів, аркадійців з центральної Альберти та реорганізованих солдатів, які залишились у Ред-Дірі, нова Рада прагне перетворити Канаду на вільну, демократичну республіку у співпраці з урядом США на півдні. Чи увінчається їхнє прагнення успіхом – ще належить побачити."

MCA_Canada_one:0 "Представляє ОССШАКВ"
MCA_Canada_one_desc:0 "§R«ОБ'ЄДНАНІ СИЛИ США КАНАДСЬКА ВЛАДА»§!§L – командна структура, сформована з реорганізованих солдатів, які залишились у Ред-Дірі після створення Перехідної Канадської Ради. Ті ж самі окупанти, які залили канадську землю кров’ю її синів, лишились – навіть під виглядом майбутньої незалежності Канади."

MCA_Canada_two:0 "Економічна залежність"
MCA_Canada_two_desc:0 "Під владою Ред-Діра економіка Альберти зросла, забезпечуючи армію та відновлюючи видобуток ресурсів. Тепер, коли уряд США вирішив надати Канаді майбутню незалежність, економіка Альберти постачає Америку. Її фабрики забезпечують Армію США, а більшість ресурсів Канади вирушає на південь, живлячи індустріальний Стілтаун."
