l_english:
tca_glorious_purpose:0 "Славна Місія"
tca_glorious_purpose_desc:0 "§g«Людина, мутант чи гуль — у кожному з нас є сила.\nПозбавтесь хибних уявлень про індивідуальність: ви — лише сира глина, з якої кують Брата. Немає 'Я'. Є лише 'Ми'. А 'Ми' — це все, що має значення.\nВаша ескадра — багато думок, але одна ціль. Ваша зброя — сіє жах у серця ворогів. Ваші машини — гремлять у славне майбутнє. Є тільки один шлях — разом. Якщо виживеш, станеш Сталлю».§!\n\n§OЕскадра Ленса§!, колишня суть §Y«Вашингтонського Братства»§!, ще до того, як §RБезсмертна§! зрадила §OЛанцюг, Що Пов’язує§! та відступила від Славної Місії, була формуванням із §YСерединного Братства Сталі§!.\n\nНа відміну від інших відгалужень Братства, Серединне вірить у принцип §OСлавної Місії§!: Братство — це не лідери, а ті, хто служить. Ніхто не є вищим за ціле.\n\nЗавдяки цій вірі Серединне Братство стало одним із найуспішніших відгалужень, що відійшло від Лост-Гіллз, відкинувши упередження проти гулів і мутантів, якщо ті віддані Кодексу.\n\nАле Безсмертна прагне §Rзламати§! місію та втягнути ескадру Ленса в її амбіції. Ті, хто вірні §YРуху§! й ідеалам Серединного Братства, так просто цього не дозволять."

wbh_tca_split:0 "Розпад Ескадри Ленса"
wbh_tca_split_desc:0 "Контроль Братства над Вашингтоном висить на волосині після того жаху, який принесла Безсмертна. Її відверта зрада Славної Місії кинула компанію в хаос і братовбивчу боротьбу. Втеча Абеля та решти вірних до Портленда, а також поворот Безсмертної до Лост-Гіллз остаточно розірвали колись могутню Ескадру Ленса. Цей конфлікт ставить під сумнів владу Братства на Північному Заході — і, водночас, легітимність обох фракцій."

wbh_tca_split_tt:0 "§gЦя ідея буде видалена у тієї фракції, яка здобуде контроль над усіма ключовими територіями свого супротивника§!."
