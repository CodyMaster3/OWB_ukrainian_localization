TCA_caleb_rose_name:0 "Калеб Роуз"
TCA_caleb_rose_cultural_advisor_desc:0 "Світ не зобов'язаний бути безкінечними перегонами за жорстокістю та хитрощами. Союз Вартових і братських вигнанців може стати поворотним моментом для всього Північного Заходу – якщо вони зуміють пережити бурю, що насувається. Не може бути жодних торгів із вовками, які бачать у невинних лише здобич."

