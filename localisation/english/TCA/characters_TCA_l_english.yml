TCA_vaniah_grant_name:0 "Ваная Ґрант"
TCA_vaniah_grant_economic_advisor_desc:0 "«Рух» – не просто гурт ідеалістів, що туляться серед руїн. Об'єднавши міць колишніх братчиків зі Сталі та ресурси Вартових, вони прагнуть стати чимось більшим, ніж лише відлунням у відповідь на моторошні плани Безсмертного щодо Пустки."

