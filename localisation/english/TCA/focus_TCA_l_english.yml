l_english:
tca_operation_snowstorm: "Операція «Снігова Буря»"
tca_operation_snowstorm_desc: "Перші плани протидії Вашингтонському Братству вже укладаються, та перед цим нам доведеться ухвалити низку непростих рішень. Як саме ми маємо діяти?"

tca_appoint_uber_dan: "Призначити «Юбера» Дена"
tca_appoint_uber_dan_desc: "Хоча більшість рекрутів, яких ескадра Ленса завербувала з Монтанського Братства, виявилися лоялістами Безсмертної — Ден є винятком. Він знайшов сенс у Славній Місії. Призначивши Дена командиром операції, ми збільшимо шанси на успішну інтеграцію цих бійців."

tca_lead_the_operation_myself: "Очолити операцію особисто"
tca_lead_the_operation_myself_desc: "Абель зібрав «Рух» разом — він і проведе її крізь бурю. Герой, що впаде на тирана й відновить єдність Братства. Це завжди було його прагненням — залишити по собі пам’ять."

tca_appoint_big_betty: "Призначити «Велику» Бетті"
tca_appoint_big_betty_desc: "Бетті — незвичайна, сильно опромінена мутантка родом з Епсілону. Якби не Братство, вона б залишилась без минулого. Саме в Славній Місії Серединного Братства вона знайшла новий сенс — місце, де на її вигляд більше не зважали. Після цієї війни саме вона, як ніхто інший, зможе об’єднати мутантів і людей у Вашингтоні."

tca_bringing_down_a_tyrant: "Повалення тирана"
tca_bringing_down_a_tyrant_desc: "Ось чим завершують ті, хто порушує Ланцюг, Що Пов’язує. За Братство!"

tca_battle_plan_curly: "Бойовий план «Кьорлі»"
tca_battle_plan_curly_desc: "Кьорлі — вірна ескадра. Абель бився пліч-о-пліч із ними біля кордону Колорадо ще багато років тому."

tca_battle_plan_moldy: "Бойовий план «Молді»"
tca_battle_plan_moldy_desc: "Бійці Молді — як кремінь. Їм по силі будь-яка битва!"

tca_battle_plan_windy: "Бойовий план «Вінді»"
tca_battle_plan_windy_desc: "Вінді зазнали втрат у сутичці з [HEA.GetName], але сьогодні вони готові битися за нашу справу!"

tca_battle_plan_gravy: "Бойовий план «Ґрейві»"
tca_battle_plan_gravy_desc: "Ми розмістили Ґрейві на невеликому посту біля бази Кадьяк. Тепер, коли ми взяли базу — час покликати їх до бою!"

tca_battle_plan_seltzer: "Бойовий план «Селтцер»"
tca_battle_plan_seltzer_desc: "Селтцер вже місяцями б’ється поблизу Геленс. Нам слід повернути їх до основних сил."

tca_recruit_curly: "Ескадра Паладинів §G«Кьорлі»§! знову в строю!\n§GПотужний загін у Силовій Броні§! прибуває в §YФорт Вілламетт.§!"
tca_recruit_moldy: "Ескадра Паладинів §R«Молді»§! знову в строю!\n§GПотужний загін у Силовій Броні§! прибуває в §YФорт Вілламетт.§!"
tca_recruit_windy: "Ескадра Паладинів §Y«Вінді»§! знову в строю!\n§GПотужний загін у Силовій Броні§! прибуває в §YФорт Вілламетт.§!"
tca_recruit_gravy: "Ескадра Паладинів §M«Ґрейві»§! знову в строю!\n§GПотужний загін у Силовій Броні§! прибуває в §YФорт Вілламетт.§!"
tca_recruit_seltzer: "Ескадра Паладинів §P«Селтцер»§! знову в строю!\n§GПотужний загін у Силовій Броні§! прибуває в §YФорт Вілламетт.§!"

tca_victory_in_the_north: "Перемога на Півночі"
tca_victory_in_the_north_desc: "Схоже, «Безсмертна» все ж була смертною. Її кінець настав від руки хоробрих солдатів Епсілону. Це день для святкувань!"

tca_victory_in_the_north_has_formed_northwestern_brotherhood: "Сформовано §YПівнічно-Західне Братство§!."
tca_victory_in_the_north_complete_every_uncompleted_battle_plan_focus: "Автоматично завершує всі незавершені фокуси §Y«Бойовий план»§!.\n"

tca_closing_site_p1: "Закрити Об'єкт П-1"
tca_closing_site_p1_desc: "Потенціал П-1, здатність порушувати закони реальності — це загроза не лише для Братства, але й для всієї Пустки. Мексон вірив, що технологія має чекати свого часу. Але ця технологія — не для людей. Ми маємо приховати її, щоб ніхто інший не піддався тій же спокусі, як і Безсмертна."

tca_securing_the_alaskan_pipeline: "Утвердити контроль над Аляскінським трубопроводом"
tca_securing_the_alaskan_pipeline_desc: "Наша мета відома. Зайнявши місто Кувер, ми зможемо гарантувати, що коли трубопровід буде відновлено — саме ми станемо головною силою в регіоні."

tca_freeing_slaves: "Раби Руху"
tca_freeing_slaves_desc: "Безсмертна спотворила суть Славної Місії, вважаючи підкорення єдино можливою метою Братства. Але ми — ні. Ми звільнимо тих, хто ще може бути врятований, і дамо їм вибір — приєднатися до нас по волі, а не з примусу."

tca_eastern_expansion: "Східне розширення"
tca_eastern_expansion_desc: "Ден, згадавши свій похід через Скелясті Гори, рветься вперед. Північно-Західне Братство готується до удару по нових рубежах."

tca_consolidate_the_pipeline: "Консолідувати трубопровід"
tca_consolidate_the_pipeline_desc: "Просуваючись на північ, ми зміцнимо контроль над Аляскінським трубопроводом і наблизимося до реалізації ідеалів Мексона."

tca_gamorrins_legacy: "Спадок Ґаморріна"
tca_gamorrins_legacy_desc: "Ґаморрін навчив Серединне Братство, що навіть мутант може служити Славній Місії. Ми маємо подолати відразу й побачити — у вірі всі рівні. І саме Бетті, мутантка, зможе переконати Першого."

tca_continue_ata_mk2_prototyping: "Завершити дослідження ATA MKII"
tca_continue_ata_mk2_prototyping_desc: "ATA MKII — модернізована модель броні Серединного Братства, створена завдяки контактам з Монтанською гілкою. Тепер, коли Безсмертна повалена, настав час завершити її розробку!"
