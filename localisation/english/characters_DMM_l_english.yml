DMM_GRISTLE_NAME: "Ґрістл"
DMM_GRISTLE_DESC:0 "Ґрістл – уособлення сили й престижу, якими колись користувалися Прокляті на озерах Манітоби. Тепер, коли контроль над ГЕС Ґранд-Рапідс оспорюється Залізною Конфедерацією, Прокляті більше не можуть виробляти достатньо енергії для свого населення і не мають простого доступу до торгівлі між озерами Манітоба та Уінніпеґосіс. Мита через Три Річки душать останній зв’язок між східним і західним узбережжям, і Ґрістлу не лишається нічого іншого, як укладати сумнівні угоди з ще сумнівнішими мисливцями – або ж ризикувати голодом і повстанням."