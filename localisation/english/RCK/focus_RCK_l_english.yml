l_english:
 # Focuses #HEY! IF YOU SEE IT MEANS YOU ARE HELPING ME WITH LOC, THANK YOU! #If you're not, welcome to the Roach King focus tree loc file. Enjoy your stay.
rck_roach_war: "Знищення Тарганів"
rck_roach_war_desc: "Історія Короля Тарганів не починається в Гріфтоні. Вона не починається з Отця Ньюмена. І точно не починається з Крукстона. Однак саме з останньої особи варто почати."
rck_hero_of_roach: "Мова Короля"
rck_hero_of_roach_desc: "Королю Тарганів знадобився деякий час для пробудження, і за цей час пішли чутки про чоловіка, який міг перетворити найменш улюблених шкідників Пустки на щось набагато більш прийнятне. Амбіція, яка спершу не була повністю оцінена Отцем Ньюменом."
RCK_the_roach_to_victory: "Тарган до Перемоги"
RCK_the_roach_to_victory_desc: "Гріфтон мав проблеми до приходу Короля Тарганів. Його прибуття стало каталізатором чогось дуже хорошого або дуже проблемного для цієї випадкової громади."
rck_roach_king_the_brave: "Король Тарганів — Сміливий"
rck_roach_king_the_brave_desc: "Король Тарганів — людина, сповнена сміливості та відваги. Так каже Отець Ньюмен, проповідуючи, що потрібно для того, щоб врятувати і виправити нечистих."
RCK_roach_king_the_wise: "Король Тарганів — Мудрий"
RCK_roach_king_the_wise_desc: "Король Тарганів не має найвищого рівня інтелекту в Пустці. Крукстон, однак, знає людей у Гріфтоні, які могли б об'єднати ідеї. Поєднання найяскравіших умів у Гріфтоні може призвести до неприємного сюрпризу за рівнем досвіду, але достатньо його для того, щоб допомогти."
RCK_leading_the_people: "Ведення Гріфтону"
RCK_leading_the_people_desc: "Люди Гріфтону захоплені манією Короля Тарганів, але це, напевно, не триватиме вічно. Поставивши кількох людей на роботу, що не стосується фермерства чи обміну сміття на скарби, можна створити велику групу, яка зберігатиме свою лояльність до Короля Тарганів, коли населення охолоне від його видимості."
RCK_leading_the_roaches: "Ведення Радтарганів"
RCK_leading_the_roaches_desc: "Радтаргани слухають Короля Тарганів, але їхня покора також дозволяє делегувати повноваження. Більше людей потрібно тренувати для взаємодії з цими дивовижними істотами. Інакше ми все вкладамо в одну коробку, що має форму Короля Тарганів."
RCK_its_a_start: "Тріумф Гріфтону"
RCK_its_a_start_desc: "Гріфтон продемонстрував велику лояльність та підкорення Королю Тарганів, тріумф сили Короля Тарганів та його відкритих ідеалів безпеки та процвітання буде продемонстровано. Більше ніяких випадкових зграїв радтарганів. Час організованих патрулів радтарганів настав!"
RCK_among_a_roach: "Питання Лояльності"
RCK_among_a_roach_desc: "Щоб вести радтарганів до величі, потрібна велика відвага та сміливість. З достатнім довірою вони з радістю принесуть себе в жертву для Короля Тарганів. Як і Король Тарганів для них. Ми все ще трохи віддалені від безумовної лояльності."
RCK_water_wells: "Руїни та Водяні Джерела"
RCK_water_wells_desc: "Гріфтон розташований поруч з великою, ніби нескінченною річкою. Це ідеальне місце для забезпечення чистою питною водою зростаючу армію радтарганів Короля Тарганів."
RCK_salvage_scraps: "Рятувати Сміття"
RCK_salvage_scraps_desc: "Багато хто дивується, як Пустка може виробляти металеві інструменти. Є досить велика кількість металевого брухту, що залишився після 200 років деградації, викликаної подією, схожою на масове вимирання. Хоча інструменти не дуже ефективні, Отець Ньюмен стверджує, що результат очищення вулиць зробить Короля Тарганів популярним серед поселень, що оточують Гріфтон."
RCK_a_worthy_leader: "Гідний Король"
RCK_a_worthy_leader_desc: "Король Тарганів довів, що готовий працювати важко для громади Гріфтону. Завдяки великій самопожертві та привілеям, що були надані громаді, люди Гріфтону продемонстрували рідкісну лояльність у Пустці до його справи."
RCK_fight_the_power: "Боріться з владою!"
RCK_fight_the_power_desc: "Коли твої спини притискають до стіни, або ти потрапив у маленьку ділянку Північного Співтовариства, кожен дюйм землі стає вартий боротьби."
RCK_the_king_is_dead: "§RКороль мертвий§!"
RCK_the_king_is_dead_desc: "§RКороль Тарганів помер. Його армія радтарганів залишилася без лідера. Яке безумство ви принесли у цей світ?§!"
RCK_to_the_capital_wasteland: "§YВаша історія не закінчується тут§!"
RCK_to_the_capital_wasteland_desc: "§gЗламаний, побитий, поранений. Король Тарганів не має дому. Немає союзників, немає поваги. Тепер нема чого робити, як тільки втекти і перебудуватися. Східний шлях здається найбільш підходящим. Давайте подивимося, де він опиниться.§!"
RCK_vault_war: "§YВійна за Сховище§!"
RCK_vault_war_desc: "Перша завоювання Короля Тарганів знаходиться на південь. Гріфтон в порядку... добре, насправді погано, але жодне місце в Пустці не має такого значення, як Сховище. Сховище, який викрадає людей стільки, скільки можна пам'ятати? Це безцінне значення."
RCK_roach_burrows: "Нори Тарганів"
RCK_roach_burrows_desc: "Радтаргану не потрібен теплий дім чи любляча родина. Будь-яка нора в землі підходить для цього. Можливо, добре підготовлені гнізда Тарганів допоможуть збільшити кількість радтарганів у армії?"
RCK_grafton_army_depot: "Армійський склад Гріфтону"
RCK_grafton_army_depot_desc: "Гріфтон перетворився на колекцію хуторів та передмість з часів до війни у Графтоні. Але тут все ще є процвітаючий ринок. Ми можемо здобути зброю для протидії армії роботів!"
RCK_vault_cracking: "§MЛегенда Починається§!"
RCK_vault_cracking_desc: "З проникненням у Сховище 37, Король Тарганів має імперію в межах своєї досяжності. З деактивованим штучним інтелектом наглядача і вигнаним фальшивим лицарем, люди потребують нового правителя. У цьому хаосі починається легенда. \n §MЛегенда про Короля Тарганів§!"
RCK_shatter_vault_tech_security: "Знищення Безпеки Vault-Tec"
RCK_shatter_vault_tech_security_desc: "Армія роботів тримає свою популяцію в заручниках. Досить дистопічно. Якщо ми хочемо бути визнаними як визволителі, давайте позбудемося цих бугименів, таргани набагато легші у поводженні... Залишимо схеми на всяк випадок!"
RCK_treasure_trove: "Скарбниця"
RCK_treasure_trove_desc: "Будь-який Сховище, який не потрапив під ядерний вогонь, є скарбницею багатств. Сховище 37 має багато ресурсів, скарбів та холотейпів, що лежать навколо. Деактивовані роботи заполонили коридори, певно, щось тут має бути корисне, чи не так? Давайте пошукаємо."
RCK_cleaning_up_the_scraps: "Ваш визволитель! Ваш герой!"
RCK_cleaning_up_the_scraps_desc: "Жителі Сховищеа 37 — це велика кількість пляжних м'ячів, які не хочуть розуміти зовнішній світ. За словами Отця Ньюмена, наша місія — привести їх до ладу та дати їм зрозуміти, що їх чекає, незалежно від того, як важко це буде. Крукстон був стурбований, але зрештою, Король Тарганів вирішив, що суворі методи найкраще підходять."
RCK_roaches_expansion: "Наглядач Король Тарганів"
RCK_roaches_expansion_desc: "Мої друзі, піддані, радтаргани. Я не заподію вам шкоди! Я герой цієї історії! Я прийшов врятувати вас усіх від цієї тиранії! Все, що вам потрібно, це слухати мене."
RCK_building_a_throne: "Трон для Короля"
RCK_building_a_throne_desc: "Король Тарганів мав одну мету з моменту проголошення себе королем радтарганів. Але трон, трон, на якому можна сидіти і наглядати за своїми підданими? Це йому підійде."
RCK_great_roach_forward: "Великий рух Тарганів"
RCK_great_roach_forward_desc: "Ми піднімаємося! Тепер Король Тарганів не обмежений лише маленьким куточком Північного Співтовариства, він може піднятися і правити усім північним регіоном! Час радтарганів настав!"
RCK_northern_roaches: "Північні Таргани"
RCK_northern_roaches_desc: "Імперія Короля Тарганів знаходиться на окраїнах величезної зими. На півночі занадто холодно для того, щоб тарган зміг вижити. Навіть у стінах Гріфтону не рідкість побачити тарганів, що замерзають. Якщо Король Тарганів хоче розширити свої кордони на сніг, йому доведеться використовувати інші сили."
RCK_assimilate_the_vault_dwellers: "Ассиміляція Жителів Сховищеа"
RCK_assimilate_the_vault_dwellers_desc: "Нам випала унікальна ситуація з найменш кваліфікованою робочою силою в усій Пустці. Ці люди навіть не можуть пофарбувати стіну без того, щоб не сідати на десять хвилин. З іншого боку, інтеграція буде надзвичайно легкою, оскільки вони вдячні за будь-яку роботу. Нам потрібно просто тримати їх подалі від їжі Сховищеа на довгий час."
RCK_church_crashing: "Вибух Сховища"
RCK_church_crashing_desc: "Ці хлопці — буквально часова бомба! Подивіться, на чому вони сидять. Це не дуже дружньо, але їх потрібно поставити під контроль, поки їх лідер не зробить щось бездумне і небезпечне."
RCK_hivemind_of_roach: "Розумова Спільнота Тарганів"
RCK_hivemind_of_roach_desc: "Розумова спільнота тарганів — це аномалія в природі. Ці таргани збираються, їдять і воюють разом. Дійсно корисно для організації атаки на ворога."
RCK_winter_warfare: "Зимова Війна"
RCK_winter_warfare_desc: "Зимова війна є неприродною для тарганів. Вона дуже шкодить, але є обов'язковою для тих, хто планує вижити на великому білому півночі."
RCK_raiders_to_our_north: "Обережно, там холодно!"
RCK_raiders_to_our_north_desc: "Війна, терор і гегемонія — це єдиний результат від поїздки на північ. Це безрозсудний ризик. Нехай вони знищують один одного. І якщо вони прийдуть, ну що ж. Ми будемо готові."
RCK_all_roads_lead_to_roach_king: "Усі шляхи ведуть до Короля Тарганів"
RCK_all_roads_lead_to_roach_king_desc: "Царство Короля Тарганів переходить від купи сміття, неправильно покладеного у неправильний контейнер, до бастіону на півночі. Усі шляхи ведуть до Короля Тарганів, якщо ми будемо слухатися пророцтва Отця Ньюмена."
RCK_welcome_home: "Ласкаво просимо додому"
RCK_welcome_home_desc: "У нас немає причин шкодити громадянам Церкви. Напад на Церкву був, головним чином, метафоричним — простий змінений підхід до управління, як би це не звучало."
RCK_the_churches_teachings: "Вчення Сховища"
RCK_the_churches_teachings_desc: "Діти Атома володіють значними знаннями в області війни та радіації. Ідеальне поєднання для радіо-стійких радтарганів. Ми, безсумнівно, могли б скористатися таким навчанням."
RCK_use_your_wings: "Використовуй свої крила"
RCK_use_your_wings_desc: "Король Тарганів цікавиться, як це було б — літати в небі. Летіти разом зі своїми тарганами в бій. Ну, з маленьким дворовим пивоварним заводом. Ми можемо зробити цю мрію реальністю. Король полетить зі своїми радтарганами!"
RCK_breed_more_roaches: "Життя знайде шлях"
RCK_breed_more_roaches_desc: "Гнізда Тарганів, в які ми інвестували роки тому, виявляються надзвичайно ефективними в створенні нових радтарганів для армії Короля Тарганів. Здається, що де б це не було і за яких умов, життя завжди знаходить шлях."
RCK_two_people: "Розділяй і Володарюй"
RCK_two_people_desc: "Два народи володіють землями на двох сторонах великої річки. Вони здаються поділеними через внутрішню племінну політику, хе-хе, дурні. Вони дозріли для захоплення!"
RCK_prospering_roaches: "Процвітаючі Таргани"
RCK_prospering_roaches_desc: "Наші нові громадяни знаходяться під захистом армії радтарганів. Це дозволило розвинути спеціалізації. Радтарган не хоче капіталів! Наша армія дешево й ефективно працює, дозволяючи покращити життя людей більше, ніж якби їм доводилося самостійно забезпечувати свою оборону."
RCK_expanding_vault_37: "Розширення Сховища 37"
RCK_expanding_vault_37_desc: "Сховище 37 не зовсім найпросторіше сховище, навіть якщо не враховувати, скільки місця займають жителі. Документи попереднього наглядача свідчать, що вони планували використати захисні роботи Vault-Tec для розкопок нових кімнат і коридорів на заході. Цей план досі готовий до виконання."
RCK_tools_of_the_trade: "Інструменти Торгівлі"
RCK_tools_of_the_trade_desc: "Сховище 37 має досить потужне обладнання для промисловості. Крукстон постійно говорить про створення копій, і він, ймовірно, правий щодо того, чому ми повинні це зробити."
RCK_vault_tech_scientists: "Вчені Vault-Tec"
RCK_vault_tech_scientists_desc: "Вчені Vault-Tec, що залишилися після Війни Сховища, дуже вдячні. Перехід від одного правителя до іншого на папері був би пеклом. Але для цих вчених це було визволенням, хоча б через відсутність корндогів. До того ж, Крукстон мовчить про те, що входить до складу корндогу."
RCK_salvage_salvage_salvage: "Батарея Наглядача Тато"
RCK_salvage_salvage_salvage_desc: "З деактивованим Наглядачем, Король Тарганів наказав вченим Vault-Tec переробити його на науковий експеримент для дітей Сховища. Один з дітей зміг підключити його до §YTato Plant§! і створив джерело електрики! Молодець, дитинко!"
RCK_vault_tec_secrets: "Таємниці Vault-Tec"
RCK_vault_tec_secrets_desc: "Vault-Tec не є ангельською службою. Це очевидно з історій, які розповідав Королю Тарганів у дитинстві. Те, що вони мають, це велика бібліотека експериментальних даних і тисячі рядків комп'ютерного коду, взяті безпосередньо від самого наглядача. Можливо, ми зможемо переробити дещо?"
RCK_revitalize_the_vault: "Оживити Сховище"
RCK_revitalize_the_vault_desc: "Сховище 37 було спроектовано як рай. Роботизоване виробництво заповнює Сховище, разом з жахливим способом життя. Давайте покажемо жителям Сховища 37, як справжній світ функціонує."
RCK_crown_jewel: "Королівський Камінь"
RCK_crown_jewel_desc: "Нарешті, Король Тарганів має свій трон. Сидячи в офісі Наглядача, Король Тарганів наказує чоловікам і тарганам з великою усмішкою. Люди його люблять. Таргани його обожнюють. Нарешті його прийняли як правителя, яким Отець Ньюмен завжди знав, що він може бути."
RCK_cold_acclimization: "Адаптація до Холоду"
RCK_cold_acclimization_desc: "Таргани не були виведені для холоду. Але навіть так. Вони змогли процвітати в нескінченній зимі Півночі. Вони здається адаптуються до холоду досить добре. Цікаво."
RCK_clear_pathway: "Підходити з обережністю"
RCK_clear_pathway_desc: "На півночі небезпечно. Ми вразливі до будь-яких атак в будь-який час. Можливо, ми могли б використати це на свою користь? У будь-якому випадку, нам потрібно діяти оборонно. Тут північ, і лише кілька радтарганів."
RCK_a_fellow_kingdom: "Незручне Угоди"
RCK_a_fellow_kingdom_desc: "Це незручне відчуття. Відчуття тривоги. Король Тарганів знає, що конфлікт на півночі неминучий. Три річки оголосили це з їх запеклим протистоянням до договору Гріфтон-Король Тарганів 2274 року. Підготуємося зараз."
RCK_dramathat: "Не Будь Драматичним"
RCK_dramathat_desc: "Дивний народ, актори та театральні вистави, дуже вишукана та чужда культура. Вони здаються непорозумілими з першого погляду. Варто задуматися, що відбувається в їхніх стінах. Ми повинні вивчити це!"
RCK_roach_war_games: "Військові Ігри: Таргане Сполучення"
RCK_roach_war_games_desc: "Таргане Сполучення! Справді захоплююча концепція! Гіпотетично, без присутності Короля Тарганів, радтаргани, які так віддані Королю Тарганів, вийшли б з під контролю! Вони повернулись би до свого неконтрольованого тваринного стану, і розповзлися б завойовувати і знищувати все, що можуть. Хоча це слід уникати, не буде зайвим дізнатися більше."
RCK_revitalize_roaches: "Оживити Тарганів"
RCK_revitalize_roaches_desc: "Наші таргани стають більш незалежними від своїх керівників. Це дуже погано. Можливо, візит від Короля Тарганів допоможе їм повернутися на правильний шлях."
RCK_vault_dweller_recruitment: "Відмовитися від Договору"
RCK_vault_dweller_recruitment_desc: "Завоювання Короля Тарганів принесло багатство і процвітання місту Гріфтон. Що важливіше, Король Тарганів більше не використовує маленьке містечко як свою базу, що робить попередній договір в значній мірі неактуальним і більше не потрібним."
RCK_remember_who_were_fighting_for: "Пам'ятай, за кого ми воюємо"
RCK_remember_who_were_fighting_for_desc: "Король Тарганів був більше ніж просто людина. Він був ідеєю."
RCK_calling_all_roaches: "Закликаємо всіх Тарганів"
RCK_calling_all_roaches_desc: "Кілька залишкових диких тарганів завжди готові до бою! Сьогодні вночі вони будуть відзначати!"
RCK_the_beast_awakens: "Звір Прокидається"
RCK_the_beast_awakens_desc: "Лідерство Сержанта Таргана дає результати, агресія радтарганів стає все сильнішою. Давайте скористаємося цим."
RCK_enter_sergeant_roach: "Все Руйнується!"
RCK_enter_sergeant_roach_desc: "З падінням Короля Тарганів, колишні мирні відносини з Гріфтоном зникли. Таргани більше не мають промислових можливостей. Все, що вони можуть, це вижити."
RCK_enter_sergeant_roach_desc: "З падінням Короля Тарганів, колишні мирні відносини з Гріфтоном зникли. Таргани більше не мають промислових можливостей. Все, що вони можуть, це вижити."
RCK_everything_is_falling_apart: "Входить: Сержант Тарган"
RCK_everything_is_falling_apart_desc: "Король Тарганів може бути зниклий, але його ідеї переживають його. Сержант Тарган залишається непохитним. І різні таргани почали слідувати за його прикладом."
RCK_art_of_the_deal_desc: "Наша оборонна мережа союзів починає приносити плоди! Регіон починає процвітати через відсутність стимулів для війни. Великий мир починає формуватися в цій замерзлій пустелі. Сила дипломатії тут! Ніхто не може нас перемогти!"
RCK_unkempt_rage: "§RНевтримна Лють§!"
RCK_unkempt_rage_desc: "§Без Короля Тарганів, нічого не стримує тарганів від перетину кордонів. Їхня земля, ваша земля, наша земля - для них це все земля!§"
RCK_fate_of_brother_jan: "Доля Брата Яна"
RCK_fate_of_brother_jan_desc: "Найбільша сила Сховища 37, чоловік, який називає себе Брат Ян, залишається в ланцюгах. Замкнений у порожній кімнаті Сховища 37. Король Тарганів запланував зустріч з ним."
RCK_fate_of_overseer_thomas: "Доля Наглядача ТОМАСА"
RCK_fate_of_overseer_thomas_desc: "ШІ Наглядача Сховища 37 було переможено, Король Тарганів переміг свого найбільшого суперника. Подивимося, як Король Тарганів отримає свою помсту."
RCK_useful_electronics: "Корисна Електроніка"
RCK_useful_electronics_desc: "Смакуй електрику, це справжня енергія Сховища 37. Пряма з фузіонного ядра глибоко у сховищі. Цей малюк може живити сховще ще на покоління вперед. І тепер це наше! Ха-ха!"
RCK_his_secret_stash: "Таємний Запас Яна"
RCK_his_secret_stash_desc: "Брат Ян мав таємний запас, схований десь у цьому сховищі. Має вистачити на створення кількох підрозділів в броньованому обладнанні! Для людей, а не радтарганів..."
RCK_elusive_water_pump: "Невловимий Водяний Чіп"
RCK_elusive_water_pump_desc: "Є кілька переваг бути тепер правителем цього Сховища. По-перше, ми тепер маємо значно більше води, щоб зібрати більше радтарганів! Більше ніяких брудних калюж! Чудово!"
RCK_repurposing: "Переробка"
RCK_repurposing_desc: "Чому повністю зруйнувати безпеку Vault-Tec? Ми все ще можемо використовувати їхнє обладнання для себе. У нас є люди в патрулях Тарганів, знаєш?"
RCK_this_is_something_alright: "Це Дещо!"
RCK_this_is_something_alright_desc: "Це Сховище знімає значну частину тягаря, що тиснув на Короля Тарганів, коли він намагався наздогнати своїх сусідів. Тепер він більше не страждає від нестачі всього важливого. У нас є основа, на якій можна працювати."
RCK_change_of_victory_conditions: "§MЗміна Умов Перемоги§!"
RCK_change_of_victory_conditions_desc: "Король Тарганів сидить на своєму троні в офісі Наглядача Сховища 37. Наша нація вразлива до атак від сильнішого супротивника. Потрібно розробити нову стратегію для забезпечення довготривалого миру в регіоні."
RCK_roach_king_the_diplomat: "Це Точно Ваші Друзі?"
RCK_roach_king_the_diplomat_desc: "Гаслайтинг, перевірений метод розплутування когось. Подивимося... маленька пташка каже мені, що ваші союзники не так лояльні, як здається. Це правда? Хто знає!"
RCK_rag_tag_group_of_nobodies: "Просто Слухай"
RCK_rag_tag_group_of_nobodies_desc: "Правильно, правильно! Все правда! Якщо вже на те пішло, ми піклуємось про тебе! Ти ж не захочеш атакувати того, хто протягує руку допомоги, так?... Що ж ми тобі зробили..."
RCK_one_big_sour_apple: "Один Великий Кислий Яблуко"
RCK_one_big_sour_apple_desc: "До Короля Тарганів, Гріфтон був тісним союзником Республіки Трьох Річок, через їх зраду, жодні дипломатичні зусилля не зможуть відновити зруйновані відносини між нашими двома націями. Та коаліція дихає нам в спину кожну секунду. Нам потрібно створити потужний стримуючий фактор для війни."
RCK_one_big_sour_apple_desc: "До Короля Тарганів, Гріфтон був тісним союзником Республіки Трьох Річок, через їх зраду, жодні дипломатичні зусилля не зможуть відновити зруйновані відносини між нашими двома націями. Та коаліція дихає нам в спину кожну секунду. Нам потрібно створити потужний стримуючий фактор для війни."
RCK_befriend_rocks: "Скелі і Радтаргани"
RCK_befriend_rocks_desc: "Найбільш військово здатні з наших західних сусідів. Мати Стендінґ-Рок на нашій стороні у випадку несправедливого вторгнення буде великим перевагою. Чуємо, що в Монтані виникає конфлікт, і забезпечення миру на їхньому сході дає нам значну вигоду. Сподіваємось, вони думають так само."
RCK_befriend_the_crow_people: "Ворони і Болотяники"
RCK_befriend_the_crow_people_desc: "Ці люди виконують важливу роль, утримуючи жахи, що панують на південь від нас. Вони стверджують, що вони є імунними до великої хвороби. Тільки спільний оборонний договір є єдиним розумним рішенням."
RCK_befriend_unbound: "Клептоманія та Крадіжки"
RCK_befriend_unbound_desc: "Нев'язані — дивний народ. Їх культура крадіжок не принесла їм друзів. Я впевнений, що вони охоче приймуть союз... Лише за умови, що їх триматимуть подалі від рук! Вони здаються такими ж вразливими, як і ми."
RCK_negotiating_trade_agreements: "Здоровий Обмін Ідеями"
RCK_negotiating_trade_agreements_desc: "Ці Старі Віряни, здається, пропагують цікаву релігію. Можливо, колись ми зможемо повністю її дослідити. Король Тарганів має дуже різноманітне населення, кілька різних релігій починають там укорінюватися. Було б дуже дурно намагатися їх знищити."
RCK_unstable_borders_of_an_unstable_region: "Стратегії Сіріуса"
RCK_unstable_borders_of_an_unstable_region_desc: "Чувак, ми точно їх ошелешили! Мислення! Ось як виграють війни! З хорошим планом у руках і союзниками поряд. Ми точно переживемо все, що на нас чекає!"
RCK_the_jester_recruit: "Блазень"
RCK_the_jester_recruit_desc: "Що ж, він дивний тип. Коли бій зупинився і досягнули перемир'я. Маскарад, здається, повернувся до стану, як ніби нічого і не сталося. Це чужорідна поведінка, яка справді захоплює. Король Тарганів запропонував прийняти його до своїх лав. Даючи йому багато повноважень для планування міст, розваг і місцевої влади Тарганів."
RCK_make_war_an_impossibility: "Якір Канадської Агресії"
RCK_make_war_an_impossibility_desc: "Наші оборони побудовані, наші Таргани готові, наші люди нас люблять. Ми готові до тотальної війни проти несправедливої канадської агресії. Тепер м'яч на їхньому боці."
RCK_statue_of_sergeant_roach: "Статуя Золотого Радтаргана"
RCK_statue_of_sergeant_roach_desc: "Сержант Тарган, найкращий радтарган, другий за командуванням у Короля Тарганів. Золотий Радтарган заслуговує на пам'ятник, що відповідає його спадщині."
RCK_statue_in_her_honor: "Статуя Найяскравішої Зірки"
RCK_statue_in_her_honor_desc: "Найяскравіша Зірка, найбільша сила Короля Тарганів, та, що дала йому мужність продовжувати, коли все здавалося втраченим."
RCK_finally_caught_up: "Статуя Найвеличнішого Короля"
RCK_finally_caught_up_desc: "Король радтарганів, лідер людей. Герой для всіх. Легенда Північного Співтовариства, Король Тарганів."
RCK_moment_of_clarity: "Зірки в Ночному Небі"
RCK_moment_of_clarity_desc: "Король Тарганів прокидається від свого сну і виходить на вулицю, шанс поглянути на нічне небо ще раз. Хаос переважно позаду, і тепер настав момент для роздумів."
RCK_more_than_just_a_roach_king: "Більше, ніж просто Король Тарганів"
RCK_more_than_just_a_roach_king_desc: "Прощавай, зграї радтарганів, що штурмують непідготовлені оборони. Якщо ми хочемо мати довготривалу силу, ми повинні диверсифікувати наші військові можливості."
RCK_look_what_we_found: "Подивіться, що ми знайшли"
RCK_look_what_we_found_desc: "Ця земля біля річки повна невідомих скарбів. Не зовсім. Це здебільшого маленькі ферми. Але є кілька великих міст, які потраплять під нашу охорону."
RCK_so_many_new_friends: "Так Багато Нових Друзів!"
RCK_so_many_new_friends_desc: "Король Тарганів приносить безпеку, економічне процвітання і відсутність турбот про військову мобілізацію. Масса людей підтримує нас. Однак опір залишається через річку."
RCK_losing_sanity: "§RLосіння Розуму§!"
RCK_losing_sanity_desc: ""Мій розум... мій розум починає спадати. Щось страшно не так. Це не мало бути так. Вороги, вороги оточують нас, ніхто не заслуговує на довіру. Ніхто! Ніхто!""
RCK_roach_king_the_conqueror: "Король Тарганів Завойовник"
RCK_roach_king_the_conqueror_desc: "Історія, яка стара, як світ. Вождь, що створює імперію."
RCK_saving_the_wasteland: "Рятуючи Пустку"
RCK_saving_the_wasteland_desc: ""Я врятую вас! Я врятую вас усіх! Я врятую вас від тираній, в яких ви опинились!""
RCK_under_new_management: "Під Новим Керівництвом"
RCK_under_new_management_desc: "Я не зашкоджу вам. Я просто хочу подивитися, що у вас є. Насправді, немає чого боятися! Це краще так!"
RCK_the_river_crisis: "Криза Річки"
RCK_the_river_crisis_desc: "Річка, це річка наша найбільша вразливість. Надсилайте дипломатичний посланець негайно! Ця річка буде наша!"
RCK_blast_open_that_damn_door: "Вибухнімо Ці Дорогу Чортову Двері!"
RCK_blast_open_that_damn_door_desc: "Мені достатньо! Достатньо пошуків! Достатньо очікувань! Це триває вже занадто довго! Я відмовляюсь більше чекати. Дайте мені динаміт. Давайте вибухнемо цю чортову двері."
RCK_for_their_own_protection: "Для Їхнього Ж Добра"
RCK_for_their_own_protection_desc: "Південний кордон містить жах, якого ще не бачили. Слабкі та беззахисні на південь від нас не можуть належним чином утримувати свої кордони в регіоні. Ми повинні взяти на себе їхню роль як охоронці кордону. Радтаргани імунні до того, що там розповсюджується. Це на їхнє благо."
RCK_preparations_and_tribulations: "Підготовка та Труднощі"
RCK_preparations_and_tribulations_desc: "Нехай вони прийдуть. Нехай вони прийдуть! Ми готові! Ми можемо їх перемогти! Вони будуть ПЛАТИТИ, якщо вважають, що можуть перемогти Короля Тарганів!"
RCK_on_top_of_the_world: "На Вершині Світу"
RCK_on_top_of_the_world_desc: "Ніхто не наважиться стояти проти могутньої сили Короля Тарганів. Нова імперія формується, пора грати свою роль."
RCK_special_forces_training: "Навчання Спеціальних Сил"
RCK_special_forces_training_desc: "Власне, все в назві. Потрібно терміново провести реформу наших елітних людських підрозділів, щоб забезпечити довгострокову безпеку. Одного дня Король Тарганів помре. І що станеться з його армією радтарганів? Ми повинні готуватися в сьогоденні, щоб не приректи наше майбутнє."
RCK_wait_a_minute_we_have_robots: "Зачекай. У нас є роботи!"
RCK_wait_a_minute_we_have_robots_desc: "Зачекайте. Що ми робимо?! У нас є ціле сховище, що раніше працювало на ШІ. У нас є десятки спеціалізованих роботів, які просто збирають пил у сховищах. Чому б нам їх не використати?"
RCK_prepared_for_the_worst: "Потоки Куль у Небо"
RCK_prepared_for_the_worst_desc: "Є чимало покинутих аеродромів, зарослих чагарниками. Південна Дакота була домом для численних ППО до війни. Як же руйнівно було б залишити свої силоси без охорони? Хоч ми й не можемо відновити їх до довоєнного стану, все ще є щось, що можна врятувати."
RCK_the_warpath_of_industry: "Військовий Шлях Індустрії"
RCK_the_warpath_of_industry_desc: "Наша військова індустрія надзвичайно відстає від інших регіональних держав. Перенаселене Сховище 37 важко переживає постійну метушню машин і майстерень, що виникли тут. Нам потрібно розширюватися. Можливо, повернення до Гріфтону буде доцільним?"
RCK_a_kings_ransom: "Трофеї Завоювань"
RCK_a_kings_ransom_desc: "Протягом численних завоювань Король Тарганів не соромився грабувати скарби, що траплялися на його шляху по Півночі. Після підрахунку вартості усіх кришок, ювелірних виробів і зброї, що тепер знаходяться виключно у його власності, його особисте багатство злетіло до рівня невеликої довоєнної країни. Виявляється, що більшість ваших солдатів – це радтаргани, добре для фінансування!"
RCK_new_weapons_new_toys: "Нова Зброя, Нові Іграшки"
RCK_new_weapons_new_toys_desc: "Ризикована пропозиція. Завоювання Короля Тарганів дало доступ до величезної кількості нової зброї. Ми можемо суттєво оновити арсенали наших людських солдатів."
RCK_fighting_disease: "Боротьба з Хворобами"
RCK_fighting_disease_desc: "Невтішний побічний ефект створення суспільства, що обертається навколо тварин, полягає в тому, що хвороби поширюються дуже швидко. Радтаргани, ймовірно, не найкращі партнери в довготривалій перспективі. Але це все можна виправити найближчим часом."
RCK_learning_from_our_adversaries: "Навчання від Наших Знищених Ворогів"
RCK_learning_from_our_adversaries_desc: "Як ми сюди потрапили? Які помилки були зроблені на шляху? Що можемо зробити, щоб підготувати наших радтарганів до майбутнього? Цікава думка, щоб на ній зупинитись. Давайте розпочнемо нові розробки для наших радтарганів."
RCK_the_greatest_celebration: "Звук Весільних Дзвонів"
RCK_the_greatest_celebration_desc: "Чудове, розкішне святкування найбільшої досягнення Короля Тарганів."
RCK_the_power_of_light: "Сила Світла"
RCK_the_power_of_light_desc: "Яскраве світло — це знак багатства і процвітання в цьому новому світі, де ми знаходимося. І ми його не маємо! Неймовірно!"
RCK_transforming_society: "Трансформація Суспільства"
RCK_transforming_society_desc: "Земля Короля Тарганів більше не є порожньою пусткою, де єдиною силою були радтаргани. Тепер ми маємо землю! Тепер у нас є ресурси!"
RCK_un_orthodox_farming_techniques: "Неортодоксальні Сільськогосподарські Техніки"
RCK_un_orthodox_farming_techniques_desc: "Транспортні засоби, транспортні засоби — це добре. Вони роблять транспортування швидшим. Швидше, ніж браміни. Але що важливіше, Південна Дакота має чимало старих сільськогосподарських транспортних засобів. Наша величезна цивільна популяція може навчитися працювати з ними та ремонтувати."
RCK_push_to_industry: "Рух до Індустрії"
RCK_push_to_industry_desc: "Рух до індустрії — це довга і важка мета. Ми не подвоїмо кількість наших фабрик за одну ніч. Але через належні інвестиції та нагляд від Короля Тарганів, ми можемо започаткувати рух."
RCK_river_trade_expansion: "Розширення Річкового Торгівлі"
RCK_river_trade_expansion_desc: "Контроль над нашими річками — перший крок до створення морської торгової імперії. Наразі ми зосереджуємося на землі. Але, можливо, наступний крок для розвитку нашої нації — це річки? Високий ймовірність."
RCK_im_brilliant_bloody_brilliant: "Я Блискучий, Чортівськи Блискучий!"
RCK_im_brilliant_bloody_brilliant_desc: "Технології, хіба ж не чудові? Хто б міг подумати, що людина на ім’я «Король Тарганів» буде на вершині світу?"
RCK_another_industry_focus: "Глибші Криниці, Глибші Поклади"
RCK_another_industry_focus_desc: "Копати глибше — це веде до вигоди. Більше підводних печер, більше мінеральних покладів. Ця земля багата на обидва."
RCK_new_factories_old_land: "Нові Фабрики, Стара Земля"
RCK_new_factories_old_land_desc: "Яка мета в ремонті старих покинутих хат? Чому б не побудувати свої власні будинки? Наші власні структури? Великі рівнини великі, плоскі та порожні. У нас є багато місця."
RCK_not_quite_a_crown: "Не Цілком Корона"
RCK_not_quite_a_crown_desc: "Король Тарганів, без сумніву, монарх, але він не тираніст. Корона не його стиль. Але найпотужніша броня, знайдена його командою розвідників, здається, цілком підходить..."
RCK_laying_ground_work: "Закладання Основ"
RCK_laying_ground_work_desc: "Перебудова нашого суспільства потребує належної основи для подальшого розвитку. На щастя, Сховище 37 надало нам ресурси для цього!"
RCK_the_great_conflict: "Великий Конфлікт"
RCK_the_great_conflict_desc: "Конфлікт назріває на Півночі. Нам слід підготуватися до нападу в найбільш сприятливий момент... Швидко, Таргани! До навчальних полів!"
RCK_death_of_the_brightest_star: "Небесний Колапс"
RCK_death_of_the_brightest_star_desc: "Кінець близький. Сержант Тарган більше не може керувати. Таргани помирають, тікають і втрачають інтерес. Правління Радтарганів було коротким, але зараз... час відпочити."

RCK_stop_the_bleeding: "Зупинити Кровотечу"
RCK_stop_the_bleeding_desc: "Зупиніть кровотечу. Зупиніть кровотечу. Зупиніть кровотечу. Зупиніть Кровотечу."

RCK_no_such_thing_as_industry: "Немає Такого Поняття як Індустрія"
RCK_no_such_thing_as_industry_desc: "Радтарган не може працювати на фабриці, але радтаргану не потрібно тримати зброю, все, що йому потрібно — це їжа та вода."

RCK_funeral_pyre: "Погребальний Вогнище"
RCK_funeral_pyre_desc: "З сержантом Тарганом на чолі, він організував останній обряд, щоб вшанувати спадщину Короля Тарганів. Він потягнув тіло Короля Тарганів у середину забитого гнізда Тарганів, це його останнє місце спочинку."

RCK_tale_of_revenge: "Історія Помсти"
RCK_tale_of_revenge_desc: "Ми налякані, самотні і в розпачі. Немає більше Короля Тарганів, лють Сержанта Таргана непереможна. Ми отримаємо свою помсту."

RCK_revenge_against_the_vault: "Помста за Сховище"
RCK_revenge_against_the_vault_desc: "Це Сховище 37 стало причиною смерті Короля Тарганів. Саме Сховище 37 заплатить за біль, яку вони заподіяли."

RCK_endless_waves: "Безкінечні Хвилі"
RCK_endless_waves_desc: "Безкінечний рій радтарганів, одного знищили, три нових з'являються. Наша єдина сила — це чисельність."

RCK_direct_control: "Прямий Контроль"
RCK_direct_control_desc: "Сержант Тарган знає краще за всіх, найбільш довірена істота Короля Тарганів, ми повинні покладатися на нього для керівництва роями Тарганів."

RCK_sergeant_roachs_war_cry: "Бойовий Крик Сержанта Таргана"
RCK_sergeant_roachs_war_cry_desc: "Сержант Тарган відновив контроль, точніше, хоча б частковий контроль. З силою Сержанта Таргана, вони будуть слухати."

RCK_lump_sum: "Одинична Сукупність"
RCK_lump_sum_desc: "Одинична сума радтарганів, у регіоні ще є незайняті гнізда радтарганів. Сержант Тарган може маніпулювати і взяти контроль над їхніми Тарганами."

RCK_think_of_the_garrisons: "Подумайте про Гарнізони!"
RCK_think_of_the_garrisons_desc: "Але що з гарнізонами! Що з того, що у нас є спеціалізовані підрозділи Тарганів! Як це допоможе, якщо люди просто повстануть! Ми повинні забезпечити знищення опору, навіть ціною втрати території."

RCK_the_first_wave_begins: "Починається Перша Хвиля"
RCK_the_first_wave_begins_desc: "Новини про падіння Сховища 37 розповсюджуються по пустці. Біженці заповнюють поселення по всьому Північному Співтовариству. Наше швидке розширення на територію Сховища 37 змусило наших найближчих сусідів прийти до безпрецедентної угоди: Загроза від радтарганів повинна бути знищена."

RCK_reclaiming_the_mantle: "Відновлення Спадщини"
RCK_reclaiming_the_mantle_desc: "Ми відновили Гріфтон, ми завоювали Сховище 37. Ну, не саме сховище, а землі навколо нього. Цей голод не втамовано... Ми маємо більше!"

RCK_snow_wont_stop_us: "Сніг Нас Не Зупинить"
RCK_snow_wont_stop_us_desc: "Як сніг може зупинити радтаргана? Ми не люди. Де б не було їжі, ми виживемо."

RCK_the_left_hand: "Ліва Рука"
RCK_the_left_hand_desc: "Ліва Рука збирає темні плоди."

RCK_the_right_side: "Правильний Шлях"
RCK_the_right_side_desc: "Так чи інакше. Сержант Тарган впливає на своїх підлеглих. Можливо, Король Тарганів добре його навчив."

RCK_the_hammer_comes_crashing_down: "Молот Б'є"
RCK_the_hammer_comes_crashing_down_desc: "Сержант Тарган не є Королем Тарганів, немає пощади, немає асиміляції, немає свободи для наших підлеглих. Ми отримаємо свою помсту."

RCK_momentum_is_gaining: "Моментум Збільшується"
RCK_momentum_is_gaining_desc: "Моментум, інерція, робота. Все це використовується для прискорення. Всі докази підйому рою Тарганів."

RCK_buying_time: "Купівля Часу"
RCK_buying_time_desc: "Захоплення Сержанта Таргана ослаблене. Але це не означає, що його можна відновити. Це не кінець. Це лише початок."

RCK_hive_mind_of_roach_two: "Рой Свідомості Тарганів"
RCK_hive_mind_of_roach_two_desc: "Ну, не зовсім. Більша координація і злість породжує ворожнечу та спільні зусилля для знищення наших ворогів."

RCK_until_the_bitter_end: "До Гіркої Кінцівки"
RCK_until_the_bitter_end_desc: "Ми будемо боротися за тебе, Королю Тарганів, за спадщину, яку ти залишив, за ідеали, які ти пріоритетував. Ми будемо боротися за тебе, до гіркої кінцівки."

RCK_reign_of_radroaches: "Правління Радтарганів"
RCK_reign_of_radroaches_desc: "Більше немає людей, більше немає мутантів, більше немає роботів, більше немає гулів. Час для нового правління. Нової гегемонії. Правління Радтарганів настало."

RCK_idk_im_out_of_ideas: "Нове Покоління Радтарганів"
RCK_idk_im_out_of_ideas_desc: "Будь-які нові радтаргани, що з'являться, будуть негайно введені в рій. Наш наступ не може зупинитись. Наша лють не може зменшитися. Кожен радтарган важливий."

RCK_any_river_will_do: "Будь-яка Річка Зробить"
RCK_any_river_will_do_desc: "Забруднена, радіоактивна — не має значення. Де б не було води, ми виживемо."

RCK_resistance_eradication: "Знищення Опору"
RCK_resistance_eradication_desc: "Опір буде нашою загибеллю. Ми не можемо реально знищити людей. Ми повинні зробити все можливе, щоб придушити опір. За допомогою страху та терору."

RCK_phase_two: "Фаза Два"
RCK_phase_two_desc: "Це погана ідея..."

RCK_mass_scale_duplication: "Масове Нашестя"
RCK_mass_scale_duplication_desc: "Це ніколи не закінчиться, ми ніколи не помремо. Ми ніколи не помремо. Ми ніколи не помремо. Ми ніколи не помремо!"

RCK_echos_of_roach_king: "Ехо Короля Тарганів"
RCK_echos_of_roach_king_desc: "Іноді ми чуємо його. Сміх, божевілля, накази. Спогад, який ми ніколи не забудемо. Спадщина того, що дало нам цю силу."

RCK_from_all_sides: "З усіх Сторін"
RCK_from_all_sides_desc: "Ми оточені, нас атакують, ми самотні і налякані. Але нічого не зможе нас зрушити! Нічого нас не переможе!"

RCK_scraping_the_barrel: "Тягнемо з останніх сил"
RCK_scraping_the_barrel_desc: "Ми починаємо втрачати сили. Світ об'єднався проти нас. І ми відчуваємо біль. Жоден радтарган не залишиться незалежним."

RCK_last_minute_alterations: "Останні Зміни"
RCK_last_minute_alterations_desc: "Поки не стало занадто пізно. Давайте швидко реорганізуємось. до того, як стане пізно."

RCK_grasping_at_straws: "Хапання за соломинку"
RCK_grasping_at_straws_desc: "Речі дійсно починають йти вбік. Сержант Тарган втрачає контроль. Кінець близький."

RCK_manpower_ig: "Останні Відступники"
RCK_manpower_ig_desc: "Останні кілька відступників, яких ми змогли знайти. Більше немає за межами війни. Все виглядає дуже погано."

RCK_glory_to_sergeant_roach: "Слава Сержанту Таргану"
RCK_glory_to_sergeant_roach_desc: "Спаситель Радтарганів, Золотий Радтарган, герой, якого ми потребували. Легендарний радтарган. Сержант Тарган."

RCK_death_of_an_overseer: "Вихід з Гріфтону"
RCK_death_of_an_overseer_desc: "Безпека Vault-Tec з Гріфтону, евакуюючи цілих поселенців і перевозячи всіх жителів глибоко в Сховище 37 перед тим, як зачинити двері."

RCK_hidden_holotape: "Сховок Голокасет"
RCK_hidden_holotape_desc: "Що ви робили, ховаючись тут?"

RCK_one_terrible_day: "Один Жахливий День"
RCK_one_terrible_day_desc: "Джерело цього хаосу."

RCK_the_king_rises: "Король Встає"
RCK_the_king_rises_desc: "Створення божевільної людини, чи спасителя?"

RCK_i_promise_to_save_you: "Обіцяю Врятувати Тебе"
RCK_i_promise_to_save_you_desc: "Але чи зможе він це зробити?"

RCK_emergency_key_card_access: "Аварійний Код Картки Доступу"
RCK_emergency_key_card_access_desc: "< !!! >"

RCK_reunited_at_last: "Нарешті Об'єднані"
RCK_reunited_at_last_desc: "Темрява розсіюється, і з нею приходить краса світла."

RCK_the_hidden_door: "§LСхована Кімната§!"
RCK_the_hidden_door_desc: "Король Тарганів ще не знайшов спосіб потрапити всередину цієї кімнати. Виглядає, що вона заблокована зсередини. План Сховища показує, що це має бути місце для 'Аварійної Підготовки до Втечі', що веде на поверхню. Є письмові накази, щоб її заповнили великою кількістю запасів. Я впевнений, що це буде дуже корисно потрапити всередину."

RCK_the_hidden_door_open: "§RПРОРИВ!§!"
RCK_the_hidden_door_open_desc: "Двері відкриті! Ми нарешті знайшли спосіб потрапити всередину! Швидко! Заходьте!"

RCK_glory_to_the_roach_king: "Легенда Ніколи Не Помирає"
RCK_glory_to_the_roach_king_desc: "Подорож завершилась до того, як ми зрозуміли це."

RCK_radroaches_in_the_enclave: "Радтаргани у Відступі?"
RCK_terror_of_the_capital_wasteland: "Терор Столичної Пустки"

RCK_stars_of_regret: "Зірки Каяття"
RCK_stars_of_regret_desc: "Я досі пам'ятаю... Ці думки... Вони... говорять зі мною. Я втрачаю розум. Але я все ще жив...? Що це за відчуття? Що це за... порожнеча? Моя Зірка... я сумую за тобою. Куди ти пішла?"

RCK_dynasty_of_many_crowns: "Династія Багатьох Корон"
RCK_dynasty_of_many_crowns_desc: "Нічого не зможе нас зупинити! Ваш герой переможений! Ваш спаситель скинутий! Ніхто більше не наважиться знову скинути Короля Тарганів!"

RCK_descent_into_madness: "Я чую Голоси"
RCK_descent_into_madness_desc: "Це була довга подорож до того, куди б це місце не вело. Не кожен фрагмент Короля Тарганів здається пережив його."

RCK_oh_how_far_weve_fallen: "О, Як Глибоко Ми Пали"
RCK_oh_how_far_weve_fallen_desc: "\"Куди вони пішли? Де мої радтаргани! Сержант Тарган... Куди ти пішов?!\""

RCK_a_humbling_experience: "Принижуючий Досвід"
RCK_a_humbling_experience_desc: "Втратити все означає, що не залишилось багато чого, за що можна бути вдячним. Це був досить поганий рік. Більше ніяких помилок. Більше ніяких невдач. Не дамо цьому статися вдруге. Ніяких других шансів."

RCK_welp_back_to_the_grind: "Повертаємось до Роботи"
RCK_welp_back_to_the_grind_desc: "Не все так погано... правда? Все ще є кілька радтарганів... О. Тільки 3..? Справді? Ну. Це проблематично."

RCK_the_new_throne: "Новий Трон"
RCK_the_new_throne_desc: "Кхе! Спочатку збудуємо трон. Потім візьмемо ракету. Кхе! Декілька моїх блискучих друзів допоможуть мені. Котра година? Час пурхати і метушитись. Кхе! Сонце гаряче. Але трон холодний. Кхе-акаахх-кух... ой, щось в середині не так. Час спати. Кхе!"

RCK_we_have_some_dopplegangers: "У Нас Є Дублери"
RCK_we_have_some_dopplegangers_desc: "Ого, погляньте на цих дурнів! Яка дрібна сварка. Хіба вони не бачать сили і могутності всесильного Короля Тарганів?! Час втрутитись у цю дитячу справу!"

RCK_the_antagonizer: "Антагоніст"
RCK_the_antagonizer_desc: "Королева Мурав'їв? Як цікаво! Вона була б відмінним союзником для відновлення сил Короля Тарганів! Давайте знищимо цього Роботизованого Гризуна!"

RCK_the_robot_man: "Механіст"
RCK_the_robot_man_desc: "Чоловік з Металу? Як розумно! Отримати підтримку Кантербері Коммонс було б чудовою основою для створення нового Королівства Радтарганів! Давайте об'єднаємо зусилля і знищимо цю Зарозумілу Мурав'їху!"

RCK_sergeant_roach: "Сержант Тарган"
RCK_sister_roach: "Сестра Тарган"

RCK_rotten_holotape: "Гнилий Холокасет"
RCK_rotten_holotape_desc: "Здається, ми залишили щось після того, як розкрили §YСкарбницю§! нових матеріалів, знайдених у Сховищі 37...\n\nМожливо, в іншому житті це призвело б до іншого результату?"
