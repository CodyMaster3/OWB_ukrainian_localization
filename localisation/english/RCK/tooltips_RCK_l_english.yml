l_english:
RCK_roach_king_flees_east_tt: "§LУ далекому, далекому, дуже далекому §!§MОновому оновленні,§! §LКороль Тарганів зібере всі залишки своєї сили та втече на схід до §!§MСтоличної Пустки.§!§L Наразі він чекає своєї загибелі.§! \n\n §g(З акцентом на частину «дуже далеко» в оновленні.)§!"
RCK_hey_get_a_general_dimweed_tt: "§MЦя фокус не має ефекту, оскільки у вас немає сержанта Таргана в армії!§!"
RCK_roach_king_flees_east2_tt: "§YКороль Тарганів, побитий і поранений, зібере залишки своєї армії тарганів і втече на схід до §MСтоличної Пустки.§!"
RCK_vault_war_tt: "§gКороль Тарганів нарешті готовий до великого наступу на Валт 37. Він розробив дуже специфічну стратегію: захопити §YВалт 37§! Падіння Вальту 37 призведе до краху безпеки Vault Tec без прямих наказів від їхнього штучного інтелекту наглядача. Однак, якщо Валт 37 відкине Короля Тарганів до §MГріфтону§!, народ повстане. Це змусить Короля Тарганів втекти з регіону назавжди.§!"
RCK_lost_vault_war_tt: "§LКороль Тарганів не зміг прорватися через Валт 37! Він повинен втекти і реорганізуватися де-небудь в безпеці! Дій швидко!§!"
RCK_the_beast_awakens_tt: "Тарган не має поняття про національну державу. Зі смертю Короля Тарганів, цей первісний інстинкт бере на себе повний контроль."
RCK_vault_dweller_recruitment_tt: "Деякі з більш загнаних громадян Вальту 37 хочуть відчути тривогу бою, ми можемо допомогти в цьому."
RCK_vault_war_victory_tt: "§MКороль Тарганів переміг у битві за Валт 37!§!"
RCK_sister_roach_tt: "§8Сестра Тарган приєднується до партії§!"
RCK_the_jester_tt: "§8Шут приєднується до партії§!"
RCK_tato_battery_tt: "§8Наглядач ТОМАС приєднується до партії§!"
RCK_sergeant_roach_recruit_tt: "§8Сержант Тарган приєднується до партії§!"
RCK_art_of_the_deal: "З нашими силами разом!"
statue_of_roach_king_tt: "§4Побудуйте величезну статую §YКороля Тарганів§!!§!"
statue_of_sergeant_roach_tt: "§4Побудуйте величезну статую §RСержанта Тарганів§!!§!"
statue_of_sirius_tt: "§4Побудуйте величезну статую §PSirius!§!§!"
statue_of_sirius_secret_tt: "§4Побудуйте статую, присвячену §PBrightest Star§!.§!"
RCK_under_new_management_tt: "§MУсі держави без кордонів отримують +25% до комплаєнсу§!"
RCK_the_hidden_door_tt: "§LСховане приміщення глибоко в Вальті 37, цікаво, що там може бути всередині? Можливо, нам варто пошукати які-небудь підказки, як потрапити всередину.§!"
RCK_the_hidden_door_open_tt: ""
RCK_roach_swarm_wave_tt: "§RНовий рій радітарганів приєднується до бою§!"
RCK_blast_open_that_damn_door_focus_tt: "§LСховане приміщення стане доступним для пошуку§!"
RCK_uh_oh_sphaghetti_oh_tt: "§RЦе катастрофічне загострення і об’єднає§! §YВСІ§! §Rнаших сусідів проти нас. Підготуйтеся відповідно.§!"
RCK_prelude_tt: "§RРобити це так близько до кордону – це бажання смерті...§!"
RCK_they_cant_be_stopped_tt: "§RНовий набір рішень для допомоги контролю Сержанта Таргана над Роєм Тарганів буде розблоковано§!"
RCK_flirting_with_disaster_tt: "§RНації, що поділили колишню землю Короля Тарганів, об’єднаються проти нас. Підготуйтеся відповідно.§!"
RCK_massive_wave_of_roaches_tt: "§RМасивна хвиля радітарганів приєднується до ваших лав§!"
RCK_hidden_door_tt: "§LA картка доступу повинна бути десь тут...§!"
RCK_the_throne_is_built_tt: "§LКороль Тарганів почне будувати свій трон у Столичній Пустці, крок за кроком.§!"
RCK_stool_found_tt: "§YБУДІВНИЦТВО ТРОНУ:§! §G+Знайдена металева табуретка!§!"
RCK_rocket_found_tt: "§YБУДІВНИЦТВО ТРОНУ:§! §G+Знайдена статуя червоної ракети!§!"
RCK_wave_one_tt: "§L (Старі Віряни, Церква Силосу, Два Народи)§!"
RCK_hint_hint_tt: "§LТут здається багато холокасет. Можливо, одна з них буде важливою для чогось? Давайте пошукаємо та подивимося, чи знайдемо її.§!"
RCK_meeting_ant_agonizer_tt: "§LКороль Тарганів помічає дивну метушню, що відбувається в§! §MКентербері Коммонс§!"
RCK_less_likely_tt: "§MLйонів братство§! §Lстає менш загрозливим для Короля Тарганів§!"
RCK_new_roaches_tt: "§LA нова патруль радітарганів організована для §!§MNorthern Defense§!"
RCK_sergeant_roach_stronger_tt: "§tСержант Тарган стає сильнішим...§!"
RCK_sergeant_roach_tougher_tt: "§8Сержант Тарган стає міцнішим...§!"
RCK_sergeant_roach_smarter_tt: "§7Сержант Тарган стає розумнішим...§!"
RCK_sergeant_roach_scrappy_tt: "§4Сержант Тарган стає більш хитрим...§!"
RCK_sergeant_roach_MIGHTY_tt: "§OSержант Тарган стає <§!§tПО§!§8СИЛЬНИМ§!§7УРІЛ§!§4ВЕЛИКИМ§!§O>§!§!"
RCK_sergeant_roach_MIGHTY_x3_tt: "§O<3X МУЛЬТИПЛІКАТОР АКТИВОВАНО>§!"

RCK_roaches_outsider_tt: "§8Нагадування:§! §LRadroach Swarms найкраще використовують доктрину «§5Outsider Warfare§!»§!"
RCK_roaches_reminder_1_tt: "§8Нагадування:§! §LRadroach Swarms представлені як «§5Insect Swarms§!» на вкладці виробництва§!"
RCK_marked_for_death: "Марковані для смерті"
RCK_marked_for_death_tt: "§8Цей персонаж є §Rмаркованим для смерті§!, світ має для них плани найближчим часом§!"

RCK_survival: "§8Перевтілення одного справжнього радітаргана§!"

RCK_roach_king_trait_6_tt: "\n\n§gЯк перевтілення§! §MЄдиного справжнього Радітаргана§!§g,§! §RСержант Тарган§! §gбув благословенний надзвичайними здібностями, щоб помститися за смерть Короля Тарганів від пустки.§!\n\nЯк §gГнів Сержанта Таргана зростає...§!\n\n§8Радітаргани будуть§! §RКонтрольовані без помилок.§!\n\n§8Кордони будуть§! §RCrossed without warning.§!\n\n§8Опір буде§! §RCrushy without mercy§!\n\n§gСподіваюся, ви готові до прокляття, яке ви випустили на цей загиблий світ.§!"

RCK_sergeant_roach_recruit_notice_tt: "§LЗараз він може бути слабким, але як §8Другий у командуванні Короля Тарганів§! §8Сержант Тарган§! отримає безліч можливостей для того, щоб §4вдосконалити свої навички...§!\n\n§8Нагадування:§! §LНавички Сержанта Таргана, що вдосконалюються, будуть представлені як:§!\n\n§RAтака : Сержант Тарган стає сильнішим...§!\n§8Оборона : Сержант Тарган стає міцнішим...§!\n§7Планування : Сержант Тарган стає розумнішим...§!\n§4Логістика : Сержант Тарган стає більш хитрим...§!"
RCK_journey_end_tt: "§4Подорож закінчується§!"
RCK_the_king_is_dead_tt: "§RКороль Тарганів помер§!"
RCK_whatisthis_tt: "А... холокасета? Але вона загнила від недбалості... зміст здається незрозумілим. §YЯкби ми перевірили це раніше, це, мабуть, привело б до іншого результату.§!"
