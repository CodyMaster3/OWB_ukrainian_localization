RCK_image_bonus_rk_tt: "Король Тарганів\n§G+150 Радітарганів/Тиждень§!\n §G+1% Рухливості Лідера/Тиждень§!\n§R-3 Витрати Політичної Влади/Тиждень§!\n\n§gВикористання Короля Тарганів для управління Тарганячими Гніздами є дуже безпечним рішенням. Але це забирає його від важливих лідерських рішень.§!"
RCK_image_bonus_sr_tt: "Сержант Тарган\n§G+300 Радітарганів/Тиждень§!\n §R-5 Людських Ресурсів/Тиждень§!\n\n§gВикористання Сержанта Таргана дасть шалений обсяг радитарганів! Але це позначиться на громадській безпеці...§!"
RCK_image_bonus_c_tt: "Крукстон\n§G+110 Радітарганів/Тиждень§!\n §G+1 Досвіду Армії/Тиждень§!\n§R-2 Політичної Влади/Тиждень§!\n\n§gКрукстон новачок у цьому "Тарганячому Гнізді", але він дає всьому найкраще! І багато вчиться про лідерство по ходу справи! Продовжуй, Крукстон! Ти справляєшся чудово!§!"
RCK_image_bonus_s_tt: "Сіріус\n§G+99 Радітарганів/Тиждень§!\n §G+10 Цивільного Населення/Тиждень§!\n §R-1 Політичної Влади/Тиждень§!\n\n§gСіріус не зовсім знайома з правильним поводженням з радитарганами і із задоволенням заявляє про свою відсутність інтересу до навчання! Вона замість цього використовує цю роботу для просування більш безпечного життя в землях Короля Тарганів. Це більше її справа.§!"
RCK_image_bonus_t_tt: "Оверсейр Томас (Татова батарея)\n§G+140 Радітарганів/Тиждень§!\n §G+1 Політичної Влади/Тиждень§!\n\n §R-20 Споживання Енергетичних Селл/Тиждень§!\n§gКолишній Оверсейр Штучного Інтелекту з Валт 37, тепер переорієнтований на ефективне управління Тарганячими Гніздами. Але це коштуватиме більше, ніж просто бататова енергія для цієї роботи.§!"
RCK_image_bonus_r_tt: "Сестра Роза\n§G+100 Радітарганів/Тиждень§!\n §G+1 Досвіду Армії/Тиждень§!\n §R-2 Витрати Політичної Влади/Тиждень§!\n\n§gЛідер Дітей Атому в землях Короля Тарганів, незважаючи на її вражаючі військові здібності, її гнів спричиняє деякі проблеми.§!"
RCK_image_bonus_j_tt: "Жонглер\n§G+100 Радітарганів/Тиждень§!\n §G+1% Стабільності/Тиждень§!\n §R-7 Командної Влади/Тиждень§!\n\n§gЖонглер показав чудові здібності в регіональному управлінні. Напевно, це дається йому чимось важливим, правда?§!"
