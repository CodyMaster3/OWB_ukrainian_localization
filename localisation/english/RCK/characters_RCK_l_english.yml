l_english:
RCK_roach_king_NAME: "Король Тарганів"
RCK_roach_king_DESC: "Місцевим жителям він відомий як Регій Блаттарія, Король Тарганів був врятований від краю смерті невеликою групою радітарганів, які зглянулися над його слабким та покаліченим станом. Об'єднавши свої сили, вони вирізали власну територію серед ослаблених та відволіканих сусідів на Півночі Спільноти. Підживлений мріями про велич, новизну та помсту. \n\n Це суворий світ, Королю Тарганів, як далеко зайде твоя удача?"
RCK_seargent_roach_name: "Сержант Тарган"
RCK_seargent_roach_DESC: "Цей радітарган... особливий. Король Тарганів не наважується згадати чому. На перший погляд звичайний, але цей Тарган має пошкоджене праве око. Воно світиться зеленим, ніби інфіковане радіацією. Але не достатньо, щоб стати світляним радітарганом. Він назавжди залишиться відомим як: \n§MСержант Тарган.§W"
RCK_sister_roach_name: "Сестра Тарган"
RCK_sister_roach_DESC: "Сестра Роза - дуже талановитий та харизматичний лідер. Можливо, вона зможе зберегти своє лідерство як командир нашої армії. Немає страху, що вона організує повстання, бо жоден тарган не наважиться напасти на Короля Тарганів."
RCK_overseer_tato_battery_name: "Батарея Тато наглядника"
RCK_overseer_tato_battery_DESC: "Батарея Тато наглядника, створена палким учнем Гріфтона!"
RCK_sirius_blatarria_name: "Сіріус Блаттарія"
RCK_sirius_blatarria_DESC: "Любляча партнерка Короля Тарганів."
RCK_the_jester_name: "Клоун"
RCK_the_jester_DESC: "Таємниче створіння, але чудовий лідер тарганів."
RCK_crookston_name: "Крукстон"
RCK_crookston_DESC: "§4\"Який наш наступний крок, бос?\"§!\n\nКолишній незначний член міліції Гріфтона, прибуття Короля Тарганів змінило все. Колишній капітан §Rзник§!, а Крукстон був там, готовий заповнити порожнечу. Він родом з Пограниччя, втік від грабіжників до Гріфтона, тільки щоб зрозуміти, що новий дім не такий вже й відмінний. Постійно розмірковуючи і стримуючи свої почуття, Крукстон - ідеальний лакей для Короля."
RCK_newman_name: "Отче Ньюмен"
RCK_newman_DESC: "§4\"Віра дає більше, ніж будь-що інше, сучки.\"§! \n\nУ минулому столітті могутність Королівства Манітоба поширювалася за межі своїх кордонів. Кошти, надані багатим торговцем у поєднанні з державним храмом, призвели до будівництва гарної будівлі в Ґрафтоні. Нажаль, вона перетворилася на Гріфтон, як і опікун церкви. Отче Ньюмен має надзвичайно суперечливе минуле, яке нескладно розібрати, і справжнє питання полягає не в тому, чи вірить він у свою віру, а в тому, скільки він насправді вірить. Те, що немає жодних сумнівів, так це в його здатності використати Короля Тарганів для досягнення своїх інтересів, зокрема для поліпшення власного способу життя та запобігання новим нападам на вікна від грабіжників."
RCK_crookston_two_name: "Король Тарганів 2"
RCK_crookston_two_DESC: "З ініціацією Проекту Лялька, Крукстон опинився на чолі колишньої імперії Короля Тарганів. Він швидко діє, щоб уникнути громадянської війни. Для людей він - другий Король Тарганів, але ті, хто близько до нього, розуміють, що йому не буде легко. Чи зможе він відповідати спадщині Короля Тарганів? Час покаже."