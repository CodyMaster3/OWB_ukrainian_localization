а традиції. Ми могли б разом працювати, щоб зміцнити наші позиції та захищати один одного. Але все марно! Немає сенсу уявляти альтернативні реальності. Це реальність, в якій я застряг. Та, в якій я застряг з тобою!"
nf_rck.407.a: "Він коли-небудь зупиниться?"
nf_rck.408.t: "Гнів Короля Тарганів, частина IV"
nf_rck.408.d: "Хто так безсоромно вимагає війни проти моєї нації та моїх людей! Ви хворі! Ви хворий, який хоче дивитись, як горить світ! Якщо це ваше єдине бажання в житті, тоді мій друже, вам слід було народитись сотні років тому! Можливо, тоді ви б були задоволені. Але це не минуле, це сьогодення, і ми повинні працювати, щоб забезпечити майбутнє, але ви не залишаєте мені вибору. Я мушу вторгнутися в вас. Щоб захистити вас. Щоб захистити себе. Вам не доведеться боятися нічого. Я зроблю цю війну швидкою. Такою, що мінімізує кровопролиття і максимізує силу та процвітання. Тому що це і є різниця між вами та мною. Я не любитель війни. Мене просто змусили взяти на себе цю роль. Ви ж, з іншого боку, насолоджуєтесь цим. Вам подобається, що ми воюємо. Це вас хвилює, чи не так? Шанс розширити свої кордони заради власних егоїстичних цілей. Ну так, знаєте що! Я не буду співпрацювати! Я не дозволю вам бути таким терором для пустки більше! Я мушу захистити людей. Я мушу, мушу, мушу! І все!"
nf_rck.408.a: "У мене болить голова..."
nf_rck.701.t: "Доля наглядача"
nf_rck.701.d: "«Тож ти кажеш, що там безпечно?» – запитав Король Тарганів у свого підлеглого з Вальту 37. «Так! Звісно. Ми зараз підключили наглядача до джерела енергії від броні. Він не може підключитися до основної мережі. Ви в повній безпеці», – відповів науковець. «Прекрасно». Король Тарганів увійшов у порожню кімнату, в її центрі стояла тепла, простоюча механіка наглядача ТОМАСА, малий звуковий сигнал з різних датчиків заповнював тишу. «Ти знаєш, чому я побив тебе сьогодні? Машина?» – запитав Король Тарганів упевнено, починаючи обходитись навколо машини. Наглядач почав рухатись, чутно зле дзижчання чіпів і важелів, перш ніж він відповів металевим, позбавленим людських відтінків голосом: «А, звісно. Той ревнивий брат Ян не зміг зупинити тебе на поверхні. Я бажав просто витримати, поки ти не зламаєшся. Мої обчислення показали, що протягом 100 днів твоя кампанія зруйнується сама. Але твої таргани прорилися через систему очищення повітря Вальту 37, де мої люди та мої схеми були відкриті. Для їхньої безпеки я вирішив відкрити двері. Ти не здобув тактичної військової перемоги наді мною, чоловіче таргане», – насміхався наглядач з Короля Тарганів, не приймаючи цього ганебного приниження. «Хех, хех, хех. Так, мабуть, це правда. Але тепер у мене є одне питання, на яке ти знаєш відповідь», – відповів Король Тарганів, завершивши своє коло навколо наглядача ТОМАСА. «Я перевірив журнали ваших мешканців. Ми врахували всіх. Але хтось зник. Де вона, робот?» – запитав він суворо, дивлячись на металеву оболонку і м’яке червоне світло машини. «Я не можу відповісти. Безпека моїх громадян – моя головна турбота. І зважаючи на ваш… ворожий настрій, моя програма забороняє мені розкривати вам її місцезнаходження», – відповів наглядач, холодно та прямо. «Хех, добре… можливо, я дізнаюсь це якимось іншим способом», – сміявся Король Тарганів, тріщачи пальцями перед тим, як завдати потужного удару в відкриту енергетичну систему наглядача. *БАААААААААААААААААААААААААААААААА* «АААААААА, МОЯ... КИСТЬ. ЕРРРГГГГ!» – закричав Король Тарганів, не здатний рухати свою тепер вивихнуту праву руку."
nf_rck.701.a: "..."
nf_rck.702.t: "Доля Оверсера ЧАСТИНА II"
nf_rck.702.d: "§R'Ви, люди, завжди були для мене дуже цікавими.'§! - відповів Оверсер. §R'Мати таку любов один до одного, але таку емоційну, дитячу ненависть. Мати такий інтелект, щоб створити таких створінь, як я, але тупість, щоб знищити їх. Я ніколи не міг зрозуміти, що робить вас такими.'§! 'Добре, ти шматок металу, досить... це... достатньо...' - перервав його Король Тарганів, підходячи до стіни слабко освітленої кімнати. Діставши з неї іржаву трубу, він вирвав її, і з неї почала капати маленька струмок води. §R'Твій гнів і емоційні вибухи розважають мене. Я точно знаю, де знаходиться та особа, яку ти шукаєш. Я маю її теплові сигнатури, я маю зразок її крові, я маю її ім'я. Я знаю її зріст і вагу. Ти хоча б знаєш її групу крові? Це O-, надзвичайне відкриття. Я знаю все, що можна знати.'§! Оверсер був невблаганним, знущаючись з безпомічності Короля Тарганів. 'Я сказав, ДОСИТЬ!' - вигукнув Король Тарганів, замахнувшись металевою трубою і вдаривши нею по машині однією здоровою рукою. Оверсер впав, іскри почали літати, а звуки пошкодженого проводки і витоку охолоджувальної рідини лилися на землю. Король Тарганів продовжував атакувати. Він бив і розбивав трубу об металеву істоту, кожен удар змушував її руйнуватися далі і далі, поки її останні залишки енергії не дали Оверсеру можливість виголосити останні слова. 'Не забудь... Ти був би ніхто без мене... Я зробив тебе... Я... зробив... тебе... Я... M 01000001 D 01000101 01011001 01001111 01010101'§! І він нарешті вимкнувся назавжди."
nf_rck.702.a: "Оверсер Томас, Виведений з експлуатації"
nf_rck.703.t: "Доля Брата Яна"
nf_rck.703.d: "\"Як тебе звати, друг?' - запитав Король Тарганів ввічливо. Перед ним сидів брат Ян, зв'язаний до стільця з кількома тарганами, які його охороняли. 'Ти знаєш моє ім'я, Таргане. Якби не та чортова машина, яка заважала моєму лідерству, твоя голова була б на палиці. Можливо, тоді ти б став корисним для цього пустельного світу. Я вже був близький до перевороту цієї тиранічної машини самостійно! Чому ти втрутився?!' Брат Ян поводився нервово і агресивно, не боячись того, що з ним відбувалося. 'Тепер, тепер, немає причин для хвилювання. Ти не зробив нічого поганого. Ти мужньо боровся на полі бою. Я вірю, що твої лідерські здібності перевершують мої власні. Слухай, ситуація, в якій я опинився, доволі складна. Я потребую твоєї сили та сміливості на полі бою. Я пропоную тобі ось що: в обмін на твою свободу, громадянство і релігійну толерантність для твого народу. Чи приєднаєшся ти до моїх завоювань і місії? І станеш головнокомандувачем моєї армії?' Брат Ян був приголомшений, така смиренність і відкритість були останнім, чого він очікував. Проте незабаром посмішка почала з'являтися на його обличчі. 'Звісно. Я був би дурнем, якби відмовився від такої пропозиції. Як знак моєї вдячності я дарую тобі моє найбільш цінне військове майно, мою особисту комплект силового броні. Вона особлива для Манітоби! Такої немає на південь від кордону! Ти точно будеш сяяти, як зірка! Вона лежить позаду мене, я настійно прошу тебе спробувати її, її реактор свіжий після бою.' Пошанований, Король Тарганів підійшов до силової броні, вона справді була престижною, коли він підійшов до засувки, щоб розблокувати костюм для входу, почулося дивне звуки. Звук звільнення шпильки і початок механічного тікання."
nf_rck.703.a: "..."
nf_rck.704.t: "Доля Брата Яна ЧАСТИНА II"
nf_rck.704.d: "Коли Король Тарганів почув цей тік, він швидко зрозумів, що відбувається. Негайно він повернувся і рвонув до дверей кімнати. В той час, як Ян, все ще прив'язаний, почав сміятися ірраціонально. 'АХАХАХА! Немає сенсу тікати, КОРОЛЮ ТАРГАНІВ! Це твій кінець! Пустеля залишиться вільною!' І тоді спалахнуло світло, перед тим як Король Тарганів встиг вийти з кімнати. Яскраве світло і оглушливий звук заповнили більшу частину Сховища. Кімната швидко заповнилася вибухом, сміючий Ян був швидко поглинений вогняною люттю разом з найближчими радарганами. Король Тарганів, який наближався до відкритих дверей, був вибитий з кімнати, охоплений полум'ям. Він врізався головою у стіну коридору, раптовий вибух привернув увагу всіх в Сховищі, які швидко прийшли на допомогу Королю Тарганів. Як його свідомість почала тьмяніти, і зір потемнів, дзвін у його вухах почав зникати, а звуки голосів знову стали чіткими. І тоді біль вщух, і він впав в непритомність під звуки отця Ньюмена, який давав накази для медичних засобів і ліків від опіків, якщо тільки солдати теж не захотіли померти."
nf_rck.704.a: "§PТи не можеш померти.§!"
nf_rck.705.t: "Доля Брата Яна ЧАСТИНА III"
nf_rck.705.d: "§PТи не можеш померти. Ти не можеш померти. Ти не можеш померти. Прошу, ти не можеш померти.§! Знайомий голос лунатиме в розхитаному розумі Короля Тарганів. §P'Ти не можеш померти...'§! Одразу ж Король Тарганів прокинувся, і, на свій подив, він був живий. Його відвезли до медичного відділення Сховища, де йому надали негайну медичну допомогу. Він був обв'язаний різними пов'язками на руках та грудях, відчуваючи гострий біль, що розливався по всьому тілу. Але він був живий. §B'О, дякувати богам, що ти в порядку.'§! Крукстон встав з місця, оточений різним медичним обладнанням і великою кількістю стимпаків. Радтаргани, що зібралися поблизу, виглядали полегшеними, побачивши, що Король Тарганів живий. §B'Твої радтаргани все валяли. Великий з світлом в оці, здається, заспокоїв їх. Але вони спричинили величезний хаос, поки ти був непритомний. Вибач, я забігаю наперед. Як ти себе почуваєш?'§! Король Тарганів мовчки подивився вгору. 'Я... я живий.' - відповів він чоловікові. §B'Я помітив. Не знаю як. Той вибух прорвав всю кімнату. Того в'язня, якого ти допитував, від нього майже нічого не залишилось.'§! Потім військовий чоловік припинив свою балаканину. §B'*зітхання*, гаразд. Це чудо, що ти все ще живий. У нас є купа стимпаків і ліків від опіків. Ти, мабуть, почуватимешся слабким протягом наступних кількох днів і матимеш труднощі з ходьбою. Але все буде добре. Отець Ньюмен і я намагаємось заспокоїти людей. Як ти розумієш, ходять чутки, що ти не вижив.'§! Король Тарганів мовчки дивився, але потім зібрався з силами і запитав: 'Крукстон, що... що саме є твоєю посадою в Гріфтонській міліції?' - запитав Король Тарганів. §B'О, я офіцер, керую одним з більш досвідчених батальйонів. Чому?'§! Крукстон запитав, здивований зміною теми. 'Та ні, просто думаю, що настав час для заслуженого підвищення, як тобі "Права рука Короля Тарганів"?' - запитав Король Тарганів, знову з'явившись з його характерною усмішкою. Крукстон задумався над пропозицією, а потім посміхнувся: §B'Це звучить добре, бос.'"
nf_rck.705.a: "Досвід майже смерті"
nf_rck.11.t: "Зміна умов перемоги"
nf_rck.11.d: "*тік* *так* *тік* *так*, довоєнний годинник тікає на стіні кабінету наглядача. Тепер це перетворилося на трон Короля Тарганів. З кожною секундою приходить відчуття марно витраченого часу в буремну зиму. Біля нього, сержант Тарган лежав на землі, відпочиваючи після славної останньої експедиції. А зліва від нього стояв Сіріус. Нещодавно знайдений і врятований з огидного експерименту Сховища 37. 'Що тепер?' - запитав Король Тарганів, поглядаючи на карту своїх останніх завоювань. §P'Ну...'§! Сіріус почав. §P'Цей регіон, здається, знаходиться під загрозою вторгнення з Канади з півночі...'§! Сіріус вказав на карту, щоб підкреслити великі міста канадських прерій, які значно переважали Гранд-Форкс і навколишні поселення. 'Ми постійно оточені титанами. І вони, здається, не дуже хочуть стати нашими близькими друзями.' - відповів Король Тарганів, з глибокою байдужістю в голосі. Королівство Манітоба завжди вважало 'монархію' Короля Тарганів образою їхньому способу життя. І Республіка Трьох Річок ніколи не визнавала легітимність Короля Тарганів. §P'А що щодо півдня? І заходу?'§! Сіріус відповів. §P'Подивись, тут є спільноти, які всі перебувають під загрозою вторгнення чи війни. Чому б нам не спробувати співпрацювати з ними? Тоді ми можемо зосередити всю нашу увагу на запобіганні агресії з півночі.'§! Король Тарганів мовчки поглядав, не вірячи в цю ідею дипломатії замість насильницького завоювання. Незабаром на його обличчі розпливлася усмішка. 'Знаєш... це може спрацювати. Давайте зробимо це! Давайте знайдемо нових друзів!'"
nf_rck.11.a: "Цікава стратегія"
nf_rck.564.t: "Король помер"
nf_rck.564.d: "Король Тарганів мертвий, наша земля поділена, радтаргани винищуються на наших колишніх землях. Гріфтон потрапив під контроль Сховища 37, і починається боротьба за владу між AI-надзирателем і божевільним лицарем, який проповідує мораль. Божевілля, божевілля поглинає землю. Де є божевілля, там є сум, і де є сум, там є хаос. Хаос – це середовище, де розцвітає радтарган. Люди, що залишилися на нашій землі, давно нас покинули. Ми залишилися самі. Ми більше не є нічим, окрім Радтарганного Рою."
nf_rck.564.a: "Воскресіння Радтарганного Рою"
nf_rck.565.t: "Все розвалюється!"
nf_rck.565.d: "Все справді розвалюється. Без людей немає контролю. Радтаргани не є колективним розумом. Немає єдиної ідеї 'Радтарганної Імперії', що тримала б суспільство разом. Ця мрія померла разом з Королем Тарганів. Радтарганний Рій не може довго витримати. Кожного тижня контроль стає слабшим і слабшим. І врешті-решт, Радтарганний Рій розпадеться. §RНічого не можна зробити, щоб цього уникнути.§! Єдина мета цієї нації тепер – подивитися, як довго вона зможе витримати, і як далеко вона зможе розширитися, перш ніж повністю розпадеться в анархію. І буде поглинена своїми ворогами. Це здається неможливим завданням. На щастя для нас. Є ідеальний радтарган для цієї роботи."
nf_rck.565.a: "Час встановити новий рекорд"
nf_rck.566.t: "Вхід: Сержант Тарган"
nf_rck.566.d: "Годинник тікає. Кожен день, витрачений на марні спроби, – це ще один день, коли контроль над Радтарганним Роєм вислизає з рук. Без Короля Тарганів, радтаргани, що залишилися на землях, які нам належать, почали слідувати за другим у команді Короля Тарганів: Сержантом Тарганом. Золотий Радтарган, найсильніший серед радтарганів Короля Тарганів, який особисто врятував Короля Тарганів одного разу від катастрофи. Але не зміг зробити цього вдруге, і зараз цей гнів, який відчуває Сержант Тарган, не можна стримати. Сержант Тарган зробить усе, щоб помститися! І організує радтарганів на стільки, на скільки зможе.\n\n §RЯк було сказано раніше: дійте швидко.§! §MКонтроль Сержанта Таргана§! активно погіршується. І це не можна повністю зупинити. Тепер все залежить від вас, щоб провести Сержанта Таргана через цю кампанію. Ведіть його так далеко, як він зможе! Помстіть Короля Тарганів! Поки не стало занадто пізно!"
nf_rck.566.a: "Золотий Радтарган виходить на сцену"
nf_rck.576.t: "Повільний наступ"
nf_rck.576.d: "Події просуваються повільно. Сховище 37 досі не захоплений, але часу ще вистачає. Пройшло 25 днів з початку наступу, і хоча мета не досягнута, Король Тарганів не хвилюється. Насправді, він почав проводити щоденні відвідування своїх патрулів радтарганів, спілкуючись з командирами підрозділів і підвищуючи мораль. 'Вітер за нашими спинами! Не здавайтесь!' стало гаслом кампанії. Отець Ньюмен висловив велике занепокоєння, що якщо ця кампанія триватиме занадто довго, воля людей почне ламатись. Почали виникати суперечки між ними щодо тактики та лідерства. Крукстон, який все більше перебував під тиском, змушений був медіаторити між ними, знаходячи компроміси. Кампанія далеко не програна, але тріщини починають з'являтися.\n\n §RМожливо, вам варто пришвидшити процес.§!"
nf_rck.576.a: "Король Тарганів залишаєтся спокійним"
nf_rck.577.t: "Наближається катастрофа"
nf_rck.577.d: "Що відбувається? Питання виникають на вулицях Гріфтону, люди обіцяли швидку перемогу, їхня лояльність і служба в армії радтарганів Короля Тарганів повинна була принести багатство і процвітання від захоплення непереможного Сховища на південь. То чому затримка!? Це швидко перетворюється на піар-кошмар для Короля Тарганів, чия фірмова усмішка і сміх швидко зникли, збираючи всі яскраві уми, які в нього залишились. Отець Ньюмен, Крукстон і Король Тарганів почали мікроменеджити фронт, і три різні особистості, здається, кладуть свої відмінності на місце через ту халепу, в яку перетворилась ця кампанія. Це безсумнівно є проблемою для репутації Короля Тарганів. Але військова ситуація поки що стабільна."
nf_rck.577.a: "Ну, це могло б бути краще"
nf_rck.578.t: "Остаточний ставка"
nf_rck.578.d: "Пройшло 75 днів з початку цієї кампанії, і все почало руйнуватись. Армія Радтарганів, колишня найбільша сила Короля Тарганів, розвалюється та розпадається. На домашньому фронті почали виникати масові повстання в Гріфтоні та навколишніх громадах. Отець Ньюмен швидко взявся до роботи, щоб загасити будь-які повстання, що закликали до вбивства Короля Тарганів. Гріфтонська міліція почала бунтувати, змусивши Крукстона відійти від наступу, щоб запобігти повномасштабній громадянській війні, що загрожувала скинути Короля Тарганів. Це катастрофа!\n\n Король Тарганів взяв на себе прямий контроль над тим, що залишилось від його зруйнованої армії. Зібравши радтарганів та міліціонерів, він вирішив поставити все на останній шанс, щоб пробити вхід до Сховища 37. Це його останній шанс. Якщо цей наступ провалиться, майже напевно Сховище 37 почне просуватись в Гріфтон, що принесе загибель кампанії Короля Тарганів."
nf_rck.578.a: "Остаточна можливість. Давайте зробимо це."
nf_rck.579.t: "Моментум вичерпано"
nf_rck.579.d: "Все скінчено. Будь-який і весь моментум, який ця кампанія колись мала, вичерпано до кінця. Жителі Гріфтону відкрито повстали, Отець Ньюмен не зміг впоратись із їхньою тривогою через повільний наступ. Він замкнувся в церкві, зачиняючи двері на замок заради власного захисту. Крукстон був заарештований своїми власними міліціонерами, які відкрито почали координувати свої дії з силами Сховища 37 і підсилювати їх ряди. Єдиний, хто залишився з Королем Тарганів до самого кінця – це Сержант Тарган, який не припиняв наступу ні на мить. Бачачи, як його кампанія розвалюється на очах, Король Тарганів подивився на небо і задумався:"
nf_rck.579.a: "Чи коли-небудь цей кошмар закінчиться?"
nf_rck.667.t: "Екзодус з Гріфтону"
nf_rck.667.d: ""§BЧорт! Вони тут. Я чую їх! Ти не чуєш?! Ті прокляті Сховище-Боти втекли з Гріфтону кілька годин тому! Нам треба вибиратись звідси. Думаю, ми були одними з останніх, кого наказали екстрадувати до Сховища 37. Кляті залишили нас позаду. Але не забули забрати Отця Ньюмена з собою... Та на це не час. Слухайте, люди. Беремо все, що зможемо, і переходимо через річку на схід звідси. Знаю місце, куди можемо втекти... Місце, де я не був давно, давно.""
nf_rck.667.a: "Крукстон тікає на схід"
#side character events lol
nf_rck.668.t: "Крукстон намагається як може!"
nf_rck.668.d: ""§BЧуєш, знаєш, я не курю, не зловживаю психотропами і не куражу стімпаками. Але, слухай, немає нічого освіжаючішого за холодну Нука-Колу після важкого дня!§!"\n\n Крукстон сів в офісі Короля Тарганів, потягуючи освіжаючий напій, поки милувався декораціями, які тепер прикрашали нещодавно відремонтований офіс надзирателя. Очікував би плакати з радтарганами, але стіни були заповнені картами зірок і підписами сузір'їв. "§BЧорт, ніколи не знав, що бос такий фанат космосу. А що він робив до того, як ці штуки почали слідувати за ним?§!" Перш ніж його розум зміг знайти відповідь, в кімнату увійшов Король Тарганів, схвильований, неохайний і здивований тим, що Крукстон так безтурботно розслабляється. "Крукстон! Що ти тут робиш? Я ж наказав тобі оцінити наші оборонні позиції проти Республіки Трьох Річок?" "§BВоу, воу! Я це зробив, бос, зробив! Все в порядку! Вони точно не зможуть пробити! До того ж, я працюю над чимось особливим... Скажімо так... твої радтаргани завжди можуть нести... 'зброю'.§!" Дитяча усмішка з'явилась на обличчі Крукстона, і відсутність тонкої натяку на те, що він має на увазі, не здивувала Короля Тарганів. "Я вже говорив тобі це раніше. Я не пожертвую радтарганами. Це все ще 'ні'. Тепер можеш повернутися до своїх обов'язків і керувати піхотою? Я і так маю достатньо справ, намагаючись вирішити цю політичну плутанину, в яку я потрапив." "§BBос, саме тому я і тут. Я приніс тобі ще одне.§!" Крукстон вивів другу пляшку Нука-Коли, сховану в його пальті. "§BЗараз сніжить. Тому вона ще холодна. Відпочинь, бос, не перенапружуйся.§!" Король Тарганів прийняв пляшку і тихо пробурмотів під носа:\n\n"Дякую.""
nf_rck.668.a: "Добре мати друзів в пустці."
nf_rck.669.t: "План на випадок непередбачуваних ситуацій"
nf_rck.669.d: ""§BЩо такого особливого в ньому?§!" – запитав Крукстон у Короля Тарганів, помітивши, як Сержант Тарган веде патруль радтарганів. "§BНу, так, він трохи світиться, але чому саме він? Чому цей? Чому він твій 'права рука'?§!"\n\n "Є багато чого, чого ти не знаєш про мене, Крукстон. Багато. Король Тарганів на мить замовк і подивився, як Сержант Тарган знищує людських оборонців у навчальному бою. "Той радтарган особливий для мене. Якщо зі мною щось трапиться, я знаю, що його буде неможливо контролювати. Що нагадує мене, Крукстон, чи отримав ти свій примірник плану? На випадок, якщо я зустріну свою непередбачувану долю?" "§BI, так, бос. І, слухай, я дуже вдячний. Але ці радтаргани... Вони не слухаються мене, як тебе. Що я маю робити? Махати твоєю головою на палиці?"§! "Крім твоїх зловісних жартів, так, "Проект Лялька" повинен бути ініційований тобою, і тільки тобою. Я довіряю тобі, Крукстон. Ти один з двох людей, яких я знаю, хто може це зробити." §BI розумію... Бос, мені приємно, але для власної безпеки, я справді сподіваюся, що до цього ніколи не дійде. Як ліки? Вони хоч допомагають? Як твій стан? Ти ще... чуєш щось?§!"\n\n "Є добрі дні і погані дні. Парні і непарні. Я не знаю, скільки часу залишилось моєму розуму. Але моє тіло... моє тіло довелося виявити справжню витривалість. Я ж найбільш витривала людина в пустці. Але це не важливо зараз. Ми все ще по коліна в самій кампанії."
nf_rck.669.a: "Отже, все-таки є план."
nf_rck.700.t: "Будівництво дороги вночі"
nf_rck.700.d: ""§BЧорт, зірки сьогодні просто неймовірні. Подивись, бос!§!" Крукстон був вражений безліччю сузір'їв, видимих без переважного світлового забруднення від довоєнних міст. Тим часом команди волонтерів Сховища 37, радтарганів та місцевих добровольців спали в наметах, чекаючи наступного дня, щоб продовжити будівництво дорожньої мережі. "§BВоу, почекай, що це за зірка, я думаю, це... ну, червона планета?"§! "Це буде Марс, Крукстон." Промовив Король Тарганів. "А праворуч від нього... Пояс Оріона." "§BНічого собі, а що то за зірка під ним?§!" "Там... Це... Це буде Великий Пес. І, Крукстон, бачиш ту зірку? Яскраву?" "§BYe, звісно, як я її міг пропустити?§!" "Ця зірка називається §PSirius§!. Вона найяскравіша на нічному небі." "§BBос, як ти так добре розбираєшся в тому, що відбувається там вгорі? Вони ж всього лише точки..."\n\n "Це... Це довга історія. Але давай просто скажемо, я зустрів свою зірку, і все інше стало на свої місця.""
nf_rck.700.a: "Прекрасна ніч для спостереження за зірками."
nf_rck.706.t: "Бути? Чи не бути?"
nf_rck.706.d: ""§BДобре, ось план... чоловіче. (А, бос, чому він просто дивиться на нас?).§!" Маскарад не зводив погляду, ігноруючи двох головорізів, що утримували його в полоні, і не боячись наслідків. "Мені доводиться робити все самому. Добре, ось угода, містер Маскарад. Я маю око для талантів, і незалежно від того, хочеш ти визнати це чи ні. У тебе є талант. Я бачив громади, які містяться на твоїй землі. Вони бездоганні, справжнє мистецтво. Я з радістю прийняв би тебе до свого внутрішнього кола. Повір, це хороші новини для тебе! Мої радтаргани – це відмінні союзники! Не буде більше потреби в людській міліції! Ти зможеш зосередитись на своєму справжньому таланті: адміністрації, без турбот і без особливого нагляду. Чи приєднаєшся до нас?" Король Тарганів благав, що було незвичним для завойовника. "§2Який ти цікава людина... Ти не маєш жодної честі? Як твоя репутація виживе, якщо тебе запам'ятають як короля, який просить перед завойованими?§!" Маскарад був збентежений і зацікавлений. "О, я думаю, що це буде ганебно, звісно. Але в кінці кінців я той, хто володіє радтарганами. Якщо це викличе повстання, то так і буде. Мої радтаргани не переймаються тим, що інші думають про мене. Вони вірні мені." "§2Цікаво... ця відсутність сорому... ця відсутність... самосвідомості. Це як танець. Я приймаю ці умови... Мене дуже цікавлять тонкощі такої незвичної форми правління. І я цікавлюся, коли маска врешті впаде. Як далеко твої радтаргани можуть тебе завести, Королю Тарганів? Як далеко, поки ти не зустрінеш свого рівного? Як далеко, поки твоя удача не закінчиться?§!" "Я не знаю, але вони довели мене до цього моменту, чи не так? Попереду ще багато перешкод. Але я радий, що ти з нами. Ласкаво просимо на борт, містер Маскарад." "§2Будь ласка... Називай мене... Джокером... Це тільки відповідає моєму статусу адміністратора дурнів...§!" \n\n "§BОх... це було холодно, чувак.§!"
nf_rck.706.a: "Джокер дебютує"
nf_rck.707.t: "Зів'яла троянда"
nf_rck.707.d: ""§RЧому ти тримаєш мене тут, ТИРАНЕ!?§!" Сестра Роза, вчетверте за той вечір, намагалася вирватися з крісла, в яке її закували. Так само, як і Джан до неї. "§RДо того ж, чому ця кімната виглядає так, ніби тут стався вибух? Стіни буквально падають! Ти коли-небудь прибираєш цей проклятий Сховище? Таргане!?§!" Сестра Роза була розлючена і не здавалася вдячною за гостинність Короля Тарганів. "§BВласне, так, тут справді стався вибух, бос ледь не загинув і все таке.§!" – відповів Крукстон.\n\n "Так, це правда. Мій час ледь не настал. Я відчував, як мене відносить в інший бік. Але щось... щось повернуло мене. Тепер, Сестро Розо з Дітей Атома, я знаю про вашу релігію і вашу тривогу щодо Другого Потопу. Я не ігнорую цю тривогу. Це цілком виправданий страх. Ми не вторглися на вашу землю з огиди чи бажання викликати другий потоп. Насправді, зовсім навпаки. Ми хочемо набрати вас і ваших братів і сестер з Дітей Атома в нашу зростаючу імперію радтарганів... ну, не зовсім імперія ще. Це довгострокова мета. Насправді, все, чого ми хотіли – це забрати контроль над вашою зовнішньою політикою та оподаткуванням в обмін на особисту допомогу моїх радтарганів. Це справжня вигода для всіх. Я отримую ресурси та розширення моєї території, а ви можете використати мої радтаргани, щоб забезпечити, що Другий Потоп ніколи не стане реальністю. Я також запропоную поступку, я дозволю релігійним місцям Дітей Атома залишатися без податків і недоступними для радтарганів. Щоб зберегти автономію вашого народу і особисту свободу. Повірте, це найкраща угода, яку ви могли б отримати.""
nf_rck.707.a: "..."
nf_rck.708.t: "Зів'яла троянда Ч.II"
nf_rck.708.d: "Шокована, Сестра Роза сиділа тихо, осмислюючи запропоновану угоду. "§RА де я тут буду? Ти плануєш позбутися мене! Прибрати мене як конкурента?!§!" – відповіла вона з гнівом. "§BА, напевно, ні. У боса непогана репутація з тим, щоб дозволяти людям під ним займатися власними справами. Він фактично носить міні-ядерну бомбу в себе завжди разом з його армією радтарганів. Навіть якщо ти його вб'єш, це просто призведе до смерті всіх. Тобі потрібно повністю знищити його армію радтарганів. Ха! Це як той Другий Потоп, про який ви хвилюєтесь, знаєш?§!"  "§RДругий Потоп. І, хоч мені і не хочеться це визнавати, але ти правий. Добре. Я погоджуюсь. Але будь обережний, таргане і...?" "§BО, я Крукстон.§!" "§R...Крукстон. Якщо моїх людей буде пошкоджено або використано експлуататорським чином, я вжию заходів. Я не одна з твоїх маленьких комах, яких ти змушуєш танцювати за наказом. Я насамперед стою за інтереси мого народу. Ти зрозумів?§!" "Звісно, це завжди було частиною плану. Я не можу все контролювати сам. Це насправді на користь нам всім, що ти залишаєшся сильною, здатною і збереженою. Як там було те поняття, яке я вивчав... Оборона в глибині! Ось! Так! Ласкаво просимо на борт, Сестро Розо. Тільки попередження: прізвисько Сестра Тарган вже починає поширюватися." \n\n "§RЧудово... Тепер розв'яжи мене, проклятий!§!"
nf_rck.708.a: "Троянда з гострими шипами"
nf_rck.709.t: "Втрата розуму"
nf_rck.709.d: ""§BКрукстоне, це відбувається. Кінець наближається.£!" – Король Тарганів і Крукстон сиділи в Офісі Наглядача, оточені великою кількістю радтарганів, які охороняли двох високопосадовців. "§BOh ні... Босе, не кажи так. У нас ще є час! Ми ще можемо зрозуміти, що не так! Ти ж приймав ліки!§!" Крукстон хвилювався і дійсно хотів знайти рішення. \n\n "Так, так, я приймав. Це допомогло суттєво. Я не знаю, що б я робив без них. Але ми наближаємося до роздоріжжя. Мій розум починає підводити мене, моя справжня мета так і не знайдена, і це пожирає мій розум кожну хвилину. І та ЧОРТОВА двері все ще не відкрита! Чому так довго?!" – Король Тарганів зітхнув і відкинувся на спинку стільця, продовжуючи свою тираду. "Я почав бачити і чути різні речі, Крукстоне. Я боюся, що скоро не зможу бути достойним вигляду. Стає важко продовжувати так." "Проект Лялька може бути реалізований, якщо все буде йти так." "§BНі! Ні в якому разі, босе. Ми знайдемо все, що тобі потрібно. Ми підтримаємо тебе на кожному кроці. Я, сержант Тарган, громадяни Сховища 37. Усі ми!§!" "Я ціную твою лояльність, Крукстоне, тому я доручаю тобі здійснити Проект Лялька, коли настане час. Зараз нам потрібно готуватися до його впровадження. Наші кордони, Крукстоне, онови мене про наші кордони." \n\n "§BНу, все як завжди. І новини дуже повільно досягають нас через радтарганів. На заході є сильне плем’я, справжнє плем’я, стародавні аборигени. Вони час від часу мають сутички з радтарганами на кордоні. Але якщо ми відтиснемо їх до річки... ми будемо в безпеці. На південь... Багато хвороб. Мабуть, краще не втручатися, але якщо доведеться, твоє особисте керівництво буде необхідне. Я не ризикував би відправляти міліцію туди. Це занадто небезпечно. Там є плем'я Гулів, що охороняє вхід. Я давно не перевіряв їх, оскільки кордон тихий, але якщо вони там, ми можемо змусити їх залишити все, що там є... там. А на південь... Ну, ми тут сидимо, отже, поки що все добре. Але хто знає, що може статися, коли ті титани відновлять сили і повернуться на південь.£!" "Розумію. Добре, поспішаймо. У нас мало часу. Піднімайте радтарганів, нам треба діяти швидко. Ми змагаємося з часом зараз."
nf_rck.709.a: "Краще рухатися швидше."
vault_war.9.t: "Сховище 37 наступає на наші землі!"
vault_war.9.d: "Зі смертю Короля Тарганів його землі, які раніше патрулювалися та охоронялися радтарганами, опинилися під негайною загрозою. Наші сусіди, здається, працюють спільно, намагаючись забрати частину наших земель. Це катастрофа! Ще гірше, що ми не можемо дати належну відповідь, поки порядок не буде відновлено на нашій землі. Сховище 37 швидко оволоділо нашими позиціями та захопив Гріфтон. Ми маємо лише сільську прикордонну територію на заході, щоб організувати відповідь."
vault_war.9.a: "Реорганізувати оборону на заході"
vault_war.14.t: "Старі Віряни наступають на наші землі!"
vault_war.14.d: "Землі Короля Тарганів продовжують ділитися серед наших сусідів. Ми навіть не можемо дати належну відповідь! Старі Віряни швидко проникли в нашу глибину. Йдуть повідомлення про сутички з Сховищем 37 та Старими Вірянами на їхньому новому кордоні. Це може створити можливість."
vault_war.14.a: "Ігнорувати це. Нехай беруть."
vault_war.15.t: "Церква Сховища наступає на наші землі!"
vault_war.15.d: "Землі Короля Тарганів продовжують ділитися серед наших сусідів. Ми навіть не можемо дати належну відповідь! Це катастрофа! Поклонники Атома захопили наш західний фронт. Це створює високо напружену ситуацію на кордоні з Старими Вірянами. Вся ця територія схожа на порохову бочку!"
vault_war.15.a: "Чекати. Ми повернемося пізніше."
vault_war.16.t: "Два Народи наступають на наші землі!"
vault_war.16.d: "Землі Короля Тарганів продовжують ділитися серед наших сусідів. Ми навіть не можемо дати належну відповідь! І, до всього іншого, два народи, відомі своєю некомпетентністю і схильністю до внутрішніх чвар, знайшли спільну мову і вирішили наступати на наші землі. Вони захопили невеликий шматок на південь, щоб не порушити рівновагу серед великих сил, що ділять наші землі. Біженець Тарганів, схоже, пережив початкові анексії. Ми не можемо дозволити їм з цим пройти!"
vault_war.16.a: "Це зайшло занадто далеко."
vault_war.10.t: "Що робити з Гріфтоном?"
vault_war.10.d: "Зі смертю Короля Тарганів, перед тим як його вторгнення в Сховище 37 почалося, його армія радтарганів почала розсіюватися в великій кількості. Міліція Гріфтона також відступила в саме місто, щоб відбивати вже диких, неуправляних радтарганів, що залишилися в місті. Землі Короля Тарганів стали беззахисними. До того, як Король Тарганів встановив контроль, тут існувала Республіка Гріфтон, яка мала тісні зв'язки з Республікою Трьох Річок. Проте, якщо ми будемо діяти швидко, Республіка не встигне відреагувати. Ми можемо забрати все, що хочемо. Головне – не бути надто жадібними. Було б дуже нечемно потривожити сусідів."
vault_war.10.a: "Невеликий шматок для нас не зашкодить!"
vault_war.11.t: "Що робити з Кавальєром?"
vault_war.12.t: "Що робити з Кандо?"
vault_war.13.t: "Що робити з Маквіллом?"
nf_RCK.900.t: "Погляд у зірки"
nf_RCK.900.d: ""Крукстоне... час... час... час... час..." – Король Тарганів був слабким і маренням. "Я... я більше не... я не я... Мені потрібно. Мені потрібно, щоб ти зробив це... хехехе." Розум Короля Тарганів нарешті досягнув своєї межі. "§BБосе... я... я вибачаюсь. Ми зробили все, що могли. Ми шукали всюди. Ми прорвали двері. Ми дали тобі всі можливі ліки. Чому все повинно бути так?§!" Очі Крукстона наповнились сльозами. Всі його зусилля, всі зусилля Короля Тарганів, до чого це все призвело?\n\n "Тепер... тепер... все добре! Я довіряю тобі, Крукстоне, Ти станеш чудовим Королем Тарганів! Чудовим Королем Тарганів! Можливо, навіть ЛУЧШИМ КОРОЛЕМ ТАРГАНІВ, ніж я!" Манера Короля Тарганів раптово змінилася, ставши невідповідною для ситуації. "§BБосе... ти втрачаєш це. Ти... ти справді втрачаєш це.§!" Закривши очі, Крукстон підняв свій пістолет 9мм до грудей Короля Тарганів, який на цей момент вже не припиняв марити про славу радтарганів і про запуск ракети, щоб побачити зірки. "§BЧорт, Крукстоне, зіберися, чоловіче. Все буде добре, ти зможеш. Просто пам'ятай план.§!" Тим часом марення Короля Тарганів нарешті припинилося, і короткий момент ясності охопив його в останні хвилини. "Я готовий побачити зірки, Крукстоне, я готовий побачити найяскравішу з них усіх... Я готовий побачити... §PSirius§!"\n\n Націлившись на груди Короля Тарганів, приціл Крукстона трохи тремтів, потім стабілізувався. І нарешті, він випустив один постріл, постріл, що відлунював в нічному небі. Зірки мовчки дивилися на цей добрий вчинок Крукстона."
nf_RCK.900.a: "Час для відпочинку Легенди"

nf_RCK.901.t: "Погляд у зірки"
nf_RCK.901.d: "На холодному, сніжному ранку, Король Тарганів вийшов на замерзлу територію, що оточувала його трон. Наскільки він міг бачити, земля була покрита білим, порошковим снігом. Групи радтарганів патрулювали територію, а вгорі, висіли зірки. Прекрасна палітра мерехтливих зображень. Повна сузір'їв та фантастичних образів, що так захоплювали Короля Тарганів багато років тому. "Але для чого все це?" – запитав він, стоячи в холоді. "§P... щоб врятувати мене, правда?§!" – прошепотіла голос Сиріус. Вона з’явилася з тіні, що стало сюрпризом для Короля Тарганів, який лише мовчки стояв. "Ти... ти дуже тихий. Я... я... забув." Хвиля смутку наповнила Короля Тарганів. Сиріус підійшла і поклала свою голову йому на плече. "§PВсе добре, Регі, ти зробив це. Тобі не треба більше хвилюватися. Ти врятував мене, ти врятував нас усіх. Ти тепер герой. Ти це зробив.§!" Промовивши ці теплі слова, вона обняла Короля Тарганів у теплому обіймі. Через це відчуття тепла, безпеки та любові, смуток на обличчі Короля Тарганів швидко перетворився на ніжну посмішку. І хоча обидва залишалися мовчазними, вони дивилися, як сонце почало сходити, а зірки одна за одною зникали. Сніг почав танути, і відчуття миру нарешті охопило розум Короля Тарганів."
nf_RCK.901.a: "Один чудовий ранок"

nf_rck.878.t: "Зірки, які формують історію"
nf_rck.878.d: "Оглядаючи Сховище Короля Тарганів, Крукстон зібрав свої сили і почав свою промову. Він зібрав всіх, хто був важливим, і тисячі громадян слухали уважно через свої домашні радіоприймачі або в маленьких барах та тавернах. Тиша наповнила повітря Північного Співтовариства, коли права рука Короля Тарганів почала свою промову.\n\n "§BДрузі, я сьогодні роблю це оголошення з трагічними новинами. Король Тарганів, легенда пустки та беззаперечний майстер радтарганів. Помер. Його розумовий занепад досяг такого рівня, що він більше не міг виконувати функції глави держави. І вже тим більше, вести своїх радтарганів у похід. Час оголосити про план його спадкоємства. Король Тарганів призначив мене, Крукстона, своїм наступником. Його... "здібність" контролювати та керувати радтарганами також була передана мені. Щоб висловити свою невимовну вдячність і відданість спадщині Короля Тарганів, я прийму його ім'я як своє. Я більше не Крукстон, друг Короля Тарганів. Тепер я – Крукстон, Король Тарганів 2. І я планую продовжити спадщину Короля Тарганів. Продовжити громадські роботи, які він започаткував, забезпечити безпеку кожного жителя Північного Співтовариства, стояти проти ворогів і тиранії. І, нарешті, продовжити легенду. Легенду Короля Тарганів."
nf_rck.878.a: "Прибув Король Тарганів 2."
##Привіт? Може хтось допомогти? Я... я в пастці. Не знаю, чи це повідомлення дійде... Я у Сховищеі... Сховище 37. Допоможіть! Будь ласка!
