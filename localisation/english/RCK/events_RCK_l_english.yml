l_english:

nf_RCK.1.t: "Гріфтонські найкращі"
nf_RCK.1.d: "«Цей мутфрут зіпсований!» – вигукнув один чоловік.\n\n«Вакуумна трубка вибухнула!» – сказав інший чоловік, обурено.\n\n«Джими-Шапка не спрацювала», – буркнула вагітна жінка зневірено.\n\nЗнову і знову торговий пост, який колись був символом багатства для їхніх сусідів на півночі Брентону, продовжував занурюватися в біль і страждання. Гріфтон вистояв під час Великої Війни, уникаючи нападів, але якби його колишні мешканці побачили, як їхнє місто перетворюється на Гріфтон, розплідник дурнів, що завжди отримують обдурені умови, вони, напевно, пожалкували б.\n\nЗвучить постріл, і мало хто звернув на це увагу – крім Крукстона, члена міліції Гріфтона. Це не був перший випадок, коли когось викидали з бару Фішера, і було не важко зрозуміти чому, коли тепер поранений чоловік буквально опинився на землі, за ним пішла невелика зграя радітарганів і ще кілька пострілів з дробовика. Крукстон мав рушницю з прицілом, але коли зрозумів, що всередині Фішера радітаргани зникли, він поклав її. Він міг би стріляти в радітарганів, але чоловік був дещо зайвий.\n\n«Іди геть!» – крикнув Фішер, відповідальний за заворушення чоловік втратив свідомість, а радітаргани розбіглися. Бродячі собаки вже почали рвати тих, хто не зміг втекти, а чоловік залишився на самоті. Якщо його залишити тут, він точно помре, і це не буде перший випадок.\n\nЯк тільки радітаргани зникли, Крукстон зітхнув. Чоловік був брудний і покритий ранами, підняти його означало випустити безліч дрібних тарганів із його одягу, але це не було Пограниччям. Отче Ньюмен винен йому за те, що закрив справу про вбивство, зрештою. Крукстон не помітив, як люди почали дивитися на нього, намагаючись допомогти – міліція зазвичай не робить цього. Та, з іншого боку, можливо, саме радітаргани привертали таку увагу."
nf_RCK.1.a: "Поранення від дробовика потрапили лише в його зад."
nf_RCK.1.b: "Радітаргани ховалися краще, ніж усі очікували."
nf_RCK.1.c: "Глядачі мовчали, спостерігаючи за добрим вчинком Крукстона."
nf_RCK.2.t: "Преамбула до Захоплення"
nf_RCK.2.d: "Ззовні церкви Отця Ньюмена в Брентоні зібрався натовп. В цей момент чутки швидко поширювалися, що велична постать, що має під контролем армію радітарганів, перебуває всередині, і банальна правда вже давно була загублена у плітках. Ньюмен підняв свої одноокі окуляри і, закривши завісу, повернувся до Крукстона та чоловіка, який раніше був поранений від дробовика, чоловіка, що представився як Регій Блаттарія.\n\n«Я б тебе просто викинув туди», – сказав Ньюмен. «Це не варто того». \n\n§B«Ти винен мені, отче»,§! – сказав Крукстон, склавши руки. Але перш ніж виникли нові суперечки, Регій Блаттарія зітхнув. Йому не подобалося так поводитися з людьми. Але якщо це допомогло уникнути безладу і відплатити борг двом чоловікам, він це зробить і надіятиметься, що більше не доведеться цього робити.\n\n«Тримайтеся, ви двоє, я це вирішу», – виголосив Регій, змушуючи обох чоловіків замовкнути, здивованих тим, що цей таємничий чоловік планує зробити. Передня лінія міліції Гріфтона, яка могла так само захищати громадян, як і стріляти по грабіжниках з Пограниччя, не звертала увагу на церкву, лише зрозумівши, що чоловік, відповідальний за заворушення, вийшов, проходячи повз їхні постійні пости. Регій Блаттарія закрив очі і почав говорити. Раптом радітаргани, що потрапили в каналізацію, почали підніматися і бігти до нього. Тривожно, що радітаргани були організовані, дисципліновані. Жоден раз прості комахи не демонстрували такого рівня координації. Іронія не була втрачена на корумпованих і неорганізованих міліціянтах Гріфтона, які спостерігали за цим. Всі замовкли, коли Регій Блаттарія вимовив:"
nf_RCK.2.a: "Регій зібрав усіх своїх радітарганів!"
nf_RCK.2.b: "Блаттарія говорив про тих, кого забрали до Сховища 37."
nf_RCK.3.t: "Мотиви та Мандати"
nf_RCK.3.d: "Тиждень по тому Крукстон, отець Ньюмен та Регій Блаттарія стояли біля невідміченої могили колишнього лідера міліції Гріфтона.\n\n«Ти багато чого робиш», – сказав Регій. «Не зовсім впевнений, як я це відчуваю».\n\nОтець Ньюмен усміхнувся. «Те, що ми маємо, – це шанс зробити Гріфтон кращим, ніж він коли-небудь був. Є багато чого, що можна зробити з підкореними шкідниками, яких більшість людей ненавидить».\n\n§B«Це робиться, щоб усунути загрозу»,§! – сказав Крукстон, схрестивши руки. §B«Сховище 37 брало людей раніше, і на відміну від решти Пограниччя, воно фактично знаходиться по цей бік річки. Його потрібно знищити, і тепер у нас є шанс»§!\n\n«Знаєш, я просто хотів допомоги, щоб потрапити туди», – сказав Регій, дивлячись на південь, де перша група міліціянтів, яким він навчив тренувати і годувати радтарганів, вже почала діяти, як риба у воді. «Я не планував тягти половину Гріфтона до Сховища 37 з піднятим зброєю, або підвищувати твою посаду, отче, чи давати тобі нагороду, Крукстон – взагалі нічого з цього».\n\n§B«Дивись, наскільки я знаю, це найкраще, що ти зробив»,§! – відповів Крукстон, на його обличчі з’явилася зморшка. §B«Якщо б це продовжувалося так, як було, ми могли б опинитися в ситуації, коли один поганий перестріл у міліції з бандою з Пограниччя призведе до повного краху цієї «Гріфтонської» експерименту. Нам потрібне нове керівництво, і це дозволить людям не шукати... «альтернативи»».\n\n«Просто подумай про те, що тебе чекає», – сказав отець Ньюмен, все ще посміхаючись. «Регій Блаттарія, Король Радтарганів. Ти створиш щось, що не бачилося з часів Ґанна, першого його імені».\n\nЗ цими словами троє чоловіків відійшли від могили, повертаючись, щоб підготуватися до завоювання Сховища 37. Ті роботи та все, що вони робили з людьми, повинні були закінчитися. Звільнені, врятовані, і визволені під керівництвом нового героя, що спускається на пустку: Короля Тарганів."
nf_RCK.3.a: "Ось так Король Тарганів отримав своє ім'я."
nf_RCK.4.t: "Приховані двері, прорвані"
nf_RCK.4.d: "§B«Динаміт готовий до вибуху!»§! – вигукнув Крукстон. Отець Ньюмен і Король Тарганів були неподалік у сусідній кімнаті, з захисними навушниками на головах. §B«3... 2... 1... ВИБУХ!»§! З цим відліком часу величезний вибух прорвався через Спокусливі Двері, які захоплювали Короля Тарганів вже кілька місяців. Потужний вибух поширив шокову хвилю по Сховищу 37, звуки трясіння стін і мерехтіння вогнів налякали мешканців, які тільки пристосовувалися до своїх нових сусідів і нових дієт.\n\nНа різних картах і схемах ця кімната нібито вела до виходу на поверхню, однак жодного виходу з цієї сторони річки знайти не вдалося. Як тільки вибух розвіявся в дим, Регій вбіг усередину до того, як дим встиг випаруватися, в той час як отець Ньюмен, Крукстон і кілька людей з радтарганами почекали, поки їхній зір не відновиться. Коли обличчя Регія стало видимим, на ньому з'явилася велика зморшка, а брови стиснулися.\n\n«Це все? Тут нічого немає!»\n\nУ пориві люті Король Тарганів підняв порожню пляшку від Нука-Коли і жбурнув її в стіну, розбивши її на шматки. Радтаргани, немов нізвідки, одразу почали лизати пролите і прибирати розбиті уламки скла.\n\n§B«Тут справді нічого немає? Я думав, це місце мало бути заповнене запасами чи ще чимось, шефе. Чому все зникло?... Як це все зникло?»§! – Крукстон ламає голову в пошуках відповіді, але зупинився, коли отець Ньюмен знову посміхнувся, його присутність нагадувала швидкий біг Жнеця.\n\n«Мабуть, зараз ідеальний час», – почав він. Регій та Крукстон повернулися, щоб подивитися на нього, але перш ніж будь-хто з них зрозумів, що відбувається, прозвучав постріл. Регій впав на підлогу, його голова забилася кров'ю, і тіло почало судомно рухатися."
nf_RCK.4.a: "Як несподівано."
nf_RCK.5.t: "Ми вже тут були"
nf_RCK.5.d: "§B«Що ти, чорт забирай, робиш?!»§! – вигукнув Крукстон, коли отець Ньюмен прицілив свій 9-мм пістолет у грудну клітку Крукстона. «Крукстон, послухай мене, сподіваюся, ти розумієш, що я повинен був це зробити. Це була необхідність, він... він був занадто небезпечний, щоб йому давати таку владу, він нестабільний. Я повинен був це зробити! Я повинен був!»\n\nОтець Ньюмен так і не закінчив своє монолог, його жахливе зрадництво швидко привернуло лють кількох радтарганів, що знаходилися поблизу. По одному вони почали накидатися, і отець Ньюмен не мав жодних шансів. Вигуки почалися, а потім закінчилися, коли радтаргани забрали його життя. Крукстон скористався моментом, щоб побігти до Короля Тарганів, ввівши йому стимпак, що він тримав на випадок таких надзвичайних ситуацій. Це був не перший раз, коли він знаходив Короля Тарганів в такому стані, і цього разу він був готовий.\n\nКоли радтаргани закінчили своє різанину, розлючені комахи звернулися до Крукстона, на мить запала незручна тиша. Крукстон тримав непритомну голову Короля Тарганів, він, здається, добре пережив кулю в голову. Стимпак Крукстона, здається, швидко давав ефект. §B«Еее, обережно, друзі...»§! – нервово промовив Крукстон, коли зростаюча зграя радтарганів наближалася до нього. Але, на його здивування, вони не напали. Вони підходили до Крукстона з цікавістю і здавалися, ніби розуміли, що він врятував життя їхньому господареві. §B«Чорт забирай, що я накоїв...»§! – тільки й зміг сказати Крукстон, чекаючи, коли Король Тарганів прийде до тями."
nf_RCK.5.a: "Він знову живий."
vault_war.1.t: "Війна в Сховищі"
vault_war.1.d: "Регій Блаттарія зібрав усі можливі сили, які міг надати Гріфтон. Над горизонтом сірого хмарного дня стояли руїни Гранд-Форкс – шпилі з цегли та бетону, плити стін, що приховували небезпеки.\n\nОчі Крукстона звузилися. Крізь вулиці він міг помітити через бінокль, як роботи безпеки Vault-Tec рухаються з відточеною ефективністю. Нічого цінного не залишилося – всі живі давно були забрані в постійно розширюване Сховище. Ходять чутки, що воно йде вниз на кілька миль.\n\nКрукстон помітив, як занепокоєний і відволіканий був Регій Блаттарія, коли той повертався до командного намету, охороняючи його патрулюючими радтарганами. Отець Ньюмен був всередині, сперечаючись про те, як таргани можуть сформувати захисну стіну для обмежених сил міліції, що залишилися. Регій не погоджувався, і вони знову сперечалися про «цінність життя». Справжня розмова для інтелектуальних умів старого світу. Крукстон міг лише терти скроні; чи насправді це час, щоб відступити і переосмислити стратегію, так близько до Сховища? Чи слід йому втрутитися і дати цим двом сварливим дурням зрозуміти, що їх чекає смерть?"
vault_war.1.a: "У нас немає часу! ПОЇХАЛИ!"
vault_war.1.b: "Та ну, що може піти не так?"
vault_war.2.t: "Сховище 37 під облогою"
vault_war.2.d: "УВАГА! УВАГА! Надсмотрщик Т.О.М.А.С. отримав термінове повідомлення! Камери спостереження показують армію чоловіків і радтарганів, що наближаються до міста Гранд-Форкс. Сховище 37 знаходиться в самому центрі міста. Странний чоловік, здається, кричить на натовп пасивних радтарганів. Звичайний чоловік керує міліцією, що рухається серед натовпу. А старий наче координує повідомлення та тактику між ними двома. Надсмотрщик вважає, що ці візитери не є дружніми. Час покликати брата Яна та повністю мобілізувати безпеку Vault-Tec!"
vault_war.2.a: "Що ці ідіоти планують?"
vault_war.3.t: "Наслідки війни в Сховищі"
vault_war.4.t: "Сховище 37 святкує перемогу"
vault_war.4.d: "Король Тарганів був розгромлений, відкинутий назад у сам Гріфтон, і мешканці тут не сприйняли поразку з легкістю. Сотні почали збирати речі та тікати, знаючи, що наше перебування тут означає. Все ж таки слабкі й поранені залишаються. Наші сили почали очищати ділянки від радтарганів, що заблукали під час непідготовленого відступу. Місцезнаходження Короля Тарганів наразі невідоме. Він втратив як свою землю, так і своїх радтарганів. Напевно, він не зможе дістатися дуже далеко?"
vault_war.4.a: "Чи пробував Гріфтон смажений молочний коктейль?"
vault_war.5.t: "Війна в Сховищі: Катастрофа!"
vault_war.5.d: "Гріфтон під облогою, люди злі, місто горить, мешканці намагаються втекти від наближаються сил Сховища 37. Звуки броньованих костюмів і роботів стають все голоснішими. Колись величезна армія радтарганів Короля Тарганів розпалася, не в змозі знайти свого короля. У глибині центру міста зростає натовп, що оточує маєток Короля Тарганів, вимагаючи його голову за той кошмар, який він приніс до їхнього дому. Отець Ньюмен очолює цей бунт, підбурюючи міліцію до перемоги над радтарганами, які захищають бездіяльного Короля Тарганів. Крукстон зник, ймовірно, загинув у бою. Здається, є тільки одне логічне рішення."
vault_war.5.a: "Король Тарганів тікає на Схід."
vault_war.6.t: "Звук Перемоги"
vault_war.6.d: "Король Тарганів вийшов через вхід у Сховище 37 з гордістю. Його завоювання було успішним. Його мета була досягнута, і за допомогою Гріфтона Пустка стала трішки безпечнішою.\n\n Крукстон давав накази, згадуючи, що будь-яких зниклих людей треба витягнути з Сховища та повернути до родичів та друзів. Отець Ньюмен мав підготовану промову для тепер звільнених жителів Сховища. Але побачивши, які спотворені круглі форми ці жителі Сховища здавалися, промова Отця Ньюмена про жертви, смиренність і помірність виглядала дещо недоречною за таких обставин."
vault_war.6.a: "Люди Сховища 37! Ви вільні... (надіємося, щоб скинути вагу...)"
vault_war.7.t: "Вдалий момент!"
vault_war.7.d: "Чоловік, що веде радтарганів, здається, припиняє атаку? Це не те, що ми планували. Що це? Вони проводять зустріч?! Так близько до кордону?! Вони вже на нашій стороні кордону! Вони просто стоять. Говорять, вони справді ідіоти!? Ми повинні скористатися цією безглуздою помилкою. Брат Ян уже почав рухатися вперед, наближаючись настільки, щоб чітко прицілитися і зробити чистий постріл. Чи не є кращим способом забезпечити безпеку наших жителів, ніж усунути джерело проблеми? Один постріл, націлений на того, хто керує радтарганами, має бути достатнім, щоб привести їхню армію в безлад! Ми зможемо пройти прямо в Гріфтон і прийняти наших нових мешканців."
vault_war.7.a: "Геній! Що може піти не так?"
vault_war.8.t: "Король мертвий!"
vault_war.8.d: "Перед тим як почати завоювання, Король Тарганів скликав стратегічну нараду з своїми головними генералами. Як люди, так і таргани брали участь. Велика зустріч розумів була проведена. Розроблено блискучу стратегію для того, щоб обійти програну війну проти набагато краще озброєних сил безпеки Vault-Tec. Коли зустріч добігала кінця, несподіваний постріл прогримів. Спочатку чоловіки та таргани повернули голови в бік, звідки це сталося. На південь, від Сховища 37. Вони бачили одного чоловіка, що стояв у відстані, сміючись маніакально, одягненого в обладунки, що нагадують лицаря! Коли генерали обернулися до Короля Тарганів, їхні серця затрусилися від страху. Король Тарганів був мертвий. Він сповз, безжиттєвий та холодний."
vault_war.8.a: "Це... не може бути добрим."
RCK_hidden_holotape.1.t: "Журнал Сховища: 2274.05.03"
RCK_hidden_holotape.1.d: "Т.О.М.А.С._ЖУРНАЛ:\nдата: 2274.05.03\nтема: Новий приїжджий\n\n: текст_тіла: 05/03/2274 - Новий приїжджий потрапив до Сховища 37, її звати Сіріус Блаттарія. Вона має 160 сантиметрів зросту, світлу шкіру, за моїми діагностиками, їй близько 30 років. Тести на радіацію показали негативний результат, вона підходить для інтеграції в експеримент. Вона була холодною і спантеличеною, коли увійшла в сховище. І відмовилася брати участь у нашому стилі життя в Сховищі. Рівно через 13 хвилин і 34 секунди після того, як її врятували, вона намагалася втекти, пошкодивши одного з наших роботів безпеки Сховища і травмуючись у процесі. Її було поміщено в медичний відділ для стандартного лікування, і очікується, що вона швидко одужає. Їй було надано багато різних солодощів, напоїв та фільмів для перегляду під час одужання. Статистика століть експерименту нашого Сховища показує, що цей підвищений рівень позитивного підкріплення веде до підкорення, пасивної покори, лише 5% неслухняних громадян коли-небудь потребують подальших корекцій."
RCK_hidden_holotape.1.a: "..."
RCK_hidden_holotape.2.t: "Один страшний день"
RCK_hidden_holotape.2.d: "\"Регій! Я знайшла щось!\" - вигукнула жінка, піднімаючи голову над зарослими заростями, що покрили століття покинутих пшеничних полів Північної Дакоти. \"Це робот! Ми можемо розібрати його на частини!\" - вигукнула вона з захопленням. \"Класно, зачекай на мене!\" - відповів Регій, біжачи до неї. \"Вау! Це практично новий! Скільки часу він тут був?\" - запитав Регій, аналізуючи падший дроїд. \"Не знаю. Тут написано, що це майно сховища! Сховище 37, зокрема! Ці щасливчики. Я чула, що для них обирали в основному еліту і військових.\" Сіріус почала лякливо говорити про етику відбору для Сховищ і несправедливі стандарти до війни в США. \"Так, чую тебе.\" - відповів Регій, відкручуючи броню робота. \"Гм, цікаво... просто зірваний провід, якщо я поставлю його на місце, має все просто...\" Не задумуючись, Регій підключив зірваний провід у розкладаючогося робота безпеки. Як тільки він це зробив, робот ожив, відкидаючи Сіріус та Регія назад. \"УВАГА! УВАГА! ТЕРИТОРІЯ ПІД ЗАГРОЗОЮ. ВІДСТУП РІШУЧИЙ!\" - загорлав робот через свій динамік. Коли він повернувся, щоб відступити, він побачив безпомічну Сіріус на землі. \"ЖИТЕЛЬ СХОВИЩА В ОПАСНОСТІ, ВІДСТУПАЮ\". Після цих слів він підняв Сіріус, яка намагалася вирватися, але не змогла. \"Регій! Допоможи!\" - закричала вона. \"Відпусти її, сволото!\" - закричав Регій, дістаючи свій лазерний пістолет і зробивши три постріли в робота безпеки. \"ПОСТРІЛИ! ПОСТРІЛИ! ПАЦИФІКАЦІЯ ЗАГРОЗИ!\" - почав кричати робот. Не встигши зрозуміти, що сталося, робот повернувся, випустивши прямий постріл прямо в груди Регія. Вибивши його з ніг. Регій закричав від болю. \"Регій! Ні! - Відпусти мене!\" - закричала Сіріус, намагаючись вирватися. Але робот не слухав. Він повернувся і почав відступати назад до свого сховища, не звертаючи уваги на її крики. Регій спробував піднятися, але впав від пекельного болю. \"Я... я тебе врятую...\" - лише це він зміг прошепотіти, коли робот втік із Сіріус у руках."
RCK_hidden_holotape.2.a: "..."
RCK_hidden_holotape.3.t: "Король Встає"
RCK_hidden_holotape.3.d: "\"Я... врятую тебе... я... врятую тебе...\" - Регій тягнув своє поранене тіло в напрямку, куди робот безпеки забрав Сіріус, на південний схід. Ландшафт був покритий зарослою рослинністю. Після ядерного знищення десятки покинутих фермерських господарств дозволили своїм посівам захопити територію. І це дуже непокоїло Регія. Його тіло розривала пекельна біль, лазерний постріл, що пробив його грудну клітку, на щастя, не був смертельним, оскільки він миттєво запаювався через високу температуру. Регій продовжував тягти своє ослаблене тіло годинами. І ось нарешті його сила покинула його. Відчуваючи, що досягнув межі своїх можливостей, він обперся на поруч розташовану сільськогосподарську техніку, щоб подивитися на нічне небо. Зірки завжди захоплювали його. Він дізнався з різних книг назви сузір'їв. Навколо нього був невеликий струмок, чиє спокійне шуміння відволікало від інтенсивного болю, він чув шелест листя на деревах. \"Я... я згоден з цим. Пробач мені, Сіріус, будь сильною. Сильнішою за мене.\" Сказавши це, він дозволив своєму тілу ослабнути і підготувався померти. Останній погляд на навколишній світ перед тим, як його свідомість залишила його, річка, чий спокійний шум надавав відчуття миру та спокою, дерева, чий шелест листя дарував відчуття природи та комфорту. Зірки, чия символіка і візерунки захоплювали його вічно. І, зрештою, тарган, який повільно повз до Регія. \"Гм?\" - сказав Регій, здивований побаченим, вважаючи себе занадто втомленим і маренням через виснаження. Перед ним був тарган, хоча в нього було пошкоджене око, він мав слабкий золотистий відтінок, що висвітлював холодний ландшафт Північної Дакоти в невеликому радіусі. В його роті була стимпак, яку він кинув прямо перед пораненим, що швидко занепадав. \"Я... не розумію... чому...?\" - сказав Регій в стані сплутаності, незабаром помітивши, як інші таргани наближаються до нього, один тримав непошкоджену пляшку нуколи, інший - дикий виріс рослину Тато. Незабаром Регій став знову на ноги. Слабкий, поранений, дезорієнтований, але живий. І переповнений новою хвилею адреналіну. Він продовжив свій шлях, і згодом більше тарганів приєдналися до нього. Оточений поглядом дивної людини в масці, що йшла в лахмітті. \"Я думаю... настав час змінити стратегію.\" Змінивши напрямок на північ, Регій Блаттарія, Тарганоутримувач, почав маршувати разом з тарганами до невеликого містечка на північ від Гранд-Форксу."
RCK_hidden_holotape.3.a: "..."
RCK_hidden_holotape.4.t: "Найкращі з Гріфтону"
RCK_hidden_holotape.4.d: "\"ЦЕ МУТФРУКТ ГНИЛИЙ!\" - вигукнув один чоловік.\n\n\"Вакуумна трубка вибухнула!\" - сказав інший чоловік обурено.\n\n\"Джиммі-хат не спрацював,\" - пробурмотіла вагітна жінка, зневірено.\n\nЗнову і знову, торговий пост, який колись сигналізував багатство своїм сусідам на півночі в Брендон, продовжував занурюватися в біль і страждання. Гріфтон непогано влаштувався, аби уникнути удару під час Великої Війни, але якби ті жителі бачили, як їхнє місто розклалося в Гріфтон, розплідник дурнів, які постійно отримують гірший кінець, то вони, мабуть, побажали б інакше.\n\nПостріл прогримів, і мало хто звернув на це увагу, окрім Крукстона, члена міліції Гріфтону. Це не було вперше, коли когось викидали з бару Фішера, і не важко було зрозуміти чому, оскільки поранений, болісно виглядучий чоловік буквально був викинутий на землю, за ним слідувала маленька зграя тарганів і ще кілька пострілів з рушниці. Крукстон уже тримав свою рушницю, але зрозумівши, що в барі Фішера різні таргани зникли, він її поклав. Він міг би зрозуміти, чому стріляти в тарганів, але в цього чоловіка було щось більше.\n\n\"І не повертайся!\" - вигукнув Фішер, чоловік, що був винен у заворушенні, впав непритомний, а таргани розсіялися. Бродячі собаки почали працювати, риючи тих, хто не зміг втекти, в цьому хаосі чоловік залишився один. Йому, безумовно, доведеться померти, якщо залишиться тут, і це не було б вперше.\n\nЗ тарганами, що пішли, Крукстон зітхнув. Чоловік був брудний і покритий ранами, піднявши його, з його одягу почали виходити дрібні таргани, але це не були Погані Землі. Отець Н'юмен винен йому за прикриття того вбивства. Крукстон не помітив, як люди почали дивитися на нього, чи готові подати руку - міліція не звикла до цього. Однак, можливо, саме таргани привернули таку увагу."
RCK_hidden_holotape.4.a: "..."
RCK_hidden_holotape.5.t: "Це ти?"
RCK_hidden_holotape.5.d: "\"Це місце дивне.\" - пробурмотів Король Тарганів, прогулюючись по бетонних стінах сховища. Свідчення автоматизації та пропаганди утриманого, підлеглого населення покривали стіни та стелі у вигляді залізничних шляхів і пропагандистських плакатів. \"Клянуся, я читав книгу з таким же назвою.\" - сказав Король Тарганів, проходячи мимо плакату, на якому зображено начальника сховища ТОМАСА з великим центральним оком, що стежить за мешканцями. \"Сер!\" - крикнув чоловік, біжучи до Короля Тарганів, поряд з ним летіло два таргани. \"Король Тарганів! Сер! У нас проблема. Одна з мешканок сховища відмовляється покидати. Вона якась інша. Вона не така, як решта.\" Як тільки чоловік почав пояснювати ситуацію, очі Короля Тарганів розширились. Ще до того, як чоловік закінчив свої нудні слова, Король Тарганів рвонув в повний спринт. Він мчав по кожному коридору, проминувши збентежених мешканців, солдатів міліції Гріфтону і численних тарганів. Багато хто з них повернувся і почав слідувати за Королем Тарганів, як він мчав через коридори. Занурюючись глибше в сховище, він нарешті почув джерело проблеми. Він почув злісні крики жінки, що забарикадувалася у своїй кімнаті. §P\"Я не піду з вами! Я краще помру, ніж буду вашою рабинею!\"§! Її розпачливі крики збили з пантелику багатьох солдатів Гріфтону, що не знали, як поводитися з ситуацією. Як тільки Король Тарганів досяг зовнішнього боку кімнати, дратівливі солдати миттєво ожили. \"А! Пан Король Тарганів! Раді вас бачити, у нас є невеличка проблема з...\" - «Відступіть зараз же.» - наказав Король Тарганів, пройшовши просто повз нього. \"О... добре тоді! Ви справитесь, пане Король Тарганів!\" - весело вигукнув солдат і пішов патрулювати сховище. §P\"Що?.. Привіт?\"§! - запитала жінка з іншого боку дверей. \"Сіріус... Це я.\" - тихо сказав Регій, дивлячись прямо на двері. Тиша охопила їх з іншого боку. Кожна секунда тяглася, як ціла година. І ось, двері відчинились. Перед ним стояла Сіріус, занедбана, брудна, але в іншому незаймана. \"Рі-Регі?\" - запитала вона, вже починаючи плакати. \"Так, це я. Я тут тепер.\" - відповів Регій. І вони нарешті обнялися. Втішаючи довгоочікувану зустріч. §P\"Я... я так боялася.\"§! - плакала Сіріус, обіймаючи Регія ще міцніше. \"Я знаю. Ти навіть не уявляєш, що мені довелося зробити, щоб побачити тебе знову.\" - відповів він.
RCK_hidden_holotape.5.a: "Знову разом, нарешті."
RCK_hidden_holotape.6.t: "Сховище 37: Ключ для аварійного відкриття дверей"
RCK_hidden_holotape.6.d: "Очищаючи порожній кабінет начальника сховища, Король Тарганів не міг не заглянути в різні файли та журнали, які залишив за собою педантичний ТОМАС. В інші дні ці папери були б просто викинуті без другого погляду. Але сьогодні Король Тарганів йшов повільно. Його рани ще не загоїлись. І сумніви щодо пошуку Сіріус напружували його розум. Вивчаючи досить непомітну голотапу, написане на її боці викликало в нього шок. §B\"Не забудь, пане Начальнику! Ваш код для аварійного відкриття дверей Сховища - 8-6-1-1!\"§! З цим кодом в руках, Король Тарганів стрибнув на ноги і швидко побіг у напрямку до Схованої кімнати."
RCK_hidden_holotape.6.a: "Швидко! Швидше!"
nf_rck.401.t: "Король Тарганів вимагає наші узбережжя!"
nf_rck.401.d: "Цього ранку, коли проводив звичайні адміністративні роботи в столиці, радтарган з листом був привезений до людини, що його супроводжувала. Після прочитання, повідомлення було таким: \"Доброго ранку, сусіде! Це повідомлення від вашого сусіда на сході, Короля Тарганів. Я не воєначальник... Насправді, в іншому житті я був великим прихильником миру! Але доля змусила мене діяти. Мої вороги оточили мене з усіх боків! Хоча я контролюю більшу частину рівнин Дакоти, у мене є великі вороги, що нависають на мою голову! Я маю розгромлену нечисть на сході! Ви - моя єдина надія! Мені потрібно, щоб ви захистили мою націю! Будь ласка! Прошу вас, віддайте мені своє узбережжя. Це моя єдина вимога! Якщо ви відмовитесь... мені доведеться відповісти. Як би сумно це не було. Я не хочу насильства! Прошу зробити правильний вибір!\" - Король Тарганів"
nf_rck.401.a: "Що? Ні! Ми відмовляємось!"
nf_rck.401.b: "У нас немає вибору..."
nf_rck.405.t: "Гнів Короля Тарганів"
nf_rck.405.d: "Це не може бути, не може бути, не може бути. Ви вірите, що це гра? Що я іграшка, яку можна викинути і перейти до іншої, як зіпсована дитина зі старих часів? Ви зіпсовані! Я – Реджі Блаттарія, Король Тарганів Північної Дакоти, моя здатність спілкуватися з тарганами вивела мене на величезну владу та висоти монарха цієї проклятої пустки. Але ви наважуєтесь не погодитись з моїм твердженням про мир та гармонію в нашому регіоні? Все, що я просив – це шматок вашого узбережжя. Для укріплення певних кордонів і зроблення війни неможливою. Ми могли б бути друзями. Ми могли б бути союзниками. Ми могли б разом правити пусткою як рівні. Але ось ви. Сплюнули на мою оливкову гілку і пропозицію великої гармонії між нами. Ми обидва маємо більші загрози, але ви тягнете нас у війну відмовляючись співпрацювати і виконувати мої накази! Це ганьба. Як можна вірити у такі безглузді ідеї про доісторичні кордони. Як можна вважати це законом? Я не потребую законів старого світу. Я не потребую кордонів старого світу. У мене є мої таргани, у мене є мій народ, і у мене є моя земля. Моя земля. Ось про що йдеться, чи не так? Ви хочете мою землю. Ви хотіли війну з самого початку! Ви хотіли скинути популярного і добре улюбленого монарха, чия єдина провина була в тому, що він не врятував того, хто дав йому мету і причину жити. Я розумію. Ви зіпсовані! Повністю зіпсовані! Ви, пустельники, всі однакові. Принаймні я відкрито виявляю свої почуття без шкодувань і без лицемірства. На відміну від вас, я не потребую брехні чи обману, щоб подолати непереборні труднощі. Я зробив це один раз під час моєї кампанії проти Валт-Тек Сек'юріті. Це моя стратегія подолала Валт-Тек Сек'юріті. Це моє лідерство утримало контроль над людьми та тарганами. І це моя відвага зустрітися з Надсмотрщиком і відключити його від системи зв'язку, що дозволило мені звільнити Валт і його людей. Ось так. Я герой! Я – добра людина в цій історії! Ви – погані люди, які хочуть зупинити мир задля егоїстичних і аморальних цілей! Я не потребую великих завоювань заради багатства і влади, я вже досяг цього. Але тепер ось я. Очолюю оборонну кампанію, щоб подолати цю жахливу трагедію, яку ви накоїли."
nf_rck.405.a: "Про що він взагалі говорить?"
nf_rck.406.t: "Гнів Короля Тарганів, частина II"
nf_rck.406.d: "Не поважати мене... Це найгірший злочин у світі. Я не зробив нічого поганого. Я дозволяю моїм ворогам жити на моїх землях під моєю охороною. Я залучаю місцевих лідерів до своєї справи. Я дозволяю цивільним вільно переміщатися і захищаю їх від рейдерів.. Я монарх, якого люблять мої громадяни, і я люблю їх за все, що я їм даю. Я – авангард сталі, що захищає пустку. Я врятую пустку, я зроблю це, я врятую всіх і стільки, скільки зможу, поки не помру. Я не можу програти зараз, я не програю зараз, я не програю її знову. Я сумую за нею. Сіріус... Пробач. Я не зміг врятувати тебе тоді. Але я відплачу за тебе тут. Я скину цього тирана, який не поважає ідею і просування миру та стабільних кордонів, що не приносять шкоди і не створюють нещасливих громадян. Я встановлю вічний мир у цій пустці, яку прокляли ті, хто прийшов до нас. Я не знаю, чому ця жалюгідна, порожня земля була обрана. Чи це ферми? Чи це ранчо? Чи ядерні ракетні шахти? Я не знаю. І мені не потрібно знати. Те, що я знаю, це як побудувати величну імперію, яка звільняє пригноблених громадян від тиранії. Я не потребую допомоги інших. У мене є особиста сила і велика армія тарганів. З сержантом Тарганом поруч я не потребую великих альянсів. Я справлюсь сам. Як ви смієте дивитись на мене і моїх тарганів. Я просто не можу повірити. Хочете війну? Чому? Що ми виграємо, борючись одне з одним? Це справді того варте? Це те, що ви хочете? Це те, що ви бажаєте? Смерть? Смерть мене? Смерть моїх людей? Рабство моїх тарганів? Чому? Я не можу дозволити цьому жахливому поводженню продовжуватися. Ця війна завжди повинна була статися. Тепер я розумію це. Це не просто непорозуміння, як я сподівався. Це війна ідеологій, цінностей і моралі. Я мушу боротися, я не можу здатися, я не можу дозволити вам завдати шкоди ще комусь. Сподіваюсь, ви готові. Бо я готовий. Готуйтеся побачити моїх тарганів. Вони стануть захистом, що запобіжить вам завдати шкоди будь-кому ще. Ніколи знову. Я не можу дозволити жахам пустки продовжуватись, не через величезні чи ідеалістичні цілі для себе чи для моїх людей. Але через спільну мораль. Це огидно – спостерігати, як ця хаос розгортається. І бачити, як ви так весело танцюєте і маршуєте поруч із ним. Я той, хто намагається покласти край насильству! Положити край кровопролиттю! Врятувати наш вид від вимирання. Ви навіть знаєте, скільки часу мені знадобилося, щоб досягти моєї нинішньої висоти влади? Що дало мені зв'язки, тарганів і ресурси для подолання неймовірної, непереборної потужності пустки? Щоб я міг встановити мир на завжди? Мені знадобилось лише кілька днів! Лише за кілька днів я перейшов від того, щоб помирати в порожньому полі, до лідера тарганів. Від лідера тарганів до лідера того містечка Гріфтон. І від лідера того містечка, чию назву навіть не варто пам'ятати, до того, що я стану одним із найбільших героїв на землі, коли звільню пустку від тиранії, хвороб і насильства. Я захопив Валт. Ще активний Валт! Неймовірне завдання. Тіла тих, хто намагався зробити те ж саме, лежать pile перед його стінами."
