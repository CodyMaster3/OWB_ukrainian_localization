сь, не через величезні чи ідеалістичні цілі для себе чи для моїх людей. Але через спільну мораль. Це огидно – спостерігати, як ця хаос розгортається. І бачити, як ви так весело танцюєте і маршуєте поруч із ним. Я той, хто намагається покласти край насильству! Положити край кровопролиттю! Врятувати наш вид від вимирання. Ви навіть знаєте, скільки часу мені знадобилося, щоб досягти моєї нинішньої висоти влади? Що дало мені зв'язки, тарганів і ресурси для подолання неймовірної, непереборної потужності пустки? Щоб я міг встановити мир на завжди? Мені знадобилось лише кілька днів! Лише за кілька днів я перейшов від того, щоб помирати в порожньому полі, до лідера тарганів. Від лідера тарганів до лідера того містечка Гріфтон. І від лідера того містечка, чию назву навіть не варто пам'ятати, до того, що я стану одним із найбільших героїв на землі, коли звільню пустку від тиранії, хвороб і насильства. Я захопив Валт. Ще активний Валт! Неймовірне завдання. Тіла тих, хто намагався зробити те ж саме, лежать pile перед його стінами."
nf_rck.406.a: "Що, ще більше?!"
nf_rck.407.t: "Гнів Короля Тарганів, частина III"
nf_rck.407.d: "Сподіваюся, ви готові. Бо я готовий. Готуйтеся побачити моїх тарганів. Вони стануть захистом, що запобіжить вам завдати шкоди будь-кому ще. Ніколи знову. Я не можу дозволити жахам пустки продовжуватись, не через величезні чи ідеалістичні цілі для себе чи для моїх людей. Але через спільну мораль. Це огидно – спостерігати, як ця хаос розгортається. І бачити, як ви так весело танцюєте і маршуєте поруч із ним. Я той, хто намагається покласти край насильству! Положити край кровопролиттю! Врятувати наш вид від вимирання. Ви навіть знаєте, скільки часу мені знадобилося, щоб досягти моєї нинішньої висоти влади? Що дало мені зв'язки, тарганів і ресурси для подолання неймовірної, непереборної потужності пустки? Щоб я міг встановити мир на завжди? Мені знадобилось лише кілька днів! Лише за кілька днів я перейшов від того, щоб помирати в порожньому полі, до лідера тарганів. Від лідера тарганів до лідера того містечка Гріфтон. І від лідера того містечка, чию назву навіть не варто пам'ятати, до того, що я стану одним із найбільших героїв на землі, коли звільню пустку від тиранії, хвороб і насильства. Я захопив Валт. Ще активний Валт! Неймовірне завдання. Тіла тих, хто намагався зробити те ж саме, лежать pile перед його стінами. Але хто, по-вашому, подолав неможливі труднощі? І з чистою пристрастю, гнівом і любов'ю. Напав на Валт, щоб звільнити його людей і врятувати... її... Якби я тільки знайшов її. Якби я знайшов її, ми б не вели цю розмову. Якби я її мав, мені б не потрібно було говорити з цими тарганами, щоб вони складали мені компанію. Вони закликають мене захищати тих, хто навколо, незалежно від того, під якою землею вони знаходяться. Я хочу тебе врятувати, але ти ставиш мене в таке незручне становище! Чому! Я просто не розумію, чого ти хочеш від мене. Що я зробив тобі в першу чергу? Потягнувся з миром? Це таке страшне, аморальне прохання? Ми могли б бути друзями! Це було б чудово! Я міг би показати тобі силу моїх радітарганів. Я міг би вивчити твої звичаї та традиції. Ми могли б разом працювати, щоб зміцнити наші позиції та захищати один одного. Але все марно! Немає сенсу уявляти альтернативні реальності. Це реальність, в якій я застряг. Та, в якій я застряг з тобою!"
