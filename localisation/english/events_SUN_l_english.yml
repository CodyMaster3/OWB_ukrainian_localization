################################## EVENTS ##############################################
nf_sun_dog.1.t:0 "Останні накази Лупи"
nf_sun_dog.1.desc:0 "Хоча Королева Вовків втекла на північ, її послідовці зробили те, чого не вдавалось жодному ворогу: вони вкрали наш трофей! Люди з [SUN.GetNameDef] вирізали власних жінок і дітей, аби ті не дісталися нам. Наші сили знаходили людей, що кричали й були зламані через те, що вчинили. Інші патрулі були повністю знищені, а значна частина нашого війська загинула під час боїв із цими бунтівниками. Цезар буде невдоволений, але тобі вирішувати, як вчинити з цими повстанцями..."
nf_sun_dog.1.option.a:0 "Добити повстанців і стерти згадку"
nf_sun_dog.1.option.b:0 "Пощадити лише чверть чоловіків"
nf_sun_dog.1.option.c:0 "§RЗнищити всіх§!"

nf_sun_dog.2.t:0 "Протистояння з Королевою Вовків"
nf_sun_dog.2.desc:0 "Ґолд-Хаунд зі своїми найвірнішими вояками зайшов до намету Лупи — старого пошарпаного легіонерського намету, який вона та її послідовники вкрали під час походу на північ. Вона обернулась до входу в намет і зітхнула, підвівшись. Ґолд-Хаунд помітив сумку — було ясно, що вона чекала цього. Вона лише спитала: «Куди мене заслано?» Ґолд-Хаунд задумався на мить..."
nf_sun_dog.2.option.a:0 "«До царства Гекати»"
nf_sun_dog.2.option.b:0 "«До Ґоддарда і його 'каліфорнійців'»"
nf_sun_dog.2.option.c:0 "«До псів Півночі»"

nf_sun_dog.3.t:0 "Прибуття Королеви Вовків"
nf_sun_dog.3.desc:0 "Жінка, яка називає себе «Королевою Вовків», з'явилась у нашому таборі. Вона хоче допомогти нам і нашому народу в боротьбі проти Легіону."
nf_sun_dog.3.option.a:0 "Дозволити їй увійти... поки що."

nf_sun_dog.4.t:0 "Попередження Ґоддарда"
nf_sun_dog.4.desc:0 "Кур’єр із Колорадо прибув до Конгресу з повідомленням від Ґоддарда. Він стверджує, що до його табору прийшов колишній раб Легіону й приніс новину: Легіон вторгся до Колорадо. Він просить військову допомогу для захисту націй Колорадо. Чи підтримаємо ми?"
nf_sun_dog.4.option.a:0 "Ми згодні... за відповідну ціну."
nf_sun_dog.4.option.b:0 "Мусимо відмовити — побачимось, якщо доживеш!"