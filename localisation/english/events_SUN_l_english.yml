################################## EVENTS ##############################################
 nf_sun_dog.1.t:0 "Останні накази Лупи"
 nf_sun_dog.1.desc:0 "Хоча Королева Вовків втекла на північ, її послідовники зробили те, чого не робив жоден інший ворог: вони вкрали нашу здобич! Чоловіки [SUN.GetNameDef] вирізали власних жінок і дітей, щоб ті не дісталися нам. Наші сили знайшли незліченну кількість чоловіків, що кричали і були зломлені вчинками, які вони скоїли. Інші патрулі були знищені до єдиного солдата в масових самогубних атаках, і значна частина наших сил загинула, просто намагаючись придушити ці бунтівні елементи. Цезар буде незадоволений, але вирішувати, що робити з повстанцями — справа Ланія."
 nf_sun_dog.1.option.a:0 "Прикінчити повстанців і стерти всі згадки про них."
 nf_sun_dog.1.option.b:0 "Пощадити лише чверть чоловіків."
 nf_sun_dog.1.option.c:0 "§RВирізати всіх.§!"

 nf_sun_dog.2.t:0 "Протистояння з Королевою Вовків"
 nf_sun_dog.2.desc:0 "Золотий Пес і його найвідданіші солдати увійшли до намету Лупи — старого, подертого намету Легіону, який вона та її послідовники вкрали під час маршу на північ. Вона повернулася в бік входу і зітхнула, підводячись. Золотий Пес помітив у неї сумку; було ясно, що вона передбачала це. Її слова лише підтвердили це:\n\n«Куди мене відправляють у вигнання?»\n\nЗолотий Пес на мить замислився, розмірковуючи, що можна зробити. Він чув багато історій про Богиню Темного Місяця, що глибоко в Темній Піраміді. Або Лупа загине від рук Уробороса, або ж вона підкориться племені, яке має не менші рахунки з Легіоном. Натомість він майже нічого не знав про те, що лежить на північ від Битих Псів — гулі та дивний чужинець із далекого краю. А щодо самих Битих Псів? Що ж, це залежало від того, як вирішив Золотий Пес, чи достатньо вони сильні, щоб витримати Королеву Вовків."
 nf_sun_dog.2.option.a:0 "«У Царство Гекати»"
 nf_sun_dog.2.option.b:0 "«До Ґоддарда і його "каліфорнійців"»"
 nf_sun_dog.2.option.c:0 "«До Псів Півночі»"

 nf_sun_dog.4.t:0 "Попередження Ґоддарда"
 nf_sun_dog.4.desc:0 "Кур'єр із Колорадо дістався Конгресу з посланням від Експедиції Беґґерів. Він стверджує, що колишній раб Легіону прибув до його табору і приніс тривожні новини: Легіон вторгається в Колорадо. Він просить надати військові сили для допомоги людям Колорадо та Каліфорнії у боротьбі проти Легіону, відкривши ще один фронт. Чи погодимося ми?"
 nf_sun_dog.4.option.a:0 "Надати допомогу. Легіон не переживе Двоголового Ведмедя."
 nf_sun_dog.4.option.b:0 "Ми змушені відмовити. Сподіваємось побачитися за кілька років!"