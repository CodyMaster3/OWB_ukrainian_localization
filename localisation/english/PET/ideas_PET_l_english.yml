l_english:
  pet_idea_fuel_nation:0 "Країна палива"
  pet_idea_fuel_nation_desc:0 "Петро Чіко - нація, цілком побудована на нафті. Ми розширюємо її запаси все більше й більше, гарантуючи нашим паливовитратним військам довговічність."
  pet_idea_gain_fuel:0 "Паливо, викачане із ворогів"
  pet_idea_fuel_nation_desc: "Поки світ був у захваті від атому, Петро-Чіко зосередилася на перевіреному часом чорному золоті Мексики. Багато їхніх сталевих джаггернаутів у Затоці та нафтопереробних заводів у глибині материка стоїчно витримали вогонь і лють Першого Б'айкруптсі, і тепер знову дають життєдайну силу петро-чіканцям. Ці машини, хоч і були подаровані Ель-Сіо та його народу богами Жейролдас, все ще залишаються нагадуванням про те, що може спіткати світ, якщо Анвел-Репорт визнає їх... неприбутковими."
  pet_idea_lose_fuel:0 "Паливо, викачане ворогом"
  pet_idea_lose_fuel_desc:0 "Оперативні групи противника викачують наше паливо. Нам треба зробити щось із цим."
  pet_idea_gain_research:0 "Дослідження, викрадені у ворога"
  pet_idea_gain_research_desc:0 "Наші більш розвинуті сусіди стали здобиччю для наших оперативників, даючи нам змогу отримати вигоду із їхніх досліджень."
  pet_enemy_ops:0 "Підозрілі події"
  pet_enemy_ops_desc:0 "Доволі дивні та підозрілі почали відбуватися на теренах нашої країни. Треба провести розслідування."
  pet_itz_remember:0 "Пам'ятні дрібниці"
  pet_itz_remember_desc:0 "Ми не отримали від Чечен-Іци нічого, окрім зневаги та ігнорування. Ми це запам'ятаємо."
  pet_ate_remember:0 "Пам'ятні дрібниці"
  pet_ate_remember_desc:0 "Ми не отримали від Нуева-Ацтлану нічого, окрім зневаги та ігнорування. Ми це запам'ятаємо."
  pet_counter_spies_idea:0 "Агенти контррозвідки"
  pet_counter_spies_idea_desc:0 "Тепер нам відомо, що сили наших сусідів зацівалися речами всередині нашої країни, ми маємо зробити все можливе, аби не дати їм це."
  PET_security_patrols_idea: "Відданість Компенні"
  PET_security_patrols_idea_desc: "Із запуском наших нових програм лояльності ми зможемо повністю довіряти нашому громадянству та мобілізувати армію за першої потреби."
  PET_machine_guns_brrr:0 "Вогняний дощ"
  PET_machine_guns_brrr_desc: "Наші війська стали досить вправними з кулеметами, які ми нещодавно розробили. Справді, ніщо не зрівняється з радістю нафарширувати ворогів свинцем у мить ока."
  PET_defend_the_homeland_idea:0 "Захист Батьківщини"
  PET_defend_the_homeland_idea_desc: "Петро-Чіко повністю оточена загрозами. Роботизовані небезпеки чатують на півночі, так само як наші кордони атакують імперії з півдня. Ми мусимо захистити наші рубежі від цих загроз, якщо хочемо зберегти націю в безпеці."

  PET_scientific_board_funding_idea: "Фінансування інновацій"
  PET_scientific_board_funding_idea_desc: "Тепер, коли Департамент інновацій отримав належну підтримку, наша скромна нація нарешті може досягти наукових досягнень, які раніше були недосяжними."

  PET_idea_chosen_people: "Благословенні Жейролдас"
  PET_idea_chosen_people_desc: "Наша віра в Ель-Сіо та Ель-Борд була обґрунтованою. Нас визнали гідними прибутків Жейролдас, і ми відвернули чергове Б'айкруптсі. Ми впевнені у своєму становищі та згуртовані як ніколи."

  PET_idea_failed_zheiroldas: "Засуджені Жейролдас"
  PET_idea_failed_zheiroldas_desc: "Провал. Втрата. Б'айкруптсі. Усе це синоніми невдачі перед Жейролдас під час Анвел-Репорту. Анхолісти та народ втратили віру в Ель-Сіо та Ель-Борд, що занурило суспільство в хаос."

  PET_chems_and_robots: "Обмін із Віцекоролівством"
  PET_chems_and_robots_desc: "Наші нові друзі з іншого боку півострова були досить люб'язні, щоб надати нам передові знання, до яких ми інакше не змогли б отримати доступ. За певну ціну, звісно."