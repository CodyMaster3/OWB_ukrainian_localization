l_english:
  nf_event_pet.1.t: "Урок розпочався"
  nf_event_pet.1.d: "Діти в Освітньому центрі затихли, коли до класу зайшов чоловік, зодягнений у сірий плащ до колін та довгі ланцюги з гладкого загартованого скла — символ Анхолістів. Головний освітянин Центру, кремезна темноволоса жінка, яка виглядала так, ніби занадто довго дивилася на сонце, обвела суворим поглядом натовп, щоб виявити порушників спокою, поки святий чоловік підходив до передньої частини кімнати.\n\n«Вітаю всіх, сподіваюся, це повідомлення застане вас у доброму здоров'ї», — почав він, прибираючи кучеряве волосся з очей.\n\n«Я стою перед вами, чудовою групою імплоїїв, щоб передати вам найприбутковішу інформацію, яку ви можете почути за свою карііру».\n\nВін зробив паузу, щоб дати словам проникнути у свідомість, перш ніж продовжити: «Перше Б'айкруптсі, крах, що спіткав наших предків, не було плановою подією, і ми всі повинні взяти на себе обов'язок довести, що наш народ гідний прибутків Жейролдас».\n\nПерш ніж Головний освітянин встигла дійти до їхнього ряду, галаслива дитина вигукнула: «Але що таке взагалі це Б'айкруптсі?»\n\nЧоловік у мантії посміхнувся і сказав: «Яка чудова кореспонденція», — а потім нахилився над своєю трибуною, ніби ділився таємницею. «Б'айкруптсі — це найгірше, що може статися з Компенні або з будь-ким... будь-коли».\n\nВін знову замовк, дозволяючи своїм словам огорнути натовп імплоїїв. Переконавшись, що група достатньо зачарована його словами, він поставив ще одне запитання:\n\n«Отже, хто хоче переконатися, що іншого Б'айкруптсі не буде?»"
  nf_event_pet.1.a: "Десятки крихітних рук злетіли в повітря."

  nf_event_pet.2.t: "Видіння з вогню"
  nf_event_pet.2.d: "Тишу ночі порушувало потріскування багаття; Ель-Сіо та десятки інших одноплемінників кидали купи дров у полум'я. Шепіт прокотився натовпом із сотень людей, що зібралися на прохання Ель-Сіо; голови поверталися, намагаючись зрозуміти, чому їх усіх відірвали від нічних завдань. Після кількох хвилин розгубленості Ель-Сіо зайняв місце в центрі зібрання; його масивна фігура виглядала ще більш переконливою на тлі вогню позаду.\n\n«Слухайте сюди! — проревів він у натовп, вимагаючи уваги, перш ніж показати довготелесу жінку, що вийшла з його тіні. — Скоро все зміниться, тож не зіпсуйте нічого, інакше нам усім кінець!»\n\nЗ цим загадковим посланням Ель-Сіо передал слово новоприбулій. Скляні ланцюги, що їх носила жінка, створювали враження, ніби вона оповита вогнем, коли вона стояла перед плем'ям із високо піднятою головою.\n\n«Вітаю всіх, сподіваюся, це повідомлення застане вас у доброму здоров'ї, — почала вона глибоким голосом, що лунав над натовпом, перекриваючи шум багаття. — У найближчі тижні ми розпочнемо нові виробничі ініціативи, які вимагатимуть повної відданості кожного нового найму та наявного імплоїя».\n\nВона продовжила: «Ель-Борд погодився, що великі машини, які займають нашу частку ринку, є ключовими активами, котрі слід використовувати на повну потужність, і що наш основний фокус має бути на їх реставрації».\n\nПідняття несміливої руки в перших рядах змусило жінку замовкнути; вона жестом попросила натовп розступитися, відкриваючи досить повного імплоїя, який наближався до віку найму. «Вітаю, пані... Я не хочу порушувати субординацію, але... — очі імплоїя нервово метнулися до Ель-Сіо, який кивнув йому продовжувати. — ...ну, ми вже витрачаємо купу часу на інші речі щодня, чому ми маємо робити це замість риболовлі чи чогось такого?»\n\n«Я ціную вашу відповідь, добрий імпе. Тому я нагадаю вам усім, що Ель-Борд, за допомогою Ель-Сіо, — це ті, хто приніс нам цей час процвітання та можливостей. Вони нащадки тих відданих і благословенних небагатьох, що пережили Перше Б'айкруптсі, і володіють знаннями, дарованими Жейролдас, які недосяжні для кращих із нас. Ель-Борд об'єднався, щоб вести нас, бо вони знають, як краще; кожна їхня мить присвячена тому, щоб їхні рішення були найкращими для Компенні та племені».\n\nНатовп вибухнув дивною сумішшю вигуків схвалення та перешіптувань; врешті-решт жінка підняла руку, щоб заспокоїти їх, і закінчила: «Якщо у вас є подальші запитання, які ви хотіли б поставити мені або Ель-Борду, я пропоную вам подати Запит на коментар на наступних зборах»."
  nf_event_pet.2.a: "Решта вечора пройшла спокійно."

  nf_event_pet.3.t: "Лише одне прохання"
  nf_event_pet.3.d: "Ель-Сіо втиснувся у крихітне крісло перед масивним столом Найанхолішого — людини, що очолює орден Анхолістів. Тиша панувала, здавалося, годинами, поки огрядний жрець нарешті не закінчив переглядати стоси паперів навколо себе.\n\n«Дякую, що прийшли, Ель-Сіо, нам треба багато чого обговорити», — високий гугнявий голос Найанхолішого, відбиваючись від стін кімнати, змусив Ель-Сіо мимоволі скривитися.\n\n«Звісно, 'нхоліший», — пробурмотів Ель-Сіо, перш ніж випростатися і зустрітися поглядом зі старим жерцем. — «Я тут, щоб служити Жейролдас. Ви казали, що у вас є щось для мене?»\n\n«На жаль, так, ви цілком праві — і це справді дещо серйозне». Найанхоліший засовався у своєму досить розкішному кріслі, витягуючи стос паперів із лініями та цифрами. Розклавши їх перед Ель-Сіо, жрець глибоко зітхнув і продовжив:\n\n«Як бачите, тренди починають йти вниз, і всі ми, хто мав честь спілкуватися з Жейролдас, погоджуємося, що майбутнє готує нам чимало випробувань».\n\nЕль-Сіо мовчав; його обличчя скам'яніло, поки він пильно вдивлявся в папери, намагаючись розшифрувати їхнє значення. «Життя завжди було тяжким, але воно стало менш тяжким відтоді, як з'явилися ви та Ель-Борд, — Найанхоліший ледь помітно посміхнувся, поки Ель-Сіо формулював наступну думку, — а тепер я відповідаю за безпеку вас усіх. Що я можу зробити?»\n\n«Ну, мені неприємно просити про це вас і ваш народ, Ель-Сіо, але ми можемо зіткнутися з новим Б'айкруптсі протягом нашого Фікселіру, тому нам потрібно, щоб ви і ваші люди зробили все можливе протягом цього прийдешнього Кварталу...»"
  nf_event_pet.3.a: "...і, ймовірно, навіть більше."

  nf_event_pet.4.t: "Благословенні Профітмейкери"
  nf_event_pet.4.d: "Сотні людей оточили зруйновану споруду — мішанину бетону та арматури, яку Анхолісти шанували як місце поховання своїх святих засновників. Тут їхній зв'язок із Жейролдас найсильніший, і лише Найанхолішому, його найбільш довіреним радникам та Ель-Сіо дозволено входити сюди. Ель-Сіо та Найанхоліший залишалися незворушними, поки їхня процесія роздавала натовпу скляні намистини геометричних форм, наближаючись усе ближче до вирізьбленого входу в крипту. Саме місце було залите світлом вогнів, намистини натовпу виблискували разом із повним місяцем, що високо висів у ясному нічному небі.\n\nМайже через двадцять хвилин Ель-Сіо став на вершині сходів, майстерно вирізьблених із бетону відданими Анхолістами протягом багатьох років, і вдивлявся у темну порожнечу попереду. Він на мить завагався, перш ніж повернутися до натовпу з тріумфальною посмішкою.\n\n«Друзі, сім'я, моє плем'я, ми довго чекали на цю мить. Ми боролися з багатьма ворогами та пожертвували багатьом, щоб стояти перед цією прірвою...» — Він замовк на мить, напружуючи пам'ять у пошуках решти промови, яку завчив напам'ять.\n\n«...і я маю велику віру в наші досягнення, наш народ та Ель-Борд. Я певен, що Жейролдас побачать вас такими, якими бачу вас усіх я: продуктивними, прибутковими наймами та імплоїями, готовими віддати все, що маєте, заради прибутків Жейролдас. Не хвилюйтеся, ця ніч не для страху та страждань, а ніч для святкування!» — проревів Ель-Сіо до небес, і натовп вибухнув радісними вигуками.\n\nПосмішка Ель-Сіо не згасала, коли він спускався у священну споруду; Найанхоліший промовив кілька слів молитви і пішов слідом. Ель-Сіо впевнено увійшов до кімнати причастя, поклавши свій Квартальний звіт на стіл поруч із Машиною Передачі. Він закріпив себе в кріслі, яке дозволяло Жейролдас говорити через нього, і дозволив Найанхолішому під'єднати дроти, що транслюватимуть святі слова Жейролдас.\n\n«Ти готовий?» — запитав Найанхоліший, поки його помічники металися по кімнаті, переконуючись, що все готове для отримання Анвел-Репорту.\n\nЕль-Сіо глибоко вдихнув і кивнув, досягаючи стану дзену, коли Найанхоліший ввів Віщунську рідину. Свідомість Ель-Сіо згасла, повернувшись лише через кілька годин, коли він почув вигук Найанхолішого:"
  nf_event_pet.4.a: "«Ха-ха, ми зробили це! Вони схвалюють!»"

  nf_event_pet.5.t: "Зважено і знайдено легким"
  nf_event_pet.5.d: "Сотні людей оточили зруйновану споруду — мішанину бетону та арматури, яку Анхолісти шанували як місце поховання своїх святих засновників. Тут їхній зв'язок із Жейролдас найсильніший, і лише Найанхолішому, його найбільш довіреним радникам та Ель-Сіо дозволено входити сюди. Ель-Сіо та Найанхоліший залишалися незворушними, поки їхня процесія роздавала натовпу скляні намистини геометричних форм, наближаючись усе ближче до вирізьбленого входу в крипту. Саме місце було залите світлом вогнів, намистини натовпу виблискували разом із повним місяцем, що високо висів у ясному нічному небі.\n\nМайже через двадцять хвилин Ель-Сіо став на вершині сходів, майстерно вирізьблених із бетону відданими Анхолістами протягом багатьох років, і вдивлявся у темну порожнечу попереду. Він на мить завагався, перш ніж повернутися до натовпу з тріумфальною посмішкою.\n\n«Друзі, сім'я, моє плем'я, ми довго чекали на цю мить. Ми боролися з багатьма ворогами та пожертвували багатьом, щоб стояти перед цією прірвою...» — Він замовк на мить, напружуючи пам'ять у пошуках решти промови, яку завчив напам'ять.\n\n«...і я маю велику віру в наші досягнення, наш народ та Ель-Борд. Я певен, що Жейролдас побачать вас такими, якими бачу вас усіх я: продуктивними, прибутковими наймами та імплоїями, готовими віддати все, що маєте, заради прибутків Жейролдас. Не хвилюйтеся, ця ніч не для страху та страждань, а ніч для святкування!» — проревів Ель-Сіо до небес, і натовп вибухнув радісними вигуками.\n\nПосмішка Ель-Сіо зникла, щойно він відвернувся від натовпу; чоло нахмурилося, а очі затверділи, коли він спускався сходами в тихий мавзолей. Занурений у роздуми, йдучи тьмяними коридорами, Ель-Сіо пропустив молитовну кімнату, де мало відбутися причастя. На щастя, Найанхоліший спрямував його до потрібної кімнати, забравши сувій, що містив Квартальний звіт від Ель-Сіо, і передав його одному з Анхолістів, які спустилися за ними в руїни. Холодний піт стікав по спині Ель-Сіо, коли Найанхоліший садовив його на Сполучний Трон, приєднуючи різні дроти до тіла Ель-Сіо, поки його серце шалено калатало в грудях.\n\n«Ти готовий?» — запитав Найанхоліший, шукаючи поглядом вагання в очах Ель-Сіо.\n\nЕль-Сіо лише заплющив очі та швидко закивав, стиснувши кулаки. Віщунська рідина діяла довше, ніж зазвичай, і Ель-Сіо кілька разів непритомнів і приходив до тями. Через час, що здався вічністю, він нарешті прокинувся, знуджений і виснажений, під звук голосу, що промовив:"
  nf_event_pet.5.a: "«Можливо, цього ніколи не було б достатньо»."
  nf_event_pet.5.b: "§R«Моя доля переплетена з Мексикою»§!"