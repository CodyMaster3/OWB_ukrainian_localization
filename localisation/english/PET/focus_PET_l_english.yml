l_english:
  ### All localization Revised by Ardor, June 2025 ###
  PET_the_war: "Перше Б'айкруптсі"
  PET_the_war_desc: "Перший урок, який Анхолісти дали людям, був про Перше Б'айкруптсі — хвилю вогню та сірки, що прокотилася світом після того, як ті, що були до нас, кинули виклик Жейролдас і розгнівали їх."
  PET_the_aftermath: "Об'єднання Ель-Борду"
  PET_the_aftermath_desc: "Другий урок, який Анхолісти дали людям, був про Об'єднання Ель-Борду, коли найрозумніші та найпобожніші нащадки тих, хто пережив Перше Б'айкруптсі, об'єдналися, щоб відновити та управляти великими машинами, залишеними петро-чіканцям богами Жейролдас."
  PET_the_future: "Четвертий Квартал"
  PET_the_future_desc: "Третій урок, який Анхолісти дали людям, був про Фікселір та Квартали — цикл, під час якого Жейролдас періодично розмовляють з обраними Анхолістами, щоб провістити майбутнє та гарантувати, що петро-чіканці діють так, аби примножувати їхні святі інтереси."
  
  #left branch - 1

  PET_department_of_warfare: "Департамент безпеки"
  PET_department_of_warfare_desc: "Хоча ми благословенні володіти такою прибутковою частиною Мексиканського півострова, наші багаті ресурси неминуче привернуть увагу місцевих інтервентів. Проактивність — одна з найбільших чеснот, яку поділяють Жейролдас, і захист нас самих є ключем до виживання."
  PET_security_patrols: "Протоколи лояльності до бренду"
  PET_security_patrols_desc: "Важливо переконатися, що кожен наш співробітник служби безпеки є повністю сумісним і задоволеним стандартами та протоколами Ель-Борду і Компенні, щоб їх не переманили наші конкуренти і вони не саботували наші заходи з консолідації."
  PET_spearhead_doctrine: "Наради з перегляду стратегії"
  PET_spearhead_doctrine_desc: "Хоча Ель-Борд ніколи не заявить про це публічно, метод ведення війни Ель-Сіо — це лише кидання людей та металу на ворога, доки той не здасться. Це працює у внутрішніх сутичках, але в протистоянні з мексиканськими державами потрібні нові доктрини."
  PET_special_ops: "Найкращі з петро-чіканців"
  PET_special_ops_desc: "Ми не маємо можливості надати кожному співробітнику служби безпеки найкраще спорядження та підготовку, але створення невеликого професійного корпусу для досягнення ключових стратегічних цілей — це зусилля, які, як гарантує Ель-Борд, принесуть дивіденди в майбутніх конфліктах."
  PET_defense_of_the_homeland: "Захист нашої частки"
  PET_defense_of_the_homeland_desc: "Хоча ворожі поглинання є звичним явищем у цьому світі після Б'айкруптсі, Ель-Борд не може дозволити собі зосереджуватися виключно на нападі. Вкрай важливо, щоб наш персонал безпеки мав знання та стратегії для захисту нашої частки ринку від зовнішніх агресорів."
  PET_defense_of_the_homeland_tt: "§OБерегові форти будуть споруджені біля кожної річкової переправи на півночі.§!"
  PET_machine_guns: "Злива свинцю"
  PET_machine_guns_desc: "Не треба бути генєм, щоб керувати автоматичною зброєю, тому надання її більшої кількості нашим співробітникам безпеки має підвищити нашу ефективність у бою без необхідності додаткового навчання персоналу."

  #left branch - 2

  PET_offshore_department: "Департамент офшорних операцій"
  PET_offshore_department_desc: "Багато великих колосів, залишених нам Жейролдас, залишаються у великому морі. Ель-Борд вважає, що було б прибутково спробувати відновити ці машини, щоб закріпити більшу частку ринку та конкурувати з місцевими флотами."
  PET_dockyards: "Плавучі верфі"
  PET_dockyards_desc: "З ласки Жейролдас багато морських платформ залишилися неушкодженими і придатні для будівництва, обслуговування та переобладнання кораблів для наших потреб. Ці платформи також є чудовим місцем, щоб приховати наш флот від конкурентів, доки ми не здобудемо достатньо домінування, щоб розпочати процес поглинання в повному обсязі."
  PET_rusted_wrecks: "Наказ про виконавчу реквізицію"
  PET_rusted_wrecks_desc: "«Наказ Ель-Сіо Номер Дваццять Два — Усім наймам, хто не робить пушкі, кулі, петро-ліам чи їжу, звітувати на пляш для работи з пошуку згублених кораблів». — Записка, прикріплена до кожних дверей у межах денного переходу від житла Ель-Сіо."
  PET_dredging_operation: "Відновлення видобутку в Затоці"
  PET_dredging_operation_desc: "«Звіт Ради № 537: Завершення водних ремонтних робіт — Три бурові платформи, які не були використані під верфі або розібрані на брухт, вдалося відремонтувати, і вони мають розпочати видобуток протягом місяця. Велика подяка Жейролдас». — Інженер-капітан Великої Вишки 6."
  PET_heavy_vessels: "Будівництво паперового тигра"
  PET_heavy_vessels_desc: "Зараз ми жодним чином не зможемо конкурувати з нашими місцевими суперниками за панування на морі, але якщо ми змусимо їх думати, що наш флот більший або сучасніший за їхній, можливо, ми виграємо собі трохи часу."

  #left branch - 3

  PET_shipping_department: "Департамент виконання замовлень"
  PET_shipping_department_desc: "Навіщо щось виробляти, якщо ніхто це не споживатиме? Хоча Компенні здебільшого самодостатня, наші надлишкові ресурси не завжди потрапляють туди, де вони найбільш потрібні чи бажані. Якщо ми зможемо оминути підступні джунглі та гори Мексики через небо, ми зможемо ефективніше задовольняти бажання споживача, іноземного чи внутрішнього."
  PET_runway_clearing: "Петро-Ейр"
  PET_runway_clearing_desc: "Довгі рівні ділянки землі, необхідні для запуску літальних апаратів, — рідкість у нашому куточку Мексики, але якщо нам вдасться створити їх, то наші авіаційні амбіції можуть здійснитися... звісно, якщо вони зможуть відірватися від землі."
  PET_light_aircraft: "Калюжостриби та Вертушки"
  PET_light_aircraft_desc: "Серед нашої частки ринку мало, якщо взагалі є, наймів, які мають досвід авіабудування. Ель-Борд запропонував почати з малого, і шляхом численних спроб і помилок найрозумніші друзі Ель-Сіо якимось чином створили базові працюючі літаки."
  PET_heavy_aircraft: "Небесні браміни"
  PET_heavy_aircraft_desc: "Чудодійний успіх наших перших малих гвинтових літаків змусив Ель-Борд інвестувати більше ресурсів у авіаційну програму, спрямувавши розробки на літаючі вантажівки, щоб наші ресурси були менш вразливі для місцевих рейдерів на землі."
  PET_extra_funding: "Великий конвой у небі"
  PET_extra_funding_desc: "«Звіт Ради № 616: Польоти строєм — Після тижнів тренувань наші пілоти спромоглися сформувати кілька вільних строїв, що дозволяють нам захищати продукцію, яка відвантажується, а також проводити розвідку та удари по місцевих популяціях рейдерів. Просимо додаткового фінансування, щоб ми могли розвинути цю ідею та створити повноцінний Повітряний Корпус». — Головний авіатор Групи захисту активів 2."

  #cincinnati reds branch *(mid)

  PET_board_of_directors: "Ель-Борд Дирекції"
  PET_board_of_directors_desc: "До Ель-Борду Анхолісти та Компенні були не набагато кращими за рейдерів та імперії, що їх оточували. Ель-Борд приніс петро-чіканцям стабільність, багатство та знання, і вони були раді дозволити Ель-Сіо продовжувати своє керівництво, доки їхній портфель залишався прибутковим."
  PET_yearly_report: "Рахівники"
  PET_yearly_report_desc: "Збалансований бюджет — це все, коли ти єдине, що стоїть між світом і Б'айкруптсі. Одним із головних обов'язків Ель-Борду є облік та управління коштами Компенні, щоб усе працювало безперебійно."
  PET_industrial_investments: "Інвестування в себе"
  PET_industrial_investments_desc: "Ель-Борд знає, що у нас небагато можливостей для диверсифікації портфеля, тому ми повинні ставити на того, хто, як ми очікуємо, зірве куш у найближчі роки: на нас!"
  PET_military_investments: "Автоматика для людей"
  PET_military_investments_desc: "«Що таке військово-промисловий комплекс? Робити штуки, щоб вбивати людей — це дуже просто». — Ель-Сіо."
  PET_united_portfolio: "Розподілені дивіденди"
  PET_united_portfolio_desc: "Ми повинні продовжувати рости, якщо хочемо йти в ногу з нашими місцевими конкурентами. Зосереджуватися лише на одному напрямку — це дурість; ми мусимо інвестувати у всі доступні можливості, щоб максимально посилити нашу внутрішню індустрію!"
  PET_small_refining_efforts: "Те, що ми робимо найкраще"
  PET_small_refining_efforts_desc: "Петро-Чіко побудована на видобутку петро-ліаму (це навіть є в назві!), і поки що немає жодних причин щось змінювати. З таким же успіхом ми можемо продовжувати вдосконалювати видобуток і використання наших ресурсів, поки маємо таку можливість. Мабуть, саме цього хочуть Жейролдас, інакше вони б не залишили нам такі можливості тут!"
  PET_retrofitted_power: "Газ, газ, газова енергія!"
  PET_retrofitted_power_desc: "Петро-ліам — це чудо-речовина, але одне з найкращих її застосувань зараз — це виробництво електрики! Ми повинні використати наші багаті запаси, щоб збільшити потужності генерації електроенергії і випередити наше майбутнє споживання. Крім того, не схоже, що ця штука колись закінчиться, правда? Вона ж виходить із землі — це природно!"
  PET_smelting_salvage: "Переробка залишків"
  PET_smelting_salvage_desc: "На жаль, не всі титанічні машини, залишені нам Жейролдас, підлягали ремонту. Щоб продовжувати вшановувати Жейролдас, ми переплавимо ці кістяки для використання в інших святих проєктах, аби довести нашу відданість їхнім прибуткам."
  PET_index_the_complexes: "Звіт для Жейролдас"
  PET_index_the_complexes_desc: "Час настав — Ель-Сіо має представити звіт про всі наші нещодавні зусилля Анхолістам та Жейролдас, і все, що ми можемо робити — це сподіватися, що Жейролдас вважатимуть наші методи та результати прийнятними. Сподіваємось, він нічого не запоре."
  PET_tech: "Прибутки віри"
  PET_tech_desc: "«Моє плем'я, не партеся! Я думаю, ми зробили "досить хорошу роботу", і я знаю це краще за будь-кого іншого!» — Ель-Сіо."

  #right branch - 1

  PET_scientific_board: "Департамент інновацій"
  PET_scientific_board_desc: "Ті, хто пережив Перше Б'айкруптсі, були благословенні інтелектом, благочестям і силою волі. Ми продовжимо цю спадщину, створивши департамент, який гарантуватиме, що ми не застигнемо на місці і не дозволимо нашим конкурентам перевершити нас у наукових та комерційних інноваціях."
  PET_fund_research: "Боби для яйцеголових"
  PET_fund_research_desc: "«Звіт про прогрес інновацій № 1: Розподіл активів — Хоча ми вдячні Ель-Сіо за те, що він відкрив для нас свої схованки та фонди, з усією повагою, я не знаю, що він очікує від нас із цим мотлохом. Якщо Ель-Борд хоче, щоб ми досягли справжнього прогресу, нам потрібне велике вливання належних коштів і ресурсів негайно». — Капітан Дослідницького корпусу."
  PET_additional_funding: "Стимули розвитку"
  PET_additional_funding_desc: "«Re: Звіт про прогрес інновацій № 1: Розподіл активів — Хоча Ель-Борд цінує вашу турботу та ентузіазм, важливо пам'ятати, що вони є вашим керівництвом, і до них слід звертатися з повагою. Що стосується вашого питання фінансування, ми будемо раді виділити стільки коштів, скільки вам потрібно, за умови, що ваші дослідження відповідатимуть нашим інструкціям. Відхилення від цього вважатиметься корпоративним шпигунством, і ви підлягатимете дисциплінарному стягненню». — Секретар Ель-Борду."
  PET_advanced_department: "Введення комерційних протоколів"
  PET_advanced_department_desc: "Останні звіти від Анхолістів вказують на те, що мобільні термінали для доступу до ресурсів Компенні зменшать навантаження на наш логістичний апарат. Завдяки останнім розробкам наших вчених ми створили роботів, які можуть захищати себе та інших, водночас діючи як термінали Компенні."
  PET_the_viceroyalty: "Розширення нашого ланцюга постачання"
  PET_the_viceroyalty_desc: "Нещодавно ми отримали цікаву пропозицію з-за меж володінь бога-машини: дипломати з Віцекоролівства запропонували обмін енергії та їжі на передові знання з медицини та робототехніки. Налагодити робочі стосунки з одним із небагатьох конкурентів у Мексиці, які не хочуть нас поглинути, здається гарною ідеєю. Ель-Борд схвалює!"

  #right branch - 2

  PET_tlaloc_has_fallen: "Жахливий день для дощу"
  PET_tlaloc_has_fallen_desc: "Buenas noches, nuestro querido amigo y guardián."
  PET_reclaim_the_archives: "Його останні дари"
  PET_reclaim_the_archives_desc: "Коли Тлалок припинив своє існування, одним із його останніх протоколів було надіслати нам технології роботобудування задля нашої безпеки. Хоча його, можливо, вже немає, ці сталеві захисники гарантуватимуть, що ми завжди пам'ятатимемо його щедрість і турботу про наш народ."
  PET_revive_our_refineries: "Стерв'ятники бункерів"
  PET_revive_our_refineries_desc: "Багато інфраструктури, яку Тлалок залишив по всій Мексиці, занепало і стало непридатним, проте можна тимчасово прискорити наші будівельні зусилля, зібравши частину технологій, що залишилися, поки вони теж не зігнили."
  PET_reactivate_petronet: "Більше, ніж сума частин"
  PET_reactivate_petronet_desc: "Поки Мексика все ще оплакує втрату Тлалока, деякі наші Анхолісти виявили документи щодо його створення і вважають, що фрагмент його оригінальної особистості може залишатися глибоко в його архівах. Якщо ми зможемо поєднати цей залишковий код із нашою сплячою мережею ПетроНет, може виникнути щось нове."
  PET_reclaim_the_mantle: "Повернення мантії"
  PET_reclaim_the_mantle_desc: "Бастарди Тлалока ганьблять його пам'ять, розколюючи Мексику після того, як Тлалок віддав своє життя, щоб зберегти її в безпеці. Оскільки ми володіємо останнім залишком справжнього Тлалока, саме ми повинні продовжити його місію заради Компенні та всієї Мексики."

  #right branch - 3

  PET_board_of_acquisitions: "Департамент поглинань"
  PET_board_of_acquisitions_desc: "Ми повинні залишатися в курсі дій наших місцевих конкурентів на мексиканському театрі дій, щоб ми могли реагувати на безгосподарність або агресивний піар у компетентний та ефективний спосіб, що потенційно дозволить нам експоненціально розширити нашу частку ринку."
  PET_aztec_problem: "Місцевий рекет"
  PET_aztec_problem_desc: "Більша частина місцевого ринку або зайнята арміями роботів та супермутантами на півночі, або перебуває під п'ятою двох імперій на півдні. Однак ситуація на півдні, схоже, загострюється, і ми повинні бути на позиціях, щоб скористатися будь-якими можливостями."
  PET_pacify_the_locals: "Заходи із запобігання збиткам"
  PET_pacify_the_locals_desc: "У міру зростання кордонів Компенні важливо показати новопридбаним наймам, чому вони мають бути вдячні за те, що тепер належать Жейролдас та їхньому обраному народу. Зрештою, хто виступатиме проти тих, хто рятує їх від небуття?"
  PET_chichen_itza: "Містечка Компенні"
  PET_chichen_itza_desc: "Зрозуміло, що наші конкуренти на півдні прагнуть захопити нашу частку ринку. Якщо ми тихо укріпимо прикордонні села і замінимо їхнє населення нашим персоналом служби безпеки, ми зможемо застати їх зненацька у випадку вторгнення."
  PET_strike_gods: "Людські дурощі"
  PET_strike_gods_desc: "Порівнювати себе зі святою присутністю Жейролдас або інших гаданих богів — це такий рівень гордині, до якого навіть Ель-Сіо не опустився б. Покажімо наймам наших конкурентів, що їхні Спікери, Генерали та Королі навіть близько не стоять до божественності."
  PET_recruitment_drive: "Усе заради Жейролдас"
  PET_recruitment_drive_desc: "Якщо ми хочемо досягти цілей Жейролдас до Анвел-Репорту, наші найми мають бути готові віддати все заради Жейролдас та їхніх прибутків. З цією метою збільшімо частоту проповідей Анхолістів і заохочуймо вступ до служби безпеки, щоб кожен найм був цілковито відданий нашим цілям."

