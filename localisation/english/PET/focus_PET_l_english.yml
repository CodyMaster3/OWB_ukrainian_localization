  PET_anwellreport: "Анвел-Репорт"
  PET_anwellreport_desc: "Третій Квартал лише провістив чвари, тоді як Четвертий Квартал неодмінно завершиться судом. Найанхоліший поклав свою віру на Ель-Сіо, щоб той переконався, що петро-чіканці готові довести свою вартість."
  PET_anwellreport_timer: "Суд Жейролдас"
  PET_anwellreport_timer_desc: "Ель-Сіо та Ель-Борд мають переконатися, що петро-чіканці гідні прибутків Жейролдас до того, як настане час звіту. Компенні та світ не можуть дозволити собі ще одне Б'айкруптсі.\n\n ПІДКАЗКА: Ви повинні повернути мантію та організувати департаменти у функціонуючий уряд під проводом Ель-Сіо до моменту здачі Звіту."
  PET_petronet_formable: "Цифрова Адміністрація"
  PET_petronet_formable_desc: "Об'єднавши ПетроНет з останніми залишками Тлалока, ми станемо новим захисником Мексики... щоправда, ми ніяк не можемо знайти ядерні ракети."
  PET_petronet_category: "Повернення ПетроНет"
  PET_petronet_category_desc: "Використовуючи наявні технології, ми можемо інтегрувати наш відроджений ПетроНет у державні функції. Це має підвищити ефективність та зменшити навантаження на нашу адміністрацію."
  PET_submitreport: "Прийшов час постати перед Жейролдас. Ми подамо наші успіхи на розгляд і будемо сподіватися, що їх достатньо."
  PET_the_boards: "Представник Ель-Борду"