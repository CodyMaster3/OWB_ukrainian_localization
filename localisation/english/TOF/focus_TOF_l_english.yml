l_english:
tof_wg_on_sok: "Перестрілка з тубільцями"
tof_wg_on_sok_desc: "Каґа той ще виродок, ніхто й не згадає, якщо ми пришлемо хлопців і всадимо йому свинець у сраку. А може, ще й добрий хабар відхопимо!"

tof_wg_on_north: "Наліт на Північ!"
tof_wg_on_north_desc: "Може, хтось залишив там для нас щось смачненьке?"

tof_unique: "Народження Зірки"
tof_unique_desc: "Колись, у ланцюгові часи, доглядач іноді влаштовував перегляди до-воєнних фільмів як винагороду. Може, й ми можемо зняти щось подібне — у нас же є камери?"

tof_raider_pa: "Срані силові броні!"
tof_raider_pa_desc: "Боже, я обожнюю цю штуку. Надягайте, хлопці!"

tof_vipers: "Вонючі Гадюки"
tof_vipers_desc: "Колись ми намагались оселитися на території Гадюк, коли були ще малими. Вони нас вигнали! Яка зневага!"

tof_jackals: "Божевільні шакали"
tof_jackals_desc: "Канібали? Мерзота! Мене аж верне від думки жити поруч із такими. Я не можу ризикувати безпекою своїх людей — треба загнати їх у стійло!"

tof_ind_2: "Кеш!"
tof_ind_2_desc: "Я обожнюю гроші."

tof_ind_1: "Круті Байки"
tof_ind_1_desc: "Маріанн колись любила розганятися на трамплінах і стрибати, ще в Юті."

tof_rebuild_viper_city: "Гадюче Містечко"
tof_rebuild_viper_city_desc: "Ми побили Гадюк, забрали їхню зброю, принизили... але ми ж не можемо їх усіх знищити! Рейдерам слід триматися разом, так? Збудуємо їм селище."

tof_rebuild_jackal_city: "Шакалове Містечко"
tof_rebuild_jackal_city_desc: "Ці виродки шакали ще можуть нам знадобитися. Збудуємо їм поселення... головне, щоб подалі від нас!"

tof_ind_11: "Бомби-Суки"
tof_ind_11_desc: "Запрограмуємо затримку підриву на кілька секунд — трохи страху, перш ніж ворогам виб'є пику!"

tof_consolidation_of_raiders: "Топові рейдери Невади"
tof_consolidation_of_raiders_desc: "Хто сміється тепер?! ХТО СМІЄТЬСЯ ТЕПЕР?! Це охріненно — бути на вершині."

tof_the_straw_that_broke_renos_back: "Соломинка, що зламала Рено"
tof_the_straw_that_broke_renos_back_desc: "Неймовірно, але ми взяли це місто! Грабуємо все, що бачимо!"

tof_raiders_of_the_lost_vault: "Рейдери Зниклого Сховища"
tof_raiders_of_the_lost_vault_desc: "К чорту цих сопливих пацифістів! У ВАС Є ЗБРОЯ — ВИКОРИСТОВУЙТЕ ЇЇ! Ідіоти, бля..."

tof_heading_to_jericho: "Назустріч Джеріко"
tof_heading_to_jericho_desc: "Сидячи на купі здобичі з Есмеральди й Невади, Маріанн подумала: «Я тепер така багата, що можу, якщо захочу, повернути собі Джеріко від тих падлюк, що мене тоді зрадили». Раїдерів довго вмовляти не довелось — вона вже зробила їх багатими."

tof_psh_wg: "Біп-Буп — Ти Труп"
tof_psh_wg_desc: "Я виллю на твої материнські плати ядер-колу, підери."

tof_gra_wg: "Гробики хапаємо"
tof_gra_wg_desc: "Ідіть до біса, Хапуги."

tof_rip_wg: "Розірвемо вам серце"
tof_rip_wg_desc: "Було б кумедно притворитись торговцями, а потім просто почати стріляти без причини, ага?"

tof_sln_wg: "Мутанти, що аж лячно"
tof_sln_wg_desc: "Хлопцям на мішені."

tof_ind_5: "Так багато кришок, ааах!"
tof_ind_5_desc: "Ми навіть утримати все це не можемо! Шалені гроші!"

tof_rub: "Пограбування Рубі Велі"
tof_rub_desc: "Трохи рейду — й ніяких екзистенційних криз."

tof_ind_6: "Почесні Порохові!"
tof_ind_6_desc: "Кілька Порохових вирвались із невадинської неволі й добралися до нас! Наші хлопці просто в захваті від їхніх історій!"

tof_ind_7: "Біженці Великих Ханів"
tof_ind_7_desc: "Біженці з Великого Ханства принесли нам історії про нелюдські рейди НКР. Може, ми їм навіть повіримо."

tof_ves: "Мудрість Вес"
tof_ves_desc: "Одна з членів Рубі Велі виявилась досить корисною в нашому пограбуванні. Допомагає нам за життя й місце в нашій зграї."

tof_city_318: "Місто 318'"
tof_city_318_desc: "Місто 318 було колись експериментом — надземне сховище з ультрасучасною інфраструктурою. Але тепер, через 200 років, це ще один порохнявий смітник серед пустки."

tof_crescent_valley: "Скарби Півмісяцевої Долини"
tof_crescent_valley_desc: "Виявилось, ця долина досить багата — сільське господарство, жива спільнота. Ми можемо перетворити місцевих на рабів і годувати себе за їхній рахунок. А може, ще й чомусь навчимось..."

tof_ind_8: "Круті Капелюхи"
tof_ind_8_desc: "Ти тільки глянь! Хіба не стильний!?"

tof_ind_9: "Загальнорейдерський Призов Юта-Невада"
tof_ind_9_desc: "Ми розростаємось, і наші війни вже не просто гангстерські розбірки — це справжні бойові кампанії. Щоб тягнути таку армію рейдів, нам потрібна серйозна кампанія мобілізації!"

tof_eighties: "Битва за Джеріко"
tof_eighties_desc: "Не варто недооцінювати Вісімдесятників. Це не веселий наліт і не війна за наживу — це справжня м'ясорубка, без прикрас."

tof_white_legs: "Відновити Караванний Шлях Happy Trails"
tof_white_legs_desc: "Може, це й не властиво рейдерам, але Білоноші давно псують життя всьому сходу Юти. Вони грабують каравани Happy Trails і зруйнували Джеріко. Час з ними покінчити!"

tof_ind_10: "Накачатися на Наркоторгівлі"
tof_ind_10_desc: "Колись ми просто хапали, що давали. Тепер ми самі можемо не лише кайфувати, а й постачати! Подвійна вигода."

tof_gold_hill: "Скарби Голд-Гілл"
tof_gold_hill_desc: "Хлопці Маріанн хочуть осісти в Голд-Гілл — кажуть, там золото під землею. Якщо хочуть покинути рейди і жити спокійно — хто ми, щоб заважати?"

tof_coast_of_the_salt_lake: "Узбережжя Солоного Озера"
tof_coast_of_the_salt_lake_desc: "Маріанн давно не бачила ці води. Колись вона думала, що вже ніколи не повернеться сюди. Але ж от — повернулась."

tof_tar: "Воїни Смоли"
tof_tar_desc: "Колись ми б насміхались із Тар-Вокерів... а тепер? Це вже навіть не весело. Вони занепали. Але якщо захопимо регіон — може, вдасться стримати поширення хвороби."

tof_frisco: "Скарби Фріско"
tof_frisco_desc: "Фріско обікрали Білоноші, але залишили дещо цінне. Насоси, інструменти, матеріали... Ми знаємо, як це використати."

tof_lincoln: "Лінкольн називає нас Спасителями"
tof_lincoln_desc: "Раби Лінкольна після нашого вторгнення вважають нас визволителями. Такого з нами ще не було... Занадто мило для рейдерів, правда ж?"

tof_clk: "Зачистка Шляху Happy Trails"
tof_clk_desc: "Є ще одна банда, що тримає частину шляху. Не рахуємо Нью-Ханаан, звісно. Давайте їх приберемо."

tof_the_walls_of_jericho_fell: "Мури Джеріко"
tof_the_walls_of_jericho_fell_desc: "Маріанн колись мріяла спалити Джеріко до тла. Але тепер вона бачить: там досі страждають, як і вона колись. Вона може використати здобуте багатство, щоб зробити щось добре."

tof_union_station: "Вокзал Юніон"
tof_union_station_desc: "Саме тут Маріанн вперше прибула в Джеріко. Колись це було місце зустрічей караванів — а тепер просто купа металу під піском."

tof_lines_in_the_sand: "Лінії в Піску"
tof_lines_in_the_sand_desc: "Кажуть, якщо йти рейками достатньо довго — знайдеш §Rвеликих босів§!, що керують цим світом."

tof_riches_of_trade: "Багатства Торгівлі"
tof_riches_of_trade_desc: "Джеріко колись процвітало, поки Руки Бога не задушили торгівлю, а Вісімдесятники не підірвали водогін. Можливо, вдасться відродити хоча б частину цього?"

tof_the_great_water_plant: "Водогін Джеріко"
tof_the_great_water_plant_desc: "Ремонтуємо стару систему. Наші хлопці можуть зробити щось хороше, якщо постараються."

tof_repairing_hands_of_god_damage: "Шрами Рук Бога"
tof_repairing_hands_of_god_damage_desc: "Руки Бога — релігійна банда з Нью-Ханаану. Кажуть, працювали на Рігдона. Вони творили терор, прикриваючись 'гріхом'. Пора зцілити їхні рани."

tof_repairing_eighties_damage: "Сліди Вісімдесятників"
tof_repairing_eighties_damage_desc: "Вісімдесятники, хоч і звільнили 215-х, але Джеріко їм було пофіг. Вони просто ганяли на байках."

tof_utahs_great_resevoir: "Велике Водосховище Юти"
tof_utahs_great_resevoir_desc: "Наш водогін у чудовому стані! 215-ті дійсно можуть творити добро."

tof_the_hands_of_god: "Залишки Рук Бога"
tof_the_hands_of_god_desc: "Не всіх ми знищили — деякі ще прячуться. І вони не налаштовані мирно..."

tof_uprooting_resistance_cells: "Зачистка Супротиву"
tof_uprooting_resistance_cells_desc: "Для деяких наших гарячих голів це ідеальний шанс постріляти по поганцях."

tof_finding_their_hideouts: "Пошук Їхніх Схованок"
tof_finding_their_hideouts_desc: "Знадобиться час, але ми знайдемо всі укриття Рук Бога."

tof_jericho_restored: "Джеріко Відроджено"
tof_jericho_restored_desc: "Маріанн — молодець. Вона взяла свою долю за яйця й вивела з руїн ціле місто. Її мама би пишалась."

tof_repair_the_snake_river_canal: "Ремонт Каналу Зміїної Ріки"
tof_repair_the_snake_river_canal_desc: "У 2050-х рівень озера знизився, і якийсь розумник зробив канал. Пора знову привести його до ладу."

tof_ncn: "Витоки Рук Бога"
tof_ncn_desc: "Маємо докази, що Нью-Ханаан — справжній господар Рук. Пора стерти цю мерзоту з мапи."

tof_a_cafe_of_broken_dreams: "Кафе Зламаних Мрій"
tof_a_cafe_of_broken_dreams_desc: "Маріанн завжди мріяла бути зіркою. І, здається, вона цього досягла. Її кафе стане прихистком для тих, кого життя зламало."

cafe_manager: "Велична Господиня Кав’ярні"

tof_grand_raider_council: "Рада Рейдерів Усього Світу"
tof_grand_raider_council_desc: "Може, рейдери — це просто ті, кому життя дало хрінові карти. Але ми ще можемо показати всім, що навіть покидьки здатні піднятись, якщо сильні духом. Це буде меседж для всіх знедолених."
