# Events
nf_tof.1.t:0 "Спокута через працю"
nf_tof.1.d:0 "Коли до Фарфілда прийшов заколот, солдати Нью-Ханаану не забарились – вони придушили спротив і відновили порядок у місті. Але після бою постало питання: що ж робити з тими бунтівниками, які вижили? Розстріли без суду суперечили всьому, у що вірили ханаанці. Тож було вирішено: переможені мають спокутувати гріхи працею на благо громади. Так і народився 215-й Ланцюговий Загін. Його було кинуто на відбудову міста Джеріко, а також на..."
nf_tof.1.a:0 "Будівництво нових доріг"
nf_tof.1.b:0 "Копання нових криниць"
nf_tof.1.c:0 "Роботу в майстернях ремісників"

nf_tof.2.t:0 "Дорожні Воїни"
nf_tof.2.d:0 "Праця Ланцюгового Загону тривала – аж до ночі, коли з’явився Громовий Птах. Він і решта Вісімдесятників вдерлись у місто, несучи хаос і загибель у величезному каравані війни, знищуючи захисників із легкістю. Їхні мотори ревли вулицями, таранячи свіжовідновлені будівлі, над якими так довго працював 215-й. У цій метушні в’язні вирвалися, атакували конвоїрів і втекли у темряву. Вісімдесяті не звернули на них уваги, і під час втечі їм вдалось прихопити..."
nf_tof.2.a:0 "Ящик ракетниць!"
nf_tof.2.b:0 "Зброярню Вартових"
nf_tof.2.c:0 "Караван старого барахольника"

nf_tof.3.t:0 "Вакуум Влади"
nf_tof.3.d:0 "Після втечі з Джеріко 215-й лишився без керівництва, без мети. І саме в цей момент виступила Маріанн – колишня злодійка, яка потрапила в рабство під виглядом «боргової служби». Під час нападу Вісімдесятників вона задушила свого боргового власника Антона уві сні й приєдналась до 215-го. Використавши всі зв’язки, вона швидко стала фактичним ватажком цієї хаотичної зграї. Спираючись на досвід роботи в Джеріко й напівзабуті легенди, Маріанн повела колишніх воїнів Фарфілда на захід – у долини Сьєрра-Невади.\n\nЕсмеральда була нічого собі, але в долині вже були інші, що прагнули або оселитися там, або знайти легендарні скарби. Із невідомого джерела надходив сигнал на телевізори – показуючи дивних механічних людей, що живуть у нерівному, та все ж ідилічному світі. Як і решта прибулих, 215-й зацікавився. Їхні суперники – фанатики, святоші й мстиві вояки. Але в 215-го є те, чого бракує всім іншим:"
nf_tof.3.a:0 "Почуття гумору"
nf_tof.3.b:0 "Повна відсутність моралі"