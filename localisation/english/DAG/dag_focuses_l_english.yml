l_english:
   dag_eruption_of_red_mountain:0 "Виверження Червоної Гори"
   dag_eruption_of_red_mountain_desc:0 "Я повстав із мертвих, як робив це багато разів раніше і як робитиму ще багато разів у майбутньому. Тепер настав час оцінити ситуацію."

   dag_a_broken_heart:0 "Розбите Серце"
   dag_a_broken_heart_desc:0 "Моє найвеличніше творіння, Акулахан, знищено. Ця трагедія вічно переслідуватиме народ Морровінду, бо уявіть, що могло б статися. І все ж, можливо, Акулахан зможе повернутися в іншій формі..."

   dag_honour_the_sixth_house:0 "Вшанувати Шостий Дім"
   dag_honour_the_sixth_house_desc:0 "Шостий Дім визнав мене своїм богом і, коли я переможу, заслужить своє місце на чолі столу. Я мушу підтримувати їхню зосередженість та мотивацію."

   dag_the_gift_of_corprus:0 "Дар Корпрусу"
   dag_the_gift_of_corprus_desc:0 "Неосвічені можуть назвати це жахливою хворобою, але корпрус несе звільнення. Доля всіх — служити мені, і корпрус допомагає їм осягнути цю долю."
   DAG_corprus_tt:0 "Буде призвано чотири дивізії §Yдиких жертв корпрусу§!."

   dag_open_new_mines:0 "Відкрити нові шахти"
   dag_open_new_mines_desc:0 "З нашим прибуттям до цієї нової Червоної Гори, схоже, що Шостий Дім був не єдиним, хто прибув із Вварденфелла. Глибокі жили ебоніту з'явилися під Червоною Горою, і ми єдині, хто здатен їх розробляти."

   dag_forge_ebony_weapons:0 "Кування ебонітової зброї"
   dag_forge_ebony_weapons_desc:0 "Наш ебоніт, звісно, найкраще використати для підтримки нашого власного озброєння та броні. Було б нерозумно торгувати цим великим надбанням, хоч би яким цінним воно не було."

   dag_trade_ebony_ingots:0 "Торгівля ебонітовими зливками"
   dag_trade_ebony_ingots_desc:0 "Якщо ми будемо торгувати ебонітовими зливками з іншими, ми можемо втратити доступ до металу, але здобудемо величезні багатства. Ми обберемо ворогів, яких завоюємо пізніше."

   dag_enslave_lesser_beings:0 "Поневолення нижчих істот"
   dag_enslave_lesser_beings_desc:0 "На цій землі немає мерів Тамрієля, натомість вона населена мерзенними людьми, які спустошили Вварденфелл. Вони не заслуговують нічого, крім презирства та рабства."

   dag_spread_the_cult:0 "Поширення культу"
   dag_spread_the_cult_desc:0 "Культ Даґот Ура зміг здобути велику владу у Вварденфеллі. Ці результати неважко буде повторити в цій забутій богами землі."

   dag_dwemercraft:0 "Двемерське ремесло"
   dag_dwemercraft_desc:0 "Хоча ця земля, очевидно, ніколи не знала двемерів, машини, схожі на їхні конструкції, є повсюди. Ці «роботи» напрочуд вражаючі. Настав час мені дізнатися, як працюють ці машини."

   dag_begin_crafting_the_new_numidium:0 "Почати створення нового Нумідіума"
   dag_begin_crafting_the_new_numidium_desc:0 "Акулахан повстане з мертвих під нашим наглядом. Це буде довге і важке завдання, але результат буде надто величним, щоб не працювати заради нього."

   dag_a_blighted_land:0 "Земля, охоплена Мором"
   dag_a_blighted_land_desc:0 "Ця земля наповнена дивними створіннями, чудернацькими речами, які ніколи не ступали на землю Морровінду. Втім, вони не мають імунітету до Мору."
   dag_war_beasts_tt:0 "Буде підготовлено три дивізії §Yбойових звірів, уражених Мором§!."

   dag_expansion_of_house_dagoth:0 "Розширення Дому Даґот"
   dag_expansion_of_house_dagoth_desc:0 "Дім Даґот могутній понад усяку міру, звичайно, але в цьому дивному світі ми повинні підготуватися так, як ніколи раніше."

   dag_brothers_of_dagoth_ur:0 "Брати Даґот Ура"
   dag_brothers_of_dagoth_ur_desc:0 "Попільні вампіри прийшли з Даґот Уром, і вони справді небезпечні супротивники. З них вийдуть чудові генерали та радники."
   dag_unlock_vampires_tt:0 "§YСім братів§! Даґот Ура стануть доступними як радники!"

   dag_blow_up_the_powderkeg:0 "Підірвати порохову бочку"
   dag_blow_up_the_powderkeg_desc:0 "У Колорадо існує якась напруга. Мені байдуже. Покажемо цим смертним силу бога."

   dag_accelerate_the_rot:0 "Прискорити гниття"
   dag_accelerate_the_rot_desc:0 "Ці гулі вже схожі на тих, хто обдарований корпрусом. Якщо ми просто дамо їм корпрус, можливо, ми зможемо прискорити їхнє падіння у священне божевілля."
   dag_ghoul_whd_tt:0 "Зів'ялі Пси (Withered Dogs) будуть перетворені за нашим задумом...\n\nБуде створено чотири дивізії §Yдиких гулів, заражених корпрусом§!."

   dag_offer_them_a_place:0 "Запропонувати їм місце"
   dag_offer_them_a_place_desc:0 "Хоробрі та достойні завжди матимуть місце поруч із Даґот Уром. Ці гулі можуть бути дивними та мати чужинські звичаї, але якщо вони зможуть довести свою корисність, для них знайдеться місце в Домі Даґот."
   dag_convert_old_dog_zhang_tt:0 "Ми переконаємо §YСтарого Пса§! та §YЧжана§! працювати з нами..."

   dag_foster_their_mania:0 "Підживити їхню манію"
   dag_foster_their_mania_desc:0 "Багато з цих «Беггерів» одержимі пошуком чогось під назвою Купол Боулдера. Цією манією можна маніпулювати і використовувати її для власних цілей. Вони будуть служити нам."
   dag_convert_baggers_tt:0 "Деяких найбільш §Yексцентричних§! персонажів «Беггерів» заохотять стати радниками."

   dag_seize_their_creations:0 "Захопити їхні творіння"
   dag_seize_their_creations_desc:0 "Вчені «Беґґерів» досягли вражаючих результатів. Ми можемо забрати їхні творіння і використати їх для себе."

   dag_rot_and_rads:0 "Гниль і Радіація"
   dag_rot_and_rads_desc:0 "Гулі та Дім Даґот мають певну спорідненість. Відкинуті тим самим суспільством, в якому ми існуємо, ми прагнемо створити щось краще для себе. Ми можемо навчитися співіснувати."

   dag_the_machine_god:0 "Бог-Машина"
   dag_the_machine_god_desc:0 "Вчені «Беґґерів» були одержимі місцем під назвою Купол Боулдера, але особливо тим, що зберігається всередині. Річчю під назвою ZAX."

   dag_claim_the_zax:0 "Привласнити ZAX"
   dag_claim_the_zax_desc:0 "Ніщо не може бути приховане від Даґот Ура."

   dag_rebuild_akulakhan:0 "Відбудувати Акулахан"
   dag_rebuild_akulakhan_desc:0 "Час настав. Акулахан буде відновлений, і світ затремтить перед своїм новим богом."
   dag_akulakhan_body_tt:0 "§8Тіло§! Акулахана сконструйовано"
   dag_akulakhan_heart_tt:0 "§tСерце§! Акулахана створено"
   dag_akulakhan_mind_tt:0 "§7Розум§! Акулахана підготовлено"
   dag_akulakhan_rebuilt_tt:0 "Ми отримаємо §YАкулахана§! як надзвичайно могутнього лідера та дивізію!"

   dag_sleepers_dreams:0 "Сни Сплячих"
   dag_sleepers_dreams_desc:0 "Щоб розширити культ, Даґот Ур продовжував поширювати своє послання через сни мешканців пустки. Одна група виявилася напрочуд сприйнятливою."

   dag_claim_denver:0 "Заявити права на Денвер"
   dag_claim_denver_desc:0 "Денвер стане чудовим доповненням до наших завоювань."

   dag_conquer_the_canyon:0 "Підкорити Каньйон"
   dag_conquer_the_canyon_desc:0 "Люди Чорного Каньйону — це невдала коаліція з діаметрально протилежними інтересами. Дивно, як вони вижили без нашої сильної руки, що вела б їх."

   dag_the_works_of_mortals:0 "Творіння смертних"
   dag_the_works_of_mortals_desc:0 "Хоча творіння людей цієї землі явно поступаються неймовірним витворам мерів, вони й справді розробили багато великих винаходів. Нам залишається лише вдосконалити їх."

   dag_new_morrowind_liberated:0 "Новий Морровінд звільнено"
   dag_new_morrowind_liberated_desc:0 "Ми далеко від дому, але ми створили нове володіння. Новий Морровінд."

   dag_it_is_not_too_late_for_my_mercy:0 "Ще не пізно для мого милосердя"
   dag_it_is_not_too_late_for_my_mercy_desc:0 "Багато хто може боятися мене, але я — милостивий бог."