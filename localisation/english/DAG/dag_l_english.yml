   DAG_neriv_areen_name:0 "Нерів Арін"
   DAG_neriv_areen_desc:0 "§G«Останні чутки. Маленька порада. Маленький секрет.»§!\n\nСтривай, звідки ти взявся? Як, кажеш, тебе звати?"

   DAG_dagoth_araynys_name:0 "Даґот Арайніс"
   DAG_dagoth_araynys_desc:0 "§Y«Я вб'ю тебе. Ти не віриш у це, інакше тебе б тут не було.»§!"
   DAG_dagoth_endus_name:0 "Даґот Ендус"
   DAG_dagoth_endus_desc:0 "§Y«Це рідкісний нектар, незрівнянний ні з чим, дистильований за віки до предків твоїх предків. І гідний тост за наш поєдинок.»§!"
   DAG_dagoth_gilvoth_name:0 "Даґот Гілвот"
   DAG_dagoth_gilvoth_desc:0 "§Y«Я тут не для розмов. Я тут, щоб битися.»§!"
   DAG_dagoth_odros_name:0 "Даґот Одрос"
   DAG_dagoth_odros_desc:0 "§Y«Я програю — втрачу звання. Ти програєш — втратиш усе. Ставки високі.»§!"
   DAG_dagoth_tureynul_name:0 "Даґот Турейнул"
   DAG_dagoth_tureynul_desc:0 "§Y«Жодних квітчастих промов. Жодних підступних трюків. Жодних формальних хвастощів чи викликів. Бийся. Або йди.»§!"
   DAG_dagoth_uthol_name:0 "Даґот Утол"
   DAG_dagoth_uthol_desc:0 "§Y«Іди до нього і підкорися. Тобі дадуть владу і місце. І, можливо, мир та прощення.»§!"
   DAG_dagoth_vemyn_name:0 "Даґот Вемін"
   DAG_dagoth_vemyn_desc:0 "§Y«Що? Хочеш поговорити? Хочеш здатися? Похвалятися? Заговорити мене до смерті?»§!"

