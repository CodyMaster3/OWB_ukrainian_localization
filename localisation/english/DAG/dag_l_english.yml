   nf_dag.0.t:0 "Гіркий, гіркий кінець"
   nf_dag.0.d:0 "Неревар здійснив немислиме... Акулахан знищений, зв'язок із Серцем Лорхана розірвано, а вся праця Даґот Ура руйнується навколо нього. Коли кінець наблизився, Даґот Ур спробував притягнути цю силу до себе ще раз... і знайшов дещо.\n\nДаґот Ур прокинувся всередині іншої гори, дивної та незнайомої. Його брати, Попільні вампіри, були поруч із ним разом із легіоном попільних рабів. Він не знав, де прокинувся, але знал, що мусить встановити свій контроль. Зрештою, він — бог."
   nf_dag.0.a:0 "Як це солодко — бути богом!"
   load_dagoth_ur_tt:0 "§gМи гратимемо за [DAG.GetNameWithFlag]!§!"

   nf_dag.1.t:0 "Червона Гора прокидається"
   nf_dag.1.d:0 "Даґот Ур був викинутий у дивну і жорстоку землю. Нижчу землю. Люди тут мляві й позбавлені сили та наполегливості раси данмерів. Заради їхнього ж блага їх треба підкорити.\n\nНа жаль, Даґот Ур більше не має у своєму розпорядженні всіх ресурсів Шостого Дому. Натомість, з ним прибуло лише:"
   nf_dag.1.a:0 "Легіон культистів"
   nf_dag.1.b:0 "Запас озброєння"

   nf_dag.2.t:0 "Спогади про Нумідіум"
   nf_dag.2.d:0 "На жаль, там, у Морровінді, Нереварін по-дурному знищив Серце Лорхана, і могутній бог Акулахан розсипався на шматки. Тут, однак, Даґот Ур почув про чудові винаходи, звані комп'ютерами — якась форма двемерського ремесла. Більше того, деякі з цих комп'ютерів здатні мислити самостійно. Можливо, Акулахан помер не назавжди..."
   nf_dag.2.a:0 "Акулахан житиме знову"

   nf_dag.3.t:0 "Збір Шостого Дому"
   nf_dag.3.d:0 "Даґот Ур більше не може чекати, настав час Сяючим впасти під нашою могутньою ходою. Просуваючись уперед, ми напевно дізнаємося більше про ці мислячі комп'ютери. Як вони можуть протистояти богу?"
   nf_dag.3.a:0 "Світ пізнає Даґот Ура"
   dag_muster_house_tt:0 "Чотири дивізії §YВірних Даґот Ура§! буде призвано!"

   nf_dag.4.t:0 "Творіння єретиків"
   nf_dag.4.d:0 "Після допитів вчених і солдатів «Беґґерів» стало зрозуміло, що вони шукали потужну машину. Щось під назвою ZAX у таємничому Куполі Боулдера. Неймовірна мисляча машина, здатна до вражаючих роздумів.\n\nЗвісно, такий пристрій став би чудовим мозком для нового Акулахана, якого я створю. Наша мета в цій дивній землі зрозуміла. Створити нашого бога заново і принести мою милостиву мудрість у пустку."
   nf_dag.4.a:0 "Твоя праця нічого не варта, Нереваре..."

   nf_dag.5.t:0 "Сни для Сплячих"
   nf_dag.5.d:0 "Даґот Ур поширив сни в розумах усіх, хто міг їх сприйняти, що принесло нам чималу кількість новобранців. Все ж, деякі виявилися більш сприйнятливими до цих снів, ніж інші. Група під назвою «Сплячі» розуміє цінність керівної руки та силу цих машин.\n\nЗ огляду на їхню сприйнятливість, Даґот Ур звернувся до них безпосередньо. Вони виявили зацікавленість у співпраці з нами, і разом ми зможемо об'єднати пустку під нашим милостивим правлінням."
   nf_dag.5.a:0 "Солодких снів, Сплячі..."
   dag_research:0 "Хитрі розуми"
   dag_research_desc:0 "Даґот Ур знає ціну гострого та інтелігентного розуму у створенні нових двемерських механізмів. З найвидатнішим вченим усієї реальності на чолі (звісно ж, Даґот Уром), хто зможе нам протистояти?"

   nf_dag.6.t:0 "Солодких снів, Сплячі"
   nf_dag.6.d:0 "Тижнями в наші сни вторгалися обіцянки влади, слави та безмежного розвитку науки. Істота приходить до нас у видіннях — не людина, не гуль і не будь-яке інше створіння пустки. Істота справді не з цього світу. Він називає себе Даґот Ур.\n\nЙого обіцянки занадто великі, щоб їм опиратися. Зустріч умів, об'єднання наших знань? Наше спільне правління, спільне домінування над пусткою? Відсутність етичних запобіжників? Це майже занадто добре, щоб бути правдою."
   nf_dag.6.a:0 "Сон стає реальністю"

   nf_dag.7.t:0 "Дім там, де серце... Зачекайте-но..."
   nf_dag.7.d:0 "Зрозуміло, що я не зможу повернутися до мого коханого Морровінду найближчим часом. Я вигнаний з Тамрієля, можливо, назавжди, і Неревар тріумфував. Однак я можу збудувати свій власний тріумф тут.\n\nЦя земля дивна, але вона стає своєрідним домом. Можливо, одного дня, коли я повернуся до Тамрієля і стану його законним правителем, я зможу влаштувати тут будинок для відпочинку або щось таке."
   nf_dag.7.a:0 "Ні, це безглуздо"
   dag_new_morrowind:0 "Новий Морровінд"
   dag_new_morrowind_DEF:0 "Новий Морровінд"
   dag_new_morrowind_ADJ:0 "Данмерський"

   nf_dag.8.t:0 "Маєте прощальні слова?"
   nf_dag.8.d:0 "У цій пустці немає рівних мені. Мої легіони плюндрують континент, а мій новий Акулахан — втілення божественності. Я правлю залізною рукою, і смертні впадають у відчай від мого приходу. Одного дня, коли ця пустка стане моєю, я знайду спосіб повернутися до Морровінду. У той день Нереварін пошкодує, що перейшов мені дорогу."
   nf_dag.8.a:0 "Я пройду крізь вогонь і війну"

   DAG_akulakhan_decision_category:0 "Реконструкція Акулахана"
   DAG_akulakhan_decision_category_desc:0 "Акулахан був знищений Нереваріном, але доля дала мені новий шанс. Використовуючи інструменти цього світу та мої власні таємні знання, я можу створити нового Акулахана. У мене немає серця бога, але я маю містичні технології, що перевершують навіть двемерські.\n\n\n§8Тіло§! Акулахана: [dag_body_status]\n§tСерце§! Акулахана: [dag_heart_status]\n§7Розум§! Акулахана: [dag_mind_status]"
