 PIPBOY_PLUS_NATION_LIST_DESC:0 "[This.GetPipboySelectedRegionText]"
 PIPBOY_PLUS_REGION_LIST_DESC:0 "Цей розділ містить інформацію, що стосується національної оборони Сполучених Штатів у значенні Нового закону про шпигунство з поправками, 50 U.S.C., 31 і 32. Її передача або розголошення вмісту в будь-який спосіб неавторизованим особам карається законом."
 PIPBOY_PLUS_MECHANIC_LIST_DESC:0 "Тут ви можете знайти список усіх ігрових механік. Якщо ви хочете прочитати більше про якусь механіку, ви можете натиснути на її назву."
 PIPBOY_PLUS_STORY_LIST_DESC:0 "Old World Blues — це всеосяжний сетинґ, що охоплює всю північноамериканську пустку, проте деякі історії занадто великі, щоб уміститися навіть у ньому! Тут ви можете прочитати внутрішньоігрові тексти, короткі оповідання і навіть залаштункові секрети ваших улюблених націй!"
 PIPBOY_PLUS_CHANGELOG_MAJOR_LIST_DESC:0 "Тут ви можете знайти список всіх оновлень з чейнджлогами. Якщо ви хочете почитати чейнджлог певного оновлення - клацніть на нього."
