l_english:
  nf_events_res.1.t:0 "Ядерний Випробувальний Центр"
  nf_events_res.1.d:0 "Резервація була надсекретним військовим і ядерним науковим об’єктом, захованим у розпечених пустелях Арізони. Керував нею талановитий головний науковець — доктор Віллем Кларк, один із найвидатніших ядерних фізиків, яких дала Америка. Навіть тоді його колеги були в захваті від його генія, але, можливо, ще важливішою була здатність Кларка надихати підлеглих, завдяки чому було здійснено чимало відкриттів. Хоча жодне з них так і не вплинуло на Велику Війну.\nКоли ж земля була спопелена ядерним вогнем — саме Кларк виявився природженим лідером. У той час, як інші панікували, він стояв непохитно — як символ порядку й надії. Лише завдяки його залізній волі деяким вдалося вижити — навіть якщо довелось піти на крайнощі. Полковнику Ґріну й доктору Кларку довелось прийняти важке рішення: позбутись «непотрібного» персоналу. Для цього вони..."
  nf_events_res.1.a:0 "Зачинили їх, герметично опечатавши Секцію B"
  nf_events_res.1.b:0 "Отруїли систему водопостачання"
  nf_events_res.1.c:0 "Спричинили витік із реактора"

  nf_events_res.2.t:0 "Експедиція"
  nf_events_res.2.d:0 "10 років у тісному підземеллі, де лише електронний годинник міряв час, а єдина їжа — безсмакова паста під тьмяним блиском аварійного освітлення. За ці 10 років їхня і без того мала кількість лише зменшувалась. І коли, нарешті, броньовані двері розкрились, ті, хто вийшов назовні, вже не були тими, хто зайшов усередину.\nВони вагались. Новонароджені гулям здавалося, що Пустка відібрала не лише тіло, а й частину людяності. І зробити крок назовні — означало втратити останні уламки минулого. Та знову саме Доктор зібрав усіх, надавши їм нову мету — обрав 12 із їхнього жалюгідного числа і пішов сам у першу експедицію на поверхню.\nПолковник Ґрін намагався втримати порядок. Багато хто хотів піти за Кларком. Але з часом ентузіазм згас. Замість нього ширились чутки про долю експедицій. Минув рік. І тоді повернувся єдиний виживший — сам Доктор. Але він був не сам. Разом із ним прийшли інші гулі, вигнані й покинуті колишніми громадами. Вони страждали під чоботом гладкошкірих — і були раді йти за тим, хто дав їм надію. Доктор Кларк пообіцяв їм майбутнє, де гулі здобудуть..."
  nf_events_res.2.a:0 "Помсту"
  nf_events_res.2.b:0 "Порядок і добробут"
  nf_events_res.2.c:0 "Свій власний дім"

  nf_events_res.3.t:0 "Мрія Доктора Кларка"
  nf_events_res.3.d:0 "Віллем Кларк завжди був провидцем науки, розумом, що підносив інших. Та досвід життя серед гладкошкірих залишив слід: більше не рівний серед рівних — він прийняв роль рятівника гулячого роду.\nІз часом гулі успадкують цю Землю Обітовану. І їх головна перевага — час. У той час як шаленці на зразок Цезаря панують над Арізоною, Кларк і його послідовники переживуть ці імперії — і побачать, як вони руйнуються. Проте природа зіграла з нами жорстоко: хоч ми й живемо довше за інших, ми далекі від безсмертя. І хоч Кларк зумів створити нових гулів — ми досі не здатні існувати самі по собі. Нам усе ще потрібні гладкошкірі..."
  nf_events_res.3.a:0 "Рішення, будь-якою ціною"
  nf_events_res.3.b:0 "Поспішати зараз — нерозумно"
  nf_events_res.3.c:0 "Є важливіші справи"

  nf_events_res.4.t:0 "Мертвий Ринок"
  nf_events_res.4.d:0 "Радіаційний фон Резервації довгий час стримував розвиток повноцінного ринку. Наші товари, особливо зброя, зрівнялись або й перевершили довоєнну якість — завдяки знанням. Та покупців відлякувала радіація, а ціни були низькими. До сьогодні.\nЗаволодівши Лос-Аламосом (після щедрої поставки зброї для Легіону), гулі нарешті отримали торговий пост, гідний цього звання. Декілька гладкошкірих ще ховаються в своїх оселях — але з часом їх замінять ті, хто гідний цього місця. Це місто — втілення мрії Кларка. Торгові центри як цей — основа нового суспільства. Навіть якщо це займе ще 200 років — одного дня кожен гуль матиме свій дім."
  nf_events_res.4.a:0 "Одного дня, обов’язково..."

  nf_events_res.5.t:0 "На Брамах Пекла"
  nf_events_res.5.d:0 "Подорож була довгою й виснажливою, а останній її етап став справжнім жахом — усіх змусили вдягти яскраво-жовті захисні костюми, що лише посилили пекельну спеку аризонського сонця. Спершу вони йшли вночі, але після того як один із найміцніших чоловіків оступився в темряві й зламав ногу, центуріон вирішив: відтепер марш — лише вдень. Після того, як нещасного пристрелили... хоча інші цього не усвідомили, саме він виявився найщасливішим із усіх.\nНа третій день процесія досягла укріплених стін Резервації — зібраних зі старої техніки, від вантажівок до літаків. Вони утворювали бар’єр, покликаний утримати загрозу ззовні... й приречених всередині. Центуріон крикнув щось гулю, що стояв на кулеметній башті. Після гуркоту заліза ворота відчинилися — й вийшов ВІН.\nГуль завбільшки з супермутанта з хижим виразом обличчя, що лише уява могла прийняти за посмішку. Він підступив до легіонера в захисному костюмі — й навіть кремезний Кай Друз на його тлі виглядав як дитина. Після кількох коротких слів — угоду було укладено: схованка зброї та 30 життів були віддані Резервації. Легіонери відійшли, щоб забрати свою плату. А страшний гуль повернувся до полонених, рот його розтягнувся в посмішку, що відкрила гнилі зуби, і він вимовив слова, які переслідуватимуть їх до кінця життя:"
  nf_events_res.5.a:0 "\"Ласкаво просимо до Резервації.\""

  nf_events_res.6.t:0 "Великий Проєкт"
  nf_events_res.6.d:0 "Два століття праці привели нас сюди — але попереду ще кілька важких років, якщо ми хочемо втілити бачення Кларка.\n\nНам знадобиться багато робочої сили — гладкошкірих рабів буде спрямовано на шахти та до лабораторій. Керування цим — непросте завдання. І якщо щотижневе постачання живої сили буде недостатнім — борг доведеться відпрацювати пізніше!§R\n\nНа щастя, у нас є й інші інструменти. Новонароджені — майбутнє нашого виду. Їхні таланти слід використовувати — не марнуйте їх, а призначайте їм завдання через значок §Y«ядерного символу»§! у політичному меню.\n\nМайстри Підрівня 2 можуть виготовляти зброю та броню (для торгівлі чи наших солдатів), але не забувайте постійно поповнювати запаси — для Підрівня 3.\n\nУ глибинах Лос-Аламоського Центру Новонароджені допомагають доктору Кларку у дослідженнях. Поки вони працюють над Проєктом, щомісяця вони оброблятимуть припаси та наближатимуть нас до завершення.\n\nНаразі наші оцінки свідчать, що ми здатні реалізувати лише 25% Проєкту. Щоб досягти більшого, потрібно зосередитись на нових досягненнях."
  nf_events_res.6.a:0 "Ми врятуємо гуляче плем’я!"

  nf_events_res.7.t:0 "Крапля Каламутної Води"
  nf_events_res.7.d:0 "Гулі з Резервації жили ще з часів Великої Війни, і краще за всіх розуміли, чим є надія. Без неї — люди просто падали додолу, навіть якщо тіла ще могли рухатись. Розум здавався, й смерть приходила швидко, особливо в темних тунелях.\nАле дати надто багато надії — теж небезпечно. Раби почнуть мріяти про втечу. Про опір. І марно витратять себе. Тож гулі навчилися дозувати: ковток чистої води, миска нормальної їжі, одне добре слово — лиш би змусити продовжити рух.\nНавіщо витрачати більше на тих, чия доля вже вирішена? Для чого дозволяти їм померти в Зеленій Кімнаті, коли можна використати ще трохи? Це — ілюзія. Потужна, солодка. І навіть ті, хто бачить її наскрізь — все одно вірять. Бо яка альтернатива?"
  nf_events_res.7.a:0 "Який жах — жити без надії"

  nf_events_res.8.t:0 "Подих Переробленого Повітря"
  nf_events_res.8.d:0 "Жінка важко закашлялась, її руки майже не могли втримати кайло — тільки тому, що були надто онімілими, щоб випустити його. Вона копала в гарячих тунелях під Резервацією цілу вічність.\nГулі розповідали про нову вентиляційну систему — з фільтрами, що мали зберегти «гладкошкірих» у робочому стані довше. Вона не відчула змін. Але, можливо, в цьому і суть — якщо не стало гірше, значить, це вже добре.\nКолись вона рахувала дні. Слухала графік охорони. Шукала слабкості. Тепер — лише холодний камінь попереду. Лише одне: «ще один день». Слова, що колись щось значили, тепер — лише порожній звук.\nПоряд із нею впав ще один працівник. Колись вона б допомогла. А зараз — ні. Його відтягли. Вона навіть не знала його імені. І не було сенсу знати — всі тут вмирають. Вона підняла кайло знову, в голові пульсувала думка:"
  nf_events_res.8.a:0 "Ще один день..."


  nf_events_res.9.t:0 "Джилліан Маккінлі"
  nf_events_res.9.d:0 "Молодий людський раб із тривогою поглянув на старого гуля навпроти, та Генк не звертав на нього уваги — його погляд був прикований до щойно розритої землі. Коли мовчання тривало, раб нарешті наважився: \n\n“Пане Генку, будь ласка!”\n\nУ його голосі чулася відчайдушність. Попри намагання залишатись шанобливим, мовчання тривалістю в годину зламало його. Генк мовчки подякував хлопцю за те, що дозволив йому побути наодинці в жалобі. Але зовні — залишався кам’яним.\n\n\"Іди, Пітер,\" — нарешті сказав він. Зазвичай веселий, зараз голос не мав жодного відтінку емоцій. У куточку ока Генк побачив полегшення на обличчі юнака... що швидко змінилось.\n\n“Я не піду без вас,” — промовив той тихо, майже благально. І Генк знову не міг не захоплюватися його хоробрістю. Він ризикував не просто смертю. Він міг потрапити до Зеленої Кімнати. І все це — заради друга. За незаконне поховання людського тіла. Замість того щоб здати його на переробку — на добрива для Резервації.\n\n“Я любив її, знаєш?” — сумно мовив гуль. “Вона не відчувала того ж, я розумів... але мені було досить просто бути поряд.”\n\nНарешті він відступив від безіменної могили, і двоє рушили назад до холодних мурів Резервації. В очах Генка блищали сльози. “Я думав, що врятував її, коли відпустив подорожувати з тим в’язнем. Думав, більше не побачу. І зараз — краще б так і сталося... Навіщо Легіон її зловив?”\n\nГенк змовк. І тільки біля важких брам знову прошепотів:"
  nf_events_res.9.a:0 "Навіщо вони привели її назад?.."

  nf_events_res.10.t:0 "Піднятись і Спуститись"
  nf_events_res.10.d:0 "Кожна зброя має своє призначення, й Нефтида — найзагадковіша. Ніхто не знав, із яким завданням її послав Доктор Кларк. Дехто вважав, що вона загинула. Але майже через два роки вона повернулась — тихо, серед ночі. Один із нових охоронців її не впізнав, і вимагав пояснень, спричинивши переполох. Про секретність можна було забути.\n\nОсобисто Полковник Ґрін провів її до ліфта, суворо висваривши охоронця. Та коли запитав, чому її не було — вона не дала прямої відповіді. Лише сказала: її звіт — лише для вух Доктора Кларка."
  nf_events_res.10.a:0 "Fiat Nox"

  nf_events_res.11.t:0 "Перший Мушкетер"
  nf_events_res.11.d:0 "Бути першим — завжди тягар. Атос, перший народжений гуль, був доказом успіху експериментів Кларка. І на нього покладали чималі надії. Але він не був ні воїном, як Ґрін, ні розумом, як Кларк. Він був... посередній.\n\nІ все ж — не зник у тіні. Його витривалість, працьовитість і скромність зробили його улюбленцем серед робітників. І саме тому Кларк обрав його керівником розширення Резервації в Лос-Аламосі — завдання, яке Атос виконав так само вправно, як і кував зброю. Тепер він повернувся. І допоможе довести мрію до кінця."
  nf_events_res.11.a:0 "Один за всіх"

  nf_events_flavor_res.1.t:0 "Лос(т)"
  nf_events_flavor_res.1.d:0 "Після завоювання Нью Мексико, окрім поповнення лав рабів, ми відкрили сполучення до поселення гулів Лос — єдиного, крім нашого. Вони, на відміну від нас, не мали захисту Легіону. І тому були підкорені залишками Армії Аттіса. Боячись жорстоких мутантів, багато хто з них вирушив шляхами Легіону в пошуках дому.\n\nРезервація прийняла їх з відкритими обіймами. Зазвичай стільки Новеньких спричинило б проблеми, але ці гулі надзвичайно добре пристосовані до життя під землею. А дехто навіть почав вважати Кларка і його дітей-булів богами — перевтіленням свого давнього пророка."
  nf_events_flavor_res.1.a:0 "Полковник Ґрін переконує їх скласти зброю"
  nf_events_flavor_res.1.b:0 "Доктор Кларк запрошує їх лідерів у лабораторію"
  nf_events_flavor_res.1.c:0 "Генк дбає, щоб вони відчували себе як удома"

  nf_events_flavor_res.2.t:0 "Церква Загублених"
  nf_events_flavor_res.2.d:0 "Коли Доктор Кларк послав Горація з доктором Себастьяном до Лоса, він хотів лише забезпечити захист старому другу. Шанс на успішну місію був мізерним.\n\nТому союз із Лосом став сюрпризом. Ба більше — вони приймають вчення Кларка швидше, ніж самі мешканці Резервації.\n\nЧастково це завдяки тому, що місцеві вважають Горація — через його гігантський розмір — переродженням їхнього верховного жреця. І ми не маємо наміру їх розчаровувати. Навіть якщо їхня віра нам не потрібна — це зручний шлях нав'язати власну."
  nf_events_flavor_res.2.a:0 "Вітаємо братів і сестер"

  nf_events_green_res.1.t:0 "День Ґріна"
  nf_events_green_res.1.d:0 "Колись він служив у Армії США — і сказав би собі, що це необхідно. Бо Кларк — божевільний. І його мрія, якщо збудеться, знищить усе живе, що вижило після Великої Війни.\n\nАле Ґрін добре знає себе. Він вирішив позбутись Кларка ще давно. До повернення Доктора. Саме Ґрін очолив виживших. І, можливо, треба було застрелити Кларка тоді. До того, як він знову зібрав послідовників. До того, як замкнувся на найнижчому рівні, занурившись у безумні експерименти.\n\nТа він не зробив цього. І відтоді не спав ночами. Планував. Ризикував. Шанси були невисокими. Але тепер — усі частини на місці. Час зробити постріл. Хтось переможе. Хтось помре. Але цієї ночі — кошмар закінчиться."
  nf_events_green_res.1.a:0 "\"Ми живемо у спалаху...\""

  nf_events_green_res.2.t:0 "Позеленів"
  nf_events_green_res.2.d:0 "Попри всі страхи Полковника, його план пройшов бездоганно: його люди штурмували ліфт і перекрили всі входи. Без його «цінних творінь» спротив на шляху до лабораторії Кларка був мінімальним — підготовлені гулі легко просувались уперед. Ґрін очікував натовп фанатичних вчених, які стануть на захист свого пророка. Натомість їм протистояв лише один — і короткий удар прикладом вирішив справу. Жодних криків, лише мовчазний шок, вирази недовіри на обличчях тих, хто навіть не ворухнувся, поки закладали вибухівку на двері до «Зеленої Кімнати».\n\nНа свою честь, Кларк не тікав і не ховався — та й не мав би куди. Він просто стояв, як завжди впевнений у собі. Можливо, він думав, що гулі відступлять перед своїм живим спасителем. І, можливо, вони б і справді відступили. Але Ґрін не дав йому й слова вимовити — спустив курок. Кларк не видав жодного звуку. Можливо, його божевільний геніальний розум просто не зміг усвідомити, що все закінчилось ось так.\n\nБез Доктора взяти владу виявилося напрочуд легко. Навіть найвідданіші послідовники швидко підкорились — ще до світанку над Резервацією зійшло нове сонце. Чи стало краще — хто зна. Але настав час, щоб усі дізналися, що насправді відбувалось у Зеленій Кімнаті."
  nf_events_green_res.2.a:0 "\"Я ненавиджу, зневажаю й терпіти не можу брехню не тому, що кращий за інших, а тому, що вона мене жахає.\""

  nf_events_green_res.3.t:0 "Довга Хода"
  nf_events_green_res.3.d:0 "Ґрін бачив це безліч разів. Одинока фігура, що йде від воріт Резервації — без води, без їжі, приречена на повільну й болісну смерть. Радіація її не вб’є, але спрага й спека — точно. Попри те, що переворот був майже безкровним, Ґрін завжди знав, що деяких доведеться прибрати — тих, хто не прийме його версію подій, хто звинуватить його в тому, що він забрав у гульства їхнє можливе спасіння. І він не міг їх звинувачувати — сам ледь вірив у це.\n\nТа вирок був однозначний. Із того часу, як Ґрін почав пом’якшувати поводження з людьми в Резервації, потрібні були жорсткіші методи покарання. Спершу він не розумів, чому Доктор обрав саме таку жорстоку кару — але тепер зрозумів. Куля — це милосердя. А Довга Хода — справжнє покарання. Фізичне. Психологічне. Символічне."
  nf_events_green_res.3.a:0 "\"Ми живемо, як і мріємо — наодинці. І хоч мрія зникає, життя триває... болісно.\""
  res_long_walk_tt:0 "Ті, хто не бажає йти за Ґріном, залишають Резервацію назавжди.\n"

  nf_events_green_res.4.t:0 "Тепер Я — В Армії"
  nf_events_green_res.4.d:0 "Сержант Генк. Це ім’я досі звучало для нього чужо. Наче посада тимчасова, якби справжній власник повернувся. Але вона була його — без сумніву.\n\nГенк дивився на невеликий загін, що його йому доручив Ґрін — хтось дивився з повагою, хтось із недовірою. Сам Генк не зробив майже нічого, щоб заслужити бодай щось. Переворот стався за ніч, а він усе проспав. Прокинувся — і світ змінився. Новий, кращий — так він сподівався — світ Резервації.\n\nТе, що Ґрін не включив його у план — мабуть, на краще. По-перше, покійний Доктор завжди недовірливо до нього ставився. А по-друге, Генк просто не був солдатом. Але це не зупинило Ґріна — він викликав Генка в кабінет одразу після перевороту й сказав, що підвищує його до охоронця.\n\nГенк, звісно, заперечував. Наводив купу причин, чому не може бути солдатом. Ґрін мовчки слухав — терпляче, не перебиваючи. А потім просто подивився прямо в його безповікові очі й спокійно сказав: «Почнеш завтра. Усе, що потрібно — у зброярні.»\n\nОсь так Генк став частиною нової армії Ґріна. І, на диво, ця роль йому підійшла. Він не хотів у цьому зізнаватися, але нова посада дала йому змогу допомагати іншим гулям, а іноді й гладкошкірим. І він з тією ж пристрастю, що й раніше, взявся до справи. Минув час. І тільки коли Ґрін знову викликав його в кабінет — Генк зрозумів, як багато всього змінилось. І, як і раніше, він говорив, а Полковник — слухав. А потім просто кивнув і сказав:"
  nf_events_green_res.4.a:0 "\"Вас підвищено.\""