l_english:
  res_total_machines_text: "Вільні майстерні: §G[?level_2_factories_free]§!"
  res_weapons_machines_text: "Майстерні, що виробляють зброю: §M[?level_2_factories_weapons]§!"
  res_armor_machines_text: "Майстерні, що виробляють броню: §O[?level_2_factories_armor]§!"
  res_ghoul_machines_text: "Майстерні, що постачають проєкт: §P[?level_2_factories_ghoul]§!"

  RES_TOTAL_MACHINES_TT: "Загальна кількість вільних майстерень у §YПідрівні 2§!"
  RES_TOTAL_MACHINES_TT_DELAYED: "Вільні майстерні функціонують як поза-мапові фабрики, що дозволяє нам виготовляти різноманітні товари."

  RES_WEAPON_MACHINES_TT_DELAYED: "Ці майстерні щомісяця виготовляють §M[?level_2_factories_weapons_tt] одиниць Передової Енергетичної Зброї§!."
  RES_ARMOR_MACHINES_TT_DELAYED: "Ці майстерні щомісяця виготовляють §O[?level_2_factories_armor_tt] комплектів Броні Придушення§!."
  RES_GHOUL_MACHINES_TT_DELAYED: "Ці майстерні щомісяця виготовляють §P[?level_2_factories_ghoul] одиниць постачання§! для проєкту."

  RES_SL2_PICTURE_TT_DELAYED: "Раби, що живуть тут, з любов’ю прозвали §YПідрівень 2§! «Пекельним Полум’ям». Забруднені коридори наповнені густим смогом, а відблиски вічно палаючих печей грають на сталевих стінах."

  res_add_workshops_tt: "Додати §Y[?workshops_to_add] [GetRESworkshop]§! до §YПідрівня 2§!"
  res_workshop: "майстерню"
  res_workshops: "майстерні"

  # Sub Level 3
  res_supplies_text: "§GПідрівень 3§! має §p[?project_supplies|1] одиниць постачання§!. Цього місяця було вироблено §p[?new_supplies_tt|1]§!."
  RES_SUPPLIES_TT_DELAYED: ""

  res_project_speed_text: "Новонароджені обробили §p[?monthly_process_tt|1] одиниць постачання§!, виготовленого нашими майстернями в §YПідрівні 2§!. Цього місяця оброблено §p[?monthly_progress_tt|1]§!."

  RES_PROGRESSBAR_TT_DELAYED: "Прогрес реалізації проєкту: §p[?res_progress]%§!"

  RES_MAX_PROGRESS_TT: "Максимальний прогрес проєкту, який можна підвищити через фокуси.\n\nНаш поточний максимум: §p[?res_project_max_progress_display]%§!"

  # Newborn ghouls
  CIVILIAN_NEWBORN_TEXT: "Будують нове суспільство"
  CIVILIAN_NEWBORN_TT_DELAYED: "Доктор Кларк мріяв про майбутнє, де його обраний народ успадкує землю. Проте щоденне управління життям громадян Резервації тепер лежить на плечах його дітей."

  MILITARY_NEWBORN_TEXT: "Допомагають у захисті"
  MILITARY_NEWBORN_TT_DELAYED: "Пустка кишить гладкошкірими, що прагнуть знищити нас. Полковник Ґрін чудово нас охороняє, але майбутнє Резервації не може залежати від одного гуля."

  PROJECT_NEWBORN_TEXT: "Втілюють Проєкт"
  PROJECT_NEWBORN_TT_DELAYED: "Глибоко в надрах Резервації дрімає зброя величезної сили. Інженери довоєнних часів не уявляли, що саме гулям судилося завершити їхню справу."

  res_newborn_name: "[GetNewbornName]"
  res_newborn_tt: "[GetNewbornTT]\n\n\n[GetNewbornEffectTT]"

  res_newborn_1_name: "Кір"
  res_newborn_1_tt: "Кір — обдарований боєць. Якщо Себастіан був правицею Кларка, то Кір — його ліва рука. Сила й ефективність роблять його лідером у бойових і медичних дослідженнях."
  res_newborn_1_effect_tt: "§YЦивільні бонуси:§!\n    §YНеобхідні гарнізони:§! -15%\n\n§OВійськові бонуси:§!\n    §OАтака дивізій:§! +10%\n    §OПриріст досвіду армії:§! +5%\n\n§pПроєкт:§! Прогрес: +0.5"

  res_newborn_2_name: "Белль"
  res_newborn_2_tt: "Белль — вершина досліджень Кларка. Вродлива, розумна, сильна. Не прагнучи влади, вона виконує свою роль із гідністю, допомагаючи громадам."
  res_newborn_2_effect_tt: "§YЦивільні бонуси:§!\n    §YСтабільність:§! +10%\n    §YШвидкість будівництва:§! +5%\n    §YБезкоштовний ремонт:§! +30%\n\n§OВійськові бонуси:§!\n    §OШвидкість будівництва військових заводів:§! +10%\n\n§pПроєкт:§! Прогрес: +0.5"

  res_newborn_3_name: "Атос"
  res_newborn_3_tt: "Атос — перший народжений у §GПідрівні 3§!. Через слабке здоров’я не отримав слави, але став найкращим зброярем Резервації."
  res_newborn_3_effect_tt: "§YЦивільні бонуси:§!\n    §YСпоживчі фабрики:§! -3%\n\n§OВійськові бонуси:§!\n    §OПриріст ефективності виробництва:§! +5%\n    §OВипуск заводів:§! +10%\n\n§pПроєкт:§! Прогрес: +0.5"

  res_newborn_4_name: "Лопата"
  res_newborn_4_tt: "Лопата цікавиться зовнішнім світом. Єдиний, хто спілкується з гладкошкірими — наймає їх на роботу, але, за його словами, «тільки заради морального духу»."
  res_newborn_4_effect_tt: "§YЦивільні бонуси:§!\n    §YЕфективність видобутку ресурсів:§! +20%\n    §YСтавлення до торгівлі в альянсі:§! +50%\n\n§OВійськові бонуси:§!\n    §OШвидкість будівництва військових заводів:§! +5%\n    §YЗбереження ефективності виробництва:§! +5%\n\n§pПроєкт:§! Прогрес: +0.5"

  res_newborn_5_name: "Нефтіс"
  res_newborn_5_tt: "Нефтіс — мовчазна й похмура сестра Белль. Її уникають, окрім Гораціо. Саме він залучив її до роботи з новоприбулими."
  res_newborn_5_effect_tt: "§YЦивільні бонуси:§!\n    §YПасивний дохід кришок:§! +5\n\n§OВійськові бонуси:§!\n    §OПризовне населення:§! +2%\n\n§pПроєкт:§! Прогрес: +1.0"

  res_newborn_6_name: "Фляшка"
  res_newborn_6_tt: "Фляшка — протеже Себастіана, знаний своєю жорстокістю. Після невдалого замаху й кислотного опіку, він лише посилив експерименти."
  res_newborn_6_effect_tt: "§YЦивільні бонуси:§!\n    §YЦей тип — псих§!\n\n§OВійськові бонуси:§!\n    §OШвидкість підкріплення:§! +1%\n    §OМінімальний рівень тренування:§! -10%\n    §OЦіль опору:§! -10%\n\n§pПроєкт:§! Прогрес: +1.0"

  res_newborn_7_name: "Септімус"
  res_newborn_7_tt: "Сьомий «син» Кларка — єдиний, хто служив у Легіоні. Відомий своєю мужністю під час рейду Паулюса. Часто сперечається з Ґріном про захист Резервації."
  res_newborn_7_effect_tt: "§YЦивільні бонуси:§!\n    §YБазова ефективність виробництва:§! +5%\n    §YМаксимум ефективності:§! +3%\n\n§OВійськові бонуси:§!\n    §OОрганізація дивізій:§! +15%\n\n§pПроєкт:§! Прогрес: +0.5"
