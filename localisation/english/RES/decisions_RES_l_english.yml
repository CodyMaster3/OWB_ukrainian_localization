l_english:
  res_sublevel_2: "§YПідрівень 2§!"
  res_sublevel_2_desc:0 "§YПідрівень 2§! — це індустріальне серце Лос-Аламоса. Саме тут розміщено станції для виробництва різноманітної продукції за допомогою промислового обладнання, перенесеного з поверхні.\n\nКовалів зброї та броні можна призначити для виготовлення невеликих партій §MПередової Енергозброї§! та §OОбладунків для Придушення Бунтів§! за довоєнними кресленнями. Їх можна використовувати для озброєння наших військ або обмінювати на інші ресурси.\n\nТакож тут збираються §PПостачання§! для Проєкту на §GПідрівні 3§! перед тим, як відправити їх на обробку."

  convert_factory_to_level_2_decision: "Перенести Майстерні на §YПідрівень 2§!"
  convert_factory_to_level_2_decision_desc: "Щоб пришвидшити підготовку, ми зосередимо нашу індустрію в самому серці Резервації — де вона буде в безпеці."

  boost_production_slaves_level_2_decision: "Надіслати Більше Рабів"
  boost_production_slaves_level_2_decision_desc: "Щоб посилити виробництво, нам доведеться виділити частину рабів і спрямувати їх на §YПідрівень 2§!."

  res_sublevel_3: "§GПідрівень 3§!"
  res_sublevel_3_desc:0 ""

  res_town_category: "Місто Резервації"
  res_town_category_desc:0 "Зведене для торгівлі з тими, хто не може — або не хоче — ризикувати, наближаючись до радіоактивної зони Лос-Аламоса, Місто Резервації слугує нашим головним торговим вузлом. Саме тут ми контактуємо з усіма видами торговців — зокрема й легіонерськими работорговцями. Обмінюючи зброю та кришки на нові партії рабів, ми забезпечуємо постійне постачання робочої сили."

  military_exercise_descision: "Провести Військові Навчання"
  military_exercise_descision_desc: ""

  buy_ces_slaves_decision: "Купити Рабів у Легіону"
  buy_ces_slaves_decision_desc: "Раби із заходу вже зламані й досить добре підготовлені, однак вони мають попит і серед самих легіонерів — тому нам доведеться заплатити більше, щоб перебити інші ставки."

  buy_lac_slaves_decision: "Купити Полонених зі Сходу"
  buy_lac_slaves_decision_desc: "Завоювання Ланія принесло багато рабів, однак більшість із них ще не навчені. Легіонери пропонують знижку, якщо ми самі візьмемося за «дресирування»."
  buy_lac_slaves_decision_riot_gear_trigger: "У запасах має бути щонайменше §Y30§! одиниць §YБроні для Придушення Бунтів§!"

  sell_drucius_decision: "Продати Зброю Легіонському Посланнику"
  sell_drucius_decision_desc: "Зазвичай ми тримаємо найкращу зброю для себе, але для нашого доброго друга Кая Друза можемо зробити виняток."
  sell_drucius_decision_advanced_energy_weapon_trigger: "У запасах має бути щонайменше §Y50§! одиниць §YПередової Енергозброї§!"

  buy_nav_slaves_decision: "Запросити Додаткову Поставку з Навахо"
  buy_nav_slaves_decision_desc: ""

  res_launch_nuke_category: "Ядерний Арсенал Резервації"
  res_launch_nuke_category_desc: "З глибин Сховища Резервації виринає довоєнна гармата-гаубиця. Озброєна брудною бомбою §p«Ядерна Неллі»§!, вона готова знищити будь-яке місто гладкошкірих. Єдине, чого їй бракує — це команди Кларка."

  res_launch_nuke_decision: "Запустити §p«Ядерну Неллі»§! по [FROM.GetName]."
  res_launch_nuke_decision_desc: "Пора стерти це місто з лиця землі."

