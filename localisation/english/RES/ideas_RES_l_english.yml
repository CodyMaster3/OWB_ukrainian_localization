  res_level_1_idea:0 "Підрівень 1"
  res_level_1_idea_desc:0 "Справжні масштаби Резервації приховані від чужинців — навіть серед гулів мало хто знає, наскільки велике це населення, що живе і працює під штучним світлом Підрівня 1."

  res_ammo_idea:0 "Таємний Склад Полковника Ґріна"
  res_ammo_idea_desc:0 "Перемагає не той, у кого гарні ідеї, а той, хто має патрони й туалетний папір у потрібному місці в потрібний час. Стратегія — це добре. Але логістика — вирішальна."

  res_armor_idea:0 "Улюбленці Бетті"
  res_armor_idea_desc:0 "У кожної броні є свої слабкості. Але це не привід відмовлятись від неї. Так само й із Бетті — найкращі її роботи потрапляють до гулів, що зуміли їй догодити, але це не означає, що решту слід ігнорувати."

  res_crusade_idea:0 "Велике Преображення"
  res_crusade_idea_desc:0 "Встаньте, брати-гулі! Час повернути собі землі, що по праву належать нам. Ми покажемо справжній шлях гладкошкірим. І знищимо кожного, хто надумає нам опиратись."

