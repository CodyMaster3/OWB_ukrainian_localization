  # Crutch for Navajo AI
  res_help_for_navajo:0 "Праведний Гнів"
  res_help_for_navajo_desc:0 "Наші розвідники виявили жахливу правду, що гниє в самому серці Резервації. Всі поточні конфлікти й суперечки призупинено — допоки останній слід доктора Кларка не буде стертий з пустки."

  # Dynamic modifiers
  res_sub_level_2_dynamic_modifier:0 "Підрівень 2"
  res_sub_level_2_dynamic_modifier_desc:0 "Раби, що мешкають у цьому місці, прозвали його Пекельне Полум’я. Задушливі коридори Підрівня 2 залиті чадом нефільтрованого диму, а вічне світло печей відбивається від сталевих стін, наче саме пекло ожило."
