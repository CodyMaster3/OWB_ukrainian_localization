l_english:
  #-------------------------------
  # RES focuses, made by Rhacius
  #-------------------------------

  res_nuclear_testing_facility:0 "Ядерний Випробувальний Центр"
  res_nuclear_testing_facility_desc:0 "Доктор Віллем Кларк — геній не лише у фізиці, але й у лідерстві. Коли Старий Світ згорів у вогні, він урятував усе, що міг, сподіваючись одного дня збудувати новий світ із попелу."

  res_expedition_outside:0 "Перша Експедиція"
  res_expedition_outside_desc:0 "Дванадцятеро вцілілих були відправлені на контакт із зовнішнім світом — лише один повернувся. Доктор Кларк. Його блискучий розум був назавжди змінений досвідом із пусткою."

  res_clarks_dream:0 "Мрія Кларка"
  res_clarks_dream_desc:0 "Загадковий доктор Кларк усамітнився — навіть від інших гулів — проводячи кожну хвилину у своїй лабораторії на Підрівні 3, працюючи невтомно задля майбутнього гулячого роду."

  res_trading_post:0 "Торговий Пост"
  res_trading_post_desc:0 "Резервація давно стала прибутковим торгівельним вузлом. Навіть за часів племені Чорноногих тут вирувала торгівля, а тепер — центр обміну та работоргівлі."

  res_acquiring_slaves:0 "Забезпечення Рабсили"
  res_acquiring_slaves_desc:0 "Примусова праця — основа нашої економіки. Треба зробити все, щоб поставки рабів залишались стабільними."

  res_hank_focus:0 "Генк і Новенькі"
  res_hank_focus_desc:0 "Новенькі не завжди поділяють наше бачення, іноді навіть симпатизують гладкошкірим рабам. Краще призначити їх працювати на поверхні — подалі від Доктора."

  res_slaves_rad_protection:0 "Захист для Рабів"
  res_slaves_rad_protection_desc:0 "Наші раби не живуть довго. Але ми можемо продовжити їхню продуктивність, якщо забезпечимо хоч якесь радіаційне захисне спорядження."

  res_betty_focus:0 "Бетті"
  res_betty_focus_desc:0 "Пекло не знає гніву страшнішого за розгнівану жінку. Деякі раби вірять, що сам диявол перетворив її на гуля, щоб відкласти неминучу зустріч."

  res_scaven_pickers:0 "Збирачі Скавену"
  res_scaven_pickers_desc:0 "Кочівники, що живуть на наших землях. Уникли смерті від Легіону. Генк, розшифрувавши їхню тарабарщину, пропонує союз: трохи Rad-X в обмін на мир."

  res_horatio_focus:0 "Гораціо-Гігант"
  res_horatio_focus_desc:0 "Найбільший гуль Резервації — його минуле покрите таємницею. Кларк бачив у ньому вірного фанатика та жорстокого дресирувальника рабів. Ідеальний виконавець."

  res_smooch:0 "Придбати Більше Smooch’у"
  res_smooch_desc:0 "Багато мешканців Резервації страждають — фізично і ментально. Для всіх них, включно з рабами, Smooch — доступний засіб полегшення."

  res_gallup:0 "Поселення Ґаллап"
  res_gallup_desc:0 "Жителі Ґаллапа були інтегровані до Резервації після домовленості з Флегстаффом. Тепер їхнє життя служитиме нашій справі."

  res_trade_ces:0 "Торгівля з Флегстаффом"
  res_trade_ces_desc:0 "Ми отримали чимало вигоди від підйому Легіону. Їхні кампанії забезпечують нас паливом і рабами. Зміцнити ці зв’язки — наш обов’язок."

  res_trade_nav:0 "Торгівля з Навахо"
  res_trade_nav_desc:0 "Навахо стали надійними партнерами. Ми озброюємо їх, вони дають нам те, чого нам бракує. Старі вороги, нові союзники."

  res_trade_lac:0 "Доктор і Легат"
  res_trade_lac_desc:0 "Лише раз доктор Кларк покинув Підрівень 3 — щоб особисто привітати Ланія з новим призначенням. Ми не знаємо, про що вони говорили, але Легат запам’ятав це надовго."

  res_trade_two:0 "Торгівля По Новій Трасі"
  res_trade_two_desc:0 "Жителі Два-Сонця не надто нас поважають, але нові дороги відкривають нові можливості для обміну. Ми повинні скористатись цим шансом."

  res_trade_smooch:0 "Контрабанда Smooch’у"
  res_trade_smooch_desc:0 "Легіон не визнає Smooch, і хоч ми переконали їх дозволити торгівлю Rad-X та Rad Away — з Smooch’ем все інакше. Єдиний варіант — контрабанда."

  res_chem_kits:0 "Rad Away з Резервації"
  res_chem_kits_desc:0 "Наші торгпредставники добились дозволу продавати Rad Away. Оскільки дозвіл діє лише на наших торговців — ми автоматично отримали монополію."

  res_expand_trading_post:0 "Розширення Торгового Поста"
  res_expand_trading_post_desc:0 "Маленький торговий пост більше не вміщує всіх охочих торгувати. Його потрібно терміново розширити, щоб не втратити прибуток."

  res_jilian:0 "Історія Джиліан"
  res_jilian_desc:0 "Роботи на поверхні йдуть повним ходом. Але дехто з керівників починає сумніватись у тому «світлому майбутньому», яке обіцяли згори."

  res_road:0 "Залізниця Резервації"
  res_road_desc:0 "Ми хочемо краще з'єднати свої землі. Будівництво нової залізниці, за прикладом Навахо, — перший крок до централізації."

  res_town:0 "Місто Гулів"
  res_town_desc:0 "Гулі з усього Пустку тягнуться до нас. Хтось шукає безпеки, хтось — своїх. Через обмежений простір у підземеллях — вони створили власне поселення на поверхні."

  res_sub_level_1:0 "Підрівень 1"
  res_sub_level_1_desc:0 "Через брак простору ми вже переселили частину рабів. Настав час активно розширювати житлову зону Підрівня 1."

  res_town_scavenging:0 "Обшукуємо Ґаллап"
  res_town_scavenging_desc:0 "Наше керівництво вирішило обшукати місто Ґаллап на предмет ресурсів — попри можливі заперечення його мешканців."

  res_colonel_green_focus:0 "Полковник Ґрін"
  res_colonel_green_focus_desc:0 "У відсутність доктора Кларка саме полковник Ґрін повів уцілілих на відбудову залишків цивілізації. Поки Доктор зосереджений на великому плані, Ґрін забезпечує щоденне функціонування Резервації."

  res_elite:0 "Армія Гулів"
  res_elite_desc:0 "Полковник Ґрін першим усвідомив загрозу, яку становить Пустка, і створив елітний підрозділ, здатний стримувати жахи Арізони — принаймні до того моменту, коли Легіон перебрав на себе роль захисника."

  res_nuclear_nellie:0 "§pЯдерна Неллі§!"
  res_nuclear_nellie_desc:0 "Полковник Ґрін, як істинний солдат, покладається на звичайну війну — вважаючи це єдиним способом захисту. Доктор Кларк тим часом створює зброю для зовсім іншої війни..."

  res_ghoulification:0 "Дослідити Процес Гуліфікації"
  res_ghoulification_desc:0 "Коли шкіра тріскає, а тіло блює кров’ю — дослідники уважно спостерігають. Вони наближаються до розкриття таємниці перетворення на гуля. Їм залишилось лише більше піддослідних."

  res_born_ghouls:0 "Природжені Гулі"
  res_born_ghouls_desc:0 "Природжені гулі — майбутнє нашого виду. Резервація зробить усе можливе, аби зберегти ці досягнення Доктора. Але нинішній рівень успіху — нестійкий."

  res_sub_level_2:0 "Підрівень 2"
  res_sub_level_2_desc:0 "Плавильні Підрівня 2 — серце економіки. Без нього — немає рабів, ресурсів, зброї... і зрештою, Резервації. Ми повинні будь-якою ціною підтримувати його роботу."

  res_gas_masks:0 "Протигази"
  res_gas_masks_desc:0 "Радіаційні частки вбивають повільно, але вірно. Забезпечивши наших рабів навіть найпростішими протигазами — ми продовжимо їм життя і збільшимо продуктивність."

  res_filtration_system:0 "Нова Фільтраційна Система"
  res_filtration_system_desc:0 "Як наші раби мають працювати, якщо сама вода їх вбиває? Системи очищення води, здатні працювати в умовах радіації, зменшать втрати серед робочої сили."

  res_machines:0 "Давні Машини"
  res_machines_desc:0 "Звичайна електроніка гниє у цьому світі. Але Резервація була ядерною дослідною базою — і в ній збереглися витривалі машини. Потрібно лише знаходити запчастини."

  res_shooting_range:0 "Стрілецький Полігон"
  res_shooting_range_desc:0 "Полковник Ґрін наполягає: кожен гуль має хоча б раз на тиждень тренуватися зі зброєю. Для цього ми збудуємо новий полігон."

  res_ammo:0 "Останні Боєприпаси"
  res_ammo_desc:0 "Наші зброярі розробили нові набої з радіоактивним пігментом. Вони смертельно небезпечні для всіх не-гулів. Ідеальні для наших потреб."

  res_chems:0 "Хімічна Лабораторія Підрівня 2"
  res_chems_desc:0 "На вигляд — порожня. Але щодня туди заходить один гуль, поповнює запаси, й піднімається на іншому ліфті. Не тим, що веде до Підрівня 1..."

  res_weapons:0 "Нова Зброя"
  res_weapons_desc:0 "Один із наших зброярів створив абсолютно нову конструкцію. Ця зброя переважить усе, що є в арсеналі ворога — і наші солдати, і клієнти це відчують."

  res_armour:0 "Нова Броня"
  res_armour_desc:0 "Гулі відомі своєю витривалістю, але навіть їм потрібен захист. Ми не повинні зневажати ідеєю броні — наші солдати заслуговують на найкраще."

  res_green_room:0 "§GЗелена Кімната§!"
  res_green_room_desc:0 "Раби знають, що їх чекає смерть. А крики, що лунають з Підрівня 3 вночі — лише підтвердження. Так тривають жахливі експерименти Доктора в місці, яке називають §G«Зелена Кімната»§!."

  res_hint_focus:0 "???"
  res_hint_focus_desc:0 "§YПрекрасна\nЦікава§!\n\n§OОбдарована\nМайстерна\nАгресивна§!\n\n§pМовчазна\nЖорстока§!"
  res_hint_focus_tt:0 "\n§YНе все таке, яким здається§!\n\n§OДоля проєкту визначить нашу путь§!\n\n§pА може, трава й справді зеленіша по інший бік?§!"

  res_project_fate_tt:0 "§YРезультат проєкту визначить нашу долю.§!"

  res_head:0 "§cМесія§!"
  res_head_desc:0 "Розум людини здатен на все — бо в ньому все вже є: минуле... і майбутнє."

  res_left_hand:0 "§YДарує Спасіння Лівицею§!"
  res_left_hand_desc:0 "Дослідники Підрівня 3 знайшли розв'язання проблеми демографії. Ризикований, але ефективний метод. Скоро ми будемо готові дарувати спасіння всьому людству."

  res_heart:0 "§GПрокляте Серце§!"
  res_heart_desc:0 "І ось — прощавай доброта, людяність і вдячність! Я був заміною небес, нагороджував добрих... А тепер — я кара Божа, й на мені влада карати злих!"

  res_right_hand:0 "§PНесе Смерть Правицею§!"
  res_right_hand_desc:0 "Наші інженери перевооружили §pЯдерну Неллі§!, артилерійську гармату, здатну стріляти ядерними боєголовками. Незабаром ця зброя знищить ворогів Доктора — до тла."

  res_crusade:0 "§MВоскресіння§!"
  res_crusade_desc:0 "Доктор Кларк нарешті вийшов з лабораторії Підрівня 3. Його палаюча віра надихає гулям — усі збираються почути слова свого спасителя. Вперше — віч-на-віч."

  res_launch_nellie:0 "§RРозпочати Армагеддон§!"
  res_launch_nellie_desc:0 "Час настав. Знову ядерний вогонь зітре людство з лиця Землі. Радіоактивне полум’я покладе край епосі людей. І з попелу постане вік гулів."

  resg_going_green:0 "Обличчя в Обличчя"
  resg_going_green_desc:0 "У глибинах комплексу полковник Ґрін і доктор Кларк зустрічаються востаннє."

  resg_maintain_status:0 "Привілейований Статус"
  resg_maintain_status_desc:0 "Попри всі свої вади, Легіон має одну з найбільших армій у Пустці. Відкинути наш союз із ними — означає кинути під загрозу всі наші досягнення."

  resg_navajo_under_boot:0 "Місце Лиш Одній Резервації"
  resg_navajo_under_boot_desc:0 "Колишні «союзники» — Навахо — порушили торгові угоди й спробували нас знищити. Але вони не врахували наших технологій. Тепер саме вони під нашим чоботом."

  resg_master_of_aeronautics:0 "Майстерність Аеронавтики"
  resg_master_of_aeronautics_desc:0 "Нові території дають нам ресурси для виробництва літальних апаратів. Серед гулів чимало тих, хто ще до війни вивчав авіацію — саме час використати ці знання."

  resg_us_pilots:0 "Наліт Годин"
  resg_us_pilots_desc:0 "Без пілота літак — лише купа металу. Незважаючи на витрати, ніщо не замінить реального досвіду у повітрі."

  resg_cracking_whip:0 "Знайома Практика"
  resg_cracking_whip_desc:0 "Під керівництвом Кларка ми розробили безліч способів тримати гладкошкірих у покорі."

  resg_develop_farming_tools:0 "Ферми Нового Навахо"
  resg_develop_farming_tools_desc:0 "Захоплення ферм довкола столиці Навахо забезпечить стабільне постачання їжі — як для себе, так і для торгівлі."

  resg_depose_false_mother:0 "Скинути Матір Трайбалів"
  resg_depose_false_mother_desc:0 "Діана Стоун думає, що її можна вічно сприймати за богиню. Але ми знаємо, ким вона була до війни — звичайною смертною. Її землі та плем'я можуть добре послужити Резервації."

  resg_friends_of_drussus:0 "Друзі на Тому Боці"
  resg_friends_of_drussus_desc:0 "Друз має свою дорогу. Але підтримка зв’язку з гулями в Легіоні, особливо з високими офіцерами, — мудрий хід."

  resg_ghoul_friendly_arizona:0 "Дружба в Арізоні"
  resg_ghoul_friendly_arizona_desc:0 "Хоча недовіра з обох сторін усе ще відчувається, союзники в Арізоні приносять взаємну користь."

  resg_fortifying_our_positions:0 "Башти Оборони"
  resg_fortifying_our_positions_desc:0 "Хоч ми й не слідуємо більше безумним планам Доктора, вороги все ще існують. І рано чи пізно — з’являться на нашому порозі."

  resg_ghoul_army:0 "Гульська Армія"
  resg_ghoul_army_desc:0 "Під командуванням Полковника наші сили вистоять так само довго, як і самі наші тіла."

  resg_deepen_legion_ties:0 "Зміцнити Зв’язки з Легіоном"
  resg_deepen_legion_ties_desc:0 "Наші солдати часто воюють пліч-о-пліч із Легіоном і повертаються з історіями про те, що бачили."

  resg_adapt_legion_doctrine:0 "Їхні Методики"
  resg_adapt_legion_doctrine_desc:0 "На перший погляд їхні методи виглядають примітивно. Але кожна кампанія дає безцінний досвід — і ми його переймемо."

  resg_bear_hunting:0 "Дурний Ведмідь"
  resg_bear_hunting_desc:0 "Вони чіпляються за мертве минуле, будують суспільство на уламках невдач. Діти Каліфорнії навіть дурніші за Арізонців."

  resg_expand_production:0 "Без Сонця Під Землею"
  resg_expand_production_desc:0 "Майстерні під землею не зупиняються. Поки поверхні потрібні зброя й броня — робота триватиме. А кінець цього не скоро."

  resg_ultimate_deterent:0 "Червона Кнопка"
  resg_ultimate_deterent_desc:0 "Триває підготовка §pЯдерної Неллі§!. Тільки Ґрін має повноваження активувати її. Але ця зброя стане запорукою виживання."

  resg_army_with_spirit:0 "Бойовий Дух"
  resg_army_with_spirit_desc:0 "Після приходу Ґріна військо стало невід’ємною частиною суспільства. Це підіймає дух і частково компенсує малі масштаби населення."

  resg_navajo_compromise:0 "Шана Союзу"
  resg_navajo_compromise_desc:0 "Навахо — з нами. І ми — з ними. Два суспільства проти Пустки. Це вимагає компромісів, але ми сильніші разом."

  resg_reservation_airbase:0 "Спільні Крила"
  resg_reservation_airbase_desc:0 "Разом ми піднімемось у небо."

  resg_reservation_keeping_them:0 "Спільна Зброя"
  resg_reservation_keeping_them_desc:0 "Разом ми втримуємось на землі."

  resg_not_all_smoothskins:0 "Довіра до Гладкошкірих"
  resg_not_all_smoothskins_desc:0 "Важко довіряти гладкошкірим після століть зради. Але союз із Навахо може ґрунтуватись на справжній довірі, а не лише вигоді."

  resg_civilian_industry:0 "Цивільна Промисловість"
  resg_civilian_industry_desc:0 "Замість вкладати все у «Проєкт», частину ресурсів слід спрямувати на потреби цивільного населення в межах Резервації."

  resg_first_harvest:0 "Перший Урожай"
  resg_first_harvest_desc:0 "Кларк вважав за краще торгувати їжею. Але якщо спробувати — навіть ця земля здатна родити. Нам просто треба було захотіти."

  resg_welcome_the_silversmiths:0 "Вітати Сріблярів"
  resg_welcome_the_silversmiths_desc:0 "Хоч наш союз із Навахо — насамперед військовий, їхні майстри можуть принести економічну вигоду обом народам."

  resg_skinwalkers_patrols:0 "Військовий Обмін"
  resg_skinwalkers_patrols_desc:0 "У межах нашого пакту найкращі вояки обох армій обмінюватимуться досвідом, навчаючи один одного."

  resg_rio_grande_fleet:0 "Патрулі Ґранде"
  resg_rio_grande_fleet_desc:0 "Флот Навахо невеликий. Наш — майже відсутній. Але навіть скромні річкові судна зможуть захистити фланг. І це краще, ніж залишити його відкритим."

  resg_limited_expansion:0 "Обережне Розширення Підрівня 2"
  resg_limited_expansion_desc:0 "Тепер, коли на поверхні працює дипломатія, ми більше не маємо вижимати з Підрівня 2 усе до краплі. Промисловість важлива, але не ціною всіх інших можливостей."

  resg_stand_against_bull:0 "Дурний Бик"
  resg_stand_against_bull_desc:0 "Цезар наслідує суспільство, що впало дві тисячі років тому, наче б то його ідеї можуть бути планом у ядерній пустці. Та правда в тому, що він — лише марнославний загарбник. І вірити, що Легіон не зверне на нас уваги — безглуздя."

  resg_modern_arms:0 "Світло: Частинка й Хвиля"
  resg_modern_arms_desc:0 "Коли всі інші аргументи вичерпано — лазерна гвинтівка APOLLO говорить за себе."

  resg_dismantle_cult:0 "Позбавити Віри"
  resg_dismantle_cult_desc:0 "Багато з мешканців Резервації досі вірять у вчення Фальшивого Спасителя. Віллем Кларк століттями отруював розум. Знадобляться роки, аби все викорінити. Але цей день — перший крок."

  resg_exile_opposition:0 "Нехай Йдуть Стежкою Без Кінця"
  resg_exile_opposition_desc:0 "Безкінечний Шлях — жахлива традиція. Останнє попередження перед вигнанням. Нехай останні, хто ним пройде, будуть тими, хто не зрікся давнього зла."

  resg_sgt_hank:0 "Сержант Генк"
  resg_sgt_hank_desc:0 "Ще до Кларка Генк здобув репутацію. Він ніколи повністю не прийняв старі методи. Переведення його до армії додасть авторитету його словам."

  resg_owe_up:0 "Зізнання — Перший Крок"
  resg_owe_up_desc:0 "Складно, але необхідно — виступити перед гулем і гладкошкірим, щоб розповісти, де ми помилились. Щоб більше не повторити цього шляху."

  resg_close_mines:0 "До Сонця"
  resg_close_mines_desc:0 "Деякі раби не бачили світла так давно, що сонце обпалить їм очі й шкіру. Але це буде світло свободи."

  resg_end_human_experimentation:0 "Закрити Лабораторії — Відчинити Клітки"
  resg_end_human_experimentation_desc:0 "Часи живих експериментів завершено. Вцілілі піддослідні отримають допомогу. А науковці, здатні змінитись — нову мету."

  resg_convince_born:0 "Розмова з Першонародженими"
  resg_convince_born_desc:0 "Народжені Гулі — страшенне диво. Якщо ми зможемо переконати їх прийняти лідерство Ґріна — це збереже спокій у Резервації."

  resg_grant_freedoms:0 "Розірвати Нашийники"
  resg_grant_freedoms_desc:0 "Більше жоден людський раб не буде тягнути ланцюг. Хай хтось втече, хай хтось боїться. Але одного дня серед нас виросте нове суспільство."

  resg_old_world_knowledge:0 "Новий Світ — Стара Наука"
  resg_old_world_knowledge_desc:0 "Навіть ядерна війна не знищила закони всесвіту. Те, що працювало колись — працюватиме знову."

  resg_boulder:0 "Відкрити Купол"
  resg_boulder_desc:0 "Купол Боулдера — чудо старого світу. Фортеця знань, збудована, щоб пережити кінець світу. І вона вижила. Ми вже надсилаємо туди науковців."

  resg_hoover:0 "Будівництво Турбіни"
  resg_hoover_desc:0 "Колись — гордість людства, турбіни Гувера занепали з роками. Ми вже готуємо обладнання, щоб збудувати нову, й відновити велич."

  resg_paradise:0 "Сад Райський"
  resg_paradise_desc:0 "Землі Діани приховували багато. Але найбільше — справжній, робочий G.E.C.K.! Ми знайдемо йому достойне застосування."

  resg_satellite:0 "Поглянь Увечері на Зірки"
  resg_satellite_desc:0 "З перших днів людство мріяло про зірки. Ми дотягнулись до них. Прорвали небо. І знову зможемо, якщо вистачить волі й ресурсів."

