#### Стаття 1
constitution_text_article_1_subsection_1:0 "Кожен громадянин має право вільно висловлювати, писати або публікувати свої думки з будь-якого питання, несучи відповідальність за зловживання цим привілеєм. Жоден закон не повинен обмежувати свободу слова або преси; і в усіх справах щодо наклепу дозволяється подати істину як доказ, і присяжні мають право визначати як закон, так і факт під керівництвом суду."
constitution_text_article_1_subsection_1_tooltip:0 "СВОБОДА СЛОВА"
constitution_text_article_1_subsection_1_modifier_tooltip:0 "Приріст політичної влади: §G+0.1§!\nСтабільність: §R-5%§!"

constitution_text_article_1_subsection_2:0 "Кожен громадянин має право носити зброю для захисту себе та Республіки. Армія повинна завжди і за будь-яких обставин бути підпорядкована цивільній владі."
constitution_text_article_1_subsection_2_tooltip:0 "ПРАВО НА ЗБРОЮ"
constitution_text_article_1_subsection_2_modifier_tooltip:0 "Ціль опору: §R+5%§! \nШвидкість мобілізації: §G+10%§!"

constitution_text_article_1_subsection_3:0 "Держава не прийматиме законів, що обмежують право народу на зібрання, за винятком випадків, коли вони намагаються грати в Dungeons and Dragons. Нерди."
constitution_text_article_1_subsection_3_tooltip:0 "СВОБОДА ЗІБРАНЬ"
constitution_text_article_1_subsection_3_modifier_tooltip:0 "Фактор політичної влади: §G+5%§!\nСтабільність: §R-3%§!"

constitution_text_article_1_subsection_4:0 "З метою забезпечення та підтримки взаємної дружби і спілкування між народами різних штатів цього союзу, вільні мешканці кожного з цих міст, за винятком утікачів від правосуддя, мають право на всі привілеї та свободи вільних громадян у кількох містах."
constitution_text_article_1_subsection_4_tooltip:0 "СВОБОДА ПЕРЕСУВАННЯ"
constitution_text_article_1_subsection_4_modifier_tooltip:0 "Швидкість будівництва інфраструктури: §G+20%§!\nПриріст автономії підлеглих: §R+3%§!"

constitution_text_article_1_subsection_5:0 "Текст щодо права на приватну власність"
constitution_text_article_1_subsection_5_tooltip:0 "ПРАВО НА ПРИВАТНУ ВЛАСНІСТЬ"
constitution_text_article_1_subsection_5_modifier_tooltip:0 "Фактор виробничої потужності: §G+10%§!\nСпоживчі товари: §R+3%§!"

#### Стаття 2
constitution_text_article_2_subsection_6:0 "Повноваження уряду штату Техас мають бути поділені на три окремі гілки, кожна з яких повинна бути довірена окремому органу влади, а саме: законодавча – одній; виконавча – іншій; судова – ще іншій; і жодна особа чи група осіб, що належить до однієї з цих гілок, не повинна здійснювати повноваження, що належать іншій, за винятком випадків, прямо передбачених у цій Конституції."
constitution_text_article_2_subsection_6_tooltip:0 "ПОДІЛ ВЛАДИ"
constitution_text_article_2_subsection_6_modifier_tooltip:0 "Стабільність: §R+5%§!"

constitution_text_article_2_subsection_7:0 "Сенаторів обирають кваліфіковані виборці строком на чотири роки; проте після кожного перерозподілу має бути обрано новий Сенат, і сенаторів, обраних після кожного перерозподілу, буде поділено жеребкуванням на два класи. Повноваження сенаторів першого класу припиняються через два роки, другого – через чотири, щоб надалі кожні два роки переобирати половину Сенату. Сенатори приступають до виконання обов'язків у день, встановлений законом для початку регулярної сесії законодавчого органу, та служать повний термін."
constitution_text_article_2_subsection_7_tooltip:0 "ВИБОРИ ТА ТЕРМІН ПОВНОВАЖЕНЬ СЕНАТОРІВ"
constitution_text_article_2_subsection_7_modifier_tooltip:0 "Фактор призову: §G+3%§!"

constitution_text_article_2_subsection_8:0 "Результати кожних виборів до виконавчих органів, поки не буде передбачено інше, мають бути оформлені, запечатані та передані уповноваженими посадовими особами до столиці, адресовані Державному секретарю, який має передати їх спікеру Палати представників. Після обрання спікера, він повинен на першому тижні сесії законодавчого органу оприлюднити результати у присутності обох палат. Особа, яка набрала найбільше голосів, та відповідає вимогам, оголошується обраною. Якщо кілька осіб наберуть однакову кількість голосів – їх обирають спільним голосуванням обох палат. Суперечки щодо результатів вирішує спільне засідання палат."
constitution_text_article_2_subsection_8_tooltip:0 "ВИБОРИ ПОСАДОВЦІВ ВИКОНАВЧОЇ ВЛАДИ"
constitution_text_article_2_subsection_8_modifier_tooltip:0 "Множник командної сили: §G+10%§!"

constitution_text_article_2_subsection_9:0 "Верховний суд здійснює судову владу штату, якщо інше не передбачено Конституцією. Його юрисдикція поширюється на всю територію штату, і його рішення остаточні, окрім кримінальних справ. Апеляційна юрисдикція також остаточна, окрім кримінального права або іншого, передбаченого законом. Суд має повноваження видавати накази habeas corpus, mandamus, procedendo, certiorari тощо, згідно з законом. Законодавча влада може надати Верховному суду оригінальну юрисдикцію на видачу окремих наказів, за винятком щодо губернатора."
constitution_text_article_2_subsection_9_tooltip:0 "ПРИЗНАЧЕННЯ СУДДІВ"
constitution_text_article_2_subsection_9_modifier_tooltip:0 "Приріст підкорення: §G+3%§!"

constitution_text_article_2_subsection_10:0 "У разі виникнення вакантних місць у будь-якій з палат, губернатор або уповноважена особа повинні оголосити вибори для їх заповнення. Якщо губернатор не зробить цього протягом двадцяти днів, вибори можуть бути оголошені уповноваженим представником округу. Закон також може передбачити заповнення вакансій без виборів, якщо лише одна особа висунула кандидатуру. Сенатори та представники, окрім випадків зради, злочину чи порушення миру, мають імунітет від арешту під час сесії законодавчого органу. Кожна палата може карати ув’язненням до 48 годин за неповагу чи перешкоджання її роботі."
constitution_text_article_2_subsection_10_tooltip:0 "ПОВНОВАЖЕННЯ ДО ВНЕСЕННЯ ЗМІН"
constitution_text_article_2_subsection_10_modifier_tooltip:0 "Вартість політичної влади: §G-15%§!"

constitution_text_article_2_subsection_11:0 "Кожен законопроєкт, що пройшов обидві палати, передається губернатору. Якщо він схвалює – підписує; якщо ні – повертає з запереченнями. Якщо обидві палати після перегляду підтримають закон двома третинами голосів, він набирає чинності попри вето губернатора. Якщо губернатор не повертає законопроєкт протягом десяти днів (крім неділь), він автоматично набирає чинності. У випадку, якщо законопроєкт містить кілька пунктів, губернатор може накласти вето на окремі частини. Палати можуть переглянути кожен пункт окремо, і, за умови схвалення двома третинами, такі частини набирають чинності попри вето. Якщо законопроєкт не повернуто до завершення сесії, губернатор має 20 днів на публікацію заперечень."
constitution_text_article_2_subsection_11_tooltip:0 "ПРАВО ВЕТО"
constitution_text_article_2_subsection_11_modifier_tooltip:0 "Приріст політичної влади: §G+0.2§!"

#### Стаття 3
constitution_text_article_3_subsection_12:0 "Усі фонди, землі та інше майно, раніше відведені для підтримки державних шкіл; усі альтернативні земельні ділянки, зарезервовані штатом із грантів, раніше або в майбутньому виданих залізницям чи іншим корпораціям будь-якої природи; половина державних земель штату; і всі суми грошей, що надходитимуть до штату від продажу будь-якої частини цього майна, становитимуть постійний шкільний фонд."
constitution_text_article_3_subsection_12_tooltip:0 "РОЗПОДІЛ ШКІЛЬНИХ ФОНДІВ"
constitution_text_article_3_subsection_12_modifier_tooltip:0 "Швидкість досліджень: §G+5%§!\nПасивний прибуток кришками: §R-2.5§!"

constitution_text_article_3_subsection_13:0 "Щоб дозволити законодавчому органу виконувати обов’язки, викладені в попередньому розділі, оголошується, що всі землі та інше майно, раніше відведені для створення та підтримки Техаського університету, разом з усіма доходами від їхнього продажу, а також усі гранти, пожертви й асигнування, зроблені як штатом Техас, так і з будь-якого іншого джерела (крім пожертв із конкретною метою), становлять Постійний університетський фонд. Кошти мають інвестуватись у державні облігації США, штату Техас або округів, а також у муніципальні облігації, облігації, випущені за Федеральним Законом про фермерські кредити від 17 липня 1916 року та його поправками. Відсотки з інвестицій спрямовуються на цілі, вказані в попередньому розділі. При цьому окремі землі, відведені для університету в 1858 році, не включаються до цього фонду."
constitution_text_article_3_subsection_13_tooltip:0 "СТВОРЕННЯ УНІВЕРСИТЕТСЬКОГО ФОНДУ"
constitution_text_article_3_subsection_13_modifier_tooltip:0 "Швидкість досліджень: §G+8%§!\nПасивний прибуток кришками: §R-5.0§!"

constitution_text_article_3_subsection_14:0 "Крім земель, раніше наданих Техаському університету, додатково виділяється один мільйон акрів невикористаних державних земель для забезпечення діяльності цього університету та його філій. Вони мають бути продані згідно з тими ж правилами, що й землі постійного університетського фонду, а доходи мають інвестуватись так само. Законодавчий орган не має права надавати пільги покупцям цих земель."
constitution_text_article_3_subsection_14_tooltip:0 "ОСВІТА ДЛЯ МОЛОДІ"
constitution_text_article_3_subsection_14_modifier_tooltip:0 "Швидкість досліджень: §G+2%§!\nФактор призову: §R-5%§!"

constitution_text_article_3_subsection_15:0 "Уся земля, згадана в розділах 11, 12 і 15 статті VII Конституції штату Техас, що нині належить Техаському університету, підлягає оподаткуванню для потреб округів на тих самих умовах, що й приватна земля. Вартість визначається Податковою радою штату. Штат щороку компенсує округам суму, еквівалентну податку, накладеному на ці землі."
constitution_text_article_3_subsection_15_tooltip:0 "ОСВІТА ДО ДОРОСЛОГО ВІКУ"
constitution_text_article_3_subsection_15_modifier_tooltip:0 "Швидкість досліджень: §G+2%§!\nФактор призову: §R-5%§!"

#### Стаття 4
constitution_text_article_4_subsection_16:0 "Округам штату дозволено стягувати адвалорні податки з усієї власності в межах їхніх кордонів, за винятком перших $3000 вартості житлових домогосподарств. Ставка податку не повинна перевищувати 30 центів з кожних $100 оціненої вартості. Виручка використовується на дороги та контроль повеней, якщо не зазначено інше."
constitution_text_article_4_subsection_16_tooltip:0 "ОПОДАТКУВАННЯ РЕЗИДЕНТІВ"
constitution_text_article_4_subsection_16_modifier_tooltip:0 "Прибуток кришками: §G+15%§!"

constitution_text_article_4_subsection_17:0 "Жодна власність у штаті не може бути оцінена для оподаткування понад її ринкову вартість. Щоб заохотити вчасну сплату, платникам податків надається знижка: 3% за сплату на 90 днів раніше строку, 2% – за 60 днів, 1% – за 30 днів. Законодавчий орган зобов’язаний прийняти відповідні закони для реалізації цього положення."
constitution_text_article_4_subsection_17_tooltip:0 "ФІНАНСУВАННЯ АРМІЇ"
constitution_text_article_4_subsection_17_modifier_tooltip:0 "Ефективність фабрик: §G+10%§!\nФактор призову: §G+10%§!\nПасивний прибуток кришками: §R-10%§!"

constitution_text_article_4_subsection_18:0 "(а) Політичні підрозділи не можуть підвищувати загальну суму податків порівняно з попереднім роком без повідомлення та публічних слухань. Закон визначає форму, зміст і порядок повідомлення.\n(б) При розрахунку загальної суми податків враховуються нові об'єкти та території, додані з минулого року, а не оподатковувані в минулому році землі не враховуються.\n(в) Закон має передбачити, що власнику повідомляють про переоцінку його майна та надають приблизну оцінку майбутнього податку перед запровадженням будь-яких змін згідно з пунктом (а)."
constitution_text_article_4_subsection_18_tooltip:0 "ФОНД НАДЗВИЧАЙНОЇ ДОПОМОГИ"
constitution_text_article_4_subsection_18_modifier_tooltip:0 "Пасивний прибуток кришками: §R-3§!"

    ### Article 5
### Стаття 5
constitution_text_article_5_subsection_19:0 "(а) Кожна особа, яка не має жодної з дискваліфікацій, зазначених у Розділі 1 цієї статті або встановлених законом згідно з цим розділом, яка є громадянином Сполучених Штатів і резидентом цього штату, вважається кваліфікованим виборцем; за умови, що перед участю у виборах виборець повинен пройти реєстрацію, однак ця вимога не вважається умовою кваліфікації виборця в інших положеннях цієї Конституції, окрім як щодо права голосування.\n(б) Законодавчий орган може дозволити голосування за відсутності.\n(в) Право на вільне виборче волевиявлення має бути захищене законами, що регулюють вибори і передбачають адекватні покарання за втручання у вибори за допомогою влади, підкупу, заворушень чи інших неправомірних дій."
constitution_text_article_5_subsection_19_tooltip:0 "ПРАВО ГОЛОСУ ЧОЛОВІКІВ"
constitution_text_article_5_subsection_19_modifier_tooltip:0 "Стабільність: §G+1%§!"

constitution_text_article_5_subsection_20:0 "(а) Незалежно від будь-якого іншого положення цієї Конституції, законодавчий орган може приймати закони щодо процедури реєстрації, включно з термінами, які дозволяють особі, що має право голосу в цьому штаті, окрім вимог щодо проживання в окрузі або окрузі, голосувати за: (1) вибірників Президента і Віце-президента США, (2) всі посади та питання, які виносяться на голосування по всьому штату.\n(б) Законодавчий орган може дозволити голосувати за вибірників Президента і Віце-президента особам, які прожили в будь-якому місці цього штату щонайменше 30 днів до загальних виборів, і були кваліфікованими виборцями в іншому штаті або мали б право голосу там, якби залишились до виборів.\n(в) Законодавчий орган може дозволити голосування за відсутності для колишніх жителів штату, які переїхали в інший штат і відповідають усім вимогам до виборця, окрім проживання, протягом періоду, який дозволяє їм відповідати вимогам до голосування в новому штаті, але не більше 24 місяців."
constitution_text_article_5_subsection_20_tooltip:0 "ПРАВО ГОЛОСУ ЖІНОК"
constitution_text_article_5_subsection_20_modifier_tooltip:0 "Стабільність: §G+1%§!"

constitution_text_article_5_subsection_21:0 "Коли проводяться вибори округом, кількома округами, будь-яким політичним підрозділом штату або будь-яким чітко визначеним районом (який може включати міста, села чи муніципалітети) з метою випуску облігацій, надання кредиту, витрати коштів або прийняття боргових зобов’язань – голосувати мають право лише кваліфіковані виборці відповідного району, де відбуваються вибори."
