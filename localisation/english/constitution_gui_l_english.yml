 #### Article 1 - has 5
 constitution_text_article_1_subsection_1:0 "Кожен громадянин має право вільно висловлювати, писати або публікувати свої думки з будь-якого питання, несучи відповідальність за зловживання цим привілеєм. Жоден закон ніколи не повинен прийматися для обмеження свободи слова чи преси; і в усіх судових переслідуваннях за наклеп істина може бути подана як доказ, а суд присяжних має право визначати закон і факт під керівництвом суду."
 constitution_text_article_1_subsection_1_tooltip:0 "СВОБОДА СЛОВА"
 constitution_text_article_1_subsection_1_modifier_tooltip:0 "Щоденний приріст політичної влади: §G+0.10§!\nСтабільність: §R-5.00%§!"

 constitution_text_article_1_subsection_2:0 "Кожен громадянин має право носити зброю для захисту себе та Республіки. Військові завжди і в усіх випадках повинні підпорядковуватися цивільній владі."
 constitution_text_article_1_subsection_2_tooltip:0 "ПРАВО НА НОСІННЯ ЗБРОЇ"
 constitution_text_article_1_subsection_2_modifier_tooltip:0 "Цільовий опір: §R+5%§! \nШвидкість мобілізації: §G+10.00%§!"

 constitution_text_article_1_subsection_3:0 "Держава не повинна приймати жодних законів, що обмежують право людей на зібрання, хіба що вони намагаються грати у Dungeons and Dragons. Задроти."
 constitution_text_article_1_subsection_3_tooltip:0 "СВОБОДА ЗІБРАНЬ"
 constitution_text_article_1_subsection_3_modifier_tooltip:0 "Приріст політичної влади: §G+5%§!\nСтабільність: §R-3.00%§!"

 constitution_text_article_1_subsection_4:0 "Для кращого забезпечення та зміцнення взаємної дружби і зв'язків між жителями різних штатів у цьому союзі, вільні жителі кожного з цих міст, за винятком втікачів від правосуддя, мають право на всі привілеї та імунітети вільних громадян у різних містах."
 constitution_text_article_1_subsection_4_tooltip:0 "СВОБОДА ПЕРЕСУВАННЯ"
 constitution_text_article_1_subsection_4_modifier_tooltip:0 "Швидкість будівництва інфраструктури: §G+20.00%§!\nПриріст автономії суб'єкта: §R+0.30§!"

 constitution_text_article_1_subsection_5:0 "Кожному громадянину гарантується право на приватну власність. Жоден громадянин не може бути позбавлений своєї власності без його згоди, або без законних підстав та/або справедливої компенсації.\nГромадяни мають право використовувати свою власність у законні способи, якщо ця власність визначена законом."
 constitution_text_article_1_subsection_5_tooltip:0 "ПРАВО ПРИВАТНОЇ ВЛАСНОСТІ"
 constitution_text_article_1_subsection_5_modifier_tooltip:0 "Випуск заводів: §G+10.00%§!\nСпоживчі товари: §Y+3.0%§!"


 #### Article 2 - has 6
 constitution_text_article_2_subsection_6:0 "Повноваження Уряду Штату Техас поділяються на три окремі відомства, кожне з яких доручається окремому органу влади, а саме: законодавчі — одному; виконавчі — іншому, а судові — третьому; і жодна особа, чи група осіб, що належить до одного з цих відомств, не повинна здійснювати жодних повноважень, які належать до будь-якого з інших, за винятком випадків, прямо дозволених тут."
 constitution_text_article_2_subsection_6_tooltip:0 "РОЗПОДІЛ ВЛАД"
 constitution_text_article_2_subsection_6_modifier_tooltip:0 "Стабільність: §R+5.00%§!"

 constitution_text_article_2_subsection_7:0 "Сенатори обираються кваліфікованими виборцями терміном на чотири роки; але новий Сенат обирається після кожного розподілу місць, і Сенатори, обрані після кожного розподілу, діляться за жеребом на два класи. Місця Сенаторів першого класу звільняються після закінчення перших двох років, а місця другого класу - після закінчення чотирьох років, так що одна половина Сенаторів обиратиметься раз на два роки надалі. Сенатори вступають на посаду після свого обрання, у день, встановлений законом для скликання чергової сесії Легіслатури, і служать після цього повний термін, на який були обрані."
 constitution_text_article_2_subsection_7_tooltip:0 "ВИБОРИ ТА СТРОК ПОВНОВАЖЕНЬ СЕНАТОРІВ"
 constitution_text_article_2_subsection_7_modifier_tooltip:0 "Коефіцієнт призовного населення: §G+3%§!"

 constitution_text_article_2_subsection_8:0 "Результати всіх виборів згаданих посадових осіб виконавчої влади, якщо законом не передбачено інше, складаються, опечатуються і передаються уповноваженими законом членами виборчої комісії до місця перебування Уряду, на ім'я Державного секретаря, який передає їх Спікеру Палати представників, як тільки Спікер буде обраний, і зазначений Спікер повинен протягом першого тижня сесії Легіслатури розкрити й оголосити їх у присутності обох Палат Легіслатури. Особа, за яку проголосували на вказаних виборах, яка набрала найбільшу кількість голосів на кожну із зазначених посад відповідно і конституційно відповідає вимогам, оголошується Спікером із санкції Легіслатури обраною на зазначену посаду. Але, якщо дві або більше осіб набрали найбільшу та однакову кількість голосів на будь-яку з цих посад, одна з них негайно обирається на таку посаду спільним голосуванням обох Палат Легіслатури. Спірні вибори на будь-яку із зазначених посад визначаються обома Палатами Легіслатури на спільному засіданні."
 constitution_text_article_2_subsection_8_tooltip:0 "ВИБОРИ ПОСАДОВИХ ОСІБ ВИКОНАВЧОЇ ВЛАДИ"
 constitution_text_article_2_subsection_8_modifier_tooltip:0 "Множник збільшення максимального командного ресурсу §G+10%§!"

 constitution_text_article_2_subsection_9:0 "Верховний Суд здійснює судову владу штату, за винятком випадків, передбачених цією Конституцією. Його юрисдикція поширюється на всю територію Штату, і його рішення є остаточними, крім питань кримінального права. Його апеляційна юрисдикція є остаточною і поширюється на всі справи, крім справ кримінального права та інших випадків, передбачених цією Конституцією або законом. Верховний Суд та його Судді мають право видавати судові накази habeas corpus, як це може бути передбачено законом, і згідно з такими правилами, як це може бути передбачено законом, ці суди та їх Судді можуть видавати судові накази mandamus, procedendo, certiorari та інші накази, які можуть бути необхідні для забезпечення своєї юрисдикції. Легіслатура може надати Верховному Суду первинну юрисдикцію видавати судові накази quo warranto і mandamus у таких випадках, які можуть бути вказані, за винятком наказів проти Губернатора Штату."
 constitution_text_article_2_subsection_9_tooltip:0 "ПРИЗНАЧЕННЯ СУДДІВ"
 constitution_text_article_2_subsection_9_modifier_tooltip:0 "Щоденний приріст підкорення §G+0.03%§!"

 constitution_text_article_2_subsection_10:0 "Коли в будь-якій з Палат виникають вакансії, Губернатор або особа, яка виконує повноваження Губернатора, видає накази про проведення виборів для заповнення таких вакансій; і якщо Губернатор не видасть наказ про вибори для заповнення будь-якої такої вакансії протягом двадцяти днів після її виникнення, уповноважений член виборчої комісії округу, в якому могла статися така вакансія, уповноважений призначити вибори з цією метою.\nЛегіслатура може передбачити загальним законом заповнення вакансії в легіслатурі без виборів, якщо лише одна особа відповідає вимогам і заявляє про висування своєї кандидатури на виборах для заповнення вакансії.\nСенатори і Представники, за винятком випадків державної зради, тяжкого злочину або порушення миру, користуються привілеєм захисту від арешту під час сесії Легіслатури, а також по дорозі на неї та повертаючись з неї. \nКожна Палата може карати ув'язненням під час своїх сесій будь-яку особу, яка не є її членом, за неповажну або хуліганську поведінку в її присутності або за перешкоджання будь-якому з її проваджень; за умови, що таке ув'язнення не повинно за один раз перевищувати сорок вісім годин."
 constitution_text_article_2_subsection_10_tooltip:0 "ПОВНОВАЖЕННЯ ВНОСИТИ ПОПРАВКИ"
 constitution_text_article_2_subsection_10_modifier_tooltip:0 "Щоденний приріст політичної влади: §G0.2§!"

 constitution_text_article_2_subsection_11:0 "Кожен законопроєкт, який пройшов обидві палати Легіслатури, подається Губернатору на затвердження. Якщо він схвалює його, він його підписує; але якщо він не схвалює, він повертає його зі своїми запереченнями до Палати, де він був ініційований, яка заносить ці заперечення до свого журналу і приступає до його перегляду. Якщо після такого перегляду дві третини присутніх членів погоджуються прийняти законопроєкт, він надсилається разом із запереченнями до іншої Палати, де він також переглядається; і, якщо він буде схвалений двома третинами членів цієї Палати, він стає законом; але в таких випадках голосування обох Палат визначається голосами «за» і «проти», і імена членів, що голосують за і проти законопроєкту, заносяться відповідно до журналу кожної з Палат. Якщо будь-який законопроєкт не буде повернутий Губернатором з його запереченнями протягом десяти днів (за винятком неділь) після його подання, він стає законом так само, як ніби він його підписав, якщо тільки Легіслатура своїм перенесенням засідань не перешкодить його поверненню, і в такому випадку він стає законом, якщо тільки він не подасть його зі своїми запереченнями до канцелярії Державного секретаря і не повідомить про це публічною прокламацією протягом двадцяти днів після такого перенесення. Якщо будь-який законопроєкт, поданий Губернатору, містить кілька статей асигнувань, він може заперечити проти однієї або кількох таких статей і схвалити іншу частину законопроєкту. У такому разі він повинен додати до законопроєкту під час його підписання заяву щодо статей, проти яких він заперечує, і жодна стаття, проти якої він заперечує, не набуває чинності. Якщо Легіслатура проводить сесію, він надсилає до Палати, в якій був ініційований законопроєкт, копію такої заяви, і статті, проти яких він заперечує, розглядаються окремо. Якщо під час перегляду одна або кілька з таких статей будуть схвалені двома третинами присутніх членів кожної з Палат, вони стають частиною закону, незважаючи на заперечення Губернатора. Якщо будь-який такий законопроєкт, що містить кілька статей асигнувань, який не був поданий Губернатору за десять днів (за винятком неділь) до перенесення засідань, опиниться в руках Губернатора на момент перенесення, він має двадцять днів від моменту такого перенесення, протягом яких він може подати заперечення щодо будь-яких його статей і зробити публічну прокламацію щодо них, і така стаття або статті не набувають чинності."
 constitution_text_article_2_subsection_11_tooltip:0 "ПРАВО ВЕТО"
 constitution_text_article_2_subsection_11_modifier_tooltip:0 "Щоденний приріст політичної влади: §G+0.20§!"
 #### Article 3 - has 4
 constitution_text_article_3_subsection_12:0 "Усі кошти, землі та інше майно, раніше виділені та призначені для підтримки державних шкіл; усі запасні ділянки землі, зарезервовані Штатом із грантів, що були надані раніше або можуть бути надані в майбутньому залізницям чи іншим корпораціям будь-якого характеру; половина суспільного надбання Штату; і всі грошові суми, що можуть надійти до Штату від продажу будь-якої його частини, складають постійний шкільний фонд."
 constitution_text_article_3_subsection_12_tooltip:0 "РОЗПОДІЛ ШКІЛЬНИХ ФОНДІВ"
 constitution_text_article_3_subsection_12_modifier_tooltip:0 "Швидкість дослідження: §G+5.00%§!\nПасивний дохід кришок: §R-2.5§!"

 constitution_text_article_3_subsection_13:0 "Для того, щоб дозволити Легіслатурі виконувати обов'язки, викладені у попередньому Розділі, цим оголошується, що всі землі та інше майно, раніше виділені та призначені для заснування та утримання Техаського університету, разом з усіма надходженнями від їх продажу, здійсненого раніше або в майбутньому, а також усі гранти, пожертвування та асигнування, що можуть бути зроблені Штатом Техас у майбутньому, або з будь-якого іншого джерела, за винятком пожертвувань, обмежених конкретними цілями, повинні становити та стати Постійним Університетським Фондом. І те ж саме, що реалізується та надходить до Скарбниці Штату (разом із такими сумами, що належать Фонду, які зараз можуть бути в Скарбниці), має інвестуватися в облігації Сполучених Штатів, Штату Техас або округів зазначеного Штату, або в Шкільні Облігації чи муніципалітетів, або в облігації будь-якого міста цього Штату, або в облігації, випущені згідно з Федеральним законом про сільськогосподарські позики, затвердженим Президентом Сполучених Штатів 17 липня 1916 року, та поправками до нього; а відсотки, нараховані на них, підлягають розподілу Легіслатурою для досягнення цілей, заявлених у попередньому Розділі; за умови, що одна десята запасної Ділянки земель, наданих залізницям, зарезервованих Штатом, які були виділені та призначені для заснування Техаського університету Законом Легіслатури від 11 лютого 1858 року під назвою «Закон про заснування Техаського університету», не буде включена до складу Постійного Університетського Фонду або не становитиме його частину."
 constitution_text_article_3_subsection_13_tooltip:0 "ЗАСНУВАННЯ УНІВЕРСИТЕТСЬКОГО ФОНДУ"
 constitution_text_article_3_subsection_13_modifier_tooltip:0 "Швидкість дослідження: §G+10.00%§!\nПасивний дохід кришок: §R-5.0§!"

 constitution_text_article_3_subsection_14:0 "На додаток до земель, раніше наданих Техаському університету, цим виділяється і призначається для утримання, збереження та підтримки зазначеного Університету та його філій один мільйон акрів нерозподіленого суспільного надбання Штату, які мають бути визначені та виміряні, як це може бути передбачено законом; і зазначені землі повинні продаватися за тими ж правилами, а виручені кошти інвестуватися таким самим чином, як це передбачено для продажу та інвестування постійного Університетського фонду; і Легіслатура не матиме права надавати будь-які пільги покупцям цих земель."
 constitution_text_article_3_subsection_14_tooltip:0 "ОСВІТА ДЛЯ ПІДЛІТКІВ"
 constitution_text_article_3_subsection_14_modifier_tooltip:0 "Швидкість дослідження: §G+5.00%§!\nКоефіцієнт призовного населення §R-2.5%§!"

 constitution_text_article_3_subsection_15:0 "Усі землі, згадані в Розділах 11, 12 і 15 Статті VII Конституції Штату Техас, які зараз належать Техаському університету, підлягають оподаткуванню для потреб округу такою ж мірою, як і землі, що перебувають у приватній власності; за умови, що вони надаються для оподаткування за вартістю, встановленою Податковою радою Штату; і за умови, що Штат щорічно перераховуватиме кожному з округів, у яких розташовані зазначені землі, суму, що дорівнює податку, накладеному на зазначені землі для потреб округу."
 constitution_text_article_3_subsection_15_tooltip:0 "ОСВІТА ДО ПОВНОЛІТТЯ"
 constitution_text_article_3_subsection_15_modifier_tooltip:0 "Швидкість дослідження: §G+5.00%§!\nКоефіцієнт призовного населення §R-2.5%§!"
 #### Article 4 - has 3
 constitution_text_article_4_subsection_16:0 "Деякі округи Штату уповноважені стягувати адвалорні податки з усього майна в межах своїх відповідних кордонів на потреби округу, за винятком перших трьох тисяч доларів ($3,000) вартості житлових садиб одружених або неодружених повнолітніх, у тому числі тих, що проживають окремо, не більше тридцяти центів (30¢) з кожних ста доларів ($100) оцінки, на додаток до всіх інших адвалорних податків, дозволених Конституцією цього Штату, за умови, що отримані від цього доходи будуть використовуватися на будівництво та утримання доріг від ферм до ринків або на боротьбу з повенями, за винятком випадків, передбачених тут іншим чином."
 constitution_text_article_4_subsection_16_tooltip:0 "ОПОДАТКУВАННЯ РЕЗИДЕНТІВ"
 constitution_text_article_4_subsection_16_modifier_tooltip:0 "Дохід кришок: §G+15%§!"

 constitution_text_article_4_subsection_17:0 "Жодне майно будь-якого виду в цьому Штаті ніколи не повинно оцінюватися для сплати адвалорних податків за вищою вартістю, ніж його справедлива готівкова ринкова вартість, і жодна Рада з вирівнювання будь-якого урядового чи політичного підрозділу чи податкового округу в межах цього Штату не повинна встановлювати вартість будь-якого майна для цілей оподаткування на рівні, вищому за його справедливу готівкову ринкову вартість; за умови, що для заохочення своєчасної сплати податків Легіслатура матиме право передбачити, що платнику податків має бути надана Штатом і всіма урядовими та політичними підрозділами і податковими округами Штату знижка у розмірі трьох відсотків (3%) на адвалорні податки, належні Штату або будь-якому урядовому чи політичному підрозділу або податковому округу Штату, якщо такі податки сплачуються за дев'яносто (90) днів до дати, коли вони в іншому випадку стали б простроченими; і платнику податків надається знижка у розмірі двох відсотків (2%) на зазначені податки, якщо вони сплачуються за шістдесят (60) днів до того, як зазначені податки стануть простроченими; і платнику податків надається знижка в розмірі одного відсотка (1%), якщо зазначені податки сплачуються за тридцять (30) днів до того, як вони в іншому випадку стануть простроченими. Легіслатура приймає необхідні закони для належного адміністрування цього Розділу."
 constitution_text_article_4_subsection_17_tooltip:0 "ОБОВ'ЯЗКОВЕ ФІНАНСУВАННЯ АРМІЇ"
 constitution_text_article_4_subsection_17_modifier_tooltip:0 "Коефіцієнт призовного населення §G+10%§!\nПасивний дохід кришок: §R-10.0§!"

 constitution_text_article_4_subsection_18:0 "(a) З урахуванням будь-яких винятків, передбачених загальним законом, загальна сума податків на майно, що накладається політичним підрозділом у будь-якому році, не може перевищувати загальну суму податків на майно, накладених цим підрозділом у попередньому році, якщо керівний орган підрозділу не повідомить про свій намір розглянути збільшення податків і не проведе громадські слухання щодо запропонованого збільшення до того, як він збільшить ці загальні податки. Легіслатура має визначити законом форму, зміст, терміни та методи подання повідомлення, а також правила проведення слухань. \n(b) Під час обчислення загальної суми податків, накладених у поточному році для цілей Підрозділу (a) цього розділу, податки на майно на території, доданій до політичного підрозділу з попереднього року, і на нові поліпшення, які не оподатковувалися в попередньому році, виключаються. Під час обчислення загальної суми податків, накладених у попередньому році для цілей Підрозділу (a) цього розділу, податки, накладені на нерухоме майно, яке не оподатковується підрозділом у поточному році, виключаються.\n(c) Легіслатура загальним законом вимагає, щоб з урахуванням обґрунтованих винятків власнику майна було надіслано повідомлення про переоцінку його майна та обґрунтовану оцінку суми податків, яка була б накладена на його майно, якби загальна сума податків на майно для підрозділу не була збільшена відповідно до будь-якого закону, прийнятого згідно з Підрозділом (a) цього розділу. Повідомлення має бути надіслано до початку процедур, передбачених Підрозділом (a)."
 constitution_text_article_4_subsection_18_tooltip:0 "ФІНАНСУВАННЯ ЕКСТРЕНОЇ ДОПОМОГИ"
 constitution_text_article_4_subsection_18_modifier_tooltip:0 "Випуск заводів: §G+10.00%§!\nПасивний дохід кришок: §R-3.0§!"
 ### Article 5 - has 3
 constitution_text_article_5_subsection_19:0 "(a) Кожна особа, яка не підпадає під жодну з дискваліфікацій, передбачених Розділом 1 цієї статті або законом, прийнятим відповідно до цього розділу, яка є громадянином Сполучених Штатів і є резидентом цього Штату, вважається кваліфікованим виборцем; за умови, однак, що перш ніж запропонувати проголосувати на виборах, виборець повинен зареєструватися, але така вимога щодо реєстрації не повинна вважатися кваліфікацією виборця у значенні терміна «кваліфікований виборець», як він використовується в будь-якій іншій Статті цієї Конституції щодо будь-якого питання, крім кваліфікації та права голосувати на виборах.\n(b) Легіслатура може дозволити заочне голосування.\n(c) Привілей вільного виборчого права захищається законами, що регулюють вибори та забороняють під загрозою адекватних покарань будь-який неправомірний вплив на виборах з боку влади, підкуп, заворушення або іншу неналежну практику."
 constitution_text_article_5_subsection_19_tooltip:0 "ВИБОРЧЕ ПРАВО ЧОЛОВІКІВ"
 constitution_text_article_5_subsection_19_modifier_tooltip:0 "Стабільність: §G+1.00%§!"

 constitution_text_article_5_subsection_20:0 "(a) Незважаючи на будь-яке інше положення цієї Конституції, Легіслатура може приймати закони та забезпечувати метод реєстрації, включаючи час такої реєстрації, дозволяючи будь-якій особі, яка має право голосувати в цьому Штаті, за винятком вимог щодо місця проживання в межах округу чи району, як викладено в Розділі 2 цієї Статті, голосувати за (1) вибірників Президента та Віце-президента Сполучених Штатів і (2) усі посади, питання або пропозиції, за які мають голосувати всі виборці по всьому цьому Штату.\n(b) Незважаючи на будь-яке інше положення цієї Конституції, Легіслатура може приймати закони та забезпечувати метод реєстрації, включаючи час такої реєстрації, дозволяючи будь-якій особі (1) яка має право голосувати в цьому Штаті, за винятком вимог щодо місця проживання за Розділом 2 цієї Статті, і (2) яка проживала будь-де в межах цього Штату щонайменше тридцять (30) днів до Загальних Виборів у рік президентських виборів, і (3) яка була кваліфікованим виборцем в іншому штаті безпосередньо перед переїздом до цього Штату або мала б право голосувати в такому іншому штаті, якби залишилася там до таких виборів, голосувати за вибірників Президента та Віце-президента Сполучених Штатів на цих виборах.\n(c) Незважаючи на будь-яке інше положення цієї Конституції, Легіслатура може приймати закони та забезпечувати метод реєстрації, включаючи час такої реєстрації, дозволяючи заочне голосування за вибірників Президента та Віце-президента Сполучених Штатів у цьому Штаті колишнім резидентам цього Штату (1) які переїхали до іншого штату, і (2) які відповідають усім кваліфікаціям, за винятком вимог щодо місця проживання, для голосування за вибірників Президента та Віце-президента в цьому Штаті на момент виборів, але надані таким чином привілеї виборчого права діють лише протягом такого періоду часу, який дозволив би колишньому резиденту цього Штату виконати вимоги щодо місця проживання для голосування у своєму новому штаті проживання, і в жодному разі не більше двадцяти чотирьох (24) місяців. "
 constitution_text_article_5_subsection_20_tooltip:0 "ВИБОРЧЕ ПРАВО ЖІНОК"
 constitution_text_article_5_subsection_20_modifier_tooltip:0 "Стабільність: §G+1.00%§!"

 constitution_text_article_5_subsection_21:0 "Коли вибори проводяться будь-яким округом, або будь-якою кількістю округів, або будь-яким політичним підрозділом Штату, або будь-яким політичним підрозділом округу, або будь-яким визначеним районом, який зараз або надалі буде описаний і визначений в межах Штату, і який може включати або не включати міста, села чи муніципальні корпорації, або будь-яким містом, містечком чи селом, з метою випуску облігацій або іншого надання кредиту, або витрачання грошей чи прийняття на себе будь-якого боргу, лише кваліфіковані виборці Штату, округу, політичного підрозділу, району, міста, містечка чи села, де проводяться такі вибори, мають право голосувати."
 constitution_text_article_5_subsection_21_tooltip:0 "ВИБОРЧЕ ПРАВО МУТАНТІВ"
 constitution_text_article_5_subsection_21_modifier_tooltip:0 "Стабільність: §G+1.00%§!"

