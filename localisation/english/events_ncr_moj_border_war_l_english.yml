l_english:
NCR_MOJ_border_war.1.t:0 "Кампанія проти Братства в Мохаве"
NCR_MOJ_border_war.1.d:0 "Після того, як ми розчистили територію від рейдерів, здавалося, що Мохаве повністю в руках Республіки. Але Братство, ймовірно, чинитиме опір нашим спробам встановити повний контроль над регіоном."
NCR_MOJ_border_war.1.a:0 "Найняти місцеві каравани для наступу."
NCR_MOJ_border_war.1.b:0 "Вербувати місцеві ополчення для боротьби на нашому боці."
NCR_MOJ_border_war.1.c:0 "Покладатися виключно на наші війська."
NCR_MOJ_border_war.1_tt:0 "§YЯкщо Братство Мохаве вирішить прийняти бій:§!\n"
NCR_MOJ_border_war.1_tt_2:0 "§YЯкщо Братство Мохаве вирішить відступити:§!\n"

NCR_MOJ_border_war.2.t:0 "НКР розпочинає наступ"
NCR_MOJ_border_war.2.d:0 "НКР не збирається дозволяти нам зміцніти без нових сутичок. Наші розвідники помітили великі скупчення військ НКР у Мохаве, і, схоже, вони готуються до масштабної кампанії проти нас."
NCR_MOJ_border_war.2.a:0 "Відбити атаку всіма наявними засобами!"
NCR_MOJ_border_war.2.b:0 "Відступити в ізоляцію."

NCR_MOJ_border_war.3.t:0 "Братство відступає"
NCR_MOJ_border_war.3.d:0 "Дізнавшись про наш запланований наступ із донесень своїх розвідників, Братство Мохаве відвело війська далі в Гідден Веллі. Хоча вони й уникнули битви з нами, їхній боягузливий відступ ясно демонструє Мохаве, що справжня сила тепер — Республіка."
NCR_MOJ_border_war.3.a:0 "Боягузи!"

NCR_MOJ_border_war.4.t:0 "Перемога над Братством"
NCR_MOJ_border_war.4.d:0 "Наша рішучість розбити війська Братства увінчалася успіхом — принаймні поки що. Незважаючи на те, що їм стало відомо про наш напад, Братство вирішило зустріти нас у бою — і було знищене в перехресному вогні. Ймовірно, це похитне їхню рішучість у майбутньому."
NCR_MOJ_border_war.4.a:0 "І справедливо!"

NCR_MOJ_border_war.5.t:0 "Братство відбиває атаку"
NCR_MOJ_border_war.5.d:0 "Дізнавшись про наші плани заздалегідь, війська Братства були готові й зустріли наш наступ. Сили, які ми зібрали в цьому регіоні, де наша присутність слабка, виявилися недостатніми для перемоги. \nНа жаль, ця атака обернулася проти нас і була сприйнята як ознака відновлення Братства після їхнього тривалого відступу."
NCR_MOJ_border_war.5.a:0 "Це їм не допоможе в довгостроковій перспективі."

NCR_MOJ_border_war.6.t:0 "Поразка від НКР"
NCR_MOJ_border_war.6.d:0 "Незважаючи на всі наші зусилля з відбиття атаки, організованої місцевими військами під егідою НКР, наші приготування виявилися недостатніми. Ми зазнали значних втрат і змушені знову відступити, хоч цього разу — на меншу відстань.\n\nВиступ проти чужинців до повного відновлення, можливо, був помилкою. Наша славетна відновна кампанія — Довгий Марш — вселила надію в наших прихильників, але тепер у їхні серця закралася тінь сумніву."
NCR_MOJ_border_war.6.a:0 "Ми відновимось і знову здобудемо довіру народу."

NCR_MOJ_border_war.7.t:0 "Перемога над НКР"
NCR_MOJ_border_war.7.d:0 "Викликати наступ НКР виявилося правильним рішенням. Зібрані ними на місці війська не були готові до того, що ми дізнаємось про напад заздалегідь — і були розбиті, ставши застереженням для інших ватажків війни, що напад на нас буде дуже дорого коштувати.\n\nЧужинці лише довели, що недооцінюють нас як супротивника, а Народна Республіка знову набирає силу."
NCR_MOJ_border_war.7.a:0 "Політична влада виростає зі ствола гвинтівки."

NCR_MOJ_border_war.8.t:0 "Сутичка з партизанами Братства"
NCR_MOJ_border_war.8.d:0 "Обидві сторони — і ми, і війська Братства — ще не оговталися після попереднього наступу, але зосередження військ біля кордону знову розпалило конфлікт. Окрім місцевих ополчень і ватажків, ми розглядаємо можливість перекидання підкріплень.\n\nХоча це, можливо, не дасть нам змоги остаточно знищити загрозу Братства, це стане важливою ідеологічною перемогою, демонструючи, що ми не дозволимо їм розширювати вплив."
NCR_MOJ_border_war.8.a:0 "Ми повинні провести межу зараз!"
NCR_MOJ_border_war.8.b:0 "Ми не можемо дозволити собі ще одну сутичку."

NCR_MOJ_border_war.9.t:0 "Поразка в [From.GetName]"
NCR_MOJ_border_war.9.d:0 "Попри наші зусилля показати, що Братство не зможе поширити свій вплив за межі притулку, ми не змогли виділити достатньо ресурсів для перемоги в конфлікті на кордоні з [From.GetName].\n\nПартизанська тактика Братства поступово почала брати гору, і врешті ця кампанія стала провалом у спробі показати, що ситуація під нашим контролем. Якщо їхня сила зростатиме й надалі, Братство може перетворитися на справжню загрозу."
NCR_MOJ_border_war.9.a:0 "Непокоїть..."

NCR_MOJ_border_war.10.t:0 "Перемога в [From.From.GetName]"
NCR_MOJ_border_war.10.d:0 "Після низки дрібних сутичок на околицях наших територій, конфлікт із НКР почав складатися на нашу користь. Хоча постійне напруження виснажило наші війська й постачання, зусилля були виправдані.\n\nХоча рішучих битв і не було, ми здобули повільну, але впевнену перемогу, що укріпила віру в нашу справу й знову розпалила полум’я революції."
NCR_MOJ_border_war.10.a:0 "Цього ніхто не забуде!"

NCR_MOJ_border_war.11.t:0 "Поразка в [From.GetName]"
NCR_MOJ_border_war.11.d:0 "Наша спроба вести непрямий конфлікт із зрослою присутністю НКР виявилася катастрофою. Чужинці були рішучішими, ніж ми очікували, ймовірно, розуміючи, наскільки серйозним буде удар по нашій репутації. Хоча наша армія тимчасово в безпеці й може відновитися, ця поразка не пройшла непоміченою серед інших відділень Братства, і розповіді про неї швидко розлетілися."
NCR_MOJ_border_war.11.a:0 "Революція ще жива!"

NCR_MOJ_border_war.12.t:0 "Перемога в [From.From.GetName]"
NCR_MOJ_border_war.12.d:0 "Наші зусилля зупинити загрозу з боку Братства увінчалися успіхом. Їхні партизанські кампанії у відповідь на нашу зрослу військову присутність не врахували нашої рішучості зупинити їх. Цей прояв сили зруйнував репутацію Братства в Мохаве й водночас зміцнив нашу."
NCR_MOJ_border_war.12.a:0 "Сподіваймося, вони це запам’ятають."

NCR_MOJ_border_war.13.t:0 "Сутичка з армією НКР"
NCR_MOJ_border_war.13.d:0 "Хоч ми й досі не відновилися після попереднього наступу, чужинці, схоже, посилюють свою присутність поблизу наших кордонів. Очевидно, вони хочуть показати, що знову тримають нас у кліщах і що наші попередні зусилля були марними. Ми не можемо дозволити людям у це повірити."
NCR_MOJ_border_war.13.a:0 "Ми не можемо витрачати час на відновлення."

NCR_MOJ_border_war.14.t:0 "Перемога в Мохаве"
NCR_MOJ_border_war.14.d:0 "Хоч кампанія й була важкою, ми зрештою витіснили Братство Мохаве назад у Гідден Веллі й міцно закріпили контроль над більшістю Мохаве. Це велика перемога для Республіки."
NCR_MOJ_border_war.14.a:0 "Перемога за нами!"

NCR_MOJ_border_conflict_initiate_incident:0 "Інсценувати інцидент на кордоні з [From.From.GetName]"
NCR_mojave_campaign:0 "Кампанія в Мохаве"
NCR_mojave_campaign_desc:0 "Після масової різанини 38 громадян НКР руками рейдерів у тому ж році, ми повинні вжити заходів для захисту наших людей у небезпечних пустках Мохаве. За даними нашої розвідки, не лише рейдери мешкають у цих краях. Місто Вегас, зокрема, виявилося вражаюче цілим після Великої війни. Також відомо, що підрозділ Братства контролює довоєнну електростанцію під назвою «Геліос Один». Схоже, вони зовсім не мають бажання ділитися нею з нами. Перемогти їх буде непросто — ми не змогли виявити їхні основні бази, тому доведеться тиснути поступово, битва за битвою."