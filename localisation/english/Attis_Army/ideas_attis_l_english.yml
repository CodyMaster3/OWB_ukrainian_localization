  imo_hurricane_damage:0 "Іржа після великої бурі"
  imo_hurricane_damage_desc:0 "Десять років тому потужний тропічний шторм пронісся через Мексиканську затоку. Хоча більшість інших держав уже відновились, Залізні досі борються з іржею, що залишилась на їхніх інструментах і бойових машинах. Завдяки своїм шестерням вони, нарешті, досягли відчутного прогресу у відновленні своїх кузень – повне відновлення вже майорить на горизонті."

  imo_racree_infestation_1:0 "Навала ракрі"
  imo_racree_infestation_1_desc:0 "Орда здичавілих, радіаційно-пошкоджених ракрі прорила нори по всій нашій землі! Вони заважають повноцінному використанню нашого промислового простору."
