l_english:
  attis_army_remnants_idea:0 "Залишки Армії Аттіса"
  attis_army_remnants_idea_desc:0 "Армія Аттіса була однією з найбільших фракцій, що відкололась від Армії Творця. Очолювана колишнім генералом Творця, Аттіс був надзвичайно розумним і підступним супер-мутантом, якому майже вдалося підкорити весь Техас – однак підрозділ Братства зміг зірвати його плани, і армія розпалась на менші воєнні угруповання, що борються між собою за владу."

