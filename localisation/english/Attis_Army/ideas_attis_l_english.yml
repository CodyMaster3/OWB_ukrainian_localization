  uoa_election_troubles:0 "Проблеми з виборами"
  uoa_election_troubles_desc:0 "Останні вибори пройшли не так добре, як ми сподівалися. «Лейтенант Crusher» виступив із альтернативною платформою, що пропонувала інтеграцію з армією Шейла на заході. Хоча він і набрав меншість голосів, його виборці досі лояльні до нього до нестями. Чи не стане це загрозою нашій кампанії?"

