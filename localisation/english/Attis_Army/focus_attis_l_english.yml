l_english:

  attis_1:0 "Залишки Армії Аттіса"
  attis_1_desc:0 "Аттіс, як ніхто інший з мутантів, був амбітним."
  attis_2:0 "Наше Завдання"
  attis_2_desc:0 "Місія, яку він нам доручив, була для нього найважливішою."
  attis_3:0 "Наша Спадщина"
  attis_3_desc:0 "Ми досягли багато чого з часу його загибелі."

  mutant_industry:0 "Промисловість Мутантів"
  mutant_industry_desc:0 "Одним із перших і найважливіших аспектів сучасної держави — особливо в пустці — є здатність організовувати цілісні та керовані промислові зусилля. Те, що ми — нація велетенських зелених істот, нічого не змінює."

  mutant_fortifications_teams:0 "Батальйони Укріплень"
  mutant_fortifications_teams_desc:0 "Організація груп працездатних мутантів у батальйони для укріплень дозволить нам пришвидшити зведення форпостів уздовж найпроблемніших кордонів. До того ж, ці душі можна призвати до загальної служби."

  mutant_not_a_drop_to_drink:0 "І Краплі Не Напитися"
  mutant_not_a_drop_to_drink_desc:0 "Хоча вихід до узбережжя забезпечує нас водою, майже вся вона — непридатна для пиття. Але з будівництвом портів і верфей ми зможемо підтримувати флот."

  mutant_red_ones_go_faster:0 "Червоні Літають Швидше"
  mutant_red_ones_go_faster_desc:0 "Ігнорувати авіацію — необачно. Облаштування злітних смуг, ангарів і запуск нових військових заводів дозволить нам охопити небо й не втратити панування в повітрі."

  mutant_workshops:0 "Мутантські Майстерні"
  mutant_workshops_desc:0 "Фабричні робітники-мутанти мають унікальні потреби й переваги. Побудова цивільної інфраструктури, де вони можуть виготовляти будівлі та споживчі товари, створить сталевий хребет нашої економіки."

  mutant_sized_tools:0 "Інструменти Під Розмір Мутантів"
  mutant_sized_tools_desc:0 "Інструменти для звичайних людей часто ламаються у наших руках. Злегка змінені проєкти й стандартизація дозволять нашим працівникам отримати надійні засоби для побудови кращого майбутнього."

  mutant_arms_factories:0 "Збройові Заводи Мутантів"
  mutant_arms_factories_desc:0 "Збройні лінії Старого Світу не пристосовані для зброї належного розміру. Ми повинні створити свої заводи, які зможуть задовольнити потреби армії, вдосконаленої ВПЕ."

  mutant_air_defense:0 "Будівництво Проти Повітря"
  mutant_air_defense_desc:0 "Можна будувати все, що завгодно, але одна бомба здатна знищити майстерню на тижні. Сітка зеніток забезпечить захист наших об’єктів навіть без переваги в небі."

  mutant_mining_operations:0 "Гірничі Операції Мутантів"
  mutant_mining_operations_desc:0 "Мутанти мають ідеальну статуру для шахт: сильні спини, високі, тягають вагу без поту. Ми з легкістю розколемо техаський ґрунт і добудемо його скарби."

  mutant_power:0 "Зелена Енергія"
  mutant_power_desc:0 "Електрика — критичний ресурс. Щоб забезпечити живлення для осель і підприємств, ми маємо будувати вітропарки й відновити старі реактори. Не Гуверська дамба, але світло й тостер будуть працювати."

  mutant_wells:0 "Добре Там, Де Колодязь"
  mutant_wells_desc:0 "Вода з узбережжя й річок — радіоактивна. Але артезіанська з глибин — майже чиста. Мутантам «гостра» вода не шкодить, але для торгівлі й нормалів краще копати чисту."

  mutant_manufacturing:0 "Електронне Виробництво"
  mutant_manufacturing_desc:0 "На відміну від води й металу, електроніку не витягти з ґрунту. Навіть прості схеми потребують спецфабрик — нові проєкти якраз на це і спрямовані."

  mutant_behemoths_of_industry:0 "Велетні Індустрії"
  mutant_behemoths_of_industry_desc:0 "Ми нарешті створили сучасну економіку — від видобутку до виробництва цивільного й воєнного. Наші суперники позеленіють... ще більше, ніж ми."

  mutant_scavenging:0 "Мутантський Скарбошук"
  mutant_scavenging_desc:0 "У руїнах Старого Світу — безліч артефактів, складніших за все, що ми робимо. Навіть коротке дослідження допоможе зрозуміти, як це відтворити."

  mutant_scavconstructionvehicles:0 "Вивчити Будтехніку"
  mutant_scavconstructionvehicles_desc:0 "Секрет старосвітського будівництва — у спеціалізованих машинах. Якщо ми їх розберемо, зможемо створити власних металевих тяглових коней."

  mutant_scavtanks:0 "Імпровізовані Танки"
  mutant_scavtanks_desc:0 "Будь-що можна перетворити на бронетехніку, якщо навісити на нього досить броні. Трохи кмітливості й чужих креслень — і ми змайструємо великі та страшні танки."

  mutant_scavenging_2:0 "Розширити Скарбошук"
  mutant_scavenging_2_desc:0 "Наші скарбошуки вже дають плоди! Більше транспорту, більше матеріалів. І з обіцянкою небезпечної зброї серед руїн — ще більше мутантів кидають фронт заради знахідок."

  mutant_scavenging_support:0 "Вивчити Спецобладнання"
  mutant_scavenging_support_desc:0 "У пустці сотні унікальних речей, що показують складність воєн Старого Світу. Хоч їх і недостатньо для масового постачання, їх вистачить для дослідження та використання як загальне спорядження."

  mutant_scavenging_weapons:0 "Повернути Покинуту Дакку"
  mutant_scavenging_weapons_desc:0 "Чим багата пустка, і що ми любимо найбільше — дакка. Великі, малі, автоматичні, вибухові — нам усе підходить! Вони — хребет армії і причина копирсатися в руїнах. Новенька блискуча пушка — справжній трофей."

  mutant_scavenging_3:0 "Формалізувати Скарбошук"
  mutant_scavenging_3_desc:0 "Попри всю користь, наші пошуки в пустці досі залишались стихійними — без стандартів і процедур. Тепер, коли ми притягуємо шукачів і дістаємо технологічні дива з руїн, настав час упорядкувати ці зграї ривучих скарбошукачів у щось цілісне й дієве."

  mutant_scavenging_navy:0 "Витягнути Кораблі"
  mutant_scavenging_navy_desc:0 "Аттіс ніколи не вважав мутантів морською нацією, та ми можемо підняти старі корабельні уламки і відновити з них бодай щось. Із їхніх роз’їдених остовів ми навчимось будувати більші й зліші човни — здатні панувати на хвилях."

  mutant_scavenging_air:0 "Обчистити Аеродроми"
  mutant_scavenging_air_desc:0 "Авіація — складна річ навіть для звичайних людей, а для мутантів, що вдвічі більші — й поготів. Та нація, що має повітряні сили, має й перевагу у війні. Ми повинні розібрати старі зразки літаків і використати це знання для створення власних."

  mutant_scavenging_4:0 "Завершити Програму Скарбошуку"
  mutant_scavenging_4_desc:0 "Наші зусилля з пошуку знань і ресурсів у пустках дали результати у всіх наукових галузях. Ми досягли висот і глибин, небачених раніше. Скарбошукач став новою, гордою кастою мутантського суспільства, що несе нам легендарні скарби Старого Світу."

  mutant_scavenging_6_civ:0 "Цивільна Спеціалізація"
  mutant_scavenging_6_civ_desc:0 "Тепер, коли ми маємо ефективну силу для обшуку пусток, постає питання — будувати світ чи підкорювати? Відповідь проста — ми повинні спрямувати зусилля на відбудову світу згідно нашого бачення."

  mutant_scavenging_5_war:0 "Войовнича Спеціалізація"
  mutant_scavenging_5_war_desc:0 "Маючи дієву силу скарбошукачів, ми мусимо вирішити: зцілення чи підкорення? Відповідь очевидна — ми використаємо здобуте, щоб підкорити цей світ!"

  shale_follow_in_attis_footsteps:0 "Стежкою Аттіса"
  shale_follow_in_attis_footsteps_desc:0 "Аттіс був легендою серед мутантів. Один із великих генералів Майстра — титан, що повів армію на схід у пошуках майбутнього для людства. Він загинув у Корпоративному Сховищі — та завершив свій похід із честю.\nШейл прагне одного: стати таким же героєм, яким був Аттіс."

  shale_garb_fit_for_a_general:0 "Обмундирування Генерала"
  shale_garb_fit_for_a_general_desc:0 "У нас є трохи кришок — витратимо їх на оновлення броні.\nЗрештою, вдягатися слід не на ту роботу, що маєш, а на ту, яку хочеш."

  shale_attis_era_training:0 "Тренування Часів Аттіса"
  shale_attis_era_training_desc:0 "Служба під Аттісом дала нам знання про його методи. Він проводив «буткемпи» на місяці — глибоко в печерах. Там мутанти їли все, що знайдуть. Тих, хто противився, відсівали. Коли все закінчувалося — залишалися лише найвірніші."

  shale_the_attis_born:0 "«Народжені Аттісом»"
  shale_the_attis_born_desc:0 "Аттіс привіз із заходу трохи маріпозької ВПЕ. Завдяки їй він створював «велетнів» — титанів з м’яса для завоювань. У нас залишилось її небагато — та ми маємо використати її!"

  shale_a_curious_purchase:0 "Дивна Купівля"
  shale_a_curious_purchase_desc:0 "Є трохи кришок — витратимо їх на цікавинку. Один торговець з Лоса пропонує нам апарат «Shop-Tec» — каже, зі Сховища! — Дивно..."

  shale_purchase_weapon_schematics:0 "Купити Креслення Зброї"
  shale_purchase_weapon_schematics_desc:0 "У терміналі Shop-Tec є старі креслення зброї — ми можемо їх купити й використати у нашій армії!"

  shale_purchase_fev:0 "Купити ВПЕ"
  shale_purchase_fev_desc:0 "Крім інформації, термінал також пропонує «послуги». Він може знайти для нас більше ВПЕ — якщо ми оплатимо таку послугу."

  shale_the_path_of_glory:0 "Шлях Слави"
  shale_the_path_of_glory_desc:0 "Шлях Слави — це доля супер-мутантів: завоювання, смерть і перемога. Багато хто приймає, що наша раса — приречена. Але Аттіс... він ніби бачив щось інше — еволюцію замість небуття."

  sha_taking_a_piece_of_the_pie:0 "Прибуткова Можливість"
  sha_taking_a_piece_of_the_pie_desc:0 "ТАЗ зараз у вразливому стані. Чому б не вкусити шматок, поки вони зайняті?"

  shale_put_the_kibosh_on_los:0 "Покінчити з Лосом"
  shale_put_the_kibosh_on_los_desc:0 "Лос — місце смерті Аттіса. Темне місто божевільних гуль-єретиків. Якби Аттіс жив — їх би вже не було. Виправимо це."

  shale_conquering_carbon:0 "Підкорення Карбона"
  shale_conquering_carbon_desc:0 "Карбон — невелике грішне містечко, де люди животіють. Його вже знищували — зробимо це знову."

  shale_revive_the_raider_matrons:0 "Відродити «Матрон»"
  shale_revive_the_raider_matrons_desc:0 "Колись була група рейдерів, які підтримали Аттіса — жорстока зграя «Матрони». Ми можемо їх відродити — вони, може, кращі союзники, ніж Карбон."

  shale_sell_off_the_spoils_of_war:0 "Продати Трофеї Війни"
  shale_sell_off_the_spoils_of_war_desc:0 "Помилкою Аттіса було те, що він не знищив дух цього міста. Ми повинні вигнати людей, продати їх у рабство й стерти їхню культуру з коріння."

  shale_sanctify_the_city:0 "Освятити Місто"
  shale_sanctify_the_city_desc:0 "Люди Лоса — не союзники. Вони божевільні. Ми повинні зробити це місце —НАШИМ—."

  shale_puppet_the_church_of_the_lost:0 "Маріонетка Церкви Загублених"
  shale_puppet_the_church_of_the_lost_desc:0 "Колись це місто було більш... зговірливим. Їхній колишній лідер Блейк готовий був підкоритися. Ми повинні зробити так, щоб нові теж погоджувались на наші умови."

  shale_the_secret_vault_ruins:0 "Руїни Корпоративного Сховища"
  shale_the_secret_vault_ruins_desc:0 "Ми нарешті тут — місце останнього спочинку Аттіса. І це —...\nЦе повний безлад. Вся споруда в руїнах. Але щось корисне все ж залишилось..."

  shale_encrypted_information:0 "Зашифрована Інформація"
  shale_encrypted_information_desc:0 "На жаль, не все, що ми знайшли тут, дійсно корисне — більшість це зашифрована довоєнна корпоративна інформація, що не має практичного значення в наш час. Та спроби її зламати — чудове тренування навичок шифрування. Навіть якщо дані нам непотрібні — користь залишається."

  shale_automated_training_holograms:0 "Автоматизовані Тренувальні Голограми"
  shale_automated_training_holograms_desc:0 "Неймовірна знахідка! Ми виявили голографічний передавач для тренування охорони сховища. Тепер можемо тренувати власні війська!"

  shale_partial_supply_recovery:0 "Зброя з Останньої Операції"
  shale_partial_supply_recovery_desc:0 "Ми знайшли невелику кількість зброї — явно створеної для супер мутантів. Ймовірно, це залишки останнього загону Аттіса перед його загибеллю."

  shale_bobbleheads_galore:0 "Навала Боблхедів!"
  shale_bobbleheads_galore_desc:0 "Здається, на кожен уламок припадає по два десятки блискучих боблхедів. Дехто каже, що це «талісмани на вдачу» — що б це не означало."

  shale_an_unfortunate_reunion:0 "Нещасна Зустріч"
  shale_an_unfortunate_reunion_desc:0 "Цей верхній рівень — ще не вся споруда. Нижче є ще щось — якась глибша частина сховища! Можливо, саме там ми дізнаємось, що сталося з Аттісом... або навіть знайдемо його останки?"

  shale_defending_against_the_monster:0 "Оборона від Технократа"
  shale_defending_against_the_monster_desc:0 "Нам доповіли, що сюди наближається тиран. Ми не можемо дозволити їй зірвати наші славні завоювання! Поки ми не вирішимо це — жодних битв із рештою армії!"

  sha_make_three_way_war_harder_to_do:0 "§RВибір цього фокуса зробить неможливим завершення «Тристоронньої Війни за Єдність» до завершення війни на заході.§!"

  shale_planning_against_the_paladins:0 "Плани Проти Паладинів"
  shale_planning_against_the_paladins_desc:0 "Урешті-решт наші завоювання повинні охопити і схід — землі «Паладинів». Підготуємось до майбутньої війни з ними."

  shale_striking_eden:0 "Викорінити Едем"
  shale_striking_eden_desc:0 "Коли справу з останками Аттіса завершено... час продовжити завоювання. Скарлет надто довго заважає нам об’єднати мутантів — стоїть вартовою в своєму мутованому лісі. Пора показати їй, що таке гнів титана."

  shale_fruits_of_our_labour:0 "Плоди Нашої Праці"
  shale_fruits_of_our_labour_desc:0 "Кажуть, цей ліс виростив «Ріс» — дивакуватий Шифр, що мріяв про рай на Землі. До речі, таку ж мрію мав і Аттіс. Скуштуємо ж його плоди!"

  shale_tame_the_beasts:0 "Приручити Звірів"
  shale_tame_the_beasts_desc:0 "Не все в цьому лісі — добре. Скарлет його захищала не просто так. Тут живуть чудовиська й демони. Покажемо їм справжніх королів джунглів — і додамо їхню силу до нашої."

  shale_unite_the_army:0 "Тристороння Війна за Єдність"
  shale_unite_the_army_desc:0 "Час зібрати розбиту армію. Показати братам — хто головний."

  shale_ethos_of_the_army:0 "Етос Армії"
  shale_ethos_of_the_army_desc:0 "Тепер, коли армію об'єднано, можна працювати над її покращенням — використаємо найкраще з того, що принесли підкорені вороги."

  shale_ancient_techniques_of_the_ironmongers:0 "Стародавні Техніки Айронмонгерів"
  shale_ancient_techniques_of_the_ironmongers_desc:0 "Айронмонгери стали справжніми майстрами ковальської справи — надто буквально сприйнявши наказ Аттіса закріпитися в південних фабриках. Ми використаємо їхню силу для просування наших танків!"

  shale_mysteries_of_the_spores:0 "Таємниці Спор"
  shale_mysteries_of_the_spores_desc:0 "Іноді я чую, як Ріс шепоче мені серед лісу Едему. Я намагаюся не думати про це — але голос важко витіснити. Ці загадки, ці слова — ми збережемо їх із собою."

  shale_the_dreams_of_unity:0 "Мрії Єдності"
  shale_the_dreams_of_unity_desc:0 "Кітс був гідною особою — вірив у справжню віру Дітей Кафедрали. Вчення Майстра мали зерно істини — ми не дамо їм згаснути."

  shale_faith_of_the_army:0 "Віра Армії"
  shale_faith_of_the_army_desc:0 "Армії потрібна одна віра, одна — ідея. Аттіс учив Шляху Слави. А чому навчимо ми?"

  shale_strength_in_supremacy:0 "Сила в Перевазі"
  shale_strength_in_supremacy_desc:0 "Супер мутанти повинні успадкувати світ. Люди марнували свій шанс. Тепер він наш. Ми знайдемо секрет розмноження. Ми знайдемо секрет безсмертя. Ми знайдемо шлях до влади й правління!"

  shale_strength_in_unity:0 "Сила в Єдності"
  shale_strength_in_unity_desc:0 "Вчення Майстра поведуть нас далі. Ми не повинні забути Його — Того, хто привів нас у цей світ. Це Його дар — бережімо його."

  shale_strength_in_insanity:0 "Сила в Безумстві"
  shale_strength_in_insanity_desc:0 "Раціональність, порядок, логіка — усе це не працює в пустелі. Блейк мав рацію — єдина істина світу це завоювання, руйнування й невпинний хаос. Світ уже загинув — давайте зруйнуємо його ще раз!"

  shale_the_road_of_conquest:0 "Шлях Завоювань"
  shale_the_road_of_conquest_desc:0 "Час перевірити себе проти найкращих, кого має Техас. Ось де ми доведемо, що гідні спадщини Аттіса — або загинемо, намагаючись."

  shale_cerberus_unity_unleashed:0 "§!§!§RСправжня Єдність§!"
  shale_cerberus_unity_unleashed_desc:0 ""

  shale_cerberus_mexico:0 "§!§!§RЗемля Титанів§!"
  shale_cerberus_mexico_desc:0 ""

  shale_cerberus_west:0 "§!§!§RДомени Мара§!"
  shale_cerberus_west_desc:0 ""

  shale_cerberus_the_masters_legacy:0 "§!§!§RСпадщина Майстра§!"
  shale_cerberus_the_masters_legacy_desc:0 ""

  shale_cerberus_the_final_flame:0 "§!§!§RОстаннє Полум’я§!"
  shale_cerberus_the_final_flame_desc:0 ""

  shale_purchase_completed_or_refused_tt:0 "Остаточну покупку Шейл має бути або завершено, або відхилено."

  imo_the_steelworks:0 "Сталеварні"
  imo_the_steelworks_desc:0 "Коли Джаггернаут отримав наказ від Аттіса захопити південне індустріальне серце Техасу — він сприйняв це дуже серйозно. Побити місцевих рейдерів було просто... Та ніхто з супер мутантів не очікував, наскільки сильно вони «закохаються» в це місце. Стільки металу! Стільки інструментів! Стільки РОЗВАГ! Айронмонгери зробили Сталеварні своїм домом — ідентичністю."

  imo_iron_flyers:0 "Залізні Літуни"
  imo_iron_flyers_desc:0 "Бути важким мутантом — це постійний страх падіння. А вже в небі — страх подвоюється! Та деякі майстри з Айронмонгерів домоглися успіхів у створенні «літунів» — чим вразили всіх!"

  imo_trained_mantis_gearjocks:0 "Навчені Мантиси-Гірджоки"
  imo_trained_mantis_gearjocks_desc:0 "У цехах Айронмонгерів великому мутанту важко швидко знайти потрібний інструмент. Саме тому ми використовуємо «гірджоків» — натренованих богомолів, які виконують роль помічників. Швидкі, слухняні й розумні, вони блукають гарячими цехами й приносять усе, що треба майстрам-ковалям."

  imo_building_the_perfect_war_machine:0 "Створення Ідеальної Військової Машини"
  imo_building_the_perfect_war_machine_desc:0 "Айронмонгери не люблять битися просто з даккою і сокирою. Їхня пристрасть — бойові машини. «Бойовагени» — величезні гусеничні монстри, які таранують ворога, маючи турелі зверху. Їм мало хто зможе протистояти!"

  imo_loud_engines:0 "Гучні Двигуни"
  imo_loud_engines_desc:0 "Ми навмисно робимо наші двигуни якнайгучнішими — щоб лякати ворогів. Кому потрібна скритність, коли ти в броні в три фути завтовшки?"

  imo_right_tool_for_da_job:0 "Правильний Інструмент для 'Цієї Справи"
  imo_right_tool_for_da_job_desc:0 "Завжди треба мати правильний інструмент. Іноді — ключ. Іноді — дриль. А іноді — трохи плоті для змазки механізмів..."

  imo_the_battlewagon:0 "Бойоваген"
  imo_the_battlewagon_desc:0 "Ми зібрали нову партію Бойовагенів! Ворог затремтить, коли побачить їх на полі бою!"

  imo_chase_them_down:0 "Впіймай Їх!"
  imo_chase_them_down_desc:0 "Кволі Ракрі гарно ховаються від наших Бойовагенів — та їхні короткі ніжки не допоможуть їм втекти на відкритому полі!"


  imo_blow_em_out_of_their_burrows:0 "Вибий Їх з Нір!"
  imo_blow_em_out_of_their_burrows_desc:0 "На відміну від інших дрібноти, Ракрі не живуть на поверхні! Вони риють нори й ховаються в землі.\nОдин із наших майстрів запропонував ідею... а що як кинути бум-палицю прямо в нору й виштовхати їх вибухом?"

  imo_raccoon_killin_guns:0 "Гвинтівки Проти Ракрі"
  imo_raccoon_killin_guns_desc:0 "М’яка шкура Ракрі легко пробивається потрібною кулею. Можемо стріляти здалеку — ще до того, як вони нас побачать!"

  imo_target_practice_against_the_taa:0 "Тренування на ТАЗ"
  imo_target_practice_against_the_taa_desc:0 "Зазвичай зібрати бойову групу для нападу на західні людські землі — складно... Але останнім часом там щось змінилось. Може, саме час здійснити рейд?"

  imo_crystal_city_ammo_factory:0 "Боєприпасний Завод Кристал-Сіті"
  imo_crystal_city_ammo_factory_desc:0 "Ми знайшли завод з виготовлення набоїв! Шкода, що більшість із них надто дрібні для наших дакк... Але деякі якраз підходять!"

  imo_huajillo_honey:0 "Мед Хуахільйо"
  imo_huajillo_honey_desc:0 "Ми знайшли дивний, збережений сік у банках. Нашим гірджокам він дуже «смакує» — наче стимулює їх працювати швидше!"

  imo_flames_of_the_forge:0 "Полум’я Горна"
  imo_flames_of_the_forge_desc:0 "Жар у горні — випробування для будь-якого мутанта. Але хто витримає — той стає сильнішим."

  imo_flesh_shredding_bullets:0 "М’якорвущі Кулі"
  imo_flesh_shredding_bullets_desc:0 "Обробивши кулі іржаво-кислотним покриттям, ми збільшуємо їхню ефективність проти м’яких цілей!"

  imo_heavy_duty_weapons:0 "Важке Озброєння"
  imo_heavy_duty_weapons_desc:0 "Більші, важчі, щільніші — така зброя служить довше!"

  imo_improved_shielding:0 "Покращене Бронювання"
  imo_improved_shielding_desc:0 "Більше плит! Ще! ЩЕ! ЩЕ!"

  imo_slimmed_chasis:0 "Полегшене Шасі"
  imo_slimmed_chasis_desc:0 "Хоча, декілька плит теж достатньо. Не хочемо стати повільними."

  imo_ach_tbh_puppet:0 "Цікавий Виклик"
  imo_ach_tbh_puppet_desc:0 "Металеві люди думають, що вони сильні? Ми їм покажемо!"

  imo_ach_no_shale:0 "Наш Шанс!"
  imo_ach_no_shale_desc:0 "Тепер, коли Шейл зник — північ не загрожує. Час йти на схід і випробувати наші іграшки на нових ворогах!"

  imo_unification_wars:0 "Війни за Об’єднання"
  imo_unification_wars_desc:0 "Інші залишки армії Аттіса на півночі поки нас не чіпають... Але це не триватиме вічно. Вони захочуть повернути нас до старого. Ми не здамо ковальні. Якщо потрібно — об'єднаємо армію самі!"

  imo_fort_stockton:0 "Форт Стоктон"
  imo_fort_stockton_desc:0 "Форт Стоктон має безліч ресурсів, потрібних нам. Шейл накопичив тут чимало зброї ще з часів Аттіса."

  imo_roads_through_the_forest:0 "Дороги Через Ліс"
  imo_roads_through_the_forest_desc:0 "Ліс на півночі заважає нам доставляти припаси! Треба пробити шлях крізь нього!"

  imo_austin_city_labs:0 "Лабораторії Остіна"
  imo_austin_city_labs_desc:0 "Кітс зберіг чимало корисного у цих лабораторіях. Можливо, щось підійде для наших Бойовагенів!"

  imo_trying_out_our_new_toys:0 "Випробування Іграшок"
  imo_trying_out_our_new_toys_desc:0 "Ми перевірили свою зброю на залишках армії Аттіса. Тепер можемо сміливо йти на південь. Настав час перейти через Ріо-Ґранде!"

  imo_attack_arm:0 "Знищити Дроїдних Хлопців"
  imo_attack_arm_desc:0 "Армія Мексики завжди бентежила Айронмонгерів. Їхні бойові машини такі малі — хто взагалі міг керувати тими «роботами»? Це божевілля!"

  imo_attack_taa:0 "Повне Завоювання ТАЗ"
  imo_attack_taa_desc:0 "Раніше ми відгризали шматки від ТАЗ. Тепер — час на повне завоювання!"

  imo_attack_rrg:0 "Велика Південна Війна!"
  imo_attack_rrg_desc:0 "Наш шлях війни не має кінця!"

  uoa_fulfilling_campaign_promises:0 "Виконання Передвиборчих Обіцянок"
  uoa_fulfilling_campaign_promises_desc:0 "Єдність Остіна — не диктатура. Ми поважаємо демократію! Саме тому Кітс що кілька років проводить вибори, щоб нагадати всім — чому він найкращий. Звісно, конкуренти зазвичай не ризикують виступати — важко тягатись із Кітсом!\nАле обіцянки були. І їх слід дотриматись."

  uoa_volunteers_for_lonestar:0 "Добровольці для Лоун Стара"
  uoa_volunteers_for_lonestar_desc:0 "Лоун Стару потрібна допомога! Надішлемо їм одного з наших генералів."

  uoa_volunteers_for_dallas:0 "Добровольці для Далласа"
  uoa_volunteers_for_dallas_desc:0 "Даллас потребує підтримки! Відрядимо туди нашого генерала."

  uoa_invest_into_sterility_research:0 "Інвестувати в Дослідження Стерильності"
  uoa_invest_into_sterility_research_desc:0 "Проблема стерильності мутантів — тяжкий тягар для всіх із розумом. Саме тому Аттіс і прийшов до Техасу. Ми обіцяли шукати вирішення — тож виконаймо ці обіцянки!"

  uoa_experimental_hormones:0 "Дослідження Гормональної Терапії"
  uoa_experimental_hormones_desc:0 "Організми мутантів не виробляють потрібних гормонів для народження дітей — мутація знищує ці функції. Якщо хочемо подолати стерильність — нам потрібна генно-гормональна терапія."

  uoa_study_pre_war_holotapes:0 "Вивчити Довоєнні Голотейпи"
  uoa_study_pre_war_holotapes_desc:0 "Америка до війни мала масу даних про народження й біологію. Ці знання можуть допомогти нам у нашому дослідженні."

  uoa_form_the_committee_for_super_mutant_survival:0 "Сформувати Комітет з Виживання Супер-Мутантів"
  uoa_form_the_committee_for_super_mutant_survival_desc:0 "Кітс не повинен очолювати цей проєкт вічно — на розгадку проблеми стерильності мутантів можуть піти десятиліття. Але завдяки делегуванню ми можемо гарантувати, що принаймні одна група науковців займатиметься цим у передбачуваному майбутньому!"

  uoa_human_mutant_integration_seminars:0 "Семінари з Інтеграції Людей і Мутантів"
  uoa_human_mutant_integration_seminars_desc:0 "Мутанти й люди не завжди ладнають — особливо в політичній атмосфері Далласа й Остіна. Ми маємо докласти зусиль, щоб подолати розкол між расами!"

  uoa_putting_plants_to_use:0 "Використати Рослини з Користю"
  uoa_putting_plants_to_use_desc:0 "Скарлет вже деякий час спостерігає за мутованими рослинами біля старого G.E.C.K. Різа — однак, у нас в Остіні досі трапляються шкідливі істоти, що докучають дітям. Приборкаймо ці істоти, щоб вони не стали серйозною проблемою!"

  uoa_fev_volunteer_pr_campaign:0 "PR-кампанія Добровільної Мутації ВПЕ"
  uoa_fev_volunteer_pr_campaign_desc:0 "Єдність Остіна, на відміну від інших груп супер-мутантів, не використовує примусову мутацію — ми практикуємо так звану «добровільну мутацію», де хворі, слабкі або охочі стати сильнішими можуть добровільно змінити своє тіло задля спільної справи! Ми повинні профінансувати PR-кампанію, яка заохотить людей ставати добровольцями!"

  uoa_invest_into_nightkin_support_programs:0 "Інвестиції в Програми Підтримки Тіней"
  uoa_invest_into_nightkin_support_programs_desc:0 "На цих виборах ми виступали з програмою підтримки менш представлених верств Остіна — зокрема, потайних найткінів. Почнімо інвестування й подивимось, чи зможемо ми допомогти цим заблукалим мутантам жити кращим життям в Остіні."

  uoa_prescription_stealth_boys:0 "Стелс-Бої за Рецептом"
  uoa_prescription_stealth_boys_desc:0 "Тіні — справді — потребують Стелс-Боїв для підтримання психічної стабільності. Контролюючи кількість та доступ до Стелс-Боїв, ми забезпечимо, щоб кожен, хто потребує, їх отримав!"

  uoa_rehabilitation_center_planning:0 "Планування Центру Реабілітації"
  uoa_rehabilitation_center_planning_desc:0 "Не всі Тіні можуть впоратись. Деякі з них уже втратили глузд. Але замість того, щоб відмахнутись від них, як від безнадійних — давайте розпочнемо проєкт створення центру реабілітації. Можливо, одного дня вони знову зможуть приєднатись до нас!"

  uoa_form_the_bureau_of_austin_affairs:0 "Створити Бюро Справ Остіна"
  uoa_form_the_bureau_of_austin_affairs_desc:0 "Створімо агентство, покликане захищати права найткінів! Тих, хто залежить від Стелс-Боїв, тих, хто збожеволів, і тих, хто блукає в дикій місцевості, слід врахувати, контролювати та забезпечити інструментами, які дозволять їм жити без загрози для себе чи інших."

  uoa_calls_for_unity:0 "Заклики до Єдності"
  uoa_calls_for_unity_desc:0 "Останнім часом лунають голоси, що настав час знову об’єднати залишки Армії Аттіса! Зрештою, якщо ми нічого не зробимо — одна з тих держав обов’язково захоче нас поглинути. Краще бити першим, ніж не бити взагалі, чи не так?"

  uoa_texan_integration_act:0 "Акт Інтеграції до Техасу"
  uoa_texan_integration_act_desc:0 "Тепер, коли ми об’єднали залишки Армії Аттіса, настав час інтегрувати Остін до складу Техасу. Зсередини штату ми зможемо краще поширювати наші ідеали дружби між мутантами та людьми, а також забезпечити виживання і безпеку Остіна."

  uoa_failure_of_the_union:0 "Промова «Провал Союзу»"
  uoa_failure_of_the_union_desc:0 "Великі мешканці Остіна! Скажіть мені — чому Техаський Економічний Союз нас підвів? Ми маємо бути рівними, але нас досі вважають громадянами другого сорту! Настав час відділитися й створити власну державу — незалежну від Техасу!"
  some_stuff_for_leaving_fucking_texas_or_something:0 "Якщо наші науковці залишать Техаський Економічний Союз, ми зможемо спрямувати їхні зусилля на дійсно важливі справи!\n"

  attis_crusher:0 "Повстання Crusher'а"
  attis_crusher_desc:0 "Кітс — ідіот, який хоче об'єднатися з нормалами та заведе нас у глухий кут. Він не має права правити нами!"

  draft_loyalists:0 "Мобілізувати Лоялістів"
  draft_loyalists_desc:0 "Повстаньте, брати та сестри, проти цього зрадника мутантського роду!"

  open_stashes:0 "Відкрити Таємні Сховища"
  open_stashes_desc:0 "Ми ретельно підготувалися до цього повстання. По всій нашій території розташовані численні тайники з припасами. Із початком бойових дій, ми скористаємось кожним із них."

  plea_for_help:0 "Заклик про Допомогу"
  plea_for_help_desc:0 "Шейл підтримував нас раніше й симпатизує нашій справі. Поки війська Кітса наступають, ми мусимо звернутись до його прихильників за добровольцями."

  seize_resources:0 "Захопити Ресурси"
  seize_resources_desc:0 "Під час війни наша армія повинна витиснути максимум із того, що можуть дати наші землі та народ. Для цього нам доведеться... 'реквізувати' додаткові ресурси в населення."

  battle_cry:0 "Бойовий Клич"
  battle_cry_desc:0 "Воїни! Настав час покласти край руйнівному правлінню Кітса!"

  crusher_victory:0 "Солодка Перемога"
  crusher_victory_desc:0 "Ми вийшли переможцями з цієї довгої й кривавої війни. Прихильники Кітса тікають до Техаського Братства та Лоун Стару, піджавши хвости. Але відпочивати зарано — попереду ще багато справ, а Crusher має зміцнити свою владу в Остіні."

  crushing_the_remnants:0 "Придушення Залишків"
  crushing_the_remnants_desc:0 "Здається, не всі наші громадяни поділяють тріумф Crusher’а. Дехто ставить під сумнів союз із Шейлом та самого Crusher’а! Ми мусимо покінчити з цим. Кожен зрадник буде публічно страчений."

  turning_normies:0 "Звільнити Нормалів"
  turning_normies_desc:0 "Кітс хотів жити поруч із цими виродками. Багато з них утекли, але деякі були достатньо дурними, щоб залишитись. Їм не пощастило."

  returning_the_favor:0 "Відплатити Добром"
  returning_the_favor_desc:0 "Шейл дуже допоміг нам під час повстання. Ми йому винні. Настав час віддати борг."

  plants_what_to_do:0 "Злі Рослини..."
  plants_what_to_do_desc:0 "Частина нашої території зайнята небезпечними мутованими рослинами. Ми маємо вирішити, що з ними робити. Якщо очистимо територію — отримаємо більше простору. Але деякі мутанти вважають, що їх можна приручити й використати на благо громадян."

  eradicate_plants:0 "...І Злі Мутанти"
  eradicate_plants_desc:0 "Це не обговорюється. Ці рослини буде знищено, а на вивільненій території побудують нові заводи."

  use_plants:0 "...Знайдуть Своє Застосування"
  use_plants_desc:0 "Один із наших нових радників каже, що знає, як приручити ці рослини й використати їх із користю. Якщо це спрацює — наші умови життя значно покращаться."

  nightkin_future:0 "Темніше за Ніч"
  nightkin_future_desc:0 "Кітс обіцяв найткінам рівні права. Багато з них утекли до Остіна, шукаючи кращого майбутнього. Тепер нам треба вирішити, що з ними робити."

  scatter_among_the_army:0 "Тіні Серед Нас"
  scatter_among_the_army_desc:0 "Якщо вони хочуть рівних прав — вони їх отримають. Ми можемо розподілити найткінів по наших дивізіях. Їхні навички маскування значно підвищать нашу розвідку противника."

  assemble_nightkin:0 "Тіні... До Збору!"
  assemble_nightkin_desc:0 "Потенціал найткінів занадто великий, щоб витрачати його на звичайні дивізії. Ми об’єднаємо їх і зробимо основою наших сил спеціальних операцій."

  united_warband:0 "Єдність У Військовій Орді"
  united_warband_desc:0 "Ми нарешті вирішили всі основні проблеми й об’єднали увесь Остін. Настав час зосередитися на майбутньому."

  loyal_commander:0 "Єдність"
  loyal_commander_desc:0 "Ми навіки в боргу перед Шейлом — без нього нам би не вдалося перемогти. Ми приєднаємось до нього й будемо битися пліч-о-пліч із братами за повернення Єдності."

  separate_way:0 "Амбіції Crusher'а"
  separate_way_desc:0 "Ми сплатили борг перед Шейлом. Наше майбутнє — у наших руках, і лише ми вирішимо, що найкраще для мутантського роду."

  cru_calls_for_unity:0 "Тристороння Війна за Єдність"
  cru_calls_for_unity_desc:0 "Настав час об’єднати цю роздроблену армію під проводом Crusher’а!"

  crusher_ethos_of_the_army:0 "Етос Армії"
  crusher_ethos_of_the_army_desc:0 "Ми маємо багатий досвід у вирішенні конфліктів (запитайте будь-якого людського поселенця на наших землях). Ми можемо застосувати ці знання до інших військових угруповань."

  crusher_ancient_techniques_of_the_ironmongers:0 "Залізні Ливарні"
  crusher_ancient_techniques_of_the_ironmongers_desc:0 "Творіння Залізоварів справді вражають. Ми відновимо їхні заводи й знову запустимо ці машини смерті — тепер на нашому боці."

  crusher_mysteries_of_the_spores:0 "Спалити Джунглі"
  crusher_mysteries_of_the_spores_desc:0 "Ми знову зіткнулися з цими мутованими рослинами. Але тепер ми знаємо, як з ними впоратись."

  crusher_the_dreams_of_unity:0 "Справжній Наступник Аттіса"
  crusher_the_dreams_of_unity_desc:0 "Хоч наші шляхи й розійшлися, Шейл залишився мудрим генералом і лютим воїном. Ми збережемо про нього пам’ять."

  attis_army_no_justify_tt:0 "§RКраїни з ідеєю §Y«Залишки Армії Аттіса»§! §Rне можуть оголошувати війну одна одній вручну й повинні використовувати цілі війни, отримані через національні фокуси.§!"
  attis_army_no_justify_idea_tt:0 "\nКраїни з цією ідеєю не можуть вручну виправдовувати війни одна проти одної та повинні використовувати цілі війни з національних фокусів."

  imo_raid_armageddon_station:0 "Рейд на Станцію Армагеддон"
  imo_raid_armageddon_station_desc:0 "Тепер, коли ми контролюємо Станцію Армагеддон, ми можемо прорвати її захист! Використаємо брухт і метал, щоб вдосконалити наші бойові машини!"

  has_at_least_1_unit_leader_tt:0 "Є щонайменше §Y1§! командир підрозділу."
  attis_unlock_border_war:0 "Відкриває рішення §YПрикордонної Війни§! за контроль над штатом."

  every_mexican_state:0 "Кожна територія в  §YМексиці§!"
  every_new_mexican_state:0 "Кожна територія в §YНью-Мексико§!"

  uoa_cant_join_tt:0 "§RМи не можемо розраховувати, що наші солдати битимуться пліч-о-пліч із супер-мутантами. Кітс має виграти цю битву сам.§!"

  uoa_cant_call_tt:0 "§RКультурні упередження Братства проти супер-мутантів заважають їм приєднатися до нашої війни!§!"

  shale_reunite_the_army_tt:0 "Ми порушуємо перемир’я з іншими залишками §YАрмії Аттіса§! і поновлюємо воєнні дії! Це негайно почне тристоронню війну між нами, §YЗалізоварами§! і §YЄдністю Остіна§!\n\n"

  every_texan_state:0 "Кожен §YТехаський§! штат"

  shale_path_of_glory_tt:0 "\nВідкриває доступ до гілок фокусів §Y«Мутантська Промисловість»§! і §Y«Мутантське Скарбництво»§!."

  attis_army_taa_raids:0 "Прикордонні Війни з ТАЗ"
  attis_taa_border_war:0 "Завоювання ТАЗ"
  attis_taa_border_war_desc:0 "Тепер, коли ТАЗ більше не захищає Республіка Ріо-Ґранде, ми нарешті можемо урвати від них кілька шматків!"