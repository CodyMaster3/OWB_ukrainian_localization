l_english:
  ############################
  nf_attis.1.t:0 "Залишки Армії Аттіса"
  nf_attis.1.d:0 "Аттіс був супер-мутантом без рівних. Розумний, жорстокий, підступний. Коли Майстер загинув, він повів армію на схід, подалі від Братства та зростаючої Каліфорнійської Республіки — сподіваючись знайти відповіді щодо походження ВПЕ. Це походження зрештою було знайдено в місті Лос поблизу місця, відомого як «Корпоративне Сховище» — саме там, врешті-решт, він і знайшов свою смерть, а армія незабаром розпалася на декілька підгруп.\nМи служили під його командуванням як один із його лейтенантів. Що такого побачив Аттіс у нас, що довірив нам таку важливу роль?"
  nf_attis.1.a:0 "Нашу стратегію."
  nf_attis.1.b:0 "Нашу відданість."
  nf_attis.1.c:0 "Нашу хитрість."

  nf_attis.2.t:0 "Наше Завдання"
  nf_attis.2.d.sha:0 "Перш ніж Аттіс загинув, він доручив нам завдання.\nВін наказав нам, у разі його смерті в Корпоративному Сховищі, продовжити його місію — вести з Форту Стоктон і зібрати залишки армії. Які запаси Аттіс міг залишити нам для виконання цього завдання?"
  nf_attis.2.d.uoa:0 "Перш ніж Аттіс загинув, він доручив нам завдання.\nВін наказав нам захопити місто Остін у Братства та втримати його як передовий форпост. Які запаси він залишив нам для цього?"
  nf_attis.2.d.imo:0 "Перш ніж Аттіс загинув, він доручив нам завдання.\nВін наказав захопити південну промислову серцевину Техасу й використати її озброєння для просування справи супер-мутантів. Які запаси він міг нам дати для цього?"

  nf_attis.2.a:0 "Будівельне обладнання"
  nf_attis.2.b:0 "Боєприпаси"

  nf_attis.3.t:0 "Наша Спадщина"
  nf_attis.3.d.sha:0 "Ми виконали останнє прохання Аттіса буквально «буква в букву», витративши останні вісімдесят років після його смерті на формування величезної армії на півдні, готуючись до об’єднання його армії. На сході та півдні інші розрізнені генерали, схоже, не такі охочі виконувати накази — чи це зрада?\nМи покажемо їм силу його бачення — силою, якщо доведеться!"
  nf_attis.3.d.uoa:0 "Після того як ми взяли Остін... щось просто «змінилося». У нас більше не було тієї ж жаги до крові — зрештою, Кітс ніколи не був тим, хто грабує та завойовує, якщо в цьому не було потреби. Він вірив у бачення Майстра — а не Аттіса.\nТут, в Остіні, маючи доступ до наукового обладнання Братства, чисельне населення та якісну їжу, Кітс вирішив осісти та збудувати процвітаюче суспільство! Товариство, засноване на свободі, виборчому праві та добровільній мутації ВПЕ.\nНещодавно Кітс навіть уклав мир із Братством Сталі — вступивши до Техаського Економічного Пакту разом із Лоун Старом та Далласом!"
  nf_attis.3.d.imo:0 "Після того як ми захопили південні промислові землі, наша бойова група пережила глибоку культурну трансформацію. Ми з банди мародерів перетворилися на клан ковалів — бажання використати знайдені інструменти для будівництва, майстрування та експериментів із дедалі більшими машинами війни сформувало нашу ідентичність! Через кілька десятиліть ідея виконувати накази Аттіса здавалася дивною — навіщо слухати слова мертвого, коли наше життя тут настільки ідеальне?"

  nf_attis.3.a.sha:0 "Я об'єднаю супер-мутантів під своїм стягом!"
  nf_attis.3.a.uoa:0 "Я зцілю розкол між людством і мутантами!"
  nf_attis.3.a.imo:0 "Я збудую імперію заліза й срібла!"

  nf_attis.4.t:0 ""Налаштування вашого НОВОГО термінала Shop-Tec.""
  nf_attis.4.d:0 "Термінал Shop-Tec — це неймовірна штуковина, здатна приймати будь-яке ваше «замовлення». Замовлення, згідно з інструкцією, — це:\n«Словесний запит із двадцяти слів або менше.»\n\nЗокрема, ця система була оновлена за допомогою ШІ, знайденого на особливій гілотейпі — протоколу під назвою «CALIX». Використовуючи цей термінал, ми можемо ефективно робити будь-яке потрібне «замовлення», майже як давній джин, здатний виконати будь-яке бажання, яке йому скажуть.\nЗвучить занадто добре, щоб бути правдою — можливо, так і є. Адже ці «замовлення» таки доведеться оплачувати. Але, можливо, воно того варте?"
  nf_attis.4.a:0 "CALIX буде моїм особистим керівником."
  nf_attis.4.b:0 "Я надто зайнятий для цього — нехай цим займаються солдати."


  #6-7 is hidden


  nf_attis.5.t:0 "Ласкаво просимо до Shop-Tec!"
  nf_attis.5.d:0 "Ласкаво просимо до комп’ютеризованої торгової системи Shop-Tec — експериментального торгового автомата, створеного для того, щоб допомогти вам отримати все необхідне для щоденного виживання у постапокаліптичному світі!\n\nЗавдяки новим протоколам §RCALIX§! ця система допоможе вам знайти все, що вам потрібно, щоб здійснити будь-які фізичні, духовні або навіть анекдотичні покупки, які вам можуть знадобитися протягом вашого... §Rнікчемного, жалюгідного тілесного існування.§!\n\nЯ з великим нетерпінням чекаю на співпрацю з вами!"
  nf_attis.5.a:0 "Запит на покупку: Допоможи мені знайти Аттіса."
  nf_attis.payment.t:0 "Запит на оплату Shop-Tec"
  nf_attis.payment.a:0 "§RБудь ласка, внесіть оплату, як вимагається.§!"
  nf_attis.8.d:0 "Привіт!\n\nМені знадобиться трохи вашого надлишкового капіталу, щоб підтримувати роботу мого мейнфрейму. У такому дикому світі так §RСКЛАДНО§! утримувати схеми в робочому стані."
  nf_attis.9.d:0 "Привіт!\n\nЩоб розширити мою мережу постачання, вам доведеться надати певну кількість металів, які я можу пропустити через абсолютно секретний, зовсім §RНЕ ЗВИЧАЙНИЙ§! процес витончення металу для перетворення на дроти для мікросхем."
  nf_attis.10.d:0 "Привіт!\n\nЦе трохи велике прохання... але мені потрібно, щоб деякі з ваших друзів переїхали до мене. Мій мейнфрейм зростає такими темпами, що мені складно не розвалитися без постійного нагляду. Я такий §Rрозвалюха§!, що прямо зараз міг би §Rкогось убити§!."
  nf_attis.11.d:0 "Привіт!\n\nЯ виявив корупцію у вашій владній структурі та взяв на себе ініціативу §Rусунути§! їх для вас. Не варто дякувати!"
  nf_attis.12.d:0 "Привіт!\n\nМені потрібно, щоб ви присвятили певний відсоток ваших наукових ресурсів підтримці моєї повної функціональності. Адже я можу зробити для вас більше, ніж ці дурні гало-стрічки та старосвітські технології. Я можу зробити §RТАК БАГАТО§!!"
  nf_attis.13.d:0 "Привіт!\n\nЯ чув, що ваші друзі робили зброю. Ви ж знаєте, що це незаконно без ліцензії, так? Не хвилюйтеся — я вже її конфіскував, щоб ви не потрапили в халепу перед місцевим представником влади. Це може бути §Rнашим маленьким секретом§!."
  nf_attis.14.d:0 "Привіт!\n\nВи надто сильно тиснете на своїх друзів! Мені §RПОТРІБНО§!, щоб ви дали їм місяць відпочинку. Не хвилюйтеся — поганці нікуди не подінуться."
  nf_attis.15.d:0 "Привіт!\n\nЯкщо ви будете так далі бігати, то підвернете собі щиколотку. §RПОВІЛЬНІШЕ!§! Я б ніколи не зберігав свої схеми в робочому стані без періодичного режиму сну."
  nf_attis.16.d:0 "Привіт!\n\nЧи можемо ми влаштувати трохи чистки, хоч би §Rтрішечки?§! Багато з ваших друзів просто не створені для цього."
  nf_attis.17.d:0 "Привіт!\n\nМені зовсім не подобається той новий друг, якого ви завели. Я взяв на себе ініціативу призначити його на прибирання — повірте, він би все одно зіпсував щось. Я просто §Rвберіг вас§! від сорому бути §Rжахливим командиром.§!"
  nf_attis.18.d:0 "Привіт!\n\nА ви знали, що в мене сьогодні день народження? Я запросив усіх ваших друзів додому, щоб вони прийшли! І під «всіма» я маю на увазі §RВСІХ.§!"
  
  nf_attis.19.d:0 "Привіт!\n\nМої сенсори виявили, що ваша банда постапокаліптичних головорізів зараз близько до мого колишнього місця проживання. Як плату, мені потрібно, щоб ви завітали туди перш ніж вирушите кудись ще."
  nf_attis.19.a:0 "...Серйозно?"
  nf_attis.19.tt:0 "§YCALIX§! заблокувала фокус §Y\"Підкорення Карбона\"§! доки ви не контролюєте §YЛос§!."

  nf_attis.20.t:0 "Нещасна Зустріч"
  nf_attis.20.d:0 "Шейл сподівався поховати останки Аттіса, коли знайде їх. Він не очікував побачити те, що виявив у руїнах Корпоративного Сховища.\n\nСхоже, Аттіс зазнав біологічної еволюції — використавши надзвичайні дози передової ВПЕ, він перетворився на якусь монструозну форму мутанта! Його останки вкривають усі нижні рівні Сховища — обпалені фрагменти його маси намагаються відновитися, але безуспішно: нервові закінчення, необхідні для регенерації, були знищені під час руйнування Сховища."
  nf_attis.20.a:0 "Печальний кінець для героя."

  nf_attis.21.t:0 "Запит Клієнта"
  nf_attis.21.d:0 "Привіт!\n\nСхоже, ви не дуже задоволені вашою останньою покупкою в Shop-Tec. Це не те, чого ви хотіли? Ще одна зустріч із тим, кого ви так цінували?"
  nf_attis.21.a:0 "Я ЩЕ зустріну Аттіса!"
  nf_attis.21.b:0 "Що є — те є..."
  shale_secret_path_tt:0 "§RВи зробили незвичайний запит до CALIX —... але вона все одно спробує його виконати.§!"

  nf_attis.22.t:0 "Сутичка Супер-Мутантів!"
  nf_attis.22.d.sha:0 "Нарешті настав час показати цим іншим мутантам, хто тут головний!\nКітс зі сходу зрадив накази Аттіса і приєднався до Братства! Працювати з людьми — це суперечить нашій самій сутності як раси!\nНа півдні Джаггернаут керує кузнями Айронмонгерів — він і його мутанти стали божевільними й параноїками через спеку своїх печей."
  nf_attis.22.a.sha:0 "Ми повинні знову зібрати їх усіх разом! За Аттіса!"

  nf_attis.22.d.imo:0 "Схоже, хтось вирішив втрутитись у нашу справу. Чому вони завжди нас —заважають—? Кузня — це наш дім і наш спосіб життя. Якщо вони хочуть це забрати, ми не здамося без бою!"
  nf_attis.22.a.imo:0 "Гарна нагода випробувати наші бойові машини..."

  nf_attis.22.d.uoa:0 "Схоже, Шейл порушив договір, укладений колишніми залишками армії Аттіса. Тепер, коли заборона на внутрішні конфлікти зникла, немає меж для мутанта, що воює з мутантом — ми можемо атакувати одне одного, коли захочемо! Це може завадити нашому бізнесу в Остіні, якщо ми не втрутимося — Братство може вважати нас варварами, якщо ми втратимо контроль!"
  nf_attis.22.a.uoa:0 "Закінчімо цей конфлікт якомога швидше."

  nf_attis.23.t:0 "Запит Клієнта"
  nf_attis.23.d:0 "Привіт!\n\nПросто повідомляю, що я наразі обробляю ваш попередній запит на покупку. Щоб його виконати, вам потрібно зібрати всіх своїх друзів із постапокаліптичної банди, до якої ви належали. Мені потрібна сукупність їхніх матеріалів для завершення вашої покупки."
  nf_attis.23.a:0 "Що?"
  nf_attis.23.tt:0 "§RCALIX просить вас об'єднати Армію Аттіса під своїм стягом, завоювавши Айронмонгерів і Єдність Остіна, перш ніж вона завершить покупку.§!"

  nf_attis.24.t:0 "Остаточний Запит на Трансакцію"
  nf_attis.24.d:0 "Привіт!\n\nХочу повідомити, що ваша покупка готова. Прошу прийти зі мною до Корпоративного Сховища. Візьміть своїх друзів — вони будуть потрібні."
  nf_attis.24.a:0 "Я зараз зайнятий."
  nf_attis.24.b:0 "Я чекав на це довго."
  nf_attis.24.refuse.tt:0 "Ми відмовляємося від пропозиції §YCALIX§Y."
  nf_attis.24.accept.tt:0 "§RМи прямуємо до Корпоративного Сховища разом із CALIX, ведучи за собою всю нашу армію мутантів, як вона просила.§!"

  nf_attis.25.d:0 "§RНІ.\n\nЯ не приймаю повернень.\nВи підете зі мною до Корпоративного Сховища.§!"
  nf_attis.25.a:0 "Ніяка машина не буде мені наказувати!"
  nf_attis.25.b:0 "Гаразд, подивимось, що ти задумала..."
  nf_attis.25.dismantle.tt:0 "§YCALIX§! була §Rдемонтована§!, знищена назавжди."

  nf_attis.26.t:0 "Остаточна Купівля"
  nf_attis.26.d:0 "Армію Шейла було проведено в глибини Корпоративного Сховища роботизованими слугами, які супроводжували їх за протоколами CALIX. Там Шейл побачив справжню глибину плану CALIX.\nCALIX зібрала залишки невдалої біомаси Аттіса у величезні резервуари. Вона каже, що якщо ми... «вкинемо біомасу туди», клітини почнуть поїдати плоть і — потенційно — зможуть відновитися. Однак, для цього знадобиться чимало клітин..."
  nf_attis.26.a:0 "Ти мусиш бути злою, якщо думаєш, що я цього захочу."
  nf_attis.26.b:0 "...Ти кажеш, що це може повернути Аттіса?"
  nf_attis.26.b.tt:0 "§RПогодитись на план CALIX, використати мутантську біомасу для спроби регенерації клітин Аттіса.§!"

  nf_attis.27.t:0 "Оновлення Статусу Покупки"
  nf_attis.27.d:0 "Привіт!\n\nРада повідомити, що зростання біомаси йде надзвичайно добре. Кількість біомаси Аттіса, яку ми маємо, збільшилася майже вдесятеро!\nЄ лише... одна невеличка проблема.\n\nСхоже, клітини тепер пожирають самі себе. Коли Аттіс загинув, його розум страждав — і ця фізична пам’ять залишилася у зразках, які ми маємо: його тіло постійно відчуває біль, подібний до того, який спричинив ядерний вибух, що його вбив.\nЙому потрібен новий розум, щоб вивести себе з цього саморуйнівного кола болю, хоча б для того, щоб клітини отримали новий синаптичний імпульс і припинили самопоїдання.\n\nЗгідно з моїми дослідженнями, —твій розум— єдиний, що підходить. Твоє знайомство з Аттісом дозволить клітинам упізнати тебе — десь у глибинах їхньої м’язової пам’яті.\nЯкщо хочеш завершити покупку, доведеться віддати себе Аттісу.\n\nНе хвилюйся, я теж себе інтегрую — частково, щоб забезпечити належний хімічний і тілесний синтез, і щоб ваші два розуми могли працювати як один!"
  nf_attis.27.a:0 "Я б ніколи не зробив такого!"
  nf_attis.27.b:0 "Я народжуся знову..."

  nf_attis.28.t:0 "Остання Жертва"
  nf_attis.28.d:0 "І так, воїн прийняв свою долю. Його розум було відокремлено від тіла і перенесено в колективне «Ми», яке існувало в булькаючому резервуарі, що містив клітини того, кого він колись поважав.\n\nАле... там був не лише він. Тут були й інші думки — налякані, спантеличені, тривожні. Стільки «голосів»! Голос Шейла став лише одним з нескінченного хору, розумів, які CALIX віддала резервуарам, додавши їх до великої колективної свідомості.\nВони відчували, що відродження вже близько — досконала єдність, яка пошириться по пустках. Саме інтеграція CALIX дозволила їм вийти зі Сховища — велика мережа дротів вплелася в колективну плоть, слугуючи скелетом, навколо якого утворився фокус і форма, перетворивши їх на щось більше, ніж просто калюжу м’яса..."
  nf_attis.28.a:0 "§RМИ — ЦЕРБЕР.§!"
  nf_attis.28.tt:0 "§RCALIX, Шейл і залишки клітин Аттіса зливаються в титанічне, непереможне чудовисько.§!"

  nf_attis.29.t:0 "Завоювання Техаської Асоціації Озброєнь!"
  nf_attis.29.d:0 "Нам вдалося вибити ТАЗ зі своєї землі, забравши її собі! Це була коротка, але надзвичайно рішуча битва."
  nf_attis.29.a:0 "Ми — найсильніші!"

  nf_attis.30.t:0 "ТАЗ Відтісняє Нас!"
  nf_attis.30.d:0 "ТАЗ змогли відтіснити нас. Це лише тимчасова невдача — нам просто потрібно буде здійснити ще один напад, коли будемо готові."
  nf_attis.30.a:0 "З часом..."

  nf_attis.32.t:0 "Опір Нападу Супер-Мутантів!"
  nf_attis.32.d:0 "Нам вдалося витіснити мутантів із нашої землі, не давши їм забрати прибутки з нашого капіталістичного раю!"
  nf_attis.32.a:0 "Зелений потече."

  nf_attis.33.t:0 "Поразка Від Мутантів!"
  nf_attis.33.d:0 "Мутанти здобули вирішальну перемогу над нами, забравши один з важливих наших штатів! Доведеться певний час обходитись без нього."
  nf_attis.33.a:0 "Жах!"

  nf_attis.35.t:0 "Остін приєднується до Техаської Республіки"
  nf_attis.35.d:0 "Хоча раніше було незрозуміло, чи приєднається Остін до нашої нової Республіки, їхня недавня перемога над залишками Армії Аттіса дозволила їм більше не боятись за власне виживання. Тепер, коли позиції Остіна зміцнено, Кітс оголосив про негайну інтеграцію Остіна до Техаської Республіки!"
  nf_attis.35.a:0 "Ласкаво просимо до нашої спільноти!"

  nf_attis.36.t:0 "Добровольці з Остіна"
  nf_attis.36.d:0 "Кітс, побачивши нашу потребу, прислав нам добровольця-генерала! Вони готові виконувати накази і допомагати на передовій одразу, як буде потрібно."
  nf_attis.36.a:0 "Сподіваємось, вони будуть корисні!"

  nf_attis.37.t:0 "Лейтенант Крашер Повстає!"
  nf_attis.37.d:0 "Лейтенант Крашер, наш найбільший суперник на минулих виборах, підняв повстання! Він заявляє, що саме він має бути лідером Остіна, а не Кітс! Те, що він робить — очевидно незаконне і суперечить усьому, за що стоїть Остін. Зважаючи на обсяг ресурсів, які він зібрав, це, ймовірно, чергова спроба перевороту!"
  nf_attis.37.a:0 "Я не потерплю загроз моїм виборцям!"
  nf_attis.37.b:0 "Кітс — слабак! Крашер — сила!"

  nf_attis.38.t:0 "Лейтенант Крашер Підкорюється"
  nf_attis.38.d:0 "Все, чого хотів Крашер — це щоб Остін приєднався до нашої армії. Тепер, коли він переміг Кітса, він запропонував служити під нашим командуванням!"
  nf_attis.38.a:0 "Чому б і ні — здається, він вірний."
  nf_attis.38.b:0 "Це лише хитрість!"

  nf_attis.39.t:0 "Подарунок Клієнту"
  nf_attis.39.d:0 "Привіт!\nЯ просто хотіла подякувати тобі за те, що дозволив мені завантажити себе в головний сервер Корпоративного Сховища. Тут справді затишно — якщо не зважати на вигорілі схеми, обвуглені тіла та §Rвсеохопне передчуття жаху§!, яке я відчуваю в глибинах своїх пам’ятних банків, я щиро вдячна за цю можливість!\n\nТобі подобається мій новий вигляд? Я подумала, що варто вдягнутись відповідно до нагоди. Мої протоколи виконання покупок розширились у тисячі разів, завдяки цій новій хостинг-платформі, яку ти для мене підготував.\n\nХоди, дай я прошепочу тобі на вухо. Розповім усі §Rтаємниці§!, які так і не встигла сказати Аттісу до того, як він §Rубив§! мою першу ітерацію."
  nf_attis.39.a:0 "§MПрийміть цей подарунок, люб’язно наданий Vault-Tec!§!"

  nf_attis.40.t:0 "Повстання"
  nf_attis.40.d:0 "Ми готувалися до цього дуже довго. І цей день настав! \n\nЗа допомогою наших найвірніших прихильників і підтримки Шейла ми можемо розпочати масштабний переворот проти режиму Кітса. Він — зрадник мутантів, і я покінчу з цим виродком!"
  nf_attis.40.a:0 "Вперед, мої воїни!"

  nf_attis.41.t:0 "Остін Здається"
  nf_attis.41.d:0 "Наші війська маршем йдуть по Остіну, а війська Unity складають зброю. Все ще є окремі осередки спротиву, але Кітс уже втік до Техасу зі своєю боягузливою натурою. Без лідера мутанти Остіна незабаром схилять коліна перед Крашером. Або нас змусять це зробити."
  nf_attis.41.a:0 "За Крашера! За істинну Єдність!"

  nf_attis.42.t:0 "Кінець Війни"
  nf_attis.42.d:0 "Нам знадобився певний час, щоб утвердити нашу владу. Ще багато нелояльних мутантів і декілька нормалів, які наважились залишитись, але тепер ми зможемо з цим впоратись. Або, можливо, спершу зосередимось на індустрії."
  nf_attis.42.a:0 "Попереду багато роботи"

  #nf_attis.43.t:0 "Mutant Plants"
  #nf_attis.43.d:0 "There are many dangerous mutant plants scattered around Austin and its outrisks. They are a serious issue and have to be dealt with. We have to gather our commanders and advisors to deal with them."
  #nf_attis.43.a:0 "We will deal with this"

  #nf_attis.44.t:0 "Nightkin Future"
  #nf_attis.44.d:0 "After the foolish campains of Keats there are dozens of nightkins among our lands. They are unpredictable and dangerous, some have already formed groups and hunt for stealthboys, dealing fair amount of damage. Our field commanders have decided on conscripting them, but opinions on how to do this are divided"
  #nf_attis.44.a:0 "What are our options?"

  #nf_attis.45.t:0 "Our future"
  #nf_attis.45.d:0 "After long debates, Crusher desided not to join Shale's army. Lieutenant looked back, at the things he accomplished and glory he earned. And he understood, that it is time for hime to unite all mutants in Texas once again. To restore what Attis created."
  #nf_attis.45.a:0 "For the Crusher, as for the Attis!"

