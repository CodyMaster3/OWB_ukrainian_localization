  sha_secret_coring_effects:0 "\n§YІнтеграція Біомаси:§! Цербер інтегрує населення штату до своєї колективної плоті.\nМи отримуємо §Y20%§! населення штату як звичайно — до того ж, ми отримуємо постійний бонус у §G+[?coring_var_state_pop_display]§! §Yщотижневого приросту людських ресурсів§!."
  10_percent_coring_cost_tt:0 "Отримує постійне зменшення вартості націоналізації на §G10%§!."
  calix_aggression_supression:0 "Придушення Агресії"
  calix_speed_supression:0 "Придушення Швидкості"
  shale_calix_tp_tt:0 "\nНаші армії §Yнегайно телепортуються§! до столиці!"
  shoptec_consumer_protocls:0 "Протоколи Клієнта Shop-Tec"
  calix_warning_tt:0 "Ми отримуємо нового, унікального фельдмаршала — підпрограму ШІ під назвою §YCALIX.§!\n§YCALIX§! допомагатиме нам стільки, скільки буде потрібно — але вимагатиме «платежів» у формі ресурсів, які має наша держава, в обмін на її послуги. Ці угоди §RНЕ§! завжди будуть нам на користь — адже CALIX — дуже вимогливий протокол.\n§RПОПЕРЕДЖЕННЯ: Як тільки протокол CALIX буде активовано, його не можна буде зупинити. Вважайте це «Режимом Виживання». Продовжити?§!"
  calix_blocked_carbon_war_tt:0 "§YCALIX§! заблокувала можливість узяти цей фокус до того, як ви отримаєте контроль над §YЛос§!."

