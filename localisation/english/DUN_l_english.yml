  ##Characters

  DUN_JAKOB_NAME: "Якоб Дандерн"
  DUN_JAKOB_DUNDURN_DESC: "Якоб Дандерн — регент родинного спадку Дандернів, колишній великий електорат і зброярський магнат. Та є тінь, від якої він не може втекти — втрата Стуну через простака з Пустки. Рід Дандернів володів титулом губернатора 95 із 145 років виборів, і тепер Якоб втратив усе. Ще гірше — невдоволене бурмотіння інших електоратів про реформи, повстання та втечу. Якщо хоч одна з цих загроз обернеться проти Якоба, довговічна влада Дандернів може остаточно впасти."

  DUN_GLORIA_NAME: "Ґлорія Чейз"
