  dun_pariahs_odyssey: "Добрі справи генерала Парії Гокмун"
  dun_pariahs_odyssey_desc: "                  "

  dun_pariah_stokes_the_fires: "Роздути полум’я"
  dun_pariah_stokes_the_fires_desc: "Слухайте. Усі ми знаємо, як усе є. Соломон грається у солдатики у своїй високій башті, удаючи, ніби йому є діло до когось із нас. \n\nНам ще далеко до перемоги, то, може, досить ходити навкруги? Я задовбалась бути запасною. Я служила електорату двадцять років – і, до біса, робила це добре. І я не дам себе списати якогось дурню в поношеному костюмі. \n\nГра змінилась. Час змінитись і нам."

  dun_preparations_are_being_made: "Зусилля з вербування мають бути в розпалі!"

  dun_war_efforts: "Підштовхнути до воєнного стану"
  dun_war_efforts_desc: "«Безхатченко? Не щастить у житті? Хочеш нового початку? «Дандерн Ориджиналс» забезпечать тобі все й більше! Запишись вже сьогодні!» – Газета Дандерна \n\nУ такі моменти, як два роки тому, я думаю: «куди поділися всі патріоти?» А потім розумію – нікуди вони не поділись. Просто не мали, у що вірити. А тепер – ось я. І народ знову має на кого рівнятись. Якщо це не натхнення для поеми – то що тоді?"

  dun_preparations_made: "Люди запалені й готові до бою!"

  dun_pariah_gets_a_cigar: "Парія з цигаркою"
  dun_pariah_gets_a_cigar_desc: "Бляха-муха."

  dun_had_a_smoke: "Парія мала перекур!"

  dun_i_wanna_watch_a_kingdom_fall: "Я хочу побачити падіння королівства"
  dun_i_wanna_watch_a_kingdom_fall_desc: "Або все, або нічого."

  dun_revisiting_duck_mountain: "Ласкаво просимо додому, Паріє Гокмун"
  dun_revisiting_duck_mountain_desc: "Колись я була гірською качкою. Ще в дитинстві... Народилась у тому лайні. Думаю, після п’ятисотого бою з тіньоїдом і останнього манітобського пива мені просто набридло все це. І от я знову тут, звідки починала. \n\nА знаєте що?\n\nЦе того варте."

  dun_renewing_old_vows: "Оновлення старих обітниць"
  dun_renewing_old_vows_desc: "Між мною та герцогинею колись було... щось. Просто постійні зіткнення на полях, одна вилазка за іншою – і раптом вона сама до мене підійшла. Думаю, це був один із найбожевільніших моментів мого життя – така красива й сильна жінка залицялась до мене? Моє его досі не відійшло. \n\nВона так і не перестала писати мені, відколи дізналась, що я в Дандерні. Якщо чесно, я іноді й сам відповідав... Але великі зобов’язання – не моє. Ми друзі, зрештою. І вона – єдина з усіх, у кого я впевнений: ножа в спину не встромить. Може, їй бракує хисту до самостійного правління, але якщо я її триматиму в тонусі – вона буде чудовою королевою. Кращою за Ґанна, однозначно."

  dun_send_yorkton_a_gift: "Надіслати Йорктону «подарунок»"
  dun_send_yorkton_a_gift_desc: "Я завжди вважав цього виродка скалкою в дупі світу – просто черговий старий самозакоханий покидьок на шляху до могили. Прямо як я, якщо подумати. \n\nШкода, мій психотерапевт каже, що его в мене більше, ніж глузду. А давай не будемо нагадувати йому, що трапилось із його лицарями?"

  # ideas
  cpf_spectral_order: "Спектральна Капела"
  cpf_spectral_order_desc: "Спектральна Капела – це товариство елітаріїв з Плезантдейлу. Всі вони зазнали однакових мутацій від червоного папоротника – масової дестабілізації та повторної стабілізації. Пересуваються зграями, бубонять поезію, ковтають наркотики.\n\nОстаннім часом їм сняться пророчі сни – образ жінки, яку вони кличуть Святою Локе, і каплиця зцілення, що нагадує покинуту споруду неподалік міста..."

