  ##Events

  nf_dun.1.t: "Чейз проти Дандерна: людяність"
  nf_dun.1.d: "ДАНДЕРН: А що з вашими металевими людьми, пані Чейз? Ви справді думаєте, що народ Дандерна хоче, щоби саме вони стали його наступниками? Я не знаю жодного, хто охоче поступився б ходячому скелету, не кажучи вже про те, щоби залишити свою плоть і кров задля такого перетворення! \n\nЧЕЙЗ: Моя праця не про «наступництво», містере Дандерн. Вона про піднесення. Людське тіло вразливе, недосконале для жахів сучасного світу. За кожним великим розумом — десять, що гинуть через все, що за сценою. Фонове випромінення. Завірюхи. Люди з Бенк-Енду. Це спільні загрози, містере Дандерн — вороги, яких ми можемо здолати тілом. \n\nДАНДЕРН: І навіщо, скажіть мені, ми маємо зрікатися плоті заради цього? Хіба ми не можемо примусити до «еволюції», про яку ви говорите? Невже віра в тіло — це вже фантастика? \n\nЧЕЙЗ: Ви самі себе спростовуєте, намагаючись грати роль Бога, містере Дандерн. На відміну від ваших ідей, моя праця не заперечує єдність: у кінці кінців, це ж ваші головорізи дошкуляють лікарням доктора Тобоґана та нишпорять у лісах Плезантдейла, чи не так?"
  nf_dun.1.a: "Дебати тривають"

  nf_dun.100.t: "Чейз проти Дандерна: людяність (продовження)"
  nf_dun.100.d: "ДАНДЕРН: У Дандерні ми віримо, що всі люди рівні. Супермутанти й феї — це потвори, не гідні навіть побіжного погляду. Пані Чейз, мені не слід це казати, але хай буде на запис: ці істоти точно послужили народові Дандерна краще, ніж ви. Народ потребує дій, а не слів. \n\nЧЕЙЗ: Ваш захист водночас і смішний, і осудний. Я дійшла висновку, що будь-яке справжнє цивілізоване меценатство має бути вільне від жорстокості та позбавлене жадібності. Ваші ідеї — це не подолання людської помилки, а спроба створити безпомилкову істоту. Це не служіння добру — це зарозумілість, думка, що ви і ваші послідовники маєте право стояти вище за пригноблених. Коли я говорю про піднесення, я маю на увазі рівність: майбутнє людства — не в поламаних клітинах і безумній науці, а в обережному вдосконаленні людської природи. \n\nДАНДЕРН: Ваші слова сповнені іронії. Людина, що йде за тим, хто досяг безсмертя, — це людина, яка заслуговує на майбутнє. Щоб побачити провидця, потрібен провидець, пані Чейз. І на відміну від вас, я вірю, що люди здатні відрізнити правду від брехні. Чому людина має зрікатися плоті задля пустого марення, якщо може просто підсилити себе? Зберегти душу — значить зберегти совість. Це основний закон природи."
  nf_dun.100.a: "Аргументи Якоба сподобалися аристократії"
  nf_dun.100.b: "Ідеї піднесення пані Чейз перемогли"

  nf_dun.4.t: "Привид Дандерна"
  nf_dun.4.d: "У кожного є своя історія про Кетчера. \n\nЙого ім’я стало пересторогою для дорослих: «думай, що кажеш і на чиї чоботи стаєш — Кетчер може й не звернути уваги». Завжди в масці. Завжди в русі. Озброєний легше, ніж звичайний найманець, але втричі смертельніший. Кетчер бере дорого, але його удари ніколи не виявляються марними. Він прибирає чисто — табори, кімнати, зали залишаються мертвотно тихими.\n\nЯк мовиться на старій вивісці: «Брудні справи — Дандерн дешево»."
  nf_dun.4.a: "Я б не хотів опинитися в нього на прицілі!"

  nf_dun_catcher_tooltip: "§RКетчера можна задіяти в рішеннях для підвищення покори та зниження опору в окупованих регіонах.§!"

  nf_dun.5.t: "Згадаймо профспілку"
  nf_dun.5.d: "Рік був 2243-й. Хоча рейки вже сягали кожного кутка електорату — частково це були лише відновлені уламки довоєнної мережі — їхній стан і близько не відповідав тому, що ми маємо сьогодні. Після вечері з родиною Чейз у Плезантдейлі, він чекав на станції чотири години, поки приїхав його потяг. \n\nЦе були найважчі чотири години в його житті. Тієї ж ночі він зателефонував кожному заводському магнату електорату, обіцяючи подвоїти їхні статки своєю новою пропозицією — і що вони зробили? Засміялися йому в обличчя. \n\nТож він сказав собі: «Я зроблю це сам». Він видав нове оголошення для кожного працівника й працівниці Дандерна: «подвой свою зарплату, подвой свою платню — долучайся до спілки вже сьогодні!» \n\nМенше ніж за місяць він мобілізував народ у нову залізничну профспілку. І навіть сьогодні Електоральна залізнична спілка діє — прокладає рейки всюди, куди може, щоб ти міг потрапити туди, де маєш бути, коли маєш там бути!"
  nf_dun.5.a: "Хай живе наша праця!"

  nf_dun.6.t: "Як злодії вночі"
  nf_dun.6.d: "Минулої ночі невідомі громили із силою пробилися до конвою психіатричного закладу й викрали чимало пацієнтів — серед них і бабусю Гайкоруха. \n\nПопри обмежену інформацію, кращі мутанти вже отримали завдання розслідувати інцидент. Усі наступні дані передаватимуться безпосередньо доброму доктору."
  nf_dun.6.a: "Хто б міг на таке зважитися?"

  nf_dun.7.t: "Роузвуд просить вступу"
  nf_dun.7.d: "Фундація Роузвуд звернулась до нас з проханням долучитися до Другої коаліції. Чи відкриємо ми для них двері, чи обернемо спину?"
  nf_dun.7.a: "Ми приймемо їх з розпростертими обіймами."
  nf_dun.7.b: "Нехай шукають інше місце!"

  nf_dun.8.t: "Коаліція відкидає Роузвуд!"
  nf_dun.8.d: "Попри щирі наміри Ґлорії Чейз і фундації Роузвуд, Друга коаліція Манітоби відвернулась від своїх північних сусідів. Без сумніву, це суперечливе рішення лише розпалить напругу між могутніми силами..."
  nf_dun.8.a: "Схоже, все змінюється."

  nf_dun.9.t: "Місто, приховане у смогові"

  nf_dun.10.t: "Випробування на тваринах"
  nf_dun.10.d: "Багато тварин стали піддослідними під час тестувань сироватки Дандерна: спочатку радщури, потім вовки, навіть тініїди та морозоплави — і лише двоє останніх вижили. \n\nЕфекти сироватки були повторюваними. Вени та шкіра істоти темнішали, наче прискорене гниття починалося просто на очах спостерігачів: щось між гулям і смертю, дивна бічна стежка, що оминає відоме. Безперечно, реплікатор ДНК мав тут свою роль... То, можливо, саме в ньому була вада? А може, ми просто неправильно ним користуємось..?"
  nf_dun.10.a: "Нам бракує часу на роздуми."

  nf_dun.11.t: "Першу людину випробувано"
  nf_dun.11.d: "Першим, хто відповів на заклик Якоба Дандерна, став Тревіс Біллінґс. Заводський працівник, натхнений Доктриною Літлгоупа й переконаний у вічності, яку обіцяє Дандерн. Для наукової команди він був не лише готовим — а й ідеальним кандидатом. \n\nПісля тижнів підготовки почалося випробування. Його помістили до реплікатора ДНК та налаштували параметри настільки точно, наскільки змогли. Те, що сталося далі, тривало 30 секунд жаху: звук ламаючих кісток заглушав навіть крики самого Біллінґса, а світло в камері було сліпучим. Навіть коли вчені усвідомили, що накоїли — вони не зупинились. Було вже надто пізно. \n\nКоли Тревіс вийшов, його очі світилися енергією машини, а шкіра — напівзогнила. Він був мертвий, та ходив. На питання про стан відповідав лише гарчанням, та чудово розумів усі накази вчених. Його поведінка — тривожно захоплена, мовби дитяча радість, — непокоїла навіть самого Дандерна..."
  nf_dun.11.a: "Це аж ніяк не ідеальна людина."
  nf_dun_first_zombie_tt: "§YТревіс Біллінґс§! стане доступним як §Gкомандир підрозділу§!"

  nf_dun.12.t: "Мрія Коріни"
  nf_dun.12.d: "Роки тому під час будівництва грандіозної системи очищення води в Плезантдейлі було знайдено бункер із недобудованою, але вцілілою китайською бойовою машиною — вона чекала понад двісті років. Її вивчала випускниця університету Чейз, Коріна Лоун, яка вірила: зусилля однієї з індустріальних сил дозволить завершити її. Але всі, до кого вона зверталася, кепкували: «Звідки ти візьмеш енергію для цієї штуки?» — питали одні. «Ти справді довіриш їй захист своєї родини?» — глузували інші. Коли прийшли доктрини Літлгоупа, її ідею поклали в довгу шухляду... \n\nАж поки Ґлорія Чейз не дізналась про ці дослідження. Хоч її чоловік не поділяв захоплення «будівництвом велетенського робота для знищення ворогів», вона бачила цінність у своєму коледжі й прагнула, аби Коріна реалізувалась. Тепер, коли Роузвуд керує — все можливо. Але ресурси доведеться здобути. Така конструкція не буде дешевою."
  nf_dun.12.a: "Наш шлях прокладений сталлю, не кров'ю."

  nf_dun.13.t: "Проблеми в Дандерні!"
  nf_dun.13.d: "Ходять чутки, що генералка Парія Гокмун із Дандерна почала формувати нове покоління солдатів — з колишніх ветеранів і з бідняків усього електорату. «Без сумніву, — каже один зі струнських світських левів, — це наслідки вчень Тімоті Літлгоупа в дії.»\n\nЧас покаже, що станеться з армією Гокмун. А поки — світ може лише спостерігати."
  nf_dun.13.a: "Погляньмо, з чого ти зроблена."

  nf_dun.14.t: "Послання з Дандерна"
  nf_dun.14.d: "До королівства сьогодні прибув посланець із Дандерна, несучи торбу, повну дзвінкого металу. Його впевненість була очевидною поки він ішов, але розвіялась, коли він постав перед самим герцогом. Там, посеред зали, він кинув шолом розбитого лицаря — тьмяно вичищений, але зі штучно зробленими вм’ятинами. Послання здалеку. \n\nНа боці шолома було вирізьблено п’ять слів: «З любов’ю, Парія Гокмун»."
  nf_dun.14.a: "§RВони не усвідомили, що накоїли.§!"

  nf_dun.15.t: "Чейз проти Дандерна: денді"
  nf_dun.15.d: "ДАНДЕРН: Треба щось зробити з П’єром Соломоном та його прислужниками в Стуні. Він знищив саму святість наших виборів, і тим самим підірвав віру людей!\n\nЧЕЙЗ: Наскільки я пам’ятаю, саме ви втратили крісло, яке Дандерн утримував понад століття, містере Дандерн. Хіба цього недостатньо, аби поставити під сумнів ваше лідерство?\n\nДАНДЕРН: <хмикає> І я маю вважати не дивним, що програв людожерам і сутенерам? Ну ж бо, пані Чейз. Варто лише пильніше придивитися.\n\nЧЕЙЗ: Я придивилась достатньо, і бачу: ви — невдаха, надто наляканий, щоби це визнати. Люди Дандерна більше не хочуть вас. Ваша династія закінчується, і ви — перша жертва власного безсилля. Ваше обурення — цілком природна реакція, але це не робить ваші аргументи правдивими.\n\nДАНДЕРН: Денді — це циркові виродки. Ви справді вірите, що вони здатні керувати справедливо, пані Чейз?\n\nЧЕЙЗ: Народ Дандерна не боїться денді. Знаєте чому? Бо вони в Стуні, містере Дандерн — а ми ні. Жодна людина в Дандерні не відчувала на шиї зубів денді. Але знаєте, що ми відчували? Дим і смог. Жахливі умови праці. Аморальні зміни в оплаті. Ось наші пошесті, містере Дандерн. А не дикуни в костюмах."
  nf_dun.15.a: "Вибори сфальсифікували денді!"
  nf_dun.15.b: "Денді — не наша турбота."

  nf_dun.16.t: "Дандерн: підлабузники"
  nf_dun.16.d: "Я завжди їх зневажав. Підлабузників. Підтакувачів. Лизунів, що висмоктують соки з успішних, кидаються в полум’я без сенсу, або ще гірше — по краплі гризуть п’яти великих. \n\nЯ бачив, як мій батько зламався під тягарем власної дурості саме через таких людей. Щоб бути сильним, справді розумним — тебе мають підтримувати рівні за силою і розумом. Ґлорія Чейз хотіла з’єднати світ, але не зрозуміла, що люди сильніші окремо. Про щирість людини можна судити за її рукостисканням: якщо воно міцне — її наміри серйозні, і пристрасть незаперечна. Якщо ж мляве — така людина не здатна до добра, і її варто відкинути. \n\nЛюдина, яка стоїть на власних ногах. Яка здатна підтягнути себе за власні ремені. Яка може нести світ на плечах. Саме такою людиною ти маєш стати — заради тих, кого любиш."
  nf_dun.16.a: "Смерть підтакувачам!"

  nf_dun.17.t: "Чейз: найбільша зоря, що сяяла над людством"
  nf_dun.17.d: "Коли я була дитиною — поїзди не ходили. Світло миготіло, а води бракувало через день. Мій батько помер від сухот, і я лишилася з матір’ю, яка була загубленою — вівцею без пастуха. \n\nМоя праця завжди була спрямована на добробут людства; штовхати нас у час, де ми можемо бути кращими одне до одного. Не лише заради себе — а заради тих, кого ми любимо. Від Плезантдейла до Дандерна я говорила з усіма: з багатими вечірками і сталевими робітниками. І знаєте, що їх об’єднувало? Печаль. Жаль. Відчай. \n\nЛюдський розум зламаний. Немов зіпсована платівка, ми приречені знову й знову повторювати помилки. І ми плачемо, бо не можемо зрозуміти, чому. Ось чому я створила фундацію Роузвуд: щоби ми з вами змогли піднятись над власними помилками. У праведній сталі ми єдині: більше не буде дрібних відмінностей між гулями і гладкошкірими, мутантами й людьми, навіть між чоловіками й жінками. Майбутнє вже за горизонтом — це золота заграва, що веде нас до найвеличнішого світанку в історії людства."
  nf_dun.17.a: "Амінь."
  nf_dun.17.b: "Це мало бути зворушливо?"

  nf_dun.18.t: "Дандерн: ти боїшся, Дандерне?"
  nf_dun.18.d: "Слухай, любий народе Дандерна — я хотів би сказати вам кілька слів, якщо не заперечуєте. \n\nПротягом десятиліть наша славна країна тягла електорат вперед завдяки власному поступу. Саме сталь Дандерна підняла блазнів із Стуну з рівня безпорадних рибин до підлесників, що тепер хихотять за нашими кордонами. Це гроші дандернських платників податків оплатили Психлікарню у Вакаві з усіма її вкраденими ліками. Це завдяки генію наших учених у Плезантдейлі досі горить світло. Електорат поколіннями просочений нашим впливом. І що маємо натомість? П’єр Соломон сидить на своїй вежі, сміючись із нашого зубожіння і пхаючи ніс туди, де його не просять.\n\nСаме ми — чоловіки й жінки Дандерна — несемо цю жалюгідну купу штатів на власних плечах. Наш розум, наша сила, наша відвага стримують ворогів цієї великої нації. Хто, нагадайте, зупинив Леші? Невже Соломон, що рюмсає через втрачені ковпаки? Ні! Це була Парія Гокмун — найвідважніша з усіх. І де ж її пам’ятник у Стуні, га? Де її пам’ятник, П’єре?\n\n*Чути вигуки обурення і схвальні крики. У спотвореному записі прослизає прокляття на адресу П’єра Соломона.*\n\nМи живемо всупереч сусідам. Всупереч ворогам. Наша ненависть — це лиш дзеркало нашої любові, нашої пристрасті до справедливого. Ми й надалі йтимемо вперед — без страху в серці! Хай вороги плюють на нас відкрито, але для помсти — спершу мусимо радіти. Сміятись у темряві — означає бути безстрашним.\n\nТож скажіть мені, народе Дандерна: ви боїтесь?"
  nf_dun.18.a: "Оце він правильно говорить!"
  nf_dun.18.b: "Його радикалізм мене лякає."

  nf_dun.19.t: "Послання від Вернона Дюкена"
  nf_dun.19.d: "Привіт, \n\nХотів подякувати особисто за те, що доручив справу родині Дюкен. Ми вже роками пишаємось тим, що маємо справу зі шваллю. Я не з тих ідіотів, що лізуть у політику, тож мені байдуже, на якому ти боці в цьому маразмі. Але скажу так... Я б наваляв цим виродкам тисячу разів, аби тільки вони нарешті зрозуміли, за що взялися. Розумієш, про що я? \n\nНе кусай більше, ніж можеш проковтнути. Не кусай руку, яка тебе годує... Звичайні речі. Але ці дурні знову й знову наступають на ті ж граблі. Хоча, звісно, їхнє ниття — це і є моя робота, хіба не так? Тримай контакт. Я завжди поруч. \n\nВ.Д."
  nf_dun.19.a: "Емм... дякую?"

  nf_dun.20.t: "Чейз проти Дандерна: королівство"
  nf_dun.20.d: "ДАНДЕРН: Раз у вас такі великі думки, пані Чейз, давайте поговоримо про Манітобу.\n\nЧЕЙЗ: Якщо ви маєте на увазі криваву історію, що нас поєднує, то мене цікавить лише одне: чим може скористатися Дандерн.\n\nДАНДЕРН: Нецікаво, кажете? Тобто смерті дандернських регулярів для вас нічого не варті?\n\nЧЕЙЗ: Не моя справа, коли чоловік вирішує йти на війну, містере Дандерн — моя справа забезпечити його всім необхідним, щоби він виконав своє завдання. Наскільки я пам’ятаю, під час тієї війни ваша родина не змогла належно забезпечити чимало наших ветеранів. Ви хапали ресурси Дандернської військової машини задля власного збагачення.\n\nДАНДЕРН: Цинічна брехня! Вісімдесят п’ять відсотків виробленого одразу йшло на фронт. Решта — на резервні склади. Якщо вже ми говоримо про марнотратство й жадібність, пані Чейз, дозвольте мені у відповідь згадати скандали довкола вашої фундації Роузвуд. Некомерційна організація, що займається чим — переосмисленням людства? Ви забули, в якому місті перебуваєте?\n\nЧЕЙЗ: Ні. Це місто — надто болюча реальність, щоб його забути, містере Дандерн. І так, фундацію Роузвуд я фінансую сама, хоч ми й не зовсім некомерційні. Ми пропонуємо послуги тим, кому потрібен розум, а не кулі.\n\nДАНДЕРН: І хто ж ці «люди», як ви кажете? Ви що, обслуговуєте при дворі Плезантдейлу?\n\nЧЕЙЗ: Ні, насправді. Ми допомагаємо бідноті. І вони платять за можливістю. Ми беремо пропозиції — і працюємо згідно з ними.\n\nДАНДЕРН: Тобто ви скотилися до примітивного бартеру?\n\nЧЕЙЗ: Ні. Ми перейшли до здорового глузду."
  nf_dun.20.a: "Геній Дандерна вкотре знищує її!"
  nf_dun.20.b: "Вона допомогла мені полагодити трубу в хаті!"

  nf_dun.21.t: "Дандернські регуляри"
  nf_dun.21.d: "Колись давно дандернські регуляри стримували вплив Манітоби. Ми, може, й були частиною їхнього королівства — але ніколи цього не хотіли. Смог і попіл тут душать — але це наш смог і наш попіл. І ми битимемося до останнього, щоби це залишилось так.\n\nНаші солдати носять сталеві обладунки манітобських лицарів — як насмішку й як захист. Ця символіка викликає ворожий страх — такий, якби побачити шкіру друга на чужому тілі. І саме тому ми носимо її з гордістю. Нехай знають: ми боремось за свободу, а не за монархів.\n\nПарія Гокмун — найбільш відома серед цих регулярів. Вона виступала проти і короля, і змія, з тією люттю, про яку більшість чоловіків можуть лише мріяти."
  nf_dun.21.a: "Наша армія стоїть непохитно."

  nf_dun.22.t: "Боєприпаси Дандерна"
  nf_dun.22.d: "Якби не ливарні Дандерна, ентузіазму у бойовиків електорату було б значно менше. Скільки б Плезантдейл не намагався уникнути постійної армії — наш вплив роз’їдає їхній народ, і вони починають шукати зброю: для самозахисту, а то й просто для колекції. Наші зразки — це старі довоєнні креслення з ХХ століття, адаптовані під сучасні лазери й плазму. Зброя Дандерна — одна з найунікальніших у західній Канаді. І хоч її якість іноді не відповідає стандартам, зате наша здатність постачати — майже неперевершена по цей бік Вінніпегозису."
  nf_dun.22.a: "По тисячі куль на кожного!"

  nf_dun.23.t: "Майбутнє настало"
  nf_dun.23.d: "Результати підраховано! Переможець у серцях народу..."
  nf_dun.23.a: "Якоб Дандерн. Хіба могло бути інакше?"
  nf_dun.23.b: "Ґлорія Чейз. Її геній фінансує немислимі відкриття."

  nf_dun.24.t: "Великий день Парії Гокмун"
  nf_dun.24.d: "Парія та її Іскролеза зібралися біля старої Фейрі-Ґлен — там, де оселилася Леші. Запаливши свою улюблену марку сигарет, вона подивилась у пащу старого обвалу над об’єктом MANIFEST, тримаючи ще один динаміт. «Якщо не зламано…» — промовила вона, кидаючи вибухівку в яму поверх купи. «...то й не лагодь.» — і відвернулась. «Зав’язуємо, народ.»\n\nЗгодом підпалили ґніт — поховавши Леші в її власному лігві.\n\nХоча офіційно її вважають мертвою, Парія краще за інших знає, що без доказу — нічого не гарантуєш. Але їй вистачає іншого: якщо й вижила — то нам вона вже не загроза."
  nf_dun.24.a: "Яструб завжди бере змію, зрештою."

  nf_dun.25.t: "Вшанування найкращих"
  nf_dun.25.d: "Із загибеллю Леші було знищено велику загрозу для народів Катчу. Сьогодні ми вшановуємо героїв, що рушили в її лігво, і тих, хто впав після перемоги — меморіалом.\n\nІ нехай це буде ще одним нагадуванням: Дандерн був і буде місцем росту. Бо де бізнес — там і закон."
  nf_dun.25.a: "Амінь."

  nf_dun.26.t: "Нагорода для Іскролезів"
  nf_dun.26.d: "Якоб зважував свої варіанти: з канібалами у Стуні та виродками в Плезантдейлі розібрались, влада — повернута. Але залишилась одна проблема: нема електорату, який би його обрав. Це не кінець світу — попереду важливіші речі, та імідж також важливий. Так він і замислився над долею Іскролезів.\n\nЇхня роль у забезпеченні перемоги була неоціненна. Надати їм посади в армії Дандерна — мудрий крок. Тримати при дворі, так би мовити. Але є й інший варіант: віддати Луґнуту й його людям контроль над Страсбурґом, лишивши їх під впливом Якоба. Виглядало б як заслужена нагорода й водночас — як ілюзія, ніби електорат ще існує."
  nf_dun.26.a: "Нехай ідуть своєю дорогою."
  nf_dun.26.b: "Тримаймо їх поруч."

  ##catcher

  dun_catcher: "Відправити Кетчера розібратись з мерзотою"
  dun_catcher_desc: "Часи важкі \nІ платити нема за що \nТи шукаєш когось, \nХто зробить справу без слів і грошей \nКоли треба трохи «любові», \nБо твій хлоп пішов в дорогу \nТо знаєш — я вже біжу \nІ буду завжди поблизу"

  ##focus loc

  dun_1: "Людяність"
  dun_1_desc: "Це — найважливіший аспект нашого життя: людяність. У сьогоднішніх дебатах Якоб Дандерн та Ґлорія Чейз зійдуться на цю тему."

  dun_2: "Денді"
  dun_2_desc: "Якоб Дандерн відверто висловлює недовіру до нових лідерів у Стуні, тоді як Ґлорія Чейз зосереджується на проблемах тут, у Дандерні."

  dun_3: "Королівство"
  dun_3_desc: "Можливо, найбільший суперник Дандерна — Королівство Манітоба. Історично напружена тема, яка сьогодні стане полем битви для Дандерна й Чейз."

  dun_fake_prophets: "Фальшиві пророки"
  dun_fake_prophets_desc: "Стережіться, народе Дандерна: поміж нас блукають фальшиві пастирі, що зваблюють вівцю солодкими словами. Це не може тривати! Найкращі сини Дандерна проженуть цих «божих» піснярів на схід — до їхнього гнилого королівства."

  dun_integrate_christians: "Інтегрувати християн"
  dun_integrate_christians_desc: "Ті з Елбо, хто не загруз у фанатизмі, зможуть жити поруч із нами як рівні. Хоч їм і дозволено зберігати віру — жодна церква ніколи не діятиме в межах Дандерна. У цьому немає ані прибутку, ані користі для людини."

  dun_expunge_the_evangelists: "Хай бояться невіруючих"
  dun_expunge_the_evangelists_desc: "Євангелісти з Елбо — проблемні. Їх розірвуть на частини. Ті, хто насмілився чинити опір — стануть прикладом. А смог дандернського прогресу рушить на південь."

  dun_send_riot_police_to_the_riots: "Цьому бунту не бути"
  dun_send_riot_police_to_the_riots_desc: "Приватна детективна компанія Дюкенів була надзвичайно корисною останніми роками. Буде проведено «розслідування» щодо бунтівників, і з Божою ласкою — скоро вони знову тихо повернуться до роботи."

  dun_clean_the_factories: "Чистка майданчиків"
  dun_clean_the_factories_desc: "Знайти тих, хто стоїть за цією «спілкою», буде неважко. Вичислимо найбільш м’якотілих з усієї зграї — і розчавимо їх у пасту, поки не зламаються."

  dun_purge_the_rioters: "Очистити від бунтів"
  dun_purge_the_rioters_desc: "Якщо «прибирання» не допоможе — перемішаймо жовток навиворіт. Бити по кожному, хто хоче страйкувати — будь-якими методами. Хай шкодують, що не залишились на лінії."

  dun_listen_to_rioters: "Почути бунтівників"
  dun_listen_to_rioters_desc: "Якщо щось і можна сказати про народ — то те, що він має голос. Дандерн і так страждає. Дамо їм слово!"

  dun_up_safety_standards: "Впровадити стандарти безпеки"
  dun_up_safety_standards_desc: "Робітники хочуть кращих умов безпеки. Хто ми такі, щоб сперечатись? Вони хочуть працювати — тож зробімо так, щоби їм було спокійніше."

  dun_renewed_OSHA_regulations: "Огляд довоєнних регламентів"
  dun_renewed_OSHA_regulations_desc: "Хоча не всі норми дотримувались до війни, багато з них сьогодні працівники підтримують. Додаймо трохи «смаку минулого» до нашої рутини, еге ж?"

  dun_army_1: "Армія, як вона є"
  dun_army_1_desc: "Армія Дандерна — гордість усього електорату, хоч у Стуні чи Плезантдейлі це й заперечують."

  dun_vehicles: "Старі надійні"
  dun_vehicles_desc: "Бойові вози Дандерна колись крушили Манітобу — наче блискавка й полум’я. Ті часи вже минули, та багато з них і досі на ходу. Тепер, коли смерть не нависає щосекунди — модернізуємо їх і випробуємо в нових реаліях."

  dun_brawlers: "Старі вози живуть уперто"
  dun_brawlers_desc: "Деякі наші старі машини надто зношені, щоби повернутися в стрій — але не всі. У нас ще є що витягти зі сховищ."

  dun_preemptive_drills: "Повернення старих навчань"
  dun_preemptive_drills_desc: "Стара гвардія ще не зникла. Стампід на обрії, Королівство ще не визначилось, а інші електоральні штати в розрусі — маємо бути готові. Повторимо старі бойові навчання."

  dun_militia: "Найважливіше у будь-якому суспільстві..."
  dun_militia_desc: "...Це озброєний народ. Якщо армія впаде, то розлючені низи залишать ворожі тіла з дірками там, де ніхто й не чекав."

  dun_underground_workshops: "Заохочення ополчення"
  dun_underground_workshops_desc: "Ополченці Дандерна можуть стати ідеальним резервом — і джерелом новобранців для регулярів. Варто лише підтримати їх."

  dun_militia_checkpoints: "Ополченські блокпости"
  dun_militia_checkpoints_desc: "Дозволимо ополченцям створювати власні «блокпости». Це дасть їм змогу налагодити мережі зв'язку між собою — а завдяки співпраці з нами, ми триматимемо руку на пульсі."
  dun_militia_checkpoints_tt: "Отримаємо §G1§! рівень §Yаванпостів§! у §Yвсіх прикордонних провінціях§!, які контролюємо.\n\n"

  dun_militia_2: "Єдиний фронт — єдиний дім"
  dun_militia_2_desc: "Ополченці стоять пліч-о-пліч із регулярною армією. Якщо це не викликає посмішку в патріота — то я вже не знаю, що викликає."

  dun_energy_weaponry: "Що вигнало Бога з Дандерна"
  dun_energy_weaponry_desc: "Церква люто боролась за свою землю в Саскачевані. Ми вигнали її — лазером і променем, із радісною посмішкою.\n\nІ зробимо це знову, якщо треба буде."

  dun_energy_weaponry_bonus: "Сюрприз від доктора"
  dun_energy_weaponry_bonus_desc: "У кожному поважному суспільстві рушієм завжди було новаторство. Якщо Манітоба ризикне ще раз — її приголомшить наш технічний прогрес."

  dun_energy_weaponry_tech: "Чудеса індустрії"
  dun_energy_weaponry_tech_desc: "Завдяки генію наших промисловців ми кидаємо виклик законам Пустки."

  dun_refurbishingweapons: "Зменшуй, повторно використовуй, переробляй"
  dun_refurbishingweapons_desc: "Щодня якийсь дурник залишає зброю гнити в ямі — то в запої, то під час облави. Але жодна покинута гвинтівка не пропаде: ми постановили — кожна зброя має працювати. Якщо не в руках регулярів — то в ремонтній майстерні. Жодного ствола на смітник. Таке наше гасло."

  dun_infantry_weaponry: "Інновація — наш ключ"
  dun_infantry_weaponry_desc: "Інновація, інновація, інновація. Без розуму й наполегливості ми не рушимо з місця."

  dun_doctrine1: "Залежить, як замахнешся"
  dun_doctrine1_desc: "Кожен дурень може стріляти зі зброї. Але лише дандернський регуляр знає, як це робити з розумом."

  dun_glorias_victory: "Змінити світ"
  dun_glorias_victory_desc: "Фундація Роузвуд перемогла. Божевілля Ґлорії взяло гору."

  dun_jakobs_victory: "Залишаючись на курсі"
  dun_jakobs_victory_desc: "Еліта Дандерна перемогла. Божевілля Якоба стало законом."

  dun_man_over_matter: "Що робить людину людиною?"
  dun_man_over_matter_desc: "Людина складається з клітин, так. Але головне — це її душа. Без душі ми — лише звірі, що корчаться у власному бруді, прикидаючись, ніби маємо сенс."

  dun_wakaw_slaves: "Вони назвали себе «супер»"
  dun_wakaw_slaves_desc: "Вони прийшли з півдня. Дуже, дуже з півдня — зі Штатів. Назвали себе «супермутантами» й заявили, що залишаться. Я їх не кликав. Але цікаво: як вони працюють? Давайте-но вони й покажуть. Викрадемо стільки, скільки вдасться — з їхнього жалюгідного притулку."

  dun_mutant_mind_control: "Закріпити ставки"
  dun_mutant_mind_control_desc: "У місті промисловості потрібно мати дві речі: захист і робочу силу. Мутанти пропонують обидве. Їм потрібен лише невеликий примус… А з правильним контролем розуму — усе стане легко."

  dun_catcher_cant_do_everything: "Брудні справи — Дандерн дешево"
  dun_catcher_cant_do_everything_desc: "Як би не хотілося — Кетчер мусить бути інструментом тонким. Після падіння електорату нам потрібен хтось інший — молот для цвяха, що не слухається. Хай просять пощади — до того, як ми закінчимо."

  dun_smashers_puppet: "Повернення Іскролезів"
  dun_smashers_puppet_desc: "Луґнут та його люди колись були бунтівниками з благородною метою. І в цьому новому електораті я жестом доброї волі дарую їм громадянство. Доказ, що доброчесність ще не померла. Ще ні."

  dun_do_not_bite_the_hands: "Не кусай руку"
  dun_do_not_bite_the_hands_desc: "Проста фраза: «Не кусай руку, що годує». Але скільки її не повторюй — по телебаченню чи в цехах — жоден із цих бовдурів її не чує. Та зрештою — якщо вони на заводі, а не в залі засідань… То хто тут справжній мозок?"

  dun_seeing_is_believing: "Бачити — значить вірити"
  dun_seeing_is_believing_desc: "Лише рука провидця може провести цивілізацію крізь вогонь вічності. Людина, що здатна вигравірувати — ні, випалити! — своє ім’я на спині кожного працівника без єдиного слова спротиву. У цьому віці — я саме така людина."

  dun_hard_work_is_happy_work: "Тяжка праця — щаслива праця"
  dun_hard_work_is_happy_work_desc: "Зневажай того, хто нечесний. Зневажай того, хто стримує удари. Кожен удар має бути виразом тебе! Сила, яку не демонструють — це брехня. Не слухай жінок на вулиці, що просять «співчуття», бо не мають грошей. Може, їм варто було подумати, як самим вирішити свої проблеми — а не жити подачками й «милосердям»."

  dun_interface_environment: "Спільне — в обговорення"
  dun_interface_environment_desc: "Ті, хто прагне новинок, приємностей і здатен чесно їх придбати — кістяк суспільства. Вони працюють, утримують родину й підтримують наші відкриття гаманцем, а не язиком. Ось справжні громадяни. Найшанованіші."

  dun_concluding_the_tests: "Подбати про наших «гостей»"
  dun_concluding_the_tests_desc: "ДНК супермутантів важко здобути й зрозуміти — але це не неможливо. Ми зібрали достатньо, аби рухатись далі."

  dun_pave_the_way_to_destiny: "Крізь хуртовини й багряне небо"
  dun_pave_the_way_to_destiny_desc: "Кажуть, це неможливо. Що реплікатор ДНК — міф. Я це заперечую. Чому? Бо вірю: світ забезпечує тих, хто працює. Ми прорвемось крізь бурю. Ми здобудемо свою волю. Якщо не завдяки щедрості світу — то завдяки моїй волі."

  dun_securing_the_blizzard: "Неможливе"
  dun_securing_the_blizzard_desc: "Мене називали божевільним. Казали, це неможливо. Що долю не зламати. \n\nТепер ці люди — або в нетрях, або в могилі. Їхні імена? Я вже їх забув. І так само забуде історія — коли моє ім’я буде надруковане найбільше з усіх."

  dun_unleash_science: "Видобути, скопіювати, подвоїти..."
  dun_unleash_science_desc: "Типові випробування приносять плоди. Щоб стати майстрами, наші вчені мають вчитись."

  dun_the_replication_chamber: "Золоте яйце: камера реплікації"
  dun_the_replication_chamber_desc: "Нарешті. Моє святе творіння. Мій білий кит — хай не стане моїм Єрихоном. Із цим пристроєм наука зробить крок у тисячу, ні — мільярд років уперед. Досконалість людини стане лише парадоксом у порівнянні з тими чудесами, що ми створимо."

  dun_animal_trials: "Випробування на тваринах"
  dun_animal_trials_desc: "Проведення випробувань на тваринах дало... тривожні результати, якщо ці ознаки мають для нас бодай якесь значення…"

  dun_zombies: "Відкинуті Лазарем"
  dun_zombies_desc: "Жахи людства вириваються, як мор, на поверхню: щоби кожна долина була затінена смертю, і кожна людина пізнала той самий жах, який ми відчули, коли усвідомили власні провали."
  dun_raise_zombies: "Підняти мерців"
  dun_raise_zombies_desc: "Ціна безсмертя показує свою огидну суть…"

  dun_pandoras_victory: "Розум і метал"
  dun_pandoras_victory_desc: "Ґлорія Чейз, тепер офіційна очільниця Дандерна, обіцяє майбутнє для людства, викарбуване в металі: справжню єдність, яка підніме нас понад радіацію."

  dun_working_with_elbo: "Батько Звалище"
  dun_working_with_elbo_desc: "Релігійні спільноти Елбо завжди були легкою мішенню для міс Чейз — зрештою, зовсім неважко було переконати їх «паству» в злі Якоба Дандерна. Хоча вони не закривали очі на її цілі, їхня підтримка була безцінною. А тепер, коли електорат стрясає напруга, а Елбо лишився осторонь… Можливо, варто спробувати неофіційний союз?"

  dun_betraying_scrapheap: "Зрада Батька Звалища"
  dun_betraying_scrapheap_desc: "Звалище завжди було наволоччю. Навіть не потрібно геніальності Ґлорії, щоби це усвідомити. Позбутись його і повернути Елбо під контроль електорату — дитяча гра."

  dun_puppet_pleasantdale: "Згадати ПРОМІНЬ"
  dun_puppet_pleasantdale_desc: "Колись ця програма служила їй у зовсім іншому житті. Тепер ПРОМІНЬ шукає прихистку — і хто така Ґлорія, щоби йому відмовити? Старі друзі заслуговують на пошану, навіть наприкінці."

  dun_pandoras_box: "Скриня Пандори"
  dun_pandoras_box_desc: "Сестра Ґлорії завжди була майстром робототехніки. Її дослідження стали основою для багатьох ідей, які зараз визначають саму сутність Ґлорії. І тепер, коли Дандерн під контролем фундації Роузвуд — сестри знову можуть працювати разом."

  dun_sentry: "Перепідключити машини Старого Світу"
  dun_sentry_desc: "Після канадської окупації багато роботів «Містер Ґатсі» залишились покинутими. Заморожені чи інакше — але в досить пристойному стані. І таланти фундації Роузвуд зможуть дати їм нове життя."

  dun_machinoforming: "Машиноформування нікчем"
  dun_machinoforming_desc: "В'язні. Невдоволені. Бродяги. Всіх їх об'єднує одне — руйнівна натура. Вони стануть першими випробуваними: визначимо межі людського тіла в болю і муках. Щоб піднятись — маємо знати, де межа."

  dun_awaken_the_metaphorical_giant: "Пробудити метафоричного гіганта"
  dun_awaken_the_metaphorical_giant_desc: "Тепер, коли фундації Роузвуд більше ніхто не опирається, ми мусимо в собі знайти силу для ривка вперед. Такого ривка, який стерче всім, хто стояв проти нас."

  dun_munitions_caliber: "Нова зброя"
  dun_munitions_caliber_desc: "З переходом до імплантацій та робототехніки — наш старий арсенал більше не відповідає потребам. Маємо змінити підхід, і змінити виробництво."

  dun_land_of_cowards: "У землі боягузів"
  dun_land_of_cowards_desc: "Стун був містом зрадників. Як і Дандерн — тільки там підлість ніколи не маскувалась. Світ став значно гостиннішим лише тому, що цих людей більше не існує."

  dun_consider_our_options: "Зважити наші варіанти"
  dun_consider_our_options_desc: "На південь від нас — роботичні заводи та потрібні ресурси. Інновації — наш хребет, але ресурси завжди були проблемою. Ми або звернемось до метисів за союзом, пропонуючи щось навзаєм… або спробуємо забрати землю силою."

  dun_the_project: "Проєкт Коріни — реалізовано"
  dun_the_project_desc: "Роботи над нашим Гігантом можуть нарешті продовжитись — саме так, як планувалось."

  dun_implantations: "Початок кіберизації"
  dun_implantations_desc: "Якщо людина має еволюціонувати — вона мусить витримувати час. Жоден геній не має більше ставати порохом чи гноєм. Та перед цим нам треба перевірити цю ідею — масово."

  dun_plastic_skin: "Пластикова шкіра"
  dun_plastic_skin_desc: "Обличчя настільки знайоме, що здається людським… хоча насправді — зовсім ні. Це і є майбутнє."

  dun_perfect_complexion: "Досконала шкіра"
  dun_perfect_complexion_desc: "Нам більше не потрібно буде бачити потвор. Усі ми зможемо бути ідеальними. Разом."

  dun_adamantium_bones: "Адамантові кістки"
  dun_adamantium_bones_desc: "Наші тіла — слабкі. Світ — жорстокий. Але тепер сили зрівнялись. Тепер — наша черга."

  dun_humankind_made_anew: "Людство 2.0"
  dun_humankind_made_anew_desc: "Мій шедевр. Людина, повністю з металу, але зі збереженим розумом, тепер ходить поміж нас — перший із тисячі. Незабаром я залишу цей кволий тлін і теж ходитиму на металевих ногах. І тоді — настане наш рай на землі."

  dun_men_we_can_count_on: "Люди, на яких можна покластись"
  dun_men_we_can_count_on_desc: "«Та мені байдуже, хто на мене гарчить — Якоб чи Ґлорія. Що нам справді треба — це люди, на яких можна розраховувати. І я знаю, як їх знайти.» — Парія"

  dun_reopen_allan_hills: "Відкриття Алан-Гіллс"
  dun_reopen_allan_hills_desc: "«Це було місто. Це була в’язниця. А тепер буде всього потроху. У нас повно полонених і виродків, яких можна поставити до станка. Нехай роблять зброю для наших хлопців. Я особисто подбаю, щоби не ледарювали.» — Парія"

  dun_pariahs_law: "Закон Парії"
  dun_pariahs_law_desc: "«Якщо ти не за крок до того, щоби зламати мітлу об чиюсь дупу за грубість — то за що ти, чорт забирай, тоді взагалі стоїш?» — Парія"

  dun_return_to_sender: "Викинути їх геть"
  dun_return_to_sender_desc: "«Покидьки з Форт Кеп Гелла тримають наших надто довго. Мені байдуже, що в них є зброя — у нас теж. Я хочу бачити, як ті стіни падають. І я насолоджуватимусь кожною чортовою секундою.» — Парія"

  dun_placing_bets: "Ставки зроблено"
  dun_placing_bets_desc: "«Ось чого добились ці рахівники — дали лихварям підм’яти під себе цілий округ. До біса це. Я хочу скинути на них напалм і подивитись, як вони самі розбираються.» — Парія"

  dun_poking_the_stampede: "Гра, партія, смерть"
  dun_poking_the_stampede_desc: "«Вони все одно до нас прийдуть. Треба зробити так, щоб їм стало страшно ще до цього… А якщо не злякаються — тоді стерти з лиця землі швидко й чисто.» — Парія"

  dun_the_greatest_party_ever_held: "Найгучніше святкування"
  dun_the_greatest_party_ever_held_desc: "«Святе лайно. *Гик* Це ми це зробили? О, милий Ісусе. Як… як, чорт забирай, ми це взагалі зробили?!» — Парія"

  dun_if_you_came_to_see_a_fight: "Якщо прийшов подивитись на бійку..."
  dun_if_you_came_to_see_a_fight_desc: "Парія Гокмун завжди була піротехніком ще тим."

  dun_then_enjoy_a_war: "...тоді насолоджуйся війною"
  dun_then_enjoy_a_war_desc: "Із загибеллю Леші ми переходимо в нову еру. І, з надією, — без подальших страждань..."

  dun_industry_1: "На лаврах Дандерна"
  dun_industry_1_desc: "Місто й сама нація Дандерн не існували б без індустрії. Тут усе — це праця, безпека і гроші."

  dun_restore_the_rail_line: "Відновлення залізниці"
  dun_restore_the_rail_line_desc: "Залізнична лінія Дандерна охоплює весь електорат. Це, без сумніву, один із наших найбільших внесків у саму його ідею."

  dun_hire_conductors: "Найняти машиністів"
  dun_hire_conductors_desc: "Нам не вистачає людей на потягах! Якщо ми забезпечимо навчання та персонал — наша мобільність зросте в рази."

  dun_caravansary: "Погляд назовні"
  dun_caravansary_desc: "Гроші — ключ до всіх послуг. Але щоб їх мати, треба торгувати."

  dun_constructioncrews_1: "Підтримати внутрішнє зростання"
  dun_constructioncrews_1_desc: "У нас є кілька компаній, які варто підтримати. Зосередьмось на розвитку всередині, перш ніж дивитись назовні."

  dun_caravansary_boons: "Переваги торгівлі"
  dun_caravansary_boons_desc: "Усі хочуть шматок дандернського пирога."

  dun_clearing_the_snow: "Розчистити сніг"
  dun_clearing_the_snow_desc: "Без снігових бар'єрів ми зможемо здійснити значну реконструкцію та легше пересуватись нашими землями."

  dun_constructioncrews_2: "Швидка смуга росту"
  dun_constructioncrews_2_desc: "Поглянь на це! Короткострокові інвестиції — і довгострокове зростання. Брати Вімслі вдячні, як ніколи."

  dun_milly_workshoppy: "Військові підприємства"
  dun_milly_workshoppy_desc: "Поки вони виготовляють зброю й броню — ми в безпеці."

  dun_civvy_workshoppy: "Найкраща комерція — цивільна"
  dun_civvy_workshoppy_desc: "Чи не має людина права на тостер і м’яке крісло?"

  dun_industrial_complex_2: "Індустрія, малюк"
  dun_industrial_complex_2_desc: "Потужний старт, хоч і вузьконаправлений, приведе нас до спасіння."

  dun_industrial_complex_1: "Нові можливості для зростання"
  dun_industrial_complex_1_desc: "Збереження потенціалу для зростання — важливіше за все інше."

  dun_communal_service: "Тактика громадських робіт"
  dun_communal_service_desc: "Бійся смітника — ні, знищ його. Його байдужість і призвела нас до катастрофи!"

  dun_researchlaboratories_1:0 "Staffing The Imperial Lab"
  dun_researchlaboratories_1_desc:0 "The Imperial Lab has long been a half-hearted attempt by our leadership to develop improvements for our society. Perhaps it is time to allot more manpower to their cause?"

  dun_scavengers:0 "Promote Scavenger Lifestyles"
  dun_scavengers_desc:0 "Scavengers are the sort to live off the land, cleaning up their space as they do so. What if we made that into a business?"

  dun_scrappers:0 "Scav? Wrong. Scrap!"
  dun_scrappers_desc:0 "So easy it was to put the homeless— I mean, scavengers to work!"

  dun_scavengers_2:0 "The Fine Hand of Capitalism Sways Once More"
  dun_scavengers_2_desc:0 "Some say this is ridiculous. Clearly, they've seen a hobo with a work tie."

  dun_researchlaboratories:0 "Promote Actual Intelligence"
  dun_researchlaboratories_desc:0 "Some of the gents down in Imperial have begun their own sort of science experiments, sharing their results with us in Dundurn. If some ex-Sparkblades want to play brain, who are we to prevent them? Let's endorse their efforts and promote general welfare."

  dun_research_water_purifier:0 "Clean Water?"
  dun_research_water_purifier_desc:0 "Long-since have water cleaning tactics been commonplace in Dundurn, but it had been thought that the water here was too tainted from pollution. Thanks to Imperial, we will never have to import from Pleasantdale again!"

  dun_researchlaboratories_3:0 "From Interns and Pen-Pals to Bona-Fide Science Teams"
  dun_researchlaboratories_3_desc:0 "The fine boys in Imperial have more than proven themselves worthy of a Dundurn pat-on-the-back. Go you, guys! Brahmin pizza party!"

  dun_researchlaboratories_2:0 "Our New Help Comes Through"
  dun_researchlaboratories_2_desc:0 "Economical growth so too shall lead to societal change!"
