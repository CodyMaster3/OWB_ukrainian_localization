### TUTORIAL EVENT LOC ###
tutorial_caps.1.t:0 "§cТуторіал системи кришок§!"
tutorial_caps.1.d:0 "Кришки — це не лише те, чим закривають пляшки. Це ціла система валюти та економіки в Old World Blues. Підкуповуйте, стягуйте податки, торгуйте — і це лише частина можливостей у Пустці. Використовуйте свою економіку як важіль — і, можливо, перевершите саму Америку.\n\nЦей туторіал §RНАПОЛЕГЛИВО§! рекомендується для першого проходження, особливо з увімкненими підказками (в кінці цього туторіалу або в Піп-бої під «Механіки > Кришки»)."
tutorial_caps.1.a:0 "Пропустити туторіал"
tutorial_caps.1.b:0 "Розпочати туторіал"
tutorial_caps.1.c:0 "Цей мод працює дуже повільно!"

tutorial_caps.2.t:0 "Заробітки"
tutorial_caps.2.d:0 "§oДохід§! надходить здебільшого з двох джерел. Для менших країн основним є §oПасивний дохід§! — він надається через закони, фокуси або рішення. Наразі ви отримуєте [?modifier@caps_flat_income_modifier|=+1] кришок з пасивного доходу. Друге джерело — §oекономічні вузли§!, про які поговоримо далі.\n\nКожні 92 дні (щокварталу) витрати віднімаються від доходу, і ваша скарбниця поповнюється (або спустошується!). Якщо чистий прибуток кришок від’ємний, а в банку порожньо — країна може зануритися в економічну нестабільність."
tutorial_caps.2.a:0 "Продовжити"
tutorial_caps.2.b:0 "Вийти"
tutorial_caps_2_can:0 "§oможе§!"
tutorial_caps_2_cannot:0 "§Rне може§!"

tutorial_caps.3.t:0 "Банк і рахунок"
tutorial_caps.3.d:0 "Ваш баланс кришок можна побачити на §oверхній панелі§! — при наведенні курсору ви отримаєте деталізацію §oдоходів§!, §oвитрат§! та активних модифікаторів.\n\nОсновна витрата — утримання армії. Чим більше військ, тим дорожче кожен наступний батальйон! У меню 'Рекрутинг і розгортання' видно орієнтовну вартість військ у черзі підготовки. Деякі дешевші типи — міліція, роботи, законники. Їхню вартість можна перевірити там само.\n\nВаші війська зараз коштують: §R[PrecalculateCapsExpenes]§! кришок.\nУ різні часи країни можуть змінювати §oзарплати армії§! через економічні закони — це впливає на бойову міць та витрати. Міняти їх можна лише раз на 140 днів."
tutorial_caps.3.a:0 "До нового!"
tutorial_caps.3.b:0 "Вийти"

tutorial_caps.4.t:0 "Америка Універсаліс"
tutorial_caps.4.d:0 "§oЕкономічні вузли§! — основне джерело доходу для великих країн. Їх можна переглянути, обравши область, яка належить до вузла. Наразі ви контролюєте [?state_controlled_nodes^num|0G] вузлів.\n\nКожен вузол — це набір §oобластей-учасниць§! з однією §oцентральною§!. Рівень вузла (1–10) зростає від розвитку — фабрики, доки та інфраструктура. Центр дає більший приріст, ніж периферія.\n\nВузли дають основну частину доходу (ваш дохід з вузлів: [?caps_income|0] [GetCapTxt]). Вони складаються з §oрозвиткового доходу§! та §oторгового§!. Розвиток залежить від рівня вузла, а торгівля — від §oторгових маршрутів§!. Ви отримуєте частку торгового потоку через вузол ([modifier@caps_country_trade_modifier|%=]). У війні вузли можуть бути §oдеактивовані§! — тоді дохід зникає."
tutorial_caps.4.a:0 "Продовжити"
tutorial_caps.4.b:0 "Вийти"

tutorial_caps.6.t:0 "Каравани, не мінівени"
tutorial_caps.6.d:0 "Маючи вузли, гріх не використовувати економічну потугу. Кожен вузол може відправляти §oторгові маршрути§! до інших вузлів. Кількість маршрутів залежить від рівня вузла, фокусів, рішень і подій.\n\nМаршрути йдуть по §oзв’язках§! через безпечні ділянки Пустки. Вони також можуть з’явитись від фокусів/рішень. Щоб створити маршрут, потрібно:\n\n   -Немає чинного маршруту з §oджерела§!\n   -Не перевищено ліміт країни\n   -40 Політичної Влади\n   -Цей зв’язок нещодавно не змінювався\n\nМаршрут передає частину доходу розвитку з джерела — з бонусом за кожен маршрут — а меншу частку повертає назад. Вони тривають вічно, але змінюються лише раз на 120 днів. У війні маршрути руйнуються. Кількість маршрутів обмежена підтримуваними вузлами."
tutorial_caps.6.a:0 "Продовжити"
tutorial_caps.6.b:0 "Вийти"

tutorial_caps.7.t:0 "Не зовсім Ніколас Кейдж"
tutorial_caps.7.d:0 "Щоб краще відстежувати рух кришок по Пустці, на звороті кожної з них нанесена маленька карта. Ми не впевнені, хто це придумав, але доступ до цієї системи є через кнопку §oРізне§! на верхній панелі, поруч із логістикою.\n\n§oКарта торгових вузлів§! показує багато інформації! Пояснимо по порядку:\nЛіворуч — §oТорговий звіт§!. Тут міститься зведена інформація про дохід від розвитку, торгівлі та загальний дохід зі всіх контрольованих вузлів. Під ним — список ваших вузлів. Остання кнопка відкриває список усіх активних маршрутів §Yдо§! та §Yз§! ваших вузлів.\n\nУ центрі — мапа торгових вузлів, яку можна пересувати. Лівий клік виділяє зеленим торгові зв’язки, а помаранчевим — маршрути. Ці кольори використовуються в усьому інтерфейсі.\n\nПраворуч — вибраний вузол. Тут видно його дохід. Якщо обрати пов'язаний вузол — з’явиться короткий огляд і можливість прокласти новий маршрут."
tutorial_caps.7.a:0 "Продовжити"
tutorial_caps.7.b:0 "Вийти"

tutorial_caps.8.t:0 "Чесна торгівля"
tutorial_caps.8.d:0 "По Пустці діє безліч §oорганізацій§!, які полегшують торгівлю. Тепер вони створюють представництва в торгових вузлах. Якщо маршрут виходить із вузла, де вже є організація, вона може поширити вплив і на вузол-приймач.\n\n§oРинок§! повністю перероблено! Його можна відкрити через меню 'Різне'. Доступ до товарів більше не залежить від технологій, а операції відбуваються миттєво. При взаємодії з організаціями зростає §oдумка§! про вас. Висока думка означає кращі ціни на купівлю та продаж.\n\nТакож думку можна використати для послуг. Більшість контрактів вимагають певного рівня думки та часто — 'витратної думки', яку накопичують за безпосередню взаємодію. Загальну ж можна покращити, наприклад, призначивши лідера організації на державну посаду.\n\nКожна група має свою спеціалізацію. Можливо, варто запросити всіх у свою країну."
tutorial_caps.8.a:0 "Продовжити"

tutorial_caps.9.t:0 "Допомога поруч"
tutorial_caps.9.d:0 "Цей туторіал — короткий огляд механіки кришок. Щоб зробити систему максимально зрозумілою під час гри, було додано довідкові підказки для всіх головних елементів.\n\nЇх можна в будь-який момент увімкнути або вимкнути через розділ «Кришки» в Піп-бої.\n\nУвімкнути їх зараз?"
tutorial_caps.9.a:0 "Так, будь ласка!"
tutorial_caps.9.b:0 "Ні, дякую"
tutorial_enable_help_tooltips:0 "Увімкнути довідкові підказки"
caps_enable_help_hints_tt:0 "Увімкне §Gдовідкові підказки§! для всіх елементів інтерфейсу системи кришок"

tutorial_caps.performance.t:0 "Проблеми з продуктивністю?"
tutorial_caps.performance.d:0 "Гра гальмує? Канадці знову штурмують ваш процесор? У нас є рішення!\n\nПеред початком гри відкрийте «Користувацькі правила гри». Прокрутіть до розділу 'Об’єднувачі регіонів'. Тут можна об’єднати деякі регіони під єдину націю. Вона не зможе тренувати війська, атакувати або бути атакованою до 2279 року, тож це безпечний спосіб поліпшити продуктивність.\n\nПроте майте на увазі — це не передбачений спосіб гри в OWB. Це лише допоміжна опція для слабких ПК."
tutorial_caps.performance.a:0 "Корисно знати!"

####BANKRUPT LOC
caps_bankruptcy_modifier:0 "На межі банкрутства!"

bankrupt_events.1.t:0 "Обережність нас покинула!"
bankrupt_events.1.d:0 "Наші економічні радники повідомляють надзвичайно тривожні новини! Через нещодавні витрати наші скарбниці спустошені. Поточні прибутки не змогли покрити витрати, і ми надто швидко спалили свої резерви.\n\nМожна з упевненістю сказати, що ми наразі страждаємо від §R[?caps_bankrupcy_deficit_stab|=%+]§! стабільності та цілого списку інших негативних наслідків. Нам абсолютно необхідно докласти зусиль, аби вирішити цю кризу та відновити економіку!\n\nЯкщо ми затягнемо з вирішенням, наслідки можуть бути катастрофічними. Народ навіть може повстати!"
bankrupt_events.1.a:0 "[GetBankruptEventTT]"
bankrupt_event_1_tt_1:0 "Це надзвичайно тривожно."
bankrupt_event_1_tt_2:0 "Заліземо до резервного фонду."

bankrupt_events.2.t:0 "Заворушення!"
bankrupt_events.2.d:0 "Фінансова криза остаточно довела людей до межі. Без копійки в кишені та без надії, вони вийшли на вулиці з протестами, що швидко переросли в насильство. Вже пошкоджено важливу інфраструктуру, через що виникають логістичні проблеми з постачанням ресурсів. Місцева поліція не впоралась із ситуацією, тож нам довелось застосувати армію проти власного народу. Опір ще не повністю придушено, а збитки тільки почали підраховувати. Нам терміново потрібно стабілізувати економіку, інакше буде ще гірше."
bankrupt_events.2.a:0 "Будівельники приймають розписки?"
bankrupt_events.2.b:0 "Проживемо на рахунок рабів."
bankrupt_2_b_tt:0 "Раби: -200"

bankrupt_events.3.t:0 "Дезертирство в армії!"
bankrupt_events.3.d:0 "Ми вичавили зі своєї армії все можливе — і навіть більше. Тепер це дається взнаки. Офіцери повідомляють про тривожне зростання дезертирств. У нашій спробі відновити економіку та порядок, ми забули про оплату військовим. Усе більше солдатів тікає, прихопивши з собою спорядження.\n\nНаша безпека опинилась під загрозою. Якщо ми терміново не стабілізуємо ситуацію, нас можуть знищити як внутрішні заколоти, так і зовнішні вороги."
bankrupt_events.3.a:0 "Дезертири не гірші за економіку, правда ж?"
bankrupt_events.3.b:0 "Може, трохи 'блаженства' їм допоможе..."
bankrupt_3_b_tt:0 "Думка Мордіно: -50"

bankrupt_events.4.t:0 "Саботаж зброярень!"
bankrupt_events.4.d:0 "Єдине, що гірше за країну без армії — це країна з армією без зброї. І ми стрімко наближаємось до цього. Люди вже тривалий час обурюються через те, що навіть у кризу всі кошти йдуть на військо замість допомоги населенню. У відповідь вони почали розбирати заводи, влаштовувати страйки та знищувати виробничі потужності.\n\nМи ще маємо запаси зброї, але надовго їх не вистачить, особливо якщо почнеться війна. Єдиний вихід — якнайшвидше подолати фінансову кризу. Інакше наші війська підуть у бій з палицями... і з надією, що ворог сміятиметься замість стріляти."
bankrupt_events.4.a:0 "А ми ще думали, що дезертири — це погано..."

bankrupt_events.5.t:0 "Обвал ринку!"
bankrupt_events.5.d:0 "Після довготривалих потрясінь, кровопролиття та страждань, найгірше нарешті сталося. Наша національна економіка та її основи повністю зруйновані. Наслідки важко передбачити. Наче злоякісна пухлина, заворушення поширюються країною, і анархія, що довго панувала на вулицях, може остаточно перемогти порядок.\n\nНаші радники з похмурими обличчями визнають: усе відбувається у масштабах, що виходять за межі уяви, і громадяни живуть у страху та невизначеності. Враховуючи ситуацію, це може стати нашою реальністю. Але поки ми ще тут, ми маємо відбудувати економіку — цеглина за цеглиною. Щоб забезпечити надію для майбутніх поколінь, ми повинні віддати все, навіть якщо помремо в цьому процесі.\n\nМи почнемо з самого початку... ні. Ми почнемо з нуля!"
bankrupt_events.5.a:0 "Принаймні тепер можна рухатись лише вгору."
bankrupt_event_5_tt:0 "\nНадає тимчасове зниження вартості армії на 70%\n Зменшує прибуток на 50%"

bankrupt_events.6.t:0 "Склади зі зброєю розграбовані!"
bankrupt_events.6.d:0 "Вартові наших аванпостів повідомляють тривожні новини — запаси резервної зброї розграбовано! Цілі склади з боєприпасами та озброєнням зникли. Навіть найгірша, заіржавіла зброя була вкрадена! Ми підозрюємо, що до цього причетні або дезертири, або незадоволені громадяни, але довести щось неможливо.\n\nЯкщо ми терміново не візьмемо ситуацію з боргом під контроль і не стабілізуємо економіку, невинні люди можуть постраждати. Гірше того — це може перерости у повномасштабне повстання!"
bankrupt_events.6.a:0 "Збирайте всі війська, що лишились!"
bankrupt_events.6.b:0 "Може, [GetGunRunnerName] допоможе?"
bankrupt_6_b_tt:0 "Думка [GetGunRunnerName]: -50"

bankrupt_events.7.t:0 "Економічне відновлення"
bankrupt_events.7.d:0 "Наші економісти доповідають, що фінансова ситуація покращилася настільки, що можна скасувати тимчасове жорстке скорочення зарплат для військових. Це варто зробити якомога швидше — чим швидше ми повернемось до нормального стану, тим скоріше забудемо цей затяжний кошмар."
bankrupt_events.7.a:0 "Платіть — і війську, і людям — усе, що вони заслужили."

#### Flavor Event Loc ####
caps_bad_investment_idea:0 "Провалене вкладення"
caps_natural_disaster_idea:0 "Нещодавнє стихійне лихо"
caps_molerat_damage_modifier:0 "Пошкодження кротокрисами"
caps_caravan_event_modifier:0 "Каравани під загрозою"

caps_flavor_events.1.t:0 "Вкладення не виправдали себе"
caps_flavor_events.1.d:0 "Нещодавно до нас прийшла жінка з геніальною ідеєю: прикріпити маленькі коробки до кротокрисів, щоб доставляти повідомлення пустками! Більше ніяких кур'єрів, а кротокриси працюють за крихти.\n\nЄдина проблема — кротокрисам не подобається, коли до них чіпляють коробки. Шкода, що ми вже вклали кошти в пані Н. Принс!"
caps_flavor_events.1.a:0 "Списуємо збитки."
caps_flavor_events.1.b:0 "Ми не можемо собі цього дозволити! Попросіть Джеремі про маленьку позику..."

caps_flavor_events.2.t:0 "Стихійне лихо"
caps_flavor_events.2.d:0 "У нашій країні пройшов страшенний град! Згідно з повідомленнями, з неба падали крижини розміром з коготь смерті, пошкодивши поля, дороги, хатини і навіть статую нашого засновника.\n\nНарод просить допомоги — за біль, збитки та льодову тривогу. Що ми можемо дати?"
caps_flavor_events.2.a:0 "Дати все, що можемо."
caps_flavor_events.2.b:0 "Нічого немає, відправте загін охорони до статуї."

caps_flavor_events.3.t:0 "Щурі!"
caps_flavor_events.3.d:0 "Кротокриси заселили підземелля [mole_rat_damage_state.GetName]! Невідомо, як вони влаштували гніздо непомічено, але щонайменше 6 людей вже частково з'їдено.\n\nЗагинув лише один — чоловік на ім’я Джеремі. Хоч він і був банкіром, його смерть викликала обурення. Люди починають виїжджати."
caps_flavor_events.3.a:0 "Де 'рейдери', коли вони так потрібні?"

caps_flavor_events.4.t:0 "Засідка на караван"
caps_flavor_events.4.d:0 "Караван із товарами, що прямував між поселеннями поблизу [raided_state.GetName], був жорстоко атакований. Бандити не лише зупинили брамінів, а й вирізали всіх.\n\nОхоронці не бажають більше супроводжувати каравани, а торговці бояться втратити свій товар. Переслідування може трохи заспокоїти, але кров уже висохла."
caps_flavor_events.4.a:0 "Нічого вже не зробиш."
caps_flavor_events.4.b:0 "Ми хоча б спробуємо."

caps_flavor_events.5.t:0 "Переслідування"
caps_flavor_events.5.d:0 "Загін нашого ополчення виявив притулок бандитів, де ті планували наступну атаку. Після короткої сутички їх було схоплено.\n\nНа жаль, кілька сміливих бійців і їхній сержант Джеремі були смертельно поранені. Та попри втрати, віра у нашу безпеку відновлена. Ми навіть знайшли достатньо кришок, щоб купити золоту статую розміром з Джеремі."
caps_flavor_events.5.a:0 "Це було варто того."

caps_flavor_events.6.t:0 "Переслідування"
caps_flavor_events.6.d:0 "Наше ополчення знайшло бандитів, але не змогло їх зупинити. Кілька наших загинули під час атаки. Їхня жертва виявилась марною."
caps_flavor_events.6.a:0 "Наступного разу будемо готові."

caps_flavor_events.7.t:0 "Неспокій серед цивільних"
caps_flavor_events.7.d:0 "Зростає опір нашій присутності на нових землях. У [unrest_node.GetName] збираються групи, що стають дедалі нахабнішими й агресивнішими.\n\nНапруга досягла критичної точки — почались широкомасштабні руйнування."
caps_flavor_events.7.a:0 "Втручання тільки посилить опір."
caps_flavor_events.7.b:0 "Поставити їх на місце."

caps_flavor_events.8.t:0 "Акції ростуть"
caps_flavor_events.8.d:0 "Ми досі не впевнені, що таке індексний фонд, і чи взагалі він існує. Але попри поради нашого поважного радника Джеремі, це вкладення виявилось вдалим і зросло багатство нашої нації."
caps_flavor_events.8.a:0 "Бик, чи може Ведмідь?"

caps_flavor_events.9.t:0 "Крамниця свічок із рад-оленя"
caps_flavor_events.9.d:0 "У тихих околицях [business_boon_state.GetName] маленька сімейна крамниця справила справжній фурор! Вони продають свічки з лою рад-оленів, ароматизовані подрібненими зубами флоутера.\n\nДехто каже, що пахне малиново з нотками бергамоту. Інші — що чують тільки присмак П Р И Р Е Ч Е Н О С Т І. У будь-якому разі, справи йдуть на ура!\n\nНа щастя, власники сумлінно платять податки. Ми навіть самі могли б купити трохи. Дехто з радників, особливо Джеремі, міг би розслабитися з такою свічкою."
caps_flavor_events.9.a:0 "Наш народ процвітає."
caps_flavor_events.9.b:0 "Візьмемо 40... ящиків."
caps_good_business_modifier:0 "Бізнес на свічках із рад-оленя"

caps_flavor_events.10.t:0 "Перлина в нашій короні"
caps_flavor_events.10.d:0 "Під нашим правлінням [THIS.GetName] процвітає. Ми побудували міста, дороги, громади та мрії. Один із радників сьогодні гуляв [business_boon_state.GetName] і помітив, що це місце стало маяком у пустці. Хоча воно й не ідеальне, його недоліки надають характеру цій перлині нашої корони."
caps_flavor_events.10.a:0 "Справді неймовірно"
caps_crown_jewel_modifier:0 "Перлина Корони"

caps_flavor_events.11.t:0 "Таємний Соус"
caps_flavor_events.11.d:0 "Нещодавно ми почули про чоловіка, що називає себе просто — 'Т'. Він стверджує, що походить із далекої землі, якої немає на жодній карті Старого Світу.\n\nЗа його описом ми згадали древню країну великих воїнів — 'Швеція', але, судячи з вкрай роздратованого вигляду Т, це була помилка. Та все ж, гуляк приносить із собою таємницю. Найсмачніший, чорт забирай, рецепт домашнього соусу з татосів, який ми коли-небудь куштували! І він хоче поділитися!\n\nНаші найкращі кулінари швидко впровадили рецепт по всій країні. Останнім часом навіть з далеких земель і країв прибувають паломники, щоб лиш скуштувати краплю цієї магії."
caps_flavor_events.11.a:0 "Кажуть, він ще й пише книжки."
caps_swiss_tomatos_idea:0 "Швейцарський Соус"

caps_flavor_events.12.t:0 "Довоєнна фабрика кришок"
caps_flavor_events.12.d:0 "Наші розвідники натрапили на справжнє диво. Величезну фабрику довоєнного виробництва пляшкових кришок! І, на наше щастя, саме на цих шматочках металу базується наша валюта! Єєє!\n\nМожемо просто вивезти все додому й витратити (точно не на бухло). Або ж запечатати приміщення й зрівняти з землею. Обирай, [THIS.GetLeader]."
caps_flavor_events.12.a:0 "Достатньо, щоб у ванні плавати."
caps_flavor_events.12.b:0 "У друзки!"
caps_pre_war_stash_idea:0 "Довоєнна інфляція запасу"
kaboom_scripted_tt:0 "§RБАБАХ§!"

caps_flavor_events.13.t:0 "Нестабільний ринок халуп"
caps_flavor_events.13.d:0 "У пустці з’явилась нова професія — 'ріелтори'. Вони скуповують і продають халупи, без жодної логіки.\n\nЦе викликало невелике занепокоєння в регіоні, але, можливо, це непоганий спосіб витягнути з селян їхні кришки."
caps_shack_market_weak_idea:0 "Регульований ринок халуп"
caps_shack_market_idea:0 "Нерегульований ринок халуп"
caps_flavor_events.13.a:0 "Ча-чінг!"
caps_flavor_events.13.b:0 "Може трохи контролю не завадить..."

caps_flavor_events.14.t:0 "Бульбашка Халуп"
caps_flavor_events.14.d:0 "Занурившись у прибутки Big-Shack, ми привабили акул. Було побудовано багато халуп. Надто багато — продавати нікому, крім вигаданих майстрів свічок!\n\nРозкішні халупи тепер втрачають у вартості. Можливо, варто було втрутитися раніше..."
caps_shack_crash_idea:0 "Бульбашка Big-Shack"
caps_flavor_events.14.a:0 "У дитинстві я любив бульбашки..."

caps_flavor_events.15.t:0 "Листовоногий шпательязий мантозавр браміновий"
caps_flavor_events.15.d:0 "З’явилась нова мутована загроза — §RЛистовоногий шпательязий мантозавр браміновий§!. Ця мерзота виникла від прекрасного примарного богомола і тепер косить наших брамінів по всій країні.\n\nМетодів боротьби майже немає, але ми не втратимо надії."
caps_flavor_events.15.a:0 "Будемо давати раду, як зможемо."
caps_flavor_events.15.b:0 "Вогонь вирішує все."
caps_brahmin_plague:0 "§RЧума Листовоногого мантозавра§!"
leafy_footed_mantis:0 "\n§gЦей мутований богомол висмоктує зелено-кров’ю сік із брамінів. А браміни — основа караванів. Шкідник значно сповільнює рух — і, відповідно, торгівлю.§!"

caps_flavor_events.16.t:0 "Таємна м’ясна запіканка"
caps_flavor_events.16.d:0 "Знову ми чуємо про того самого 'Т'. З далекої землі, якої немає на картах.\n\nМи знову згадали про країну воїнів — 'Швецію', та судячи з погляду Т, він не звідти. Але цього разу він приносить найкращий рецепт м’ясної запіканки, що ми коли-небудь куштували!\n\nНаші кулінари одразу поширили рецепт по всій країні. Люди з далеких земель прибувають, аби лишень спробувати шматочок."
caps_flavor_events.16.a:0 "Кажуть, він ще й пише книжки."

caps_flavor_events.17.t:0 "Таємний бургер"
caps_flavor_events.17.d:0 "Ми знову чуємо про загадкового 'Т'. Ми певні, що десь уже його бачили... але він заперечує, і ми нічого не пам’ятаємо.\n\nТа цього разу він приносить найкращий рецепт бургера в історії пустки! Наші майстри м’яса вже впровадили його по всій країні.\n\nЗ далеких земель прибувають паломники, аби скуштувати цю насолоду."
caps_flavor_events.17.a:0 "Кажуть, він ще й пише книжки."

caps_flavor_events.18.t:0 "Зруйновані фабрики"
caps_flavor_events.18.d:0 "Під час розвідки руїн §Y[215.GetName]§! наші люди знайшли дещо вражаюче. Старий світ знав це місце з однієї причини — тепер і ми знаємо.\n\nПісля кількох днів розкопок ми дістались до залишків §cМоцарели§!, що пережили війну. Чистісінький сир і ще й з оригінальним рецептом із Розвеллу!\n\nЗ відновленим сирним виробництвом наші армії стануть сильнішими не лише тілом, а й духом!"
caps_flavor_events.18.a:0 "Піца знову в меню!"
caps_mozzerella_idea:0 "Розвеллське виробництво сиру"

caps_flavor_events.19.t:0 "Наш Майстер Кришок"
caps_flavor_events.19.d:0 "Економіка — не надто популярна тема серед бюрократів. Побудувати систему з нуля важко навіть для вчених, не кажучи вже про наших 'випускників'. Та попри все, наш головний майстер кришок вразив усіх — його фінансова хватка принесла чималий прибуток нашій нації."
caps_flavor_events.19.a:0 "Шкода, що він не ще й кухар..."
    
# Wild Wasteland Exclusive
caps_flavor_events.20.t:0 "Я Хочу Твої BAWLS"
caps_flavor_events.20.d:0 "Пустка Техасу має дякувати Гобарту С. Бупперту III та купці австрійських танцівників за свою найвеличнішу спадщину.\n\nУперше запущений у 1996 році посеред пляжного раю Саут-Біч, напій на основі гуарани миттєво захопив світ — від Берліна до Гонолулу. Якби не ті покидьки з Nuka-Cola, що зробили свій напій у три рази слабшим, ми б мали більше цього густого божественного варева для всіх. Але ні — їм треба було все зіпсувати, і Хобаррама мусила вчепитися кігтями в Техас, Арканзас та Оклахому, аби виштовхати звідти Nuka-Cola... і ВСЕ ОДНО ЗАЗНАЛА ФІАСКО!\n\nЧому ж ми не маємо більше BAWLS Guarana за межами цих земель, га!? BAWLS — це кайф! Ти можеш пити, їсти, грати, бити, копати, різати, смоктати, дути — все з BAWLS! У пустці нема життя без BAWLS! Я не залежний! Це ти хворий! Стривай, у тебе є BAWLS? Віддай мені всі свої BAWLS! Я ВИРІЖУ ЇХ ІЗ ТЕБЕ! КЛЯНУСЯ, ТИ СТАРИЙ ПЛУТАНО-ПІДСТУПНИЙ МУДАК! ВІДДАЙ МЕНІ СВОЇ BAWLS АБО Я ЇХ ВИРІЖУ!"
caps_flavor_events.20.a:0 "Я мушу захистити свої BAWLS!"

