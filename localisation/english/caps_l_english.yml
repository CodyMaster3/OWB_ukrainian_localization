caps_economic_bankrupcy_desc:0 "У нас немає грошей, ми приречені. Допоможіть."
caps_economic_instabillity: "Економічний крах"
caps_economic_instabillity_desc:0 "Following a prolonged period of fiscal crisis, our nation's economy has completely and utterly collapsed. Inflation runs rampant, research is impossible, and most new construction has ceased. It will take a long time for our economy to recover..." # (!)

