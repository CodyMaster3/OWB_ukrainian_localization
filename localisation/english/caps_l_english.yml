currency_laws:0 "Закон про валюту"
ncrdollar:0 "Долари НКР"
cesdenarius:0 "Денарій Легіону"
driedcacaobean:0 "Сушені какао-боби"
driedcacaobean_desc:0 "Ймовірно, ці боби походять з ферм Кавового Узбережжя. Вони даремні для агрокультури чи звичайного вживання, але символізують ресурсний потенціал і поширені на південь від Тлалока."
computerchip:0 "Комп’ютерні чіпи"
computerchip_desc:0 "Роботи не потребують їжі, але їм потрібна інфраструктура й оновлення. Надлишок чіпів можна обміняти на речі, коли не виходить отримати силою. А люди, хоч і не цінують їх, усе одно віддають."
bawlsguarana:0 "BAWLS Guarana"
bawlsguarana_desc:0 "BAWLS Guarana — кофеїновий напій, запущений у Маямі у 1996 році. Його популярність затьмарила конкуренція з Nuka-Cola у 2040-х, однак ексклюзивна угода з Vault-Tec врятувала бренд. Потім настала Велика війна — і все стало неважливо."
peso:0 "Песо"
canadiandollar:0 "Канадські долари"
canadiandollar_desc:0 "Те, що Луні повернувся в обіг, свідчить про колишню силу Королівства Манітоба. Сучасний стан Королівства свідчить про нинішню вартість валюти."
usdollar:0 "Долари США"
usdollar_desc:0 "Долар США після Великої війни став хіба що туалетним папером. Його використовують лише мрійники та Анклав. Щоб повернути його — треба мати неабияку силу."
genericcap:0 "Кришки від пляшок"

