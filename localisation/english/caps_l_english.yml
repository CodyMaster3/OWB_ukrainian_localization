currencyncrdollar_info:0 "Модифікатори:\n   Стабільність: §G+5%§!\n   Пасивні кришки: §G+7§!\n   Торгові тарифи: §G+10%§!\n\nНКР запровадила власну валюту на межі 23-го століття, почавши з монет, викарбуваних із золота. До 2241 року економіка НКР домінувала на Західному узбережжі, і монети стали загальноприйнятою валютою, яку використовували три великі сили: НКР, Місто-Сховище та Нью-Ріно. У ті часи кришки від пляшок стали сміттям в цих регіонах."

currencycesdenarius_info:0 "Модифікатори:\n   Стабільність: §G+5%§!\n   Пасивні кришки: §G+7§!\n   Прибуток кришок: §R-10%§!\n   Витрати кришок: §G-25%§!\n\nДенарій (срібний), із зображенням молодого Цезаря з одного боку та Цезаря, Джошуа Ґрема й Кальгуна — з іншого. Написи латиною: «Caesar Dictator» (Цезар Диктатор) спереду та «Magnum Chasma» (Велика Безодня, Гранд-Каньйон) ззаду. Монета вшановує перші перемоги молодого Цезаря на шляху до каньйону як диктатора племен."

currencydriedcacaobean_info:0 "Модифікатори:\n   Стабільність: §R-5%§!\n   Пасивні кришки: §G+9§!\n   Ефективність видобутку ресурсів: §G+6.00%§!\n   Споживчі товари: §Y+1.0%§!\n\nЧерез рідкість кавових зерен після Великої війни, сушені боби стали зручним засобом торгівлі. Їх прийняли як валюту держави на південь від Тлалока."

currencycomputerchip_info:0 "Модифікатори:\n   Стабільність: §G+2%§!\n   Пасивні кришки: §G+6§!\n   Думка щодо торгових угод: §R-6.00%§!\n   Макс. запас енергоблоків: §G+5.0%§!\n\nРоботи не дуже-то торгують, хіба що хардваром. Іноді ці чіпи можуть бути корисними — але нині далеко не всі хочуть мати справу з ними, як колись."

currencybawlsguarana_info:0 "Модифікатори:\n   Підтримка війни: §G+10%§!\n   Пасивні кришки: §G+14§!\n   Думка щодо торгових угод: §G+6.00%§!\n   Витрати кришок: §R+5%§!\n\nКофеїновий напій BAWLS Guarana — доказ одержимості людей до BAWLS. Колись одна така кришка вартувала в 100 разів більше за Nuka-Cola. Зараз цінність знизилась, але торговці все ще звертають увагу на їх походження.\n\nЛюди мусять заробляти, а заробляють вони з §BBAWLS§!"

currencyusd_info:0 "Модифікатори:\n   Пасивні кришки: §G+5§!\n\n"

currencycad_info:0 "Модифікатори:\n   Стабільність: §G+10%§!\n   Пасивні кришки: §G+2§!\n   Думка в торгівлі: §R-10%§!\n   Модифікатор доходу кришок: §R-10%§!\n   Вартість торгівлі з сюзереном: §G-20%§!\n   Мінімальний експорт: §G-20%§!\n\nКолись Канадський долар було знищено США, та його велично відродило Королівство Манітоба. Але занепад Королівства потягнув і занепад валюти."

currencypeso_info:0 "Модифікатори:\n   Стабільність: §G+5%§!\n   Підтримка війни: §G+5%§!\n   Пасивні кришки: §G+12§!\n\nЧерез сотні років песо знову у вжитку під прапором Мексиканської Республіки, відроджуючи віру в те, що Мексика знову постане під пильним оком Леонардо Мори."

currencytexdollar_info:0 "Модифікатори:\n   Пасивні кришки: §G+8§!\n   Ефективність видобутку ресурсів: §G+3.00%§!\n   Споживчі товари: §Y-1.0%§!\n\n"

currencychargecard_info:0 "Модифікатори:\n   Пасивні кришки: §G+12§!\n   Споживчі товари: §Y-3.0%§!\n\nРозроблена EPA за підтримки Greenway Hydroponics, ця система «енергокредитів» оцінює товар за обсягом енергії, необхідним для його виробництва. Хоча до війни ідея не прижилась, у пустках вона отримала друге життя."

currencygenericcap_info:0 "Модифікатори:\n   Пасивні кришки: §G+10§!\n\nУ Новій Каліфорнії кришки стали зручною валютою через свою рідкість — технології виготовлення були втрачені під час Великої війни, що унеможливило підробку. Їх вартість прив’язана до вартості води. Також використовуються на Східному узбережжі. Найперші згадки — Аппалачі, 2106 рік."


