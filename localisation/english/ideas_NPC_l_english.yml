l_english:
nf_npc.1.t:0 "Старий Святий Ніколай?"
  nf_npc.1.d:0 "Оскільки рік добігає кінця, до Міністерства Лойда наближається один із найсвятіших періодів — Різдво! Товариші по всьому нашому чудовому соціалістичному раю почали ставити ялинки та чекати на народження нашого Спасителя! Проте починають ширитися чутки про стару капіталістичну традицію міфічного Санта-Клауса. У відповідь Лойд уже почав розсилати брошури про справжнього Святого Ніколая, який приносив іграшки слухняним християнським хлопчикам і дівчаткам радянської нації.\n\nДивно, але ці нові брошури викликали ажіотаж. Здається, у нашій славній країні оселилися нові люди. Дивна компанія з далекої півночі, якщо вірити чуткам: маленькі гноми і навіть ведмеді, що говорять, на чолі з веселим дідуганом у червоному пальто, який називає себе «Товаришем Ніколаєм»! Люди починають пов'язувати цю нову веселу компанію з брошурою та старим капіталістичним міфом, поєднуючи їх.\n\nЩоб довести свою справжність, Товариш Ніколай тижнями роздає льодяники та подарунки всім, кого зустрічає. Дивно, звідки він їх бере, адже фабрики для виробництва таких речей немає. Однак він привернув увагу Лойда. Здається, нашому лідеру подарували персоналізовану Біблію, перетворивши його на вірянина. Усі дивуються: країна збожеволіла чи це різдвяне диво?"
  nf_npc.1.a:0 "Він дійсно Святий Ніколай!"

  nf_npc.2.t:0 "Товариш Ніколай приходить у місто"
  nf_npc.2.d:0 "За одну ніч відбулася дуже святкова революція: Лойд відійшов у тінь, щоб старий Товариш Ніколай вийшов на перший план. Веселий старий марксист уже почав шукати способи збільшити виробництво подарунків! Його магічні сили мають межу, якщо він хоче подарувати щось усім хорошим маленьким пролетарським дітям. Проте подарунки мають сенс лише тоді, коли маленьких товаришів звільнила революція! Тому Товариш Ніколай опинився в глухому куті: він може або будувати фабрики для створення більшої кількості іграшок, або будувати фабрики для звільнення дітей пустки. Що ж йому робити?"
  nf_npc.2.a:0 "Іграшки піднімуть їм настрій!"
  nf_npc.2.b:0 "Ми маємо звільнити бідних маленьких товаришів!"

  nf_npc.3.t:0 "Подарунки під ялинкою"
  nf_npc.3.d:0 "Оскільки Різдво стрімко наближається, Товариш Ніколай має вирішити, які подарунки він доставить своїм партизанам по всій новій Полярній Раді! Прогулюючись своєю майстернею й оглядаючи нові іграшки та боєприпаси, які робили його ельфи, дві речі особливо привернули його увагу. Перша — це стандартна гвинтівка, яка підійде будь-якому сповненому надій комуністу в цей революційний сезон. Друга — купа червоно-білих шашок динаміту, яка змусить тікати навіть найзатятіших капіталістичних свиней! Товариш Ніколай стоїть і дивиться на ці дві речі, намагаючись прийняти рішення."
  nf_npc.3.a:0 "Всі хочуть гвинтівку!"
  nf_npc.3.b:0 "Але динаміт..."

  nf_npc.4.t:0 "Ельфи Ніколая"
  nf_npc.4.d:0 "Поки Ніколай вдруге перевіряє свій список, він помічає, що за межами його майстерні ельфи вже тренуються до революції! «Як мило», — думає Ніколай, спостерігаючи, як вони стріляють зі своїх маленьких гвинтівок і знищують манекени капіталістичних свиней! Проте один ельф підходить і ставить Ніколаю запитання: чи варто їм використовувати оленів у своїх операціях, чи краще залишитися при своїх спеціальних льодяниках? З одного боку, олені допоможуть швидше поширити революцію, але з іншого — ці спеціальні льодяники роблять ельфів щасливішими."
  nf_npc.4.a:0 "Поширмо революцію швидше!"
  nf_npc.4.b:0 "Льодяники! Зрештою, ми маємо нести радість!"

  nf_npc.5.t:0 "Дух теперішнього комунізму"
  nf_npc.5.d:0 "Здається, дивні чутки про міфічного сивобородого діда з ельфами — правда. Сьогодні ми отримали листа від цього так званого «Товариша Ніколая». Він заявляє, що ми очолюємо його Список Слухняних? Ну, хай там що це означає, він також питає, чи не бажаємо ми приєднатися до його зусиль у поширенні «Різдвяної Революції». Гадки не маю, що таке Різдво, але він здається хорошим товаришем зі щасливими робітниками та гарними умовами праці."
  nf_npc.5.a:0 "Звісно, дістаньмо трохи молока та печива."
  nf_npc.5.b:0 "Що таке взагалі це Різдво?"

  nf_npc.6.t:0 "В надії, що Товариш Ніколай скоро буде тут"
  nf_npc.6.d:0 "Доміна приймає наш подарунок! Товариш Ніколай мав щодо неї рацію, ось чому вона очолює Список Слухняних! Наші ельфи вже почали вирушати до їхньої комуни, розвішувати гірлянди та ставити ялинки. Натомість робітники подарували Товаришу Ніколаю дивовижне, колективно приготоване печиво та молоко! Завершімо нашу роботу і призначимо товариша Бурана керувати прийдешніми подіями!"
  nf_npc.6.a:0 "І вам веселого червоного Різдва!"
  dominia_accepts_us:0 "Доміна приймає нас"

  nf_npc.7.t:0 "Він знає, хто був слухняним, а хто ні"
  nf_npc.7.d:0 "Вони вирішили відмовитися від наших подарунків! Вони обрали шлях Скруджів, і тому тепер ми змушені нести їм свято силою! Робітники тепер страждатимуть через помилку Доміни! Її одразу занесуть до Списку Неслухняних! Покличте Товариша Бурана! Зберімо ельфів і покажімо їм справжній дух Різдва!"
  nf_npc.7.a:0 "Ні кроку назад!"
  dominia_rejects_us:0 "Доміна відкидає нас"

  nf_npc.8.t:0 "Рудольф — радянський олень"
  nf_npc.8.d:0 "Нещодавно в глибинах стійл нашої оленячої ферми сталося диво. Народився олень зі світливим червоним носом! Почувши це, Товариш Ніколай пішов подивитися на молодого оленя. Відтоді він став новим символом Різдва! Він ходить різними районами, показуючи дітям свій червоний ніс і розповідаючи казки про магію Маркса та Різдва, яка дозволила цьому диву статися!"
  nf_npc.8.a:0 "Ленін би розплакався від такого видовища!"

  nf_npc.9.t:0 "Очолює Список Неслухняних"
  nf_npc.9.d:0 "Велика Холодна війна добігла кінця, Сенатор Клаус за ґратами, де йому і місце! Його судитимуть перед усіма робітниками, яких він обдурив, і покарають за злочин жадібності в сезон щедрості! Щоб покінчити з цим самозванцем раз і назавжди, було побудовано нову будівлю суду та шибеницю. Шибениця, збудована його ж фальшивими ельфами, має спеціальний льодяниковий зашморг, щоб самозванець не втік, якщо його визнають винним.\n\nСуд відбувся напередодні Різдва: коли фальшивий Клаус увійшов до робітничого суду, його зовнішній вигляд був спотворений правосуддям трудящих. Йому зголили бороду, і він мав два синці під очима — кольору вугілля, на яке він заслуговував. Суд був коротким, оскільки цей Сенатор Клаус не зміг свідчити через страх перед кривоприсягою! Після завершення суду його повели до червоно-зеленої шибениці. Незабаром льодяникова мотузка хруснула, і фальшивий Клаус завис на ній, гойдаючись на вітрі й залишаючи по собі атмосферу урочистості. Однак невдовзі Товариш Ніколай виніс печиво та подарунки! Час Різдва настав, забудьмо про цього самозванця!"
  nf_npc.9.a:0 "Щасливого Різдва!"

  nf_npc.10.t:0 "Як Товариш украв Різдво"
  nf_npc.10.d:0 "Усі мешканці пустки дуже любили Різдво, але Товариш Ніколай, який жив на північ від пустки, його не терпів! Він бачив у нашій дивовижній святковій пригоді лише гидоту! І поки цей Товариш поширював свої «різдвяні» веселощі пусткою, справжній Санта-Клаус, Сенатор Клаус, був зайнятий на Північному полюсі, роблячи іграшки та намагаючись виправити ВРЕ (з третього разу точно вийде, так?). Поки Сенатор гнув спину за своїм верстаком, із заметілі забіг ельф.\n\n«Санто! Санто! Хтось намагається видати себе за тебе!» — вигукнув маленький ельф.\n\nСтарий веселий Сенатор Клаус відірвав погляд від іграшок і подивився на юного ельфа. Вставши з лави, Сенатор опустився на коліна, щоб поділитися святковою мудрістю.\n\n«Ну що ж, Гермі, здається, нам треба готувати сани. Є кілька комуністів, яким вкрай не вистачає свинцю в організмі.»\n\nГермі розвернувся і побіг у сніг до інших оленів, хапаючи дзвіночки на ходу. Сенатор Клаус тим часом повернувся до свого будинку. Відчинивши шафу у своїй спальні, старий Сенатор побачив свій червоний костюм: чистий і готовий до дій. Схопивши старий костюм, Сенатор Клаус зітхнув і сказав: «Схоже, ці комуністи ніколи не вчаться. Не можна просто так зіпсувати Різдво»."
  nf_npc.10.a:0 "Хо-хо-хо, матір вашу!"

  nf_npc.11.t:0 "Очолює Список Неслухняних"
  nf_npc.11.d:0 "Велика Холодна війна добігла кінця, Товариш Ніколай за ґратами, де йому і місце! Його злочину з викраденням Різдва покладено край, і він постане перед судом за свої дії! База ВПС Макартур тепер стала імпровізованою в'язницею для цього веселого брехуна. Розстрільна команда вже готує зброю до зустрічі з Товаришем.\n\nЗ наближенням Святвечора Сенатор Клаус наказав розстріляти фальшивого Санту, перш ніж той піде розносити свої подарунки пусткою! Товариш Ніколай до останньої секунди твердив, що він справжній Санта і що в нього навіть є Рудольф — червононосий олень! Однак ніхто з ельфів не слухав, готуючи зброю. Ніколай продовжував говорити, а потім — бах-бах-бах. Тепер залишився тільки один Санта: Сенатор Клаус. Після того як червоного Санту закопали в багнюку, де йому й місце, Сенатор Клаус злетів у небо, щоб знову поширювати різдвяний настрій!"
  nf_npc.11.a:0 "Щасливого Різдва!"

  #### Focus
  NPC_nikolai_start:0 "§tЧервоне Різдво§!"
  NPC_nikolai_start_desc:0 "Годинник відлічує час, і до Різдва його залишається все менше! Тепер, коли Товариш Ніколай нарешті став головним, ми маємо залучити ельфів до роботи в прийдешній святковий сезон. Проте ми повинні вибрати, на чому їм зосередитися!"

  NPC_nikolai_middle:0 "§tРіздвяний шопінг§!"
  NPC_nikolai_middle_desc:0 "Різдво порожнє без красиво запакованих подарунків під ялинкою, навіть у Полярній Раді. Товариш Ніколай почав думати, що подарувати своїм товаришам по всій пустці. Вибір нелегкий, а час спливає!"

  NPC_nikolai_end:0 "§tМаленькі помічники Ніколая§!"
  NPC_nikolai_end_desc:0 "Поки Товариш Ніколай складає та перевіряє свій список, самі ельфи беруться до роботи. Вони почали тренування до святкової революції!"

  NPC_batford_brigade:0 "§tПоширення Різдвяного Настрою§!"
  NPC_batford_brigade_desc:0 "Товариш Ніколай, будучи веселим і щедрим чоловіком, вирішив подарувати революцію всім дітям пустки! Перша на черзі — Бригада Батфорда: їхня жахлива військова хунта — не місце для дітей! Незабаром вони розпакують революцію просто під своїми ялинками."

  NPC_uranium_city:0 "§tДля різдвяних гірлянд§!"
  NPC_uranium_city_desc:0 "Без різдвяних гірлянд різдвяна країна чудес Ніколая здається порожньою! Щоб розв'язати цю проблему, ми маємо піти й перерозподілити уран з Уранового Міста!"

  NPC_governate_stoon:0 "§tКапіталістичні свині§!"
  NPC_governate_stoon_desc:0 "Ми не можемо терпіти кордон із такою відверто капіталістичною нацією! Те, як вони ставляться до своїх робітників, зовсім не личить цьому сезону щедрості! З ними треба розібратися негайно!"

  NPC_iron_confederacy:0 "§tНеправильна Рада§!"
  NPC_iron_confederacy_desc:0 "Залізна Конфедерація все робить неправильно! Конфедерація заліза? Ні! Це має бути Рада веселих товаришів, які поширюють різдвяний настрій, а не залізо!"

  NPC_polar_dipolmacy:0 "§tПриклад Ніколая§!"
  NPC_polar_dipolmacy_desc:0 "Якщо ми хочемо поширювати різдвяний настрій, треба починати з самих верхів! Товариш Ніколай — сяйлива зірка нашої ради! Він сповнений лише печивом від робітників і колективно здобутим молоком. Не забудьте про його теплу посмішку! Його чарівність безмежна!"

  NPC_reach_out_to_vermilion:0 "§tОчолює Список Слухняних§!"
  NPC_reach_out_to_vermilion_desc:0 "На південь від нас розташована комуна Верміліон-Вейнрайт, яка очолює наш Список Слухняних! Це чудова комуна, повна щасливих робітників, але їм бракує різдвяного настрою! Треба зв'язатися з ними і дізнатися, чи не збираються вони вже ставити ялинки!"

  NPC_vermilion_accepts:0 "§tПодарунки для всіх робітників!§!"
  NPC_vermilion_accepts_desc:0 "Доміна Джур схаменулася і дозволила нам додати трохи різдвяного настрою. Вулиці Верміліона тепер прикрашені гірляндами та ялинками, готовими до Різдва!"

  NPC_vermilion_rejects:0 "§tЦі кляті Скруджі!§!"
  NPC_vermilion_rejects_desc:0 "Здається, Доміна Джур — справжній Скрудж! Її перемістили до Списку Неслухняних! Проте ми не можемо дозволити, щоб її народ страждав у цьому списку через неї. Звільнімо їх і виправмо ситуацію!"

  NPC_polar_advancements:0 "§tПолярний Експрес§!"
  NPC_polar_advancements_desc:0 "Наша нова рада відрізана від світу; можливо, Ніколаю й не потрібна допомога в пересуванні, але вона потрібна його товаришам! Щоб допомогти нашим чудовим товаришам, ми відкриємо «Полярний Експрес» для перевезення робітників нашою країною!"

  NPC_elf_workshops:0 "§tМайстерні Товариша§!"
  NPC_elf_workshops_desc:0 "Сили Товариша Ніколая мають межу! Якщо ми хочемо поширити різдвяний настрій і революцію, ми повинні змусити ельфів працювати. Вони відкриють нові майстерні для розширення виробництва!"

  NPC_elf_work_ethic:0 "§tРіздвяний дух§!"
  NPC_elf_work_ethic_desc:0 "Здається, ельфи мають власну магію! Їхня здатність будувати майстерні просто неперевершена! Схоже, різдвяний дух починає охоплювати нашу маленьку раду."

  NPC_elf_knowledge:0 "§tЕльфійське мислення§!"
  NPC_elf_knowledge_desc:0 "Здається, ельфи вже з нетерпінням чекають на наступне Різдво! Вони створюють нові креслення іграшок та боєприпасів для революції наступного сезону."

  NPC_holy_jolly_training:0 "§tСписок знає все§!"
  NPC_holy_jolly_training_desc:0 "Товариш Ніколай відомий своїми двома Списками, але мало хто знає, хто саме займається його Списком Неслухняних. Це група спеціально навчених ельфів, яких відправляють із певними іменами, щоб, так би мовити, доставити «вугілля»..."

  NPC_loid_tanks:0 "§tСани Лойда§!"
  NPC_loid_tanks_desc:0 "Хоча Лойд більше не лідер нашої ради, його старі танки все ще брязкають гусеницями. У Товариша Ніколая виникла ідея перетворити ці старі танки на нові сани! Готові рознести революцію по всій пустці!"

  NPC_elf_foot_soldiers:0 "§tЕльфійська опора§!"
  NPC_elf_foot_soldiers_desc:0 "Ми не можемо поширювати революцію та різдвяний настрій без ельфів! Ми не маємо про це забувати, тому повинні поставити їх в авангарді нашої революції!"

  NPC_stampede:0 "§tКінні язичники§!"
  NPC_stampede_desc:0 "На південь від нас лежать землі єресі та язичництва! Вони скачуть на конях по рівнинах, не знаючи істини різдвяного духу революції! Час розв'язати цю маленьку проблемку."

  NPC_reindeer_games:0 "§tОленячі ігри§!"
  NPC_reindeer_games_desc:0 "Здається, ельфам сподобалися південні землі. Вони вздовж і впоперек перетинають рівнини на своїх «оленях» (або ж танках). Вони облаштовують нові майстерні для цих «оленів», що дало нам новий надлишок!"

  NPC_rudolph:0 "§tЧервононосі олені§!"
  NPC_rudolph_desc:0 "Здається, сталося дещо цікаве, можна сказати, радянське диво..."

  NPC_freed_workers:0 "§tДар визволення§!"
  NPC_freed_workers_desc:0 "Робітники достатньо настраждалися під владою цих язичників! Їх буде благословлено різдвяним духом і правами трудящих!"

  NPC_coal_miners:0 "§tПанчохи, повні вугілля§!"
  NPC_coal_miners_desc:0 "Ми не можемо зараз забувати про важливість вугілля! Хоча Товариш Ніколай — дуже щедрий чоловік, все ще є ті, хто хоче піти проти нашого різдвяного духу! Ці люди не заслуговують нічого, крім вугілля! До того ж, це дуже гарне джерело енергії для майстерень іграшок!"

  NPC_part_time_elves:0 "§tЧим більше, тим веселіше§!"
  NPC_part_time_elves_desc:0 "Схоже, наша популяція ельфів почала зростати! Ми безмежно раді цій новині, адже незабаром матимемо нових ельфів, готових поширювати революцію ще далі!"

  NPC_cold_war:0 "§tХолодна війна§!"
  NPC_cold_war_desc:0 "Здається, ми привернули чиюсь увагу. З півдня дійшли чутки, що там є інший чоловік, ще старіший і веселіший за Товариша Ніколая! «Неможливо!» — бурмочуть усі наші ельфи. Але ким би він не був, схоже, битва неминуча!"

  NPC_capitalist_allure:0 "§4Капіталістична спокуса§!"
  NPC_capitalist_allure_desc:0 "Здається, ви обрали місце в Списку Неслухняних! Як ви могли відвернутися від робітників і Товариша Ніколая? Геть звідси!"

  NPC_uniting_the_workers:0 "§tОб'єднання революційного духу§!"
  NPC_uniting_the_workers_desc:0 "Канадські робітники розділилися через ці жахливі форми нашої справжньої революції! Ми не можемо дозволити їм і надалі триматися цих хибних переконань! Ми підемо й об'єднаємо їх самі!"

  NPC_ending_capitalist_influence:0 "§tКапіталістичний винахід§!"
  NPC_ending_capitalist_influence_desc:0 "Капіталістичні свині винайшли таку ганьбу для людства! Вони намагалися відтворити людство в металі? Як навіть капіталістичні свині могли бути настільки дурними! Ми відправимо цих роботів до пекла, де їм і місце! З їхнього боку це зовсім не по-різдвяному."

  NPC_preparing_for_war:0 "§tПолярна Визвольна Армія§!"
  NPC_preparing_for_war_desc:0 "Час настав! Товариш Ніколай зібрав свою нову веселу групу робітників, готових і охочих поширювати різдвяний дух у кожен куточок пустки!"

  NPC_elvish_conscription:0 "§tБільше ельфів... ЩЕ БІЛЬШЕ ЕЛЬФІВ§!"
  NPC_elvish_conscription_desc:0 "Війна з фальшивим Сантою наближається, і Товариш Ніколай відчуває тиск. Його армія все ще недоукомплектована, не вистачає ельфів, щоб заповнити лави! Для розв'язання цієї проблеми робітників перевели з фабрик до казарм."

  NPC_elvish_guns:0 "§tВід вугілля до АК§!"
  NPC_elvish_guns_desc:0 "Завдяки повному виробництву на вугільних шахтах ми використаємо цей надлишок вугілля, щоб зробити ще більше АК! Від шахт до генераторів: енергія з чорного каменю живитиме нашу різдвяну революцію!"

  NPC_holiday_guard:0 "§tСвяткова Гвардія§!"
  NPC_holiday_guard_desc:0 "З нових робітників, яких призвали до ельфійської армії, буде сформована нова Святкова Гвардія. Вона стане другою за силою після нашого власного Комісаріату."

  NPC_let_the_bombs_fly:0 "§tЧас доставити трохи вугілля§!"
  NPC_let_the_bombs_fly_desc:0 "Час настав: фальшивого капіталістичного Санту-свиню буде поставлено на коліна. Він отримає вугілля, якого так сильно потребує!"

  NPC_senator_trial:0 "§tСуд над Сенатором Клаусом§!"
  NPC_senator_trial_desc:0 "Після всіх його капіталістичних гріхів його нарешті спіймав Товариш Ніколай. Він постане перед робітниками за свої злочини проти різдвяного духу!"

  NPE_year_without_santa:0 "§4Рік без Санта-Клауса§!"
  NPE_year_without_santa_desc:0 "Минуло багато часу відтоді, як пустці дарували трохи святкового настрою. Схоже, за нашої відсутності якийсь самозванець спробував зайняти наше місце..."

  NPE_cold_war:0 "§4Холодна війна§!"
  NPE_cold_war_desc:0 "Ці дурні комуністи поширюють своє власне збочене бачення Різдва. Ми маємо діяти швидко і поширити справжній різдвяний дух, поки не програли битву!"

  NPE_american_properpty:0 "§4Наші старі друзі§!"
  NPE_american_properpty_desc:0 "На щастя, у нас є кілька друзів на кордоні. Старі американські ШІ допоможуть нашій контрреволюції! Незабаром вони повернуться під наше крило, дотримуючись різдвяного духу та Американського Шляху!"

  NPE_southern_front:0 "§4Діти Пустки§!"
  NPE_southern_front_desc:0 "На південь від нас живе купа мешканців пустки, які поклоняються якимось дивним культам. Однак ми не в тому становищі, щоб обирати, хто отримає різдвяний дух. Тож доведеться прикусити язика і забруднити руки цього різдвяного сезону."

  NPE_preparing_for_war:0 "§4А ось і Санта-Клаус§!"
  NPE_preparing_for_war_desc:0 "Знову настав час поширювати різдвяний настрій по пустці! Але цього разу нам спочатку треба розібратися з комуністами! Незабаром ми покажемо їм хибність їхнього шляху!"

  NPE_elvish_conscription:0 "§4Американські новобранці§!"
  NPE_elvish_conscription_desc:0 "Анклав знову підтримує нашу місію! Цього року вони були дуже щедрі до нас, особливо громадяни Макартура. Вони масово записуються добровольцями, щоб приєднатися до боротьби з клятими комуністами!"

NPE_elvish_guns:0 "§4Боєприпаси Гермі§!"
  NPE_elvish_guns_desc:0 "Наш заступник командувача Гермі був чудовим ельфом цього року! Він зміг створити великий надлишок гвинтівок для нашої нової армії!"

  NPE_holiday_guard:0 "§4Ельфи Анклаву§!"
  NPE_holiday_guard_desc:0 "Новобранці, яких ми отримали від Анклаву, будуть організовані в спеціальні ельфійські дивізії. Гермі особисто тренуватиме їх, щоб вони розібралися з будь-якими комуністами, які трапляться їм на шляху."

  NPE_let_the_bombs_fly:0 "§4Чорне Різдво§!"
  NPE_let_the_bombs_fly_desc:0 "Очікування закінчилося, настав час зафарбувати це Різдво в чорний колір. Ми відправимо Гермі, нашого Щасливого Сина, щоб він розібрався з цими комуністами раз і назавжди. Скоро Різдво буде врятовано від цього Товариша Ніколая!"

  NPE_senator_trial:0 "§4Суд над Товаришем Ніколаєм§!"
  NPE_senator_trial_desc:0 "Різдво врятовано! Тепер ми маємо розібратися з цим Товаришем Ніколаєм; настав час покінчити з червоною загрозою раз і назавжди!"

  NPE_senator_plan:0 "§4Маленькі помічники Санти§!"
  NPE_senator_plan_desc:0 "Сенатор Клаус завжди має своїх маленьких помічників. Генерал Зима та сержант Гермі готові вийти вперед і очолити війська! Товариш Ніколай нічого не зможе їм протиставити!"

  NPE_senator_workshops:0 "§4Веселі лінії постачання§!"
  NPE_senator_workshops_desc:0 "Сенатор Клаус може бути чарівним, але навіть він знає про важливість ліній постачання! По всій нашій новій землі будуть побудовані нові залізниці, щоб відправляти припаси та війська на новий фронт!"

  NPE_senator_workshops_mil:0 "§4Майстерні Сенатора§!"
  NPE_senator_workshops_mil_desc:0 "Щоб виробити достатньо зброї для прийдешньої війни, необхідно побудувати майстерні! Різдвяна магія має свої межі: ви знаєте, як важко магічним чином створити гвинтівку? Дуже. Це дуже важко."

  NPE_senator_workshops_civ:0 "§4Більше подарунків для Списку Слухняних§!"
  NPE_senator_workshops_civ_desc:0 "Хоча боєприпаси дуже важливі, ми не можемо забувати про справжню мету Різдва! Ми повинні мати достатньо подарунків для великої ночі. Коли ми врятуємо Різдво від брудних комуністів, у нас також має бути достатньо подарунків для Списку Слухняних Сенатора!"

  NPE_senator_chicago:0 "§4Наші виборці§!"
  NPE_senator_chicago_desc:0 "Санта-Клаус також є Сенатором від Анклаву. Він має не лише знову рятувати Різдво, але й дбати про своїх виборців. Після всіх років вірної служби Анклаву це починає приносити плоди! Чикаго запропонувало допомогу нашій справі: вони також хочуть врятувати Різдво!"

  NPE_senator_chicago_pa:0 "§4Подарунки з Чикаго§!"
  NPE_senator_chicago_pa_desc:0 "Зазвичай подарунки роздає Сенатор Клаус, але цього разу він сам їх отримує! Чикаго надіслало спеціальну силову броню для екіпірування наших ельфів. Ці особливі костюми вже роздають найвидатнішим ельфам."

  NPE_senator_chicago_veterans:0 "§4Святкові робітники§!"
  NPE_senator_chicago_veterans_desc:0 "Різдво — це завжди напружена пора року! Тому старому Сенатору Клаусу потрібно передати частину роботи сезонним робітникам. Цього року з Чикаго прибули ветерани Анклаву, щоб вибити кілька комуністичних зубів."

  NPE_senator_own_gifts:0 "§4Мені? Та не варто було§!"
  NPE_senator_own_gifts_desc:0 "Ще один подарунок прибув з Чикаго! Нам повітрям доставили новенькі плазмові гвинтівки. Гермі вже почав тренування з цією зброєю, щоб підготуватися до майбутньої війни."

