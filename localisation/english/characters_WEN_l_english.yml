WEN_MAYOR_MARIA_NAME:0 "Мер Марія"
WEN_MAYOR_MARIA_DESC:0 "Марія – улюблена лідерка... хоча це сильне слово, бо ще кілька років тому її ненавиділи та зневажали. Коли бойовий загін Моторних із Вісімдесятників уперше прибув, Марія була мером Вендовера – і зробила найнеочікуваніше й найнеприйнятніше з усього: впустила їх і привітала з розпростертими обіймами як нових володарів. Через це вона втратила все – свою посаду, любов людей і саме місто.\n\nАле тепер, коли Вісімдесятники зазнали поразки, тільки Вендовер може сказати, що, попри окупацію, вони не лише уникнули грабунку – Флеґмен навіть витратив купу кришок на розвиток свого «паркінгу». Тепер усі визнають передбачливість і мудрість мера й нетерпляче чекають, як вона поведе місто вперед тепер, коли воно знову вільне."