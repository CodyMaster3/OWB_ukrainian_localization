 #Decisions
  vault_geck_13:0 "Пошкоджений ГЕК"
  vault_15_heritage:0 "Об'єкт спадщини Сховища 15"
  vault_15_heritage_desc:0 "Багато з найвпливовіших культур пустки зародилися саме тут, у Сховищі 15. Хани, Гадюки, Шакали та, звісно ж, Нова Каліфорнійська Республіка. Хоча не всі з них дожили до наших днів, важливо мати можливість озирнутися в минуле й побачити, з чого почалися такі важливі кроки в постядерній історії Америки.\n\n§CЦЕ ПОВІДОМЛЕННЯ НАДАНЕ ВАМ СИСТЕМАМИ «ВОЛТ-ТЕК»§!"
  vault_rebuilding:0 "Реставрація Сховища"
  vault_21_economy:0 "Експлуатація Сховища 21"
  vault_21_economy_desc:0 "Тоді як для багатьох азартні ігри — це порок, для інших — це можливість! Сховище 21 знову стало процвітаючим казино та курортом, яким воно було до війни, і дозволити цьому пропасти марно було б просто поганим бізнесом.\n\n§CЦЕ ПОВІДОМЛЕННЯ НАДАНЕ ВАМ СИСТЕМАМИ «ВОЛТ-ТЕК»§!"
  vault_22_research:0 "Дослідження носіїв спор"
  vault_22_research_desc:0 "Хоча «Волт-Тек» приписує створення носіїв спор Великій Горі, саме «Волт-Тек» вигадала геніальну ідею помістити їх у сховище. Вони поширилися аж до Національного парку Зайон і, з кількома модифікаціями геному спор, могли б бути дуже корисними як запилювачі.\n\n§CЦЕ ПОВІДОМЛЕННЯ НАДАНЕ ВАМ СИСТЕМАМИ «ВОЛТ-ТЕК»§!"
  vault_70_data:0 "Культурні дані Сховища 70"
  vault_70_data_desc:0 "Хоча відновлення терабайтів даних зі зруйнованого сховища — нелегке завдання, вчені та інженери «Волт-Тек» завжди готові до викликів!\n\n§CЦЕ ПОВІДОМЛЕННЯ НАДАНЕ ВАМ СИСТЕМАМИ «ВОЛТ-ТЕК»§!"
  vault_29_diana:0 "Настанови Діани"
  vault_29_ZAX:0 "Аналітика ZAX"
  vault_29_ZAX_desc:0 "Відновлення роботи ZAX Сховища 29 до належного стану дозволило запустити програми «Ф'ючер-Тек», що допомагає передбачити, на чому нам потрібно зосередити наші дослідження, щоб бути — а тепер скажіть разом із нами — готовими до майбутнього!\n\n§CЦЕ ПОВІДОМЛЕННЯ НАДАНЕ ВАМ СИСТЕМАМИ «ВОЛТ-ТЕК»\n«Ф'ЮЧЕР-ТЕК» ТА \"ГОТОВІ ДО МАЙБУТНЬОГО\" Є ЗАРЕЄСТРОВАНИМИ ТОРГОВЕЛЬНИМИ МАРКАМИ «ВОЛТ-ТЕК»§!"
  best_safehaven:0 "Найкраще в Сейфхейвені!"
  best_safehaven_desc:0 "Завдяки своєму унікальному походженню, Сейфхевен має потенціал для підготовки кращих з кращих, коли справа доходить до переговорів! Це, на додачу до їхньої чудової бойової майстерності, призвело до того, що наші солдати стали не лише краще підготовленими, але й нашими чиновниками! Ось до яких чудес призвели Сховища Vault-Tec!\n\n§ЦЕ ПОВІДОМЛЕННЯ БУЛО ДОВЕДЕНО ДО ВАС КОМПАНІЄЮ VAULT-TEC SYSTEMS§!"
  vault_redmond_storage:0 "Центр зберігання даних Сховища Редмонд"
  vault_legend:0 "Легенда про наглядача Тока"
  vault_overseer_robot:0 "Жорстокість Т.О.М.А.С."
  vault_corporate_systems:0 "Системи корпоративного Сховища"