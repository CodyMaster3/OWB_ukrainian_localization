DRE_OLD_PETE_NAME:0 "Старий Піт"
DRE_OLD_PETE_DESC:0 "Старий Піт народився й виріс у повоєнному шахтарському поселенні Прінс-Джордж. Колишній шахтар, він згодом став лідером Дреджерів після того, як його попередника вбили рейдери – і одразу самотужки вирізав усю банду, що й привело до одностайного голосування за його лідерство. У нього, здається, нескінченний запас історій – здебільшого про улюблене заняття: стріляти дробом у рейдерів зі своєї вірної рушниці."

