l_english:
nf_houston.1.t:0 "Смерть Джо «М'яча» Магсона"
nf_houston.1.d:0 "Наші справи не завжди були в такому жалюгідному стані. Колись ми самі обирали «Рокетників» — і це була найвища честь, яку могла дати Г’юстонська Ракета. Люди поважали Рокетників; це був знак гідності, група, що вела нас у добрі й погані часи. Сьогодні бути Рокетником — це бути частиною пихатої верхівки, яка керує згори, поки решта з нас гарує на дні.\n\nКолись, коли звання Рокетника ще мало значення, Джо Магсон був справжнім лідером — не лише для Рокетників, а й для всіх нас і навіть сусідніх націй Техасу. Він був людиною народу й завжди підтримував простих людей, навіть коли вороги й опоненти тиснули на нього. Навіть зараз його ім’я викликає надію у знедолених і нагадує про простіші, кращі часи. Прикро, що його життя так раптово та жорстоко обірвалося вбивством... Але ми знаємо, хто винен. І час помститися."
nf_houston.1.a:0 "Це ополчення-зрадники вбили Джо!"
nf_houston.1.b:0 "Рейдерська й падальська наволоч його вбила!"

nf_houston.2.t:0 "Хімічна криза серед простолюду!"
nf_houston.2.d:0 "Ми важко працюємо, щоб Ракети Г’юстона летіли вперед і щоб наші родини були в безпеці. Але відпочити й розважитися нам дозволено лише в кількох речах — і хіми один із таких рідкісних способів. Колись у давнину люди вживали хіми для задоволення — і ніхто не скаржився.\n\nТа вже кілька років у Г’юстоні хіми офіційно заборонені. Багато хто вважає, що це спосіб Рокетників тримати контроль над звичайними мешканцями й карати за протестні настрої. Ситуація неприємна, але є надія. Перед Радою Рокетників поставлено пропозицію — повна легалізація хімів. Гарно було б, якби уряд погодився. Та чи приймуть вони її — невідомо."
nf_houston.2.a:0 "Ми не можемо легалізувати — з «медичних причин»."
nf_houston.2.b:0 "Саме час узяти «висоту» — легалізуємо."

nf_houston.3.t:0 "Відновлення супутників!"
nf_houston.3.d:0 "У центрі Міс Сіон Контрол зібралися найкращі наукові та військові уми Г’юстона. Атмосфера — від тривоги до захвату. Сьогодні — перший крок Ракет до нового світу, який вони створюють. Загальна метушня стихла лише тоді, коли генерал піднявся й звернувся до всіх.\n\n«Пані та панове. Століття тому наш народ присвятив себе великій справі — космічним польотам. Вони створювали скафандри, які витримували космос, супутники, що передавали дані з орбіти, та ракети, що несли найдорожче — людину. Відновити цю справу було непросто, але ми це зробили. Після років пошуків ми виявили робочий супутник. Сьогодні ми відновимо з ним контакт — і зробимо перший крок слідом за нашими предками».\n\nОплески, крики, свист. Генерал кивнув офіцеру біля консолі. «Лейтенанте, передавайте сигнал». Очі всіх звернулися до молодого офіцера, що гарячково друкував на терміналі. Рядки телеметрії пливли по екрану. Усі затамували подих.\n\nМинуло ціле вічність — і лейтенант нарешті підняв голову. Його обличчя сяяло, і він вигукнув перше, що спало на думку."
nf_houston.3.a:0 "«Г’юстон, у нас є з’єднання»."

nf_houston.4.t:0 "Монт"
nf_houston.4.d:0 "Монт — друге офіційне місто Ракет Г’юстона, практично зливається з ними. До війни це був осередок технологічного прогресу, а його перлина — величезний заводський комплекс. Усі ці машини можуть вдихнути нове життя в нашу зношену промисловість. Але власниками заводу стала місцева профспілка шукачів і розбирачів. Вони категорично відмовляються продавати або навіть говорити з нами.\n\nСпілка — мізерна перед нашою міццю. Війська можуть узяти завод під контроль за день. Але знищити профспілку — означає збурити народ, який і без того нас ненавидить. Наш вибір — між посиленням промисловості й стабільністю всередині."
nf_houston.4.a:0 "Сильні виживають. Забираємо все."
nf_houston.4.b:0 "Може... не варто красти?"

nf_houston.5.t:0 "Тече"
nf_houston.5.d:0 "Г’юстон завжди пишався своєю мережею водогонів. Але, як і все інше, вона потребує ремонту. Інакше — крах. Частини труб уже зруйновано, й містечка залишилися без постійного постачання. Люди обурені. Треба терміново щось робити.\n\nМи вже готуємо план ремонту, але потрібно ще й тимчасове рішення — негайна допомога містам. Ми можемо забезпечити їхню потребу, відправивши резерви води брамінськими караванами. Але це вичерпає всі наші запаси. А вода — найцінніша валюта в Техасі. Якщо ми віддамо все зараз — що буде потім? Вибір болісний, але неминучий."
nf_houston.5.a:0 "Ми мусимо зберегти резерви."
nf_houston.5.b:0 "К чорту все — несемо воду в міста!"


nf_houston.6.t:0 "Протести?!"
nf_houston.6.d:0 "Напруга під гнітом Рокетників завжди тліла, але зараз вона вирвалася назовні. Якщо раніше були лише поодинокі виступи розчарованих ветеранів чи підвищена напруженість — то тепер це вже зовсім інше. Сотні, якщо не тисячі мешканців вийшли на вулиці, протестуючи проти численних несправедливостей Рокетників і уряду, зокрема — проти безстрокового відкладання виборів, що, по суті, суперечить демократичним цінностям, які довго були важливою частиною Г’юстона.\n\nПротести зростають експоненційно — можна сказати, що все місто охоплене бунтом. Великі натовпи зібралися біля урядових будівель, зокрема біля Зали Рокетників. З факелами, зброєю та підручними засобами протестувальники легко можуть розгромити все довкола. Ми в безвиході: якщо відправити лояльне ополчення — втратимо залишки підтримки народу, а сили застосують смертельну силу. Але якщо дати мітингарям робити, що заманеться — буде знищена інфраструктура та постраждають сторонні. Що робити?"
nf_houston.6.a:0 "Знищити протестувальників."
nf_houston.6.b:0 "Нехай мітингують, втомляться."

nf_houston.7.t:0 "Сезон виборів"
nf_houston.7.d:0 "Сталося те, чого не очікували побачити за свого життя: уряд дозволив провести регіональні вибори. Звісно, це зміна, яку давно мали зробити — і, ймовірно, зробили лише після того, як натовпи ледь не спалили Залу Рокетників. Але все ж краще, ніж нічого. Натхненні, г’юстонці рушили на дільниці.\n\nВибір зводиться до двох кандидатів: блискучого науковця Санчеса й загартованого, але мудрого капітана Батіста.\n\nСанчес, народжений у місті, зробив кар’єру в секторі досліджень і став обличчям наукових зусиль Г’юстона. Його не особливо любить народ, але він має підтримку Рокетників і посадовців. Його програма — відродження Г’юстона та розкриття наукового потенціалу.\n\nБатіст — вшанований ветеран, що неодноразово захищав Г’юстон від загроз. Від відбиття атаки Патрульних 2273 року до десятків рейдерських банд — він завжди був на передовій. Його обожнює народ, так само як Джо «М’яч» Магсона. Але його популярність викликає недовіру у Рокетників. Батіст бореться за Г’юстон — але за який саме Г’юстон?\n\nГолоси підраховано. Народ зробив свій вибір. Переможець — ..."
nf_houston.7.a:0 "Санчес. До зірок — і далі."
nf_houston.7.b:0 "Батіст. Влада — народу, від народу."

nf_houston.8.t:0 "Дезертири?"
nf_houston.8.d:0 "Надходять тривожні звіти від командування про зростання дезертирства. Пара боягузів — не критично. Але останнім часом цілі батальйони здають зброю. Це створює дірки в обороні й оголює слабкість Г’юстона перед світом.\n\nЦі безхребетні зрадники ніколи не мали духу захищати батьківщину, і Рокетники покарають кожного. Але проблема вже стала відомою громадськості — і її треба негайно вирішити, поки підбурювачі не скористалися шансом."
nf_houston.8.a:0 "Г’юстон не прощає зради."
nf_houston.8.b:0 "А... хм... вони що, пішли?"

nf_houston.9.t:0 "Громадянська війна"
nf_houston.9.d:0 "Ось і воно. Роки тиску, повний розрив зв’язку між Рокетниками, урядом і народом — і тепер вибухнуло повномасштабне протистояння. Зіткнення між сусідами й жителями вже поширюються країною, розростаючись у жорстокість і хаос. Незабаром брати й сестри наставлять зброю одне на одного, і земля Г’юстона буде зрошена кров’ю загиблих. Сама душа нації під загрозою. І зірки, до яких ми колись сягали, спостерігатимуть згори... з жалем до тих, хто вижив. Бо лише мертві побачать кінець війни."
nf_houston.9.a:0 "Хіба це не братовбивство?"

nf_houston.10.t:0 "Ліберсіті"
nf_houston.10.d:0 "Можливо, не існує міста в пустках із більш відповідною назвою, ніж Ліберсіті. Його заснували раби, які скинули ярмо гнобителів і втекли шукати нове життя; поселенці, що залишили Г’юстон заради кар’єри без Рокетницького гніту; та старателі, які просто хотіли осісти. Ліберсіті виріс на руїнах давнього міста Ліберті. Це не така вражаюча метрополія, як її старша сестра Г’юстон, і ресурсів у неї менше, ніж у Г’юстона чи Монта. Але мешканці Ліберсіті можуть жити власним життям, здебільшого вільні від г’юстонських проблем і соціальної напруги.\n\nБлизькість до Г’юстона дозволила Ліберсіті витягувати з нього кадри й ресурси. Через це міську раду нещодавно відвідали представники інженерної спілки з цікавою пропозицією. Використавши доступні залишкові ресурси, рада має змогу або перезапустити сонячну електростанцію — щоб забезпечити громадян безкоштовним і стабільним джерелом світла та енергії, або ж побудувати розгалуження г’юстонської водогінної системи, аби дати людям чисту питну й поливну воду. Було б добре мати і те, й інше — але ресурсів вистачить лише на щось одне."
nf_houston.10.a:0 "Вода — основа життя."
nf_houston.10.b:0 "Ми освітимо шлях для Техасу."