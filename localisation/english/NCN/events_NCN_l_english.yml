l_english:

nf_ncn.1.t:0 "Вибір Самсона"
nf_ncn.1.d:0 "Коли впали бомби, Пророк не встиг дістатися до сховища. Одного з обраних Господніх поставили наглядачем, і він намагався провести Церкву Ісуса Христа Святих останніх днів крізь темряву, що настала. Люди Божі згадали історії про Нефія й Джозефа Сміта, про Ісуса й Авраама. Вони звернулися до ідеалів віри, щоби пройти крізь випробування. Суддя Самсон порівняв наш час із минулими випробуваннями християнської віри."
nf_ncn.1.a:0 "Ми залишилися у сховищі, як ізраїльтяни в пустелі."
nf_ncn.1.b:0 "Порівняно з походом Джозефа Сміта, що таке сховище?"

nf_ncn.2.t:0 "Відвага Ехуда"
nf_ncn.2.d:0 "І чинили діти Нью-Ханаану зло перед очима Господа. І Господь зміцнив Райана, царя Фарфілду, проти них. Та коли народ закликав до Господа, Той підніс визволителя — Ехуда, сина Джейсона. Його послали з даниною до царя Райана. \n\nЕхуд зробив собі кинджала й заховав під одежу, на правому стегні. Коли данину передали, він відпустив супровід, а сам повернувся, кажучи: «У мене таємне слово для тебе, царю»."
nf_ncn.2.a:0 "Бог велить тобі працювати з нами, а не проти нас."
nf_ncn.2.b:0 "І встромив Ехуд кинджала в його утробу."

nf_ncn.3.t:0 "Мудрість Гедеона"
nf_ncn.3.d:0 "Новоханаанці чинили зло в очах Господніх, і Господь передав їх до рук мутантів на сім років. Вони ховалися в горах, печерах і руїнах. І Господь послав Пророка, який сказав: «Я вивів вас із Іллінойсу, з неволі, але ви покинули Мене.»\n\nІ запитав Гедеон: «Якщо Господь з нами, чому ж усе це сталося? Де Його чуда?»\n\nІ відповів Господь: «Йди у силі своїй і врятуй Новий Ханаан із рук мутантів. Хіба Я не посилаю тебе?»"
nf_ncn.3.a:0 "Гедеон проповідував мутантам."
nf_ncn.3.b:0 "Вони переслідували мутантів і принесли голови Гедеону."

nf_ncn.4.t:0 "Кожен робив те, що було правим у його очах"
nf_ncn.4.d:0 "За Дебори новоханаанські торговці дійшли аж до Нью-Вегаса і Каліфорнії, вступили в контакт із Середньозахідним Братством. Але й аморальність поширилася: содоміти жили відкрито, бари й борделі — легалізовані. Бідняків обкладали податками заради армії. Народ повстав, натхненний вірою, і скинув Дебору.\n\nАле вона померла непокаяною, цитуючи Бріґама Янґа: «Мужі — пани землі, повні зла і гріха. Але Бог судитиме їх.»"
nf_ncn.4.a:0 "Народ не рухався, аж поки я, Дебора, не встала — як мати в Ізраїлі."
nf_ncn.4.b:0 "Нехай загинуть усі вороги Твої, о Господи!"

nf_ncn.5.t:0 "Білоногі біля воріт"
nf_ncn.5.d:0 "І пророк сказав: «Господь відбере в них оздоби: браслети й обручі, Піп-бої, сережки й радіо, хустки й рушниці, дзеркала, золото, парфуми та шовк Ші.\n\nЗамість пахощів — сморід. Замість стрічки — мотузка. Замість волосся — лисина. Замість краси — тавро.»\n\nТак пророк Єремія Рігдон сказав, коли Білоногі підійшли до Нью-Ханаану."
nf_ncn.5.a:0 "Брами Нью-Ханаану будуть плакати й ридати."

nf_ncn.6.t:0 "Війна за Небо"
nf_ncn.6.d:0 "Навіть після палких попереджень пророка, мало хто вірив, що Білоногі підуть на відкриту війну. Ще менше — що вони принесуть таку жорстокість. Віруючих страчують публічно, дітей продають у рабство.\n\nШерифи й союзні племена мобілізовані. Але чи цього вистачить?"
nf_ncn.6.a:0 "О Господи, захисти нас."

nf_ncn.7.t:0 "День Суду: Нью Ханаан у вогні"
nf_ncn.7.d:0 "Після тижнів виснажливих боїв, Білоногі дісталися міста Нью-Ханаан. Контратака виявилася марною. Вони штурмують будівлю Шерифа, останню твердиню. Місто палає. Незабаром від нього залишиться лише обвуглений камінь."
nf_ncn.7.a:0 "Наш дім у вогні. Наші люди — мертві. Ми повинні тікати."
nf_ncn.7.b:0 "Навіть їхній 'Бог' не зміг їх урятувати."
nf_ncn.7.c:0 "Нова сила постає в Юті."

nf_ncn.8.t:0 "День Суду: Взяття Лінкольна"
nf_ncn.8.d:0 "Після кількох тижнів кровопролиття, сили Нью-Ханаану взяли Лінкольн — столицю Білоногих. Битва була жорстока: бій за кожну вулицю. [WHT.GetLeader] утік, і плем’я розсіялося."
nf_ncn.8.a:0 "Нарешті язичники переможені!"
nf_ncn.8.b:0 "Ми не можемо більше воювати..."
nf_ncn.8.c:0 "Ханаанці перемогли, але якою ціною?"

nf_ncn.9.t:0 "Лагідні руки святих"
nf_ncn.9.d:0 "Підхід Даніеля до теології — мирний і привабливий. Він став новим Президентом Церкви. Проте старійшини попереджають його від надмірних реформ. Перед ним стоять виклики: ставлення до навернених племен і викорінення розкоші. Якщо йому вдасться, Церква стане єдиною й могутньою. Але шлях його буде тернистим."
nf_ncn.9.a:0 "Нехай буде так, Господи."

nf_ncn.10.t:0 "Занепад і багатство"
nf_ncn.10.d:0 "За підтримки духовенства — і з доброю пригорщею кришок — Єремія зберіг свою посаду Президента Церкви, перемігши більш благочестивого Даніеля. Пообіцявши продовження торговельної політики, яка принесла Ханаану чималі статки, а також рішучі дії для покращення економіки, Єремія має чимало виправдовувати. Але найбільше — це жахлива корупція, що проїла країну. Навіть якщо вона й наповнює його власні кишені, Єремія бачить, яку шкоду вона завдає народу. Шлях буде непростим — навколо чимало загроз. Але народ поклав на нього свою віру. І він обіцяє їм щедру винагороду — навіть якщо доведеться нажитися на сусідах."
nf_ncn.10.a:0 "Наші нові землі принесуть нам чимале багатство."

nf_ncn.11.t:0 "Обпалений іде!"
nf_ncn.11.d:0 "Джошуа Ґрем — наш світильник у темряві. Його рішуче лідерство, зосереджене на об'єднанні племен довкола та стрімкій мілітаризації для протистояння Білоногим, здобуло широку підтримку як серед решти конгрегації, так і серед племен. Він узяв на себе тимчасовий повний контроль над нашими військами і кліром у вигнанні, щоб привести нас до перемоги й повернення до святої землі. Бо ж не слід чекати, що Бог зробить усе сам..."
nf_ncn.11.a:0 "Білоногі пізнають своє місце перед Господом!"

nf_ncn.12.t:0 "Лідер у вигнанні"
nf_ncn.12.d:0 "Єремія Рігдон зрадив нас. Гроші відвернули його від Господа, як і багатьох проповідників, що загинули в палаючих вулицях Нового Ханаану. Інші розсіялися по пустках. Дехто знайшов прихисток серед племен, яким ми колись проповідували, але це лише уламок колишньої громади. Сам Єремія втік до Нью-Ріно, де насолоджується життям завдяки своїм торговим зв’язкам.\n\nНам потрібен новий лідер — той, хто об’єднає розбиту й пригнічену громаду. Даніель — улюбленець старої школи: лагідний, об’єднувальний, сповнений надії. Обпалений — Джошуа Ґрем — обіцяє радикальний курс: мілітаризацію, об'єднання й остаточну розправу з Білоногими. Хто поведе нас у нову еру?"
nf_ncn.12.a:0 "Обпалений — наша нова надія."
nf_ncn.12.b:0 "Лагідний дотик Даніеля — ось наш шлях уперед..."

nf_ncn.13.t:0 "Церква в пустелі"
nf_ncn.13.d:0 "Ми перемогли у війні, але якою ціною? Поки вона тривала, наші люди вдома страждали і від Білоногих, і від канонічної влади. Корупція стала нормою, економіка — на межі краху. А племена-союзники почали з підозрою дивитись на наші нові володіння.\n\nЦерква стоїть перед вибором: знову підтримати Єремію — переможця Білоногих і реформатора економіки, чи обрати когось нового. Даніель обіцяє очищення від корупції й оновлення Церкви, хоча його підхід до економіки стриманий. Хто поведе отару далі?"
nf_ncn.13.a:0 "Єремія переміг Білоногих — отже, гідний вести."

nf_ncn.14.t:0 "Мальпайський Легат озивається"
nf_ncn.14.d:0 "Після руйнування Нью-Ханаану Білоногими, Легат Мальпайс усамітнився. Кажуть, бачили його в сльозах — за містом, де він виріс, і людьми, яких він називав братами. Цезар спершу терпів таку слабкість, але очікував, що Легат повернеться до обов’язків. Того не сталось. Він зривається на радників і друзів. А сьогодні він прямо під час військової ради кинув звинувачення самому Цезарю, розкритикувавши його підтримку Білоногих. Це була нечувана зухвалість."
nf_ncn.14.a:0 "Він сміє мені перечити?! Подайте приклад!"

nf_ncn.15.t:0 "Блудний син повертається"
nf_ncn.15.d:0 "Джошуа Ґрем колись був одним із нас. Обдарований перекладач, ревний мормон, він допомагав племенам знайти спільну мову. Саме під час такої місії він урятував Едварда Селлоу — й започаткував фатальну дружбу. Разом вони створили Легіон Цезаря. Ґрем став правицею Селлоу, вчиняючи звірства в ім’я їхньої 'нової віри'.\n\nАле Цезар завжди остерігався його. Зрештою, він наказав його стратити: облити смолою, підпалити, й скинути в каньйон. Та Ґрем вижив. Із вірою, палаючою яскравіше за вогонь, він дістався племен Юти, які його вилікували. Після відновлення він повернувся до Нового Ханаану. Ми прийняли його без вагань. Блудний син повернувся — охрещений водою й вогнем, і він боронитиме стадо."
nf_ncn.15.a:0 "Вітаємо у стаді, Дитино Божа."

nf_ncn.16.t:0 "Припини, старий!"
nf_ncn.16.d:0 "Церква застаріла й загрузла в бюрократії. Вона чинить опір реформам, що так потрібні. Даніель і його радники вирішили дати відсіч. Вони розіслали вимоги до всіх конгрегацій і союзників. Відповідь була нищівна: деякі громади проголосили їх єретиками й взялися за зброю! Щоби втілити реформи, доведеться боротися не лише словами."
nf_ncn.16.a:0 "Реформи — це правильно."

  #######################################################
  nf_ncn.160.t:0 "Реформа в Мормонській Церкві"
  nf_ncn.160.d:0 "Не є таємницею, що Деніел зневажає застарілу, бюрократичну структуру Церкви Ісуса Христа Святих Останніх Днів, яка сформувалась за правління Єремії Рігдона. Кожна спроба навіть незначної реформи з боку Деніела зустрічалась із жорстким опором з боку місцевого духовенства та громад, змушуючи його раз за разом відступати. Але не сьогодні. Цього ранку, обурений черговою відмовою Церкви прийняти бодай якусь реформу, Деніел розіслав докладний список вимог до кожної громади та церкви, що дотримується мормонської віри. Його ідеї були детально викладені, але приблизно половина Церкви цілковито відкинула їх і взялася за зброю, аби повалити Деніела за єресь, назвавши його маніфест 'Дев’яносто п’ять тез Деніела'. Інша половина залишилась вірною його баченню і також озброїлась, аби захистити новий порядок. Хто здобуде перемогу?"
  nf_ncn.160.a:0 "Часи змін настали."
  #######################################################
  nf_ncn.17.t:0 "Розкол у Церкві"
  nf_ncn.17.d:0 "У Церкві стався розкол. Релігійні громади та організаційна структура самої Церкви розриваються навпіл — одні підтримують реформи, інші пручаються. Центральна церковна влада, очолювана Деніелом і його благочестивими радниками, розпочала масштабну програму реформ, спрямовану на повний розрив із декадентським минулим. Проте опір цим змінам став жорстким — як у [NCN.GetName], так і в наших власних землях. Повномасштабна громадянська війна вибухнула в самісінькому серці [NCN.GetName]. Нам тепер належить обрати, до якої гілки Церкви ми приєднаємося. Який би вибір ми не зробили — війна може дійти і до нас!"
  nf_ncn.17.a:0 "Залишимось вірними новій Церкві!"
  nf_ncn.17.b:0 "Старий шлях — найкращий"
  #######################################################
  nf_ncn.18.t:0 "Юта має побачити Бога"
  nf_ncn.18.d:0 "Коли криза в нашій державі відвернута, а контроль над священними землями відновлено, настав час знову звернути погляд назовні. Деніел, провівши роки серед племен Юти, переконаний: навіть вони зможуть прийняти світло Господа, якщо їх до цього м’яко й терпляче вести. Нашими першими діями в нову епоху має стати поширення слова Божого серед племен — організовано й послідовно, аби й вони змогли наслідувати віру та волю Господа, яку на землі представляє Деніел. Паралельно з цим, необхідно провести низку важливих політичних змін, щоби Церква змогла реалізувати своє повне призначення. Це буде нелегко. Але якщо ми втілимо ці зміни, світло Господа може осяяти всю Юту — а можливо, й об’єднати її під Церквою. Час покаже..."
  nf_ncn.18.a:0 "Господня ласка сягає кожного."
  #######################################################
  nf_ncn.19.t:0 "Перемога викривленої системи"
  nf_ncn.19.d:0 "Церква Ісуса Христа Святих Останніх Днів остаточно заблукала у пустелі, та її лідери не втрачають голодного погляду в бік найближчого джерела кришок. Під вправним керівництвом Єремії економіка оговталася від руйнівної війни з Білоногими, і найбільш кричущі прояви корупції були приборкані. Наступна мета Єремії — підкорити навколишні племена своїй волі. Але, схоже, він незабаром муситиме відкинути усілякий удаваний альтруїзм. І хоч це обіцяє зростання прибутків і міцнішу економіку, чи варті вони втрати духовного зв’язку з народом? Очевидно, так..."
  nf_ncn.19.a:0 "Схоже, за кришки можна купити й душу..."
  #######################################################
  nf_ncn.20.t:0 "Юта має процвітати"
  nf_ncn.20.d:0 "Після капітуляції Білоногих, Ґрем здійснив, здавалося б, неможливе — повернув Церкву Мормонів до її святої землі й зробив пустки Юти знову безпечними для всіх подорожніх. Він — справжній дарунок від Господа, і ми присягаємося підтримувати його в подальших прагненнях зробити Юту вільною від тиранії назавжди. Дорога буде нелегкою: навколо нас чимало ворогів, які прагнуть нас роз’єднати. Але з допомогою святого полум’я Господа ми зможемо вигнати з Юти всіх невірних раз і назавжди."
  nf_ncn.20.a:0 "Нехай усі побачать Твоє світло, о Господи!"
  #######################################################
  nf_ncn.21.t:0 "Місце Бога на Землі"
  nf_ncn.21.d:0 "§RОсь, надходять дні, — говорить Господь, — коли Я підніму Давидові праведну гілку; Цар царюватиме і буде успішним, чинитиме суд і справедливість на землі. За Його днів Юдея буде спасенна, і Ізраїль житиме безпечно. І ось як Його називатимуть: Господь — наша праведність.§! §gЄремія 23:5-6§!\n\nІ ось ці дні наближаються. Наша Юдея, Нью-Ханаан, спасенна, і скоро наші ізраїльтяни — мормони по всій землі — житимуть у безпеці. Проте залишаються справи, які слід владнати, перш ніж ми зможемо проголосити Царство Боже на Землі: кожен повинен мати задоволені духовні потреби. Але що важливіше — ми маємо вжити рішучих заходів, аби нашому Царству більше ніколи не загрожувала небезпека. Зрештою, ми назвемо себе Царством Божим на Землі, але цей день ще не настав."
  nf_ncn.21.a:0 "Наш обов’язок — захистити людство від тиранії."
  #######################################################
  nf_ncn.22.t:0 "Кровообіг Мормонів"
  nf_ncn.22.d:0 "Відтоді, як ми оселились біля Солоного Озера, торгівля стала основою нашої економіки. Більшість наших багатств надходить із товарів та послуг, вироблених тут, у Юті, й проданих по всій Америці й далі. Без торгівлі ми не змогли б протистояти Білоногим, ані відновити господарство після війни. Каравани, що перетинають наші землі, — це наша артерія життя. І ми маємо зробити все можливе, аби торгівля знову процвітала на нашій землі та в усій Юті."
  nf_ncn.22.a:0 "Поки живуть каравани — живемо і ми."
  #######################################################
  nf_ncn.23.t:0 "Білоногі Розсіялись"
  nf_ncn.23.d:0 "Після нищівної поразки в Лінконі, Білоногі були змушені розбігтися по пустках. Хоча центральна влада племені більше не існує, значна частина його вже почала збиратись докупи на ще не зайнятих землях, а також у деяких ділянках, що належать [CLK.GetNameDef] та [TAR.GetNameDef]. Ці розпорошені групи можуть стати ще більшою загрозою, ніж централізоване плем’я: їх буде складніше відстежити, і вони можуть проникати крізь наші патрулі так, як не змогла б регулярна армія. Ми маємо діяти — і негайно. Лише взявши ці землі під контроль, ми зможемо остаточно знищити загрозу Білоногих."
  nf_ncn.23.a:0 "Ці землі слід очистити святим полум’ям!"
  #######################################################
  nf_ncn.230.t:0 "Білоногі Здаються"
  nf_ncn.230.d:0 "Після поразок у рідних землях, Білоногі, схоже, роблять останній спротив. Скоро вони впадуть під натиском ворожих сил і розпорошаться по пустках. Час покаже, але ці ізольовані, відчайдушні угрупування можуть становити навіть більшу загрозу для нашої нації, ніж централізоване плем’я Білоногих."
  nf_ncn.230.a:0 "Негайно повідомити прикордонні патрулі!"
  nf_ncn.230.tt:0 "§RЯкщо Білоногі будуть анексовані, стануть маріонеткою або втратять столицю, невдовзі після цього відбудеться подія, яка відкриє альтернативний шлях до фокусу 'Ханаан у Славі'. Не бійся: дерево фокусів не зламане.§!\n"
  #######################################################
  nf_ncn.24.t:0 "Нова Церква Ісуса Христа Святих Останніх Днів"
  nf_ncn.24.d:0 "Нарешті ми повернули собі батьківщину і з тріумфом знову ступаємо вулицями як Нью-Ханаану, так і Нового Єрусалима. Як не дивно, мало що змінилось з часу нашої втечі: обидва поселення — лише обгорілі руїни, зі скелетами наших друзів, що досі лежать на колись жвавих вулицях. Нью-Ханаан зазнав ще гіршої долі: землю засолено, і тепер тут більше нічого не ростиме. Виникає питання: де має бути розташована наша нова Церква? Дехто вважає, що ми маємо повернутись до Нового Ханаану, колишнього прихистку від рейдерів, і відбудувати його. Інші наполягають на Новому Єрусалимі, адже саме там стояла наша перша велика Церква. А найрадикальніші голоси пропонують зробити столицею Прово — символом нашого відходу від старих шляхів. Що скажеш, Пророче Живий?"
  nf_ncn.24.a:0 "Наш дім — це завжди Нью-Ханаан."
  nf_ncn.24.b:0 "Новий Єрусалим був першим, і ним стане знову."
  nf_ncn.24.c:0 "Прово. Нове місто для нової епохи Церкви."
  #######################################################
  nf_ncn.25.t:0 "З Юти з любов’ю"
  nf_ncn.25.d:0 "Мохавські пустки — це розсадник розбещених і духовно сліпих поселень, якими правлять злочинці й божевільні ШІ. Безліч фракцій бореться за контроль над цими запиленими землями, постійно зіштовхуючись за контроль над дорогами й поселеннями. Мохаве також є ареною протистояння Ведмедя й Бика: війська обох сторін продовжують блукати пустками, часто поводячись не краще за рейдерів чи бандюг із Силових Банд. Очевидно, що Мохаве вкрай потребує світла Господа. Для цього нам потрібен безпечний шлях до пустки. Такий шлях проходить через небезпечних Вісімдесятників — зграї рейдерів, що діють із довоєнної військової бази. Вони мають почути слово Боже, щоби наші місіонери могли безперешкодно досягти Вегаса і далі. Час знову до війни."
  nf_ncn.25.a:0 "[SKY.GetLeader] має побачити шлях."
  #######################################################
  nf_ncn.26.t:0 "Мормонська місія в Мохаве"
  nf_ncn.26.d:0 "Окрилені перемогами над Білоногими та тріумфальним поверненням до Нью-Ханаану, ханаанці розпочали сміливу місіонерську кампанію з поширення світла Господнього у Мохаве. План — справжній логістичний кошмар, тож першим кроком у новій місії обрано навернення Вісімдесятників, що тероризують північ пустелі. Ханаанці пообіцяли: ці рейдери побачать Господа — так чи інакше..."
  nf_ncn.26.a:0 "Ми — слуги Господа."
  nf_ncn.26.b:0 "Краще нам зосередитися на півночі..."
  nf_ncn.26.c:0 "Сунули пальці не туди, куди слід..."
  #######################################################
  nf_ncn.27.t:0 "Кінець Хранителів часу"
  nf_ncn.27.d:0 "Останні кілька днів у наші землі зі півдня прибувають біженці. Вони походять із довоєнного Сховища 24, де, здається, ставили експерименти з впливом часу на мешканців. Попри виживання в умовах жорстокого експерименту, Vault-Tec залишила їм ще один дарунок: всім мешканцям нав’язали переконання, що якщо вони не полагодять 'машину часу' в центрі сховища, то не зможуть надіслати свого солдата назад у часі, аби врятувати творця сховища — і це спричинить часовий парадокс, що зітре їхнє існування. Хоч це й очевидна маячня, поява цих біженців ставить перед нашими лідерами складне питання: чи варто приймати цих одурманених? А їхню владу? І чи не створить це прецедент, що стане нам на заваді у майбутньому?"
  nf_ncn.27.a:0 "Справді химерна дилема..."
  #######################################################
  nf_ncn.28.t:0 "Огденський арсенал кличе"
  nf_ncn.28.d:0 "Огден — довоєнне місто, на руїнах якого ми збудували Нью-Ханаан. Лише кілька будівель пережили ядерний удар, і ще менше збереглися після десятиліть негоди та грабунків. Однією з них став Огденський арсенал. Колись — маленький об'єкт Нацгвардії, що перетворився на величезний комплекс у переддень Великої Війни. Хоч поверхневі рівні давно розграбували, нижні залишились неторкнутими — для їхнього відкриття потрібні навички, яких бракує звичайним мародерам. Нещодавно було виявлено, що в глибинах арсеналу є значні запаси зброї та припасів — і тепер вони належать нам."
  nf_ncn.28.a:0 "Ця зброя нам дуже знадобиться..."
  #######################################################
  nf_ncn.29.t:0 "Прибули Послідовники Апокаліпсису"
  nf_ncn.29.d:0 "Послідовники Апокаліпсису виникли в Кістяковому місті — одному з найбільших поселень НКР. Відтоді вони поступово розповсюдились пустками, здобуваючи прибічників. Хоч основа руху залишається в межах НКР, передові загони навчають медичних знань і допомагають нужденним. Один із таких загонів опинився під владою тиранічного Легіону Цезаря — і ми втратили одного з наших синів. Тепер інша група прийшла до нас, у Юту. Вони пропонують передвоєнні медичні знання в обмін на гостинність. Але чи можна їм довіряти?"
  nf_ncn.29.a:0 "Слідкуватимемо за ними уважно..."
  #######################################################
  nf_ncn.30.t:0 "Проблеми з торговцями"
  nf_ncn.30.d:0 "Торгівля — життєва артерія ханаанців уже понад століття. У перші роки саме каравани постачали нам усе необхідне, дозволяючи звести нові будівлі та обробляти землю. З розвитком Ханаану зросла й наша роль у керуванні караванними шляхами Юти: перекладачі-мормони стали посередниками, а миротворці — гарантією безпеки доріг. Але за останнє десятиліття наші відносини з торговими компаніями погіршилися. Вони скаржаться на надмірні мита і надто велику частку угод, яку ми забираємо. Можливо, це й правда. Але хіба не мають вони платити за наш захист і підтримку?"
  nf_ncn.30.a:0 "Можливо, час переглянути наш підхід..."
  #######################################################
  nf_ncn.31.t:0 "Вигнанці з Ханаану простягають руку"
  nf_ncn.31.d:0 "Після падіння їхньої столиці, ханаанці втекли на південь — до племен, серед яких вони колись проповідували. І поступово вони знову набули впливу, тепер навіть більшого, ніж раніше. Під проводом Деніела, проповіді стали лагіднішими, і саме завдяки ним ми прийняли мормонську віру. Тепер ханаанці пропонують нам союз. Під Господом ми будемо рівними — й захищатимемо Юту разом. Як відповімо?\n\n§RЗрештою, ханаанці зажадають повернення своїх земель. І якщо ми в союзі, честь зобов’яже нас погодитися.§!"
  nf_ncn.31.a:0 "Разом служитимемо Господу."
  nf_ncn.31.b:0 "Ми надто різні, навіть попри спільну віру."
  #######################################################
  nf_ncn.32.t:0 "[WHT.GetNameDef] приймають"
  nf_ncn.32.d:0 "Після перемовин і обіцянок [WHT.GetLeader], [WHT.GetName] погодились на союз. Разом ми служитимемо Господу й боронитимемо одне одного від небезпек. Вони також повертають нам землі, втрачені кілька місяців тому — хоч і попередили, що нам може не сподобатись те, що ми там знайдемо..."
  nf_ncn.32.a:0 "Чудова звістка!"
  #######################################################
  nf_ncn.33.t:0 "[WHT.GetNameDef] відмовляють"
  nf_ncn.33.d:0 "Попри всі зусилля, перемовини з [WHT.GetLeader] та [WHT.GetName] зазнали краху. Надто багато проблем з’явилось на шляху до угоди, і головна з них — повернення наших земель, на чому ми стоїмо без компромісів. Схоже, війна — єдиний шлях."
  nf_ncn.33.a:0 "Ми повернемося додому — так чи інакше."
  #######################################################
  nf_ncn.34.t:0 "[NCN.GetName] пропонує союз"
  nf_ncn.34.d:0 "Далеко на північному сході, серед пусток Юти, група мормонських віруючих оселилася на руїнах Огдена й Солт-Лейк-Сіті. Довгі роки вони боролися з впливом Цезаря, який розбещував навколишні племена, і це зрештою призвело до падіння Нью-Ханаану під ударами приязних до Легіону Білоногих. Тепер ханаанці вирішили бити в саме серце — ведуть власну війну проти Легіону на землях Юти. Вони пропонують тимчасовий союз: обмін розвідданими, технологіями та зобов’язання не укладати окремий мир, якщо одна зі сторін капітулює. Підкреслюється, що союз діє лише до перемоги над Легіоном. Хіба ж це не вигідна пропозиція?"
  nf_ncn.34.a:0 "Ми приймаємо союз."
  nf_ncn.34.b:0 "Краще ми воюватимемо самостійно."
  #######################################################
  nf_ncn.35.t:0 "[NCR.GetNameDef] приймає"
  nf_ncn.35.d:0 "Заради спільної мети — знищення загрози Легіону — НКР погодилась на тимчасовий союз із нами. Ми будемо обмінюватися розвідкою та технологіями, й обіцяємо не укладати окремий мир. Це, без сумніву, велика дипломатична перемога, яка змусить [CES.GetLeader] здригнутися від страху!"
  nf_ncn.35.a:0 "Разом ми зламаємо тиранію Легіону!"
  #######################################################
  nf_ncn.36.t:0 "[NCR.GetNameDef] відмовляється"
  nf_ncn.36.d:0 "Попри всі наші зусилля, НКР відхилила нашу пропозицію тимчасового союзу проти Легіону. Хоч це і дипломатична поразка, ми обоє все ще ведемо боротьбу проти Легіону, і йому буде важко витримати наш спільний натиск."
  nf_ncn.36.a:0 "Прикро."
  #######################################################
  nf_ncn.37.t:0 "Кінець дороги"
  nf_ncn.37.d:0 "Після завершення війни з Легіоном мета ханаансько-каліфорнійського союзу була досягнута. Союз від початку був тимчасовим, і ми знали, що з часом шляхи розійдуться. Можливо, ми знову об’єднаємось, якщо постане нова загроза."
  nf_ncn.37.a:0 "Дякуємо за жертву, брате."
  #######################################################
  nf_ncn.38.t:0 "Не зовсім мормони"
  nf_ncn.38.d:0 "Хоч ми контролюємо великі території поза нашими святими містами, більшість цих земель ще не пізнали справжнього світла. Щоби уникнути нового погрому Нового Єрусалима з боку невдоволених чужинців, ми фактично відкрили наші кордони для всіх, хто шукає мирного життя. Це суттєво покращило наші відносини з племенами, але послабило мормонське домінування. Хоч більшістю незадоволених ми здатні керувати, дві групи викликають особливе занепокоєння: Бригемські Барони на півночі під проводом молодої індустріалки Рейчел Мей, і воєвниче угруповання Фарфілда, яким керує Маркус Фернесс — син одного з ватажків погрому Нового Єрусалима. Обидві групи наразі не відкрито ворожі, та якщо ми не інтегруємо їх, нас чекає бунт."
  nf_ncn.38.a:0 "Маємо уникнути повстання за будь-яку ціну!"
  #######################################################
  nf_ncn.39.t:0 "Повстання Фарфілдського загону"
  nf_ncn.39.d:0 "Попри всі наші зусилля, Фарфілдський загін повстав проти нашої влади. [FAR.GetLeader] зібрав довкола себе розчарованих племінників, колишніх рейдерів і навіть потенційних работоргівців — і проголосив відкритий бунт. Уже зараз його сили марширують на Новий Єрусалим, аби повторити той самий погром, що колись влаштували його батьки. Ми не можемо цього допустити!"
  nf_ncn.39.a:0 "Шлях миру не завжди спрацьовує..."
  #######################################################
  nf_ncn.40.t:0 "Бригемські Барони проголошують незалежність"
  nf_ncn.40.d:0 "Надихнувшись нашою м’якою політикою щодо північних поселень, прикордонне місто Бригем проголосило незалежність. Під проводом харизматичної особи — [BRI.GetName], самопроголошені 'Барони Бригема' змогли мобілізувати добровольців з інших поселень півночі і тепер становлять серйозну загрозу нашій владі в регіоні. Ми повинні вжити заходів!"
  nf_ncn.40.a:0 "Вони самі цього хотіли!"
  #######################################################
  nf_ncn.41.t:0 "Королівство Юта?"
  nf_ncn.41.d:0 "Після об'єднання племен Юти під моїм керівництвом, я ступив на шлях, подібний до того, яким ішов Саул — перший цар Ізраїлю, що зібрав дванадцять племен. За його мудрого керівництва народ витримав навалу зовнішніх ворогів — і так само я захистив Юту від поневолення. Як і Саула, мене було покликано Господом, тож, можливо, і мені слід узяти титул. Саул був царем Ізраїлю — то чому б мені не стати першим Царем Юти? А може, краще згадати довоєнні традиції, коли мормонська Церква мала вплив на штат Юта — й обрати титул Губернатора? А може, зовсім відмовитись від титулів — бо ми всі рівні перед Богом..."
  nf_ncn.41.a:0 "Як Саул був царем, так і я стану."
  nf_ncn.41.b:0 "Я буду Губернатором, як наші предки."
  nf_ncn.41.c:0 "Я не потребую титулу — ми всі одне під Богом."
  #######################################################
  nf_ncn.42.t:0 "День Піонера"
  nf_ncn.42.d:0 "Сьогодні День Піонера — велике свято мормонів, яке щороку відзначають у Юті й за її межами. Саме цього дня, у 1847 році, Бригем Янг із послідовниками прибули в Долину Великого Солоного Озера, де згодом заснували Солт-Лейк-Сіті — або, як ми його знаємо нині, Новий Єрусалим. Хоч наше місто й не має колишньої величі, щороку ми бачимо, як наближаємося до відродження його слави. І сьогодні, на честь нашого поступу до майбутнього, ближчого до Господа, — ми будемо бенкетувати, танцювати та співати!"
  nf_ncn.42.a:0 "Нехай буде благословення на наших предків."
  #######################################################
  nf_ncn.43.t:0 "Царство Боже на Землі"
  nf_ncn.43.d:0 "Колись лише мрія [NCN.GetLeader], а сьогодні — реальність: Царство Боже на Землі постало. Мормони оголосили свою державу Дезерет, як це зробили їхні предки, коли вперше оселилися на берегах Солоного Озера. Безпечна та квітуча держава, кордони якої майже збігаються зі штатом Юта часів до Великої Війни. Шлях мормонів сюди був нелегкий: після втрати Нью-Ханаану від рук Білоногих, потрібно було чимало жертв, щоби знову закріпитися серед племен, яким вони колись проповідували — і ще більше, щоби повернутись додому. Справді, ханаанці або благословенні Богом, або неймовірно везучі. Ті, хто зазіхне на їхню землю, знайдуть перед собою грізного ворога."
  nf_ncn.43.a:0 "Юта об’єднана під Богом."
  nf_ncn.43.b:0 "Вони божевільні. Просто божевільні."
  #######################################################
  nf_ncn.50.t:0 "Рахунок за податки"
  nf_ncn.50.d:0 "Єремія вимагає змінити керівництво, аби сплатити борги перед Нью-Ханааном. Маючи контроль над нашою економікою, більшість лідерів схильні погодитися. Але деякі вважають, що треба чинити опір! Починається громадянська війна між прихильниками Нью-Ханаану й тими, хто хоче повернутись до старих порядків."
  nf_ncn.50.a:0 "Це жахливо..."
  #######################################################
  nf_ncn.51.t:0 "Опалений Чоловік іде за нами"
  nf_ncn.51.d:0 "Падіння Нью-Ханаану не стало кінцем ханаанців. Тепер вони слідують за примарою — Опаленим Чоловіком. Цей монстр, якого Цезар скинув у Великий Каньйон, блукає пустками в пошуках помсти. Він вимагає приєднатися до його війни проти Білоногих, або зазнати його гніву. Що нам робити?"
  nf_ncn.51.a:0 "Я не хочу вмирати! Погоджуємось!"
  nf_ncn.51.b:0 "Якась примара нам не страшна."
  #######################################################
  nf_ncn.52.t:0 "[NCN.GetLeader] благає про допомогу"
  nf_ncn.52.d:0 "Після падіння їхньої столиці лідер ханаанців звертається до нас по допомогу. Вони просять дозволу поселити біженців у [446.GetName], звідки ресурси підуть до місця їхнього нового притулку. Ханаанці дали нам чимало, але чи не занадто це?"
  nf_ncn.52.a:0 "Ти з Печальних? Разом б’ємо Білоногих, що оскверняють святе, так?"
  nf_ncn.52.b:0 "Сумуємо разом із вами, але боїмося Білоногих..."
  #######################################################
  nf_ncn.53.t:0 "[SOR.GetLeader] приймає наш запит"
  nf_ncn.53.d:0 "Печальні простягнули руку дружби й співчуття. Вони погодилися прийняти наших біженців у [446.GetName]."
  nf_ncn.53.a:0 "Дякуємо тобі, друже."
  nf_ncn.53.a_tt:0 "\nБо Я був голодний — і ви дали Мені їсти, спраглий — і ви напоїли Мене, чужинець — і ви прийняли Мене.\n"
  #######################################################
  nf_ncn.54.t:0 "[SOR.GetLeader] відмовляє нам"
  nf_ncn.54.d:0 "Печальні висловлюють співчуття, та все ж відхиляють наше прохання. Схоже, [WHT.GetLeader] остаточно зачерствив серця Юти. Землі Печальних для нас тепер закриті."
  nf_ncn.54.a:0 "Ми плакали, згадавши Зайон."
  #######################################################
  nf_ncn.55.t:0 "\"Данці\": зростаюча єресь?"
  nf_ncn.55.d:0 "Джессіка Вортон, молодша місіонерка й ревна фанатка, сьогодні вдерлася на зустріч духовенства, тягнучи за комір Меттью Гріна. Перед усім керівництвом Церкви вона звинуватила його в єресі! Їхня група, за словами Джессіки, називає себе «данськими» мормонами, аби відрізнити себе від нашої Церкви. Меттью лише зітхнув і пояснив, що мова про культурну спадщину: їхні предки походять із «Данії», десь за Східним Морем. На його думку — це велике непорозуміння, і багато щирих «данських» мормонів і не здогадуються про своє походження. То це проста історія — чи завуальована загроза? Що нам робити з цими двома? І чи існує взагалі «Данія»?\n\nДоступ до ретельно збережених записів довоєнної Церкви допоміг би прояснити ситуацію, але після апокаліпсису й грабунків вони втрачені. [NCN.GetLeader] та духівництво мають самі вирішити — або чекати на знак Божий."
  nf_ncn.55.a:0 "Вони маскують єресь під тістечко!"
  nf_ncn.55.a_tt:0 "§OМеттью§!, наш §Yрадник з культури§!, буде §Rвигнаний§! з Церкви разом із своїми §O«данськими» єретиками.§!\n\n"
  nf_ncn.55.b:0 "Це звучить цілком правдоподібно."

