convert_tribes_daniel_south:0 "Навернути [From.GetName]"

ncn_conversion_daniel_sack_of_new_canaan:0 "Добра Вістка"
ncn_conversion_daniel_sack_of_new_canaan_desc:0 "Гоніння не зупиняють істину — вони лише розпалюють її полум’я. Попри наклепи й глум, старійшини Церкви несуть Євангеліє і плекають спасіння світу."

