l_english:
  ## Judges / Судді
  NCN_judge_1:0 "Час Суддів"
  NCN_judge_1_desc:0 "Церква Ісуса Христа Святих Останніх Днів готувалася до кінця часів, але навіть ми не були готові до Великої Війни. Частина наших людей сховалась у Сховище, очолювана старійшиною Церкви. Проте Пророк не встиг добігти й загинув у вибуху. У Сховищі було обрано нового Пророка. Та в цих падших пустках Пророки надихалися прикладом Суддів зі Старого Заповіту."
  NCN_judge_2:0 "Рішення Егуда"
  NCN_judge_2_desc:0 "Один із пророків Нового Ханаану, Егуд, врятував нас від рейдерської загрози. Його підхід до боротьби з дикими виживальниками став прикладом для всіх віруючих."
  NCN_judge_3:0 "Людина Відваги"
  NCN_judge_3_desc:0 "Гедеон прийшов до влади, коли Новий Ханаан почав контролювати Юту та торгові шляхи Заходу. Перед обличчям загроз із Монтани та південних племен, він для багатьох став символом найвищої могутності нашої спільноти."
  NCN_judge_4:0 "У ті дні не було царя в Ізраїлі"
  NCN_judge_4_desc:0 "Девора ніколи не була формальним пророком, бо Церква не дозволяла жінкам очолювати її. Але любили її чи ненавиділи — саме її правління сформувало Новий Ханаан. Взявши простий титул 'мер', вона затьмарила тодішнього пророка."

  ## Threat Trees / Гілка загроз
  NCN_growing_threat:0 "Зростаюча загроза"
  NCN_growing_threat_desc:0 "На півдні, за Вісімдесятниками та Смоляними Ходоками, біля самого Колорадо мешкає плем’я, що зветься Білоногі. Вони стрімко мілітаризуються й, схоже, рішуче налаштовані підкорити Юту. Але ж не дійдуть так далеко на північ, правда?"
  NCN_attempt_lr:0 "Спроба обмеженого переозброєння"
  NCN_attempt_lr_desc:0 "Щоб пережити атаку Білоногих, нам потрібна зброя. Але ми не можемо зробити багато: громада досі не вірить, що напад можливий."
  NCN_army_of_our_own:0 "Нам потрібна власна армія"
  NCN_army_of_our_own_desc:0 "Щоб захиститися від ворогів, ми маємо виставити власне військо ханаанців. Племінники не зможуть захистити батьківщину так, як наші вірні."
  NCN_quantity_over_quality:0 "Кількість понад якість"
  NCN_quantity_over_quality_desc:0 "Нам потрібні люди, неважливо, наскільки добре вони навчені."
  NCN_continue_tribal_reliance:0 "Продовжити залежність від племен"
  NCN_continue_tribal_reliance_desc:0 "Уже майже століття ми покладаємось на навернених племенників, що боронять нас від рейдерів. Ми маємо розгорнути це в масштабах усієї Юти й закликати племена до зброї."
  NCN_arm_tribal_divisions:0 "Озброїти племінні загони"
  NCN_arm_tribal_divisions_desc:0 "Нові міліції сформовано — тепер їм потрібна зброя. Треба будувати нові майстерні!"
  NCN_assist_the_tribes:0 "Допомогти племенам"
  NCN_assist_the_tribes_desc:0 "Прийде день, коли Господь повернеться судити нас. А до того — ми повинні слідувати Його законам і вчити інших. Саме тому ми торгуємо й співпрацюємо з племенами. У нас є дещо цінніше за їжу чи ліки — добра звістка."
  NCN_weapon_shipments:0 "Відправити зброю племенам"
  NCN_weapon_shipments_desc:0 "Хоч наші сили вже непогано озброєні, племена, які стоять на шляху Білоногих, мають значно гірше забезпечення. Якщо надішлемо їм зброю, зможемо уповільнити ворога."
  NCN_preach_holy_war:0 "Проповідувати святу війну"
  NCN_preach_holy_war_desc:0 "Ми маємо вплив у громадах, що страждають від Білоногих. Якщо ми почнемо проповідувати більш бойову філософію, це надихне їх на боротьбу."
  NCN_direct_assistance:0 "Надати пряму допомогу"
  NCN_direct_assistance_desc:0 "Ослабивши деякі суворі догми, ми можемо дозволити нашим юнакам воювати за Господа проти Білоногих."
  NCN_generalarm:0 "Готуватись до війни"
  NCN_generalarm_desc:0 "\"А Мойсей сказав синам Гада та Рувима: Чи підете ви на війну, а брати ваші сидітимуть тут?\""
  NCN_end_our_isolation:0 "Завершити ізоляцію"
  NCN_end_our_isolation_desc:0 "Ми думали, що зможемо бути осторонь світу. Але світ прийшов за нами. Пора скоротити споживання і готуватись до війни..."
  NCN_line_in_the_sand:0 "Провести межу"
  NCN_line_in_the_sand_desc:0 "Білоногі зайшли надто далеко. Далі їм — зась. Ми проводимо межу, через яку ніхто не пройде."
  NCN_fortify_south:0 "Укріпити південь"
  NCN_fortify_south_desc:0 "Межу окреслено — тепер ми маємо захищати її до останнього."
  NCN_build_tribal_industry:0 "Будувати майстерні для племен"
  NCN_build_tribal_industry_desc:0 "Племена, яким ми проповідуємо, неспроможні себе захистити. Ми маємо дати їм засоби для виробництва зброї."
  NCN_bring_war_to_wht:0 "Принести війну Білоногим"
  NCN_bring_war_to_wht_desc:0 "Час настав. Білоногі на порозі. Вони заслужили свою кару. Deus vult!"

  ## Decadence / Декаданс
  NCN_decadence_clutches:0 "Обійми декадансу"
  NCN_decadence_clutches_desc:0 "Наш народ збагатився завдяки торгівлі через пустки Юти. Але жадоба до кришок змусила багатьох забути про Бога. Чим це закінчиться?"
  NCN_follower_1:0 "Послідовники Апокаліпсису"
  NCN_follower_1_desc:0 "Бо Я був голодний — і ви дали Мені їсти, спраглий — і ви напоїли Мене, чужинець — і ви прийняли Мене."
  NCN_follower_2l:0 "Прийняти Послідовників"
  NCN_follower_2l_desc:0 "Возлюблені, це вірна справа — допомагати братам, хоч і чужинцям."
  NCN_follower_2r:0 "Переслідувати Послідовників"
  NCN_follower_2r_desc:0 "\"Скажи синам Ізраїлю: Хто з вас чи з чужинців дасть дитину свою Молоху — той буде вбитий. Народ землі поб’є його камінням.\""
  NCN_tribals_at_the_door:0 "Варвари біля воріт"
  NCN_tribals_at_the_door_desc:0 "Можливо, ще не пізно врятувати Новий Ханаан від Білоногих і зберегти Божих дітей у цьому храмі життя."
  NCN_war_for_heaven:0 "Війна за Небеса"
  NCN_war_for_heaven_desc:0 "Ніхто не вірив, що цей день настане. Та він настав. Білоногі оголосили повномасштабну війну нашому народу. Ми маємо стати до боротьби — або загинемо."
  NCN_canaan_in_flames:0 "Ханаан у вогні"
  NCN_canaan_in_flames_desc:0 "О, горе! Бог покарав нас за пиху й декаданс, і тепер Ханаан палає в нічному небі.\n\nІ вони плакали, згадавши Зайон."
  NCN_canaan_in_glory:0 "Ханаан у славі"
  NCN_canaan_in_glory_desc:0 "Зі взяттям Лінкона Білоногі розпорошились по пустках. Війну виграно."
  NCN_nothing_to_chance:0 "Маємо передбачити все"
  NCN_nothing_to_chance_desc:0 "\"Працьовиті руки пануватимуть, а ліниві — стануть рабами.\""
  NCN_upper_colorado:0 "Закріпитись на Верхньому Колорадо"
  NCN_upper_colorado_desc:0 "\"Коли ти перейдеш через води — Я з тобою; і через ріки — вони тебе не затоплять; коли підеш через вогонь — не опечешся, і полум’я тебе не спалить.\""
  NCN_crush_clockwatchers:0 "Придушити Хранителів часу"
  NCN_crush_clockwatchers_desc:0 "\"Час любити — і час ненавидіти; час війни — і час миру.\""
  NCN_a_return_to_normality:0 "Повернення до звичайного життя"
  NCN_a_return_to_normality_desc:0 "Найгостріші кризи позаду. Ми, здається, повертаємося до нормального життя..."
  NCN_riches_roads:0 "Багатства та дороги Юти"
  NCN_riches_roads_desc:0 "Торгівля приносила нам величезні прибутки до війни з Білоногими. Пора відновити її."
  NCN_repair_roads:0 "Відновити зруйновані дороги"
  NCN_repair_roads_desc:0 "У боях було зруйновано багато шляхів. Потрібно негайно їх ремонтувати, аби торгівля знову розквітла."
  NCN_produce_goods:0 "Виробляти більше товарів"
  NCN_produce_goods_desc:0 "Щоб повноцінно скористатись торговими шляхами, ми маємо розширити свої виробничі можливості. Чим більше товарів — тим більше караванів!"
  
  NCN_safeguard_routes:0 "Захистити торгові шляхи"
  NCN_safeguard_routes_desc:0 "Навчивши наших генералів оборонній тактиці, ми зможемо надійно захистити ключові поселення та перехрестя."
  
  NCN_arm_caravans:0 "Озброїти каравани"
  NCN_arm_caravans_desc:0 "Наші вояки не можуть бути всюди. Але якщо ми озброїмо торговців — вони самі зможуть про себе подбати. Можливо, це ще й просуне наші знання в галузі зброї."
  
  NCN_trade_flourishes:0 "Торгівля квітне біля Солоного Озера"
  NCN_trade_flourishes_desc:0 "Завдяки зусиллям щодо розширення, торгівля біля Солоного Озера процвітає. Ми маємо зміцнити свої транспортні можливості, щоб не відставати!"
  
  NCN_scavenge_the_vaults:0 "Обшукати Сховища"
  NCN_scavenge_the_vaults_desc:0 "У пустках розкидані численні Сховища — як Vault-Tec, так і урядові. Багато з них заховані або добре охороняються. Але зусилля можуть принести нам цінні ресурси."
  
  NCN_control_drug_routes:0 "Контролювати південні наркотрафіки"
  NCN_control_drug_routes_desc:0 "Рейдери й контрабандисти використовують вузькі проходи Великого Каньйону, щоби прокрадатись у наші землі. Це має припинитися."
  
  NCN_our_link:0 "Наш зв'язок із Заходом"
  NCN_our_link_desc:0 "I-80 — одна з небагатьох магістралей, що збереглася після війни. Вона проходить прямо через наші землі. Поселивши вірних вздовж неї, ми зможемо зміцнити торгівлю й дипломатію."
  
  NCN_utah_prospers:0 "Юта процвітає"
  NCN_utah_prospers_desc:0 "Завдяки нашим зусиллям щодо покращення умов для торговців і місцевих, уся Юта процвітає!"
  
  NCN_arm_the_faithful:0 "Пожертви на військові потреби"
  NCN_arm_the_faithful_desc:0 "\"Приготуй діло своє надворі, і владнай усе в полі, а потім збудуй дім свій.\""
  
  NCN_continue_the_campaign:0 "Продовжити кампанію"
  NCN_continue_the_campaign_desc:0 "\"Проголосіть народам: Освятіться на війну! Прокиньтеся, мужі хоробрі, наблизьтесь, усі мужі війни!\""
  
  NCN_pay_off_the_north:0 "Задобрити північ"
  NCN_pay_off_the_north_desc:0 "\"Вона думає про поле — й купує його, з плоду рук своїх садить виноградник.\""
  
  NCN_protect_southern_flank:0 "Захистити південний фланг"
  NCN_protect_southern_flank_desc:0 "\"На мурах твоїх, Єрусалиме, я поставив сторожів, що вдень і вночі не замовкнуть.\""
  
  NCN_pay_off_the_south:0 "Задобрити південь"
  NCN_pay_off_the_south_desc:0 "\"Підкуп — немов чарівний камінь у очах того, хто його дає: куди тільки повернеться — має успіх.\""
  
  NCN_end_the_80s:0 "Покласти край Вісімдесятникам"
  NCN_end_the_80s_desc:0 "\"Коли звершується правосуддя — це радість для праведника й жах для злочинця.\""
  
  NCN_word_of_god_north:0 "Слово Боже йде на північ"
  NCN_word_of_god_north_desc:0 "\"Хто увірує й охреститься — буде спасенний, а хто не увірує — буде осуджений.\""
  NCN_word_of_god_north_tt:0 "Відкриває §Yрішення§! щодо навернення північних народів і здобуття §Yнаціоналізації§! на ці території."
  
  NCN_word_of_god_south:0 "Слово Боже йде на південь"
  NCN_word_of_god_south_desc:0 "\"Покайтесь, і нехай охреститься кожен з вас в ім’я Ісуса Христа на відпущення гріхів — і приймете дар Святого Духа.\""
  NCN_word_of_god_south_tt:0 "Відкриває §Yрішення§! щодо навернення південних народів і здобуття §Yнаціоналізації§! на ці території."
  
  NCN_gods_will:0 "Воля Божа не знає кордонів"
  NCN_gods_will_desc:0 "\"І почув я кожне створіння — на небі, на землі, під землею й у морі — що промовляло: Благословення і слава, честь і сила Тому, хто сидить на престолі, і Ягняті — на віки вічні!\""
  
  NCN_god_and_gold:0 "Бог і Золото"
  NCN_god_and_gold_desc:0 "\"Хто любить гроші — не насититься грошима; і хто багатство — не має від нього користі. І це — марнота.\""
  
  NCN_economic_reform:0 "Економічні реформи"
  NCN_economic_reform_desc:0 "\"Нечесно здобуте багатство зникне, а хто збирає по трохи — той примножить його.\""
  
  NCN_drop_the_pretense:0 "Скинути маску"
  NCN_drop_the_pretense_desc:0 "\"Нечесний розпалює сварку, а пліткар роз’єднує друзів.\" Єремія став лідером Нового Ханаану й веде нас у майбутнє!"
  
  NCN_armament_programs:0 "Продовжити переозброєння"
  NCN_armament_programs_desc:0 "\"Візьміть повну зброю Божу, щоб ви могли чинити опір у день лихий і, встоявши, усе перемогти.\""
  
  NCN_corrupt_the_south:0 "Торгівля з півднем"
  NCN_corrupt_the_south_desc:0 "\"Бо любов до грошей — корінь усякого зла. Через неї деякі відступили від віри та пронизали себе численними болями.\""
  NCN_corrupt_the_south_tt:0 "Відкриває §Yрішення§! для схиляння південних народів Юти до вашої торговельної імперії."
  
  NCN_corrupt_the_north:0 "Підмазати північ"
  NCN_corrupt_the_north_desc:0 "\"Хто хоче швидко збагатитись — впаде в спокусу та пастку, й у численні безглузді й шкідливі бажання, що ведуть до загибелі.\""
  NCN_corrupt_the_north_tt:0 "Відкриває §Yрішення§! для схиляння північних народів Юти до вашої торговельної імперії."
  
  NCN_exploit_contracts:0 "Використати торгові контракти"
  NCN_exploit_contracts_desc:0 "\"Не будь серед тих, хто ручається, хто стає заставою за борги.\""
  
  NCN_taxes_come_due:0 "Прийшов податковий час"
  NCN_taxes_come_due_desc:0 "\"Віддайте кесареві кесареве — але не тому кесареві.\""
  NCN_taxes_come_due_tt:0 "Відкриває можливість §Yпереворотів§! у зіпсованих північних державах — ви отримаєте їх як §Yмаріонетки§!."
  
  NCN_pay_debts:0 "Змусити платити борги"
  NCN_pay_debts_desc:0 "\"Хто без розуму — стає заставою перед ближнім своїм.\""
  NCN_pay_debts_tt:0 "Відкриває можливість §Yпереворотів§! серед південних народів, що винні борги Новому Ханаану."
  
  NCN_invest_in_local_industries:0 "Інвестиції в місцеву промисловість"
  NCN_invest_in_local_industries_desc:0 "\"Хто сіє скупо — скупо й жатиме; а хто сіє щедро — щедро й пожне.\""
  
  NCN_economic_centralization:0 "Централізація економіки"
  NCN_economic_centralization_desc:0 "\"Багатство, здобуте поспіхом, щезне. Але хто збирає поступово — примножить його.\""
  
  NCN_autonomy_for_tariffs:0 "Автономія за мита"
  NCN_autonomy_for_tariffs_desc:0 "\"Навіщо дурневі гроші, щоб купити мудрість, коли в нього немає розуму?\""
  
  NCN_stoke_revanchism:0 "Розпалити реваншизм"
  NCN_stoke_revanchism_desc:0 "\"Я був охрещений двічі — водою і полум’ям. Я носитиму святе вогнище в серці, доки не стану перед Господом на Суд.\""
  
  NCN_building_an_army:0 "Будуємо армію"
  NCN_building_an_army_desc:0 "\"Я не люблю вбивати, але коли це по правді — то лише обов’язок, як і будь-який інший.\""
  
  NCN_caesars_right_hand_man:0 "Права рука Цезаря"
  NCN_caesars_right_hand_man_desc:0 "\"Я хочу помститися. Йому. Цезарю. Я хочу назвати це гнівом Божим, щоб виправдати все, що зробив.\""
  
  NCN_peace_through_arms:0 "Мир через зброю"
  NCN_peace_through_arms_desc:0 "\"Іноді я кажу собі, що ці вогні ніколи не згаснуть. Але ж саме я їх запалюю. Не Бог. Не вони.\""
  NCN_peace_through_arms_tt:0 "Відкриває §Yрішення§! для підкорення племен Юти під владу Джошуа Ґрема. Як інакше здолати Білоногих?"

  NCN_kickstart_war_economy:0 "Запустити воєнну економіку"
  NCN_kickstart_war_economy_desc:0 "Хоч Білоногі знищили Новий Ханаан, вони не знищили всі наші склади. Ми можемо використати те, що залишилось, щоб підготуватись до наступного раунду битви."

  NCN_recruit_tribal_fanatics:0 "Залучити фанатиків серед племен"
  NCN_recruit_tribal_fanatics_desc:0 "Я і Мертві Коні готові зробити все, аби захистити Зайон від Білоногих."
  NCN_recruit_tribal_fanatics_tt:0 "§YЯдра§! на землі §Y[SOR.GetName]§! і §Y[DEA.GetName]§!. Якщо вони є вашими маріонетками, ви їх §Yанексуєте§!."

  NCN_guns_bring_us_closer_to_god:0 "Зброя наближає нас до Бога"
  NCN_guns_bring_us_closer_to_god_desc:0 "Цей тип пістолета .45 був розроблений одним із членів мого племені майже чотириста років тому. Навчання володінню ним — це обряд посвяти ханаанця."

  NCN_rely_on_tribal_battalions:0 "Покладатися на племінні батальйони"
  NCN_rely_on_tribal_battalions_desc:0 "Я виконую обов’язки воєначальника Мертвих Коней. Вони довіряють мені ці справи, але моя влада — це лише довіра, яку вони мені дали."

  NCN_militarize_the_nation:0 "Мілітаризувати народ"
  NCN_militarize_the_nation_desc:0 "Печальні — вправні мисливці, але не воїни. Вони не знали війни чи рейдерів протягом десятиліть. Ми виправимо цю слабкість."

  NCN_god_do_all_the_work:0 "Бог сам усе не зробить"
  NCN_god_do_all_the_work_desc:0 "Ми попереджали вас у Сіракузах, але ви не зупинилися. Ви скористалися нашою слабкістю в Новому Ханаані, вигнали нас, і як справжні пси Цезаря — переслідували нас до Зайону. Тепер ви стоїте на святій землі, у храмі Божої слави. Але єдине місце для звіра в храмі — на жертовнику!"

  NCN_caesar_and_king:0 "Цезар і Цар"
  NCN_caesar_and_king_desc:0 "\"Віддайте кесареві — кесареве.\" Та цього разу ми розплатимось із ним за підтримку Білоногих."

  NCN_trouble_colorado:0 "Неспокій через Колорадо"
  NCN_trouble_colorado_desc:0 "Господь може бути нашою фортецею, але кілька бункерів теж не завадять."

  NCN_secure_canyon_lookouts:0 "Забезпечити контроль над каньйоном"
  NCN_secure_canyon_lookouts_desc:0 "\"Хоч я йду долиною тіні смертної — не злякаюся лиха.\""

  NCN_send_mission_to_mojave:0 "Відправити місію до Мохаве"
  NCN_send_mission_to_mojave_desc:0 "\"І якщо вітаєте тільки братів ваших — що надзвичайного робите? Хіба й язичники не так само чинять?\""

  NCN_best_bad_bunch:0 "Найкращі серед поганих"
  NCN_best_bad_bunch_desc:0 "Будь-яке суспільство, що черпає владу лише з волі людей, а не з Бога — впаде. Але до того часу, ми можемо співпрацювати з НКР, щоб знищити більші загрози."

  NCN_NCR_friends:0 "Цивілізовані суспільства"

  NCN_citizenship_for_all:0 "Громадянство для всіх віруючих"
  NCN_citizenship_for_all_desc:0 "Хоч дехто з християн Юти не визнає вчення Бригема Янга — вони наші брати по Книзі. Усі єдині в Христі."

  NCN_kingdom_of_god:0 "Царство Боже на Землі"
  NCN_kingdom_of_god_desc:0 "Здавна пророкувалося, що Господь знову прийде на Землю і судитиме народи. Ми підготували для Нього Царство — Дезерет, Царство Боже на Землі."

  NCN_allies_of_convenience:0 "Союзники з вигоди"
  NCN_allies_of_convenience_desc:0 "НКР надто любить гроші й власність, але не достатньо Бога й милосердя. Та все ж, вони кращі за Цезаря — хоча це низька планка."

  NCN_end_caesar:0 "Покласти край тиранії Цезаря"
  NCN_end_caesar_desc:0 "\"Не бійся того, що маєш витерпіти. Ось, диявол кине дехто з вас до в’язниці, щоб ви були випробувані. Будь вірний до смерті — і Я дам тобі вінець життя.\""

  NCN_develop_support:0 "Розвивати допоміжне забезпечення"
  NCN_develop_support_desc:0 "Щоб протистояти Легіону, нашим підрозділам потрібна не лише зброя, а й достатнє забезпечення. Самими рушницями ми не виграємо війну!"

  NCN_return_dead_city:0 "Повернення до Міста Мертвих"
  NCN_return_dead_city_desc:0 "Кістяк, Фінікс, Нью-Вегас — лише каміння і метал. Новий Ханаан загинув, але плем’я живе. І навіть мертве місце може знову ожити."

  NCN_bring_light_to_utah:0 "Принести світло Юті"
  NCN_bring_light_to_utah_desc:0 "Ми, ханаанці, віримо, як і багато до нас, що Бог прийшов у цей світ як Ісус Христос. Він пожертвував собою заради спасіння. Всі гріхи, кожне зло — змито Його кров’ю. Ми лише маємо прийняти Його любов. Саме тому ми йдемо до племен — нести Добру Новину."

  NCN_send_missionaries_north:0 "Відправити місіонерів на північ"
  NCN_send_missionaries_north_desc:0 "\"Любов має бути щирою. Ненавидьте зло, тримайтеся добра. Будьте віддані одне одному, в пошані випереджайте інших...\""

  NCN_send_missionaries_south:0 "Відправити місіонерів на південь"
  NCN_send_missionaries_south_desc:0 "Протягом нашої історії ми називали багато місць Зайоном. Ця долина прекрасна, але Зайон — не місце. Це стан душі."

  NCN_libraries_of_the_lord:0 "Бібліотеки Господні"
  NCN_libraries_of_the_lord_desc:0 "Знаєш що, тримай. У нас зараз багато справ, але прочитай це. Може зненавидиш. Може заснеш. Але, може, знайдеш Бога."

  NCN_loyalties_amongst_clergy:0 "Вірність серед духовенства"
  NCN_loyalties_amongst_clergy_desc:0 "\"І ви, немов живе каміння, будуєтесь у дім духовний, на священство святе, щоби приносити духовні жертви, приємні Богові через Ісуса Христа.\""

  NCN_loyalties_amongst_army:0 "Замінити місцевих шерифів"
  NCN_loyalties_amongst_army_desc:0 "\"Ви — рід вибраний, царське священство, народ святий, народ Божий, щоб проголошувати Його славу, що покликав вас із темряви до світла чудесного.\""

  NCN_old_practices_for_new_times:0 "Старі практики для нових часів"
  NCN_old_practices_for_new_times_desc:0 "Ми ніколи не жили легко, але раніше було краще. Світ змінився після Великої Війни, але це не причина відкидати вчення Церкви. Ми маємо перебудувати себе, аби знову наблизитись до Господа."

  NCN_a_peoples_church:0 "Церква народу"
  NCN_a_peoples_church_desc:0 "Ми, духовенство, лише провідники між людьми й Господом. Якщо залучимо весь народ до церковного життя, зможемо об’єднати наші землі."

  NCN_preach_to_the_masses:0 "Проповідувати масам"
  NCN_preach_to_the_masses_desc:0 "Кожен у наших землях і далі заслуговує почути Слово Боже. Ми відправимо місіонерів і встановимо радіовежі, щоби транслювати Його волю."

  NCN_the_word_of_god:0 "Почути Слово Боже"
  NCN_the_word_of_god_desc:0 "Наш Батько навчає нас терпінню й співчуттю. Але перед обличчям ворога, що не покладе зброї, Господь дозволяє війну. Вісімдесятники мають бути поставлені на місце, або Юта не знатиме миру."

  NCN_control_over_deseret:0 "Утвердити владу над Дезеретом"
  NCN_control_over_deseret_desc:0 "Нова Теократія Дезерету, що охоплює всю Юту, тепер віддана слову Господньому. Ми маємо переконатись, що кожен куточок Юти виконує нашу волю — задля єдності пастви."

  NCN_a_mission_fulfilled:0 "Місію виконано"
  NCN_a_mission_fulfilled_desc:0 "Місяцями Деніел мандрував пустками Юти, проповідуючи всім, хто готовий слухати. І ось — Юта побачила світло Господнє. І тепер Деніел може, нарешті, трохи відпочити..."

  NCN_cultivate_mormon_settlements:0 "Розвивати мормонські поселення"
  NCN_cultivate_mormon_settlements_desc:0 "Заохочуючи відданих мормонів оселятися на віддалених землях, ми зміцнимо віру й відродимо місцеву торгівлю."

  NCN_end_of_timekeepers:0 "Прийняти біженців із Хранителів Часу"
  NCN_end_of_timekeepers_desc:0 "Язичники на півдні втратили свій час. Можливо, ми дамо їм прихисток?"

  NCN_welcome_dwellers:0 "Прийняти Хранителів"
  NCN_welcome_dwellers_desc:0 "\"Носіть тягарі один одного — так виконаєте закон Христів.\""
  NCN_welcome_dwellers_tt:0 "Двоє біженців з Хранителів Часу стануть доступні як §Yрадники§!.\n"

  NCN_reject_unrepentant:0 "Відкинути ідолопоклонників"
  NCN_reject_unrepentant_desc:0 "\"Ідіть і кличте до богів, яких собі обрали. Хай вони вас рятують у час скрути.\""
  NCN_reject_unrepentant_tt:0 "Лише один вигнанець із Хранителів стане доступним як §Yрадник§!. Інші відмовляться навертатися...\n"

  NCN_explore_ogden_armory:0 "Обшукати Арсенал Огдена"
  NCN_explore_ogden_armory_desc:0 "Ми довго ігнорували до-воєнний арсенал в Огдені, але часи змінились. Час знайти зброю наших предків."

  NCN_arms_for_church:0 "Зброя для Церкви"
  NCN_arms_for_church_desc:0 "Ми можемо передати зброю вірним [NCN.GetLeader]. Це зміцнить його владу, хоч і не обов'язково нашу армію."

  NCN_arms_for_officers:0 "Зброя для офіцерів"
  NCN_arms_for_officers_desc:0 "Є аргумент, що зброю варто передати армії, а не фанатикам Пророка."

  NCN_distribute_arms_tribal:0 "Озброїти племена"
  NCN_distribute_arms_tribal_desc:0 "Забезпечимо зброєю племена Юти. Кожен їхній постріл — менше вбитих серед нас."

  NCN_follower_3:0 "Надати притулок Послідовникам"
  NCN_follower_3_desc:0 "Послідовники дивакуваті, але щирі. Вони не моляться — вони діють. Вони хочуть змінити цей світ. І це гідно поваги."
  NCN_follower_3_tt:0 "§gПослідовники Апокаліпсису поселяться на наших землях, відкриваючи нові §Yрішення§!.\n"

  NCN_follower_4:0 "Навчити польових медиків"
  NCN_follower_4_desc:0 "Послідовники згодні працювати як медики в обмін на нашу підтримку. Справжня допомога!"

  NCN_bargain_with_utah_traders:0 "Укласти угоди з торговцями Юти"
  NCN_bargain_with_utah_traders_desc:0 "Ми можемо використати своє розташування на торгових шляхах, щоб зібрати кошти на нову армію. Як і заповідав Бригем Янг."

  NCN_preach_to_caravans:0 "Проповідувати караванам"
  NCN_preach_to_caravans_desc:0 "Ми платимо чесно, і більшість караванників це влаштовує. Але, можливо, деякі з них відкриті до слова Господа."
  preached_to:0 "Почули Слово Ханаану"

  NCN_funnel_trade:0 "Спрямувати торгівлю в села"
  NCN_funnel_trade_desc:0 "Через зруйновані дороги багато сіл Юти відрізані. Ми можемо розчистити старі шляхи й побудувати нові."

  NCN_introduce_road_tariffs:0 "Ввести дорожні мита"
  NCN_introduce_road_tariffs_desc:0 "Крімсон Караван хоче відкрити філію у Ханаані. Ми не проти — але обкладемо їх податками. Нічого особистого, лише бізнес."

  NCN_hire_caravan_guards:0 "Найняти охоронців для караванів"
  NCN_hire_caravan_guards_desc:0 "Юта — це повно рейдерів, диких племен і воєначальників. Треба захищати каравани, інакше вони не пройдуть."

  NCN_luxury_goods:0 "Розкішні товари"
  NCN_luxury_goods_desc:0 "\"І той самий Бог забезпечить усі ваші потреби згідно з багатством Своєї слави в Христі Ісусі.\""

  NCN_in_pious_hands:0 "У руках благочестя"
  NCN_in_pious_hands_desc:0 "Може, у цьому світі більше не лишилося місця для милосердя. Але навіть якщо воно знищить нас — ми не відмовимось від нього."

  NCN_fall_back_on_scripture:0 "Спиратись на Писання"
  NCN_fall_back_on_scripture_desc:0 "Ми віримо, що для кожного є шлях до спасіння. І ми маємо показати цей шлях усім, хто готовий слухати."

  NCN_teach_the_beautitudes:0 "Навчати Блаженств"
  NCN_teach_the_beautitudes_desc:0 "Блаженства з Євангелія від Матвія — основа нашої віри. Вони проведуть нас крізь темні часи й змусять згадати, хто ми є насправді."

  NCN_rebuild_destroyed_settlements:0 "Відновити зруйновані поселення"
  NCN_rebuild_destroyed_settlements_desc:0 "Ми боремося не за каміння і воду, а за віру. Це те, що витримає навіть кінець світу."

  NCN_preach_in_occupied_lands:0 "Проповідувати на окупованих землях"
  NCN_preach_in_occupied_lands_desc:0 "Завдяки нашій допомозі на півдні, місцеві відкрились до віри. Треба проповідувати — можливо, вони знайдуть Бога."

  NCN_god_strengthens_our_resolve:0 "Бог зміцнює наш дух"
  NCN_god_strengthens_our_resolve_desc:0 "Іноді потрібно бути суворими. Ми можемо пристосувати старі притчі до нової боротьби, і навчити народ Божій силі."

  NCN_distribute_aid:0 "Допомога безпомічним"
  NCN_distribute_aid_desc:0 "У пустках мало хто допомагає чужим. Але ми поділимось, чим можемо."

  NCN_home_is_non_negotiable:0 "Наш дім — не предмет торгу"
  NCN_home_is_non_negotiable_desc:0 "Ми готові йти на поступки. Але Новий Ханаан і Новий Єрусалим — наші, і не підлягають обговоренню."

  NCN_produce_for_the_lord:0 "Працювати на Господа"
  NCN_produce_for_the_lord_desc:0 "\"У всякій праці — прибуток, а пусті слова ведуть до бідності.\""

  NCN_reach_out_to_the_tribes:0 "Протягнути руку племенам"
  NCN_reach_out_to_the_tribes_desc:0 "Ми допомагали Печальним — лікували, радили, навертали. Тепер і вони можуть допомогти нам."
  NCN_reach_out_to_the_tribes_tt:0 "Отримаєте людські ресурси від племен у знак вдячності."

  friends_of_the_faith:0 "Друзі віри"

  NCN_new_theology:0 "Нова теологія"
  NCN_new_theology_desc:0 "\"Диявол підлещується, мовляв ми праведні, поки ми годуємось з гріхів інших. Якщо хочеш милості Божої — даруй милість сам.\" — Джозеф Сміт"

  NCN_the_arms_of_god:0 "Зброя Господня"
  NCN_the_arms_of_god_desc:0 "Печальні або й Білоногі можуть здобути всю техніку Старого Світу, підкорити Великий Басейн. Але без Божої любові — це нічого не варте."
  NCN_the_arms_of_god_tt:0 "Відкриває §Yрішення§! для перетворення [SOR.GetNameWithFlag], [CRZ.GetNameWithFlag], [DEA.GetNameWithFlag] на §Yмаріонеток§!."

  NCN_god_brings_us_together:0 "Бог об'єднує нас"
  NCN_god_brings_us_together_desc:0 "Добра звістка — це диво в нашому розбитому світі. Ми вже звикли до нічних жахів, але прокинутися до надії — ось справжнє диво. Навіть вороги почули Добру Новину."

  NCN_preach_whitelegs:0 "Проповідувати Білоногим"
  NCN_preach_whitelegs_desc:0 "Хоч вони й заперечують, багато предків Білоногих колись ходили до Церкви. Можливо, деякі з них знову знайдуть шлях."

  NCN_decentralize_mormonism:0 "Децентралізувати Церкву"
  NCN_decentralize_mormonism_desc:0 "У ці важкі часи, можливо, не Суддя має керувати Церквою. Нехай єпископи самі вирішують — якщо вірні Божому Слову."
  NCN_decentralize_mormonism_tt:0 "Відкриває §Yрішення§! для союзу з сусідніми племенами й надання їм поза-мапової індустрії.\n"

  NCN_centralize_religious_leadership:0 "Закріпити владу"
  NCN_centralize_religious_leadership_desc:0 "Церква належала Пророкам і Президентам. Тепер вона належить Суддям."
  NCN_centralize_religious_leadership_tt:0 "Відкриває §Yрішення§! для приєднання сусідніх племен до віри.\n"

  NCN_squash_corruption:0 "Придушити корупцію"
  NCN_squash_corruption_desc:0 "\"І воїни спитали його: 'Що нам робити?' — Він відповів: 'Не грабуйте, не кривдьте, і задовольняйтесь платнею своєю.'\""

  NCN_combat_poor_reputation:0 "Боротьба зі зіпсованою репутацією"
  NCN_combat_poor_reputation_desc:0 "Дехто каже, що ми заслужили свою долю, бо заробляли на торгівлі. Якщо хочемо йти вперед, мусимо показати: ми слідуємо Господу."

  legion_crushed:0 "§Y[NCN.GetNameWithFlag]§! переміг і зробив нас своєю маріонеткою"

  NCN_withdraw_southern_occupation:0 "Вийти з півдня"
  NCN_withdraw_southern_occupation_desc:0 "З поразкою Білоногих, час піти з південної Юти. Бо є різниця між обороною і завоюванням."

  NCN_aid_the_buffer_states:0 "Допомога племенам"
  NCN_aid_the_buffer_states_desc:0 "Навчимо їх жити правильно в цьому світі, і підготуємо до того, що чекає після нього."

  NCN_disarm:0 "Перекувати мечі на плуги"
  NCN_disarm_desc:0 "Загрозу подолано, час повертатись до близьких і сховати .45.\n\nПоки що."

  NCN_assist_tribal_development:0 "Навчати племена"
  NCN_assist_tribal_development_desc:0 "Племена розумні, але... неосвічені. Ми можемо це змінити."

  NCN_end_clockwatcher_occupation:0 "Завершити окупацію півдня"
  NCN_end_clockwatcher_occupation_desc:0 "Після знищення Білоногих, час дати племенам спокій — під нашим наглядом, звісно."

  NCN_roads_for_tribes:0 "Будівництво доріг для племен"
  NCN_roads_for_tribes_desc:0 "Після війни ми можемо побудувати нові зв’язки з племенами. Можливо, з часом вони стануть охоронцями караванів."

  NCN_peacekeepers_once_more:0 "Знову миротворці"
  NCN_peacekeepers_once_more_desc:0 "Ми не Легіон. Ми служимо духовним потребам Юти та стримуємо радикалізм. Все, що нам лишається — бути вірними, щоб Господь нас прийняв."

  NCN_the_riches:0 "Багатство все ще тече"
  NCN_the_riches_desc:0 "\"А мій Бог за багатством слави своєї нехай сповнить кожну вашу потребу в Христі Ісусі.\""

  NCN_exploit_occupied:0 "Експлуатація Білоногих"
  NCN_exploit_occupied_desc:0 "Ми підкорили Білоногих. Тепер вчинимо з ними так, як вони вчинили б з нами."

  NCN_levy_tariffs:0 "Ввести мита"
  NCN_levy_tariffs_desc:0 "Маючи повний контроль, ми можемо обкласти каравани податками на користь нових храмів — у славу Бога, звісно."

  NCN_trained_caravan_guards:0 "Навчити охоронців караванів"
  NCN_trained_caravan_guards_desc:0 "Торгові шляхи потребують захисту. Слава Богу й гвинтівці."

  NCN_begin_efficiency_reforms:0 "Реформувати економіку"
  NCN_begin_efficiency_reforms_desc:0 "Благодійність — це добре. Але хто заплатить за всі притулки? Настав час зробити прибуток Божим ділом."

  NCN_corruption_reduces_profits:0 "Побороти корупцію!"
  NCN_corruption_reduces_profits_desc:0 "\"Не беріть участі в безплідних ділах темряви, а викривайте їх.\""

  NCN_scavenge_the_battlefield:0 "Обшукувати поля бою"
  NCN_scavenge_the_battlefield_desc:0 "Поле битви повне ресурсу. Навіть зла зброя може служити добру."

  NCN_settle_occupation_strip:0 "Освоїти смугу окупації"
  NCN_settle_occupation_strip_desc:0 "\"А в містах народів, які Господь твій Бог дає тобі у спадок, не залишай нікого живого...\""

  NCN_economic_boom_at_local_expense:0 "Бум за рахунок місцевих"
  NCN_economic_boom_at_local_expense_desc:0 "Ми відбудуємо господарство на плечах примітивів. Адже вони винні нам за спасіння Юти, чи не так?"

  NCN_ensure_utah_remains_aligned:0 "Захистити Юту"
  NCN_ensure_utah_remains_aligned_desc:0 "\"Бо він — Божий слуга на добро тобі. Але якщо чинитимеш зло — бійся...\""

  NCN_improved_caravan_routes:0 "Старі залізниці"
  NCN_improved_caravan_routes_desc:0 "Стара дореволюційна залізниця тягнеться з Ханаану. Відновивши її, ми прискоримо об’єднання Юти."

  NCN_trade_must_flow:0 "Торгівля має тривати"
  NCN_trade_must_flow_desc:0 "\"Таршіш торгував з тобою за твоє багатство: сріблом, залізом, оловом і свинцем.\""

  NCN_exploit_shadow_market:0 "Використати тіньовий ринок"
  NCN_exploit_shadow_market_desc:0 "\"Іди, їж свій хліб з радістю, і пий вино з веселим серцем — бо Господь уже прийняв твої діла.\""

  NCN_spread_corruption:0 "Поширити корупцію"
  NCN_spread_corruption_desc:0 "\"Вони глибоко зіпсувались, як у часи Гівеї...\""

  NCN_rebuild_regroup:0 "Відбудуватися і зібратись"
  NCN_rebuild_regroup_desc:0 "\"І будуть відбудовані від тебе руїни давні... І назвуть тебе відновлювачем проломів, відновлювачем доріг.\""

  NCN_focus_inward:0 "Зосередитися на собі"
  NCN_focus_inward_desc:0 "Ми — плем’я. Родина родин. І коли впаде остання стіна, нас врятує тільки родина."

  NCN_retain_trade_ties:0 "Зберегти торгові зв'язки"
  NCN_retain_trade_ties_desc:0 "Без зв’язку із зовнішнім світом ми загинемо. Разом — сила."

  NCN_petition_sorrows:0 "Звернутись до Печальних"
  NCN_petition_sorrows_desc:0 "Ми зробили багато для Печальних. Час перевірити, чи повернуть вони добром."
  NCN_petition_sorrows_tt:0 "§gМи звернемось до §Y[SOR.GetNameWithFlag]§! з проханням надати ресурси в §Y[446.GetName]§!.\n"

  NCN_expand_scrapyard:0 "Розширити Звалище Верміліон"
  NCN_expand_scrapyard_desc:0 "Щоб розвивати новий дім, треба більше ресурсів. Сміття пустки — золото в руках вірних."

  NCN_never_fallen_again:0 "Більше ніколи не впадемо"
  NCN_never_fallen_again_desc:0 "\"Господь — міцна фортеця моя.\" Та бункери теж не завадять."

  NCN_maintain_naval_links:0 "Утримати водні шляхи"
  NCN_maintain_naval_links_desc:0 "\"І тішились моряки, бо хвилі вщухли, і Господь привів їх до бажаної гавані.\""

  NCN_protect_river_flanks:0 "Захистити береги річки"
  NCN_protect_river_flanks_desc:0 "Колорадо — шлях не тільки для товарів, а й для ворогів. Забезпечимо безпеку назавжди."

  NCN_economy_rebooted:0 "Економіка перезавантажена"
  NCN_economy_rebooted_desc:0 "\"Не втомлюймось творити добро — бо в свій час пожнемо, якщо не ослабнемо.\""

  NCN_clash_with_bear:0 "Придушити конкурентів"
  NCN_clash_with_bear_desc:0 "Вісімдесятники тримають під контролем I-80. Це загрожує нашій торгівлі. Ми не дозволимо їм переважити Ханаан."