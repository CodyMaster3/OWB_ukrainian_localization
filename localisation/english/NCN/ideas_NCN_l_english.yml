l_english:
  ncn_idea_mormon_mission:0 "Мормонська місія"
  ncn_idea_mormon_mission_desc:0 "Місіонери з [NCN.GetName] присутні в нашій країні й мають певний вплив на політику, намагаючись навернути населення."

  ncn_mercy_of_the_shepherd:0 "Милість Пастиря"
  ncn_mercy_of_the_shepherd_desc:0 "Милість Пастиря"

  ncn_idea_church_education:0 "Церковні школи"
  ncn_idea_church_education_desc:0 "Кожен член Церкви має здобути принаймні базову освіту. Освічена паство – це й міцна духовність, і прогрес у дослідженнях."

  ncn_idea_religious_immigrants:0 "Релігійні переселенці"
  ncn_idea_religious_immigrants_desc:0 "Щотижня ми приймаємо нових прочан, які прагнуть жити на Святій Землі поруч із Господом. Їхній притік – велика допомога."

  ncn_idea_religious_immigrants_2:0 "Релігійні переселенці"
  ncn_idea_religious_immigrants_2_desc:0 "Щотижня ми приймаємо нових прочан, які прагнуть жити на Святій Землі поруч із Господом. Їхній притік – велика допомога."

  ncn_idea_utah_caravan_profits:0 "Прибутки з караванів Юти"
  ncn_idea_utah_caravan_profits_desc:0 "З скромного початку торгівля караванів принесла Нью-Ханаану багатство і вплив. Безпечні маршрути, поради, притулок для подорожніх – усе це зробило нас центром торгівлі пустки."

  ncn_idea_utah_caravan_profiteering:0 "Збагачення на караванах Юти"
  ncn_idea_utah_caravan_profiteering_desc:0 "Каравани перетинають наші землі й залишають після себе ковтки кришок. Безпечні дороги – не безкоштовні, і ми беремо за це відповідну плату."

  ncn_idea_rapid_mobalisation:0 "Швидка мобілізація"
  ncn_idea_rapid_mobalisation_desc:0 "Загроза з боку [WHT.GetName] зростає, а ми – зовсім не готові. Нам потрібна власна армія. І швидко."

  ncn_idea_holy_flames_quenched:0 "Святе полум’я згасло"
  ncn_idea_holy_flames_quenched_desc:0 "Ми ніколи не були воїнами, але після поразки від [WHT.GetName] навіть ті, хто прагнув боротьби, втратили волю до війни. Навіть Джошуа вагається..."

  ncn_idea_embers_of_a_holy_war:0 "Жевріюче святе полум’я"
  ncn_idea_embers_of_a_holy_war_desc:0 "З попелу зійде Ханаан. Надія ще жива – в молитвах і шепоті пастви. Одного дня ми повернемо наш дім."

  ncn_idea_gods_burning_flame:0 "Полум’я Господнє"
  ncn_idea_gods_burning_flame_desc:0 "Бог не зробить усю роботу сам. Ми маємо стати Його полум’ям на землі – і очистити пустку від язичників."

  ncn_idea_theological_confusion:0 "Богословське сум’яття"
  ncn_idea_theological_confusion_desc:0 "Де Бог? Чому Він нас залишив? Чи це – кара за гріхи? Запитання множаться, і віра у відповіді духовенства – тане."

  ncn_idea_religious_stabilization:0 "Стабілізація віри"
  ncn_idea_religious_stabilization_desc:0 "Завдяки Деніелу паство починає знову знаходити світло Господнє. Сумніви вщухають, хоч і не повністю."

  ncn_idea_divine_guidance_restored:0 "Боже проведіння відновлено"
  ncn_idea_divine_guidance_restored_desc:0 "Деніел – наш дороговказ у темряві. Його м’яке слово й вірність об’єднали нас навколо Бога. Воістину живий пророк."

  ncn_idea_destroyed_economy:0 "Зруйнована економіка"
  ncn_idea_destroyed_economy_desc:0 "Після втечі з Нью-Ханаану ми виживаємо лише з того, що змогли винести. У новому домі бракує виробництва. Але ми відбудуємось."

  ncn_idea_self_sufficient_economy:0 "Самодостатня економіка"
  ncn_idea_self_sufficient_economy_desc:0 "Ми ще не процвітаємо, але маємо достатньо майстерень і ресурсів, щоб триматися на плаву."

  ncn_idea_retooled_economy:0 "Переналаштована економіка"
  ncn_idea_retooled_economy_desc:0 "Ми, може, й не відновимо колишню міць, але новий підхід до промисловості зробив нас адаптивними й винахідливими."

  ncn_idea_rampant_corruption:0 "Несамовита корупція"
  ncn_idea_rampant_corruption_desc:0 "Декілька ковпаків у потрібні руки можуть купити все – від прощення до зброї. Корупція, терпима під час війни, стала хворобою миру."

  ncn_idea_widespread_bribery:0 "Масова підкупність"
  ncn_idea_widespread_bribery_desc:0 "Хоч найбільші зловживання придушено, хабарі й далі є нормою – навіть серед священиків і офіцерів."

  ncn_idea_monetary_apathy:0 "Байдужість до грошей"
  ncn_idea_monetary_apathy_desc:0 "Проповіді Деніела вбили жагу до грошей у серцях ханаанців. Корупція зникла, але інші проблеми ще попереду."

  ncn_idea_disrupted_economy:0 "Порушена економіка"
  ncn_idea_disrupted_economy_desc:0 "Війна з Білоногими зруйнувала наші господарські потужності. Усе працювало лише на фронт. Потрібен час, аби знову навчитися мирній праці."

ncn_idea_bandaged_economy:0 "Залатана економіка"
ncn_idea_bandaged_economy_desc:0 "Повільно, але впевнено ми зцілюємо рану, яку війна з Білоногими завдала нашій економіці. Через низку тимчасових заходів нам вдалося почати стабілізацію, що дозволяє певне зростання."

ncn_idea_economic_growth:0 "Економічне зростання"
ncn_idea_economic_growth_desc:0 "У результаті масштабних інвестицій у майстерні по всій країні економіка знову починає зростати. Люди знову починають будувати, і наші майстерні працюють ефективніше, ніж будь-коли!"

ncn_idea_warmongering_disposition:0 "Схильність до війни"
ncn_idea_warmongering_disposition_desc:0 "Наша перемога над Білоногими принесла нам великі території, але також і недовіру племен, серед яких ми проповідуємо. Вони побоюються, що ми звернемо свою зброю і проти них. Хоч ми й не маємо таких намірів, репутація вже закарбувалась."

ncn_idea_rekindled_peacebuilding:0 "Відновлення миротворчої місії"
ncn_idea_rekindled_peacebuilding_desc:0 "Завдяки обережному втручанню наших місіонерів нам вдалося почати відновлення нашого іміджу миротворців."

ncn_idea_reinstated_peacebuilding:0 "Захисники миру"
ncn_idea_reinstated_peacebuilding_desc:0 "Через невпинну працю наших місіонерів та озброєних вартових, ми зуміли відновити репутацію захисників миру. Племена Юти та інших земель знову дивляться на нас як на взірець."

ncn_idea_kingdom_of_god:0 "Царство Боже на Землі"
ncn_idea_kingdom_of_god_desc:0 "Захистивши Юту для віруючих, ми створили безпечну державу для всіх Божих дітей. Воістину, Нью-Ханаан – це Царство Боже на Землі, а [NCN.GetLeader] – той Цар, що веде нас уперед."

ncn_idea_old_world_blues:0 "Сум за Старим Світом"
ncn_idea_old_world_blues_desc:0 "Завдяки наполегливості Даніеля та силі його реформ, до Нью-Ханаану повернулась гібридна версія старої Церкви. Вона бере найкраще зі довоєнної віри і з'єднує це з досвідом Пустки – церква для всіх людей."

ncn_idea_legal_drug_shipments:0 "Легальні поставки наркотиків"
ncn_idea_legal_drug_shipments_desc:0 "Хоча саму легалізацію наркотиків наша паства не схвалить, якщо зберігати їх у запечатаних контейнерах, то навряд чи буде шкода, якщо вони пройдуть через наші кордони. До того ж, це прибуткова справа..."

ncr_junkertroopers_bonus:0 "Брухтотрупери"
ncr_junkertroopers_bonus_desc:0 ""

ncr_supply_train_expansion_1:0 "Розширення постачання"
ncr_supply_train_expansion_1_desc:0 ""

ncn_threat_dynamic_modifier:0 "Загроза Білоногих"
ncn_threat_dynamic_modifier_desc:0 "Білоногі вже на горизонті, і кожен їхній рух викликає дедалі більше страху серед народу Нью-Ханаану. Зрештою, це може спонукати нас до дії. Але чи не буде вже запізно..."

ncn_decadence_dynamic_modifier:0 "Клішні занепаду"
ncn_decadence_dynamic_modifier_desc:0 "Церкву дедалі більше охоплюють кришки й брудні таємниці. Проповіді стають показовими, а священики носять усе розкішніші шати. З часом це може боляче вдарити..."

ncn_medics_of_lord:0 "Цілителі Господні"
ncn_educating_tribals:0 "Просвітництво племен"
ncn_going_to_school:0 "Ханаанська освіта"

ncn_idea_the_invisible_hand:0 "Невидима рука"
ncn_idea_the_invisible_hand_desc:0 "Невидима рука грається з нашою економікою, спонукаючи нас експортувати все більше, щоби збагачувати наших панів у Нью-Ханаані."

ncn_idea_paying_tithe:0 "Плата «десятини»"
ncn_idea_paying_tithe_desc:0 "Платячи «десятину» нашим панам у Нью-Ханаані, ми забезпечуємо собі певну автономію – для себе й наших дітей."

ncn_the_hand_of_god:0 "Рука Господня"
ncn_the_hand_of_god_desc:0 "Знищ їх у гніві, знищ їх, щоб їх не стало;\n\nЩоб люди знали, що Бог панує в Якові –\n\nДо країв землі. Села."

ncn_poor_only_in_spirit:0 "Бідні лише духом"
ncn_poor_only_in_spirit_desc:0 "Мудрі мають багатство й розкіш, але нерозумні витрачають усе, що мають."
