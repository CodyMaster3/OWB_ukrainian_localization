ncn_gain_2_threat_on_declare:0 "§Y[NCN.GetNameDef]§! сприйматиме нас як більш §Rзагрозливих§! – їхнє уявлення про нашу загрозу зросте на §R2§! після оголошення війни."

complete_when_following_true_tt:0 "§RЦей фокус буде завершено після виконання наступних умов:§!"
unlock_incidents_tt:0 "З часом відбуватимуться різні §Rінциденти§!, і наша реакція на них визначить, наскільки шлях занепаду ми оберемо."
ncn_clergy_loyal_tt:0 "Ми розмістимо §Gлояльних§! осіб серед §Yдуховенства§!, що трохи зменшить силу §Rперевороту§! у разі бунту з цього боку."
ncn_army_loyal_tt:0 "Ми розмістимо §Gлояльних§! осіб у §Yзбройних силах§!, що трохи зменшить силу §Rперевороту§! у разі бунту з цього боку."
ncn_army_revolts_tt:0 "§RАрмія§!, обурена реформами, повстає проти [ROOT.GetLeader].\n"
ncn_clergy_revolts_tt:0 "§RДуховенство§!, обурене реформами, повстає проти [ROOT.GetLeader].\n"
ncn_army_loyal_pays_off_tt:0 "Наші §Gлоялісти§! в армії допоможуть дещо зменшити масштаб громадянської війни!\n"
ncn_clergy_loyal_pays_off_tt:0 "Наші §Gлоялісти§! серед духовенства допоможуть дещо зменшити масштаб громадянської війни!\n"
ncn_old_start_cw_tt:0 "Прибічники §Yстарої церкви§! починають §Rгромадянську війну§!.\n"
ncn_new_start_cw_tt:0 "Прибічники §Yнової церкви§! починають §Rгромадянську війну§!.\n"
form_deseret_cores_tt:0 "Ми отримаємо §Hнаціоналізацію§! всіх територій Юти.\n"
form_deseret_annex_puppet_tt:0 "Будь-яка маріонетка, що повністю знаходиться в Юті, буде §Hанексована§!.\n"
form_deseret_take_puppet_tt:0 "Будь-які землі Юти, що належать маріонетці, яка не повністю в Юті, будуть §Hанексовані§!.\n"
ncn_safeguard_utah_tt:0 "Ми §Gгарантуємо незалежність§! кожної країни, яка має штат у Юті.\n"
ncn_unlock_threat_tt:0 "Відкриває всі підгілки §Rзагрози§!, які ми ще не завершили, окрім останніх двох.\n"
threat_greater_than_10:0 "Сприйнята §Rзагроза§!, яку становлять Білоногі, перевищує §R10§! §g(зараз: §H[?NCN.ncn_threat]§g)§!§!§!"
threat_greater_than_20:0 "Сприйнята §Rзагроза§!, яку становлять Білоногі, перевищує §R20§! §g(зараз: §H[?NCN.ncn_threat]§g)§!§!§!"
threat_greater_than_25:0 "Сприйнята §Rзагроза§!, яку становлять Білоногі, перевищує §R25§! §g(зараз: §H[?NCN.ncn_threat]§g)§!§!§!"
threat_greater_than_30:0 "Сприйнята §Rзагроза§!, яку становлять Білоногі, перевищує §R30§! §g(зараз: §H[?NCN.ncn_threat]§g)§!§!§!"
threat_greater_than_40:0 "Сприйнята §Rзагроза§!, яку становлять Білоногі, перевищує §R40§! §g(зараз: §H[?NCN.ncn_threat]§g)§!§!§!"
threat_greater_than_50:0 "Сприйнята §Rзагроза§!, яку становлять Білоногі, перевищує §R50§! §g(зараз: §H[?NCN.ncn_threat]§g)§!§!§!"

ncn_increase_decadence_10:0 "Наш §Hзанепад§! зросте на §R10§! §g(зараз: §H[?NCN.ncn_decadence]§!)§!§!§!\n§gЗанепад трохи зменшує наші політичні можливості й кількість фабрик товарів широкого вжитку, але водночас підвищує стабільність і дрейф еліт.§!\n"
ncn_increase_decadence_5:0 "Наш §Hзанепад§! зросте на §R5§! §g(зараз: §H[?NCN.ncn_decadence]§!)§!§!§!\n§gЗанепад трохи зменшує наші політичні можливості й кількість фабрик товарів широкого вжитку, але водночас підвищує стабільність і дрейф еліт.§!\n"

ncn_raise_tribal_militia_tt:0 "У столиці кожного племені, де є §Gмормонська місія§!, буде створено §Gдосвідчений§! підрозділ §Yплемінного ополчення§!. §g(Ми надіслали місії до більшості племен Юти, які натомість надали нам військовий доступ)§!\n"
ncn_form_deseret_tt:0 "Відкриває §Yрішення§! щодо формування §GДезерету§!, для чого необхідно володіти всіма штатами Юти особисто або через маріонеток. \n§gМи отримаємо претензії на всі штати Юти, які наразі не належать нам або нашим маріонеткам.§!\n"
ncn_justify_wargoals_tt:0 "Дозволяє обґрунтовувати §Rцелі війни§! проти ворогів Господа. Пустище відчує гнів Божий!\n"
ncn_random_slavery_revolt_tt:0 "§YКожен§! контрольований нами штат має §R20%§! шанс на появу §Rдосвідченої§!, але §Rслабоозброєної§! армії рабів, вірних §R[NCN.GetName]§!."
ncn_puppet_caps_tt:0 "Усі наші §Yмаріонетки§! отримають §G200§! кришок."
ncn_followers_expelled_tt:0 "Ми §Rвиганяємо§! всіх Послідовників Апокаліпсису з наших земель, §Yназавжди забороняючи§! їм повертатися."
ncn_timekeepers_incident_tt:0 "Відбулася подія §RКінець Хранителів Часу§!."
ncn_unlock_timekeepers_incident_tt:0 "Відкриває фокуси, пов'язані з подією §RКінець Хранителів Часу§!.\n"
ncn_ogden_incident_tt:0 "Відбулася подія §RЗбройний склад в Оґдені§!."
ncn_unlock_ogden_incident_tt:0 "Відкриває фокуси, пов'язані з подією §RЗбройний склад в Оґдені§!.\n"
ncn_followers_incident_tt:0 "Відбулася подія §RПрибуття Послідовників Апокаліпсису§!."
ncn_unlock_followers_incident_tt:0 "Відкриває фокуси, пов'язані з подією §RПослідовники Апокаліпсису!§!\n"
ncn_traders_incident:0 "Відбулася подія §RНеприємності з торговцями§!."
ncn_traders_incident_tt:0 "Відбулася подія §RНеприємності з торговцями§!."
ncn_unlock_traders_incident_tt:0 "Відкриває фокуси, пов'язані з подією §RТорговці Юти§!.\n"
ncn_unlock_daniel_tt:0 "Срібноязикий та благочестивий §YДаніель§! пропонує допомогу в переговорах з торговцями Юти."
ncn_guarantee_weapons_tt:0 "Ми відправимо §R250§! одиниць піхотної зброї з запасів Оґдена на допомогу всім племенам, у яких є §Gмормонська місія§!. §g(Ми надіслали місії до більшості племен Юти, які натомість надали нам військовий доступ)§!\n"
ncn_develop_tribes_tt:0 "Ми допоможемо всім племенам, у яких є §Gмормонська місія§!, розвинути промисловість у їхніх столицях. §g(Ми надіслали місії до більшості племен Юти, які натомість надали нам військовий доступ)§!\n"
ncn_resource_shipments_tt:0 "Ми допоможемо всім племенам, у яких є §Gмормонська місія§!, у пошуку та видобутку нових ресурсів у їхніх столицях. §g(Ми надіслали місії до більшості племен Юти, які натомість надали нам військовий доступ)§!\n"
ncn_repair_roads_tt:0 "§gУсі наші штати з рівнем інфраструктури §R4§! або нижче отримають §R+1§! до інфраструктури.§!\n"
ncn_produce_goods_tt:0 "§g§R2§! фабрики товарів широкого вжитку та §R2§! будівельних слоти буде додано до двох випадкових національних штатів.§!\n"
ncn_utah_prospers_tt:0 "§gКожен штат у Юті, незалежно від власника, отримає §R+1§! слот для будівництва, а всі штати з менш ніж 10 рівнями інфраструктури – §R+1§! до інфраструктури.§!\n"
ncn_fortify_south_tt:0 "§gКожен штат, що належить нам, нашому союзнику або нації з §Gмормонською місією§! і межує з §Y[WHT.GetNameDef]§! чи його союзниками, отримає §Y2 рівні аванпостів§! у прикордонних провінціях. Штати, що межують із націями, які зараз обороняються від §Y[WHT.GetNameDef]§!, також буде укріплено.§!"
ncn_preach_to_caravans_tt:0 "Наші стосунки з усіма, хто має §Gмормонську місію§!, трохи покращаться, що сприятиме торговим угодам. §g(Ми надіслали місії до більшості племен Юти, які натомість надали нам військовий доступ)§!\n"
ncn_reach_out_to_tribes_tt:0 "§gМи звернемося до племен, у яких є §Gмормонська місія§!, і вони надішлють §R250§! своїх найкращих воїнів, щоб допомогти нам у війні.§!\n"
ncn_god_brings_us_together_tt:0 "§gМи запропонуємо союз §Y[WHT.GetName]§!, за умови, що вони повернуть нам наші старі землі, якщо погодяться.§!\n"
ncn_home_is_non_negotiable_tt:0 "§gУсі наші національні штати, що зараз перебувають під контролем §Y[WHT.GetNameAdj]§!, буде повернуто нам, а §Y[WHT.GetNameAdj]§! втратять на них претензії.§!"

  NCN_withdraw_southern_occupation_tt:0 "§gБілоногі будуть звільнені як вірна маріонетка, що володітиме своїми рідними землями та частиною західних територій Хранителів Часу.§!\n§Y[CES.GetNameWithFlag]§! втратить свій вплив на Білоногих."
  ncn_assist_tribal_development_tt:0 "§gМи допоможемо всім племенам, у яких маємо §Gмормонську місію§!, розвинути технологічні знання, навчаючи їхніх дітей бути добрими християнами.§!\n"
  NCN_trained_caravan_guards_tt:0 "§RЧотири§! підрозділи §Gдобре навчених§! і §Gдобре озброєних§! §YКараванних Охоронців§! прибудуть, щоб захистити нашу імперію."
  ncn_improved_caravan_routes_tt:0 "§gУсі наші національні області отримають §R2§! рівні інфраструктури.§!\n"
  ncn_send_mission_to_mojave_tt:0 "§gМи відправимо передову групу до Мохаве, щоб розвідати ситуацію.§!\n"
  ncn_allies_of_convenience_tt:0 "§gМи запропонуємо союз [NCR.GetNameDef], за умови, що залишимо їхню фракцію після розгрому Легіону.§!\n"
  ncn_dec_cat_northern_missionaries:0 "Відкриває §Yрішення§! для відправлення місіонерів на північ, утворюючи вірні Господу маріонеткові держави.\n"
  ncn_dec_cat_southern_missionaries:0 "Відкриває §Yрішення§! для відправлення місіонерів на південь! Ви ще не зрозуміли це?\n"
  ncn_old_practices_for_new_times_tt:0 "§gПротиснемо радикальні реформи Церкви. Це точно не сподобається старій еліті...§!\n"
  ncn_economic_centralization_tt:0 "§gУсі наші маріонетки отримають ідею §RНевидима рука§!, а всі майбутні маріонетки, яких ми зіпсуємо, також отримають цю ідею під час громадянської війни в їхніх межах.§!"
  ncn_autonomy_for_tariffs_tt:0 "§gУсі наші маріонетки отримають ідею §RПлатять “десятину”§!, і всі майбутні зіпсовані нами маріонетки також отримають цю ідею, коли ми спричинимо громадянську війну на їхній території.§!"
  ncn_assist_the_tribes_tt:0 "§gМи надішлемо §R2§! підрозділи добровольців і до [TAR.GetNameWithFlag], і до [CRZ.GetNameWithFlag], допомагаючи їм у майбутніх війнах.§!\n"
  ncn_unlock_manpower_laws_tt:0 "Усі §Yзакони про людські ресурси§! буде розблоковано, з дотриманням звичних умов.\n"
  ncn_prodigal_son_returns_tt:0 "Йосип повернувся"
  ncn_need_to_take_lincon_tt:0 "§RМи маємо захопити Лінкон, якщо справді хочемо позбутися загрози Білоногих і просунутися у фокус-дереві.§!\n"
  ncn_lincon_held_tt:0 "Ми, наша маріонетка, учасник нашої фракції або будь-яка нація з §Gмормонською місією§! контролює §Y[WHT.capital.GetName]§!, столицю [WHT.GetName], або ми перебуваємо у війні з [WHT.GetName], §YАБО§! ми обрали альтернативний шлях після поразки Білоногих."
  ncn_canaan_held_tt:0 "[WHT.GetName], їхня маріонетка або союзник контролює §YНью-Ханаан§!, нашу столицю, поки ми перебуваємо у стані війни з [WHT.GetName]."
  ncn_farfield_anger_low:0 "Ми здійснили §Y4§! дії для зменшення обурення у Фарфілді. §g(Зараз: §Y[?NCN.ncn_farfield_actions]§!)§!"
  ncn_brigham_anger_low:0 "Ми здійснили §Y3§! дії для зміцнення влади у Брігемі. §g(Зараз: §Y[?NCN.ncn_brigham_actions]§!)§!"
  ncn_add_farfield_action:0 "Ця позитивна дія допоможе зменшити невдоволення у Фарфілді та південних регіонах. Потрібно §R4§!, щоб уникнути повстання.\n"
  ncn_add_brigham_action:0 "Ця позитивна дія допоможе продемонструвати нашу владу у Брігемі та північних регіонах. Потрібно §R3§!, щоб уникнути повстання.\n"
  ncn_throne_tt:0 "§RТого часу Єрусалим називатимуть Престолом Господнім, і всі народи зберуться до нього.§! §RЄремія 3:17§!\n"
  guarantee_mission_neighbors_threatened_by_WHT_tt:0 "§YГарантувати захист§! будь-якій сусідній державі з §Gмормонською місією§!, яка межує з §Y[WHT.GetNameDef]§!."
