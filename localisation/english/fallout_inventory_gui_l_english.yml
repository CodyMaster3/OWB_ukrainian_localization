  FALLOUT_INVENTORY_ITEM_6: "Камера ProSnap PanaLuxe Deluxe"
  FALLOUT_INVENTORY_ITEM_6_DESC: "Унікальний прототип камери ProSnap, яка так і не вийшла на ринок. Може одночасно захоплювати зображення і звук, об'єднуючи все в кіноплівку менш ніж за 2 години!"
  FALLOUT_INVENTORY_ITEM_6_EFFECTS: "$stability_factor$: §G+7.50%§!"

  FALLOUT_INVENTORY_ITEM_7: "Лезо з андроїд-металу"
  FALLOUT_INVENTORY_ITEM_7_DESC: "Це унікальне лезо було викуване з броні андроїдів TV-Тауну. Його створив Каґа після захоплення міста. Вважається священним серед племен пустки, за нього пролито чимало крові."
  FALLOUT_INVENTORY_ITEM_7_EFFECTS: "$war_support_factor$: §G+7.50%§!"


