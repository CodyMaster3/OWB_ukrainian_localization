  # Події:
  fallout_inventory_events.EVTNAME3: "Можливе відкриття у зовнішньому світі"
  fallout_inventory_events.EVTDESC3: "Невеликий загін піонерів натрапив на печеру під час транспортування обладнання. Це місце може принести нам новий предмет, якщо воно виявиться настільки перспективним, як ми сподіваємося. Чи варто надіслати ще один загін для обшуку цієї місцевості?"
  fallout_inventory_events3.EVTOPT1: "Хто не шукає, той не знаходить..."
  fallout_inventory_events3.EVTOPT2: "... з іншого боку, на це підуть ресурси, які можна витратити на інше."

  fallout_inventory_events.EVTNAME4: "Загін піонерів повертається"
  fallout_inventory_events.EVTDESC4: "Загін, який ми відправили на пошуки нових предметів у знайденому місці, повернувся. Сподіваємось, вони принесли гарні новини."
  fallout_inventory_events4.EVTOPT1: "Подивімося..."

  SEND_OUT_SEARCH_TEAM_FOR_NEW_ITEM_TT: "Загін відправлено на пошуки цього місця...\n"

