  FALLOUT_INVENTORY_ITEM_5: "Череп зі скла"
  FALLOUT_INVENTORY_ITEM_5_DESC: "Невдовзі після першого удару Тлалока проти сил Ацтлана було знайдено цю реліквію. [This.GetLeader], чия шкіра повільно плавилась, знайшов ідеальний череп, перетворений на скло. Цей зелений сяючий символ минулого життя штовхає Мейвенів вперед."
