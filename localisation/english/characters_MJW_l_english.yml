MJW_ULYSSES_EVERETT_NAME:0 "Улісс Еверетт"
MJW_ULYSSES_DESC:0 "Уникаючи більшості жахів нового світу, хтось назве Мус-Джо раєм, а хтось — слабодухим. Завдяки добрим відносинам із сусідами, місто залишалося осторонь нещодавніх конфліктів у регіоні. Лише повстання Метисів порушило той мир, до якого вони звикли. Побачивши жахіття цього конфлікту на власні очі, мешканці лише зміцнилися в своєму прагненні до миру та доброзичливості."