# Canadian Occupation Day
canadaflavour.1.t:0 "День Ганьби"
canadaflavour.1.d:0 "Сьогодні всі, хто називає себе канадцями, сумують за найстрашнішою трагедією нашої історії – днем, коли ті, кого ми вважали нашими найближчими братами, зрадили нас і вкрали нашу свободу. Американське вторгнення в Канаду, що сталося понад 200 років тому, було жорстоким і кривавим, ніхто не уникнув його наслідків. Сьогодні ми вшановуємо пам’ять тих, кого забрали в нас звірства загарбників, і згадуємо горду державу, яка колись слугувала прикладом для всього світу.\n\nО, Канада, несправедливо вбита рукою тиранів, чи знайдеш ти колись спокій у наших серцях і спогадах?"
canadaflavour.1.a:0 "Щоб ми ніколи не забули."