##Events
nf_met.1.t:0 "Чоловік зі Сталевим Іменем"
nf_met.1.d:0 "Отже, ти хочеш знати, як Сталевий Джо став лідером, так? Ну що ж, сідай зручніше, підкрути сервопривід руки — і я розповім тобі, як з’явилася Металева Паща...\n\nРозумієш, десь десяток-два років тому, ще до початку цієї історії, чоловік, що згодом стане Сталевим Джо, був звичайним рабом-носієм десь на Середньому Заході. Після того, як його хазяїн заснув, об’ївшись і обдовбавшись, Джо підняв повстання разом з іншими рабами й жорстоко вбив господаря. Знаючи, що залишатись поруч не можна, вони зібрали речі й рушили на північ.\n\nПо дорозі до них приєднувались знуджені душі з Гейвра, шахтарі з Консорціуму, які шукали чисте повітря та нове життя. Вигнанці з усього північного заходу вливались у їхню ходу. За кілька місяців Джо зібрав колектив рейдерів, поселенців і всіх, хто був між ними. Не бажаючи повторювати долю свого старого хазяїна, Джо робив усе, щоб тримати свою банду в фізичній і психічній формі. Але цього було недостатньо.\n\nЙого руки вивихнулися, ноги зламались, очі постійно боліли, а щелепа взагалі стала непридатною — роки напруги знищили тіло. Те ж саме стосувалося і його людей. Кілька рейдів — і люди були вичавлені, але залишалися завдяки його харизмі, жорсткому лідерству й наполегливості.\n\nТа навіть старий Джо зрозумів: він зайшов надто далеко. Попри тренування й дисципліну, він лише ще гірше зламав своїх людей. І лише з розумінням того, що проблема не в його методах, а в межах людського тіла, Джо почав шукати розв’язання. Так він дізнався про одне місце неподалік: Чарівне Місто..."
nf_met.1.a:0 "Місце Надії"
nf_met.1.b:0 "Шлях Слави"
nf_met.1.c:0 "Справжнє місто Магії"

nf_met.2.t:0 "Як Кролик із Циліндра"
nf_met.2.d:0 "Чарівне Місто, як і випливає з назви, справді було чарівним. До Великої Війни, хоча й не рівне Массачусетському Інституту чи Гірі Біг-М, Біллінґс славився надзвичайним розвитком у галузі охорони здоров’я. Хоча дехто критикував його за витратність та нелюдяність, багато хто вважав Біллінґс кроком у майбутнє для Америки після численних поранених солдатів, що повертались додому.\n\nДжо відправився до міста з невеликою групою найменш покалічених після виснажливого навчання. Їх зустріло зів’яле блискіття автоматики — постери з агітацією кібер-імплантів, відео з людьми, які розповідали, як їхнє життя покращилось після імплантації протезів. Усі вказівки вели до одного місця — Центру Охорони Здоров’я Біллінґса.\n\nВсередині група побачила справжнє диво: тестове обладнання, прототипи, справні АвтоДоктори й навіть відносно притомного пана Ордерлі — робота, який із радістю прийняв відвідувачів після десятиліть тиші. Хоча він і був стурбований станом гостей, сприйняв це як чудову нагоду продемонструвати новітні досягнення міста.\n\nТак Джо й решта отримали кібернетичні поліпшення найвищого класу з епохи до 2077 року. Пан Ордерлі навіть, посилаючись на старий податковий кодекс, запропонував знижку, якщо вони приведуть «друзів» — адже старі виробники більше не відповідали на запити.\n\nПочувши слово «Метал» і отримавши імплант у щелепу, Джо зрозумів, ким має стати. Ким мають стати всі його люди. Так народилася Металева Паща."
nf_met.2.a:0 "Народжені Наукою"
nf_met.2.b:0 "Народжені Люттю"
nf_met.2.c:0 "Народжені Гріхами Довоєння"

nf_met.3.t:0 "Сталеві Стають Сильнішими"
nf_met.3.d:0 "Після кількох днів безперервних модифікацій, новопроголошена Металева Паща почала свій кривавий похід по регіону. Почалося все з тихого містечка Бродв'ю: його мешканцям поставили просту вимогу — підкоріться або помріть. Побачивши майже нелюдських істот, що висунули таку погрозу, місто капітулювало. Але не всі були такими щасливими. Мешканці Парк-Сіті, наприклад, відмовилися підкоритися — і були повністю винищені Металевою Пащою.\n\nПовне знищення Парк-Сіті стало для Джо можливістю залякати решту регіону. Використовуючи брухт і непотрібний метал, тіла загиблих перетворили на моторошні опудала та тотеми — символи наближення Пащі й нагадування про те, що чекає на тих, хто відмовиться підкоритися. Хоча ця тактика діяла лише на ізольовані поселення, вона дозволила Пащі швидко рости та ставати дедалі жорстокішою.\n\nЗавдяки Металу Джо та його люди більше не мусили підтримувати фізичну форму виснажливими тренуваннями. Вони могли просто зняти протезовану руку, ногу чи орган — і передати його на діагностику або ремонт АвтоДокові чи пану Ордерлі. Якщо щось ламалося — трохи металу й усе готово. Якщо слабшало — діагностика і все працює як нове. Джо вірив, що Паща керуватиме відходами Монтани. А потім йому спала на думку ще більша мета — завоювати весь Північний Співдружній Світ. Його останній вчинок... якщо він взагалі ще здатен померти.\n\nБезсмертя, влада, сила — все це розбестило Джо і всіх, хто був з ним. Посилені кібернетикою, майже безмежним запасом Металу та жорстокими методами, Металева Паща почала планувати рейд, який мав закарбувати їхнє ім’я в історії..."
nf_met.3.a:0 "Готуйте зброю"
nf_met.3.b:0 "Покладіться на сталеві плити"
nf_met.3.c:0 "Зберіть найкращі екіпажі"

nf_met.4.t:0 "Системна Помилка"
nf_met.4.d:0 "Металева Паща, у своїх очах, досягла вершини людських можливостей: найміцніші тіла, найрозумніші уми. Їм бракувало лише одного — джерела підтримки. Попри кібернетику, поселенням все ще була потрібна їжа. А тим, хто ще мав органічні нутрощі, мучило шалене прискорене травлення: вони не товстіли, але втрачали сили, якщо не їли величезні порції майже щогодини.\n\nПочувши чутки про скарб — кришки, їжу й потенційних новобранців — у місті Міссула, Металева Паща рушила на захід, винищуючи Буревісників і місцевих західномонтанців. Але в Міссулі замість легкої здобичі їх зустріла несподіванка: через загрозу від Heaven's Gate, полковник Сантьяґо з нового загону Анклаву прислав понад три десятки солдатів у силовій броні APA Mk. II.\n\nДжо, побачивши їх, сприйняв їхній блискучий метал як ще одну мету. Він кинувся вперед, завдаючи кіберудару по першому солдату... але його сталева рука миттю вкрилася зеленою речовиною, яка почала роз’їдати метал. А за нею прийшли промені — червоні, зелені, сині — що буквально пожирали Пащу. Джо втратив лише руку. Багато його людей — голови, кінцівки... або ще гірше.\n\nОстаннім ударом стала команда тієї жінки — «полковника» — яка наказала залп із імпульсних гранат. Болісні імпульси знищували все. Джо, на межі сил, наказав відступ. Вже майже надлюдським зусиллям він і залишки армії дісталися назад до Чарівного Міста. Без друзів. Без нескінченного Металу. І — що найстрашніше — з ворогом, у якого був свій... або навіть кращий метал. І Джо поклявся помститися. За себе. За поразку. І за Пащу."
nf_met.4.a:0 "Може, терпіння теж важливе"
nf_met.4.b:0 "Поховаємо мертвих і рухаємося далі"
nf_met.4.c:0 "Помста прийде раніше, ніж вони зрозуміють!"  

nf_met.5.t:0 "До Крайньої Межі"
nf_met.5.d:0 "Сталевий Джо сидів на своєму діагностичному кріслі, відновлюючись після фінальної перемоги над тими, хто його колись принизив. Він так і не зустрівся з тією, кого звали «Полковник», але він переміг — і це було головне. Його кібернетику, що з того дня лише зростала, оглядав сам пан Ордерлі, якого Паща ніжно прозвала «Доктором». Джо ж волів кликати його Різником.\n\n«Ще один чудовий день для перевірки кібернетики, чи не так, шановний клієнте?» — без жодних зусиль робот розрізав метал на тілі Джо, як колись плоть і кістки, обробляючи імпланти й впорскуючи стимпаки для підтримки балансу здоров'я. Анестетики давно скінчилися, що чудово підходило для філософії Джо: виживають лише найміцніші.\n\nРаптом його рука майже відірвалася, коли пан Ордерлі почав дико дзижчати, а центр охопила тривога й сирени.\n\n«ЯКИЙ, МАТИ ЙОГО, ЗАРАЗ КУРВА БОРЩ?!» — заревів Джо, затуляючи вуха, хоча це мало не допомагало — його кіберслух божеволів від шуму.\n\nОрдерлі знову ввійшов у нормальний режим, сирени стихли. «Перепрошую, шановний клієнте! Дозвольте першому привітати вас з переходом на рівень Платинового Партнера нашої програми “Споживчої Кібернетики”, щиро підтриманої *бррр-дзинь*. Дякуємо за 10 років вірності! І в подарунок — особливий приз!»\n\nРобот дістав креслення з прихованого відсіку, з якого розпочалося імпровізоване святкування — хай і із запізненням у 200 років.\n\n«Це креслення дозволить вам і вашим друзям перетворитися на те, що аналітики Hyperdyne назвали “кінцем війни, якою ми її знаємо!” — кібернетичну бойову форму, за підтримки Військового департаменту США та ШІ-проєкту #59234. Насолоджуйтесь!»\n\nІ знову — тиша. Але в голові Джо шалено крутилися думки. Він відкрив креслення, просканував його кібероком... І побачив цілий новий світ можливостей."
nf_met.5.a:0 "О, так. Це підійде. Ідеально підійде."

nf_met.6.t:0 "Перша Дитина Сідні Лоук"
nf_met.6.d:0 "Сталевий Джо знищив броньованих воїнів Середнього Заходу, вижив під гаусс-вогнем у Бісмарку, поневолив Плем’я Двох Місяців. Але коли він і його зграя увійшли до брам комплексу МАНІФЕСТ, радість битви зникла. Веселкові відтінки навколо почали тьмяніти, як і впевненість Джо. Лерой і Теммі плентались позаду, а за ними — Айрон Тус, який на диво залишив свою лабораторію, почувши про успіх. Він крутив дерев’яний амулет у руках, спостерігаючи за величчю комплексу.\n§d«Слухай, Джо, ми з Лероєм тут сперечаємось — що більше допомогло знищити тих біса бісмарківців? Його бумпалка чи моя, вибач на слові, геніальна стратегія?»§!\n\nДжо підняв кулак. §D«На скільки я бачу, обидва заслужили по пиці. Хтось хоче спробувати?»§!\n\nІ тут кулак заіскрився. І не тільки кулак. Усе тіло Джо. Його товариші подумали, що це чергова поломка. Але для Джо це було наче розрив його самої сутності. А потім — тиша.\n\nВін відкрив очі. Плоть. Кров. Він — знову просто Джо. А перед ним — Метал... ЙОГО Метал. У формі лютого звіра. Та лють була розумною. Вона вимагала. Вона кликала.\n\nАле метал належав йому. Воно знущалося. Все, що потрібно — згадати, ким він був: людиною. Вижити без того, чим він став.\n\nІ зробити вибір."
nf_met.6.a:0 "Він став на коліна. Адже сам був звіром."
nf_met.6.b:0 "Старий Джо стиснув кулак. Він знову стане Сталевим."

nf_met.7.t:0 "Вичавлюючи Діаманти з Вугілля"
nf_met.7.d:0 "Сьогодні зранку до нас завітав гонець — точніше, головоріз — від тієї жахливої Металевої Пащі. Але не для звичних перемовин щодо податку, а з чіткою вимогою: ВСІ діаманти. Усе, що маємо. Пояснити, навіщо, не зміг — щось про їхні імпланти. Усміхнений бандит дав чітко зрозуміти: вони все одно заберуть їх. Мирно чи з боєм — наш вибір."
nf_met.7.a:0 "Все одно їх не підпалиш, то нехай беруть."
nf_met.7.b:0 "Нехай спробують забрати."

nf_met.8.t:0 "Очікувана Відповідь"
nf_met.8.d:0 "Прийшло слово від тих клятих закопчених з Консорціуму. Багато красивих фраз, але суть одна — «будь ласка, візьміть діаманти, тільки не вбивайте!» Як і слід було чекати. Було б дурістю чіплятись до нас через таку дрібницю. Тепер — лишилося вирішити, куди всі ці діаманти подіти. А що як... вставити в зуби?"
nf_met.8.a:0 "Ох, гарна думка..."

nf_met.9.t:0 "Неочікувана Відповідь"
nf_met.9.d:0 "Прийшло слово від тих кволих закопчених з Консорціуму. Наговорили купу пафосного лайна, але суть одна — «приходьте і забирайте діаманти». Не очікували, що в них хребет раптом з'явиться, але, схоже, вони хочуть поборотись. Нам ті кляті діаманти потрібні, а після такої зневаги ми точно не відступимо, навіть якби не були! Дамо їм те, про що просили, і підемо заберемо своє."
nf_met.9.a:0 "Вони про це пошкодують"

nf_met.10.t:0 "Купці з Металевими Щелепами"
nf_met.10.d:0 "І от з’явилися вони, вовки в овечих шкурах, із зубами з металу, а не кістки. Вбрані в одяг купців, з думками про бартер. Прийшли зі сходу, грішники всі до одного, але з даром божим у руках. Привезли віз, наповнений кістками розбитих літаків, знайдених на далеких аеродромах. Ангели, певно, вели їх до наших воріт. Сталеволикі посланці розповіли, що мають ще безліч таких возів з деталями. Їхні серця, мов і їхня шкіра, тверді як сталь, і вони говорили про плату. Щоб доставити решту — потрібна велика десятина кришок."
nf_met.10.a:0 "Хай буде так"

nf_met.11.t:0 "Вечірка Під Час Зміни"
nf_met.11.d:0 "Ми не те щоб очікували знайти тут друзів — взагалі ні. Але іноді отримуєш більше, ніж планував. Сталевий Джо зі своєю Пащою — ще ті лиходії, і ми погодились на взаємовигідну справу: прикривати один одного і ділити територію. Вони дають силу і все, що потрібно для справи, ми — зброю і приблуди для імплантів.\n\nМи влаштували гулянку на честь союзу, трохи рознесли крамницю, та було варто. Ті металеві хлопці й дівчата знають, як розважатись. Ми принесли бухло, вони — їжу. І не залишилось нічого. Добре, що вони ще й готувати вміють — бо та піца, яку ми замовили, їм не зайшла. Успіх, нові друзі, нові вороги. Веселощі починаються!"
nf_met.11.a:0 "Коли наступна гулянка?"

nf_met.12.t:0 "Рейдерська Вечірка"
nf_met.12.d:0 "Ми не з тих, хто легко заводить друзів, але ці хлопці з Місканта — нічого так. Ми розуміємось: правильний рівень насильства, чітко зрозуміло, чого чекати. Навіть з кордонами на території домовились швидко. У них зброї більше, ніж у нас пальців, і вони не жлоби.\n\nВлаштували гулянку на честь союзу, мало не підпалили балакучий торговий центр. Смішно було дивитись, як ті роботи бігають з вогнегасниками. Навіть Меркурій усміхнувся. Добре, що ми взяли нормальну їжу — бо та їхня піца була жахлива. Але ніч, повна бухла, хімії, мордобою й розваг — завжди чудова ніч. Обов’язково повторимо. Можливо, після спільного рейду."
nf_met.12.a:0 "Серйозно, піца була гидка."

nf_met.13.t:0 "Бешкет у Вінніфреді"
nf_met.13.d:0 "Зненацька Паща вдарила по нас минулої ночі. Зграя виродків на чолі з якимось скаженим, що горлав про Хаос, увірвалася, перебила всіх, хто пручався, і знищила все на своєму шляху. Місцеве ополчення було не готове й ледве щось спромоглося зробити. Вони пішли з повними руками — зброя, кришки, навіть стару статую з ринку забрали, наче на знущання. Люди в люті, вимагають помсти. Це напад на Свободу!"
nf_met.13.a:0 "Тільки не статуя бізона!"

nf_met.14.t:0 "Хаос у Лавіні"
nf_met.14.d:0 "Слава Свободі — ми це зробили! Наше ополчення повернулося переможцями з територій Металевої Пащі. Їм вдалося натрапити на той самий табір, що напав на наші домівки. Їхній скажений ватажок зник, але багато покидьків-рейдерів полягло, а решта втекли. Ми повернули більшість викраденого — навіть статую бізона! Для більшого ефекту — злетів у повітря весь табір. Яскраве попередження всім ворогам!"
nf_met.14.a:0 "А як вам ті феєрверки?"

nf_met.15.t:0 "Сталеві Усмішки"
nf_met.15.d:0 "Уся банда гомоніла — Крихітка Тін, найхудіший серед Пащі, з’явився якось з повністю металевою пащекою. І швидко пустив її в дію — відгриз Карлу кілька пальців, коли той наблизився надто близько. До Тіна відразу з’явилась повага, і під дією алкоголю він вирішив розповісти, звідки взялась його усмішка. Якийсь лікар на ім’я Унтербайт блукав околицями — стоматолог, що спеціалізується на зубах. Тін запитав, чи можна йому замінити все — і зуби, і щелепи — на метал. Лікар знизав плечима й почав роботу.\n\nНаприкінці розповіді Тін запитав: «А чи можеш ти називатися Металевою Пащею, якщо твоя посмішка — ще з плоті й кістки?»\n\nНаступного дня біля табору доктора вишикувалась черга. Усі хотіли справжню сталеву пащу. Док непогано піднявся на цьому, хоч і виглядав змученим. Через кілька тижнів більшість банди мала вже не лише назву, а й вигляд справжньої Металевої Пащі. Джо лише знизав плечима — мовляв, мода така від слабачка, та ще й половина банди розтринькала свої кришки на стоматолога. Але якщо вони щасливі — то чорт із ними."
nf_met.15.a:0 "Усміхнись, Пащо!"

