MET_has_salvaged_plane_parts:0 "Має Врятовані Авіадвигуни"

MET_plane_tech_category:0 "Металеве Небо"
MET_plane_tech_category_desc:0 ""
MET_storm_planes:0 "Врятування Літаків"
MET_storm_planes_desc:0 "Ми роками продавали всі пристойні частини літаків, які знаходили під час рейдів, Буревісникив за кілька зайвих кришок. Мало хто з Пащі хотів би злітати з землі. Але тепер, коли ми розчавили Вершників, Дені й Бракстон намагаються переконати всіх узяти ті літаки собі й піднятись у небо. Це спокуса..."
MET_storm_planes_2:0 "Відчуття Крил"
MET_storm_planes_2_desc:0 "Хоча ми не можемо покладатися на силу наших рук там угорі, наш Метал дає нам певні переваги. Багато пілотів встановлюють імпланти для покращення зору чи реакції, або змінюють органи й кінцівки для витримки високих перевантажень. Єдина проблема — мало хто хоче бути на землі в технічному обслуговуванні, а не в кабіні."

##Ідеї
metal_salvaged_corpses:0 "Утилізація Полеглих"
metal_salvaged_corpses_desc:0 "Знайти нові джерела Металу — так ми називаємо довоєнні імпланти, що дають нам силу — складно. Початковий запас був значний, але не нескінченний. Хоч ми й маємо креслення для виготовлення нових, більшість банди більше цікавить грабунок, ніж кропітка робота над створенням. Тож ми взяли менталітет розбірників — беремо все з мертвих і ставимо новим рекрутам. А в гіршому випадку — вбиваємо заради здобичі..."

MET_cybernetics_son:0 "Кібернетичні Воїни"
MET_cybernetics_son_desc:0 "Жага до вдосконалення — всепоглинаюча. Ніхто не вважається справжнім членом банди, поки не має хоча б одного шматка Металу — зовнішнього або внутрішнього. Приєднатися може будь-хто, якщо шукає силу й готовий різати себе на шматки заради неї."

MET_cybernetics_son_3:0 "Кібернетичні Вбивці"
MET_cybernetics_son_3_desc:0 "Жага до вдосконалення — всепоглинаюча. Ніхто не вважається справжнім членом банди, поки не має хоча б одного шматка Металу — зовнішнього або внутрішнього. Приєднатися може будь-хто, якщо шукає силу й готовий різати себе на шматки заради неї."

MET_power_patience:0 "Вичікування"
MET_carry_on_wayward:0 "Рух Вперед"
MET_day_of_vengeance:0 "Підготовка до Помсти"

MET_metal_shells_welded:0 "Зварювання Бронеплит"
MET_metal_shells_welded_desc:0 "Ми не маємо змоги обслуговувати силову броню (та й мало хто з наших достойних влізе в неї), зате бронеплити з неї — високоякісні. Розбираючи обладунки на запчастини й чіпляючи їх до нашої броні, ми отримаємо додатковий захист без зайвих проблем."

MET_burning_coal_reserves:0 "Чорна Смерть"
MET_burning_coal_reserves_desc:0 "Якщо смог ускладнює дихання — завжди можна встановити нові легені."

MET_confidence_books:0 "Самодопомога від Румінатора"
MET_confidence_books_desc:0 "Насправді, поради не такі вже й погані."

MET_metal_cant_die:0 "Залізо Усередині"
MET_metal_cant_die_desc:0 "З усіх дарів Металу — витривалість найважливіша. Навіть найпростіший імплант міцніший за людську плоть, а головне — його легше полагодити. Наші воїни виживають там, де інші падають. Знаючи це, ми кидаємося в найстрашніші сутички — бо ми виживемо. А вони — ні."

MET_like_you_mean_it:0 "Робочий Графік"
MET_like_you_mean_it_desc:0 "Кожен тут має тягнути свою частку. Поліпшення від наших імплантів можна застосувати як у бою, так і в повсякденній праці."

MET_war_pigs_killers:0 "Готові Вбивати"
MET_war_pigs_killers_desc:0 "У нас є три стани: справжні члени банди — Металеві Пащі, вбивці до кісток; селяни, що платять нам їжею й кришками; і раби, які займаються всім іншим. Більшість воліла б бути на вершині харчового ланцюга."

MET_defending_billings:0 "Захистити Метал"
MET_defending_billings_desc:0 "Ми прожили життя, забираючи в інших, і точно не дамо відібрати в себе! Якщо ми не зможемо стримати цю «Гілку Монтани» достатньо довго, щоб вивести більше Металу в поле — дотиснемо їх аж до Фейрв’ю."

MET_stormy_correct:0 "Клуб Любителів Двигунів"
MET_stormy_correct_desc:0 "Кожна Паща любить відчуття механічної сили в своїх кінцівках, але є й ті, хто більше кайфує від потужних двигунів, що аж трусять усе тіло."

MET_diamond_haul:0 "Нанокристалічні Діамантові Біонічні Нейроінтерфейси"
MET_diamond_haul_desc:0 "Хлопці з імплантами в мозку пояснюють це так: блискучий камінь — у Метал, Метал — швидша реакція. Логічно."

MET_standing_conquered:0 "Загасити Полум’я"
MET_standing_conquered_desc:0 ""

MET_khans_conquered:0 "Ханський Настрій"
MET_khans_conquered_desc:0 ""

MET_glowing_conquered:0 "Імпланти з Радіозахистом"
MET_glowing_conquered_desc:0 ""

MET_molemen_conquered:0 "Великий Кротовий Видобуток"
MET_molemen_conquered_desc:0 ""

MET_good_to_make_kings:0 "Творець Королів"
MET_good_to_make_kings_desc:0 ""

#Фокуси Металевої Пащі
MET_what_once_was_flesh:0 "Те, Що Колись Було Плоттю"
MET_what_once_was_flesh_desc:0 "Їхня рання історія майже втрачена, окрім одного: до того, як вони знайшли Метал, банда була виснажена й зламана."

MET_the_magic_city:0 "Чарівне Місто"
MET_the_magic_city_desc:0 "У пошуках Чарівного Міста ми знайшли скарб, що перевищив усі фантазії. У спеціалізованому медцентрі, збудованому перед війною, ми знайшли Метал."

MET_the_wasteland_rewards_strength:0 "Пустка Нагороджує Сильних"
MET_the_wasteland_rewards_strength_desc:0 "Посилені, ми пішли підкорювати все навколо. Завдяки імплантам, що замінили нам плоть і дали силу, ми стали Металевими Пащами."

MET_thrown_back_by_macarthur:0 "Відкинуті Макаратуром"
MET_thrown_back_by_macarthur_desc:0 "Після злету завдяки силі та розуму, Сталевий Джо вирішив пограбувати місто Міссула, почувши про його багатство. Але там уже стояли Броньовані Воїни з бази Макартура. Полковниця стала несподіваним ворогом..."

MET_embrace_of_iron:0 "Обійми Заліза"
MET_embrace_of_iron_desc:0 "Метал робить нас сильними. Метал робить нас цілими. Хто б не хотів провести день у пошуках більшого?"

MET_words_of_the_strong:0 "Слова Сильного"
MET_words_of_the_strong_desc:0 "Уроки банди, перевага сили над усім, залишаються актуальними попри всі зміни навколо нас і в нас самих."

MET_knock_some_sense_into_them:0 "Вибий Із Них Глузд"
MET_knock_some_sense_into_them_desc:0 "Так, тестувати Метал цілими днями весело, але, може, банді варто хоч трохи щось РОБИТИ?"

MET_keep_them_in_line:0 "Тримай Їх У Рамках"
MET_keep_them_in_line_desc:0 "Дехто в банді не згоден з новими графіками. Кажуть, хай усе роблять раби. Нагадай їм, що накази — не побажання."

MET_war_pigs:0 "Бойові Свині"
MET_war_pigs_desc:0 "Більшість нашої банди вже ні на що не здатна, крім насильства. І це нам цілком підходить. Ми розчавимо всіх, хто стане на нашому шляху."

MET_fight_off_the_foreign_warriors:0 "Відбити Чужинських Воїнів"
MET_fight_off_the_foreign_warriors_desc:0 "Ці нові воїни в броні проникли на наші землі. Напевно, хочуть забрати здобич і Метал собі!"

MET_put_their_backs_into_it:0 "Нехай Впахують"
MET_put_their_backs_into_it_desc:0 "Працювати розумніше І важче. \nАле здебільшого важче."

MET_craving_montana:0 "Жадоба до Монтани"
MET_craving_montana_desc:0 "Ми давно не розширювали свої території, і банда вже не знаходить собі місця. Час довести своє право вести — у бою."

MET_scavenge_the_shells:0 "Розібрати Оболонки"
MET_scavenge_the_shells_desc:0 "Броня, яку ми дістали у Фейрв’ю, дуже схожа на ту, що використовує база Макартура. Якщо розібрати її на метал — станемо ще міцнішими."

MET_youcantkillthemetal:0 "Метал Не Вбити"
MET_youcantkillthemetal_desc:0 "Наші вороги намагалися знищити Метал, але Метал виявився надто сильним."

MET_chewing_coal:0 "Жування Вугілля"
MET_chewing_coal_desc:0 "Вугільний Консорціум завжди був головним болем — і під час грабунків, і за столом переговорів. Але тепер усі їхні запаси відкриті — для плавлення металобрухту і живлення станцій імплантації."

MET_aintsofortunate:0 "Не Такі Вже Й Удачливі"
MET_aintsofortunate_desc:0 "«Я сам 'собі' допоможу з твоїми кришками... і всім, що в тебе ще є, худосочні посмішки»."

MET_return_to_missoula:0 "Повернення до Міссули"
MET_return_to_missoula_desc:0 "Сталевим Джо керує більше, ніж просто помста чи здобич. Більше навіть за потребу довести свою міць. Якщо хтось і може мати ресурси для створення нового Металу — це залишки уряду США..."

MET_masters_of_montana:0 "Володарі Монтани"
MET_masters_of_montana_desc:0 "Ми довели свою зверхність над усіма в регіоні, і потоки здобичі не припиняються. Нові запчастини вже прикріплюються до новобранців — майбутніх Володарів Монтани."

MET_mind_over_metal:0 "Розум Над Металом"
MET_mind_over_metal_desc:0 "Читання інструкцій до цього обладнання справді дало свої плоди. Може, варто було почати з цього раніше?"

MET_fists_of_lead:0 "Свинцеві Кулаки"
MET_fists_of_lead_desc:0 "У пошуках нових шляхів стати смертоноснішими, деякі наші кмітливі вояки навчилися вбудовувати захоплену зброю прямо в Метал на своїх руках."

MET_prepare_the_warforms:0 "Підготувати Війноформи"
MET_prepare_the_warforms_desc:0 "Потреба замінити плоть на §gМЕТАЛ§! стала всепоглинаючою. Найвищі чини банди вже збирають ресурси, щоб модифікувати себе до крайньої межі, ставши справжніми машинами вбивства.\n\nІнтегровані кулемети, вогнемети, ракетні установки — будь-яка важка зброя кріпиться прямо до тіла, керується розумом, і живиться ядерними двигунами.\n\nВища форма наших переконань: Війноформа. Ризики до біса — скоро це стане реальністю."

MET_radiation_proofing:0 "Радіозахист"
MET_radiation_proofing_desc:0 "Вірите чи ні, радіація шкодить не лише плоті. Спеціальні модулі дають нашим людям змогу йти поруч із «світляками» в Колисці. Може, колись навіть відкриємо ті ворота й дізнаємось, чи варті Погрібальні Землі ризику!"

MET_end_of_the_khans:0 "Кінець Ханів"
MET_end_of_the_khans_desc:0 "Хани хизуються давньою історією — ще з каліфорнійських пустель. Шкода, але їхнє виживання тут і закінчиться. Метал — ось що вічне. Хоча деякі з них можуть бути досить міцними, щоби влитися в нас."

MET_montana_block_party:0 "Блочна Вечірка Монтани"
MET_montana_block_party_desc:0 "Минуло вже кілька років, відколи ми оселились у Чарівному Місті, і наші кордони стали стабільними. Чому б не провідати сусідів?"

MET_a_little_mayhem:0 "Трохи Хаосу"
MET_a_little_mayhem_desc:0 "Генерал Хаос цього тижня влаштував невеличкий рейд, намагаючись справити враження на «батечка». Зазвичай на таке треба дозвіл Сталевого Джо, але якщо здобич хороша — це ж ініціатива, правда? Та й що вони зроблять у відповідь?"

MET_the_cult_struck_back:0 "Культ Завдав Удару"
MET_the_cult_struck_back_desc:0 "Оце так поворот. Гавр колись був просто звичайним містечком, яке не шукало конфліктів. Але тепер, коли вони увірували в цю свою «Свободу», стали значно сміливішими. Вони навіть відправили бойовий загін помститись за напад Хаосу — убили десятки Металевих Пащ і спалили один з наших таборів."

MET_steel_versus_faith:0 "Сталь Проти Віри"
MET_steel_versus_faith_desc:0 "Гаразд, час показати Монтані, що Міссула була винятком. Ми почали цей конфлікт із Культом Свободи, і ми його завершимо — маршем на Гавр. Покажемо, що Метал сильніший за їхні божевільні проповіді."

MET_motormongers:0 "Моторники"
MET_motormongers_desc:0 "Буремники буквально помішані на польотах і добре платять за частини літаків. У аеропорту Біллінгса повно металу, щоби задовольнити тих авіа-маніяків."

MET_maybe_stormy_dan_is_right:0 "Може, Буревісний Ден Має Рцію"
MET_maybe_stormy_dan_is_right_desc:0 "Він безперервно талдичить про те, як класно літати. І Баґстон його підтримує. Навіть якщо ми ще не готові піднятися в небо — можливо, варто зберегти ці корпуси. \n\nАбо прикріпити авіадвигун до мотоцикла й побачити, що буде."

MET_a_late_shipment:0 "Запізніла Поставка"
MET_a_late_shipment_desc:0 "Вугільний Консорціум зазвичай не затримує оплату. Вони знають, які ми стаємо, коли кришки не приходять вчасно. Ми навіть охороняли їхні каравани останнім часом. Схоже, доведеться їх провідати."

MET_northern_uncommonwealth:0 "Північна Некомонвелта"
MET_northern_uncommonwealth_desc:0 "Коли ми прийшли до Чарівного Міста, ніхто не міг передбачити нашого злету. А сьогодні ми контролюємо весь Північний Комонвелт — залізною рукою. Ідеї Сталевого Джо про вдосконалення або смерть виправдали себе: він стоїть над черепами ворогів та горами здобичі.\n\nЛише ми, хто обрав силу понад усе, змогли цього досягти.\n\nТож запускайте авто-доки й віддавайте ще фунт плоті: Метал Царює!"

MET_better_than_coal:0 "Краще за Вугілля"
MET_better_than_coal_desc:0 "Хоча блискучі камінці й здавались дивною валютою, Старий Залізозуб каже, що вони корисні: покращують нейро-нейро... коротше, Металевий Зв’язок в імплантах. Треба дізнатись, скільки ще таких копає Консорціум."

MET_diamonds_in_the_bag_or_else:0 "Або Діаманти, Або Біда"
MET_diamonds_in_the_bag_or_else_desc:0 "Док Ріппер погоджується з Залізозубом: діаманти — чудова сировина для контролюючих схем у Металі. Тож Консорціум має вибір: або віддають кожен блискучий камінчик, або дивляться, як ми їх забираємо."

MET_a_favorable_count:0 "Вигідний Підрахунок"
MET_a_favorable_count_desc:0 "Говорячий ТЦ — дивне місце для командного центру, але нам що? Ми чули про витівки Місконту на заході. Вони корисні, але самотні. Сталевий Джо готовий потиснути руку і встановити межі, якщо ті постачатимуть нам зброю. Раїдер для раїдера. Та й бонусна програма в них крута!"

MET_a_strange_howling:0 "Дивне Виття"
MET_a_strange_howling_desc:0 "Що ближче ми до східного краю, то частіше наші хлопці скаржаться на дивні глюки в імплантах. Випадкові імпульси в кінцівках, голоси у вухах, хибні дані перед очима. Що це? Чутки ведуть у землі, де мешкають так звані Історики."

MET_breaking_rocks:0 "Розбивання Скель"
MET_breaking_rocks_desc:0 "Їхній шлях старий і слабкий, а наш — новий і сильний. Ми загасили полум’я Стендінг Року, й тепер їм доведеться з цим жити. Може, Меркурій зуміє переконати декого з них."

MET_man_and_machine:0 "Людина і Машина"
MET_man_and_machine_desc:0 "Місконти й ми маємо зовсім різні погляди на роботу з машинами. Здавалось би, це мало б бути причиною суперечок — але нам, якщо чесно, байдуже. Ми знаємо, що наш підхід кращий. Тож і торгуємо зовсім різними деталями."

MET_irontoothstale:0 "Історія Залізозуба"
MET_irontoothstale_desc:0 "Старий Залізозуб твердить, що знає, що означають ці видіння. Коли Джо зажадав пояснень, той почав довгу розповідь про Вовка, творицю-матір, і МАНІФЕСТ... і ми всі швидко загубилися. Але щойно він згадав, що Вовк може керувати Металом, як ніхто інший, — ми одразу насторожились. Може, ми на шляху до нової здобичі — як колись у Чарівному Місті?"

MET_offerings_to_a_hungry_maw:0 "Жертви для Ненажерливої Пащі"
MET_offerings_to_a_hungry_maw_desc:0 "А тепер голос хоче, щоб ми довели свою вартість? Ці типи, що з’явились разом із Залізозубом — називають себе Вовкодушами — кажуть, що говорять від його імені. Мовляв, якщо принесемо жертви для експериментів, нас допустять до аудієнції. На сході є кілька племен, з яких можна легко зробити полонених."

MET_meeting_the_wolf:0 "Зустріч з Вовком"
MET_meeting_the_wolf_desc:0 "Сталевий Джо сьогодні спускається в бункер, щоб зустріти цю таємничу силу, яка кликала нас увесь цей час. Час дізнатись, чи вартувало воно всіх зусиль."

MET_dregs_of_dakotas:0 "Сміття Дакот"
MET_dregs_of_dakotas_desc:0 "Питання з Вовком вирішено, ми сильніші, ніж будь-коли. Чому б не зачистити Дакоти до кінця? Нам завжди потрібні нові джерела рекрутів — і місцева голота може стати хорошими бійцями. З деякими покращеннями, звісно."

MET_whynotwyoming:0 "Чому б і не Вайомінг?"
MET_whynotwyoming_desc:0 "Якщо ми вже контролюємо Монтану й Дакоти, чому б не глянути на південь? Старі книги кажуть, що вся ця територія колись була єдиним «Співдружністю». А ми ніколи не відмовляємось від доброго добробуту."

MET_no_prison_can_hold_us:0 "Жодна В’язниця Нас Не Стримає"
MET_no_prison_can_hold_us_desc:0 "Чорний-Каньйон побудував своє суспільство навколо високотехнологічної довоєнної тюрми. Досить металево, якщо чесно. Непогане місце, щоб влаштуватись і відбити бажання у будь-кого нападати на наші південні землі."

MET_molemenreally:0 "Кротові Люди? Серйозно?"
MET_molemenreally_desc:0 "Світ — дивне місце, але підземні кротові люди у Вайомінгу? \nА втім, здається, вони розуміють, хто тепер тут головний — і зверху, і знизу. Не знаємо, чи зможе Док Ріппер вживити їм імпланти, якщо вони захочуть битися, але з’ясувати це варто."

MET_the_southern_gogetters:0 "Південні Ділки"
MET_the_southern_gogetters_desc:0 "Дехто казав, що варто відмовитись від усіх союзів — особливо з цим Вогненним Радою. Мовляв, найсильніші ми лише наодинці. Може, в цьому й є трохи правди. Але Сталевий Джо бачить далі — саме тому він головний. Метал не нескінченний, і людей у нас не безмежно. Якщо розтягнемо себе занадто тонко — усе, що здобули, може зруйнуватись. Трохи взаємної поваги між вояками — і союз збережеться."

MET_one_big_faction:0 "Одна Велика Фракція"
MET_one_big_faction_desc:0 "Наші домовленості з Мідлмарком вигідні обом сторонам. Чому б не розвинути цей успіх?"

MET_steamishotactually:0 "Пара Гаряча, До Речі"
MET_steamishotactually_desc:0 "Гаразд, імплантації парових ядер провалились з тріском. Висновок зроблено. Може, якби ці жерці менше бурчали про «священні» інструменти, а більше допомагали. Але як зброя воно працює добре, та й проблем з джерелами енергії тепер немає."

MET_a_little_encouragement:0 "Трошки Мотивації"
MET_a_little_encouragement_desc:0 "Нашим «друзям» треба трохи поштовху, щоб розкрити весь потенціал. Хіба ж не для цього існує союз? Щоб усі стали сильнішими. І трохи багатшими."

MET_idaho_we_go:0 "Айдахо, Ми Йдемо"
MET_idaho_we_go_desc:0 "Не перший наш вибір, але ця Парова технологія, кажуть, цінна. Цікаво, як вона в імплантах працює..."

MET_kingmaker:0 "Творець Королів"
MET_kingmaker_desc:0 "Сидячи на троні Монтани, Сталевий Джо дивиться на мапу. В усіх напрямках — його вплив. Ті, хто варті — стоять поряд. Ті, хто ні — розчавлені, або скоро будуть. Каравани ходять лише з його дозволу, і від Норд-Енду до Пащі всі знають його ім’я.\n\nТак, бути на вершині — добре. Виявляється, тяжка праця таки дає плоди."

MET_more_weight:0 "Ще Більше Ваги"
MET_more_weight_desc:0 "Деякі новобранці вважають наш план обліпити себе ще більшою бронею «надзвичайно недоцільним» і «шкідливим для мобільності в бою». Ха! Нехай тоді стоять позаду, слабачки, поки ми збираємо славу з близької відстані. Де вони, взагалі, нахапались усіх цих розумних слів?"

MET_billings_medical_marvels:0 "Медичні Чудеса Біллінгса"
MET_billings_medical_marvels_desc:0 "До війни медична галузь Біллінгса була родзинкою міста — чи не найкращою в Північному Комонвелті. Це сприяло розвитку кібернетичних протезів, а також забезпечує нам стабільне постачання медобладнання для складування й використання. Корисно, коли кулі не відскакують."