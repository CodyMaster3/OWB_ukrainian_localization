# Ідеї
car_rally_men:0 "Зібрати Людей!"
car_rally_men_desc:0 "Шеф наказує всім взяти ножі!"

car_survival_men:0 "Війни за Виживання"
car_survival_men_desc:0 "Не секрет, що більшість націй хочуть нас знищити — адже ми рейдери. Тож єдиний вихід — боротися за власне виживання!"

car_crusade:0 "Республіканський Хрестовий Похід"
car_crusade_desc:0 "Демократія — не тема для торгу."

# Квітневі ідеї
car_april_math:0 "Базова Математика"
car_april_math_desc:0 "9+10 = 21. Швидка математика."

car_april_industry:0 "Рання Індустріалізація"
car_april_industry_desc:0 "Якщо ми справді звільнимо масу рабів і почнемо їм платити за роботу, замість катувати для розваги — можливо, ми отримаємо щось, схоже на економіку."

car_april_math_big:0 "Математика Коледжу"
car_april_math_big_desc:0 "Алгебра змусить вас замислитися, навіщо ви взагалі пішли до школи. Але, як не дивно, з неї може бути користь."

car_april_industry_big:0 "Індустріалізація"
car_april_industry_big_desc:0 "Тепер, коли ми мали щось на зразок емансипації, ми можемо побудувати справжнє індустріальне суспільство. Шкода, що РП-гравці Риму не знають, як створити працюючу державу."

car_april_math_bigger:0 "Університетська Математика"
car_april_math_bigger_desc:0 "На цьому етапі математика більше схожа на виклик демонів із безодні. Дивно, але хлопці справляються з цим непогано... Гей, ви часом не були в культі?"

car_april_industry_bigger:0 "Пізня Індустріалізація"
car_april_industry_bigger_desc:0 "Раби вільні, економіка існує... але якою ціною? Тепер вони танцюють Fortnite-танці на обіді. Наслідки індустріальної революції справді стали катастрофою для людства."

car_april_roar:0 "Матір-Земля Ричить!"
car_april_roar_desc:0 "З народом, що звільнений, і освітою для всіх, російська BBQ-економіка мчить уперед на повному газу. Сподіваймося, що ніякий койот не намалює фальшиву дорогу попереду."

car_april_deal:0 "Мистецтво Угоди"
car_april_deal_desc:0 "Знаєш, якщо спочатку поговорити, а не стріляти, є велика ймовірність, що вони просто продадуть тобі те, що ти хочеш. Без крові."

car_april_guns:0 "Обов’язкове Озброєння"
car_april_guns_desc:0 "Право на володіння зброєю більше не право — це державний обов’язок. Час роздати Калаші всім і кожному."

car_april_tactics:0 "Російська Військова Тактика"
car_april_tactics_desc:0 "Битву виграє або програє командир, а не якісь відьми! Це звучить дивно, сер... але якщо ви так кажете."

car_april_tactics_rus:0 "Служити Матінці Росії"
car_april_tactics_rus_desc:0 "Щойно викурив люльку з гірким смаком турецького тютюну."

car_april_tactics_rus_supreme:0 "Армія Вічного Президента"
car_april_tactics_rus_supreme_desc:0 "Немає вищої честі, ніж служба Вічному Президенту — за життя й по смерті."

car_april_rus_attack:0 "Російський Меч"
car_april_rus_attack_desc:0 "Кажуть, тирана можна знищити ручкою... Але я все ж залишу меч. Про всяк випадок."

car_april_rus_defense:0 "Російський Щит"
car_april_rus_defense_desc:0 "§RСлава фермеру, що повернувся додому й побачив попіл. Все життя — у згарищі. Із фермера він став воїном. Він палить. Він ріже. За справедливість.§W"

