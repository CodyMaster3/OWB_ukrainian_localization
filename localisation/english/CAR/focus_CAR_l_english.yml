l_english:
# Focuses
car_menace:0 "Загроза Техасу"
car_menace_desc:0 "Карфаген — одна з найстаріших рейдерських банд у Техасі та одна з останніх, що залишилися. Під керівництвом Шефа ми перетворилися з незначної неприємності на справжню §RЗагрозу Техасу§W."

car_giant:0 "На Межі з Велетнем"
car_giant_desc:0 "Колись у Техасі був інший, кого слід було боятись. Якщо його взагалі можна назвати людиною — Руск. Але для тих, хто ще пам’ятає ті часи — вони давно минули. Ми бачили, як нації та банди зникають одна за одною, і з кожною з них ми ставали сильнішими. Але так само ставав сильнішим і їхній убивця. Залишається лише сидіти на узбіччі, як стерв’ятники, і чекати на рештки."

car_reach_out:0 "Рука до Луїзіани"
car_reach_out_desc:0 "Більшість Луїзіани — це дикуни, де або ти вбиваєш, або тебе. Або ти просто натрапляєш на патруль і тебе застрелюють за те, що ти рейдер. Але в цьому смертельному краю ми, можливо, знайдемо відповідь на проблеми Техасу."

car_coalition:0 "Коаліція Проти Братства"
car_coalition_desc:0 "Після того, як §RТерор Техасу§W було знищено, вплив Братства почав зростати. Вони створювали союзи, знищували рейдерські банди. Ми досі трималися осторонь, бо були достатньо сильні, щоб уникати їхнього гніву. Але зараз ворог уже біля воріт, і ми повинні встати на захист! Об'єднаймо останніх рейдерів Техасу для фінального удару проти залізної руки, що задавила старого тирана!"

car_rally:0 "Зібрати Людей!"
car_rally_desc:0 "Щоб Карфаген пережив випробування часом, ми не можемо мати вояків, що лагідні з друзями й тікають перед ворогами! Якщо ворог наближається, ми маємо стояти пліч-о-пліч — інакше кожен дезертир буде визнаний боягузом!"

car_survival:0 "Війна за Виживання"
car_survival_desc:0 "Не секрет, що більшість сусідів мріють стерти Карфаген з карти. Але хай буде що буде — ми не підемо тихо в ніч, коли вона прийде!"

car_military:0 "Військове Розширення Карфагена"
car_military_desc:0 "Дотепер ми озброювали своїх людей лише трофейною зброєю, знайденою на рейдах. Але кожна епоха має свій кінець. Час почати власне виробництво!"

car_industry:0 "Індустрія Війни"
car_industry_desc:0 "Кожен рейд приносить нових рабів. На жаль, ми так і не навчилися правильно приправляти людське м’ясо — тож доведеться ставити їх до верстатів."

car_houston_take_over:0 "Х'юстон, У Нас Захоплення!"
car_houston_take_over_desc:0 "З Далласом у наших руках ніхто не зупинить нас на шляху до Х'юстона. Занадто довго старі ракетники не пускали нас до Мексиканської затоки. Більше ми не стоятимемо в їхній тіні!"

car_soldiers:0 "Вояки з Луїзіани"
car_soldiers_desc:0 "Жодна держава Луїзіани не погодиться на самогубство, уклавши з нами союз, але деякі рейдери та найманці — так. Якщо ми виживемо, їм заплатять ціле багатство. Питання в одному: жадібність у них сильніша за здоровий глузд?"

car_slaying_giant:0 "Вбити Велетня Техасу"
car_slaying_giant_desc:0 "Багато історій розповідають про те, як слабший перемагає сильнішого. Але стоячи перед нашим старим ворогом, шанси виглядають нульовими. Але якщо саме Техасці — наша смерть, то хай буде так. Ми увійдемо в історію нашого народу як Герої та Мученики!"

car_raiders_paradise:0 "§RРай для Рейдерів§!"
car_raiders_paradise_desc:0 "Всупереч усьому, ми захопили не лише Даллас, а й Х'юстон. Тепер, коли §GВелетня Техасу§W повалено, і ми заявили про себе під сонцем — нехай почнеться наш §RТерор§W!"

car_leadership:0 "Нове Лідерство"
car_leadership_desc:0 "Час змін у банді. Хлопці шепочуться все голосніше, а напруга відчувається в повітрі. Щось назріває — і буде криваво."

car_sadists:0 "Садисти"
car_sadists_desc:0 "Вони напали миттєво. Повертаєшся на мить — і ось уже якийсь псих зарубав усе керівництво банди. Це не вбивство, це було побиття. Вони не використовували зброю — лише зуби й кулаки..."

car_preparing_for_total_war:0 "Підготовка до Повної Війни"
car_preparing_for_total_war_desc:0 "Тепер, коли всі бояться навіть поворухнутися, владу захопили справжні божевільні. Вони не мають логіки. Вони хапають кожного — дітей, старих — і примушують тримати зброю. Я бачив, як вони відрубали голову чоловіку на милицях — тільки за те, що той не захотів узяти гвинтівку."

car_draconian_recovery_methods:0 "Драконівські Методи Відновлення"
car_draconian_recovery_methods_desc:0 "Усі втекли або збожеволіли від «навчання». Вціліли лише психопати. Вони не зупиняються — вколюють бійцям хімікати, годують людськими тілами, якщо нема їжі. Вони стали дикими."

car_eggheads:0 "Розумники"
car_eggheads_desc:0 "Хто б подумав, що купка худих заучок на щось здатна? Але я бачив... дивне. Вони пошепки зіштовхують рейдерів між собою. Ці хлопці надто розумні для свого ж блага."

car_critical_thinking:0 "Критичне Мислення"
car_critical_thinking_desc:0 "Стає дедалі гірше. Кожного разу, як ловиш їх на брехні, вони заплутують ще більше. І ми не можемо вбити тих, хто постачає нам нові хімікати..."

car_master_plan:0 "Головний План"
car_master_plan_desc:0 "Усе сталось занадто швидко. Один з розумників натякнув босу, що сержант його образив. Почалась пиятика, потім — бійка. Ніхто не помітив гранату в центрі кімнати... допоки не стало пізно."

car_grunts:0 "Рядові"
car_grunts_desc:0 "Все більше простих рейдерів починає задумуватись — а чому вони мають слухати босів? У них більше зброї, більше людей. Чому б не командувати самим?"

car_gangland_diplomacy:0 "Гангстерська Дипломатія"
car_gangland_diplomacy_desc:0 "Коли всі рядові об’єдналися проти спільного ворога — того клоуна, що зве себе босом — банда стала єдиною як ніколи. Начальство думає, що це до кращого... Але вони й не здогадуються, що вже приречені."

car_everyone_works:0 "Працюють Усі"
car_everyone_works_desc:0 "Все виявилось просто. Стріляєш людині в коліно — і вона вже не дуже спротивляється. Верещав, благав... Тепер він теж працює. Примусова праця, поки інше коліно не трісне. Може, допоможе."

car_boss:0 "Бос"
car_boss_desc:0 "Шепіт росте, погляди стають косими. Бос починає розуміти — ці черви не знають свого місця. Гарне побиття все виправить. А якщо ні — мізки на стіні теж підійдуть."

car_dont_question_the_boss:0 "Не Став Питань Босу"
car_dont_question_the_boss_desc:0 "Навіть коли він гамселив зрадника, що намагався штрикнути його в спину, бос замислився: «А може, хабар краще?» Але коли в обличчя йому бризнули кістки й кров від розбитої черепної коробки — він зрозумів, що насильство працює цілком добре."

car_iron_grip:0 "Залізна Хватка"
car_iron_grip_desc:0 "Пару страт тут, кілька каліцтв там, трохи ефектного м'ясного шоу з гранатами та дробовиками — і вуаля, банда знову слухається без питань. Навіть трохи нудно. Усі знову працюють, а бос знову на троні з металу й черепів. Так, як і має бути."

car_improve_the_hideout:0 "Покращення Серцевини"
car_improve_the_hideout_desc:0 "Чим більше ми захоплюємо територій — тим швидше ростемо. Захоплюємо заводи, страчуємо декого, решта сама стане на місце."

car_cruel_heartland:0 "Жорстоке Серце"
car_cruel_heartland_desc:0 "Надто багато простору витрачається на дурниці — будинки, клініки, ферми. Спалити все. Більше місця — більше виробництва."

car_territorial_reinforcement:0 "Зміцнення Кордонів"
car_territorial_reinforcement_desc:0 "Щоб тримати рабів усередині, а інших рейдерів — зовні, ми створимо прикордонні застави. Людський ресурс не проблема — кожен хоче першим у м'ясорубку."

car_skulls_on_sticks:0 "Черепи на Палицях"
car_skulls_on_sticks_desc:0 "Залякувати людей не так вже й просто. Просто шматки м'яса — не працює. А от свіжа людська голова з усією шкірою — саме те, що треба."

car_terrorise_the_locals:0 "Тероризувати Місцевих"
car_terrorise_the_locals_desc:0 "Погрози, трохи вогню вдалині, стрілянина в повітря — і всі ті герої швидко змінять думку. А заодно хлопці трохи знімуть стрес у перервах між рейдами."

car_raider_headquarters:0 "Штаб Рейдерів"
car_raider_headquarters_desc:0 "Нам потрібна справжня фортеця. Величезні стіни, кімнати для зброї, раби — для будівництва ще більшого. Це буде шедевр!"

car_territoriality:0 "Лояльність до Території"
car_territoriality_desc:0 "Більше здобичі — більше задоволення. А якщо нагадати, що трапляється з рейдерами, коли їх ловлять держави — мотивація стрімко зросте."

car_we_never_die:0 "Ми Ніколи Не Помираємо!"
car_we_never_die_desc:0 "Ну, майже. Але банда — безсмертна. Здобич, нові хлопці, нові грабунки — і знову більше здобичі!"

car_manifest_destiny:0 "Явна Доля"
car_manifest_destiny_desc:0 "Подивіться навколо — ми оточені ідіотами. Вони нічого не вміють, не знають, як тримати гвинтівку. Їхні землі, їхні речі, їхні міста — тепер це все наше. Силою."

car_incorporate_slavers:0 "Інтеграція Работоргівців"
car_incorporate_slavers_desc:0 "Так, вони трохи бентежать хлопців своїм криком і слізьми, але раби надто корисні. Навіть на фронт — обіцяй їм свободу після п’яти секунд у бою, і вони побіжать першими."

car_slave_labour:0 "Рабська Праця"
car_slave_labour_desc:0 "Масовий набір рабів і відправка їх на будівництво? Геній. Декому може й відірве руку, але, зізнаюсь — бордель збудували втричі швидше."

car_forced_labour:0 "Примусова Праця"
car_forced_labour_desc:0 "Головне — натискати рівно настільки, щоб не вбити. Тонка майстерність. А якщо ще й навчити наглядачів, зможемо будувати навіть у пекучій пустелі."

car_slave_scientists:0 "Раби-Вчені"
car_slave_scientists_desc:0 "Оці великі голови? Може, не вражають, але можуть щось придумати. Тримаєш на прицілі — і дивишся, як швидко винаходять нові вибухівки."

car_slave_researchers:0 "Раби-Дослідники"
car_slave_researchers_desc:0 "Якщо до наших науковців додати «добровільно завербованих» інженерів, процес піде ще швидше. Уявіть — зброя, яка не вибухає в тебе в руках!"

car_new_age_weaponry:0 "Блискучі Іграшки"
car_new_age_weaponry_desc:0 "Дивіться на цю штуку. Не знаю як працює, але пробиває броню з хламу. Може, яйцеголовим налити за це?"

car_guns_with_legs:0 "Гвинтівки на Ніжках"
car_guns_with_legs_desc:0 "Ось бачите цей сміттєвий бак? У нього є гармати, броня, і він не вмирає так легко. Пхаєш його в бій — і коли вороги витрачають патрони, ми їх добиваємо. Тактичний геній!"

car_find_the_good_stuff:0 "Пошук Добра"
car_find_the_good_stuff_desc:0 "Не знаю, що це за фігня, але інженери кажуть — треба для «сміттєвозів». Ну, беремо. Раніше не брали, бо не було причин — а тепер є."

car_shitty_robots:0 "Паршиві Роботи"
car_shitty_robots_desc:0 "Та навіщо всі ці навороти? Лише гальмують роботу. Що таке «гіроскоп» чи «ядерна катастрофа» — мені не відомо. Але головне — більше зброї!"

car_encourage_slavers:0 "Заохочення работоргівців"
car_encourage_slavers_desc:0 "Може, це трохи занадто для деяких, але більше работоргівців — це більше кришок, а отже більше рабів у нашій армії. А це завжди добре. І завжди можна використати їх пізніше для чогось іншого."

car_establish_the_slave_trade:0 "Прорив у работоргівлю"
car_establish_the_slave_trade_desc:0 "Час діяти локально, хлопці — жодних зовнішніх посередників і поганих угод. Ми самі підемо в рабський бізнес і створимо власну компанію! Без звітів і нудних зібрань, і з набагато більше хімії!"

car_drug_dealers:0 "Хімія на продаж"
car_drug_dealers_desc:0 "Хімія — це універсальний інструмент на всі випадки життя. Просто не кажіть людям, з якого лайна робиться Джет. Власне, краще взагалі не згадуйте про лайно."

car_raid_workshops:0 "Красти у конкурентів"
car_raid_workshops_desc:0 "А якщо замість того, щоб щось виробляти, ми просто вкрадемо все? Ну, ми ж рейдери, в цьому сенс. І мороки менше."

car_supply_stashes:0 "Поповнення запасів"
car_supply_stashes_desc:0 "Нам потрібно більше всього для нашої воєнної машини: вода для хлопців, брухт для заводів. Рухайся! Думай про той блискучий новенький БТР, і будеш працювати ще старанніше."

car_turn_the_lights_on:0 "Копнемо генератор"
car_turn_the_lights_on_desc:0 "Я взагалі не розумію, чому наші інженери наполягають, що треба бити по обладнанню. Замість обережного ремонту вони торочать про «перкусійне обслуговування». Ну, гаразд, бийте, тільки не стійте занадто близько."

car_terminals_for_all:0 "Ремонт терміналів"
car_terminals_for_all_desc:0 "Кажуть, що термінали допомагають нашим розумникам швидше писати і краще думати. Отже, дамо їм ці термінали. Стільки, щоб кімната не вміщала. А я просто хочу нову пушку."

car_raider_computer_logs:0 "Журнал рейдів"
car_raider_computer_logs_desc:0 "Ведення журналу рейдів і читання його (навіть!) дозволить нам побачити, де все пішло не так. Можливо, кидати динаміт біля несучих балок — погана ідея. Але наступного разу ми це вже знатимемо. Може."

car_taking_the_best:0 "Забрати найкраще"
car_taking_the_best_desc:0 "Це щось круте — персональний комп'ютер P-65, топові характеристики, можна витягти центральний процесор і квантовий замок... Чого це ти так на мене дивишся? Назад до роботи, дурню, ці штуки потрібні розумникам!"

car_industrial_interest:0 "Викрадення інструментів"
car_industrial_interest_desc:0 "Кажуть, серед рабів є ті, хто знає щось корисне. Наприклад, де залишилися робочі фабрики, як до них потрапити, і коли всі збиратимуться в одній кімнаті, щоб туди жбурнути гранату. Звучить як план."

car_hideout_expansion:0 "Вкрадені креслення"
car_hideout_expansion_desc:0 "Схоже, ми дещо пропустили під час останнього рейду. Наприклад, цілу купу креслень і технічних документів. Не питайте, тоді всі говорили лише про інструменти. Словом, пора повертатися."

car_slaver_settlement:0 "Рабовласницький хаб"
car_slaver_settlement_desc:0 "Можливо, варто надати нашим рабам справжні будівлі. Це точно підніме мораль і звільнить простір, який займають трухляві табори."

car_a_weapon_to_surpass_the_other_gang:0 "Металеві люди"
car_a_weapon_to_surpass_the_other_gang_desc:0 "Відтоді як один з наших побачив солдата Братства, якому було начхати на кулі, він не дає спокою науковцям. Вони поскаржилися іншим, і ті теж зацікавилися. Тож тепер ми отримаємо консервні банки, тобто — силову броню?"

car_convert_metal_armour:0 "Халтурні броні"
car_convert_metal_armour_desc:0 "Може, це й не силова броня, але все одно захищає м'яке тіло від злісної кулі. Так що не ной і вдягай її, скоро вона стане легшою, чесно."

car_power_armor_familiarity:0 "Улюблена іграшка всіх"
car_power_armor_familiarity_desc:0 "Чому хтось узагалі може не хотіти таку штуку? Вона ж крута! Граната перед тобою — не проблема, і ті обличчя поселенців, коли бачать рейдерів у силовій броні... безцінно!"

car_chop_shop_shimmy:0 "Автосервісна афера"
car_chop_shop_shimmy_desc:0 "У нас багато всяких машин, але жодної стандартизації. Усі — купа брухту. Але можна просто бити водіїв та інженерів доти, поки вони не зроблять щось, що ми зможемо повторити!"

car_gear_head_slaves:0 "Раби-механіки"
car_gear_head_slaves_desc:0 "Нехай наші раби лагодять техніку в гаражах. Це краще, ніж нам самим возитися з цим металевим мотлохом. Може, хоч півбака проїдуть без поломок."

car_the_magnum_opus:0 "Магнум опус"
car_the_magnum_opus_desc:0 "Ось воно, хлопці — грандіозний конкурс на магнум опус! Має бути велике, зле, з гарматами! Вся банда в захваті, шукаємо ідеальний апарат смерті!"

car_prove_yourself:0 "Доведи свою силу"
car_prove_yourself_desc:0 "Якщо хочеш вести за собою наших хлопців — доведи, що ти це можеш. Зазвичай це означає, що треба відлупцювати когось його ж рукою, але грамотні тактичні рішення теж згодяться. Напевно."

car_brutal_hazing:0 "Жорстоке посвячення"
car_brutal_hazing_desc:0 "Навіщо тренувати новачків, якщо можна просто накачати їх хімією й змусити битися між собою? Той, хто залишиться живим, очевидно, має більше досвіду."

car_recruit_them_young:0 "Вербуємо молодих"
car_recruit_them_young_desc:0 "Це точно забезпечить приплив нових бійців. Головне — щоб могли хоча б рушницю підняти і приблизно цілились кудись."

car_expand_the_garage:0 "Розширити гараж"
car_expand_the_garage_desc:0 "Щойно хтось згадав про розширення гаражу — вся банда насторожила вуха. Хто ж не хоче мати власного гарчливого монстра на колесах? Все буде зроблено швидше, ніж триває дія простроченого Джету."

car_kings_of_the_roads:0 "Королі доріг"
car_kings_of_the_roads_desc:0 "Ніхто не їде так швидко й так божевільно, як ми! Блокпости, уламки, вогневі пастки — нам байдуже, ми просто валимо на повній швидкості!"

car_custom_rides:0 "Кастомні тачки"
car_custom_rides_desc:0 "Кастом — солодке слово. Більший двигун, кращі амортизатори, гучніші вихлопи. Все дозволено. І в бою це помітно."

car_call_in_the_warboys:0 "Закликати Воїнів Дороги"
car_call_in_the_warboys_desc:0 "Коли кличеш Воїнів Дороги — граєш із вогнем. Вони найкращі водії БТРів у пустці, але вбивають себе швидше, ніж ти встигаєш понюхати ще Джету. Використаємо їх з розумом — тільки не стій близько до машин."

car_metal_boxes:0 "Металеві коробки"
car_metal_boxes_desc:0 "Коробки! На колесах! Тільки додай броні й зброї. Протитанкові рушниці, вогнемети, гранатомети, кулемети — що захочеш! Впихай їх у люки, кулеметні гнізда — рушаймо!"

car_roaring_machines:0 "Гарчливі машини"
car_roaring_machines_desc:0 "Поки вона гарчить — хлопці її захочуть. Двигун будь-який, аби підіймався з землі від одного газу."

car_doped_soldiers:0 "Накачані рейдери"
car_doped_soldiers_desc:0 "Ми дістали щось під назвою «супер Джет». Ніхто не знає, звідки воно, але хлопці скаженіють. Просто накачуй і кидай у бій. Лише не забудь почекати, поки пройде абстиненція. І не зважай на розкидані кінцівки."

car_lightning_raids:0 "Блискавичні рейди"
car_lightning_raids_desc:0 "Ми приходимо й ідемо, поки ворог ще очі не протер. Уриваємось швидко й жорстко — трофеї, раби, життя — усе наше!"

car_blood_soaked_gender_equality:0 "Кривава рівність статей"
car_blood_soaked_gender_equality_desc:0 "У нас тут немає дискримінації. Якщо ти можеш закинути гранату куди треба або відрубати руку мачете — ти свій."

car_take_what_you_need:0 "Бери, що треба"
car_take_what_you_need_desc:0 "Рейд — проста справа. Головне — вирішити, чи варто чіпати той патруль у броні. З досвідом на простих цілях наші рейди стануть ще кращими."

car_business_booms:0 "Бізнес процвітає"
car_business_booms_desc:0 "Бізнес — як гармата: якщо не гримить, то марна. А от як бахне — капці летять. Лише не плутай координати, бо влучиш у своїх."

car_short_fused_engineers:0 "Інженери з коротким запалом"
car_short_fused_engineers_desc:0 "Чим більше вибухівки, тим краще. У кожного має бути власний склад. Це займе час — але крики й уламки того варті."

car_an_explosion_in_understanding:0 "Вибух розуміння"
car_an_explosion_in_understanding_desc:0 "Один з хлопців підірвав себе на експериментальній вибухівці, і раптом в учених з'явились ідеї. Якщо це пришвидшить роботу — кидаємо більше тіл на міни!"

car_starting_the_flow:0 "Запустити потік"
car_starting_the_flow_desc:0 "Ми трохи без соусу. А всі знають — соус крутить світ. Грошей не маємо. Може, трохи 'поговоримо', і кран відкриється."

car_paying_the_boys:0 "Заплатити хлопцям"
car_paying_the_boys_desc:0 "Банда почала бурчати. Кажуть: багато баху, мало шухеру. Якщо дати їм відкат після гарної роботи — вони заспокояться."

car_beer_bonuses:0 "Міцне бухло"
car_beer_bonuses_desc:0 "У нас проблеми з бухгалтерією. Але у нас є рішення — дешевий самопал! Хлопці не помітять, що капців менше, якщо горілка горить."

car_unrefusable_deal:0 "Пропозиція, від якої не відмовишся"
car_unrefusable_deal_desc:0 "Наші щедрі друзі щось не дуже 'жертвують'. Але якщо ми з ними 'повечеряємо' і зробимо вигідну пропозицію — обидві сторони виграють. Особливо ми."

car_victory_hits:0 "Переможні кайфи"
car_victory_hits_desc:0 "Хороша робота — це хороша робота. Часом варто покурити кращу дурь, сидячи на купі трупів."

car_controlling_routes:0 "Контроль торгівлі"
car_controlling_routes_desc:0 "Трохи переговорів, і підпілля стане нашим. Босняки це називають 'горизонтальна інтеграція'. Горизонтальними стануть ті, хто не погодиться."

car_art_of_sack:0 "Мистецтво грабунку"
car_art_of_sack_desc:0 "Пограбування — це не просто хаос. Це мистецтво. Ми — Пікассо наркотиків і кришок. Якщо нічого не вийде — підемо в художники."

car_kingpins:0 "Великі боси"
car_kingpins_desc:0 "Королі та королеви не завжди були добрими. Часом треба застосувати не дуже приємні методи. Але це заради банди. А банда — це все, що має значення."
  #April fools
  car_april_strange:0 "A Strange Man In A Strange Land"
  car_april_strange_desc:0 "Paid vacation in a foreign land, wait what do you mean this isen't paid?"

  car_april_home:0 "Making It A Bit Like Home"
  car_april_home_desc:0 "A change of name there and a new city there and voila it feels just like Russia."

  car_april_russia:0 "The Foundation Of The Russian BBQ Republic"
  car_april_russia_desc:0 "Time to Grill."

  car_april_crusade:0 "The Holy BBQ Crusade"
  car_april_crusade_desc:0 "Kerensky's goal in America is to have the BBQ of a life time and we shall be the tools he uses to achieve that."

  car_april_water:0 "Securing Fresh Water For The BBQ"
  car_april_water_desc:0 "Houston has the main component for what we need for our BBQ, clean water. Gotta have something to drink."

  car_april_pipes:0 "Fixing Up The Pipes"
  car_april_pipes_desc:0 "See fixing the pipes wasn't that hard, only took some duct tape."

  car_april_houston:0 "Houston There Is No Problem"
  car_april_houston_desc:0 "No Houston, no problem such a simple solution."

  car_april_heart:0 "Ripping The Heart Of Texas Out"
  car_april_heart_desc:0 "Most of the time you are supposed to be the hero of the story when you go towards your big fight, but I dunno. You seem more like a antagonist than a Hero going after these guys."

  car_april_brisket:0 "Testing The Brisket"
  car_april_brisket_desc:0 "According to a man from Texas this should be really good, hopefully it is. We just gotta expand our search zone to find this meal as it seems it can't be found within our current land."

  car_april_vegatable:0 "Getting Some Vegatables On The Side"
  car_april_vegatable_desc:0 "Don't worry although I am about to say the same thing your mom said all those years ago, those vegatables are actually really good for you."

  car_april_bbq:0 "A BBQ Worthy Of Texas"
  car_april_bbq_desc:0 "Mhmm, with us finally finding the Brisket and getting some condemnents we're in for the best Texan BBQ there has been in awhile."

  car_april_burger:0 "Try Out The Howitzer Burger"
  car_april_burger_desc:0 "It just works, the burger is a perfectly crafted master piece that melts on the tongue, it's the most beautiful thing i've ever seen."

  car_april_long_march:0 "The Long March West"
  car_april_long_march_desc:0 "There is rumours of a even greater dish to the West, the Carne Asada. I need to have it. Onwards Soldiers!"

  car_april_new_orleans:0 "A Trip To New Orleans"
  car_april_new_orleans_desc:0 "So some of the soldiers recommendeed me to go to a House in New Orleans, they called it the Rising Sun. Sounds like a fun field trip."

  car_april_armstrong:0 "Chef Armstrong?"
  car_april_armstrong_desc:0 "Kerenskyism, a maxim for those who need direction. A direction for the Unenlightened masses Lanius. Fuck Hegelian dialects, fuck democracy and fuck the man in New Vegas. From this April fools update America will be born again, evolved but unchained! Sounds based you are hired. I just walked into your house and you are just gonna hire me? Sounds good."

  car_april_french:0 "These Bastards Eat French Food?!"
  car_april_french_desc:0 "I finally found the House of The Rising Sun in the end, somehow. Problem is that the bastards only served French food so I did the only logical thing and retired them. French food is a culinary disgrace to the arts."

  car_april_bbq_of_bbq:0 "Preparing The BBQ Of All BBQ's"
  car_april_bbq_of_bbq_desc:0 "The BBQ wasn't made in a day, it was made in two."

  car_april_wake:0 "Wake The Legion Up"
  car_april_wake_desc:0 "Surprise it's the 4th Century calling and it wants its Roman Empire back, lets give it to them."

  car_april_state:0 "Colorado Statehood"
  car_april_state_desc:0 "If that is Armstrong's price for continuing being our head Chef so be it, give him this Statehood he desires what ever that may be."

  car_april_asada:0 "The Hunt For The Carne Asada"
  car_april_asada_desc:0 "Like the Brisket it will be mine, run from it, dread it, the carne asada will be mine all the same."

  car_april_omeletts:0 "The Mother Of All Omelets"
  car_april_omeletts_desc:0 "Making the mother of all omelets here Kerensky, can't fret over every egg!"

  car_april_bbq_life:0 "The BBQ Of A Lifetime"
  car_april_bbq_life_desc:0 "The event of a lifetime is about to unfold!"

  car_april_home_again:0 "Going Back Home"
  car_april_home_again_desc:0 "I wanna go home for christmas, wait wrong season?"

  car_april_buisness:0 "Let's Get Down To Business"
  car_april_buisness_desc:0 "To defeat the Huns! Alright, okay no one? Really? Also fun fact they choose the Huns to be the villians for that movie since it was one of the only two hordes Disney assumed the majority of Western people knew about, The Huns and The Mongols."

  car_april_economy:0 "To Build A Russian Economy"
  car_april_economy_desc:0 "Kerensky gave us solid instructions on how to do this, problem being we still got no idea how it works and we were too scared to ask again for a 7th time."

  car_april_savages:0 "Learning Savages Basic Math"
  car_april_savages_desc:0 "77+33 really should be 100, who ever invented math can go get radiation poisoning."

  car_april_production:0 "The Basics of Mass Production"
  car_april_production_desc:0 "So i make sure that the case is properly loaded and then i send it of to the next guy? Sounds easy enough, wait i have to do this 1000 or so times again?"

  car_april_less_savages:0 "From Savages To Less Savages"
  car_april_less_savages_desc:0 "After Kerensky mandated us all to start wearing what he calls Civilized clothes we've all been starting to feel smarter somehow. I wonder if wearing a checkerd suit makes you more of a backstabber."

  car_april_mass_production:0 "The Art Of Mass Production"
  car_april_mass_production_desc:0 "If you put someone to do the same job over and over again he will eventually start getting really good at it, he will also start to really hate himself eventually."

  car_april_vodka:0 "A Vodka Fueled Economy"
  car_april_vodka_desc:0 "As long as the vodka keeps pouring we'll make sure the economy keeps roaring."

  car_april_gun:0 "A Fine Tuned Machine"
  car_april_gun_desc:0 "Our economy is like a trap, its beauty unwitnessed by its architects."

  car_april_art_deal:0 "The Art Of The Deal"
  car_april_art_deal_desc:0 "Now remember what I told you, all you need to do is to go up and ask him if he is willing to trade with you over his brahmin. See, wait no put down that gun!"

  car_april_gun_hand:0 "A Gun In Every Hand!"
  car_april_gun_hand_desc:0 "After experiences from the Weltkrieg we've learned that equipment wins wars, let us not do the mistakes of the old Empire again and wage war without the supplies we need to do such."

  car_april_army:0 "The Russian BBQ Army"
  car_april_army_desc:0 "These raiders are far from the professional Russian Army from back home, but with a good amount of training and a little amount of encouragement we can make soldiers out of them too."

  car_april_fallout:0 "Fallout Tactics"
  car_april_fallout_desc:0 "Altough Russian Tactics are great we need to adapt them to this new reality we've suddenly found ourself in. Main reason for this is that we never put massive green mutant with a mini atomic bomb running towards us into the calculations."

  car_april_russia_tactics:0 "Russian Tactics"
  car_april_russia_tactics_desc:0 "The good old reliable, when the enemy advances shot him. When he stays in position strike him with artillery, and if that dosen't work call in a airstrike."

  car_april_serve:0 "To Serve Russia!"
  car_april_serve_desc:0 "Serving The Russian BBQ Republic, is our destiny, serving The Russian BBQ Republic, the amazing country, where the new sun rises on a blue sky."

  car_april_eternal:0 "An Army Worthy Of The Eternal President"
  car_april_eternal_desc:0 "As so many regiments has before us we shall march to war for our Eternal President with a smile, and in the end send him glorius and victorious. Long to reign over us, Kerensky save us all!"

  car_april_sword:0 "The Russian Sword"
  car_april_sword_desc:0 "The backbone of the Russian army has always been the infantry and always will be the infantry. With this reality in mind they shall be shaped into a sword ready to stab directly into our enemies hearts."

  car_april_shield:0 "The Russian Shield"
  car_april_shield_desc:0 "The backbone of the Russian army has always been the infantry and always will be the infantry. With this reality in mind they shall be shaped like a shield ready to guard all of Mother Russia's kids."

  car_april_cyborg:0 "A Russian Cyborg Army"
  car_april_cyborg_desc:0 "If only we access to such enhancements during the first Weltkrieg we would had smashed the Germans in their boots. I feel like I could tear Kaiser Wilhelm II in half right now."

  car_april_navy:0 "The Russian BBQ Navy"
  car_april_navy_desc:0 "It didn't really come as a shocker that these raiders never had a navy, with them being raiders and all. Time to build one I guess."

  car_april_air:0 "The Russian BBQ Air Force"
  car_april_air_desc:0 "Nothing brings a smile to ones face quite like getting your ear drums blown out by a fighter jet going at mach 5."

  car_april_port:0 "A New Warm Port"
  car_april_port_desc:0 "Unlike most of the shoreline in Russia most of the coast stays warm all year around here. As there is more then enough Pirates In The Caribbean it's time to build a proper port of our own to start challenging their naval supremacy."

  car_april_tsushima:0 "A Navy Worthy Of Avenging Tsushima"
  car_april_tsushima_desc:0 "The Caribbean won't be our secound Tsushima, right? Kerensky is way too smart for such a thing to happen and we've already started constructing destroyers larger then all of their rafts combined."

  car_april_yao:0 "When Yao Guai Flies"
  car_april_yao_desc:0 "Achievement Unlocked: §YWhen Yao Guai Flies§W."

  car_april_mig:0 "A Different Kind Of MiG"
  car_april_mig_desc:0 "The Lockheed SR-71 Blackbird. An advanced long-range strategic reconnaissance aircraft capable of, oh shit wrong plane."
