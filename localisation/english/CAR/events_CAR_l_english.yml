l_english:

nf_car.1.t:0 "Історія Успіху та Тріумфу"
nf_car.1.d:0 "Під проводом Шефа ми виросли з банди рейдерів, про яку майже ніхто не чув, до Загрози Техасу. І тепер усі питають – як це сталось?"
nf_car.1.a:0 "Шеф забезпечив стабільність усередині, а вже потім почав експансію!"
nf_car.1.b:0 "Шеф дав людям смак війни!"
nf_car.1.c:0 "Шеф змусив кожного раба працювати!"
nf_car.1.e:0 "Шеф подбав, щоб кожен рейдер був озброєний до зубів!"

nf_car.2.t:0 "У Лігві Велетня"
nf_car.2.d:0 "Коли Техаське Братство стало домінуючою силою в регіоні, воно залишало за собою кривавий слід. Тут банда рейдерів стерта з лиця землі, там – держава анексована. На наше щастя, вони не вважали за потрібне йти на нас, і хоч вони ставали сильнішими з кожною перемогою – так само й ми!"
nf_car.2.a:0 "Ми завербували вцілілих рейдерів."
nf_car.2.b:0 "Ми не поспішали, забезпечуючи внутрішню стабільність."
nf_car.2.c:0 "Як справжні стерв’ятники, ми збирали залишки з полів битв."

nf_car.3.t:0 "Подорож до Луїзіани"
nf_car.3.d:0 "Під час експедиції до Луїзіани ми натрапили на дві групи, які можуть допомогти нам здобути більше сили в Техасі – Десперадос і невелику групу креольських воїнів. Проблема в тому, що контакт з одними, ймовірно, зіпсує стосунки з іншими. А ще є порада одного з лідерів експедиції: просто повернутись додому й не мучити людей далі."
nf_car.3.a:0 "Креоли пропонують приєднатися до нас."
nf_car.3.b:0 "Десперадос обіцяють допомогти нам із виробництвом зброї."
nf_car.3.c:0 "Знаєш, може, той хлопець мав рацію. Пора додому."

# Квітневі жарти
nf_car.4.t:0 "Його Прибуття"
nf_car.4.d:0 "Під час нашого останнього барбекю космічний корабель впав за 10 км від табору. Як будь-які цікаві дурні, ми пішли подивитись. Там ми знайшли палаючий НЛО й чоловіка, що ходив серед вогню. Ми спробували стріляти в нього, але кулі нічого не зробили. Коли вогонь згас, більшість із нас одразу здалась. І він сказав:"
nf_car.4.a:0 "Не бійтеся, діти, я просто шукаю щось поїсти."

nf_car.5.t:0 "Партія"
nf_car.5.d:0 "Нам потрібна політична партія для участі у виборах. Дивно, що не можна просто голосувати за людину, правда ж?"
nf_car.5.a:0 "Може, назвемося Російська BBQ Республіканська Партія."

nf_car.6.t:0 "Наш Новий Лідер"
nf_car.6.d:0 "Після того як ми допомогли безсмертному чоловікові повернутись до табору, він розповів, хто він. Вічний Президент Олександр Керенський, Великий Лідер Російської Республіки та всіх її підданих. Ми не знаємо, де ця країна, але звучить він переконливо."
nf_car.6.a:0 "Він має бути нашим Лідером!"

nf_car.7.t:0 "Нові Міста"
nf_car.7.d:0 "Що це за назви міст, сер? Міста з Республіки, перенесені сюди? З цими містами ми переможемо!"
nf_car.7.a:0 "Він усе вигадує, правда ж?"

nf_car.8.t:0 "Техаське Барбекю"
nf_car.8.d:0 "Оце я розумію – справжнє BBQ! У Росії були тільки пляшки горілки, а тут м’яса вистачить, щоб нагодувати континент. І ці соуси..."
nf_car.8.a:0 "Серйозно? Він хоче ще одне барбекю?"

nf_car.9.t:0 "Підготовка до Великого BBQ"
nf_car.9.d:0 "Для нас здається, що попереднє барбекю було вчора, але Керенський уже хоче ще одне. І тепер Шеф Армстронґ пообіцяв приготувати Матір Усіх Омлетів і усе інше для святкування."
nf_car.9.a:0 "Матір Усіх Омлетів... мммм."

nf_car.10.t:0 "Велике Барбекю"
nf_car.10.d:0 "М’ясо Карне Асада готове, Армстронґ творить дива на кухні – настав час офіційного початку Великого BBQ. Люди з усієї Пустки з’їжджаються на Російське барбекю!"
nf_car.10.a:0 "Армстронґ справді вміє влаштовувати вечірки."

nf_car.11.t:0 "Повернення Додому"
nf_car.11.d:0 "Коли Керенський досхочу насолодився американською їжею та святами, настав час повертатись додому. Але не сумуйте – ви все ще можете завойовувати Америку разом із ним."
nf_car.11.a:0 "До наступного разу, бувай!"