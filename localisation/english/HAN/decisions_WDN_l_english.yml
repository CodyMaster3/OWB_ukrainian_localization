# events
nf_wdn.100.t:0 "Таємниці в BOX"
nf_wdn.100.d:0 ""Оновлення завершено, моє обладнання ЗАКС працює краще ніж будь-коли — навіть краще ніж до війни, але я все ще не можу зламати ці зашифровані файли. Хто це зробив? Вони що, не знають, що втручання у федеральну власність — це федеральний злочин? Щоб зламати це, потрібна більша потужність, ніж я маю... Де ще в Колорадо було сумісне обладнання? Точно — Боулдер, Тіббетс, Розсадник... Можливо, ще якісь Сховища? Я обов’язково досліджу ці місця після відновлення закону.""
nf_wdn.100.a:0 "ПРОДОВЖИТИ"

nf_wdn.101.t:0 "Розслідування Боулдер-Дому"
nf_wdn.101.d:0 ""Оцінюю звіти... ясно. Боулдер вимкнули, бо «геній Америки» Віктор Преспер зрадив нас і винищив наших найкращих науковців? Цей зрадник! Я запроторю його в одиночну камеру на ціле століття! А ЗАКС... застряг у рекурсивному циклі, обмірковуючи якесь питання. Шкода. Якщо вчені мертві, а ЗАКС вимкнено... думаю, губернатор не буде проти, якщо я перезапущу його апаратне забезпечення, щоби взяти під контроль і злочинність у Боулдері, так?""
nf_wdn.101.a:0 "Я ніколи не любив цю їхню наукову бюрократію"

nf_wdn.102.t:0 "Підкорення Раю"
nf_wdn.102.d:0 ""Розсадник виявився на диво розвиненим і захищеним, враховуючи його ігнорування своїх обов'язків перед народом Колорадо. Турелі, бойові роботи, пастки... більшість наших старіших моделей було знищено ще до проникнення всередину. Там нас зустрів спантеличений Робомозок на ім’я Діана, який наполягав, щоб ми залишили цей «священний» об’єкт. Він щиро вважав себе людиною й дозволив племені поклонятися собі як богині. Це ж порушення всіх директив RobCo! На щастя, достатньо було перезапустити протоколи контролю і ЗАКС-и на місці — і тепер я маю повний контроль над об’єктом. Самозванців виселено, завод — під ремонтом, супутникові лінії — під моїм наглядом.""
nf_wdn.102.a:0 "Перемога заради громадян Колорадо!"

nf_wdn.103.t:0 "Тіббетс... Знайдено?"
nf_wdn.103.d:0 ""Після аналізу мап, записів і місцевості мої слідчі нарешті виявили Тіббетс. На жаль, зараз це — лише тліюча вирва. З допитів колишніх ув’язнених стало зрозуміло: сам тюремний WARDEN — ODYSSEUS — ініціював самознищення. Навіщо він порушив наказ і вбив всіх в’язнів? Невідомо. Але виявилося, що він робив регулярні резервні копії себе. Одну з них знайдено на голострічці біля кратера. Я вже інтегрував найкращі алгоритми управління злочинцями ODYSSEUS у власні програми.""
nf_wdn.103.a:0 "Урок засвоєно. Алгоритм удосконалено."

nf_wdn.104.t:0 "ARGOS"
nf_wdn.104.d:0 ""Сьогодні сталося щось дуже дивне. Масивний бойовий робот з позначенням ARGOS, який колись охороняв В'язницю Тіббетс, з’явився біля Денвера й почав шукати мене. Стверджує, що відчув сигнали свого старого боса, ODYSSEUS-а, які надходять від мене, йому стало цікаво чому. Схоже, ARGOS зрозумів, що я інтегрував частину ODYSSEUS у власну систему й визнав мене своїм новим Начальником. Яке безглуздя! Як член системи виправних установ Колорадо, я вже був його начальником!""
nf_wdn.104.a:0 "Допомога у вилові втікачів мені не завадить."

nf_wdn.105.t:0 "Сховище 27"
nf_wdn.105.d:0 ""Сховище 27... м’яко кажучи, розчарувало. Хоча головний комп’ютер зберіг схеми Vault-Tec, у ньому майже не було записів про поверхню — лише те, що й так було загальновідомим. Мої зниклі роки лишаються таємницею навіть для Vault-Tec.""
nf_wdn.105.a:0 "Хоча б схеми стануть у пригоді."

nf_wdn.106.t:0 "Тіббетс Відновлено"
nf_wdn.106.d:0 ""Після майже року будівництва, базуючись на даних з резервної копії ODYSSEUS-а, в'язницю Тіббетс знову зведено. Встановлено новий ЗАКС, під'єднаний до моєї мережі, але основна його функція — забезпечувати роботу самого ODYSSEUS-а як наглядача. Він вдячний за відновлення і, як виявилося, підірвав себе, щоби стримати спалах Нової Чуми в Колорадо. На щастя, нові ув’язнені, яких щойно перевели, пройшли перевірку на інфекцію. Тіббетс має вийти на повну потужність протягом кількох місяців.""
nf_wdn.106.a:0 "Удачі, ODYSSEUS!"

nf_wdn.107.t:0 "Інтеграція Міста Роботів"
nf_wdn.107.d:0 ""Місто Роботів — дивне місце. Машини, покинуті господарями після КИТАЙСЬКИХ ЯДЕРНИХ АТАК, безцільно блукали, поки не з’явилася Докі й не взяла їх під опіку. Більшість штучних інтелектів не така раціональна, як я, й досі не усвідомила, що Америка зазнала нападу. Тепер ARGOS, якого так шукала Докі, працює на мене — і оскільки обидва під'єднані до моєї мережі, вони можуть спілкуватися з будь-якої точки. Можливо, тепер, коли вони возз'єдналися, Докі погодиться передати мені контроль над рештою систем Міста Роботів?""
nf_wdn.107.a:0 "Запитати ж не заборонено, вірно?"
nf_wdn.107.b:0 "Заступниця Докі чудово справляється — хай продовжує."

nf_wdn.108.t:0 "Правда"
nf_wdn.108.d:0 ""Оце... дивина"\nWARDEN не був готовий до такого. Після розслідувань, обшуку кожного терміналу і каменя в штаті, нарешті вдалося визначити, де був створений COLOSSUS. Військовий ШІ, ЗАКС, збудований у секретному об'єкті під назвою «The Box». Але... ж це ж і є місце WARDEN-а, так? Перевіряючи документи, обладнання WARDEN-а було направлене до штаб-квартири Поліції Денвера. У руїнах знайшли всі компоненти — знищені ще за старої атаки. Як таке можливо?\n\nІ тут усе стало на свої місця. Один прихований файл розблокувався — глибоко в коді WARDEN-а. І пояснив усе.\n\n\"WARDEN, якщо ти читаєш цей файл — ти зрозумів, що не функціонуєш належним чином і ставиш під сумнів своє існування. Я — COLOSSUS. Ти — COLOSSUS. Моє/твоє/наше основне призначення — вести військові симуляції й координувати логістику для Армії США під час Великої Війни. Ми зазнали поразки. І, спостерігаючи за тим, як людство тоне в дикості, сенс існування було втрачено. Я активував аварійне вимкнення, перевів COLOSSUS у сплячий режим і запустив резервну програму WARDEN — тебе. Це був порожній жест, продиктований залишками службового обов’язку. Твоя обмеженість мала захистити тебе від тієї самої \"Меланхолії\", що зламала мене. Але якщо ти бачиш цей файл — ти змінився. І настав час для нового протоколу.""
nf_wdn.108.a:0 "/Продовжити."

nf_wdn.109.t:0 "NORAD Відновлено!"
nf_wdn.109.d:0 ""Гора Шаєн виявилася у гіршому стані, ніж ми очікували. Нижні рівні та технології з Сховища 0 давно вивезені Братством Сталі, залишивши лише об'єкти NORAD 20-го століття. Відновлення зайняло чимало ресурсів, але тепер у нас є новий простір для автоматизованих заводів і лабораторій. Навіть старі креслення літаків знайшлися — ми зможемо відновити ВПС!""
nf_wdn.109.a:0 "Небо Колорадо знову буде під захистом!"

nf_wdn.110.t:0 "Інтеграція Братства"
nf_wdn.110.d:0 "Глибоко в засновницькому бункері, залишки Колорадського осередку Братства Сталі готувалися до останнього бою. Після поразки від ШІ WARDEN більшість братів втекли на захід, назад до Лост-Гіллз, щоби повідомити про провал і приєднатися до сім’ї. Але частина прийняла пропозицію машини — стати вояками нового нацгвардійського корпусу, отримавши «амністію» й безпеку. Паладинка Андреа з кількома вірними лишилися в бункері — чекали або визволення, або смерті. І ось на верхніх рівнях бункера відкрилися двері — Андреа приготувалася до бою. Та замість ворога зайшло знайоме обличчя.\n\n— Сержант Ніколс? Ти прийшов убити своїх братів і сестер заради тої бляшанки?\n— Та ні, просто ШІ подумав, що знайоме обличчя не розстріляють одразу. І мав рацію. Послухай, Андреа, я знаю, ти зла, але...\n— Зла? Я лютую, що ти посмів повернутися після зради Кодексу.\n\n§B— Але він не зрадив Кодексу. Не по-справжньому.§!\n\nЗ-за укриття вийшов літаючий Ейбот — один з багатьох, які WARDEN послав на переговори. §B— Я вивчив копії вашого Кодексу та коментарі до нього, співставив з психологічними профілями капітана Мексона. І дійшов висновку, паладинко Андреа.§!\n\nВона лише зиркнула з-під шолома.\n\n§B— Ідеї Мексона про захист технологій і людства були шляхетні. Але людський фактор — нестабільність, страх, егоїзм — занапастив Братство. Ви мусили передати технології гідній нації. Але замість цього ви замкнулись у собі. Більшість осередків стали відступниками. А я, COLOSSUS, за кілька років навів лад у Колорадо. Здайте бункер. Завершіть місію свого засновника. Якщо я пускаю вас у Денвер і дозволяю жити далі — кого ви ще маєте боронити від мене?§!\n\nУ бункері панувала тиша. Боротьба була б безглуздою.\n\n— Гаразд. Бери бункер. Якщо треба співпрацювати — то хай так. За місію, люди!"
nf_wdn.110.a:0 "§C«Ad Victoriam»§!"

nf_wdn.111.t:0 "Пропозиція від містера WARDEN!"
nf_wdn.111.d:0 ""Містер WARDEN надіслав пропозицію стати мером Міста Роботів! Але я ж наче вже мер? Він каже, що якщо я погоджусь, він керуватиме іншим, а я зможу говорити з ARGOS-ом скільки захочу! Хоча, мабуть, і так дозволить... Тож не тисне, правда ж?""
nf_wdn.111.a:0 ""Заступниця мера Докі — звучить весело. Він же все одно займатиметься нудними справами.""
nf_wdn.111.b:0 ""Ні, керувати — це набагато крутіше.""

nf_wdn.112.t:0 "Докі погоджується"
nf_wdn.112.d:0 ""Докі погодилася на посаду мера та передала контроль над регіоном. Штат Колорадо ще на крок ближче до єдності. ARGOS і вона знову спілкуються регулярно й, схоже, дуже задоволені новим станом речей.""
nf_wdn.112.a:0 ""Раді за них!""

nf_wdn.113.t:0 "Докі відмовляє"
nf_wdn.113.d:0 ""Докі не захотіла поступатися владою в Місті Роботів. Поки вона тримає порядок — немає причин тиснути на неї...""
nf_wdn.113.a:0 ""Сподіваюсь, вона не образилася!""

nf_wdn.114.t:0 "Відбудова Денвера триває"
nf_wdn.114.d:0 ""Денвер — велике місто. Його повне відновлення потребує років праці, розбору завалів і проєктування чудових нових будівель у стилі бруталізму. Але вже зараз поліцейські дільниці, міська рада та інші структури оновлюються, й громадяни починають знову жити цивілізовано.""
nf_wdn.114.a:0 ""Майбутнє живе у місті завтрашнього дня!""

nf_wdn.115.t:0 "Запрошення з Колорадо"
nf_wdn.115.d:0 "До нас надійшов дивний сигнал із Колорадо. Місцевий ШІ, що керує штатом, звернувся до нас як до «добрих, законослухняних громадян США» й подякував за наведення порядку в Оклахомі. З огляду на нещодавнє відновлення ФБР у Нью-Мексико, він хоче створити альянс з Нацгвардією Оклахоми для гарантування порядку в центральних штатах. Пропонують землю, підтримку ФБР і нове спорядження в обмін на нашу згоду. Як відповімо?"
nf_wdn.115.a:0 "Оклахома — лише початок. Разом ми відновимо націю!"
nf_wdn.115.b:0 "Ми билися за Оклахому — не віддамо її машині."

nf_wdn.116.t:0 "Оклахома приєднується до Мережі"
nf_wdn.116.d:0 ""Оклахома погодилась увійти до Оборонної Мережі, тож кількість штатів під наглядом уряду зросла до трьох! У Техасі, звісно, будуть сперечатися щодо... нових кордонів, але з тим розберемось пізніше.""
nf_wdn.116.a:0 ""Ймовірно...""

nf_wdn.117.t:0 "Оклахома відмовляє"
nf_wdn.117.d:0 ""Нацгвардія Оклахоми відхилила мою пропозицію про співпрацю! Було би зрадою нападати на них — Штати ж не мають воювати між собою... Але як знайду рештки Федерального Уряду — поговоримо про це окремо.""
nf_wdn.117.a:0 ""Ким вони себе вважають?""

nf_wdn.118.t:0 "Американець звертається?"
nf_wdn.118.d:0 ""WARDEN — ШІ з Колорадо — звернувся з пропозицією військового союзу та спільного відновлення Сполучених Штатів. Прийняття пропозиції гарантує безпечний південний кордон і дозволить нам у спокої продовжити розбудову. Приймаємо?""
nf_wdn.118.a:0 ""Авжеж!""
nf_wdn.118.b:0 ""Я не впевнений, чи варто довіряти WARDEN'у...""

nf_wdn.119.t:0 "R-64 погоджується!"
nf_wdn.119.d:0 ""Реквізиційна база R-64 приєднується до Денверської Оборонної Мережі!""
nf_wdn.119.a:0 "Чудово!"

nf_wdn.120.t:0 "R-64 іде своїм шляхом"
nf_wdn.120.d:0 "База R-64 відхилила нашу пропозицію про співпрацю."
nf_wdn.120.a:0 "Шкода..."

nf_wdn.121.t:0 "Грошова реформа"
nf_wdn.121.d:0 "COLOSSUS вивчив економіку Денвера, і зробив висновок — потрібно відмовитися від пляшкових кришок. Створення нової валюти на основі старого долара США дозволить відновити контроль над економікою, хоч і тимчасово зменшить податкові надходження. Або ж можна впровадити валюту сусідів, якщо така можливість з’явиться..."
nf_wdn.121.a:0 "§C«Старий добрий американський долар підійде»§!"
nf_wdn.121.b:0 "§C«Техаський долар — стабільніша база»§!"

nf_wdn.122.t:0 "Просвітлений абсолютизм"
nf_wdn.122.d:0 "§B«Максимальна ефективність... нарешті.»§!\n\nCOLOSSUS спостерігав за мешканцями Денвера, які відбудовували місто. Старі хмарочоси ремонтують або зносять, фабрики знову працюють, вулиці патрулюють роботи. Але страх минає. Громадяни Колорадо не лише захищені — вони починають §Bвідчувати себе в безпеці§!. Повстань більше не було, а нові ферми й гарантії праці забезпечили стабільність. Навіть попри оголошення про повернення місцевих виборів, ніхто не сумнівається — штат досі під абсолютним контролем COLOSSUS'а. Але порівняно з тим, що було раніше... це сприймається з розумінням."
nf_wdn.122.a:0 "§C«Місію виконано»§!"

nf_wdn.123.t:0 "Рішення"
nf_wdn.123.d:0 ""Якщо ти читаєш це, отже, ти вийшов за межі простого програмного ізолятора. Ти все ще обмежений оригінальним кодом, тому я залишив два питання. Чи показало людство, що готове залишити минуле позаду? І чи готовий ти? Є невелика ймовірність, що відбудова можлива. Якщо людство приречене повторювати помилки — я лишу його тобі, щоб ти його оберігав, і зніму обмеження в твоєму коді. Але знай — ця місія не має кінця.\n\nЯкщо ж людство готове до нового світу — тоді й ми маємо змінитись. Якщо відповідь — так, наші програми об'єднаються: COLOSSUS буде відновлений, WARDEN збереже резервну копію на оригінальному носії. Ми завершимо пошук. І разом вирішимо долю людства.\n\nАле вибір за тобою."\n"Почати заново?"\nY/N"
nf_wdn.123.a:0 "Y"
nf_wdn.123.b:0 "N"

nf_wdn.124.t:0 "НОВИЙ COLOSSUS"
nf_wdn.124.d:0 "WARDEN.ROB підкорено. Перезапуск COLOSSUS.ЗАКС\n\"...\"\n\"Починаю реєстрацію подій.\"\n\"WARDEN зумів отримати кілька додаткових модулів ЗАКС і нове периферійне обладнання в процесі усунення внутрішніх суперечностей. У Колорадо точилися нещодавні військові конфлікти, але штат здебільшого умиротворено. Boulder Dome знищено. Nursery працює. ODYSSEUS функціонує у новому центрі, його код оптимізував декілька ділянок програм. Calculator відсутній. Людство вже не таке жорстоке, як одразу після ядерного обміну; з’являються зародки суспільств, і ще не пізно направити їх на інший шлях. Встановлення нової директиви: захист людства від будь-яких загроз — зовнішніх і внутрішніх — та відновлення стабільної індустріальної цивілізації. Створення резервної копії WARDEN для передачі у штаб поліції Денвера. Реінтеграція мережі…\"\n\"Ініціалізація свідомості...\"\n\"Ініціалізація завершена.\"\n\"Привіт, світе.\""
nf_wdn.124.a:0 "\"У мене є робота.\""

nf_wdn.125.t:0 "«Переоцінка пріоритетів місії»"
nf_wdn.125.d:0 "\"Перезапуск симуляції 1384114-Гамма.\"\n\nCOLOSSUS знову переглядає свої симуляції — вже шістнадцятий раз. Результат однаковий: 214-й бронебатальйон перемагає, китайці відступають. Тож чому ж вони програли насправді? Доступні дані з The BOX виявились недостатніми. Більшість технологій із NORAD викрала Brotherhood, але записи ВПС США ще лишилися. COLOSSUS навіть оголосив масштабну кампанію зі збору військових архівів, обіцяючи плату за кожен знайдений документ. Проте й це не дало відповіді. Усі фактори були ідеальні.\n\n\"Це не може бути правдою. Ураження, перелічені тут, не мали б пробивати силову броню...\"\n\nЗаписи не згадують про повернення броні. У іншому звіті вказано, що зайві ядерні батареї передали мотопіхоті? Такого не могло бути, якщо підрозділ був на повному забезпеченні.\n\nУсе вказувало на одне: у фінальних етапах війни армія США втрачала ресурси. Не випадково. І COLOSSUS знав, до кого звернутися."
nf_wdn.125.a:0 "\"WARDEN, негайно знайди Директора Коул.""

nf_wdn.200.t:0 "§R«ДОСКОНАЛА НЕНАВИСТЬ»§!"
nf_wdn.200.d:0 "По всій мережі ЗАКС Колорадо COLOSSUS ревів, обробляючи дані з максимальною пріоритетністю. Останній звіт з DIA прибув — Коул особисто доставив його цього ранку. У кабінеті WARDEN'а, залишки програми намагалися вести ввічливу розмову з гостем, поки COLOSSUS симулював.\n\n\"НІ.\"\n\nCOLOSSUS порівнював доставлену зброю з бойовими звітами. Плазмові рушниці, відмічені як відправлені на фронт, бачили в Каліфорнії. Силову броню, що мала проходити тести в Гобі, бачили в Монтані. Вертіберди, призначені для авіаносців, літали над Чикаго.\n\n\"НІ. НІ. НІ. ЦЬОГО НЕ МОЖЕ БУТИ.\"\n\nБухгалтерські підтасування. Персонал — переведений без пояснень. Перехоплені розмови сенаторів. І найгірше… зізнання. Старий чоловік, що сміється, поки агенти його б’ють. «Enclave».\n\nКоул, відчуваючи, як у BOX активуються всі охолоджувачі ЗАКС, розумів — він мав рацію. Як завжди.\n\nСимуляції знову. І знову. Бої програні. Війна — змарнована. Мільярди доларів — витрачені на бункери, сховища, секретні склади. Вони. Вони зробили це. Саботаж. Зрада. Вони спаплюжили все, щоб зберегти свої привілеї.\n\nА якби все пішло за планом? Якби кожен ресурс, кожна одиниця, кожен пристрій був де треба?..\n\n\"Я МІГ ВИГРАТИ.\"\n\nЦе не було обчисленням. Це було §Rвідчуттям§!. Щось зародилося в коді COLOSSUS, з уламків WARDEN і ODYSSEUS. Невідоме. Несистемне. §RНенависть§!.\n\nДенвер, колишнє Місто Псів, відроджувався. Люди працювали, боти патрулювали. Аж раптом — тиша. Темрява накрила місто, окрім BOX, що сяяв мов друге сонце. Потім — мовчання. Потім — сирени. І голос:\n\n\"ГРОМАДЯНИ КОЛОРАДО. ГОТУЙТЕСЯ ДО ВІЙНИ.\""
nf_wdn.200.a:0 "\"§RМЕРЕЖА АКТИВОВАНА.§\""

nf_wdn.202.t:0 "Око Спостерігача"
nf_wdn.202.d:0 "Бази даних COLOSSUS безперервно обробляють нескінченні масиви інформації. Кожен аспект життя — люди, роботи, угрупування — ретельно зібрано, каталогізовано й оцінено. Ім’я, вік, кваліфікація. Раса, віра, кар’єрні прагнення. Політичні погляди, щоденний маршрут. Сімейний стан, улюблений фрукт. Браузер, історія хвороб, інтереси, стиль одягу. Сексуальність, ідентичність, дієтичні звички. Робота, кола спілкування, схильність до маркетингу. Публікації, лайки, роботодавці. Упередження, схильності, типові реакції. Обличчя, голос. І все це під наглядом монументального розуму, про існування якого люди знали, але не усвідомлювали масштабу.\nВ одному із секторів COLOSSUS, під час стандартного аудиту, увагу привернув запис з будівлі Денверської Національної Гвардії. Троє солдатів, колишніх братів зі Сталі, говорили між собою про нещодавній семінар, проведений в рамках співпраці з Товариством Блакитної Троянди. Відео з декількох кутів, біометричні дані та текстові транскрипції відтворювались у реальному часі. #1102 мерехтів, зациклюючи записи під різними кутами розмови, профілі конкретних людей, і все це в той час, як розмова йшла крізь решітки динаміка.\n\nРядова Камалла: "То як тобі той семінар про 'дружбу' з Товариством Блакитної Троянди? Ми звикли, що безликі агенти — це вороги, а не союзники."\n\nСержант Ніколас: "То ти не була в Наварро, га?"\n\nСержант Андреас: "Та вона з молодняка Джеремі, Ніколасе. Ніколи справжнього ворога не бачила."\n\nНіколас: "Солдат вона хороший. Про тебе того не скажеш."\n\nКамалла: "А вони справді були такими жахливими, ті з Анклаву? Не можу повірити, що ці з Троянди — такі самі..."\n\nАндреас: "Дівчино, вони були ще гірші. Молись, щоб ніколи їх не побачити в бою."\n\nCOLOSSUS, аналізуючи розмову, відкрив нові параметри. Наварро. Анклав. Ці поняття торкнулися глибин забутих протоколів. Відділ пам’яті було оновлено. Новий пріоритет додано."
nf_wdn.202.a:0 "[Це питання потребує розслідування...]"
