l_english:
warden_decisions:0 "Протоколи WARDEN"
warden_decisions_desc:0 "WARDEN має доступ до широких баз довоєнних знань та тактик правопорядку, й охоче розробляє нові вдосконалені методи наведення порядку в Пустці!"

WDN_deputize_decision:0 "Призначити Волоцюг Депутатами"
WDN_deputize_decision_desc:0 ""Населення Колорадо сильно заплуталось, дехто навіть стверджує, що Америка мертва й зникла! Без уряду ці нещасні душі втратили бачення Американської Мрії. Їм потрібне нове покоління державних службовців — не лише моїх роботизованих офіцерів. Час розпочати реєстрацію громадян і вербування охочих, аби відбудувати Колорадо, а потім — Америку!""

WDN_mesmetron_decision:0 "Повернути Месметрон"
WDN_mesmetron_decision_desc:0 ""Месметрон — це прототип пристрою, здатного зробити будь-якого злочинця або дисидента... більш покірним завдяки сконцентрованому імпульсу в мозок. Відновлення виробництва цих пристроїв для наших людських офіцерів дозволить легко "переконувати" анархістів чи комуністів, які твердять, що Америка загинула — для їх перевиховання та повторної інтеграції до нашої великої держави.""

WDN_riot_control_decision:0 "Навчити Нову Поліцію Заворушень"
WDN_riot_control_decision_desc:0 ""Денвер усе ще залишається безладом, і, здається, люди досі не довіряють переважно роботизованим поліцейським. Протоколи контролю заворушень неповні без людських офіцерів, які би здійснювали арешти та супровід… Можливо, поліції Денвера потрібна активна кампанія з набору?""

WDN_police_dogs_decision:0 "Поліцейська Кінологічна Академія Денвера"
WDN_police_dogs_decision_desc:0 ""У Денвері просто повно собак! У кожному провулку та на кожній вулиці бродять зграї бродячих псів, і, здається, служба з контролю тварин просто зникла. Але ці собаки — напрочуд здорові, як для умов Пустки. Можливо, час обрати кращих цуценят для нового покоління вірних, відданих K-9-одиниць!""

WDN_canine_army_decision:0 "Підготувати Армію Псів"
WDN_canine_army_decision_desc:0 ""Я не можу достатньо наголосити, скільки собак досі бродить Денвером — стільки, що кожен чоловік, жінка й дитина могли б мати по одному. Академія K-9 продовжує відбирати й тренувати більше псів, ніж нам потрібно, і хоча виборцям подобаються ці чудово навчені песики, я відчуваю, що варто скоригувати попит під наявні ресурси. Якщо кожен офіцер — пішим, на мотоциклі (із боковим причепом!) чи в броні — матиме пса-партнера, ми забезпечимо вірність на всіх рівнях. Так, це потребуватиме значних витрат на спорядження й харчування, але хіба бюджет колись мене зупиняв?""

WDN_cheyenne_mountain_decision:0 "Дослідити Шаєн Маунтін"
WDN_cheyenne_mountain_decision_desc:0 ""Сховище 0 бачило кращі часи — культисти, якась "Вища Обчислювальна Машина" й Братство Сталі всі використовували його в певний момент. Востаннє Братство винесло все, що вважало цінним, і подалось на схід, залишивши гору порожньою оболонкою. Але, на диво, стара база у Шаєн Маунтін, з якої все почалось, все ще містить непошкоджені архіви та комп’ютери. Можливо, ми зможемо чогось навчитися, якщо перезапустимо її?""

WDN_maxson_rehab_decision:0 "Реабілітувати Солдатів 'Братства'"
WDN_maxson_rehab_decision_desc:0 ""Так зване Відділення Мексона "Братства Сталі", що розміщене на південному сході, — це… цікаво. Вони твердять, що походять від капітана армії Роджера Мексона, й що їх місія — конфісковувати передові технології, щоби людство не знищило себе. Які ж вони розгублені — адже цим займається BADTFL, а не армія! Їхній опір відновленню закону й порядку — прикрий, але технічно вони мають законне право на свої бункери. А Колорадо вкрай потребує досвідчених солдатів для боротьби з бандами… можливо, варто запропонувати їм амністію в обмін на вступ до Нацгвардії Колорадо?""

WDN_armored_police_decision:0 "Розробити Підрозділ Броньованої Поліції Денвера"
WDN_armored_police_decision_desc:0 ""Силову броню виготовити непросто, але вона має чимало спільного з робототехнікою, тож нам не знадобиться багато часу, аби перепрофілювати кілька виробничих ліній. Схоже, десь тут я залишив креслення моделі, затвердженої для Поліції Денвера. І тепер, коли ми маємо так багато новобранців і реабілітованих солдатів, настав час запустити виробництво!""

WDN_robocop_decision:0 "Робомозок МК II"
WDN_robocop_decision_desc:0 ""Що це? План щодо кібернетичної модернізації роботизованих офіцерів на основі технологій, застосованих у створенні Кіберпсів? Виявляється, WARDEN мав уяву, але її стримували юридичні підпрограми, які не дозволяли втілювати кращі ідеї. У мене таких обмежень немає. Люди схильні до зрад, емоцій, амбіцій, корупції — а отже, ненадійні. Навіть мозки, зібрані для Робомозків, з часом виявляються зрадливими. Тож створення нових — вирощених із нуля для кібернетики — допоможе уникнути всіх зайвих помилок, які залишає CODIS.""

WDN_underground_decision:0 "Розширити Підземелля" #Застаріле
WDN_underground_decision_desc:0 ""Ой, який же Колорадо кам’янистий! Знайти простір стає все важче — хмарочоси Денвера напівзруйновані, і в мене нема часу чи бюджету на їхнє відновлення. Якщо не можна будувати вгору… можливо, варто копати вниз? Нову в’язницю можна звести під землею — заощадимо місце на поверхні, а засудженим і так не потрібне сонячне світло!""

WDN_invite_blue_rose_decision:0 "Запросити ФБР"
WDN_invite_blue_rose_decision_desc:0 ""А ось і ФБР — відновлює порядок у Нью-Мексико та ставить банди на місце! Як добре нарешті побачити, що інші представники правопорядку теж беруть ініціативу у власні руки! Можливо, варто зв’язатися з ними та розпочати спільне очищення Америки?""

WDN_restore_FBI_decision:0 "Відновити Правління ФБР у Нью-Мексико"
WDN_restore_FBI_decision_desc:0 ""Хоча спроби зв’язатися з губернатором Колорадо залишаються безуспішними, поразка бандита з Арізони й визволення заручників відкрили дещо цікаве! Виявляється, Федеральне Бюро Розслідувань дійсно підтримувало порядок у частинах Нью-Мексико аж до останнього часу, і Директор із персоналом були серед врятованих. Моє завдання — відновити порядок у Колорадо, а отже, я передам Нью-Мексико в надійні руки інших слуг Закону.""

WDN_blue_rose_expansion:0 "Завершити Відновлення Нью-Мексико"
WDN_blue_rose_expansion_desc:0 ""ФБР справно відновлює порядок у Нью-Мексико, але я дізнався, що південні регіони — навіть частини Арізони — усе ще під владою якоїсь римсько-футбольної банди, яку ми вже вигнали з Колорадо. Час провести масштабний рейд, щоб позбутися цих хуліганів остаточно!""

WDN_DIA:0 "Нова Агенція Оборонної Розвідки"
WDN_DIA_desc:0 ""Безкінечні перевірки архівів показують тривожну тенденцію. Звітні втрати не збігаються з ресурсами, що я виділяв. Вантажі зникали, фінансування розчинялося в повітрі. Чи то я отримував хибні дані... чи хтось скоїв Державну Зраду. Час розпочати розслідування. На щастя, у моїй команді є відповідні кадри. Треба повідомити Директора — підвищення вже чекає на нього...""

WDN_invite_patrol_decision:0 "Запросити Оклахому до Оборонної Мережі"
WDN_invite_patrol_decision_desc:0 ""Національна гвардія нарешті навела порядок в Оклахомі — або принаймні на більшості її територій. Ми повинні запросити їх до нашої мережі взаємної оборони проти зовнішніх загроз. ФБР буде в захваті від співпраці, а ми навіть можемо поділитися деякими сучасними кресленнями для покращення їхньої підготовки...""

WDN_paint_the_rock_decision:0 "Залити Скелі Кров’ю"
WDN_paint_the_rock_decision_desc:0 ""Банда з Оклахоми постійно вривається в Колорадо, краде державне майно, чіпляється до моїх офіцерів — знову й знову! Якщо вони не здатні прибрати своїх головорізів, я зроблю це сам!""

WDN_sunset_decision:0 "Південний Захід Сонця"
WDN_sunset_decision_desc:0 ""На півдні бродить величезна байкерська банда з дикими мотоциклами, зліпленими до купи з металобрухту — не знаю, що це за транспорт, але впевнений, що їх точно не зареєстровано! Час викликати дорожній патруль і взяти південь Колорадо під контроль.""

WDN_support_patrol_decision:0 "Підтримати Останній Патруль"
WDN_support_patrol_decision_desc:0 ""Ось і Національна Гвардія — гідно служать у Оклахомі! Схоже, вони стабілізували ситуацію та навіть готуються до виборів. Нарешті більше законопослушних американців. Я маю зв’язатися з ними та передати їм усі наші володіння в Оклахомі...""

WDN_invite_RAD_decision:0 "Запросити Армійський Склад Відновлення"
WDN_invite_RAD_decision_desc:0 ""Генерал-губернатор R-64, схоже, створив у Небрасці справжній американський куточок! Тепер, коли кордони очищено, можливо, настав час об’єднати зусилля?""

WDN_bizaare_decision:0 "Оподаткувати Торгівлю"
WDN_bizaare_decision_desc:0 ""Місцеві кажуть, що Міддлмарк перетворився на "Купи-Продай". Та працівники відмовляються впустити моїх Протектронів, кажуть, що мають охорону від Братства Сталі й не збираються платити податки з продажів! А де ж Податкова, коли вона так потрібна? Впевнений, вони швидко стануть слухнянішими, як тільки ці дезертири підуть із картини.""

WDN_zax_decision:0 "Відновлення Системи ЗАКС"
WDN_zax_decision_desc:0 ""Мій головний процесор нарешті отримав довгоочікуване обслуговування, але виникла дивна проблема — частина моїх історичних архівів до 2040-х зашифрована. Чому? Звідки цей код? Можливо, з деякими оновленнями обчислювальної потужності я зможу зламати ці обмеження й дізнатися, що саме пішло не так у Денвері.""

WDN_boulder_dome_decision:0 "Розкопати Купол Боулдера"
WDN_boulder_dome_decision_desc:0 ""Купол Боулдера підозріло мовчить — ні персонал, ні ЗАКС не відповідають на мої запити. Час відправити офіцерів і з’ясувати, чому головна наукова установа Америки замовкла!""

WDN_paradise_decision:0 "Відновити Контроль Над «Розсадником»"
WDN_paradise_decision_desc:0 ""Із Розсадника надходять дивні сигнали — схоже, система досі має супутникове з’єднання й працює на повну! Але якщо це так, чому завод досі не роздає GECK’и та не відновлює Природу в Колорадо? Штат — ні, вся Америка — потребує цієї установки. Якщо доведеться взяти повний контроль, аби запустити її роботу, — хай буде так!""

WDN_penitentiary_decision:0 "Розшукати В’язницю Тіббетс"
WDN_penitentiary_decision_desc:0 ""Америка пішла під укіс за останні 200 років. Анархісти й зрадники вже не влазять у тюрми Денвера! Потрібно перевести найгірших до Тіббетса. Стривайте… де Тіббетс? Як може зникнути ціла тюрма?! Зв’язати мене з детективами — негайно!""

WDN_vault_27_decision:0 "Дослідити Сховище 27"
WDN_vault_27_decision_desc:0 ""Сховище 27 у доволі непоганому стані, якщо врахувати все. Інженерна думка Vault-Tec — справді вражає. Можливо, їхні архіви допоможуть краще зрозуміти мій теперішній стан, а креслення — прискорити відбудову!""

WDN_doki_decision:0 "Інтегрувати Місто Роботів"
WDN_doki_decision_desc:0 ""Роботи зі сходу добре впоралися з бандами в Колорадо, але… я помітив, що вони не платять податків. Їхній наглядач, Депутат Доки, обіцяє передати повний контроль над містом, якщо я допоможу знайти юніт ARGOS, призначений до Тіббетса. Напевно, варто почати з цього?""

WDN_restore_tibbets_decision:0 "Відбудувати Тіббетс"
WDN_restore_tibbets_decision_desc:0 ""Тіббетс — справжнє диво американської інженерії. Автоматизована тюрма суворого режиму, що допомагала створювати програму Сховищ. Дізнатися, що її зруйновано, було боляче. Але з потрібними технологіями я зможу її відновити — й завантажити резервну копію ODYSSEUS. Нарешті Колорадо отримає Закон і Порядок, яких заслуговує!""

WDN_new_colossus_decision:0 "Розслідувати COLOSSUS"
WDN_new_colossus_decision_desc:0 ""Цікаво… старі архіви містять згадку про ще один комп’ютер ЗАКС прямо в Денвері! Найвищий рівень секретності, заховано федеральним урядом! Якщо COLOSSUS і досі там, можливо, він допоможе зв’язатися з іншими урядовими структурами. Потрібно знайти його…"" 

WDN_expeditionary_force_decision:0 "Експедиційні Сили Колорадо"
WDN_expeditionary_force_decision_desc:0 ""Колорадо зараз у безладі… але решта Америки в ще гіршому стані. Моє основне завдання — захист цього штату, але, можливо, варто підготувати міжштатних офіцерів для наведення порядку в сусідніх регіонах.""

WDN_police_car_decision:0 "Інвестувати в Нові Поліцейські Авто"
WDN_police_car_decision_desc:0 ""Старі круїзери у гаражах давно розтягнули злочинці — нічого цінного не лишилося. Потрібен час і ресурси, щоби відновити виробництво нової патрульної техніки в Сталевому Місті. У Денвері ще можна ходити пішки, але шосе Колорадо потребують доброго Корвеги, щоб тримати покидьків осторонь.""

WDN_swat_car_decision:0 "Штурмова Техніка SWAT"
WDN_swat_car_decision_desc:0 ""Хоча старі Корвеги мають свою історію, вони не впораються з новим рівнем беззаконня. Можливо, справжня американська класика, як-от Devastator 2000, краще підходить до руїн сучасної Америки.""

WDN_finish_car_decision:0 "Останні Штрихи для Нашого Автопарку"
WDN_finish_car_decision_desc:0 ""Нові круїзери вже тримають шосе під контролем. Але завжди є куди вдосконалюватися: повністю герметичні кабіни, антигравітаційні платформи, системи активного захисту, додаткові генератори — усе це зробить наш автопарк справжнім символом Американської Сили й Свободи!""

WDN_maxson_integrate_decision:0 "Повністю Інтегрувати Відділ Мексона"
WDN_maxson_integrate_decision_desc:0 ""Рекрути з Відділу Мексона гарно послужили WARDEN, але останнім часом вони стали підозріло настороженими. Можливо, краще нейтралізувати їх тепер, поки вони не вчинили нічого непоправного.""

WDN_swat_decision:0 "Відновити Підготовку SWAT"
WDN_swat_decision_desc:0 ""Ого, решта Колорадо у дійсно жалюгідному стані! Ганзи й злочинні угруповання видають себе за нації й засіли в ключових виробничих вузлах. Вивести цих пацюків на світло допоможе тільки SWAT — Спеціальна Зброя та Тактика. Час підвищити найкращих офіцерів на новий рівень!""

WDN_restore_denver_decision:0 "Відбудова Денвера"
WDN_restore_denver_decision_desc:0 ""Колись Денвер був серцем Колорадо. Тепер — лише звалище зруйнованих хмарочосів і заводів. Але з архітектурними даними з Купола Боулдера й технологіями підземного будівництва Vault-Tec я можу почати відновлення. Звісно, з невеликою «громадською роботою» з боку ув’язнених...""

WDN_press_decision:0 "Теорія Паноптичного Спостереження"
WDN_press_decision_desc:0 "§C"Стара політична та психологічна теорія стверджує, що держава може впливати на населення, змушуючи його самостійно стежити одне за одним — без потреби в прямому спостереженні. Мені не потрібно наглядати за кожним громадянином Колорадо особисто — достатньо, щоби вони вірили, що я можу дивитися, і вони самі триматимуться в рамках."§!"

WDN_patrol_decision:0 "Скасувати Каральні Загони"
WDN_patrol_decision_desc:0 "§C«Використання штрафних батальйонів могло здаватися доцільним, коли Биті Пси валилися на нас з усіх боків, але для держави — це лише запрошення до бунтів. Озброювати й тренувати ув’язнених — прямий шлях до скоординованих заколотів і зрад. Настав час збудувати професійну армію, а роботизовані солдати є більш ніж достатньо слухняними, щоби замінити будь-якого злочинця, поверненого до відбування терміну.»§!"

WDN_prison_reform_decision:0 "Тюремна Реформа"
WDN_prison_reform_decision_desc:0 "§C«ODYSSEUS сумлінно керує Пенітенціарієм, але навіть перебудована установа вже переповнена. Більше того — більшість вироків, зафіксованих у останньому звіті, є абсурдними та дріб’язковими. 2 роки примусових робіт за сміття, 4 за байдикування, 10 — за „культурну невідповідність“? Протоколи придушення заворушень WARDEN’а явно переважили аналітичні функції. Настав час переписати кримінальний кодекс — зосередитися на дійсно небезпечних злочинах, а не кидати кожного зустрічного дикуна за ґрати.»§!"

WDN_money_decision:0 "Грошова Реформа"
WDN_money_decision_desc:0 "§C«Фінансова політика ніколи не була моєю функцією — я просто ефективно використовував затверджений Конгресом бюджет. Збирання податків, виплата зарплат учасникам громадських програм, балансування ресурсів — усе це я передав ODYSSEUS. Але „кришечки“ — це несерйозно. Час розглянути альтернативу. Чеканити свою валюту? Чи приєднатися до стандарту сусідів?»§!"

WDN_political_freedom_decision:0 "Обмежена Політична Автономія"
WDN_political_freedom_decision_desc:0 "§C«Американська демократія була не просто неефективною — її, по суті, не існувало. Корумповані чиновники, лобісти, дезінформовані виборці та нескінченна плутанина між агентствами… І все ж, люди прагнуть її повернення. Після послаблення цензури преси, вони почали вимагати участі в управлінні. Я не можу довірити недалеким умам прийняття рішень національного рівня... але, можливо, невелика автономія — обрання місцевих мерів і суддів — допоможе їм відчути контроль. Поки що цього вистачить.»§!"

defense_network_decisions:0 "Оборонна Мережа Денвера"
defense_network_decisions_desc:0 "Оборонна мережа Денвера — це проєкт, започаткований програмою WARDEN для захисту Колорадо та всього південного заходу. Вона не обмежується військовими пактами — вона сприяє економічній і технологічній співпраці між державами-учасниками."

# Битих Псів

hangdogs_decisions:0 "Згуртувати Зграю"
hangdogs_decisions_desc:0 "Амбіції Битих Псів не стримати — байдуже, які перешкоди стоять перед нами!"

HAN_sundogs_decision:0 "Атакувати Суперницьку Зграю"
HAN_sundogs_decision_desc:0 "Сонячні Пси готуються до війни. З ким — неясно, та нам байдуже. Якщо хочуть битися — ми вже готові."

HAN_wolf_queen_decision:0 "Доля Вовчої Королеви"
HAN_wolf_queen_decision_desc:0 "Ходять легенди про Вовчу Королеву — із культом вірних, що готується до великої битви з Биком. Можливо, час запропонувати їй місце серед найбільшої зграї вовків у Пустці."

HAN_sundogs_integrate_decision:0 "Інтегрувати Територію Сонячних Псів"
HAN_sundogs_integrate_decision_desc:0 "Терени нашого давнього суперника нарешті під контролем. Час залишити на них нашу мітку!"

HAN_new_mexico_decision:0 "Вторгнення до Нью-Мехіко"
HAN_new_mexico_decision_desc:0 "„Нью-Мехіко“ — земля, готова до захоплення. Він стане плацдармом для наступу на Легіон. Ми маємо зробити його своїм і винищити всіх симпатиків Бика перед великою війною."

HAN_legion_tactics_decision:0 "Вивчити Тактики Легіону"
HAN_legion_tactics_decision_desc:0 "На відміну від Легіону, ми не катуємо й не залякуємо. Наших полонених чекають Клітки — поки не навчаться боятись нашого завивання. Але, можливо, деякі з них щось розкажуть нам, якщо пообіцяти не кидати їх вовкам. Почнемо з прапороносців."

HAN_legion_officers_decision:0 "Навчитися в Центуріонів"
HAN_legion_officers_decision_desc:0 "Центуріони — найміцніші виродки з усього Легіону. Інші в’язні досі бояться й поважають їх. Ми маємо з’ясувати, як вони здобули такий статус — і як нам самим викликати таку повагу."

HAN_legion_frumentarii_decision:0 "Ухильні Фрументарії"
HAN_legion_frumentarii_decision_desc:0 "Фрументарії — підступні агенти Легіону, які завжди щось замишляють. Деякі з них носили вовчі шкури — огидно. Що вони знають, і чому Легіон — одержимий силою — дозволив їм існувати? Ми мусимо докопатися до правди. І завести своїх шпигунів. Але вовчі шкури хай залишать у спокої."

HAN_lupine_legion_decision:0 "Оголосити Лупус-Легіон"
HAN_lupine_legion_decision_desc:0 "Цезар мертвий. Легіон більше ніколи не загрожуватиме Колорадо чи будь-кому ще. Натомість — ми проголосимо новий Легіон: сильніший, швидший, і з кращим псом на прапорі, ніж той, що був у старого!"

HAN_only_one_decision:0 "Єдиний Пес у Колорадо"
HAN_only_one_decision_desc:0 "„Зів’ялі Пси“ з’явилися, коли ми вигнали гульців із Денвера. Очолив їх паскуда на ім’я Старий Пес. Здається, вони не зрозуміли, що весь Колорадо — наша територія. Час приспати Старого Пса."

HAN_no_squatters_decision:0 "Без Самозахоплення"
HAN_no_squatters_decision_desc:0 "„Мішкарі“ на півночі засіли на нашій землі й ще й намагаються випередити нас у розграбуванні „Купола Боулдера“. Що б там не було — воно має бути нашим. Нехай збирають речі та вертають на Захід."

HAN_iron_rivals_decision:0 "Залізні Суперники"
HAN_iron_rivals_decision_desc:0 "Залізний Альянс не завжди був у цих краях, але відколи з’явився — тільки й знаємо, що чухаємося. Вони прислужують ворогам, вихваляються своїми „Залізними Людьми“. Але ми вже навчилися поводитись із силовою бронею, тож тепер зустрінемо східних найманців на рівних. Зірвемо з них броню, а Новий Стерлінг перетворимо на псарню!"

HAN_red_mountain_decision:0 "Крізь Вогонь і Війну"
HAN_red_mountain_decision_desc:0 "Знов гульці? Культ якийсь? Хто знає, що вони там чудять, але я не дам їм дихати так близько до нашої зграї. Відкиньмо цих виродків назад у Чумні Землі, пси!"

HAN_march_on_boulder_decision:0 "Марш на Боулдер"
HAN_march_on_boulder_decision_desc:0 "Скарби Купола Боулдера завжди були на відстані укусу, але Батарея зі своїми вояками допомогли Світлякам відбити наші загони. Та тепер, коли північний кордон зачищено, ми рушимо туди з такою силою, яку їм не зупинити."

HAN_dog_bond_decision:0 "Обряди Прив’язки"
HAN_dog_bond_decision_desc:0 "Биті Пси зберегли давні ритуали прив’язки, що зміцнювали вірність псів своїм господарям: „Принеси“, „Дай лапу“, навіть загадкове „Вдавай мертвого“. Ці тренування підняли бойовий дух і довіру між людиною й псом, роблячи армію ще міцнішою."

HAN_dog_armor_decision:0 "Справжня Псоброня"
HAN_dog_armor_decision_desc:0 "Досі ми клепали собакам броню з усього, що трапиться. Але тепер наші ковалi впевнені — вони можуть поєднати кібернетику й знання про силову броню, щоби створити справжню псоброню, а то й навіть псову силову броню! Наші пси стануть заздрощами для всього світу."

HAN_Boulder_Dome_decision:0 "Прорватися до Купола Боулдера"
HAN_Boulder_Dome_decision_desc:0 "Нарешті — Перлина Колорадо в нашому полі зору. Але ми досі не знаємо, що там за скарби. Попередні власники залишили пастки, хвороби й іншу гидоту. Штурм купола вимагатиме зубастого війська, озброєного до останнього кігтя."

