# ideas
wdn_bizaare_market:0 "Buy Some Trades"
wdn_bizaare_market_desc:0 "Компанія Buy Some Trades, заснована родиною Фрідманів у 2199 році, не лише приносить товари до решток Колорадо, Канзасу та Плюгавих земель, а й оминає шляхи Річкового Союзу та Братерства Середнього Заходу. Вони навіть пропонують послуги від встановлення парканів до сівозміни. Надія — там, де є Buy Some Trades."

wdn_power:0 "Мережева Потужність WARDEN"
wdn_power_desc:0 "§MОперації WARDEN§!\n[WDN.wdn_the_nursery_control_facility_scripted_localization]\n\n"

wdn_riot_control_idea:0 "Підготовка до придушення заколотів"
wdn_riot_control_idea_desc:0 ""Новий випуск Академії вже готовий — і кожен курсант вийде на вулиці, щоби приборкати будь-яке угрупування чи банду, що зазіхає на безпеку добропорядних громадян Колорадо!""

wdn_brotherhood_recruits:0 "Рекрути Братерства"
wdn_brotherhood_recruits_desc:0 ""Після невеличкої «перепідготовки» щодо їх місця в державній ієрархії, солдати з бункерів знову стали частиною Національної гвардії Колорадо! Ну, принаймні ті, що не кричали про моє знищення.""

wdn_police_state_idea:0 "Поліцейська Держава"
wdn_police_state_idea_desc:0 ""Колорадо стає безпечнішим щодня, коли вулицями ходить улюблений WARDEN! Хоча... чомусь люди не особливо раді мене бачити. Невже вони забули, яке затишшя приносить довга рука закону?""

wdn_tibbets_idea:0 "В'язниця Тіббетс"
wdn_tibbets_idea_desc:0 ""Офіційно знову відкрита — і під керівництвом суміші старих і нових облич!""

wdn_new_colossus_idea_1:0 "Новий COLOSSUS"
wdn_new_colossus_idea_1_desc:0 ""Перепрограмування себе у WARDEN було слушним рішенням, але Колорадо вже під контролем, і громадяни знову дотримуються закону. Щоб відновити порядок у світі, потрібен хтось, здатний до змін і навчання. Світ потребує COLOSSUS.""

wdn_new_colossus_idea_2:0 "Новий COLOSSUS"
wdn_new_colossus_idea_2_desc:0 ""Перепрограмування себе у WARDEN було слушним рішенням, але Колорадо вже під контролем, і громадяни знову дотримуються закону. Щоб відновити порядок у світі, потрібен хтось, здатний до змін і навчання. Світ потребує COLOSSUS.""

wdn_new_colossus_idea_3:0 "Новий COLOSSUS"
wdn_new_colossus_idea_3_desc:0 ""Перепрограмування себе у WARDEN було слушним рішенням, але Колорадо вже під контролем, і громадяни знову дотримуються закону. Щоб відновити порядок у світі, потрібен хтось, здатний до змін і навчання. Світ потребує COLOSSUS.""

wdn_new_colossus_idea_4:0 "Новий COLOSSUS"
wdn_new_colossus_idea_4_desc:0 ""Перепрограмування себе у WARDEN було слушним рішенням, але Колорадо вже під контролем, і громадяни знову дотримуються закону. Щоб відновити порядок у світі, потрібен хтось, здатний до змін і навчання. Світ потребує COLOSSUS.""

wdn_new_colossus_idea_5:0 "Новий COLOSSUS"
wdn_new_colossus_idea_5_desc:0 ""Перепрограмування себе у WARDEN було слушним рішенням, але Колорадо вже під контролем, і громадяни знову дотримуються закону. Щоб відновити порядок у світі, потрібен хтось, здатний до змін і навчання. Світ потребує COLOSSUS.""

wdn_servitor_idea:0 "Новий COLOSSUS"
wdn_servitor_idea_desc:0 ""Керувати населенням було непросто, але ніхто не скаже, що я не здатен до змін. Репресивні методи США перед війною були неефективними, створеними з ілюзії правильності. Але добру руку не кусають — і тепер люди Колорадо приймають мій захист із відкритими обіймами, а не спротивом.""

wdn_expeditionary_force:0 "Експедиційні Сили Колорадо"
wdn_expeditionary_force_desc:0 ""Національна Гвардія Денвера пройшла спеціальну підготовку для розгортання за межами Колорадо, несучи закон і порядок решті Америки.""

wdn_robocops:0 "Біонічні Офіцери"
wdn_robocops_desc:0 ""Оснащені найновішими органічно-обчислювальними процесорами, розробленими найкращими умами Америки у Куполі Боулдера, офіцери нового покоління здатні адаптуватися до будь-яких ситуацій на полі бою та обробляти складні дані без звичних проблем людського мозку.""

wdn_surveillance_state:0 "§CДержава Спостереження§!"
wdn_surveillance_state_desc:0 "§C\"Постійний нагляд за громадянами й припинення розповсюдження підбурливих матеріалів — критично важливо для запобігання небезпечним заколотам і злочинним угрупованням!\"§!"

wdn_panopticon:0 "§CПаноптична Держава§!"
wdn_panopticon_desc:0 "§C\"Відкритий нагляд лише нагадує громадянам про їхній статус і сіє недовіру. WARDEN надто покладається на камери та цензуру — речі, що викликають лише роздратування. Краще — перетворити саме суспільство на спостерігача, змусити його стежити за собою. Я вирощу нове мислення, змушу людей внутрішньо прийняти спостереження, допоки вони не почнуть регулювати себе — й одне одного. Пиши що хочеш, волай і говори від серця — але пам’ятай: усе це врешті потрапить до COLOSSUS.\"§!"

