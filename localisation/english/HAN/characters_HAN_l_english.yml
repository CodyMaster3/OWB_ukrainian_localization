l_english:
HAN_crbs:0 "§CЦРП-П§!"
HAN_crbs_desc:0 "§C«ЦРП-П – один з небагатьох елітних прототипів роботизованих псів, розроблений для Департаменту поліції Денвера з метою приборкання заворушень до Великої війни. Зараз у Денвері й так вистачає звичайних собак, але ЦРП-П досить розумний, щоб очолювати цілі зграї, ніби він сам з них. Хороший пес. І такий вірний...»§!"

HAN_Kennelmaster:0 "§GПсар Джемісон§!"
HAN_Kennelmaster_desc:0 "§G«Навіть із безмежною розбудовою навколо Міста Псів завжди буде потреба у ще більшій кількості будівель.»§!"

HAN_medicine:0 "§GМарія Ґрін§!"
HAN_medicine_desc:0 "§G«Спалах Нової Чуми та численні індустріальні негаразди залишили несподівані запаси медичних препаратів у Денвері. Їжі було мало до війни і після неї, зате вакцин і ліків – хоч відбавляй. Майже 200 років по тому, зменшене населення та величезна кількість медичних текстів зробили землі Битих Псів одним із найздоровіших місць у Пустці.»§!"

HAN_foreman:0 "§GБригадир Кокс§!"
HAN_foreman_desc:0 "§G«Заряди встановлено, це завал розчистимо за годину.»§!"

HAN_touchdown:0 "§GТачдаун§!"
HAN_touchdown_desc:0 "§G«Походячи з родини, що колись очолювала справжню імперію рейдерів, вона взялася за безпечніший вид здирництва. Контролюючи більшість промислових робіт і житла в нижніх рівнях Міста Псів, Тачдаун лише спостерігає за капсами, що течуть, і мастить колеса де треба.»§!"

HAN_mobius:0 "§CЕкономічний Обчислювач 'Мобіус'§!"
HAN_mobius_desc:0 "§C«Експериментальна обчислювальна система, створена для розподілу продуктів у останні дні Ресурсних воєн. Колись вважалась недолугою й переобтяженою функціями, але при правильному використанні може направити розподіл ресурсів.»§!"

HAN_henson:0 "§YБрайс Генсон§!"
HAN_henson_desc:0 "§Y«Деякі відлюдники з Битих Псів сприймають своє поклоніння тваринам надто серйозно. Тотеми, обряди, дивні звички... Але Генсон перевершив усіх. Їсть лише собачий корм і залишки, що кидає своїм бойовим псам. Каже, він не кращий за звірів, з якими воює. Мерзенне видовище, та його зграя ще ніколи не голодувала.»§!"

HAN_booth:0 "§YЧедвік Бут§!"
HAN_booth_desc:0 "§Y«Коли ми припинили набіги – втратили хватку. Колись Биті Пси були лихом Колорадо. Гулі півночі й фальшиві пси півдня мали б здригатись. Покажи мені, що в тебе ще залишився укус.»§!"

HAN_rex:0 "§GРекс§!"
HAN_rex_desc:0 "§G«По-перше – ненавидить пацюків. Терпіти їх не може. Гігантські, кротопацюки – без різниці. Відчує запах – і вже мчить за ними. Зазвичай слухняний, але якщо побачить пацюка – готуйся бігти за ним. По-друге – не терпить капелюхів. І тих, хто їх носить. Не питай чому. Може, бо слово “капелюх” римується з “пацюк”?»§!"

HAN_caravan:0 "§GКараванник Бірн§!"
HAN_caravan_desc:0 "§G«Торгівля – це життя у Пустці. У той час як багатії заходу хочуть тільки жити товстим життям, Бірн бачить у торгівлі стратегію. Контролюючи потік ресурсів, новин і людей – для нього це лише шахова партія, розміром із Пустку.»§!"

HAN_munch:0 "§CОбчислювач Computechtron§!"
HAN_munch_desc:0 "§C«Спочатку створений для розшифровки людського геному, цей процесор тепер намагається розгадати таємниці довоєнної науки.»§!"

HAN_bomb:0 "§CСистема 'Старгейзер' компанії Lockreed§!"
HAN_bomb_desc:0 "§C«Більшість супутників давно впала з орбіти, але частина супутникової мережі Lockreed ще мерехтить на небі. Стара філія в Денвері має обладнання для зв'язку. Лиш потрібно правильний пароль... і нові цілі.»§!"

HAN_bomber_trait:0 "Стратегічне знищення"

HAN_doc:0 "§GДоктор Андерсон§!"
HAN_doc_desc:0 "§G«Краще прикуси щось... Буде боляче.»§!"

settler_physician:0 "Поселенський лікар"

HAN_network:0 "§CОб'єднана Технологічна Мережа§!"
HAN_network_desc:0 "§C«Проєкт ACME для створення нейромережі, що адаптується самостійно, і керує військами в режимі реального часу. Не встигли перевірити її до війни – тож Пустка стане полем випробувань!»§!"

HAN_howler:0 "§YВиючий§!"
HAN_howler_desc:0 "§Y«Більшість племінних і рейдерських елементів було витіснено з Битих Псів, але деякі лишилися. Власник охоронної фірми за межами Міста Псів, Виючий відмовляється від звичайного імені. Прізвисько, яке дала йому зграя, важить більше, ніж будь-яка 'нормальність'.»§!"

HAN_powergrid:0 "§CМережа живлення GDA§!"
HAN_powergrid_desc:0 "§C«Здіймаючись над рівнинами, вітряки без контексту здаються ідолами забутої культури. Але з належним наглядом їхні лопаті обертатимуться, й електрика потече Пусткою.»§!"

HAN_plains:0 "§YПровідник Рівнин Адонай§!"
HAN_plains_desc:0 "§Y«І до війни Колорадо не славився інфраструктурою, а тепер і зовсім мало що лишилось. Переходячи величезні відстані в пошуках їжі та припасів, Рівнинники – одне з останніх племен, що ще не поглинуті Битими Псами. Під проводом Адоная вони виконують волю Оголеного Ікла і тримаються рівнин.»§!"

HAN_bodhi:0 "§YБодгі з Касл-Року§!"
HAN_bodhi_desc:0 "§Y«Багато хто вважає Битих Псів лише диким плем'ям, але Бодгі – інше обличчя зграї. Як Мати Клану, вона дбає про молодих, прагне виховати їх сильними й вірними своїм побратимам. Вона – серце Міста Псів.»§!"

HAN_dome:0 "§CКупол Оборони Ґрін №54§!"
HAN_dome_desc:0 "§C«Довоєнна лабораторія, присвячена вдосконаленню лазерного обладнання для практичного застосування. Коли впали бомби, аварійні гермозатвори зачинилися, замкнувши вчених усередині. З правильними кодами доступу ці потужні потужності можна використати на повну.»§!"

HAN_radcliff:0 "§YАрмонд Редкліф§!"
HAN_radcliff_desc:0 "§Y«Справжній колишній рейдер, Армонд знає, як посіяти страх – як серед здобичі, так і серед підлеглих, які ставлять під сумнів накази.»§!"

HAN_asterion:0 "§CІнформаційна Система Астеріон§!"
HAN_asterion_desc:0 "§C«Коли по довоєнному Денверу прокотилися масові бунти, Співдружність Чотирьох Штатів профінансувала створення системи для боротьби з голодними заворушеннями. Приховані, укріплені камери наглядають за вулицями Денвера, стежачи за кожним рухом у трупі Міста Псів.»§!"

HAN_grand_advisor:0 "§YСпостерігач Притоки§!"
HAN_grand_advisor_desc:0 "§Y«Притока Арканзасу слугує природним кордоном території Битих Псів. Завдяки торгівлі, їжі й захисту, які вона дає, дехто вважає її священною землею. Патрулюючи береги, вони бачать себе охоронцями цього дару природи для свого племені.»§!"

HAN_BENRY:0 "§CПрикордонна Охоронна Одиниця БЕНРІ§!"
HAN_BENRY_desc:0 "§C«Будь ласка, пред’явіть паспорт для перевірки.»§!"

HAN_lupa:0 "§GЛупа Капітоліна§!"
HAN_lupa_desc:0 "§G«Може, Лупа й не в захваті від чергового переселення племені, але її завзяття у створенні армії псів, яка роздере Легіон, лишається непохитним. Місто Псів у Денвері – таке ж добре місце, як і будь-яке інше, щоб почати... знову.»§!"

HAN_madame_marshall_name:0 "Мадам Маршал"
HAN_officer_krupke_name:0 "Офіцер Крупке"
HAN_deputy_wood_name:0 "Заступник Вуд"
HAN_sheriff_truman_name:0 "Шериф Трумен"

HAN_modus_name:0 "MODUS"
