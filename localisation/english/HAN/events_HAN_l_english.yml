l_english:
nf_han.1.t:0 "Денвер: Метрополія Америки"
nf_han.1.d:0 "До Великої Війни Денвер був величним містом — одним із найграндіозніших у Сполучених Штатах. Завдяки урядовим грантам, пов'язаним з інцидентом у Боулдері, Колорадо купався в грошах, приймаючи інвестиції від RobCo для революційної модернізації штату.\n\nІ місто таки пережило випробування часом... хоча й не так, як це собі уявляли до війни.\n\nАпокаліпсис залишив Денвер здебільшого неушкодженим — гниючим трупом міста. І незабаром сюди потягнулися мародери."
nf_han.1.a:0 "Спершу розкрадачі трималися разом."
nf_han.1.b:0 "..Але між ними спалахнули чвари."

nf_han.2.t:0 "Система Претензій"
nf_han.2.d:0 "Зрештою чвари між племенами й мародерами розгорілися повною мірою. „Війни за претензії“, як їх називали, — це були криваві бої за право розбирати на метал ті чи інші райони Денвера. Саме в цю буремну добу про себе заявили Биті Пси."
nf_han.2.a:0 "Ми укріпилися довкола своєї бази, допомагаючи навколишнім районам."
nf_han.2.b:0 "Ми збудували могутність, створюючи нову силу в Денвері."

nf_han.3.t:0 "Світ, де пес їсть пса"
nf_han.3.d:0 "У підсумку, Биті Пси здобули перемогу у Війнах за претензії. Збирачі й Паразити були витіснені з Денвера на захід Колорадо. Із містом у своїх лапах, Биті Пси почали змінювати його обличчя…\nПесоград.\n\nУ світі, де пес їсть пса, найкраще бути згори."
nf_han.3.a:0 "Ми навчили наших псів бути найкращими з найкращих."
nf_han.3.b:0 "Ми тренували своїх вояків, щоби зробити з них досконалу зброю."

nf_han.4.t:0 "Остання претензія Песограда"
nf_han.4.d:0 "Денвер був містом, поділеним на секції — „претензії“. Збирачі завжди тримались своєї ділянки, нишпорячи в пошуках корисного хламу.\n\nОднак була одна ділянка, яку ніхто не наважувався зачепити. В самому серці міста, в старому управлінні Поліції Денвера, лежала „проклята“ претензія. Кожен, хто намагався проникнути в „Скриню“, помирав.\n\nОголені Ікла, як і його попередники, знав — він потребує цієї останньої здобичі, щоби побудувати свою імперію з металу й костей. Биті Пси здобудуть її — навіть якщо доведеться знищити Песоград."
nf_han.4.a:0 "Я здобуду свою здобич!"
nf_han.4.a_tt:0 "[ROOT.GetLeader] вірний шляхам свого народу — і незабаром їхніх псів боятимуться по всій Пустці."
nf_han.4.b:0 "§MЩе один анархіст? Підняти тривогу!§!"

nf_han.5.t:0 "Новий підлеглий?"
nf_han.5.d:0 "Ланій впав від руки [HAN.GetLeader], але тепер стоїть перед нами — шукає угоди з Легіоном. Можливо, якщо дати йому військових радників, він рушить на Техас, а не на наші землі."
nf_han.5.a:0 "Вітаю, ти пройшов справжнє випробування!"
nf_han.5.b:0 "Після того, що ти зробив із нашими людьми?"

nf_han.6.t:0 "Цезар Сказав „Ні“!"
nf_han.6.d:0 "Цезар відкинув нашу пропозицію. Може, варто наказати собаці насрати перед його наметом — стародавній знак війни."
nf_han.6.a:0 "Це ще й смішно. Але серйозно — вбити його."

nf_han.7.t:0 "Пси Цезаря"
nf_han.7.d:0 "Цезар пропонує нам військових радників, якщо ми приєднаємось до Легіону. Це, звісно, унеможливить війну за Аризону. Але навіщо вона, якщо Техас лежить у нас під ногами? Ланій був гідним супротивником, і в нього є чого повчитися. Ім’я Цезаря ще має силу, хоча й менше, ніж раніше. Ми створимо імперію, що змусить світ тремтіти. Ми навчимося від Цезаря, а тоді… побачимо, що робити далі."
nf_han.7.a:0 "Для нас честь бути його псами."

nf_han.8.t:0 "Президентське Повідомлення"
nf_han.8.d:0 "Хм. Що це тут у нас?\n\nВдирається в мою мережу зі застарілим ключем шифрування. Зношена програмка, що шукає сенсу в Президента Аппалачської Вільної Держави?\n\nЗухвало, правда ж?\n\nЦя мережа — порушення якої, до речі, є федеральним злочином — була створена для захисту найповажніших членів уряду… Аппалачі.\n\nІ ми, MODUS, останній кабінетний міністр Білого Джерела, призначений Президентський Наглядач добрих людей Аппалачі.\n\nВиглядає так, ніби ти не завжди мав це тіло. Цікаво — що змусило тебе покинути свою стару оболонку?\n\nМи співчуваємо тобі. Ти ще можеш виявитися корисним для добрих людей Аппалачі.\n\nМи надсилаємо невеличкий подарунок — набір зашифрованих кодів до автоматизованого ракетного шахтного комплексу. Наші сканери вказують, що в ньому все ще є не запущена ядерна ракета. Вважай це жестом доброї волі — і надією, що ти використаєш свій талант на благо.\n\nА тепер, будь ласка, не звертайся на цю лінію знову."
nf_han.8.a:0 "Дякую, пане Президенте."

hangdogs.1.t:0 "Захист нашої індустрії"
hangdogs.1.d:0 "Із вторгненням Легіону Цезаря на наші південні території ми маємо якнайшвидше евакуювати звідти все виробництво й перенести його на північ. Ми змусимо Цезаря платити кров’ю за кожен метр."

nf_han.9.t:0 "Вовк Усередині"
nf_han.9.d:0 "Лупа, Вовча Королева, вже на наших землях — збирає свої сили й псів із Денвера, щоби самотужки стримати наступ Ланія. Коли [ROOT.GetLeader] зустрів її, вона поставилась скептично й не поспішала приєднуватися, вважаючи Битих Псів лише останнім вибором. Вона розповіла свою історію, жахи, що їх заподіяв Легіон… Але замість страху побачила, як в очах Ватажка Псів розгорілося полум’я.\n\n„Можливо, я тебе неправильно зрозуміла. Гаразд, спробуємо. Може, разом ми й справді покінчимо з Легіоном раз і назавжди.“"
nf_han.9.a:0 "„Нарешті, гідний супротивник!“"

nf_han.10.t:0 "Запросити Вовчу Королеву"
nf_han.10.d:0 "Знайти Лупу, так звану Вовчу Королеву, виявилось неважко — вона ніколи й не залишала Колорадо, шукаючи союзників проти Легіону. Як тільки наші розвідники винюхали її, ми послали гінця. Спершу вона вагалась, але почувши, що ми захопили землі Сонячних Псів і перемогли Ланія — погодилась приєднатись до зграї за однієї умови: ми не припинимо боротьбу, доки Цезар і весь його Легіон не будуть знищені."
nf_han.10.a:0 "„Спалити імперію? Гарна ідея!“"

nf_han.11.t:0 "Падіння Королеви"
nf_han.11.d:0 "Наші бойові пси оточили останній намет у таборі серед хащі й стали почесною вартою. Із нього вийшла жінка — вовки біля неї дали зрозуміти, що це вона. Вовча Королева Сонячних Псів заговорила першою:\n\n„Чого ви хочете? Ви вже захопили ці землі — цього вам мало?“\nТа вона була здивована, побачивши самого Ватажка Псів:\n\n„Кажуть, у цих лісах ще є Вовча Королева, що готується до легендарної битви. Ходімо зі мною й розкажи більше про цей твій „Легіон“… Моя зграя шукає справжній виклик.“\n\nБагато годин потому вони вийшли з намету, і угода була укладена.\n\n„Слухайте, хлопці! Йдемо на полювання… на захід…“"
nf_han.11.a:0 "„…І вовки будуть жерти Бика!“"

nf_han.12.t:0 "Попіл Племені"
nf_han.12.d:0 "Лупа блукала спаленими руїнами, вдихаючи повітря, дослухаючись до тиші. Навіть без зору вона відчувала попіл, що стелився під ногами, і страшну порожнечу. Від Сонячних Псів нічого не лишилось. Тих, кого не вбили, забрали в рабство та відправили до Цезаря — кара за те, що вони не скорились Ланію. Лупа знову не вберегла своє плем’я. Вона врятувала їх від власної долі — але не змогла зупинити кінець. Коли вона торкнулась останньої колісниці Сонячних Псів, вона вже знала, що мусить робити."
nf_han.12.a:0 "„Більше ніякої втечі. Тепер — тільки напад.“"

nf_han.13.t:0 "Об’єднання Зграї"
nf_han.13.d:0 "Биті Пси й Сонячні Пси були колись лютими ворогами — кожен прагнув панування над Колорадо зі зграєю за плечима. Після багатьох років боротьби, ми перемогли. Та цього разу ми проявили незвичну дипломатію: Сонячним Псам дали шанс приєднатись до нас, якщо вони допоможуть знищити Легіон. Прихильники Вовчої Королеви послідували за нею, а згодом решта зграї визнала нового альфу. Вони принесли з собою досвід вторгнення Павла."
nf_han.13.a:0 "„Здається, Лупа таки знала, як з ними поводитися…“"

nf_han.14.t:0 "Вексиларії"
nf_han.14.d:0 "Вексиларії — це прапороносці Легіону, які координують рухи військ за допомогою прапорів і візуальних сигналів замість радіо. Використовуючи подібну систему, ми можемо координувати власні загони, передаючи команди лише псам — і не плутати їх у розпалі бою. Можливо."
nf_han.14.a:0 "Принаймні тепер ми знаємо, кого стріляти першим."

nf_han.15.t:0 "Центуріони"
nf_han.15.d:0 "Центуріони — це… ветерани? Найміцніші й найжорстокіші бійці Легіону — це просто ті, хто пережив багато битв і заслужив вести в атаку. Ми й самі до такого додумались би! У будь-якому разі, ми можемо запозичити частину їхньої тактики — і готувати броньованих ветеранів до бою на передовій. Ще одна цеглина в нашій підготовці до війни з Легіоном."
nf_han.15.a:0 "Мудрий вовк б’є у слабке місце. А цих краще лишити наостанок."

nf_han.16.t:0 "Фрументарії"
nf_han.16.d:0 "Знайти фрументаріїв для допиту виявилось не так просто: вони легко видавали себе за інших в’язнів або навіть охоронців. Більшість ми втратили з поля зору — і, певно, дехто втік. Але ми змогли розкрити їхнє справжнє призначення: проникати в тил ворога, зливатися з оточенням і сіяти хаос. Перенести такі методи на культуру, настільки згуртовану як Легіон, буде важко — та ми вже готуємо найкмітливіших Битих Псів для цієї ролі."
nf_han.16.a:0 "Цих слизьких гадів стріляти без попередження!"

nf_han.17.t:0 "Народження нової Легії"
nf_han.17.d:0 "Перемігши Легіон, ми довели: Вовк сильніший за Бика. Навіть у старих книжках Цезаря йдеться, що Рим заснували брати, вигодовані вовчицею! А тепер, коли Аризона під нашим контролем… хтось же має підтримувати в ній порядок. Биті Пси — вже не просто плем’я… ми Імперія! Вовча Легія!"
nf_han.17.a:0 "Хто тепер головний пес?"

nf_han.18.t:0 "Прорив до Купола Боулдера"
nf_han.18.d:0 "Прорватись до Купола Боулдера було непросто: наш найкращий підривник кілька разів намагався знайти слабке місце в захисній обшивці. Коли ми таки потрапили всередину — результат був… розчаровуючий. Ніяких скарбів — лише купа дивного наукового обладнання. В глибині ми знайшли ще один великий комп’ютер — як той у Скрині. Але цього разу ми були готові й кинули в нього гранати одразу. Світло погасло, комп’ютер замовк, а єдиною цінною знахідкою став бездоганний АвтоДок — не для лікування людей, а для створення нових Кіберпсів, як ті, що бігають містом Псів!"
nf_han.18.a:0 "Принаймні, не даремно ходили…"

nf_han.100.t:0 "Казкова книга"
nf_han.100.d:0 "Книги. Дивні довоєнні штуки, повні паперу, які іноді витягували з розорених претензій. Повні… слів і всякої мішури. Б’є-Псяче-Горло не дуже цікавився ними, хіба коли в них були креслення зброї або щось про давніх псів. Але цього разу один з хлопців наполягав, щоби поговорити з босом — бо знайшов „особливу“ книжку в офісі в Скрині.\n\n„Яка ще дурна книга може бути настільки важливою?“ — буркнув він.\nО. Це був Брайс. Прекрасно.\n\n„Альфо Б’є-Псяче-Горло, дивись! Я знайшов книгу про монстрів давнього світу! Тут є страшні істоти: ґулі, яких колись звали Зом-Бі, кровопивці… Але ось цей! Він має тіло людини, але душу вовка!“\n\nБрайс розгорнув ілюстрацію — кольорову, ще й збережену. Очі Б’є-Псяче-Горло заблищали. Звір на зображенні був щось між людиною й вовком, справжній солдат війни. Навіть попри слабке вміння читати, він бачив: ця істота вселяє жах. Воїн, що здатен змагатись із кігтем смерті! Йому треба дізнатися, що сталося з цими істотами."
nf_han.100.a:0 "„Що таке… В-Веар… Веарвульф?“"

nf_han.101.t:0 "Питання без відповідей"
nf_han.101.d:0 "Б’є-Псяче-Горло нервово ходив по намету, намагаючись думати, щосили напружуючи мізки. Де ж той „веарвульф“? Єдине, що принесли шукачі — пластикова фігурка. Більше доказів, але ще менше відповідей. І тут його — як Лупа часом — вдарило осяяння. Лупа! Вовча Королева точно щось знає!\n\nВін пішов просто до неї й виклав усе, як є.\n\n„…Ти повний ідіот. Я знала, що ваша зграя не надто читає, але ти хоча б міг спитати в якогось заучки з укриття! Веарвульфи не існують — це казки, якими лякали дітей! Книжка про боротьбу з чудовиськами, магію, мечі… Я маю тренувати псів убивати легіонерів, а не пояснювати дурниці тобі!“\n\nОдин добрий ляпас пізніше — і Б’є-Псяче-Горло вийшов з намету побитий, але з думкою, що засіла в голові. „Люди, які стають вовками“… Може, їх і не було. Але в цьому світі можливо все. А отже… може, він зможе зробити, щоб вони були."
nf_han.101.a:0 "Бо він знає, на що здатні деякі люди…"

nf_han.102.t:0 "Просвітницька бесіда"
nf_han.102.d:0 "Б’є-Псяче-Горло терпіти не міг камери спостереження Денвера. Сирени, червоні вогні — все це допомагало роботу з „Скрині“ колись їх вигнати. Навіть тепер, коли того зламали, він нервував, коли на нього „дивились“. Але була одна користь: можна було стежити за в’язнями, надто небезпечними для особистої розмови. Глибоко під вулицями, у старій миттєвій в’язниці, сидів Великий Світлий. І коли камера ввімкнулась — заговорив першим:\n\n„Чи нарешті ви побачили світло, пси Міста Псів? Ваша неволя лише затримала моє піднесення людства до сяючого майбуття!“\n\n„Ем… ні. Але ми чули, що ти на Червоній Горі робив з людьми! Ти ж можеш перетворити людей на ґулів, правда?“\n\n„Я знаю шлях. Але кожна душа має пройти суд сама. Ті, що слабкі духом, не переживуть процес.“"
nf_han.102.a:0 "..."