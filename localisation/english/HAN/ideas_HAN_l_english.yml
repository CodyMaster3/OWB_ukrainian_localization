l_english:
han_the_scrap_metropolis:0 "Митрополія Брухту"
han_the_scrap_metropolis_desc:0 "Люди з усіх куточків приходять до Денвера, «Міста Псів», щоб урвати свою частку багатств цього колись величного мегаполісу. Вони приносять кришки, і торгівля йде добре — але чим більше їх тут, тим важче нам самим контролювати місто!"

dogsfordays:0 "Цуценята!"
dogsfordays_desc:0 "Так багато нових друзів, з якими можна гратися й битися!"

dogsdefense:0 "Пухнасті друзі"
dogsdefense_desc:0 "Пси Денвера дуже територіальні."

hanbettergear:0 "Гарні нашийники"
hanbettergear_desc:0 "Не завжди буквальні, здебільшого."

hanbettertrainers:0 "Собачий садочок"
hanbettertrainers_desc:0 "Обачно — вони люблять кусатися."

hanoldwarwounds:0 "Пси війни"

hanremainsofthesalvagers_1:0 "Обмежене збирання"
hanremainsofthesalvagers_2:0 "Бригади шукачів"
hanremainsofthesalvagers_3:0 "Старателі вітаються"
hanremainsofthesalvagers_4:0 "Старательство заохочується"
hanremainsofthesalvagers_5:0 "Старательські компанії"

hanfortbuild:0 "Собачі будки"
hanfortbuild_desc:0 "«Обережно, собаки!»"

hanbiggerbite:0 "Які великі зуби"
hanbiggerbite_desc:0 "Щоб краще завойовувати пустку"

hanrootoutdissent_1:0 "Патрулі Айботів"
hanrootoutdissent_1_desc:0 "Може, ще й патріотичну музику їм врубити? Для натхнення громадян..."

hanrootoutdissent_2:0 "А для чого ще нам тюрма?"
hanrootoutdissent_2_desc:0 "Тяжка праця та товсті стіни — найкращі ліки для перевиховання «рейдерів» і решти злочинців."

hansquashrebels_1:0 "Арешт злочинців"
hansquashrebels_1_desc:0 "Ці зайди, незареєстровані громадяни й дезертири — нам не по дорозі. Усіх — у загін і на облік!"

hansquashrebels_2:0 "Тюремні каральні загони"
hansquashrebels_2_desc:0 "Служба гарантує зменшення терміну!"

handemomen:0 "Вибухові пристрої шукачів"
handemomen_desc:0 "Динаміт винайшли, щоб підривати скелі — так писало в старій книжці. Люди просто м’якші за каміння."

hanmedicmen:0 "Облизати рани"
hanmedicmen_desc:0 "Метафорично, звісно. Медики наполягають."

hanbuildingmen:0 "Будівництво Собачого парку"
hanbuildingmen_desc:0 "Очищення завалів для тренувальних центрів і справжніх парків для собак значно покращило дисципліну й настрій у місті."

hantradefordays:0 "Торговий вузол"
hantradefordays_desc:0 "Місто Псів швидко перетворюється на торгівельне серце Колорадо, приваблюючи купців з усього регіону."

hansbitingdown:0 "Ватажок зграї"
hansbitingdown_desc:0 "Собаки здобули свій день! Ланій повалений!"

han_presidential_manufacturing_routines:0 "Президентські виробничі протоколи"
han_presidential_manufacturing_routines_desc:0 "MODUS поділився знаннями з управління автоматизованими фабриками — і тепер наші потужності працюють безупинно. Промисловість Денвера більше не спить."

han_the_scrap_empire:0 "Імперія Брухту"
han_the_scrap_empire_desc:0 "Далеко не просто цвинтар веж і руїн, Денвер знову сповнений життя — і запрошує до себе тих, хто хоче звати його домом."

han_demo_new_1:0 "Бригада підривників"
han_demo_new_1_desc:0 "Наші підривники роками тренувалися, зносячи старі будівлі. Вони так звикли до своїх іграшок, що тепер — справжні майстри вибухів у бою."

han_medic_new_1:0 "Здоров’я масам"
han_medic_new_1_desc:0 "Лікарні Денвера проєктувалися для боротьби з найстрашнішою чумою людства. Вони легко впораються й з усіма заразами Пустки."

han_building_new_1:0 "Великі гайкові ключі"
han_building_new_1_desc:0 "Підривати руїни весело, але уроки В’язня про те, як будувати з того, що зламав — не менш цінні."

han_sharper_teeth_idea:0 "Гостріші зуби"
han_sharper_teeth_idea_desc:0 "Легіон йде на нас. Час готуватись до тотальної війни!"

han_dog_scrap_weapons:0 "«Кастомна» зброя"
han_dog_scrap_weapons_desc:0 "Багато хто з наших любить модифікувати свою зброю — приліплюють зайвий брухт, додають унікальні деталі. На щастя, брухту в нас хоч греблю гати, тож із заміною частин проблем не виникає."

han_dog_scrap_trade:0 "Все на продаж"
han_dog_scrap_trade_desc:0 "Підходьте ближче! Биті Пси пускають усіх охочих на пошуки скарбів у Місті Псів. За відповідну плату, звісно."

han_dog_garrison_resistance:0 "Пси-придушувачі бунтів"
han_dog_garrison_resistance_desc:0 "Стійка до ударів броня та шоломи захищають наших волохатих друзів. Це також добре відлякує заколотників — шансів проти наших псів у них мало, а в броні — й поготів."

han_dog_roaming_packs:0 "Запах здобичі"
han_dog_roaming_packs_desc:0 "Наші мисливські зграї жадають вийти за межі Міста Псів і Колорадо. Свіжі землі, нові вороги, більше слави."

han_warden_robot_production:0 "Лінії виробництва роботів"
han_warden_robot_production_desc:0 "Після того, як скрап було зібрано й посортовано, продуктивність виробництва роботів зросла на 10%. Цілком виправдана праця."

han_warden_fuel_production:0 "Відновлені генератори"
han_warden_fuel_production_desc:0 "Побачити, як громадяни знову їздять вулицями Денвера на автомобілях — приємне видовище. Якщо триматимуться графіку, мобільні генератори значно зміцнять нашу оборону."

han_warden_robot_detectives_a:0 "«Містери Біспскі»"
han_warden_robot_detectives_a_desc:0 "Приварити мигалки до «Містера Хенді» з електрошокерами було блискучою ідеєю, якщо дозволите мені так сказати. Патрулювання міст і околиць за суворими наказами обов’язково зменшить рівень злочинності в нашому прекрасному штаті!"

han_warden_robot_detectives_b:0 "«Містери Біспскі»"
han_warden_robot_detectives_b_desc:0 "Приварити мигалки до «Містера Хенді» з електрошокерами було блискучою ідеєю, якщо дозволите мені так сказати. Патрулювання міст і околиць за суворими наказами обов’язково зменшить рівень злочинності в нашому прекрасному штаті!"

han_warden_civilian_protection:0 "Обов’язок громадянина"
han_warden_civilian_protection_desc:0 "«Нагадування всім громадянам району Денвера: трудові завдання є обов’язковими! Пам’ятайте, кожна частина, яку ви створюєте, потрапляє до робота, що захищає вас!»"

han_dog_denver_dogs:0 "Лють Битих Псів"
han_dog_denver_dogs_desc:0 "Наші рейдери та їхні пси кидаються вперед, розриваючи ворогів зі страшенною швидкістю й силою. Хай усі, хто нас зупиняє, тікають у паніці, побачивши наш шал."

han_warden_denver_defender:0 "Щит WARDEN-а"
han_warden_denver_defender_desc:0 "Мої сили ідеально розташовані для захисту цього великого штату. Хто наважиться випробувати мою оборону — пізнає гнів WARDEN-а."

han_never_again_idea:0 "Ніколи знову"
han_never_again_idea_desc:0 "Биті Пси присягли більше ніколи не допустити спустошення, яке принесли Паулус і Ланій. Цього разу саме Легіон пізнає, що таке — бути завойованим."
