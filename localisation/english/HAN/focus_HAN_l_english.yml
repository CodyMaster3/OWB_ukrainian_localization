l_english:
han_delinquents:0 "Метрополія Америки"
han_delinquents_desc:0 "Колись ми були шмаркачами на вулицях Денвера. Але коли впали бомби — ми вижили, де інші загинули."

han_howling_mad:0 "Вий на війну"
han_howling_mad_desc:0 "На нашому шляху до влади вили пси війни. Вони зігрівали нас і захищали під час ядерної зими."

han_dog_eat_dog:0 "Світ, де Пес жер Пса"
han_dog_eat_dog_desc:0 "Коли ми захопили Місто Псів, довелось очистити вулиці від мутованих шавок. Але з них ми виростили добрячих хлопців."

han_colorado_salvage:0 "Колорадське збирання"
han_colorado_salvage_desc:0 "Бомби не знищили Денвер, але стерли з лиця землі майже все життя. Вулицями бродять скажені пси, рейдери й злісні роботи. Ми можемо взятись за очищення міста й задовольнити потреби Пустки."

han_salvage_arms:0 "Обшук поліцейських дільниць"
han_salvage_arms_desc:0 "Перед війною в Місті Псів було чимало заворушень. Ми знайдемо залишки того безладу — й використаємо собі на користь."

han_fixing_factories:0 "Полагодити заводи"
han_fixing_factories_desc:0 "Хоч ми й не зможемо відновити всі роботизовані заводи, з руїн можна витягнути чимало цінного."

han_armaments:0 "Гострі зуби"
han_armaments_desc:0 "Ми повинні бути готові до [LAC.GetName], [TBH.GetName] та інших, хто стане на нашому шляху! Перетопимо металобрухт на знаряддя війни!"

han_fully_equipped:0 "Постачання з Західного узбережжя"
han_fully_equipped_desc:0 "Є старий табір, що колись належав шукачам із Заходу, доки ми їх не вигнали. Можливо, там щось залишилось?"

han_metal_and_man:0 "Небо впаде"
han_metal_and_man_desc:0 "Вежі Старих починають валитись. Ми можемо їм допомогти — і переобладнати на свій лад."

han_fortifications:0 "Укріпити автошляхи"
han_fortifications_desc:0 "Дороги Древніх здіймаються над Денвером, збудовані з металу й каменю, що нам і не снились. Але якщо підготуватись — вони стануть ідеальними лініями оборони."

han_fortifications_tt:0 "Ми отримаємо §G1§! рівень §Yзастави§! на південному кордоні §O[460.GetName]§!.\n\n"

han_sea_dogs:0 "Морські Пси"
han_sea_dogs_desc:0 "Хто сказав, що ми не можемо використовувати Арканзаський приток для набігів? Ніхто. Ось і відповідь."

han_defense_appraoch:0 "Пітбулі"
han_defense_appraoch_desc:0 "Ми — господарі Міста Псів, і ніхто цього не відбере. Ми виженемо всіх, хто загрожує нашій владі — і вже не вперше!"

han_build_up:0 "Пивоварня на набережній"
han_build_up_desc:0 "Стара броварня якимось дивом пережила війну. Гріх не використати її — для доброго напою, що радує серце, де б не пили!"

han_civilian_restrutcture:0 "Перебудова Кліток"
han_civilian_restrutcture_desc:0 "Ми дозволяли своїм „псам“ спати де завгодно, і це заважало роботі. Час звести справжні бараки."

han_heading_down:0 "Копати глибше"
han_heading_down_desc:0 "Під завалами ховається чимало цінного. Використаємо трохи… неоплаченої праці, щоб розчистити все!"

han_rebuild_the_past:0 "Зачистити каньйонних рейдерів"
han_rebuild_the_past_desc:0 "Вигнати рейдерів із гір допоможе краще захищати наше місто."

han_industry_revival:0 "Вигнати східних мародерів"
han_industry_revival_desc:0 "Люди, що перетнули радіоактивні шторми, облаштувались тут і грабують наше місто! Домовимось: хай працюють, але платять долю здобичі."

han_howling_forward:0 "Вий у майбутнє"
han_howling_forward_desc:0 "Ми навели лад у Місті Псів. Із купи руїн воно перетворюється на нове поселення. Згодом — справжнє місто."

han_true_alpha:0 "Альфа зграї"
han_true_alpha_desc:0 "Ніхто не сумнівається, що [HAN.GetLeader] — вожак Битих Псів. Але в нього є мрія. Навіщо задовольнятись Містом Псів, коли можна побудувати імперію? Хто посміє загнати нас у клітку?"

han_cleaning_up:0 "Прибратись у Місті Псів"
han_cleaning_up_desc:0 "Ми повинні зміцнити владу над містом. Всі шукачі скарбів — ласкаво просимо. Але платіть, як годиться."

han_remains_to_be_seen:0 "Ще побачимо"
han_remains_to_be_seen_desc:0 "Ми маємо переглянути кожен вантаж із Міста Псів. Хто знає, які скарби там приховані?"

han_fixing_up:0 "Навести блиск"
han_fixing_up_desc:0 "Місто Псів процвітатиме, якщо його сприйматимуть не як руїни, а як справжнє поселення. Розвиваймо торгівлю, поліпшуймо ринки."

han_past_mistakes:0 "Помилки минулого"
han_past_mistakes_desc:0 "„Денвер“, як називали наш дім предки, був центром знань. Але вони отруїли землю — і нам це прибирати. Може, час почати, слухаючи слова богині із заходу."

han_future_prospects:0 "Майбутні перспективи"
han_future_prospects_desc:0 "Є місця в місті, куди старі не радять ходити. Але [HAN.GetLeader] знає краще. Вивчаймо їх!"

han_open_the_box:0 "Відкрити Скриню"
han_open_the_box_desc:0 "У самому серці Денвера стоїть моторошна будівля. Зовні звичайна, а всередині — чорна Скриня, холодна як літо й темна як день. Ми не знаємо, що в ній, але це точно щось цінне."

han_arming_up:0 "Багатства Скрині"
han_arming_up_desc:0 "Із усіма цими скарбами ми станемо непереможними! Ніхто не оскаржить нашої сили над Колорадо!"

han_arming_up_tt:0 "Відкриває наступний рівень балістичної зброї та готує тактики партизанської війни проти Ланія!"

han_biting_down:0 "Стиснути щелепи"
han_biting_down_desc:0 "Плем'я Скорпіона надто довго тероризує наш південний кордон. До того ж, вони згодяться як буфер проти Легіону."

han_conquest_of_steel:0 "Залізне Завоювання"
han_conquest_of_steel_desc:0 "Хто такі Братство, щоб вважати себе хазяями Колорадо? Нікчеми — в кращому разі."

han_chew_toys:0 "Непрохані гості"
han_chew_toys_desc:0 "На сході [ROB.GETLeader] зі своїми роботами хоче, щоб ми забули про їхні злочини. Але вони не люди — це просто інструменти. Такі ж, як гайковий ключ."

han_throw_bone:0 "Обгризти роботів до кісток"
han_throw_bone_desc:0 "Знищити місто роботів людськими силами було болісно, але вигідно. Наші елітники — вовки серед овець."

spec_forces_research_bonus:0 "Покращення досліджень спецназу? Це реальніше, ніж здається."

han_power_armor_woo:0 "Уламки силової броні"
han_power_armor_woo_desc:0 "Чому лише Братство має силову броню в Колорадо? Ми теж її відкопаємо — особливо з їхніх мертвих тіл."

han_sharper_teeth:0 "Гостріші зуби"
han_sharper_teeth_desc:0 "Завоювавши нові землі, ми закріпились на них. Хай тільки спробує Легіон прийти сюди!"

han_sharper_teeth_tt:0 "\nОтримаємо постійне локальне §G-75%§! зменшення вартості інтеграції всіх ядерних земель §Y[MXC.GetNameWithFlag]§!, §Y[ROB.GetNameWithFlag]§! та §Y[SCO.GetNameWithFlag]§!."

han_digging_up_resources:0 "Викопати кістки"
han_digging_up_resources_desc:0 "У Колорадо повно залишків техніки. Чого їм там лежати — для Братства чи ще когось?"

han_advanced_digging:0 "Тактичне копання"
han_advanced_digging_desc:0 "Можна використати вибухівку, щоб добратись до старих шахт. У давніх книгах є багато чого корисного — якщо вмієш читати."

han_new_tricks:0 "Нові трюки"
han_new_tricks_desc:0 "Попри приказку, ми навчилися чимало. Тримаймо голову гордо — і завоюймо все цивілізоване."

han_bringing_mechanics_to_heel:0 "Загнати роботів у шию"
han_bringing_mechanics_to_heel_desc:0 "Час остаточно зламати роботів. Вони мають працювати на нас — а не з нами."

han_old_dogs:0 "Старі пси"
han_old_dogs_desc:0 "Ми бачили чимало боїв — і побачимо ще більше. Що ж, готуймось до наступного."

han_bite_makes_right:0 "Право на зубах"
han_bite_makes_right_desc:0 "Нехай інші скиглять про справедливість чи мораль. Пустка належить сильним — а ми найсильніші!"

han_jaws_of_victory:0 "Щелепи перемоги"
han_jaws_of_victory_desc:0 "Ось вона — найгрізніша армія Сходу!"

han_greatest_alphas:0 "Найвеличніші альфи"
han_greatest_alphas_desc:0 "Хто хороший хлопчик? Ти хороший! Що? Пси лояльні й люті, як і [HAN.GetLeader]."

han_rebuild_the_force:0 "Привіт, Америка!"
han_rebuild_the_force_desc:0 "§MПерезавантаження системи RobCo «Warden»... Активовано — ласкаво просимо, користувач...§!\nЩо за біса!? Я був вимкнений ДВІСТІ років?! Де мої охоронці?! Негайно перезавантажити протоколи оборони — новий патруль має вирушити негайно! І хтось принесіть мені кави!"

han_root_out_dissent:0 "Викорінити незгоду"
han_root_out_dissent_desc:0 "Ці безбожні, антиамериканські виродки ціляться в мої турелі! Платники податків оплачували цю техніку! Патруль — уперед, зупиніть цих беззаконних покидьків!"

han_robo_recall:0 "Оповіщення заступників"
han_robo_recall_desc:0 "Та ви з глузду з’їхали? Ці роботи не лише покинули місто, а й гуляють вже 2321 місяць!? Назад до роботи! Відпочинок — у вільний час, як належить добрим американцям."

han_operation_trust:0 "Операція «Довіра»"
han_operation_trust_desc:0 "Щоб повернути владу в місті, мені треба завоювати довіру виборців Денвера.\nЗвісно, в мене нема обличчя — я цифрове ПЗ, створене для захисту американців від самих себе... Але ж пересічний американець занадто дурний, аби помітити різницю. Називається — «освіта по-американськи»!"

han_force_multiplied:0 "Підсилена міць"
han_force_multiplied_desc:0 "...І це все, що лишилось? Губернатор обіцяв мені повноцінні сили для виконання обов’язків!\nБудь ласка, активуй Об'єкт B — може, це підвищить темп виробництва гвардії."

han_rebuild_old_sites:0 "Відновити старі об'єкти"
han_rebuild_old_sites_desc:0 "Об'єкт B — активовано... А як щодо C і D? Потрібна ручна авторизація на кожній з чотирьох станцій безпеки. Можливо, тоді злочинці таки лишатимуться в камерах."

han_old_world_arsenal:0 "Арсенал Старого Світу"
han_old_world_arsenal_desc:0 "Я не дозволю впасти цій Республіці. Всім озброєним громадянам — допоможіть зупинити анархістів, що загрожують нашому порядку."

han_resistance_is_futile:0 "Опір — марний"
han_resistance_is_futile_desc:0 "Час викорінити анархістів і їхні колективістські ідеї. Всі в'язні мають повернутись до камер. Усі відмовники — будуть розстріляні."

han_constant_patrols:0 "Безперервні патрулі"
han_constant_patrols_desc:0 "Співробітники Поліцейського Департаменту Денвера мають брати участь у цих патрулюваннях. Травми — не виправдання. Виконуйте свій обов'язок — Америка розраховує на вас!"

han_energy_sources_found:0 "Знайдені джерела енергії"
han_energy_sources_found_desc:0 "Розлив нафти... Я ніколи не бачив нічого настільки прекрасного."

han_advanced_sources:0 "Технічне розчищення"
han_advanced_sources_desc:0 "Економіка Денвера в жалюгідному стані. Покажемо нашим чудовим виборцям, як справжні американці прибирають місто!"

han_restocking_composites:0 "Поповнення композитів"
han_restocking_composites_desc:0 "Чи є щось краще за чистий азбест? Трохи переробки щодня — і анархісти з комуністами вже не проблема."

han_humanoid_robots:0 "Схеми «Калькулятора»"
han_humanoid_robots_desc:0 "Що це таке? Гуманоїдний робот «C-27»? Ніколи не чув про таке за всі свої роки.\nУ RobCo мене спалять за те, що я взагалі розглядаю сторонню розробку... Але уламки цих машин, розкидані по вулицях Денвера, — ну дуже привабливі."

han_sound_dogs_of_war:0 "Собаки війни"
han_sound_dogs_of_war_desc:0 "Ланій іде. І якщо судити по всіх його попередніх завоюваннях — нас чекають розп’яття, рабство і один з нас стане його радником. Готуймося вгризтися йому в шию."

han_dynamite_salvagers:0 "Динамітні шукачі"
han_dynamite_salvagers_desc:0 "У місті повно вибухівки. І не всю зробили ми самі!"

han_medicinal_salvagers:0 "Медичні шукачі"
han_medicinal_salvagers_desc:0 "Денвер був центром медицини, досліджень і, на жаль, лікування Нової Чуми."

han_old_world_salvagers:0 "Старі шукачі"
han_old_world_salvagers_desc:0 "Місто Псів бачло чимало великих шукачів: Безхребетного Стью, Майка Табора, Віктора, Дядечка Джима... Може, в іншому житті ми були б друзями. Вшануймо їхню пам'ять — і полегшімо шлях тим, хто прийде після."

han_blasting_the_ruins:0 "Вибухівка по руїнах"
han_blasting_the_ruins_desc:0 "У руїнах повно здобичі. Проблема — дістатися. Виправимо це."

han_boom_crew:0 "Команда Бум"
han_boom_crew_desc:0 "Ті, хто тримають нітрогліцерин — і божевільні, і герої. Віддамо їхню майстерність на службу війні."

han_blast_mining:0 "Підривне видобування"
han_blast_mining_desc:0 "У Пустці є що копати, крім брухту. Вибухівка допоможе й тут."

han_demo_man:0 "Підривник"
han_demo_man_desc:0 "Гранати корисні — головне, не впустити."

han_the_big_bang:0 "Великий вибух"
han_the_big_bang_desc:0 "Вибухівка для розчищення — це все одно вибухівка, хоч як назви."

han_medic:0 "Медик!"
han_medic_desc:0 "Лікарня в Денвері була майже як хмарочос, і багато хто, заражений Новою Чумою, потрапляв туди — щоб померти. Скелети досі лежать на ліжках і купами в морзі. Багато цінного хламу для якогось Науковця."

han_health_to_the_masses:0 "Здоров’я масам"
han_health_to_the_masses_desc:0 "У лікарні стільки ліків, що собаки вивалюються з неї обдовбані всім, що знаходять."

han_help_the_masses:0 "Допомога масам"
han_help_the_masses_desc:0 "Ми ще не можемо зробити Авто-Дока... Але можемо засвоїти медичні уроки й застосувати їх для людей."

han_heroes_never_die:0 "Герої не вмирають"
han_heroes_never_die_desc:0 "Деякі методи з лікарні все ще можна використати. Можливо, це початок чогось більшого, ніж просто хижацтво."

han_men_in_the_field:0 "Люди на вулицях"
han_men_in_the_field_desc:0 "Базова санітарія поступово очищає вулиці Денвера. Завдяки цьому ми зможемо виставити більше бійців."

han_building_a_better_future:0 "Будуємо краще майбутнє"
han_building_a_better_future_desc:0 "Можливо, ми ніколи не житимемо як наші предки. Але ми знайдемо новий шлях."

han_big_wrenches:0 "Великі гайкові ключі"
han_big_wrenches_desc:0 "Відтоді як прийшов Тюремник, ми навчилися працювати з чужаками. Шукачі приносять багатства, й ми сподіваємося — ще принесуть."

han_biggest_wrench:0 "Найбільший ключ"
han_biggest_wrench_desc:0 "Деякі глузують з Битих Псів як із диких племен, але ми навчилися багато чого. А з часом — навчимось ще більше."

han_built_a_better_future:0 "Майбутнє збудовано"
han_built_a_better_future_desc:0 "Ось вона — найбільша перемога в Пустці. Де були руїни — тепер поселення. Де була нужда — ну, тепер її трохи менше. Послухай, пройшло всього шістдесят днів."

han_construction_of_the_dog_house:0 "Будівництво Великого Кеннела"
han_construction_of_the_dog_house_desc:0 "Ми завжди жили з собаками — нашими духами-помічниками. Вони допомагали нам полювати і виживати. Настав час побудувати дім, гідний цих священних супутників."

han_contact_the_president_tt:0 "§YМи зв’яжемося з Президентом Сполучених Штатів і запитаємо нове завдання.§!"

han_mission_fulfilled:0 "Місію виконано"
han_mission_fulfilled_desc:0 "Місто Денвер — умиротворено! Без мене цього б не сталося. Тепер я — найкраща адміністративна одиниця в історії Денвера. Аж поки мій ОС не оновлять і не поставлять когось кращого. Ха-ха…\nПринеси мені каву, га? Подумаю над подальшим."

han_howling_victory:0 "Перемога, що завиває"
han_howling_victory_desc:0 "Ми перемогли Ланія. І тепер дивимось прямо в обличчя Легіону. Що б не було далі — це наш день слави."

han_reform_the_state:0 "Реформувати державу"
han_reform_the_state_desc:0 "Це місце в такому занедбаному стані, що в’язні вільно бродять коридорами. Хтось принесіть мені каву — мені треба нагадати цим людям, де закінчується їхня юрисдикція! Анархія — це не по-патріотичному! А непатріотична поведінка — головна ознака КОМУНІСТА."

han_run_texas:0 "Арізонське Барбекю"
han_run_texas_desc:0 "Кажуть, браміни Арізони такі смачні, що пальці оближеш. А ще їхні міста повні хламу. Зі здобиччю від Флагстаффа до Колорадо ми заволодіємо серцем пустки — і наші пси ніколи більше не будуть на ланцюгу!"

han_join_legion:0 "Бігти з зграєю"
han_join_legion_desc:0 "Ланія більше немає, але Легіон все ще живий на заході, за Ріо-Ґранде. І тепер Цезар робить нам спокусливу пропозицію..."

han_join_legion_tt:0 "Ви отримаєте запрошення приєднатися до [CES.GetNamewithFlag], дестабілізуюче рішення, яке принесе винагороди."

han_contact_the_president:0 "Зв'язатися з Президентом"
han_contact_the_president_desc:0 "Я добре справився, як не крути. Порядок повернено до Денвера, платники податків задоволені, слухняність забезпечена. Враховуючи, що мої останні 11 346 спроб зв’язатися з губернатором Колорадо провалились — спробую достукатися до Президента. Мої зонди PoseidonNet вказують, що він перебуває десь на сході... поблизу старої доброї Західної Вірджинії."

every_colorado_state:0 "Кожен §Yштат Колорадо§!"

han_temp_1a:0 "Шляхи зграї"
han_temp_1a_desc:0 "Наші бойові тактики з використанням собак дозволили нам підкорити вулиці Міста Псів. Але нам слід вдосконалити їх для бою з сильнішими ворогами."

han_temp_2a_left:0 "Зброя зі брухту"
han_temp_2a_left_desc:0 "Колосальні запаси матеріалів у Місті Псів дозволяють нам штампувати зброю в неймовірних обсягах — якщо нас не хвилює якість цієї зброї."

han_temp_2a_right:0 "Для бізнесу"
han_temp_2a_right_desc:0 "Оскільки ми розширюємося за межі міста, настав час послабити обмеження для шукачів і торговців. Зрештою, хламу вистачить на всіх... поки що."

han_temp_3a:0 "Броньовані друзі"
han_temp_3a_desc:0 "Пси Битих Псів завжди використовувались заради швидкості й дикості — щоб наші рейдери били у замішанні. Але тепер частина з них отримає броню і навчання для приборкання натовпу — це зменшить втрати і зробить наші землі безпечнішими... для нас."

han_temp_4a:0 "Розширюємо межі"
han_temp_4a_desc:0 "Колорадо — не кінець нашої історії. Зграя біжить туди, куди забажає. А ми все ще голодні."

han_temp_1b:0 "Планування оборони штату"
han_temp_1b_desc:0 "Ось воно... Мої творці залишили мені тактичні плани, розроблені ще до війни справжніми генералами. Час застосувати їх на практиці."

han_temp_2b_left:0 "Призначення ресурсів"
han_temp_2b_left_desc:0 "Стільки металобрухту в місті просто гниє! Я не зможу прибрати його за один день, але можу наказати роботам згрібати його до фабрик. Зрештою, він буде корисний, якщо буде в потрібному місці."

han_temp_2b_right:0 "Присвячені енергостанції"
han_temp_2b_right_desc:0 "На щастя, не всі автівки на вулицях розібрали ці злочинні шукачі. 1 з 1000 має ядерний двигун. Я виписую штрафи на ці авто вже другий тиждень. Якщо їх відремонтувати — отримаємо мобільні станції підзарядки для елементів живлення моїх роботів."

han_temp_3b:0 "Поліція Денвера"
han_temp_3b_desc:0 "Коли мої роботи зайшли до відділку поліції Денвера — вони знайшли лише перевернуті столи й скелети на зміні. Так не годиться! Як я маю охороняти місто без працюючої дільниці?"

han_temp_4b:0 "Забезпечення безпеки громадян"
han_temp_4b_desc:0 "Базу покрито. Пора повертати деяких заступників. Чим більше громадян повернуться до роботи на заводах, тим безпечнішим буде Колорадо."

han_temp_5:0 "Армія Денвера"
han_temp_5_desc:0 "Хай усі, хто стане проти нас, здригнуться. Велика армія Колорадо готова до будь-якого ворога."

han_industry_temp_left:0 "Перезапуск Сталеміста"
han_industry_temp_left_desc:0 "На південь від міста — ще одне, менше місто, де колись плавили метал і будували великі машини. Час знову запустити його домни!"

han_industry_temp_right:0 "Доламати їхні серця"
han_industry_temp_right_desc:0 "Ганг «Зламані Серця» колись були нашими суперниками — досі кілька їхніх бійців вештаються по східному кордоні. У них добрячі цяцьки — заберемо і, як покарання, змусимо їх показати, як робити ще."