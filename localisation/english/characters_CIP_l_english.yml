CIP_knight_hill_name:0 "Лицар Хілл"
CIP_knight_hill_character_desc:0 "Капітан-лицар Девон Хілл — це людина, яка відповідає за аташе, якого нам надіслали наші друзі з Братства. Хілл, досить грізний член розвідки, отримав наказ, цитуємо, "показати їм, як бореться розвідник Братства". І Хілл, безсумнівно, отримає від цього неабияке задоволення."