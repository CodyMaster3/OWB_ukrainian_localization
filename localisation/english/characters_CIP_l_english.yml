CIP_the_nemonik:0 "Немонік"
CIP_the_nemonik_character_desc:0 ""§gКолись я зберігав спогади, та боюсь, що сам стаю одним із них... Та неважливо. Якщо мій час ось-ось скінчиться, нехай мої останні дні стануть нагодою створити нові спогади для племені.§!"\n\nФактичний духовний та освітній лідер Шифрів, Немонік став свідком того, як світ останніми роками змінився на гірше. Для старого чоловіка це – просто завершення поточної епохи та світанок нової. Але він знає, що для племені Шифрів духовність і зазубрювання стародавніх схем допоможуть лише частково. Щоб вижити у цьому стрімко змінному світі, їм треба усвідомити: всупереч пропозиціям Каунтера Азкі щодо повного використання технологій, єдиний шлях, що не призведе до втрати їхнього місця у світі – це зберегти той статус, який плем’я мало, коли В'язень уперше їх відвідала.\n\nПроте навіть критикуючи технології, Немонік визнає, яку допомогу вони надали багатьом із Шифрів. Якби не Тріґ і її ідея лазерної гармати, Гадюки могли б перетворити Меса-Верде на ще одну катівню Темної Матері. Якби не допомога Бункера Мексона з Братства, Шифри не пережили б страшний голод, спричинений невдачею з «чудо-добривом» Денома. І якби не В'язень... Хто знає, в якому стані був би Колорадо – чи навіть увесь світ.\n\nНемонік не сліпий до переваг, які дали його народові технології. Але він також бачив і чув про те, до чого призводить як надмірна залежність від них, так і повна заборона. Легіон Цезаря, Братство, навіть їхні сусіди – кожен мав свій підхід до технологій. Але якщо математики Азкі правильні – навіть попри те, як сильно вони спотворились останніми роками – то вони доводять лише одне: у Шифрів майже не залишилось часу для вибору. Чи обере плем’я мудрість Немоніка, чи піддасться спокусам, які пропонує Азкі, – Немонік лише сподівається, що Шифри виживуть..."

CIP_counter_azkee:0 "Каунтер Азкі"
CIP_counter_azkee_character_desc:0 ""§gЯ провів обчислення й підбив підсумки. Щоб вижити, ми маємо змінити змінні, серед яких опинилися.§!"\n\nКаунтер Азкі – постать неоднозначна навіть серед самих Шифрів. Десятиліттями він очолював плем’я разом із Немоніком – два складники одного рівняння. Зі свого боку, він вважає, що плем’я не повинно залишатися в полоні звичних рішень і повторювати одні й ті ж результати. Натомість воно має застосувати свої знання та технологічне розуміння, щоб покращити пустку в цілому. Або, принаймні, по-справжньому осмислити математику й схеми своїх предків. За словами Азкі, Розрахунки можна вирішити на користь племені лише шляхом зміни змінних – так само, як колись зробила В'язень. Адаптація – це виживання, а допомога іншим – це виживання разом."

