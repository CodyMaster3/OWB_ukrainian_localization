vip_the_first_snakekeeper: "Перший Хранитель Змії"
vip_the_first_snakekeeper_desc: "Коли Джонатан Фауст вивів свій народ з переповненого Сховища 15, він буквально впав у яму гадюк. Упевнені, що він загинув, його люди вже обмірковували, що робити далі, як раптом через тиждень він повернувся... іншим.\n§GВелика Змія§! обрала його."

vip_a_time_of_strength: "Час Сили"
vip_a_time_of_strength_desc: "Наступні роки стали епохою зростання. Ми, що нарекли себе Гадюками, зростали числом і ставали все сильнішими. Центральна Каліфорнія тремтіла: ми нападали, палили, руйнували поселення одне за одним."

vip_the_shattering_of_the_tribe: "Розпад Племені"
vip_the_shattering_of_the_tribe_desc: "Фатальна зустріч із патрулем Братства стала початком нашого кінця. Щаслива — чи нещаслива — стріла вбила Верховного Старійшину Мексона ІІ, який супроводжував патруль. Помста Братства була страшною: плем’я було розбите й розсіяне по Пустці. Цей уламок племені прибився до Невади."

vip_proving_our_worth: "Довести Нашу Цінність"
vip_proving_our_worth_desc: "Тіні минулих поразок ще ледь відчутні, але не більше. Нью-Ріно — наш шанс довести, що Гадюки все ще небезпечні. Ми грабуємо його вулиці, забираємо здобич — і вся Пустка дізнається: ми повернулися. Більше ніякого ховання. Світ знову відчує наш отруйний укус."

vip_indoctrinating_tourists: "Прозріння Туристів"
vip_indoctrinating_tourists_desc: "Нью-Ріно — тепер під нашою владою — кишить туристами. Вони шукають насолоду, а знайдуть — просвітлення. Через обряди та настанови ці шукачі розваг скинуть стару шкіру і стануть новими послідовниками шляху Гадюки. І кожен новонавернений не лише підсилює наші ряди, а й несе нашу віру по всій Пустці."

vip_bringing_in_the_jackals: "Залучити Шакалів"
vip_bringing_in_the_jackals_desc: "Шакали — дикі й вперті — досі опираються. Але настав час змінити тактику: трохи сили, трохи здобичі — і вони можуть стати нашими союзниками. Разом Гадюки й Шакали стануть силою, яку Пустка буде поважати й боятись."

vip_seizing_the_vault: "Захоплення Сховища"
vip_seizing_the_vault_desc: "Місто-Сховище — ці стіни, ці багатства — колись відмовило нам у прихистку. Час помсти настав. Їхня відмова стане їм згубою. Ми прорвемося, візьмемо багатства й доведемо: Гадюки не можна ігнорувати безкарно."

vip_serpent_lords_of_the_big_circle: "Зміїні Володарі Великого Кола"
vip_serpent_lords_of_the_big_circle_desc: "Тепер ми контролюємо Велике Коло — головну торгову артерію північно-західної Невади. Наш вплив простягається далеко. Каравани шепочуть наше ім’я з повагою й жахом. Кожна пройдена ними миля зміцнює нас. Гадюки — не просто вижили. Ми — завойовники. Ми — правителі Пустки."

vip_no_step_on_snek: "Погляд у Минуле"
vip_no_step_on_snek_desc: "Ми — лише тінь того, ким колись були. Перетворені на звичайних рейдерів, ми виживаємо, нападаючи на мандрівників та використовуючи будь-яку зброю, яку можемо знайти. Але ми здатні на більше. Ми повинні бути більшими. Колись ми правили каліфорнійською Пусткою."

vip_high_priestess: "Верховна Жриця?"
vip_high_priestess_desc: "Першим кроком до відновлення стане повернення старих титулів. Наших лідерів знали як Великих Хранителів Змії, але традиційно це були лише чоловіки. Найвища жінка мала титул Верховної Жриці. Тож питання: чи повинна Вероніка прийняти титул Великої Хранительки Змії, чи залишитися вірною традиції як Верховна Жриця?"

vip_new_sources_of_poison: "Нові Джерела §PОтрути§!"
vip_new_sources_of_poison_desc: "Доступ до Святилища давно втрачено. Бочки зі зміями залишились у спогадах. Але ми все ще можемо здобути токсини, потрібні для наших отруєних лез. Отрута мурах, радскорпіонів і касадорів має властивості, схожі на нашу спадкову отруту — хоча й дещо послаблену."

vip_bringing_back_the_rituals: "Повернення Ритуалів"
vip_bringing_back_the_rituals_desc: "Наша сила була в тому, що ми позбувалися слабких. Щоб бути гідним в очах §GВеликої Змії§!, потрібно було регулярно споживати коктейль зі §Pотрути§! й алкоголю, а для воїнів була спеціальна суміш.\nІ нехай §GВелика Змія§! дарує таку ж силу нашій новій §Pотруті§!."

vip_slave_raids: "Жертви для §GВеликої Змії§!"
vip_slave_raids_desc: "§GВелика Змія§! вимагає жертв. Але ж не будемо жертвувати своїми — нас і так небагато лишилось. Ми схопимо чужаків, змусимо пройти Отруйне Випробування. Хто виживе — гідний приєднатись. Хто ні — стане жертвою."

vip_crimson_tongues: "Повернення §RБагряних Язиків§!"
vip_crimson_tongues_desc: "§RБагряні Язики§! були елітними воїнами Гадюк у минулому. Хоч мало хто з нинішніх наближається до їхнього рівня, дарування цього титулу може стати стимулом для нової еліти."
vip_crimson_tongues_tt: "§gПокращує спорядження ССО на один рівень, до максимуму 4.§!"

vip_the_vision: "Одкровення"
vip_the_vision_desc: "Під час щомісячного трансу Вероніці з'явилось одкровення: прадавня земля нашого племені. Місце було невиразним, але стояче Святилище — ясне як день. Земля нині під владою НКР — виклик, та виклики — найкращі друзі Гадюки."

vip_gearing_up_for_war: "Готуючись до Війни"
vip_gearing_up_for_war_desc: "Наші \"Зуби Ямної Гадюки\" — фальшиві, бо справжніх гадюк ми не маємо. Це просто загострені кістки, але наші воїни навчилися ними вправно володіти.\nНезабаром ми використаємо їх, щоби відвоювати Святилище."

vip_take_back_the_shrine: "Повернути Святилище"
vip_take_back_the_shrine_desc: "Час настав. Видіння ніколи не вказували коли саме бити по Новій Каліфорнії, але Вероніка впевнена — зараз наш шанс здобути Святилище.\n\n§GЗа Велику Змію!§!"

vip_vipers_reborn: "Відроджені Гадюки"
vip_vipers_reborn_desc: "Навколо Ями зіблося все плем’я, в трансі, що втілив нашу історію у сорокофутовому падінні.\nАтака Братства знищила наш табір, але дещо пережило. Трон Аспа Фауста — трон із кісток і крові — лишився стояти.\nІ навіть §Pотруйні§! створіння знову повзають із печер. Але наш головний ворог досі живий. Та їхні тіла впадуть у прірву. І Яма знову заспіває, а §Pотрута§! навіки лунатиме Пусткою."

50_percent_coring_cost_tt: "Отримати постійну §Gзнижку 50%§! на витрати націоналізації."

