vip_leader_name: "Вероніка Фауст"

  #VIP
vip_legacy_of_great_snake: "Спадщина §GВеликої Змії§!"
vip_legacy_of_great_snake_desc: "За десятиліття до того, як Гадюки були змушені тікати з Каліфорнії під натиском Братства Сталі, вони поклонялися своєму божеству — §GВеликій Змії§!. Увесь їхній побут і культура були побудовані навколо §GВеликої Змії§! та її отрути: їй приносили жертви, її отруту ритуально споживали, а зброю змащували §Pотрутою§!. І хоча Святилище, ймовірно, було знищене Братством при остаточному вигнанні Гадюк, уламки їхньої давньої віри збереглися. Найважливішим уроком, що пережив поневіряння в Пустці, залишилося переконання: виживає найсильніший. Так, іноді гарматне м’ясо гине передчасно — зате Гадюки стають сильнішими."
vip_legacy_of_great_snake_good: "Культ Гадюк"

vip_a_broken_tribe: "Зламане Плем’я"
vip_a_broken_tribe_desc: "Коли в 2155 році загін Гадюк напав на патруль Братства Сталі, вони не мали уявлення, кого саме розлютили. У перестрілці отруєна стріла смертельно поранила Мексона ІІ — Верховного Старійшину Братства. Його смерть викликала хвилю жорстокої помсти: до 2161-го, після шести років переслідувань, плем’я було остаточно розбите. Уцілілі втікачі розсіялися: в Мохаве, в Неваду, аж до Гончих Гекати. Сьогодні Гадюки — лише тінь свого колишнього величчя."

nf_vipers.1.t: "Перший Хранитель Змії"
nf_vipers.1.d: "Коли Джонатан Фауст вивів свій народ з переповненого Сховища 15, він буквально впав у яму гадюк. Прийнявши його за мертвого, люди були в розпачі, але за тиждень він повернувся... зміненим.\n§GВелика Змія§! обрала його.\nА чого ж §GВелика Змія§! прагне від новоствореного племені?"
nf_vipers.1.a: "Завоювання"
vip_event_conquer: "Наказ §GВеликої Змії§!"
nf_vipers.1.b: "Сили"
nf_vipers.1.c: "Багатства"

nf_vipers.2.t: "Час Сили"
nf_vipers.2.d: "У наступні роки ми, вже відомі як Гадюки, розрослись у числі та силі. Центральна Каліфорнія тремтіла під нашими набігами й вогнем. \nЯк далеко сягав наш вплив?\nСкільки ми втратили, коли впали?"
nf_vipers.2.a: "Банда від Блекрока до Східних Рубежів загинула"
nf_vipers.2.b: "Імперія від Скляної Гори до Бейкера розсипалась"

nf_vipers.3.t: "Розпад Племені"
nf_vipers.3.d: "Фатальна сутичка з патрулем Братства стала початком кінця. Стріла вбила Верховного Старійшину Мексона II, і його смерть запалила в Братстві лють. Помста зрештою розбила плем’я й розсіяла його по Пустці. Цей уламок осів у Неваді.\nЩо нам вдалося забрати під час втечі?"
nf_vipers.3.a: "Зброю — її забагато не буває!"
nf_vipers.3.b: "Провіант — шлях був довгим."
nf_vipers.3.c: "Журнали. Не лише Cat’s Paw."

nf_vipers.4.t: "Велика Хранителька Змії чи Верховна Жриця?"
nf_vipers.4.d: "Повернення до традицій — це важливо. Лідери нашого племені колись носили титул Великого Хранителя Змії, але всі були чоловіками. Жінки ж досягали вершини під титулом Верховної Жриці. Чи варто Вероніці порушити традицію й прийняти нове ім’я?"
nf_vipers.4.a: "Це не місце для токсичної маскулінності!"
nf_vipers.4.a_tt: "§gМоже краще сказати — §Pотруйної§! маскулінності?§!"
nf_vipers.4.b: "«Верховна Жриця» — звучить велично."

