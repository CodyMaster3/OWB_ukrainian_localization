l_english:
 itz_oil_and_imperialism:0 "Нафта та імперіалізм"
 itz_oil_and_imperialism_desc:0 "Багато років тому, у розпал війн за ресурси, американці вторглися до Мексики, щоб захопити її джерела нафти, які стрімко вичерпувалися. Їхнє вторгнення та окупація залишили на землі глибокий шрам, і не один."
 itz_reviving_an_ancient_culture:0 "Відродження стародавньої культури"
 itz_reviving_an_ancient_culture_desc:0 "Зі знищенням або дезертирством американських військових у суспільстві утворилася порожнеча. Як наслідок, ми звернулися до шляхів минулого, щоб спробувати заповнити цю прогалину."
 itz_ruling_the_waves:0 "Панування на хвилях"
 itz_ruling_the_waves_desc:0 "Острови Карибського басейну численні, а самі вони родючі та придатні для оборони. Тому вкрай важливо, щоб ми мали найсильніший флот в окрузі, аби ми могли захопити і зберегти це багатство для себе."
 itz_cometh_the_hour_cometh_the_man:0 "Настав час, з'явилася людина"
 itz_cometh_the_hour_cometh_the_man_desc:0 "День був похмурий: ацтеки наступали, а основна частина Ехерсіто безладно відступала від сил ацтеків. Однак з'явився молодий і харизматичний генерал, який знову згуртував нечисленні війська в бій. Завдяки поєднанню несподіванки, блискучих тактичних рішень і чистого відчаю війська Ехерсіто розгромили авангард ацтеків."
 itz_expand_the_factories:0 "Розширити заводи"
 itz_expand_the_factories_desc:0 "Заводи — це наша життєва сила. З них надходять гармати, вибухівка та боєприпаси — все це вкрай необхідне для захисту наших кордонів і продовження наших завоювань."
 itz_the_kalomtes_adventures:0 "Пригоди Каломте"
 itz_the_kalomtes_adventures_desc:0 "За правління Каломте Себастьяна розміри Імперії Іца різко зросли. У більшості кампаній під керівництвом Каломте він сам очолював війська Іца. І він не має наміру відмовлятися від цього."
 itz_enlarge_the_forces:0 "Збільшити сили"
 itz_enlarge_the_forces_desc:0 "Під нашим командуванням багато тисяч людей, але наші кордони простягаються на багато тисяч метрів і розширюються з кожним новим завоюванням. Потрібні нові полки, щоб воювати на фронті та захищати серце нашої землі!"
 itz_encourage_civilian_commerce:0 "Заохочувати цивільну торгівлю"
 itz_encourage_civilian_commerce_desc:0 "Потужна прибережна торгівля робить нашу Імперію могутньою. Заохочуючи цивільне населення торгувати товарами та відкривати власну справу, ми можемо забезпечити широку доступність товарів по всій імперії, сприяючи майбутньому будівництву та торгівлі."
 itz_peninsula_roads:0 "Дороги півострова"
 itz_peninsula_roads_desc:0 "Коли мова йде про прибережні подорожі, найкращим вибором є човни. Однак морські подорожі небезпечні та непередбачувані. Щоб протистояти цьому, ми повинні розширити дороги, що з'єднують прибережні поселення, дозволяючи прибережним громадам безпечно торгувати."
 itz_southwards_expansion:0 "Експансія на південь"
 itz_southwards_expansion_desc:0 "Оскільки війна забирає дедалі більше наших земель і людей, нам варто знайти розраду в нових союзниках. На півдні лежить держава Гондурас, очолювана Команданте Луїсом, яка охороняє наш південний кордон. За допомогою певного тиску та допомоги вони можуть погодитися приєднатися до нашої справи. Ми повинні негайно зосередити наші дипломатичні зусилля на них!"
 itz_enlarge_the_raiding_parties:0 "Збільшити рейдерські загони"
 itz_enlarge_the_raiding_parties_desc:0 "Наші військово-морські операції дозволяють нам здійснювати набіги на поселення вздовж узбережжя Мексиканської затоки та в Карибському басейні задля їхніх багатств. Цей метод дозволив нашій столиці, Чичен-Іца, різко зрости в населенні та розкоші. Звісно, більша кількість людей, відданих цій справі, не може зашкодити."
 itz_navigate_the_gulf:0 "Картографувати затоку"
 itz_navigate_the_gulf_desc:0 "Іца панує на хвилях мексиканської частини Мексиканської затоки, а також у значній частині Карибського басейну. Дослідивши та нанісши на карту решту затоки, ми зможемо поширити нашу військово-морську міць на весь регіон!"
 itz_naval_reform:0 "Військово-морська реформа"
 itz_naval_reform_desc:0 "Наразі наш флот сильно децентралізований і зосереджений навколо невеликих рейдерських груп та більшого основного флоту. Ми повинні прагнути інтегрувати флоти разом навколо центральної командної структури, щоб забезпечити стратегічний контроль над затокою."
 itz_regiment_the_ejercito:0 "Упорядкувати Ехерсіто"
 itz_regiment_the_ejercito_desc:0 "Ехерсіто — це наші елітні сили. Вони складаються з новобранців із міських районів, регулярно тренуються та добре оснащені. Однак розмір кожної групи різниться залежно від бажання добровольців та кількості місцевого населення. Ми повинні прагнути повністю стандартизувати Ехерсіто, створивши в процесі кілька нових дивізій."
 itz_dockside_trade:0 "Торгівля в доках"
 itz_dockside_trade_desc:0 "Наш контроль над морями означає, що наша прибережна торгівля процвітає. Наші громадяни з радістю виходять у море, щоб торгувати товарами, тому ринки в доках вирують життям, коли човни привозять товари з усієї Імперії."
 itz_peninsula_factories:0 "Заводи півострова"
 itz_peninsula_factories_desc:0 "Розміщення нових заводів у нашому центрі — це велика перевага. Вони зможуть виробляти боєприпаси для наших армій, навіть якщо станеться найгірше і ми втратимо більшу частину нашої Імперії, хоча цей день ніколи не настане."
 itz_strike_the_raiders:0 "Підтримати Південний фронт"
 itz_strike_the_raiders_desc:0 "Надсилання величезної кількості зброї та боєприпасів південним Геррерос покращить їхню думку про нас. Те, що вони можуть після цього приєднатися до нашої війни, — це, звісно, чистий збіг. А якщо це змусить їх віддати нам деякі територіальні претензії, то що в цьому поганого?"
 itz_cultural_ties_with_tzotzil:0 "Культурні зв'язки з Цоцилем"
 itz_cultural_ties_with_tzotzil_desc:0 "У перші дні після катастрофи, коли наша нація лише ставала на ноги, невелика група перших громадян Іца, незадоволена першим Каломте, відокремилася від нашої нації. Вони вирушили на південь крізь джунглі, зрештою облаштувавшись глибоко в хащах і створивши в процесі [TDT.GetName]. У результаті ми маємо багато спільних культурних зв'язків із Цоцилем, які просто благають, щоб їх використали."
 itz_a_new_foe:0 "Новий ворог"
 itz_a_new_foe_desc:0 "На півночі, за нашими прикордонними землями, щось відбувається. Промисловість працює, а ресурси вичерпуються з ландшафту. Хто чи що це робить, ми не знаємо, але мусимо з'ясувати."
 itz_island_hopping:0 "Стрибки по островах"
 itz_island_hopping_desc:0 "Острови Карибського басейну розташовані близько один до одного, що дозволяє нам легко вторгатися на один острів з попереднього."
 itz_the_grand_gulf_fleet:0 "Великий Флот Затоки"
 itz_the_grand_gulf_fleet_desc:0 "Хоча флот Іца може панувати на хвилях південної Затоки, ми знаємо недостатньо про інші військово-морські сили континенту, щоб впевнено оголосити перемогу. Наш флот повинен бути непереможним!"
 itz_new_designs:0 "Нові проєкти"
 itz_new_designs_desc:0 "Переобладнання довоєнних суден і виробництво простих морських човнів поки що було достатньо для забезпечення військово-морського панування, але ми не можемо вічно покладатися на ці методи. Ми повинні створювати нові, інноваційні проєкти, щоб гарантувати, що ми й надалі правитимемо хвилями."
 itz_expand_the_merodeadores:0 "Розширити Меродеадорес"
 itz_expand_the_merodeadores_desc:0 "Меродеадорес — це невеликі підрозділи морської піхоти, що підпорядковуються окремому командуванню від решти армії. Це робить їх ідеальними для маломасштабних вторгнень через річки чи моря, тому їх слід розширювати!"
 itz_integrated_military_economy:0 "Інтегрована військова економіка"
 itz_integrated_military_economy_desc:0 "Тепер, коли землі Гондурасу під нашим контролем, ми повинні прагнути тісно інтегрувати їхні заводи в наші власні виробничі системи."
 itz_the_challenge_for_leadership:0 "Виклик за лідерство"
 itz_the_challenge_for_leadership_desc:0 "Після багатьох років ретельно спланованих політичних шлюбів і розумних інвестицій ресурсів нам вдалося підняти лояліста на високу посаду в Цоцилі. Все, що йому потрібно зробити зараз, — це успішно викликати лідера Цоциля на дуель, і Цоциль стане вірною маріонеткою!"
 itz_technology_raids:0 "Технологічні рейди"
 itz_technology_raids_desc:0 "Землі на півночі сповнені двох речей: ворожих армій і технологічних багатств. Використовуючи наші перевірені методи морських набігів, а також певне централізоване планування, ми зможемо ефективно «звільнити» частину цих технологій і привезти їх додому для власного використання."
 itz_bases_here:0 "Бази тут..."
 itz_bases_here_desc:0 "Щоб розширити наше військово-морське панування в Карибському басейні, нам потрібна мережа військово-морських баз по всьому регіону. Вони повинні бути захищені, так чи інакше..."
 itz_promote_admiral_perez:0 "Підвищити Альміранте Переса"
 itz_promote_admiral_perez_desc:0 "Перес, офіцер, який командує одним із наших рейдерських флотів, зробив багато, щоб перетворити свою групу на грізну військово-морську силу. Його слід запросити допомогти реформувати весь флот за тією ж моделлю!"
 itz_begin_integration:0 "Адаптуватися до нових ідей"
 itz_begin_integration_desc:0 "Засновники [TDT.GetNameDef] покинули Іца через ідеологічні розбіжності з нашими Верховними Жерцями. Відтоді багато що змінилося, і наше суспільство стало набагато більш сприйнятливим до нових ідей. Прийнявши реформаторські ідеї, які проповідуються в Цоцилі, ми зможемо реформувати суспільство на краще!"
 itz_clashes_with_the_aztecs:0 "Сутички з Ацтланом"
 itz_clashes_with_the_aztecs_desc:0 "З часу наших перших зустрічей з Ацтланом ми постійно сваримося з ними на кордоні. Цей процес перетворився на щось на кшталт ритуалу: кожна сторона кидає людей на іншу, доки не буде змушена відступити через величезні втрати. Можливо, цього разу нам вдасться прорватися."
 itz_and_colonies_there:0 "...і колонії там."
 itz_and_colonies_there_desc:0 "Хоча військово-морські бази — це добре, для експлуатації багатств Карибського басейну в майбутньому ми повинні забезпечити постійний доступ до місцевих ресурсів."
 itz_one_expedition_too_far:0 "Занадто далека експедиція"
 itz_one_expedition_too_far_desc:0 "Це, напевно, було неминуче, але всі молилися, щоб цього ніколи не сталося. Все, що нам залишається зараз, — це сподіватися..."
 itz_rapid_decline_of_society:0 "Стрімкий занепад суспільства"
 itz_rapid_decline_of_society_desc:0 "Без нашого великого Каломте все розвалюється. В уряді з'являються фракції, що призводить до відсутності належної співпраці між відомствами. Як наслідок, суспільний договір, який ми маємо з нашими громадянами — захист в обмін на їжу, — починає руйнуватися, а отже, і суспільство, яким ми його знали, теж."
 itz_the_game_is_on:0 "Гра почалася"
 itz_the_game_is_on_desc:0 "Оскільки хвороба Каломте триває вже кілька тижнів, стало зрозуміло, що потрібен наступник. Двоє кандидатів затьмарюють решту — Ті'хуун Клара та командувач Ехерсіто Карлос. Лише один може взяти кермо влади країною. Гра почалася!"
 itz_schemes_and_stability:0 "Схеми та стабільність"
 itz_schemes_and_stability_desc:0 "Клара здобула підтримку завдяки обіцянці стабільності. Щойно імперію буде відновлено, вона обіцяє зосередитися на економіці та підвищенні рівня життя, а не на веденні марних воєн заради незначних здобутків. Завдяки цим обіцянкам і здоровій дозі інтриг вона забезпечила собі контроль над країною."
 itz_the_impossible_possible:0 "Неможливе можливе"
 itz_the_impossible_possible_desc:0 "Сталося найбільше диво сучасності. Каломте зцілився! Судячи з усього, він зможе відновити контроль над країною протягом декількох тижнів, а незабаром після цього — і командування на полі бою. О, радісний день!"
 itz_guns_and_glory:0 "Зброя і слава"
 itz_guns_and_glory_desc:0 "Карлос не намагався приховати свої плани. Він вів кампанію, спираючись на нестримний мілітаризм і радикальне розширення Імперії. Його підтримка серед Ехерсіто, безсумнівно, також допомогла йому здобути перемогу в боротьбі за владу."
 itz_expand_the_tihuuns_bodyguard:0 "Розширити охорону Ті'хуун"
 itz_expand_the_tihuuns_bodyguard_desc:0 "Клара може контролювати країну, але її правління далеко не безпечне. Розширивши її охорону — віддану групу елітних військ — можна забезпечити безпеку все більшої частини країни."
 itz_deal_with_the_ejercito:0 "Розібратися з Ехерсіто"
 itz_deal_with_the_ejercito_desc:0 "Ехерсіто — проблемна група. Це наші елітні сухопутні війська, на які ми дуже покладаємося в обороні наших кордонів, але вони також шалено віддані своєму керівництву — з Карлосом на чолі. Їх потрібно знову підпорядкувати нам, так чи інакше!"
 itz_the_kalomte_rules_again:0 "Каломте знову править"
 itz_the_kalomte_rules_again_desc:0 "Хоча новина про одужання Каломте поклала край боротьбі за владу, йому ще належить належним чином повернутися на трон і знову взяти на себе керівництво справами нації."
 itz_deal_with_the_tihuun:0 "Розібратися з Ті'хуун"
 itz_deal_with_the_tihuun_desc:0 "Протягом усієї боротьби за владу Ті'хуун була лише джерелом неприємностей. Її витонченим інтригам, здається, немає кінця навіть зараз, і тому з нею треба розібратися."
 itz_establish_military_rule:0 "Встановити військове правління"
 itz_establish_military_rule_desc:0 "Цивільний уряд кишить лоялістами Клари, і йому не можна довіряти. Єдиний життєздатний варіант — прямий контроль військових."
 itz_build_the_grand_palace:0 "Побудувати Великий Палац"
 itz_build_the_grand_palace_desc:0 "Немає кращого способу продемонструвати свою могутність, ніж побудувати величний палац!"
 itz_reduce_the_ejercito_to_border_patrol:0 "Звести Ехерсіто до прикордонного патруля"
 itz_reduce_the_ejercito_to_border_patrol_desc:0 "Ехерсіто неодноразово демонстрували значну нелояльність, тому ми повинні зайняти жорстку позицію щодо них. Ехерсіто слід повністю позбавити влади і відправити у вигнання на прикордоння."
 itz_purge_the_ambitious_officers:0 "Чистка амбітних офіцерів"
 itz_purge_the_ambitious_officers_desc:0 "Ехерсіто неодноразово демонстрували значну нелояльність, але це лише через їхнє сильне почуття дисципліни — рису, гідну похвали. Якщо ми замінимо тих, кому підпорядковується Ехерсіто, на лоялістів, вони, безперечно, підуть за ними."
 itz_reshuffle_the_political_landscape:0 "Перетасувати політичний ландшафт"
 itz_reshuffle_the_political_landscape_desc:0 "Стара політична ситуація стала застійною і, як ми бачили зовсім нещодавно, схильною до боротьби за владу. Потрібен радикальний струс!"
 itz_establish_the_royal_guard:0 "Створити Королівську гвардію"
 itz_establish_the_royal_guard_desc:0 "Поранення Каломте було серйозним і сталося через те, що бунтівний агітатор на північних кордонах прослизнув повз охорону Каломте. Ми повинні розширити і формалізувати цю охорону, щоб гарантувати, що це ніколи не повториться!"
 itz_merodeadores_as_marines:0 "Меродеадорес як морська піхота"
 itz_merodeadores_as_marines_desc:0 "До боротьби за владу Меродеадорес ставали дедалі активнішими на суходолі. Однак їхня вірність Кларі під час боротьби означає, що їм більше не можна довіряти захист нашої країни. Їх потрібно об'єднати й обмежити лише виконанням військово-морських завдань."
 itz_scrap_the_merodeadores:0 "Розпустити Меродеадорес"
 itz_scrap_the_merodeadores_desc:0 "Меродеадорес були вірні Кларі, і цьому не може бути виправдання. Їх потрібно розпустити повністю!"
 itz_place_all_ejercito_factories:0 "Всі військові заводи під контроль Ехерсіто"
 itz_place_all_ejercito_factories_desc:0 "Раніше наша військова промисловість перебувала в досить заплутаному стані, розділена між державними заводами та заводами, що належали Ехерсіто. Щоб спростити цей процес, ми повинні передати всі наші заводи під контроль Ехерсіто, оскільки вони найкраще знають військову справу!"
 itz_the_last_purge:0 "Остання чистка"
 itz_the_last_purge_desc:0 "Після приходу Клари до влади вона провела серію чисток різних фракцій у бюрократії та армії, щоб забезпечити свою абсолютну владу. Чистки майже закінчилися, але залишилася одна..."
 itz_a_popular_populist_monarch:0 "Популярний монарх-популіст"
 itz_a_popular_populist_monarch_desc:0 "Клара має дві переваги — свою популярність і свій популізм. Її харизма завоювала їй місце в серцях і вірність народу, а її популістські обіцянки стабільності забезпечили їй підтримку аристократії та політичної еліти."
 itz_death_or_glory:0 "Смерть чи слава?"
 itz_death_or_glory_desc:0 "Генерали Ехерсіто не приносили нічого, крім проблем. Однак, якщо ми проведемо чистку серед них, ми залишимо величезну діру в нашій командній структурі, але якщо ми цього не зробимо, то ризикуємо отримати переворот."
 itz_solidify_succession:0 "Закріпити правонаступництво"
 itz_solidify_succession_desc:0 "Причиною нашої останньої боротьби за владу було те, що у Каломте не було чіткого наступника. Це потрібно виправити."
 itz_enforcing_the_cult_of_personality:0 "Насадження культу особи"
 itz_enforcing_the_cult_of_personality_desc:0 "Каломте завжди мав палкий культ особи завдяки своїм перемогам за кордоном і реформам удома. Ми повинні посилити цей культ особи, щоб усі наші люди зрозуміли, яким великим лідером він є!"
 itz_resume_military_duties:0 "Відновити виконання військових обов'язків"
 itz_resume_military_duties_desc:0 "Час настав! Каломте нарешті достатньо одужав, щоб знову приєднатися до своїх військ. Вони, безумовно, сумували за його військовою доблестю."
 itz_resume_military_duties_tt:0 "§YКаломте Себастьян II§! відновить свої обов'язки фельдмаршала в армії!"
 itz_the_schemers_longevity:0 "Довголіття інтриганки"
 itz_the_schemers_longevity_desc:0 "Інтриганка Клара вже деякий час перебуває під домашнім арештом, але рішення щодо її подальшої долі ще не прийнято. Безумовно, можна сказати, що вона майстерний бюрократ, але вона також виявилася майстерною інтриганкою."
 itz_ramp_up_militarism:0 "Посилити мілітаризм"
 itz_ramp_up_militarism_desc:0 "Одна з проблем, з якими стикається наша нація, полягає в том, що фермери на полях почуваються відстороненими від воєн, які ми ведемо на фронті. Ми повинні посилити мілітаристські настрої."
 itz_defence_of_the_homeland:0 "Оборона Батьківщини"
 itz_defence_of_the_homeland_desc:0 "Тепер, вперше з моменту приходу Каломте до влади, батьківщина перебуває під прямою загрозою вторгнення. Її треба захистити — будь-якою ціною."
 itz_industrial_modernisation:0 "Промислова модернізація"
 itz_industrial_modernisation_desc:0 "Наша промисловість — це здебільшого кустарні рішення локальних проблем, що складаються з методів, які використовувалися сотні років. Ми повинні змінити це і привести себе в сучасний пост-ядерний світ."
 itz_expand_the_status_quo:0 "Розширити статус-кво"
 itz_expand_the_status_quo_desc:0 "Економічна система, яку ми використовували до поранення Каломте, працювала досить добре. Немає потреби в радикальних реформах чи радикальному розширенні."
 itz_total_mobilisation:0 "Тотальна мобілізація"
 itz_total_mobilisation_desc:0 "Ніколи не буде дня, коли Іца не буде під загрозою вторгнення злих іноземних імперій. Наша економіка повинна бути орієнтована на війну, війну і нічого крім війни в усі часи!"
 itz_drastic_military_restructuring:0 "Радикальна військова перебудова"
 itz_drastic_military_restructuring_desc:0 "Усі складові збройних сил були тією чи іншою мірою нелояльними, і єдиний спосіб виправити це — реформувати службу з нуля, незалежно від того, який хаос це може спричинити."
 itz_changing_roles_around:0 "Зміна ролей"
 itz_changing_roles_around_desc:0 "Певні елементи збройних сил були вкрай нелояльними і потребують перетрушування. Однак базова структура сил не потребує значних змін."
 itz_shaky_status_quo:0 "Хиткий статус-кво"
 itz_shaky_status_quo_desc:0 "Здебільшого збройні сили працюють як належить. Потрібні певні зміни, але лише незначні."
 itz_open_up_to_the_world:0 "Відкритися світові"
 itz_open_up_to_the_world_desc:0 "Однією з наших економічних проблем була відмова від торгівлі з іноземними країнами та опора виключно на власні ресурси. Хоча на ранніх етапах це не було такою проблемою, тепер, коли наша промисловість розширюється, їй потрібно дедалі більше ресурсів для роботи."
 itz_develop_power_stations:0 "Розвивати електростанції"
 itz_develop_power_stations_desc:0 "Електроенергія — це життєва сила нашої нації. Вона рухає наші машини і заспокоює наших людей. Ми повинні розширити мережу розподільчих станцій по всій країні."
 itz_civilian_construction_brigades:0 "Цивільні будівельні бригади"
 itz_civilian_construction_brigades_desc:0 "Нам бракує промислових потужностей, і ми маємо велику проблему з безробіттям у містах. Ми можемо вбити двох зайців одним пострілом, просто мобілізувавши безробітних громадян для будівництва різних об'єктів."
 itz_empower_the_secret_police:0 "Посилити таємну поліцію"
 itz_empower_the_secret_police_desc:0 "Бюро захисту громадян Іца давно гарантує, що населення заспокоєне і перебуває під нашим контролем. Ми повинні поширити їхній вплив на аристократію та заводи, щоб гарантувати відсутність опозиції нашому правлінню."
 itz_support_the_merodeadores:0 "Підтримати Меродеадорес"
 itz_support_the_merodeadores_desc:0 "Меродеадорес — це великий актив. Вони кваліфіковані, дисципліновані та універсальні, будучи господарями моря і суші. Вони підтримували нас під час боротьби за владу, і їхня вірність буде щедро винагороджена."
 itz_reform_the_merodeadores:0 "Реформувати Меродеадорес"
 itz_reform_the_merodeadores_desc:0 "Хоча Меродеадорес не ідеальні, їхній стан не вимагає повного розпуску. Натомість, завдяки ретельній реформі та лоялістам на ключових посадах, їх можна перетворити на грізну морську піхоту."
 itz_the_destruction_of_the_merodeadores:0 "Знищення Меродеадорес"
 itz_the_destruction_of_the_merodeadores_desc:0 "Меродеадорес справді заангажовані та застарілі. Єдиним можливим рішенням є повний розпуск Меродеадорес і створення нового корпусу морської піхоти з нуля."
 itz_expel_the_ejercito_to_the_borders:0 "Вислати Ехерсіто на кордони"
 itz_expel_the_ejercito_to_the_borders_desc:0 "Хоча рішення про зведення Ехерсіто до охорони кордонів було прийнято незабаром після завершення боротьби за владу, воно ще не реалізовано. Настав час зробити це і нарешті убезпечити наш режим від можливого перевороту."
 itz_recast_the_ejercito:0 "Переформатувати Ехерсіто"
 itz_recast_the_ejercito_desc:0 "Протягом досить тривалого часу Ехерсіто було тривожно політизованою та непокірною групою. Враховуючи політичні чвари, що спіткали Іца останніми роками, стало зрозуміло, що партизанські елементи Ехерсіто мають бути витіснені та замінені. Усунувши зрадницькі елементи армії, ми зможемо нарешті вдосконалити і просунути нашу доктрину, не зустрічаючи перешкод з боку тих, хто отримував вигоду від попереднього порядку."
 itz_support_the_ejercito:0 "Підтримати Ехерсіто"
 itz_support_the_ejercito_desc:0 "Всупереч тому, що іноді думали можновладці, корумповане і політизоване Ехерсіто має неабияку цінність. Для зміцнення нашої влади немає нічого кращого, ніж автономна, самодостатня армія, що прямо орієнтується на нашу партію та цілі. Більше того, наявність потрібних людей при владі добряче змастить шестерні нашої військової машини, коли прийде час діяти всупереч тому, що здається добрим і праведним."
 itz_expand_military_production:0 "Розширити військове виробництво"
 itz_expand_military_production_desc:0 "Поява вільної торгівлі виявилася благом для успіху нашої економіки. Ресурси тепер починають вільно перетікати між Іца та її партнерами, і ці нові ресурси знайдуть гарне застосування в нашому військово-промисловому комплексі. Необхідно побудувати воєнізовані майстерні, присвячені державі, і використовувати їх для створення нових військових матеріалів за підтримки нашої зростаючої економіки."
 itz_distribution_networks:0 "Мережі розподілу"
 itz_distribution_networks_desc:0 "Скинувши ярмо ізоляціонізму, ми перевірили інфраструктуру країни і виявили її недоліки. Якщо ми хочемо зарекомендувати себе як цінні торгові партнери, ми повинні спочатку забезпечити надійний потік товарів і матеріалів між нашими великими промисловими центрами. Розширення наявних доріг та будівництво нових є на часі."
 itz_scavenging_the_wilderness:0 "Збиральництво в дикій місцевості"
 itz_scavenging_the_wilderness_desc:0 "Минуло багато поколінь з часів американської окупації Мексики, але залишки присутності армії США очевидні й донині. Покинуте спорядження, техніка та поселення завжди були орієнтирами для наших людей, але можуть стати чимось значно більшим. Хоча багато з того, що залишилося, занепало, немає дефіциту компонентів Старого світу, які можна знайти — як складних, так і простих."
 itz_repair_main_roads:0 "Ремонт головних доріг"
 itz_repair_main_roads_desc:0 "Хоча наше населення відносно добре розосереджене по різних провінціях нашої країни, деякі райони розвинені краще за інші. Перш ніж розглядати будь-яке розширення, ми повинні спершу присвятити час і ресурси меті створення системи доріг, яка з'єднає всі провінції. Багато великих магістралей і шляхів занепали, і їх необхідно розвивати для досягнення цієї мети."
 itz_convert_civilian_factories:0 "Конверсія цивільних фабрик"
 itz_convert_civilian_factories_desc:0 "Ми не можемо сподіватися перетворити Іца на якусь утопію, поки її вороги все ще дихають. Нація більш ніж достатньо розвинена, і можна припустити, що більшість нашої внутрішньої промисловості зосереджена на легковажних, непотрібних речах. Вилучення робочих місць і робітників для виробництва зброї є першим кроком у зміцненні промислової складової нашої армії."
 itz_drastically_increase_output:0 "Радикально збільшити випуск продукції"
 itz_drastically_increase_output_desc:0 "Слабкість, виявлена в нашому військово-промисловому комплексі, — це те, чого ми не можемо дозволити продовжувати. Ми повинні ефективніше використовувати населення і надати їм кращі умови для виробництва зброї. Спеціальне будівництво нових військових заводів дозволить нам краще виконувати квоти та оснащувати нашу армію."
 itz_mass_conscription_for_the_merodeadores:0 "Масова мобілізація до Меродеадорес"
 itz_mass_conscription_for_the_merodeadores_desc:0 "Щоб армія досягла успіху, вона повинна бути здатною адекватно тримати лінію фронту і займати територію. Хоча Меродеадорес є елітною і потужною групою, їм часто бракує чисельності. Вивівши нових людей на поле бою та реорганізувавши склад наших морських сил, ми можемо забезпечити міцну лінію оборони та боєздатні сили достатньої чисельності."
 itz_enforce_discipline:0 "Забезпечити дисципліну"
 itz_enforce_discipline_desc:0 "Меродеадорес на голову вищі за основну масу нашої армії і служать кваліфікованими та тактичними ударними військами як на суші, так і на морі. Незважаючи на це, вони відображають стан нашої армії, будучи часом буйними та непокірними. Якщо ми хочемо рухатися вперед, ми повинні прищепити військам більше почуття вірності та згуртованості підрозділів."
 itz_create_the_imc:0 "Створити І.К.М.П."
 itz_create_the_imc_desc:0 "Меродеадорес зникли, і прогалину, яку вони залишили в структурі нашої армії, можна чітко відчути і побачити. Як прибережна держава, ми завжди повинні інтегрувати море в наші сухопутні операції, тому необхідно швидко зібрати новий корпус морської піхоти. Окрім формування сучасних сил морських солдатів, ми також повинні краще інтегрувати їх у структуру великої армії."
 itz_break_the_ejercitos_hold_on_military_production:0 "Зламати контроль Ехерсіто над військовим виробництвом"
 itz_break_the_ejercitos_hold_on_military_production_desc:0 "Вже досить тривалий час контроль над нашою військовою промисловістю належить Ехерсіто. За такої високої напруги ми не можемо дозволити автономній і, можливо, зрадницькій силі мати такий контроль над нашою армією. Хоча це може спричинити певні чвари на деякий час, заводи повинні бути вилучені в Ехерсіто і повернуті під контроль держави."
 itz_destroy_officer_careerism:0 "Знищити офіцерський кар'єризм"
 itz_destroy_officer_careerism_desc:0 "Хоча воно, можливо, вже не таке корумповане і дволике, як колись, керівництво армії все ще роздуте і неефективне. Це можна пояснити насамперед тим, що посада воєначальника стала переважно політичною, сповненою боротьби за владу та кумівства. Якщо ми зможемо усунути цих кар'єрних лідерів від управління і повернути владу до рук досвідчених військових умів, наша армія отримає велику користь."
 itz_expand_the_ejercitos_industrial_complexes:0 "Розширити промислові комплекси Ехерсіто"
 itz_expand_the_ejercitos_industrial_complexes_desc:0 "Якщо Ехерсіто має стати тим державним інструментом, яким ми хочемо його бачити, ми повинні забезпечити ефективність нашого військово-промислового комплексу. Ми можемо дуже швидко загрузнути через нелояльні елементи і стати неспроможними оснастити нашу армію, якщо контроль над заводами опиниться в руках когось, крім Ехерсіто. Будівництво нових заводів під контролем держави дозволить краще централізувати нашу промислову міць."
 itz_implement_the_four_year_plan:0 "Впровадити чотирирічний план"
 itz_implement_the_four_year_plan_desc:0 ""
 itz_open_the_mexican_technical_college:0 "Відкрити Мексиканський технічний коледж"
 itz_open_the_mexican_technical_college_desc:0 "Оскільки валюта і товари течуть через Іца, необхідно вирішити, як належним чином використати наші нові надлишкові кошти. Зміцнивши наші промислові можливості як у цивільному, так і у військовому секторах, ми тепер повинні прагнути просувати нашу націю як технологічну державу. Відповідні інвестиції коштів і розумів слугуватимуть цьому завданню в майбутньому."
 itz_promote_large_families:0 "Заохочувати великі сім'ї"
 itz_promote_large_families_desc:0 "Щоб продовжувати наш проєкт стабільного розширення, ми повинні забезпечити таке ж стабільне зростання населення нашої країни. Окрім збільшення кількості чоловіків призовного віку для наших армій, бебі-бум також стане великою підмогою для нашої зростаючої внутрішньої промисловості. Цивільні теж корисні, і збільшення кількості робітників природним чином дозволить розширити будівництво."
 itz_civilian_production:0 "Цивільне виробництво"
 itz_civilian_production_desc:0 "Оскільки наші операції зі збору ресурсів зростають, а наші поселення стають дедалі більш пов'язаними, необхідно ретельно продумати використання цивільної робочої сили. Маючи вдосталь працьовитих чоловіків і жінок, ми повинні спрямувати ресурси на досягнення кінцевої мети — розвитку нашої цивільної промисловості. Від цього залежить розвиток батьківщини."
 itz_expand_the_ejercitos_complexes:0 "Розширити комплекси Ехерсіто"
 itz_expand_the_ejercitos_complexes_desc:0 "Переваги контрольованої армією промисловості не можна недооцінювати, і є багато чого, що можна отримати від подальших інвестицій у майстерні та заводи, які перебувають під контролем Ехерсіто. Окрім очевидної переваги у вигляді більшого постачання зброї та спорядження, існує також використання цивільної промисловості для будівництва таких об'єктів, як аванпости та бункери."
 itz_war_is_peace:0 "Війна — це мир"
 itz_war_is_peace_desc:0 "У глибині кімнати, вкриту пилом, ми знайшли книгу. Вона описувала світ утопії — рівність панувала під жорстким контролем Партії. Ціла нація напружилася як одне ціле, щоб перемогти своїх ворогів за морем і на суші, об'єднана трьома принципами правління. Війна — це мир, свобода — це рабство, а незнання — сила. Ця книга під назвою «1984» описує утопію для Карлоса. Тепер ми повинні втілити її в життя."
 itz_extend_conscription:0 "Розширити призов"
 itz_extend_conscription_desc:0 "Щоб належним чином захистити нашу Імперію, нам потрібні люди для наших армій. Більше недостатньо покладатися лише на добровольців — ми повинні розпочати призов."
 itz_new_firearms:0 "Нова вогнепальна зброя"
 itz_new_firearms_desc:0 "Тепер, коли ми стикаємося з розвиненими ворогами, недостатньо просто мати найкращу дисципліну та бойовий дух. Ми повинні мати найкращу вогнепальну зброю, щоб їм протистояти."
 itz_increase_naval_capabilities:0 "Збільшити військово-морські спроможності"
 itz_increase_naval_capabilities_desc:0 "Ми повинні й надалі навчати наші війська мистецтву морських десантів, щоб вони могли швидше діяти, якщо це знадобиться нам у майбутньому."
 itz_rough_terrain_training:0 "Тренування на пересіченій місцевості"
 itz_rough_terrain_training_desc:0 "Окрім своєї майстерності в морських десантах, Меродеадорес показали себе перспективними на пересіченій місцевості. Ми повинні спиратися на це і тренувати там наші війська."
 itz_enhanced_landing_forces:0 "Покращені десантні сили"
 itz_enhanced_landing_forces_desc:0 "Навчаючи Корпус морської піхоти веденню морської війни, ми зможемо ефективніше здійснювати морські висадки в майбутньому."
 itz_establish_the_college_of_military_affairs:0 "Заснувати Коледж військових справ"
 itz_establish_the_college_of_military_affairs_desc:0 "Військова наука — це мистецтво, що швидко розвивається, тому ми повинні забезпечити наявність фахівців, які присвячують себе розвитку цієї галузі. Їхня робота може навіть мати побічний ефект для інших аспектів нашого життя!"
 itz_dilute_ejercitos_leadership:0 "Розбавити керівництво Ехерсіто"
 itz_dilute_ejercitos_leadership_desc:0 "Командна вертикаль в Ехерсіто є витонченою та ефективною. Хоча ця система чудова в час тотальної війни, вона зосереджує величезну владу в руках старої гвардії в мирний час. Дещо розбавивши командний ланцюг і призначивши в ньому лояльних офіцерів, ми зможемо значно зменшити владу старої гвардії."
 itz_standardise_army_drills:0 "Стандартизувати військові навчання"
 itz_standardise_army_drills_desc:0 "Процес приведення нашої армії у бойову форму триватиме роками, а думка про те, що наша армія має загартовуватися у полум'ї війни, є застарілою і погано нам служить. Найпростіший і найбільш прямий крок до покращення нашої армії — це вдосконалення тактики та злагодженості підрозділів. Потрібні нові тренувальні вправи та військові ігри, щоб навчити наших військових тактиці та бою."
 itz_encourage_office_dynasties:0 "Заохочувати офіцерські династії"
 itz_encourage_office_dynasties_desc:0 "Якщо ми хочемо продовжувати розширювати та вдосконалювати Ехерсіто, ми повинні забезпечити, щоб керівництво нашими силами перейшло до правильних осіб. Наші лідери повинні бути як кваліфікованими, так і відданими державі — це те, що ми можемо забезпечити завдяки щедрому використанню кумівства. Ті, кому ми вже довіряємо, ймовірно, мають родичів, придатних для керівництва нашими військовими."
 itz_power_to_the_people:0 "Влада — народу"
 itz_power_to_the_people_desc:0 "Досягнувши успіху в зусиллях щодо розширення нашого виробництва зброї та броні, ми повинні почати розглядати можливість та прогнозоване навантаження військової машини, придатної для Пустки. Якщо ми хочемо рухатися вперед як військова держава, ми повинні налагодити більше виробництво електроенергії в певних промислових центрах. Від термоядерних блоків до енергетичних осередків — енергія з часом стане джерелом життя нашої зростаючої армії, і ми повинні подбати про те, щоб випереджати наше використання ресурсів."
 itz_commercial_subsidies:0 "Комерційні субсидії"
 itz_commercial_subsidies_desc:0 "Зі зростанням нашої торгівлі з іншими країнами має зростати і наша промисловість. Виробництво споживчих товарів та експлуатація природних ресурсів є життєво важливими для успіху Іца як торговельної нації. За допомогою стимулів і грантів ми можемо почати будувати фабрики в певних населених пунктах і таким чином розширювати нашу економіку."
 itz_tariff_imports:0 "Тарифи на імпорт"
 itz_tariff_imports_desc:0 "Коли в нашій країні запроваджується комерція будь-якого роду, ми повинні подумати про те, як отримати з цього найбільшу вигоду. Незалежно від стану нашої нації, певна частина нашої промисловості завжди буде присвячена торгівлі предметами розкоші. Хоча це може відштовхнути деяких наших потенційних партнерів, ми повинні дозволити цьому капіталу повертатися в Іца через оподаткування товарів не першої необхідності."
 itz_increase_military_infrastructure:0 "Розширити військову інфраструктуру"
 itz_increase_military_infrastructure_desc:0 "Від доріг до їжі та боєприпасів — є багато «рухомих частин», на які покладається армія, щоб продовжувати марш. Наразі спроможність нашої нації утримувати та забезпечувати нашу армію є недостатньою, і необхідно вжити заходів, щоб це не паралізувало нашу армію. Краще використовуючи нашу військову промисловість, ми можемо гарантувати, що кожен завод слугуватиме своєрідним контрольно-пропускним пунктом для постачання та пересування нашої армії."
 itz_more_more_more:0 "Більше, більше, більше!"
 itz_more_more_more_desc:0 "Чоловіки, які воюють за Іца, тяжко працюють і вмирають у джунглях і горах, і можна з упевненістю сказати, що ті, хто працює на заводах Іца, не зазнають подібного напруження. Хоча це може позначитися на якості наших оброблених ресурсів і виробленого обладнання, ми більш ніж здатні розширити наш випуск продукції. Серія драконівських квот разом із набагато виснажливішим робочим графіком зміцнить наші заводи."
 itz_increase_support_companies:0 "Збільшити роти забезпечення"
 itz_increase_support_companies_desc:0 "З формуванням більш сучасних військових сил наші пріоритети змінилися та адаптувалися. Наша армія більше не може бути просто піхотою на землі, натомість вона має бути доповнена меншими автономними групами. Чи то небойові підрозділи, чи підрозділи, що використовують спеціальне обладнання або доктрину, — ці війська підтримки повинні використовуватися в усій нашій армії."
 itz_expand_the_border_fortifications:0 "Створити місцеве ополчення"
 itz_expand_the_border_fortifications_desc:0 "Хоча ідея згуртованої, єдиної армії захоплює, є деякі фактори, що перешкоджають її створенню. Хоча ми маємо великі населені пункти, значна частина нашого населення — це робітники, розкидані серед менш розвинених частин нашої країни. Щоб наша армія досягла успіху, вона повинна належним чином використовувати місцевих призовників та сили оборони, хоча їм може бракувати навичок та спорядження наших більш досвідчених бійців."
 itz_streamline_military_industry:0 "Оптимізувати військову промисловість"
 itz_streamline_military_industry_desc:0 "Повертаючи нашу армію та промисловість від політичної залежності, ми виявили певну неефективність у тому, як керують нашими заводами. Від невиконаних квот до корумпованих наглядачів заводів, що беруть хабарі, — ми можемо багато чого зробити, щоб покращити темпи та якість наших виробничих ліній. Нове керівництво та узгоджені правила і процедури вирішать ці проблеми."
 itz_emergency_factory_conversion:0 "Екстрена конверсія заводів"
 itz_emergency_factory_conversion_desc:0 ""
 itz_the_next_plan:0 "Наступний план?"
 itz_the_next_plan_desc:0 ""
 itz_encourage_settlement_growth:0 "Заохочувати зростання поселень"
 itz_encourage_settlement_growth_desc:0 "Перехід від аграрності до індустріалізму є важким і раптовим, він представляє радикальну зміну способу життя, яку наші люди, можливо, не захочуть легко прийняти. Якщо ми хочемо продовжувати зростання наших промислових центрів, ми повинні стимулювати працююче та боєздатне населення мігрувати вглиб країни, до більш густонаселених районів."
 itz_establish_the_kalomtes_factories:0 "Заснувати заводи Каломте"
 itz_establish_the_kalomtes_factories_desc:0 "На даний момент наша промисловість досить добре розподілена по землях, якими ми володіємо. Однак ми повинні враховувати ймовірність того, що можемо втратити контроль над певною частиною нашої країни та промисловістю в ній. Хоча така подія може ніколи не статися, ми все одно повинні убезпечити себе від неї, використовуючи державні заводи прямо в столиці, під наглядом і керівництвом самого Каломте."
 itz_freedom_is_slavery:0 "Свобода — це рабство"
 itz_freedom_is_slavery_desc:0 "Відповідно до ідеології, представленої в «1984», ми повинні переосмислити спосіб життя та мислення наших громадян, як цивільних, так і військових. Люди цінні лише настільки, наскільки вони служать державі, а комфорт, надмірність і особисті переконання — це просто тягар, який їм потрібно подолати. Народ Іца повинен працювати ще старанніше, відкидаючи свої ідеології та застереження в ім'я великого майбутнього для всіх — за будь-яку ціну для особистості."
 itz_the_home_front:0 "Внутрішній фронт"
 itz_the_home_front_desc:0 "Коли нашу поліцію посилено, а людей мобілізовано, ми повинні гарантувати, що зможемо продовжувати нашу консолідацію. Експлуатація природних ресурсів залишається вузьким місцем для військово-промислового комплексу, яке ми можемо вирішити, поглянувши всередину. «Мотивуючи» простого робітника дулом пістолета, ми можемо забезпечити ефективнішу робочу силу для збору ресурсів і, своєю чергою, краще постачати нашу армію."
 itz_encourage_officer_promotion:0 "Заохочувати підвищення офіцерів"
 itz_encourage_officer_promotion_desc:0 "Щоб наші сили спеціального призначення досягли успіху, кожен боєць у загоні має бути добре навченим і освіченим. Кожен Меродеадор має бути сміливим і хитрим, а також глибоко розуміти тактику та військову справу. Так сталося, що ці риси є настільки ж ідеальними і для лідера групи. Ми повинні розглянути можливість залучення до нашого військового керівництва людей з лав спецпризначенців."
 itz_all_purpose_units:0 "Покращена підтримка флоту"
 itz_all_purpose_units_desc:0 "Починаючи боротьбу з більшими та сильнішими ворогами, ми виявили, що військово-морська доктрина, якою ми керувалися досі, має недоліки. Якщо раніше тактика раптового нападу з моря була ефективною, то тепер ми почали стикатися з більш компетентними та чисельними флотами, що блокують використання наших Меродеадорес. Ми повинні забезпечити не лише кваліфіковану морську піхоту, а й флот для її захисту та транспортування."
 itz_regimental_pride:0 "Полкова гордість"
 itz_regimental_pride_desc:0 "Оскільки Меродеадорес розширюються, а їхні дії стають легендами, служба в них стала бажаною посадою серед наших військових. Не бракує солдатів, які мають ініціативу та навички, щоб вступити до їхніх лав, і тепер, коли вони починають хапатися за цю можливість, ми повинні розглянути питання про включення їх до дивізій морської піхоти."
 itz_one_fighting_force:0 "Єдина бойова сила"
 itz_one_fighting_force_desc:0 "Під час перерозподілу та реорганізації наших збройних сил стало зрозуміло, що існує певний розрив між різними частинами нашої армії. Між родами військ чи навіть між дивізіями бракує комунікації та злагодженості, що дорого коштує ефективності нашої армії. Доклавши часу та зусиль, ми зможемо зробити кроки до збільшення чисельності та ефективності нашої армії."
 itz_an_elite_force:0 "Елітна сила"
 itz_an_elite_force_desc:0 "Сили спеціального призначення більш ніж довели свою корисність для нашої нації, і ми повинні забезпечити впровадження подібної теорії та практики в ширшому масштабі. Хоча це може означати більш виснажливі процедури тренувань, ми можемо гарантувати, що навіть наша базова піхота діятиме цілеспрямовано та злагоджено. Більша дисципліна, краща тактика та тренування в екстремальних умовах вдосконалять нашу армію."
 itz_the_art_of_war:0 "Мистецтво війни"
 itz_the_art_of_war_desc:0 "Хоч би якою дисциплінованою була наша армія, успіх її операцій значною мірою залежить від спорядження, яке вона має. Зброя, яку зараз носять наші війська, стане реліктом у прийдешні роки, і ми повинні забезпечити паритет з нашими ворогами шляхом швидкого вдосконалення наших збройових технологій."
 itz_civilised_times:0 "Цивілізовані часи"
 itz_civilised_times_desc:0 "За порівняно короткий проміжок часу ми досягли значних успіхів як у торгівлі, так і в промисловості. Значне пожвавлення торгівлі та виробництва дозволило нам розширити наші можливості як нації, а також підвищити рівень життя. Хоча це може викликати неабияке хвилювання серед консервативних верств нашого населення та уряду, ми повинні прагнути бути осілою, цивілізованою нацією."
 itz_the_kalomtes_academy:0 "Академія Каломте"
 itz_the_kalomtes_academy_desc:0 "Хоча наша економічна експансія загалом спрямована всередину, ми все одно повинні орієнтуватися на показники наших суперників. Якщо ми дозволимо нашим матеріалам і методам виробництва відстати, наші вороги з часом можуть нас перевершити. З цією метою ми повинні поглиблювати наші знання, щоб залишатися конкурентоспроможними. Група умів, відданих Каломте, збереться разом, прагнучи зміцнити технологічну могутність нації."
 itz_dominate_the_caribbean_trade:0 "Домінувати в карибській торгівлі"
 itz_dominate_the_caribbean_trade_desc:0 "Враховуючи наш значний плацдарм у Карибському морі, Мексиканській затоці та прилеглих землях, ми повинні почати думати про те, як найкраще перевершити наших суперників, використовуючи надані нам переваги. Розвиток нашого флоту гарантуватиме, що Іца зможе підтримувати певний рівень панування над своїми сусідами, перекриваючи їхні торгові шляхи та лінії постачання."
 itz_ignorance_is_strength:0 "Незнання — це сила"
 itz_ignorance_is_strength_desc:0 "Світ простягається лише доти, доки простягається Іца та її народ, бо всі або з нами, або проти нас. З цією метою ми повинні забезпечити, щоб люди завжди дивилися всередину, на безпеку та прогрес цієї великої нації. Якщо наші люди стикаються з іншими культурами чи народами, вони повинні реагувати лише з відразою та націоналістичним запалом. Хоча це може позначитися на нашому розумінні інших націй, це найкращий варіант для майбутнього Іца."
 # Itzan Expansion Tree
 ## Revanchism Section
 itz_itzan_revanchism:0 "Іцанський реваншизм"
 itz_itzan_revanchism_desc:0 "Серед усіх внутрішніх конфліктів у нашій армії та керівництві ми дещо втратили свою присутність у світі в цілому. Мир на континенті є швидкоплинним і рідкісним, і ми оточені з усіх боків суперниками, які прагнуть залякувати та підкорювати. Якщо ми хочемо перемогти і повернути те, що належить нам по праву, ми повинні підготувати уряд і народ до жорстокої тотальної війни."
 ### Tzotzil Subtree
 itz_the_worshipers:0 "Шанувальники"
 itz_the_worshipers_desc:0 "Трохи на південь від нас знаходиться Тьєрра-де-лос-Цоціль, нація, кордони якої з нами визначаються лише річками Ріо-Гріхальва та Ріо-Усумасінта. Враховуючи їхню схожу релігію та етнічний склад, можна сказати, що поділ між Іца та Цоціль є тонким, якщо не відсутнім взагалі. Ми повинні належним чином обміркувати, чому саме вони є окремою нацією, а не просто частиною нашої власної."
 itz_reintegration_motions:0 "Ініціативи з реінтеграції"
 itz_reintegration_motions_desc:0 "Можна з достатньою впевненістю сказати, що земля, яку займає Тьєрра-де-лос-Цоціль, — це наша законна земля, а їхній народ — наш народ. Ми повинні взяти території Цоціль під свій контроль і підпорядкувати нашому уряду, навіть якщо це загрожує дипломатичним конфліктом. Зрештою, що ми за нація, якщо не можемо належним чином подбати про наших людей і нашу землю?"
 itz_loyalty_through_fear:0 "Вірність через страх"
 itz_loyalty_through_fear_desc:0 "Після усунення самопроголошеного уряду Тьєрра-де-лос-Цоціль ми повинні закріпити наш контроль над їхніми територіями та людьми. Хоча це призведе до значного зменшення населення земель Цоціль, необхідно запровадити повномасштабну військову окупацію разом із демонстрацією сили. Зрештою, щоб поставити Цоціль на місце, ми повинні спочатку «прибрати» все, що не підходить."
 itz_close_yet_seperate:0 "Близькі, але окремі"
 itz_close_yet_seperate_desc:0 "Хоча поділ між Іца та Цоціль є доволі умовним, немає потреби в крайніх заходах, коли є простіший варіант. Замість того, щоб інтегрувати їхніх людей і землі в нашу державу, ми можемо просто взяти під контроль їхню націю, дозволивши їхньому уряду певний ступінь контролю та автономії."
 itz_loyalty_through_love:0 "Вірність через любов"
 itz_loyalty_through_love_desc:0 "Розпочавши переговори з Цоціль і взявши їх під своє крило, ми показали, що дипломатія є можливим варіантом, і заклали основу для більших здобутків і прогресу. Ми отримали їхню покору, і тепер повинні завоювати їхнє захоплення. Політичний шлюб об'єднає наші два уряди і закріпить Цоціль як вічних союзників."
 itz_invest_in_tzotzil:0 "Інвестиції в Цоціль"
 itz_invest_in_tzotzil_desc:0 "Тепер, коли Цоціль твердо перебуває у нашій сфері впливу, ми повинні подумати про те, як краще використовувати цю землю та людей. Певний нагляд та інвестиції дозволять нам зміцнити промисловість у цьому регіоні та підвищити його цінність для нас."
 ### Caribbean Subtree
 itz_irridentism_in_the_caribbean:0 "Ірредентизм у Карибському басейні"
 itz_irridentism_in_the_caribbean_desc:0 ""
 itz_further_the_fleet:0 "Розвивати флот"
 itz_further_the_fleet_desc:0 "Якщо ми хочемо стати великою державою і продемонструвати свою могутність суперникам, ми повинні мати перевагу на морі так само, як і на суші. Наші кораблі мають бути вдосконалені: від корпусів, які ми використовуємо, до методів комплектування екіпажів та озброєння наших суден."
 itz_build_naval_transports:0 "Розширити торговельний флот"
 itz_build_naval_transports_desc:0 "Для збільшення нашої присутності на морі військові кораблі є життєво важливими. Однак, якщо ми плануємо належним чином використовувати нашу морську перевагу, ми повинні керувати й цивільним флотом. Швидке будівництво нових конвоїв дозволить нам краще торгувати і переправляти війська через захищені води для допомоги в наших війнах."
 itz_reclaim_lost_bases:0 "Повернути втрачені бази"
 itz_reclaim_lost_bases_desc:0 ""
 itz_final_effort:0 "Останній ривок"
 itz_final_effort_desc:0 ""
 ### Honduras Subtree
 itz_the_mercenaries:0 "Найманці"
 itz_the_mercenaries_desc:0 "Карибський басейн з нами ділять Геррерос-де-Гондурас, войовнича нація, що межує з нами на суші та на морі. Враховуючи їхнє розташування на південь від нашої країни, можна сказати, що ми є їхнім ключем до Мексики та Північної Америки. З такими войовничими типами ймовірність експансіонізму висока, і ми повинні забезпечити мир між нашими країнами, якщо хочемо бути в безпеці."
 itz_worthy_allies:0 "Гідні союзники"
 itz_worthy_allies_desc:0 "Геррерос могутні у війні та в мирі, маючи значну регулярну армію та рішучих лідерів. Ми не можемо розраховувати просто підкорити їхні народи, і ми не можемо розглядати варіант війни, коли намагаємося встановити мир на наших кордонах. Взаємна домовленість, ймовірно, є нашим найкращим варіантом, і це, безперечно, те, чого ми можемо досягти з часом."
 itz_a_marriage_of_strength:0 "Шлюб сили"
 itz_a_marriage_of_strength_desc:0 "Геррерос схожі на нас у багатьох відношеннях, адже ми обидва маємо потужні армії та проникливих лідерів. Хоча вони є великим активом, вони так само можуть стати великою загрозою, якщо їх належним чином не залучити до співпраці. Об'єднати наші нації — це те, що можна зробити легко, адже це так само просто, як одружити нашого розумного, могутнього лідера з їхнім."
 itz_humble_servants:0 "Смиренні слуги"
 itz_humble_servants_desc:0 "За нинішніх обставин Геррерос є загрозою нашій національній безпеці, а їхні кордони з нами на суходолі та на морі є нагальною проблемою. Стало зрозуміло, що цю націю ніколи не вдасться схилити до бездіяльності, тому, якщо ми хочемо рухатися вперед, вони є проблемою, яку треба вирішити. Ми повинні завдати удару зараз, інакше ризикуємо зіткнутися з їхньою експансією."
 itz_a_subject_of_strength:0 "Підданий сили"
 itz_a_subject_of_strength_desc:0 "Зайве казати, що Геррерос-де-Гондурас знають, як поводитися зі зброєю. Коли ми інтегруємо їхні землі та людей, стає зрозуміло, що є дуже багато ветеранів, які прагнуть знайти мету перед обличчям нашого завоювання. Хоча просто інтегрувати їх у нашу армію може бути ризиковано, ми не бачимо причин, чому вони не можуть бути частиною промисловості, яка живить нашу військову машину."
 itz_invest_in_honduras:0 "Інвестувати в Гондурас"
 itz_invest_in_honduras_desc:0 "Земля і народ Гондурасу дуже корисні для нас, і залучення їх до нашої сфери впливу має передбачати оптимізацію наших прибутків. Ландшафт Гондурасу досить обширний, вкритий джунглями і розділений великими горами. Більше того, нинішня інфраструктура вкрай слабо розвинена. Навігація їхніми землями та використання їхніх ресурсів має включати період розвитку з будівництвом нових доріг."
 ## Awake and Angry Section
 itz_question_of_the_aztlan:0 "Питання Ацтлана"
 itz_question_of_the_aztlan_desc:0 "Тепер, коли наші сухопутні та морські кордони захищені краще, ніж раніше, ми повинні подумати про просування інтересів нашої об'єднаної нації. Ацтлан був скалкою в нашому боці з незапам'ятних часів, і для того, щоб справді прогресувати як народ, з ними треба розібратися. Ще не час для тотальної війни, але ми повинні розглядати кожну нашу дію як прелюдію до таких заходів."
 itz_awake_and_angry:0 "Пробуджені та розлючені"
 itz_awake_and_angry_desc:0 "Увесь наш прогрес, уся наша боротьба були заради цього. Ми вже відчули смак небезпеки, але ніщо не зрівняється з тим, що ми повинні зробити зараз. Наша армія об'єднана, наші південні та східні кордони укріплені й готові. Настав час розширитися в Мексику і стати імперією, якою ми справді заслуговуємо бути."
 ### Technocrats Subtree
 itz_deal_with_the_technocrats:0 "Розібратися з технократами"
 itz_deal_with_the_technocrats_desc:0 "Протягом довгого часу нашим північним кордоном було Петро-Чіко, нація техно-дикунів, які можуть неабияк загальмувати нашу стрімку експансію. Більше того, вони, схоже, перебувають під каблуком у вищої сили, яка керує ними так чи інакше. Щоб рухатися вперед, ми повинні розібратися як з дикунами, так і з силою, що стоїть над ними, хоч би чим вона була."
 itz_crush_petro_chico:0 "Роздавити Петро-Чіко"
 itz_crush_petro_chico_desc:0 "Простіше кажучи, немає інших дій, окрім радикальних. Доки існує Петро-Чіко, воно буде небезпекою для нашої нації, і, схоже, мирного шляху вирішення проблеми з ними не існує. Вони несамовито вірять, що кінець світу настане знову, і будуть битися до останнього, якщо це означає захист їхніх людей від нього. Ми повинні стати їхнім апокаліпсисом."
 itz_scavenge_the_ruins:0 "Обшукати руїни"
 itz_scavenge_the_ruins_desc:0 "Одержимі технологіями, Петро-Чіко мали запаси електроніки та довоєнних технологій, навіть якщо вони не знали, як ними користуватися. Хоча ці скарби можуть бути добре сховані, їх пошук і використання знайдених матеріалів стануть великим благом для нашої нації. Зрештою, нам завжди знадобиться більше таких рідкісних ресурсів."
 itz_enforce_military_rule:0 "Запровадити військове правління"
 itz_enforce_military_rule_desc:0 "Хоча Петро-Чіко доблесно захищалися, ми не повністю вичистили їхніх людей із земель, які вони колись займали. Ми сподівалися інтегрувати більшість населення, але, схоже, є багато тих, хто не здасться просто так. Військова окупація провінцій та швидке «усунення» найбільш непристосованих елементів дозволить нам повністю інтегрувати Петро-Чіко."
 itz_exploit_the_remnants:0 "Експлуатувати залишки"
 itz_exploit_the_remnants_desc:0 "Коли Петро-Чіко зникло, а їхня земля тепер наша, настав час з'ясувати, як найкраще використати провінції, які ми захопили. З того, що ми знайшли в їхніх межах, найбільш помітним є низка довоєнних комплексів. Хоча вони занедбані, ці будівлі будуть корисні для розширення нашої промисловості на нових землях."
 itz_crush_the_army_of_mexico:0 "Роздавити [ARM.GetName]"
 itz_crush_the_army_of_mexico_desc:0 "Зі знищенням Петро-Чіко покровителі племінної нації виявили себе у всій своїй могутності. Ехерсіто Мехікано, яке є водночас морською державою та нацією-суперником, — це наступна загроза, яку нам треба усунути на шляху нашого зростання. Боротьба з ними буде великою війною з багатьма втратами, але це необхідно зробити."
 itz_disassemble_local_factories:0 "Розібрати місцеві заводи"
 itz_disassemble_local_factories_desc:0 "Хоча присутність Санта-Анни, безумовно, вичищена з земель, якими він колись володів, немає причин не бути ретельними, враховуючи його войовничу та хитру натуру. Вивезення майстерень і робочої сили з земель Мехікано та розміщення їх у глибині нашої території дозволить нам краще контролювати здобуту промисловість."
 itz_occupy_the_coastline:0 "Окупувати узбережжя"
 itz_occupy_the_coastline_desc:0 ""
 itz_menace_of_the_gulf:0 "Загроза із Затоки"
 itz_menace_of_the_gulf_desc:0 "Коли Ехерсіто Мехікано зникло, а їхні землі тепер наші, ми ще більше зміцнили наш контроль над Мексиканською затокою. Ми повинні належним чином використовувати наші нові прибережні штати, запроваджуючи нові верфі та вивчаючи нині неіснуючий флот Мехікано, щоб зрозуміти, як покращити наш власний флот."
 itz_move_settlers_in:0 "Заселити поселенців"
 itz_move_settlers_in_desc:0 "Щоб по-справжньому інтегрувати землі Мехікано в нашу націю, ми повинні забезпечити лояльність населення цих штатів до нас. Шляхом примусового переселення тих, хто вже там живе, і впровадження наших власних громадян, ми зможемо справді закріпити наш контроль. Зробивши це, ми нарешті зможемо повною мірою використати землю та людей, яких ми захопили."
 ### Aztlan Final Subtree
 itz_deal_with_the_aztlan:0 "Розібратися з Ацтланом"
 itz_deal_with_the_aztlan_desc:0 "Попри весь прагматизм, який ми привнесли в нашу націю, залишилася одна скалка — надто близька, надто особиста. Поки ми зростали в силі та впливі, Ацтлан був поруч, завжди скрегочучи зубами і стоячи надто близько до прірви ще однієї Квіткової війни. Поставивши нашого одвічного ворога на коліна, ми нарешті закріпимо своє місце як справжні правителі Мезоамерики!"
 itz_no_choice_in_the_matter:0 "Без права вибору"
 itz_no_choice_in_the_matter_desc:0 "Ми повинні були це передбачити. Було цілком природно, що наші вороги будуть рухатися швидше, ніж темп нашого керівництва. Хоча ми не планували кидатися з головою в таку важливу війну, ми повинні робити так, як робили завжди — адаптуватися. Ми повинні рухатися вперед, завдати рішучого удару і нарешті принести мир нації."
 itz_atz_destruction:0 "Знищення"
 itz_atz_destruction_desc:0 "Війна з Ацтланом ніколи не ставилася під сумнів. Для декого з нас ми завжди були у стані війни з Ацтланом. Ми закляті вороги, назавжди приречені залякувати одне одного до бездіяльності. Незалежно від того, наскільки млявим став конфлікт, ми повинні обрушити всю міць нашої нової імперії Іца на Ацтлан. Війна на кордонах неминуча, хоча, здається, ніхто не буде протестувати."
 itz_place_pressure_on_costa:0 "Тиск на [CAF.GetName]"
 itz_place_pressure_on_costa_desc:0 "Оскільки конфлікт розширюється та загострюється, ми повинні дивитися не лише на наших ворогів, а й на нейтральні сили в регіоні. Серед тих, хто не присягнув тій чи іншій стороні, немає нікого більш помітного, ніж торгова нація на півдні. Коли лояльність купується і продається, як у капіталістів, яка може бути шкода від того, щоб силою змусити їх стати на своє місце?"
 itz_one_last_fight:0 "Останній бій"
 itz_one_last_fight_desc:0 "Час для безглуздого зволікання та надмірної бюрократії давно минув. Сумнівно, що у світі може бути щось більш нагальне, ніж війна між нами та Ацтланом. Хоча кістки можуть ламатися, а плоть вкриватися синцями, дух Іца палає в серцях людей. Якщо ми хочемо покласти край цьому конфлікту, який поранив так багато людей, ми повинні діяти, і діяти зараз."
 itz_emergency_measures:0 "Надзвичайні заходи"
 itz_emergency_measures_desc:0 ""
 itz_pick_up_the_debris:0 "Розібрати уламки"
 itz_pick_up_the_debris_desc:0 "Ацтлан зник, наш найстаріший ворог переможений. Після нашого тріумфу ми повинні увійти в період консолідації, включаючи те, що колись належало ворогу, і роблячи це своїм власним. Їхні землі, ресурси та люди тепер наші, підвладні могутності великої нації Іца."
 itz_atz_diplomacy:0 "Дипломатія"
 itz_atz_diplomacy_desc:0 "Як нація, ми виросли. Зараз ми більші за якийсь дрібний, давно мертвий конфлікт. Набагато більші. Як ми можемо розраховувати керувати тим, що маємо, якщо продовжуватимемо постійно зазіхати на наших сусідів? Квіткові війни повинні закінчитися, а рани, які вони залишили, — загоїтися. Ми повинні дбати не лише про себе, а й про тих, перед ким ми відступили. Заради добра нашого майбутнього."
 itz_conference_of_la_tumba:0 "Виконати весільні обітниці"
 itz_conference_of_la_tumba_desc:0 "Хоча це буде болісно в найближчому майбутньому, необхідно піти на жертви, щоб закріпити успіхи, досягнуті в нашій дипломатії. Суть Квіткових війн полягала в тому, щоб брати те, що ми вважали своїм, ні більше, ні менше. Якщо ми хочемо гарантувати, що ці війни ніколи не почнуться знову, ми повинні схилитися цього разу і відмовитися від своїх претензій на землі, що належать Ацтлану."
 itz_a_great_wedding:0 "Велике весілля"
 itz_a_great_wedding_desc:0 "Повідомлення надіслано; міст побудовано. Безперервна, безглузда війна між Іца та Ацтланом закінчена і завершена. Ми повинні забезпечити, щоб такий мир залишався на кордоні назавжди, і для цього є один безвідмовний спосіб. Ми об'єднаємо сім'ї з Ацтланом, видавши нашу сміливу та розумну Клару заміж за ацтланця рівного престижу та статусу."
 itz_mesoamerican_alliance:0 "Справжня єдність"
 itz_mesoamerican_alliance_desc:0 "Рішучими діями та продуманими переговорами ми зробили те, що колись вважали неможливим, поклавши край війні, яка переслідувала історію нашої нації. Разом із цим миром прийшло дивне почуття патріотизму, що наповнило серця наших людей. Наші солдати марширують і тренуються з радістю, наш уряд працює бездоганно, а люди глибоко, щиро щасливі."
 itz_wartime_operational_integration:0 "Оперативна інтеграція воєнного часу"
 itz_wartime_operational_integration_desc:0 ""
 ### AI Subtree
 itz_deal_with_the_ai:0 "Розібратися зі ШІ"
 itz_deal_with_the_ai_desc:0 "Штучний правитель Мексики завжди був проблемою без простого вирішення. Зі «смертю» Тлалока ця проблема перетворилася з поганої на ще гіршу, і хоча це може поранити нас, необхідні дії. Неконтрольований, нестабільний розум, що зараз при владі, погрожує знищити нас, і нам потрібно почати діяти зараз."
 itz_examine_the_new_threat:0 "Вивчити нову загрозу"
 itz_examine_the_new_threat_desc:0 "Ми ніколи раніше не стикалися з таким ворогом. Сказати, що ми хоч якось підготовлені, — це нахабна брехня, яку можна викрити за лічені місяці. Хоча ми можемо опинитися в ситуації, коли доведеться битися наосліп, стикаючись із сюрпризом за сюрпризом, ми повинні бути максимально підготовлені до цієї війни. Вдосконалення нашої військової стратегії є на часі."
 itz_adapt_our_tactics:0 "Адаптувати нашу тактику"
 itz_adapt_our_tactics_desc:0 "Використовуючи наш інтелект якнайкраще, ми повинні проаналізувати цю синтетичну загрозу в повному обсязі та спробувати зрозуміти її слабкі сторони. Знаходження прогалини у військовій машині ШІ може стати різницею між успіхом і поразкою, зміцнюючи не лише здатність нашої армії боротися, а й нашу рішучість довести цю війну до кінця."
 itz_recreate_technology:0 "Відтворити захоплені технології"
 itz_recreate_technology_desc:0 "Реверс-інжиніринг — це руйнівна техніка, і наша нація погано оснащена для цього. Проте, не бракує роботизованих матеріалів для вивчення та розуміння. Якщо ми зможемо піднятися до рівня наших суперників, ми зможемо не лише вести гонку озброєнь на їхній території, а й використовувати цю технологію в наших майбутніх починаннях."
 itz_fighting_toe_to_toe:0 "Бій на рівних"
 itz_fighting_toe_to_toe_desc:0 ""
 itz_prepare_fallback_lines:0 "Підготувати лінії відступу"
 itz_prepare_fallback_lines_desc:0 "Ворог, з яким ми стикаємося, є могутнім, його промислова та військова сила становлять екзистенційну загрозу для Іца та її народу. Синтетична загроза, з якою ми стикаємося, є безпомилковою і легко замінюваною, тому для початку ми не можемо розраховувати на утримання нашої лінії. Укріплення в глибині країни та підготовка до оборонної війни будуть ключовими."
 itz_evacuate_aristocracy:0 "Евакуювати аристократію"
 itz_evacuate_aristocracy_desc:0 ""
 itz_evacuate_industry:0 "Підготувати евакуацію промисловості"
 itz_evacuate_industry_desc:0 "За нинішнього стану наша промисловість простягається надто далеко від нашої столиці, тому існує підвищений ризик як бомбардувань, так і окупації. Ми повинні розглянути ймовірність того, що нам доведеться відступати аж до самого Чичен-Іца, і гарантувати, що ми зможемо продовжувати постачати та оснащувати нашу армію перед лицем таких жахливих обставин."
 itz_evacuate_resources:0 "Підготувати евакуацію ресурсів"
 itz_evacuate_resources_desc:0 "Хоча ми не можемо зібрати і перенести наші основні місця видобутку, є певна частина переробки та експлуатації ресурсів, яку можна перемістити. Як і з нашими заводами, нам потрібно централізувати виробництво ресурсів у самій столиці, готуючись до похмурої ймовірності втрати величезних територій."
 itz_resurgence_and_reconquest:0 "Відродження та відвоювання"
 itz_resurgence_and_reconquest_desc:0 "Синтетична загроза не є незнищенною, хоча на перший погляд може здатися такою. Ми можемо знищити їхні машини і змусити їхнього правителя-ШІ стікати кров'ю (мастилом). Ми повинні вкласти все, що маємо, у цю війну, або зіткнутися з вимиранням. Ми повинні згуртувати наших людей, зібрати зброю і підготуватися до контратаки. Якщо все піде добре, ми зможемо перемогти."
 ## Itza Supreme Section
 itz_itza_supreme:0 "Іца панує"
 itz_itza_supreme_desc:0 "І ось так просто ми це зробили. Усі, хто наважився виступити проти нас, або впали, або схилилися перед могутністю Іца та її народу. Мезоамерика наша, і всіх наших історичних суперників та ворогів більше немає, щоб зупинити нас. Ми наділені силою, цілеспрямовані, і тепер настав час використати наш імпульс і гарантувати, що імперія Іца буде увічнена в історії назавжди!"
 itz_unifying_mexico:0 "Об'єднання Мексики"
 itz_unifying_mexico_desc:0 ""