l_english:
# Decisions
 itz_integrating_countdown:0 "Прогрес інтеграції"
 itz_integrating_countdown_desc:0 "Коли таймер завершиться, ми інтегруємо [TDT.GetName]."
 itz_pet_border_clash:0 "Сутичка за Сталеве Місто"
 itz_pet_border_clash_desc:0 "Вперед — до узбережжя!"
 itz_harvest_2275_timer:0 "Відлік до Дня К'ан"
 itz_harvest_2275_timer_desc:0 "Ще один рік на полях поступово добігає кінця, і скоро настане час збирати врожай. Будемо сподіватися, що ми зберемо хороший урожай!"
 itz_harvest_timer:0 "Відлік до Дня К'ан"
 itz_harvest_timer_desc:0 "Ще один рік на полях поступово добігає кінця, і скоро настане час збирати врожай. Будемо сподіватися, що ми зберемо хороший урожай!"
 itz_increase_exemptions:0 "Розширити звільнення від служби на селі"
 itz_increase_exemptions_desc:0 "Найкращий спосіб забезпечити вдалий день К'ан — мати більше людей, що доглядають за полями. Ми повинні розширити звільнення від служби для селян, щоб зробити саме це і гарантувати, що голод ніколи не спіткає цю землю."
 itz_reduce_exemptions:0 "Скоротити звільнення від служби на селі"
 itz_reduce_exemptions_desc:0 "Імовірність голоду є незначною, якщо наші ферми та міста будуть спалені ворогом. Армії потрібно більше людей!"
 itz_ritualistic_sacrifice:0 "Принести жертву Хун-Наль-Є"

 # Power Struggle Decisions
 itz_power_struggle_timer:0 "Відлік до Ради Старійшин"
 itz_power_struggle_timer_desc:0 "Після поранення Каломте була скликана Рада Старійшин, щоб визначити, хто має стати його регентом і наступником. Ми повинні зробити все можливе, щоб обрали саме нас!"
 itz_call_early_vote:0 "Вимагати дострокового голосування"
 itz_call_early_vote_desc:0 "Якщо стало зрозуміло, що ми є домінуючим кандидатом у перегонах за місце Каломте, ми можемо використати свій вплив, щоб скликати Раду Старійшин раніше, забезпечивши нашу перемогу вже зараз."
 itz_raid_ejerico_congress:0 "Рейд на штаб-квартиру Ехерсіто"
 itz_raid_ejerico_congress_desc:0 "Час від часу країна потерпає від банд мародерів або злочинців. Тому цілком правдоподібно, що одна з таких банд, підбадьорена вакуумом влади після поранення Каломте, здійснить напад на комплекс Ехерсіто, чи не так?"
 itz_clara_appear_with_kalomte:0 "З'явитися разом із Каломте"
 itz_clara_appear_with_kalomte_desc:0 "Клара не має проблем із підтримкою в державних механізмах. Зрештою, Клара роками призначала лоялістів на ключові посади. Однак Клара бореться за легітимність в очах громадськості, і чудовим способом покращити це було б підкреслити зв'язок між Кларою та пораненим Каломте."
 itz_clara_try_to_treat_kalomte:0 "Спробувати вилікувати Каломте"
 itz_clara_try_to_treat_kalomte_desc:0 "Ще одне вирішення проблеми легітимності Клари — спроба вилікувати Каломте. Хоча успіх малоймовірний, це створить у громадськості враження, що Клара не прагне влади, на відміну від схибленого на владі Карлоса."
 itz_clara_beef_up_merodeadores:0 "Підсилити Меродеадорес"
 itz_clara_beef_up_merodeadores_desc:0 "Хоча її оплотом є держава, час перебування Клари в Меродеадорес і подальша вигідна політика щодо цього органу означають, що Клара може покластися на Меродеадорес у скрутну хвилину. Тому збільшення їхньої чисельності не матиме жодних недоліків!"
 itz_ej_raid_merodeadores_complexes:0 "Рейд на штаб-квартиру Меродеадорес"
 itz_ej_raid_merodeadores_complexes_desc:0 "Тоді як Карлос може заручитися підтримкою Ехерсіто та Вач, Клара зберігає контроль над елітними Меродеадорес. Хоча вони надто нечисленні, щоб становити загрозу в громадянській війні, їх достатньо, щоб запобігти будь-яким спробам перевороту і навіть здійснювати рейди на наші комплекси. Тому ми повинні здійснити превентивний рейд на їхній командний комплекс під приводом національної безпеки."
 itz_ej_hold_parade:0 "Провести військовий парад"
 itz_ej_hold_parade_desc:0 "Ніщо так не надихає гордість і вірність серед населення, як хороший військовий парад. Давайте влаштуємо його і вразимо Старійшин своєю могутністю!"
 itz_ej_encourgae_conscripts:0 "Заохочувати призовників"
 itz_ej_encourgae_conscripts_desc:0 "Нашою головною опорою є Ехерсіто. Тому заохочення призову до Ехерсіто має сенс, особливо якщо ми змінимо наші навчальні програми, додавши трохи більше ідеологічної обробки!"
 itz_ej_mil_to_civ_fac:0 "Виробляти товари широкого вжитку"
 itz_ej_mil_to_civ_fac_desc:0 "Завдяки рокам тактичного розширення Ехерсіто безпосередньо володіє великою кількістю військових заводів. Якби ми перепрофілювали деякі з цих заводів на виробництво цивільних товарів, люди поставилися б до нас прихильно."

 # Decision Categories
 itz_power_struggle:0 "Велика гра"
 itz_power_struggle_desc:0 "«Велика гра» почалася, і влада витає в повітрі! Ті'хуун Клара скликала Раду Старійшин — і головним пунктом порядку денного є спадкоємність Каломте. Очікується, що сама Ті'хуун переможе в боротьбі, але Ехерсіто розуміє, що це означатиме кінець їхньої організації в тому вигляді, в якому вони її знають, — і зробить усе можливе, щоб запобігти цьому результату. \n\nНастрій Старійшин відображається §RПопулярністю партії§!. Фракція з найбільшим впливом на момент засідання Ради буде призначена Регентом і Спадкоємцем.\n\nВПЛИВ:                     Клара:   [?party_popularity@intellectuals|%G0]                    |                     Карлос:   [?party_popularity@elites|%R0]"
 itz_integrating_tdt:0 "Інтеграція [TDT.GetName]"
 itz_pet_border_clash_cat:0 "Хаос на півдні"
 itz_pet_border_clash_cat_desc:0 "Іца в хаосі після критичного поранення їхнього Каломте. Настав час увірватися і захопити наш приз — Сталеве Місто. Їхні війська розтануть, як масло, перед нашими силами."
 itz_harvest:0 "К'ан"
 itz_harvest_desc:0 "Імперія Іца величезна. Ми керуємо майже мільйоном людей — мало за довоєнними мірками, але багато в цьому постапокаліптичному світі. Як наслідок, наші фермери повинні тяжко працювати на полях, щоб прогодувати міста та армію. Якщо їх буде замало, або якщо так забажає матінка-природа, ми можемо зіткнутися з руйнівним голодом — і навіть §Rсерйозними громадянськими заворушеннями§!.\n\nУспіх нашого дня К'ан залежить від того, наскільки широкими є наші звільнення від сільського призову, а також від прогнозів на день К'ан цього року, які надходять від наших жерців, і, зрештою, від самої Богині Кукурудзи Хун-Наль-Є.\n\nНаразі наші жерці прогнозують, що наступний день К'ан буде [ROOT.itz_harvest_forecast]."