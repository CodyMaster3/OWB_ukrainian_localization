l_english:
 broken_tell_team_tt:0 "§RТут щось пішло не так! Будь ласка, зайдіть у Discord і повідомте про це в каналі баг-репортів. Дякуємо!§!"
 itz_not_purged_clara:0 "Ще §Yне§! §Rпровела чистку§! Клари та бюрократії разом з нею!"
 itz_chose_clara:0 "Ми вирішили підтримати §HКлару§!"
