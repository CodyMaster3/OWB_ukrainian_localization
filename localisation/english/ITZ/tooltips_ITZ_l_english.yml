 # Event tooltips
 itz_pet_massacre_tt:0 "§RМи це запам'ятаємо!§!"
 itz_power_struggle_soon_tt:0 "§YРано чи пізно політичний хаос дещо вщухне і почнеться боротьба за владу.§!\n"
 itz_chose_clara_tt:0 "Будуть розблоковані §YРішення§!, які дозволять нам допомогти §RКларі§! прийти до влади. Однак §Yвипадкові події§! намагатимуться перешкодити нашому прогресу! Якщо Клара не виграє боротьбу, ми продовжимо гру за фракцію, що перемогла."
 itz_chose_ejercito_tt:0 "Будуть розблоковані §YРішення§!, які дозволять нам допомогти §HКарлосу§! прийти до влади. Однак §Yвипадкові події§! намагатимуться перешкодити нашому прогресу! Якщо Карлос не виграє боротьбу, ми продовжимо гру за фракцію, що перемогла."
 itz_moc_harder_tt:0 "§RЦей вибір дещо ускладнить конфлікт з Моктесумою. Рекомендовано!§!\n"
