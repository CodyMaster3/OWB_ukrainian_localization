 # Focus tooltips
 itz_new_ejercito_tt:0 "Нові §!Дивізії Ехерсіто§! будуть сформовані по всій Імперії.\n"
 itz_has_started_scavenging_tt:0 "Ми завершили рішення §HРозпочати програму збору брухту§! у категорії §HЗбір спорядження§!."
 itz_scav_eff_tt:0 "Ми отримуємо §H10%§! ефективності збору брухту.\n"
 itz_wip_tt:0 "§RЦей фокус знаходиться в розробці до оновлення «Мексиканська затока», і тому не має ефектів. Він буде автоматично пропущений.§!\n"
 itz_new_merodeadores_tt:0 "§YТри§! нові §Yдивізії Меродеадорес§! будуть сформовані.\n"
