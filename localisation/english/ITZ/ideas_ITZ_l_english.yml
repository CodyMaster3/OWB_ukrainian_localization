l_english:
itz_idea_ejercito_factories:0 "Контроль Ехерсіто над військовими заводами"
 itz_idea_ejercito_factories_desc:0 "Ехерсіто поколіннями мали більш-менш повний контроль над військовим виробництвом. Як наслідок, виробництво стало дуже ефективним, коли завод випускає лише один тип товару, але суперництво між заводами та явна відсутність гнучкості означають, що змінити виробництво зовсім непросто.\n"
 itz_idea_extensive_agri_expemtions:0 "Масштабні звільнення"
 itz_idea_extensive_agri_expemtions_desc:0 "Величезна частина нашого сільського населення була звільнена від військової служби, щоб вони могли доглядати за своїми сімейними фермами та господарствами. Хоча це означає, що наша армія досить мала, це майже гарантує уникнення голоду.\n"
 itz_idea_moderate_agri_expemtions:0 "Помірні звільнення"
 itz_idea_moderate_agri_expemtions_desc:0 "Помірна частина нашого сільського населення була звільнена від військової служби, щоб вони могли доглядати за своїми сімейними фермами та господарствами. Це значно знижує ймовірність руйнівного голоду, але також обмежує розмір нашої армії.\n"
 itz_idea_light_agri_expemtions:0 "Незначні звільнення"
 itz_idea_light_agri_expemtions_desc:0 ""
 itz_idea_minimal_agri_expemtions:0 "Мінімальні звільнення"
 itz_idea_minimal_agri_expemtions_desc:0 ""
 itz_idea_bare_minimal_agri_expemtions:0 "Критично мінімальні звільнення"
 itz_idea_bare_minimal_agri_expemtions_desc:0 ""
 itz_idea_dynamic_harvest:0 "Результати минулорічного врожаю"
 itz_idea_dynamic_harvest_desc:0 "Через нашу залежність від сільських ферм у забезпеченні міст та армії їжею поганий врожай може зашкодити нам на цілий рік. Так само хороший врожай добре підтримує нас протягом року. Якщо станеться найгірше і ми наблизимося до голоду, ми можемо бути змушені легко здатися..."
 itz_idea_the_red_blood:0 "Червона кров"
 itz_idea_the_red_blood_desc:0 "Коли прийшли американці, ми чинили запеклий опір. Навіть коли вони пішли на нас із переважаючими силами, ми відмовилися поступатися. Як і вони. Вони влаштували нам різанину."
 itz_idea_the_white_flag:0 "Білий прапор"
 itz_idea_the_white_flag_desc:0 "Коли прийшли американці, ми чинили запеклий опір. Потім вони повернулися з переважаючими силами, швидко знищивши наші армії та залишивши лише ополчення, жінок і дітей. У відчаї вони підняли білий прапор капітуляції."
 itz_idea_the_blue_water:0 "Синя вода"
 itz_idea_the_blue_water_desc:0 "Коли прийшли американці, ми чинили запеклий опір. Потім вони повернулися з переважаючими силами, швидко знищивши наші армії та залишивши лише ополчення, жінок і дітей. У відчаї вони втекли в море на човнах і плотах."
 itz_idea_south_focus:0 "Фокус на Південь"
 itz_idea_south_focus_desc:0 "Каломте постановив, що боротьба з рейдерами на півдні має бути нашим головним пріоритетом — так тому і бути!"
 itz_idea_north_focus:0 "Фокус на Північ"
 itz_idea_north_focus_desc:0 "Каломте постановив, що відносини з націями на півночі мають бути нашим головним пріоритетом — так тому і бути!"
 itz_idea_encourgae_commerce:0 "Заохочення торгівлі"
 itz_idea_encourgae_commerce_desc:0 "Щоб наша економіка зростала, ми повинні тимчасово впровадити заходи для заохочення громадян до активнішої торгівлі."
 itz_idea_navigating_gulf:0 "Навігація в Затоці"
 itz_idea_navigating_gulf_desc:0 "Мексиканська затока — це велика і складна водойма, наповнена островами, рифами та іншими прихованими небезпеками. На щастя, після років досліджень та експериментів ми маємо досить непогані карти Затоки, що дозволяє нам переграти ворога маневреністю."
 itz_idea_building_gulf_fleet:0 "Розширення Великого Флоту Затоки"
 itz_idea_building_gulf_fleet_desc:0 "Хоча наш флот чималий, Затока теж велика. Ми повинні докласти певних зусиль для розширення, щоб гарантувати наше панування на хвилях Затоки."
 itz_idea_schematics_stolen_arm:0 "Вкрадені креслення"
 itz_idea_schematics_stolen_arm_desc:0 "Нещодавній рейд морської піхоти з Чичен-Іца спустошив наш запас креслень. Потрібен час, щоб оговтатися від цього."
 itz_idea_schematics_stolen:0 "Вкрадені креслення"
 itz_idea_schematics_stolen_desc:0 "Наше недавнє визволення креслень у Армії Мексики значно допоможе нашим дослідницьким зусиллям."
 itz_idea_society_in_collapse:0 "Суспільство в стані краху"
 itz_idea_society_in_collapse_desc:0 "Наша країна розвалюється після критичного поранення Каломте. Вулицями панує хаос. Робітники не хочуть працювати, а армія навряд чи хоче воювати без свого натхненного лідера."
 itz_idea_political_instability:0 "Політична нестабільність"
 itz_idea_political_instability_desc:0 "Діяльність нашої держави незрозуміла — на кухні занадто багато кухарів."
 itz_idea_broken_imperialism:0 "Зламаний імперіалізм"
 itz_idea_broken_imperialism_desc:0 "Внаслідок замаху на життя нашого великого Каломте весь дух експансії дещо зник як у наших солдатів, так і у наших робітників."
 itz_idea_integrating_tdt:0 "Інтеграція [TDT.GetName]"
 itz_idea_integrating_tdt_desc:0 "§HЦя ідея буде видалена, коли завершиться інтеграція [TDT.GetName] — про це свідчить час, що залишився у рішенні «Інтеграція [TDT.GetName]»§!"
 itz_idea_ejercito_unhappy:0 "Невдоволені Ехерсіто"
 itz_idea_ejercito_unhappy_desc:0 "Улюбленого кандидата Ехерсіто, Карлоса, не обрали новим лідером Іца, і в результаті Ехерсіто вирішили відмовитися від співпраці."
 itz_idea_merc_unhappy:0 "Бунтівні Меродеадорес"
 itz_idea_merc_unhappy_desc:0 "Улюблену кандидатку Меродеадорес, Клару, не обрали новим лідером Іца, і в результаті Меродеадорес почали відкрите повстання. З ними треба щось робити!"
 itz_idea_merc_destined_for_scrapheap:0 "Меродеадорес, приречені на звалище"
 itz_idea_merc_destined_for_scrapheap_desc:0 "Рішення прийнято — Меродеадорес місце на смітнику. Хоча їх ще офіційно не розформували — це буде зроблено, коли ми завершимо масштабні військові реформи, — вони, дідько б їх узяв, точно не будуть воювати за нас."
 itz_idea_clara_guard:0 "Охоронці Ті'хуун"
 itz_idea_clara_guard_desc:0 "Охоронці Ті'хуун — це група страхітливо відданих, загартованих у боях військових, яких використовують як для захисту Ті'хуун, так і для придушення політичних дисидентів по всій території Іца. Стук у двері пізно вночі від Охоронців — це досвід, про який мало хто доживає згадати."
 itz_idea_military_rule:0 "Воєнний стан"
 itz_idea_military_rule_desc:0 "Своїм першим актом при владі Халач-Вінік, Карлос Франко, ввів воєнний стан, щоб придушити дисидентів і зміцнити своє правління. Проте немає жодних ознак того, що цей спосіб управління зникне найближчим часом."
 itz_build_palace_wtt:0 "Будівництво Великого Палацу"
 itz_build_palace_wtt_desc:0 "Клара наказала побудувати Великий Палац — як меморіал Каломте, так і як її нову базу влади. \n§YБудівництво буде завершено, коли цю ідею буде видалено§!"
 itz_palace_built:0 "Великий Палац Іца"
 itz_palace_built_desc:0 "Великий Палац Іца був побудований у столиці, слугуючи водночас адміністративним центром і символом абсолютної влади Клари."
 itz_idea_ejer_borders_starter:0 "Реформування Ехерсіто"
 itz_idea_ejer_borders_starter_desc:0 "Після їхньої нелояльності під час боротьби за владу було вирішено, що Ехерсіто буде переформовано в елітні сили прикордонного контролю, замість розгалужених збройних сил, якими вони є зараз."
 itz_idea_ejer_borders_finisher:0 "Еліта на кордоні"
 itz_idea_ejer_borders_finisher_desc:0 "Після інтенсивних реформ і значних кадрових змін у керівництві Ехерсіто повністю трансформувалися у свою нову роль захисників кордону."
 itz_idea_ejer_purges_starter:0 "Чистки в Ехерсіто"
 itz_idea_ejer_purges_starter_desc:0 "Після їхньої нелояльності під час боротьби за владу було вирішено, що Ехерсіто буде очищено від амбітних офіцерів та чиновників. Хоча це означає, що вони будуть набагато менш ефективними в короткостроковій перспективі, у довгостроковій перспективі вони будуть дуже лояльними."
 itz_idea_ejer_purges_finisher:0 "Нова кров в Ехерсіто"
 itz_idea_ejer_purges_finisher_desc:0 "Після серії чисток та кампаній з набору персоналу генерали Ехерсіто тепер стали досить покірними. Однак чистки залишили по собі глибокі шрами..."
 itz_idea_merc_marines_starter:0 "Меродеадорес у морську піхоту"
 itz_idea_merc_marines_starter_desc:0 "Після їхнього рішення стати на бік Ті'хуун у боротьбі за владу ми вирішили, що найкраще реформувати Меродеадорес виключно у підрозділи морської піхоти, замість звичайних головорізів, якими їх використовували раніше."
 itz_idea_merc_marines_change:0 "Меродеадорес у морську піхоту"
 itz_idea_merc_marines_change_desc:0 "Після їхнього рішення стати на бік Ті'хуун у боротьбі за владу ми вирішили, що найкраще реформувати Меродеадорес виключно у підрозділи морської піхоти, замість звичайних головорізів, якими їх використовували раніше."
 itz_idea_ejercito_total_fac:0 "Повний контроль заводів з боку Ехерсіто"
 itz_idea_ejercito_total_fac_desc:0 "Ехерсіто поколіннями мали більш-менш повний контроль над військовим виробництвом. Як наслідок, виробництво стало дуже ефективним, коли завод випускає лише один тип товару, але суперництво між заводами та явна відсутність гнучкості означають, що змінити виробництво зовсім непросто. Після перемоги Карлоса у боротьбі за владу Ехерсіто отримали повний контроль над усім військовим виробництвом у країні."
 itz_idea_purged_beuro:0 "Очищена бюрократія"
 itz_idea_purged_beuro_desc:0 "Після невдачі Клари захопити контроль у боротьбі за владу бюрократія була очищена від лоялістів Клари, щоб гарантувати відсутність ризику контрперевороту. Однак це трохи зашкодило нам у короткостроковій перспективі."
 itz_idea_home_defence:0 "Акт про оборону батьківщини"
 itz_idea_home_defence_desc:0 "Наша країна перебуває під загрозою з боку іноземних сил, і обов'язок кожного громадянина — захищати свою батьківщину від вторгнення. До останнього!"
 itz_idea_self_assertion:0 "Самостьвердження Іца"
 itz_idea_self_assertion_desc:0 "Ми, як нація, зуміли вийти з темного періоду нашої історії з новими силами. Майбутнє в наших руках!"
 itz_idea_civ_cons:0 "Будівельні бригади"
 itz_idea_civ_cons_desc:0 "Щоб допомогти у будівництві вкрай необхідної інфраструктури та заводів, ми сформували з частини нашого населення будівельні бригади. Це допоможе нам у швидкому зведенні життєво важливих будівель та укріплень."
 itz_idea_secret_police:0 "Б.О.Г."
 itz_idea_secret_police_desc:0 "Бюро Оборони Громадян, або скорочено Б.О.Г., було органом, створеним Каломте одразу після його приходу до влади. Він використовував його для придушення дисидентів у державі, а також для виявлення партизанів на окупованих територіях."
 itz_idea_secret_police_empowered:0 "Посилене Б.О.Г."
 itz_idea_secret_police_empowered_desc:0 "Бюро Оборони Громадян, або скорочено Б.О.Г., було органом, створеним Каломте одразу після його приходу до влади. Він використовував його для придушення дисидентів у державі, а також для виявлення партизанів на окупованих територіях. Однак нещодавно його повноваження було розширено, щоб дозволити діяти ефективніше."
 itz_idea_fyp_construction:0 "Чотирирічний план: Фокус на будівництві"
 itz_idea_fyp_construction_desc:0 "Ми вирішили зосередити наш перший Чотирирічний план на будівництві. За Іца!"
 itz_idea_fyp_construction_dd:0 "Чотирирічний план: Фокус на будівництві"
 itz_idea_fyp_construction_dd_desc:0 "Після успіху минулого Чотирирічного плану ми вирішили подвоїти зусилля та інвестувати ще більше в будівництво, хоча це дещо шкодить іншим сферам."
 itz_idea_fyp_resources:0 "Чотирирічний план: Фокус на видобутку ресурсів"
 itz_idea_fyp_resources_desc:0 "Ми вирішили зосередити наш перший Чотирирічний план на видобутку ресурсів. За Іца!"
 itz_idea_fyp_resources_dd:0 "Чотирирічний план: Фокус на видобутку ресурсів"
 itz_idea_fyp_resources_dd_desc:0 "Після успіху минулого Чотирирічного плану ми вирішили подвоїти зусилля та інвестувати ще більше у видобуток ресурсів, хоча це дещо шкодить іншим сферам."
 itz_idea_fyp_prod:0 "Чотирирічний план: Фокус на виробництві"
 itz_idea_fyp_prod_desc:0 "Ми вирішили зосередити наш перший Чотирирічний план на виробництві. За Іца!"
 itz_idea_fyp_prod_dd:0 "Чотирирічний план: Фокус на виробництві"
 itz_idea_fyp_prod_dd_desc:0 "Після успіху минулого Чотирирічного плану ми вирішили подвоїти зусилля та інвестувати ще більше у виробництво, хоча це дещо шкодить іншим сферам."
 itz_idea_fyp_research:0 "Чотирирічний план: Фокус на дослідженнях"
 itz_idea_fyp_research_desc:0 "Ми вирішили зосередити наш перший Чотирирічний план на дослідженнях. За Іца!"
 itz_idea_fyp_research_dd:0 "Чотирирічний план: Фокус на дослідженнях"
 itz_idea_fyp_research_dd_desc:0 "Після успіху минулого Чотирирічного плану ми вирішили подвоїти зусилля та інвестувати ще більше у виробництво, хоча це дещо шкодить іншим сферам."
 itz_idea_large_families:0 "Сімейна ініціатива"
 itz_idea_large_families_desc:0 "Щоб гарантувати, що ми завжди матимемо людей для нашої армії та заводів, ми започаткували ініціативу заохочення жінок до створення великих сімей — включаючи як грошові, так і матеріальні винагороди. Крім того, всі школярки повинні носити кіски, тому що Führerreich — найкращий мод 2018 року."
 itz_idea_war_is_peace:0 "Перший догмат"
 itz_idea_war_is_peace_desc:0 "Перший догмат, знайдений у запиленій книзі в старій бібліотеці: Війна — це мир. Перебуваючи у стані війни, ми змушуємо людей зосереджуватися на перемозі, а не турбуватися про свій матеріальний добробут."
 itz_idea_freedom_is_slavery:0 "Другий догмат"
 itz_idea_freedom_is_slavery_desc:0 "Другий догмат: Свобода — це рабство. Утримуючи наше населення на полях і заводах, ми гарантуємо, що вони ніколи не відчують смаку світу свободи."
 itz_idea_ignorance_is_strength:0 "Третій догмат"
 itz_idea_ignorance_is_strength_desc:0 "Третій догмат: Незнання — це сила. Поки люди сліпі до правди, вони не прагнутимуть кращого завтра, оскільки вірять, що сьогодення — це найкраще, на що вони можуть сподіватися."
 itz_ideas_import_tariffs:0 "Імпортні тарифи"
 itz_ideas_import_tariffs_desc:0 "У спробі стимулювати місцеву торгівлю, торгівля іноземними ресурсами була суворо обмежена. Це означає, що наші ринки використовують більше власних ресурсів, але укладати торгові угоди з іноземними державами тепер буде важче."
 itz_idea_quantity_over_quality:0 "Кількість понад якість"
 itz_idea_quantity_over_quality_desc:0 "Наші армії величезні — надто великі, щоб належним чином оснастити їх високоякісним озброєнням. Як наслідок, ми вирішили зосередитися на тому, щоб кожен наш чоловік мав зброю, замість того, щоб половина мала справну зброю."
 itz_idea_settling_nation:0 "Осіла нація"
 itz_idea_settling_nation_desc:0 "Робітників заохочують переїжджати у великі міста, залишаючи нові машини та в'ючних тварин виконувати роботу на полях."
 itz_civilizing:0 "Культурний переворот"
 itz_civilizing_desc:0 "Суспільство зазнає швидких змін, кінцевою метою яких є перетворення нас на цивілізовану націю. Однак народ не в захваті."
 itz_idea_generals_in_abundance:0 "Надлишок генералів"
 itz_idea_generals_in_abundanc_desc:0 "Наш нещодавній конфлікт означає, що у нас безліч кваліфікованих людей, які чекають на підвищення!"
 itz_idea_rough_terrian_training_dummy:0 "Тренування на пересіченій місцевості"
 itz_idea_rough_terrian_training_dummy_desc:0 "§RЦя ідея не дає жодних бонусів, але вона представляє технологію, яка їх дає!§! \n\nУсі підрозділи §Yспецпризначення§! отримують §Y+10% до атаки§!, §Y+10% до оборони§! та §Y+20% до швидкості пересування§! на §Yпересіченій місцевості§! — тобто в горах, пустелях, болотах, на пагорбах, у лісах та джунглях."
 itz_idea_imc:0 "Корпус морської піхоти Іца"
 itz_idea_imc_desc:0 "Після знищення партизанських загонів Меродеадорес було створено Корпус морської піхоти Іца, який перебрав на себе їхні попередні військово-морські обов'язки. Вони суворо обмежені за обсягом. Тому КМП спеціалізується на морському бою (де їхні загони на наших кораблях підвищують нашу військово-морську ефективність) та десантних операціях (де підрозділи КМП проявляють себе найкраще)."
 itz_idea_unified_force:0 "Об'єднана бойова сила"
 itz_idea_unified_force_desc:0 "Після масштабних чисток як в Ехерсіто, так і в Меродеадорес, нам нарешті вдалося створити єдину, аполітичну армію. Усі військові операції тепер виконуються Армією Іца, що забезпечує значно більшу адміністративну гнучкість і суттєво зменшує ймовірність старого доброго перевороту."
 itz_idea_streamlined_factories:0 "Оптимізоване виробництво"
 itz_idea_streamlined_factories_desc:0 "Внаслідок наших змін в Ехерсіто ми послабили їхній жорсткий контроль над військовим виробництвом, що призвело до створення більш гнучких виробничих ліній."
 itz_idea_officer_dynasties:0 "Офіцерські династії"
 itz_idea_officer_dynasties_desc:0 "Керівництво Ехерсіто тепер, завдяки певним заохоченням, складається з кількох могутніх родин. Це приносить нам значну користь, роблячи генералів численнішими та досвідченішими."
 itz_idea_elite_force:0 "Вершки суспільства"
 itz_idea_elite_force_desc:0 "Після років реформ та інвестицій Ехерсіто тепер є елітною бойовою силою, здатною до складних маневрів та операцій по всьому фронту."
 itz_idea_revanchism:0 "Реваншизм Іца"
 itz_idea_revanchism_desc:0 "Нарешті, після місяців політичного хаосу та військових поразок, ми готові розпочати процес повернення наших втрачених територій. За Іца!"
 itz_idea_loyal_subject:0 "Лояльний підданий"
 itz_idea_loyal_subject_desc:0 "Після інвестицій Іца в нашу країну наш правлячий клас став більш лояльним до Іца та більш стійким до будь-яких рухів за незалежність."
 itz_grh_bond_of_love_idea:0 "Узи любові та політики"
 itz_grh_bond_of_love_idea_desc:0 "Шлюб між Ті'хуун Кларою та Команданте Луїсом приносить велику користь обом великим націям, як політичну, так і військову."
 itz_robot_fear_3:0 "Страх перед роботами Моктесуми"
 itz_robot_fear_3_desc:0 "Орди роботів вирвалися з пусток, які колись були володіннями Тлалока, змушуючи наші великі армії гнутися і ламатися перед ними. Тримайтеся міцніше, буде гаряче!"
 itz_robot_fear_2:0 "Страх перед роботами Моктесуми"
 itz_robot_fear_2_desc:0 "Орди роботів вирвалися з пусток, які колись були володіннями Тлалока, змушуючи наші великі армії гнутися і ламатися перед ними. Тримайтеся міцніше, буде гаряче!"
 itz_robot_fear_1:0 "Страх перед роботами Моктесуми"
 itz_robot_fear_1_desc:0 "Орди роботів вирвалися з пусток, які колись були володіннями Тлалока, змушуючи наші великі армії гнутися і ламатися перед ними. Тримайтеся міцніше, буде гаряче!"
 itz_supreme_idea:0 "Верховенство Іца"
 itz_supreme_idea_desc:0 "Тепер, коли наші вороги, старі чи нові, підкорені або умиротворені, настав час для Іца поглянути за межі півдня Мексики. Час для відродження настав!"
 itz_idea_awake_and_angry:0 "Пробуджені та розлючені"
 itz_idea_awake_and_angry_desc:0 "Після місяців і місяців політичного хаосу та військових поразок ми нарешті змінили нашу долю. Іца прокинулися зі сну і прагнуть крові!"
 true_unity_idea:0 "Справжня єдність"
 true_unity_idea_desc:0 "Після одруження Клари та Армандо і наступного виконання їхніх весільних обітниць великі імперії Іца та Ацтлан досягли певного ступеня єдності. Це добрий знак для майбутнього!"
 ITZ_diplomatic_turmoil:0 "Дипломатичне сум'яття"
 ITZ_diplomatic_turmoil_desc:0 "Через нещодавні зміни в нашій дипломатичній ситуації ми не можемо підтримувати наших союзників або просити про підтримку, доки ця проблема не буде вирішена."