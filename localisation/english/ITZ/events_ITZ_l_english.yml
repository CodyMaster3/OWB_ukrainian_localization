l_english:
 # harvest
 itz_harvest.1.t:0 "День К'ан"
 itz_harvest.1.d:0 "Здається, лише мить минула з останнього дня К'ан, але промайнув ще один рік, і знову настав час пожинати те, що ми посіяли. По всій Імперії селяни трудяться на полях, щоб зібрати цьогорічний урожай, поки він не зіпсувався, а наші адміністратори очікують, що ми отримаємо нашу частку врожаю до кінця тижня, аби ми могли прогодувати наші армії та міста."
 itz_harvest.1.a:0 "Час сіяти озимі..."
 itz_harvest.2.t:0 "Дезертирство з армії"
 itz_harvest.2.d:0 "Після далеко не ідеального дня К'ан, який ми пережили цього року, багато наших резервістів покинули свої армійські групи, щоб повернутися і допомогти своїм сім'ям уникнути нищівного голоду. На жаль, ми мало що можемо зробити, щоб зупинити цю величезну хвилю дезертирства, окрім як змінити нашу офіційну політику вербування, щоб врахувати ці втрати. Протягом найближчих місяців ми, безсумнівно, спробуємо завербувати їх знову."
 itz_harvest.2.a:0 "Кляті селяни!"
 # nf events
 nf_itz.1.t:0 "Червоний, білий та синій"
 nf_itz.1.d:0 "Американці колись були нашими союзниками. Потім вони стали нашими суперниками. А згодом — ворогами. У 2051 році американська армія вторглася в Мексику з наміром захопити нашу нафту та захистити свій бізнес. Хоча мексиканські сили чинили запеклий опір, їх зрештою розбила краща якість і кількість американських військ. Американські війська отримали свободу окупувати всю Мексику. Коли американці дісталися півострова Юкатан, наші ополченці спочатку чинили опір, але американці повернулися з переважаючими силами. Результат? Що ж..."
 nf_itz.1.a:0 "Червоною була кров мучеників."
 nf_itz.1.b:0 "Білим був прапор, який ми підняли у відчаї."
 nf_itz.1.c:0 "Синьою була вода, в яку ми тікали."
 nf_itz.2.t:0 "Шляхи давнини"
 nf_itz.2.d:0 "Хоча ядерне пекло, подальший крах цивілізації та десятиліття невігластва позбавили новий світ більшості знань про старий, за деякі уламки цінностей старого світу вдалося вчепитися. Ці цінності, що часто передаються через народні перекази, стали важливими для зростаючих груп середнього та вищого класу в Імперії, які шукають будь-який зв'язок зі старим світом. Дві популярні історії передаються найчастіше, і з нашою допомогою одна з них може стати панівною в нашому суспільстві. Якою вона має бути?"
 nf_itz.2.a:0 "Історія про святість сім'ї"
 nf_itz.2.b:0 "Казка про непогрішність правителя"
 nf_itz.3.t:0 "Флот"
 nf_itz.3.d:0 "Великий Флот Затоки, який Імперія Іца може розгорнути під час війни, є частиною історії Іца та чимось на кшталт легенди. Сформований з торговельних суден, а також регулярних військових кораблів, наш флот панує в західній частині Затоки майже беззаперечно. Однак думки розділилися щодо того, як нам найкраще використати цю унікальну перевагу. Одна молода адміралка, Каміла, стверджує, що ми повинні зосередити нашу морську майстерність на боротьбі за річки Мексики. Адмірал Матео тим часом твердо вірить у широкі патрульні формування, що допомагають захищати торгівлю та покращувати нашу репутацію. Нарешті, старий адмірал Луїс підтримує підхід «флоту у наявності», виступаючи за використання великих кораблів для демонстрації нашої переваги повсюди. Якому плану Каломте надасть перевагу?"
 nf_itz.3.a:0 "Обрати план адмірала Каміли."
 nf_itz.3.b:0 "Схвалити план адмірала Матео!"
 nf_itz.3.c:0 "План адмірала Луїса здається найкращим..."
 nf_itz.4.t:0 "Постання Каломте"
 nf_itz.4.d:0 "12 березня 2232 року Каломте Себастьян II вперше здобув собі ім'я. Там, на берегах річки Папалоапан, молодий Себастьян згуртував навколо себе останні залишки армії Іца, стримуючи хвилю за хвилею піхоти Ацтлану. Того дня сили Іца, що складали лише крихту від орди Ацтлану, змусили ворога перейти до кривавої патової ситуації, і після краху північної експедиції Ацтлану в землі Тлалока, зрештою змусили Ацтлан відступити. Саме в той день Каломте став шанованим серед Ехерсіто та серед народу.\n\nВсього кілька років по тому Себастьян захопив владу майже безкровно внаслідок перевороту. За підтримки майже всіх збройних сил він проголосив себе Каломте, або царем царів. Усі, хто зустрічався з ним, погоджувалися, що він мав одну рису, яка робила його великим королем, але що це було?"
 nf_itz.4.a:0 "Його тактика та миттєві рішення викликали у багатьох благоговіння!"
 nf_itz.4.b:0 "Його харизма, адже її було достатньо, щоб згуртувати виснажені війська."
 nf_itz.4.c:0 "Його пильна увага до постачання справила незабутнє враження."
 nf_itz.5.t:0 "Два фронти"
 nf_itz.5.d:0 "Після перемоги на берегах річки Папалоапан Себастьян став народним героєм. Ехерсіто віддано йшло за ним, а ополченці схилялися перед його могутністю. Через три роки після перемоги над Ацтланом, у 2242 році, Себастьян захопив владу шляхом державного перевороту — захоплення відбулося без жодного шепоту з боку суспільства. Себастьян був коронований жерцями храмів як Каломте — Цар царів.\n\nЗахопивши владу, Себастьян взявся за знищення армійської корупції і, що найважливіше, за повернення територій, втрачених Іца за 40 років до того. Його кампанії відкинули Імперію Ацтлан, вигнали південних рейдерів разом з ополченцями Гондурасу в найглибші джунглі та знищили північні племена. Тепер, у 2275 році, Каломте збирається розпочати нові експедиції, але де має бути пріоритет?"
 nf_itz.5.a:0 "Безпека заходу є критичною!"
 nf_itz.5.b:0 "Загрози з півночі є найсерйознішими."
 nf_itz.6.t:0 "Північна розвідувальна місія"
 nf_itz.6.d:0 "Після підкорення північних племен на північному кордоні стало більш-менш спокійно. Проте останнім часом до Сталевого Міста почали надходити повідомлення про незвичайні спостереження — повідомлення, що надходять усе частіше з кожним тижнем. Ми повинні відправити елітний загін Ехерсіто, щоб розслідувати, що лежить за північним кордоном, і придушити будь-яку загрозу, що може там бути."
 nf_itz.6.a:0 "Бажаємо їм удачі."
 nf_itz.7.t:0 "Відвідувачі з Іца"
 nf_itz.7.d:0 "Іца — велике плем'я майя на південь від нас — відправило добре організований та озброєний загін на територію навколо наших комплексів. Вони виглядають як невелика розвідувальна група, а зброя, якою вони хизуються, ледве заслуговує на таку назву, але все ж ми повинні вирішити, що з ними робити. Вони тримаються близько до своїх поселень, тому, якщо залишити їх у спокої, навряд чи вони викриють якісь із наших об'єктів. З іншого боку, ми могли б використати оману та страх, щоб відігнати їх, або ж ми могли б просто знищити їх."
 nf_itz.7.a:0 "Залишатися непоміченими і дозволити їм йти, куди забажають."
 nf_itz.7.b:0 "Заплутати їх."
 nf_itz.7.c:0 "Відправити їх назад у їхні поселення!"
 nf_itz.8.t:0 "Північ покинута"
 nf_itz.8.d:0 "5-й розвідувальний Ехерсіто повернувся зі своєї експедиції на північ і, схоже, не знайшов нічого, що пояснювало б дивні явища, про які повідомляли наші північні поселення. Однак вони виявили різноманітну зброю невідомого виробника, що, можливо, свідчить про те, що хтось або щось ховається на півночі. Проте, що б це не було, ми не знаємо."
 nf_itz.8.a:0 "Ми будемо пильно стежити за північчю..."
 nf_itz.9.t:0 "У гонитві за привидами"
 nf_itz.9.d:0 "5-й розвідувальний Ехерсіто повернувся зі своєї експедиції на північ, розповідаючи історії про примарні фігури, що переслідували їх вдень, і дивні звуки, що йшли за ними вночі. Однак група не змогла знайти причину дивних явищ і після кількох днів полювання повернулася до Сталевого Міста. Єдина ознака життя, яку виявила розвідувальна група, — це жменя зброї невідомого виробника. Чому вона валялася на півночі від наших поселень, ми не знаємо."
 nf_itz.9.a:0 "Моторошно..."
 nf_itz.10.t:0 "Останній бій 5-ї роти"
 nf_itz.10.d:0 "Жахливі новини зі Сталевого Міста сьогодні — втрачено зв'язок із 5-м розвідувальним Ехерсіто. Остання передача, яку ми отримали від них, була о 22:13 минулої ночі — панічне, коротке повідомлення, в якому радист розвідгрупи поінформував нас, що група перебуває під нищівною атакою невідомої сили, озброєної високотехнологічною зброєю. Радист повідомив, що більшість групи вже загинула, тому решта займає оборону для останнього бою, намагаючись забрати тіла полеглих. Смерть або слава.\n\nБільше ми не мали зв'язку з групою, тому вважається, що їх перебили. Ми будемо оплакувати їх."
 nf_itz.10.a:0 "Жахливо!"
 nf_itz.11.t:0 "Випробування людини"
 nf_itz.11.d:0 "Сонячне світло заливало подвір'я. На ньому дві постаті зійшлися у двобої — кружляли, робили випади, відбивали удари, чекаючи на свій шанс для атаки. Один із них, нижчий на зріст, був хитрим лисом Тобіасом Реєм, нинішнім правителем Цоціля. Іншим був один із генералів Рея, Максимо Вела, справжня глиба, а не чоловік. Ставки в їхньому бою не могли бути вищими, адже на кону було саме майбутнє Цоціля. І коли настав полудень..."
 nf_itz.11.a:0 "Добре спланований випад Рея збив Велу з ніг!"
 nf_itz.11.b:0 "Град ударів від Вели збив захист Рея..."
 nf_itz.110.t:0 "Вела переможець"
 nf_itz.110.d:0 "Сьогодні раніше, за нашою вказівкою, Максимо Вела кинув виклик правителю [TDT.GetName] Тобіасу Рею на дуель за лідерство. Такі дуелі є традиційними для визначення керівництва Цоціля і вважаються почесним способом вирішення суперечок, але останні десятиліття їх рідко використовували через страхітливу репутацію Рея на арені. Однак за підказкою самого Каломте, Вела вирішив спробувати здобути титул на арені. І справді, груба сила Вели змогла перемогти хитрість Рея, і тепер Велу короновано правителем Цоціля. Незабаром він присягне на вірність самому Каломте!"
 nf_itz.110.a:0 "Хороші новини"
 nf_itz.111.t:0 "Рей вижив, щоб побачити новий день"
 nf_itz.111.d:0 "Сьогодні раніше, за нашою вказівкою, Максимо Вела кинув виклик правителю [TDT.GetName] Тобіасу Рею на дуель за лідерство. Такі дуелі є традиційними для визначення керівництва Цоціля і вважаються почесним способом вирішення суперечок, але останні десятиліття їх рідко використовували через страхітливу репутацію Рея на арені. Однак за підказкою самого Каломте, Вела вирішив спробувати здобути титул на арені. Попри всі свої зусилля, Вела не зміг пробити обережний захист Рея, і, зрештою, добре спланований випад Рея збив Велу на землю. На жаль, це повністю руйнує наші плани мирно анексувати Цоціль, але в нашому розпорядженні є й інші методи..."
 nf_itz.111.a:0 "Хочеш зробити добре — зроби це сам!"
 nf_itz.12.t:0 "Рейд на Армію Мексики"
 nf_itz.12.d:0 "Армія Мексики розташована на півночі від нас, займаючи значну частину узбережжя, а також річку Сото-ла-Маріна. Їхня велика берегова лінія робить їх дуже вразливими до рейдів — Армія Мексики просто не може прикрити все узбережжя. В результаті ми повинні провести масштабний рейд на їхню берегову лінію, викрадаючи все, що зможемо. На якій цілі нам зосередитися?"
 nf_itz.12.a:0 "Їхні склади зброї!"
 nf_itz.12.b:0 "Їхні військові заводи."
 nf_itz.12.c:0 "Їхні сховища креслень..."
 nf_itz.13.t:0 "Рейдери з півдня"
 nf_itz.13.d:0 "Вчора пізно ввечері на горизонті з'явився великий флот. Повільно і безшумно флот підкрався ближче, поки з його центру не виринули п'ять десантних суден. Ці судна швидко висадилися на берег, і з них висипали добре вишколені морські піхотинці Меродеадорес із Чичен-Іца. Вони миттєво розбили невелике місцеве ополчення, а також гарнізон прилеглих військових об'єктів. Морпіхи схопили все, що могли, і спалили решту, перш ніж знову сісти на свої судна і піти разом із флотом, що їх привіз. Боягузи."
 nf_itz.13.a:0 "Ми повинні відбудуватися!"
 nf_itz.14.t:0 "Рейдери повертаються з півночі"
 nf_itz.14.d:0 "Північний рейд став гучним успіхом. Наші хоробрі Меродеадорес у супроводі Флоту Затоки висадилися на абсолютно незахищеному узбережжі Армії Мексики. Вони блискавично розбили невелике місцеве ополчення, перш ніж знищити гарнізон нашої цілі — доволі великого промислового комплексу. Опинившись всередині, наші війська захопили все, що могли, і спалили решту, після чого повернулися на десантні судна і відбули так само безперешкодно, як і прибули."
 nf_itz.14.a:0 "Гучний успіх!"

 # 1st border clash w/ Aztlan
 nf_itz_border.1.t:0 "Успіх у прикордонній сутичці"
 nf_itz_border.1.d:0 "Наші нещодавні прикордонні сутички з Ацтланом завершилися успіхом, а дії наших підрозділів змусили ацтланців втекти з поля бою. У результаті ми захопили значну смугу території. Тепер нам просто потрібно підготуватися до контратаки."
 nf_itz_border.1.a:0 "Чудово!"
 nf_itz_border.2.t:0 "Провал на кордоні з Ацтланом"
 nf_itz_border.2.d:0 "Наша нещодавня сутичка з Ацтланом завершилася, і нас відкинули від кордону. Який гучний провал! Ми повинні підготуватися до контратаки і радіти, що Ацтлан вирішив не перетинати наш кордон, щоб розвинути свою перевагу."
 nf_itz_border.2.a:0 "Перегрупуватися, швидко!"
 nf_itz_border.3.t:0 "Нерішучі сутички на кордоні з Ацтланом"
 nf_itz_border.3.d:0 "Наші нещодавні сутички з Ацтланом зайшли в глухий кут — жодна зі сторін не змогла створити або розвинути перевагу. Як наслідок, обидві сторони вирішили дещо послабити бойові дії. Хоча зараз конфлікту немає, це не означає, що він не виникне знову найближчим часом."
 nf_itz_border.3.a:0 "Ми зробили все, що могли."
 nf_itz_border.4.t:0 "Успіх на кордоні з Іца"
 nf_itz_border.4.d:0 "Після раптового нападу сил Іца наші хоробрі війська успішно відбили всіх нападників. Сили Іца розтанули, як папір, перед нашими високоякісними військами, і вони повинні дякувати своїм богам, що ми не скористалися своєю перевагою сповна."
 nf_itz_border.4.a:0 "Чудово."
 nf_itz_border.5.t:0 "Розгромний відступ від кордону Іца"
 nf_itz_border.5.d:0 "Сили Іца, скориставшись раптовістю та нічним покровом, зуміли розгромити наші прикордонні сили. Війська Іца дещо просунулися вперед, захопивши численні стратегічні опорні пункти та висоти, що значно ускладнює нам звільнення цих земель."
 nf_itz_border.5.a:0 "Перегрупуватися, швидко!"
 nf_itz_border.6.t:0 "Нерішучі сутички на кордоні з Іца"
 nf_itz_border.6.d:0 "Наші нещодавні сутички з силами Іца зайшли в глухий кут — жодна зі сторін не змогла створити або розвинути перевагу. Як наслідок, обидві сторони вирішили припинити конфлікт, хоча він може спалахнути знову будь-якої миті."
 nf_itz_border.6.a:0 "Принаймні ми їх стримали."

 # Kalomte hurt
 nf_itz.15.t:0 "Катастрофа"
 nf_itz.15.d:0 "Каломте поранено. Важко. На даний момент подробиць обмаль — ми знаємо лише те, що в Каломте влучили з середньої відстані під час інспекції військ на північному кордоні в сутінках. Куля, схоже, увійшла в хребет і пробила легеню — Каломте швидко знепритомнів, але поки що чіпляється за життя. Його мрії, безсумнівно, були розбиті кулею в темряві. Правителі приходять і йдуть, але чи розпадеться наше королівство?"
 nf_itz.15.a:0 "Настають темні часи..."
 nf_itz.16.t:0 "Усе починає розвалюватися"
 nf_itz.16.d:0 "Минуло трохи більше тижня з моменту замаху на Каломте. Ми досі не знаємо ні осіб нападників, ні того, коли і чи взагалі одужає Каломте. Однак стає зрозумілим одне: наскільки країна залежала від його централізованої влади, щоб просто продовжувати функціонувати. Каломте не залишив чіткого наступника, і місцеві губернатори використовують хаос, щоб проявляти все більше автономії від наказів, що надходять зі столиці. На наших кордонах також кружляють стерв'ятники. Ацтлан жадібно поглядає на наші кордони, а на півночі частота дивних явищ, які намагалася ідентифікувати 5-та розвідувальна група, різко зростає. Вдома ситуація не краща — накази не виконуються, армія розвалюється, а громадяни виходять на вулиці. Справи кепські."
 nf_itz.16.a:0 "Чи може бути ще гірше?"
 nf_itz.17.t:0 "Хаос на півдні"
 nf_itz.17.d:0 "Лідер Чичен-Іца, Каломте Себастьян, був критично поранений під час інспекції військ Іца на нашому кордоні. Хоча напад не був організований нами, це дає нам чудову можливість розпочати атаку, щоб захопити Сталеве Місто у Іца. Армія Іца ослаблена відсутністю свого славетного лідера, а суспільство перебуває в сум'ятті, доки не буде знайдено наступника Каломте — коли це станеться, ми втратимо наше вікно для атаки."
 nf_itz.17.a:0 "Сталеве Місто майже наше!"
 nf_itz.18.t:0 "Цоціль проголошує незалежність"
 nf_itz.18.d:0 "Скориставшись нашим нинішнім політичним паралічем, і без того напівавтономний [TDT.GetName] проголосив незалежність від нашого правління. Відчуваючи огиду до нашої боротьби за лідерство та засуджуючи нашу очевидну зневагу до «народу», старійшини Цоціля повернули Тобіаса Рея на трон, щоб провести країну через нинішні смутні часи. Повідомлення, хоча й непідтверджені, свідчать навіть про те, що наші гарнізони в регіоні були роззброєні!"
 nf_itz.18.a:0 "Ми безсилі протистояти цьому кроку!"

 # Border Clashes with PET and ATE
 nf_itz_border.7.t:0 "Війська скупчуються на півночі"
 nf_itz_border.7.d:0 "Тривожні новини з півночі — велика кількість військ невідомого ворога скупчується на нашому кордоні, ймовірно, з наміром захопити Сталеве Місто у нашої законної влади. Ми не повинні цього допустити! Хоча наші війська страждають від дезорганізації, вони, безсумнівно, згуртуються, щоб захистити місто. Чи не так?"
 nf_itz_border.7.a:0 "Справи можуть стати ризикованими..."
 nf_itz_border.8.t:0 "Петро-Чіко відбито"
 nf_itz_border.8.d:0 "Славна перемога за нами! Сили залишків корпорації Петро-Чіко були відкинуті від Сталевого Міста в ході приголомшливої перемоги, яка запам'ятається на віки. І справді, наші хоробрі війська — як Ехерсіто, так і Меродеадорес — згуртувалися під прапором Іца. Розбиті бійці Петро-Чіко залишили численні передові технології, які, безсумнівно, стануть у великій нагоді для наших наукових досліджень."
 nf_itz_border.8.a:0 "Вічна перемога!"
 nf_itz_border.9.t:0 "Втрата Сталевого Міста"
 nf_itz_border.9.d:0 "Сталеве Місто втрачено — його заполонили хвилі солдатів із залишків корпорації Петро-Чіко. Місто було безцінним для нашої економіки, постачаючи достатньо сировини для обслуговування значної частини наших військових потреб. На жаль, поразка, схоже, стала наслідком прямої відмови Меродеадорес та Ехерсіто співпрацювати — у результаті обидві сили хоробро билися, захищаючи місто, але зрештою були обійдені з флангів поодинці."
 nf_itz_border.9.a:0 "Якби їхня кола не була такою смачною, ми б зараз були неймовірно люті."
 nf_itz_border.10.t:0 "Непереконливі результати на Північному фронті"
 nf_itz_border.10.d:0 "Наша сутичка із залишками корпорації Петро-Чіко не дала остаточних результатів — хоча ми відкинули їх від Сталевого Міста, місто зазнало незліченної шкоди від кількох днів інтенсивних боїв. Попри те, що Меродеадорес та Ехерсіто спочатку важко співпрацювали для захисту міста, вони знайшли спільну мову, коли військовий район почав піддаватися інтенсивному обстрілу, і разом відбили ворожу атаку. Хоча це не повна перемога, ми, ймовірно, ще деякий час не побачимо прапорів Петро-Чіко під стінами Сталевого Міста."
 nf_itz_border.10.a:0 "Незначна перемога."
 nf_itz_border.11.t:0 "Перемога у Сталевому Місті"
 nf_itz_border.11.d:0 "Сталеве Місто впало — його заполонили хвилі солдатів із залишків корпорації Петро-Чіко. Це місто буде безцінним для нашої економіки, постачаючи достатньо сировини для обслуговування значної частини наших військових потреб. Наша перемога, схоже, стала наслідком прямої відмови Меродеадорес та Ехерсіто, двох головних армійських груп Іца, співпрацювати — у результаті обидві сили хоробро билися, захищаючи місто, але зрештою були обійдені з флангів поодинці."
 nf_itz_border.11.a:0 "Чудово!"
 nf_itz_border.12.t:0 "Поразка під Сталевим Містом"
 nf_itz_border.12.d:0 "Наші сили були відкинуті від Сталевого Міста після кількох днів запеклого опору — шокуюча поразка. І Ехерсіто, і Меродеадорес, два збройні формування Іца, відклали свої розбіжності та згуртувалися під прапором Іца — можливість, яку ми не передбачали, починаючи атаку. У хаосі відступу ми залишили численну зброю, яку війська Іца охоче привласнили — безсумнівно, ми побачимо її застосування проти нас рано чи пізно."
 nf_itz_border.12.a:0 "Лайне."
 nf_itz_border.13.t:0 "Непереконливі результати навколо Сталевого Міста"
 nf_itz_border.13.d:0 "Наша сутичка з Іца навколо Сталевого Міста не дала остаточних результатів — хоча нас відкинули від міста, воно зазнало незліченної шкоди від кількох днів інтенсивних боїв. Попри те, що Меродеадорес та Ехерсіто, два збройні формування Іца, спочатку важко співпрацювали для захисту міста, вони знайшли спільну мову, коли військовий район почав піддаватися інтенсивному обстрілу, і разом відбили нашу атаку на цей район. Хоча це не остаточна поразка, ми ще деякий час не зможемо досягти подальших успіхів у цій зоні."
 nf_itz_border.13.a:0 "Незначна поразка."
 nf_itz_border.14.t:0 "Ацтлан скупчується на кордоні [814.Getname]"
 nf_itz_border.14.d:0 "Наші прикордонні війська в [814.GetName] останнім часом надсилають тривожні повідомлення — схоже, Ацтлан стягує свої війська до нашого кордону, готуючись до нападу. Вони, здається, думають, що політичної нестабільності, яку ми зараз переживаємо, буде достатньо, щоб їхні нікчемні сили «відвоювали» якусь територію — ми доведемо, що вони помиляються."
 nf_itz_border.14.a:0 "Нестабільні, але не зломлені"
 nf_itz_border.15.t:0 "Перемога на Заході"
 nf_itz_border.15.d:0 "Сили Ацтлану рятуються втечею — ми знову перемогли! Ехерсіто, що стояло гарнізоном на нашому західному кордоні, виконало наказ і хоробро захищало свої форти — так завзято, що масовані сили Ацтлану були розбиті вщент. Вони точно не атакуватимуть тут знову."
 nf_itz_border.15.a:0 "Ехерсіто виграло цей день"
 nf_itz_border.16.t:0 "Втрата на Заході"
 nf_itz_border.16.d:0 "Хоча наші війська хоробро билися, сили Ацтлану придушили наших своєю чисельністю. Наші війська були змушені відійти від кордону, віддавши Ацтлану значну смугу нової землі. Ми повинні швидко підготувати нашу оборону знову, щоб упевнитися, що у них не виникне спокуси піти на нас ще раз."
 nf_itz_border.16.a:0 "Ми скоро відвоюємо це назад"
 nf_itz_border.17.t:0 "Патова ситуація на кордоні з Ацтланом"
 nf_itz_border.17.d:0 "Непереконливі результати на фронті Ацтлану — схоже, нам вдалося стримати загарбників від захоплення земель, але ми точно не розгромили їхні армії."
 nf_itz_border.17.a:0 "Незначна перемога"
 nf_itz_border.18.t:0 "Перемога при [814.GetName]"

 # Power struggle events
 nf_itz.19.t:0 "Влада у повітрі"
 nf_itz.19.d:0 "Країна розвалюється, і цього разу Каломте немає поруч, щоб врятувати нас. Однак дві людини, схоже, надто зайняті, щоб перейматися цим — Халач-Вінік Карлос Франко і Ті'хуун Клара Ґусман. Натомість вони роблять ходи за зачиненими дверима — підраховують своїх союзників і домовляються про підтримку серед інших, адже ставки ніколи не були такими високими. Рада Старійшин була скликана на вимогу Ті'хуун, щоб визначити наступника Каломте.\n\nОчікується, що Рада обере Клару наступним лідером Іца — вона була достатньо впевнена, щоб скликати Раду. Однак Халач-Вінік і великий генералісимус Ехерсіто, Карлос Франко, сповнений рішучості не здаватися без бою, адже перемога Клари майже напевно означатиме кінець Ехерсіто в тому вигляді, в якому воно існує зараз. Наступні кілька місяців не будуть спокійними..."
 nf_itz.19.a:0 "Боги на боці Ті'хуун!"
 nf_itz.19.b:0 "Тільки Карлос та Ехерсіто можуть допомогти нам зараз..."
 nf_itz.20.t:0 "Клара зміцнює свою владу"
 nf_itz.20.d:0 "Після місяців хитрих інтриг і підступних маневрів Ті'хуун Клара Ґусман зуміла переманити більшість Ради Старійшин на свій бік. Тепер, після остаточного голосування в Раді, Клара обійняла посаду Регента і Спадкоємця Каломте, фактично отримавши необмежені повноваження з негайним набуттям чинності. Її перші реформи здаються помірними, але Ехерсіто готується до гіршого..."
 nf_itz.20.a:0 "Слава Ті'хуун Кларі, справжній спадкоємиці Каломте!"
 nf_itz.21.t:0 "Карлос досягає успіху в Раді Старійшин"
 nf_itz.21.d:0 "Після минулих квапливих тижнів реформ, Наком Карлос та Ехерсіто під його командуванням зробили достатньо, щоб переконати більшість Ради Старійшин у тому, що саме він є тією людиною, яка має замінити Каломте. Як наслідок, його призначили Регентом і Спадкоємцем Каломте, а також надали широкі надзвичайні повноваження для спроби повернути в країні лад. Він негайно розпочав військову реформу, але бюрократія, схоже, готується до гіршого..."
 nf_itz.21.a:0 "Халач-Вінік Карлос знову поведе нас до слави!"
 nf_itz.22.t:0 "Каломте одужує"
 nf_itz.22.d:0 "Вся правляча еліта Чичен-Іца прокинулася сьогодні вранці шокованою. Там був він, Каломте, одягнений у свої офіційні шати, і сидів на троні, ніби всього цього випробування ніколи й не було. Новина поширилася як лісова пожежа по двору, а потім і по місту, адже Каломте оговтався від, здавалося б, смертельної травми. Хоч це й диво, тепер це реальність, і Каломте не виглядає надто задоволеним ні Кларою, ні Карлосом, дізнавшись, як сильно вони прагнули його замінити..."
 nf_itz.22.a:0 "Каломте знову перехитрив смерть!"
 itz_ps.1.t:0 "Рейд на штаб-квартиру Ехерсіто"
 itz_ps.1.d:0 "Сьогодні рано-вранці невідома банда рейдерів напала на штаб-квартиру Ехерсіто, вбивши сотні людей і зайнявши значну частину комплексу, перш ніж їх змусили відступити контратакою. Хоча версія про те, що велика банда рейдерів могла здійснити такий напад через хаос після поранення Каломте, є досить правдоподібною, здається малоймовірним, що вони билися б так добре, зазнаючи значних втрат. Тому ми підозрюємо, що до рейду були причетні підрозділи Меродеадорес, а отже, ми вважаємо, що Клара була безпосередньо залучена. Схоже, вона дуже хоче нас знищити..."
 itz_ps.1.a:0 "Вона зробила фатальну помилку..."
 itz_ps.2.t:0 "Клара з'являється разом із Каломте"
 itz_ps.2.d:0 "У відвертій спробі покращити свою жалюгідну легітимність Ті'хуун Клара сьогодні з'явилася на балконі палацу разом із критично хворим Каломте. Потім вона виголосила досить плутану промову про свою підтримку його, поки Каломте незграбно сидів у кріслі. Хоча подія, можливо, і не була ідеальною, це, безумовно, краще за все, що вдалося зробити нам, і це загрожує надати Кларі більше впливу в перегонах!"
 itz_ps.2.a:0 "Ми відповімо ударом на удар, по-своєму."
 itz_ps.2.b:0 "У цю гру можна грати вдвох!"
 itz_ps.3.t:0 "Клара намагається лікувати Каломте"
 itz_ps.3.d:0 "Отримання контролю над апаратом влади ніколи не було проблемою для Клари, але легітимність була. У своїй останній спробі здобути останнє, Клара досить гучно заявила, що вона направила безліч дослідників Імперії на пошуки ліків від травми та хвороби Каломте. Це, очевидно, сподобалося Старійшинам, які надають значну перевагу Каломте над Карлосом чи Кларою, і сподобається ще більше, якщо вона досягне успіху. Теоретично ми могли б втрутитися в дослідження, щоб гарантувати відсутність покращень, але ми ризикуємо бути викритими!"
 itz_ps.3.a:0 "Нехай спробує!"
 itz_ps.3.b:0 "Втрутитися в дослідження."
 itz_ps.4.t:0 "Клара розширює Меродеадорес"
 itz_ps.4.d:0 "Хоча Карлос безпосередньо командує Ехерсіто і користується повагою Вач, залишається одна група збройних сил, яка перебуває поза його контролем. Ця група, Меродеадорес, схоже, стала на бік Клари в боротьбі за владу і, ймовірно, відповідальна за кілька невеликих нападів на наші конвої та комплекси протягом останніх тижнів. Тому її нещодавнє розширення Меродеадорес є прямою загрозою для нашого майбутнього правління. Ми могли б відповісти саботажем її вербування, якби мали достатньо політичного капіталу для відповіді."
 itz_ps.4.a:0 "Ще кілька прихвостнів не становлять для нас загрози..."
 itz_ps.4.b:0 "Саботувати її вербування!"
 itz_ps.5.t:0 "Рейд на штаб-квартиру Меродеадорес"
 itz_ps.5.d:0 "Вчинивши обурливий акт, Ехерсіто відкрито вступили в сутичку з Меродеадорес навколо штаб-квартири останніх. Під фальшивим приводом «національної безпеки» Ехерсіто штурмували частину комплексу на світанку, вбивши сотні людей, перш ніж були змушені відступити через політичне обурення та краще підготовлені війська Меродеадорес. Ще більш обурливим за напад є їхнє відкрите визнання відповідальності, що, як не дивно, значною мірою переконало як громадськість, так і Старійшин, що вони — найкращі руки, щоб вести нас у ці смутні часи."
 itz_ps.5.a:0 "Вони справді жадають влади!"
 itz_ps.6.t:0 "Ехерсіто проводить парад"
 itz_ps.6.d:0 "Сьогодні вранці еліта Ехерсіто пройшла маршем вулицями Чичен-Іца, демонструючи свою дисципліну та показне спорядження захопленій публіці. Хоча ми спочатку побоювалися, що це початок збройного путчу, виявилося, що Ехерсіто лише намагалися схилити громадськість на свій бік у рамках боротьби за владу між ними та Кларою. Проте це все одно було сприйнято небезпечно добре народом Чичен-Іца..."
 itz_ps.6.a:0 "Це не становить загрози"
 itz_ps.6.b:0 "Організувати парад Меродеадорес!"
 itz_ps.7.t:0 "Карлос заохочує вступ до війська"
 itz_ps.7.d:0 "У радіозверненні до нації минулої ночі Карлос особисто закликав юнаків країни вступати до лав Ехерсіто або Вач і допомогти захистити Імперію від її численних ворогів. Його, треба визнати, досить запальна промова, схоже, дуже сподобалася Старійшинам, які стурбовані тим, що Імперія, збудована Каломте, руйнується за нового лідера."
 itz_ps.7.a:0 "Хай буде як буде."
 itz_ps.7.b:0 "Саботувати його вербування!"
 itz_ps.8.t:0 "Ехерсіто виробляє споживчі товари"
 itz_ps.8.d:0 "Через роки війни Ехерсіто володіє та керує значною частиною наших військових заводів. Хоча вони зазвичай використовують їх для виробництва зброї для своїх військ, а також кількох предметів розкоші для своїх офіцерів, нещодавно вони перепрофілювали кілька заводів на більш благодійну мету. Замість того, щоб виробляти кулі, деякі заводи Ехерсіто виготовляють одяг та меблі на радість багатьом людям."
 itz_ps.8.a:0 "Це не загроза для нас!"
 itz_ps.8.b:0 "У цю гру можна грати вдвох!"
 # Post–struggle
 nf_itz.23.t:0 "Арешт Ті'хуун"
 nf_itz.23.d:0 "Усі знали, що це станеться. З [Root.GetLeader] при владі, дні Клари як вільної громадянки Іца були полічені. Треба віддати їй належне: Клара вирішила залишитися у своєму помешканні і не тікати зі столиці, попри те, що саме так вчинили багато її близьких союзників. Однак, коли люди нарешті прийшли її заарештувати, Клара..."
 nf_itz.23.a:0 "мирно підкорилася."
 nf_itz.23.b:0 "билася, доки її не здолали!"
 nf_itz.24.t:0 "Завершення Великого Палацу"
 nf_itz.24.d:0 "Це нарешті сталося — майже через три місяці після наказу про початок будівництва Великий Палац Іца завершено. Жоден громадянин Іца ніколи не бачив нічого настільки величного. Дійсно, Палац перевершує своєю красою навіть саме Чичен-Іца. Він..."
 nf_itz.24.a:0 "прекрасний, якщо не зважати на вартість..."
 nf_itz.24.b:0 "достатньо величний для трьох Королівств"
 nf_itz.25.t:0 "Смерть Себастьяна"
 nf_itz.25.d:0 "Нас спіткав скорботний день — наш улюблений Каломте Себастьян II покинув наш світ. Його поховають у Великому Палаці, і на його честь буде принесено в жертву сотню незайманих дівчат."
 nf_itz.25.a:0 "Світ ніколи не знатиме такої великої людини"
 nf_itz.26.t:0 "Доля генералів"
 nf_itz.26.d:0 "Великі генерали Ехерсіто на чолі з Халач-Вініком Карлосом Франко були ув'язнені в підземеллі після завершення боротьби за владу. Тепер ми повинні вирішити їхнє майбутнє. Було висунуто три можливі теорії: стратити їх усіх для демонстрації сили, стратити лише Халач-Вініка або залишити їх усіх керувати нашими арміями під суворим наглядом. Люди жадають крові, але чи має військовий пріоритет?"
 nf_itz.26.a:0 "Стратити їх усіх!"
 nf_itz.26.b:0 "Померти має тільки Карлос."
 nf_itz.26.c:0 "Ці люди потрібні нам живими..."
 nf_itz.27.t:0 "Генерали Ехерсіто здійснюють переворот!"
 nf_itz.27.d:0 "Вочевидь, усе ще ображені поразкою Карлоса в боротьбі за владу багато місяців тому та подальшим падінням Ехерсіто в немилість, безліч генералів Ехерсіто розпочали спробу військового захоплення влади! На щастя, охоронець [Root.GetLeader] запобіг замаху на життя, і незабаром вдалося скоординувати наші лояльні сили, які значно переважали сили генералів Ехерсіто, щоб розгромити їх."
 nf_itz.27.a:0 "Ми повинні були вбити генералів, коли мали таку можливість!"
 nf_itz.28.t:0 "Питання спадкоємності"
 nf_itz.28.d:0 "TODO"
 nf_itz.28.a:0 "Первородство звучить ідеально"
 nf_itz.28.b:0 "Призначити наступника, але залишити Раду Старійшин"
 nf_itz.29.t:0 "Доля Клари Ґусман"
 nf_itz.29.d:0 "Після захоплення лояльними військами Клара проводила свої дні в ув'язненні в підземеллі, очікуючи новин про свою долю. Є два логічні варіанти. Або ми повинні стратити Клару і провести чистку бюрократії — опори влади Клари, або ж залишити і Клару, і бюрократів живими, але під суворим наглядом. Чистка зашкодить нам у короткостроковій перспективі — і люди жадають крові — але чи варта збереження працездатності країни більшого в ці смутні часи?"
 nf_itz.29.a:0 "Клара має піти."
 nf_itz.29.b:0 "Бюрократи підтримують нашу роботу."
 nf_itz.30.t:0 "Перший Чотирирічний план"
 nf_itz.30.d:0 "Чудову ідею було запропоновано Ті'хуун — можливість спрямувати всю економіку на досягнення єдиної, заздалегідь спланованої мети. Є чотири різні цілі, на які ми могли б націлити цей план: збільшення будівництва, розширення видобутку ресурсів, покращення виробництва або розширення досліджень. Що б ми не обрали, ми повинні спрямувати економіку на досягнення цього протягом виділених чотирьох років — незалежно від ціни. Потім ми зможемо обрати іншу спеціалізацію або продовжити поточну на більш просунутому рівні."
 nf_itz.30.a:0 "Зосередитися на будівництві."
 nf_itz.30.b:0 "Зосередитися на видобутку ресурсів."
 nf_itz.30.c:0 "Зосередитися на виробництві."
 nf_itz.30.e:0 "Зосередитися на дослідженнях."
 nf_itz.300.t:0 "Другий Чотирирічний план"
 nf_itz.300.d:0 "Після успіху попереднього чотирирічного плану ми вирішили розробити новий план і знову спрямувати економіку до єдиної мети. Було запропоновано ті самі чотири цілі, що й в останньому плані. Якщо ми вирішимо зосередитися на тій самій меті, що й в останньому плані, ми зможемо використати наш досвід з минулого плану, щоб подвоїти зусилля, хоча це буде трохи на шкоду іншим трьом сферам. Обирайте з розумом!"
 nf_itz.300.a:0 "Подвоїти зусилля на будівництві!"
 nf_itz.300.b:0 "Подвоїти зусилля на видобутку ресурсів!"
 nf_itz.300.c:0 "Подвоїти зусилля на виробництві!"
 nf_itz.300.e:0 "Подвоїти зусилля на дослідженнях!"
 # Resurgence Events
 nf_itz.31.t:0 "Проблема [TDT.GetName]"
 nf_itz.31.d:0 "[TDT.GetName] завжди були проблемою. Під час нашого першого становлення вони практикували нашу культуру поза нашим правлінням. Коли ми почали розширюватися, вони чинили запеклий опір. Коли ми нарешті інтегрували їх через плетіння династичних інтриг та люту дуель, вони проголосили незалежність у наш найслабший момент. Тепер нам потрібно визначитися з політикою, щоб розібратися з ними раз і назавжди."
 nf_itz.31.a:0 "Їх потрібно твердо повернути в лоно держави."
 nf_itz.31.b:0 "Дипломатичні інтриги можуть знову привести нас до цього."
 nf_itz.32.t:0 "Іца вимагають анексії"
 nf_itz.32.d:0 "Донедавна Іца перебували в досить жалюгідному стані. Після хаосу запеклої боротьби за владу Іца певною мірою «вибухнули» зсередини. Однак в останні місяці Іца знову почали діяти сміливо у своїх патрулях. Вони почали перетинати річку на нашу землю, і ми маємо відомості, що вони роблять те саме на території, контрольованій Ацтланом. Сьогодні, що найжахливіше, ми отримали досить тривожне повідомлення від Іца, безпосередньо від [ITZ.GetLeader]. Воно вимагає нашої повної анексії до складу Іца негайно, щоб вони могли краще захистити наші народи від орд Ацтлану... \n\nЙмовірно, нам бракує військової сили, щоб битися з Іца на рівних, тому деякі члени ради дотримуються думки, що ми повинні підкоритися Іца, а потім втекти до Ацтлану, що дозволить нашому народу уникнути кривавої війни. Або ж ми можемо захищати нашу батьківщину до останнього!"
 nf_itz.32.a:0 "Іца можуть забрати країну, але не нас разом з нею!"
 nf_itz.32.b:0 "Ні, тільки не це знову!"
 nf_itz.33.t:0 "Цоціль погоджується на анексію"
 nf_itz.33.d:0 "Правителі Цоціля сьогодні проявили розсудливість, вирішивши підкоритися нашій вимозі про анексію, аніж стикнутися з анексією силою або ордами Ацтлану. Наші війська вже почали входити в країну, і ми очікуємо на належну комунікацію з королівською родиною будь-якої хвилини, щойно наші війська досягнуть столиці..."
 nf_itz.33.a:0 "Чудово... чекайте! А де королівська родина?"
 nf_itz.34.t:0 "Цоціль чинить опір"
 nf_itz.34.d:0 "Правителі Цоціля, схоже, сповнені рішучості марнувати життя та ресурси, захищаючи територію, яка по праву належить нам. Наші війська вже почали здійснювати розвідувальні атаки на кордоні, як початок повномасштабного вторгнення. Наш час настав!"
 nf_itz.34.a:0 "Ганьба..."
 nf_itz.35.t:0 "Біженці з Цоціля"
 nf_itz.35.d:0 "Всього кілька днів тому правлячий клас Цоціля вирішив поступитися вимогам Іца щодо анексії, замість того, щоб боротися. Однак у правлячого класу не вистачило духу залишитися у своєму палаці й чекати на окупаційні війська, ні! Натомість вони втекли на нашу землю, шукаючи притулку, доки ми не зможемо знову посадити їх на трон."
 nf_itz.35.a:0 "Вони нам ще знадобляться..."
 nf_itz.36.t:0 "Іца вимагають покірності"
 nf_itz.36.d:0 "Донедавна Іца перебували в досить жалюгідному стані. Після хаосу запеклої боротьби за владу Іца певною мірою зазнали внутрішнього краху. Однак в останні місяці Іца знову почали діяти сміливо у своїх патрулях. Вони почали перетинати річку на нашу землю, і ми маємо відомості, що вони роблять те саме на території, контрольованій Ацтланом. Сьогодні, що найжахливіше, ми отримали досить тривожне повідомлення від Іца, безпосередньо від [ITZ.GetLeader]. Воно вимагає, щоб ми негайно присягнули на вірність Іца, аби вони могли краще захистити наші народи від орд Ацтлану. Воно також містить запевнення, що ми залишимося на своїх владних посадах. Виграш для всіх?"
 nf_itz.36.a:0 "Схоже, ми домовилися."
 nf_itz.36.b:0 "Ми вже жили під владою Іца. Ніколи знову!"
 nf_itz.37.t:0 "Цоціль присягає на вірність"
 nf_itz.37.d:0 "Згідно з нашими вимогами, правлячий клас Цоціля присягнув на вірність [ITZ.GetLeader]. Тепер ми маємо більш-менш повний контроль над країною, що гарантує, що вона залишиться дружньою буферною державою проти будь-якого вторгнення Ацтлану."
 nf_itz.37.a:0 "Чудово!"
 nf_itz.38.t:0 "Цоціль чинить опір"
 nf_itz.38.d:0 "Правителі Цоціля, схоже, сповнені рішучості марнувати життя та ресурси, захищаючи територію, яка по праву належить нам. Наші війська вже почали здійснювати розвідувальні атаки на кордоні, переходячи до повномасштабного вторгнення. Наш час настав!"
 nf_itz.38.a:0 "Ганьба..."
 nf_itz.39.t:0 "Зброя від Іца"
 nf_itz.39.d:0 "Натхненний нашою пильністю щодо рейдерів, з якими ми стикаємося на наших південних кордонах, [ITZ.GetLeader] вирішив надіслати нам безліч їхньої новітньої зброї. Хоча це дещо поблажливий подарунок, будь-яка зброя вітається в нашій боротьбі з рейдерами. Це, безумовно, зблизить нас з Іца, і, судячи зі все більш експансіоністської риторики, що лунає від [ITZ.GetLeader], це вигідна позиція."
 nf_itz.39.a:0 "Ми цінуємо їхній жест!"
 nf_itz.40.t:0 "Проблема [GRH.GetName]"
 nf_itz.40.d:0 "Наші стосунки з [GRH.GetName] завжди були складними. Хоча вони виконують важливу роботу, захищаючи наш південний кордон, а отже, і більшу частину Мексики, від рейдерів, що напливають із Центральної та Південної Америки, вони також часто продають свої послуги нашим ворогам. Не раз битва, яка мала б стати легкою перемогою, перетворювалася на тривалу бійню через прибуття гондураських найманців. Тому, можливо, варто нав'язати їм наше політичне домінування, щоб гарантувати, що їхні бійці ніколи не працюватимуть на ворога. Або ж ми могли б спробувати укласти військовий союз із [GRH.GetName], гарантуючи, що вони зможуть продовжувати відбиватися від рейдерів без втручання Ацтлану чи будь-якого іншого гравця."
 nf_itz.40.a:0 "Залишати незалежну державу на кордоні нашого серця — це занадто великий ризик."
 nf_itz.40.b:0 "Їхня робота викликає захоплення. Запропонуймо альянс."
 nf_itz.41.t:0 "Іца шукають союзу"
 nf_itz.41.d:0 "Сьогодні прибули дипломати з Імперії Іца, передавши [ROOT.GetLeader] особисту пропозицію від [ITZ.GetLeader]. У повідомленні вони пропонують союз між нами та Імперією Іца, включаючи зобов'язання захищати одне одного у разі нападу. [ITZ.GetLeader] каже, що це чесний обмін: вони запропонують підтримку проти рейдерів, а ми надамо наш досвід, якщо Ацтлан колись постукає у двері Іца. Втім, ми й досі непогано справлялися з рейдерами, тож чи варта ця угода того?"
 nf_itz.41.a:0 "Альянс звучить взаємовигідно!"
 nf_itz.41.b:0 "Ми воліємо вести власні битви..."
 nf_itz.42.t:0 "[GRH.GetName] приймає союз"
 nf_itz.42.d:0 "Після кількох днів торгів щодо деталей політики керівництво Гондурасу погодилося на союз між нашими двома великими націями. Згідно з договором, ми надамо підтримку у вигляді боєприпасів і людей проти рейдерів з півдня, а в обмін гондурасці нададуть своїх людей і досвід, якщо Ацтлан колись постукає у наші двері. І все це погоджено без кровопролиття!"
 nf_itz.42.a:0 "Тост за наших нових гондураських друзів!"
 nf_itz.43.t:0 "[GRH.GetName] відмовляється..."
 nf_itz.43.d:0 "Попри всі зусилля наших найкращих дипломатів, керівництво Гондурасу відхилило нашу пропозицію про союз, вважаючи її занадто «односторонньою». Хоча це правда, що вони досить добре стримували рейдерів, невже їм завадило б ще кілька людей?"
 nf_itz.43.a:0 "Тепер мало що можна вдіяти..."
 nf_itz.44.t:0 "Іца вимагають покірності"
 nf_itz.44.d:0 "Ще рік тому уряд Іца був втягнутий у запеклу боротьбу за владу. Хоча ми усвідомлювали, що останнім часом Імперія Іца відновила інтерес до нас, ми ніколи не уявляли, що вони матимуть нахабство вимагати нашої покірності! І справді, вони вважають, що їхні свіжовичищені збройні сили є гідним суперником для наших загартованих у боях військ — і, можливо, так воно і є. Ми маємо майже беззаперечну перевагу в досвіді, але Іца можуть кинути на нас сорок тіл за кожного нашого солдата і навіть не спітніти. Це буде важкий бій — чи готові ми марнувати життя у такій війні?"
 nf_itz.44.a:0 "Нам буде найбезпечніше під захистом Іца."
 nf_itz.44.b:0 "Ми не віддамо нашу свободу без бою!"
 nf_itz.45.t:0 "[GRH.GetName] погоджується на умови"
 nf_itz.45.d:0 "Керівництво Гондурасу сьогодні погодилося на наші вимоги щодо сюзеренітету, безсумнівно, заохочене нашими військами, що скупчилися на їхньому кордоні. Це значна політична перемога для [ROOT.GetLeader], яка показує, що агресивна зовнішня політика приносить свої плоди. Якщо пощастить, це також змусить псів Ацтлану двічі подумати, перш ніж розглядати агресивний удар у наші джунглі, оскільки досвід гондурасців у джунглях відомий у всій Пустці!"
 nf_itz.45.a:0 "Наша авантюра окупилася!"
 nf_itz.46.t:0 "[GRH.GetName] відмовляється схилити коліно"
 nf_itz.46.d:0 "Попри наші більш ніж чіткі погрози військового втручання, [GRH.GetLeader] все ж якимось чином вирішив не схиляти коліно перед нашою великою нацією. Сумно! Схоже, у нас не буде іншого вибору, окрім як захистити наші інтереси силою, тому що залишати таку непередбачувану державу на нашому південному кордоні є значним ризиком."
 nf_itz.46.a:0 "У нас є інші способи гарантувати їхню покірність!"
 nf_itz.47.t:0 "[GRH.GetName] зраджує нас!"
 nf_itz.47.d:0 "Після сильного тиску з боку Імперії Іца наш маріонетковий уряд у Гондурасі поступився вимогам Іца про покірність, не порадившись спершу з нами. Безсумнівно, вони бачать в Іца сильнішого військового захисника!"
 nf_itz.47.a:0 "Абсурд!"
 nf_itz.48.t:0 "Шлюб Ті'хуун і Команданте"
 nf_itz.48.d:0 "Хоча у Клари було багато претендентів на її руку, жоден з них не мав такого статусу, як Луїс. Хоча Клара дала чітко зрозуміти, що вона не прагне шлюбу з любові, принаймні не з чоловіком, навіть вона не могла проґавити можливість, яку приніс би шлюб з Луїсом, — а саме, залізну хватку над землями Гондурасу. Церемонія пройшла з максимально можливою помпезністю та урочистістю, як демонстрація єдності та спроба показати владу Клари після нещодавньої боротьби за владу, що сколихнула Іца."
 nf_itz.48.a:0 "Монументальна подія!"
 nf_itz.49.t:0 "Стратегічний шлюб Ті'хуун Клари"
 nf_itz.49.d:0 "Сьогодні опівдні Клара та Максимо Вела, найбільш високопоставлений дворянин аристократії Цоціля, одружилися під час грандіозної церемонії в Чичен-Іца. Хоча Клара дала чітко зрозуміти, що вона не прагне шлюбу з любові, принаймні не з чоловіком, навіть вона не могла проґавити можливість, яку приніс би шлюб із Велою, — а саме, залізну хватку над землями Цоціля. Дійсно, її красномовство (і повна відсутність мізків у Вели) дозволили їй навіть домовитися про коронацію як лідера Цоціля, що шокувало майже всю аристократію обох націй."
 nf_itz.49.a:0 "Плетіння павутини принесло Кларі ще один трон."
 nf_itz.50.t:0 "Роботи Моктесуми"
 nf_itz.50.d:0 "Ми завжди смутно знали про Тлалока. Відтоді як він знищив величезні сили Ацтлану — крок, який дозволив нам також відбити атаки сил Ацтлану на наші землі, — ми відчували неохочу повагу до його роботів. Однак Тлалока більше немає. Роки внутрішньої боротьби в його підпрограмах нарешті вбили особистість, яку ми колись поважали, і замінили її трьома набагато гіршими ворогами. Один з них, що називає себе Моктесумою на честь стародавнього ацтекського імператора, схоже, одержимий відновленням ацтекської імперії, якою колись володів його історичний двійник. Роботу, здається, байдуже, кого вбивати задля досягнення своєї мети, і як ацтланці, так і іца стали жертвами його орд роботів. Що ще гірше, наші війська, здається, бояться його роботів, що різко знижує їхню готовність тримати оборону. Катастрофа на порозі!"
 nf_itz.50.a:0 "Наші люди відступають у жаху при їхньому вигляді!"
 nf_itz.50.b:0 "Наші жерці попереджали нас про цих чудовиськ..."
 nf_itz.51.t:0 "Наведення мостів?"
 nf_itz.51.d:0 "Хоча Ацтлан і ми часто гриземося між собою, не всі при дворі Ацтлану вважають, що наша давня ворожнеча повинна тривати. Дійсно, в Ацтлані є значна фракція «Орли», які вбачають у нас менше з двох зол у порівнянні з Тлалоком на півночі. Якщо ми налагодимо правильні контакти, а «Орли» матимуть достатній вплив в уряді, ми, можливо, зможемо покласти край цій напруженості назавжди, але якою ціною?"
 nf_itz.51.a:0 "Ми не можемо відвернутися від давніх традицій!"
 nf_itz.51.b:0 "Вони повинні потрапити під п'яту Клари!"
 nf_itz.51.c:0 "Спроба не катування... Чи не так?"
 nf_itz.52.t:0 "Розрядка з Іца?"
 nf_itz.52.d:0 "Хоча наша офіційна політика — це відверта ворожість до Імперії Чичен-Іца, ми залишаємо певні дипломатичні кулуарні канали відкритими для їхніх дипломатів, як і вони для наших. Нещодавно через одного з наших контактів у [CAF.GetName] нас поінформували про настрої в раді Іца щодо певної форми розрядки і навіть можливості тепліших відносин між двома імперіями. Хоча це надзвичайний поворот політики, він, безумовно, заслуговує на увагу..."
 nf_itz.52.a:0 "Вони ж це не серйозно?!?"
 nf_itz.52.b:0 "Ну, це не звучить як така вже жахлива ідея..."
 nf_itz.53.t:0 "Ацтлан відкидає розрядку"
 nf_itz.53.d:0 "Можливо, не дивно, що [ATE.GetLeader] та оточення відхилили наші пропозиції про розрядку. Натомість вони, схоже, одержимі підготовкою до війни проти нас, можливо, через десятиліття кривавих конфліктів, які ми вели вздовж нашого спільного кордону. Це, м'яко кажучи, завдає удару по дипломатичних амбіціях Клари, але це точно не кінець світу."
 nf_itz.53.a:0 "Спроба не катування."
 nf_itz.54.t:0 "Ацтлан здається сприйнятливим"
 nf_itz.54.d:0 "Хоча ми почали хвилюватися через мовчання з боку [ATE.GetLeader] після нашої пропозиції про розрядку, сьогодні ми отримали обнадійливе повідомлення через дипломатичні кулуарні канали. Отримане від неназваного ацтланського аристократа, воно було копією листа, надісланого до двору Ацтлану самим [ATE.GetLeader], де чітко перелічено переваги, які принесе розрядка. Очевидно, що Ацтлан ще не може оголосити про свої наміри, але лист натякає, що попереду хороші зміни..."
 nf_itz.54.a:0 "Давайте розвивати це далі."
 nf_itz.55.t:0 "Іца вимагають, щоб ми обрали сторону!"
 nf_itz.55.d:0 "Після початку тотальної війни між імперіями Іца та Ацтлан ми отримали досить різке комюніке від [ITZ.GetLeader], в якому вимагається наш союз з ними у війні. Ми володіємо величезними стратегічними ресурсами і могли б дозволити Іца відкрити ще один фронт проти сил Ацтлану, тому зрозуміло, чому була висунута ця вимога. Невиконання вимоги, як вони стверджують, призведе до негайного оголошення війни з боку Іца проти нас, тож, схоже, ми нарешті повинні обрати сторону."
 nf_itz.55.a:0 "Ми повинні підкоритися Іца..."
 nf_itz.55.b:0 "Відмовити їхнім вимогам!"
 nf_itz.56.t:0 "[CAF.GetNameDef] підкоряється!"
 nf_itz.56.d:0 "[CAF.GetName] виявили розсудливість і вирішили сьогодні запросити наші війська на свою землю з наміром «захистити» свій народ і ферми від ацтланських загарбників. Оскільки ми обоє добре знаємо, наші війська негайно почнуть відкривати другий фронт проти Ацтлану на півдні, можливо, навіть відрізавши ацтланські сили від їхньої батьківщини. Це значна політична перемога!"
 nf_itz.56.a:0 "Добре!"
 nf_itz.57.t:0 "[CAF.GetNameDef] чинить опір!"
 nf_itz.57.d:0 "Попри нашу пряму погрозу війною, керівництво [Caf.GetName] вважало за потрібне відмовити нашим вимогам приєднатися до війни на нашому боці. Натомість вони, схоже, вірять, що Ацтлан захистить їх краще. Тепер, коли вони так очевидно обрали сторону, у нас немає іншого вибору, окрім як умиротворити їхні землі іншими засобами."
 nf_itz.57.a:0 "Хто не з нами, той проти нас!"
 nf_itz.58.t:0 "Останній рубеж"
 nf_itz.58.d:0 "Сотні років набридливі орди Ацтлану на заході були чумою для наших кордонів. У наших численних сутичках і нечастих війнах було втрачено багато життів по обидва боки кордону, а багато поселень було стерто з лиця землі арміями мародерів. Годі. Настав час покінчити з загрозою Ацтлану раз і назавжди — шляхом дипломатії або знищення. Наші конфлікти з Ацтланом більше ніколи не повинні загрожувати нашому миру, інакше ми не зможемо розширюватися на північ і схід до нових земель!"
 nf_itz.58.a:0 "Вони мають бути знищені!"
 nf_itz.58.b:0 "Час для відкритої дипломатії настав!"
 nf_itz.59.t:0 "Шлюб Клари та Рафаеля"
 nf_itz.59.d:0 "Як зцілити десятиліття конфлікту і кровопролиття? Що ж, здається, все просто: весілля. Сьогодні опівдні Клара і Рафаель виголосили свої обітниці та назавжди змінили хід історії Іца і Ацтлану. Хоча Клара дала чітко зрозуміти, що вона не прагне шлюбу з любові, принаймні не з чоловіком, навіть вона не могла проґавити можливість, яку приніс би шлюб із Рафаелем, — а саме, союз із їхнім колишнім смертельним ворогом. Цей альянс означає, що сили Ацтлану та Іца можуть бути зосереджені проти спільних ворогів на півночі, а також проти тих, хто відмовляється схилити коліно на півдні. Воістину, вся Мексика повинна боятися цього союзу."
 nf_itz.59.a:0 "Вип'ємо за тисячу років дружби!"
 nf_itz.60.t:0 "Народження Мезоамериканського альянсу"
 nf_itz.60.d:0 "Після одруження правительки [ITZ.GetName], Клари, та правителя [ATE.GetName], Рафаеля, давні образи, що десятиліттями підживлювали конфлікт між Ацтланом та Іца, були зцілені. Натомість правителі двох величезних імперій проголосили новий пакт, Мезоамериканський альянс, з наміром покласти край кривавим прикордонним конфліктам, що терзали спільний кордон. Як додатковий бонус, вони домовилися про повну військову співпрацю. Це лякаюча перспектива, враховуючи величезні території, які контролюють ці дві імперії разом..."
 nf_itz.60.a:0 "Грізний альянс, без сумніву..."
 nf_itz.61.t:0 "Громадянська війна в Імперії Ацтлан"
 nf_itz.61.d:0 "Після вбивства Оратора Ацтлану Єсенії Ацтланль імперія Ацтлан поринула в хаос. В імперії виникли дві фракції, Ягуари та Орли, кожна з яких прагне захопити трон Ацтлану і повести його проти тих, кого вони вважають своїм смертельним ворогом. Розкол між двома фракціями пронизує всі аспекти імперії Ацтлан, аж до самої армії. Як наслідок, армійські підрозділи Ацтлану майже повністю відійшли від нашого кордону, швидко передислоковуючись для захоплення міст і поселень у спробах отримати перевагу в громадянській війні. В результаті території Квіткової війни, за які було пролито стільки крові, — це безкоштовна нерухомість для нас!"
 nf_itz.61.a:0 "Це безкоштовна нерухомість!"
 nf_itz.62.t:0 "Зцілення Каломте"
 nf_itz.62.d:0 "Каломте, лежачи в ліжку, являє собою жалюгідне видовище. У перші тижні після поранення він ледь ворушився у своєму глибокому сні, і наші жерці з кожним днем усе більше сумніваються, що Каломте зможе одужати. Проте, за допомогою Держави, одужання все ж може бути можливим. Відволікши частину наших дослідників від їхніх попередніх завдань і спрямувавши їх на розробку ліків для Каломте, ми зможемо правдоподібно стверджувати, що намагаємося лікувати бідолашного Каломте. Якщо ми повторюватимемо це досить часто, ми можемо навіть досягти успіху..."
 nf_itz.62.a:0 "Спроба не катування!"
 nf_itz.62.b:0 "Каломте? Ти прокинувся?"
 nf_itz.63.t:0 "[CAF.GetNameDef] підкоряється Іца"
 nf_itz.63.d:0 "Після тиску з боку [ITZ.GetLeader] боягузи з [CAF.GetName] вирішили стати на бік Іца в ході триваючої боротьби. Ми повинні швидко мобілізувати сили, щоб захистити фронт, що зараз відкривається проти них."
 nf_itz.63.a:0 "Ці зрадники заплатять!"