# Decisions #
development_project_decisions_wtt:0 "Проєкти Розвитку"
development_project_decisions_wtt_desc:0 "Старі довоєнні об'єкти, особливі місця, які можуть містити цінні ресурси та інші цікаві речі для інвестицій.\n§HРезультати цих рішень залежать від вивчених технологій.§!"


development_project_rancho_seco_npp_wtt:0 "Відновити Ранчо Секо НГС"
development_project_rancho_seco_npp_wtt_desc:0 "Вперше задумана у 1960-х роках, атомна електростанція Ранчо Секо мала стати головним джерелом енергії для кількох округів Каліфорнії, але була поспішно закрита через побоювання ядерної катастрофи. Її будівництво, а також заходи безпеки, вжиті після виведення з експлуатації, роблять відновлення складним, хоча потенційна користь — величезна.\n"

development_project_storm_creek_national_military_museum_npp_wtt:0 "Відновити Національний військовий музей Сторм-Крік"
development_project_storm_creek_national_military_museum_npp_wtt_desc:0 "Національний військовий музей Сторм-Крік був грандіозним проєктом, започаткованим у розпал американського мілітаризму, частково профінансованим значною позикою від гірничодобувної компанії Alton Bourghess. Він мав служити як сховище бойової спадщини та як пропагандистський інструмент, що прославляє довоєнний військово-промисловий комплекс. Його розташування в ущелинах Сторм-Крік серед скель і древніх лісів — мальовниче й безпечне.\n\nВсередині зберігаються незліченні артефакти: зразки силової броні T-51b, креслення покинутої зброї, експонати з ключових воєн. Після Великої Війни музей лишився практично неушкодженим завдяки автоматичним турелям, сентрі-ботам і асолтронам. Вони досі патрулюють територію, безжально знищуючи грабіжників. Ходять чутки, що очі роботів стежать за кожним кроком, а деякі сміливці так і не повернулися..."

development_project_san_onofre_npp_wtt:0 "Відновити станцію Сан-Онофре"
development_project_san_onofre_npp_wtt_desc:0 "Скорочено SONGS, станція Сан-Онофре була символом амбіцій Америки — і соромом. Хоча виглядала велично, будівництво супроводжувалось халтурою: труби ведуть в нікуди, реактори встановлені навпаки, а часом і витікають токсини. І все ж, станція може принести користь.\n"

development_project_diablo_canyon_npp_wtt:0 "Відновити АЕС Діабло-Каньйон"
development_project_diablo_canyon_npp_wtt_desc:0 "Колись титан енергетики Каліфорнії, АЕС Діабло-Каньйон досі зберігає свій монументальний вигляд. Її 900 акрів розташовані на західному узбережжі. Хоча час і землетруси залишили сліди, ми сподіваємося, що вони не критичні. Можливо, ми зможемо використовувати її, як колись американці.\n"

development_project_satsop_npp_wtt:0 "Відновити АЕС Сатсоп"
development_project_satsop_npp_wtt_desc:0 "АЕС Сатсоп була частиною великого плану, замовленого WPPSS (ха-ха, «Whoops!»). Планувалося побудувати п’ять блоків, але до початку Великої Війни завершили лише два. І хоча повністю не реалізована, станція збудована на совість. Відновлення може стати дуже вигідним.\n"

development_project_palo_verde_npp_wtt:0 "Відновити АЕС Пало-Верде"
development_project_palo_verde_npp_wtt_desc:0 "Пало-Верде була найпотужнішою атомною станцією у США, виробляючи 3.3 гігават електроенергії. Вона унікальна тим, що використовувала стічні води. Так, вона смердить. Але потенціал — величезний. Трохи кмітливості, і вона знову запрацює.\n"

development_project_first_solar_spp_wtt:0 "Зібрати залишки First Solar"
development_project_first_solar_spp_wtt_desc:0 "Хоча ядерна енергія домінувала, сонячна теж мала свою нішу. First Solar — компанія, яка встигла створити великі запаси сонячних панелей. Вони так і лежать, забуті, з часів ядерного Армагеддону. Зібрати їх і встановити — справа нескладна.\n"

development_project_crecent_dunes_spp_wtt:0 "Відновити проєкт Crescent Dunes"
development_project_crecent_dunes_spp_wtt_desc:0 "Хоча ГЕЛІОС Один — легенда Мохавського Пустирища, він не один. Проєкт Crescent Dunes менш потужний, але все ще здатний забезпечити енергією цілі регіони. Той, хто його запустить, отримає велику перевагу.\n"

development_project_mountain_home_afb_wtt:0 "Відновити авіабазу Маунтін-Хоум"
development_project_mountain_home_afb_wtt_desc:0 "Північний Захід США був плацдармом для війни з Китаєм. Отже, ймовірно, тут лишилось багато матеріалів. Зокрема — на авіабазі Маунтін-Хоум. Очищення території й освоєння ресурсів має стати пріоритетом.\n"

development_project_el_centro_afb_wtt:0 "Відновити NAF Ель-Сентро"
development_project_el_centro_afb_wtt_desc:0 "Прямо на кордоні Мексики й Каліфорнії розташована авіаційна база ВМС Ель-Сентро. До війни вона служила як для навчань, так і для пропаганди. У ній досі можуть бути запаси обладнання. Не проґавмо це.\n"

development_project_whidbey_island_afb_wtt:0 "Відновити NAS Whidbey Island"
development_project_whidbey_island_afb_wtt_desc:0 "На самому північному заході лежить авіастанція Відбі-Айленд — потужна довоєнна база. Під час війни на Алясці звідси запускались численні операції. І хоч солдати зникли, їхня техніка могла залишитися.\n"

development_project_beale_afb_wtt:0 "Відновити авіабазу Біл"
development_project_beale_afb_wtt_desc:0 "Авіабаза Біл, названа на честь історичної постаті, займала 23 000 акрів. До Великої Війни вона вміщувала тисячі солдатів і величезну кількість обладнання. Частина цього добра досі може бути знайдена й використана.\n"

development_project_fairchild_afb_wtt:0 "Відновити авіабазу Ферчайлд"
development_project_fairchild_afb_wtt_desc:0 "Як і інші бази Північно-Західної Співдружності, авіабаза Ферчайлд була важливим військовим пунктом під час китайсько-американської війни, хоча її історія була значно коротшою й бурхливішою. Коли битва за Анкоридж розгорілася по-справжньому, китайці спробували атакувати США з тилу, влаштувавши заколот саме з Ферчайлда. Багато зі спорядження, покинутого в бою, досі лежить там, де його залишили — і перебуває у стані, придатному до використання або відновлення.\n"

development_project_cfb_comox_afb_wtt:0 "Очистити аеропорт долини Комокс"
development_project_cfb_comox_afb_wtt_desc:0 "Комокс мав змішаний цивільно-військовий аеропорт, поки США не закрили його. З часів Великої Війни він залишався у стані «замороженого» занепаду, але трохи прибирання — і злітно-посадкова смуга знову працюватиме... можливо, навіть і зенітки також."

development_project_sierra_army_depot_wtt:0 "Відновити Армійський Склад Сьєрра"
development_project_sierra_army_depot_wtt_desc:0 "Із цього старого об’єкта Анклаву можна витягти чимало корисного."

development_project_joint_base_lewis_mchord_wtt:0 "Відновити спільну базу Льюїс-Маккорд"
development_project_joint_base_lewis_mchord_wtt_desc:0 "Поєднання Форту Льюїс і авіабази Маккорд стало важливою точкою зосередження військ під час битви за Анкоридж і китайського вторгнення. Теоретично, ми могли б відновити злітну смугу, аби компенсувати братські могили в Сі-Таку, а можливо — і знову запустити виробництво боєприпасів, звільнивши ресурси для інших цілей."

development_project_fort_irwin_wtt:0 "Очистити об'єкти Форту Ірвін"
development_project_fort_irwin_wtt_desc:0 "Форт Ірвін був різним: полігоном для стрільб будь-якого калібру, центром тренувань бойових підрозділів, а також ексклюзивним шпиталем. Якщо зробити його безпечним, то в майстернях можна буде виробляти озброєння, а з навчальних посібників та обладнання шпиталю винести щось корисне."

development_project_fort_carson_wtt:0 "Відновити Форт Карсон"
development_project_fort_carson_wtt_desc:0 "Велика гора на заході привертає увагу тих, хто в темі, але всі інші зосереджені на більш публічному Форті Карсон, де розбирають останніх бойових роботів. Можливо, нам краще зайнятися цим місцем раніше, ніж якийсь дурний трибал винесе всі трофеї додому?"

development_project_pueblo_chemical_depot_wtt:0 "Видобути ресурси з хімічного складу Пуебло"
development_project_pueblo_chemical_depot_wtt_desc:0 "Східніше Сталеттауна і північніше міста Пуебло — гігантський кратер, повний рідин, які вб’ють тебе при дотику. Ми можемо використати їх для озброєння! І, можливо, ще й дізнаємося, як зробити так, щоб наші люди не помирали, якщо десь щось протече."

development_project_usafa_solar_plant_wtt:0 "Відновити сонячну електростанцію USAFA"
development_project_usafa_solar_plant_wtt_desc:0 "Відкрита Військово-Повітряною академією США біля Колорадо-Спрінгс, ця станція була збудована задля зменшення залежності армії від викопного палива. З потужністю понад 6 мегават, вражаюча кількість сонячних панелей досі ціла. З належними людьми, інструментами й знанням ми зможемо скористатися нею.\n"

development_project_aurora_armory_wtt:0 "Відновити арсенал Аврори"
development_project_aurora_armory_wtt_desc:0 "Колись належав Національній гвардії Колорадо. Цей арсенал забезпечував зброєю східний Денвер. Його запаси були добре захищені, тож тим, хто зуміє пробратися всередину, відкриється гора зброї та корисного обладнання...\n"

development_project_blue_castle_npp_wtt:0 "Відновити АЕС Блю-Касл"
development_project_blue_castle_npp_wtt_desc:0 "Спочатку задуманий десятиліттями до війни, проєкт Blue Castle мав на меті перевести Юту на ядерну енергетику. Те, що лишилося на південь від Іст-Карбона — лише тінь цього плану, але навіть вона — величезне джерело енергії за мірками пустки. Відновлення станції потребуватиме зусиль, але забезпечить енергетичну незалежність у майбутньому.\n"

development_project_katana_electronics_wtt:0 "Відновити Katana Electronics"
development_project_katana_electronics_wtt_desc:0 "Довоєнний виробник електроніки, розташований на сході Великого Солоного озера в Юті, Katana Electronics зіштовхнувся з неочікувано жорсткою конкуренцією на місцевому ринку. Хоч компанія переважно працювала як підрядник, її завод мав найширший асортимент електронних компонентів у всьому штаті до початку війни. Без сумніву, відновлення цього заводу дозволило б нам виготовляти якісні електронні компоненти у значно більших обсягах.\n"

development_project_tooele_army_depot_wtt:0 "Очистити армійський склад Туела"
development_project_tooele_army_depot_wtt_desc:0 "До війни тут здійснювалося машинобудування, виготовлення, робототехніка та модернізація систем озброєння США. Склад був добре укріплений, що зробило його запаси майже недосяжними. Завдяки великому запасу боєприпасів і зброї, цей об’єкт здатен забезпечити цілу війну — варто лише зробити його безпечним."

development_project_dugway_proving_ground_wtt:0 "Оглянути полігон Дагвей"
development_project_dugway_proving_ground_wtt_desc:0 "На південь від Великого Солоного озера колись знаходився центр розробки біологічної та хімічної зброї. Напередодні Великої війни ці тести перенесли в інше місце, а полігон перетворили на центр для комбінованих випробувань, де зокрема тестували T-45d. Тут і досі небезпечно, але все ж краще, ніж якби тут залишився зразок Нової чуми."

development_project_spanish_fork_armory_wtt:0 "Модернізувати арсенал у Спеніш-Форк"
development_project_spanish_fork_armory_wtt_desc:0 "Арсенал Спеніш-Форк неодноразово ледь не закрили, але зрештою він розширився до великого складу зброї й боєприпасів, який охоплював озброєння від XX до XXI століття. З належними зусиллями цей об’єкт знову може ефективно виконувати свою місію. Сподіваємось, це нам не вилізе боком."

development_project_fort_bliss_wtt:0 "Зробити Бліссські Піски безпечними"
development_project_fort_bliss_wtt_desc:0 "Земля Бліссських Пісків зливається з пусткою, і важко сказати, де закінчуються перші й починається інша. Колишній великий довоєнний об'єкт і відправна точка американської окупації Мексики перетворився на смертельну зону, яку навіть когти смерті обходять. Відновлення бази — це не лише про ресурси, а й про безпечний прохід для людей."

development_project_fort_huachuca_wtt:0 "Очистити R&D Форту Уачука"
development_project_fort_huachuca_wtt_desc:0 "Колись тут досліджували комп’ютерні мережі й електроніку, але після кампанії за повернення Анкориджа фокус змістився на зброю та броню. Відновити інфраструктуру тут буде складно, але дані, що збереглися, можуть виявитися безцінними."

development_project_yuma_proving_ground_wtt:0 "Запустити полігон Юма"
development_project_yuma_proving_ground_wtt_desc:0 "Різні типи озброєння та броні колись тестувалися в цьому куточку Арізони. Наразі це смертельно небезпечне місце, але якщо його очистити, полігон можна буде використовувати для розробки нових прототипів озброєння."

development_project_naval_air_station_fallon_wtt:0 "Припинити трансляцію з авіабази Феллон"
development_project_naval_air_station_fallon_wtt_desc:0 "Навіщо морська база посеред пустелі? Яка б не була причина, звідти досі лунають одні й ті ж пісні одного й того ж виконавця. Відновлення бази має очевидні переваги, але скільки можна слухати про 'шосе до зони небезпеки'?"

development_project_naval_air_station_lemoore_wtt:0 "Відновити базу Лемур"
development_project_naval_air_station_lemoore_wtt_desc:0 "На краю одного з багатьох кратерів Нової Каліфорнії лежить величезна авіабаза, що впадає в око серед пустелі. Якщо її адаптувати до сучасних потреб, вона знову може процвітати. Але для цього потрібно чимало інвестицій. Утім, розвиток цього району між великими містами обіцяє чималу вигоду в майбутньому."

development_project_naval_air_weapon_station_china_lake_wtt:0 "Відновити базу озброєнь China Lake"
development_project_naval_air_weapon_station_china_lake_wtt_desc:0 "Цей склад гранатометів дивом не вибухнув під час ядерного удару — натомість його закрили через потужний землетрус ще до Великої війни. Сьогодні це означає, що запаси зброї й, можливо, злітна смуга лишилися неушкодженими — все залежить від того, як ми впораємось з автоматизованою обороною."

development_project_naval_weapons_station_seal_beach_wtt:0 "Очистити Сіл-Біч"
development_project_naval_weapons_station_seal_beach_wtt_desc:0 "Природний заповідник Сіл-Біч іще до війни перетворився на звалище військових відходів. Через малу кількість населення поблизу, нових забруднень не додалося, а більшість старих змила у Тихий океан. Повністю повернути Сіл-Біч до природного стану вже неможливо, але очищення території дозволить її розвивати й усуне ще одну чорну пляму, залишену США."

development_project_naval_base_san_diego_wtt:0 "Відновити морську базу Сан-Дієго"
development_project_naval_base_san_diego_wtt_desc:0 "На краю Дейглоу, частково поглинута морем, лежить колишня велика морська база, заповнена іржавими уламками кораблів. Її закрили для громадськості після формування уряду Дейглоу, але деякі частини бази можна повернути до життя."

development_project_naval_auxiliary_landing_field_san_clemente_island_wtt:0 "Мілітаризувати острів Клементе"
development_project_naval_auxiliary_landing_field_san_clemente_island_wtt_desc:0 "Колись на острові Сан-Клементе біля узбережжя Лос-Анджелеса діяла велика військово-морська база. Сьогодні там мешкає кілька мирних поселенців, які створили приховані укриття та оборону. Незважаючи на їхню думку, острів можна знову зробити потужною військовою базою."

development_project_naval_base_ventura_wtt:0 "Відновити військово-морську базу Вентура"
development_project_naval_base_ventura_wtt_desc:0 "Об’єднання Порт Хуенеме та Пойнт-Мугу на межі тисячоліть створило базу з подвійною природою — навіть у руїнах відчувається її роздвоєння. Колись її досліджували Послідовники Апокаліпсису, але вони огородили її після того, як ще один доктор загинув на території. Але якщо Послідовники не можуть відновити базу — це не означає, що не зможемо ми."

development_project_grand_coulee_wtt:0 "Запустити греблю Ґранд-Кулі"
development_project_grand_coulee_wtt_desc:0 "Прямо у полі зору з поселення Ґраноган стоїть стара гребля, яку можна використати як переправу для просування на північ."

development_project_naval_base_kitsap_wtt:0 "Відновити військово-морську базу Кітсап"
development_project_naval_base_kitsap_wtt_desc:0 "Дві колишні військові бази, з’єднані в одну. Саме звідси патрулювався П'юджет до Великої Війни. База була центром Ініціативи «Сяючі моря», спрямованої на боротьбу з незаконним рибальством і судноплавством під час війни. Хоча її зруйнувала ядерна бомба, трохи часу та ресурсів можуть відновити Ініціативу вже на нашу користь."

development_project_naval_magazine_indian_island_wtt:0 "Відновити склад на острові Індіан"
development_project_naval_magazine_indian_island_wtt_desc:0 "Ініціатива «Сяючі моря» розширила цей колишній підводний ремонтний центр до великого порту, який підтримував кампанію за повернення Анкориджа. Проте він став мішенню ядерного удару. Відновлення цілого острова — справа складна, але вона може забезпечити панування на Фуку."

development_project_naval_station_everett_wtt:0 "Відновити військово-морську станцію Еверетт"
development_project_naval_station_everett_wtt_desc:0 "Річки Скаґіт і С'юзен активно патрулювалися до війни для боротьби з контрабандою, дисидентами та іншими порушниками. Через це флот сильно інвестував у цей об’єкт, який став ціллю при ядерному ударі. Встановлення захисту та ремонт доків допоможе нам утвердитися на Зламаному Узбережжі."

development_project_CFB_equimalt_wtt:0 "Поліпшити гавань Вікторії"
development_project_CFB_equimalt_wtt_desc:0 "Гавань Вікторії вже є найкращою на Тихоокеанському узбережжі й чудовим притулком у Фуку, не кажучи вже про Зламане Узбережжя. Проте її все ще можна вдосконалити. Але така спроба може активувати «сюрпризи», які залишили американці. Потрібна підготовка, але результат вартий зусиль."

development_project_vandenberg_afb_wtt:0 "Відновити космічний центр Ванденберг"
development_project_vandenberg_afb_wtt_desc:0 "Цей космодром служив місцем запуску ракет, зокрема тих, хто відправився у Море Спокою. Повернутись на орбіту навряд чи вдасться, але відновити системи ППО — цілком реальна мета."

development_project_red_river_army_depot_wtt:0 "Зробити армійський склад Ред-Рівер корисним"
development_project_red_river_army_depot_wtt_desc:0 "Ред-Рівер — це величезний звалище й зруйнований автопарк. Усунення небезпек і часткове повернення до колишніх функцій зробить місце хоча б прийнятним на вигляд."

development_project_sheppard_afb_wtt:0 "Відновити авіабазу Шеппард"
development_project_sheppard_afb_wtt_desc:0 "Продана уряду за долар, ця база раніше була центром технічної підготовки, а згодом — навчання пілотів. Коли вибухнули бомби, пілоти, що злітали, вже не мали країни, до якої могли б повернутись. З належним обладнанням, пілоти знову зможуть здійматися в небо звідси."

development_project_dyess_afb_wtt:0 "Вшанувати спротив Оуенс?"
development_project_dyess_afb_wtt_desc:0 "Відома як авіабаза Дайєс і ракетний комплекс біля Абілена, саме тут полковниця Керрі Оуенс врятувала майбутнє Лоун-Стару. Сьогодні це спокійне меморіальне місце, але інвестиції дозволять знову ввести його в дію. Це буде корисно — хоча й спірно, наскільки це відповідатиме пам’яті полковниці."

development_project_cabin_creek_spp_wtt:0 "Відновити сонячну ферму Кабін-Крік"
development_project_cabin_creek_spp_wtt_desc:0 "Спільний проєкт компаній Clenera та Basin Electric Power Cooperative, сонячна ферма Кабін-Крік колись забезпечувала значну частину енергії для Монтани. Хоча ферма зазнала дії часу й грабіжників, досвідчені інженери можуть знову запустити її."

development_project_hoover_western_boatlift_wtt:0 "Полагодити західний підйомник на дамбі Гувера"
development_project_hoover_western_boatlift_wtt_desc:0 "Дамба Гувера довгий час була непрохідною перешкодою на Колорадо, але перед Великою війною уряд США збудував два «підйомники» для суден — по одному з кожного боку. Вони мали покращити торгівлю, але так і не були відкриті. Вони не зруйновані — всього кілька місяців роботи, і вони знову запрацюють."

hoover_western_boatlift_built_trig_tt:0 "§OЗахідний підйомник§! ще §RНЕ§! відновлено через §Yрішення§!."
hoover_western_boatlift_built_tt:0 "§OЗахідний підйомник§! буде відновлено, дозволяючи §Gдружнім§! суднам обходити §Yдамбу Гувера§!."

development_project_hoover_eastern_boatlift_wtt:0 "Полагодити східний підйомник на дамбі Гувера"
development_project_hoover_eastern_boatlift_wtt_desc:0 "Дамба Гувера довгий час була непрохідною перешкодою на Колорадо, але перед Великою війною уряд США збудував два «підйомники» для суден — по одному з кожного боку. Вони мали покращити торгівлю, але так і не були відкриті. Вони не зруйновані — всього кілька місяців роботи, і вони знову запрацюють."

hoover_eastern_boatlift_built_trig_tt:0 "§OСхідний підйомник§! ще §RНЕ§! відновлено через §Yрішення§!."
hoover_eastern_boatlift_built_tt:0 "§OСхідний підйомник§! буде відновлено, дозволяючи §Gдружнім§! суднам обходити §Yдамбу Гувера§!."

development_project_del_norte_international_afb_wtt:0 "Відновити міжнародну авіабазу Дель-Норте"
development_project_del_norte_international_afb_wtt_desc:0 "Розташована у Монтерреї, Дель-Норте служила другим аеропортом і базою для навчання пілотів ВПС Мексики. Тут, без сумніву, збереглись цінні документи з військової авіації — а ще досі замкнені ангари."

development_project_villanueva_spp_wtt:0 "Відновити сонячну електростанцію Вільянуева"
development_project_villanueva_spp_wtt_desc:0 "Найбільша сонячна станція Мексики й колись — усієї Америки. Через близькість до Торреона і два століття занепаду, її пікова потужність недосяжна. Але навіть у нинішньому стані вона може генерувати чимало енергії."

development_project_puerto_libertad_spp_wtt:0 "Відновити сонячну електростанцію Пуерто-Лібертад"
development_project_puerto_libertad_spp_wtt_desc:0 "Збудована компаніями Acciona Energia та Tuto Energy, станція забезпечувала енергією сотні тисяч домогосподарств у Сонора. Насправді ж більшість електрики споживали уряд і приватні фірми. Незалежно від того, повторимо ми цю практику чи ні — відновлення станції буде надзвичайно корисним."

development_project_sunnyvale_afb_wtt:0 "Розгадати Куб"
development_project_sunnyvale_afb_wtt_desc:0 "У руїнах Санівейлу, на узбережжі затоки Сан-Франциско, стоїть великий синій куб. Ті, хто намагається потрапити всередину, зазвичай гинуть, а ті, хто повертається — майже нічого не пам’ятають. Подекуди радіоаматори перехоплюють дивні сигнали з нього.\n\nКажуть, у глибинах куба є щось, пов’язане з небом. Але перш ніж це дізнатися, слід перетворити Куб з пастки смерті на щось безпечніше."

development_project_castle_afb_wtt:0 "Очистити Касл"
development_project_castle_afb_wtt_desc:0 "В’язниця, автотрек і щось пов’язане з осами — усе це є на території колишнього аеродрому. Нині ж це гніздо мух-роздувачів і потенційна загроза, проте з правильним фінансуванням воно може стати корисним і покращити раціон місцевих мешканців."

development_project_george_afb_wtt:0 "Відкрити базу Джорджа"
development_project_george_afb_wtt_desc:0 "Колишній навчальний центр тактичного командування ВПС США, з часом розграбований шукачами та рейдерами. Якщо його відновити, тут можна буде знову проводити тренування з великокаліберною зброєю, хоча злітно-посадкова смуга — вкрай сумнівна."

development_project_norton_afb_wtt:0 "Відновити базу Нортона"
development_project_norton_afb_wtt_desc:0 "Колись на межі закриття, база отримала нове життя під час американської окупації Мексики. Сьогодні тут збереглися великі гармати, спрямовані в небо, які можуть стати ключем до оборони регіону. Але злітна смуга, можливо, втрачена назавжди через ряд паралельних кратерів."

development_project_fort_ord_wtt:0 "Реконструювати пам’ятник Орду"
development_project_fort_ord_wtt_desc:0 "Ордо — узбережжя війни й миру. Його настільки любили за пляжі, що в XXI столітті перетворили на національний монумент. Зараз хвилі зеленіють, а береги стають небезпечними. Хоча очищення від військового хламу покращить виробництво, іноді людям просто хочеться відпочити на сонці, занурившись у пісок. Пора серфити!"

development_project_sacramento_army_depot_wtt:0 "Відновити військовий склад Сакраменто"
development_project_sacramento_army_depot_wtt_desc:0 "Серед руїн Сак-Тауна ховається об’єкт, повний електроніки. Комп’ютерні материнські плати можуть покращити виробництво, а висока вежа на об’єкті — стати оглядовим пунктом... або чимось більшим."

development_project_grand_coulee_wtt:0 "Запустити гідроелектростанцію Ґранд-Кулі"
development_project_grand_coulee_wtt_desc:0 "Поряд із крихітним поселенням Ґраноган розташована руїна, яку помилково приймають за міст — насправді це гідроелектростанція. Її можна оживити, якщо дати їй догляд і живлення. Лише б це не призвело до нового конфлікту, як на іншій дамбі..."

development_project_sarsparilla_factory_wtt:0 "Розлити Сансет Сарсапарилу"
development_project_sarsparilla_factory_wtt_desc:0 "Серед надто великої кількості Потвор розташована стара фабрика Сансет Сарсапарили. Якщо усунути і Потвор, і системи безпеки, ми зможемо отримати рецепт та відновити виробництво. Хоча дві проблеми залишаються: старателі, які намагаються прорватися до закритих кімнат, і жахлива галітозна хвороба..."

development_project_underground_farm_wtt:0 "Оновити Родючі Ферми"
development_project_underground_farm_wtt_desc:0 "Ходять легенди про підземне поле з ґрунтом і освітленням, достатнім, щоби ніколи не голодувати. Це правда — глибоко у Вестворлді справді є велика підземна ферма. Вона може забезпечити їжею й водою на десятиліття, але спершу її потрібно змусити працювати."

development_project_car_crusher_wtt:0 "Увімкнути Величезний Прес"
development_project_car_crusher_wtt_desc:0 "На звалищах говорять про величезний прес, який колись виробляв куби зі старих авто. Старожили згадують, як у дитинстві прес перестав працювати — і кожен, хто пробував його запустити, гинув. Пора дізнатись чому, і знову почати перетворювати брухт на щось корисне."

development_project_chico_ac_wtt:0 "Відновити технології кондиціонування"
development_project_chico_ac_wtt_desc:0 "Перед війною Poseidon Energy передала проєкт керування кліматом компанії Petro-Chico. Йшлося про технологію, здатну знищити спеку й вологу. Масовий випуск так і не почався, але, можливо, у нас залишився прототип, з якого можна все почати."

development_project_fewarren_afb_wtt:0 "Прокласти шлях до Ядерного Ф’юрену"
development_project_fewarren_afb_wtt_desc:0 "Саме звідси колись віддавали наказ запустити ядерні ракети. Зараз там усе завалено, а радіація така сильна, що навіть гуль ризикує втратити розум. Найкраще рішення — копати тунелі, поки ми не знайдемо нагороду глибоко всередині."

development_project_minuteman_historic_wtt:0 "Озброїти гармату Етлін"
development_project_minuteman_historic_wtt_desc:0 "Роботи в Плейгленді колись охороняли ракети та бомби. Ядерних ракет не лишилось, але пускові установки можна знову ввести в дію. Шкода, що для цього треба мати добрий захист від радіації."

development_project_minot_silo_wtt:0 "Укріпити Вежу"
development_project_minot_silo_wtt_desc:0 "На краю ракетних полів стоїть єдина вежа, що вціліла серед кратерів. Тунелі довкола можна відновити й з’єднати з іншими бункерами, але це буде небезпечно й дорого. Шкода, що віри недостатньо."

development_project_giddyup_buttercup_wtt:0 "Погратися з Гідді-ап Баттеркап"
development_project_giddyup_buttercup_wtt_desc:0 "У 2054 році Арлен Ґласс викупив землю з метою створення заводу Atomatoys. Він обіцяв наймати місцевих, але замість цього — привіз іммігрантів з Європи. Після війни це вже не мало значення. Проте завод досі стоїть, і його запуск подарує радість дітям Монтани, а зрадницьке минуле буде забуте."

development_project_cleanup_uranium_wtt:0 "Очистити уранові відходи"
development_project_cleanup_uranium_wtt_desc:0 "Коли арапахо покинули околиці Рівертона, Ландера й Кроугарт, стало ясно, чому там хворіли й не росли врожаї: все через урановий млин. Якщо його очистити — Пилюка знову стане придатною для життя.\n\nЦе викликає питання: невже уряд США був настільки байдужим до страждань свого народу?"

development_project_compensating_gun_wtt:0 "Увімкнути «Компенсатор»"
development_project_compensating_gun_wtt_desc:0 "Великий Джуд був майстром зі зброї, який мріяв зробити найбільшу рушницю у світі. Його проєкт часто висміювали через «компенсацію», поки одного дня рейдер не вбив його пострілом у... ну, ви зрозуміли. Але рушниця, названа «Компенсатором», майже готова. Треба тільки подати живлення — а це вже складніше."

development_project_stoon_cave_wtt:0 "Увійти в Печеру Стун"
development_project_stoon_cave_wtt_desc:0 "П'єр Соломон проводить усе більше часу в підземеллях свого маєтку. Бея переконала його, що сморід уже досяг критичної межі. Якщо профінансувати «прибирання», то, можливо, він перестане спати над радіоактивною зоною. Все, що ми знаємо: там дивні звуки, і туди не можна заходити з лампою Вуда."
