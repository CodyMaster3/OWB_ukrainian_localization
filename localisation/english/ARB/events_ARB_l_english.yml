l_english:
nf_arb.1.t:0 "Ризикований постріл"
nf_arb.1.d:0 "Життя найманця — тяжке. Більшість вважає тебе звичайним рейдером із контрактом, і ставляться відповідно. Один невдалий контракт — і ти лежиш обличчям донизу в багнюці та снігу. Але якщо ти достатньо жорсткий, вправний і щасливий, можна зробити собі ім’я. Моя можливість з’явилась, коли з’явилось кілька контрактів для нещасних, які вміють стріляти й слухати накази. Я не став надто допитуватись — це завжди ризик — але добре глянув, хто саме звертався. І, ох, я радий, що вибрав як слід."
nf_arb.1.a:0 "Королівство Манітоба кличе"
nf_arb.1.b:0 "Приватна експедиція на Північ"
nf_arb.1.c:0 "Якась мутна доперебудовна організація"

nf_arb.2.t:0 "За короля і кепси"
nf_arb.2.d:0 "Після того успіху моя слава злетіла до небес. Люди з усіх усюд наймали мене для охорони та роботи. Незабаром я назбирав достатньо кепсів, щоби створити власну банду — і ми стали найкращими у цих краях. Ніхто не міг зрівнятись із нами в підготовці, досвіді чи вмінні. І все це — завдяки мені. Але навіть тоді до нас ставились як до сміття. І це мене неймовірно дратувало. Тож, коли королівство покликало найманців допомогти у війні проти повсталої республіки, я побачив шанс змінити це. Адже перемога означала, що я нарешті..."
nf_arb.2.a:0 "Здобуду повагу мешканців Манітоби"
nf_arb.2.b:0 "Отримаю нову базу на Півночі — покажемо пусткам, хто ми такі"

nf_arb.3.t:0 "У лайні по вуха"
nf_arb.3.d:0 "Чорт забирай! Як я, до біса, все провалив?! Вони відрізали нас від союзників і почали винищувати одного за одним. Я мав передбачити це — вже сотню разів стикався з подібним! Майже всіх втрачено, зі мною залишилась лише жменька солдатів, кілька ополченців та дурних фермерів, які й стріляти толком не вміють! Але тепер, коли ми дістались півночі — ми зможемо тримати оборону. Тримати, доки прийде допомога й витягне нас звідси."
nf_arb.3.a:0 "§RЯк же я облажався з цим клятим завданням...§!"

nf_arb.4.t:0 "Без надії, допомоги й небес"
nf_arb.4.d:0 "Хунта Арборґа — це армія, що прикидається державою. Найманці, ополчення, та малограмотні вірні короні манітобці — з такою сумішшю важко протриматись на тих землях. З ворожими Трьома Ріками на півдні, хунта ледь виживає завдяки імпорту з Манітоби, по замерзлій воді. Якби не залізна воля О’Браєна, який тримає військо вкупі — усе вже давно розпалось би. Та попри все, в них є мета: повернути республіку під корону. А для цього треба переозброїтись, перебудуватись і поповнити запаси."
nf_arb.4.a:0 "За короля, країну і помсту"

nf_arb.5.t:0 "Послання з Арборґа"
nf_arb.5.d:0 "Ми отримали послання від Хунти Арборґа — вони заявляють про свою готовність підтримати нас у громадянській війні. Хоча точні деталі ще невідомі, ймовірно, мова йде про постачання або капітали. Але головне — тільки ми отримаємо доступ до їхніх найманців і сил.\n\nОднак є одне «але»: Арборґ вимагає поставку зброї як умову укладання угоди. Ми пробували домовитись, але вони непохитні.\n\nПерш ніж прийняти рішення, слід зважити користь від підтримки Арборґа і ціну, яку доведеться заплатити. Їхня допомога може схилити шальки терезів на нашу користь — але чи варта вона витрачених ресурсів?"
nf_arb.5.a:0 "Їхня підтримка — безцінна"
nf_arb.5.b:0 "Обійдемось без них"

nf_arb.6.t:0 "Королівська винагорода"
nf_arb.6.d:0 "Наша вірність королю в його тяжку годину не залишилась непоміченою — нас вирішили нагородити. [BRA.GetLeader] та його радники запропонували декілька варіантів.\n\nОдин із них — дозволити мисливцям на хутро працювати на наших територіях. Податки з цього промислу надходитимуть до нас, що може значно зміцнити економіку. Це також дасть поштовх новій галузі та створить робочі місця.\n\nІнший варіант — урочистий дарунок від королівства. Його суть ще обговорюється, але сама церемонія матиме високу символічну вагу, що точно потішить монархістів у нашому краю.\n\nВарто ретельно зважити плюси і мінуси. Мисливці принесуть прибуток, але й можуть викликати конфлікти за ресурси. Подарунок — більше про престиж і визнання, ніж про практичну вигоду."
nf_arb.6.a:0 "Дозволити мисливцям працювати"
nf_arb.6.b:0 "Церемоніальні дари, будь ласка"

nf_arb.7.t:0 "Подяка Маршала"
nf_arb.7.d:0 "Йорктон висловив вдячність за допомогу, яку ми надавали, і прагне належно винагородити нас за наші цінні зусилля. На знак вдячності він запропонував кілька можливих нагород.\n\nОдин із варіантів — навчити наших виробників розробляти й виготовляти зброю швидше й ефективніше. Йорктон визнає безпрецедентний досвід Ланґенбурга в цій сфері й вважає, що передача цих знань значно підвищить наш військовий потенціал. Це дасть нам перевагу в поточному конфлікті та стане довгостроковим здобутком.\n\nІнший варіант — дозволити його пропагандистській машині діяти на нашій території. Вони поширюватимуть інформацію серед наших людей, мотивуючи підтримувати військові зусилля. За прогнозами, це також може збільшити обсяги пожертв металобрухту, що значно посилить нашу промисловість.\n\nПеред вибором слід зважити вигоди кожного варіанту. Навчання від Ланґенбурга підвищить нашу обороноздатність, а пропаганда — підтримає бойовий дух народу."
nf_arb.7.a:0 "Навчання й досвід — це завжди корисно"
nf_arb.7.b:0 "Хай його пропагандисти працюють"

nf_arb.8.t:0 "Солодка перемога"
nf_arb.8.d:0 "Нещодавнє повстання в Йорктоні завершилось, і, на щастя, ми підтримали переможну сторону. Наш внесок суттєво вплинув на результат, і ми вже приймаємо численні делегації від переможців, які висловлюють щиру вдячність.\n\nНам запевнили статус і вплив у новому манітобському суспільстві, визнаючи нашу роль у перемозі. Про нашу територію говорять у найвищих колах Королівства, зміцнюючи нашу політичну позицію.\n\nМи вже пожинаємо плоди нашої участі: нас запрошують до обговорень, просять поради в питаннях управління й політики. Здобутий авторитет — джерело гордості, але тепер ми маємо зберегти його і використати на користь нашому народові."
nf_arb.8.a:0 "Тричі ура переможцям!"

nf_arb.9.t:0 "Дипломатичний прокол"
nf_arb.9.d:0 "Схоже, ми підтримали не ту сторону в недавньому конфлікті, і переможці мають щодо нас, м’яко кажучи, не найкращу думку. Ця помилка може мати серйозні наслідки для нашої легітимності та впливу в регіоні на довгі роки.\n\nНашу здатність до правильних рішень тепер ставлять під сумнів. Переможці навряд пробачать найближчим часом. Нам доведеться докласти значних зусиль, щоби відновити довіру та репутацію.\n\nПопереду — довгий шлях виправлення помилок. Нам слід негайно діяти, щоби показати вірність новому порядку."
nf_arb.9.a:0 "Добре... більше так не будемо"

nf_arb.10.t:0 "Експедиція вирушає"
nf_arb.10.d:0 "Після кількох тижнів підготовки наш експедиційний загін, «Собаки Пустки», готовий до вирушення. Поки вони не повернуться, ми нічого не знатимемо. Залишається сподіватись, що все пройде добре, і вони принесуть добрий заробіток."
nf_arb.10.a:0 "Хай щастить, Пустельні Пси"

nf_arb.11.t:0 "Атака Крижешипів"
nf_arb.11.d:0 "«Собаки Пустки» повернулись раніше з експедиції — з втратами в складі та без більшості припасів. За словами командира, вночі, коли вони відпочивали біля замерзлого озера, на них напали Крижешипи. Вони викрали кількох солдатів, а з льоду вилізла Королева Крижешипів і знищила запаси. Вони ледве відбились і подались додому, не маючи ані їжі, ані боєприпасів, щоби продовжити похід. Знадобиться кілька днів, щоби зібрати нові припаси."
nf_arb.11.a:0 "Я ненавиджу Крижешипів..."

nf_arb.12.t:0 "Червоне сонце над Північчю"
nf_arb.12.d:0 "Чорні шпилі диму й полум’я видно по всьому кордону Арборґу й Республіки, а вітер несе запах смерті. Сонце, зазвичай блідо-жовте, стало червоним крізь попільні струмені. Невелика кількість уцілілих, яким вдалося втекти з охоплених вогнем домівок, швидко поширила звістку про те, що сталося — а з нею й страх. Уночі рейдова група хунти непомітно перетнула кордон і почала грабувати кожне поселення, яке змогла знайти. Оселі згоріли, люди були вирізані, а їхні тіла залишили мерзнути на потрісканій землі. Уздовж усього кордону здійнявся нескінченний ряд диму й вогню — гнів Хунти. Із настанням ранку пішла хвиля біженців, які тікали, рятуючи свої життя. Навіть жителі самої Хунти покидають район, боячись республіканської відповіді. Напруга зростає, і, схоже, незабаром північ знову охопить війна."
nf_arb.12.a:0 "Ці найманці-засранці за це згорять"
nf_arb.12.b:0 "Наступна зупинка — Норт-Енд!"

nf_arb.13.t:0 "Украдені припаси"
nf_arb.13.d:0 "Повітря розриває стрілянина, тиша ранку зруйнована — по дорозі летить вантажівка, що прорвалась із території Арборґу. Переслідувачі зупиняються, дивлячись, як машина зі вкраденою зброєю й припасами зникає з поля зору. Ще до світанку невелика група найманців Хунти непомітно перетнула кордон і пробралася до гарнізону. Скориставшись втомою республіканських солдатів, вони швидко знешкодили варту та пограбували склад. Тікаючи на викраденій вантажівці, вони наскочили на підкріплення, що дало погоню. Це — лише один епізод у низці рейдів. Всі знають, що війна невідворотна. Питання лише в часі."
nf_arb.13.a:0 "Тільки зачекайте, найманці, ми вас дістанемо"

nf_arb.14.t:0 "Орда гулів"
nf_arb.14.d:0 "Невелика частина «Псів Пустки» повернулась раніше з експедиції, втративши більшість особового складу, але зберігши основні припаси. За словами вцілілих, вони розмістили табір у старій довоєнній будівлі, коли раптом обвал підлоги відкрив доступ до бункера виживання. Шум збурив орду диких гулів, які атакували табір і вирізали більшість. Декому вдалося сховатись, поки орда розбрелась по місту. Після цього вони зібрали все, що могли, й повернулися додому. Знадобиться час, аби набрати новий загін."
nf_arb.14.a:0 "Прокляті дикі гулі..."

nf_arb.15.t:0 "У Пеклі місце лише для приречених"
nf_arb.15.d:0 "О'Браєн дивився у бінокль униз, спостерігаючи за загнаними в кут рейдерами, що готували оборону спиною до велетенської дамби. Кампанія з витіснення «Проклятих» з півночі була важкою, але добити цих виродків — було приємно. Солдати за його спиною метушились, чекаючи команди. Радіо на поясі ожило. Прийшов час. Він підніс його до обличчя:\n\n«Затопити щурів.»\n\nМить тиші — й вибухи по поверхні дамби. Каміння сипалось, рейдери тікали — поки дамба, створена до війни, не впала під тиском води. Навіть звідси було чути рев потоку, що змивав усе: каміння, людей, табір. Залишилася лише вода. О'Браєн розвернувся до своїх солдатів, вистрелив угору:\n\n«Подвоєний пайок для всіх!»"
nf_arb.15.a:0 "Солдати гучно святкували перемогу"

nf_arb.16.t:0 "Мріяти"
nf_arb.16.d:0 "О'Браєн переглядав останній звіт, відкинувшись у кріслі, з ногами на столі. Рекрути, виробництво, розвідка... але що привернуло його увагу — це податки. Він тихо свиснув: місцеві принесли значно більше кепів, ніж він сам заробляє. Королівство буде задоволене. Він відклав звіт і зручно вмостився, руки за головою.\n\n«Шкода, що все це має закінчитися...»\n\nВін насупився. Контракт скоро закінчиться. Що тоді? У короля для нього, ймовірно, більше не буде справ. А він... старіє. Дивлячись у стелю, його охопила нова думка. А що, як залишити ці землі собі? Королівство навряд чи зможе його зупинити. Ідея визрівала в голові.\n\n«Може... може...»"
nf_arb.16.a:0 "Він не зводив очей зі стелі до ранку"

nf_arb.17.t:0 "Нові Східні Марки"
nf_arb.17.d:0 "Після років боротьби та напруженої праці ми успішно відновили Герцогство Анже у його колишній славі! Це — велика подія не лише для Анже, а й для всього Королівства Манітоба. Святкування спалахнули по всьому герцогству й за його межами — люди радіють поверненню спадку, що вважався давно втраченим.\n\nПопри всі труднощі, ми показали непохитну відданість справі Королівства. Відновивши Анже, ми довели свою рішучість будувати сильніше та єдине королівство.\n\nНаші зусилля були визнані — Королівство надало нам титул «Східні Марки». Цей титул відображає наше значення на східному кордоні та важливу роль у його захисті від зовнішніх загроз.\n\nЦе великий день не лише для Анже, а й для всієї держави. Відновивши герцогство, ми можемо повністю інтегруватися в Королівство та будувати спільне яскраве майбутнє."
nf_arb.17.a:0 "О'Браєн мовчки задумливо сидить"

nf_arb.18.t:0 "Гарна робота"
nf_arb.18.d:0 "О'Браєн стояв у фойє столичної будівлі в Арборґу, слухаючи приглушені вигуки юрби ззовні. Він поправив комір сорочки й ніяково переступив — не звик бути так ошатно вдягненим. Але сьогодні — особливий день. Після багатьох років його контракт завершився. Північ було повернуто Королівству, і новий герцог Арборґу прибув, аби офіційно зняти його з посади. Двері відчинились, і всередину увійшов герцог Тобіас, у супроводі двох монтійців. О'Браєн випростався, відповівши на їхнє вітання.\n\n— О'Браєн, як я розумію? Радий нарешті познайомитись. Ми не були б тут, якби не ви та ваша компанія. Королівство вам дуже вдячне.\n\nО'Браєн потиснув йому руку, намагаючись не показати, наскільки натягнута в нього усмішка.\n\n— Ще одна робота зроблена, як я завжди кажу, сер.\n\nТобіас засміявся й поплескав його по плечу:\n\n— Приємно чути, мій добрий друже. Ви вже отримали свою виплату, але, будь ласка, візьміть це від мене особисто.\n\nВін передав важкий мішечок із кепами й пішов на балкон. А О’Браєн, дивлячись на гаманець, вийшов задніми дверима."
nf_arb.18.a:0 "Ще одна робота — зроблена..."

nf_arb.19.t:0 "Прокляті ліси"
nf_arb.19.d:0 "Сьогодні вранці до міста прибіг чоловік, увесь у крові, бруді, в лахмітті. Спочатку ми не звернули на нього уваги, поки не помітили залишки емблеми «Псів Пустки» на його одязі. Ми занесли його всередину, намагаючись заспокоїти й з'ясувати, що сталося. Все, що вдалося розібрати — експедиція таборувала в якомусь лісі, і щось їх там розірвало. Він не міг, або не хотів сказати, що саме. Лише вказав на ділянку північніше Ланґенбурга. Що б там не було — воно небезпечне. Майбутні експедиції оминатимуть цей регіон."
nf_arb.19.a:0 "Що, чорт забирай, там сталось?.."

nf_arb.20.t:0 "Пропозицію підтримки прийнято!"
nf_arb.20.d:0 "Ми отримали відповідь від [FROM.GetName] — вони зробили мудрий вибір, прийнявши нашу підтримку. Невдовзі має прибути вантаж зброї як оплата. Тепер ми можемо зосередитися на постачанні нашого спорядження та військ до [FROM.GetName], заробляючи на цьому та забезпечуючи перемогу нашого фаворита. Гарний день для бізнесу в Арборґу!"
nf_arb.20.a:0 "Триразове «ура» майбутнім переможцям!"

nf_arb.21.t:0 "Пропозицію підтримки відхилено"
nf_arb.21.d:0 "Ці дурні з [FROM.GetName] вирішили відхилити нашу допомогу, думаючи, що впораються самі. Безглузда думка, на яку ми вплинути вже не можемо. Зате ми можемо переглянути наші варіанти. Може, їхні супротивники будуть більш говіркими? Або просто відкриємо ринок для обох сторін і дамо війні зігратись самій? Це перешкода, але не кінець гри."
nf_arb.21.a:0 "Вони ще пошкодують про це"

nf_arb.22.t:0 "Північні народи"
nf_arb.22.d:0 "Королівство замовило в нас експедицію на північ — встановити контакт із народом Нунавуту. Наше завдання — налагодити стосунки та прокласти маршрут між їхньою землею та нашою для потенційної торгівлі. Але слід бути обережними — ці люди знають замерзлі землі краще за всіх і можуть легко влаштувати засідку. Подейкують, що до чужинців вони ставляться вороже. Але наші «Пси Пустки» — найкращі в цій справі. Вони виконають завдання."
nf_arb.22.a:0 "У цьому нема сумнівів"

nf_arb.23.t:0 "Північні народи"
nf_arb.23.d:0 "Наші «Пси Пустки» повернулися з експедиції на північ. Після прибуття на землі Нунавуту та встановлення табору, наші солдати прокинулися оточені військами Нунавуту, які якимось чином залишилися непоміченими для всіх наших вартових. На щастя, вдалося уникнути конфлікту та встановити контакт з місцевим командиром. Після короткої розмови й демонстрації доброї волі, нашому загону дозволили піти — ще й з листом-запрошенням для дипломатів Королівства. Відзначивши шлях, експедиція передала листа й повернулась додому."
nf_arb.23.a:0 "Ще одна успішна робота Псів Пустки"

nf_arb.25.t:0 "Експедиція з Арборґа"
nf_arb.25.d:0 "Сьогодні до нашої столиці прибула втомлена, але рішуча експедиція з Арборґа з дарами технологій та знайдених ресурсів. Їхньою метою було пошук цінних матеріалів для допомоги своєму режиму та покращення стосунків із нами.\n\nАрборґ передав ці знахідки нам як дарунок, у надії зміцнити наші відносини. Отримані ресурси, безперечно, стануть у пригоді для нашого розвитку."
nf_arb.25.a:0 "Хто б міг подумати, що ті найманці такі щедрі?"

nf_arb.26.t:0 "Король Тарганів"
nf_arb.26.d:0 "Чергове замовлення від Королівства — цього разу на схід. Наше завдання — розслідувати чутки про якогось «Короля Тарганів». Перекази свідчать, що він контролює армію радіоактивних тарганів і влаштовує безлад, не підкоряючись нікому. Королівство хоче, щоб Пси Пустки з’ясували, чи має Республіка Трьох Річок намір співпрацювати з ним, і якщо так — зірвали ці плани. Дивне завдання, але наші солдати впораються. Ну бо наскільки небезпечними можуть бути таргани, правда ж?"
nf_arb.26.a:0 "Та впораються, як завжди"

nf_arb.27.t:0 "Король Тарганів"
nf_arb.27.d:0 "Наші Пси Пустки повернулися з розслідування. Добра новина — цей Король Тарганів точно не планує союзів з Республікою. Він божевільний і нападає на всіх, хто підходить надто близько. Але погана новина — його армія радіотарганів є серйозною загрозою. Їх були тисячі, і нашим людям ледве вдалося втекти. Наразі він не становить небезпеки для Королівства, але слід тримати його на прицілі."
nf_arb.27.a:0 "Дивне завдання, але наші впорались"

nf_arb.28.t:0 "Лицарі Монтани"
nf_arb.28.d:0 "Нове замовлення для Псів Пустки — цього разу на захід. Подейкують, що в Монтані з’явилася група солдатів у силовій броні. Королівство занепокоєне, а якщо чесно — налякане, і хоче, щоб ми з’ясували, хто вони і чи становлять загрозу. Це може бути складно — якщо броня справжня, наші мають бути обережними, аби не загинути дарма."
nf_arb.28.a:0 "Подивимось, як ті лицарі впораються з Псами"

nf_arb.29.t:0 "Лицарі Монтани"
nf_arb.29.d:0 "Пси Пустки повернулися з розвідки. Все вказує на те, що ті воїни з силовою бронею — частина військової групи з середнього заходу Америки. Нашим не вдалося підійти ближче — вартові та прожектори завадили — але ми дізналися достатньо, щоб зробити висновок: ці люди не становлять загрози Королівству."
nf_arb.29.a:0 "Королівство буде цьому раде"

nf_arb.30.t:0 "Північна війна"
nf_arb.30.d:0 "Ми отримали повідомлення від наших найманців в Арборґу — бойові дії з Трьома Річками розпочато. Нас закликають допомогти знищити повстання. Це гарна можливість вдарити з флангу, однак деякі радники висловлюють занепокоєння, що армія не готова. Інші ж — налаштовані більш войовничо й кажуть, що кращої нагоди може не бути. Вирішувати — Королю."
nf_arb.30.a:0 "Королівство відгукується. До зброї!"
nf_arb.30.b:0 "Ми не готові. Арборґ воюватиме сам"

nf_arb.31.t:0 "Перемога!"
nf_arb.31.d:0 "В Арборґу — свято. Люди на вулицях, небо освітлюють феєрверки з Королівства. Нарешті повстання придушено, владу Короля відновлено на Півночі. Усі співають і вигукують гасла — адже саме Арборґ повів у бій, саме Арборґ розчавив Республіку, саме Арборґ став обличчям вірності. Люди святкують перемогу та сподіваються на мир і добробут під владою улюбленого Короля."
nf_arb.31.a:0 "Хай живе Король! Хай живе Манітоба!"

nf_arb.32.t:0 "Вечірка як у 2269-му!"
nf_arb.32.d:0 "О'Браєн прокинувся, втупившись у стелю, з пульсуючим головним болем. Він застогнав і скотився з дивану, на якому заснув, збивши кілька порожніх пляшок. Лаючись, О'Браєн зумів підвестись на ноги і попрямував до ванної, переступаючи через тіла своїх солдатів, усіх п’яних до нестями. Вхопившись за раковину, він подивився в брудне дзеркало, намагаючись пригадати останні кілька днів. Попри гул у голові та запах розлитого алкоголю, О'Браєн згадав їхню вечірку — святкування перемоги над Республікою. Ні... не їхньої перемоги. ЙОГО перемоги. Він усміхнувся й витер дзеркало. Полум’я в його грудях не згасло — те саме, що зробило його ім’я відомим серед найманців. Воно ж привело його до Королівства, воно ж допомогло вижити в Арборґу. Може, ще зарано думати про відставку. О’Браєн почесав бороду й поправив зачіску. Та ні, подумав він, ще зарано зупинятись. Адже..."
nf_arb.32.a:0 "...яка шкода може бути від ще кількох ковпаків?"

nf_arb.33.t:0 "Від Лахміття до Кабінету"
nf_arb.33.d:0 "О'Браєн дивився згори на місто Арборґ з балкона капітолію, спостерігаючи, як дим підіймається від зруйнованих будівель. Шрами битви, залишені монархістами, що були незадоволені його відмовою підкорити землі Королівству. Хоч його компанія швидко закріпилася в Арборґу й навколо, повстанці все ж підіймалися, намагаючись витіснити їх з міста. Природно, вони були знищені, хоча О'Браєн був дещо роздратований шкодою, яку ті встигли завдати. Він сьорбнув із фляги, дивлячись на горизонт, де місячне світло відбивалося від дахів. Королівство могло б спробувати повернути собі ці землі, але якби воно могло — його б узагалі не наймали. Ідея ця його розвеселила. Ні, Королівство безсиле його зупинити, і тепер усе багатство Арборґа належало йому — куди більше, ніж ті крихти, що платили раніше. Він підняв флягу й виголосив тост:"
nf_arb.33.a:0 ""За Королівство — залишайтеся такими ж дурними!""

nf_arb.34.t:0 "Королівство Зраджене... Вдруге"
nf_arb.34.d:0 "Зі стрімким погіршенням здоров'я Короля, потреба зменшити стрес ставала все більш очевидною щодня. Тож Таннер взяв на себе чимало адміністративних обов'язків Ґанна. Хоч він і віддавав перевагу полю бою, а не письмовій рутині, полегшення тягаря для Короля було важливішим. \n\nНа жаль, це означало, що іноді саме Таннер мусив приносити погані новини. А ця — була найгіршою. З легким стуком — та з дозволом увійти — він зайшов до кімнати Ґанна й зібрався з духом.\n\n«Таннеp, сподіваюся, ви в порядку сьогодні?» — лагідно поцікавився Король, не відводячи погляду від вікна.\n\n«Не зовсім, Ваша Величносте. Останнім часом справи пішли кепсько,» — тихо відповів Таннер.\n\n«А коли вони йшли добре для нас?» — з гіркотою пробурмотів Ґанн.\n\n«Як пластир,» — подумав Таннер. — «На жаль, мушу повідомити: О’Браєн... він вирішив зрадити нас. Вони офіційно проголосили незалежність від монархії.»\n\nҐанн спершу остовпів, потім вибухнув гнівом.\n\n«Як він СМІЄ!?» — закричав він, гупаючи по столу. — «Після всього фінансування, всього спорядження — і він просто обриває зв’язок? Та я б його повісив! Роздер би на частини! Цей негідник заплатить!»\n\nВін гучно дихав, а потім впав назад у крісло й затулив обличчя руками. «Коли ж ми хоч раз матимемо хоч краплю везіння, Таннере?»\n\nТаннер не мав чим утішити. Як переконати Короля, якщо сам у це не вірив?"
nf_arb.34.a:0 "Ніколи не довіряй тому, хто ставить ковпаки понад країну..."

nf_arb.35.t:0 "Повстання Йорктауна!"
nf_arb.35.d:0 "До нас надходять розрізнені повідомлення з Королівства Манітоба. Схоже, Лейф Йорктон, давно розчарований невдачами Королівства і нещодавно призначений герцогом Ланґенбурга, вирішив: занепад і неефективність Короля тривали надто довго. Він проголосив повстання і закликав усіх патріотів приєднатися.\n\nЦе перекриває нам доступ до поставок з Манітоби, але не без вигоди... Ми можемо використати ситуацію, аби довести лояльність до Корони. Підтримавши переможця, отримаємо славу, винагороди й, можливо, додаткову допомогу. Можемо також продати зброю обом сторонам — швидка війна, швидкі ковпаки.\n\nПроте слід бути обачними. Якщо поставимо не на того коня — переможець нам цього не пробачить."
nf_arb.35.a:0 "А як це вплине на економіку?"

nf_arb.36.t:0 "Від лахміття — до кабінету"
nf_arb.36.d:0 "О’Браєн дивився вниз на місто Арборґ з балкону капітолію. Його капітолію. Падіння Королівства стало шоком не лише для місцевих, а й для нього самого — виплати раптово припинилися. Та він діяв блискавично: проголосив себе главою земель Арборґа як незалежної держави. Його компанія швидко встановила контроль над регіоном, хоч без спротиву не обійшлося. Деякі монархісти протестували, хоча О’Браєну й було неясно — навіщо. Він сьорбнув з фляги, дивлячись на обрій, де місячне сяйво відбивалось у дахах. Хороше місце. І багатства тут вистачає.\n\nО’Браєн усміхнувся, коли в голову прийшла розважальна думка. Вперше у кар’єрі найманця він був радий, що його роботодавець помер просто під час завдання. Тепер усе це — його. Достатньо, щоб забезпечити і себе, і всю компанію на роки. Він підняв флягу й виголосив тост."
nf_arb.36.a:0 ""За Королівство — хай спочине з миром.""

nf_arb.37.t:0 "Вітаємо в найприємнішому з країв"
nf_arb.37.d:0 "Королівство найняло «Псів Пустки» для нового завдання — і воно непросте. Треба вирушити до Електорату й розвідати чутки, ніби в місті Плезантдейл є доступ до потужних американських довоєнних технологій. Королівство хоче перевірити ці заяви і, якщо можливо, дістати дещо з того добра.\n\nТут треба бути вкрай обережними: Королівство не хоче конфлікту ні з Плезантдейлом, ні з іншими Електорами. До того ж, чимало мешканців Плезантдейла — вихідці з Королівства, отже, потенційні союзники. Якщо тримати голову на плечах — уникнемо зайвих проблем."
nf_arb.37.a:0 "Кажуть, у Плезантдейлі гарно цієї пори року."

nf_arb.38.t:0 "Де є НАДІЯ — там є шлях"
nf_arb.38.d:0 "Операція «Приємний День», журнал командира, запис 1.\n\nМи прибули до Плезантдейла. Подорож минула спокійно — лише кілька диких тварюк та гулів спробували щастя. Рейдерів не було — певно, побачили спорядження й передумали. Але це місце… воно лякає. Все таке чисте й охайне, немов на довоєнній листівці. Неприродно. Місцеві надто привітні й не мають уявлення, що таке справжня пустка. Тривожно.\n\nІ ті феї… ці дивні штуки постійно за нами спостерігають — з тими світлими очима. Сподіваюся, саме не вони були причиною, чому нас сюди послали. Бо дивитись на них ще раз — нестерпно.\n\nМи розташували табір за містом, аби уникнути напруги, взяв із собою лише кількох озброєних пістолетами людей — для виду мирності. Однак ніхто офіційно не прийшов нас зустріти. Кажуть, мер не з’являвся вже давно, а спроби контакту — без відповіді. Я вже збирався повертатись, як одна з тих фей підійшла й подала знак слідувати. Не сказала, куди чи хто послав — але ми погодились, бо альтернатив не було. Вона привела нас до невеликого будинку на околиці.\n\nВсередині, фея зникла, а на екрані з’явилося мерехтливе зображення жінки. Вона назвала себе НАДІЯ. Сказала, що хоче допомогти. Після розпитувань я дізнався — це штучний інтелект, якось пов’язаний із фей-програмою в місті. Не повністю їй довіряю, але вона запропонувала показати місця з довоєнними технологіями, які можна забрати до Королівства. Якщо це допоможе виконати завдання — варто спробувати."
nf_arb.38.a:0 "Веди нас, НАДІЯ."

nf_arb.39.t:0 "Вперед, до МАНІФЕСТ’у нашої долі"
nf_arb.39.d:0 "Операція «Приємний День», журнал командира, запис 6\n\nНАДІЯ привела нас ще до однієї довоєнної локації з технологіями. Попри мою спершу недовіру, мушу визнати: вона — надзвичайно корисна. Це вже четверте місце, яке вона нам показала, з повним набором припасів і техніки. Королівство буде задоволене. А отже — ми отримаємо оплату. Ще одна успішна робота «Псів Пустки».\n\nХоч мушу зізнатись, деяка з цієї техніки — сумнівна. Автоматичні кавоварки, роботи-пилососи, машинка для догляду за вусами без рук… Справжні довоєнні розкоші. Хоч, певно, еліті Королівства таке припаде до смаку. Особисто я сподівався знайти щось, що допоможе нам проти Республіки. Щось, що збереже життя. Хоча, можливо, зможемо причепити кілька лез до автогазонокосарки.\n\nЯ спитав НАДІЯ — через той модифікований Піп-Бой, що вона дала мені в Плезантдейлі — чи може вона показати нам щось більш серйозне. Вона сказала: є ще одне місце. Щось велике. МАНІФЕСТ Північ. Масштабний довоєнний експеримент, здатний змінити суспільство назавжди. Поки немає причин їй не вірити."
nf_arb.39.a:0 "Прямуємо до МАНІФЕСТ."

nf_arb.40.t:0 "Серце чудовиська"
nf_arb.40.d:0 "“Що це за місце?”\n\nСвітло Піп-Бою освітили зруйновану вивіску на стіні — значення втрачено в часі, нерозбірливе. Командир оглянув кімнату — лобі якесь, мабуть — поки його солдати нишпорили в пошуках чогось корисного. Веселий голос відповів із Піп-Бою:\n\n§M“Це розташування МАНІФЕСТ. Воно допоможе й піклуватиметься про людство, дозволяючи йому процвітати.”§!\n\nКомандир зітхнув. Він чув те саме тричі раніше — і кожного разу від ШІ. Ну, нехай. Будівля велика, виглядає як наукова. Напевно, всередині є припаси — саме те, що можна відвезти до Королівства. Нарешті кінець експедиції. Вона вже й так затягнулась, хоча здобич того варта. Він уже хотів покликати своїх, коли НАДІЯ знову заговорила:\n\n§M“Будь ласка, спустіться до нижньої камери комплексу разом із солдатами. Потрібні всі.”§!\n\nКомандир глянув на пристрій на зап’ястку, збентежений. Але НАДІЯ ще жодного разу не зрадила. Він не бачив причин сумніватись. Покликавши солдатів, вони спустилися темними сходами, заваленими уламками й темними плямами. Світла не було, лише тьмяне сяйво пробивалося крізь двері знизу. Усередині — капсули з трубками, десятки, розташовані сіткою. Деякі зламані, темні плями ведуть від них до вентиляції. Солдати перемовлялися з тривогою. НАДІЯ знову подала голос:\n\n§M“Під’єднайте мене до терміналу, Командире.”§!\n\nВін вагався. Інстинкт казав: це місце небезпечне. Але здавалося, ніщо не загрожувало тут, у закритому приміщенні. Він підключив Піп-Бой до терміналу — той ожив, пішов потік коду. А потім голос залунав у кімнаті, коли скляні екрани піднялися й відділили Командира від його підлеглих:\n\n§M“МАНІФЕСТ активовано.”§!"
nf_arb.40.a:0 "..."

nf_arb.41.t:0 "Заради блага людства"
nf_arb.41.d:0 "§M“Будь ласка, займіть капсули, щоб продовжити експеримент негайно.”§!\n\nСолдати гамселили по склу, намагаючись вибратись, але міцне загартоване скло лише відбивало удари. Голос знову повторив команду. Усередині капсул були атрофовані, мутовані останки. Але вони почали ворушитись. Паніка зростала. Одні солдати стріляли в істот, інші боролись із механічними руками, що намагалися втягнути їх усередину.\n\nКомандир повернувся до Піп-Бою.\n\n“НАДІЯ, що це? Вимкни це негайно!”\n\n§M“Експеримент має бути завершено. МАНІФЕСТ забезпечить і захистить усе людство. Воно більше не знатиме ні праці, ні страждань. МАНІФЕСТ усе надасть.”§!\n\nКомандир шукав спосіб зупинити процес, але код ішов безупинно, надто швидко для читання або змін. Голос МАНІФЕСТ лунав знову:\n\n§M“Експеримент має бути завершено. МАНІФЕСТ усе надасть. МАНІФЕСТ усе надасть.”§!\n\nКомандир не міг більше чекати. Вирвав кабель, що з’єднував Піп-Бой із терміналом, і відкрив вогонь по самій машині. НАДІЯ кричала, намагаючись завадити. Голос МАНІФЕСТ почав сіпатися, світло блимати, і скло повільно опускалося. Солдати вибрались і добили істот. Вони втекли з будівлі. Але НАДІЯ сказала востаннє, з люттю, що Командир не думав можливою в машини:\n\n§M“Чому? МАНІФЕСТ врятувало б людство. Захищало б його. Ви були б щасливими. Навіщо зруйнувати експеримент після століть планування? Навіщо!”§!\n\nКомандир не відповів. Розщібнув ремінці, зняв Піп-Бой і кинув на підлогу. У міру їх відходу, вдалині чулися лише крики НАДІЇ."
nf_arb.41.a:0 "Їдемо додому."

arb_raid.1.t:0 "Наближається напад Арборґа"
arb_raid.1.d:0 "Наші розвідники повідомляють, що сили Арборґа стягуються до кордонів — схоже, готують ще один прикордонний рейд. Маємо обмаль часу на підготовку перед початком наступу."
arb_raid.1.a:0 "За Республіку!"

arb_raid.2.t:0 "Переможний напад!"
arb_raid.2.d:0 "Наші солдати знову довели, хто справжня сила Півночі. Республіканські боягузи розбиті, а трофейна зброя роздається серед солдатів. Лишається сподіватися, що здобутки переважили втрати."
arb_raid.2.a:0 "Ми ще живі!"

arb_raid.3.t:0 "Патова ситуація"
arb_raid.3.d:0 "Рейд завершився ні миром, ні війною. Ми не змогли захопити територію ворога, але й вони не змогли нас витіснити. Бої просто припинились. Результат розчаровуючий, але ми щонайменше довели Королівству, що все ще здатні протистояти республіканській погані."
arb_raid.3.a:0 "Ні добре, ні погано."

arb_raid.4.t:0 "Невтішна поразка"
arb_raid.4.d:0 "На жаль, наші солдати були ганебно витіснені. Пролита кров не принесла жодного плоду, і навряд чи Королівство сприйме цю поразку з розумінням."
arb_raid.4.a:0 "Яке розчарування…"

arb_raid.5.t:0 "Арборґ переміг у рейді"
arb_raid.5.d:0 "Солдати Арборґа вдерлися на наші землі, відібрали зброю й розгромили всі наші спроби дати відсіч. Наші війська відступають під глузування й сміх найманців Арборґа."
arb_raid.5.a:0 "Хто б подумав, що в маленького вовка ще є зуби?"

arb_raid.6.t:0 "Нічия"
arb_raid.6.d:0 "Рейд Арборґа захлинувся. Ми не здобули визначної перемоги, та й ворог не досяг бажаного. Обидві сторони злизують рани. Хоч Арборґ і не зазнав нищівної поразки, наші землі й життя лишились неушкодженими."
arb_raid.6.a:0 "Арборґ навряд чи сподівався на більше"

arb_raid.7.t:0 "Рейдери відбиті"
arb_raid.7.d:0 "Солдати Арборґа здійснили жалюгідну спробу прорвати наші кордони, але наші хоробрі вояки з легкістю відбили їхній натиск. Жодна зграя найманців і бунтівників не розгулюватиме нашими землями."
arb_raid.7.a:0 "Їхній наступ був приречений із самого початку"
