ARB_civil_war_profiteering_decision_category_desc:0 "Повстання в Йорктоні дає нам цікаву нагоду. Надаючи одній або обом сторонам вигідні умови на постачання, живу силу, досвід і тренування, ми можемо нахилити терези й при цьому непогано заробити.\n\n§YПриймаючи ці рішення, ми виставляємо наші \"товари\" на продаж. Якщо будь-яка сторона обере купити, ми отримаємо плату.§!\n\n   Резерви людської сили на ринку: [?global.arb_market_manpower|G|0]\n   Найнята людська сила: [?global.arb_hired_manpower|Y|0]\n   Зброя на продажу: [?global.arb_weapons_for_sale|G|0]\n   Спорядження спецпідрозділів на продажу: [?global.arb_special_forces_for_sale|G|0]\n   Пропонований бойовий досвід: [?global.arb_experience_offered|G|0]\n   Доступні інструктори: [?global.arb_training_specialists_available|G|0]"

