arb_no_more_legitimacy_tt:0 "Довівши нашу вірність і спроможність, ми більше не будемо залежати від легітимності."
arb_unprepared_for_war_tt:0 "§RМанітоба у війні з Республікою Трьох Річок, а ми не готові!§!"
