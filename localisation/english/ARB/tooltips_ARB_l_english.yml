l_english:
arborg_reliant_on_manitoba_tt:0 "§YЧерез наш поточний стан ми залежимо від Манітоби щодо постачання спорядження. Можливо, згодом ми зможемо розвинути власну військову промисловість, але наразі мусимо використовувати нашу легітимність для запиту поставок від наших покровителів.§!"

arb_border_war_tt:0 "§GЯкщо рейд буде успішним, ми отримаємо значне зростання легітимності.§!"

arb_not_waiting_on_response_or_neutral_tt:0 "Ми не чекаємо відповіді щодо підтримки й не обрали нейтралітету"

arb_supply_shipments_stop_tt:0 "§RМи більше не зможемо запитувати поставки!§!"
arb_offer_aid_to_manitoba_tt:0 "§YМи запропонуємо допомогу Королівству Манітоба в обмін на спорядження.§!"
arb_offer_aid_to_yorkton_tt:0 "§YМи запропонуємо допомогу Йорктону в обмін на спорядження.§!"

arb_unlock_legitimacy_decisions_tt:0 "§GВідкриє нові рішення для збільшення та використання легітимності.§!"
arb_unlocks_raiding_decisions_tt:0 "§GВідкриє рішення для продовження сутичок із Республікою Трьох Річок задля здобичі й легітимності.§!"

arb_weakens_three_rivers_tt:0 "§GЦе послабить Республіку Трьох Річок у майбутніх прикордонних конфліктах.§!"
arb_demand_tribute_from_gimli_tt:0 "§YМи вимагатимемо данину з Ґімлі у формі зброї. Якщо вони відмовляться — відкриються рішення для здійснення рейдів проти них.§!"

arb_unlock_yorkton_focuses_tt:0 "§YВідкрито фокуси для втручання в повстання Йорктону.§!"
arb_all_is_well_in_manitoba_tt:0 "У Манітобі все спокійно"

arb_bunkers_on_manitoban_border_tt:0 "§YЦей фокус збудує бункери на всіх наших кордонах із Королівством Манітоба або Ланґенбурґом і їхніми васалами.§!"

arb_another_day_tt:0 "§OЩе один день — ще одна вкрадена республіканська гвинтівка.§!"

arb_core_states_taken_from_wpg_tt:0 "Ми отримаємо ядра на всі області, відібрані у Республіки Трьох Річок"

ARB_send_volunteers_to_brandon_tt:0 "§GМи зможемо надіслати добровольців до Королівства Манітоба!§!"
ARB_send_volunteers_to_yorkton_tt:0 "§GМи зможемо надіслати добровольців до Йорктону!§!"

arb_must_have_manitoba_support_accepted_tt:0 "Манітоба має прийняти нашу пропозицію про підтримку"
arb_must_have_yorkton_support_accepted_tt:0 "Йорктон має прийняти нашу пропозицію про підтримку"

arb_won_yorktons_rebellion_tt:0 "Наша сторона перемогла в повстанні Йорктону"
arb_war_finished_without_a_side_tt:0 "Повстання Йорктону завершилось без нашої участі"
arb_lost_yorktons_rebellion_tt:0 "Наша сторона програла в повстанні Йорктону"

arb_going_to_raid_you_tt:0 "§YАрборґ, скоріш за все, здійснить проти нас рейд найближчим часом§!"

arb_restless_obrien_tt:0 "§RНеспокійний і замислений, О'Браєн незабаром покине маєток, щоб знову вирушити в мандри, вагаючись, чи не був би він щасливішим, обравши інший шлях. Хто знає, куди його приведе доля…§!"

ARB_frewers_tt:0 "§gМанітоба надішле §Yгенерала Фрюерса§! як фельдмаршала для допомоги нам.§!"
arb_unlock_advisors_tt:0 "§gМи отримаємо нових радників для вирішення наших найбільш нагальних проблем.§!"

arb_monarchists_rise_tt:0 "Два підрозділи повстанців приєднаються до нас!"
arb_merc_reinforcements_tt:0 "З'являться два підрозділи найманців!"

ARB_large_legitimacy_gain_tt:0 "§GМи отримаємо велику кількість легітимності.§!"
ARB_moderate_legitimacy_gain_tt:0 "§GМи отримаємо помірну кількість легітимності.§!"
ARB_small_legitimacy_gain_tt:0 "§GМи отримаємо невелику кількість легітимності.§!"

ARB_small_legitimacy_loss_tt:0 "§RМи втратимо невелику кількість легітимності.§!"
ARB_moderate_legitimacy_loss_tt:0 "§RМи втратимо помірну кількість легітимності.§!"
ARB_large_legitimacy_loss_tt:0 "§RМи втратимо велику кількість легітимності.§!"

ARB_manitoban_expedition_tt:0 "§CКоролівству знадобилась допомога в умиротворенні однієї пустки. Гарний сезон полювання, голова тієї крижаної королеви-айселурка стала класним трофеєм.§!\n\n"
ARB_northern_expedition_tt:0 "§CКараван потребував охорони для подорожі на Північ. Познімали чимало рейдерів, навіть їхній табір знищили…§!\n\n"
ARB_enclave_expedition_tt:0 "§CЦе було трохи підозріло — якась поїздка до довоєнного бункера, але заплатили добре, а ще я врятував групу від кількох бойових роботів.§!\n\n"

arb_only_manitoba_tt:0 "§YЛише Манітоба зможе купувати наші послуги.§!"
arb_only_yorkton_tt:0 "§YЛише Йорктон зможе купувати наші послуги.§!"

arb_hundred_soldiers_tt:0 "Це відправить 100 солдатів на ринок і дозволить їх найняти, збільшуючи загальну кількість на ринку до $RIGHT$. §OЯкщо цих солдатів не наймуть до кінця війни, ми отримаємо всю людську силу назад. Якщо ж наймуть — отримаємо лише половину.§!"
arb_twohundredfifty_soldiers_tt:0 "Це відправить 250 солдатів на ринок і дозволить їх найняти, збільшуючи загальну кількість на ринку до $RIGHT$. §OЯкщо цих солдатів не наймуть до кінця війни, ми отримаємо всю людську силу назад. Якщо ж наймуть — отримаємо лише половину.§!"

arb_add_experience_tt:0 "Це відправить 25 досвіду армії на ринок, дозволивши його купити. Загальна кількість на ринку складе $RIGHT$. §OЯкщо цей досвід не буде придбано до кінця війни, ми отримаємо його назад.§!"

arb_fifty_weapons_tt:0 "Це відправить 50 одиниць піхотного спорядження на ринок, дозволивши його купити. Загальна кількість на ринку складе $RIGHT$. §OЯкщо це спорядження не буде придбано до кінця війни, ми отримаємо його назад.§!"
arb_hundredfifty_weapons_tt:0 "Це відправить 150 одиниць піхотного спорядження на ринок, дозволивши його купити. Загальна кількість на ринку складе $RIGHT$. §OЯкщо це спорядження не буде придбано до кінця війни, ми отримаємо його назад.§!"
arb_twohundredfifty_weapons_tt:0 "Це відправить 250 одиниць піхотного спорядження на ринок, дозволивши його купити. Загальна кількість на ринку складе $RIGHT$. §OЯкщо це спорядження не буде придбано до кінця війни, ми отримаємо його назад.§!"

arb_fifty_spec_ops_tt:0 "Це відправить 50 одиниць спорядження для спецпризначенців на ринок, дозволивши його купити. Загальна кількість на ринку складе $RIGHT$. §OЯкщо це спорядження не буде придбано до кінця війни, ми отримаємо його назад.§!"

arb_add_training_advisor_tt:0 "Це відправить інструктора з підготовки на ринок, дозволивши його найняти. Загальна кількість на ринку складе $RIGHT$. §OЯкщо радника не буде найнято до кінця війни, ми повернемо ресурси, витрачені на його підготовку.§!"


arb_buy_hundred_soldiers_tt:0 "Це найме 100 солдатів із ринку, вилучаючи їх із пропозиції."
arb_buy_hundred_weapons_tt:0 "Це придбає 100 одиниць зброї з ринку, вилучаючи її із пропозиції."
