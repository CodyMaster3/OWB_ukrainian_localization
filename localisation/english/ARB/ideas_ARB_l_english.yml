l_english:
arb_supply_problems:0 "Проблеми з постачанням"
arb_supply_problems_desc:0 "Наша непідготовлена та дезорганізована втеча на північ мала чимало наслідків, але найбільшою проблемою стала нестача спорядження. Ми не були готові діяти як експедиційна сила, і до повстання приєдналось мало майстрів і механіків. Через це ми насилу підтримуємо достатнє постачання. Проте наші солдати охоче хапають усе ворожого виробництва, що потрапляє під руку."

arb_supply_problems2:0 "Проблеми з постачанням"
arb_supply_problems2_desc:0 "Наша непідготовлена та дезорганізована втеча на північ мала чимало наслідків, але найбільшою проблемою стала нестача спорядження. Ми не були готові діяти як експедиційна сила, і до повстання приєдналось мало майстрів і механіків. Через це ми насилу підтримуємо достатнє постачання. Проте наші солдати охоче хапають усе ворожого виробництва, що потрапляє під руку.\n\n§YМи почали робити перші кроки для вирішення цієї проблеми.§!"

arb_supply_problems3:0 "Проблеми з постачанням"
arb_supply_problems3_desc:0 "Наша непідготовлена та дезорганізована втеча на північ мала чимало наслідків, але найбільшою проблемою стала нестача спорядження. Ми не були готові діяти як експедиційна сила, і до повстання приєдналось мало майстрів і механіків. Через це ми насилу підтримуємо достатнє постачання. Проте наші солдати охоче хапають усе ворожого виробництва, що потрапляє під руку.\n\n§7Наші обдаровані уми працюють над новими способами створення та вдосконалення зброї, проте в наших військ зникає завзяття до мародерства.§!"

arb_supply_problems4:0 "Збої в постачанні"
arb_supply_problems4_desc:0 "Наша непідготовлена та дезорганізована втеча на північ мала чимало наслідків, але найбільшою проблемою стала нестача спорядження. Ми не були готові діяти як експедиційна сила, і до повстання приєдналось мало майстрів і механіків. Через це ми насилу підтримуємо достатнє постачання. Проте наші солдати охоче хапають усе ворожого виробництва, що потрапляє під руку.\n\n§GМи досягли вагомого прогресу в розв’язанні цієї проблеми.§!"

arb_affordable_weapons:0 "Доступна зброя"
arb_affordable_weapons_desc:0 "Тепер, коли наша промисловість відновилась настільки, що ми більше не залежимо від імпорту, ми зосередились на виробництві спорядження, що є водночас дешевим і ефективним."

arb_artistic_weapons:0 "Мистецька зброя"
arb_artistic_weapons_desc:0 "Тепер, коли наша промисловість відновилась настільки, що ми більше не залежимо від імпорту, ми почали виготовляти зброю, яка є справжнім витвором мистецтва — і яку буде приємно тримати в руках кожному."

arb_lopsided_army:0 "Неврівноважене військо"
arb_lopsided_army_desc:0 "Наша армія — це строката суміш досвідчених найманців і непідготовлених повстанців. Найманці, звісно, надзвичайно вмілі, а повстанці — це здебільшого цивільні з гвинтівками. Це створює дисбаланс: армія в цілому недосвідчена, але має надзвичайно ефективний ударний авангард."

arb_lopsided_army2:0 "Неврівноважене військо"
arb_lopsided_army2_desc:0 "Наша армія — це строката суміш досвідчених найманців і непідготовлених повстанців. Найманці, звісно, надзвичайно вмілі, а повстанці — це здебільшого цивільні з гвинтівками. Це створює дисбаланс: армія в цілому недосвідчена, але має надзвичайно ефективний ударний авангард. Проте перші кроки до виправлення цього вже зроблено."

arb_recovering_army:0 "Відновлюване військо"
arb_recovering_army_desc:0 "Наша армія колись була строкатим поєднанням найманців і повстанців. Та зараз ми вжили заходів, щоб підготувати повстанців до бою значно краще. Різниця ще відчувається, але ситуація вже не така критична."

arb_balanced_army:0 "Збалансоване військо"
arb_balanced_army_desc:0 "Ми вже далеко відійшли від тих початкових загонів повстанців і найманців. Тепер наші повстанці добре підготовлені, а серед них працюють офіцери-найманці. Хоча найманці залишаються елітою, між групами вже немає критичного розриву."

arb_specialising_army:0 "Військо зі спеціалізацією"
arb_specialising_army_desc:0 "Хоч повстанці й можуть частково наблизитися до рівня найманців, рівність між ними — малоймовірна. Зміцнивши авторитет 'шляхти' серед найманців, ми підтримаємо їх перевагу та надамо рядовим мету для прагнень."

arb_noble_army:0 "Шляхетське військо"
arb_noble_army_desc:0 "Армія — це продовження влади, тож має втілювати найважливіше: найманське ядро, що створило нашу державу. Наші війська домінують завдяки вмілим найманцям, а рядові лише мріють коли-небудь досягти їхнього рівня."

arb_developing_industry:0 "Розвиток промисловості"
arb_developing_industry_desc:0 "Арборґ має невигідне розташування і занадто мало розвинутий. Якщо ми хочемо вижити тут достатньо довго, щоб повалити Республіку, нам доведеться розвивати промисловість."

arb_developing_industry2:0 "Розвиток промисловості"
arb_developing_industry2_desc:0 "Арборґ має невигідне розташування і занадто мало розвинутий. Якщо ми хочемо вижити тут достатньо довго, щоб повалити Республіку, нам доведеться розвивати промисловість."

arb_developing_industry3:0 "Розвиток промисловості"
arb_developing_industry3_desc:0 "Арборґ має невигідне розташування і є надзвичайно слабо розвиненим. Якщо ми хочемо протриматися тут досить довго, щоб повалити Республіку, нам потрібно наростити власну промисловість."

arb_social_immobility:0 "Соціальна непроникність"
arb_social_immobility_desc:0 "Наші найманці становлять «шляхетне» ядро нашого уряду й уособлюють найкраще, що є в нашому суспільстві. Не можна ж дозволити кожному обідранцю з вулиці стати лицарем!"

arb_covering_up_idea:0 "Приховування несправедливостей"
arb_covering_up_idea_desc:0 "Наш уряд… не надто добрий до окремих своїх громадян. Не варто, щоб Манітоба дізналася, що сталося з її вірними підданими, авжеж."

arb_mercenaries_of_the_frozen_north:0 "Найманці Крижаного Півночі"
arb_mercenaries_of_the_frozen_north_desc:0 "У наших військових — великий досвід кампаній і походів у крижаних пустках Півночі."

arb_dream_of_power:0 "Мрії про владу"
arb_dream_of_power_desc:0 "Скільки себе пам’ятає, О'Браєн прагнув не лише впливати на власне життя, а й формувати долю усього Пустоші."

arb_dream_of_respect:0 "Мрії про повагу"
arb_dream_of_respect_desc:0 "Зневажений і недооцінений усе своє життя, О'Браєн прагне показати Пустоші, що він гідний поваги — хай навіть доведеться пролити за це кров."

arb_soldiers_of_the_crown:0 "Солдати Корони"
arb_soldiers_of_the_crown_desc:0 "Як представники Манітобської Корони, наші війська діють із королівською владою, що дарована нам."

arb_open_to_manitoban_markets:0 "Відкриття до манітобських ринків"
arb_open_to_manitoban_markets_desc:0 "Ми почали відкривати свої ринки для торговців і компаній із Манітоби, що зміцнило нашу економіку, хоч і не без втрат."

arb_open_to_manitoban_markets2:0 "Відкриття до манітобських ринків"
arb_open_to_manitoban_markets2_desc:0 "Ми відкрили свої ринки для торговців і компаній із Манітоби, що зміцнило нашу економіку, хоч і не без втрат."

arb_kings_own_rangers:0 "Королівські рейнджери"
arb_kings_own_rangers_desc:0 "Наші війська представляють Манітобську Корону, і тому наші рейнджери — найкращі з найкращих."

arb_monarchist_revolution:0 "§RМонархістська революція!§!"
arb_monarchist_revolution_desc:0 "Інакодумці й монархісти почали повстання по всій сільській місцевості! Хоча їм не зрівнятися з нашими силами, вони значно послаблюють воєнні зусилля."

arb_independence_threatened:0 "Незалежність під загрозою!"
arb_independence_threatened_desc:0 "Здобути незалежність ніколи не буде легко, §Oособливо в країні, де більшість населення прибула сюди підтримувати монархію, від якої ми тепер відмовляємось.§!"

arb_independence_threatened2:0 "Незалежність під загрозою!"
arb_independence_threatened2_desc:0 "Здобути незалежність ніколи не буде легко, §Oособливо в країні, де більшість населення прибула сюди підтримувати монархію, від якої ми тепер відмовляємось.§!"

arb_angers_triumphant:0 "Анже святкує перемогу!"
arb_angers_triumphant_desc:0 "Арборґ більше не є хаотичною зграєю найманців і повстанців — тепер це самостійна держава: Королівство Анже. \n\nКанада здригається, а Анже — святкує."

ARB_supporting_revolt_idea:0 "Підтримка з Арборґа"
ARB_supporting_revolt_idea_desc:0 "Непередбачувані, але безсумнівно вправні вояки Арборґської Хунти вирішили, що наша справа — найсправедливіша. Їхні наймані радники діляться досвідом і тренують наші війська, а їхні солдати підсилюють наші армії, хоч і в малих кількостях."

arb_the_great_push:0 "Великий наступ"
arb_the_great_push_desc:0 "Час настав. Три Ріверс має загинути."

arb_large_nobility:0 "Розширене дворянство"
arb_large_nobility_desc:0 "Щоб забезпечити достатню кількість солдатів, ми поступово розширювали наше дворянство. А ті зазнайки з Манітоби — хай мовчать."

arb_obrien_redeems_his_failures:0 "Відкуплення наших провалів"
arb_obrien_redeems_his_failures_desc:0 "Занадто довго ми жили з ганьбою того, що підвели Манітобу. Та цього разу все буде інакше."

arb_nunavut_successes:0 "Дипломатичний прорив із Нунавутом"
arb_nunavut_successes_desc:0 "Під наглядом наших зверхників із Манітоби ми організували експедицію на далекий північ, щоб знайти мешканців Нунавута. Хоча основною метою було встановлення контактів між ними й Манітобою, ми також маємо чим скористатися."

arb_nunavut_successes_2:0 "Дипломатичний прорив із Нунавутом"
arb_nunavut_successes_2_desc:0 "Дивом, але найманці Арборґа справді зуміли налагодити контакт із нунавутами з далекої Півночі. Це забезпечило нам вигідне положення, а наша торгівля з Нунавутом — процвітатиме!"

arb_manifest_consumer_goods:0 "Побутові товари МАНІФЕСТ"
arb_manifest_consumer_goods_desc:0 "Експедиції Арборґа виявили силу-силенну побутових речей: роботів-пилососів, тримерів для бороди й інші чудеса довоєнного виробництва. Еліта буде в захваті… поки тривають запаси."

arb_revolt_volunteers:0 "Добровольці повстання"
arb_revolt_volunteers_desc:0 ""

arb_cruel_punishments:0 "Жорстокі покарання"
arb_cruel_punishments_desc:0 ""

arb_generous_rewards:0 "Щедрі винагороди"
arb_generous_rewards_desc:0 ""
