l_english:
arb_lucky_break:0 "§GЩасливий прорив§!"
arb_lucky_break_desc:0 "О'Браєн — не звичайний найманець. Адже скільки найманців отримують таку можливість?"

arb_dream_of_royalty:0 "§CМрія про королівське§!"
arb_dream_of_royalty_desc:0 "Коли доміно почали падати в Манітобі, дехто побачив у цьому не крах, а можливість."

arb_harsh_reality:0 "§RСувора реальність§!"
arb_harsh_reality_desc:0 "§OУдача не триває вічно.§!"

arb_supply_problems_focus:0 "§OПроблеми з постачанням§!"
arb_supply_problems_focus_desc:0 "Відрізані від своїх покровителів, із ворожими силами, що прагнуть їхньої загибелі — не дивно, що Арборґ відчуває тиск."

arb_what_industry:0 "Промисловість? Яка промисловість?"
arb_what_industry_desc:0 "Солдати в Арборґу кажуть: на ворожі поставки зброї можна покластися більше, ніж на наші власні."

arb_begin_weapons_development:0 "Почати розробку зброї"
arb_begin_weapons_development_desc:0 "Надійне постачання зброї у Пустці — життєво необхідне. А в нас його просто немає."

arb_reverse_engineer_weapons:0 "Зворотна інженерія зброї"
arb_reverse_engineer_weapons_desc:0 "Розбираючи зброю, яку надала нам Манітоба, ми зможемо краще зрозуміти її конструкцію й покращити власні розробки."

arb_early_prototypes:0 "Перші прототипи"
arb_early_prototypes_desc:0 "Ми вже почали експериментувати з власною зброєю, але найкращий спосіб перевірити її — це бойове випробування."

arb_new_experts:0 "Нові фахівці"
arb_new_experts_desc:0 "Створення зброярської промисловості — це не лише заводи, а ще й навчання майстрів і інженерів."

arb_catching_up:0 "Надолуження"
arb_catching_up_desc:0 "Зброярська промисловість Арборґа не лише крихітна, але й відстає. Ми маємо зробити все можливе, щоб надолужити згаяне."

arb_rapid_production:0 "Швидке виробництво"
arb_rapid_production_desc:0 "Тільки масовий випуск зброї допоможе нам зрівнятись із суперниками. На щастя, наші зусилля запалили ентузіазм серед робітників — поки що."

arb_build_on_developments:0 "Будувати на вже досягнутому"
arb_build_on_developments_desc:0 "Хоч нам і доведеться створити нову індустрію, краще вдосконалити наявні потужності, ніж починати з нуля."

arb_scavenging_teams:0 "Команди з розбору"
arb_scavenging_teams_desc:0 "Навчивши команди обшукувати місцеві руїни, ми зможемо максимально витиснути з них користь."

arb_industrial_experimentation:0 "Індустріальні експерименти"
arb_industrial_experimentation_desc:0 "Щоб мати справді сильну промисловість, треба не копіювати інших, а розвивати унікальні, інноваційні підходи."

arb_unempathetic_design:0 "Безжальний дизайн"
arb_unempathetic_design_desc:0 "Через обставини ми змушені будувати індустрію швидко. Наші заводи не для життя — тож навіщо робити їх дружніми?"

arb_expand_weapons_production:0 "Розширити виробництво зброї"
arb_expand_weapons_production_desc:0 "Розробки не мають сенсу без цехів, де їх можна втілити. Ми повинні розширити наші потужності."

arb_weapons_confiscations:0 "Конфіскація зброї"
arb_weapons_confiscations_desc:0 "Незважаючи на наші «запозичення», багато місцевих досі мають зброю. Якщо вони довіряють нам, то навіщо їм гвинтівки?"

arb_supervised_production:0 "Контрольоване виробництво"
arb_supervised_production_desc:0 "Слідкуючи за робітниками та новими об'єктами, ми зможемо гарантувати найкращу ефективність."

arb_look_to_the_sky:0 "Суша, море, небо"
arb_look_to_the_sky_desc:0 "Хтось сміється з наших амбіцій мати авіацію чи флот у крижаній глушині. Але ми будемо сміятись останні, коли наші літаки кружлятимуть над головами ворогів."

arb_up_to_snuff:0 "Нарешті на рівні"
arb_up_to_snuff_desc:0 "Ми, зрештою, підняли нашу зброярську галузь з рівня «палиці й багнюка» до справжньої майстерності."

arb_cheap_and_affordable:0 "Дешево й доступно"
arb_cheap_and_affordable_desc:0 "Тепер, коли ми можемо змагатись на ринку зброї, настав час зробити її масовою — маємо ідеї, як здешевити виробництво."

arb_works_of_art:0 "Витвори мистецтва"
arb_works_of_art_desc:0 "Дехто з наших робітників почав удосконалювати нашу зброю й давати цінні пропозиції. Ми повинні заохочувати ці ініціативи."

arb_ensure_production_output:0 "Гарантувати обсяг виробництва"
arb_ensure_production_output_desc:0 "Щоб підтримувати потрібну кількість зброї, ми маємо ще більше розширити індустрію."

arb_more_than_guns:0 "Більше, ніж просто гвинтівки"
arb_more_than_guns_desc:0 "Гвинтівки — це добре. Але найсильніші армії мали танки й кораблі. Танки нам не по зубах, але легкі машини та човни — цілком реальні."

arb_constructive_criticisms:0 "Конструктивна критика"
arb_constructive_criticisms_desc:0 "Деякі наші будівлі... небезпечні. Якщо навчити людей перевіряти споруди й фіксувати недоліки, ми, можливо, зменшимо кількість обвалів заводів до одного на тиждень."

arb_manitoba_delegation:0 "Делегація до Манітоби"
arb_manitoba_delegation_desc:0 "Наш статус як підлеглих Манітоби — невизначений. Щоб почати переговори про постачання й майбутнє наших народів, слід надіслати делегацію."

arb_enshrine_new_nobility:0 "Закріпити нову шляхту"
arb_enshrine_new_nobility_desc:0 "Манітоба має те, чого не має більшість країн Пустки — шляхту. Створивши власну, ми зможемо довести вірність королівським ідеалам і винагородити відданих вояків. У шляхти ж немає недоліків, так?"

arb_cover_up_treatment:0 "Приховати погане поводження"
arb_cover_up_treatment_desc:0 "Деякі наші громадяни зазнали... не найкращого ставлення. Більшість із них — повстанці, але багато хто — просто місцеві мешканці. Монархісти це не схвалюють. Треба приховати правду й створити видимість миру."

arb_our_place_in_their_world:0 "Наше місце у їхньому світі"
arb_our_place_in_their_world_desc:0 "Загін найманців і повстанців — не найкраща основа для держави. Тож яке наше місце в Королівстві Манітоба? Як ми можемо довести свою цінність?"

arb_manitoban_soldiers:0 "Манітобські солдати"
arb_manitoban_soldiers_desc:0 "У визнання наших зусиль, Манітоба надіслала підкріплення під керівництвом генерала, досвідченого у логістиці й організації."

arb_keep_the_war_going:0 "Війна ніколи не закінчувалась"
arb_keep_the_war_going_desc:0 "Хоч Манітоба й підписала мир, війна з Трьома Ріками для нас триває: на кордонах лунають постріли, солдати гинуть. Ми не можемо зупинятись."

arb_border_terror:0 "Жах на кордоні"
arb_border_terror_desc:0 "§RСолдати Трьох Рік навчаться боятись нічних звуків.§!"

arb_weapons_raids:0 "Набіги на зброю"
arb_weapons_raids_desc:0 "У нас бракує зброї, але Три Ріки мають її вдосталь. Швидка атака на гарнізон — мінімальні втрати, максимальна здобич."

arb_forgehold_blues:0 "Клопоти з Горнилом"
arb_forgehold_blues_desc:0 "Кузня Ґімлі дружить з Трьома Ріками. Вимагаючи в них зброю, ми і себе підсилимо, і ворога ослабимо."

arb_monarchists_rise_up:0 "Повстання монархістів!"
arb_monarchists_rise_up_desc:0 "У Трьох Ріках досі багато невдоволених. Якщо ми підтримаємо їх, наберемо вірних бійців."

arb_damn_the_dammed:0 "До біса Проклятих"
arb_damn_the_dammed_desc:0 "Прокляті окупують північні споруди, що колись належали Манітобі. Повернімо їх — і заслужимо прихильність."

arb_best_foot_forward:0 "Показати найкраще"
arb_best_foot_forward_desc:0 "Тепер, коли ми контролюємо ці землі, варто запросити представників Манітоби й продемонструвати наші досягнення. Це підвищить нашу репутацію."

arb_gather_monarchist_allies:0 "Земля дихає Монархією"
arb_gather_monarchist_allies_desc:0 "Монархізм ніколи не зник із колишнього герцогства Анжер. Навіть серед Проклятих є ті, хто чекав повернення. Завдяки їм інтеграція йде напрочуд легко!"

arb_time_to_celebrate:0 "§CЄ що святкувати§!"
arb_time_to_celebrate_desc:0 "Ми об'єднали герцогство Анжер. Саме час святкувати! І що може бути кращим за святкування, ніж добити Проклятих?"

arb_not_just_mercenaries:0 "Ми більше не лише найманці"
arb_not_just_mercenaries_desc:0 "Тепер ми держава. Треба відкинути старі звички: найманці, повстанці — усі повинні змінитись. Починаємо реформу армії."

arb_organise_insurgents:0 "Організувати повстанців"
arb_organise_insurgents_desc:0 "Найманці — наш ударний кулак. Але який у ньому сенс, якщо повстанці не можуть тримати лінію? Навчимо їх воювати."

arb_training_rosters:0 "Розробити розклад навчань"
arb_training_rosters_desc:0 "Впровадження навчальної програми дозволить підготувати якомога більше бійців. Найманці нехай бурчать, але це потрібно."

arb_reinforce_nobility:0 "Посилити шляхту"
arb_reinforce_nobility_desc:0 "Обіцяючи підвищення на полі бою, ми зможемо залучити кращих солдатів до лав найманців. Це дозволить зберегти ядро армії досвідченим та мотивуватиме солдатів досягати більшого."

arb_appoint_knight_captains:0 "Призначити лицарів-капітанів"
arb_appoint_knight_captains_desc:0 "Призначаючи лицарів-капітанів серед солдат, ми не лише заручимось підтримкою Манітоби, але й створимо нову шляхту, що буде нам зобов'язана."

arb_army_that_rules:0 "Армія, що керує..."
arb_army_that_rules_desc:0 "Немає сумніву, що армія керує Арборзькою хунтою. Та тепер ми переконались, що вона є найкращою з можливих. Наші реформи гарантують її боєздатність і ефективність."

arb_ducal_reforms:0 "Герцогські реформи"
arb_ducal_reforms_desc:0 "Щоб стати армією, якою пишатиметься Королівство, нам недостатньо обирати між повстанцями й найманцями. Треба почати впроваджувати інновації."

arb_aid_from_the_kingdom:0 "Допомога від Королівства"
arb_aid_from_the_kingdom_desc:0 "На знак визнання наших зусиль, Манітоба надіслала радників для допомоги в нагальних питаннях."

arb_anti_robot_techniques:0 "Перетворити роботів на брухт"
arb_anti_robot_techniques_desc:0 "Окрім людей, у канадських пустках повно роботів. Ми маємо бути готові до будь-якого супротивника."

arb_merc_reinforcements:0 "Наймане підкріплення"
arb_merc_reinforcements_desc:0 "Нам просто потрібні люди. У нинішньому стані ми не зможемо стримати Три Ріки, навіть із підтримкою Манітоби. Наймемо підкріплення та підготуємось."

arb_reform_unit_doctrine:0 "Реформа бойової доктрини"
arb_reform_unit_doctrine_desc:0 "Справжня армія — це не просто купа озброєних людей. Треба мати тилові підрозділи, шпиталі, саперів. Пора реформуватися."

arb_new_weaponry_experiments:0 "Експерименти з новою зброєю"
arb_new_weaponry_experiments_desc:0 "Окрім підтримки, спеціалізована зброя може суттєво посилити солдатів. Почнемо експериментувати просто зараз."

arb_declare_duchy_restored:0 "Проголосити герцогство відновленим!"
arb_declare_duchy_restored_desc:0 "Тепер, коли ми володіємо землями Проклятих, маємо повну територію колишнього герцогства Анжер. Утворивши Східні Марки, ми доведемо Манітобі та світу, що Анжер повернувся."

arb_manitoban_business:0 "Бізнес із Манітоби"
arb_manitoban_business_desc:0 "Залучивши бізнес із Манітоби, ми зміцнимо місцеву економіку. Це зробить нас залежними від Манітоби, але що в цьому поганого?"

arb_loyal_servants_of_the_crown:0 "Вірні слуги Корони"
arb_loyal_servants_of_the_crown_desc:0 "Пора схилити коліно перед Манітобою й остаточно інтегруватися до Королівства."

arb_a_peaceful_retirement:0 "§OСпокійна§! відставка"
arb_a_peaceful_retirement_desc:0 "О'Браєн виконав свою справу, на зміну йому приходить новий герцог. Йому подарують землю й титул. Та О'Браєн — неспокійна душа. Хто знає, що він обере?"

arb_rangers_of_the_crown:0 "Рейнджери Корони"
arb_rangers_of_the_crown_desc:0 "Із нашою інтеграцією до Королівства, настав час перетворити нашу шляхетну армію на рейнджерів — як у решті Королівства."

arb_extension_of_the_kings_will:0 "Подовжена рука Короля"
arb_extension_of_the_kings_will_desc:0 "Ми більше не просто хунта на півночі — ми повноцінна частина Королівства. Наша армія — продовження волі короля."

arb_thriving_duchy:0 "Процвітаюче герцогство"
arb_thriving_duchy_desc:0 "Як хунта ми вижили. Але лише з допомогою Манітоби ми по-справжньому розквітнемо."

arb_prove_ourselves_to_manitoba:0 "Довести свою вартість"
arb_prove_ourselves_to_manitoba_desc:0 "Після перемоги над Трьома Ріками й вступу до Королівства, наш режим став безсумнівно легітимним."

arb_crown_loyalists:0 "Прихильники Корони"
arb_crown_loyalists_desc:0 "§GТричі слава Манітобі! Тричі слава Анжеру!§!"

arb_cruelty_to_others:0 "§RЖорстокість§! до інших..."
arb_cruelty_to_others_desc:0 "Не всі раді нашому приходу. Доведеться застосувати жорстокі покарання, щоб навчити їх слухатись."

arb_kindness_to_our_own:0 "А §Gдоброта§! до своїх"
arb_kindness_to_our_own_desc:0 "Щедра винагорода вірним забезпечує ефективну роботу держави. Дехто назве це корупцією, ми — змазкою для системи."

arb_obriens_greatest_failure:0 "Найбільша поразка О'Браєна"
arb_obriens_greatest_failure_desc:0 "Час повернутись до Трьох Рік. Ми були принижені. Пора все виправити."

arb_cruel_war_measures:0 "Жорстокі заходи на війні"
arb_cruel_war_measures_desc:0 "Три Ріки — це великий виклик і могутня держава. Кожного солдата і кожну рушницю треба мобілізувати, незалежно від ціни. Адже мета виправдовує засоби."

arb_incite_monarchist_revolts:0 "Підбурити монархістів"
arb_incite_monarchist_revolts_desc:0 "У Трьох Ріках досі залишилося чимало монархістів. Якщо ми покажемо їм шанс на перемогу, вони піднімуться на повстання."

arb_victory_for_the_junta:0 "§GПеремога хунти!§!"
arb_victory_for_the_junta_desc:0 "Ми перемогли! Три Ріки більше не існують, і ми закріпили своє місце на Півночі та в Королівстві. Напої — за рахунок [ARB.GetLeader]!"

arb_take_down_the_forgehold:0 "Зламати Горнило"
arb_take_down_the_forgehold_desc:0 "Єдина перешкода на шляху до нашого панування на сході — Горнило Гімлі. Незабаром ті горни працюватимуть на нас."

arb_obrien_rules:0 "О’Браєн править!"
arb_obrien_rules_desc:0 "О’Браєн зробив це! Він здолав Три Ріки та відновив свою честь. Думки й сумніви, що гнітили його роками, нарешті зникли. Світ знову став на місце."

arb_distance_from_the_monarchy:0 "Віддалитися від монархії"
arb_distance_from_the_monarchy_desc:0 "Монархія Манітоби не є бездоганною. Якби вона була, ми б не опинились у цьому становищі. А тепер О’Браєн мріє про власне королівство…"

arb_independent_industry:0 "Незалежна промисловість"
arb_independent_industry_desc:0 "Ми зробили великі кроки до незалежності від Манітоби. Щоб остаточна незалежність не зруйнувала економіку, треба подбати про її стабільність."

arb_crush_monarchist_resistance:0 "Придушити монархістський опір"
arb_crush_monarchist_resistance_desc:0 "Чомусь деякі ще виступають проти нашого “радикального” руху за незалежність. Прийдеться мати з ними справу."

arb_incite_revolt:0 "Спровокувати повстання"
arb_incite_revolt_desc:0 "Щоб остаточно проголосити незалежність, треба розібратись із незгодними. Якщо влаштувати повстання навмисно — ці пацюки самі вилізуть."

arb_assert_independence:0 "Проголосити незалежність"
arb_assert_independence_desc:0 "Час настав. Манітоба більше не має влади над нами. Відтепер ми самі вирішуємо свою долю."

arb_prepare_for_royal_intercession:0 "Підготуватись до королівського втручання"
arb_prepare_for_royal_intercession_desc:0 "Малоймовірно, що Манітоба спокійно змириться з нашою незалежністю. Потрібно зміцнити кордони."

arb_expand_definition_of_nobility:0 "Розширити поняття шляхти"
arb_expand_definition_of_nobility_desc:0 "Без бюрократів з Манітоби ми самі вирішимо, хто є шляхтою. Нам потрібні елітні солдати, а не обмеження."

arb_solidify_control:0 "Закріпити контроль"
arb_solidify_control_desc:0 "Ми повинні зміцнити владу на нових територіях, щоб мати шанс протистояти Манітобі."

arb_fight_for_our_independence:0 "Боротись за незалежність!"
arb_fight_for_our_independence_desc:0 "Ось воно — бій за наше майбутнє. Це буде важко, але ми мусимо боротись."

arb_new_kingdom_of_angers:0 "§CНове Королівство Анжер!§!"
arb_new_kingdom_of_angers_desc:0 "Стара держава впала, і ми вільні створити власну. Королівство Анжер правитиме Північчю!"

arb_watch_for_yorkton:0 "§OСлідкувати за Йорктоном§!"
arb_watch_for_yorkton_desc:0 "Напруга в Манітобі вибухнула — Йорктон повстав. Це чудова нагода для нас заробити."

arb_aid_to_the_king:0 "Допомогти королю"
arb_aid_to_the_king_desc:0 "Король — це король, навіть якщо Йорктону це не до вподоби. Ми залишимось вірними Короні."

arb_constitutional_supremacy:0 "Верховенство Конституції"
arb_constitutional_supremacy_desc:0 "Наші люди раді, що ми підтримали короля. Поки на сході — хаос, ми залишаємось островом спокою."

arb_all_the_kings_men:0 "Всі люди короля"
arb_all_the_kings_men_desc:0 "Поки ми не можемо послати війська, ми можемо направити радників. З нашою допомогою вони скоро переможуть."

arb_commit_our_forces:0 "Вступити в бій!"
arb_commit_our_forces_desc:0 "Не можна вічно стояти осторонь. Надсилаючи війська, ми підтвердимо свою відданість і допоможемо покласти край цьому заколоту."

arb_something_in_exchange:0 "Королівська щедрість"
arb_something_in_exchange_desc:0 "Перемога над тими зрадниками — нагорода сама по собі, але зайві винагороди нікому не завадять."

arb_watch_and_wait:0 "Спостерігати й чекати"
arb_watch_and_wait_desc:0 "Ми нічого не виграємо, якщо поспішимо стати на чийсь бік у цьому повстанні. Натомість ми можемо продавати зброю й сили обом сторонам і гарно заробити, а потім вчасно втрутитись."

arb_play_them_off:0 "Стравити їх між собою"
arb_play_them_off_desc:0 "Почнемо розширювати постачання для обох сторін. Чим довше триває війна, тим більше грошей ми заробимо. Всі у виграші!"

arb_embrace_mercenary_roots:0 "Знову найманці"
arb_embrace_mercenary_roots_desc:0 "Кажуть, що люди не змінюються. Це, звісно, дурниці, але мішок кришок досі дуже привабливий."

arb_final_moment_opportunism:0 "Використати момент"
arb_final_moment_opportunism_desc:0 "Повстання наближається до кінця, і час нам обрати переможця."

arb_reach_out_to_yorkton:0 "Зв’язатися з Йорктоном"
arb_reach_out_to_yorkton_desc:0 "Йорктон хоч і заколотник, але має військовий хист. Якщо ми станемо на його бік, він може допомогти нам більше, ніж слабкі дворяни в Брендоні."

arb_celebrate_the_war_hero:0 "Вшанувати героя війни"
arb_celebrate_the_war_hero_desc:0 "Йорктон — герой війни. Якщо ми вшануємо його заслуги, переконаємо ще більше людей стати на наш бік."

arb_training_to_the_marshall:0 "Допомогти Маршалу з тренуваннями"
arb_training_to_the_marshall_desc:0 "Маршал талановитий, але досвід не завадить. А наші найманці досвіду мають хоч відбавляй."

arb_throw_hat_in:0 "Кинути шапку в коло"
arb_throw_hat_in_desc:0 "Час відправити війська на підтримку Йорктона. Брендон лише в кількох днях шляху, якщо поспішити."

arb_compensation:0 "Компенсація за наші зусилля"
arb_compensation_desc:0 "Йорктон graciously погодився віддячити нам. Ми, звісно, допомагали від щирого серця… але компенсація зайвою не буде."

arb_outcome_was_inevitable:0 "§GГра була підстроєна з самого початку§!"
arb_outcome_was_inevitable_desc:0 "Ми підтримали переможця — як і слід було очікувати. Очевидно ж, що той, кого ми підтримуємо, виграє. Але все одно приємно, що це спрацювало."

arb_nothing_ventured:0 "§OХто не ризикує...§!"
arb_nothing_ventured_desc:0 "Не втручатись у повстання — безпечний вибір. Але переможці тепер нам дещо не довіряють."

arb_thats_embarrassing:0 "§RОт це вже ганьба...§!"
arb_thats_embarrassing_desc:0 "О’Браєн, мабуть, просто щось не те сказав своїм генералам. Напевне..."

arb_war_has_come:0 "Війна прийшла"
arb_war_has_come_desc:0 "Манітоба та Три Ріки вже у стані війни… значно раніше, ніж ми очікували. Треба терміново підготуватись і долучитись, інакше Манітоба переможе без нас (і не заплатить)!"

arb_obriens_redemption:0 "Спокута О’Браєна"
arb_obriens_redemption_desc:0 "Час для О’Браєна та його компанії відновити свою честь. Ми вже програвали Трьом Рікам, але цього разу все буде інакше."

arb_bulk_weapon_buyouts:0 "Масові закупівлі зброї"
arb_bulk_weapon_buyouts_desc:0 "У нас досі проблеми з постачанням. Можливо, якщо розкидатись кришками, зброя сама знайдеться."

arb_finish_the_republic:0 "Добити Республіку"
arb_finish_the_republic_desc:0 "Республіка досі тримається, але недовго залишилось. Треба готуватись до фінального наступу. Незабаром ми та Королівство переможемо."

arb_resettle_loyalists:0 "Переселити лоялістів"
arb_resettle_loyalists_desc:0 "Більшість повстанців з нашої армії — родом із земель Трьох Рік. Якщо повернути їх додому, вони будуть щасливіші, а ми — міцніше контролюватимемо регіон."