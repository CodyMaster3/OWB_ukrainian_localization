l_english:
unb_kleptomania:0 "Клептоманія"
unb_kleptomania_desc:0 "Цілком природно хотіти нагрібати багатства та влади. Але така політика, виявляється, не надто ефективна для керування державою."

unb_a_true_kleptocracy_idea:0 "Справжня Клептократія"
unb_a_true_kleptocracy_idea_desc:0 "Наш уряд існує заради здобичі. Більше! Ще більше! І ще трохи! Для Незв’язаних не існує меж – поки ми гребемо, ми процвітаємо."

unb_honor_among_thieves_idea:0 "Честь Серед Злодіїв"
unb_honor_among_thieves_idea_desc:0 "Не кожен рейдер народився злочинцем. Хтось хотів врятувати родину, когось – собаку. Але всі їхні мрії згоріли дотла. І лишився лише рейд."

unb_seeking_the_sky:0 "У Пошуках Неба"
unb_seeking_the_sky_desc:0 "Незв’язані прагнуть осягнути мудрість Громових Вершників, щоби з неба нести смерть і, нарешті, побачити його таким, яким мали з народження."

unb_the_pathologically_high_spirited_idea:0 "Патологічний Ентузіазм"
unb_the_pathologically_high_spirited_idea_desc:0 "Як не радіти, коли робиш те, що любиш: грабуєш, вбиваєш, палиш. Бути рейдером – це кайф!"

unb_torturous_torments:0 "Катівські Тортури"
unb_torturous_torments_desc:0 "Коли жах – це форма мистецтва, ми стаємо художниками болю."

unb_the_aldermen_spirit_idea:0 "Шановні Старійшини"
unb_the_aldermen_spirit_idea_desc:0 "Колишні очільники, тепер – опікунська рада грабунку. Їхній досвід безцінний, особливо коли він вимірюється в патронах."

unb_ex_Нігіло_idea:0 "Ex Нігіло"
unb_ex_Нігіло_idea_desc:0 "З нічого – все. У постапокаліпсисі це не віра, а інструкція до виживання."

unb_know_thy_neighbor_idea_la_resistance:0 "Пізнай Свого Ближнього"
unb_know_thy_neighbor_idea_la_resistance_desc:0 "У світі, де панують смерть і хаос, варто знати, скільки солдатів у сусіда... і де в нього слабкі місця."

unb_know_thy_neighbor_idea_non_la_resistance:0 "Пізнай Свого Ближнього"
unb_know_thy_neighbor_idea_non_la_resistance_desc:0 "У світі, де панують смерть і хаос, варто знати, скільки солдатів у сусіда... і де в нього слабкі місця."

unb_the_great_train_robbery_idea:0 "Рейд на Мус-Джо"
unb_the_great_train_robbery_idea_desc:0 "Рейд на Мус-Джо – шалений успіх! Повні кишені добра, і жодної відповідальності. Просто ідеально."

unb_the_second_mouse_gets_the_cheese_idea:0 "Другій Миші Сир"
unb_the_second_mouse_gets_the_cheese_idea_desc:0 "Перша миша отримує пастку. Ми ж чекаємо... і забираємо сир."

unb_welcome_the_fallen_tribe_idea:0 "Солдати Повертаються «Додому»"
unb_welcome_the_fallen_tribe_idea_desc:0 "Солдати з підкорених земель тікають до нас. Дезертири, вигнанці, рейдери – усі знайдуть місце серед Незв’язаних."

unb_the_river_toll_idea:0 "Мито за Переправу"
unb_the_river_toll_idea_desc:0 "Хочеш пройти через наші землі – плати. Бо в кожного рейдера є рахунок."

unb_bringing_the_gang_back_together_idea:0 "Повертаємо Банду"
unb_bringing_the_gang_back_together_idea_desc:0 "Ще один останній грабунок. Ти з нами, чи як?"

unb_brutally_cunning_idea:0 "Жорстоко-Кмітливі"
unb_brutally_cunning_idea_desc:0 "Груба сила – добре. Груба сила з хитрістю – ідеально."

unb_energy_siphon_trick_idea:0 "Фокус із Енергією"
unb_energy_siphon_trick_idea_desc:0 "Ми знайшли спосіб – дуже незаконний, дуже ефективний – красти енергію. Ворогові лишаються лише іскри."

unb_give_them_false_hope_idea:0 "Дати Фальшиву Надію"
unb_give_them_false_hope_idea_desc:0 "Ми ніколи не дозволимо робітникам зупинити виробництво. Просто дамо їм ілюзію, що колись усе стане краще."

unb_improving_their_lives_idea:0 "Покращення Їхнього Життя"
unb_improving_their_lives_idea_desc:0 "Жити під нашою владою – це краще, ніж бути мертвим. І ми радо нагадуємо їм про це щодня."

unb_stolen_technology_idea:0 "Викрадена Технологія"
unb_stolen_technology_idea_desc:0 "Ці блискучі штуковини належали іншим. Тепер вони – наші. І працюють на нас."

unb_trust_in_sabotage_idea:0 "Саботаж Незв’язаних"
unb_trust_in_sabotage_idea_desc:0 "Незв’язані влаштували саботаж наших поставок! Проблем стане більше, поки ми це не виправимо."

unb_upload_the_terror_algorythm_idea:0 "Алгоритм Жаху"
unb_upload_the_terror_algorythm_idea_desc:0 "Якимось чином Незв’язані отримали небезпечний вірус. Зв’язок і виробництво паралізовані. Прорвемося, але не без втрат."

unb_augmented_workforce_idea:0 "Покращені Працівники"
unb_augmented_workforce_idea_desc:0 "Ми вдосконалили працівників імплантатами. Вони стали продуктивніші. І слухняніші."

unb_radio_interference:0 "Радіоперешкоди"
unb_radio_interference_desc:0 "Будь-яка спроба вийти на зв’язок – і ми чуємо жахливий вереск. Здається, хтось у Незв’язаних грався не з тими кнопками на радарі."

unb_freedom_to_raid:0 "Свобода Грабувати"
unb_freedom_to_raid_desc:0 "Ми справді Незв’язані. І жодна сила на півночі не зупинить нас тепер!"
