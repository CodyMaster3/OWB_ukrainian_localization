l_english:
unb_old_money_old_treasure:0 "Старі Гроші, Старі Скарби"
unb_old_money_old_treasure_desc:0 "Важко повірити, але Кроу не завжди був тим вродливим, розумним, шанованим, кмітливим, геніальним і дотепним ватажком рейдерів, яким є зараз. Насправді він народився, як і ти, як і я. Дехто навіть скаже, що без народження Кроу ніколи б не став тим, ким він є сьогодні."

unb_dreams_of_terror:0 "Мрії Про Жах"
unb_dreams_of_terror_desc:0 "Навіть коли навколо тебе лежать мертві тіла твоїх товаришів по банді, життя все одно може дати тобі причину жити далі. Різанина його банди не зупинила Кроу — й близько."

unb_we_all_end_up_somewhere:0 "У Кожного Свій Кінець"
unb_we_all_end_up_somewhere_desc:0 "Історія Кроу — це історія крадіжок і підлості, що привела його в сучасність, яка... сповнена крадіжок і підлості. Але, як і все добре, це також коли-небудь скінчиться — бо скільки можна терпіти злодіїв і підлих?"

unb_controlling_williston:0 "Контроль Над Тейкофом"
unb_controlling_williston_desc:0 "Клімат Тейкофу може бути вкрай ворожим навіть у найкращі часи — але це наш дім. А дім треба поважати."

unb_compel_gunsmiths_to_cooperate:0 "Примусити Зброярів До Співпраці"
unb_compel_gunsmiths_to_cooperate_desc:0 "Зброярі Тейкофу мають пам’ятати своє місце. Якщо їм подобається жити в цивілізованому суспільстві, то хай подбають, щоб воно було озброєне."

unb_controlling_the_well:0 "Контроль Над Джерелом"
unb_controlling_the_well_desc:0 "Звісно, коли ти валяєшся під кайфом щодня годинами, зрошення навряд чи стане твоїм улюбленим хобі. Але вода на півночі цінна, як ніщо інше, і річковий доступ дає нам багатий ресурс. Якщо ми хочемо лишитися тут надовго — мусимо скористатися цим."

unb_connecting_scobey:0 "Зв’язок зі Скобі"
unb_connecting_scobey_desc:0 "Рівнини на північ від Міссурі ідеально підходять для швидких подорожей, а розчищення Шосе №2 дозволить прокласти шлях до Скобі. Час заявити, що траса знову відкрита для їзди."

unb_ramshackle_fortifications:0 "Кривобокі Укріплення"
unb_ramshackle_fortifications_desc:0 "Ти здивуєшся, як далеко можуть тебе завести фанера та цвяхи, зроблені з лайна й паличок."
unb_ramshackle_fortifications_tt:0 "Буде збудовано один рівень §Yзастав§! уздовж кордону Скобі.\n"

unb_secret_arms_depot:0 "Таємний Склад Зброї"
unb_secret_arms_depot_desc:0 "Ми надаємо перевагу терміну «позичили назавжди»... Ну ми ж залишили записку, еге ж?"

unb_refurbish_the_old_shipyard:0 "Відновити Стару Верф"
unb_refurbish_the_old_shipyard_desc:0 "Якби доки нашого містечка не були в такій сраній руїні, ми вже давно б дослідили, що там по річці далі. Стільки купців — і всі ще не обікрадені... Пора це виправити. Та й я завжди мріяв про каяк."
VICTORY_POINTS_13572_UNB:0 "Кроу-Форд"

unb_the_river_toll:0 "Митний Збір на Річці"
unb_the_river_toll_desc:0 "До: <ІМ’Я ПЛАТНИКА ПОДАТКІВ> Станом на <дата повідомлення> ми так і не отримали ваш податок за навігацію по Верхньому Міссурі, незважаючи на численні «нагадування». Ви маєте сплатити заборгованість до <дата сплати>, інакше ми вилучимо ваше майно. Якщо не вкладетесь у строк — розцінюватимемо це як свідому непокору, яка матиме наслідки у формі реквізиції майна та смертельної тупої травми голови."

unb_culbertson_steel:0 "Сталевий Десант"
unb_culbertson_steel_desc:0 "Здається, попередні жителі Лендингу не особливо старались витягти корисні запчастини з руїн на сході. Якщо зробити це тепер, ми отримаємо цілу гору металу для крафту чудових, гострих, небезпечних дрючків усіх форм і розмірів."

unb_a_prosperous_town:0 "Місто, Що Процвітає"
unb_a_prosperous_town_desc:0 "Ми, звісно, не фанати міського життя, але... з любов’ю, турботою й обслуговуванням з боку рабів — та тут цілком навіть нічого."

unb_a_reputation_for_honesty:0 "Репутація Чесності"
unb_a_reputation_for_honesty_desc:0 "Не всі злодії, бандити та рейдери брешуть при кожній нагоді. Фраза «честь серед злодіїв» не завжди така вже й жартівлива. Іноді вона дійсно працює."

unb_a_goodbye_to_marro:0 "Прощання з Марро"
unb_a_goodbye_to_marro_desc:0 "Марро був рейдером довше, ніж більшість людей у Пустці взагалі живе. Він був бадьорим і підступним бійцем усе своє життя, але вік бере своє. Час йому йти на спочинок — рідкісна розкіш у Пустці, і ще рідкісніша — для рейдера."

unb_know_thy_neighbor:0 "Знай Свого Сусіда"
unb_know_thy_neighbor_desc:0 "У цій частині Пустки про нас ходять кепські чутки. Нас звуть бандитами, вбивцями й голодними до золота виродками.\n\nНу... це правда. Але це не значить, що не варто бути обережними."

unb_how_difficult_could_leading_be:0 "А Що, Лідерство Важке?"
unb_how_difficult_could_leading_be_desc:0 "Марро нарешті пішов, залишивши очевидну прогалину в командній структурі нашої армії. Кроу завжди бачив себе лідером, який тримається далеко (ДАЛЕКО!) від передової... Але хіба це так важко?"
unb_how_difficult_could_leading_be_tt:0 "§Y$UNB_CRAW_NAME$§! стає Командувачем.\n§LРівень§!: §Y5§!\n§RАтака§!: §Y3§!\n§GОборона§!: §Y3§!\n§PПланування§!: §Y2§!\n§MЛогістика§!: §Y4§!\n§gРиси§!: §tРозумний§!, §tСильний§!, §tЗавойовник§!\n\n"

unb_reclaim_the_old_radar_station:0 "Повернути Стару РЛС"
unb_reclaim_the_old_radar_station_desc:0 "Поблизу Тейкофу є стара радіолокаційна станція — мабуть, її використовували американці, щоби виявляти китайських винищувачів над Північною Дакотою. А може, це була метеостанція. Кому не пох? Тепер вона наша, і оцей кнопка змушує всі радіо дико верещати!"

unb_sign_up_eager_volunteers:0 "Набрати Охочих Добровольців"
unb_sign_up_eager_volunteers_desc:0 "Обіцянка багатства й сили — приваблива (так ми всі й стали Незв’язаними). Життя Незв’язаних — це свобода, про яку більшість пустельників лише мріють. Не дивно, що молодь із Калбертсона хоче приєднатись до веселощів."
unb_sign_up_eager_volunteers_tt:0 "Три добровольчі загони з §YCulberston§! приєднаються до нашої армії — готові їхати.\n"

unb_hit_the_homesteads:0 "Грабуй Хутори"
unb_hit_the_homesteads_desc:0 "У Мусджо кажуть, що хочуть жити «мирним» і «непримітним» життям. Брехня. Якщо вони не прагнуть більшого, отже — вже мають, що треба. А якщо зіграти правильно, можна звалити все на фералів поблизу."

unb_a_heart_of_coal:0 "Вугільне Серце"
unb_a_heart_of_coal_desc:0 "Вугільний Консорціум — чудова нагода. Їм постійно потрібен захист (через інших рейдерів, ясна річ), а нам потрібні гроші й вугілля! Взаємовигідно!"
unb_a_heart_of_coal_focus_tt:0 "Чотири загони важкої піхоти буде надіслано до §Y[CPK.GetNameWithFlag]§! в обмін на частину їхніх запасів.\n"

unb_it_mustve_been_ferals:0 "Це Все Ферали!"
unb_it_mustve_been_ferals_desc:0 "Звалити вину на диких гулів — елементарно. Просто розкидай по хатах їхні трупи й позрізай ті частини, які явно застрелені — виглядатиме, ніби зжерли."

unb_the_second_mouse_gets_the_cheese:0 "Другий Миш Пожирає Сир"
unb_the_second_mouse_gets_the_cheese_desc:0 "У Мусджо й Рад-Газів назріло непорозуміння. Ідеальний момент, щоб втрутитись, припинити сварку… й обчистити обох до нитки."

unb_capture_new_merchandise:0 "Захопити Новий Товар"
unb_capture_new_merchandise_desc:0 "Що далі на захід — то більше дивного хламу з етикетками Middlemark. А що далі на схід — то більше цей хлам цінують. Не треба бути генієм, щоби здогадатись: кради в Мусджо — і продавай у Серединці."

unb_negotiating_with_the_stampede:0 "Переговори з Зграєю"
unb_negotiating_with_the_stampede_desc:0 "Зграя сильна і контролює Альбертинські степи, але в них і свої проблеми, і зв’язуватись із нами їм ні до чого. Можна запропонувати угоду: ми не чіпаємо їх, вони платять нам дрібну данину.\n\nХоча, звісно, ніхто не заважає нам потім все одно напасти."
unb_proposal_to_stampede_tt:0 "Ми запропонуємо §Y[STA.GetNameDef]§! пакт про ненапад. Якщо вони погодяться — платитимуть нам §G200k§! кришок. Якщо ні — ми автоматично створимо нові банди."

unb_set_up_a_gang_in_swiftcurrent:0 "Заснувати Нові Банди"
unb_set_up_a_gang_in_swiftcurrent_desc:0 "Нема сенсу мати справу з Зграєю. Якщо ми самі готові зрадити угоду, що їм заважає зробити те ж саме? Краще заселити нові землі нашими людьми й укріпити кордон, про всяк випадок."
unb_forts_on_stampede_border_tt:0 "Один рівень §Yзастав§! буде збудовано на кордоні з §Y[STA.GetNameDef]§!.\n"

unb_renaming_fort_peck:0 "Перейменування Форту Пек"
unb_renaming_fort_peck_desc:0 "Назва «Форт Пек» звучить як особиста образа для Кроу, еге ж?"

unb_smashing_safehaven:0 "Рознести Притулок"
unb_smashing_safehaven_desc:0 "Жителі сховищ не варті довіри — рівно настільки, наскільки далеко їх можна кинути. А ці ще й уклали якусь угоду з місцевими найманцями. Їхнє зростаюче місто, це їхнє «Безпечне Місце», краще виглядатиме — без цих костюмів із Сховища."

unb_people_for_horses:0 "Кришки за Коней"
unb_people_for_horses_desc:0 "Зграя має купу коней — звірів, що, кажуть, були ще до війни, але майже вимерли. Подружжя, що керує табором, не надто прагне торгівлі з нами. Але не всі в Зграї їх слухають. Нам вистачить кількох крадіїв."
unb_stampede_pact_accepted:0 "[STA.GetNameDef] прийняли нашу пропозицію щодо пакту про ненапад"

unb_welcome_the_fallen_tribe:0 "Прийняти Падлих Вояків"
unb_welcome_the_fallen_tribe_desc:0 "Завоювання — справа звична для Канади, і на їхньому шляху багато солдатів втрачають домівки, а іноді й саму можливість мати дім. Багато з них стають рейдерами, і ще більше не в ладах зі Зграєю. Для нас це ідеальна комбінація."

unb_a_more_defensible_hideout:0 "Краще Захищена Схованка"
unb_a_more_defensible_hideout_desc:0 "Колишній форт Пек, теперішній [1292.GetCapitalVictoryPointName], — доволі пристойне місце для справжньої бази. Потребує укріплення, але дасть Кроу й компанії простір для польотів."
unb_a_more_defensible_hideout_tt:0 "Три рівні §Yзастав§! буде побудовано навколо столиці по колу.\n"

unb_the_holotape:0 "Голострічка"
unb_the_holotape_desc:0 "У [1292.GetCapitalVictoryPointName] ми знайшли щось цікаве... голострічку з дуже, дуже інтригуючими даними."

unb_prepare_the_homecoming:0 "Підготувати Повернення"
unb_prepare_the_homecoming_desc:0 "Це було довгоочікувано, але зміни неминучі. Прийшов час подивитись у бік [MTC.GetNameDef] і вирішити — як саме ми збираємось вриватись на їхнє свято життя."

unb_trust_in_sabotage:0 "Покладатися на Саботаж"
unb_trust_in_sabotage_desc:0 "Комп’ютерам не можна довіряти. Краще просто пограбувати склади, ніж сподіватись, що вірус усе зробить за нас. А ще — хлопцям буде весело. Ці [MTC.GetAdjective] дурники навіть не зрозуміють, що їх вдарило."
unb_trust_in_sabotage_tt:0 "§YМи знищимо половину енергоблоків держави [MTC.GetNameDef].§!"

unb_upload_the_terror_algorythm:0 "Завантажити Алгоритм Жаху"
unb_upload_the_terror_algorythm_desc:0 "Ми живемо в епоху, де війна в Пустці змінюється: комп’ютери й заводи важливі так само, як і рушниці. Зламавши їхнє виробництво й системи управління, ми не отримаємо миттєвого ефекту, але в перспективі — наслідки можуть бути катастрофічними."

unb_access_the_mainframe:0 "Дістатися до Мейнфрейму"
unb_access_the_mainframe_desc:0 "Комплекс МАНІФЕСТ у Реджайні зберігає безліч цікавих секретів, але щоби отримати доступ до мейнфрейму, треба трохи часу. Але щойно ми проб’ємось... хто знає, що там на нас чекає?"

unb_reach_out_to_brandon:0 "Зв’язатися з Манітобою"
unb_reach_out_to_brandon_desc:0 "Манітоба зацікавлена в падінні [MTC.GetNameDef]. Вони хочуть знищити державу-відступника, яка принизила їх на полі бою — і можуть погодитись підтримати нас. Урешті-решт, що ми втрачаємо?"
unb_suggest_splitting_metis_tt:0 "Ми запропонуємо §Y[BRA.GetNameWithFlag]§! або §Y[DLN.GetNameWithFlag]§! розділити землі [MTC.GetName]. Це викличе скриптову мирну подію, якщо вони погодяться.\n\n"

unb_the_west_marches:0 "Західні Рубежі"
unb_the_west_marches_desc:0 "Королівство Манітоба — безсумнівно багате суспільство. Принаймні, його шляхта — так точно. Приєднатись до могутнього й заможного королівства — це честь. І навіть якщо ми зрадимо їх потім — встигнемо й на цьому нажитися. Вони вже звикли до зрад, мабуть, і не помітять."
unb_made_peace_deal_tt:0 "Ми маємо укласти угоду з королівством"

unb_analyze_combat_performance:0 "Аналіз Бойової Ефективності"
unb_analyze_combat_performance_desc:0 "Роботи аналізують людей, люди — роботів. Так ми дізнаємось, як обидві частини армії можуть удосконалити себе, перейнявши методи одне одного. Геній!"

unb_augmented_workforce:0 "Доповнена Робоча Сила"
unb_augmented_workforce_desc:0 "Більшість нашої робочої сили не в захваті від ідеї стати кіборгами. Люди бояться прогресу. Але якщо зробити це без згоди — продуктивність різко зросте. А що ще важливо, га?"

unb_reuse_the_scrap:0 "Повторне Використання Лому"
unb_reuse_the_scrap_desc:0 "Сотні зламаних роботів валяються по наших землях — особливо біля комплексу МАНІФЕСТ — іржавіють собі, розграбовані. Але ми знаємо краще: кожна деталь має цінність. Треба зібрати уламки й зібрати з них нових бойових роботів."

unb_upgraded_generals:0 "Покращені Генерали"
unb_upgraded_generals_desc:0 "Комплекс МАНІФЕСТ містить дані про прості ШІ, які можна перепрофілювати. Вони не Доля й не Надія, але Джастіс і Ліберті реагують швидше, ніж будь-яка людина, й виконують завдання з холодною ефективністю. І, що головне — не ниють, коли треба розрахувати постачання чи інші нудні речі."
unb_upgraded_generals_tt:0 "§Y$UNB_LIBERTY_NAME$§! та §Y$UNB_JUSTICE_NAME$§! стають польовими командирами.\n\n§Y$UNB_LIBERTY_NAME$§!:\n§LРівень§!: §Y3§!\n§RАтака§!: §Y2§!\n§GОборона§!: §Y1§!\n§PПланування§!: §Y2§!\n§MЛогістика§!: §Y3§!\n§gРиси§!: §tХаризматичний§!, §tМаневрений§!, §tНатхненник§!\n\n§Y$UNB_JUSTICE_NAME$§!:\n§LРівень§!: §Y3§!\n§RАтака§!: §Y3§!\n§GОборона§!: §Y1§!\n§PПланування§!: §Y3§!\n§MЛогістика§!: §Y1§!\n§gРиси§!: §tПроникливий§!, §tСтійкий§!, §tНатхненник§!\n\n"

unb_reactive_the_steel_legions:0 "Активувати Сталеві Легіони"
unb_reactive_the_steel_legions_desc:0 "У регінському комплексі МАНІФЕСТ є сотні, якщо не тисячі, роботів, які просто деактивовані, а не знищені чи розібрані. Тепер, коли наші зломщики розібралися з системами об’єкта, схоже, ми нарешті знаємо, як їх увімкнути — і, ще краще, як змусити їх битися на нашому боці."
unb_reactive_the_steel_legions_tt:0 "Три §YРОБО-КОРПУСИ МАНІФЕСТ§! приєднаються до нашої армії.\n"

unb_grasp_the_skies:0 "Сягнути Неба"
unb_grasp_the_skies_desc:0 "Небо завжди було в межах досяжності. Але тепер настав час справді злетіти."

unb_the_gurkhan_of_alberta:0 "Гурхан Альберти"
unb_the_gurkhan_of_alberta_desc:0 ""
unb_unlock_horse_master_tt:0 "Перемога над §Y[STA.GetNameDef]§! відкриє рису §gМайстер Коней§!. Якщо ми вже перемогли, цей фокус відкриє її автоматично."

unb_the_heir_to_the_throne:0 "Спадкоємець Трону"
unb_the_heir_to_the_throne_desc:0 ""
unb_unlock_emperor_tt:0 "Перемога над §Y[BRA.GetNameDef]§! відкриє рису §gІмператор Манітоби§!. Якщо ми вже перемогли, цей фокус відкриє її автоматично."

unb_the_scourge_of_the_chapter:0 "Покарання Розділу"
unb_the_scourge_of_the_chapter_desc:0 ""
unb_unlock_king_tt:0 "Перемога над §Y[MNC.GetNameDef]§! відкриє рису §gКороль Злодіїв§!. Якщо ми вже перемогли, цей фокус відкриє її автоматично."

unb_a_titan_amongst_mortals:0 "Титан Серед Смертних"
unb_a_titan_amongst_mortals_desc:0 "Ніхто нам більше не загрожує. Кроу — справді найвеличніший."
unb_defeat_middlemark_tt:0 "Перемога над §Y[MDM.GetNameDef]§! відкриє фінальну подію."

unb_set_a_common_goal:0 "Встановити Спільну Мету"
unb_set_a_common_goal_desc:0 "Незв’язані — непокірний натовп, і більшість рейдерів хочуть просто робити, що заманеться, грабувати кого хочуть і коли хочуть. Але насправді об’єднати купку жадібних покидьків доволі просто — якщо вистачить здобичі на всіх."

unb_the_pathologically_high_spirited:0 "Патологічно Веселі"
unb_the_pathologically_high_spirited_desc:0 "Пустка — сумне місце, але тільки якщо дозволити їй бути такою. Просто кидайся вперед і не думай — для найжорстокіших і найбезжальніших усе завжди якось складається."

unb_gifted_criminals:0 "Обдаровані Злочинці"
unb_gifted_criminals_desc:0 "Рейдерів Незв’язаних єднає жага до свободи й багатства — і немає кращого бійця за свою свободу й здобич, ніж рейдер. Поселенці воюють за дім чи націю, племена — за традиції, а ми — за себе. То хто, скажи, битиметься завзятіше?"

unb_the_aldermen_spirit:0 "Дух Олдерменів"
unb_the_aldermen_spirit_desc:0 "Навіть банда волелюбних рейдерів потребує когось, хто скаже, де найкраще грабувати. Наші олдермени — строката зграя «офіцерів», що «керують» нашими «військами» під час набігів. Краще координування = ефективніші рейди."

unb_a_home_for_scum_and_villainy:0 "Домівка для Покидьків"
unb_a_home_for_scum_and_villainy_desc:0 "Немає гіршої гноївки, ніж Тейкоф. Наша слава й любов до свободи приваблює тисячі рейдерів з усієї Пустки. Важко не пишатися тією зграєю виродків, яку ми зібрали."

unb_capacity_for_brutality:0 "Схильність до Жорстокості"
unb_capacity_for_brutality_desc:0 "Хтось із пригнічених поселенців може подумати, що банда слабо озброєних рейдерів — легка ціль. Але ця впевненість зникає, щойно бачиш на рейдерах найкращу броню. Олдермени вже так роблять — час і всім іншим брати приклад."

unb_lightning_raiders:0 "Блискавичні Рейдери"
unb_lightning_raiders_desc:0 "Наші рейдери — найкращі з найкращих, але навіть найкращих може взяти числом. А отому замість славної загибелі — краще просто втекти. Швидко влітаємо, швидко грабуємо, швидко зникаємо. А з транспортом — ще швидше."

unb_marauding_strategies:0 "Тактика Грабіжників"
unb_marauding_strategies_desc:0 "З часом Пустка стає меншою. Не буквально, дурнику — але в тому сенсі, що все стає більш організованим. А це ускладнює рейди. Тож і нам доведеться організовуватись. Замкнене коло, як воно є."

unb_getting_our_boys_rocket_launchers:0 "Видати Нашим Хлопцям Ракети"
unb_getting_our_boys_rocket_launchers_desc:0 "На жаль, деякі поселенці використовують транспорт, роботів чи навіть силову броню. З ними важче, не збрешу. Але ще не було проблеми, яку не можна було вирішити ракетним градом."

unb_ex_Нігіло:0 "Ex Нігіло"
unb_ex_Нігіло_desc:0 "Поширювати нігілізм серед наших рейдерів може здатися не найкращою ідеєю, але якщо вони зможуть пережити весь негатив — вони зрозуміють: сенсу не боротися до самого кінця немає. Бо який взагалі сенс у житті, якщо не насолоджуватись ним — і що може бути кращим за перестріляти якомога більше людей перед смертю?"

unb_welcome_the_fallen_paladin:0 "Прийняти Падшого Паладина"
unb_welcome_the_fallen_paladin_desc:0 "До нас прибув паладин із Гілки Братства Сталі в Монтані. Але не для того, щоби вбивати нас, як би хто подумав — а щоби приєднатись! Адже немає кращого життя, ніж життя заради себе й боротьби за власне виживання. І ще краще — цей Паладин Продітор привів із собою десятки братів, які думають так само!"
unb_recruit_the_fallen_paladin_tt:0 "§Y$UNB_FALLEN_PALADIN_NAME$§! стане польовим командиром.\n§LРівень§!: §Y2§!\n§RАтака§!: §Y3§!\n§GОборона§!: §Y1§!\n§PПланування§!: §Y2§!\n§MЛогістика§!: §Y2§!\n§gРиси§!: §tСильний§!, §tМаневрений§!, §tПоїзд Болю§!\n\n§Y$UNB_FALLEN_PALADIN_NAME$§! також приведе підрозділ колишніх бійців Братства Сталі в силовій броні.\n"

unb_bringing_the_gang_back_together:0 "Зібрати Банду Знову"
unb_bringing_the_gang_back_together_desc:0 "Наші хлопці розбрелись по Пустці в пошуках багатства й сили, але час покликати їх назад. Немає такої здобичі, яку не можна забрати гуртом — особливо, якщо це гурт однодумних покидьків."

unb_brutally_cunning:0 "Жорстоко Хитрі"
unb_brutally_cunning_desc:0 "Найкращий спосіб забезпечити успіх рейду — дати керувати тому, хто має клепку. Більшість рейдерів — дурні, але тим, хто справді тямить, слід дати належну повагу й командування."

unb_make_due:0 "Викрутитись Як Можна"
unb_make_due_desc:0 "По Пустці розкидано безліч старої техніки, якщо знаєш, де шукати. Наші «найкращі й найрозумніші» — не найрозумніші, та трохи рейдерської кмітливості здатне склеїти будь-який мотлох."

unb_explosive_expertise:0 "Експерти По Вибухівці"
unb_explosive_expertise_desc:0 "Виявляється, експертів по вибухівці досить багато! І зрозуміло чому — рейдери просто обожнюють дивитися, як все вибухає."

unb_new_toys:0 "Нові Іграшки"
unb_new_toys_desc:0 "Хоч багато наших хлопців не найгостріші ложки в шухляді, дехто має талант до створення всілякої шаленої та смертоносної зброї — особливо коли йдеться про вибухи. Більшість їхніх іграшок розвалюється після одного використання (якщо взагалі доживає до нього), але ми можемо брати ті, що вижили, й вчитися. Більше вибухів для всіх!"

unb_you_cant_spell_laughter_without_slaughter:0 "Без «різанини» Немає «веселощів»"
unb_you_cant_spell_laughter_without_slaughter_desc:0 "Рейдери просто обожнюють вигадувати найсмішніші й найжорстокіші способи вбивати людей. Є щось захопливе в тому, як вони випробовують нову зброю на нещасних мешканцях Пустки."

unb_violence_is_the_answer:0 "Насильство — Це Відповідь"
unb_violence_is_the_answer_desc:0 "Немає нічого приємнішого, ніж підбігти й врізати комусь чимось гострим. З часом ці штуки стають ще гострішими, а битися — ще веселіше. Який чудовий світ!"

unb_energy_siphon_trick:0 "Фокус з Крадіжкою Палива"
unb_energy_siphon_trick_desc:0 "\"Гей, дивіться! Красти їхнє паливо насправді дуже просто!\""

unb_on_track:0 "На Рейках"
unb_on_track_desc:0 "Великі штуки, загалом кажучи, важче зламати. Один рейдер якось сказав, що великі машини важко зламати — особливо якщо вони в броні. Інший (розумніший) додав: «Це ж танк, дурню. Вони вже є. Ми просто не маємо їх достатньо.»"

unb_a_true_kleptocracy:0 "Справжня Клептократія"
unb_a_true_kleptocracy_desc:0 "Клептоманія — рушій суспільства. Всі ці поселенці в костюмах плетуть про якісь абстрактні штуки — закон, рівність... А ми знаємо: вони, як і ми, хочуть влади й бабла. Усі уряди — клептократії. Просто ми єдині, хто це визнає."

unb_tools_of_procurement:0 "Засоби Привласнення"
unb_tools_of_procurement_desc:0 "У клептократії — чим більше барахла, тим краще! Іноді це барахло ламається, не працює чи просто не коштує стільки, скільки має. Рішення просте: змусити когось полагодити. І вуаля — цінність відновлено."

unb_set_harsh_quotas:0 "Установити Жорсткі Норми"
unb_set_harsh_quotas_desc:0 "Більше! Нам треба більше всього! Речі роблять людину, а Кроу має стати найважливішим із людей. Просто змусимо покидьків працювати сильніше — й караємо тих, хто не старається."

unb_blackmarket_deals:0 "Угоди на Чорному Ринку"
unb_blackmarket_deals_desc:0 "Ідея чорного ринку здається дивною для більшості Незв’язаних: чому це все не продається всюди? Але існують місця, де виготовляють речі, які ми не можемо зробити самі — і саме там процвітають чорні ринки. І хоча у нас дозволено майже все, встановивши контакти з іншими регіонами, ми зможемо дозволити ще більше."

unb_mandate_double_shifts:0 "Наказати Подвійні Зміни"
unb_mandate_double_shifts_desc:0 "Більше, більше, БІЛЬШЕ! Швидше, ледарі, у вас буде вдвічі більше роботи, а економіка «просочування» все вирішить сама! Звісно, Кроу й не думає дозволяти чомусь просочитися повз свої руки..."

unb_give_them_false_hope:0 "Дати Їм Фальшиву Надію"
unb_give_them_false_hope_desc:0 "«Підвищуючи» робітників з фабрик до цивілізованого життя, ми можемо надихнути інших. Звісно, вони не знають, що ми просто перекидаємо їх між фабриками. Це, мабуть, проблема... але ніщо, чого не вирішить сила і жадібність."

unb_honor_among_thieves:0 "Честь Серед Злодіїв"
unb_honor_among_thieves_desc:0 "Пустка — суворе місце, а спокуса поживитися — велика. Але ми повинні триматися купи. Кожен член нашої зграї має значення, і кожен повинен відчувати цінність. Це зробить їх завзятішими у бою."

unb_reward_capable_craftsmen:0 "Нагородити Майстерних Ремісників"
unb_reward_capable_craftsmen_desc:0 "Наші ремісники не мають слави чи блиску в очах рейдерів, але їхня праця — основа нашого існування. Саме їхня зброя, броня та інше спорядження дозволяє нам виживати. Ми повинні цінувати їхню довіру й вміння."

unb_work_towards_sustainability:0 "Прагнути Сталості"
unb_work_towards_sustainability_desc:0 "Брати все, що можна — легко. Але в сільському господарстві це шкодить ґрунтам. Наші фермери кажуть, що постійне вирощування лише прибуткових культур виснажує землю. Уміння думати наперед — рідкість серед рейдерів, але, може, нам варто спробувати."

unb_adopt_construction_methods:0 "Прийняти Будівельні Методи"
unb_adopt_construction_methods_desc:0 "Більшість рейдерів не можуть збудувати й халабуду, не те що житло. Але осілі громади розробили ефективні методи. Нічого складного — просто скопіюймо їх."

unb_improving_their_lives:0 "Покращити Їм Життя"
unb_improving_their_lives_desc:0 "Наші зусилля дають плоди! Люди тепер живуть у (відносно) зручних оселях, їжа хоч і не рясна — але її достатньо, щоб не голодувати. Вони щасливі, а отже, нам легше керувати."

unb_dig_a_new_channel:0 "Викопати Новий Канал"
unb_dig_a_new_channel_desc:0 "Копання — нудне діло, навіть у небезпечній пустці. Але зрошувальні канали зроблять воду доступнішою, що покращить життя і підвищить ефективність сільського господарства."

unb_stolen_technology:0 "Викрадена Технологія"
unb_stolen_technology_desc:0 "Рейдери не відомі своєю інноваційністю — принаймні в мирному житті. Але ми не можемо залишатися позаду. Рішення просте: крадіжка — те, що ми вміємо найкраще."

unb_accept_savages_into_our_ranks:0 "Прийняти Дикарів до Нас"
unb_accept_savages_into_our_ranks_desc:0 "Племена є всюди, й часто вони не менш жорстокі, ніж рейдери. Це робить їх ідеальними новобранцями. А ще — вони мають глибоке розуміння пустки, якого нам не вистачає."

unb_raiders_in_the_sky:0 "Повернуся Додому, Коли Навчуся Літати"
unb_raiders_in_the_sky_desc:0 "Кроу одного разу бачив, як діють Повелителі Бурі — скажені рейдери, що літали небом. Відтоді він одержимий польотами. І тепер, схоже, ми нарешті можемо зібрати щось більше за планер: скоро справжні літаки піднімуться в небо — і пустка тремтітиме."

unb_historian_refugees:0 "Біженці-Історики"
unb_historian_refugees_desc:0 "Історики — дивна група. Вони одержимі минулим, але не хворіють на «старосвітню ностальгію», як Братство чи Енклейв. Їхній занепад привів до втечі багатьох з них — і вони прибули до нас. Ці мудреці принесуть нам багато корисного знання."

unb_a_mysterious_flower:0 "Загадкова Квітка"
unb_a_mysterious_flower_desc:0 "Під час розширення нашої аграрної мережі один надто допитливий фермер натрапив на квітку, яку не зміг упізнати — ні за власним досвідом, ні за жодною книгою. На жаль, вона його з’їла. Тепер, після ще кількох сотень загиблих фермерів, ми вважаємо, що змогли частково приборкати ці рослини. Принаймні настільки, щоб скеровувати їх на наших ворогів."

unb_a_society_of_warriors_and_scholars:0 "Спільнота Воїнів і Вчених"
unb_a_society_of_warriors_and_scholars_desc:0 "Інші народи пустки здивовані, побачивши, як змінилося суспільство Незв’язаних: неочікувано зросла повага до знань і до цінності громадянина. Звісно, ми досі жорстоке й войовниче плем’я, але таке, в якому науковці та солдати можуть співіснувати."

unb_event_trigger_tt:0 "Цей фокус буде §Yзавершено подією§!"