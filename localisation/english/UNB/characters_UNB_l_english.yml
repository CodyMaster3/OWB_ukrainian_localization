l_english:
UNB_CRAW_NAME:0 "Кроу Спустошувач"
UNB_COUNT_CRAW_NAME:0 "Граф Кроу"
UNB_CRAW_DESC:0 "Навіть рейдер може мріяти про щось велике й чисте, і мрії Кроу зовсім не малі. Окрім своїх амбітних надій перетворити Незв’язаних на клан рейдерів, що вселяє страх по всьому Великому Щиту, Кроу мріє піднятися в небо. Натхненний вершниками бурі та їхніми дарами, Спустошувач сподівається одного дня злетіти, як і вони — з бандою чи без. Йому байдуже, хто має померти заради здійснення його мрій."

UNB_MARRO_NAME:0 "Старий Марро"
UNB_MARRO_DESC:0 "Не багато рейдерів можуть похвалитися, що прожили більше сорока років, але Марро вже ближче до вісімдесяти. Все ще сповнений сил і люті, він усе ж починає здавати з віком. Недовго залишилось до його остаточного відходу, коли він передасть справу грабунку й набігів молодшим товаришам. Його відхід стане кінцем цілої епохи."

