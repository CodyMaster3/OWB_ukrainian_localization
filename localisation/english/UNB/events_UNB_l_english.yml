l_english:
nf_unb.1.t:0 "Щоденник Кроу, Сторінка 1"
nf_unb.1.d:0 "ЯКЩО ТИ ЦЕ ЧИТАЄШ – Я ТЕБЕ ВБ’Ю. \n\nМамця завжди казала, що з мене має щось вийти, бо я, бачте, «розумний». Дратувала – тож я її й прибив. Але от уже якийсь час думаю про це. Ким, до біса, я стану? Безіменним дезертиром, що приєднався до банди рейдерів? Та пішло воно. У мене є мрії, прагнення й усе таке. Ці хлопці, з якими я зараз – вони мене розуміють. Ми на одній хвилі. Солдатом я лише марнував життя, воюючи за лайно, на яке мені начхати. А тут ми робимо, що заманеться. Живемо на повну. Насправді, ми вже плануємо покинути цю діру під назвою Манітоба – вожак має план. Постійно торочить, що вирушимо на захід, у якесь гімно на ім’я Міссула – повне кришок і слабаків. Пограбуємо їх до чортової матері, вже не можу дочекатись. І тоді жоден виродок не посміє назвати мене дезертиром чи боягузом. Особливо коли я буду на самому вершку! Цікаво, чого я з усього цього навчуся..."
nf_unb.1.a:0 "Як робити штуки круто!"
nf_unb.1.b:0 "Як красти найкраще!"

nf_unb.2.t:0 "Щоденник Кроу, Сторінка 30"
nf_unb.2.d:0 "Краса... Я... я побачив справжню красу. Славу. Подив. Найдивовижніший дар якогось бога – не знаю, існує він чи ні. Справжня сила відкрилась мені. Справжній геній винахідливості, що може піднести мене до чогось більшого, могутнішого, ніж я коли-небудь сподівався: небо й сила, що панує над полем бою згори.\n\nКоли мою банду розгромили ті, кого, здається, звали Громогонцями – принаймні саме це верещав місцевий, коли його роздирали на шматки – я прозрів. Це – моя доля. Я піднімуся в небо, і пошлю страх на голови тих, кого сам оберу.\n\nЯ повертаюся до Манітоби. Та банда вже мертва, й мені набридло грати роль гарматного м’яса. Є старі приятелі, які радо приєднаються до нової зграї – почну з того, що розповім їм про Громогонців..."
nf_unb.2.a:0 "Муки"
nf_unb.2.b:0 "Брутальна винахідливість"

nf_unb.3.t:0 "Щоденник Кроу, Сторінка 168"
nf_unb.3.d:0 "Отже, Щоденнику, я вже деякий час як удома. Зібрав кількох старих рейдерів, ще з тих часів, коли всі цим займались серйозно; дехто з них навіть був у великих бандах! Звісно, діти загиблих також захотіли приєднатися – тепер у нас ціле кляте щасливе рейдерське сімейство… плем’я, навіть! І я навіть не хочу їх убити, коли вони мене бісить! Бо вони знають, хто тут головний!\n\nДонедавна все йшло добре. Знайшли якихось типів, що звали себе революціонерами в [UNB.Capital.GetName], побили їм пики й вирішили – гарна буде нам база. Навіть уніформу надибали, тож подумали: час стати професіоналами. Але тоді місцеві почали приносити нам всяке! Виходить, нас найняло королівство як найманців!\n\nПоки не повернулись ті самі революціонери й не почали нам шкодити. От сучі діти.\n\nДоки що ми використовуємо людей, яких приєднали до нашої банди, для..."
nf_unb.3.a:0 "Виготовлення зброї!"
nf_unb.3.b:0 "Работоргівлі!"

nf_unb.4.t:0 "Щоденник Кроу: Прощавай, До Марро!"
nf_unb.4.d:0 "Єдине, на що я точно можу розраховувати від своїх хлопців – це на вірність. Якщо я кажу «стрибай» – їм не треба питати, наскільки високо, вони вже знають. Я їм цього не скажу, але іноді це майже доводить мене до сліз. Саме тому сьогоднішній день для мене трохи важкий. Марро йде на спочинок. Кумедна думка, так? Рейдер на пенсії. Але в нього голова на плечах, і кожен з нас може підтвердити, що він не раз рятував нам дупи. Завтра він піде. Але сьогодні – влаштуємо йому найкращу чортову вечірку на всьому півночі. Він цього заслужив."
nf_unb.4.a:0 "Бувай, Марро!"
unb_marro_retires_tt:0 "Старий пройдисвіт Марро нарешті йде на спокій. Сподіваємось, на такий самий мирний, як він і хотів."

nf_unb.5.t:0 "Дивні... Ні, Дурні Сигнали"
nf_unb.5.d:0 "Радіочастоти у Великому Щиті останні кілька днів були повністю заблоковані через жахливий шум, що лунає з кожного каналу. Дійшло до того, що ці звуки передаються навіть через виделки й пружини ліжок, наче вони теж ловлять сигнал. Жоден інженер ще не бачив нічого подібного. Чи то саботаж, чи халатність – поки не ясно. Але ясно одне: справи кепські."
nf_unb.5.a:0 "ПЗЗЗАААччч..."

nf_unb.6.t:0 "Щоденник Кроу: Підступний План"
nf_unb.6.d:0 "Нальоти на багаті хатинки Мусджо проходять успішно, хоч і не такі вони вже багаті, як ми думали – ці миролюбні сцикуни мають непогано що вкрасти. \n\nДля цього ми використовуємо гульню з Форт-Пека, виманюючи її від того Габби, того дурного добряка. Хоч таблички він і справді гарні робить. \n\nДобре, що я кмітливий, і вмію зробити так, щоб усе виглядало так, ніби це гулі винні в цій херні."
nf_unb.6.a:0 "Тупі мусджовці"

nf_unb.7.t:0 "Проблема з Гулями"
nf_unb.7.d:0 "Ферали завжди були шкідниками, але не становили проблеми для Мусджо – до сьогодні. Місцеві виявили залишки маленького містечка, всіяного тілами гуль і людей. Обидві сторони були розірвані на шматки без жодної поваги до мертвих – явна ознака феральних гулів. Раніше гулі тримались осторонь, можливо через холод, але якщо ця битва про щось і свідчить, то про те, що це змінюється. Поселенцям доведеться зробити все можливе, щоб відігнати їх від своїх кордонів – силою, якщо буде потрібно."
nf_unb.7.a:0 "Прощавай, Габба-гуль!"
nf_unb.7.b:0 "Зачекайте... Це підстава!"

nf_unb.8.t:0 "Вугільна Торгівля Консорціуму"
nf_unb.8.d:0 "Останнім часом на наші шахти дедалі частіше нападають. Може, бандити вже зрозуміли, що наші охоронці з гнилими легенями не зможуть їх наздогнати. Банда Незв’язаних надіслала пропозицію, щоб зняти з нас цей тягар. Усього-то їм потрібен відсоток від вугілля й зарплата – й ми отримаємо їхній захист. Вони, звісно, не найприємніші типи, але можуть дати нашим працівникам відчуття безпеки."
nf_unb.8.a:0 "А тепер – до праці!"
unb_a_heart_of_coal_event_tt:0 "Чотири §Y[UNB.GetNameWithFlag] наглядачі§!, надіслані Кроу вверх по річці Міссурі, прибули поблизу Банку в обмін на частину наших припасів.\n"

nf_unb.9.t:0 "Послання від… Незв’язаних"
nf_unb.9.d:0 "Сьогодні ми отримали сигнал на одному зі старих терміналів – мовляв, якщо ми перекажемо сто тисяч кришок цим виродкам на півдні, вони обіцяють не нападати на нас. Пакт про ненапад. Емі й я обидва вважаємо це жалюгідним – вчинок або ідіота, або боягуза, та ще й з великою жадібністю. Але загроза виглядає цілком реальною.\n\nО... і ще вони сказали, що їм подобаються наші «конячки». Дуже дотепно."
nf_unb.9.a:0 "Мені теж коні подобаються."
nf_unb.9.b:0 "Купка нікчем"

nf_unb.10.t:0 "Щоденник Кроу: Новий форт для Короля Кроу!!!"
nf_unb.10.d:0 "Форт Пек. Яка ж тупа, срана назва. Перебив усіх, хто став на моєму шляху – і все, про що думаю, це це грьобане ім’я. Пек… Пек-Пек-Пекіті-Пек… Тупориле. Мене аж трясе, й сам не знаю чому…\n\nПостійно повертаюсь до цієї сраної сторінки. Чого воно мене так бісить? Це ж не кінець світу, якщо форт зветься Пек, еге ж?\n\nЙОПТВОЮМАТЬ ХТО ВЗАГАЛІ ВИГАДАВ ЦЮ СРАНУ ДУРНУ НАЗВУ. Я ЇЇ ЗМІНЮЮ. ЗМІНЮЮ НА ХРІН.\n\nСРААААААААААААААААААААНЬ!!!"
nf_unb.10.a:0 "Еммм… Кроутаун?"
nf_unb.10.b:0 "КЛЕПТОМАНІЯ!!!"

nf_unb.11.t:0 "Щоденник Кроу: Алгоритм Жаху"
nf_unb.11.d:0 "МИ СПІЙМАЛИ КРУТУ ШТУКУ. Риючись у старому форті, один із хлопців знайшов якусь зловісну голострічку. Називається «алгоритм жаху» – крутяк, еге ж? Ми вже з хлопцями накидали купу ідей, як його використати. Метіси останнім часом ведуть себе зверхньо – думаю, час дати їм прочухана. Ще там був якийсь звіт про науковий проект… Фенрір? Та пофіг, якщо допоможе натовкти тим задротам – я за."
nf_unb.11.a:0 "Це й хлопців порадує."

nf_unb.12.t:0 "Щоденник Кроу: Я НЕ БОТАН!"
nf_unb.12.d:0 "Окей, я розібрався з цим комп’ютерним лайном, витер те дивне медичне гівно з голограми. Але зберіг зіпсований файл – він жере дані. І мені це подобається. Прям дуже. Навіть якщо він зрештою зжере сам себе.\n\nТепер лишилось дізнатися, як завантажити його в їхні системи. Або хоча б в одну. Схоже, воно може стрибати між електронікою. Я з’їхав з глузду, якщо що.\n\nХмм, зброя чи логістика… що ж обрати?"
nf_unb.12.a:0 "Ага!"
nf_unb.12.b:0 "Еврика!"

nf_unb.13.t:0 "Наші Енергоблоки!"
nf_unb.13.d:0 "Електрики по всій країні прокинулись серед ночі від вибухів сотень енергоблоків, які спалахнули. Коли пожежі загасили, фабрики почали скрипіти, а їхні стіни тріскатись і ламатись. Джерело цього спустошення – голострічка, вставлена в старий, забутий термінал. Збитки не критичні, але знадобиться час, щоб усе полагодити."
nf_unb.13.a:0 "Ще той головняк"
unb_trust_in_sabotage_fuel_destroyed_tt:0 "§R[UNB.GetName] знищили половину наших енергоблоків!§!"

nf_unb.14.t:0 "Наші Машини!"
nf_unb.14.d:0 "Цього ранку і громадяни, і чиновники прокинулись – а всі заводські конвеєри й логістичні радіостанції поламані. Мотори чаділи, а блоки падали з висоти. Джерело шкоди – все та ж одна єдина голострічка в закинутому терміналі. Збитки не фатальні, але на відновлення підуть тижні."
nf_unb.14.a:0 "Ще той головняк"

nf_unb.15.t:0 "Щоденник Кроу, Сторінка 700: Час Заводити Новий!"
nf_unb.15.d:0 "Колись давно я писав у цьому щоденнику, що переживаю за своє майбутнє. Що в мене є мрії, прагнення, речі, до яких я хочу дорости. І тепер я радий сказати: я завжди був розумніший за своїх ворогів – аж до самого кінця.\n\nХоча більшість хлопців уже замінені ботами, чимало сидять на вершині разом зі мною – їдять вишукані страви й насолоджуються розкішшю. Добра нагорода для тих, хто побачив у мені долю до великого лайна. І ще краща – для тих, хто залишився вірним.\n\nВиявилось, мені навіть робити нічого не треба! Я перепрограмував Пенні, щоби вона була лояльна лише мені; вона настільки добре справляється, що я навіть не думаю про це!\n\nВідтепер я дозволяю своїм хлопцям грабувати кого завгодно, де завгодно й коли завгодно. Що це значить – сам не знаю! Головне – щоб залишались лояльними, не псували мені справ і я міг далі клепати ботів. Під прапором Незв’язаних кожен може робити, що йому заманеться. Я справді створив найсильніше плем’я – гідне змагатись із Громогонцями. А ще ми навіть можемо літати! Блін, сторінка закінчується, тож скажу просто: прощавай, щоденнику, і..."
nf_unb.15.a:0 "Боже, як же я люблю роботів"

nf_unb.16.t:0 "Неочікуваний Посланець"
nf_unb.16.d:0 "Сьогодні зранку перед воротами королівського палацу сталась незвична подія. Знедолений чоловік у старих латах, що назвався представником Незв’язаних – південної банди рейдерів – спробував прорватися на територію палацу. Вартові, зрозуміло, швидко прогнали його. Але згадка про Незв’язаних привернула увагу королівських радників, що стояли поруч.\n\nЗ огляду на загострення між Королівством і його колишніми землями, усі думали лише про майбутню війну. Пропозиція чоловіка, натхненна колишнім дипломатичним успіхом Ґанна I серед воєначальників Манітоби, полягала в тому, що Незв’язаних можна було б переконати виступити на боці Манітоби проти Метісів і Республіки Трьох Річок.\n\nУ королівській залі ця пропозиція викликала палкі суперечки. Хтось був категорично проти, мовляв – союзи з рейдерами заплямують репутацію. Інші ж побачили в цьому можливість здобути сильних союзників у прийдешньому конфлікті."
nf_unb.16.a:0 "Цікава ідея..."
nf_unb.16.b:0 "...але ми відмовимось"
unb_peace_deal_with_bra_tt:0 "Прийняття цієї угоди викличе мирну подію після поразки §Y[MTC.GetNameDef]§!, унаслідок якої частина західних земель перейде до §Y[UNB.GetNameWithFlag]§!."

nf_unb.17.t:0 "Манітоба Прийняла"
nf_unb.17.d:0 "ХАХА ВОНИ ПРИЙНЯЛИ!!!! ОТ ІДІОТИ!!!!\n\nЧАС ВТОПИТИ ВСЕ В СРАНІ!\n\nЧув, що в Брендоні гарна погода цієї пори року… може навідатись?"
nf_unb.17.a:0 "Вони точно зроблять мене королем!"

nf_unb.18.t:0 "Манітоба... Відмовила"
nf_unb.18.d:0 "Вони… Відмовили? Хтось, мабуть, пробалакався. Мені це, м’яко кажучи, не до вподоби, але гаразд. Вони ж не справжня знать!\n\nПоселенців ми й самі зламаємо, не вперше."
nf_unb.18.a:0 "І все ж – от лайно"

nf_unb.19.t:0 "Нам Плюнули в Обличчя"
nf_unb.19.d:0 "Нашого посланця висміяли просто в залі. Їхній новий головний-королик чи хто там, [DLN.GetLeader], має палицю в дупі – звинуватив нас у тому, що ми звичайні рейдери з замашками.\n\nНу, ми ними і є… але все одно."
nf_unb.19.a:0 "Якось грубувато"

nf_unb.20.t:0 "Кінокради в Зграї"
nf_unb.20.d:0 "Група на нашій території вирішила продати частину наших коней банді рейдерів. За коней вони виручили чималу кількість кришок, які ми згодом у них конфіскували. Хоч повернути коней уже не вийде, можливо, варто використати ці гроші, щоби купити дещо корисне."
nf_unb.20.a:0 "Може, нові підкови?"

nf_unb.21.t:0 "Щоденник Кроу: Перехрестя – ЦЕ СРАНЬ!"
nf_unb.21.d:0 "Пустка – дивне й лайняне місце, тут не посперечаєшся. Але коли ти живеш так довго, як я, і натворив стільки ж – думаєш, що вже все бачив. Та не тут-то було!!!\n\nСьогодні ми з хлопцями натрапили на якихось здоровезних сраних роботів на колесах. Вони сказали йти за ними – ми пішли. Привели до якоїсь робот-жінки на екрані, на ім’я Пенні, яка намагалась… продати нам фігурки!!! Це жарт? Я вже збирався зрівняти це місце з землею, але тоді перекинувся словом із місцевими качками. Себе вони звуть Міскантами. Рейдери, які носять меблі як броню. А їхній ватажок мав телевізор замість голови. І тоді я подумав..."
nf_unb.21.a:0 "Вам потрібні друзі"
nf_unb.21.b:0 "Я ТОЧНО СПАЛЮ ЦЕ МІСЦЕ"