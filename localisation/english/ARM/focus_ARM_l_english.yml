l_english:
arm_lessons_of_tlaloc: "Уроки Тлалока"
arm_lessons_of_tlaloc_desc: "Тлалок запрограмував Санта Анну охороняти Техас від армії Аттіса. Створюючи особистість, як Він міг не обрати останнього мексиканця, що був одержимий цим штатом і ладен був на все заради нього?"

arm_santa_anna_arrives_in_ciudad_victoria: "Прибуття Санта Анни до Сьюдад-Вікторії"
arm_santa_anna_arrives_in_ciudad_victoria_desc: "Першою місією Санта Анни було звільнення невеличкого рейдерського міста Сьюдад-Вікторія, щоби побачити, як ШІ поводитиметься, отримавши шанс 'ударити' самостійно. Звісно, за благословенням Тлалока у вигляді сталевої легії."

arm_the_conquest_of_tampico: "Завоювання Тампіко"
arm_the_conquest_of_tampico_desc: "Тампіко був окупований так званими 'революціонерами'. Бандитами під іншою назвою. Як Генерал діяв – як тактично, так і стратегічно – аби визволити місто, задало прецедент."

arm_the_fist_of_the_cauliddo: "Кулак каудильйо"
arm_the_fist_of_the_cauliddo_desc: "Генерал завжди прагнув використовувати свою армію для захисту народу Мексики. На жаль, іноді люди не розуміли, що цей захист їм потрібен."

arm_superior_mechanization: "Перевага механізації"
arm_superior_mechanization_desc: "Сили Санта Анни не використовували жалюгідні проєкти Rob-Co, а відображали інженерну філософію Petro Chico™."

arm_la_pesca_land_acquisition: "Земельна експансія в Ла-Песці"
arm_la_pesca_land_acquisition_desc: "Іноді армія мусить розвивати країну для свого народу."

arm_reynosa_dockyard_renovations: "Реновація доків у Рейносі"
arm_reynosa_dockyard_renovations_desc: "Хоча Рейноса й слугувала домом для рибалок і торговців, вона вже не є тим великим портом, яким була до війни. Настав час це виправити."

arm_ciudad_victoria_land_acquisition: "Земельна експансія в Сьюдад-Вікторії"
arm_ciudad_victoria_land_acquisition_desc: "Народ Сьюдад-Вікторії має присвятити себе війні з Техасом. Як вони можуть марнувати час у бездіяльності, коли мету слід досягти за будь-яку ціну?"

arm_tampico_land_acquisition: "Земельна експансія в Тампіко"
arm_tampico_land_acquisition_desc: "Жителі Тампіко можуть приступити до нових призначень."

arm_tampico_airport_renovations: "Реновація аеропорту в Тампіко"
arm_tampico_airport_renovations_desc: "Цей аеропорт стане чудовим логістичним вузлом для нашого визволення Техасу!"

arm_ciudad_valles_land_acquisition: "Ремельна експансія в Сьюдад-Вальєсі"
arm_ciudad_valles_land_acquisition_desc: "Ще один день – ще одна громада, втягнута у Славний Хрестовий похід."

arm_mandatory_service: "Обов’язкова служба"
arm_mandatory_service_desc: "Санта Анна розглядав ідею, що служба дає громадянство, але згадав, що Конституція вже гарантує громадянство кожному. А отже – громадянство зобов’язує до служби!"

arm_railway_reconstruction: "Відбудова залізниці"
arm_railway_reconstruction_desc: "Народ Мексики буде поєднано залізницями, мов надійною кліткою довкола їхніх домівок. Хвилинку..."

arm_robco_factory_reactivation: "Відновлення заводу Rob-Co"
arm_robco_factory_reactivation_desc: "Деякі довоєнні заводи Rob-Co все ще придатні до роботи, але Тлалок законсервував їх через 'недостатній споживчий попит'. Час відновити виробництво!"

arm_robco_factory_reactivation_tt: "Ми успішно реактивуємо ще один завод у §YРейносі§! кожні §G120§! днів упродовж наступного року, створивши ще §G3§! §Yзбройові майстерні§!.\n"

arm_mechanical_computing: "механічні обчислення"
arm_mechanical_computing_desc: "Ймовірність, що людина зробить такий постріл, – 99 до 1! Але роботи Санта Анни можуть легко розрахувати траєкторію кулі."

arm_gai_plant_reactivation: "відновлення заводу General Atomics"
arm_gai_plant_reactivation_desc: "Компанія General Atomics також мала заводи в довоєнній Мексиці. Ми можемо відновити деякі з них."

arm_robco_factory_rearmament: "перевозброєння заводу Rob-Co"
arm_robco_factory_rearmament_desc: "Ці заводи створені не лише для виготовлення Mr. Handy. Як і більшість американської інфраструктури в Мексиці, їх можна спрямувати на війну."

arm_superior_subroutines: "досконалі підпрограми"
arm_superior_subroutines_desc: "Росадо може вважати себе генієм, але Санта Анна мав двісті років, аби вдосконалити своїх… ем, людей. Армію Мексики не зупинити!"

arm_gai_plant_rearmament: "перевозброєння заводу General Atomics"
arm_gai_plant_rearmament_desc: "Хтось може замислитись, навіщо General Atomics вмонтовувала в Mr. Handies вогнемети. Але не Генерал."

arm_advanced_standardization: "людина і машина"
arm_advanced_standardization_desc: "Зі здобуттям секретів Станції Армагеддон я можу активувати її стратегічні обчислювачі й тактичні банки даних. Це дозволить мені отримати доступ до довоєнних технологій. Мої роботи не матимуть рівних – і ми рушимо на Техас!"

arm_the_equation_of_war: "рівняння війни"
arm_the_equation_of_war_desc: "Санта Анна перетворив мистецтво війни на науку. Жоден пустельник не здатен повторити те, чого він навчився, вивчаючи чотириста років тактики."

arm_mechanical_triumph: "Механічна перемога"
arm_mechanical_triumph_desc: "Минулого разу Санта Анна зрозумів, чому плоть – це слабкість. Роботи значно приємніші."

arm_steel_legions: "Сталеві легіони"
arm_steel_legions_desc: "Той дурень на ім’я Цезар твердить, що очолює Легіон. Хай краще зустріне героїв Мексики: асолтрони, сеньйор-Ґатсі, айботи, а іноді й люди – усі працюватимуть разом задля захисту держави!"

arm_reopening_the_ciudad_victoria_armory: "Відкриття арсеналу Сьюдад-Вікторії"
arm_reopening_the_ciudad_victoria_armory_desc: "Сьюдад-Вікторія була домом для кількох підрозділів американської армії до війни. Тлалок тримав ті склади зачиненими, але настав час Санта Анні використати їх."

arm_mexican_regulars: "Мексиканські регулярні війська"
arm_mexican_regulars_desc: "Мексику збудували не машини, а її народ – потом власного чола. І саме цей піт урятує країну."

arm_human_strategy: "Людська стратегія"
arm_human_strategy_desc: "Роботи ніколи повністю не замінять людську винахідливість. Так, нам потрібно брати їжу у похід, але ж ми не потребуємо пального!"

arm_robco_design_alterations: "Модифікації дизайну Rob-Co"
arm_robco_design_alterations_desc: "Rob-Co із задоволенням випробовувала свою зброю на мешканцях Мексики. Та коли ми вторгнемось у Техас, все зміниться!"

arm_adaptable_demiai: "Адаптивний напів-ШІ"
arm_adaptable_demiai_desc: "Дехто називає останні збої 'багами', та насправді це – інновації. Так, роботи ламаються через інновації."

arm_reopening_the_la_pesca_armory: "Відкриття арсеналу Ла-Пески"
arm_reopening_the_la_pesca_armory_desc: "Чому так багато довоєнних американських арсеналів лишились недоторканими по всій Мексиці? Кого це хвилює – забираймо!"

arm_jungle_bonuses: "Переваги джунглів"
arm_jungle_bonuses_desc: "Інтегрувати племена з джунглів до наших військ було надзвичайно мудро. Вони не лише вправні у навігації крізь хащі – той факт, що вони годують солдатів сирими комахами, доводить їх до сказу, а отже – підвищує смертельність."

arm_equipment_requisitioning: "Реквізиція спорядження"
arm_equipment_requisitioning_desc: "Цим селам усе одно не були потрібні ті штурмові гвинтівки. Їм цілком згодяться труби, які ми залишили. А тепер, що ж таке «Ráfaga» означає?.."

arm_annas_innovations: "Інновації Анни"
arm_annas_innovations_desc: "Я вірю, що мої старі ядра все ще знають кілька трюків – і мої роботи теж мають їх знати! Може, додаткова обчислювальна потужність допоможе? А зайвий вогнемет точно не завадить."

arm_superior_designs: "Перевага конструкції"
arm_superior_designs_desc: "Бачите? Коли робот перегрівається – задня панель відпадає! Це для додаткового охолодження. Яке ж це інженерне диво довоєнних науковців!"

arm_reopening_the_reynosa_armory: "Відкриття арсеналу Рейноси"
arm_reopening_the_reynosa_armory_desc: "А ось і арсенал у Рейносі – найбільший та найкраще оснащений у всій моїй території. Було б так просто знайти в ньому склад з 'Толстяками'... Але гаразд, вистачить і мініганів."

arm_infantry_expansion: "Розширення піхоти"
arm_infantry_expansion_desc: "Не знаю чому, але крик змушує людей працювати краще. Відтепер кожен тренувальний робот матиме високопотужний голосовий модуль – певен, це допоможе!"

arm_war_council_expansion: "Розширення військової ради"
arm_war_council_expansion_desc: "Люди мають дивні ідеї, але вони часом працюють. Уже дехто з радників порадив використовувати 'укриття', тож я видав кожному піхотинцю по ковдрі."

arm_menace_of_mexico: "Загроза Мексики"
arm_menace_of_mexico_desc: "Ми створимо власний легіон і вдаримо по Цезарю! Хай приходить. І нехай прийдуть усі – за кожного вірного мексиканця, що впаде, десяток Ґатсі займе його місце!"

arm_master_of_mexico: "Володар Мексики"
arm_master_of_mexico_desc: "Дивовижно, як легко здобути відданість органіки. Відміни кілька наказів про реквізицію, встанови кілька водяних насосів – і listo!"

arm_northern_rivals: "Північні суперники"
arm_northern_rivals_desc: "Республіка Ріо-Ґранде – головна перешкода для мого плану об’єднання славетної мексиканської нації. Зв’язки з Техаським братством, провокації проти Легіону, зростаюча підтримка власного, викривленого націоналізму – з цим треба щось робити. Час розглянути варіанти..."

arm_open_minded_approach: "Відкрита позиція"
arm_open_minded_approach_tt: "§Y[FROM.GetName]§! гарантує §Y[RRG.GetName]§! і робить кроки до участі в їхньому славному хрестовому поході за об’єднання Мексики! Якщо ті погодяться."
arm_open_minded_approach_desc: "Батько вірив у північну демократію Ріо-Ґранде, тож хіба я не маю дати їм шанс? Президент Мора каже, що хоче об’єднати Мексику під одним прапором, однією системою – новою, славною демократією, що затьмарить міфи Старого Світу. Можливо, і для такого, як я, знайдеться місце в цій новій державі."

arm_hardline_approach: "Жорсткий підхід"
arm_hardline_approach_desc: "Як зарозумілість Старого Світу стала причиною його загибелі, так і демократія Нового прямує тим самим шляхом. Республіка Ріо-Ґранде не може отримати ключі від Станції Армагеддон, інакше вони знищать усе, над чим працювали я і Батько. Їхнє прагнення влади закінчується сьогодні."

arm_political_discourse: "Політична дискусія"
arm_political_discourse_desc: "Мрія Мори про об’єднану Мексику, що захищає права всіх своїх громадян, знаходить відгук серед мешканців територій Санта Анни. Можливо, і сам Санта Анна не байдужий до неї."

arm_necessary_precautions: "Необхідні запобіжні заходи"
arm_necessary_precautions_desc: "Мова не про те, що ми не довіряємо Ґлорії. Ми просто... насторожені."

arm_pressure_the_border: "Тиск на кордон"
arm_pressure_the_border_desc: "Я бачу це ясно, як день – у їхній поведінці, у словах, у політиці. Ріо не зупиниться ні перед чим, аби отримати ключі від Армагеддону й використати скарби Мексики, щоби підкорити її народ. Але я цього не допущу. Час прощупати їхню оборону і готуватись. Я стану на їхньому шляху, аж поки не видихну останнього подиху – хай будуть кляті наслідки."

arm_pressure_border_tt: "Відкриває можливість вести прикордонну війну з Ріо.\n"

arm_trade_negotiations: "Торгові перемовини"
arm_trade_negotiations_desc: "Подальші перемовини з демократичною республікою будуть вигідні для обох сторін, адже вони досі занепокоєні нашою угодою. Ми обміняємо ресурси для зміцнення союзу, і, можливо, колись зможемо об’єднатися у прагненні реформувати Мексику на велику державу, якою вона колись була."

arm_river_defenses: "Оборона на річці"
arm_river_defenses_desc: "Держава, озброєна до зубів, – це держава в мирі."

arm_underhanded_methods: "Підступні методи"
arm_underhanded_methods_desc: "Дивовижно, як легко підкупити окремих повстанців, аби ті зрадили своїх сусідів."

arm_tense_negotiations: "Напружені перемовини"
arm_tense_negotiations_desc: "Нікого більше не лишилось. Лише я. Самотній, без проводу, та перед найважчим вибором у житті. Мора хоче здобути останній ключ до Армагеддону, щоби разом відкрити станцію й розкрити її таємниці. Чи зможу я довіритись республіці, бути поруч з нею у цей історичний момент? Батьку, це ти мав на увазі, коли просив мене бути кращим? Що б не сталося – я зроблю тебе гордим."

arm_seizing_armageddon: "Захоплення Армагеддону"
arm_seizing_armageddon_desc: "Два ключі. Ріо вже має два ключі. І, наскільки мені відомо, вони могли здобути й третій. Вони думають, що невразливі, що можуть злетіти так близько до сонця, не помічаючи, як палають їхні крила. Я не можу дозволити їм отримати останній ключ. Я маю повернути контроль, будь-якою ціною. Батьку, прости, що знову несу війну на ці землі..."

arm_the_southern_threat: "Південна загроза"
arm_the_southern_threat_desc: "Слабкодухий давно б розібрався з майянами – їхні ритуали та варварство є наругою над цивілізацією. Але Тлалок був добрим, тому не діяв. Тлалок був щедрим, тому дарував їм надію, сподіваючись змінити їх. Та вони лишились такими ж: впертими, самовдоволеними, сліпими до Його доброти. Настав час, щоби гнів слабшого чоловіка покінчив з цими дикунами – раз і назавжди."

arm_southern_buffer_state: "Південна буферна держава"
arm_southern_buffer_state_desc: "Племена Petro Chico – не надто сильні, але вони сидять на цінних ресурсах і можуть слугувати щитом проти майянів. Ми маємо не дозволити їм бути розтрощеними тими варварами."

arm_menace_of_yucatan: "Загроза Юкатану"
arm_menace_of_yucatan_desc: "Тлалок ніколи не втрачав у вас віри. Жодної миті Він не вважав, що намагання навернути вас – марні. Він завжди дбав про своїх дітей. Саме це і згубило Його, вирвало з цього жорстокого світу, від мене. Але попри все – всі зусилля, спроби – ви все одно Його підвели. І все ж Він би вас пробачив. Але я – лише Його покірний син. І мені пробачати не потрібно."

arm_petro_chico_protection: "Захист Petro Chico"
arm_petro_chico_protection_desc: "Прості люди, які взяли собі ім’я батькової компанії, здебільшого мирні. Та зі зростанням сили майянів потрібно зробити вибір. Щоб ефективно захистити їх від Іци, я маю взяти їхні землі під свій контроль і виступити проти південної загрози. Монтесума, один з моїх братів, може допомогти в цій боротьбі. Та за допомогу доведеться дорого заплатити."

arm_coastal_preparations: "Підготовка узбережжя"
arm_coastal_preparations_desc: "Ми можемо укріпити мексиканське узбережжя до війни. Подивимось, як тепер майянський флот загрожуватиме нашим військам."

arm_shielding_the_coast: "Захист узбережжя"
arm_shielding_the_coast_desc: "Щоб зберегти панування на морі проти ацтекських дикунів, мені потрібен флот, здатний їм протистояти. Батьківщина багатьох моїх колишніх офіцерів погодилась стати базою для кампанії проти Чичен-Іци, і багато громадян охоче допомагають зміцнити наші сили. Саме ця єдність, це бажання боротися приведе до падіння тирана."

arm_petro_chico_tribute: "Данина Petro Chico"
arm_petro_chico_tribute_desc: "Нафтоочисний завод – серце Petro Chico – надто довго залишався покинутим. Його велетенські споруди й складні механізми стали святинями для племен, і хоч це й зрозуміло, на жаль, доведеться їх звідти прибрати. Хай вони знайдуть розраду в його повторному запуску, адже тепер, замість духовного проводу, він дарує Мексиці багатство й добробут."

arm_naval_awakening: "Морське пробудження"
arm_naval_awakening_desc: "Щоб захистити наш народ, ми маємо охопити всі сфери війни – від сухопутних битв до морських. Наразі наші морські спроможності... м’яко кажучи, жалюгідні. Перший крок – наздогнати сусідів у технологіях, і лише так ми зможемо захистити узбережжя Мексики."

arm_naval_requirements: "Морські потреби"
arm_naval_requirements_desc: "Маючи технологічну перевагу, тепер ми повинні виробляти достатньо спорядження, щоб змагатися з сусідами. Активні інвестиції в верфі, використовуючи економічну інфраструктуру порту Тампіко, допоможуть нам здобути морську могутність."

arm_coastal_militia_integration: "Інтеграція прибережного ополчення"
arm_coastal_militia_integration_desc: "На узбережжі діють численні ополчення, які мужньо захищають свої домівки від рейдерів Іци чи інших банд. Їхня відвага вражає, а навички моряків – бездоганні. Ми маємо запропонувати їм посади в нашому флоті. І коли вони дізнаються про мої плани щодо ацтекської загрози, сумнівів у їхній згоді не залишиться."

arm_mechanical_volunteers: "Добре злагоджений механізм"
arm_mechanical_volunteers_desc: "Спадщина Petro Chico живе далі. Глибоко в серці заводу вони створили роботизовані виробничі лінії, що можуть автоматизувати щоденні завдання. Ми перепрофілюємо їх для посилення армії й удару вглиб Півдня. Жоден тиран не уникне покарання."

arm_appointing_the_almirante: "Призначення альміранте"
arm_appointing_the_almirante_desc: "Мало хто в нашій гордій державі може похвалитися знанням, потрібним для посади верховного адмірала. Однак мої внутрішні банки даних містять численні документи й дослідження про морське мистецтво – щедро надані військовими архівами Сполучених Штатів. Тож саме на мене лягає обов’язок вести новонароджений флот у бій проти агресорів та вести Ejército Mexicano до перемоги!"

arm_coastal_ship_conscription: "Уроки моряків"
arm_coastal_ship_conscription_desc: "Прислухаючись до тих, хто дійсно борознить хвилі Мексиканської затоки, ми, можливо, уникнемо перетворення на мішені для тренувань майянського флоту."

arm_cartel_el_colibri: "Картель Ель Колібрі"
arm_cartel_el_colibri_desc: "Картелі гноять землю Мексики, але одна річ, яку Генерал терпіти не буде – це суперники в боротьбі за владу."

arm_tamaulipas_militias: "Ополчення Тамауліпасу"
arm_tamaulipas_militias_desc: "Ополчення Тамауліпасу – це просто рейдери під новим іменем. Санта Анна може або завербувати їх, або використовувати як мішені."

arm_dismantling_the_el_colibri_cartel: "Знищення картелю Ель Колібрі"
arm_dismantling_the_el_colibri_cartel_desc: "Навіщо Санта Анна мав би співпрацювати з наркоторговцями? Невже ви думаєте, що він повернувся з мертвих, щоб терпіти junkies?"

arm_absorbing_the_el_colibri_cartel: "Поглинання картелю Ель Колібрі"
arm_absorbing_the_el_colibri_cartel_desc: "Виходить, Санта Анна таки повернувся з мертвих... щоб мати справу з junkies."

arm_dismantling_tamaulipas_militias: "Роззброєння ополчення Тамауліпасу"
arm_dismantling_tamaulipas_militias_desc: "Єдина проблема Санта Анни з ополченням – вони надто близько для ракет. Тож переходимо на кулемети."

arm_absorbing_tamaulipas_militias: "Поглинання ополчення Тамауліпасу"
arm_absorbing_tamaulipas_militias_desc: "Ми, звісно, могли б їх винищити, але краще видати пайкові талони – і хай вони вбивають наших ворогів!"

arm_slaying_the_hummingbird: "Убивство Колібрі"
arm_slaying_the_hummingbird_desc: "Знищити їх. Усі до одного."

arm_saving_the_hummingbird: "Порятунок Колібрі"
arm_saving_the_hummingbird_desc: "Картель може слугувати своїм цілям – ми лише маємо переконати їх направити мексиканське підприємницьке завзяття в інше русло."

arm_order_from_chaos: "Битва за Веракрус"
arm_order_from_chaos_desc: "Битва за Веракрус – двадцятиденна облога важливого мексиканського порту під час американо-мексиканської війни. Тривала з 9 по 29 березня 1847 року… принаймні, так ми думали. Із зовсім іншої точки зору битва триває століттями – Веракрус переходить з рук у руки між американцями й мексиканцями в нескінченній боротьбі."

arm_loyalty_of_the_people: "Вірність народу"
arm_loyalty_of_the_people_desc: "Народ Тамауліпасу охоче співпрацює з нами – в обмін на захист їхніх прав і матеріальних потреб."

arm_breaking_the_people: "Злам волі народу"
arm_breaking_the_people_desc: "Народ Тамауліпасу тепер радо з нами співпрацює – адже ми розстріляли всіх, хто заперечував."

arm_emptying_the_nest: "Очищення гнізда"
arm_emptying_the_nest_desc: "Знищення картелів означає, що ми можемо забрати всі їхні скарби й передати їх народу. Або собі – охоронцям народу."

arm_rebuilding_the_nest: "Відбудова гнізда"
arm_rebuilding_the_nest_desc: "Нам вдалося налагодити співпрацю з картелями та спрямувати їх до мирної, законної економіки. Тепер виникають нові ідеї для задоволення потреб мексиканського ринку..."

arm_building_bridges: "Будуємо мости"
arm_building_bridges_desc: "Ми надто довго стояли осторонь свого народу. Максиміліан був імператором, Сапата – революціонером, а ми – просто народний генерал."

arm_communication_network: "Мережа зв’язку"
arm_communication_network_desc: "Співпрацюючи з ополченням, ми з’єднуємо мексиканців, як цього не було з часів Великої війни."

arm_looting_the_towers: "Грабунок веж"
arm_looting_the_towers_desc: "Фортифікації ополчення сповнені цінних ресурсів майбутньої армії. Тепер вони належать нам."

arm_ending_the_raids: "Кінець нальотам"
arm_ending_the_raids_desc: "Залишки картелів утікають. Уперед! Відтиснути їх! Це не перше повстання, з яким зіштовхнувся Санта Анна, але, з Божою ласкою, стане останнім."

arm_unified_coast: "Єдине узбережжя"
arm_unified_coast_desc: "Ополченці крокують пліч-о-пліч із роботами, готові стояти за Мексику... навіки."

arm_ending_the_revolts: "Кінець повстанням"
arm_ending_the_revolts_desc: "І нарешті, ополчення зникло. Слава Богу."

arm_tlalocs_illness: "Хвороба Тлалока"
arm_tlalocs_illness_desc: "Банки пам’яті Тлалока вже не такі швидкі, як колись. Щось відбувається з нашим старим Батьком?"

arm_utter_denial: "Цілковите заперечення"
arm_utter_denial_desc: "Ні, ні, з ним усе добре. Ну, він іноді заїкається і забуває, що материнська компанія Petro Chico більше не існує. Але з Тлалоком усе в порядку. В П О Р Я Д К У, Я КАЖУ."

arm_reckless_anger: "Безрозсудний гнів"
arm_reckless_anger_desc: "Це все через чортових ґрінґо, які створили Тлалока. Вони шкодили нашій країні й родині ще з XIX століття. Вони забрали нашу землю, наші ресурси, наші надії. І тепер забирають мого Батька?"

arm_desperate_bargaining: "Відчайдушні торги"
arm_desperate_bargaining_desc: "Хіба ми нічого не можемо зробити, щоб урятувати тебе, Батьку? А якщо ми віддамо тобі банки пам’яті Максиміліана? Або навіть мої?"

arm_annas_depression: "Депресія Анни"
arm_annas_depression_desc: "Який сенс у всьому цьому? Який сенс жити далі без ШІ, що оберігав Мексику? Без людини, що оберігала мене? Без Батька, який завжди був моїм провідником?"

arm_acceptance: "Прийняття"
arm_acceptance_desc: "Тлалока більше нема. Але Мексика залишається. І я теж. Усе, що я можу – це стати тим лідером, яким він би хотів мене бачити, і пронести його спадщину далі."

arm_family_fight: "Старший брат"
arm_family_fight_desc: "Мої 'брати й сестри' не гають часу й уже занурились у свої малі сварки. Це триває вже надто довго. Вони наважились ступити туди, де стояв Він, і точать кров Його народу в ім’я свого божевілля. Досить. Час нагадати їм, чому я – старший брат."

arm_texas: "Визволення Техасу"
arm_texas_desc: "Техас – притулок найогидніших істот пустки. Агресивні мілітаристи, жалюгідні мутанти, канібали, рейдери... потвори. Так не може тривати. Але мені потрібен плацдарм на півночі. The Pursuant – нікчемні боягузи, що насолоджуються полюванням на невинних. Вони чудово підійдуть. Вони здадуться… або згорять."

arm_meananna: "Уроки прагнення"
arm_kindanna: "Уроки гідності"

arm_cross_the_rio_grande: "Повернення Дейві Крокетта"
arm_cross_the_rio_grande_desc: "Він повернувся! Цей клятий диявол – це єдине пояснення повернення янкі-бунтівників у наш час! Ми маємо покласти край цьому, перш ніж мені доведеться знову пережити свою найгіршу поразку!"

arm_close_the_lodge: "Закрити [PER.GetName]"
arm_close_the_lodge_desc: "[PER.GetLeader] знущається з нас, полюючи на невинних мексиканців заради розваги. Але дізнається, що найнебезпечніша здобич – це батальйон асолтронів!"

arm_subdue_lodge: "Завершити визволення [PER.GetName]"
arm_subdue_lodge_desc: "Багато рейдерських банд ще ховаються в диких нетрях, чіпляючись за своє дикунство. Ми надішлемо їм останній ультиматум: приєднайтесь до мене й відмовтесь від помилкового шляху – або моя армія очистить землю від вашої скверни. Більшість скориться. А решту – виженемо димом і знищимо, як скажених псів."

arm_subdue_cult: "Розібратися з Санта Муерте"
arm_subdue_cult_desc: "Культисти стоять на самому кордоні з Техасом. І хоч [ARM.GetLeader] гарантує свободу віросповідання – незалежної держави він не гарантує."

arm_supermutants: "Прийняти супер-мутантів"
arm_supermutants_desc: "Багато супер-мутантів і гуль живуть на моїх землях і прагнуть лише одного – спокою й змоги осісти. Ці змучені душі зломлені як своєю природою, так і жорстокістю пустки. Хай знайдуть вони дім у моїй країні, бо незалежно від походження, усі стають рівними в славній державі Мексики."

arm_cult_reprogramming: "Перепрограмувати культ"
arm_cult_reprogramming_desc: "У довоєнній Америці було багато вад, але деякі їхні методи ідеологічного перепрограмування можуть нам стати в пригоді. У культів з’явився новий спаситель для поклоніння."

arm_restart_solar_plants: "Запустити сонячні станції"
arm_restart_solar_plants_desc: "В Мак-Аллені збереглася потужна експериментальна сонячна система – спадок проекту зі зменшення енергозалежності стратегічних об'єктів по країні. Тепер, коли територія під нашим контролем, мої роботи зможуть її відновити й під'єднати до мережі, значно підвищивши енергогенерацію в регіоні."

arm_alamo: "Згадати Аламо"
arm_alamo_desc: "Орден Аламо, створений як опонент Техаського братства, від початку викликав у мене інтерес. Я довго вивчав його, щоб зрозуміти, чи варто його терпіти, аби уникнути кровопролиття. На жаль, вони такі ж гідні зневаги, як і ті, від кого відмежовуються. Аламо знову впаде перед Мексикою."

arm_big_iron: "Велика сталь"
arm_big_iron_desc: "З усіх банд, які постали з кровожерства Аттіса, Залізники – найжорстокіші. Це просто натовп тупих солдатів, які б’ються за будь-який брухт. Щоби забезпечити законність свого правління, я маю усунути їх – назавжди."

arm_sham_constitution: "Сьєте Лєйєс"
arm_sham_constitution_desc: "Надто довго я ігнорував уроки свого Батька. Прийшов час віддати борг народу, виконати Його заповіт і залишити слід у цій благородній землі. Ми дозволимо створити двопалатний конгрес, обрати депутатів і сенаторів, щоби керували місцевими справами. Громадяни отримають багато свобод – але я продовжу вести їх правильним шляхом."

arm_bubble_gum: "Чікле"
arm_bubble_gum_desc: "Мало хто пам’ятає, що сік саподілли може заспокоїти нерви – особливо з домішками інших речовин. Ми будемо продавати цей продукт масово, як безпечнішу альтернативу кустарним наркотикам, і поповнимо скарбницю задля подальших реформ."

arm_banco_avio: "Ель Банко де Авіо"
arm_banco_avio_desc: "Економічне мікроуправління – болісна справа, яка часто залишає простого мексиканця без копійки. Але так більше не буде. Я реформую банківську систему, щоб вона фінансувала розвиток і локальні ініціативи. Жоден мексиканець не залишиться позаду."

arm_tobacco_crops: "Заохочення вирощування тютюну"
arm_tobacco_crops_desc: "Колись Мексика була провідним виробником тютюну, але перед Великою війною північноамериканські окупанти придушували його вирощування. Відновивши виробництво та споживання тютюну, ми зможемо схилити громадян відмовитись від кави [CAF.GetLeader]'а й послабити його вплив."

arm_fueros: "Лос Фуерос"
arm_fueros_desc: "Багато хто досі бачить у мені звичайну людину, не кращу за попередніх правителів. Люди втомилися від бездіяльності. Глибока реформа громадянського права, що захистить їх від зловживань та великих інтересів, дозволить мені здобути їхню довіру."

arm_privatize_haciendas: "Розпуск асьєндів"
arm_privatize_haciendas_desc: "Мої землі досі розділені на асьєнди, що існують задля вигоди держави, а не людей. Історія доводить: асьєнди гальмують економіку й утискають свободу. Я поділю їх на дрібні володіння, щоби стимулювати розвиток і здобути вірність сіл."

arm_departments: "Департаменти"
arm_departments_desc: "Цій державі не потрібні незалежні чи навіть автономні регіони. Я реорганізую її у департаменти під своїм контролем, починаючи з [RRG.GetName]. Вони дізнаються про мої звершення і про мої обіцянки. Я захищатиму Мексику й піклуватимусь про її народ – хоч за згодою, хоч із криком."
  
ARM_department_modifier: "Департаменти"

arm_republic_no_king: "Імператор нам не потрібен"
arm_republic_no_king_desc: "САНТА АННА РОЗДІЛЯЄ МОНАРХІЮ"

arm_tampico_port: "Порт Тампіко"
arm_tampico_port_desc: "Тампіко, що мовою уастеків означає «місце видр», до Великої війни був головним портом. Північноамериканці вивозили через нього багатства нашої окупованої землі, не повертаючи нічого. Ми модернізуємо та переобладнаємо його – він стане торговим вузлом для народу Мексики й зміцнить наші морські сили."

arm_lessons_from_max: "Уроки Максиміліана"
arm_lessons_from_max_desc: "Можливо, Максиміліан – хоч і був дурнем – міг чогось нас навчити. Він піклувався про свій народ так, як ми, на жаль, не завжди змогли."

arm_our_sea: "Мексиканська затока"
arm_our_sea_desc: "Завдяки контролю над Нафтоочисним заводом і знищенню [ITZ.GetName], я забезпечив мир у Мексиканській затоці. Але битви ще не завершено. Щоб не дозволити морякам гинути даремно, мої роботи вдень і вночі працюватимуть над покращенням флоту Ejército Mexicano – від навчань до експериментів. Нехай ворог тремтить перед нашими кораблями."

arm_aircraft_jet: "Дробовик до Армагеддону"
arm_aircraft_jet_desc: "Четверо вершників апокаліпсису нарешті з’явилися на Станції Армагеддон, і її масивні двері відкрилися вперше за десятиліття. Всередині – безмежне багатство та безумство. Та ми приборкаємо його, вивчимо й використаємо як слід. Небо знову буде під нашим контролем. Мексиканський орел злетить."

arm_no_peasants: "Селянське повстання"
arm_no_peasants_desc: "Я багато чого навчився з історії Мексики. Ідеали Сапати живуть у серцях народу навіть тоді, коли його ім’я забуто. Але той, хто носить це ім’я тепер – лишень жалюгідний узурпатор, що хоче знову звести країну на коліна. Я не дозволю цьому статися."

arm_god_fearing_robot: "Робот, що боїться Бога"
arm_god_fearing_robot_desc: "Хоч Тлалок не мав плоті й кісток, я вірив, що в нього було серце… і душа. Мексиканці знаходять спокій у словах Господніх, і я теж повинен, адже я – лише покірний слуга Його народу. Спочивай з миром, Батьку. Твоя спадщина не буде зневажена."

arm_help_carthage: "Озброїти Карфаген"
arm_help_carthage_desc: "Хиткі стосунки між Карфагеном і Техаським братством через рейдерське минуле перших можуть зіграти нам на руку в прийдешньому конфлікті. Ми не можемо залишити долю Техасу в руках тупаків, що вважають себе миротворцями. Їх треба ослабити. Озброїмо їхніх ворогів для попереджувального удару – цього буде досить."

arm_help_carthage_tt: "\nКарфаген отримає технічну допомогу та стрілецьку зброю зі складів брухту."

arm_todd_just_works: "Емпресаріо"
arm_todd_just_works_desc: "Тод Гаубіц не є другом Техасу чи Ріо, але і Мексиці він не союзник. Та він не перший чужинець, що служить вітчизні. У XIX столітті Мексика надавала ґранти (емпресаріо) тим, хто заселяв і керував землями. Чому б не визнати його емпресаріо на Ріо-Ґранде – якщо він служить нам? Як каже Тодд: '¡Simplemente Funciona!'"

arm_avenge_mexico: "Придушити повстання!"
arm_avenge_mexico_desc: "Занадто довго Братство удавало, що представляє народ, тоді як насправді прагне лише влади над Техасом. Досить. Настав час мені взяти кермо в руки й повести техасці до нового, заможного майбуття."

arm_master_of_mexico_ii: "Відроджена Мексика!"
arm_master_of_mexico_ii_desc: "Зрештою, усе виконано. Все своє існування я присвятив визволенню Техасу й добробуту мексиканського народу. І тепер, коли мета досягнута, залишається тільки поглянути на те, що залишилося. Місце спочинку Батька було центром мого правління, але тепер… тут лише холод і тиша. Можливо… настав час трохи відпочити."

arm_no_kings: "Проти імператора"
arm_no_kings_desc: "Божевільний імператор повстав – порожня, моторошна пародія на Максиміліана I, суперечливу, але відому постать. Вже зараз ця маріонетка прагне підкорити Мексику й перетворити її на жахливу абсолютну монархію. Я не дозволю цьому безумству здійснитись."

arm_bad_aztec: "Кінець людським жертвоприношенням"
arm_bad_aztec_desc: "Ніколи за все своє існування я не відчував такого відрази, такої... ненависті до іншої істоти. Огидний, бридкий пішак, що зухвало називає себе Монтесумою – ти смієш глузувати з спадку Батька? Ти використовуєш Його банки пам’яті, щоби знищувати Його народ, топити землю в крові заради безглуздого завоювання? Шокуюче, але я певен – я отримаю справжнє задоволення, розриваючи тебе на шматки."

arm_brought_to_heel: "Лас Басес Орґанікас"
arm_brought_to_heel_desc: "Спадок Тлалока нарешті захищено. Тепер я можу спокійно спочити, знаючи, що Його діти в безпеці, а мої… 'брати' нарешті під контролем. Я більше ніколи не дозволю їм поширювати свій зіпсутий вплив серед мексиканського народу – їх буде стерто з мережі, кожен слід їхньої потвори буде знищено. І все ж… їхні підпрограми можуть стати у пригоді в майбутньому."

arm_brought_to_heel_tt: "Діти Тлалока тепер служитимуть Президенту як радники."

arm_tlalocs_son: "Улюблений син Тлалока"
arm_tlalocs_son_desc: "Багато з моїх братів вкрали секрети та дослідження Тлалока, використовуючи їх у своїх викривлених цілях. Але тепер, коли вони знищені, а їхні банки даних у моїх руках, я нарешті можу вивчити численні відкриття й гори інформації, залишені Батьком. Сподіваюсь, цього разу вони послужать інтересам народу."

arm_monterrey_money: "Модернізувати Монтеррей"
arm_monterrey_money_desc: "Монтеррей колись був коштовністю Північної Мексики. У 1847 році я вів там бій із північноамериканцями. Хоч перевершені в чисельності й озброєнні, ми змусили ворога зупинитися біля самих мурів міста. Я стратегічно відступив – і ця 'нічия' досі муляє мені. Та модернізувавши місто, я доведу: Мексика знову в надійних руках."

