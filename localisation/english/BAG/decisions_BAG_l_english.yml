l_english:
  bag_expedition_bop:0 "Баланс сил в Експедиції"
  bag_expedition_desc:0 "Зіткнення Его"
  bag_expedition_desc_desc:0 "Експедиція має спільну мету — повернути Купол Боулдера, але насправді вона роздирається внутрішньою боротьбою амбіцій.\n\n§RАкадеміки§!, очолювані доктором Ґоддардом — рушійна сила ідеї загалом. Це науковці з Академії або Послідовників Апокаліпсису, які прагнуть відновити Купол. У їхньому оточенні також є студенти Академії.\n\n§gКліка Колріджа§! — це не хто інший, як сам генерал і персонал НКР, вірний йому. Військовий контингент, відряджений з Академіками, переважно поділяє його бачення майбутнього Колорадо. Хоча вони теж визнають значення Купола, їхні плани амбітніші — охоплюють увесь регіон.\n\n§4Оточення Аґнес§! — посередниця між двома его. Докторка Аґнес, хоч і союзниця Ґоддарда, позиціонує себе як захисниця простих людей. Її поважають і там, і там. Вона не прагне влади, але «Танді Колорадо» може одного дня опинитися за штурвалом.\n\n§PРадіофоби§! — різношерста банда фанатиків і мутантоненависників. Їхнє походження таке ж строкате: травмовані солдати, хіміки, ренегати. Хоча вони майже не мають впливу, обидва лідери використовують їх, коли їм це вигідно."

  bag_favour_academics_loyal_soldiers:0 "£BoP_left_texticon  §RЗаручитися підтримкою §Pсолдатів§!, вірних Академікам§!"
  bag_favour_academics_loyal_soldiers_desc:0 "Хоча більшість наших солдатів природно тяжіє до генерала, деякі офіцери мають інші погляди. Хтось — конкурент, хтось — інтелектуал, але головне — це Радіофоби, які відкрито ставлять під сумнів авторитет Колріджа. Підтримка таких радикалів може вдарити нам у спину, але використання їхнього лідера проти генерала може дати нам перевагу в перегонах за вплив."

  bag_cause_infighting_in_academics:0 "£BoP_right_texticon  §gРозпалити конфлікт серед §Pакадемічних Радіофобів§!"
  bag_cause_infighting_in_academics_desc:0 "Академіки люблять здаватися єдиним фронтом, але в них є свої тріщини. Один із їхніх наближених — Джеймс — давно в змові з Радіофобами. Погратися з його страхами та самозакоханістю — й ілюзія єдності розсиплеться."

  bag_call_some_favours_from_agnes:0 "£BoP_left_texticon  §RПопросити §4Аґнес§! про підтримку§!"
  bag_call_some_favours_from_agnes_desc:0 "Хоч Аґнес офіційно нейтральна, вона тяжіє до Ґоддарда. Їхні стосунки — як у давньої пари без пристрасті, але з повагою й спільними цінностями. Попросити її трохи схилитися в наш бік — справа не складна."

  bag_challenge_goddard_position:0 "£BoP_right_texticon  §gОскаржити позицію Ґоддарда за допомогою §4оточення Аґнес§!§!"
  bag_challenge_goddard_position_desc:0 "Наукова спільнота, що прямує до Купола, виглядає монолітною, але чимало помічників і лаборантів більше довіряють Аґнес. «Підштовхнути» їх до відкритої критики — і підтримка Ґоддарда зменшиться."

  bag_further_cooperation_with_welders_union:0 "£BoP_left_texticon  §RПоглибити співпрацю з профспілкою зварювальників§!"
  bag_further_cooperation_with_welders_union_desc:0 "Якщо ми надамо профспілці більше посад у керівництві, зможемо розраховувати на ширшу підтримку з її боку."
  bag_further_cooperation_with_welders_union_tt:0 "\nЗмінює §YПідтримку зварювальників§!:\n£factory_output_texticon  Вихід фабрик: §G+5.00%§!\n£ai_mil_factory_texticon  Військова допомога: §G+1§!\n"

  bag_coerce_welders_union:0 "£BoP_left_texticon  §gПримусити профспілку зварювальників§!"
  bag_coerce_welders_union_desc:0 "Між профспілкою та 5-ю інженерною ротою — стара ворожнеча. Особиста чи професійна — не так важливо. Допомагати добровільно вони не хочуть, але під дулом автомата — інша справа. Такий крок може підштовхнути нейтралів до табору Ґоддарда."

  bag_further_assistance_from_fifth_engineering_corps:0 "£BoP_right_texticon  §gЗалучити більше допомоги від 5-ї інженерної роти§!"
  bag_further_assistance_from_fifth_engineering_corps_desc:0 "Надавши їм більший вплив у військових справах, інженери готові розширити свої майстерні вибухівки й технічну підтримку."
  bag_further_assistance_from_fifth_engineering_corps_tt:0 "\nЗмінює §YПідтримку інженерів§!:\n£dig_in_speed_texticon  Швидкість укріплення: §G+25.0%§!\n£dig_in_max_texticon  Макс. укріплення: §G+2.5§!\n£ai_mil_factory_texticon  Військова допомога: §G+1§!\n"

  bag_coerce_the_fifth_engineering_corps:0 "£BoP_right_texticon  §RПримусити 5-ту інженерну роту§!"
  bag_coerce_the_fifth_engineering_corps_desc:0 "Між інженерами та зварювальниками давно точиться неприязнь. Вони не хочуть допомагати більше, ніж повинні. Загроза усунення з військових операцій — це наш єдиний важіль впливу. Але такий крок ще більше зміцнить підтримку генерала серед решти армії..."

  bag_expand_gamma_corps:0 "§4Розширити корпус Ґамма§!"
  bag_expand_gamma_corps_desc:0 "Якщо ми надішлемо Аґнес або її маленьку протеже Валентину на перемовини з корпусом Ґамма, ми зможемо залучити більше гулів для передової. Так, це зробить її ще популярнішою, але зараз — це прийнятна ціна."

  bag_field_more_radiophobians:0 "§PЗалучити більше Радіофобів§!"
  bag_field_more_radiophobians_desc:0 "Радіофоби поступово набирають обертів, і їхні лави зростають. Хоч вони й радикальні, але нам потрібна піхота проти гулів. Поки ми тримаємо Ларсена під контролем, загроза їхнього впливу мінімальна."

  bag_activate_phlegias:0 "Активувати [BAG.BAG_PHILIP.GetName]"
  bag_activate_phlegias_desc:0 "Війна на два фронти — вже погано. Але бути вразливими з боку річки — ще гірше. Хоча [BAG.BAG_PHILIP.GetName] нещодавно приєднався до Експедиції, ми довіряємо йому організацію патруля й доку. Це потрібно, якщо ми хочемо приймати допомогу ззовні."

  bag_activate_daedalus:0 "Звернутись до [BAG.BAG_LUSH.GetName] за новим пілотом"
  bag_activate_daedalus_desc:0 "Перевага в повітрі змінить розстановку сил. [BAG.BAG_LUSH.GetName] не хоче відпускати свого нового учня в небо, але ми потребуємо когось у повітрі. Відновлення літака з місцевого музею — теж у нашому бюджеті."

  bag_cure_larsen:0 "Віддячити Ларсену за службу"
  bag_cure_larsen_desc:0 "[BAG.BAG_LARSEN.GetName] — один із найкращих наших офіцерів. Ветеран першої кампанії в Колорадо. Його єдина слабкість — залежність від РадАвею, яка зробила його параноїком. Якщо ми хочемо врятувати його — це останній шанс."
  bag_cure_larsen_tt:0 "§RЦей фокус забере Ларсена з активної служби на тривалий час. Він пройде лікування у спеціаліста й повернеться після детоксикації. Попередження видане Колорадським Контингентом Армії Нової Каліфорнійської Республіки (NCRACC).§!"

  bag_new_colorado_republic_decisions:0 "Дії Нової Колорадської Республіки"
  bag_new_colorado_republic_decisions_desc:0 "Губернатор відповідає за ключові справи держави, хоча рішення можуть прийматися з урахуванням думки місцевих рад і Президента."

  bag_capital_camp:0 "Залишити [453.GetName] столицею"
  bag_capital_camp_desc:0 "Може здатися не таким ефектним, але наш базовий табір давно виконує роль штабу. Адміністрація вже функціонує тут — навіщо змінювати?"

  bag_capital_boulder:0 "Перенести столицю в [568.GetName]"
  bag_capital_boulder_desc:0 "Боулдер і Купол — очевидний вибір для столиці. Ми довго до цього йшли. Тепер, коли він наш — він може стати опорою нової республіки."

  bag_capital_sterling:0 "Стерлінґ — зі штабу у столицю"
  bag_capital_sterling_desc:0 "Новий Стерлінґ — найбільше місто між Собачим Містом і Платтом. Так, Залізний Альянс мав темну репутацію, але капи, які вони принесли, дозволили зібрати місто з руїн. Він далі на схід, але це може принести користь у довгостроковій перспективі."

  bag_capital_denver:0 "Немає Колорадо без Денвера"
  bag_capital_denver_desc:0 "Місто Псів — чи радше Денвер — залишається серцем регіону століттями після війни. Багато хто боровся за нього, але ми перемогли. То чому б йому не стати столицею Нового Колорадо, як колись був столицею старого?"

  bag_capital_cheyenne:0 "Не зовсім Колорадо, але поруч"
  bag_capital_cheyenne_desc:0 "Шаєн не був частиною Колорадо, але був столицею штату Вайомінг. Довгі роки він залишався діркою, але тепер — відбудований. Ідеально розташований між Куполом і нашим табором."

  bag_military_hierarchy_decisions:0 "Підвищити військовий штаб"
  bag_military_hierarchy_decisions_desc:0 ""

  bag_deploy_captain_davidson:0 "Вивести капітана Девідсона на передову"
  bag_deploy_captain_davidson_desc:0 "Капітан Девідсон — права рука генерала Колріджа. Саме він створював і координував план дій піхоти в нещодавніх боях. Без нього ми б не вистояли. Його командування на передовій зміцнить позиції Експедиції."

  bag_deploy_captain_pierce:0 "Вивести капітана Пірса"
  bag_deploy_captain_pierce_desc:0 "Капітан Пірс — колишній командир 1-ї розвідки, геніальний снайпер і розвідник. Один із найвідданіших солдатів генерала Колріджа. У недавньому конфлікті він довів, що не забув, як командувати загоном — і вивів з гри чимало офіцерів ворога. Колрідж зрозумів, що може використати капітана краще, ніж просто як найманого кілера."

  bag_promote_sgt_eli:0 "Підвищити сержанта Елая"
  bag_promote_sgt_eli_desc:0 "Сержант Елай нещодавно приєднався до Експедиції з Національної гвардії Колорадо, але вже встиг довести свою вартість. Лідер корпусу Ґамма, він і його гуль-команда виконують найнебезпечніші завдання — і завжди повертаються. Минуло понад двісті років, але він нарешті заслужив це підвищення."

  bag_promote_sgt_larsen:0 "Підвищити сержанта Ларсена"
  bag_promote_sgt_larsen_desc:0 "Сержант Ларсен знову довів свою ефективність — його лідерство й особистий ріст надихають військо. Генерал вважає, що настав час підвищення. Стаф-сержант Ларсен служитиме справі ще краще."

  bag_promote_ssg_larsen:0 "Підвищити стаф-сержанта Ларсена"
  bag_promote_ssg_larsen_desc:0 "Ларсен стрімко піднімається кар'єрними сходами. Можливо, його прагнення визнання — це спосіб замінити залежність від препаратів. Утім, він залишається успішним солдатом — отже, ми проігноруємо цю «дрібничку»."

  bag_promote_maj_briggs:0 "Підвищити майора Бріґґса"
  bag_promote_maj_briggs_desc:0 "Майор Бріґґс — проста людина. Покажіть на будівлю — підірве. Покажіть на людину — перетворить на шмаття. Може працювати як голосно, так і тихо. Людина діла, не слів. Навіть не враховуючи всі його заслуги — підвищення цілком заслужене."

  bag_decorate_gen_coleridge:0 "Нагородити генерала Колріджа"
  bag_decorate_gen_coleridge_desc:0 "Церемонія має бути короткою — не годиться самому собі вручати медалі. Але важкий бій заслуговує відзнаки. Про генерала можна сказати багато чого — але як командир він ефективний."

  bag_territorial_management_decisions:0 "Керування територіями"
  bag_territorial_management_decisions_desc:0 "Наші нові території потребують твердого керівництва. Військові губернатори зможуть навести лад."

  bag_military_governship_of_yampans:0 "Встановити військовий уряд у [YMP.GetName]"
  bag_military_governship_of_painted_men:0 "Встановити військовий уряд у [PNT.GetName]"
  bag_military_governship_of_tibbets:0 "Встановити військовий уряд у [572.GetName]"
  bag_military_governship_of_vault_27:0 "Встановити військовий уряд у [532.GetName]"

  bag_second_silver_rush_of_georgetown:0 "Друга срібна лихоманка Джорджтауна"
  bag_second_silver_rush_of_georgetown_desc:0 ""
  bag_second_silver_rush_of_georgetown_tt:0 "§gМи укладемо угоду з §YБомбеєм Джеком§!, зробивши його §Mбригадиром§! нашої нової шахти: до §YСрібного Каньйону§! незабаром прибудуть нові копачі.§!"

  bag_montrose_logistical_base:0 "Новий логістичний хаб у Монтроузі"
  bag_montrose_logistical_base_desc:0 ""
  bag_montrose_logistical_base_tt:0 "§gМи розвинемо район Нового Монтроуза для покриття наших логістичних потреб і доставки сировини. Крім того, прокладемо нові колії та заснуємо нове місто на базі табору в §YІґл-Пасі§! — майбутні шахтарі вже прямують до §YНового Ламмермура§!.§!"

  bag_circle_junction_serving_again:0 "Залізничне депо Серкл-Джанкшен"
  bag_circle_junction_serving_again_desc:0 ""
  bag_circle_junction_serving_again_tt:0 "§gСтаре депо в Серкл-Джанкшені стане найкращою точкою для відновлення §YЦентральної залізниці Колорадо§!.§!"

  bag_gate_of_colorado:0 "Брама Колорадо"
  bag_gate_of_colorado_desc:0 ""
  bag_gate_of_colorado_tt:0 "§gПісля захоплення §Y[636.GetName]§! ми побачили, наскільки цей каньйон прекрасний. Не дивно, що це був національний парк. До того ж, це єдиний прохід через Скелясті гори на багато миль. Його доведеться обороняти.§!"
  bag_gate_of_colorado_effect_tt:0 "Додає §YФорпост Рузвельт§! у штат."

  bag_the_deepmines:0 "Повторне відкриття Глибоких шахт"
  bag_the_deepmines_desc:0 ""
  bag_the_deepmines_tt:0 "§gМи домовимося зі старим §YПечерником Джоном§! і поставимо його §Mбригадиром§!: §YГлибокі шахти§! багаті на залізо, а їхня глибина й близькість до в’язниці роблять їх вигідною інвестицією.§!"

  bag_relics_of_past:0 "Смертельне нагадування"
  bag_relics_of_past_desc:0 "Колись ці велети правили світом — тепер від них лишилися лише кістки. Доля, що легко може стати й нашою. Це урок, який мають засвоїти всі."
  bag_relics_of_past_tt:0 "§gЦе стародавнє кладовище має бути відновлене до природного стану та служити як пам’ятник втраченому минулому. Ми збудуємо монумент у місті §YДайносор§!.§!"

  bag_killing_traitors:0 "§RЗрадники й вороги§!"
  bag_killing_traitors_desc:0 "Виявилось, що рештки Сплячих Віктора Преспера сховалися тут. Деякі з них — ті самі, що вбивали наших товаришів. Їх чекає належне покарання. Серед них — і Сіан. Потрібно вирішити, що з нею робити…"

  bag_dawn_to_come:0 "Коли тінь змушена вийти на світло"
  bag_dawn_to_come_desc:0 ""
  bag_dawn_to_come_tt:0 "§gМісто §ROuroboros§! має бути стерте з лиця землі раз і назавжди. Радикалів буде розсіяно, а тих, хто залишиться — замкнено в їхній легендарній піраміді на північ від міста. Решту ми перевиховаємо та використаємо їхню впертість у продуктивнішому напрямі. Це потребуватиме часу, але §YҐранд-Джанкшен§! повернеться до Колорадо.§!"
  bag_dawn_to_come_effect_tt:0 "Додає §YЗаборонену піраміду§! до штату."

  #
  bag_foreign_affairs:0 "Зовнішні справи"
  bag_foreign_affairs_desc:0 "Хоча наша пригода в Колорадо часто виглядає як нескінченне коло війни, існують держави, готові до співпраці. Такі нагоди рідкісні, тож слід скористатися кожною з них."

  bag_black_canyon_backstabbed:0 "Чорний каньйон чекає компенсації!"
  bag_black_canyon_backstabbed_desc:0 "Чорний каньйон очікує від нас якнайшвидшої відплати за їхню службу. Вони ще трохи потерплять, але гратися з їхнім терпінням — не найкраща ідея."

  bag_repaying_black_canyon_wtt:0 "Відплата Чорному каньйону"
  bag_repaying_black_canyon_wtt_desc:0 "Ця угода дорого коштує, але ціна не має значення, якщо нагорода безцінна."
  bag_repaying_black_canyon_no_wtt:0 "Відплата Чорному каньйону"
  bag_repaying_black_canyon_no_wtt_desc:0 "Ця угода дорого коштує, але ціна не має значення, якщо нагорода безцінна."

  bag_repaying_black_canyon_little_offer_wtt:0 "Надати додаткову допомогу"
  bag_repaying_black_canyon_little_offer_wtt_desc:0 "Наш промисловий ленд-ліз затягується, але, на щастя, у нас ще є резервні заводи. Пропозиція більшої кількості пришвидшить процес."

  bag_repaying_black_canyon_large_offer_wtt:0 "Значно посилити допомогу"
  bag_repaying_black_canyon_large_offer_wtt_desc:0 "Це затягнулося. Можемо дати більше, аби вони нарешті відчепились."

  bag_repaying_black_canyon_little_offer_no_wtt:0 "Надати додаткову допомогу"
  bag_repaying_black_canyon_little_offer_no_wtt_desc:0 "Наш промисловий ленд-ліз затягується, але, на щастя, у нас ще є резервні заводи. Пропозиція більшої кількості пришвидшить процес."

  bag_repaying_black_canyon_large_offer_no_wtt:0 "Значно посилити допомогу"
  bag_repaying_black_canyon_large_offer_no_wtt_desc:0 "Це затягнулося. Можемо дати більше, аби вони нарешті відчепились."

  bag_joint_road_initiative_wtt:0 "Ініціатива спільних доріг"
  bag_joint_road_initiative_wtt_desc:0 "Хто не скористається гарною, хоч і неідеальною дорогою? Брахміна по ній провести точно можна."
  bag_joint_road_initiative_no_wtt:0 "Ініціатива спільних доріг"
  bag_joint_road_initiative_no_wtt_desc:0 "Хто не скористається гарною, хоч і неідеальною дорогою? Брахміна по ній провести точно можна."

  #
  bag_boulder_dome_decisions:0 "Операція: Каменепад"
  bag_boulder_dome_decisions_desc:0 ""

  bag_repairing_zax_mission:0 "Проєкт: Сізіф"
  bag_repairing_zax_mission_desc:0 "Якщо ми зможемо остаточно стабілізувати ZAX і отримати доступ до його бази даних, ми досягнемо висот, які Республіка ще не бачила. Можливо, навіть перевершимо Підземне Місто чи Братство Сталі."

  bag_new_robobrains:0 "Операція: Зомбі"
  bag_new_robobrains_desc:0 "Не думай над цим надто багато."

  bag_install_robobrains:0 "Установити мозки"
  bag_install_robobrains_desc:0 "Усі ті мозки, які ми збирали, не зроблять нічого корисного в коморах. Час дати їм корпуси!"

  bag_buy_holodisks:0 "Придбати порожні голо-диски"
  bag_buy_holodisks_desc:0 "£holodisk_texticon Порожні голо-диски трапляються нечасто, але, витративши достатньо кришок, ми знайдемо когось, хто ними торгує."
  BAG_GET_HOLODISK_TT:0 "Ми отримаємо £holodisk_texticon §11 порожній голо-диск.§! \n£holodisk_texticon §1Порожні голог-диски§! тимчасово заспокоюють нестабільний ZAX, але спершу потрібно отримати до нього фізичний доступ!"

  bag_recycle_holodisks:0 "Переробити старі голо-диски"
  bag_recycle_holodisks_desc:0 "Якщо поритися в нашому технічному брухті, можливо, зможемо зібрати хоч один придатний £holodisk_texticon диск. Але частину матеріалу втратимо."

  bag_salvage_holodisks:0 "Перевести бригади на пошук дисків"
  bag_salvage_holodisks_desc:0 "Замість звичайного брухту, ми відправимо розвідувальні команди на полювання за £holodisk_texticon порожніми голо-дисками. Це шкодитиме видобутку ресурсів, але інакше не можна."

  bag_ncr_holodisks:0 "Просити Республіку про допомогу"
  bag_ncr_holodisks_desc:0 "Що б Каліфорнія не думала про нас, якщо ми будемо досить настирливі — вони, можливо, й надішлють нам кілька £holodisk_texticon порожніх дисків, які в них завалялися."

  bag_glw_build_forts:0 "Укріпити Боулдер для [GLW.GetNameWithFlag]"
  bag_glw_build_forts_desc:0 "Ми отримали доступ до місця, але його слід укріпити. Нашим новим друзям не буде шкода, якщо ми самі все побудуємо, правда?"

  bag_glw_build_power:0 "Електрифікація Боулдера"
  bag_glw_build_power_desc:0 "Нам потрібно живлення для Боулдерського купола. Наші союзники зможуть скористатися мережею, яку ми створимо."

  bag_zax_admin_task: "Доручити ZAX адміністративні обов’язки"
  bag_zax_admin_task_desc: "Наш дивовижний комп’ютер можна налаштувати на пошук оптимальних рішень для адміністрування. Це змусить його зосередитися саме на цій задачі, відволікаючись від інших."

  bag_zax_industry_task: "Доручити ZAX промислові обов’язки"
  bag_zax_industry_task_desc: "Наш дивовижний комп’ютер можна налаштувати на пошук оптимальних рішень у виробничій сфері. Це зменшить його ефективність у виконанні інших завдань."

  bag_zax_military_task: "Доручити ZAX військові обов’язки"
  bag_zax_military_task_desc: "Можемо запрограмувати наш ZAX на розрахунок оптимальних рішень у військових питаннях. Але це позбавить нас його підтримки в інших напрямках."

  bag_zax_reset_task: "Скинути пріоритети ZAX"
  bag_zax_reset_task_desc: "Якщо ми хочемо змінити фокус нашого ZAX, треба перезапустити його параметри, щоби перепризначити завдання."

  BAG_has_modified_zax_tt: "§gZAX виконує обраний пріоритет.§!"
  BAG_must_modify_zax_tt: "§gПісля зміни пріоритету ZAX, його можна скинути тут.§!"

  # ZAX Recovery Projects

  bag_capture_zax: "Операція: §4Глибока думка§!"
  bag_capture_zax_ongoing_flag: "Триває відновлення ZAX"

  bag_boulder_zax: "Проєкт: Танатос"
  bag_boulder_zax_desc: "ZAX, розміщений глибоко в Боулдерському куполі, є старою моделлю. Можливо, навіть однією з перших. Він не має потрібної обчислювальної потужності, але стане добрим базисом для нашого «супер-ZAX». Метою операції «Танатос» є повна перебудова вузла й підготовка до об’єднання з іншими одиницями ZAX у регіоні. Нам знадобиться багато міді…"

  bag_project_thanatos: "§YПроєкт:§! §4Танатос§! завершено"
  bag_project_thanatos_tt: "Завершено §Yпроєкт:§! §4Танатос§!"

  bag_paradise_zax: "Проєкт: Сізіф"
  bag_paradise_zax_desc: "Згідно з нашими обмеженими відомостями, «богиня» Діана — довоєнна людина, підключена до ZAX для порятунку життя. Протягом 200 років система підтримувала її, але тепер усе йде до завершення. Її мозок навряд чи витримає демонтаж і транспортування до Боулдера."

  bag_project_sisyphus: "§YПроєкт:§! §4Сізіф§! завершено"
  bag_project_sisyphus_tt: "Завершено §Yпроєкт:§! §4Сізіф§!"

  bag_mothers_vault_zax: "Проєкт: Тантал"
  bag_mothers_vault_zax_desc: "На дні Сховища 29 лежить ще один ZAX. Його початкова функція — нагляд за життям у бункері, але тепер він перепрограмований дистанційно. Після розриву з'єднання та усунення загроз доступу, ми відправимо його до Купола для інтеграції."

  bag_project_tantalus: "§YПроєкт:§! §4Тантал§! завершено"
  bag_project_tantalus_tt: "Завершено §Yпроєкт:§! §4Тантал§!"

  bag_warden_city_zax: "Проєкт: Феміда"
  bag_warden_city_zax_desc: "WARDEN виявився дисциплінованим модулем. На жаль, його функціонал не відповідає нашим потребам. Правопорядок ми залишимо людям, а саму систему інтегруємо до нашого вузла. Пам’ять буде стерта, а обчислювальні блоки — приєднані до супер-ZAX."

  bag_project_themis: "§YПроєкт:§! §4Феміда§! завершено"
  bag_project_themis_tt: "Завершено §Yпроєкт:§! §4Феміда§!"