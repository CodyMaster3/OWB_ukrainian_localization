l_english:
  #Main Tree - Linear Story
  #Starting Focuses
  bag_first_expedition:0 "Перша експедиція"
  bag_first_expedition_desc:0 "Це не вперше ми сюди прийшли. Минуло вже близько 20 років..."

  bag_failure_of_expedition:0 "Невдача експедиції"
  bag_failure_of_expedition_desc:0 "Ми не досягли успіху й були змушені відступити. Все через одну конкретну особу."

  bag_second_expedition:0 "Друга експедиція"
  bag_second_expedition_desc:0 "Ми повернулися знову. І здається, цей регіон став удвічі смертоноснішим, ніж був раніше."

  #The Coloradan Powderkeg Focuses
  bag_empirical_method:0 "Емпіричний метод"
  bag_empirical_method_desc:0 "Ми не можемо дозволити собі діяти навмання. Потрібно обережно вивчити ситуацію, навіть якщо це забере час."

  bag_fund_galetskis:0 "Профінансувати Гараж Ґаленських"
  bag_fund_galetskis_desc:0 "Родина Ґаленських завжди була відданими союзниками Експедиції. Двадцять років тому, коли ми вперше ступили на землю Колорадо, Едді поділився своїм досвідом і броньованою вантажівкою, забезпечивши нам прохід до Купола. Зараз Старий Едді – немічна людина, але його діти продовжують його справу. Ми знову потребуємо їхньої допомоги."

  bag_students_of_apocalypse:0 "Учні апокаліпсису"
  bag_students_of_apocalypse_desc:0 "Більшість нашого наукового персоналу – це учні Академії та шкіл Послідовників. Серед них – інженери, програмісти, медики та дослідники чум. Їхній різносторонній досвід буде ключовим для нашого виживання."

  bag_civilian_cooperation:0 "Співпраця з місцевими"
  bag_civilian_cooperation_desc:0 "Наша головна мета – захоплення Купола. Але якщо ми знову застосуємо військову силу, як раніше, ми зазнаємо поразки. Ми не можемо ігнорувати волю й добробут місцевого населення. Ми повинні переконати їх, що ця боротьба – їхня також. Якщо вони стануть на наш бік, Республіка щедро віддячить."

  bag_our_part:0 "Червоний до червоного, білий до білого..."
  bag_our_part_desc:0 "Студенти, яких ми привезли з собою, мають різне походження – більшість з них інженери чи програмісти. Майже ніхто не має практичного медичного досвіду, але з належним керівництвом лікарів вони зможуть рятувати життя."

  bag_do_it_yourself_robotics:0 "Робототехніка власноруч"
  bag_do_it_yourself_robotics_desc:0 "Доктор Ґоддард завжди захоплювався ідеєю роботизованої війни. Він особисто бачив протектронів у дії під час досліджень на електростанції Міста Сховища. Хоч ми ще не готові створити армію роботів, ми можемо почати зі збирання тих, що маємо."

  bag_welder_deal:0 "Угода з Об’єднанням Зварників"
  bag_welder_deal_desc:0 "До того, як Бере-за-Зуби вигнав гулів із Міста-Псів, “Об’єднання Зварників” домінувало тут. Це була самоврядна спільнота, яка жила без централізованої влади. Гулі легко їх розбили, але невелика група вижилих все ще існує на нашій території. Ми можемо звернутися по їхню допомогу."
  bag_welder_deal_tt:0 "§RУвага! Об’єднання Зварників припинить свою підтримку, якщо ми тісніше зблизимось із 5-ю Інженерною Ротою!§!"

  bag_straightforward_method:0 "Прямий метод"
  bag_straightforward_method_desc:0 "Військові питання – справа НКА, а не яйцеголових за письмовими столами. Ми знищимо ворогів так, як уміємо найкраще."

  bag_local_recruitment_drive:0 "Місцева рекрутська кампанія"
  bag_local_recruitment_drive_desc:0 "Республіка прибула, люди Колорадо! Вона поділиться своєю свободою і добробутом, якщо ми зможемо вигнати ворога! Станьте до лав НКАКР – Армії Нової Каліфорнії в Колорадо, і здобудьте громадянство!"

  bag_fifth_engineering_company:0 "5-та Інженерна Рота"
  bag_fifth_engineering_company_desc:0 "На чолі з майором Бріґґсом, 5-та Інженерна Рота виконує звичні завдання інженерного підрозділу. Але їхня спеціалізація – саботаж, зазвичай вибуховий. Вони змушують ворогів шкодувати, що прокинулись уранці."

  bag_drill_greens:0 "Підготовка колорадських рекрутів"
  bag_drill_greens_desc:0 "Експедиція зовсім не готова до війни на два фронти. Є багато місцевих, яких можна завербувати або призвати, але вони потребують бодай якогось навчання."

  bag_dedicated_fireteams:0 "Інтеграція загонів вогневої підтримки"
  bag_dedicated_fireteams_desc:0 "Інтегруємо загони «Інтенсивного Покривного Вогню» Бріґґса в наші батальйони, щоб здобути перевагу у вогневій силі та організації."
  bag_dedicated_fireteams_tt:0 "Додає §YПідтримку Вогневих Груп§! до шаблонів §YКолорадські Солдати§! та §YКолорадські Рейнджери§!!"

  bag_activate_fifth_engineering_company:0 "Розгорнути 5-ту Інженерну Роту"
  bag_activate_fifth_engineering_company_desc:0 "Ми хотіли тримати П’яту осторонь, але вибору не маємо – потрібно негайно задіяти їх. Їхній справжній потенціал та навички стануть у пригоді в найближчій боротьбі, навіть якщо це розкриє наші козирі."
  bag_activate_fifth_engineering_company_tt:0 "§RУвага! 5-та Інженерна Рота припинить свою підтримку, якщо ми тісніше зблизимось із Об’єднанням Зварників!!§!"

  bag_office_of_millitary_advancement:0 "Управління Військового Розвитку"
  bag_office_of_millitary_advancement_desc:0 "Управління Військового Розвитку, або ж УВР – це бачення військової кліки НКА. Колерідж спільно з Лі Олівером у Республіці уявляли орган, що не просто відновлює стару зброю, а створює нову, кращу. Тут, далеко від каліфорнійської бюрократії, Колерідж спробує втілити це бачення в життя."
    #
    bag_our_administrator_on_field:0 "Наша адміністраторка в полі"
    bag_our_administrator_on_field_desc:0 "[BAG.BAG_AGNES.GetName] – не лише видатна біологиня та лікарка, а й досвідчена дипломатка. Її скромність і відсутність честолюбства роблять її ідеальною адміністраторкою та цивільною лідеркою. Поки [BAG.BAG_GODDARD.GetName] та [BAG.BAG_COLERIDGE.GetName] роблять усе можливе для досягнення цілей Експедиції, вона триматиме все інше під контролем."

    bag_gamma_corps:0 "Організувати корпус "Гамма""
    bag_gamma_corps_desc:0 "Ми маємо використати всі доступні ресурси. Переважна більшість населення під нашою юрисдикцією – гулі, і не вербувати їх було б марнотратством. Особливо, зважаючи на те, що більшість із них – «старі як світ», ветерани Великої Війни, з реальним військовим досвідом."

    bag_local_leaders:0 "Просувати місцевих лідерів"
    bag_local_leaders_desc:0 "Місцевих людей мають вести місцеві лідери. [BAG.BAG_ELI.GetName] служив у Національній Гвардії Колорадо до падіння бомб. Як і багато інших, він приєднався до [WHD.GetName], але згодом розчарувався у керівництві Старого Пса. Прибуття Республіки дало йому шанс змінити все на краще – тому він добровільно очолив наші сили проти свого колишнього командира."

    bag_ghoul_reliance:0 "Ставка на Гниючих Рейнджерів"
    bag_ghoul_reliance_desc:0 "Хоча це і викликає занепокоєння у Вищому Командуванні, нам доведеться ще більше покладатись на гулів. Вони добре навчені, надійні, і їх багато. У майбутньому це може боляче вдарити по нас, але наразі іншого вибору немає – Корпус Гамма має бути розширений."
    bag_ghoul_reliance_tt:0 "§GВідкриває§! новий набір §YЗаконів для Чужинців§!"

    bag_establish_outposts:0 "Заснувати форпости"
    bag_establish_outposts_desc:0 "Наша доктрина вимагає добре укріплених позицій, і наші сапери швидко можуть їх створити. Ми зведемо частокіл, стіни, бункери та форпости у підконтрольних містах. Попри важливість захисту кордонів, ці поселення забезпечують нас ресурсами – ми не можемо їх втратити."

    bag_access_radio_towers:0 "Підключити радіовежі"
    bag_access_radio_towers_desc:0 "Знання про ворога – запорука перемоги. Відновлення місцевих радіовеж дасть нам чудові оглядові точки і дозволить ефективно шпигувати за гулями."

    bag_access_emergency_stockpiles:0 "Отримати доступ до резерфних складів"
    bag_access_emergency_stockpiles_desc:0 "Коли ми востаннє залишали Колорадо, ми приховали тайник зі зброєю та спорядженням. Воно старе й заіржавіле, але, схоже, надзвичайна ситуація настала раніше, ніж ми очікували."

    bag_task_force_baggers:0 "Оперативна група «Баґґери»"
    bag_task_force_baggers_desc:0 "«Баґґери», ветерани Першої експедиції, – наші найдосвідченіші солдати. Спершу ми хотіли використати їх у штабі, але доведеться знову кинути їх у бій – навіть якщо це загострить їхню ПТСР."

    bag_raise_medical_rations:0 "Збільшити медичні морми"
    bag_raise_medical_rations_desc:0 "Район Боулдера, околиці Шаєнну та далеке південне місто Колорадо-Спрінґс – усе це зелено світиться від радіації. Ми маємо враховувати рельєф. Поки не знайдемо постійного рішення, залишається лише збільшити медичні норми для наших військових."

    bag_utilize_radiophobians:0 "Залучити радіофобів"
    bag_utilize_radiophobians_desc:0 "Навколо лідера «Сили Баґґерів», [BAG.BAG_LARSEN.GetName], сформувалася група Радіофобів. Вони ненавидять радіацію і гулів. Можливо, це небезпечні фанатики, але якщо їхня ненависть буде спрямована на ворога – вона нам на користь."

    bag_plan_operation:0 "Бути готовими"
    bag_plan_operation_desc:0 "Наша штабна кімната унікальна тим, що в ній працюють і військові, і науковці, намагаючись не суперечити одне одному. Та попри це, план дій усе одно має бути визначений."

    #
    bag_put_service_stuff_into_service:0 "На заклик обов’язку"
    bag_put_service_stuff_into_service_desc:0 "Ми не лише солдати. Робітники, моряки, далекобійники та клерки прибули з нами, щоб забезпечити роботу експедиції. У ці відчайдушні часи ми можемо дати їм зброю до рук."

    bag_ask_truckers_help:0 "Попросити допомоги в далекобійників"
    bag_ask_truckers_help_desc:0 "Далекобійники – наші давні союзники. Хоча їхня основна роль – логістика, ми можемо попросити дозволу використати їхню броньовану вантажівку для… дещо іншої задачі."

    bag_hire_junkies:0 "Найняти наркоманів"
    bag_hire_junkies_desc:0 "Існує підозрілий тип на ім’я «Лейсермен». Він постачає гулів та інших усіма видами жорстких наркотиків. Ми ніколи не бачили його чи його людей – лише результати: наркомани й зомбі-гулі всюди. Ми можемо використати їх як гарматне м’ясо."

    bag_recruit_civilians_for_sapper_work:0 "Найняти місцевих на саперні роботи"
    bag_recruit_civilians_for_sapper_work_desc:0 "Серед місцевих багато людей з інженерним хистом. Можливо, вони не мають навичок військових саперів, але в екстрених умовах згодяться й вони."

# шлях до Боулдера
bag_first_victory_of_expedition: "Перша перемога експедиції"
bag_first_victory_of_expedition_desc: "Попри всі труднощі, ми здобули перемогу! Настав час для святкувань, а після цього – час на зміцнення контролю над територією."

bag_promote_our_heroes: "Відзначити наших героїв"
bag_promote_our_heroes_desc: "Експедиція очікувала на спротив, але те, що сталося, перевершило усі уявлення. Наші солдати проявили доблесть і майстерність. Настав час гідно нагородити їх. Нагороди та підвищення вже в дорозі."

bag_civilian_oversight: "Встановити громадянський нагляд"
bag_civilian_oversight_desc: "Ці залиті кров’ю землі тепер належать нам, і їхнє відновлення потребуватиме чимало часу та ресурсів. Ми не можемо допустити зради з боку нових громадян – навіть якщо примирення затримає нас на шляху до Боулдера."

bag_land_of_glowing_ash: "Велике сяйво Колорадо"
bag_land_of_glowing_ash_desc: "Столиця колишнього Вайомінгу, Шаєнн, була зруйнована під час Великої Війни. Культ Сяйливих досі заражає цей край. Якщо ми прагнемо миру, доведеться домовитися з їхньою... «вірою»."
bag_land_of_glowing_ash_tt: "§gМи надішлемо посланця до §Y[GLC.GetNameWithFlag]§!. Їхній лідер, Сяючий Батько, очолює схожу течію, як §Y[LUM.GetNameWithFlag]§!, але з меншим фанатизмом. Якщо ми переконаємо його замінити «Великого Сяйливого», це може принести мир.§!"

bag_guarantee_freedom_of_religion: "Гарантувати свободу віросповідання"
bag_guarantee_freedom_of_religion_desc: "Свобода віросповідання – основа правопорядку, ще з часів старого світу. Заборона місцевих культів лише роздмухає опір. Гарантувавши гулям право на їхній шлях, ми діємо і етично, і прагматично."
bag_guarantee_freedom_of_religion_tt: "§gЯкщо §Yколиска сяйва§! прийме нашу пропозицію, буде відкрито нового радника.§!"

bag_raise_temple_of_faith: "Збудувати храм для віри"
bag_raise_temple_of_faith_desc: "Гулі більше не муситимуть молитися в підпіллі. Ми спорудимо храм, де вони слухатимуть Сяйливого Батька та займатимуться громадськими роботами на користь Республіки!"

bag_last_stand_of_all: "Останній опір усіх"
bag_last_stand_of_all_desc: "Ми відтворимо тут, на новому рубежі, те саме братерство людей, гулів і мутантів, що було в Зламаних Пагорбах. Це стане символом єдності та надією на краще майбутнє."
bag_last_stand_of_all_tt: "§YСтарий Пес§! стане нашим командиром.\n§LРівень§!: §Y3§!\n§RАтака§!: §Y4§!\n§GОборона§!: §Y1§!\n§PПланування§!: §Y1§!\n§MЛогістика§!: §Y2§!\n§gРиси:§! §tСильний§!, §tСпостережливий§!, §tДитя нетрищ§!"

bag_enforce_mutant_law_of_2205: "Впровадити закон про мутантів 2205 року"
bag_enforce_mutant_law_of_2205_desc: "Цей закон був ухвалений НКР десятки років тому і гарантує рівні права для гулів та супермутантів. Для його впровадження здебільшого достатньо правильної поліцейської роботи."
bag_enforce_mutant_law_of_2205_tt: "§gЦя дія матиме кращий ефект, якщо вже запроваджено вищий рівень політики §Yнабору мутантів§!. Наші наміри виглядатимуть щирішими.§!"

bag_contact_chinese_remnants: "Вийти на зв’язок із китайськими залишенцями"
bag_contact_chinese_remnants_desc: "Найдивніша група серед В’янучих Псів – китайські залишенці. Ми володіємо достатнім знанням мандаринської, аби налагодити співпрацю. Велика Війна вже давно скінчилась – не варто дозволяти старим гріхам проливати нову кров."

bag_emancipation_of_ghoul_lands: "Емансипація колорадського фронтиру"
bag_emancipation_of_ghoul_lands_desc: "Ми спершу завоювали ці землі, а потім – їхні серця. Гулі вже стали нашими громадянами, і тепер ми можемо розраховувати на їхню підтримку в емансипації всього регіону від тиранії – і, найголовніше, у поверненні Домівки під наш контроль."

# військова лінія
bag_military_occupation: "Запровадити військову окупацію"
bag_military_occupation_desc: "Перемога на полі бою була найлегшим етапом. Поки ми не зможемо перетворити ці землі на слухняні одиниці Республіки, тут діятиме військова адміністрація. Це не додасть нам довіри, але забезпечить порядок."
bag_military_occupation_tt: "§O[BAG_GODDARD.GetName]§! йде у відставку як очільник §YКолорадської Експедиції§!, і §O[BAG_COLERIDGE.GetName]§! стає новим керівником.\n\n"

bag_westward_expansion: "Західне розширення окупаційної зони"
bag_westward_expansion_desc: "Експедиція розширює окупаційну зону на захід. Радіація та культи Сяйва перешкоджатимуть нашим зусиллям. Доведеться очистити все."

bag_ban_the_faith_of_glow: "Заборонити культ Сяйва"
bag_ban_the_faith_of_glow_desc: "Культ «Великого Сяйливого» – це зграйка небезпечних фанатиків. Вони примусово гулізують людей, прибиваючи їх до хрестів біля свого «святого місця» – радіоактивного пекла. Цьому збоченню не місце в цивілізованому суспільстві. Ліквідувати їхнє керівництво й розігнати паству."

bag_operation_darnall: "Проєкт: Дарнелл"
bag_operation_darnall_desc: "Наша локалізована станція очищення від радіації розташується поблизу [249.GetName], щоб випробувати новітні рішення цієї проблеми. Це місце ідеально підходить – у ньому міститься гігантська вирва від бомби, наповнена світним радіоактивним брудом. Очищення отруйного озера потішить і місцевих. Бригадний генерал Дарнелл був би гордий."

bag_eastward_expansion: "Східне розширення зони окупації"
bag_eastward_expansion_desc: "Зона окупації розширюватиметься на схід – на колишні землі Виснажених Псів. Тут досі живуть колишні нацгвардійці, південні гули-біженці та навіть китайські залишенці. Очікуємо формування серйозного руху спротиву."

bag_deal_with_national_guard_remnants: "Укласти угоду з залишками нацгвардії"
bag_deal_with_national_guard_remnants_desc: "Попри наше початкове ставлення до гулів, залишки Національної гвардії виявилися порядними людьми. Вони воювали за правильну справу під неправильним проводом. Ми можемо інтегрувати їх у наші сили."

bag_finish_war: "Завершити янкі-сінський конфлікт"
bag_finish_war_desc: "Сіно-американська війна закінчилась давно, але ці гули, здається, хочуть пережити її знову. Покладемо край привиду комунізму раз і назавжди."
bag_finish_war_tt: "§RСмерть – краща альтернатива комунізму!§!"

bag_pacification_of_ghoul_lands: "Підкорення Колорадського фронтиру"
bag_pacification_of_ghoul_lands_desc: "Північний Колорадо майже повністю під нашим контролем. Полковник Піплз вміє придушувати повстання, а докторка Агнес виявилась чудовою адміністраторкою та миротворицею. Ми тут надовго."

bag_start_of_beautiful_friendship: "Початок прекрасної дружби"
bag_start_of_beautiful_friendship_desc: "Ця співпраця почалась не з найкращих нот, але завершилась краще, ніж ми очікували. Різні громади Чорного Каньйону стали чудовими торговими партнерами та ще кращими друзями. Схоже, це справді початок прекрасної дружби."

bag_mutual_defense_pact: "Пакт взаємної оборони"
bag_mutual_defense_pact_desc: "Чорний Каньйон – надійний партнер. Вони більше не претендують на наш бік Скелястих гір. Разом ми можемо захищати одне одного та рухатись до власної долі."

bag_joint_defense_council: "Спільна рада оборони"
bag_joint_defense_council_desc: "Ми добре знаємося на передвоєнній військовій тактиці, а люди з Чорного Каньйону – на тому, як користатися з землі. Нам є чому вчитися одне в одного."

bag_share_military_expertise: "Обмінятись військовим досвідом"
bag_share_military_expertise_desc: "Наші командири починають порозумітися. Дивні дружби народжуються в казармах – приміром, між супермутантом Блекджеком та нашим Ларсеном, який, схоже, добре себе почуває поруч із зеленим велетнем."

bag_join_the_republic_together: "Разом вступити до Республіки"
bag_join_the_republic_together_desc: "Ми знову зв’язалися з серцем Каліфорнії, і це стало можливим завдяки нашим союзникам. Найменше, що ми можемо зробити – це поручитися за них і допомогти вступити до Республіки на їхніх умовах."

bag_introduce_far_go_traders: "Представити торговців Фар-Ґо"
bag_introduce_far_go_traders_desc: "Торговці Фар-Ґо походять з Хаба, як і багато інших. Вони неофіційно профінансували значну частину нашої експедиції, а деякі їхні представники досі з нами. Відкривши для них новий ринок, усі тільки виграють."

bag_showcase_gun_runner_merchandise: "Показати товари Ґан Раннерів"
bag_showcase_gun_runner_merchandise_desc: "На жаль, серед нас немає справжнього Ґан Раннера, але ми маємо їхню зброю. Не таку велику партію, щоб переламати ситуацію, але достатню для вигідного продажу Чорному Каньйону. Просто не кажіть їм, що це підробка. Якість справжня, а от логотипи не збігаються."

bag_shared_market: "Республіканський ринок"
bag_shared_market_desc: "Чорний Каньйон опинився в скруті – ізольований у горах без торгівлі. На щастя, ми опинились поруч – і, можливо, трохи на цьому заробили. Їхня залежність від нас – ключ до більших можливостей."

bag_joint_public_works: "Спільні програми громадських робіт"
bag_joint_public_works_desc: "Попереду – чимало роботи. Ми маємо знання та техніку, Чорний Каньйон – робочі руки. Разом ми зможемо підняти обидва наші краї."

bag_host_caravan: "Прийняти караван у вигнанні"
bag_host_caravan_desc: "Часи видались важкими для каравану з Чорного Каньйону. Наші друзі можуть оселитися тут, якщо їм більше нікуди йти."

bag_operation_prison_break: "Операція: втеча з в'язниці"
bag_operation_prison_break_desc: "Лідер Чорного Каньйону, Батарея з Меса Верде, – відомий дипломат і прихильник миру. Якщо ми запропонуємо вигідну угоду в обмін на передачу чи доступ до Купола Боулдера, ми зможемо уникнути кровопролиття."
bag_operation_prison_break_tt: "Ми почнемо дипломатичне вирішення конфлікту з §Y[BLC.GetNameWithFlag]§! через серію подій."

bag_boulder_bargain: "Почати торг за Боулдер"
bag_boulder_bargain_desc: "Докторка Агнес зголосилася бути нашою представницею у перемовинах із державою §Y[BLC.GetNameWithFlag]§!. Вона переконана, що зможе досягти мирної угоди. §Y[572.GetName]§! прийняв її на своїх Зборах, і ми встановили офіційний дипломатичний контакт."

bag_dome_deal: "Купольна авантюра"
bag_dome_deal_desc: "Агнес пішла на великий ризик, прохаючи надто багато – але після ряду обіцянок, які ми, можливо, навіть не зможемо виконати, вони погодилися на наші умови. Можливо, це матиме важкі наслідки в майбутньому, але головне – Купол знову наш!"

bag_city_for_everyone: "Осушення зеленого багна"
bag_city_for_everyone_desc: "Світляки, може, й радісно жили в руїнах Боулдера, але не всі мають розкіш бути стійкими до радіації. Вони не заперечуватимуть, якщо ми приберемо все це світне сміття."

bag_lend_lease_land: "Земельна ленд-ліза"
bag_lend_lease_land_desc: "Агнес обрала безпечніший та реалістичніший шлях – отримати дозвіл на вільний прохід до Купола. Ми втратили шанс бути одноосібними хазяями над об'єктом, але здобули друга на майбутнє."

bag_international_benefits: "Міжнародні вигоди"
bag_international_benefits_desc: "Послабивши напруження, ми нарешті відкрили торгівлю зі Світляками. Люди можуть вільно пересуватись через кордон, і поселення обох держав розвиваються. Це принесе користь усім."

bag_other_end_of_deal: "Інший бік домовленості"
bag_other_end_of_deal_desc: "Як би ми не домовлялись, Чорний Каньйон уже виконав свою частину угоди. Тепер наш черга. Звісно, ми можемо затягнути… можливо, навіть безкінечно."
bag_other_end_of_deal_tt: "§RЯкщо не виконати цей фокус протягом трьох місяців після угоди, вони вважатимуть, що нас зрадили, й нападуть!§!"

bag_operation_firefly: "Операція: Світлячок"
bag_operation_firefly_desc: "Медом більше мух наловиш… і світлячків також. Якщо використати солодкі слова, ми отримаємо те, чого хочемо, без бою."
bag_operation_firefly_tt: "Ми почнемо дипломатичне розв'язання конфлікту з §Y[GLW.GetNameWithFlag]§! через серію подій."

bag_pragmatic_attitude: "Прагматичне ставлення"
bag_pragmatic_attitude_desc: "Чорний Каньйон – поза грою. Нам слід змінити підхід…"

bag_boulder_exploitation_scheme: "Схема експлуатації Боулдера"
bag_boulder_exploitation_scheme_desc: "Ми можемо отримати з Купола Боулдера набагато більше – і вони це знають. Просто дозвольте нам керувати процесом, і всі отримають зиск."

bag_changing_economical_policies: "Зміна економічної політики"
bag_changing_economical_policies_desc: "Це називається «протекціонізм»."

bag_boulder_research_initiative: "Боулдерська наукова ініціатива"
bag_boulder_research_initiative_desc: "Співпраця може дати великі результати! Вони ж певно щось дізнались, поки «сиділи» біля Купола, так?"

bag_joint_industrial_development: "Спільний промисловий розвиток"
bag_joint_industrial_development_desc: "Основою кожного підприємницького розвитку є хороші партнери."

bag_fool_me_once: "Обдурили раз…"
bag_fool_me_once_desc: "Світляки вже виконали свою частину, а тепер – наша черга. Але, можливо, ми можемо відтермінувати… або й забути про цю «обов’язковість» назавжди."

bag_operation_can_opener: "Операція: Консервний ніж"
bag_operation_can_opener_desc: "Більшість Експедиції не хоче витрачати час на другорядні цілі. Але генерал упевнений: ми можемо захопити землі Залізного Альянсу. Їхні склади з бронею та зброєю – безцінні активи, навіть якщо інші будуть невдоволені."

bag_patrol_perimeter: "Патрулювання периметру"
bag_patrol_perimeter_desc: "Нью-Стерлінг – не єдине поселення найманців. Вони також контролювали кілька хуторів на північ. Угода з БуллітІтером уберегла їх від набігів – в обмін на харчі. Гарнізони здалися швидко. Це було найлегше завдання в кампанії."

bag_new_sterling_industry: "Печі пекла"
bag_new_sterling_industry_desc: "Нью-Стерлінг збудований для рейдерів і найманців. Тут було повно майстерень, де раби лагодили спорядження. Хоч це й викликає жах у місцевих, ми можемо використати ці виробничі потужності – тільки тепер із оплатою й вихідними."

bag_form_ghoul_workbattalions: "Гульські трудові батальйони"
bag_form_ghoul_workbattalions_desc: "У місті повно порожніх майстерень. Ми також маємо чимало гулів, затриманих за підтримку диких чи підозру в дикості. У цивілізованому світі ми б їх ув’язнили. Але ми не в такому світі. Дати їм просто згнити – це марнотратство."

bag_following_oliver_doctrine: "У руслі доктрини Олівера"
bag_following_oliver_doctrine_desc: "Хоча Колерідж мав чимало суперечок із колегами в Каліфорнії, з генералом Олівером їх єднало одне: майбутнє Республіки – в «важких піхотинцях». І тепер, маючи необхідне спорядження, ми зможемо втілити цю ідею в життя."

bag_load_iron_conscripts_tt: "§gМи завербуємо та призвемо дві дивізії персоналу Залізного альянсу до лав наших Сталевих рейнджерів!§!"
bag_alt_iron_conscripts_tt: "§gМи завербуємо частину персоналу Залізного альянсу. §OЯкщо ми спершу впровадимо концепт Сталевих рейнджерів, зможемо використати їхній досвід там!§!"

bag_sterling_FOB: "Форпост Стерлінг"
bag_sterling_FOB_desc: "[453.GetName] – хороший штаб, але вразливий і не має великого стратегічного значення. Стерлінг натомість добре обороняється й має індустрію. Тимчасово ми перенесемося туди – а згодом, можливо, й назавжди."

bag_conclude_operation_can_opener: "Завершити операцію «Консервний ніж»"
bag_conclude_operation_can_opener_desc: "Ми закінчили всі справи на цих землях і можемо повернутись до першочергової мети."

bag_operation_agincourt: "Операція: Азенкур"
bag_operation_agincourt_desc: "Бріггс має геніальні ідеї… здебільшого вибухівку… дуже багато вибухівки…"
bag_operation_agincourt_tt: "§gМи відправимо агента на диверсійну місію, яка серйозно вдарить по військовій індустрії ворога!§!"

bag_operational_preparation: "Оперативна підготовка"
bag_operational_preparation_desc: "Годинник цокає. Нам слід ретельно підготуватися, перш ніж знову братися за Купол. Єдине, чого менше, ніж часу, – це права на помилку."

bag_steel_wave: "Початок сталевої хвилі"
bag_steel_wave_desc: "Ми змиємо пустку кров’ю і сталлю!"

bag_utilize_anti_brotherhood_special_equipment: "Спецзасоби проти Братства"
bag_utilize_anti_brotherhood_special_equipment_desc: "Ці «консервні ножі» прорізають не тільки броню Братства!"

bag_military_service_for_citizenship: "Служба за громадянство"
bag_military_service_for_citizenship_desc: "Республіка тут, і ми залишимось. Ми принесемо закон, порядок і добробут у ці землі. І якщо ти вступиш до лав армії та боротимешся за цю мрію – отримаєш громадянство. Життя в пустці стане вдесятеро легшим… після завершення служби, звісно."

bag_coal_for_furnace_of_war: "Вугілля до горна війни"
bag_coal_for_furnace_of_war_desc: "Металеві печі кують металеву зброю, що вбиває металевих солдатів. І так знову, і знову."

bag_reorganization_of_rangers: "Реорганізація рейнджерів"
bag_reorganization_of_rangers_desc: "Загін рейнджерів під командуванням майора Прасад добре послужив нам, але зазнав втрат. Ми маємо реорганізувати спецпризначенців, щоб розширити їхні ряди."

bag_merge_them_with_ghoul_rangers: "Об’єднати «Команду Листопад» з Ґамма-корпусом"
bag_merge_them_with_ghoul_rangers_desc: "Об’єднавши ці два підрозділи, ми спростимо управління ними, а рейнджери з Каліфорнії зможуть навчитися нового у гулів."
bag_merge_them_with_ghoul_rangers_tt: "§y«Команда Листопад» вливається до лав Ґамма-рейнджерів, отримавши вигоду з їхньої радіостійкості!§!"

bag_implement_steel_rangers_concept: "Впровадити концепцію «Сталевих рейнджерів»"
bag_implement_steel_rangers_concept_desc: "У Каліфорнії Колерідж і Олівер міркували, як краще використати силову броню Братства. Вони вважали, що таке спорядження мають носити лише найкращі – рейнджери Республіки. Хоча ідею визнали нереалістичною, в Колорадо Колерідж вільний реалізувати її за власним розсудом."
bag_load_steel_ranger_oob_tt: "§OМи також розгорнемо тестову групу Сталевих рейнджерів, яка допомагала випробовувати броню!§!"

bag_coloradan_ranger_hq: "Штаб рейнджерів Колорадо"
bag_coloradan_ranger_hq_desc: "Централізація наших спецпризначенців завершена. Щоб зберегти цю структуру, нам потрібно створити окремий орган для управління ними – на зразок штабу рейнджерів у Каліфорнії."

bag_operation_homerun: "Операція: Хоумран"
bag_operation_homerun_desc: "Після багатьох несподіванок і затримок ми знову стоїмо перед Куполом. Ми чекали цього моменту понад два десятиліття. І ось він – нарешті."

bag_divide_et_impera: "Divide et Impera"
bag_divide_et_impera_desc: "Світляки – не союзники Чорного Каньйону. Якщо ми схилимо їх на свій бік, вони можуть залишити свого «повелителя». Розділяй і володарюй."
BAG_just_kill_glw_tt: "§RОскільки могутній захисник Світляків загинув, терпіти їх більше не потрібно. Прямий контроль над Куполом – найефективніше рішення!§!"

bag_operation_bulletstorm: "Офензива «Кулявія»"
bag_operation_bulletstorm_desc: "Офензива «Кулявія» – така ж пряма, як і її назва. Повним залпом, усім, що маємо, ми візьмемо Купол одним грандіозним наступом. Переможемо зі стилем. Шок і трепет."

bag_homecoming: "Повернення додому"
bag_homecoming_desc: "Шоу починається."

bag_finally_home: "Нарешті вдома"
bag_finally_home_desc: "Після більш ніж двадцяти років ми знову ступили в Боулдер. На диво, він майже не змінився. Часу обмаль – хтось, принесіть каву, почнемо відновлення порядку."

bag_camp_nicole: "Табір «Ніколь»"
bag_camp_nicole_desc: "Табір «Ніколь» стане опорною базою для наших науковців – на безпечній відстані від радіації навколо Купола."

bag_fort_aradesh: "Відновити форт Танді"
bag_fort_aradesh_desc: "Перша експедиція запам’яталась не лише відкриттями [BAG.BAG_GODDARD.GetName], а й тим, що залишив [BAG.BAG_COLERIDGE.GetName]. У місті Форт-Коллінз він збудував справжню фортецю – форт Танді, як данину історії. Вона занепала після нашого відступу. Але настав час повернути її – і змити ганьбу."

bag_contact_californian_government: "Встановити зв’язок з урядом Каліфорнії"
bag_contact_californian_government_desc: "Маючи контроль над Куполом, ми повинні поновити контакт із Каліфорнією. Навіть якщо зв'язок був слабкий через відстань, після стількох років вони будуть раді почути нас. І, можливо, надішлють допомогу."

bag_contact_ncr_tt: "§gМи відправимо кур’єрів до §Y[253.GetName]§!, щоб сповістити президента (хто б ним не був), що ми живі й повернули контроль над Куполом. Якщо пощастить – отримаємо подяку та, можливо, трохи допомоги. Але не варто чекати постійної підтримки – ми ж за три штати звідти!§!"

bag_republican_compromise: "Республіканський компроміс"
bag_republican_compromise_desc: "Джозеф Додж, колишній віцегубернатор Хаба й посередній конгресмен, прибув як новий губернатор Колорадо. У рідному місті він здобув популярність, борючись з бандами й обмежуючи вплив торгових домів у політиці."

bag_revitalize_caravan_trade_act: "Відновити акт караванної торгівлі"
bag_revitalize_caravan_trade_act_desc: "Кожен живе завдяки обміну. Якщо ми хочемо процвітати – торгівля має розпочатися негайно. Якщо ми підтримаємо нашу Караванну компанію Колорадо, можливо, зможемо втримати позиції."

bag_organize_police_force: "Закон про цивільну поліцію"
bag_organize_police_force_desc: "Військова поліція НКРА добре справляється з порядком, але рано чи пізно нам доведеться її відкликати. За досвідом Доджа у боротьбі з бандами в Хабі, створимо цивільну поліцію до того, як з’являться кримінальні барони."

bag_capital_development: "Акт «Новий Хаб»"
bag_capital_development_desc: "Хаб – добре сплановане місто, попри довоєнне походження. Це цілком можливо повторити з дисципліною… та олівцем."
bag_capital_development_tt: "Ефект цього фокусу §Gактивується§! після вибору нової постійної столиці."

bag_coloradan_choice: "Вибір Колорадо"
bag_coloradan_choice_desc: "З самого початку ми передали щоденні справи Аґнес. Без політичної підтримки з боку НКР, вона – найкращий варіант для місцевого губернатора."

bag_ban_recreational_drugs: "Заборонити рекреаційні наркотики"
bag_ban_recreational_drugs_desc: "Іллегальні речовини – не завжди зло. Деякі з них мають терапевтичне чи медичне застосування. Але рекреаційне вживання несе надто багато проблем. Якщо ми хочемо побудувати стабільну демократію – цього треба позбутися."

bag_provide_universal_healtcare: "Забезпечити універсальну медицину"
bag_provide_universal_healtcare_desc: "Організувати таку систему в самій Каліфорнії було б неможливо. Але тут, поки наша економіка ще не переплетена з приватниками – ми можемо зробити це реальністю."

bag_train_medics: "Гіркий тонік першої допомоги"
bag_train_medics_desc: "Гіркий напій – винахід племені Близнюків. Кажуть, Легіон теж його використовує. Якщо ми зможемо впровадити цей тонік, це значно підвищить виживаність наших військ."

bag_barons_pick: "Людина баронів"
bag_barons_pick_desc: "Дж. П. Баросс – представник Баронів у Каліфорнії, прибув як новий губернатор. Його кар’єра розквітла завдяки залізничним проєктам і відданості Антону Флінну. Це може стати як катастрофою, так і шансом."

bag_organize_sharecrop_system: "Впровадити закон Талера"
bag_organize_sharecrop_system_desc: "Суть системи – надати селянам землю, захист і воду в обмін на врожай. Великий рівнинний регіон – пустий і мізерний, тому без організації ми швидко залишимось без їжі."

bag_lax_brahmin_laws: "Запровадити м’яке законодавство про брамінів"
bag_lax_brahmin_laws_desc: "Після того як Венделл Пітерсон скасував регулювання поголів’я худоби, запроваджене президенткою Танді, барони здобули значну владу. Великі рівнини Колорадо – це безмежні пасовища, придатні хіба для випасу. Природним кроком видається передати ці землі великим землевласникам."

bag_local_department_of_railway: "Місцевий відділ залізниць"
bag_local_department_of_railway_desc: "Залізниця – для Баросса не лише пристрасть, а й життєва необхідність у цьому виснаженому світі. Залишки ресурсів слід використовувати з максимальною користю, а це означає масові перевезення та злагоджену логістику. Його мрія про пасажирську лінію до узбережжя колись стане дійсністю…"

bag_capital_of_republic: "Столиця Нової Республіки"
bag_capital_of_republic_desc: "Нашій молодій республіці потрібен власний Шейді Сендс. Маємо кілька гідних кандидатів."
bag_capital_of_republic_decisions_tt: "Відкриває рішення §Y«Обрати нову столицю»§!."

bag_new_colorado_republic: "Проголосити Нову Колорадську Республіку"
bag_new_colorado_republic_desc: "Губернатор уже обійняв свою посаду й завершив перші ключові справи. Ми готові проголосити створення Нової Колорадської Республіки."

bag_flag_of_republic: "Пісня нашого народу"
bag_flag_of_republic_desc: "Національний гімн допоможе згуртувати наших нових громадян – у пісні й у цілі."

bag_free_elections: "Святкувати демократичний процес"
bag_free_elections_desc: "Ця славетна каліфорнійська традиція стане спадком і для нашої республіки."

# Boulder Dome

bag_fill_out_damage_report: "Операція: «Кам'яна пробіжка»"
bag_fill_out_damage_report_desc: "Купол Боулдера майже не змінився з часу нашого поспішного відступу. Маємо перевірити всі системи, з’ясувати, що втрачено, а що можна врятувати."
bag_fill_out_damage_report_tt: "Відкриває §Yінтерфейс «Купол Боулдера»§! – замінює механіку §Y«Баланс влади Експедиції»§!."

bag_venture_under_dome: "Відновити перший рівень"
bag_venture_under_dome_desc: "«Полиш надію, кожен, хто входить сюди!»\n\nДосить точно. Пекло чекає на нас, панове."

bag_access_water_storage: "Отримати доступ до водосховища"
bag_access_water_storage_desc: "§g«Я – Альфа й Омега, початок і кінець. Хто прагне – дам йому даром від джерела води життя».§!\nСистема Купола щоденно очищає та знерадіює велику кількість води. Попри те, що її ремонт здається нудною справою – це життєво необхідно."

bag_turn_on_lights: "Увімкнути освітлення"
bag_turn_on_lights_desc: "Перш ніж відновлювати внутрішні системи Купола, нам потрібне джерело живлення. Невелика електростанція за межами комплексу підійде."

bag_rediscover_second_level: "Відновити другий рівень"
bag_rediscover_second_level_desc: "Пройшовши перший рівень, ми готові зануритись глибше. Тут – дослідження зброї й броні, чума, експерименти з мозком… справжній науковий рай, покинутий у поспіху."

bag_first_batch_of_t61: "Перші зразки прототипу броні"
bag_first_batch_of_t61_desc: "Найбільш нетиповою постаттю в Куполі був доктор Армстронґ – інженер, що мріяв про передові силові обладунки й високотехнологічну електроніку. Як така людина потрапила в медичну дослідницьку базу – загадка. Але його роботу завершимо ми!"
bag_first_batch_of_t61_tt: "§gМайстерні готові зібрати перші комплекти Боулдерської СБ. Залишилось лише знайти креслення… десь §Rусередині Купола§!.§!"

bag_restart_code_protocol: "Перезапустити протокол «CODE»"
bag_restart_code_protocol_desc: "Ґоддард і Колерідж сперечались про все, окрім одного: «§RМета виправдовує засоби.§!»"
bag_restart_code_protocol_tt: "Щомісяця отримаємо §G30§! функціональних мозків із добровольців, полонених чи полів бою. Їх можна буде §Yвикористати для створення роботизованих мозків§!."

bag_rediscover_third_level: "Прогулянка третім рівнем"
bag_rediscover_third_level_desc: "Третій рівень завжди був дивним – попри важливі дослідження, він лишався переважно забутим. Тепер у нас є час, аби все ретельно оглянути…"

bag_restart_fabricators: "Запустити фабрикатори плат"
bag_restart_fabricators_desc: "У Куполі розкидано кілька старих машин для виробництва плат. Якщо їх полагодити, ми зможемо запустити майстерню прототипів і розширити виробництво. Якщо хочемо використовувати сучасну зброю – нам потрібні плати!"

bag_project_hermes: "Проєкт: «Гермес»"
bag_project_hermes_desc: "Дослідження рушійної тяги на третьому рівні були амбітними, але хибними. Цю технологію можна було б використати для революції в аеронавтиці, та її витратили на ракетні мрії про космос. Цю помилку виправлять наші інженери."

bag_project_hermes_tt: "\n§gНашій колонії на Марсі доведеться ще трохи почекати. Зустрінемось у Stellaris!§!"

bag_rediscover_fourth_tunnel_level: "Відновити тунелі Боулдера"
bag_rediscover_fourth_tunnel_level_desc: "Тунелі були, мабуть, найогиднішою частиною Купола. Вузькі коридори, клаустрофобні костюми, підвішені до стелі, й усі ці дивні капсули Сплячих… як із фільму жахів. Але саме там заховано найвищу ціну."

bag_smelt_the_rubble: "Переплавити уламки"
bag_smelt_the_rubble_desc: "Від зруйнованих лабораторій до закинутих майстерень – Купол перебуває в жахливому стані. Усе врятувати не вдасться. Але пошкоджене обладнання можна переробити. Переплавити й використати!"

bag_restart_power_grid: "Перезапустити енергомережу"
bag_restart_power_grid_desc: "Енергосистема Купола виявилась несподівано складною. Її ремонт коштував нам масу ресурсів і часу. Але тепер, коли ми розібрались у її суті, зможемо оновити всі наші генератори для більшої ефективності."

bag_rediscover_fifth_zax_mainframe_level: "Відновити головний модуль ZAX"
bag_rediscover_fifth_zax_mainframe_level_desc: "Нарешті, після стількох років... Я знову знайшов тебе..."

# Приборкання Скелястих гір

bag_taming_rockies: "Приборкати Скелясті гори"
bag_taming_rockies_desc: "Ми не мали планів щодо територій за Скелястими, але вони стояли між нами й Куполом. Наші війська зайняли головні поселення, але їхнє утримання – тягар для обмежених ресурсів. Придеться або надати автономію, або оптимізувати гарнізонну модель."

bag_connect_to_californian_fleet: "Налагодити зв’язок із флотом Каліфорнії"
bag_connect_to_californian_fleet_desc: "Найпростіший спосіб зв’язатися з Каліфорнією – через річку Колорадо. Звісно, це можливо лише після того, як ми забезпечимо контроль над портами."

bag_partake_in_water_wars: "Участь у Водяних війнах"
bag_partake_in_water_wars_desc: "Війна між Республікою та Легіоном – лише питання часу. Наш обов’язок – допомогти Каліфорнії. Попри брак сил, ми можемо збудувати власний річковий флот і відволікти ворога від греблі."
bag_partake_in_water_wars_tt: "Вся національна територія §Y[SLE.GetNameDef]§!, §Y[TOB.GetNameDef]§! і §Y[ORO.GetNameDef]§! належить §Y[BAG.GetNameDef]§!, їхнім підданим або союзникам."

bag_provide_limited_autonomy: "Надати обмежену автономію"
bag_provide_limited_autonomy_desc: "Чорний Каньйон завжди діяв децентралізовано, й примусове запровадження іншої системи спричинить більше проблем, ніж користі. Ми визнаємо їхню автономію – тимчасово. І вони ще навчаться любити життя в нашій спільноті."

bag_enforce_centralized_structure: "Нав'язати централізовану структуру"
bag_enforce_centralized_structure_desc: "Чорний Каньйон був неефективним саме через надмірну децентралізацію. Якщо дозволимо їм знову самоврядування – потонемо в бюрократії. Керуємо з центру."

bag_pacifying_raider_lands_tt: "§gОтримаєте §Y-25%§! до вартості інтеграції територій колишньої §Y[§!§Y[BLC.GetNameWithFlag]§!]§!.§!"

bag_handle_little_wyoming: "Впорядкувати Малий Вайомінґ"
bag_handle_little_wyoming_desc: "Північні держави від Чорного Каньйону, місцево звані «Малим Вайомінґом», від початку мають більше спільного з нами. Їхня інтеграція – лише питання часу."

bag_colonize_borderlands: "Колонізувати прикордоння"
bag_colonize_borderlands_desc: "Окрім Ролінса, ці землі малозаселені й сповнені потенціалу. Надішлемо туди відважних поселенців, щоб розбудувати Малий Вайомінґ і закріпити контроль над ним."

bag_second_rockies_push: "Друга кампанія в Скелястих"
bag_second_rockies_push_desc: "Решта Скелястих гір – стиглі плоди. Підкорення місцевих племен і забезпечення контролю над перевалами – справа національної безпеки."

bag_in_the_shadow_of_the_mountain: "У тіні гори"
bag_in_the_shadow_of_the_mountain_desc: "Одного дня справжня війна прийде сюди. Не як наші чистенькі кампанії, а кривава, безжальна. Щоб захистити кордони майбутнього – треба працювати вже: будувати форти, зміцнювати стіни, забезпечувати лінії постачання."
bag_in_the_shadow_of_the_mountain_tt: "Уся національна територія §Y[FOR.GetNameDef]§!, §Y[CLJ.GetNameDef]§! і §Y[INR.GetNameDef]§! належить §Y[BAG.GetNameDef]§!, їхнім підданим або союзникам."

bag_bear_out_of_hibernation: "Ведмідь прокидається"
bag_bear_out_of_hibernation_desc: "До недавна Колорадо перебувало під загрозою вторгнення Легіону. Цю загрозу знято. І тепер відкриваються нові можливості."

bag_bears_domain: "Стежка Колорадо"
bag_bears_domain_desc: "Наші чоботи витоптали цю землю. Тепер залишилось лиш упевнитися, що вона й далі буде під ними."
bag_bears_domain_tt: "Вся національна територія §Y[HAN.GetNameDef]§!, §Y[SCO.GetNameDef]§! і §Y[MXC.GetNameDef]§! належить §Y[BAG.GetNameDef]§!, їхнім підданим або союзникам."

bag_exploit_tribal_holy_land: "Експлуатувати святі землі племен"
bag_exploit_tribal_holy_land_desc: "Цивілізувати ці землі й зробити їх продуктивними – ще один звичний день для синів Каліфорнії."

bag_incorporate_yampans: "Інтегрувати Коаліцію"
bag_incorporate_yampans_desc: "Ямпанська спільна коаліція – це демократичні, цивілізовані люди. Вони мають обраного лідера, справляють податки та дотримуються законів. Ми можемо без особливих труднощів інтегрувати їх у нашу адміністрацію."

bag_extra_profit_tax: "Обкласти надприбутки податком"
bag_extra_profit_tax_desc: "Ямпанці отримали прибуток від нашого об'єднання. Їхнє розташування на перехресті двох держав зробило їх швидко зростаючим торговельним вузлом. Ми повинні впровадити законодавство, яке дозволить перенаправити частину їхніх надприбутків до нашої скарбниці."
bag_integrating_yampan_lands_tt: "§gОтримаєте §Y-50%§! до вартості інтеграції територій колишньої §Y[YMP.GetNameWithFlag]§!.§!"

bag_seize_caravan_assets: "Конфіскувати активи Каравану"
bag_seize_caravan_assets_desc: "Караван мав значний вплив, який використав для отримання контролю над багатьма активами. Вони більше не керують цими землями. Раз ми виконуємо їхню колишню роль – нам і належать їхні фабрики та майстерні."

bag_life_sentence: "Вирок – довічне ув'язнення"
bag_life_sentence_desc: "Чорний Каньйон скоїв фатальну помилку, ставши союзником рейдерів і злочинців. Ми самі виправимо цю помилку. У них є чудово збережена в'язниця… усе, що нам треба – посадити туди, кого слід."

bag_bring_civilization_for_tribals: "Принести цивілізацію племенам"
bag_bring_civilization_for_tribals_desc: "Племена Розфарбованих – заблудлі люди. У їхньому минулому багато болю та крові, але їхній спосіб життя того не виправдовує. Якщо усунути їхнього проблемного лідера, вони зможуть почати шлях до інтеграції в Республіку. Навіть дивні вірування мають право на місце в наших землях."
bag_bring_civilization_for_tribals_tt: "§gОтримаєте §Y-25%§! до вартості інтеграції територій колишньої §Y[PNT.GetNameWithFlag]§!.§!"

bag_collaborate_with_caravan: "Співпраця з Караваном"
bag_collaborate_with_caravan_desc: "Караван і Батарея намагалися побудувати демократію у Скелястих. Їхня модель була хибною, але самі вони заслуговують на другий шанс. Вони можуть допомогти нам в управлінні цими землями."

bag_dissolve_the_coalition: "Розпустити Коаліцію"
bag_dissolve_the_coalition_desc: "Коаліція починалась як відображення НКР, але її демократичні інститути загрузли в корупції. Усунувши «лорд-мера» та вичистивши систему, ми зможемо реалізувати їхню мрію разом."
bag_dissolve_the_coalition_tt: "§gОтримаєте §Y-25%§! до вартості інтеграції територій колишньої §Y[YMP.GetNameWithFlag]§!.§!"

bag_collaborate_with_mining_enterprises: "Співпраця з гірничими компаніями"
bag_collaborate_with_mining_enterprises_desc: "Місцеві магнати й підрядники готові працювати з нами заради прибутку. Чому б не скористатися з цього? І сировина, і гроші – на нашому боці."

bag_prisoner_shakedown: "Темна зачистка"
bag_prisoner_shakedown_desc: "Попри ув’язнення, деякі регіональні злочинці й далі мають вплив. Зачистка дозволить відрізати їх від зовнішнього світу та зміцнити наш контроль над економікою регіону."

bag_final_destination: "Наша власна «Макс-Сек»"
bag_final_destination_desc: "НКР має чимало віддалених в'язниць. Дехто назве це тривожним сигналом, ми ж – можливістю. Засуджені навчаться хорошій поведінці, служачи нашим інтересам."

bag_rockies_homestead_act: "Закон про реорганізацію Скелястих територій"
bag_rockies_homestead_act_desc: "Ми впровадили чимало політик у нових землях, і наш контроль тепер незаперечний. Настав час отримати прибуток. І пам’ятайте: це не крадіжка, якщо копаєш на своєму."
bag_rockies_homestead_act_tt: "Отримаєте §Gодну§! §Yцивільну майстерню§! у кожній осердній області §Y[BLC.GetNameWithFlag]§!, яку ми вже зробили §Gосердною§!."

bag_rocky_mountain_high: "Висота Скелястих гір"
bag_rocky_mountain_high_desc: "Кажуть, десь на сході не перестають співати «Country Roads», але Колорадо знає справжню пісню Джона Денвера. Нехай «Rocky Mountain High» лунає над краєм – світ повинен знати: Республіка перемогла і в війні, і в мирі."

# Гілка Ґоддарда

bag_meritocratic_institutions: "Меритократичні інституції"
bag_meritocratic_institutions_desc: "Давайте визнаємо: саме експерти найкраще розв’язують проблеми майбутнього. Тепер, коли влада в руках Ґоддарда, він забезпечить, щоб найрозумніші посіли своє заслужене місце."

bag_hearts: "Серця..."
bag_hearts_desc: "Ґоддард не вважає себе надто харизматичним, але переконаний: коли люди побачать плоди його просвітленого лідерства, він здобуде й їхні серця."

bag_worth_of_labour: "Цінність праці"
bag_worth_of_labour_desc: "Для кожного, хто працює руками, знайдеться місце. Саме завдяки їм можливе наше майбутнє."

bag_reward_of_skills: "Нагорода для здібних"
bag_reward_of_skills_desc: "Ті, хто здатен зробити світ кращим, мають бути заохочені до цього. Як же це було б трагічно – дати таланту марнуватися в безвісті."

bag_offer_coloradan_dream: "Запропонувати колорадську мрію"
bag_offer_coloradan_dream_desc: "У нас є унікальна можливість створити штат, присвячений подоланню помилок минулого через далекоглядність та розум. Хто відмовиться стати частиною такого блискучого майбутнього?"

bag_minds: "... і розуми"
bag_minds_desc: "Блискучі уми, що очолили цю експедицію – ключ до майбутнього, якого ми прагнемо. А ще – до безпеки нашого проєкту від тих, хто бажає йому зла!"

bag_reopen_colorado_university: "Відкрити Колорадський університет"
bag_reopen_colorado_university_desc: "Колорадо мав гідні академічні заклади, поки їх не спопелив вогонь. Відбудова цих інституцій критично важлива для нашої справи."

bag_repurpose_goat_test: "Адаптувати тест КОЗА"
bag_repurpose_goat_test_desc: "Тест КОЗА може здатися дивним невтаємниченим, але в ньому – велика мудрість. Треба лише оновити його під наш новий вік."

bag_follow_vault_city_example: "Слідувати прикладу Сховищеміста"
bag_follow_vault_city_example_desc: "Ґоддард із задоволенням згадує свої візити до Сховищеміста. Значно чистіше, ніж брудні каліфорнійські містечка. Нашій столиці не завадило б дещо перейняти з їхнього досвіду управління."

bag_servant_class: "Слугинський устрій"
bag_servant_class_desc: "Люди морщаться від слова «слуга», хоча завжди були ними. Що краще: гнити за ковпак у розваленій майстерні чи виконувати змістовну працю під керівництвом освічених провідників? Вибір очевидний."

bag_operation_deep_thought: "Операція «Глибока Думка»"
bag_operation_deep_thought_desc: "Один ZAX – це потужна машина, але що як з’єднати кілька таких у Супер-ZAX? Для цього ми маємо дістати інші екземпляри і зібрати їх тут, де вони справді потрібні."

bag_walk_in_paradise: "Прогулянка у рай"
bag_walk_in_paradise_desc: "Теплиця Ґрінвею – справжній райський куточок. Але рай без сенсу – нічого. Ми прагнемо до вищого розуміння."

bag_no_gods_upon_olympus: "Ніяких богів на Олімпі"
bag_no_gods_upon_olympus_desc: "Говорити про Богиню в Сховищі – кумедно, та вона лише проєкція світла. І її технології підуть на кращу справу."

bag_open_the_box_wide_open: "Розкрити ящик повністю"
bag_open_the_box_wide_open_desc: "Невикористане багатство Денвера – це комп'ютер неймовірної потужності. Тепер він наш, і ми зробимо його ще потужнішим!"

bag_ultimate_question: "§4Останнє питання§!"
bag_ultimate_question_desc: "Те саме §4питання§!, що Віктор Преспер поставив першому ZAX'у, майже знищивши його та весь Купол. Але тепер наш Супер-ZAX готовий дати §5відповідь!§!"
BAG_zax_temp_unavailable_tt: "§gУсі бонуси від ZAX тимчасово зникають, але не хвилюйтесь – вони повернуться сильнішими!§!\n\n§RІ так, якщо ви не врятували Купольний ZAX, цей фокус буде недоступний! Хто ж винен...§!"

bag_superzax_idea_tt: "§gКожні §Y60§! днів §GСупер-ZAX§! просуватиметься у розв'язанні §4питання§!, покращуючи наш національний дух.§!"

bag_life_universe_everything: "Життя, всесвіт і все інше"
bag_life_universe_everything_desc: "Поки ми чекаємо відповідь від нашого Супер-ZAX, є багато інших питань. Наприклад: як Ґоддард може витиснути ще більше з цього фокуса?"

bag_three_laws_of_robotics: "Три закони робототехніки"
bag_three_laws_of_robotics_desc: "1. Робот не може зашкодити людині чи допустити шкоди через бездіяльність.\n2. Робот має слухатись наказів, якщо вони не суперечать Першому закону.\n3. Робот має захищати себе, якщо це не суперечить першим двом законам."

bag_the_answer: "§5Відповідь§!"
bag_the_answer_desc: "Відчуття таке, ніби ми чекали мільйони років на цей момент…"

bag_vault_city_at_the_end_of_universe: "Сховищемісто на краю всесвіту"
bag_vault_city_at_the_end_of_universe_desc: "Минуло багато часу відтоді, як Ґоддард востаннє бачив Сховищемісто. Він не може залишити свою роботу, але може надіслати когось дізнатися, що там відбувається. Можливо, розпочати обмін?"

bag_mostly_harmless: "Переважно нешкідливі"
bag_mostly_harmless_desc: "У Сховищемісті все гаразд! Першою громадянкою досі є Лінетт – донька тієї, що знайома Ґоддарду. Хоча вона й почала дещо змінювати, місто залишилось чистим і впорядкованим."

bag_and_another_thing: "І ще дещо…"
bag_and_another_thing_desc: "Зміни, які Лінетт внесла до системи слуг, цілком можна впровадити й у нас."

bag_salmon_of_doubt: "Сьомга сумніву"
bag_salmon_of_doubt_desc: "Якийсь там Майєр здобув владу у Сховищемісті через... народне голосування. Він дозволив злидням із передмістя брати участь у «демократії». Гидота!"

bag_so_long_and_thanks_for_all_the_fish: "На все добре, і дякуємо за рибу!"
bag_so_long_and_thanks_for_all_the_fish_desc: "Ґоддард – людина науки. Але навіть він бачить цінність у прикладі Маєра. Трішки популізму може допомогти утримати утопію від зазіхань амбітних недолуг."

bag_goddard_dont_panic: "Не панікуй"
bag_goddard_dont_panic_desc: "Сховищемісто захопила якась абсурдна секта, що поклоняється кротокроту! Вони, мабуть, спотворюють це колись чисте місто в усіх можливих сенсах. Огидно!"

bag_goddard_always_bring: "Завжди бери з собою рушник"
bag_goddard_always_bring_desc: "Криза – це лише нагадування, що треба бути обачним. Ґоддард починає відстежувати брудних сільських фанатиків, щоб вчасно виявити подібні загрози. Вони не заскочать нас зненацька!"

bag_hitchhikers_guide_to_colorado: "Путівник автостопника Колорадо"
bag_hitchhikers_guide_to_colorado_desc: "По всьому штату – роботи, роботи і ще раз роботи. Ґоддард хоче їх використати, але терпіти не може, коли вони прикидаються людьми. Це жахливо – це Місто Роботів."

bag_command_and_control_units: "Командні та керувальні одиниці"
bag_command_and_control_units_desc: "Мислячі роботи можуть стати в пригоді будь-якій армії. Та не варто дозволяти їм думати надто багато – щоб не злетіли з глузду."

bag_machinery_restoration_initiative: "Ініціатива МЕХ-ВІД"
bag_machinery_restoration_initiative_desc: "МЕХ-ВІД – Механічна Відновлювальна Ініціатива – давня мета нашої наукової ради. Ми завжди виступали за механічну війну. У цей критичний момент у нас є і причина, і змога випробувати її. Між Зоною карантину, Денвером і Містом Роботів – це цілком можливо."

bag_extend_code_protocol: "Розширити протокол КОД"
bag_extend_code_protocol_desc: "Робомізки – геніальний винахід. Але чому б не застосувати цей принцип і до інших роботів? Уявіть лише можливості..."

bag_not_quite_space: "Поки що не космос"
bag_not_quite_space_desc: "Ми не полетимо в космос на цих літаках, але ж кому потрібен космос, коли можна панувати в небі? Цезар не завоює небо. А ми – можемо."

bag_extended_analytics: "Аналітика кампанії в Колорадо"
bag_extended_analytics_desc: "Наші обчислювальні матриці здатні створити неймовірні статистичні моделі для ведення війни."

bag_actual_real_deal: "Справжній реальний розклад"
bag_actual_real_deal_desc: "Колись давно армія роботів діяла звідси. І досі деякі одиниці можна знайти в потрібних місцях. Ми знову зберемо їх для своєї армади."

# Демократія

bag_democracy_in_colorado: "Демократія в Колорадо"
bag_democracy_in_colorado_desc: "Тут, далеко від привілеїв та невдач НКР, ми дамо Колорадо змогу самостійно дихати свободою."

bag_republics_brain: "Мозок Республіки"
bag_republics_brain_desc: "Ґоддард утратив владу, але залишився з нами. Його знання і пристрасть до науки стануть у пригоді при розбудові нашої академічної бази."

bag_academy_in_colorado: "Університет Колорадо"
bag_academy_in_colorado_desc: "Ми не збудуємо новий Бон'ярдський кампус за ніч, але з допомогою Ґоддарда університет у Боулдері стане маяком науки штату."

bag_agnes_medical_school: "Медична програма Агнес"
bag_agnes_medical_school_desc: "Докторка Агнес мріє передати свої знання новому поколінню. Ця медична програма стане першим кроком до цього майбутнього."

bag_californian_authority: "Каліфорнійська влада"
bag_californian_authority_desc: "Губернатор Додж досі з нами. Як ділова людина, він має чимало ідей щодо покращення економіки нашого штату."

bag_traders_life: "Життя торговця"
bag_traders_life_desc: "На базі вже започаткованих ініціатив губернатор Додж просуває низку нових заходів. Його досвід із Габа стане в пригоді для зміцнення нашої торгової системи."

bag_sisters_in_arms: "Сестри по зброї"
bag_sisters_in_arms_desc: "Валентина Мено має схожу історію до Агнес. Її підтримка лише зміцнить зусилля Агнес у розбудові справедливого Колорадо."

bag_extend_universal_healtcare: "Розширити медичну допомогу на не-людей"
bag_extend_universal_healtcare_desc: "Згадуючи власне минуле, Валентина пропонує поширити систему охорони здоров’я на всіх – незалежно від раси, виду чи походження. У вільній країні не має бути місця для дискримінації."

bag_barons_interest: "Зацікавлення Барона"
bag_barons_interest_desc: "Дж. П. Баросс – не той, з ким Агнес хотіла б працювати, але наразі вона змушена. Вона намагатиметься вибудувати з ним робочі стосунки, щоб Колорадо могло скористатись його – хоч і рідкісними – корисними ідеями."

bag_wreck_of_old_ninety_seven: "Руїни Старої «97»"
bag_wreck_of_old_ninety_seven_desc: "По всій Америці валяються останки старих залізниць. Губернатор Баросс пропонує використати це як основу для відновлення залізничного сполучення у Колорадо, ще однієї ініціативи з рідної Каліфорнії."

bag_republics_brawn: "М'язи Республіки"
bag_republics_brawn_desc: "Генерал залишається з нами, аби опікуватися військовими справами. Тепер, коли Агнес очолює країну, він може зосередитись на своїй роботі, не витрачаючи сили на суперечки з Ґоддардом."

bag_military_academy_of_colorado: "Військова академія Колорадо"
bag_military_academy_of_colorado_desc: "Паралельно з розвитком цивільних навчальних закладів, Колерідж заснує військову академію, яка випускатиме офіцерів на роки вперед. \nІронічно, але пропонують назвати її іменем Джоанни Тіббетт – як нагадування, чого слід уникати в командуванні."

bag_agnes_proper_gear: "Готові та захищені"
bag_agnes_proper_gear_desc: "Наші солдати не повинні йти в бій погано оснащеними. Маємо ресурси – тож забезпечимо нашим військам обладнання, не гірше за старе доброї Америки."

bag_agnes_life_in_colorado: "Найновіша республіка"
bag_agnes_life_in_colorado_desc: "У нашій молодій республіці поширюється надія. Зусилля Агнес надихають людей, які тепер дивляться в майбутнє з вірою. Це їхній дім."

bag_agnes_colorado_stockpile: "Арсенал НКР"
bag_agnes_colorado_stockpile_desc: "Ми повинні створити великий запас зброї. Ми – молода республіка, а отже – вразлива. Треба бути готовими."

bag_agnes_building_homes: "Розширення житлового фонду"
bag_agnes_building_homes_desc: "Дім – одна з базових потреб. Подбаємо, щоб у кожного в Колорадо був дах над головою."

bag_agnes_fulfill_needs: "Задовольнити базові потреби"
bag_agnes_fulfill_needs_desc: "Люди з повними шлунками і стабільним побутом – це ті, хто збудує республіку, що вистоїть століття."

bag_agnes_protecting_the_ncr: "У прагненні тривалого миру"
bag_agnes_protecting_the_ncr_desc: "Світ без потреби в укріпленнях був би чудовим, але це не про наші реалії. Стіни, турелі, укріплення – усе це захистить те, що ми збудували."

bag_agnes_weapons_of_democracy: "Гармати демократії"
bag_agnes_weapons_of_democracy_desc: "Можливо, не зможемо озброїти кожен кущ, але зробимо все, щоб захистити наш лад."

bag_agnes_factories_and_fields: "Фабрики та поля"
bag_agnes_factories_and_fields_desc: "Основи будь-якої державної економіки: поля, що годують людей, і фабрики, що дають їм гідне життя."

bag_agnes_employing_locals: "Програми зайнятості"
bag_agnes_employing_locals_desc: "Робота для мешканців Колорадо – в Колорадо!"

bag_agnes_hope_for_downtrodden: "Надія для знедолених"
bag_agnes_hope_for_downtrodden_desc: "Одного дня у кожного буде дім на схилі нашого сяючого пагорба. Просто треба не зупинятись."

bag_agnes_rebuilding_cheyenne: "Відродження втраченої столиці"
bag_agnes_rebuilding_cheyenne_desc: "Шаєнн був столицею довоєнного штату Вайомінг. Можливо, це не частина старого Колорадо, але зусиллями ми зробимо його серцем нового."

bag_cheyenne_rename: "Нова Шаєнн"

bag_agnes_updating_the_army: "Оновлення військової політики"
bag_agnes_updating_the_army_desc: "Агнес не хоче надміру втручатися у справи армії, але має деякі ідеї – зокрема, краще спорядження для наших хлопців."

bag_officiate_colorado_rangers: "Офіційний статус рейнджерів Колорадо"
bag_officiate_colorado_rangers_desc: "Рейнджери були важливою інституцією задовго до НКР. Ми повернемо їм визнання – принаймні в Колорадо!"

bag_agnes_army_of_equals: "Кожен може стати офіцером"
bag_agnes_army_of_equals_desc: "НКР рівноправна, та це не завжди проявляється на практиці. В Колорадо ми гарантуємо, що кожна жінка у формі отримає шанс піднятися вгору."

bag_agnes_guns_and_medicines: "Підтримка для війська"
bag_agnes_guns_and_medicines_desc: "Щоб вижити у бою, солдату потрібна підтримка – медикаменти, інструменти, спорядження. І ми це забезпечимо."

bag_agnes_mighty_wall: "Прикордонне патрулювання"
bag_agnes_mighty_wall_desc: "Ми не зможемо цілком контролювати свої кордони, але принаймні зможемо поставити сторожові пости та організувати патрулі."

bag_agnes_border_wall_tt: "Збудує §G2 рівень§! §YФорпосту§! у кожній нашій прикордонній провінції, якщо вона не межує з союзником."

bag_agnes_saving_lives_firepower: "Рятуймо життя вогневою міццю"
bag_agnes_saving_lives_firepower_desc: "Інвестиції в озброєння можуть здаватися суперечливими, якщо говорити про збереження життів, але зрештою наші солдати повинні мати змогу захистити себе та інших. Ми нічого не досягнемо, дозволивши ворогу вирізати нас."

bag_agnes_colorado_ideals: "Наші колорадські ідеали"
bag_agnes_colorado_ideals_desc: "Ми, безсумнівно, головна держава Колорадо, але не прагнемо нав’язувати себе іншим. Ми поважатимемо й захищатимемо суверенітет наших сусідів, друзів і союзників. Нехай це буде нашим ідеалом."

bag_agnes_best_of_the_best: "Не гірші за аризонських"
bag_agnes_best_of_the_best_desc: "Багато рейнджерів з Аризони полягло, обороняючи свій край від багряної загрози Легіону Цезаря. Ми не дозволимо, щоб ця історія повторилася тут."

bag_agnes_big_republic: "Прапор, що вартий пошани"
bag_agnes_big_republic_desc: "Наша республіка вже не така мала й незначна. Вона має інститути, армії й відчуття гордості за досягнуте. Наші громадяни пам’ятатимуть усе це, коли вклонятимуться нашим стягам, що майорять на вітрі пустки."

bag_agnes_rejoin_ncr: "Наш дім і рідна земля"
bag_agnes_rejoin_ncr_desc: "Нова Каліфорнія готова прийняти нас. Хоча Агнес має сумніви щодо старіючої Республіки, вона не може позбавити каліфорнійців права знову стати єдиними з батьківщиною."

bag_agnes_reaching_allgood: "Там, де серце"
bag_agnes_reaching_allgood_desc: "НКР – місце помилок і поразок. Багато з учасників нашої експедиції це визнають, хоч і кожен по-своєму. Але це наш дім. А що кажуть про дім...?"

bag_agnes_karma_dharma: "Труднощі гартують"
bag_agnes_karma_dharma_desc: "Боляче було чути, що наш рідний край роздерли чвари. Та добра людина підняла його з попелу – Білл Келгун. І ми станемо поряд із ним."

bag_agnes_new_allies: "Шукаючи нове місце в світі"
bag_agnes_new_allies_desc: "У Каліфорнії сталося щось настільки жахливе, що навіть найзапекліші прихильники Республіки не вимагають повернення. Якщо не з Каліфорнією, то з ким? Де ж тоді наше місце у світі?"

bag_agnes_shared_followers: "Спільна спадщина Каліфорнії"
bag_agnes_shared_followers_desc: "Група каліфорнійців, серед яких і багато Послідовників, вирушила далеко на північ і схід у пошуках нового життя. \n\nМи? Так. Але й хани, що йдуть за Амґаланом! Хоча деякі в експедиції мають не найкращі спогади про Ханів, Амґалан змінив їх. Так само, як Агнес змінила Колорадо. Ми природні союзники."

bag_agnes_nebraska_action: "Призначення Куполу завершене"
bag_agnes_nebraska_action_desc: "У землях, які звуться Чумними, зібралася група, що захищає їх і вдосконалює. Купол створено, щоб витримати ядерну війну. Ми можемо подати руку Останньому Оплоту, який досі витримує шаленство пустки."

bag_california_newest_acquisition: "Найновіше надбання Каліфорнії"
bag_california_newest_acquisition_desc: "Колорадо неминуче стане частиною Каліфорнії. Треба лише переконати колорадців, чому це на краще."
    #bag_minister_of_science_and_industry:0 "Minister of Science and Industry"
    #bag_minister_of_science_and_industry_desc:0 "The so-called Academics have had their time to play in their sandbox, but now the adults are back in charge, and we can't have children playing with bombs when they could be researching bigger and better ones. Besides that, kicking their leader upstairs for a promotion in-name-only should let us get what we want, without the whining of the eggheads."
    #bag_offer_olive_branch_to_academics:0 "Offer the Olive Branch to the Academics"
    #bag_offer_olive_branch_to_academics_desc:0 "Goddard may has lost the battle, but he still has a war to wage... on the bureaucratic level. He'll still be able to play around with his microscopes and the majesty of the Boulder Dome, but as long as he doesn't find himself some secret lab to conduct experiments... hey, where'd he go?"
    #bag_sideline_agnes:0 "Exile Agnes Behind a Desk"
    #bag_sideline_agnes_desc:0 "Desk jockeying has always been the most downtrodden job for many in any government, before or after the War. But Agnes doesn't mind. As long as her chair's comfortable, her pen has ink, and she still gets to have a say, she could care less if she's the Tandi of Colorado, giving speeches from podiums, or Agnes of the Mahogany, triple-checking laws and making sure everything goes through the correct systems."
    #bag_situation_of_governor:0 "The Bureaucratics of the Governor"
    #bag_situation_of_governor_desc:0 "It was nice to have power while it lasted, though now comes the hardest part of having power: Giving it away. Or at least regulating it so the loudmouths in Congress don't have another issue to flap their gums about. Making it so the Governor is less the new President and more just a figurehead should reduce everyone's headaches immensely."
    #bag_appoint_head_of_congress:0 "Appoint the Head of Congress"
    #bag_appoint_head_of_congress_desc:0 "We don't have a Hall of Congress here in Colorado, and I'd rather not go through the headache of either building a new one, or going through Congress to get their approval of having a satellite office. So, to give the best of both worlds, appointing a regional Congressman (or woman) should allow for Congress to be satisfied, while allowing us some autonomy. Now to see about getting an intranet signal all the way out here..."
    #bag_man_above_democracy:0 "The Man Above Democracy"
    #bag_man_above_democracy_desc:0 "What was I thinking, trying to appease the fatheads in Congress? They're hundreds of miles away. I'm right here, right now. I can just appoint myself with a fancy title, like "Regent", and then pick somebody as President. Perfect solution, and without the headache of waiting for some dumb approval form or some idiot senator."
    #bag_minister_of_war:0 "Minister of War"
    #bag_minister_of_war_desc:0 "My men have always sought to do best under me, for the Republic. But they also understand the harsh nature of the world, as do I. Thankfully, this is less a deciding who lives and who dies, and who gets to be picked as the big cheese of my planned War Ministry. Davidson is certainly loyal, but Larsen has risen above and beyond the call of duty."
    #bag_puritan_movement_candidate:0 "The Puritan Candidate"
    #bag_puritan_movement_candidate_desc:0 "Larsen has proven himself time and again, he should do it."
    #bag_loyalist_candidate:0 "Appoint the Right-Hand Man"
    #bag_loyalist_candidate_desc:0 "Davidson is like a son to me, and a son should get what they deserve."
    #
bag_dream_of_californication: "Мрія про каліфорнізацію"
bag_dream_of_californication_desc: "НКР – найвеличніша держава пустки. І буде лише доречно, якщо народ Колорадо навчиться переймати каліфорнійську культуру. З часом вони зрозуміють, наскільки це збагачує життя."

bag_appoint_californian_mayors: "Призначити каліфорнійських мерів"
bag_appoint_californian_mayors_desc: "Дехто з державників удома давно мріє вирушити на кордон і ще раз спробувати свої сили в політиці. Міст і селищ у нас більш ніж достатньо для їхніх амбіцій."

bag_coleridge_coring_tt: "Зменшує вартість анексії кожного штату в §YКолорадо§! та §YПівденному Вайомінгу§! на §G20%§!!"

bag_cultural_integration: "Майже Каліфорнія"
bag_cultural_integration_desc: "Тут достатньо людей, які... скажімо, близькі до каліфорнійців. Поселенці, що нагадують ті часи в Шейді. Ми просто допоможемо їм зробити останній крок – і стати синами й дочками Каліфорнії."

bag_teach_pacific_dialect: "Навчити тихоокеанського діалекту"
bag_teach_pacific_dialect_desc: "Повторіть за мною: «Коло-РАДо – це каліфорнійська земля»."

bag_host_boneyardian_radio_shows: "Трансляція Боньярдських радіошоу"
bag_host_boneyardian_radio_shows_desc: "Половина з них буде настільки зачарована самим фактом існування радіо, що й не помітить, як ми їх культурно 'перевиховали'."

bag_adopt_ncr_laws: "Прийняти закони НКР"
bag_adopt_ncr_laws_desc: "Очевидні закони всі розуміють. Але дозвольте розповісти вам про наш податковий кодекс…"

bag_adhere_to_criminal_law: "Дотримуватись кримінального права"
bag_adhere_to_criminal_law_desc: "Треба було платити податки, але ні – вирішили грати жорстко. Тепер наша черга."

bag_open_borders: "Відкрити кордони"
bag_open_borders_desc: "НКР відкрита для всіх, хто готовий інтегруватися в наш спосіб життя."

bag_adhere_to_military_law: "Дотримуватись військового права"
bag_adhere_to_military_law_desc: "Офіцер зобов’язаний служити за стандартами."

bag_economical_integration: "Принести Каліфорнійську мрію"
bag_economical_integration_desc: "Це тепер і ваша мрія, громадяни!"

bag_open_to_free_market: "Відкрити вільний ринок"
bag_open_to_free_market_desc: "Чим вільніший ринок – тим вільніші люди, як кажуть. А ще це дуже прибутково."

bag_fill_water_reserves_for_water_standard: "Виконати норму зберігання води"
bag_fill_water_reserves_for_water_standard_desc: "Закон про стандарти води вимагає від нас зберігати певні об’єми води. Заправляйте танкери!"

bag_adopt_ncr_dollar: "Упровадити долар НКР"
bag_adopt_ncr_dollar_desc: "У мене ціла валіза танді для Колорадо."

bag_military_industrial_complex: "Військово-промисловий комплекс"
bag_military_industrial_complex_desc: "Усі складнощі виробництва легко перенести й сюди."

bag_stable_work_stable_payment: "Опора промисловості"
bag_stable_work_stable_payment_desc: "Нам потрібно більше металу. Більше сьогодні. Більше завтра. Більше – тисячоліттями."

bag_civilian_industrial_complex: "Сильні люди – безпечні люди"
bag_civilian_industrial_complex_desc: "Si vis pacem, para bellum – як сказали б у Легіоні."

bag_operation_umbilical_cord: "Операція: Пуповина"
bag_operation_umbilical_cord_desc: "НКР – це колиска нашої експедиції і покровитель цієї віддаленої території. Пора налагодити стабільний зв’язок – назавжди."

bag_treaty_of_dead_horse_point: "Спробуємо не бити мертвого коня"
bag_treaty_of_dead_horse_point_desc: "Ми намагатимемось діяти м’яко, але їх усе одно доведеться трохи посунути."

bag_old_friends_from_past: "Гіркі прощання"
bag_old_friends_from_past_desc: "Кажуть, Сорроу живуть у гармонії з природою, невинні й захищені від світу. Шкода, що ця ідилія має скінчитись – заради вищої мети."

bag_join_ncr: "Повернення додому"
bag_join_ncr_desc: "Нарешті, наша територія з’єднана з рідною землею. Нас чекає обійми Ведмедя – й ми не відпустимо!"

bag_first_colorado_campaign: "Кампанія в Колорадо"
bag_first_colorado_campaign_desc: ""

every_western_colorado_state: "Усі провінції §YЗахідного Колорадо§!"

bag_northern_front_against_legion: "Північний фронт проти Легіону"
bag_northern_front_against_legion_desc: "Пси Цезаря дісталися Колорадо. Поки НКР готується до війни в Мохаве, наш обов’язок – принести цю війну сюди, на північний фронт!"

bag_secure_our_rubicon: "Закріпитися на нашому Рубіконі"
bag_secure_our_rubicon_desc: "Нам, можливо, й не доведеться переходити річку Колорадо, але перетин цього штату – наше випробування."

bag_bleed_them_dry: "Розгортання батальйону «Брейквотер»"
bag_bleed_them_dry_desc: "Батальйон «Брейквотер» стане нашим передовим загоном на водних рубежах цих земель!"

bag_bleed_them_dry_tt: "§GП’ять§! дивізій Морської піхоти, сформованих за шаблоном «§YКолораденські експедиційні сили§!», буде розгорнуто на §Yпівденному прикордонні§!!"

bag_sua_sponte: "Sua Sponte"
bag_sua_sponte_desc: ""

bag_eastern_plains_territory: "Наступ у Великі рівнини"
bag_eastern_plains_territory_desc: ""

every_southern_colorado_state: "Кожен штат у §Yпівденному Колорадо§!"

bag_steel_city_without_shackles: "Сталеве місто без кайданів"
bag_steel_city_without_shackles_desc: ""
bag_steel_city_without_shackles_tt: "§gМісто Пуебло колись знали як §YСталеве місто§! – і цей образ нам до душі. Серед руїн є багато відновлюваних ливарень і металургійного обладнання, і ми повернемо їм славу.§!"

bag_bastion_of_freedom: "Бастіон свободи"
bag_bastion_of_freedom_desc: ""
bag_bastion_of_freedom_tt: "§g§YБастіон§! був досить дивним місцем ще до Великої війни – невелике містечко з кількома в’язницями. Місцеві рейдери, схоже, були нащадками цих ув’язнених, але ми повторимо успіх Тіббетса – використаємо споруди за їхнім первісним призначенням.§!"

bag_another_colorado_expedition: "Ще одна експедиція до Колорадо?"
bag_another_colorado_expedition_desc: ""
bag_another_colorado_expedition_tt: "§gСхоже, не лише НКР мала ідею дослідити залишки Колорадо – місцевий осередок братства вижив напрочуд довго попри повну ізоляцію. Їхній бункер – добре обладнана база, яку можна перетворити на справжній військовий завод.§!"

bag_vae_victis: "Vae Victis"
bag_vae_victis_desc: "Вони ще не переможені. Але будуть."
bag_vae_victis_tt: "Наша армія постачатиме зброю повстанцям по той бік річки! Навіть якщо ми не контролюємо §YМісто Червоного Сонця§!, вони повстануть і приєднаються до Республіки Червоного Сонця!\nНаш новий союзник витіснить Легіон з міста та отримає 4 §Gополченські§! дивізії."

bag_organize_new_mexican_territories: "Організувати території Нью-Мексико"
bag_organize_new_mexican_territories_desc: "Замість того щоб адмініструвати величезну територію самотужки, ми надамо повноваження Республіці Червоного Сонця. У нас є важливіші битви."

bag_pacifying_red_sun_lands_tt: "§gПередати всі штати Нью-Мексико§! §Yзахідніше Ріо-Ґранде§!, які належать нам або нашим маріонеткам, до §YРеспубліки Червоного Сонця§!.\nВони отримають §Y−25%§! опору та §Y−33%§! вартості інтеграції цих штатів.§!"

bag_incorporate_new_mexico: "Інтегрувати Нью-Мексико до нашого управління"
bag_incorporate_new_mexico_desc: "Ми станемо опікунами всіх земель по цей бік Ріо-Ґранде!"

bag_pacifying_legion_lands_tt: "§gОтримати§! §Y−15%§! опору населення та §Y−10%§! вартості інтеграції у штатах Нью-Мексико §Yсхідніше Ріо-Ґранде§!, що належать нам.§!"

bag_paws_of_cub: "Лапи ведмежати"
bag_paws_of_cub_desc: "Хоч ми далеко від великої мами-ведмедиці, але навіть ведмежа може вирости у грізного ґрізлі!"

bag_active_coastal_defense: "Активна берегова оборона"
bag_active_coastal_defense_desc: "Через велику кількість річок нам потрібен флот для «коричневих вод»."

bag_river_patrols: "Патрулі на річках"
bag_river_patrols_desc: "Водні артерії Колорадо повинні бути захищеними."

bag_expand_military_council: "Відділ воєнних ігор"
bag_expand_military_council_desc: "Спеціалізований підрозділ при військовій раді допоможе нам вигадати нові тактики."

bag_unoffical_motorized_company: "«Неофіційний» мотопідрозділ"
bag_unoffical_motorized_company_desc: "Родина Ґаленські давно нас підтримує. Хоча офіційно вони ще не мають рангу, фактично – це вже кістяк нашого моторизованого корпусу."

bag_expand_motorized_corps: "Узаконити статус Ґаленські"
bag_expand_motorized_corps_desc: "Нарешті ми надали Рібу титул: головний офіцер моторизованих підрозділів! Він швидко увійшов у роль і вже проєктує нову техніку."

bag_project_water_carrier: "Проєкт: Водовіз"
bag_project_water_carrier_desc: "Ґараж Ґаленські готує сюрприз: танки. Кажуть, вони перероблять старі водовози на броньовані машини!"

bag_deal_with_gun_runners: "Угода зі Збройовими кур'єрами"
bag_deal_with_gun_runners_desc: "Збройові кур’єри підтримують НКР понад століття. Вони працюють на себе, але наша співпраця вигідна обом."

has_gun_runner_opinion_25: "§YЗбройові кур’єри§!: симпатія понад §Y25§!"

bag_off_brand_gun_runners: "Місцеве відділення «Збройових кур'єрів»"
bag_off_brand_gun_runners_desc: "Та кого хвилює, що вони не справжні кур’єри? Ведмідь давно не звертає уваги на ці землі."

has_gun_runner_opinion_80: "§YЗбройові кур’єри§!: симпатія понад §Y80§!"

bag_expand_commando: "Розширити спецпідрозділи"
bag_expand_commando_desc: "Рейнджери, спецпризначенці – всіх їх нам потрібно більше. Може, час створити перший Колорадський Рекон?"

bag_desegregate_special_forces: "Наказ 9981"
bag_desegregate_special_forces_desc: "Наказ, що скасував расову сегрегацію в збройних силах колишніх США. Ми відтворимо його, щоб покінчити зі стигматизацією й розділенням наших гульських солдатів."

bag_organizational_effort: "Реорганізувати «Сталевих рейнджерів»"
bag_organizational_effort_desc: "Ми ще далекі від повної адаптації до доктрини Сталевих рейнджерів, але принаймні прогрес є."

bag_bears_can_fly: "Ведмеді літають!"
bag_bears_can_fly_desc: "Я вірю, що вони можуть. Я вірю, що вони торкаються неба!"

bag_aerial_HCF_doctrine: "Випробувати доктрину «Повітряної ППВ»"
bag_aerial_HCF_doctrine_desc: "Спираючись на концепцію доктрини Потужного Прикриття Вогнем, запропоновану Бріґґсом, ми випустимо рої літаків у небо, аби ті стали еквівалентом повітряної вогневої команди. Звісно, якщо зможемо збудувати їх у достатній кількості."