l_english:
  BAG_GODDARD_NAME: "Д-р. Ґоддард"
  BAG_GODDARD_DESC: "Старий, сухий, ніколи не усміхнений науковець, настільки дратівливий, що президентка Танді робила все можливе, аби тримати його подалі від Тіньових Пісків, постійно відряджаючи на околиці Республіки для участі в різних наукових програмах. Це — половина причини, чому він добровільно очолив експедицію до купола Боулдера: хоча б так він міг залишитися в одному місці й займатися власними дослідженнями.\n\nУсі труднощі та нещастя, які пережила перша Експедиція, ще більше зламали його дух. Гнів Ґоддарда спрямований на покійного Віктора Преспера, який колись відібрав у нього Купол. Рани на тілі загоїлись — гордість навряд чи колись відновиться."
  BAG_GODDARD_RESEARCH_ADVISOR_desc: "Ґоддарда усунули від командування, але це не означає, що він покинув свої плани щодо Купола. Боулдер зовсім поруч, і розкриття його таємниць має найвищий пріоритет. Хоча він більше не контролює експедицію, це означає, що він може зосередитись на тих проєктах, які нам конче потрібно завершити."

  BAG_COLERIDGE_NAME: "Генерал Колрідж"
  BAG_COLERIDGE_DESC: "§YІм’я§!: Майкл Колрідж\n§YЗвання§!: Генерал\n§YПозивний§!: «Бляшанка»\n§YПрофіль§!: Кар’єрний офіцер, чия гостра мова не раз створювала проблеми — особливо коли його запал переважав здоровий глузд. Він приєднався до армії НКР молодим і швидко піднімався службовими щаблями завдяки таланту до тактичних операцій. Багаторазово демонстрував мужність, героїзм, вірність і швидке мислення. Також є здібним інженером — створив і обслуговує власну кастомну силову броню.\n\nНа жаль, через його політичну глухоту старші чиновники вважали його ненадійним. Не бажаючи сидіти без діла, Колрідж із радістю прийняв відрядження на інший кінець Америки — аби знову бути в строю. Канцелярські пацюки, мабуть, вважали це пасткою, але в Колорадо Колрідж, нарешті, розкрив свій потенціал."
  BAG_COLERIDGE_CHIEF_OF_ARMY_desc: "§YІм’я§!: Майкл Колрідж\n§YЗвання§!: Генерал\n§YПозивний§!: «Бляшанка»\n§YПрофіль§!: Як командувач Експедиції, Колрідж гостро усвідомлює її вразливість. Повністю відрізані від батьківщини, без можливості отримати підкріплення, вони катастрофічно потребують ресурсів і людей.\n\nЄдину тактику, з якою погоджуються і він, і Ґоддард — це укріпитися й готуватися до неминучого штурму."

  BAG_LARSEN_NAME: "Сержант Ларсен"
  BAG_LARSEN_STAFF_SERGEANT_NAME: "Штаб-сержант Ларсен"
  BAG_LARSEN_FIRST_SERGEANT_NAME: "Перший сержант Ларсен"
  BAG_LARSEN_DESC: "Деяке майбутнє не варте ціни, якою його можна здобути."
  BAG_LARSEN_ARMY_DESC: "§R«Коли я був тут уперше, ми пройшли крізь пекло. Мої люди пройшли крізь пекло. А ці з халатами й Холодна Сука сиділи собі на м’яких дупах майже десять років. Тепер, коли ми повернулись, я змушу їх зрозуміти, через що я пройшов.»§!\n\n§YІм’я§!: Андерс Ларсен\n§YЗвання§!: Сержант\n§YПозивний§!: «Гіпо»\n§YПрофіль§!: Сержант Ларсен — один із ветеранів першої експедиції «Беґерів». Пережив залежність від РадОчищу, постійні бої з гулями й загибель своїх людей через зарозумілість і тупість командирів. Його залежність вдалось узяти під контроль ще в НКР, але бажання отримати дозу — досі живе.\n\nҐоддард вважає, що залежність Ларсена — це лише загроза всій місії, й що його слід лікувати або вигнати назавжди.\n\nКолрідж, попри свій сталевий характер, вважає, що Ларсен має достатньо досвіду й жорстокості, аби допомогти підкорити Колорадо. Його залежність — не більше ніж дрібна вада.\n\nХто з них правий — покаже час. А сам Ларсен знає лише одне: якщо триматиме очі відкритими й рота на замку, він більше не опиниться в тому самому становищі, як тоді. Сподівається."

  BAG_AGNES_NAME: "Д-р. Аґнес"
  BAG_AGNES_DESC: "Кажуть, Аґнес — богиня, яка доторкнулась до цього світу. Хоча вона вже не молода, її краса досі вражає. Народжена в племені, батьки відправили її до Академії, де вона швидко вирізнилася талантами. Спеціалізувалася в біології й стала шанованою лікаркою. Завдяки своїй зовнішності та харизмі вона швидко здобула популярність і стала речницею наукової спільноти.\n\nТепер, очолюючи цю дивну маленьку державу, Аґнес поклялася зробити її кращим місцем."
  BAG_AGNES_CULTURAL_ADVISOR_desc: "Кажуть, Аґнес — богиня, яка доторкнулась до світу. Хоча вона вже не юна, її врода залишається винятковою. Народжена в племені, вона потрапила до Академії завдяки батькам і миттєво показала здібності. Біологиня за фахом, шанована вчена, дипломатка з «срібним язиком» — вона мала всі шанси отримати все в цьому світі.\n\nТа в неї ніколи не було честолюбства. Можливо, прийнявши керівництво й не дозволивши двом велетенським еґо воювати між собою, вона зробить більше добра, ніж будь-хто інший..."

  BAG_PRASAD_NAME: "Рейнджер-майор Прасад"
  BAG_PRASAD_CHIEF_OF_ARMY_desc: "§YІм’я§!: Віра Прасад\n§YВійськове звання§!: Рейнджер-майор\n§YПозивний§!: «Гнойовик»\n§YПрофіль§!: Віра народилась тринадцятою дитиною бідного скотаря, що працював на заможного брамінового барона на південь від Реддінга. Її життя було доволі буденним, якщо не рахувати постійного виду брамінових задниць перед очима та побоїв від сина барона Джеймса, який виявляв свої почуття в грубій та дитячій формі. Її єдиною втечею з реальності було полювання на ґеконів та іншу дику природу — і їй це добре вдавалося.\n\nУсе змінилося, коли вона натрапила на рейнджера під вогнем рейдерів. Віра зробила все можливе, щоб прикрити постать у чорній шкіряній броні, хоча ніколи раніше не стріляла в людину. Коротше кажучи, вони виграли бій, а рейнджер, яка згодом представилася як Анджела Дет, взяла її під своє крило й розпочала кар’єру малої Віри як рейнджерки.\n\nКоли формувалась Колорадська експедиція, вона добровільно очолила рейнджерську групу «Листопад», щоб супроводжувати Доктора й Генерала — її менторка теж вирушила до Колорадо, але ще не повернулася. Віра битиметься за Республіку — доти, доки та допомагає їй знайти Червоного Диявола, який вирвав її з бідності й подарував сенс життя."

  BAG_PEOPLES_NAME: "Полковник Піплз"
  BAG_PEOPLES_CHIEF_OF_ARMY_desc: "§YІм’я§!: Ральф Піплз\n§YВійськове звання§!: Полковник\n§YПозивний§!: «Шериф»\n§YПрофіль§!: Народжений у 2231 році, Ральф завжди був мандрівником, який блукав від міста до міста, жив безтурботно й завжди посміхався, покладаючись на свої два залізні кулаки — він ніколи не осідав. Аж поки не закохався й не знадобилась йому робота, щоб забезпечити майбутнє для себе та коханої.\n\nСлужба в армії здавалася ідеальним варіантом — можна бути розбишакою й водночас мати змогу бродити між зонами операцій. Несподівано він знайшов своє покликання в охороні порядку й позбавленні інших свободи. Але в його житті було два фатальні рішення: перше — він закохався в дівчину-квітку з загадковою хворобою. Безсилий, він спостерігав, як його Розі в’яне пелюстка за пелюсткою. Друге — він подружився з Колріджем і його загоном. І коли ті вирушили до Колорадо, Ральф пішов за ними. Треба було втекти подалі від дому. І зрештою...\n\n§gБо він мандрівник, який блукає знову, знову, знову...§!"

  BAG_PHILIP_NAME: "Командор де Флегій"
  BAG_PHILIP_NAVY_CHIEF_desc: "§YІм’я§!: Філіп з Ма’її\n§YВійськове звання§!: Командор\n§YПозивний§!: «Перевізник»\n§YПрофіль§!: Колись відомий просто як Філіп, його ім’я згодом романізували у Флегій після трагедії його племені. Ма’її були розбиті в бою Легіоном Цезаря під час Аризонської кампанії, а згодом повністю асимільовані. Як очільника оборони, його мали стратити показово, тож він утік із сім’єю з рідного Нашітті. Вони осіли біля річки в Колорадо, і він влаштувався на сухий док — хоч і бідняком, але вільним.\n\nТа цей крихкий мир не тривав довго… Фрументарії знайшли їх. Поки він працював, вони вирізали його родину й зібрались наругу вчинити над тілами. Він запізнився — але не надто. Його героїчне повернення та врятування тіл і досі згадується. Його небесна лють, з якою він впав на «збирачів боргів», і досі лякає легіонерів. Його відчайдушна втеча річкою та піратські рейди берегом зробили його справжнім жахом для легіонерів-водників.\n\nВідтоді він став Флегієм — ім’ям міфічного перевозника душ, і його талант у корабельній справі вже нікого не дивує. Коли в нього закінчилися припаси в Ґранд-Каньйоні, експедиція його підібрала. Колрідж одразу підвищив його до командора.\n\n§RФлегій битиметься, доки Легіон не впаде.§!"
  BAG_PHILIP_CHARACTER_TT: "§LРівень§!: §Y3§!\n§RАтака§!: §Y3§!\n§YОборона§!: §Y2§!\n§GПланування§!: §Y3§!\n§CЛогістика§!: §Y2§!\n"

  BAG_LUSH_NAME: "Молодший лейтенант Лаш"
  BAG_LUSH_AIR_CHIEF_desc: "§YІм’я§!: Девід Лаш\n§YВійськове звання§!: Молодший лейтенант\n§YПозивний§!: «Дедал»\n§YПрофіль§!: Лаш мав пригодницьке, хоча й самотнє життя. Подорожував від міста до міста, виконував повітряні трюки на своєму старому «Растберді» й забезпечував собі жінок і випивку. Його життя було суцільним святом у Пустці. Але з віком, коли вже не міг тримати темп, він почав наставляти юнака — харизматичного шибайголову з талантами до пілотування.\n\nЗабезпечивши учневі спорядження й собі пенсію, він вступив до НКРА як інструктор пілотів. Айк був не єдиним його учнем, але єдиним, якого він вважав гідним успадкувати свою спадщину. Лаш навіть здобув звання молодшого лейтенанта.\n\nУсе закінчилося, коли Девід дозволив хлопцю виконати трюк, до якого той ще не був готовий. І трапилась трагедія. Відтоді його прозвали «Дедал» — бо він дозволив своєму «Ікару» злетіти надто близько до сонця. Тепер, працюючи в нашій команді, він намагається врятувати нових пілотів від тієї ж долі."

  BAG_MARIANO_NAME: "Лейтенант Маріано"
  BAG_MARIANO_RESEARCH_ADVISOR_desc: "§YІм’я§!: Буч Маріано\n§YВійськове звання§!: Лейтенант\n§YПозивний§!: «Воп»\n§YПрофіль§!: У Буча Маріано цікаве минуле, яке різко контрастує з його нинішньою доволі нудною військовою службою.\nМаючи італійське походження… ну, принаймні вирісши серед руїн старої піцерії — він гадав, що знайшов споріднених духом у Легіоні. Йому здавалося, що це відродження великої імперії Старого світу, яку він знав лише з пожовклих книжок з історії та дешевого декору закусочних. Але, приєднавшись, він швидко зрозумів: слави немає — лише рабство, і немає ніякої «Res Republica» — лише диктатор.\n\nДезертирувавши, він утік за річку Колорадо й приєднався до НКР — аби служити нації, якою може пишатися.\n\nУчасть в Експедиції нічого особливо не змінила: його завдання — водити розвідгрупи в Денвер, навчаючи новобранців мистецтву патрулювання й розвідки у воєнний час."

  BAG_BAJAR_NAME: "БАЖАР"
  BAG_BAJAR_RESEARCH_ADVISOR_desc: "БАЖАР. Хоч ім’я і зневажливе, цей юніт носить його з гордістю. Адже справжнє ім’я він забув уже давно — ще до Великої війни. Він має туманні спогади про себе як науковця, що працював у куполі Боулдера, і сильний страх перед загадковою хворобою... Але це вже позаду. Нині цей юніт — БАЖАР, Мозок у Банці.\n\nІ цей юніт допоможе нам розробити досконалу мережу контролю для CnC-одиниць, хіба ж ні?"

  BAG_SOR_NAME: "СОР. Альфа"
  BAG_SOR_HIGH_COMMAND_desc: "СОР 1000 «Альфа», відомий також як Робот Безпеки й Операцій — машина з довгою історією служби. Віктор Ехо, з позивним «Ксено», колись був частиною організації Quaere Verum, а після її розгрому його перевели до Купола як одного з перших піддослідних для програми CODE.\n\nЙого перетворення на робомозок... скажімо м’яко, викликало запеклий спротив. Але усвідомлення, що він не може цьому завадити, а також можливість шпигувати за урядом у новому тілі, змусили його швидко прийняти нову реальність. Проте після Великої війни його ставлення змінилося. Він вимкнувся в комплексі на довгий час, а з роками побічні ефекти робомозкового стану та протоколу CODE спричинили маячіння. Його спогади й відчуття власного «я» зникли.\n\nПерша Колорадська експедиція розбудила його разом із Преспером, але конфлікт із ним змусив СОР покинути Купол і оселитися в Місті Роботів.\n\nЗ прибуттям Другої експедиції щось покликало його приєднатися до подорожі. Що саме — він не розуміє, але Ґоддард міг би розповісти історію про це…"

  BAG_GALETSKI_NAME: "Ріб Ґалєнскі"
  BAG_GALETSKI_HIGH_COMMAND_desc: "Рібера Ґалєнскі — найстарший прийомний син Едді Ґалєнскі від його дружини Гелен. Як і батько, він кремезний і сильний, але дуже турботливий щодо родини. Навчившись ремесла від Едді, Ріб двадцять років освоював мистецтво дорожньої війни. Усі каравани Колорадо коли-небудь наймали його або його братів.\n\nПопри скепсис щодо Експедиції, старий Едді нас пам’ятає й умовив сина допомогти нам."

  BAG_DIANNE_NAME: "Капрал Стід"
  BAG_DIANNE_HIGH_COMMAND_desc: "§YІм’я§!: Даян Стід\n§YВійськове звання§!: Капрал\n§YПозивний§!: «Водяна»\n§YПрофіль§!: Капрал Даян Стід ніколи не хотіла служити в армії. Але вона народилась у провінційному містечку, де не було шансів здійснити її мрію — забезпечити чисту питну воду для Каліфорнії та своєї громади. Оскільки стипендій для гідромеханіків не було, вона вступила до лав НКРА, що завжди шукала добровольців. Так вона потрапила до Інженерного корпусу й опинилася в складі 5-ї інженерної роти під командуванням майора Бріґґса. А далі почались проблеми…\n\nХоч їхня робота зазвичай була нескладною — логістика, саперна справа — 5-та рота виявилась особливою. Вони були підрозділом саботажу й використовували інженерні знання для підриву військових і цивільних об’єктів в інтересах Республіки. Майор Бріґґс не мав з цим проблем. А от Даян — мала. Дізнавшись правду вже в Колорадо, вона не має вибору, окрім як допомагати Експедиції. Але поважати своє командування вона не зобов’язана."

  BAG_STILLER_NAME: "Капітан Стіллер"
  BAG_STILLER_HIGH_COMMAND_desc: "§YІм’я§!: Мітч Стіллер\n§YВійськове звання§!: Капітан\n§YПозивний§!: «Коп»\n§YПрофіль§!: Мітч Стіллер народився в 2241 році й завжди мріяв стати поліцейським. Його надихнув хлопчик, який грав шерифа в їхньому містечку між Хабом і Джанктауном. Через брак шансів він записався до НКРА, почавши кар’єру у військовій поліції — принаймні це краще, ніж нічого. Його командиром став Ральф Піплз, знаний як «Шериф» — найкращий з усіх, що могли бути.\n\nХоч особисті трагедії Піплза його зворушили, вірність і симпатія були не єдиними причинами, чому він вирушив за ним до Колорадо. Можливо, тут, на дикому кордоні, він нарешті зможе стати тим копом, яким завжди мріяв бути."

  BAG_BRIGGS_NAME: "Майор Бріґґс"
  BAG_BRIGGS_LIEUTENANT_COLONEL_NAME: "Підполковник Бріґґс"
  BAG_BRIGGS_HIGH_COMMAND_desc: "§YІм’я§!: Роберт Бріґґс\n§YВійськове звання§!: Майор\n§YПозивний§!: «Кордон»\n§YПрофіль§!: Роберт «Кордон» Бріґґс завжди був тим, хто мав стати «важковиком» у команді офіцерів Експедиції. Експерт із диверсій, вибухівки та важкого озброєння — це дика карта, яку кожен хотів би мати в рукаві. Прізвисько «Кордон» він здобув завдяки кількості кордонів, які перетнув за довгу кар’єру: від Каліфорнії до Мохаве, від півострова Баха до Великого Каньйону.\n\nЯк військовий радник, він просуває доктрину HCF — щільного вогневого прикриття. Жоден загін не вийде в поле без повноцінних вогневих команд під його наглядом."

  BAG_PIERCE_NAME: "Капітан Пірс"
  BAG_PIERCE_DESC: "Коли наступне призначення Пірса виявилося посадою губернатора Нової Мексики — він одразу погодився. Це підвищення він здобув не за адміністративні навички чи легендарні методи придушення — а за вірність Генералу, що зробило його господарем на колишніх землях «Сонячних псів».\n\nІ без прямого нагляду з боку Генерала ніщо не зупинить його кровожерливість щодо нещасних мешканців Нової Мексики."
  BAG_PIERCE_LIEUTENANT_GOVERNOR_NAME: "Лейтенант-губернатор Пірс"
  BAG_PIERCE_HIGH_COMMAND_desc: "§YІм’я§!: Нік Пірс\n§YВійськове звання§!: Капітан\n§YПозивний§!: «Кіллер»\n§YПрофіль§!: Пірс — той, хто виконує роботу. Зазвичай із надмірною жорстокістю. Його руки залиті кров’ю більше людей, ніж цей «почесний кіллер» здатен згадати. І попри психопатичну поведінку, він — цінний актив. Під його керівництвом наші спецпідрозділи стануть ще ефективнішими… допоки Генерал стримує його.\n\nЙого снайперська гвинтівка смертельна, а його вміння підтверджують гасло 1-го розвідувального батальйону: «Останнє, що ти не побачиш»."
  BAG_PIERCE_CHARACTER_TT: "§LРівень§!: §Y3§!\n§RАтака§!: §Y2§!\n§YОборона§!: §Y2§!\n§GПланування§!: §Y3§!\n§CЛогістика§!: §Y1§!\n§gРиси:§! §tУважний§!, §tРозумний§!, §tСнайпер§!"

  BAG_DAVIDSON_NAME: "Капітан Девідсон"
  BAG_DAVIDSON_DESC: "Девідсон завжди був найвірнішим і найефективнішим підлеглим генерала Колріджа. Тож коли настав час обрати губернатора для Чорного Каньйону — вибір був очевидним.\n\nЧорний Каньйон має багато локальних загроз, але за достатнього військового тиску — його можна утримати. Врешті-решт, наш девіз незмінний: §y«Упокорення, не звільнення.»§!"
  BAG_DAVIDSON_LIEUTENANT_GOVERNOR_NAME: "Лейтенант-губернатор Девідсон"
  BAG_DAVIDSON_HIGH_COMMAND_desc: "§YІм’я§!: Джек Девідсон\n§YВійськове звання§!: Капітан\n§YПозивний§!: «Випалена земля»\n§YПрофіль§!: Девідсон — права рука Колріджа. Ідеальний солдат, якого тільки може побажати офіцер — завжди виконує накази, ніколи не ставить питань. Було очевидно, що він піде за своїм генералом у цей клятий край Пустки.\n\nЯк другий за впливом командир експедиції, не дивно, що він очолює більшість наших операцій у регіоні."
  BAG_DAVIDSON_CHARACTER_TT: "§LРівень§!: §Y3§!\n§RАтака§!: §Y1§!\n§YОборона§!: §Y3§!\n§GПланування§!: §Y2§!\n§CЛогістика§!: §Y1§!\n§gРиси:§! §tСпритний§!, §tСтійкий§!, §tНатхненник§!"

  BAG_LEANDER_NAME: "Капелан Леандер"
  BAG_LEANDER_HIGH_COMMAND_desc: "§YІм’я§!: Сесіл Леандер\n§YВійськове звання§!: Бригадний капелан\n§YПозивний§!: «Священик»\n§YПрофіль§!: Хоча про Сесіла Леандера й кажуть як про повільного й вайлуватого, він — здібний духовний наставник для наших солдатів. Навіть ті, хто не поділяє його віри, поважають силу його переконань."

  BAG_MOREHOUSE_NAME: "Джей-Джей Морхавз"
  BAG_MOREHOUSE_ECONOMIC_ADVISOR_desc: "Чарівна усмішка, гостинність і тверда, але чесна торгівля — так більшість знає старого Морхавза. І більшість помиляється. Безжальний і ефективний ділок, єдина його рушійна сила — жадібність. Колишній караванник, він ішов по головах заради прибутку: крадіжки, здирництво, шпигунство — все йшло в хід. Справжній пустошний «продавець мазі від усього» — куди не йде, скандал за ним слідом. Якби не допомога Експедиції — давно був би мертвий.\n\nЙого логістичні навички забезпечили йому посаду інтенданта табору, і тепер він залюбки підтримує будь-яку ініціативу Баґґерів. Бо ж якщо тут є зв’язки з НКР — буде й фінансування, яке він зможе «перерозподілити» на свою користь."

  BAG_BAROSS_NAME: "Джей-Пі Баросс"
  BAG_BAROSS_ECONOMIC_ADVISOR_desc: "§4«Ціна кожної людини — це те, що вона зробила для громади.»§!\n\nПопри титул барона, Баросс — не такий, як інші. Хоча більшість його «інтересового об'єднання» складається з брамінових та сільськогосподарських магнатів, його справедливо називають «залізничним» бароном — і, ймовірно, єдиним таким у межах Республіки.\n\nПрізвисько §g«Залізний Барон»§! він отримав як головний рушій відновлення залізниць у Каліфорнії, а також ініціатор лінії «Мохаве».\n\nПризначення його на посаду може викликати враження, що барони захоплюють владу — але ми здобудемо більше з ним, ніж втратимо."

  BAG_WAHL_NAME: "Валь з Варила"
  BAG_WAHL_ECONOMIC_ADVISOR_desc: "Валь — вправний зварювальник і засуджений фальшивомонетник. Він народився і виріс у Тюремному комплексі, тож і кримінальна, і офіційна робота з наглядачем — усе звідти. До Великої Втечі, яка принесла йому свободу, його праву руку розчавили, таврували й відрубали спусковий палець — усе через неправильного ворога в стінах в’язниці.\n\nЙого помста зрештою привела його до нас, де він працює над будівельними проєктами Баґґерів. І хоча він — чудовий бригадир (а його «ліву справу» всі удають, що не помічають), його жадібність може стати нам боком. Чутки з Денвера говорять про скарб у так званій «Скрині», і Валь не може викинути це з голови. Якось він отримає те, що всередині — так чи інакше."

  BAG_JIM_NAME: "Дядько Джим"
  BAG_JIM_ECONOMIC_ADVISOR_desc: "Дядько Джим — привітний дідусь із добродушною посмішкою. У молодості він жив у Денвері, ходив на вилазки зі збирачами та навчився лагодити їхнє спорядження — генератори, важкий інструмент, усе, що старий Мерфі міг зламати за хвилину.\n\nОсобисто миролюбний і неохоче встряє в конфлікти, але його жага до скарбів іноді бере гору. Розділяючи «золоту гарячку» з учнем Валем, вони вирішили допомагати НКР у цьому регіоні, бо це — найнадійніший спосіб дістатись до «Скрині» в Денвері."

  BAG_DONALD_NAME: "Дональд"
  BAG_DONALD_ECONOMIC_ADVISOR_desc: "Ефективність. Просте слово з безліччю застосувань — і Дональд є її втіленням. Наші машини та процеси рідко працюють краще, ніж коли Дональд за ними стежить.\n\nЙого називали «диваком» через мовчазність і брак соціальних навичок — Аґнес підозрює, що Дональд на чомусь, що вона назвала «спектром», хоча ми не знаємо, що вона мала на увазі.\n\nБудучи «так-єс-сером» Ґоддарда, він отримав його повагу за надійність, але підлегла натура й мислення через призму ефективності часто гальмують його творчість."

  BAG_NINA_NAME: "Ніна"
  BAG_NINA_ECONOMIC_ADVISOR_desc: "Ніна — вічна «шукачка». Вона відчуває внутрішню порожнечу й намагається заповнити її погонями: за кар’єрою, хобі або хлопцем.\n\nПриєдналася до Експедиції як спроба втамувати цей поклик. Але знайшла щось важливіше — батьківську постать. Вона стала одержимою Ґоддардом настільки, що поголила голову, щоб уподібнитися до його «досконалого образу».\n\nЇї спеціалізація — інженерія та обслуговування, але також вона виконує роль HR для Ґоддарда, який безсоромно користується її батьківськими комплексами. Де виникає конфлікт у колективі — з’являється Ніна, щоб навести лад. І вона щаслива, допоки щасливий Ґоддард."

  BAG_MORRIS_NAME: "Кендіс Морріс"
  BAG_MORRIS_CULTURAL_ADVISOR_desc: "Коли Експедиція вирушила, наукове коло взяло із собою кількох аспірантів з Академії. Вона була їхньою викладачкою — професорка історії та досвідчена представниця Послідовників Апокаліпсису. Приєдналася до місії, щоб стежити за їхньою польовою роботою. А ще — шпигувала за Ґоддардом і його оточенням, аби Республіка мала хоч якийсь контроль над діями Експедиції.\n\nЇї знання дуже корисні для всіх під її наглядом, але її пильне око та пацифізм трохи гальмують бойові зусилля. А ми зараз не можемо дозволити собі розкіш гуманізму."

  BAG_FLEMING_NAME: "Майор Флемінґ"
  BAG_FLEMING_CULTURAL_ADVISOR_desc: "§YІм’я§!: Джек Флемінґ\n§YВійськове звання§!: Майор\n§YПозивний§!: «Чоловічок»\n§YПрофіль§!: Джек Флемінґ — чужинець серед офіцерів Експедиції. Поки інші належать до клану Колріджа чи руху Ларсена, Джек потрапив сюди за умовами Хартії Експедиції. Як права рука сенатора Габа Джозефа Доджа, він є одним із найгучніших прибічників того ж самого сенатора. Завдання Флемінґа — утримувати Експедицію на плаву.\n\nЙого сильні сторони — харизма та зворушлива історія про те, як армія змінила його життя. Хоча, можливо, ця історія й вигадка — вона працює. Неочікувано, але Генерал поважає його за принциповість. Та Колрідж не забуває, що вірність Флемінґа — не Колорадо, а Каліфорнії."

  BAG_ROCHE_NAME: "Джиммі Т. Рош"
  BAG_ROCHE_CULTURAL_ADVISOR_desc: "Джиммі Т. — кремезний супермутант, але з тонкими пальцями й добрим обличчям. Ходить згорблений, очі втуплені в землю. Має дратівливу звичку сміятися з усього на світі — голосно й заливисто. Говорить тихо, хіба що мова заходить про медицину. Його звичка надавати першу допомогу всім, хто цього потребує, привернула до нього нашу увагу — і здобула довіру.\n\nКоли він не рятує життя — він щось продає. Торгівля стала його пристрастю після першої вдалої угоди з Едді Ґалєнскі та Баґґерами. Відтоді він — неофіційний член Експедиції, якого часто можна побачити по табору — він шукає хворих і поранених."

  BAG_JAMES_NAME: "Джеймс"
  BAG_JAMES_NOLAR_NAME: "Джеймс"
  BAG_JAMES_CULTURAL_ADVISOR_desc: "Джеймс — покидьок. За фахом програміст, до того, як нас вигнали з Купола, він очолював проєкт із ремонту ZAX'а.\n\nЄдиний син заможного брамінового барона, він звик керувати людьми. Хоч і визнає авторитет Ґоддарда, але виконує накази у свій, «творчий» спосіб — і це створює проблеми.\n\nЙого найбільша слабкість — страх. Він боїться гуль. Він боїться майже всього, але саме «гниляки» лякають його найбільше, через що ним легко маніпулюють Радіофоби."
  BAG_JAMES_CULTURAL_ADVISOR_NOLAR_desc: "Джеймс — покидьок. За фахом програміст, до того, як нас вигнали з Купола, він очолював проєкт із ремонту ZAX'а.\n\nЄдиний син заможного брамінового барона, він звик керувати людьми. Хоч і визнає авторитет Ґоддарда, але виконує накази у свій, «творчий» спосіб — і це створює проблеми.\n\nЙого найбільша слабкість — страх. Він боїться гуль. Він боїться майже всього, але саме «гниляки» лякають його найбільше, через що ним легко маніпулюють Радіофоби."

  BAG_PAUL_NAME: "Пол"
  BAG_PAUL_NOLAR_NAME: "Пол"
  BAG_PAUL_CULTURAL_ADVISOR_desc: "§g«Є теорія хаосу, і навіть у хаосі, якщо розкласти його на частини, є закони. Люди здаються випадковими, але ні — ними теж керують закони. Я весь час думаю, що є одна теорія, яка об’єднує все це, але я не знаю яка.»§!\n\nЦей опис міг би підійти до всіх наших аспірантів, але Пол — «інший». Енергійний і трохи трудоголік — це ще куди не йшло. Але у поєднанні з сильною залежністю від Ментатів — це вже небезпека. Мегаломанія й безсоння зруйнують його працю згодом. Його виправдання, що «не може бачити снів», нікого не переконує.\n\nАнтисуспільна поведінка й дивні одержимості віддалили його від інших. А близькість до зрадниці Сіан зробила його підозрілим в очах усіх."
  BAG_PAUL_CULTURAL_ADVISOR_NOLAR_desc: "§g«Є теорія хаосу, і навіть у хаосі, якщо розкласти його на частини, є закони. Люди здаються випадковими, але ні — ними теж керують закони. Я весь час думаю, що є одна теорія, яка об’єднує все це, але я не знаю яка.»§!\n\nЦей опис міг би підійти до всіх наших аспірантів, але Пол — «інший». Енергійний і трохи трудоголік — це ще куди не йшло. Але у поєднанні з сильною залежністю від Ментатів — це вже небезпека. Мегаломанія й безсоння зруйнують його працю згодом. Його виправдання, що «не може бачити снів», нікого не переконує.\n\nАнтисуспільна поведінка й дивні одержимості віддалили його від інших. А близькість до зрадниці Сіан зробила його підозрілим в очах усіх."

  BAG_MENO_NAME: "Валентина Мено"
  BAG_MENO_NOLAR_NAME: "Валентина Мено"
  BAG_MENO_CULTURAL_ADVISOR_desc: "§y«Мій народ — це мирні, але допитливі люди. Я не бажаю піднімати зброю проти жодного чоловіка, жінки чи дитини, але зроблю все, аби принести мир двоголового ведмедя на ці землі.»§!\n\nХоча Нову Каліфорнійську Республіку часто критикували за імперіалізм і експансіонізм, плем’я Валентини (якого вона ніколи не називала — з особистих і духовних причин) є одним із небагатьох, які добровільно подалися на анексію, ставши тимчасовими громадянами.\n\nВідтоді минуло десятиліття. Землі її племені були розграбовані поселенцями, найманцями та ділками з НКР. Чоловіки намагалися зберегти традиції, але врешті загрузли в бюрократії й капіталізмі, натягнувши костюми й краватки. Жінки теж стали жертвами спокус рівності та матеріалізму й пішли працювати до міст. Її тітка — славетна красуня з племені — втекла з, нібито, канібалом.\n\nУ підліткові роки, тікаючи від матеріалізму, Валентина потрапила до Сан-Франциско, де її прихистили Ші — попри упередження щодо племінних гостей (останній, кажуть, зробив неабиякий «візит»). Провівши 20-ті роки життя з ними, вона повернулася до НКР після 30-ти.\n\nСпробувала приєднатися до Послідовників Апокаліпсису, але родина змусила її піти військовим шляхом. Коли перша експедиція Баґґерів повернулась у 2260-х, Валентина побачила в цьому вирішення обох проблем: у контракті зазначалось, що після повного терміну служби вона й її народ отримають громадянство.\n\nВона вирушила до Колорадо з Ґоддардом і Колріджем, не знаючи, у яке пекло вляпалась..."

  BAG_MENO_CULTURAL_ADVISOR_NOLAR_desc: "§y«Мій народ — мирний, але допитливий. Я не бажаю нести зброю проти жодного чоловіка, жінки чи дитини, але зроблю все, аби принести мир двоголового ведмедя цим землям.»§!\n\nХоча Нову Каліфорнійську Республіку і критикували за експансіонізм, плем’я Валентини (назву якого вона ніколи не розкриває з особистих і духовних причин) — одне з небагатьох, яке добровільно піддалося агітації та подало заявку на анексію, ставши тимчасовими громадянами.\n\nМинуло десятиліття, і за цей час їхні землі стали здобиччю поселенців, найманців і підприємців із НКР. Чоловіки намагалися зберегти традиції, але зрештою вдягли костюми й затягнули краватки. Жінки піддалися закликам до «рівності» та «самореалізації» й розлетілися по містах у пошуках прикрас і заробітку. Її тітка — відома в племені красуня — втекла з буцімто канібалом.\n\nУ підлітковому віці, щоб не загрузнути в матеріалізмі, Валентина вирушила до Сан-Франциско, де Ші, попри упередження до племінних гостей (попередній справив враження), її прийняли. Провівши двадцяті роки життя серед Ші, вона повернулася до НКР після тридцяти.\n\nВалентина хотіла приєднатися до Послідовників Апокаліпсису, але родина вмовила обрати військовий шлях. Повернення першої експедиції Баґґерів у 2260-х стало шансом для неї та її народу: за умовами контракту, після повного терміну служби вони отримають повне громадянство. Вона вирушила до Колорадо з Ґоддардом і Колріджем, не підозрюючи, у яке пекло вв’язується..."

  BAG_ELI_NAME: "Сержант Елай"
  BAG_ELI_FIRST_SERGEANT_NAME: "Штаб-сержант Елай"
  BAG_ELI_ARMY_DESC: "§YІм’я§!: Елай... Щось там\n§YВійськове звання§!: Сержант\n§YПозивний§!: «Єс-сер»\n§YПрофіль§!: Сержант Елай — найстарший боєць у полі в Колорадо. Народився ще до Великої війни, служив у Нацгвардії Колорадо до падіння бомб і був на бойовому чергуванні ще до появи самої НКР. Він не пам’ятає свого справжнього імені — лише звання й як тримати рушницю. Хоч і дезертував від Зів’ялої Зграї, наші командири певні — йому можна довіряти."
  BAG_ELI_CHARACTER_TT: "§LРівень§!: §Y2§!\n§RАтака§!: §Y1§!\n§YОборона§!: §Y1§!\n§GПланування§!: §Y2§!\n§CЛогістика§!: §Y2§!\n§gРиси:§! §tХаризматичний§!, §tСтійкий§!"

