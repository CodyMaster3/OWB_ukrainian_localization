  BAG_MARTINEZ_NAME: "Лейтенант Мартінес"
  BAG_MARTINEZ_DESC: "§YІм’я§!: Мішель Мартінес\n§YВійськове звання§!: Лейтенант\n§YПозивний§!: «Щілина»\n§YПрофіль§!: «Щілина» — ветеранка експедиції, яка тричі провалила випробування рейнджерів. Вона не найталановитіша, але першою приходить на роботу й останньою йде. Саме ця працьовитість і відрізняє її. Прізвисько «Щілина» — це насмішка над помітним проміжком між передніми зубами. Солдати бувають жорстокими, але вона сприймає це з гумором."
  BAG_HERO_MARTINEZ_TT: "§LНавичка§!: §Y2§!\n§RАтака§!: §Y1§!\n§GОборона§!: §Y2§!\n§PПланування§!: §Y1§!\n§MЛогістика§!: §Y2§!\n§gРиси:§! §tСтійка§!, §tХаризматична§!, §tНатхненниця§!"

  BAG_SMITH_NAME: "Штаб-сержант Сміт"
  BAG_SMITH_DESC: "§YІм’я§!: Дреймонд Сміт\n§YВійськове звання§!: Штаб-сержант\n§YПозивний§!: «Боулдерський»\n§YПрофіль§!: «Боулдерський» — один із перших солдатів НКР, народжених у Колорадо. Приєднався до війська, бо вірив у світле майбутнє суспільства. Відзначився не лише на полі бою, а й на бейсбольному полі. Його битка стала смертоносною іграшкою як у грі, так і в бою. Його прізвисько має подвійне значення — за місцем народження та впертістю. Якщо він щось вирішив — не зрушиш. Кажуть, він і справді з каменю."
  BAG_HERO_SMITH_TT: "§LНавичка§!: §Y3§!\n§RАтака§!: §Y3§!\n§GОборона§!: §Y1§!\n§PПланування§!: §Y2§!\n§MЛогістика§!: §Y2§!\n§gРиси:§! §tСильний§!, §tСтійкий§!, §tУважний§!"
  BAG_ZADANOWITZ_NAME: "Капрал Задановіц"
  BAG_ZADANOWITZ_DESC: "§YІм’я§!: ~Стівен~ Стефані Задановіц\n§YВійськове звання§!: Капрал\n§YПозивний§!: «Королева»\n§YПрофіль§!: Колись її знали як Стівена Задановіца, але після численних візитів до автодока вона вимагає, щоб її називали Стефані. Попри суперечки щодо її ідентичності, Королева — безперечно одна з найпопулярніших офіцерок у всій Експедиції. Вона вміє делегувати, знаходить спільну мову з підлеглими та веде свій загін до найвищої ефективності. Її оперативні успіхи повністю виправдали це підвищення."
  BAG_HERO_ZADANOWITZ_TT: "§LНавичка§!: §Y1§!\n§RАтака§!: §Y1§!\n§GОборона§!: §Y2§!\n§PПланування§!: §Y1§!\n§MЛогістика§!: §Y1§!\n§gРиси:§! §tХаризматична§!, §tЩаслива§!, §tЛідер на місцях§!"
  BAG_ALEXANDER_NAME: "Сержант Александер"
  BAG_ALEXANDER_DESC: "§YІм’я§!: Дрейк Александер\n§YВійськове звання§!: Сержант\n§YПозивний§!: «Доблесний»\n§YПрофіль§!: «Доблесний» вступає в бій із гігантським гакопістолетом на стисненому газі, власної розробки, в одній руці, а в іншій — іржавою катаною, знайденою в закинутому торгівельному центрі. Він кидається на кулеметні гнізда з цими двома речами й сталевими кулями. Його героїзм на полі бою (або безумство — залежно від точки зору) здобули йому повагу та захоплення серед усіх солдатів Експедиції."
  BAG_HERO_ALEXANDER_TT: "§LНавичка§!: §Y3§!\n§RАтака§!: §Y3§!\n§GОборона§!: §Y3§!\n§PПланування§!: §Y1§!\n§MЛогістика§!: §Y1§!\n§gРиси:§! §tУважний§!, §tХаризматичний§!, §tЩасливий§!"