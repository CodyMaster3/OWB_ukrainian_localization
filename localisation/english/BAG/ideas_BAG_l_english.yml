bag_lost_expedition: "Загублена експедиція"
bag_lost_expedition_desc: "Друга експедиція Нової Каліфорнійської Республіки до Колорадо прибула успішно й майже без втрат. Ми оточені з усіх боків, і шанси на перемогу мізерні. Підкріплення не буде. Назад шляху немає. Вони йдуть.\n\n§gГей... ця назва звучить знайомо...§!"
bag_lost_expedition_tt: "§g\nЯкщо у вас є доповнення §YBy Blood Alone§!, деякі ваші польові офіцери невдовзі отримають §Gпочаткові медалі§! після початку гри!§!"

