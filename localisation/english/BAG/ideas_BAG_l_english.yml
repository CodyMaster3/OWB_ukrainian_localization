bag_little_republic: "Мала Республіка"
bag_little_republic_desc: "Хоча Баґґери — лише наукова експедиція, ми представляємо Республіку в Колорадо. Ми контролюємо лише кілька поселень, але якщо місцеві повірять, що Республіка підтримує нас, дедалі більше людей приєднаються до нас у надії на краще майбутнє. Та слід бути обачними: підтримувати порядок і надавати послуги без прямої допомоги з Каліфорнії — важке випробування для наших слабких плечей."

