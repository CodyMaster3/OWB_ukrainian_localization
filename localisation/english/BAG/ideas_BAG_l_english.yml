bag_undesirables_law_volunteer: "Виключення гулів із лав війська"
bag_undesirables_law_volunteer_desc: "Хоча ми охоче дозволили б нашим новим гульським друзям служити у війську, країна поки що не готова до цього. У майбутньому ми переглянемо цю політику… щойно це не спричинить революцію."

bag_undesirables_law_limited: "Обмежене добровільне залучення гулів"
bag_undesirables_law_limited_desc: "Гулі вже почали служити у війську — хоч і в невеликій кількості. Вони залишаться в допоміжних підрозділах та на посадах рядового складу, і цього вистачить, щоб довести — 'гниляки' не гірші вояки, ніж решта."

bag_undesirables_law_seperate_battalions: "Окремі батальйони гулів"
bag_undesirables_law_seperate_battalions_desc: "Зі зростанням кількості гульських добровольців ми вирішили сформувати окремі батальйони з них. Це дозволить їм довести свою вартість, водночас убезпечивши їх від упередженого ставлення колег."

bag_undesirables_law_mixed_battalions: "Прототип змішаних батальйонів"
bag_undesirables_law_mixed_battalions_desc: "Серед новобранців є чимало тих, хто виріс із переконанням, що гулі не надто відрізняються від звичайних людей. Завдяки їхньому піонерському мисленню ми можемо створити перші змішані підрозділи. Інтеграцію впроваджуватимемо обережно, щоб уникнути обурення реакціонерів."

bag_undesirables_law_equal_species: "Армія рівних можливостей"
bag_undesirables_law_equal_species_desc: "Нарешті настав час — після років спільної боротьби всі рівні у війську. Ми з гордістю усуваємо останні бар’єри, що відокремлювали гулів від звичайних солдатів, і починаємо їхнє просування на офіцерські посади."

