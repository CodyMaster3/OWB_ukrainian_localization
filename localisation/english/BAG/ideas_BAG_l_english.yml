bag_addiction_treatment_desc: "Лейтенанта Ларсена відправили до санаторію Бірч-Гіллз для лікування важкої наркотичної залежності та параноїдальної радіофобії. Це забере певний час, і ми відчуємо його відсутність, але персонал вірить — можливо, він повернеться новою людиною."

