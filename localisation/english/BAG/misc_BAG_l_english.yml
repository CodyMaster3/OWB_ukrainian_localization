# Благання Ґоддарда (якщо гравець ігнорує ZAX)
DOME_zax_goddards_plead_1:0 "§RНавіть не думай про це! Залишити його померти — це ціна, яку ми — ні, весь світ — не може заплатити!§!"
DOME_zax_goddards_plead_2:0 "§RВи ідіоти, абсолютні дурні! Припиніть марнувати час і негайно вирушайте до Купола!§!"
DOME_zax_goddards_plead_3:0 "§RБЛАГАЮ ВАС, НЕ ДАЙТЕ ЙОМУ ЗАГИНУТИ! НЕ ДАЙТЕ МОЇЙ ДИТИНІ ПОМЕРТИ!§!"
DOME_zax_goddards_plead_4:0 "§RВсе скінчено, так? Ми ніколи не встигнемо повернутися до Купола... Все, за що я боровся... були марними?§!"
DOME_zax_goddards_plead_5:0 "§RЯк мені з цим змиритись? Як ви можете чекати, що я продовжу цю тепер безглузду експедицію? Залиште мене. Дозвольте мені загинути разом із вибухом… і зі своїми мріями.§!"

