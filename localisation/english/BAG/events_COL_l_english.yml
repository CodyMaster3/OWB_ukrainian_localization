l_english:
  nf_col.1.title:0 "Урегулювання Конфлікту у Фронт-Рейнджі"
  nf_col.1.desc:0 "Як [ROOT.GetName], ви маєте можливість скоротити або подовжити ґніт перед початком тристоронньої війни між [BAG.GetName], [LUM.GetName] та [WHD.GetName]. Якщо грати за [ROOT.GetName], Конфлікт у Фронт-Рейнджі почнеться через 365 днів від початку гри.\n\nКолерідж, як відданий військовик, хоче зосередитися на інтенсивній військовій підготовці. Це лякає сусідів, і кожен його фокус скорочує час до конфлікту, до мінімуму в 180 днів.\n\nНатомість Ґоддард – людина науки і терпіння, що готовий зекономити час, не викликаючи страху, – може подовжити час до конфлікту до такого ж максимуму у 180 днів.\n\nУважний гравець може отримати стільки часу, скільки дозволяє шлях Ґоддарда, однак ціною буде слабша армія. А шлях Колеріджа, хоч і може сам по собі спричинити конфлікт, має перевірені методи – і зрештою може привести до кращого майбутнього для всього Колорадо."
  nf_col.1.a:0 "Вибір за тобою – що ти вирішиш?"

  nf_col_news.1.title:0 "Північний Колорадо у вогні"
  nf_col_news.1.desc:0 "Межа перейдена. Просвічені, Беґґери та Чахлі Пси вступили у відкриту війну одне з одним. Серія непорозумінь, викликаних недбалістю, невіглаством та банальним невезінням, перетворила Колорадо на порохову бочку, що вибухнула у кривавому протистоянні.\n\nБеґґери прагнуть здобути Купол Боулдера та дослідити його таємниці. Просвічені на чолі з культом хочуть об'єднати пустку, розганяючи наші лічильники Ґейґера. А Чахлі Пси просто намагаються вижити та зберегти гулів. Цей катастрофічний тристоронній конфлікт прикував погляди всього регіону, де кожен з нетерпінням чекає на його розв'язку."
  nf_col_news.1.a:0 "Зачекайте, а що тут робить НКР?"