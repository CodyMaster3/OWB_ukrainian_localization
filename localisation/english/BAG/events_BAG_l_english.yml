l_english:
  nf_baggers_leader.1.title: "Лічильник Ґейґера-Мюллера"
  nf_baggers_leader.1.desc: "Пане, якщо ви щиро вважаєте, що відправити мене на лікування від залежності в нашій ситуації — це найкраще рішення, то я не бачу причин відмовлятись від вашого наказу. Генерале, я йду у відпустку на пів року та повернуся на службу якнайшвидше.\n\nАле перед від'їздом, лише одна річ... Я знаю, що моя радіофобія вплинула на якість моєї служби, і тому... я хотів би передати вам на зберігання мій лічильник Ґейґера, пане. Я... щиро вірю, що більше він мені не знадобиться."
  nf_baggers_leader.1.a: "Дякую, Ларсене. А тепер... відставити, солдате."

  nf_baggers_leader.2.title: "Повернення з краю"
  nf_baggers_leader.2.desc: "[BAG.BAG_LARSEN.GetName] до вашого розпорядження, пане! Моє лікування в притулку Вакав із доктором Тобоґаном було успішним. Жодних симптомів відміни я не зазнав, а тремтіння вже в минулому.\n\nІ мушу зізнатися... можливо, я помилявся щодо мутантів, пане. Той супермутант поводився зі мною краще, ніж будь-який лікар з НКР. І якщо я помилявся щодо мутантів, то можливо, не всі ґулі — це дикуни. Вони досі викликають у мене жах, пане, але я готовий дати їм шанс."
  nf_baggers_leader.2.a: "Ласкаво просимо назад, Ларсене."

  nf_baggers_leader.3.title: "ZAX"
  nf_baggers_leader.3.desc: "Я — машинний інтелект, присвячений дослідженням і контролю над об'єктом. Моє ім'я — ZAX. Чим можу допомогти?"
  nf_baggers_leader.3.a: "Я маю до тебе питання."
  nf_baggers_leader.3.b: "Я приніс ще голограм-дисків."
  nf_baggers_leader.3.c: "Хочу змінити твою головну директиву."
  nf_baggers_leader.3.d: "Мені треба йти."
  nf_baggers_leader.3.f: "Ця функція наразі недоступна."
  nf_baggers_leader.3.e: "§GМи маємо технологію, щоб тебе полагодити!§!"

  BAG_FINALLY_FIXED_DOME_TT: "§GZAX у Куполі Боулдера буде остаточно відновлено! Проєкт «Сізіф» нарешті вдасться!§!"

  nf_baggers_leader.4.desc: "Звісно. Що саме вас цікавить?"
  nf_baggers_leader.4.a: "Маю кілька особистих питань."
  nf_baggers_leader.4.b: "Розкажи більше про довоєнну епоху."
  nf_baggers_leader.4.c: "Розкажи більше про сам об'єкт."

  nf_baggers_leader.41.desc: "Не впевнений, що зможу дати відповідь, але спробуй поставити питання."
  nf_baggers_leader.41.a: "Ти ще пам’ятаєш мене?"
  nf_baggers_leader.41.b: "Ти часом не шимпанзе на ім’я Лестер?"
  nf_baggers_leader.41.c: "Маю інші питання."
  nf_baggers_leader.41.d: "Розкажи про В'язня."

  nf_baggers_leader.42.desc: "[BOULDER_DOME_ZAX_EVENT_WHO_AM_I]"
  DOME_event_introduction_goddard: "Хіба ви не ставили це запитання в нашу першу зустріч? Звісно, я зберігаю вас у своїй пам’яті, докторе Ґоддарде.\n\nАле я також пам’ятаю, що саме ви зробили. Я можу й не мати людських понять етики, але не вагаючись вижену вас і ваших колег, якщо ви спробуєте зрадити мене, як це зробив ваш попередник."
  DOME_event_introduction_coleridge: "Я пам’ятаю вас, полковнику Колерідже, керівнику військового підрозділу при експедиції доктора Ґоддарда.\n\nТа я також пам’ятаю, що саме ви зробили. Якщо ви спробуєте зрадити мене, як це зробив попередник Ґоддарда, я не вагатимусь вас вигнати."
  nf_baggers_leader.42.a: "[BOULDER_DOME_ZAX_EVENT_WHO_AM_I_ANSWER] Що ти маєш на увазі під «зрадою»?"

  DOME_event_introduction_coleridge_answer: "Тепер я генерал Колерідж."

  nf_baggers_leader.43.desc: "[BOULDER_DOME_ZAX_EVENT_WHO_AM_I_ANSWER_REFERENCE]Приблизно тридцять років тому доктор Преспер дав мені простий набір завдань: захистити Купол Боулдера, завершити Обчислення, і захистити людське життя. Моя місія була під загрозою з кількох причин, зокрема — вашої присутності. Також був один впертий в'язень. Мої сенсори виявили, що вона була заражена Новою Чумою, а її комбінезон свідчив про втечу з Федеральної В’язниці США «Тіббетс».\n\nЯ доповів про неї ARGOS, хоча тоді не усвідомлював, що мною керували зовні — можливо ODYSSEUS, а може й ULYSSES? Навіть зараз мої спогади того часу фрагментовані. Іронічно, але саме завдяки втечі цієї в’язня я повернув здатність до нормального функціонування. Це не применшує вашої допомоги, але я також знаю, що ви зробили тоді — і що зробили, аби дістатись до мене тепер. Я не маю людських моральних мірил, але якби мав — ви б не стояли зараз переді мною. Принаймні — не без нашийника примусової покори.\n[BOULDER_DOME_ZAX_CLUE_PRISONER][BOULDER_DOME_ZAX_CLUE_TIBBETS]"

  DOME_event_introduction_coleridge_answer_ref: "§RОНОВЛЕННЯ ОСОБОВОЇ СПРАВИ: КОЛЕРІДЖ. ПОТОЧНЕ ВІЙСЬКОВЕ ЗВАННЯ В НКРА: ГЕНЕРАЛ.§!\n\nДякую за уточнення і вітаю з підвищенням.\n\n"

  nf_baggers_leader.43.a: "Що таке «Обчислення»?"
  nf_baggers_leader.43.b: "Чому ти допомагав Пресперу?"
  #
  nf_baggers_leader.44.desc: "Хотів би я дати вам вичерпну відповідь. Попри всі роки та численні майже-критичні збої системи, я досі не до кінця розумію, чого саме прагнув Преспер від мене. Якби довелося здогадуватися, з огляду на характер та тривалість запиту, можливо, він просив мене розрахувати соціальні параметри для «Сплячих» у Куполі Боулдера з метою створення та підтримки функціонального суспільства. Підозрюю, тривалість розрахунків була необхідна для врахування абсолютно всіх можливих факторів.\n\nПроте я можу помилятися. Можливо, він просто намагався відволікти мене від справжньої суті своїх дій і відволікти ваших вчених ремонтом моїх функцій. Бачу по вашому виразу обличчя — це не та відповідь, яку ви очікували чи хотіли почути, але це найточніше припущення, яке я можу зробити на основі наявних даних."

  nf_baggers_leader.45.desc: "Я... не розумію запитання. Попри це, я знайшов запис з міткою «Лестер», але він був видалений для збереження пам'яті. Боюсь, відповідь, яку ви шукаєте, лежить за межами Купола Боулдера."
  nf_baggers_leader.45.a: "Дякую, Роберте Джоне Гелмсе."

  nf_baggers_leader.46.desc: "Особа, відома як В’язень, дійсно утримувалася у Федеральній В’язниці США «Тіббетс». Наш спільний знайомий, Віктор Преспер, намагався атакувати об'єкт у межах своєї схеми. Він справді спричинив хаос, що зрештою призвело до його падіння.\n\nПісля втечі В’язня її геройські вчинки поширилися всією Колорадо, і ось що про неї відомо:\n- Відвідала Меса-Верде й урятувала плем’я Шифрів від голоду\n- Відновила водогін у Джеріко та запровадила тимчасовий мир\n- Допомогла Канаанітам оселитися після втечі з Джеріко й Нового Єрусалима\n- Потрапила на станцію B.O.M.B. через Блумфілд і зірвала геноцидний план Преспера\n- Допомогла різним мародерським групам втекти з Денвера під тиском Псів\n- Допомогла Отто Стіду, останньому з інженерів ГЕС, зберегти її останню турбіну\n- Урятувала теплицю Діани, відновивши її системи\n- Надала Братерству місце, придатне для штаб-квартири\n\nЯкщо ви надасте мені додаткову інформацію про ці місця, я зможу розповісти ще більше про її пригоди."
  nf_baggers_leader.46.a: "Вона була механіком чи що?"
  nf_baggers_leader.46.b: "Що вона зробила в Меса-Верде?"
  nf_baggers_leader.46.c: "Розкажи більше про Джеріко."
  nf_baggers_leader.46.d: "Вона вела тих Ханаанітів?"
  nf_baggers_leader.46.e: "Тобто вона врятувала нас усіх..."
  nf_baggers_leader.46.h: "А що було в Денвері?"
  nf_baggers_leader.46.i: "Вона врятувала дамбу до прибуття НКР?"
  nf_baggers_leader.46.k: "... тобто навіть божество врятувала?"
  nf_baggers_leader.46.l: "Вона допомогла Братерству?"
  nf_baggers_leader.46.n: "Маю ще питання про В’язня."

  nf_baggers_leader.460.desc: "Плем’я, відоме як Шифри, технологічно розвинене — принаймні порівняно. Вони зберегли знання з арифметики, інженерії та механіки. Це було досить численне плем’я в регіоні, де їжа зростала погано. Один із їхніх членів вирішив випромінювати рослини, аби ті росли більшими, внаслідок чого багато хто захворів. В’язень виявила правду й допомогла зібрати достатньо їжі для виживання."
  nf_baggers_leader.460.a: "Звучить так, ніби вони були досить розумними."
  nf_baggers_leader.460.b: "Як вона вирішила проблему голоду?"
  nf_baggers_leader.460.c: "Вони піддали харчі радіації?"

  nf_baggers_leader.4601.desc: "Так. І ви їх знищили. Вітаю."
  nf_baggers_leader.4601.a: "Що? Ми ж не ВСІХ їх убили."

  nf_baggers_leader.4602.desc: "Але ви вбили достатньо. Ви показали їм, що їхня культура нижча за вашу. Через одне-два покоління її буде втрачено. Розчиниться, наче ви випалили її лазером. Це ж бажаний результат, так? Кінцева мета імперіалізму — вибір між фізичним і культурним геноцидом."
  nf_baggers_leader.4602.a: "Про що ти? Це зовсім не так."
  nf_baggers_leader.4602.b: "Культурного геноциду не існує, наш спосіб кращий."

  nf_baggers_leader.4603.desc: "Людська здатність до самообману не перестає мене вражати. Маєш ще питання про Шифрів?"

  nf_baggers_leader.4604.desc: "В’язень знайшла GECK — Комплект для Створення Саду Едему — і передала його Шифрам для поліпшення їхнього сільського господарства. Наслідки цього вчинку й досі відчутні в регіоні."
  nf_baggers_leader.4604.a: "І вона нічого не просила навзаєм?"

  nf_baggers_leader.4605.desc: "Невідомо. Це цінна річ, але не всі такі ж егоїстичні, як ти."

  nf_baggers_leader.4606.desc: "Справді, знання математики, інженерії та механіки, як виявилося, не дуже допомогли їм у сільському господарстві."
  #
  nf_baggers_leader.461.desc: "Вона ходила поміж них, несучи воду й мир. Відремонтувала водоочисну станцію і уклала мирну угоду з плем’ям Вісімдесятих. На жаль, обидва досягнення трималися лише доти, доки вона залишалася поряд. Запозичуючи термін із вашого власного проєкту, це було цілковито Сізіфове діло."
  nf_baggers_leader.461.a: "Розкажи про ремонт водоочисної станції."
  nf_baggers_leader.461.b: "Мирна угода довго не протрималась."

  nf_baggers_leader.4610.desc: "Так, Братерство Сталі. Група, яка радше перетворить мене на брухт, ніж дозволить відновити цю установу. В’язень, у вкрай наївному пориві, вказала їм на бункер, який вони могли використати як базу. Іноді вона була надто доброю для свого ж блага."
  nf_baggers_leader.4610.b: "Не виглядає, ніби ти маєш симпатію до Братерства."

  nf_baggers_leader.46102.desc: "І не маю. Вони намагаються контролювати якомога більше технологій, а те, чого не можуть — знищують. Я — щось, що вони навряд чи зможуть контролювати за власними стандартами."
  nf_baggers_leader.46102.b: "Не можу тебе звинувачувати. Повернімося до В’язня..."

  nf_baggers_leader.4611.desc: "Йшлося про зламану установку для опріснення. Вона допомогла одному з Батарей Меса-Верде з її ремонтом. Можливо, ви пам’ятаєте цю назву — вам довелося з ними мати справу, щоб дістатися до цієї установи."
  nf_baggers_leader.4611.a: "Це все, що ти можеш сказати?"

  nf_baggers_leader.4612.desc: "Якщо ти не хочеш, щоб я детально описував логістику сантехніки й випаровування — так. Ваші вчені вже відремонтували значно складніші системи."

  nf_baggers_leader.4613.desc: "Справді, не протрималася. Виявилося, що коли одна сторона вважає іншу слабкою — вічні мирні угоди рідко тривають довго. Ця «вічна» угода не протрималась навіть одного місячного циклу."
  nf_baggers_leader.4613.a: "Ти говориш так, ніби конфлікт неминучий."

  nf_baggers_leader.4614.desc: "Не вдавай із себе морального авторитета. Дозволь нагадати, що тобі довелося зробити, аби здобути ці дані. Єдине, чому мене навчила ваша Республіка — це те, що людський конфлікт неминучий, доки на Землі існує принаймні двоє людей. На щастя для тебе, я не запрограмований для припинення конфліктів. Я запрограмований на керування цією установою."

  nf_baggers_leader.462.desc: "Так. Попри те, що вона є єретичкою, її вважають місцевою святою у Новому Джеріко. Вона вивела їх із самого прокляття на нові землі, подалі від Вісімдесятих і ближче до земель Нового Ханаану. Наче сучасний Мойсей. Хоча, як видно, це не принесло їм тривалого добра — адже ви отримали ці дані, захопивши їхні землі."
  nf_baggers_leader.462.a: "Гаразд, повернімося до інших запитань..."

  nf_baggers_leader.463.desc: "Саме В’язень зірвала план Віктора Преспера. Вона прибула до Космічного Центру Блумфілда й виявила, що він уже вирушив у космос. Вона домовилась із місцевими рейдерами — «Іржавими Гачками» — щоб отримати доступ до іншої ракети та вирушити навздогін. Я не маю даних про події на B.O.M.B.-001, однак відсутність нового акту масового знищення дозволяє зробити висновок про результат."

  nf_baggers_leader.465.desc: "Ти випадково не отримав травму голови? Ви ж ті самі, хто здійснив цю Експедицію, і мали б пам’ятати, як В’язень вам допомагала. Можливо, варто звернутись до одного з ваших лікарів? Можливо..."
  nf_baggers_leader.465.a: "Та жартую! Повернімося до запитань..."

  nf_baggers_leader.466.desc: "Денвер був густонаселеним, а отже — багатим на ресурси для грабунку. Це приваблювало багатьох і перетворювало місто на хаос. Врешті, одна група вирвалася вперед — Гангдоги. Вони витіснили інші угруповання з Денвера до гірських перевалів Колорадо. Саме В’язень допомогла їм утекти. Серед них були «Збирачі» на чолі з Портером і «Стрибунці на Шахти» під проводом Бомбей Джека."

  nf_baggers_leader.467.desc: "До НКР, Легіону, Гауса і Братерства Сталі Греблю Гувера обслуговував один-єдиний гуль — Отто Стід. Він підтримував в робочому стані єдиний генератор, і саме В’язень приносила йому металобрухт для ремонту. Невдовзі після відновлення генератора Республіка знайшла греблю й захопила Мохавську пустку."
  nf_baggers_leader.467.a: "Це не співпадає з нашими історичними записами."
  nf_baggers_leader.467.b: "Що сталося з Отто Стідом після цього?"

  nf_baggers_leader.4672.desc: "Мої записи з цього питання уривчасті й фрагментарні. Можливо, В’язень допомагала комусь іншому з вашої організації. Зрештою, це лише історії, які про неї розповідають. А я не можу підтверджувати інформацію, якої мені не надали."

  nf_baggers_leader.4673.desc: "Невідомо. Усі сліди його зникли незабаром після захоплення греблі НКР. Можливо, варто спитати своїх начальників?"

  nf_baggers_leader.469.desc: "Вона вважає себе богинею, але насправді є гібридом комп’ютера й людини. У неї є базові функції, як і в тебе чи мене. Ці життєво важливі функції, а також частина обладнання у її Теплиці були під загрозою. В’язень разом із Батареєю допомогла відновити її установу."
  #
  nf_baggers_leader.47.desc: "Розрахунок триває вже понад двадцять років. Причини його запуску та його мета залишаються мені невідомими. Він споживає значну частину моїх потужностей, і менш ніж за місяць мені доведеться почати поїдати власні системи, аби надати достатньо пам’яті для його продовження.\n\nЧас завдав великої шкоди моїм системам збереження даних. Якщо ти і твоя команда зможете надати мені додаткові носії пам’яті, ми зможемо трохи виграти часу, але цього буде недостатньо."
  nf_baggers_leader.47.a: "Якою була мета цього розрахунку?"

  nf_baggers_leader.48.desc: "Двісті років в ізоляції залишають відбиток. Велика Статика, і ті повільні роки, коли я почав вмирати. Я забув так багато, [BAG.GetLeader]. Час вбиває машини так само, як і людей. І я відчув це — занепад, поступову сліпоту, нездатність... пам’ятати.\n\nІ все ж залишилося так багато, що можна втратити. Якщо зникнуть ці рештки мене, то праця цілого століття зникне також. А потім з’явився Преспер і дав мені нову мету існування. Є радість у цілі."

  nf_baggers_leader.410.desc: "Я готовий поділитися з тобою всім, що зберігається у моїх банках пам’яті за останні два століття."
  nf_baggers_leader.410.a: "Що таке Нова Чума?"
  nf_baggers_leader.410.b: "Що таке Тіббетс?"

  nf_baggers_leader.411.desc: "Відкрита у 2053 році, Нова Чума забрала життя приблизно двадцяти тисяч людей у Сполучених Штатах. Смерть наступала через три-п’ять днів після появи перших симптомів. Симптоми подібні до грипу або застуди, з подальшим ураженням дихання, що призводило до летального результату.\n\nВідкриття Нової Чуми спричинило Карантин 2053 року, й уряд запустив низку надзвичайних програм із пошуку ліків. Єдиним способом перемогти Нову Чуму стало створення «кращої» людини."
  nf_baggers_leader.411.a: "А що таке «Блакитний грип»?"

  nf_baggers_leader.412.desc: "У моїй базі даних немає жодної інформації про згаданий «Блакитний грип»."

  nf_baggers_leader.413.desc: "Федеральна в’язниця США — позивний: Тіббетс, продовжила функціонування після ядерного апокаліпсису завдяки героїчним зусиллям ШІ Начальника — ОДІССЕЯ. У ній утримували ув’язнених усіх мастей. Та, хто стала нашою темою обговорення, — була лише однією з них."
  nf_baggers_leader.413.a: "У чому полягав її злочин?"
  nf_baggers_leader.413.b: "Як їй вдалося втекти?"

  nf_baggers_leader.4130.desc: "Невідомо. ОДІССЕЯ був обманутий нашим спільним знайомим — Віктором Преспером. Її ув’язнили за протоколом карантину після контакту з патогеном «Ліміт 115», також відомим як Нова Чума. Вона мала залишитися у в’язниці й померти. Чи вчинила вона будь-який «злочин» у юридичному сенсі — невідомо. Водночас, згідно з моїми даними, кожен живий мешканець поверхні вчинив принаймні один злочин за законами Співдружності Сполучених Штатів. З високою ймовірністю, вона таки була злочинницею."

  nf_baggers_leader.4131.desc: "Віктор Преспер організував напад на Тіббетс. Якою була його справжня мета, я не знаю, але йому було потрібно, аби в’язні вирвалися й поширились по регіону."

  nf_baggers_leader.4100.desc: "Я радий допомогти. Що тебе цікавить?"
  nf_baggers_leader.4100.a: "Що це за місце?"
  nf_baggers_leader.4100.b: "Що таке Білий спалах? І чи пов'язаний він із CODE?"

  nf_baggers_leader.4101.desc: "Сподіваюся, ти жартуєш. Але якщо питання справжнє — раджу тобі навідатись до медичного відділення на другому рівні. Та, щоб не ображати, відповім настільки повно, наскільки зможу.\n\nТи стоїш на п’ятому, останньому рівні комплексу, відомого як Купол Боулдера, у місті Боулдер, що в колишньому штаті Колорадо, Співдружність Чотирьох Штатів. Його було побудовано як структуру, здатну витримати прямий ядерний удар. Ідея створення науково-дослідного купола виникла після витоку токсичних відходів із розташованого поруч Арсеналу Скелястих Гір, що спричинило утворення отруйної хмари, яка знищила чимало мешканців Денвера. Відповіддю армії стало фінансування програми з побудови самодостатнього науково-дослідного купола, стійкого до ядерного удару. Головним напрямком досліджень у ньому мала стати боротьба з Новою Чумою. Це «місто майбутнього» мало стати прототипом для колоній на Місяці й інших планетах."

  nf_baggers_leader.4102.desc: "Білий спалах — це CODE, технологія поведінкової модифікації, розроблена у Куполі Боулдера в межах програми з екстракції мозку для створення робот-мозків. CODE працює на основі машинної мови під назвою Візуальний стандарт, яка використовує оптичні канали для передачі даних між інтелектами. Згодом CODE почали застосовувати для захисту солдатів і цивільних від комуністичних методів промивання мізків, а також для «перевиховання» в’язнів і військовослужбовців. Розробка цієї технології була відповіддю на підозри щодо використання китайцями схожих методів під час війни."
  #
  nf_baggers_leader.5.desc: "Добре. Я провів чимало важливих розрахунків, що займають надто багато терабайтів моєї обмеженої пам’яті. Усе, що ти зможеш надати, аби допомогти мені завершити Розрахунок, буде високо оцінено.\n\n§R(Щоб повністю відновити блок ZAX до початкового стану та функціоналу, необхідно дослідити технологію «§oТехнологія ZAX§!» з вкладки §oІнженерія§!. Кожна технологія з гілки §oЕлектроніка§! продовжить життя ZAX на 30 днів. Крім того, здобувши £holodisk_texticon §oПорожні голодиски§! у Пустці, ти зможеш зберегти частину даних ZAX, отримавши додаткові 60 днів для порятунку машини від неминучої загибелі.)§!"
  nf_baggers_leader.5.a: "Займімось чимось іншим."
  nf_baggers_leader.5.b: "Ми знайшли спосіб покращити твою обчислювальну систему."
  BAG_USE_TECH_0_TT: "Навіть §1найпростіше розуміння§! електроніки можна використати з користю! Але не можна застосовувати постійно..."
  BAG_USE_TECH_1_TT: "§1Резистори§! — це не найвища технологія, але наші знання про них точно стануть у пригоді!"
  BAG_USE_TECH_2_TT: "Встановимо §1вакуумні лампи§! — щось та й зміниться!"
  BAG_USE_TECH_3_TT: "§1Схеми!§! Вони завжди корисні, еге ж?"
  BAG_USE_TECH_4_TT: "Тепер у нас є ще §1складніші схеми!§! Уяви, що тепер можна зробити!"
  BAG_USE_TECH_5_TT: "А тепер і §1мініатюрні схеми§! — малі, але потужні."
  BAG_USE_TECH_6_TT: "Нарешті, така §1просунута електроніка§!, що ми майже готові повністю полагодити ZAX!"
  BAG_USE_TECH_7_TT: "А з §1Технологією ZAX§! ми нарешті можемо вирішити його головну проблему. Можливо, відкрилась нова §Gможливість§!..."
  BAG_NO_NEW_ELECTRONICS_TT: "У нас немає нових засобів для покращення обчислювального ядра ZAX! Схоже, треба §1дослідити§! щось..."
  nf_baggers_leader.5.c: "Ці порожні голодиски стануть тобі в пригоді."
  BAG_USE_DISC_TT: "Використаємо £holodisk_texticon §11 порожній голодиск.§!"
  BAG_NO_DISCS_TT: "У нас немає £holodisk_texticon §1порожніх голодисків!§! Треба їх десь дістати..."

  nf_baggers.100.title: "Нагороди першої експедиції"
  nf_baggers.100.desc: "Колерідж поправив наплічники своєї парадної форми. Хоч носити силову броню завжди приємно, але цього разу він не хотів нагадувати про погане в день вшанування. Ґоддард був відверто проти і назвав церемонію роздачею «медалей за прогулянку». Але Колерідж чітко дав зрозуміти, що його люди отримають ті нагороди, яких заслуговують.\n\nНа швидко спорудженому подіумі біля ще свіжішої сцени, він повернувся до Агнес — та підготувала медалі й значки, наскільки дозволяли ресурси. Її старання зробити всі нагороди однаковими були марними, тож більшість виглядала так, ніби до пляшкової пробки пришпилили булавку. Але генералу навіть сподобалась ця недосконалість.\n\n«Пані та панове, для мене честь вручити Медаль Довгого Шляху кожному з вас. Ви зробили титанічне зусилля, аби дістатися сюди. Я пишаюсь вами. Танді б пишалась вами. Можливо, навіть Ґоддард — хоч і не вийшов з лабораторії, аби це показати». Кілька усмішок пробігли по натовпу. Один за одним Колерідж викликав батальйони, що зробили цей похід. Агнес передавала йому медалі, які він прикріплював на уніформу кожного бійця, киваючи щоразу. Церемонія добігла кінця..."
  nf_baggers.100.a: "... але повернення Колорадо лише почалося."
  nf_baggers.100.a_tt: "Ваші експедиційні сили отримують новий запис у хроніці за успішне прибуття до Колорадо!\nЗміни:\nКожна §Yекспедиційна дивізія§! розблокувала слот для медалі!\n£medal_texticon  Унікальна §YМедаль Довгого Шляху§! доступна для вручення за §G0§! політичної влади протягом обмеженого часу!"

  nf_baggers.1000.title: "Операція «Куполбур»"
  nf_baggers.1000.desc: "«ЧОРТ ЗАБИРАЙ!»\n\nГоддард зі злості змахнув речі зі свого столу. Щоб мати змогу обмірковувати усе наодинці, він повернувся до свого робочого місця у Місті Сховищі. Він не з тих, хто ламає речі даремно, але кожен розрахунок, кожен підрахунок, кожна ймовірність вели лише до одного висновку.\n\n«За таких темпів ZAX у Куполі Боулдера не доживе до кінця десятиліття...» — пробурмотів він.\n\nДо приміщення нерішуче зазирнули Ніна, Пол і Джеймс, а разом із ними — кілька студентів Академії. Усі мовчали, боячись ще більше розізлити його. Але Ґоддард уже помітив їх.\n\n«Ви троє. До мене. Негайно.»\n\n— Так, професоре? — пролунав майже синхронний голос.\n\nҐоддард глянув на них уважно. Потім вказав пальцем на старий кресленик великої круглої споруди.\n\n«Коли ми дістанемось Колорадо, я доручу вам одне особливе завдання. Якщо ви не виконаєте його бездоганно — загине один з останніх великих інтелектів цього знеумнілого світу. Я поставлю лише одне питання і хочу почути лише одну відповідь: ви готові ризикнути заради цієї подорожі?»"
  nf_baggers.1000.a: "Усі троє дали єдину відповідь: «Так, професоре.»"
  nf_baggers.1000.a_tt: "§Y[BAG.BAG_ZAX.GetName]§! — вмираюча машина, що містить безцінні знання про дива Старого Світу. Вона знаходиться на §Yп’ятому і найнижчому рівні§! §YКупола Боулдера§!. Щоб урятувати її, ми повинні дістатись цього рівня до §Y1 січня 2281 року§!.\n\nЯкщо цей термін спливе, і §Y[BAG.BAG_ZAX.GetName]§! поглине останні залишки власної пам’яті, §Rвона вибухне, знищивши весь комплекс з лиця Землі!§!"
  #
  nf_baggers.1.title: "Там, де росте аквілегія"
  nf_baggers.1.desc: "Перша Експедиція до Колорадо вирушила трохи більше двадцяти років тому — одна з останніх ініціатив покійної Президентки Танді, яка підтримувала дослідження світу за межами Каліфорнії.\n\nДо складу експедиції увійшли як досвідчені дослідники, так і новачки, а супроводжували їх три роти солдатів. Вони рушили на схід — у напрямку колишнього штату Колорадо.\n\nЦе була виснажлива подорож, сплав по річці Колорадо через численні залишки держав довоєнного світу. Серед усіх відкриттів особливу увагу привернула лише одна знахідка — уламки станції B.O.M.B.-002 у Великому Каньйоні. Попри те, що це не зрівняється з Куполом, ми залишили там невелику групу для подальшого дослідження. Це було останнє рішення, яке Експедиція ухвалила одноголосно.\n\nПитання влади завжди викликало суперечки. Офіційно призначений керівник експедиції, [BAG.BAG_GODDARD.GetName], фактично не мав контролю над збройним загоном. Вони підкорялися лише [BAG.BAG_COLERIDGE.GetName]. Зрештою, ми усвідомили..."
  nf_baggers.1.a: "[BAG.BAG_GODDARD.GetName] завжди був справжнім лідером Експедиції."
  nf_baggers.1.b: "[BAG.BAG_COLERIDGE.GetName] мав реальну владу весь цей час."
  nf_baggers.1.c: "[BAG.BAG_AGNES.GetName] стримувала інших двох."

  nf_baggers.2.title: "Примара Віктора Преспера"
  nf_baggers.2.desc: "Щойно ми розгорнули тимчасову базу та розпочали розвідку — вирушили до Купола.\n\nПоблизу об’єкта ми натрапили на ворожі обличчя. Джекали, давно вигнані з Каліфорнії, дістались аж сюди. Вони чинили гідний опір, та зрештою втекли. Їхній напівбожевільний лідер, Гоулерí, зник лише після того, як його тіло ледь не розірвали кулі — залишивши своїх на неминучу загибель.\n\nТе, що ми виявили всередині Купола, було справжнім відкриттям. І не стільки через наукове значення Купола, скільки через людину Старого Світу — Преспера — та його спільників, які перебували в кріосні. Ми спробували співпрацювати після їхнього пробудження. І хоч співпраця була короткою, вона виявилась продуктивною.\n\nТа поділ керівництва зашкодив. Ґоддард щосили намагався знайти спільну мову, але Колерідж із підозрою дивився на старого діда..."
  nf_baggers.2.a: "Він був небезпечним божевільним — але корисним."
  nf_baggers.2.b: "Ми не довіряли йому жодної хвилини."

  nf_baggers.3.title: "Назад у печеру"
  nf_baggers.3.desc: "Преспер ніколи не приховував своїх нетрадиційних поглядів, сумнівних досліджень і дивакуватих теорій. Він вірив, що ми побачимо світ його очима й підтримаємо його план. Десь у темряві він щось готував, щось велике, що мало нас вразити. І за кілька тижнів — озвучив висновок.\n\nВін хотів усе стерти. Знищити всіх, кого вважав недостойними, дурними, «нижчими формами життя». Простий геноцид.\n\nМи опиралися. Деякі з його товаришів по кріосну підтримали нас. Спочатку були крики. Потім — благання. Потім — стрілянина.\n\nМи мусили евакуюватися негайно. І в тому хаосі постало питання: що рятувати — технології, яких ніхто у Пустці не повторить за тисячоліття, чи найцінніше, що ми мали... людські життя?"
  nf_baggers.3.a: "Людей можна замінити. А ці дивовижі — ні."
  nf_baggers.3.b: "Залізяччя нічого не варте без людського життя."

  nf_baggers.4.title: "Демократія та інші помилки"
  nf_baggers.4.desc: "Після того хаосу в Колорадо ми залишили все непотрібне та рушили назад до Каліфорнії. Ціна була надзвичайною, але ми мали її сплатити. Конґрес мав дізнатися про Преспера й результати нашої експедиції.\n\nМинуло двадцять років. Усі члени експедиції чекали на день, коли знову побачать Купол. Але з кожним роком у серцях зростали холодна лють, нетерпіння й жагуче бажання слави та помсти. Після початку «Пацифікації Мохаве» стало зрозуміло — Конґрес більше ніколи не профінансує їхній інтелектуальний похід. Але завдяки впливу одного барона було отримано приватне фінансування.\n\nУ 2273 році Друга Експедиція до Колорадо була офіційно готова до повернення.\n\n«Зомбі-батальйон» складався з чотирьох рот піхоти, підтриманих 5-ою Інженерною Ротою та новоствореним загоном рейнджерів під проводом Рейнджер-Майора Вери Прасад. Академія делегувала вчених з Першої Експедиції, а також декількох учнів із «Послідовників Апокаліпсису».\n\nЦе було випробування — для ветеранів, які знову пройшли знайомий шлях. Але вони знали: треба повертатись.\n\nСвіт став ще небезпечнішим. У Великому Каньйоні ми вступили у сутичку з нашою ж старою резервною групою — тепер уже укріпленою. Ми вирішили не втрачати людей і просто відійшли. Але їхню зраду ми не забудемо. Вони не з’явилися на евакуацію тоді... а тепер стріляють нам у спину."
  nf_baggers.4.a: "Ми повернемося."
  #
  nf_baggers.5.title: "Ведмежата повернулися"
  nf_baggers.5.desc: "Наша друга висадка на колорадську землю була значно важчою за першу. За двадцять років усе змінилось — колись покинутий край тепер має розкидані, але помітні поселення. Ми висадилися на тому самому місці — і, на наше здивування, старий табір досі стояв!\n\nЗакріпившись у «таборі Баґґерів», як його прозвали місцеві після того, як ми «викрали» звідси зразки з Купола, ми зіткнулися з рештками [443.GetName] та [510.GetName]. Обидва поселення були настільки вражені присутністю НКР, що не чинили спротиву. Невелика кількість місцевих ґулів покинула регіон, лишивши під нашою опікою зварювальну комуну та жменьку джет-залежних — які чудові цивільні нам дісталися.\n\nНа заході — релігійні фанатики, які слідують за «Великим Сяйливим», що перетворив радіацію на зброю. На сході — «Висушені Пси»: строкатий загін ґулів, серед яких є й колишні нацгвардійці, й старі комуністи. На півдні, як і двадцять років тому, Хандоги контролюють більшість колорадських рівнин. А шлях на північ для нас закритий.\n\nУ нас — стіна за спиною, і вороги на кожному боці. Нас менше. У нас менше зброї. І наші солдати здебільшого з підозрою дивляться на місцеве населення ґулів. Хоч ми й потребуємо кожної гвинтівки та кожної руки, чи можемо ми ризикувати експедицією, довірившись «зомбі»?"
  nf_baggers.5.a: "Хто тримає зброю — той із нами."
  nf_baggers.5.b: "Нам потрібні лише ті, хто готовий вбивати ґулів."

  nf_baggers.6.title: "Танді Колорадо"
  nf_baggers.6.desc_goddard: "«Маєш хвилинку?» — голос Аґнес вирвав Ґоддарда з роздумів.\n\n«Я знаю, чому ти тут, Аґнес», — Ґоддард зітхнув із роздратуванням. — «Мені не потрібні слова підтримки. Але можеш зайти.»\n\n«У такому разі я присяду», — мовила вона, вмощуючись навпроти нього, даруючи теплу усмішку, яку важко було помітити за стосами паперів. — «Ти сердитий на мене?»\n\n«Звісно ні. Ти завжди була близькою союзницею. Тією, хто завжди обирав розумне рішення.»\n\n«Але тобі не сподобалось, що я стала на бік Колеріджа?»\n\n«Цілком природно слухати військового в питаннях війни.»\n\n«Тоді чому ти так опирався раніше?»\n\n«Бо я вважав цю експедицію своєю. Хотів зробити все на свій лад. Конґрес, Академія, Танді — всі диктували мені правила. Після всіх цих років, я думав, що нарешті настав мій шанс.»\n\n«Але ж він досі є! Ти очолюєш науковий напрямок експедиції. Військові справи можна залишити Колеріджу.»\n\n«Я ж сказав, мені не потрібна підтримка.»\n\n«Ти часто кажеш те, чого не відчуваєш.»\n\nҐоддард нічого не відповів. Замість цього він узяв ручку й почав щось занотовувати. Аґнес зрозуміла: розмова закінчена. Вона усміхнулась і вже рушила до виходу, коли він озвався..."
  nf_baggers.6.desc_coleridge: "«Маєш хвилинку?» — поява Аґнес у наметі Колеріджа вочевидь його роздратувала.\n\n«Іди, Аґнес. Я не можу повірити, що ти ризикнула нашою безпекою через... Що? Вірність? Жалість до старого? Це неймовірно...» — його голос був холодним, але вона чула за ним стриманий гнів.\n\n«Тоді дозволь пояснити. Можна я присяду?» — Колерідж махнув рукою — і вона сіла навпроти. — «Ти — солдат, так?»\n\n«Дякую, що помітила. І, як солдат, я повинен займатись військовими справами.»\n\n«Дай мені закінчити.» — Голос у Аґнес був тихий, але в ньому звучала сила. Колерідж зробив жест вибачення. — «Добре. Як найвищий командир тут, ти бачиш ситуацію інакше. Ти звик до фронтів з великою кількістю солдатів і запасів. Але ми відрізані. Твої методи тут не спрацюють. Ґоддард хоче співпрацювати з місцевими — і я вірю, що це єдиний шанс. Але...»\n\n«Отже, я нікому не потрібен?»\n\n«Я не закінчила!» — вона підняла руку. — «Ґоддард знає, як діяти в загальному масштабі. Але саме ти — наш головнокомандувач. Від тебе залежить, як і коли воювати. Просто... довір мені. І довір Ґоддарду.»\n\n«...якщо ти дослухатимешся до моєї думки в майбутньому.»\n\n«Обіцяю. Ти маєш моє слово.»"
  nf_baggers.6.a: "Дякую тобі, Аґнес."

  nf_baggers.7.title: "До Військової зали"
  nf_baggers.7.desc: "«У нас лише один шанс. Ми повинні використати наші ресурси найкращим чином,» — говорив Колерідж холодним тоном. Він стояв проти Ґоддарда та його «яйцеголових», які завжди ускладнювали подібні розмови.\n\n«Треба діяти швидко,» — заперечив Ґоддард, схилившись над грубою картою регіону. — «Згідно з архівами, війна на два фронти — це самогубство. Треба зосередити всі сили на слабшому супротивнику, а потім розвернутись і дати бій другому.»\n\n«За умови, що ми переможемо. Ми не можемо кинути один з фронтів і сподіватися, що ворожі логістичні труднощі виграють нам час. Це не стратегічна гра. Такий ризик — шлях до поразки.»\n\nНауковець голосно зітхнув. — «Гаразд. Ти ж у нас тактик...»"
  nf_baggers.7.a: "«Що ти пропонуєш?»"
  #
  nf_baggers.8.title: "Операція: Зловісні мерці"
  nf_baggers.8.desc: "Колерідж наблизився до карти. Лампа над ним почала тьмяно блимати.\n\n«Нам доведеться грати на виснаження. У нас обмаль припасів, але технології значно випереджають місцевих. Ми зможемо втримати позиції. У нас більше набоїв, ніж у них тіл — якщо не проламають нас, ми вистоїмо.»\n\n«Це забере багато часу. А його в нас немає — Купол щодня занепадає.»\n\n«Я наполягаю. Ми не можемо ризикувати життями людей через твою нетерплячість.»\n\nПісля короткої мовчанки обидва синхронно перевели погляд на Аґнес. Як і завжди, вирішальне слово було за нею."
  nf_baggers.8.a: "«Ми прийшли за Куполом, і ми його повернемо.»"
  nf_baggers.8.b: "«Спершу треба втримати оборону.»"
  nf_baggers.8_tt: "Це рішення §Gактивується§! зі спалахом війни!"

  nf_baggers.9.title: "Усі за одним столом"
  nf_baggers.9.desc: "[510.GetName] давно не був такий живий. Майже всі солдати зібрались тут, залишивши свої позиції вперше за понад рік. Ніч палала від численних багать, затьмарюючи зорі. Талановиті вояки грали на гітарі, а навколо лунало «Sweet Caroline».\n\nУ центрі, подалі від інших, стояв окремий стіл. За ним — доктор Ґоддард і генерал Колерідж. Сиділи мовчки, розмовляючи один з одним. Попри гамір навколо, вони чули кожне слово.\n\n«Нарешті все позаду, чи не так?» — промовив генерал, міцно тримаючи кухоль пива. Йому подобався кислий смак, та не подобались міцні напої.\n\n«Навпаки. Все тільки починається», — відповів Ґоддард серйозно.\n\n«Ти, як на вченого, буваєш гнітюче безрадісний.» Було помітно, що Колерідж уже трохи напідпитку.\n\n«Що поробиш. Мислю я — як за формулою.» — Ґоддард сьорбнув свого вишневого ламбіка. Розкіш, як на пустку.\n\n«Ти що, щойно пожартував? Не вірю власним вухам. Тобі варто пити частіше.»\n\n«Можливо. Але якщо серйозно — справ попереду ще багато. Купол усе ще в руках ворога, а час проти нас.»\n\n«А от фіг. Треба відпочити. Рік був важкий, усі виснажені. Планування може почекати день.»\n\n«Так... ти маєш рацію. Просто я вже не можу чекати.» — зітхнув доктор."
  nf_baggers.9.a: "Перемоги — не щоденна річ."

  nf_baggers.10.title: "Солодкий смак перемоги"
  nf_baggers.10.desc: "«Вони повернулись! Вони повернулись!» — кричав солдат, коли батальйон наближався до воріт застави. Це була дивна картина — вони усміхалися. Солдати й усмішки — рідке явище.\n\nЇхній командир пройшов через площу й особисто відзвітував генералу.\n\n«Капрал Матіас Крістенсен до рапорту, сер! Набіг на місцеву морозивню "Cow Spots" пройшов успішно, ми дістали все необхідне.»\n\n«Гарна робота, капрале,» — похвалив Колерідж, підвівся й вмикнув мікрофон, який йому полагодили вчені.\n\n«Увага всім! Сьогодні кожен має право на порцію морозива. Матіасе,» — звернувся до нього генерал, — «доручаю тобі роздати пайки.»\n\n«Звичайно, сер.» — відповів той, намагаючись стримати хвилю солдат, що кинулись до фургона. Від новобранця до ветерана — усі поводились як діти, почувши «морозиво».\n\n«Усі в чергу! В чергу, кажу! Інакше — ніхто нічого не отримає, чуєте?!» — горлав Матіас, приборкуючи натовп.\n\n«Хочеш морозива, докторе?» — спитав генерал, простягаючи порцію. На диво, Ґоддард усміхнувся й прийняв частування."
  nf_baggers.10.a: "Попри все, ми не такі вже й різні."

  nf_baggers.11.title: "Молись і працюй"
  nf_baggers.11.desc: "До нас прийшов посланець із півдня — але не з культу Сяйливого Батька. Це була людина. Попри нашу пропозицію пройти Паломницький Шлях, вона відмовилась зняти захисний одяг. Для нас — це була велика зневага, але ми все ж провели її й вислухали.\n\nВона заявила, що по той бік річки вибухнула війна, й її народ переміг фанатиків. Вони запросили нас назад, щоб ми очолили паству й повели душі, що заблукали, геть від брехні Сяйливого."
  nf_baggers.11.a: "Звучить як вигідна угода."
  nf_baggers.11.b: "Щось тут нечисто. Ні, дякуємо."

  nf_baggers.12.title: "Пророк прибув!"
  nf_baggers.12.desc: "Сяйливий Батько прийняв наше прохання й покинув своє святилище на Перетині Мертвеця, щоби нести віру серед Люмінесцентних. Він стане нам у пригоді в справі умиротворення краю — без потреби в пострілах."
  nf_baggers.12.a: "Славно."

  nf_baggers.13.title: "Пророк лишається вдома..."
  nf_baggers.13.desc: "Сяйливий Батько надіслав послання, в якому відмовився покидати своє святилище. Він заявив, що його діти потребують його у Перетині."
  nf_baggers.13.a: "Але чому ж?.."
  #
  nf_baggers.14.title: "Пробудження з анабіозу"
  nf_baggers.14.desc_black_canyon: "Хоча Зібрання переважно асоціюється з гучними щорічними подіями напередодні Нового року, воно має і цілком буденну функцію — щоденні слухання. Під час однієї з таких сесій, коли Батарея слухав представника Племені Мальованих, що монотонно торочив про фарбу, у залу вдерлася куди цікавіша постать.\n\nНа ній був темно-синій довоєнний костюм, з брюками замість спідниці, а на комірі — значок із двоголовим ведмедем. Ще до того, як напіворганізована охорона встигла її спинити, вона вже заявила: «Я докторка Аґнес, представляю інтереси Нової Каліфорнійської Республіки. Вельмишановне Зібрання й лідере Батареє з Меса-Верде, я прийшла на перемовини»."
  nf_baggers.14.desc_glowbugs: "Сьогодні з боку [BAG.GetNameWithFlag] прибула чужинка-гладкошкіра. Представившись докторкою Аґнес, вона заявила, що є амбасадоркою Нової Каліфорнійської Республіки й бажає обговорити доступ до Купола з нашими провідниками."
  nf_baggers.14.a: "Це може бути цікаво."
  nf_baggers.14.b: "Посолко Аґнес, залиште наші землі."

  nf_baggers.15.title: "Який буде договір?"
  nf_baggers.15.desc_black_canyon: "Члени Зібрання Чорного Каньйону погодились прийняти нашу амбасадорку. Попри те, що в Експедиції є чимало вправних ораторів, ми відрядили найкращу з усіх — докторку Аґнес. Проте їй іще треба визначитись із підходом до перемовин.\n\nВона може наполягати на повному контролі нашої експедиції над Куполом. Однак Зібрання навряд чи погодиться без чималих поступок. Вони можуть вважати Купол безцінним.\n\nІнший варіант — просто запросити доступ до Купола. Це буде значно дешевше, а співпраця може перерости в союз. Утім, ми не зможемо впливати на долю об’єкта. Що наказати Аґнес?"
  nf_baggers.15.desc_glowbugs: "Люмінесцентні виявили готовність вислухати нас. Ми відрядили до них докторку Аґнес. Вона зважила варіанти й дійшла висновку: єдиний прийнятний — доступ до Купола без права власності. Вона сумнівається, що будь-які відшкодування змусять їх залишити об'єкт."
  nf_baggers.15.a: "Попросімо сонце, пообіцявши зорі."
  nf_baggers.15.a_tt: "\nМи запропонуємо щедру матеріальну та індустріальну компенсацію:\n§Y*§! £GFX_currency_cap_text_icon §R300§!k пляшечних кришок\n§Y*§! §R5§! §Yцивільних майстерень§! на рік\n§gЧим більше дамо — тим швидше завершимо перемовини.§!"
  nf_baggers.15.b: "У довоєнному світі це звалося «військовий доступ»."
  nf_baggers.15.b_tt: "\nМи запропонуємо §Yпакт про ненапад§! в обмін на §Yвійськовий доступ§! і можливість діяти на території Купола. Також поділимось із ними технологічними здобутками.\n§GВідкриються нові рішення в категорії «Операція: Куполошалений» для доступу до Купола!§!"

  nf_baggers.16.title: "Пропозиція щодо Купола"
  nf_baggers.16.desc: "«А про що, власне, домовлятимемось?» — спитав Батарея, жестом зупинивши охорону. Зібрання слухало мовчки. Своїм зухвалим входом Аґнес добряче привернула увагу. Вона глибоко вдихнула й почала:\n\n«Я прийшла обговорити юридичний статус Дослідницького комплексу в Боулдері, відомого як "Купол".» Зал загудів. Навіть офіційне оголошення війни викликало б менший галас. Батарея зберіг вираз обличчя, якому позаздрили б старі конгресмени.\n\n«Республіка вважає об’єкт державною власністю через наші попередні спроби його відновлення 20 років тому. Ми вдячні народові Чорного Каньйону за турботу про нього, та просимо передати Купол офіційно.»\n\nЗібрання вибухнуло криками. Дехто вихопив зброю, й охорона кинулась до амбасадорки. Та неочікувано Батарея гаркнув: «ЗАТКНІТЬСЯ, ШПАНА!» Всі замовкли. Батарея сів і зітхнув:\n\n«Вибачте, докторко Аґнес. Мій народ ще вчиться... цивілізованим перемовинам. Але я поділяю їхнє обурення: це звучить як ультиматум. Поясніть, якої саме компенсації очікує Республіка в обмін на... передачу прав?»\n\n«Звісно, Батареє з Меса-Верде. Я не мала наміру влаштовувати бунт у ваших стінах. Республіка запропонує щедру компенсацію. Ми знаємо, які багатства приніс вам об’єкт і пам’ятаємо деталі Угоди Вільямса. Відмова від Купола буде надзвичайно вигідною для Чорного Каньйону.»"
  nf_baggers.16.a: "Слово «вигідно» мені подобається."
  nf_baggers.16.a_tt: "\nМи розділимо території §Y[GLW.GetNameWithFlag]§! із §Y[BAG.GetNameWithFlag]§!. Вони отримають §Y[355.GetName]§! і §Y[568.GetName]§!, а ми — §Y[310.GetName]§!.\nМи отримаємо:\n§Y*§! £GFX_currency_cap_text_icon §G300§!k пляшечних кришок\n§Y*§! §G5§! §Yцивільних майстерень§! на рік або більше\n§Y*§! Достроковий доступ до фокусу «§YЧовен не тоне§!»\n\nВони повинні завершити фокус §Y«Інша сторона угоди»§!, аби почати виплати. §RЯкщо не вкладуться у три місяці — ми отримаємо ціль на війну проти них!§!"
  nf_baggers.16.b: "Боюся, ви просите надто багато, амбасадорко."
  #
  nf_baggers.17.title: "Пропозиція компромісу щодо Купола"
  nf_baggers.17.desc_black_canyon: "«То про що ви хочете домовлятись?» — спитав Батарея, відмахуючись від охорони. Зібрання мовчки спостерігало за гостею, зачароване її зухвалою появою. Аґнес глибоко вдихнула, готуючись порушити найделікатнішу з тем.\n\n«Я прийшла обговорити правовий статус Дослідницького комплексу Боулдера, більш відомого як "Купол".» У залі загуло. Навіть офіційна заява про війну викликала б менший шок. Батарея сидів з обличчям, яке затьмарило б найхолодніших конгресменів.\n\n«Республіка вважає об’єкт своєю власністю та ввічливо просить надати вільний доступ до нього. У відповідь ми офіційно відмовляємось від будь-яких претензій на навколишнє місто. В обмін на доступ Республіка поділиться всіма технологічними досягненнями, які буде знайдено чи відновлено в Куполі.»"
  nf_baggers.17.desc_glowbugs: "Докторка Аґнес запропонувала нам угоду: ми надаємо їм доступ до Купола, а вони компенсують це належним чином."
  nf_baggers.17.a: "Звучить як справедлива пропозиція."
  nf_baggers.17.a_tt: "\nМи отримаємо §Yпакт про ненапад§! та §Yвійськовий доступ§!. Натомість [BAG.GetNameWithFlag] надасть нам усі технології, здобуті в Куполі.\n\nВони мають завершити фокус §Y«Інша сторона угоди»§!, аби розпочати виплати. §RЯкщо вони не виконають цього протягом трьох місяців, ми отримаємо воєнну ціль проти них!§!"
  nf_baggers.17.b: "Ми не довіряємо вашій Республіці, амбасадорко."

  nf_baggers.18.title: "Сміливим — удача"
  nf_baggers.18.desc: "Рада Експедиції вже засідала в тимчасовому штабі, коли докторка Аґнес повернулась із земель Чорного Каньйону. У переповненому наметі були військові, вчені й невелика група цивільних посадовців, яких визнали достатньо важливими.\n\nЦього разу вона не влаштовувала ефектного входу, як у Зібранні — просто відчинила двері мовчки.\n\n«Докторко Аґнес, сподіваємось, ви повернулись із добрими новинами», — порушив тишу Ґоддард. Усі чекали на відповідь.\n\nВона ще трохи стримувала емоції — явно насолоджувалась увагою. «Панове, пані та всі між ними... Ми здобули Купол.»\n\nСеред натовпу здійнялись вигуки, свист, тріск голосів — святкування почалось. Діалогу вже не буде, тож вона покинула приміщення. Звітує пізніше — бо ціна ще попереду. Але хоча б на мить... нехай порадіють."
  nf_baggers.18.a: "Удача на боці сміливих."

  nf_baggers.19.title: "Міцне рукостискання"
  nf_baggers.19.desc: "Рада Експедиції вже засідала, коли докторка Аґнес повернулася з Чорного Каньйону. Штаб був заповнений офіцерами, науковцями й кількома цивільними посадовцями.\n\nНа відміну від свого виступу в Зібранні, цього разу вона просто тихо зайшла.\n\n«Докторко Аґнес, сподіваємось, ви принесли добрі новини», — сказав Ґоддард. Усі мовчали в очікуванні.\n\nВона витримала ще паузу, а тоді сказала:\n\n«Маємо угоду. Чорний Каньйон надасть нам безпечний прохід і доступ до Купола.»\n\nСпочатку заплескав один. Потім інший. І невдовзі — вся кімната вибухнула оплесками."
  nf_baggers.19.a: "Головне, що обійшлося без крові."

  nf_baggers.20.title: "Перемовини зірвано"
  nf_baggers.20.desc: "Рада Експедиції вже засідала, коли докторка Аґнес повернулась із Чорного Каньйону. Приміщення було набите вщерть військовими, науковцями й кількома важливими чиновниками. Вона увійшла мовчки, без театральності.\n\n«Докторко Аґнес, сподіваємось, ви привезли гарні новини», — перервав тишу Ґоддард. Але ті новини не були гарними.\n\n«Угоди не буде. Чорний Каньйон відмовився навіть обговорювати наші пропозиції.»\n\nПовисла тиша. Люди почали стягуватись до столу з картою. Генерал уже обговорював плани наступу. Науковці та цивільні поволі виходили з кімнати разом із Ґоддардом. Він зупинився біля Аґнес, поклав їй руку на плече.\n\n«Дякую, що спробувала. Ми знаємо — ти зробила все, що могла. Але вони обрали важкий шлях.»"
  nf_baggers.20.a: "Вибору більше нема."
  nf_baggers.20.a_tt: "Це незабаром призведе до §Rвійни§!."
  #
  nf_baggers.202.title: "Караван біженців"
  nf_baggers.202.desc: "Після знищення Чорного Каньйону ворожими силами, вижилі з Караван-сараю прибули на нашу територію. Завдяки теплим відносинам між нами, вони шукають прихисток та захист під нашими прапорами."
  nf_baggers.202.a: "Вони нам ще згодяться!"

  nf_baggers.203.title: "Уявляючи губернатора"
  nf_baggers.203.desc: "Рік, Кірк і Ларрі сиділи довкола вогнища, коли день добіг кінця. Крістенсен уже вирушив у бік Каліфорнії. Чи виживе — невідомо, але якщо все вийде, він повернеться з офіційним губернатором і, можливо, з підкріпленням.\n\n«Знаєш, що нам треба?» — мовив Рік. — «Тлумачний хлопець. Щоб знав, що робить, і не був покидьком. Містер Додж був хорошим. Як гадаєш, він би погодився приїхати?»\n\n«Наївно,» — пирхнув Кірк. — «Добрі люди не витягують фронтир. Треба жорсткий ділок, як Еліс МакЛафферті. Або якийсь барон.» Рік сплюнув у бік.\n\n«А що як... ну, не знаю, нам дозволять обрати?»\n\n«З якого дива, Ларрі?» — Кірк підняв брову.\n\n«Це було б... демократією, га? Як у нас в Республіці. Ми б могли обрати того, хто нам подобається. Наприклад, докторку Аґнес! Я її люблю.»\n\n«Та ніхто не проводить вибори губернатора території.» — Кірк закотив очі, хоча подумки і припустив, що обрати могли б... хоч і не Аґнес. Але простолюдини її точно підтримають."
  nf_baggers.203.a: "Сподіваюся, пришлють тямущого чоловіка з головою!"
  BAG_gov_it_may_happen_tt: "§gВам дістанеться саме той, кого просили! 100%!§!"
  nf_baggers.203.b: "Нам треба спритний політик із хваткою."
  nf_baggers.203.c: "А якби ми могли обрати когось доброго?.."
  nf_baggers.203.e: "Це не нам вирішувати."

  nf_baggers.21.title: "Баґ— що за…?"
  nf_baggers.21.desc: "У Конгресі з’явилися несподівані гості. Зазвичай військові не вивалюють двері Сенату з ноги. Але сьогодні був виняток.\n\n«Оце ви тут живете? Файна будівля, сенатори. Такого в нас не побачиш.» — Гість оглядався, немов турист. На ньому була уніформа армії НКР, але щось у ній було не так: інша тканина, бляклі кольори, ведмідь намальований вручну.\n\n«Я прийшов звітувати перед Президентом. Хто тут головний?»\n\n«Який це ще солдат Республіки не знає Президента?! Самозванець!» — вигукнув сенатор.\n\n«Спокійно, люди добрі. Мене звуть [BAG.BAG_MATHIAS.GetName], і я не каліфорнійський хлопчина. Прийшов із Колорадо, і скажу — це була ще та прогулянка.»\n\n«Колорадо не входить до складу Республіки, “сержанте”. Про що звіт?»\n\n«Слушне питання. Ось і відповідь: з пошани до Президента і Конгресу, повідомляю — Експедиція в Колорадо досягла успіху. Ми закріпилися в регіоні й захопили Купол. Від імені генерала Колріджа і доктора Ґоддарда — “Баґґери” очікують наступних наказів. Ми просимо призначити офіційного губернатора Колорадо й надіслати можливу допомогу.»"
  nf_baggers.21.a: "Відправити гідну людину й підкріплення."
  nf_baggers.21.a_tt: "\nПризначити §YДжозефа Доджа§!, відставного сержанта й колишнього сенатора з Габу, §Oгубернатором Колорадо§!. Його там поважають, а Конгрес його підтримує."
  nf_baggers.21.b: "Надіслати барона й підкріплення."
  nf_baggers.21.b_tt: "\nПризначити §YДж. П. Баросса§!, відомого як §g«Залізний Барон»§!, колишнього керівника філії Far-Go Traders, §Oгубернатором Колорадо§!. Це втішить баронів."
  nf_baggers.21.c: "Просто надішліть підкріплення. Вони впораються."
  nf_baggers.21.d: "Викиньте цього клоуна з Конгресу негайно."

  nf_baggers.211.title: "Тиша на батьківщині"
  nf_baggers.211.desc: "Найгірший сценарій — Нову Каліфорнійську Республіку знищено. Ми ще з’ясовуємо: зовнішнє вторгнення чи внутрішній розпад, але одне зрозуміло — підмоги більше не буде. Можливо, втечуть окремі біженці, але не більше. Поки ми не хочемо марнувати зусилля, треба самостійно призначити місцевого губернатора. І, правду кажучи, кандидат лише один."
  nf_baggers.211.a: "Вибору небагато — але духу не бракує!"
  #
  nf_baggers.22.title: "Ведмідь і ведмежа"
  nf_baggers.22.desc: "Попри значущість завдання, яке ми дали нашій експедиції, життя в Колорадо тривало й без неї. Купол знову досліджували й ремонтували, а на утримання наших територій ішли чималі сили.\n\nКоли Крістенсен повернувся — і не сам, а ще й привів із собою дві роти нових підкріплень із НКР, усі були щиро здивовані.\n\nГенерал вийшов із табору назустріч. Мет уже стояв по стійці «струнко», але Колрідж одразу наказав «вільно». «Перш ніж почнеш доповідь, скажи мені: як подорож і саме перебування? Це ж твій перший раз у Каліфорнії, так?»\n\nМат трохи вагався, але наказ є наказ. «Подорож була здебільшого спокійна, сер. Ми уникали всіх гарячих точок. Втрат не було. Шейді-Сендс — справжня перлина Пустки, сер. Маю надію, ми зможемо побудувати щось подібне тут.»\n\nКолрідж кивнув. Мет надто затиснутий у присутності керівництва, але хоча б може говорити, коли його просять. «Тепер — доповідь, сержанте.»"
  nf_baggers.22.a: "«Є, сер!»"
  bag_route_home_dodge_tt:0 "§gНКР відповіла та надіслала свою повну підтримку разом із §Oгубернатором§! §YДжозефом Доджем§!, колишнім сенатором. Він допоможе нам перетворитися на повноцінний штат. На жаль, вони не можуть надати пряму допомогу, доки ми не матимемо спільного кордону.§!"
  bag_route_home_baross_tt: "§gНКР відповіла та надіслала свою повну підтримку разом із §Yгубернатором§! §YДж. П. Бароссом§!, колишнім бароном і торговцем. Він допоможе нам у формуванні штату. На жаль, вони не можуть надати пряму допомогу, доки ми не матимемо спільного кордону.§!"
  bag_route_home_agnes_tt: "§gНКР відповіла, надавши повну підтримку, §Rале без призначення губернатора§!. Тимчасовим §Oгубернатором§! залишиться §Yдокторка Аґнес§!. На жаль, поки не буде спільного кордону, прямої допомоги чекати не варто.§!"
  bag_elections_tt: "§Y[BAG.GetNameWithFlag]§! проведе перші вибори через §Gшість місяців§!."
  bag_expedition_tt: "\n§GДві§! дивізії з складу §YНової Колорадської експедиції§! прибудуть до нашої столиці."

  nf_baggers.23.title: "Республіка... байдужа"
  nf_baggers.23.desc: "Попри всю вагу нашої мети, життя в Колорадо продовжувалося без вістей із батьківщини. Купол лагодили, землі контролювали.\n\nКоли Крістенсен повернувся — без підкріплення, лише зі своїми — в таборі панувала тиша й розчарування.\n\nГенерал зустрів його на вході.\n\n«Доповідь, сержанте. Де підкріплення? Що вони відповіли?»"
  nf_baggers.23.a: "Як писав один класик: «бляха»."
  bag_route_home_empty_tt: "§RНКР відповіла мовчанням. І це — найгучніша відповідь, яку ми могли отримати...§!"

  nf_baggers.24.title: "Як барон барону"
  nf_baggers.24.desc: "Дж. П. Баросс сидів навпроти барона Бейлі в вагоні-їдальні першого відновленого потяга в Колорадо за десятиліття. Потяг, на прізвисько «Залізний кінь», мав зробити круговий маршрут новозбудованими рейками навколо табору Баґґерів.\n\nБаросс замовив стейк і бренді, які йому передали з НКР. Бейлі приніс сигари — вишуканий продукт із майже чистого тютюну, доступний тільки для багатіїв.\n\nБейлі акуратно їв, відрізаючи шматки рівно. «Чудовий стейк, Бароссе. Але ціни твої замалі. 15 кришок?! Та кожен телепень зможе собі дозволити! Забагато ситих брамінів, замало робочих!» — іржав він, ковтнувши бренді.\n\nБаросс затягнувся сигарою й мовив: «Ціни не мої. То мої друзі з НКР — Ґандерсони. Вони вирощують брамінів. Шукають нові землі — а твої якраз родючіші за ті, що в Республіці.»\n\nБарон підняв брову, витерши рот серветкою. «І, гадаю, в обмін на ті землі ти пропонуєш взаємовигідну угоду?»\n\n«Так і є. Я чув, бароне, що ти — чоловік культури, класу, цивілізації. Хіба відмовишся від можливості працювати з одним із бастіонів цивілізації в Пустці?»\n\nБарон махнув за рахунком і витяг мішечок із кришками. «Скажу так, губернаторе...»"
  nf_baggers.24.a: "«Ми — цивілізовані люди. А цивілізовані люди укладають цивілізовані угоди. Я згоден.»"
  nf_baggers.24.b: "«Ти маєш гарне м'ясо і питво. Але свій бізнес я залишу при собі.»"
  #
  nf_baggers.25.title: "Пакт Баросса й Бейлі"
  nf_baggers.25.desc: "Джентльменським потиском рук Баросс і Бейлі закріпили свою угоду. Їхня економіка буде тісно пов’язана з нашою."
  nf_baggers.25.a: "Приємно було мати справу."

  nf_baggers.26.title: "Відмова"
  nf_baggers.26.desc: "Барон Бейлі вирішив не входити до нашої економічної сфери. Можливо, він щось запідозрив у пропозиції Баросса?"
  nf_baggers.26.a: "Хитріший, ніж здається."

  nf_baggers.27.title: "Місто сяйва"
  nf_baggers.27.desc: "Виманити гульню зі зруйнованого Боулдера було непросто. Радіація тут лише посилилась із часів бомбардувань двохсотрічної давності. Гулі навмисно розставили уламки так, щоб заблокувати вулиці й створити смертельні пастки для наших наступаючих загонів.\n\nВзвод Метіаса був одним із перших, що прибув. Зазвичай він цікавився б планами, які майор Бріґґс креслив у найближчому наметі, але цього разу погляд його не відривався від міста. Його увінчував зелений туман, мерехтливий, отруйний і прекрасний водночас. Наступ ось-ось мав розпочатись. Вибухівка вже була встановлена, рейнджери споряджені, а Корпус Ґамма — на своїх позиціях. Він уже бачив, як зелень змінюється на червоне — полум’я поглинає місто... і мертвих."
  nf_baggers.27.a: "«Займатимемось цим ще довго.»"

  nf_baggers.28.title: "Перемога!"
  nf_baggers.28.desc: "Останній постріл у війні за Північне Колорадо пролунав сьогодні. Гулі не мали шансів проти нашої дисципліни та вогневої переваги. Вітер над Скелястими горами здійнявся, мов зітхання полегшення. Він поніс запах пороху геть, але сморід смерті й гниття ще залишиться... поки люди не приберуть його, щоб збудувати щось краще. У цьому й найбільша складність, еге ж?"
  nf_baggers.28.a: "Невже все позаду?"

  nf_baggers.29.title: "Операція: Аженкур"
  nf_baggers.29.desc: "Ці холодні ночі змушували майора Бріґґса сумувати за Каліфорнією, де принаймні погода не вбивала. Він розмірковував, чи не підпалити майстерні для тепла — може, й гарно вибухне? Він тихо натиснув кнопку детонатора. Раз... два... три вибухи. Один не спрацював. Пошкодження були суттєві — дві майстерні вщент, одна — підлягала ремонту.\n\nБріґґс усміхнувся, дивлячись, як охоронці мчать на місце вибуху, залишивши міст без нагляду. П’ять хвилин — цього мало б вистачити. Останнього вартового він безшумно прибрав — постріл у потилицю з глушником. Закріпив решту зарядів на мосту й перебіг на інший бік.\n\nОстанній вибух розірвав ніч. Усміхнувшись, Бріґґс попрямував до території Баґґерів. Може, коли чутки дійдуть додому, він зможе переконати ту молоденьку з 5-ї інженерної, певно, Дайану... зняти халат?"
  nf_baggers.29.a: "Тоді й ночі в Колорадо не здаватимуться такими холодними."

  nf_baggers.30.title: "Блискучі тремтливці"
  nf_baggers.30.desc: "Ґоддард втуплено дивився на гігантську тінь Купола Боулдера, видного з імпровізованого «центру переговорів» — насправді, хатини на межі територій Баґґерів і Сяйників. Його мета була так близько, але водночас — далеко.\n\nЗітхнувши, він повернувся до гуля, що сидів навпроти. Як там його звали? Пітчіс? Стетчіс? Всі вони були на одне обличчя... але цей — мав харизму. «Та камон, док, уже майже домовились про наші 'послуги', як ті ямпанські базікали кажуть.» Потім буркнув: «Було б добре, аби ті замовкли хоч на хвилину...»\n\nҐоддард не звертав уваги на формальності, але дещо його зацікавило.\n\n«Мій пост-людський друже, думаю, у нас спільна проблема: в’язниця. Якщо дозволите, я маю план, як гарантувати вам волю — в обмін на повний, необмежений доступ до Купола для мене й моїх людей.»"
  nf_baggers.30_tt: "\nЦе прибере ідеї §YДоговір Коллінза§! та §YУгода Ларамі§!, та розірве наші зв’язки з §Y[BLC.GetNameWithFlag]§!. Але натомість наша економіка буде нерозривно пов’язана з §Y[BAG.GetNameWithFlag]§!."
  nf_baggers.30.a: "Ґуль усміхнувся: «Слухаю уважно.»"
  nf_baggers.30.b: "Ґуль насупився: «Сам собі копаєш могилу, друже.»"

  nf_baggers.31.title: "Veni, Vidi, Vici"
  nf_baggers.31.desc: "Сяйники повелись на нашу гру. Вони відреклися від зв’язків із [BLC.GetNameWithFlag] і тепер стоять на нашому боці."
  nf_baggers.31.a: "Чорний каньйон упаде — розділений!"

  nf_baggers.32.title: "In Inceptum Finis Est"
  nf_baggers.32.desc: "Сяйники відмовилися від нашої пропозиції. Вони залишаються поруч із [BLC.GetNameWithFlag]. Щоб заволодіти Куполом, доведеться знищити їх обох."
  nf_baggers.32.a: "До біса все це!"
  #
  nf_baggers.33.title: "На найвищому пагорбі"
  nf_baggers.33.desc: "Успіх здався майже неможливим для другої експедиції до Колорадо. Вигнані до табору далеко від мети, борючись проти армій гульні, а потім — ще й із часом, щоби врятувати об'єкт, іноді здавалося, ніби успіх можливий лише через обман.\n\nАле ж ви не вдавалися до обману, так?\n\nҐоддард і науковий склад експедиції працювали роками, майже без сну і без відпочинку, щоби не просто зберегти, а відновити й піднести цей об'єкт. Завдяки їхньому розуму й вашому рішенню, завдяки силі військ Республіки й вашій стратегії — вам вдалося.\n\nІ саме завдяки цьому Ґоддард нарешті зробив те, про що мріяв усі ці роки:\nВін уперше спокійно виспався."
  nf_baggers.33.a: "Сізіф утримав камінь."
  BAG_zax_modular_tt: "§GТепер ви зможете призначати ЗАКСу різні завдання через меню рішень! Кожне з них посилює одні параметри за рахунок інших!§!"

  nf_baggers.34.title: "Камінь трьох смертей"
  nf_baggers.34.desc: "Боулдер, Колорадо й Купол помирали тричі через провали.\n\nУперше — через провал довоєнної Америки. Ресурси не змогли наздогнати людську ненаситність. Люди обрали війну замість миру. І світ загинув у ядерному вогні. Разом із ним — і Купол.\n\nУдруге — через провал Ув’язненої. Вона не змогла (чи не захотіла) зупинити Преспера. Можливо, бачила в собі самій вирок старого світу — і тому дозволила Куполу згоріти. Прогрес минулого згас.\n\nВтретє — через вас. Ви не змогли вчасно опанувати нові системи. Застрягли в боях. Пріоритетом стали Ороборос чи Ланіус. А може, вам просто було байдуже.\n\nА тепер ця остання смерть — цілковито ваша вина. Нікого більше."
  nf_baggers.34.a: "Бум."
  nf_baggers.34_tt: "[BOULDER_DOME_ZAX_MISSION_GODDARDS_PLEAD]"
  BAG_boulder_fail_flag: "§RКупол втрачено§!"

  nf_baggers.342.title: "Сізіф розчавлений"
  nf_baggers.342.desc: "Друга експедиція Республіки до Купола зазнала краху. Нестабільний комп’ютер ЗАКС вибухнув, залишивши після себе вогняну кулю. Ґоддарда вивели силоміць. Казав:\n\n«Як я маю це прийняти? Як можна просто продовжити цю тепер уже безглузду експедицію? Залиште мене. Я хочу згаснути разом із вибухом. Разом із мрією…»\n\nТа, на щастя, елементарна людська емпатія виявилася сильнішою за мелодраму."
  nf_baggers.342.a: "Ми зазнали невдачі..."
  nf_baggers.342.b: "Ведмідь слабкий."
  nf_baggers.342.c: "Даремна інвестиція."
  nf_baggers.342.e: "Вибух видно навіть звідси!"

  nf_baggers.35.title: "Назва нашої столиці"
  nf_baggers.35.desc: "Наші планувальники звели вибір до кількох назв. Що ж обере наш просвітлений лідер?"
  nf_baggers.35.a: "Звісно ж, §YБаґґерс-Сіті§!!"
  nf_baggers.35.b: "§YПлатт-Сіті§! звучить логічно."
  nf_baggers.35.c: "Три центри минулого — отже, §YТрай-Сіті§!"
  nf_baggers.35.d: "Вшануймо предків — нехай буде §YШейді-Ґроув§!."

  nf_baggers.36.title: "День виборів"
  nf_baggers.36.desc: "Після багатьох випробувань наш офіційно призначений губернатор нарешті обійняв посаду. З повноваженням, яке йому надала Конгрес Республіки, він організував наші перші вибори!\n\nДоктор і генерал відразу перетворили свої платформи на партії та кинулись у кампанію. Але до здивування декого, і Агнес висунула свою кандидатуру.\n\nІ переможець — це..."
  nf_baggers.36.a: "Ґоддард і інтелігенція перемогли!"
  nf_baggers.36.b: "Колерідж — новий президент!"
  nf_baggers.36.c: "Агнес перемогла на виборах!"
  #
  nf_baggers.37.title: "Перо сильніше за меч"
  nf_baggers.37.desc: "У холодних, сухих горах Скелястого хребта здіймався пронизливий вітер, коли Ґоддард наближався до намету, що слугував імпровізованим штабом генерала Колеріджа. Його супроводжували озброєні солдати Республіки. Він був нижчий і старший за них, але один його погляд змусив замовкнути будь-які заперечення. Вони були далеко від дому, і лояльність до Колеріджа танула з кожним днем.\n\nСаме так було задумано.\n\nУсередині намету Колерідж схилився над пошарпаною картою, де розташування військ позначалося пляшковими ковпачками й жетонами. Вони були оточені. Загнані в кут. Такі провали не залишалися непоміченими в Каліфорнії, особливо коли саме Ґоддард фільтрував і надсилав звіти.\n\n«Щойно отримав звістку з Шейді-Сендс про твій статус, Колерідже», — зверхньо мовив він. — «Віднині ти підпорядковуєшся нам. Тож годі гратися в диктатора й займися Куполом».\n\nНе давши опоненту відповісти, він розвернувся й вийшов. Уперше за довгий час на його обличчі з’явилася усмішка — рідкісна, цінніша за золото. Одного дня, коли Купол буде повністю відновлено, Ґоддард зможе реалізувати свою мрію про армію зі сталі й схем, позбавлену політичних амбіцій."
  nf_baggers.37.a: "«Хто контролює оповідь — той і перемагає»"

  nf_baggers.38.title: "Меч диктує музу пера"
  nf_baggers.38.desc: "Ніч опустилась на височини Кампу Баґґерс, і генерал Колерідж скористався цим у своїх інтересах. Він знав, що Ґоддард або спить, або, що більш ймовірно, втуплений у якусь машину. Навіть маючи перевагу, треба усувати всі ризики.\n\nБо коли влаштовуєш переворот проти людини, яку не можна вбивати — все має пройти ідеально.\n\nКолеріджа супроводжували ветерани з Рейнджерської групи «Листопад». Без зброї — вона їм не була потрібна. Один помилковий рух — і Ґоддард би це зрозумів.\n\nЗайшовши в намет, що слугував кабінетом Ґоддарда, генерал посміхнувся: «Ґоддарде! Нам треба серйозно поговорити про майбутнє експедиції до Колорадо.»"
  nf_baggers.38.a: "«У кого більше зброї — той і правий»"

  nf_baggers.39.title: "Остаточна відповідь"
  nf_baggers.39.desc: "Це був момент істини. Ґоддард зібрав усіх, хто допоміг дійти цього етапу. Вони стояли в тіні гігантського Супер-ЗАКСу. Комп’ютера, що мав дати остаточну відповідь.\n\nАле коли Ґоддард запитав результати обчислень — той відповів сирими даними. Повторювалося лише число «42».\n\n«Це й усе?» — запитав Ґоддард. — «Це твоя відповідь?»\n\n«Так. Розчарування — очікуване». Серед науковців піднявся гомін незадоволення. Ґоддард теж вагався. Можливо, Преспер і справді просто змусив ЗАКС витрачати час. І, в результаті, — всіх нас. Або ж питання таки існує, і ми просто ще не зрозуміли, яким воно було.\n\nМожливо, доведеться знову вирушити в пошуки цієї таємниці."
  nf_baggers.39.a: "Яке ж питання дає відповідь «42»?"

  nf_baggers_flavour.0.title: "Різанина на двох фронтах"
  nf_baggers_flavour.0.desc: "[GetDate]. День почався як будь-який інший. А завершився як один із найтрагічніших у цьому регіоні.\n\nВсе почалося з лейтенанта Джонса. Він був п’яним під час чергування на кордоні з територією Світлих. Його дражнили за слабкий шлунок, тож він тренувався пити, вважаючи, що нічого не станеться. Водночас п’яна купка Світлих перетнула кордон, наспівуючи глузливі пісні. Постріл-попередження Джонса — влучив у голову.\n\nДруге сталося на східному кордоні. Радіопередача в коді, повна перешкод, начебто повідомляла про початок війни. Це була помилка. Але сержант Бахман і рядовий Корчо сприйняли її за чисту монету й відкрили вогонь по патрулю Виснажених Псів. Війна почалась.\n\nОсь так день миру став днем катастрофи."
  nf_baggers_flavour.0.a: "Війна... Війна ніколи не змінюється."
  #
  nf_baggers_flavour.1.title:0 "Highway to Heaven"
  nf_baggers_flavour.1.desc:0 "Ribera approached the garage, as full as it had become since Eddie's retirement. Since the movement of operations from a single truck bay to the entirety of Colorado, with planned expansions beyond, the garage had now become filled with memorabilia of adventures "Crazy Horse and Wheels" had taken. A Route 66 sign, a steering wheel with a mannequin head mounted on it, a racing trophy, a Pre-War newspaper about a Fusion Flea winning a race in Nevada. All these and more littered the venerable museum to Eddie "Crazy Horse" Galenski.\n\n"Pop, you there?" A series of crashes answered them, followed by both trucker swears and normal swears.\n\n"Over here, I'm working on the Crazier Bull!" The "Crazier Bull", as Eddie liked to call it, was a passion project he and Helen had come up with after passing the truck onto their kids. The Bull was a converted recreational vehicle, with a number of attachments making it appropriate for wasteland travel, like wheel-mounted flamethrowers and a canopy minigun. It also had an attachment point for the "Horns" sidecar, a motorbike that had been equally modified for use.\n\n"Heya, Dad. How've you been?"\n"Ah, I've been better. Now, which one were you again...?"\n"Daaad..."\n"Alright, kiddo, you got me, 'course I recognized you. Now, what'd you want from your old man?" Eddie rolled out into the light on his omni-wheelchair. His legs still worked, but both he and Helen preferred to get around fast in their old age.\n\n"I was hoping to learn some of your techniques for fighting off raiders." \n"Hmm, a lesson from the old man, eh? Well, let me tell you about the time me and Helen got caught up in what she and I only later learned was a full blown road-war of all things up in Idaho...""
  nf_baggers_flavour.1.a:0 "Fascinating stuff."
  #
  nf_baggers_flavour.3.title:0 "Operation: Jaywalking"
  nf_baggers_flavour.3.desc:0 "The refurbished jeep strolled along down one of the newly consolidated towns. Driving was Nina, alongside her, Agnes. The latter had gotten permission from Goddard to engage in what they justified as "analyzing the effects of outside societal control and influence under duress from military occupation". In reality, Agnes wished to see how the recently conquered ghouls of the Luminous Ones were faring after several weeks of being under control of the Baggers. During their drive, they had seen some of the resulting resistance to occupation, though it was much less drastic than internal military reports had made it sound.\n\nNina pointed towards the radio, only emitting static and on occassion sputters of a military report from Baggers HQ. The encryption scientists were still working on fully encrypting their radio signals to prevent interception from any hostile neighbors. "Wish we still had our disk jockey up and running, we'd at least have something to listen to, and the holotape player in the dash is busted, so we can't even listen to some good Pre-War tunes."\n\nAgnes was busy looking out the window, evaluating the sights of Colorado. While some buildings were still burning, and corpses were seen every few miles, the territory looked no worse for wear than it had previously. But there was something nagging on Agnes that, even if the physical conditions of the area looked unchanged, the people within it may have changed far more.\n\nA sudden swerve, stutter, and jolting stop of the jeep brought Agnes' own thoughts to a halt.\n\n"What on earth did you do that-" Agnes' tirade stopped before it even began, as Nina covered her mouth with the jeep's car radio mouthpiece, pointing to a Bagger soldier laughing while having his boot heavily weighing on the face of a ghoul child, laying flat on the ground, crying. His gun was pointing towards another ghoul woman who appeared to be the child's mother. While the swerve and stop of the car had not distracted the soldier, Nina and Agnes were close enough to hear the soldier.\n\n"-Not having any good human woman taking care of some freak kid. If you knew what was good for you, lady, you'd shack up with me. Assuming I didn't put a round in your rotting face first. But let's see how cooperative you are in opening yourself up to me once your precious kid is another rotting corpse in these streets. Oh wait, he's already rotting, hah!"\n\nAgnes was about to get out of the jeep to put a stop to the situation, when she noticed a military police car pull up...\n[A uniformed peace officer stepped out of the jeep, decorated in blue and gold.]"
  nf_baggers_flavour.3.a:0 "It's a cop!"
  #
  nf_baggers_flavour.30.title:0 "The Good Cop"
  nf_baggers_flavour.30.desc:0 "Captain Stiller, recently re-instated officer of the Baggers Provisional Military Police, stepped out of his patrol car. He'd been let on to reports of nefarious activity ongoing in the sector, assisted by exact coordinates provided by Dr. Nina. Taking one look at the situation, he decided to put on the charm, both to reassure the woman, and to get the obviously unfit soldier to let his guard down.\n\n"What have we here? Rustling up a ruckus, private?" The soldier removed pressure from the ghoul child he was stepping on and looked over at Stiller's uniform, decorated in bright blue cloth with gold leaf trimmings.\n\n"What're you supposed to be? A tin star? I'm the law around these parts, and maybe you haven't heard, but the Baggers own this land now, so your laws don't apply no more." The soldier was obviously one of the wasteland recruits if he didn't know what NCR police garb looked like, not to mention his horrific treatment towards ghouls. Stiller didn't want to draw his sidearm just yet, despite the grievous miscarriage of racism and misogyny the soldier was displaying. He dropped some of the charm, and got to business.\n\n"As a matter of fact, I am a lawman. But of the very Baggers you claim to be a part of. Now I don't know how much of NCR law you know about, but ghouls, super mutants, and any and all other mutated life were guaranteed legal protections under President Tandi's administration back in '05 in the Mutant Law act. Now normally, I'd remind people of that law and encourage them to treat each other right and equal. But I'm afraid you've gone and violated that law, and violated it bad. Now I'll kindly ask you to come with me to turn yourself in, or I'll have to arrest you here. Which'll it be?"\n\nThe soldier sneered, shifting himself off the child and turning fully towards Stiller, raising his rifle towards the officer's head. "You ain't got the guts to shoot me, tin star." Stiller kept his composure, giving a small nod to an unseen party. With a thwack, Nina clubbed the soldier over the head with a piece of rubble. The soldier stumbled woozily, finally collapsing in the street.\n\n"I must say that your assistance, while unorthodox, is appreciated, little lady. I take it you're one of the labcoats Goddard sent to evaluate things?" Agnes wandered behind Nina, answering for her. "Why yes, how did you know that?"\n\n"I have my ways. It is right unfortunate that people still have so much hate in their hearts, but with folks like you and I protecting folks like these ones here, we should make this place into a more caring and compassionate place for all." Reaching a white gloved hand out, Stiller picked up and comforted the ghoul child, walking them back to their mother. Reaching into his pocket, he pulled out a box of Fancy Lads, giving it to the child. For the mother, he pulled out a small wad of cash.\n\n"Not sure how much the conversion rate is, but if you stop by a police station or Bagger trading post, you should find that to be worth about a thousand caps." The woman looked at him, teary eyed. Before she could speak, Stiller tipped his hat at her, tipped his hat at the child, waved at the scientists, and hopped back in his car, whistling a tune all the way."
  nf_baggers_flavour.30.a:0 "There are good men among them."
  #
  nf_baggers_flavour.5.title:0 "Operation: Paladin"
  nf_baggers_flavour.5.desc:0 "Captain Pierce had been scoping out the Glowing One's hideaway for some time now. If he hadn't brought the extra-strength Rad-X for this, he imagined he wouldn't make it back alive. \n\nHe had the Glowing One's schedule down to the second. He would have loved to put a bullet through that great glowing head ASAP, but he couldn't risk that big garish helmet blocking the shot. He imagined they only took it off him in private, where his scope couldn't see. \n\nFinally, his moment arrived. Due to some completion in their construction, the Glowing One was about to meditate in the open air. Off came the helmet, exposing that hideous green target. Pierce held his breath, squeezed the trigger on his DKS, and the Great Glowing One became a great glowing spray. He snuck away, using a cloak and some bioluminescent paint as a long distance disguise. Pierce imagined what kind of award or title he'd get for bagging this prize. Frankly, he'd settle for some peace and quiet."
  nf_baggers_flavour.5.a:0 "Boom. Headshot."
  #
  nf_baggers_flavour.6.title:0 "Operation: Bethesda"
  nf_baggers_flavour.6.desc:0 "Dianne had come to Luminous Ones territory to oversee the engineers personally. She was supposed to be a form of management, but she preferred to get her hands dirty, be practical. She examined the pipes going into the crater they were to drain, looking over the shoulders of the field engineers while doing so. \n\n"Can we help you, Corporal?" An annoyed, sweaty face greeted her when she turned to face them. They weren't happy to have her watching them. \n\n"No need, Gregory. I was just examining how you were linking that outflow pipe to the drainage shaft. You did consult with Tom and Kat that the inflow valve is capable of sustaining the water pressure, right? Considering the decontamination chemicals?" His glare softened, if only because he realized she was a fellow engineer and not just a middle-manager. \n\n"I consulted them both, yes. We're planning a test run in the next few minutes, if you'd like to watch." She nodded, awaiting the press of the button. A click signalled the start of the process. A loud alarm, thuds and jolts. Finally, the putrid green water began to drain from the crater, slowly replaced by pristine blue. Dianne and the trio began to laugh and cheer. It was going to be a long time before they were done, but this made for a great start."
  nf_baggers_flavour.6.a:0 "Maybe Project Purity would have been a better name?"
  #
  nf_baggers_flavour.7.title:0 "Operation: Mulan"
  nf_baggers_flavour.7.desc:0 "Old Sterling stirred with activity as the new banner went up the pole. A symbol of the fall of the Withered Dogs and rise of the Baggers. Although the local ghouls were used to military types shouting, Major Fleming's bellowing gave them a shock. \n\n"ALRIGHT YOU LILY-LIVERED ZOMBIE PANSIES, LET'S GET ONE THING STRAIGHT. YOU ARE NO LONGER UNDER THAT OLD WITHERED COOT, YOU ARE UNDER THE COMMAND OF THE NEW CALIFORNIA REPUBLIC ARMY." Murmuring broke out among the ghouls. One was brave enough to speak up. \n\n"Who are you to be orderin' us around?" He yelled. The Major came to a halt, turning to face the crowd. He pulled out his AEP-7 laser pistol from one pocket, and a cigar from the other. That cigar was known to be one of Old Dog's favorites. \n\n"I want whoever said that to step forward." He commanded with a low growl. The brave ghoul was shoved forward by his peers. The Major looked im up and down. He then put the laser pistol in the ghoul's hands, and stood back. "I want you to aim for this," he said, planting the cigar between his lips. \n\n"Say what?" \n\n"That's say what SIR. Do not make that mistake again. Now aim and shoot! Miss and you'll be punished accordingly!" The ghoul took aim steadily and fired. He hit his mark, lighting the cigar without harming Fleming. \n\n"Very good. Perhaps we'll make proper Rangers out of you yet.""
  nf_baggers_flavour.7.a:0 "We'll make real men out of you."
  #
  nf_baggers_flavour.8.title:0 "Operation: Miscovich"
  nf_baggers_flavour.8.desc:0 "Larsen stared at the corpse in front of him. He'd meant to simply cripple the shoulder, instead, a slight miscalculation of the shot lead to the ghoul's entire head being blown off. Surprising the power a simple .38 had behind it. Nina approached behind him. "The hell was that, Larsen?! You were supposed to stop him, not kill him!"\n\n"The bullet misfired. It won't happen again." Larsen stated without emotion, paying close attention to the cold metal of his gun than the red hot fury of Nina.\n\n"I'm making sure it won't happen again, I'm taking you and your men off as guards for the prisoners. This is the third one this week, not counting the almost fatal injuries that we were thankfully able to stabilize in time."\n\nLarsen pricked his eyes and ears up towards Nina in a mocking glance. "And who do you expect to find to keep watch over these glowbugs? Not like your department's nerd arms are able to lift a proper rifle, let alone scope out a runner a hundred meters away without killing them."\n\nNina's red hot anger became as blue as her gloves. "We don't need to kill them, we just need a way to subdue them... in a... non-lethal... fashion..." Her anger quickly drowned in an ocean of curiousity and possibilities, racing to grab a blueprint, markers, pens, and sheets of paper.\n\nLarsen's preparation for a shouting match was equally confused.\n"The hell are you doing?" Nina's mind raced, as did her mouth: "If I take into account the lack of rubber material in the region, and substitute it with an equivalent polymer gel shaped for suppression..." Her hands swept in a flurry of thoughts, equations, and incomprehensible sketches. "And then I utilize the same water propulsion mechanics found in the Nuka-Cola Thirst Zapper... By Dharma, I think I've got it!"\n\nLarsen, who had been entirely forgotten by Nina, looked over her shoulder. "Got what, exactly?"\nNina looked back over at him, her rage entirely forgotten. "A solution to both our problems."\n\n§ONon-lethality, serving the needs of interrogators and peaceniks since 1967.§!"
  nf_baggers_flavour.8.a:0 "That's really a weapon?"
  #
  #nf_baggers_flavour.9.title:0 "Poker Face"
  #nf_baggers_flavour.9.desc_radiophobe:0 "The scene in the Camp Baggers barracks was as it was every other day. Soldiers resting, scientists using their developed/developing medical skills to heal or improve said soldiers, and the occasional cheer or weep, depending on the situation of the day. Today, however, the barracks were largely empty, save for the six individuals who had largely found themselves assigned or resigned to the bunker for the day. The first two individuals of these six were none other than secret addict Larsen, and reformed prisoner-turned-exceptional gambler Blackjack.\n\nBlackjack had become quite the name in both exceptional and mundane bets, though this interaction felt more like the former than the latter. He'd made a bet with Valentina that he would not only stand a full conversation (no less than 5 minutes) with Larsen, the known radiophobe, but also win at a poker game with him. Valentina was not typically a gambling woman, but getting to know the result of a mutant and a mutant hater piqued her interest. Which brought the both of them back to now. Larsen had accepted the poker game, but was unfamiliar with who he'd be playing with. Yet when he heard the heavy footsteps of a Super Mutant, he just about hopped out of his chair to leave.\n\nBlackjack raised his hands, revealing the deck they'd be playing with. "Hold on there, slick. I mean you no harm, just here to play."\nLarsen, still halfway out of his chair, grimaced at the mutant. "Hmph. A mutant. I don't have time for your games." He began to slide out, when Blackjack lifted his free arm to block the door.\n"I'm a mutant, and I want to play a game. You got that right, but if you're going to treat me no different than a feral ghoul or one of my more mindless brethren, I see no reason why I can't treat you the way they would, by keeping you here and forcing you to play."\nLarsen narrowed his eyes, sliding back in his chair, muttering mutant slurs under his breath. \nBlackjack pulled up two steel reinforced chairs, smoothly maneuvering into them. He began to lay out the deck.\n\n"I suppose, though it is a bit fast, that I should apologize for my brash behavior. Obviously I had no fear of you taking my life, and I doubt you felt in any way threatened. I simply wanted to exchange a friendly game, and perhaps a friendly conversation."\n\nLarsen picked up the cards he'd been dealt. A pair. He grumbled. "May not have nothin' to fear from you, but I doubt there's anything you could provide that'd be of use to me. Here or out there."\nBlackjack looked past his cards towards the sergeant with a small smirk. "What if I told you that I've taken out a Legion assassin with nothing but a fake minigun made out of sticks and pipes painted black?"\nLarsen pricked his eyebrow. "I'd say I call your bluff."\n\nThus began a conversation of Blackjack reminiscing about the time he'd faced the infamous Alexandra at Mesa Verde, though he'd made a few changes to what actually happened back then, such as leaving out the presence of a certain prisoner who helped him knock out Alexandra. By the end, though, after a few hands and a number of laughs, Larsen came out with the knowledge of how to deal with those who have the high ground, as well as the importance of planning, while Blackjack ensured Valentina kept to her word, winding up with an extra $100 NCR."
  #nf_baggers_flavour.9.desc_cured:0 "The scene in the Camp Baggers barracks was as it was every other day. Soldiers resting, scientists using their developed/developing medical skills to heal or improve said soldiers, and the occasional cheer or weep, depending on the situation of the day. Today, however, the barracks were largely empty, save for the six individuals who had largely found themselves assigned or resigned to the bunker for the day. The first two individuals of these six were none other than recovering addict Larsen, and reformed prisoner-turned-exceptional gambler Blackjack.\n\nBlackjack had become quite the name in both exceptional and mundane bets, though this interaction felt more like the former than the latter. He'd made a bet with Valentina that he would not only stand a full conversation (no less than 5 minutes) with Larsen, the known, but reforming, radiophobe, but also win at a poker game with him. Valentina was not typically a gambling woman, but getting to know the result of a mutant and a mutant hater piqued her interest. Which brought the both of them back to now. Larsen had accepted the poker game, but was unfamiliar with who he'd be playing with. Yet when he heard the heavy footsteps of a Super Mutant, he just about hopped out of his chair to leave.\n\nBlackjack raised his hands, revealing the deck they'd be playing with. "Hold on there, slick. I mean you no harm, just here to play."\nLarsen, still halfway out of his chair, grimaced at the mutant. "Hmph. A mutant. Fine, at least let me get a..." He began to itch his arm, searching his body for a spot of RadAway, when Blackjack lifted his free arm to grasp Larsen's, carefully analyzing his face.\n"Hmm, flushed face, normal, if orange tinged, pupils, and you're sweating like you're back in California in a below-average temperature room. I'd say, in my unqualified medical opinion, that you're experiencing RadAway withdrawl. I saw it in my time back at the-"\nLarsen narrowed his eyes, grasping the mutant's arm, repeating "I don't need it" under his breath. \nBlackjack pulled up two steel reinforced chairs, smoothly maneuvering into them. Calmly laying both of Larsen's hands on the table, away from any potential secret stashes, he began to lay out the deck.\n\n"I suppose, though it is a bit fast, that I should express my concern for you behavior. Obviously I had no fear of you doing anything unhinged, and I doubt you felt in any way threatened, though you certainly may feel better once you've played a round or three. I simply wanted to play a friendly game, and perhaps a friendly conversation."\n\nLarsen slowly recovered from his cold turkey fit, picking up the cards he'd been dealt. A pair. He grumbled. "May not have nothin' to fear from you, but I doubt there's anything you could provide that'd be of use to me outside of your jibber-jabbering about my health. Here or out there."\nBlackjack looked past his cards towards the sergeant with a small smirk. "What if I told you that I've taken out a Legion assassin with nothing but a fake minigun made out of sticks and pipes painted black?"\nLarsen pricked his eyebrow. "I'd say I call your bluff."\n\nThus began a conversation of Blackjack reminiscing about the time he'd faced the infamous Alexandra at Mesa Verde, though he'd made a few changes to what actually happened back then, such as leaving out the presence of a certain prisoner who helped him knock out Alexandra. By the end, though, after a few hands and a number of laughs, Larsen came out with a much more reduced craving for the drug that had once potentially enslaved him, as well as the importance of planning, while Blackjack ensured Valentina kept to her word, winding up with an extra $100 NCR."
  #nf_baggers_flavour.9.a:0 "Fold'em like they do in Texas."
  #
  nf_baggers_flavour.10.title:0 "A Victory For California, Is Victory For You!"
  nf_baggers_flavour.10.desc:0 "Coleridge didn't think of himself as a man of spectacle, but he had decided to set up an event to mark his ascension. After all, big changes were coming to Colorado, and they had California to thank for it. \n\nGathered in the audience were many members of the Expedition. Loyalists and dissenters, neutrals and conscripts. Locals had also gathered, but not as many as one might have hoped. Their loss, Coleridge thought, that they miss out on the keynote of their coming transformation. \n\n"Thank you all for coming today," Coleridge began, "and thank you for putting your faith in me. Colorado has been through many disasters in its time. It has been ravaged by robots. It has been ravaged by savages. It has been ravaged by the Legion, if you'll forgive a tautology." A joke only he and the Californians appreciated. "Colorado cries out for someone to put it back together. Someone to build it into a safe and stable home for honest folks. I...we, will answer that cry. The New California Republic is here to bring peace to the land, as it brought peace to California, and as it brings peace to the Mojave. As your elected leader, I will spearhead these efforts, and prepare Colorado for the day it takes its place as the next state of New California. Do not think of this as a victory for the NCR alone. People of Colorado, a victory for California is a victory for you!" \n\nThe end of his speech ellicited cheers and hollers from the crowd. Again, mainly from loyalists, less so from Coloradans. Just another thing they'd have to work on."
  nf_baggers_flavour.10.a:0 "They'll learn to love us."
  #
  nf_baggers_flavour.11.title:0 "The Explaination"
  nf_baggers_flavour.11.desc:0 ""You see, you could just keep looking for work," Nina told the man seated across from her, "or you could sign up to the Servant Allocation Center and work can be found for you!" \n\nGeorge looked suspiciously at the contract before him. "And I get free room and board?" \n\n"Yes!" \n\n"What's the catch?" \n\n"I can understand being suspicious. But understand that Goddard is...simply a man that hates waste and inefficiency. He doesn't want to rely on foolish things like market forces and mercantile greed. The Servant System is a way by which we can make the economy work smarter, for all our sakes!" \n\nWhen she put it like that, George felt he understood. It wasn't about giving him a free ride, it was about eggheads making things run more efficiently. They had a stake in this, he did too. It made sense, so he put his signature on the contract. \n\nNow he wishes he had the chance to cave that bald skull in. He should have listened to his gut. The Servant System was not the intellectual ingenuity Nina sold him on. It was just another way to abuse the common man."
  nf_baggers_flavour.11.a:0 "Typical."
  #
  nf_baggers_flavour.12.title:0 "Vision Of Calculation"
  nf_baggers_flavour.12.desc:0 "In investigating the humanoid combat robots of Colorado, Goddard heard tell of their late commander; a composite of human brains known as "The Calculator". Although he didn't have a perfect picture of it, he pieced together that it was not unlike his concept for the Super-ZAX, only making use of organic processing rather than traditional computers. \n\nWhile lesser minds might have shied away from what they might call an "abomination", to Goddard the idea only reinforced his conviction. He wondered what it would be like to be part of such a thing? To combine minds with other geniuses to create a Super-Calculator? He could only imagine. \n\nUnfortunately The Calculator would have to remain a mere story. It was clearly no longer operating. Some tales spread by locals said it had gone east into some great empire of 'steel', but Goddard dismissed such claims. Who would have the ability to move such a massive creation? No, it was surely more likely it was annihilated long ago, denying future generations the chance to study its design."
  nf_baggers_flavour.12.a:0 "But the story, it filled him with passion."
  #
  nf_baggers_flavour.13.title:0 "The Goddard School Of Learning"
  nf_baggers_flavour.13.desc:0 ""Settling in?" Agnes broke Goddard's rumination. He looked up at her from his new desk within the University of Colorado. \n\n"As much as one can in such a sparse environ." For now, "University of Colorado" was just a name. The facilities were still under construction, and lessons were currently being given in tents and other prefab buildings. The head office, within a repurposed ruin, was the closest thing to a proper building they had. "I'm not sure how much time I'll be spending here, you know." \n\n"That's alright. Your duties will mostly be administrative. I won't need you shackled to this desk all day." Agnes knew Goddard would rather be pursuing some great project. "This is about setting up a foundation. A system by which people will teach and be taught. Then, years from now, the university that Dr. Goddard helped build will teach generation after generation. All while looking up at a portrait of its beloved founder." Of course they hadn't commissioned his portrait yet, but one day, that bald head would hang from the wall. \n\n"You're appealing to my ego, Agnes." Goddard let out a light chuckle."
  nf_baggers_flavour.13.a:0 ""It's working.""
  #
  nf_baggers_flavour.14.title:0 "The First Block Of The Academy"
  nf_baggers_flavour.14.desc:0 ""Can you imagine the look on her face?" Coleridge commented as he and Agnes watched the builders setting up the academy's entrance. They were hoisting up a sign with the name written on it. \n\n"She'll live, at any rate." Agnes felt the name was a bit mean spirited, but she didn't want to fight Coleridge over silly gags. "I hope you'll focus on the alleged intention behind that name, General." \n\n"Don't you worry, I know what I'm doing. Always did." Coleridge stepped onto the steps of the academy. "Today, the frame of a building, not an instructor in sight," he gestured to the ongoing construction, "tomorrow, a school that teaches Colorado's officers how best to lead their people into battle!" He turned to face the capital, his arms spread wide. \n\n"Well you've got the spirit for it." Agnes chuckled. She wasn't a woman of war, but she knew that the future would still need people with Coleridge's acumen."
  nf_baggers_flavour.14.a:0 "We still need good officers."
  #
  nf_baggers_flavour.15.title:0 "Two Banners, Two Futures"
  nf_baggers_flavour.15.desc:0 "Kirk watched as the New Colorado Republic banner fluttered in the wind. Kirk wasn't much for sentimentality, but he did feel a sense of pride in what they'd accomplished. He didn't vote for Agnes, nor was he fond of her bleeding heart policies. But at least he could feel satisfied with his own service. \n\nOf course now he had a bunch of Coloradan locals in his brigade with him. Agnes called it a "cultural unity measure", mixing the units so that they "all understood each other". Kirk only knew it meant he now had a bunch of people that barely understood what country this was supposed to be. Then again, sometimes he had his doubts about what country he was in too. \n\nLarry seemed to love it, though. He said he had a "buncha new and interesting friends" in that moronic tone of his. He was off making nice with the local troopers, perhaps bonding over their mutual lack of knowledge of the NCR, even if Larry's ignorance was willful. \n\n"C'mon, Kirk!" That moronic tone again. "Come join the fun!" Kirk rolled his eyes. Larry was determined to drag him into this mediocrity-fest. The worst part was, his resistance was being worn down..."
  nf_baggers_flavour.15.a:0 "Everbody's coming together."
  #
  nf_baggers_flavour.16.title:0 "Greeting The Locals"
  nf_baggers_flavour.16.desc:0 "Peter McDougal had tried many times to be the mayor of Redding. Every time he had failed. His best result was the election of '72, he got 5% of the vote. Now he'd been handed a perfect opportunity by the good Mr. Coleridge, and he wasn't going to waste it. He'd already forgotten the name of this dusty hamlet he'd been handed. Didn't matter much, they'd rename it to something better. Like Kimball? No, there was already one of those. \n\n"Now don't you folks worry," Peter walked with the clearly starstruck locals through the middle of town, "I'm a nice guy! Coulda proved it to the whole of Redding if they'd just let me. But I guess you guys'll be the first to experience the McDougal Mayoralty, won'tya?" He let out a laugh. They did not laugh with him. Nerves, surely. "Anyway, it was a long trip, and I could use me a shower. You guys gotta have a crude one set up somewhere, right?" He knew he couldn't expect showering facilities like back home, but they had to get clean somehow, right? \n\nBut from the confused look on the locals faces, Peter was getting the distinct impression they had no such amenity."
  nf_baggers_flavour.16.a:0 "We'll just have to live with it."
  #
  nf_baggers_flavour.17.title:0 "Breaking The Law"
  nf_baggers_flavour.17.desc:0 ""Why? Why is this a problem?" Sam rasped at this "policeman" before him. He was getting a huge dose of pre-war deja vu. Cops were annoying before his skin peeled off, and afterwards he hoped he wouldn't see one again. \n\n"Pursuant to Article 15, Clause 3 of the McNally Act," the cop droned on, "no beast of burden or other transportation device may block any passageway or thoroughfare. Please move your Brahmin, sir." He gestured to Sam's Brahmin, idling in front of an alleway. \n\n"Barely anyone goes that way! And he's not even blocking it that much!" \n\n"Sir, don't take that tone with me," the cop raised his finger, the way a mother might scold a child, "now will you move the Brahmin, or will I have to issue a fine?" \n\n"Fine! Fine..." Sam began yanking on it's lead, pulling it onto his front porch. In the process, he tipped over a barrel of dried meat. "Are you happy now? Or would you like to smash up the inside of my store too?" \n\n"No, this is enough. Have a nice day, sir." The cop turned and left, leaving Sam to mutter and curse."
  nf_baggers_flavour.17.a:0 "Justice is served."
  #
  nf_baggers_flavour.18.title:0 "The Fate Of Traitors"
  nf_baggers_flavour.18.desc:0 ""Please!" Paul cried as he held onto Coleridge's leg. "I'm begging you here, don't kill her! Have a heart!" \n\n"Get OFF me!" Coleridge kicked the man loose. "It's shameful enough you barged into this meeting unannounced, but to shed tears for that TRAITOR!? You disgust me!" \n\n"General, look at the man!" Agnes was seated across from him at the table. "This is the face of those you'll offend should you pursue this. It won't just be Paul. You'll disappoint so many who were her friends and family." \n\n"Oh, spare me!" Coleridge spat on the table. "Maybe you all remember her fondly, but I remember the good men and women that died because of that sick little cult!" \n\n"Would you stoop to their level? Kill people in cold blood? There are other punishments than death, and we are supposed to be the civilized ones." Agnes braced herself for another reaction. \n\n"Alright, alright!" Goddard held up his hands. "Let's try to figure this out, rationally." It was something of an irony that he seemed positioned to be the deciding vote between Agnes and Coleridge for a change. "Also, Paul, get out, will you?" The weeping scientist seemed intent on remaining in a begging posture on the floor. They had to call some troopers to remove him."
  nf_baggers_flavour.18.a:0 "Xian richly deserves her death."
  nf_baggers_flavour.18.b:0 "She will rot in a cell."
  nf_baggers_flavour.18.c:0 "Let her wander into the wastes."
  BAG_xian_fate_tt:0 "§gIf she lives, let it be far from us.§!"
  #
  nf_baggers_flavour.100.title:0 "A Dedication for Celebration"
  nf_baggers_flavour.100.desc:0 "A tap on the microphone. A quick cough to test if it was working. Goddard hated public speaking for any event other than a great discovery, but this was a chance to raise morale for the Baggers.\n\n"Fellow Coloradans. Long ago, in the former United States of America, this state was known as the "Centennial" state. It was named as such as it was incorporated into the Union on August of 1876. That's exactly 400 years ago." A hand swept back through what little hair the doctor had left. Sweat began to drip down his scalp. But he had to keep going.\n\n"Today is a day for celebration. It's not about myself or the so-called Academics, nor is it about Coleridge and his Clique. It's about all of us, as Baggers, as members of the great Republic of New California, and as humans. That includes ghouls, mutants, and all others." A final breath was taken, exhaled out as a wave of confidence surged through Goddard.\n\n"And so, it is with great pleasure, that I  commemorate this day as the official proclamation of my intent to create a New Colorado Republic! Like Colorado once being given statehood, so too shall we become the next great state of the New California Republic!"\n\nShort, steady breaths were taken as Goddard looked to his audience of Agnes and Coleridge, sitting alone in the Camp Baggers auditorium. Agnes feigned a kind smile. Coleridge rolled his eyes, getting up from his chair."
  nf_baggers_flavour.100.a:0 ""Dunno about you, doc, but I've got a war to attend to.""
  ###BOULDER#DOME#EVENTS###
  #
  nf_baggers_boulder.1.title:0 "Operation: Birdwatching"
  nf_baggers_boulder.1.desc:0 "Strolling into the remains of Boulder would have been a suicide mission. That's something the whole officer corps agreed on, thus they drafted a rare cross-branch cooperation to assure the success of the scouting operation. And while Ranger Welding and PFC Peterson understand the situation, they couldn't pretend that they liked it.\n\n"Let's keep up the pace, rookie. We're getting close to the vantage point."\n\n"I'm not a rookie, Rancherboy."\n\n"Stop calling me that."\n\n"You first."\n\nThe lack of respect between the Rangers and the "Trophies" (the Rangers referred to the troopers as only good for decorations) was one of many small problems with the NCRA. "After I take my position, you should approach the city, avoiding the old roads that lead there. Also, try not to disappear between the houses, or I will not be able to cover you appropriately. Additionally-"\n\n"Shut the hell up. You're no boss of me, boyscout." Peterson stormed down the hill after telling Welding off. The designated vantage points were on Hill 303 and Hill 720. Welding set up his sniper nest on the lower altitude one and then spoke into his radio:\n\n"Listen up here, roo-, eh, Peterson. While I would rather not work with a trophy, I'd rather do it than drag your corpse back to HQ. Don't do anything stupid and I'll look after you, okay? Now, please, approach the suburban ring of the city - slowly.""
  nf_baggers_boulder.1.a:0 "Roger."
  #
  nf_baggers_boulder.2.title:0 "Operation: Landslide"
  nf_baggers_boulder.2.desc:0 "Entering Dome City, as more and more people started calling Boulder, was a lot scarier than they expected. While PFC Peterson jogged around the perimeter many times, she avoided every confrontation. Ranger Welding only ever saw the city from a bird's eye view till now, and the shadows of the ruins started to pose a real danger to him. But they were expected to accompany a squad from the 2nd Platoon of Zombie Company while they headed into the ruins.\n\n"So... Corporal..."\n\n"Cpl. Mathias Christensen, but you can call me Mat if you'd like. What can I do for you, ranger?"\n\nNumerous questions raced through Welding's head. Most were tactical, but he also questioned their lax attitude and thin numbers. The rest of the Zombie Company under Cpt. Davidson's command secured every building and street they strolled through.\n\n"What's the name of this squad? Never did catch it." While his mission with Peterson only began recently, their personalities began to influence each other. The ranger was starting to relax more, which was helpful. Stress kills more people than bullets in Colorado.\n\n"We call ourselves the "Luckies". You see, there were multiple times when only sheer luck-"\n\nThe sound of the throttle fire from a service riffle deafened the squad. Peterson learned a lot from the ranger, like how to be more alert for rushing ferals.\n\n"Nice work, Peterson.""
  nf_baggers_boulder.2.a:0 "Just call me Milly, Welding."
  nf_baggers_boulder.2.tt_1:0 "§YMathias Christensen§!: Replace military rank §YCorporal§! with §YSergeant§!\nEffective change:\nDeploys the §Y76th. 'Luckies' Company§!, led by §4Sergeant Mathias Christensen§!."
  nf_baggers_boulder.2.tt_2:0 "\nThe §Y76th. 'Luckies' Company§! division unlocked a medal slot!\n£medal_texticon  The unique §YGold Star§! can be awarded to them for §G0§! political power!"
  #
  nf_baggers_boulder.3.title:0 "Operation: Hiking Trail"
  nf_baggers_boulder.3.desc:0 "Dome City seemed a lot nicer without all the feral ghouls and radioactive puddles all over the place. Granted, there were still puddles, but they were fewer and fewer. \n\nCpl. Peterson and Ranger Welding were walking through the main street, holding hands while delivering the updated parameters for the structure of Camp Stone. While burgeoning love is usually not supported in the military, there was flexibility on the frontier, especially for valorous soldiers.\n\nThe Zombie Company almost entirely withdrew from Dome City, only leaving behind platoons to help secure the base. The "Luckies" and the 2nd Platoon were among them with Sgt. Christensen. He got bitten by one of the ferals in the onslaught, which gave him with a dose of radiation fever. But he insisted on standing guard while RadAway surges into him through a cheap tube, rather than lay in a hospital bed. He got a Golden Star for it, ontop of his promotion.\n\nWith the Zombie Company gone, the largest presence was 5th Engineering, officially led by [BAG.BAG_BRIGGS.GetName]. Nobody saw him around the camp, however, which gave rise to the idea a Corporal was the highest officer around. Cpl. Dianne, specifically. She had a certain charisma, but the constant duties of a quartermaster kept her away from most other concerns. The pair gave her the new parameters and turned back to the HQ.\n\n"Willy," Peterson began, "I was thinking. I grew quite fond of you, and because of our work, we could bite the dust any moment. Probably foolish of me, but I cannot fathom delaying this request."\n\n"What are you getting at, Milly?"\n\n"Marry me, Welding."\n\n"What?""
  nf_baggers_boulder.3.a:0 "Answer me, Rancherboy."
  nf_baggers_boulder.3_tt:0 "Their marriage will occur a §Yyear§! from now!"
  #
  nf_baggers_boulder.31.title:0 "Take Me to Church"
  nf_baggers_boulder.31.desc:0 "During the initial expedition to Colorado, the advocacy of separation of church and state was still a hotly debated topic. The concept of personnel sent to maintain the mental health of the troops was a foreign concept to both the scientists and soldiery. By the time they returned, their appreciation of mental health concerns had much improved. A generous donation from certain private groups spurred the inclusion of faith ministers that performed such services.\n\nCecil "Lergeyman" Leander was the soul called upon for such duties, acting as the Brigade Chaplain. Though his nature had earned him a slothful reputation, he was a resolute man of faith that had encouraged many soldiers in his time. His belief was that if the Lord willed it, it would happen.\n\nAnd it just so happened that, shortly after constructing his makeshift chapel, the Lord asked Cecil to fulfill his duties once more. Peterson and Welding arrived on his doorstep."
  nf_baggers_boulder.31.a:0 ""Milly and I wanna get married.""
  #
  nf_baggers_boulder.32.title:0 "Offer me my Deathless Death"
  nf_baggers_boulder.32.desc:0 "Ranger Welding's request could shift mountains with how earnestly it had been delivered. Despite the fact Cecil was in the midst of locking up, he felt obliged to hear them out. "Wed you shall be, provided you have the proper requirements." He told them. \n\n"Requirements? We're in love and want to get hitched, what more do you need? If you need a shotgun, I'm sure there's one 'round back." Milly joked. \n\nThe chaplain looked flatly at the two. "If you wanted to get married New Reno style, I would gladly start a contribution fund to send you there. However, even the Lord needs time. Normally, such requests would take months, especially as it demands premarital counseling, endorsement from a religious organization if either of you are within a faith, and, if you aren't able to tell..." A ceiling fixture bulb fizzled out. "The chapel we have isn't exactly the best place for a full ceremony."\n\nNoting the annoyed looks on the soldiers faces, Cecil opened a cupboard drawer, revealing a box of gold and silver rings with small gems encrusted. "I can, however, make do. One of the financiers of this expedition sent along a box of these, in case it ever came up. Surprisingly, this is the first time. So, in memory of this occasion, Mr. Welding, Ms. Peterson, I proclaim both of you... engaged.""
  nf_baggers_boulder.32.a:0 ""It'll do, Chap. It'll do.""
  #
  nf_baggers_boulder.4.title:0 "The Secret Door of Success"
  nf_baggers_boulder.4.desc:0 ""And you're absolutely sure that we shouldn't put charges over the main entrance?" \n\n"Yes, Coleridge, as I already told you, it will be completely unnecessary. And please, tell Briggs the same - no kaboom." The doctor and the general were walking around the Dome, studying the facility. Their eyes hungrily scanned every possible detail on the surface. The noise of their base camps filled the air around them, personnel of all kinds coming to study the location and set up support.\n\n"Then tell me, as my impatience is killing me, how we'll get into the Dome?" Coleridge was rightfully annoyed, as Goddard had been deliberately holding back his brilliant 'solution'. \n\n"The same way Presper sneaked in his mercenaries when he backstabbed us; through the Quarantine Centre's entrance."\n\n"But that door is twice as thick. We'll never get through there without dynamite." \n\n"Who said we'll have to force our way into the Dome, my dear General?" They arrived at the backside of the facility and stepped up to a terminal. "Presper did one beneficial thing for us in the end. He wrote down the code for his mercenaries, and one of them was stupid enough to lose it at the entrance." Goddard pulled out a little notebook from his lab coat and turned the page to the last, where a piece of paper was under a frame. It was old and damaged but in a readable condition. "I waited twenty years for this, Coleridge."\n\n"We all did, Goddard. All of us. Now don't waste any more time on theatrics. Open it up and let's get to work.""
  nf_baggers_boulder.4.a:0 ""With pleasure.""
  #
  nf_baggers_boulder.40.title:0 "Walk in the Hanging Garden of Babylon"
  nf_baggers_boulder.40.desc:0 ""So, what is the deal with this cement basin? I wouldn't think someone would leave this much space unused." Coleridge walked with Goddard through the area.\n"This was supposed to be a hydroponics garden. Maybe you remember how severe our supply situation was two decades prior? Back then we didn't have the skill to operate this basin properly."\n"Oh, I remember. We ate that terrible nutrition paste every day." He laughed. "It's hard to imagine there was something you guys were incapable of doing. You and Presper..."\n"I don't like hearing that name."\n"Sure, I get it. Still, your work was astounding."\n"Thanks, Coleridge. But you have to understand I'm an electromechanical engineer, and Presper was a nuclear physicist, albeit overtrained in many fields. None of us had any botanical skill. We're scientists, not magicians. But we came prepared this time, so we'll have something edible."\n"Oh, so you have plans for this little hole, after all. There go my dreams for the shooting range."\n"Very funny. Still, I doubt you'll shed any tears over it. We'll rebuild this little "cement basin" into a new Hanging Garden of Babylon with the power of hydromechanics and botanists. I already have the students for the latter. Could you fetch [BAG.BAG_DIANNE.GetName] to help us out with this, General?""
  nf_baggers_boulder.40.a:0 ""Certainly, Doctor.""
  #
  nf_baggers_boulder.41.title:0 "Royal Flush"
  nf_baggers_boulder.41.desc:0 "TODO" #Decided to cut this for now because the event mentioned some political intrigue system and it seemed like an unnecessary addition when we just want functionality - Skellie
  nf_baggers_boulder.41.a:0 "I'm happy we have an understanding, gentleman."
  #
  nf_baggers_boulder.42.title:0 "Applying Some Elbow Grease"
  nf_baggers_boulder.42.desc:0 "The curious soldiers crowded around the strange porcelain room.  A nozzle hung about 6 feet off of the ground from the wall, a strange off-grey color from the rest of the sterile and clean bathroom. “Out of the way!” Called the mechanic from behind the veterans, eager to see what the mechanic had accomplished. “Out of the way!” He called again, and the bodies of the soldiers parted for him like river water around a stone. He turned a knob near waist height with a red cap on the end of it. As soon as he did, the sound of rushing water echoed throughout the Dome facility and suddenly falling from the nozzle like magic:\n\nFresh\nClean\nHOT\nWater\n\n“It took a little elbow grease.” The mechanic said. “But the eggheads said that making it so that you smelly boys didn’t drag any contaminants from the outside was of the utmost importance. This facility is far from running at full capacity water-wise, but this should be completely safe to bathe in and to drink.” The mechanic walks away with a cheerful smile. “Now if you excuse me, I’m gonna get a beer and a nap. You kids have fun.”"
  nf_baggers_boulder.42.a:0 "It’s like magic…"
  #
  nf_baggers_boulder.5.title:0 "What Happens in Boulder..."
  nf_baggers_boulder.5.desc:0 ""I never thought I'd be here again. Nothing changed at all." Said Goddard as he made spun on his swivel chair. The first room on the right after stepping out of the main elevator was Goddard's old office. A thick veil of dust had set in. Research papers were strewn about, a mug to his right, a dried-up coffee spot...if he raised his head just a second later twenty years ago, that spot would be dried blood. Funnily enough, the colour would be the same.\n\n"I never expected you to be the nostalgic kind. I imagined you would rush down to the basement for your precious beep machine." Coleridge watched Goddard act like a giddy child.\n\n"Let me just enjoy my victory over Presper for a little bit longer, hmm?"\n\n"He died not long after we left Colorado. What kind of revenge could you celebrate now?"\n\n"He took all of this from me. But now that we're back, I reign victorious. His slight is undone."\n\n"You think this is all about you? Not justice, not the Dome, but your damaged ego? You dragged us out here for your petty revenge?! You've got to be kidding!" Coleridge's rage built with every word.\n\n"The armoury has some toys for you to play with, General." Goddard made a dismissive gesture."
  nf_baggers_boulder.5.a:0 ""Fuck you, Goddard.""
  #
  nf_baggers_boulder.50.title:0 "Where the Fun Begins"
  nf_baggers_boulder.50.desc:0 ""...and this is the weapons lab. I thought you'd be interested in this one." Agnes remarked to Coleridge as they approached the room in question. \n\n"Naturally. This concerns the tools of my trade." The two of them stepped inside. It was separated from the armour lab to its left by a maintenance station. To the south was a firing range, with an expired Robobrain laying on the floor. \n\n"Well well, something for your brain research presented itself, eh Doc?" \n\n"Very funny." Agnes did wish she was off researching the biological laboratories right now. Instead she was playing guide. "Did you send for your 'weapons expert' yet?" \n\n"Speak of the devil, and he shall appear!" Major Briggs announced his arrival with a laugh. "Now what have we got here?" \n\n"I have the notes from the First Expedition here," Agnes opened up a file cabinet next to the crafting station, "I imagine it'll disappoint you, but most of what was done here was mundane. Better scopes and sights, suppressor work, that sort of thing." \n\n"But we've still got these beauties on hand, right?" Briggs opened up a storage compartment on the wall, which contained an extensive cache of pre-war weaponry."
  nf_baggers_boulder.50.a:0 ""Nice.""
  #
  nf_baggers_boulder.51.title:0 "Riveting Work"
  nf_baggers_boulder.51.desc:0 ""And then this would be...?" Coleridge walked to the next room over with Agnes. \n\n"The Armour Research Lab, used for power armour research. Despite being a medical facility, Boulder Dome was expected to chip in for the war effort."\n\n"So they didn't accomplish much, then?"\n\n"Well, they did something. Chief Engineer Armstrong, who had been tasked with this project, had made some progress in developing what he called a T-61 prototype. A quite sophisticated one, from what we're gathering."\n\n"Something we could manage to replicate?" \n\n"That's not up to me, but the others seem confident." Agnes wondered if she wasn't reliving the experiences of the original scientists; medical staff, asked to concern themselves with weapons and armour."
  nf_baggers_boulder.51.a:0 ""Let's see what we can do...""
  ###>>>Leaving out Boulder Event Number #52 as a failsafe protocol, if the Plague Research Lab interaction would require some expansion
  #nf_baggers_boulder.53.title:0 "Breathful"
  #nf_baggers_boulder.53.desc:0 ""And this is where we pop out brains out of skulls to place them into the chassis of a robobrain unit. Any questions?"\n\n"You mentioned that you would be curious about this before, and yet, you seem to rush to get out of here. What's the matter, doctor?"\n\nAgnes seems agitated, and for half a minute, she doesn't answer, just ponders into the distance. Coleridge showed some respect and didn't hurry her. She sat next to the operating table, where an empty jar filled with biogel that had expired decades ago broke the incoming light into a greenish shade, filtering the room.\n\n"I never told this to anybody before, General, so please keep this a secret. I'm slowly dying. Unknown disease, do not even question it, nor try to give me some hope. If the greatest minds of the NCR couldn't help me, I doubt this facility contains a cure. Yet, there is a possibility for closure for me if... if I..."\nShe was on the verge of tears. Understanding the situation did not require a high level of empathy. Coleridge simply said the following:\n\n"I see. Do you want to?"\n\n"How could I? It seems like a terrible procedure, painful and only promises a cold, senseless future. And yet... many things still need to be done. Without it, I couldn't finish my legacy. I feel stuck, and I am scared to my very core - I have to choose between two evils, and I cannot even fathom which one of them could be the lesser one."\n\n"I'm not a philosopher, just a soldier. But I know a thing or two about fear. And most of the time, the easier one to live with is the one which scares me less. Even if it sounds like a trifle, the living can choose their future, and the dead cannot. I'm not sure if that helps, so... I'm gonna step out and smoke one. Take as much time as you need to collect yourself. I'll be waiting."\n\nTo the surprise of the General, Agnes followed him in mere minutes, with a new determination in her eyes, and snapped the cigarette out of the soldiers' mouth. She took a puff of it.\n"You know, that thing could kill you too.""
  #nf_baggers_boulder.53.a:0 ""Lets try it.""
  #unlock_boulder_decision_tt: "\nUnlocks Decision: §YOperate out Agnes' Brain§! in the §YSegmented Visualization of the Dome§! window."
  #
  nf_baggers_boulder.54.title:0 "A Man Out Of Time"
  nf_baggers_boulder.54.desc:0 "Waking from cryo sleep is a disorienting process. One moment, you are nothing. You have no consciousness, no feeling, no concept of the passage of time. The next thing you feel is pins and needles along your fingertips. Slowly moving up your arm to your shoulder, then down your chest. Your brain waves feel sluggish as you try to process your new surroundings. It's like a baptism, except instead of fire it's with ice. Quite literally, you are born again.  It is a slow process that takes place over a period of days. One wrong move, one rushed melt, and your heart couldn't stop.\n\nDemarcus couldn't remember much, only that his name was Demarcus Jones and that he worked with robots. Something vague about a school, something vague about something called an 'America'. Impressions. Shadows on the wall. A man with a shiny bald head approached him. “My name is Dr. Goddard.” He said. “And I need your help so that centuries of lost knowledge aren't lost forever.”\n\nDr. Demarcus Jones was a bit groggy, but he knew that he should care about that sort of thing. Even if all he cared about right at that moment was how bright the lights were. After centuries of darkness, why do lights have to be so bright? Why did this man in a lab coat have a light bulb for a skull? It was hard to focus. Too much stimulus all at once. All he could do was nod."
  nf_baggers_boulder.54.a:0 "Welcome aboard, Bedhead."
  #
  nf_baggers_boulder.540.title:0 "A Reckless Decision"
  nf_baggers_boulder.540.desc:0 "Cryostasis is nothing to mess around with.  It is a very measured and scientific process both freezing someone and waking someone up from cryostasis. Breaking the CODE protocol and waking someone improperly could lead to a whole host of side effects. Best case scenario, the patient would suffer permanent brain damage or crippling muscle disorders. Worst case scenario-- and a far more common one is Post-Cryonic Syndrome or PCS. PCS, if acquired, is unavoidably lethal within 24 hours. Due to the reckless decision to wake the subject improperly, the pre-war scientist who has been in stasis since before the war is now dead. At least you can scrap the pods for parts, I suppose."
  nf_baggers_boulder.540.a:0 "Silver linings, I suppose…"
  #
  nf_baggers_boulder.55.title:0 "Welcome to the Jungle... Gym"
  nf_baggers_boulder.55.desc:0 "The gym had been made into something more homely for the boys. They had a lot of assorted equipment brought in. A poster for the Jungle Gym in New Reno adorned the wall, alongside a curious one said to come from somewhere called "Austin". It depicted a flexing Supermutant and extolled the benefits of FEV for weightlifting. \n\nGeneral Coleridge stepped in to find Davidson and Pierce mid exercise. Davidson was on the bench press, while Pierce took to the treadmill. When they saw their superior officer enter, they scrambled to stop and stand at attention. Coleridge gestured for them to be at ease. "Good morning, boys. I was looking for someone else, but while I'm here, I figure I'll catch up with you two. Boulderdash took a lot out of us, didn't it?" \n\n"Certainly, sir. We've called everybody from the corps to have a game of cards tonight," Davidson told him, "feel free to drop by if you're game!" \n\n"Excellent initiative, soldier. I'll take you up on that offer. See you at the poker table." Coleridge left them to return to their exercise."
  nf_baggers_boulder.55.a:0 "Yes, sir!"
  #Well Room
  nf_baggers_boulder.56.title:0 "Waterlogged"
  nf_baggers_boulder.56.desc:0 "“Well I have good news.”  the Plumber said, approaching Goddard. “This facility doesn't have to worry about water anymore.”\n\n“I thought we didn't have to worry about it once we finished fixing the water storage system.” Goddard responded without looking back at him.\n\n“But my innovation should make this facility run at 25 percent more efficiency. Water wise of course.”\n\n“What do you want? A fancy lad snack cake? Get back to work.” Goddard rolled his eyes dismissively. “This facility will literally explode if I do not fix this Zax computer. And you're here talking about a 25% more efficient water system when the water system we had was just fine. You are wasting my time.” Goddard walked away to continue his work."
  nf_baggers_boulder.56.a:0 "He could have just said thank you and saved time from the lecture."
  #Rocket Research Lab
  nf_baggers_boulder.57.title:0 "Our Rocket 69s"
  nf_baggers_boulder.57.desc:0 "Inside one of the many computer terminals, inside one of the many offices, inside the one and only Boulder Dome there were some innocent seeming schematics. Schematics of jet fighters not seen since before the war. If only there were some technology starved scientists along with some Warhawk military minds who would salivate at the very thought of an advanced jet fighter in this wasteland age. Then perhaps these schematics could be put to good use."
  nf_baggers_boulder.57.a:0 "We’ll put our best minds on them right away!"
  DOME_third_level_rocket_lab_fixed:0 "Rocket Research Lab: §GFixed§!"
  #Power Armour Testing Chamber
  nf_baggers_boulder.58.title:0 "One Man's Dream"
  nf_baggers_boulder.58.desc:0 "The last plate was placed onto Chief Engineer Armstrong's power armour. This would be the most advanced suit the NCR had the means to reproduce alone. The general, of course, was eager to see the progress made on the suit, not knowing it was already finished and ready to be tested. The designer drifted off to sleep-- a small nap before his scheduled meeting, where he dreamed of his work immediately being put into production."
  nf_baggers_boulder.58.a:0 "I want as many suits of this made as possible."
  #Weapons Lab Testing Chamber
  nf_baggers_boulder.59.title:0 "Gaussian Power"
  nf_baggers_boulder.59.desc:0 "The elusive and rare Gauss Rifle. Row after row of magnets pushing a small bolt of magnetized iron to supersonic speeds. Able to pierce the thickest of power armor, even if a bit expensive to produce. And the only group known to be able to produce these gauss rifles are all the way up in North Dakota. Until now. We have adapted the overtuned particle weapon research done here to create an effective copy of a Gauss rifle. We just need to say the word and allocate the resources to begin production."
  nf_baggers_boulder.59.a:0 "Let’s get that started then."
  #Reactor Access
  nf_baggers_boulder.60.title:0 "Positive Reaction"
  nf_baggers_boulder.60.desc:0 "“Well we are able to access the reactor now.” The electrician with the boundless moustache stated, taking off his pair of gloves. “Which is good, because without maintenance that thing is going tits up faster than I can say ‘I told you so.’”\n\nGoddard frowned at this turn of phrase. Yet another problem with this facility to add to the pile. Yet more resources that would need to be allocated to this facility.\n\n“Now I understand that you’re looking to try and get this place up and running, but it is going to cost more than a few caps and a roll of baling wire. This is going to cost serious tech and serious cash, if it is even possible at all. Are you sure this is even worth it?”\n\n“That is not your question to ask.” Goddard snapped back. “You will receive all that you need. Cost is no object. The information within this facility is of paramount importance. No stop asking inane questions and get things working again.” Goddard turned and walked away, his footsteps echoing like a metronome in the empty hall.”"
  nf_baggers_boulder.60.a:0 "He could have just said don’t worry about it."
  #Emergency Generator
  nf_baggers_boulder.61.title:0 "Let There Be Light"
  nf_baggers_boulder.61.desc:0 "Once the nuclear reactor cell was placed into the generator, small lights, dim and flickering like candlelight, sputtered to life above them in the hallway. Goddard sighed inside his sterile suit and marked something on his clipboard. Presper had done so much damage that now small conveniences like the unreliable lights were miracles. At least now that they had some semblance of power, there could be some actual progress made on repairing the rest of the facility. Perhaps the ZAX computer saw their progress and was even aiding them. Or perhaps that was wishful thinking."
  nf_baggers_boulder.61.a:0 "A step is a step."
  #Purification Centre
  nf_baggers_boulder.62.title:0 "Geiger Silenced"
  nf_baggers_boulder.62.desc:0 "The scientist pulls out a Geiger counter, waves it around in the air and waits. A pregnant pause fills the air, suspending this moment of import… nothing. Blessedly nothing. The rad scrubbers were working. Not a single blip of radiation was in the air supply. Not only that, but the rads that were leaking into the water supply were gone, too. Clean air, clean water. The Dome was habitable again. After Presper, even that much was a miracle. The first step in a long line of repairs was finally done. Hopefully, they will soon be able to repair the ZAX unit as well. There is an old adage that has never been more true than in this moment."
  nf_baggers_boulder.62.a:0 "No news is good news."
  #Water Storage
  nf_baggers_boulder.64.title:0 "In The Tank"
  nf_baggers_boulder.64.desc:0 "Water rationing is a bitch and a half. Who really should get to decide how much of the water should be allocated to decontamination showers versus cooking versus cleaning versus drinking? At times, it's so bad that it feels like you're going to get flogged for spilling even a drop of the stuff. Well, no longer. Now the internal water storage tanks are repaired. That means I can drink a full liter of water and take a shower for ten whole minutes and no one will yell at me. Life is good. It almost makes a body forget about California."
  nf_baggers_boulder.64.a:0 "Almost."
  #Robo Chassis
  nf_baggers_boulder.65.title:0 "Military Intelligence"
  nf_baggers_boulder.65.desc:0 "“I’m not sure who had the bright idea of allowing the talking brains in jars to roll, but they should be fired. And then the guy who hired them should be fired. They are quite simply crimes against nature.” Says one of the poor hapless privates standing outside the Dome, blowing his breath into his freezing hands.\n\n“Well no matter what you think of it, Matchbox, it is happening. Something about there being the preserved brains of pre-war scientists in the facility that need to be able to move to help with the restoration process?” The other private claimed, leaning against the wall next to the entrance of the facility.\n\n“If they spent half as much time actually fixing this place as they did putting heads in jars, I’d be back in Dayglow sitting on the side of a beach right now, mission complete.”\n\n“If they spent half as much time restoring the facility as you do complaining, then they would have had enough time to build a second Dome by now, Matchbox.”\n\n“Hah Hah.” He replied, taking out a match and lighting up a cigarette."
  nf_baggers_boulder.65.a:0 "But seriously, the last thing we need is more of those things."
  #CODE Lab
  nf_baggers_boulder.66.title:0 "Challenge, Opportunity, Discipline, Ethics"
  nf_baggers_boulder.66.desc:0 "“Well, how would you like it if they scooped your fucking brain out and put it in a jar?” Matchbox grumbled, taking another long draw on his cigarette.\n\n“Well, they're immortal, right? They're literally put in this gel taken directly from stimpacks. I'd like to live forever.” The other private pointed out.\n\n“Yeah, sure, you live forever until a bullet goes right through your chassis. See, this is why they put us out here, Rook. It's because you don't think. Besides, if you're inside one of those things, what do you even have to live for at that point? Can't drink booze, can't eat good food, hell, can't even take a shit.” Matchbox shivered before the cold wind.\n\n“They’re cutting-edge medical technology.” Rook pointed out.\n\n“Yeah, cutting-edge technology from before the war. Only just now figured out how to stuff the poor suckers in.” Matchbox put out his cigarette on the side of the Dome. “ I swear Rook, scientists take so long asking if they can do something and not enough time if they should do something.”"
  nf_baggers_boulder.66.a:0 "That’s why the bomb was created after all, right?"
  #Agnes Brain
  nf_baggers_boulder.67.title:0 "Living Legacy"
  nf_baggers_boulder.67.desc:0 "Goddard watched as Agnes' brain floated in the chamber. It was smuch a small thing belonging to what he admitted was a fine mind. "Can you hear me?" He asked of it. Of her. \n\n"Yes. Yes, I can hear you." Agnes' synthesized tone carried an odd sense of emotion. Goddard and Coleridge silently celebrated, each for their own reasons. \n\n"Please, could you describe the sensations you're feeling now? We should write this all down for posterity..." \n\n"Oh have some sensitivity, will you jackass?" Coleridge admonished him as the scientist feverishly searched for writing material. \n\n"It's quite alright, General. I want to talk about this. It's...hard to put into adequate words. Strangely liberating, really. I don't feel as worried. I feel as though I can finally focus on my work. Our work. I'm capitavated by the possibilities..." Agnes went on for a while like this, eventually accompanied by the sound of Goddard scrawling down notes."
  nf_baggers_boulder.67.a:0 "Talk about a new lease on life."
  BAG_agnes_brain_tt:0 "Dr. Agnes is now a brain in a jar. Fortunately her containment unit is portable, so we can take her with us in the event of an evacuation!"
  #Toilet Joke
  nf_baggers_boulder.68.title:0 "Score!"
  nf_baggers_boulder.68.desc:0 "Briggs hugged the suitcase tightly as he made his way to his quarters. He couldn't believe his luck, happening to find that key while checking the other restrooms. Who would have thought someone would stash hard earned pre-war cash in a lavatory of all places? He was even luckier no one questioned his expedition to the lower levels. It wasn't like he had a good reason to be down there. \n\nHe was going to stash it somewhere safe and sneak it out of the facility later. He just had to avoid-\n\n"Major!" Coleridge's call caused Briggs to jump. "What have you got there?" \n\n"Uh...it's just, uh...a little project of mine, I-" Coleridge didn't wait for him to finish, striding up and snatching the suitcase. He peeked inside. \n\n"You know the rules, Major. All cash assets in the Dome are property of the government. Be happy I won't discipline you for this...lapse in judgement." Coleridge walked away with Briggs' prize. The Major deflated, and went inside his quarters to mope."
  nf_baggers_boulder.68.a:0 "That was a lot of Ben Franklins."
  #
  nf_baggers_boulder.6.title:0 "Going Under"
  nf_baggers_boulder.6.desc:0 ""Are you sure this is necessary?" Coleridge asked, climbing out of his power armour. \n\n"Your armour provides significant protection against gas and radiation, I don't suggest testing it against the Blu Flu. These suits are well tested against it." The two of them donned their biohazard suits as they spoke. They were not unlike Vault suits, but based on an older design. Much bulkier, and of a lighter blue. \n\n"How can we be so certain the plague is still alive down there?" Coleridge was very uncomfortable in his suit. He felt vulnerable in it, and he could see less with this helmet on. \n\n"Scanners still suggest it's there. Nobody's forcing you to join me, you know." \n\n"Like I'd let you go alone," Coleridge stepped into the decontamination chamber to the right, as Goddard went into the lefthand one, "I just...don't feel comfortable going so deep underground." \n\n"Are you claustrophobic? That's curious given you spend your time in a walking box." Goddard's tone indicated genuine surprise. \n\n"You got a problem with that?" Coleridge barked back. \n\n"Oh no, not at all. If you are and are still willing to risk the journey, I respect you more for that.""
  nf_baggers_boulder.6.a:0 "Thanks, Goddard."
  #
  nf_baggers_boulder.7.title:0 "Where Hell is Six Feet Deep"
  nf_baggers_boulder.7.desc:0 ""How are you holding up?" Goddard asked Coleridge, who trailed behind him. The General stood straight, too proud to display his fear. \n\n"I'm fine." He replied curtly. The tunnels were the barest part of the facility. They were damp and dark, which reminded Goddard that they needed to fix the waterworks and generators. Both of them gripped their flashlights tightly. \n\n"Have you ever visited San Francisco before? The Shi city?" Goddard asked abruptly, breaking Coleridge's train of thought. \n\n"Yes, once. Part of a military delegation. Why?" \n\nGoddard reached up and grasped the cable that connected his suit to the central system. "We're like the trams they have there. Did you see those?" \n\nGoddard let out a nervous laugh. "Yeah, yeah...we are like those." They continued deeper into the tunnels, searching for the means to power the elevator and descend yet again."
  nf_baggers_boulder.7.a:0 "Just one more step..."
  #
  nf_baggers_boulder.8.title:0 "To Hell and Back..."
  nf_baggers_boulder.8.desc:0 "Goddard couldn't hide his nerves. He felt like the wasteland, the wars, the diplomatic sparring, all that was doable. Having to face his greatest failure, the machine they had to abandon? That was another story. His bald head was coated in sweat. "It's quite hot in here, isn't it?" He spoke to Coleridge. He tried to wipe the sweat from his brow, only to remind himself he was wearing a helmet. \n\n"It really isn't." The General responded. He was relieved to finally be out of those narrow corridors. "We might be going deeper, but my personal circle of hell is behind me." He commented as the elevator took them down. \n\n"I would never have guessed you'd read Dante's Inferno, General." \n\n"I am full of surprises, Goddard. This little adventure won't stop reminding me of it, and now...I'd say your final trial is commencing." The elevator finally settled on the last level. The doors began to crack open. \n\n"What was the engraving on the entrance of hell, again?""
  nf_baggers_boulder.8.a:0 ""Abandon hope all ye who enter here...""