   DOME_first_level_officer_quarters_preq_desc: "§YВимога§!\n\nВи вже §yвідвідали§! наступну кімнату Купола Боулдера:\n- §YЗал фізичної підготовки§!"
   DOME_first_level_water_pump_shack_preq_desc: "§YВимога§!\n\nПотрібен ОДИН персонаж із наступною рисою:\n- §YУмілий водяний механік§!\n- §YВетеран-механік§!"
   DOME_second_level_weapons_lab_testing_chamber_preq_desc: "§YВимога§!\n\nПотрібно відремонтувати модуль Купола Боулдера:\n- §YДоступ до реактора§!\n\nПонад §Y24§! фабрики"
