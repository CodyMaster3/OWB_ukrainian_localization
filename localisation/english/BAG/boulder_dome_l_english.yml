   DOME_first_level_hydroponics_garden_reward_desc: "§YНагорода§!\n\nЗменшує штраф за випередження часу на §G1.0§! року та дає §G50%§! бонус до дослідження. Діє на наступне §Y1§! дослідження в категорії: §YСільське господарство§!."
