l_english:
   BOULDER_DOME_VIEW_BIRD_EYE: "Купол Боулдера з висоти пташиного польоту"
   BOULDER_DOME_VIEW_SEGMENTED: "Сегментована візуалізація купола"
   BOULDER_DOME_BLUEPRINT: "Внутрішня структура купола"
   ENTER_DOME: "§GУвійти§! до купола Боулдера, дива Колорадо! Ласкаво просимо!"
   LEAVE_DOME: "§RЗАЛИШИТИ§! купол Боулдера, диво Колорадо! Ми чекатимемо твого повернення!"
   #
   SCOUTING_EVENT: "§YРозвідати околиці Боулдера§!\n§LМісто Боулдер значно виросло з часу останніх записів, що є в нашій базі. Їм понад двісті років, тож це не дивина. Мегаполіс розширився на північний захід, адже прибулі студенти та науковці потребували житла, й адміністрація міста поглинула навколишні поселення.\n\nҐанбарел, Валмонт і Нівон стали передмістями Великого Боулдера, тож нам доведеться подолати чимало миль, перш ніж наблизимось до купола.§!\n\n§YУмови:§!\n[BOULDER_SCOUT_TRIGGER]\n\n§YЕфекти після вибору:§!\nОтримає подію '§YОперація: спостереження за птахами§!'."
   BOULDER_SCOUT_YES: "£trigger_yes Досліджено §YРозвідка II§!"
   BOULDER_SCOUT_NO: "£trigger_no Досліджено §YРозвідка II§!"
   SIEGE_EVENT: "§YЗачистити операційну зону від загроз§!\n§LБоулдер пережив Велику війну, але досі носить її шрами. Купол став першочерговою ціллю, і через це район вкрито радіоактивним пилом. Через високу концентрацію випромінення тут майже виключно живуть гуль. А де гуль – там і здичавілі. Ми мусимо зачистити місцевість, перш ніж зможемо розгорнути базу біля комплексу.§!\n\n§YУмови:§!\n[BOULDER_SIEGE_TRIGGER_LEVEL]\n[BOULDER_SIEGE_TRIGGER_TECH]\n\n§YЕфекти після вибору:§!\nОтримає подію '§YОперація: зсув§!'."
   BOULDER_SIEGE_LEVEL_YES: "£trigger_yes §Y[568.GetName]§!: Околиці розвідані"
   BOULDER_SIEGE_LEVEL_NO: "£trigger_no §Y[568.GetName]§!: Околиці розвідані"
   BOULDER_SIEGE_TECH_YES: "£trigger_yes Виконано одну з умов:\n Досліджено §YЛегкий кулемет§!\n Досліджено §YВажка імпульсна зброя§!"
   BOULDER_SIEGE_TECH_NO: "£trigger_no Виконано одну з умов:\n Досліджено §YЛегкий кулемет§!\n Досліджено §YВажка імпульсна зброя§!"
   FORT_EVENT: "§YУкріпити периметр§!\n§L«Місто під куполом», як його називають місцеві, наразі в безпеці. Але ще багато треба зробити, перш ніж ми зможемо доставити потрібне спорядження до входу в купол. Очищення зони від радіації, прибирання завалів і будівництво укріплень уздовж периметра – усе це необхідно для утримання нашої позиції.§!\n\n§YУмови:§!\n[BOULDER_FORT_TRIGGER_LEVEL]\n[BOULDER_FORT_TRIGGER_BUILDING]\n\n§YЕфекти після вибору:§!\nОтримає подію '§YОперація: туристична стежка§!'."
   BOULDER_FORT_LEVEL_YES: "£trigger_yes §Y[568.GetName]§!: Зона очищена від здичавілих гуль"
   BOULDER_FORT_LEVEL_NO: "£trigger_no §Y[568.GetName]§!: Зона очищена від здичавілих гуль"
   BOULDER_FORT_BUILDING_YES: "£trigger_yes §Y[568.GetName]§!: Провінція з переможною точкою: понад §Y2§! форпости"
   BOULDER_FORT_BUILDING_NO: "£trigger_no §Y[568.GetName]§!: Провінція з переможною точкою: понад §Y2§! форпости"
   #
   DOME_ROBOBRAIN_DECISION: "§YОперувати мозок Аґнес§!\n§LЧас настав. Якщо ми зволікатимемо – таємнича недуга, що точить наше безцінне тіло, переможе. Хоч вона й боїться бути зведеною до мозку в банці на гусеницях – це єдиний шанс урятувати її.§!\n\n§YУмови:§!\n[BOULDER_DECISION_ROBOBRAIN]\n\n§YЕфекти після вибору:§!\nОтримає подію '§YЖива спадщина§!'."
   BOULDER_DECISION_ROBOBRAIN_YES: "£trigger_yes Понад §Y50 політичної влади§!."
   BOULDER_DECISION_ROBOBRAIN_NO: "£trigger_no Понад §Y50 політичної влади§!."
   ###
   #Перший рівень
   DOME_elevator_desc: "§YЛіфт§!\n\nОдин із ліфтів, якими ми користуємось для переміщення між рівнями комплексу. Щоб піднятись чи спуститись, просто натисни кнопку на панелі.\n\n(§yПідказка:§! Відкриття рівнів пов’язане з національними фокусами!)"
   DOME_first_level_east_garage_desc: "§YСхідний в’їзд до гаражу§!\n\nОдин із гаражів купола. Родина Ґаленських паркує тут свої вантажівки, поки наші військові користуються іншим. Усередині складно зрозуміти, це автомайстерня чи дитяча – іграшки та запчастини валяються всюди."
   DOME_first_level_galenski_quarters_desc: "§YЖитло родини Ґаленських§!\n\nДомівка родини Ґаленських. Безліч дитячих ліжечок, всюди розкидані іграшки, але при цьому підтримується чистота. Матір родини, Гелен, зазвичай саме тут – варить їсти та тримає малюків у порядку. Зброя на стінах зачинена й недоступна дітям, але її присутність створює дещо загрозливу атмосферу."
   DOME_first_level_lobby_entrance_desc: "§YВхід до вестибюля§!\n\nГоловний вхід до всього комплексу. Його було зачинено після інциденту багато років тому – пневматичні замки спрацювали, коли хтось розтрощив панель керування. Ззовні його можна було відкрити лише вибухівкою. Але тепер, коли ми всередині, можна розблокувати двері, що значно полегшить наше розміщення."
   DOME_first_level_baggers_quarters_desc: "§YКазарми «Беґерів»§!\n\nОдин із великих загальних житлових блоків на рівні, де спочатку проживали [BAG.BAG_LARSEN.GetName] та його солдати. Хоча Ларсен раніше проявляв непередбачуваність, без Сили Беґерів ми б не витримали. Вони знову охоронятимуть Купол – щойно ми приберемо це місце. Стіни з отворами від куль, розтрощені меблі, купи попелу – все, що залишилось від друзів і ворогів."
   DOME_first_level_storage_desc: "§YСклад§!\n\nСкладське приміщення першого рівня. Тут переважно зберігаються продукти харчування та базове спорядження – запасні частини до кавомашини й додаткові ліжка."
   DOME_first_level_toilet_desc: "§YГоловна вбиральня§!\n\nЦе... це туалет. А що ти сподівався тут побачити? Навіть солдати й науковці не можуть ігнорувати поклик природи. ... Ти ще тут, малий? Хочеш, дам завдання знайти запчастини, щоб прочистити засмічений унітаз? За... скажімо, двадцять доларів НКР і дві довоєнні пайки?"
   DOME_first_level_west_garage_desc: "§YЗахідний в’їзд до гаражу§!\n\nПоки Ґаленські користуються іншим гаражем, цей зарезервований для військових. Тут стоять вантажівки та каравани з браміном, що постачають припаси до комплексу і дозволяють місцевим торговцям взаємодіяти з НКРА. Вхід прикрашають трофейні броні та зброя рейдерів – нагадування тим, хто думає нас атакувати."
   DOME_first_level_kitchen_desc: "§YЇдальня§!\n\nЇдальня на першому рівні – досить сумне видовище. Двадцять років тому ми були геть неготові, і не могли забезпечити собі нормальне харчування. У нас був лише кольоровий харчовий гель – без смаку, без поживності. Минуло двадцять років, а він досі їстівний і має ту ж текстуру. Америка не пережила ядерну катастрофу, а от гель – так."
   DOME_first_level_quarantine_entrance_desc: "§YВхід до карантинного центру§!\n\nЦей вхід був призначений для постачання припасів у разі активації карантинного протоколу. Має кілька шлюзових дверей, щоб розділяти групи людей, і багато кодів доступу для збереження безпеки в кризові часи. Ані радіації, ані Ліміт-115 тут немає, тож зараз центр не використовується. Хоча саме ним ми нещодавно й повернулись всередину."
   DOME_first_level_officer_quarters_desc: "§YКазарми вищого командування§!\n\nТут проживає генерал та інші члени вищого командування. Це як звичайна вітальня, тільки більша й має додатковий стіл у центрі, де грають у покер і довоєнні колекційні картки. Їхні знання у військовій справі корисні для вивчення озброєнь Купола."
   DOME_first_level_hydroponics_garden_desc: "§YГідропонний сад§!\n\nГідропонний сад на першому рівні – скам’яніла спадщина старого світу. Вирощувати врожай без ґрунту – звучить як утопія, але система справді працює. Сад надзвичайно малий і міг забезпечити лише кількох науковців у Куполі, але відновлення цієї технології значно покращить наші врожаї."
   DOME_first_level_water_pump_shack_desc: "§YНасосна будка§!\n\nДещо іржава насосна будка. Хоча панель керування в порядку, усі датчики зламані – але їх легко полагодити. Щойно знайдемо когось з умінням ремонту на рівні 25 або більше, матимемо доступ до чистої, фільтрованої води."
   #Другий рівень
   DOME_second_level_goddard_office_desc: "§YОфіс доктора Ґоддарда§!\n\nОфіс голови комплексу та водночас провідного дослідника. Природно, цю посаду обійняв доктор Ґоддард. Звідси він перевіряє та впорядковує всі наукові звіти. Поруч з численними шафами для документів – його персональний термінал і довоєнна кавомашина. Саме цей «президентський бонус» змусив Ґоддарда вибрати цю кімнату – кавомашина вбудована в стіну й не підлягає переміщенню."
   DOME_second_level_agnes_office_desc: "§YОфіс докторки Аґнес§!\n\nКабінет заступниці головного дослідника. Докторка Аґнес отримала цю посаду за досвід і надійність. Кімната нічим особливо не вирізняється – вдвічі менша за сусідню, зате з подвійною кількістю паперової роботи. Під столом приклеєна записка з написом §t«SISYPHUS»§!."
   DOME_second_level_common_residence_1_desc: "§YКімната Дональда§!\n\nКімната мінімалістична, проста, майже без прикрас. Тут висять переважно довоєнні постери з науковими формулами, але є й кілька дитячих малюнків із геометричними фігурами. Дональд каже, що створювати й розглядати їх допомагає йому розслабитися та зосередитися на своїх теоремах."
   DOME_second_level_common_residence_2_desc: "§YКімната Джеймса§!\n\nОдна з найвишуканіших кімнат, разюче контрастує із сусідньою. Золото часто використовується як декоративний акцент. Бунтівна натура Джеймса натякає на необхідність ретельного обшуку... Хто знає, що можна знайти під його ліжком або в тумбочці?"
   DOME_second_level_common_residence_3_desc: "§YКімната Пола§!\n\nПовний безлад, гірше, ніж у більшості підлітків. Наче ураган пронісся – усе або на ліжку, або розкидано по підлозі. Проблеми Пола з наркотиками – не секрет, але дивує, що його ментати просто валяються на простирадлі."
   DOME_second_level_common_residence_4_desc: "§YКімната Ніни§!\n\nЦя кімната завжди зачинена на кілька замків, тож ми не знаємо, як вона виглядає всередині. Але за словами тих, хто проходив повз, коли Ніна заходила чи виходила, там стоїть імпровізована статуя Ґоддарда на платформі. Її голова – надзвичайно яскрава. Принаймні, так кажуть."
   DOME_second_level_common_residence_5_desc: "§YКімната Сян§!\n\nСтара кімната Сян. Її зрада боляче вдарила по всій експедиції, але найбільше постраждав Пол. Хоч усі на неї сердиті й ніхто не чекає на повернення, кімнату зберігають чистою й порожньою – як і раніше."
   DOME_second_level_common_residence_6_desc: "§YКімната Кендіс§!\n\nКендіс залишалася поруч зі своїми студентами навіть після того, як вони перебралися до Купола. Вона поводиться з ними, як мати, й допомагає в наукових експериментах. У її кімнаті є персональний термінал, з якого вона регулярно надсилає звіти комусь. Ми досі не знаємо – кому саме."
   DOME_second_level_common_residence_7_desc: "§YКімната Даян§!\n\nДаян, хоч і є нижчим офіцером НКРА, зазвичай не мала б ані власної кімнати, ані місця в секторі НКР. Але для неї зробили виняток. Вона ніколи не ладнала з іншими солдатами й почувається безпечніше подалі від чоловічих казарм. Її знання в галузі гідромеханіки – безцінні, тож вона лишається тут, подобається це майору чи ні."
   DOME_second_level_common_residence_8_desc: "§YКімната Вала§!\n\nЗазвичай ми не дозволяємо цивільним знаходитися в Куполі, але робота Вала настільки важлива, що зроблено виняток. Купол у руїнах, і його зварювальні навички буквально незамінні."
   DOME_second_level_common_residence_9_desc: "§YКімната дядька Джима§!\n\nПрисутність дядька Джима така ж виправдана, як і Вала. Молодший добре справляється з будівництвом і ремонтом, але йому бракує терпіння для обслуговування. Саме тут вступає Джим."
   DOME_second_level_common_residence_10_desc: "§YКімната Роша§!\n\nБільшість із нас спершу з підозрою ставились до ідеї поселити супермутанта в Куполі. Але Рош виявився вірним союзником, і його природа – наша найбільша перевага. Цілковита стійкість до радіації та хвороб, зокрема «блакитного грипу», робить його ідеальним розвідником. Віддати йому одну з найбільших кімнат – найменше, що ми можемо зробити."
   DOME_second_level_common_residence_11_desc: "§YСтара кімната Аґнес§!\n\nКоли Преспер був головним науковцем, а Ґоддард – його заступником, Аґнес жила тут. Відколи вона переїхала до кабінету заступниці, кімната лишається порожньою. Тільки її маленький сад ще використовується іншими мешканцями рівня."
   DOME_second_level_toilet_desc: "§YВбиральня§!\n\nО, знову ми тут... Це вбиральня. Люди роблять тут свої справи. І що я ще можу написати, щоб тебе зацікавити? Може, перевір одну з кабінок – раптом там скелет із цінним лутом чи модною шапкою! Хто знає? Я точно ні."
   DOME_second_level_gym_desc: "§YЗал фізичної підготовки§!\n\nКомусь може здатися дивним наявність обладнаного спортзалу в науковому центрі, але тривале дослідження виснажує не лише розум, а й тіло. Навіть якщо не згадувати про хронічні болі в спині від постійного сидіння, занедбаний фізичний стан шкодить якості наукової праці. Зал частіше відвідують офіцери, але загалом ним користуються всі."
   DOME_second_level_weapons_lab_desc: "§YЛабораторія розробки зброї та допоміжного обладнання§!\n\nВідоме як лабораторія дослідження зброї, це місце спершу мало другорядне значення. Як і решта малозначущих досліджень, що проводились тут, воно залишає небагато слідів, які допоможуть завершити почате. Але хто знає – може, тут ще є приховані секрети..."
   DOME_second_level_weapons_lab_testing_chamber_desc: "§YДослідження променевої зброї§!\n\nПрототип під’єднаний до головного реактора Купола, бо потребує стільки енергії, що жодне інше джерело не витримало б. Його ніколи не випробовували – реактор не міг одночасно живити блок ZAX і зброю. Наш головний електромеханік, звісно, здатен це врівноважити – треба лише змусити реактор працювати."
   DOME_second_level_armour_lab_desc: "§YЛабораторія розробки особистої броні§!\n\nЛабораторія дослідження броні, як і її «сестра», залишилася недооціненою. Через обмежене фінансування дослідники змогли провести лише базові тести. Але, можливо, й тут ховається щось корисне..."
   DOME_second_level_armour_lab_testing_chamber_desc: "§YПрототип силової броні§!\n\nОсобистий проєкт головного інженера Армстронґа. Його жодного разу не випробовували, навіть тестову одиницю не створено. Виглядає надмірно складним у реалізації, доволі дорогим у виробництві – але цілком можливим."
   DOME_second_level_plague_lab_desc: "§YЛабораторія дослідження хвороб і біозагроз§!\n\nКупол створили для запобігання поширенню чум. Витік на арсеналі Скелястих гір зробив його необхідним. Тут також намагалися створити ліки від «блакитного грипу». Хоча їм це не вдалося, вони розробили препарат, що певною мірою уповільнює хворобу."
   DOME_second_level_plague_lab_terminal_1_desc: "§YЖурнал досліджень L1M1T-115-2053-55§!\n§YІм’я:§! д-р Вільям Фарр II\n§YДата:§! 2055, IT (ignoblia tempus)\n\nУ співпраці з дослідницьким центром West-Tek, Об’єднаний науковий електорат Колорадо (далі – CURE), до якого входить і дослідницький центр купола Боулдера, розпочав роботу над ліками від нещодавно виявленої «Нової чуми».\nХоч назва й надто гучна завдяки жовтій пресі, ми можемо звинувачувати лише бездіяльність у попередні роки. Епідемія почалась понад два роки тому, й дотепер сподівались, що карантин зупинить її сам по собі. Краще пізно, ніж ніколи. Перші зразки ліків виглядають обнадійливо, але доведеться дочекатися результатів тестів, аби бути впевненими.\n"
   DOME_second_level_plague_lab_terminal_2_desc: "§YЖурнал досліджень L1M1T-115-2062-63§!\n§YІм’я:§! д-р Вільям Фарр II\n§YДата:§! 2063, IT\n\nМи знову тут, повертаючись до справи, яку вважали закритою назавжди. Минуло понад десятиліття, й спалахнула нова хвиля вже не зовсім «Нової чуми». Ми були впевнені, що маємо ліки, але наші вакцини неефективні проти нового штаму. Доведеться вивчити мутагенні властивості вірусу, щоби завадити йому обходити наші рішення. Оскільки «Проєкт Притулок» нарешті отримав хід, наше фінансування швидко скорочується – доведеться зупинити всі інші дослідження, щоб зосередитися на цій проблемі.\n\nНа щастя, ніхто з дослідницької групи ще не заразився, що майже диво, враховуючи, що ми живемо на тому жахливому харчовому гелі. Наш імунітет і так ледве працює. Але я не втрачаю надії – ми вже зупиняли цей вірус і зможемо знову.\n"
   DOME_second_level_plague_lab_terminal_3_desc: "§YЖурнал досліджень L1M1T-115-2073§!\n§YІм’я:§! д-р Вільям Фарр II\n§YДата:§! 2077, жовтень, 22\n\nВперше за всю кар’єру я почуваюся невідповідним для завдання, яке мені доручено. Не тому, що цей «блакитний грип» уже чимось особливо вразив, а тому, що мені доводиться аналізувати двадцятирічні звіти про зараження. Я епідеміолог, а не архіваріус. Та все одно мушу знайти щось, що допоможе нам зробити прорив. Можливо, ми колись проґавили ключову деталь, або ж старі ліки знову спрацюють...\n\nНам би значно допомогло, якби West-Tek поділилися своїми напрацюваннями, але уряд, як завжди, мовчить. Через стрімку мутацію вірусу всі ефективні ліки швидко втратили силу. Можливо, інші вже здалися, але я – ні. Я працюватиму й упорядковуватиму всю цю маячню, доки не знайду відповіді. Або ж світ загине раніше!\n"
   DOME_second_level_plague_lab_terminal_4_desc: "§YЖурнал досліджень L1M1T-115-BL0-FL03§!\n§YІм’я:§! д-р Віктор Матіас Преспер\n§YДата:§! 2253, IT\n\nПеречитування цих старих звітів викликає в мені і розчарування, і захоплення. Спершу – розчарування, побачивши, як мої колеги не змогли вчасно розпізнати головні властивості чуми й марно намагались її зупинити. Було створено чимало сироваток та антибіотиків, але вони давали лише тимчасове полегшення. Вірус, схоже, може впадати в сплячку в клітинах і проявлятись пізніше, перетворюючи «вилікуваних» людей на носіїв. Справді захоплююче. Нові штами нібито навіть викликають безпліддя в тих, хто вижив.\n\nХоча старому Фарру бракувало геніальності, аби це побачити, для мене очевидно, звідки взявся вірус і як він працює. Це означає, що «Ліміт-115» – потужний інструмент у моїх руках. На щастя, його схожість із FEV робить більшість супермутантів нечутливими до нього. Але я вже знайшов інше рішення. Мені лише потрібна допомога, щоб його реалізувати…\n"
   DOME_second_level_robobrain_lab_desc: "§YЦентр видобутку мозку та хірургії§!\n\nПерший етап створення юніта робомозку доволі простий – здобути функціональний мозок для його управління. Процес починається з того, що його вилучають із черепа. Звучить огидно, але так воно є. Доведеться знайти кількох… «добровольців», щоб спробувати це на практиці."
   DOME_second_level_code_lab_desc: "§YЦентр дослідження протоколу CODE§!\n\nПрограма CODE (виклик, можливість, дисципліна і етика) спершу була розроблена для пацієнтів у комі та після судом, але згодом її адаптували для «узгодження» майбутніх робомозків і подальшого їхнього програмування. Також її використовували для лікування ПТСР, зняття китайського промивання мізків і навчання новим навичкам. Якщо застосовувати її на звичайних (не-робомозкових) суб’єктах, при довготривалому використанні виникають побічні ефекти – галюцинації, судоми, провали в пам’яті."
   DOME_second_level_sleepers_lab_desc: "§YЛабораторія довготривалої кріоніки§!\n\nКупол Боулдера був одним із головних розробників технологій кріосну – спершу її створювали для космічних подорожей. Технологію так і не завершили, але деякі установки перевезли в інші частини США для подальших випробувань. У журналі зберігання згадується, що частину обладнання отримала база Сієрра. Поряд із генераторами та технікою стоїть два баки кріосну – в одному з них досі перебуває пацієнт, якого вчені прозвали «Ковтунчик»."
   DOME_second_level_well_room_desc: "§YКолодязна кімната§!\n\nЦя кімната – частина водної системи Купола, яка пронизує весь комплекс. Звідси можна отримати доступ до водогону для обслуговування або забору води. На жаль, саме ця частина системи сильно заражена і відокремлена від решти мережі."

   #Третій рівень
   DOME_third_level_decontamination_chamber_desc: "§YКамера знезараження§!\n\nФу, від тебе тхне. Іди прими душ, смердоту."
   DOME_third_level_water_pipe_maintenance_desc: "§YТрубопровідний доступ і обслуговування§!\n\nЦе – кошмар для сантехніка. Усі труби комплексу сходяться тут у химерному клубку міді та сталі. Місця для ремонту дуже мало, усе тісно й незручно. І є лише один запобіжник у разі зараження води – водяний чип. Якщо цей чип вийде з ладу, вода з Боулдер-Крік перестане фільтруватися та буде заражена радіацією і, хто знає, чим ще. Хто взагалі проєктував систему водопостачання з такою очевидною точкою провалу?"
   DOME_third_level_energy_research_desc: "§YЛабораторія дослідження геотермальної енергії§!\n\nПоки що все на рівні теорії, але якби ми змогли harness енергію тепла з-під земної кори – це була б значно безпечніша альтернатива ядерній енергії. Ідея фантастична, з безліччю потенційних застосувань, щоб нарешті отримати безпечне відновлюване джерело енергії. На жаль, уряд НКР відмовився фінансувати дослідження, бо це «може загрожувати робочим місцям на Гуверській дамбі» чи щось таке. Сумно, правда."
   DOME_third_level_steam_research_desc: "§YЛабораторія дослідження парової енергії§!\n\nУсе індустріальне минуле тримається на парі. Вся різниця – в тому, як кип’ятити воду. Тут вивчали нові способи її нагрівання. Нові методи утворення тепла."
   DOME_third_level_bathroom_desc: "§YВбиральня§!\n\nХто б міг подумати? Усередині вбиральні – унітаз. В інших новинах: Ґоддард сидить у своєму офісі, а в лісі можна знайти дерево. Може, варто вирушити на пошуки водяного чипа або зниклих родичів – це принаймні було б корисніше, ніж читати цю безглузду нотатку flavor-тексту."
   DOME_third_level_lounge_desc: "§YЗона відпочинку§!\n\nПершим, чим зайнялося керівництво, було переналаштування автоматів на прийом доларів НКР. І все – задоволено пішли, мовби зробили щось корисне. От тільки ніхто не подбав про те, щоб автомати узагалі працювали. Тож зараз ми просто кидаємо гроші в залізні коробки, а нічого у відповідь не отримуємо. Це, втім, не заважає керівництву продовжувати «отримувати прибуток»."
   DOME_third_level_rocket_research_desc: "§YЛабораторія дослідження ракетного двигуна§!\n\nТут займалися справжнісінькою ракетною наукою. Можливо, одного дня ми збудуємо ракету, достатньо велику, щоб звалити з цієї радіоактивної діри. А може, збудуємо таку, яка зробить її ще гіршою."
   DOME_third_level_solar_laboratory_desc: "§YЛабораторія сонячної енергії§!\n\nУ цій лабораторії працювали над вдосконаленням сонячних панелей – щоб зробити їх ефективнішими та довговічнішими."
   DOME_third_level_living_quarters_one_desc: "§YІмпровізована спальня§!\n\nРяд матраців уздовж стін – от і все «житло». Тут виснажені науковці падають спати на кілька годин перед тим, як знову повертатися до своїх експериментів. Кожним подихом вони намагаються зробити світ кращим. Думаєш, ми могли б дозволити собі щось краще, ніж купа матраців на підлозі? Ні? Отож."
   DOME_third_level_living_quarters_two_desc: "§YІмпровізована спальня§!\n\nХтось знову лишив використані голки з психо просто на матраці. Так, я розумію – тиск, нерви, праця без відпочинку. Але це не означає, що треба розкидати голки посеред спальні, де будь-хто може впасти прямо на них. Хтось має це прибрати. Хтось, але не я."
   DOME_third_level_office_one_desc: "§YОфіс д-ра Ейвора§!\n\nКерований хаос. Акуратні стоси паперів стоять на столах, немов ряди солдатів – книги їх притискають, не даючи розлетітись. Інші книжки – позначені закладками й навмисно розкидані по кімнаті. На одній зі стін – імпровізована дошка з картками, прикріпленими шпильками, де зібрані геологічні дослідження Скелястих гір поблизу Боулдера. У центрі – папірець з написом: «Система замкненого циклу: зменшує викиди викопного пального майже до 0». Що це взагалі має означати?"
   DOME_third_level_office_two_desc: "§YОфіс д-ра Ціолковського§!\n\nЦей офіс лише прикидається охайним – достатньо зазирнути в шухляди, щоб побачити правду. Вони набиті файлами, які туди просто накидали, серед них – зім’яті сторінки та книги, відкриті на потрібних сторінках завдяки зігнутим палітуркам і обтяженням. На пересувній дошці – складні обчислення з ракетної науки, а на зворотному боці – ретельно намальована крейдою жінка з пишними формами в провокаційній позі. Підпис польською. Ми, певно, ніколи не дізнаємося, що там написано."
   DOME_third_level_office_storage_desc: "§YОфісне сховище§!\n\nПросто місце, де ми тримаємо офісне приладдя. А що ти очікував? Ні, ти не можеш нічого взяти. Що значить – тобі потрібен алюміній і дерево для поселення?.."
   DOME_third_level_executive_toilet_desc: "§YВбиральня керівництва§!\n\nТак, це теж туалет. Вітаю. Думаєш, буде якась нагорода за те, що натиснеш на всі туалети? Запевняю – ні. Якщо ти читаєш це, то дарма витрачаєш час. Упевнений, що ти розкажеш друзям: «О, якщо натиснути на всі вбиральні в куполі, то відкриється кастомізація танка» – чи ще якась маячня. Але якщо чесно, це справді найкращий туалет у всьому комплексі."
   DOME_third_level_robobrain_chassis_research_desc: "§YЛабораторія розробки шасі для робомозків§!\n\nХто взагалі вирішив, що дати цим вареним у розсолі божевільним мізкам шасі – гарна ідея? Я й так вважав, що давати їм здатність говорити – вже надто. Коротко кажучи: якщо ти користуєшся цією лабораторією, ти скоюєш злочин проти природи. Я не хочу, щоб ці штуки ганялись за мною. Вони мене лякають."
   DOME_third_level_long_distance_communication_research_desc: "§YДослідження далекого зв’язку§!\n\nТут ми розробляємо можливість зв’язку з нашою материнською державою – Новою Каліфорнійською Республікою. Ми дійшли висновку, що технічно можемо це зробити. Зараз ми намагаємося з’ясувати – чи варто. Бо якщо зв’язок буде, доведеться відповідати перед людьми, які не мають жодного уявлення про те, що ми тут взагалі робимо. Може, увімкнемо радіо завтра. А може, й ні."

   #Четвертий рівень
   DOME_fourth_level_water_storage_desc: "§YСховище води§!\n\nСерія резервуарів – це головне водосховище комплексу. Вода надходить із Боулдер-Крік, і після очищення в центрі фільтрації потрапляє сюди як питна. Один із резервуарів пошкоджено – в ньому був прихований прохід! Але тунель обвалився."
   DOME_fourth_level_restroom_desc: "§YВбиральня§!\n\nУ комплексі немає рівня без робочого туалету чи без зайвого метажарту, який нікому не смішний. А що ти очікував? Щоб технічні працівники на цьому рівні не ходили «до природи»? Але диви – в одній із кабінок справді є щось корисне. Але щоб потрапити туди, доведеться… перевірити всі інші туалети. Чому? Ну… щоб звик до замків, може?"
   DOME_fourth_level_robobrain_rechargers_desc: "§YСтанція підзарядки робомозків§!\n\nКомплекс колись охороняли численні робомозки, але більшість із них нині лежать мертвими купами заліза перед цією станцією. Якщо це не метафора стану всього комплексу – то що тоді?"
   DOME_fourth_level_storage_desc: "§YСховище§!\n\nСклад технічної команди. Забитий під зав’язку запчастинами, інструментами й металобрухтом. Ще є колода карт і кавомашина – очевидно, хтось трохи байдикував. Втім, брати тут нічого."
   DOME_fourth_level_sleepers_chamber_desc: "§YКамера сну§!\n\nРяди капсул сну – всі порожні. Їхні колишні мешканці покинули комплекс ще багато років тому після витівки Преспера."
   DOME_fourth_level_another_sleepers_chamber_desc: "§YНесправна камера сну§!\n\nЦя камера несправна, тому ми не можемо відкрити двері. Дивно, але слідів зовнішнього пошкодження нема, і в жодному звіті не згадується внутрішня поломка. Найпідозріліше: саме тут колись перебував Преспер."
   DOME_fourth_level_brain_bar_desc: "§Y«Мозковий бар»§!\n\n«Мозковий бар», як зазначено в наукових документах, – це місце, де зберігаються мізки зі спеціальним маркуванням. Це політичні вороги старого режиму, військові зі «зайвою владою» та кримінальні розуми, які на диво добре чинили спротив програмі CODE. Вони плавали у своїх надмірно великих резервуарах століттями, підключені до порошку ментатів."
   DOME_fourth_level_reactor_access_desc: "§YДоступ до реактора§!\n\nЦе технічний доступ до головного реактора Купола. Він перебуває в глибокому сні вже багато років, і ми маємо його перезапустити. Але спершу треба забезпечити більше електроенергії – отже, доведеться полагодити аварійний реактор у підвалі."
   DOME_fourth_level_purification_center_desc: "§YЦентр очищення§!\n\nЦей центр підтримує життєздатні умови у всьому комплексі. Він регулює воду, повітря й температуру, але перебуває в критичному стані. Якщо хочемо гуляти цими коридорами без захисного костюма – доведеться полагодити його."
   DOME_fourth_level_morgue_desc: "§YМорг§!\n\nЦе місце заповнене тілами з вилученими мозками. Ймовірно, жертви експериментів комплексу ще до Великої війни."
   DOME_fourth_level_cement_grave_desc: "§YЦементоване кладовище§!\n\nМи вже не впевнені, для чого спочатку була ця кімната. Але коли ми прибули двадцять років тому, нам довелося боротися з сяючими всередині комплексу. Ми поховали їх під цементом. Це – нагадування про наше минуле."

   #П’ятий рівень
   DOME_fifth_level_zax_ai_desc: "§YZAX: штучний інтелект§!\n\nСкарб Купола, мета нашої експедиції – автономний ШІ ZAX з Боулдера, нарешті перед нами. Цей довоєнний суперкомп’ютер брав участь у численних дослідницьких проєктах Купола. Врятувати його до того, як він самознищиться – наш головний пріоритет."
   DOME_fifth_level_emergency_generator_desc: "§YАварійний генератор§!\n\nАварійний генератор – останній рубіж, щоб утримати комплекс у разі катастрофи. Вона настала, але ніхто не планував, що генератор працюватиме понад двісті років. Він виробляє рівно стільки енергії, щоб ZAX лишався увімкненим. Щоб підключити решту мережі – доведеться повністю його відновити."
   DOME_fifth_level_mainframe_databank_desc: "§YБаза даних мейнфрейму§!\n\nДовгий ряд сховищ даних, що містять колосальний обсяг інформації, яку ZAX уже згенерував під час «Обчислення». Ми не можемо багато зробити з цим залізом."

