   DOME_second_level_armour_lab_testing_chamber_preq_desc: "§YВимога§!\n\nДосліджено технологію:\n- §YВідновлена силова броня Нового Колорадо§!"
   DOME_second_level_sleepers_lab_preq_desc: "§RПОПЕРЕДЖЕННЯ§!\n\n§tВхід без належної процедури може спричинити смертельні побічні ефекти Посткріонічного синдрому (ПКС).§!\n§yВідремонтуйте§! наступний модуль Купола Боулдера:\n- §YДоступ до реактора§!"
   DOME_no_reward_desc: "§YНагорода§!\n\nЦю кімнату не можна відвідати, а отже, вона не дає жодних нагород за просто перебування біля дверей."
   DOME_second_level_well_room_preq_desc: "§YВимога§!\n\nПотрібно відремонтувати модуль Купола Боулдера:\n- §YЦентр очищення§!\nПотрібен ОДИН персонаж із наступною рисою:\n- §YУмілий водяний механік§!\n- §YВетеран-механік§!"
