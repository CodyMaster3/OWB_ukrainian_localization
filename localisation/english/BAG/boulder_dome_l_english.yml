   DOME_fourth_level_reactor_access_preq_desc: "§YВимога§!\n\nПотрібно відремонтувати модуль Купола Боулдера:\n- §YАварійний генератор§!\nДосліджено технологію:\n- §YБазова електростанція§!"
   DOME_fourth_level_water_storage_preq_desc: "§YВимога§!\n\nПотрібно відремонтувати модуль Купола Боулдера:\n- §YЦентр очищення§!\nПотрібен ОДИН персонаж із наступною рисою:\n- §YУмілий водяний механік§!\n- §YВетеран-механік§!"
   DOME_fourth_level_purification_center_preq_desc: "§YВимога§!\n\nПотрібен ОДИН персонаж із наступною рисою:\n- §YУмілий водяний механік§!\n- §YВетеран-механік§!\nДосліджено технологію:\n- §YБазовий водоносний горизонт§!"
