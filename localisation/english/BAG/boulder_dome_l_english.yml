   DOME_second_level_weapons_lab_testing_chamber_reward_desc: "§YНагорода§!\n\nОтримано креслення §Yгаус-зброї§!"
   DOME_second_level_armour_lab_reward_desc: "§YНагорода§!\n\n§Y2x§! §G50%§! бонус до дослідження: §Yтехнологія силової броні§!."
   DOME_second_level_armour_lab_testing_chamber_reward_desc: "§YНагорода§!\n\nРозблоковано §Yпрототип силової броні Боулдера§!"
