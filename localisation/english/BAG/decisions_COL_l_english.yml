l_english:
  col_coloradan_powderkeg_decisions: "Це не просто сцена, це чортова гонка озброєнь"
  col_coloradan_powderkeg_decisions_desc: " " #Не чіпати – зберігаємо структуру

  colkeg_desc: "Колорадський порохова бочка"
  colkeg_desc_desc: "Безплідна смуга землі між Містом Псів і притоками Платту сьогодні майже повністю заселена гульми. Більшість із них були витіснені з міста, інші ж прибули сюди в пошуках прихистку. Між мешканцями панував мир. Але все змінилося з приходом експедиції Нової Каліфорнійської Республіки.\n\nСолдати й науковці затопили регіон, встановивши контроль над поселеннями в центральній частині. Попри відсутність прямих звірств, напруга відчутна в повітрі. Рано чи пізно щось станеться, що спровокує неминучий конфлікт. Питання не в тому – «чи станеться?», а в тому – «коли?»"

  coloradan_powderkeg_mission: "Палаючий ґніт"
  coloradan_powderkeg_mission_desc: "Солдати нервово стискають зброю на кордоні, пильно вдивляючись один в одного. Гулі побоюються, що замислили експедиціонери, а ті жахаються «мерців», які от-от кинуться в атаку. Хтось злякається, хтось неправильно розтлумачить ситуацію – і хтось зробить перший постріл. Трагедії не уникнути."

