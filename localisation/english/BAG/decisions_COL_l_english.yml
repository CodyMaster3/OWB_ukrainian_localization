  colkeg_remove_influence_bag: "Позбутися впливу §Y[BAG.GetNameWithFlag]§!"
  colkeg_remove_influence_bag_desc: "Баґґери вже завдали нам достатньо болю й страждань. Нам не потрібні їхні «форпости», щоб нагадували про це. Нехай усе, що вони збудували, повторить їхню долю – хай зникне й розсиплеться на порох."

