MET_STEEL_JOE_NAME:0 "Сталевий Джо"
MET_STEEL_JOE_DESC:0 "§gУ відчаї земель Монтани Сталевий Джо постає як вражаюча фігура з походженням таким же суворим і буремним, як і сам світ. Колись безіменний раб у безжальному Середньому Заході, шлях Джо від підневільного до грізного лідера банди Металевих Пащ – це історія зухвалості, перетворення та незламної амбіції.\n\nЗа його власною версією, Джо – втілення рішучості та непокори. Він жорстоко вбив свого гнобителя, спричинивши повстання, яке принесло свободу й нову еру йому та іншим рабам. Проголосивши бачення самовдосконалення, Джо став харизматичним лідером, який об’єднав поселенців, шахтарів та всіх, хто шукав інший шлях, у майбутню рейдерську групу. Його незламна відданість своєму народові підживлювала його зростання – і владу, і его.\n\nТа навіть попри успіх, шлях Джо до влади не був легким. Зіткнувшись з обмеженнями людського тіла, він звернувся до технологій і попрямував у Біллінгс, штат Монтана – місто, що славилось своєю одержимістю кіберімплантами. Там він обрав шлях «Металу» – це стало переломним моментом, запустивши еволюцію банди від звичайних людських рейдерів до страшної комбінації плоті й сталі.\n\nЯк лідер Металевих Пащ, Сталевий Джо викликає повагу завдяки безжальному навчанню, стратегічній жорстокості та власним модифікаціям. Його залізна хватка веде банду до конфліктів із владою Монтани. Та його шлях до зверхності обірвався, коли він зіштовхнувся із супротивником, чиї технології виявилися значно кращими. Колись нездоланна імперія Джо втратила силу, його гординя дала тріщину. Але з новою люттю та жагою помсти, він знову дивиться на людей Макартура.§!\n\n§RВін більше не програє.§!"

