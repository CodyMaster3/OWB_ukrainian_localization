#Advisor Descriptions
MET_leroy_brown_army_chief_desc:0 "Кажуть, Лерой прибув аж із Песо-Сіті й підтримував Сталевого Джо ще з початку його злету. Ця гора м'язів завжди стоїть за Джо – як у планах, так і в битві. Хоч Джо і сам не слабак, Лерой – найбільший з «Пащ», і застосовує свою силу однаково ефективно: чи то заспокоюючи бузувірів, чи проламуючи фронти на рейдах. Стратег він не надто складний, зате ніхто не зупинить його, коли він рушає в наступ. Він і Теммі постійно змагаються за друге місце у банді, щомісяця обмінюючись позиціями в залежності від кількості зламаних кісток."

MET_tungsten_tammy_army_chief_desc:0 "Нові блискучі протези рук дали Теммі впевненість, щоби нарешті покінчити з залежністю від Баффауту. Тепер ламання черепів своїм супер-молотом – єдиний кайф, що їй потрібен.\n\nДостатньо сильна, щоб проламати ворожі укріплення, але достатньо хитра, щоб змусити інших зробити це за неї. Теммі – одна з головних командирів «Пащ», і постійно бореться з Лероєм за найкращі цілі."

MET_mercury_high_command_desc:0 "Справжній шмат лайна, що приплив зі Стендінґ-Рока. Пішла звідти сама, кажуть, але чому – не зізнається. Та вона чудово вписалась. У неї гострий язик, злий характер і – завдяки імплантам – безліч способів позбутися тих, хто їй не до вподоби."

MET_leadhead_louie_high_command_desc:0 "Казали, що це неможливо, але старому Луї замінили череп повністю – і він досі справний. Деяким не подобається вигляд його блакитних очей, що визирають з голови вартибота, але він на це не скаржиться."

MET_crazy_harry_high_command_desc:0 "Експерт з піротехніки та підриву з шаленою посмішкою, хрипким сміхом і серцем із золота (ну, сталевим, якщо чесно) та ненаситною жагою до вибухів. Його обшарпаний вигляд – результат постійних імпровізованих тестів вибухівки. Гаррі просто обожнює підривати речі. Команда навчилась добирати слова обережно, щоб не запустити в дію чергову купу С4."

MET_general_mayhem_high_command_desc:0 "Ми досі не знаємо, звідки цей чувак узявся. Каже, що його мама – одна з колишніх подружок Сталевого Джо, але щоразу розповідає іншу версію. Я вважаю, що його слід би лишити десь у ямі, але цей божевільний настільки добрий боєць, що не можемо його списати."

MET_rusty_nose_navy_chief_desc:0 "Прізвисько отримав не через іржу на носі, а через любов до запаху іржі – особливо до затонулого металу в солоній воді, що повільно роз’їдається сіллю. Хоч ми й за сотні миль від солоного моря, він наповнює ванни водою з сіллю. Ми залишили йому нагляд над нашими кількома річковими човнами – не те щоб це було щось вартісне.\n\nКажуть, грає в покер зі Старим Залізним Зубом щочетверга, але ніхто того не бачив і не вижив."

MET_stormy_dan_air_chief_desc:0 "Колишній член Громових Рейдерів, вигнаний за релігійні суперечки з нинішнім керівництвом – принаймні так він каже. Але любов до літаків у нього лишилась! Без кінця базікає про «доторк до неба», намагається вибити запчастини на апгрейд винищувача чи знайти собі напарників по повітрю. Поки що безуспішно, і ми переважно продаємо деталі Блайндінгу Хейлу... Але, можливо, колись удача усміхнеться йому."

MET_braxton_bronze_air_chief_desc:0 "Знайшли цього хлопця майже мертвим, обличчям у кратері від авіакатастрофи, він щось бурмотів про вертіберд. Пола змилостивилась і впустила його до банди. Він ас у небі та повний позер, ледь не вбиває себе, виконуючи трюки, стріляючи в радскорпіонів із літака й витворяючи іншу дурню."

MET_chrome_feaster_theorist_desc:0 "Колись – зірка, що сходить у банді: харизматичний, нафарширований імплантами найвищого ґатунку й значно кмітливіший у тактиці за більшість, ніхто не чекав його стрімкого падіння. Під час рейду на Міссулу загін Хрому натрапив на елітних солдатів Макартура. Без майже жодної зброї, здатної пробити силову броню, він міг лише спостерігати, як його найближчих друзів знищувало плазмове полум’я.\n\nПовернувшись єдиним живим, він поринув у нав’язливу ідею помсти. Тепер його дні проходять у пошуках рішень проти СБ: тестування зброї, розробка тактик, які можуть спрацювати. Ніхто не знає, наскільки він успішний, аж до наступної великої битви. Хоча, можливо, новенькі в Монтані стануть непоганим полігоном..."

MET_kalium_shepherd_theorist_desc:0 "Народжений хворобливим і з кволим тілом, Калій розвинув невблаганну ненависть до інших жителів Гавра, які насміхались із нього через неспроможність виконувати важку працю, яку інші робили з легкістю. Сталевий Джо побачив у Калії розум, здатний вигадувати найкатуванняші способи винищення цілих поселень – і дав йому змогу їх реалізувати."

MET_iron_tooth_theorist_desc:0 "Старий Залізний Зуб – дивак. Якось він з’явився в наших краях: старий, сивий, загорнутий у плащ, і таємничий. Звернувся до Сталевого Джо з проханням. Сказав, що хоче «вивчати», як ми модифікуємо тіла, як вони реагують на імпланти й поліпшення. Натомість він запропонував поділитися власними знаннями. Що саме почув Джо – невідомо, але в результаті Зуб отримав власну лабораторію в старій лікарні в Біллінґсі. Там темно, і без його дозволу ніхто туди не заходить. Пліток повно – і про його медичні знання, і про його походження. Єдине, що більш-менш підтверджено: Луї клянеться, що бачив у нього дерев’яний талісман у формі вовчої голови."

MET_copper_robert_economic_advisor_desc:0 "Роберт колись нишпорив по старих будівлях, здираючи мідні дроти зубами прямо з ізоляції. Навіть із імплантами його досі б’є струмом – каже, що йому це подобається."

MET_gold_roger_economic_advisor_desc:0 "Думає, що він хитрий, із тим своїм іменем та усмішкою з золотим зубом. Надокучливий сучий син, який усе найцінніше залишає собі. Але знає, як приносити кришки, то хто буде скаржитись?"

MET_rajata_svarna_economic_advisor_desc:0 "Крихітна, вперта, і найхитріша «Металева Паща» у Монтані. Їй навіть імпланти не потрібні, щоб виманити з дурника всі кришки. Хоча той лазерний карабін, який вона завжди носить із собою, мабуть, не завадить."

MET_stan_wolfram_economic_advisor_desc:0 "Стан ніколи не надто захоплювався імплантами, особливо після втечі з Небесної Брами. Єдине, що він зробив – замінив одне око. Але навіть так він домігся великих успіхів в управлінні. Відтоді, як він з’явився, ніхто не голодував більше кількох днів."

MET_molly_b_dennet_economic_advisor_desc:0 "Стара Моллі Б. Деннет відома як найкраща зламувачка сейфів, шафок, дверей та всього, що має замок. Зазвичай вона користується вибухівкою, але її механічні пальці чудово працюють і як відмички. От тільки б змусити її перестати ховати кришки по всьому табору..."

MET_handy_danny_economic_advisor_desc:0 "Одна з небагатьох торговців, що достатньо божевільна, аби зробити Металеві Пащі своїм основним джерелом прибутку. Вона ж очолює єдину каравану, якій дозволено безперешкодно курсувати по їхніх територіях. Вона обмінює трофеї з рейдів, які банда не може або не хоче використовувати, на припаси від поселень, досить далеких, щоб не впізнати походження товару. Найбільшу ціну мають імпланти або протези – рідкісні й цінні знахідки, зазвичай викопані недосвідченими мародерами.\n\nЇї поважають, бо вона виграла металеве передпліччя в одного з членів банди на спір – і вже того ж дня дозволила відрізати свою руку, щоб імплантувати його. Щоправда, вона дізналась, що не виграла суперечку, лише після операції. Але вона досі підтримує цю байку – аби не втратити головних клієнтів."

MET_oz_meum_cultural_advisor_desc:0 "Не всі ми – буйні психи, одержимі бійками, грабунками та імплантами. Дехто з нас ще й використовує імпланти задля високого мистецтва. Оз, наприклад, полюбляє створювати людські кренделі."

MET_genny_legrand_cultural_advisor_desc:0 "Хтось має бути дипломатичним – і Дженні якраз підходить. З мінімальними імплантами та холодною головою вона ідеально підходить для контактів з іншими спільнотами. А якщо ті не приймають нашу дипломатію – вона їм черепа потрощить, як і будь-хто з нас."

MET_heidi_garum_cultural_advisor_desc:0 "Гайді вже тиждень ходить на хромованих ногах після заміни в Доктора – чудове доповнення до рук, які вона нещодавно отримала. Вони не лише гарні, а й досить міцні, щоб розчавити голову гуля. Форма й функція в одній гарній упаковці."

MET_doc_ripper_cultural_advisor_desc:0 "Містер Ордерлі – довоєнний медбот, спеціалізований на протезуванні. Металеві Пащі пробудили його, щоби він керував авто-доками та робив легкі процедури. Прізвисько «Док» він отримав через комбінацію бездоганної майстерності й повного ігнорування болю пацієнта."

MET_tinny_tim_cultural_advisor_desc:0 "Цей хлопець з’явився нізвідки – скаче, жартує. Ми спершу хотіли зробити з нього фарш, але він такий віртуоз на своєму крихітному гітарчику, що ми вирішили залишити його."

MET_paula_dium_cultural_advisor_desc:0 "Місцева кухарка й найстаріша серед Металевих Пащ, Пола присвятила себе доброму старому готуванню. Щоправда, її (буквально) залізний шлунок означає, що «домашні страви» часто смакують як бруд. Але їжа – це їжа."

MET_chopjaw_cultural_advisor_desc:0 "Дехто народжений, щоб битися, а дехто – ще й щоб лагодити все навколо. Чопджо час від часу ходить на рейди, але його справжня пристрасть – ремонт усього й вся. Зброя, інструменти, електроніка – все полагодить. Щоправда, завжди додає власні «модифікації», ще й має доволі дивне естетичне чуття. І весь час говорить сам до себе під час роботи – багатьох це дратує."

MET_meat_mouth_high_command_desc:0 "Навіть наймодифікованішим Металевим Пащам складно не відставати від Сталевого Джо, але один із нас це робить – без жодного імпланта. Міт-Мауф, так він себе назвав, – величезний Супермутант. Не надто розумний, але на диво товариський, хоча іноді полюбляє перекусити полоненими. Серед людей заслужив повагу як ватажок рейдів. Бити, трощити, шматувати й рвати – ось його тактика. Особливо полюбляє розкривати броньованих ворогів у пошуках «консервів»."

