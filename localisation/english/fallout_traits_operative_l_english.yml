l_english:
operative_ninja_trait_chance_factor:1 "Шанс найняти оперативника з рисою §HНіндзя§!"
operative_lockpick_trait_chance_factor:1 "Шанс найняти оперативника з рисою §HЗламник§!"
operative_frumentarius:0 "Фрументарій"
operative_frumentarius_desc:0 "Цей агент досконало володіє всіма методами легіонерської інфільтрації."
operative_vulpes:0 "Вулпес Інкульта"
operative_vulpes_desc:0 ""
operative_smooth_talker:0 "Красномовець"
operative_smooth_talker_desc:0 "Цей агент володіє срібним язиком і знає, як дістати потрібну інформацію."
operative_intensive_training:0 "Інтенсивна Підготовка"
operative_intensive_training_desc:0 "Цей агент пройшов надзвичайно виснажливу підготовку."
operative_ninja:0 "Ніндзя"
operative_ninja_desc:0 "Цей агент швидко адаптується до будь-якого середовища і бездоганно зливається з тінями."
operative_terryfing_presence:0 "Лячна Присутність"
operative_terryfing_presence_desc:0 "Цей агент знає, як змусити людей заговорити."
operative_speech:0 "Лінгвіст"
operative_speech_desc:0 "Цей агент – природжений майстер мови та інтеграції в чужі цивілізації.\n\n§GЗбільшує шанс§! здобути національність цілі після завершення операції."
operative_betrayer:0 "Подвійний Агент"
operative_betrayer_desc:0 "Цей агент був завербований з лав ворога і тепер служить нам."
operative_heavyweight:0 "Бійцівський Ветеран"
operative_heavyweight_desc:0 "Кулак ката швидше зламається, ніж цей агент."
operative_lockpick:0 "Зломщик"
operative_lockpick_desc:0 "Цей агент вирізняється здібностями до відкривання сейфів та замків."
operative_barter:0 "Торгівець"
operative_barter_desc:0 "Цей агент має талант вигравати будь-які перемовини."
operative_silent_running:0 "Майстер Втечі"
operative_silent_running_desc:0 "Тюрма, яка зможе втримати цього агента, ще не збудована."
operative_mad_bomber:0 "Божевільний Підривник"
operative_mad_bomber_desc:0 "Цей агент досконало знає всі способи, якими можна щось підірвати."
operative_gecko:0 "Улюблений Гекон"
operative_gecko_desc:0 "Немає нічого, що цей агент цінував би більше за свого гекона."
operative_plaguelands_inhabitant:0 "Уцілілий з Чумних земель"
operative_plaguelands_inhabitant_desc:0 "Цей оперативник родом із Чумних земель, що дозволяє йому чудово орієнтуватися в місцевих краях."