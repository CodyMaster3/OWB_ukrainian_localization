l_english:
TBH_idea_lns_advisors:0 "Економічні радники Лоун Стару"
TBH_idea_lns_advisors_desc:0 "У межах Техаського економічного союзу Лоун Стар надав нам низку економічних експертів для покращення й модернізації нашої промисловості. Їхні поради за останнє десятиріччя стали безцінними, безпосередньо сприяючи розширенню сільської інфраструктури та відновленню промислового сектору Далласа. \n\n§GДопоки ця умова §YТехаського економічного союзу§! активна, ми матимемо доступ до спеціальних радників з §YЛоун Стару§!.§!"

TBH_idea_lns_advisors_strong:0 "Економічні радники Лоун Стару"
TBH_idea_lns_advisors_strong_desc:0 "У межах Техаського економічного союзу Лоун Стар надав нам низку економічних експертів для покращення й модернізації нашої промисловості. Їхні поради за останнє десятиріччя стали безцінними, безпосередньо сприяючи розширенню сільської інфраструктури та відновленню промислового сектору Далласа. \n\n§GДопоки ця умова §YТехаського економічного союзу§! активна, ми матимемо доступ до спеціальних радників з §YЛоун Стару§!.§!"

