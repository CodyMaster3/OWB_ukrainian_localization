l_english:

tbh_nf_rhombus_chase:0 "Довгий марш на захід"
tbh_nf_rhombus_chase_desc:0 "Втеча армії Аттіса до Техасу змусила Техаське Братство виступити проти неї. Відокремившись від Західного Братства, Верховний Старійшина Ромбус повів загін на захід, у погоню за посіпаками Аттіса."

tbh_nf_national_guard:0 "Завжди готові, завжди поруч"
tbh_nf_national_guard_desc:0 "У Техасі їх чекала непроста ситуація. До Ромбуса звернулися залишки старої Національної гвардії, шукаючи прихистку для себе та своїх родин. Старійшина мав вирішити, як найкраще використати їхні вміння на користь Братства."

tbh_nf_texas_rangers:0 "Один рейнджер – один бунт"
tbh_nf_texas_rangers_desc:0 "Наступними до експедиції приєднались елітні Техаські рейнджери. Досвід Раннера відіграв ключову роль у підготовці Братства до прийдешнього конфлікту."

tbh_nf_rhombus_legacy:0 "Слідом за велетнем"
tbh_nf_rhombus_legacy_desc:0 "Серйозно поранений під кінець кампанії, Ромбус опинився на межі життя й смерті."

tbh_nf_development_1:0 "Розвиток Далласа"
tbh_nf_development_1_desc:0 "Руїни Далласа стали надійним підґрунтям для розбудови цивільного життя під управлінням Братства. Підтримаємо це тонкими втручаннями. Найкраща економіка – це керована економіка."

tbh_nf_development_2:0 "Розвиток Форт-Гуда"
tbh_nf_development_2_desc:0 "Під містом Гуд розташовано стару військову базу, яку досі нікому не вдалося повністю відкрити. Але навіть на поверхні повно цінного хламу, що може нам знадобитись."

tbh_nf_doctrinal_thought:0 "Доктринальні міркування"
tbh_nf_doctrinal_thought_desc:0 "Наше верховне командування має постійно адаптуватися до мінливих умов Пустки, щоб зберігати бойову готовність у найгірших обставинах. Більше ресурсів та звітів дозволить їм удосконалити існуючі доктрини як звичайних військ, так і спецпідрозділів."

tbh_nf_doctrinal_thought_2:0 "Переосмислити Кодекс"
tbh_nf_doctrinal_thought_2_desc:0 "Стратегічний кодекс Братства довго дотримувалися буквально. Але, щоб пристосуватись до нових умов, ми повинні вивчити його глибше й трактувати як рекомендації, а не суворі правила. Та все ж він може навчити нас кількох нових трюків."

tbh_nf_our_path_roots:0 "Техас для Раска"
tbh_nf_our_path_roots_desc:0 "Раск має рацію – Пустка не потребує чергової армії, що гнітить своїх громадян і воює замість того, щоб охороняти мир. Наша присяга – боронити закон і захищати людей від жорстоких умов життя. Ми не маємо права зрадити цю клятву."

tbh_nf_our_path_roots_2:0 "Раск для Техасу"
tbh_nf_our_path_roots_2_desc:0 "Наше Братство має вміти швидко й ефективно реагувати на загрози. Поділ сил на автономні осередки, які знатимуть місцевість і населення, дасть нам перевагу – підкріплення зможе діяти цілеспрямовано, кероване місцевими офіцерами."

tbh_nf_roots_new_recruits:0 "Розширення Братства"
tbh_nf_roots_new_recruits_desc:0 "Щоб захистити націю, нам потрібні добровольці – і багато. Наш заклик до порядку та безпеки вже викликає довіру. Все, що лишилось – поширити інформацію про набір, і двері Братства не зачинятимуться від охочих."

tbh_nf_roots_new_weapons:0 "Зброя Братства"
tbh_nf_roots_new_weapons_desc:0 "Заспокоєність і надмірна залежність від наявних технологій можуть обернутись для нас поразкою. Якщо ми хочемо, щоб наші війська були добре озброєні, слід стимулювати інновації: від фінансування досліджень до конкурсів серед бійців."

tbh_nf_our_path_new_shores:0 "Менш ходжена стежка"
tbh_nf_our_path_new_shores_desc:0 "Раск – шанований і гідний старійшина, який не раз вів нас правильно. Але для війни потрібна інша армія, не миротворці. Ми відмовимось від старих доктрин і створимо нову модель безпеки для Пустки."

tbh_nf_our_path_new_shores_2:0 "Завершення подорожі"
tbh_nf_our_path_new_shores_2_desc:0 "Наші реформи вже дали результат, але зупинятись рано. Щоб не відстати від ворога, ми відкриємо дослідницькі осередки по всьому краю. Технологічна перевага – ключ до нашого успіху."

tbh_nf_shores_new_tactics:0 "Нові тактики"
tbh_nf_shores_new_tactics_desc:0 "Оскільки ми відходимо від ідей Раска, нам слід переглянути свою тактику. Молоді офіцери, випускники академії, повні ідей і бажання проявити себе, чудово підійдуть для цієї мети."

tbh_nf_shores_new_vehicles:0 "Нові машини"
tbh_nf_shores_new_vehicles_desc:0 "Війна в Пустці вимагає мобільності. Ми оголосимо масштабну програму винагород за інновації в транспорті, аби модернізувати армію й заохотити технічний прорив."

tbh_nf_protector_of_texas:0 "Захисник Техасу"
tbh_nf_protector_of_texas_desc:0 "Після повної реформи сил ми можемо називатися справжніми захисниками Техасу. Хочуть вони того чи ні, але скоро всі зрозуміють: ні втекти, ні перемогти нас не вдасться. За Раска, за Союз!"

tbh_nf_listening_posts:0 "Створити пости спостереження"
tbh_nf_listening_posts_desc:0 "У війні розвідка – ключовий елемент. Без розвідданих провал операції неминучий. Ми створимо радари та пости, укомплектовані фахівцями, для швидкого отримання інформації."

tbh_nf_national_excersizes: "Навчання Братства"
tbh_nf_national_excersizes_desc: "Ретельне вивчення вправ, які виконує кожен новий рекрут у наших військах, може дати нам гарне уявлення про їхній спосіб мислення. Особливий інтерес викликає той факт, що деякі найбільш кмітливі новобранці іноді примудряються оминати перешкоди на складних дистанціях у зовсім неочікуваний спосіб."

tbh_nf_national_excersizes_2:0 "Підготовка Братства"
tbh_nf_national_excersizes_2_desc:0 "Кодекс Братства містить записи з численних кампаній – пам’ять і наука для майбутніх офіцерів. Вивчення та застосування цих уроків стане запорукою нашого зростання."

tbh_nf_national_excersizes_3:0 "Режим Братства"
tbh_nf_national_excersizes_3_desc:0 "Великі навчальні битви між молодими офіцерами дозволять здобути досвід і виявити слабкі місця в нашій тактиці та спорядженні."

tbh_nf_national_excersizes_4:0 "Дисципліна Братства"
tbh_nf_national_excersizes_4_desc: "Докорінно реформована система армійських муштр у поєднанні з наглядом з боку ветеранів дозволить нам передати мудрість досвідчених бійців нашим рекрутам. Вони отримають користь від цих величезних тактичних знань ще до того, як ступлять на поле бою."

tbh_nf_mister_entertainment:0 "Прямий ефір з Далласа"
tbh_nf_mister_entertainment_desc:0 "Хто ж не любить гарне шоу? Ми вийдемо на контакт з Містером Ентертеймент, аби укласти партнерську угоду. Спільне захоплення телебаченням має допомогти."

tbh_nf_a_mutually_benefitial_deal:0 "Укласти угоду"
tbh_nf_a_mutually_benefitial_deal_desc:0 "Ми підготуємо Акт про телекомунікації, що надасть Містеру Ентертеймент вільний прохід територіями ТЕС і наш захист. В обмін отримаємо техніку, розвіддані та позитивне висвітлення на його шоу."

tbh_nf_consolidate_conquests:0 "Консолідація Братства"
tbh_nf_consolidate_conquests_desc:0 "Нові території мають сенс лише тоді, коли вони закріплені. Ретельне планування адміністрації зробить їх повноцінною частиною нації."

tbh_nf_form_texas_yehaw:0 "Техаська Тимчасова Республіка"
tbh_nf_form_texas_yehaw_desc:0 "Уся наша праця вела до цього. Техаський економічний союз на піку, і ми готові оголосити створення Тимчасової Республіки Техасу – захисника миру на всій техаській землі."

tbh_nf_alamo_is_a_thing:0 "Колись єдині, колись могутні"
tbh_nf_alamo_is_a_thing_desc:0 "Глава з Аламо вийшла з-під нашого контролю, спричинивши глибоку кризу."

tbh_nf_the_hard_road:0 "Важкий шлях"
tbh_nf_the_hard_road_desc:0 "Наш офіцерський корпус зазнав втрат через розкол. Ми маємо докласти значних зусиль для відновлення армії. Шлях короткий, але ризик – чималий."

tbh_nf_the_long_road:0 "Довгий шлях"
tbh_nf_the_long_road_desc:0 "Наша армія дезорганізована, але ми знайдемо спокійне рішення. Тривала кампанія підготовки займе час, але будь-яка поспішність може стати фатальною."

tbh_nf_combat_our_deficits:0 "Подолати слабкості"
tbh_nf_combat_our_deficits_desc:0 "Розкол Аламо висвітлив недоліки нашої системи захисту. Мінімалістична модель бойового корпусу виявилась недостатньою для повноцінного протистояння."

tbh_nf_all_systems_ready:0 "Усі системи готові"
tbh_nf_all_systems_ready_desc:0 "Наші зусилля дали плоди. Вивчені уроки сформують доктрину Братства на покоління вперед. Хоча ще не все ідеально – ми повернули собі контроль і стабільність."

tbh_nf_our_fatman:0 "Тактична ядерна катапульта"
tbh_nf_our_fatman_desc:0 "Хоча повноцінні боєголовки поки поза нашим досяжністю, мініатюрні ядерні бомби скоро можуть з’явитись на полі бою. Доведеться проводити додаткову підготовку, але результат буде... ядерним."


# Economic Union Stuff
tbh_rekindle_economic_union:0 "Відновити Економічний Союз"
tbh_rekindle_economic_union_desc:0 "Колись могутній наріжний камінь нашої нації, Техаський економічний союз занепав, поки ми були зайняті війною з Бандою Руки. Це потрібно виправити!"

tbh_two_nations_one_system:0 "Дві нації – одна система"
tbh_two_nations_one_system_desc:0 "Тісно інтегруючи економіки нашої держави та союзників у Техаському економічному союзі, ми зможемо отримати значні вигоди. Хай триває це процвітання!"

tbh_develop_join_arms_production:0 "Спільне виробництво зброї"
tbh_develop_join_arms_production_desc:0 "Об’єднавши промислову міць [LNS.GetName] з військовою експертизою [TBH.GetNameDef], ми зможемо суттєво підвищити нашу військову продуктивність!"

tbh_announce_fiscal_reform:0 "Оголосити фінансову реформу"
tbh_announce_fiscal_reform_desc:0 "Хоча Техаський економічний союз сильний, він не бездоганний. Фінансова реформа допоможе зміцнити його основу."

tbh_expand_inter_nation_inf:0 "Розширити міжнаціональну інфраструктуру"
tbh_expand_inter_nation_inf_desc:0 "Щоб союз дійсно розквітнув, ми маємо поліпшити інфраструктуру на спільних кордонах, сприяючи транскордонній торгівлі."

tbh_enlargen_tbh_mission:0 "Розширити місію до Лоун Стару"
tbh_enlargen_tbh_mission_desc:0 "Завдяки політичному впливу ми можемо розширити військову місію до Лоун Стару, надіслану [TBH.GetNameDef]. Це значно примножить наші військові знання!"

tbh_enlargen_lns_mission:0 "Розширити місію до [TBH.GetNameDef]"
tbh_enlargen_lns_mission_desc:0 "Якщо ми витратимо певні політичні ресурси, зможемо надіслати більшу делегацію до [TBH.GetNameDef], сприяючи подальшому розвитку їхньої промисловості."

tbh_adopt_texan_dollar:0 "Випустити техаський долар"
tbh_adopt_texan_dollar_desc: "Щоб стимулювати торгівлю між державами всередині Техаського Економічного Союзу, було вирішено запровадити Техаський долар. Дійсно смілива ідея."

tbh_focus_on_new_research:0 "Зосередитися на нових дослідженнях"
tbh_focus_on_new_research_desc:0 "Одна з місій економічного союзу – розширювати межі можливого. Найкращий шлях до цього – розвиток нових технологій!"

tbh_restore_texas_uni:0 "Відновити Техаський університет"
tbh_restore_texas_uni_desc:0 "Колись потужний осередок науки та досліджень, кампус Техаського університету нині в руїнах. Та з належною турботою ми зможемо повернути йому академічну славу – і здобути чимало переваг."

tbh_share_tech_development:0 "Обмін технологічними розробками"
tbh_share_tech_development_desc: "Техаський Економічний Союз міг би досягти нових висот могутності, якби технології розподілялися між його членами порівну."

tbh_form_central_bank:0 "Заснувати Центральний банк Техасу"
tbh_form_central_bank_desc:0 "Щоб забезпечити стабільність валюти та її забезпечення золотом, ми заснуємо центральний банк. Це значно зміцнить Економічний союз."

tbh_enhance_civilian_commerce:0 "Посилити цивільну торгівлю"
tbh_enhance_civilian_commerce_desc:0 "Громадянський сектор як у нас, так і в союзників може розвиватися краще. За правильних стимулів ми зможемо посилити цивільну економіку."

tbh_joint_resource_campaigns:0 "Спільні кампанії з видобутку ресурсів"
tbh_joint_resource_campaigns_desc:0 "На територіях усіх учасників союзу залишилось багато нерозвіданих ресурсів. Координована ініціатива принесе вигоду кожному."

tbh_unified_doctrine_research:0 "Уніфіковане дослідження доктрин"
tbh_unified_doctrine_research_desc:0 "Обмінюючись військовими знаннями з державами Економічного союзу, ми всі здобудемо нові переваги."

tbh_union_economic_boom:0 "Економічний бум Союзу"
tbh_union_economic_boom_desc:0 "Завдяки рокам процвітання, єдності та співпраці, економіки країн-членів Техаського економічного союзу переживають справжній бум. Слава!"

tbh_enlargen_tbh_mission_basic_drills:0 "Програми швидкої підготовки"
tbh_enlargen_tbh_mission_basic_drills_desc:0 "Місія радників до Лоун Стару виявилась надзвичайно успішною: наші офіцери виявили кілька недоліків у їхній системі підготовки. Подальше наставництво дозволить покращити обороноздатність."

tbh_enlargen_tbh_mission_advanced_drills:0 "Програми розширеної підготовки"
tbh_enlargen_tbh_mission_advanced_drills_desc:0 "Наші військові радники вже поділились багатьма корисними знаннями, але також виявили шляхи для покращення злагодженості підрозділів і тактичної підготовки. За певного часу їх можна впровадити."

tbh_enlargen_tbh_mission_rangers_for_lonestar:0 "Рейнджери для Лоун Стару"
tbh_enlargen_tbh_mission_rangers_for_lonestar_desc:0 "Розширення місії до Лоун Стару включаючи досвідчених офіцерів і законників, окрім наявних солдатів, дозволить проводити навчання командного складу та підтримувати громадський порядок – акт доброї волі."

tbh_nf_mobilization:0 "Обмежене заступництво"
tbh_nf_mobilization_desc:0 "Заступники відіграють свою роль, але краще мати кількох добре навчених, ніж натовп недосвідчених. Почнемо з малого і поступово розширюватимем програму."

tbh_nf_mobilization_2:0 "Повсюдне заступництво"
tbh_nf_mobilization_2_desc:0 "Ефективність наших заступників дозволяє дещо розширити програму добровільного набору."

tbh_nf_mobilization_3:0 "Розширене заступництво"
tbh_nf_mobilization_3_desc:0 "Завдяки збільшенню людських ресурсів ми можемо масштабувати програму. Наявність заступників на кожному розі зміцнить довіру до нас і залучить нових добровольців."

tbh_nf_mobilization_4:0 "Загальне заступництво"
tbh_nf_mobilization_4_desc:0 "Останнє розширення програми забезпечить нам перевагу як на фронті, так і в тилу. Справді безпечне суспільство – це озброєне суспільство. І якщо в кожного є зброя – ніхто не почувається беззахисним."

tbh_nf_occupation_theory:0 "Закон – це мій газон"
tbh_nf_occupation_theory_desc:0 "Тримайся на своєму боці паркану..."

tbh_nf_occupation_theory_2:0 "Газон – це мій закон"
tbh_nf_occupation_theory_2_desc:0 "...А я триматимусь свого."

tbh_nf_adventurer_extraordinare:0 "Далекі дороги"
tbh_nf_adventurer_extraordinare_desc:0 "§YОдна людина здатна змінити світ...§!"

tbh_nf_adventurer_extraordinare_2:0 "Всі ведуть додому"
tbh_nf_adventurer_extraordinare_2_desc:0 "Іноді найбільший дар – це м’яке ліжко наприкінці шляху."

tbh_enlargen_lns_mission_metal:0 "Що дала земля"
tbh_enlargen_lns_mission_metal_desc:0 "Надра дарують нам цінні метали – критично важливі для інфраструктури та розвитку. Немає сенсу тримати це лише для себе – ми отримаємо значно більше, поділившись цим із союзниками."

tbh_enlargen_lns_mission_water:0 "Що принесли ріки"
tbh_enlargen_lns_mission_water_desc:0 "Вода – джерело життя, і хоча нам пощастило з її кількістю, не всім так щастить. Забезпечивши союзників чистою водою, ми лише зміцнимо співпрацю між нами."

tbh_enlargen_lns_mission_advanced:0 "Тепер і назавжди"
tbh_enlargen_lns_mission_advanced_desc:0 "Високотехнологічний хлам також відіграє важливу роль у наших економіках. Хоча він набагато рідкісніший, такі ресурси як електроніка критично важливі для виробництва."

tbh_nf_development_3:0 "Фабрики в Далласі"
tbh_nf_development_3_desc:0 "Фабрики Далласа – основа нашого економічного зростання, стрижень внутрішнього виробництва. Розширення виробничих потужностей приверне нову робочу силу, ще більше зміцнюючи місто."

tbh_nf_development_4:0 "Кузні Форт-Гуда"
tbh_nf_development_4_desc:0 "Наші зброярі в Форт-Гуді – справжні майстри у виробництві якісних матеріалів. Додаткова підтримка – як ресурсна, так і кадрова – підвищить ефективність їхньої роботи."

tbh_nf_broken_apart:0 "Розкол"
tbh_nf_broken_apart_desc:0 "Глава з Аламо вийшла з-під нашого контролю, спричинивши глибоку кризу у військових структурах. Потрібно терміново знайти рішення."

tbh_nf_things_that_make:0 "Кращі майстерні"
tbh_nf_things_that_make_desc:0 "Наші заводи працюють досить добре, але завжди є куди рости. Декілька самопроголошених “економістів” запропонували цікаві ідеї щодо підвищення виробничої потужності."

tbh_nf_things_that_go_boom:0 "Спустошення вибухівкою"
tbh_nf_things_that_go_boom_desc:0 "Звіти з фронту свідчать про ефективність саперних підрозділів. Розширення нашого вибухотехнічного потенціалу може стати запорукою перемоги."

tbh_nf_things_that_spit_lead:0 "Шалені вогневі групи"
tbh_nf_things_that_spit_lead_desc:0 "Експериментальні вогневі команди показали обнадійливі результати. Це заслуговує на подальше фінансування."

tbh_nf_things_that_protect:0 "Серце нашого корпусу"
tbh_nf_things_that_protect_desc:0 "Ядро армії Братства – це його елітні воїни. Навіть із розширенням нашої території їхнє значення незмінне. Не можна про них забути – інакше ми станемо звичайною армією."

tbh_nf_desperado_no_more:0 "Десперадо – більше ні"
tbh_nf_desperado_no_more_desc:0 "Рейдери зі сходу постійно дошкуляють нам. Швидка військова операція усуне їхніх ватажків і поверне народ під нашу охорону."

tbh_nf_desperado_for_law:0 "Десперадо Закону"
tbh_nf_desperado_for_law_desc:0 "Після того, як Дикого було приборкано, настав час повної інтеграції його колишніх земель."

tbh_nf_of_gators_and_maws:0 "Про гаторів і пащі"
tbh_nf_of_gators_and_maws_desc:0 "Рейди Гаторпащів зайшли надто далеко. Їхні напади на торгівлю річками вже забрали занадто багато життів. Їхнє знищення – це шанс на відновлення миру для наших купців."

tbh_nf_taming_the_jungle:0 "Приручення джунглів"
tbh_nf_taming_the_jungle_desc:0 "Після перемоги над Гаторпащами ми можемо почати освоєння їхніх джунглів. Люди вітатимуть нашу присутність, хоча дехто з місцевих тварюк – не дуже."

tbh_nf_assasin_city_rumble:0 "Сутичка з ролерблейдерами"
tbh_nf_assasin_city_rumble_desc:0 "Ці психи з Міста Асасинів останнім часом нападають на наші патрулі. Час відновити порядок у цьому занедбаному місці."

tbh_nf_the_question_of_carthage:0 "Карфагенське питання"
tbh_nf_the_question_of_carthage_desc:0 "Непередбачувана поведінка Шефа змушує нас діяти. Ми мусимо знайти шлях до стабільності – будь-якою ціною."

tbh_nf_approach_the_patrolmen:0 "Від одного патруля до іншого"
tbh_nf_approach_the_patrolmen_desc:0 "Патрульні вже давно – хоч і неформальні – союзники у боротьбі з рейдерами. Офіційна угода може принести обом сторонам значно більше вигоди."

tbh_davy_crocket_adventures_tt:0 "Відкриває спеціальні рішення, пов’язані з пригодами видатного персонажа."

complete_when_alamo_is_there:0 "Цей фокус автоматично завершиться, коли відбудеться розкол і з'явиться відокремлена фракція."

tbh_adress_alamo_chapter_tt:0 "Відкриває дії для зменшення наслідків вигнання колишніх братів."

tbh_nf_we_have_been_betrayed:0 "Нас зрадили"
tbh_nf_we_have_been_betrayed_desc:0 "Попри всі обіцянки, здається, нашим союзникам усе було байдуже..."

tbh_nf_our_future:0 "Наше майбутнє"
tbh_nf_our_future_desc:0 "Після всіх цьогорічних потрясінь час переосмислити свої цілі та поглянути вперед."

tbh_nf_steady_as_she_goes_texas:0 "Стійко вперед"
tbh_nf_steady_as_she_goes_texas_desc:0 "Ми досі захисники Техасу – незалежно від того, чи інші це визнають. Ми виконаємо свій обов’язок, попри біль, який це принесе."

tbh_nf_fortress_texas:0 "Фортеця Техас"
tbh_nf_fortress_texas_desc:0 "Безпечний Техас – це захищений Техас. Потужні укріплення стануть щитом проти будь-яких зовнішніх загроз."

tbh_nf_texas_our_dreams_and_hopes:0 "Наші мрії й надії"
tbh_nf_texas_our_dreams_and_hopes_desc:0 "Час реалізувати найвищі прагнення. Техас буде єдиним – незважаючи на всі голоси, що кажуть протилежне."

tbh_nf_the_alamo_was_right:0 "Аламо мав рацію"
tbh_nf_the_alamo_was_right_desc:0 "Як би боляче це не визнавати, Глава з Аламо мала слушність. Виконання їхніх вимог – найкращий шлях уперед."

tbh_nf_to_hell_with_texas:0 "До біса Техас"
tbh_nf_to_hell_with_texas_desc:0 "Ця експедиція обернулася майже суцільною катастрофою. Але ми все одно врятуємо Техас – навіть якщо доведеться спалити його дотла!"

tbh_nf_fortress_brotherhood:0 "Фортеця Братства"
tbh_nf_fortress_brotherhood_desc:0 "Уроки з поля бою навчили нас одного: єдина надійна опора – це Лицар поруч із тобою."

tbh_nf_texas_old_world_blues:0 "Старосвітній смуток"
tbh_nf_texas_old_world_blues_desc:0 "§YДе любов – там і біль...§!"

tbh_nf_lonestar_exodus:0 "Вихід Лоун Стару"
tbh_nf_lonestar_exodus_desc:0 "Багато мешканців Лоун Стару втекли від навали Банди Руки. Дамо їм шанс повернутися – і боронити рідне. Призовні пункти відкрито. Реєструйся. Поверни Лоун Стар."

tbh_nf_lonestar_reconquest:0 "Відвоювання Лоун Стару"
tbh_nf_lonestar_reconquest_desc:0 "Ми готові. Час настав. Повернемо Лоун Стар."

tbh_nf_restore_the_lone_star:0 "Відновити Лоун Стар"
tbh_nf_restore_the_lone_star_desc:0 "Контролюючи цю територію, ми можемо повернути наших союзників до минулої слави. Хай живе Економічний союз – хай почнеться нова епоха для Техасу!"

tbh_lns_restauration:0 "§GЦей фокус відновить Лоун Стар як суверенного члена Техаського економічного союзу (ТЕС), що також означає спільне формування об’єднаного Техасу разом із Братством.§!"