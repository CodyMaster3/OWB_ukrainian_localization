l_english:
nf_tbh.1.t:0 "Переслідування"
nf_tbh.1.desc:0 "Справжня історія Техаського Братства почалася з новин про піднесення Аттіса та його армії – відкололої групи супермутантів, одержимих продовженням справи Творця. Стривожені цим, частина Братства відокремилася, розпочавши виснажливе, довге переслідування з єдиною метою – знищити ворога до того, як той втілить свої жахливі задуми. \n\nРомбус, очільник експедиції, мав зібрати сили для важкого походу вперед, і тому він..."
nf_tbh.1.a:0 "...зібрав загін лицарів."
nf_tbh.1.b:0 "...взяв із собою збалансований загін."
nf_tbh.1.c:0 "...узяв із собою родини своїх вояків."
nf_tbh.1.d:0 "...подорожував лише з кількома ветеранами-паладинами."

nf_tbh.2.t:0 "Зустріч з Національною Гвардією Техасу"
nf_tbh.2.desc:0 "Під час своєї мандрівки землями, загін Ромбуса дедалі зростав. Чутки про героїчну місію та надія на кінець загрози супермутантів спонукали багатьох приєднатися до експедиції. \n\nУ самому Техасі вони зустріли залишки Національної гвардії. Дізнавшись про мету Ромбуса, вони запропонували свою допомогу, щоб покласти край безумству Аттіса. Ромбус знав, що його люди ставляться з підозрою до новачків і не приймуть їх легко. Він вирішив..."
nf_tbh.2.a:0 "Інтегрувати їх до війська."
nf_tbh.2.b:0 "Прийняти їх як цивільних під своїм наглядом."
nf_tbh.2.c:0 "Надати їм звання лицаря й призначити на технічне обслуговування."
nf_tbh.2.d:0 "Відмовити їм, вигнавши в Пустку."

nf_tbh.3.t:0 "Раннер, гуль-рейнджер"
nf_tbh.3.d:0 "Коли Братство прибуло до Техасу й почало готуватись до бою, воно натрапило на незвичну групу, що звалася 'Техаськими рейнджерами'. Їх очолював гуль на ім'я 'Ледрок Раннер'. \n\n'Ледрок' представився останнім нащадком довоєнних техаських рейнджерів, який прагне зберегти порядок у рідному краї. Його жахнуло те, що Аттіс вчинив на його території. Він хотів приєднатися до експедиції й загнати мутанта під землю."
nf_tbh.3.a:0 "Звісно, Ромбус прийняв його пропозицію."

nf_tbh.4.t:0 "Доля Ромбуса"
nf_tbh.4.d:0 "Битва, яка відбулась, коли експедиція нарешті дісталася армії Аттіса, стала справжньою легендою. Досі точаться дикі байки про ті події. \n\nКажуть, що найсильніші паладини Братства билися з велетнями у смертельних двобоях, а тисячі лицарів виплеснули праведний гнів на боягузливих мутантів, зламавши їхній дух на десятиліття. \n\nТа серед усіх розповідей, найшаленішими є ті, що стосуються долі самого Ромбуса. А правда ж..."
nf_tbh.4.a:0 "На щастя, він купив ферму й доживає спокійні дні."
nf_tbh.4.b:0 "На жаль, він 'купив ферму' під час бою."  # каламбур з англійським "bought the farm"

nf_tbh.5.t:0 "Встановити контакт з Тюбоголовими"
nf_tbh.5.d:0 "Тюбоголові – надзвичайно дивна група. Їх, схоже, цікавить лише одне: трансляція їх шоу і розваги для народу Техасу. Ми вже зустріли цього... 'Містера Ентертеймент' і довго обговорювали, що потрібно для того, щоб вони приєдналися до нас. Договір про захист, доступ до нашої промисловості й ексклюзивні права на трансляцію мають стати достатньою мотивацією. Зрештою, чому б їм було відмовлятися?"
nf_tbh.5.a:0 "Надіслати пропозицію."

nf_tbh.51.t:0 "Кінець ефіру?"
nf_tbh.51.d:0 "Техаське Братство раптом надіслало нам ультиматум. Вони вважають це простою пропозицією, та ми чудово розуміємо, що вона означає – 'або, або'. Їх умови прості: приєднуйтеся до них, отримаєте захист, населення матиме доступ до трансляції, а ви – ексклюзивні права. \n\nАбо ж відмовтесь – і вас приєднають силою. \n\nСхоже, вибору особливо й немає, так?"
nf_tbh.51.a:0 "Що ж... а де там ручка?"
nf_tbh.51.b:0 "Ми не дозволимо закувати наше шоу в кайдани!"

nf_tbh.52.t:0 "Техаський Спешл!"
nf_tbh.52.d:0 "Очікувано, Тюбоголові прийняли щедру трансляційну угоду й підписали її. Тепер, коли вони з нами, наші громадяни матимуть доступ до їхнього, скажемо чесно, доволі цікавого шоу. \n\nСподіваймося, це стане початком техаської телеіндустрії й індустрії розваг."
nf_tbh.52.a:0 "Абсолютно чудово!"

nf_tbh.53.t:0 "Зловісний план?"
nf_tbh.53.d:0 "Тюбоголові... відмовилися? Чому? Це абсолютно незрозуміло! Вони мали все, щоб виграти, і нічого не втратити! Якщо тільки... у них є інші плани? Так, ось воно – іншого пояснення немає! \n\nЄдина причина відмовитись від такої щедрої угоди – це те, що вони щось замишляють і намагаються приховати це від пильного ока Техаського Братства! \n\nПотрібно діяти негайно!"
nf_tbh.53.a:0 "Я знав, що цей 'Містер Ентертеймент' щось приховує!"

nf_tbh.7.t:0 "Велике Бугалу?"
nf_tbh.7.d:0 "До нас дійшли чутки, що Техаське Братство має намір остаточно покінчити з Ролергерлз. Відтоді як ця люта команда струнких, злих машин для вбивства була вигнана з їхнього стадіону в Далласі, вони затаїли на Братство злість – і отримали у відповідь не меншу. Війна, звісно, стала б цікавою темою для новин з фронту, але, чесно кажучи, було б краще не втрачати глядачів у перестрілках. Може, варто укласти угоду?"
nf_tbh.7.a:0 "Менше смертей – більше розваг!"
nf_tbh.7.b:0 "Власне, війна теж була б видовищною..."

nf_tbh.71.t:0 "Повернення до Далласу?"
nf_tbh.71.d:0 "Містер Ентертеймент, яким би дивним він не був, підійшов до нас із пропозицією. За його словами, Братство втомилося від наших нальотів і всерйоз розглядало війну. Коли Таффі спитала, чому він, будучи їхнім мовником, нас попереджає, той лише відповів: 'мені подобається ваш стиль'. \n\nЗа умовами угоди ми припиняємо рейди та приєднуємось до Техаського економічного союзу, але натомість знову отримуємо контроль над Стадіоном у Далласі й зможемо транслювати наші матчі в прямому ефірі!"
nf_tbh.71.a:0 "Прямий ефір, кажеш?"
nf_tbh.71.b:0 "Хотілося б побачити, як Братство спробує!"

nf_tbh.72.t:0 "Вельми дивна подія"
nf_tbh.72.d:0 "Схоже, поки наше командування активно планувало вторгнення й подальше 'умиротворення' Ролергерлз та їхніх земель, Містер Ентертеймент просто... прийшов до їхньої столиці й поговорив з ними? \n\nСпочатку ми були стривожені, але тепер він повернувся з новиною: усе, чого хочуть Ролергерлз, щоб припинити рейди – це доступ до стадіону в Далласі. Нібито для якихось там їхніх 'матчів'. Вищому командуванню це не надто сподобалося."
nf_tbh.72.a:0 "Це було, гм... занадто легко?"

nf_tbh.73.t:0 "Втрачена нагода, заряджені дробовики"
nf_tbh.73.d:0 "Поки командування ретельно готувалося до війни з Ролергерлз, Містер Ентертеймент знову ж таки просто прийшов до їхньої столиці й спробував домовитись. \n\nВін вийшов так само швидко, а на допиті зізнався, що хотів укласти угоду. На жаль, вона зірвалася. Якщо навіть харизма Містера Ентертеймент не подіяла – ці рейдери ще гірші, ніж ми думали."
nf_tbh.73.a:0 "Панове, збір у воєнній залі о п’ятнадцятій?"

nf_tbh.8.t:0 "Карфагенське питання"
nf_tbh.8.d:0 "Рейдерський загін на ім’я 'Карфаген' був нашою скалкою з часів, коли ми тільки прибули до Техасу. Тепер, коли союз зміцнів, а наші сили готові, час надіслати їм послання. \n\nМи покінчимо з їхніми нальотами раз і назавжди. Усе, що потрібно – чітко заявити свою позицію. Захопити один з їхніх численних загонів і прострелити кожному коліна – має бути достатньо переконливо. \n\nМи більше не терпітимемо їхню присутність."
nf_tbh.8.a:0 "Вони дізнаються, що вогнемети не беруть силову броню!"

nf_tbh.81.t:0 "Кінець техаського суперництва"
nf_tbh.81.d:0 "Схоже, Техаське Братство надіслало нам свій 'ультиматум' у вигляді одного з наших загонів, що повернувся, стікаючи кров’ю, всі солдати з простріленими колінами. Вони більше не мають терпіння до наших рейдів і хочуть завершити це назавжди. \n\nЇхня пропозиція проста: припинити рейди й вступити до союзу – або бути 'умиротвореними'. \n\nМоже, їх і більше, але ми дамо їм бій, який вони запам’ятають."
nf_tbh.81.a:0 "Може, варто прийняти... я, взагалі-то, свої коліна люблю"
nf_tbh.81.b:0 "Бій, що запам’ятається? Напишемо історію!"

nf_tbh.82.t:0 "Carthago servanda est"
nf_tbh.82.d:0 "Карфагенці нарешті проявили розум! Вони готові приєднатися до союзу й відмовитися від своїх дикунських звичаїв в обмін на нашу співпрацю. Деякі офіцери майже розчаровані таким розвитком подій."
nf_tbh.82.a:0 "Ще буде багато битв – а поки святкуємо."

nf_tbh.83.t:0 "Carthago delenda est!"
nf_tbh.83.d:0 "Ці кляті гремучі змії відмовилися! Зухвало вважають себе чимось більшим, ніж просто перешкода на шляху до процвітання. Що ж, ми й поводитимемося з ними відповідно! Якщо для них цінність має лише сила – покажемо їм силу дробовика з лазерним зарядом на близькій відстані!"
nf_tbh.83.a:0 "Знищити їх!"

nf_tbh.9.t:0 "Контакт з Патрульними"
nf_tbh.9.d:0 "Патрульні зі сходу – довго здавались просто хранителями закону, подібно до нас. Але з часом і після детального аналізу ми виявили всередині їхніх лав глибоку гниль. \n\nБіженці розповідають про грабунки й 'вилучення', про абсурдну 'плату' за захист – і цей перелік можна продовжувати. Ми не дозволимо таким дармоїдам уникнути покарання. \n\nЯкщо вони не підтримують істинний порядок – ми це зробимо!"
nf_tbh.9.a:0 "Надіслати вимоги капітуляції – але тримати дробовики напоготові."

nf_tbh.91.t:0 "Обурлива вимога!"
nf_tbh.91.d:0 "Техаське Братство із заходу, схоже, виявило докази корупції в наших лавах і вирішило одразу вимагати нашої відставки й капітуляції! Ота зграя підлих змій! \n\nМоже, в них і є силова броня та лазерна зброя, але хай їм чорт, ми не віддамо їм свою юрисдикцію так просто!"
nf_tbh.91.a:0 "Взагалі-то, я за три дні на пенсію, тож е-е..."
nf_tbh.91.b:0 "Підняти всі підрозділи, готуйте барикади!"

nf_tbh.92.t:0 "Ще одна юрисдикція"
nf_tbh.92.d:0 "Патрульні визнали правдивість наших слів і вирішили скласти повноваження захисників своєї території. Тепер, коли ми контролюємо ці землі, ми зможемо забезпечити там справжній правопорядок і виконати роботу, якої вони так і не зробили. \n\nПід нашим керівництвом ця область стане взірцем безпеки й стабільності!"
nf_tbh.92.a:0 "Ще одна вдало виконана справа."

nf_tbh.93.t:0 "Примусове роззброєння"
nf_tbh.93.d:0 "Замість того, щоб мирно передати свою юрисдикцію, як личить справжнім слугам закону, Патрульні озброїлися та почали будувати барикади! \n\nПопри те, що вони називали себе захисниками, вони миттєво перетворились на звичайнісіньких рейдерів. Та навіть так – вони не зрівняються з нашими силами. Ми захопимо їхні землі силою!"
nf_tbh.93.a:0 "Техас – земля свободи"

nf_tbh.25.t:0 "Критична межа"
nf_tbh.25.d:0 "Наші постійні зусилля допомагати Лоун Стару в обмін на економічну підтримку викликали обурення великої відкололої групи всередині Братства. Назвавшись 'Главою з Аламо' та закріпившись на історичній території Аламо, вони складаються з багатьох високопосадовців, які вважають, що ми надто відхилилися від нашої початкової мети. \n\nВони прагнуть повернення до традицій і встановлення зв’язку з іншими осередками Братства для відновлення структури справжніх глав. \n\nЦе нищівний удар по нашій державі..."
nf_tbh.25.a:0 "Усе, що нам залишається – сподіватися на краще..."
nf_tbh.25.b:0 "Вони мають рацію! Братство знову підніметься!"

nf_tbh.26.t:0 "Річмонд – порохова бочка Техасу?"
nf_tbh.26.d:0 "Так звана 'Глава з Аламо' звернулася до нас із пропозицією. Вони хочуть обговорити стратегічне значення Річмонда. Очевидно, ця територія настільки цінна, що вони хочуть забрати її собі! \n\nВони готові щедро заплатити, але й недвозначно дали зрозуміти, що в разі відмови заберуть її силою. \n\nЯк нам відповісти?"
nf_tbh.26.a:0 "Приймаємо – кровопролиття між братами треба уникнути."
nf_tbh.26.b:0 "Укріпити Річмонд! Ми не здамо його зрадникам!"

nf_tbh.323.t:0 "ТАА просить вступити до ТЕС"
nf_tbh.323.d:0 "Ми щойно отримали запит від новачка з Південного Техасу – Тодда Гаубіца – щодо приєднання його фракції до Техаського економічного союзу. Хоча він і не дотримується наших високих ідеалів, він може стати цінним союзником, особливо враховуючи загрози, що насуваються із півдня та заходу. Варто також зазначити: оголосити війну Тодду після офіційного приєднання буде значно складніше."
nf_tbh.323.a:0 "Гаразд, нехай входить."
nf_tbh.323.b:0 "Ми ніколи не відмовимось від своїх прав на Техас!"

