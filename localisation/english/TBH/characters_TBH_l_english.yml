# Brotherhood
TBH_EDWARD_RUSK_NAME: "Едвард Джефферсон Раск"
TBH_EDWARD_RUSK_DESC: "Старійшина Техаського Братства зі стажем, Раск – це справжнє лихо для будь-якої наволочі, що ще блукає техаською Пусткою. Стриманий, непохитний і завжди з сигарою в зубах, він роками розчищав шлях для Братства. Його посивіле волосся – свідчення віку: він ще застав створення Техаського економічного союзу, будучи його головним лобістом з боку Братства. Харизматичний та улюбленець бійців, він часто проводить вечори за бурбоном у компанії своїх солдатів. Носить десятилітровий капелюх і має особисту двоствольну рушницю з відкидним механізмом, спеціально переобладнану під використання £white_dot ЕКП замість звичайних набоїв. Ця грізна зброя була створена для знищення найнебезпечніших супермутантів, яких тільки може викинути Техас, і її потужність цілком підтверджує це."

