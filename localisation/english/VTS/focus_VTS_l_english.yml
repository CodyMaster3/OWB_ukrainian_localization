# події

nf_vts.1.t: "Сховище 37"
nf_vts.1.d: "Бродяги, безсоромні та нестерпні. Vault-Tec продала їм мрію. Мрію, де вони могли б насолоджуватися життям, якого завжди бажали. Світ, де всі їхні примхи стають можливими завдяки найсучаснішій автоматизації. Ніхто не буде над ними владарювати, немає суспільства, яке судить їх. Та вони не довго чекали, щоб зрозуміти, що їм не вистачає чогось у душі. \n\n"Краще Життя Під Землею" — ось що вони сказали мешканцям. Звісно, бути в Сховищі було краще, ніж зовні, але з кожним днем щось почало точити душі мешканців зсередини. Вони мали всі свої потреби, але не мали ні прагнень, ні радості, ні сенсу. Одного дня, один мешканець, через примусу або невідомий каприз, жорстоко накинувся на іншого мешканця з дияволічною посмішкою. І пекло відкрилося. \n\nНезважаючи на гарантії отримання всіх їхніх примх, що вони можуть мати, захоплення від насильства було єдиним, чого Сховище не могло надати. Як маленькі бійки переросли в перестрілки, один з науковців, що обслуговував основний ЗАКС, був викрадений. Це активувало захисні механізми, встановлені науковцями, і було введено військовий стан. Наглядач Т.О.М.А.С. взяв на себе управління, і те, як він вирішив розібратися з насильством, визначить долю Сховища 37."
nf_vts.1.a: "Він призначив кількох обраних елітних охоронців."
nf_vts.1.b: "Він поставив насильників на роботу."
nf_vts.1.c: "Він використовував насильників для стрільби по мішенях."

nf_vts.2.t: "Робін Гуд свого Часу"
nf_vts.2.d: "Чутки про тиранію Наглядача швидко поширились по Дакоті, і ось уже не минуло багато часу, як прийшов чоловік благородного роду. \n\nЙого звали Майстер Ян, але для тих, хто слідував його наказам, він був Братом. Великий Магістр залишків Наглядників Натанаїла, одного з благородних рицарських орденів, що колись служили під керівництвом Лейфа Йорктона з Ланґенбурґа. Його обітниця, складена багато років тому, була привести всіх до вчення Христа, незалежно від того, хто це — людина, звір чи машина. \n\nТа все ж, хоч і божевільний, він найбільше захоплювався пригнобленими. Якщо чоловік може вижити на рештках і все одно вірити в Бога, то чи не є він людиною в раю? Чоловік, настільки впевнений у своєму місці на Небесах, що жодна земна бідність не може його зворушити? Такі речі надихали Яна, і він прагнув створити рівність у всьому: тому він прийшов, забираючи те, що багаті не використовували, і приносячи це вірним серед бідних. Адже хіба Бог не хоче, щоб його діти відчували мир на Землі? \n\nІ ось, після вигнання Рицарів, він виявився мандруючим по Дакотах разом з рештками ордену, коли почув великі історії про роботизованого наглядача в дивному маленькому Сховищі біля Червоної річки..."
nf_vts.2.a: "Його серце було чесне, і тому він їхав швидко."
nf_vts.2.b: "Він взяв своїх найкращих з собою."
nf_vts.2.c: "Друзі, яких він здобув у своїх подорожах, забезпечували його."

nf_vts.3.t: "Спогади про Лешого"
nf_vts.3.d: "Звір з Саскачевану — велика гадюка на ім’я Леший. Довго вона лякала різні міста-держави та мікроспільноти півночі, і довго залишалася в полі зору Брата Яна. Він умів приручити будь-яку істоту, вбивати будь-якого монстра, все це в ім’я Бога та Батьківщини, але вона ухилялася від нього. \n\nАле він намагався. \n\nЯкось він знайшов її притулок. Він прокрався туди під покривом ночі, повільно просуваючись через її маленькі схованки та тунелі, які вона створила давно, поки не знайшов її. \n\nВона відпочивала — звиваючись і перебуваючи в найтеплішій частині печери, яку він знайшов. Він не був тим, хто вбиває слабку істоту, чи б'ється без слів, тому він підкинув камінчик до її морди. Коли вона прокинулась, їхні погляди зустрілися, і настала тиша. Деякий час вони говорили про життя і його значення, що дуже розважало Лешого. Три години вони розмовляли, як старі друзі, а на четвертій годині, коли він вважав, що час діяти, вони почали бій, який вона завершила, вдаривши його хвостом і відірвавши йому руку. "Нехай твоє маленьке королівство замінить це, Рицарю," — вона плюнула і залишила його повзти з печери самотньо. \n\nХоча цей досвід принизив його, він відчував лише повагу до цієї істоти. Вона ставилася до нього з повагою і залишила йому життя. Його нова рука, протез, виготовлений майстрами з Дандурна, ніколи не служила йому так добре, залишаючи постійну нагадування про ту фатальну ніч."
nf_vts.3.a: "Можливо, йому не слід було кидати виклик титанам у шахи."
nf_vts.3.b: "Можливо, наступного разу йому слід було вдарити раніше."
nf_vts.3.c: "Можливо, вибір має менше значення, ніж результат."

nf_vts.4.t: "Спогади про Ланґенбурґ"
nf_vts.4.d: "Хто може забути чудеса Манітоби? Напевно не він, адже, хоч і мало часу він провів у цивілізації, він знаходив велике задоволення від прогулянок серед людей і спостереження за ними такими, якими вони були. Якщо він мав служити Богу і Батьківщині, то він повинен був бути людиною, яка може стояти поруч з іншою людиною і не відчувати себе чужим, чи то звіролов, чи ні. \n\nЗ усіх речей, які він пам’ятав про Ланґенбурґ, те, чого йому найбільше бракувало, було..."
nf_vts.4.a: "Його щеня, Губерт..."
nf_vts.4.b: "Його кохана..."
nf_vts.4.c: "Справжній Король, Лейф Йорктон!"

nf_vts.5.t: "Доля Сховища 37, як її визначив Брат Ян"
nf_vts.5.d: "Мешканці Сховища 37 не дивилися на Наглядників Натанаїла з радістю, але вони все ж визнавали їх спасителями. Тим не менше, Ян розумів, що потрібно щось зробити — адже історія Сховища була сповнена насильства та божевілля. Навіть після того, як Наглядач пішов, чи здатні люди насправді на спокуту в очах Господа, чи вони є єретиками, яких потрібно усунути?"
nf_vts.5.a: "Ми — охоронці наших братів."
nf_vts.5.b: "Вони діють без Бога в серці."

nf_vts.6.t: "Мир?"
nf_vts.6.d: "Все закінчилося, Король Щурів був переможений, і його численні піддані почнуть розбігатися в його відсутність. Сховище 37 позбулося загрози інсектів. Проте з кінцем однієї битви почалася інша. І Т.О.М.А.С., і Брат Ян давно чекали можливості повернутися один проти одного, і тепер, коли сили обох були на полі і пошкоджені після війни, кожен зробив свій хід. Переможе та сторона, яка витратила менше сил у боротьбі з натиском радроахів, і це була:"
nf_vts.6.a: "Роботи"
nf_vts.6.b: "Рицарі"

nf_vts.61.t: "Тріумф Машини"
nf_vts.61.d: "Це був час кризи для Сховища 37 і його вічного Наглядача між внутрішніми сутичками, прибуттям рицарських головорізів та Війною Щурів, але цей час відкрив очі Наглядача на багато можливостей. Перше, що було зроблено — це перемога над щурами, і Т.О.М.А.С. швидко підрахував, що Брат Ян і його попутники зазнали великих втрат у битві з інсектами, занадто великих, щоб витримати раптовий напад. Не було сумнівів, що цей чоловік є загрозою і не справжнім другом Сховища. Його потрібно було усунути. Коротко роботизовані сили безпеки опустили свої зброї після битви, але тільки для того, щоб переробити свої параметри націлювання.\n\nБожевільний рицар навіть не встиг зібрати своїх людей або махнути мечем, як лазери та плазма вразили його з усіх боків. Він впав, опіканий та частково розплавлений, на землю, а його люди зустріли подібну долю, їхні смерті були значно швидшими, ніж у лідера. Ян залишався там деякий час, не в змозі піднятися або зробити більше, ніж слухати останні крики своїх товаришів. У відповідь на цей жах із тіла впав голос поваленого рицаря, не в запереченні чи смутку, а з божевільним сміхом, поки його життя гасло. Коли стало тихо, його голос потихеньку згас, останній сміх помер на його губах, залишивши лише широку посмішку перед тим, як він пішов зі своїми людьми в смерть."
nf_vts.61.a: "Сховище 37 в безпеці!"

nf_vts.62.t: "Тріумф Людини"
nf_vts.62.d: "Більша частина роботизованої оборонної сили Сховища 37 була знищена під час війни з Королем Щурів; їх проводи були обгризені, впускні та випускні отвори забиті плоттю щурів, а схеми та сенсори перегрівалися в бою. Брат Ян прийняв швидке рішення перед обрушеним на нього металом та уламками, кидаючись назад до Сховища без затримки. Двері ще не були замкнені проти нього, і безпека була погано оснащена для того, щоб зробити більше, ніж сповільнити його. Мешканці стояли осторонь від шляху рицаря, а лише кілька роботів і турелей прирекли себе на смерть, чинячи опір.\n\nДо консолі ЗАКС підійшов Брат Ян, ігноруючи десятки сигналів тривоги та наказів через гучномовці зупинитися, і вдарив своїм мечем по суперкомп'ютеру. Зіскочили іскри і зловісні шуми, але це ще не було все; потрібно було ще кілька влучних ударів, щоб Наглядач Т.О.М.А.С. потемнів, і незабаром усе занурилося в тишу і темряву."
nf_vts.62.a: "Нехай буде воля Божа"

nf_vts.7.t: "Жахливий Ритм"
nf_vts.7.d: "З падінням таємничого Короля Щурів, Наглядач Сховища 37 почав надсилати загони на навколишні землі. Загін роботів-розумників патрулює дороги вночі, допитуючи та викрадаючи перехожих для «перепідготовки» в тій жахливій ямі в землі. Без сумніву, вони розширюють свої щупальці для розширення їхнього жорстокого «захисного» режиму."
nf_vts.7.a: "Нам варто підготуватися."

nf_vts.8.t: "Конкурс поглядів"
nf_vts.8.d: "Ян прибув до Сховища зі своїми людьми, будучи впевненим, що цей день принесе героїчні подвиги. Однак він помилявся, оскільки швидко стало зрозуміло навіть найбільш завзятим рицарям у його загоні, що їм бракує ні сил, ні вогневої потужності для того, щоб прорватися через похмуре сховище та перемогти його синтетичних захисників. Атака була завершена до того, як почалася, і Ян відвернувся, ведучи своїх людей, щоб розбити табір неподалік. Занадто впертий, щоб залишити спробу без подальших дій, і не бажаючи прийняти ще одну невдалу місію, він вирішив чекати кращої можливості для того, щоб завдати удару по тиранії.\n\nТ.О.М.А.С. спостерігав за рицарями через камери та очі роботизованих розвідників, але після кількох тижнів без жодного конфлікту Наглядач дещо розслабився. Час від часу мешканці, яких дозволяли вийти, спілкувалися з Яном або його рицарями, або спостерігали за ними здалеку, поки охорона не відводила їх назад усередину. Все Сховище, і мешканці, і Наглядач були спраглі до інформації про цих нових дивних прибульців, і тому Т.О.М.А.С. дозволив обміну тривати в обмежених кількостях.\n\nТаким чином, почалася довга гра в конкурс поглядів, в якій обидві сторони чекали, що інша зламається і опустить свою охорону, або покаже свої злісні наміри. Мешканці розглядали Яна як"
nf_vts.8.a: "Дорогоцінного пригодника"
nf_vts.8.b: "Страшного хулігана"
nf_vts.8.c: "Таємницю"

nf_vts.9.t: "Війна Щурів починається"
nf_vts.9.d: "Це почалося, як будь-який інший день; Ян спостерігав за своїми послідовниками, які тренувалися та вправлялися, поки Наглядач Т.О.М.А.С. проводив численні розрахунки для аналізу поведінки. Обидва були перервані тим самим повідомленням: Радроахи наближаються. Не кілька, а справжня хвиля з півночі, що поглинає все на своєму шляху. Король Щурів випустив своїх підданих на війну і на загрози.\n\nСховище було їхньою метою, і не довго чекали, поки перша хвиля не розбилася об оборону. Як роботи, так і турелі були сильно обтяжені, намагаючись тримати достатній вогонь. Хоча це без сумніву була можливість позбутися Наглядача, Брат Ян не вагаючись наказав провести атаку для того, щоб зняти облогу зі Сховища. Коли пил осів і останні щури розбіглися, щоб перегрупуватися, лідер рицарів був підходжений робобрейном, що несе запрошення увійти в Сховище 37 і обговорити наступні кроки.\n\nДо кінця ночі було укладено угоду; Король Щурів має впасти."
nf_vts.9.a: "Странні союзники"

nf_vts.10.t: "Яку технологію Vault слід відтворити"
nf_vts.10.d: "Ми помітили три важливі особливості Сховищ, які можуть бути корисними в інших місцях.\n\nОсобливості ізоляції Сховища надають основу для нових способів захисту наших домівок, як старих, так і нових. Наші солдати повинні будуть постійно тренуватися в методиках та обладнанні, не кажучи вже про всі ці роботи з копання та будівництва, але неможливо поставити ціну на безпеку.\nФільтраційні системи важливі під землею, але також можуть знайти застосування на фабриках або в великих житлових проектах навіть на поверхні. Чистіше повітря забезпечить здоров’я наших людей і безпеку генераторів від накопичення пилу.\nГідропонні системи вимагають багато води для роботи, що означає, що нам потрібно буде інвестувати в кращі системи розподілу води. Це самостійно є популярним, звісно, і більше їжі та води приверне до наших кордонів багато жителів пустки.\n\nОднак, на жаль, у нас просто не вистачає ресурсів на даний момент, щоб виправдати інвестиції у створення та розповсюдження всіх трьох. На що ми повинні спрямувати наші зусилля?"
nf_vts.10.a: "Безпека перш за все"
nf_vts.10.b: "Ми будемо дихати чистим повітрям"
nf_vts.10.c: "Їжа та вода завжди важливі"

nf_vts.11.t: "Вбивчий звір"
nf_vts.11.d: "Сер Ян сховався за валуном, меч у руці, і помахав своїм авангарду з довірених рицарів підійти до темної печери на схилі гори. Вони були приведені сюди місцевим ворожбитом на ім’я Джим, до лігва страшного звіра, який, як стверджували, тероризував цей регіон. Ян не міг встояти перед спокусою полювати на такого монстра, чи то вбити його, чи то підкорити, і вирушив одразу після того, як дізнався про його присутність. Він мав намір кинутись вперед, щойно його люди виганять звіра з укриття, але був роззброєний раптовим звуком сміху.\n\nРицар зазирнув через камінь і побачив, як з темряви виходить... кролик? Його люди сміялися, поки він гірко не подивився на Джима поруч. Однак той все ще виглядав наляканим, намагаючись пробурмотіти пояснення, але його слова були перервані, а сміх урвався, коли кролик раптово стрибнув в повітря. Його зуби вчепилися в горло сера Джона, а через мить відрили йому голову. "Вейберн, а потім Йорктон!" — вигукнув Ян з шоком і тривогою, підвівшись на ноги, щоб спробувати допомогти своїм людям.\n\nНаступні кілька митей стали бурею з криками, кров’ю, хутром і літучими внутрішніми органами. Мисливець швидко зреагував, бо його сила швидко танула, Ян озброїв плазмову гранату і кинув цілу пачку їх на звіра. Звук був майже оглушливим, але коли спалах світла згас, він побачив, що з звіра залишилася тільки зелена слиз."
nf_vts.11.a: "Ми більше ніколи не говоримо про це."

  #new foci

VTS_watcher_eye: "Пильне Око"
VTS_watcher_eye_desc: "Наглядач не міг точно сказати, чому вони тут, але тим не менше, він уважно стежив за рицарями."

VTS_too_dang_curious: "Занадто цікавий"
VTS_too_dang_curious_desc: "Занадто багато шепотів, занадто багато розмов про Яна. Наглядач дізнався достатньо, ізоляція буде посилена, а охорона посилена."

VTS_knights_and_war: "Історії про рицарів і війну"
VTS_knights_and_war_desc: "Історії ходили по Сховищу про те, звідки прийшов Ян і чому він пішов."

VTS_monsters_and_serpents: "Історії про монстрів і змій"
VTS_monsters_and_serpents_desc: "Тихі шепоти говорили про Яна і його подорож у лігво звіра."

VTS_the_knights_stand_tall: "Гранд-маніфест брата Яна"
VTS_the_knights_stand_tall_desc: "Ох, дорогі брати і сестри! Злісні та єретичні сили у Сховищі 37 були знищені. День сьогоднішній - наш!"

VTS_muster_the_west: "Збираємо Захід"
VTS_muster_the_west_desc: "Брати, сестри, друзі всіх форм і розмірів, чи не хочете ви світ, позбавлений темряви? Чи не бажаєте ви землі, де жоден монстр не насмілюється ховатися за вашою слабкою плоттю? Я пропоную все це і більше – все, що вам потрібно, це стати поруч зі мною, і доброта та чеснота течуть через вас, як вода через річку."

VTS_arm_the_populace: "Зброяримо населення"
VTS_arm_the_populace_desc: "Що таке людина, якщо вона не має засобів для захисту? Нічого, і тому я зроблю кожного чоловіка вартих свого ваги в пістолетах і мечах!"

VTS_breaking_machines: "Вбивця машин"
VTS_breaking_machines_desc: "Що було комп'ютером, як не ще одним звіром цього світу? Яка наша перемога, якщо не успішне полювання? Шкода, що немає голови, яку можна було б підвісити."

VTS_slaying_men: "Вбивці людей"
VTS_slaying_men_desc: "Шкода, як часто ми змушені піднімати зброю проти наших співлюдей. Проте, щоб утримати поселення під нашим контролем, доводиться час від часу мати справу з бандитами, розбійниками та іншими негідниками."

VTS_slaying_beasts: "Вбивці звірів"
VTS_slaying_beasts_desc: "Одне з наших найважливіших завдань — полювання на дикі й небезпечні звірі, які блукають пусткою. Коли меч і пістолет виявляються недостатніми, іноді нам доводиться покладатися на щось більш потужне для виконання роботи."

VTS_taming_beasts: "Прислів'я 12:27"
VTS_taming_beasts_desc: "Звірі Канади вже схилили голову переді мною. Через цей виправний кордон я приручатиму нове покоління істот! Голова Короля Щурів буде Медузою для мого Геракла, яка змусить їх служити мені."

VTS_our_so_called_hounds: "Наші так звані мисливські собаки"
VTS_our_so_called_hounds_desc: "Скажіть мені, брати і сестри, чи має бути це собакою, щоб бути кровожерливим мисливцем? Я так не думаю, бо якщо істота може відчувати, йти за слідом, то чи не одне це саме?! ЧИ НЕ ОДНЕ ЦЕ?!"

VTS_scrapping_robots_for_repair: "Зламуючи їхні машини"
VTS_scrapping_robots_for_repair_desc: "Металеві чоловіки, які не схилилися перед повною мірою Бога, будуть розірвані на частини, бо їхні розуми викривлені їх безформними душами. Якщо вони не можуть побачити світло Христа, то вони будуть перетворені на леза для наступного покоління віруючих!"

VTS_equipment_repair: "Через пекло ми йшли"
VTS_equipment_repair_desc: "Після падіння Йорктуона ми йшли роками, перш ніж оселитися в цьому регіоні. Наша броня багато постраждала в ці часи, і тільки зараз ми маємо змогу присвятити час ремонту."

VTS_a_rousing_speech: "Звернення брата Яна"
VTS_a_rousing_speech_desc: "Ми повинні відкласти наші турботи, моя паство, і не дивитися на жахи минулих днів, а на майбутнє, яке ми будуємо тут, під землею та над нею."

VTS_much_ado_about_vault_dwellers: "Багато шуму через мешканців Сховища"
VTS_much_ado_about_vault_dwellers_desc: "Хоча вони були не зовсім зручні з нашою відвертістю, вони були вдячні за нашу допомогу. Але що ж робити з ними?"

VTS_the_heretics: "Тимофія 3:15"
VTS_the_heretics_desc: "Перш ніж повернуся, перш ніж подумаю про наступний крок, я повинен повністю розібратися з цією єрессю. Ці так звані «Діти Атома» будуть очищені від своєї лжевіри, і Бог знову пануватиме над Дакотою."

VTS_memories_of_leshy: "Уроки Лешого"
VTS_memories_of_leshy_desc: "Я зустрів її одного разу в тому занедбаному місці. Вона навчила мене уроку, який я ніколи не забуду."

VTS_memories_of_langenburg: "Уроки Ланґенбурґа"
VTS_memories_of_langenburg_desc: "Найбільша трагедія — це мати дім, до якого ніколи не повернешся."

VTS_even_they_have_geniuses: "Левіт 17:13"
VTS_even_they_have_geniuses_desc: "Мудрий чоловік одного разу сказав мені щось, що я ніколи не забуду, частково тому, що багато мудрих чоловіків казатимуть це даремно, намагаючись бути розумними: «Навіть зламаний годинник правильний двічі на день». Залишки Атомітів, конверти, мають багато що запропонувати в знаннях."

VTS_roaming_knights: "Марка 16:15"
VTS_roaming_knights_desc: "Далеко будемо мандрувати, тепер, коли ми знищили все, що можна було здолати в Центральній Дакоті. Логовище наших Спостерігачів потребують нових трофеїв, а слова наших священиків — нових вух. Нехай наші ноги не втомляться від подорожі, особливо коли нас возять моторизовані коні."

VTS_a_land_forsaken_by_god: "Земля, покинута Богом"
VTS_a_land_forsaken_by_god_desc: "Грім і блискавка лунають через статичне зелене небо, ядерний попіл свіжий у повітрі і тепер фарбує мої легені хворобливим зеленим кольором. Я можу лише сподіватися, що наші вчинки тут будуть такими, що приведуть до епохи золотого світла, яка знову заблищить..."

VTS_slaying_the_moon: "Більше не буде кровавих місяців"
VTS_slaying_the_moon_desc: "Земля на заході повна дивних звірів, як ми чуємо, які віщують ночі з кровавим червоним місяцем з регулярною частотою. Замість того, щоб справлятися з цією загрозою, язичники фактично поклоняються цьому страшному знаменню. Якщо вони не діяли, ми переслідуватимемо кожну тварину біля річки Сіу!"

VTS_the_huntsman_stands_tall_again: "Помста Мисливця"
VTS_the_huntsman_stands_tall_again_desc: "Я мав багато імен — мисливець, грандмайстер, брат... Але я завжди буду Яном, і я лише слуга Бога та мого Короля."

VTS_final_act_begins: "Фінальна дія"
VTS_final_act_begins_desc: "Дивний народ, Драматейці. Так захоплені своїми виставами, що не можуть рухатися вперед у реальному світі.\n\nОднак вони не мають злого наміру, тому давайте зведемо до мінімуму це кровопролиття. Сподіваємося, вони швидко здаються."

VTS_the_tools_of_warriors: "Інструменти воїнів"
VTS_the_tools_of_warriors_desc: "Маємо безліч зброї. З бронею, пістолетами, звірами та вірою, ми йдемо вперед безстрашно."

VTS_the_dakota_crusade: "Останній хрестовий похід Дакоти"
VTS_the_dakota_crusade_desc: "Час настав, ці землі заспокоєні, тепер треба вирушити на захід. Там ми зустрінемо нових великих ворогів і стикнемося з ними. Прапор Спостерігачів буде майорити з кожного куточка Дакоти."

VTS_the_tools_of_priests: "Бродячі проповідники"
VTS_the_tools_of_priests_desc: "Наша місія не лише підкорити ворожі племена, але й поширити навчання на всі куточки Дакоти."

VTS_the_watchmen_victorious: "Наше чергування лише починається"
VTS_the_watchmen_victorious_desc: "Я часто, вдома, читав збережені книги, що детально описують подвиги принца Руперта Рейнського. Наші історики кажуть, що його землі колись простягалися аж до наших нових кордонів.\n\nМи зобов’язані, завоювавши ці землі, захищати їх від усіх загроз і лих. Поки останній Спостерігач не впаде, ми присягаємо на це."

VTS_robots_burried_deep: "Роботи, поховані глибоко"
VTS_robots_burried_deep_desc: "Vault-Tec мав запас роботів безпеки для надзвичайних ситуацій. На жаль, перш ніж були активовані протоколи безпеки Наглядача, їх уже розірвали на друзки місцеві жителі заради розваги. Ми не можемо перепрофілювати їх, але можемо вилучити їхні дані для корисної інформації."

VTS_robobrain_studies: "Дослідження робобраїн"
VTS_robobrain_studies_desc: "Робобраїни Сховища 37 складаються з §RREDACTED§! і мають велику кількість знань про зовнішній світ. Незважаючи на свою ненависть до вічного служіння Наглядачеві, вони повністю усвідомлюють, що те життя, яке вони мали, тепер зникло назавжди. Вони не можуть вчиняти жодні дії проти їхнього чи чужого самозбереження, тому вони живуть своїм життям, виконуючи дрібні завдання, які їм дають. Зі збільшенням насильства та новими протоколами Наглядача вони також здобули здатність вчиняти насильство для самозахисту. Наглядач стежить за ними дуже пильно, оскільки підозрює, що колишні §RREDACTED§! готують змову за його спиною, щоб помститися за те, що вони були приречені на вічне служіння."

VTS_fate_of_the_vault: "Доля Сховища 37"
VTS_fate_of_the_vault_desc: "Без активації протоколів безпеки, Сховище 37 було б зруйноване до теперішнього часу. На щастя для нас, бездоганний час Наглядача врятував Сховище від неминучої загибелі. Тепер, коли ми розібралися з зовнішніми факторами, Наглядач знову звернув свою увагу на Сховище, підходячи до висновку."

VTS_tightening_grip_on_control: "Затягнення контролю"
VTS_tightening_grip_on_control_desc: "Я не тут у пастці з ними. Вони тут у пастці зі мною."

VTS_enforced_happiness: "Примусове щастя"
VTS_enforced_happiness_desc: "Кожен, хто має насильницькі думки, буде перепідготовлений."
VTS_enforced_happiness_tt: "Ви побачите, як сонце заграє через хмари, якщо просто посміхнетеся."

VTS_there_were_no_robobrains: "Робобраїни? Які робобраїни?"
VTS_there_were_no_robobrains_desc: "Здається, деякі люди стійкі до перепідготовки. Як я зробив для колишніх §RREDACTED§!, я запечатую їх у робобраїн, де вони забезпечать безпеку всіх інших, на віки. Вони повинні називати це милосердям."

VTS_the_robo_brain_coup: "Технічний огляд Vault-Tec"
VTS_the_robo_brain_coup_desc: "Хоча це був хаотичний виродок, король радіомишей навчив нас одну річ. Людина повинна керувати людиною. Не машини."

VTS_power_to_the_people: "Герої Сховища 37"
VTS_power_to_the_people_desc: "Плани Наглядача були зривні за допомогою пильних робобраїн та кількох залишкових дисидентів. Незважаючи на те, що їх перетворили на машини, науковці робобраїн все ще виконують свої обов'язки, щоб захистити нашу громаду від тиранії."

VTS_uncovering_the_truth: "Розібрати Наглядача на частини"
VTS_uncovering_the_truth_desc: "Після того, як ми дізналися, що Vault-Tec свідомо змінив код Наглядача T.H.O.M.A.S., нам не залишалося іншого вибору, як розібрати його на частини. Хоч ми і не знаємо, чому Vault-Tec саботував своє власне створення, ми будемо спати спокійніше, знаючи, що їхнє маленьке випробування зазнало невдачі."

VTS_growing_pains: "Біль росту"
VTS_growing_pains_desc: "Спочатку насильство між Сховищами, а потім 'війна' проти Короля Щурів. Сховище тепер виглядає не більше ніж величезна купа уламків під горою. Якщо ми хочемо вижити, ми повинні зруйнувати старе та замінити це чимось більшим."

VTS_start_from_scratch: "Почати з початку"
VTS_start_from_scratch_desc: "Після деактивації Наглядача багато протоколів Сховища залишилися без нагляду. Ми змогли зберегти систему життєзабезпечення в роботі, але здається, що нам потрібно почати все з початку. Ми не можемо залишати наше життя на милість алгоритмів та роботів."

VTS_teaching_vault_dwellers_skills: "Навчання людей, як жити"
VTS_teaching_vault_dwellers_skills_desc: "Оскільки вони звикли до комфортного життя без роботи, було важко для керівництва Сховища призначити нові ролі та обов'язки для жителів Сховища. Всі скарги припинилися, коли запаси їжі висохли, а вода в кранах припинила текти. Вперше в історії один з жителів Сховища змінив лампочку, постійно нарікаючи. Все ж таки це крок у правильному напрямку."

VTS_rag_tag_fighting_force: "Лабільна бойова сила"
VTS_rag_tag_fighting_force_desc: "Керівництво Сховища не схвалювало ідею видавати зброю жителям Сховища, враховуючи нещодавні акти насильства. Без Наглядача, який координував автоматичну оборонну систему Сховища, нам не залишалося іншого вибору, як видати зброю деяким жителям Сховища. Навіть лабільна бойова сила краще, ніж ніяка."

VTS_strength_through_machine: "Сила через машини"
VTS_strength_through_machine_desc: "Протоколи Наглядача не дозволяють йому ставити людей під небезпеку. Це не має значення для Наглядача, оскільки кожна частина Сховища автоматизована, включаючи військові системи."

VTS_robotic_refinement: "Роботизоване вдосконалення"
VTS_robotic_refinement_desc: "Встановлені бази даних Vault-Tec включали багато програмних оновлень для роботів, які обслуговували Сховище, але ці оновлення не були завершені через Велику Війну. Крім того, через свою некомпетентність науковці Сховища ніколи не намагалися виправити помилки в коді, що дозволило Сховищу розвивати такі раніше невідомі функції, як автоматизований термометр для ванн.\n\nАле більше не буде! Наглядач оптимізує код, запустить оновлення та налаштує роботизовані компоненти Сховища, значно покращуючи автоматичні системи."

VTS_slippery_crossroads_of_leadership: "Хитке роздоріжжя лідерства"
VTS_slippery_crossroads_of_leadership_desc: "У кожного жителя Сховища є свої ідеї, як впоратися з осередками щурів. Слухати всіх — це забере час, але хоча б це демократія."

VTS_exterminate_rad_roaches: "Знищити гнізда радіоактивних щурів"
VTS_exterminate_rad_roaches_desc: "СПАЛИТИ. ЇХ. ВСІХ."

VTS_situation_handled: "Ситуація вирішена"
VTS_situation_handled_desc: "У нас більше немає проблем з щурами. Мабуть, більше не потрібно весь цей спрей від комах. Ми нарешті можемо зосередитися на оновленні графіка харчування без побоювань щодо забруднення."

VTS_friendly_neighbors: "Приязні сусіди"
VTS_friendly_neighbors_desc: "Отже, виявляється, що кришки від пляшок Nuka-Cola — це нова форма валюти в пустці? Ха. Це дає нам перевагу."

VTS_new_kid_on_the_block: "Нове Сховище в районі"
VTS_new_kid_on_the_block_desc: "Час відкрити двері для зовнішнього світу. Всі, привітайте нове Сховище в районі!"

VTS_a_second_vault: "Сховище 37.Б"
VTS_a_second_vault_desc: "Це не таке велике, як наше Сховище, але нам вдалося відтворити наше Сховище в нових територіях, що дає нам безпечне місце для базування."

VTS_pre_emptive_expansion: "Превентивне розширення"
VTS_pre_emptive_expansion_desc: "Ми повинні розширити наші володіння в цьому районі, перш ніж розсіяні щури зможуть організуватися і знову кинути нам виклик."

VTS_dual_vault_shenanigans: "Двійне Сховище"
VTS_dual_vault_shenanigans_desc: ""

VTS_talk_to_vault_dwellers: "Поговорити з жителями Сховища"
VTS_talk_to_vault_dwellers_desc: "Тихі шепоти всередині Сховища потрібно вирішити, перш ніж вони призведуть до нової кризи."

VTS_water_tapping: "Добування води"
VTS_water_tapping_desc: "Здається, Vault-Tec не зробив водяні чіпи на довговічність. Нам слід підключити нові джерела води, перш ніж ми будемо змушені відправити наших жителів на самогубну місію з пошуку нових водяних чіпів."

VTS_defending_vault_37: "Оборона Сховища"
VTS_defending_vault_37_desc: "Чим більше ми маємо сил, тим вищою є ціна для їх захисту."

VTS_defenders_of_the_wasteland: "Оборонці пустки"
VTS_defenders_of_the_wasteland_desc: "Подивіться навколо, що ви бачите? Безкрайня, безлюдна пустка. Сховище 37 стоїть як оаза серед пустки, захищаючи її від варварства."

VTS_master_of_detection: "Майстер виявлення"
VTS_master_of_detection_desc: "Всі вхідні передачі заблоковані, заблоковані, заблоковані. Ви всі заблоковані. Ніхто з вас не звільнений від анти-Сховищних активностей."

VTS_master_of_surveillance: "Майстер спостереження"
VTS_master_of_surveillance_desc: "Щоб зрозуміти потреби наших жителів, ми повинні пильно стежити за ними. ДУЖЕ пильно, щоб не пропустити важливі дані (або небезпеки)."

VTS_only_the_best: "Лише найкращі"
VTS_only_the_best_desc: "Наша операція з перетворення найкращих умів Сховища на робобраїн вже приносить плоди. Тепер ми можемо досліджувати кілька предметів одночасно, не потребуючи пускати наших громадян до лабораторій."

VTS_robobrains_for_war: "Натиснути курок"
VTS_robobrains_for_war_desc: "Для покращення людства та запобігання смертям, Наглядач зробив спроби підвищити загальний рівень оборони за рахунок внутрішньої безпеки. Деякі з них можуть загинути, але це жертва, на яку Наглядач готовий піти."

VTS_protecting_the_world: "Захист світу"
VTS_protecting_the_world_desc: "Чим амбітнішою стає місія Наглядача, тим більш потужні інструменти він використовує для її виконання."

VTS_protect_our_southern_neighbors: "Герой, якого вони потребують"
VTS_protect_our_southern_neighbors_desc: "Оскільки жителі інших Сховищ тепер населяють пустку, можливо, Наглядач вирішив взяти на себе захист жителів Сховищ у нашій околиці."

VTS_vault_tec_propaganda: "Пропаганда Vault-Tec"
VTS_vault_tec_propaganda_desc: "Я хочу, щоб ви повідомляли про всю анти-Сховище діяльність найближчому патрулю робобраїнів."

VTS_the_mega_vault: "Мега-Сховище"
VTS_the_mega_vault_desc: "Між певними локаціями буде створена конвеєрна лінія, що значно зменшить час, необхідний для видобутку та транспортування постачань по регіону."

VTS_room_for_everyone: "Місце для всіх"
VTS_room_for_everyone_desc: "Наглядач має місце для кожного в своєму серці, хочуть вони цього чи ні."

VTS_alleviate_vault_37_burdens: "Зняти всі тягарі"
VTS_alleviate_vault_37_burdens_desc: "Тепер лягайте спати, мої любі жителі. Більше не буде голоду, спраги або болю для вас. Я зніму всі ваші тягарі, адже ваш останній сон буде довгим. Залиште все Наглядачу."

VTS_expanding_vault_37: "Велике розширення Сховища"
VTS_expanding_vault_37_desc: "Якщо роки зносу й виснаження Сховища забирають своє, все більше і більше кімнат руйнується і перебудовується. Можливо, ми можемо йти трохи далі."

VTS_vault_37_earth_air_water: "Земля, Повітря чи Вода"
VTS_vault_37_earth_air_water_desc: "Сховище було спроектовано з безліччю неймовірних систем, але в майбутньому ми зможемо підтримувати тільки одну з цих чудес на наших нових територіях."

VTS_restore_air_force_base: "Відновлення бази ВПС"
VTS_restore_air_force_base_desc: "Колись тут перебували численні повітряні сили для запуску або запобігання ядерним ударам. Повітряна база за межами Гранд-Форкс залишалася бездіяльною з кінця її місії після Великої Війни. Хоча вона сильно пошкоджена, з невеликими зусиллями ми можемо відновити її достатньо для запуску простих авіаційних місій."

VTS_the_new_protocol: "Оновлення протоколів"
VTS_the_new_protocol_desc: "З досягненням безпрецедентних цілей розширення, T.H.O.M.A.S. має більше ресурсів і населення, ніж будь-коли раніше. Це навантаження змусило його рости, і подумати: чи не бракувало в оригінальних квотах і протоколах Vault-Tec розуміння реалій життя в постядерний період?"

VTS_prioritze_features: "Пріоритетність оновлення функцій"
VTS_prioritze_features_desc: "Хоча кожен елемент коду зрештою буде вдосконалено, наразі важливіше, щоб оновлення функцій виходили швидше. Жителі Сховища дуже схильні до дурних ідей, якщо їх не відволікати."

VTS_having_fun_today: "Організація прийому"
VTS_having_fun_today_desc: "Кожен новонароджений або новий житель отримує функціонуючий Pip-Boy, щоб допомогти їм у житті. Наглядач може підключитися до кожного з них, щоб збирати дані або давати вказівки. Як зручно!"

VTS_prioritze_expansion: "Пріоритетність кодування безпеки"
VTS_prioritze_expansion_desc: "Якщо конфлікти, що відбувалися до цього часу, є будь-яким показником, то більшість пустки — це практично беззаконня. Вогнева сила є найкращим способом запобігти розпаду порядку."

VTS_practice_round_today: "Тестування нових систем прицілювання"
VTS_practice_round_today_desc: "Цього місяця ініціатива Mr. Handy повинна підвищити їх точність проти нерухомих цілей на 2%. Надішлемо їх на стрільбище, щоб дізнатися."

VTS_healthier_diets: "Точні вимірювання поживних речовин"
VTS_healthier_diets_desc: "Кожне тіло унікальне і потребує відповідної дієти. Створення щоденного меню для кожної окремої особи вимагатиме значної обчислювальної потужності, що означає, що частину роботи доведеться передати спеціалізованому співпроцесору."

VTS_health_push: "Наука про тіло"
VTS_health_push_desc: "Перший крок нашого плану — медичне обстеження, а потім з'ясувати, як отримати деякі необхідні продукти. Чисту рибу, наприклад, буває важко знайти."

VTS_heavy_diets: "Нагодований житель — щасливий житель"
VTS_heavy_diets_desc: "Найважливіше — це забезпечити кожного жителя 5 прийомами їжі на день (плюс перекуси). Багато хто не мав цього так довго.\n\nХоча є деякі ризики для здоров'я через таку важку дієту, довгострокові переваги щодо покірності (і відсутності здатності до фізичного опору) значні."

VTS_moving_food: "Покращення харчової мережі"
VTS_moving_food_desc: "Нагодувати наше населення такою кількістю — це не так просто. Потрібно більше автоматизованих вантажівок, ферм і логістичних ботів для управління, щоб підтримувати постачання від поля до столу."

VTS_focus_vault_industry: "Абсолютна автоматизація"
VTS_focus_vault_industry_desc: "Наша мета чітка: люди не повинні займатися фізичною працею. Хоча є кілька винятків, ми повинні продовжувати неухильно дотримуватися квот."

VTS_keeping_what_we_have: "Ремонт і модернізація існуючих об'єктів"
VTS_keeping_what_we_have_desc: "Машини, що будують і обслуговують машини — нескінченний цикл металу і коду, що обіцяє краще майбутнє для людства. Без їхнього втручання ми зможемо максимізувати наші виходи."

VTS_focus_new_industry: "Визнаний ефект сніжної кулі"
VTS_focus_new_industry_desc: "Хоча це вимагає короткострокового відхилення від наших основних інструкцій, факт залишається фактом: в кінцевому підсумку ми досягнемо максимального зростання виходу від автоматизації та розширення нашої існуючої інфраструктури Сховища. Почати будівництво нових об'єктів негайно — правильний вибір, навіть якщо кілька потенційних жителів поверхні повинні бути призвані для допомоги в будівництві. Їхні нащадки оцінять їхні жертви, якщо їм дозволять дізнатися про це."

VTS_taking_whats_new: "Пошук нових будівельних майданчиків"
VTS_taking_whats_new_desc: "Хоча кожне поселення виграє від певного рівня самодостатності, є специфічні вимоги для створення спеціалізованих промислових центрів. Наші розвідувальні групи визначать локації з найкращими шансами, на які ми направимо будівельні команди."

VTS_continue_the_project: "Продовжити проект"
VTS_continue_the_project_desc: "Враховуючи всі фактори в повсякденному житті наших дорогих жителів, настає час для продовження проекту: ГІСТЬ до його кінцевої мети: забезпечення мирного, безстресового життя для кожного.\nМи щиро сподіваємося, що вони не будуть чинити опір."
