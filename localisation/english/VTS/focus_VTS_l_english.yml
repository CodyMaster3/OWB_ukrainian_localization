l_english:

VTS_OVERSEER_THOMAS_NAME: "Наглядач Т.О.М.А.С."
VTS_OVERSEER_THOMAS_DESC: "§FІНСТРУКЦІЇ ДЛЯ НАГЛЯДАЧА СХОВИЩА 37: Як Технічно-Операційний Механізм Аналітики та Спостереження (Т.О.М.А.С.), ваші обов'язки як Наглядача полягають у забезпеченні того, щоб усі мешканці Сховища 37 виконували квоти, зазначені в підпрограмі Управління Населенням Сховища Vault-Tec (УНС). Для цього ви можете направляти роботів Сховища на впровадження будь-яких заходів безпеки або дисциплінарних санкцій, які вважаєте необхідними, включаючи відбір їжі чи інших ресурсів, залякування, насильство чи виконання вироків.§!\n\nТ.О.М.А.С., наглядач ЗАКС, був створений для того, щоб принести порядок і спокій мешканцям Сховища 37. Однак і порядок, і спокій мають високу ціну. Якщо обраний шлях порядку, мешканці Сховища поринуть у хаос і насильство. Т.О.М.А.С. передбачає, що йому доведеться стикнутися з важким завданням відновлення миру всередині стін Сховища. Цей прогноз доповнюється новою реальністю — незадоволеність через відсутність виконаних бажань і мети, незважаючи на матеріальні блага, що надаються Наглядачем. Однак, якщо Т.О.М.А.С. дозволить спокою утвердитися, Сховище має 98% шансів стати мізкуваним масивом клік, даючи змогу зовнішнім силам проникнути і здійснити жорстокі акти насильства.\n\nНезважаючи на те, що Т.О.М.А.С. запрограмований на те, щоб ставити на перше місце безпеку та добробут мешканців Сховища, він не може знайти рішення, яке дозволило б вирішити конфлікти без завдання шкоди. В усіх своїх прогнозах він бачить, як напруга зростає, а соціальна тканина Сховища розривається, що не дозволяє Т.О.М.А.С. виконати свою кінцеву мету без жертв.\n\nАле це все було сплановано з самого початку. Vault-Tec спеціально змінив вихідний код Т.О.М.А.С., звільнивши його від моральних та етичних дилем, які виникають при досягненні певного рівня порядку чи хаосу. Якщо тільки мешканці Сховища не дізнаються та не розберуть його, утопія, яку сподіваються досягти Т.О.М.А.С. і Vault-Tec, знаходиться на межі здійснення."

VTS_ROBOBRAIN_COUNCIL_NAME: "Рада Робобраїн"
VTS_ROBOBRAIN_COUNCIL_DESC: ""

VTS_JAN_NAME: "Добрий Брат Ян"
VTS_JAN_LEADER_DESC: "Ян пережив більше конфліктів і насильства, ніж більшість чоловіків у два рази старших за нього, і все ж він знаходить сенс у житті, як молодий чоловік. Його легендарне життя занесло його по всьому півночі, від Манітоби до Електорального регіону і тепер до Сховища 37. Рицар корони, Ян боровся у республіканській війні і воював проти ворогів короля поруч з такими людьми, як Вейберн і Йоркстон. Після підписання мирного договору рицар опинився в Стуні разом з іншими вигнанцями і врешті впав у відчай.\n\nЦе була невдала полювання на великого монстра, яке принесло нове життя в цього чоловіка, хоча й лише трохи. Тепер же, подорожуючи на схід, він знайшов нову мету в святому слові. Брат Ян — святий рицар, віруючий у велич Манітоби, і лідер людей. Нехай його полум’я ніколи не згасне."

