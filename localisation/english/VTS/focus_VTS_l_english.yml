VTS_autonomized_industry: "Автономна Промисловість"
VTS_autonomized_industry_desc: "Промисловість Сховища 37 завжди була автономною завдяки передовим автоматизованим лініям. Плани Наглядача включають нову промислову експансію для «безпеки», а також безліч нових оновлень виробничих потужностей. Тепер наша промислова продукція буде організована Наглядачем, а не під впливом забаганок мешканців Сховища."
VTS_autonomized_industry_deeper: "Повністю Автономна Промисловість"
VTS_autonomized_industry_deeper_desc: "99% всієї значущої промислової праці виконується автоматизованими машинами. Мешканці Сховища можуть відпочивати та насолоджуватися життям, не переживаючи, чи виготовили вони достатньо виробів сьогодні."
VTS_autonomized_industry_wider: "Розширення Нашої Автономної Промисловості"
VTS_autonomized_industry_wider_desc: "70% всієї значущої промислової праці виконується автоматизованими машинами. Праця мешканців Сховища продовжує підтримувати наші плани розширення, принаймні до того часу, поки ми не досягнемо достатньої потужності для підтримки кожного поточного чи можливого мешканця у світі після війни."

VTS_vault_workers_council: "§MVault-Tec: Останні Оновлення§!"
VTS_vault_workers_council_desc: "Насолоджуйтеся найкращими умовами в Сховищі, завдяки Наглядачу Т.О.М.А.С. Просимо швидко повідомляти про будь-які неполадки для вашої безпеки та зручності."
VTS_vault_workers_council_comfort: "§MVault-Tec: Останні Оновлення Функцій§!"
VTS_vault_workers_council_comfort_desc: "Насолоджуйтеся найкращими умовами в Сховищі, завдяки Наглядачу Т.О.М.А.С. Просимо швидко повідомляти про будь-які неполадки для вашої безпеки та зручності."
VTS_vault_workers_council_expansion: "§MVault-Tec: Останні Оновлення Безпеки§!"
VTS_vault_workers_council_expansion_desc: "Насолоджуйтеся найкращим захистом Сховища, завдяки Наглядачу Т.О.М.А.С. Просимо швидко повідомляти про будь-які неполадки та/або незадоволення для вашої безпеки та зручності."

VTScleanwater: "Забезпечення Харчових Потреб"
VTScleanwater_desc: "Завдяки невтомній праці Наглядача, кожен мешканець Сховища отримує 120% необхідних калорій на день."
VTScleanwater_healthier: "Комплексне Харчування"
VTScleanwater_healthier_desc: "Завдяки невтомній праці Наглядача, кожен мешканець Сховища отримує персоналізовану дієту. Зосереджуючи увагу на максимальному покращенні здоров’я кожного, психічний стан мешканців значно покращиться!"
VTScleanwater_fatter: "Надмірно Розкішні Дієти"
VTScleanwater_fatter_desc: "Завдяки невтомній праці Наглядача, кожен мешканець Сховища отримує 200% необхідних калорій на день. Можливо навіть більше, враховуючи, як рідко вони виконують фізичну працю. Ми обов'язково забезпечимо медичні установи для таких випадків."

VTS_crisis: "Криза в Сховищі 37"
VTS_crisis_desc: "Жорстка рука Наглядача залишає багато чого бажати, особливо тепер, коли ми маємо регулярні контакти з зовнішнім світом. Прибуття Брата Яна не допомогло, оскільки деякі мешканці тепер звертаються до нього за лідерством."

