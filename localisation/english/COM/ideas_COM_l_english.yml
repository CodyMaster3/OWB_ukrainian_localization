#Characters (велкам ту америка)
  COM_commission_name: "Комісія Шостої бригади"
  COM_COMMISSION_DESC: ""

  COM_jack_johnson_name: "Джек Джонсон"
  COM_JACK_JOHHSON_DESC: "Спитайте капрала Джонсона, і він скаже, що боровся за праве діло ще до того, як упали бомби. Спитайте канадців — і вони назвуть його розбійником, що носить прапор своїх гнобителів, чудовиськом, яке мало би загинути разом з Америкою. Джонсон бачив усе: перший розкол КНФ, падіння Наїздників, та спалахи в Північному сяйві. Але одне ясно — людина, що називає себе останнім американцем, боротиметься проти Канадського Народного Фронту до останнього подиху."
  COM_JACK_JOHNSON_DESC_1: "Спитайте капрала Джонсона — і він скаже, що боровся за праве діло ще до падіння бомб. Спитайте комуністів — і вони назвуть його дияволом у зірках і смугах. Спитайте Анклав — і вони назвуть його зрадником, найкращим другом Китаю. А от американський народ скаже, що він герой: людина, яка втратила себе у пляшці, але знайшла світло. Колись прапор ніс Дядько Сем, але тепер це Дядько Джонсон об'єднуватиме Союз!"

  COM_micheal_woods_name: "Майкл Вудс"
  COM_MICHEAL_WOODS_DESC: "Побитий снігами, комуністами і навіть тими, кого колись вважав друзями — Майкл Вудс досі тримається. Найменш імовірний лідер, він є нащадком пращурів Шостої бригади. Провів юність на фермі, зміцнюючи себе і слухаючи історії старших про Велику Республіку, за яку вони боролись. Тепер спадщина зірок і смуг лягає на його плечі. Старої слави вже нема, але її Невідомий Солдат все ще стоїть у бою!"

  COM_captain_gallagher_name: "Капітан Ґаллагер"
  COM_secretary_gallagher_name: "Секретар Ґаллагер"
  COM_SECRETARY_GALLAGHER_DESC: "Народжений у нетрях Ред-Діру, секретар Ґаллагер був одним із багатьох сиріт, забутих світом. Але старі гулі-офіцери особисто обрали його, щоби передати йому факел втраченого світу. Скільки пам’ятає себе Ґаллагер — стільки він уже носив форму й тримав гвинтівку. Підіймаючись у званні як «золота зірка» армії, зрештою він став командувачем усіх частин Національної гвардії в Ред-Дірі. Тепер ця зірка Співдружності тримає віжки влади, ведучи американський народ у майбутнє — а не назад до пляшки."

  COM_enclave_admin_name: "Військова адміністрація Анклаву"
  COM_ENCLAVE_ADMIN_DESC: "Після смерті Ґаллагера Анклав став єдиною реальною силою в Співдружності. Більшість діючих офіцерів залишались вірними Макартуру, тож ніхто не зміг заявити про право на посаду Ґаллагера.\n\n Після короткого періоду воєнного стану адміністрація перетворилась на постійний військовий уряд, що проіснує до самої анексії."

