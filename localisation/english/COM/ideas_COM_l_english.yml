  COM_sixth_brigade:0 "Комісія Шостої бригади"
  COM_sixth_brigade_desc:0 "Шоста бригада управляє землями, що належали Піонерській компанії. Зірки й смуги можуть стримувати справедливу ненависть наших солдатів лише до певної межі. Затяжні дебати та бездіяльність змушують наших співвітчизників нервувати через кожну нову затримку. Такі накази були спущені Янкі згори. Капітан Ґаллагер готує своїх людей до наступного етапу — жорстокого маршу на північ."

