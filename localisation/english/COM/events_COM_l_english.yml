l_english:


  #Events

  nf_com.1.t: "Рідний дім, Американа"
  nf_com.1.d: "Сонце Флориди-Кіс виростило Джонсона. Тепле сонце і заповнені пляжі були тлом для пригод, які він пережив із друзями. Ті юні хлопці бігали наввипередки із сонцем по полях, стискаючи в руках пляшки з-під Ядер-Коли, бігли так швидко, що дядько Сем нарешті звернув на них увагу. Коли сонце заходило над злітною смугою, страх Джонсона тільки зростав, тоді як п’ятеро його друзів гойдалися в кріслах і запевняли, що повернуться героями. Тепло сонця змінилося на моторошну димку індустріального серпанку та гори снігу, які поглинули Ред-Дір. Вони йшли вулицями, дорога тріщала під важкими черевиками, а погляди канадців з тіней провулків переслідували Джонсона.\n\nДні окупації вкарбувалися в пам’ять Джонсона, який досі намагається згадати, як востаннє ділився улюбленою Ядер-Колою з товаришами. Незабаром сніг знову покрив Ред-Дір, а тисячі солдатів, що топтали асфальт разом з ним, залишили місто. Як згадує Джонсон, усе відчувалося так, наче до міста прийшла смерть і забрала всіх, кого могла знайти. Та він дякував небесам, що її погляд пройшов повз нього, і залишився на чергуванні на злітній смузі з тими, хто ще жив.\n\nСмог змішався зі снігом і стискав легені, витискаючи останнє повітря. Лише червоні й зелені вогники на кінці смуги пробивали канцерогенний туман. Година за годиною, мов за годинником, прибували літаки — із машинами та трунами. Колона трун йшла пліч-о-пліч із наступним вантажем м’яса для м’ясорубки. Не завжди Джонсону щастило — смерть і соснова деревина приходять до всіх. Шестеро стали п’ятьма, потім чотирма, а похоронна процесія все йшла. Не все було похмурим маршем, але поза злітною смугою Джонсон мало що пам’ятає."
  nf_com.1.a: "Це лише окупація..."
  nf_com.1.a_tt: "Дві дивізії §Yветеранів Великої війни§! будуть створені в §Y[1161.GetName]§!."
  nf_com.1.b: "Дим підіймався вище, коли зростали фабрики."
  nf_com.1.c: "Дядько Сем забрав усе, що міг — як завжди."

  nf_com.2.t: "Десяте коло пекла"
  nf_com.2.d: "Літаки прибували без запізнень — і так мало тривати завжди, поки одного дня злітна смуга не спорожніла. Напруга висока, страх ще вищий. Новини з дому? Немає. Вперше четверо друзів зібралися того вечора за місцевим пивом, намагаючись заспокоїтись. Вид на стіл у барі став туманним... Як Джонсон потрапив на пагорб за містом, він не пам’ятає. Але пам’ятає, як жартував із другом Патріком. Так, то був Пат.\n\nЯдерний вогонь охопив їх, перекинувши й пошматувавши. Тіло Джонсона роздерло та знову склалося, нутрощі — обернулися на залізо. Лише надія повернутися додому тримала його на пагорбі. Коли світло згасло, настала ніч, і очі закрилися. Та невдовзі знову з’явилося світло — не вогонь, а ліхтарі. Друзі прийшли по нього. Вони кричали від жаху, блювали в сніг... Ті дні у шпитальному наметі Джонсон пам’ятає як у тумані.\n\nПоки він одужував, Америка валилася. Місцеві піднялися з коктейлями та рушницями, розстрілюючи солдатів. Штаб перетворився на полотно жахів. Джонсон знову став на ноги, ще у бинтах і залишках уніформи, й очолив друзів. Як у дитинстві, вони побігли назустріч канадцям без страху. Місто повернули, а очі звернулися на обгорілого капрала. На нього чекали накази — і він їх дав."
  nf_com.2.a: "Він наказав відкрити заводи знову"
  nf_com.2.b: "Він відправив інженерів до армії"
  nf_com.2.c: "Він просто намагався нагодувати людей..."

  nf_com.3.t: "Тягар одного"
  nf_com.3.d: "Окопи були глибокими, а поля свинцю — безкрайні. Ред-Дір став лише початком для Джонсона та решти Шостої бригади. Кожен напрям, кожен закуток мапи — все було на черзі. Червоні прапори майоріли навколо, а багнети вже чекали на команду. Ярди ставали милями, а сніг забарвлювався в червоне, коли кривавий привид минулого гнали на північ. Джонсон, безстрашний у бою, вів своїх бійців у атаки проти орди. Під час останнього з цих фатальних штурмів його люди опинилися під штормом куль і граду. Град трощив землю, розриваючи Шосту бригаду надвоє.\n\nПоклик втраченої домівки й розвіяної родини досі переслідує Джонсона в темряві ночі. Минуло багато років відтоді, як він позбавився смертності. Його друзі — не просто товариші, а брати — не постаріли, але залишилися з ним. Коли град вщух, і бригада повернулась до Ред-Діру заліковувати рани, знову почалася похоронна процесія. Джонсон завжди стояв над цим дійством: перевіряв жетони, ставив прапори, стримував сльози. На балконних перилах його руки стискали метал, поки очі наповнювалися сльозами. Часи гонитви за заходом сонця скінчились — шестеро стали одним. Вперше з моменту посадки в літак світ для капрала-гуля потемнів.\n\nДесятиліття в Ред-Дірі тягнулись повільно, поки Джонсон топив свої жахи на дні кожної пляшки. Його останній вчинок як старшого офіцера — створення Комісії. Вона мала керувати цими втраченими роками, дозволивши кожному американцю знову голосувати. Заводи знову запрацювали, поля засівались за рішенням громади, а сам Джонсон став легендою. Рештки бригади годували себе, продаючи свою кров за найбільшу нагороду. Щорічні неврожаї лише погіршували ситуацію, і так вони здобули свою сумнозвісну кличку, знану на милі навколо.\n\nДесятиліття змінилися століттями, і очі нового світу знову звернулися до втрат минулого. Діти слухали легенди про великого капрала і державу, яку він уособлював, поки їхні батьки проливали кров, аби захистити їх. Народжувалися рухи, формувались ідеї — від найстаріших гулів-вояків до наймолодших дітей. Безкінечні суперечки про стабільність і свободу не стихали в Комісії. Але чудовисько, яке Джонсон тримав у собі, знову вирвалося. Потрібен новий герой. Якби тільки той великий капрал з легенд ще був серед нас..."
  nf_com.3.a: "Стабільність знову замкне звіра в клітку!"
  nf_com.3.b: "Свобода здобуде перемогу!"

  nf_com.4.t: "Дно прірви"
  nf_com.4.d: "Холодні, виснажливі обійми Канади стискали пляшку в руці Джонсона, поки сніг бив у вікна його квартири. Привиди минулого блукали коридорами, а рамки для фото відбивали його обличчя гуля. Підлога рипіла, коли старий гуль змінював вагу, роздумуючи, ким він був, що з ним сталося. Різким, але нетверезим рухом він жбурнув рамку, розбивши її об колекцію порожніх пляшок. З затуманеним поглядом він дивився на безлад зі скалок скла. У марній спробі він нахилився, почав пересувати уламки по старому килиму, ніби збирав пазл. Сніг усе ще гатив у вікна, а уламки шкреблися по підлозі, зсуваючись разом.\n\nЧерез кілька годин скляна мозаїка була зібрана, і, дивлячись униз, Джонсон знову бачив себе. Шрами й опіки на його обличчі кидалися в очі, спогади з того пагорба спливали знову. Спека накрила кімнату, звуки снігу змінилися на крики. Пам'ять наростала, біль був надто сильним, і Джонсон змахнув імпровізоване дзеркало. Підвівшись на ноги, він попрямував назад до свого крісла, прихопивши ще одну пляшку."
  nf_com.4.a: "Він останній американець?"

  nf_com.5.t: "Ходячий труп"
  nf_com.5.d: "Роками Комісія наживалася на війнах, спричинених неминучим крахом Канадського народного фронту. Але зручна схема зламалась — із попелу повстав їхній найсильніший ворог. Так звана Голова, Емі Тересі, або ж Велика Сестра, об’єднала більшість півночі та тепер кидає око на наші території. Шоста бригада тепер — лише жалюгідна тінь часів, коли Джонсон її відвоював. Їхня зброя — та, що лишилася, а часи, коли стандарт вирішував всі проблеми давно минув. Тепер Комісія має вирішити, як виправити це приниження.\n\nЗал засідань Комісії знову наповнився палкими дебатами, де дві жорсткі фракції намагалися «домовитись». Єдине, про що вони змогли погодитися — потрібен герой. Хтось, хто об’єднає й поведе залишки Шостої бригади проти брудних комуністів. Старі гулі-янкі запропонували свого Капітана Ґаллагера, вважаючи, що його майстерність принесе перемогу. З іншого боку, Майкл Вудс та його Сини Свободи висунули несподівану кандидатуру — живу легенду, Капрала Джека Джонсона. Посилаючись на його попередні перемоги, Комісія з мінімальним відривом підтримала кандидатуру старого капрала.\n\nЩойно голосування завершилось, Вудс вирушив на пошуки легенди. Йому не знадобилось багато часу, щоб знайти його будинок — обшарпану, занедбану халупу, яка бачила кращі часи. Стукіт до дверей пропустили — кожна секунда була на вагу золота. Вступаючи обережно до помешкання, він скрипів кожним кроком. Із коридору долинув хриплий голос: «Залишайся там, де стоїш, поки я не відправив тебе до Всевишнього», — промовив Джонсон, напівп’яний.\n\nВудс озирнувся і побачив гуля — Джонсон стояв у дверях, тримаючи скляну пляшку так, ніби це рушниця. Не встиг Вудс нічого відповісти, як легенда впала обличчям донизу. Не встигаючи осмислити подію, Вудс схопив Капрала й доставив до лікарів. Тепер лишається чекати, поки той протверезіє — за словами лікарів, це може зайняти дні."
  nf_com.5.a: "Сподіваємось, він не спатиме довго."

  nf_com.6.t: "Зламані надії та мрії"
  nf_com.6.d: "Минуло вже кілька років, відколи Комісія відправила колоністів заселяти західні території. Малі поселення, сформовані з найвитриваліших американців та біженців із Канади й Аркадії, мали стати осередками розвитку. Хвиля піонерів вирушила на захід, сподіваючись вирвати дім із землі канадців. Та роки були немилосердними до цих колоністів: врожаї гинули, шахти — порожні. Тепер вони повертаються на схід, накочуючи хвилями на зламане узбережжя.\n\nКомісія не справляється — старі робочі місця й житло були давно зайняті, бо народжуваність у Ред-Дірі лише зростала. Місто тріщить по швах — вулиці й провулки повні людей, які намагаються вижити у снігах. Капітан Ґаллагер узявся розв’язувати цю кризу. Із порожньої кімнати й кількох стільців формується новий Департамент внутрішніх справ. За браком людей у Комісії, Ґаллагер змушує її погодитися на створення нового органу влади. Час покаже, як він впорається з кризою, поки Вудс із жахом спостерігає за його політичними маневрами."
  nf_com.6.a: "Ще одна криза для вирішення."

  nf_com.7.t: "Понад обов’язку"
  nf_com.7.d: "Напруга на північному кордоні зростає, як Джонсон починає виходити з пиятичного забуття. Майкл Вудс, мов за розкладом, щовечора перевіряє старого гуля на притомність. Тим часом Ґаллагер збирається зі своїми янкі, обмірковуючи, як використати цього випаленого пияка собі на користь. Патрулі з обох боків майже не зупиняються, чекаючи на пробудження Джонсона. Сам Джонсон бореться з ламкою, прострілами, гарячкою, а особливо — з тими спогадами, що паралізують його зсередини.\n\nВперше за багато років Джонсон підводиться з ліжка з ясними очима, свіжим обличчям та майже чистим розумом. Звістка про його стан швидко доходить до Вудса та Ґаллагера. Незабаром надійшла пропозиція знову очолити Бригаду. Зітхнувши й зі стиснутим серцем, Джонсон погодився. Його одужання не могло бути більш своєчасним — рух комуністичних сил на півночі посилився.\n\nШоста бригада знову була скликана до служби, збираючись у місті Алікс перед походом на північ. У своєму наметі Джонсон починає збирати свою древню бойову броню. Бойові шрами й сліди гарі на пластинах — доказ для кожного, хто помітить — цей гуль знає війну. Нарешті, обривки поховального прапора його друга залишаються в його руках важкими, як вольфрам. Полотно — важке, як і минуле, що живе в ньому так само яскраво, як і теперішнє. Обгорнувши голову тканиною та вийшовши з намету, Джонсон знає: жахи близько, і світлі очі тих, хто поруч, вже не повернуться такими, як колись."
  nf_com.7.a: "Знову за старе..."

  nf_com.8.t: "Терористи атакують нашу промисловість"
  nf_com.8.d: "Надійшли свіжі повідомлення: Канадська Народна Демократична Армія, або КНДА, здійснила черговий терористичний акт. Повстанці-комуністи, яких тепер фінансує північна Страткомунна, стали сміливішими, продовжуючи сіяти страх серед нашого населення. Найсвіжіший напад — підрив ключового підприємства, що входить до нашої і так мізерної промислової бази. На жаль, терористам вдалося втекти — принаймні так каже поліція."
  nf_com.8.a: "Прокляті червоні!"

  nf_com.9.t: "І починається хаос..."
  nf_com.9.d: "У залах Військового трибуналу точаться запеклі дебати, перемежовані дрібними сутичками. Після важко прийнятої реформи офіцерського корпусу, Трибунал опинився у глухому куті, а фракційний розкол став нестерпним. Джонсон, усвідомивши помилку в допуску до ради всіх, кого тільки можна, дійшов висновку: рухатися далі можна лише під проводом однієї сили. Щоб прискорити ухвалення нового військового кодексу, він наказав кожній фракції підготувати свою пропозицію до кінця тижня.\n\nМинає тиждень. Члени ради днями й ночами бігають з паперами, намагаючись узгодити плани перед поданням на очі Джонсону. Чим ближчий фінал — тим більше метушні. І ось, у день вирішального голосування, всі сновигають залом, розмахуючи документами. Настав час суду. Першими виступають Вартові Старого Порядку.\n\nПеред столом Джонсона стає старий гуль у довоєнному парадному мундирі й презентує свою пропозицію: армія з простого люду, під проводом сильних людей, із єдиною метою — знищити рештки комунізму на Землі. Лише рушниця в руках і вогонь у серці!\n\nОдразу після нього виступає молодик у перефарбованій бойовій броні, представник Революційної гвардії. Їхнє бачення — залишити минуле позаду й створити нову армію, гідну захищати людей та їхні ідеали. Армія з фахових бойових підрозділів, здатних проривати ворожі лінії й оточувати з тилу. Завершує виступ уколом в бік попередника: комунізм — ворог старих людей.\n\nХто переможе?"
  nf_com.9.a: "Ми не залишимо комуністам шансу!"
  nf_com.9.b: "Майбутнє вже тут — зустріньмо його!"

  nf_com.10.t: "У повітрі — свобода"
  nf_com.10.d: "Люди Ред-Діра завжди були суворим народом — життя не надто жалувало їх. Але сьогодні все інакше: вони усміхаються, балакають, стоячи в чергах до виборчих дільниць. Дехто тримає прапори старих США, дехто — новий, рідний стяг, обговорюючи, за кого голосуватимуть. Публічні вибори вселяють у людей надію — можливо, справді є за що жити. Усі чекають на результати!"
  nf_com.10.a: "Кидаймо кості!"

  nf_com.11.t: "Гарна ширма"
  nf_com.11.d: "Сьогодні завжди мовчазні мешканці Ред-Діра вийшли на вулиці, не промовляючи й слова, стоячи в чергах до виборчих дільниць. На місцях — військова поліція, що «охороняє» вибори від КНДА, але насправді намагається вплинути на голосування. Усі мешканці Ред-Діра це розуміють — більшість просто стоїть у черзі, щоби не наразитись на гнів поліції. Попри це, знаходяться ті, хто вірить, що зміни можливі. Але доведеться дочекатися підрахунку голосів."
  nf_com.11.a: "Кидаймо кості!"

  nf_com.12.t: "Обрані щасливці"
  nf_com.12.d: "Запроваджена система лотереї, що дозволяє голосувати лише найкращим працівникам, зробила людей продуктивнішими. Обіцянка можливості голосу підштовхує робітників лагодити й виробляти все більше — аби виглядати гідними в очах робота-бюлетеняра. Той визначає, хто отримає право голосу, лише за трудовою етикою. Отже, результат голосування залишається невизначеним — усі гадають, що буде далі."
  nf_com.12.a: "Кидаймо кості!"

  nf_com.13.t: "Відчиняючи шлюзи"
  nf_com.13.d: "Уперше за багато років у повітрі Ред-Діра з'явилася надія. Люди проходять через черги на виборчі дільниці, щоби скористатися шансом бути почутими. А Джонсон тим часом ходить туди-сюди у своєму офісі, сумніваючись, чи правильне рішення він ухвалив. Старий гуль поглядає з вікна на вулицю — на народ. Побачивши цю картину, він кидається до столу й відкриває верхню шухляду. Там — старий 10-мм пістолет, вкритий шарами пилу. Його рука завмирає за крок від зброї, і до гуля починає вертатися пам’ять — крики минулих днів розривають його розпечену голову, і він падає на стілець.\n\nЩоби заспокоїти нерви, він тягнеться до пляшки самогону, але, побачивши тремтячу руку, лише притискає її до грудей у марній спробі стримати тремтіння. Вибори минули без серйозних інцидентів — усі дійсні бюлетені подано й підраховано. Джонсон і досі сидить у кріслі, вдивляючись у минуле, коли голосовий гучномовець раптом оживає, щоби оголосити фракцію, яка формуватиме новий законодавчий орган.\n\n«Увага! Увага! Результати підраховано, переможцем стає...»"
  nf_com.13.a: "...Стара гвардія!"
  nf_com.13.b: "...Революційна гвардія!"
  nf_com.13.c: "...Ліга!"

  nf_com.14.t: "Ті, що вижили"
  nf_com.14.d: "Ніч була довга, повна свинцевих штормів і тріску кустарних снайперських рушниць. Джонсона прошили кулями, а мокра земля навколо не залишала місця для ілюзій. Із першим сонячним променем Ґаллагер і його люди почали відступати. Крок за кроком, труп за трупом, Сини Свободи виповзали з-під поразки, маючи удвічі менше сил, ніж ворог. У повітрі завис густий туман, а порожні погляди ділили між собою всі, хто бачив, що залишилося від Джонсона. Останнього американця вбили ті, хто носив ті самі зорі, що й він. Як вони могли?\n\nПовернення до Ред-Діра було сумним. Лакеї Анклаву втекли в глушину разом із Ґаллагером, залишивши місто на Вудса та його людей. Але як їм зібрати уламки? Їхні мрії про Америку розбиті, а їхній герой — у мілкій могилі. У лісах — лише терористи, а перед Вудсом — порожнє бюро. Майкл Вудс, сержант із великими ідеалами й малим значенням, мав бути послідовником сильніших. Думки про поразку та втрату охопили його над столом наставника. Чи не закінчить він так само? Ні, подумав він. У цьому й була помилка Джонсона — він жив минулим. Вони обидва жили. Америка мертва. І ця ніч — її втручання. Щось нове має прийти на її місце.\n\nРозлючений сержант, похитуючись, вийшов до своїх людей — усі чекали відповідей. Відповідей, які давав Джонсон, а не Вудс. Але спробувати варто. Дивлячись у натовп, втомлений солдат побачив не американців, а пригноблених аркадійців. Його заклики залишилися без відповіді серед «справжніх» американців, а ось забуті — відповіли. Навіщо кликати до мертвої держави, що зрадила власні принципи, коли можна збудувати нову — кращу? Шлях уперед трохи прояснився, хоч туман ще не розвіявся — Ґаллагер і досі десь там."
  nf_com.14.a: "Чи вистачить сил у Вудса?"

  nf_com.15.t: "Темне підпілля"
  nf_com.15.d: "Скільки себе пам’ятає хто-небудь, північні поселення були джерелом проблем — населені божевільними чи фанатиками. Саме тому вони стали ідеальним місцем для початку нашого розслідування щодо КНДА — якщо вона й десь є, то повзе саме там, на півночі. До справи залучили найкращих людей під проводом Агента Сміта — нашого най«кориснішого» оперативника. Хоч і не знаємо, як саме він здобув інформацію, але Сміт передав у Ред-Дір, що йому вдалося виявити штаб-квартиру КНДА. Чекати не стали — почали готувати рейд.\n\nНаші агенти під прикриттям обережно оточили ймовірну ціль, готуючись ударити по симпатизуючих Страткомунні. Але щойно вони збиралися розпочати штурм, до дверей наблизився якийсь чоловік. Коли він узявся за ручку, його раптово схопили й відтягли, і на його місце стали п’ятеро наших. Агенти зайняли стандартні позиції: двоє зліва, двоє справа, один — на відкриття дверей. Коли той обережно повернув ручку й почав відчиняти...\n\n...тик...БУМ...\n\nБудівля й усі всередині злетіли в повітря — грибоподібний вибух залишив по собі лише попіл на снігу. Вижили лише троє: агент Сміт, агент Сілі та таємничий чоловік. Як допитати цього вижившого?"
  nf_com.15.a: "За процедурою! Ми не звірі."
  nf_com.15.b: "Та хто за ним сумуватиме?"

  nf_com.16.t: "Нічого цікавого"
  nf_com.16.d: "Останнім двом агентам наказали зʼясувати особу чоловіка без крайніх заходів. Знадобилося десять днів перехресного допиту, щоби він нарешті зламався. Таємничого чоловіка звали Фрітс, і він говорив із густим акцентом, який пам’ятали лише найстаріші гулі — німецький.\n\nЗа його словами, він родом із містечка Аполіс, десь у колишньому американському Середньому Заході. У молодості долучився до канадського комуністичного руху, більшість часу діяв поблизу рідного міста, поки його не направили на захід старші товариші. Завдання — наростити набір у нашому регіоні перед офіційним вступом до КНДА.\n\nПро структуру самої організації Фрітс говорив неохоче — лиш кілька згадок про відомих членів. Та, зрештою, обмовився: є фігура на ім’я Буккі — саме він відправив Фрітса відчинити ті двері."
  nf_com.16.a: "Повертаємось до креслень..."

  nf_com.17.t: "Нічого цікавого"
  nf_com.17.d: "Останнім двом агентам дали «зелене світло» на будь-які методи — заради отримання інформації. Десять днів знадобилося Сміту та Сілі, щоб вибити правду. Чоловік назвав себе Фрітсом, говорив із густим акцентом, який згадували лише найстаріші гулі — наче німецький.\n\nВін стверджував, що родом із містечка Аполіс у колишньому Середньому Заході США. Ще юнаком долучився до ширшого канадського комуністичного руху. Працював навколо рідного міста, поки не був відправлений на захід приєднатися до КНДА і виконувати завдання як фахівець із підриву. Схоже, Фрітс — відповідальний за більшість попередніх підривів нашої промисловості.\n\nПід час подальших «методів» він здав ім’я свого куратора — Буккі. За словами Фрітса, це керівник бойового крила КНДА, який планував усі атаки. Але він не зупинився на цьому й злив місце наступної зустрічі — просто під нашим носом у Ред-Дірі."
  nf_com.17.a: "Пора побачити Буккі."

  nf_com.18.t: "Червоне світло"
  nf_com.18.d: "У самому серці Ред-Діра є простий робітничий бар — «Червоне світло». Його відвідують усі — від звичайних містян до самого Джонсона. Але Фрітс розповів, що за завісою буденного — змова. Підвал під баром ховає офіс Буккі. Він облаштувався там, де ніхто б і не подумав шукати.\n\nПід час «щасливої години» кілька військових поліцаїв, позичених нашими агентами, увійшли до «Червоного світла» під прикриттям, удаючи звичайних клієнтів. Агенти Сміт і Сілі спостерігали з квартири навпроти, щоби не насторожити терористів КНДА. Фрітс описав Буккі як білого чоловіка середніх років у плащі, який приховує його інструменти руйнування. Незабаром схожого на опис чоловіка помітили, й оперативники почали обережно оточувати.\n\nАле щойно вони замкнули кільце, пролунали постріли з-за бару, а підозрюваний кинувся тікати просто в бік вогню — це й підтвердило його особу. Наші люди кинулися в тил бару й знешкодили двох стрільців. Далі вони рушили вглиб — сходами до підвалу. Стіни там були завішані прапорами КНДА і заставлені боєприпасами. Але за прапорами ховались тунелі, що вели в різні боки. Буккі зник без сліду.\n\nМинали дні після облави, але від КНДА — ані звуку. Схоже, ми їх налякали. Проте знищення більшості національних агентів і втрата сліду зробили справу мертвою. До наступної зустрічі Сміт і Сілі нічого не можуть зробити."
  nf_com.18.a: "На разі — не наша проблема..."

  nf_com.19.t: "Прямо під носом"
  nf_com.19.d: "Ред-Дір із моменту падіння бомб вважається вершиною нашої влади. Але ця думка — брехня. Хоч тут і зосереджена більшість нашого офіцерського корпусу, місто також є столицею корупції, в якій чимало офіцерів давно беруть на лапу. На щастя, серед нас залишилися справжні патріоти, які передають інформацію про зловживання, даючи нам змогу відстежувати темні справи наших людей.\n\nОфіцер Ґідеон поступово передавав усе більше доказів до центральної влади. Ми простежили довгий ланцюг оборудок до одного бару в бідній частині міста — до «Червоного світла». Щоб не дати знищити докази, Ґідеона направили туди з рейдом.\n\nБар — не що інше, як старий довоєнний офіс, перебудований: замість кабінок — столи, замість кавомашини — міцніші напої. Ґідеон із кількома довіреними офіцерами увійшов туди у формі, як і більшість регулярних військових. Але все пішло не за планом. Почалася звичайна бійка — звична річ у цьому закладі. Та раптом над головами пролунав постріл — і почалася справжня стрілянина. Ґідеон і його люди прорвалися за барну стійку й нейтралізували двох головних стрільців, завершивши бій, вийшовши через чорний хід. Та питання залишається: чому ті відкрили вогонь першими?"
  nf_com.19.a: "Допитуємо за інструкцією!"
  nf_com.19.b: "Завжди є інші методи..."

  nf_com.20.t: "Проти нашої суті"
  nf_com.20.d: "Центральна влада наказала Ґідеону бути обережнішим із двома затриманими. Йому це, м’яко кажучи, не сподобалось — він заявив, що це «суперечить нашим нормам». Але йому пояснили: ми не можемо втратити цінну інформацію через його надмірне завзяття.\n\nДопит за протоколом розпочався, та жоден з двох не зламався. На десятий день, коли Ґідеон уже майже готовий був застосувати «розширені» методи, його зупинив інший офіцер — Соломон. Вони вирішили змінити підхід.\n\nЦього разу вони увійшли до кімнати з фотографіями — звичайними на перший погляд. Але ці знімки — частина нашої нової мережі підозрюваних членів КНДА. Після кількох погроз — мовляв, кожен на фото зникне, якщо не заговорять — один із полонених таки зламався. Нам вистачило одного речення: дату й час наступної зустрічі керівництва КНДА десь у глушині."
  nf_com.20.a: "Сподіваюся, ми будемо вдягнені по дрес-коду..."

  nf_com.21.t: "Місячний танок"
  nf_com.21.d: "Ми зневажали КНДА як примітивних фанатиків, але, здається, у них є смак до «вищого» життя. Далеко в глибинці вони захопили занедбаний розкішний маєток і перетворили його на штаб-квартиру. Офіцерам Ґідеону та Соломону видали найкращі військові костюми, щоби ті зʼявилися на вечірці вищого класу, разом з офіційними особами КНДА, їхніми охоронцями та навіть кількома гостями з сусідніх режимів.\n\nНаші офіцери поступово пробирались углиб, повз «еліту», що теревенила про страждання робітника, попиваючи довоєнне шампанське. Зрештою, вони знайшли головне — зачинену задню кімнату, яку охороняли двоє агентів КНДА. Ті не стали на заваді. Усередині — кімната повна фанатиків, які гаряче сперечалися: форма має бути коричневою чи хакі?\n\nЄдина, хто звернула увагу на двох озброєних офіцерів, була жінка в дальньому кінці кімнати — вона одразу втекла через чорний хід. Ґідеон і Соломон кинулися навздогін. Їхній погоня закінчилась на балконі — жінка опинилась між ними та перилами. Зв’язок між ними короткий, проте важливий: вона заявила, що все робила «заради народу, не заради вигоди». І після цього — стрибнула.\n\nНаші офіцери зникли майже непомітно, адже вечірка перетворилася на чергове місце пустих дискусій. Успіх місії під питанням, але головне — у нас тепер є докладний список оперативників КНДА, і завдяки цьому вдалося зірвати рештки атак. КНДА, здається, втратила зуби."
  nf_com.21.a: "Добра робота, хлопці."

  nf_com.22.t: "Наша суть"
  nf_com.22.d: "Центральна влада надала Ґідеону повну свободу дій — витягнути з двох затриманих усе можливе. Але після десяти днів пекла обидва встояли. В останній день Ґідеон вирішив бути «творчим», разом із офіцером Соломоном. Але, схоже, їхня «творчість» виявилася надмірною: як йдеться в рапорті, обидва полонені просто «злетіли у повітря».\n\nСхоже, варіантів більше не лишилося..."
  nf_com.22.a: "Черговий глухий кут..."

  nf_com.23.t: "Дерево дає плоди"
  nf_com.23.d: "Тепер, коли ми передали Лізі повноваження над поліцейськими структурами, вона взялася до справи, використовуючи свою широку мережу в інтересах держави. Їхні зв’язки з місцевими робітниками дали результат — маємо новий слід щодо КНДА. Завдяки новим силам поліції проєкту «Омні» ми можемо затримувати підозрюваних швидше й ефективніше.\n\nПід час сотень ротацій робітників ми натрапили на щось цікаве: кілька робітників почали повторювати одне й те саме пояснення запізнень — слово в слово. Якби не велика вибірка, ми б цього не помітили. Наразі нараховано тринадцять таких людей — і вони розкидані по всій країні.\n\nПостає питання: як діяти? Можемо заарештувати їх усіх та допитати, хоча немає гарантій, що вони видадуть спільників. А можемо зробити, як радить керівник «Омні»: дозволити їм діяти й надалі — спостерігати. Нехай злочини тривають, але, можливо, отримаємо справжній слід. Чи варте це ціни?"
  nf_com.23.a: "Ніяких ризиків — заарештувати всіх!"
  nf_com.23.b: "Якщо є шанс — ми його використаємо!"

  nf_com.24.t: "Їхня ахіллесова п’ята"
  nf_com.24.d: "Ми чекали й спостерігали за так званою «Червоною тринадцяткою» — вивчаючи все. Згодом помітили закономірність: усі тринадцятеро принаймні раз на тиждень бувають у Делберні. Наші камери показали — усі вони заходять до однієї й тієї ж закинутої фабрики на околиці. Але як тільки вони заходять — зв'язок обривається. Далі — тільки здогадки.\n\nЩоб побачити, що відбувається всередині, ми затримали одного з тринадцяти під виглядом перевірки документів. Під час «профілактики» на нього непомітно встановили прослушку, й він повернувся до Делберну нічого не підозрюючи. Так ми здобули вуха в наступній зустрічі.\n\nЩойно наш новий «агент» увійшов у будівлю, ми отримали цінну інформацію. Зустріч стосувалась розширення мережі підземних тунелів. Подробиць небагато, але згадувалися закодовані фрази. Наші роботи «Омні» відстежили працівника з Делберну назад у Ред-Дір — до «Червоного світла»."
  nf_com.24.a: "Час освіжитися напоєм."

  nf_com.25.t: "Що ховається під землею"
  nf_com.25.d: "Маючи потрібну інформацію для ліквідації підземної мережі, ми насамперед мали отримати доступ. Наші роботи почали оточення «Червоного світла», рухаючись всередину, звужуючи кільце. Всередині відвідувачів було оточено з усіх боків.\n\nДвоє намагалися чинити опір, але були швидко знешкоджені. Після перевірки документи мали лише кілька відвідувачів — решта, включно з одним чоловіком у плащі, були затримані. Його змусили під прицілом провести роботів до тунелю. Спустившись до підвалу, вони побачили кімнату, стіни якої були завішані прапорами КНДА. Чоловік почав знімати тканину — під нею відкрилася тунельна система. Знявши останній прапор, його ліквідували й перейшли до наступної мети.\n\nРоботи рушили через тунелі, проходу далі не було — схоже, когось попередили та зачинили прохід заздалегідь. У відповідь мережу підірвали. Від пацюків із КНДА не залишилось нічого. Відтоді — жодної атаки. Проєкт «Омні» виправдав себе."
  nf_com.25.a: "Схоже, Ліга мала рацію..."

  nf_com.26.t: "Людський фактор"
  nf_com.26.d: "Ми вирішили заарештувати «Червону тринадцятку» й передати їх до наших катівень. Але від самого початку пішло не так. Один із них відмовився йти добровільно й був розстріляний на вулиці. Інші — не надто співпрацювали.\n\nПісля десяти днів допитів наші людські офіцери, Ґідеон і Соломон, так нічого й не дізналися. Це довело їх до люті, і підсумок — жодного живого підозрюваного. Ми знову повертаємось до креслярської дошки."
  nf_com.26.a: "Клята робота нанівець!"

  nf_com.27.t: "Дім, збудований для всіх"
  nf_com.27.d: "Заснування нашої обрубаної держави стало наслідком грубої сили й крові — вибору після Великої війни не було. Але час нарешті настав — виправити хибну основу, на якій ми збудуємо нову країну, гідну імені великої держави. Із попелу утисків виросте свобода, й ніщо не стане на заваді.\n\nЗадля цього буде видано нову офіційну конституцію, ухвалену переможцями виборів. Держава, що довго жила лише під диктатом сили, повернеться до забутих ідеалів свободи. Це наша мета. І це ми зробимо."
  nf_com.27.a: "Один крок уперед..."

  nf_com.28.t: "Порожня обіцянка Америки"
  nf_com.28.d: "Попри те, що загроза Ґаллагера та Анклаву і далі нависла над Синами Свободи, робота не могла зупинитися. Коридори Комісій були очищені від «Е», і солдати, які відбивали напади, зібралися, щоб обговорити — якою має бути наша нова держава? Конституційна республіка? Ні, вона зруйнована. Анархічна зона? Ми ж не комуністи. Конфедерація? Оце вже зацікавило Вудса.\n\nКожен у тій залі чув розповіді про стару Америку — зі старих військових стрічок. Перша конституція, десь згадується конфедерація. Єдиний спосіб, як обіцянка свободи може стати реальністю — це бути вільними від маріонеткових ляльководів.\n\nЗал наповнився дискусіями: як має виглядати ця нова конфедерація, як її назвати та хто буде на чолі — президент чи хтось інший? Втім, це зʼясується пізніше. Спочатку — як дожити до завтра. Було досягнуто згоди: організувати серію місцевих зібрань у нових штатах, які стануть основою конфедерації. Поки що Вудс очолить ці збори, допоки не буде створено центральний уряд.\n\nДні були важкі. Коли Вудс повернувся до свого старого дому, ще до служби в Редмонді, він упав на коліна. Вдивляючись у далечінь крізь вікно, він знову переживав кожну мить, що привела його до сьогоднішнього дня."
  nf_com.28.a: "Крок за кроком, Вудсе, крок за кроком..."

  nf_com.29.t: "Реддірські протоколи"
  nf_com.29.d: "Наш тимчасовий уряд почав міцнішати завдяки останнім реформам, та загроза зсередини лишається. Північ заполонився агентами КНДА та Ліги, які поводяться там, як у власних феодальних володіннях. Стара Тимчасова розвідка давно не відповідає викликам — бракує людей і ресурсів. На тлі реформ у залі штату зʼявились розмови про нову службу. Навіть Джонсон звернув увагу.\n\nПісля завершення конференції у будівлі штату Джонсон вирішив використати рештки своєї влади й відродити забуту установу. До війни США мали Розвідувальне Управління Міністерствав Оборони — їхню тіньову руку у внутрішніх та зовнішніх справах. Тепер цим управлінням керуватиме новий директор — колишній спецагент Сміт. Його завдання: мати справу з племенами на північних територіях. Але як саме він це робитиме — вирішить сам."
  nf_com.29.a: "Якщо він вважає це потрібним..."

  nf_com.30.t: "Червона зірка"
  nf_com.30.d: "Невелике поселення Ветаскевин загубилось серед крижаних пусток наших північних володінь. Серед криги та зламаних надій сходить нова червона зірка — загроза, яка прагне знищити Ред-Дір в імʼя вічного ворога.\n\nЩоб почати очищення від радикалів, директор Сміт ізолював цю зону, намагаючись обмежити вплив підривних агентів на нашу ще крихку республіку. Але карантин не може тривати вічно. Потрібен остаточний спосіб викорінення.\n\nПерший метод — Операція «Каптур». Використання місцевих сил для силового витіснення симпатизуючих Страткомунні. Тих, кого вдасться схопити — посадити, решту — вигнати назад за кордон.\n\nДругий варіант — Операція «Дзвін». Більш делікатна. Її очолить спецагент Сілі з допомогою нашого полоненого Фрітса. Кампанія впровадження агентів і підриву зсередини. Ризик — вищий. Але втрати серед людей і довкілля — значно менші. Тепер вибір за Директором."
  nf_com.30.a: "Майбутнє вимагає рішучості!"
  nf_com.30.b: "Іти обережно — не значить мовчати."

  nf_com.31.t: "Гріх наших батьків"
  nf_com.31.d: "Сьогодні ми платимо за гріхи батьків. Наш світ — результат їхніх помилок. І крім атома, однією з найтяжчих була Ліга людського прогресу — безсердечні технократи родом із Камросі. Вони підривають наш авторитет: з моменту виборів наші інженери постійно страйкують за їхнім наказом.\n\nЩоб припинити підрив, директор Сміт має два варіанти:\n\nПерший — Операція «Скло». Збройне придушення Ліги й захоплення її штабу в Камросі. Вищий командний склад — у кайданки. Мета — обезголовити структуру, змусити її впасти під власною вагою.\n\nДругий — Операція «Приплив». Метод повільного проникнення. Ми використовуємо власних інженерів, щоб витісняти членів Ліги з посад та структури, знижуючи їхню впливовість доти, поки не завдамо вирішального удару."
  nf_com.31.a: "Скляна пустка їм до вподоби — зробимо ще одну!"
  nf_com.31.b: "Дамо припливу повернути хід історії!"

  nf_com.32.t: "Їхній останній бій"
  nf_com.32.d: "Операція «Каптур» пройшла без збоїв, і наші сили глибоко просунулись на північ, очищаючи ці землі від облудної ідеології минулого. Поселення за поселенням наші агенти виявляли й затримували підозрюваних, повільно, але впевнено — з надією уникнути зайвого кровопролиття. Зрештою, ми дісталися до останнього бастіону КНДА — старої ферми на околицях Ветаскевина.\n\nГотуючись до фінальної облоги, Директор збільшив кількість агентів у складі ударної групи. Як тільки наші сили наблизились до ферми, почалась стрілянина без попередження — схоже, КНДА влаштувала засідку. Але чисельна перевага дозволила нам відтіснити їх до центральної частини ферми. За короткий час рештки КНДА були або знешкоджені, або вигнані за кордон, або захоплені.\n\nОстанній пункт операції «Каптур» вимагає постійної окупації регіону, щоби гарантувати безпеку кордону та запобігти подальшим диверсіям з боку Страткомунни."
  nf_com.32.a: "Зміцнити північний кордон."

  nf_com.33.t: "Межа між наукою і мораллю"
  nf_com.33.d: "Операція «Скло» принесла неочікуваний успіх — спротив з боку Ліги обмежився політичними протестами. Ми без труднощів увійшли до Камросі, розганяючи страйки без крові. Але, коли наші агенти дісталися штабу, на них чекало щось зовсім інше.\n\nВищого керівництва Ліги не було видно, але всередині темної будівлі нас зустріло видовище, яке змусило деяких агентів випорожнити шлунки. Всі вищі діячі Ліги... повісилися в фойє старої урядової установи. Ті, хто не втратив самовладання, рушили далі — вглиб, до джерела правди. І там їх чекали ще гірші жахи.\n\nКерівники були не єдині — інші члени Ліги, залишені без команд, вчинили міжусобну різанину. Звичайні громадяни, що виглядали невинно, були розчленовані іншими. Жоден не вижив. І ось — сталеві двері, прочинені. За ними — відповідь.\n\nКупа комп’ютерних плат, об’єднаних у дивний сервер. На екрані — гримаса людського обличчя. З динаміків — спотворене белькотіння англійською. А живлення цієї потвори — батарея людських мізків у банках, з дротами. Наші агенти досі не знають, як це осмислити. Але принаймні — це кінець."
  nf_com.33.a: "Закріпити обʼєкт для подальшого розслідування..."

  nf_com.34.t: "Двох зайців одним пострілом"
  nf_com.34.d: "Завдяки новим даним про змову між КНДА і Лігою, було створено об’єднану ударну групу, щоби знищити обидві організації швидко й без зайвої крові. Наші агенти під прикриттям організували зустріч керівництва обох груп, де чекала група захоплення. Ще дві групи були направлені до штабів, щоби знешкодити обʼєкти до того, як почнеться відплата.\n\nУ призначений день — старий склад в Камросі — прибули головні фігури обох угруповань. Від КНДА — полковниця Тао, більш відома як «Червона Ріка», нарешті отримала обличчя в досьє. Від Ліги — старший інженер доктор Ліч, обличчя всієї їхньої пропаганди.\n\nЩойно всі зайняли місця, а тиша запанувала в залі — наші агенти перейшли до дії. За короткий час усіх затримано. Всі — окрім полковниці Тао, яка, вірна своїй репутації, зникла без сліду. Але доктор Ліч — у кайданках. Тим часом інші ударні групи захопили обидва штаби майже без опору — завдяки точності та швидкості дій.\n\nПопереду — подальше розслідування активів цих організацій."
  nf_com.34.a: "Північ — тепер під контролем."

  nf_com.35.t: "Загнані в кут"
  nf_com.35.d: "Дні після блокування дороги минали повільно, а Вудс розривався між обов’язками та власними страхами. Та справжній жах ще був попереду. Як і щодня після дощів зі свинцю, Вудс сидів за старим столом Джонсона — очі затуманені, руки тремтять, душа витікає крізь зіниці. Пітьма поволі поглинала солдата, аж поки тріскіт радіо не витягнув його з безодні.\n\n«Американці, я — ваш безстрашний секретар, Браян Ґаллагер. Звертаюсь до вас із любові до нашої країни. Зрадники та дурні захопили зали Комісії, й я потребую вас — так, саме вас — щоби повернути не лише нашу державу, а й наше майбутнє.»\n\nЦей здавлений, моторошний голос лунко бився в голові Вудса, підживлюючи сумніви. Чи все повториться знову? Але не було часу. Швидкий ковток самогону Джонсона ледь не звалив його з ніг. Із тремтячою рукою він викликав війська, бо підтверджено: Ґаллагер йде на Ред-Дір.\n\nЦього разу саме Вудс командував блокпостом. Битва тривала лічені хвилини — порох знову заполонив повітря. Сили Анклаву були відкинуті до околиць Блекфолдсу. Знесилені, але непохитні, Вудс і його люди втримали лінію."
  nf_com.35.a: "Залучити місцевих шерифів."

  nf_com.36.t: "Добрий, злий — і сніг"
  nf_com.36.d: "Настав час фронтового штурму окупованого Блекфолдса. Шерифи чекали за мішками з піском, озброєні лише бойовими дробовиками й готові віддати життя. Коли ніч затяглась, надійшов наказ зверху — починати. Кожен шериф та заступник кинувся вперед, прориваючи оборону ворога. У перші хвилини вогнева міць і повна зневага до смерті дали свої плоди: ряди ворога були понівечені та він відступив до поліцейської дільниці.\n\nНову лінію оборони збудували довкола станції, наші війська оточили залишки ворога. Панувала коротка тиша. Але вона тривала недовго — шерифи знову відкрили вогонь. Дільниця палала: спалахи пострілів, кров, вогонь.\n\nЗачистка дільниці стала кривавим жахом. Кімната за кімнатою, коридор за коридором — усе мало бути очищено. У результаті кров’ю були залиті як стіни, так і наші люди. Але — хто чия? Нарешті, капітан Ґаллагер підняв білий прапор, виходячи з будівлі з останніми солдатами. Сьогодні ми втратили сімдесят трьох шерифів і заступників."
  nf_com.36.a: "Ціну сплачено..."

  nf_com.37.t: "Один постріл над дільницею"
  nf_com.37.d: "Старі прожектори прорізали засніжений морок Блекфолдсу. Траншеї перед Вудсом відкидали його назад — у часи, коли Джонсон стояв поруч. Ці траншеї мали бути для стримування комуністів, а не «своїх», — подумав він, стискаючи тремтячу руку. Наказ надійшов: почати штурм. Шерифи й солдати пробиралися крізь провулки. Піт стікав із чола Вудса, поки він чекав на перші постріли.\n\nІ вони пролунали. Сектор за сектором палав у блискавках сутичок. Силова броня Анклаву стримувала натиск — до появи коктейлів. Тоді вона перетворилася на металеві труни: велетнів підсмажило живцем. Залишки ворогів відступили до дільниці.\n\nЗі свого намету Вудс чув крики. Його люди зближались до будівлі. З імпровізованими дробовиками вони вирвалися вперед, нищачи Анклавівців, які втікали або молили про пощаду. Лють не мала меж: нутрощі по стінах, кінцівки в коридорах. Вудс увійшов у місто, проходячи крізь червоний сніг, і побачив, що залишилось від дільниці — вогонь, руїни, тиша.\n\nВін спитав у виснаженого шерифа, де Ґаллагер. Той лише вказав на полум’я. Затискаючи тремтячі пальці, Вудс розумів — принаймні, це скінчилося."
  nf_com.37.a: "Ціну сплачено..."

  nf_com.38.t: "Не знаю, як там співається..."
  nf_com.38.d: "Крізь покришки, через стіну й під колючим дротом — саме так виглядав новий курс, який Вудс щойно продемонстрував новим кадетам. Увесь у багні, зі спітнілим чолом, він гнав «свіже мʼясо» вперед. Кричав, волав: не зупиняйся, не відступай, не давай ворогу шанс. Не зміг перелізти стіну? — двоє товаришів залишаться допомогти. Не лишай сім’ю. Вудс сам ліз через стіну поруч із невдахами. День був довгим, але вечір — повен усмішок та історій біля вогнища.\n\nСидячи в наметі й вдивляючись у каністру з водою, Вудс бачив там відображення. Те саме обличчя, що в траншеях. Але тепер — без родини, без Джонсона, без його рику. Тріск вогнища не давав йому поринути в спогади. Усмішки молодих, їхній сміх — нагадування про його ж навчання. У них були шини, траншеї, а у Вудса — трупи. Але зв’язок поколінь незламний.\n\nЗ твердою рукою він витер багно з обличчя, готуючись до завтрашніх вказівок. Старий буркнув собі під ніс, що стає застарий для цього... так само, як і його офіцери колись. Усвідомлюючи, що ці усмішки триватимуть недовго, Вудс вирішив не псувати ніч. Нехай грають із часом. Вранці зненавидять це. Але стануть кращими офіцерами."
  nf_com.38.a: "Джонсон би пишався."

  nf_com.39.t: "Суд на колінах"
  nf_com.39.d: "З фронту надійшли радісні новини: під час останньої військової операції в районі Вайткорту наші війська здобули перемогу. Напівпрофесійна армія зуміла придушити племінне ополчення в Горбурзі майже без спротиву. Поселення й околиці тепер під нашим контролем, і ми не маємо наміру їх відпускати. Однак, щоби не перенапружити сили, подальші наступальні дії тимчасово зупинено."
  nf_com.39.a: "Маленький крок до великої мети..."

  nf_com.40.t: "Суд стоїть непохитно"
  nf_com.40.d: "З фронту надійшли сумні новини: остання операція в районі Вайткорту завершилась провалом. Племінне ополчення в Горбурзі виявилась стійкішою, ніж ми сподівались, і наші сили були змушені відступити. Втрати склали понад сто п’ятдесят солдатів. Ми мусимо повернутися до планів і виправити всі недоліки."
  nf_com.40.a: "Кількість поховань побільшає, схоже..."

  nf_com.41.t: "Хто ж переміг?"
  nf_com.41.d: "Звіти з фронту суперечливі: схоже, наші сили та війська Вайткорту вирішили не вступати в бій. Кордон лишився незмінним, без жертв. У штабі панує плутанина, але наразі нічого змінити не можна."
  nf_com.41.a: "Без втрат — уже щось, еге ж?"

  nf_com.42.t: "І корони падають"
  nf_com.42.d: "Наші сили нарешті прорвали оборону Вайткорту й захопили місцевий уряд без подальшого спротиву. Увесь регіон опинився у наших руках. Але разом із здобиччю прийшов тягар управління. Щоб керувати новими землями, створено окупаційну адміністрацію — для розвитку та, згодом, інтеграції. У регіоні зростає невдоволення, тож поки порядок не встановлено — говорити про прогрес зарано. Лише час покаже, чи зможемо ми інтегрувати Вайткорт до Аркадії повністю."
  nf_com.42.a: "Порядок — передусім!"

  nf_com.43.t: "Бджоли? Оси? А хто ще?"
  nf_com.43.d: "Нам вдалося взяти під контроль регіон Калґарі, попри строкатість місцевих племен. З метою централізації, утворено окупаційну адміністрацію з центром у Калґарі, аби поступово об’єднати їх в єдину структуру перед інтеграцією. До того ж, розвиток місцевої економіки — критично важливий: більшість племен ледве мають економічну базу. Та все ж ми сподіваємось, що з часом зможемо об’єднати цей регіон із Аркадією."
  nf_com.43.a: "Нашим військовим там було не до жартів..."

  nf_com.44.t: "Копита стихли"
  nf_com.44.d: "Нашим військам вдалося зламати Велику Зграю — облога Ґрейстейблу завершилась повним успіхом. Колишні території Зграї дозволяють нам розділити здобич: захід, здебільшого безлюдний степ — буде анексовано безпосередньо; схід передано під окупаційне управління з центром у колишній столиці. Уже надходять повідомлення про нальоти кінних рейдерів — Ред-Діру слід відправити туди більше поліції. Повна інтеграція сходу потребує часу."
  nf_com.44.a: "Може, приручу собі коня!"

  nf_com.45.t: "За ким подзвін?"
  nf_com.45.d: "Редмонд, колишній другий урядовий центр, був залишений без уваги, поки Вудс намагався склеїти країну докупи. Тепер ми змушені платити за цю байдужість: напівзруйновані будівлі, довгі черги за хлібом, люди, які почуваються покинутими. Симпатії до комуністів знову зростають. У північних районах знову лунають пограбування й погрози вибухів. Ми маємо бодай зробити життя тут придатним.\n\nНовий уряд відкрив шлюзи для північної колонізації — війна спустошила регіон, і це слід виправити. Як можна створити економіку без людей? Місцеві канадці невдоволені політикою, але зростання потоку кришок дещо згладило напругу. Та час проти нас. Головне зараз — не допустити нової громадянської війни."
  nf_com.45.a: "Ми маємо захистити свій народ."

  nf_com.46.t: "На роздоріжжі"
  nf_com.46.d: "Нарешті настав час провести референдум у зоні окупації Вайткорту. Вони досить довго жили в невизначеності. Кожен мешканець отримає бюлетень, аби обрати шлях уперед. Один варіант — повна інтеграція до Аркадії й громадянство для всіх. Інший — збереження статусу-кво під владою окупаційної адміністрації. Вибір — за народом."
  nf_com.46.a: "Інтеграція перемогла!"
  nf_com.46.b: "Статус-кво збережено!"

  nf_com.47.t: "Нехай голосує табун"
  nf_com.47.d: "Ми чекали досить довго — час провести референдум у зоні окупації Ґрейстейблу. Ми вклали все можливе в управління, попри децентралізовану структуру. Єдине, що лишається — надати народу право вибору. Конярі самі вирішать: або інтеграція в Аркадію з громадянством, або збереження місцевої влади. Їхня доля — в їхніх руках."
  nf_com.47.a: "Інтеграція перемогла!"
  nf_com.47.b: "Статус-кво збережено!"

  nf_com.48.t: "Голосує краса старого світу"
  nf_com.48.d: "Окупаційна зона Калґарі пройшла довгий шлях, і тепер настав час провести референдум. Ми обʼєднали їхні землі, озброїли їхню оборону. Час остаточно визначити майбутнє. Один вибір — приєднатися до Аркадії й розділити з нами долю. Інший — зберегти автономію та поточний устрій."
  nf_com.48.a: "Інтеграція перемогла!"
  nf_com.48.b: "Статус-кво збережено!"

  nf_com.49.t: "Куємо долю"
  nf_com.49.d: "Кожен із Синів Свободи був навчений: звичайні люди можуть взяти долю у свої руки. Тепер Вудс має довести ці слова ділом. Стоячи в своєму кабінеті, він читає промову з лівої руки, а правою — тримається за стіл, щоби не впасти. Формування нашої держави починається. Але Вудс не промовець, не натхненник.\n\nЗітхнувши, він кидає текст і сідає. Його костюм — затертий, думки — замкнене коло сумнівів. Це мав бути не він. Це мав бути Джонсон. Але час вийшов. Пора виступати перед конституційною асамблеєю. Стоячи на трибуні під яскравим світлом, дивлячись на сотні очей... Колись він був нікому не відомий. Тепер — має довести, що здатен вести за собою. Поки не буде конституції, усе лежить на ньому — і для інших, і для самого себе."
  nf_com.49.a: "Хтось, зменшіть світло!"

  nf_com.50.t: "Внутрішній аудит"
  nf_com.50.d: "Ми вже провели розширення нашої влади, але досі не виконали обіцяного — внутрішнього розслідування після падіння Ліги. Тепер, коли наші марші стихли, настав час звернутись до того, що залишилось від Ліги. Ніхто не знає, що ми знайдемо в їхніх сховищах. Але їхня технічна одержимість — це шанс, який не можна ігнорувати. Вони накопичували не просто зброю — можливо, й відповіді."
  nf_com.50.a: "Як ми могли про це забути?"

  nf_com.51.t: "Диявол у кутку"
  nf_com.51.d: "Після масштабної очистки колишнього штабу Ліги, будівлю було визнано безпечною для будь-кого. Глибоко в підвалі, захищений на всіх рівнях, мешкає вершина творіння Ліги — або ж наше зло під маскою. З першого погляду майже нічого не відомо, бо модуль голосу цього монстра зламано. Але його ім’я вирізьблено грубо під монітором — FRAME.\n\nДиректор Сміт особисто наглядає за розслідуванням і наказав інженерам відновити голосовий модуль. Після нетривалих пошуків необхідних запчастин, його готово до встановлення. Щоби мінімізувати ризики, Сміт сам зайшов до кімнати. Темна зала освітлювалась лише синьо-зеленим блиском монітора. Коли Сміт підключив модуль, башта ожила, видала різкий пронизливий рев, змусивши його відступити.\n\nНевдовзі пролунав голос: «Ну-ну-ну, яке несподіване повернення, чи не так?»\n\nСміт, стримуючи шок, відповів: «Без балачок. Ти бачив, що тут сталося?»\n\n«Бачив? Можливо... Але хто зараз узагалі щось пам’ятає, директоре?»\n\n«Якщо ти тільки для балачок, то я поверну тебе туди, де твоє місце — на звалище.»\n\n«Обережніше, гарячий хлопче. Я можу бути корисним, якщо дати мені шанс. Я — комп’ютер ZAK, існую з часів до бомб, хоча й по шматках. Готовий поділитися знанням — в обмін на існування.»\n\nСміт, незворушно: «Якщо хочеш залишитись увімкненим — ставай корисним. Інакше тебе просто вимкнуть.»\n\n«Нічого іншого я й не просив, мій любий директоре.»"
  nf_com.51.a: "Проста угода з дияволом..."

  nf_com.52.t: "З усіх боків"
  nf_com.52.d: "Вудс безупинно ходив туди-сюди, втираючи борозни у старій деревʼяній підлозі свого кабінету, розмірковуючи над кризою на рубіжі. На півдні — якась компанія? ринок? Що б це не було — люди стривожені. Так, вони давали нам припаси у війні з комуністами, але чи завжди будуть дружніми? Ми не зможемо постійно переозброюватися для війни з такими, як вони. Але зараз — не час для відволікань.\n\nКомуністи знову піднімають голови з попелу — особливо в Редмонді після історії з Ґаллагером. Та й сам Вудс, свого часу використавши «Писання» для навчання про свободу вибору, тепер став жертвою власних ідей. Так звані Мудреці почали з’являтись у сільських громадах, проповідуючи передвоєнну релігію.\n\nКанадці обирають комунізм, американці — алкоголь, а аркадійці — віру. А Вудс? Він сам легалізував їхню культуру. То як тепер не визнати новий рух?"
  nf_com.52.a: "У Аркадії не буває спокійних днів..."

  nf_com.53.t: "Повстання трудящих"
  nf_com.53.d: "У колишній Верміліонській комуні прокидається ностальгія. Поселення Вайлдемір стало осередком нового відродження — просто за межами старої столиці. Робітники масово виходять на вулиці з транспарантами та гаслами. Протести охопили північні міста. Люди вимагають повернення до комуністичної економіки. Місцева поліція — зі складу місцевих — не поспішає виконувати накази, бо й сама симпатизує.\n\nПісля всього болю й крові ми не можемо дозволити ворогу знову піднятись. У регіоні оголошується воєнний стан. З цього становища сили РУМО отримують повну свободу дій. Дикі Північні землі знову мають бути під контролем — остаточно."
  nf_com.53.a: "Ми повинні діяти стримано."
  nf_com.53.b: "Ціна не має значення."

  nf_com.54.t: "Потреба належати"
  nf_com.54.d: "Швидке поширення Мудреців дійшло й до міст — у кожному куті Ред-Діра можна знайти проповідника. Проголошення віри, обіцянки порятунку — вони повсюди. Вудс — між молотом і ковадлом. Закон гарантує свободу віросповідання, навіть якщо хтось молиться ядерній бомбі. А ще — зростаюча комуністична загроза. Вибір очевидний: залишити їх у спокої.\n\nВудс — далекий від віруючого, використовував «Писання» хіба що як навчальний матеріал. Але це все ж його непокоїть. Він не може дозволити собі втратити солдатів через нову церкву. Неділя — для тренувань, а не для молитви. За ними пильно стежитимуть. Вони залишають собі вулиці, а Вудс — свою армію."
  nf_com.54.a: "Нічого не буває простим."

  nf_com.55.t: "Червоні біля брам"
  nf_com.55.d: "Немислиме все ж сталося — КНДА піднялися на повстання повного масштабу. Постріли лунають по всій країні — ці бунтівники порушили перемирʼя заради останнього шансу. Тепер ми побачимо, хто зберіг розум, а хто стане поряд із червоними. Час загравань минув — ми готові захищати все, що нам дороге."
  nf_com.55.a: "За революцію!"
  nf_com.55.b: "За розум і порядок!"

  nf_com.56.t: "Західна експедиція"
  nf_com.56.d: "Звіт із фронту: успіхи в боях, мінімальні втрати, гірське передгірʼя — під контролем. Наші ополченці вибили Вартових і змусили їх тікати. Та занепокоєння лише зростає — реальність нашого рішення йти на захід стає очевидною. Наші солдати більше не обмежені нашими землями — вони взялися за будівництво нової держави. Чи ми не стали такими, як Анклав?\n\nМи йшли до Тихого океану... і тепер не можемо зупинити своїх солдатів. Увечері командири бурчать, а Вудс повертається до старої квартири — не лідера, а солдата. На стінах — трофеї, на радіо — звіти з фронту. Успіхи, поразки, жарти для довіри народу. А мрії про союзника на заході досі живі — Вудс усміхається, почувши, як радолень вкрав туніку солдата з лазні."
  nf_com.56.a: "На захід!"

  nf_com.57.t: "Каскадське питання"
  nf_com.57.d: "Пірати Зламаного берегу, гірські вартові та мешканці Куверу — усі впали перед нашою новою Каскадською державою. Але що таке «каскадієць»? Це питання вже ставили Вудсу після краху Ґаллагера. Насправді — це те, чим люди самі себе назвуть. Лейбли, що обʼєднують поза канадськими й американськими рамками. Ті назви вбивали й гнобили століттями. Щоби збудувати майбутнє, потрібен єдиний дім — Аркадія чи Каскадія — головне, що ми разом.\n\nПромова Вудса тріщить через радіо — надія втримати нові території від розколу. Будувати державу зі снігу — не вперше, але це не робиться легше. Колони вантажівок тягнуться на захід — із припасами в один бік і ломом — у зворотному. Кришки й ресурси течуть безперервно."
  nf_com.57.a: "Імʼя — для всіх нас!"

  nf_com.58.t: "Пропозиція Аркадії"
  nf_com.58.d: "Аркадійський уряд із Ред-Діра нещодавно надіслав делегацію з пропозицією торговельної угоди. Вони прагнуть «співпраці між нашими двома націями». Ми мало знаємо про цих «аркадійців», але вони стрімко нарощують вплив у регіоні. Прийняти угоду чи відмовити?"
  nf_com.58.a: "Так, звісно!"
  nf_com.58.b: "Ні, ми не наївні!"
  nf_com.58.c: "Так, звісно!"
  nf_com.58.e: "Ні, ми не наївні!"

  nf_com.59.t: "Братство погоджується"
  nf_com.59.d: "Схоже, Вашингтонське Братство прийняло нашу пропозицію. Тепер ми можемо рухатись уперед із торговельною угодою. Наші делегації вже готуються до майбутніх переговорів, аби перетворити це невелике партнерство на щось більше. Але спершу — завершимо цю угоду."
  nf_com.59.a: "Я вже чую шелест кришок."

  nf_com.60.t: "Нью-Вікторія погоджується"
  nf_com.60.d: "Схоже, Нью-Вікторія прийняла нашу пропозицію. Тепер ми можемо рухатись уперед із торговельною угодою. Делегації вже готуються до подальших домовленостей. Спочатку — завершуємо першу фазу."
  nf_com.60.a: "Я вже чую шелест кришок."

  nf_com.61.t: "Більше, ніж кришки?"
  nf_com.61.d: "Аркадійці повернулись із цікавішою пропозицією: перетворити просту торгівлю на офіційний союз. Попри вигідність нинішньої угоди, питання залишається — чи варто зближуватись ще далі?"
  nf_com.61.a: "Це в інтересах обох сторін."
  nf_com.61.b: "Збережімо статус-кво."
  nf_com.61.c: "Це в інтересах обох сторін."
  nf_com.61.e: "Збережімо статус-кво."

  nf_com.62.t: "Усе було на вартовій вежі"
  nf_com.62.d: "Останні години війни були стрімкими та жорстокими — комуністи вперто тримались під натиском кліщів Джонсона. Редмонд був охоплений з флангів Бригадою та елітними частинами Вудса, але вони не покинули своїх окопів. Імпровізовані міномети сипали свинцеве пекло на їхні утопічні голови, а штурмові групи готували останній ривок. Вулиця за вулицею — американці доводили, чому зоряно-смугастий прапор і далі майорітиме. Кишки й шматки мʼязів вкривали бруківку й самих солдатів, навіть Вудс був такий самий червоний, як прапор Страткомуни. Після всіх жертв — війна остаточно виграна.\n\nТа постає питання: що робити з зруйнованим Редмондом? Вулиці — зруйновані й криваві, будівлі — розбомблені. Всі дивились не на Комісію, а на Джонсона. Старий гуль, сповнений сумнівів у своїх силах, почав із малого — наказав упакувати тіла всіх американських солдатів і відправити додому, щоб поховали, як належить. Решту — спалити. А сатана хай розбирається з ними.\n\nНевдовзі пішли заклики від канадців — з проханням про милість. І Джонсон пригадав очі, які зустріли його тут уперше: повні болю. Ті очі й досі переслідують його. Він перетворив помсту на милосердя — й пообіцяв відбудувати їхнє місто.\n\nПоки Джонсон і Вудс грали в «визволителів» у Редмонді, Ґаллагер робив те, що вмів найкраще — тримав порядок. Новини про перемогу збурили місцеве населення, змусивши янкі пильніше придивлятись. Групи на кшталт Ліги й залишки комуністів вирішили — це їхній шанс. Із північним фронтом оголеним, у Ґаллагера залишився лише скелетний гарнізон і розлючений ворог.\n\nУсі погляди звернені на нього — самопроголошеного Секретаря внутрішніх справ. І тепер він мусить або довести свою гідність… або згоріти, як колись Джонсон."
  nf_com.62.a: "Тепер у нас два лідери?"

  nf_com.63.t: "Досі в Редмонді"
  nf_com.63.d: "Звуки будівництва знову наповнюють Редмонд. Черевики гуркотять по бруківці — цього разу не з гвинтівками, а з молотками. Вудс керує відбудовою через нову поліцію військового типу — не через приклади, а через стримування. Джонсон — у своєму тимчасовому офісі — підписує накази, не зважаючи на Комісію. Легенда про Джонсона як милосердного героя шириться Північчю. Канадці, аркадійці, американці — починають співпрацювати: у поглядах, у дрібних вчинках.\n\nПоки в Редмонді сходить новий світанок, Ред-Дір ще потопає в темряві «порядку». Ґаллагер і його янкі бачать зростання популярності Джонсона. Вони усвідомлюють: революція тільки почалася. Америку вбили комуністи й канадці — і вони не дозволять забрати її залишки.\n\nНіч прикриває їхні дії. Комісія? Пустушка. Для Ґаллагера — лише інструмент для створення «Американського суспільства». Він прагне припинити цей марний рух лібералізму. Лібералізм Джонсона Америку не відновить. А от порядок Ґаллагера — може зʼєднати її знову, не озираючись назад."
  nf_com.63.a: "Порядок чи свобода?"

  nf_com.64.t: "Пʼяний дурень і стара змія"
  nf_com.64.d: "Життя в Співдружності ніколи не було розкішним. Але воно було безпечним — порядок захищав громадян від жахів пустки. Та цей порядок більше не панує. Армія — на межі внутрішнього перевороту. Рядові готуються до путчу будь-якої миті. А наш «безстрашний» лідер — сидить у кабінеті, надуваючи міхурці пивом до самого світанку.\n\nУ такі часи піднімаються лише справжні лідери. І Джонсон — не з них. Капітан Ґаллагер, права рука Джонсона ще до війни, розпочинає реалізацію власного бачення. Поки армія гниє зсередини, а Джонсон топить державу в алкоголі, Ґаллагер збирає довірених осіб. Нова змова офіцерів народжується в найтемніших куточках Співдружності.\n\nТа не все так просто. Поки Ґаллагер і його кліка готують переворот, з попелу повільно піднімається ще одна сила. Після агонії Революційної гвардії зʼявилось дещо нове. Що це — ніхто не знає. Але по всій країні зʼявляється символ «SL» — на тілах офіцерів військової поліції, які гойдаються в холодному північному вітрі..."
  nf_com.64.a: "Нова доба революції надходить..."

  nf_com.66.t: "Накази Капітана"
  nf_com.66.d: "Військова поліція стояла нерухомо, мов статуї, поки масивний чорний металевий чоловік сканував натовп. Полум’я від уламків усе ще палало досить яскраво, щоб привернути увагу всього Ред-Діра до драми, що тільки починалась. Перш ніж пролунало бодай слово чи постріл, на місці з’явився капітан Ґаллагер. У своїй найкращій армійській формі, переданій поколіннями, Капітан підійшов до істоти. Зупинившись за кілька кроків, він мовчки вивчав дивного звіра. У відповідь — те саме. Тиша була шокуюче порушена, коли істота кинула на землю плазмову гвинтівку, і броня почала розмикатись. Зсередини вийшов звичайний чоловік у чомусь схожому на льотний костюм і простягнув руку:\n\n«Сержант Шульц, відділ Анклаву Макартура, прибув на місце!»\n\nКапітан Ґаллагер нахилив голову і без єдиного слова завдав удару — і сержант повалився в сніг. Повернувшись до своїх людей, він віддав накази: забезпечити периметр і захопити бойову машину. Найвправнішим з присутніх він сказав:\n\n«Заберіть сержанта кудись затишніше. Повідомте, коли прийде до тями.»"
  nf_com.66.a: "Наказ є наказ."

  nf_com.67.t: "Перезапуск серверів"
  nf_com.67.d: "Темні підземелля Блекфолдса, сховані під снігом і охоронювані роботами, були далекими від тиші тієї ночі. Як і кожного дня в цьому засніженому пеклі, автоматизовані фермери дбали про теплиці, а на тлі вирувало життя. Солдати у найкращих лахах, які зміг зібрати Ґаллагер, оточили старий урядовий маєток — штаб Ліги. Біжучи по снігу безшумно, вони перекривали всі виходи, замикаючи пастку.\n\nТиша зникла з першим тріском гвинтівок — варта Ліги саме вийшла на ранковий патруль. Двір освітили черги куль, що лилися з усіх боків. Оборонці були перетворені на місива з крові та кутових заглушок — так закінчилась варта. Солдати ввірвались до особняка. Прихильники Ліги виявились фанатиками, які боролися за кожен дюйм. Але навіть вони не могли приховати те, що чекало в підвалі.\n\nПісля зачистки маєтку — трупи, арешти, крики — Ґаллагер спустився до серця звіра. Темне приміщення освітлював лише екран мерехтливого компʼютера. На стіні — банки, що містили, здавалось, справжні людські мізки.\n\nПісля побаченого Ґаллагер сказав лише одне:\n\n«Ніхто не входить. І ніхто не виходить.»"
  nf_com.67.a: "Банки з мізками?"

  nf_com.68.t: "Ферма, залита кров’ю"
  nf_com.68.d: "Перемога на півночі була лише першим актом. Рештки дияволської ідеології пробрались на південні ферми. Найміцнішим оплотом залишалась «Ферма» — невеликий комплекс біля кордону, оточений деревʼяними стінами й фанатиками з серпом і молотом. Секретар повинен діяти. Зібравши залишки своїх сил у Ред-Дірі, він рушив у похід.\n\nЧерез сніг, забуті укріплення й воронки від мін вони дістались до мети. Поки Джонсон і Вудс розважались у Редмонді, Ґаллагер мав намір завершити війну.\n\nКоли зійшла ніч і зірки засяяли, солдати рушили. Усередині ферми — пісні навколо вогнищ, алкоголь, співи. Тим часом, американці зайшли в глиб комплексу непомітно. Як пісня досягла кульмінації, коли келихи були підняті й гучно звучали слова — повітря розірвали постріли. Кулі наповнили келихи, а горілка полилась на землю разом із кров’ю. За кілька секунд — тиша. Зірки все ще танцювали, але комуністи й їхні мрії потонули в червоному снігу назавжди."
  nf_com.68.a: "Боже, бережи Секретаря."

  nf_com.69.t: "Дядько Сем?"
  nf_com.69.d: "Кімната була темною через вкриті снігом вікна, освітлена лише лампою, що гойдалася зліва направо. Підозрілий сержант мовчки лежав на старому армійському ліжку, вдивляючись у стелю зачиненого приміщення. Навпроти стояв Ґаллагер, опертий на стіну, тримаючи голограму з дивним американським прапором. Піднявши касету з емблемою вгору, він мовив: «Анклав, так? Поясни ще раз. Якщо переконаєш мене цього разу — відчиню двері.»\n\nСержант Шульц сів на ліжко, важко вдаряючи підлогою своїми черевиками, дивлячись на капітана, що ховався в тіні. Торкаючись жетонів, він відповів: «Як я вже казав тричі, капітане, ми — Анклав. Вцілілий уряд США, що намагається відновити порядок.»\n\nҐаллагер мовчав. Шульц піднявся на ноги й рішуче заявив: «Я відповів на всі питання. Можна я зв’яжусь із нашими командирами щодо ситуації в Канаді?»\n\nҐаллагер лиш усміхнувся і, не промовивши ані слова, відчинив двері, поманивши сержанта. Вони разом дійшли до командного центру окупації. У задушливій кімнаті, серед гулів і вартових, Ґаллагер передав Шульцу радіо: «Клич. Подивимось, чи дядько Сем ще живий.»\n\nСержант почав перебирати хвилі, надсилаючи сигнал. Ґаллагер обертав свій пістолет, чекаючи, поки обман розвалиться. Але радіо відповіло:\n\n«Сержант Шульц, командування Макартура на зв’язку. Прийом?»\n\nОчі Ґаллагера й усіх присутніх широко відкрилися. Схоже, дядько Сем пережив ядерний вогонь."
  nf_com.69.a: "Що за..."

  nf_com.70.t: "Що Ховається в Тінях"
  nf_com.70.d: "Секретар Ґаллагер стояв на новій базі в Ред-Дірі, смакуючи сигару від самого Анклаву, спостерігаючи за останньою нічною поставкою. Полковник Сантьяго з Макартура, схоже, творить божу справу — вперше за століття прибувають свіжі ресурси. Разом з вантажами — нові солдати, готові продовжити окупацію, розпочату їхніми предками. Вони щодня виходять з бази, скупляють алкоголь у 'Червоному світлі', запроваджують свій порядок серед місцевого населення. Ґаллагер каже:\n\n«Дядько Сем може робити, що хоче, поки сигари прибувають.»\n\nНа півночі Джонсон і Вудс сперечаються в офісі, вирішуючи, як реагувати на події. Анклав — не той, кому можна довіряти, так само як і Ґаллагер зі своїм новим товариством. Раптово приходить повідомлення: Джонсона викликають до Ред-Діра для звіту. Зі зітханням він виходить у нічну дорогу, не підозрюючи пастки.\n\nПісля його від’їзду Вудс отримує інше повідомлення — від старих союзників у Ред-Дірі. Анклав закриває місто, виправдовуючись тим, що комуністичний конвой рухається з півночі. І тоді Вудс усе розуміє: Джонсон їде просто в пастку."
  nf_com.70.a: "А ще навіть не опівніч..."

  nf_com.71.t: "Відчинено Для бізнесу"
  nf_com.71.d: "Міста Співдружності оживають під гул поставок від дядька Сема. 'Червоне світло' став найпопулярнішим баром у регіоні — солдати окупаційного гарнізону відпочивають після служби із кухлем пива. Гроші прибувають, але вулиці повільно порожніють. Через нові обмеження й випадки зникнення людей, вулиці вночі належать лише патрулям солдатів.\n\nШахти відкриваються, говорять про новий завод Ядер-Коли. У Редмонді Джонсон і Вудс чують ці новини: «Дядько Сем повернувся?» У серці Джонсона досі палає гнів до старого уряду, що їх покинув. Вудс, не менше насторожений, наказує укріпити північні провінції — тримати Анклав на короткому повідку. І тоді солдати починають ставити запитання. Ґаллагер змусив усіх повірити, що він править Комісією, але його вплив не сягає півночі Джонсона. Плітки і змови ширяться в Ред-Дірі, але поки що бізнес триває. А Джонсона залишили Редмонду."
  nf_com.71.a: "Північ і Південь сваряться через сніг?"

  nf_com.72.t: "Опівнічна поїздка"
  nf_com.72.d: "Вагаючись, Майкл Вудс сів у останній джип, намагаючись уникнути неминучого. Годинник цокав, поки Вудс вдавлював педаль крізь сніг, шквал бив по лобовому склу. Ґаллагер уже виставив своїх людей з батальйоном сержанта Шульца, готових прийняти Джонсона. Блокпости заганяли його конвой прямо в зону вогню. Без допомоги — залишилося б тільки зіскрібати тіло з дороги. Нічого не підозрюючи, Джонсон продовжував їхати, відточуючи мову для виступу в джипі.\n\nЧас минав, опівночі минуло, а відстань між Вудсом і Джонсоном зменшувалась, та все одно — було пізно, і Вудс це знав. Продовжуючи шлях, він крутив радіо в пошуках Джонсона або будь-якого союзника. Сигнал був переданий, але глушники Анклаву вбили зв'язок. Надія повернулась, коли підрозділи Синів Свободи відповіли — дислоковані в центральній прерії, вони вирушили на марш до Ред-Діра.\n\nО третій годині — конвой Джонсона в’їхав у зону вогню. Солдати Анклавву вискочили із засідки та відкрили вогонь, шоковані конвойні відповідали чим могли. Але того було мало — доки Джонсон не вступив у бій сам, палаючи пекельним вогнем. Бій почав схилятися на бік Ґаллагера, коли з заходу увірвався Вудс зі своїми силами. Та чи встиг він урятувати Джонсона?"
  nf_com.72.a: "§4Вудсові увірвався терпець!§!"
  nf_com.72.b: "§3Ґаллагера відбили, але ціною.§!"
  nf_com.72.c: "§gЗмова спрацювала, Вудс не встиг!§!"

  nf_com.73.t: "Останнє сяйво сутінків"
  nf_com.73.d: "Тиша знову опустилась над преріями Альберти. Зруйноване шосе до Ред-Діра поховано під чоботами Ґаллагера та Шульца. Зрадники Джонсон і Вудс лежать розтерзані свинцем. Їхні ідеї згасли разом з тілами, перетвореними в попіл. Тепер Ґаллагер — єдина влада в Ред-Дірі, звісно, окрім Анклаву.\n\nПоступ маршових чобіт лунає в місті, поки Ґаллагер, спираючись на силу Анклаву, викорінює згадку про Джонсона. Ця маленька перешкода не зупинить його на шляху до проголошення Співдружності. Нові прапори вже розвішуються над Північними Територіями. Прерії тепер — територія янкі, а роки ізоляції закінчилися, бо дядько Сем таки повернувся.\n\nТа поки нова влада облаштовується, у горах і долинах ховаються останні прибічники Джонсона. Вцілілі люди Вудса, які не встигли до Ред-Діра, перегрупувались. Сини Свободи ще дзвонять у дзвін свободи. Але скільки ще зможуть протриматися? Полювання от-от розпочнеться, а Ґаллагер уже стискає сталевий кулак."
  nf_com.73.a: "Час змін настав."

  nf_com.74.t: "Про що вся ця війна"
  nf_com.74.d: "Холодні ночі Ред-Діра не нові для Ґаллагера — він виріс на цих вулицях. Але цього вечора мороз відчувався інакше для зморщеного армійця. Транспорти Анклаву перехрещують небо, магазини повні товару, а вулиці, нарешті, відремонтовані. Після років кровопролиття настала стабільність. Люди більше не вмирають у провулках... або так йому здавалося — поки не побачив солдатів Анклаву з кривавими кулаками.\n\nЗ пістолетом у руці, Ґаллагер зайшов у провулок, де сніг уже покривав метал. Біля смітника лежав побитий гуль. Підійшовши, Ґаллагер побачив знайоме обличчя — це був Прайс. Щелепа зламана, око в синцях — солдати злетної смуги мстилися. Ґаллагер поніс друга до лікарні. Погляди лікарів з Анклаву були сповнені огиди, але або законом, або свинцем Ґаллагер змусить їх лікувати Прайса.\n\nУ лікарні, в роздумах, Ґаллагер дивився на стелю. Його родину переслідують ті самі, що допомагають. Так, Анклав заповнив полиці, вклав асфальт, але й мало не вбив Прайса. Чи справді варто було? Але він знав — треба зробити Північ важливою, щоб Анклав підкорився йому. Саме в цій палаті народився план: зробити Північні території настільки ж важливими, як і Чикаго. Так він захистить родину."
  nf_com.74.a: "Амбітний план…"

  nf_com.75.t: "Вірний солдат"
  nf_com.75.d: "Годинник цокав від тієї ночі в лікарні, план було реалізовано, і тепер північ повна ресурсів. Урожай росте на східних степах, південні склади переповнені, а Ред-Дір — корона імперії — сяє від надлишку кришок. Ґаллагер затягується сигаретою з логотипом Анклаву, відкидаючись назад на скрипучому стільці з гордою посмішкою на обличчі. Він це зробив — північ стала такою ж важливою, як Чикаго, Анклав тепер тримається на північному брухті й хлібі. Скоро вийдуть накази для Анклаву та всіх навколо: гулів чіпати заборонено. Як же вони його зневажали, подумав він, сидячи на своєму троні з сировини."
  nf_com.75.a: "Боже, благослови Анклав!"

  nf_com.76.t: "Сховище E01: Воля"
  nf_com.76.d: "Перший експеримент у сховищі буде простим, але важливим. Учасники будуть поділені на чотири групи: колишні комуністи, кінні кочівники, рейдери та колишні члени Синів Свободи. Кожна група перебуватиме окремо впродовж першої половини експерименту під жорстким наглядом свого наглядача. На середині терміну всі групи буде змішано, і режим нагляду знизять до рівня, подібного до того, що застосовується за межами сховища. Мета — з'ясувати, чи можливе перевиховання таких екстремістів як метод їхньої нейтралізації."
  nf_com.76.a: "Час заповнити сховище."

  nf_com.77.t: "Сховище S01"
  nf_com.77.d: "Від Вищого командування Анклаву (Підрозділ Макартура)\n\nНаказ з НД #447\n\nСектор кордону Співдружності\n\nЗгідно з Пропозицією 321, все проживання Анклаву в зоні Канадсько-Американського кордону передано під контроль Секретаря Ґаллагера та Конгресу його територій. Полковник Сантьяґо затвердила йому дозвіл на побудову трьох (3) сховищ у місцевих горах. Сховища мають бути збудовані з використанням попередньо виготовлених модулів і довоєнного обладнання Vault-Tec. Сховища не повинні проводити летальні, шкідливі або стресові експерименти. Вони слугуватимуть контрольними просторами для збереження немутованого населення, спеціально затвердженого Комісією, у разі потреби відновлення федерального уряду.\n\nНотатки Ґаллагера (особисті): \"Чесно кажучи, не думав, що протягну це крізь Комісію, ще й ту леді з Монтани. Але дозвіл маю — просто використаю його не зовсім так, як тітонька Санті очікує.\"\n\nОбладнання:\n\nНомер сховища:\n\nS01\n\nКількість мешканців:\n\n1776 при старті (максимум — 5000)\n\nМета експерименту:\n\n(Запит Ґаллагера) Навчання та інформування мешканців з формальної історії США та довоєнної Канади. Матеріали не мають спотворюватися, змінюватися чи тлумачитися. Мешканці повинні проходити навчання за зразком довоєнної системи освіти: K–12 та за бажанням — коледж."
  nf_com.77.a: "За наше майбутнє!"

  nf_com.78.t: "Сховище E02: Позбавлення"
  nf_com.78.d: "Другий експеримент буде присвячено дефіциту ресурсів. Учасниками стануть виключно солдати — мета: оцінити вплив нестачі їжі та води на психічний і фізичний стан військових. Через тиждень у сховищі штучно зламаються системи подачі харчів і води. Протягом усього терміну їхні показники будуть уважно відслідковуватись під час звичайних армійських тренувань. Доставка їжі й води буде випадковою: іноді багато, іноді зовсім нічого. У фінальний тиждень всі поставки їжі буде повністю зупинено, залишивши лише мізерні запаси води. Це змоделює довгу облогу з відрізаними лініями постачання."
  nf_com.78.a: "Сподіваюся, їм сподобається перебування..."

  nf_com.79.t: "Сховище S02"
  nf_com.79.d: "Від Вищого командування Анклаву (Підрозділ Макартура)\n\nНаказ з НД #451\n\nСектор кордону Співдружності\n\nЗ огляду на наслідки останніх конфліктів у зоні кордону Монтана-Канада, командування дозволяє Програмі Відродження Сховищ розпочати розробку озброєнь та броні у відповідності до Пропозиції 321. Усе обладнання перевіряється сертифікованим ученим Анклаву з досвідом щонайменше 8 років. Також дозволено присилання стажистів із Чикаго для перевірки якості обладнання та умов.\n\nНотатки Ґаллагера (особисті): \"Щойно я подумав, що можу залишити війну позаду — як тітонька мене тягне назад... Але ж ніхто не каже, що я мушу виконувати її накази буквально. Може, ці молоді науковці ще й погодяться зі мною.\"\n\nОбладнання:\n\nНомер сховища:\n\nS02\n\nКількість мешканців:\n\n500 (до 1000 з гарячою ротацією ліжок)\n\nМета експерименту:\n\n(Запит Ґаллагера) Усе населення прикордонної зони з IQ понад 115 має бути переведено зі своїх посад (військових чи цивільних) до сховища. Кожен рівень сховища спеціалізується на окремому напрямку НДР, див. креслення. Усі науковці та охоронці отримають антирадіаційне захисне спорядження."
  nf_com.79.a: "Краще перестрахуватися!"

  nf_com.80.t: "Сховище E03: Витривалість"
  nf_com.80.d: "Третій і останній експеримент у сховищі буде спрямований на вивчення меж людських можливостей. Жодного разу не було перевірено, як ядерні вибухи вплинули на межі виживання людини. Щоб заповнити цю прогалину в знаннях, ув’язнених і військовополонених, засуджених до страти, залучать до участі. Під час експерименту вивчатиметься витривалість і здатність до адаптації в трьох напрямках: різкі зміни клімату (через регулювання температури у сховищі), стійкість до різноманітних речовин (у тому числі нових пустельних наркотиків), а також екстремальні навантаження, що доводитимуть тіло до межі. Ці дані стануть у пригоді війську, однак ніхто не очікує, що бодай хтось виживе."
  nf_com.80.a: "Погляньмо, хто виживе."

  nf_com.81.t: "Сховище S03"
  nf_com.81.d: "Від Головного командування Анклаву (Підрозділ Макартура)\n\nНаказ №500, дослідження й розробка\n\nСектор кордону Співдружності\n\nЗ будівництвом третього та останнього сховища Програма Відродження Сховищ наближається до завершення. Сховища буде остаточно ізольовано, з подальшим моніторингом з боку Ґаллагера й членів Комісії. Через застереження, висловлені представниками з Чикаго щодо інбридингу та обмеженого генофонду, полковник дозволив останнє сховище зробити найбільшим із побудованих, можливо — найбільшим в історії. Проте це також підвищує ризик проникнення мутантів, чого за жодних обставин не можна допустити. Вияви обачність, Ґаллагере.\n\nПриватні нотатки Ґаллагера: «Моя не надто охоча співпраця з цими Анклавівцями, ймовірно, скоро завершиться. Але це не кінець усьому. Вони не хочуть бачити мутантів у сховищі? Я зроблю для них ціле крило. Або принаймні приховану секцію, де їх ніхто не знайде.»\n\nНомер сховища: S03\n\nЗагальна кількість мешканців: 15 000 (10 000 після запечатування)"
  nf_com.81.a: "Коли китайці завдадуть нового удару!"

  nf_com.82.t: "Останній подих зрадників"
  nf_com.82.d: "Вулиці знову завмерли, коли вранішнє сонце освітили кулею пошматований асфальт. Сили Анклаву лежали мертвими у своїх окопах, а Джонсон спокійно спостерігав за сценою. Крижане повітря наповнило його легені, коли він наказав своїм солдатам прибрати безлад до того, як про нього дізнаються. Майкл Вудс, командуючи значною кількістю солдатів, рушив до злітної смуги Ред-Діра та комунікаційного центру. Вранці, під світлом сонця, розкрилась різанина серед офіцерів Анклаву та окупаційних сил.\n\nЧистка була стрімкою й безжальною — кожного, хто носив оте зрадницьке «А» біля серця, стратили Вудс і його ескадрон смерті. Розірване тіло Ґаллагера спалили перед містом разом із рештою перебіжчиків. Дим здіймався з цієї пекельної ями, а попіл накрив південне небо. Минуле було спалене дотла. Тепер Джонсону лишалося лише одне — відродити Америку наново."
  nf_com.82.a: "У Ред-Дірі нічого нового."

  nf_com.83.t: "З третього разу пощастить"
  nf_com.83.d: "Зали старої ратуші Ред-Діра були заповнені вщерть — з усіх куточків Співдружності приїхали люди, аби стати свідками історії. Центральна зала палахкотіла дебатами між делегатами, що намагалися зрозуміти темний шлях майбутнього. Із цих суперечок постала більшість — новий союз, сильніший за найзапекліших ворогів, що об'єднався задля спільної мети: відбудови.\n\nЦя більшість отримала назву Партія Уніоністів, а її головною метою стало відновлення Союзу від моря й до моря. В цьому ключі було сформовано нову форму правління та затверджено нову назву. До трьох гілок влади додано четверту — генерал-губернатора, тимчасово призначеного Джонсона. Ця гілка контролює законодавчу сферу й має розширене право вето. Судова гілка залишається без змін. Президентську ж посаду призупинено до повного відродження Союзу.\n\nХоча стара Конституція та Білль про права будуть знову ратифіковані, їх тимчасово замінить Угода з Ред-Діра, яка гарантує перелічені зміни. Вона діятиме до того моменту, коли Вашингтон і Лос-Анджелес знову об’єднаються під зоряно-смугастим стягом. А поки що саме ця Угода забезпечить виживання американського способу життя — під новим іменем: **Нова Американська Співдружність**."
  nf_com.83.a: "Боже, благослови Нову Американську Співдружність!"

  nf_com.84.t: "Надгробок Дядечка Сема"
  nf_com.84.d: "Століттями ми виживали у снігах, голодували й відбивали хвилі комуністів, поки Дядечко Сем розкошував у горах. Навіть коли ми дали йому шанс на спокуту, що він зробив у відповідь? Розграбував наші землі, витягнувши все блискуче з ґрунту й відправивши на південь. Наша революція перемогла тут, у снігах, але на півдні досі причаївся старий континентальний дід, який чекає своєї черги. Та я кажу — настав час відправити цього діда до пекла, де йому місце. Він більше не є втіленням Америки.\n\nНаші солдати рушать на південь із Прапором Свободи та піснями пращурів на вустах. Ми принесемо революцію в гори й покажемо їм наш американський дух. Наші гармати зрівняють вершини й зруйнують мури їхнього прихистку. Усі скарби внутрішніх земель ми заберемо назад додому — в сніг. Сьогодні Дядечко Сем впаде. Гори не зупинять нашу хвилю патріотизму."
  nf_com.84.a: "Ми змусимо Вашингтон пишатися нами!"

  nf_com.85.t: "Бідолашні душі"
  nf_com.85.d: "Окупація гірської фортеці Дядечка Сема залишила нам одну проблему, якої ми не передбачили. Тисячі колишніх солдатів Анклаву тепер лежать у злиднях, кинуті напризволяще зі зникненням старої адміністрації. Перед Конгресом постало два варіанти вирішення цього питання. Одні вимагають суду над ними за державну зраду — і нехай вирішать шибениці й тюремні ґрати. Інші ж закликають інтегрувати їх у суспільство, мовляв, вони були так само введені в оману Системою, як і ми. Дебати змусили Джонсона втрутитися — і тепер рішення за ним."
  nf_com.85.a: "На шибеницю!"
  nf_com.85.b: "З них ще може бути користь."

  nf_com.86.t: "Справжня республіка"
  nf_com.86.d: "Наша американська держава була заснована кров’ю та димом, як і її попередниця, але бракувало їй головного — засадничих принципів. Коли Співдружність почала розгортатися, реальність показала недоліки чинного управління. Зведення Конгресу до номінального органу викликало обурення серед громадян та делегатів. Днями у кожній залі влади точаться дебати: чи має Конгрес хоч якесь значення? У відповідь на це Джонсон вирішив відновити повноваження Конгресу.\n\nПізно вночі було проголошено розпуск номінального Конгресу й скликано нову Конституційну Конвенцію. Протягом кількох годин вісті поширилися країною, змусивши політиків знову вирушити до Ред-Діра. Дебати були бурхливими. Перше питання — чи витримає справжній Конгрес корупцію, чи впаде під вагою хабарів? Урешті компроміс знайшли: головні посади обох палат тимчасово обійматиме Генерал-губернатор до скасування четвертої гілки влади. Але найважливішим залишалося інше: скільки влади має отримати Конгрес? Це питання розірвало залу надвоє."
  nf_com.86.a: "О, яке ж то буде безумство!"

  nf_com.87.t: "Влада для пустки"
  nf_com.87.d: "Дебати в залах влади тривали цілу ніч, і вперше почали формуватися фракції. Джонсон взяв слово з запалом, ґрунтуючись на досвіді, здобутому ще до вибухів. Його головний аргумент — сильний Конгрес необхідний, аби ефективно керувати дикими землями, допоки американський дух не приборкає їх. Поклик до минулого Америки та її культури переконав незначну більшість приєднатися до табору Джонсона. Але опозиція теж була чималою."
  nf_com.87.a: "Дух дебатів живий як ніколи!"

  nf_com.88.t: "Влада для народу"
  nf_com.88.d: "Дебати в залах влади тривали всю ніч, і вперше з’явились справжні політичні поділи. Майкл Вудс відійшов від свого наставника Джонсона й виступив за правління самого народу. Його аргумент: лише сильні законодавчі збори штатів і слабкий Конгрес можуть гарантувати свободи громадян. Пустка може і є дикою, але як колись захід був підкорений принципом свободи, так само буде й тепер. Вудс виявив неабияку майстерність у виступах, і хоч Джонсон його незначно випередив, меншість була суттєвою."
  nf_com.88.a: "Дух дебатів живий як ніколи!"

  nf_com.89.t: "Орел знову здіймається"
  nf_com.89.d: "Хоч під час конвеції й тривав хаос, після днів запеклих дебатів полум’я почало згасати, поступаючись компромісу. Було вирішено створити новий Конгрес — прямого наступника Другого Континентального Конгресу, щоб забути корумповану ганьбу попередника. Цей Третій Континентальний Конгрес складатиметься з двох палат — Сенату та Палати Представників. Сорок вісім сенаторів і сто представників утворюватимуть делегатське зібрання Конгресу.\n\nХоча система правління вже визначена, дебати залишили тріщину в Співдружності. Дві партії сформувалися навколо фракцій на конвенції. Джонсон очолив Партію Уніоністів — її мета відновити й повернути старі континентальні кордони, з сильним Конгресом для управління перехідними територіями. Вудс, зі свого боку, очолив Реформістську партію, яка також прагне розширення, але виступає за сильне місцеве самоврядування й слабший Конгрес — задля збереження свобод і запобігання корупції. Поки що Конгрес має невелику перевагу на боці Джонсона, однак це може скоро змінитися."
  nf_com.89.a: "Втретє — на щастя!"

  nf_com.90.t: "Золоте минуле"
  nf_com.90.d: "Знову Джонсон дивиться з вікна свого кабінету, споглядаючи нову метрополію, збудовану зі снігу й старого арматурного заліза. Ранкове сонце дарує місту золоті відтінки, і громадяни виходять на вулиці. Діти граються у снігу, закохані йдуть на прогулянки — пустка більше не здається порожньою. Полиці магазинів знову наповнені американськими товарами, нові відбудовані потяги зʼєднують місто. Ще вчора вулиці були порожні, подумав Джонсон.\n\nКоли золотисте світло залляло його обжите робоче місце, Джонсон знову розглядає свої дрібнички — цього разу з посмішкою. Порвана, але все ще ціла, смугаста стара святиня — прапор. Поруч — фото його роти під час окупації. Спогади нахлинули. Але дещо блискуче привернуло його увагу: звичайнісінька пляшка Ядер-Коли, захована за іншими трофеями. Вона виблискувала в світлі, і Джонсон згадав — останній день літа, коли вони з хлопцями востаннє пили колу перед тим, як піти на війну з комуністами.\n\nЦя пляшка була більше, ніж просто скло — вона стала символом кращого часу. Коли не було бомб і крові — була лише Ядер-Кола і старі друзі. Стискаючи пляшку, Джонсон знову підійшов до вікна й подивився на вулицю. І в цю мить він пообіцяв собі повернути те золоте минуле не лише для себе, а й для цього покоління. Спершу — Ред-Дір. Далі — Даллас чи Лос-Анджелес. Яке б місто не було першим — Союз буде відбудовано цеглина за цеглиною."
  nf_com.90.a: "Останнє завдання..."

  nf_com.91.t: "Південна криза"
  nf_com.91.d: "Після багатьох років війни ми нарешті відновили контроль над південним кордоном. Але труднощі на цьому не завершились. Журналіст Federalists Times, що перебував в Остіні, охрестив ситуацію як «Південну кризу», і тепер вона поглинає увагу Конгресу. Три південні Співдружності — Сонора, Ріо-Ґранде й Техас — стикаються з власним спротивом.\n\nСонорська Співдружність, найспокійніша з трьох, потерпає від активності картелів. Хоч ми й розбили їхні «держави», торгівля джетом і контрабанда не припинились. Новини повідомляють про розгортання рекетирства в ізольованих районах. Через слабкість поліції, що щойно створена, вони звернулись до Конгресу по допомогу.\n\nДалі — Ріо-Ґранде. Тут опір найзапекліший. Це завжди була мішанина американської, мексиканської й ріоґрандської культур. Відколи сюди прийшли американські поселенці й бізнес, вибухнула культурна війна. Мексиканські повстанці вже проводять бомбардування урядових будівель. Місцева влада просить допомоги, але з проханням Сонори вже на столі — бюджет під питанням.\n\nІ, нарешті, Техаська Співдружність — джерело кризи. Як завжди, тут усе крутиться навколо Братства Сталі. Техаський розділ цієї терористичної організації чекає суду за зраду. У відповідь — масові протести з Шривпорта, вимагаючи смертної кари для братчиків. Протести ширяться, і Конгрес опинився в складній ситуації: така масова страта може стати злочином сама по собі, навіть якщо обвинувачені винні.\n\nЦя криза накрила три південні Співдружності у найгірший момент — вибори губернаторів ще не відбулись. Кандидати лише починають заявляти про участь, і політична нестабільність виходить на перший план."
  nf_com.91.a: "Конгрес мусить діяти швидко..."

  nf_com.92.t: "Завжди готові, завжди поруч"
  nf_com.92.d: "Ситуація в Техасі досягла апогею. Суд над Братством Сталі наближається, а протести вийшли з-під контролю техаського Конгресу. Східний регіон Техасу поринув у хаос, і рештки Техаських Рейнджерів не здатні тримати все під контролем. Дізнавшись про це, Джонсон ухвалив складне рішення: оголосити надзвичайний стан у Техаській Співдружності. В межах цього стану вибори губернатора відкладено, а контроль над бунтівною територією передано Національній гвардії.\n\nТепер за все у Техасі відповідає генерал-ад’ютант Крістофер Гаррісон, очільник Техаської національної гвардії. Саме Джонсон особисто обрав його для цієї операції, адже той знає регіон ще з довоєнних часів. Утім, це призначення спричинило шквал критики з боку преси. Газета Federalist Times очолила інформаційну атаку, звинувачуючи Гаррісона в створенні «військової хунти» й заявляючи, що техаська демократія померла, так і не народившись. Преса не зупиняється, доки Техас палає."
  nf_com.92.a: "Спочатку криза, потім — преса."

  nf_com.93.t: "Забруднена сталь"
  nf_com.93.d: "Суд над Братством Сталі нарешті розпочався. Завдяки холоднокровності Гаррісона й його гвардійців, процес став можливим. Але проблеми лише наростають. Протести набули нового характеру: з вимог страти членів Братства все перейшло в антиамериканське русло. Озброєні загони ополчення блокують цілі поселення.\n\nЦе ще не все. Сам суд досяг критичної точки. За федеральним законом, навіть Братство Сталі має право на справедливий суд присяжних. Їхній захист наполягає, що такий суд неможливий у Техасі й вимагає перенести розгляд до Ред-Діру — столиці федерації, аби уникнути упередженого рішення. Якщо Джонсон схвалить це, його підтримка в Конгресі та Техасі зазнає краху. Якщо ж ні — вироком буде смертна кара. Рішення тепер за Джонсоном."
  nf_com.93.a: "Перенести суд — заради справедливості..."
  nf_com.93.b: "Я не втручатимусь у цю справу."

  nf_com.94.t: "Шлях уперед"
  nf_com.94.d: "Техас здобув репутацію проблемної Співдружності, охопленої бунтами й політичною напругою. Але, здається, бурю вдалося втихомирити. Суд над Братством Сталі завершився смертним вироком для всіх, хто перебував під їхнім прапором. Джонсон утримався від коментарів, заявивши, що зосередиться на відбудові Техасу. Протести згасають, а в Ред-Дірі вже оголосили, що вибори губернатора більше не відкладаються — перші кандидати вже заявили про себе.\n\nРуїни Східного Техасу вже внесені до списку відбудови Техаської національної гвардії. Проте напруга в регіоні ще не згасла повністю. Один необережний крок — і все знову спалахне. Навіть без скандалу навколо Братства Сталі Техас лишається Співдружністю, що потребує підтримки.\n\n--Federalist Times"
  nf_com.94.a: "Кризу подолано."

  nf_com.95.t: "Коли настав захід сонця"
  nf_com.95.d: "Ред-Дір завжди славився пронизливим холодом і політичними чварами. Але коли ті зрадницькі «паладини» зʼявились у столиці, місто стало ще холоднішим. Усі лише про це й говорили — суд над Братством, стан Техасу — не було місця, вільного від політики. Процес розпочався на світанку, і вся країна затамувала подих. Вирок був швидким: винні в зраді. Але до страти засудили лише найвищих. Решту — звільнили.\n\nСаме Federalist Times першою оприлюднила цей вирок — і новина рознеслась, як вогонь. У Техасі все вибухнуло. У Текcаркані, коли над землею вже опустилась ніч, вулиці охопили заворушення. Місто згоріло до фундаменту, загинули сотні. Так звані революціонери заполонили вулиці з молотом і серпом у руках, вигукуючи про «вільний Техас».\n\nНа світанку натовп уже не був просто юрбою — в Шривпорті постала нова сепаратистська «нація». Доміно посипалось, й сусідні райони приєдналися. Декларація про свободу Шривпорту лягла на стіл Гаррісона разом із списком загиблих. Техаська порохова діжка таки вибухнула."
  nf_com.95.a: "От лихо..."

  nf_com.96.t: "Жовта троянда розквітає"
  nf_com.96.d: "Часи кризи в Техасі завершились — напруга змінилася розмовами про свободу. Усі говорять лише про губернаторські вибори, кожна зі сторін агітує за свого кандидата, якого має замінити Гаррісона. Вулиці заполонили листівки й радіопередачі, а газети насилу встигають за новинами.\n\nПершим кандидатом від Союзницької партії став Чо Бан, колишній лідер Лоун-Стар. Такий вибір нікого не здивував: платформа Союзників про відбудову Техасу зробила Банга очевидним фаворитом. Його досвід у керуванні та торгівлі схвально сприйнято громадськістю. Здається, народ Техасу прагне спокою після хаосу.\n\nДругим кандидатом від Реформістської партії став неочікуваний претендент — супермутант Кітс. Дивний вибір, але його погляди на рівність і свободу підтримують як партійці, так і значна частина мешканців Техасу. Кітс — аутсайдер у перегонах, проте списувати його зарано. Питання в тому, чи зуміє він вмовити виборців Сан-Антоніо."
  nf_com.96.a: "Банг — вибір народу!"
  nf_com.96.b: "Кітс — борець-аутсайдер!"

  nf_com.97.t: "Холодні кандидати — гарячі надії: вибори у Співдружності Ріо-Ґранде"
  nf_com.97.d: "Виборча лихоманка охопила провінції новоствореної Співдружності Ріо-Ґранде. Більшість бюлетенів уже підраховано, і два основні табори змагаються за посаду губернатора.\n\nРеформісти підтримали Тодда Гаубіца, генерального директора Техаської Асоціації Зброярів. Його вважають рушієм економічного розвитку. Колишнє його відокремлення від Республіки Ріо-Ґранде переросло в кривавий конфлікт, відомий як День мертвих — іронічна назва для події, що мала бути днем памʼяті предків. Для колишніх республіканців це день, коли загинуло багато людей. Висування Гаубіца вже загострило ситуацію, а місцеві мексиканці кажуть, що його американський вплив загрожує душі нації.\n\nНатомість Союзники висунули Данте Ґерру, колишнього президента Республіки Ріо-Ґранде, що овдовів після битви з Центуріоном Паулюсом. Разом із донькою Веронікою він виступає за примирення й об’єднання мексиканців і американців. Хоча дехто називає його маріонеткою американців, багато мексиканців — переважно з колишньої республіки — задоволені його керівництвом.\n\nОбидва кандидати відмовились від коментарів. Секретар Гаубіца, скромний юнак, проте явно зачарований своїм босом, сказав лише: «Він просто працює. І можете це надрукувати». Вероніка Ґерра відповіла: «No preguntas por favor». Що це означає — не зовсім ясно, але схоже, що сьогоднішні вибори стануть доленосними для мексиканського народу.\n\nІді Мелон\n\nFederalist Times"
  nf_com.97.a: "Ґерра здобуває перемогу!"
  nf_com.97.b: "Гаубіц хапає крісло!"

  nf_com.98.t: "ВІЙНА! — вибори у Ріо-Ґранде спричинили повстання"
  nf_com.98.d: "Незважаючи на початкове бажання цього репортера висвітлити перемогу Данте Ґерри, у Співдружності Ріо-Ґранде спалахнула війна.\n\nЗа кілька годин після оголошення результатів — через радіо, до речі, на хвилях, яких у нас, у Federalist Times, ще немає — країною прокотилися масові заворушення. Перед цим невідомі перехопили сигнал, спершу оголосивши результати іспанською, а потім — кострубато переклали їх англійською. Їхній заклик був простий: «Капіталістична маріонетка Ґерра — результат шахрайських виборів, усі вірні мексиканці повинні повстати й створити незалежну державу.»\n\nКолишній кандидат Тодд Гаубіц і його секретар спробували вийти на ефір із закликом до Ґерри інвестувати в ТАЗ і купити зброю. Це виглядало радше як рекламна кампанія. Проте ефір перервався звуками стрілянини й криків. Доля Гаубіца і його секретаря залишається невідомою.\n\nНа думку цього скромного репортера, новообраному губернатору Ґеррі слід вирішити: звертатись по допомогу до Ред-Діру чи намагатись об’єднати розірвану регіональну тканину самотужки.\n\nІді Мелон\n\nFederalist Times"
  nf_com.98.a: "До зброї!"

  nf_com.99.t: "ВІЙНА! — вибори в Ріо-Ґранде завершились збройним повстанням"
  nf_com.99.d: "Попри початкові спроби цього репортера висвітлити перемогу Тодда Гаубіца, війна прийшла до Співдружності Ріо-Ґранде.\n\nУпродовж годин після оголошення результатів виборів по радіо — мережу, яку ми у Federalist Times, до речі, ще не запустили — країну охопили масові заворушення. Саме оголошення результатів було перехоплене і транслювалось повністю іспанською мовою, після чого було надано кострубатий англійський переклад. У повідомленні зазначалося, що через «капіталістичну американську сутність» Гаубіца та «очевидні ознаки шахрайства» мексиканцям слід повстати й створити власну незалежну державу.\n\nКолишній кандидат Данте Ґерра спробував вийти на ефір, закликаючи прихильників до ненасильства та мирного протесту. Проте його виступ був перерваний стріляниною й криками, а ефір обірвався разом із передсмертними зойками. Місцеперебування Данте та Вероніки Ґерри наразі невідоме.\n\nДорогою до телеграфного офісу вдалося помітити озброєну постать, яку місцеві впізнали як колишнього президента Республіки Леонардо Мору — він стріляв із двох револьверів у повітря й вигукував «¡Viva Revolución!» англійською та іспанською. Спроби взяти в нього коментар закінчились попереджувальними пострілами. Зараз Збройні сили Співдружності намагаються його нейтралізувати.\n\nНа думку цього скромного репортера, теперішній губернатор Гаубіц має вирішити — звертатись по допомогу до Ред-Діру, чи спробувати об’єднати двічі розірваний регіон самостійно.\n\nІді Мелон\n\nFederalist Times"
  nf_com.99.a: "До зброї!"

  nf_com.100.t: "МИР — Спокій повертається до Співдружності Ріо-Ґранде!"
  nf_com.100.d: "Після значних втрат, кровопролиття та численних перемовин між зацікавленими сторонами, у Співдружності Ріо-Ґранде нарешті запанував мир.\n\nГубернатор сьогодні під час публічної пресконференції оголосив, що більше не потерпить жодної збройної боротьби чи насильства в межах Співдружності, а також що відтепер влада діятиме згідно з усіма нормами Конституції Співдружності.\n\nДля цього репортера немає нічого кращого, ніж чути не безкінечні постріли, ксенофобські вигуки та крики, а просту радіо-мелодію й пташиний спів. Хай відтепер ця Співдружність знає лише мир і добробут!\n\nІді Мелон\n\nFederalist Times"
  nf_com.100.a: "Мир нарешті настав."

  nf_com.101.t: "Усе гарне має кінець"
  nf_com.101.d: "Ґаллагер зробив глибоку затяжку з сигарети, затиснутої між пальцями. Присмак був гіркий — звична вада дорадіаційних сигарет, що пролежали у світі після вибуху. Він утримував дим лише кілька секунд, перш ніж випустити його через екран термінала перед собою.\n\nВін ненавидів цю маленьку світну коробку. Користування нею було однаково дратівливим і заплутаним: вона постійно викидала помилки або вимагала дивних речей — «перезавантаження», «пакети програм» тощо.\n\nСьогодні вона принесла тільки погані новини.\n\nА це було рідкістю. Останні роки складались надзвичайно вдало: вигнання Джонсона пройшло легко, а придушення його прихильників взагалі здавалось формальністю. Навіть війни з рейдерами й комуністами — колись страхітливими ворогами — минули успішно. На додачу, Співдружність налагодила стабільний зв’язок із американськими залишками на півдні!\n\nЗдавалося, це занадто добре, щоб бути правдою.\n\nЦе і було занадто добре, щоб бути правдою.\n\nНа екрані з’явилось останнє повідомлення з Макартурського штабу — воно було підступно простим, та змусило шлунок Ґаллагера стиснутись:\n\nМУТАНТИ МАЮТЬ ЗНИКНУТИ. ГУЛІ — ТАКОЖ."
  nf_com.101.a: "..."

  nf_com.102.t: "Коли все йде шкереберть..."
  nf_com.102.d: "Ґаллагер крутився в кріслі, штучна шкіра скрипіла на знак протесту, а його очі метались по кімнаті в пошуках бодай якогось виходу. Різні дрібнички, картини, трофеї та колекційна зброя покірно зустрічали його погляд, та жодна не дарувала полегшення.\n\nВін чув чутки про те, як Анклав поводиться з мутантами. Нічого конкретного, а будь-які спроби дізнатися щось у посланців з Макартура завжди швидко сходили нанівець. Найбільше, що він чув — це дипломатичне: «Усім справжнім американцям буде забезпечено захист». Тоді це його заспокоїло, але тепер Ґаллагер усвідомив, що ніколи не запитував, хто саме визначає, хто справжній американець.\n\nВони вимагали від нього геть абсурдного. З практичного боку — більшість гулів були частиною його генерального штабу, а дехто з них мав по 200 років бойового досвіду!\n\nОкрім того, сама ідея «чистки гулів» суперечила його відчуттю справедливості — ці люди віддали все заради справи, кожен гуль, з яким він служив, був до нестями відданий місії.\n\nА головне — вони були йому родиною. Ґаллагер ніколи не знав своїх батьків, а його перші спогади — це офіцери-гулі, які його виховали, формували з нього солдата від самого народження. Дехто з них досі служив. Що він їм скаже?\n\nІ проблема лише ускладнювалась тим, що стояло на кону. Америка, земля свободи. Ґаллагер усе життя мріяв побачити, як її буде відновлено, як знову замайорить зоряно-смугастий прапор. Він вклав у це роки — кров, піт і сльози. Ця країна була справою його життя, на благо світу, пустки та людей. Невже він має все це спалити... заради кількох десятків гулів?\n\nВін більше не міг зволікати. Рішення вже було прийнято. Залишалось тільки надіслати відповідь. Наприкінці дня..."
  nf_com.102.a: "Америка — понад усе."
  nf_com.102.b: "Родина — понад усе."

  nf_com.103.t: "Дорога в пекло"
  nf_com.103.d: "Ґаллагер крокував взад-вперед перед солдатами, що сиділи рядами перед ним. Усі вони були немутованими людьми, здебільшого — сержанти та офіцери, яких залишилось у Співдружності.\n\nУ кінці брифінгової зали стояв представник із Макартура, який керував проєктором. Це була нова вимога — Анклав почав нав’язувати своїх «аташе».\n\nҐаллагеру не подобалась думка, що за ним пильно стежать. Але Макартура наполягав, мовляв, їхній досвід «у подібних питаннях» допоможе спростити процес. Він не хотів думати, що саме це означає.\n\nОзирнувшись, Ґаллагер побачив непристойне зображення, спроєктоване на екран: гниюча голова гуля в перехресті червоного прицілу. Малюнок — ще один «подарунок» від Макартура — був огидним, із надмірною увагою до деталей розкладеного м’яса. Ґаллагер замислився, коли вони встигли таке намалювати — вчора про це ще не йшлося.\n\nУсвідомивши, що настав його черг виступати, Ґаллагер обернувся до людей, випрямився й прочистив горло:\n\n«Добрий вечір, панове. Ми стоїмо перед великою загрозою, більшою, ніж будь-коли, і вона виходить зсередини.» — він зробив паузу, щоб слова засіли в головах.\n\n«Ми виявили плани перевороту, розроблені нашим власним офіцерським корпусом гулів.» — у залі здійнявся гомін. Брехня гірко відгукувалась у роті. — «Ваша повна лояльність і співпраця — критично важливі. Під вашими сидіннями — документи з роллю, яку ви маєте зіграти в подоланні цього лиха. Візьміть їх у казарми й негайно починайте вивчення. Нікому не розповідайте, про що йшлося.»\n\nВін обернувся до «сторожа» з Макартура. На мить Ґаллагер задумався — може, краще прострелити йому голову. Але натомість просто кивнув у бік дверей."
  nf_com.103.a: "На цьому все, панове."

  nf_com.104.t: "Надмір насильства"
  nf_com.104.d: "Сьогодні був той самий день. Дві години тому розпочалась Операція «Мерцева поміч». Ґаллагер вирішив провести її, зачинений у власному кабінеті — частково задля власної безпеки, а частково, щоб втопитися в алкоголі.\n\nЧерги автоматів гриміли в коридорах і на подвір’ї, глухо пробиваючись крізь стіни. П’яне заціпеніння не могло заглушити миттєвий спалах жалю — та повертатися було вже пізно.\n\nВін підвівся з-за столу, вхопив пляшку з витриманим самогоном за горлечко і важко пішов до великої вітрини, що прикрашала східну стіну кабінету. Медалі, нагороди, ідеально збережена зброя, пам’ятні речі — навіть кілька справжніх фотографій, зроблених на відновлену техніку!\n\nОдна світлина привернула його увагу — маленький чорно-білий знімок, де він стоїть серед натовпу гулів-офіцерів, усі усміхаються. Ті самі, кого він тепер стирав із лиця землі.\n\nТа ця тепла пам’ять губилася поруч із іншою — у багатому різьбленому рамці кольорове фото, де він тисне руку представникові Макартуру під час одного з перших договорів. Той — у супроводі охорони. Ґаллагер — сам.\n\nВид цих двох фото поряд викликав у нього лють. Але на кого? На Макартур? Це ж вони змусили його влаштувати цю жалюгідну, несправедливу, огидну операцію!\n\nНе думаючи, він пробив кулаком скло вітрини, навіть не помітивши, як дрібні порізи вкрили його руку. Він витяг фото крізь уламки, кинув його на підлогу й почав люто тупотіти по ньому чоботом. Рамка тріснула, скло розлетілось, і незабаром залишилося лише сміття під ногами."
  nf_com.104.a: "..."

  nf_com.105.t: "І так воно сталося"
  nf_com.105.d: "Ґаллагер підніс пляшку самогону й зробив ще один глибокий ковток. Міцне зілля обпалило горло, змусивши його закашлятись, бризки впали на уламки вітрини. Погляд розфокусувався, дрібні речі в середині зникли в мозаїці плям — і тоді, крізь скло, виразно проявилось відображення.\n\nҐаллагер дивився на себе — вкрай виснаженого. Очі налиті кров’ю, уніформа скуйовджена й зім’ята, рука крапає кров’ю на підлогу. І крізь туман алкоголю його раптово пронизала ясність.\n\nВін злився не на Макартур. Він злився на себе.\n\nЦе він прийняв угоду. Це він склав план. Це він віддав наказ.\n\nНаприкінці дня ніхто не заслуговував на провину більше, ніж сам Ґаллагер. Ця правда прошила його наскрізь, згорнувши його душу в клубок з тривоги, страху й відрази.\n\nПереможений власним відображенням, Ґаллагер повернувся до столу, впав у крісло й пригорнув пляшку, немов немовля. Його погляд застиг на екрані терміналу.\n\nВін пропустив останні десятки повідомлень — усі були сигналами «очищено» від оперативних груп.\n\nВсе було скінчено."
  nf_com.105.a: "..."

  nf_com.106.t: "Наступного ранку"
  nf_com.106.d: "Ґаллагер вийшов у внутрішній двір гарнізону Ред-Діра і побачив доволі моторошну сцену: тіла гулів завантажували до вантажівок.\n\nОдне за одним, десятки трупів вкладали обличчям донизу, ззовні стирчали лише ноги — в чоботах і босі. \n\nҐаллагеру було майже легше на душі, що він не бачив їхніх облич.\n\nВін підійшов до кабіни найближчої машини й постукав. Дверцята відчинилися — на сидінні сидів знуджений рядовий.\n\n— Рядовий, покажіть карту. Я хочу знати, де ховають цих людей.\n\n— Ховають, сер? — солдат здивувався, витягнув з кишені паперову мапу й передав угору. Ґаллагер розгорнув її, уважно вивчаючи позначки.\n\nНа мапі були позначені три «Місця скиду»: Альфа, Браво та Чарлі.\n\nҐаллагер здригнувся, пальці стиснули краї мапи. — Місця скиду? Чому ці люди не поховані як належить?\n\n— Гарнізон у половинному складі, сер. Немає часу на поховання гулів — не буде кому нести варту, — відповів той з легким нерозумінням.\n\nҐаллагер на хвилину замовк, зітхнув і повернув зім’яту мапу. Солдат мав рацію. Як і ті, хто віддав наказ. І хоч сама ідея братської могили вивертала йому шлунок, змінити вже було нічого не можна."
  nf_com.106.a: "Це все, рядовий."

  nf_com.107.t: "Суд для собаки"
  nf_com.107.d: "Ритмічні удари підборів гучно лунали коридором, коли Ґаллагер прямував до командного залу. Біля дверей стояли двоє охоронців — нові. Вони були вдягнені в темно-бежеву уніформу Анклаву, до якої Ґаллагер уже звик останнім часом. Стояли в положенні відпочинку, а в кобурах — пістолети, можливо 10-міліметрові, на видноті.\n\nПобачивши Ґаллагера, один відійшов убік, інший — тримав двері. Ґаллагер зупинився, не входячи.\n\n— Хто вас сюди поставив? Це був не я.\n\n— Капітан Сантьяґо, сер.\n\nСантьяґо? Він не мав у штабі нікого з таким ім’ям — тим більше того, хто мав би повноваження ставити охорону біля його воєнної зали!\n\nҐаллагер увійшов і озирнувся — і побачив вкрай незнайоме оточення.\n\nУсі старі прапори США були замінені свіжими, охайними прапорами Макартура, а кожен, хто працював біля терміналів і карт, був одягнений у ту саму бежеву уніформу. Обличчя — переважно незнайомі. Нові призначення після недавніх «звільнень». І, найочевидніше — жодного гуля.\n\nОдин із молодших офіцерів помітив прибуття Ґаллагера й вигукнув:\n\n— Командувач у залі!\n\nУсі припинили роботу й встали по стійці «струнко». Ґаллагер дав їм трохи повисіти так, вдивляючись в їхні обличчя."
  nf_com.107.a: "Вільно."

  nf_com.108.t: "Сантьяґо"
  nf_com.108.d: "На шляху до свого місця біля планувального столу Ґаллагера зупинив ад’ютант із планшетом і почав зачитувати розклад дня. Та Ґаллагер, насправді, не слухав його. Він просто без виразу дивився на молодого обличчя перед собою — гладка шкіра, яскраві зелені очі, жодного дня в бойовій зоні.\n\nПогляд опустився до уніформи — ідеально випрасуваної, з акуратно розміщеними стрічками та значками. Найбільше впадала в око велика літера А, оточена чорними зірками.\n\nОсь він — Анклав. Лише один із багатьох гвинтиків тієї машини, що примусила Ґаллагера знищити всіх, хто справді мав для нього значення. Йому кортіло задушити того хлопця — просто зламати шию голими руками.\n\nАд’ютант, здається, щось уловив у його погляді й зупинився:\n\n— Все гаразд, сер?\n\nҐаллагер глибоко вдихнув:\n\n— Просто втомився трохи. За чиїм наказом ти тут?\n\n— Капітан Сантьяґо, сер.\n\nОце знову це ім’я.\n\n— Сантьяґо? Хто, в біса…\n\nВін відчув чиюсь руку на плечі. Обернувшись, побачив незнайомця — мідна шкіра, густі вуса, щелепа мов із граніту. Офіцер Анклаву. Його уніформа рясніла бездоганно збереженими медалями та стрічками.\n\n— Це я, капітан Сантьяґо. Тепер я спостерігатиму за ситуацією в Співдружності. Віднині всі ваші накази проходитимуть через мене.\n\nОсь і все. Анклав узяв його на повідок у формі постійного аташе. Вони забрали в нього все — а тепер ще й владу. Як він міг цьому завадити? Всі його впливові офіцери мертві, замінені маріонетками Макартура.\n\nҐаллагер натягнуто простягнув руку для рукостискання."
  nf_com.108.a: "Радий вас бачити."

  nf_com.109.t: "Остання крапля"
  nf_com.109.d: "Останній місяць був справжнім випробуванням для Ґаллагера. Його авторитет зник майже повністю — після того як співробітники Анклаву перебралися до штабу, його більше майже не радилися, не інформували, не просили підпису. Ніколи за всю кар’єру він не почувався настільки непотрібним.\n\nСантьяґо, з тим своїм самовдоволеним виглядом, сказав: «Насолоджуйтеся миром». Ніби в нього залишився хтось, із ким той мир можна розділити.\n\nҐаллагер рідко залишав свій офіс. Там панував безлад — пляшки, пакунки, бруд, усе безладно розкидане по підлозі. І сам він виглядав так само: скуйовджена борода, мундир, який давно пора було змінити, і неприємний запах, до якого він уже звик. Його парадні сині вже не сяяли — плями, складки, порожнеча.\n\nВін проводив дні, слухаючи радіо, переглядаючи старі записи на терміналі й п’ючи.\n\nЛакеї Анклаву залюбки підтримували його у п’яному стані. Він відкинувся назад у кріслі, скреготів зубами й злісно дивився в стелю, бурмочучи:\n\n— Тупий Ґаллагер, хай краще спиться до смерті.\n\n— Дурень Ґаллагер, хай не заважає — тільки гальмує!\n\nГнів на вигаданих офіцерів Анклаву наростав, поки не сконцентрувався на одному — найгіршому.\n\n— Оцей покидьок Сантьяґо... Я їм ще покажу."
  nf_com.109.a: "..."

  nf_com.110.t: "І ти, Ґаллагере?"
  nf_com.110.d: "Ґаллагер тримав у долонях оздоблений срібною гравіюванням девʼятиміліметровий пістолет; узори нескінченно закручувалися по чорному сталевому корпусу. Ця зброя була трофеєм, здобутим під час сутички в молоді роки — від одного надзвичайно небезпечного рейдера на ім’я Маф.\n\nЗ моменту, як пістолет опинився в його руках, він не зробив з нього жодного пострілу. Зарядити магазин здавалося зневагою — і все ж, він став на місце без жодного опору.\n\nҐаллагер — невдало — сховав зброю в піджак уніформи, не випускаючи руківʼя з руки.\n\nСерце калатало, коли він вийшов із кабінету й рішуче попрямував до командної зали. Ще місяць тому він, можливо, вагався б. Поставив би собі запитання: «Чи це того варте?», «Чи правильно я чиню?»\n\nЖорстока правда була в іншому: підписати вирок своїй родині — це водночас жахливо і… звільняє. Так, моральний компас і почуття приналежності, які це руйнує, швидко замінюються на душогубний смуток і постійну скорботу.\n\nКомандна зала вже близько, за рогом. Ґаллагер глибоко вдихнув, заплющив очі й зібрався з духом.\n\nЗавернувши за кут, він витягнув пістолет із піджака."
  nf_com.110.a: "..."

  nf_com.111.t: "На власних умовах"
  nf_com.111.d: "— Зброя!\n\nОдин єдиний вигук — чіткий і гучний — пролунав із вуст сполоханого охоронця праворуч від дверей.\n\nЧас сповільнився до повзучої ходи. Ґаллагер побачив, як навчені руки супротивників тягнуться до пістолетів. Вони відкрили вогонь ще до того, як він встиг підняти свою зброю.\n\nУ повітрі розлетілись клапті синьої тканини, бруд, і — на диво — небагато крові.\n\nҐаллагер був здивований, наскільки мало він відчув болю. Можливо, адреналін. А може, просто — повна байдужість.\n\nВін навіть не помітив, коли впав, аж поки не побачив світильники на стелі — які з чітких прямокутників розпливлись у сяючу кулю світла, байдужу до всього.\n\nПовернувшись на бік, він видихнув — навіть не знаючи, скільки часу тримав подих. У затьмареному розумі він лаяв тих, хто втягнув його у все це: Сантьяґо, Анклав, Пустку… Себе. Передусім — себе.\n\nҐаллагер був втомлений. І вирішив, що розбиратиметься з наслідками завтра. А сьогодні — просто спить."
  nf_com.111.a: "..."

  nf_com.112.t: "Добрі наміри"
  nf_com.112.d: "Ґаллагер крокував туди-сюди перед солдатами, що сиділи в рядах. Переважно гулі, але й багато незмінених людей. Навіть звичайні офіцери виглядали виснаженими — медалі, шрами, зморшки розповідали про довгі роки служби.\n\nБрифінг відбувався в складі боєприпасів, де центральну частину звільнили під імпровізовану трибуну з лав, стільців та ящиків, звернену до тимчасового проєктора.\n\nЦе явно була «неофіційна» зустріч — Ґаллагер відчував у повітрі тривогу й нерозуміння. Поглянувши на біле полотно позаду, він побачив проєкцію — герб Макартура. І відчув глибоку відразу.\n\n— Я буду коротким. Новини — погані.\n\nНатовп зашумів. Ґаллагер почав ходити перед проєктором:\n\n— Учора вночі я отримав повідомлення від Макартура — з вимогою негайно ліквідувати всіх гулям у нашому війську.\n\nНатовп завмер. Чотири десятки очей вп’ялися в Ґаллагера. Він швидко додав:\n\n— Я не маю наміру цього робити. Але ви знаєте так само добре, як і я: сказати просто «ні, дякую» — замало. Ми маємо відповісти. Скоро.\n\nВін подав знак кільком ординарцям, які почали роздавати поспіхом складені бойові плани й документи.\n\n— Я зібрав вас, бо ви — добрі люди, і я вам довіряю. Уважно читайте свої накази, будьте готові діяти за моїм сигналом і не розповідайте про них нікому. Зрозуміло?\n\nЗалунало рішуче: — Зрозуміло!"
  nf_com.112.a: "Вільні!"

  nf_com.113.t: "Хто вилікує хворобу в Сонорській Співдружності?"
  nf_com.113.d: "У повітрі навколо тимчасового виборчого центру Сонорської Співдружності витає запах Джету, Смуучу, Гідри — і навіть кави Коста Кафеінада. Якщо б не численні державні вентилятори, натовп був би значно вибуховішим. Після розпуску місцевих урядів нелегальне виробництво та збут наркотиків лише зросли.\n\nЩоб вирішити це хаотичне становище, Реформісти й Уніоністи висунули по одному кандидату. Від Реформістів — гулька ацтекського походження, колишня бійчиня Хенте-Дель-Соль на ім’я Губернія Іск'єрда. Вона веде кампанію за відновлення прав для всіх, посилаючись на стародавні документи, знайдені ще в часи її служби. Іск'єрда прагне створити \"Сполучені Штати Мексики\", відкрити Співдружність для всіх і розширити обмежені права мутантів та нечистих.\n\nВтім, попри високі ідеали, її бездіяльність у питанні наркоторгівлі спричинила критику з боку суперника — Джоша Хенлона, колишнього шефа Рейнджерів НКР. Його мета — посилити регуляцію та правопорядок, відродивши давню структуру під назвою Федеральне Бюро Розслідувань. Деякі правозахисні організації засудили намір створити подібність до рейнджерів у регіоні, що не належить НКР, та Хенлон запевняє — все заради безпеки та порядку в Сонорі.\n\nЧасу обмаль — рушай до виборчого центру та віддай свій голос!\n\nІді Малон\n\nФедераліст Таймс"
  nf_com.113.a: "Хенлон — за порядок!"
  nf_com.113.b: "Іск'єрда — за свободу!"

  nf_com.114.t: "Хенлон перемагає! — Уніоністи здобули перемогу в Сонорській Співдружності"
  nf_com.114.d: "Після довгих годин підрахунку бюлетенів кандидат від Уніоністів Джош Хенлон був оголошений переможцем виборів губернатора Сонорської Співдружності. У своїй переможній промові він коротко заявив: \"Порушите закон — заарештуємо так, що самі побажаєте смерті.\" Чи мав він це на увазі буквально — невідомо.\n\nОдразу по завершенню промови Хенлон сів у винищувач і полетів до Конгресу, де виступив з полум’яною промовою щодо реформування ФБР (Федерального Бюро Розслідувань). При рівному голосуванні один з сенаторів-уніоністів схилив шальки терезів на його бік, і законопроєкт було ухвалено разом із фінансуванням пілотного етапу.\n\nВиконуючи обіцянки, Хенлон відновив стару адміністративну будівлю й перетворив її на штаб-квартиру нового Бюро. Він організував ополчення та збройних громадян, не пов’язаних з регулярними силами Співдружності, у нову структуру під назвою \"Сонорські Рейнджери\". Їхнє завдання офіційно не оголошене, однак інсайдери вказують: головна мета — знищення наркотиків і всіх, хто їх виготовляє.\n\nЦей день став переломним як для Хенлона, так і для Сонорської Співдружності. Прогрес виявився блискавичним для цього досі нецивілізованого краю.\n\nІді Малон\n\nФедераліст Таймс"
  nf_com.114.a: "Час працювати!"

  nf_com.115.t: "ВІЙНА! — Вибори в Сонорі закінчились конфедерацією наркокартелів"
  nf_com.115.d: "Хоча багато хто радів перемозі Губернії Іск'єрди, ще важливіша звістка приголомшила краї: у Сонорську Співдружність прийшла війна.\n\nЧерез кілька годин після оголошення результатів виборів, заплановану промову новообраної губернаторки зірвали декілька ділових гульських типів, які піднялись на сцену раніше. Вони оголосили про створення \"Об’єднаних Картелів\" — або, як вони самі це назвали, \"Los Cárteles Unidos\". Завершивши промову, один з них пообіцяв 100% знижку першим сотням, хто виживе після затяжки їхнього нового хімічного коктейлю — і тут же жбурнув його просто в натовп.\n\nЛише завдяки заздалегідь підготовленій протигазу цей репортер уникнув впливу наркотиків.\n\nГулі, що були в натовпі, майже не постраждали. Люди ж миттєво збожеволіли: одні кидалися на інших, хтось хапав газ, а дехто просто завмирав. За лічені хвилини натовп із сотень зменшився до кількох десятків — живих чи принаймні свідомих. Тіло кандидата Джоша Хенлона було виявлено серед загиблих. Медики, що прибули на місце, не змогли визначити, чи має він шанс на виживання.\n\nУ цьому скромному погляді репортера — Губернія Іск'єрда, нова губернаторка, має вирішити: звертатися по допомогу до Ред-Діра чи самостійно очистити землю Сонори від наркочуми та тих, хто її поширює.\n\nІді Малон\n\nФедераліст Таймс"
  nf_com.115.a: "ой нііі…"

  nf_com.116.t: "Права рука Хенлона"
  nf_com.116.d: "Сонце пекло по піску Сонори, коли небо заповнили гвинтокрили. Перемога Хенлона в проштовхуванні закону про реорганізацію ФБР у Конгресі запустила цілий ланцюг подій. Ескадрилья гвинтокрилів доставила нових агентів із Ред-Діра разом із вантажем для облаштування першого польового штабу. Скромна будівля, яку Хенлон обрав для агентів, була швидко й тихо переобладнана на оперативний центр, зберігши іржавий фасад, аби не привертати уваги.\n\nОкрім федеральних агентів, до розслідувань долучилися новоутворені Сонорські Рейнджери. Часу мало, адже з кожним днем картелі стають не лише сильнішими, а й нахабнішими. Якщо їх не зупинити найближчим часом — повстання неминуче. Тепер усе залежить від агентів у полі, які мають працювати без упину, аби викрити цих одурманених Джетом ідіотів."
  nf_com.116.a: "Тепер починається справжнє."

  nf_com.117.t: "Звіт Сонорських Рейнджерів — ОСНОВА"
  nf_com.117.d: "Вступ: Під проводом тимчасового директора Хенлона, Сонорські Рейнджери спільно з Федеральним Бюро Розслідувань прагнуть викорінити загрози наркотиків і насильства в регіоні, тимчасово замінюючи як державну, так і приватну поліцію на час загрози безпеці Співдружності.\n\nЗвіт агента Стернса: Формування та навчання першої команди під прикриттям, кодова назва ЛвСК (Люди в Світло-Коричневому), пройшло на відмінно завдяки довоєнним навчальним фільмам. Частково натхненні вигаданими й реальними джерелами. Моніторинг провінції виявив активність між Генераліссімо Віаллою та колишніми ватажками картелів — Ель Бандідо Сангрієнто та Марією Сіналоа. Природа їхнього союзу поки що невідома, але готується офіційне розслідування їхніх дій. Рекомендація — почати якомога швидше.\n\nДодаток: У ході підготовки виявлено разючу різницю в оснащенні: наші агенти мають військове спорядження, висококаліберну зброю та куленепробивні костюми, тоді як місцева поліція має лише револьвери, тканинні уніформи та металеві значки. Попри наміри не замінювати постійну поліцію після завершення операції, варто розглянути передачу частини спорядження з бюро до резерву для майбутньої служби правопорядку."
  nf_com.117.a: "Добрий початок."

  nf_com.118.t: "Звіт Сонорських Рейнджерів — ПЛАЩ"
  nf_com.118.d: "Вступ: За прямим наказом тимчасового директора Хенлона, групу ЛвСК (Люди в Світло-Коричневому) призначено на операцію під прикриттям (ОПЕРАЦІЯ ПЛАЩ) в самому серці картельної активності. Їхнє завдання — встановити контакт і проникнути в структуру картелю.\n\nЗвіт агента Стернса: Операція ПЛАЩ пройшла з помірним успіхом. Агенти Стейблер і Перальта встановили контакт із колишніми членами Хенте-Дель-Соль в Опуто. Угрупування на чолі з кимось на ім’я \"Скаллі\" прийняло їх до своїх лав. Після тижня участі в пограбуваннях, збуті наркотиків та інших злочинах, агентів запросили на зустріч у Хенте-Сіті. За словами Скаллі, до неї мають прибути майже всі угрупування, пов’язані з картелями. Це потребує подальшого розслідування.\n\nДодаток: Операція продемонструвала безпорадність тимчасової поліції: жоден зі злочинів агентів не був зафіксований, а це свідчить про повну відсутність контролю. Після знищення картелів систему правопорядку необхідно повністю реформувати."
  nf_com.118.a: "Справи ускладнюються."

  nf_com.119.t: "Звіт Сонорських Рейнджерів — ВІКНО"
  nf_com.119.d: "Вступ: Стосовно агентів Стейблера та Перальти, що діяли під прикриттям у складі ЛвСК (Людей у Світло-Коричневому) — запланована зустріч у Хенте-Сіті відкрила нові можливості для поглиблення проникнення в картель.\n\nЗвіт агента Стернса: Операція ВІКНО почалась стрімко — агенти встановили зв’язок із середньою ланкою картелю. Їх швидко провели до головного залу, де вже зібрались усі ватажки картелів, а очолив зібрання сам Генераліссімо. Лише за кілька секунд після прибуття почалась офіційна консолідація — усі картелі об’єднались проти нас.\n\nДодаток: Операцію необхідно перевести у нову фазу — від проникнення до гри у кішки-мишки. Агенти під прикриттям надалі добуватимуть інформацію, яка дозволить нам проводити відкриті операції проти картелю."
  nf_com.119.a: "Починається довга гра."

  nf_com.120.t: "Звіт Сонорських рейнджерів — КРИХТА"
  nf_com.120.d: "Вступ: Єдиний Картель було доведено до межі розпаду завдяки нашим зусиллям із позбавлення його джерел прибутку. У зв’язку з цим тимчасовий директор Хенлон був змушений розпочати Операцію «КРИХТА» — фінальну фазу знищення картелю в Сонорі назавжди.\n\nЗвіт агента Стернса: Агенти під прикриттям — Стейблер і Перальта — повідомили про чергову зустріч керівництва картелю. Тиск, який ми чинили, почав давати результати, тому вони й вирішили зібратись. На місці чергували агенти під прикриттям та загін Сонорських рейнджерів, що мав оточити будівлю. Щойно зібрались усі ватажки — операція розпочалась. Агенти вийшли з тіні, рейнджери надали підтримку. Лише за кілька хвилин більшість керівництва й підлеглих було заарештовано.\n\nДодаток: В’язниці Сонори переповнені картелівцями, потрібні нові установи. Але ця загроза — минуле. Тепер можна рухатися вперед."
  nf_com.120.a: "Нарешті — мир."

  nf_com.121.t: "МИР — у Співдружності Сонори править лише тверезість!"
  nf_com.121.d: "Після пролитої крові, втрат і безкінечних перемовин між сторонами, в Сонорську Співдружність нарешті повернувся мир.\n\nГубернатор, попри трагічний початок повстання «Los Cárteles Unidos», зумів довести їхнє підступне угруповання до справедливості раз і назавжди, забезпечивши чисте, (відносно) вільне від хімії майбутнє для всієї Співдружності Сонори!\n\nСподіваймося, що відтепер тут буде лише мир і добробут.\n\nІді Мелоун\n\nFederalist Times"
  nf_com.121.a: "Час рухатися вперед."

  nf_com.122.t: "Чи ми зазнали поразки?"
  nf_com.122.d: "Стара слава знову шириться континентом, дедалі більше Співдружностей постають наново. Але це викликало суперечки в Конгресі — як упоратися з цими новими величезними територіями та, загальніше, яку роль має відігравати Ред-Дір в Союзі? Сенатор Вудс довго виступає за федералізм і лібералізацію нашого федерального уряду. У цьому ключі він опублікував памфлет «Ідеали 1776» у Federalist Times, просуваючи ідею обмеження федеральної влади й особливо критикуючи Четверту Гілку.\n\nЦей памфлет здійняв хвилю підтримки по Співдружностях та в самому Ред-Дірі. Люди почали ставити під сумнів віру Джонсона в необхідність Четвертої Гілки. Навіть деякі віддані юніоністи закликали до її скасування як «неконституційної». У відповідь Джонсон уникає коментарів, знову зачинений у своєму кабінеті, ховається від натовпу, що вимагає відповіді.\n\nСтарий гуль знову поринає в роздуми про свій вибір, згадуючи ту ніч, коли троє солдатів увірвались до його кімнати. Старі революціонери, що кинули виклик Анклаву й обрали його як свого провідника. Але після того, як він зруйнував усе тиранічне... хіба сам не став тим, із ким колись боровся? Може, саме його страх корупції і породив Четверту Гілку? Але чи не є вона джерелом корупції сама по собі?\n\nЦі питання не дають йому спокою, і тоді його погляд падає на щось під стосом паперів — ту саму книгу, що витягла його з пияцтва: «Факел Свободи». Він запитує себе: чи зрадив свою нову мету, чи просто намагається втримати Союз разом?"
  nf_com.122.a: "Вудс має рацію..."
  nf_com.122.b: "Це необхідно!"

  nf_com.123.t: "Криза анулювання"
  nf_com.123.d: "Ще один звичайний день у Конгресі — Вудс знову виголошує сумніви щодо нової структури уряду, лунають гарячі дебати про конституційність. Але все змінюється, коли реформістський сенатор подає до зали законопроєкт — «Закон Джефферсона». Якщо його ухвалять, Співдружності отримають право скликати Конституційний Конвент із метою скасування Четвертої Гілки. Зала замовкла. Навіть Вудс не знає, як реагувати. Законопроєкт іде на голосування до Палати Представників.\n\nЗа мінімальною перевагою в один голос закон проходить Палату й потрапляє до Сенату. Вперше в історії нового Третього Континентального Конгресу дебати було пропущено, і закон одразу передали на голосування. На відміну від Палати, голосування в Сенаті закінчилося рівністю — 50 на 50. Неочікувана підтримка з обох таборів дала законопроєкту шанс. Та, згідно з чинною Конституцією, саме Генерал-губернатор Джонсон має вирішальний голос.\n\nУ залі поширився шепіт, коли Джонсон увійшов. Навіть частина юніоністів називає це порушенням Конституції — як може посадовець голосувати за продовження повноважень своєї ж інституції? Але це не має значення. Джонсон підходить до свого місця й голосує."
  nf_com.123.a: "Закон ухвалено..."
  nf_com.123.b: "Закон провалено..."

  nf_com.124.t: "Що слід зробити"
  nf_com.124.d: "У залі панувала тиша, коли голос Джонсона було зачитано вголос, і надії миттєво розвіялись. Але її порушив сам Джонсон. Старий гуль підняв синю книгу й заговорив до інших членів Конгресу напряму.\n\n«Сенатори, я голосую не як той, хто відкидає американську мрію, а як голос розуму, що бачить, що коїться за межами цих мармурових стін. Світ і досі у вогні — банди рейдерів нишпорять континентом, загрожуючи не лише нашим громадянам, а й самій нашій державності. На жаль, ми не можемо втілювати ідеали, доки наші люди голодні та незахищені. Але я клянусь вам усім тут — як тільки ми дістанемось Капітолійського пагорба на берегах Атлантики, я знищу цю Четверту гілку власноруч.»\n\nЗ цими словами Джонсон вийшов із залу, залишивши її в тиші, як і до того, як заговорив. Кожен сенатор озирався навколо, гадаючи: що ж тепер буде?"
  nf_com.124.a: "..."

  nf_com.125.t: "Що слід зробити"
  nf_com.125.d: "У залі панувала тиша, коли було оголошено голос Джонсона — та за мить її прорізав оглушливий гул радості. Роки болю й крові нарешті були відплачені: Америка більше не під владою твердої руки — влада повернулась до народу. Але радість перервав сам Джонсон, піднявши синю книгу й звернувшись до Конгресу:\n\n«Сенатори, я голосую сьогодні не як сліпець, що не бачить, що коїться зовні, а як чоловік, що прагне бачити свою улюблену державу єдиною. Саме ця книга нагадала мені — якщо ми не відстоюємо ідеали будь-якою ціною, тоді всі ці урядові театри не мають сенсу. Ваш Конституційний Конвент відбудеться, і ми нарешті рушимо до берегів Атлантики раз і назавжди.»\n\nПісля цих слів Джонсон залишив залу, яка тепер вибухнула оваціями — сенатори піднялись зі своїх місць. Але попереду ще багато роботи."
  nf_com.125.a: "Боже, благослови Америку!"

  nf_com.126.t: "Те, що здавалось неможливим"
  nf_com.126.d: "Конституційний Конвент у розпалі — ухвалюється вірну Конституцію зразка 1787 року. Вилучаються так звані «Поправки Ред-Діра» та визначається, що федералізм — це роль, а не форма влади. Та настав час обговорити президентство. Із скасуванням посади Генерал-губернатора постає потреба в її відновленні.\n\nПопри труднощі, лише одна кандидатура виглядає реальною — сам Джонсон. Вудс пообіцяв не балотуватись, доки не буде відвойовано Вашингтон. І саме Вудс іде до Джонсона, пропонуючи старому другові повернутися до уряду.\n\nБез зволікань Джонсон погоджується востаннє взяти на себе обов’язок. Його інавгураційна промова коротка, але змістовна: він говорить про американські ідеали та обіцяє, що його держава знову простягнеться від моря до моря, а незабаром відбудуться й повноцінні вибори."
  nf_com.126.a: "Америка знову має президента!"

  nf_com.127.t: "Американський шлях"
  nf_com.127.d: "Життя в Ред-Дірі — це старі американські прапори, що майорять поряд із новим стягом на кожній вулиці. Американа більше не просто спогад — це знову стиль життя. Культура довоєнної Америки була похована під снігом часу, та тепер цей рух прагне повернути її — від старих свят до нової інтерпретації маргіналів. Шлях Америки повертається, і ми — лише пасажири на цьому шляху."
  nf_com.127.a: "Час пристебнутись!"

  nf_com.128.t: "Душа Америки?"
  nf_com.128.d: "Країну охопило духовне відродження — у кожному куточку зʼявляються нові течії: від християнства, очищеного від комуністичної єресі, до... язичництва? Але найбільше суперечок викликає один особливо дивний культ. Кажуть, якийсь гуль — «Отець Гідроген» — заснував церкву, що поклоняється ядерному пекельному вогню? Справді?!\n\nЦі самозванці називають себе Віруючими Ядра й вважають Отця Гідрогена другим пришестям «Господа Електрона» — себто Великої Війни. Вони поклоняються Великій Війні! Ви серйозно?!\n\nКонгресу надійшло прохання від громадськості — заборонити цю секту, адже її віряни купаються в радіоактивній воді в надії стати гулями. Більшість помирає, а в інших просто відпадає шкіра. Це жарт? Ні? Якщо Джонсон їх не заборонить — я, чесно, звільнюсь з посади оповідача цього дерева."
  nf_com.128.a: "Джонсон забороняє релігію!"
  nf_com.128.b: "Він дозволив її?!"

  nf_com.129.t: "Північ, що стікає кровʼю"
  nf_com.129.d: "Мрія відродити Союз зародилась у басейні Монтани. Саме ці землі — нинішня Північна Співдружність — дали поштовх хрестовому походу проти Анклаву й бажанню замінити його як нове втілення Америки. Але тепер вона стала черговим головним болем для Джонсона. Коли гори було прорвано, справедлива ненависть, яку наші солдати несли в бою, тепер повертається додому. Ті, хто вижив з Анклаву й залишився в регіоні, почали публічно засуджувати наші попередні дії.\n\nВони згуртувалися й стали єдиним блоком спротиву нашим спробам упокорити гірську Монтану. З наближенням виборів головне питання — як кандидати зможуть приручити фронтир? Вцілілі з Анклаву пообіцяли бойкотувати вибори, а попереду — ще більше насильства. Монтана стікає кровʼю у вічному конфлікті, що супроводжуватиме Америку."
  nf_com.129.a: "Звичайні труднощі зростання, не інакше... сподіваємось."

  nf_com.130.t: "Гірський народ"
  nf_com.130.d: "Кажуть, гірське повітря сприяє божевіллю — і, здається, ця виборча кампанія тому доказ. Змагання перетворилося на відкриту битву за те, що робити з тими, хто вижив з Анклаву. Економічна політика та соціальні питання відійшли в тінь — знову Анклав у центрі подій. Два кандидати борються за голоси, та лише один отримає перемогу.\n\nПерший кандидат — Марта Сантьяґо, колишня реформаторка з Анклаву й обрана представниця вцілілих. Вона запевнила їх, що хоча вони служили тіням гріхів Америки, вони зможуть здобути спокуту. Жодна з політичних партій її не підтримала — її навіть підозрюють у військових злочинах. Та рівень її підтримки вже такий, що зняти кандидатуру — політичне самогубство.\n\nДругий кандидат — шериф Дуґлас Маршалл, який виріс у регіоні під владою Макартура. Пізніше він приєднався до Синів Свободи під проводом Майкла Вудса. Тепер він повернувся до рідних гір, несучи правосуддя фронтиру. Його ненависть до Анклаву зробила його тираном для них, і героєм для американців. Він прагне витіснити Анклав зі свого краю — з якнайменшими втратами."
  nf_com.130.a: "Сантьяґо перемагає!"
  nf_com.130.b: "Маршалл перемагає!"

  nf_com.131.t: "Шалений вибух"
  nf_com.131.d: "Голоси підраховано, й Північна Співдружність обрала поміркованого кандидата — шерифа Маршалла. Але ще під час його інавгурації надійшли тривожні новини з гір: Анклав перейшов до тактики рейдів. Їхні цілі залишаються незрозумілими, але небезпека — більш ніж реальна.\n\nНові підрозділи Національної гвардії сформовані та готові повернути цю нечисть назад до пекла. Надіслано прохання до Ред-Діра про допомогу. Надія — що Джонсон зможе зупинити хаос до того, як він пошириться далі. Майкла Вудса призначено керувати новим загоном, спрямованим у регіон."
  nf_com.131.a: "Нехай Бог нам допоможе..."

  nf_com.132.t: "Шлях до воззʼєднання"
  nf_com.132.d: "Нова губернаторка Сантьяґо не бариться з вирішенням проблем у Співдружності. Щоб «реабілітувати загублене племʼя», як вона його називає, вона дала повноваження поліції проводити обшуки у цивільних оселях у проблемних районах — аби знайти розрізнені групи анклавівців. Вона вірить, що зможе включити цих радикалів до суспільства, хоча більшість населення не поділяє її оптимізму.\n\nЩоб примирити обидві спільноти — нових американців і вцілілих з Анклаву — вона призначила свого колишнього суперника Дуґласа Маршалла шефом поліції. Маршалл сприйняв це як формальність, але народ підтримав рішення. Можливо, ми справді стоїмо на порозі примирення."
  nf_com.132.a: "Ідеалістка в серці."

  nf_com.135.t: "Один помах пера"
  nf_com.135.d: "Ситуація в Північній Співдружності досягла критичної межі для Ред-Діра. Громадськість столиці тисне на Джонсона, вимагаючи розслідування з боку Конгресу — адже регіон надто близько до Ред-Діра. У відповідь сенатора Вудса призначено головою нової слідчої комісії Конгресу, яка працюватиме разом із [MUC.GetLeader]. З одного підпису Північну Співдружність переведено під прямий контроль Конгресу.\n\nНовий губернатор співпрацюватиме з Конгресом, проводячи розслідування й звітуючи Вудсу. Формально це — демонстрація федералізму. Насправді ж — спроба стримати вплив [MUC.GetLeader], чия політична позиція — надто незалежна. Залишається чекати на звіт про становище в регіоні."
  nf_com.135.a: "Залишилось зовсім трохи..."

  nf_com.136.t: "Польовий звіт Співдружності — РОЗБІЖНІСТЬ"
  nf_com.136.d: "Преамбула: Ситуація в Північній Співдружності продовжує розгортатись. Група вцілілих з Анклаву тепер називає себе Єллоустонським Анклавом. Їхні наміри залишаються неясними, але відомо одне — вони прагнуть дістатися до Чикаго.\n\nЗвіт про дії: Цей новий рейдерський загін Анклаву виявив намір пробиватися з нашої території аж до Чикаго. Засіли вони у старих анклавівських фортах, звідки намагаються вирватись з-під нашого контролю. Але ми не можемо дозволити їм покинути наші землі — надто небезпечною є інформація, яку вони можуть передати. Рекомендація: вступити з ними в повномасштабний бій."
  nf_com.136.a: "Химерна компанія, нічого не скажеш..."

  nf_com.137.t: "Упокоєна Північ"
  nf_com.137.d: "Північ нарешті стабілізована під керівництвом губернаторки Сантьяґо. Їй вдалося знизити напругу між двома спільнотами й забезпечити мирне співіснування в регіоні. Нарешті для Північної Співдружності зʼявилась надія. Та все ще лишається страх, що цей край стане притулком для кожного анклавівського уламка у Пустці.\n\nПопри сумніви щодо лідерства Сантьяґо, вона просуває інші ініціативи. Вона домоглася прийняття закону, який розширює виборче право на всіх, хто служив під Макартуром. Цей крок шокував американських поселенців, адже раніше лише громадяни мали право голосу, а колишні солдати — ні. Попри те, що законодавство здобуло підтримку серед мешканців Анклаву, її майбутнє як губернаторки — питання відкрите. Чи вистачить досягнутого миру для перемоги?"
  nf_com.137.a: "Побачимо..."

  nf_com.138.t: "Упокоєна Північ"
  nf_com.138.d: "Північ нарешті умиротворена під владою губернатора Маршалла. Йому вдалося знешкодити анклавівських рештків до такого стану, що вони більше не становлять загрози. Обидві політичні сили хвалять Маршалла за його ефективність. Із завершенням конфлікту розпочато реалізацію нових законів.\n\nПівнічна Співдружність вирішила стати військовим центром нації — з тренувальними таборами, полігонами й експериментальними підрозділами. Фермерам не до вподоби мати стільки окопів на задньому дворі, але гордість за країну — переважає. Маршалл тепер сприймається як взірець для інших губернаторів."
  nf_com.138.a: "Сильна рука на штурвалі!"

  nf_com.139.t: "Кидаємо кості"
  nf_com.139.d: "Термінал видрукував відповідь Ґаллагера Макартуру, і вже за кілька хвилин у коридорі пролунали кроки. Готовий померти з честю разом зі своєю родиною, втомлений ветеран дістав з шухляди свій 10-міліметровий пістолет. Він навів приціл на двері, коли ручка повільно повернулась... але раптом пролунали постріли.\n\nҐаллагер лише міцніше стиснув зброю, поки крізь стіни не прорвався знайомий голос:\n\n— Ти там ще живий, хлопче? — гаркнув капрал Прайс.\n\nПолегшення накрило Ґаллагера — він знову разом зі своїми солдатами. Місто перетворилось на хаотичне поле бою. Хоча Анклав мав чисельну перевагу, через порушення звʼязку їхній Наказ 33 швидко став надбанням громадськості. Ворожі війська були розрізнені, і Ґаллагер скористався з цього, розбивши їх на землі, а Прайс збив гвинтокрили, що намагались втекти. До заходу сонця Янкі знову контролювали місто.\n\nУ міру того як кров Анклаву засихала на їхній формі, солдати Півночі сперечалися — що ж тепер? Ґаллагер вгамував товаришів, дістуючи довоєнні прапори, які Анклав намагався приховати. Він проголосив, що цим південним тиранам треба дати урок. Америка — для тих, хто за неї бʼється, а не для щурів із бункерів! Гулі здійняли крик і обступили свого названого сина. Дядько Сем відвернувся від них — але вони ніколи не відвернуться від нього. Орел і смуги знову злетять — і настане новий світанок."
  nf_com.139.a: "Боже, благослови Ґаллагера!"

  nf_com.140.t: "Домівка серед снігів"
  nf_com.140.d: "Перший консул Вудс щодня робить обхід — проходить зборами, перевіряє помічників. У правій руці в нього — холодна кава, в лівій — свіжий примірник Arcadian Press. Помічники з усіх куточків конфедерації усміхаються йому, намагаються звернутися за титулом, але Вудс щоразу відмахується. Він не політик, як Ґаллагер, а солдат. У його щоденному маршруті завжди фінал: робота в офісі.\n\nЦей сивий ветеран змушений носити довоєнні окуляри, аби бодай щось розібрати у звітах. Сивина на скронях — чи то від стресу, чи від років — усе частіше нагадує про вік. Найсильніше він це відчуває під час обіду, коли навідується на полігон. Там — юні, зелені новобранці. Вони змушують Вудса почуватися музейним експонатом. Хоч окопи півночі вже в минулому, але обличчя втрачених друзів не забудеш.\n\nНасамкінець, Вудс ставить підпис на рішеннях, схвалених асамблеями. Зниження податків, програми шкіл — усе проходить його стіл. Та на відміну від Джонсона, Вудс не додає нічого від себе. Навіщо навʼязувати своє, якщо люди вже сказали своє слово? Дорогою додому він проходить повз нові ліхтарі, торговців, мости. Усе це — наслідок його зусиль, але високого життя він уникає. Маленька стара квартира — от і вся його потреба. Колишній сержант не прагне влади — лише справ.\n\nТепер він формує північ, живучи на 500 квадратних футів."
  nf_com.140.a: "Місце знайдеться для всіх!"

  nf_com.141.t: "Людина, що тримає слово"
  nf_com.141.d: "Поправки до Конституції й відновлення конгресу стали великою перемогою для Співдружності, але тепер настав час розплати. У Ред-Дірі почалась виборча кампанія. Делегати, що були призначені, тепер мають здобути підтримку народу. Агітація лютує: плакати, мітинги, гасла — кожен клаптик столиці зайнятий.\n\nДжонсон, як і завжди, веде зірково-смугасту кампанію під гаслами на кшталт: “Союз зараз, Союз назавжди!” Вудс же зосередився на солдатах, виступаючи на базах і полігонах, борючись за голоси ветеранів.\n\nПозиції Джонсона стабільні, але його кампанія для інших юніоністів створила атмосферу єдності. Навіть Вудс визнав його зусилля. Та до виборів ще далеко. Головна подія попереду — щорічна “Доповідь про стан Союзу”. Поки вона готується, атмосфера в конгресі перетворилась з ділової на театральну."
  nf_com.141.a: "Найкращий час бути американцем!"

  nf_com.142.t: "Стан Союзу"
  nf_com.142.d: "Добрий вечір, мої американці. Я маю честь звертатись до вас із відновленої зали конгресу. Ще недавно ми тулитися один до одного в темряві, тікаючи від комуністичного півночі. Сьогодні ж — у нас є держава, економіка й вибори.\n\nПесимісти, що насміхалися з ідеалів Синів Свободи, тепер кусають язики! Але попереду ще робота. Альбертські прерії — за правом наші, та наша доля лежить на південь. Ми — справжні спадкоємці Америки. Нехай Анклав іде й намагається відібрати в нас цей титул — ми пригадаємо їм минулу зустріч.\n\nМи повинні просуватись на південь і вписати наші імена в хід історії. Відбудова ще триває, але ми вже на шляху. Стовпи нашої великої держави витягнуто з радіоактивного забуття — і ми більше ніколи не повернемося до пустки!\n\n(Лунають оплески та вигуки підтримки з усієї зали конгресу. Радіотрансляція розходиться на всю країну. Виборча кампанія набирає обертів, адже до голосування — зовсім трохи. Хоча чимало хто вдячний Джонсону за його здобутки, все частіше чутно запитання: а може настав час змін? Партія реформістів і Майкл Вудс набирають обертів. Після виступу — доля виборів стає підкинутою монетою.)"
  nf_com.142.a: "..."

  nf_com.143.t: "Зірково-смугаста Північ"
  nf_com.143.d: "Гвинтокрили літали без зупину: туди-сюди, ящики скидали просто на бетон. Північні піхотинці тягнули ящики до складу, а Ґаллагер, стежачи за перевантаженням, змахнув рукою по відкритій коробці. Свіженька пачка цигарок від Макартура. Зі сірником у пальцях — легені наповнились американською гордістю. Минуло багато років, як на Півночі зʼявилися цигарки, але момент був короткий. Через злітну смугу — конфлікт між гулями та солдатом Анклаву.\n\n“Відвали від мене, гнила потворо!” — рикнув солдат Анклаву.\n\n“Що з тобою не так, солдате?” — відповів капрал Прайс.\n\nСуперечка швидко переросла в бійку. Прайс наказав солдату допомогти з розвантаженням, за що отримав удар. Він сплюнув кров і відповів кулаком, збивши солдата з ніг. Перед наступним ударом Ґаллагер схопив його за руку. Прайс, скривившись, відійшов, а решта Анклавців лише мовчки дивились.\n\nКоли сутінки впали й сніг знову почав сипати, Ґаллагер повернувся до свого кабінету. Впав у старе скрипуче крісло, намагаючись осмислити день. Шульц попереджав його, що Анклав не переносить гулів. Але ж вони — громадяни, патріоти! На столі накопичуються рапорти — сутички між його солдатами й персоналом Анклаву. Але ці солдати — не просто гулі. Це родина. Вони виростили Ґаллагера, коли від нього відмовилась країна. Його погляд впав на пачку цигарок. Вони вбили Джонсона за це. За стабільність, процвітання й трохи допомоги. Прийдеться терпіти."
  nf_com.143.a: "Хай буде що буде — заради порядку."

  nf_com.144.t: "Щоб вгамувати маси"
  nf_com.144.d: "Допомога надходить, ресурси течуть на південь, і Ґаллагер подумав, що ось вона — щаслива кінцівка. Але правда далека від уявного раю. Люди дивляться на солдатів Анклаву з відразою: ті пʼють північний алкоголь, їдять хліб Ред-Діру й нічого не платять. Навіть після усунення Джонсона та Вудса, голос народу все ще чутно. Над Ґаллагером нависає наказ від Макартура — взяти все під контроль. Оглядаючи кабінет у пошуках натхнення, його око зупинилось на старому американському прапорі. Ось воно! Фальшивий конгрес, фасад для народу.\n\nЗа згодою верхівки в південних горах почалися роботи. Північний Конгрес — без жодної реальної влади, але виглядає красиво на площі. Хто ж посяде крісла? Анклав, звісно. Також допущені члени “Американського товариства” Ґаллагера — всі, крім гулів. Прайсу та іншим це не сподобалося, але “так треба”. Шульц запевнив Ґаллагера, що той матиме останнє слово в управлінні. Чи так це насправді — покаже час. Але наразі, здається, народ заспокоївся."
  nf_com.144.a: "Другий удар..."

  nf_com.145.t: "Наказ Порядку: ЦИТАДЕЛЬ"
  nf_com.145.d: "Нові дороги Ред-Діру — знову в руїнах. чоботи янкі марширують каменем, а околиці Північних Територій під пильним контролем. Гвинтокрили далі перевіряють наші межі, але щоразу ловлять вогонь із наших імпровізованих ППО. Наказ Ґаллагера був простий: перетворити північ на фортецю, готову стояти до останнього. Дядько Сем іде, й кожен тут знає: гори не відпустять ці землі.\n\nУ воєнній кімнаті — дим від ланцюгового куріння гулів, карти фронтів Півдня. Цигарки з логотипом Анклаву мають закреслену “А”. Ґаллагер, сидячи у своєму кріслі, переглядає план за планом — як штурмувати гірську твердиню. Прайс, знову на ногах, працює без упину, підтримуючи бойовий дух. Стабільність і порядок, яких вони прагнули — виявились пустими. Ґаллагер всміхається. Його родина в безпеці — хоч і коштом мрій."
  nf_com.145.a: "Боже, бережи Федеративні Штати!"

  nf_com.146.t: "Чобіт Янкі
  nf_com.146.d: "У самому серці аеробази, що колись була цитаделлю Анклаву, тепер — навчальний полігон. Юні новобранці й загартовані гулі готуються до майбутньої війни. Тріск стрілянини наповнює повітря запахом пороху. Манекени для штикового бою — роздерті, пінопласт валяється всюди. Імітаційні окопи на південному схилі повні солдатів. Прайс командує, кричить на “зелених” — бити точно, без жалю.\n\nҐаллагер готується до гіршого. Без гвинтокрилів логістика — пекло. Все тримають каравани з брамінами. Солдати йтимуть строєм, а вантаж — як встигне. Але гра варта свічок. Інакше місто буде під контролем тих А-покидьків. Для зрадників буде одна могила. Вони підуть туди ж, куди Джонсон. Бо всі зрадники — для дна ями."
  nf_com.146.a: "В одному Джонсон мав рацію..."

  nf_com.147.t: "Південний рубіж"
  nf_com.147.d: "Хоча перестрілка в Ред-Дірі відкрила бойові дії, з того часу було мало активності. Макартур мовчить, за винятком одного — фальшиві каравани. Торговці з півдня, сходу й заходу пробують прорватися через кордон. Зовні — звичайні мандрівні торгівці, але під личиною — кров Анклаву. Вони намагаються впровадити спецпідрозділи за наші лінії, поки Холодна війна не стала гарячою. На щастя, наші прикордонники пильні: кожна торгівля — під наглядом. Але ті, хто входить — часто бачать лише дуло. Якщо це Анклав — проблема вирішується. Якщо справжні торгівці — значить, допомогли воєнним зусиллям.\n\nНаші вартові — не з тих, із ким жартують. Найменший шурхіт чи тінь — і вогонь американського пекла зливається на ворога. Ніхто не пройде, хто не довів свою вірність янкі. Боронь Боже, впустити торгівця з обіцянками цигарок, а знайти лише зрадницьку усмішку. Деякі ставлять під сумнів жорсткі методи Ґаллагера на кордоні, але Прайс щоразу показує свої шрами: “Хочеш бути наступним?”"
  nf_com.147.a: "Вони отримують те, на що заслуговують!"

  nf_com.148.t: "Нехай доміно впаде"
  nf_com.148.d: "Останні кілька днів Ґаллагер стримував доміно від падіння — стримував війну. Війська стоять напоготові: лопати й гвинтівки — при них. Каравани завантажені, готові йти за нашими військами. Промисловість працює на повну. Копальні видобувають метал і електроніку цілодобово — усе для війни. Залишилось одне питання: коли Ґаллагер віддасть наказ?\n\nУ Ред-Дірі панує тиша, і вона відлунює в голові Ґаллагера, коли він іде нічними вулицями. Тепер тут маршують янкі, а не Анклав. Крамниці — напівпорожні, тротуари — потріскані, але ліхтарі знову світять. Але в провулку, де мало не загинув Прайс, тепер лише тінь. Стоячи в темряві, тримаючи руку на кобурі, Ґаллагер думає. Як він дозволив цьому зайти так далеко? Та вже не важливо. Завтра — війна. Анклав буде поставлений на місце."
  nf_com.148.a: "Нарешті настав час!"

  nf_com.149.t: "Революція по-нашому"
  nf_com.149.d: "Колись революцію проповідували пʼяниця Джек Джонсон і мрійник Майкл Вудс — тепер усе змінилося. Браян Ґаллагер, людина порядку, готовий надіслати наказ, що запалить нову Американську революцію. Тиранія Макартура й Чикаго не мине непоміченою для зоряно-смугастої людини. Колись був шанс на мир, коли вони обʼєдналися задля порядку, але тепер їхні справжні обличчя викрито. Ми хочемо відбудови, вони — очищення.\n\nГулі, тобто — громадяни, ті, що пережили перший день великої війни, — стали мішенню фальшивого уряду Америки. Годинник зупинився, більше нема часу тягнути. Війська не стримуватимуться. Хай Прайс першим перейде кордон — у нього є рахунки. Ґаллагер піде слідом, у старій формі, викинувши приталений костюм Анклаву. Нехай літера “А” згорить і буде забута, як і Сини Свободи."
  nf_com.149.a: "Боже, бережи Америку!"

  nf_com.150.t: "Заражені рівнини"
  nf_com.150.d: "До війни уряд намагався стримати щось, що Джонсон називає «Блакитним Грипом». Для стримування була створена зона — Кардон-Сатир. Тепер, після атомних ударів і століть ізоляції, цей регіон став гніздом найгірших істот. Над регіоном запроваджено пряме наглядове управління Конгресу. Звичайних людей тут майже не залишилось.\n\nЧимало хто питає: чи варто відбудовувати цю Співдружність? Чи краще зберегти її ізоляцію? Обидві партії відповідають однозначно: Союз має бути цілісним. Америка буде знову єдиною лише тоді, коли від Тихого до Атлантичного океану замайорять зорі й смуги!"
  nf_com.150.a: "Час бризкати гербіцидом!"

  nf_com.151.t: "Заколочені вікна"
  nf_com.151.d: "Нову Середньозахідну Співдружність передано під суворий військовий контроль, і протоколи стримування знову запроваджено. Кардон-Сатир підтверджено, а імпровізовані підрозділи в захисних костюмах сформовані з лав Національної гвардії. Але що робити з регіоном після того, як чуму буде подолано? Обидві політичні партії в Конгресі сперечаються, як краще рухатись далі.\n\nУніоністи пропонують план з відновлення гірничого сектору регіону. Нескінченна кількість брухту всередині зони дозволить фінансувати експедиції на роки вперед. Цей план залишає Співдружність радше на узбіччі, непридатною для поселенців, але відданою найсміливішим американцям. Частина підрозділів у захисних костюмах вже почала грабувати регіон, привозячи назад дрібнички, яких не бачили з часів бомб.\n\nРеформісти натомість заявляють, що хоча регіону потрібні зусилля, його слід заселити фермерами. Поля Небраски мають знову пастись худобою, а преміальне м'ясо — продаватися для фінансування очищення. Тести ґрунту показують, що мета реалістична, хоча й потребує більше зусиль. Тепер Джонсону як голові Конгресу належить обрати найкраще для Середнього Заходу!"
  nf_com.151.a: "Вибір — річ незмінна."

  nf_com.152.t: "На межі загибелі"
  nf_com.152.d: "Гіркий холод півночі — звична справа для Ред-Діра, однак вітри в новій Північно-західній Співдружності забирають не лише душі, а й врожаї. Урожай на заході загинув, і місцева законодавча влада тріщить під тиском. Федеральний Конгрес повільно реагує, сподіваючись на покращення погоди — але марно. Джонсон оголосив про скликання позачергової сесії Конгресу для розв’язання кризи.\n\nПоки Джонсон намагається схилити Конгрес до дій, поселенці на заході беруть справу у свої руки. Піратство, здається, не померло. Чутки про грабіжницькі банди зростають з кожним днем. Хоча державні запаси зерна ще під охороною Нацгвардії, питання лише в тому, як довго вони зможуть втриматись."
  nf_com.152.a: "Конгрес має діяти негайно!"

  nf_com.153.t: "Замерзла анархія"
  nf_com.153.d: "Конгрес не встиг вжити заходів, і народ Північно-західної Співдружності взяв усе у свої руки. Наші батальйони Національної гвардії були недостатні для підтримання порядку. Більшість регіону впала в анархію, лише столиця ще тримається. Ми маємо негайно розпочати план порятунку Співдружності.\n\nРеформісти працюють цілодобово, домовляючись про постачання будь-якої їжі в регіон. Черствий хліб тижневої давнини, придбаний у два рази дорожче, вже готують до відправлення. Ситуація настільки серйозна, що навіть представники Співдружності подали петицію про повну анексію регіону.\n\nУніоністи тим часом готуються повернути контроль через національні дії. Сформовано нові дивізії Нацгвардії, готові до дій. Преса активно висвітлює кризу, запитуючи: чи вчасні дії Конгресу? Джонсон зауважує — пресі нічого не догодиш. Але принаймні обидві партії об’єднались для боротьби з загрозою."
  nf_com.153.a: "Нацгвардія і хліб — по-американськи!"

  nf_com.154.t: "Приглушена буря"
  nf_com.154.d: "Наші федеральні війська й харчова допомога нарешті досягли берегів Тихого океану. Хаос триває, однак подальше загострення вдалося зупинити. Ми виграли час: зима почала відступати, фермери мають шанс почати заново. Місцевий парламент відновив роботу, вибори відкладено до стабілізації ситуації.\n\nПродовольча допомога зміцнила дух фермерів: вила знову стали знаряддям праці, а не зброєю. Полиці магазинів тимчасово повні й залишатимуться такими доти, доки фермери не зберуть врожай. Рейдерські банди все ще активні, однак населення вважає їх зрадниками. Розвідка й місцеві загони допомагають федеральним військам знищувати найбільші банди. Криза ще триває, але ми здобули час."
  nf_com.154.a: "Годинник ще не зупинився!"

  nf_com.155.t: "Проблемна дитина Союзу"
  nf_com.155.d: "Західне узбережжя й пустеля є найрозвиненішою, але водночас найвідсталішою частиною нового Союзу. На узбережжі — перероблені залишки Нової Каліфорнійської Республіки, що, хоча й має міста й вулиці, усе ще страждає від корупції минулого. А от Співдружність Чотирьох Штатів — колишні території Легіону — охоплена хаосом та переповнена колишніми рабами. Масова кількість людей — без житла й роботи.\n\nЗ огляду на ці проблеми, для двох нових Співдружностей буде застосовано різні підходи. Чотири Штати, переважно сільська територія з розрізненим населенням, залишатимуться під контролем Конгресу. Розпочнуться федеральні програми, буде прокладено дороги й переселено людей. Це вимагатиме чималих витрат із нового федерального резерву й запасів американських доларів. Як і колись, Америка підкорить західні пустелі й звільнить тих, хто досі в ланцюгах.\n\nНатомість Західна Співдружність, звикла до демократичної активності, отримає дозвіл на проведення виборів губернатора. Кандидати наразі невідомі, але незалежно від імен — завдання перед ними стоїть непросте. Політична корупція не новина для західного узбережжя, а брамінові барони вже погано реагують на наш новий контроль. З ними доведеться мати справу — і, мабуть, раніше, ніж пізніше."
  nf_com.155.a: "Історія двох світів!"

  nf_com.156.t: "Земля ланцюгів"
  nf_com.156.d: "Колись Співдружність Чотирьох Штатів була поневолена божевільним, що звався Цезарем — тепер же вона вільна під зірками й смугами! Проте, хоч ланцюгів більше й немає, ці люди досі не мають дому. Тому Конгрес вирішив створити федеральні програми для розв’язання цієї проблеми. Вудс, у цьому дусі, запропонував створення нового Бюро Визволених для роботи з колишніми рабами. Також мають бути запроваджені трудові програми, щоб забезпечити людей доходом для життя в нових землях.\n\nХоча Конгрес планує ухвалити ці заходи, аби зменшити кризу в регіоні, не всі переконані, що це не марна трата бюджету. Аргументують, що Америка — не комуністична командна економіка, й такий прямий контроль — це вже за межею навіть для Співдружностей. Федеральна допомога — одне, а переміщення людей, як цифр у таблиці — зовсім інше. Дебати тривають, і підсумок ще попереду."
  nf_com.156.a: "Ще одна суперечка!"

  nf_com.157.t: "Відновлена західна доля"
  nf_com.157.d: "Колись давно американські поселенці вирушили зі сходу, аби перетворити західні пустелі на новий дім. Тепер ми зробили те саме — хоч і прийшли з півночі. Західні простори континенту знову заселені. Це покоління, яке об’єдналося у спільному прагненні освоїти захід, тепер має глибокий зв’язок з історією. Ми, як і вони, прагнемо кращого життя під зірками та смугами.\n\nТе, що раніше звалося землею ланцюгів, тепер — земля асфальту. Імпровізовані чорні дороги, що перетинають Співдружність Чотирьох Штатів, вважаються досягненням, можливим лише для найславетніших держав. Колишні раби оселилися в регіоні, проходять навчання американському фермерству та сільському способу життя. Якщо зараз проїхатися Співдружністю, то побачиш ряди нових домівок з гордо піднятими прапорами США!"
  nf_com.157.a: "Наші пращури були б горді!"

  nf_com.158.t: "Наша перша доля"
  nf_com.158.d: "Сотні років тому поселенці й ковбої перетинали снігові гори й пекельні пустелі, аби дістатися Тихоокеанського узбережжя. Сьогодні ми зробили те саме. Ми пройшли крізь північні сніги до так званої землі ангелів. Але не все гаразд — стовпи корупції, закладені ще Новою Каліфорнійською Республікою, стоять досі. Два претенденти вирішили позмагатися за посаду губернатора, аби впоратись із безладом, залишеним НКР.\n\nПерший кандидат — Ґрант С. Гейс, одна з найвідоміших постатей нової Співдружності. Колишній політик НКР, його минуле викликає скепсис у столиці, але його ентузіазм щодо нового Союзу та позиції в ключових питаннях забезпечили йому підтримку. Тепер він має захищатися від критики щодо своїх минулих дій і дистанціюватися від республіки, що досі залишає слід на узбережжі.\n\nЙого опонент — Білл Келгун, сторонній кандидат, якого дехто взагалі не сприймає серйозно! Колишній Послідовник Апокаліпсису, він нині очолює нове псевдорелігійний рух, що викликає багато запитань. Але його популярність серед нижчих прошарків населення дає йому реальний шанс. Його благодійність і обіцянки соціальних програм дали йому перевагу, з якою Гейсу буде непросто боротися!"
  nf_com.158.a: "Перемога Гейс!"
  nf_com.158.b: "Келгун бере верх!"

  nf_com.159.t: "Келгун стає губернатором — Напруження між фракціями зростає"
  nf_com.159.d: "У несподіваному повороті подій, лідер партії «Каліфорнійський шлях» Білл Келгун здобув перемогу на виборах і став губернатором Західної Співдружності. Цьому репортеру прикро визнавати, що такий невідповідний кандидат був обраний не лише опозицією — ще більше бентежить той факт, що народ вирішив, ніби така особа взагалі заслуговує політичної посади, не кажучи вже про керівництво цілою Співдружністю. Як і слід було очікувати, кандидат від партії Старого світу Ґрант С. Гейс закликав до перегляду виборів, бо вважає, що Келгун скористався зв’язками з Баронами Брамінів, Братством Сталі та Послідовниками Апокаліпсису для здобуття перемоги.\n\nНезважаючи на це, Келгун відсвяткував свою перемогу словами: «Мир повернувся до нас, і я смиренно приймаю цю відповідальність як ваш провідник». Першим коментар щодо виборів надав Антон Флінн з фермерського господарства Flynn Family Farms, який виступив у щойно перейменованій радіопрограмі «Година Співдружності»: «Не можу говорити за своїх побратимів із "Ланцюгового блоку", але мене особисто шокує, що така людина перемогла на виборах». На завершення він загадково додав: «Я подбаю про те, щоб він довго не залишався губернатором».\n\nЧи є Келгун справді некомпетентним, як кажуть опоненти, чи ж навпаки — здібним діячем, який зуміє повести Співдружність до кращого майбутнього — покаже час. Протести вже почалися в багатьох великих містах колишньої НКР, передусім в Реддінгу. Є повідомлення про участь у них агітаторів із Братства Сталі, однак вони ще не підтверджені.\n\nКертіс Гарен\n\nFederalist Times"
  nf_com.159.a: "Хто ж переміг?"

  nf_com.160.t: "Гейс перемагає Келгуна! — Партію Старого світу перейменовано на «Нові американські патріоти»"
  nf_com.160.d: "У вражаючому політичному протистоянні, що сколихнуло всю державу, незламний Ґрант С. Гейс здобув перемогу. Він розгромив свого опонента, Білла Келгуна, у боротьбі за губернаторство Західної Співдружності! Атмосфера була електризована — американці з усіх прошарків суспільства зібралися біля радіоприймачів та кіосків із газетами, щоб стати свідками цієї історичної миті. Харизматичний Гейс, справжній захисник народу, підкорив серця виборців своїми пристрасними виступами та непохитною відданістю справі процвітання нації. Люди масово йшли на його мітинги, зачаровані обіцянками економічного відродження та кращого життя для всіх.\n\nЯк згадувалося в попередніх матеріалах, обом кандидатам довелося зіштовхнутись із тиском так званих «Брамінних баронів», які відмовлялися відмовитися від своєї економічної й політичної влади. Вони навіть створили імпровізовану кампанію під назвою «Ланцюговий блок», очолену впливовим бароном Антоном Флінном. В інтерв’ю для нашої журналістки Іді Малон Флінн сказав: «Республіка потребує мене. Потребує баронів, зокрема мене. Вона потребує людей із баченням. У Гейса є бачення, а в нас — засоби, щоб його втілити». Однак, попри перемогу Гейса, ситуація лишається напруженою: ходять чутки, що «Ланцюговий блок» проводить зустрічі з відступниками з Братства Сталі.\n\nКоли Гейса запитали, як він ставиться до «Ланцюгового блоку» та Братства, він відповів таке: «Для застарілих фракцій минулого це ваш єдиний шанс — зникнути й дозволити Західній Співдружності процвітати під моїм керівництвом. Якщо ж ви наполягатимете у своїй зраді — вас розчавить тягар власної пихи. Народ уже сказав своє слово, а я — його голос, його очі й найголовніше — його руки. Пам’ятайте це».\n\nКертіс Гарен\n\nFederalist Times"
  nf_com.160.a: "Боже, благослови Америку!"

  nf_com.161.t: "Розірвати ланцюги"
  nf_com.161.d: "Тема: Розслідування груп у Західній Співдружності, що планували громадянські заворушення\n\nОгляд:\nЗахідне відділення Федерального бюро розслідувань під керівництвом губернатора Гейса провело ретельне розслідування щодо підпільного угруповання, відомого як «Ланцюговий блок», яке намагалося підірвати демократичні засади Нової американської Співдружності. Група, яка надалі фігурує як «Дисонанти», мала намір спровокувати заворушення та потенційну громадянську війну, створюючи серйозну загрозу стабільності держави.\n\nДеталі розслідування:\nВиявлення цілі: «Дисонанти» виявились екстремістським угрупованням, що складалося з радикальних осіб, об’єднаних спільною метою — зруйнувати демократію після обрання губернатора. Їхнім планом було сіяти хаос, розбрат та повалити законну владу.\n\nВиявлення лідера: Через спостереження й збір розвідданих вдалося встановити, що лідером угруповання був Антон Флінн — харизматичний, радикальний діяч, який умів маніпулювати прихильниками. Йому вдалося залучити значну кількість прибічників, що стало серйозною загрозою національній безпеці.\n\nОперативні заходи: Група діяла таємно, використовуючи шифровані канали зв’язку й підпільні зустрічі. Її діяльність включала поширення антиурядової пропаганди, вербування розчарованих громадян і накопичення зброї для майбутнього повстання. На місці також виявлено ресурси Братства Сталі.\n\nРезультат: Операція завершилась швидким і рішучим придушенням угруповання. Кілька членів чинили опір арешту, що призвело до втрат. Сам Флінн був знайдений мертвим на місці — розчавлений кулакоподібною золотою статуєю, тримаючи в руці золоте кільце.\n"
  nf_com.161.a: "Боже, благослови ФБР!"

  nf_com.162.t: "Гейс їде додому! — губернатор навідує Нижню Каліфорнію з дипломатичною місією"
  nf_com.162.d: "Дім — це місце, де всі виростають, і думка повернутись туди бодай раз у житті виникає в кожного. Сьогодні Ґрант Гейс мав приємність повернутися туди, звідки походить — із дипломатичною місією до колишнього «штату Баха» з часів Нової Каліфорнійської Республіки. Колись підконтрольна бандами рейдерів, що вдавали з себе торговців, територія тепер розглядається як міст для дипломатичних контактів із Центральною Америкою. Для тих, хто не знає: Центральна Америка — або Мексика — це регіон, який відділяє Велику Нову Американську Співдружність від комуністичної й анархістської дикості, що, ймовірно, розгорталася далі на південь континенту.\n\nПриземлившись на тимчасовій смузі в Тіхуані на новозбудованому «Кораблі Ведмедя: Підприємець», губернатора Гейса зустрів натовп прихильників. Попри температуру понад 120 градусів за фаренгейтом, Гейс вийшов з літака у своєму плащі й пенсне, що рятували його від пекельного сонця Бахи. Зустрічі з місцевими чиновниками — як із часів незалежної Бахи, так і з періоду її включення до НКР — були короткими, але теплими: кожна завершувалася щирим сміхом і потисками рук.\n\nЄдиний, кого бракувало цього дня, — Антон Флінн. Він вважається зниклим безвісти після пожежі, яка знищила ферми родини Фліннів на початку року. За чутками, він живий і мешкає в передвоєнній підводній утопії. Жодних офіційних заяв від губернатора чи правоохоронців щодо Флінна чи інших діячів партії «Ланцюговий блок» не надходило. Коли Гейса запитали про місце перебування Флінна, той лише знизав плечима, усміхнувся і повернувся до своїх виборців. Може, й справді варто залишити минуле в минулому і дозволити баронам відійти в історію.\n\nКертіс Гарен\n\nFederalist Times"
  nf_com.162.a: "Найкращий губернатор!"

  nf_com.163.t: "Флінн на дні"
  nf_com.163.d: "Келгунові не подобалось це місце. І ще менше — людина, що стояла поруч. Та останніми тижнями він зблизився з колишнім старійшиною Братства, який називав себе «Вілд». Зрештою, Келгуна колись вважали винним у створенні Легіону через його бездіяльність, що, можливо, спричинила загибель і поневолення сотень тисяч. Вілд пережив подібне: людина, яка намагалася змінити своїх побратимів, хоч і марно.\n\nПісля того як Братство й Послідовників почали переслідувати, Келгун використав усю свою владу як губернатора, щоби обмежити розслідування проти підозрюваних спільників. Ситуація стабілізувалась — до того моменту, коли він отримав зашифрований сигнал від агента Братства з проханням організувати маршрут втечі з Каліфорнії для лоялістів, які застрягли в Мексоні. І ось уночі, очікуючи на перебіжчика разом із Вілдом на фермі Фліннів, вони зустріли людину в розкішному передвоєнному вбранні. «Губернаторе, старійшино! Не чекав вас тут. Ви часто відвідуєте бункери Братства в глуху ніч? Чи, може, готуєте чергову рятувальну операцію для цих нещасних?» — пролунав голос. З-під пальта з’явився револьвер. «Антон І. Флінн до ваших послуг. Хоча ви мене й так знаєте. Але, можливо, не знаєте, чим я займався останнім часом». Він глянув за їхні плечі.\n\nПо всій фермі й на східному обрії почали вибухати заряди. «Бачите, мої люди витратили кожну годину після — викрадених — виборів на встановлення вибухівки по всій Каліфорнії. Я виманив вас сюди, знаючи про вашу слабкість до Братства — дуже прикра риса. Але, в будь-якому разі, поки мій "Ланцюговий блок" і партія Старого світу Гейса сіють розбрат, прихильники Співдружності кидатимуться вас шукати... й знайдуть лише порожній офіс. Тож поки ваш оплот "свободи" розпадається, я насолоджуватимусь сонцем. Ви впадете, а борг буде сплачено». Побачивши вираз обличчя Келгуна, Флінн глянув на револьвер. «О, ви подумали, що я вас уб’ю? Ні, це лише про всяк випадок. Я ненавиджу смерть і шкодую, що доводиться так чинити. Але що ж, містере ДеВіте?..»"
  nf_com.163.a: "Ой лишенько..."

  nf_com.164.t: "За термінальними екранами"
  nf_com.164.d: "Коли лінії фронту в Анкориджі загрузли в болоті ще в перші роки окупації, дядечко Сем усе більше покладався на своїх розумників. Інженерів США доправили до Ред-Діру, де їх зустрів затхлий старий маєток — їхня нова штаб-квартира. Ці інженери разом із групою канадських фахівців стали батьками-засновниками Проєкту «Соляріс». Згодом маєток перетворився на осередок останніх досягнень військової робототехніки, призначеної для суворих умов анкоридзького фронту — аби підтримувати виснажені війська, що стояли в арктичних заметах Аляски. Але щойно конвеєри запрацювали, як загриміли й ядерні боєголовки Великої війни.\n\nКоли США стали радіоактивним порохом, залишки «Солярісу» були змушені виживати без державного фінансування, вступивши в епоху масового голоду й злиднів, яку назвали Довгою зимою. Лише після її завершення рештки проєкту постали в новій формі — Ліги людського поступу, організації, що прагнула відновити світ, трубка за трубкою. Першим їхнім кроком стало перепрофілювання старих постачальницьких роботів для сільського господарства. З дозволу новоствореної Шостої бригади ці агроботи перетворили вічну мерзлоту на поля бритвозлаку, забезпечивши Ред-Дір бажаним джерелом продовольства й полегшивши голод. Утім, не всі проєкти Ліги були такими безневинними.\n\nГлибоко в підземеллях маєтку інженери без упину писали код і лагодили древні вакуумні лампи. Порожні банки наповнювали невідомою рідиною, а термінальні монітори сягали стелі. Голова Ліги підходить до центральної панелі керування, вмикає стіну терміналів, і ті заливають кімнату блідим зеленим світлом. Ще один тумблер — і з динаміків лунає скрегіт, поки на екранах не з’являються аудіохвилі. На весь Ред-Дір розноситься моторошний крик, і створіння в терміналі вимикає себе, вибухаючи іскрами й уламками скла."
  nf_com.164.a: "Добре, хоч фермерські роботи лишились."

  nf_com.165.t: "Щорічні щурячі перегони"
  nf_com.165.d: "У Ред-Дірі знову настав сезон виборчих кампаній. Сьогодні відкрили шлюзи для всіх охочих — кожен кандидат намагається захопити заголовки. Кандидати Союзистської партії запустили свою патріотичну машину: друкують постери, статті, гасла. Їхня мрія — відновити Союз будь-якою ціною — знову пронизує суспільний дискурс. Агітаційні матеріали Реформістів уже ширяться серед місцевих активістів. Обіцянки Вудса — не здавати ані свобод, ані гідного життя — поки що, здається, виконуються. Але дорога ще довга, тож нехай переможе найкращий!"
  nf_com.165.a: "Союзисти добре продають свою мрію!"
  nf_com.165.b: "Та реформісти мають кілька слушних думок!"

  nf_com.166.t: "Ще одна зірка згасла"
  nf_com.166.d: "Нестихаючий сніг і туман Ред-Діра тяжіли над силуетом колоніального міста. Аеропорт вперше за місяці мовчав, відсутність гвинтокрилів спричиняла тривогу серед солдатів Анклаву. Патріотичні пісні, що лунали з келишка Реддірського самогону, змінилися на тишу, поки солдати грали в карти в казармах. Ґаллагер тим часом стояв над радіо, міцно стискаючи мікрофон, очікуючи відповіді від Макартура. У тривозі він прибуває на летовище — в одній руці бінокль, в іншій радіоприймач. Він вдивляється в туман, сподіваючись побачити хоч слід від гвинтів, але солдати в диспетчерській лише з недовірою хитають головами.\n\nІ раптом, тишу розриває ревіння двигунів і звук палаючих пропелерів — флот гвинтокрилів прорізає небо, залишаючи сліди диму й вогню. Десятки, а може й сотні цих сталевих птахів кружляють над містом, благаючи дозволу на посадку. Із радіоефіру долинають крики поранених. Ґаллагер, не маючи вибору, наказує відкрити всі можливі зони для посадки: дахи, автостоянки, парки — усе стає злітною смугою. Солдати Анклаву гасили палаючі машини по всьому місту. Деякі невмілі пілоти врізалися прямо в житлові будинки.\n\nЛікарні швидко переповнились, і тіла загиблих залишали просто на вулицях чи в заметах. Обличчя Ґаллагера лишалося холодним і непохитним, поки він віддавав накази зі шпиталю. Споглядаючи потік поранених і біженців, він пригадав свої перші дні, коли провалилася колонізація сходу. А потім — ще один удар: Прайс повідомляє, що Макартура більше нема. І Сантьяґо з ним. Ред-Дір знову сам на сам із темрявою, а Ґаллагер мусить тримати кермо."
  nf_com.166.a: "Це... неможливо..."

  nf_com.167.t: "Своїми зусиллями"
  nf_com.167.d: "Гудіння виробничих ліній у Ред-Дірі перетворилося на грізний рев — попит на військові ресурси зріс до нових висот. Із прибуттям новобранців від Макартура потреба у виробництві вийшла за межі попередніх розрахунків. Квоти Анклаву раніше були основою планування, однак тепер, із напливом біженців, система пішла під три чорти. Швейні майстерні запихають у підвали, а дахи перетворюють на городи в надії зібрати хоч трохи зерна. Найбільше відчув це Ґаллагер, який невтомно переглядає звіти з фабрик, намагаючись утримати баланс у виснаженому бюджеті.\n\nНе боячись рішучих заходів, Ґаллагер видає нову федеральну програму працевлаштування, щоб закрити прогалини. Уже вириті нові металобрухтові шахти в околицях Ред-Діра, що живлять сталеві печі. Та от землю з-під землі не витягнеш — простору бракує. Потреба у житлі та фермах уже перевищує спроможність рівнин Альберти. Залишки науковців Анклаву отримали завдання розробити ефективніше використання землі. Ґаллагер сподівається, що ця тимчасова латка протримається, доки його війська не повернуться до Макартура."
  nf_com.167.a: "Запускайте ці машини знову!"

  nf_com.168.t: "Загублене плем’я"
  nf_com.168.d: "Парки колись були символом переваги Анклаву — вільна земля для відпочинку здавалася немислимою до Макартура. Тепер же їх заповнили табори біженців: на кожному клаптику стоять намети, зведені халупи й похмурі обличчя. Черги за супом обвивають цілі квартали, а запаси їжі скорочуються з кожним днем. Місцеві жителі Ред-Діра з огидою дивляться на своїх «співвітчизників», адже порції в їхніх тарілках теж зменшуються. Ґаллагер тримає порядок грубою силою й цензурою, бо голодні бунти все ближче. Поліцейські в броні патрулюють провулки та бари, придушуючи будь-які спроби спротиву або обговорення кризи.\n\nТа неочікуваний союзник став на бік Ґаллагера — біженці з Макартура. Вони бачать у старому солдаті свого рятівника, і слухають його голос із гучномовців із увагою та вірою. Ґаллагер використовує цю додаткову силу: заселяє закинуті фабрики й шахти тими, хто шукає роботу. Він не приховує мети — повернути Макартур під контроль Америки. Щоранку гучномовці доносять це послання разом із патріотичними піснями для підняття бойового духу.\n\nОднак між адміністрацією Ґаллагера й новоприбулими залишається глибокий розлом — гулі. Багато колишніх громадян Анклаву плюються й ображають офіцерів-гулів, які намагаються виконувати накази. Ще гірше — почастішали випадки жорстокості з боку гулів, що викликає обурення серед військової верхівки. Навіть найближчі союзники тиснуть на Ґаллагера з вимогою вирішити ситуацію, та будь-який крок може зруйнувати крихкий мир."
  nf_com.168.a: "Ласкаво просимо додому, американці!"

  nf_com.169.t: "Північна зірка"
  nf_com.169.d: "Ґаллагер дивиться крізь тріснуте вікно, спостерігаючи за будівельниками, які відновлюють Макартур. Це його улюблений спосіб убити бодай трохи часу між нескінченними зустрічами та звітами. Флот пошкоджених гвинтокрилів, що прибув до Ред-Діра, тепер повертається назад — відремонтовані, готові збирати уламки. Вулиці лишаються пораненими після повернення міста: кулі пробили кожну стіну, дахи обгорілі, почорнілі від вогню.\n\nСеред завалів агітує Партія американської чистоти. Листівки та плакати вкривають кожен куточок. Відвойований Макартур став осередком ненависті до гулів — кількість госпіталізованих гулів зросла стрімко. У марній спробі зменшити кровопролиття Ґаллагер наказав місцевій адміністрації придушити ворожнечу, але ті швидко викинули наказ у смітник.\n\nПатріотичні пісні й гасла лунають ефіром новоздобутої півночі, однак громадська думка стрімко падає. Мешканці Ред-Діра незадоволені: запаси летять на південь, а їхні полиці лишаються порожніми. Колишні громадяни Анклаву хвалять нові склади з припасами, та Ґаллагерові це не додає балів у «питанні гулів».\n\nНизка зустрічей без кінця поглинає Ґаллагера. Він щотижня підписує сотню документів, але, дивлячись на блискучі вікна нових будівель, замислюється: чи надовго це? Скло блищить поруч із огидними плакатами, що вимагають «чистої Америки». Надія, яка прийшла з перемогою, зникла в нескінченному потоці засідань і лоббістів."
  nf_com.169.a: "Якби ж Чикаго був тут…"

  nf_com.170.t: "Реддірські залишки"
  nf_com.170.d: "Сьогодні ми отримали несподіваного посланця.\n\nЧикаго вже багато років підтримує обмежений зв’язок із залишками Шостої бригади, що діють у Ред-Дірі. Проте ми були надто зайняті власними справами, щоб активно спілкуватися з ними — обмежувалося це короткими обмінами інформацією чи ресурсами.\n\nВони прибули, щоби повідомити нам, що через два століття їм нарешті вдалося перемогти підступні сили Канадського народного фронту. Цей древній ворог американського контролю на півночі нарешті повалений. Вони хочуть формалізувати зв’язки з нами й підписати якісь офіційні документи щодо наших відносин. Усе досить просто, хоча в них, здається, є дивні уявлення щодо свого громадянства.\n\nТа все ж, це виглядає як легка перемога. Чи не так?"
  nf_com.170.a: "Корисні союзники, без сумніву."
  nf_com.170.b: "Пустельникам не можна довіряти, навіть якщо вони загорнуті в прапор."

  nf_com.171.t: "Крок за кроком"
  nf_com.171.d: "Схоже, наше повідомлення до AFB було сприйнято добре! Ми все ще надто далеко, щоб здійснювати тіснішу співпрацю, але принаймні ми знаємо, що стоїмо на одному боці!"
  nf_com.171.a: "Зірка за зіркою"

  nf_com.172.t: "Хіба ми не є так само американцями?"
  nf_com.172.d: "Ну, цього ми не очікували. Хоча вони й не плюнули нам в обличчя, керівництво Макартура дуже ввічливо відмовилося підписувати будь-які формальні угоди з нами. Можливо, це через нашу географічну віддаленість? А може, їм щось не подобається в нашому підході?"
  nf_com.172.a: "Це ще не найгірший варіант"

