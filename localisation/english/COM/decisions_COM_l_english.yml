l_english:

COM_rg_police_force: "Тимчасове агентство розвідки"
COM_rg_police_force_desc: "Невелика загальнонаціональна група, що працює з місцевими підрозділами для вирішення проблем по всій країні. Наразі головною метою є полювання на терористів КНДА. Однак обмежене фінансування дозволяє утримувати лише сімох агентів на повну ставку."

COM_og_police_force: "Корпус військової поліції Співдружності"
COM_og_police_force_desc: "Замість створення нового агентства для поліційних потреб, ми вирішили надати більше повноважень існуючій структурі військової поліції. В основному дислоковані в Ред Дірі, вони мають почати розширювати свою присутність у прилеглих регіонах, якщо хочуть остаточно покінчити з КНДА."

COM_lha_police_force: "Проєкт «Омні»"
COM_lha_police_force_desc: "Ми вирішили передати обов’язки щодо підтримання порядку в Лізі. У відповідь вони запустили проєкт «Омні», який передбачає створення нової роботизованої поліційної сили для загальнонаціонального розгортання з метою виявлення КНДА."

COM_WHC_occupation: "§3Управління Окупаційною Зоною Вайткорту§!"
COM_WHC_occupation_desc: "Нова окупаційна зона Вайткоурту вимагає ретельного нагляду. Зона отримає власну місцеву адміністрацію, через яку ми зможемо спрямовувати фінансування. Окрім того, ми створимо окремий проєкт для цього регіону."

COM_STA_occupation: "§3Управління Окупаційною Зоною Ґрейстейблу§!"
COM_STA_occupation_desc: "Нова окупаційна зона Ґрейстейблу отримає новий адміністративний орган. Населення колишніх територій Великої Зграї нарешті отримає можливість бути почутим. Щоб досягти повної інтеграції, ми повинні інвестувати безпосередньо у безкраї рівнини ще до будь-яких виборів."

COM_MDM_occupation: "§3Управління Окупаційною Зоною Калґарі§!"
COM_MDM_occupation_desc: "Нова окупаційна зона Калґарі була створена на згарищі місцевих племен. Тепер на нас покладено завдання інвестувати в регіон: побудувати нову дорожню систему та створити військові сили оборони. Є надія, що з часом це призведе до інтеграції."

