l_english:
  COM_sweet_home_americana: "Прогулянка крізь сніг"
  COM_sweet_home_americana_desc: "Роки ніколи не були добрими до солдатів у Ред-Дірі. Вирвані з домівок і кинуті в північну м’ясорубку, вони всі побачили справжню жорстокість."

  COM_month_of_the_red_snow: "Потяг на цвинтар"
  COM_month_of_the_red_snow_desc: "Війна висмоктала життя з кожного, хто був здатен тримати зброю. Анкоридж забирав і забирав, віддаючи лише соснові паради. Та зрештою він надіслав останній подарунок зламаним і розчарованим."

  COM_the_northern_pioneers: "Обіцяне «колись» настало"
  COM_the_northern_pioneers_desc: "Радіоактивний сніг, зрошений нутрощами наших побратимів, прокладає нам шлях. Наше минуле ще не залишилось позаду — нам доведеться боротися за виживання проти орд брудних комуністів."

  COM_the_yankees: "Лоялісти"
  COM_the_yankees_desc: "Багато хто вважає янкі надто суворими, жорстокими, а то й тиранічними, та насправді вони — лише вірні прибічники порядку. Стабільність і добробут виростають із духу порядку, який був знищений ядерним вогнем. Вони готові відбудовувати залишки, будь-якою ціною. Тільки б не знову досягти цього через гори трупів."

  COM_the_sons_of_liberty: "Ідеалісти"
  COM_the_sons_of_liberty_desc: "Синів Свободи називають дурнями і мрійниками, але вони — єдині, хто у цьому обпалені ядерному місті ще вірить у майбутнє. Вони дивляться на пропаганду й обвітрені прапори і бачать у цьому прагнення. Експеримент, знищений своїм заклятим ворогом, але той досі може жити. Вони прагнуть нічого меншого, аніж відновлення Союзу."

  COM_the_unfortunate_son: "Нещасний син"
  COM_the_unfortunate_son_desc: "Капрал Джек Джонсон колись був героєм, легендою — так деякі кажуть — але тепер він тінь. Привид часу, який самі ж примари хочуть забути. Переходячи від пляшки до пляшки, Останній Американець і справді останній у своєму вимираючому роді."

  COM_the_new_arms_race: "Головнокомандувач"
  COM_the_new_arms_race_desc: "Війна наближається до Ред-Діра, а Комісія абсолютно не готова до різанини. Вони безкінечно сперечаються через дрібниці — хтось має стати на чолі наших військ. Війну не виграєш комітетом."

  COM_question_of_arms: "Питання озброєння"
  COM_question_of_arms_desc: "Шоста бригада веде війну по Канаді ще з часів до янкі й комуністів. Але тепер вона вичерпала свої сили. Більшість наших людей мають лише палиці й ножі проти гвинтівок комуністів."

  COM_brush_off_old_stockpiles: "Забутий скарб"
  COM_brush_off_old_stockpiles_desc: "Коли комуністи вторглися в Анкоридж, Дядечко Сем надіслав у Канаду тисячі солдатів і зброї. Більшість тих запасів поховані часом, але, можливо, нам вдасться знайти кілька ящиків."

  COM_league_aid: "Подарунки від яйцеголових"
  COM_league_aid_desc: "Ліга людського прогресу — чорна вівця родини у Ред-Дірі. Вони сидять у своїй фортеці, керують своїми роботами й не зважають на світ. Та зараз вони вирішили допомогти у боротьбі з комуністами. Швидше з остраху за себе, ніж із патріотичних мотивів."

  COM_question_of_leadership: "Питання командування"
  COM_question_of_leadership_desc: "Потрібні командири, але лідерів катастрофічно бракує, і наші війська блукають безцільно. Треба когось підвищити і навчити, поки комуністи не вибили нам зуби. Але яке крило ми підтримаємо?"

  COM_the_liberty_guard: "Гвардія Свободи"
  COM_the_liberty_guard_desc: "Сини Свободи стали фундаментом нашої армії. Здається, кожен другий солдат вірить Майклу Вудсу та його ідеалам — тож чому б не дати слово й їм?"

  COM_the_yankee_grip: "Янкійський контроль"
  COM_the_yankee_grip_desc: "Хоч серця солдат належать Синам Свободи, решта офіцерів — вірні янкі. Ці офіцери-гулі — останній бастіон військової традиції, і ми маємо слухати саме їх."

  COM_holding_the_red_horde: "Стримати червону орду"
  COM_holding_the_red_horde_desc: "Страткомунна та інші уламки держав готуються розірвати нас на шматки. Ми мусимо перебудувати економіку й державу на потреби тотальної війни. Кожен шматок металу, кожна крапля води, кожен джоуль електрики — усе на війну."

  COM_fortress_red_deer: "Рити траншеї"
  COM_fortress_red_deer_desc: "Комуністи нас знову переважають кількісно. Ми повинні готувати траншеї до штурму. Надіслати солдатів з лопатами та кайлами. Розмістити мішки з піском і збудувати вогневі позиції."

  COM_strike_redmond: "Вдарити по серцю"
  COM_strike_redmond_desc: "Нас переважають на всіх фронтах, але ми не можемо сидіти на кордоні в очікуванні біди. Натомість треба зібрати волю та зброю й кинутися в саме серце ворога — на Редмонд. Наші найкращі стануть вістрям цього списа!"

  COM_mobilize_the_sixth_bigrade: "Мобілізувати Шосту бригаду"
  COM_mobilize_the_sixth_bigrade_desc: "Усі солдати на фронт — ніхто не залишиться вдома, коли наш спосіб життя під загрозою. Шоста бригада знову набере сили й назавжди відкине орду. Комуністи забрали в нас державу, наш світ своїми ядерними ударами — ми відповімо їм помстою!"

  COM_failure_of_settlement: "Провалені західні поселення"
  COM_failure_of_settlement_desc: "Мрії про перетворення дикого заходу на функціональне суспільство остаточно розбиті. Західні поселенці втратили свої врожаї й домівки. Вони тепер знову заповнюють Ред-Дір, сподіваючись відбудувати життя з нуля."

  COM_red_deer_industrial_complex: "Вічна імла"
  COM_red_deer_industrial_complex_desc: "Фабрики безупинно штампують гвинтівки, але настав час розширити масштаби. Ред-Дір має стати серцем промислового розвитку. Північ почервоніє від гвинтівок, викованих у полум’ї Ред-Діра."

  COM_cheap_residential_labor: "Біда мешканців"
  COM_cheap_residential_labor_desc: "Із часів окупації канадських жителів Ред-Діра постійно використовують як дешеву робочу силу. Знову доведеться «спертися» на них, аби відновити наші дороги."

  COM_block_style_housing: "Нескінченні ряди"
  COM_block_style_housing_desc: "Перенаселення Ред-Діра стало очевидним. Західні переселенці заполонили наші вулиці й провулки, не маючи де жити. Ми мусимо будувати нові ряди квартир всюди, де знайдемо місце."

  COM_fill_the_barracks: "Наповнити казарми"
  COM_fill_the_barracks_desc: "Через неконтрольоване зростання населення в Ред-Дірі, казарми стали найкращим рішенням. Поселенців, що зазнали поразки, буде відправлено туди — обміняють свободу на дах над головою."

  COM_long_march_home: "Слід на снігу"
  COM_long_march_home_desc: "Вони йшли на захід у пошуках багатства, а повернулися без грошей і роботи. Тепер Ґаллагер має знайти спосіб урятувати цих біженців, не знищивши скарбницю."

  COM_red_deer_influx: "Скупчені маси"
  COM_red_deer_influx_desc: "Ґаллагер відправив своїх людей провести облік — дізнатися, скільки поселенців повернулися в Ред-Дір. Вони ходять від вулиці до вулиці, рахуючи нових жителів."

  COM_more_labor_less_food: "Додаткова праця"
  COM_more_labor_less_food_desc: "Хоча запаси хліба закінчуються, приплив робочої сили почав впливати на промисловість. Ґаллагер сподівається використати зростання виробництва на користь війні — нестача хліба нас не зупинить."

  COM_frontier_experience: "Ґаллагервіль"
  COM_frontier_experience_desc: "За межами Ред-Діра почали з’являтися нетрі для надлишкового населення. Нові житлові ініціативи Ґаллагера не справляються з попитом. Так звані Ґаллагервілі повні злочинності, із власним чорним ринкои, але принаймні більше не навантажують бюджет."

  COM_the_cultural_question: "Культурне питання"
  COM_the_cultural_question_desc: "Культурна напруга — не новина для Ред-Діра. Після канадської помсти за ядерні удари, місцевих мешканців почали зневажати. Канадців вважають зрадниками, аркадійців — виродками, але Сини Свободи хочуть залагодити цю тріщину. Поки що в суспільстві залишаються три касти."

  COM_farmer_bots: "Металеві батраки"
  COM_farmer_bots_desc: "Яйцеголові з Ліги людського прогресу добре відомі в Ред-Дірі завдяки своїм фермер-ботам. Вони засаджують мерзлоту рядами бритвозлака. Але їхнє минуле набагато темніше, ніж здається."

  COM_the_second_stars_and_stripes: "Синя зірка"
  COM_the_second_stars_and_stripes_desc: "Аркадійці піднімають сині прапори, хоча янкі дивляться на них зверхньо. Багато років вони боролися за крихти, навіть канадці їх покинули. Але їх вже не можна ігнорувати — населення в Аліксі зростає, і Майкл Вудс це помітив."

  COM_answering_the_call: "Олов’яний солдатик"
  COM_answering_the_call_desc: "Щодня страх війни зростає, а Джонсон досі лежить без свідомості в лікарні. Ґаллагер починає готуватися, а Вудс нервово ходить коридором, сподіваючись на диво."

  COM_elections: "І бюлетені летять"
  COM_elections_desc: "Народ Ред-Діра заповнив вулиці, аби проголосувати — принаймні за ті варіанти, що йому дозволено. А наш лідер веде власну боротьбу..."

  COM_rg_dreams: "§3Я мрію про свободу§!"
  COM_rg_dreams_desc: "Ідеї свободи давно втрачено — ще до падіння бомб. Америка зазнала поразки, і тепер ми маємо зібрати уламки. Але чи зможе Вудс повернути свободу світу?"

  COM_rg_statehouse: "§3Свобода§!"
  COM_rg_statehouse_desc: "Ми нарешті захистили нашу державу від ворожих фракцій — тепер можна вписати наші ідеали у тканину держави. Ми обіцяли принести свободу нашому народові — настав час виконати обіцянку!"

  COM_rg_industry: "§3Процвітання§!"
  COM_rg_industry_desc: "Було пролито кров, фабрики розбомблено. Наші сільські землі все ще повні розбитих мрій і втрачених кришок. Тепер усе залежить від Вудса — чи зможе він зібрати цеглини докупи й закласти нові підвалини."

  COM_rg_industry_mil_1: "§3Арсенал свободи§!"
  COM_rg_industry_mil_1_desc: "Колись Америку називали арсеналом свободи — тепер ми маємо виконати цю обіцянку. Запускаймо машини, хай усі, хто лишився, ідуть на завод. Нам треба озброїтися — хай там буде мир чи війна знову."

  COM_rg_industry_mil_2: "§3Військові пайки§!"
  COM_rg_industry_mil_2_desc: "Багато солдатів ішли в ті крижані траншеї лише з гвинтівкою в руках і мрією про землю після війни. Настав час дотриматись обіцянки. Західні землі, відомі своїми провалами, передано солдатам. Можливо, на полях вони знайдуть свою долю."

  COM_rg_industry_mil_3: "§3Спроба і помилка§!"
  COM_rg_industry_mil_3_desc: "Ми солдати, а не інженери, але мусимо закрити прогалини. Треба перетворити сніг і бруд на гайки й болти. На складах фабрик накопичуються гори брухту — маємо використати все до останнього шматка."

  COM_rg_industry_civil_1: "§3Нагодувати народ§!"
  COM_rg_industry_civil_1_desc: "Тисячі голодують на півночі, врожаї гинуть, а річки замерзають. Вудс не дозволить своєму народові повторити долю комуністів і впасти в тиранію заради їжі. Трактори мусять знову вийти в поля та повернути надію."

  COM_rg_industry_civil_2: "§3Наш маленький Вашингтон§!"
  COM_rg_industry_civil_2_desc: "Ред-Дір колись був лише зупинкою на шляху до фронту, а нині став нашим домом. Треба пам’ятати: це ми обрали лишитися тут, отже, маємо зробити все можливе."

  COM_rg_industry_civil_3: "§3Слава минулого§!"
  COM_rg_industry_civil_3_desc: "До війни й до вибухів були часи достатку. Можливо, колись ми знову побачимо ситі вечері й міцні оселі для кожної родини."

  COM_rg_industry_2: "§3Адміністрація економічного розвитку§!"
  COM_rg_industry_2_desc: "Вудс провів чимало днів, роздумуючи, як перетворити наш маленький шматок пекла на справжню економіку. Доведеться укласти угоду з дияволом, бо єдині, в кого є кришки — це Збори Ред-Діра. Сподіваємося, нас не назвуть комуністами."

  COM_rg_re: "§3Влада ринку§!"
  COM_rg_re_desc: "Квоти — це для комуністів і Анклаву. Ми ж дозволимо ринку керувати економікою. Не наша справа — вказувати людям, як витрачати їхні кришки!"

  COM_rg_re_1: "§3Форма з брухту§!"
  COM_rg_re_1_desc: "Брухт — справа звична, по всій пустці він викликає відчуття дому. Але в ньому не проживеш — хіба що зробити з нього справжні стіни. Ми викопаємо старий метал і збудуємо справжні будинки — досить з нас наметів і Ґаллагервілів."

  COM_rg_re_2: "§3Паяльник і мідь§!"
  COM_rg_re_2_desc: "Якимось дивом ми знайшли запаси довоєнних технологій, колись створених для підкорення канадських просторів. Тепер ми використаємо їх, щоб залатати розрив: ми вже не американці чи канадці — ми аркадійці."

  COM_rg_re_3: "§3Загублене Євангеліє§!"
  COM_rg_re_3_desc: "Бомби забрали не лише життя, а й знання та досвід. Але з часом ми знову стали на ноги на полі бою. Тепер ми знаємо, що працює, а що вбиває — час усе це записати."

  COM_rg_id: "§3Земля вільна знову§!"
  COM_rg_id_desc: "Комендантська година, запроваджена Ґаллагером, допомогла приборкати хаос. Але тепер, коли настала мирна пора — навіщо вона ще діє? Вудс скасував обмеження, й народ знову вільно пересувається."

  COM_rg_id_1: "§3Сполучення держави§!"
  COM_rg_id_1_desc: "ОЗЗ уклала контракт із невеликою залізничною компанією — хоч вони й мають лише іржаві дрезини, але великі мрії. Вони обіцяють з’єднати наші дороги. Вудс поклався на цю Аркадійську залізничну компанію — вони трудяться, що й казати."

  COM_rg_id_2: "§3Позики під державні гарантії§!"
  COM_rg_id_2_desc: "Метою ОЗЗ було передати кришки з Ред-Діра в глухі села. Тамтешні поселенці вже називають ці позики «Милістю Вудса». Але ж беруть і будують фабрики. То навіщо скаржитись?"

  COM_rg_id_3: "§3Право на шахту§!"
  COM_rg_id_3_desc: "Умови в шахтах Анклаву були справжнім жахом. Тож шахтарі самі вирішили створити профспілку. Кажуть, це допоможе краще працювати й організовуватись. Вудс, хоч і боїться червоної зарази, все ж дозволяє це об’єднання."

  COM_rg_industry_3: "§3Залізний звір§!"
  COM_rg_industry_3_desc: "Колись величезні залізні звірі перетинали світ — ми думали, що їх знищили бомби. Але Аркадійська залізнична компанія нарешті збудувала перший простий вагон, і це лише початок."

  COM_rg_stability: "§3Стабільність§!"
  COM_rg_stability_desc: "Відтоді як упали бомби, ідея стабільності стала невловимою грою в кішки-мишки. Одні фракції намагаються здобути її силою, інші — революцією чи обманом. Політичні ігри завершено, пролито кров, і тепер нам слід відновити нормальне життя."

  COM_rg_confederation: "§3Єдність через бажання§!"
  COM_rg_confederation_desc: "Тепер, коли свободу закладено в сам центр управління, ми не повинні дозволити гнобителям повернутися до влади. Жодна частина нашої держави не повинна узурпувати силу для себе."

  COM_rg_power_people: "§3Система зборів§!"
  COM_rg_power_people_desc: "Де ж тепер дядечко Сем? Він більше не наставляє на нас рушницю, а Вудс і далі просуває свою мрію — державу, побудовану на зборах, керовану й створену самими людьми. Анклав плюнув би від такої думки, але Культ Свободи борються, аби зробити її реальністю."

  COM_rg_power_people_1: "§3Голос народу§!"
  COM_rg_power_people_1_desc: "Народ почав виявляти підтримку не лише державі, а й нашій адміністрації після створення всіх зборів. Символи нашої влади тепер з’являються по всій країні, показуючи суперникам, що їхній час минає."

  COM_rg_power_people_2: "§3Аркадійська асоціація§!"
  COM_rg_power_people_2_desc: "З роками ненависть між канадцями та американцями трохи згасла, і в Аліксі сформувалась нова культура — аркадійці. Поєднання обох народів дозволило забути про стару окупацію. Хоча вони й далі вважаються ізгоями своїх предків, сьогодні, після прийняття пропозиції Аліксу й створення зборів, аркадійці здобули новий вплив, підтримуючи нашу конфедерацію."

  COM_rg_economic_choice: "§3Свобода вибору§!"
  COM_rg_economic_choice_desc: "Колись Анклав володів майже всіма фабриками й навіть фермами. Тепер, коли вони — наші вороги, час повернути ці фабрики в руки народу. Нехай самі вирішують, як відбудовуватись — ми не можемо ними керувати."

  COM_rg_economic_choice_1: "§3Індустріалізація окраїн§!"
  COM_rg_economic_choice_1_desc: "Боротьба за владу зруйнувала окраїни, а економічна криза тільки погіршила становище. Слід відправити інженерів, завантажити постачання в вантажівки — попереду ще чимало роботи."

  COM_rg_economic_choice_2: "§3Озброєні до зубів§!"
  COM_rg_economic_choice_2_desc: "Останні роки кровопролиття й переворотів показали — ніщо не є безпечним без рушниці напоготові. Ми повинні озброїтися й бути готовими віддати життя за ці останні крихти, які в нас залишились."

  COM_rg_economic_choice_3: "§3Плоди свободи§!"
  COM_rg_economic_choice_3_desc: "Свобода вибору дозволила дехто в містах замислитись над високими ідеалами. Вони експериментують і винаходять у надії збудувати краще майбутнє за допомогою технологій, а не утисків."

  COM_rg_court: "§3Децентралізоване правосуддя§!"
  COM_rg_court_desc: "Поліцію контролювали окупаційні сили Анклаву з самого початку, але тепер ми можемо їх замінити. Шерифи курсуватимуть регіоном і гарантуватимуть, що свободи громадян будуть повністю захищені."

  COM_rg_court_1: "§3Закон землі§!"
  COM_rg_court_1_desc: "Переваги місцевої судової системи вже дають плоди. Рівень злочинності поступово знижується, адже сила закону починає проростати в свідомості людей."

  COM_rg_court_2: "§3Хранителі миру§!"
  COM_rg_court_2_desc: "Ред-Дір і Делберн створили власні відомства, бо сільські закони почали діяти. Всі присягнули захищати свободи народу, а Вудс тепер намагається знайти фінансування для розширення цієї системи."

  COM_rg_confederation_2: "§3Яскрава зірка§!"
  COM_rg_confederation_2_desc: "Джонсон мріяв про новий Союз — Америку минулого, але він похований разом зі Старою Славою. Ми не залишки, не уламки — ми держава, побудована на плечах тих, хто вижив. Північна зірка Аркадії проведе кожного, хто шукає свободу в цій крижаній пустці."

  COM_rg_federal: "§3Єдність через угоду§!"
  COM_rg_federal_desc: "Було обрано пропозицію Ред-Діра як основу для побудови нашого нового Союзу. Вона базується на старій американській системі, а централізована форма правління дозволить нашій адміністрації повністю реалізовувати закони країни."

  COM_rg_power_states: "§3Система представництва§!"
  COM_rg_power_states_desc: "Після того як пропозицію Ред-Діра було прийнято тимчасовим парламентом, ми надіслали повідомлення новим штатам у нашому Союзі, аби ті розпочали вибори до Асамблеї представників. Так ми сподіваємося забезпечити стабільне правління."

  COM_rg_power_states_1: "§3Земля миру§!"
  COM_rg_power_states_1_desc: "Нова стабільна влада сподобалась населенню. Вибори представників штатів надали людям нову мету й започаткували рух за мир між колишніми запеклими суперниками."

  COM_rg_power_states_2: "§3Єдині під одним стягом§!"
  COM_rg_power_states_2_desc: "Коли рух за мир охопив державу, наш народ об’єднався під новим зірково-смугастим прапором, готовим захищати наші ідеали. Колись закляті вороги почали примирюватися — й найцікавіше, що саме аркадійці на чолі цієї відбудови."

  COM_rg_regulations: "§3Економіка для федералізму§!"
  COM_rg_regulations_desc: "Наша нова адміністрація впровадила набір економічних директив з метою індустріалізації нашої держави — штат за штатом. Це має запобігти накопиченню ресурсів, як це було за правління Старої Гвардії."

  COM_rg_regulations_1: "§3Наша промислова міць§!"
  COM_rg_regulations_1_desc: "Наші зусилля з індустріалізації вже приносять реальні плоди. Нові фабрики з’являються по всій країні, виробництво композитних матеріалів і електроенергії стало серйозним поштовхом для нашої економіки."

  COM_rg_regulations_2: "§3Надзвичайний оборонний бюджет§!"
  COM_rg_regulations_2_desc: "Однією з переваг федеративного союзу є можливість створення федерального оборонного бюджету на випадок війни. Комуна на півночі набирає обертів — у нас немає вибору, крім як ухвалити такий бюджет заради захисту населення."

  COM_rg_regulations_3: "§3Федеральний корпус інженерів§!"
  COM_rg_regulations_3_desc: "Рух, який привів нас до влади, починався у війську — час віддати борг. Корпус інженерів тепер буде федералізовано, аби служити не лише Збройним силам, а й усьому народу."

  COM_rg_supreme_court: "§3Почесне правосуддя§!"
  COM_rg_supreme_court_desc: "Хоча саме за централізованого режиму Старої Гвардії ми й зазнали утисків, не слід забувати про загрози з півночі — комуністи, Ліга й ті самі залишки Гвардії укорінюються знову. Якщо ми не централізуємо наші закон і порядок — невдовзі не буде ніякого порядку."

  COM_rg_supreme_court_1: "§3Беззаперечний закон§!"
  COM_rg_supreme_court_1_desc: "З поширенням федерального права по всій країні ми можемо забути ті часи, коли продажні офіцери самі обирали, які закони виконувати. Ми ніколи не повернемось до днів юридичного гніту Старої Гвардії!"

  COM_rg_supreme_court_2: "§3Заради справедливості§!"
  COM_rg_supreme_court_2_desc: "Нова федеральна поліція під наглядом нашої Розвідувальної агенції стане опорою судової системи. Вони склали присягу захищати народ і підтримувати правосуддя в нашій державі."

  COM_rg_federal_2: "§3Знову об'єднані§!"
  COM_rg_federal_2_desc: "Наша нова федеральна система нарешті впроваджена на всіх рівнях управління. Настав час прийняти ім’я нашого народу і прапор нової держави!"

  COM_rg_dia: "§3Безпека§!"
  COM_rg_dia_desc: "По завершенні конференції в парламенті, Джонсону залишилося вирішити останнє питання. Настав час відтворити щось, що збереглося лише в пам’яті старих гулів..."

  COM_rg_dia_communists: "§3Наш давній ворог§!"
  COM_rg_dia_communists_desc: "Комуністи керували північчю досить довго — час розібратися з останнім бастіоном їхньої влади й відправити їх назад до їхньої матері-Батьківщини. Як саме це буде зроблено — вирішує новий директор."

  COM_rg_dia_lha: "§3Шестерні важливіші за серце§!"
  COM_rg_dia_lha_desc: "Безсердечні технократи з Ліги підривають нашу промисловість. Новий директор має два методи, як покінчити з їхнім залізним контролем. Настав час витіснити їхній вплив із нашої країни."

  COM_rg_dia_communists_mil: "§3Каптур§!"
  COM_rg_dia_communists_mil_desc: "Операція 'Каптур' розпочалась — наші агенти вже проникли в північні території. Арешти тривають, а наші суди заповнюються терористами-комуністами, яких засуджують до вигнання або ув’язнення."

  COM_rg_dia_communists_mil_1: "§3Остання директива§!"
  COM_rg_dia_communists_mil_1_desc: "Наші агенти вже глибоко всередині комуністичних територій, і тепер у нас є можливість завдати удару по самому їхньому серцю. Ми можемо витягнути той самий шип, що мучив нас із самого початку."

  COM_rg_dia_communists_sub: "§3Дзвін§!"
  COM_rg_dia_communists_sub_desc: "Операція 'Дзвін' розпочалася, й наші агенти поступово інтегрувалися серед комуністів. Ми вже знищуємо дрібні осередки зсередини. Незабаром зможемо повністю їх прибрати."

  COM_rg_dia_lha_mil: "§3Скло§!"
  COM_rg_dia_lha_mil_desc: "Операція 'Скло' набрала повної швидкості — наші агенти вирушили до Камросі. Поки що ми не зустріли серйозного опору. Сподіваємось, це триватиме й далі, поки ми наближаємось до штабу Ліги."

  COM_rg_dia_lha_mil_1: "§3Забуті межі§!"
  COM_rg_dia_lha_mil_1_desc: "Наші агенти зібралися біля штаб-квартири Ліги — час покінчити з ними раз і назавжди. Лишається лише гадати, що ми знайдемо в темряві їхніх стін..."

  COM_rg_dia_lha_sub: "§3Приплив§!"
  COM_rg_dia_lha_sub_desc: "Операція 'Приплив' розвивалась повільно, але тепер ми почали поступово замінювати інженерів, лояльних до Ліги, по всій країні. Доведеться ще зачекати, перш ніж дістатися до самого штабу — це й є кінцева мета нашої операції."

  COM_rg_dia_joint_taskforce: "§3Приємний сюрприз§!"
  COM_rg_dia_joint_taskforce_desc: "Останні польові звіти принесли несподівані новини для Директора. Виявляється, комуністи та Ліга почали вести спільний бізнес — про що стало відомо в доволі незручний момент для наших агентів. Один із наших агентів, що працює під прикриттям у Лізі, прибув до старого складу для закупівлі електричних компонентів і натрапив там на Агента Сілі, який діяв під прикриттям — але вже серед комуністів. Попри це, операція пройшла гладко, обидва зберегли прикриття. Після повернення і звітування про ситуацію, наші плани було вирішено переглянути."

  COM_rg_dia_communists_2: "§3На північному фронті спокій§!"
  COM_rg_dia_communists_2_desc: "Кошмар, яким були колись комуністи, залишився у минулому. Ми більше не страждаємо від терористів, що називали себе 'революціонерами'. Вони обіцяли свободу для робітників, а принесли лише гніт. Настав час забезпечити справжню свободу для нашого народу!"

  COM_rg_dia_lha_2: "§3Серця понад шестерні§!"
  COM_rg_dia_lha_2_desc: "Наші успішні операції остаточно прибрали заразу Ліги з нашої держави. Диявольський шепіт технології більше не отруює нас — хоча їхні розробки досі залишилися. Можливо, варто придивитися до того, що вони створили..."

  COM_rg_purge: "§3Божевілля§!"
  COM_rg_purge_desc: "Часу в Вудса не було. Ґаллагер уже стояв із ножем біля його шиї. Годинники відраховували останні секунди, поки Вудс то пірнав у безодню, то випливав назад."

  COM_rg_purge_c: "§3Покликати шерифів§!"
  COM_rg_purge_c_desc: "Оскільки Блекфолдс уже в облозі, ми змушені викликати більше шерифів, щоби приборкати ситуацію. Якщо цього не зробити найближчим часом, невелике повстання може перерости в криваву громадянську війну..."

  COM_rg_purge_c_1: "§3Зачистити околиці§!"
  COM_rg_purge_c_1_desc: "Маючи тепер достатньо сил, ми почали зачистку околиць міста. Вже триває планування штурму позицій повсталих солдатів. Насипи й земляні укріплення будуються для нашого наступу."

  COM_rg_purge_c_2: "§3Озброїти шерифів§!"
  COM_rg_purge_c_2_desc: "Наші шерифи не можуть іти в бій із дешевими револьверами. Потрібно видати зброю військового класу для зменшення втрат серед наших сил у майбутніх боях."

  COM_rg_purge_c_3: "§3Хороший, поганий і сніг§!"
  COM_rg_purge_c_3_desc: "Часу на зволікання більше немає. Ми повинні кинути зібрані сили в бій і надіслати чітке послання. Наші шерифи готові покласти життя заради свободи нашої держави..."

  COM_rg_purge_f: "§3Федеральна поліція на підході§!"
  COM_rg_purge_f_desc: "Ми змушені вислати федеральну поліцію у Блекфолдс, охоплений заколотом, щоб придушити бунтівних солдатів. Ми повинні діяти швидко, аби зупинити цей новий рух проти нашої влади."

  COM_rg_purge_f_1: "§3Кулі не беруть§!"
  COM_rg_purge_f_1_desc: "Наші поліцейські мають зброю, але не мають захисту. Повсталі солдати використовують стару бойову броню. Аби отримати перевагу, ми повинні зробити наших офіцерів невразливими для куль."

  COM_rg_purge_f_2: "§3Контроль над дахами§!"
  COM_rg_purge_f_2_desc: "Федеральна поліція має у своєму розпорядженні елітні снайперські підрозділи. Вони будуть розміщені на дахах для прикриття основних сил під час бою й задля зменшення втрат."

  COM_rg_purge_f_3: "§3Один постріл над станцією§!"
  COM_rg_purge_f_3_desc: "Час згаяно — наші елітні офіцери вирушають, щоб остаточно знищити це гниле осереддя в нашій країні. Якою б не була ціна — ми покінчимо з цим негайно..."

  COM_rg_purge_2: "§3Порядок відновлено§!"
  COM_rg_purge_2_desc: "Блекфолдс остаточно очищено, поліція змогла витіснити повстанців із нашої країни. Тепер ми можемо рухатися далі, зцілювати державу — без загрози нового перевороту над головою."

  COM_rg_stability_1: "§3Єдина держава§!"
  COM_rg_stability_1_desc: "Сьогодні сніг здається домівкою. Наша держава, колись розділена, тепер об'єднана. Ми готові зіткнутися з зовнішніми загрозами, що чекають за порогом. Вудс ще має пройти довгий шлях — сумніви його ще не покинули, та майбутнє знову виглядає яскравим."

  COM_rg_mil: "§3Рівність§!"
  COM_rg_mil_desc: "Наша держава об’єднана, але армія лежить у руїнах. Ми мусимо витягнути цей човен із дна. Очищений офіцерський склад потрібно замінити новими лідерами, готовими до захисту. І ми не можемо обирати тільки американців — настав час скасувати сегрегацію в армії. Усі — канадці, аркадійці, американці — повинні мати шанс служити."
  
  COM_rg_mil_officer: "§3Свіже м'ясо§!"
  COM_rg_mil_officer_desc: "Офіцерів майже не залишилося — вони загинули в окопах або від рук Анклаву. Вудс мусить це виправити: армія без лідерів — це м'ясорубка. Щоб добитися кращого результату, Вудс особисто навчатиме молодих душ і зробить із них те, чим можна пишатися."

  COM_rg_mil_e: "§3Лінія Едвардса§!"
  COM_rg_mil_e_desc: "Сержанта Едвардса призначено на будівництво нової лінії оборони проти Страткомунни на півночі. Лінія укріплених фортів має стримати будь-який напад. Більше ніколи ми не здамося в обійми червоних!"

  COM_rg_mil_e_1: "§3Передова база§!"
  COM_rg_mil_e_1_desc: "Для ефективного захисту на півночі наші інженери будують передову базу — Північну цитадель. Вона стане основою для виявлення й нейтралізації атак червоних — швидко та без вагань."

  COM_rg_mil_e_2: "§3Подарунки від НДІ§!"
  COM_rg_mil_e_2_desc: "Інженери принесли цінні подарунки зі своїх дослідницьких підрозділів. Використавши довоєнні технології, вони зробили прорив у зброї та броні. Нові бронежилети й боєприпаси вже готові до виробництва."

  COM_rg_mil_e_3: "§3Добре оснащена армія§!"
  COM_rg_mil_e_3_desc: "Щоб мати бодай примарний шанс на захист нашої держави, потрібно озброїти солдатів. Без якісного спорядження наші війська приречені."

  COM_rg_mil_boot_camp: "§3Урок починається§!"
  COM_rg_mil_boot_camp_desc: "Новий офіцерський клас нарешті входить у стрій. Відтепер вони братимуть участь у воєнних іграх для загартування навичок. Якщо не впораються під час навчань — не впораються й під справжнім вогнем."

  COM_rg_mil_boot_camp_1: "§3Навчання: Клин§!"
  COM_rg_mil_boot_camp_1_desc: "Гра 'Клин' проходитиме в Камросі. Нові офіцери навчатимуться наступальній доктрині: їхнім завданням буде захоплення й утримання укріпленої позиції з мінімальними втратами."

  COM_rg_mil_boot_camp_2: "§3Навчання: Незламний§!"
  COM_rg_mil_boot_camp_2_desc: "Гра 'Незламний' відбудеться у Блекфолдсі, на місці колишнього повстання. Її мета — тренування захисної доктрини в умовах міста. Офіцери мають відбити напад, зберігши боєздатність сил."

  COM_rg_mil_boot_camp_3: "§3День випуску§!"
  COM_rg_mil_boot_camp_3_desc: "Курс пройдено, а Вудс дав усе, що міг. Усе, що можна було навчити — вже сказано. Тепер останній іспит — справжнє поле бою. Нехай Господь береже цих дітей..."

  COM_rg_mil_officer_1: "§3Наші заміни§!"
  COM_rg_mil_officer_1_desc: "Старики вже зносяться — коліна не гнуться, руки не підіймаються. Настав час для нових. Ці молоді мають продовжити з того місця, де ми зупинились. Удачі їм — ми були скаженими в тих окопах."

  COM_rg_mil_air: "§3Ті, хто панують у небі§!"
  COM_rg_mil_air_desc: "Нашим силам не вистачає критичного елементу з часів бомбардувань — авіації. Без прикриття з неба наші війська будуть знищені. Ми маємо збудувати повітряні сили з нуля."

  COM_rg_mil_air_school: "§3Льотна школа§!"
  COM_rg_mil_air_school_desc: "Перший крок — навчання пілотів із крижаними жилами. У Камросі відкрито академію, де новачки перетворюються на героїв неба."

  COM_rg_mil_air_fighter: "§3Старі запаси§!"
  COM_rg_mil_air_fighter_desc: "Не дивлячись, що ВПС в нас не було, літаки в нас все таки були. Серед снігів знайдено поле зі старими винищувачами, залишеними довоєнним урядом. Пора оживити цих птахів. Надіємось, вони не вибухнуть."

  COM_rg_mil_air_1: "§3Авіабаза в Аліксі§!"
  COM_rg_mil_air_1_desc: "Алікс обрано осередком нових повітряних сил. Там збудують нову авіабазу з ангарами й тренувальними майданчиками. Не ідеально, але краще, ніж нічого."

  COM_rg_mil_air_fighter_1: "§3Уроки від привидів§!"
  COM_rg_mil_air_fighter_1_desc: "Старі винищувачі було вивчено й покладено в основу нових моделей. Ми більше не залежимо від довоєнних уламків — віднині ми можемо виробляти справжню техніку."

  COM_rg_mil_air_school_1: "§3Аси Аркадії§!"
  COM_rg_mil_air_school_1_desc: "Льотна підготовка завершилась успіхом — нові аси готові злетіти в небо. Вони не бояться ворожих снарядів і залишаються холоднокровними. Скелет нашої авіації сформовано."

  COM_rg_mil_air_bomber: "§3Ще одне кладовище§!"
  COM_rg_mil_air_bomber_desc: "Під час будівництва авіабази біля Форт-Джонсон знайшли ще одне літовище, повне старих бомбардувальників. Вони древні, але ще мають трохи життя в собі. Трохи турботи — і станеться диво."

  COM_rg_mil_air_2: "§3Володарі неба§!"
  COM_rg_mil_air_2_desc: "Нещодавно наші інженери запропонували дуже цікаву ідею — дирижаблі. Вони переконані, що якщо ми хочемо панувати в небі, то мажемо використовувати цих гігантів як повітряні фортеці. Попри те, що ця технологія для нас нова, ми вже досягли значного прогресу й почали розробку прототипів."

  COM_rg_uni: "§3Ціна свободи§!"
  COM_rg_uni_desc: "Поки в Ред-Дірі ми вдосконалюємо своє бачення управління, північ розсипається. У залі засідань усе частіше лунає питання: що Вудс робитиме з цими проблемами? Ну, спершу треба їх побачити..."

  COM_rg_uni_red: "§3План червоний§!"
  COM_rg_uni_red_desc: "Ми ховалися в наших кордонах вже занадто довго! Наші закляті вороги існують надто давно. Якщо ми хочемо рухатися вперед, маємо перетворити червону зірку на купу попелу!"

  COM_rg_uni_red_1: "§3Заповнюючи порожнечу§!"
  COM_rg_uni_red_1_desc: "У війні було втрачено багато життів. Хоч перемога була давно, її наслідки все ще дають про себе знати. Північні регіони спорожніли — лише кістки та гіркі спогади. Ми намагаємось заселити ці землі, але канадцям це не до вподоби..."

  COM_rg_uni_red_2: "§3Сплата боргів§!"
  COM_rg_uni_red_2_desc: "Ми використовували канадців ще з часів, коли розмахували зоряно-смугастим прапором. Тепер час платити по рахунках — виправити те, що зруйнували, і молитися, щоб цього вистачило."

  COM_rg_uni_red_3: "§3Червоного більше нема§!"
  COM_rg_uni_red_3_desc: "Минув час, і ми змогли повністю інтегрувати колишні червоні регіони. Проте розкол ще зберігається. Ще довго доведеться чекати, поки ворожнеча між населенням остаточно згасне..."

  COM_rg_uni_white: "§3План білий§!"
  COM_rg_uni_white_desc: "На заході лежить втілення тиранії — держава, збудована на гніті, що стоїть на брехливому золоті. Як може держава, що цінує свободу, дозволити своїм сусідам зникати в полоні тиранії? Ми маємо рушити й зруйнувати стовпи Вайткорту!"

  COM_rg_uni_white_1: "§3Наш похід на захід§!"
  COM_rg_uni_white_1_desc: "Землі Вайткорту малозаселені й готові до освоєння. Каравани вже шикуються на нашому кордоні, щоби розпочати нове життя. До того ж приплив аркадійців до регіону допоможе нам у його інтеграції."

  COM_rg_uni_white_2: "§3Наша прірва§!"
  COM_rg_uni_white_2_desc: "Війна з Вайткортом спустошила місцеву економіку. Держава вже схвалила фінансування гуманітарної допомоги. Зростання місцевого виробництва може прискорити інтеграцію."

  COM_rg_uni_white_3: "§3Народний вибір§!"
  COM_rg_uni_white_3_desc: "Час настав. Голоси підраховано, й тепер усе залежить від народу. Подивимось, який шлях вони оберуть..."

  COM_rg_uni_blue: "§3План синій§!"
  COM_rg_uni_blue_desc: "Вони брехали, крали, вбивали — а тепер сидять у горах і забули про те, що зробили на півночі. Але ми не забули. Вони покинули нас помирати в снігах, а потім повернулись — добивати тих, хто вижив. Ми відправимо їх у пекло, де їм і місце. За Джонсона! За Аркадію!"

  COM_rg_uni_blue_1: "§3Знаряддя з пекла§!"
  COM_rg_uni_blue_1_desc: "Після падіння старого уряду нам дістались інструменти, якими вони тримали в покорі старий світ. Ми не можемо дозволити цій силі потрапити до поганих рук. Якщо ці боєприпаси дістануться рейдерам, пустка порине в хаос."

  COM_rg_uni_blue_2: "§3Плід із забороненого дерева§!"
  COM_rg_uni_blue_2_desc: "З початку цього пекла ми працювали зі сміттям. Але тепер, коли уряд мертвий, у нас з’явився доступ до їхніх запасів. Ми транспортуємо ресурси з гір до Ред-Діра, що підвищує рівень життя."

  COM_rg_uni_blue_3: "§3Забуте світобачення§!"
  COM_rg_uni_blue_3_desc: "Окрім ресурсів та технологій, ми отримали ще щось — старий світ медіа. Фільми, книжки й музика ширяться нашими землями, викликаючи хвилю патріотизму. Наша маленька нація розгромила Америку. Сьогодні — гордий день бути аркадійцем."

  COM_rg_uni_brown: "§3План бурий§!"
  COM_rg_uni_brown_desc: "На сході існує псевдодержавне об’єднання кінних племен, що блукають пусткою. Їхня численність і розмір змушують нас діяти. Було б божевіллям залишити таку силу на нашому кордоні."

  COM_rg_uni_brown_1: "§3Заселення сходу§!"
  COM_rg_uni_brown_1_desc: "Східна частина колишньої Зграї майже не заселена. Кінні племена мало цікавились цивілізацією. Щоб вирішити проблему, потрібно заснувати прикордонні застави й заповнити прогалини, що залишились."

  COM_rg_uni_brown_2: "§3Щедра земля§!"
  COM_rg_uni_brown_2_desc: "Хоч земля Зграї й була пусткою, вона сповнена ресурсів. Ріки дадуть питну воду, а надра — корисні копалини. Треба інвестувати зараз, щоби отримати плоди згодом."

  COM_rg_uni_brown_3: "§3Голос зі сходу§!"
  COM_rg_uni_brown_3_desc: "Ми зволікали надто довго. Час розпочати референдум, щоб вирішити долю окупаційної зони. Або вони залишаються як є, або приєднуються до нас безпосередньо. Ми більше не можемо це ігнорувати."

  COM_rg_uni_yellow: "§3План жовтий§!"
  COM_rg_uni_yellow_desc: "На півдні нас затисли племена, одне за одним. Рейдери чатують біля наших воріт, чекаючи на нову слабкість. Ми не можемо дозволити їм вільно існувати на наших кордонах."

  COM_rg_uni_yellow_1: "§3Шлях, яким не йдуть§!"
  COM_rg_uni_yellow_1_desc: "Калґарі — це розрізнаний хаос посеред пустки. Якщо ми хочемо інтегрувати цей регіон, нам треба перетворити його на єдиний транспортний вузол."

  COM_rg_uni_yellow_2: "§3Усі до зброї§!"
  COM_rg_uni_yellow_2_desc: "На відміну від інших окупаційних зон, Калґарі межує з могутніми ворогами з усіх боків. Було запропоновано озброїти місцевих громадян, створивши нову поліцію, аби нам не довелося втручатися безпосередньо."

  COM_rg_uni_yellow_3: "§3Відправити скриньку для голосування§!"
  COM_rg_uni_yellow_3_desc: "Час настав. Ми достатньо вклали в Калґарі, щоби провести референдум. Майбутнє зони буде вирішено."

  COM_rg_uni_1: "§3Ціну сплачено§!"
  COM_rg_uni_1_desc: "Ми зробили це. Ми захистили кордони, і тепер наша свобода — під захистом. Жодна інша нація поблизу не зрівняється з нашою могутністю. Ми створили державу, багатство та безпеку. Аркадія — нарешті народжена."

  COM_rg_federal_laws: "§3Завершити створення держави§!"
  COM_rg_federal_laws_desc: "Ми зросли й викорінили ворогів зсередини. Настав час остаточно оформити наше управління. Ми досі живемо за тінню того, що передбачала Пропозиція Ред-Діра. Тепер слова на папері мають стати реальністю."

  COM_rg_federal_laws_mil: "§3Справжня армія§!"
  COM_rg_federal_laws_mil_desc: "Наша армія — це збірна солянка старих гулів і новобранців. Ми стали надто великими, щоби так функціонувати. Створюється нова континентальна армія з нуля. Попереду — реформи."

  COM_rg_federal_laws_mil_1: "§3Гідні служити§!"
  COM_rg_federal_laws_mil_1_desc: "Після створення нової армії ми запровадимо новий федеральний стандарт підготовки офіцерів. Це забезпечить наявність гідних командирів, коли вороги знову стоятимуть біля наших воріт."

  COM_rg_federal_laws_mil_2: "§3Як служити§!"
  COM_rg_federal_laws_mil_2_desc: "У Ред-Дірі буде збудована нова академія — осередок нашої армії. Кожен солдат пройде через неї, аби відповідати високим аркадійським стандартам."

  COM_rg_federal_laws_e: "§3Наше серце§!"
  COM_rg_federal_laws_e_desc: "Ред-Дір був серцем нашої держави від самого початку. Тепер ми розширимо заводи, що були збудовані тут давно. Їх подвоять і додадуть нові виробничі лінії. Віднині Ред-Дір буде як політичною, так і економічною столицею."

  COM_rg_federal_laws_e_1: "§3Наша рука керівництва§!"
  COM_rg_federal_laws_e_1_desc: "Ми довгий час користувались федеральною економічною політикою неофіційно. Це викликало плутанину. Тепер ми вкорінимо ці принципи в самій основі нашої держави."

  COM_rg_federal_laws_e_2: "§3Наша індустріальна маска§!"
  COM_rg_federal_laws_e_2_desc: "Хоча ми були зосереджені на внутрішній економіці, настав час виходити на зовнішній ринок. Ми створюємо національні торгові компанії, які діятимуть як наші представники в зовнішній торгівлі."

  COM_rg_federal_laws_1: "§3Формування управління§!"
  COM_rg_federal_laws_1_desc: "Щоб виконати обіцянки перед народом, ми маємо офіційно закріпити створення представницьких органів. Від Асамблеї Представників до Офісу Президента — наша адміністрація неповна. Цей недогляд буде виправлено найближчим часом."

  COM_rg_federalism: "§3Дім, збудований усіма§!"
  COM_rg_federalism_desc: "Сьогодні відкривається Асамблея Представників, щоби дати голос кожному куточку нашої великої держави. Цей новий орган створений через кровопролиття, і він втілює свободу, збудований усіма, хто має її в серці."

  COM_rg_federalism_1: "§3Головнокомандувач§!"
  COM_rg_federalism_1_desc: "Незабаром посада Президента буде відновлена, й Джонсон стане першим, хто її обійме. Джонсон був прапороносцем свободи від самого початку Аркадії, і тепер він поведе нас у майбутнє."

  COM_rg_federalism_2: "§3Наші засадничі принципи§!"
  COM_rg_federalism_2_desc: "Сьогодні ввійде в історію — нова аркадійська конституція стане законом і нашим ідеологічним компасом. Цей документ проведе нас крізь бурю майбутнього."

  COM_rg_confederation_laws: "§3Втілити конфедерацію§!"
  COM_rg_confederation_laws_desc: "Наша амбітна ідея єдиної конфедерації штатів витримала поділи та агресію з усіх боків. Нарешті настав час закріпити конфедерацію в законах. Ми втілимо високі ідеали в реальність."

  COM_rg_confederation_laws_mil: "§3Ті, хто готові§!"
  COM_rg_confederation_laws_mil_desc: "Наш старий військовий стандарт зруйнувало повстання. Щоб не допустити падіння держави, буде обрано новий шлях: не національна армія, а загальноштатне ополчення, до якого ввійдуть усі, хто готовий служити в будь-яку мить."

  COM_rg_confederation_laws_mil_1: "§3Ті, хто вірні§!"
  COM_rg_confederation_laws_mil_1_desc: "Найбільшою вадою старої військової системи була відсутність вірності власному народу серед офіцерів. Щоб вирішити цю проблему, офіцери тепер навчатимуться в кожному штаті й служитимуть у ополченні цього штату, щоби зміцнити вірність."

  COM_rg_confederation_laws_mil_2: "§3Ті, хто навчатимуть§!"
  COM_rg_confederation_laws_mil_2_desc: "Штатове ополчення — це добре, найкращих із них буде відправлено до Ред-Діра на розширену підготовку. Це допоможе забезпечити єдиний стандарт для елітних частин."

  COM_rg_confederation_laws_e: "§3Наша розосереджена економіка§!"
  COM_rg_confederation_laws_e_desc: "Із самого початку Ред-Дір був центром нашої промисловості, що стане проблемою, якщо місто впаде. Щоб запобігти цьому, ми розширимо виробничу базу по всьому регіону. Розосереджена промисловість зможе швидше відновитись у разі втрати центру."

  COM_rg_confederation_laws_e_1: "§3Уся влада — штатам§!"
  COM_rg_confederation_laws_e_1_desc: "Ми не будемо покладатися на якусь велику загальнодержавну економічну політику. Кожен штат отримає простір для зростання. І лише разом економіки штатів підтримуватимуть державу в цілому."

  COM_rg_confederation_laws_e_2: "§3Хай кришки течуть§!"
  COM_rg_confederation_laws_e_2_desc: "Щоб підтримати економіку штатів, ми дозволимо вільну торгівлю всередині країни — без податків чи обмежень. Ми сподіваємося, що так штати частіше торгуватимуть один з одним, ніж із зовнішніми силами."

  COM_rg_confederation_laws_1: "§3Завершити систему§!"
  COM_rg_confederation_laws_1_desc: "Борги виплачуються, дебати завершуються. Час закінчити цю конвенцію. Конфедерація буде завершена й продовжить свій шлях, виправляючи гріхи Америки. Аркадія має бути кращою."

  COM_rg_confederalism: "§3І голоси почуто§!"
  COM_rg_confederalism_desc: "Америка обіцяла, що народ буде почутий, але ми бачили, чим це завершилось — Анклавом. Тепер ми маємо дотриматись цієї обіцянки. Ми не вороги народу — ми і є народ."

  COM_rg_confederalism_1: "§3Представник народу§!"
  COM_rg_confederalism_1_desc: "Титул 'Президент' ми залишили в минулому разом з Америкою. Йому на зміну прийде Перший консул. Вудс уже обраний на цю посаду та продовжить служити своєму народу."

  COM_rg_confederalism_2: "§3Статті Аркадії§!"
  COM_rg_confederalism_2_desc: "Нарешті наші зусилля дали плід — нова Конституція юридично закріплює конфедерацію. Зі снігових рівнин, з-під чобота гнобителів, ми прийшли сюди. Навіть найоптимістичніші не вірили, що цей день настане."

  COM_rg_home_at_last: "§3Нарешті вдома§!"
  COM_rg_home_at_last_desc: "Минуло багато років із часів північних окопів чи навіть часів Джонсона. Вудс зібрав уламки докупи й довів усім, хто сумнівався: він здатен. Він не був політиком, як Ґаллагер, і не мріяв, як Джонсон — він просто був солдатом."

  COM_rg_north: "§3Тиша на північному фронті§!"
  COM_rg_north_desc: "Північ багато років була осердям хаосу. Комуністи, Анклав, та інші. Тепер ми нарешті можемо глянути в інший бік. Мріють про Тихий океан чи Східні рівнини — ми можемо перейти від боротьби за виживання до розширення!"

  COM_rg_north_cc: "§3Криза на рубежі§!"
  COM_rg_north_cc_desc: "Сільські поселення потерпають від внутрішніх загроз. Але це вже не ті самі проблеми, що колись. А в нас є значно більші справи на півдні."

  COM_rg_north_red: "§3Заповнення воза§!"
  COM_rg_north_red_desc: "Міддлмарк, магазин чи щось типу такого, стоїть сповнений припасів, які потрібні нашому ополченню. Треба їх захопити, поки вони самі не здогадалися робити щось із ними."

  COM_rg_north_red_rehabilitation: "§3Південна столиця§!"
  COM_rg_north_red_rehabilitation_desc: "Історії про Калґарі й його значення до війни ширяться, як вогонь. Тепер, коли місто звільнене й керується людьми, ми можемо почати його відбудову."

  COM_rg_north_red_school: "§3Повсюди креслення§!"
  COM_rg_north_red_school_desc: "У Калґарі знайдено безліч креслень! Це майже як скарб. Ми можемо використати їх у Ред-Дірі, щоби розширити наші знання."

  COM_rg_north_red_exile: "§3Місто-бум§!"
  COM_rg_north_red_exile_desc: "Із порожнього міста з одним магазином Калґарі перетворився на новий центр життя. Дехто каже, що він уже зрівнявся з Ред-Діром. І завдяки нашій конфедерації, можливо, одного дня саме Калґарі стане столицею..."

  COM_rg_north_red_idea: "§3Приручений південь§!"
  COM_rg_north_red_idea_desc: "Південний фронтир із дикої пустки став добрим місцем для життя. Хочеться вірити, що ми знайшли всі тіла… Але хто знає."

  COM_rg_north_loid: "§3Месія знову§!"
  COM_rg_north_loid_desc: "Від часу падіння бомб релігія не мала значного впливу на нашу державу. Але це змінюється. Нова віра охопила державу, спричинивши заворушення серед населення."

  COM_rg_north_church: "§3Наша власна церква§!"
  COM_rg_north_church_desc: "Згідно з нашою Конституцією, ми змушені дозволити розвиток Мудреців та їхньої церкви. В результаті вони почали формувати повноцінну структуру — нову Аркадійську церкву, що вже здобуває славу."

  COM_rg_north_church_work_ethic: "§3Їхня працьовитість§!"
  COM_rg_north_church_work_ethic_desc: "Аркадійська церква проповідує працю як чесноту, повертаючись до поселенських коренів. Ми можемо використати цю рису віруючих і повернути їх у цехи, а самі — дивитись, як течуть кришки."

  COM_rg_north_church_pop: "§3Поселення для віруючих§!"
  COM_rg_north_church_pop_desc: "Віряни — люди витривалі. Вони добровільно йдуть у найдикіші краї, приборкуючи їх і перетворюючи пустелі на живі прикордонні міста. Найвідданіші селяться саме там."

  COM_rg_north_church_idea: "§3Наш новий хребет§!"
  COM_rg_north_church_idea_desc: "Із моменту офіційного визнання Аркадійської церкви вона стала хребтом нашої державу: заводи працюють, пустка заселяється. Як ми взагалі жили без них?"

  COM_rg_north_crackdown: "§RВони не залишаться§!"
  COM_rg_north_crackdown_desc: "Після всієї тієї крові й жертв ми не дозволимо цим угрупованням знищити нашу державу! Ми зробимо все, щоб зберегти її — будь-якою ціною."

  COM_rg_north_crackdown_removal: "§RУ пекло їх§!"
  COM_rg_north_crackdown_removal_desc: "Північні комуністичні терористи не заслуговують на жодну милість! Ми достатньо пролили крові за їхню невдалу ідеологію. Очистимо історію від Редмонда — покажемо їм, що ми серйозні."

  COM_rg_north_crackdown_inquisition: "§RНарешті вільна держава§!"
  COM_rg_north_crackdown_inquisition_desc: "Ми це зробили — наша держава очищена від тих, хто загрожував нашому способу життя. Комуністичний вплив більше не торкнеться Аркадії. Час рухатись уперед, без червоної зірки."

  COM_rg_west: "§3Амбіції на заході§!"
  COM_rg_west_desc: "Століття на самоті в снігах змусили багатьох задуматись: а чи є там щось вартісне? Заклик моря дійшов і до Ред-Діра. Мрії про Тихий океан знову підштовхують уряд. Солдати вже готуються до маршу — до піщаних пляжів заходу."

  COM_rg_cascadian_expedition: "§3Марш на захід§!"
  COM_rg_cascadian_expedition_desc: "Після падіння Вартових проходу та захоплення їхніх земель ми переходимо до складнішого — управління. Ми тимчасово створимо військову адміністрацію, доки не зможемо передати владу місцевим."

  COM_rg_cascadian_army: "§3Кавалерія в дорозі§!"
  COM_rg_cascadian_army_desc: "Каскадійська експедиція звернулася за допомогою — треба захистити нові кордони. Вудс особисто обрав нових солдатів, які готові приборкати західний рубіж."

  COM_rg_cascadian_army_1: "§3Військова допомога§!"
  COM_rg_cascadian_army_1_desc: "Ми вирішили відправити 500 одиниць зброї експедиції. Цього має вистачити, щоб втримати кордон, якщо хтось наважиться нас випробувати."

  COM_rg_cascadian_army_2: "§3Належний спосіб§!"
  COM_rg_cascadian_army_2_desc: "Надійшли звіти про негідну поведінку каскадійських вояків. Щоб виправити це, ми відправимо туди аркадійських офіцерів для навчання прикордонних сил у дусі справжньої армії."

  COM_rg_cascadian_syn_kam: "§3Наш опорний пункт§!"
  COM_rg_cascadian_syn_kam_desc: "Після перемоги над Вартовими проходу настав час перетворити наші володіння на справжню базу. План полягає в одночасному ударі по С'їлкс і Камло — для остаточного закріплення у регіоні."

  COM_rg_cascadian_whi_dre: "§3Сніг, милий сніг§!"
  COM_rg_cascadian_whi_dre_desc: "Наступний крок — північ. Ми повертаємось у знайомі сніги. Наші солдати впевнені: північні снігові племена теж можна перетворити на працелюбних громадян."

  COM_rg_cascadian_bel_brk: "§3Дике узбережжя§!"
  COM_rg_cascadian_bel_brk_desc: "Останній етап експансії — вихід до узбережжя, нашої початкової мети. Це відкриє нашій державі нові можливості, яких немає в глибинці."

  COM_rg_cascadia: "§3Більше, ніж експедиція§!"
  COM_rg_cascadia_desc: "Західні землі тепер під нашим контролем, час припинити діяльність військової адміністрації. Ми передамо владу місцевим, але вони залишатимуться під нашим оком. Це — наші території."

  COM_rg_cascadian_economy: "§3Початкові інвестиції§!"
  COM_rg_cascadian_economy_desc: "На жаль, економіку з порожнечі не побудуєш. Треба вкластися, щоби запустити каскадійську економіку. Треба витрачати кришки, щоби заробляти кришки."

  COM_rg_cascadian_economy_1: "§3Новий гігант§!"
  COM_rg_cascadian_economy_1_desc: "Початок був непоказний, але зараз економіка Каскадії зростає. Ми інвестуємо в заводи в новому столичному регіоні. Скоро наші зусилля принесуть плоди."

  COM_rg_cascadian_government: "§3Центр управління§!"
  COM_rg_cascadian_government_desc: "Кувер — старе місто з багатою історією державного управління ще до бомб. Ідеальне місце для формування західної адміністрації. Звідси й керуватиметься весь регіон."

  COM_rg_cascadian_government_1: "§3Хто такий каскадієць?§!"
  COM_rg_cascadian_government_1_desc: "Ми назвали новий західний регіон Каскадією, але дедалі більше людей питають — що це взагалі таке? Назва, про яку ніхто не чув, тепер править нашими землями. Питань більше, ніж відповідей."

  COM_rg_cascadian_tax: "§3І кришки потекли§!"
  COM_rg_cascadian_tax_desc: "Інвестиції нарешті дали результат — тепер можемо отримувати прибуток із нового регіону. Нехай покриють наші витрати — солдати не мають залишитись без платні!"

  COM_rg_cascadian_washington: "§RДиявольський союз§!"
  COM_rg_cascadian_washington_desc: "Тепер, коли уряд Каскадії стабілізовано, ми шукаємо союзників у регіоні. Дехто запропонував укласти союз із Вашингтонським Братством — найсильнішим сусідом поблизу."

  COM_rg_cascadian_washington_trade: "§RГрішні прибутки§!"
  COM_rg_cascadian_washington_trade_desc: "Наш союз із Вашингтонським Братством починає приносити плоди — ресурси надходять до столиці. Мінерали, яких не знайти вдома, — одна з головних причин, чому ми вирушили на захід."

  COM_rg_cascadian_washington_investment: "§RЗнання проклятих§!"
  COM_rg_cascadian_washington_investment_desc: "Паладини Братства вирішили допомогти в обороні Каскадії. Ветерани ордену прибули до столиці регіону, щоб поділитися своїми методами."

  COM_rg_cascadian_washington_ally: "§RНаш сталевосердий союзник§!"
  COM_rg_cascadian_washington_ally_desc: "Час формалізувати союз із Братством. Якщо вони відмовляться — ми самі подбаємо про захист наших кордонів."

  COM_rg_cascadian_vic: "§0Острівний оазис§!"
  COM_rg_cascadian_vic_desc: "Острів Нью-Вікторія — невелика держава, повна можливостей. Їхні казино та панування в морській торгівлі зробили їх багатими. Чому б і нам не отримати свою частку? Запропонуємо просту торговельну угоду."

  COM_rg_cascadian_vic_trade: "§0Дарунки моря§!"
  COM_rg_cascadian_vic_trade_desc: "Угода з Нью-Вікторією починає приносити плоди — нові ресурси заповнюють ринки Ред-Діра."

  COM_rg_cascadian_vic_investment: "§0Прямі інвестиції§!"
  COM_rg_cascadian_vic_investment_desc: "Уряд Нью-Вікторії вирішив інвестувати безпосередньо в наші прибережні території. Прибутки від азартних ігор спрямовано в розвиток місцевої промисловості, з’являються нові заводи."

  COM_rg_cascadian_vic_ally: "§0Наш аморальний союзник§!"
  COM_rg_cascadian_vic_ally_desc: "Хоча Нью-Вікторія займається справами, які ми вважаємо аморальними, ці справи приносять прибуток. Якщо залишити ці бізнеси за межами наших кордонів — матимемо і кришки, і чисту совість. Узаконимо домовленість."

  COM_og_floodgates_closed: "Сила Старого Світу"
  COM_og_floodgates_closed_desc: "Війна закінчилась, і, як після ядерного вогню, ми все ще стоїмо. Комуністи завдали нам шкоди, але ми відправили їх до їхнього улюбленого Маркса в пекло. Тепер починається важке — відбудова півночі без втрати півдня."

  COM_og_terrorism: "§gВороги порядку§!"
  COM_og_terrorism_desc: "Попри наше нове право на владу, деякі сили прагнуть до анархії. Комуністи та Ліга особливо голосно висловлюються проти наших методів. Схоже, настав час навідатись до них."

  COM_og_police: "§gНепохитний порядок§!"
  COM_og_police_desc: "Щоб перетворити цю пустку на державу, потрібно виховати власний народ. Військової поліції надто мало для всього регіону. Два варіанти вирішення вже на столі."

  COM_og_national_guard: "Герої минулого"
  COM_og_national_guard_desc: "До війни Національна гвардія США підтримувала порядок у найнебезпечніших регіонах. Дехто вважає, що як останній бастіон американського правління, ми повинні її відродити."

  COM_og_national_guard_1: "Давні методи"
  COM_og_national_guard_1_desc: "Ще задовго до війни та самих Сполучених штатів, народи захищали свої столиці стінами. Тепер, коли атом повернув нас до темних часів, чому б не використовувати методи темних часів?"

  COM_og_federalize_mp: "Чим більше — тим краще"
  COM_og_federalize_mp_desc: "Навіщо створювати новий департамент, якщо можна розширити те, що вже є? Дехто пропонує просто збільшити Військову поліцію — дешевше й простіше."

  COM_og_federalize_mp_1: "Свіже м’ясо"
  COM_og_federalize_mp_1_desc: "Після розширення Військової поліції в законодавстві час це зробити на практиці. Розпочинаємо нову кампанію набору, щоб заповнити нові посади."

  COM_og_new_order: "§gЩось знайоме§!"
  COM_og_new_order_desc: "Хоча наша влада не нова, нові методи незабаром принесуть лад. Залишається питання: чи вдасться нам зробити з цієї пустки щось корисне?"

  COM_og_junta: "§gКурс на майбутнє§!"
  COM_og_junta_desc: "Маючи підтверджене право на владу, можемо приступити до відновлення держави. Перетворимо армію на справжню державу, гідну своєї спадщини."

  COM_og_army: "§gТрадиція понад реформу§!"
  COM_og_army_desc: "Дехто вважає, що нашу армію треба реформувати — але як покращити досконалість? Як казав капітан Ґаллагер, американська армія підкорила Китай і Канаду — кілька племен нас не зупинять."

  COM_og_guns: "§gЩо залишилось§!"
  COM_og_guns_desc: "Після майже двох століть окупації наші склади спорожніли. Остання партія довоєнних боєприпасів прибула до Ред-Діра, завершивши цілу епоху. Тепер нам слід дивитися в майбутнє, а не назад — на Вашингтон."

  COM_og_arsenal: "§gУрочисте відкриття§!"
  COM_og_arsenal_desc: "Сьогодні починається нова ера нашої окупації. Хоча запаси зброї вичерпались, ми нарешті зможемо поповнювати їх самотужки. Це лише перший крок на довгому шляху відновлення втрат, завданих атомом."

  COM_og_policy: "§gОчевидний спадкоємець§!"
  COM_og_policy_desc: "Наш окупаційний уряд є нічим іншим, як військовою автократією з мінімальною присутністю реального врядування. Поки Джонсон спивається до коми, Ґаллагер самопроголошено став Секретарем внутрішніх справ Співдружності. Багато хто вважає це захопленням влади, але старий капрал настільки п’яний, що навряд чи щось помічає."

  COM_og_industry: "Особистий проєкт"
  COM_og_industry_desc: "Секретар Ґаллагер вирішив розширити промисловість столиці як свій перший крок на новій посаді. Він пояснює це потребою годувати солдатів, але дехто підозрює, що продукція піде зовсім не за призначенням."

  COM_og_industry_1: "Золота каста"
  COM_og_industry_1_desc: "Ґаллагер обрав кількох інженерів, вірних йому, й завалив їх фінансуванням. Звідки гроші — ніхто не знає, але результати вони, дивним чином, показують."

  COM_og_suppress_speech: "Порядок відновлено"
  COM_og_suppress_speech_desc: "Останній потік ідеалістів, які прагнули змін, нарешті придушено. Порядок повернувся, тепер можна рухатись далі без страху перевороту."

  COM_og_statehood: "Американський штат"
  COM_og_statehood_desc: "Ми не повинні забувати, хто ми є — ми американці. Нас відправили сюди, щоб перетворити цю окупаційну зону на нову Співдружність. Ця місія триває, навіть якщо уряду США більше не існує. Ми несемо обов’язок як громадяни й солдати."

  COM_og_tax: "Рахунки мають бути сплачені"
  COM_og_tax_desc: "Ще до війни уряд працював на хабарях. Минуло багато часу, але нічого не змінилось. Просто замість сенаторів — офіцери."

  COM_og_nationhood: "Справжня американська система"
  COM_og_nationhood_desc: "Ґаллагер може говорити з Анклавом і керувати поліцією, але він не контролює північ. Адміністрація Джонсона і Вудса стає дедалі потужнішою, майже суперником Ред-Діра. Вони вже створюють офіційну армію — поза контролем Комісії."

  COM_og_american_people: "Ті, хто керує"
  COM_og_american_people_desc: "Комісія керувала Шостою бригадою з моменту відставки Джонсона десятки років тому. Але тепер, коли він повернувся і фактично править північчю без участі Комісії, у Ґаллагера та його прибічників виникає тривога..."

  COM_og_terrorism_cpla: "Червоний терор"
  COM_og_terrorism_cpla_desc: "Навіть після взяття Редмонда все ще залишаються комуністи, які ховаються в тіні, готуючись до нового походу. Ґаллагер зібрав залишки Шостої бригади в Ред-Дірі, щоб завдати удару. Джонсон може грати в президента, а Ґаллагер займається справою."

  COM_og_terrorism_cpla_1: "Їхній останній подих"
  COM_og_terrorism_cpla_1_desc: "Залишки комуністів сховалися на покинутій фермі. Війська Ґаллагера зібрались біля останнього укріплення, готові до фінальної битви!"

  COM_og_terrorism_cpla_2: "Замальовано поверх червоного"
  COM_og_terrorism_cpla_2_desc: "Століття терору комуністів закінчилося — й голосно. Вони більше не переслідують нас у наших же межах, але це не означає, що загроза минула. Усередині нашої держави є ті, хто хоче зруйнувати все, за що ми боролися."

  COM_og_terrorism_league: "Зниклі й знайдені"
  COM_og_terrorism_league_desc: "За останні роки надходить багато повідомленнь про зниклих людей у регіоні Блекфолдсу. Невідомо, куди вони поділись, але штаб-квартира Ліги розташована прямо в центрі. Можливо, час завітати до них у гості."

  COM_og_terrorism_league_1: "Тук-тук"
  COM_og_terrorism_league_1_desc: "Розслідування йшло повільно, але тепер доказів надто багато, щоб ігнорувати. Звіти про зниклих ведуть прямо до Ліги. Час зламати стіни й дізнатись, що вони ховають."

  COM_og_terrorism_league_2: "Підпалити все!"
  COM_og_terrorism_league_2_desc: "Після побаченого в штабі Ліги всі двері були замкнені. Як і казав Ґаллагер — ніхто не входить, ніхто не виходить."

  COM_og_enclave_event: "Анклав тут..."
  COM_og_enclave_event_desc: "Цей сержант каже, що він під командуванням Анклаву? Після залізного звіра, що впав із неба, ніхто вже не впевнений, що справжнє. Можливо, Дядько Сем і справді ще живий?"

  COM_og_enclave_visit: "Найпотужніша військова машина Америки"
  COM_og_enclave_visit_desc: "До падіння бомб Америка була в облозі з боку комуністів. У відповідь було створено силову броню — головну зброю нашої перемоги. Тепер Дядько Сем вирішив, що настав час знову почати її виробництво для підтримки нашої окупації."

  COM_og_enclave_visit_1: "Кавалерія прибула"
  COM_og_enclave_visit_1_desc: "Століттями ми продовжували нашу окупацію без жодних підкріплень чи поставок зброї. Та кавалерія вже на підході! Вперше за багато поколінь ми отримаємо свіже м’ясо для м’ясорубки, якою є Канада."

  COM_og_enclave_pseudo_alliance: "Ми присягаємо на вірність"
  COM_og_enclave_pseudo_alliance_desc: "Ми достатньо довго мерзли в снігах, тепер Дядько Сем офіційно визнає нас частиною союзу. Ми на крок ближче до відновлення держави, яку колись любили й втратили."

  COM_og_occupation_once_more: "Мандат Дядька Сема"
  COM_og_occupation_once_more_desc: "Ми знову відкриті для справ! Вулиці заповнюються припасами й солдатами — Америка повернулась. Просто не зазирайте за лаштунки й насолоджуйтесь Ядер-Колою від уряду."

  COM_og_open_the_mines: "Від дев’ятої до п’ятої"
  COM_og_open_the_mines_desc: "Головна причина нашої присутності в Канаді — видобуток ресурсів. Ми довго обідали, але з поверненням Дядька Сема настав час знову відкрити шахти."

  COM_og_restore_occupation_law: "Назад у США"
  COM_og_restore_occupation_law_desc: "Дядько Сем повернувся, тож ми можемо розпочати процес повторного приєднання до Союзу, навіть якщо хтось проти. Поки що ми станемо територіальною адміністрацією, а згодом — справжнім штатом у складі Союзу."

  COM_og_uncle_sam_quota: "Повернення до призову"
  COM_og_uncle_sam_quota_desc: "Велика війна, схоже, ніколи насправді не закінчувалась. Наша держава боролась за життя століттями, залишаючись у безпеці на півночі. Дядькові Сему потрібні нові солдати — і ми не можемо його підвести!"

  COM_og_enclave_investment: "Американський долар"
  COM_og_enclave_investment_desc: "Американські інвестиції повернулись! Сила долара вже відчувається на околицях Ред-Діра, де економіка починає оживати. Багато хто сподівається, що нова промисловість допоможе місцевому населенню, а не лише Дядьку Сему."

  COM_og_forced_americanization: "Зірка над кленовим листом"
  COM_og_forced_americanization_desc: "Коли окупація тільки почалась, ми практикували асиміляцію канадського населення. Після бомб ми припинили це, щоб зберегти порядок. Тепер, коли уряд надіслав підкріплення, ми можемо знову почати палити кленовий лист."

  COM_og_new_americans: "Інший зірково-смугастий прапор"
  COM_og_new_americans_desc: "У місті Алікс з’явилась нова група “американців”. Ці аркадійці, як вони себе називають, мають культуру майже ідентичну до тієї, яку просуває Анклав. Ми залишимо їх у спокої, адже вони не створюють проблем і теж майорять зірковим стягом, просто з трохи більшим вкрапленням синього."

  COM_og_sons_liberty: "Ще одна неспокійна ніч"
  COM_og_sons_liberty_desc: "Маленьке сніжне містечко Ред-Дір століттями було оселею лише порожніх полиць. Але тепер ніч у Співдружності вже не буває тихою. І ця ніч — не виняток..."

  COM_og_sons_rebellion: "§4Сини свободи§!"
  COM_og_sons_rebellion_desc: "Хоча комуністи й Ліга ліквідовані, влада Ґаллагера нестабільна. «Сини свободи» постійно тримають Анклав у напрузі, поступово формуючи справжню американську державу. Ті, хто використовує образ Дядька Сема проти нас, ще пошкодують, що знайшли нас після всіх цих століть."

  COM_og_unfortunate_son: "Очолюючи прикладом"
  COM_og_unfortunate_son_desc: "Джонсон знову бере управління в свої руки і має успіхи. Північ зростає під його управлінням, і люди переїжджають із Ред-Діра до Редмонда, зміцнюючи його ризиковану, але вдало зіграну ставку."

  COM_og_meeting_house: "§4Нова рада§!"
  COM_og_meeting_house_desc: "Перші Сини свободи використовували раду для змов просто під носом у королів. Ми ж використовуємо «Червоне сяйво» для своїх таємних справ. Поки солдати Анклаву п’ють до нестями, ми слухаємо, як їхні язики розв’язуються."

  COM_og_second_government: "Тіньове управління"
  COM_og_second_government_desc: "Ґаллагер може спілкуватися з Анклавом і керувати поліцією, але північ — це не для нього. Адміністрація Джонсона й Вудса зростає й майже вже зрівнялась із Ред-Діром."

  COM_og_stealing_the_shipments: "Зникле з вантажівки"
  COM_og_stealing_the_shipments_desc: "Вантажівки Анклаву курсують вулицями столиці, вантажені новенькими боєприпасами. Деякі коробки нібито «випали» дорогою. Поки що ніхто нічого не помічає, але ці боєприпаси вже потрапляють до рук військ Вудса."

  COM_og_backyard_industries: "§4Захована промисловість§!"
  COM_og_backyard_industries_desc: "Наша друга держава не має тієї ж промислової потужності, що й Ґаллагер, але це не означає, що ми безпорадні. У засніжених глибинах відкриваються приховані кузні для виготовлення зброї задля спільної справи."

  COM_og_army_rangers: "§4Справжні американські герої§!"
  COM_og_army_rangers_desc: "Рейнджери армії США були символом американської військової культури. Вони несли прапор і співали гімн де б не були. Час замінити солдатів, що люблять “E” і ненавидять зірки, на справжніх, синьо-білих американських героїв."

  COM_og_true_america: "За що воно того варте"
  COM_og_true_america_desc: "Образ американської республіканської держави був підтриманий Комісією, але тепер це лише маріонетка. Американське товариство Ґаллагера захопило владні органи й використовує їх на власний розсуд. Єдине полегшення — Джонсон не підкоряється цьому розкладу."

  COM_og_american_man: "Улюбленець Дядька Сема"
  COM_og_american_man_desc: "Секретар Ґаллагер останні місяці присвятив подоланню кризи, викликаної провалом заселення заходу. Ґаллагервілі потрохи зникають, а Ред-Дір починає надавати цим біженцям роботу та житло."

  COM_og_weapon_shipments: "§gСвіжа партія§!"
  COM_og_weapon_shipments_desc: "Виробничі лінії Макартура випускають гвинтівку за гвинтівкою. Свіжа партія прибула до Ред-Діра, готова вирушити на фронт у будь-який момент."

  COM_og_enclave_tactics: "Свідчення ветеранів-гулів"
  COM_og_enclave_tactics_desc: "Є гулі, як-от Джонсон, які билися з усіма можливими ворогами. Здобутий ними досвід має бути записаний, аби його спадщина збереглася навіть попри їхнє безсмертя."

  COM_og_american_occupation: "§gЛегітимне управління§!"
  COM_og_american_occupation_desc: "Після століть, протягом яких п’янчуга Джонсон керував своїм 'урядом' у снігах, ми нарешті маємо справжню провідну руку. Дядько Сем і Анклав тепер можуть вирівняти курс і врятувати наш потопаючий корабель."

  COM_og_enclave_rd: "§gНДІ Анклаву§!"
  COM_og_enclave_rd_desc: "Ліга колись була нашим науковим осередком, що керувала всіма установами, пов’язаними з наукою. Після того як їхній маєток спалили, ми втратили науковий потенціал. Але тепер до нас прибувають інженери Анклаву, готові повернути наш сектор до життя."

  COM_og_enclave_electronics: "Дива старого світу"
  COM_og_enclave_electronics_desc: "Під снігом приховані ресурси, які готові до використання фабриками. Ми почали розкопки, щоб задовольнити зростаючі потреби населення."

  COM_og_enclave_america: "Нова Американа"
  COM_og_enclave_america_desc: "Дні білого паркану й американської мрії давно минули. Ми не можемо жити минулим, яке призвело до кінця світу — але ми все ще американці. Анклав будує нову Америку, готову до випробувань пустки."

  COM_as_unopposed: "§gСалют з двадцяти однієї гармати§!"
  COM_as_unopposed_desc: "Нам більше не потрібна показуха з Джонсоном, аби правити регіоном. Його зв’язки з Синами свободи нарешті викрито — тепер він офіційно зрадник. Час відправити його туди, де йому місце — в снігове небуття."

  COM_as_sol_trial: "§gПетля ката§!"
  COM_as_sol_trial_desc: "Доля Синів свободи буде такою ж, як у комуністів. Ці ідеалістичні дурні висітимуть на вітрі разом зі своїми мріями. Щоб відновити порядок у цій жахливій сніговій пустці, лише Анклав може стояти, поки решта падає, як пішаки."

  COM_as_true_american_values: "§gЗірково-смугастий шлях§!"
  COM_as_true_american_values_desc: "Бомби похитнули Дядька Сема, але зірки та смуги досі гордо майорять над снігом. Кожен громадянин знатиме, що Анклав зберіг американський шлях, тоді як інші повірили в брехню трайбалізму."

  COM_as_internal_defense: "§gОчищення лав§!"
  COM_as_internal_defense_desc: "Сини свободи спирались на молодших солдатів як на свою опору — тепер ми повинні очистити лави від цих мрійників. Хай краще дрейфують снігами, ніж марять майбутнім, яке ніколи не настане."

  COM_as_army_rebuild: "§gТі, хто знають краще§!"
  COM_as_army_rebuild_desc: "Минуло багато часу відтоді, як ми брали участь у відкритій війні, але Анклав живе в битві. Ветерани з гір поділилися найціннішими знаннями з фронту, що допоможе нам перебудувати армію з нуля."

  COM_as_radio_enclave: "§gАнклав на зв’язку§!"
  COM_as_radio_enclave_desc: "Американське товариство вирішило розширити свою присутність за межами друкованого слова. Радіоприймачі вже надходять з гір, і тепер потрібна нова радіостанція, щоб наповнити ефір найамериканнішим контентом."

  COM_as_mca_veterans: "§gЦвіт нації§!"
  COM_as_mca_veterans_desc: "Відділення Макартура вирішив надіслати кілька дивізій своїх найкращих бійців для формування нового загону спеціального призначення. Вони прибули з власною силовою бронею та боєприпасами, готові втоптати комуністів у землю."

  COM_as_big_guns: "§gВелика зброя§!"
  COM_as_big_guns_desc: "Динаміт, ручні гранати та трубові бомби - оце увесь наш арсенал. Якщо гвинтівка — це найкращий друг солдата, то динаміт - кохання всього життя."

  COM_as_lessons_past: "§gСтарий Бронекорабель§!"
  COM_as_lessons_past_desc: "До силової броні хребтом армії США були танки — і сьогодні їм знайдеться місце. Архіви Макартура розграбовані, а креслення старих машин потрапили до наших інженерів. Вони вважають, що вже за рік ті знову працюватимуть."

  COM_as_modern_rifle: "§gКраще, аніж брухт§!"
  COM_as_modern_rifle_desc: "Протягом століть ми користувались тим, що лишилося після Великої війни та саморобним вогнепалом. Настав час розробити нову гвинтівку, гідну служби, зроблену прямо тут, на Північних Територіях."

  COM_as_vertibird_fleet: "§gПанувати в небі§!"
  COM_as_vertibird_fleet_desc: "Анклав усе ще має запаси старих гвинтокрилів із довоєнних часів. Ні, вони не настільки щедрі, щоб поділитися цими запасами, але вирішили передати креслення. Сподіваємось, незабаром ми зможемо самі виробляти цих пташок і знову піднятись у небо."

  COM_as_air_command: "§gВерхівка командування§!"
  COM_as_air_command_desc: "Якщо ми хочемо панувати в небі, нам потрібні найкращі пілоти. Ми сформуємо нове командування з ветеранів-пілотів Макартура, щоб навчити нове покоління 'свіжого м’яса'."

  COM_as_air_bases: "§gРед-Дір, як чутно?§!"
  COM_as_air_bases_desc: "У Ред-Дірі буде збудовано нові авіабази, щоб підтримати повітряну інфраструктуру. Вперше за століття жителі міста побачать, як гвинтокрили ширяють серед зірок, захищаючи їх згори."

  COM_as_fortress_canada: "§gФортеця Канада§!"
  COM_as_fortress_canada_desc: "Навколо нас — снігові рівнини. Хоч сніг ускладнює вторгнення, воно все ще можливе. Ґаллагер вирішив перетворити Північні Території на фортецю, готову зустріти загрозу."

  COM_as_purge_ranks: "§gУроки минулого§!"
  COM_as_purge_ranks_desc: "Нині знання збирають і документують як ніколи раніше. Від дрібних анекдотів до масштабних реформ — усе найкорисніше армійське надбання буде записано для загального доступу."

  COM_as_colonial_committee: "§gМісцеве самоврядування§!"
  COM_as_colonial_committee_desc: "Попри зацікавлення Макартура, ми не можемо керуватись із гір. Ми присягнемо зіркам та смугам, але саме секретар Ґаллагер керуватиме Північними Територіями, а не хтось з-за снігових перевалів."

  COM_as_taxes: "§gЧого забажає Дядько Сем§!"
  COM_as_taxes_desc: "Хоч ми й маємо місцеве управління, не можна забувати, хто над нами. Дядько Сем отримає все, що захоче, а в обмін — більше людських ресурсів на розвиток нашої місцевої промисловості."

  COM_as_open_new_mines: "§gПриховані скарби землі§!"
  COM_as_open_new_mines_desc: "Скоро буде відкрито нові копальні — як для підтримки нашої промисловості, так і для потреб Дядька Сема. Надане робоче населення спрямуємо глибоко в шахти добувати потрібні нам багатства."

  COM_as_farm_subsidies: "§gДопомога селянам§!"
  COM_as_farm_subsidies_desc: "Фермерів роками кидали напризволяще. Сьогодні все зміниться — ми субсидіюємо сільське господарство, щоб прогодувати наше зростаюче населення."

  COM_as_production_farms: "§gМіста економічного буму§!"
  COM_as_production_farms_desc: "На рубежі починають як на дріжжах виникати нові міста там, де виявляють ресурси. Держава прямо підтримує ці поселення, щоб забезпечити їх стабільність і функціонування."

  COM_as_water_table: "§gКопаємо нові криниці§!"
  COM_as_water_table_desc: "Хоча сніг покриває всю землю, для нових ферм потрібна вода. Буде прокопано нові криниці для підтримки як врожаю, так і кількості поселенців на прикордонні."

  COM_as_industrial_investment: "§gРічний бюджет§!"
  COM_as_industrial_investment_desc: "Уряд тримається не на ідеалах, а на важко зароблених кришках. І наш — не виняток. Щоб скарбниця не пустіла, запроваджуємо нову систему річного оподаткування."

  COM_as_imported_industry: "§gЗроблено в США§!"
  COM_as_imported_industry_desc: "Макартур надіслав нам ще один подарунок із гір: нові промислові методи та інструменти, готові до застосування. Ціла імпортована галузь чекає запуску нашими робітниками."

  COM_as_feed_uncle_sam: "§gГрошова прірва Дядька Сема§!"
  COM_as_feed_uncle_sam_desc: "Протягом наступних дев’яти місяців сам Дядько Сем фінансуватиме наш бюджет. Ці кошти потрібно використати на промисловості — тож ми сповна скористаємося цим капіталом."

  COM_as_new_industrial_methods: "§gНові промислові методи§!"
  COM_as_new_industrial_methods_desc: "Щоб підвищити промислову потужність, потрібно винайти нові методи. Нові інструменти, фабрики й навчання — усе це має бути введено в експлуатацію, якщо ми хочемо чогось досягти у цій пустці."

  COM_as_high_system: "§gВласний аналітичний центр§!"
  COM_as_high_system_desc: "Науковці Анклаву, яких перекинули з гір, почали будівництво так званого 'аналітичного центру'. Більшість простих солдатів не мають уявлення, що це таке, але вчені обіцяють, що воно того варте."

  COM_as_power_grid: "§gУвімкнути світло§!"
  COM_as_power_grid_desc: "Потрібна нова енергомережа, щоб забезпечити зростаючі потреби нашого регіону. Лише федеральна мережа здатна забезпечити струмом усі галузі нашої держави."

  COM_as_colonial_congress: "§gОсередок влади§!"
  COM_as_colonial_congress_desc: "Ґаллагер досі керує через Департамент внутрішніх справ, але часи змінюються. Щоб підтримати зростання уряду, буде створено новий конгрес, який замінить старий департамент."

  COM_as_economy_law: "§gЗакон про розвиток індустрії§!"
  COM_as_economy_law_desc: "Новий конгрес ухвалив закон, що визначає структуру всієї економіки держави. Від видобутку ресурсів до масштабного фермерства — усі сектори буде реформовано завдяки цій ініціативі."

  COM_as_resource_law: "§gЗакон про корисні копалини§!"
  COM_as_resource_law_desc: "Конгрес ухвалив новий пакет регуляцій для гірничої галузі. Будуть створені державні компанії, щоб перетворити дрібні місцеві копальні на щось більше й ефективніше."

  COM_as_conscription_law: "§gЗакон про національну оборону§!"
  COM_as_conscription_law_desc: "Щоб гарантувати захист наших кордонів, конгрес вирішив запровадити призов. Кожен громадянин віком від вісімнадцяти до сорока п’яти має служити в армії держави в тій чи іншій формі."

  COM_as_new_resources_wars: "§gЩо змушує світ крутитися§!"
  COM_as_new_resources_wars_desc: "Ресурси завжди були паливом у вогні, що рухав нашу державу ще до падіння бомб. Пустка — не виняток, ми зробимо все необхідне."

  COM_as_south: "§gЗламати систему§!"
  COM_as_south_desc: "Півднем керує капіталістичний комп’ютерний ШІ? Це серйозно? Ну й неважливо — випускай хлопців, хай вичистять усе, щоб більше не виникало зайвих питань!"

  COM_as_south_1: "§gСвітні орди§!"
  COM_as_south_1_desc: "За рівнинами Великої зграї кочуються орди гулів-дикунів — на відміну від наших цивілізованих янкі, ці божевільні й кровожерливі. Принаймні так каже Анклав. Наше завдання — розібратись із ними раз і назавжди."

  COM_as_nor_tech: "§gЕкспертиза ринку§!"
  COM_as_nor_tech_desc: "Якимось чином один комп’ютер утримував стабільну економіку протягом століть. Чому б не скористатись цим? Ми використаємо їхні симуляції на практиці."

  COM_as_nor_resources: "§gНайсолодший мед§!"
  COM_as_nor_resources_desc: "Ресурси, які цей комп’ютер контролював, тепер під нашою владою. Більшість із них буде вивезено на північ, до Ред-Діра, для належного використання!"

  COM_as_nor_freedom: "§gНаша південна доля§!"
  COM_as_nor_freedom_desc: "Південь, колись під контролем комп’ютера та скажених гулів, тепер очищений для нашого заселення. Ми відправимо туди наш народ, щоб приручити ці землі — цього разу правильно!"

  COM_as_east: "§gЦивілізувати орду§!"
  COM_as_east_desc: "На сході лежить держава кінних племен, що панують над рівнинами. Ці землі ідеальні для фермерства, то чому б не прогнати коней і не взяти землю собі? Нам не звикати."

  COM_as_east_1: "§gВартові на порозі§!"
  COM_as_east_1_desc: "Тепер, коли Велика Зграя узята, слід вирішити питання з Вартовими на кордоні. Щоб заселити регіон належним чином, ми повинні встановити там порядок, як зробили вдома."

  COM_as_eastern_farmland: "§gНароджуваний бум§!"
  COM_as_eastern_farmland_desc: "Завдяки новим фермам ми спостерігаємо наплив людей, що хочуть жити в цивілізованих і безпечних Північних Територіях. Хоч їх і потрібно асимілювати, ми не маємо причин відмовлятися від робочих рук."

  COM_as_eastern_settlement: "§gПриручити Схід§!"
  COM_as_eastern_settlement_desc: "Нові поселенці вирушили випробувати удачу на схід. З’являються нові міста, ферми й копальні, які забезпечать нашу державу всім необхідним."

  COM_as_eastern_development_agency: "§gЗакон про розвиток сходу§!"
  COM_as_eastern_development_agency_desc: "Конгрес вирішив: якщо зі Сходу ми хочемо зробити щось більше, ніж просто рівнини, — держава має втрутитися. Кришки підуть на схід, фінансуючи промислові проєкти, аби земля була не лише з врожаєм, а й з виробництвом."

  COM_as_north: "§gМи не забули§!"
  COM_as_north_desc: "Редмонд був нашим головним головним болем від самого початку! Від комуністів до Синів Свободи — настав час показати, що означає виступати проти нас. Звичайні громадяни ховають ворогів Америки, але ми покажемо їм, хто тут переміг."

  COM_as_strath_pows: "§gНаші робітники§!"
  COM_as_strath_pows_desc: "Комуністи завжди говорили, що робітників пригнічують на фабриках. Ну, тепер вони вже нічого не скажуть — вони мертві. А працівники перевезені на південь, у Ред-Дір, куди їм і місце."

  COM_as_strath_loot: "§gЛицемірне багатство§!"
  COM_as_strath_loot_desc: "Як комуністи можуть говорити про зло багатства, коли самі наживаються гірше за будь-кого? Байдуже — ми знову спалили їх і відправили в пекло, а здобич тепер наша."

  COM_as_strath_ash: "§gМи дали обіцянку§!"
  COM_as_strath_ash_desc: "Коли ми вирушили на північ, щоб знищити комуністів, ми пообіцяли перетворити їхнє місто на купу попелу. Тепер, коли ми вивезли звідти все корисне, час виконати цю обіцянку."

  COM_as_mountains: "§gНаші гори§!"
  COM_as_mountains_desc: "Макартур використовує свої гори як потужний захисний бастіон. Мабуть, час отримати свої. Вартові перевалу не надто заперечуватимуть — а навіть якщо й заперечать, їм це не допоможе."

  COM_as_mercenaries: "§gФальшива армія§!"
  COM_as_mercenaries_desc: "На нашому кордоні знову з’явилася армія. Як і з гангстерами, ми заженемо їх у землю. Їхні землі стануть новим регіоном для заселення. Тут буде лише одна хунта — наша."

  COM_as_stable_territories: "§gПриручені території§!"
  COM_as_stable_territories_desc: "Північ раніше була домом лише для злочинців та снігу. Але тепер ми перетворили це пекло на придатний для життя регіон. Із снігу проростають культури, руїни наповнені життям. Понад усе було забезпечено порядок."

  COM_as_new_armor: "§gНайкраще, що є в Америці§!"
  COM_as_new_armor_desc: "Ми нарешті отримали доступ до найкращого, що може запропонувати Америка — удосконалена силова броня. Наші солдати тепер будуть захищені найміцнішою бронею у всій пустці. Кожен із них відтепер — як ходячий танк."

  COM_as_doctrine: "§gАмериканська доктрина§!"
  COM_as_doctrine_desc: "Нова доктрина буде створена найкращими кадрами нашого командування. Солдати не зможуть воювати, якщо не знатимуть, як бути солдатами і як воювати."

  COM_as_stockpile: "§gНайкращі запаси§!"
  COM_as_stockpile_desc: "Макартур знову поділився запасами зі свого гірського сховища. Але цього разу замість зброї ми отримали найкращу силову броню, що підніме нашу армію над усіма нашими сусідами."

  COM_as_bunker_program: "§gПроєкт «Ґраніт»§!"
  COM_as_bunker_program_desc: "Ґаллагер чув історії про життя до вибухів, особливо про сховища. Перед війною компанія рила подібні, аби «захистити» громадян від ядерного холокосту — принаймні такою була офіційна версія. Долучившись до Анклаву, Ґаллагер дізнався правду з архівів — про експерименти та підготовку американців до життя на пустці. Вирішено: раз ми володіємо горами на заході, настав час відновити ці експерименти. Буде вирито три нові випробувальні сховища в Скелястих Горах."

  COM_as_bunker_blues: "§gБункерні клопоти§!"
  COM_as_bunker_blues_desc: "Після спорудження трьох сховищ і охорони об’єктів наші солдати вже здобули цінний досвід. Розроблено нові техніки оборони на основі реального захисту сховищ від рейдерів."

  COM_as_our_own_vault_tech: "§gПочати експерименти§!"
  COM_as_our_own_vault_tech_desc: "Настав час розпочати експерименти всередині сховищ. Заплановано три експерименти — по одному на кожне сховище, які триватимуть пів року для збору даних. Учасниками стануть добровольці з числа солдатів-охоронців та в'язні, яких змушують брати участь як піддослідних."

  COM_as_safe_vaults: "§gПро всяк випадок§!"
  COM_as_safe_vaults_desc: "Перші три сховища були суто експериментальними, але наступні три будуть іншими. Це будуть напіввідкриті безпечні сховища для найважливіших громадян і скарбів — про всяк випадок, якщо почнеться ворожа окупація, щоб потім розпочати кампанію з відвоювання."

  COM_sol_stars_and_stripes: "§4За туманом§!"
  COM_sol_stars_and_stripes_desc: "Настав час — більше не можна дозволити Ґаллагеру ввести державу в тиранію. Для тих, хто хоче, щоб Америка знову жила, лишився один шлях. На щастя, наші рухи приховує туман…"

  COM_sol_constitution_convention: "§4Як і наші пращури§!"
  COM_sol_constitution_convention_desc: "Наша держава народилась у небезпечному й жорстокому світі завдяки молодим ідеалістам. Сьогодні країну кинуто в пил забуття. Ми розпочнемо довгий процес відновлення — як і наші пращури — скликавши конституційний конвент для визначення шляху вперед для всіх американців."

  COM_sol_first_branch: "§4Законодавча влада§!"
  COM_sol_first_branch_desc: "Конгрес залишився лише спогадом для старих гулів серед лідерів, але тепер його буде відновлено. Він діятиме з обмеженням лише з боку Генерал-губернатора та його Четвертої гілки. Та багато хто досі ставить під сумнів, чи заслуговує Конгрес на більшу владу."

  COM_sol_limited_powers: "§4Пряме законодавство§!"
  COM_sol_limited_powers_desc: "Тепер, коли Конгрес відновлено, надзвичайні обмеження для населення можна скасувати. Сувора комендантська година й цензура залишаться лише спогадами."

  COM_sol_fourth_oversight: "§4Тверда рука§!"
  COM_sol_fourth_oversight_desc: "Конгрес тепер має надійного керівника, який спрямовуватиме його через будь-які труднощі. Затяті дебати в залі засідань — це вже минуле. Принаймні поки що, доки стара слава знову не здійметься над країною."

  COM_sol_development_agency: "§4Контроль Конгресу§!"
  COM_sol_development_agency_desc: "Департамент внутрішніх справ був створений Ґаллагером, щоб підточити владу Джонсона. Але тепер усе змінилося — департамент підпорядковано Конгресу. Майкл Вудс призначений новим секретарем і почав наводити лад. Колишніх лоялістів винагороджено — чергами за хлібом."

  COM_sol_congressional_budget: "§4Національний бюджет§!"
  COM_sol_congressional_budget_desc: "Конгрес знову працює, а отже, настав час формувати бюджет. Новий податковий кодекс має забезпечити стабільне фінансування державних потреб. Конгрес формує бюджет, але його має офіційно затвердити Джонсон і його гілка влади."

  COM_sol_american_industrial_might: "§4Сплячий велетень§!"
  COM_sol_american_industrial_might_desc: "Американська промисловість дрімала з часу вибуху бомб. Настав час пробудження. Конгрес ухвалить нові програми розвитку, щоб Америка повернула свій колишній статус на континенті."

  COM_sol_second_branch: "§4Судова влада§!"
  COM_sol_second_branch_desc: "Верховні суди колись гарантували права людей навіть перед державою. Тепер, попри всі нововведення, це не зміниться. Судова гілка буде єдиною, що зможе обмежувати владу Генерал-губернатора через більшість у суді."

  COM_sol_local_courts: "§4Правосуддя рубежу§!"
  COM_sol_local_courts_desc: "Більшість нашої країни — це дикий фронтир без закону й порядку. Щоб почати процес його приборкання, місцевий контроль перейде до шерифів і судів. Кожне містечко матиме шерифа й суд, щоб гарантувати покарання за будь-який злочин."

  COM_sol_national_bureau_defense: "§4Федеральна влада§!"
  COM_sol_national_bureau_defense_desc: "Буде створено нове бюро для підтримки судової влади в очищенні вулиць. Національне бюро оборони стане головною зброєю уряду США у боротьбі з внутрішніми загрозами."

  COM_sol_high_courts: "§4Верховний суд§!"
  COM_sol_high_courts_desc: "Верховний суд був непохитним у своїх рішеннях, відправляючи злочинців за ґрати без апеляцій. Незабаром наші вулиці очистяться від злочинців і терористів."

  COM_sol_third_branch: "§4Президентство§!"
  COM_sol_third_branch_desc: "Президент колись очолював американський уряд, але часи змінилися. Тепер це лише символ, фігура без реальної влади, доки повна Конституція не буде відновлена."

  COM_sol_figurehead: "§4Національний символ§!"
  COM_sol_figurehead_desc: "Президентство стало національним символом, що згуртовує людей. Це вже дає результати — бойовий дух особливо серед військових зростає з моменту відновлення інституту президентства."

  COM_sol_no_elections: "§4Порожнє крісло§!"
  COM_sol_no_elections_desc: "Більшість простих людей раді фігурі президента, але еліта бачить у цьому марнування посади. Це викликало зниження патріотичних настроїв, що вже відображається у зменшенні кількості новобранців."

  COM_sol_statue: "§4Статуя§!"
  COM_sol_statue_desc: "Як Меморіал Лінкольна колись надихав американців, так само надихатиме новий меморіал. Він буде присвячений усім Президентам, які пройшли через історію."

  COM_sol_fourth_branch: "§4Генерал-губернатор§!"
  COM_sol_fourth_branch_desc: "Остання та нова гілка влади — Генерал-губернатор. Джонсон обійме цю посаду й керуватиме країною як її провідник. Ця гілка матиме повноваження тримати державу на правильному курсі."

  COM_sol_propaganda_machine: "§4Хвороби зростання§!"
  COM_sol_propaganda_machine_desc: "Перша хвиля пропаганди зазнала невдачі — дехто з населення почав сумніватися. Але є надія. Потрібно лише розширити кампанію і не дозволити поразкам затьмарити перемоги."

  COM_sol_controlled_press: "§4Національна преса§!"
  COM_sol_controlled_press_desc: "Буде запущено загальнонаціональну газету для об’єднання політичних настроїв серед населення. Ми доноситимемо правду — з невеликою домішкою пропаганди."

  COM_sol_overarching_powers: "§4Універсальні повноваження§!"
  COM_sol_overarching_powers_desc: "Четверта гілка має повноваження над рештою трьох. Лише судова влада може її оскаржити через голосування більшістю. Це викликає занепокоєння серед чиновників, проте така влада необхідна."

  COM_sol_full_control: "§4Дотик Джонсона§!"
  COM_sol_full_control_desc: "Повний федеральний контроль встановлено, будь-яка опозиція залишилася в минулому. Відтепер четверта гілка керуватиме урядом без суттєвого спротиву. Проте Джонсон — не божевільний тиран, а виважений солдат, готовий втримати курс."

  COM_sol_trade_outflow: "§4Торгівля наших караванів§!"
  COM_sol_trade_outflow_desc: "Щоб уряд отримував головну вигоду з торгівлі, буде створено нову державну компанію — Торговельну компанію «Зірка». Вона отримає ліцензію на домінування в експорті й імпорті товарів."

  COM_sol_armed_forces: "§4Збройні сили Америки§!"
  COM_sol_armed_forces_desc: "Колись континент контролювала американська армія. Після вибуху бомб її сила зникла, залишивши нас у снігах. Ми створимо нову армію Америки, аби знову взяти контроль над континентом."

  COM_sol_new_soldiers: "§4Успадковані зоряно-смугасті очі§!"
  COM_sol_new_soldiers_desc: "Нове покоління патріотів почало масово приходити до військкоматів. Вони виросли під зірками й смугами і тепер готові захищати прапор від усіх ворогів."

  COM_sol_draft: "§4Народжені, щоб майоріти прапором§!"
  COM_sol_draft_desc: "Ідея призову непопулярна, тому ми використаємо вибірковий призов у воєнний час. Це дозволить використовувати людські ресурси в кризові моменти, не зламавши державу."

  COM_sol_mandatory_service: "§4Жоден син мільйонера§!"
  COM_sol_mandatory_service_desc: "Світ після бомб набагато жорстокіший. Ми потребуємо обов’язкової служби, щоб наповнити казарми. Пустка незабаром прийде за нами — і ми не можемо дозволити їй знищити наші прекрасні смуги."

  COM_sol_special_forces: "§4Сини армії§!"
  COM_sol_special_forces_desc: "Чимало нових офіцерів походять із військових родин, які зростили їх для фронту. Вони командуватимуть новими солдатами на полі бою — до перемоги."

  COM_sol_doctrine: "§4Цілком готові померти§!"
  COM_sol_doctrine_desc: "Нова доктрина нашої армії зосередиться на силі й витривалості наших солдатів. Вони стоятимуть як цегляна стіна, готові протистояти будь-якій непереборній силі. Ці хоробрі солдати віддадуть життя за зірки та смуги."

  COM_sol_experience: "§4Червоний місяць сходить§!"
  COM_sol_experience_desc: "Зі сходом червоного місяця наші солдати звикли до боїв з комуністами в снігах. Їхній бойовий дух і незліченні перемоги стали справжнім джерелом досвіду."

  COM_sol_army_training: "§4Наведи гармату на них§!"
  COM_sol_army_training_desc: "Ветерани пішли з передової до навчальних таборів, щоб готувати нове покоління офіцерів. Ці солдати пережили націлені на них гармати з усіх боків — тепер вони навчають інших дивитися у вічі залізному звірові."

  COM_sol_new_rifle: "§4Розпродаж мотлоху§!"
  COM_sol_new_rifle_desc: "Гасло нової програми озброєння — "геть старе, хай живе нове". Усі старі гвинтівки буде розпродано в пустці, а нашим солдатам дістанеться найкраще."

  COM_sol_demolitions: "§4Погана погода§!"
  COM_sol_demolitions_desc: "Розробляються нові вибухівки для наших солдатів. Доктрина наказує зливати пекло з неба. Залізна буря впаде на будь-кого, хто наважиться протистояти нашим зоряно-смугастим воїнам."

  COM_sol_field_hospitals: "§4Бачив дощ?§!"
  COM_sol_field_hospitals_desc: "Коли починає йти дощ, то ллє, як із відра — особливо коли мова заходить про свинець. Щоб рятувати поранених, треба створити польові шпиталі, аби мати куди йти, коли починається злива."

  COM_sol_american_army: "§4Скільки ще віддати?§!"
  COM_sol_american_army_desc: "Наша відповідь — ще, ще і ще. Американські солдати готові покласти все, що мають, заради прапора. Зірки ніколи не перестануть майоріти над пусткою, поки у них залишиться подих."

  COM_sol_operation_star_spangled_banner: "§ROперація:§! §WСтара§! §4Слава§!"
  COM_sol_operation_star_spangled_banner_desc: "Анклав роками ховався в горах, а тепер зневажливо ставиться до наших справжніх американських ідеалів. Прийшов час відправити Дядька Сема туди, де йому місце — до могили."

  COM_sol_fumigation: "§4Поповнення запасів§!"
  COM_sol_fumigation_desc: "Міддлмарк був із нами, коли комуністи стукали в наші двері, але ми не можемо залишати південний фланг відкритим. Наші цілі на півдні вимагають дій — минулі симпатії не можуть нас стримати."

  COM_sol_abolition: "§4Зламані клітки§!"
  COM_sol_abolition_desc: "Роботи роками поневолювали безневинних, та ми зламали їхні клітки й випустили свободу. Рабство не буде місця, доки над континентом майорять зірки й смуги. Джонсон особисто поклявся звільнити всю континентальну частину США від тиранії племен."

  COM_sol_american_ai: "§4Несподіваний союзник§!"
  COM_sol_american_ai_desc: "Схоже, що ШІ Міддлмарка вирішив допомогти нам у відновленні Союзу. На диво, він узяв на себе стабілізацію наших територій — рівень злочинності та сепаратизму різко впав після його втручання."

  COM_sol_fumigation_1: "§4Зламати притулок§!"
  COM_sol_fumigation_1_desc: "Під полями Великої зграї лежить країна, яка пишається своїми основами. Вартові білини — це група терористів, яких ми знищимо на шляху до того, щоб надрати дупу Дядькові Сему!"

  COM_sol_horse_tribes: "§4Заглушити копита§!"
  COM_sol_horse_tribes_desc: "Землі Великої зграї — малозаселені й повні коней. Ми повинні знову проявити нашу долю, цього разу рухаючись на схід. Ці землі будуть завойовані й приручені, як колись Дикий Захід."

  COM_sol_eastern_settlement: "§4Дикий Схід§!"
  COM_sol_eastern_settlement_desc: "Східні території почали заселятись фронтирниками й шахтарями, які прагнуть розбагатіти на землях копит. Скоро цей дикий край стане нашим — і тільки нашим!"

  COM_sol_eastern_industry: "§4Фронтирна індустрія§!"
  COM_sol_eastern_industry_desc: "Здається, на фронтирі з’являються нові майстерні. Поселенці обирають зброю, аби захистити свої домівки від постійної загрози рейдерів."

  COM_sol_mad_trains: "§4Багатства старого світу§!"
  COM_sol_mad_trains_desc: "Племена на нашому кордоні, схоже, привласнили собі останній мед старого світу. Їхнє вугілля та сталь незабаром повернуться під законне управління!"

  COM_sol_surrounding_tribes: "§4Трамплін§!"
  COM_sol_surrounding_tribes_desc: "Мерія Гавра — лише трамплін на нашому шляху до того, щоб відправити Дядька Сема до пекла. Шкода їм, що стали нам на заваді."

  COM_sol_surrounding_tribes_1: "§4Небажаний суперник§!"
  COM_sol_surrounding_tribes_1_desc: "Ніітсітапі — просто плем’я, яке виживає у пустці, але ми бачили їхню силу на полі бою. Ми не хотіли цього бою, та вони стоять на нашому шляху. І ми не дозволимо Дядькові Сему дихати далі."

  COM_sol_surrounding_tribes_2: "§4Буря?§!"
  COM_sol_surrounding_tribes_2_desc: "Схоже, ми натрапили на ще одне плем’я, що втратило розум. Їхня культура — це культ бурі. Але це останній бар’єр до Дядька Сема. Ми не лише переживемо бурю — ми її завоюємо."

  COM_sol_burning_stars: "§4Палаючі зірки§!"
  COM_sol_burning_stars_desc: "Нарешті ми дісталися гір і оточили Анклав з усіх північних флангів. Час завершити нашу місію й перетворити гори на самі лише попелища."

  COM_sol_department_of_reclamation: "§4Департамент відновлення§!"
  COM_sol_department_of_reclamation_desc: "Щоби почати перетворення пустки на щось, що можна назвати Америкою, конгрес вирішив створити новий Департамент відновлення. Виділений йому бюджет відкрив безліч шляхів покращити життя американських громадян."

  COM_sol_industrial_revitalization_agency: "§4Пробудження велета§!"
  COM_sol_industrial_revitalization_agency_desc: "Мета, поставлена конгресом — пробудити сплячого велета — нарешті досягнута. Нові індустріальні програми завершено, а заводи з'являються по всьому рубежі."

  COM_sol_social_welfare_agency: "§4Наша допомога§!"
  COM_sol_social_welfare_agency_desc: "Чимала частина нашого населення живе в злиднях. Щоби допомогти, буде створено нову систему соціального забезпечення. Навіть найвіддаленіші куточки країни отримають підтримку з Ред-Діра."

  COM_sol_federal_train_system: "§4Зі сходу на захід§!"
  COM_sol_federal_train_system_desc: "Як і раніше, потяги мають поєднати нашу країну зі сходу на захід. Увесь транспорт племінних країн буде використано для підтримки економіки й торгівлі за будь-яких обставин."

  COM_sol_settlement_program: "§4День переселення§!"
  COM_sol_settlement_program_desc: "Південь очищено від комах та божевільних племінних груп. Тепер законним громадянам США дозволено переселятися й освоювати ці землі. Край божевільних буде перетворено на нове серце Америки."

  COM_sol_power_grid: "§4Ще більше світла§!"
  COM_sol_power_grid_desc: "Наші перші кроки до створення електромережі досягли межі. Потрібна нова система — і Джонсон її забезпечив. Нові підстанції й електростанції забезпечать світло для всіх під зорями й смугами. У темряві житимуть тільки племена."

  COM_sol_american_dollar: "§4Американський долар§!"
  COM_sol_american_dollar_desc: "Ми поступово перетворились на економічну потугу регіону. Щоби закріпити цей розвиток, американський долар повертається в обіг. Нову валюту, створену конгресом, вже використовують замість кришок у більшості угод."

  COM_sol_research_department: "§4Наші найяскравіші розуми§!"
  COM_sol_research_department_desc: "Америка, колись серце наукового світу, перетворилась на відсталу державу. Прийшов час повернути собі колишню славу — наші найкращі уми знову працюють над тим, щоб відновити втрачене."

  COM_sol_farming_innovations: "§4Мечі на плуги§!"
  COM_sol_farming_innovations_desc: "Війна поступово добігає кінця, і ми маємо перетворити зброю на знаряддя для оранки. Наші землі покриються фермами, аби ми могли годуватися без імпорту і забути про голод назавжди."

  COM_sol_mining_towns: "§4Фронтирні бумтауни§!"
  COM_sol_mining_towns_desc: ""Бумтауни"" були основою освоєння заходу — тепер вони основа цивілізації пустки. Обпалена земля буде відроджена для життя. Американці житимуть на гідній землі, а не на пилюці."

  COM_sol_booming_towns: "§4Заселення рубіжу§!"
  COM_sol_booming_towns_desc: "Наплив на рубіж починає давати результати в економіці. Більше доларів обертається в обігу, бо бумтауни перетворюються на повноцінні поселення, які збагачують землю."

  COM_sol_enclave_scraps: "§4Залишки Анклаву§!"
  COM_sol_enclave_scraps_desc: "Анклав доправив багато вантажів у наші землі. Силова броня роками іржавіла в снігу, бо ми мали важливіші справи. Тепер настав час розібратись із цим металобрухтом і подивитися, що ще можна використати."

  COM_sol_enclave_veterans: "§4Покинуті§!"
  COM_sol_enclave_veterans_desc: "Коли ми відправили Дядька Сема до пекла, декого залишили позаду. Сотні ветеранів Анклаву лишились у горах. Солдати й науковці не знають, що робити з життям, поки Анклав зникає в пам'яті."

  COM_sol_congress_question: "§4Питання конгресу§!"
  COM_sol_congress_question_desc: "У Ред-Дірі знову точиться дебат: чи має Конгрес бодай якесь значення в нашій країні, чи це лише символ..."

  COM_sol_unionist: "§4Реалізм§!"
  COM_sol_unionist_desc: "Зали конституційної ради вибухнули хаосом — дві фракції розкололи Співдружність навпіл. Джонсон очолює нову політичну партію, що має приборкати пустку."

  COM_sol_reformist: "§1Ідеалізм§!"
  COM_sol_reformist_desc: "Зали конституційної ради вибухнули хаосом — дві фракції розкололи Співдружність навпіл. Вудс очолює політичний рух, присвячений відновленню довоєнного рівня життя в Америці."

  COM_sol_restored_congress: "§4Народний дім§!"
  COM_sol_restored_congress_desc: "Колись справжній Конгрес керував американським народом. Тепер символічні структури змінено — тепер це дійсно дім народу, присвячений його свободі!"

  COM_sol_reconstruction: "§4Що після цього§!"
  COM_sol_reconstruction_desc: "Останні роки були шаленими для Ред-Діра: від Синів Свободи до нової адміністрації — місто вже зовсім інше. Джонсон знову починає думати про майбутнє, хоча й минуле ще має що сказати."

  COM_all_good_things: "§gУсі гарні речі§!"
  COM_all_good_things_desc: "Територію забезпечено, а всіх непокірних сусідів підкорено — настав час формалізувати відносини між Макартуром і Співдружністю."

  COM_the_road_to_hell: "§gДорога до пекла§!"
  COM_the_road_to_hell_desc: "Немає вищої мети, ніж відновлення Америки, і якщо Ґаллагер щось засвоїв у битвах із комуністами — то це те, що мета виправдовує засоби."

  COM_operation_undead_severance: "§gОПЕРАЦІЯ: МЕРТВЕ РОЗ'ЄДНАННЯ§!"
  COM_operation_undead_severance_desc: "Директива 15-4b: Усі підрозділи на позиціях для чистки. Початок згідно з планом. Доповісти «Великому Птаху» після виконання завдань."

  COM_operation_aftermath: "§gОПЕРАЦІЯ: НАСЛІДКИ§!"
  COM_operation_aftermath_desc: "Директива 18-3d: Розчищення трупів розпочато. Зверніться до мапи 4b-3 для місць дозволеного скидання. Дерадіація бараків для гулів розпочнеться незабаром."

  COM_the_new_general_staff: "§gНове генеральне командування§!"
  COM_the_new_general_staff_desc: "Директива 16-2j: Санкціоновані Макартуром офіцери прибудуть гвинтокрилом о 06:00. Забезпечити дотримання командного ланцюга. Про всі порушення — негайно до Верховного командування Макартура."

  COM_the_last_straw: "§gОстання крапля§!"
  COM_the_last_straw_desc: "Ґаллагер майже досяг межі того, що він ще здатен витерпіти."

  COM_sol_southern_crisis: "§4Наша крихка позиція§!"
  COM_sol_southern_crisis_desc: "Після довгих років і витрачених боєприпасів, найпівденніші співдружності було відновлено! Ми тепер простягаємо свій вплив аж до Ріо-Ґранде, але це не лише слава. Місцеві проблеми й повстання створюють найгіршу політичну напругу з часів комуністів..."

  COM_sol_texan: "§4Фальшивий пророк§!"
  COM_sol_texan_desc: "До того, як Техас повернувся під справжнє американське правління, регіоном володала Братство Сталі. Ред-Дір вважає їх зрадниками, а техасці — гнобителями. Здається, настав час остаточно розібратись із цією групою."

  COM_sol_texan_1: "§4Милість§!"
  COM_sol_texan_1_desc: "Запит Братства Сталі про перенесення суду до Ред-Діра було задоволено. Місцеві техасці виказують свій гнів новими протестами. Але суд вже призначено — залишилося лише дочекатися вердикту присяжних."

  COM_sol_texan_2: "§4Правосуддя§!"
  COM_sol_texan_2_desc: "Запит Братства Сталі про перенесення суду до Ред-Діра було відхилено. Джонсон хоче зосередитися на відбудові Техасу, тому справу мають вирішити місцеві Співдружності. Це не справа Ред-Діра — судити злочини, скоєні на місці."

  COM_sol_texan_3: "§4Наслідки§!"
  COM_sol_texan_3_desc: "Наша позиція щодо Братства Сталі стала остаточною — тепер залишилося лише дочекатися реакції народу..."

  COM_sol_rio_grande: "§4Зруйнований кордон§!"
  COM_sol_rio_grande_desc: "Землі Ріо-Ґранде вже кілька тижнів у крові. Вибори губернатора стали головною темою розмов — населення сподівається, що це знизить напругу."

  COM_sol_rio_grande_1: "§4Ризик Ґерри§!"
  COM_sol_rio_grande_1_desc: "Ґерра обраний губернатором Співдружності Ріо-Ґранде. Тепер на ньому лежить тягар культурного конфлікту. Але з околиць надходять нові тривожні повідомлення..."

  COM_sol_rio_grande_2: "§4Помилка Гаубіца§!"
  COM_sol_rio_grande_2_desc: "Гаубіц обраний губернатором Співдружності Ріо-Ґранде. Віднині він має справитися з культурною напругою. Але з околиць надходять нові тривожні повідомлення..."

  COM_sol_rio_grande_3: "§4Затишшя після бурі§!"
  COM_sol_rio_grande_3_desc: "Напруга в Ріо-Ґранде нарешті спала — щоправда, ціною сотень життів. Тепер губернатор має виступити й відповісти на решту запитань."

  COM_sol_sonoran: "§4Земля, вкриту джетом§!"
  COM_sol_sonoran_desc: "Сонорська Співдружність по вуха в злочинності — особливо популярний наркотик Джет. Ситуація лише погіршується. Майбутні вибори — це не лише вибір для народу, а й випробування волі кожного кандидата."

  COM_sol_sonoran_1: "§4План Генлона§!"
  COM_sol_sonoran_1_desc: "Генлон обраний! Тепер саме йому доведеться виправити становище в Сонорі. Деякі плани вже просочилися в пресу, але ситуація залишається непевною."

  COM_sol_sonoran_2: "§4Рішучість Іск'єрди§!"
  COM_sol_sonoran_2_desc: "Іск'єрда обрана! Її підтримують різні групи населення по всій Сонорі. Проте, здається, її перемога сподобалась і Картелю..."

  COM_sol_sonoran_3: "§4Довге відновлення§!"
  COM_sol_sonoran_3_desc: "Сонора знову вступила в епоху миру. Проте роботи ще безліч — кожен громадянин думає про відбудову."

  COM_sol_union: "§4Ідеальний союз§!"
  COM_sol_union_desc: "Поки наші армії марширують пусткою, у Ред-Дірі продовжують накопичуватись питання. Багато хто запитує: яким буде цей новий Союз насправді? Чи впаде він у корупцію та авторитаризм, чи ж мрії 1776 року нарешті стануть реальністю? Відповідь — у руках народу, а не Джонсона..."

  COM_sol_american_government: "§4Першородний гріх Джонсона§!"
  COM_sol_american_government_desc: "Від самого заснування Нової американської співдружності компроміси тієї першої конвенції переслідували її на кожному кроці. Особливо вимога Джонсона про створення могутньої гілки генерал-губернатора, що стоїть над усіма іншими. Але тепер настав час вирішити, чи ця вимога залишиться."

  COM_sol_reforming_the_branches: "§4Втілена ідея§!"
  COM_sol_reforming_the_branches_desc: "З 1776 року американська мрія — держава народу й для народу, що гарантує життя, свободу та прагнення до щастя — постійно компрометувалась. Ці компроміси не змогли вберегти початкові принципи, але тепер час вкарбувати їх у камінь."

  COM_sol_reforming_federal_system: "§4Американська система§!"
  COM_sol_reforming_federal_system_desc: "Ідея федералізму була втрачена ще до падіння бомб, але тепер її зоряний час знову настав. Співдружності отримають владу кидати виклик уряду, щоб ми ніколи більше не впали у корупцію."

  COM_sol_reforming_presidency: "§4Заповнене крісло§!"
  COM_sol_reforming_presidency_desc: "Після скасування гілки генерал-губернатора настав час повернути Президентство. Це крісло більше не буде порожнім..."

  COM_sol_reforming_courts: "§4Врівноважені Тересі§!"
  COM_sol_reforming_courts_desc: "Верховний суд був ослаблений при заснуванні нового Союзу. Але більше ні! Судова гілка отримає повну силу, щоб захистити наші засадничі принципи — і нічого більше!"

  COM_sol_the_final_constitution: "§4Наші заповіді§!"
  COM_sol_the_final_constitution_desc: "Ми більше не народ, загублений у снігах пустки. Ми знайшли шлях додому — до своєї справжньої сутності. Америка була втрачена ще до падіння бомб, але сьогодні її відбудовано цеглина за цеглиною."

  COM_sol_wasteland_goverment: "§4Уряд для сьогодення§!"
  COM_sol_wasteland_goverment_desc: "Світ після Великої війни — це жорстоке місце, сповнене болю й крові, тому нам потрібен уряд, що зможе захистити свій народ. Навіщо думати про ідеали, коли більшість голодує чи сидить без світла?"

  COM_sol_governor_generals_place: "§4Що необхідно§!"
  COM_sol_governor_generals_place_desc: "Джонсон тут, щоб нагодувати Америку й привести її назад до Вашингтона. Коли береги Атлантики знову вкриються зірками й смугами — тоді подумаємо про ідеали. А до того — він буде служити."

  COM_sol_american_cincinnatus: "§4Американський Цинциннат§!"
  COM_sol_american_cincinnatus_desc: "Джонсон — не диктатор, він не Ґаллагер. Він — людина, що хоче бачити Старе Славо від моря до моря. Він пообіцяв: коли Союз буде повністю відновлено — сам розпустить четверту гілку. Але хто знає, чи справдиться це?.."

  COM_sol_american_culture: "§4Загублений спосіб життя§!"
  COM_sol_american_culture_desc: "Американська культура давно похована під снігами пустки. Її відродження не йде згори — воно починається в домівках Ред-Діра. Все більше людей повертають старі традиції в повсякденне життя."

  COM_sol_the_faithful: "§4Віряни§!"
  COM_sol_the_faithful_desc: "По всьому новому Союзу живуть віруючі найрізноманітніших релігій. Конституція гарантує свободу віросповідання — й ці релігії починають зростати. Деякі, що вважались мертвими, ожили наново."

  COM_sol_the_american_family: "§4Американська родина§!"
  COM_sol_the_american_family_desc: "Наріжний камінь нашої держави — це родина, основа нашої культури. Ред-Дір узявся підтримувати цю інституцію. Нові програми допомагають родинам і стимулюють народжуваність, аби відновити не лише населення, а й культуру."

  COM_sol_the_arcadians: "§4Блудний син§!"
  COM_sol_the_arcadians_desc: "Хоча більшість континенту забула про Америку, деякі народи зберегли її дух. Аркадійці вважають себе гілкою американського народу — тими, хто пережив бомби й залишився вірним ідеалам, хоча й еволюціонував з часом."

  COM_sol_the_regular: "§4Простий народ§!"
  COM_sol_the_regular_desc: "Між вірянами й тими, хто забув усе, стоїть щоденний громадянин — звичайні американці. Вони хочуть повернути втрачену культуру, але без фанатизму. Їхній шлях — тонка межа."

  COM_sol_nuka_cola: "§4Колу Америки§!"
  COM_sol_nuka_cola_desc: "Якою може бути Америка без Ядер-Коли? Джонсон каже — ніякою! Тож ми збудуємо нові заводи, які знову наповнять вулиці цією американською рідиною. Джонсон уже замовив сотню ящиків — а фабрику ще й не почали будувати..."

  COM_sol_the_nfl: "§4Стара свиняча шкіра§!"
  COM_sol_the_nfl_desc: "Стара американська неділя — це родинне барбекю, Ядер-Кола й футбол. Останній шматок цієї мозаїки — саме футбол. Настав час відродити те, про що вже майже всі забули. Національну футбольну лігу буде відновлено й профінансовано — заради забутої гри Америки."

  COM_sol_the_red: "§4Зрадники§!"
  COM_sol_the_red_desc: "Комуністи були залишені безкарними ще з моменту падіння бомб, але тепер настав час з ними розібратись. Найбільш злочинні з нашого суспільства будуть покарані відповідно."

  COM_sol_american_schools: "§4Американські школи§!"
  COM_sol_american_schools_desc: "Конституція гарантує право на політичні переконання — окрім комунізму. Цей рух був конституційно заборонений за свої злочини не лише у Великій війні, а й за злочини після неї."

  COM_sol_american_test: "§4Тест на громадянство§!"
  COM_sol_american_test_desc: "Америка — це держава громадян. Якщо комуністи хочуть жити в нашій країні, вони повинні довести свою вірність. Вони пройдуть тест перед тим, як їх повернуть у суспільство."

  COM_sol_an_american_life: "§4Нова доля§!"
  COM_sol_an_american_life_desc: "Колись існувало переконання, що американці мають право освоїти Захід. Тепер час народити нову долю — заселити Схід, колиску нашої держави. Настане день, коли Атлантика знову поцілує американський берег."

  COM_sol_raider_menace: "§4Палаюча Північ§!"
  COM_sol_raider_menace_desc: "Північна співдружність охоплена полум’ям через своїх колишніх хазяїв. У нас лишилося мало варіантів. Ми мусимо вирішити, як рухатись далі, поки наші землі перетворюються на попіл."

  COM_sol_northern: "§4Шепіт у горах§!"
  COM_sol_northern_desc: "Гори Північної співдружності сповнені суперечливих ідей щодо майбутнього. На жаль, вибори губернатора стали полем бою для цих ідеологій."

  COM_sol_northern_1: "§4Оливкова гілка Сантьяґо§!"
  COM_sol_northern_1_desc: "Тепер, коли Сантьяґо обрано губернаторкою, вона почала програму інтеграції колишніх радикалів Анклаву. Люди майже не вірять, що ці рейдери можуть стати частиною суспільства. Та час покаже, чи спрацює її план."

  COM_sol_northern_4: "§4Ненависть Амберкози§!"
  COM_sol_northern_4_desc: "Після обрання Амберкози губернаторкою її війна з рейдерами почалась без пощади. Сестринство сталі отримало повноваження проводити зворотні рейди. Лишається лише здогадуватись, якою буде остаточна кількість жертв її «програми»."

  COM_sol_northern_2: "§4Безумство Маршалла§!"
  COM_sol_northern_2_desc: "Обрання шерифа Маршалла губернатором обернулось на справжнє божевілля. Сталось те, що вважали неможливим. Нехай Бог помилує нас..."

  COM_sol_northern_3: "§4Мирні долини§!"
  COM_sol_northern_3_desc: "Кровопролиття нарешті завершилось. Гори стихли, а зелені долини готові до розквіту. Час повернути час назад і нарешті відбудувати ці долини!"

  COM_sol_election_day: "§4Свобода у повітрі§!"
  COM_sol_election_day_desc: "Нарешті настав день виборів — голосування розпочато, а кампанії в розпалі! Джонсон дотримався слова: вибори почались, і скоро ми дізнаємось, хто переможе!"

  COM_sol_johnsons_rally: "§4За союз, за свободу§!"
  COM_sol_johnsons_rally_desc: "Джонсон продовжує кампанію своєї Юніоністської партії. Кандидати виголошують промови й сиплють обіцянками. Та чи принесе це користь чи шкоду партії?"

  COM_sol_woods_rally: "§4Від народу й для народу§!"
  COM_sol_woods_rally_desc: "Вудс розпочав кампанію — як за своє місце, так і за місця реформістів. Кожен кандидат намагається переконати простих людей і, зокрема, солдатів. Однак, чи принесе це успіх?"

  COM_sol_state_of_union_speech: "§4Звернення Джонсона§!"
  COM_sol_state_of_union_speech_desc: "Вперше за століття прозвучить Звернення про стан Союзу. Джонсон виступить у Конгресі, щоб говорити про тривоги, успіхи й цілі на майбутнє. Багато хто вважає це справжнім втіленням американської мрії!"

  COM_sol_election_results: "§4Оголошено результати§!"
  COM_sol_election_results_desc: "Результати парламентських виборів уже є! Новий склад Конгресу керуватиме країною до наступного голосування!"

  COM_the_red_deer_convention: "§gПрихована ціна§!"
  COM_the_red_deer_convention_desc: "За рядами ящиків Анклаву і заповненими складами ховалась ціна. Вони хотіли, щоб ми відправили своїх рідних до пекла... А я скажу їм — хай самі туди йдуть!"

  COM_operation_1776: "§gОПЕРАЦІЯ 1776§!"
  COM_operation_1776_desc: "Джонсон помилявся в багатьох речах, але його зневага до Анклаву й бажання вигнати їх назад у гори — були слушними! Навіть зламаний годинник двічі на день показує правильний час."

  COM_rally_ghouls: "§gЗагартуймо рішучість§!"
  COM_rally_ghouls_desc: "Наші солдати тренуються без зупину, готуючись до майбутніх битв. Південний фронт не буде легким. Ми мусимо зосередитись і зміцнити наш дух!"

  COM_end_southern_trade: "§gКордон із свинцю§!"
  COM_end_southern_trade_desc: "Анклав використовує всі можливі трюки, щоб пробратись до Ред-Діра. Робооко збивають без вагань, але вони все ще намагаються прорватись..."

  COM_break_their_back: "§gЗламати їм хребет§!"
  COM_break_their_back_desc: "Час настав — ми більше не будемо чекати на Півночі, поки вони рушать на наші лінії. Ми перейдемо в наступ і пошлемо наші війська на південь, щоби розтрощити їхні хребти на мільйон уламків."

  COM_testing_our_resolve: "§gВипробування нашої рішучості§!"
  COM_testing_our_resolve_desc: "Ми пережили чимало випробувань — від орд комуністів до веселого гурту Джонсона. Але наші труднощі ще далеко не закінчились. Тепер ми повинні йти слідами наших праотців!"

  COM_sol_cleaning_the_plague: "§4Клітка Середнього Заходу§!"
  COM_sol_cleaning_the_plague_desc: "До війни американський уряд вирішив замкнути наш народ у клітку. Нібито для стримування хвороби — але насправді це було прикриттям для темніших цілей. І тепер ми мусимо мати справу з наслідками!"

  COM_sol_midwestern: "§4конгресова реабілітація§!"
  COM_sol_midwestern_desc: "Середньозахідну співдружність підпорядковано безпосередньо конгресу, й вона проходить процес реабілітації. Але остаточні цілі після очищення рівнин і досі є предметом суперечок!"

  COM_sol_midwestern_1: "§4Країна печені§!"
  COM_sol_midwestern_1_desc: "Реформісти перемогли у дебатах, і Середньозахідна співдружність стала землею скотарів. Корова знову панує на рівнинах, і відтепер звідси надходитимуть найкращі м'ясні вироби!"

  COM_sol_midwestern_2: "§4Країна брухту§!"
  COM_sol_midwestern_2_desc: "Юніоністи перемогли у дебатах, і Середньозахідна співдружність стала землею копалень і кирок. Брухт вивозиться вантажівками, а наша промисловість по всьому Союзу оживає завдяки новим ресурсам!"

  COM_sol_midwestern_3: "§4Справжня співдружність§!"
  COM_sol_midwestern_3_desc: "Коли наші солдати зайшли до так званих «Чумних земель» у протирадіаційних костюмах, багато хто сумнівався, чи воно того варте. Але тепер у нас є співдружність на шляху до відновлення!"

  COM_sol_great_famine: "§4Снігова миска§!"
  COM_sol_great_famine_desc: "Люті холоди й негода вразили врожаї у Північно-Західній співдружності. Якщо Конгрес вчасно не втрутиться — криза не за горами!"

  COM_sol_north_western: "§4Земля без молока й меду§!"
  COM_sol_north_western_desc: "Криза зростає, і тільки тепер Конгрес починає реагувати на події на заході! Уся співдружність охоплена хаосом — від набігів до повстань фермерів."

  COM_sol_north_western_1: "§4Хоробрі й відважні§!"
  COM_sol_north_western_1_desc: "Федеральні війська готуються до введення в регіон, щоб повернути контроль. Захід впав у руки найрадикальніших елементів суспільства. Як федеральний уряд ми мусимо навести лад самотужки."

  COM_sol_north_western_2: "§4Вантажівками§!"
  COM_sol_north_western_2_desc: "Надання харчової допомоги стало головним пріоритетом у вирішенні західної кризи. конгрес скуповує всі харчі, до яких може дотягнутись! Усе — заради бюджету!"

  COM_sol_north_western_3: "§4Слава федеральній допомозі§!"
  COM_sol_north_western_3_desc: "Хаос трохи вщух, але криза ще триває. Тому федеральна допомога продовжується, аби з часом остаточно вирішити проблеми в регіоні."

  COM_sol_western_choas: "§4Хаос на Заході§!"
  COM_sol_western_choas_desc: "Захід — це мішанина: узбережжя найбільш розвинене у Союзі, тоді як пустеля — його протилежність. Обидва мають свої виклики, і саме конгресу належить вирішити, як їх подолати."

  COM_sol_four_states: "§4Велика американська пустеля§!"
  COM_sol_four_states_desc: "Тепер у нас під контролем великі території пустелі, що перебували в жахливому стані. Їхні колишні власники — Легіон — поневолювали та грабували ці землі. Нам доведеться мати справу з їхнім спадком."

  COM_sol_four_states_1: "§4На рівні з нашим спадком§!"
  COM_sol_four_states_1_desc: "Америка — не місце для кайданів. Це земля свободи. Ми воювали в окопах Канади, переходили через гори й лили кров — тепер час показати, що ми не просто балакаємо. Ми звільнимо Південний Захід!"

  COM_sol_four_states_2: "§4Асфальтуємо Захід§!"
  COM_sol_four_states_2_desc: "Пустеля співдружності Чотирьох штатів не має інфраструктури, необхідної для з’єднання з рештою Союзу. Ми повинні прокласти нові дороги, відновити старі й поєднати залізниці."

  COM_sol_four_states_3: "§4Вільна співдружність§!"
  COM_sol_four_states_3_desc: "Ці землі колись належали божевільним у костюмах. Тепер тут сформовано повноцінну співдружність, очищену від гріхів минулого. Наш спадок живе далі — через Чотири штати в складі Союзу!"

  COM_sol_western: "§4Гіркий ведмідь§!"
  COM_sol_western_desc: "Західне узбережжя колись контролювала молода держава — НКР. Але ми приручили західного ведмедя й перетворили його на новий дім для наших поселенців. Хоча залишки НКР і досі створюють проблеми..."

  COM_sol_baron_support: "§4Західний шаман§!"
  COM_sol_baron_support_desc: "У несподіваному повороті подій аутсайдер здобув перемогу! Келгун виборов право називатись губернатором Західної співдружності. Його незвичні методи вже привернули увагу громадськості..."

  COM_sol_hayes_view: "§4Проповідник старого світу§!"
  COM_sol_hayes_view_desc: "Без особливого здивування Гейз виграв вибори та посів законне місце на чолі Західної співдружності. Попереду в нього довгий шлях, але підтримка народу й конгресу в Ред-Дірі на його боці."

  COM_sol_the_baron_plot: "§4Західний оазис§!"
  COM_sol_the_baron_plot_desc: "У ході відбудови Союзу Захід став справжнім оазисом. Найвищі верстви суспільства ринули до узбережжя, зачаровані морським повітрям. Але навіть на піщаних пляжах усе ще блукають тіні минулого..."

  COM_as_macarthur_death: "§gПалаюча зірка§!"
  COM_as_macarthur_death_desc: "Аеропорт занімів, а солдати почали непокоїтись — багато хто вже починає сумніватись у долі Макартура. Сам Ґаллагер метається своїм кабінетом, думаючи про найгірше. Але невдовзі тишу прорізує гуркіт гвинтів..."

  COM_as_constitution: "§gНагодувати багатьох§!"
  COM_as_constitution_desc: "Потік біженців серйозно вдарив по запасах Ред-Діра. Їжі бракує, полиці порожні, а місця дедалі менше. Ґаллагер створює нове відомство, щоб контролювати зростаючу ресурсну напругу."

  COM_as_military_control: "§gНе розгойдуй човен§!"
  COM_as_military_control_desc: "Напруга між місцевими мешканцями та новими біженцями досягла піку, і Ґаллагеру довелось розширити повноваження, аби втримати порядок. Свободи доводиться обмежити, щоби зберегти Америку від вогню заворушень."

  COM_as_reforge_army: "§gНаш заблудлий син§!"
  COM_as_reforge_army_desc: "Серед біженців — загартовані ветерани Анклаву, готові присягнути на вірність Ґаллагеру. Так зване Загублене Плем’я починає формувати новий офіцерський корпус, що очолює нові частини, готові вирушити назад на південь і повернути втрачену землю."

  COM_as_home_brew_economy: "§gЗ дна§!"
  COM_as_home_brew_economy_desc: "Наша залежність від постачань Макартура й квот обернулась проти нас. Полиці спорожніли, і тепер ми знову змушені годувати себе самі. Люди вже починають шепотіти, що сумують за Дядьком Семом..."

  COM_as_home_brew_economy_1: "§gРобітник§!"
  COM_as_home_brew_economy_1_desc: "Без поставок очищеної сировини з півдня ми змушені самостійно її добувати. Новою Федеральною трудовою програмою ми отримаємо потрібні ресурси і виведемо біженців із халуп."

  COM_as_home_brew_economy_2: "§gЇхні модні інструменти§!"
  COM_as_home_brew_economy_2_desc: "Біженці з Анклаву привезли із собою доволі хитру техніку, яка змусила наших інженерів пускати слину. Але тепер перед ними стоїть непросте завдання — розширити площу нашої інфраструктури, буквально з нічого."

  COM_as_industrial_law: "§gДати орлу кігті§!"
  COM_as_industrial_law_desc: "Кількість боєприпасів, потрібна для повернення півдня, — колосальна. Та Ґаллагер вже віддав наказ почати лиття куль і нарізання стволів. Нове Бюро переозброєння вирушило в похід, щоби забезпечити армію всім необхідним."

  COM_as_refugee: "§gНаші брати-американці§!"
  COM_as_refugee_desc: "Кожен куточок міста переповнений біженцями, та ми маємо дбати про кожного американця. Жоден не залишиться у ворожих пазурах — ми зцілимо цих бідолах і знову зробимо їх частиною нації."

  COM_as_refugee_1: "§gГірські розумники§!"
  COM_as_refugee_1_desc: "Срібна підкладка поразки Макартура — це нові таланти в нашому науковому корпусі. Ці ботаніки осядуть у наших лабораторіях і почнуть вигадувати рішення всіх наших бід."

  COM_as_refugee_2: "§gЛюдина під Зірково-Смугастим§!"
  COM_as_refugee_2_desc: "Без Ґаллагера Америка й її біженці були б загублені. Він став іконою та об’єднавчою постаттю серед новоприбулих. У такі хаотичні часи потрібна сильна рука, яка направить корабель."

  COM_as_draft_law: "§gВідгук на поклик Леді Свободи§!"
  COM_as_draft_law_desc: "Ми вдруге втратили Дядька Сема, і тепер мусимо зібрати всі сили, аби факел свободи не згас. Кожен чоловік, жінка і дитина будуть мобілізовані Бюро відновлення задля збереження спадщини Леді Свободи."

  COM_as_reclaim_mca: "§gДовгий марш на південь§!"
  COM_as_reclaim_mca_desc: "Нарешті настав час повернути те, що належить нам. Ми воскресимо Дядька Сема з попелу — хай і пошарпаний, але Старий Славень знову майорить гордо."

  COM_as_new_suburbs: "§gБілий паркан§!"
  COM_as_new_suburbs_desc: "Макартур повернув свою стару славу назад, і тепер американська мрія може повернутись до гір Монтани. Біженці почали рухатись на південь, повертаючи собі старі домівки й створюючи нові передмістя. Південні міста знову оживають, і Ґаллагер щасливий як ніколи."

  COM_as_new_government: "§gОбіцянка батьків-засновників§!"
  COM_as_new_government_desc: "Права та свободи були засадничими принципами, що зробили Америку наддержавою. І з більшістю загроз позаду Ґаллагер починає поступово повертати деякі з цих прав. Найжорсткіші цензурні закони скасовано, хоча нова Всеамериканська комісія стежить за дотриманням порядку."

  COM_as_new_charter_of_rights: "§gКінець стигми§!"
  COM_as_new_charter_of_rights_desc: "Ґаллагер надто довго терпів дискримінацію гулів. Нова Хартія прав гарантує, що кожен американець — гуль чи ні — буде захищений від нерівного поводження. Більшість корінних громадян вітає це, але колишні громадяни Анклаву виражають невдоволення, заснувавши Партію американської чистоти — вони, як кажуть, боротимуться за «чисту» Америку, готову до возз'єднання зі Сходом."

  COM_as_hello_chicago: "§gПрийом, Чикаго?§!"
  COM_as_hello_chicago_desc: "Від моменту падіння Макартура Чикаго мовчить. Жодного сигналу, жодного повідомлення — і це неабияк турбує адміністрацію Ґаллагера, адже цілком можливо, що й вони впали. Але назрілі проблеми вже почали підточувати хиткий мир, здобутий під час відвоювання. Без твердої руки Чикаго Ґаллагер боїться, що майбутнє може виявитися далеко не світлим."

  COM_as_price_event: "§gРозплата§!"
  COM_as_price_event_desc: "Джонсон завжди підозріло ставився до Анклаву, вбачаючи в них монстрів, що жадали скарбів півночі. Ґаллагер — не такий дурень, як Джонсон, але, можливо, у словах того старого п’яниці була частка правди."

  COM_as_two_tier_society: "§gВірність традиціям§!"
  COM_as_two_tier_society_desc: "Хай гульці й допомогли в кампанії з відвоювання, їхній соціальний статус лишився незмінним. Жорсткі пуристи з Анклаву створили Партію американської чистоти, яка, за їхніми словами, бореться за «чисту Америку». Нещодавно вони досягли важливої перемоги — оприлюднено Едикт Річардсона. Це набір місцевих законів, покликаних обмежити права гулів, що викликав чимало схвалень серед колишніх громадян Анклаву."

  COM_as_welfare_system: "§gНа службі у втомлених мас§!"
  COM_as_welfare_system_desc: "Після падіння Макартура воєнне виробництво поглинуло всю нашу економіку. Та тепер, коли коронну перлину повернуто, час відійти від гільз і рушниць. Багато хто ночує на вулицях, тримаючи порожні тарілки. Щоб виправити ситуацію, Ґаллагер створив Бюро економічної безпеки — їхнє завдання: організовувати безкоштовні їдальні та притулки, щоби кожен американець був під опікою."

