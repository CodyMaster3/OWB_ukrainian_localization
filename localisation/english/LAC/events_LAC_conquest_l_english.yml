###############################
##### LAC Custom Tooltips #####
###############################

tt_lac_decimation_1:0 "§gМи обмежимо наше грабування, мінімізуючи руйнування.§!"
tt_lac_decimation_2:0 "Наші війська можуть грабувати на власний розсуд, завдаючи масштабних збитків."
tt_lac_decimation_3:0 "§RЛегіонерам буде надано конкретні цілі й квоти для грабунку, випалюючи землю в пошуках багатства.§!"

tt_lac_choose_crucify:0 "Вибір §Rрозп'яття§! ворожих командирів приносить Славу та §Gпідвищує§! бойовий дух на певний час."
tt_lac_crucify_1:0 "§gПлебс стерпить таку кількість розп’ять.§!"
tt_lac_crucify_2:0 "Багато з плебеїв здіймуть галас через надмір розп’ять."
tt_lac_crucify_3:0 "§RМи сильно розлютимо плебс, але наша гегемонія стане незаперечною там, де стоятимуть хрести.§!"

tt_lac_choose_recruit:0 "Вибір §Gвербування§! ворожих командирів посилює нашу міць і великодушність, але §Rзнижує§! бойовий дух на певний час."
tt_lac_recruit_1:0 "§gКолишній ворожий командир служитиме Ланію й ділитиметься своїм досвідом, хоча серед війська буде невдоволення.§!"
tt_lac_recruit_2:0 "Новий командир приведе військо для інтеграції, але нашим силам знадобиться час на адаптацію."
tt_lac_recruit_3:0 "§RБуде набрано нову когорту з командиром, що використовуватиме їхні старі тактики, що сильно обурить наших легіонерів.§!"

tt_lac_choose_tribute:0 "Надання Трибуту [CES.GetLeader] приносить Славу, але мало що ще."
tt_lac_ces_tribute:0 "Ланій виконав свої зобов’язання, і ми маємо зробити те саме."

tt_lac_choose_demand:0 "Вимагати Тріумф від [CES.GetLeader] у відповідь на наш Трибут – це шанс здобути Славу та величезні багатства."
tt_lac_ces_triumph:0 "Вимоги Ланія розумні, але викликають занепокоєння: його Тріумф буде запланований, §Rале слід уважно стежити за ним.§!"