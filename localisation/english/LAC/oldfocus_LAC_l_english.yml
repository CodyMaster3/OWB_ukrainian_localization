l_english:
  lac_drastic_measures:0 "Рішучі Дії"
  lac_drastic_measures_desc:0 "За незрозумілих обставин Цезар зник, а на його місце прийшов §R\"Кайзер\"§!. Малпайський легат, Вулпес та інші опинилися під його впливом – можливо, в надії здобути славу у ці часи невизначеності. Лише Ланій стоїть у опозиції."

  lac_loyal_reinforcements:0 "Вірні Підкріплення"
  lac_loyal_reinforcements_desc:0 "Ланій не один у своїй боротьбі з §R\"Кайзером\"§!. Все більше легіонерів збираються під його прапором опору. З часом прийдуть ще, й жорстока реальність хиткого становища самозваного §R\"Кайзера\"§! стане очевидною."

  lac_the_legacy_of_caesar:0 "Спадщина Цезаря"
  lac_the_legacy_of_caesar_desc:0 "Було б неправдою сказати, що Ланій любив Цезаря, але він його поважав. Його знання у військовій справі змінили долю Вісімдесяти Семи Племен. Ніхто, окрім Цезаря, не зміг би завоювати Арізону. §RІ лише Легіон Цезаря гідний правити на його місці.§!"

  lac_to_the_victor_go_the_spoils:0 "Переможцю – Здобич"
  lac_to_the_victor_go_the_spoils_desc:0 "Якщо Когорта Ланія хоче вистояти перед промисловою могутністю §R\"Легіону Кайзера\"§!, вона повинна йому дорівнятись. Будувати майстерні з нуля – повільно, та й не в дусі Легіону. Легіон живе за одним законом: хочеш щось – візьми. Потребуєш чогось? §RУбий за це.§!"

  lac_uproot_twin_mothers:0 "Викорінити Двійчат"
  lac_uproot_twin_mothers_desc:0 "Плем’я Двійчат на північному заході завжди було нам завадою. Раніше ми не звертали на них уваги – були важливіші. Але тепер, коли вони стоять між нами та славою, вони впадуть перед бичачими рогами."

  lac_stepping_on_scorpions:0 "Розчавити Скорпіонів"
  lac_stepping_on_scorpions_desc:0 "Укус Скорпіона – бідне плем’я, що тримається за своє життя попри зміни довкола. Все, що потрібно для їх падіння – легкий поштовх... чи вістря меча."

  lac_kicking_dogs:0 "Пнуть Псів"
  lac_kicking_dogs_desc:0 "Биті Пси славляться звіролюдьми та є найсерйознішим ворогом у Колорадо. Їхні командири – розумні, а воїни – рішучі й хитрі. Війна буде важкою, але Місто Псів має належати нам."

  lac_beating_iron:0 "Залізний Гуркіт"
  lac_beating_iron_desc:0 "Найманці рідко турбують Легіон... зазвичай. Але Залізний Альянс на півночі Колорадо – грізне угруповання, озброєне силовою бронею. Ми повинні згадати, як Цезар розправився з Бункером Мексона, і повторити його стратегію."

  lac_assert_our_hegemony:0 "Утвердити Гегемонію"
  lac_assert_our_hegemony_desc:0 "Після підкорення основних загроз у Колорадо настав час укріпити наші позиції. Зайнявши ключові пункти на півночі, ми можемо розпочати кампанію за решту штату..."

  lac_total_war:0 "Тотальна Війна"
  lac_total_war_desc:0 "Рим не збудували за день – і не на кількох плечах. Якщо ми хочемо створити нову імперію, потрібна армія. Настав час нагадати племенам про їхній обов’язок перед Цезарем і його спадкоємцем: Ланієм."

  lac_decolonise_pecos:0 "Деколонізація Пекосу"
  lac_decolonise_pecos_desc:0 "Колонія Пекосу – наш наступний кандидат для експансії на південь. Політична ситуація в Землі Титанів нестабільна, і ми маємо діяти зараз."

  lac_recall_paullus:0 "Повернення Паулюса"
  lac_recall_paullus_desc:0 "Центуріон Паулюс – зарозумілий дурень, якого перемогли, та він все ще може бути корисним. Ми потребуємо його в кампанії на Ріо."

  lac_shatter_the_republic:0 "Розтрощити Республіку"
  lac_shatter_the_republic_desc:0 "Прийшов час знищити Республіку Ріо-Ґранде та їх дурнуваті ідеали демократії. Їхня держава – на межі розпаду, і їхня доля – стати зноскою в історії."

  lac_the_pact:0 "Пакт"
  lac_the_pact_desc:0 "Санта Анна – володар північного узбережжя Мексики. Ходять чутки, що він ненавидить людей, але Ріо ненавидить ще більше. Якщо ми зламаємо його найбільшого ворога, він може приєднатись до нас."

  lac_hegemony_over_the_rio:0 "Гегемонія над Ріо"
  lac_hegemony_over_the_rio_desc:0 "Республіку знищено, Санта Анна на нашому боці – наше панування над Ріо беззаперечне. Ми впровадимо політику Цезаря й покажемо мексиканцям, якою є справжня цивілізація."

  lac_the_rightful_master_of_colorado:0 "Законний Володар Колорадо"
  lac_the_rightful_master_of_colorado_desc:0 "Наші землі простяглися від одного краю Ріо до іншого – майже. Ще частина Колорадо не підкорена, але ми вже готові до бою. Колорадо – наш ключ до Арізони."

  lac_correct_the_timeline:0 "Виправити Часову Лінію"
  lac_correct_the_timeline_desc:0 "§R\"Кайзер\"§! – не з нашого світу. Наші шпигуни впевнені: він із іншого часу й місця. Ми віддамо належне спадку Цезаря і виправимо цю космічну помилку, §Rпоставивши голову самозванця на спис під Флагстаффом.§!"

  lac_lanius_cruel_reality:0 "Жорстока Реальність Ланія"
  lac_lanius_cruel_reality_desc:0 "Цезар та Малпай мріяли про новий Рим, але вони були засліплені славою. Цезар міг би досягти мети, але після його зникнення нам доводиться прийняти реальність: племінність – наш єдиний шлях. І Легіон мусить подвоїти зусилля."

  lac_promote_the_strong:0 "Просувати Сильних"
  lac_promote_the_strong_desc:0 "Виживає лише сильний. Легіон – жорстка організація, де тільки достойні отримують увагу Марса. Нам потрібні сильні лідери, тому ми підвищуватимемо найкращих бійців."

  lac_human_wave_tactics:0 "Тактика Людських Хвиль"
  lac_human_wave_tactics_desc:0 "Не всі народжуються сильними – і вони це знають. Поза Легіоном слабкі тримаються купи від страху, але під прапором Бика – вони стають армією."

  lac_empower_the_masses:0 "Загартувати Слабких"
  lac_empower_the_masses_desc:0 "Пора змінити навчання. Слабким більше не буде притулку – ми перетворимо їхні тіла у горнилі крові й поту. Деякі помруть, але ті, хто виживе, подякують нам."

  lac_the_red_army:0 "Червона Армія"
  lac_the_red_army_desc:0 "Пустка ще ніколи не бачила такої рівності: мобільної армії велетнів, яких ведуть ще більш величні постаті, що стануть легендою. Кажуть, §R\"Кайзер\"§! боїться єдності під червоним стягом §R\"синдикалізму\"§!, і коли ми перетнемо ріку, нагадаймо йому про провал його §R\"Вельткріґу\"§!."

  lac_caesars_ambition:0 "Амбіції Цезаря"
  lac_caesars_ambition_desc:0 "Легіон був армією без держави, й Цезар прагнув перетворити його завоювання у реформовану імперію. Можливо, ми й не створимо Новий Рим, але можемо використати його плани для посилення нашої військової могутності."

  lac_military_meritocracy:0 "Військова Меритократія"
  lac_military_meritocracy_desc:0 "Ми більше не підвищуємо лише сильних. Ми обираємо найсильніших і найрозумніших. Наші лави тепер заповнені не тільки вправними воїнами, але й хитрими стратегами та змієподібними фрументаріями."

  lac_sophisticated_drills:0 "Удосконалені Навчання"
  lac_sophisticated_drills_desc:0 "Колись ми просто готували племінних воїнів до бою. Тепер ми формуємо ідеальну армію, наголошуючи на тактиці, груповій злагодженості та широкомасштабних тренуваннях."

  lac_transform_the_frumentarii:0 "Реформа Фрументаріїв"
  lac_transform_the_frumentarii_desc:0 "Фрументарії – ключ до наших диверсій. Та ми підвищимо їхню роль. Ми створимо §YСпекуляторів§!, логістично розумних адміністраторів, а найжорстокіші та найхитріші – залишаться шпигунами й карателями."

  lac_the_new_roman_army:0 "Нова Римська Армія"
  lac_the_new_roman_army_desc:0 "Остання реформа завершена, тренування тривають – ми стали найорганізованішою армією в Пустці. З Марсом як нашим провідником – нам не страшний жоден ворог."

  lac_war_changes:0 "Війна Змінюється"
  lac_war_changes_desc:0 "Дурні на заході твердять, що війна не змінюється. Ми знаємо краще: наша армія змінює саму суть війни на віки вперед."

  lac_new_denarius:0 "Новий Денарій"
  lac_new_denarius_desc:0 "З втратою Флагстаффа ми маємо відновити нашу грошову базу. Як і заведено, щороку карбується нова монета. Цього разу вона прославить наші здобутки."

  lac_put_miners_to_work:0 "В шахту!"
  lac_put_miners_to_work_desc:0 "Ми не певні, чи Ланій мав на увазі \"гірників\" чи \"дітей\", але в обох випадках – до роботи!"

  lac_slave_scrappers:0 "Раби на Збірці Брухту"
  lac_slave_scrappers_desc:0 "Наші поточні зусилля не дають бажаного результату. Настав час відправити частину рабів шукати більше металу."

  lac_blood_for_iron:0 "Кров Заради Заліза"
  lac_blood_for_iron_desc:0 "Наші потреби в металі зросли. Ми більше не можемо дбати про безпеку робітників – вони підуть навіть у гнізда рейдерів і когтів смерті."

  lac_search_for_water:0 "Пошук Води"
  lac_search_for_water_desc:0 "Вода – життя. Чим більша армія, тим більша спрага. Пора шукати нові джерела."

  lac_conscript_water_caravans:0 "Примус до Караванів"
  lac_conscript_water_caravans_desc:0 "Ми не можемо покладатися лише на данину. Ми реквізуємо рабів для створення водних караванів по всій Пустці."

  lac_water_over_blood:0 "Вода Понад Кров"
  lac_water_over_blood_desc:0 "Якщо раб не принесе води – він втратить руку. Повторить – втратить життя. Його нащадки служитимуть нам навіки."

  lac_raid_our_neighbours:0 "Пограбувати Сусідів"
  lac_raid_our_neighbours_desc:0 "Багатства Пустки належать нам. Наші сусіди або приймуть це, або помруть. Скаути не беруть полонених."

  lac_slave_raids:0 "Рабовласницькі Нальоти"
  lac_slave_raids_desc:0 "Наші потреби зростають. Ми відправимо рабів разом зі скаутами – і нехай повернуться з трофеями."

  lac_the_price_we_pay:0 "Ціна"
  lac_the_price_we_pay_desc:0 "Колишні методи не працюють. Наші скаути повинні прийняти – війна стала тотальною. Можливо, виживуть, якщо замість себе пошлють рабів."

  lac_roman_roads:0 "Римські Дороги"
  lac_roman_roads_desc:0 "Рим славився дорогами. І ми побудуємо свої, щоб зміцнити контроль та пересування військ."

  lac_spread_the_forges_of_mars:0 "Кузні Марса"
  lac_spread_the_forges_of_mars_desc:0 "Нашим військам потрібна зброя, боєприпаси та броня. Ми втратили заводи на заході, тож створимо нові – тут."

  lac_the_birthplace_of_civilization:0 "Колиска Цивілізації"
  lac_the_birthplace_of_civilization_desc:0 "Наші інфраструктурні проєкти стали прикладом для інших. Час довести, що ми – справжнє джерело цивілізації, та почати грандіозне будівництво."

  lac_the_pen_or_the_sword:0 "Перо чи Меч?"
  lac_the_pen_or_the_sword_desc:0 "Питання просте, відповідь – ні. Залишимось вірними Цезарю чи звернемо до прогресу й вогнепалу?"

  lac_cult_of_mars:0 "Культ Марса"
  lac_cult_of_mars_desc:0 "Після прийняття технологій §OКульт Марса§! прибув до нас. Вони проголосили Ланія Сином Марса й віддали йому мечі – за славу й перемогу над §Rусіма§! фальшивими богами."
