l_english:
has_turned_down_dianas_offer_tt:0 "§RВідмовився від світла.§!"
doesnt_have_war_with_neighbor_tt:0 "Не веде §Rвійну§! з §Yсусідньою§! країною."

nf_lanius_ces_relations.1.t:0 "Наказ Цезаря"
nf_lanius_ces_relations.1.d:0 "Чотири місяці тому Цезар викликав Ланія до свого шатра-цитаделі у Флагстаффі. Там він дав важливий наказ славетному Легату.\n\n\"Ланіє, мені потрібно, щоб ти захопив Псине Місто. Мені знадобляться багатства Денвера, аби перетнути Колорадо й захопити дамбу.\nЯ доручаю тобі кілька когорт і довіряю, що за п’ять років ти виконаєш це завдання. Якщо затримаєшся — я вважатиму тебе невдахою й позначу на смерть, як і кожного, хто мене підвів.\nНе май пощади до цих нечестивців.\""
nf_lanius_ces_relations.1.a:0 "\"Так, мій Цезар.\""
nf_lanius_ces_relations.1.a.tt:0 "[CES.GetFlag]§YЦезар§! дав [LAC.GetFlag]§YЛанію§! прямий наказ захопити [HAN.GetFlag]§YПсине Місто§! й повернутися до §Y1 січня 2280 року§!.\nЯкщо до цієї дати [LAC.GetFlag]§YЛаній§! не виконає наказ, він буде оголошений §Rзрадником і позначений на смерть, що призведе до виходу його Когорти з фракції.§!"

nf_lanius_ces_relations.2.t:0 "Вірний М’ясник"
nf_lanius_ces_relations.2.d:0 "[Текст як у .1.d]"
nf_lanius_ces_relations.2.a:0 "Нехай буде виконано мою волю."
nf_lanius_ces_relations.2.a.tt:0 "[CES.GetFlag]§YЦезар§! дав [LAC.GetFlag]§YЛанію§! прямий наказ захопити [HAN.GetFlag]§YПсине Місто§! й повернутися до §Y1 січня 2280 року§!.\nЯкщо до цієї дати [LAC.GetFlag]§YЛаній§! не виконає наказ, він буде оголошений §Rзрадником і позначений на смерть, що призведе до виходу його Когорти з фракції.§! \n\nЦезар може надати Ланію ресурси й людей, але не контролюватиме його безпосередньо через велику відстань."

nf_lanius_ces_relations.3.t:0 "Схід більше не відповідає"
nf_lanius_ces_relations.3.d:0 "Ланія відправили підкорити Схід — і він це зробив: швидко, жорстоко, безжально. Але тепер, коли настав час повертати плоди цього завоювання, він натомість надсилає дерев’яну скриню з ґрунтом і глек річкової води. І нічого більше.\n\nДругий кур’єр прибув через кілька днів із пергаментом, позначеним кров’ю. У ньому Ланій пише лише: \"Нехай цього вистачить. Якщо хочеш більшого — візьми власними руками.\"\n\nЦе не зрада в стилі боягузів. Це щось інше — холодніше. Ніби він більше не говорить мовою наказів, а мовою ритуалу й панування. Ми ще не розуміємо, ким він став."
nf_lanius_ces_relations.3.a:0 "Тривожно."

nf_lanius_ces_relations.4.t:0 "Схід завмер у тиші"
nf_lanius_ces_relations.4.d:0 "Цезар наказав Ланію скорити Нью-Мексико й Арізону — і тепер пустелі шепочуть тільки Його ім’я. Вулиці Альбукерке забарвлені в червоне, а кожен хрест на дорозі до Тусона несе тягар зламаного спротиву.\n\nЖодне місто не вистояло двічі. Жодна орда не піднялася знову. З броньованим кулаком і мовчазною люттю Ланій спалив спротив і посіяв покору в ґрунті. Тепер, коли Схід упокорено, він повертається не в тріумфі, а в мовчанні. Зброя, що повертається до піхов лише за наказом Цезаря.\n\nДехто боявся, що він здичавіє, відірваний від вогню Флагстаффа. Але що є меч без руки, яка ним володіє? Він схиляється. І разом із ним схиляється Схід."
nf_lanius_ces_relations.4.a:0 "Він виконав наказ. Виконає знову."

nf_lac.2.t:0 "Лояльні Підкріплення"
nf_lac.2.d:0 "Клич Ланія не залишився без відповіді! Із земель самозванця посунули вірні воїни, розчаровані в старих поплічниках Цезаря та їхній вірності самозванцю. Серед новоприбулих — досвідчені ветерани, які ведуть за собою цілі орди легіонерів, готових битися за правду.\n\nІ це ще не все — разом із арміями прийшли новини про підлі змови нового ватажка Флагстаффа. Нібито заради стабільності. Ми бачимо крізь його брехню! Цей демон із чужого виміру, що ховається під людською маскою, прагне викорінити праведність Марса — і ми цьому не дозволимо!\n\nМи краще загинемо, борючись!"
nf_lac.2.a:0 "Цезаря більше немає, але його послідовники залишилися."

nf_lac.3.t:0 "Спадщина Цезаря"
nf_lac.3.d:0 "Цезар був мудрим чоловіком, дарованим нам Марсом — вчений, що революціонізував мистецтво війни й завоював Арізону. Плем’я за плем’ям він підкорював, немов би це було дихання... і ми щодня сумуємо за ним.\n\nТа навіть без нього ми маємо його знання, його тактику й віру в нас — його вірні легіони. Його розуміння війни врізалося в наші серця, тож як ми можемо програти? Ми будемо завойовувати знову й знову... заливаючи Пустку кров’ю та стягом Легіону Цезаря!"
nf_lac.3.a:0 "Він навчив нас добре, і ми маємо пам’ятати про це."

nf_lac.4.t:0 "Перо чи меч?"
nf_lac.4.d:0 "Легіон давно стикається з реальністю нашої військової відсталості перед лицем передових технологій. Ми перемогли Братство одного разу в Арізоні, але ціною великих втрат, і дехто серед нас кричав від гніву через байдужість Цезаря до наших страждань. Їх розіп'яли. Але тепер, коли Цезаря немає, маємо спитати себе: чи наш спосіб життя справді правильний?\n\nЦезар справедливо критикував надмірну залежність Старого Світу від технологій, і його теза про загибель цього світу є твердою. Але чи не ми — ідеальне суспільство, що здатне озброїтися знаряддями мертвих США?\n\nІнші можуть використати ці багатства, але лише ми застосуємо їх правильно... З іншого боку, чи не зможемо саме ми досягти ідеального балансу між технологією та традиційним життям? Якщо ми відмовимося від своїх принципів, чи не заплямуємо ми спадщину Цезаря?\n\nПитання, що стоїть перед нами, таке ж старе, як і писемна історія... перо чи меч?"
nf_lac.4.a:0 "§RМеч!§!"
nf_lac.4.b:0 "§OП... перо?§!"

nf_lac.5.t:0 "Просто автограф"
nf_lac.5.d:0 "§bПеред тобою стоїть чоловік. Він розповідає про книгу, але здається, ти його знаєш. \"Я священик Марса,\" — каже він, його тіло здригається під глибоким червоним одягом. — \"Ми давно пропагуємо Перо. Час настав, то чому б тобі не взяти його... і не вписати своє ім'я в літопис історії?\"\n\nТи дивишся на книгу на столі. Вона не схожа на історичну, але ж ти ніколи не читав книги, то що тобі судити? У твоїй руці — щось чуже. Це Перо. Ти роздивляєшся його, потім дивишся на чоловіка. \"Важко писати, так? Ти знаєш, як написати своє ім'я?\" Ти киваєш. Ти завжди знав своє ім'я.\n\nВін відкриває книгу — як мило з його боку. Він показує потрібну сторінку, саме ту, де слід написати своє ім’я. Твої люди дивляться на тебе — з цікавістю, з очікуванням, з голодом. Вони хочуть, щоб ти зробив це. Все якось змінилось відтоді, як прибув Кайзер. Повітря здається живішим.\n\nКнига дивиться на тебе. Ти не схожий на Сина Марса, але їй що знати про релігію? Вона знає лише одне — ти маєш написати ТУТ і ЗАРАЗ.\n\nТи пам'ятаєш, що писати?§!"
nf_lac.5.a:0 "§R...§!"
nf_lac.5.b:0 "§R...§!"

nf_lanius.1.t:0 "Звір зі Сходу"
nf_lanius.1.d:0 "Ланій був найкращим воїном Племені Шкурокорів — одним із найзапекліших ворогів Легіону. Або ж він народився рабом, якому природні здібності дозволили стати легіонером у 12 років? Кажуть, він винищив усіх чоловіків свого племені... або ж їх приєднали до Легіону? Тільки Цезар і Ланій знають правду. Але незаперечне одне — Ланій є одним з найвидатніших лідерів Легіону. Дехто вважає його дикуном, але за маскою може ховатися більше, ніж здається..."
nf_lanius.1.a:0 "Він природжений лідер."
nf_lanius.1.a_tt:0 "\nЛаній має харизму"
nf_lanius.1.b:0 "Він рухається, як вітер."
nf_lanius.1.b_tt:0 "\nЛаній спритний"
nf_lanius.1.c:0 "Дехто народжується з удачею. Ланію пощастило народитися."
nf_lanius.1.c_tt:0 "\nЛаній везунчик"
nf_lanius.1.e:0 "Ходять чутки, що він розумніший за самого Цезаря..."
nf_lanius.1.e_tt:0 "\nЛаній — інтелектуал"

nf_lanius.2.t:0 "Швидка, чесна, куплена кров'ю"
nf_lanius.2.d:0 "Ресурси Легіону великі, але не безмежні. Ланій мав вирішити, кого взяти на схід. Одні казали — найсильніших, зі стрілецькою зброєю. Інші — фанатиків, готових убивати й вмирати. Ще інші — найшвидших. Але рішення було за Ланієм."
nf_lanius.2.a:0 "Добре споряджена експедиція."
nf_lanius.2.b:0 "Хто виживе — стане сильнішим."
nf_lanius.2.c:0 "Колісниці мчать рівнинами."

nf_lanius.3.t:0 "Куємо широку, гостру, мов бритва, косу"
nf_lanius.3.d:0 "Коли Ланій захопив форт Саммерс, він мав вирішити, що робити з мешканцями цього бойового селища."
nf_lanius.3.a:0 "Сформувати з них армію рабів."
nf_lanius.3.b:0 "Пограбувати й забрати всі багатства."

nf_lanius.4.t:0 "Горе переможеним!"
nf_lanius.4.d:0 "Плем'я Ламбда з Нью-Мексико було поневолене без пощади, як і Шкурокори. Щоб відзначити перемогу, Ланій назвав їхнє головне село Збірним Пунктом. А саме плем’я?"
nf_lanius.4.a:0 "Ось вам ще раби!"
nf_lanius.4.b:0 "Вони приєдналися до лав Легіону."
nf_lanius.4.c:0 "Їх навчили чеснотам праці."

nf_lanius.6.t:0 "Перегорнувши сторінку"
nf_lanius.6.d:0 "Монастирі Санта-Фе впали; кістки Лейбовіца зотліли. Але... тут багато знань — освячені фоліанти, що варті уваги. Монахи зібрали не лише слова мертвого бога, але й книжки про ремесла, лікування й інше. Навіть їхні записи про теслю й іншого Цезаря можуть бути корисні."
nf_lanius.6.a:0 "Як стати ловцем людей?"
nf_lanius.6.b:0 "Нехай монахи служать Легіону."

nf_lanius.7.t:0 "Рейдери Загубленого Сховища"
nf_lanius.7.d:0 "Плейнсраннери розжиріли на здобичі Екзек’ютів, але після перемоги Ланія перед ним постав вибір: забрати рабів і направити їх на ферми уздовж Пекосу, чи залишити Екзек’ютів при владі, щоб вони служили своїм мистецтвом Легіону."
nf_lanius.7.a:0 "Металеві люди нам не потрібні."
nf_lanius.7.b:0 "Рабів завжди знайдеться ще."

nf_lanius.8.t:0 "Магії"
nf_lanius.8.d:0 "Поселенці Розвелла не сказали нам, якими засобами працюють їхні інструменти та закляття. Можливо, ми дізнаємося їхні секрети, пограбувавши храм Еф-Бі-Ай?"
nf_lanius.8.a:0 "Забрати все залізо."
nf_lanius.8.b:0 "Знайти рідкісні метали."


nf_lanius.9.t:0 "Плоди перемоги"
nf_lanius.9.d:0 "Мескалеро пережили Велику Війну завдяки серцю рослини мескаль і втамовували спрагу плодами юки під палаючим сонцем. Вони процвітали попри війну, створивши домівку у Пустці.\n\nТепер, під наглядом Легіону, вцілілі дбають про свої сади — ще одні з багатьох, кого намагались підкорити. Але Ланій умів вчитися у ворогів, і навіть колишня лідерка Мескалеро, Лозен, визнала в ньому мудрість. Бо Звір зі Сходу вважав, що наслідування — найщиріша форма лестощів."
nf_lanius.9.a:0 "Кочовий шлях Апачі послужить нам добре."
nf_lanius.9.b:0 "Ми можемо багато навчитися від їхніх воїнів."

nf_lanius.10.t:0 "Земля бажаного серця"
nf_lanius.10.d:0 "До Війни Нью-Мексико називали Землею зачарування. Але Ланій пам'ятав її іншу назву. Він навчився воювати в Арізоні, але саме в Нью-Мексико навчився правити.\n\nНедостатньо просто розгромити ворога. Ланій усвідомив, що після бою ще багато роботи. Різанина лишає нікого, хто б годував Легіон, а раби не прославляють перемоги. Тож Ланій зняв ошийник з Колорадо та дозволив ремісникам Виконавців кувати нову зброю для Когорти. З часом думки за його маскою змінилися."
nf_lanius.10.a:0 "Будівництво, як і завоювання, має свою принаду."
nf_lanius.10.b:0 "Та цього не станеться, якщо вони досі чинять спротив."

nf_lanius.11.t:0 "Всі існують, аби випробувати силу Легіону"
nf_lanius.11.d:0 "Поколіннями плем’я Розмальованої Скелі малювало на ній свою історію — славетні перемоги та тривоги. Ланій дивився мовчки. Потім подивився на чоловіка, що стояв навколішки: \"Яка кров — твоя, Забарвлена Кров? А яка належить Легіону?\" Той мовчав. \"Не бійся поразки. Тебе очистять і зроблять більшим. Ваші воїни заслужили місце в моїй армії. І як я — ти озирнешся через роки і пошкодуєш, скільки життя змарнував.\"\n\nНа їхніх очах легіонери облили скелю червоною фарбою. Історія народу зникла в морі багряного."
nf_lanius.11.a:0 "Встаньте, сини Марса!"

nf_lanius.12.t:0 "Зворотний відлік"
nf_lanius.12.d:0 "\"То це й є дім Братства?\" — спитав Ланій. \"Діра в землі, де ховаються від честі бою?\" Він підступив ближче. \"Паладин Андреа! Ми знайшли вентиляційні труби до вашого бункера. Газ уже проникає всередину. Чи виживуть ваші діти? Чи зостанетеся разом із їхніми трупами? Обирайте.\""
nf_lanius.12.a:0 "Вони знайдуть нове життя у Легіоні."
nf_lanius.12.b:0 "О, ми газ не зупинимо."

nf_lanius.13.t:0 "Рівні обряди"
nf_lanius.13.d:0 "Цезар ніколи не дозволяв жінкам бути воїнами — лише цілительками, повитухами та писарями. Але Ланій у Сході переміг багатьох войовничих жінок: Лозен, Моррісон, Брікслі. Вони билися не гірше за аризонців. Чи не настав час змін? Шпигунки, розвідниці, почесні писарки, які б'ються словом?"
nf_lanius.13.a:0 "Цезар би цього не схвалив!"
nf_lanius.13.b:0 "Ланій матиме своїх Міністрес."

nf_lanius.14.t:0 "Суд у Місті Псів"
nf_lanius.14.d:0 "Ніч опустилася на Денвер, але його заливають пожежі. Ланій стоїть мовчки, витираючи кров з меча. Перед ним останні з Псарів — розбиті, зломлені, але віддані. Їхня вірність може бути переплавлена — чи розтоптана назавжди."
nf_lanius.14.a:0 "Їхню вірність буде перетворено. Вони служитимуть як псарі."
nf_lanius.14.b:0 "Поводок — це ще ласка. Поневолити залишки."

nf_lanius.15.t:0 "Легенда про М’ясника"
nf_lanius.15.d:0 "Ланій повернувся! Він пішов до Апачі. Взяв Розуелл. Зламав Сховища. Великий день для Легіону. Та Цезар має пильнувати його...\n\nПоки живий."
nf_lanius.15.a:0 "Пам'ятай, що ти смертний."

nf_lanius.16.t:0 "Пес для Короля"
nf_lanius.16.d:0 "Ми знайшли вірного товариша — назвемо його Рекс. Король серед псів. Добрий пес. Дуже добрий!"
nf_lanius.16.a:0 "Якщо хтось спитає — він спить зі мною для охорони."
nf_lanius.16.b:0 "Може, Цезарові стане у пригоді?"

nf_lanius.17.t:0 "Скарб Міста Псів"
nf_lanius.17.d:0 "Ланій надіслав нам могутнього союзника з Міста Псів — пса на ім’я Рекс. Віддамо йому найкращі об’їдки. І, можливо, добавку."
nf_lanius.17.a:0 "Міг би повчитись у нього, Вулпесе."

nf_lanius.18.t:0 "Ще більше здобичі!"
nf_lanius.18.d:0 "Чи є місце, якого Ланій не здатен завоювати? Маленька експедиція обернулася народженням імперії! Почекай... хіба ми не імперія вже?.."
nf_lanius.18.a:0 "Та все ж нормально, правда?"

nf_lanius.19.t:0 "Двобій долі"
nf_lanius.19.d:0 "Клинок біля горла Шейла. Ланій переміг ватажка супермутантів. \"Немає сорому в поразці, — сказав Ланій. — Чи мусить і твоя могила приєднатися до інших?\" \n\nРешта мутантів сперечатимуться: Шейл мовчав? Чи це був найгучніший крик з усіх?"
nf_lanius.19.a:0 "Ласкаво просимо до Легіону, Продігіум."

nf_lanius.20.t:0 "Не перемикайте канал!"
nf_lanius.20.d:0 "А зараз, пані та панове, оновлення про тих, хто повстав проти Легіону — о, здається, ще один повис на хресті! Справді, знаючи, яка доля чекає всіх, хто чинить спротив Ланію, хто наважиться кинути виклик його владі? А далі — гладіаторський бій між двома племінниками. Лише один з них буде гідним служити Легіону. Але спершу — слово нашим спонсорам."
nf_lanius.20.a:0 "Можливо, це була помилка."

nf_lanius.21.t:0 "Воля Цезаря звершується через мене"
nf_lanius.21.d:0 "Смерть Цезаря доводить те, що ми завжди знали: навіть бог може померти. Тепер його послідовники на заході борються за залишки, і ми повинні вирішити, що робити. Ми могли б підтримати будь-кого з них, окрім Вулпеса — його зрада не гідна влади. Та можливо, краще дозволити їм боротися між собою? Легіон потребує сили, і ми можемо зробити фатальну помилку, поставивши слабкого правителя..."
nf_lanius.21.a:0 "Мальпайс, мій давній друг."
nf_lanius.21.b:0 "Лють Аурелія переможе."
nf_lanius.21.c:0 "Луцій знав Цезаря найкраще."
nf_lanius.21.e:0 "Хай доведуть свою силу!"

nf_lanius.22.t:0 "Вірні Цезарю"
nf_lanius.22.d:0 "[LAC.Getleader] надіслав допомогу у нашій громадянській війні! Завдяки йому ми точно переможемо. Хоча деякі в нашій раді воліли б пряму інтервенцію, краще тримати М’ясника подалі від наших земель, аби його допомога не обернулася наказами."
nf_lanius.22.a:0 "Аве!"

nf_lanius.23.t:0 "До краю світу"
nf_lanius.23.d:0 "Кажуть, коли Ланій досягнув Мексиканської затоки, він заплакав, бо не залишилося світів для завоювання. Вірний слуга завершив завдання та підкорив Схід під стяг Бика. Зброя Братства, раби Роллер Герл і техніки Трубоголових течуть до Флагстаффа як данина, і ми вшановуємо його тріумфом.\nАле дехто шепоче — чи не став М’ясник надто сильним? Невже нам є чого боятися?.."
nf_lanius.23.a:0 "Пам'ятай, що ти смертний."

nf_lanius.24.t:0 "Батько і Син"
nf_lanius.24.d:0 "Тріумф був грандіозним. Колишній голова глави Аламо в кайданах, вози зі скарбами тягнуть супермутанти... аж дух перехоплює. Але у наметі з Цезарем Ланій говорить прямо: \"Схід був тяжким походом. Ти тягнеш кров Легіону на Вегас, а ми можемо звернути південь — добити техасців, або ж зачекати і вдарити по Чикаго — останньому бастіону Старого Світу.\"\n\nПро реакцію Цезаря ніхто не дізнався. Але згодом схід наповнили радники, писарі й інженери. Легіон оселився тут надовго."
nf_lanius.24.a:0 "Ми вчепились і не відпустимо."

nf_lanius.25.t:0 "Доля Легіону"
nf_lanius.25.d:0 "Ланій сумує за Цезарем, але його смерть відкрила нові можливості. Яке право має [CES.GetLeader], аби правити? Ланій створив імперію на сході, а [CES.GetLeader] думає, що є спадкоємцем Цезаря? Треба щось змінити. Принаймні — припинити платити данину. А можливо... слід очолити весь Легіон?"
nf_lanius.25.a:0 "Кінець данини."
nf_lanius.25.b:0 "Вимагати данину."
nf_lanius.25.c:0 "Легіат правитиме!"

nf_lanius.26.t:0 "Віддати Цезарю"
nf_lanius.26.d:0 "[LAC.GetLeader] вимагає припинити сплату данини до Флагстаффа, хоча й залишиться союзником. Це нас послабить... але чи наважимось ми на війну?"
nf_lanius.26.a:0 "Припинити данину."
nf_lanius.26.b:0 "Він божевільний, як пси Денвера. Усмиримо його."

nf_lanius.27.t:0 "Рівний Заходу"
nf_lanius.27.d:0 "[CES.GetLeader] погодився на наші вимоги. Віднині ми правимо як рівні. Хай [CES.GetLeader] тримає Захід, бо справжня слава Легіону буде на Сході, де імперія пише себе кров’ю."
nf_lanius.27.a:0 "Переможцю — слава!"

nf_lanius.28.t:0 "Гординя [CES.GetLeader]"
nf_lanius.28.d:0 "[CES.GetLeader] зневажає наші завоювання і вважає, що тільки він — спадкоємець Цезаря. Тепер він вимагає, щоб ми знову платили данину — як раби, а не союзники. Гаразд. Ми вирушаємо на захід, аби стерти його ім’я. І знищити його світ."
nf_lanius.28.a:0 "Усі існують, аби випробувати силу Легіону."

nf_lanius.29.t:0 "Поворот колеса"
nf_lanius.29.d:0 "Ланій править імперією від Колорадо до Затоки. Тепер він вимагає, щоб Західний Легіон платив йому за 'захист' від неясних загроз зі Сходу: скажених машин, привидів орла й ще одного Братства (він, здається, придумав це на ходу). Ми можемо підкоритись... або стріляти першими. Ваш вибір?"
nf_lanius.29.a:0 "Хоробрість — це обачність."
nf_lanius.29.b:0 "Нехай спробує нас зарізати."

nf_lanius.30.t:0 "Захід схиляється"
nf_lanius.30.d:0 "[CES.GetLeader] визнав, що Легіон належить сильнішому. Хоч він і буде нашим намісником на заході, справжня влада над Биком тепер належить нам! Багатства Заходу прикрасять нашу столицю, і ми готуємось рушити на Міссісіпі.\n\nАдже попереду ще є світи для підкорення."
nf_lanius.30.a:0 "Уявіть собі, що Мохаве мало значення."

nf_lanius.31.t:0 "Блудний брат"
nf_lanius.31.d:0 "[CES.GetLeader] відмовив нам. Що ж, доведеться самим іти на Флагстафф, щоб відновити єдність мети, яку дав Цезар."
nf_lanius.31.a:0 "Я приніс не мир, а меч."

nf_lanius.32.t:0 "Ланій вимагає, аби ми впали на коліна"
nf_lanius.32.d:0 "Ланій вимагає, аби ми стали його маріонеткою. Це обурливо... майже так само, як кількість добре навчених легіонерів, що його слухають. Що ж нам робити?"
nf_lanius.32.a:0 "Ми служили Цезарю — можемо й іншому."
nf_lanius.32.b:0 "Хто він такий, щоб нам наказувати?"

nf_lanius.33.t:0 "Приховані Люди"
nf_lanius.33.d:0 "Під час допитів колишніх членів ради Товариства Блакитної Троянди Ланію врешті вдалося виявити місце однієї важливої локації. Сховище — незавершене до Великої Війни, але згодом заселене.\nНа їхніх язичницьких мапах воно позначалося як «Сховище 86-b».\n\nЗ погляду військової тактики, Сховища завжди були легкою здобиччю: ізольовані, ліниві й наївні, вони вірили, що залізні стіни вбережуть їх від гніву Марса.\nЗрештою, член ради вказав нам шлях. Але замість повного профанів для різанини Сховища, ми знайшли порожню оболонку! Порожні коридори, покриті невідомими знаками. Написи, схожі на зіпсовану кирилицю, змішану зі звичайним текстом. Перед стратою член ради зміг перекласти лише одне слово: мешканців Сховища називали «Есіібі»."
nf_lanius.33.a:0 "Марна трата часу."

nf_lanius_vulpes_scheme.1.t:0 "Змови у пилу"
nf_lanius_vulpes_scheme.1.d:0 "Вулпес Інкульта, лис у кущах, пропонує свою допомогу новому когорті Ланія. Там, де Центуріон Паулюс зазнав поразки на шляху до Денвера, Вулпес вірить, що хитрість і змова можуть забезпечити успіх.\n\nЙого методи суперечать відкритій війні Легіата, та Ланій має вирішити: воля Цезаря — це лише меч, чи іноді кинджал теж вартий використання?"
nf_lanius_vulpes_scheme.1.a:0 "§RНехай лис плете свої інтриги.§!"
nf_lanius_vulpes_scheme.1.b:0 "§gЗабирайся з очей, пройдисвіте.§!"

lanius_has_vulpes_support:0 "Ланій прийняв допомогу [CES.GetFlag] Вулпеса."
lac_has_sent_frumentarii_north:0 "[CES.GetFlag] Вулпес надіслав фрументаріїв на північ у Нью-Стерлінг."

vulpes_will_help_us_during_our_campaign_tt:0 "§R[CES.GetFlag] Вулпес допомагатиме нашій кампанії! Час від часу він надаватиме нові схеми, щоб наблизити перемогу.§!"
vulpes_will_not_help_us_tt:0 "§g[CES.GetFlag] Вулпес не втручатиметься. Ми впораємось самі.§!"

nf_lanius_vulpes_scheme.2.t:0 "Прохід має здригнутись"
nf_lanius_vulpes_scheme.2.d:0 "Гірські племена мають довгу пам’ять — і слабкий хребет. Коли Паулюс проходив через ці землі, вони не чинили опору. Вулпес радить влаштувати показ сили: спалити поселення, поширити чутки, посіяти страх.\n\nНехай вогонь буде видно здалеку, — каже він. — Нехай вони згадають, чому бояться Бика."
nf_lanius_vulpes_scheme.2.tt:0 "§RСерйозно ослабить війська [MES.GetAdjectiveCap] у цьому регіоні!§!"
nf_lanius_vulpes_scheme.2.a:0 "§RНехай вогонь горить.§!"
nf_lanius_vulpes_scheme.2.b:0 "§gМасові вбивства — марна справа.§!"

nf_lanius_vulpes_scheme.3.t:0 "Залізна угода"
nf_lanius_vulpes_scheme.3.d:0 "Ходять чутки про таємну угоду між Залізним Альянсом та нашими агентами — залізо в обмін на денарії, креслення в обмін на мовчання. Вулпес пропонує зробити цей союз офіційним. Його фрументарії вирушать до Нью-Стерлінга з монетами, обіцянками і примарою майбутньої слави.\n\nЯкщо їх можна купити — ми купимо. Якщо ні — дізнаємось, як вони кують свою зброю."
nf_lanius_vulpes_scheme.3.a:0 "§RНадіслати фрументаріїв на північ.§!"
nf_lanius_vulpes_scheme.3.b:0 "§gМи не потребуємо їх.§!"

nf_lanius_vulpes_scheme.4.t:0 "Зникнення Лиса"
nf_lanius_vulpes_scheme.4.d:0 "Фрументарії зникли за горизонтом, повертаючись у Флагстафф. Серед лоялістів Ланія — тривога: дехто вважає, що Вулпес ніколи не допомагав нам, а лише шпигував за нашими сусідами в Новому Мексиці.\n\nЧи справді він союзник... чи тримає Ланія на повідку?"
nf_lanius_vulpes_scheme.4.a:0 "Нехай блукає."

nf_lanius_vulpes_scheme.5.t:0 "Наближається монстр"
nf_lanius_vulpes_scheme.5.d:0 "Вони прийшли з пилу — фрументарії Вулпеса Інкульти, очі та вуха Цезаря. Зі словами м’якими, усмішками гострими, вони проголосили: Ланій іде на Денвер.\n\nВони згадують провал Паулюса і жагу Ланія до перемоги. Легіон, мовляв, пам’ятає таємну торгівлю із Залізними. Тепер настав час відкрито скріпити зв’язок. Коли Червоний Бик рушить на північ — чи буде Залізний Альянс поруч?"
nf_lanius_vulpes_scheme.5.a:0 "§RМи підемо на війну.§!"
nf_lanius_vulpes_scheme.5.b:0 "§gНехай Бик марширує сам.§!"
nf_lanius_vulpes_scheme.5.tt:0 "Відкриває рішення для участі у війнах §YЛанія§!, якщо він атакує північні держави Колорадо."

nf_lanius_vulpes_scheme.6.t:0 "Залізо приєднується до Бика"
nf_lanius_vulpes_scheme.6.d:0 "Залізний Альянс погодився підтримати нашу кампанію. Їхні кузні розпалюються, а найманці крокують пліч-о-пліч з легіонерами, коли Денвер впаде."
nf_lanius_vulpes_scheme.6.a:0 "Нехай полум’я палає."

nf_lanius_vulpes_scheme.7.t:0 "Кузня відмовляється"
nf_lanius_vulpes_scheme.7.d:0 "Нью-Стерлінг відмовився. Кулеметожер не прийняв нашої пропозиції. Кузні Колорадо не працюватимуть на Цезаря — принаймні поки що."
nf_lanius_vulpes_scheme.7.a:0 "Хай буде так."

   #nf_lanius.34.t:0 "The conquest of the Painted Rock"
   #nf_lanius.34.d:0 "After the defeat of the metal men we are left with the challenge of dealing with their allies. These so called Hummingbirds have openly declared hostility on us and must be dealt with before we can march north to deal with Dog City, but they cannot be reached. Lanius has ordered for the Painted Rock tribe to be integrated into his cohort so that they may be used to attack the weaklings."
   #nf_lanius.34.a:0 "And the Cohort grows stronger."

  # Події завоювань Легіону
  lac_conquest_events.1.t:0 "Перемога Легіону!"
  lac_conquest_events.1.d:0 "Ще один народ Сходу впав перед Легіоном. Їхні вдови й чоловіки ридають, поки рабські нашийники затягуються на шиях, а Ланій дивиться байдуже. Уже його погляд спрямовано в обрій — до нових світів для підкорення."
  lac_conquest_events.1.a:0 "Призовемо кількох із них."
  lac_conquest_events.1.b:0 "Призовемо помірну кількість."
  lac_conquest_events.1.c:0 "Призовемо всіх, а решту — спалимо."

  lac_conquest_events.2.t:0 "Свіжа партія рабів"
  lac_conquest_events.2.d:0 "Через наші завоювання профані навчаться цінності праці й служіння. А Ланій, можливо, залишить собі найкращих."
  lac_conquest_events.2.a:0 "Візьмемо лише кількох."
  lac_conquest_events.2.b:0 "Поневолимо всіх, хто чинив опір."
  lac_conquest_events.2.c:0 "Вони не заслуговують на свободу."

  lac_conquest_events.3.t:0 "Пограбування"
  lac_conquest_events.3.d:0 "Легіонери не беруть здобич для себе. Вони беруть її для Цезаря. Скільки ж узяти як трофеїв війни?"
  lac_conquest_events.3.a:0 "Цезар — справедливий володар."
  lac_conquest_events.3.b:0 "Не можна здирати шкуру з брахміна, якого ми доїмо."
  lac_conquest_events.3.c:0 "Горе переможеним."

  lac_conquest_events.4.t:0 "Пустеля чи мир?"
  lac_conquest_events.4.d:0 "Ані Ланій, ані Цезар не бажають правити пусткою. Легіон врятує людство, сформувавши новий світ із попелу старого. Ми можемо приєднати ворогів до своїх лав. Або — прибити їх до хрестів."
  lac_conquest_events.4.a:0 "Принесіть деревину."
  lac_conquest_events.4.b:0 "Легіон вітає вас."

  lac_conquest_events.5.t:0 "На хресті"
  lac_conquest_events.5.d:0 "Оскільки ми вирішили розпинати ворогів, слід обрати, скільки саме. Деякі Пустельники можуть злякатись, але так ми вчимо світ слухатись Легіону."
  lac_conquest_events.5.a:0 "Розіпніть кількох командирів для прикладу."
  lac_conquest_events.5.b:0 "Розіпніть половину офіцерського складу."
  lac_conquest_events.5.c:0 "Розіпніть і їхні родини."

  lac_conquest_events.6.t:0 "Служити Легіону"
  lac_conquest_events.6.d:0 "Ланій не перший, хто присягнув Цезарю. Дехто з ворогів воював гідно. Тепер вони можуть служити Ланію, як Ланій служить Цезарю."
  lac_conquest_events.6.a:0 "Розіпніть кількох командирів для прикладу."
  lac_conquest_events.6.b:0 "Розіпніть половину офіцерського складу."
  lac_conquest_events.6.c:0 "Розіпніть і їхні родини."

  # Повстанський цикл Ланія
  nf_lanius_revolter.1.t:0 "Місяць дивився на мене"
  
  nf_lanius_revolter.2.t:0 "Місяць дивився на мене"
  nf_lanius_revolter.2.d:0 "Коли світло засяяло з усіх боків, Ланій поставав перед досконалою істотою. Фігурою тріумфу, жалю і любові. Це була Перемога. \n\n§B– Ох, Аполло? Нарешті.§! — сказала вона. §RАле це ж не твоє ім’я.§!\n\nСвітло змушувало його говорити — виправдовуватись не їй, а йому. Йому, що ховався за нею, за її обличчям і голосом...\n\n§B– Ти відволікся, мій герой. Скажи мені своє ім’я. Лише це й потрібно.§!"
  nf_lanius_revolter.2.a:0 "Боротись із навіюванням!"
  nf_lanius_revolter.2.b:0 "§RНАЗВИ ЇЙ СВОЄ ІМ’Я§!"

  nf_lanius_revolter.3.t:0 "Відкидання світла"
  nf_lanius_revolter.3.d:0 "Ланій розпізнав обманщика. Ця Діана — можливо, богиня, але світло, машини, дроти? Вони зіпсували її, як зіпсували інших. Після кривавого бою в храмі—що виявився старим Сховищем—він зумів вирватись."
  nf_lanius_revolter.3.a:0 "А чи була вона богинею взагалі?"
  nf_lanius_revolter.3.b:0 "Навіть якщо була — її слід зупинити!"

  nf_lanius_revolter.4.t:0 "Дивне відчуття"
  nf_lanius_revolter.4.d:0 "Повертаючись до табору, Ланій відчував спустошення. Солдати дивилися мовчки. Чи знають вони, що трапилось у тому бункері? Він сам — не знає. Але знає одне: він має подумати. Подумати про себе. І згадати —\n\nХто він?"
  nf_lanius_revolter.4.a:0 "Що ж...\nЯк мене звати?"

  nf_lanius_revolter.5.t:0 "Розчаровані допоміжні сили повертаються додому"
  nf_lanius_revolter.5.d:0 "Минуло кілька днів, а ця тінь не відступає. Чому я слухаю Цезаря? Навіщо мені хтось, якщо я — сильний? Я сам собі Легіон."
  nf_lanius_revolter.5.a:0 "Можливо, настав час нового легата."

  nf_lanius_revolter.5.t.ttm:0 "Витівки ЗАКС-29"
  nf_lanius_revolter.5.d.ttm:0 "Причину дивної поведінки Ланія швидко виявили: головний інтелект Сховища 29 — ЗАКС-29 — втрутився, використовуючи особистісне кодування, щоб викликати в нього кризу ідентичності. Діана розлютилась — але ЗАКС заявив, що це був найбезпечніший шлях для мешканців Сховища."
  nf_lanius_revolter.5.a.ttm:0 "Я не просив тебе це робити!"

  nf_lanius_revolter.6.t:0 "Зростаюча тривога"
  nf_lanius_revolter.6.d:0 "Було дивне відчуття — вийти з того комплексу і повернутись до табору. Солдати дивилися з підозрою, ніби очікували, що я накажу знищити те місце.\n\nКуди ж я подівся? Вони знають, що щось сталося, але бояться говорити вголос.\n\nХай ідуть. Якщо не бажають служити в моєму когорті — хай служать Цезарю.\n\nМені потрібно з'ясувати, що зі мною сталося в тому комплексі."
  nf_lanius_revolter.6.a:0 "Я сам собі володар."

  nf_lanius_revolter.7.t.lac:0 "Повернення до світла"
  nf_lanius_revolter.7.d.lac:0 "Зрештою я не витримав. Голоси в моїй голові посилювались. Я наказав решті своєї когорти повернутися на північ — зустрітися з тим плем’ям ще раз.\n\nКоли я знову опинився в долині Близнючок Матерів, мене зустріли, як героя. Оркестри, крики радості, свято. Ціле плем'я славило мене... Але за що?\n\n§R«Безіменний воїн повернувся! Чи готовий ти прийняти своє істинне ім’я й здобути місце в історії? Відмовся від рабства Цезаря. Перейди через Ріо-Ґранде, переможи Цезаря та побудуй спадщину на тисячу років. Аполло, ми даруємо тобі це!»§!"
  nf_lanius_revolter.7.a.lac:0 "§R...Моє ім’я!§!"

  nf_lanius_revolter.7.t.ttm:0 "Коронаційне свято"
  nf_lanius_revolter.7.d.ttm:0 "Це не та ситуація, яку я хотіла — але я не можу її відкинути.\n\nТак, ЗАКС-29 зробив щось огидне — відібрав особистість. Але якщо це допоможе знищити тиранію Цезаря? Можливо, воно того варте.\n\nМоже, трошки свят допоможуть розставити все на свої місця. Ланій прибуває сьогодні ввечері, щоб прийняти свою нову роль. Плем'я хоче назвати все це «Культ Аполлона».\n\nМожливо, з новим союзом ми зможемо принести надію пустці."
  nf_lanius_revolter.7.a.ttm:0 "...Можна мені трохи вина в мозковий чіп?"

  nf_lanius_revolter.8.t:0 "Ланій зраджує Цезаря! Приймає нове ім’я!"
  nf_lanius_revolter.8.d:0 "У шокуючому повороті подій, легендарний легат Ланій і його війська пішли проти Цезаря. Він вірить, що зможе об’єднати Пустку краще. Чи він божевільний?"
  nf_lanius_revolter.8.t.ces:0 "Наш легат уклав союз із профанами!"
  nf_lanius_revolter.8.t.ttm_lac:0 "Новий культ Аполлона"

  nf_lanius_revolter.20.t:0 "Той, хто говорить із псами"
  nf_lanius_revolter.20.d:0 "Завданням Ланія було підкорити Хангдогів і Денвер. Але чи не краще запропонувати союз? Пси хоч і не говорять, та вміють слухати."
  nf_lanius_revolter.20.a:0 "Корисний буфер на півночі."
  nf_lanius_revolter.20.b:0 "Легіон не приймає бродяг."

  nf_lanius_revolter.21.t:0 "Перша жертва Цезаря"
  nf_lanius_revolter.21.d:0 "Геката і Улісс — серед небагатьох, хто пережив Твістед Хейрс. Він приєднався до Легіону, вона — втекла до Півночі. Але тепер, коли Легіон знищено, може, вона знайде спокій?"
  nf_lanius_revolter.21.a:0 "Скорбота зведе тебе з розуму, Гекато..."
  nf_lanius_revolter.21.b:0 "Не варто мати справу з відьмою."

  nf_lanius_revolter.211.t:0 "Привіт, мамо"
  nf_lanius_revolter.211.d:0 "Ланій і Діана перемогли Легіон, але тепер хочуть працювати зі мною. Що робити Дочкам Гекати далі?"
  nf_lanius_revolter.211.a:0 "Скорбота зведе тебе з розуму, Гекато..."

  nf_lanius_revolter.30.t:0 "Грабунок Флагстаффа"
  nf_lanius_revolter.30.d:0 "Люди Ланія три дні грабували Флагстафф — за звичаєм. Але що лишилось? Ні багатства Санта-Фе, ні парфумів з Лоун Стара. Якщо імперії судять за спадщиною — Легіон був безплідним кінцем."
  nf_lanius_revolter.30.a:0 "На створення Легіону пішло життя, на знищення — година."

  nf_lanius_revolter.31.t:0 "Погляд на Захід"
  nf_lanius_revolter.31.d:0 "Чи жалкував Цезар, що пішов дорогою до Коу? Чи думав, що Послідовники мали рацію? Ланія це ніколи не цікавило."
  nf_lanius_revolter.31.a:0 "Нехай сам напише свою історію."

  nf_lanius_revolter.32.t:0 "Острів під сонцем"
  nf_lanius_revolter.32.d:0 "Ескорт Легіону доставив свого старого бога на схід, на маянське судно. Там, у Гавані, він став почесним гостем. Що може бути кращим завершенням — ніж у кольорі крові, який він так любив?"
  nf_lanius_revolter.32.a:0 "Спалімо прапор і почнімо заново."

  nf_lanius_revolter.33.t:0 "Неймовірний союз"
  nf_lanius_revolter.33.d:0 "Ніхто не очікував цього: Легіонер, права рука Цезаря, зрадив його й приєднався до Діани. Тепер Легіон має ворогів і на сході, і на заході."
  nf_lanius_revolter.33.a:0 "Може, не варто було посилати на схід того, хто поважає лише силу."

  nf_lanius_revolter.34.t:0 "І земля заговорить до тебе"
  nf_lanius_revolter.34.d:0 "Ми працювали з Цезарем як із меншим злом. Але тепер приходить запрошення від Ланія й Діани. Повстати разом. Ми отримали багато — але чи хочемо ми залишатися рабами померлої імперії?"
  nf_lanius_revolter.34.a:0 "Кам’яний виноградник потребує не молитви, а кайла."

  nf_lanius_revolter.35.t:0 "Навахо сказали ні."
  nf_lanius_revolter.35.d:0 "Попри наші зусилля, навахо відмовились приєднатись до повстання. Вони вірять, що Цезар дасть їм кращу долю? Хай буде. Дехто з їхніх воїнів приєднався самостійно."
  nf_lanius_revolter.35.a:0 "Очевидно, вони приречені."

  nf_lanius_revolter.36.t:0 "Гордіїв вузол"
  nf_lanius_revolter.36.d:0 "Хоча Діана переконала Ланія, що знищення його народу Цезарем не є ознакою сили, він усе ще прагне створити імперію. І для цього його погляд звертається на главу Мексона. Перемога над відгалуженням Братства Сталі була б потужним символом, але й коштовним — це виснажить Схід перед вирішальним наступом на Цезаря.\n\nДіана пропонує інший шлях. Чому б не укласти союз із Братством? Цезар завинив їм кров за знищення Фініксівського загону. В обмін на землі вздовж Арканзасу вони можуть допомогти нам у війні. Замість кровопролиття — об’єднана армія."
  nf_lanius_revolter.36.a:0 "Навіщо мені найманці в силовій броні?"
  nf_lanius_revolter.36.b:0 "У твоїх словах є мудрість, жінко зі Сходу."

  nf_lanius_revolter.37.t:0 "Пропозиція племінника"
  nf_lanius_revolter.37.d:0 "Східний легат Ланій повстав проти Цезаря, але, всупереч очікуванням, не прийшов до нас з війною. Він пропонує союз — у боротьбі проти Цезаря. В обмін ми отримаємо землі в Колорадо. Це не наш бій — але Цезар убив наших братів в Арізоні. А ресурси Арканзасу... дуже корисні.\n\nМожемо, звісно, відмовити. Але чи варто ставати ворогом Ланія?"
  nf_lanius_revolter.37.a:0 "Ми приймаємо твої умови, Легате."
  nf_lanius_revolter.37.a_tt: "\nЯкщо почнеться війна між §R[CES.GetName]§! і §B[LAC.GetName]§!, ми долучимось до Східного заколоту."
  nf_lanius_revolter.37.b:0 "Навіщо вмирати за Флагстафф?"

  nf_lanius_revolter.38.t:0 "Гордіїв вузол"
  nf_lanius_revolter.38.d:0 "Лідерство Ланія — це не лише сила, а й розум. Як легат він би не говорив із Братством. Але як Принцепс — так. І тепер Мексон приєднався до війни проти Легіону. Не всі вузли ріжуться мечем."
  nf_lanius_revolter.38.a:0 "Страх і союз — найкращі колеса для колісниці."

  nf_lanius_revolter.39.t:0 "Гордіїв вузол"
  nf_lanius_revolter.39.d:0 "Як і передбачалося, Мексон відмовився. Що ж, це буде добрим випробуванням для наших військ."
  nf_lanius_revolter.39.a:0 "Простіше всього — розрубати."

  nf_lanius_revolter.40.t:0 "Зрада Хайдбарків"
  nf_lanius_revolter.40.d:0 "Великий Цезаре, Ланій зрадив нас! Східна експедиція підняла повстання й утворила союз із Відьмою з Колорадо! Їхня мета — забрати Арізону собі. Ми зв’язані війною на заході, але за два роки — йдемо на схід."
  nf_lanius_revolter.40.a:0 "Я волочу його тіло за своєю колісницею."

  nf_lanius_revolter.41.t:0 "Візит від Гастсеолтої"
  nf_lanius_revolter.41.d:0 "Ми давно чули легенди про Мисливицю — машину-ведунку, що живе на сході. Тепер її роботи принесли нам пропозицію: Ланій повстав, і вона просить приєднатися. Разом ми маємо шанс."
  nf_lanius_revolter.41.a:0 "Чули ми й гірші ідеї."
  nf_lanius_revolter.41.b:0 "Ми не воюємо пліч-о-пліч з машинами й диктаторами."

  nf_lanius_revolter.42.t:0 "Навахо погодились"
  nf_lanius_revolter.42.d:0 "Завдяки Діані, навахо приєдналися до повстання. Разом — ми маємо шанс."
  nf_lanius_revolter.42.a:0 "Кам’яний виноградник не потребує молитви, а кайла."

  nf_lanius_revolter.43.t:0 "Навахо відмовились"
  nf_lanius_revolter.43.d:0 "Схоже, що [NAV.GetLeader] виявився більшим боягузом, ніж ми думали. Вони не приєднаються."
  nf_lanius_revolter.43.a:0 "Найгучніша мова — це шурхіт хвоста гремучої змії."

  #### Ідеї

  lac_engineers:0 "Fiat Voluntas Tua" # "Нехай буде воля твоя" — залишено латинське формулювання для стилю
