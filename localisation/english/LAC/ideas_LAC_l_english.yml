l_english:
  lanius_caesars_warden: "Тюремник Цезаря"

  lac_mustering_cohort:0 "Скликання Когорти"
  lac_mustering_cohort_desc:0 "Когорта Ланійа ще в зародку — лише одне підкорене плем’я та обмаль ресурсів. Хоча початок багатообіцяючий, його експедиція на Схід повинна здобути більше досвіду й краще розуміти місцевість, перш ніж реалізує свій потенціал."

  lac_the_conquering_frontier:0 "Завойовницький Фронтир"
  lac_the_conquering_frontier_desc:0 "Легіон послав Ланійа розширювати володіння Бика, і його війська маршем ідуть від міста до міста, завойовуючи все на шляху: §Rпередвістя загибелі Сходу.§!"

  lac_blank_slate:0 "Чиста Дошка"
  lac_blank_slate_desc:0 "Цезар забороняє надмірне використання технологій Старого Світу, дозволяючи це лише обраним, що довели свою відданість у бою. §gХоча автократична структура Легіону суворо обмежує відступи від цієї догми, тут, на фронтирі, межі починають розмиватись.§!"

  lac_cult_of_mars_idea:0 "Культ Марса"
  lac_cult_of_mars_idea_desc:0 "Цезар — син Марса: це незаперечна істина для армій Легіону. Але навіть у наших лавах є ті, хто богохульствує. Вони твердять, що Цезар — не напівбог, а просто людина. Що бог Війни не заборонив би зброю чи ліки, що рятують життя воїнів.\n\n§OІ на землях Когорти Ланійа, далеко від трону Флагстаффа, їхнє коріння проростає...§!"

  lac_cohort_of_east:0 "Когорта Сходу"

  lac_brotherhood_slaves:0 "Раби Братства"
  lac_cohort_of_east_2:0 "Східний Легіон"

  lac_loot_from_theeast_1:0 "Здобич зі Сходу"
  lac_loot_from_theeast_1_desc:0 "Хоча Східна експедиція лише почалась, Ланій уже надсилає нам данину."

  lac_loot_from_theeast_2:0 "Тріумф у Нью-Мексико"
  lac_loot_from_theeast_2_desc:0 "Ланій здобув багатства Нью-Мексико для Легіону, і весь край блищить перед нами."

  lac_loot_from_theeast_3:0 "Завоювання Колорадо"
  lac_loot_from_theeast_3_desc:0 "Ланій приніс наш прапор у Місто Псів. Тепер ніхто не зможе йому протистояти."

  national_spirit_tribal_warfare:0 "Володар Племен"
  national_spirit_tribal_warfare1:0 "Плем'я Племен"

  lac_cohort_of_east_3:0 "Володарі Сходу"
  lac_loot_from_theeast_4:0 "Техаська Данина"
  lac_came_west:0 "М’ясник Уже Тут"
  lac_plunder_goes_east:0 "Данина Ланійу"
  lac_damn_were_awesome:0 "Данина від [CES.GetLeader]"
  lanius_spy_agency:0 "Фрументарії"
  legion_nf_shottol_god_of_dogs:0 "Сядь, Пес"

  lac_steel_army:0 "Сталеве Військо"
  lac_thunder_army:0 "Громове Військо"
  lac_survivors_army:0 "Військо Виживших"

  lac_legacy_of_pallus:0 "Спадок Центуріона Паулюса"
  lac_legacy_of_pallus_desc:0 "М’ясник, Зрадник, Монстр — так називали Нью-Мексико за його часів в Аризоні. «Божевільний» Центуріон провів набіги по багатьох поселеннях, готуючи своє військо до атаки на Глорію. Навіть зараз інфраструктура Нью-Мексико не оговталася після його дій."

  lac_research_faster:0 "Давня Мудрість"

  lac_decimation_1:0 "Воєнна Здобич"
  lac_decimation_2:0 "Воєнна Здобич"
  lac_decimation_3:0 "Воєнна Здобич"

  lac_crucify_1:0 "Малі Розп’яття"
  lac_crucify_2:0 "Помірні Розп’яття"
  lac_crucify_3:0 "Криваві Розп’яття"

  lac_recruit_1:0 "Перебіжчики"
  lac_recruit_1_desc:0 "Ми завербували ворожого командира, що викликало незадоволення серед легіонерів."
  lac_recruit_2:0 "Перебіжчики"
  lac_recruit_2_desc:0 "Ми завербували ворожих солдатів і командира, чим викликали серйозне обурення серед легіонерів."
  lac_recruit_3:0 "Перебіжчики"
  lac_recruit_3_desc:0 "Ми прийняли до війська солдатів і командирів ворога. Це глибоко розлютило наш легіон."

  lac_basking_in_glory:0 "У Променях Слави"
  lac_basking_in_glory_desc:0 "Veni, Vidi, Vici. Ланій сяє яскравіше за сонце."

  lac_legacy_of_the_populares:0 "Спадщина Популярів"
  lac_legacy_of_the_populares_2:0 "Спадщина Популярів"
  lac_legacy_of_the_freeman:0 "Спадщина Вільних Людей"
  lac_promise_land_rights:0 "Права на Землю"
  lac_promise_land_rights_desc:0 "Ось моя обіцянка всім, хто служить мені: мир, земля і хліб."

  lac_decimation:0 "Децімація"
  lac_decimation_desc:0 "Мав би я сто язиків, сто уст,\nІ горло з латуні, легені з заліза —\nЯ не зміг би перелічить всі злочини,\nАні кари, що за них належна."

  lac_army_testudo:0 "Формація Тестудо"
  lac_army_quincunx:0 "Квінкункс"
  lac_army_velites:0 "Веліти"
  lac_army_hastati:0 "Лінія Гастатів"
  lac_army_liberti:0 "Вільні"
  lac_army_speculatores:0 "Спекулятори"

  lac_cura_annonae:0 "Cura Annonae"
  lac_cura_annonae_desc:0 "Коли землю охопив голод, а податки зникли, я відкрив легіонські комори та нагодував народ з власного майна."

  lac_edict_of_caracalla:0 "Едикт Росвелла"
  lac_edict_of_caracalla_desc:0 "Якщо я вірю, що доля спрямовується богами, то маю дякувати їм за віру в мене. Тож нехай усі, хто служив зі мною, стануть громадянами Легіону. Хіба не справедливо поділитись славою зі всіма?"

  lac_set_an_example:0 "Показати Приклад"
  lac_set_an_example_desc:0 "Коли говориш про милість — подумай не про те, що заслуговують вороги, а що я готовий дати."

  lac_sol_castra:0 "Сол Кастра"
  lac_sol_castra_desc:0 ""

  lac_paying_off_veterans:0 "Розплата Ветеранам"

  lac_beast_of_the_east:0 "Звір Сходу"
  lac_beast_of_the_east_desc:0 "На землях Ланійа — порядок. Жорсткий, але порядок. Багато тікають від страху перед його прапором. Але кожен утікач — це ще один профлігат, якому не доведеться нав’язувати цивілізацію."

  lac_eastern_praetorians:0 "Східні Преторіанці"
  lac_pride_through_purpose:0 "Гордість Через Призначення"