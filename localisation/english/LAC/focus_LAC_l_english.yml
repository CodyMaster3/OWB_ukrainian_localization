l_english:
 #-------------------------------------
 # Lanius
 #-------------------------------------
  on_select_remove_mission_lac:0 "При виборі фокуса: Скасувати місію «Крайній термін Ланія»"
  lac_revolter_focus_tree:0 "Фокусне дерево «Res Publica»"
  lac_the_cohorts_legate:0 "Чемпіон Марса"
  lac_the_cohorts_legate_desc:0 "Цезар дав Ланію завдання.\nВін не мав наміру зазнати поразки."
  lac_the_legates_cohort:0 "Когорта Легіата"
  lac_the_legates_cohort_desc:0 "Ці люди підуть за Ланієм і будуть перековані у вогні Колорадо... або загинуть."
  lac_conquering_lambda:0 "Плем'я Лямбда"
  lac_conquering_lambda_desc:0 "Щоб один піднявся — інший має впасти."
  lac_attack_the_archdiocese:0 "Dies Irae"
  lac_attack_the_archdiocese_desc:0 "Монахи Санта-Фе читають свої гімни мертвому богу з мертвого світу. Навіщо нам їхні псалми?"
  lac_march_on_mescalero:0 "Атака на Апачів"
  lac_march_on_mescalero_desc:0 "Президент Мескалеро вважає себе справжнім вождем.\nМи покажемо їй, що таке справжня сила."
  ces_earth_defense_force:0 "Зірвати Троянду"
  ces_earth_defense_force_desc:0 "Люди Розвелла думають, що можуть приховати свої таємниці.\nНіхто не сховається від погляду Марса."
  ces_executives:0 "Дикі з Сховища"
  ces_executives_desc:0 "Виконавці хизуються металевою бронею та бункерами. Але ми бачили їхній символ на руїнах.\nСлабкі чіпляються за минуле."
  lac_fate_ofarchdiochese:0 "Доля монахів"
  lac_fate_ofarchdiochese_desc:0 "Монахи сиділи біля ріки Пекос та ридали. Але їхня доля була не в рабстві..."
  archdiociese_humbled:0 "Смирення священників"
  ces_executives_2:0 "Раби Виконавців"
  ces_executives_2_desc:0 "Виконавці програли армії Марса. Зараз їхнє населення — це наші раби."
  executives_2_flag:0 "Раби Виконавців"
  ces_earth_defense_force2:0 "Розвелл Припинив Існування"
  ces_earth_defense_force2_desc:0 "Культ пав, і хоча його залишки пророкують кінець світу, Ланій — готовий. Можливо, варто використати їхнє обладнання."
  ces_earth_defense_force2_flag:0 "Справи Z"
  lac_march_on_mescalero2:0 "Доля Мескалеро"
  lac_march_on_mescalero2_desc:0 "Мескалеро пережили іспанців, техасців, американців і Велику Війну. Але не пережили Ланія."
  mescalero2_flag:0 "Зломлені Мескалеро"
  lac_conquest_of_new_mexico:0 "Сьогодні — Нью-Мексико..."
  lac_conquest_of_new_mexico_desc:0 "[LAC.GetLeader] майже вдвічі збільшив розмір Легіону. Потік данини до Флагстаффа не припиняється. А безпристрасна маска дивиться на нові завоювання."
  lac_pushing_for_colorado_desc_tt:0 "Отримаєте §Y-50%§! до вартості інтеграції штатів у Колорадо. Але спершу треба їх підкорити!"
  lac_move_for_texas:0 "Забрати Техас"
  lac_move_for_texas_desc:0 "Колорадо — захищений горами. Але рівнини ведуть у Техас. Коли ми посадимо прапор бика в море — усі дізнаються, хто править Пусткою."
  lac_move_for_texas_tt:0 "§gЧерез систематичне розп’яття опозиціонерів ми знищимо їхній спротив та зміцнимо свою владу.\n\nЗменшує §Yвартість інтеграції§! штатів Техасу на §G30%§!§!"
  lac_weapons_of_kings:0 "Зброя Королів"
  lac_weapons_of_kings_desc:0 "Виконавці не мали вмінь, але їхня зброя вражає. А апачі — терор для сусідів століттями. Тепер — вони наші."
  ces_ranching_new_mexico:0 "Прогодувати Когорту"
  ces_ranching_new_mexico_desc:0 "Маючи контроль над ресурсами Нью-Мексико, [LAC.GetLeader] зможе задіяти рабів у відновленні дамб і зрошення."
  lac_lessons_hidebarks:0 "Пам’ять про Хайдбарків"
  lac_lessons_hidebarks_desc:0 "Хайдбарки були одним з найбільших викликів Цезаря в Аризоні. Ланій може запозичити деякі їхні традиції."
  ces_markets_open:0 "Відновлення ринку"
  ces_markets_open_desc:0 "[5.GetName] колись був процвітаючим містом на березі Ріо-Гранде. І стане ним знову під правосуддям Легіону."
  LAC_more_tribal_stuff:0 "Шляхи Легіону"
  LAC_more_tribal_stuff_desc:0 "Ланій поєднує лють племен із вмінням цивілізацій. Підготуємося."
  lac_block_out_sun:0 "Скинемо Сонце!"
  lac_block_out_sun_desc:0 "[SUN.GetNameWithFlag] стоїть на нашому шляху. Навіть сонце — лише віддзеркалення слави Легіону!"
  lac_no_smooching:0 "Наркотики профіглатів"
  lac_no_smooching_desc:0 "Кожна пустка має свою отруту. У Колорадо — це смуч. Суміш байдужості й екстазу, що вбиває дух. Почнемо з розп’яття торговців."
  lac_pushing_for_colorado:0 "Хибна Богиня"
  lac_pushing_for_colorado_desc:0 "Матері-Близнючки — просто чергове плем’я профіглатів. Їхня віра — не в крові, а в ідолах. Ми навчимо їх інакше."
  lac_nav_ttm_demil_tt:0 "Цей фокус демілітаризує кордон між навахо та Матерями-Близнючками."
  lac_ttm_giggity:0 "Розпорошити плем’я"
  lac_ttm_giggity_desc:0 "Матері-Близнючки не підкоряться після втрати своєї богині. Розпорошимо їх рабами по Легіону."
  lac_ttm_giggity_flag:0 "Останній урок Діани"
  lac_teaching_the_final_lesson:0 "Останній Урок Матерів"
  lac_teaching_the_final_lesson_desc:0 "\"Сподівайся не на богів, а на власну кров.\""
  lac_lumber_mills:0 "Лісопильні"
  lac_lumber_mills_desc:0 "Ліси Північної Мексики — джерело деревини. Використаймо рабів для їх розробки."
  lac_training_grounds:0 "Тренувальні полігони"
  lac_training_grounds_desc:0 "Ланій бачить слабкість навіть у своїй армії. Підготуємо новобранців за найвищими стандартами."
  lac_slave_workshops:0 "Servi Caminorum"
  lac_slave_workshops_desc:0 "Навіть ті, хто не здатен воювати, мають свою користь. Дехто з них — виживе."
  LAC_guns_of_fate:0 "Зброя Долі"
  LAC_guns_of_fate_desc:0 "Забрати життя — один із найсильніших актів, доступних людині. Його не слід вчиняти легковажно — без розуміння наслідків перемоги."
  lac_bsu:0 "Прийдешні Сутінки"
  lac_bsu_desc:0 "Дні Сонячних Псів добігли кінця. Але Ланій запалить новий факел цивілізації — набагато буквальніше, ніж вони очікували."
  lac_painted_rock:0 "Червоні Оклахомці"
  lac_painted_rock_desc:0 "Наше завдання — підкорити Місто Псів, а не всю Оклахому.\nОднак група воїнів з Оклахоми зацікавилась нашим Легіоном — і хоче приєднатись!"
  lac_red_oakies_tt:0 "Деякі дивізії Розмальованої Скелі приєднаються до наших лав!"
  lac_painted_rock2:0 "Перемога на Скелі"
  lac_painted_rock2_desc:0 "Пофарбований-Кров'ю виправдав своє ім’я — його народ майже знищено. Але вони билися гідно, й їх славетна битва принесла славу Легіону. Хай решта Оклахоми тремтить, а ми знайдемо їм застосування."
  lac_maxson_must_die:0 "Кінець Братству"
  lac_maxson_must_die_desc:0 "Братство розповзається пусткою, як паразити. Вони лише збирають технології — не мріють, не творять. Їхнє призначення очевидне: померти заради нашої слави."
  lac_lessons_from_the_east:0 "Уроки зі Сходу"
  lac_lessons_from_the_east_desc:0 "Ланій привів експедицію й вирізав нову імперію. [ROOT.Capital.GetName] процвітає, а хоругви повалених племен прикрашають зали Легіону. Але серед народів Сходу є чому навчитись."
  lac_maxson_did_die:0 "Закриття Розділу"
  lac_maxson_did_die_desc:0 "Знищивши Капітул Максона, пора дізнатись, чи було в них щось цінне."
  maxson_died_flag:0 "Писарі Братства"
  LAC_needs_must:0 "Мати Винаходу"
  LAC_needs_must_desc:0 "[lanius_needs_focus_desc]"
  lac_needs_desc_normal:0 "Хоча Легіон відкидає залежність від технологій, Когорті доводиться йти на поступки на фронтирі."
  lac_needs_desc_eastern_legion:0 "Цезар відкидав залежність від технологій, але Схід змушений пристосовуватись до реалій пустки."
  LAC_legion_training:0 "Радники Легіону"
  LAC_legion_training_desc:0 "Хоча ми частина Легіону, нам не завадить більше інструкцій із Флагстаффа. Ми ж не хочемо, щоб наші нові піддані зіпсували наші доктрини?"
  LAC_tribal_mastery:0 "Племінна Війна"
  LAC_tribal_mastery_desc:0 "Схід вимагає інших тактик, ніж похід Цезаря на Нью-Вегас. На щастя, Ланій — майстер бойових мистецтв."
  LAC_coal_mines:0 "Відкрити Вугільні Шахти"
  LAC_coal_mines_desc:0 "Шахти Нью-Мексико стояли порожні з часів Великої Війни. Але Легіон має силу, щоб їх відновити."
  lac_lessons_from_younger_brother:0 "Уроки від Сестри"
  lac_lessons_from_younger_brother_desc:0 "Капітул Максона показав більше мужності, ніж ми очікували. Багатьма ворогами Ланія керували жінки — і билися вони не гірше чоловіків. Можливо, Цезар помилявся?"
  lac_winter_is_coming:0 "Зміна Пір Року"
  lac_winter_is_coming_desc:0 "[SUF.GetLeader] збудував хитку спільноту у Форт Саммерс. Без її завоювання постачання на північ неможливе!"
  lac_towards_denver:0 "До Міста Псів"
  lac_towards_denver_desc:0 "Головний приз у Колорадо — Місто Псів. Але спершу — [SCO.GetName]."
  lac_city_forms:0 "Формування Міста"
  lac_city_forms_desc:0 "Наш форпост росте під наглядом Легіону. Торговці з усієї Пустки їдуть сюди. Ланій наказав збудувати форум для торгівлі."
  lac_building_up_for_hangdogs:0 "Підготовка до Північного Походу"
  lac_building_up_for_hangdogs_desc:0 "Hangdogs — на краю світу. Потрібна підготовка. Але ми прийдемо."
  lac_building_up_for_hangdogs_tt:0 "Надає §G1§! рівень §Yінфраструктури§! в кожному контрольованому штаті Колорадо."
  lac_hang_the_dogs:0 "До Міста Псів"
  lac_hang_the_dogs_desc:0 "Hangdogs шанують псів як святих. Місто Псів — багате на старі скарби. Ми заберемо його!"
  lac_brought_to_heel:0 "На Повідку"
  lac_brought_to_heel_desc:0 "Місто Псів впало. Hangdogs скиглять. Але, можливо, з них ще буде користь."
  lac_brought_to_heel_tt:0 "§YНью-Мексико під контролем Ланія; але якщо він піде — усе зміниться.§!"
  lac_loot_dog_city:0 "Смажений Ламар"
  lac_loot_dog_city_desc:0 "Може, якби ти позбувся цієї дурнуватої зачіски, в тебе ще залишилась би нація."
  lac_lessons_hangdogs:0 "Уроки Hangdogs"
  lac_lessons_hangdogs_desc:0 "У Ланія було чому повчитись у Hangdogs. Варто запозичити деякі з їхніх ідей."
  lac_ciphers:0 "Плем’я, Яке Варте Поваги"
  lac_ciphers_desc:0 "Ciphers зневажають технології. В цьому вони близькі до Цезаря. Їхні рештки стануть у пригоді."
  LAC_chariots:0 "Колісниці Марса"
  LAC_chariots_desc:0 "Ми далеко від храмів Two Sun і Nas, але на фронтирі ми запровадимо колісниці. Вони стануть нам у пригоді на шляху до моря!"
  lac_ciphers2:0 "Зламати Шифрів"
  lac_ciphers2_desc:0 "Ми можемо навчитись від цих дикунів. І вони — від нас."
  lac_triumphant_campaign:0 "Володарі Колорадо"
  lac_triumphant_campaign_desc:0 "Місто Псів скиглить. Братство знищене. Ніхто не зупинить Ланія — Монстра Сходу!"
  lac_lone_star:0 "Падаюча Зірка"
  lac_lone_star_desc:0 "Лоун Стар колись ледь не впав перед рейдерами Легіону. Які в них шанси проти справжньої сили?"
  lac_plunder_lonestar:0 "Грабунок Лоун Стара"
  lac_plunder_lonestar_desc:0 "Контролюючи найбагатше місто Північного Техасу, ми звернемо багатства профіглатів на славу Легіону!"
  lac_mutants_of_texas:0 "Гідні Вороги!"
  lac_mutants_of_texas_desc:0 "Серед мутантів Техасу — справжні воїни. Хтось стане здобиччю, хтось — союзником. Червоне і Зелене ніколи не виглядали так добре."
  lac_mutants_of_texas_tt:0 "До нас приєднається супер-мутантська дивізія."
  lac_invite_ironmongers:0 "Запросити Ironmongers"
  lac_invite_ironmongers_desc:0 "[IMO.GetLeader] — гідний воєначальник, що згуртував мутантів у народ. Ми можемо мати справу з тими, хто розуміє славу війни!"
  lac_peace_order_good_governmant:0 "Мир М'ясника"
  lac_peace_order_good_governmant_desc:0 "Методи Ланія — жорстокі, але під його владою Пустка стала мирнішою. Для Легіону — краще світ страху, ніж світ болю."
  lac_cars_now_yay:0 "Використаємо Шляхи"
  lac_cars_now_yay_desc:0 "Зміцнивши владу на схід від Ріо-Гранде, ми забезпечимо підрозділи автотранспортом. Ave!"
  lac_cars_now_yay_tt:0 "До національного складу додано §Y200§! одиниць §YВідновлених автомобілів Легіону§!."
  lac_la_garita:0 "Імперія з Попелу"
  lac_la_garita_desc:0 "Племена півночі чули про дивний будівельний матеріал — не метал, не уламки, а «попіл». Ми побудуємо імперію власноруч. І ми його дістанемо."
  lac_we_find_more_slaves:0 "Мужність у Труднощах"
  lac_we_find_more_slaves_desc:0 "Багатьом не вистачає відваги воювати. Але ми знайдемо їм застосування — і вони знайдуть свою честь."
  LAC_legion_firearms:0 "Інструктори Легіону"
  LAC_legion_firearms_desc:0 "Попросімо допомоги Цезаря у підготовці армії. Нехай Схід відчує силу Легіону!"
  LAC_mxc_strip_bunker:0 "Розібрати Бункер"
  LAC_mxc_strip_bunker_desc:0 "Братству ці ресурси більше не потрібні."
  lac_pueblo_chemical_depot:0 "Хімічний Склад Пуебло"
  lac_pueblo_chemical_depot_desc:0 "Старі залишили отруйні хімікати у храмі. Можливо, пристрої для стримування отрути згодяться нам."
  lac_carlsbad:0 "Приховані Люди"
  lac_carlsbad_desc:0 "Чутки про печерних істот з південного сходу Нью-Мексико непокоять. Варто дослідити?"
  lac_winter_is_coming2:0 "Закріпитись на Східному Березі"
  lac_winter_is_coming2_desc:0 "Після падіння Літньої Федерації ми можемо остаточно зміцнити владу на східному березі."
  lac_hire_iron_alliance:0 "Залізна Угода"
  lac_hire_iron_alliance_desc:0 "Вулпес пошепки розповідав про воїнів із залізною кров'ю — найманців, що не кланяються жодному прапору, але торгують у вогні. Ланій, як завжди прагматик, погодився. Фрументарії вирушили попереду когорти з чіткою метою: здобути прихильність коваля Нового Стерлінга та прив'язати Залізний Альянс до нашої кампанії — не ланцюгами, а монетою та метою."
  lac_hire_iron_alliance_tt:0 "\n\n§RЗалізна Ціна:§! Попросивши про допомогу §Y[IRN.GetName]§!, [LAC.GetLeader] пообіцяв заздалегідь віддати [IRN.GetLeader] певні штати після їх підкорення. Якщо [LAC.GetLeader] отримає контроль над ними, він буде змушений передати §YЗалізному Альянсу§! такі штати:\n§Y[315.GetName]\n[593.GetName]\n[82.GetName]\n[490.GetName]\n[109.GetName]§!"

  lac_stories_of_battle:0 "Легендарна Тактика"
  lac_stories_of_battle_desc:0 "Тріарії зібралися довкола кліток з писарями Братства, слухаючи розповіді про їхню «славну» минувшину. Битви з монстрами з лез, криками заліза й числами, що говорили. Історії про лідера — восьмиголову гідру в горах, яка розраховує загибель людства, щоб її діти успадкували попіл світу. Історії про війну. Про кров."

  LAC_legion_equipment:0 "Просити Допомоги у Флагстаффа"
  LAC_legion_equipment_desc:0 "Ми можемо звернутися до [CES.GetLeader] по допомогу в завоюванні Сходу, хоча він може й відмовити."

  ces_solar_plants:0 "Розібрати Сонячні Станції"
  ces_solar_plants_desc:0 "Давні використовували силу Сонця. Але Легіон ще не готовий кинути виклик богам. Ми перетворимо ці старі станції на щось корисне."

  LAC_colonia:0 "Колонії"
  LAC_colonia_desc:0 "[lanius_coloniae_focus_desc]"
  LAC_colonia_desc_normal:0 "Цезар оселить старших легіонерів на берегах Ріо-Гранде, аби земля залишалась лояльною. Вони радо підтримають розширення Ланія."
  LAC_colonia_desc_eastern_legion:0 "Ланій оселить старших легіонерів на берегах Ріо-Гранде, аби земля залишалась вірною. І вони підтримають його розширення."

  lac_cyber_dog:0 "Придбати Кібер-Пса"
  lac_cyber_dog_desc:0 "У Місті Псів є не лише плоть. Там блукають і магічно вдосконалені собаки — і вони також служитимуть Ланію."

  lac_code_salvages:0 "Кодекс Трофеїв"
  lac_code_salvages_desc:0 "Ланій оголосить новий кодекс про розподіл трофеїв у Місті Псів. І, звісно, Легіон отримає свою частку здобичі."

  lac_lubbock:0 "Шлях на Схід"
  lac_lubbock_desc:0 "Лаббок поділено між гулями й людьми — спадщина старого конфлікту. Ланій звільнить вас від цих дрібних чвар."

  lac_brotherhood:0 "Останній Подих Ромбуса"
  lac_brotherhood_desc:0 "Нарешті ми знайшли ворога, гідного Ланія."

  lac_stop_the_signal:0 "Дарувати Тюбхедам Нову Мету"
  lac_stop_the_signal_desc:0 "Хіба Ланій не заслуговує барда, що оспівуватиме його славу? Хай тюбхеди поширюють легенди по всьому Легіону!"

  lac_roller_slaves:0 "Доля Ролер-Дівчат"
  lac_roller_slaves_desc:0 "Дивно, що Сходом керували стільки жінок. І ще дивніше — що билися вони краще за багато племен Аризони. Ми можемо завоювати їхню лояльність, надавши доступ до втраченого храму в Далласі."

  lac_more_political_power:0 "Просувати Мутантів"
  lac_more_political_power_desc:0 "Супер-мутанти — такі ж племена, як і всі інші. Нехай ці воїни маркують себе знаком Бика."

  lac_conquer_houston:0 "Червоний Сяйв Ракет"
  lac_conquer_houston_desc:0 "Г’юстон перед нами. Незабаром я занурю меч у води Мексиканської затоки. І побачу море."

  lac_intervene_in_civil_war:0 "Найсильніший"
  lac_intervene_in_civil_war_desc:0 "Великий Цезар мертвий, і шакали гризуть його кістки. Ми маємо вирішити, кого підтримати."
  lac_intervene_in_civil_war_tt:0 "Можна підтримати будь-яку сторону громадянської війни, окрім §Y[VLP.GetNameWithFlag]§!. З таким лідером Легіон приречений."

  lac_victory_texas:0 "Завоювання Техасу!"
  lac_victory_texas_desc:0 "Братство впало. Аламо, священний храм Техасу — осквернено. Ніхто більше не зупинить Ланія. Його меч у морі — символ того, що його сила сягнула краю світу."

  lac_fate_legion:0 "Доля Сходу"
  lac_fate_legion_desc:0 "Завоювання Ланія перевершили всі сподівання. Але, можливо, настав час переосмислити його роль у Легіоні."
  lac_fate_legion_tt:0 "\nЯкщо з Цезарем щось сталося — ви претендуєте на владу в Легіоні. Якщо Цезар ще живий — ви нагадаєте йому, що кожен син одного дня залишає дім."

  lac_reconstruction:0 "Закріпити Владу"
  lac_reconstruction_desc:0 "Ті, хто виступив проти мене, стануть моїм плащем. З їхніх черепів я збудую арку, під якою пройдуть мої війська."
  lac_reconstruction_tt:0 "[LAC.GetLeader] отримає знижку 50% на інтеграцію колишніх земель Легіону."

  lac_avenge_house:0 "Остання Мрія Цезаря"
  lac_avenge_house_desc:0 "Цезар мріяв взяти Нью-Вегас, але не встиг. Я ж переміг дев’ятнадцять племен Сходу. І всі вогні Вегаса не зупинять мене."

  lac_conquer_california:0 "До Західного Сонця"
  lac_conquer_california_desc:0 "Захід впаде, як і Схід. Всі племена до заходу сонця нестимуть знак Легіону. \n\nІ якщо вони опиратимуться — ми приб’ємо їх до Дамби."

  LAC_cult:0 "Культ Марса"
  LAC_cult_desc:0 "Мало розгорнути прапор. Ми врятуємо Схід — і навчимо його про Марса та його пророка. Слова Цезаря буде почуто."

  lac_the_code:0 "Східний Кодекс"
  lac_the_code_desc:0 "Як ми можемо керувати Сходом, якщо кожне місто має свої закони? Ланій накаже своїм писарям звести їх у єдиний кодекс з законами Легіону."

  lac_tribal_god:0 "Бог для Племен"
  lac_tribal_god_desc:0 "До розчарування Ланія, деякі племена бачать у ньому бога. Але ж не всі боги добрі..."

  lac_hire_vulpes:0 "Запросити Фрументаріїв на Схід"
  lac_hire_vulpes_desc:0 "Хоча методи Вулпеса нечесні — вони корисні. Іноді."

  lac_slave_markets_taos:0 "Де Батіг — Там Шлях!"
  lac_slave_markets_taos_desc:0 "Слабким часто потрібна правильна мотивація."

  lac_naval_base:0 "Класи Сходу"
  lac_naval_base_desc:0 "Ланію потрібен флот — наскільки дозволить Ріо-Гранде. Чому б не побудувати його тут?"

  lac_new_slot_woo:0 "Вчимося в Роботів Денвера"
  lac_new_slot_woo_desc:0 "У Денвері є дивна фабрика, якою керує робот з минулого. Якщо ми пощадимо його, він поділиться знаннями."

  lac_colorado_trade:0 "Гроші — це Сила"
  lac_colorado_trade_desc:0 "Забезпечення торгових шляхів на Сході привабить купців, а скарбниця наповниться."

  lac_centurions:0 "Наші Центуріони"
  lac_centurions_desc:0 "[lanius_centurions_focus_desc]"
  lac_centurions_desc_normal:0 "Ми можемо почати набирати центуріонів з наших легіонерів. Це показує, що ми вже не експедиція з Флагстаффа, а справжня частина Легіону."
  lac_centurions_desc_eastern_legion:0 "Ми можемо почати набирати центуріонів з наших легіонерів. Це свідчить про те, що ми вже не бунтівне відгалуження з Флагстаффа, а справжній спадкоємець Легіону."

  lac_elite:0 "Преторіанці"
  lac_elite_desc:0 "Ланій може завербувати власних преторіанців як знак прихильності Цезаря. І, ймовірно, Цезар схвалить це, коли почує."

  lac_cheese:0 "Занепала Імперія"
  lac_cheese_desc:0 "Двісті років тому батько відкрив магазин, щоб прогодувати сім’ю.\nЧерез п’ятдесят років — це була сирна імперія, яка годувала Старий Світ.\nА нині — лише храм, святиня сиру та дротових металевих рук, що виготовляли моцарелу для королів у добу минулу."

  lac_mxc_strip_bunker:0 "Очистити Бункер"
  lac_mxc_strip_bunker_desc:0 "Не залишиться й згадки про цих розбещених культових фанатиків, коли я закінчу."

  LAC_light_hand:0 "Відкрита Долоня"
  LAC_light_hand_desc:0 "Ті, хто підкориться Легіону — житимуть. Дехто навіть зможе оцінити те, що ми їм даємо."

  lac_the_march_west:0 "Марш на Захід"
  lac_the_march_west_desc:0 "Час сповістити Цезаря, що мою місію завершено.\n«Гарно виконана робота», написана кров’ю розбещених."
  lac_the_march_west_desc_tt:0 "[LAC.GetFlag]§YLanius§! мирно інтегрується у [CES.GetFlag]§YЛегіон Цезаря§!, передаючи війська, генералів, заводи та території до нового об'єднаного Легіону."

  lac_good_boy_puppet:0 "Східна Імперія"
  lac_good_boy_puppet_desc: "Хоча Ланій залишиться частиною Легіону, він керуватиме ним як маріонетка Цезаря. Бо що може бути величніше для Ланія, ніж служити Цезарю до останнього подиху?"

  lac_no_strings_on_me:0 "§RНіяких Ниток§!"
  lac_no_strings_on_me_desc:0 "Я можу робити все, що забажаю."

  lac_mantling_a_new_look:0 "Сила Через Єдність"
  lac_mantling_a_new_look_desc:0 "Цезар був лише сходинкою на моєму шляху до завоювань. З Діаною — я маю щось більше.\nСильні пустки. Сильніший світ."

  lac_new_empire:0 "Погляд на Схід"
  lac_new_empire_desc:0 "Цезар — добрий. Але Схід — це земля багатства та сили. Нехай він витрачає життя на стіни Старого Світу, я йтиму до моря."
  lac_new_empire_tt:0 "§YЗробіть перші кроки до створення суперницького Легіону, що лякатиме Схід так, як Цезар — Захід.§!"

  lac_our_new_capital:0 "Східна Цитадель"
  lac_our_new_capital_desc:0 "Кастра Сол Рубрум — надто близько до Цезаря, щоб бути моїм троном. Чому б не взяти жінку з Собак і правити з їхнього старого осередку?"

  lac_better_myth:0 "Великодушний Полководець"
  lac_better_myth_desc:0 "Кажуть, я жорстокий. Але я надихнув людей битися й помирати за мене по всьому Сходу. Думай про мене не як про загарбника, а як про твого рятівника."

  lac_bitter_drink:0 "Гірка Правда"
  lac_bitter_drink_desc:0 "Усе плем’я Ланія зникло, ніби його й не було. Єдина пам’ять про Сховбарків — та, що створить сам Ланій. Але, можливо, ще щось залишилось у старих уроках."
  lac_bitter_drink_tt:0 "§YLanius згадує традиції свого племені і застосовує їх у новому Легіоні.§!"

  lac_hire_scholars:0 "Власні Писарі"
  lac_hire_scholars_desc:0 "Вигнанці з Братства, невдахи з Послідовників, шукачі зі Міста Псів... Вони знають чимало зі старих книг, якщо знати, де шукати. Залучимо їх до справи."

  lac_lessons_from_the_east2:0 "Роздуми Мескалеро"
  lac_lessons_from_the_east2_desc:0 "Мескалеро жили тут тисячі років, бачили злети й падіння імперій. Можливо, варто прислухатись до їхніх слів."

  ###
  lac_letting_go_of_the_mask:0 "Нація Сили"
  lac_letting_go_of_the_mask_desc:0 "І Джошуа Грем категорично відмовився від думки про непослух Цезарю, сказавши, що це смерть — іти проти бога. На що Ланій відповів: «Я б погодився — якби був Вульпесом»."

  lac_dianas_light_to_the_cohort:0 "Світло Діани для Когорт"
  lac_dianas_light_to_the_cohort_desc:0 "Юнаки Екзек’ютивів, Літні, Зимові та з усієї Нової Мексики — приєднуйтесь до своїх товаришів по зброї. Вірте мені, і ми рушимо проти варварів, звільнимо себе від рабства Цезаря, бо як воїни ми не маємо бути рабами варварів."
  lac_dianas_light_to_the_cohort_tt:0 "§YПрацюючи з [TTM.GetNameWithFlag], Східний Легіон робить перші кроки до становлення нацією.§!"

  lac_integrate_exe:0 "Виконавча Влада"
  lac_integrate_exe_desc:0 "Не бійся і не тікай з бою, бо в моїй руці — війна і смерть. Побудуймо імперію, що переживе віки."

  lac_integrate_suf:0 "Нескінченне Літо"
  lac_integrate_suf_desc:0 "Ось наш дім, ось наша батьківщина."

  lac_integrate_mes:0 "Інтегрувати Мескалеро"
  lac_integrate_mes_desc:0 "Якби я не був Сховбарком, я був би Мескалеро."

  lac_integrate_eda:0 "У Кожної Троянди Є Шипи"
  lac_integrate_eda_desc:0 "Що в імені? Те, що ми звемо трояндою, зватиметься так само солодко й під іншою назвою."

  lac_integrate_lambda:0 "Варіант Лямбда"
  lac_integrate_lambda_desc:0 "Навчися від мене мужності, мій сину, і справжніх страждань теж. А удачу переймай в інших. Лямбда занадто багато знає про страждання — настав час змінити це."

  lac_light_brings_us_together:0 "Сильніші Разом"
  lac_light_brings_us_together_desc:0 "Святі тіні загиблих, це я винен у вашій жорстокій долі — та звинувачуйте Цезаря, що змусив нас воювати один з одним. І все ж я був би радий, браття, якби ви були тут зі мною, бо нас єднає спільна кров і спільне бачення. Запалімо світ — і охороняймо його, поки він палає."

  lac_the_history_of_war:0 "Війна Не Змінюється"
  lac_the_history_of_war_desc:0 "Упродовж історії були ті, хто вихвалявся — прийшов, побачив, переміг. Мертві руки все ще тримають перо історії; і якщо хочеш звільнитися від їхньої хватки — мусиш знати, чому."

  lac_folly_of_carrhae:0 "Безумство Карр"
  lac_folly_of_carrhae_desc:0 "Карри — це історія армії, що зайшла надто далеко заради жадібності. В пошуках золота і здобичі вони вмерли в пустелі, король їхній потонув у власному золоті. Можливо, ти навчишся чомусь із цього."

  lac_legend_of_arbela:0 "Легенда Арбели"
  lac_legend_of_arbela_desc:0 "Було бій, коли армія героїв, щільна та озброєна, виступила проти самого бога. Їх було мало, та озброєні й підготовлені — доказ, що якість також є кількістю."

  lac_battle_of_marathon:0 "Битва при Марафоні"
  lac_battle_of_marathon_desc:0 "Коли перси побачили, як афіняни біжать на них, подумали, що ті збожеволіли. Але перемогли саме афіняни. Вони віддали перевагу свободі перед рабством — і залишили пам’ять для вічності. І стоячи на могилі перса — чи можеш ти звати себе рабом?"

  lac_building_a_true_legion:0 "Будуємо Справжній Легіон"
  lac_building_a_true_legion_desc:0 "Солдат, я пропоную тобі втому, небезпеку, боротьбу і смерть; холодні ночі під зорями, спеку під сонцем; без притулку, без боєприпасів, без харчів — лише виснажливі марші, небезпечні пости та безперервна боротьба з багнетом проти батарей. Ті, хто любить свободу — йдіть за мною."

  lac_equites:0 "Еквіти"
  lac_equites_desc:0 "Нам потрібна підтримка не лише воїнів. Нехай торговці й ремісники також стануть з нами."

  lac_velites:0 "Веліти"
  lac_velites_desc:0 "Цезар приводить професійну армію; та ми покажемо, що вільна людина, що бореться за свободу, сильніша за будь-якого раба в латах."

  lac_hastati:0 "Гастати"
  lac_hastati_desc:0 "Гастати — це бідняки в нашій армії, ті, хто ледве міг дозволити собі спорядження. Ми забезпечимо їх зброєю, аби вони мали шанс в бою."

  lac_triarii:0 "Тріарії"
  lac_triarii_desc:0 "Тріарії — еліта нашої армії. Їх буде застосовано в переломний момент битви. Озброєні вибухівкою, вони знищать будь-якого дурня, що стане на їхньому шляху."

  lac_speculatores:0 "Спекулятори"
  lac_speculatores_desc:0 "Навіщо покладатись на фрументаріїв, якщо наші купці й так усе знають? Хай навіть усе — за ціною."

  lac_testudo:0 "Тестудо"
  lac_testudo_desc:0 "Тестудо — ще одна ідея Діани. Тактика малих груп, що прикривають одна одну вогнем та рухом. Можливо, окремий воїн не здобуде слави — зате перемога матиме тисячу батьків."

  lac_quincunx:0 "Квінкункс"
  lac_quincunx_desc:0 "Потреби тотальної війни ставлять наші землі на межу. Ця нова монета допоможе платити солдатам, хоч і підірве довіру до валюти Легіону."

  lac_liberti:0 "Свобода"
  lac_liberti_desc:0 "Дехто з профлігатів, яких ми поневолили, може воювати за нас, якщо дати їм волю. То хай буде так — адже я обіцяв визволити Пустку способами, яких вони й уявити не могли."

  lac_wonders_of_paradise:0 "Чудеса Раю"
  lac_wonders_of_paradise_desc:0 "Один мудрець казав: якщо маєш сад і бібліотеку — маєш усе необхідне. Я не думав, що він мав це на увазі буквально."

  lac_administrative_support:0 "Адміністративна Підтримка"
  lac_administrative_support_desc:0 "Ланій дізнався, що Олександр завершив майже всі завоювання до тридцяти двох, і більше не знав, що робити далі. І Ланій здивувався, що той не вбачав у встановленні порядку в завойованому — ще більшої справи."

  lac_tribal_volunteers:0 "Добровольці з Племен"
  lac_tribal_volunteers_desc:0 "Я запевняю: краще бути першим серед Сонячних Псів, ніж другим у Легіоні."

  lac_battle_beasts:0 "Бойові Звірі"
  lac_battle_beasts_desc:0 "Насміхайтесь із цих племінних як з овець — але я більше боюся сотні овець під проводом лева, ніж сотні левів, що йдуть за вівцею."

  lac_spores:0 "Могутні Дерева"
  lac_spores_desc:0 "Кажуть, Ланій зайшов у ліс і вийшов вищим за дерева. Навіть мати-природа кориться його наказам."

  lac_skilled_arial_gliders:0 "Крила Орла"
  lac_skilled_arial_gliders_desc:0 "І Ланій казав: з усіх звірів він заздрить орлу найбільше — бо той летить високо і розбиває їжу об каміння внизу."

  lac_a_gift_from_the_factory:0 "Подарунок з Фабрики"
  lac_a_gift_from_the_factory_desc:0 "Кажуть, остерігайся богів з подарунками — але хіба це не священна честь від Місяця? Хто, як не Обранець богів, заслуговує на G.E.C.K.?"

  lac_terra_firma:0 "Esto Perpetua"
  lac_terra_firma_desc:0 "Ми не в положенні бідного Олександра Великого, що плакав, бо не залишилось світів для завоювання. Щоби творити справедливість у уламках світу — вистачить і того, що є."

  lac_confronting_loyalists:0 "Протистояння Лоялістам"
  lac_confronting_loyalists_desc:0 "Я вів війни — і внутрішні, і зовнішні. І коли перемагав — милував усіх, хто просив. Країни, які можна було врятувати — я рятував, а не нищив."

  lac_path_towards_integration:0 "Це Можна Назвати Миром"
  lac_path_towards_integration_desc:0 "Здобувши все за волею Пустки, народ увінчав мене лаврами, короною та написом, що свідчив про мої чесноти. Я мав вплив понад усіх — але влади не більше, ніж інші. Я був другом для всіх і володарем — ні для кого."

  lac_rebuilding_the_cohort:0 "Відбудова Когорти"
  lac_rebuilding_the_cohort_desc:0 "Пам’ятай, Ланійе: твоє мистецтво — це правити силою, приносити закон, милувати переможених і розтоптувати гордих."

  lac_preparing_for_the_inevitable:0 "Бог Війни"
  lac_preparing_for_the_inevitable_desc:0 "Я підкорив світ не інакше, як через невпинні тренування, дотримання дисципліни та безперервне удосконалення військової справи."

  lac_supplies_for_diana:0 "Данина Діані"
  lac_supplies_for_diana_desc:0 "Генералів я можу зробити ще — а от колісниці коштують дорого."

  lac_supplies_for_the_tribes:0 "Постачання Племенам"
  lac_supplies_for_the_tribes_desc:0 "Армія без хліба і спорядження буде переможена ще до бою."

  lac_outsmart_the_enemy:0 "Перехитрити Ворога"
  lac_outsmart_the_enemy_desc:0 "Краще перемагати голодом, страхом чи несподіванкою, ніж у відкритому бою. Найкращі плани — ті, про які ворог дізнається лише у момент їх втілення."

  lac_approach_dineta: "Звернутися до Дінета"
  lac_approach_dineta_desc: "Навахо служать Цезарю через відсутність вибору. Та не лише греки мають богиню полювання. Можливо, ми зможемо схилити їх до нашої справи."

  lac_painted_rock_2: "Розмалювати Скелю"
  lac_painted_rock_2_desc: "Дикарі Скелі мало чим загрожують — але можуть стати в пригоді в майбутній боротьбі."

  lac_war_prep_1:0 "Найсвітліша Усмішка"
  lac_war_prep_1_desc:0 "Що важче конфлікт — то славнішою буде перемога. Легке здобуте — мало цінується. Усміхнімось перед лицем Цезаря — йому це не сподобається."

  lac_war_prep_2:0 "Братство в Зброї"
  lac_war_prep_2_desc:0 "Цезар просить воювати за його славу. Я прошу воювати за власну. Моя перемога — це ваша перемога."

  lac_war_prep_3:0 "Добровольці"
  lac_war_prep_3_desc:0 "Не кличте мене диктатором чи чудовиськом. Уся Нова Мексика добровільно присягнула мені — і обрала мене своїм вождем у війні."

  lac_war_prep_4:0 "Наріжний Камінь Імперії"
  lac_war_prep_4_desc:0 "Ті, хто постачає мою армію, не мають почуття гумору. І недаремно — бо як я програю, вони перші загинуть. Перемога й поразка часто вирішуються постачанням."

  lac_war_prep_1a:0 "Шлях Воїна"
  lac_war_prep_1a_desc:0 "Цезар і я різнимося головним чином у тому, що я помру у траншеї — але не дам своїй справі зазнати поразки."

  lac_war_prep_1b:0 "Скоротити Витрати"
  lac_war_prep_1b_desc:0 "Наші солдати не вбогі через нелюбов до грошей; і не коротко живуть через відразу до довгого життя. Не ставмося до них, як до капелюхів у барі профлігата."

  lac_the_looting_of_flagstaff:0 "Грабунок Флагстаффа"
  lac_the_looting_of_flagstaff_desc:0 "Ланій споглядав палаючий Флагстафф і думав. Бо всі міста, народи, правителі — мають кінець. Як Америка, Лямбда, Рим і Греція. Може, вся слава зникає. Може, війна не змінюється."

  lac_exile_to_the_savage_south:0 "У Дикі Землі Півдня"
  lac_exile_to_the_savage_south_desc:0 "Нехай Цезар шукає собі нових слухачів у Карибах. Може, Рюйшани слухатимуть його."

  lac_yearning_for_a_stable_world:0 "Люди Мають Змінюватися"
  lac_yearning_for_a_stable_world_desc:0 "Мудрець сказав: якщо війна не змінюється — то мусять змінюватися люди. І символи теж. Слухайте Ланія, міф Сходу."

  lac_exile_to_the_far_west:0 "На Захід Сонця"
  lac_exile_to_the_far_west_desc:0 "Час Цезаря минув, як і день. Відправмо його слідом за сонцем."

  lac_new_roads_of_diplomacy:0 "Нові Дороги Дружби"
  lac_new_roads_of_diplomacy_desc:0 "Мер Чикаго надіслав свого посланця до мене — не як переможений, а як друг. І багато інших народів теж пізнали добру волю Сходу."

  lac_destroy_the_reservation:0 "Сумніви щодо Резервації"
  lac_destroy_the_reservation_desc:0 "Цезар заробляє на торгівлі з Резервацією. Та ми бачимо, що багато рабів заходять — і не виходять. Пора з цим покінчити."

  lac_invite_gorgonia:0 "Запросити Горгонію"
  lac_invite_gorgonia_desc:0 "Не сміймося з Горгон, з їхніми зміями замість волосся. Їхні служниці будуть нам корисні — з належним керівництвом."

  lac_integrate_asf:0 "Bellum Vobiscum"
  lac_integrate_asf_desc:0 "Хоч я й не приймаю їхнього дивного бога — та, можливо, в кожному краю царює свій звичай."

  lac_matter_of_the_north_bank:0 "Питання Північного Берега"
  lac_matter_of_the_north_bank_desc:0 "Перша спроба Діани — тепер по той бік Колорадо. Можливо, ще не пізно зцілити розкол."

  lac_our_original_target:0 "Вірні Супутники"
  lac_our_original_target_desc:0 "Нас послали підкорити Псів. Як же символічно, що тепер ми намагаємось зробити їх друзями."

  lac_robots_for_diana:0 "Слуги Богині"
  lac_robots_for_diana_desc:0 "До Діани люди жили в печерах як звірі. Та завдяки її вченню — вони вміють творити і жити мирно, з золотим ремеслом."

  lac_fort_abandon:0 "Форт Абандон"
  lac_fort_abandon_desc:0 "Абандон колись був фортом НКР східніше Колорадо. Тепер — це щит нашого заходу."

  lac_treasures_caesar_left_behind:0 "Що Ти Полишаєш Після Себе"
  lac_treasures_caesar_left_behind_desc:0 "Після перемоги я повернув усі прикраси в храми Аризони, які мій ворог використовував для своєї втіхи. А коли мені ставили статуї — на ногах, на колісниці, на мотоциклі — я сам їх прибрав."

  lac_nova_byzantion:0 "Нова Візантія"
  lac_nova_byzantion_desc:0 "Вегас — чудове місто, але його велич затьмарює бруд і занепад. Я перетворю місто з цегли на місто з мармуру і сталі."

  lac_city_of_lights:0 "Світлий День"
  lac_city_of_lights_desc:0 "Дейглоу — найбільше місто Каліфорнії, порт на винно-темному морі. Чому б нам не оселитися там і не поглянути за горизонт?"

  lac_alliance_with_the_omertas:0 "Важливість Родини"
  lac_alliance_with_the_omertas_desc:0 "Омерти — найбільша родина у Вегасі, ключ до його багатства. Мудрий пастир стриже овець, а не здирає з них шкіру."

  lac_the_grand_lighthouse:0 "Великий Маяк"
  lac_the_grand_lighthouse_desc:0 "Лакі 38 — диво Вегаса. Краще зробити з нього монумент народу, ніж залишити домом привида."

  lac_bloomfield:0 "До Небес"
  lac_bloomfield_desc:0 "Кажуть, боги колись подорожували Небом. Нехай і моя легенда лине туди."

  lac_gardens_of_balboa:0 "Сади Бальбоа"
  lac_gardens_of_balboa_desc:0 "Діана колись відвідала сад у Дейглоу — місце краси та дива. Як доречно буде звести нове святилище для неї на західному узбережжі."

  lac_the_midway:0 "Мідуей"
  lac_the_midway_desc:0 "У Дейглоу стоїть музей стародавнього корабля, що воював у давно забутій війні. У руїнах криється мудрість — для тих, хто вміє її бачити."

  lac_challenge_the_brotherhoods:0 "Кинути Виклик Братствам"
  lac_challenge_the_brotherhoods_desc:0 "Що таке Братство? Глухий кут. Вони ховаються, накопичують, бояться. Коли зникнуть — хто їх згадає?"

  lac_veg:0 "Знищити Вегас"
  lac_veg_desc:0 "Боягузи Вегаса вважають, що багатство врятує людство. Але монети — погані набої. Хай ними платять за прохід дорогою мертвих."

  lac_new_california:0 "До Західних Берегів"
  lac_new_california_desc:0 "Народ НКР страждає від гнилої аристократії. Від смерті королеви Танді їхні лідери тільки жеруть і жирують. Ми звільнимо народ — і станемо в ряд із Обраним, Вибраним та Імператором Нортоном."

  lac_grand_reconcilliation_act:0 "Заради Суспільного Добра"
  lac_grand_reconcilliation_act_desc:0 "Зі засланням Цезаря — час зробити наступний крок. Більше ми не Легіон — армія без держави. Ми служимо народу. \n\nКоли писатимеш мої слова — пам’ятай, я воював за народ."

  lac_invite_sleepers:0 "Сплячі Мають Прокинутись"
  lac_invite_sleepers_desc:0 "Сплячі пам’ятають Старий Світ. Можливо, вони можуть навчити нас — і допоможуть мені створити слова, що переживуть час."

  lac_reestablish_the_grand_cross_wasteland_i10:0 "Велика Дорога"
  lac_reestablish_the_grand_cross_wasteland_i10_desc:0 "Американські шосе — найбільший пам’ятник великого народу. Вони з'єднували гори, болота, міста й нації. Тепер — руїни.\n\nДо сьогодні."

  lac_the_phoenix_agreement:0 "Фініксська Угода"
  lac_the_phoenix_agreement_desc:0 "У Фініксі я відновив волю для простих людей. Я дарував право суду рівними, громадянство, оплатив фестиваль Таколандії. Народ віддячить мені."

  lac_a_new_pantheon:0 "Новий Пантеон"
  lac_a_new_pantheon_desc:0 "Ланій приніс жертви богам, як було заведено, влаштував бенкет, запросив усіх легіонерів і достойних гостей. Він пив з ними з однієї чаші, лив жертовне вино разом з жерцями — як рівний."

  lac_the_ides:0 "Іди"
  lac_the_ides_desc:0 "Пророк сказав: §M\"Стережись ід березневих.\"§!\n§Y\"Іди настали.\"§! — відповів Цезар.\n§M\"Так, Цезарю. Але не минули.\"§!"

  lac_temple_of_ares:0 "Храм Ареса"
  lac_temple_of_ares_desc:0 "О Аресе, могутній, грізний, золотошоломий, владико меча — даруй відвагу праведним, веди нас у бою!"

  lac_temple_of_artemis:0 "Храм Артеміди"
  lac_temple_of_artemis_desc:0 "Про Артеміду співаємо — покровительку стрільби, танцю і полювання на Деткло. Її не забуде жоден хор."

  lac_temple_of_athena:0 "Храм Афіни"
  lac_temple_of_athena_desc:0 "Я співаю про Афіну — ясноруку, винахідливу, хоробру. Вона — покровителька міст і воїнів, грізна подруга Ареса. Благослови нас, богине!"

  lac_temple_of_poseidon:0 "Храм Посейдона"
  lac_temple_of_poseidon_desc:0 "Про Посейдона співаю — владику морів і тремтіння землі, захисника кораблів. Почуй нас, темноволосий пан!"

  lac_temple_of_aphrodite:0 "Храм Афродіти"
  lac_temple_of_aphrodite_desc:0 "Співаю про Афродіту — прекрасну, злотоволосу. Вона збурює пристрасті, підкоряє смертних. Дай нам перемогу й натхнення для пісні."

  lac_temple_of_diana:0 "Храм Діани"
  lac_temple_of_diana_desc:0 "Царице Ночі, вершнице зір, зберігай спокій і чистоту. Прийми ці жертви — й освіти наш шлях."

  lac_add_scrap_bots:0 "Додано Технологію: §YБрухтові боти§!"

  lac_temple_in_chains: "Храм у Ланцюгах"
  lac_temple_in_chains_desc: "Братство дісталось і до Колорадо. Вони накопичують старий світ, ховаючись у бункері. Ми можемо взяти його — або переконати, що Цезар загрожує всім."

  lac_colorado_conqueror:0 "Завойовник Колорадо"
  lac_colorado_conqueror_desc: "Під юкками казали — Мескалеро не переможеш.\nУ бункерах Максона — Братство не зламати.\nУ лісах і снігах — Пси не підкоряться.\nТепер — вони мовчать."

  lac_colorado_conqueror_tt:0 "\nЯкщо §Y@IRN Залізний Альянс§! у нашій фракції, вони теж отримають цей ефект."

  lac_the_conquest_of_north: "Взяти Їхні Гори та Ріки"
  lac_the_conquest_of_north_desc: "Ці гульці говорять мовою Ші. Вони вірять, що всі рівні під Небом. Час показати, що всі рівні — перед Легіоном."

  lac_breaking_the_boulder:0 "Підкорення Східної Каліфорнії"
  lac_breaking_the_boulder_desc:0 "Збирачі — це уособлення жадібності. Вони спустошили свою землю, тепер лізуть у Колорадо. Хай будуть рабами Легіону, а не золота."

  lac_carry_bags_tt:0 "Чим більше ми підкорюємо в Колорадо, тим більше §Rінфраструктури§! ми отримаємо."

  lac_carry_bags: "Клятви Несення Ноші"
  lac_carry_bags_desc: "Цезар навчив мене: раб — це інструмент, що мислить. Збирачі — ще один інструмент у наших руках."

  lac_ghoul_conscripts:0 "Червона Гвардія"
  lac_ghoul_conscripts_desc: "Гулі Ші готові служити — з відповідною мотивацією. Можливо, під нашими прапорами вони знайдуть справжнє визволення."

  lac_scrapper_yard: "Багатства Збирачів"
  lac_scrapper_yard_desc: "Легіону потрібно більше: більше рабів, більше металу. Ми заберемо те, що нам потрібно — в Оклахомі."

  lac_melt_scrap: "Переплавити Майданчик"
  lac_melt_scrap_desc: "Кожен бампер — меч. Кожен кузов — танк. І так ми ростемо, несемо мир Легіону в Пустку."

  lac_gate_to_planes:0 "Ворота до Рівнин"
  lac_gate_to_planes_desc:0 "Секвойя — це ключ до всього Середнього Заходу. Через неї ми рушимо східніше — якщо Цезар колись закінчить в Каліфорнії."

  lac_cataphracts: "Катафрактарії"
  lac_cataphracts_desc: "Відьма лишила черокі останній дар — коней. Як і всі інші до них, вони будуть зломлені Легіоном. І мої трофеї стануть щитом Цезаря в його тріумфі в Шейді-Сендс."