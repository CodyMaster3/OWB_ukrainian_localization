l_english:
LAC_CENTURION_FLABIUS_NAME:0 "Центуріон Флабій"

LAC_CENTURION_NICODEMUS_NAME:0 "Центуріон Нікодем"

LAC_RYLEIGH_MORRISON_NAME:0 "Райлі Моррісон"
LAC_ryleigh_morrison_economic_advisor_desc:0 "Коли Форт Саммерс потрапив під контроль Легіону, Моррісон була змушена служити воєнній машині. Як жінка, вона не брала участі в боях — замість цього, з нашийником на шиї, керує виробництвом зброї для підкорення Сходу."

LAC_MCKINLEY_NAME:0 "Головна Виконавиця Маккінлі"
LAC_mckinley_economic_advisor_desc:0 "Маккінлі швидко пристосувалася до життя під Легіоном. Хоч вона вже й не жила в розкоші, своє садистське начало могла виявляти кожного разу, коли не виконувалися норми. У майстернях на сході від Ріо вона вважала своє становище не пониженням, а радше боковим переходом."

LAC_VALENCIA_NAME:0 "Ауксіліар Валенсія"
LAC_valencia_economic_advisor_desc:0 "Багато людей, пов’язаних із Діаною, вважали Легіон черговою брутальною силою в Пустках. Коли Валенсію призначили працювати з Ланієм, вона відчула, що її моральність випробовується. Але її прагнення полегшити людські страждання знайшло багато застосувань у краю завоювань і жорстокості. Деякі солдати навіть вважають її ангелом."

LAC_HONEST_NAME:0 "Гонест"
LAC_honest_economic_advisor_desc:0 "\"Ти знав, що це знову станеться, Гонест. Легіон потребує твоїх послуг, хоч би як ти цього не хотів. Доля знає твоє місце тут, навіть якщо ти відмовляєшся його прийняти.\""

LAC_MATHIUS_NAME:0 "Матій, Провидець Червоного Сонця"
LAC_mathius_economic_advisor_desc:0 "Коли підкорюють осілі нації, має початись відновлення. Фермери, робітники та інші трударі легко переходять під червоний прапор Бика. Злочинці, п’явки й слабкі мають довести свою цінність — перетворити уламки свого старого світу на фундамент нового."

LAC_PAXTON_NAME:0 "Пекстон Обердін"
LAC_paxton_economic_advisor_desc:0 "Пекстон вів невеликий торговий бізнес у Лонгнайфі до приходу Легата. Рейдери, розбиті дороги й слабка економіка майже знищили його. Але з приходом Легіону рейдери зникли, а кришки знову потекли. Людина, яку мало не зламали Пустки, тепер процвітає завдяки Легіону. Усі його каравани тепер надають знижки за легіонівські монети, просуваючи вплив Бика."

LAC_SHERIFF_NAME:0 "Шериф Буше"
LAC_sheriff_cultural_advisor_desc:0 "§4\"Раби, коріться своїм панам з усією пошаною — не лише добрим і справедливим, а й лукавим.\"§!\n\nЗемлі [ASF.GetName] управлялись не лише священиками — інші допомагали підтримувати закон і порядок. І навіть зараз, під Биком, дехто продовжує це робити, хоч і в новій ролі."

LAC_VANDOORN_NAME:0 "Пітер Ван Дорн"
LAC_vandoorn_cultural_advisor_desc:0 "Колишній голова Товариства Блакитної Троянди надав багато корисної інформації щодо вдосконалення наших технологій, але його доводиться тримати подалі від забобонних племен. Ті, в кого слабка віра в Марса, часто вірять у його вигадки про дивних істот з-за зірок."

LAC_BISHOP_NAME:0 "Архієпископ Даегар"
LAC_bishop_cultural_advisor_desc:0 "\"Тоді сказав їм: Віддавайте кесареве кесареві, а Боже — Богові.\" — Матвій 22:21"

LAC_CAGED_NAME:0 "Лозен Колорадо"
LAC_caged_cultural_advisor_desc:0 "Колорадо була першою на Сході, хто впала перед Легіоном. Хтось скаже, що в цьому є честь, але сама Лозен мовчить про те, що зробила, аби врятувати свій народ."

LAC_ARROWBREAKER_NAME:0 "Ламай-Стрілу"
LAC_arrowbreaker_cultural_advisor_desc:0 "\"Ти програв Легіону. Я був на твоєму місці, і ти — не перший, кого підкорили, і не останній. Тобі залишили життя, хоч ти й виступив проти Легата. Якщо не приймеш реальність — тебе чекає болісна смерть. Стань глиною — і збудуй краще майбутнє. Або стань добривом для гідних.\""

LAC_ARMISTEAD_NAME:0 "Виконавчий Армістед"
LAC_armistead_high_command_desc:0 "Коли пил вщух і Легіон підкорив Виконавчих, мало хто насмілився опиратися такій силі. Ті, хто відкрито боровся — були вирізані як худоба. Але ті, в чиїх серцях жеврів дух легіонера, отримали шанс на спокуту перед Легатом."

LAC_STARVED_NAME:0 "Голодний Пес"
LAC_starved_high_command_desc:0 "§4\"Я б хотів, щоб той день ніколи не настав.\"§!\n\nЩе до Ланія, ще до Паулла, ще до самого Цезаря, Голодний Пес дбав про харчування, здоров’я та пересування свого народу, попри своє слабке тіло. І тепер, у старості, йому не дозволять піти, поки Легіон не дізнається всі його секрети."

LAC_VEX_NAME:0 "Вексиларій Агріппа"
LAC_vex_high_command_desc:0 "Стяг Легіону надихає тих, хто служить під Биком. Він — не лише символ сили та єдності, а й нагадування про те, що потрібно захищати. Якщо Стяг впаде в бою, усі знають: їхнє життя втратило цінність в очах Легата."

LAC_INSTRUCTOR_NAME:0 "Інструктор Дейн"
LAC_instructor_high_command_desc:0 "Ніхто не стає легіонером за одну ніч. Його треба зламати — аби збудувати заново в образі Бика. Вони плакатимуть, вони стікатимуть кров’ю, але зможуть пишатись, коли відчують справжню силу солдата."

LAC_SERVIUS_NAME:0 "Сервій із Ганадо"
LAC_servius_army_chief_desc:0 "Легіон вже не просто збіговисько племен, яким нав’язали мету. Сервій був дитиною, коли його прийняли до Легіону, і не знає іншого життя, окрім меча в руці. Коли Ланій оголосив похід із цивілізації в хаос Нью Мексико та далі — для Сервія це була честь: нести факел порядку й мети в беззаконні пустки."

LAC_FIREBALL_NAME:0 "Файрбол Петті"
LAC_fireball_army_chief_desc:0 "Багато хто в Легіоні вважає Твосан гнилою плямою на його честі. Транспорт, що мчить через Пустку, замість того щоб іти пішки, — це, на їхню думку, прояв боягузтва. Але Петті приєднався до експедиції на схід не з обов’язку, а щоб довести, що Твосан — не пухлина Легіону. З благословення Сеньйора, усі, хто стане нам на заваді, стануть лише червоною плямою на асфальті."

LAC_AHIGA_NAME:0 "Агіга"
LAC_ahiga_army_chief_desc:0 "\"На дене були захищені від жорстоких мук Пустки, але це не дар. Одного дня прийде велетень, щоб упокорити нас усіх, і я не виявлюсь негідним. Сутички з вашими людьми та Шифрами — це лише дитячі ігри. Покажи мені справжню війну, Легате, і я покажу тобі честь навахо.\" – Шкуродер Агіга"

LAC_NAVY_NAME:0 "Едвард Колдуелл"
LAC_navy_navy_chief_desc:0 "§4\"Це може бути можливо! Лише дайте мені кілька хвилин перевірити все.\"§!\n\nХоча офіційно Едвард Колдуелл керує судноплавним бізнесом, варто лише копнути глибше, і можна помітити, як його дружина Клара шепоче йому на вухо — і він завжди з нею погоджується. Можливо, ідеї щодо синхронізованих пострілів належать саме їй, а не йому?"

LAC_AIRFORCE_NAME:0 "Фінеас Снайдер"
LAC_airforce_air_chief_desc:0 "§4\"Ти можеш не вірити в це, але небо вирішує долю твоєї експедиції.\"§!\n\nПатріарх молодої родини з Трьох-Доріг, Снайдер колись керував вантажними авіаперевезеннями на своєму особистому літаку. Він знає, що співпраця з експедицією вбереже його рідних від податків, горя та інших негараздів. Все, що йому потрібно — не думати про те, що його допомога прирікає тисячі."

LAC_BROTHERHOOD_ADVISOR_NAME:0 "Андреа Брикслі"
LAC_brotherhood_advisor_theorist_desc:0 "§4\"Я навчу їх усього, що знаю! Лише... не завдавайте їм більше болю.\"§!\n\nПісля падіння розділу Мексона багато членів Братства Сталі опинилися зломленими. У відчаї, прагнучи врятувати тих, хто вижив, колишня Старійшина виконає все, що зажадає Легат... і помре, намагаючись."

LAC_FRUMENTARII_NAME:0 "Фрументарій Гадріан"
LAC_frumentarii_theorist_desc:0 "Правила війни не нові. Тисячі років інновацій і розробок все одно програють перед правильним застосуванням розуму та сили. Найміцніший робот і найгарячіший лазерний пістолет мають свої слабкості, але дух і дисципліна витримують більше, ніж пластик і сталь."
