l_english:
nf_bonedancers.1.t:0 "Дослідницький центр G.E.C.K компанії Future-Tec"
nf_bonedancers.1.d:0 "«Танцюючі-на-Кістках» сьогодні є одними з найстрашніших канібалів Орегону, але так було не завжди.\n\nСпочатку вони були лише найманцями – приватною військовою компанією з Сієтлу під назвою «Baron International». До Великої війни ця компанія була найнята Future-Tec, дочірньою компанією Vault-Tec, що займалася розробкою технологій для відновлення пусток після апокаліпсису. Baron International забезпечували безпеку дослідників під час заворушень, спричинених Новою Чумою.\n\nПісля Великої війни Baron International швидко захопили ситуацію – штурмом узяли об’єкт і перебрали контроль у вчених. Вони гадали, що варто лише протриматись – і уряд обов’язково за ними прийде.\n\nВін не прийшов.\n\nДесятиліття потому ці найманці перетворили контроль над об’єктом на залізну хватку. Вони захищали свою маленьку частинку пустки від рейдерів, поселенців та мутантів, завдяки своїм тренуванням і політиці ізоляції.\n\nУ перші роки існування їм довелось битися з різними дивними угрупованнями. Хто з них був найнебезпечнішим?"
nf_bonedancers.1.a:0 "Орда Вендіґо"
nf_bonedancers.1.b:0 "Залишки Мутантів"
nf_bonedancers.1.c:0 "Рейдери-Ранчери"

nf_bonedancers.2.t:0 "Чоловік в Лахмітті"
nf_bonedancers.2.d:0 "Процвітання не могло тривати вічно. Хоча підготовка їхніх предків дозволяла легко боротися з племенами-суперниками, згодом постала інша проблема – земля під ними вмирала. Радіація повільно знищувала життя. І голод забирав більше життів, ніж напади ворогів.\n\nОднієї ночі відбулася нарада – і було прийнято рішення.\n\nНайманці проголосували, і серед обраних тягнули соломинку. Хто витяг найкоротшу – того відправили «танцювати з кістками» – досліджувати кісткові руїни старого комплексу Future-Tec. Згодом це звання перейшло до всіх, хто збирався на ризиковані рейди до проклятого об’єкта в пошуках технологій і рятунку для помираючої землі.\n\nЦі «Танці з Кістками» іноді приносили плоди, але час спливав. І лише поява дивного фігури з півдня змінила все.\n\nЦей чоловік, божевільний через невідомі жахи, мав більше знань і передбачень, ніж будь-хто інший. Радіація пекла його тіло, роблячи його невмираючим. Танцюючі-на-Кістках нарекли його «Огидним Королем». Завдяки його підказкам було знайдено кілька частково працездатних G.E.C.K. у старому бункері.\n\nХоча його допомога була неоціненною, досі точаться суперечки – як до нього поставилися спочатку? Що вони подумали про цю дивну постать?"
nf_bonedancers.2.a:0 "Він – чудовисько"
nf_bonedancers.2.b:0 "Він – чоловік"
nf_bonedancers.2.c:0 "Він – бог"

nf_bonedancers.3.t:0 "Багряний Ліс"
nf_bonedancers.3.d:0 "Завдяки G.E.C.K., знайденим Огидним Королем, нам вдалося відновити землю... Але не все пішло гладко. Самі машини, зношені й проіржавілі, працювали зі збоями. Головна проблема? Радіація просочилась у насіння всередині пристроїв. Зелені рослини, які вони вирощували, були дивними, зіпсованими й... жорстокими.\n\nФрукти були поживними, але ті, хто їх їв, починали марити. Землі, створені цими машинами, згодом стали відомі як Багряний Ліс – скарлатина плутанини, дивини й безумства. А з ним прийшли й зміни в самих Танцюючих-на-Кістках.\n\nРитуальні вбивства, канібалізм і рабство стали основою їхньої культури, яка розповсюдилася далі, породивши відгалуження: Ходоки-Каркасів, Питущих-Мозок і Ламайреберців.\n\nПоблизу комплексу Future-Tec група фанатиків почала поклонятися Огидному Королю як богу, а на узбережжі поселенці з Небесної Брами намагаються очистити ліс!\n\nНовий лідер Танцюючих-на-Кістках має обрати найкращу стратегію проти цих загроз."
nf_bonedancers.3.a:0 "Краще діяти обережно"
nf_bonedancers.3.b:0 "Рішучість перемагає у війні!"

nf_bonedancers.4.t:0 "Мир із Західниками?"
nf_bonedancers.4.d:0 "Останнім часом чимало конфліктів виникає на нашому західному кордоні. Хоча лоялісти Черепа (Cranium) не вбачають великої загрози, як Паломники з Небесної Брами на узбережжі, так і Багряні Аколити у своїх спустошених храмах вважають, що загарбники становлять загрозу нашій гегемонії.\n\nМи можемо, якщо хочемо уникнути вторгнення через долину Бенд у найближчі кілька років, запропонувати дари й спробувати укласти мир. Проте, якщо ми підемо цим шляхом – Черепові буде важче тримати Танцюючих-на-Кістках під контролем, адже народ може втратити віру в нього."
nf_bonedancers.4.a:0 "Гідна жертва"
nf_bonedancers.4.b:0 "Боятися їх? Ха!"

nf_bonedancers.5.t:0 "Танцюючі-на-Кістках пропонують угоду?"
nf_bonedancers.5.d:0 "Танцюючі-на-Кістках запропонували нам досить вигідну угоду. Якщо ми пообіцяємо не вторгатися на їхні землі, вони передадуть нам чималу кількість кришок, ресурсів і робочої сили. Це вигідна справа, було б безглуздо відмовлятися!"
nf_bonedancers.5.a:0 "Угода, від якої не відмовляються!"
nf_bonedancers.5.b:0 "Ми відмовляємось!"

nf_bonedancers.6.t:0 "Вони погодились!"
nf_bonedancers.6.d:0 "Втратити трохи ресурсів – це неприємно, але завдяки цьому ми зможемо зосередити увагу в інших напрямках. Це наша відповідальність як держави – тепер ми зможемо скеровувати сили туди, де вони справді потрібні."
nf_bonedancers.6.a:0 "Мир... принаймні на тепер."

nf_bonedancers.7.t:0 "Вони відмовились!"
nf_bonedancers.7.d:0 "Наших дипломатів убили дорогою до долини Бенд! Схоже, вони прагнуть крові й готуються до вторгнення!"
nf_bonedancers.7.a:0 "О, ні!"

nf_bonedancers.8.t:0 "Запит на вступ до Північної Ліги?"
nf_bonedancers.8.d:0 "Танцюючі-на-Кістках – найбільше з канібальських угруповань півдня – подали формальний запит на вступ до Північної Ліги як рівноправні союзники. Мати буферну державу на півдні, щоб стримувати республіки, буде дуже корисно. Крім того, ходять чутки про досить... цікаві товари, заховані на землях Танцюючих."
nf_bonedancers.8.a:0 "Можливо, з них вийде «гарні» союзники..."

nf_bonedancers.9.t:0 "Нам відмовили!"
nf_bonedancers.9.d:0 "Наші дипломати, відправлені на північ, у крижані землі, не повернулись. Це поганий знак для перспектив альянсу з примарами Капітолійського пагорба. Схоже, ми залишились самі."
nf_bonedancers.9.a:0 "О, ні..."

nf_bonedancers.10.t:0 "Зачаровуюча Мелодія"
nf_bonedancers.10.d:0 "Огидний Король підняв руку, і його послідовники дослухались. Настав час діяти.\n\nКороль говорив з дивною інтонацією, наче сама доля вела його, аби він діяв саме зараз. Його пісню першими підхопили Багряні Аколити – через землі Танцюючих-на-Кістках їхні постаті в каптурах танцювали вперед, повторюючи заворожуючу, зачаровуючу мелодію свого пророка, месії і царя.\n\nНі, він не жорстокий, і зовсім не божевільний. Його розум – це скарбниця чудес, з якої він здобуває речі, за які ми б віддали роки життя.\n\nБліда Маска Долі охопила Танцюючих-на-Кістках. Світ заплаче, коли згадає правду, яку забув – правду про справжнього Володаря, якому служили навіть імператори."
nf_bonedancers.10.a:0 "Нарешті я став королем – королем за правом."

nf_bonedancers.11.t:0 "Паломники Серафиму"
nf_bonedancers.11.d:0 "«Паломники Серафиму» прибули на наше узбережжя останніми роками з наміром навернути наш народ до своєї віри. Вони несуть новий шлях – «природний рай, якого світ ще не бачив». Хоч у нас багато ворогів, Паломники Серафиму – якщо дослухатися до їхніх проповідей – одні з небагатьох наших союзників.\n\nВ обмін на дозвіл навертати частину наших людей ми надали Серафам постійний дім на нашому узбережжі. Нещодавно наш лідер [BDT.GetLeader] виявив зацікавлення їхніми проповідями. Він каже, що вони лише поширюють те, що самі обрали – і в тому, що вони говорять, є сила.\n\nЗ наверненням Черепа, лідер Паломників – колишній серафимський хрестоносець із Небесної Брами на ім’я Каїн – здобув вагому роль серед Танцюючих-на-Кістках."
nf_bonedancers.11.a:0 "Страшно впасти до рук Бога живого!"

nf_bonedancers.12.t:0 "Питання Бездушних"
nf_bonedancers.12.d:0 "Нещодавно серед Серафімських Паломників виникла криза віри. Як слід ставитися до автоматизованої праці? Дехто вважає, що бездушні творіння не повинні працювати поруч із людьми. Інші ж вірять, що це лише інструмент, і якби це було гріхом – Бог ніколи не дозволив би нам створити таке.\n\nЦе складне питання, що розкололо ряди Паломників. Лідер Серафімів, Каїн, зібрав старійшин, щоб дати відповідь."
nf_bonedancers.12.a:0 "Єремія 29:13 – чисте серце веде до небес."
nf_bonedancers.12.b:0 "Псалом 62:1 – душа є ключем до раю."

nf_bonedancers.13.t:0 "Питання Грішників"
nf_bonedancers.13.d:0 "Серафімські Паломники сперечаються щодо грішників у пастві. Одні вимагають розп’яття, щоб запобігти поширенню гріха. Інші вірять, що Бог Пара – милосердний до тих, хто відкриває йому серце.\n\nІстина, можливо, лежить між крайнощами. Євангеліє показує нам суть, не завжди вказує шлях. Син Пара казав: «Вони всі однакові, але кожен має свій дар від Бога» (Лк 5:29). Ми маємо обрати шлях."
nf_bonedancers.13.a:0 "Йоан 1:9 – прощення веде до спасіння."
nf_bonedancers.13.b:0 "Псалом 1:1 – шлях грішника – помилковий."

nf_bonedancers.14.t:0 "Паломники Бажають Причастя"
nf_bonedancers.14.d:0 "Серафімські Паломники – «Серафімські Лорди» – просять повернути їх у нашу паству. Вони створили невеличку державу на західному узбережжі, навернувши частину Танцюючих-на-Кістках у «єдину віру». Проте багато хто у нашому духовенстві вважає, що канібали ніколи щиро не навернуться – вони лише вдають заради багатств Пара.\n\nСьогодні ми зібралися, щоб вирішити цю справу."
nf_bonedancers.14.a:0 "1 Самуїлова 3:10 – Прийди, дитино моя."
nf_bonedancers.14.b:0 "Повторення Закону 23:9 – вони злі."

nf_bonedancers.15.t:0 "Хрещення в Парі"
nf_bonedancers.15.d:0 "Ми були вдячні лідерам [HEA.GetName], які надіслали поважних священнослужителів, щоб охрестити нас у Пару, що стало символом нашого нового союзу"
nf_bonedancers.15.a:0 "Мир із Богом."

nf_bonedancers.16.t:0 "Звинувачення в Єресі!"
nf_bonedancers.16.d:0 "Керівництво [HEA.GetName] не тільки відмовило нам у візитах, нас ще й проголосили єретиками! Вони не можуть ось так просто відлучити нас, ми маємо піти до них і довести свою віру — якщо треба, то силою!\n\nДехто може навіть сказати, що вони заплатили нам достатньо, аби ми стали мучениками!"
nf_bonedancers.16.a:0 "Вони відчують гнів Бога!"

nf_bonedancers.17.t:0 "Торгова Пропозиція?"
nf_bonedancers.17.d:0 "Група торговців із півдня запропонувала купити наше узбережжя за щедру плату. Дехто вважає це надто великою втратою, інші бояться, що відмова призведе до війни. Перше – мир, друге – війна. Що ми оберемо?"
nf_bonedancers.17.a:0 "Щоб уникнути війни – воно того варте."
nf_bonedancers.17.b:0 "Ми не відступимо ані на палець!"

nf_bonedancers.18.t:0 "Вони прийняли пропозицію!"
nf_bonedancers.18.d:0 "Вони вже покинули старі землі, а ми зайняли їх. Тепер у нас є узбережжя, з якого ми можемо вести війну проти [HEA.GetName]!"
nf_bonedancers.18.a:0 "Час поквитатися з єретиками!"

nf_bonedancers.19.t:0 "Вони відмовилися!"
nf_bonedancers.19.d:0 "Виглядає на те, що вони збираються оголосити нам війну! Ми покажемо їм, що буває з тими, хто заперечує нашу відплату!"
nf_bonedancers.19.a:0 "Якщо не через торгівлю, то через війну!"

