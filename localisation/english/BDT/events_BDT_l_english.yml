nf_bonedancers.24.t:0 "ТЕРМІНАЛ СХЕМИ «STEAM CORE», ПІВНІЧНО-ЗАХІДНЕ СПІВТОВАРИСТВО AER"
nf_bonedancers.24.d:0 "ТЕРМІНАЛ ЗАБЛОКОВАНО\n\n\nЗВЕРНІТЬСЯ ДО АДМІНІСТРАТОРА"
nf_bonedancers.24.1:0 ">Q"

nf_bonedancers.25.t:0 "Пісня для Машин"
nf_bonedancers.25.d:0 "Співаки покинули дім, прямувавши на свій новий концерт.\nКрізь занедбані тунелі Пара лунала їхня мелодія, вібруючи по дротах.\nПісня пробудження. Пісня надії. Мелодія грандіозна..."
nf_bonedancers.25.1:0 "Скоро весь світ заспіває в унісон"

nf_bonedancers.26.t:0 "Слідом за лініями живлення..."
nf_bonedancers.26.d:0 "Згадки про проєкт «Blue Book» у терміналах привели нас до Твін-Піксу, поблизу Спокану. Місто пусте, але збережене. Тут живуть лише гулі з темною шкірою в лісничому вбранні.\nУ старому відділку поліції ми знайшли довоєнний пристрій. Все вказує на готель. Може, саме звідти походить дивне відчуття, що переслідує нашого Короля?"
nf_bonedancers.26.1:0 "Продовжити розслідування!"
nf_bonedancers.26.2:0 "Забрати місто, воно нам знадобиться."

nf_bonedancers.27.t:0 "Дерево Говорить До Нас"
nf_bonedancers.27.d:0 "У готелі Співаки почули спів... стіни співали. Це був їхній спів, але з іншим сенсом. Деякі воїни сумніваються – кажуть, слухати дерево – це безумство. Але ж якби вони тільки чули...\nМи маємо вирішити: слідувати за деревами чи знищити джерело заздрості?"
nf_bonedancers.27.1:0 "Прислухаймося до дерев."
nf_bonedancers.27.2:0 "Спалити готель. Вони співають краще за нас."

nf_bonedancers.28.t:0 "Поема"
nf_bonedancers.28.d:0 "Із чистого повітря він з'явився. І знову зник у ньому.\nСпіваки чекали, коли Король повернеться, пройшовши крізь платан.\nКоли повернувся – приніс нову пісню, даровану деревами:\n\n«ЧЕРЕЗ ТЕМРЯВУ МАЙБУТНЬОГО МИНУЛОГО\n\nМАГ БАЖАЄ БАЧИТИ\n\nОДИН ШАНС МІЖ ДВОХ СВІТІВ»"
nf_bonedancers.28.1:0 "ХОДИ ПО ВОГНЮ РАЗОМ ЗІ МНОЮ"

nf_bonedancers.29.t:0 "Останнє Полум’я"
nf_bonedancers.29.d:0 "На півдні вибухнула сила. Одious King відчув пробудження. Духи прориваються в реальність. Їхня пісня – вже близько. Готуйтеся до мелодії, якої ще не чув світ."
nf_bonedancers.29.a:0 "ПИЙ ДО ДНА І СПУСТИСЯ"
