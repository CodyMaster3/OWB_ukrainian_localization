  ### Персонажі
  WPG_steele_name:0 "Елой Стіл"
  WPG_steele_desc:0 "Жодна революція не обходиться без героїв, і для Республіки Трьох Річок цим героєм стала Елой Стіл. Хоча повстання не змогло повністю повалити корону, народження Республіки відбулося. Елой боролася, командувала та стікала кров'ю на фронтах, щоб це народження сталося. І коли настав час обирати лідера — народ обрав її президентом.\n\nЗапальна, рішуча та не боїться запрацюватися по лікоть у брудній справі, нова президентка має перед собою нелегкий шлях. Всередині та поза урядом багато хто прагне її усунути, а молода Республіка переживає чимало труднощів. Вона повинна обережно маневрувати у політичних битвах, готуючись до неминучого повернення корони."

