l_english:
  nf_trr.1.t:0 "Корона Повстає"
  nf_trr.1.d: "Давно, коли впали бомби й світ народився заново, владу над Канадою захопив Канадський Народний Фронт — комуністичне партизанське угруповання, яке ще до Великої війни боролося проти американців. Їхнє правління було суворим, залишивши глибокі шрами в душах мешканців Уінніпеґа: їхні права відсунули на другий план заради відновлення Канади. Та коли Фронт розпався, а східні землі занурились у анархію, люди закликали рятівника. І з хаосу піднявся король Ґанн I. Через або хитру дипломатію, або загрозливий терор, він об'єднав під своєю владою Уінніпеґ, Манітобу і ще більше територій. Так почалося тривале й багате на події правління Королівства Манітоба. \n\nДеякий час усе було спокійно. Ґанн сумлінно служив королівству до своєї відставки, передавши владу здібним людям — і так почалося правління короля Брендона I, який продовжив політику Ґанна. Але з плином часу королівство занепало в розкоші й жадібності, і ситуація стала критичною."
  nf_trr.1.a:0 "Наша промисловість була могутньою!"
  nf_trr.1.b:0 "Ми зберігали дисципліновану армію"

  nf_trr.2.t:0 "Право Помилятися"
  nf_trr.2.d: "Республіка Трьох Річок постала, коли група розчарованих мешканців Уінніпеґа об’єдналася та проголосила незалежність від монархії. Відтепер король більше не правитиме нами. Причин було багато. Для когось — це прихильність корони до еліт Манітоби, які бенкетували за наш рахунок. Для інших — примус відправляти наших солдатів битися разом із Метиським Конгресом. Яке нам діло до тієї війни? Манітоба вважала, що наша вірність — це належне, але в наших серцях ми пам’ятаємо, ким завжди були: народом, що глибоко цінує свої права. Невдоволення зросло, перетворившись у спротив; спротив — у війну. І за війною прийшли перемоги, одна за одною. Те, що починалося як невелике повстання, переросло у дещо значно більше."
  nf_trr.2.a:0 "Влада належить народу"
  nf_trr.2.b:0 "Більше ніхто нічого в нас не відбере"

  nf_trr.3.t:0 "Революція Спотикається"
  nf_trr.3.d: "Хоч Республіка й встромила меч глибоко в серце Манітоби — аж до вбивства самого короля — вона так і не змогла добити ворога. Усе змінилося, коли сили метисів було розбито Мечем Півночі з Ланґенбурга, і Три Річки залишились єдиною бойовою силою Коаліції. Не бажаючи спокушати долю, Республіка погодилась на хитке перемир’я, використовуючи свою близькість до столиці королівства як козир. Обидві сторони знали: війна повернеться. А поки що — панує мир.\n\nСім років тому найманець, найнятий короною, намагався розпалити повстання в Трьох Річках, щоб повернути їх до складу Манітоби. Повстання було жорстко придушене солдаткою на ім’я Елуа Стіл. Уже відома своєю героїчною відвагою під час війни Республіканської Коаліції, після перемоги над О’Браєном та його бандою вона стала ще популярнішою. Нещодавно її обрали президентом, і вона вже запланувала низку змін — зокрема остаточне знищення корони.\n\nЦе буде непросто. І король, і О’Браєн жадають помсти Трьом Річкам, а внутрішня політична ситуація в республіці дедалі гірша, щойно спільний ворог почав слабшати. Час покаже, чи витримає Республіка наближення бурі."
  nf_trr.3.a:0 "Що б це не коштувало."

  nf_trr.4.t:0 "Рейд Легенд"
  nf_trr.4.d: "[WPG.GetLeader] запросив нас приєднатися до його майбутньої війни з Королівством Манітоба. Варто? У тих краях багато здобичі... але це може погано закінчитися для нас."
  nf_trr.4.a:0 "Заспіваймо — хей-хо, спускаємось по рівнинах!"
  nf_trr.4.a_tt:0 "\n§gВи приєднаєтесь до війни. Ура!§!"
  nf_trr.4.b:0 "Ні в якому разі."

  nf_trr.5.t:0 "Крадемо Їхню Пшеницю, Ячмінь І Все Інше Зерно!"
  nf_trr.5.d: "[PAP.GetName] погодився долучитися до будь-якої нашої війни з Королівством Манітоба. Хіба це не прекрасно?"
  nf_trr.5.a:0 "І справді."

  nf_trr.6.t:0 "Пірати, Які Нічого Не Роблять"
  nf_trr.6.d: "[PAP.GetName] відмовився приєднатися до нашої війни. Яка шкода. Для нас, звісно."
  nf_trr.6.a:0 "І справді."

  nf_trr.7.t:0 "Полювання на Велику Білу Потвору"
  nf_trr.7.d: "На півночі ходять чутки про Аврору. Дирижабль, вічно готовий до зльоту, але ніколи не готовий приземлитись. Передвоєнний американський корабель, створений для підтримки окупації, він століттями дрейфував на автопілоті після падіння бомб. Екіпаж загинув від голоду невдовзі після війни, але ніхто не сказав машині, де приземлятись — і вона не сідала. Перекази говорять про скарб у небесах, таємниці й багатства з давнього світу. Але ніхто не міг дістатись до нього... доки не з’явився Капітан.\n\nМи нарешті встановили контакт, і Барон став першим, хто піднявся на борт. Усі, хто сумнівався в ньому — тепер зрозуміють свою помилку. І хіба це не найкраще місце для його нового дому?"
  nf_trr.7.a:0 "Який чудовий краєвид."

  nf_trr.8.t:0 "Друга Коаліція"
  nf_trr.8.d:0 "[WPG.GetLeader] із [WPG.GetNameDef] прагне покласти край давньому конфлікту між [BRA.GetNameDef] та колишніми підлеглими державами.\n\nЗ цією метою він закликає народи Манітоби об’єднатись у нову коаліцію проти короля, назвавши її «Другою Коаліцією» — на честь війни Першої Республіканської Коаліції. Хто переможе цього разу?"
  nf_trr.8.a:0 "Ми будемо боротися за свої права!"
  nf_trr.8.b:0 "Зітремо цих революціонерів раз і назавжди!"
  nf_trr.8.c:0 "Цікаво."

  nf_trr.9.t:0 "Коли Зрада Квітне, Її Ніхто Не Називає Зрадою"
  nf_trr.9.d:0 "Король мертвий — хай живе народ.\n\nПісля важких випробувань ми звільнили Манітобу з лап монархістів. Більше ніхто не прикидатиметься королем Канади — лише вільний народ, з урядом законів, а не людей. Але саме в цьому й проблема, чи не так? Ми захопили королеву Манітоби — і тепер маємо вирішити її долю. Дехто вимагає стратити її за співучасть у війні. Інші пропонують просто повісити її, як будь-якого злочинця. Нарешті, є ті, хто хоче залишити її живою як просту громадянку, змусивши виживати в землі, яка не визнає знаті. Що ми робитимемо? Хтось може стверджувати, що вона ніколи не була нашим підданим і не вчинила злочину. Але вдома таке рішення буде вкрай непопулярним."
  nf_trr.9.a:0 "Публічна страта, якої ми не встигли зробити з королем."
  nf_trr.9.b:0 "Повісити її, як звичайну злочинницю."
  nf_trr.9.c:0 "Суд визнає її невинною!"

  nf_trr.10.t:0 "Тост за Героїв!"
  nf_trr.10.d:0 "Поки ми укладали мир з монархією, дехто виявився менш... м’якотілим. Революційні Мишкетери продовжили боротьбу під проводом Адмірала. І під його керівництвом вони перемогли. Вже зараз Адмірал очищає вулиці Брендона від монархістського сміття, аби забезпечити перемогу Революції."
  nf_trr.10.a:0 "Ура?"

  nf_trr.12.t:0 "Золота Нагода"
  nf_trr.12.d:0 "Режим короля в хаосі, як і слід було очікувати від монархістів.\n\nЗгідно з умовами миру після Першої Республіканської війни, місто Порто Прері було демілітаризоване. Але Королівство зайняте важливішими справами, а нам нічого не коштує звільнити мешканців міста від гніту Королівства Манітоба."
  nf_trr.12.a:0 "Жодних угод із монархістами!"
  nf_trr.12.b:0 "На відміну від них, ми дотримуємось слова."

  nf_trr.13.t:0 "Сіль на Рану"
  nf_trr.13.d:0 "У хаосі після повстання Лейфа Йорктона, схоже, зрадницькі сили [WPG.GetName] порушили умови миру Першої Коаліційної війни та окупували демілітаризоване місто Порто Прері.\n\nМи не в тому стані, щоб відповісти — нова війна в наших нинішніх умовах буде самогубством."
  nf_trr.13.a:0 "Брудний трюк!"
  nf_trr.13.b:0 "Вони за це заплатять!"

  nf_trr.14.t:0 "Канадський Ренесанс"
  nf_trr.14.d:0 "Порти Трьох Річок знову відкриті для торгівлі, й обсяги комерції сягнули рівнів, небачених від часів до Першої Республіканської війни!\n\nЕкономіки країн Другої Коаліції лише зміцняться завдяки цьому."
  nf_trr.14.a:0 "Чудово."

  nf_trr.15.t:0 "Північне Сяйво"
  nf_trr.15.d:0 "Ми щойно підписали Наукову Угоду Північного Сяйва. Наші вчені вже обмінюються кресленнями та проривами у сферах промисловості й електроніки з іншими учасниками Другої Коаліції."
  nf_trr.15.a:0 "Сяйво Півночі осліпить монархістів!"