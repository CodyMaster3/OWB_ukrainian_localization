l_english:
  #2/19/24 Я щиро зневажаю того, хто запхав усе в один документ. Хоч тепер воно хоч трохи розбите – Слаппі
  wpg_protect_the_weak: "Захищай Слабких, Борись за Свої Права"
  wpg_protect_the_weak_desc:0 "Три Річки — це стіл для народу, що вмів сказати: «Досить, далі — ні кроку». Народу, який повстав проти Короля, що став Тираном."

  wpg_build_this_land_together: "І Разом Збудуємо Цю Землю"
  wpg_build_this_land_together_desc:0 "Ремісники, фермери й пілоти дирижаблів працювали разом під час Революції. Це було не просто сепаратистське повстання — це була народна війна, якої не бачили ще з часів КПФ."

  wpg_maple_leaf_forever: "А Над Нами Сяє Північне Сяйво — І Кленовий Лист Назавжди"
  wpg_maple_leaf_forever_desc:0 "Ми не ідеальні? Так. Але розбіжності в тому, як боронити свої права, ніколи не означатимуть, що ми знову привітаємо короля."

  wpg_crack_down_on_disloyal_farmers: "Придушити Сільське Невдоволення"
  wpg_crack_down_on_disloyal_farmers_desc:0 "З першим холодом урожайного сезону наші поля мовчать... Урожай почав застоюватись через заворушення серед польових працівників. Можливо, настав час діяти — делікатно, але наполегливо?"

  wpg_negotiate_with_farmers: "Переговори з Польовими Працівниками"
  wpg_negotiate_with_farmers_desc:0 "Фермери — основа нашого суспільства, адже саме вони годують нас. Ми маємо вислухати їхні вимоги та знайти компроміс."

  wpg_arrest_ringleaders: "Арештувати Підбурювачів"
  wpg_arrest_ringleaders_desc:0 "Наші розслідування довели, що саме кілька ключових постатей спровокували хвилю громадянських заворушень. Вони загрожують нашому добробуту й єдності — їх слід заарештувати й належно покарати."

  wpg_build_rural_infrastructure: "Розвивати Сільську Інфраструктуру"
  wpg_build_rural_infrastructure_desc:0 "Землі вздовж річок багаті на ресурси й чекають лише на дороги. Але перед цим — дика, розросла природа. Давайте впорядкуємо нашу землю задля довгоочікуваної інфраструктури."

  wpg_promise_land_reform: "Обіцянка Землеволодіння"
  wpg_promise_land_reform_desc:0 "Переговори з польовими працівниками дали плоди. Ми досягли домовленості: за віддану працю — право на землю. Залишилося лише підписати документи."

  wpg_compensate_land_owners: "Компенсувати Землевласникам"
  wpg_compensate_land_owners_desc:0 "Після арештів підбурювачів зміни в управлінні та структурі роботи сколихнули суспільство. Щоб заспокоїти обурення — компенсуймо втрати землевласникам."

  wpg_promote_republican_ideas: "Пропагувати Республіканські Ідеї"
  wpg_promote_republican_ideas_desc:0 "Добра воля, яку ми здобули серед фермерів, зробила їх відкритішими до слухання. Із зростанням нашої нації ми маємо бути єдині — спершу в праці, а тоді в ідеях."

  wpg_complete_land_reform: "Завершити Земельну Реформу"
  wpg_complete_land_reform_desc:0 "Останні джерела спротиву знешкоджено — настав час завершити земельну реформу: позбавити впертих привілейованих влади й повернути землю відповідальним господарям."

  wpg_relax_brewing_laws: "Послабити Закони про Пивоваріння"
  wpg_relax_brewing_laws_desc:0 "Останні зміни в земельному питанні викликали чимало стресу. А стрес — ворог нації. Чому б не послабити пивоварні закони, щоб дати людям розслабитись?"

  wpg_bureau_of_intelligence: "Розширити Бюро Розвідки"
  wpg_bureau_of_intelligence_desc:0 "Щоб припиняти біду ще в зародку, потрібне уважне й непомітне око в самому корені нації. Розширення бюро — в наших найкращих інтересах."

  wpg_beer_rations: "Видавати Пивні Раціони"
  wpg_beer_rations_desc:0 "Нові пивоварні закони дали поштовх до радості й культури — тепер пиво стало частиною життя. Воно зігріває і шлунок, і душу. Ідеальний засіб для втомленого солдата!"

  wpg_honey_bank:0 "Медовий Резерв"
  wpg_honey_bank_desc:0 "Ідея «Медових Банків» належала божевільному пасічнику ще до війни: перехід на валюту, забезпечену медом. Ідея й тоді була дивною — і досі не надто нормальна. Але ми можемо зміцнити довіру до нашої валюти, забезпечивши 5% її резерву медом, який можна обміняти на справжнє солодке золото."

  wpg_northend_development_project: "Проєкт Розвитку Нортенду"
  wpg_northend_development_project_desc:0 "Маючи і ресурси, і мотивацію громадян, ми можемо розпочати Проєкт Розвитку Нортенду! Пустельні землі Трьох Річок незабаром засяють своїм промисловим потенціалом."

  wpg_stainback_reclamation: "Реінтеграція Стейнбека"
  wpg_stainback_reclamation_desc:0 "Про Стейнбек давно забули — навіть про те, що він належить нам. Тепер, коли інші землі процвітають, може час знову звернути увагу на нього?"

  wpg_transcona_bridge: "Міст Транскона"
  wpg_transcona_bridge_desc:0 "У глибинах вод лежать залишки арок і іржавих балок. Колись це був величний залізничний міст — тепер це і спогад, і можливість. Відновлення моста може відкрити нову еру промислового зростання."

  wpg_resettle_elements_of_dissent: "Медовий Стандарт"
  wpg_resettle_elements_of_dissent_desc:0 "Під час розчищення лісів наші люди натрапили на величезний довоєнний об'єкт зі зберігання меду, що наштовхнуло деяких на геніальну ідею."

  wpg_feed_people: "Нагодувати Народ"
  wpg_feed_people_desc:0 "Маючи під контролем як міст, так і території Стейнбека, ми очікуємо значного зростання добробуту наших громадян! Продовжуймо вдосконалення для повного розквіту."

  wpg_solve_energy_shortage: "Вирішити Енергетичну Кризу"
  wpg_solve_energy_shortage_desc:0 "У Стейнбеку ми знайшли довоєнний завод сонячних панелей. Дослідники зазначають, що якщо вдасться його відновити, виробленої енергії вистачить на все Три Річки — і навіть більше. Перемістити туди найкращих інженерів і науковців — наш пріоритет."

  wpg_velvet_glove: "У Бархатній Рукавиці"
  wpg_velvet_glove_desc:0 "І завіса падає...\n\nПо мірі того, як Три Річки процвітають — у промисловості та якості життя — Сенат накопичив достатньо впливу, аби покласти край боротьбі за владу. Час обрізати всі слабкі вузли?"

  wpg_loyal_military: "Віддана Армія"
  wpg_loyal_military_desc:0 "На щастя, армія нашої великої республіки служить не особистості Стіл, а демократії. Поговоривши з високими офіцерами, ми зможемо зміцнити свою підтримку серед солдатів."

  wpg_shared_prosperity: "Спільний Добробут"
  wpg_shared_prosperity_desc:0 "Наша Республіка є символом свободи та достатку для всіх, хто шукає кращого життя у пустці. Завдяки успішній імміграції — процвітання дістається кожному нашому громадянину."

  wpg_public_housing: "Проєкт Масового Будівництва"
  wpg_public_housing_desc:0 "Щоб здобути підтримку громадян нашої славетної демократії, ми маємо показати, що дбаємо про них. Фінансування масштабного будівництва по всій республіці точно принесе тисячі голосів."

  wpg_master_waves: "Володарі Хвиль"
  wpg_master_waves_desc:0 "Справжня сила Республіки — наш контроль над навколишніми водами. Щоб утримати владу, ми мусимо посилити морську присутність. Моряки Уінніпеґа викликатимуть страх однією лише своєю появою."

  wpg_private_security_forces: "Приватні Сили Безпеки"
  wpg_private_security_forces_desc:0 "Сенат повинен мати власні сили безпеки, щоб протистояти зовнішньому втручанню. Ми зможемо ухвалити закон про фінансування приватного ополчення з найвідданіших громадян, що служитимуть лише інтересам демократії."

  wpg_hudson_bay_trade: "Торгівля Через Гудзонову затоку"
  wpg_hudson_bay_trade_desc:0 "Потоки торгівлі через Гудзонову затоку вичерпались через мілітаризм Елуа Стіл. Можливо, ми зможемо полегшити ситуацію, знизивши мита та чітко заявивши про відкритість Сенату. Налагодити зв’язки з усіма портами затоки буде непросто."

  wpg_coral_harbor: "Коралова Гавань"
  wpg_coral_harbor_desc:0 "Коралова Гавань — ідеальне місце для рибалок, аби збиратись і вести торгівлю. Створивши там центр рибного ринку, ми забезпечимо собі щотижневу зупинку для тисяч канадських родин на шляху по річках."

  wpg_james_bay: "Затока Джеймса"
  wpg_james_bay_desc:0 "Багаті на нафту глибини затоки Джеймса — ідеальне місце для торгових суден і кораблів нашого флоту. Прямий торговельний маршрут та береговий форпост дадуть нам величезні переваги."

  wpg_cape_smith: "Мис Сміт"
  wpg_cape_smith_desc:0 "Швидкі течії й мілководдя мису Сміта ідеально підходять для дрібного бізнесу — видобутку сталі й виробництва зброї. Ми легко зможемо закупити лісоматеріали для кількох фабрик у регіоні."

  wpg_fort_nelson: "Форт Нельсон"
  wpg_fort_nelson_desc:0 "Відновлений Форт Нельсон багатий на озброєння й спорядження, які можуть допомогти армії Республіки. Якщо ми організуємо скупку зброї в регіоні, зможемо швидко спорядити цілий гарнізон."

  wpg_churchill: "Черчілл"
  wpg_churchill_desc:0 "Черчілл — ідеальний вихід до Гудзонової затоки. Ми легко зможемо його контролювати, якщо збудуємо кілька постів і встановимо браму для запобігання доступу чорним торговцям до нашої процвітаючої затоки."

  wpg_hegemony_over_the_bay: "Угода Завершена"
  wpg_hegemony_over_the_bay_desc:0 "Народ Республіки мріяв про відродження Гудзонової затоки до довоєнного процвітання. Завдяки зусиллям Сенату це стало реальністю. І громадяни без сумніву визнають це великою перемогою."

  wpg_revolutionary_generals: "Генерали Революції"
  wpg_revolutionary_generals_desc:0 "«І от лежу я, повалений, без вдачі, з поламаною ногою... чи двома. Перестав рахувати, як тільки впав. Аж раптом з диму з’явились Вілсон і Сміт, витягли мене й кричали на всіх навколо. Якщо хтось і заслуговує на підвищення — то це вони.» — Солдат Трьох Річок"

  wpg_new_draft: "Новий Призов"
  wpg_new_draft_desc:0 "Нові командири надихнули мешканців диких боліт озброїтися задля захисту своїх спільнот. Їхнє знання місцевості відрізняє їх від інших загонів. Забезпечмо їх ресурсами та підготовкою, щоб зробити їх ефективними."

  wpg_republican_reserves: "Заклик Резервістів"
  wpg_republican_reserves_desc:0 "У ці тяжкі часи нам потрібні всі руки. Закликаємо резервістів! Нехай знають — ми потребуємо їх, як ніколи. Бо без руки, що варить і кує — немає майбутнього."

  wpg_joint_army_exercises: "Спільні Навчання"
  wpg_joint_army_exercises_desc:0 "Новий призов поволі звикає до обов’язків. Наша головна армія може показати їм декілька прийомів. Об’єднаймо їхній розклад із нашим."

  wpg_insterservice_wargames: "Міжвідомчі Військові Ігри"
  wpg_insterservice_wargames_desc:0 "Ми карали офіцерів за забавки з фішками на карті... Та схоже, розігрування гіпотетичних сценаріїв може бути надзвичайно корисним. Звісно, з менше пафосу — й більше тактики."

  wpg_free_navy: "Флот Вільних"
  wpg_free_navy_desc:0 "Можливість — для тих, хто її бере. І на землі, і на воді. Канали навколо — наша перевага. Ми були б дурнями, якби не зібрали потужного флоту. Почнімо вербування."

  wpg_marine_corps: "Корпус Морської Піхоти"
  wpg_marine_corps_desc:0 "Після створення Вільного Флоту наші спецпідрозділи починають опановувати хвилі. Але межі немає. Надішлімо їх на інтенсивну підготовку — й повернуться вони новими."

  wpg_recon_troopers: "Розвідники"
  wpg_recon_troopers_desc:0 "Немає кращих, ніж наш морський корпус. Багато хто з них прагне вийти на новий рівень. Зберімо ресурси — і створімо підрозділи розвідників!"

  wpg_doing_their_part: "Кожен Робить Свій Внесок"
  wpg_doing_their_part_desc:0 "Жінки Республіки надто довго залишались у тіні. Кожен має право розкрити свій талант. Перший крок — оголосити про це: в усній пропаганді та кольорових листівках."

  wpg_iron_brigade: "Залізна Бригада"
  wpg_iron_brigade_desc:0 "Коли з горизонту наближаються солдати в залізі, громадяни Республіки можуть видихнути з полегшенням. \n\n«Залізна Бригада — наш щит! Залізна Бригада — наш шлях!»"

  wpg_roach_king_reclamation: "Розчавити Таргана"
  wpg_roach_king_reclamation_desc:0 "Пошепки розповідають про огидного, невимовного чоловіка з півдня. Кажуть, що таргани та радіоактивні рослини слухають його. Ми не знаємо як — але одне зрозуміло: таргана треба розчавити."

  wpg_roach_king_core: "Звільнити Ґріфтон"
  wpg_roach_king_core_desc:0 "І, як у всіх великих фіналах, король падає…\n\nАле залишилось багато вузлів, які треба розплутати й спалити. Візьмімось за справу й очистімо Ґріфтон від жахливої зарази."

  wpg_truest_friend_of_revolution: "Найвірніший Друг Революції"
  wpg_truest_friend_of_revolution_desc:0 "Жоден прогрес не обходиться без суворих методів. Хоч ці підходи й засуджували за грубість — вони надійні. А яка ж це революція — без старих добрих перевірених засобів?"

  wpg_old_friend: "Закликати Старого Друга"
  wpg_old_friend_desc:0 "Готуючись до війни з Манітобою, не можемо гаяти жодного дня. Закличмо наших давніх союзників і вождів! Якщо вони відгукнуться — перемога буде ближчою, ніж здається!"

  wpg_albert_invite: "Угода з Принцом Альбертом"
  wpg_albert_invite_desc:0 "Буде розумно звернутися до потенційних союзників перед війною з Королівством. Подивимось, чи вистачить Джохану Альберту відваги..."

  wpg_fist_of_iron_first_of_steel: "Одна Рука — Залізо, Інша — Сталь"
  wpg_fist_of_iron_first_of_steel_desc:0 "Наші амбіції зростають — і з ними має зрости сила. Без достатньо силовиків для наведення порядку, наші плани занепадуть у злочинності й хаосі. Це наш обов'язок — тримати зло під контролем."

  wpg_defenders_republic: "Захисники Республіки"
  wpg_defenders_republic_desc:0 "Маємо продовжити заклик до дії — за майбутнє без королів. Хай дух захисників запалає в серцях усіх, хто готовий боротись. Вони об’єднуються серцем. Вони перемагають духом!"

  wpg_heart_of_steele: "Серце Стіл"
  wpg_heart_of_steele_desc:0 "«Ще молодим командиром я бачила, яку ціну має війна. Бюрократи, повстанці — і люди, що гризуться між собою. Ніколи б не уявила, що один дзвінок зробить мене Президентом Республіки. Але от я — безсумнівна. Народе, знайте — ви в надійних руках. А для непокірних? Йдіть, доки можете.» — Елуа Стіл"

  wpg_army_of_republic: "Армія Республіки"
  wpg_army_of_republic_desc:0 "Наша армія бореться — аби інші не мусили. Ми терпимо біль і безсонні ночі, щоб наша земля була вільна від тиранів. Щоб забезпечити майбутнє — маємо розбудувати військо в щось більше, сильніше. У Велику Армію Республіки."

  wpg_commoners_rifle: "Гвинтівка Простолюдина"
  wpg_commoners_rifle_desc:0 "У простій зброї є особлива краса — вона уособлює прості часи. Але стріляти з гвинтівки — одне, а розуміти її — інше. Якщо ми вкладемо ресурси у розбір і дослідження старої зброї, це може дати несподівані інновації."

  wpg_farmer_militia: "Селянське Ополчення"
  wpg_farmer_militia_desc:0 "Хоч наша армія й стійка, ми були б дурнями, якби позбавили громадян права на самозахист. Чесно й справедливо — дати кожному хороброму серцю Трьох Річок можливість носити зброю та боронити свій дім!"

  wpg_maintain_advantage: "Утримати Перевагу"
  wpg_maintain_advantage_desc:0 "Навіть коли хвилі вщухають — ми не маємо. Розширімо тренування нашого флоту новими вправами — бо досконалість народжується у випробуваннях!"

  wpg_master_of_navigation: "Майстри Навігації"
  wpg_master_of_navigation_desc:0 "Під водною поверхнею — невідомий світ, сповнений створінь і течій. Наші дослідники радять вивчати маршрути подорожей, щоби обрати найкращі — непомітні чи блискавичні."

  wpg_winipeg_arsenal: "Арсенал Уінніпеґа"
  wpg_winipeg_arsenal_desc:0 "Нехай усі, хто побачить наші судна, знають: з брудного початку ми піднялися до панування на озерах. Республіка — перша, хто досягла такого, і ми ще не завершили шлях."

  wpg_the_pelican: "«Пелікан»"
  wpg_the_pelican_desc:0 "Під час розвідки один з наших підрозділів виявив покинутий корабель у чудовому стані. На його борту напис — «Пелікан». Витягнімо його на берег для дослідження!"

  wpg_mandatory_rowing_exercises: "Обов’язкові Веслувальні Вправи"
  wpg_mandatory_rowing_exercises_desc:0 "Важливо повернутись до основ мореплавства. До моторів були весла, до стальних гігантів — човни. Якщо корабель тоне, наш флот має знати, як діяти. По одному гребку за раз."

  wpg_power_armor: "Таємні Контакти"
  wpg_power_armor_desc:0 "Ми встановили цікаві зв’язки за межами узбережжя. Група бронникiв представила нам зразки механізованої броні, яких ми ще не бачили. Ціни довгі, варіанти — цікаві. Розпочати перемовини?"

  wpg_licensed_production_of_vault_tec_armor: "Почати Ліцензоване Виробництво"
  wpg_licensed_production_of_vault_tec_armor_desc:0 "Як знак довіри першому покупцеві, нам передано креслення броні Vault-Tec.\n\n«Зручно, міцно, й модно — з правильною фарбою!»"

  wpg_canadian_models: "Наші Канадські Моделі"
  wpg_canadian_models_desc:0 "Ми подали запит на власний варіант броні — і на диво, нас підтримали! Хоча вони такого ще не робили, майстри надали нам засоби для створення креслень і виробництва."

  wpg_buy_latest_model: "Придбати Найновішу Модель"
  wpg_buy_latest_model_desc:0 "Вражені нашою вдячністю, бронники представили нам новітню броню — «Енклейв», кажуть, рідко використовувалась.\n\n«Стильна, потужна — і чітко передає ваше послання.»"

  wpg_canadian_manufacturing_power_armor: "Ефективне Виробництво"
  wpg_canadian_manufacturing_power_armor_desc:0 "Першу партію нашої республіканської силової броні вже виготовлено! Армія в захваті. Продовжуємо виробництво — нехай наші солдати сяють у червоній сталі та з гербом на серці!"

  wpg_draft_best_and_brightest: "Призов Кращих і Яскравих"
  wpg_draft_best_and_brightest_desc:0 "Не кожен здатен тримати небо чи море. Нам потрібні найкращі. Серед наших громадян повно прихованих талантів — варто лише пошукати!"

  wpg_draft_female_aces: "Підтримати Асів-Серед-Жінок"
  wpg_draft_female_aces_desc:0 "«У наших пілотес є щось таке, чого я не бачив в інших. Єдність, харизма, сміливість. Даси їм завдання — виконають разом і миттєво. Я кажу — підвищити! Всіх!» — Барон МакҐрегор"

  wpg_strict_training_regimen: "Суворе Навчання"
  wpg_strict_training_regimen_desc:0 "Немає нічого трагічнішого, ніж падіння пілота. Лише сувора підготовка й дисципліна допоможуть уникнути втрат. Це — наша відповідальність. І їхня теж. До роботи!"

  wpg_aviation_club: "Авіаційний Клуб"
  wpg_aviation_club_desc:0 "Хоч Три Річки й оточені сушею та водою, багато хто мріє про небо. Чоловік на ім’я барон МакҐрегор неодноразово звертався з проханням відкрити Авіаклуб. Можливо, варто піти йому назустріч?"

  wpg_refurbish_airfields: "Відновити Аеродроми"
  wpg_refurbish_airfields_desc:0 "МакҐрегор у захваті від створення клубу. Він уже представив довгострокові плани, перший пункт яких — відновлення старих злітно-посадкових смуг. Навіть з мапою, яка більше за нього самого."

  wpg_buyout_prospectors: "Викупити Розробників"
  wpg_buyout_prospectors_desc:0 "Ресурси Республіки добрі, але МакҐрегор прагне більшого. Виробництво на півночі сповільнилось. Можливо, настав час піти на спеціальні домовленості для кращих результатів?"

  wpg_mad_baron: "Божевільний Барон"
  wpg_mad_baron_desc:0 "«Я дивлюсь у небо — й бачу майбутнє. Білі хмари й синє небо, тихі ночі й зорі. Але щоби це стало нашим? Повірте, я — саме та людина, яка вам потрібна.» — Сем МакҐрегор"
  wpg_mad_baron_tt:0 "\n§gБарон підніметься в небо, щоб захистити Республіку! І жодних запитань про те, чи є титул барона контрреволюційним.§!"

  wpg_found_academy_of_aviation: "Заснувати Академію Авіації"
  wpg_found_academy_of_aviation_desc:0 "Молодь Республіки з захопленням дивиться в небо; у їхніх серцях народжується нове прагнення, якого не було б без Авіаційного Клубу. Барон МакҐрегор пропонує створити Авіаційну Академію. Майбутнє — у руках молодих пілотів. Ми повинні дати їм засоби для успіху."

  wpg_scavenge_air_museum: "Обчистити Старий Авіамузей"
  wpg_scavenge_air_museum_desc:0 "Недалеко від кордону стоїть старий авіаційний музей. Ми здебільшого його ігнорували, але з урахуванням нових ініціатив барона МакҐрегора, доцільно повернутись туди й забрати все цінне."

  wpg_improve_our_doctrine: "Оновити Наші Доктрини"
  wpg_improve_our_doctrine_desc:0 "Застарілі доктрини — шлях до поразки… принаймні так кажуть. І краще не давати їм змоги довести правоту. Перегляньмо наші підходи, зокрема з урахуванням авіації — це зараз у тренді!"

  wpg_new_concepts_airship: "Застосувати Нові Концепції"
  wpg_new_concepts_airship_desc:0 "Старі креслення описують повітряні судна — «блімпи». Вони міцні й можуть вміщати цілі екіпажі: механіків, пілотів, навіть командирів. Захоплює, щонайменше. Варто дослідити?"

  wpg_republican_air_force_desc:0 "Хай наші літаки лишають слід у небі — це буде наша мітка на світі, мрія, що стала реальністю. Відблискуючи у синьому, червоному й білому, Повітряні Сили Республіки стануть силою, що несе відплату. Рекрути стануть асами, а аси — повелителями неба."

  wpg_new_prototype_desc:0 "Це називають колосальним — новий прототип на основі технології блімпів, небачений досі. Вміщує безліч пасажирів, витримує найгірші умови. Видовище, без перебільшення. Куємо наше повітряне майбутнє."

  wpg_root_out_corruption: "Викорінити Корупцію"
  wpg_root_out_corruption_desc:0 "Хоч Три Річки й не кланяються королю, корупція не дрімає — монархісти, змови, підривники. Ми маємо діяти рішуче й знищити рештки старого світу."

  wpg_curtail_elites: "Обмежити Торговельну Еліту"
  wpg_curtail_elites_desc:0 "Еліта надто довго впливала на наших торговців. Хто знає, скільки тіньових угод і сумнівного імпорту пройшло через наші кордони? Якщо не введемо обмеження зараз — втратимо контроль потім."

  wpg_in_lockstep: "Крок У Крок"
  wpg_in_lockstep_desc:0 "«Я пам’ятаю опис кроку в крок із старої військової книги. Щільне шикування рятувало нас, коли рішення треба було приймати миттєво. І ось я усвідомив — його навіть не викладають у нас. Збираймо солдатів, у нас є чому повчитись!» — Елуа Стіл"

  wpg_separation_church_state: "Відокремлення Церкви від Держави"
  wpg_separation_church_state_desc:0 "Хай згинуть старі вірування — щоб рухатися вперед, слід звільнити розум від ілюзій і зосередитись на реальності. Місіонери Старих Вірувань просочуються в наші землі. Звільнимо одурених від їхньої облуди?"

  wpg_scientific_guns: "Передові Озброєння"
  wpg_scientific_guns_desc:0 "У руїнах старого заводу наші шукачі знайшли креслення передової зброї. Хоч вони й потьмяніли з часом — наші найкращі фахівці можуть їх розшифрувати й повернути силу минулого."

  wpg_volunteer_deck: "Волонтерський Корпус Народу"
  wpg_volunteer_deck_desc:0 "Наші віддані солдати викликають захоплення. Багато охочих приходять у пункти вербування. Неочікувано — але приємно. Зберімо добровольців і розподілимо їх туди, де вони засяють."

  wpg_storm_monger_placeholder: "Смолоскип Цивілізації"
  wpg_storm_monger_placeholder_desc:0 "Чутки говорять про жінку, що править жорстоко, керуючись безглуздими пророцтвами. Вона — загроза. І ми маємо її зупинити."

  wpg_stop_train: "Зупинити Орду"
  wpg_stop_train_desc:0 "Дикі гуль-орди на заході — це проблема. Якщо її не стримати зараз, втрати будуть значно більшими. Пора показати, як ми зустрічаємо шалених і злих."

  wpg_fort_construction_boost: "Натхненням — Форт"
  wpg_fort_construction_boost_desc:0 "У старих будівельних посібниках описані грандіозні форти. Фантастика — та все ж вражає. Можемо адаптувати дизайн під наші потреби?"

  wpg_moose_jaw: "Фальшива Держава"
  wpg_moose_jaw_desc:0 "Здається, ці рейдери й хулігани так нічого й не вивчили з історії сусідів. [VSH.GetName] знову провокує нас на кордоні. Показати їм вихід?"

  wpg_keep_her_word: "Дотримання Слова"
  wpg_keep_her_word_desc:0 "«Я пообіцяла вам, коли вперше стала президентом, і знову, коли мене переобрали — що ви будете в добрих руках. Усі обіцянки я виконала. Бо серце народу — перше. Моє — друге.» — Елуа Стіл"

  wpg_lbierty_equality_kitty: "Свобода Та Рівність"
  wpg_lbierty_equality_kitty_desc:0 "«У снах я бачу світ для вільних і рівних. І прокинувшись, бачу його ще ясніше. До Стада — ми не повинні бути ворогами. Дозвольте мені змінити вашу думку. Одним чи іншим шляхом.» — Елуа Стіл"

  wpg_baron_rules: "На Крилах Свободи"
  wpg_baron_rules_desc:0 "«Старе й звичне нас підводило. Знову і знову — в історії й тепер. Але знаєте, що не підведе? Небо. Я дав цій нації те, про що інші могли тільки мріяти. Тож одягніть крила свободи, люди Республіки, — і вирушаймо разом!» — Барон МакҐрегор"

  wpg_advanced_wiring: "Передова Проводка"
  wpg_advanced_wiring_desc:0 "Наші техніки зробили прорив: передова система проводки. Але це не просто зв'язування дротів — це складна, продумана система. Залишилося трохи часу на її вдосконалення."

  wpg_flying_merchant: "Летючий Торговець"
  wpg_flying_merchant_desc:0 "Після розширення нашого авіапростору з’явився загадковий пілот — не з Республіки — на ім’я Фарріс. Летючий торговець запропонував виробничу схему, від якої «неможливо відмовитись».\n\n«Подякуєш потім, коли побачиш, як ресурси знову складаються в купи!» — Торговець Фарріс"

  wpg_magic_fuel_source: "Чарівне Паливо"
  wpg_magic_fuel_source_desc:0 "Хтось називає його чарівним, хтось — «Таємницею Аврори», але для нас це — справжнє диво. Ефективне, дешеве — наші вчені майже завершили його дослідження."

  wpg_air_patrols: "Повітряні Патрулі"
  wpg_air_patrols_desc:0 "Збільшення кількості патрулювань — корисне і для новачків, і для асів. Чим більше досвіду — тим краще! Звідси починається вдосконалення."

  wpg_government_contracts: "Роздати Державні Контракти"
  wpg_government_contracts_desc:0 "Кожен у Республіці може зробити свій внесок. Потрібен лише поштовх — і гарний чистий контракт. Дамо людям роботу, виграють і вони, і ми!"

  wpg_backroom_dealings: "Таємні Угоди"
  wpg_backroom_dealings_desc:0 "Чиста етика — це добре, але іноді вона гальмує прогрес. Навіщо обтяжувати народ такими проблемами? Краще вирішити все за зачиненими дверима."

  wpg_pardon_monarchist_scientists: "Помилувати Монархістських Вчених"
  wpg_pardon_monarchist_scientists_desc:0 "Хоч ми й вигнали монархістів із Республіки, разом із ними втрачено багато розумних голів. Можливо, слід пробачити тих, хто щиро хоче спокутувати й служити науці."

  wpg_master_aviation: "Майстри Авіації"
  wpg_master_aviation_desc:0 "Завдяки розумам, рукам і пілотам — ми далеко відійшли від скромного Авіаційного Клубу. Кажуть, небо — безмежне. І що воно не для нас. Але ми це не раз спростували. Прийшов час нового досягнення!"

  wpg_vertibirds: "Отримати Вертібьорди"
  wpg_vertibirds_desc:0 "Наші розвідники помітили довоєнні апарати у повітряному просторі Макартура — вертiбьорди. Величні, потужні. Вони краще послужать нам. Перейдемо в історію!"

  wpg_german_spec_ops_word: "Фальшірм'яґери"
  wpg_german_spec_ops_word_desc:0 "Ми готуємо новий корпус спеціальних військ. Повітряні десантники, які не бояться висоти й несуть кару зверху. Почнімо підготовку до їхньої появи!"

  wpg_old_world_blues: "Смуток Старого Світу"
  wpg_old_world_blues_desc:0 "Поширімо чудеса Республіки в навколишній світ. Бо ми — народ без королів, і без королів ми збудуємо світ, який запам’ятають. Якщо цей світ і впаде — нехай це буде світ старий, але пам’ятний, у відтінках синього."

  wpg_advanced_radar_desc:0 "Барон МакҐрегор пропонує спрямувати всі зусилля на розвиток передових радарних технологій. Лише випереджаючи ворогів, ми досягнемо процвітання."

  wpg_intellectual_popularism: "Інтелектуальний Популізм"
  wpg_intellectual_popularism_desc:0 "Великі уми — трон будь-якої великої цивілізації. Ми залишили прості початки позаду. Щоб майбутнє покоління мало шанс на краще, маємо живити їхній розум."

  rpg_reconvene_the_council: "Скликати Раду Знову"
  rpg_reconvene_the_council_desc:0 "Конфлікт між Королівством і повстанцями триває вже давно — найпесимістичніші вважають його вічним. Щоб змінити це, треба об’єднати сили народу Манітоби!"

  wpg_river_trade: "Річкова Торгівля"
  wpg_river_trade_desc: "Земля подарувала нам три річки, що розділяють наші землі. Ми були б дурнями, якби не використали їх для торгівлі."

  wpg_super_good_blimps_tt:0 "Відкриває нову дирижабельну компанію для §M[WPG.GetNAmeWithFlag].§!"

  wpg_hunt_aurora:0 "Полювання на «Аврору»"
  wpg_hunt_aurora_desc:0 "«Аврора» дрейфує над Канадою ще з Великої Війни, нагадуючи про прокляту владу Америки. Але тепер Барон простягає руку Народу, щоб здобути цей скарб. Хто знає, що ми знайдемо?"

  wpg_purge_the_rot_tt:0 "Знижує вартість інтеграції територій [DMM.GetNameDef] на §G30%§!."

  wpg_purge_the_rot:0 "Вичистити Гниль"
  wpg_purge_the_rot_desc:0 "У нових підкорених землях ховається зграя гуль-рейдерів. Ми відправимо солдатів, щоб вистежити й знищити цю загрозу. Нові громадяни оцінять такий акт щедрості."

  wpg_republican_air_force:0 "Повітряні Сили Республіки"
  wpg_advanced_radar:0 "Передовий Радар"
  wpg_new_prototype:0 "Новий Прототип"

  wpg_forge_of_democracy:0 "Кузня Демократії"
  wpg_forge_of_democracy_desc:0 "Під землею Кузні дзвенять молотами, продуктивнішими, ніж за останні століття. З часом ми довели, що гідні їхньої довіри. Вони стоять разом із Республікою!"
  wpg_forge_of_democracy_tt:0 "Якщо §M[GIM.GetNameWithFlag]§! приєдналися до Коаліції, вони стануть маріонеткою. Якщо ні — ми їх завоюємо."

  wpg_lucky_draw:0 "Щасливий Жереб"
  wpg_lucky_draw_desc:0 "Пані Удача прихильно поглянула на наше повстання. Схоже, Мускетери рушили проти своїх манітобських гнобителів — історія Давида і Голіафа, яку переповідатимуть покоління."

  wpg_bird_in_hand:0 "Птах у Руці"
  wpg_bird_in_hand_desc:0 "Ми тепло зустрінемо щойно звільнені території Манітоби, адже Мускетери довели свою відвагу й стали справжніми героями революції. Диктатора повалено — народ знову вільний."

  wpg_break_last_resistance:0 "Придушити Опір"
  wpg_break_last_resistance_desc:0 "Хоч більшість громадян нових регіонів хвалить наші зусилля, залишаються осередки, які чіпляються за свою тиранію. Ми знищимо цих упертих гнобителів."

  wpg_iron_chanceller:0 "Залізний Канцлер"
  wpg_iron_chanceller_desc:0 "Мускетери святкують свою перемогу над тиранією Манітоби, поширюючи дух братерства серед наших лав. Залізний Канцлер, який вів своїх солдатів із пристрастю, став легендою серед народу."

  wpg_guarantee_pensions:0 "Гарантувати Пенсії"
  wpg_guarantee_pensions_desc:0 "На знак подяки за хоробрість солдатів, що боролися проти Королівства Манітоби, ми спрямуємо частину бюджету на пенсійний фонд, аби їхні подвиги не залишилися без винагороди."

  wpg_rmm_folks_come_home:0 "Зустріти Мускетерів"
  wpg_rmm_folks_come_home_desc:0 "Хоч вони й гомінка компанія, Мускетери — справжні герої. Вони мужньо боролися з нездоланним ворогом і заслуговують на теплу зустріч. Наші громадяни будуть раді бачити своїх визволителів."

  wpg_social_welfare:0 "Соціальне Забезпечення"
  wpg_social_welfare_desc:0 "Тепер, коли загроза на кордонах зникла, ми можемо інвестувати більше в народ. Частину скарбниці звільненої Манітоби буде спрямовано на програму соціального захисту."

  wpg_spread_revolution:0 "Поширити Революцію"
  wpg_spread_revolution_desc:0 "Революція набирає обертів — час озирнутися навколо й побачити інші тиранічні режими, які слід повалити. Революція триватиме, доки пригноблені не звільняться від своїх катів."

  wpg_religious_tolerance:0 "Релігійна Терпимість"
  wpg_religious_tolerance_desc:0 "Старі Віруючі дотримуються феодальної віри, яка пригноблює завойованих. Ми прагнемо терпимості, але не можемо дозволити релігійним рейдерам обманом сковувати людей. Настав час визволення."

  wpg_mtc_wargoal:0 "Закрити Конгрес"
  wpg_mtc_wargoal_desc:0 "Конгрес Метисів — слабкий союз племен, що мовчки прийняв тиранію Манітоби. Якщо ми справді хочемо поширити революцію, мусимо знищити цей корумпований конгрес і показати його громадянам правду."

  wpg_northern_republic:0 "Відновлена Північна Демократія"
  wpg_northern_republic_desc:0 "Монархія Манітоби повалена, революція шириться Північчю — настав час оновити наше ім’я.\n\nВідтепер наші землі зватимуться §4Республіка Північного Сяйва§!, коли ми крокуємо в епоху поступу."

  wpg_form_second_coalition:0 "Друга Коаліція"
  wpg_form_second_coalition_desc:0 "Монархія Манітоби тримається вперто. Щоб повалити її, ми маємо згадати наші витоки й зібрати союзників у нову коаліцію. Разом ми зламаємо владу Короля."

  wpg_invite_gimli:0 "Розпалити Кузні"
  wpg_invite_gimli_desc:0 "Кузні Ґімлі завжди були для нас економічною опорою, хоча й не тісно пов’язаною. Якщо ми знову звернемось до них та інвестуємо — Друга Коаліція зможе краще озброїтися для фронту."

  wpg_invite_MTC:0 "Допомога Конгресу"
  wpg_invite_MTC_desc:0 "Конгрес Метисів колись був нашим союзником у боротьбі з монархією. Хоча тоді ми зазнали поразки, настав час знову звернутись до них — і вирушити на Брендон пліч-о-пліч, як колись."

  wpg_aid_fort_alexander:0 "Кузні Форту Александр"
  wpg_aid_fort_alexander_desc:0 "Форт Александр ніколи не був великою твердинею, але тепер — покинутий, занедбаний. Примарна руїна. Ми можемо зібрати залишки обладнання й перетворити форт на центр виробництва зброї."

  wpg_guerilla_experience:0 "Досвід Партизан"
  wpg_guerilla_experience_desc:0 "Щоб перемогти монархістів, треба порушити їхню дисципліну й формації. Ми навчимо своїх воїнів мистецтву партизанської війни — зброї проти непідготовленого ворога."

  wpg_restore_old_ties:0 "Відновлення Старих Зв'язків"
  wpg_restore_old_ties_desc:0 "Тепер, коли Конгрес знову готовий протистояти загрозі монархії разом з нами і ми відновили дипломатію, ми домовились спільно інвестувати в їхні робототехнічні технології, аби бути готовими до тиранічних орд."

  wpg_accept_american_values:0 "Прийняття Американських Цінностей"
  wpg_accept_american_values_desc:0 "Хоч мешканці Дакоти не надто співчувають нашій боротьбі, нам вдалося досягти кількох домовленостей, що забезпечать постачання ресурсів для війни. Вони обирають торгівлю замість солідарності — і хоч це суперечить деяким нашим цінностям, зайві гвинтівки нам не завадять."

  wpg_invite_ROL:0 "Спільне Коріння"
  wpg_invite_ROL_desc:0 "[ROL.GetNameDefCap] раніше були частиною володінь [BRA.GetAdjective], поки не здобули автономію після Першої Республіканської Війни. Хоч вони не боролися так завзято, як ми, навряд чи вони захочуть вдруге підкоритися [BRA.GetName]."

  wpg_affirm_religious_freedoms:0 "Підтвердити Релігійні Свободи"
  wpg_affirm_religious_freedoms_desc:0 "[ROL.GetNameDefCap] живуть чесним життям під проводом [ROL.GetLeader], допомагаючи іншим без корисливих намірів. Якщо ми дамо їм ту ж повагу, яку самі отримали, це лише зміцнить їх як союзника у Другій Коаліції."

  wpg_canadian_free_trade:0 "Відкриття Канадської Торгівлі"
  wpg_canadian_free_trade_desc:0 "Три Річки — ідеальне місце в канадській озерній системі, один з головних торгових портів. Але від початку війни з манітобською монархією торгівля занепала. Час відкрити ринки й пустити ріки валюти знову."

  wpg_research_pact_focus:0 "Наукові Угоди"
  wpg_research_pact_focus_desc:0 "Попри існування Другої Коаліції, ми досі не маємо формального обміну науковими досягненнями. Рішення є: створимо організацію з наших найкращих дослідників для обміну знаннями й недопущення технічного відставання союзників."

  wpg_liberate_neutral_zone:0 "Порушення Нейтралітету"
  wpg_liberate_neutral_zone_desc:0 "«Нейтральна Зона» Порто-Прарі давно служила буфером без справжнього управління. Якщо ми хочемо знищити тиранію — маємо усунути цю дипломатичну перешкоду й почати планування вторгнення."

  wpg_liberate_brandon:0 "Похід на Манітобу"
  wpg_liberate_brandon_desc:0 "Настав час покінчити з цією карикатурною монархією, що гнобить майбутньо вільний народ Манітоби. Цей день увійде в історію. Багато хто загине героїчно, але за справжню велику справу."

  wpg_propaganda_brandson:0 "Передати Повідомлення"
  wpg_propaganda_brandson_desc:0 "Тепер, коли Король і його іграшкова армія зазнали нашого удару, настав час донести до його підданих наші наміри — через ефірні хвилі пустоші."
  wpg_propaganda_brandson_tt:0 "\nЦе підвищить лояльність на колишніх територіях Королівства. Але спершу доведеться їх завоювати!"

  wpg_free_slaves:0 "Кінець Феодалізму"
  wpg_free_slaves_desc:0 "Рабство, яке Король називав феодалізмом, мусить бути знищене в самій основі. Багато хто досі не знає, що таке справжня свобода. Люди більше не працюватимуть без оплати в обмін на пусті обіцянки житла — їх слід звільнити."

  wpg_fate_queen:0 "Доля Королеви"
  wpg_fate_queen_desc:0 "Король отримав по заслузі. Але що нам робити з Королевою? Відповідь буде нелегкою, та остаточне рішення повинне бути справедливим — після того, як дізнаємось її істинну суть."

  wpg_merit_not_blood:0 "Не По Крові, А По Заслугах"
  wpg_merit_not_blood_desc:0 "Довго дворяни наживалися на праці пригноблених. Настав час зробити офіційну заяву: ми відкидаємо аристократію, де кров важливіша за справжні досягнення."

  wpg_confiscate_nobles_lands:0 "Конфіскація Дворянських Земель"
  wpg_confiscate_nobles_lands_desc:0 "Землі, якими користувалася знать для експлуатації, тепер порожні. Ми можемо передати їх під управління фермерів та інвестувати прибуток у розвиток Республіки."

  wpg_remember_the_fallen:0 "Пам’ятати Полеглих"
  wpg_remember_the_fallen_desc:0 "Хоробрі, хто повернув Манітобу, назавжди залишаться в історії Республіки як справжні герої. Ми знищили останні залишки влади Короля, а жителі Брендона вітають нас як визволителів та вшановують загиблих."

  wpg_twin_lakes:0 "Озерні Близнюки"
  wpg_twin_lakes_desc:0 "Наші два озера — серце економіки. Варто знову звернути увагу на їхні порти — і заручитись підтримкою громадськості для нових інвестицій."

  wpg_fortify_stonewall:0 "Зміцнення Стоунвола"
  wpg_fortify_stonewall_desc:0 "Феодальна держава Манітоба, розділена лише вузькою смугою землі, готується до конфлікту з нашою вільною республікою. Єдиний спосіб стримати таку потужну силу — укріпити вузькі проходи аванпостами."

  wpg_refurbish_fort_gary:0 "Гарнізон Форт Ґарі"
  wpg_refurbish_fort_gary_desc:0 "Форт Ґарі — покинута пам’ятка військової спадщини Старого Світу. Протягом століть він змінював власників, але все ще частково стоїть. Він може стати нашим головним бастіоном проти Королівства Манітоба."

  wpg_secret_armories:0 "Таємні Арсенали"
  wpg_secret_armories_desc:0 "Під час ремонту руїн Форту Ґарі ми знайшли неочікувану знахідку: повноцінну майстерню зі зброї, здатну озброїти дві дивізії. Хто її збудував — загадка, але обладнання можна відновити."

  wpg_arms_for_democracy:0 "Демократії Потрібна Сила"
  wpg_arms_for_democracy_desc:0 "Форт Ґарі — не лише ім’я, а символ надії. Отримати схвалення на будівництво нових майстерень у його надрах буде легко. Народ нас підтримає."

  wpg_penninsular_war:0 "Ув'язнити Хунту"
  wpg_penninsular_war_desc:0 "Хунта Арборґ незаконно володіє територіями Трьох Річок і править там залізною рукою. Настав час поширити повстання на північ і позбавити влади цих псевдо-тиранів."

  wpg_peaceful_integration:0 "Мирна Інтеграція"
  wpg_peaceful_integration_desc:0 "Люди, які були майже рабами під Хунтою, тепер вважають нас визволителями. Їхня вдячність та віра в повстання надихають наших солдатів."

  secure_northern_outpost:0 "Укріплення Північного Флангу"
  secure_northern_outpost_desc:0 "Ми розуміємо боротьбу громадян, що жили під Хунтою, але зараз важливіші справи. Елуа наказала нашим військам вирушити на північ і закріпитися на кордонах із рештками північних держав."

  wpg_secure_dammed:0 "Врятувати Проклятих"
  wpg_secure_dammed_desc:0 "«Прокляті» — слабка демократія, що бореться за виживання. Ми могли б анексувати їхні землі та показати перевагу життя під владою держави із залізною волею."

  wpg_welcome_back:0 "Повернення Домів"
  wpg_welcome_back_desc:0 "Території Порто-Прарі довелося тимчасово віддати заради вищого блага. Але нейтральна зона більше не має стратегічного значення — наша сила тепер дорівнює манітобській."

  wpg_develop_new_lands:0 "Очищення Незайманих Земель"
  wpg_develop_new_lands_desc:0 "Порто-Прарі колись був процвітаючим портом, але нині занедбаний. Керівники «Нейтральної Зони» не вміли керувати економікою. Ми використаємо недоторкані соснові ліси, поки ще не пізно."

  wpg_central_trade_hub:0 "Центральний Торговий Вузол"
  wpg_central_trade_hub_desc:0 "Республіка Трьох Річок має ідеальне географічне розташування між трьома судноплавними річками. Але інші користуються нашими водами без податків. Це має припинитись."

  wpg_north_end_markets:0 "Ринки Північного Краю"
  wpg_north_end_markets_desc:0 "Північний Край став домівкою для ремісників та працьовитих людей. Трохи інвестицій — і ми зможемо створити ринок, що обслуговуватиме мандрівників та місцевих."

  wpg_expand_roads:0 "Знову в Дорогу"
  wpg_expand_roads_desc:0 "Колись наші дороги були асфальтовані й прибиралися щомісяця. Тепер вони вкрита тріщинами й брудом. Якщо ми хочемо бути торговою державою — дороги слід терміново ремонтувати."

  wpg_civilians_fort_gary:0 "Майстерні Форту Ґарі"
  wpg_civilians_fort_gary_desc:0 "Форт Ґарі — наш найперспективніший проєкт. Щотижня туди з'їжджаються сотні охочих інвестувати. Підтримаємо їх, виділивши землю для будинків і поселень."

  wpg_public_schooling:0 "Громадська Освіта"
  wpg_public_schooling_desc:0 "Громадяни задоволені життям, але існує одна велика проблема — нестача освіти для дітей. Щоб стати цивілізованою нацією, ми маємо інвестувати в громадське навчання."

  wpg_freedoms_best_and_brightest:0 "Найкращі Сини Свободи"
  wpg_freedoms_best_and_brightest_desc:0 "Тепер наші діти — найосвіченіші в пустці. Вільна республіка під проводом Елуа вступає в нову еру — добу процвітання, знань і надії."

  wpg_southern_tools:0 "Інструменти Півдня"
  wpg_southern_tools_desc:0 "Південь республіки не найпродуктивніший, але має чимало інженерних талантів. Наприклад, фірма Старого Джорджа здатна розробити тисячі проєктів для підсилення нашої промисловості."

  wpg_construction_barges:0 "Будівельні Баржі"
  wpg_construction_barges_desc:0 "Хоча наша республіка має мало землі, ми все ще можемо використати навколишні води, застосовуючи баржі для перевезення матеріалів. Можливо, навіть вдасться збудувати кілька з кранами для пришвидшення будівництва портів."

  wpg_import_energy_cells:0 "Імпорт Енергетичних Елементів"
  wpg_import_energy_cells_desc:0 "Наша енергетична інфраструктура майже не існує і стрімко застаріває. На щастя, ми можемо знайти інше рішення — завдяки нашому розташуванню в пустці. Торгові ділки легко домовляться з сусідами про постачання енергії."

  wpg_building_factories_in_gary:0 "Ґаррі — Зброя для Народу"
  wpg_building_factories_in_gary_desc:0 "Вільні люди Трьох Річок обожнюють Форт Ґарі та його символізм. Сотні новонароджених тепер носять ім’я Ґаррі! Можливо, настав час відкинути обережність і вкласти половину нашої промисловості в розвиток улюбленого форту."
  wpg_building_factories_in_gary_tt:0 "§YФорт Ґарі§! додає:\nШвидкість будівництва §Yзбройових заводів§!: §G+45.00%§! на §Y300§! днів."

  wpg_vault_blues:0 "Смуток по Сховищах"
  wpg_vault_blues_desc:0 "Наші громадяни ніколи не бачили Сховище зсередини, але жадають бодай раз пожити в ньому. Можливо, ми зможемо укласти угоду з сусідніми Жителями Сховищ, щоб відтворити цю атмосферу в нашій майстерні."

  wpg_shop_in_gimli:0 "Крамниця Ґімлі"
  wpg_shop_in_gimli_desc:0 "Невисокі мешканці Ґімлі обожнюють свої кузні та молоти. Можливо, варто придбати частину химерних товарів, які їхні ремісники зробили від нудьги — зрештою, всі ми можемо загинути, борючись пліч-о-пліч із другом."

  wpg_ally_riders_heavenly_lady:0 "Мати Трохи Віри"
  wpg_ally_riders_heavenly_lady_desc:0 "Старовіри — релігійні фанатики, які здебільшого займаються лише хрестовими походами й розп’яттями. Але, можливо, вони погодяться на нашу покупку частини їхньої промисловості як «відпущення гріхів»."

  wpg_friends_of_dramatae:0 "Драматичний Театр"
  wpg_friends_of_dramatae_desc:0 "Театральні фанатики й наркомани джету з Драматеї люблять усе театральне. Домовлятися з ними — дурня, але спробувати варто. Сумніваюся, що Слім не приховує ядерну бомбу чи величезний завод десь про запас."

  wpg_stampede:0 "Зустріч із Метисами"
  wpg_stampede_desc:0 "Метиси — унікальні в Преріях завдяки своїм знанням у сфері робототехніки. Можливо, ми зможемо повчитися в них чомусь корисному."

  wpg_nunavut_ties:0 "Зв'язки з Нунавутом"
  wpg_nunavut_ties_desc:0 "Заледенілі громадяни Нунавуту — далекої північної нації за Великою Білою Стіною — обожнюють свої бурильні установки та нафтові родовища. Можливо, ми домовимось про придбання частини їхніх технологій. Інакше — я просто заберу Нунавут!"

  wpg_smuggle_neutral_zone:0 "Контрабанда через Нейтральну Зону"
  wpg_smuggle_neutral_zone_desc:0 "Брутальні бюрократи з демілітаризованої зони Манітоби запропонували нам угоду: придбати права на ресурси в їхній землі після того, як вони не змогли їх використати. Якщо все зробимо таємно — манітобці нічого не дізнаються."

