  ### Characters
STA_DUALITY_NAME: "Пара"
STA_DUALITY_DESC: "Великою Зграєю керують дві великі родини: Локгарти і Санделли.\n\nДжон Локгарт був фронтирником, некерованим громадянином Канадського Народного Фронту, який став борцем за волю й тепер є символом опору. Він і його рід керуються 'давнім законом' та фронтирною справедливістю.\n\nЕмі-Лі Санделл походить із племен біля Стуна, витіснених партією Кульбаб і хворобами. Саме вона привела свій народ в Альберту, де допомогла Локгартам перемогти бандитів і псевдореспубліки.\n\nТепер вони ведуть Велику Зграю разом — як чоловік і дружина."

STA_sundell_name:0 "Емі-Лі Санделл"
STA_army_sundell_chief_desc:0 "Санделли ніколи не здаються — хоча їм довелося витримати чимало випробувань. Їхній шлях пролягав через темні ліси й ще темніші вчинки, залишивши на них криваві сліди. Але тепер, тримаючись за руки з родом Локгартів, попереду світліші дні.\n\nЕмі зробила все, щоб урятувати своїх: розумом, чаром, силою. Вона сподівається, що більше ніколи не доведеться їсти плоть мислячих людей заради виживання. У любові до Джона вона знаходить спокій."

STA_lockheart_name:0 "Джон Локгарт"
STA_army_lockheart_chief_desc:0 "Стійкість — головна риса роду Локгартів. Саме завдяки їй вони пережили тиранію КНФ, здобули степи й разом із Санделлами вигнали Кабських Стерв'ятників.\n\nАле Джон навчився чогось особливого у тій війні: сила — не в жорсткості чи впертості, а в любові. У любові, яку він віднайшов у своїй дружині — Емі."

STA_mickey_name:0 "Міккі Томпсон"
STA_mickey_high_command_desc:0 "Багато хто з Локгартів — майстри дуелі, але Міккі — особливий. Не з мечем, як їхній Патріарх, а з револьвером.\n\nКажуть, він виріс із пістолетом у руках, стріляючи по мухах з дитинства. А може, знайшов проклятий револьвер у супермаркеті. А може, прочитав комікс про ковбоїв і не зміг зупинитися. Як би там не було — до нього їдуть з усього півночі, щоб побачити його трюки... або кинути йому виклик під дзвін полудня."

STA_sara_name:0 "Сара"
STA_sara_high_command_desc:0 ""  # Немає тексту в оригіналі

STA_liam_name:0 "Ліам Ґабріел"
STA_liam_economic_desc:0 "Дітей Канадського Народного Фронту виховують на казках про перемоги комунізму — минулі, теперішні й майбутні. Та коли дійсність не збігається з міфами... дехто не витримує.\n\nЛіам був водієм у «Списі» КНФ — бронетанковому підрозділі. Спершу вантажівка, а потім — повноцінний радянський танк. Та чим більше розвалювався Фронт під тягарем власних вад, тим глибше в Ліама вивітрювалась віра в ідеали. Останній бій з Локгартами й Санделлами поклав край цій вірі — його танк був знищений, а сам він єдиний вижив і потрапив у полон.\n\nЧому Стампід не вбив його одразу — він досі не знає. Але з часом він довів, що може лишити минуле позаду й жити по-новому. Тепер Ліам навчає ремісників Локгартів поводженню з технікою, і виховує нове покоління механіків, здатних дати фору КНФ, Стерв'ятникам з Кабу й усім канадським чорно-руким."

STA_valerie_name:0 "Валері Омаїма"
STA_valerie_cultural_desc:0 "Коли Емі-Лі припинила людоїдські звичаї Санделлів, Валері була ще дитиною. Але не такою малою, щоб не скуштувати... чи щоб не відчути смак.\n\nМинули роки, вона стала воїном, слухала промови Матріарха, робила вигляд перед Локгартами. Але жагу так і не змогла втамувати. Більшість племені забули про це. Та все ще знаходяться ті, хто в темні ночі збирається в лісі, щоб влаштувати опівнічну трапезу з тіл полеглих..."

STA_old_zed_name:0 "Старий Зед"
STA_old_zed_economic_desc:0 "Деякі родини Стерв'ятників більше тямили в техніці, ніж у війні. Старий Зед — голова однієї з таких. З буркотливим характером і майстерністю, він — живий архів старого технічного світу. Його родина — майстри у відновленні й переобладнанні старої техніки, з опертям на невелику бібліотеку допотопних інструкцій.\n\nЗеда мало турбує, хто зараз керує Альбертою — аби лише в нього було місце для роботи й простір для життя."

