sta_debuff_recovering_from_kingsley:0 "Рани Кінґслі"
sta_debuff_recovering_from_kingsley_desc:0 "Із усіх ворогів юної Стампід найбільшим викликом стали люди Кінґслі. Обмануті купцями, вони вірили в казку про «Три Ріки» — а насправді служили замаскованій аристократії. Купців уже немає, мир панує, але попіл республіки все ще пече язика."
