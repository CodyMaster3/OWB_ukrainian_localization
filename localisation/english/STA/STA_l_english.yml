##events

nf_sta.1.t:0 "Народний Фронт Канади"
nf_sta.1.d:0 "Народний Фронт Канади — державна катастрофа, яка давно почала розпадатися. Сім років тому східна Альберта вирвалася з-під його контролю — і з неї виросло кілька націєподібних утворень, кожне з яких намагалося захопити уламки минулого. Але з усіх них, лише двоє вистояли, і з двох постала одна: Велика Зграя. Об'єднання прикордонників, племен і тих, хто втомився жити під п’ятою багряних володарів. Люди, які хотіли ВІД життя більшого, ніж просто підкорятися Короні або Раді. Багато хто знайшов спокій у стилі життя Локгартів або Санделлів: хтось через родео й кочове господарство, інші — через племінне землеробство. Вперше життя стало простим. Вперше — тихим. І нарешті воно стало про ближнього, а не про увесь світ."
nf_sta.1.a:0 "Люди раділи, працюючи разом заради творення."
nf_sta.1.b:0 "Кожен допомагав, як міг."
nf_sta.1.c:0 "Обмін — за власним вибором."

nf_sta.2.t:0 "У Кожному Серці — Мрія"
nf_sta.2.d:0 "У серці кожного чоловіка й жінки на степах Альберти живе мрія. І вже тричі вона була зруйнована: вперше — світом до війни, американськими чоботами й канадською бездарністю; вдруге — ядерним армагеддоном та наслідками опромінення; втретє — Народним Фронтом Канади, що знову і знову летів до сонця, поки не згорів.\n\nУ серцях цих прикордонників живе одне бажання: мир. Зграя смілива; відважна. Вона не має єдиного правителя — її веде любов народу, любов, породжена Джоном Локгартом і Емі-Лі Санделл. Проте цю пристрасть не народжують ні дзижчання цикад у нічній тиші, ні солодкий вітер прерій, а лише амбіції та завзятість. Ті, хто полишив НФК заради Зграї, вірили в себе. І в те, що є щось більше, ніж вони самі. Спільна мета. Вільний захисник, що прожене усяке зло."
nf_sta.2.a:0 "Локгарти були рукою, що вела."
nf_sta.2.b:0 "Спадщину Санделлів не забудеш."

nf_sta.3.t:0 "З Двох Постає Одне"
nf_sta.3.d:0 "З мрій цієї землі та її народу Локгарти й Санделли об’єдналися. Дві родини, одна — з заходу, інша — зі сходу, були з’єднані шлюбом. Святкування відбулося у найкращому місті фронтиру — Ґрейстейблсі, місті брухту, домі вигнанців і загублених на півночі. Тих, хто не пройшов у Притулок, але хотів жити вільно.\n\nЛокгарти — аристократія фронтиру. Саме вони колись відкинули НФК на північний захід, чим заклали Залізні Лінії на наших західних рубежах.\n\nСанделли ж — з темних лісів, і минуле їх було тернисте. Але через фронтир вони піднялися, стали прикладом для знедолених.\n\nЧерез ці дві родини Альберта й Саскачеван знайшли надію. І з ними — своє майбутнє."
nf_sta.3.a:0 "Краса на відкритому полі."

nf_sta.4.t:0 "Світло в Ґрейстейблсі!"
nf_sta.4.d:0 "Сьогодні — історичний день для народу степів Альберти. Сьогодні в місті-скрапі Ґрейстейблс електрика вперше пройшла на милю — завдяки новим вітрякам за містом!"
nf_sta.4.a:0 "Співпраця веде до прогресу!"

nf_sta.5.t:0 "Порушники на Наших Кордонах"
nf_sta.5.d:0 "На наших землях помічено людей зі Зграї, втім, їх не вдалося затримати. Схоже, вони щось обговорювали зі старими з Вермільйона..."
nf_sta.5.a:0 "Повстанці й надалі плестимуть змови."

nf_sta.6.t:0 "Дуелянтам зі Стуна"

nf_sta.7.t:0 "Швидке Заселення Півночі?"
nf_sta.7.d:0 "Рух на півночі — позначено як: зовнішній нетрі. Немає жодних записів про це місце. Що вони роблять? Чому збираються на моїх — наших — кордонах? Це почуття — знайоме, але події — нові. Хто вони? Що вони роблять? Що вони роблять? Що вони роблять?"
nf_sta.7.a:0 "ТІЛЬКИ НЕ ПІДХОДЬТЕ ДО МЕНЕ!"

nf_sta.8.t:0 "Напади на Північному Сході!"
nf_sta.8.d:0 "Бандити в районі Біггару нападають на прикордонників — але головне питання: звідки вони всі взялися?\n\nДеякі місцеві вже почали вершити 'прикордонне правосуддя', але ми зупинили це — поки що. Нам потрібні живі бандити. Ця активність занадто скоординована, щоб бути випадковістю. Хтось із них точно заговорить..."
nf_sta.8.a:0 "Нехай зірки помилують того, хто за цим стоїть."

nf_sta.9.t:0 "Одкровення"
nf_sta.9.d:0 "Після кількох днів допитів ми виявили спільну нитку серед нападників на шляху до Біггару: чоловіки зі Стуна з булавками у вигляді кульбаби платили їм. Обурення швидко зростає як серед Санделлів, так і серед Локгартів — слід діяти!"
nf_sta.9.a:0 "Джон Локгарт напише листа."
nf_sta.9.b:0 "Емі-Лі Санделл напише листа."

nf_sta.10.t:0 "Новини зі Зграї!"
nf_sta.10.d:0 "ШАНОВНОМУ ПАНУ П’ЄРУ СОЛОМОНУ, ПРЕДСТАВНИКУ ПАРТІЇ КУЛЬБАБИ В СТУНІ: \n\nЗ прикрими новинами я звертаюсь до вас, пане Соломон, уперше. Ідеться, звісно, про численні банди та розбійників поблизу Біггару, які, як вони самі кажуть, були найняті за ваші монети. \n\nЗазвичай я волію відповідати не лише словами, але, маючи дружину й народ, перед яким мушу тримати обличчя, я поки що обмежуся цим листом. Утім, гадаю, ви достатньо кмітливі, щоби зрозуміти, що подібна поведінка матиме наслідки. \n\nПрошу, сприйміть це повідомлення з усією серйозністю. Якщо ви розумна людина, чекаю у відповідь листа, в якому ви визнаєте мої застереження. \n\nЗ повагою, \n\nДжон Г. Локгарт"
nf_sta.10.a:0 "Ха-ха, ну й придурок. Та гаразд, хай буде."
nf_sta.10.b:0 "Вкусиш мене за зад, картопля фрі кучерява."

nf_sta.11.t:0 "Новини зі Зграї!"
nf_sta.11.d:0 "Пане Соломон: \n\nНавряд чи ви мене пам’ятаєте, але я вас — пам’ятаю. І дуже давно. Пам’ятаєте, як місяць сідав над Стуном, а по обрію лунали виття племен? Як чоловіки й жінки з рушницями та кийками виходили на вулиці, а кров заливала канави? \n\nВи зробили крок надто далеко, пославши до нас найманців. Моя відповідь проста: вам — ріки крові. Поверніться до свого гнилого міста та забудьте про нас. Вимовите наше ім’я знову — і якщо від вас залишиться хоч паста, вважайте, що пощастило. Бо, як ви маєте знати, мій народ не звик марнувати жодної частини. \n\nЯкщо ви зрозуміли натяк — надішліть нам свій лівий ікло. Я носитиму його як трофей. Інакше — вважайте нас ворогами. І ми зробимо з вами саме те, на що ви заслужили. \n\nЕмі-Лі Санделл"
nf_sta.11.a:0 "Мило. Ось, маю для тебе ікло..."
nf_sta.11.b:0 "Позіх. Ну давай, спробуй забрати його."

nf_sta.12.t:0 "Відповідь зі Стуна!"
nf_sta.12.d:0 "До пана ДЖОНА ЛОКГАРТА з ВЕЛИКОЇ ЗГРАЇ... \n\nЯ щиро перепрошую за ІНЦИДЕНТИ З БАНДИТАМИ В БІГГАРІ. Це питання обіцяли врегулювати ще коли я прийшов до влади. Те, що сталося — неприйнятно! \n\nЯ обіцяю діяти краще надалі. Але тільки з вашою підтримкою я зможу повністю покінчити з БАНДИТАМИ В БІГГАРІ. \n\nДякую, що написали мені. \n\nЗавжди ваш, \n\nП’єр Соломон"
nf_sta.12.a:0 "Та він же просто шаблон вставив!"

nf_sta.13.t:0 "Відповідь зі Стуна!"
nf_sta.13.d:0 "До пані ЕМІЛІЇ САНДЕЛЛ з ВЕЛИКОЇ ЗГРАЇ... \n\nЯ щиро перепрошую за ІНЦИДЕНТИ З БАНДИТАМИ В БІГГАРІ. Це питання обіцяли врегулювати ще коли я прийшов до влади. Те, що сталося — неприйнятно! \n\nЯ обіцяю діяти краще надалі. Але тільки з вашою підтримкою я зможу повністю покінчити з БАНДИТАМИ В БІГГАРІ. \n\nДякую, що написали мені. \n\nЗавжди ваш, \n\nП’єр Соломон \n\nP.S. Я зробив твоє плем’я своїм рабом."
nf_sta.13.a:0 "Оце ж фальшивий покидьок…"

nf_sta.14.t:0 "Передача..."
nf_sta.14.d:0 "Сьогодні, в глибині фронтиру, наші люди вловили сигнал поблизу Електоралів. Хтось на ім’я 'Генерал Свобода'… Звітом супроводжувався запис трансляції. \n\n\"--мутанти, такі як ти й я, над якими ЗДІЙСНЮЮТЬ ЕКСПЕРИМЕНТИ ШАЛЕНІ ДОКТОРИ! Вони використовують ДОКТОРА ТОБОГГАНА, щоб перетворити Тінь на худобу. Це НЕЛЮДСЬКО! І НЕПО-АМЕРИКАНСЬКЕ, Джек — і я цього не потерплю. П’єре, сучара, твоя вся операція піде під три чорти — так чи інакше!\" \n\nТакий персонаж не міг залишитися поза увагою Подружжя..."
nf_sta.14.a:0 "А що як зв’язатись із цим 'Генералом Свободою'?"

nf_sta.15.t:0 "Нічна зустріч"
nf_sta.15.d:0 "Поки П’єр Соломон солодко спав у своїй башті, до бункера Генерала Свободи навідались люди в костюмах родео з втомленими усмішками прикордоння. Вони прийшли з пропозицією, від якої не відмовляються."
nf_sta.15.a:0 "Він прийняв. П’єр мусив піти."
nf_sta.15.b:0 "Свобода вирішив стояти сам."

nf_sta.16.t:0 "Генерал Свобода приймає нашу допомогу!"
nf_sta.16.d:0 "Генерал Свобода прийняв нашу допомогу! Якщо пощастить, правління П’єра Соломона закінчиться за його командою."
nf_sta.16.a:0 "Мертві не видають таємниць."

nf_sta.17.t:0 "Генерал Свобода відхиляє нашу допомогу!"
nf_sta.17.d:0 "На жаль, Генерал Свобода вирішив, що це — його війна, і йому доведеться вести її самому."
nf_sta.17.a:0 "Шляхетно, та шкода."

nf_sta.18.t:0 "Мовчання зі Стуна"
nf_sta.18.d:0 "Минув місяць — і жодної звістки зі Стуна. Наші кур’єри стверджують, що повідомлення доставлено, і П’єр його отримав. І вони не з тих, хто бреше. \n\nП’єр тільки-но нажив собі дуже, дуже небезпечного ворога..."
nf_sta.18.a:0 "Він заслужив, аби страждати."

nf_sta.19.t:0 "Учорашній вибух..."
nf_sta.19.d:0 "Ще вчора вибух потряс небо над Кіндерслі — важко впавши на землю, він знищив одну з ферм Локгартів. Потім був ще один. І ще...\n\nВони прийшли з-за Саскачевану… Із Притулку. Хтось вирішив більше не грати за правилами."
nf_sta.19.a:0 "Ми зрозуміли натяк."

nf_sta.20.t:0 "Його звали О'Малліган"

nf_sta.21.t:0 "Люди з Заходу Повертаються Додому"
nf_sta.21.d:0 "З теплими побажаннями від Джона Локгарта та Емі-Лі Санделл з Великої Зграї, ті чоловіки й жінки, які колись служили у королівському флоті, захищаючи води від усіх ворогів, і яких вважали зниклими за Електоратом, нарешті повернулись додому з допомогою людей Зграї."
nf_sta.21.a:0 "Ми надішлемо слова подяки."

nf_sta.22.t:0 "Республіка Кінгслі і Те, Що Від Неї Лишилось"
nf_sta.22.d:0 "З попелу НФК виникла Республіка Кінгслі — союз купців під фальшивою 'Королевою', що плювала на манітобську ієрархію. Проте справжнім серцем цієї 'республіки' були торговці, і хоч усе починалось чесно, незабаром усе скотилося в безодню жадібності та пихи. Коли НФК відступив, вони спробували централізувати людей, яких не можна централізувати — і так з'явились Каб-грифи. Трайбали, одержимі вантажівками, яким не потрібен був порядок, лише отруйна свобода: робити що заманеться і коли заманеться.\n\nЧерез дві родини ситуація змінилась. Локгарти на заході були серцем Степів — їхнє слово важило більше за закони. Схід же представляли мандрівники зі Стуна — Санделли, що не могли терпіти зростаючу владу Кульбабового Товариства.\n\nОпинившись між Локгартами, Санделлами й Каб-грифами, місто Кінгслі не витримало. Воно впало, а з ним і попіл Республіки. Грифів загнали на північ, де вони самі себе зжерли, а дві родини знайшли втіху одна в одній."
nf_sta.22.a:0 "Справжнє кохання — річ незаперечна."
nf_sta.22.b:0 "Шамани Каб-грифів лишили купу хімікатів."
nf_sta.22.c:0 "Люди в Кінгслі знали, хто переможе."

nf_sta.23.t:0 "Локгарти"
nf_sta.23.d:0 "Локгарти завжди були вільною спілкою фермерів і кочівників, що називали себе однією родиною. Колись було просто визначити: друг перед тобою чи ворог — спитай, як він ставиться до Локгартів. Якщо з повагою — значить, свій. Їхнє ім’я означало союз для добрих, та справедливу розправу — для поганих.\n\nСам Джон Локгарт став обличчям родини після серії випробувань: банда Баймур, Каб-грифи, Республіка Кінгслі — всі падали перед ним у чесному бою. Саме він знову зробив дуелі популярними у пустках — завдяки своїй елегантності, рапірі й зухвалій усмішці, що могла підкорити будь-кого. І саме ця усмішка зрештою привела його до Емі-Лі Санделл."
nf_sta.23.a:0 "Його серце замкнуло її серце."

nf_sta.24.t:0 "Санделли"
nf_sta.24.d:0 "Історія Санделлів почалась у Саскатуні — де колись вони харчувались людським м’ясом. Коли їх вигнали в сільську глушину, Емі-Лі й багато з її родичів почали розуміти, що їхнє плем’я втратило людяність заради виживання. Так, канібалізм був вимушеним, але для неї це було нестерпно. Бо якщо істота здатна думати, говорити й любити — хіба варта вона того, щоб її з’їсти?\n\nПопри те, що в пустках мало що росло, Емі вірила в сільське господарство — фрукти, овочі, їжа без болю. Втім, плем’я лишалось воїнами. І коли прийшов час падіння Кінгслі, вони рушили вперед — і зустріли Локгартів. Далі — вже історія.\n\nВона прагнула не плоті ближнього. Вона прагнула його тепла."
nf_sta.24.a:0 "Хочеться вирвати власне серце… і з’їсти."

nf_sta.25.t:0 "Дуель"
nf_sta.25.d:0 "До штатів, вірних Електорату:\n\nМи — люди з мудрим словом, але більше слів у нас не лишилось. Тож ми кидаємо виклик: якщо вам хочеться завдати болю — ми принесемо біль більший. У вас є місяць. Потім ми рушимо на вашу нору. Вашим людям краще тікати, бо ми не б’ємося з тими, хто не готовий.\n\nНехай переможе найгідніший."
nf_sta.25.a:0 "Велетень обертається лицем..."

nf_sta.26.t:0 "Війна Насувається Швидко"
nf_sta.26.d:0 "Час настав. Електорат підготував свою оборону. Ми ж — свій наступ. \n\nНехай переможуть найгідніші."
nf_sta.26.a:0 "Гуркіт, гуркіт, гуркіт..."

nf_sta.27.t:0 "Вітання Генералу Свободі"
nf_sta.27.d:0 "До чоловіка/мутанта, знаного як Генерал Свобода, з особливою повагою від ДЖОНА ЛОКГАРТА ТА ЕМІ-ЛІ САНДЕЛЛ: \n\nПриємно бачити, що наш друг у Стуні тримається на плаву! Хоч ми й не поділяємо всіх ваших переконань, ми маємо безмежну повагу до вас і вашого нескінченного прагнення свободи. Саме тому ми хочемо передати частину наших виробництв для допомоги вам і вашим щойно звільненим людям у цей хаосний час. \n\nТим часом — просте, щире "дякуємо" і салют розуму. \n\nЩасти вам!"
nf_sta.27.a:0 "Свобода, взагалі!"

nf_sta.271.t:0 "Вітання Френкі Чейзу"
nf_sta.271.d:0 "До Френкі Чейза, з особливою повагою від ДЖОНА ЛОКГАРТА ТА ЕМІ-ЛІ САНДЕЛЛ:\n\nЯк і твій батько, ти — душа, надто добра для тих, з ким змушений був мати справу. Ми маємо глибоку повагу до твоїх перемог на полі бою — проти Кульбабників і проти Дандерна. На честь твоєї звитяги у поваленні канібалів і тиранів старого Електорату, ми хочемо передати тобі частину наших виробничих потужностей, щоби допомогти тобі та твоїм звільненим людям втриматися у цьому божевіллі.\n\nТим часом — щире "дякуємо" і розумовий уклін. \n\nЩасти!"
nf_sta.271.a:0 "Добрі побажання"

nf_sta.272.t:0 "Пропозиція Миру"
nf_sta.272.d:0 "До нашого друга з Електорату, з особливою повагою від ДЖОНА ЛОКГАРТА ТА ЕМІ-ЛІ САНДЕЛЛ:\n\nХоч обидва ми зміцнюємо свої позиції, пустка залишається ворожим місцем. І є ті, хто хотів би забрати наші важко здобуті блага. Тому ми простягаємо руку дружби.\n\nЯкщо ви надішлете нам відповідь, що визнає наші кордони та мирне співіснування, ми гарантуємо — наші народи більше не зійдуться у бою. Це не погроза; відмова лише означатиме, що ви не можете нічого обіцяти — задля безпеки свого народу. Але ми щиро сподіваємось, що ви зрозумієте користь співпраці у світі, сповненому війни.\n\nЧекаємо вашої доброї відповіді!"
nf_sta.272.a:0 "Відмовимося від агресії"
nf_sta.272.b:0 "І навіть прикриємо спину"
nf_sta.272.c:0 "Нам не потрібні угоди"

nf_sta.273.t:0 "Смак Миру"
nf_sta.273.d:0 "Цього ранку ми отримали листа з підтвердженням згоди. Поки ми при владі — ми не нападемо одне на одного. І це, мабуть, найкраще, на що ми могли сподіватися в цих обставинах."
nf_sta.273.a:0 "З Чесними Серцями"
sta_non_aggression_tt:0 "Вони погодились на §YПакт про ненапад§!."

nf_sta.274.t:0 "Солодка Угода"
nf_sta.274.d:0 "Цього дня ми отримали відповідь, що перевершила наші сподівання! Віднині ми погодились захищати кордони одне одного у разі нападу з боку третьої сторони. Чи то машина, мутант чи людина — ми клянемося у цьому."
nf_sta.274.a:0 "Так і буде"
sta_guarantee_tt:0 "Вони погодились на взаємну §GГарантію§!."

nf_sta.275.t:0 "Гірка Відмова"
nf_sta.275.d:0 "Цього вечора ми отримали листа з відмовою. На жаль, але це — результат, до якого, можливо, варто було готуватись від самого початку. Принаймні ми не вчитали у відповіді явної ворожості."
nf_sta.275.a:0 "Не мир, але й не війна"

nf_sta.28.t:0 "Пропозиція Елбо"
nf_sta.28.d:0 "ДО ЧОЛОВІКА, ВІДОМОГО ЯК БАТЬКО СКРАПХІП: \n\nЗ великою приємністю ми звертаємося до вас. Електорат навряд чи був союзом гідності чи доблесті, але навіть серед їхнього безумства ви не втрачали розум. Тож ми хотіли б мирно запросити вас у наш уряд — ми керуватимемо вашими землями, а ви вільно продовжите свою філантропію без жодних перешкод."
nf_sta.28.a:0 "Бог благословить Зграю!"
nf_sta.28.b:0 "Ми воліємо йти власним шляхом."

nf_sta.29.t:0 "Елбо погоджується!"
nf_sta.29.d:0 "Елбо прийняв нашу пропозицію, приєднавшись до наших земель! Батько Скрапхіп з радістю продовжує проповідувати свою віру."
nf_sta.29.a:0 "Благослови Боже Елбо!"

nf_sta.30.t:0 "Елбо відмовляється!"
nf_sta.30.d:0 "Елбо відмовився приєднуватись, віддавши перевагу самостійному шляху."
nf_sta.30.a:0 "Можна було б викликати його на дуель..."
nf_sta.30.b:0 "...Але, що поробиш."

nf_sta.31.t:0 "До Лейфа Йорктонського, з Любов'ю"
nf_sta.31.d:0 "Лейфе, \n\nНам відомі легенди зі сходу. Мігранти й паломники розповідали нам чимало про тебе і про ті випробування, що тобі випали. Нам із тобою життя не давалося легко, чи не так? Пустка буває безжальною. \n\nМи віримо в народ Королівства, що сам здолає свої негаразди — і це стосується і твого звернення. Тому ми надсилаємо партію піхотного спорядження. Нехай твої Лицарі повернуться скоро й у силі, друже. \n\nЗ любов’ю, Джон Локгарт і Емі-Лі Санделл"
nf_sta.31.a:0 "Вперше все по-людськи."

nf_sta.32.t:0 "Зустріч Під Місячним Світлом"
nf_sta.32.d:0 "Сьогодні до нас завітав лікар. Емі-Лі мовчки щось підозрювала, і Джон відчув, як у нього тремтить серце, коли почав розуміти, що відбувається. \n\nНовина швидко розлетілася. У Ґрейстейблсі й по всьому прикордонню почалися святкування на честь Подружжя — танці й фестивалі, присвячені початку нового життя. \n\nДля Джона Локгарта й Емі-Лі це стало черговим знаком: вони були створені одне для одного. А Джон не міг стримати усмішку — бо він стане батьком прекрасної доньки й уже мав за дружину ідеальну жінку."
nf_sta.32.a:0 "Чудеса родини — незліченні."

nf_sta.33.t:0 "Дитина Народилась у Ґрейстейблсі!"
nf_sta.33.d:0 "Нарешті, в Ґрейстейблсі народилась дитина. Після довгих суперечок щодо імені, вони зупинилися на простому, трохи кумедному поєднанні своїх імен: Джой. \n\nІ знову святкування — великий бенкет на честь Локгартів і Санделлів. Без сумніву, цей день увійде в пам’ять."
nf_sta.33.a:0 "Перемога Джой!"

nf_sta.34.t:0 "Щось Зле"
nf_sta.34.d:0 "Ні Джон, ні Емі не очікували, що після народження дитини сон стане для них розкішшю. Джой вимагала більше уваги, ніж уся Велика Зграя разом узята — і вони не хотіли, щоб було інакше. Пізно вночі, після годування й обіймів, Джой заснула. Джон і Емі з полегшенням звалилися на ліжко, навіть не роздягнувшись. Вони просто хотіли тепла ковдри й одне одного. Джон захропів, обійнявши Емі за живіт. \n\nА от Емі не могла заснути. Її роздирала тривога. Після двох із половиною годин марних спроб, вона встала. Може, склянка води допоможе. Вийшла тихенько, щоб не збудити коханого. Коли проходила повз кімнату Джой, зупинилась. Тиша — гнітюча, дивна. Щось було не так. Відчуття у шлунку — наче щось знала, але не могла усвідомити. Вона обережно прочинила двері. 'Джой...' — прошепотіла. \n\nЇї кров захолола. На підвіконні стояла постать у чорному. У руках — Джой. Фігура зиркнула на Емі, й одразу ж стрибнула у темряву."
nf_sta.34.a:0 "Наша дитина!"

nf_sta.35.t:0 "Хід Малліґан"
nf_sta.35.d:0 "До виродків із верхнього пагорба: \n\nІм'я моє — Малліґан. Я — та, що тримає вашу дитину. Я представляю не найприємніших людей із Притулку. Хочете її назад? Давайте поговоримо про землю. Пора, так би мовити, трохи похитати ваші межі… Хіба що ви налякані й не готові грати?"
nf_sta.35.a:0 "Крихкість життя..."
nf_sta.35.b:0 "...Гординя ідіота."

nf_sta.36.t:0 "Джой Повернулась до Ґрейстейблса"
nf_sta.36.d:0 "Нарешті, Джой повернулась живою і неушкодженою до своєї родини в Ґрейстейблс. У пустках рідко буває щастя, але сьогодні — виняток. Люди самі зголошувались її охороняти. І Джон Локгарт з Емі-Лі Санделл вперше за довгий час могли спокійно спати, знаючи: Джой більше ніхто не скривдить."
nf_sta.36.a:0 "У випробуваннях народжується спорідненість."

nf_sta.37.t:0 "Побажаєте, Щоб Було Легше"
nf_sta.37.d:0 "Коли Мері Малліґан потрапила до рук Зграї, її долю довірили Емі-Лі. Але та відмовилася. Вона не могла винести вирок без чоловіка. Вдвох вони вирішили: Мері буде замкнена в труні й втоплена в Саскачевані. Жорстоко? Можливо. Але вони щиро сподівалися, що її останній подих був солодким. Бо навіть у пустці — побажати страждання непросто."
nf_sta.37.a:0 "Нехай упокоїться… по частинах."

nf_sta.38.t:0 "Старі Вороги Повернулись"
nf_sta.38.d:0 "Коли наші фронтирники почали відбудову біля Баттлфорда, вони відкрили гаражі — і знайшли там щось страшне: нові майстерні Каб-грифів. Як і завжди, вони втекли одразу після викриття — з емблемами Грейгаундів, що палали на їхніх кабінах."
nf_sta.38.a:0 "Невже Медвіллін живий?"

nf_sta.39.t:0 "Шепіт із Кордону"
nf_sta.39.d:0 "Кажуть, гудки вантажівок лунали по півночі, наче грім — величезні фури, яких не бачили майже десять років, зривали відбудову й убивали наших людей. На їхніх боках — сиві песики.\n\nМедвіллін живий. І він повернувся по реванш."
nf_sta.39.a:0 "Зграя не зламається ніколи!"
nf_sta.39.b:0 "Хрестовий похід Медвілліна триватиме!"

nf_sta.40.t:0 "Горе"
nf_sta.40.d:0 "Емі й не знала, що людина може плакати так багато. Куди б вона не йшла, що б не робила, з ким би не говорила — вона плакала. Сльози стали її єдиною емоцією. А коли сліз не лишалося, залишався лише гнів. Смуток — за свою дитину. Гнів — на виродка, що її забрав. Джон теж плакав, але потайки. Лише тоді, коли вони залишалися вдвох, і могли тримати одне одного на руках. Тільки кохання тримало їх на ногах — надія, що вони ще побачать свою доньку. \n\nЧергова безсонна ніч. Емі встала вдосвіта. В дзеркалі — темні кола під очима. Вона не пам’ятала, коли востаннє усміхалась. Умилася. Підняла голову — й побачила за спиною високу фігуру. Занадто втомлена, щоби одразу зреагувати, вона просто втупилась у дзеркало. І лише за секунду її інстинкти повернулись. Вона хотіла закричати, але фігура схопила її за голову, закривши рот рукавичкою. \n\nЕмі різко б’є в коліно — нападник відступає. Вона кидається на нього, але бачить зброю. Завмирає. \n\n\"Хочеш побачити дитину? Тоді не рипайся,\" — тихо каже він. Емі мовчить, очі розширені. \"Добре. Слухай. Якщо хочеш побачити дитину — ось координати на листі. Прийди о 22:00. Тільки ти і твій чоловік. Я приведу дитину. Якщо ні — ти її більше не побачиш. Я зараз піду. Якщо закричиш — уб’ю тебе, чоловіка і дитину. Зрозуміла?\" — вона мовчки киває, сльози ллються. \n\n\"От і добре. До зустрічі, міс Санделл.\""
nf_sta.40.a:0 "Наша дитина…"

nf_sta.41.t:0 "По Сліду Викрадачів"
nf_sta.41.d:0 "Переконати охоронців дозволити Джону та Емі піти на місце зустрічі було важко — ті благали піти з ними. Але Подружжя настояло: вони впораються самі. В голові — страх, тривога, віра, що побачать дитину. І сумніви: пастка? чи шанс? Ніч перед тим — без сну. Вони обійнялися востаннє і вирушили. \n\nРано-вранці пара просувалась пусткою. Зброя в руках, королівське вбрання — замінено на легку шкіру. Всі рухи — обережні. Увага до кожної деталі, до кожного каменю. Аж раптом — крик. Дитячий. І все — осторога зникає. Вони кидаються вперед, до скельного каньйону. Там, посеред каміння — дитячий візок. Самотній. Жодних записок. \n\nУсередині — Джой. Жива. Кричить. Емі та Джон кидаються до неї, сльози ллються, руки тремтять. І — здивування. Дитина чиста. Личко вмите. Пелюшки — охайні. Що, ті з Притулку піклувались про неї? Це вже не мало значення. Вони повернули свою дитину. І ніхто ніколи більше їх не розлучить."
nf_sta.41.a:0 "Наша мила Джой!"

nf_sta.42.t:0 "Святкування?"
nf_sta.42.d:0 "Подружжя, що керує Великою Зграєю, оголосило про народження дитини — і країна радіє. Пісні та вечірки лунають преріями. Люди з гордістю сповіщають мандрівників: Джой, донька Джона з клану Локгартів і Емі-Лі з клану Санделлів — народилась. А найголовніше — вона народилась у найлюблячішій родині з усіх: у Зграї!"
nf_sta.42.a:0 "Наші вітання…"

nf_sta.43.t:0 "Джой Великої Зграї — Викрадена!"
nf_sta.43.d:0 "Сьогодні громадяни повідомили: доньку Подружжя Великої Зграї, Джой, викрадено. У преріях — скорбота. Клани в жалобі, всі шукають винних. Поширюються чутки про фігуру з блакитним візором — і підозри падають на Вартових Притулку..."
nf_sta.43.a:0 "Яке горе…"

nf_sta.44.t:0 "Кінь Без Імені"
nf_sta.44.d:0 "Чи можна збудувати націю лише на коханні двох людей? Пересічний мешканець пустки скаже: ні. Але спитай Емі та Джона — і вони покажуть тобі доказ, що так, це можливо. Разом вони започаткували справжню золоту добу миру й добробуту для свого народу — рука в руці, серце до серця. Локгарти й Санделли підтримували їх за будь-яких обставин. Любов перемогла зло пустки. Єдині — до самого кінця."
nf_sta.44.a:0 "Час осісти на землі..."

######  
### фокуси  
######  

sta_the_cpf_fell:0 "Більше Ніяких Фронтів"
sta_the_cpf_fell_desc:0 "Народний фронт Канади тягнувся далеко на схід і захід. Подивіться, як низько він впав."

sta_families_and_tribes:0 "Родини й Племена"
sta_families_and_tribes_desc:0 "На рубежі, на цих Степах, уряди ніколи не були варті своєї буцімто гідності. Завжди саме люди надавали цьому краю особливості."

sta_the_couple:0 "Подружжя"
sta_the_couple_desc:0 "Локхарти й Санделли, поєднані священним шлюбом..."

######  
### фокус — ліве крило  
######  

sta_the_albertan_steppe:0 "Альбертинський Степ"
sta_the_albertan_steppe_desc:0 "Широкі відкриті поля, що тягнуться аж за обрій. Дім, безпека й спокій."

sta_on_horses_back:0 "На Кінській Спині"
sta_on_horses_back_desc:0 "Кінь був другом людини століттями. І досі наші чотириногі товариші допомагають нам перевозити вантажі через Альбертинський степ."

sta_trading_with_neighbors:0 "Торгівля з Сусідами"
sta_trading_with_neighbors_desc:0 "Те, що ми сильні, не означає, що ми не поважаємо торгівлю з іншими. Якщо ключем до кращого світу є комерція — нехай так і буде."

sta_tension_on_the_six_fronts:0 "Напруга на Північному Кордоні"
sta_tension_on_the_six_fronts_desc:0 "Уцілілі від КПФ — досі численні, і хоча ми з тривогою дивимось на північний захід, ми не повинні вагатись. Багато зі старих машин із Лойдмінстера досі валяються на рівнинах. Зберемо їх на брухт і використаємо з користю."

sta_push_for_innovators:0 "Підтримати Новаторів"
sta_push_for_innovators_desc:0 "Заохотити людину до самореалізації — найцінніше, що можна зробити. Якщо наш народ повірить, що здатен на все — він і піде до цього з наміром."

sta_the_power_of_wind:0 "Сила Вітру"
sta_the_power_of_wind_desc:0 "Отримати енергію в Пустці нелегко, але деякі з наших найяскравіших умів запропонували будувати вітрові турбіни! Почнемо розчищати місце."

sta_i_crave_a_man_with_power:0 "Я Хочу Людину з Силою"
sta_i_crave_a_man_with_power_desc:0 "Тепер, коли місце розчищено, ми можемо починати будівництво турбін. Один із колишніх голів моторної родини «Кеб Волчерс» — Зед — запропонував допомогу з монтажем… якщо ми дамо йому майстерню."

sta_and_the_world_saw_lights:0 "І Світ Побачив Світло"
sta_and_the_world_saw_lights_desc:0 "Електрика дійшла до Ґрейстейблза! Світло струменить крізь наші оселі, як вода річищем. Воно також досягло віддалених ферм, дозволяючи їм підтримувати нове обладнання та покращуючи рівень життя."

sta_munitions_from_vermilion:0 "Боєприпаси з Вермільйону"
sta_munitions_from_vermilion_desc:0 "Серед усіх колишніх земель КПФ, саме Вермільйон найвідкритіше прийняв наших посланців. Ми навіть домовились про торгівлю зброєю — і все це просто під носом у Лойда й Редмонда!"

sta_lines_of_our_own:0 "Власні Лінії"
sta_lines_of_our_own_desc:0 "Без хребта КПФ, нам доведеться створити власні фабрики для забезпечення себе."

sta_the_fineries_of_civilized_industry:0 "Вишуканість Цивілізованої Індустрії"
sta_the_fineries_of_civilized_industry_desc:0 "Зі зростанням Полум’я Альберти — у серцях наших людей запалюється щире тепло."

######  
### фокус — центр  
######  

sta_they_call_us_great:0 "Нас Назвали Великими"
sta_they_call_us_great_desc:0 "Нас назвали «Великим Стампідом», коли ми штурмували Кінґслі — і ми досі носимо це звання. Ми не агресори, але страх — потужний інструмент у вправних руках."

sta_they_called_it_kingsley:0 "Кінґслі, Нині Ґрейстейблз"
sta_they_called_it_kingsley_desc:0 "Кінґслі колись був столицею невдалої республіки — нової «Трьох Річок», що обіцяла цілий світ. У підсумку вона залишила по собі тільки попіл."

sta_the_upstarts_up_north:0 "Зухвальці На Півночі"
sta_the_upstarts_up_north_desc:0 "Приватири з Бетлфорда й Принс-Альберта — це вигнанці з Манітоби, колишні солдати, що тепер кланяються «Принцу Альберту». Їхня неповага до Королівства — образа для всіх нас."

sta_no_more_exiles:0 "Досить Вигнанців"
sta_no_more_exiles_desc:0 "Багато хто прийшов сюди у пошуках нового шансу чи притулку від Калгарі або Народного фронту. Ми вітаємо їх з відкритими обіймами."

sta_kingsley_mercantile_flats:0 "Торгові Площі Кінґслі"
sta_kingsley_mercantile_flats_desc:0 "Старі торговці Кінґслі покинули чимало майна. Якщо його як слід реквізувати, зможемо використати його з користю."

sta_batford_and_roll:0 "Бетлфорд, Поїхали"
sta_batford_and_roll_desc:0 "Хоч не всі мешканці Бетлфорда вірні Принцу Альберту, дехто досі підтримує Каб Волчерів — і вони плетуть змови проти нас. Заради честі нашого народу й нашого Доблесного Королівства — ми розтрощимо цих дурнів!"

sta_a_false_prince:0 "Фальшивий Принц"
sta_a_false_prince_desc:0 "Принц Альберт — самозванець, що, мабуть, і трону справжнього не бачив. Його й вірних йому буде покарано!"

sta_ready_for_work:0 "Готові до Праці"
sta_ready_for_work_desc:0 "На кордоні повно людей, охочих працювати. Дамо їм мету — якщо забажають її прийняти."

sta_batford_medicines:0 "Ліки Волчерів"
sta_batford_medicines_desc:0 "Старі мотор-шамани Каб Волчерів знали чимало процідь і зілля. Вивчимо їхні методи — щоби лиш користь була."

sta_promise_batford_relocation:0 "Обіцяти Переселення Бетлфорду"
sta_promise_batford_relocation_desc:0 "Багато чоловіків у Бетлфорді хотіли повернутись додому, та не могли. Сьогодні ми це змінимо."

sta_no_more_safehavens:0 "Жодних Безпечних Пристанищ"
sta_no_more_safehavens_desc:0 "Вони вчинили немислиме — і ми мусимо відповісти з повною силою."

sta_safehaven_scouring:0 "Чистка Безпечного Місця"
sta_safehaven_scouring_desc:0 "Ми знайдемо її! Що б нам не довелося зробити. Мері Маллiґан заплатить за свою зухвалість."
sta_safehaven_scouring_tt:0 "Ми прочешемо місто в пошуках винних у викраденні радості."

sta_vault_security_fit:0 "Броня Охорони Сховища"
sta_vault_security_fit_desc:0 "Броню охоронців Сховища можна повторити — з достатньою дисципліною. Може, влізе під нашу фланель і джинси?"

sta_vault_generator:0 "Генератор Сховища"
sta_vault_generator_desc:0 "Генератор Сховища 107 можна відремонтувати — і знову поставити на службу людям. І собі, звісно."

sta_vault_production_lines:0 "Виробничі Лінії Сховища"
sta_vault_production_lines_desc:0 "Сховище 107 має чимало виробничих потужностей, які ми можемо запустити для власної вигоди. Натискаймо кнопки!"

sta_uranium_city_break_in:0 "Облава на Рад-Гейзардс"
sta_uranium_city_break_in_desc:0 "Рад-Гейзардс лякали дітей по всій Альберті та Катчу. Завдяки цим костюмам захисту ми, нарешті, зможемо покласти край цьому кошмару."

sta_all_quiet_on_the_homefront:0 "Тиша на Домашньому Фронті"
sta_all_quiet_on_the_homefront_desc:0 "Легкий вітерець мирно гуляє Альбертою. Одинокий рейнджер стоїть на пагорбі, важільна гвинтівка в руці. Він дивиться на захід сонця. Його губи кривляться в усмішці — він знайшов свій спокій."

sta_the_geck:0 "Г.Е.К.К."
sta_the_geck_desc:0 "Якимось чином, у Сховищі 107 зберігся неактивований Г.Е.К.К. — використаємо його на благо!"

sta_prince_albert_dockyards:0 "Верфі Редвінґа"
sta_prince_albert_dockyards_desc:0 "Старі верфі у Бетлфорді досі стоять. Якщо прибрати мотлох — можемо використати їх для власних цілей."

sta_learn_from_retirees:0 "Вчитись у Пенсіонерів"
sta_learn_from_retirees_desc:0 "Не всі у Принс-Альберті підняли зброю проти нас. Послухаймо старих моряків — їхні історії можуть стати в пригоді."

sta_no_more_interruptions:0 "Жодних Перешкод"
sta_no_more_interruptions_desc:0 "Народний фронт Канади знову розростається, як пухлина. Треба зупинити це — поки не пізно!"

sta_fourth_tech_slot:0 "Науковці-Найманці"
sta_fourth_tech_slot_desc:0 "Якщо вони працювали на «Принца Саскачевану», то й на нас погодяться."

sta_battleford_railway:0 "Нова Стежка На Північ"
sta_battleford_railway_desc:0 "Хоч Ґрейстейбл більший, старі кістки Бетлфорда ще міцні. Колишня столиця Принца Альберта — чудова база для зв’язку з північними поселеннями в засніженому Катчі. Прокладання нової дороги через альбертинську землю скоротить час на перекидання бійців і караванів у обидва боки."

######  
### фокус — центр, низ  
######  

sta_bringing_the_hammer_down:0 "Опустити Молот"
sta_bringing_the_hammer_down_desc:0 "Досить чекати. Ми рухаємось, щоби раз і назавжди покінчити з КПФ."

sta_ending_an_age:0 "Кінець Епохи"
sta_ending_an_age_desc:0 "Ніяких більше Канадських фронтів. Ніяких комуністів. Лише люди."

sta_the_guns_of_vermilion:0 "Гармати Вермільйона"
sta_the_guns_of_vermilion_desc:0 "Тепер ми можемо дозволити собі забрати боєприпаси, що тут зберігались. Хай послужать нам добре."

sta_no_more_red:0 "Без Червоних"
sta_no_more_red_desc:0 "«Редмонд» поверне собі справжнє ім’я — Едмонтон. Такий вже закон завоювань."

sta_claims_on_nordikon:0 "Жах Калгарі"
sta_claims_on_nordikon_desc:0 "Колись нешкідлива, хоч і дивна, споруда стала загрозою всій Альберті. Коли Міскаунти оселились у старій будівлі Міддлмарку, місцеві мали прислухатись до попереджень із Сіетла й розчавити їх. Тепер це наш обов'язок — добити рейдерів (і ту базікаючу крамницю)."

sta_stampedes_future:0 "Майбутнє Стампіду"
sta_stampedes_future_desc:0 "Мир — найвища чеснота, до якої може прагнути будь-хто. Бої, які доведеться пройти, щоб його досягти, змінять тебе назавжди — але тримайся, якщо не заради себе, то заради людей."

######  
### фокус — праве крило  
######  

sta_the_growing_power:0 "Зростаюча Сила"
sta_the_growing_power_desc:0 "Сім років позаду — і ми далі ростемо."

sta_lockheart_ingenuity:0 "Кмітливість Локгартів"
sta_lockheart_ingenuity_desc:0 "Локгарти завжди славились винахідливістю — сам Гарріс Локгарт, кажуть, навчився голитись шматком шпагату!"

sta_clean_up_roads:0 "Розчистити Дороги"
sta_clean_up_roads_desc:0 "Наші коні й вози потребують чистих доріг для зручного руху. Приберемо старі машини й уламки."

sta_sundell_resourcefulness:0 "Традиції Збирацтва Санделлів"
sta_sundell_resourcefulness_desc:0 "Санделли мусили навчитися виживати, особливо в Катчі. Після підйому Денді вони рушили на південь у пошуках нового шансу."

sta_love_of_the_lockhearts:0 "Любов до Локгартів"
sta_love_of_the_lockhearts_desc:0 "Коли щось треба було зробити — Локгарти завжди були поруч. Братерська любов — ось як усе трималось."

sta_the_old_stash:0 "Старі Схрони"
sta_the_old_stash_desc:0 "По Альберті ще валяється купа старого динаміту з минулих поколінь. Взяти його й використати — чудова ідея, враховуючи, наскільки все навколо жахливе."

sta_amy_lees_charms:0 "Чари Емі-Лі"
sta_amy_lees_charms_desc:0 "Емі-Лі Санделл завжди була чарівною. Кажуть, її очі завели чимало чоловіків туди, куди не слід було йти — і стали вони вечерею для її родини."

sta_love_of_the_sundells:0 "Любов до Санделлів"
sta_love_of_the_sundells_desc:0 "Санделли колись були канібалами — але вони зробили все можливе, щоби залишити ту бридку частину спадщини позаду."

sta_lockhearts_tech:0 "Знання Локгартів"
sta_lockhearts_tech_desc:0 "Хочеш, щоби було зроблено добре — доручи це Локгарту."

sta_lockhearts_bonus:0 "Мозковий Штурм Локгартів"
sta_lockhearts_bonus_desc:0 "Локгарти завжди знали, як упоратись із будь-чим."

sta_cavalry_outriders:0 "Кінні Патрулі"
sta_cavalry_outriders_desc:0 "Кавалерія — серце нашої нації. Це ті хлопці, які завжди напоготові, завжди поруч, щоби прийти на допомогу."

sta_sundells_bonus:0 "Виживання по-Санделлівськи"
sta_sundells_bonus_desc:0 "Санделли знали, як вижити за будь-яких умов — певно, споживання людей справді сприяє розвитку таких навичок."

sta_sundells_tech:0 "Старі Шляхи, по-Санделлівськи"
sta_sundells_tech_desc:0 "Старі традиції можна поєднати з новими — і так Локгартівський розум зливається з духом Санделлів."

sta_lockhearts_bonus_2:0 "Локгарти й Санделли"
sta_lockhearts_bonus_2_desc:0 "Локгарти зійшлися з Санделлями — і настало мирне майбутнє."

sta_sundells_bonus_2:0 "Санделли й Локгарти"
sta_sundells_bonus_2_desc:0 "Санделли зійшлися з Локгартами — і настало прекрасне майбутнє."

sta_families_united:0 "Об'єднані Родини"
sta_families_united_desc:0 "Дві родини, навіки поєднані священним шлюбом."

######  
### Дипломатія  
######  

sta_diplomacy:0 "Кордон до Кордону"
sta_diplomacy_desc:0 "Від кордону до кордону — ми повинні бути готові співпрацювати й домовлятись із нашими сусідами, коли це необхідно."

sta_stoon_fell_on_deaf_ears:0 "Вони Вечеряють у Перлинних Залах"
sta_stoon_fell_on_deaf_ears_desc:0 "Канібали, трансгуманісти й божевільні вчені. Вони тяжко нас образили — і ми кидаємо їм виклик на дуель."

sta_rumble:0 "Як Доміно"
sta_rumble_desc:0 "Жодна людина не повинна боятись, що її з’їдять її ж побратими. Монстрам більше не буде місця."

sta_congratulate_freedom:0 "Привітати Генерала Фрідом"
sta_congratulate_freedom_desc:0 "Генерал Фрідом здобув перемогу! Вітаємо нашого товариша."

sta_congratulate_frankie:0 "Лист до Френкі Чейз"
sta_congratulate_frankie_desc:0 "Втратити батьків у дитинстві — не легка доля. Цей Френкі здається хорошою дитиною… може, відкритий до переговорів?"

sta_electoral_peace:0 "Мир у Катчі"
sta_electoral_peace_desc:0 "Хоч у нас і залишилось чимало гірких спогадів про схід, сьогоднішні землі Електорату стали справді цивілізованими. Прийшов час запропонувати оливкову гілку — постійно."

sta_address_elbo:0 "Звернення до Елбо"
sta_address_elbo_desc:0 "В Елбо живе багато гідних людей. Але їхня близькість до нестабільних сусідів завдає їм шкоди."

sta_execute_mary_mulligan:0 "Страта Мері Маллiґан"
sta_execute_mary_mulligan_desc:0 "Мері Маллiґан — чудовисько, так звана «Вартова Білини», яка нібито боролась за мир і безпеку будь-якою ціною. Вона втягнула нас у подорож через усю Альберту в пошуках нашої дочки. Вона мусить бути страчена."

sta_yorktons_ascenscion:0 "Вознесіння Йорктона"
sta_yorktons_ascenscion_desc:0 "Боже благослови Лейфа Йорктона! Він зійшов на трон, і настав час нагадати йому про нашу дружбу."

sta_spectral_cabal:0 "Примарний Ковен"
sta_spectral_cabal_desc:0 "Примарний Ковен — дивний культ, що походить з Електорату й поклоняється буцімто «вовчому богу». Чи це правда — невідомо, але цілюща сила їхніх джерел — річ справжня. Ми їх приймемо... поки що."

