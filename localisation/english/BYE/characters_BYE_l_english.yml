l_english:

bye_the_monster_name:0 "Макс з мільйона"
bye_the_monster_desc:0 "Макс з мільйона - останній живий справжній спадкоємець ритуальних королів Баймурських бандитів. Хоча не він об'єднав різних канібалів, їхня злість і лють міцно тримала їх під своїм контролем перед обличчям можливостей, що відкривалися.\n\nЯкщо КНФ впав, і навіть Велика Зграя не змогла би їх втримати... Хто насправді міг би їх зупинити?"
