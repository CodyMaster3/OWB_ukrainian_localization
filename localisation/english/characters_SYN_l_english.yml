SYN_GRAND_CHIEF_NKWALA_NAME:0 "Велика Вождь Н'квала"
SYN_GRAND_CHIEF_NKWALA_DESC:0 "Хоч вона й молода, К'вала вже довела, що є більш ніж достойною провідницею для народу Силкс за час свого перебування на посаді Великої Вождя Виконавчої Ради Вождів. Під її керівництвом і завдяки дипломатичній майстерності стосунки між Силкс і сусідніми гулями з Беллінгема значно покращилися – регулярна торгівля й дипломатичні місії стали нормою."

SYN_SENKLIP_NAME:0 "Сенкліп-Койот"