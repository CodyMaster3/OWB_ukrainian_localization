  KSR_infantry_equipment:0 "Erbsenschießer"
  KSR_infantry_equipment_short:0 "Erbsenschießer"
KSR_infantry_equipment_desc:0 "Примітивний пристрій, що стріляє горошинами. З дуже великою швидкістю. Оце й усе."

  KSR_ballistic_equipment_1:0 "Kleinkalibergewehr Ausführung 3"
  KSR_ballistic_equipment_1_short:0 "Kleinkalibergewehr"
KSR_ballistic_equipment_1_desc:0 "Модифікація три. Не чотири і не п’ять, ні. ТРИ."

  KSR_ballistic_equipment_2:0 "Halbautomatikgewehr Ausführung 4"
  KSR_ballistic_equipment_2_short:0 "Halbauto-Gewehr"
KSR_ballistic_equipment_2_desc:0 "Напівавтоматична – для тих, хто не знає – означає, що кожен натиск на гачок випускає лише одну кулю. Щоб стріляти знову, треба знову натискати."

  KSR_ballistic_equipment_3:0 "Sturmgewehr 2283"
  KSR_ballistic_equipment_3_short:0 "Sturmgewehr"
KSR_ballistic_equipment_3_desc:0 "А, штурмгевір. КОЖЕН отримає один. Для тебе, і для тебе. ВСІ!"

  KSR_ballistic_equipment_4:0 "Vollautomatisches Großkalibergewehr Ausfürung 2"
  KSR_ballistic_equipment_4_short:0 "Großkalibergewehr"
KSR_ballistic_equipment_4_desc:0 "Великий калібр означає великі кулі. Запам’ятай це нарешті, Ганс. А де, до речі, Люгер?"

