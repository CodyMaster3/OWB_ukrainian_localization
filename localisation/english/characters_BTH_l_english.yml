l_english:
BTH_ELIZAVETA_NAME:0 "Єлизавета"
BTH_ELIZAVETA_DESC:0 "Посміхнись, містере! Така нікчемна негативна установка — це половина твоєї проблеми!\n\nЄлизавета очолює Румінаторів — релігійну групу, що присвятила себе довоєнній книзі з саморозвитку «Роздуми до багатства» — як відкинути обмежувальні думки й переналаштуватися на правильне мислення. Миролюбна жінка, Єлизавета стежить, щоб її народ завжди дивився на світ з позитивом — і сама одягається відповідно. Адже ти не можеш бути лідером, якщо вдягнений у лахміття."
BTH_elizaveta_cultural_advisor_desc:0 "Посміхнись, містере! Така нікчемна негативна установка — це половина твоєї проблеми!\n\nЄлизавета очолює Румінаторів — релігійну групу, що присвятила себе довоєнній книзі з саморозвитку «Роздуми до багатства» — як відкинути обмежувальні думки й переналаштуватися на правильне мислення. Миролюбна жінка, Єлизавета стежить, щоб її народ завжди дивився на світ з позитивом — і сама одягається відповідно. Адже ти не можеш бути лідером, якщо вдягнений у лахміття."
