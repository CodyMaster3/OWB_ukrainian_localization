l_english:
   nf_two.1.t:0 "Спадок Двох Сонць"
  nf_two.1.d:0 "До війни Два Сонця було другим за розміром містом Арізони, поступаючись лише Фініксу. Ця відносна скромність стала перевагою, коли впали бомби: поки полум’я дощем сипалося на мегаполіси по всій Америці, ніхто й не подумав завдати прямого удару по другому за розміром місту в посеред пустелі. Звісно, ця обставина мало втішала його мешканців — у паніці після кінця світу цілі райони було знищено. Величезні пожежі, підживлені ядерними вітрами, загрожували знищити Два Сонця повністю. Дивом, одна частина міста вижила попри хаос і швидко поширювані полум’я; нею стало..."
  nf_two.1.a:0 "Університет"
  nf_two.1.b:0 "Автовиробник"
  nf_two.1.c:0 "Військова база"

  nf_two.2.t:0 "Культ Насу"
  nf_two.2.d:0 "Анархія прийшла слідом за полум’ям, що поглинуло старий світ — усе, чого не досягнуло ядерне полум’я, невдовзі стало предметом боротьби між тими, хто вижив. Мало хто може описати ті жахіття, що сталися, коли суспільство розпалося, а чоловіки й жінки були зведені до первісних інстинктів.\nІсторія Двох Сонць могла закінчитися, не розпочавшись, якби не Культ Насу. Працівники довоєнної автогонкової компанії об'єдналися, щоб дати надію беззахисним; гонщики патрулювали місто, тоді як механіки й жерці підтримували роботу техніки та генераторів. Вони охоче приймали тих, хто приходив з навколишніх земель у пошуках захисту від небезпек пустки, а знання й оповіді, що вони принесли, стали основою віри Насу. Ми досі пам’ятаємо першу історію, яку вони розповіли..."
  nf_two.2.a:0 "Подвиг Канонбола"
  nf_two.2.b:0 "Завдання Старшого"

  nf_two.3.t:0 "Вайатт, Демон"
  nf_two.3.d:0 "Цього демона знайшли покинутим на сходах великого храму Канонбола. Без імені батьків, жодна місцева жінка не зізналася у пологах; згодом деякі почали сумніватися, чи мав він взагалі батьків, чи, можливо, був даром від самого Насу. Спершу жерці вважали його сиротою і виростили серед себе, аби з часом він приєднався до їхніх лав. Але згодом істинне призначення дитини розкрилося. Адже в його жилах тече не червона кров, а чорна нафта — що ідеально пасує Вайатту, людині, яка, можливо, є найвеличнішим гонщиком у пустці. Його легенда зростає з кожним подвигом і перемогою, але ми не повинні забувати його скромні початки. До того як Він зайняв своє місце серед найвеличніших Насу, Він був..."
  nf_two.3.a:0 "Жерцем"
  nf_two.3.b:0 "Механіком"
  nf_two.3.c:0 "Гонщиком"

  nf_two.4.t:0 "Правління Цезаря"
  nf_two.4.d:0 "Минуло багато років з того часу, як Два Сонця присягнули Цезарю — хоча деякі зі старших гонщиків досі сумують за втратою автономії, наші відносини завжди були взаємовигідними. Легіон контролює великі території, багаті на ресурси, які Два Сонця відчайдушно потребують не лише для підтримки, а й для розширення нашого зростаючого автопарку. Тим часом Легіон отримує велику вигоду з нашої майстерності: завдяки нашим авто вони можуть здійснювати блискавичні удари миттєво та переміщати війська й постачання з неймовірною швидкістю. Ми неодноразово доводили нашу вірність, як у бою, так і поза ним, і ніхто не може заперечити, що Легіон відплатив нам, зробивши нас..."
  nf_two.4.a:0 "Заможними"
  nf_two.4.b:0 "Міцними"
  nf_two.4.c:0 "Цивілізованими"

  nf_two.5.t:0 "Два Сонця пропонують керувати Ковбоями"
  nf_two.5.d:0 "Два Сонця запропонували взяти на себе управління щойно завойованими землями — вони приймуть будь-яке рішення, але відмова серйозно зашкодить їхньому потенціалу як майбутнього союзника."
  nf_two.5.a:0 "Прийняти"
  nf_two.5.b:0 "Відмовити"

  nf_two.6.t:0 "Два Сонця просять шанс довести свою цінність"
  nf_two.6.d:0 "Два Сонця просять дозволу зайнятися Країною Ковбоїв замість нас, аби ми могли зосередитися на кампанії на заході."
  nf_two.6.a:0 "Дозволимо їм проявити себе."
  nf_two.6.b:0 "Ми самі впораємось із Рейнджерами."

  nf_two.7.t:0 "Рейнджери продовжують боротися"
  nf_two.7.d:0 "У ранкові години збройні групи молодиків порушили комендантську годину та напали на урядові будівлі й склади; наші війська ледве втримали їх від штурму нового храму Насу. Повстання очолюють колишні Арізонські Рейнджери, рішуче налаштовані не допустити, щоб їхній новий дім потрапив під владу Легіону. Потрібні особливі заходи, аби придушити їх остаточно."
  nf_two.7.a:0 "Дегенератам місце на хресті"
  nf_two.7.b:0 "Можливо, з ними ще можна домовитись"

  nf_two.9.t:0 "Наші вірні піддані з Двох Сонць знову принесли дари у Флагстафф"
  nf_two.9.d:0 "Цього разу їхня данина супроводжується тривожним питанням щодо нашого південного сусіда. Хоч ми й проводили розслідування щодо Генералісимуса та його людей раніше, вони лише підтвердили наші підозри: Віалла, хоч і розпусник, але його любов до легіонських монет (а також базове самозбереження) тримають його вірним. Але тепер наші піддані представили нові докази, що можуть свідчити про таємні наміри Дженте приєднатись до Пакту Ріо; якщо це правда, нам слід переглянути ставлення до Генералісимуса.\n\nПісля роздумів Цезар відповів делегації:"
  nf_two.9.a:0 "§OPede poena claudo§!"
  nf_two.9.b:0 "§OIn omnia paratus§!"

  nf_two.10.t:0 "Готові до всього"
  nf_two.10.d:0 "Було нерозумно вважати, що численні очі Легіону ще не доповіли Цезарю те, що ми дізналися лише нещодавно. Якщо він вважає народ Дженте гідними союзниками, ми не принизимо себе, ставлячи це під сумнів."
  nf_two.10.a:0 "§OUbi amici, ibi opes§!"

  nf_two.11.t:0 "Останній Ура"
  nf_two.11.d:0 "Війська Двох Сонць пробилися в саме серце Генте Дель Соль. Народ виявився швидко покинутим своїм так званим лідером Віаллою, який вирішив, що настав час вирушити у тривалу відпустку на яхті — прихопивши з собою державну скарбницю та чимало коханок. Однак один чоловік залишився, щоб захистити людей Генте від переможного Легіону та його псів — атакуючи лінії постачання й навіть здійснюючи рейди через колишній кордон, він виріс з простої загрози у справжній символ спротиву для тих, хто ще чинить опір вашій владі.\nУрешті-решт саме Вайатт переміг самопроголошеного борця за свободу. Відстеживши його до одного з високогірних перевалів Генте, між ними почалася гонитва, гідна захоплення, вздовж зрадливого гірського шляху. Зрештою Вайатт переміг, а Сонцеїд змушений був визнати поразку — і, на подив усіх (окрім самого Вайатта), погодився служити Двом Сонцям."
  nf_two.11.a:0 "Два легендарні гонщики краще, ніж один"

  nf_two.12.t:0 "Захід Сонця"
  nf_two.12.d:0 "Всупереч усьому, наші бійці витіснили сили Двох Сонць з нашої землі та навіть окупували значну частину їхньої території. Але [CES.GetName] і далі чатує на півночі. Якщо ми відведемо війська до власних кордонів, мине багато часу, перш ніж Легіон знову спробує вторгнутися. Однак спроба остаточно вирвати Два Сонця з рук Легіону безперечно викличе його лють — і хоча ми перемогли Два Сонця, боротьба з [CES.GetName] буде набагато серйознішим викликом."
  nf_two.12.a:0 "Насолодимось цією перемогою."
  nf_two.12.b:0 "Смерть Легіону!"

  nf_two.20.t:0 "Підготовка до Великої Гонки"
  nf_two.20.d:0 "Завдяки покращеній промисловості ми нарешті готові взятися за найграндіозніший будівельний проєкт в історії Двох Сонць. Ми збудуємо гоночну трасу, гідну Насу, що пролягатиме крізь усю Сонору. Вайатт підготував свій болід, аби доставити запрошення найгіднішим суперникам з усієї пустки, а за підтримки майстерень ми зможемо забезпечити відповідність навіть найвищим стандартам."
  nf_two.20.a:0 "Ми повинні підготуватися"

  nf_two.90.t:0 "Велика Гонка"
  nf_two.90.d:0 "Народ Двох Сонць завжди вшановував своїх богів на трасі, де найкращі гонщики змагалися у вправних мотоперегонах, як це робили їхні предки до війни. Тож цілком доречно, що гонка, яку ми проведемо в ім’я Марса й самого Цезаря, стане найвидатнішим змаганням, яке колись бачила пустка. Будуть збудовані нові траси, створені нові авто, відкриті нові гаражі, а також проведено менші перегони — усе це підготовка до головної події, яка, без сумніву, приверне увагу з усіх куточків. Щоб найкращі гонщики пустки змогли взяти участь, ми розішлемо запрошення тим, хто буде визнаний гідним."
  nf_two.90.a:0 "Почнімо підготовку"

  nf_two.91.t:0 "Посланець з Двох Сонць"
  nf_two.91.d:0 "Приєднуйтесь до найвеличнішого гоночного змагання всіх часів! Починаючи з Двох Сонць, підготуйтеся до мотоспортивного турніру життя, який пройде на найкращій трасі, яку будь-коли будували. Зустріньте найкращих гонщиків, яких може запропонувати пустка, змагаючись на славу Насу й Марсу, аби визначити, яка нація може по-справжньому називати себе домом абсолютного чемпіона! Спостерігайте за найновішими технологічними досягненнями, які вперше застосовуються та тестуються у такому масштабі!"
  nf_two.91.a:0 "Цікаво"
  nf_two.91.b:0 "Не будемо заважати нашим гонщикам"

  nf_two.102.t:0 "Велика Гонка"
  nf_two.102.d:0 "Цей день назавжди залишиться в історії як той, коли [race_winner] переміг у першій Великій Гонці Двох Сонць. Після довгої та запеклої боротьби проти чотирьох суперників — кожного вправного гонщика по-своєму — на великій трасі Сонори, яка перевершила навіть найсміливіші очікування лідера країни Віла Фастера, боротьба була не на жарт. Та завдяки поєднанню вдачі, майстерності та неймовірної витривалості, [race_winner] зумів вирватися вперед на фінальній прямій, перетнувши фінішну лінію буквально на мить раніше за інших. Народ Двох Сонць і почесні гості святкують цю визначну подію з обіцянками провести ще масштабніше змагання, якщо фортуна дозволить."
  nf_two.102.a:0 "Гонка, яку запам’ятають"

  nf_two.off.t:0 "Кара кульгає, та приходить"
  nf_two.off.d:0 "Велика подяка безсмертним богам Насу, у чиєму храмі ми перебуваємо, найдавнішим захисникам нашого міста, за те, що ми вже стільки разів уникали такого брудного, жахливого й смертельного ворога для Двох Сонць. Але безпека Легіону більше не може бути поставлена під загрозу через одного чоловіка. За наказом Цезаря Генералісимуса буде страчено. Руйнування, яке він так довго планував проти нас, тепер впаде на його ж голову."
  nf_two.off.a:0 "Ми виконаємо свій обов’язок"

  nf_two.300.t:0 "Смерть Бога"
  nf_two.300.d:0 "Цей день ми сподівались не побачити ще багато років. Смерть Цезаря ставить Легіон під загрозу, адже командування одразу ж стало об’єктом боротьби між його найближчими радниками.\nІз ризиком, що імперія й мир, які він створив, можуть розпастися, нам доведеться виконати його волю, забезпечивши, щоб на трон піднявся лише гідний."
  nf_two.300.a:0 "Що ж нам тепер робити?"

  nf_two.301.t:0 "Новий Цезар?"
  nf_two.301.d:0 "Фальшивий Цезар відкинув нашу пропозицію — тепер ми ясно бачимо, що він був негідний нашої вірності з самого початку. Ми змусимо його пошкодувати про своє рішення й виправимо помилку, приєднавшись до істинного Цезаря, а саме..."
  nf_two.301.a:0 "Справжній Цезар"
  nf_two.301.b:0 "Пішов ти, Малпайс"
  nf_two.301.c:0 "Луцій, Відданий Преторіанець"
  nf_two.301.ar:0 "Авреліус, Мудрий Центуріон"
  nf_two.301.e:0 "Ніхто не гідний"

  nf_two.302.t:0 "Посланець з Двох Сонць"
  nf_two.302.d:0 "Сьогодні до табору під’їхав одинокий вершник, і його машина одразу видала його як Вайатта з племені Двох Сонць. Він приносить новини про те, що його народ, який завжди був вірним Цезарю, тепер бажає продовжити цю вірність, присягнувши законному спадкоємцю, й допомогти нам у війні проти узурпаторів."
  nf_two.302.a:0 "Неочікувано, але приємно"

  nf_two.302.b:0 "Вони лише піддані"

  nf_two.303.t:0 "Зрада"
  nf_two.303.d:0 "Народ Двох Сонць зрадив волю Цезаря та відколовся, приєднавшись до наших ворогів у війні за престол!"
  nf_two.303.a:0 "Дегенератам місце на хресті!"