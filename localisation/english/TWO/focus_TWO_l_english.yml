l_english:
 #-------------------------------------
 # Two Sun
 #-------------------------------------
 # Written by [Rhacius], redacted by [Theranis], shamelessly used by CGS

  # Introduction
  two_sun_tucson:0 "Спадок Тусона"
  two_sun_tucson_desc:0 "До війни Тусон був одним із наукових центрів США — домівкою Аризонського університету, важливих військових проєктів і підпільних перегонів. Сьогодні про місто пам’ятає лише жменька гуль. Та Спадок Тусона досі впливає на Два Сонця, що постали на його руїнах."
  two_sun_religion:0 "Культ Насу"
  two_sun_religion_desc:0 "Нас — це швидкість. Нас — це перегони. Нас — це колісниця, дим, вереск шин. Нас — це Автомобіль, а Два Сонця — його послідовники."
  two_sun_will:0 "Вайатт-Демон"
  two_sun_will_desc:0 "Вайатт-Демон відомий і вселяє страх по всій Аризоні — і недарма.\nЙого особа стала легендою, його численні подвиги огорнуті таємницею та вигадками тих, кого він залишив позаду в хмарах пилу. Єдине, що відомо напевно — це його минуле."

  two_sun_caesar_rule:0 "Правління Цезаря"
  wo_sun_caesar_rule_desc:0 "Коли перші війська Легіону загрожували безпеці самих Двох Сонць, їхні гонщики були готові зустріти ворога — заради смерті чи слави — в ім’я Насу. Але дії одного кур'єра переконали їх у зворотному. Він прийшов з пустелі, самотній, несучи символ Великої Лисиці — того, хто колись ніс славу Насу крізь пустку. Лисиця показав народу Двох Сонць, що воля Насу — не напад, а складання зброї, мирний підхід, навіть дари загарбникам. Таким чином Лисиця привів Культ Насу під стяг Бика.\nТепер Вулпес Інкульта сидить ліворуч від Цезаря й довів Сину Марса, що Культ Насу сяє найяскравіше тоді, коли має більше свободи. Бо Нас — це перегони, а Марс — це змагання. Марс — це битва на трасі, уламки після зіткнень, кров і піт, що ллються, коли люди б’ються й гинуть за Перше Місце. Марс — це слава перемоги, і Два Сонця нестимуть його ім’я крізь пустку."


  # Civilian branch
  two_the_roads:0 "Шляхи"
  two_the_roads_desc:0 "Два Сонця мають довгу історію, але вперше за 200 років ця історія об'єднана під владою сильного уряду. Віл Фастер зібрав раду найвидатніших умів Двох Сонць. Жерці, механіки, воїни та гонщики спільно створюють план розвитку міста й навколишніх територій."

  two_scavenging_1:0 "Програма Скарбошукачів"
  two_scavenging_1_desc:0 "Одна з програм, спрямована на здобуття нових матеріалів для наших ливарень і гаражів — траса шукачів дозволяє розбирати деякі довоєнні будівлі в надії дістати металобрухт і будівельні матеріали для наших проєктів. Це вже призвело до того, що цілі сталеві конструкції були розібрані та відправлені на переплавку в наші печі."

  two_scavenging_2:0 "Технологічні Розкопки"
  two_scavenging_2_desc:0 "Успіх попередньої кампанії надихнув раду поставити більш амбітну мету. Цього разу шукачі копатимуть у старих руїнах у пошуках будь-яких складних компонентів, які могли зберегтися."

  two_industry_1:0 "Проведення Інвентаризації"
  two_industry_1_desc:0 "По всій нашій землі розкидано безліч гаражів. Деякі з них — імпровізовані храми, інші — спадщина довоєнної епохи, але всі вони зобов’язані своєю славою імені Насу. Віл Фастер хоче розпочати повну інвентаризацію, щоб виявити більше інструментів і забутих технологій."

  two_industry_2:0 "Промисловий розвиток"
  two_industry_2_desc:0 "Маючи новий набір інструментів і кілька виявлених креслень під рукою, ми тепер можемо застосувати їх у нашій промисловості."

  two_nogales_water:0 "Будівництво водяних насосів у Ногалесі"
  two_nogales_water_desc:0 "Ногалес — друге за величиною місто на наших територіях. Це довоєнне місто зараз надає притулок усім охочим — від іммігрантів із Мексики до рабів-утікачів, які шукають дім подалі від пронизливого погляду Цезаря. Щоб утримати цих людей у наших землях, ми повинні забезпечити їх водою. Рада організує будівництво нових колодязів."

  two_nogales_farms:0 "Розвиток сільського господарства в Ногалесі"
  two_nogales_farms_desc:0 "Тепер, коли постачання питної води забезпечене, ми можемо зосередитися на підтримці фермерів Ногалеса. Велика кількість іммігрантів можуть оселитися тут і обробляти землю навколо міста."

  two_tombstone_garages:0 "Гаражі в Тумбстоуні"
  two_tombstone_garages_desc:0 "Тумбстоун — невелике пустельне селище. Проте рівнини навколо нього ідеально підходять для перегонів. Щоб забезпечити належне обслуговування наших водіїв, Рада вирішила відкрити нові гаражі в Тумбстоуні."

  two_hilltop_garages:0 "Гаражі в Хіллтопі"
  two_hilltop_garages_desc:0 "Хіллтоп — наступний пункт призначення для наших перегонників після Тумбстоуна. Ми можемо подовжити наші траси від Двох Сонць, щоб створити найдовші перегони у Пустках."

  two_explotation:0 "Об’єднана країна"
  two_explotation_desc:0 "Завершивши свої проєкти, рада може звітувати про повний успіх. Наша нова інфраструктура та контроль над землями дозволяють нам нарешті створити надійну галузь видобутку."
  
  # The great race
  two_race_start:0 "§YВелика гонка§!"
  two_race_start_desc:0 ""

  two_race_invitations:0 "Тисни на газ"
  two_race_invitations_desc:0 "З великою гонкою на горизонті та підготовкою в розпалі ми нарешті можемо почати розсилати запрошення, які понесе сам Вайатт.\nЦя довга й небезпечна подорож проведе його крізь пустки й далі; жоден інший перегонник не підходить для цього величного завдання краще."

  two_race_invitations_80:0 "Діти Довгої 80"
  two_race_invitations_80_desc:0 "Фрументарії, що повернулися з Юти, розповідають історії про надзвичайне плем’я, відоме й страшне за швидкість і жорстокість своїх нападів. Якщо їхнє володіння транспортом дійсно таке вражаюче, як вони стверджують, вони стануть гідним суперником, що цілком заслуговує на запрошення."

  two_race_invitations_80_2:0 "Поетична справедливість"
  two_race_invitations_80_2_desc:0 "Ми б ніколи не подумали, що чума Довгої 80 може виявитися талановитими поетами, але майстерність, з якою вони складають рими в майже мелодійні пісні, незаперечна. Однак їхня справжня сила — в кмітливості: вони здатні кермувати своїми машинами днями навіть у безлюдних пустках Юти, зупиняючись лише на мить, щоби дозаправитися."

  two_race_invitations_imo:0 "Залізні Титани"
  two_race_invitations_imo_desc:0 "Лише небагато легіонерських розвідників заходять далеко на південь, особливо після дурниці Паулла на Ріо-Гранде. Проте, незважаючи на ворожнечу, торгівля з рештками Мексики ніколи не припинялась, і одна історія старого торговця зброєю привернула нашу увагу. Схоже, навіть супермутанти не можуть встояти перед благословенним ревом двигуна. Можливо, їх навіть можна вмовити приєднатися, якщо ми просто надішлемо запрошення."

  two_race_invitations_imo_2:0 "Більші за сталевий Техас"
  two_race_invitations_imo_2_desc:0 "Розміщення Залізоробів виявилося менш проблемним, ніж ми очікували. Їхні транспортні засоби, хоч і грубі зовні, приховують справжню красу всередині — як жеода. Спершу розміщені окремо від інших гонщиків, Залізороби згодом змішалися з нашими механіками, що сприяло здоровому обміну ідеями. Хоч ми й різні майже в усьому, наші народи об’єднує любов до машин."

  two_race_invitations_new:0 "Найбільше мале місто"
  two_race_invitations_new_desc:0 "На північний схід від Каліфорнії розташоване Нью-Ріно — місто гріха, яким керують банди, але яке також є домом для найкращих гонщиків по той бік Колорадо. Навіть ризикуючи гнівом Цезаря, Нас вимагає, щоби ми їх запросили."

  two_race_invitations_new_2:0 "Ніхто не каже Вульпесу"
  two_race_invitations_new_2_desc:0 "Гонщики з Нью-Ріно такі ж небезпечні поза трасою, як і на ній. Ми не хочемо знати, як їм вдалося провезти джет та інші наркотики повз патрулі легіону — та нам це й не потрібно. Одне лиш ясно: вони знають, як гуляти всю ніч і при цьому залишатися відносно тверезими для наступної гонки зранку."

  two_race_invitations_gdh:0 "Пам’ятаючи про суперників"
  two_race_invitations_gdh_desc:0 "Наші стосунки з Gente Del Sol завжди були складними — ще з того часу, як вони постали з попелу під проводом хитрого Генераліссімуса Віалли. Проте його народ любить автомобілі майже так само сильно, як і ми, а Нас вимагає найкращих для своєї гонки. Переконати їхніх кращих гонщиків приєднатися буде нескладно — достатньо лише надіслати запрошення."

  two_race_invitations_gdh_2:0 "Огидний Дрифтер"
  two_race_invitations_gdh_2_desc:0 "Ніхто не очікував, що з-поміж усіх Gente представлятиме лучадор на ім’я Пожирач Сонця! Хоча Генераліссімус, без сумніву, добре заплатив би за його захоплення, наші гонщики набагато охочіше кинуть йому виклик у дружній гонці й подивляться, чи зможуть зрівнятися з його лячною майстерністю дрифтування вздовж південного гірського хребта."

  two_invitations_end:0 "Зупинитися"
  two_invitations_end_desc:0 ""

  two_chop_shop:0 "Ідеї — це легко"
  two_chop_shop_desc:0 "'Ми допоможемо майстерні, профінансувавши новий гараж у Двох Сонцях!'\nЦей невеликий жест, сподіваємося, призведе до того, що в майбутньому вони ще активніше вестимуть бізнес на нашій території."

  two_chop_shop_caps:0 "Реалізація — це складно"
  two_chop_shop_caps_desc:0 "Ніхто не знає, коли саме в Двох Сонцях з’явилася перша майстерня. Деякі гульи кажуть, що такі майстерні існували ще до війни, і уряд США неодноразово намагався їх закрити — але в це важко повірити. Навіщо уряду зупиняти настільки прибуткову справу?"

  two_chop_shop_hire:0 "Найняти справжнього покидька"
  two_chop_shop_hire_desc:0 "Бак Тіґ — один із легендарних механіків, який відновив майстерню після її знищення рейнджерами Аризони, які намагались не допустити, щоб обладнання дісталося Легіону. Він більш ніж готовий допомогти нам оснастити наших гонщиків найкрачим обладнанням — звісно, за відповідну плату."

  two_boxes:0 "Новий товар для нових покупців"
  two_boxes_desc:0 "Дозволивши учасникам гонки облаштувати власні майстерні на нашій території, ми не лише зробимо гонку ще кращою, а й зможемо згодом викупити ці нові споруди у наших нових друзів, коли ті повернуться додому."

  two_track_two_1:0 "Колізей"
  two_track_two_1_desc:0 "У центрі нашої землі розташований великий Колізей, хоча траси тягнуться далеко за межі столиці. Саме тут обирають наших лідерів і проголошують переможців. І саме тут розпочнеться наша гонка, і Нас стане свідком її завершення."

  two_track_two_2:0 "Нові торгові шляхи"
  two_track_two_2_desc:0 "У південних частинах наших земель і досі основною мовою є іспанська — це ідеальне місце для налагодження торгівлі з державами Мексики. Розширивши наші дороги на цей регіон, ми не лише відкриємо нові торгові маршрути, але й завершимо нову частину нашої гоночної траси."

  two_track_ton:0 "Усі дороги ведуть до Фінікса"
  two_track_ton_desc:0 "Ми не можемо очікувати, що інші країни матимуть такий рівень внутрішньої інтеграції, як Два Сонця. Проклавши дороги до Юми, ми зможемо долучитися до прибуткової торгівлі вздовж Колорадо й водночас завершити черговий етап будівництва нашої траси."

  wo_track_cow:0 "Але спершу — через Два Сонця"
  two_track_cow_desc:0 "Наші жерці встановили, що дороги, прокладені через колишні території Країни Ковбоїв, не відповідають нашим потребам. Наразі регіон майже безлюдний і має малу цінність, але наші зусилля з розвитку призведуть до заснування нових містечок уздовж траси, які служитимуть зупинками на шляху з одного краю нашої країни до іншого."

  two_track_rio_yaq:0 "Сотня миль бетону"
  two_track_rio_yaq_desc:0 "Наші дорожні мережі не поступаються творінням легендарного Айзена Говарда — міфічного велетня, якому приписують створення довгих доріг, що проходять через колишні території США. І торговці, і гонщики безперечно оцінять наші зусилля."

  two_track_sea:0 "Мрії здійснено"  
  two_track_sea_desc:0 "Збудувати дороги так близько до узбережжя виявилося довгою й складною справою — проте вона себе виправдала. Наша країна тепер ідеально з’єднана сушею, річкою й морем. Та немає часу милуватися краєвидами: з останнім покладеним шматком дороги наша держава нарешті готова провести велику гонку, про яку ми завжди мріяли."

  two_race_launch:0 "Запустити гонку [desc]"
  two_race_launch_desc:0 ""

  two_race_finish_line:0 "§YФінішна лінія [desc]§!"
  two_race_finish_line_desc:0 ""

  # Political branch
  two_ces_trade:0 "Торгівля з Феніксом"
  two_ces_trade_desc:0 "Хоча Флагстафф спочатку було обрано столицею Імперії Цезаря, немає сумніву, що саме Фенікс є її економічним центром — ринки Двох Сонць можуть лише виграти від налагодження тісніших зв’язків. Останнім часом усе більше фрументаріїв проходить через наші землі; одного з них цілком можна переконати доставити нашу нову торгову пропозицію купецьким родинам Фенікса."

  two_ces_tribute:0 "Овальний податок"
  two_ces_tribute_desc:0 "З часом обмеження Легіону зменшилися — збільшивши наш щорічний податок, ми можемо довести посланцям Цезаря, що це було правильне рішення, і що обидві сторони виграють від подальших винятків.\n§OAcceptissima semper munera sunt, auctor quae pretiosa facit.§!"

  two_cohort:0 "Когорта з Сонори"
  two_cohort_desc:0 "Землі Сонори — батьківщина одних із найнебезпечніших воїнів Легіону. Спершу це були вигнані племінники, що прагнуть помсти. Цезар, без сумніву, планує використати їх для знищення набридливих рейдерів-ковбоїв на півдні. Проте, за словами наших контактів серед фрументаріїв, його можна переконати делегувати це завдання комусь іншому."

  two_cowboy_self:0 "Завоювати ковбоїв"
  two_cowboy_self_desc:0 "На захід від наших земель розташована спільнота, відома як Країна Ковбоїв. Вона складається з ранчо, а її армію підтримують залишки аризонських рейнджерів. Ми попросимо Легіон дозволити нам завоювати цих виродків і довести свою цінність."

  two_cowboy_ces:0 "Довести свою цінність"
  two_cowboy_ces_desc:0 "Легіон завоював Країну Ковбоїв раніше за нас, але наразі Цезаря більше турбує Мохаве. Можливо, ми зможемо переконати їх дозволити нашим жерцям керувати цими землями — в обмін на вирішення проблеми рейнджерів?"

  two_rule_cow:0 "Дорога до Ультімо"
  two_rule_cow_desc:0 "Тепер, коли Країна Ковбоїв під нашим контролем, час з’єднати її з Двома Сонцями. Ми змусимо всіх, хто не хоче жити під владою Цезаря — сина Марса — будувати дороги, що об’єднають нашу зростаючу націю."

  two_arizona_rangers:0 "Інтегрувати рейнджерів"
  two_arizona_rangers_desc:0 "Навіть після поразки найнебезпечніші з ополченців-ковбоїв усе ще чинять спротив Двом Сонцям і Легіону. Хоча Легіон, без сумніву, вистежив би та стратив цих незгодних на очах у їхніх родин, ми не зобов’язані діяти так само. Можливо, ці останні залишки аризонських рейнджерів можна переконати здатися — через гуманне ставлення до населення, довівши наші добрі наміри?"

  two_arizona_pacifiing:0 "Розіп’яти рейнджерів"
  two_arizona_pacifiing_desc:0 "Занадто довго народ цього регіону опирався волі Цезаря. Тепер, коли їхній жалюгідний спротив розтоптано сандалями Легіону, завдання умиротворення краю лягло на нас. Деякі з васалів Цезаря вважають нас слабкими за те, що ми не воювали самі, але коли наші дороги заповняться розп’ятими тілами незгодних — це стане видовищем, що затьмарить навіть Ланіуса на сході."

  two_cores_cow:0 "Інтеграція ранчо"
  two_cores_cow_desc:0 "Тепер, коли рейнджери умиротворені, а наші дороги з’єднали столицю з портами Ультімо, ми можемо вільно поширювати наш культ серед народу. Будуть відкриті нові гаражі, а натовпи механіків почнуть перетворювати ці дикі ранчо на користь об’єднаного народу."

  two_annex_ton:0 "Завоювання Юми"
  two_annex_ton_desc:0 "Квентін Лопес до цього часу успішно зберіг нейтралітет своєї країни, попри розташування між Легіоном і НКР. Але ризик того, що одного дня його держава стане трампліном для вторгнення НКР — це загроза, яку ми не можемо ігнорувати. Тому Нація Тохоно зазнає тієї ж долі, що й усі буферні держави, неспроможні захистити себе."

  two_rule_ton:0 "Нові дороги для нових земель"
  two_rule_ton_desc:0 "Якщо ми хочемо керувати цими землями не як окупанти, а як господарі, нам доведеться інтегрувати як територію, так і інфраструктуру — щоби люди й солдати могли вільно пересуватись усередині наших кордонів. На відміну від Країни Ковбоїв, народ Тохоно набагато охочіше допомагає нам у цьому завданні."

  two_ton_secrets:0 "Сільськогосподарські традиції"
  two_ton_secrets_desc:0 "Коли ми захопили землі Юми, ми зробили це задля нашої безпеки. Але наші гонщики виявили справжній хлібний кошик — місце, здатне прогодувати набагато більше, ніж невелике населення Тохоно, і стати джерелом їжі для всіх у нашій зростаючій нації."

  two_cores_ton:0 "Інтеграція Тохоно"
  two_cores_ton_desc:0 "Народ Юми нарешті готовий прийняти нас — не як загарбників, а як співгромадян Двох Сонць. Скуштувавши швидкість наших нових автострад, сама ідея про націю Тохоно стане лише далеким спогадом."

  two_gente_question:0 "Питання Ґенте"
  two_gente_question_desc:0 "Усе, що стосується Генераліссімуса — брехня: його країна, його минуле, його здобутки, мир і амбіції, навіть його титул. Ми запитаємо Флагстафф, чи можна взагалі довіряти такій людині, особливо якщо вона називає себе другом і обіцяє подарунки.\n§OTimeo Danaos et dona ferentes§!"

  two_gente_annex:0 "Підпалити сонце"
  two_gente_annex_desc:0 "Жереб кинуто — Цезар віддав наказ, і ми його виконаємо. Наші гонщики вже готові, з люттю й праведним гнівом у серці, чекати на стартовий постріл, щоб розчавити війська Генераліссімуса. Ті, хто не здасться, зустрінуть смерть просто на наших трасах."

  two_gente_annex_road:0 "Дорога до окупації"
  two_gente_annex_road_desc:0 "Рельєф новозавойованих земель не сприяє побудові відкритих трас, до яких звик наш народ. Але ми просуватимемось уперед, навіть якщо доведеться прорізати шлях просто через землю. На щастя, наша кампанія принесла великий приплив рабів — ідеальних виконавців для цієї небезпечної роботи."

  two_gente_annex_mask:0 "Останній рев"
  two_gente_annex_mask_desc:0 "Виявляється, єдине, що Пожирач Сонця ненавидить більше за Генераліссімуса — це погрози незалежності Gente. Якщо ми хочемо керувати цими землями, з ним доведеться щось зробити."

  two_gente_cores:0 "Сонце сідає"
  two_gente_cores_desc:0 "Останній будівельний проєкт завершено — і сонце остаточно сідає над мрією Генераліссімуса. Ми зробимо все, щоб його прокляте ім’я назавжди зникло зі сторінок історії — як і всі ті, хто безглуздо виступав проти Легіону."

  two_gente_trade:0 "Під захистом Бика"
  two_gente_trade_desc:0 "Як дороги об’єднують наші землі, так і союзи Цезаря об’єднують увесь Легіон. Нам було нерозумно сумніватися в намірах Генераліссімуса — прибутки від його каравану вже наповнюють нашу скарбницю. Можливо, у майбутньому ми зможемо ще тісніше співпрацювати."

  two_gente_trade_res:0 "Енергія Сонць"
  two_gente_trade_res_desc:0 "Наш народ завжди віддавав перевагу відкритій дорозі над усім іншим. Але завдяки новим зв’язкам із Gente ми зрозуміли, що річки — це також автостради, тільки для перевезення ресурсів."

  two_gente_trade_mil:0 "Спільне виробництво зброї"
  two_gente_trade_mil_desc:0 "Генераліссімус пообіцяв нам одне — зброю, зброю, і ще більше зброї!"

  two_gente_trade_arms:0 "Зброя, що перевершує металеві шестерні"
  two_gente_trade_arms_desc:0 "Більшість бачила лише дешевий, масовий товар від Gente del Sol. Але Генераліссімус, на честь своєї дружби з народом Двох Сонць, дозволив нам купувати зброю прямо зі свого особистого сховища. Жоден пістолет чи ніж не зрівняється зі славою відкритої дороги — але ми впевнені, що кожен денарій буде витрачено не даремно."

  two_gente_trade_civs:0 "Нова промисловість"
  two_gente_trade_civs_desc:0 "Торгівля між нашими державами процвітає — наші гонщики вже користуються вікнами виробництва Gente, а наші двигуни живлять кораблі їхнього зростаючого торгового флоту. Ніхто не може заперечити, що ця тісна співпраця пішла обом на користь."

  two_gente_trade_weapons:0 "Власна розробка"
  two_gente_trade_weapons_desc:0 "Генераліссімус пообіцяв нам зброю — і дотримав слова. Настав час створювати власні зразки."

  two_gente_trade_3_suns:0 "§OTres Helios§!"
  two_gente_trade_3_suns_desc:0 "Ми тепер бачимо мудрість Цезаря, який дозволив народу Gente приєднатися до Легіону. Під його пильним поглядом ми більше не вважаємо їх занепадниками, а друзями. Відтепер три сонця світитимуть яскравим світлом на імперію Марса, що зростає."

  two_ces_civil_war:0 "Смерть Бога"
  two_ces_civil_war_desc:0 "Немислиме сталося — Цезар мертвий, і його самопроголошені наступники гризуться за залишки імперії. Жоден із них не зможе замінити Сина Марса, але задля добра Нас і Двох Сонць ми мусимо обрати найбільш гідного претендента."

  two_ces_civil_war_vlp_ally:0 "Новий Цезар"
  two_ces_civil_war_vlp_ally_desc:0 "Вульпес Інкульта завжди був справжнім другом Двох Сонць — можна сказати, ми існуємо завдяки йому. Вульпес закликає до допомоги, і вся нація Двох Сонць відповість."

  two_ces_civil_war_vlp_ally_adv:0 "Що далі?"
  two_ces_civil_war_vlp_ally_adv_desc:0 "Вульпес закликає нас до війни за спадщину Цезаря. Цю кампанію благословлять Кенонболл і Марс!"

  two_ces_civil_war_vlp_run:0 "Вірність — найбільша нагорода"
  two_ces_civil_war_vlp_run_desc:0 "Боротьба Вульпеса за владу провалилася, і ми не встигли допомогти йому вчасно. Але ми ще можемо вчинити правильно, давши йому притулок і захист від переслідувачів. Лис має багато чого сказати — і ми слухатимемо."

  two_ces_civil_war_vlp_run_ally:0 "У Вульпеса завжди є план"
  two_ces_civil_war_vlp_run_ally_desc:0 "Переможець громадянської війни неодмінно спробує відновити Імперію Цезаря у всій її величі — зокрема й на наших землях. Фрументарії Вульпеса вже вирушили в дорогу — залишилось лише обрати сторону."

  two_ces_agency:0 "Запросити фрументаріїв"
  two_ces_agency_desc:0 "Фрументарії можуть навчити нас багато чому."

  two_ces_agency_2:0 "Розширити спостереження"
  two_ces_agency_2_desc:0 "Упродовж останніх місяців підпільна кампанія терору під проводом Вульпеса дала чудові результати. Ми маємо посилити її підтримку."


  # Technological branch

  two_masters_of_motor:0 "Майстри двигуна"
  two_masters_of_motor_desc:0 "Автомобілі не надто змінились з моменту свого винайдення. У підсумку, це все ще святий двигун внутрішнього згоряння, який приводить їх у рух — так само, як і всю державу Два Сонця."

  two_motorized:0 "Заводь двигун!"
  two_motorized_desc:0 "Той, хто може безпечно кермувати, цілуючи красуню, — просто не приділяє цілунку належної уваги."

  two_ven_armor:0 "Королева автостради"
  two_ven_armor_desc:0 "Жриця Насу Сара запропонувала нове вдосконалення для наших автомобілів — ми скористаємося цим благословенням на повну."

  two_ven_armor_scrap:0 "Плавлення заліза"
  two_ven_armor_scrap_desc:0 "Завдяки допомозі майстерні нам вдалося відновити довоєнний ливарний завод, що дозволить виготовляти якісні метали для задоволення зростаючого попиту."

  two_car_2:0 "Зірка автостради"
  two_car_2_desc:0 "Наші торговці дістали довоєнний автомобіль у чудовому стані — він зберігався в місці, яке звалося музеєм, і спочатку використовувався на перегонах, подібних до наших. Після тривалих обговорень жерці Насу дали згоду: ми розберемо його й вивчимо конструкцію, щоби здобути нові знання та, можливо, відтворити його."

  two_masters_of_motorized:0 "Уніфікація запчастин"
  two_masters_of_motorized_desc:0 "Завдяки стандартизованим запчастинам ми можемо суттєво знизити вартість виробництва та обслуговування наших легких транспортних засобів."

  two_doctrine_1:0 "Швидкість — серце битви"
  two_doctrine_1_desc:0 "На початку Другої світової війни німецькі танки не були кращими за французькі чи радянські — радше навпаки. Але в німців була доктрина, що дозволяла використовувати бронетанкові сили з максимальною ефективністю."

  two_doctrine_2:0 "Велика гра"
  two_doctrine_2_desc:0 "Ми проведемо військові навчання біля Хіллтопа, щоб перевірити наші нові стратегії на практиці."

  two_doctrine_3:0 "Уражені громом"
  two_doctrine_3_desc:0 "Могутній Цезар дізнався про наші зусилля й надав доступ до довоєнних книжок із механізованої війни. Ми вивчимо їх до деталей, з особливою увагою до концепції блицкригу."

  two_apc_1:0 "Бронетранспортер"
  two_apc_1_desc:0 "Віднайдений БТР ознаменовує прихід епохи механізованої війни. Вивчивши старі креслення, ми незабаром зможемо відтворити цю страхітливу бойову машину."

  two_apc_supply_grace:0 "Упорядкувати логістику"
  two_apc_supply_grace_desc:0 "З появою механізованої піхоти логістика ускладнилась. Моторизована армія може пройти лише стільки, скільки дозволяє паливо — тому наші постачальні колони є її кровоносною системою."

  two_apc_support:0 "Зброя та постачання"
  two_apc_support_desc:0 ""

  two_apc_2:0 "Оптимізувати наші розробки"
  two_apc_2_desc:0 "Удосконаливши існуючі моделі та врахувавши досвід останніх місяців, ми зможемо створити швидші й ефективніші машини, водночас усунувши слабкі місця."

  two_masters_of_apc:0 "Швидше та міцніше"
  two_masters_of_apc_desc:0 "Наші жерці повинні знайти баланс між захистом, потужністю двигуна та ефективністю конструкції як бойової машини — і все це при мінімізації вартості виробництва."

  two_motorized_1:0 "Пустельні шини"
  two_motorized_1_desc:0 ""

  two_motorized_factories:0 "Розширити моторний цех"
  two_motorized_factories_desc:0 "Міста Двох Сонць мають зростати разом із нашою промисловістю. Ми повинні знайти місце для нових гаражів, навіть якщо доведеться пожертвувати житловим простором."

  two_motorized_construction:0 "Двигуни війни"
  two_motorized_construction_desc:0 "Цезар чітко дав зрозуміти свої наміри, і як його піддані, ми рано чи пізно отримаємо заклик до війни. Краще готуватися вже зараз."

  two_motorized_2:0 "Швидше"
  two_motorized_2_desc:0 ""

  two_motorized_3:0 "Повна мобілізація"
  two_motorized_3_desc:0 "Наш уряд повинен дуже обережно розподіляти ресурси країни, аби досягти військової перемоги та водночас задовольнити базові внутрішні потреби."

  two_tanks_1:0 "Почати розробку танків"
  two_tanks_1_desc:0 "Ми вдосконалили двигун внутрішнього згоряння — тепер його можна вбудувати у пристрій розміром із повозку. Ось вона, зброя нової епохи: танк."

  two_tanks_stats:0 "Відлагоджена машина"
  two_tanks_stats_desc:0 "Суворі пустелі Аризони ніколи не щадили нашу техніку. Але один із наймолодших жерців Насу відкрив нове святе мастило, яке підвищує надійність і зменшує зношення. За це відкриття він заслужив своє священство та подяку всіх Двох Сонць."

  two_tanks_2:0 "Власні панцери"
  two_tanks_2_desc:0 "У Другій світовій німці використовували блицкриг — стрімкі танкові удари — з вражаючим ефектом. Незабаром, завдяки новому одкровенню наших жерців, земля тремтітиме під гусеницями наших машин, а вороги — під нашими колесами."

  two_tanks_attack:0 "Молот Цезаря"
  two_tanks_attack_desc:0 "Під наглядом верховного жерця Насу вся нація Двох Сонць об’єдналася: механіки, гонщики й навіть чужинці, яких ми наполегливо запросили залишитися. Усе це призвело до створення нового зразка зброї — тієї, що перевершить навіть довоєнні танки."

  two_apc_3:0 "Бронерозвідка"
  two_apc_3_desc:0 "[me]"

  two_apc_4:0 "Диво згоряння"
  two_apc_4_desc:0 "Успіх — не наслідок самозаймання, тебе треба самому підпалити."

  two_apc_5:0 "Сучасна броня"
  two_apc_5_desc:0 "[me]"

  two_slave_trade:0 "Надіслати жерців у Флагстафф"
  two_slave_trade_desc:0 "Наші жерці досягли значного прогресу в дослідженнях, і настав час поділитися деякими відкриттями з рештою Легіону. Хоч ми не очікуємо прямої винагороди, можемо розраховувати на щедрі фінансові дари й, можливо, подальші пільги."

  two_slave_trade_2:0 "Ora et Labora"
  two_slave_trade_2_desc:0 "Ставлення Двох Сонць до невільників дуже відрізняється від легіонерського — наші раби мають більше автономії й обіцянку звільнення після довгої служби. Та хоч ми й ставимось до них як до друзів нижчого стану, це не змінює факту, що вони — раби. Тож саме на їхні плечі ляже важкий тягар видобутку ресурсів для нашої індустрії."

  two_ultima:0 "Вікно до моря"
  two_ultima_desc:0 "Тепер, коли ми встановили контроль над [444.GetName], настав час закласти перші кораблі. Але перед цим слід визначити наші цілі в затоці: прагнемо ми панування на морі, чи зосередимось лише на десантах?"

  two_small_fleet_advisor:0 "Доктрина морпіха"
  two_small_fleet_advisor_desc:0 "Рудель має план, і він блискучий. Навіщо витрачати ресурси на великі кораблі, якщо можна просто висадити морпіхів у Баха? Звісно, доведеться тренувати спеціальні частини, але людська плоть дешева."

  two_small_fleet_tech:0 "Швидші транспорти"
  two_small_fleet_tech_desc:0 "За останні кілька місяців ми помітно покращили конструкцію десантних суден. Тепер вони не розсипаються ще до досягнення берега."

  two_large_fleet_advisor:0 "Доктрина великої гармати"
  two_large_fleet_advisor_desc:0 "Мортімер вірить у принцип «більше — краще». Тому він запропонував амбітний проєкт із кількома великими кораблями та флотом супроводу. Цей флот має стати гідним суперником НКР і зростаючих сил Gente."

  two_large_fleet_tech:0 "Морський Бик"
  two_large_fleet_tech_desc:0 "З моменту запуску проєкту наші знання суднобудування значно зросли."

  two_ultima_2:0 "Повний хід уперед"
  two_ultima_2_desc:0 "Кожному флоту потрібне паливо. Щоб забезпечити новий флот, уздовж узбережжя буде збудовано кілька електростанцій."