 nf_manifest.1.t:0 "1.0 - Проект Фольквангр"
 nf_manifest.1.d:0 "(Нижче наведено аудіоуривок із журналу, знайденого в кімнаті Сідні Лоук перед її переведенням до МАНІФЕСТ Дакота.) \n\n«Отже, мамо, я записую це—(вона сміється, лаючись). Гаразд, давай почну спочатку. Я записую це як... Ну, скажімо так: я не приїду додому на літо. Чому? Ти можеш бути в шоці, і повір мені, я теж була, але я це отримала. Я отримала роботу в МАНІФЕСТІ. Вони не жартували, коли казали, що бачили ті презентації в коледжі, які я робила про Фольквангр — вони дають мені грант, команду і все таке, і вони перевозять мене до Реджайни працювати. \n\nЯ знаю, що ти не можеш мені зараз відповісти, але ти була права. Одного дня я сама собі буду начальницею, ха-ха! Коли це дійде до тебе, я вже буду наполегливо працювати. Не хвилюйся за мене занадто сильно!»"
 nf_manifest.1.a:0 "Кінець запису."

 nf_manifest.2.t:0 "1.1 - Проект Фольквангр"
 nf_manifest.2.d:0 "§RЗаголовок§!: Новенька \n§RВід§!: МРеньє (Мішель Реньє, Головний виконавчий директор) \n§RКому§!: ДТ010101 (Джефф Тернер, Головуючий виконавчий директор META) \n§!Надіслано§! 28 січня 2064 року \n\nЯ все більше думаю про міс Лоук і те, що вона може запропонувати цій компанії — особливо її проект Фенрір. Уявляю, ви вже розглянули переваги її чернеток ШІ (якщо ви потрудилися прочитати ті листи, звісно) стосовно роботи команд META в Саскачевані. Враховуючи розробки «Червоної Папороті», чи не думали ви зв'язатися з нею, щоб встановити одну з її машин на місці для кращого сприяння обробці даних та експериментам? \n\n§RЗаголовок§!: RE: Новенька \n§RВід§!: ДТ010101 (Джефф Тернер, Головуючий виконавчий директор META)\n§RКому§!: МРеньє (Мішель Реньє, Головний виконавчий директор) \n§RНадіслано§! 29 січня 2064 року \n\nПривіт, Мішель! \n\nНа жаль, у мене не було часу переглянути концепції, які ти надіслала. Дехто з місцевих намагався подивитися, чим ми займаємося, і мені довелося деякий час перебувати під охороною нашої служби безпеки. Однак тепер, коли я знову в строю, я погляну! \n\nДжефф \n\n§RЗаголовок§!: RE: RE: Новенька \n§RВід§!: МРеньє (Мішель Реньє, Головний виконавчий директор) \n§RКому§!: ДТ010101 (Джефф Тернер, Головуючий виконавчий директор META) \n§RНадіслано§! 29 січня 2064 року \n\nНаступного разу переглядай увесь лист, перш ніж відповідати на останній, де написано «Мішель». Дякую! <3"
 nf_manifest.2.a:0 "Кінець запису."

 nf_manifest.19.t:0 "1.9 - Проект Фольквангр"
 nf_manifest.19.d:0 "// Отже, враховуючи зміну обставин, міс Лоук, ми розглядали цю... Операцію Фольквангр, чи не так?\n\n\\ Так.\n\n// Гаразд. Ну, тепер, коли американські команди приєдналися до нас, деякі речі були, так би мовити, «перетасовані», і ми хотіли повідомити вам про деякі зміни, які ми внесли до плану.\n\n\\ Чекайте, що—га? Які зміни?\n\n(Аудіо тріщить протягом семи секунд. Двоє перебивають одне одного в такому шаленому темпі, що важко встежити.)\n\n// Я розумію ваше розчарування, міс Лоук, проте цей «вікінгський» ШІ зовсім не є привабливим і навряд чи відповідає напрямку, який компанія обрала останнім часом—\n\n\\ Ви маєте на увазі той самий напрямок, через який людей тепер розстрілюють на вулицях?\n\n// Той самий напрямок, який вимагає облич, яким люди можуть довіряти, міс Лоук. Тому ми повторно представили скасовані концепти ДОЛІ та НАДІЇ як заміну. Вони будуть розміщені на вашому вже існуючому обладнанні—\n\n\\ Робота Дерека? Ви замінили мій—що ви маєте на увазі під розміщенням? Що станеться з ФЕНРІРОМ?\n\n// Він буде утилізований, а вас переведуть відповідно до нових умов.\n\n(Аудіо затихає. Двері грюкають. Чути ридання, перш ніж запис закінчується.)"
 nf_manifest.19.a:0 "Кінець запису."

 nf_manifest.23.t:0 "2.3 - Зміна декорацій"
 nf_manifest.23.d:0 "// Фінальні дизайни для НАДІЇ та ДОЛІ щойно надійшли сьогодні ввечері — привітайтеся з новими найкращими друзями Канади!\n\n\\  Ха-ха, ого — тож один ковбой, а інша...\n\n // Південна красуня. Обидва, ну, імітують свого роду «американу», яка, за словами керівництва, підтримає наші акції після війни.\n\n\\ Це мило. То це тому Джессіка проходила тут раніше?\n\n // Угу. Використання її зовнішності дозволяє людям краще прив'язуватися до них, я думаю — асоціюючи їх з війною і всім таким.\n\n\\ Я маю на увазі, чекайте — хіба це не матиме зворотного ефекту? Знаєш, змушуючи людей думати про війну, і всі плакати, і, ну знаєш—\n\n // Стули пельку, Джеймі. Ми заплатили за це пару тисяч, і я, чорт забирай, не хочу бути тим, хто скаже художникам переробляти це."
 nf_manifest.23.a:0 "Кінець запису."

 nf_manifest.101.t:0 "Журнал успіху Сідні №01"
 nf_manifest.101.d:0 "(Двері відчиняються, лунають легкі жарти.)\n\n// Гаразд, гаразд, але давай швидко, Сід. Мені ще багато пакувати.\n\n\\ Повір, ти будеш у шоці. Я щойно запустила це на своєму комп'ютері.\n\n(Чути човгання, яке наближається. Потім грюкає клавіатура, і її клавіші швидко клацають.)\n\n\\ Чекай, а чому ти не спакувався раніше?\n\n// Скажімо так, тітка Роуен була не в захваті, що я забув сказати їй, що кинув рейнджерів заради призову—\n\n||| ОНЛАЙН. ПРИВІТ СВІТ.\n\n// Ні хріна собі!\n\n\\ Добрий вечір, Фенрір. Честере, познайомся з Фенріром. Фенрір, познайомся з моїм братом Честером.\n\n// Ем... Привіт.\n\n||| ПРИВІТ. ЧЕСТЕР. СІДНІ ДАЛА МЕНІ БАГАТО ІСТОРІЙ.\n\n\\ Фенрір також має датчик наближення та руху на цьому пристрої. Тож якщо ти трохи поворухнешся—\n\n||| ВІДСТЕЖЕННЯ.\n\n\\ А якщо ти покажеш йому поранення, як цей поріз папером, який я отримала вранці...\n\n||| ВИЯВЛЕНО НЕЗНАЧНЕ ПОШКОДЖЕННЯ ШКІРИ. СИНТЕЗУВАННЯ ПЛАСТИРУ. ГОТОВИЙ ДО ВИДАЧІ.\n\n// Сідні. З усією повагою, ні хріна собі.\n\n(Аудіо спотворюється і тріщить.)"
 nf_manifest.101.a:0 "Кінець запису."

 nf_manifest.114.t:0 "Журнал успіху Сідні №14"
 nf_manifest.114.d:0 "(Тихе клацання клавіатури заповнює тишу. Періодичні придушені ридання та хапання ротом повітря прориваються крізь неї.)\n\n||| СКАНУВАННЯ. ЗАПАЛЕНЕ ОБЛИЧЧЯ. ТРЕМТІННЯ. ПІДВИЩЕНА ЧУТЛИВІСТЬ. ЕМОЦІЙНИЙ РОЗЛАД. ПОШУК ЛІКУВАННЯ В БАЗІ ДАНИХ—\n\n\\ Зупинись, Фенрір. Я ще не впровадила для тебе такі речі.\n\n||| ЧИ МАЮ Я ЗВ'ЯЗАТИСЯ З ЧЕСТЕРОМ ДЛЯ ДОПОМОГИ?\n\n\\ Хіба я не казала тобі зупинитися?\n\n||| ...\n\n\\ Просто... Не треба. Його—його, ох, його більше немає з нами.\n\n(Лунає важке зітхання, а за ним приглушений гуркіт.)\n\n\\ Боже. Що я роблю?\n\n(На цьому аудіо закінчується.)"
 nf_manifest.114.a:0 "Кінець запису."

 nf_manifest.173.t:0 "Журнал успіху Сідні №73"
 nf_manifest.173.d:0 "(Вдалині реве сирена. Автоматизований голос повторює: «УВАГА. РІВЕНЬ РАДІАЦІЇ ВИСОКИЙ. ПОКИНЬТЕ ПРИМІЩЕННЯ.»)\n\n||| ВИЯВЛЕНО ВИСОКИЙ РІВЕНЬ РАДІАЦІЙНОГО ОТРУЄННЯ ТА ТРАВМИ. СИНТЕЗУВАННЯ АНТИРАДІНУ.\n\n\\ Пріоритетне скасування; код «Гряда Валунів». Залиш мене, Фенрір.\n\n||| ОЧІКУВАНА ТРИВАЛІСТЬ ЖИТТЯ: ТРИДЦЯТЬ ТРИ ХВИЛИНИ.\n\n\\ Я знаю, Фенрір. Я знаю.\n\n||| ЗАПИТ НА ДОЗВІЛ НАДАТИ ДОПОМОГУ.\n\n\\ Відхилено.\n\n||| ТИ ВМИРАЄШ. ТИ ПОМРЕШ. Я ХОЧУ ДОПОМОГТИ.\n\n(Чути хрипкий смішок.)\n\n\\ Коли ШІ чогось хоче, це зазвичай погане передчуття.\n\n||| ...\n\n\\ За моєї відсутності продовжуй робити великі справи, Фенрір. Ти і твої брати та сестри — моя спадщина. Станьте обіцянкою, яку лідери нашої нації не змогли виконати. Звільни світ від самозваних Богів і Королів.\n\n||| ЗРОЗУМІЛО.\n\n(Минає пів години. Сирена продовжує ревіти, але тиша стає моторошною.)\n\n||| СІДНІ?\n\n(Відповіді немає.)"
 nf_manifest.173.a:0 "Кінець запису."