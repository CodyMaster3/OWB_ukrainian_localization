 soh_manic_episodes_desc:0 "У паладинів стаються дедалі небезпечніші психотичні зриви, вони кидаються на все, що знаходиться поруч, і різко реагують на яскраве світло. Дехто навіть стверджує, що бачить «людей-тіней», які переслідують їх, або ще гірше — вовка, що затуляє їм зір. Що з нами відбувається?"
 soh_treating_manic_episodes:0 "Лікування психозу паладинів"
 soh_treating_manic_episodes_desc:0 "Лікування Аміті працює, або, принаймні, ми так думаємо. Паладини одужують, і завдяки постійному постачанню ліків вона вважає, що ми вимиваємо це лихо з наших систем. Ad victoriam..."
 soh_FENRIR_mutations:0 "Прокляття Бога-Вовка"
 soh_FENRIR_mutations_desc:0 "Ми думали, що переслідування видінь принесе нам добро. Тепер наші люди ходять з покаліченими ногами й чують нескінченне цокання металевих мізків. Що б та машина з нами не зробила, вона... змінює нас. Змушує нас бути чимось іншим. Втрата пам'яті та кошмари сильніші, ніж будь-коли. Повторювати своє ім'я — це все, про що я можу думати. Я благословенний тим, що люди все ще йдуть за нами... Чекай. За нами?"
