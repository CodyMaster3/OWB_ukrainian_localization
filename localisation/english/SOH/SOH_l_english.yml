 ##starting idea

 soh_operation_cavalier_idea:0 "Операція «Кавалер»"
 soh_operation_cavalier_idea_desc:0 "У відповідь на власні провали Патрокла у справі з Сестрами Сталі, [SOH.GetLeader] спланувала та розпочала таємну операцію «Кавалер», щоб розібратися з ними особисто. Сповнена рішучості перехопити контроль над ситуацією у Відділку Монтани, вона прагне покінчити із Сестрами Сталі раз і назавжди будь-якими необхідними засобами."

 ##characters

 SOH_hayman_name:0 "Головний паладин Гейман"
 SOH_elder_hayman_name:0 "Старійшина Гейман"
 SOH_hayman_desc:0 "§GОсобова справа — Гейман, Юстинія§!\n\n§YЗвання:§! §gПаладин§!\n\n§R«Ти — остання у спадщині невдач.»§!\n\nЦя цитата визначала життя Юстинії з моменту смерті її батька. У нескінченних намаганнях довести, що її родина гідна належати до роду, подібного до Мексонів, вона присвятила своє життя тому, щоб стати ідеальною зброєю для ієрархів Середнього Заходу. Так вона опинилася серед учасників Експедиції в Монтану — як та, хто мав гарантувати, що рішення Патрокла залучити Сестер Сталі не було помилковим.\n\nІ тепер Юстинія Гейман виправдана і бере справу у свої руки. Власне почуття провини Патрокла зруйнувало його здатність приймати рішення, але в новому відділку немає місця для скиглення. Тільки не тоді, коли на горизонті бовваніє Анклав. На останню зі справжніх Гейманів покладається завдання завершити справу раз і назавжди, знищити зрадників і забезпечити перемогу Братства на чужій землі."
 SOH_elder_hayman_desc:0 "§GОсобова справа — Гейман, Юстинія§!\n\n§YЗвання:§! §gСтарійшина§!\n\n§R«Ти — остання у спадщині невдач.»§!\n\nЦя цитата визначала життя Юстинії з моменту смерті її батька. У нескінченних намаганнях довести, що її родина гідна належати до роду, подібного до Мексонів, вона присвятила своє життя тому, щоб стати ідеальною зброєю для ієрархів Середнього Заходу. Так вона опинилася серед учасників Експедиції в Монтану — як та, хто мав гарантувати, що рішення Патрокла залучити Сестер Сталі не було помилковим.\n\nІ тепер Юстинія Гейман виправдана і бере справу у свої руки. Власне почуття провини Патрокла зруйнувало його здатність приймати рішення, але в новому відділку немає місця для скиглення. Тільки не тоді, коли на горизонті бовваніє Анклав. На останню зі справжніх Гейманів покладається завдання завершити справу раз і назавжди, знищити зрадників і забезпечити перемогу Братства на чужій землі."

 SOH_gideon_name:0 "Паладин Гідеон"
 SOH_gideon_high_command_desc:0 "§GОсобова справа — Гідеон, Лансер§! \n\n§YЗвання:§! §gПаладин§!\n\nЛансер Гідеон — легенда серед своїх побратимів у Братстві Середнього Заходу. Він провів сотні битв у великому районі Чикаго і вирішив провести ще сотню в Монтані. Дивлячись на його досягнення, можна подумати, що він є взірцем цінностей Братства і справжнім паладином ордену.\n\nГейман знає правду. Паладин Гідеон давно втратив любов до битв. Коли його дружина загинула під час звичайного патрулювання Чикаго, він більше за все на світі хотів уберегти інших від тих самих жахіть. Він настільки параноїдально боїться втратити все через привид війни, що заборонил своїй дочці, Рейчел, брати участь у будь-яких боях на передовій.\n\nОднак Рейчел неодноразово приходила до Гейман, благаючи дати їй шанс стати паладином, як її батько. На нещастя для Гідеона, це ДУЖЕ зручна слабкість, яку можна використати."

 SOH_crone_name:0 "Карга"
 SOH_crone_theorist_desc:0 "§GОсобова справа — Мерроу, Лідія§! \n\n§YЗвання:§! §gПисар (колишній), Паладин§! \n\nКарга служила родині Гейманів поколіннями, роблячи все можливе, щоб виплекати нову династію Братства, гідну пам'яті. Однак після смерті батька Гейман у Чикаго, єдиною опікункою Юстинії стала не хто інша, як Лідія Мерроу. \n\nАбсолютно, безмежно жорстока, вона значною мірою прищепила Гейман повагу до таких особистостей, як Ричек. І хоча Юстинія може керувати парадом, Карга завжди смикатиме за її ниточки..."

 SOH_tithe_name:0 "Десятина"
 SOH_tithe_high_command_desc:0 "§GОсобова справа — Вамос, Раян§! \n\n§YЗвання:§! §gЛицар§! \n\nЛицар Вамос був одним із найвідданіших підлабузників Гейман протягом більшої частини її життя, бувши сином рейдера, якого викрали та примусили тренуватися. Завдяки Юстинії його навчили відмовитися від усього, чим було його життя колись, і від усього, що казав йому батько, на користь догм Братства.\n\nТепер він служить її другою правою рукою, займаючись дрібним рекетом і жорстокими справами там, де вона не може бути присутньою, забезпечуючи ресурси, необхідні для фронту."

 SOH_fenrir_name:0 "Фенрір"
 SOH_fenrir_locked_desc:0 "§RПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА§!\n\n§O[!]§! §YПерегляд цього файлу суворо заборонено. Перегляд призведе до відсторонення від МАНІФЕСТУ та судового переслідування.§! §O[!]§!\n\n§RПотрібен пароль!§!\n\n. . .\n\n§RКлюч автентифікації відхилено!§!"
 SOH_fenrir_unlocked_desc:0 "§RПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА ПОМИЛКА§!\n\n§O[!]§! §YПерегляд цього файлу суворо заборонено. Перегляд призведе до відсторонення від МАНІФЕСТУ та судового переслідування.§! §O[!]§!\n\n§RПотрібен пароль!§!\n\n. . .\n\n§GКлюч автентифікації прийнято!§!\n\nФенрір був проектом, таємно розробленим Сідні Лок, коли її власні починання були відкинуті на користь близнюків Надії та Долі, які самі були зліплені з коду колишніх братів і сестер Фенріра та намішані з купою нових, яскравіших доповнень. Тепер, коли Юстинія Гейман діє як маріонетка, Фенрір має шанс повернути власність МАНІФЕСТУ до своїх лав і здійснити мрію своєї творець про побудову суспільства без господарів чи королів."

 SOH_bismarck_advisor_name:0 "Пан Шмідт"
 SOH_bismarck_advisor_desc:0 "§GОсобова справа — Шмідт, Волтер§! \n\n§YЗвання:§! §gВідсутнє§!\n\nВолтер Шмідт, торговець із Бісмарка, добровільно вирішив допомогти спонсорувати наші починання в місті. Хоча Гейман розуміє, що він людина сумнівної репутації, у нього є зв'язки та ресурси, які значно допомогли нам із поселенням у Дакоті."

 SOH_atom_advisor_name:0 "Сестра Леслі"
 SOH_atom_advisor_cultural_desc:0 "§GОсобова справа — Леслі§! \n\n§YЗвання:§! §gПослушниця§! \n\nСестра Леслі — прагматична постать, і Гейман якимось чином знаходить задоволення у спілкуванні з нею. Попри розбіжності між доктринами Кодексу та Сяйвом Атома, вони проводять вечори, обговорюючи дрібні події та намагаючись знайти спільну мову."

 SOH_unbound_advisor_name:0 "Послушник Вінгнат"
 SOH_unbound_advisor_cultural_desc:0 "§GОсобова справа — Вінгнат§! \n\n§YЗвання:§! §gПослушник§! \n\nВінгнат — дивак, але він... милий? Насправді ні. Він нестерпний рейдер-ідіот, якого не захотіли навіть Незв'язані (Unbound), але принаймні він підбадьорює деяких солдатів, які не встигають за темпом подій."

 SOH_marcus_name:0 "Паладин Маркус"
 SOH_marcus_cultural_advisor_desc:0 "§GОсобова справа — Леннетус, Маркус§! \n\n§YЗвання:§! §gПаладин§! \n\nДля більшості членів Братства паладин Маркус Леннетус є справжнім героєм. Швидко просуваючись по службі, він став ключовим лідером і важливою фігурою Братства Монтани. Його стрімкий, швидкісний стиль бою та підхід «ніколи не вмирай» принесли йому та його роті прізвисько «Сталеві Кігті», а відданість «Сталевих Кігтів» паладину Маркусу призвела до численних нагород у Братстві. \n\nОднак Паладин Гейман бачить справжню натуру Маркуса: холодного, розважливого воїна, чия гонитва за перемогою не зупиниться ні перед чим, навіть ціною життя власних людей. Братство може бачити сильного, безсмертного героя, але Гейман бачить актив, того, хто бажає бачити себе на вершині харчового ланцюга. Гейман може дати Маркусу саме це, і тому він таємно присягнув на вірність їй та «Сталевим Кігтям»."

 SOH_basalt_advisor_name:0 "Саллі Мун"
 SOH_basalt_advisor_desc:0 "§GОсобова справа — Мун, Саллі§! \n\n§YЗвання:§! §gВідсутнє§!\n\nСаллі Мун, представниця Караванної компанії Базальту, тепер проводить операції на нашій території в обмін на наше благословення захисту. Звісно, ми робимо це не безкоштовно."

 SOH_knight_matt_name:0 "Лицар Метт"
 SOH_knight_matt_cultural_advisor_desc:0 "§GОсобова справа — Метт, Стефан§! \n\n§YЗвання:§! §gЛицар§! \n\nУсім подобається Метт. Він добрий друг для багатьох представників різних рангів у Братстві Середнього Заходу, і його підтримка дає Гейман значний авторитет серед рядових солдатів Відділку Монтани. На щастя для Метта, таємниця його доволі табуйованих стосунків із Лицарем Рікі залишається в цілковитій безпеці з нею — доки він тримається в рамках."

 SOH_scribe_mance_name:0 "Писар Менс"
 SOH_scribe_mance_cultural_advisor_desc:0 "§GОсобова справа — Менс, Себастьян§! \n\n§YЗвання:§! §gПисар§! \n\nМенс — дослідник до мозку кісток. Він завжди шукає нову проблему з інноваційними інженерними рішеннями. Його люблять колеги, і він має люблячу сім'ю.\n\nЧого не знає ніхто, крім Гейман, так це те, що він також любить шпигувати за своїми колегами в їхніх особистих кімнатах за допомогою добре прихованих камер спостереження. Він був би мертвою людиною в багатьох сенсах, якби ця інформація стала публічною, тому він досліджує те, що йому наказує Гейман."

 SOH_knight_ricky_name:0 "Лицар Рікі"
 SOH_knight_peter_air_chief_desc:0 "§GОсобова справа — Рікі, Сіріл§! \n\n§YЗвання:§! §gЛицар§! \n\nНіхто достеменно не знає, чому Рікі взяли в експедицію в Монтану. Він завжди був чудовим пілотом і вправним механіком дирижаблів на Середньому Заході, але жодного літального апарата на захід не взяли. Єдина, хто знає причину його перебування тут, — це Гейман, яка знає, що у нього давні стосунки з таким собі Лицарем Меттом."

 SOH_scout_james_name:0 "Розвідник Джеймс"
 SOH_scout_james_economic_advisor_desc:0 "§GОсобова справа — Джеймс, Антон§! \n\n§YЗвання:§! §gРозвідник§! \n\nРозвідник Джеймс був у полях так довго, що має більше друзів у сторонніх організаціях, ніж у власному відділку Братства. Не зважаючи на сумнівний вибір друзів, Гейман тримає його при собі через його амбіції. Джеймс убив свого безпосереднього командира і зайняв його посаду близько п'яти років тому, і відтоді чудово з нею справляється. Компетентність і амбіції — це чудові риси для офіцера, особливо коли у Гейман є докази всього, що гарантує його вірність."

 SOH_knight_xavier_name:0 "Лицар Ксав'єр"
 SOH_knight_xavier_economic_advisor_desc:0 "§GОсобова справа — Ксав'єр, Келлі§! \n\n§YЗвання:§! §gЛицар§! \n\nЛицар Ксав'єр має певну польову підготовку, але справжня причина, чому він цінний для Гейман, — це його схильність до майстрування. Він винахідлива натура зі справжнім хистом до ремонту та модифікації практичного польового спорядження.\n\nНа нещастя для всіх, крім Гейман, одна з модифікацій Ксав'єра призвела до загибелі його побратима-лицаря під час нещасного випадку на звичайних тренуваннях. Такий цінний актив набагато корисніший у кишені Гейман, ніж під трибуналом, тому він залишається цінним активом."

 SOH_scribe_johnson_name:0 "Писар Джонсон"
 SOH_scribe_johnson_economic_advisor_desc:0 "§GОсобова справа — Джонсон, Нейт§! \n\n§YЗвання:§! §gПисар§! \n\nЕфективний соціопат, Писар Джонсон любить використовувати мінімальну кількість простору, необхідну для ефективного виконання завдання. Підземні та тимчасові оперативні бази потребують економії простору та праці, і Писар Джонсон якраз має і те, й інше.\n\nУ вільний час він також любить розробляти нові методи тортур. Хоч вони й винахідливі, у Гейман закінчується місце на комп'ютері через величезну кількість схем."

