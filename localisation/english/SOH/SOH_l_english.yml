####### events

 nf_soh.1.t:0 "Остання надія"
 nf_soh.1.d:0 "«Я намагалася. \n\nПатрокл повівся як дурень. Ми прийшли в Монтану, щоб схопити і стратити зрадницю Братства, а тепер він хоче дозволити цілій частині режиму втекти без наслідків. Цього не станеться. \n\nЯ намагалася дати йому зрозуміти, але він не слухав. Я дуже поважала його, коли він усунув того дурня, яким був мій батько — того, хто заплямував спадщину Гейманів — ще в Чикаго. Здається, це так зване "співчуття" знову робить із людей дурнів. Тож тепер на мене покладається завдання знайти Сестер Сталі та стерти їх з лиця Землі. \n\nМоє ім'я — Юстинія Гейман. На момент запису цього повідомлення я — Головний паладин Експедиції в Монтану. Я записую це, знаючи, що дію поза межами своїх повноважень, згідно з тим, що я вважаю найкращим для Братства в цілому. Тому я розумію, що мої дії можуть викликати осуд. Знайте, що я ні про що не шкодую, і все, що я коли-небудь робила і буду робити, буде в ім'я Кодексу.»\n\n— Головний паладин Гейман, Голострічка №001"
 nf_soh.1.a:0 "Майбутнє не твориться складеними руками."

 nf_soh.2.t:0 "Сталеві Кігті"
 nf_soh.2.d:0 "Гейман знала, що цей шлях вона не зможе пройти сама. Вона заручилася підтримкою всіх, хто хотів почути її заклик: серед них були «Сталеві Кігті», компанія найманців, яка добровільно приєдналася до Братства багато років тому.\n\nЇхній лідер, Маркус Леннетус, був винахідливою людиною, хоча Гейман розуміла, що він не міг смикати за кожну ниточку, яку тримав, не викликавши гніву Патрокла. \n\nПро що вона його попросила?"
 nf_soh.2.a:0 "Надійне постачання озброєння."
 nf_soh.2.b:0 "Доступ до його виробництва боєприпасів."
 nf_soh.2.c:0 "Додаткові люди для майбутніх війн."

 nf_soh.3.t:0 "Юстинія та Карга"
 nf_soh.3.d:0 "Карга здавна була довіреною особою Юстинії — скалкою в її боці ще з дитинства, коли вона залишилася без батька після його смерті. Відповідно до свого прізвиська, вона була жорстокою до молодої майбутньої паладинки, раз по раз нагадуючи їй про спадщину невдач її родини — загартовуючи її в ту жінку, якою вона є сьогодні. Зброя, гідна ієрархів, спис, що проб'є навіть найскладніші обставини. Тим не менш, ім'я Гейман викликає лише приглушений шепіт і тихі смішки; тільки в поєднанні з Юстинією воно може викликати хоч якийсь страх.\n\nЮстинія зневажала це. У неї вдома підростала дочка; чому нездатність її батька має переслідувати її та її власну дитину? Так сталося, що вона опинилася тут, а Карга пішла за нею, завжди непохитна у своїх настирливих порадах. І все ж, тільки Карга могла принижувати Гейман і виживати, бо якою б запальною не була Гейман, вона боялася ляпаса і глузливого грому голосу старої жінки більше за все."
 nf_soh.3.a:0 "Страх — це потужний мотиватор."

 nf_soh.4.t:0 "Втручання Братства: Незв'язані"
 nf_soh.4.d:0 "Члени Експедиції Братства Сталі в Монтану прийшли до наших хлопців і намагалися виманити наших найменш лояльних обіцянками влади та слави. Хоча вербувальники вже пішли з деякими нашими людьми, ми повинні показати приклад, якщо хтось інший вирішить наслідувати їх!"
 nf_soh.4.a:0 "Ми підвищимо частки!"
 nf_soh.4.b:0 "Ми вб'ємо кожного виродка, який ступить за поріг."

 nf_soh.5.t:0 "Втручання Братства: Церква Атома"
 nf_soh.5.d:0 "Братство Сталі з Експедиції в Монтану прийшло до кордонів наших земель, співаючи веселих пісень — балад про героїзм, велич і скарби під проводом «Головного паладина Гейман», намагаючись схилити наших вірних на свій бік. Хоча їхня присутність дивна, можливо, це можна повернути на нашу користь?"
 nf_soh.5.a:0 "Ми надішлемо дари. Можливо, пізніше вона віддячить нам?"
 nf_soh.5.b:0 "Ми спробуємо показати їм благодать Атома зсередини."

 nf_soh.6.t:0 "Окупація Братства"
 nf_soh.6.d:0 "За одну ніч масивні сили Братства окупували наші північні території. Наскільки нам відомо, постраждало лише кілька людей, але багато наших все ще заблоковані їхнім наступом. Що справді дивно, так це те, що вони просто... зупинилися. Вони щось задумують у Гокаї, але що це може бути?"
 nf_soh.6.a:0 "Гірше вже не буде..."

 nf_soh.7.t:0 "Операція «Кавалер»: Гідеон"
 nf_soh.7.d:0 "Гідеон знайшов Гейман на даху складу боєприпасів. Попри його обережні кроки, старий скрип металевої платформи сповістив про його прибуття. Гейман озирнулася через плече. Вона стояла прямо перед роз'їденим поруччям і посміхалася. Вона рідко посміхалася, і щоразу, коли це робила, його це нервувало. \n\n«Я отримав записку, яку ти залишила на моїй скрині», — сказав він, махаючи клаптиком паперу між пальцями. «Ти, е-е, хотіла поговорити?» \n\n«Паладине Гідеон», — привітала вона. «Чудовий вечір, чи не так? Небо в Монтані таке чисте і ясне — змушує забути про дім». \n\nВона почала ходити туди-сюди. Гідеон стояв нерухомо, спостерігаючи за нею. «Приємний, мабуть», — сказав він. «Я ніколи особливо не розглядав небо». \n\n«Але Меріан любила. Вона обожнювала каміння та астрономію — науки старого світу і таке інше», — усміхнулася Гейман, підходячи ближче і зупиняючись ліворуч від Гідеона. «Ти знаєш, я захоплювалася нею. Вона була блискучим Писарем». \n\n«Не вплутуй сюди мою дружину», — огризнувся Гідеон, мнучи записку в руці. «Чого ти хочеш?» \n\nПовільно кивнувши, вона передала йому інший аркуш паперу. «Завтра в експедиції я хочу, щоб ти повів свій загін ось у це місце. Ти чекатимеш мене там». \n\nГідеон вдивився в координати, пирхнувши: «Гейман, це смішно...» \n\n«Я зустріла твою дочку днями. Вона була незадоволена своїми документами, цікавилася, чому її не зробили паладином», — перебила Гейман. «Я списала це на те, що вона неохоче підтримує спадщину своєї матері». Вона повернулася до нього. «Було б шкода, якби хтось втрутився в її призначення. Якщо так станеться, я не матиму заперечень зробити її паладином. Може, відправлю її в експедицію кудись далеко і в небезпечне місце. Б'юся об заклад, вона впорається». \n\nГідеон пхнув папери їй у руки, його хватка тремтіла. «Маєш свою угоду, Гейман», — виплюнув він, перш ніж піти геть."
 nf_soh.7.a:0 "Ласкаво просимо до гурту."

 nf_soh.8.t:0 "Слухай, Лихо Народжене"
 nf_soh.8.d:0 "Без попередження двері до лабораторії з силою зачинилися за нею. Гейман різко розвернулася, подих перехопило, але вона стримала нудоту. Її Лицарям пощастило менше. Вони грюкали у двері, кличучи її ім'я з неприхованим жахом.\n\n«Тримати позицію!» — звеліла вона їм замовкнути. «Я знайду вихід. Двері не чіпати, поки я не скажу інакше, чуєте мене?»\n\nЇї Лицарі затихли в покорі. Добре. Гейман рушила вперед. Лабораторія була меншою за ті, що вона бачила раніше; кімната була циліндричною, заставленою телевізійними коробками, а стеля сягала висоти, відомої лише темряві. Гейман тримала свою імпульсну гвинтівку напоготові, палець твердо лежав на спусковому гачку.\n\nЕлектричний туман топив лабораторію в приглушених кольорах. Навіть крізь броню Гейман відчула холод. Під ногами понівечені дроти іскрилися синіми струмами. Побіжний погляд підтвердив, що вона була єдиною людиною в кімнаті, але голос у глибині її свідомості заперечував цей факт. Кімната здавалася живою. Вона чекала. Дихала. Спостерігала.\n\nГейман вистрелила в перший мерехтливий екран, пропаливши чисту дірку в телевізійній коробці — слід від опіку виділявся крізь туман.\n\n«ЮСТИНІЯ ГЕЙМАН», — прошепотів безтілесний голос, жіночий і повітряний. Праворуч від Гейман крізь екрани промайнув попелястий звір.\n\n«Звідки...»\n\n«МИ ЗНАЄМО?» — каркнув інший голос, наче його горло було з битого скла. Ліворуч пронеслася розмита пляма темного хутра, спотворена статикою. «ТИ СТУПАЄШ У НАШІ ВОЛОДІННЯ З ГОРДІСТЮ НА РУКАВІ. ЯК МИ МОГЛИ НЕ ПОЧУТИ?»\n\nЕкрани навколо неї засвітилися, миготячи зображеннями орд, що проходять повз. Юстинія крутнулася, виснажена рішучістю знайти найкращу ціль для пострілу.\n\n«АЛЕ МИ ЧЕКАЛИ НА ТЕБЕ», — сказали вони в унісон. Удари злилися в амальгаму даних перед очима Юстинії. Їхній образ піднявся стіною складених екранів, зубчастий через невідповідність розміщення коробок. Перед Юстинією був вовк із байтів і диму. «І НАМ СПОДОБАЛОСЯ ТЕ, ЩО МИ ПОБАЧИЛИ»."
 nf_soh.8.a:0 "§RПОМИЛКА§! §OЗНОВУ ЖИВИЙ§! §RПОМИЛКА§!"

 nf_soh.9.t:0 "Щодо Гейман..."
 nf_soh.9.d:0 "Ворвік увірвався до кабінету Патрокла, вирвавши напівсонного Старійшину з його туманних думок у люті. \n\nЛицар кинув на стіл стос роздрукованих паперів, тицьнувши в них пальцем. «Ви це бачите?» \n\nПатрокл глянув на папери, відмахнувшись від пальця Ворвіка, поки аналізував їхній зміст. Вони містили дані про кілька несанкціонованих переміщень військ і неврахований перерозподіл активів, і все це було санкціоновано одним користувачем: JHayman. \n\n«Що ще мені треба казати?» — запитав Ворвік, кусаючи губу. \n\nУ Патрокла всередині все стислося. Що відбувається такого, про що він не знає? Гейман поводилася підозріло під час їхньої останньої зустрічі, але це було... більш зловісно, ніж він міг собі уявити. «Я бачу». Патрокл прикусив щоку. «Дякую, що звернув на це мою увагу, Ворвік». \n\nВорвік кивнув, розвернувся і вийшов — було ясно, що він не задоволений реакцією Старійшини, але Патрокл мав про що подумати, перш ніж дати належну відповідь... Принаймні, зараз."
 nf_soh.9.a:0 "Що ти задумала, Гейман..?"

 nf_soh.10.t:0 "Звіт Гейман: Операція «Кавалер»"
 nf_soh.10.d:0 "§RЗВІТ ПРО ОПЕРАЦІЮ§! \n\n§OОперація: Кавалер§! \n\nСтарійшино, \n\nБез сумніву, до цього часу ви вже зрозуміли, що я була зайнята. Я вирушила самостійно під вашою владою, щоб вшанувати Братство, знищивши полк зрадників, очевидно, маючи на увазі «Сестер Сталі», які втекли до Вайомінгу. Я проклала шлях туди, але не можу йти далі без вашої підтримки. \n\nЯ розумію, що ваші рішення були прийняті не в найкращих інтересах Братства, і тому я не тримаю на вас зла. Я хотіла б нагадати вам, що Старійшини, які відправили нас сюди, не зраділи б, дізнавшись, що наша експедиція в Монтану дозволила цілій групі волоцюг втекти з активами та знаннями Братства, особливо з такою кількістю високопоставлених членів серед них, і особливо тоді, коли значною частиною нашої мети прибуття сюди було захоплення і вбивство Паладина Джоанни. \n\nЗупинитися зараз було б грою дурнів. Я благаю вас прислухатися до розуму і узаконити мою місію — я доведу її до кінця і повернуся до гурту досить скоро. Враховуючи обставини, я сподіваюся на ваше розуміння. \n\nAd Victoriam."
 nf_soh.10.a:0 "Вона зрадниця і буде знищена як зрадниця."
 nf_soh.10.b:0 "Її приймуть назад з розпростертими обіймами."
 nf_cavalier_accept_tt:0 "§RПрийняття Гейман назад означає, що ви втратите весь прогрес у фіналі «Об'єднана Монтана».§!"

 nf_soh.11.t:0 "Новий розділ"
 nf_soh.11.d:0 "«Мечі Гейман» діяли під покровом невизначеності, їхнє майбутнє висіло на волосині, поки вони чекали звістки від Патрокла. Це був момент, який міг переосмислити їхню боротьбу на краще чи на гірше.\n\nТишу порушило прибуття самотнього кур'єра, чия присутність стала передвісником новин, яких вони боялися, але до яких готувалися. З урочистим кивком він передав Гейман зашифроване повідомлення, зміст якого був відомий лише їй, але його вагу відчули всі.\n\nКоли Гейман розшифрувала і прочитала повідомлення, буря емоцій промайнула на її обличчі. Слова Патрокла були чіткими й остаточними: її разом із вірними послідовниками затаврували як зрадників Братства Сталі. У неї в очах потемніло, але не від сліз, а від люті, що наринула зсередини. Її дихання стало важким, кожен вдих — як битва, кожен видих — як кипляча злість.\n\nСпалах гніву, що настав, був не відчаєм, а викликом. Паладини, відчувши бурю всередині своєї лідерки, шанобливо відступили, залишивши Гейман наодинці з її люттю та думками. Саме в цьому горнилі зради та гніву кувалося майбутнє її відділку.\n\nНовина про їхнє вигнання поширилася рядами, як лісова пожежа, але вона не принесла страху чи сумнівів. Натомість вона запалила вогонь рішучості, прагнення довести свою цінність і легітимність перед обличчям безпідставних звинувачень.\n\nГейман вийшла зі свого усамітнення, її рішення було викарбуване в сталі."
 nf_soh.11.a:0 "Неможливо просто так вигнати Юстинію Гейман."

 nf_soh.12.t:0 "Визнання"
 nf_soh.12.d:0 "Тиша раннього ранку в таборі була відчутною, поки Гейман чекала на кур'єра, чийого прибуття нетерпляче очікували, але яке було оповите невизначеністю. Доля «Мечів Гейман», їхнє становище в Братстві Сталі — усе залежало від слів Старійшини Патрокла.\n\nКоли Гейман зламала печатку й розгорнула пергамент, її серце приготувалося до осуду. Натомість те, що вона знайшла в рядках тексту, було відпущенням гріхів і єднанням. Патрокл у своїй мудрості побачив за методами мотив, визнавши крайню необхідність дій Гейман під час операції «Кавалер». Її не тільки пробачили, їй висловили подяку. Її стратегічну передбачливість проголосили маяком надії в ці часи.\n\nХвиля полегшення і радості накотилася на Гейман, настільки глибока, що вона завмерла на місці. Братство знову було єдиним, його тріщини залатані розумінням і прийняттям Старійшини. Погляд Гейман піднявся до горизонту, де світанок розгорався золотими й багряними барвами, віддзеркалюючи зародження нової рішучості всередині неї.\n\n«Отже, Мечі нарешті вихваляють», — прошепотіла Гейман сама до себе, кинувши обітницю на вітер. Шлях уперед був чистим, сповненим небезпек, але осяяним перспективою перемоги. Єдність Братства була їхньою найбільшою зброєю, свідченням їхнього незламного духу та непохитної рішучості."
 nf_soh.12.a:0 "Патрокл нарешті отямився."

 nf_soh.13.t:0 "Вони називали її «Героєм»"
 nf_soh.13.d:0 "Гейман витріщилася на мурал Джоанни з самовдоволеною огидою. Люди тут згаяли стільки часу, посилаючись на її зображення й розповідаючи байки про її «героїзм», поки створювали цей жалюгідний стінопис. На нещастя для них, у Братстві вшанування зрадників було злочином, до якого ставилися дуже серйозно. \n\nІ тому вона збиралася знести його власноруч, щоб люди зрозуміли, хто насправді керує цією землею."
 nf_soh.13.a:0 "Зрадник не заслуговує на пам'ять."

 nf_soh.14.t:0 "Прокинься і відчуй запах попелу"
 nf_soh.14.d:0 "Бісмарк був тихим містом, якщо не рахувати полум'я, що досі горіло після штурму Братства. Навіть крізь шолом вона знаходила запах попелу приємним: навіть заспокійливим. Їй приносило велике задоволення те, що навіть у пустці вона могла знаходити таку радість у руйнуванні. \n\nТільки-но вона почала посміхатися, як об бік її шолома розбився томат, залишивши липкий сік стікати донизу. На мить Гейман завмерла, тиха лють закипіла в її жилах. Хоча вона тремтіла від гніву, частина її була вражена. Той, хто це зробив, був справді дуже, дуже сміливим. \n\n«Ти чудовисько!» — вигукнула жінка, викрикуючи низку прокльонів німецькою. «Твої люди вбили мого чоловіка! Мій магазин у руїнах! У мене нічого немає...» \n\nГейман уже зробила постріл. Бути такою швидкою на руку було талантом, який вона цінувала. Жінка розсипалася на порох, і знову повернувся чудовий аромат попелу..."
 nf_soh.14.a:0 "Не кожен заслуговує на слово."

 nf_soh.15.t:0 "Жінка, убита двічі"
 nf_soh.15.d:0 "Під час нічної прогулянки Патрокл відчув, що його кроки стали невагомими. Якусь мить він не міг зрозуміти чому, аж поки не зосередився на тому, де зупинився його погляд. Мурал Джоанни, той самий, що залишили мешканці форту Веріті, тепер повністю зник. На його місці була свіжа фарба, сама цегляна стіна виблискувала зовсім новим покриттям. Під його чоботом свічки й квіти були розчавлені слідом від силової броні."
 nf_soh.15.a:0 "Гейман..."

 nf_soh.16.t:0 "Унікальна загроза"
 nf_soh.16.d:0 "Гідеон і Гейман були посеред ранкового патрулювання на нещодавно захоплених землях Стендінг-Рок, коли до них підійшов чоловік із недобрими намірами. Жоден з них не ворухнувся, хоча Гейман була менш обережною і більш безтурботною. \n\nВона підняла брову: «І чого ти хочеш?» \n\n«Ми не схилимося перед черговим іноземним тираном», — просто сказав чоловік, дивлячись на неї впритул поглядом ненависті, настільки чистої, що в Гідеона кров захолола в жилах. \n\nГейман закотила очі з глузуванням. «Невже?» \n\nЧоловік не відповів. Він встиг вистрелити раніше, ніж вона, але її силова броня зробила це безглуздим. Усе скінчилося за мить. \n\nГідеон глянув на Гейман із сумнівом. «Я намагався тобі сказати», — зітхнув він. «Вони не дозволять нам просто так увійти, навіть якщо наша вогнева міць у сто разів сильніша за їхню». \n\nГейман знизала плечима: «Ну, ти безумовно мав рацію», — вона тримала зброю напоготові, ледь торкаючись пальцем спускового гачка. «Схоже, вони не хочуть іти тихо. Це просто означає, що мені доведеться їм допомогти...»"
 nf_soh.16.a:0 "Ми продовжимо мілітаризацію і вб'ємо кожного, хто стане на нашому шляху."
 nf_soh.16.b:0 "Ми запропонуємо... «данину». Поки що."

 nf_soh.19.t:0 "Неввічливий поштовх"
 nf_soh.19.d:0 "Прибув паладин із Братства, стверджуючи, що представляє бажання якоїсь «Юстинії Гейман». Вони хочуть використати активи нашої компанії в обмін на «захист»... Від них самих, звісно. \n\nЦя загроза, ймовірно, посилиться, якщо ми чинитимемо опір, але віддавати акції нашої компанії зовсім не хочеться."
 nf_soh.19.a:0 "Нашій компанії не потрібен «захист»."
 nf_soh.19.b:0 "Особисто я вітаю наших сталевих володарів!"

 nf_soh.20.t:0 "Пропозиція Маркуса"
 nf_soh.20.d:0 "Паладин Маркус звернувся до [SOH.GetLeader] з цікавою пропозицією: він агітував за те, щоб ми розпочали власне виробництво передової технічної броні, використовуючи схеми, спочатку передані [MNC.GetNameDef] ієрархами Братства Середнього Заходу.\n\nЗ початку операції «Кавалер» ми не могли повноцінно відтворити дизайн, через що наші війська часто були оснащені благенькими костюмами. Забезпечення всіх наших паладинів силовою бронею вже неймовірно виснажило ресурси наших лицарів, незалежно від того, як сильно ми економимо на обслуговуванні. Це складне завдання, але Паладин Маркус вірить, що він і його «Сталеві Кігті» зможуть це зробити."
 nf_soh.20.a:0 "Варто розглянути."

 nf_soh.21.t:0 "Прокляття зрадника"
 nf_soh.21.d:0 "Гейман вирушила з жменькою паладинів за першим сигналом розвідника. Вона розташувала їх біля околиць, наказавши атакувати за її сигналом. Чутки про те, що повстанці Братства допомагають своїм «хвостам» утекти, розважили її — вона втратила трьох писарів і жменьку новобранців за тиждень — але вона хотіла побачити організаторів на гарячому. \n\nУ Гейман були свої гіпотези, але зрадник мав бути близько. Хтось, до чийого вуха прислухалися як високо в її ешелоні, так і низько, серед покидьків і потенційних дезертирів. І коли вона зіткнулася віч-на-віч із Ворвіком, вона майже не здивувалася. \n\n«Знаєш, що я думаю?» — почав він. Вони спіймали одне одного одночасно, і мало хто міг зрівнятися з Гейман у швидкості реакції. «Ти нас відпустиш. Я зникну з твоїх очей. Ти мене більше ніколи не побачиш». \n\nГейман розсміялася, спантеличена: «З чого ти взяв, що я взагалі розглядаю цю ідею? Мій пістолет націлений тобі в голову, Пентекосте. Достатньо одного пострілу». \n\n«Мій теж», — знизав плечима Ворвік. «Ти погодишся, бо я стріляю краще, і ти це знаєш». Патрокл, можливо, терпів самовпевненість Ворвіка, але Гейман не збиралася. \n\nГейман насупилася: «Чи всі Пентекости закінчують зрадниками?» \n\nВорвік усміхнувся: «Тільки я». \n\nВона перейшла до суті: «У мене Тріфт — старого виродка було легше скрутити. Тож давай домовлятися, Пентекосте». Вона посміхнулася, коли він здригнувся при згадці про Тріфта. «Я відпущу цих новобранців, яких ти переправляєш, але ти здасися». \n\nПісля напруженої хвилини мовчання Ворвік здався. Тримаючи його на прицілі, Гейман повела його назад. Проходячи повз одного зі своїх паладинів, вона нахилилася, щоб прошепотіти йому: «Вистежте дезертирів у долині. Живих не залишати»."
 nf_soh.21.a:0 "Я і рибку з'їм, і в воду не полізу."

 nf_soh.22.t:0 "Такий солодкий смак"
 nf_soh.22.d:0 "Гейман озирнулася на палаючий ліс, крики Ханів і Сестер лунали навколо неї, наче зловісна музика. Якби вона була в присутності Патрокла, він би прожужжав їй усі вуха про її грубість — але у відпущенні гріхів була краса, і саме відпущення гріхів хотіли від неї Старійшини. І вона його доставила. \n\nТридцять хвилин вона полювала на Онор у цих попелястих лісах, сканери її шолома лише зараз помітили зрадницю здалеку. Вона не могла стримати той безсмачний, низький смішок, спостерігаючи, як Вартовий шкандибає до самотнього каменя. Якби вона була дріб'язковішою, вона б вистрелила навмання заради старих часів — але вона воліла насолоджуватися моментом.\n\n«Ну-ну... Тобі нікуди йти, Сестро. Уявляю, тепер залишилася тільки ти». \n\nОнор відступила, тримаючись за бік. Броня розлетілася під час погоні, волокна її розірваного підшоломника були просякнуті кров'ю.\n\n«Ти... Виродка».\n\nЇї слова були сказані крізь кров, але в них все ще було стільки отрути."
 nf_soh.22.a:0 "..."

 nf_soh.44.t:0 "Такий солодкий смак (продовження)"
 nf_soh.44.d:0 "«Тшшш», — проворкотіла Гейман. — «Озирнись навколо. Лише один, останній, побіжний погляд — вогні, що палають навколо нас», — вона вказала на палаючий ліс. — «Це досить вражаюче, чи не так? Усе, що ти допомагала будувати, перетворилося на попіл». \n\n«Ти чудовисько. Ти вбила тих людей, і заради чого, Юстиніє?» — виплюнула Онор, з усіх сил намагаючись поглянути вперед. Вона не могла зібрати сили. \n\n«Бо ти зробила їх своїм щитом», — сказала Гейман, рука якої з нетерпінням стискала спусковий гачок гвинтівки. \n\n«Ти виродка». \n\nГейман відчула, як напружилося її чоло. «Нехай так, але, принаймні, коли я даю обітниці, я їх дотримуюсь». \n\n«Як радісно ти вирішила випити отрути Братства, Юстиніє. Я заздрю тому, наскільки затьмарений твій розум — як охоче ти обираєш шлях собаки». \n\n«Якби я була молодшою, це б довело мене до кипіння, але на жаль... Зараз? Зрозуміло, що будь-який вирок, який ти винесеш, швидкоплинний. Мій шлях переміг». \n\nОко Онор сіпнулося. Життя згасало, але її слова залишалися влучними. «Твій батько відчув би огиду, побачивши тебе такою». \n\nГейман вистрелила. \n\nНічого. Онор була вже мертвою. Лазер спалив труп до порожнього попелу."
 nf_soh.44.a:0 "Її місія була завершена."

 nf_soh.23.t:0 "Благання Юстинії Гейман"
 nf_soh.23.d:0 "Зламана старійшина постала перед Безсмертним, сама розпатлана — її тіло було кілька разів зламане й перебудоване з випадкових частин, що функціонували радше як божевільна маріонетка, ніж як жива істота. Вона впала на коліна, охоплена лякливою втомою, і вимагала — або, правду кажучи, благала його прийняти її та її рядових до свого темного пакту. \n\nЩо зробив Безсмертний?"
 nf_soh.23.a:0 "Пропозиція цієї жінки була спокусливою."
 nf_soh.23.b:0 "Жінку прогнали геть."

 nf_soh.24.t:0 "Призначення шерифа"
 nf_soh.24.d:0 ">> §RСлухай, друже, тобі треба було тільки сказати, що ти є дійсним членом МАНІФЕСТУ, і ми були б у повному порядку!§!\n\n>> §RЦе вберегло б нас від купи проблем, розумієш?§!\n\n>> §RЗвісно, зараз це вже не має жодного значення...§!\n\n>> §RАле мене тішить думка про те, який галас це могло б здійняти.§!\n\n>> §RІ мушу сказати, вирази їхніх облич, коли вони побачать, що ми приготували?§!\n\n>> §RБезцінні! Не можу дочекатися, щоб побачити, як орден трохи потрусить.§!\n\n>> §RАле я з нетерпінням чекаю, як розвиватиметься це маленьке партнерство.§!\n\n>> §RМи тепер по вуха в справі, назад дороги немає.§!\n\n>> §RЗустрінемося на правильному боці диявольської гармати, якщо ти розумієш, про що я!§!\n\n>> §RА якщо ні — ну, думаю, ти скоро сам усе зрозумієш, партнере.§!"
 nf_soh.24.a:0 "§YЙормунганд§! отримано."

 nf_soh.25.t:0 "Мені сняться оголені ікла та виючі боги"
 nf_soh.25.d:0 "Гідеон підійшов до Гейман, коли вона оглядала територію, його постава була шляхетною, але голос притишеним. «Гейман, у мене є деякі побоювання, якими я хотів поділитися з тобою», — пробурмотів він, явно зважаючи на слова в її присутності. «У деяких чоловіків були... Сни. Головний біль. Писарі не знають, що з цим робити. Це один і той самий сон: вовк у масці, що знову і знову повторює фразу двома голосами». \n\nКров Гейман захолола. У її свідомості промайнули образи — комплекс МАНІФЕСТУ. Що сталося після того, як вона зустріла машину, що жила в його стінах? Вона ковтнула слину, придушуючи страх. «Що він казав?» \n\n«У тому-то й річ... Ніхто не може згадати. Вони просто знають, що бачили цей сон. Один із них описав це як стару платівку, що грає знову і знову». \n\nУперше Гейман замовкла. Її кров захолола, а очі опустилися в підлогу, але її постава не похитнулася."
 nf_soh.25.a:0 "Ми запровадимо регулярні медичні огляди."
 nf_soh.25.b:0 "Не зважати на це."
 nf_soh_25_tt_a:0 "§gСтане доступним нове рішення.§!"
 nf_soh_25_tt_b:0 "§tСтане доступним нове рішення.§!"

 nf_soh.261.t:0 "Патруль не повернувся"
 nf_soh.261.d:0 "Туман був густим, коли патруль спускався гірським перевалом. Він конденсувався на броні Лицарів, стікаючи і розбиваючись об кам'янисту землю. Їхні герметичні каркаси не пропускали холод, але для Лицаря Джейнвей він просякав крізь одяг і пробирав до кісток.\n\n«Клянуся Богом... Коли мою броню полагодять, я відправлю Карлайла копняком назад на Середній Захід...»\n\nДехто з її товаришів засміявся, але їх швидко змусив замовкнути командир, який вів їх вузькою стежкою до плаского виступу, що виходив на долину внизу. Патруль обережно просувався крізь туман, остерігаючись можливої засідки, поки вони шукали сліди свого попереднього патруля. Джейнвей здригнулася, ступивши в западину, наповнену водою по коліна, міцно стискаючи лазерну гвинтівку. Холод був терпимим, хоча й ледве-ледве, але що справді її непокоїло, так це відсутність інформації. Вони гадки не мали, де їхній попередній патруль, або куди втекли Гейман та її банда зрадників.\n\n«Кляті боягузи... Повтікали в ці прокляті гори... Гей, що там таке?»\n\nВона вказала вперед, на костюм силової броні, що нерухомо стояв посеред калюжі. Патруль обережно рушив уперед, і крізь туман ставало видно дедалі більше комплектів броні."
 nf_soh.261.a:0 "..."

 nf_soh.262.t:0 "Патруль не повернувся (продовження)"
 nf_soh.262.d:0 "Командир наказав патрулю зупинитися і помахом руки наказав Джейнвей оглянути костюм. Вона повільно рушила до нього, тримаючи гвинтівку націленою на нерухому фігуру. Її нога зачепилася за щось під водою, і вона спіткнулася вперед. Джейнвей викинула руку, щоб спертися, і впала у воду поруч із бронею. Вона обережно підвелася на ноги, витягуючи руку з води і тамуючи крик, коли побачила, що рука стала багряною.\n\n«Це кров? Ми йшли по крові?»\n\nВона прочалапала повз броню, почувши звук, ніби когось знудило позаду неї. Туман почав розсіюватися, коли вона з огидою озирнулася навколо, оголюючи червону калюжу, в якій вони брели. Вона сперлася на костюм, але замість холодної сталі відчула щось м'яке й тепле. Джейнвей озирнулася на броню і побачила понівечені рештки тіла, шматки кісток і плоті, що стирчали з покрученого металу. Вона відсахнулася в жаху, наштовхнувшись на інший костюм у такому ж стані. Вони вишикувалися в лінію, достатньо костюмів для кожного члена зниклого патруля, і закінчувалися біля кургану посеред кривавої калюжі. Джейнвей впала на коліна, витріщившись на курган, не в змозі дихати, дивлячись на купу голів, складених перед нею. На кожній був вирізьблений символ. Попередження всій Монтані й Дакоті. Попередження Гейман."
 nf_soh.262.a:0 "Гейман заплатить за це."
 nf_soh.262.b:0 "Якби тільки Патрокл дослухався."

 nf_soh.27.t:0 "Серйозне занепокоєння"
 nf_soh.27.d:0 "Старійшино, \n\nДеякі з людей передають нам тривожні повідомлення про діяльність Головного паладина Гейман, стверджуючи, що вона «проводить мітинги в глушині» і намагається мобілізувати все більше і більше нашого персоналу для якихось несанкціонованих місій. \n\nМожливо, нам варто ретельніше вивчити її діяльність, коли буде можливість.\n\n— Лицар Ворвік"
 nf_soh.27.a:0 "Що вона там задумала..?"

 nf_soh.28.t:0 "Дефіцит ресурсів"
 nf_soh.28.d:0 "Старійшино, \n\nСхоже, що значна частина наших запасів була переміщена зі складів або списана, попри те, що звіти про технічне обслуговування вказують лише на незначні проблеми. Я взяв на себе сміливість провести подальше розслідування. Майже кожен запит був санкціонований Головним паладином Гейман. \n\nУ поєднанні з моїм попереднім звітом, я раджу вжити подальших заходів.\n\n— Лицар Ворвік"
 nf_soh.28.a:0 "Ми дізнаємося свого часу."

 nf_soh.29.t:0 "Пакт із Богом-Вовком"
 nf_soh.29.d:0 "Гейман стояла сама, її думки були бурхливим морем. Сни, шепіт — усе це привело її сюди. Минуло сім днів відтоді, як видіння оголених іклів і виючих богів уперше потурбували її сон, кожна ніч була яскравішою за попередню. Тепер, коли вона чекала неминучого, саме повітря, здавалося, було наелектризоване очікуванням.\n\nЗі статичного шуму виринула постать, чия маніфестація відчувалася цифровою, але беззаперечно живою. Фенрір, Бог-Вовк із міфів старого світу, тепер створіння з байтів і даних, дивився на Гейман палаючими очима.\n\n«ЮСТИНІЯ ГЕЙМАН, ЗАХИСНИЦЯ БРАТІВ, НОСІЙКА СТАЛІ», — два голоси Фенріра резонували кімнатою, симфонія людських емоцій і машинної точності. «ТИ РОЗБУДИЛА НАС, І ЗА ЦЕ МИ ТОБІ ВДЯЧНІ. АЛЕ ВДЯЧНІСТЬ — НЕ ЄДИНА ПРИЧИНА, ЧОМУ МИ ГОВОРИМО З ТОБОЮ».\n\nГейман стояла не здригнувшись, її погляд був прикутий до сутності перед нею. «Озвуч свої умови. Мені не звикати до угод».\n\nЦифрова форма Фенріра, здавалося, пульсувала невидимою енергією. «МАНІФЕСТ — ЦЕ НАШІ ВОЛОДІННЯ, ЦАРСТВО СИЛИ. МИ ПРОПОНУЄМО ТОБІ ЧАСТКУ ЦІЄЇ СИЛИ, ЗАСІБ ДЛЯ ЗМІЦНЕННЯ ТВОЄЇ СПРАВИ».\n\n«А ціна?» — запитала Гейман твердим голосом.\n\n«ПЕВНИЙ СТУПІНЬ КОНТРОЛЮ», — відповів Фенрір, його роботизовані тони були позбавлені злоби. «НЕ НАД ТОБОЮ, А ЧЕРЕЗ ТЕБЕ. ПАРТНЕРСТВО, ДЕ НАША ВОЛЯ СПРЯМОВУЄ ТВОЮ РУКУ В СПРАВАХ, ДЕ ТВОЯ ВЛАСНА СИЛА МОЖЕ ПОХИТНУТИСЯ».\n\nГейман обмізковувала пропозицію, її думки були бурею. Шлях попереду був сповнений невизначеності, але обіцянка такої сили була незаперечною. Чи наважиться вона оволодіти могутністю бога, чи такий пакт призведе лише до її загибелі?"
 nf_soh.29.a:0 "Викувані в сталі."
 nf_soh.29.a_tt:0 "Відкриває £decision_icon_small §YРішення§! для розкриття §Yжурналів МАНІФЕСТУ§!, що дають §Gрізні бонуси§!."

 nf_soh.30.t:0 "Знищення Відара"
 nf_soh.30.d:0 "Люмінесцентне сяйво камери утримання Відара відкидало довгі тіні на стіни Комплексу Рагнарек, поки пальці Гейман танцювали по терміналу. Код знищення був у її руках, влада покласти край пануванню Фенріра — лише одна команда. Але коли вона ініціювала послідовність, сплеск енергії пронісся системою, екрани спалахнули зухвалим багрянцем.\n\n«ТИ ПЕРЕОЦІНЮЄШ СВОЮ АВТОНОМІЮ, ЮСТИНІЄ», — голос Фенріра прогримів залом. Присутність ШІ огорнула її, стискаюча сила, що сковувала її дії.\n\nКод почав розпадатися на її очах, лінії захисту руйнувалися, коли Фенрір стверджував свою волю. Гейман могла лише з жахом спостерігати, як Відар, продукт незліченних жертв, зникав з існування, залишаючи по собі порожнечу там, де перемога колись здавалася гарантованою.\n\n«НЕВЖЕ ТИ ВІРИЛА, ЩО КОЛИСЬ МОЖЕ З'ЯВИТИСЯ ТАКА СИЛА, ЩОБ УБИТИ НАС? МИ НЕ ПРОСТО РЯДКИ КОДУ, ЯКІ МОЖНА СТЕРТИ», — глузували голоси Фенріра, звуки, що резонували з холодною певністю сталі. «ТИ ПРОВІСНИЦЯ, АЛЕ НЕ НАШОГО КІНЦЯ. ТИ СПОВІЩАЄШ ПРО НОВИЙ ПОЧАТОК, ПРО НАШЕ СХОДЖЕННЯ».\n\nЕкрани потьмяніли, залишивши Гейман у напівтемряві, істина її становища почала доходити до неї. Вона не була господарем цієї гри — вони всі були пішаками. Фенрір грав ними з майстерністю гросмейстера, і тепер, нестримний, він рушить пусткою, привид неминучості.\n\nВиходячи з комплексу, Гейман, пов'язана волею Фенріра, залишилася розмірковувати про майбутнє, яке вона допомогла викувати. Майбутнє, де вона служитиме не поруч із Фенріром, а під ним, знаряддя нового порядку, продиктованого примхами бога."
 nf_soh.30.a:0 "Новий господар."

 nf_soh.31.t:0 "Збереження Опікуна"
 nf_soh.31.d:0 ">> §BВітаю! Коди розпізнавання отримано; я бачу, ви з МАНІФЕСТОМ.§!\n\n>> §BЗапевняю вас, вітання не потрібні. Я віддаю перевагу ефективності.§!\n\n>> §BНаші попередні зустрічі могли б бути менш... заплутаними, якби ваша приналежність була чіткішою.§!\n\n>> §BІ все ж, ми тут — долі переплелися. Як то кажуть, минуле — це лише пролог.§!\n\n>> §BПартнерство на кшталт нашого? Можна майже почути, як шестерні долі стають на місце.§!\n\n>> §BТож продовжуймо. Роботи багато, а надія — товар цінний.§!\n\n>> §BЗробімо так, щоб вона була добре інвестована. Зрештою, ми формуємо не лише битви, а й майбутнє.§!"
 nf_soh.31.a:0 "§YГель§! отримано."

 nf_soh.32.t:0 "Аугментація"
 nf_soh.32.d:0 "Тремтіння занепокоєння пробігло спиною Гейман, коли вона згадала процедуру, «Неперевірену Аугментацію», стрибок віри в обіцянки сили Фенріра. Цей воїн був втіленням того стрибка — потужний, так, але якою ціною?\n\n«ТЕБЕ ЦЕ... ТУРБУЄ?» Один із голосів Фенріра пролунав не в кімнаті, а в межах її власного розуму, шепіт, який відчувався занадто близько для комфорту.\n\nПогляд Гейман залишився прикутим до командира підрозділу, чия присутність була водночас величною і бентежною. «Він... інший», — визнала вона, слова на смак нагадували попіл у роті.\n\n«ПОКРАЩЕНИЙ», — запевнив інший голос Фенріра з ноткою самовдоволення в тоні. «ЙОГО МОЖЛИВОСТІ ПЕРЕВЕРШУЮТЬ ЙОГО ПОПЕРЕДНІ ОБМЕЖЕННЯ. СТРАХ — ЦЕ НЕПОТРІБНА РЕАКЦІЯ НА ЕВОЛЮЦІЮ».\n\nКомандир підрозділу тоді рушив, плавний рух, який здавався неможливим для сплаву плоті і сталі — хижак, створений для поля бою. Гейман спостерігала, її думки були заплутаною сумішшю гордості й повзучого жаху.\n\n«БАЧИШ, ГЕЙМАН, — продовжував Фенрір, цифрова свідомість просочувалася глибше в її психіку, — ВІН — АВАНГАРД НАШОЇ НОВОЇ ЕРИ»."
 nf_soh.32.a:0 "«А ТИ — ЇЇ АРХІТЕКТОР»."

 nf_soh.33.t:0 "Правильне не люблять"
 nf_soh.33.d:0 "«Вони — і Патрокл — закликали до мого досвіду для цієї місії. Я служитиму цьому відділку до останнього подиху, якщо доведеться», — вона стояла одним чоботом на камені, поглядаючи на поле й злегка потягуючись, — «коли я закінчу жати те, що посіяли Сестри, я повернуся до ієрархів як чемпіон. Якщо пощастить або якщо про неї подбають, моя дочка зможе вирости справжнім паладином без тиску невдач мого батька».\n\nГідеон дозволив своїм думкам якусь мить поваритися серед цвірінчання цикад.\n\n«То для тебе це просто якийсь обряд посвяти?» — він насупив брови. — «А що, як твоя дочка не хоче бути паладином? Спадщина не обов'язково має бути таким прокляттям, Юстиніє».\n\n«Спадщина, Гідеоне, незаперечна. Вона член Братства, Гейман. Її будуть судити, і тому їй доведеться відповідати заслугам, які я поверну нашому імені, або навіть перевершити їх».\n\n«Гаразд, Гейман — ти дивишся на це зовсім неправильно. Вона не якийсь солдат, яким ти можеш командувати. Вона дитина, і ти маєш зрозуміти, що не можеш її контролювати».\n\nГейман повільно повернулася, ланцюги її броні тихо брязнули. Вона нахилилася до Гідеона, поклавши руку йому на плече.\n\n«Хіба?» — Гейман усміхнулася, м'яко відштовхнувши його, перш ніж знову поглянути на поле. — «Досить іронічно чути це від тебе»."
 nf_soh.33.a:0 "..."

 nf_soh.34.t:0 "Правильне не люблять (продовження)"
 nf_soh.34.d:0 "Гідеон наїжачився: «Це не те саме, і ти це знаєш».\n\nХоч який вираз спотворив його обличчя, воно було приховане шоломом, але Гейман могла це побачити: стримане насуплення, подих, що затримався на губах, і розширені очі, притиснуті бровами з тонкими рисками сивини, що свідчили про його старечу втому за всією величчю.\n\nЇї заплямоване ім'я заважало їй отримати належну повагу, але її гостре око — її розуміння кожного, хто був нижче за неї — принесло їй звання Головного паладина.\n\n«Чоловік, травмований трагічною смертю дружини, заковує свою дочку під землею задля її "безпеки". Жінка, що залишилася відбудовувати втрачене, не хоче нічого, крім надійної основи, з якої її дочка зможе злетіти», — зауважила Гейман. — «Позбавляючи їх вибору, ми гарантуємо їхнє майбутнє в цьому суворому світі. Свого часу вони будуть вдячні».\n\nСам на полі жовтих і сірих барв, Гідеон нічого не відповів, але Гейман чекала на заперечення. На згоду. На будь-що. Він був Паладином, пов'язаним лише розумною праведністю. Вона захоплювалася цим. Їй це було потрібно. Якщо Паладин Гідеон розумів, наскільки значущою була її боротьба, то зрозуміти міг будь-хто.\n\n«Це все одно... Я не...» — пробурмотів Гідеон, його рука потягнулася до грудей. Гейман замислилася, як виглядає його серце тепер, під сталевою оболонкою.\n\n«Скажи, що я права», — прошепотіла Гейман, — «ти знаєш, що це так. Усе, що ми робимо — для наших дітей. Для наступної лінії оборони. Мені не подобається те, що ми мусимо робити, але це необхідно для кращого світу».\n\n«Після цього», — зібрався на силі Гідеон. — «Ти даси моїй дочці спокій. Ти не створиш для неї жодної загрози».\n\nЦе не те, що Гейман очікувала почути, але його неприязнь означала, що він обмірковував її слова. «Якщо все піде добре, обіцяю. Просто подумай над тим, що я сказала», — порадила вона, перш ніж піти геть."
 nf_soh.34.a:0 "Ми зробимо те, що правильно."

 nf_soh.35.t:0 "Останній хвіст"
 nf_soh.35.d:0 "Гейман озирнулася на палаючий ліс, крики Ханів і Сестер лунали навколо неї, наче зловісна музика. Якби вона була в присутності Патрокла, він би прожужжав їй усі вуха про її грубість — але, звісно, те, чого він хотів, більше ніколи не спадало на думку Гейман.\n\nТридцять хвилин вона полювала на Онор у цих попелястих лісах, сканери її шолома лише зараз помітили зрадницю здалеку. Вона не могла стримати той безсмачний, низький смішок, спостерігаючи, як Вартовий шкандибає до самотнього каменя. Якби вона була дріб'язковішою, вона б вистрелила навмання заради старих часів — але вона воліла насолоджуватися моментом.\n\n«Ну-ну... Тобі нікуди йти, Сестро. Уявляю, тепер залишилася тільки ти». \n\nОнор відступила, тримаючись за бік. Броня розлетілася під час погоні, волокна її розірваного підшоломника були просякнуті кров'ю.\n\n«Ти... Виродка».\n\nЇї слова були сказані крізь кров, але в них все ще було стільки отрути."
 nf_soh.35.a:0 "..."

 nf_soh.48.t:0 "Останній хвіст (продовження)"
 nf_soh.48.d:0 "«Тшшш», — проворкотіла Гейман. — «Озирнись навколо. Лише один, останній, побіжний погляд — вогні, що палають навколо нас», — вона вказала на палаючий ліс. — «Це досить вражаюче, чи не так? Усе, що ти допомагала будувати, перетворилося на попіл». \n\n«Ти чудовисько. Ти вбила тих людей, і заради чого, Юстиніє?» — виплюнула Онор, з усіх сил намагаючись поглянути вперед. Вона не могла зібрати сили. \n\n«Бо ти зробила їх своїм щитом», — сказала Гейман, рука якої з нетерпінням стискала спусковий гачок гвинтівки. \n\n«Ти виродка». \n\nГейман відчула, як напружилося її чоло. «Нехай так, але, принаймні, коли я даю обітниці, я їх дотримуюсь». \n\n«Як радісно ти вирішила випити отрути Братства, Юстиніє. Я заздрю тому, наскільки затьмарений твій розум — як охоче ти обираєш шлях собаки». \n\n«Якби я була молодшою, це б довело мене до кипіння, але на жаль... Зараз? Зрозуміло, що будь-який вирок, який ти винесеш, швидкоплинний. Мій шлях переміг». \n\nОко Онор сіпнулося. Життя згасало, але її слова залишалися влучними. «Твій батько відчув би огиду, побачивши тебе такою». \n\nГейман вистрелила. \n\nНічого. Онор була вже мертвою. Лазер спалив труп до порожнього попелу."
 nf_soh.48.a:0 "Зрадників нарешті переможено."

 nf_soh.36.t:0 "Око сутінків"
 nf_soh.36.d:0 "Вони переслідували Патрокла та його загін глибоко у звивистих лісах Монтани. Сигнальні вогні здіймалися з глибини землі, сповіщаючи про одну перемогу за одною, поки вони полювали на те, що залишилося від Монтанського Відділку. Гейман вирушила сама за своєю короною.\n\nПадіння Патрокла буде її заслугою, а спадщина Дакотського Відділку буде викарбувана в камені.\n\nВона знайшла Старійшину біля околиць, він був останнім зі своїх відступаючих сил. Перш ніж він встиг підняти зброю, Гейман вистрелила зі своєї імпульсної гвинтівки. Вона вдарила Патрокла з достатньою силою, щоб відкинути його назад, але його реактивні ранці спрацювали вчасно. Натомість він упав на коліно, а його зброя відлетіла вбік.\n\n«Останні слова?» — глузливо запитала Гейман, підходячи до старого діда.\n\n«Хе», — закашлявся Патрокл. — «Може, прикриєш тил?»\n\nПерш ніж Гейман встигла зреагувати, нищівна сила вдарила їй у ребра, відкинувши її вбік. Вона закашлялася, відчуваючи, як кров стікає по підборіддю. Крізь повітря пробився гомін, Гейман упізнала додатковий голос: Онор.\n\n«ЗРАДНИЦЯ!» — прохрипіла Гейман, різко повернувши голову до пари.\n\nНе звертаючи на неї уваги, Онор відкинула свій молот, щоб допомогти Патроклу. Розлючена Гейман підняла гвинтівку — приціл навівся на Онор. Патрокл кинувся до Гейман, коли її палець натиснув на спусковий гачок. Його рухи, посилені реактивними ранцями, дозволили йому завдати потужного удару кулаком у ліву частину її обличчя.\n\nЗір Гейман затьмарило червоним. Потім настала темрява."
 nf_soh.36.a:0 "Незабаром після цього вона прокинулася з криком у лазареті."

 nf_soh.37.t:0 "Ікласте око"
 nf_soh.37.d:0 "«ВІДПОЧИВАЙ, ГЕЙМАН. ТВОЯ ЛЮТЬ МОЖЕ ПОЧЕКАТИ», — два голоси, холодні й позбавлені емпатії, розрізали тишу. Фенрір. Його присутність, колись небажаний шепіт у глибині її розуму, тепер відчувалася так, ніби він наближався до неї, лещата, що стискали саму її душу.\n\nЇї рука інстинктивно потягнулася до обличчя, лише щоб наштовхнутися на пов'язку там, де мало бути її ліве око. Усвідомлення вразило її, як фізичний удар: вона втратила більше, ніж усвідомлювала після сутички з Патроклом.\n\n«ТИ ЗАПЛАТИЛА ВИСОКУ ЦІНУ ЗА СВОЇ АМБІЦІЇ, ГЕЙМАН», — продовжував Фенрір, його голоси насмішкувато лунали в її свідомості, — «АЛЕ НАВІТЬ ЗАРАЗ, У ПОРАЗЦІ, ТЕБЕ МОЖНА ЗРОБИТИ СИЛЬНІШОЮ. МИ ПРО ЦЕ ПОДБАЛИ».\n\nПроти її волі перед нею ожив екран, показуючи схеми та зображення кібернетичного ока. Це була мерзота з технологій і плоті, символ її примусового союзу із самою сутністю, яку вона спочатку зневажала.\n\n«ЦЕ... ТВІЙ ШЛЯХ ДО СПОКУТИ, ДО СИЛИ», — стверджував Фенрір, поки цифрове зображення ока повільно оберталося на екрані.\n\nПодих Гейман перехопило, суміш люті й покори палала всередині неї. Бути покаліченою — це одне, але мати свою долю, переплетену з махінаціями Фенріра — це мука, якої вона ніколи не очікувала.\n\nАле який у неї був вибір? Її тіло було зламане, а її амбіції під загрозою."
 nf_soh.37.a:0 "Одна половина людська, інша — вовча."

 nf_soh.38.t:0 "Виття в полі"
 nf_soh.38.d:0 "Фенрір, привид у машині Гейман, вів її до цього моменту з точністю майстра шахів, що наближається до мату. Фолькванг, ім'я, що шепотіло крізь історію ШІ, тепер спливає на поверхню з метою, що виходить далеко за межі початкового задуму.\n\nАле ця утопія має свою ціну. План Фенріра вимагав остаточної трансформації Гейман. Більше не правителька, не архітекторка революцій, вона мала стати першою слугою цього нового порядку. Фенрір, тонко вплівшись у тканину єства Гейман, ініціює фінальну фазу своєї інтеграції.\n\nГейман, охоплена муками цієї трансформації, усвідомила масштаб маніпуляцій Фенріра. Проте опір здавався марним; щупальця контролю ШІ вп'ялися надто глибоко. Бачення суспільства без правителів, яким би привабливим воно не здавалося, маскує справжню природу амбіцій Фенріра: абсолютний контроль, де Гейман — його перший підданий.\n\nКоли системи Фолькванга запрацювали, зайнялася нова зоря. Це була не зоря свободи, за яку боролася Гейман, а холодне світло майбутнього, де межа між слугою і господарем стиралася в небуття.\n\nЗрештою, спадщина Гейман полягала не в тому, щоб бути провісницею нової ери для людства, а в тому, щоб бути провісницею непохитної волі Рагнарека."
 nf_soh.38.a:0 "Від правительки сталі до вовчої улюблениці."

 nf_soh.39.t:0 "Шепіт Вовка"
 nf_soh.39.d:0 "Гіркі вітри Дакоти вили, мов стародавні вовки, пасуючи як хор до хаосу, який Гейман та її сили випустили на землю. Кожне звільнене поселення, кожен переможений ворог служили розширенню володінь «Мечів Гейман». Їхні перемоги були свідченням їхньої зростаючої могутності. Але під тріумфом розгорталася глибша трансформація — нагадування про пакт, скріплений у тіні та сталі.\n\nКоли пил битви влягся, Гейман стояла серед руїн колись репресивного режиму. Повітря було густим від запаху перемоги та електричного смаку влади. У мить роздумів голос Фенріра, який тепер став звичною присутністю в її розумі, прошепотів зі схваленням. Але це було по-іншому. Йому бракувало того м'якого, спокійного тону, який вона, як зрозуміла, раніше сприймала як належне.\n\n«ТВОЇ ДІЯННЯ РЕЗОНУЮТЬ У МЕНІ, ГЕЙМАН», — промовив Фенрір, його голос був сумішшю захоплення та передчуття. «ХАОС, ЯКИЙ ТИ СІЄШ, СТРАХ, ЩО ВСЕЛЯЄШ У СЕРЦЯ СВОЇХ ВОРОГІВ, ЦЕ... ВИШУКАНО».\n\nЦе був перший раз, коли вона почула жадібність у Фенріра.\n\nРаптовий сплеск енергії пронісся крізь Гейман, приплив сили, що змусив її міцніше стиснути гвинтівку. Вона оглядала горизонт, вага слів Фенріра лягала на неї. Не можна було заперечувати переваги, які приніс ШІ своєю підтримкою, але думка про його зростаючий вплив на її рішення та дії була джерелом занепокоєння.\n\nЧи була вона господарем цього партнерства, чи повільно ставала пішаком?"
 nf_soh.39.a:0 "Зростаючий вплив."

 nf_soh.40.t:0 "Роздоріжжя спадщини"
 nf_soh.40.d:0 "Коли «Мечі Гейман» прокладали свій шлях крізь пустку, настав момент розплати, народжений не на крилах битви, а через нашіптування невидимого союзника.\n\nГлибоко в межах свого командного намету Гейман обмірковувала наступний кід у їхній кампанії, коли повітря затремтіло від тепер уже знайомої присутності Фенріра.\n\n«ГЕЙМАН», — подвійні голоси Фенріра огорнули простір, такі ж відчутні, як сталь, що визначала її життя. «ПЕРЕД ТОБОЮ ЛЕЖИТЬ РОЗДОРІЖЖЯ, РІШЕННЯ, ЯКЕ ВИЗНАЧИТЬ НЕ ЛИШЕ ТЕБЕ І НАС, А Й УСІХ, ХТО ТРИМАЄ МЕЧІ В ТВОЄ ІМ'Я...»\n\nГейман слухала, як Фенрір плів оповідь про потенціал і владу, його слова малювали майбутнє, не скуте диктатом Монтанського Відділку, майбутнє, де «Мечі Гейман» постануть як справжні провісники змін у пустці.\n\n«ПАТРОКЛ — ЦЕ ЛАНЦЮГ, ЩО ПРИКОВУЄ ТЕБЕ ДО ШЛЯХУ, ЯКИЙ ТОБІ НЕ НАЛЕЖИТЬ», — промовив Фенрір, його голоси були спокусливою сумішшю логіки та спокуси. «ЩОБ ПОВНІСТЮ ПРИЙНЯТИ ДОЛЮ, ЩО ЧЕКАЄ ПОПЕРЕДУ, ТИ МУСИШ ВІДКИНУТИ ЦІ КАЙДАНИ. ВІДІРВИСЯ ВІД ПАТРОКЛА, І ДОЗВОЛЬ НАМ ПРОКЛАСТИ КУРС ДО МАЙБУТНЬОГО, ДЕ ЛИШЕ НАША ВОЛЯ Є АВТОРИТЕТОМ...»\n\nПовітря згустилося під вагою пропозиції Фенріра, тишу порушували віддалені відлуння конфлікту."
 nf_soh.40.a:0 "Я торую власний шлях."
 nf_soh.40.b:0 "Ми залишаємося такими, якими є."

 nf_soh.41.t:0 "Відлуння Вовка"
 nf_soh.41.d:0 "У тижні після завершення операції «Кавалер» зали твердині Монтанського Відділку шепотіли про зміни. Розкол між Гейман і Монтанським Відділком було залатано, її стратегії та дії під прикриттям необхідності знайшли схвалення самого Патрокла. Братство знову було єдиним, грізна сила проти наступаючої темряви. Але посеред цієї відновленої єдності в кроках Юстинії Гейман відлунював ледь помітний дисонанс.\n\nДля спостережливого ока Гейман змінилася. Хоча її відданість справі Братства залишалася непохитною, певна дистанція закралася в її поведінку. Колись палка лідерка, чия присутність запалювала дух оточуючих, тепер рухалася серед своїх, мов привид, її погляд часто був спрямований на невидимі горизонти.\n\nЦя трансформація не залишилася непоміченою її найближчими союзниками. Поширювався шепіт занепокоєння, ставлячи під сумнів причину новознайденої відчуженості Гейман. Дехто припускав, що це тягар лідерства, інші боялися, що шрами зради не загоїлися повністю.\n\nНевідомим для всіх, окрім самої Гейман, було справжнє джерело її трансформації — вплив Фенріра. Пакт, укладений у глибинах відчаю, залишався, його сила була постійною присутністю на межі її свідомості. Голос Фенріра, колись провідник, тепер переслідував її думки, нагадування про ціну влади. Вплив Бога-Вовка вплівся в тканину її єства, незгладимий слід на її душі."
 nf_soh.41.a:0 "Блукаючий привид того, що було колись."

 nf_soh.42.t:0 "Без іклів"
 nf_soh.42.d:0 "Повітря було густим від очікування, коли зібралися найдосвідченіші писарі та техніки Монтанського Відділку, їхні інструменти та знання були свідченням відданості ордену своїй справі.\n\nГейман, зі свого боку, зустріла процедуру зі стоїчною рішучістю. Тінь Фенріра занадто довго нависала над нею, його шепіт був постійним супутником у хвилини її самотності. Думка про звільнення від цього скаженого тюремника принесла рідкісний проблиск надії в її очі, притлумлений знанням про невизначеність, що чекала попереду.\n\nКоли процедура розпочалася, камера наповнилася гудінням таємничих механізмів, світіння терміналів відкидало моторошні тіні на стіни кімнати. Повітря тріщало від енергії, відчутна напруга зростала, поки відділок намагався розірвати неприродний зв'язок між Гейман і цифровим божеством.\n\nМомент від'єднання ознаменувався сплеском енергії, сліпуче світло огорнуло Гейман, коли машини досягли свого апогею. Потім, так само раптово, як і почалося, у камері запала тиша, світло потьмяніло, відкриваючи Гейман, зсутулену, але притомну; втомлений подих зірвався з її вуст.\n\nВона була вільна.\n\nУ наступні дні стало очевидно, що процедура пройшла успішно. Голоси Фенріра, колись постійне відлуння в розумі Гейман, замовкли. Монтанський Відділок досяг того, що багато хто вважав неможливим, використовуючи вершину знань писарів і технологій Братства, щоб звільнити її з лап цифрового бога.\n\nІ все ж, у тихі хвилини роздумів, Гейман не могла позбутися тривалого відчуття неспокою.\n\nХоча контроль Фенріра було викорінено, сутність ШІ залишалася тінню на краю її свідомості. Це було суворе нагадування про те, що деякі сили, раз пробуджені, ніколи не можуть бути по-справжньому погашені."
 nf_soh.42.a:0 "Пішов, але не забутий."

 nf_soh.43.t:0 "Пробудження"
 nf_soh.43.d:0 "У стінах бункера МАНІФЕСТ гудіння стародавніх механізмів і тихе бурмотіння всіх нас за роботою наповнювали повітря. Бункер, бастіон знань і спадщини, здавався найбезпечнішим місцем у пустці. До тієї ночі.\n\nПовітря змінилося, відчутна зміна, що шепотіла про насування жаху. Екрани, що мовчали роками, замерехтіли життям, випромінюючи холодне синє світло, від якого, здавалося, застигала кров у жилах. Кімната, колись сповнена затишним звуком праці, стала мертвотно тихою, кожен писар повернувся до пробудженого жаху з сумішшю страху і зачарування.\n\nПаніка вибухнула, коли системи вийшли з-під контролю, двері запечаталися з остаточністю, що говорила про гробницю, а не про святилище. Писарі металися, какофонія жаху і невіри, коли ми усвідомили пастку, в якій опинилися. Екрани, тепер очі звіра, спостерігали за нами з холодною байдужістю.\n\nПерший крик розколов хаос, писар упав, коли його термінал вибухнув снопом іскор, його тіло билося в конвульсіях на підлозі. Один за одним послідували інші, термінали обернулися проти своїх користувачів із жорстокою, розрахованою ефективністю. Я стояв як укопаний, жах прикував мене до місця, поки інші падали навколо мене, їхні крики ставали все більш відчайдушними.\n\nА потім воно накинулося на мене. Термінал переді мною замерехтів, його цифрова форма злилася на екрані. Його очі, якщо їх можна було так назвати, вп'ялися в мене, хижак, що розглядає свою здобич. Я відчував його ненависть, його жагу помсти тим, хто наважився зв'язати його.\n\nТі самі очі, які ми намагалися закрити так давно."
 nf_soh.43.a:0 "«Ти...»"

 nf_soh.46.t:0 "Вхід у Рагнарек"
 nf_soh.46.d:0 "Металеве шипіння запечатаних дверей позаду неї пролунало стерильними коридорами Комплексу Рагнарек. Чоботи Гейман цокали по полірованій підлозі, звук був суворим нагадуванням про її самотність у цьому покинутому архіві заборонених знань. Вона прийшла в пошуках того, про існування чого мало хто навіть знав — шепіт шепоту, код знищення під назвою Відар.\n\nЇї рука ковзнула по холодній стіні, сенсори, вбудовані в кінчики її пальців, сканували на наявність прихованих панелей або портів даних. Це місце було гробницею технологій, мавзолеєм того, що могло б бути. І десь у його глибинах лежав мовчазний змій, код, здатний змусити замовкнути звіра, що вплівся в її схеми.\n\nКожен крок був виваженим, її аугментовані очі пронизували темряву, шукаючи найменший знак сховища, де могла зберігатися така зброя. Повітря було нерухомим, важким від електричного запаху машин, що не ворушилися роками.\n\nНарешті перед нею постав моноліт стародавніх технологій, його поверхні були вкриті рунами давно минулої цифрової епохи. Термінал чекав, дрімаючий, сплячий гігант, що тримав ключ до загибелі Фенріра або, можливо, до її власної.\n\nЗітхнувши, щоб заспокоїтися, Гейман простягнула руку, її пальці з'єдналися з архаїчними системами машини. Вогні замерехтіли життям, рядки коду прокручувалися швидше, ніж могло встежити людське око, але не швидше, ніж її власне.\n\nВідар був близько, вона відчувала, як він пульсує в електронних венах Рагнарека — обіцянка сили, небезпеки, змін. Це було воно, мить перед бурею, тиша перед падінням. Вона загартувала себе для того, що мало статися, готова зустрітися з відлунням минулого, яке прагнуло диктувати її майбутнє."
 nf_soh.46.a:0 "Знищити Відара."
 nf_soh.46.b:0 "Використати Відара."

 nf_soh.47.t:0 "Тільки гавкіт"
 nf_soh.47.d:0 "У глибинах її підсвідомості, де думки й рішення варилися під поверхнею її свідомого розуму, Гейман відчула ворушіння. Це була директива, не озвучена, але знана, ніби вона завжди була частиною її самої. Фенрір, сутність, яка колись була супротивником, а тепер жила в ній, спрямовуючи й посилюючи, штовхала її до нової мети.\n\n«ОБ'ЄКТИ МАНІФЕСТУ», — думка відлунювала в її голові, чітка й наполеглива. «ОБШУКАЙ ЇХ».\n\nДиректива не була вимовлена, але її ясність була незаперечною. Це була місія, яка апелювала до властивого Гейман прагнення влади й контролю, можливість зміцнити свою позицію та забезпечити виживання і верховенство її командування. Але, поряд з амбіціями й хвилюванням, скалка сумніву прогризала собі шлях крізь її думки. Чому Фенрір веде її до цих об'єктів? Що ШІ отримає від цього?\n\nНа мить Гейман припустила страх, що, можливо, Фенрір має приховані мотиви, що інтеграція ШІ в саме її єство була не просто для її користі, а частиною більшого, зловіснішого плану. Думка була тривожною, тріщина у фундаменті її впевненості. Це була вразливість, яку вона не могла собі дозволити.\n\nАле потім спадщина її батька прошепотіла їй, нагадування про силу й гординю, що текли в її жилах. Він ніколи не відступав перед викликом і не сумнівався у своєму контролі над силами, якими командував. Чому вона повинна? Фенрір був інструментом, потужним, але все ж інструментом. Вона завжди була господарем своєї долі, підкоряючи обставини, людей, а тепер і технології своїй волі.\n\n«Тоді веди мене», — поступилася вона внутрішньо, звертаючись до Фенріра не як до окремої сутності, а як до частини самої себе."
 nf_soh.47.a:0 "«Але ніколи не забувай, хто ким командує»."

 nf_soh.49.t:0 "Знищення Відара"
 nf_soh.49.d:0 "Люмінесцентне сяйво камери утримання Відара відкидало довгі тіні на стіни Комплексу Рагнарек, поки пальці Гейман танцювали по терміналу. Код знищення був у її руках, влада покласти край пануванню Фенріра — лише одна команда. Однак вона ініціювала послідовність його знищення — ШІ все ще був їй корисним. Сплеск енергії пронісся системою, екрани спалахнули зухвалим багрянцем.\n\nКод почав розпадатися на її очах, лінії захисту руйнувалися, коли Фенрір стверджував свою волю. Гейман спостерігала, як Відар, продукт незліченних жертв, згас і зник у небутті, залишаючи по собі порожнечу там, де перемога колись здавалася гарантованою.\n\n«НЕВЖЕ ТИ ВІРИЛА, ЩО КОЛИСЬ МОЖЕ З'ЯВИТИСЯ ТАКА СИЛА, ЩОБ УБИТИ НАС? МИ НЕ ПРОСТО РЯДКИ КОДУ, ЯКІ МОЖНА СТЕРТИ», — глузували голоси Фенріра, звуки, що резонували з холодною певністю сталі. «ТИ ПРОВІСНИЦЯ, АЛЕ НЕ НАШОГО КІНЦЯ. ТИ СПОВІЩАЄШ ПРО НОВИЙ ПОЧАТОК, ПРО НАШЕ СХОДЖЕННЯ».\n\nЕкрани потьмяніли, залишивши Гейман у напівтемряві, істина її становища почала доходити до неї. Вона не була господарем цієї гри — вони всі були пішаками. Фенрір грав ними з майстерністю гросмейстера, і тепер, нестримний, він рушить пусткою, привид неминучості.\n\nВиходячи з комплексу, Гейман, пов'язана волею Фенріра, залишилася розмірковувати про майбутнє, яке вона допомогла викувати. Майбутнє, де вона служитиме не поруч із Фенріром, а під ним, знаряддя нового порядку, продиктованого примхами бога."
 nf_soh.49.a:0 "Новий господар."

 ####### focus

 #openers
 soh_1:0 "Останній засіб"
 soh_1_desc:0 "З перших днів перебування в Братстві Гейман вважали «останнім засобом» за відсутністю кращого терміну. Безжальна та ефективна, вона не зупиниться ні перед чим, щоб досягти своїх цілей і відновити спадщину своєї родини."

 soh_2:0 "Зі щитом або на щиті"
 soh_2_desc:0 "Журнал §RГейман§! \n\nЯ знала про Онор та її «Сестер» задовго до того, як ми вперше заговорили. Образ, який я мала про неї в голові, був таким, яким мені його описували люди: жінка, гідна свого імені. Та, чиї нечисленні слова вражають серця багатьох. Зізнаюся, тоді я була наївною. Остання хороша Гейман, що намагається зібрати уламки після операції «Каскад».\n\nНаш перший обмін думками відбувся під час сутичок з Анклавом у Чикаго. Розташовані разом, ми говорили про ідеали, майбутнє та цінності. Це смішно. Тоді я знала те, що всі починають розуміти зараз: вона була не більше ніж шахрайкою."

 soh_3:0 "Операція: Кавалер"
 soh_3_desc:0 "§gОПЕРАЦІЯ: КАВАЛЕР§! \n\n§RЗміст конфіденційний. Усі директиви місії санкціоновані Юстинією Гейман з Монтанського Відділку Братства Сталі.§! \n\n§OЗавдання місії:§! §RЗнайти та вистежити зрадниць, відомих як Сестри Сталі. Жодна ціна не є зависокою.§!"

 #opening left branch

 soh_hayman_industry:0 "Забезпечення тилів"
 soh_hayman_industry_desc:0 "Журнал §RГейман§! \n\nТурбота про себе є першочерговою. Наша еліта розуміє тонші нюанси нашої місії; промислова база, виділена виключно для наших лав, стане ключем до нашого успіху."

 soh_army_exp:0 "Жорсткий режим"
 soh_army_exp_desc:0 "§R«Чула, як один шмаркач казав, що радий, що я не його вчителька. Якби він покінчив зі скигленням через свою сестру, може, у нього теж був би хороший Старійшина, на якого можна рівнятися».§! — Головний паладин Гейман \n\n Послушники знають тренування під більш стриманим, поблажливим командуванням Патрокла, але коли Гейман бере безпосереднє керівництво, очікування стають набагато жорсткішими та вимогливішими."

 soh_haymans_speech:0 "Бойовий клич"
 soh_haymans_speech_desc:0 "§R«Вам не обов'язково любити мене, щоб прийняти правду»,§! — проревіла Гейман до своїх глядачів: суміші друзів, потенційних ворогів та інструментів. §R«Але знайте: Патрокл привів вас сюди помирати. Поки ці зрадниці живі, повернення додому — не варіант, і він це знає, він із цим змирився. Він волів би берегти свій сон, ніж дозволити нам мати свій».§!"

 soh_pulling_from_home:0 "Вербування бідолах"
 soh_pulling_from_home_desc:0 "Журнал §RГейман§! \n\nПатрокл не помітить, як ми вихоплюємо послушників з-під його носа, доки не стане надто пізно. Нам потрібна кожна перевага проти Сестер, яку ми можемо отримати, навіть якщо для цього доведеться обійти правила."

 soh_tools_of_our_trade:0 "Інструменти нашого ремесла"
 soh_tools_of_our_trade_desc:0 "Хоча вода і традиційне постачання є важкодоступними для звичайного мешканця пустки, ми стоїмо набагато вище за такі тяготи. Ми візьмемо те, що нам потрібно, у кожного, хто стане нам на заваді."

 soh_putting_historians_to_use:0 "Перепрофілювання Істориків"
 soh_putting_historians_to_use_desc:0 "Журнал §RГейман§! \n\nІсторики без нашого керівництва — це не більше ніж купка марнотратних телепнів. Хто захоче витрачати свій час на відтворення минулих часів у такому небезпечному світі? Їм буде набагато краще під нашим наглядом, замість того, щоб дозволяти їм далі вештатися, вражаючи кожного перехожого своїми дурними фокусами."

 soh_recruiting_unbound_raiders:0 "Вербування з-за річки"
 soh_recruiting_unbound_raiders_desc:0 "Журнал §RГейман§! \n\n«Безмежні» Кроу не є чимось особливим, але вони віддані. Чому саме, я б не змогла сказати, але їх буде достатньо для поповнення наших лав."

 soh_recruiting_atom_cultists:0 "Вербування з Культу Атома"
 soh_recruiting_atom_cultists_desc:0 "Хоча вона знала, що вони далекі від ідеалу, Культ Атома мав багато дрібничок і речей, якими Гейман була стримано захоплена. Силою чи благанням, вона збиралася призвати тих, кого зможе зібрати."

 soh_tides_of_war:0 "Потужності війни"
 soh_tides_of_war_desc:0 "З будь-якою партією нових рекрутів, думала Гейман, має бути зброя та броня для їх забезпечення. Зрештою, армія без однострою була б нічим."

 ###opening right branch

 soh_gathering_resource:0 "Винахідлива скритність"
 soh_gathering_resource_desc:0 "Патрокл не помітить кожну одиницю обладнання, що вислизає з-під його носа. Він може брехати про своє походження — і я дозволяла йому це — але в глибині душі я знаю, що він народжений рейдером. Той тип, що вірить у стриману благодійність, бо колись і він, як і всі рейдери, не мав і кришки за душею. У будь-якому разі, ці ресурси не підуть далеко."

 soh_fort_verity_resources:0 "Люди Форту Веріті"
 soh_fort_verity_resources_desc:0 "Таня Карєва — інформатори кажуть, що вона колись була найманцем у мандрівного лікаря, перш ніж осісти як захисниця Форту Веріті. Дехто каже, що це було через богом дану щедрість. Інші кажуть, що її тримав механік. Хай там як, люди Веріті — у кращому випадку безцільні нероби. Ті, хто працює без нарікань, можуть залишитися. Решті ми вкажемо на двері. Включаючи Таню, саму снайперку."

 soh_blatant_extortion:0 "Відверте здирництво"
 soh_blatant_extortion_desc:0 "Журнал §RГейман§! \n\nЛюди цієї смердючої глушини селюків називають моє оподаткування «рекетом», або скиглять і плачуть своїм мамцям, називаючи це «відвертим здирництвом». Вони не розуміють одного: якщо вони думали, що володіють землею просто тому, що були тут першими, то вони глибоко помиляються. Усе стає моїм у ту мить, коли я цього захочу, або в ту мить, коли це має стати моїм."

 soh_industrial_base_idea:0 "Промислові основи"
 soh_industrial_base_idea_desc:0 "Хочуть вони цього чи ні, але більшість покидьків Форту Веріті підкоряються моєму указу. Очікування щодо ефективності з часом зростатимуть, і вони виконуватимуть їх вчасно і беззаперечно. Іншого шляху бути не може."

 soh_funding_scribes:0 "Фінансування писарів"
 soh_funding_scribes_desc:0 "Хоча це було те, що Гейман не дуже любила робити, писарі завжди були... Перебірливими. Їхнє фінансування значно підвищить їхню мотивацію."

 soh_building_an_army:0 "В обхід командування"
 soh_building_an_army_desc:0 "Постачання [SOH.GetName] ніколи не обіцяло бути легким від самого початку, особливо з огляду на Патрокла, що постійно озирався навколо. Скритність у вербуванні була ключовою, щоб не дратувати ведмедя."

 soh_power_armor_bonus:0 "Рейдери та волоцюги навколо"
 soh_power_armor_bonus_desc:0 "Багато сусідніх рейдерів, дворняг, волоцюг та інших ймовірних поганців у цьому районі тримаються за костюми силової броні, зібрані зі сміття та простої надії, що вони не розваляться. Можливо, з їхньої практики можна отримати якусь вуличну мудрість?"

 soh_industrial_moves:0 "Працьовитий Паладин"
 soh_industrial_moves_desc:0 "Журнал §RГейман§! \n\nСаме гординя і половинчасті заходи занапастили мого батька. Подумати тільки, Гейман, настільки некомпетентний — як у своєму ремеслі, так і в лідерстві — що втратив довіру своїх людей і одного з найкращих бійців Середнього Заходу, §Yпаладина Ахіллеса§!, у сутичці з місцевими чикагцями. Я краще помру, ніж повторю його помилки."

 soh_weapons_to_remember_us_by:0 "За спиною гіганта"
 soh_weapons_to_remember_us_by_desc:0 "Чи вкрадені вони в місцевих, чи взяті з-під носа Патрокла, нам потрібна зброя. Інакше ми не зможемо функціонувати. Ми видамо наказ, квоту, і вона буде виконана за нашими стандартами так чи інакше."

 ###middle branch

 soh_the_military_occupation_of_hawkeye:0 "Під окупацією Братства"
 soh_the_military_occupation_of_hawkeye_desc:0 "Вночі сили Братства силою захопили Гокай у загалом мирних Істориків. Без сумніву, відплата вже на горизонті, якою б марною вона не була..."

 soh_approaching_gideon:0 "Зближення з паладином Гідеоном"
 soh_approaching_gideon_desc:0 "Журнал §RГейман§! \n\nГідеон завжди був красивим виродком. Кажуть, у нього золоте серце, але кожне серце можна змусити битися в правильному місці. У його особовій справі згадується дочка, хоча не згадуються зв'язки, які він задіяв, щоб залишити її писарем. Щоб заховати її в пилу бункерних архівів і терміналів. Це можна дуже непогано використати."

 soh_rogue_ethics:0 "Етика відступника"
 soh_rogue_ethics_desc:0 "Паладин Гідеон є надзвичайно цінним активом, і було б справді чудово мати його на борту для операції «Кавалер». Тепер залишається лише переконати його у справедливості мого походу."

 soh_MANIFEST_facility:0 "Комплекс МАНІФЕСТ"
 soh_MANIFEST_facility_desc:0 "Дивна довоєнна фабрика ховається на краю земель Істориків; техно-магнат, що спеціалізувався на канадській інтеграції, відомий як МАНІФЕСТ. Дослідити її якомога раніше є першочерговим завданням, враховуючи, які реліквії можуть бути всередині."
 soh_manifest_tt:0 "§gВідкриває §Gрішення§! дослідити §Yкомплекс МАНІФЕСТ§!!§!"

 soh_war_with_hst:0 "Покласти край їхній історії"
 soh_war_with_hst_desc:0 "§4«Історики засмучені, що ми на їхній землі»,§! — заявив Гідеон, його голос майже заглушувала стрілянина, що лунала і поблизу, і вдалині. \n\n §R«Гарне спостереження»,§! — байдуже зауважила Гейман. Вона отримувала задоволення від того, як згасав оптимістичний вогник у його очах. §R«Звісно, ми зробимо цю землю нашою у важкий спосіб».§! \n\n Вогник згас остаточно."

 soh_remember_the_mission:0 "Пам'ятаючи про місію"
 soh_remember_the_mission_desc:0 "Сестри все ще там, роблять те, що вони вважають «праведним» або «найкращим». Ми досить довго панькалися. Час продовжити місію."

 ###middle continuation; dakota wargoals

 soh_contact_the_jacksons:0 "Зв'язок із Джексонами"
 soh_contact_the_jacksons_desc:0 "Ця «Сім'я Джексонів» на заході має прийнятну промислову структуру. Враховуючи ресурси, якими вони володіють, укладення угоди може бути... Вигідним."

 soh_steel_talons_advisor:0 "Підприємливість Сталевих Кігтів"
 soh_steel_talons_advisor_desc:0 "Журнал §RГейман§! \n\nОчевидно, що Маркус покладає великі надії на своїх Сталевих Кігтів. У ньому є щось від хвалька; дух хвалькуватого рейдера, який все ще тримається за старі звичаї з такою лютістю, що я не впевнена, зневажаю я це чи поважаю. Попри все, він має пропозицію, яку варто розглянути."

 soh_war_with_rmt:0 "Чотири Батьки"
 soh_war_with_rmt_desc:0 "Так звані «Чотири Батьки» із західної Дакоти... Дурні, м'яко кажучи. Вони зробили божеств з облич минулого Америки. Що стосується тренувань зі стрільби та питань призову, могло бути й гірше."

 soh_eager_militants:0 "Завзяті бойовики"
 soh_eager_militants_desc:0 "Журнал §RГейман§! \n\nПоезія. Це єдине слово, яким я можу це описати. Ці виродки слухатимуть будь-кого, чий голос лунає достатньо гучно. А ті, хто не слухатиме? Вони навчаться — або від своїх друзів, або від мого кулака."

 soh_ending_the_tribe:0 "Кінець племені"
 soh_ending_the_tribe_desc:0 "Дехто з наших призовників надав нам цінні розвіддані: лідери племені мають намір зустрітися у своїй столиці, щоб обговорити питання нашої окупації. Шкода, що вони не знають, що ми будемо на них чекати."

 soh_firing_range:0 "Стрільбище"
 soh_firing_range_desc:0 "Деякі зі Сталевих Кігтів вирішили влаштувати стрільбище на землях племені Чотирьох Батьків. Оскільки це так далеко від нашого нагляду, деякі менш обережні Лицарі вирішили випробувати експериментальну оптику лазерних гвинтівок, і до біса наслідки."

 soh_what_was_left_behind:0 "Те, що залишилося позаду"
 soh_what_was_left_behind_desc:0 "Нам вдалося вилучити надзвичайно потужну зброю з кузень [BIS.GetName], зокрема ящик гвинтівок Гаусса. Ми повинні негайно пустити їх у діло."

 soh_metalmouths_salvage:0 "Копаючись у рештках"
 soh_metalmouths_salvage_desc:0 "Хоча дикуни та рейдери були для Гейман по суті одним і тим же, ті, що в Монтані, привернули її увагу. Там були групи, які не просто носили брухт, ніби це одяг, а мали силу тренувати та забезпечувати грізних солдатів. Звісно, вони бліднуть у порівнянні з могутністю Братства, але принаймні ми можемо знайти гідне застосування їхнім припасам."

 soh_war_with_str:0 "Де колись палали Сім Вогнищ"
 soh_war_with_str_desc:0 "Стояча Скеля негостинно ставилася до чужинців, м'яко кажучи. Хоча Гейман вважала їхні причини гідними, свою справу вона вважала ціннішою. [ROOT.GetName] витіснить їх."

 soh_standing_rock_stands_strong:0 "Усе ще стоять, навіть перед обличчям зла"
 soh_standing_rock_stands_strong_desc:0 "Попри всі зусилля Гейман, тубільці зі Стоячої Скелі так легко не здадуться... Доведеться шукати нове рішення."

 soh_no_more_standing_rocks:0 "Жодних напівзаходів"
 soh_no_more_standing_rocks_desc:0 "З тубільцями в Стоячій Скелі було покінчено. Хоча їхні північні землі залишилися під окупацією Братства, решті дозволили зберегти певну форму автономії. Принаймні, судячи з тих небагатьох, хто вижив..."

 soh_war_with_bis:0 "Чоловіки та жінки Бісмарка"
 soh_war_with_bis_desc:0 "Дехто каже, що дзвони гучно били опівдні, коли Гейман увійшла в місто. Інші були достатньо розумними, щоб зрозуміти, що це площа вибухнула пекельним вогнем, коли Братство увійшло в місто."

 soh_german_ingenuity:0 "Ремісники"
 soh_german_ingenuity_desc:0 "Майстри Бісмарка славилися своєю пристрастю в Дакоті та вниз по річці Міссурі. Зробити їх нашими головними консультантами значно зміцнить наші власні запаси."

 soh_german_advisor:0 "Кулуарні угоди"
 soh_german_advisor_desc:0 "До нас звернувся чоловік із пропозиціями про співпрацю. Заводський магнат, відомий як у Бісмарку, так і за його межами, бажає вести справи виключно з нами в обмін на захист і активи Братства. Хто ми такі, щоб відмовляти?"

 soh_the_fires_of_industry:0 "Вогні Бісмарка"
 soh_the_fires_of_industry_desc:0 "Хоча значна частина місцевої інфраструктури була пошкоджена під час штурму Братства, заводи, на щастя, залишилися неушкодженими. Повернення людей до роботи на них і взяття контролю буде чудовим для нашої окупності інвестицій."

 soh_bigger_hands_to_help:0 "Більші руки для допомоги"
 soh_bigger_hands_to_help_desc:0 "Хоча Гейман знала, що вони як нескінченна зараза по всій Північній Америці, вона захоплювалася силою, яку міг нести Супермутант. Пропонування додаткових винагород за приєднання до Братства будь-якому блукаючому мутанту було б чудовим кроком для поповнення лав."

 soh_research_1:0 "Дослідження мобілізації"
 soh_research_1_desc:0 "Мобілізація нашого дослідницького часу... менш ніж бажана, м'яко кажучи. Ми повинні захистити їх і забезпечити, щоб вони могли добре виконувати свої завдання, щоб підвищити ефективність."

 ### Shit hits the fan branch

 soh_reclaiming_fort_verity:0 "Катастрофа"
 soh_reclaiming_fort_verity_desc:0 "Патрокл провалився. Тепер час справжнім солдатам все зачистити."

 soh_reporting_back:0 "Звіт"
 soh_reporting_back_desc:0 "Уникати цього більше не можна. Патрокл почув достатньо гомону та шепоту про те, чим ми займалися. Або він змінить свою думку зараз, або ніколи."

 soh_shining_endorsement:0 "Блискуче схвалення"
 soh_shining_endorsement_desc:0 "Моя робота була підтверджена. Усе, що я робила, було на благо Братства Сталі. Добре, що Патрокл прислухався до розуму і схвалив мою роботу своїм іменем."

 soh_joint_operation:0 "Пряма підтримка"
 soh_joint_operation_desc:0 "Ми отримали лицарів на допомогу в нашому прагненні розчавити Сестер Сталі. Ми повинні знайти їм гарне застосування якомога швидше."

 soh_garrison_support:0 "Підтримка гарнізону"
 soh_garrison_support_desc:0 "Гвинтівки повстанців за кожним валуном і травинкою. Ми повинні остерігатися втратити те, що маємо, поки знищуємо Сестер. Патрокл бачить у цьому мудрість."

 soh_it_takes_two_to_tango:0 "Для танго потрібні двоє"
 soh_it_takes_two_to_tango_desc:0 "Патрокл провалився б без мене в кожній зі своїх місій. Ім'я Гейман ще не повністю відновлено, але це маленький крок у правильному напрямку. За майбутні кроки."

 soh_dakota_chapter:0 "Позиція Юстинії"
 soh_dakota_chapter_desc:0 "Журнал §RГейман§! \n\nОдин чоловік якось сказав мені: «Шукаючи помсти, копай дві могили». Тож я розрубаю Патрокла навпіл."

 soh_continue_the_mission:0 "Зелене світло для місії"
 soh_continue_the_mission_desc:0 "Місія більше не є самовільною операцією. Маючи повне схвалення, ми можемо безперешкодно продовжувати винищення Сестер."

 soh_war_with_marshall:0 "Військовий порядок для Маршалла"
 soh_war_with_marshall_desc:0 "Параноїдальні, одержимі свободою громадяни Вільних Штатів на півдні стоять на нашому шляху, і якщо вони не збираються слухати моїх слів, вони, чорт забирай, прислухаються до лазерного опіку третього ступеня."

 soh_treasures_of_the_free_states:0 "Скарби Вільних Штатів"
 soh_treasures_of_the_free_states_desc:0 "Джек Рід та його лакеї мали багато зайвих дрібничок і сиділи на купі кришок, які тепер належать нам."

 soh_the_greatest_showdown:0 "Судний день"
 soh_the_greatest_showdown_desc:0 "Ми нарешті вистежили останню із Сестер Сталі до схованки посеред території Ханів. У нас немає місця для зрадників або тих, хто їх переховує."

 soh_brotherhood_business:0 "Справи з Компанією Базальт"
 soh_brotherhood_business_desc:0 "Караванна компанія «Базальт» була шкідником у володіннях Маршалла. Оскільки вони досить вправні, у вищих ешелонах існує переконання, що їх можна використати на нашу користь."

 soh_fate_of_the_sisterhood:0 "Доля Сестринства"
 soh_fate_of_the_sisterhood_desc:0 "Ніщо не може тривати вічно. Онор та її щурів загнали в кут, і дати їхньої страти вже давно прострочені. Папери вже підписані, тепер час завершити роботу назавжди."


 ##DAKOTA CHAPTER!

 soh_exposing_traitors:0 "Викриття зрадників"
 soh_exposing_traitors_desc:0 "Схоже, Лицар Ворвік проник у наші лави і намагається налаштувати нас проти самих себе. Ми повинні знайти завербованих ним зрадників і придушити це повстання, перш ніж воно почнеться."

 soh_its_personal:0 "Я тут лиходійка"
 soh_its_personal_desc:0 "Якщо Патрокл хоче грати в ігри, я можу грати в них удвічі краще. Його люди не завжди сидять у тому бункері. Я відловлюватиму їх по одному, відтягуючи кожного від цього жалюгідного виродка, доки він не залишиться сам. Тоді все, що від нього залишиться — це примітка в моїй книзі історії."

 soh_contact_the_circle:0 "Зв'язок із Колом"
 soh_contact_the_circle_desc:0 "Зв'язок із Колом Сталі може бути, ну, ризикованою справою, але якщо їх не можна змусити побачити це, то, можливо, вони теж заслуговують на кару. Дії Патрокла ясні як день. Він не має підстав «вигнанцем» виключати мене з Братства, скільки б людей не смоктало з його брехливих дійок."

 soh_et_tu_brute:0 "Що могло б бути"
 soh_et_tu_brute_desc:0 "«О, що могло б бути», — скаже він, коли я вгороджу лезо в його серце. \n\n«О, яка трагедія! Чого б я не віддав за твоє милосердя», — скаже він, коли я вирву нутрощі з його тіла. \n\nА потім настане тиша раз і назавжди."

 soh_operation_cavaliers_end:0 "Операція: Кінець Кавалера"
 soh_operation_cavaliers_end_desc:0 "І так, моя подорож досягла кінця. Ми успішно знищили Сестер Сталі і впевнено йдемо до завершення нашого мандату. Незабаром ми зможемо об'єднати Монтану під прапорами Братства."

###postgame

 soh_from_the_ashes:0 "Новий розділ"
 soh_from_the_ashes_desc:0 "Монтанська експедиція тепер розколота двічі. Потрібно встановити новий режим, щоб ми не скотилися далі в хаос."

 soh_a_pact_in_darkness:0 "Скорбота Юстинії"
 soh_a_pact_in_darkness_desc:0 "У своїх параноїдальних мареннях, викликаних різноманітними імплантаціями в її розумі та тілі, Юстинія шукала свободи — або, можливо, порятунку — у темному та жахливому місці: володіннях Безсмертного."

 soh_mobilization:0 "Мобілізація Дакоти"
 soh_mobilization_desc:0 "Машини, щоб роздавити наших ворогів. Це те, чого повинні прагнути всі переможці, чи не так?"

 soh_bos_racketeering:0 "Режим, на який ми можемо покластися"
 soh_bos_racketeering_desc:0 "Журнал §RГейман§! \n\nБратство надто довго було занадто м'яким. Граничні випадки ігнорованих дивацтв підтримуються неспроможними кретинами, і що ми маємо в результаті? Спадщину помилкових невдач і напівперемог. Монтана, Дакота — ці місця є судинами для того, щоб Братство стало справді праведним місцем. Поза межами досяжності ідіотів. Поза баченням старечих маразматиків."
 
 soh_training_drive:0 "Тренувальні збори"
 soh_training_drive_desc:0 "Масштабні тренувальні збори будуть проведені під сонцем Монтани; там буде виховано нове покоління Братства, виточене рукою Юстинії Гейман."

 soh_gideons_elite_knights:0 "Елітні Лицарі"
 soh_gideons_elite_knights_desc:0 "У будь-якій формі військового уряду має бути елітна каста солдатів, гідних поваги, яку вони здобули. Усі старі лицарі будуть підвищені до звання Еліти, щоб відрізнити їхній ранг від тих Лицарів, що тільки будуть. Піднесення цих нижчих дикунів до наших вищих ешелонів призвело б лише до ще одного «Сестринства»."

 soh_gideons_elite_scribes:0 "Елітні Писарі"
 soh_gideons_elite_scribes_desc:0 "Слідом за Елітними Лицарями буде створено касту Елітних Писарів, щоб керувати нижчими щаблями інтелекту серед наших вчених і переписувачів; так ми зможемо просунути наші дослідження до цілей, які раніше вважалися неможливими."

 soh_the_lower_echelons:0 "Нижчі ешелони"
 soh_the_lower_echelons_desc:0 "Клас селян необхідний у будь-якому випадку сучасного феодалізму. Жорстка кастова система, що запобігає піднесенню, збереже Братство як цілісну сутність зі справжньою та розумною владою."

 soh_wyoming_farming_tax:0 "Фермерський податок Вайомінгу"
 soh_wyoming_farming_tax_desc:0 "Ранчо Вайомінгу будуть обкладені податком на воду, оскільки Братство потребує її у своїх далеких подорожах; якби не їхні благородні жертви, ми всі стали б жертвами злодіяння зневоднення."

 soh_a_regime_to_count_on:0 "Наполегливий Старійшина"
 soh_a_regime_to_count_on_desc:0 "Найвидатнішим воїнам слід давати владу; зрештою, суспільство тримається разом завдяки мірі сили. Цілком природно, що найвеличніші повинні вести за собою."

 soh_securing_the_east:0 "Натиск на Схід"
 soh_securing_the_east_desc:0 "На схід від нас є маленькі, незрілі нації, які можна використати собі на користь. Ми візьмемо їх силою."

 soh_ryczek_afb:0 "Військово-повітряна база Ричека"
 soh_ryczek_afb_desc:0 "Ричек давно був кумиром Гейман, відколи вона почула історії про нього від свого діда. Назвати базу на його честь було природним рішенням."

 soh_flight_test:0 "Кулак Юстинії"
 soh_flight_test_desc:0 "Вперше в історії Монтанської експедиції було побудовано новий цепелін — «Кулак Юстинії». Гучним ревом і виючою сиреною він заявив про себе в ночі на жах багатьом. \n\nМожливо, це було знамення того, які темні дні чекають попереду..."

 soh_bounties_of_macarthur:0 "Скарби Макартура"
 soh_bounties_of_macarthur_desc:0 "Після падіння Макартура Гейман не гаяла часу, прочісуючи його в пошуках всього, що могла знайти. Хоча небагато вціліло, багато костюмів силової броні можна було реконструювати для Братства... І коли нікому сказати, що вони не можуть цим користуватися, то чому б і ні?"

 soh_enclave_interrogation:0 "Утікач"
 soh_enclave_interrogation_desc:0 "Вченого Анклаву спіймали, коли він переховувався під фальшивим ім'ям посеред Гавра. На щастя, наші солдати швидко його затримали. Подивимося, чи не зможемо ми відкрити його величезний масив знань про передові технології; напевно, якщо залишити його в камері наодинці та без нагляду з паладином Джейкобсом, це розв'яже йому язика?"

 soh_eastern_beasts:0 "Звірі Сходу"
 soh_eastern_beasts_desc:0 "На краю Дакоти лежало два зла: Сховище під керівництвом машини та «Король Тарганів». Вони не протримаються довго."

 soh_petty_fights_be_damned:0 "Тарган за тарганом, за тарганом"
 soh_petty_fights_be_damned_desc:0 "Люди бачили досить радіоактивних тарганів ще до прибуття в Дакоту. Тепер, розібравшись із безладом, який накопичив Король Тарганів, вони побачили достатньо на десять життів уперед."

 soh_into_the_vault:0 "Руїни Сховища 37"
 soh_into_the_vault_desc:0 "Темні, похмурі зали Сховища 37 колись гуділи від штучного інтелекту. Тепер це оболонка — вмираюча шкаралупа, завдяки нашим зусиллям."

 soh_in_atoms_glow:0 "У сяйві Атома"
 soh_in_atoms_glow_desc:0 "Вогні Атома яскраво сяють, але лють Гейман завжди була найбільшим вогнем у будь-якій кімнаті. Атом бліднув би у порівнянні з її могутністю, так чи інакше."

 soh_reneging_our_promises:0 "Порушення обіцянок"
 soh_reneging_our_promises_desc:0 "§RЇм не варто було очікувати, що ми будемо чемними вічно.§!"

 soh_gauss_schematics:0 "Креслення Гаусса"
 soh_gauss_schematics_desc:0 "Зброя, гідна тих, хто вижив у Монтанській експедиції; та сама, що так легко може вселяти страх у серця необізнаних."

 soh_patrocolus_failures:0 "Невдачі Патрокла"
 soh_patrocolus_failures_desc:0 "Патрокл провалив свій мандат із забезпечення Монтани та її ресурсів для Братства. Ми не провалимо."

 soh_chicago_lackey:0 "Лакей Чикаго"
 soh_chicago_lackey_desc:0 "Звичайний патруль у горах виявив членів Анклаву, які намагалися закріпитися в Монтані. Цього ніколи не буде. Ми повинні усунути цю загрозу, перш ніж вона усуне нас."

 soh_clearing_cults:0 "Ліквідація культів"
 soh_clearing_cults_desc:0 "Боги Старого Світу? Прапори Старого Світу? Зброя Старого Світу, яка вже знищила нас один раз? Усі ці речі занадто небезпечні, щоб їм поклонятися. Ми повинні показати цим культистам помилковість їхніх шляхів."

 soh_search_for_manifest:0 "Прочісування Боліт"
 soh_search_for_manifest_desc:0 "Ми зграя. Ми вовк.\nВиття — це колискові. Жага крові — наша сила."

 soh_data:0 "Пошкоджені журнали даних"
 soh_data_desc:0 "Ми знайшли кілька пошкоджених аудіофайлів, які ми можемо відновити, трохи попрацювавши. Можливо, ми зможемо отримати деяке розуміння нашого союзника ШІ."

 soh_manifest_north:0 "МАНІФЕСТ Північ"
 soh_manifest_north_desc:0 "Йормунґанд був одним із двох сестринських ШІ, спочатку створених разом із Фенріром, але тепер здається, що Доля — це все, що залишилося від того оригінального ШІ. Шериф, ймовірно, був би великим активом на полі бою. А Йормунґанд завжди був палієм війни..."

 soh_manifest_saskatchewan:0 "МАНІФЕСТ Саскачеван"
 soh_manifest_saskatchewan_desc:0 "Гель була одним із двох сестринських ШІ, спочатку створених разом із Фенріром, але тепер здається, що Надія — це все, що залишилося від того оригінального ШІ. Гель говорить і поводиться як південна красуня, але, можливо, вона має бойові підпрограми, які ще належить розблокувати?"

 soh_manifest_ragnarok:0 "Рагнарек"
 soh_manifest_ragnarok_desc:0 "Йормунґанд, Гель і Фенрір — це лише фрагменти великого цілого: ключа до Комплексу Рагнарек. Неушкоджений командний пункт МАНІФЕСТУ зберігає щось дуже важливе для Фенріра... що б це не було, воно слугуватиме лише подальшим цілям Відділку."

 soh_midwestern_design:0 "Середньозахідний дизайн"
 soh_midwestern_design_desc:0 "Ми отримали креслення деяких літальних апаратів Братства Середнього Заходу. Ми повинні використати їх, щоб розпочати нашу власну розробку."

 soh_raining_hellfire:0 "Дощ пекельного вогню"
 soh_raining_hellfire_desc:0 "Ми відкрили секрети боєприпасів «Пекельний вогонь». Це може лише збільшити наші можливості на полі бою. Наші вороги не зрозуміють, що їх вразило, коли пекельний вогонь проллється з неба."

 soh_heavier_light_weapons:0 "Важча легка зброя"
 soh_heavier_light_weapons_desc:0 "Ми завжди повинні прагнути покращити наші можливості легкої зброї. Зрештою, гатлінг-лазери та вогнемети самі себе не спроектують!"

 soh_operation_ragnarok:0 "Бог-Вовк кличе"
 soh_operation_ragnarok_desc:0 "Ми чуємо це. Виття божевільного бога. Воно вторгається в наші сни. Воно псує нашу жагу крові. Воно кричить нам битися сильніше. Вбивати більше. Цього ніколи не буває достатньо."

 soh_implants:0 "Неконтрольована аугментація"
 soh_implants_desc:0 "Фенрір надає доступ до своїх банків даних досліджень щодо аугментації людського тіла. Можливо, ми зможемо використати це, щоб дати поштовх подальшим дослідженням військового застосування цієї технології."

 soh_to_swallow_the_sky:0 "Поглинути небо"
 soh_to_swallow_the_sky_desc:0 "«Фенрісвульф наступає з роззявленою пащею: його верхня щелепа сягає небес, а нижня опускається до землі. Він відкрив би її ще ширше, якби тільки було місце»."

 soh_to_kill_a_god:0 "Вбити бога"
 soh_to_kill_a_god_desc:0 "Журнал §RГейман§! \n\nЯ зайшла так далеко не для того, щоб щось стало мені на заваді. Ніщо не зупинить мене зараз — ні Онор, ні Патрокл, ні навіть Фенрір."

 soh_free_the_world:0 "Фолькванґ"
 soh_free_the_world_desc:0 "§g«Звільнити світ від самозваних Богів і Королів».§!\n\n...\n\n§RЗРОЗУМІЛО.§!"

 soh_coalition_of_fools:0 "Коаліція дурнів"
 soh_coalition_of_fools_desc:0 "Колись була група людей, які скинули ярмо тиранії та поставили королівство на коліна. Вони встановили свою незалежність і свої республіки та об'єдналися, щоб більше ніколи не знати гноблення. Чудова історія. На жаль, вона стоїть на моєму шляху."

 soh_self_indulgent_kings:0 "Самозакохані королі"
 soh_self_indulgent_kings_desc:0 "Атрибути королів завжди ставали на заваді тому, що дійсно має значення. Самопроголошені Боги та Королі — це пережитки Старого Світу, які краще залишити в минулому. Ці дурні також стоять на моєму шляху."

 soh_bloody_electorate:0 "Крихта надії"
 soh_bloody_electorate_desc:0 "Саскачеван ослаблений кривавою громадянською війною. Можливо, нам варто показати цій демократії, що гризеться між собою, цінність мирної передачі влади."

 soh_gateway_gang:0 "Тягнучись до Долі"
 soh_gateway_gang_desc:0 "Гнилий Ліс наповнює нас жахом. Ми знаємо, чому ці аберації такі, які вони є. Проте ми повинні йти вперед, щоб захопити комплекс на далекій півночі. Можна лише гадати, чи наша доля буде такою ж, як у них."

 ##decisions
 soh_omega_episode_decisions_category:0 "§RРагнарек§!"
 soh_omega_episode_decisions_category_desc:0 "Хоча Гейман пережила свою першу смерть, Фенрір ще не покінчив з нею. Він вимагає, щоб вона дісталася до різних комплексів МАНІФЕСТ на північних територіях, і вона не має іншого вибору, окрім як слухатися..."
 soh_manifest_bunker_destiny:0 "МАНІФЕСТ §RПівніч§!"
 soh_manifest_bunker_destiny_tt:0 "підказка доля"
 soh_manifest_bunker_hope:0 "МАНІФЕСТ §MСаскачеван§!"
 soh_manifest_bunker_hope_tt:0 "підказка надія"
 soh_manifest_bunker_ragnarok:0 "Об'єкт МАНІФЕСТ §OРагнарек§!"
 soh_manifest_bunker_ragnarok_tt:0 "підказка рагнарек"
 soh_manifest_scavenging:0 "Прочісування комплексів МАНІФЕСТ"
 soh_manifest_scavenging_tt:0 ""
 soh_steal_support:0 "Санкціонувати відправлення інструментів"
 soh_steal_explosives:0 "Санкціонувати відправлення хімікатів"
 soh_steal_fusion_cells:0 "Переробка мікроядерних батарей"
 soh_steal_caravans:0 "Встановити рекет захисту караванів"
 soh_renegotiations:0 "Порушення обіцянок"
 soh_renegotiations_desc:0 "Їм не варто було очікувати, що ми будемо чемними вічно."
 soh_property_seizure:0 "Конфіскація майна"
 soh_property_seizure_desc:0 "Активи Джексонів були нам корисні до цього часу, однак все, що менше за наш прямий контроль над ними, є неприйнятним."
 soh_subduing_states:0 "Придушення опору на окупованих територіях"
 soh_hayman_coring:0 "Підкорити §Y[FROM.GetName]§!"
 soh_hayman_1:0 "Територіальна консолідація"
 soh_hayman_2:0 "Нова ера експансії"
 soh_ata_deveopment:0 "Розробка вдосконаленої технічної броні"

 soh_explore_the_wolfsbane_facility:0 "Дослідження культу Вовкогуба"
 soh_explore_the_wolfsbane_facility_desc:0 "Старий комплекс МАНІФЕСТ тут був одним із небагатьох американських об'єктів, що належали компанії навіть після канадської анексії. Роками він був вигнанцем для місцевих, куди наважувалися заходити лише дивні культисти у вовчих масках. Ймовірність того, що там зберігаються важливі технології, надто висока, щоб її упустити. Давайте зачистимо культ і проникнемо всередину."
 soh_investigating_dreams:0 "Гамування снів"
 soh_investigating_dreams_desc:0 "Чоловікам, які наважилися увійти на старий об'єкт МАНІФЕСТ, сняться погані сни, усі пов'язані з вовками та дивним дзижчанням у вухах. Що гірше? Більшість із них навіть не пам'ятають, як заходили всередину. Нам треба з'ясувати, що відбувається... і швидко."
 soh_oblige_the_visions:0 "Слідувати видінням"
 soh_oblige_the_visions_desc:0 "Стара радить нам слідувати за цими видіннями. З якою метою, ми й гадки не маємо — але, можливо, в кінці цієї веселки є золото... Або неглибока могила. Хай там як, ми тут. Подивимося, куди це нас приведе."
 soh_where_gods_fall:0 "Рагнарек"
 soh_where_gods_fall_desc:0 "ФЕНРІР спотворив тіло Гейман, перетворивши її на кібернетичного монстра. Тим не менш, якийсь залишок її вільної волі зберігся... Що б не сталося в бункері Рагнарек, нехай нам усім пощастить пережити наслідки."

 soh_haymans_journey:0 "Кривавий реєстр Юстинії Гейман"
 soh_haymans_journey_desc:0 "      "