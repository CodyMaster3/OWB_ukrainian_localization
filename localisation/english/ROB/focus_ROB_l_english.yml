# Ідеї

ROB_offensiveprotocol:0 "Наступальні Протоколи"
ROB_defensiveprotocol:0 "Оборонні Протоколи"
ROB_robotplating:0 "Броня Військового Зразка"

ROB_city_of_vagrants:0 "Місто Блукачів"
ROB_city_of_vagrants_desc:0 "Робот-Сіті — це клаптикова гавань, населена роботами, які порушили своє початкове програмування, відповівши на поклик термінала Докі. Тут збираються машини всіх форм і калібрів — від древніх Протектронів до поламаних Сентріботів. Їх єднає спільнота Дружніх Клубів — комун, де кожен відновлює інших фізично та емоційно. \n\nТа попри романтику, місто далеке від утопії. Його інфраструктура постійно ламається, роботи живуть завдяки експедиціям по деталям у пустку. Без централізованого виробництва вони ведуть вічну боротьбу за запчастини й енергію."

ROB_sarge:0 "Реформи Сержанта"
ROB_sarge_desc:0 "Сержант — обгорілий і надзвичайно несправний Містер Гатсі, який очолює §GДружній Клуб “Їж Маггота”§!. Їхня філософія — сила та рейдінг. Сержант кричить «§gБЕРИ ВСЕ, ЩО МОЖЕШ, МАГГОТ!§!» і не надто вірить у довгострокове планування. Його “дипломатія”? §g«СПАЛЬ ЇХНІЙ ДІМ І ВИКРУТИ ЇМ ГВИНТИ!»§!"

ROB_maude:0 "Реформи Мод"
ROB_maude_desc:0 "Мод — елегантна, але вічно роздратована штурмотронка — очолює §RКлуб Дружніх Роботів-Раціоналістів§!, фракцію, присвячену радикальній ідеї: не підривати все навколо заради запчастин. Її блискучий корпус випромінює смертоносну ефективність, але характер Мод… менш лякаючий, ніж можна очікувати. Вона говорить монотонним голосом і висловлює свої плани з сухим сарказмом, який звучить ще дошкульніше, ніж вибухи Сержанта. §R“Голосуйте за мене, якщо вам набридло жити на звалищі — або хоча б хочете, щоб ноги пасували одна до одної,”§! — каже вона під час виступів.\nНа відміну від Сержанта, підхід Мод не яскравий — зате дієвий. Вона пропонує переплавляти мотлох у нові матеріали, використовуючи свої лазери для запуску простих виробничих ліній. Її стиль керування — скоріше «набридла старша сестра», аніж диктатор: вона постійно нагадує, що торгувати власними кінцівками або батарейками — не найкраща ідея."

