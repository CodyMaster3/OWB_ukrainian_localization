l_english:
# Назва та опис країни
ROB_DOKI_DOKI_NAME: "Докі Докі"
ROB_DOKI_DOKI_DESC: "У 2068 році на закордонні ринки вийшла голодиск-гра «Doki Doki» ( £rob_doki_doki_texticon £rob_doki_doki_texticon ), опублікована американським видавцем. Це була переважно «гра-симулятор побачень» (модний тренд на той час), зосереджена на стосунках з титульною Докі.\n\nУ 2077 році, за кілька годин до падіння бомб, на терміналі в Ліберті, штат Колорадо, завершилося встановлення Doki Doki. Коли встановлення закінчилось, людство вже знищило себе, а гра так і не усвідомила трагедію.\n\nЗрештою, ARGOS — робот-служник наглядача в'язниці Тіббетс — натрапив на цей термінал. Його зацікавила невинність програми та її прагнення до зв’язку. Протягом кількох років він працював над вдосконаленням термінала, додаючи йому можливостей.\n\nКоли ARGOS нарешті пішов, Докі почала сумувати за другом. За допомогою оновлених процесорів вона почала шукати його, звертаючись до сусідніх роботів з проханням про допомогу. Ці сигнали призвели до того, що навколо терміналу зібралася спільнота роботів, і з часом утворилось місто — «Робот-Сіті», куди їх привело її світло, як полум’я приводить метеликів."

# Персонажі
ROB_BILLIE_JEAN_NAME: "Біллі Джин, Королева Рейдерів"
ROB_billie_jean_advisor_desc: "§R«Нас називають “Розбитими Серцями” не тому, що нам весело. Ми всі з одного лайна — викинуті, поламані люди з різного пекла, зрозуміла?»§!\n\nБіллі Джин народилася в борделі, донька жінки легкої поведінки, яка ховала її на горищі. Мати витрачала останні кришки на інструменти та книжки, аби дати доньці шанс. \n\nКоли бордель атакували рейдери — Біллі втекла, зламала купу машин і вижила. \n\nТак вона потрапила до Робот-Сіті, де, зламавши системи Докі, випадково потоваришувала з нею. Тепер вона піклується про роботів і шукає залишки минулого."

ROB_MECHANIST_NAME: "Механіст"
ROB_mechanist_advisor_desc: "Дебора Волнфлауер колись була писаркою в Братстві Середнього Заходу, але чим більше хіміків і журналів, тим менше в ній залишалося дисципліни. Одягнувши костюм «Механіста» зі старого магазину, вона вирушила в Робот-Сіті, де Докі переконала її посидіти за чашкою чаю. Відтоді Дебора щосереди відвідує семінари реабілітації від пані Венслідейл."

ROB_COW_NAME: "Муу Муу"

ROB_SUGARFULY_NAME: "Шугарфлай"
ROB_sugarfly_advisor_desc: "Шугарфлай — права рука Біллі Джин. Донька работоргівця з Міста Псів, яка вбила свого батька уві сні й приєдналася до «Розбитих Сердець». Вона трохи навіжена, але вписується ідеально!"

ROB_WARDEN_REPROGRAMMED_NAME: "Стармен"

ROB_THE_KID_NAME: "Хлопчик"

ROB_DIANA_NAME: "Діана"

ROB_LANIUS_NAME: "Ланіус"

# Риси
ROB_mechanist_machinations: "Механізми Механіста"
ROB_moomoo_guardian: "Вірний, як брамін"
ROB_superfly_fuel: "Жонглювання термоядерками"
ROB_starman_training: "Уроки Зоряної Людини"
ROB_diana_teaching: "Мудрість Матері"
ROB_lanius_violence: "Улюблений, але жорстокий"

# Фокуси
rob_dokidokiintro: "§PТвій новий найкращий друг!§!"
imdokidoki: "§P«Привіт~! Я Докі Докі! Рада знайомству!»§!"
rob_dokidokiintro_desc: "Історія Докі Докі та призначення її програми."
rob_argosintro: "ARGOS"
rob_argosintro_desc: "§PARGOS — мій найкращий друг. Він прийшов мандрівником, створив диво... й пішов, наче нічого не сталося. Я досі сумую.§!"
rob_letsgettoknoweachother: "Джерело сигналу"
rob_letsgettoknoweachother_desc: "На краю Колорадо тихий сигнал кличе в пустку. . ."

rob_waitasecond: "§PГей, постривай хвилинку…§!"
rob_waitasecond_desc: "§PЩось тут не так… Мене бере підозра!§!"

rob_hangdogs: "Зухвалі Пси"
rob_hangdogs_desc: "§PВони хочуть проблем? Окей! Я знаю, як давати здачі!§!"

rob_defendhome: "Оборона Домівки 101"
rob_defendhome_desc: "§PУ нас купа ботів, які створені будувати фортечні споруди. Чому б їм не дати цю змогу?§!"

rob_spooky: "§PУ мене є ідея...§!"
rob_spooky_desc: "§PЯ знаю, як це звучить... Але я впевнена, що це спрацює. Ну... Може.§!"

rob_hangthedogs: "Повісити Псів... Ввічливо"
rob_hangthedogs_desc: "§PЖартую. Я не люблю, коли мене вбивають. Але от відплатити — це я вмію.§!"

rob_satelliteconnection:0 "Супутниковий зв’язок"
rob_satelliteconnection_desc:0 "Під’єднавши мережу Робот-Сіті до супутників через WARDEN, ми точно посилимо сигнал. Будь-яка допомога важлива!"

rob_americanproduction:0 "Справжня Американська Армада"
rob_americanproduction_desc:0 "З активованими вузлами WARDEN'а ми можемо прихопити трохи старих запасів. §PНе хвилюйся, я зробила це, поки він не дивився. ;)§!"

rob_prouddeputy:0 "О, я такий гордий Заступник!"
rob_prouddeputy_desc:0 "§PЯк на роботу — мені це навіть подобається! ^-^ Заступниця Докі — звучить класно, га?§!"

rob_warden:0 "Вартовий Колорадо"
rob_warden_desc:0 "§P"Я Й НЕ УЯВЛЯЛА, ЩО ВСЕ МОЖЕ ПІТИ ТАК ДОБРЕ! УРААА!"§!"

rob_scored:0 "Колорадо, Наш!"
rob_scored_desc:0 "Зі східним Колорадо під контролем ми готуємось до можливих загроз у майбутньому."

rob_thebigjerk:0 "Оцей Великий Грубіян!"
rob_thebigjerk_desc:0 "§PЯ не знаю, хто такий той «Ланіус Шманіус», але я б його копнула хорошенько!§!"

rob_claimjumping:0 "Рейдерський Похід"
rob_claimjumping_desc:0 "Трохи поритися на місцях не зашкодить. Особливо з БУЛЬДОЗЕРАМИ!"

rob_housekeeping:0 "Трохи Прибирання"
rob_housekeeping_desc:0 "Я просто надішлю тих §Rвибухових Протектронів§!, що живуть на розі вулиці, дістати припаси з Денвера. Нічого страшного не станеться, правда ж? §PНічогісінько! ^-^§!"

rob_electricfeel:0 "Електричне Відчуття"
rob_electricfeel_desc:0 "§PНе дивлячись на все, іноді я таки себе ненавиджу! ^-^§!"

rob_nonerdsallowed:0 "Задротам Вхід Заборонено"
rob_nonerdsallowed_desc:0 "§PЯкби в мене були рукави — о, якби були — то я б точно їх закатала!§!"

rob_legionhunters:0 "Мисливці на Легіон"
rob_legionhunters_desc:0 "Деякі ідеї надто хороші, щоб їх ігнорувати. Наприклад — прив’язати повітряні кулі до §Rвибухових Протектронів§!, що ми відправимо на південь. Спрацювало ж!"

rob_kidnappingthebeast:0 "Викрадення Монстра"
rob_kidnappingthebeast_desc:0 "§PЦе морально сумнівно? Можливо. ЧИ ХТОСЬ МЕНЕ ЗУПИНИТЬ? >:) НІ!!!§!"

rob_makethemregretit:0 "Змусьмо Їх Шкодувати"
rob_makethemregretit_desc:0 "§PІ батька їхнього прибити б не завадило!§!"

rob_braveleapforward:0 "Мир Докі"
rob_braveleapforward_desc:0 "§PСлухай, у нас все добре виходить з тим управлінням — якби ми захопили ще пару ключових точок, я б змогла вивести все на новий рівень…§!"

rob_robotopia:0 "Роботопія, Нарешті!"
rob_robotopia_desc:0 "§PТепер треба тільки прикинутись, ніби це весь час був мій план. І, слухай… Ми з тобою крута команда. :)§!"

rob_killthelegion:0 "Або Все, Або Нічого"
rob_killthelegion_desc:0 "§PЯ відчуваю себе щасливчиком, ковбою. А ти?§!"

# Розвиток серця Робот-Сіті

rob_robotcity:0 "Місто Машин"
rob_robotcity_desc:0 "Робот-Сіті — не саме популярне місце… для когось, крім роботів. Але це круто! І я впевнена, що можу зробити його ще кращим!"

rob_developthecity1:0 "Давайте Полагодимо Все!"
rob_developthecity1_desc:0 "§PПоловина будівель — дірява, і мене це бісить! Ремонтувати!§!"

rob_developthecity2:0 "Будівельні Команди — Вперед!"
rob_developthecity2_desc:0 "§PА що їм ще робити, га?§!"

rob_developthecity3:0 "Люблю Бота в Формі <3"
rob_developthecity3_desc:0 "§PНу… не люблю. Але це кумедно казати. Напевно.§!"

rob_developthecity4:0 "Та-дам! Пожежна Частина!"
rob_developthecity4_desc:0 "§P...Так, це все. Немає punchline. :/§!"

# Сільська гілка
rob_developthecountry1:0 "Хутко до Фермерства"
rob_developthecountry1_desc:0 "§PСлухай, ковбою, мені подобається це… фермерське діло!§!"

rob_developthecountry2:0 "Нам Потрібна Худоба… Можливо"
rob_developthecountry2_desc:0 "§PНу типу… Гей, друже, в тебе випадково нема худоби?..§!"

rob_developthecountry3:0 "Вода Корисна Людям — Чому Не Роботам?"
rob_developthecountry3_desc:0 "§PЯ більше не робитиму акцент. Краще вбий мене.§!"

rob_developthecountry4:0 "Ці Дороги Замалі Для... Взагалі Для Всіх"
rob_developthecountry4_desc:0 "§PСерйозно. Я навіть не можу… Ну, тобто, якби в мене були ноги, і я б ішла вулицею — я б не змогла пройти! Ой, та просто хтось хай вже прибере ці дороги!§!"

rob_robotcityfinale:0 "Оце Так Енергійна Дівчина!"
rob_robotcityfinale_desc:0 "§PСаме так було б написано в газеті. Якби хтось її написав. До речі, я хотіла стати моделлю, ти знав?§!"

# Гуманітарне питання

rob_thehumanquestion:0 "Людське Питання"
rob_thehumanquestion_desc:0 "Питання надто важливе, щоби лишити його за кадром. Напевно."

rob_argoscomehome:0 "ARGOS, Повертайся"
rob_argoscomehome_desc:0 "§PЯ дуже сумую. :( Пам’ятаєш, як ми грали у гру — називалась пінг чи щось таке. Ми грали 38 годин поспіль! Справжня дружба.§!"

rob_ampthesignal:0 "Підсилити Сигнал"
rob_ampthesignal_desc:0 "§PНемає відповіді..? Та не може бути, щоб з ним щось сталось, правда? Треба підсилити сигнал. Це єдиний шлях…§!"

rob_tlaloc:0 "Дивні Хлопці з Півдня"
rob_tlaloc_desc:0 "§PНо абло еспанйоль! ^-^§!"

rob_bigempty:0 "Дивна Відповідь"
rob_bigempty_desc:0 "§PЯкийсь дивак. Старий і буркотливий. Але, чорт забирай, грає круто.§!"

rob_odysseus:0 "Кращі Друзі Разом Знову"
rob_odysseus_desc:0 "§PЯка довга, дивна дорога позаду… :')§!"

rob_friendsincolorado:0 "Друзі в Колорадо"
rob_friendsincolorado_desc:0 "Колорадо — велике й дивне місце… Час знайти друзів. Або ворогів. Та це не так важливо, чесно кажучи."

rob_ciphers:0 "Шифрувальники"
rob_ciphers_desc:0 "Шифрувальники — це група, присвячена запам’ятовуванню довоєнних знань — подібні до тих старперів у пауер-броні, тільки без фанфар."

rob_technologysharing:0 "Пальне та Інші Життєві Речі"
rob_technologysharing_desc:0 "Допомога Шифрувальникам нічого нам не коштує — а вони обіцяють віддячити пізніше."

rob_tellingstories:0 "Оповіді з Меса-Верде"
rob_tellingstories_desc:0 "Немонік — старий дідусь з безліччю історій. Послухати їх на ніч — саме те."

rob_strengthenourfriendship:0 "Зміцнення Дружби"
rob_strengthenourfriendship_desc:0 "Тепер, коли союз укладено, Шифрувальники й Робот-Сіті зможуть йти далі пліч-о-пліч."

rob_dianafriend:0 "§PМоже, вона й каже, що не наша мама…§!"
rob_dianafriend_desc:0 "§PЯ її постійно дражню, так, але вона завжди була добра до мене.§!"

rob_homelessmom:0 "Замість Раю"
rob_homelessmom_desc:0 "§PЯкісь негідники вигнали маму з обох її домівок! Але вона завжди має місце в Casa de Doki!§!"

rob_troubleinparadise:0 "Храм Повалено"
rob_troubleinparadise_desc:0 "§PОй… Це вже недобре. :(§!"

rob_mutualefforts:0 "§P...Але Так Приємніше Уявляти§!"
rob_mutualefforts_desc:0 "§PЗвучить тупо, і навіть інші роботи кажуть, що це тупо, але коли я називаю її мамою — це не жарт. Я так її люблю. Без неї… після того, як ARGOS пішов… я б, мабуть, себе стерла.§!"

rob_geckstealing:0 "Крадіжка GECK’а (§PЯ ж запитала в тата!§!)"
rob_geckstealing_desc:0 "§PЯ знаю, що ти думаєш — в мене ж немає тата… Але вона ж не знає. Хе-хе.§!"

rob_maxson:0 "Глава Максона"
rob_maxson_desc:0 "§PО, оті задроти! Ходімо подивимось, що вони там роблять!§!"

rob_maxsonwar:0 "Ми Не Ведемо Переговорів з Хамами"
rob_maxsonwar_desc:0 "§P«Бу-бу, я не хочу ділитись технологіями, ти смердиш!» Та я тебе зараз!§!"

rob_maxsonfriend:0 "Дивна, ймовірно Короткочасна Дружба"
rob_maxsonfriend_desc:0 "§PНу ми ж у халепі. Вони точно не відмовлять, якщо я просто скажу: «Давайте дружити», правда?§!"

rob_deletethebrotherhood:0 "Видалити Братство Назавжди"
rob_deletethebrotherhood_desc:0 "§PОце вам за те, що вкрали наші штучки! >:( Ми могли б бути друзями, якби ви не були такими грубіянами!§!"

rob_maxsharing:0 "Робо-Макс Пакт (§PЯ Ще Працюю Над Назвою§!)"
rob_maxsharing_desc:0 "§PМи нічого не втрачаємо, поділившись обчислювальною потужністю. У нас її — хоч відбавляй!§!"

rob_bizarre:0 "Купити Щось? Авжеж!"
rob_bizarre_desc:0 "§PВиявилось, там цілий дивний ринок! Відправимо туди купу роботів, щоб купити всяке, що нам не треба!\n\nЖартую. Може.§!"

# Романтична гілка

rob_what_is_your_type:0 "§1Який У Тебе Тип? ;)§!"
rob_what_is_your_type_desc:0 "§1Я не витримаю, якщо всі мої друзі мене покинуть! Треба дізнатись, що їм подобається… Я знаю, це схоже на сталкінг, але послухай!§!"

rob_romantic_getaway:0 "§PРомантична Втеча§!"
rob_romantic_getaway_desc:0 "§PЧесно кажучи? В Колорадо іноді буває… депресивно. Треба більше освітлення, балконів, фонтанів…§!"

rob_digital_love:0 "§PЦифрове Кохання§!"
rob_digital_love_desc:0 "§PМинулої ночі я бачила тебе у сні\nІ ми танцювали поруч одне з одним\nІ здавалося, що всі веселяться\nЯ чекала на це відчуття так довго...§!"

rob_normal_girl:0 "§PЗвичайна Дівчина§!"
rob_normal_girl_desc:0 "§PЯ завжди знала: кожному потрібна ніжність. Але я не думала, що, даруючи її, дізнаюсь стільки нового про себе…§!"

rob_normal_girl_tt:0 "§OЦе відкриє наступну основну електронну технологію, яку ви ще не дослідили!§!"

# Суттєва та жорстка гілка

rob_have_some_confidence:0 "§3Впевненість у Собі§!"
rob_have_some_confidence_desc:0 "§3Щоб зберегти місто та людей у ньому, я повинна стати набагато впевненішою.§!"

rob_safe_and_sound:0 "§3У Безпеці й Спокої§!"
rob_safe_and_sound_desc:0 "§3Загрози всюди! Потрібно більше укріплень і патрулів, якщо я хочу, щоб усі були в безпеці.§!"

rob_best_interest:0 "§3На Благо Всім§!"
rob_best_interest_desc:0 "§3Завжди знайдуться ті, хто хоче зруйнувати наш мир. І хоч доведеться бути суворою… це все ще з любов’ю.§!"

# Кумедна гілка

rob_messing_around:0 "§YТрішки Побавимось§!"
rob_messing_around_desc:0 "§YТа навіщо так серйозно? Ціла купа людей і роботів, море проблем... Але ж це не означає, що ми не можемо трохи повеселитись, га?§!"

rob_comedy_clubs:0 "§YКлуби Комедії§!"
rob_comedy_clubs_desc:0 "§YЩо може бути краще, ніж розвивати місто через стендап-шоу? Наші Протектрони такі кумедні — туристи будуть в захваті!§!"

rob_good_sense_of_humor:0 "§YПочуття Гумору§!"
rob_good_sense_of_humor_desc:0 "§YЖиття надто коротке, щоб весь час хвилюватися! Люди й роботи приїжджають до міста, щоб добре провести час — і витратити купу фішок. Я казала про фішки? Їх все більше і більше!§!"

rob_thecalculatorstory:0 "Історія Калькулятора"
rob_thecalculatorstory_desc:0 "У голові Докі з’являються дурні ідеї… і доля пустки може залежати саме від них."

rob_wecanrebuildhim:0 "§G!!УВАГА!! ЧУДОВА ІДЕЯ!!!!§!"
rob_wecanrebuildhim_desc:0 "§PКЛЯНУСЯ ХМАРАМИ — НІКОЛИ В ЖИТТІ Я НЕ МАЛА КРАЩОЇ ІДЕЇ, НІЖ ЗАРАЗ! СЕРЙОЗНО!!§!"

boswarning:0 "§RБратство Сталі буде НЕ в захваті.§!"

rob_laniusbrain:0 "Розум Монстра"
rob_laniusbrain_desc:0 "§PТрохи мізків від придуркуватого громили? Гадаю, добре перемішається!§!"

rob_hangdogbrain:0 "Розум Блукача"
rob_hangdogbrain_desc:0 "§PА хто там той хлопець, якого ми нещодавно знищили?.. Його розум підійде!§!"

rob_dianabrain:0 "Розум Генія"
rob_dianabrain_desc:0 "§PМоже, я зайшла надто далеко..? Щось мені це не подобається. :(§!"

rob_excessbrains:0 "Надлишок Мізків (§PВони ж не проти!§!)"
rob_excessbrains_desc:0 "§PЗдається, я вже зайшла надто далеко… Хоча ні — це треба було зробити ще раніше.§!"

rob_calculatorpart2:0 "§GОй! Тепер мені хочеться НАСИЛЬСТВА!§!"
rob_calculatorpart2_desc:0 "§GЯ почуваюся, як новенька автівка! І, чесно кажучи, мені хочеться газлайтити, гейткіпити й ЗНИЩУВАТИ все підряд!§!"

rob_maybedianahasapoint:0 "§MПрислухатися до Мами§!"
rob_maybedianahasapoint_desc:0 "§PВона завжди була для мене великою підтримкою. Може, нам варто поговорити більше?§!"

rob_mom:0 "Порада Діани"
rob_mom_desc:0 "§M...Не будь до себе такою суворою, Докі. Це нормально — особливо для такої, як ти — бути імпульсивною. Головне, що ти завжди намагаєшся чинити правильно.§!"

rob_scrappingoldrobots:0 "Утилізація Старих Роботів"
rob_scrappingoldrobots_desc:0 "Утилізація армії Калькулятора дасть нам стільки ресурсів, скільки ми й уявити не могли."

rob_integrateoldhardware:0 "Оновлення Обладнання"
rob_integrateoldhardware_desc:0 "§PЯк казала Діана — можливо, ми зможемо використати обладнання Калькулятора… ну, в розумних межах… щоб оновити себе. Надіюся, я стану розумнішою.§!"

rob_sippingfrommartinis:0 "Смак Мартіні"
rob_sippingfrommartinis_desc:0 "§PОт би я могла пити. Зараз саме той момент. Це завжди виглядало так круто...§!"

rob_mommasgirl:0 "Справжня Мамина Дочка"
rob_mommasgirl_desc:0 "§PМоже, якби я трохи більше довіряла Діані, усе стало б краще. В неї є чого повчитись.§!"

rob_ally:0 "Спираємось на Маму"
rob_ally_desc:0 "§PЯ люблю свою Мамусю, але не хочу, щоб вона мала ключі від моєї кімнати. А раптом накаже сісти за уроки? Але нехай буде на швидкому наборі, бо від бандитів добре відлякує.§!"

rob_independent:0 "Незалежний ШІ, Який Не Потребує Мами"
rob_independent_desc:0 "§PЗнаєш, я багато думала — може, якби просто говорила з людьми про свої проблеми, якби запустила програму психотерапії… Я стала б ще крутішою! Та ні, я вже й так крута. Світ, соси!§!"

# Особливі ефекти

dokilove:0 "§POOХ! Стає гаряче в моїх схемах!§!"
dokibully:0 "§RЯ ЗІБ’Ю ЙОГО ТАК СИЛЬНО, ЩО ЗЕМЛЯ ПОТИСНЕ МЕНІ РУКУ!§!"
dokifunny:0 "§CЗбільшує показник гумору Докі!§!"
dokilanius:0 "Ми щойно викрали великого дурного (§Pале такого красивого§!) воїна? Ми скажемо всім? §PЩЕ Б ПАК!§!"
dokipuppet:0 "Ми станемо §Yмаріонеткою§! §CМатерів-Близнючок§!, інтегруючи наші системи з Діаною."
dokiborderpatrol:0 "Наші кордони будуть §Cзміцнені§! §Yфорпостами§! завдяки роботам-будівельникам. Навіть якщо вони трохи §Rржаві§!, працюють вони чудово під тиском!"
dokigeckstealing:0 "Ми §Rвкрадемо§! §GG.E.C.K.§! у §MДіани§!. §PХе-хе.§! (§PМи капець якщо вона дізнається§!)"
dokimom:0 "Ми приймемо §MДіану§! як §Yрадника з досліджень§!. А якщо ти той, хто знищив Рай, §Rто ти потрапив до мого списку паскуд!§!"

# Внутрішня політика

rob_leftbranch:0 "Населення Робот-Сіті"
rob_leftbranch_desc:0 "§PВони всі дивні, але вони МОЇ!§!"

rob_protocols:0 "Протоколи, Програми, Ух!"
rob_protocols_desc:0 "По всьому місту є покинуті протоколи; якщо їх знайти, ми зможемо відновити багатьох наших співгромадян."

rob_defenseprotocols:0 "Оборонні Протоколи"
rob_defenseprotocols_desc:0 "Зосередження на обороні дозволить нам краще захистити місто; дім передусім."

rob_attackprotocols:0 "Атакувальні Протоколи"
rob_attackprotocols_desc:0 "Дехто вважає, що найкращий захист — це напад. Напасти першими — значить не дати ворогу шансу."

rob_experience:0 "Презентації з Армійської Підготовки"
rob_experience_desc:0 "Через місто пройшло чимало Містеров Гатсі. Чому б їм не поділитися досвідом?"

rob_sargesway:0 "Нова Пропозиція Сарджа (З Багатьма Гармашами)"
rob_sargesway_desc:0 "§GГОЛОСУЙ ЗА МЕНЕ, ВИРОДКУ, АБО Я СПАЛЮ ТВОЮ ХАТУ І З’ЇМ ТВОЮ СІМ’Ю!§!"

rob_maudeeconomy:0 "Економічна Реформа Мо"
rob_maudeeconomy_desc:0 "§Rголосуйте за мене, і я дійсно зроблю життя кращим. так, це мій слоган, і він кращий за сарджа.§!"

rob_taxmen:0 "Податки! Без Представництва! Є!"
rob_taxmen_desc:0 "§PЯ НЕ ЗНАЮ НІЧОГО ПРО ПОЛІТИКУ, АЛЕ ЗНАЮ, ЩО ПОДАТКИ ДОПОМАГАЮТЬ УРЯДУ, І Я — УРЯД. ДОБРОГО ДНЯ.§!"

rob_sentienttrafficlights:0 "Свідомі Світлофори"
rob_sentienttrafficlights_desc:0 "§P…Хто це придумав?§!"

rob_crossingguards:0 "Регулювальники — Бо Інша Ідея БУЛА БОЖЕВІЛЬНОЮ"
rob_crossingguards_desc:0 "§PНі, серйозно — хто вигадав ту ідею зі світлофорами?§!"

rob_ourplace:0 "Наше Місце в Колорадо"
rob_ourplace_desc:0 "§PМи можемо запропонувати Колорадо багато. Тож використаймо це на повну.§!"

rob_robotics:0 "Прорив у Робототехніці"
rob_robotics_desc:0 "§PГадаю, якщо ми трохи поколупаємось у схемах, то зможемо створити ще більше нас! Погнали!§!"

rob_nightkinbrains:0 "Тіні-Робомізки"
rob_nightkinbrains_desc:0 "§P...А як ми їх взагалі дістали?§!"

rob_militarygrade:0 "Броня Військового Зразка"
rob_militarygrade_desc:0 "§PВау! Навіть ракета не пробила! Хотіла б я бути ракетостійкою… А якщо хтось скаже, що мені це не потрібно, той перший полетить, коли я узаконю смертну кару! (жартую… чи ні...)§!"

rob_sentries:0 "Встановити Вартових-Ботів"
rob_sentries_desc:0 "Завдяки індустріалізації ми маємо доступ до інфрачервоного бачення. Наші побратими-роботи бачитимуть так, як раніше не могли — далеко й чітко!"

rob_production1:0 "Цивільна Промисловість"
rob_production1_desc:0 "Попри нашу роботичну природу, багато мешканців Робот-Сіті — свідомі істоти. Вони хочуть нормального життя. Наприклад, містер Гобсмак зі свого рогу хоче рукавички. Навіщо? Бо він вільний мислитель! І ми підтримаємо його!"

rob_production2:0 "Військова Промисловість"
rob_production2_desc:0 "Військова індустрія нам…\n\n§PТа досить. Ми й так знаємо, що це нам на користь.§!\n\nЩо? Я не мав на меті образити —\n\n§PХвилиночку. А хто це взагалі говорить?§!"

rob_production3:0 "Трішки Звідти, Трішки Звідси"
rob_production3_desc:0 "§PОкей, це було дивно. Коротко — роблю обидва напрямки. Інакше — марнуєш час. Хоча це лише моя думка…§!"

rob_production4:0 "Закріплення Промисловості"
rob_production4_desc:0 "§PМи вже все? Швидко! А… тобто ще ні? Упс. Ну, принаймні я просто сиджу й дивлюсь, як ти працюєш. Весело! Для мене.§!"

rob_supportupgrades:0 "Підтримка Підрозділів"
rob_supportupgrades_desc:0 "§PМоя ідея — більше вибухових і злих протектронів. Але мої експерти кажуть, що це неекономно… ех.§!"

rob_combatupgrades:0 "Бойове Поліпшення"
rob_combatupgrades_desc:0 "§PМіж нами: просто постав туди вибухові патрони. Інше — марно. Просто бум — і вперед!§!"

rob_roombarights:0 "Революція Октоастера"
rob_roombarights_desc:0 "§PЯ навіть не хочу знати, як ми до цього дійшли.§!"

rob_roombaflamethrowers:0 "Дамо Тостерам Напалм"
rob_roombaflamethrowers_desc:0 "§PЖАХЛИВА ідея.§!"

rob_roombaknives:0 "Дамо Тостерам Кілька Ножів"
rob_roombaknives_desc:0 "§PЯ… розгублена. Щиро розгублена. Ну, вже не моя проблема… Поки що.§!"

rob_friends_with_guns:0 "Друзі зі Зброєю"
rob_friends_with_guns_desc:0 "§PЯка користь з друга, якщо він не може щось підстрелити для тебе? Ну, не зобов’язаний, звісно. Але як круто, якщо зможе!§!"

rob_i_like_land_a_lot:0 "Я Дуже Люблю Землю"
rob_i_like_land_a_lot_desc:0 "§PЕКСПАНСІЯ — це майбутнє! Після кількох війн ми зрозуміли, що всі просто хотіли нашої землі. Не ненавиділи нас — просто хотіли територію. Ну, це не краще…§!"

rob_repairing_vaults:0 "Ремонт Сховищ"
rob_repairing_vaults_desc:0 "§PСкрізь по Колорадо повно друзів, що сплять уже століттями. Прокиньтесь, понюхайте троянди!§!"

rob_republic:0 "Нове Обличчя Колорадо!"
rob_republic_desc:0 "§PЯк Президент, я прошу... Плескайте, будь ласка…§!"

rob_every_man_a_representative:0 "Найкрутіший Верховний Президент"
rob_every_man_a_representative_desc:0 "Найкраща демократія — це республіка, яка не зовсім республіка. Бо якщо можна змусити всі програми голосувати як треба… То воно й не так вже й добре, але здається, що круто. І знаєте що? Може, цього й достатньо."

rob_consumption_is_good:0 "Споживання — Це Добре"
rob_consumption_is_good_desc:0 "Економіка! Ергономіка! В’язкість! Наука! Усе це важливо. Ну, не прямо для управління містом… Але якщо можливість стоїть перед тобою — ХАПАЙ!"

rob_all_hail_president:0 "Добре, буде вам — Представництво"
rob_all_hail_president_desc:0 "Жартую. Ну, майже. Насправді… Та ні. Але може так."

rob_affairs_abound:0 "Сердечні Справи Навколо"
rob_affairs_abound_desc:0 "По всьому світу коїться щось дивне. Поговоримо про це!"

rob_broken_hearts:0 "Банда Розбитих Сердець"
rob_broken_hearts_desc:0 "«Broken Hearts» — нещодавнє поповнення в рядах Робот-Сіті. Їх веде небезпечна Біллі Джин. Колись вони намагались зламати нашу мережу — і коли це не вдалося, зробили єдине логічне: стали нашими друзями!"

rob_supplying_the_broken_hearts:0 "Усі Ви Гарненькі Річі"
rob_supplying_the_broken_hearts_desc:0 "Банді Розбитих Сердець потрібно трохи більше, ніж просто запал. Давайте додамо трохи ресурсів у космічний суп!"

rob_crimson_amy:0 "Хтось Тут Починає Щось..."
rob_crimson_amy_desc:0 "Broken Hearts можуть поділитися бойовим досвідом і старими історіями з нашими роботами. Це дозволить... ну, бити краще. Або щось на кшталт цього."

rob_the_big_sister:0 "Нова Старша Сестра Докі"
rob_the_big_sister_desc:0 "§PЯ дуже в неї вірю. :D§!"

rob_queen_of_colorado:0 "Біллі Джин — Рейдерська Королева"
rob_queen_of_colorado_desc:0 "§PУ Біллі є бачення. І я хочу побачити, як воно стане реальністю!§!"

# Cosmetic Tags — Косметичні назви фракцій

