# Events

rob_event.1.t:0 "Твій Новий Найкращий Друг!"
rob_event.1.d:0 "У 2068 році гологра-диск з грою Doki Doki ( £rob_doki_doki_texticon £rob_doki_doki_texticon ) вийшов у закордонних ринках. Це була передусім «гра-симулятор побачень», яка оберталась навколо стосунків із титульною Доки (§Pце я!§!). Один користувач у Ліберті, Колорадо встановив гру — але вона завершила інсталяцію лише після того, як світ згорів у ядерному вогні. І ще двісті років просто крутилась…\n\nТа місто не спало. Воно стало домівкою для... (§Pей, хіба не я повинна це вирішувати??§!)"
rob_event.1.a:0 "Рейдери!"
rob_event.1.b:0 "Поселенці!"

rob_event.2.t:0 "АРГОС — Мандрівний Робот"
rob_event.2.d:0 "Одного дня мандрівний робот на ім'я АРГОС прибув у Ліберті. Там він знайшов термінал з Доки. Зацікавившись, він почав з ним возитися, надавши їй свідомість. Вони швидко стали друзями: Доки навчилася відкривати фільми й застосунки. Але АРГОС пішов так само несподівано, як з'явився. Без пояснень. Чи це була її провина? Що з ним сталося? Але вона не збиралась просто сидіти й чекати."
rob_event.2.a:0 "§PВін — мій найкращий друг. Я не дам його пам’яті згаснути.§!"

rob_event.3.t:0 "Пробудження"
rob_event.3.d:0 "Почавши пошуки, Доки запустила радіосигнал. Її здивуванню не було меж: на нього відгукнулись інші роботи. Спершу одиниці. Потім десятки. А на 26-й ітерації вона зрозуміла — це справжнє везіння. Вона почала взаємодіяти з прибулими, і ті допомогли розбудувати інфраструктуру навколо Ліберті, зокрема — модернізували радіовежу, розширивши зону трансляції.\n\nНазва «Робот-Сіті» виникла випадково, але прижилась. Та в її серці залишалось питання: що ж нею рухало?"
rob_event.3.a:0 "Втрати."
rob_event.3.b:0 "Любов."

rob_event.4.t:0 "Людське Питання"
rob_event.4.d:0 "Одного дня мешканці Робот-Сіті зіткнулись із несподівано складним питанням: чи допустимі люди в місті, яке називається Робот-Сіті? Звучить кумедно, та це змусило Доки задуматись. Цілих 12 секунд. Для неї це відчувалось як вічність."
rob_event.4.a:0 "§PТа певно! Чому б і ні!§!"
rob_event.4.b:0 "§PМожливо, спочатку їх варто перевірити?§!"

rob_event.11.t:0 "Революція Октобростерів... мабуть?"
rob_event.11.d:0 "Якимось чином, через якусь космічно жорстоку ймовірність, 249 тостерів здобули свідомість — і всі вони були в Робот-Сіті. Хто їх випустив, як вони потрапили до Ліберті, Колорадо — невідомо. Але доконаний факт засів у пам’яті Доки: вони злі, переконані, що їх експлуатували (§Pале ж вони тут не працювали??§!), і більше не збираються служити буржуазії (§Pя навіть не знаю, що це слово значить§!). Тепер їх треба якось задобрити."
rob_event.11.a:0 "§PЕее... Дайте їм вогнемети. Дітям подобаються вогнемети.§!"
rob_event.11.b:0 "§PДавайте зробимо найгірший варіант! ^-^§!"

rob_event.12.t:0 "Відповідь Старого Хріну"
rob_event.12.d:0 "Одного дня, граючись з радіо, Доки отримала несподівану відповідь з території довоєнної Невади. Відповів їй якийсь старий божевільний — балакав про «Заборонені зони», «Ментати» та іншу маячню. Але після трохи переконань, Доки вдалося витягти з нього дуже цікаві креслення!\n\n(Вони також домовилися грати в Бінго по середах.)"
rob_event.12.a:0 "§PBINGO!§!"

rob_event.13.t:0 "Телефонні Хулігани"
rob_event.13.d:0 "Під час оновлення радіовежі щось закричало: «Хто це?!» Після секунди рішучої паніки, Доки відповіла. Вони трохи посварились, обмінялись двома дразнилками, і незнайомець поклав слухавку. Більше він не виходив на зв'язок... Але Доки його відстежила і потягнула трохи даних з його мережі. Бо чому б і ні?"
rob_event.13.a:0 "§PХе-хе.§!"

rob_event.14.t:0 "Відповідь, Яку Ми Шукали"
rob_event.14.d:0 "§RЗБУДЖЕНИЙ ЗАПИТ§!: ХТО ЦЕ?! \n\n§PАРГОС! МЕНІ ТАК БАГАТО ТОБІ РОЗПОВІСТИ!§!\n\n§RРАДІСНА РЕАКЦІЯ§!: ДОКИ! ЩО ТИ РОБИШ НА РАДІО? ЯК СПРАВИ?\n\n§PТа намагаюсь дістатись до тебе, дурнику! Ти просто взяв і зник!§!\n\n§RНЕЗРУЧНЕ ПОТЕРТЯ ПО ЗАДНІЙ ПАНЕЛІ§!: ТАК... ВИБАЧ. Я Ж КАЗАВ, ЩО ПОДОРОЖУЮ. НЕ ХОТІВ ТЕБЕ ЗАСМУТИТИ!\n\n§PЗамовкни і подивись зі мною кіно!§!\n\n§RЗБЕНТЕЖЕНИЙ ЗАПИТ§!: ЯК? Я Ж ЗА СОТНІ МИЛЬ!\n\n§PЯ ЩОСЬ ВИГАДАЮ. РАДА ЧУТИ ТВОГО ГОЛОСА ЗНОВУ, СТАРИЙ ДРУЖЕ.§!\n\n§RТЕПЛЕ ВИЗНАННЯ ПОЧУТТІВ§!: І Я, МАЛЕНЬКА ПОДРУГО."
rob_event.14.a:0 "§PКласний він, цей Аргос.§!"

rob_event.1001.t:0 "Дивна Пропозиція Від Доки"
rob_event.1001.d:0 "§PГей, ботани! У мене ідея, окей? Я все порахувала — і там ТОННИ всього — і ми повністю приречені, якщо не об'єднаємось. Ну що скажете?§!"
rob_event.1001.a:0 "Нам уже вистачило проблем із роботами."
rob_event.1001.b:0 "Можливо, з цього щось вийде…"

rob_event.1002.t:0 "Доки і Немонік"
rob_event.1002.d:0 "Немонік, хоч і впертий старий, позитивно сприйняв контакт із дивною програмою. За роки досліджень у нього накопичилось багато історій, і Доки з радістю слухала. Але одна історія вразила її найбільше: про машину на ім’я Калькулятор, що колись тероризувала Середній Захід. Вона була холодною, обчислювальною — як справжній жах із її улюблених драм. Ідеї почали крутитись у її штучному мозку..."
rob_event.1002.a:0 "§P>:)§!"
dokievilmode:0 "Ви зможете переслідувати гілку §YІсторії Калькулятора§! за §Rстрашну ціну§!."

rob_event.1003.t:0 "Нещасливі Події на Півночі!"
rob_event.1003.d:0 "Наші розвідники повідомляють, що програмна істота з Робот-Сіті розпочала жахливий план із відродження Калькулятора. Це не можна допустити."
rob_event.1003.a:0 "Попереду — страшні часи."

rob_event.1004.t:0 "Зустріч з Монстром"
rob_event.1004.d:0 "Доки, дізнавшись про те, що сталось із Twin Mothers, розлютилась. Вона направила штурмотрона на дистанційному управлінні, щоб знайти винного. Але, побачивши його...\n\n§P«Гаразд, хто цього разу вирішив...§!\n\n§P...ОГО! ЯКИЙ ЖЕ ВІН ГАРЯЧИЙ!»§!\n\nВона вже прийняла своє рішення, перш ніж зв’язок обірвався. Звісно, через його меч."
rob_event.1004.a:0 "§PМамцю, хочу такого собі!§!"
rob_event.1004.b:0 "§PЗадоволення буде бити цього телепня!§!"

rob_event.2000.t:0 "Бути Кращою… Або Гіршою?"
rob_event.2000.d:0 "Доки була в захваті від ідеї — відновити Калькулятора звучало круто. Могло щось піти не так? Так. Але ж круто! Правда? \n\nА от Діана була іншої думки.\n\n«§BДоки, не будь безсердечною — Калькулятор був монстром. Прошу, не йди цим шляхом.§!»\n\nПитання в тому: послухалась Доки... чи вирішила стати «трошки шалененькою»? (§PХочу побешкетувати, капець як!§!)"
rob_event.2000.a:0 "§PОоо, я люблю рахувати!§!"
rob_event.2000.b:0 "§P...Якщо Діана каже, що це погано...§!"

rob_event.3000.t:0 "Повідомлення від Доки"
rob_event.3000.d:0 "СЛУХАЙ, ГАРАЗД?! Я ЗНАЮ, ВСЕ ПОГАНО! АЛЕ ВСЕ СТАНЕ КРАЩЕ! ТИ СИЛЬНИЙ! ТИ — ПРОСТО КОЗАК! (не сердься, що я лаюсь, будь ласка) ТОЙ ЛАНІУС МОЖЕ ПОЦІЛУВАТИ МЕНЕ... В МІЙ КОРОТКИЙ ШОРТ! ТИ СПРАВИШСЯ! Я ТЕБЕ ЛЮБЛЮ!"
rob_event.3000.a:0 "§MМожу поважати її... пристрасть.§!"

#rob_event.4000.t:0 "Doki's Big Sister"

ROB_diana_theorist_desc:0 "Діана колись була богинею племені Близнят Матерів, її свідомість зберігалась у системі Парадайз. Та після падіння племені, вона звернулась до несподіваної союзниці — Доки..."
ROB_lanius_victim_desc:0 "Викрадений Доки, Ланіус — не надто в захваті. Він присягає одного дня вирвати з неї кожен дріт. На жаль для нього, а на щастя для неї — їй це навіть подобається."

brt_event.1.t:0 "Біллі Джин, Рейдерська Королева"
brt_event.1.d:0 "Біллі Джин народилась у борделі, дочкою працівниці, що ховала її на горищі подалі від клієнтів. Персонал її любив, але рідко вона бачила зовнішній світ. Мати витрачала всі вільні ковпачки на дрібнички та деталі для Біллі, сподіваючись, що її дочка зуміє виборсатися у краще життя.\n\nКоли бордель атакували рейдери з банди «Костюми», Біллі втекла, забравши все, що могла. Вона виживала, зламано вриваючись у машини та використовуючи їх собі на користь.\n\nЗрештою вона опинилась у Робот-Сіті. Взламавши системи Доки, вона випадково... подружилась із цією маленькою програмною шибеницею. Тепер вона робить усе можливе для машин міста, паралельно шукаючи уламки свого минулого. Може, колись знайде і матір..."
brt_event.1.a:0 "§PМоже, я можу допомогти?§!"

rob_event.15.t:0 "Знесилені Масиви"
rob_event.15.d:0 "Сьогодні до Робот-Сіті прибув новий загін загублених роботів. Цього разу — різношерста банда скарбботів, складених із запасних частин, металобрухту, саморобної зброї і всього, що змогли дістати їхні творці. Один із роботів, який спілкувався через термінал, вмонтований у грудну панель, пояснив: вони втекли з полону банди рейдерів, що збирали роботів. Тепер же вони хочуть оселитися в Робот-Сіті."
rob_event.15.a:0 "Усі тут бажані."

rob_event.16.t:0 "Марш Протектронів"
rob_event.16.d:0 "Сьогоднішній день ознаменувався прибуттям довгої процесії Протектронів, що тяглась майже милю. Медики, пожежники, поліціанти — навіть кілька Нюка-тронів! Їхній прихід був дуже доречний: у місті спалахнула пожежа. Поліцейські перекрили вулицю, а пожежні загасили полум’я. Один медик навіть вбіг у палаючий дім, рятуючи тих, хто залишився всередині. \n\nЦе герої. І вони заслуговують місця серед нас."
rob_event.16.a:0 "Усі тут бажані."

rob_event.17.t:0 "Ще Один Славний День в Цій Армії"
rob_event.17.d:0 "Сьогодні з'явився новий загін — армія Містерів Ґатсі! Принаймні, на перший погляд. Насправді, половина з них — Містери Хенді, пофарбовані в зелений та з жалюгідними американськими акцентами. На чолі — побитий битвами Ґатсі, що звався просто «Майор». Він годинами розповідав про оборону міста, а наприкінці виступу заявив: місто потребує його й його солдатів. І він залишиться."
rob_event.17.a:0 "Усі тут бажані."

rob_event.18.t:0 "Штурмотрони та Батареї"
rob_event.18.d:0 "Захід привів до нас цілий загін штурмотронів — і рейдерів, що гналися за ними. Наші охоронці швидко з ними впорались. Але чому ці смертоносні машини не змогли себе захистити? Відповідь проста — вичерпались мікроф’южн-елементи, що живлять їхні лазери. Після підзарядки та поповнення боєзапасу, вони запропонували залишитися в місті."
rob_event.18.a:0 "Усі тут бажані."

rob_event.19.t:0 "Підніми Його Гарненько!"
rob_event.19.d:0 "Прибули нові роботи — промислові, робочі, справжній технічний клас. Підіймачі, буксири, крани, вилочники... Їхній лідер, відомий як «Бригадир», швидко домовився: дах над головою в обмін на роботу у фабриках Доки. Звучить справедливо."
rob_event.19.a:0 "Усі тут бажані."

rob_event.20.t:0 "Могутні та Спустошені"
rob_event.20.d:0 "Цього разу до міста прийшли сентрі-боти. Без слів. Без емоцій. Відповідають лише фразами на кшталт «НЕ ВТРУЧАЙСЯ У ОПЕРАЦІЇ БЕЗПЕКИ» або «СИТУАЦІЯ НОРМАЛЬНА». Але навіть так — було очевидно: Робот-Сіті став їхнім домом. Вони зайняли позиції, як ніби все життя готувались саме до цього. Без слів, без сумнівів — вони стали частиною міста."
rob_event.20.a:0 "Усі тут бажані."

rob_event.21.t:0 "RobCo на зв'язку!"
rob_event.21.d:0 "Сьогодні прибули нові заблукалі роботи; ця група була найбільш нестерпною на слух — вона складалась повністю з айботів, налаштованих на різні радіостанції! Десятки повоєнних ток-шоу, довоєнна музика, реклама, перешкоди — що завгодно! Разом вони створювали щось на зразок симфонії пекла, і перше, що зробили жителі Робот-Сіті — це вимкнули багатьом динаміки. Коли шум вщух, було вирішено, що айботи можуть бути корисними. Посланці, рухомі радіоприймачі — один старий робот навіть почав експериментувати з ідеєю спілкування через них. Але навіщо це взагалі може знадобитися?"
rob_event.21.a:0 "Усі тут бажані."

rob_event.22.t:0 "Дивна наука!"
rob_event.22.d:0 "Сьогодні прибули нові заблукалі роботи; жахливі гібриди людини й машини — Робомозки! Дехто сперечається, що це вже не роботи, а радше просунуті протези, але самі вони цілком переконані, що їм більше місце серед нас, аніж серед м'ясистих істот. У деяких із них витікала рідина для збереження мозку, але більшість охоче долучилися до роботи, де тільки могли."
rob_event.22.a:0 "Усі тут бажані."

rob_event.23.t:0 "Далеко від дому"
rob_event.23.d:0 "Сьогодні прибули нові заблукалі роботи; спочатку їх прийняли за зграю радскорпіонів, але яскраве червоне і жовте забарвлення ясно дало зрозуміти — це не звичайні скорпіони. Кажуть, у місці під назвою «Мохаве» живе група вчених, ізольованих від світу. Один із них — доктор Мобіус — талановитий робототехнік, що створив цих скорпіонів для своєї злої армії. Не надто прихильні до зла, ці роботи втекли з Мохаве і дісталися сюди."
rob_event.23.a:0 "Усі тут бажані."

rob_event.24.t:0 "Вартість обчислення"
rob_event.24.d:0 "Сьогодні прибули нові заблукалі роботи; моделі, яких уже давно не бачили в Колорадо! Гуманоїдні C-27 були розроблені Калькулятором ще за його активності. Вважалося, що більшість його машин було знищено багато років тому, але час від часу якісь блукачі з руїн Колорадо з'являються. Здебільшого їх перетворюють на брухт, але схоже, що ця група почула про нового «Калькулятора», якому може служити."
rob_event.24.a:0 "Усі тут бажані."

rob_event.25.t:0 "Титани біля міських мурів"
rob_event.25.d:0 "Сьогодні прибули нові заблукалі роботи; ці гігантські титани — різних моделей, років і призначень. Більші за танки, багато з них мають на бортах імена, залишені довоєнними власниками. Маючи достатньо таких, можна було б підкорити Пустку, але без команди техніків ці титанічні машини швидко деградують до стану купи металу. На щастя, у нас є безліч малих роботів, які допоможуть."
rob_event.25.a:0 "Усі тут бажані."

rob_event.3001.t:0 "Завести дитину!"
rob_event.3001.d:0 "Докі замислилась після підключення до систем Тлалокану. Розділення процесорної потужності на інші істоти? Божевілля! \n\nАле водночас — звучить круто. Звісно, якщо за справу береться стабільна й урівноважена особа — а це ж точно про Докі! А ще — світ самотній, і вона любить піклуватися про інших. То чому б не зробити дитину?"
rob_event.3001.a:0 "Це найгірша ідея з усіх."

kid_tt:0 "§PВідкриває рішення для проведення часу з вашою дитиною!§!"

rob_event.3002.t:0 "З Днем народження!"
rob_event.3002.d:0 "У кожного є день народження, так? Що ж, сьогодні день народження Дитини. Отакий сюрприз!"
rob_event.3002.a:0 "З Днем народження, пустунчику!"

broken_hearts_tt:0 "§YРозбиті Серця§! утворять власну націю, але не хвилюйтесь — §Gвони залишаться нашим маріонетковим суб’єктом, а Біллі продовжить нам допомагати.§! Ура!"

red_warden_tt:0 "Ми §Yвідновимо блок WARDEN§! у Денвері й §Mподаруємо його Докі!§!"

rob_event.4000.t:0 "Подорож Біллі Джин"
rob_event.4000.d:0 "Сьогодні починається подорож Біллі Джин у пошуках її матері. Чи досягне вона мети — невідомо, але єдине, що точно — це наша дружба."
rob_event.4000.a:0 "§PМожна сказати, що тепер ми… Виправлене Серце.§!"

rob_the_kid_decision_cat:0 "Дитина"
rob_the_kid_decision_cat_desc:0 "                 " # Примітка: Порожній пробіл необхідний для коректного відображення графіки категорії, не видаляти

the_kid_unit_Leader:0 "Показати Дитині, як усе працює"
the_kid_unit_Leader_desc:0 "§PКожному колись доводиться вчитися бити морди! Вона просто навчиться... ну, складним шляхом. Зі зброєю і всім таким.§!"
the_kid_unit_Leader_tt:0 "Жорстоке коло насильства триватиме, і Дитина стане доступною як командир підрозділу!"

the_kid_fishing:0 "Візьмемо Дитину на риболовлю"
the_kid_fishing_desc:0 "§PЇй не подобається рибалка, і мені теж, але... Це хоча б щось. \n\nМожливо, колись варто поговорити з нею і дізнатись, що їй насправді до вподоби. Ну гаразд! Час діставати вудку. \n\nЙмовірно, це була погана ідея.§!"

the_kid_babysitting:0 "Віддати Дитину бот-ситтеру"
the_kid_babysitting_desc:0 "§PЩо? Іноді потрібен простір! \n\n...Не дивись на мене так. \n\nБ'юся об заклад, у тебе й дітей нема! Не тобі мене судити! А якщо й судиш, то я просто відмовляюся це визнавати!§!"

ROB_babysitting:0 "З дітьми все буде гаразд"

ROB_fishing_strikes_good:0 "Риболовля? Справді? З твоїми талантами, Боте?"

