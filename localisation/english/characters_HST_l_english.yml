l_english:
HST_GOODWIN_NAME: "Вільям Ґудвін"
HST_GOODWIN_DESC: "Дехто з членів Історичного Товариства вивчав фермерство. Хтось – як здирати шкіру з тварин. А Ґудвін навчився грати на скрипці – звуці, якого не чули в Дакоті понад сто років. Музика Ґудвіна стала розрадою для всього Півночі, нагадуванням про те, чому його народ вивчає минуле. Не лише щоб пам’ятати, як вижити. А й щоб пам’ятати, як жити."

