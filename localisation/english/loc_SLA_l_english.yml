  l_english:
  #### Focuses
Marina_DESC: "Відкрита прихильниця ідеалів, які представляла Вільна Держава, Марина очолила новий (чи, радше, старий) рух, що зародився серед Слаґів. Коли стало очевидно, що відродження Вільних Держав – лише питання часу, Веґейр мирно передав їй лідерство, сказавши, що вже надто старий для цього."

SLA_the_sealing: "Запечатування"
SLA_the_sealing_desc: "Ми – нащадки міліції, яка виступала проти уряду США ще до падіння бомб. На щастя, сенатор, що підтримував нашу справу, попередив нас про загрозу ядерного знищення, давши нам час на спорудження сховищ. Ми зачиняли за собою двері... і чекали в темряві, аби знову вийти на світло."

SLA_ghosts_and_a_wanderer: "Примари та Мандрівник"
SLA_ghosts_and_a_wanderer_desc: "Наша популяція зросла понад можливості підземного утримання. Ми збудували ферму на поверхні й відлякували зайд, видаючи наших охоронців за 'примар' і розкидаючи бутафорські моторошні декорації.\nБезстрашного мандрівника це не зупинило, і його хоробрість допомогла нам знайти шлях у майбутнє."

SLA_as_above_so_below: "Як Зверху, так і Знизу"
SLA_as_above_so_below_desc: "Завдяки мандрівнику ми вступили в довгу та плідну співпрацю з містом Модок: ми постачаємо воду їхнім фермам і технічні знання їхньому народу, а вони дають нам їжу, ліки й обладнання – на рівних умовах."

SLA_the_dark: "Підземелля"
SLA_the_dark_desc: "Хоча технічно ми можемо вільно пересуватись поверхнею, більшість із нас досі боїться її, не кажучи вже про фізичну шкоду від сонячного світла. Але наші зношені машини потребують запчастин, яких Модок, найімовірніше, не має, а запаси у нас вкрай мізерні."

SLA_expand_tunnel_network: "Розширити Мережу Тунелів"
SLA_expand_tunnel_network_desc: "Оскільки переселення більшості нашого народу на поверхню наразі неможливе, альтернативою є розширення підземного простору. Це й безпечніше, ніж поверхня. Часом ми натикаємось на кротокротів, але за роки навчилися з ними справлятись."

SLA_tunnel_communication: "Тунельний Зв'язок"
SLA_tunnel_communication_desc: "За десятиліття наші тунелі стали досить розлогими. Ми виявили, що певні звуки дуже добре поширюються в тунелях. Ми розробили систему передавання повідомлень такими звуками. І хоча на поверхні вона не так ефективна – жоден інший народ не зрозуміє, про що мова. Що може стати в пригоді..."

SLA_reorganizing_stockpiles: "Реорганізація Складів"
SLA_reorganizing_stockpiles_desc: "Ресурси розпорошені по всій системі тунелів. Потрібно перевірити всі запаси – напевно знайдеться чимало забутих речей у давно покинутих коморах."

SLA_making_our_own: "Власне Виробництво"
SLA_making_our_own_desc: "Хоча пошук готового спорядження допоміг нам на перших порах – цього недостатньо. Ми не можемо вічно покладатись на Модок. Потрібно самим почати виробляти все необхідне для виживання."

SLA_support_bonus: "Не Лише Зброя"
SLA_support_bonus_desc: "Зброя – це добре. Але не менш важливими є дрібниці: фляги, міцний одяг, аптечки, інструменти, спорядження для табору... До цього ми їх знаходили, а тепер настав час виготовляти."

SLA_armor_bonus: "Добра Оборона"
SLA_armor_bonus_desc: "Нас мало. Ми не можемо дозволити собі великі втрати. Все, що зупинить кулю, спис або укуси занадто великого ящера – рятує життя."

SLA_vc_energy_weapons: "Зброя Світла"
SLA_vc_energy_weapons_desc: "Світло для нас болюче, тому така зброя – неприємна для наших бійців. Але що може краще змусити ворога відчути те, що ми відчуваємо під прямим сонцем? Хоч і недовго – доки не перетвориться на попіл."

SLA_repair_the_generator: "Ремонт Генератора"
SLA_repair_the_generator_desc: "Наш генератор ледве працює вже багато років. Настав час використати запчастини зі складу, щоб остаточно його полагодити."

SLA_vt_fusion_generator: "Термоядерний Генератор Vault-Tec"
SLA_vt_fusion_generator_desc: "Наші нові союзники надіслали нам фірмовий термоядерний генератор Vault-Tec, який, на диво, просто лежав у них без діла. Час замінити наш кустарний агрегат."

SLA_find_new_water_sources: "Нові Фільтри для Води"
SLA_find_new_water_sources_desc: "Наша система водоочистки вже давно працює не на повну. Вода – ще придатна для поливу, але не питна. З новими запчастинами можна відновити її до належного рівня."

SLA_mushroom_farms: "Підземні Ферми"
SLA_mushroom_farms_desc: "Хоч старе консервоване харчування протрималось довго (я ще недавно з’їв яйце з консерви Yum Yum – непогано!), воно ж не вічне. Поки що рятують кротокроти й гриби, але справжнє вирощування можливе лише тепер. Час насадити грибів!"

SLA_acquire_mining_equipment: "Добути Шахтне Обладнання"
SLA_acquire_mining_equipment_desc: "Ми стали добрими копачами, але наші машини зламались давним-давно. Доводиться працювати вручну. Настав час знову автоматизувати працю."

SLA_living_quarters: "Нормальні Житлові Умови"
SLA_living_quarters_desc: "Попри розгалуженість тунелів – житлового простору мало. Ліжок нема. Але з новою енергією та постачанням ми це змінимо."

SLA_consumer_goods: "Краще Життя"
SLA_consumer_goods_desc: "Неймовірно, як свіжі фрукти піднімають настрій. Навіть якщо це якісь дивні мутфрукти. Але ці та інші розкоші вже істотно покращили мораль і продуктивність."

SLA_dedicated_production: "Повноцінне Виробництво"
SLA_dedicated_production_desc: "Народ ситий, відпочив, і тепер хоче працювати. Час кувати інструменти, зброю – і перемагати."

SLA_access_the_terminals: "Доступ до Терміналів"
SLA_access_the_terminals_desc: "Нарешті ми можемо дістатись до комп’ютерів, що дрімали роками. Вони повні знань і корисної інформації. Наші предки справді підготувались до будь-чого – слід це вивчити якомога швидше."

SLA_weapon_plans: "«Зброя й Боєприпаси»: Повне Зібрання"
SLA_weapon_plans_desc: "Нових відкриттів не було, але ми навчилися виготовляти наявну зброю якісніше й ефективніше."

SLA_electronic_plans: "«Електроніка для Всіх» від Dean’s (Редакція RobCo Terminal)"
SLA_electronic_plans_desc: "Диск містить базовий курс електроніки. Вступна нотатка каже, що він призначений для кожного 'юного електрика'. Виявляється, все не так уже й складно."

SLA_military_plans: "Підручник Спецоперацій"
SLA_military_plans_desc: "Перші записи – дивною мовою. Далі – ломаною англійською. Дивно, з ким же контактували наші предки? Утім, корисної інформації про тактику – вдосталь."

SLA_factory_plans: "Річні Огляди Chryslus Motors (2065–75)"
SLA_factory_plans_desc: "Ми не чекали чогось особливого – і були здивовані. Хоча більшість – це реклама, дехто з нас побачив, як покращити наше виробництво."

SLA_knowledge_databanks: "Банки Знань"
SLA_knowledge_databanks_desc: "Матеріалів дуже багато. Якщо систематизуємо – отримаємо цінний ресурс для нинішніх і майбутніх поколінь."
SLA_knowledge_databanks_tt: "Об’єднує §YВідновлену Систему Терміналів§!, §YОрганізацію До-Воєнного Виробництва§! і §YЕфективні Дизайни Зброї§! в один національний дух і надає:\nШвидкість дослідження: §G+2.00%§!\nВиробнича потужність фабрик: §G+5.00%§!\nШвидкість дослідження спецпризначенців: §G+5%§!"

SLA_other_mushrooms: "Інші Види Грибів"
SLA_other_mushrooms_desc: "Після успіху наших підземних ферм ми задумалися: а чи не вирощувати й інші види грибів у більших масштабах? Ми давно знали, що деякі з них мають властивості, схожі на довоєнні хімікати, які досі зберігаємо. Якщо ми зможемо виробляти їх самостійно – це буде цінним ресурсом як для торгівлі, так і для... відпочинку."

SLA_the_old_symbols: "Старі Символи"
SLA_the_old_symbols_desc: "Зірка в кайданах – але кайдани зламані. Ми використовували цей символ скільки себе пам’ятаємо. Він був на одязі й інструментах ще до Запечатування. На коробках і документах. І нещодавно ми підняли його як прапор, коли знову вийшли на поверхню. Але що він означає?"

SLA_questions_about_our_past: "Питання до Минулого"
SLA_questions_about_our_past_desc: "Ми знайшли записи, де вказано, що ми були частиною групи, яка називалася «Вільні Штати». Наших предків переслідував уряд США. Нас називали дисидентами, зрадниками.\nАле чи залишаємося ми тими самими людьми? Уряду вже немає. І причин для існування Вільних Штатів – теж. А може, все ж є?"

SLA_a_look_back_and_step_forward: "Погляд Назад – Крок Уперед"
SLA_a_look_back_and_step_forward_desc: "Хоча установи, що спричинили конфлікт, давно зникли, ідеали Вільних Штатів досі цінні. Місце для народу, вільне від гніту. Це мета, варта зусиль."

SLA_gone_with_the_blastwave: "Змито Вибуховою Хвилею"
SLA_gone_with_the_blastwave_desc: "Минуле давно зникло. Старі символи більше нічого не означають. Ми пройшли весь цей шлях без довоєнних ідеологій. Так, ми носимо зірку з розірваними кайданами – але тепер це наш символ, а не чужий."

# Ідеї

sla_black_sea_of_nothingness: "Чорне Море Порожнечі"
sla_black_sea_of_nothingness_desc: "Світ нагорі – величезний і страшний. Чорне море порожнечі сковує розум і змушує прагнути знову сховатись у землі.\nЄдине гірше за це – те, що зветься «сонцем». Воно болить. І тілу, і душі."

idea_sla_cannibalism: "Канібалізм"
idea_sla_cannibalism_desc: "Брак їжі під час Темних Часів змусив нас робити те, про що ми не любимо згадувати."

idea_sla_drug_addicts: "Залежність від Хімікатів"
idea_sla_drug_addicts_desc: "Це полегшувало життя в Темні Часи, але тепер більшість нашого народу – залежні. Це серйозно шкодить продуктивності."

idea_sla_resource_scarcity_1: "Критична Нестача Ресурсів"
idea_sla_resource_scarcity_2: "Серйозна Нестача Ресурсів"
idea_sla_resource_scarcity_3: "Помірна Нестача Ресурсів"
idea_sla_resource_scarcity_4: "Мінімальна Нестача Ресурсів"
idea_sla_resource_scarcity_5: "Повні Запаси"

idea_tunnel_communication: "Тунельний Зв'язок"
idea_tunnel_communication_LAR: "Тунельний Зв'язок"
idea_mining_equipment: "Шахтне Обладнання"
idea_adequate_living_quarters: "Придатні для Життя Оселі"
idea_subterranean_farms: "Підземні Ферми"

idea_sla_weapon_plans: "Ефективні Дизайни Зброї"
idea_sla_factory_plans: "Організація До-Воєнного Виробництва"
idea_sla_electronic_plans: "Відновлена Система Терміналів"

idea_sla_traitors_or_revolutionaries: "Зрадники чи Революціонери?"
idea_sla_traitors_or_revolutionaries_desc: "Уряд назвав нас зрадниками. Дехто – революціонерами. Але чи має це значення сьогодні?"

idea_sla_a_free_state: "Вільна Держава"
idea_sla_a_new_path: "Шлях у 200 Років"
idea_sla_a_new_path_desc: "Що б не було в нашому минулому. Що б не чекало попереду. Ми – Слаґи. І ми ними залишимось."

idea_sla_knowledge_databanks: "Банки Знань"
idea_sla_help_modoc: "Плідне Співробітництво"
idea_sla_fuck_modoc: "Фальшивий Друг"
idea_sla_modoc: "Бліді й Не Порівняти"
idea_sla_modoc_desc: "Наші щедрі бліді друзі з Ферми Примар передали нам знання з агрономії, що можуть зекономити сотні робочих годин."

idea_sla_modoc_get_fucked: "Загиблі Урожаї"
idea_sla_modoc_get_fucked_desc: "Засуха вразила землі Модока. Наш урожай загинув. Скоро загинуть і наші родини..."

idea_sla_cache_of_loot: "Схованка З Добром"

