# Рішення

SLA_spare_part_hunt: "Пошук Запасних Частин"
SLA_spare_part_hunt_desc: "Багато специфічних деталей ми маємо знайти, щоби відновити нашу стару техніку. Але знайти їх локально – малоймовірно. Треба шукати в інших місцях."

SLA_hire_traders: "Найняти Караван у Модоку для Пошуку Частин"
SLA_hire_traders_desc: "Каравани приходять до Модока з усіх країв. Можливо, хтось із них натрапить на потрібні нам частини."

#### Events

nf_slags.1.t: "Наслідки Запечатування"
nf_slags.1.d: "Відтоді як ми замкнули свої родини у Великому Підземеллі, щоб урятувати їх від зовнішнього світу, наше сприйняття реальності змінилося і викривилось. Наші тіла зблідли, а в очах з’явилася темрява. Чи були ми прокляті? Чи ми самі накликали це на себе? Навіть після того як ми розпечатали входи, щоб боротися з перенаселенням, ми так і не змогли повернутися до звичайного життя. Навіть нічне небо засліплює наших синів і дочок. Колись ми сиділи в печерах і мріяли про відчуття сонця на блідих руках, а тепер боїмося цієї цікавості, бо знаємо – вона може вбити нас..."
nf_slags.1.a: "Уперед – до сонячного світла!"
nf_slags.1.b: "Нам до вподоби тінь."

nf_slags.2.t: "Спогади про Свободу"
nf_slags.2.d: "Наші предки були членами ополчення, що волало про свободу. Ми майже не маємо згадок чи записів про те, ким були і звідки прийшли, але наша молодь усе ще зберігає гордість за це невідоме минуле. Вийшовши з підземелля, куди свого часу втекли наші пращури, ми опинилися в новому світі. Першим нашим кроком стало створення ферми посеред ночі, аби вирощувати їжу. Але невдовзі усе пішло шкереберть.\n\nПоселенці з найближчого міста – Модок – помітили ферму і почали досліджувати територію, зрештою вони почали збирати наш урожай. Щоб відігнати цих бродяг, ми вигадали хитрість: розмістили лякала, схожі на трупи. План вдався... навіть занадто. Вони прийшли шукати вбивць-привидів, а знайшли – нас. На щастя, добрий самарянин втрутився, і ми уникли безглуздої різанини. Все було пояснено, конфлікт залагоджено. Місто Модок і нині наш сусід з півдня. Ми живемо у тимчасовій гармонії... або принаймні нам так здається."
nf_slags.2.a: "Ми продовжуємо пам’ять наших предків!"
nf_slags.2.b: "Пам’ять про доброго самарянина живе в нас."
nf_slags.2.c: "У дружбі ми знаходимо процвітання."

nf_slags.3.t: "Навчаємо Модок"
nf_slags.3.d: "Містечко на південь від нас, Модок, завжди було доволі відсталим. Навіть після десятиліть дружби вони не вийшли за межі хатинок і сараїв. Наші партизани вважають, що буде мудрим кроком навчити їх сучасним методам сільського господарства та будівництва. Можливо, вони теж щось дадуть натомість. Хочеться вірити, що це буде в дусі мандрівника, який колись урятував нас."
nf_slags.3.a: "Аутсайдери заслуговують на нашу допомогу."
nf_slags.3.b: "Забудьте про дружбу, у нас свої проблеми."

nf_slags.4.t: "Запит на Запасні Частини до [VLT.GetName]"
nf_slags.4.d: "На щастя, ми вже вирішили внутрішні проблеми, що становили загрозу. Але залишилося безліч дрібниць, які роками відкладалися. Більшість ламп давно перегоріли, вентиляція – майже ніяка, а санітарія вимагає нагального оновлення.\nЦі речі не мають бути проблемою для технологічно розвиненої держави на кшталт [VLT.GetName]."
nf_slags.4.a: "Нарешті все буде полагоджено – назавжди!"

