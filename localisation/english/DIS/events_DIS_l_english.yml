l_english:
nf_dis.1.t:0 "Справжні Віруючі"
nf_dis.1.d:0 "Жертви необхідні, якщо ти прагнеш дотримуватись своїх переконань.\nКолись Плем’я Болотників і [DIS.GetName] були єдиним народом. Проте останніми роками переконання лідерів племені Болотників почали змінюватися після впливу нової групи, відомої як Коралевий Суд. Вони почали схиляти племена Болотників до власної волі.\nОдним з головних ідеалів племені Болотників є віра у фігуру Рудого Чоловіка, давнього героя, який допоміг вижити мешканцям західного Орегону у перші десятиліття після Великої Війни. Нове керівництво Болотників хоче нав’язати думку, що Рудий Чоловік не був людиною, а... мирлорком! Це зовсім не так – слід шанувати його дії, а не його походження.\nПророк Вадим був одним з перших, хто почав протестувати проти нового вчення Болотників. Хто ще виступив проти них?"
nf_dis.1.a:0 "Кидальники сітей"
nf_dis.1.b:0 "Збирачі коралів"
nf_dis.1.c:0 "Фермери мутплодів"

nf_dis.2.t:0 "Довга дорога на південь"
nf_dis.2.d:0 "Зрештою, наші протести стали надто гучними, щоб плем’я Болотників могло їх ігнорувати.\nХоча деякі чекали на страту, Коралевий Суд виніс легший вирок – вигнання.\nНам довелося вирушити на південь, старим Шосе №5, аж поки ми не дісталися рейдерського міста [150.GetName]. Село виявилось під контролем Костоломів – групи канібалів-рейдерів зі східної вершини Даймонд-Пік. Невдовзі почалась Битва за Араґо – коротка сутичка, прелюдія до майбутніх конфліктів.\nНаскільки милосердними ми були після бою за Араґо?"
nf_dis.2.a:0 "Ми навернули кого змогли. Інші – геть."
nf_dis.2.b:0 "Пощадили жінок і дітей"
nf_dis.2.c:0 "Ми вбили їх усіх"

nf_dis.3.t:0 "Війна з Костоломами"
nf_dis.3.d:0 "Костоломи не зраділи нашому захопленню Араґо – почався затяжний, виснажливий конфлікт.\nВони постійно нападали на погано укріплене селище вночі, спускаючись з гір. У [DIS.GetName] не було вибору – інакше їх просто знищили б.\nМи вирушили у Великий Похід, щоб захопити Даймонд-Пік – головний опорний пункт Костоломів. Це був жахливий конфлікт – нам знадобилось п’ять років, аби пройти через Камаську долину та дістатись укріпленого шахтарського комплексу на вершині [251.GetName].\nЗрештою, ми втратили майже половину свого народу, але повністю знищили Костоломів. Що ж ми знайшли на вершині?"
nf_dis.3.a:0 "Кришки! Купа кришкок!"
nf_dis.3.b:0 "Полонені з Аррою та Кламета!"
nf_dis.3.c:0 "Рідкісні, блискучі метали!"

nf_dis.4.t:0 "Зцілення Розколу?"
nf_dis.4.d:0 "Здається, єретики на півдні нарешті намагаються примиритися. Хоча вони і відкидають повне підкорення, пропонують співпрацю у боротьбі проти спільних ворогів зі сходу. Зрештою, якщо впаде один з нас – впаде і інший."
nf_dis.4.a:0 "Мир... поки що."
nf_dis.4.b:0 "Ми ніколи не будемо з єретиками!"

nf_dis.5.t:0 "Вони погодились!"
nf_dis.5.d:0 "Плем’я Мирлорків погодилось на базову співпрацю. Тепер нам не потрібно боятися вторгнення з півночі."
nf_dis.5.a:0 "Мир у наш час."

nf_dis.6.t:0 "Вони відмовили!"
nf_dis.6.d:0 "Зрадливі Мирлорки завжди прагнуть війни! Вони кажуть, що ніколи не підкоряться вірі єретиків!"
nf_dis.6.a:0 "Потрібно готувати оборону!"