l_english:
lake_heretics:0 "Єретики Кораллів"
lake_heretics_desc:0 "Жертви необхідні, якщо хочеш дотримуватись власних переконань."

lake_exiled:0 "Довге Вигнання"
lake_exiled_desc:0 "Зрештою, наші протести стали надто гучними, щоб плем’я Болотників могло їх терпіти."

lake_assault_of_diamond_peak:0 "Війна за Гору"
lake_assault_of_diamond_peak_desc:0 "Костоломи не зраділи нашому захопленню Араґо — почався затяжний, виснажливий конфлікт."

lake_recovering_from_the_assault:0 "Відновлення після Війни"
lake_recovering_from_the_assault_desc:0 "Багато наших людей страждають від стресу, душевних демонів та ментальних травм. Ми маємо загоїти їхні тривоги та забезпечити світле, мирне майбутнє для [DIS.GetAdjective]."

lake_lessons_from_the_bonepicker_war:0 "Уроки Війни з Костоломами"
lake_lessons_from_the_bonepicker_war_desc:0 "Війна з Костоломами навчила нас, передусім, важливості оборони. Вони майже знищили [DIS.GetAdjective] виснажливою війною — ми повинні застосувати ці стратегії проти інших і ніколи не повторити старих помилок."

lake_bonepicker_weapons:0 "Зброя Костоломів"
lake_bonepicker_weapons_desc:0 "Костоломи використовували просту, але ефективну зброю, яку вони називали «кістяними списами». По суті — загострені кістки, оброблені грубими інструментами. Їх залишилось так багато після війни, що краще вже використати їх."

lake_settle_the_mountain:0 "Оселитися на Горі"
lake_settle_the_mountain_desc:0 "Дехто з [DIS.GetAdjective] вже відмовляється покидати гору, за яку вони так довго билися, створюючи маленькі табори та стежки вздовж доріг до вершини."

lake_invite_traders:0 "Запросити Торговців"
lake_invite_traders_desc:0 "Тепер, коли ми позбулися канібалів Костоломів, ми нарешті можемо запросити назад старі торговельні каравани, які колись приходили сюди, поки їх не налякали Костоломи."

lake_rebuild_the_mountain_fortress:0 "Відбудувати Гірську Фортецю"
lake_rebuild_the_mountain_fortress_desc:0 "Стара фортеця Костоломів на вершині [251.GetName] коштувала нам п’ять років боротьби. Її практично неможливо штурмувати. Багато хто вважає, що така важка перемога означає, що плем’я має переселитися з нижніх боліт на вершину цієї гори."

lake_mend_the_lurker_schism:0 "Зцілити Розкол з Болотниками"
lake_mend_the_lurker_schism_desc:0 "Нас вигнали, бо ми не визнали владу Коралевого Суду в племені Болотників. Ми більше ніколи не підкоримося цим ідеалам, але, можливо, за правильних умов можна укласти короткочасний мир, щоби разом вижити перед загрозою зі сходу."

lake_expand_the_defenses_north:0 "Зміцнити Північні Оборонні Лінії"
lake_expand_the_defenses_north_desc:0 "Якщо впадуть Болотники — впадуть і [DIS.GetAdjective]. Лише якщо [251.GetName] стане єдиним шляхом до наших земель, ми зможемо захистити [150.GetName] та інші західні території. Ми маємо укріпити північні береги, щоб ворог не міг висадитись у землях Болотників!"

lake_teamwork_among_the_tribes:0 "Спільна Справа Віруючих"
lake_teamwork_among_the_tribes_desc:0 "Тепер, коли ми тимчасово відклали розбіжності перед лицем ворожої агресії зі сходу, ми можемо почати відновлювати порвані узи, прищеплюючи дух співпраці між нашими народами."

lake_mutant_fighting_tactics:0 "Тактика Боротьби з Мутантами"
lake_mutant_fighting_tactics_desc:0 "Так, Болотники становлять для нас небезпеку. Але є загроза ще більша — Супермутанти з Тролячого Лігва. Їхній новий лідер надзвичайно агресивний щодо мешканців печер. Ми повинні навчити наших апостолів, як боротися з цими велетнями!"

lake_preemptive_defenses:0 "Попереджувальна Оборона"
lake_preemptive_defenses_desc:0 "Болотники ніколи не підкоряться. Навіть якщо ми зараз зцілимо наші розбіжності, через десятиліття вони знову можуть спробувати підкорити нас Залізному Гріфу Коралевого Суду. Єдиний спосіб зберегти незалежність нашого народу — повністю укріпити кордон."

lake_lurker_training:0 "Навчання Вірних"
lake_lurker_training_desc:0 "Вірні Рудому Чоловікові мають бути навчені захисту, непокорі та любові у війні. Це шлях Рудого Чоловіка, і ми живемо за ним."

lake_the_big_one:0 "Велика Знахідка"
lake_the_big_one_desc:0 "Під час укріплення кордону проти Болотників ми знайшли величезний склад старої зброї Костоломів. Якби вони знайшли її раніше, вони могли б протриматись ще п’ятнадцять років! Ця зброя дозволить нашій армії битись без кінця."

lake_mirelurk_fighting_tactics:0 "Тактика Боротьби з Болотниками"
lake_mirelurk_fighting_tactics_desc:0 "Ми — вигнанці з племені Болотників. Дехто з наших еліт пам’ятає старі тунелі, які вони рили для війни. Ми повинні навчити наших солдатів протистояти тактикам наших гнобителів!"

lake_gardens_atop_the_mountain:0 "Сади на Вершині"
lake_gardens_atop_the_mountain_desc:0 "Деякі рослини добре ростуть у високогірних умовах. Знайдімо потрібне насіння і виростимо власний сад."

lake_moving_back_to_the_swamp:0 "Найкращий Захист — Це Напад"
lake_moving_back_to_the_swamp_desc:0 "Ми можемо чекати нападу Болотників. Але якщо завдати удару першими, можливо, нам вдасться уникнути нової довгої і виснажливої війни."

lake_banish_the_coral_court:0 "Вигнати Коралевий Суд"
lake_banish_the_coral_court_desc:0 "Тепер, коли ми повернули нашу стару батьківщину, ми можемо осушити болота та вигнати зіпсованих культістів, які спотворили наше мирне життя!"

lake_muttfruit_for_everyone:0 "Мутфрут Для Всіх!"
lake_muttfruit_for_everyone_desc:0 "Коралевий Суд завжди обмежував доступ до багатств Краю Ворону. Роздаваймо мутфрут бідним і голодним!"

lake_spread_the_cult_of_the_ruddy_man:0 "Поширити Культ Рудого Чоловіка"
lake_spread_the_cult_of_the_ruddy_man_desc:0 "Історія нашої перемоги над морськими чудовиськами увійде в легенди. Поширімо її по пустках — віра в Рудого Чоловіка має лунати повсюди."

# Підказки
mend_the_schism_tt:0 "§gМи зробимо Болотникам пропозицію примирення. Якщо вони погодяться визнати Рудого Чоловіка у своєму пантеоні, ми повністю об’єднаємося з ними.§!\nМи надішлемо пропозицію §Yплемені Болотників§!, і якщо вони її приймуть — наші краї з’єднаються в союз. Також ми отримаємо їхнє фокус-дерево."

heretics:0 "Єретики!"

lake_fortify_the_northern_border:0 "§GУкріпити північний кордон штату.§!\n"
lake_heavily_fortify_the_state:0 "§MМасово укріпити штат.§!\n"
lake_fortify_the_state:0 "§GУкріпити східний кордон штату.§!\n"

dis_75_percent_core_cost_reduction_tt:0 "§gАпостоли Рудого Чоловіка, нарешті звільнившись від своїх колишніх господарів, можуть зосередитися на повільному поширенні своєї ідеології за межі Орегону. Вже зараз по пустках ширяться легенди про перемогу над монстром М'лу-лу — переконати людей приєднатися до нашої віри буде легко.§!\nНадає постійне §Gзменшення вартості анексії на 70%§!"
