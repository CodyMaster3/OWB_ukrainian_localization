l_english:
  dln_langenburg_army:0 "Армія Ланґенбурґа"
  dln_langenburg_army_desc:0 "Війна Республіканської Коаліції залишила Ланґенбурґу цінний урок: коли панує анархія — право визначає сила. Герцогство було приречене стояти самотньо в майбутніх кризах — усвідомлення, що змінило економіку в рішуче мілітаристському напрямку. До 2275 року це відображалося у Збройних Силах Ланґенбурґа — силі, чия якість із лишком компенсує її невеликі чисельні масштаби."

  dln_university_speed:0 "Великий Університет Ланґенбурґа"

  dln_zappers:0 "Ланґенбурзькі Блискавки"

  dln_allotment:0 "За Кожними Дверима — Солдат!"

  dln_small_professional_army:0 "Мала Професійна Армія"

  dln_kingdom_army:0 "Королівська Армія"
  dln_kingdom_army_desc:0 "На шляху до величі доводиться жертвувати. Те, що ми втратили у спритності та професіоналізмі армії Ланґенбурґа, ми компенсували розмахом регулярних сил Манітоби та перевіреними військовими доктринами. Вищому командуванню доведеться адаптуватися."

  dln_hegemonial_army:0 "Гегемонна Армія"

  dln_imperial_army:0 "Імперська Армія"

  dln_anger_court:0 "Двір Анжера"

  dln_royal_order:0 "Орден Королівських Лицарів"

  dln_frozen_throne:0 "Вартові Змерзлого Трону"

  dln_welcome_home:0 "Ласкаво Просимо Додому!"
  dln_welcome_home_desc:0 "Піддані зі старих Коронних Земель масово повертаються до Королівства. Слово швидко шириться Північчю: їхні родини знають, що Королівство прийме їх за своїх — щойно фальшиві режими постануть перед судом."

  dln_warwick_ideas:0 "Іскра в Твоїй Руці!"
  dln_warwick_ideas_desc:0 "Прийнявши до себе деяких із найяскравіших умів, що стояли за робототехнічними здобутками герцогства Варвік, ми нарешті маємо змогу перетворити цей скарб у щось більше, ніж просто цікавинку."

  dln_mechanics_universalis:0 "Вершина Механіки!"

  dln_grand_imperial_city:0 "Імперська Столиця"

  dln_merchant_center:0 "Торгова Столиця Манітоби"

  dln_imperial_university:0 "Імперський Університет"
  dln_imperial_university_desc:0 "Молодь виросла на історіях про пригоди своїх батьків у Університеті Ланґенбурґа. Не дивно, що вступні офіси вже завалені заявками — ще до урочистого відкриття."

  dln_imperial_palace_funds:0 "Фінансування Імперського Палацу"
  dln_imperial_palace_funds_desc:0 "Більшість наших найцінніших установ у Вінніпезі було занедбано республіканцями. Їхнє відновлення буде дороговартісним — але це гірка пігулка, яку доведеться проковтнути."

  dln_academy_funds:0 "Фінансування Університету"
  dln_academy_funds_desc:0 "Більшість наших найцінніших установ у Вінніпезі було занедбано республіканцями. Їхнє відновлення буде дороговартісним — але це гірка пігулка, яку доведеться проковтнути."

  dln_industrial_grants:0 "Індустріальні Гранти"
  dln_industrial_grants_desc:0 "Більшість наших найцінніших установ у Вінніпезі було занедбано республіканцями. Їхнє відновлення буде дороговартісним — але це гірка пігулка, яку доведеться проковтнути."

  dln_winnipeg_airforce:0 "Натхнення з Уінніпеґа"
  dln_winnipeg_airforce_desc:0 "Невелика пляма на нашій репутації — покладатися на досягнення республіканців в авіації. Та що може бути кращою образою для їхнього спадку?"

  dln_imperial_airforce:0 "Нова Королівська Авіація"
  dln_imperial_airforce_desc:0 "Навіть у повітрі повільність і стабільність перемагають."

  dln_airforce_supremacy:0 "Манітоба Згори, Як І Знизу"
  dln_airforce_supremacy_desc:0 "Коли загримлять барабани війни — тінь нашої авіації накриє кожного мешканця Півночі."

  dln_imperial_airforce_perfection:0 "Неперевершені"
  dln_imperial_airforce_perfection_desc:0 "Наша авіація — заздрість світу, натхнення для манітобців та погибель для ворогів."

  dln_winnipeg_perfection:0 "Нове Сонце"
  dln_winnipeg_perfection_desc:0 "Наша авіація — заздрість світу, натхнення для манітобців та погибель для ворогів."

  dln_army_economy:0 "Армія з Державою"
  dln_army_economy_desc:0 "Останнім часом Ланґенбурґ називають армією з державою — і, дивлячись зсередини, це дійсно так. Індустрія герцогства, хоч би як це не було, існує насамперед для підтримки армії розміром, якого ми не мали б змоги утримувати. Змінити це зможе лише радикальна трансформація."

  dln_decentralized:0 "Децентралізований Флот"
  dln_decentralized_desc:0 "Розподіливши навантаження з будівництва кораблів між поселеннями навколо Дауфіна, ми змогли оптимізувати багато виробничих процесів, підвищивши ефективність."

  dln_staple_port:0 "Головний Порт Дауфіна"
  dln_staple_port_desc:0 "Навіть попри все, що довелось пережити, Королівський Порт Дауфіна зберігає основу інфраструктури, що зробила його серцем наших військово-морських зусиль."

  dln_economical_integration:0 "Економічна Інтеграція Королівства"
  dln_economical_integration_desc:0 "Час — на вагу золота. Ми маємо показати, що віддаємо всі сили на відновлення держави. Ми НЕ будемо правити своєю землею як загарбники."

  dln_staple_port_mark_2:0 "Королівський Основний Порт Дауфіна"
  dln_staple_port_mark_2_desc:0 "Завдяки переосмисленню перевірених методів кораблебудування, Дауфін знову став джерелом могутності королівського флоту Манітоби."

  dln_decentralized_mark_2:0 "Флот Манітоби"
  dln_decentralized_mark_2_desc:0 "Працювати за абсолютно новими кресленнями — справа нелегка. Та з першими кораблями, що вже зійшли з доків, і більшістю виробничих збоїв позаду, нарешті можна набрати темп."

  dln_anger_hospital:0 "Королівський Інститут Медицини"
  dln_anger_hospital_desc:0 "І студенти, і дослідники процвітають у середовищі, де небезпека й відкриття крокують поряд."

  river_merchant:0 "Купець Річкової Ліги"

  custodian:0 "Хранитель"

  dln_hudson_company:0 "Гудзонова Компанія"
  dln_hudson_company_desc:0 "Гудзонова Компанія занадто довго діяла як заманеться. За нової влади вона буде триматися на короткому повідку, слугуючи зручним фасадом для торговельно-фінансового крила скарбниці."

  dln_hudson_company_sale:0 "Прибутки з Продажу Гудзонової Компанії"
  dln_hudson_company_sale_desc:0 "Гудзонова Компанія завжди завдавала більше клопотів, ніж користі. Хай керує той, хто більше заплатить — ми все одно оподаткуємо їх до останнього цента."

  dln_atoine_bane:0 "Прокляття Атуа́на"
  dln_atoine_bane_desc:0 "Лейф Йорктон — людина, якої Атуа́н Босолей навчився боятись. Після подій війни навіть одне лиш майоріння прапора Ланґенбурґа за пагорбом здатне вкинути метиських командирів у паніку."

  dln_joran:0 "Військові Ідеї Йорана Йорктона"
  dln_joran_desc:0 "\"Плануй правильно — і битва буде виграна ще до її початку.\""

  dln_leif:0 "Військові Ідеї Лейфа Йорктона"
  dln_leif_desc:0 "\"Мої солдати — до мене!\""

  dln_eleanor:0 "Військові Ідеї Елеанор Йорктон"
  dln_eleanor_desc:0 "Пам’ятай основи."

  dln_warwick:0 "Механічна Майстерність"
  dln_warwick_desc:0 "Герцогство Варвік мало славні традиції обробки дерева завдяки густим лісам на своїй території. Потреби цього бізнесу надихнули розвиток дедалі досконалішої робототехніки — для заготівлі, обробки й охорони."

  dln_absalon:0 "Навички Торговців-Вуличників"
  dln_absalon_desc:0 "Купці Абсалона першими використали сусідню Саскачеван для розбудови великої торгової мережі на захід. Після падіння герцогства багато з них знайшли прихисток у нашому дворі, привізши із собою безцінний досвід."

  dln_anger:0 "Королівський Етикет"
  dln_anger_desc:0 "До тихих, мальовничих берегів озера Уінніпеґ з’їжджалася знать з усього королівства — на перемовини, чи просто розкішні бали. Відтак двір Анжера досконало опанував мистецтво гостинності, ставши неофіційним центром дипломатії Манітоби."

  dln_dawfin:0 "Підприємливий Кораблебудівник"
  dln_dawfin_desc:0 "Будь-який коронний службовець у Дауфіні зможе годинами розповідати про флот та кораблебудування. Після знищення королівського порту чимало з них осіло у Ланґенбурґу. Іноді довгі балачки на прийомах варті тієї технічної експертизи, що ми отримали."

  dln_absalon_merchants:0 "Манітобська Торгова Мережа"
  dln_absalon_merchants_desc:0 "Манітобські торгові застави швидко розповзлися вздовж усієї Саскачевану. Племена на заході вже знають: наприкінці жовтої дороги — місто їхніх мрій."

  dln_absalon_trade_never_ends:0 "Лорди Самого Канадського Долара"

  dln_manitoban_project:0 "Проєкт Манітоба"
  dln_manitoban_project_desc:0 "Усвідомивши гниль, що підточує основи держави, королева Йорктон віддає всі сили радикальним реформам. Її амбіції, безсумнівно, дратуватимуть стару гвардію. Але як далеко зможе зайти юна регентка в монархії, що бере початок з незліченних поколінь?"

  dln_dam:0 "Гребля Ґранд-Рапідс"
  dln_dam_desc:0 "З правильною інфраструктурою природні води озера Уінніпеґосіс стають справжнім джерелом дешевої електрики для бізнесу."

  dln_resistance:0 "Національна Домашня Гвардія"
  dln_resistance_desc:0 "Багато з наших демобілізованих вояків мають роки бойового досвіду. Вони будуть незамінними під час умиротворення неспокійних поселень."

  dln_resistance_cph:0 "Поліція Форту Кап-Гелл"

  dln_manifest_research:0 "Воля МАНІФЕСТУ"
  dln_manifest_research_desc:0 "Карта пам’яті Доля натякає на ще одну активну точку проєкту МАНІФЕСТ у Плезентдейлі. На щастя, разом із нею ми отримали топографічну мапу міста. Коли настане час діяти — перевага буде за нами."

  dln_pax_britannia_idea:0 "Pax Britannia"
  dln_pax_britannia_idea_desc:0 "Якщо ви не винні... вам нема чого боятися."

  dln_anger_ideas:0 "Виправити Помилки"
  dln_anger_ideas_desc:0 "Візит до Літнього Двору лише укріпив переконання Йорктона: що б не сталось, чоловіки й жінки Манітоби не заспокояться, поки старі приниження не буде виправлено."

  dln_hudson_company_two:0 "Субсидії Гудзоновій Компанії"
  dln_hudson_company_two_desc:0 "Вплив Гудзонової Компанії на економічний розвиток Північного кордону неможливо ігнорувати. Критично важливо провести її через плани розширення, переконавшись, що добробут наших підданих стоїть вище за прибуток."

  dln_hudson_company_three:0 "Опора Наших Брязкалець і Дрібничок"
  dln_hudosn_company_three_desc:0 "З розширенням наших операцій на Північ, ми покладаємо ще більше роботи на Гудзонову Компанію. І на краще — вже скоро кожен мешканець білого безкраю шукатиме нашого краму та крихіток."

  dln_last_will_and_test:0 "Остання Воля і Заповіт"
  dln_last_will_and_test_desc:0 "Ланґенбурґ єдиний у своїй підтримці маршала Йорктона — підтримка покійної герцогині затьмарила всі залишки вірності королю Ґанну II. Та спадщина має межі. Зі зростанням втрат герцогства випробується й віра народу. Меч Півночі має діяти швидко, якщо його повстання має увінчатися успіхом."

  dln_illegitimate:0 "Нелегітимний Претендент"
  dln_illegitimate_desc:0 "Оскільки Заповіт Софі так і не було оприлюднено, нас в очах підданих вважають черговим військовим вождем, що прагне урвати шмат Манітоби.\n\n§G(Цей дебаф буде знятий після виконання фокусу §Y"Граф, Що Став Королем".)§!"

  dln_lack_army_cohesion:0 "Інтеграція Армії Манітоби"
  dln_lack_army_cohesion_desc:0 "Хоч більшість сил брендонської знаті охоче прийняли помилування, надане нашим Лордом, потрібно ще чимало часу, аби повністю інтегрувати новобранців і привести їх до наших стандартів."

  ###Tooltips
  dln_eleanor_angry:0 "Елеанор це не забуде ще довго."
  dln_archangel_tt:0 "§YДва загони Ордену Архангела§! стануть під наш командування!"
  dln_militia_tt:0 "§YЧотири загони ополчення§! стануть під наші знамена!"
  dln_infantry_tt:0 "§YДва піхотних загони§! стануть під наші знамена!"
  dln_wartime_men_tt:0 "§YП’ять загонів ополчення§! стануть під наші знамена!"
  dln_sophie_dead:0 "Герцогиня Померла"
  dln_this_home:0 "§gЦі ефекти активуються після завершення фокусу: "Ми Вдома".§!"
  dln_imperial_palace_nick:0 "§YРуїни Імператорського Палацу§! перейменовано на §YІмператорський Палац§!."
  dln_academy_nick:0 "§YПочаток Імператорського Університету§! перейменовано на §YІмператорський Університет§!."
  dln_imperial_city_effect:0 "Місто Уінніпеґ отримає модифікатор §YІмператорська Столиця§!. Поки що він не має ефекту, але якщо місто повернеться до свого колишнього блиску, лише уявити можна, які скарби це принесе."
  dln_imperial_city_bonuses:0 "§YІмператорська Столиця§! надає:\n§G+50%§! макс. заводів у регіоні\n§G+20%§! швидкість будівництва\n§G+40%§! швидкість ремонту\n§G+20%§! дохід з розвитку"
  dln_consequenses:0 "§GЕфекти цього фокусу залежать від ваших попередніх рішень!§!"
  dln_will_must_be_done:0 "Якщо Остання Воля і Заповіт не буде завершена, це суттєво ускладнить нашу здатність воювати під час повстання і зробить нас нелегітимними в очах народу!"
  dln_manitoba_waits:0 "Повстання Йорктона!"
  dln_knight_orders:0 "Статус Королівських Орденів Лицарів Манітоби"
  dln_knight_orders_desc:0 "Орден Архангела відновлено.\n\n[ROOT.DLN_knight_george].\n\n[ROOT.DLN_knight_nathaniel].\n\n[ROOT.DLN_knight_dante]."
  dln_st_george:0 "Відновити Орден Святого Георгія"
  dln_watchmen:0 "Відновити Вартових Натанаїла"
  dln_dante:0 "Дізнатись про долю Останнього Хрестового Походу"
  DLN_order_of_st_george_restored:0 "Орден Святого Георгія повернув собі славу"
  DLN_order_of_st_george_missing:0 "Орден Святого Георгія досі блукає жахами Електорату"
  DLN_nathaniel_order_restored:0 "Вартові Натанаїла повернули собі славу"
  DLN_nathaniel_order_missing:0 "Хрестовий Похід Брата Яна триває у Дакоті"
  DLN_dante_order_restored:0 "У тій пекельній ямі немає надії"
  DLN_dante_order_missing:0 "Полум’я ще не згасло"
  dln_banners_raise_tt:0 "§YТри загони Імперських Прапорів§! будуть підняті для допомоги у відвоюванні Уінніпеґа!"
  dln_imperial_airforce_tt:0 "§GЯкщо фокус "Якість Королівства" вже виконаний, наші старі нацдухи буде об’єднано в:§!"
  dln_winnipeg_airforce_tt:0 "§GЯкщо фокус "Натхненням з Уінніпеґа" вже виконаний, наші старі нацдухи буде об’єднано в:§!"
  dln_unlock_conscription:0 "§GЗ інтеграцією армій Королівства армійська система Ланґенбурґа фактично розпалася. Хоча тепер ми зможемо мобілізувати більше сил, ми втратили переваги нашої колишньої професійності.§!"
  dln_change_tt:0 "Наше Герцогство має отримати нові землі, щоби стабілізувати економіку."
  DLN_fleet_tt:0 "Завдяки §YКоролівській Компанії§! та фінансовій підтримці §YКоролівської Скарбниці§! буде побудовано новий флот, аби ми могли стежити за озером Уінніпеґ."
  DLN_royal_tt:0 "§YКоролівська Компанія§!, суднобудівна компанія, отримає фінансування від корони, що дозволить їй працювати на загальнонаціональному рівні."
  dln_staple_port_tt:0 "§GЯкщо фокус "Покладатися на Імператорське Місто" вже завершено, наші попередні нацдухи буде об’єднано в:§!"
  dln_decentralized_tt:0 "§GЯкщо фокус "Децентралізований Флот" вже завершено, наші попередні нацдухи буде об’єднано в:§!"
  dln_unlock_eco:0 "§GОскільки ми перебрали на себе управління Королівством, нам доведеться знову з’єднати економічну інфраструктуру Ланґенбурґа з Королівськими Землями. Це створить виклики, проте дозволить нарешті нормалізувати нашу економіку.§!"
  dln_core_creation_cost_manitoba:0 "Із відновленням імперського контролю ми отримаємо §G-50%§! до вартості створення ядер на землі, що колись належали §YКоролівству Манітоба§!."
  dln_land_regain:0 "Ми §Gанексуємо§! всі території, що історично належали Королівству Манітоба, які наразі контролюються нашими маріонетками чи союзниками, окрім §YАрборзької Хунти§!."
  DLN_yorkton_arms_tt:0 "§YYorkton Arms§!, збройна компанія, отримає фінансування від корони, що дозволить їй працювати на загальнонаціональному рівні."
