  dln_dawfin_upgraded:0 "Від Озера до Озера"
  dln_dawfin_upgraded_desc:0 "Відновлення Давфіна та Королівського Флоту нарешті завершене. Поселення на узбережжі можуть спати спокійно — над ними пильнує найпотужніший флот, що коли-небудь бачив Мanitoba."
