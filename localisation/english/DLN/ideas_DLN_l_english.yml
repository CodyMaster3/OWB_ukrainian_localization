  dln_regency_dec:0 "§gОголошено регентство під керівництвом Лейфа Йортона, що триватиме до вирішення заповіту Софі. Це запустило зворотний відлік до Повстання Йортона. Коли час вичерпається — ми вступимо у війну з Королівством Манітоба.§!"
