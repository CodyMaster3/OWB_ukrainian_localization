  dln_race_against_time:0 "Перегони з Часом"
  dln_race_against_time_desc:0 "Новини про непокору маршала швидко досягнуть Брендона — а ще швидше Король збереться до війни. Лейф Йортон має вирішити, як підготуватися до неминучого — поки королівські барабани ще не заграли."
