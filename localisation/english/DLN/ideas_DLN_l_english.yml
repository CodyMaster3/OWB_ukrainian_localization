  ### Нові ефекти
  dln_the_knights:0 "Лицарська Звитяга"
  dln_the_knights_desc:0 "Новина про повернення Архангела розлетілась країною. Лицарі повертаються додому, готові знову служити своєму обітництву."
  dln_the_knights_honor:0 "Честь Лицарів Відновлена"
  dln_the_knights_honor_desc:0 "Завдяки керівництву Алекандера і політиці відкритого гаманця, Лицарів швидко повернуто до бойової форми їхніх славних днів."
  dln_the_knights_prowess:0 "Нова Епоха Лицарства"
  dln_the_knights_prowess_desc:0 "Коли наші Лицарі марширують, зло тікає в тінь. Поки люди бачать сяючу броню — вони відчувають себе в безпеці."
  dln_manitoba_restructure:0 "Реструктуризація Імперської Армії"
  dln_manitoba_restructure_desc:0 "Реформи командування вже дають плоди. Новий набір командирів запровадив інновації, що підвищили ефективність тактики малих загонів."
  dln_manitoba_banners:0 "Повернення Імперських Штандартів"
  dln_manitoba_banners_desc:0 "Командири загонів діють вільно, з гербом імперії на плечі. Ворог дізнається, що це — символ страху."
  dln_the_imperial_standard:0 "Імперський Стандарт"
  dln_the_imperial_standard_desc:0 "Кожен чоловік — лідер."
