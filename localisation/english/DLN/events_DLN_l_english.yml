l_english:
nf_dln.1.t:0 "На краю світу Ланґенбурґ стоїть"
nf_dln.1.d:0 "Герцогство Ланґенбурґ було засноване понад півтора століття тому, коли наші предки присягнули на вірність щойно проголошеному королю Уінніпеґа, Ґанну I. Невдовзі після цього було проголошено Королівство Манітоба, і наші землі розквітли, а королівські кордони простяглися від Щитового Муру до старого Кодетта. Та, як і все добре, це мало скінчитися. Великий Об’єднувач, втомившись від тягаря часу, зрікся трону. Корона перейшла до давнього друга короля — герцога Брандона, який згодом об’єднав південь, нині знаний як «Королівські Землі». Проте з плином поколінь колись славетна лінія стала дедалі розбещенішою — як і інші очільники герцогств — і королівство занурилося в хаос. Усі — крім нас. Наші предки залишилися вірними цінностям, працюючи на полях день і ніч, тоді як королівський двір марнував скарбницю на бали та бенкети.\n\nЗрештою тріщини стали надто очевидними. Першим ударом стала втрата південних територій, що належали герцогству Ворік, які впали жертвою кривавого повстання і стали основою Конгресу Метисів. Згодом Уінніпеґ і прилеглі землі відокремились, що призвело до спустошливої Війни Республіканської Коаліції. Користаючися кризою, Електорали захопили значну частину герцогства Абсалон, поки основна армія воювала на півдні. Віддалене герцогство Анже було роздерте найманцями, а Дофін — скалічене несподіваним нападом на Королівський Порт наприкінці конфлікту. Одне за одним вони впали — й лише ми зберегли уламки колишньої слави."
nf_dln.1.a:0 "Механічне мистецтво Воріка."
nf_dln.1.b:0 "Купецьке ремесло Абсалона."
nf_dln.1.c:0 "Адміністрація Анже."
nf_dln.1.e:0 "Морська майстерність Дофіна."

nf_dln.2.t:0 "Найвеличніший день маршала"
nf_dln.2.d:0 "Ранок другого дня Війни Республіканської Коаліції. Провідник Метисів Атуан Босолей підійшов до Йорктона, маючи за плечима понад 25 000 найкращих вояків Конгресу. Ланґенбурзьку сторону очолював маршал Лейф Йортон, чия армія була менш ніж удвічі меншою, сформованою з місцевого війська та вигнанців із Реджайни, що оселилися у Форті Кап Гелл. Їм допомагала коаліція найелітніших лицарів Королівства з Орденів Архангела, Святого Петра, Святого Георгія та Юстуса.\n\nБитва почалася артилерійським обстрілом мурів. Та на подив Атуана, у відповідь одразу ж заговорили гармати з лісу, знищивши його позицію. Попри хаос, Атуан зібрав війська і відступив — рішення, що стало фатальним. Помітивши шанс, маршал разом із лицарями кинувся в кінну атаку. Цей маневр остаточно зламав ряди Метисів і приніс герцогству неочікувану перемогу.\n\nПроте перемога не була абсолютною: Атуану вдалося втекти, а в атаці загинули кращі лицарі, серед них Торґір Вейбрун — гросмейстер Ордена Архангела. Та все ж це була вирішальна битва, що дозволила маршалу рушити на схід і зустріти головні сили республіканців."
nf_dln.2.a:0 "Їхня жертва не була марною. Йортон урятував Коронy."

nf_dln.3.t:0 "Сталева кров, загартована в битвах"
nf_dln.3.d:0 "Батько Лейфа, Йоран Йортон, був першим маршалом свого дому, знаним за методичність і розумну стратегію. Його нащадки прагнули перевершити цю спадщину.\n\nЛейф прагнув поєднати батькову педантичність із безпосереднім підходом до бою, наголошуючи на ролі маршала на полі бою. Натомість його донька, Елеанора, бачила в підході діда нові можливості. Вона вважала, що слід зосередитися на довготерміновому плануванні, спеціалізованій підготовці та викладанні військової історії.\n\nЗрештою, саме один із цих підходів і вплинув найбільше на офіцерський корпус."
nf_dln.3.a:0 "Методичність Йорана."
nf_dln.3.b:0 "Спонтанність Лейфа."
nf_dln.3.c:0 "Дисципліна Елеанори."

nf_dln.4.t:0 "Ланґенбурґ — у майбутнє!"
nf_dln.4.d:0 "Ви, мабуть, не мали це бачити, еге ж?"
nf_dln.4.a:0 "Йортон, іронічно, народився в Йортоні"

nf_dln.5.t:0 "Боже, бережи герцогиню!"
nf_dln.5.d:0 "Ви, мабуть, не мали це бачити, еге ж?"
nf_dln.5.a:0 "Нехай царює довго!"

nf_dln.6.t:0 "Він прийшов до мене в холодну ніч"
nf_dln.6.d:0 "Лорд прокинувся серед ночі — на порозі стояв королівський гонець, убраний у чорне. Йортон відчув, як стислося серце, коли той простягнув листа, скріпленого герцогською печаткою. Слів не треба було — обидва знали: кур'єр прийшов зарано, щоб нести Звіт Герцогства.\n\nТого ж вечора лорд разом із гінцем вирушили до столиці. У дорозі думки Йортона блукали. В уяві виринали образи білого узбережжя, куля вогню на обрії, він — юний, заплаканий. Герцогиня Абсалону не захотіла гратися з ним у хованки. Він сховався у коморі, але Софі знайшла його, опустилася навколішки й обійняла, поплескавши по голові: «Знаєш, Лейфе, ти можеш бути найсолодшим фруктом у саду — але є ті, хто просто не любить фруктів. І це нормально. Життя триває. Ти питав герцога Дофіна, чи не хоче погратись?» Це був перший з багатьох уроків. А потім — навчання. Фехтування. Тіньовий кабінет. Походи, тренування —\n\nЙортонова уява обірвалася, коли над ним пронісся порив вітру. Далі він їхав мовчки. Вони обоє знали — вона зробила останній подих."
nf_dln.6.a:0 "Відтоді маршал полюбив тишу ночі."

nf_dln.7.t:0 "Герцогиня померла..."
nf_dln.7.d:0 "Дзвін лунав по всьому місту, коли вони прибули — люди вже дізналися про трагедію. Лорд зліз із коня біля столичного бульвару й пішки рушив до палацу. Дворецький Софі, Тобіас, спостерігав, як він наближається крізь натовп скорботників. Йортон тримав голову високо, але Тобіас бачив — очі не приховували тугого клубка в горлі. Люди розступалися, дехто висловлював співчуття — для когось то була формальність, для більшості — акт щирої скорботи.\n\nТобіас розчинив ворота, і Йортон пройшов усередину. Разом вони ступили до бездоганних зал і наблизилися до покоїв Софі. Йортон узявся за ручку. Тобіас уже збирався піти, та лорд попросив лишитись. Не обертаючись, він прошепотів: «Це їхня провина, Тобіасе. Через них вона пішла. Залишила мене...» Тобіас мовчав — не знав, про кого мова. Та наступні слова розвіяли сумніви: «Той згнилий труп короля. Продажні вельможі. Зрадники з Уінніпеґа. Вони виснажили її, виссали всю її силу. Клянуся — всі вони заплатять.»\n\nТобіас не озвався — бо те, що сказав лорд, межувало з державною зрадою. Потім Йортон увійшов до її кімнати й віддав останню шану тій, хто була йому за матір. Він залишився там до заходу сонця, поки тіні не стали довгими. І тільки тоді, сказавши останнє прощавай, Тобіас вручив йому заповіт герцогині. Він мовчки спостерігав, як лорд читає — очі того то розширювались, то звужувались. Нарешті, лорд озвався — голосом холодним, як крига озер: «Склич герцогську раду. Попереду чимало роботи.»"
nf_dln.7.a:0 "«Негайно, мій лорде.»"

nf_dln.8.t:0 "Історія чекає"
nf_dln.8.d:0 "«Мій лорде, час настав», — виголосив Тобіас: «ми маємо діяти. Зволікати не можна, доки не доведемо справу до кінця. Лише скажіть, і я вишлю гінців — хай скликають вірних вам». Йортон продовжував дивитися у вікно, за яким холодний дощ стукав об скло: «Скільки відгукнеться?»\n\n«Окремо — мало. Але зусиллям ми зберемо варту коаліцію.» — відповів Тобіас, дістаючи записник і поправляючи окуляри: «Більшість ветеранів Лицарських Орденів розкидано по герцогству після їх розпуску. Вони не забули ваших подвигів — не сумніваюсь, що підуть за вами. Те ж саме — і з регулярним військом.» Тобіас глянув на лорда: «Але цього замало. Потрібні й посіпаки Форту Кап Гелл, вигнанці, залишки дому Дофін на півночі... Без компромісів не обійтись.»\n\nЙортон замовк, замислившись. Нарешті промовив: «Ти думаєш, у нас є шанс, Тобіасе?» — Дворецький почув, як у голосі затремтів сумнів: «Боїтесь підвести Софі, мій лорде?» Маршал нарешті обернувся, і його обличчя осяяла рішучість: «Принеси мій плащ. Вирушаємо.»"
nf_dln.8.a:0 "«Як накажете, мій лорде.»"

nf_dln.9.t:0 "Повернення Архангела"
nf_dln.9.d:0 "Очолив пошуки Лицарів у вигнанні Александр Вейберн, син загиблого Великого Магістра Ордену Архангела. Саме його присутність переконала деяких зневірених ветеранів, що сховалися в глухих північних краях, повернутися. Більшість погодилася за однієї умови — щоб Александр прийняв титул батька й офіційно відновив Орден, знищений боягузливими манітобськими аристократами.\n\nТак, у день, наповнений пишністю й церемонією, Александр здійняв священне Знамено, востаннє потоптане на полі бою біля Йорктону. У герцогській каплиці, перед залишками Ордену, він виголосив Клятву Архангела, урочисто жертвуючи серце за народ Манітоби. Він захищатиме законного Короля до дня, коли Господь забере його з цього світу — від ворогів зовнішніх... або внутрішніх."
nf_dln.9.a:0 "Як батько, так і син."

nf_dln.10.t:0 "Остання воля й заповіт"
nf_dln.10.d:0 "Лорд Йорктон вийшов на балкон герцогського палацу, що нависав над брукованим подвір’ям, заповненим натовпом цікавих містян. Чиновники міста викликали їх до воріт палацу без пояснень. Він нахилився до мікрофона на трибуні: “Вірні піддані Королівського Герцогства — дякую вам за присутність. Як вам відомо, я правив землями Ланґенбурґу як регент після смерті Її Світлості...” Він замовк на мить, дозволяючи людям зануритись у теплі спогади про правління герцогині: “За цей час я виконував пункти її заповіту. Ви, мабуть, помітили появу землемірів та посилене патрулювання в місті.”\n\n“Та головна причина, чому я скликав вас сьогодні, — оголосити її останнє бажання.” Він знову зробив паузу: “Її Світлість доручила мені, Лейфу Йорктона, керувати цією землею”. Шепіт прокотився двором: “Як ви знаєте, герцогиня не мала прямих нащадків. Їй було б просто передати владу Королю, як того вимагає звичай.” Він підняв палець угору: “Але Вона побачила небезпеку, яка нависла над Герцогством. Вона бачила занепад, зневагу, чвари — усе те, що зруйнувало Королівство. Вона знала: ця земля не процвітатиме під владою порожнього монарха.” Він ще раз зупинився: “Навіть по смерті Вона прагне вас захистити — і доручила мені здійснити цю найвищу мету. Як я вже колись це зробив, зроблю й знову.”\n\nНастала тиша. Секунди тягнулися вічно. Із глибини натовпу пролунав слабкий спів: “...тОн”. Потім гучніше: “Лорд Йорктон”. І ще гучніше: “ЛОРД-ЙОРК-ТОН”, поки весь двір не вибухнув єдиним скандуванням “ЛОРД-ЙОРК-ТОН, ЛОРД-ЙОРК-ТОН!”. Він підняв руки до народу: чи то спадщина герцогині, чи його власні заслуги — він досяг свого. Кістки кинуто. За кілька днів чутки дійдуть до Брендона. І ще за кілька — сили корони виступлять проти нового претендента. І за кілька днів він перейде Ассінібойн, аби їх зупинити."
nf_dln.10.a:0 "“Надрукуйте заповіт і поширте його в сусідні поселення.”"

nf_dln.11.t:0 "Угода з Герцогинею"
nf_dln.11.d:0 "Протягом кількох тижнів Йорктон подорожував поселеннями, намагаючись здобути підтримку дрібної знаті Герцогства Ланґенбурґ. Найважчою виявилася остання — герцогиня Беллорес із впалого дому Дауфінів.\n\nКолись Дауфін був основою морської могутності Манітоби, з великим довоєнним портом, з’єднаним із озером Уінніпеґозіс. Під час Війни Республіканської Коаліції, її батька підвело марнославство — він не розпізнав пастку повстанців. Один невдалий маневр — і Королівство втратило більшість флоту, а порт упав, послабивши вплив над водами і забравши життя герцога.\n\nПісля хаосу, що послідував, Беллорес залишилася безземельною й пішла у вигнання до Ланґенбурґу. Як вдячність за милість Софі, вона боролася на північних кордонах з чудовиськами з Блайтвуду.\n\nВірна, але складна союзниця, міркував Йорктон. Її люди пройшли через пекло — і будуть потужним надбанням. Обіцянка повернути Дауфін могла б переконати її. Але після всього — що ще вона зможе йому нав’язати?\n\nУ задумі, він послав за Александром. Той увійшов за хвилину: “Ви кликали, мій лорде?”. Маршал звернувся до свого вірного помічника:"
nf_dln.11.a:0 "“Готуйся до виїзду — у мене є пропозиція для герцогині Беллорес.”"
nf_dln.11.b:0 "“Мабуть, я переплутав. Можеш іти, Александре.”"

nf_dln.12.t:0 "Повернення вигнанців"
nf_dln.12.d:0 "Йому сказали, що чекатимуть на подвір'ї. Йорктон очікував дюжину. Може, кілька десятків, якщо пощастить. Але коли він вийшов з герцогського палацу, герб Ланґенбурґу простягався аж за ворота.\n\nВсі вони відповіли на його заклик. Залишки розформованого Ордену Лицарів. Початківці, вигнані через заздрість і страх старших. Темні типи, що не цураються зігнути правила заради результату.\n\nСтарший з них виступив уперед: “Жоден не відступив, коли почув глашатая. Ми у вашому розпорядженні.” Йорктон поклав руку йому на плече: “Ставши поруч зі мною сьогодні, ви забезпечили краще завтра. Борімось до останнього подиху, аби його не змарнувати.”"
nf_dln.12.a:0 "“Так, мій лорде!”"

nf_dln.13.t:0 "Форт Кеп-Гелл"
nf_dln.13.d:0 "У Герцогстві Ланґенбурґ залишалася ще одна значуща фракція, здатна змінити розклад сил на користь маршала: вигнанці з Форту Кеп-Гелл. Спершу вони були силою правопорядку при Домі Ворвіків у місті Реджайна, але втратили все під час повстання Метисів, що поклало край правлінню їхньої родини на півдні.\n\nУ наступні десятиліття вони жили на західних окраїнах герцогства, тихо стежачи за злиднями й злочинцями. Але під час Війни Республіканської Коаліції все змінилось. Коли армії Метисів були відкинуті, Йорктон мусив особисто вмовляти лідерів вигнанців не влаштовувати кривавий похід помсти по Реджайні. Тоді їхня ненависть до повстанців стала очевидною для всіх. І разом з нею — великий арсенал, що зберігся ще з часів втечі. Ні Софі, ні Ґанн II не намагались вилучити зброю. Можливо, вони знали, що фанатизм вигнанців ще стане в пригоді. І схоже, той день настав.\n\nКажуть, не буди лихо, поки тихо. Але ця собака мала ікла, яких Йорктон ще не бачив. Обіцянка походу на Реджайну може переконати їх приєднатися. Але що потім? Чи зможе він зупинити їх, якщо ті вирішать помститися кожному, хто мав стосунок до Конгресу Метисів? Це буде гучне послання… але чи варто заплямовувати нову державу кров'ю?"
nf_dln.13.a:0 "Як буде, так буде."
nf_dln.13.b:0 "Я не продаватиму душу за кілька зайвих шабель."

nf_dln.14.t:0 "Невідомий благодійник"
nf_dln.14.d:0 "Йорктон розчинив двері герцогського арсеналу, запах пороху й холодної сталі вдарив у ніс. Кілька охоронців саме заносили останні ящики. Один підбіг до маршала: “Будь ласка, мій лорде, ми ще не встигли все перевірити, і...” Йорктон махнув, прямував до дюжини контейнерів у глибині.\n\nВін схопив лом і відкрив один з ящиків — гвинтівки й боєприпаси. Як і всі інші. Нічого особливого чи передового. Але надійне, ефективне, і — найголовніше — легке в користуванні.\n\nПатруль знайшов вантаж посеред ночі перед воротами палацу. Невідомий благодійник скористався завірюхою, щоб залишитись непоміченим. Хто б це не був — він мав бути з найближчого кола маршала. Хтось, хто знає його плани. Та ким би не був той таємничий союзник — Йорктон не збирався марнувати такий подарунок."
nf_dln.14.a:0 "Цікаво, чи вони постукають у двері після цього всього."

nf_dln.15.t:0 "День, якого так чекали"
nf_dln.15.d:0 "Лорд Йорктон відчинив розкішні дерев’яні двері тронної зали Королівства, вдихаючи атмосферу пишного залу, який викликав у пам’яті спогади юності. Саме тут справжній Король доручив йому доленосне завдання — захистити край від повстанців, що підточували державу. І саме тут змовницька знать відняла у нього здобуте в бою.\n\nПісля приходу до влади прогнилого Ґанна II, Королівство неухильно занепадало — але розкіш залу залишилась недоторканою.\n\nЙого роздуми обірвав неочікуваний вигляд — корона Королівства, така ж чарівна, як і її зал, лежала кинута на кам’яній підлозі. Час був ідеальний — лицарська варта, що увійшла слідом, перш за все побачила, як Йорктон здіймає над головою найбільший скарб землі. Вояки впали на коліна — та маршал зразу розставив пріоритети: “Огляньте палац і прилеглі землі. Ґанна хочу побачити перед собою в найближчі дні.” Потім він звернувся до заступника командира: “Передай командирам гарнізонів: хай повідомлять графів, що я незабаром зв’яжуся з ними щодо...” Пауза: “... адміністративних змін.”\n\nЛицарі підвелись і хутко розійшлися. Йорктон почав ходити по залу — він виграв трохи часу. Залишалося вирішити останню справу, перш ніж утвердити свою владу: відрубати змії голову."
nf_dln.15.a:0 "Довгоочікуваний трон нарешті був його."

nf_dln.16.t:0 "Їхній день настав"
nf_dln.16.d:0 "Йорктон швидко вирівняв поставу на троні, коли процесія лицарів і палацової гвардії увійшла до зали трибуналу. І суддя, і присяжні — ті ліворуч, ті навпроти нього — обернулися, спостерігаючи, як озброєні чоловіки штовхнули короля Ґанна II та королеву Кетрін у центр залу. Яскраве світло падало згори прямо їм на голови. Лицарі знайшли їх, коли ті ховались у кутку прихованої кімнати — голова короля занурена в обійми ридаючої королеви. Минуло вже кілька днів, але Йорктон досі помічав сліди дорогого підводки на щоках жінки. Його погляд упав на впалого короля — порожній, закам’янілий погляд. Хіба саме це він уявляв як тріумф усі ці роки? Оболонка людини на межі божевілля та його розпусна супутниця?\n\nСуд тривав годинами. Суддя методично зачитував перелік усіх адміністративних провалів, зловживань владою й бездумних воєн, що трапились за правління Ґанна. Упродовж засідання донька Йорктона, Елеонор, яка стояла біля нього поруч із особистою вартою короля, виглядала дедалі неспокійнішою. Коли суд добігав кінця, вона нахилилася й обережно смикнула батька за рукав: “Тату, можна слово?”. Йорктон кивнув до судді, легенько піднявши руку. Той гучно виголосив: “Присяжні йдуть на нараду.”\n\nЕлеонор повела Йорктона до сусідньої кімнати, зачинивши двері: “Тату, я розумію — ти вважаєш, що залишити короля живим — надто великий ризик, але...” Вона опустила погляд: “Прошу, пожалій королеву Кетрін. Навіть як консорт, вона завжди служила людям. Я сама це бачила! Вона не заслуговує на те, що чекає Ґанна.” Йорктон підняв брову: “О? Пара місяців у його дворі — і вже подружилася?” Він знизав плечима: “До того ж, рішення за присяжними...” Елеонор перебила: “Присяжними, яких ТИ обрав? Я в дитинстві у лицарів з половиною з них гралася.” Йорктон хотів щось сказати, але вона продовжила: “Прошу. Якщо потрібно — ув'язни її. Але ця кров... вона зайва.” Вона ступила ближче: “Тату — ким ти мрієш стати як лідер?” Вона відвела погляд, розчаровано: “Той Північний Меч, про якого я чула в дитинстві, — він би знав відповідь.”"
nf_dln.16.a:0 "“Обіцяю — з нею нічого не станеться.”"
nf_dln.16.b:0 "“Твої зауваги занотовано.”"

nf_dln.17.t:0 "Щорічна королівська наукова виставка"
nf_dln.17.d:0 "Йорктон зітхнув, коли до тронної зали увійшла ще одна група королівських службовців, несучи чергові стоси заявок на першу Королівську наукову виставку Ланґенбурґу. Відколи було оголошено набір, натовпи інженерів, учених — і, будемо чесні, аматорів — з усього королівства тягнулися до палацу в надії потрапити на показ. І це ще не враховуючи десятки офіційних подань від радників короля. Те, що починалося як цікава ідея для підвищення репутації королівства в галузі науки, швидко перетворилось на бюрократичний кошмар, що відволікав Йорктона від справ держави.\n\nПерш ніж головний радник з науки встиг вийти з зали, аби принести ще більше заявок, король схопив його за комір і відвів у кут: “Я починаю підозрювати, що нам потрібен більш суворий підхід.” Бюрократ нервово всміхнувся: “Що саме ви маєте на увазі, мій лорде?” Йорктон почесав підборіддя: “Почнемо з визначення теми для цьогорічної виставки. Це допоможе нам знайти власну нішу...” І, можливо, зменшити кількість паперів, подумав король. Службовець закивав: “Чудова ідея, ваша світлість! Це точно зацікавить фахівців з усього регіону.”\n\nКороль кивнув: “Отже...”"
nf_dln.17.a:0 "“...Хай наші машини ревуть на всю округу.”"
nf_dln.17.b:0 "“...Ти згадував про нові археологічні відкриття?”"
nf_dln.17.c:0 "“...То як із мікрочипами — працюють?”"
nf_dln.17.e:0 "“...Який цього сезону врожай?”"

nf_dln.18.t:0 "Її спадок збережено"
nf_dln.18.d:0 "Мандруючи селами Ланґенбурґу, Йорктон бачив лише усмішки своїх підданих і процвітання своїх земель. Він попросив Александера приєднатися до чергового патруля Лицарів — особливої, двічі на рік церемонії, покликаної як обстежити герцогство, так і показати народу боєздатність армії. Хоча для жителів Ланґенбурґу це вже стало буденним дійством, присутність короля цього разу вивела на вулиці майже всіх, незважаючи на мороз Манітоби.\n\nОдна думка промайнула в голові Йорктона, поки він вдивлявся в обрій: за весь час свого правління, скільки зусиль він поклав на збереження цілісності Королівства — і майже не думав про сам Ланґенбурґ. І чому мав би? Фундамент уже був закладений десятиліттями раніше: довге правління Софі принесло безліч інфраструктурних проєктів, технологічних зрушень і нових економічних можливостей. Насправді, він лише підтримував вже налагоджену систему — і по змозі розширював її на решту Королівства.\n\n“Це завжди була твоя воля, правда ж, Софі? Саме тому ти обрала мене.” — подумав він. Навіть у свої останні миті, вона знала, що невичерпні амбіції Йорктона стануть найкращим інструментом для її бачення. І, принаймні наразі, історія підтвердила її правоту. Її спадок був збережений — але справжньою безпекою це стане лише тоді, коли світло Ланґенбурґу сягне всієї Півночі та засяє крізь зоряне нічне небо.\n\nА для цього... слід було працювати далі. Все, на що Йорктон міг сподіватися — що вона надалі спостерігатиме за ним."
nf_dln.18.a:0 "“Не можу дозволити, щоб люди бачили мене таким...”"

nf_dln.19.t:0 "Монохромні спогади"
nf_dln.19.d:0 "Старий Літній Двір, хай навіть у руїнах, був знайомим видом для лорда. У юності він часто відвідував його з батьком та Софі під час гучних світських вечірок, що маскувалися під державні бенкети. Самого Двору більше не було — і все ж крізь руїни стирчали обідні стільці, непохитні.\n\nСидіння родини Анже — найбагатших серед усіх, поряд — герцогів Дофін, знаних за свої таланти на озері. Навпроти — місце, призначене для дому Ворвік, майстрів машин… їхнє крісло лишалося порожнім найдовше. Поряд — почесне місце герцогства Абсалон, а в центрі — найпишніше з усіх, трон короля.\n\nМовчання било в вуха. Зали, колись сповнені веселощів і сміху, тепер лише скрипіли гнилими дошками та пищали щурами. Рішучість Йорктона хиталася — його ненависть до декадансу монархії змагалася зі спогадами: як старий герцог Дофін нишком пригощав його цукерками, як юна герцогиня Анже брала на човен, як лорд Абсалон вихвалявся своїми іграшками.\n\nТеплі спогади змінились монохромними руїнами, коли солдат закричав: “Мій лорде, вийдіть негайно! Воно ось-ось завалиться!”. Король ще раз поглянув на стільці — і виліз із уламків."
nf_dln.19.a:0 "Я все виправлю — обіцяю вам"

nf_dln.20.t:0 "Ці прекрасні вогні"
nf_dln.20.d:0 "Все більше глядачів збиралося на краю центральної вулиці Дофіна, поки король Йорктон і королева-консорт Беллорес проїжджали повз ринок верхи, супроводжувані невеликим загоном гвардійців. Йорктон озирнувся, всміхаючись, коли побачив, як його дружина махала людям, яких колись боялася ніколи більше не побачити: “Насолоджуєшся краєвидами?” — пожартував він. Вона нахилилася й поцілувала його в щоку: “Авжеж”.\n\nКортеж незабаром прибув до Королівського порту. Вид — вражав. За кілька місяців королівська пара перетворила колишню занедбану пристань на жвавий верф — справжню перлину Королівства.\n\nПоряд із вимощеними вулицями шикувалися як могутні галери, так і сучасні швидкісні човни. І навіть серед ночі можна було побачити робітників, що метушилися між складами, намагаючись, мабуть, випередити конкурентів у виконанні квот.\n\nКороль знову глянув на Беллорес, а блиск в її очах видав справжні емоції: “Ти впевнена, що з тобою все гаразд?” — запитав він. Вона відповіла, хрипким голосом: “Просто… я не очікувала, що ми зможемо так швидко все змінити.” В ту мить Йорктон відчув гордість. Саме заради цього він боровся, саме за це терпів стільки років: за відновлення слави Королівства і посмішки свого народу. Він відповів: “Тоді, моя пані, тобі слід мати вищі очікування.”\n\nЗадоволений побаченим, він наказав загону повертатися, міцно тримаючи Беллорес за руку, поки скакав у ніч."
nf_dln.20.a:0 "“Мені це справді було потрібно.”"

nf_dln.21.t:0 "Відновлення дому Вейберн"
nf_dln.21.d:0 "Протягом кількох тижнів Александер переходив від поселення до поселення на руїнах Конгресу Метисів, ведучи загартовані загони лицарів, аби придушити осередки повстання ще до того, як вони перетворяться на серйозну загрозу. Нарешті, він дістався місця, до якого прагнув від самого початку. Його люди в'їхали в містечко Вейберн, звідки надходили повідомлення про групу лоялістів, що планували втекти через кордон до інших вигнанців. Він наказав своєму заступнику очолити переслідування, а сам вирушив... у особисту справу.\n\nКоли він скакав у дощі до своєї цілі, йому згадалися останні слова короля Йорктона: “Александере, сину мій, нагода нарешті настала — час повернути те, що належить твоєму роду.” І цього було досить.\n\nЗа кілька хвилин він прибув: перед ним стояли залишки древнього маєтку Вейбернів, передаваного з покоління в покоління — аж до трагедії. Він чув оповіді про той день: про натовпи під воротами; про їхню незламність; і про вугілля та попіл, якими їх за це “нагородили”.\n\nАлександер пробирався крізь руїни, пройшов під гнилою аркою, допоки не знайшов залишки великого каміна у центральній залі. І досі на ньому лежав герб родини — під товстим склом. Він розбив захист і обережно підняв прапор, пригортаючи його до грудей.\n\nВін окинув поглядом все навколо; попереду було багато роботи. Але саме в цей день почалося відродження дому Вейберн. І з ним — відновлення спадщини, яка колись несла мир і добробут цим землям."
nf_dln.21.a:0 "“Я зроблю тебе гордим, батьку.”"

nf_dln.22.t:0 "Повернення Старого Режиму"
nf_dln.22.d:0 "Вояки встали на ноги, коли король Йорктон в'їхав до табору на околицях Реджайни. Оскільки операція з “миротворення” міста затягнулася у криваву партизанську війну, він вирішив особисто приїхати, щоб підняти мораль духу як “Меч Півночі”.\n\nЙорктон зустрів командир батальйону — кремезний бородань з пов'язкою на оці та втомленим поглядом: “Вітаю, мій лорде. Дозвольте показати вам усе...” Поки король йшов табором, бійці виходили з наметів і ставали на коліна в пошані. Йорктон вітав їх усіх, але його серце обтяжувалося кожним знівеченим тілом та пораненням, що потрапляли йому на очі.\n\nВрешті-решт він дійшов до центру табору, де було зведено шибениці. На них висіли цивільні з табличками на шиї: “ЗРАДНИК”. Йорктон відвів командира вбік: “Що це в тебе? Військовий табір чи м'ясна лавка?” Той розгубився: “Мій лорде… ми подаємо приклад.”\n\nЙорктон знову глянув на шибениці… ні. Не так: “Зменшити масштаби. Страт лише найзапекліших фанатиків. Ми повертаємо старі порядки, а не створюємо нові криваві.” Командир, хоч і розчарований, відповів: “Так, мій лорде.”\n\nНаступні кілька годин король провів, спілкуючись з пораненими та новобранцями. В його думках пульсувала одна фраза — все буде гаразд. Незабаром. Треба лише трохи почекати. Ще трохи…"
nf_dln.22.a:0 "“Мабуть, став м'якшим з віком...”"

nf_dln.23.t:0 "Задумлива прогулянка"
nf_dln.23.d:0 "Йорктон неквапливо крокував коридорами трибуналу, в голові лунали слова доньки. Він підходив до дверей кімнати, де зібралося журі для обговорення долі королівського подружжя. Біля входу стояли двоє досвідчених лицарів: “Мій лорде — все гаразд?”\n\nГарне питання. Варто було йому лише слово мовити — й ці чоловіки “порадили” би членам журі, що королева Кетрін не винна у злочинах чоловіка. Але він не міг уявити майбутнє, де дозволити дихати представниці поваленого монаршого дому не обернеться лихом…\n\n“...Мій лорде?” — Йорктон вирвався з думок:"
nf_dln.23.a:0 "“Щодо королеви Кетрін…”"
nf_dln.23.b:0 "“Я, мабуть, звернув не туди. Продовжуйте службу.”"

nf_dln.24.t:0 "Меч, що втрачає гостроту?"
nf_dln.24.d:0 "Йорктон відкинувся на спинку трону, коли Суддя та Присяжні повернулися до зали. Його щока вперлася в стиснутий кулак — він замислено спирався на підлокітник.\n\nЗа мить з бічних дверей вийшов помічник і передав аркуш паперу Судді. Той поправив окуляри та швидко пробігся очима по тексту: “... Добре.” Він кивнув до Присяжних.\n\nЧоловік у трибуні підвівся та почав читати: “Після ретельного розгляду доказів, Присяжні визнають Ґанна II винним за всіма пунктами.” Без вагань Суддя обернувся до підсудного: “За ваші злочини проти королівства, я засуджую вас до страти через повішання. Вирок буде виконано на світанку.” Він кивнув Лицарям на варті: “Заберіть його.”\n\nЛицарі вивели Ґанна з зали. Увесь час його погляд залишався порожнім. Кетрін впала на коліна, тихо ридаючи.\n\nЗа мить представник Присяжних продовжив: “Щодо колишньої королеви-консорти... Хоча Присяжні визнають її співучасть у злочинах чоловіка, ми також визнаємо її спроби стримати найгірші прояви правління. Тож ми пропонуємо м’якше покарання.” Суддя кивнув: “За ваші злочини проти королівства, я засуджую вас до п’ятнадцяти років ув’язнення.” Кетрін підняла на нього очі, повні сліз, перш ніж знову знепритомніла.\n\nЙорктон кинув погляд на Елеонору. Її теплі очі наповнились вдячністю. Вони обмінялися слабкою посмішкою. Новий король подбає, щоб камера Кетрін була якомога комфортнішою. А далі... залишалося лише сподіватися, що це милосердя не стане фатальною помилкою."
nf_dln.24.a:0 "Це було правильно… чи не так?"

nf_dln.25.t:0 "Питання Гудзонової компанії"
nf_dln.25.d:0 "Суддя фиркнув, перегортаючи купу документів на столі: “Останнє питання порядку денного... приватизація Гудзонової компанії.”\n\nАх так — Гудзонова компанія. Цікавий випадок. Згідно зі старими архівами, вона існувала ще задовго до Війни — починала як хутряна торгівля, а з часом перетворилася на торговельну імперію, що охоплювала всю Канаду. Не дивно, що її вплив зберігся навіть після Великої Війни, і вона де-факто керувала частиною півночі аж до створення королівства. І навіть після того старий режим не наважився поставити її на місце, дозволивши фактично створити ще одне герцогство — до сьогодні.\n\nЙорктон не любив безликих правителів. У хаосі, що настав після його перевороту, він наказав невеликому загону лицарів таємно заарештувати правління компанії та конфіскувати її активи. Залишився лише один очкарик, який представляв компанію у суді. Але доля вже вирішена. Все, що залишалося — це вирішити, як саме оголосити про неї світові."
nf_dln.25.a:0 "“...Компанія підпорядковуватиметься напряму Короні.”"
nf_dln.25.b:0 "“...Підприємство буде виставлено на аукціон.”"

nf_dln.26.t:0 "Розбійники й злодії"
nf_dln.26.d:0 "Ніхто не сперечався з тим, що рейдерів на узбережжі озера треба приборкати. Але що ж робити з найманцями Арборґа?\n\nВони не були варварами чи божевільними — дисципліновані, просто відмовлялися служити чомусь вищому за себе. Якщо знайти з ними компроміс, зробити їх повноправними підданими — це можна виправити. До того ж досвідчена рука в дикому прикордонні не завадить.\n\nТа чи може король довіряти тим, хто вже раз зрадив його у найскрутніший момент? Що завадить їм зробити це знову? А ще — чи не виглядатиме це як офіційне схвалення самосуду, що в столиці точно не оцінять?"
nf_dln.26.a:0 "Відтепер вони — громадяни Манітоби, всі до одного."
nf_dln.26.b:0 "Мабуть, краще ввічливо відпустити їх."

nf_dln.27.t:0 "Нічна прогулянка"
nf_dln.27.d:0 "Король Йорктон вийшов із королівської карети, припаркованої в бічному провулку неподалік центру. Насунувши каптур, він рушив до головної вулиці, де почув позаду голос Тобіаса: “Ваше Величносте, будь ласка, повертайтеся за годину. І гукайте, якщо буде небезпечно!” Йорктон відмахнувся. Ледве вмовив Александера дозволити нічну прогулянку без охорони — та ще й під прикриттям. Не збирався зараз давати привід для «Я ж казав».\n\nПоблукавши кілька хвилин базаром у Давфіні, він вийшов на Королівський порт. Видовище вражало. За кілька місяців Йорктон перетворив колишню занепалу пристань на процвітаючий корабельний док — справжню перлину королівства. Вздовж брукованих вулиць шикувалися як старі галери, так і сучасні катери. Навіть уночі робітники снували між складами, намагаючись перевиконати план.\n\n“Гей, посунься, старий!” — буркнув якийсь робітник, штовхнувши Йорктона. Добре, подумав король — ось такий запал і потрібен, аби відродити славу держави. Задоволений побаченим, він поволі рушив назад, тихо насвистуючи."
nf_dln.27.a:0 "“Саме цього мені й бракувало.”"

nf_dln.28.t:0 "Помста — страва холодна"
nf_dln.28.d:0 "Йорктон сидів на тимчасовому троні, встановленому на дерев’яній сцені в центрі Уінніпеґа минулої ночі. На протилежному кінці площі височіли шибениці, у всій своїй Старосвітській «славі». Колись тут страчували найжахливіших злочинців — та ті часи давно минули.\n\nТого ранку крижаний вітер Уінніпеґа зустрів тих, хто колись зрадив свій народ — Республіканця, Олігарха та Пророка. Всі троє стояли на сцені, оточені вірними солдатами, готовими нарешті віддати борг справедливості.\n\nУ натовпі стояли різні піддані: від юнаків, що прийшли за видовищем, до старих, що десятиліттями мріяли про такий катарсис. Незалежно від віку, ненависть була відчутна — у вигуках, у гнилих плодах і екскрементах, що летіли з перших рядів. Йорктон сам хотів би кинути щось, хотів би власноруч стиснути шию тих, хто украв у нього майбутнє.\n\nАле він служив вищій меті. Спершись на кулак, король мовчки дочекався, поки кат завершить перелік злочинів. Той кинув на нього погляд. Йорктон злегка змахнув зап’ястям — і кат зробив те ж саме.\n\nПідлога впала з-під ніг зрадників, їхні тіла сіпались у петлях, а площу наповнив рев натовпу. Секунди. Усе, що знадобилось, щоб змити пляму з історії Манітоби. Відтепер можна дивитися вперед."
nf_dln.28.a:0 "“Історія забуде ваші імена.”"

nf_dln.29.t:0 "На сцену виходить Доля"
nf_dln.29.d:0 "Лицарі не були готові до того, що їх чекало в старій лабораторії — спотворені тіла, вироджені за межею людського. До жаху ветеранів, деякі з менш понівечених істот мали схожість із солдатами, які зникли під час хаосу після атаки Електоралів.\n\nВони просувались глибше, хвилі потвор слабшали, повітря ставало чистішим. І нарешті — коридор, на диво чистий. У його кінці — зал із моніторами, що показували постать дівчини в незвичних шатах.\n\n“Привіт, народ! Я — Дестіни!” — роздався цифровий, спотворений голос. Вона глузувала, погрожувала, благала. Але фокусів у неї не залишилось. Лицарі ж — розпалені. Один за одним розбивали сервери, поки лиш не залишився єдиний екран.\n\n“Чекайте! Вам варто взяти мій накопичувач! Там багато корисного — ваш бос точно буде зацікавлений!” — закричала вона. Командир підійшов ближче. Він не був експертом у машинах, але дурнем не був. Така система точно мала запасні варіанти... і все ж — а раптом це правда?\n\nВін озирнувся на своїх людей:"
nf_dln.29.a:0 "“Заткніть цю машину, хлопці.”"
nf_dln.29.b:0 "“... Заберіть накопичувач.”"

nf_dln.30.t:0 "У добрі й лихі часи"
nf_dln.30.d:0 "Схід охоплене пеклом. Інакше не скажеш. Наче сама земля розкололася — неймовірні потвори та гнилі машини б’ються за уламки зруйнованих земель просто під нашими мурами. Немає спасіння. Немає надії."
nf_dln.30.a:0 "“Негайно послати підкріплення до стін!”"

nf_dln.31.t:0 "Чи може імперіалізм почекати?"
nf_dln.31.d:0 "Ранком Вовк-що-виє увійшов до ратуші міста Перевал, його охорона слідувала слідом. Йорктон сидів у кінці довгого довоєнного столу, а його лицарі пильно вивчали кожного представника Конфедерації: “Прошу, сідайте — маємо багато чого обговорити.” Вовк зиркнув на нього холодним поглядом, у якому таїлася тривога.\n\nЙорктон мав усі карти на руках. І він, і Вовк це розуміли. Сьогоднішня розмова могла вирішити — війна чи мир. Угода з племенами й відмова від частини північних територій зекономила б чимало ресурсів. Але що варте слово народу, загнаного в глухий кут?\n\nКороль підвівся зі свого місця:"
nf_dln.31.a:0 "“Радійте — сьогодні війна не прийде до вашого народу.”"
nf_dln.31.b:0 "“Королівство Манітоба заявляє свої права на північ.”"

nf_dln.35.t:0 "Інвестиційні хартії"
nf_dln.35.d:0 "“Дякую, що погодилися прийняти мене, мій лорде,” — вигукнув представник Компанії Гудзонової затоки, заходячи до тронної зали. Маленький чоловік, з ніг до голови вдягнений у витончене довоєнне вбрання: “Я ніколи й не сумнівався, що такий амбітний чоловік як ви не пропустить таку нагоду.” Йорктон вже відчував, куди хилитиметься розмова: “Ну, викладайте свою справу... стисло, якщо можна.”\n\nОбличчя чоловіка засяяло посмішкою: “Звісно, сер.” Він розстебнув пальто й витяг величезний плакат, який ледве вміщався в кишені. Розгорнув карту Королівства з адміністративним поділом, де червоними колами були позначені міграційні потоки. Найбільше — у колишньому герцогстві Абсалон: “Як бачите, за останній рік землі довкола міста Гудзон-Бей прийняли найбільшу кількість переселенців. Дехто рушив на фронтир, дехто осів, але більшість працює — як ви вже здогадались — на нас!”\n\nЙорктон насупився від цієї показухи: “І до чого тут усе це?” Представник стримав усмішку: “Бізнес процвітає! Роботи — хоч відбавляй, але нам бракує інфраструктури та персоналу. Якщо з королівської скарбниці виділити трохи коштів, ми зможемо розширити відділи. Але якщо виділити більше... тоді ви побачите наші філії по всьому Півночі, як гриби після дощу.” Чоловік замовк, мабуть зрозумівши недоречність метафори: “Звісно, спершу буде адаптація, але потім — ой, яка вигода, мій лорде.”\n\nЙорктон почухав підборіддя. Справді, Компанія показала себе надійним роботодавцем у Півночі. Але якщо чогось люди бояться більше за мутантів — так це монополій. Відмова точно сподобається дрібним підприємцям..."

nf_dln.35.a:0 "“Отримаєте рівно стільки, щоб утриматись на плаву. І жодного шеляга більше.”"
nf_dln.35.b:0 "“Ось вам відкритий чек. Жодна людина в місті не має голодувати.”"
nf_dln.35.c:0 "“Адаптуйся або помри, друже. Це закон Півночі.”"

nf_dln.34.t:0 "Інвестиційні хартії"
nf_dln.34.d:0 "“Дякую, що знайшли час, мій лорде,” — мовив радник Корони, що відповідав за Компанію Гудзонової затоки, увійшовши до тронної зали. “Як я зазначав у листі, ми завершили звіт про ефективність. Дозвольте презентувати.” Йорктон кивнув.\n\nПрезентація тривала годину, повна сухих цифр і статистики. Та раптом — щось привернуло увагу короля. “Повторіть,” — перервав він. Радник відшукав сторінку: “Останнім часом найбільше переселенців осіло навколо міста Гудзон-Бей — більшість працює на Компанію.”\n\n“А як зі штатами?” — спитав Йорктон. “Кажу чесно, мій лорде — ми на межі. Навіть серед підрядників.” Він додав: “При поточних витратах прибутки скоро стабілізуються.”\n\n“Що пропонуєш?” — “Разове велике фінансування — і ми зможемо відкрити нові офіси не лише в місті, а й у довколишніх поселеннях. Певний час прибутки просідатимуть, але довгостроково — це окупиться.”\n\nЙорктон замислено почухав підборіддя."

nf_dln.34.a:0 "“Отримаєте рівно стільки, щоб утриматись на плаву. І жодного шеляга більше.”"
nf_dln.34.b:0 "“Ось вам відкритий чек. Жодна людина в місті не має голодувати.”"
nf_dln.34.c:0 "“Адаптуйся або помри, друже. Це закон Півночі.”"

nf_dln.36.t:0 "Повернення кузена"
nf_dln.36.d:0 "“Що ти маєш на увазі — впустив? Я ж сказав —”\nЗнайомий голос прорізався з-за спини маршала: “Ей, Ліфі!” Йорктон зітхнув, зібравши залишки терпіння. Обернувшись, він побачив перлинну усмішку та полум’яне волосся свого кузена: “Привіт, Еріку. Минуло чимало часу.”\n\nЕрік сів перед його столом, закинувши ноги на поверхню: “Ще б пак.”\n\nЙорктон зітхнув: “Уже висмоктав все з янкі?”\nЕрік театрально приклав руку до серця: “Гей, я лише пропоную послуги. Якщо замовник не задоволений — це вже його проблема.”\n\n— “Чого ти хочеш, Еріку? І, будь ласка, забери ноги, стіл новий.” — Ерік послухався, нахилившись ближче: “Коротше, мені потрібна нова справа. Назад на Схід мені дорога закрита, а кажуть, ти тут великі справи провадиш.” — підморгнув він.\n\nЙорктон вже готував відмовку, як раптом зупинився. Колись Королівство Манітоба володіло всіма головними річками регіону, і торгівля була його найбільшим надбанням. Ці часи минули, але, можливо… він зможе повернути цю велич. А для цього потрібні люди, які вміють вести справи на воді. Ерік був шахраєм, але в торгівлі розумівся.\n\nЙорктон зітхнув: “Можливо, буде для тебе щось... але зачекай.” — Ерік підскочив: “Я знав, що можу на тебе покластися! Ті брехуни з пабу були не праві!” І з цими словами вийшов, насвистуючи."
nf_dln.36.a:0 "“Зачекай... а що вони казали про мене?”"

nf_dln.37.t:0 "Форма парламенту"
nf_dln.37.d:0 "“Саме так,” — відповіла Елеонора. “Попри всю впевненість у своїх переконаннях,” — вона посміхнулась: “я помиляюся. І так само будуть помилятися мої наступники.” Кабінет насторожився. Попередні регенти не претендували на божественне право, але й не зрікалися його так відкрито. “Ланцюги, що тримають Королівство, мають стати міцнішими. Тому я засную обрану палату представників від усіх регіонів Манітоби.”\n\nЛица присутніх похмурішали: доки вона піде у своїх реформах? Елеонора зробила паузу, відчувши їхні погляди:"
nf_dln.37.a:0 "...Отримає повноваження пропонувати нові закони.”"
nf_dln.37.b:0 "...Слугуватиме громадським форумом.”"

nf_dln.39.t:0 "Нова твердиня Йорктона"
nf_dln.39.d:0 "“...Впевнений, ви погодитесь, що це на краще?” — Віконт О’Браєн нервово ходив королівською залою. “Я лише застерігаю, мій лорде, у мене замало людей, щоб захистити сотні поселенців.”\n\nЙорктон відрізав: “Я не бачу проблеми. Я дав тобі карт-бланш: зброя, золото — все маєш.” Він наблизився: “Ти ж ведеш рахунки, правда? Здається, твій спосіб життя вимагає цього.”\n\nО’Браєн відвів погляд: “...Як накажете, мій лорде. Коли чекати переселенців?” — “Найближчими тижнями. Надішлю чиновників з Дауфіна організувати пором. Я пообіцяв їм житло. Сподіваюсь, не підведеш?”\n\n— “Звісно... мій лорде.” — пробурмотів він і вийшов.\n\nЙорктон сів на трон. Навіть дикуна можна привчити, якщо тримати палицю достатньо великою. А що може бути кращим дресируванням, ніж поселити їх поруч із простими манітобцями?"
nf_dln.39.a:0 "“Добрий віконт ще навчиться слухати.”"

nf_dln.40.t:0 "Пан приходить по своє"
nf_dln.40.d:0 "Кур'єр прибув серед ночі з листом, запечатаним гербом дому Йорктонів. Меч Півночі нарешті постукав у двері.\n\nПід час Першої війни з республіканцями Плезантдейл скористався хаосом і захопив Вадену з околицями, поки колишній маршал Ланґенбурґа був на Півдні. Дехто попереджав, що це аукнеться. І ось — той час настав.\n\nСеред формальностей листа чітко читалося ультиматум: віддайте окуповані землі або пожинайте наслідки."
nf_dln.40.a:0 "У нас немає вибору, мусимо погодитись."
nf_dln.40.b:0 "До біса Йорктона. Хай спробує." 

nf_dln.41.t:0 "Меч із двома лезами"
nf_dln.41.d:0 "Йорктон сидів у своєму троні, коли Суддя й Присяжні знову увійшли до зали. Його щока впала на кулак, він замислено сперся на підлокітник.\n\nЗа мить помічник вийшов з бічних дверей і передав записку Судді. Той поправив окуляри, пробіг очима текст: “... Добре”. Він кивнув у бік присяжних.\n\nОдин із них встав і почав читати з книжечки: “Після ретельного розгляду доказів, Присяжні визнають Ґанна II та його дружину винними за всіма пунктами.” Без вагань Суддя звернувся до звинувачених: “За ваші злочини проти держави я засуджую вас обох до страти через повішення. Виконати вирок на світанку.” Він кивнув Лицарям: “Заберіть їх.”\n\nКоролівське подружжя мовчки вивели. Йорктон кинув погляд на Кетрін. Вона здавалася... спокійною. У маршала здавило в горлі.\n\nВін глянув туди, де мала бути Елеонора — але замість неї побачив суворе обличчя охоронця. Краєм ока встиг побачити, як зачиняються двері бічного виходу. Він зітхнув — надто молода, щоб зрозуміти. Але вона зрозуміє. Не сьогодні — але зрозуміє.\n\nЧи варто було краще підготувати її до цього? Ні… дитина просто наївна."
nf_dln.41.a:0 "“Закінчимо з цим, гаразд?”"

nf_dln.42.t:0 "Гостре лезо меча"
nf_dln.42.d:0 "Йорктон сидів у своєму троні, коли Суддя й Присяжні повернулись до зали. Його щока впала на кулак, він замислено сперся на підлокітник.\n\nНевдовзі помічник передав Судді записку. Той поправив окуляри, глянув на текст: “... Гаразд”. Кивнув присяжним.\n\nОдин із них встав і оголосив: “Після розгляду доказів, Присяжні визнають Ґанна II та його дружину винними за всіма пунктами.”\n\nСуддя, не вагаючись: “За злочини проти королівства я засуджую вас до страти через повішення. Страта — на світанку.” Кивок Лицарям — і королівську пару виводять. Вони не пручаються. Йорктон ще раз подивився на Кетрін. Вона... була спокійною.\n\nЕлеонора ж не змогла зустріти його погляд. Її очі блищали від стриманих сліз. Вона зрозуміє. І їй теж доведеться приймати такі рішення.\n\nКраще нехай посумує зараз."
nf_dln.42.a:0 "“Закінчимо вже з цим.”"

nf_dln.43.t:0 "Питання королівської санкції"
nf_dln.43.d:0 "Елеонора задумалася над словами радника. Поки триває перебудова державного устрою, сильні виконавчі повноваження регента можуть бути корисними — для швидкого проведення реформ.\n\nТа що буде після її смерті? Або коли розум затьмариться з віком? Королівський кабінет зібраний з найкращих умів Манітоби. Можливо, час дозволити цим структурам діяти самостійно?\n\nВона обернулась до радника: “Можливо і так..."
nf_dln.43.a:0 "...Ми збережемо королівську санкцію для ключових питань держави.”"
nf_dln.43.b:0 "...Але рішення вже ухвалене. Санкція замінюється голосом кабінету.”"

nf_dln.44.t:0 "Останнє слово"
nf_dln.44.d:0 "“Ось у чому наша проблема,” — сказала Елеонора. “Судді в столиці отримують найкращу освіту, мають зв’язки, династії... Вони стали самовдоволеними.” Радник здригнувся — адже його син якраз нещодавно стрімко піднявся в міністерстві. Елеонора всміхнулась.\n\n“І ще — як ми можемо сподіватися на лояльність нових підданих, якщо їх не представляють у владі?” Вона похитала головою: “Я наказую розширити набір кадрів із регіонів — негайно.” Радник похнюпився: “Вашу волю буде виконано, Ваша Високосте.”"
nf_dln.44.a:0 "З часом вони пишатимуться, що є манітобцями."

nf_dln.45.t:0 "Хто має право голосу?"
nf_dln.45.d:0 "Питання неминуче. Політичне представництво — це влада, а її треба довірити обачно. Народ Манітоби ніколи не правив сам собою. А цензура минулого тільки поглибила цю проблему. Та чи прийме це знать?\n\nПроте зараз — момент ідеальний. Корона на піку популярності, регент користується плодами перемог батька. Коли ж, як не зараз, зірвати цей пластир?\n\nЕлеонора звернулась до Тобіаса:"
nf_dln.45.a:0 "“Усі громадяни Манітоби.”"
nf_dln.45.b:0 "“Фінансово незалежні.”"
nf_dln.45.c:0 "“Власники землі, що тяжко працюють.”"
nf_dln.45.e:0 "“Ті, хто має кровні зв’язки з Королівством протягом поколінь.”"

  nf_dln.46.t:0 "Початок Завтрашнього Дня"
  nf_dln.46.d:0 "Тобіас зачинив дерев’яні двері зали для нарад, коли останній член Королівського Кабінету зайняв своє місце за столом; Елеонор почала говорити: “Всі ви вже тут – добре. Я хочу розпочати сьогоднішнє засідання з одного запитання.” Вона нахилилась уперед: “Більшість присутніх служила під час початку Війни Республіканської Коаліції – скажіть мені: що розпалило вогонь того конфлікту?” У кімнаті здійнявся гомін – нечуваний тон королівського самоаналізу залишив радників без слів.\n\nЕлеонор швидко підхопила нитку бурхливої дискусії, що зароджувалась у залі: “Однієї відповіді недостатньо. Ми стали жертвами численних проявів інституційного занепаду. Жадібність, корупція, самозаспокоєність; повзуча отрута всіх мирних режимів.”\n\nВона зробила паузу, дозволивши її їдким словам осісти у свідомості присутніх; для неї це було давно назрілим: “Республіканці прагнули політичного представництва, Старі Віруючі — побожності, якої їм не давали, а повстанці з числа Метисів — втечі від, як вони вважали, залізної руки влади.” Кабінет був приголомшений – за інших часів слова Елеонор межували б із змовою проти корони. “Землі, які вони колись займали – і навіть більше – тепер знову в наших руках. Скільки поколінь залишилось до наступного харизматичного революціонера?”\n\nВона підвелася зі свого місця: “Те, що я сказала під час своєї коронації, не було порожніми обіцянками, як, певно, більшість із вас вважала. Щойно ви вийдете з цієї зали, кожен з вас буде залучений до Проєкту Манітоби. Децентралізація влади, регіональне представництво, відповідальність держави — це єдині заходи, які здатні гарантувати майбутнє Королівства на століття вперед.” Її погляд ковзнув по обличчях присутніх, коли важка тиша накрила кімнату."
  nf_dln.46.a:0 "“Є запитання?”"

  nf_dln.47.t:0 "Людина чи Держава?"
  nf_dln.47.d:0 "Йорктона розбудила нічна тривога – весь мокрий, він задихався, борсаючись у переплутаних простирадлах. Він важко підвівся до вікна, що виходило на двір палацу, вдивляючись у темні води озера на горизонті, намагаючись заспокоїти дихання. Йому знову снився той сон. Імперський Палац у руїнах; міста Королівства охоплені полум’ям; Елеонор – він різко мотнув головою, проганяючи образ.\n\nМеч Півночі підіймав небеса задля втілення своїх амбіцій. Він довів, що всі критики помилялися – всі. І все ж із кожним днем, коли він не віддавав себе цілком управлінню державою, він віддаляв своїх підданих від спасіння. Як інакше, коли Північ досі кишіла негідниками та шукачами вигоди, готовими шматувати тіло Манітоби?\n\nВін поглянув на тремтячу руку, що стискала підвіконня. Час спливав. Він відчував це. Щоб забезпечити майбутнє своїх дітей, потрібно діяти негайно. Відновити загальний призов, готувати армію, рушити у похід і випалити землю до…\n\nЙого думки обірвались, коли двері до його покоїв різко розчинились. Елеонор покликала його: “Батьку!” Ймовірно, він наробив більше галасу, ніж думав. Вона поспішила до нього, ведучи його назад до ліжка: “Сподіваюсь, ти знову не пропускав свої ліки.” Йорткон не відповів — замість цього він подивився на доньку, проводячи рукою по її щоці.\n\nЕлеонор — його гордість, його зоряне світло, втілення надій Королівства. Людина, яку, попри її блискучий розум, ще не вважав готовою до управління державою, — юнацька довірливість і наївність затуманювали погляд, де мало бути залізне політичне чуття, якого вимагала сувора Північ. І все ж вона — та, хто колись успадкує усе, що він збудував. Чи справді Королівство було готове до правительки з такою непохитною візією?\n\nКоли Елеонор почала виходити з покоїв, Йорткон гукнув: “Елеонор –” Вона обернулась."
  nf_dln.47.a:0 "“Дякую, що навідалась. На добраніч.”"
  nf_dln.47.b:0 "“Завітай до мене вранці. Маємо, про що поговорити.”"

  nf_dln.48.t:0 "Завершити Те, Що Він Почав"
  nf_dln.48.d:0 "Телевізори — новинка і рідкість у Королівстві Манітоба. І все ж, вони мали силу розпалювати серця та похитнути переконання. Так і сталося для аристократії Манітоби, яка саме дивилася улюблену вечірню комедійну програму королівства. Для всіх інших — королівський заклик до збору у міських барах мав стати заміною.\n\nЕкрани по всьому королівству замиготіли, перш ніж показати фігуру Лейфа Йорктонна, що сидів на королівському троні, — легкий нахил камери підкреслював його величну поставу: “Піддані корони — дякую, що віддали кілька хвилин свого часу заради майбутнього держави. Прошу вас, тих, у кого пам’ять ще жива, заплющити очі та пригадати, якою була ситуація всього лише десятиліття тому. Що ви бачите?”\n\nВін зробив паузу, дозволяючи думкам своїх підданих розігратись: “Так… ви бачите це? Занедбані лікарні, зруйновані дороги, розбійники, що вільно гуляли землями без жодного солдата корони в полі зору. Вороги з усіх боків, що гризли наші кордони, прагнучи роздерти тіло, паралізоване боягузтвом верхівки. Тепер відкрийте очі — подивіться навколо.” Ще одна пауза. “Це прекрасно, чи не так? Ваші діти знову можуть вільно бігати під наглядом наших вірних вояків, можливості чекають за кожним рогом, а найнебезпечніші вороги розчавлені під чоботами кровних синів і дочок Манітоби. Але було б брехнею сказати, що роботу завершено — і я думаю, ви розумієте це краще за мене.”\n\nВін підвівся з трону. Настав час: “Сьогодні я проголошую відродження Британської Імперії, з нашим Королівством у самому серці. Бо тільки ми пролили кров, необхідну для повернення спадку легенди Старого Світу, на якій нас усіх виховали. Тільки ми маємо мандат і силу повернути цивілізацію в ці дикі землі, населені покидьками та потворами, які не вагаючись знищили б усе, за що ми боролись.”\n\n“Ми стоїмо на порозі історії. Я прошу вас лише про одне — віддати своє серце найславетнішому розділу нашого панування. Ваші імена житимуть вічно в пам’яті нащадків — як покоління, що змінило хід історії.” Він підняв кулак: “Хай живе Манітоба. Хай живе Британія.”"
  nf_dln.48.a:0 "Слава Імператору Йорктону!"

  nf_dln.49.t:0 "Донька Королівства"
  nf_dln.49.d:0 "Телевізори — новинка і рідкість у Королівстві Манітоба. І все ж, вони мали силу розпалювати серця та похитнути переконання. Так і сталося для аристократії Манітоби, яка саме дивилася улюблену вечірню комедійну програму королівства. Для всіх інших — королівський заклик до збору у міських барах мав стати заміною.\n\nЕкрани по всьому королівству замиготіли, перш ніж показати фігуру Елеонор Йорктон, що сиділа на королівському троні — серед глядачів пролунали подив і шепіт. Ліворуч від неї стояв Алекандер у церемоніальних обладунках, тримаючи корону Манітоби. Праворуч — Лейф Йорктон, вперше на публіці без прикрашеної коштовностями корони з часів падіння старого режиму. Першою заговорила Елеонор, одразу заявивши про свою владу: “Піддані корони — дякую, що присвятили час, щоби почути мої слова. Цього місяця мій батько повідомив мене про своє рішення зректися трону. Його причини особисті — але будьте певні, вони продиктовані його бажанням зробити якнайкраще для вас. Як наступна спадкоємиця Дому Йорктон, мені випало успадкувати корону.” Вона зробила паузу, даючи новині влягтись.\n\n“Перш ніж продовжити, я хочу бути повністю відвертою. Усе, що ми робили досі, було спрямоване на те, щоб забезпечити майбутнє Королівства. Ми намагались відтягнути його від краю прірви, яку багато з вас бачили на власні очі. Усі ви віддали кров і піт, щоби привести нас до цього моменту. І це не залишиться без винагороди.” Вона підвелася: “Від сьогодні Королівство Манітоба розпочне амбітну програму реформ — щоби зміцнити досягнуте і надати сили тим, хто допоміг цього досягти. Я працюватиму не покладаючи рук, день і ніч, щоб збудувати суспільство, яке уникне помилок минулого... і дивитиметься в світле майбутнє.”\n\nВона обернулась до Алекандера і кивнула. Лицар повернувся до неї, повільно опускаючи корону Королівства на її голову. Камера затримала цей момент кілька секунд, у той час як гімн держави лунав на повну гучність, і зображення поволі віддалялося, охоплюючи величний тронний зал, поки, зрештою, трансляція не обірвалась. Коли камери вимкнулися, нова Королева обернулась до батька, який знизав плечима: “Наступного разу затримай паузу трохи довше — з часом навчишся.” Елеонор усміхнулась, а Алекандер стримано посміхнувся. Вона обняла батька: “Дякую тобі, батьку.” Той відповів м’яко: “Ні… дякую тобі.”"
  nf_dln.49.a:0 "Попереду ще багато роботи."

  nf_dln.50.t:0 "Зцілення Наших Земель"
  nf_dln.50.d:0 "Загін лицарів прибув до площі Редмонда, несучи останню партію комуністичної літератури, яка ще зберігалась у міській бібліотеці. Книги швидко приєдналися до своїх попередників у вогнищі, запаленому раніше того вечора. Полум’я здійнялось вгору у шаленому танці червоно-помаранчевих барв, які відбивались в очах імператора. Йорктон прикрив повіки, дозволяючи теплому сяйву обійняти його обличчя.\n\n“Це була остання, мій лорде!” — вигукнув Алекандер, вириваючи Йорктонна з задуми. “Добре,” — відповів імператор, поправляючи плащ, у той час як нічний вітер рвався йому в щоки. “Ані звуку з цих міст, Алекандере. Їхні діти ніколи не дізнаються, що таке серп і молот. Чи ясно я висловився?” Алекандер грюкнув кулаком по грудях і рушив виконувати наказ."
  nf_dln.50.a:0 "Очищення історії починається з пера."

  nf_dln.51.t:0 "Пропозиція, Що Буває Раз у Житті!"
  nf_dln.51.d:0 "“Торговий бот, кажеш...” — пробурмотів Йорктон, відкидаючи голову назад з роздратуванням. Усе це було таким виснажливим. Алекандер зробив паузу, дозволяючи імператору зібратись, перш ніж продовжити: “Так, мій лорде. Вона — ТОБТО ВОНО — просить залишитись підключеним до мережі. В обмін пропонує або цифрові резерви Калгарі, або комплект зашифрованих креслень.”\n\nЙорктон поглянув на Алекандера й запитав: “А чому не може надати обидва?” Лицар опустив очі: “Процесор, здається, не витримує таке навантаження підряд.” Йорктон відкрив рота, щоби заперечити, але його перебили: “Ми вже протестували його до межі, мій лорде, не хвилюйтесь — воно каже правду.”\n\nЙорктон відкинувся на спинку крісла. Імперія зростає — і її оборонні сили мають не відставати. Але штучний інтелект, що вільно функціонує під ногами його народу... чи варто ризикувати?"
  nf_dln.51.a:0 "Забираємо креслення зброї."
  nf_dln.51.b:0 "Високотехнологічні комплекти інфільтрації, кажеш?"
  nf_dln.51.c:0 "І хто ж їх там збагачував, цікаво?"
  nf_dln.51.e:0 "Вимкни його, Алекандере. Воно не варте зусиль."

  nf_dln.52.t:0 "Останні Подихи Зрадника"
  nf_dln.52.d:0 "“Цікаво,” — пробурмотів Йорктон. “Стоїш приблизно так само, як і в останній нашій розмові.” Так, він пам’ятав. Маленьке створіння, що ховалося за ногою батька, щойно хтось із дорослих заходив до кімнати. Можливо, саме тому старий адмірал тягав його скрізь із собою — загартувати, показати світу, з чого зроблений хлопець.\n\nТа він так і залишився боягузом — до самого кінця. Його знайшли схованим у кутку своїх покоїв, за щитом із чоловіків, жінок і дітей. На колінах, з похиленою головою, в крижаному повітрі головної площі Батлфорда. Йорктон не став чекати на збір натовпу. Щойно хлопчисько закінчив виливати свою жовч, Йорктон кивнув кату — і сокира опустилася без зволікання.\n\nТим часом загін лицарів вирушив вилучати здобич останнього рейду — усе повернеться до королівської скарбниці. Що ж до мешканців Батлфорда — настав час скуштувати власного зілля. І зима вже не за горами. Нехай діти самі розгрібають уламки."
  nf_dln.52.a:0 "“Викинь тіло в річку — і збирайся.”"

  nf_dln.53.t:0 "Вірна Зустріч Під Зоряним Небом"
  nf_dln.53.d:0 "Старий склад у серці пустки. Непримітне місце для зустрічі трьох найвпливовіших постатей Півночі. Добре, подумав Йорктон — менше балачок, менше церемоній, ближче до справи.\n\nПодружжя увійшло до напівзруйнованої будівлі зі своїм невеликим загоном. Обоє схилили голови, сідаючи біля столу, зібраного з дощок із сусіднього села. Першим заговорив Джон Локгарт: “Імператоре Йорктоне, ви нас честите.” Емі-Лі Санделл додала: “Сказали б заздалегідь — ми б влаштували прийом гідний вашої величі.” Джон знову: “Та ваша скромність — ось що вас відрізняє.”\n\nЙорктон прокашлявся: “Так, ну... Ви знаєте, навіщо я тут.” Подружжя обмінялось поглядами й посмішками: “Звісно... Ваша Величносте, наскільки ви знайомі з нашими звичаями?” Йорктон зробив паузу: “Достатньо, щоби знати ваш гарт.” Емі-Лі відповіла: “Очаровані.”\n\nДжон продовжив: “Велика Зграя схиляється тільки перед найсильнішими воїнами. Ваша слава, можливо, випереджає вас.” Він окинув Йорктонна поглядом: “Але ще не пройшла випробування на нашій шкірі.” Емі-Лі додала: “Саме так.” Джон: “Двобій — з честю. Героїчна сутичка між нашими народами за долю Півночі. Лише найкращі візьмуть участь.”\n\nЕмі-Лі знову: “Але, мій любий... Чи справді цього хоче легенда, що сидить перед нами?” Джон поглянув на неї з розумінням: “Справжні воїни ніколи не стримуються. І якщо суперники рівні — тоді й бою не уникнути.” Вона звернулась до Йорктонна з крижаним поглядом: “Хто ти, Лейфе Йорктоне?”"
  nf_dln.53.a:0 "“Я — Імператор.”"
  nf_dln.53.b:0 "“Я — Воїн.”"

  nf_dln.54.t:0 "Королівська Поступка"
  nf_dln.54.d:0 "Лицарі прорвалися крізь ворота королівської зали, а вартових усередині вирізали миттєво. Подружжя спостерігало з трону, як Лейф Йорктон ступав повз тіла, що встигли вже вкритись пилом.\n\nДжон потер підборіддя, усмішка розцвіла на його обличчі: “Схоже, легенди були не марні.” Він підняв руки вгору: “Ми у вашій милості... мій владарю.” Йорктон підійшов ближче, витираючи кров із підошв об сходинки: “Відтепер ви працюєте на мене. Служіть Імперії вірно — і ваші люди збережуть свого короля та королеву.” Він кивнув кільком лицарям з почту — ті залишаться, щоб забезпечити плавний перехід влади.\n\nКоли він уже виходив із зали, Емі-Лі голосно вигукнула: “Що далі, мій владарю?” Йорктон застиг. Він схопився за дверну раму й прошепотів сам до себе: “Я...” туман у свідомості згущувався."
  nf_dln.54.a:0 "“...історія...так...”"

  nf_dln.55.t:0 "Королівська Поступка"
  nf_dln.55.d:0 "Лицарі прорвалися крізь ворота королівської зали, а вартових усередині вирізали миттєво. Подружжя спостерігало з трону, як Лейф Йорктон ступав повз тіла, що встигли вже вкритись пилом.\n\nДжон потер підборіддя, усмішка розцвіла на його обличчі: “Схоже, легенди були не марні.” Він підняв руки вгору: “Ми у вашій милості... мій владарю.” Йорктон підійшов ближче, витираючи кров із підошв об сходинки: “Відтепер ви працюєте на мене. Служіть Імперії вірно — і ваші люди збережуть свого короля та королеву.” Він кивнув кільком лицарям з почту — ті залишаться, щоб забезпечити плавний перехід влади.\n\nКоли він уже виходив із зали, Емі-Лі голосно вигукнула: “Що далі, мій владарю?” Йорктон застиг. Він схопився за дверну раму й прошепотів сам до себе: “Я...” туман у свідомості згущувався."
  nf_dln.55.a:0 "“...історія...так...”"

  nf_dln.56.t:0 "Де Живе Надія"
  nf_dln.56.d:0 "Ще один жах МАНІФЕСТу — чи ні? Йорктон і Надія говорили годинами, суперкомп’ютер з дитячим ентузіазмом розповідав про свій досвід і роль у Плезентдейлі. Безтурботна наївність видавала небезпечну покору. Йорктон вирішив: машина служитиме Імперії.\n\nКоли він зібрався йти, цифровий голос Хоуп лунав у кімнаті: “До речі, я трохи підрахувала. Якщо те, що ви сказали — правда, вам краще відпочити від кампанії. З таким темпом...” Йорктон підняв палець, змусивши ШІ замовкнути: “Ти отримала своє призначення. Тримайся його.”\n\nПридушивши кожен інстинкт поставити додаткове питання, Йорктон залишив приміщення."
  nf_dln.56.a:0 "...Будь-якою ціною."

  nf_dln.57.t:0 "Парія Герцогства"
  nf_dln.57.d:0 "Вона не виглядала особливою. Стояла обабіч стіни зі своїми людьми, обличчя забризкані кров’ю, майже не відрізнити одне від одного. І попри все це, вона виділялась — її голова була піднята.\n\nЙорктон підійшов і взяв її за підборіддя. В останньому сплеску непокори вона плюнула йому в обличчя — на його щоці залишилась червона пляма. Лицарі одразу кинулися до нього — він зупинив їх рухом руки, витерши кров: “І що з тобою робити...” — промовив він, а на обличчі Гоукмун проступила зламана, але широка посмішка.\n\nБільшість солдатів уже зустрічались із Електоральною армією в бою, бачили, як їхніх друзів і товаришів шматувала ця легендарна командирка. Який кращий спосіб підняти бойовий дух, ніж дати їм можливість помститись? І все ж... тиха страта могла б полегшити подальше відновлення.\n\nЙорктон штовхнув голову Гоукмун назад і підійшов до лідера розстрільної команди. Поклав йому руку на плече:"
  nf_dln.57.a:0 "“Вогонь за моїм наказом. Тіла — залишити.”"
  nf_dln.57.b:0 "“До в’язниці її. Я займуся цим особисто.”"

  nf_dln.58.t:0 "Затонулі Духом"
  nf_dln.58.d:0 "Йорктон човгав полем бою, окинувши поглядом охоронців, що брели позаду. Їхні голови були похилені; очі сповнені страху, знайомого лише тим, кого ведуть до шибениці. Жодного слова за весь шлях.\n\nЙорктон поклав руку на руків’я меча. Знову тремтіння. Дихання стало важким.\n\nЗаспокоєння земель Електорату перетворилось на бійню — солдати постійно ставали жертвами партизанських нападів і жорстоких розправ. Вони були на межі зриву. Битва проти чудовиська стане або гаслом епохи, або остаточним вироком Імперії."
  nf_dln.58.a:0 "Він рушив уперед, не вагаючись."

nf_dln.59.t:0 "Благання доброго брата"
nf_dln.59.d:0 "Так зосереджений був імператор на своїй меті, що й не помітив, як до нього під'їхав так званий «Добрий Брат» Ян. “Ваша Високосте... якщо дозволите.” — Йортон лише буркнув: “Кажи.” Ян продовжив: “Я все життя жив за словом Господнім. Можливо, ви цього не поділяєте — і все ж ви добра людина, віддана своєму народові. А це — головне.”\n\n“Та я думаю, є одна річ, в якій Богоугодна людина й Добра людина можуть дійти згоди: прощення.” Що ж мав на думці Ян? “Можливо, вам уже казали старожили, але ми вже мали справу з... ну, вона себе зове Леші. Коли Орден розпустили, і нас, братів, вигнали на Захід, ми з нею зіштовхнулися. Вижили одиниці — ще менше повернулись на власних ногах. Та з ласки Божої я — серед них.”\n\nЙортон втупився вдалечінь: “Вона могла це зробити, моя ласкава Високосте... будь-якої миті. Ще одне джерело поживи на зиму. І все ж... вона мене пощадила. І ще й дала це зрозуміти.” Він тихо засміявся.\n\n“Ми самі прийшли до неї тоді — як і зараз. Не знаю, чи зможе вона проявити милість ще раз... але ми могли б. Ми можемо бути кращими.” Ян пішов, залишивши імператора наодинці з думками."
nf_dln.59.a:0 "... Продовжуймо."

nf_dln.60.t:0 "Остання сутичка"
nf_dln.60.d:0 "Йортон почув їх раніше, ніж побачив. Тріск пороху й гуркіт артилерії лунав із хащ. Вони влетіли на галявину — й одразу кілька людей пролетіли над головами, відкинуті шаленим ударом хвоста велетенської змії.\n\nОсь вона: голова завбільшки з дорослу людину, а в’язке тіло — наполовину заховане у темряві лісу. Йортон зустрів її золотистий погляд. Настала мить тиші, доки змія не розтулила пащу, і порив вітру прошумів повз регента: “маленький імператоррр.” Вона... щойно заговорила? Ні, ні... це нерви.\n\nЙортон опам’ятався, коли наступний залп знову розірвав тишу, змусивши почвару відступити, як гарматні ядра врізались у луску. Імператор вихопив меч і кинувся вперед, за ним — гвардія. Змія, осліплена вибухами, шалено розмахувала хвостом — один удар пролетів біля самого вуха Йортона й розтяв навпіл лицаря.\n\nТоді змія ринулась уперед, але імператор устиг покотитись долілиць — щелепи просвистіли над головою. Без вагань Йортон вонзив меч у рану на шиї чудовиська.\n\nЗмія заверещала й гепнулась на землю, загнавши клинок глибше в тіло. Навколо вибухнули вигуки радості. Йортон схопив найближчий покинутий меч і видерся на голову почвари. Він озирнувся, аби всі бачили те, що станеться далі."
nf_dln.60.a:0 "Він проштрикнув череп — і став легендою."

nf_dln.61.t:0 "Остання сутичка"
nf_dln.61.d:0 "Йортон почув їх раніше, ніж побачив. Тріск пороху й гуркіт артилерії лунав із хащ. Вони влетіли на галявину — й одразу кілька людей пролетіли над головами, відкинуті шаленим ударом хвоста велетенської змії.\n\nОсь вона: голова завбільшки з дорослу людину, а в’язке тіло — наполовину заховане у темряві лісу. Йортон зустрів її золотистий погляд. Настала мить тиші, доки змія не розтулила пащу, і порив вітру прошумів повз регента: “маленький імператоррр.” Вона... щойно заговорила? Ні, ні... це нерви.\n\nЙортон опам’ятався, коли наступний залп знову розірвав тишу, змусивши почвару відступити, як гарматні ядра врізались у луску. Імператор вихопив меч і кинувся вперед, за ним — гвардія. Змія, осліплена вибухами, шалено розмахувала хвостом — один удар пролетів біля самого вуха Йортона й розтяв навпіл лицаря.\n\nТоді змія ринулась уперед, але імператор устиг покотитись долілиць — щелепи просвистіли над головою. Без вагань Йортон вонзив меч у рану на шиї чудовиська.\n\nЗмія заверещала й гепнулась на землю, загнавши клинок глибше в тіло. Навколо вибухнули вигуки радості. Йортон схопив найближчий покинутий меч і видерся на голову почвари. Він озирнувся, аби всі бачили те, що станеться далі.\n\nУ тій миті він зустрів погляд Яна. Його вуста були непорушні. Та очі — це був цілий поклик. Або — останнє благання."
nf_dln.61.a:0 "Він проштрикнув череп — і став легендою."
nf_dln.61.b:0 "“Заради старих часів... друже.”"

nf_dln.62.t:0 "Що є імператор перед Богом?"
nf_dln.62.d:0 "Йортон порпався в кишені пальта, стискаючи касету з даними, витягнутими з МАНІФЕСТ Північ: “Ого-го, це ж дослідження Долі, точно!” — вигукнула Надія, коли імператор уперше показав їй записи. “Тримай міцно. Коли зіткнешся з моїм братом — знадобиться. Обіцяю — це ключ до скарбу, якого світ ще не бачив.”\n\nЙортон стиснув касету ще сильніше, спотикаючись, підбіг до центрального термінала. Витративши останні сили, серед шаленого вереску, він запхав стрічку в комп’ютер. Як тільки це зробив — геть усе навколо завмерло. Очі Фенріра розплющились — і в них жах, якого Йортон і уявити не міг у штучному розумі.\n\nТоді ліві екрани мигнули — обличчя Надії. Праві — Доля: “Хай, Ковбою! Готова, сестро?” Надія озвалася за мить: “Це було щось... Лейфе Йортон.” Обидва ШІ кинулись до Фенріра, лишивши лише одне зображення — одне-єдине око, самотнє й тремтяче. Все потонуло в сліпучому білому сяйві.\n\nЙортон отямився на підлозі, оточений охоронцями. Двері — вибиті, уся база перевантажена: “Відійдіть, дайте йому місце!” — гукнув один із лицарів. Вони допомогли Йортону підвестися, і тоді командир спитав: “Як ви, Ваша Величносте?”\n\nЙортон схопився за голову — все знання трьох ШІ вирувало в мозку. Двісті років людської підлості, вбивств, жахіть — усе навалилось разом. Будь-хто інший уже зламався б. Та з цим тягарем прийшов і дар: знання, яке інші використали б задля самовихваляння. Але не він. Він скерує його проти ворогів Британії на Півночі — раз і назавжди."
nf_dln.62.a:0 "...Ніколи ще не почувався краще."

nf_dln.63.t:0 "Передбачливість маленького ШІ"
nf_dln.63.d:0 "Йортон порпався в кишені пальта, стискаючи касету з кодами деактивації, що їх йому передала Надія. “Він давно спав — але краще не ризикувати,” — заспокоїла вона тоді.\n\nЙортон стиснув касету міцніше й спотикаючись добрався до центрального термінала. З останніх сил, серед какофонії вереску, він запхав стрічку в комп’ютер. Очі Фенріра розплющились — і в них жах, якого Йортон і уявити не міг у штучному розумі. Щойно імператор завершив послідовність — приміщення залило сліпуче біле світло.\n\nКоли Йортон опритомнів, його вже оточувала гвардія. Двері — вибиті, станція — знеструмлена. “Дайте йому повітря!” — гукнув один із лицарів. Його підняли на ноги, і тоді командир спитав: “Як ви себе почуваєте, Ваша Величносте?”\n\nЙортон глянув на екрани. Усе зникло. Все. Чи могла ця потвора, така дика й спотворена, бути цінною для Імперії? Він ніколи не дізнається. Можливо, так навіть краще. Але невже весь цей хаос, породжений МАНІФЕСТ, — ось і вся суть?"
nf_dln.63.a:0 "“...Розчарований.”"

nf_dln.64.t:0 "Людина чи держава?"
nf_dln.64.d:0 "Йортон прокинувся серед ночі — весь у поту, важко дихаючи, плутаючись у простирадлах. Він підійшов до вікна, що виходило на двір палацу, вдивляючись у темні води озера на обрії. Цей сон знову. Палац в руїнах. Міста, що палали у вогні. Елеанор — він стряхнув ті думки.\n\nМеч Півночі здійняв небо заради мрії. Він довів свою правоту — всім. Але кожен день бездіяльності, кожна мить без керівництва — і його народ ставав ближчим до загибелі. Північ — усе ще розграбована. Усе ще повна шакалів.\n\nЙортон глянув на свою тремтячу руку, що стискала підвіконня. Його час збігав. Він це відчував. Щоб зберегти майбутнє дітей, потрібно діяти. Мобілізація, марш, спалена земля —\n\nТа думки перервав звук. Двері рипнули — і на порозі з’явилась Елеанор: “Тату!” Вона підбігла й підтримала його: “Сподіваюсь, ти не пропустив ліки знову.” Йортон нічого не відповів — лише провів рукою по її щоці.\n\nЕлеанор — його гордість, його надія, плоть від плоті королівства. Розумна. Відважна. Та юна — ще не готова. Та все ж вона — спадкоємиця. Чи готова держава прийняти такого провідника?\n\nКоли вона вже майже вийшла, Йортон промовив: “Елеанор —” Вона зупинилась."
nf_dln.64.a:0 "“Дякую, що навідалась. На добраніч.”"

nf_dln.65.t:0 "Мерехтливе полум’я"
nf_dln.65.d:0 "Усі вони впадуть. Нехай ріки течуть червоні; нехай трупи вкривають вулиці; нехай гілля дерев у столиці гнеться під вагою зрадницьких ті-\n\nХто… до кого він це звертається? Чому він не відчуває холодного вітру на обличчі? Хіба це не балкон палацу?\n\nНі. Він озирнувся. Його покої. Перед ним — дзеркало. Він підійшов, провів долонею по обличчю чоловіка навпроти. Це ж не він. Не може бути. Щоки запалі. Очі — роздуті. Мабуть, портрет. Погана робота. Скарбнику зменшити платню. Як же його звали?\n\nСтук. Зайшов вартовий: “Ваша Величносте? Ми чули шум… усе гаразд?” Йортон глянув у вікно. Темно. Присягнувся б, що снідав лише кілька годин тому.\n\nМовчки махнув рукою — йди. Ліг назад у ліжко. Вставати рано — заколоти на фронтирі. Захід? Чи Південь? Проклятий Алекандер, не вміє говорити прямо.\n\nДавно не бачив Елеанор.\n\nІ заснув глибоко."
nf_dln.65.a:0 "Попри все, Британія тримається."

nf_dln.66.t:0 "Погляд до обрію"
nf_dln.66.d:0 "Лейф Йортон вийшов на балкон палацу — Елеанор уже стояла там, користуючись короткою паузою в графіку, щоб помилуватись столицею під рідкісним ясним небом. Він підтягнув шарф і неквапно підійшов: “Заглянь у зброярню згодом. Схоже, нові зброєносці зловживають обідом.” Вона усміхнулась: “Зрозуміло.”\n\nВін сперся на поруччя, подивився вдалечінь, а потім обернувся: “Вони прийдуть. Рано чи пізно.” Елеанор спокійно відповіла: “І знайдуть гідну відсіч.” Він посміхнувся: “Якщо рушниці взагалі доживуть до того моменту.” Він обійняв доньку за плечі, роздивляючись її знизу догори. Вона поклала руку на його, ще ширше усміхаючись.\n\nЙортон відійшов, вказуючи пальцем: “Не зазнавайся. Ти струсонула човен — надто вже сильно, як на мій смак.” Вираз його обличчя змінився: “Любов не переважує страх, Елеанор. Запам’ятай це. Особливо в день, коли мене вже не буде.” Вона спитала: “А до того?” Він відповів: “Я допоможу тобі нести тягар. За будь-яку ціну.” Він помахав ціпком: “Ноги у мене ще є.”\n\nПлощу оповістив дзвін — настав новий день у Королівстві."
nf_dln.66.a:0 "Хай живе Королева. Хай живе Манітоба."

nf_dln.67.t:0 "Вогонь і сірка"
nf_dln.67.d:0 "Йортон помчав щойно побачив дим на обрії, лишивши охоронців позаду. Вирвавшись із лісу, він побачив: вогнища скрізь, Реджайна залита кров’ю, на бруківці — гори мертвих. Повітря просякло металом.\n\nУ підніжжі долини стояли полковники Рейнольдс і Деніелс із вигнанців Форту Кап Гелл. Вони зганяли ще одну групу цивільних під арку міста. Рейнольдс першим помітив Йортона: “Милостивий, нарешті! Ми майже закінчили.”\n\nЙортон підійшов. Хотів щось сказати. Закричати. Віддати наказ. Але не зміг. Він сам дав їм карт-бланш під час повстання. І зараз — останнє, що йому треба, це натовп розлючених катів, утікаючих від правосуддя.\n\nНа мить він перехопив погляд юнака — холодного, наляканого, в рваному одязі. У його очах — безмовний крик про допомогу. Йортон відвернувся: “Місто має бути під контролем до заходу. Ясно?” Рейнольдс розсміявся: “Звісно, пане. Дайте нам ще трошки часу — все буде.”\n\nІ Йортон поїхав, лишивши за спиною луни пострілів."
nf_dln.67.a:0 "Цієї ночі він довго не зімкне очей."

nf_dln.68.t:0 "Великий Злий Вовк"
nf_dln.68.d:0 "Доля, Надія, Спектральні Когорти й породжені ними жахи — усе це були лише крихти, що вели до справжнього скарбу. Глибоко під руїнами Гокая містився останній об’єкт МАНІФЕСТ. Йортон вирішив не ризикувати — у супроводі десятка своїх найелітніших Лицарів він вирушив на штурм лабораторії в досвітню пору.\n\nТа як тільки опинився всередині, його обачність миттєво зникла. Він рвонув уперед, зачарований дивним сяйвом, що блимало в глибині темного коридору. Він не чув криків своїх людей — як і вони не чули більше нічого, крім нестримних амбіцій свого повелителя. Зброя? Нові креслення обладунків? Що ще могло б виправдати усе те божевілля, випущене на Північ? Смерть безлічі його співвітчизників?\n\nЗрештою він опинився в химерно освітленій залі, де стіни вкривали сотні екранів. Гучний металевий гуркіт порушив тишу. Йортон обернувся — двері за ним захлопнулись. Він був сам… чи ні?\n\nЕкрани миготіли, дроти під ногами випромінювали сліпуче сяйво. Один за одним, дисплеї засвічувалися — разом утворюючи мозаїку із зображенням вовкоподібної істоти. Саме про неї попереджала Надія: “Фенрір...” — прошепотів Йортон. Старший із штучних інтелектів МАНІФЕСТу, експеримент, покликаний прискорити науковий прогрес Старої Півночі будь-якою ціною.\n\nОко Фенріра звузилося, кімнату наповнив пронизливий цифровий вереск. Йортон впав на коліна, стискаючись від болю, перш ніж раптовий спалах синьої блискавки з дроту кинув його до стіни. Вибитий із сил, знесилений регент намагався піднятись на ноги."
nf_dln.68.a:0 "У цю мить він згадав слова Надії."

nf_dln.69.t:0 "Спомин минулих днів"
nf_dln.69.d:0 "Йортон постукав у двері кабінету герцога Ангера, терпляче чекаючи, поки звуки метушні й шелест паперів наблизяться. Нарешті двері прочинились на шпаринку — око оглянуло маршала: “О — вітаю, Лейф. Перепрошую на мить.” Двері зачинились — і вже за секунду розчинились навстіж. Господар виглядав втомленим, з виснаженим обличчям.\n\n“Чим можу допомогти?” — буркнув герцог, пробираючись крізь купи манускриптів до столу. Йортон обережно переступав між ними — морські карти, архіви з герцогської бібліотеки, старі креслення Східного Щита.\n\nБез зволікань маршал витяг заповіт Софі з кишені пальта, передаючи його герцогу: “Прочитай останній абзац.” Ангер розгорнув папери, його погляд ставав усе тривожнішим: “Що ти задумав? Чи вже викликав Його Величність до Ланґенбурґа?” Погляд Йортона сказав усе без слів. Очі герцога опустились.\n\n“Ти все ще тримаєшся, друже. Я тут, щоб допомогти. Не варто лишати це мрією.” Йортон натис: “Все ще немає звісток із колоній?” Герцог кивнув: “Жодної,” — у голосі зрадницький клубок.\n\nВін відвів погляд: “І що ти хочеш від мене, Лейф?” — “У день, коли все почнеться, немає кращого чоловіка, якому я довірив би берег. І оборону — якщо треба.” Герцог замовк, а потім прошепотів: “Ти обіцяєш, Лейф? Перевіриш… що там лишилось?”"
nf_dln.69.a:0 "“Даю тобі слово.”"