l_english:
DLN_duchess_sophie_name:0 "Герцогиня Софі"
DUCHESS_SOPHIE_DESC:0 "Софі Асмантайн правила Великим Герцогством і в лихі, і в добрі часи, ставши його очільницею у віці лише 17 років після смерті батька, якого зломила затяжна хвороба. Коли вона успадкувала титул, герцогство охоплювало лише половину теперішніх земель, а бідність і злочинність ширилися в кожному поселенні. Щоб укріпити свій вплив, Софі уклала прямий союз з Домом Йорктонів — родиною, що керувала другим за величиною містом герцогства. Завдяки цьому союзу вони були піднесені до статусу графів Манітоби. Завдяки адміністративному хисту Софі й військовому таланту Йорана Йорктона, було наведено лад у хаосі.\n\nУ наступні роки герцогство процвітало, затьмарюючи решту своїх сусідів у межах королівства. Саме в цей період Софі заснувала Ланґенбурзький університет, а Ланґенбурґ і Йорктон перетворилися на справжні коштовності корони. До десятиріччя її правління злидні стали лише спогадом.\n\nАле кожне диво має кінець; для Софі й Ланґенбурґа цей кінець настав зі сецесією Уінніпеґа й подальшою Війною Республіканської Коаліції. Коли королівство потерпало з усіх боків, кровопролиття дійшло й до герцогства. Надії його синів і дочок лягли на плечі одного чоловіка — сина Йорана, Лейфа Йорктона. Зі зброєю в руках та перед обличчям ворога, маршал зібрав невірогідну коаліцію, яка зрештою розгромила чисельно переважаючого супротивника й врятувала герцогство.\n\nПісля війни Ланґенбурґ залишився збирати уламки, поглинаючи рештки численних герцогств, що впали чи були анексовані. Його території тепер майже зрівнялися з самим Королівством, якому він служив. Але період відносного миру не зміг приховати знеможене тіло Софі та її відсутність спадкоємця…"

DLN_leif_yorkton_name:0 "Лейф Йорктон"
LEIF_YORKTON_DESC:0 "Лейф Йорктон — жива легенда Манітоби, яка заслужила свій статус, здобувши неймовірну перемогу над арміями метисів у перші дні Війни Республіканської Коаліції. Знову й знову він виходив неушкодженим із битв, які здавалися приреченими, залишаючи за собою лише поразку ворогів. Тепер Меч Півночі стоїть на порозі історії, сповнений рішучості відновити славу королівства — за будь-яку ціну."

DLN_eleanor_yorkton_name:0 "Елеанора Йорктон"
DLN_eleanor_yorkton_advisor_desc:0 "§Y“Війна змінилася — нам теж слід змінитися.”§!\n\nБлискуча, рішуча й завжди обернена в майбутнє — Елеанора вся в батька. І все ж вона має те, чого не мав Меч Півночі — винахідливість молодості. Вивчивши події Першої війни республіканської коаліції неупереджено й холоднокровно, чого не могли зробити ветерани, охоплені жалем і злістю, Елеанора дійшла висновку: Королівство приречене на падіння, якщо не здійснить радикальну технічну модернізацію й не перейде на гнучкішу тактику. Ґанн не звернув уваги на її попередження — чи буде її батько іншим?"
DLN_ELEANOR_DESC:0 "З кожним днем тіло й розум її батька слабшали, й Елеанора знала, що колись вона успадкує все, що збудував Меч Півночі — й не буде до цього не готова. Провівши більшу частину дорослого життя в двірцевих інтригах, вона швидко побачила: королівство роз’їдає хвороба інституційної бездіяльності. Тепер, маючи силу втілити свої прагнення, вона готується закласти фундамент безпечнішої Манітоби — такої, що зможе розірвати коло насильства, яке давно її скувало."

DLN_eric_yorkton_name:0 "Ерік Йорктон"
DLN_eric_yorkton_desc:0 "§Y“Ей, дай хлопцю перепочити.”§!\n\nЕрік Йорктон ніколи не знаходив спільної мови з пихатістю й розкошами дворянського життя Манітоби, тож у ранній молодості подався до Ліги Річок у пошуках пригод і золота. Пара невдалих рішень і кілька впливових ворогів змусили молодого зухвальця повернутися додому. Та за цей час Ерік здобув досвід і зв’язки, які зробили його цінним союзником торговельного класу герцогства — класу, що й досі прагне відновити монополію королівства на торгівлю річками й озерами."

DLN_tobias_name:0 "Тобіас"
DLN_tobias_desc:0 "§Y“Куди вона йде — я йду слідом.”§!\n\nРоль дворецького герцогині Софі — лише останній етап у довгій і славетній кар’єрі Тобіаса як вірного слуги корони. За десятиліття він працював адміністратором і в герцогських, і в королівських структурах, здобувши репутацію вправного управлінця та універсального фахівця. В якій би установі не з’явився Тобіас, усі з полегшенням зітхали, щойно бачили його на порозі."
TOBIAS_DESC:0 "Дворецький"

DLN_winter_name:0 "Капітан Вінтер"
DLN_winter_desc:0 "§Y“Комусь доведеться забруднити руки.”§!\n\nПрямий підлеглий маршала Лейфа Йорктона, капітан Вінтер походить з зовсім іншого середовища, аніж його блакитнокровний начальник. Сирота з непоказного містечка Норквей, Вінтер вступив до армії в юному віці, прагнучи дисципліни й сенсу в житті. Завдяки природному хисту й шанобливій поставі, він стрімко піднімався кар’єрною драбиною, зрештою ставши наставником для молодих талантів. Тепер, на порозі відставки, капітан Вінтер шукає останній шанс довести свою вартість — його безмежні амбіції дорівнюють лише повазі до Меча Півночі."

DLN_earl_grey_name:0 "Ерл Ґрей"
DLN_earl_grey_desc:0 "§Y“Життя — це бізнес, і хто каже інакше, той просто не на вершині.”§!\n\nКерівник, тактик, бізнес-магнат — Ерл Ґрей був усім цим. Його важко сплутати з іншими декадентськими дрібними дворянами Манітоби, адже він виявив далекоглядність, інвестувавши невеликий спадок у консалтингову компанію, яка обслуговує клієнтів як з приватного, так і з державного сектору. Чи то наводячи лад у військовому таборі, чи то керуючи масштабним інфраструктурним проєктом — Ерл Ґрей всюди задіяний і завжди шукає наступний великий куш."

DLN_sylvi_name:0 "Сільві"
DLN_sylvi_desc:0 "§Y“Оволодій мистецтвом — і відклади його убік.”§!\n\nСільві починала як наймана шукачка, що вирушала в руїни Старого Світу на пошуки технологій для герцогства. Та все змінилося в день, коли її голос лунав по залах дюкської зброярні й привернув увагу лорда Йорктона. Завзятий прихильник французької опери, маршал витратив чимало зусиль і монет, щоб розкрити вокальні таланти Сільві й зробити її окрасою дворянських прийомів Ланґенбурґа. Відтоді вона стала улюбленицею політичної верхівки герцогства — чи то завдяки довоєнним скарбам, чи то чарівним аріям."

DLN_trader_joel_name:0 "Торговець Джоел"
DLN_trader_joel_desc:0 "§Y“З такими сусідами ворогів і не треба.”§!\n\nДжоел заснував “Північні Маршрути” на піку влади Королівства над Манітобою, завбачливо створивши мережу зупинок для купців, які прямували через усю країну. Проте з розпадом королівства й поширенням нестабільності Північ втратила привабливість для торгівлі. Рух занепав, і підприємець мусив різко скоротити масштаби діяльності. Тепер його бізнес тримається здебільшого на торгівлі з Лігою Річок — і всім очевидно, що слава колишніх часів давно в минулому."

DLN_grand_rector_name:0 "Великий Ректор"
DLN_grand_rector_desc:0 "§Y“Антиінтелектуалізм сіє насіння суспільного краху.”§!\n\nЩойно закінчивши навчання як найкращий студент, Великий Ректор уник фронту у Війні Першої Республіканської Коаліції. Натомість король обрав його до своєї ради як державного службовця, де той швидко став Головним науковим радником. Падіння режиму не перешкодило його кар’єрі — бо розумних і досвідчених людей бракувало. Сьогодні Великий Ректор керує Ланґенбурзьким університетом з тактом і дисципліною, що дає плоди у вигляді зростання кількості студентів і результатів тестів."

DLN_farmer_david_name:0 "Фермер Девід"
DLN_farmer_david_desc:0 "§Y“Ніколи не забувайте, хто кладе хліб на стіл.”§!\n\nФермерська Спілка Ланґенбурґа — найвпливовіша лобістська організація герцогства, і Девід очолює її з неабиякою майстерністю. Під його проводом спілка домоглася постійного збільшення субсидій і зарплат, а також впровадження найсучасніших аграрних технологій. Військове керівництво хоч і бурчить, та робить це лише за зачиненими дверима — адже воно знає, що лише один страйк фермерів може обернутися зимою голоду й бунту."

DLN_colonel_reynolds_name:0 "Полковник Рейнольдс"
DLN_colonel_reynolds_desc:0 "§Y“Ці паразити отримають своє.”§!\n\nЯкщо колись у полковника Рейнольдса й залишалася бодай крихта милосердя, з віком вона щезла. Жах, який він вселяє у злочинців Ланґенбурґа, дорівнює лише повазі, яку він здобув серед вигнанців, очоливши втечу з Реджайни під час повстання метисів. Минуло багато років з того часу, як вони втратили дім, та Рейнольдс і досі мріє про день, коли він знову поведе військо на південь — і відплатить ворогам за вкрадену батьківщину."

DLN_colonel_daniels_name:0 "Полковник Деніелс"
DLN_colonel_daniels_desc:0 "§Y“Тік-тік-тік...”§!\n\nКаральник серед каральників, полковника Деніелса викликають тоді, коли комусь потрібно нагадати, хто тут головний. Його спеціалізація — нестандартні методи тортур з використанням вогню, пороху й вибухових речовин. Завдяки цій зловісній майстерності його швидко взяли консультантом до дюкської зброярні, де він допоміг Ланґенбурґу створити одну з найрозвиненіших систем підривної справи в королівстві. Попри це, відданість Деніелса насамперед належить його побратимам-вигнанцям, і він нетерпляче чекає нагоди випробувати нові іграшки на метиських узурпаторах."

DLN_alecander_name:0 "Алекандер Вейберн"
DLN_alecander_desc:0 "§Y“Ваша воля — мій наказ.”§!\n\nРід Вейбернів — один із найшанованіших у всьому королівстві, відомий як опора Лицарського Ордену — елітного війська Манітоби. Принаймні був ним — до Війни Першої Республіканської Коаліції, коли жертовність ордену винагородили його розпуском, з ініціативи еліти Брандона, наляканої успіхами маршала Йорктона. Саме Йорткон узяв під опіку молодого Алекандера після смерті його батька — тодішнього голови Ордену. Тепер, у розквіті сил і з роками тренувань за плечима, Алекандер стоїть правою рукою Меча Півночі. І немає людини, в яку б він не встромив меч заради відновлення гідності роду та волі того, хто зробив його тим, ким він є."

DLN_Goderick_name:0 "Ґодерік"
DLN_Goderick_desc:0 "§Y“Я кую — от і все.”§!\n\nҐодерік — один із багатьох ветеранів, змушених залишити поле бою через важкі поранення, отримані під час Війни Першої Республіканської Коаліції. Після тривалого періоду самоосмислення — і своєчасної допомоги від програм соціальної підтримки герцогства — він використав досвід санітара, щоб зайняти посаду дюкського зброяра. Ґодерік вирізняється серед колег завдяки фронтовому досвіду, що дозволяє йому виправляти найсерйозніші недоліки стандартного спорядження солдатів."

DLN_joshua_name:0 "Джошуа"
DLN_joshua_desc:0 "§Y“Жоден план не переживає першого контакту.”§!\n\nКолишній лицар Ордену, Джошуа завжди йшов першим і залишався останнім, спеціалізуючись на розвідці й диверсіях. Після розпуску Ордену блукав Північчю як найманець, продаючи свої вміння навіть сумнівним замовникам заради грошей. Проте, за чутками, у Манітобі знову назрівають проблеми — а Джошуа ніколи не оминає можливості. Навряд чи йому ще є чого навчитись, та декого він ще може навчити."

DLN_bellores_name:0 "Герцогиня Беллорес"
DLN_bellores_desc:0 "§Y“Одного дня ми повернемось героями.”§!\n\nПопри всі труднощі, герцогиня Беллорес не втрачає надії на краще майбутнє — і для себе, і для свого дому. Вона вірить, що досвід, здобутий за ці роки, дозволить їй одного дня відновити свій дім і Королівський Порт. А поки що вона віддано служить герцогству Ланґенбурґ, будучи щитом проти ворогів — на суходолі чи на морі."

DLN_duke_Anger_name:0 "Герцог Анже"
DLN_duke_Anger_desc:0 "§Y“Що лежить за обрієм?”§!\n\nКолись герцогство Анже мало стратегічне значення в королівстві й слугувало базою для колоніальних експедицій Манітоби на схід. І хоч ті часи давно минули, титулярний герцог досі мріє про далекі землі, не зважаючи на страшні чутки з-за озера Уінніпеґ. Дехто вважає його мрії безглуздими, та саме вони зробили з нього одного з найкращих морських знавців у королівстві — і здобули повагу багатьох ровесників."

DLN_eliza_name:0 "Еліза"
DLN_eliza_desc:0 "§Y“Хто сказав, що небо — межа?”§!\n\nЕліза здобула свої крила в Іґл Рок, працюючи кур’єром і механіком у північному відділенні вузла. Після критичної поломки двигуна й аварійної посадки вона знайшла притулок при дворі Софії, де матріархиня вирішила тримати талановиту дівчину поблизу — на випадок, якщо ті навички знадобляться герцогству. Застрягши в безкрилим суспільстві, Еліза перебивається дрібними роботами, а у вільний час дивиться в небо, мріючи знову злетіти в блакитну далечінь."

DLN_johannes_name:0 "Маршал Йоганнес"
DLN_johannes_desc:0 "§Y“Ви здивуєтесь, на що здатні звичайні відтискання в належному масштабі.”§!\n\nЙоганнес — один із небагатьох живих свідків правління Абсалона, зниклого герцогства, яке поглинули Криваві Електорали та багряна хуртовина. Ще за часів тієї династії маршал більшість кар’єри провів у тіні Йорктона, бо невпевненість і педантизм не дозволяли йому проявити себе. Та іронія долі — падіння герцогства стало благом для Йоганнеса. Він здобув репутацію компетентного, хоч і позбавленого амбіцій, керівника, який більше не мусив відповідати чужим очікуванням."

DLN_poet_jack_name:0 "Джек"
DLN_poet_jack_desc:0 "§Y“90 хвилин за бакс і тепле ліжко.”§!\n\nОдин із небагатьох народних улюбленців у герцогстві, візит Джека — справжнє свято для кожного трактирника на периферії. Цей мандрівний музика скрізь залишає по собі слід відданих фанатів, збираючи найбільші натовпи, які коли-небудь бачили віддалені поселення Ланґенбурґа. Його виступи принесли йому любов простого люду — і повагу знаті завдяки частим згадкам і прикрашеним переказам славетних військових кампаній герцогства."

DLN_stable_master_name:0 "Аксель"
DLN_stable_master_desc:0 "§Y“Мені потрібен лише тиждень, рушниця і трохи консервів.”§!\n\nЗа роки битв Аксель засвоїв одне: війна — це гра чисел. У кого більше ресурсів, той і перемагає. Саме це логістичне мислення принесло йому повагу в герцогській зброярні і місце за королівським столом при плануванні кампаній. Попри стрімке зростання кар'єри, Аксель не цурався передової, здобувши досвід і повагу побратимів як один із найуніверсальніших солдатів у королівстві."

DLN_luke_name:0 "Люк"
DLN_luke_desc:0 "§Y“Якщо не я — то хто?”§!\n\nРідні Люка завжди вірили, що юнак стане зіркою армії: його талант і розум були очевидні всім. Але з кожною новою потворою, яка виривалася з Багрянолісся, його бажання залишитися вдома й захистити рідних лише зростало. Нині Люк, очільник міліції Поркупайн-Гілл, є одним із найцінніших захисників герцогства на фронтирі — і не зупиниться, доки мешканці Півночі не зможуть спати спокійно."

DLN_sobrek_name:0 "Собрек"
DLN_sobrek_desc:0 "§Y“Якщо стріляє — значить, стріляє *гик*.”§!\n\nСобрека навряд чи коли-небудь допустять до управління герцогською зброярнею, але його талант не залишився поза увагою керівництва. Перебуваючи у стані легкого сп’яніння, він з дивовижною точністю і швидкістю збирає гвинтівки на конвеєрі, обганяючи всіх тверезих колег. І хоча іноді трапляються криві стволи — це невелика ціна за ефективність військово-промислового комплексу."

DLN_couple_name:0 "Пара"
DLN_couple_desc:0 "§Y“Ми будемо служити — скільки б не знадобилося.”§!\n\nУнаслідок несподіваного перебігу подій Джон і Емі-Лі опинилися при владі в Альберті під опікою імператора Йорктона. Попри криваву сутичку, яка передувала їхньому регентству, Пара вже досягла швидких успіхів у відновленні краю з руїн."

DLN_hope_name:0 "Надія"
DLN_hope_desc:0 "§Y“Я з радістю допоможу!”§!\n\nСеред дітей МАНІФЕСТ, Надія — виняток. Вона завжди життєрадісна і готова прийти на допомогу, а вже зараз відіграє ключову роль у розвитку військових технологій Британії. Імператор сподівається, що її талант у військовій справі прокладе шлях до миру."
