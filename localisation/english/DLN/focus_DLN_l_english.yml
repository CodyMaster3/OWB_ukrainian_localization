l_english:
dln_last_duchy:0 "Останнє Герцогство, Ланґенбурґ"
dln_last_duchy_desc:0 "Ланґенбурґ — останнє герцогство, що залишилося стояти в Королівстві Манітоба, попри спроби республіканців і електоралів стерти нас з історії."

dln_miracle_on_border:0 "Диво на Кордоні"
dln_miracle_on_border_desc:0 "Війна Республіканської Коаліції здавалася приреченою від самого початку. Повстання Уінніпеґа позбавило Королівство його промислового серця, змусивши розтягнути ресурси до краю, коли до конфлікту приєдналися Конгрес Метісів та Електорали. На тлі бойових дій Ланґенбурґ виглядав легкою здобиччю. І все ж, саме це герцогство зрештою стало їхньою могилою."

dln_yorktons:0 "Йорктонська Династія"
dln_yorktons_desc:0 "Йортони вірно служили герцогській родині Ланґенбурґа ще до заснування Королівства. Вони є, по суті, опорою двору. Походячи з давнього роду переважно освітян і суддів, їхня роль останніми роками змінюється, аби забезпечити виживання Ланґенбурґа в дедалі нестабільнішій північній глушині."

dln_state_of_the_duchy:0 "Стан Герцогства"
dln_state_of_the_duchy_desc:0 "Щорічна промова про Стан Герцогства — на часі! Це нагода для Герцогині поділитися з підданими поглядом у майбутнє! Як і годиться, маршал має отримати письмову заяву від королівського кур'єра напередодні церемонії."

dln_investments:0 "Нові Інвестиції"
dln_investments_desc:0 "Хоч наша економіка останнім часом занепала, місія Елеонори до королівської столиці дала плоди. Лише кілька рукостискань і дрібні поступки — й ми здобули найбільші інвестиції в історії герцогства!"

dln_university:0 "Відкриття Університету"
dln_university_desc:0 "Великі двері Університету Ланґенбурґа були зачинені під час Війни Республіканської Коаліції, а більшість студентів потрапили до лав війська. Та з відносним заспокоєнням ситуації настав час урочистого відкриття!"

dln_new_opportunities:0 "Нові Можливості і КО"
dln_new_opportunities_desc:0 "З метою ефективного управління зростаючим портфелем, буде заснована нова королівська компанія «Нові Можливості і КО» — як посередник між герцогством і приватними інвесторами."

dln_reforms:0 "Реформа Бюрократії"
dln_reforms_desc:0 "Хоча Софі де-факто править герцогством, щоденні справи держави здійснює велика бюрократична машина. Останніми роками кількість королівських службовців зросла до неприйнятного рівня — потрібні точкові реформи."

dln_anti_corruption:0 "Нові Антикорупційні Заходи"
dln_anti_corruption_desc:0 "Привласнення державних коштів — злочин, що карається довічним ув'язненням."

dln_legal_code:0 "Оновити Правовий Кодекс"
dln_legal_code_desc:0 "Правова система Ланґенбурґа була значною мірою занедбана з початку Війни Республіканської Коаліції. Теперішні закони не відповідають розвитку герцогства. Ми започаткуємо амбітну програму реформ!"

dln_military_reforms:0 "Військові Реформи Йортона"
dln_military_reforms_desc:0 "Останні військові успіхи не зробили маршала самовпевненим. Арсенал герцогства посилено працює над виготовленням нового озброєння, з особливою увагою до підривних можливостей армії."

dln_new_rifles:0 "Стандартизація Нових Гвинтівок"
dln_new_rifles_desc:0 "Згідно зі стандартною доктриною Ланґенбурґа: якщо куля не вбила ворога з першого разу — стріляй доти, поки не буде нейтралізовано. А потім — звітуй про брак."

dln_recruitment:0 "Вербувальні Райони"
dln_recruitment_desc:0 "Однією з головних вразливостей герцогства завжди була мала чисельність населення, що створює обмежену кадрову армію. Щоб вирішити цю проблему, маршал Йортон пропонує впровадити вербувальні райони для точного обліку потенційних рекрутів."

dln_long_reign:0 "Довге Милостиве Правління Герцогині"
dln_long_reign_desc:0 "Наша Милостива Герцогиня пережила будь-які бурі — республіканські чи королівські. Серед попелу минулого лише її герцогство стоїть непохитно в потоці історії. Хай Довго Вона Править! Хай Живе Ланґенбурґ!"

dln_time_stops:0 "Час Завмирає, А Потім Йде Далі"
dln_time_stops_desc:0 "Правильна людина в неправильному місці може змінити хід історії..."

dln_race_against_history:0 "Гонка з Історією"
dln_race_against_history_desc:0 "...але лише якщо вона готова пожертвувати всім."

dln_expand_armory:0 "Розширити Арсенал Йортона"
dln_expand_armory_desc:0 "Під час Війни Республіканської Коаліції Арсенал Йортона став головним виробником і постачальником зброї в герцогстві. Через обмежений людський ресурс, Софі не вбачала сенсу розширювати виробництво. Але з огляду на бурі на обрії, час змін настав..."

dln_industrial_backbone:0 "Промисловий Хребет Маршала"
dln_industrial_backbone_desc:0 "Щоб перемогти у затяжній війні, нам потрібна індустрія, що не поступається королівській. Часу обмаль — доведеться звернутися по ласку до графа Ґрея."

dln_relocate_guns:0 "Переміщення Зброї"
dln_relocate_guns_desc:0 "Якщо чогось у Королівстві більше, ніж достатньо — то це гвинтівки. Арсенал настільки переповнений, що ніхто й не помітить зникнення кількох ящиків спорядження..."

dln_buy_medicine:0 "Придбання Медикаментів"
dln_buy_medicine_desc:0 "Королівська влада невдовзі почне ставити запитання щодо підозрілої кількості важких виробничих травм. Але поки вони постукають у двері — буде вже пізно."

dln_knights_plot:0 "Змова Лицарів"
dln_knights_plot_desc:0 "Для Лицарів цей день був довгоочікуваним. За наказом Йортона та з рук Алехандера Вейберна указ про вигнання Лицарських Орденів буде скасовано в Ланґенбурзі. Ветерани та їхні нащадки вже прямують до столиці, аби знову стати пліч-о-пліч зі своїм Лордом."

dln_old_loyalists:0 "Старі Вірні Йортона"
dln_old_loyalists_desc:0 "На своєму піку Орден Архангела був страхітливою силою. Один лицар міг вирізати цілий взвод самотужки. Вдягнені у найкращу броню Королівства, їхня сама присутність піднімала бойовий дух. І от тепер, коли ці воїни знову під нашим командуванням — ми готові повернути дні слави."

dln_minor_reforms:0 "Малі Реформи"
dln_minor_reforms_desc:0 "Королівські сили переважають нас виключно чисельністю. Щоб зрівняти шанси — слід брати, що можемо. Швидка й груба мобілізація на кордоні — непоганий початок."

dln_citizen_militias:0 "Громадянські Міліції"
dln_citizen_militias_desc:0 "Північні рубежі Ланґенбурґа зрадливі, а наші ресурси обмежені. Відтак у віддалених поселеннях почали формуватися міліції. Не найкраща сила, та в наявних умовах — достатньо."

dln_new_reforms:0 "Нові Військові Реформи"
dln_new_reforms_desc:0 "Ми не можемо дозволити собі нехтувати підготовкою армії. Нові навчання займуть час — але можуть стати тим, що відділяє нас від поразки."

dln_marshall_men:0 "Люди Маршала"
dln_marshall_men_desc:0 "Кілька ветеранів останнім часом прибули до столиці, щоби вшанувати пам’ять покійної Герцогині. Більшість не довелося довго вмовляти, аби залишитись."

dln_last_will:0 "Остання Воля"
dln_last_will_desc:0 "Зброя зібрана, лицарі готові, чоловіки підбурені. Але перш ніж рушити на Брендон — треба завоювати серця та розум."

dln_revise_doctrine:0 "Перегляд Доктрини"
dln_revise_doctrine_desc:0 "Не минуло й кількох тижнів кампанії, як ветерани вже прийшли до мене з пропозиціями. Ідеї варто вислухати."

dln_w_campaign:0 "Кампанія «W»"
dln_w_campaign_desc:0 "Прес-релізи, агітплакати, і зрідка парад — внутрішньо названий «W»-проєкт виявився шалено успішним. Коли люди питають себе про війну — саме ми дамо їм відповідь першими."

dln_call_arms_manufactors:0 "Звернутися до Збройових Фабрикантів"
dln_call_arms_manufactors_desc:0 "У нас досі висять деякі борги перед найвпливовішими чорноринковими торговцями зброєю. Час завітати до них."

dln_wartime_recruitment:0 "Воєнна Рекрутська Кампанія"
dln_wartime_recruitment_desc:0 "П’ять акрів землі кожному, хто служитиме до відставки. На периферії — кращої пропозиції не знайдеш."

dln_count_king:0 "Граф, Що Став Королем"
dln_count_king_desc:0 "Поселення оточені, бастіони столиці впали, останні королівські вояки склали зброю. Час пожинати плоди."

dln_fate_monarchy:0 "Доля Старої Монархії"
dln_fate_monarchy_desc:0 "Опівніч проб’є для аристократів і їхнього мертвого Короля. Незабаром історія буде переписана, і всі борги — сплачені."

dln_reorg:0 "Реорганізація Армії Манітоби"
dln_reorg_desc:0 "Аби якнайшвидше відновити зруйновану армію, я вирішив помилувати всіх військовослужбовців, що не входять до вищого командування, за умови повторного вступу. Дуже мало хто обрав в’язницю заради гнилого дворянства."

dln_realm:0 "Оновлення Королівства"
dln_realm_desc:0 "Війна ніколи не є дешевою — але між державами переможець хоча б може компенсувати втрати. У внутрішніх конфліктах — не так. Попереду місяці відбудови, інакше народ почне ностальгувати за минулим режимом."

dln_kingdom:0 "Нова Епоха для Королівства"
dln_kingdom_desc:0 "Армія знову в строю, претенденти усунуті — моє правління над Королівством Манітоба забезпечено. Але це завжди було лише першим кроком. Лише тепер Королівство має інструменти, щоб виправити роки безгосподарності й некомпетентності з боку своїх колишніх правителів — і я подбаю про те, щоб народ це усвідомив."

dln_offensive:0 "Манітоба Наступає"
dln_offensive_desc:0 "На вершині свого могуття Королівство Манітоба було справжньою перлиною Пустища, з герцогствами далеко на периферії, що живили його розмаїту промисловість. Десятиліття війни та бездарного керування знищили цю велич. Але історія дала мені шанс відновити славу минулого — і я його використаю."

dln_lessons:0 "Уроки Повстання"
dln_lessons_desc:0 "Якщо щось і довів наш тріумф над занепалим режимом Ґанна, то це те, що навіть розрізнана, хитка, поспіхом зібрана коаліція здатна здолати сильнішого ворога. Цей урок ми врахуємо, коли настане час поглинути племена на наших кордонах."

dln_where_no_one:0 "Туди, Куди Більше Не Ходять"
dln_where_no_one_desc:0 "Північні рубежі завжди були найнебезпечнішими в Королівстві: потвори з Багряного Лісу часто пробираються в наші поселення, несучи смерть і руйнування. Час узяти на себе відповідальність. Наступ починається зі створення основи для наступних битв."

dln_worst_loss:0 "Найстрашніша Втрата"
dln_worst_loss_desc:0 "Відокремлення Уінніпеґа майже знищило Королівство. Якби не кров і піт моїх людей — воно б таки загинуло. І якщо повстанці вважали, що на тому все скінчиться — вони помилились."

dln_red_fern:0 "Вивчення Червоного Папоротника"
dln_red_fern_desc:0 "Червоний Папоротник — надзвичайно потужний стимулятор, що заборонений у Королівстві. Та нещодавно наші вчені виокремили з нього невідому раніше сполуку, здатну нейтралізувати найнебезпечніші інфекції. Вона може стати ключем до перемоги в Багряному Лісі."

dln_wicked:0 "Проклятий Ліс"
dln_wicked_desc:0 "Ніхто не знає достеменно, що ховається в глибинах Багряного Лісу — істоти, покручені дикою природою й спотвореною наукою. Лише найвідданіші Лицарі зголосились іти на цю кампанію. Ті, хто повернеться — стануть героями. Ті, хто ні — залишаться ними в пам’яті на віки."

dln_madness:0 "Божевілля, Яке Неcе МАНІФЕСТ"
dln_madness_desc:0 "Що далі ми просуваємось, то більший опір і кровопролиття нас чекає. Але ми не зупинимось. Ми знайдемо джерело лиха, що охопило ці землі, і покладемо йому край. Будь-якою ціною."

dln_remains:0 "Залишки Півночі"
dln_remains_desc:0 "Багряна завірюха, Морозні Потвори, нескінченні хащі... Дехто вважає, що намагатись утвердити владу на цих землях — це марна справа. Що краще вдовольнитися тим, що вже маємо.\n\nАле такі люди залишаються у підручниках лише зносками."

dln_fate:0 "Доля Старого Комплексу МАНІФЕСТ"
dln_fate_desc:0 "У самому серці Багряного Лісу, за кількома хвилями чудовиськ, стоїть закинута база МАНІФЕСТ — звук металу й двигунів лунає за її стінами. Хтось — чи щось — знову пробудив її. І саме нам випало знову її приспати."

dln_center:0 "Удар по Центру"
dln_center_desc:0 "Богдан... жалюгідний псевдоправедник із натовпом фанатиків, що пасеться на руїнах серця Королівства. Вони скоро дізнаються, кому в цих краях насправді слід вклонятись."

dln_banners:0 "Повернення Прапорів до Уінніпеґа"
dln_banners_desc:0 "На цього разу наші поточні сили не вистачать. Офіцери по всьому Королівству піднімають резерви. Клич лунає скрізь:\n\n§GТвій час настав — Король і Батьківщина потребують тебе!§!"

dln_avenge:0 "Помста за Республіканські Війни"
dln_avenge_desc:0 "Зі Сходу на Захід, від Північних озер до самої столиці — брязкіт сталі та патріотичні марші. Час настав. Лев рикає.\n\n§GВладика Чекає!§!"

dln_return:0 "Повернення до Уінніпеґа"
dln_return_desc:0 "Нарешті зброя замовкла. Над Манітобою запанував мир. Більше жодна крапля крові не проллється на її землях. Я це гарантуватиму..."

dln_republicans:0 "Республіканці та Олігархи"
dln_republicans_desc:0 "Історію не творять ті, хто уникає важких рішень."

dln_pests:0 "Покидьки на Озері"
dln_pests_desc:0 "Східне узбережжя озера Уінніпеґозіс кишить всілякою мерзотою — від звичайних рейдерів до залишків колишнього режиму. Зачистка цих земель зміцнить наші позиції й зробить води безпечнішими."

dln_golden_age:0 "Нова Золота Епоха"
dln_golden_age_desc:0 "Королівство відновлено у своїй колишній славі. Я мав би бути на полі разом з воїнами, святкувати перемогу... і все ж, почуваюсь трохи слабко. Відійду раніше на нічний спочинок — коли прокинуся, настане новий день для Манітоби."

dln_jewel:0 "Перлина Старої Імперії"
dln_jewel_desc:0 "Молодь і не здогадується, що перша столиця Королівства Манітоба — не Брендон, а Уінніпеґ. Саме його обрав Ґанн І як осердя своєї влади. Імперський палац і досі стоїть у цьому поселенні, хоч і в занепаді після років республіканської зневаги... ще одна спадщина війни, яку належить виправити."

dln_imperial_palace:0 "Відновити Імперський Палац"
dln_imperial_palace_desc:0 "На півночі Уінніпеґа лежать руїни Імперського Палацу — уламки, виставлені як республіканський пропагандистський трофей. Та ми повернулись — а їхні тіла тепер висять на ліхтарних стовпах. Настав час стерти залишки їхньої пам’яті."

dln_academy:0 "Академія Королівських Наук"
dln_academy_desc:0 "Звичайної зброї замало, щоб вигравати війни — особливо в наші часи. Якщо ми прагнемо втримати здобуте, Манітоба має стати лідером у військових інноваціях. А починається це з надання нашій молоді простору для зростання."

dln_winni:0 "Вінніпезька Промисловість"
dln_winni_desc:0 "Будучи серцем Королівства з самого початку, Уінніпеґ служив домівкою для чималої частини промислових проєктів моїх попередників. За часів республіканців ця традиція зникла. Щоб відновити втрати, ми вкладемо все, що маємо, в місто."

dln_home:0 "Ми Вдома"
dln_home_desc:0 "Знадобився справжній шок від індустріалізації, щоб повернути столиці колишню славу — але результат говорить сам за себе. Ласкаво просимо: над містом знову майорить прапор Манітоби."

dln_resettle:0 "Повторне Заселення Абсалону"
dln_resettle_desc:0 "Заселення колишнього герцогства Абсалон набирає обертів. Найвідважніші з переселенців вже застосовують перевірені аграрні методики на цих колись проклятих землях, закладаючи основу для нового життя на околиці Королівства."

dln_resettle_city:0 "Заселення Міста"
dln_resettle_city_desc:0 "Хоча Гудзон-Бей-Сіті був покинутий після спалаху МАНІФЕСТ, у ньому залишились рештки важливих торгових і комерційних інфраструктур. Як тільки новини про перемоги Лицарів дійшли до столиці, сотні вирушили на руїни міста в пошуках щастя."

dln_investment:0 "Пошук Інвестицій для Заселення"
dln_investment_desc:0 "Дім без надійного фундаменту приречений на руйнування."

dln_settle_country_side:0 "Заселити Сільську Місцевість"
dln_settle_country_side_desc:0 "Спершу мало хто з переселенців наважувався зайти в найглибші частини лісу — із зрозумілих причин. Але обіцянки дешевої землі та щедрих грантів переконали найсміливіших."

dln_open_for:0 "Абсалон Відкритий для Бізнесу"
dln_open_for_desc:0 "Бізнес працює, люди — активні. Цього достатньо, щоб земля процвітала."

dln_last_rec:0 "Останні Імперські Землі"
dln_last_rec_desc:0 "Більшість колишніх територій Королівства знову заселені справжніми манітобцями. Але чи можуть вони спати спокійно, знаючи, що вороги все ще ховаються за межами наших кордонів? Я — точно ні."

dln_scars:0 "Останні Рани Республіканських Війн"
dln_scars_desc:0 "Хоч це й менш значуща образа в межах республіканської війни, покручі Заходу досі утримують наші землі. Індивідуально вони слабкі — та їхня єдність загрожує затягнути нас у кривавий глухий кут. Дипломатія може зекономити нам час і життя."

dln_settler:0 "Кочівники"
dln_settler_desc:0 "Корінні мешканці Залізної Конфедерації постійно опинялись вигнанцями. А гіршого сусіда, ніж той, кому нічого втрачати — годі й шукати."

dln_colonies:0 "Колонії за Щитовим Валом"
dln_colonies_desc:0 "У золоті роки Королівства було закладено кілька колоній вздовж озера Уінніпеґ. Але комунікації зникли давно, і жодних спроб відновити зв’язок не робилось. Що ж там коїться на Сході?"

dln_integrity:0 "Відновлена Цілісність Королівства"
dln_integrity_desc:0 "Ми не лише відновили колишню велич — ми розширили кордони, створили буферні зони і надали нашим громадянам шанс почати нове життя. Молодь отримала нові можливості, а старші — спокій за їхнє майбутнє."

dln_manitoba_back:0 "Манітоба Повернулась!"
dln_manitoba_back_desc:0 "Ми зайняли своє місце в залах історії. Але що може завадити нам перевершити навіть найбільші імперії минулого? Ніщо, кажу я вам. Йдіть, мої діти, і рознесіть прапор Манітоби по всій землі; наша історія ще тільки починається."

dln_manitoba_dam:0 "Манітобська ГЕС"
dln_manitoba_dam_desc:0 "Під управлінням північних розбійників, дамба Ґранд-Рапідс занепала — як і слід було очікувати. Відновивши цей ключовий об'єкт, ми створимо сотні нових робочих місць, привабивши амбітних робітників з усього Королівства і поза його межами."

dln_return_law:0 "Повернення Закону і Порядку"
dln_return_law_desc:0 "Із завершенням відновлення ми можемо дозволити собі скорочення армії. Багато солдатів буде переведено до поселень по всьому Королівству, де вони зможуть вести мирне життя, захищаючи свої родини від розбишак і головорізів."

dln_man_res:0 "Велике Відновлення Манітоби"
dln_man_res_desc:0 "Розпочавши перебудову Королівства Манітоба, ми повинні покласти надійний фундамент. Внутрішня стабільність стане запорукою успішних кампаній у майбутньому. Попри те, що багато герцогств існують лише формально, вони стануть корисними адміністративними одиницями для впорядкованого відновлення."

dln_duc_bra:0 "Герцогство Брендон"
dln_duc_bra_desc:0 "Попри всі прорахунки Ґанна II та його ослаблений контроль, Брендон довгі роки залишався осердям влади Королівства. Більшість найяскравіших умів, будівель та комерційних центрів Манітоби зосереджено саме тут. Саме вони стануть фундаментом нашого відродження."

dln_land_clear:0 "Велике Очищення Земель"
dln_land_clear_desc:0 "Поки Брендон ставав своєрідним вузлом останніми роками, навколишні провінції занепали або перетворились на дорогі туристичні атракції. Прийшов час розвитку — і ми знаємо, як це зробити."

dln_ref:0 "Повернути Біженців Додому"
dln_ref_desc:0 "Коли перемоги під час війни множились, тисячі підданих рушили до столиці в пошуках притулку. З війною завершеною, а інфраструктурою Брендона перевантаженою, настав час повертатись додому."

dln_forgotten_city:0 "Забуте Місто"
dln_forgotten_city_desc:0 "Поки Брендон отримував таємні субсидії, місто Стратклер повільно занепадало. Бізнеси переїхали на південь, залишивши поселення зруйнованим. Ще одна рана, завдана аристократами — ще одна спадщина, яку я знищу."

dln_royal:0 "Королівська Дорога"
dln_royal_desc:0 "Королівську дорогу було задумано пів століття тому родиною Брендона, щоб з'єднати Брендон, Ланґенбурґ і Дофін. Але тоді їй не надали належного фінансування. Я не повторю тієї помилки — дім, розділений сам на себе, не вистоїть."

dln_open_door:0 "Відкриті Двері для Старих Підданих"
dln_open_door_desc:0 "Війна за Королівство забрала багато життів, і ми потребуємо кожного. Політика “пробач і забудь” щодо підданих колишніх сепаратистів сприятиме імміграції та послабить наших ворогів."

dln_home_bra:0 "Домівка Герцогів Брендона"
dln_home_bra_desc:0 "Брендон — одне з найдавніших герцогств Королівства, що виховало багатьох його правителів. Моя влада поклала край цьому династичному порядку. Показавши відданість добробуту герцогства, ми не лише пожвавили економіку, а й заспокоїли старих лоялістів."

dln_duc_ang:0 "Герцогство Анже"
dln_duc_ang_desc:0 "Рейдери й найманці, що засіли на березі озера, залишили по собі недобудовані машини для ганебних атак-і-відступу — нічого нового. Але ми знайдемо їм достойніше призначення..."

dln_royal_ins:0 "Королівський Інститут Медицини"
dln_royal_ins_desc:0 "Хоч флора Блайтвуду небезпечна, її медичний потенціал вражає. З належним фінансуванням — це може бути прорив століття. Науковий центр вже закладено у самому серці Гудзон-Бей-Сіті."

dln_linger:0 "Спогади Минулого Більше Не Відізвуться"
dln_linger_desc:0 "Жахи МАНІФЕСТ і Блайтвуду лишилися позаду. Нехай тягар пам'яті залишиться в руках тих, хто має силу діяти. Але для решти — час перегорнути сторінку. І почнемо ми з очищення землі від збоченої спадщини, яку залишили чудовиська."

dln_trade_flow:0 "Нехай Торгівля Тече"
dln_trade_flow_desc:0 "Завдяки відновленню та забезпеченню територій колишнього герцогства Абсалон, Саскачеван знову відкрився для нас. Наші торговці швидко налагодили зв’язки — від кочових племен далекої Півночі до нових поселень Альберти. Королівська казна ніколи не була повнішою."

dln_duc_warwick:0 "Герцогство Варвік"
dln_duc_warwick_desc:0 "Попри вогонь і руйнування війни за Реджайну та навколишні землі, частина колишніх розкішних лісів уціліла. Колись вони давали найякіснішу деревину на захід від Великих Озер і надихнули герцогство на створення неперевершеної деревообробної та робототехнічної промисловості. На жаль, лише частину цієї спадщини нам вдалося повернути."

dln_fell:0 "Ті, Що Першими Падали"
dln_fell_desc:0 "Території Конгресу Метисів стали першими, хто відколовся від Королівства, відкинувши наші війська через Ассінібойн у ході кривавої інсурекції. Для багатьох наших підданих це ознаменувало початок занепаду. Після нещодавньої перемоги, ці самі піддані можуть повірити, що найгірше позаду."

dln_weyburn:0 "Відновити Дім Вейбурнів"
dln_weyburn_desc:0 "Лінія Вейбурнів колись правила важливим поселенням у колишньому герцогстві, стоячи до останнього проти повстанців Метисів. Їхню вірність буде винагороджено — Архангел нарешті повернеться додому."

dln_regina:0 "Майбутнє Реджайни"
dln_regina_desc:0 "Столиця нелегітимного уряду Метисів впала. Перемогти у війні виявилось не так важко — справжнім викликом стане зберегти мир."

dln_mech:0 "Mechanics Universalis"
dln_mech_desc:0 "Оголосивши амністію інженерам, технікам і науковцям, які працювали на Конгрес Метисів, ми здобули знання для розгортання бойових роботів. Відтепер м’язи наших синів і дочок буде закрито міцною сталлю."

dln_duc_abs:0 "Герцогство Абсалон"
dln_duc_abs_desc:0 "Ми успішно знову заселили більшість територій колишнього герцогства Абсалон і відновили його основні торгові потоки. Незабаром ці землі стануть одними з найприбутковіших у Королівстві."

dln_merc:0 "Доля Поселенців-Мерсенаріїв"
dln_merc_desc:0 "Навряд чи хтось хотів би мати цих добродіїв сусідами."

dln_lake:0 "Перлина Озера Уінніпеґозіс"
dln_lake_desc:0 "Чарівне, добре розвинене поселення, ідеально розташоване для того, щоб стати опорним пунктом на Східному кордоні Королівства. Лише трохи зусиль — і рибальське село стане справжньою коштовністю в нашій короні."

dln_seats:0 "Місця Тепер Порожні"
dln_seats_desc:0 "Самотні ночі народжують спрагу за минулим — за чимось старим, до чого вже не дотягтись. Я кажу собі, що це просто думки... та спогади не зникають."

dln_began:0 "Герцогство Ланґенбурґ"
dln_began_desc:0 "Наші предки боролись і вмирали, закладаючи основу, що підняла нас на трон. Лише одне герцогство увійде в історію як те, що врятувало Манітобу. Ланґенбурґ. Герцогство, що ніколи не падало."

dln_arms:0 "Розширити Зброярню Йорктону"
dln_arms_desc:0 "За правління Батька Йорктон став одним із провідних виробників елітної зброї Півночі. Із невеликими інвестиціями та практичним підходом, ми зможемо масштабувати виробництво навіть для найпростіших солдатів."

dln_university_re:0 "Університет Ланґенбурґа"
dln_university_re_desc:0 "Університет Ланґенбурґа — перший заклад вищої освіти у Королівстві. Війнa з Республіканською коаліцією змусила зачинити його двері. Але з відновленням контролю над регіоном, настав час виправити цю ганьбу."

dln_arms_hands:0 "Зброя з Йорктону — Кожному в Руки"
dln_arms_hands_desc:0 "Перші партії новітніх гвинтівок з Йорктону вже на шляху до арсеналів. Надійні, точні, легкі як пір’їна — саме так, як я і очікував."

dln_expand_langenburg:0 "Розширити Столицю"
dln_expand_langenburg_desc:0 "Ми занадто зосередились на Півдні протягом реконструкції. Легендарний Ланґенбурґ уже давно чекає на оновлення. Нові інвестиції принесуть робочі місця в різні галузі — решта підтягнеться."

dln_royal_sci:0 "Королівська Наукова Виставка"
dln_royal_sci_desc:0 "Щоб продемонструвати технічну перевагу Королівства світові, наші Наукові Радники запропонували провести в Ланґенбурзі виставку."

dln_last_line:0 "Остання З Її Роду"
dln_last_line_desc:0 "Ти дивишся на мене, Софіє?"

dln_duc_daw:0 "Герцогство Дофін"
dln_duc_daw_desc:0 "Опанувавши узбережжя Великого Дофіна, наші державні чиновники швидко взялися за відновлення хронічно недофінансованої військово-морської програми. Вона стане ключем до повернення контролю над озером Уінніпеґозіс."

dln_restore:0 "Відновити Королівський Порт"
dln_restore_desc:0 "Королівський порт Дауфін і його околиці занепали після нищівного удару під кінець Війни Республіканської Коаліції. Наступні роки безгосподарності лише погіршили становище. Якщо ми прагнемо відновити наші морські сили, настав час знову запустити механізми."

dln_worthy:0 "Місто, Гідне Своєї Історії"
dln_worthy_desc:0 "Наші інвестиції в Дауфін не залишились непоміченими. Тисячі робітників із сім'ями з усього Королівства та поза ним вже рушили до міста в пошуках нових можливостей. Ми зустрінемо їх із розпростертими обіймами."

dln_stroll:0 "Прогулянка Вулицями Дауфіна"
dln_stroll_desc:0 "Гадаю, я заслужив трохи милування краєвидами…"

dln_arm_fu:0 "Армія Майбутнього"
dln_arm_fu_desc:0 "У давні часи стяги Манітоби викликали страх і захоплення. Але десятиліття кумівства й корупції зруйнували цю репутацію. Під керівництвом командирів із Ланґенбурґа ми повернемо втрачену велич."

dln_roy_air:0 "Королівські Повітряні Сили"
dln_roy_air_desc:0 "Колись війни на Півночі вигравали грубою силою. Але часи змінились. Вороги стали хитріші й витриваліші. Час нам створити постійну повітряну силу."

dln_exp_arm:0 "Реформа Генерального Штабу"
dln_exp_arm_desc:0 "Я вже не рахую, скількох талановитих командирів обійшли заради якихось маріонеткових аристократів. Відтепер усі високі посади будуть присуджуватись за результатами суворих державних іспитів і незалежної перевірки."

dln_rest_knights:0 "Повернути Славу Лицарям"
dln_rest_knights_desc:0 "Під правлінням Ґанна II Орден Лицарів був майже знищений — їхня вірність мені була загрозою для палацових інтриг. Зі старою гвардією покінчено — настав час для відродження найславетнішої бойової сили Королівства. Алеcандер вже підготував низку реформ."

dln_dec_fleet:0 "Децентралізований Флот"
dln_dec_fleet_desc:0 "Фінальний удар по Дауфіну під час останньої війни знищив більшість нашого флоту. З того дня я знаю — не можна тримати все в одному місці. Розпорошене виробництво ускладнить координацію, але зміцнить ланцюг постачання."

dln_imperial_city:0 "Спиратись на Імперське Місто"
dln_imperial_city_desc:0 "Королівський порт Дауфін — серце нашого суднобудування з часів заснування Королівства. Його індустрія тісно пов'язана з нашим флотом. Її розвиток лише посилить цю симфонію циліндрів і поршнів."

dln_banners_knee:0 "Стяги, Що Згубили Манітобу"
dln_banners_knee_desc:0 "Наші останні реформи вже приносять плоди. Наступний крок — дати більше автономії найталановитішим командирам на полі бою. Їхня винахідливість — наша перевага."

dln_learned:0 "За Все, Що Я Пізнав"
dln_learned_desc:0 "Коли командир падає — воїни повинні одразу взяти командування на себе. Оплакувати можна після перемоги. Так написано — так буде виконано."

dln_lifetime:0 "Життя, Прожите у Війні"
dln_lifetime_desc:0 "Від битви до битви — ми маршируємо в службі Королю та Короні.\n\nТам, де волю Короні забезпечують Кров і Залізо.\n\nІ від Заходу до Сходу — немає армії, рівної Армії Лорда."

dln_air_quality:0 "Якість Королівства"
dln_air_quality_desc:0 "Інженери Манітоби завжди славились якістю понад усе. Дайте їм час — і вони створять апарати, що позначать нову сторінку нашої воєнної історії."

dln_air_inspiration:0 "Натхненням — Вінніпеґ"
dln_air_inspiration_desc:0 "Як не дивно, республіканці не дарма розбудовували аеродроми. Тепер вони стануть основою для найвеличнішої повітряної сили Півночі."

dln_skies:0 "Небо Належить Нам!"
dln_skies_desc:0 "Повітряне виробництво вже на повну. Незабаром наші ескадрильї затьмарять саме сонце."

dln_take_skies:0 "Злітайте Разом із Нами!"
dln_take_skies_desc:0 "Почавшись як ідея, Королівські Повітряні Сили швидко стали домінуючою силою у повітрі Півночі. Ми не лише закрили дірку в обороні — ми створили нову спадщину для наступних поколінь."

dln_royal_harbour:0 "Розширити Королівські Гавані"
dln_royal_harbour_desc:0 "Наші перші зусилля з перебудови Дауфіна дали нам основу для подальшого розширення портових споруд за відносно низькою ціною. Я затвердила плани ще в день, коли їх принесли — кожна нова верф наближає нас до безпеки Батьківщини."

dln_dominance:0 "Домінування на Воді"
dln_dominance_desc:0 "Багаті графи та інвестори з усього Королівства помітили наші зусилля в Дауфіні та надали щедрі позики Королівській скарбниці. Разом із уже виділеними коштами, це дозволить розгорнути військове суднобудування у безпрецедентних масштабах."

dln_mare_nostrum:0 "Наше Озеро"
dln_mare_nostrum_desc:0 "Десятки кораблів вийшли з верфі Дауфіна у вузьку протоку до Уінніпеґозісу — на перший Королівський Морський Показ. Ці навчання допомогли виявити технічні недоліки нового флоту, а ще важливіше — вони послали чіткий сигнал: Манітоба повернулася."

dln_eleanor_queen:0 "Нова Епоха для Манітоби"
dln_eleanor_queen_desc:0 "Батька пам’ятатимуть як того, хто вивів нас із прірви. Але тепер, коли загрози відступили, а економіка зростає — ми повинні використати цей час для зміцнення миру та безпеки для себе та Півночі."

dln_modernity:0 "Шлях до Модернізації"
dln_modernity_desc:0 "Я наказала Алеcандеру зібрати Королівський Кабінет. Час чітко позначити мої наміри…"

dln_the_greatest_matter:0 "Найважливіше Питання"
dln_the_greatest_matter_desc:0 "Дехто мав запитання. І я охоче дала на них відповідь."

dln_codify:0 "Закріпити Загальну Освіту"
dln_codify_desc:0 "За роки я зібрала широку мережу контактів у сфері освіти. Без жодних підкилимних ігор — я забезпечу реалізацію мрії про безоплатну загальну освіту в Манітобі."

dln_old_estate:0 "Стара Спадщина"
dln_old_estate_desc:0 "Деякі справи завжди були під прямим наглядом Корони. І я особисто за них візьмусь."

dln_parlament:0 "Новий Парламент?"
dln_parlament_desc:0 "«…Децентралізація, Ваша Високосте?» — несміливо запитав радник із регіональних справ."

dln_powers:0 "Повноваження Монарха"
dln_powers_desc:0 "«Але ж народ любить вас, Ваша Високосте! Ви народжені, щоб правити!» — заперечив королівський радник. «Хто, як не ви, має формувати майбутнє?»"

dln_court:0 "Найвища Судова Інстанція"
dln_court_desc:0 "«А як щодо Верховного Суду, Ваша Високосте? Судді з регіонів не мають права на призначення», — зазначив радник із правосуддя."

dln_minority_right:0 "Закріпити Права Меншин"
dln_minority_right_desc:0 "Королівське Санкціонування має скінчитися — за рік або десятиліття. Але перед тим, як воно зникне, я використаю його, щоб закріпити права наших меншин. І чи йдеться про культурну спадщину Півночі, чи правовий захист Метисів Півдня — усі в Манітобі будуть рівні перед законом. Я готова платити будь-яку ціну."

dln_equal:0 "Усі Рівні Перед Законом"
dln_equal_desc:0 "Ще зарано говорити про довгострокові наслідки реформ, але регіональні губернатори вже надсилають хвалебні листи. Один підпис — і ми зробили гігантський крок до національної єдності."

dln_constitutionalism:0 "Шлях до Конституціоналізму"
dln_constitutionalism_desc:0 "Після того, як усі важливі питання були вирішені, залишилось одне — найголовніше. Зрештою, Тобіас запитав: «Ваша Високосте, ваше прагнення надати більше влади підданим гідне поваги, але…»"

dln_art:0 "Поціновувачі Мистецтва"
dln_art_desc:0 "У часи війни мистецтво було змушене відійти на задній план. Тепер же, коли Королівство у безпеці, я направлю частину військового бюджету на культуру. Хай наші діти ніколи не будуть змушені обирати рушницю замість пензля."

dln_knight_council:0 "Рада Лицарів"
dln_knight_council_desc:0 "Орден Лицарів — сильна бойова сила. Та їм бракувало форуму для обміну досвідом. Відтепер — ні."

dln_ins_tech:0 "Королівський Інститут Технологій"
dln_ins_tech_desc:0 "З поверненням Герцогства Воріка і технологій із комплексу МАНІФЕСТ, ми стрімко просунулись у робототехніці та електроніці. Ми збережемо ці знання — і передамо їх далі."

dln_uni_arch:0 "Вінніпезький Університет Архітектури"
dln_uni_arch_desc:0 "Як найбільше передвоєнне поселення регіону, Уінніпеґ був домом для найамбіційнішої архітектури Манітоби. Що може бути кращим місцем для навчання нових поколінь відтворенню цієї величі у своїх містах?"

dln_gentle:0 "М’яка Манітоба — для М’якого Майбутнього"
dln_gentle_desc:0 "У той морозний ранок… батько прийшов до мене."

dln_legend_never_ends:0 "Легенда Не Має Кінця"
dln_legend_never_ends_desc:0 "«Великі питання епохи вирішуються не промовами та голосуванням, а залізом і кров’ю». Так було… так і буде."

dln_wild_adventures:0 "Дикі Пригоди Йорктонів"
dln_wild_adventures_desc:0 "Я заржавів… мабуть. Час Мечу Півночі знову вести людей у бій."

dln_pax_britannia:0 "Pax Britannia"
dln_pax_britannia_desc:0 "Якщо ти не зробив зла... тобі нічого боятися."

dln_sun_never_sets:0 "Над Британією Сонце Не Сідає?"
dln_sun_never_sets_desc:0 "Я… що я взагалі робив?.."

dln_devil_lives:0 "§RДе Живе Диявол§!"
dln_devil_lives_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_crusade:0 "§RНевиголошена Історія§!"
dln_crusade_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_gunmetal:0 "§RНевиголошена Історія§!"
dln_gunmetal_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_siren:0 "§RНевиголошена Історія§!"
dln_siren_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_avalon:0 "§RНевиголошена Історія§!"
dln_avalon_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_beyond_hell:0 "§RНевиголошена Історія§!"
dln_beyond_hell_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_march_for_the_exile_capital:0 "§RНевиголошена Історія§!"
dln_march_for_the_exile_capital_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_rule_from_ottawa:0 "§RНевиголошена Історія§!"
dln_rule_from_ottawa_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_anglois_roots:0 "§RНевиголошена Історія§!"
dln_anglois_roots_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_a_new_coast:0 "§RНевиголошена Історія§!"
dln_a_new_coast_desc:0 "§GЦя історія буде розказана згодом.§!"

dln_expedite_payback:0 "Прискорити Помсту"
dln_expedite_payback_desc:0 "Майбутнього не буде, поки вони живі. Перемир’я було лише зручністю. Їхні укріплення не врятують їх. Ми розчавимо їх, як кригу навесні."

dln_hope:0 "Трішки Надії!"
dln_hope_desc:0 "Позаду білих парканів і порожніх вивісок у Плезантдейлі, схоже, приховується щось справді цінне."

dln_hawkmoon:0 "Остання Війна Гокмуна"
dln_hawkmoon_desc:0 "Парія Гокмун… одна з небагатьох із хребтом серед гурту боягузів. Та цього разу вона знайшла собі рівного."

dln_dragon:0 "Коли Імператор Бився з Йормунгандом"
dln_dragon_desc:0 "Повідомляють, що наші люди загнали лускатого жаху з околиць Стоона в пастку. Над моєю гвардією нависла тінь. Цей бій — моя справа."

dln_manifest_son:0 "Ідеальний Син МАНІФЕСТ’у"
dln_manifest_son_desc:0 "Я не дозволю, щоб Сквернолісся затьмарило мою спадщину. МАНІФЕСТ, зрештою, служив благій меті… Надія — доказ того. І, схоже, вона не одна така."

dln_dishonour_son:0 "Син Без Честі"
dln_dishonour_son_desc:0 "Пляма на спадщині Манітоби. Час настав — принц схилиться перед імператором."

dln_wine_love:0 "Земля Вина і Любові"
dln_wine_love_desc:0 "Загартована рішучість і непохитна справедливість. Можливо… не все згнило під снігами. Але судити — лише мені."

dln_king_queen:0 "Новий Король та Королева Альберти"
dln_king_queen_desc:0 "Шах і мат. Лишилися тільки Король і Королева — вони навчаться слухатись."

dln_penny_deal:0 "Угода Пенні"
dln_penny_deal_desc:0 "Рейдери й скажені роботи в одному флаконі... сьогодні вівторок, так?"

dln_ending_eternal:0 "Покласти Кінець Вічному Ворогу"
dln_ending_eternal_desc:0 "До республіканців, до рейдерів, до всього цього — були Червоні. Я не спочину, доки північ не буде очищена від їхніх прапорів."

dln_next_big_step:0 "Наступний Великий Крок"
dln_next_big_step_desc:0 "Тієї ночі було особливо холодно…"

