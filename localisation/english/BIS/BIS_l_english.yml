#Note 1: I (Hades) have collated other bits of Bismarck (BIS) LOC in this document (and in doping so have removed it from other sources to keep things neat, so if it's not here, I have royally fucked up)
#Note 2: Yes, Bismarck is spelled with a 'c' (had to correct this several places)
#Note 3: ALL CAPS implies a header.
#FOCII (Broken up by Tree Section for ease of locating)

# Фокуси (Початкові)

BIS_fire:0 "Вогонь"
BIS_fire_desc:0 "Народ Дакоти завжди був витривалим. Інакше не виживеш у краї, що вбивав ще до того, як впали бомби. Хоч і тепліша за Міннесоту, зима в Дакоті може здерти шкіру до кісток. Тож не дивно, що коли настав кінець світу, люди тут були готові. І Біcмарк — не виняток."

BIS_council:0 "§0Рада§!"
BIS_council_desc:0 "Управління — яким би воно не було — неминуче. А інколи гроші лунають гучніше за слова."

BIS_bailiff:0 "§BСудовий Виконавець§!"
BIS_bailiff_desc:0 "Грошима всього не вирішиш. Тут на допомогу приходить важка палиця."

# Фокуси (Наука і техніка)

BIS_COR:0 "Комітет Досліджень"
BIS_COR_desc:0 "У Біcмарку мешкає чимало розумних і талановитих людей — науковців, інженерів, лікарів, мислителів. Проблема в тому, що більшість із них працюють самостійно, на власних проєктах, часто прямо у своїх домівках. Створивши Комітет Досліджень, ми зможемо скоординувати їхню роботу та ефективніше об'єднати знання."

BIS_digging_deep:0 "Копати Глибше"
BIS_digging_deep_desc:0 "Ще до Великої Війни Біcмарк був центром сільського господарства й гірничої справи. Деякі довоєнні ферми біля Геттісберга збереглись майже неушкодженими — тепер ми можемо вивчити їхні технології та відтворити сучасні методи обробки землі."

BIS_resource_acquisition:0 "Камінь і Руда"
BIS_resource_acquisition_desc:0 "На основі архівів Історичного Мідного Рудника у Геттісберзі ми можемо розробити ефективніші способи видобутку корисних копалин."

BIS_flying_high:0 "Злетіти Високо"
BIS_flying_high_desc:0 "Під час битви за Лінтон ми захопили невеликий приватний аеродром довоєнної епохи. Злітна смуга зруйнована, але деякі літаки виявилися достатньо вцілілими, аби їх розібрати. Разом із даними з муніципального аеропорту Біcмарка — ми маємо шанс підняти у небо щось краще за глайдер."

BIS_red_baron_meme:0 "Летючий Цирк"
BIS_red_baron_meme_desc:0 "Якщо зазирнути в архіви, виявляється, що Біcмарк був названий на честь некоґось Отто фон Бісмарка. Схоже, не надто приємна особа. Але ще цікавіше — згадки про якогось «Червоного Барона» та його «Летючий Цирк». Нісенітниця чи ні, але, здається, цей Барон мав цікаві ідеї щодо повітряних боїв. Можливо, варто спробувати їх на практиці."

BIS_long_shot:0 "Дальній Постріл"
BIS_long_shot_desc:0 "Якщо в чомусь дакотці розуміються — то це у зброї. Вони її лагодять, збирають і, найважливіше, стріляють. Наші інженери переглянули старі креслення та зуміли адаптувати деякі рішення для виробництва ґаус-зброї в умовах Пустки."

BIS_gunsmiths:0 "§RЗброярі§!"  # Прямо в стилі Fallout!
BIS_gunsmiths_desc:0 "Під проводом Лі Дональда, §RЗброярі§! Біcмарка здобули славу на весь Північний Захід — аж до Канади. Зі знанням, що передається з покоління в покоління, вони здатні виготовляти зброю, яку інші давно забули. Під керівництвом Дональда вони стали злагодженим братством, що виробляє якісну зброю, якої більше ніде не знайдеш."

BIS_increased_funding:0 "Збільшене Фінансування"
BIS_increased_funding_desc:0 "Якщо виділимо більше ресурсів на дослідження — зможемо паралельно вести більше проєктів. У світі, де передові технології — це питання виживання, це стане неоціненним внеском у наше майбутнє."

# Фокуси (Торгівля)

BIS_CFT:0 "Комітет Торгівлі"
BIS_CFT_desc:0 "Держава Біcмарк постала з торговельного договору між поселеннями, тож не дивно, що торгівля — її кровоносна система. Поки що §0Рада§! та §BСудовий Виконавець§! тримались осторонь, дозволяючи купцям діяти самостійно, що призвело до хаосу й неефективної конкуренції. Час створити Комітет Торгівлі для координації внутрішнього ринку та максимізації вигоди з зовнішніх угод."

BIS_primary_partner:0 "Головний Партнер"
BIS_primary_partner_desc:0 "Переважно купці Біcмарка працюють локально, ведучи торгівлю з сусідніми племенами. Винятки — Манітоба та Річкова Ліга. Але настав час обрати постійного головного партнера для довготривалих прибутків."

BIS_going_north:0 "У Північні Землі"
BIS_going_north_desc:0 "Вибір §BСудового Виконавця§! — знайомі торгівельні шляхи. Королівство Манітоба давно закуповує зброю від §RЗброярів§!, а недавня громадянська війна відкрила нові можливості. Кого б ми не обрали — прибуток гарантований."

BIS_going_west:0 "У Західні Пустки"
BIS_going_west_desc:0 "§0Рада§! надає перевагу новим партнерам на Заході. Хани нагадують Стоячу Скелю: агресивні, дикі. Братство — культ техніки з потужним озброєнням. Обидві сторони мають ресурси та знання, що можуть збагатити Біcмарк."

BIS_friendship_treaty:0 "Договір Дружби"
BIS_friendship_treaty_desc:0 "З торгівлею приходять і нові можливості."

BIS_shaky_handshake:0 "Крихка Угода"
BIS_shaky_handshake_desc:0 "Ми не станемо приятелями із Заходом, але уникнути конфлікту з торговим партнером — розумна стратегія."

# Головні фокуси

BIS_council_of_2275:0 "Рада 2275 Року"
BIS_council_of_2275_desc:0 "Зазвичай §0Рада§! — це клуб для еліти. Але цього року на порядку денному — серйозні теми: бюджет міліції, членство у Річковій Лізі, та розширення кордонів Біcмарка."

BIS_opportunity:0 "Можливість"
BIS_opportunity_desc:0 "§BСудовий Виконавець§! відчуває шанс: Стояча Скеля втягнута у війну, а їхні кордони майже не охороняються. Якщо напасти зараз — ми зможемо забрати землі без серйозного опору."

BIS_linton:0 "Лінтон"
BIS_linton_desc:0 "Захопивши Лінтон, ми можемо заселити його колоністами та налагодити промисловість, щоб утримати цю територію."

BIS_new_gettysburg:0 "Геттісберг"
BIS_new_gettysburg_desc:0 "Південніше Лінтона, Геттісберг дозволяє замкнути фланг Стоячої Скелі. Заселення та розвиток інфраструктури зміцнить наш контроль."

BIS_settling_in:0 "Осідання"
BIS_settling_in_desc:0 "Колоністи можуть допомогти «переконати» місцевих провести голосування про анексію. §BСудовий Виконавець§! також наказав укріпити річкові береги для захисту від ударів у відповідь."

BIS_a_buck_a_day:0 "Кришка на День — і Сіу не прийде"
BIS_a_buck_a_day_desc:0 "§BСудовий Виконавець§! волів би атакувати Сіу, але §0Рада§! знає: гроші краще за кулі. Кришки розв’яжуть більше проблем, а битися можна й пізніше."

BIS_getting_rich:0 "Збагачення"
BIS_getting_rich_desc:0 "Поки Стояча Скеля зайнята, можна зосередитись на розширенні економіки. Питання лише — куди спрямувати зусилля?"

BIS_farming:0 "Фермерство"
BIS_farming_desc:0 "Їжа — це життя. Збільшивши виробництво харчів, ми гарантуємо безпеку. Надлишок можна вигідно продати."

BIS_trade:0 "Торгівля!"
BIS_trade_desc:0 "Серце кожної держави! Ми знаємо, як обертати хлам на кришки. І на звільнене місце можна притягти ще більше непотребу!"

BIS_manufacturing:0 "Виробництво?"
BIS_manufacturing_desc:0 "Новий напрямок для Біcмарка. §RЗброярі§! — чудові, але власна промисловість відкриває нові горизонти. Поки не надто вигідно, але з часом ми зможемо змагатися навіть з великими фракціями."

BIS_future_bismarck:0 "Майбутнє Біcмарка"
BIS_future_bismarck_desc:0 "Світ навколо ворожий. З одного боку — агресивна Стояча Скеля, з іншого — племена, маски та загадкові сховища. Треба визначитись зі стратегією, поки нас не стерли."

# Оборона

BIS_strengthen_walls:0 "Укріпити Мури"
BIS_strengthen_walls_desc:0 "Мури Біcмарка міцні, але ще міцніші — окопи. Залежить лише від того, де саме ми їх копатимемо."

BIS_forward_defense:0 "Оборона на Кордоні"
BIS_forward_defense_desc:0 "§BСудовий Виконавець§! наполягає на лінії прямо по кордону зі Стоячою Скелею. Так ми збережемо більше земель."

BIS_river_line:0 "Лінія Міссурі"
BIS_river_line_desc:0 "§0Рада§! вважає, що лінія по річці — безпечніша. Втратимо територію, але отримаємо вузький фронт, легший для оборони."

BIS_the_bailiffs_own:0 "§BОформити Особисту Гвардію§!"
BIS_the_bailiffs_own_desc:0 "Гвардія §BСудового Виконавця§! — це суміш найманців, колишніх солдатів і вихідців зі сховищ. Добре озброєні й досвідчені, вони можуть стати кістяком нашої армії."

BIS_mercenaries:0 "§0Найманці§!"
BIS_mercenaries_desc:0 "§0Рада§! каже: більше солдатів краще, ніж якісніші. Наймемо купу найманців і кинемо їх у бій — кількість усе вирішить!"

BIS_digging_trenches:0 "Рити Окопи"
BIS_digging_trenches_desc:0 "Оборонні споруди потрібні негайно. Але питання фінансування та логістики досі відкриті."

# Розширення та загрози

BIS_expanded_thinking:0 "Розширене Мислення"
BIS_expanded_thinking_desc:0 "У чомусь §0Рада§! і §BСудовий Виконавець§! згодні: ми слабкі проти ворогів навколо. Треба діяти поетапно, розбиваючи загрози одну за одною."

BIS_rear_lines:0 "Тилові Загрози"
BIS_rear_lines_desc:0 "Двоє Народів — то торгівля, то сутички. Ми не можемо дозволити удар в спину під час війни з іншими. Краще вирішити питання силою."

BIS_demand_carrington:0 "Вимагати Каррінгтон"
BIS_demand_carrington_desc:0 "Культ Сайло на півночі — загроза. Вимагаймо територію Каррінгтон і подивімось, як вони на це відреагують."

BIS_buy_carrington:0 "Купити Каррінгтон"
BIS_buy_carrington_desc:0 "Пряма загроза може призвести до війни. §0Рада§! пропонує інше — викупити Каррінгтон. Дешевше і стратегічно вигідно."

BIS_settling_tensions:0 "Вгамування Опору"
BIS_settling_tensions_desc:0 "Захоплені землі неспокійні. Треба визначити підхід до придушення спротиву — або м’яко, або жорстоко."

BIS_the_big_one:0 "Великий Удар"
BIS_the_big_one_desc:0 "Стояча Скеля не приховує своєї жадоби. Ми — ласий шматок. Пора бити першими."

bis_german_heritage:0 "Революціонери 2048 року"
bis_german_heritage_desc:0 "Німецькі науковці першими створили ґаус-гармати до Великої Війни. Іммігранти, які тікали від Ресурсних Війн, привезли цю технологію до Америки. Деякі з їхніх нащадків у Біcмарку й досі вміють обслуговувати й ремонтувати ці тріумфи вільної німецької інженерії."

BIS_ID_COR:0 "Комітет Досліджень"
BIS_ID_COR_desc:0 "Створений для координації наукових розробок, КД контролює різноманітні проєкти, забезпечуючи їх ефективність — навіть у таких віддалених містах, як Біcмарк."

BIS_ID_resource_extraction:0 "Комітет Ресурсного Видобутку"
BIS_ID_resource_extraction_desc:0 "§W«КРВ спрямований на координацію між шахтами, фермами та іншими підприємствами. Ми сподіваємось підняти видобуток сталі на 30%, а харчів — на 50%!»§! \n\n— §0Радник§! Томас, новообраний голова КРВ"

BIS_ID_gunsmiths_internal:0 "§RЗброярі§!"
BIS_ID_gunsmiths_internal_desc:0 "Знамениті в Дакотах і за їх межами, §RЗброярі§! Біcмарка виготовляють зброю якістю не гірше довоєнної. Вони досягають цього завдяки майстерності, увазі до деталей і знанням, що передаються поколіннями. Навіть попри лайливого лідера, їхній внесок у могутність Біcмарка безцінний.\n\n§W«Сука!»§! — Лі Дональд, головний §RЗброяр§!"

BIS_safety_means_money:0 "Безпека — це прибуток"
BIS_safety_means_money_desc:0 "§0Рада§! не найетичніший уряд у пустках, але вміє заробляти. Стоячій Скелі заплатили — і торгівля процвітає, з розкошами звідусіль."

BIS_building_defenses:0 "Будуємо Оборону"
BIS_building_defenses_desc:0 "§W«Жодна стіна не буває надто високою, жодна фортеця — надто міцною, щоб її не зміцнити ще більше. Але й не шкодить спробувати.»§! \n\n— Роджер Нельсон, §BЗаступник Судового Виконавця§! з Вілтона"

BIS_id_mercenaries:0 "Найманці"
BIS_id_mercenaries_desc:0 "Вони підсилюють армію чисельно, але неорганізовані. У кожного свої протоколи зв’язку, стандартів нуль. До того ж — п’яниці, розпусники, шельмецюги... одним словом — типовий найманець."

BIS_id_ancient_equipment:0 "Довоєнне Шахтарське Обладнання"
BIS_id_ancient_equipment_desc:0 "Старі шахтарські машини, дбайливо збережені та відновлені. Біcмарківці завдяки ним ефективно видобувають ресурси. Може, ще на дві сотні років вистачить."

BIS_bismarck_police:0 "Варта Біcмарка"
BIS_bismarck_police_desc:0 "Місцева поліція, що патрулює міста, освітлює вулиці, ловить злочинців і завжди перша на виклик. Просто не задавайте їм дурних питань."

BIS_id_ground-attack:0 "Стратегії Штурмовиків"
BIS_id_ground-attack_desc:0 "Збивати ворожі літаки — добре, але війни виграє піхота. Наші штурмовики зосередяться на підтримці наземних сил."

BIS_id_dirty_dogfighting:0 "Брудні Сутички"
BIS_id_dirty_dogfighting_desc:0 "Хай іде підтримка наземки, але без переваги в повітрі її не буде. Наші пілоти б’ються, як скажені гончі — і виграють."

BIS_id_underfunded_militia:0 "Недофінансована Міліція"
BIS_id_underfunded_militia_desc:0 "§W«§0Рада§! вважає, що міліція вже має вдосталь коштів. А от витрати на її 'розширення' — марнотратство.»§! \n\n— §0Радник§! Альбертсон, головний скарбник"

BIS_id_fully_funded_militia:0 "Повнофінансована Міліція"
BIS_id_fully_funded_militia_desc:0 "§W«Навіть не думав, як скучив за стрільбою бойовими патронами. На полігон, солдати!»§! \n\n— Капітан Тачстоун, §BЗаступник Судового Виконавця§! Пік-Сіті"

BIS_id_buy_our_way_out:0 "Відкупитися"
BIS_id_buy_our_way_out_desc:0 "Не завжди війна — вихід. Часто торбина кришки краща за тисячу багнетів."

BIS_id_first_strike:0 "Політика Першого Удару"
BIS_id_first_strike_desc:0 "§W«Чув, що найкращий захист — це напад. Хто сунеться — отримає першим.»§! \n\n— Генрі Судерман, §BСудовий Виконавець§! Біcмарка"

BIS_id_minimal_works:0 "Мінімальні Роботи"

BIS_id_maximal_works:0 "Максимальні Роботи"

BIS_gunsmitch_external_id:0 "§RЗброярі§! Біcмарка"
BIS_gunsmitch_external_id_desc:0 "§RЗброярі§! — майстри, яким мало рівних у Пустках. Їхня зброя — точна, смертоносна і стабільна. Співпраця з ними — честь і перевага."

BIS_id_bailiff_lessons:0 "Уроки §BСудового Виконавця§!"
BIS_id_bailiff_lessons_desc:0 "Наші юнаки служать у військах Біcмарка як найманці. Вони вчаться тактики, бойового досвіду й повертаються загартованими. А ще — з купою кришок."

BIS_ID_resource_extraction_uber:0 "Комітет Ресурсного Видобутку"
BIS_ID_resource_extraction_uber_desc:0 "§W«КРВ спрямований на координацію між шахтами, фермами та іншими підприємствами. Ми сподіваємось підняти видобуток сталі на 30%, а харчів — на 50%!»§! \n\n— §0Радник§! Томас, новообраний голова КРВ"

BIS_mongol_kids:0 "Молоді Воїни Ханів"
BIS_mongol_kids_desc:0 "Поки діє наш союз із Ханами, ми отримуємо їхню молодь як найманців. Вони рвуться в бій, гарячі та сміливі. Інколи занадто — але за це ми й платимо."

#TOOLTIPS

#Focus Tooltips

BIS_southern_fortify_tooltip:0 "§GМи укріпимо переправи через річку в Лінтоні та Геттісбурзі.§!"
BIS_forward_fortify_tooltip:0 "§GМи укріпимо кордон зі Стоячою Скелею, а також усі переправи через річку Міссурі.§!"
BIS_river_fortify_tooltip:0 "§GМи укріпимо всі переправи через Міссурі та південний кордон зі Стоячою Скелею в Лінтоні.§!"
BIS_bailiffs_own_tooltip:0 "§YДо нашої армії приєднаються чотири повністю екіпіровані й досвідчені підрозділи спецназу.§!"
BIS_mercenaries_tooltip:0 "§YМи отримаємо рішення для найму найманців з усього Півночі до нашого війська.§!"
BIS_carrington_tooltip:0 "§gЯкщо вони погодяться, ми отримаємо контроль над Каррінґтоном.§!"
BIS_has_caps_for_coring:0 "§RЯкщо ми назбирали достатньо кришок, це стане значно легше.§!"
BIS_resource_uber_TT:0 "§CОскільки ми зберегли шахтне обладнання, цей фокус дасть значно сильніший бонус!§!"
BIS_treaty_tighten_tooltip:0 "§gКонфлікт між Манітобою й Коаліцією має завершитися — лише одна сторона має залишитися.§!"
BIS_gunsmiths_gain_focus_tt:0 "Поки ми маємо цю ідею, §RЗброярі§! щомісяця виготовлятимуть 10 ґаус-рушниць і постачатимуть їх нам."

