#DECISIONS

#Категорії

BIS_trade_category_bis:0 "Торгівля з Партнером"
BIS_trade_category_bis_desc:0 "Тут з’являтимуться всі постійні торгові угоди — як з нашим партнером, так і з членами Річкової Ліги. Деякі партнери запропонують більше варіантів зі зміцненням відносин!"

BIS_special_trade_category_bis:0 "«Цікаві» Торги"
BIS_special_trade_category_bis_desc:0 "Хоч ми й маємо одного торгового партнера, інші гравці Пустки теж мають... «цікаві» пропозиції. Ці покупки одноразові, але можуть щедро віддячити. §RДеяким із них Річкова Ліга не зрадіє.§!"

BIS_mercenaries_category_bis:0 "Найманці для Найму"
BIS_mercenaries_category_bis_desc:0 "Відповідно до уподобань §0Ради§!, ми розіслали контракти по всій Півночі. І, здається, попит є!"

BIS_bismarck_trade_all:0 "Торгівля з Біcмарком!"
BIS_bismarck_trade_all_desc:0 "Погодившись на пропозицію Біcмарка, ми отримали доступ до їхніх зброярських умінь і змогу напряму купувати зброю!"

BIS_loyalty_balance_category:0 "Рішення щодо Лояльності"

#Базові торгові опції

BIS_bos_scrap_trade:0 "Купити Брухт у Братства"
BIS_bos_scrap_trade_desc:0 "Братство Сталі — майстри зі збирання мотлоху. Може, продадуть трохи — за кришки, звісно."

BIS_bos_advanced_trade:0 "Купити Технології у Братства"
BIS_bos_advanced_trade_desc:0 "Окрім брухту, Братство має доступ до більш цінних матеріалів. За трохи більше грошей вони можуть змінити напрямок постачання."

BIS_kha_food_trade:0 "Купити Брамін у Ханів"
BIS_kha_food_trade_desc:0 "Хани — не тільки воїни, а й чудові скотарі. У них точно є надлишок — ми його «розвантажимо»... за справедливу ціну."

BIS_kha_chems_trade:0 "Купити Хіми у Ханів"
BIS_kha_chems_trade_desc:0 "Хани — одні з найкращих хімарів у післявоєнній Америці. Хто їх учив — не наше діло. Наше діло — купити й використати в наших цілях."

BIS_bra_dln_gold_trade:0 "Купити Зливки у Манітоби"
BIS_bra_dln_gold_trade_desc:0 "Золото — завжди добре. У Манітоби його вдосталь. Потрібна тільки готівка... у кришках."

BIS_bra_dln_equipment_trade:0 "Купити Обладнання у Манітоби"
BIS_bra_dln_equipment_trade_desc:0 "Лицарі чи Монті — Манітоба вміє виготовляти якісне спорядження. Час трохи з цього прикупити."

BIS_bra_dln_dam_trade:0 "Під’єднатися до Мережі Дамби"
BIS_bra_dln_dam_trade_desc:0 "Після повернення дамби Ґранд-Репідс, у Манітоби вдосталь енергії. За відповідну плату ми могли б отримати доступ..."

BIS_bra_dln_blimp_trade:0 "Купити Дирижаблі у Манітоби"
BIS_bra_dln_blimp_trade_desc:0 "Знищення Трьох Річок дало Манітобі повітряний флот. Може, скинемо їм трохи кришок і позбудемося їхніх гучних машин? Угу, нам же гірше."

BIS_wpg_cells_trade:0 "Купити Енергоосередки у Трьох Річок"
BIS_wpg_cells_trade_desc:0 "Три Ріки мають контроль над Річкою — отже, й над енергією. Трохи кешу — і, може, щось продадуть."

BIS_wpg_blimp_trade:0 "Купити Дирижаблі у Трьох Річок"
BIS_wpg_blimp_trade_desc:0 "Три Ріки широко використовують дирижаблі у військових цілях. Якщо заплатити чимало — і підкреслюємо: чимало — зможемо забрати кілька собі."

#Special Trades

BIS_advanced_schematics_trade:0 "Купити Передові Схеми"
BIS_advanced_schematics_trade_desc:0 "Братство в Монтані відчайдушно потребує кришок, зброї та ресурсів. Було б по-сусідськи допомогти їм. Можливо, вони поділяться передовими технологіями навзаєм? Це ж справедливо."

BIS_khan_mercenaries_trade:0 "Запросити Найманців Ханів"
BIS_khan_mercenaries_trade_desc:0 "Хани — люті воїни. Їхнім новобранцям потрібно довести свою вартість у бою. Ми можемо запропонувати навчати їх тактиці та використовувати в наших лавах. Вони отримують підготовлених бійців — ми отримуємо солдатів. Виграють усі."

BIS_combat_gear_trade:0 "Купити Бойове Спорядження"
BIS_combat_gear_trade_desc:0 "Королівство Манітоба завжди піклувалося про найкраще оснащення для своїх елітних військ. Якщо ми підмастимо потрібні долоні — можливо, дізнаємось кілька їхніх секретів."

BIS_research_equipment_trade:0 "Купити Дослідницьке Обладнання"
BIS_research_equipment_trade_desc:0 "Уінніпеґ залишився осередком освіти у післявоєнному світі, з щонайменше одним університетом. Вони завжди потребують грошей, а ми готові платити — за їхнє обладнання для розширення наших наукових можливостей."

BIS_factory_investments_trade:0 "Шукати Інвесторів для Фабрик"
BIS_factory_investments_trade_desc:0 "Манітоба має одну з найбільших промислових баз Півночі. Залучення інвестицій з їхнього боку — слушна ідея. Ну і що з того, що частину нашої промисловості контролюватиме інша держава, правда?"

BIS_fusion_cores_trade:0 "Купити Ядерні Осередки в Божевільних"
BIS_fusion_cores_trade_desc:0 "Хай Церква Сховища й здається божевільною, в них повно ядерних осередків. Переконати їх буде складно, але вдасться отримати стільки, що вистачить на роки."

#Mercenary Decisions

BIS_mountie_mercenaries:0 "Найняти Ветеранів-Монті"
BIS_mountie_mercenaries_desc:0 "Монті з Манітоби — елітна сила, віддана своїм принципам. Найм таких ветеранів значно підсилить наше військо — вони стануть ударною групою."

BIS_marshal_mercenaries:0 "Найняти Колишніх Маршалів"
BIS_marshal_mercenaries_desc:0 "Маршали — наші земляки, що поєднали ідеї вільних штатів і колишніх нацгвардійців. Досвідчені солдати. Найм таких — значне посилення для нас."

BIS_atom_mercenaries:0 "Найняти Фанатиків Атома"
BIS_atom_mercenaries_desc:0 "Хоч ми й маємо розбіжності з Церквою Сховища, декотрі з їхніх вірян готові битися за гроші. Не найкращі солдати, зате мають запал, якого бракує іншим."

BIS_rabble_mercenaries:0 "Призвати Вуличний Натовп"
BIS_rabble_mercenaries_desc:0 "У крайніх випадках завжди можна зібрати натовп із безхатьків, мандрівників, шукачів пригод. Справжніми солдатами їх не назвеш, але кількість — теж сила."

#External Trades (назви лише — опис не потрібен)

BIS_weaponry_trade_mnc_kha:0 "Купити Звичайну Зброю"
BIS_gauss_trade_mnc_kha:0 "Купити Ґаус-Зброю"
BIS_weaponry_trade_dln_bra:0 "Купити Звичайну Зброю"
BIS_gauss_trade_dln_bra:0 "Купити Ґаус-Зброю"
BIS_weaponry_trade_wpg:0 "Купити Звичайну Зброю"
BIS_gauss_trade_wpg:0 "Купити Ґаус-Зброю"

#Loyalty Decisions

BIS_bailiff_level_1:0 "Залучити Новобранців"
BIS_bailiff_level_1_desc:0 "Війську Біcмарка завжди потрібна свіжа кров. Новобранці поки марні в бою, але легко сприймають ідеологію. А під командуванням §BBайліфа§! вони схильні підтримувати саме його."

BIS_bailiff_level_2:0 "Розширити Повноваження Молодших Офіцерів"
BIS_bailiff_level_2_desc:0 "Надавши більше свободи молодшим офіцерам, ми підвищимо ефективність бою — і зміцнимо позиції §BBайліфа§!, адже більшість із них його прибічники."

BIS_bailiff_level_3:0 "Скористатися Приватним Арсеналом §BBайліфа§!"
BIS_bailiff_level_3_desc:0 "§BBайліф§! Зудерман має власну колекцію вогнепалу для себе й свого оточення. Використання цього арсеналу додасть вогню нашим військам — і політичного капіталу §BBайліфу§!."

BIS_council_level_1:0 "Задіяти Старі Борги"
BIS_council_level_1_desc:0 "Деякі впливові члени §0Ради§! готові профінансувати наші операції. Але приймаючи їхні гроші, ми потрапляємо в їхню кишеню."

BIS_council_level_2:0 "Роздати Розкоші"
BIS_council_level_2_desc:0 "Члени §0Ради§! мають доступ до делікатесів, про які народ тільки мріє. Якщо трохи цих запасів потрапить на ринок — підтримка §0Ради§! зросте."

BIS_council_level_3:0 "Підмалювати Бухгалтерію"
BIS_council_level_3_desc:0 "Завдяки «творчій» бухгалтерії ми можемо збільшити прибутки. Та ці махінації принесуть §0Раді§! ще більше впливу через новий компромат."

#Formable

form_union_of_bismarck:0 "Утворити Союз Бізмарка"
form_union_of_bismarck_desc:0 "Після знищення Стендінґ-Року ми поглинули нові поселення, значно розширивши нашу державу. Ми більше не просто Бізмарк і його околиці — ми великий Союз територій."

