#EVENTS

nf_bis.1.t:0 "Велика Війна на Півночі"
nf_bis.1.d:0 "Коли небо зайнялося полум’ям, а світ скінчився, жителі Дакоти ховалися в укриттях, підвалах і саморобних бункерах. У місті Бізмарк паніка ширилася, адже порядок стрімко руйнувався. Поліція та військові покинули свої пости, ополчення дезертирувало, а губернаторську резиденцію пограбували. Бізмарк уникнув прямого удару, але був надто близько до авіабази Майнот, аби не відчути ударну хвилю. Разом із нею прийшли й руйнування.\n\nАле не все було так похмуро. Попри повне розпадання уряду Північної Дакоти, держава встигла підготуватись до прийдешнього пекла. По всьому місту були заховані запаси — у поспіхом збудованих бункерах і укріплених складах. Присутні були всі класичні складові для виживання, та що ж саме вирішили зберігати?"
nf_bis.1.a:0 "Їжа й сільськогосподарське приладдя"
nf_bis.1.b:0 "Дороге гірниче обладнання"
nf_bis.1.c:0 "Купа зброї!"

nf_bis.2.t:0 "Що Залишилося"
nf_bis.2.d:0 "Коли пил осів і все скінчилося, Бізмарк був містом-руїною. Вулиці були завалені уламками, а залишки інфраструктури трималися на чесному слові. Щоб повернути бодай якусь подобу порядку, найвища за званням посадова особа в місті — тимчасова §Bшерифка§! Верховного суду Північної Дакоти та заступниця окружного шерифа — Агнес Нельсон зібрала людей і ресурси.\n\nХоча на успіх сподівалися мало, її загін захопив Капітолій, прилеглі райони та міст через I-94. Далі, після мобілізації, їм вдалося дістатися до Авеню Арбор і захопити Медичний центр, перш ніж наступ вичерпався.\n\nЗгодом Агнес створила першу §0Раду§! Бізмарка — з тих, хто залишився зі старої держслужби. У наступні роки на чому зосередилась §0Рада§!?"
nf_bis.2.a:0 "Цивільна промисловість"
nf_bis.2.b:0 "Військове виробництво"
nf_bis.2.c:0 "Очищення від завалів"

nf_bis.3.t:0 "Закон і Порядок (Переважно)"
nf_bis.3.d:0 "До 2083 року §Bшерифка§! та її загін, тепер знані як «§BВласні Шерифа§!», зачистили та відновили контроль над усім Бізмарком і його передмістями. У 2090 році в місті офіційно повернули цивільне правління. §BАгнес§! зберегла частину влади після передачі, активно просуваючи ідею агресивної експансії.\n\nЦе було відхилено §0Радою§!, яка обрала курс на об'єднання навколишніх громад через торгівлю та дипломатію. Представники з навколишніх міст уклали пакт оборони й торгівлі, згідно з яким кожне місто лишалося номінально незалежним, але зобов'язувалося допомагати решті в разі загрози. §0Рада§! лишалася органом представництва всіх міст, а §Bшериф§! виконував радше церемоніальні функції — крім військових справ.\n\nЦя система збереглася до сьогодні, хоч тепер місця в §0Раді§! здобувають радше через хабарі та економічну силу. Протягом років §Bшерифи§! мали різний рівень впливу. Яку політику вони найактивніше просували?"
nf_bis.3.a:0 "Сильна поліція"
nf_bis.3.b:0 "Постійна армія"
nf_bis.3.c:0 "Добре врегульоване ополчення"

nf_bis.4.t:0 "Верховне Мистецтво — Не Розбитися"
nf_bis.4.d:0 "Маючи креслення літаків і можливість виробництва, ми тепер маємо навчити когось їх пілотувати. Це буде непросто — будь-хто при здоровому глузді буде всіма силами триматися за землю. Добровольців буде мало, а втрати — високі, поки не зрозуміємо, як це все працює.\n\nУ світлі цього, нам слід обрати напрямок для пілотів (окрім вміння не врізатись у землю). Підтримка наземних сил із повітря — величезна перевага. Утім, якщо зосередитися на повітряних боях (хоч це й абсурд — собаки не літають), ми краще захистимо себе від ворожої авіації. Обидва варіанти мають стратегічну вагу."
nf_bis.4.a:0 "Смерть зверху!"
nf_bis.4.b:0 "Битися, як пси!"

nf_bis.5.t:0 "Безпека чи Прибуток"
nf_bis.5.d:0 "Із зростанням зацікавлення в торгівлі поза межами наших найближчих сусідів приходить усвідомлення: наразі ми можемо підтримувати лише одну постійну торгову місію. Це може змінитися з часом, але зараз ресурси обмежені.\n\nТорговий комітет визначив чотири можливі цілі. На заході — Глава Братства зі штату Монтана, з якою ми мали обмежений контакт через Річкову Лігу. Також на заході — Хани, група диких рейдерів, обізнаних у виробництві хімікатів. Ми знаємо про них небагато. Обидва варіанти — нові гравці в регіоні та потенційна загроза. Проте, на думку §0Ради§!, саме вони обіцяють більший прибуток завдяки технологіям і незвичним навичкам.\n\nНа півночі — знайомі землі. Ми давно торгуємо з Манітобою, і вони ставляться до нас чесно. Вони також відкриті до потенційного альянсу — варіант, якого бажають §BШерифи§!. Є також новостворена Республіка Трьох Річок — вороги Манітоби, зате зацікавлені в закупівлі зброї. Їм зараз не до вибору — вони воюють."
nf_bis.5.a:0 "Прибуток"
nf_bis.5.b:0 "Безпека"

nf_bis.6.t:0 "Найнецивілізованіша Війна"
nf_bis.6.d:0 "Королівство Манітоба опинилося в скрутному становищі: бунтівне герцогство на заході й сепаратистська республіка на сході. Ідеальний ринок для продажу зброї обом сторонам. Ми можемо скористатися ситуацією на повну.\n\nАле... королівська влада, схоже, доживає останні дні. Можливо, варто почати діалог із Республікою Трьох Річок — новою силою на півночі. Можливо, це буде практичніше."
nf_bis.6.a:0 "Королівство"
nf_bis.6.b:0 "Республіка"

nf_bis.7.t:0 "Незламні Союзники"
nf_bis.7.d:0 "Після знищення Трьох Річок Манітоба стала беззаперечним лідером на півночі. Наш внесок у їхню перемогу зміцнив наші стосунки та відкрив нові можливості для торгівлі. Ми можемо запропонувати постійний союз або розширити економічну співпрацю — обидва варіанти принесуть нам користь."
nf_bis.7.a:0 "Більше торгівлі — більше грошей!"
nf_bis.7.b:0 "Ми прагнемо союзу!"

nf_bis.8.t:0 "Прагматизм"
nf_bis.8.d:0 "Після падіння Манітоби Три Річки стали домінуючою силою на півночі. Наші відносини з ними — суто практичні. Як колишній партнер Королівства, ми викликаємо в них певну підозру. Це створює напруження на кордоні. Щоб уникнути подальшого конфлікту, слід запропонувати пакт про ненапад."
nf_bis.8.a:0 "Це на краще"

nf_bis.9.t:0 "Роги й Сталь"
nf_bis.9.d:0 "На заході — дві нові сили. Про Братство ми дещо знаємо з Річкової Ліги, але наміри саме цієї групи незрозумілі. Вони мають передові технології й технічну майстерність, але торгівля з ними зміцнить потенційного ворога.\n\nПівденніше діють так звані «Великі Хани» — войовничі кочівники з апетитом до розширення. Поки що вони обмежені своїм регіоном, але все може змінитись, якщо дати їм зброю. Натомість, їхнє вміння виробляти хімікати може принести нам шалений прибуток. Бо завжди знайдеться дурень, який захоче кайфонути."
nf_bis.9.a:0 "Обираємо Роги"
nf_bis.9.b:0 "Поділяться Сталлю"

nf_bis.10.t:0 "Зібрання"
nf_bis.10.d:0 "§0Рада§! збирається щороку, але зазвичай обговорює дрібниці: податки, витрати, безкінечні суперечки. Але цього року — важливі питання. Перше з них: хто повинен мати більше влади в Бізмарку? §BШерифи§! давно хочуть повернути собі повноваження, які відібрала §0Рада§!, і Судерманн не виняток.\n\nПрихильники §BШерифа§! стверджують, що §0Рада§! дбає лише про власні кишені (і не дуже помиляються). §0Рада§! ж натомість заявляє, що §BШериф§! хоче встановити військову диктатуру. §RЗброярі§! вважають обидві сторони смішними й наполягають на розвитку промисловості."
nf_bis.10.a:0 "§0Рада§! перемагає!"
nf_bis.10.b:0 "§RЗброярі§! втручаються."
nf_bis.10.c:0 "§BШериф§! тріумфує!"

nf_bis.11.t:0 "Річкова Ліга"
nf_bis.11.d:0 "Друге, і, можливо, найважливіше питання — подальше членство Бізмарка в Річковій Лізі. Хоча Ліга принесла дехто́му в Бізмарку шалені статки, загальний вплив на населення останніми роками був радше негативний. Особливо болючими є високі податки та втручання Ліги у внутрішні справи міста.\n\n§0Рада§! хоче залишитись членом, вказуючи на економічні можливості, які відкриває Ліга. Розкоші, хоч і дорогі для простих громадян, надходять аж із Мексики. Це, мовляв, лише благо.\n\n§BШериф§! і його прихильники вважають Лігу за завадників у долі Бізмарка й прагнуть розірвати зв’язки. Це дало б змогу переорієнтувати ресурси на самозабезпечення міста."
nf_bis.11.a:0 "Ми сильніші в складі Ліги!"
nf_bis.11.b:0 "Пройдемо власним шляхом."

nf_bis.12.t:0 "Бюджет Міліції"
nf_bis.12.d:0 "Третє — постійне питання фінансування міліції. Багато членів §0Ради§! вважають, що міліція отримує надмірні кошти, й нарікають на корупцію (іронічно, зважаючи, що більшість із них самі купили свої посади). Вони вважають, що зменшення бюджету дозволить інвестувати в інші галузі.\n\n§BШериф§! Судерманн називає це дурістю. Він вказує на оточення Бізмарка потенційними ворогами та на те, що наше існування забезпечила саме озброєна міліція (принаймні краща за сусідські). Без ополчення наші невеликі регулярні сили були б розбиті ще на підходах."
nf_bis.12.a:0 "Скоротити марнотратство."
nf_bis.12.b:0 "Погодити повний бюджет!"

nf_bis.13.t:0 "Спеціалізація Фабрик"
nf_bis.13.d:0 "З розвитком нашого виробничого сектору ми усвідомили: наразі вистачає ресурсів лише на одну спеціалізацію. Чи варто інвестувати в споживчі товари, щоби задовольнити населення? Або ж краще перетворити військову промисловість на справжній воєнний комплекс для майбутніх конфліктів?"
nf_bis.13.a:0 "Інвестувати в цивільні фабрики"
nf_bis.13.b:0 "Більше зброї на фронт!"

nf_bis.14.t:0 "Збір Військ за Міссурі"
nf_bis.14.d:0 "Щось коїться за Міссурі. Розвідка доповідає про скупчення військ під контролем Бізмарка. Схоже, вони збираються вдарити нам у спину, поки ми зайняті. Треба готуватись до бою негайно."
nf_bis.14.a:0 "Барабани війни — бити!"

nf_bis.15.t:0 "Перемога!"
nf_bis.15.d:0 "Ми це зробили! Багато хто думав, що нас розчавлять одразу, та ми перемогли! Наші війська йдуть на південь, розбиваючи воїнів Стендінґ-Року, лишаючи Лінтон і Ґеттісберґ беззахисними. Навіть зараз наші сили захоплюють ці міста, закріплюючи контроль над цим берегом Міссурі!"
nf_bis.15.a:0 "Гура!"

nf_bis.16.t:0 "Поразка"
nf_bis.16.d:0 "Ми програли. Безліч загиблих у прикордонних землях біля Лінтона, знищених воїнами Стендінґ-Року. Це катастрофа для Бізмарка."
nf_bis.16.a:0 "Почати копати могили..."

nf_bis.17.t:0 "Перемога"
nf_bis.17.d:0 "Міліцію Бізмарка розбито, наші воїни ріжуть навіть тих, хто намагається здатися. Вони не мали жодного шансу."
nf_bis.17.a:0 "Слава!"

nf_bis.18.t:0 "Поразка"
nf_bis.18.d:0 "Наші воїни розбиті! Вони тікають, бояться навіть міліції Бізмарка, гинуть пачками. Як таке сталося — незрозуміло!"
nf_bis.18.a:0 "Клятий Судерманн!"

nf_bis.19.t:0 "Загрози з Усіх Боків"
nf_bis.19.d:0 "Попри те, що Бізмарк досі не пережив масштабної навали, набігу чи атаки — небезпек навколо багато. Два Народи й Стендінґ-Рок — завзяті воїни, і залюбки поділили б нас між собою. На півночі фанатики Атома час від часу зазіхають на кордон. На півдні — заражені землі з жахіттями. Усі вони — загрози, які слід усунути для виживання.\n\n§0Рада§! вважає, що ми можемо відкупитись, використавши наше багатство. §BШериф§! і його прихильники бачать у цьому самогубство — кажуть, вороги просто підготуються й вдарять, коли буде зручно. Судерманн вимагає йти війною й розтрощити кожну потенційну загрозу."
nf_bis.19.a:0 "Гроші врятують нас!"
nf_bis.19.b:0 "Збираємо війська — вперед!"

nf_bis.20.t:0 "Земляні Укріплення"
nf_bis.20.d:0 "Напруга між Бізмарком і Стендінґ-Роком лише зростає. §BШериф§! Судерманн і його заступники наполягають на постійному укріпленні позицій. «Краще більше копати, ніж більше вмирати», — кажуть вони. — «Чим більше куль влучає в землю, тим більше шансів вижити.»\n\n§0Рада§! підозрює розкрадання бюджету й погодиться лише на мінімальні земляні роботи. Вони воліють витратити ресурси на виробництво зброї."
nf_bis.20.a:0 "§0Рада§! має рацію."
nf_bis.20.b:0 "Кожна перевага — варта витрат."

nf_bis.21.t:0 "Вимога від Бізмарка"
nf_bis.21.d:0 "Схоже, що §BШериф§! Бізмарка вимагає від нас передати йому контроль над містом Каррінгтон та прилеглою територією. Вони стверджують, що це потрібно їм з «міркувань безпеки». Попри те, що передача Обіцяної Землі Атому — блюзнірство, ми можемо бути занадто слабкими для затяжної війни. Якщо ми погодимося — виграємо час. Якщо ж відмовимо, можемо накликати помсту."
nf_bis.21.a:0 "У нас немає вибору..."
nf_bis.21.b:0 "Обрані Атома ніколи не здадуться!"

nf_bis.22.t:0 "Пропозиція щодо Каррінгтона"
nf_bis.22.d:0 "§0Рада§! Бізмарка надіслала посланця з пропозицією придбати територію Каррінгтона. Хоча продаж Священної Землі Атома є єрессю, сума, яку пропонують, вражає. Гроші нам не завадять, а Каррінгтон і так лежить на краю наших володінь. Якщо ж ми відмовимо — вони можуть вдатися до... пряміших методів."
nf_bis.22.a:0 "Схвалити продаж"
nf_bis.22.b:0 "Ніколи!"

nf_bis.23.t:0 "Відмова"
nf_bis.23.d:0 "Церква Сховища відкинула нас!"
nf_bis.23.a:0 "Чорт."

nf_bis.24.t:0 "Опір"
nf_bis.24.d:0 "Ще до завершення завоювання Двох Народів почався спротив нашій окупації. Це не стало несподіванкою, але сильно дратує. Слід придушити це невдоволення, поки воно не перетворилось на справжню загрозу.\n\n§BШериф§! пропонує суворе, але просте рішення: переселити всіх незгодних за Бік-Су. Там легше стежити за ними й зосередити окупаційні сили.\n\n§0Рада§! пропонує дорожчий варіант — субсидії за покору. Це вдарить по скарбниці, але виглядає більш «етично»."
nf_bis.24.a:0 "Схвалити фінансування."
nf_bis.24.b:0 "Покінчимо з цим якнайшвидше."

nf_bis.25.t:0 "Бізмарк пропонує Торгівлю!"
nf_bis.25.d:0 "Бізмарк надсилає пропозицію про торговельну угоду — зокрема, доступ до майстерності їхніх знаних §RЗброярів!§!"
nf_bis.25.a:0 "Чудово!"

nf_bis.26.t:0 "Вони Купують!"
nf_bis.26.d:0 "[FROM.GetName] надіслав пропозицію придбати партію зброї!"
nf_bis.26.a:0 "Схвалити продаж!"
nf_bis.26.b:0 "Зараз ми не продаємо."

nf_bis.27.t:0 "Вони Погодилися!"
nf_bis.27.d:0 "Бізмарк прийняв нашу пропозицію!"
nf_bis.27.a:0 "Чудово!"

nf_bis.28.t:0 "Відмова"
nf_bis.28.d:0 "Бізмарк відкинув нашу пропозицію!"
nf_bis.28.a:0 "Іншим разом."

nf_bis.29.t:0 "Важка Артилерія"
nf_bis.29.d:0 "[FROM.GetName] пропонує купити партію ґаус-рушниць."
nf_bis.29.a:0 "Схвалено, хай насолоджуються!"
nf_bis.29.b:0 "Нам вони потрібні самим."

nf_bis.30.t:0 "Вони Погодилися!"
nf_bis.30.d:0 "Бізмарк прийняв нашу пропозицію!"
nf_bis.30.a:0 "Чудово!"

nf_bis.31.t:0 "Вони Купують!"
nf_bis.31.d:0 "[FROM.GetName] надіслав запит на закупівлю зброї!"
nf_bis.31.a:0 "Схвалити продаж!"
nf_bis.31.b:0 "Зараз не продаємо."

nf_bis.32.t:0 "Вони Погодилися!"
nf_bis.32.d:0 "Бізмарк прийняв нашу пропозицію!"
nf_bis.32.a:0 "Чудово!"

nf_bis.33.t:0 "Важка Артилерія"
nf_bis.33.d:0 "[FROM.GetName] хоче придбати партію ґаус-рушниць."
nf_bis.33.a:0 "Схвалено, хай радіють!"
nf_bis.33.b:0 "Ми самі їх потребуємо."

nf_bis.34.t:0 "Вони Погодилися!"
nf_bis.34.d:0 "Бізмарк прийняв нашу пропозицію!"
nf_bis.34.a:0 "Чудово!"

nf_bis.35.t:0 "Вони Купують!"
nf_bis.35.d:0 "[FROM.GetName] хоче придбати партію зброї!"
nf_bis.35.a:0 "Схвалити продаж!"
nf_bis.35.b:0 "Зараз не продаємо."

nf_bis.36.t:0 "Вони Погодилися!"
nf_bis.36.d:0 "Бізмарк прийняв нашу пропозицію!"
nf_bis.36.a:0 "Чудово!"

nf_bis.37.t:0 "Важка Артилерія"
nf_bis.37.d:0 "[FROM.GetName] пропонує купити партію ґаус-рушниць."
nf_bis.37.a:0 "Схвалено, користуйтесь!"
nf_bis.37.b:0 "Ми їх самі потребуємо."

nf_bis.38.t:0 "Вони Погодилися!"
nf_bis.38.d:0 "Бізмарк прийняв нашу пропозицію!"
nf_bis.38.a:0 "Чудово!"

nf_bis.39.t:0 "Пропозиція від Бізмарка"
nf_bis.39.d:0 "Держава Бізмарк запропонувала купити послуги наших молодих воїнів як найманців. В обмін — регулярні виплати та навчання у веденні звичайної війни."
nf_bis.39.a:0 "Чудово!"

