BIS_lose_tooltip:0 "Чорт забирай."
BIS_carrington_anger:0 "§RЦе розлютить Біcмарк і може призвести до відплати.§!"
BIS_we_will_return:0 "§RМи ще повернемося.§!"
BIS_core_west_paying:0 "§GМи отримаємо ядра на всі землі на захід від Великої Сіу та збудуємо фабрики в регіоні.§!"
BIS_core_west_warcrimes:0 "§GМи отримаємо ядра на всі землі на захід від Великої Сіу та збудуємо фабрики.§! §RУсі землі на сході отримають зростання спротиву.§!"

#Decision Tooltips

BIS_mountie_mercenaries_tt:0 "§YДо нашого війська приєднаються чотири підрозділи спецназу.§!"
BIS_marshal_mercenaries_tt:0 "§YДо нашого війська приєднаються п’ять підрозділів піхоти.§!"
BIS_atom_mercenaries_tt:0 "§YДо нашого війська приєднаються два підрозділи піхоти.§!"
BIS_rabble_mercenaries_tt:0 "§YДо нашого війська приєднаються шість підрозділів міліції.§!"
BIS_bismarck_formable_tt:0 "Ми §GОтримаємо ядра§! на всі землі, які контролює §YСтояча Скеля§!. \nМи §GПред’явимо претензії§! на всі §YДакоти§!."

