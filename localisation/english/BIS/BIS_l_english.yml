#CHARACTERS

BIS_HENRY_SUDERMANN_NAME:0 "Генрі Судерманн"
BIS_HENRY_SUDERMANN_DESC:0 "Судерманн — перший §BШериф§! уродженець Бізмарка за останні півстоліття, але своє дитинство він провів у Кресент-Сіті, на півдні. Його кандидатура стала компромісом між прихильниками самостійного курсу Бізмарка та тими, хто виступав за тісні зв’язки з Лігою. Мандри Судерманна Міссісіпі, Міссурі та узбережжям Мексиканської затоки дали йому ширший погляд, якого бракує його землякам. Шкода лише, що вони можуть його не почути. І шкода, що так клято холодно."

BIS_LEE_DONALD_NAME:0 "Лі Дональд"
BIS_LEE_DONALD_DESC:0 "Народжений у Бізмарку, Лі вже 40 років очолює §RЗброярів§!, попри інсульт, що позбавив його правої руки. Попри втрату моторики, він лишається незамінним — нині спеціалізується на менш складному озброєнні, але його знання безмежні. Він може навмання згадати технічні характеристики будь-якої своєї розробки. Інтуїтивно розуміючи будову зброї, Лі продовжує вигадувати нові ідеї у вільний час."

BIS_ERICH_ARSCHLOCH_NAME:0 "Еріх Аршлох"
BIS_ERICH_ARSCHLOCH_DESC:0 "Містер Дональд вами розчарований..."

BIS_ROGER_NELSON_NAME:0 "Роджер Нельсон"

BIS_SMITH_ONDERSON_NAME:0 "Сміт О́ндерсон"

BIS_CAPTAIN_TOUCHSTONE_NAME:0 "Капітан Тачстоун"

