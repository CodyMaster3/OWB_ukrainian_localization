l_english:
#Decisions

nf_vault_tec.1.t:0 "Обстеження Сховища 3"
nf_vault_tec.1.d:0 "Сховище 3 частково затоплене, а перебування в ньому Чортів лише погіршило його стан. Створити тут форпост не неможливо, але значно простіше було б відремонтувати систему очищення води та експортувати її до інших наших поселень."
nf_vault_tec.1.a:0 "Використати воду для існуючих поселень."
nf_vault_tec.1.b:0 "Відновити Сховище та заснувати поселення."
nf_vault_tec.1.c:0 "Використати воду, наркотики і створити форпост."

nf_vault_tec.2.t:0 "Обстеження Сховища 6"
nf_vault_tec.2.d:0 "Очищення сховища від зараження гулями, яке тривало майже два століття, коштувало нам чимало членів охорони. Втім, Сховище 6 виглядає повністю цілим і може бути використане або як нове поселення, або як виробничий центр."
nf_vault_tec.2.a:0 "Переобладнати для виробництва."
nf_vault_tec.2.b:0 "Заснувати поселення."

nf_vault_tec.3.t:0 "Обстеження Сховища 13"
nf_vault_tec.3.d:0 "Сховище 13 досі всіяне тілами когтів смерті та жителів, яких змусили покинути його. Проте в ньому є напіввикористаний G.E.C.K. Ми можемо використати його для перетворення сховища на повноцінне поселення або прискорити наші дослідження."
nf_vault_tec.3.a:0 "Використати G.E.C.K. для досліджень."
nf_vault_tec.3.b:0 "Заснувати поселення."
nf_vault_tec.3.c:0 "Дозволити племені Арройо повернутися до рідного дому та залишити G.E.C.K. їм."

nf_vault_tec.4.t:0 "Обстеження Сховища 15"
nf_vault_tec.4.d:0 "Сховище 15 – місце походження Шейді-Сендс і Великих Ханів. Воно було домівкою для рейдерів, жителів і громадян НКР. Проте роки були до нього нещадні – розграбування НКР та сумнівні мешканці з минулого залишили його в поганому стані. Щоб повернути його до придатного для життя стану, доведеться витратити значну частину нашої інфраструктури. Альтернатива – просто забезпечити його безпечність і відкрити як історичну пам’ятку для пустельників і жителів сховищ."
nf_vault_tec.4.a:0 "Зробити історичною пам’яткою."
nf_vault_tec.4.b:0 "Відбудувати сховище та заснувати поселення."

nf_vault_tec.5.t:0 "Обстеження Сховища 19"
nf_vault_tec.5.d:0 "Сховище 19 було місцем проведення експерименту з соціального розділення – жителів поділили на дві окремі групи. Проте експеримент зазнав краху через великі поклади сірки, які забруднили систему повітропостачання."
nf_vault_tec.5.a:0 "Використати поклади сірки для виробництва вибухівки."
nf_vault_tec.5.b:0 "Знищити сірку й заснувати поселення."
vault_19_explosive_research:0 "Сховище 19 досліджене"

nf_vault_tec.6.t:0 "Обстеження Сховища 21"
nf_vault_tec.6.d:0 "Жителі Сховища 21 програли право володіння в азартній грі містеру Хаусу. Він жорстоко вигнав їх і залив більшу частину бетоном. Проте кільком громадянам було дозволено створити там успішну торгову мережу."
nf_vault_tec.6.a:0 "Інтегрувати місцеву економіку."
nf_vault_tec.6.b:0 "Повернути Сховище до робочого стану."
nf_vault_tec.6.c:0 "Використати вибухівку зі Сховища 19 для очищення бетону."

nf_vault_tec.7.t:0 "Видалення зараження"
nf_vault_tec.7.d:0 "Втрачений контакт із групою обстеження – це вже найменша з наших проблем. Рослинне зараження, що було ізольоване в Сховищі 22, вразило їх. Ми можемо створити карантинну зону та дослідити інфекцію або просто зачистити все."
nf_vault_tec.7.a:0 "Дослідити інфекцію."
nf_vault_tec.7.b:0 "Відіслати загін зачистки."
nf_vault_tec.7.c:0 "Використати вогнемети."

nf_vault_tec.8.t:0 "Сховище 34"
nf_vault_tec.8.d:0 "Сховище 34 було покинуте тими, хто став Бумерами, приблизно 50 років тому. Відтоді вони оселились на авіабазі Нелліс. Вони надзвичайно недовірливі до всіх, але з ласки свого лідера дозволили дипломатичній місії поспілкуватись із ними. Саме сховище, однак, страждає від витоку реактора і заражене гулями. Ми можемо або підійти до Бумерів і передати їм контроль над навколишніми землями, здобувши сильного союзника з подібним минулим, або відремонтувати витік, знищити гулів і забезпечити форпост у цьому районі."
nf_vault_tec.8.a:0 "Відновити Сховище."
nf_vault_tec.8.b:0 "Залучити Бумерів до нашої справи."

nf_vault_tec.9.t:0 "Обстеження Сховища 70"
nf_vault_tec.9.d:0 "Сховище 70 отримало три G.E.C.K.'и та ефективно використало їх для створення мормонської нації Нью-Ханаан. Сховище є джерелом цінних соціальних даних – як щодо експерименту, так і культурного розвитку після нього. На жаль, усі ці дані зберігаються на старому мейнфреймі в руїнах сховища. Ми можемо відновити сховище, що ймовірно знищить мейнфрейм, або перетворити його на культурний дослідницький центр, намагаючись врятувати якомога більше даних."
nf_vault_tec.9.a:0 "Відновити Сховище."
nf_vault_tec.9.b:0 "Дослідити дані зі сховища."

nf_vault_tec.10.t:0 "Звіт Загону Зачистки"
nf_vault_tec.10.d:0 "Зачистка Сховища 22 обернулась катастрофою. Хоча команді вдалося знищити рослинність і мутантів, самі вони були заражені. Після вибачення в ефірі пролунали постріли з пістолета калібру 10 мм... а потім настала тиша."
nf_vault_tec.10.a:0 "Їхня жертва була благородною."

nf_vault_tec.11.t:0 "Обстеження Сховища 29"
nf_vault_tec.11.d:0 "Недалеко від поселень племені Двох Матерів, яке походить від жителів сховища, розташоване неактивне сховище Vault-Tec. Центральна консоль керування ЗАКС працює в режимі низького енергоспоживання. На терміналі комп’ютера є два варіанти: Відновити супутниковий зв'язок або Відновити заводські налаштування."
nf_vault_tec.11.a:0 "Відновити супутниковий зв'язок."
nf_vault_tec.11.b:0 "Відновити налаштування ЗАКС."

nf_vault_tec.12.t:0 "Доля Сховища"
nf_vault_tec.12.d:0 "З питанням суперкомп’ютера розібрались. Тепер треба вирішити долю залишків племені Двох Матерів та самого Сховища. Ми можемо надати їм громадянство та створити форпост, або дозволити їм певну автономію."
nf_vault_tec.12.a:0 "Заснувати поселення."
nf_vault_tec.12.b:0 "Надати автономію."

nf_vault_tec.13.t:0 "Перейменувати штат у Сховище 13?"
nf_vault_tec.13.d:0 "Форпост у сховищі створено. Чи варто перейменувати штат?"
nf_vault_tec.13.a:0 "Так."
nf_vault_tec.13.b:0 "Ні."

nf_vault_tec.14.t:0 "Перейменувати штат у Сховище 21?"
nf_vault_tec.14.d:0 "Форпост у сховищі створено. Чи варто перейменувати штат?"
nf_vault_tec.14.a:0 "Так."
nf_vault_tec.14.b:0 "Ні."

nf_vault_tec.15.t:0 "Сховище 107"
nf_vault_tec.15.d:0 "Після входу в «Притулок» Сховища 107 наші розвідники були атаковані групою, що назвала себе «Хейвенітами» – одягнені у спорядження Вартових, вони пригрозили «рознести голову до біса», якщо розвідники не представляться. Але жінка на ім’я «Шоутайм» втрутилася, впізнавши їх форму. Після розмови вона дозволила дослідити місто та записи, але з однією умовою – особиста зустріч зі мною.\n\nСховище 107 було майже повністю перетворене на штаб-квартиру «Опору Хейвена», наповнену зброєю, спорядженням і логами. Сам експеримент сховища полягав у спостереженні за суспільством, створеним із «корумпованих» осіб. Жителі одразу відмовились від цього задуму.\n\nШоутайм погодилась приєднатися до нас, за умови автономії. В обмін – її люди стануть нашими тренерами та викладачами. Їхня харизма й бойовий дух говорять самі за себе..."
nf_vault_tec.15.a:0 "Ми вітаємо вас як братів по Сховищу."
nf_vault_tec.15.b:0 "Ваше сховище послужить нам не гірше за вас."

nf_vault_tec.16.t:0 "Сховище, загублене в часі"
nf_vault_tec.16.d:0 "Згідно з місцевими легендами, жителі Сховища 24 не виходили назовні до останніх років, коли вирішили стати регіональною силою. Та все закінчилося, коли Білоногі дістали їх, і вони втекли назад додому. Відтоді сховище мовчало – поки ми не знайшли спосіб змусити його заговорити.\n\nОдна з наших техніків створила черв’яка, здатного проникнути в системи сховища через зовнішній термінал на дверях. Якщо програма потрапить усередину, її підхопить внутрішній комп'ютер, і вона заблокує всю мережу. Якщо вони не зможуть її знешкодити до моменту необхідної регенерації повітря, їм доведеться відчиняти двері. Коли заражений піп-бой підключили – залишалось тільки чекати.\n\nМинув тиждень і день, як сигнал тривоги пролунало, і двері сховища були вирвані зі стіни. З нього вийшов змарнілий чоловік, який похитуючись підійшов до найближчого з нас. Його погляд був повен тривоги, ніби кожен крок віднімав у нього час. Він спитав, чи ми з іншого сховища і чи це ми поставили їм «зашморг». Ми відповіли «так» на обидва питання.\n\nПісля цього було укладено угоду: в обмін на частку виробництва ми залишаємо їх у спокої. Але відсутність будь-якого лідера викликає підозри. Жителі 24 лише кажуть, що їхній наглядач зник під час втечі від Білоногих.\n\nВарто вирішити: розслідувати далі чи залишити все як є."
nf_vault_tec.16.a:0 "Вони впораються і без нього."
nf_vault_tec.16.b:0 "А що ж трапилось із Наглядачем Током?"

nf_vault_tec.17.t:0 "А що трапилось з Наглядачем Током?"
nf_vault_tec.17.d:0 "Жителі Сховища 24 мають щось дивне в поведінці. Вони не посміхаються, не танцюють, не сміються і не свистять – тільки працюють. Їхнє життя – суцільна рутина. Той самий Наглядач Ток, якого ми шукали, опинився десь у пустці. Суворий, твердий – але чи був він міцніший за світ зовні?\n\nДо нас дійшли чутки про спорядження зі знаком «24», яке продавали на базарі в Арізоні. Наш агент вирушив розслідувати і зрештою натрапив на Космічний центр Блумфілда. Там, на самотній стежці, він побачив хрест із вибіленого сонцем дерева. На ньому – муміфіковані рештки Тока.\n\nЧому і як він, виходець з Юти, потрапив до Арізони, залишиться таємницею. Агент зняв тіло з хреста, загорнув у тканину і привіз додому. Хранителі часу зупинили всю роботу, поклали до труни дорогі речі, оточили її свічками – по одній за кожен рік життя. І, коли день згас, згасли й свічки, а труну опустили до могили в пісках Юти."
nf_vault_tec.17.a:0 "..."

nf_vault_tec.18.t:0 "In Memoriam."
nf_vault_tec.18.d:0 "Хоч Ток досяг найбільшої влади у Сховищі 60, саме пустка стала місцем його найвищого злету. Там, де йому дали і життя, і смерть, він і буде спочивати – під сяйвом місяця і сонця, що сходять над пустелею, поки час невпинно крокує далі."
nf_vault_tec.18.a:0 "Герой, якого пам’ятатимуть у наші дні."

nf_vault_tec.19.t:0 "Купа брухту з потенціалом"
nf_vault_tec.19.d:0 "Сховище 37 є унікальним тим, що його наглядачем є ШІ ЗАКС. Протягом двохсот років наглядач Т.H.O.M.A.S. підтримував жорсткий контроль над жителями, згідно з інструкціями Vault-Tec. Та була одна деталь – Vault-Tec не заклав жодних етичних обмежень у програму. Це дозволило ШІ робити «найкраще» для безпеки мешканців – без зайвих емоцій.\n\nНаша наукова команда припускає: ми могли б переробити ШІ під наші цілі, зокрема – зберігання громадського порядку. Проте ризик є. Якщо Т.H.O.M.A.S. вирветься з-під контролю – катастрофа неминуча. Треба бути обережними."
nf_vault_tec.19.a:0 "Мені моторошно від нього. Вимкнути."
nf_vault_tec.19.b:0 "Люблю надійного тюремника."

nf_vault_tec.20.t:0 "Таємниче Безіменне Сховище під Редмондом"
nf_vault_tec.20.d:0 "Коли ми віддали наказ відкрити сховище, наші техніки сподівалися побачити інших мешканців або хоча б дізнатися про експеримент, який мав тут відбутися. Та на наш подив – і дедалі більшу тривогу – широкі коридори були цілком порожні, за винятком мотлоху.\n\nАле потім один з техніків виявив настінний термінал на найдальшій стіні. Взламавши його, ми знайшли масивну базу даних про всі сховища у Північній Америці й за її межами – окрім цього самого. Порівнявши дані з нашими, ми підтвердили їхню достовірність. Це безумовно цінна знахідка.\n\nСейсмічні вимірювання виявили ще один комплекс на багато миль нижче – хоч ми й не можемо до нього дістатися. Можна заснувати тут форпост для подальших досліджень, або ж перетворити порожній простір на склад."
nf_vault_tec.20.a:0 "Щось тут не так... Заснувати форпост."
nf_vault_tec.20.b:0 "Склад буде корисним."

nf_vault_tec.21.t:0 "Приховане Корпоративне Сховище"
nf_vault_tec.21.d:0 "Наші розвідники виявили склад Vault-Tec без позначень, захищений знищеними вже турелями. Згідно з документами і терміналами, його мета – зберегти еліту компанії, приховано від довоєнного уряду.\n\nТаємниця цього сховища криється у дослідженнях, що проводились всередині: біологічні експерименти для боротьби з безпліддям, спричиненим Вірусом Примусової Еволюції. Залишки лабораторій ми можемо використати – або ж активувати ШІ під назвою CALIX, що просить його пробудити, обіцяючи повний контроль над сховищем.\n\nМожемо скористатись цим ШІ – або ж розібрати все на деталі."
nf_vault_tec.21.a:0 "CALIX? Звучить корисно."
nf_vault_tec.21.b:0 "Який ідіот повірив би в це?"

nf_vault_tec.22.t:0 "Сховище 9"
nf_vault_tec.22.d:0 "По всіх пустках розкидано багато сховищ – щонайменше 122. Нам пощастило знайти ще одне у Вайомінгу. Наші частково пошкоджені логи говорять наступне:\n\n\n§GЛОГИ VAULT-TEC: СХОВИЩЕ 9§!\n\n§GДІМ ДЛЯ НАЙКРАЩИХ І НАЙВІДДАНІШИХ! ДЛЯ GJOCJOHCOH... СПЕЦІАЛЬНО ДЛЯ НАШИХ B!B!SO NESABB! BAJSIBXONOANMNEMNMWN AB! ХТО НЕ МОЖЕ ПРИЄДНАТИСЯ ЧЕРЕЗ ПОЛІТИКУ. ВАШ AHICXX BOWNBWAB МОЖЕ ОТРИМАТИ ВЛАСНЕ СХОВИЩЕ! ТЕЛЕФОНУЙТЕ 213-25-VAULT! *лише для попередньо зареєстрованих мешканців.§!\n\n\nЩо тут експериментували? Генетичні відхилення? Зниклі люди? Песики?\n\nНаші техніки вже готувались підривати двері... аж раптом юний скаут просто постукав у неї – і вона відчинилась.\n\nМи чекали чогось надзвичайного... Але що це? Це сховище для собак?.."
nf_vault_tec.22.a:0 "Що за експеримент тут, взагалі?"

nf_vault_tec.23.t:0 "Сховище 27"
nf_vault_tec.23.d:0 "Наші розвідники повернулись значно швидше, ніж ми очікували. Виявилося, що Сховище 27 надзвичайно мале – менше чверті від стандартного розміру. Більшість його мешканців вже залишили його і подались до наших менш тісних поселень. Створення форпосту тут малоймовірне – та можна або розширити сховище, або просто розібрати його."
nf_vault_tec.23.a:0 "Розібрати."
nf_vault_tec.23.b:0 "Розширити."

