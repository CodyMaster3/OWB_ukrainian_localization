#Techs
SLE_med_company_tech_6:0 "Перші кібернетичні експерименти"
SLE_med_company_tech_6_desc:0 "Ми — найвидатніші медичні уми пустки! Прості «лікарські сумки» навіть близько не демонструють ті дива, які ми готуємо для світу!"

SLE_khan_field_medics_tech:0 "Наукові загони"
SLE_khan_field_medics_tech_desc:0 "Наші біоінженерні суперсолдати потребують постійного обслуговування. Вбудовані медики-дослідники у кожному загоні перетворять армію на мобільну лабораторію."

SLE_tribalimmortals:0 "Природна регенерація"
SLE_tribalimmortals_dec:0 "Імплементація рідкісної мутації дозволила повільну, але ефективну регенерацію. Солдати можуть проігнорувати дрібні поранення, а великі — відкласти до повернення. А можливо, ці клітини навіть подовжують життя..."

SLE_skilled_medics_tech:0 "Протоколи воскресіння"
SLE_skilled_medics_tech_desc:0 "Кібернетика, вбудована в кожного солдата, відстежує життєві показники, регулює хімію та навіть керує мікром'язами. Якщо боєць загине — система може зберегти його життя й повернути до строю. Смерть — лише погляд на проблему."

SLE_khan_buffout:0 "Сироватки надсили"
SLE_khan_buffout_desc:0 "Трохи генетичних модифікацій — і наші солдати стають сильними, як мурахи. Більше вантажу, довше бої — менше втоми."

SLE_khan_daddy_o:0 "Модифікація емоційного стану"
SLE_khan_daddy_o_desc:0 "Ми трохи погралися з мозковими центрами, що відповідають за концентрацію та депресію. Тепер наші громадяни менше сумують і більше працюють. Ну, після процедури, принаймні."

SLE_khan_mentats:0 "Медичні ментальні прискорювачі"
SLE_khan_mentats_desc:0 "Імпланти з повільним вивільненням ментатів забезпечують перевагу нашим геніям, не викликаючи побічних ефектів, як при звичайному зловживанні."

SLE_khan_cateye:0 "Операції з оптимізації зору"
SLE_khan_cateye_desc:0 "Очі наших вчених були вдосконалені. Тепер вони бачать краще у темряві, на відстані та при мікроскопічному фокусі. Зум — не лише практично, а й видовищно!"

SLE_khan_fixer:0 "Стабілізаційна сурогатна система"
SLE_khan_fixer_desc:0 "Накопичення модифікацій призвело до хімічної нестабільності. Ця система дозволяє безпечно переходити з активного режиму до спокою, зберігаючи баланс організму."

SLE_khan_radaway:0 "Регенеративне виведення радіації"
SLE_khan_radaway_desc:0 "Дослідження гульської фізіології дозволило створити «локальні радіаційні фільтри» в тілі людини. Вони очищують тканини без ризику мутацій. Реактор вони не врятують, але життя в пустці значно полегшать."

SLE_khan_antivenom:0 "Захист від отруйних загроз"
SLE_khan_antivenom_desc:0 "Автоматичні ін’єкційні системи з універсальним антидотом проти пустельних отрут — наш реалістичний проєкт. Вони оновлюються з кожною новою токсичною знахідкою."

 #Operations
