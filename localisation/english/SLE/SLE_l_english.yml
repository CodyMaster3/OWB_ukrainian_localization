sle_bop_favor_ethics:0 "Викладати етику"
sle_bop_favor_ethics_desc:0 "Багато Сплячих ніколи не замислювалися над наслідками своїх вчинків. Ксіан вважає, що настав час це змінити. Обов’язкове аскетичне життя під час курсу допоможе їм зрозуміти, як живе пустка за межами куполу."

sle_bop_favor_research:0 "Заохотити неконтрольовані експерименти"
sle_bop_favor_research_desc:0 "Контроль — це зайва бюрократія! Випустімо геніїв з кліток. Що найгірше може трапитись?"

sle_bop_favor_revenge:0 "Підтримати думки про помсту"
sle_bop_favor_revenge_desc:0 "Світ зрадив нас. Чи дійсно підживлення гніву — така вже погана ідея?"

