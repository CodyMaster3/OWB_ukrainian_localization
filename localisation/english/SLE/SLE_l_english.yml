# Категорії рішень
sle_decisions_category:0 "Сни про наше майбутнє"
sle_decisions_category_desc:0 "Після загибелі Преспера Сплячі втратили мету. Але коли пустка буде пережита — ми повинні вирішити, ким стати."

sle_dream_big_decision:0 "Мріяти по-справжньому"
sle_dream_big_decision_desc:0 "Навіщо обмежуватись баченням однієї людини? Преспер був генієм, але він помилився. Тепер ми всі — архітектори нового завтрашнього дня для Боулдера!"

sle_burn_the_world_decision:0 "Спалити цей світ"
sle_burn_the_world_decision_desc:0 "НКР все зруйнувала. А Легіон — дикуни в римських шкурах. Преспер мав рацію. Спалити. Все. Почати спочатку."

sle_sleep_forever_decision:0 "Заснути назавжди"
sle_sleep_forever_decision_desc:0 "Я ніколи не мав керувати Сплячими. Я лише хотів убезпечити світ від найгірших із них. Зараз я можу нарешті закрити купол — назавжди."

# Медична категорія
sle_medicine_category:0 "Медичні прориви!"
sle_medicine_category_desc:0 "З кожним новим відкриттям ми наближаємось до вдосконаленої людини. Теперішня еволюція не закінчується на ДНК!"

sle_breakthrough_1_decision:0 "Перші кроки"
sle_breakthrough_1_decision_desc:0 "Масове виробництво біоін'єкцій — непросте завдання. Почнімо з простих ліків, а найпередовіші розробки збережемо для обраних."

sle_breakthrough_2_decision:0 "Адаптація до пустки"
sle_breakthrough_2_decision_desc:0 "Кожна рослина чи звір — потенційне джерело ліків. Радіація, отрута, мутантні ферменти — дослідити все!"

sle_breakthrough_3_decision:0 "Дослідження стимклітин"
sle_breakthrough_3_decision_desc:0 "Стимпаки тимчасово рятують життя, але ми можемо піти далі. Що, якщо стимуляція зможе замінити справжнє лікування?"

sle_breakthrough_4_decision:0 "Автоматизовані системи"
sle_breakthrough_4_decision_desc:0 "Розумні сенсори, що моніторять стан солдата й самостійно вводять потрібні хімікати — це майбутнє бойової медицини."

sle_breakthrough_5_decision:0 "Хімічні заглушувачі болю"
sle_breakthrough_5_decision_desc:0 "Мед-X — палиця на два кінці. Ми маємо переналаштувати мозок так, щоб він повідомляв лише про критичні травми, не відволікаючи увагу."

sle_breakthrough_6_decision:0 "Післясмертна медицина"
sle_breakthrough_6_decision_desc:0 "А якщо смерть — не кінець? З новими імплантами та посиленими тілами, можливо, ми її здолаємо."

sle_buffout_decision:0 "Постійне м’язове посилення"
sle_buffout_decision_desc:0 "Баффаут — це лише тимчасово. Генетичні зміни, можливо навіть від гігантських мурах, можуть дати тривалий ефект нашим солдатам."

sle_daddyo_decision:0 "Заспокійливі для нестійкої психіки"
sle_daddyo_decision_desc:0 "Депресія та втрата концентрації — серйозна проблема для Сплячих, особливо тих, хто ностальгує за Старим Світом. Дехто вдається до наркотиків на кшталт Daddy-O чи Day Tripper, аби полегшити біль. Але дослідження впливу цих речовин на мозок може подарувати постійне рішення."

sle_mentats_decision:0 "Обмежити зловживання Ментатами"
sle_mentats_decision_desc:0 "Ментати — геніальні! Всі їх люблять, особливо учені й студенти. Та у великій кількості навіть ментати стають загрозою. Якщо нам вдасться розробити повільне та безпечне дозування, ми зможемо зберегти розум та продуктивність."

sle_cateye_decision:0 "Покращити зір дослідників"
sle_cateye_decision_desc:0 "Зіпсоване освітлення, неергономічна оптика, протирадіаційні костюми з обмеженою видимістю — усе це створює сильне навантаження на очі. Ми повинні покращити наш зір, поки ще не осліпли."

sle_fixer_decision:0 "Виправити наші вади"
sle_fixer_decision_desc:0 "Може, постійно пхати в людей хімію — не найкраща ідея для тих, хто хоче спокійно жити. Використання препарату на кшталт Fixer може дати нам «вимикач» усіх наших модифікацій."

sle_radaway_decision:0 "Фільтрація радіаційного забруднення"
sle_radaway_decision_desc:0 "Навіть з костюмами уникнути радіації неможливо. Розробка системи, що пасивно очищує організм подібно до гульської фізіології, може радикально розширити наші можливості в пустці."

sle_antivenom_decision:0 "Антидот від Казадорів"
sle_antivenom_decision_desc:0 "Отрута — улюблена зброя племен та дикунів. Ми маємо створити універсальний антидот, що врятує навіть при проникненні токсинів у костюм."

sle_science_squad_decision:0 "Наукові загони!"
sle_science_squad_decision_desc:0 "Польові дослідження — ключ до розуміння пустки. Включення Сплячих до складу медичних загонів дозволить не лише надавати допомогу, а й здобувати особистий досвід."

sle_skilled_medics_decision:0 "Безсмертні армії!"
sle_skilled_medics_decision_desc:0 "Мутант, якого ми знайшли, мав здатність до повільної регенерації. Якщо ми зможемо поширити цю властивість — наші солдати стануть практично невмирущими."

sle_reanimen_decision:0 "\"ВСТАВАЙТЕ, МОЇ РЕАНІМЕНИ!\""
sle_reanimen_decision_desc:0 "Скільки потрібно залишити від людини, аби вважати її врятованою? Можливо, тільки частину мозку. Інше замінить система."

sle_mesmetron_decision:0 "Масове використання Месметронів"
sle_mesmetron_decision_desc:0 "Дозволити застосування Месметронів у бойових умовах для посіву хаосу, деморалізації та захоплення ворожих сил."

sle_bioweapons_decision:0 "Нові інфекції Чуми"
sle_bioweapons_decision_desc:0 "Малопотужні вірусні бомби зразка Нової Чуми будуть застосовані у ворожих регіонах для примусу до капітуляції."

sle_tribal_education_decision:0 "Освітити племена в [FROM.GetName]"
sle_tribal_education_decision_desc:0 "Підняти освітній рівень місцевих племен, щоб полегшити інтеграцію штату до нашої наукової мережі."

 #sle_pacify_canyon_decision:0 "Pacifying The Canyon Raiders"
 #sle_pacify_canyon_decision_desc:0 ""Battery of Mesa Verde was left to rehabilitate the raiders and criminals of Tibbets Prison and the Rockies, and despite our shared history, I cannot give him slack for clearly failing to hold it together. The Sleepers are restless and need direction. Perhaps that direction should simply be "East".""
 #sle_back_to_boulder_decision:0 "Back To Boulder"
 #sle_back_to_boulder_decision_desc:0 ""The Rockies are secured, what's left of Tibbets has been looted, and our numbers of conscripts have swelled. If there is anywhere in the wasteland that could provide the resources they need to restart their research in earnest, it's their old home in Boulder Dome. I just... hope I don't get stuck in a drainpipe again this time.""
 #sle_across_the_river_decision:0 "Across The Colorado River"
 #sle_across_the_river_decision_desc:0 ""Crossing the Colorado River will require investing in some basic boats and landing crafts to do effectively, but would allow us to more reliably access our distant outpost at B.O.M.B. 2. The Tribals over there are afflicted with a horrible disease and might actually appreciate our occupation if we cure it for them - once their more rebelious warriors are out of the way.""
 #sle_back_to_bomb_decision:0 "Back To B.O.M.B. 2"
 #sle_back_to_bomb_decision_desc:0 ""The second BOMB station never fell totally out of Sleeper control, but the skeleton crew sent to re-occupy the area is barely able to fight off the station's decay, let alone make good use of its automated systems. The Utah tribals that cut us off from it are primitive and superstitious, and we will need to cut a clear path through them if we want to tap into the station's potential.""
 #sle_restore_boulder_dome_decision:0 "Restoration Of Boulder Dome"
 #sle_restore_boulder_dome_decision_desc:0 ""Now that the Boulder Dome is under our control, it's time to get the systems inside operational again. Clearing out the area and restarting systems will take time, but soon Boulder will be the jewel of our new nation.""
 #sle_restore_bomb_outpost_decision:0 "Reconnect With B.O.M.B. 2 Outpost"
 #sle_restore_bomb_outpost_decision_desc:0 ""With the Tribals dealt with, we can clear a continuous road along the river and start sending more supplies and personel to repair B.O.M.B. 2's automated production systems. Once the station is online we could even use our suits to clean up the North Shore of the canyon and salvage all of Poseidon's old mining equipment, turning the Grand Canyon into the heart of our new industry!""

