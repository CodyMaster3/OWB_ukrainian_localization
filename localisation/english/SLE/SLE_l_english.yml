# Підказки
SLE_dreaming_big_tt:0 "Сплячі ще не перетнули точку неповернення"
SLE_eternal_hatred_tt:0 "Сплячі повністю віддані завершенню своєї первісної місії"
SLE_back_to_bed_tt:0 "Сіань здобула особистий вплив на Сплячих"

# Фокуси
sle_muster_the_sleepers:0 "Мобілізувати Сплячих"
sle_muster_the_sleepers_desc:0 "Наші передові розвідники повідомляють, що Уроборос мобілізується для війни з [TOB.GetLeader] та його плем'ям. Хто б не переміг, ми не можемо довіряти, що наступною ціллю не станемо ми. Нам слід готуватися до війни."

sle_mesmetron:0 "Виготовити Мезметрони"
sle_mesmetron_desc:0 "Мезметрон — це нейропсихічний пристрій, що тимчасово вводить ціль у стан навіювання. Хоча програмування ще потребує вдосконалення, а ризик катастрофічного збою присутній, сам авторитет пристрою допоможе підтримувати мир і порядок."

sle_medical_expertise:0 "Медична Експертиза"
sle_medical_expertise_desc:0 "Купол Боулдера спочатку будувався як медичний дослідницький центр. Багато з наших передвоєнних Сплячих мають ступені в галузях, які давно зникли. Вони можуть завершити свої передвоєнні дослідження та знайти нові шляхи вдосконалення людства."

sle_armored_suits:0 "Броньовані ХАЗМАТ-Костюми"
sle_armored_suits_desc:0 "Боулдер мав засоби для боротьби з найнебезпечнішими епідеміями, включно з Новою Чумою. Частиною цього були ХАЗМАТ-костюми, стійкі не лише до інфекцій, а й до більшості видів зброї."

sle_riot_control:0 "Схеми Броні"
sle_riot_control_desc:0 "Покладатися лише на запаси з Купола Боулдера було б нерозумно. Відтворити передвоєнну броню буде складно, але не неможливо — якщо стандартизувати виробництво."

sle_willing_subjects:0 "Добровільні Піддослідні"
sle_willing_subjects_desc:0 "На відміну від чуток, Сплячі не були зациклені на «чистоті» передвоєнних людей. Хоча Суходуви не мають освіти, деякі з них виявилися здатними й будуть інтегровані до наших наукових кіл."

sle_new_base:0 "Побудувати Нову Базу"
sle_new_base_desc:0 "Після втечі з Боулдера ми тулімося в лабораторіях Преспера або живемо з Суходувами. Це не рівень автоматизованого міста майбутнього. Настав час збудувати повноцінне поселення для нашого народу."

sle_scavenging:0 "Обшуки в Колорадо"
sle_scavenging_desc:0 "Річка Колорадо накопичила чимало сміття з часів війни. Навіть якщо ми опустимося до рівня Збирачів, обшуки мілин і вилов об'єктів із води можуть дати нам важливі ресурси."

sle_loyal_soldiers:0 "Вірні Солдати"
sle_loyal_soldiers_desc:0 "Преспер до війни вербував не лише вчених, а й солдатів. Вони захищали Сплячих у перші дні Апокаліпсису й тепер навчають нове покоління за старими військовими доктринами."

sle_armory:0 "Стандартизоване Озброєння"
sle_armory_desc:0 "Уніфікація частин та схем допоможе нам масово виробляти зброю. Так, кожен науковець створив свій власний променевий пістолет, але тепер треба відкласти експерименти й перейти до серійного виробництва."

sle_broken_bones:0 "Палиці та Каміння"
sle_broken_bones_desc:0 "Старі Кістки — це не просто дикуни, вони буквально печерні люди. Сусідство з ними — загроза нашому майбутньому. Ми мусимо знищити їх, перш ніж вони вдадуться до рейдів."

sle_serpents_head:0 "Голова Змії"
sle_serpents_head_desc:0 "Ім’я Гекати вимовляють пошепки — вона досі пам’ятає жах, який Свідки спричинили в цих краях. Ми маємо усунути її з посади, перш ніж вона збере армію, аби знищити нас!"

sle_pulp_villains:0 "Лиходії з обкладинок"
sle_pulp_villains_desc:0 "Старі Кістки знищено — тепер треба вирішити, що робити з тими, хто вижив. Дехто з них кличе нас кумедними іменами на кшталт «Циклопи» чи «Шалені Вчені» — під впливом культури коміксів. Може, варто пограти за цими правилами?"

sle_new_darkness:0 "Сходження Нової Темряви"
sle_new_darkness_desc:0 "Гекату повалено! Принаймні, її армії. Її Піраміду опечатано, вона погрожує знищити цінну інформацію, якщо ми не виконаємо її вимоги..."

sle_agricola:0 "Механічні Дива «Агріколи»"
sle_agricola_desc:0 "Компанія Agricola, що добувала ресурси в Бернхем-Спрінгз, була дочірнім підприємством Poseidon Energy — чиї креслення нам добре знайомі. Поєднавши їх із новим обладнанням з шахт, ми зможемо знову запустити нашу промисловість."

sle_gehenna:0 "Дивовижні Мутанти Геєнни"
sle_gehenna_desc:0 "Печери під Бернхем-Спрінгз повні мутантів із смолистою шкірою й наростами. Захопливо! Ми можемо використати їх у нашому війську — або навіть клонувати для медичних експериментів."

sle_disappointing_results:0 "Помилка Гекати"
sle_disappointing_results_desc:0 "Нарешті ми отримали доступ до Піраміди Темного Місяця та її даних! Але Доктор Бейр — поневолений Послідовник Гекати — навідріз відмовляється показати частину інформації..."

sle_bioweapons:0 "Розробка Біозброї"
sle_bioweapons_desc:0 "Частина плану Преспера полягала в поширенні загрози Нової Чуми з в’язниці Тіббетс. У нас лишилися зразки, які можна було б запустити за лінією фронту. Якщо, звісно, забути про мораль."

sle_mass_mesmetrons:0 "Масові Месметрони"
sle_mass_mesmetrons_desc:0 "Месметрон — потужна зброя контролю, але на полі бою він досі недосконалий. Якщо ми навчимося насичувати цілі зони випромінюванням, зможемо знешкоджувати ворога без тривоги."

sle_geckos:0 "Збирати Ґеконів"
sle_geckos_desc:0 "Ґекони — живучий, плідний вид мутованих істот, яких легко приручити. Використавши їх у бойових операціях, ми зменшимо ризики для власних бійців."

sle_doggos:0 "Службові Пси"
sle_doggos_desc:0 "Служба безпеки Купола завжди використовувала кіберпсів, а Преспер довів експерименти до нового рівня. Ми планували виростити армію, але після зустрічі з балакучим кіберпсом більшість учених захотіла створити ще таких самих."

sle_in_a_cave:0 "Відбудуємо Мрію!"
sle_in_a_cave_desc:0 "Дехто скаже, що відновити спадщину Преспера — марна справа. Але з технологіями Гекати, скарбами Бернхем-Спрінгз та знаннями Сплячих — нас не зупинити."

sle_uintah_eagles:0 "Західний Берег"
sle_uintah_eagles_desc:0 "Ми мусимо повернутися в минуле. Станція B.O.M.B.2 ще не повністю під нашим контролем. Це означає — здобути другий берег Колорадо й підкорити місцеві племена."

sle_crazy_horns:0 "Зламати Роги"
sle_crazy_horns_desc:0 "Шалені Роги — дикі, агресивні, і мають ручних когтів смерті. Якщо ми просунемось на їхні землі — отримаємо доступ до ресурсів і цікавих зразків."

sle_dead_horses:0 "Бідні Коні"
sle_dead_horses_desc:0 "Плем’я Мертвих Коней нагадує нашим зоологам, що більшість коней дійсно мертва. Якщо витіснити плем’я і змінити назву території — це точно підніме їм настрій."

sle_our_sorrows:0 "Утопити Смуток"
sle_our_sorrows_desc:0 "Плем’я Смутку боїться нас — Сплячих, які торкаються заборонених машин минулого. Їхня наївність зворушлива, але ми потребуємо повного контролю над Великим Каньйоном і B.O.M.B.2."

sle_back_to_bomb:0 "Назад до B.O.M.B."
sle_back_to_bomb_desc:0 "Ми завершили подорож до з’єднання станції зі своїми лабораторіями. З усіма цими технологіями — ми можемо побудувати нову спільноту на її основі."

sle_restart_BOMB:0 "Перезапуск B.O.M.B.2"
sle_restart_BOMB_desc:0 "Система зв’язку станції B.O.M.B.2 все ще працює — її просто сховали в корпус. Якщо перезавантажити її, ми зможемо знову вийти на зв’язок із супутниками."

sle_old_friends_folly:0 "Марнота Старого Друга"
sle_old_friends_folly_desc:0 "Батарея з Меси-Верде завжди сперечалась із Сян щодо демократії та проєкту в Чорному Каньйоні. Час обрати, чия ідея була слушнішою."

sle_glowbugs:0 "Геть Жучків!"
sle_glowbugs_desc:0 "Світляки — остання перешкода на нашому шляху додому, до Купола. Всередині ще багато Сплячих — заморожених, але живих. Ми витягнемо їх, за будь-яку ціну."

sle_home_again:0 "Знову Вдома"
sle_home_again_desc:0 "Коли Купол знову під нашим контролем — ми можемо відновити його повністю та зробити нашим головним командним центром."

sle_other_sleepers:0 "Інші Сплячі"
sle_other_sleepers_desc:0 "Перед війною тисячі вчених і солдатів було заморожено в Куполі. Преспер прокинувся першим, щоб вибрати лише найкращих. Але нам потрібні всі. Прокидайтесь!"

sle_computer_eyes:0 "Очі Комп’ютера"
sle_computer_eyes_desc:0 "ЗАКС у Куполі втратив цінні дані. Єдиний вихід — перезавантажити його та використати як базу для створення нового, ще досконалішого суперкомп’ютера."

sle_rocky_ridges:0 "Скелясті Хребти"
sle_rocky_ridges_desc:0 "У Скелястих горах багато технологій. Але спершу доведеться прибрати денверських лихварів, які «приватизували» територію."

sle_math_masters:0 "Математичні Майстри"
sle_math_masters_desc:0 "Шифрувальники з Меси-Верде — цікаві типи, які запам’ятовують креслення через геогліфи. Можливо, їх варто зберегти як техніків і дешифраторів."

sle_nursery:0 "Подорож до Розсадника"
sle_nursery_desc:0 "На відміну від решти Сплячих, Сян вже була в Розсаднику разом із В’язнем. Вона не має ілюзій щодо «богині» Діани — і готова звернутися до неї по допомогу."

sle_code:0 "C.O.D.E."
sle_code_desc:0 "Система CODE — більше, ніж підготовка мізків до вставки в робомозок. Вона підвищує бойовий дух, навіює покору — і це ще не межа. З правильним відеопотоком ми отримаємо повний контроль."

sle_geck:0 "Викрасти ГЕКК"
sle_geck_desc:0 "Оновити світ після його знищення — цього не досягти без ҐЕККу. Один «позичений» у Розсадника допоможе нам швидше втілити утопію."

sle_educational_investment:0 "Інвестувати в Освіту Трібалів"
sle_educational_investment_desc:0 "Більшість Сплячих вважає трібалів обмеженими. Але Сян — вціліла з пустки — вірить: варто лише дати їм шанс, і вони доведуть свою вартість."

sle_dream_sequencer:0 "Послідовник Снів"
sle_dream_sequencer_desc:0 "Реальність — втомлива. Ми можемо об’єднати CODE із пам’ятними капсулами, створивши симуляції, де Сплячі працюватимуть разом, досліджуватимуть пам’ять або творитимуть в умовах, яких більше не існує."

sle_universal_migrators:0 "Універсальні Мігратори"
sle_universal_migrators_desc:0 "Інтегрувавши новий ЗАКС у капсули, ми перетворили Послідовники Снів на справжні симулятори майбутнього. Тепер ми здатні проживати цілі життя за години. Нарешті у нас є час вивчити все."

sle_creature_science:0 "Медичні Дива"
sle_creature_science_desc:0 "Тепер, коли ми знову контролюємо Купол Боулдера, ми можемо завершити дослідження Панімуного Віріону та Вірусу Примусової Еволюції! Хоч повне освоєння потенціалу цих патогенів займе роки, ми можемо почати вже зараз — випробовуючи їх на мутованій фауні."

sle_waking_up:0 "Прокидаємось Нарешті"
sle_waking_up_desc:0 "Після місяців завоювань і досліджень ми наближаємося до рівня справжньої технологічної потуги, здатної змагатися з НКР — або принаймні оборонятись від її навал. Майбутнє Сплячих досі туманне, але їхній потенціал нарешті пробуджується."

nf_sle.1.t:0 "Шосте Вимирання"
nf_sle.1.d:0 "У передсмертні години Великої Війни блискучий Віктор Преспер розробив план, як пережити апокаліпсис. Неперевершений у своєму розумі, він зібрав навколо себе солдатів і науковців Купола Боулдера та за допомогою передових капсул кріосну перечекав найгірше. Прокинувшись, вони досліджували пустку, навіть відвідали НКР. Але Преспера це не вразило. Він повернувся до Колорадо з вірними Сплячими й запустив план нового апокаліпсису — через космічну станцію B.O.M.B. Він покинув Землю разом з елітою Сплячих.\n\nТа не все пішло за планом. В’язень із Тіббетс, випущений у рамках цієї змови, вистежив Сплячих і дізнався про їхні наміри. Йому вдалося дістатися до B.O.M.B. 1. Станція була знищена, а Преспер і його вірні загинули, і разом із ними — їхній задум зруйнувати світ удруге."
nf_sle.1.a:0 "І Сплячі лишились без провідника..."

nf_sle.2.t:0 "Почати Спочатку"
nf_sle.2.d:0 "Після загибелі Преспера та керівництва Сплячих їхнє майбутнє здавалося приреченим. Тих, хто вижив, НКР оголосила терористами, а Колорадо не давало притулку. Вони б розпались остаточно, якби не загадковий сигнал, що прозвучав кілька тижнів по знищенню B.O.M.B. Сигнал привів Сплячих до лабораторії Преспера, де їх чекала Сян.\n\nСян пройшла довгий шлях: колись вона працювала на Ші, згодом зустріла Преспера в НКР і рушила за ним до Боулдера. Та Сплячі не знали, що вона також подорожувала разом із тим самим В’язнем, допомагаючи йому врятувати світ. Сян зібрала Сплячих не для спасіння — а щоб знищити. Та, коли вони прибули, її серце змінилось. Вона була однією з них. І, можливо, з правильним керівництвом вони ще можуть змінитись."
nf_sle.2.a:0 "Що їм не відомо — не завдасть їм шкоди, чи не так?"

nf_sle.3.t:0 "Секвенування Сну"
nf_sle.3.d:0 "Зібравши Сплячих в одному місці, Сян одразу взялася за справу. Першим кроком стало поповнення їхніх виснажених лав. Пісковики — маленьке, знесилене плем’я, яке палко ненавиділо Гекату та жадало майбуття. Сян звернулась до їхнього ватажка Джона Лінча, пообіцявши свободу від панування Уробороса.\n\nНовий приплив робочих і навіть учнів, що навчаються за традиціями Сплячих, вдихнув нове життя у справу. Та між старими і новими зростає запитання: що саме є нашим планом далі? Сян має дати відповідь."
nf_sle.3.a:0 "Зробити краще, ніж минулого разу!"
nf_sle.3.b:0 "Прокласти шлях науці до її абсолютної межі!"
nf_sle.3.c:0 "Помститись!"

nf_sle.4.t:0 "Завоюй або Падай"
nf_sle.4.d:0 "Старі Кістки впали під вагою нашої науки! [TOB.GetLeader] схоплено — зв’язано, принижено, виставлено напоказ. Побіжний аналіз культурологів серед Сплячих виявив: їхню культуру формують історії — байки чи хроніки. Їхнє горе зробило їх вразливими. Хтось пожартував: а що як... переписати їм фінал історії, в якому ми разом? \n\nЦей жарт переріс у палку суперечку. Чи спрацює це? Чи погодиться [TOB.GetLeader] приєднатися до нас? Останнє слово — за Директором."
nf_sle.4.a:0 "“Що? Ні. Примусьте їх працювати.”"
nf_sle.4.b:0 "“ЗАВОЮВУЙМО СВІТ! ІМЕНЕМ СПРАВЕДЛИВОСТІ!”"

nf_sle.5.t:0 "Остання Цариця Уробороса"
nf_sle.5.d:0 "Солдати Сплячих ступали строєм крізь браму Темної Піраміди. Їхні стерильні уніформи контрастували з глибокими чорними й фіолетовими тонами Уробороса. Поліровані, мов дзеркала, стіни з синтетичного обсидіану викривлювали їхнє відображення, перетворюючи фігури на примари.\nНавіть уродженці плутались у цих залах, чужинцям — то був лабіринт зі скла й тіні.\n\nЗгідно з найдавнішими приписами, в Темну Піраміду не можна було проносити зброю. Але жриці Гекати вели їх мовчки. У фіолетових шатах, із розфарбованими в попіл і пурпур обличчями, вони ішли з гордо піднятими головами — та з очима, сповненими чорної люті.\n\nНарешті, вони дістались Умбрального Адітуму — прихованого серця Піраміди. Приміщення було напівтемне, лише тьмяні лампи відкидали бурштинове світло. Уздовж стін — механізми, канати, закриті релікварії. У центрі — вогнище, обвитий дротами механізм із алхімічною олією. Над ним — ланцюг, готовий запустити спалення.\n\nПоруч — сувої, томи, гологіски. А ще — замкнений ключ до лабораторії, де, кажуть, покояться останні секрети Діани.\n\nНа троні із розбитого металу й чорного шовку — Геката. Бліда, розмальована знаками, у чорному.\nНа п’єдесталі перед нею — лист:\n\n«Уроборос заплатить свою данину Учням Преспера. Його армії — розпущені. Але мої Дочки та наша віра залишаться. Темна Піраміда не здійме меча, але її вогонь не згасне. Якщо мої умови не буде прийнято — все, що бачите: скарби, знання і я сама — згорить. І останнє світло Уробороса згасне разом зі мною.»\n\nЛист лежить на столі Сян — чорнило ще свіже."
nf_sle.5.a:0 "Прийняти умови. Зламані богині не завдати шкоди."
nf_sle.5.b:0 "Відмовити. Хай згорить усе разом із нею."
nf_sle.5.c:0 "Запропонувати вигнання. Вона покине Піраміду назавжди."

nf_sle.5.a.tt:0 "§gГеката погоджується. Вона спускається з Адітуму з гідністю впалої цариці. Її війська знищені, трон — порожній, але вона не щезає. Стає духовним символом — голосом у темних залах Піраміди. Вмовлена Учнями Преспера, вона наказує Донькам не чинити спротиву новим володарям. Та її вплив лишається — шепіт і тінь, що веде Уроборос у майбутнє, сповнене віри й темряви.§!"

nf_sle.5.b.tt:0 "§gУмови відхилено. Сплячі спостерігають із-за дзеркальних стін, як канати опускаються — і вогонь пожирає все. Геката сміється у диму, її голос — луна божевілля. Після — тільки попіл, обпалене залізо і скорчені реліквії. Місто ридає. Доньки зникають у пітьмі, й вулиці починають кипіти.§!"

nf_sle.5.c.tt:0 "§gГеката приймає вигнання — та її очі палають люттю. Вона забирає тих, хто ще вірний: Доньок і воїнів, що лишають місто разом із нею. У тиші вона зникає за стінами — мов процесія з іншого часу. Її ім’я не згасає. Люди шепочуть: Чи повернеться Темна Мати?§!"

nf_sle.500.t:0 "Темна Мати Іде"
nf_sle.500.d:0 "Хоч Уроборос і впав, віра Темної Піраміди не зникла. У місяці після капітуляції містом почав бродити силует — постать у фіолетовому серпанку. Люди назвали її Темною Матір’ю. Вона приходить лише вночі. Обличчя — під вуаллю. Ступає беззвучно.\n\nГородяни не кажуть про неї нічого. Доньки — мовчать. Для них — це не жінка, а істина. Жива віра.\n\nСпостерігаючи їхні служби, Сплячі розуміють: у вірі Уробороса Темна Мати — не особа, а пророче втілення. Вона — богиня темного місяця, мати самого Уробороса. Як довго є тінь — вона існує. І повернеться.\n\nДоньки говорять про цикли: про те, що вона повернеться не плоттю, а духом. І поки той час не настане — вона вестиме їх із пітьми."
nf_sle.500.a:0 "Віра Уробороса живе. Навіть після падіння Гекати."

sle_lost_key_to_lab:0 "Втрачено ключ до лабораторії Гекати"

nf_sle.6.t:0 "Медичне прозріння"
nf_sle.6.d:0 "Дослідження архівів, знайдених у Піраміді Гекати, розкрили жахливу таємницю. Протягом багатьох років Геката займалась примітивною формою євгеніки, намагаючись контролювати розмноження племен Уробороса та навколишніх трибалів, щоби вивести сильніших пустельників. Наслідки цієї програми, наскільки ми можемо судити, викликали невдоволення серед місцевих племен і призвели до генетичних вузьких місць у популяції, підвищуючи ризик хвороб. Доктор Бейр був вражений, зіткнувшись із цією правдою, і закликав нас не повторювати її помилок. Сплячі одностайні: така приземлена і псевдонаукова річ, як євгеніка, не варта зусиль. Проте прохання Бейра не зловживати цими даними спонукало до їх вивчення. Уроборос вели дуже детальні записи всіх своїх експериментів, настільки ретельні, що ми змогли розплутати заплутані родоводи місцевих трибалів і використати це як реальні медичні дані. Ми можемо використати генеалогічні записи для покращення лікування трибалів під нашим контролем або розкрити їм правду, дискредитувавши правління Гекати й закріпивши власну владу. У будь-якому випадку, Бейр і всі її дослідження тепер у наших руках."
nf_sle.6.a:0 "Почати розплутувати дані і виправити ситуацію, поки не пізно."
nf_sle.6.b:0 "Хай знають. Хай гніваються!"

nf_sle.7.t:0 "Стара знайома"
nf_sle.7.d:0 "Сян не любила походів.\nСпершу кілька днів мандрівки з охороною до Парадайзу, щоби знову зустрітись із загадковою Діаною. Потім – кілька годин вертикального підйому до таємної лабораторії, де містилися комп’ютери ЗАКС. Весь цей фізичний труд лише змушував Сян нудьгувати за зручністю вертиптаха. Сподівалася, що скарби, за якими вона прийшла, варті зусиль.\n\nВона впевнено крокувала по об’єкту. Сян уже була тут. Вона знала системи — знала сліпі зони в захисті Діани — знала, де лежить її серце. Не було сенсу згадувати минуле чи шукати інше обладнання. Вона прямувала просто до центрального комп’ютера і, після кількох днів мовчазної виснажливої подорожі, нарешті заговорила:\n\n— Діано. Я прийшла забрати борг.\n\nПопри все, Діана вперто продовжувала підтримувати абсурдну маску богині, навіть перед тими, хто знав її справжню природу. На екрані з’явився текст:\n\n«Я ТОБІ НІЧОГО НЕ ВИННА. ТИ ОТРИМАЛА СВОЄ, ЯК ТІЛЬКИ ДОПОМОГЛА МЕНІ. ТИ ОБРАЖАЄШ МЕНЕ ЦИМ НАГЛИМ ВИМОГАННЯМ.»\n\n— Ти винна мені за те, що досі живеш. Твої системи тоді ще дрімали. Якби не я — хоч би кріт-щур пробрався й прогриз твій новий мозковий корпус. Твоє життя справді настільки дешеве, щоби нехтувати моєю допомогою, Діано?\n\nПісля напруженої тиші в повітрі знову почувся гул процесорів.\n\n«ТИ ПИХАТА, ЯКЩО ГАДАЄШ, ЩО ЗАСЛУГОВУЄШ НА БІЛЬШЕ, НІЖ ОТРИМАЛА. МОЛИСЯ, ЩО Я НЕ РОЗСТРІЛЯЮ ТЕБЕ ЛАЗЕРАМИ.»\n\n— Моєму народу потрібен GECK. І будь-які дослідження, якими ти можеш поділитися. Я знаю, в тебе їх повно — ти роздавала їх половині груп у Колорадо. Це не так уже й багато, зважаючи на твої ресурси.\n\nКілька секунд потому на екрані з’явилося:\n\n«А ЯКЩО Я ВІДМОВЛЮ?»\n\n— Тоді я залишаю тут імпульсну бомбу, яку принесла з собою. Вона тебе не вб’є, але на кілька років точно відкине назад.\n\nВідповідь була саме тією, на яку Сян сподівалася."
nf_sle.7.a:0 "ПОЧАТОК ПЕРЕДАЧІ ДАНИХ."

nf_sle.8.t:0 "Повернення до Куполу (Боулдер)"
nf_sle.8.d:0 "Минуло вже десятиліття з того часу, як Сплячі покинули Купол у Боулдері, залишивши по собі дослідження та безцінні технології, тікаючи від жорстокої відплати НКР. Купол був їхнім домом — останнім осередком довоєнної цивілізації, якірцем спільної ідентичності. Його втрати сплячі не змогли пробачити, перетворивши його на майже святиню, символ втрачених надій на майбутнє.\n\nАле тепер, після стількох років, ми знову володіємо Куполом. Усі супротивники переможені, вхід розпечатано, і старі проєкти знову перевіряють, документують і, сподіваємося, відновлюють. Ми нарешті вдома."
nf_sle.8.a:0 "І ми більше ніколи не залишимо його."

nf_sle.9.t:0 "Повстаньте! Прокиньтеся!"
nf_sle.9.d:0 "Сян замислилася над нещодавніми перемогами Сплячих. Західний Колорадо впав. Жалюгідні племена Юти підкорено. Сплячі здобули технології та промисловість, щоби почати відбудову пустки на свій лад. Попри всі труднощі, купка забутих науковців, яких вона колись спокусила на вбивство, знову завоювала майже все те, що вона ж і допомагала зруйнувати.\n\nАле не все. Космічний центр Блумфілда знищили рейдери. НКР не дозволить їй повернутись до родини та друзів у Ші — вони назвали б будь-кого, пов’язаного зі Сплячими, терористом. Колорадо досі під владою ворожих сил, що загрожують Боулдеру. Сплячі не можуть розслабитися, доки не знищено кожного ворога. Але вони вже достатньо спали. Сян нарешті усвідомила, який потенціал криється в них, тільки-но вони прокинуться. Вона ніколи не була майстром промов, але цього разу знала — мусить звернутися до Сплячих, щоб надихнути їх. Це лише початок..."
nf_sle.9.a:0 "Нашого повернення вже не спинити!"

nf_sle_dec.1.t:0 "Спалах чуми на фронті"
nf_sle_dec.1.d:0 "Нова жахлива хвороба поширилася серед наших військ, заражаючи солдатів і цивільних. Вона надзвичайно стійка до звичних засобів лікування і майже завжди смертельна. Більшість солдатів переконані, що це зброя ворога — створена Сплячими. Ми повинні знищити їх, поки вони не вдарили знову!"
nf_sle_dec.1.a:0 "Швидко! Знищити їх!"

nf_sle_dec.2.t:0 "Масові зникнення"
nf_sle_dec.2.d:0 "На фронті почалася хвиля зникнень — солдати зникають просто посеред ночі. Цілі загони не залишають слідів. Дехто стверджує, що бачить дивні спалахи вдалині вночі, або що вороги починають виглядати... знайомими."
nf_sle_dec.2.a:0 "Сплячі щось замислили..."

