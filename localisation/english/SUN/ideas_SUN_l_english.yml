l_english:


#Sun Dog Ideas#
sun_lupas_assistance: "Допомога від Королеви вовків"
sun_lupas_assistance_desc: "Хоч ми й не в захваті від культу та послідовників, яких приводить ця «Королева вовків», її допомога безцінна в боротьбі з Легіоном. Поки що ми її терпітимемо..."

sun_exiled_the_moon: "Вигнання Королеви вовків"
sun_exiled_the_moon_desc: "Лупа пішла, хоча деякі з її послідовників залишилися. Це не має значення, ми навчимо їх захищати плем'я!"

sun_embrace_the_moon: "Прийняття Королеви вовків"
sun_embrace_the_moon_desc: "Лупа знає, що мусить підготуватися до війни з Легіоном, і вона це зробить. Її послідовники та їхні вовки зубами й кігтями битимуться проти Легіону."

bag_ncr_approval: "Підтримка НКР"
bag_ncr_approval_desc: "НКР схвалила наше прохання й надасть війська, які ми зможемо відправити на допомогу народам Колорадо в боротьбі проти Легіону."

bag_ncr_denial: "Самі по собі"
bag_ncr_denial_desc: "НКР кинула нас напризволяще, проте наші спроби були помічені й почуті жителями Колорадо, які тепер стікаються до нас у пошуках захисту."