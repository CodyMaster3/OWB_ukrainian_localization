  nf_ruminators.1.t:0 "Тихе та маленьке місце"
  nf_ruminators.1.d:0 "Цей затишний район колись був кемпінгом і природним курортом. До випалення ця земля була вкрита лісами, населена дикою природою, обдарована водоймами та природними печерами, із затишними будиночками, котеджами й приватними сезонними маєтками. Це місце приваблювало відпочивальників, натуралістів, спостерігачів за птахами та любителів озер.\n\nОрганізація лісників охороняла ці землі від браконьєрів та інших негідників. Вони часто конфліктували зі спілкою, яка щоліта селилась на своїй розкішній території біля гольф-клубу.\n\nОкрім статусу природного заповідника, ця територія, відома як Стретч, славилася метеорними дощами й бездоганним нічним небом для спостереження за зірками. Ця земля, також, була магнітом для комет, однак чому — ніхто не знав. Одна з них впала прямо в парк — дивна, радіоактивна — і за наступної ночі місцеві комахи почали мутувати. Хоча більшість мутованих комах забрали дослідники, лісники залишили декількох собі. А саме — Біофлаїв.\n\nБіофлаї були треновані та використовувались лісниками як трекери, провідники й маяки для загублених туристів та персоналу. Проте Біофлаї тягнулися до органіки, мов терміти до дерева. Рішенням, запропонованим наглядачкою Роуен Еверетт, було, щоб усі лісники носили флакон лаванди. Лаванда відлякувала Біофлаїв від шкіри, хоч і не надавала абсолютного захисту."
  nf_ruminators.1.a:0 "Для нас це ніби дім."

  nf_ruminators.2.t:0 "Золоте Серце, Зоряні Очі"
  nf_ruminators.2.d:0 "Очолювані завжди оптимістичною, усміхненою Єлизаветою, Румінатори — це релігійна група, яка присвятила себе довоєнній книжці самодопомоги «Румінацією - до багатства». Єлизавета проповідує мир і позитивне мислення. Попри молодість, Єлизавета — природжена лідерка: її чарівність змінює серця й долі. Її послідовники такі ж співчутливі, як і вірні.\n\nКлючовим спогадом дитинства Єлизавети було читання. Вона завжди була з книжкою, серед антисептиків і марлі. Народжена в сім'ї кочових лікарів, Єлизавета з дитинства захоплювалася допомогою людям та літературою. Вона вірила, що кожен заслуговує на турботу — бо коли ти пригнічений, поранений чи побитий, ти все ще є таким самим, як інші.\n\nПроте, її батьки нажили стільки ж ворогів, як і друзів. Вороги чоловіка, якого вони врятували, підпалили їхній дім і вбили обох. Єлизавету врятував самотній гігант у важких обладунках — пізніше вона дізналася, що це був вояк Анклаву із МакАртура. Її доправили до табору, де її вилікували незнайомі їй люди.\n\nВона була байдужа до їхніх добрих слів і ідеалів, доки не зцілилася настільки, щоб втекти. І вночі вона пішла — з рюкзаком та простою одежиною. Вона йшла без зупинки — тікаючи від власних думок.\n\nДоля привела її до покинутого кемпінгу з закинутими будівлями, де вона знайшла безліч старовинних текстів, серед яких — книга під назвою «Румінацією - до багатства»."
  nf_ruminators.2.a:0 "Та чортова усмішка..."

  nf_ruminators.3.t:0 "Я зберу тебе докупи. Частина I"
  nf_ruminators.3.d:0 "Буря була жахливою, втім Арчі це подобалося. У міру того, як тягнувся вечір, буря наближалася з-за обрію. Небо було затягнуте сірими хмарами, а в повітрі били блискавки — щось гаряче, в'язке й зле. Щось, що от-от зірветься з повідка, але ще тримається.\n\n\"Ти будеш в ефірі о десятої, Арчі,\" пролунав голос техніка по рації.\n\nАга, ось де закінчуються ці думки. Арчі поставив склянку, з якої пив — лід у ній вже давно розтанув, залишивши водянисту суміш, але Арчі любив робити усе повільно. "Зробімо о п’ятій," хмикнув він. "Подаруймо глядачам шоу."\n\n\"П'ять?\" — невпевнене уточнення. "Але... але нам ще треба—"\n\nКрик прорізав тишу з кутка офісу. Арчі вилаявся. "Чорт, брате, вибач, мушу тебе перебити на хвилину—" У швидкому русі Арчі вихопив свій .44 з кобури й вистрілив у тінь у кутку.\n\nЦе був попереджувальний постріл — куля вдарила в гіпсокартон, але цього вистачило, щоб відновити тишу.\n\nАрчі провів рукою по волоссю, зітхнувши. "Ще раз перепрошую, брате. Не хотів тебе так переривати" хмикнув він, трохи сильніше стиснувши рацію. "Я що, в біса, заїкався?"\n\n\"Н-ні. Ні, не заїкався.\" — ніякове покашлювання. "Пробач, Арчі."\n\n\"Тримай підборіддя догори, брате!\" — цокнув язиком Арчі, усміхаючись. "Який же з тебе Святий, якщо не йдеш вгору?"\n\n\"Грішний,\" — відповів технік. "Почнемо за п’ять.""
  nf_ruminators.3.a:0 "Далі буде..."

  nf_ruminators.4.t:0 "Я зберу тебе докупи. Частина II"
  nf_ruminators.4.d:0 ""Краще бути Святим, ніж грішником!" — вигукнув Арчі. Він підвівся, коли приємний дзвін ефіру пролунав із динаміка. Взявши мікрофон, він почав веселим кроком ходити кімнатою. "Добрий вечір, браття! Сподіваюся, вам сподобалась ця година хітів Звідтіля! Це була моя власна підбірка! І на завершення вечору — маю для вас сюрприз..."\n\nВисмикнувши кабель, Арчі підскочив до фігури в кутку й підніс мікрофон. Бідолаха відсахнувся. Арчі зітхнув і похитав головою — невдалий вибір сьогодні. Але час вимагав рішень. Він ударив ногою по гомілці (або що б на її місці не було) — хруст і крик задовольнили його.\n\n\"Отак!\" — захихотів він, повертаючи мікрофон до себе. \"Це — Багряна Субота, народ! Розслабтесь, вмощуйтесь зручніше й нехай звуки праведності вас заколишуть.\"\n\nВін поклав мікрофон на підлогу, пішов до гольф-сумки, витягнув ключку, оцінив її блиск — і витяг жертву з кутка. Слідом, він розклав газети — старий трюк: кров погано виводиться з паркету.\n\n\"Слухайте, народ,\" — всміхнувся Арчі. "З якої нори б ви не вилізли, для кожного знайдеться місце серед Святих! Ми терплячі, ми прощаємо, але якщо наступати нам на ногу занадто часто... дізнаєтесь самі."\n\nАрчі заплющив очі, замахнув ключку за спину. Уявив сонячний день, пагорби й ставки. В центрі — кубок переможця, сяючий келих.\n\nА потім він замахнувся."
  nf_ruminators.4.a:0 "У лунку з першого удару."

  nf_ruminators.5.t:0 "Дисонанс Світлячка. Частина I"
  nf_ruminators.5.d:0 "Ліхтарики, підвішені на поясі Сола, тремтіли, поки він дерся до вершини Лампіридейських Печер. Біофлаї не любили хімічних вогнів, що палали з розломів печер і навколишньої землі. Якщо чесно? Сол теж.\n\n\"Та чую я вас, чую,\" — пробурмотів він, легенько постукуючи по ліхтариках. \"Майже на місці.\" Зелене світло Біофлаїв мигтіло у відповідь, але згодом вщухло. Вершина Лампіридейських Печер височіла над долиною. Та згідно з вподобаннями наглядача Роуен, всі отвори, через які могла пробиватися світла, були затягнуті ковдрами. Стеля печери губилася в темряві — кожного разу Сол ловив себе на думці, наскільки вона висока.\n\nРоуен стояла над дошкою, стискаючи шматок собачого м’яса голими руками. Сол відкашлявся, аби оголосити про свою присутність, погляд зупинився на крові, що стікала до її миски.\n\n\"Та не будь як не свій,\" — хмикнула Роуен, її палаючі очі піднялись до нього.\n\nУголосок Сола сіпнувся. \"Я й не збирався.\"\n\nРоуен скептично фиркнула, хоч з її гугнявого тону зла не відчувалося. \"А дивишся так, наче збираєшся.\"\n\n\"Та може, через це.\" — Сол відкинув плащ і показав ще кілька ліхтариків Біофлаїв, прикріплених до поясу — усі не його власні.\n\nПлечі Роуен опустилися; її понівечене обличчя не могло виразити скорботу, але Сол завжди розумів, що вона відчуває. Хоча й не завжди хотів. \"Скільки?\" — прохрипіла вона.\n\n\"Шестеро.\" Сол передав ліхтарі. Один за одним він назвав імена загиблих Світлячків. Роуен малювала їх собачою кров'ю на Стіні. Потім вони випустили Біофлаїв з ліхтарів — частина з них злетіла до стелі, інші лишилися, притулившись до імен, які засяяли зеленим світлом."
  nf_ruminators.5.a:0 "Далі буде..."

  nf_ruminators.6.t:0 "Дисонанс Світлячка. Частина II"
  nf_ruminators.6.d:0 ""Як вони померли?" — спитала Роуен, не зводячи очей з імен.\n\n\"Один — загинув на полюванні. Мабуть, зіткнувся з рейдерами,"— сухо відповів Сол. "А інші п’ятеро? Хвороби."\n\n\"Жаль...\" — прошепотіла Роуен.\n\n\"Та ще б пак,\" — зітхнув Сол. "І скільки ще так можна?"\n\nРоуен мовчала з опущеною головою. Вона сумувала. І поки вона сумувала — все навколо зникало у фоні, наче білий шум. Якби Сол був у кращому настрої, він би поважав цю тишу. Але він не міг. Він був злий. Він був виснажений. Йому було досить. "Скільки ще доведеться приносити їх сюди, щоб ти нарешті зрозуміла, що ми вимираємо?!" — вигукнув він. І Роуен, на добро чи на зло, підняла на нього очі.\n\n\"Хімічний вогонь не дістанеться вершини чи верхніх рівнів гори. Якщо ти так хвилюєшся — я попрошу наших Цілителів перевести хворих вище," — відповіла Роуен. "Тоді він не поширюватиметься."\n\nЩелепа Сола стислалась. "Я не збираюся тут вмирати. І ти теж не маєш."\n\n\"Я не помру і не збираюся,\" — відповіла вона порожнім поглядом. "Ти хочеш побачити світ. Усі молоді хочуть. Але коли подорослішаєш, зрозумієш: дім — це все, чого ти потребуєш."\n\nІ тоді Сол засміявся — неочікувано і для себе, і для неї. "Скільки їх було до мене?" — спитав він. Відповіді не було. Тиша сказала усе. "Я просто стану ще одним іменем на цій стіні. А потім ти забудеш переписати моє ім’я — і я зникну. Так?" Перш ніж вона щось відповіла, він похитав головою. "Ти не знаєш, як краще. І я не залишусь тут, доки ти не зрозумієш."\n\nВуха палали. Ноги самі пішли. Його ім’я ще лунало в печері — як прохання. Але його гнів уже не чув голосу Роуен."
  nf_ruminators.6.a:0 "Його вела трагедія."

  nf_ruminators.7.t:0 "Румінацією - до багатства. Частина I"
  nf_ruminators.7.d:0 "Там, де її ніхто не бачив, Єлизавета зверталася до книжок по розраду. Але це були не книги «Румінацією - до багатства». Це були старі книги — вкриті попелом. Вона їх обожнювала, але в цей критичний момент навіть не наважувалась їх тримати.\n\nЄлизавета приглушила зітхання, обтрушуючи пил із колись вишнево-рожевої обкладинки. «Принцеса-Бунтарка» — назва височіла над малюнком принцеси з мечем, спрямованим у небо. Ця книга була символом старих часів, коли вона ще не була Єлизаветою Румінаторів чи усміхненою дівчиною. Тоді вона була просто Ліза. Ліза з обома руками та мріями в голові.\n\nПринаймні частина з того лишилась.\n\nТа як тільки вона знову сіла за стіл із книжкою, думки знову спрямували в похмурі місця. Як вона може витрачати час на читання? Святі втрачали контроль — їхні витівки ставали дедалі жорстокішими. Вчора була перша смерть. Святі, звісно, це заперечили, але череп не розбивається просто так.\n\nА ще — нові обличчя на горизонті. Шкіра, шкіра, зброя — невже рейдери?\n\n\"Зберися, Єлизавето!\" — ляснула себе по щоці. \"Ніякого світлого боку в тривозі! Треба розслабитись.\" Вона розгорнула книжку. \"Здоровий розум — щасливий світ.\"\n\nІ вона занурилася у казкову історію з усмішкою та дощем за вікном...\n\n\"Ліза?\" — м’який голос за дверима. Вона одразу впізнала — Гейзел. Висока, молода, з веснянками."
  nf_ruminators.7.a:0 "Далі буде..."

  nf_ruminators.8.t:0 "Румінацією - до багатства. Частина II"
  nf_ruminators.8.d:0 "Єлизавета швидко закрила книгу. Вона вже не знала, котра година, і скільки вона вже читає. "Так?" — гукнула, нахилившись до дверей.\n\n\"Там... гм,\" — Гейзел клацнула язиком. \"Там чоловік ззовні, хоче з тобою поговорити. Каже, що з Лампіридейських Печер.\"\n\n\"З Печер?\" — Єлизавета швидко кинулася до дверей і відчинила їх. Гейзел відступила назад з широко відкритими очима, але кивнула. \"Ми ніколи з ними не говорили. Заведи його! На вулиці ж злива!\"\n\nГейзел нервово всміхнулася. \"Розумієш...\" — вона закусила губу. \"У нього з собою дивні жуки, вони чіпляються до худоби... і, ну... він когось вдарив, коли йшов сюди.\"\n\nЄлизавета кліпнула. \"Кого?\"\n\n\"Астера.\" — Гейзел знітилася. \"Астер вже притиснув його на площі. Всі наставили на нього зброю. Він ще не стріляв, бо чекає твого рішення.\"\n\n\"Очевидно, сталося непорозуміння!\" — лагідно докорила Єлизавета, надягаючи пальто. \"Хоча...\" — вона круто розвернулась до Гейзел із новою ідеєю. \"Забіжи до старого суспільного центру і зроби какао з того порошку, що ми знаходили.\"\n\nГейзел кивнула. \"Скільки робити?\"\n\n\"Скільки зможеш! Напевно всі захочуть добавку, а може й дві!\" — усміхнулася Єлизавета і підняла кулак. \"Це вирішить питання із ударом в обличчя. Вперед!\" Гейзел побігла. Коли коридори спорожніли, Єлизавета поправила пальто і відрепетирувала усмішку. Цей вечір має закінчитися добре — і вона це забезпечить."
  nf_ruminators.8.a:0 "Щасливі дні, щасливі дні..."

  nf_ruminators.9.t:0 "Какао й Зелені Жуки. Частина I"
  nf_ruminators.9.d:0 "До того часу, як усе владналося, всі промокли до нитки. Єлизавета завела всіх до суспільного центру, на ходу насваривши Астера за запальність. \"Що?! Але це він почав,\" — огризнувся Астер, вказавши на чужинця, якого Єлизавета вже знала як Сола.\n\n\"І ми ніколи не повинні відповідати зброєю,\" — строго мовила вона. \"Хтось міг постраждати.\"\n\nАстер хмикнув, але не заперечував. Він кинув косий погляд на Сола.\n\nТой дивився назад. Його обличчя було порожнім, засклянілим — та Єлизавета відчула в ньому гнів. Сумний гнів. Вона уповільнила крок і спитала: \"Ти колись пив шоколадне молоко?\"\n\nВін моргнув. \"Що?\"\n\nЄлизавета почервоніла. Це буде важка посмішка. \"Прийму це як «ні»,\" — всміхнулася. \"Це чудова річ, серйозно! На смак як шоколад — якщо ти його куштував. А ще воно вершкове! Смачне й гарячим, і холодним.\"\n\nВін моргнув знову. Мовчав. Але Єлизавета чула в тиші ще одне \"що?\"\n\nГейзел стояла з круглими очима — щойно приготувала другу дюжину чашок. Почала роздавати какао, і кожен ковток викликав зітхання задоволення. Гарячий напій для втомлених Румінаторів — краще не придумаєш."
  nf_ruminators.9.a:0 "Далі буде..."

  nf_ruminators.10.t:0 "Какао й Зелені Жуки. Частина II"
  nf_ruminators.10.d:0 "Попри напруження, у центрі громади панувала тиша. Незручна тиша. Але Єлизавета не втрачала оптимізму — в кожній руці у неї було по дві чашки какао.\n\n\"Може, тобі допомогти?\" — спитала Гейзел через плече.\n\n\"Не хвилюйся, Гейзел! У Єлизавети все під контролем,\" — усміхнулася вона і підбігла до Сола. \"Ось, Соле, спробуй.\"\n\nСол стояв насторожено, схрестивши руки. Він глянув на чашки з підозрою. Єлизавета знала цей погляд — такий же був колись і й у Астера.\n\nТож вона сама зробила ковток з обох. \"Бачиш? Все гаразд,\" — подала одну йому. Сол трохи розслабився — і нарешті прийняв чашку.\n\nЄлизавета спостерігала з усмішкою, як Сол робив перший ковток, потім другий, потім ще. Його щоки порожевіли. Він глянув на неї й пробурмотів: \"Смачно.\"\n\nНіч тільки починалася — але Єлизавета знала, що все йде її сценарієм."
  nf_ruminators.10.a:0 "Так народжуються друзі."

  nf_ruminators.11.t:0 "І тоді з’явилися Світлячки"
  nf_ruminators.11.d:0 "З попелу Лісників постала нова група: Світлячки — усамітнена група нічних мисливців під проводом наглядача Роуен. Колишня лідерка лісників, Роуен — радіоактивний гуль ще з часів падіння бомб. Вона — одна з останніх лісників, передала свої знання тим, кого прихистила.\n\nРоуен вірить у ізольоване існування. В її очах світ — жорстокий і непривітний, а печери — єдиний справжній дім.\n\nСвітлячки побудували свою культуру й майстерність довкола Біофлаїв — світляків, змінених радіаційною кометою. У кожного — власний ліхтар для утримання Біофлаїв. Аби ті не чіплялися до них, вони змазують себе лавандовим репелентом.\n\nПротягом років вони оберігали околиці — незалежно від того, чи знав хтось про це."
  nf_ruminators.11.a:0 "Мов янголи у ночі..."

  nf_ruminators.12.t:0 "І Прийшов Чоловік з Амбіціями"
  nf_ruminators.12.d:0 "Арчі — харизматичний психопат і засновник, самопроголошений Алумнус Святих — рейдерської групи, що оселилася на території старого гольф-клубу. Серед здобичі — голограми-брошури спілки, за якими Арчі живе, мов за писанням.\n\nНароджений в іншій рейдерській зграї, без імені й значення, Арчі пішов шукати своє. Він знайшов його в маєтку, серед зелених полів, пластикової трави та вицвілих стовпів.\n\nТа він був не сам — інша зграя вже оселилася там. Небажаючи бути підлеглим, Арчі викликав лідера на двобій. Йому було байдуже до смерті. Він виграв — брутально — і першим ділом впровадив \"вищу якість життя\".\n\nЙого власний стиль з’явився після знайомства з автором голограм — Арчі Ланкастером. Він наслідував його, втягнувши всіх у культ спілки.\n\nЩоб просувати своє вчення, Арчі щодня транслюється — і його шоу, як і кров, принесли йому славу. Його ім’я знають всі — а якщо не ти, то твій друг точно вже був у нього в ефірі..."
  nf_ruminators.12.a:0 "Не перемикайтесь!"

  nf_ruminators.13.t:0 "Вони подорожували із стилем"
  nf_ruminators.13.d:0 "Гейзел влетіла до освітленого місячним сяйвом кабінету Єлизавети, захекана, намагаючись перевести подих. "Ліза! Ліза!" — крикнула вона, махаючи руками.\n\nЄлизавета заморгала. \"Сідай, Гейзел — що сталось?\"\n\n\"Кулі! Великі! Летять на схід!\"\n\nСерце Єлизавети стислось. Вона мала на увазі дирижаблі? \"Покажи,\" — з острахом сказала вона.\n\nНа вулиці вже зібрався натовп — усі дивилися в небо. Ліхтарі з дирижаблів осявали нічний краєвид Монтани.\n\nГейзел смикнула її за рукав. \"Що робити?!\"\n\nЄлизавета не знала, що саме можна зробити — але вона ніколи не відмовляла новим людям, якщо це було в її силах. \"Відправимо делегацію!\" — сказала вона, поправивши брошку на пальті, й усміхнулась."
  nf_ruminators.13.a:0 "Сподіваюсь, вони дружні?"

  nf_ruminators.14.t:0 "Чужинці з цієї Дивної Землі"
  nf_ruminators.14.d:0 "Звіт Зігфри:\n\nСтарійшино,\n\nДелегація культістів, що називають себе "Румінатори", з'явилась у нас на порозі з так званими "кошиками гостинності". Після додаткового допиту з'ясувалося, що вони з міста Роузбад на захід звідси. Виглядають загалом доброзичливими — хоча хто знає, чи це не фасад?\n\nЯ розгублена й потребую вашого керівництва. Що, на вашу думку, нам слід зробити?"
  nf_ruminators.14.a:0 "Відправити їх геть — ми тут не заради того, щоб заводити друзів."
  nf_ruminators.14.b:0 "Прийняти їх. Немає причини бути холодними."

  nf_ruminators.15.t:0 "Братство Сталі"
  nf_ruminators.15.d:0 "Делегація Румінаторів, відправлена на розвідку дирижаблів, повернулася неушкодженою, на щастя. На жаль, Форт Веріті зараз під контролем так званого Братства Сталі, і їхні наміри видаються дещо ворожими. Їхні відповіді були ухильними, а наш доступ до міста — обмежений."
  nf_ruminators.15.a:0 "Ну, нехай вкусять мій..."

  nf_ruminators.16.t:0 "Братство Сталі"
  nf_ruminators.16.d:0 "Делегація Румінаторів, відправлена на розвідку дирижаблів, повернулася неушкодженою, на щастя. Нові мешканці виявилися дружніми та готовими до співпраці."
  nf_ruminators.16.a:0 "О-ох..."

  nf_ruminators.17.t:0 "Про Солов’їв та Сестер"
  nf_ruminators.17.d:0 "Звіт Мінерви:\n\nВаша честь,\n\nДехто з місцевих прибув до Форту Веріті, вони хочуть познайомитися з нами. Вельми приємні, і навіть готові доставити листа!"
  nf_ruminators.17.a:0 "Гм. Подивимось, що вони нам можуть запропонувати."

  nf_ruminators.18.t:0 "Вони Шанують Америку. Частина I"
  nf_ruminators.18.d:0 "Єлизавета одразу впізнала це, хоч і знала — щось тут не так: старий прапор, що майорів із люттю на вітрі, зшитий зламаними людьми, які ніколи не бачили, як він майорить по-справжньому. Вона підійшла ближче, склавши руки, і почула промову на старій заправці в Роузбаді.\n\n"Панове й пані Монтани, ви не відчуваєте сліз ангела Америки на своїх щоках? Хіба забули, що саме у їй утробі ми пережили ядерний кінець? Або просто блукаєте в розпачі, з розбитими серцями?" — вигукувала жінка з піднятим кулаком. "Я пропоную вам можливість стати поруч зі мною та принести відплату в ім’я Америки. Ми повинні очистити світ заради її повернення, інакше загинемо!"\n\nЄлизавета слухала ці вигуки дедалі зростаючого насильства з все більшим неспокоєм, стискаючи руки.\n\nКоли жінка завершила, Єлизавета підійшла до неї — її обличчя було в бойовому розфарбуванні, а в очах палав вогонь."
  nf_ruminators.18.a:0 "Далі буде..."

  nf_ruminators.19.t:0 "Вони Шанують Америку. Частина II"
  nf_ruminators.19.d:0 "Єлизавета широко усміхнулася. "Привіт! Мене звати Єлизавета. Ви маєте хвилинку поговорити?"\n\nБрови жінки пом’якшились. "Мене звати Ріанна. Ріанна Робертсон," — сказала вона, роздивляючись Єлизавету з дитячою цікавістю. "Чого ви хочете?"\n\nРуки Єлизавети спітніли, але вона зібралася. "Мене зацікавила ваша промова — ви багато говорили про відплату й очищення світу. Що ви мали на увазі?"\n\nОчі Ріанни спалахнули. "Просто. Америка постраждала від таких, як Анклав — і я хочу, щоб ми були готові. Поки є заперечувачі — вона не повернеться."\n\nЄлизавета кивнула. "Чому ви хочете, щоб Америка повернулась?"\n\n"Бо вона символ часу, коли було краще. Коли благодать Божа торкалась землі, а не викривляла її. До того, як люди почали балакати про атом чи кришки," — вона зі зневагою сплюнула. "Коли правила пристойність... А не оце все."\n\nЄлизавета схилила голову. Вона відчувала, що серце Ріанни, можливо, в правильному місці, але офіційно впустити Культ Свободи в Роузбад — це виклик, що може обернутися проблемами."
  nf_ruminators.19.a:0 "Вона наказала Солу попросити Ріанну піти."
  nf_ruminators.19.b:0 "Вона запросила Культ Свободи залишитися."

  nf_ruminators.20.t:0 "Дилема Ріанни"
  nf_ruminators.20.d:0 "Ріанна вже годину ходила колами, очікуючи зустрічі з Єлизаветою. Як вона взагалі втрапила в це? Карвер точно не буде радий її затримці з проповідями в Гаврі, і вона сама не була певна... Або була? Вона залишилася з якоїсь причини.\n\nЇї думки змінила радість, коли двері відчинилися. Єлизавета вийшла, ставлячи дверний упор. "О, вау! Ви рано!" — сказала вона з усмішкою.\n\nРіанна не відповіла одразу. Її перші слова були нерішучі. "Так, я... зацікавлена."\n\n"У чому саме?" — спитала Єлизавета.\n\n"У вашому русі. У Румінаторах."\n\nЄлизавета нахилила голову. "Що саме вас бентежить?"\n\n"Чому ви піклуєтеся?"\n\n"Про?"\n\n"Про людей."\n\nЄлизавета подумала. "Гадаю, це не так і відрізняється від того, чому ви хочете повернення Америки. Ми просто хочемо зробити світ кращим," — вона втомлено всміхнулася. Витягла книжку з шухляди. "Ось. З цього я почала, якщо цікаво."
  nf_ruminators.20.a:0 "І їй справді було цікаво."

  nf_ruminators.21.t:0 "Прекрасний Вид"
  nf_ruminators.21.d:0 "Під час однієї з прогулянок Єлизавета побачила дещо надзвичайне: фреску Роузбада на старій цегляній стіні, над якою пильним оком дивилася Америка. Яскраві блакитні відтінки, поєднані зі багряними лініями, все зливалось у центрі — міську площу, де сяяла золота усмішка.\n\nВона була так зачарована, що не помітила, як до неї підійшла Ріанна. "Ви ще не мали це бачити," — несміливо сказала вона.\n\nЄлизавета озирнулась, хихотнула. "Ріанно — це ти зробила?"\n\n"Я ще не закінчила," — в паніці відповіла та.\n\n"Це чудово!" — вигукнула Єлизавета, обіймаючи її. "Прекрасно!" — вона розвела руками. "Як давно ти малюєш?"\n\n"Нещодавно почала," — ковтнула Ріанна.\n\nЄлизавета нахилилась, м’яко усміхаючись. "Ти природжена художниця," — вона взяла її за руку. "Хочеш розписати міську ратушу?"\n\nРіанна відкрила рота від подиву — і заплакала від щастя."
  nf_ruminators.21.a:0 "Якщо вона ще не належала до тутешніх — то тепер буде."

  nf_ruminators.22.t:0 "До Єлизавети, терміново!"
  nf_ruminators.22.d:0 "Дорога Єлизавето,\n\nВітаю! Я почув про ваш Рух Румінаторів і хотів би надіслати власне вітання разом із невеликою групою моїх колег-Істориків. Слава про ваші добрі справи дійшла аж до Міссурі, і ми неймовірно раді, що у вас все так добре!\n\nАле окрім вітання, шановна пані, я хотів би уточнити: якщо дозволите, мої друзі допоможуть вам навчити місцевих новим навичкам. Ви зможете консервувати продукти" — напис далі трохи нерозбірливий — "зберігати їжу ефективніше і навіть виробляти її якісніше.\n\nБудь ласка, якщо вам дійде це послання, напишіть мені у відповідь. Дуже хотілося б дізнатися, як у вас усе йде!\n\nЗ повагою,\n\nВільям Ґудвін"
  nf_ruminators.22.a:0 "Який дивний, але милий лист!"

  nf_ruminators.23.t:0 "Радіо Румінаторів — в ефірі!"
  nf_ruminators.23.d:0 "Сол стояв, дивлячись на нову радіовежу, тримаючи руки на поясі та задумливо хмикнувши.\n\nЄлизавета підійшла, всміхаючись. "Загубився в думках?"\n\nВін повернувся до неї, з легкою насмішкою. "Думаю, що ж воно таке транслюватиме."\n\nЄлизавета підперла підборіддя пальцями. "Я тут подумала, що музики і читання "Румінаціі до багатства" буде достатньо. А ти що маєш на думці?"\n\n"Поради з самооборони. Звіти про місця перебування рейдерів. Таке, що справді може комусь врятувати життя в цих краях." — знизав плечима. "Особливо зараз, коли Святі... ну, сам знаєш, які вони останнім часом."\n\nЄлизавета насупилась. "Це важливо, але..." — прикусила губу. "Іноді людям просто треба щось добре. Щоб нагадувало: світ не такий вже й поганий. Ми й без рейдерських зведень якось справлялись."\n\nСол похитав головою. "Людям не потрібні теплі слова. Їм потрібна безпека."\n\nЙого слова були твердими, але Єлизавета не була достатньо впевнена. Що ж вона вирішить?"
  nf_ruminators.23.a:0 "Людям потрібна любов."
  nf_ruminators.23.b:0 "Людям потрібна допомога."

  nf_ruminators.24.t:0 "Надія на найкраще"
  nf_ruminators.24.d:0 "Сьогодні вранці група Румінаторів прибула до наших земель з ліками і щирими надіями. Вони говорили з нашими людьми, намагаючись переконати нас у мирному вирішенні конфлікту за гору Рашмор, але це все не змогло зайти надто далеко. У будь-якому разі, ці відвідувачі були приємними, і їхні дари були вдячно прийняті."
  nf_ruminators.24.a:0 "Можливо, все ще стане краще."

  nf_ruminators.25.t:0 "Сьогодні в місто приїхали вершники"
  nf_ruminators.25.d:0 "Це сталося ранком: рев моторів пролунав вулицями Роузбаду, всі або поховалися, або вийшли подивитися. Рейдери в формальному вбранні на справжніх машинах проносилися крізь місто, кричачи та розмахуючи палаючими стягами.\n\nСол уже був на вулиці — з зарядженою зброєю. Безстрашний, як завжди, він убив чотирьох, перш ніж ті відступили. Але всім було очевидно: ми — в меншості, й погано озброєні. Вони не відповіли вогнем лише тому, що самі так вирішили.\n\nСол увірвався до кабінету Єлизавети, гупнувши руками по столу. "Ми мусимо щось із цим зробити."\n\nЄлизавета насупилась, погляд побіг убік. Джексони ніколи раніше не були настільки агресивними... Що ж змінилося? "Може, ми зможемо поговорити з ними?" — невпевнено припустила вона. "Вони не чудовиська."\n\nСол нахилився ближче. "Ти в цьому впевнена?"\n\nЦього разу вона була твердіша. "Ніхто не є чудовиськом. Принаймні не спочатку. Усередині кожного є людина."\n\nСол зітхнув. "Тільки не починай знову. Наші люди могли загинути. Ще скажеш, що Святі — не такі вже й погані?"\n\nВона відкрила рота, але замовкла. У неї з’явилася ідея, і їй не подобалося, яка саме..."
  nf_ruminators.25.a:0 "Святі..."

  nf_ruminators.26.t:0 "Тихий вечір"
  nf_ruminators.26.d:0 "Єлизавета помітила пляму крові першою — а потім і чоловіка. Це були не старі плями: ще не засохлі, вони блищали під світлом. "Зберігай спокій," — прошепотіла вона Солу.\n\n"Я завжди... спокійний," — пробурмотів він у відповідь. Очі Світлячка теж були прикуті до плями.\n\n"Я маю на увазі не тягнися до зброї."\n\n"У мене її забрали на вході," — відповів він, кидаючи на неї бік.\n\nЄлизавета прикусила губу. "Знаючи тебе, я—"\n\n"А що це ви там шепочетеся?" — пролунав голос Арчі. Його усмішка була чарівною, але за нею — щось небезпечне. Він повільно підійшов. "Приходите до Арчі — і навіть не привітались?"\n\n"Що?" — буркнув Сол, нервово сіпаючись.\n\nАрчі моргнув, удавано розгублено, але швидко отямився. "Пані та панове," — виправився він, простягнувши руку Солу.\n\nТой у відповідь миттєво витягнув прихований ніж. Єлизавета скрикнула, відтягуючи Світлячка. "Вибачте! Він... не звик до рукостискань?" — нервово засміялась вона.\n\n"Нічого, люба, не хвилюйся," — Арчі відступив до столу, пригладив волосся, поправив жилет. "Я маю справу з рейдерами щодня, Лізо. Бачив справжніх психів."\n\nСол заспокоївся, але ніж не опустив. Єлизавета обережно опустила його руку. "Отже, перейдемо до справ?"\n\nАрчі спокійно сперся на стіл, навіть не кліпнувши. "Оце вже по-моєму, люба."
  nf_ruminators.26.a:0 "Угода з дияволом."

  nf_ruminators.27.t:0 "Хто такий Алумнус Арчі?"
  nf_ruminators.27.d:0 "Єлизавето,\n\nТи питала мене, як я опинився в такому становищі, чому Святі стали тим, ким стали, і ще купу подібних речей. Тож, для твоїх "нащадків", я вирішив усе викласти письмово. Бо яка користь з історії без спадщини?\n\nКолись, у Колорадо, мене прихистила жінка — рейдерка, що тебе, мабуть, не здивує. Вона та її команда носили костюми й називали себе відповідно. Вони тішилися всіляким вишуканими розвагами, які звичайних людей лякали. Звідси й мої захоплення.\n\nЖартую. Коли мені набридли ті Костюми, я вирішив створити щось своє. Поїхав на північ — сюди — де ще залишалася маленька безіменна банда. Я викликав їхню лідерку на дуель, і виграв — чесно, з ножем.\n\nА те, що я знайшов там, у сховищах — ті старі записи, що я транслюю вже роками — воно справді зачаровує."

  nf_ruminators.28.t:0 "Благання"
  nf_ruminators.28.d:0 "Руки Зігфри були вологими, тривога пробила її зазвичай кам'яну стійкість. Вона готувалась до найгіршого виду розмов — таких, де є вимоги, але нема снаги їх виконати. Рідко буває, щоб вона не могла просто вказати наказом, і все йшло за планом. Тож вона увійшла до кабінету Єлизавети мовчки й насуплено.\n\nЄлизавета зустріла її лише яскравою усмішкою. "Доброго ранку, Паладине! Що привело вас сьогодні?"\n\nЗігфра схрестила руки, ледь піднявши брову. "На сьогоднішній день, міс Єлизавето, ваш рух є нежиттєздатним."\n\nПосмішка Єлизавети ледь згасла. "Чому ви так думаєте?"\n\n"Ви витрачаєте час на шляхетність, дружбу — але у вас майже немає захисту. Окрім того хлопця і його загону чудернацьких рейнджерів? Якщо ви плануєте поширюватись по Монтані, то раджу переглянути курс," — вона кинула короткий погляд у бік. "Ваші наміри шляхетні. Але рано чи пізно ви натрапите на силу, яку не зворушить ні ваше добро, ні ваші промови," — знову прочистила горло. "І мені буде шкода бачити, як це станеться."
  nf_ruminators.28.a:0 "Єлизавета знала — вона має рацію."

  nf_ruminators.29.t:0 "Сол стає на свій шлях"
  nf_ruminators.29.d:0 "Сол був у стані паніки. Джексони вже завдали шкоди — а скільки Румінаторів вміють битися? Пацифізм більше не працює. Може, 300 років тому й працював. Але не зараз. Якщо не рейдери, то Хани, або ще гірші сили прийдуть за ними. І хто тоді їх зупинить?\n\nСвітлячків замало. Сол це знав. Але у нього був план. Йому потрібно лише трохи праці, трохи часу — і згода Єлизавети.\n\nВін піймав її за роботою, дочекався, поки вона зніме окуляри.\n\n"Слухай, Ліз... так не піде."\n\nВона моргнула. "Про що ти?"\n\n"Ми не можемо просто надіятись, що все стане добре. Джексони — це ще пів біди. А що як Макартур спуститься з гір? А що як Барон захоче частину Монтани?" — він вказав на вікно. "Може статися що завгодно. Ми маємо бути готові, а не просто усміхатися й заперечувати небезпеку."\n\nВона постукала пальцями по столу, радіо тихо грало. Її наступні слова стали полегшенням для Сола."
  nf_ruminators.29.a:0 "Я згодна."

  nf_ruminators.30.t:0 "Танок з Дияволом. Частина I"
  nf_ruminators.30.d:0 "Настав час щомісячного святкування, і Єлизавета, тримаючи печиво й напій, була зненацька схоплена — Арчі підійшов мов тінь.\n\n"Єлизавето, люба... потанцюєш?" — його голос, як завжди, був зухвалий, а постава — витончено хижа. На мить вона згадала, як його слова зачаровують, як він гарно виглядає у будь-якому світлі. Голос, що міг захопити кімнату сам по собі.\n\nВін глянув на годинник, тоді — на неї. "Немає часу?"\n\nВона зібралася. "Ні," — відкашлялася, — "Тобто, так. Я б із задоволенням! Ми ж завжди говоримо лише про справи. Було б приємно просто розважитись."\n\n"Я в цьому майстер. Можливо, навчу тебе деяких трюків," — він посміхнувся, подаючи руку.\n\nВона взяла її, трохи невпевнено, дозволивши себе повести. "О, та я знаю, як розважатися," — легковажно сказала вона. "Але я мала тебе дещо спитати, якщо можна."\n\nВін зупинився посеред танцмайданчика, поклав їй руку на талію. "Питай," — сказав, ведучи в повільному танці.\n\n"Чому ти залишився?"\n\n"У місті? Бо альтернатива — сидіти в гольф-клубі вічно. А ще — у цьому містечку є шарм. Тепер я маю питання до тебе: чому ти не вигнала нас?"
  nf_ruminators.30.a:0 "Далі буде..."

  nf_ruminators.31.t:0 "Танок з Дияволом. Частина II"
  nf_ruminators.31.d:0 ""Бо я..." — Єлизавета замовкла, зніяковіло опустивши очі. "Бо я хотіла, щоб усе це скінчилось."\n\n"М-м," — клікнув язиком Арчі. "Ти маєш на увазі наші... шоу?"\n\n"Так. Я не вірила, що ти — безнадійний."\n\nАрчі розсміявся. "Тобто, я щосуботи вбивав когось для розваги, а ти вирішила перевірити, чи мене ще можна врятувати?"\n\nЄлизавета знітилась. "Так."\n\nАрчі зміряв її поглядом. "Це дуже мило." — він скосив губи. "А як щодо того хлопця?"\n\n"Сола," — поправила вона.\n\n"Так, про нього. Він, певно, не вірить у мене. Але ж ти слухаєш його поради, так?"\n\n"Так."\n\n"То чому маленька міс Єлизавета з Румінаторів не послухала найкращого друга — і дала шанс такому, як я?"\n\nВона довго мовчала, але потім випросталась. Ще нижча за нього, але з гідністю. "Бо кожен заслуговує другого шансу. Ми не обирали цей світ, але ми всі в ньому. І якщо хочемо, щоб він зцілився — маємо приймати тих, хто хоче стати кращим."\n\nАрчі кивнув, замислено зморщивши лоб. "Дуже гарно сказано. Але в мене ще одне питання..."
  nf_ruminators.31.a:0 "Далі буде..."

  nf_ruminators.32.t:0 "Танок з Дияволом. Частина III"
  nf_ruminators.32.d:0 "Посмішка Арчі повернулась, але очі стали втомленими. Він нахилився, прошепотів їй у вухо, дихання було гарячим. "А що, як я не хочу, щоб світ зцілився?" — прошепотів він, і з легким поклоном відійшов убік.\n\nЄлизавета стояла приголомшено, дивлячись, як він зникає в натовпі з руками за спиною."
  nf_ruminators.32.a:0 "Від цього не стає спокійніше."

  nf_ruminators.33.t:0 "Знахідка Сола"
  nf_ruminators.33.d:0 "Сол знав: довіряти Святим не можна. І хоча Єлизавета офіційно вірила в другий шанс — вона їм теж не довіряла. Втім, вона вказала їм користь сумніву, що їхня присутність тут є найбільшою доброчинністю за будь-яку іншу.\n\nТа Сол не купився. Особливо після того, як простежив за ними — не всі залишались у місті вночі. Він стежив, як ті заходили до старого складу МАНІФЕСТ біля струмка. Біля входу стояв охоронець.\n\nСол дивився з бінокля, прикусив губу. Охорона в дикому полі — поганий знак.\n\nВін підкрався, оглушив охоронця, і проник усередину. Те, що він побачив — змусило його завмерти.\n\nКоробка за коробкою — нашийники з вибухівкою. А питання на кшлталт "Звідки це взяли?" чи "Хто їм це дав?" одразу замінило одне: "Що мені тепер робити?"
  nf_ruminators.33.a:0 "Він мав попередити Єлизавету."
  nf_ruminators.33.b:0 "Він мав особисто поговорити з Арчі."

  nf_ruminators.34.t:0 "Запит Зігфри"
  nf_ruminators.34.d:0 "Старійшино,\n\nПісля деяких роздумів про Румінаторів, я хотіла б звернутися з проханням: дозвольте мені створити аванпост у Роузбаді задля подальшої співпраці.\n\nВони доброзичливі, і я вважаю, що тісний контакт піде нам лише на користь."
  nf_ruminators.34.a:0 "Візьми з собою людей і підтримуй зв'язок."
  nf_ruminators.34.b:0 "Залишимось осторонь."

  nf_ruminators.35.t:0 "Братство надсилає атташе до Роузбада"
  nf_ruminators.35.d:0 "Старійшина Патрокл з Братства Сталі направив паладина Зігфру як представника в Роузбад! Вона допомагатиме й стежитиме, щоб усе проходило як по маслу!"
  nf_ruminators.35.a:0 "Це партнерство обіцяє бути плідним!"

  nf_ruminators.36.t:0 "Радіоефір"
  nf_ruminators.36.d:0 "Привіт усім. Давненько я не робив таких звернень, не думаєте?\n\nНу, не будемо зволікати. Багато хто з вас знає, що я і мої Святі тусувалися в Роузбаді. Але, обміркувавши все... Здається, це місце просто не для нас. Воно надто... дружнє? Ні, є краще слово. Як щодо — нереальне? Пустка — навіть Монтана — це не те місце, де можна вижити на добрих намірах. Ви думаєте, Анклав буде радий і потисне Єлизаветі руку? Упевнений, що все, що там у Чикаго, просто її обожнює. І це ще не кажучи про дикунів у Вайомінгу чи броньованих чудовиськ із Форту Веріті.\n\nЦе просто нестабільно. Але не хвилюйтеся — Арчі дуже скоро все пояснить.\n\nОчікуйте на деталі. Па-па."
  nf_ruminators.36.a:0 "Недобра ознака..."

  nf_ruminators.37.t:0 "Попередження для Єлизавети"
  nf_ruminators.37.d:0 "Сол не зволікав. Як тільки він знайшов рабські нашийники, одразу побіг назад до Роузбаду ігноруючи всі вітання, просто щоб постукати в її двері.\n\nЧерез хвилину, заспана Єлизавета відчинила двері зі свічкою в руці. "О, привіт, Сол!" — сказала вона так бадьоро, як тільки могла. "Досить пізно для візиту, правда ж?"\n\nЙого пояснення було швидким і заплутаним, але вона встигала за суттю. Вона намагалася приховати сором і жах, але легке тремтіння сумніву сказало Солу все, що потрібно.\n\nВін поклав руку їй на плече. "Я можу цим зайнятися, якщо хочеш."\n\nВона кивнула. "Будь ласка. Я..." — вона прикусила губу. "Господи. Не можу повірити в це."\n\nЯкби це був хтось інший, його слова були б простими: Я ж тобі казав.
  nf_ruminators.37.a:0 "Далі буде..."

  nf_ruminators.38.t:0 "Протистояння з Арчі. Частина I"
  nf_ruminators.38.d:0 "Після того, як йому дозволили жити в місті, Арчі оселився у гарному відремонтованому будинку, "викупленому" у колишнього мешканця (хоча Сол у цьому сумнівався). Сол вагається: вламуватись чи діяти офіційно? Але обережність — насамперед. Спочатку слід оцінити ситуацію.\n\nВін постукав у двері. Тиша.\n\nВже почали з'являтись сумніви, але двері все таки відчинились. Арчі стояв у звичному діловому вбранні. "Містер Еверетт," — усміхнувся він, — "чому завдячую опівнічному гостю?"\n\nСол зібрався. "Я хочу з тобою поговорити."\n\nАрчі підняв брову. "Ти хочеш поговорити зі мною? Вперше, еге ж?"\n\nСол стримав лють. "Що тобі подобається в цьому місті?"\n\nАрчі зробив вигляд, що замислився. "Хм. Хороше питання... Багато чого. Тут є енергія, якої ніде більше не знайдеш. Тут затишно. Святкування, люди — усе прекрасно."
  nf_ruminators.38.a:0 "Далі буде..."

  nf_ruminators.39.t:0 "Протистояння з Арчі. Частина II"
  nf_ruminators.39.d:0 "Брови Сола насупились. "Але чому ти тут? Ти раніше ніколи не виявляв інтересу."\n\nАрчі закотив очі. "Звісно, не виявляв. Ви всі — неживі з вигляду."\n\nОчі Сола розширилися. "Перепрошую?"\n\n"Я знаю, що ти знаєш, що я маю на увазі. Я бачив це в тобі щоразу, коли ти говорив із нею. Ти думаєш, що вона — дитина, яка не розуміє, у що вляпалася. І ти маєш рацію. Пустка — не місце для мрійників."\n\n"До суті."\n\n"Так, так... Сформулюю якнайпростіше, містере Еверетт: нам всім час для старої доброї перевірки реальністю." — він нахилився на дверний косяк. "Побачимось на наступному святі, га?"
  nf_ruminators.39.a:0 "Далі буде..."

  nf_ruminators.40.t:0 "Протистояння з Арчі. Частина III"
  nf_ruminators.40.d:0 "Арчі був загрозою. Сол казав це від самого початку. А ці нашийники — остаточне підтвердження. Йому не подобалося діяти за спиною Лізи, але це вже не можна було ігнорувати. Вона зрозуміє. Мусить. Особливо після того, що він покаже їй про Святих.\n\nСол подивився на Арчі, що стояв у дверях із самовдоволеною посмішкою.\n\n"Ні, думаю, не треба."\n\nДо того, як усмішка зійшла з його обличчя, ніж Сола вже був у горлі Арчі. Той упав на коліна, кров хлинула з рани. Сол опустився навколішки поруч, повільно витягуючи ніж, перерізаючи кожну артерію.\n\nАрчі намагався щось сказати, але тільки хрипів. Жалюгідне видовище. Коли Арчі впав, Сол підвівся і подивився на мертвого ватажка рейдерів.\n\n"Ось тобі твоя реальність."\n\nСол пішов, знаючи, що тепер Ліза буде у безпеці. І без жодного звуку, страшний Алумнус Арчі помер у калюжі власної крові."
  nf_ruminators.40.a:0 "Так гине чудовисько."

  nf_ruminators.41.t:0 "Чудовисько із замістя. Частина I"
  nf_ruminators.41.d:0 "Сол дивився на гольф-клуб крізь бінокль, рахуючи охоронців. Інші Світлячки чекали на сигнал, їхні Біофлаї гуділи в ліхтарях.\n\nМахом руки він випустив Флаїв — яскраві, блимаючі потоки світили над охороною. Ті, не очікуючи нападу, кинулись тікати, і Світлячки увійшли до будівлі.\n\nКоридори клубу були дивовижно чисті як для рейдерської бази. Древнє світло миготіло, кидаючи тіні. Сол знав — більшість спить, а килими приглушують звук.\n\nВін вів групу повільно, стежачи за розтяжками й гранатами. Кілька рейдерів на патрулі були безшумно ліквідовані ножами.\n\nВони наближались до головної цілі — кімнати Арчі."
  nf_ruminators.41.a:0 "Далі буде..."

  nf_ruminators.42.t:0 "Чудовисько із замістя. Частина II"
  nf_ruminators.42.d:0 "Сол обережно прочинив двері — старі петлі скрипнули. Один зі Світлячків рушив уперед — і впав, коли пролунала куля.\n\nАрчі реготав, його голос лунав у вухах Сола. Кулі сипалися з кімнати, супроводжувані знущаннями.\n\nСол більше не міг терпіти. Не Арчі. Не ці погрози. Не цей клуб. Дочекавшись, поки обойма спорожніє, Сол виглянув і побачив Арчі, що намагався перезарядитися.\n\nШвидко, мов за інстинктом, Сол підняв гвинтівку — і пострілом покінчив із заміським Чудовиськом."
  nf_ruminators.42.a:0 "Нарешті ми в безпеці."

  nf_ruminators.43.t:0 "Час Усміхнутись"
  nf_ruminators.43.d:0 "Єлизавета спостерігала, як сонце сідає за пагорб. Помаранчеве світло заливало все навколо. Це був спокій. Кожного вечора вона посміхалась — навіть у скруті. А зараз часи були важкі. Сол із Світлячками ще не повернулись, і вона місця собі не знаходила.\n\nКоли Сол розповів про нашийники — вона почувалася найбільшою дурепою в Пустці. Їй стільки разів казали, але вона вірила у добро. Сол завжди казав: вона надто наївна. Але вона просто хотіла зробити світ трохи кращим.\n\nРаптом — дотик на плечі. Вона озирнулась — Сол. Його зазвичай суворе обличчя усміхалось. Вона кинулася в обійми. Все. Монстр мертвий. Місто — врятоване.\n\nВони стояли, дивлячись, як останні сонячні промені зникають. Наступила ніч. І поряд із тим, хто був з нею від самого початку, Єлизавета знала — воно було того варте."
  nf_ruminators.43.a:0 "Нарешті час посміхнутись."

  nf_ruminators.44.t:0 "Половина Усмішки"
  nf_ruminators.44.d:0 "Єлизавета метушилась у залі, вже вп’яте все перевіряючи. Вона любила організовувати ці святкування, хоч і зусиль це коштувало чимало. Музика, світло, напої, закуски — все стояло на своїх місцях.\n\nТак метушилася, що ледве не збила Сола. Вибачаючись, запитала, де він був увесь день.\n\n"Я навідався до Арчі. Не хвилюйся, Лізо."\n\n"О! То він таки передумав? Його останній ефір звучав, ніби його не буде. Ти його переконав?"\n\nСол подивився на її обличчя, повне надії. Він не міг сказати їй правду. Вона заслуговувала кращого. Краще солодка брехня, ніж болісна правда. Він посміхнувся наполовину.\n\n"Ні. Він сказав, що вони з Святими планують піти. Більше ми їх не побачимо. То, потрібна допомога з чимось?"\n\nЇї усмішка трохи зів’яла, але швидко повернулась. Вона дала йому завдання — ще багато роботи попереду."
  nf_ruminators.44.a:0 "Справ і справді вистачає."

  nf_ruminators.45.t:0 "Надія на Найкраще"
  nf_ruminators.45.d:0 "Сьогодні вранці група Румінаторів прибула до наших земель, несучи ліки та великі надії. Вони розмовляли з нашими людьми, намагаючись переконати знайти мирне вирішення конфлікту з [MCA.GetName], але їхні лідери не захотіли слухати. Тим не менш, гості були приємними, а дари — вдячно прийняті."
  nf_ruminators.45.a:0 "Можливо, все ще стане краще."

  nf_ruminators.46.t:0 "Святі Розпалюють Війну!"
  nf_ruminators.46.d:0 "Чутки ширились від вустів до вустів — і зрештою дійшли до Єлизавети. Святі, по суті, розпочали війну. Вони проникли на територію Північних Ханів і вирізали одне з поселень. Жорстоко. За словами свідків — справжнє шоу. Єлизавету нудило. Вона ввічливо зупинила опис подій, почувши достатньо.\n\nВже точилися бої в лісах, дим здіймався на обрії. А на радіо Арчі зберігав незвичну тишу.\n\nЄлизавета негайно направила Румінаторів дізнатись більше. Останнє, чого вона хотіла — повномасштабна війна. А ще гірше — втягнення Румінаторів у все це."
  nf_ruminators.46.a:0 "Хіба ми можемо щось зробити?"

  nf_ruminators.47.t:0 "Святі Відступили"
  nf_ruminators.47.d:0 "Бої на кордоні між Ханами і Святими нарешті припинились. Святі залишили Ліси, а Хани не стали переслідувати. Арчі мовчав в ефірі, але звістка дійшла до Румінаторів: Святі були знищені.\n\nЄлизавета й її народ зітхнули з полегшенням. Це було кровопролитніше, ніж вони сподівались. Але ніхто не міг сказати, що Святі цього не заслуговували. Дехто, мовчки, сподівався, що це стане уроком для тих, хто залишився. Але головне — все скінчилося."
  nf_ruminators.47.a:0 "Тепер буде спокій, так?"

  ################
  ### Focus
  ################

  bth_the_stretch:0 "Стретч"
  bth_the_stretch_desc:0 "Місце вдалині від турбот цього світу."

  bth_the_fireflies:0 "Світлячки"
  bth_the_fireflies_desc:0 "Часи змінювалися, і Паркові Рейнджери разом із ними."

  bth_the_saints:0 "Святі"
  bth_the_saints_desc:0 "Все було весело та грайливо... До одного моменту."

  bth_the_ruminators:0 "Румінатори"
  bth_the_ruminators_desc:0 "Неважливо, хто ти і де опинився — надія завжди є... Навіть якщо вона захована глибоко. Усе, що потрібно — трішки підбадьорення."

  bth_the_cult_of_liberty:0 "Культ Свободи"
  bth_the_cult_of_liberty_desc:0 "Культ поклоняється ангелу на ім’я Америка, але, схоже, зовсім не розуміє, чим насправді була ця Америка. Вони жадають відплати й живляться люттю — однак, поки вони в Роузбаді, можливо, нам вдасться змінити їхній шлях?"

  bth_american_churches:0 "Американські церкви"
  bth_american_churches_desc:0 "Присутність Культу Свободи в Монтані незаперечна, а їхні так звані «церкви» — насправді виробничі цехи й стрільбища. Та поки що вони нікому відкрито не шкодять. Можливо, ми зможемо почати трохи приглядати за ними?"

  bth_a_symbol_of_her_faith:0 "Символ Її віри"
  bth_a_symbol_of_her_faith_desc:0 "Ріанна Робертсон — душа зранена сумнівами й трагедіями. Ми можемо зробити для неї багато — якщо знайдемо на це час..."

  bth_listen_to_rhianna:0 "Дарунки Америки"
  bth_listen_to_rhianna_desc:0 "Потрібна зброя? Не хвилюйся! Ріанна Робертсон дасть тобі саме те, що потрібно. Треба лише попросити!"

  bth_the_works_of_america:0 "Твори Америки"
  bth_the_works_of_america_desc:0 "Культ Свободи знає свою справу, і після нашої допомоги радо поділиться надлишками ресурсів для наших потреб."

  bth_marshalls_and_tribals:0 "Історія двох бід"
  bth_marshalls_and_tribals_desc:0 "Чотири Отці здавна правили горою Рашмор, втручаючись у події лише згідно з ритуальним розкладом. Але конфлікт із Маршалл на півдні призвів до втрати їхніх священних земель — тепер вони під контролем Республіки.\n\nРеспубліка не шукає конфлікту, але історія не дає їм поступитися. Усе, що ми можемо — побажати обом сторонам удачі й допомогти, чим зможемо."

  bth_what_the_saints_do:0 "Святі знову налашкодили?!"
  bth_what_the_saints_do_desc:0 "Святі влізли у кривавий конфлікт із тими Ханами через пагорб. І здається, заслужено. Але в цьому можуть постраждати невинні. А мир завжди краще за війну! Єлизавета вже береться до справи!"

  bth_investigate_montana_chapter:0 "Нові прибульці на північному сході"
  bth_investigate_montana_chapter_desc:0 "Дирижаблі пролітали над Монтаною пізно вночі — куди вони прямували? Хто на борту? Час дізнатися!"

  bth_historians_arrive_in_rosebud:0 "Історики прибувають до Роузбаду"
  bth_historians_arrive_in_rosebud_desc:0 "Про Румінаторів ширяться чутки, мов пісня на вітрі — і однодумці з інших країв шлють свої найкращі побажання."

  bth_helping_hands_from_historians:0 "Допоміжні руки"
  bth_helping_hands_from_historians_desc:0 "Історики радо допомагають нам запустити систему виробництва та організувати робочі місця. Якщо ми дослухаємось до них — усе обов’язково окупиться."

  bth_ruminator_radio:0 "Радіо румінаторів"
  bth_ruminator_radio_desc:0 "Історики хочуть допомогти нам поширити вчення Румінаторів Монтаною та за її межі — але ми маємо добре подумати, що саме будемо транслювати! Давайте налаштуємо систему і визначимось із повідомленням."

  bth_two_movements_happily_intertwined:0 "Два рухи — щасливо переплетені"
  bth_two_movements_happily_intertwined_desc:0 "Поєднання вчень Істориків із нашим життєствердним настроєм дало неймовірні результати. Хто знає, до чого це призведе далі?"

  bth_approach_saints:0 "Поговорити зі Святими"
  bth_approach_saints_desc:0 "Джексони стають дедалі зухвалішими — можливо, Святі зможуть допомогти? Вони ж також у небезпеці..."

  bth_looking_ahead:0 "Погляд уперед"
  bth_looking_ahead_desc:0 "Джексонів більше нема, але всі питають — що далі? А якщо знову нападуть? Як ми будемо захищатись? Нам потрібна відповідь... Але чи готова я її дати?"

  bth_reach_out_to_yellowstone:0 "Дотягнутися до Єллоустоуна"
  bth_reach_out_to_yellowstone_desc:0 "Люди в Єллоустонському парку довгий час жили в мирі. Я завжди хотіла їх відвідати... Можливо, вони будуть раді нас побачити?"

  bth_time_to_say_hi:0 "Скажемо сусідам привіт"
  bth_time_to_say_hi_desc:0 "По той бік хребта щойно оселилися новенькі — називають себе Хани. Виглядають суворо, але серце у них на місці. Ми маємо сказати їм привіт — і захопити кілька примірників "Румінації до багатства""!"

  bth_a_place_for_everyone:0 "Кожен заслуговує на дім"
  bth_a_place_for_everyone_desc:0 "Пустка може бути жорстокою — але ми такими бути не повинні. Ми дамо чітко зрозуміти: наші землі відкриті для кожного, хто готовий ставитися до інших з повагою."

bth_khans_refugees: "Знищені вже занадто багато разів"
bth_khans_refugees_desc: "Хани прийшли до Вайомінгу в пошуках провидіння — а натомість зустріли визволення. Дехто з них може бути непокірним, але це не означає, що вони не заслуговують на місце, де можна залишитися!"

  bth_metalmouths_refugees:0 "Сила металу"
  bth_metalmouths_refugees_desc:0 "Сталевий Джо не зміг урятувати свою банду від знищення. Металеві Пащі довго були джерелом головного болю для нас — але вони зникають, і їх лишилось обмаль. То чому б не дати їм другий шанс?"

  bth_havre_refugees:0 "Земля вигнанців"
  bth_havre_refugees_desc:0 "Культ Свободи й Гільдія Злодіїв зробили Гавр прихистком для бунтарів — достатньо далеко від Макартура, щоби не бути рейдерами, і трохи поза межами Пристанища, щоби уникати сутичок. Здається, їхня вдача скінчилась, і вигнанцям потрібен новий дім. Хоча, можливо, їм варто опанувати інші ремесла, ха-ха!"

  bth_macarthur_refugees:0 "У землі вільних"
  bth_macarthur_refugees_desc:0 "Макартур завжди був оповитий тривожними міфами — фортеця в горах, де Перші Родини й Анклав ведуть свої ігрища, далеко від сторонніх очей. Але здається, цьому настав кінець, і багато з них шукають безпечного притулку."

  bth_jacksons_refugees:0 "Останні Джексони"
  bth_jacksons_refugees_desc:0 "Джексони намагались нас убити, але вони ніколи не хотіли опинитись у цій ситуації. Їх ніхто не прагнув вигнати. Якщо ми зможемо дати їм відчуття приналежності... Можливо, ще не все втрачено для цієї родини."

  bth_brotherhood_refugees:0 "Ахіллесова п'ята"
  bth_brotherhood_refugees_desc:0 "Монтанське Братство, попри всю свою гучність і блиск, впало, мов цегла у м’який вітер Монтани. Простягнімо їм руку допомоги!"

  bth_yellowstone_refugees:0 "Промах Гефеста"
  bth_yellowstone_refugees_desc:0 "Люди з Єллоустона завжди були добрими до інших. Хоч вони й втратили свій парк, це не означає, що вони мають втратити своє серце."

  bth_marshall_refugees:0 "Найкращі з Республіки"
  bth_marshall_refugees_desc:0 "Республіка Маршалл завжди була оплотом порядних людей — тих, хто просто хотів кращого світу. Вони можуть змінити наш світ на краще, якщо захочуть."

  bth_four_fathers_refugees:0 "Отців Більше Немає"
  bth_four_fathers_refugees_desc:0 "Вони просто хотіли повернутись додому. Це вже не те саме, але ми можемо запропонувати їм дім тут."

  bth_our_way_forward:0 "Світ не може існувати без добра"
  bth_our_way_forward_desc:0 "Якщо народ не здатен сам себе захистити — він не народ, а лишень душі, що блукають світом без мети. Нам потрібно змінитися... Або хоча б зайняти чітку позицію."

  bth_listen_to_the_fireflies:0 "Прислухатись до Світлячків"
  bth_listen_to_the_fireflies_desc:0 "Сол — палкий дух, але знає бій і людей краще за всіх місцевих. Ми дослухаємось до нього — і подивимось, чого він нас навчить."

  bth_scavenging_jacksons_equipment:0 "Збір обладнання Джексонів"
  bth_scavenging_jacksons_equipment_desc:0 "Сол особливо цінує спорядження — він вважає, що навички важливіші за кількість. Тому він запропонував зібрати все можливе з колишніх запасів Джексонів."

  bth_teachings_of_the_fireflies:0 "Як летять справжні Світлячки"
  bth_teachings_of_the_fireflies_desc:0 "Світлячки давно були охоронцями цієї землі — тож чому б не дати їм показати, як вони це робили всі ці роки?"

  bth_rifle_acquisitions:0 "Мастити гвинтівки"
  bth_rifle_acquisitions_desc:0 "«Половина трюку — це рушниця. Інша половина — знати, куди стріляти.» — Сол А. Еверетт"

  bth_old_park_ranger_tricks:0 "Старі хитрощі рейнджерів"
  bth_old_park_ranger_tricks_desc:0 "Світлячки колись були лісовими рейнджерами — і це видно з їхніх знань про місцевість, переданих поколіннями. Вони покажуть нам, які рослини використовувати, а яких уникати в польовій медицині."

  bth_reduce_reuse_recycle:0 "Знай свого ворога й землю, по якій він ходить"
  bth_reduce_reuse_recycle_desc:0 "Джексони роками вдосконалювали своє штурмове спорядження у пошуках помсти. Тепер Світлячки можуть використати його, щоб захищати людей — і, можливо, запобігти новим нападникам."

  bth_we_are_ruminators:0 "Ми — Румінатори"
  bth_we_are_ruminators_desc:0 "Ми не воїни — і ніколи ними не були. Це не мета нашого руху. Якщо ми почнемо воювати — ми втратимо те, ким є. Ми маємо зосередитися на покращенні життя людей."

  bth_we_support_people:0 "Запаси медикаментів"
  bth_we_support_people_desc:0 "У нас — склади медикаментів, які чекають на перевірку. Затвердимо те, що ще працює, і позбудемось простроченого. Господи, як же нам потрібна ця допомога!"

  bth_we_need_to_know:0 "Лише за потреби"
  bth_we_need_to_know_desc:0 "З усім, що сталося в Монтані — і ще станеться — нам треба бути готовими. Чи в медицині, чи в розпізнаванні загроз до того, як вони з’являться. Ми маємо знати завчасно."

  bth_service_with_a_smile:0 "Служба з Усмішкою"
  bth_service_with_a_smile_desc:0 "Наша доброзичливість і відданість ненасильству притягує до нас чимало хороших людей. Ми приймемо їх у наш рух з розкритими обіймами!"

  bth_we_can_do_it:0 "Ми зможемо!"
  bth_we_can_do_it_desc:0 "Який сенс у русі, якщо ми не покращуємо життя? Давайте будувати справжні будинки — такі, як у старих буклетах. Якщо ми дамо людям дім, гідний їхнього часу, ми ніколи їх не втратимо!"

  bth_build_a_house:0 "Ми так старанно будували цей маленький дім разом"
  bth_build_a_house_desc:0 "Якщо дати людині роботу й зарплатню — вона віддасть вам не тільки руки, а й серце."

  bth_listen_to_siegfra:0 "Звернення до Зіґфри"
  bth_listen_to_siegfra_desc:0 "Зіґфра — а через неї й Монтанське Братство — допомагала нам із самого початку, просячи лише техніку та знахідки. Можливо, звернення до неї зміцнить наше майбутнє?"

  bth_the_machine_depot:0 "Старе машинне депо"
  bth_the_machine_depot_desc:0 "Ми роками залишали цей депо порожнім — але після нашої співпраці, Зіґфра зацікавилася його обладнанням. Ми можемо влаштувати маленьку експедицію й допомогти їй!"

  bth_a_gift:0 "Така собі любов по-Середньозахідному"
  bth_a_gift_desc:0 "Зіґфра відгукнулась на наше прохання й почала тренувати частину Румінаторів у стилі Братства. Можливо, лицарів і писарів у нас буде більше, ніж ми думали?"

  bth_working_with_what_we_have:0 "Працюємо з тим, що маємо"
  bth_working_with_what_we_have_desc:0 "Монтанське відділення Братства сталі має обмежені можливості зростання, особливо за короткий термін. Ми можемо допомогти — але наші ресурси також не безкінечні."

  bth_finalizing_trade:0 "Остаточне затвердження торгівлі"
  bth_finalizing_trade_desc:0 "Завдяки співпраці ми змогли оптимізувати частину виробництва на благо обох сторін. Передаймо їм добрі новини!"

  bth_trust_in_patrocolus:0 "Довіритися Патроклу"
  bth_trust_in_patrocolus_desc:0 "Патрокл був із нами весь цей час — доглядав за Зіґфрою і нами. Найменше, що ми можемо — відповісти взаємністю й приєднатися до Братства Сталі."

  bth_our_future_secured:0 "Наше майбутнє забезпечене"
  bth_our_future_secured_desc:0 "З нашою військовою політикою визначеною, ми можемо знову звернути увагу на світ навколо."

  bth_employment_programs:0 "Програми зайнятості Монтани"
  bth_employment_programs_desc:0 "Ми відкриємо набір по всій Монтані — кожен заслуговує на гідну роботу!"

  bth_reopen_the_scrapyard:0 "Відкрити Звалище"
  bth_reopen_the_scrapyard_desc:0 "Недалеко від міста є старе звалище. Ми можемо 'переобладнати' його в... Збиральню? Це слово підходить? А, нехай люди самі назвуть, як хочуть."

  bth_invite_companies:0 "Запросити компанії до нашого пісочника"
  bth_invite_companies_desc:0 "По всій Монтані є маленькі компанії — і в безпечних місцях, і в небезпечних. Давайте дамо їм шанс на розвиток у гідному середовищі!"

  bth_eager_volunteers:0 "Готові добровольці"
  bth_eager_volunteers_desc:0 "Так багато людей по всій Монтані хочуть допомогти нашому руху."

  bth_the_first_new_school:0 "Перша нова школа"
  bth_the_first_new_school_desc:0 "Ми відкриємо першу нову школу в Монтані з... вічності. Принаймні першу, якою не керує Анклав."

  bth_quality_teachers:0 "Якісні вчителі"
  bth_quality_teachers_desc:0 "Яка користь з наших шкіл без класових спеціалістів? Ми маємо забезпечити якісну освіту на благо всіх!"

  bth_elizaveta_gives_a_speech:0 "Виступ Єлизавети"
  bth_elizaveta_gives_a_speech_desc:0 "Присутній лідер — добрий лідер. Побачити свій народ на власні очі, говорити до них особисто — найважливіше для згуртованого руху."

  bth_we_believe_in_the_world:0 "Ми віримо в світ"
  bth_we_believe_in_the_world_desc:0 "Коли наше майбутнє стало хоч трохи визначеним, ми можемо дивитись далі. Настав час зібрати найкращих із краю та спробувати створити справжню, дружню спільноту."

  bth_community_presence:0 "Відчуття спільноти"
  bth_community_presence_desc:0 "Гордість за своє місто, участь у подіях — ось що має значення. Якщо серце людей у справі — то й руки, і розум також."

  bth_repairing_the_water_pump:0 "Полагодити водяний насос"
  bth_repairing_the_water_pump_desc:0 "Насос за містом давно зламаний після одного з рейдів Джексонів. Полагодити його — чудовий крок до підвищення якості життя!"

  bth_rosebud_development:0 "Розвиток Роузбада"
  bth_rosebud_development_desc:0 "Ми ніколи не були надто охайними — та й саме містечко не вирізнялося порядком до того, як ми оселились тут. Прибирання відкриє шлях до нових можливостей будівництва!"

  bth_frontier_development:0 "Розвиток Рубежу"
  bth_frontier_development_desc:0 "У нас так багато землі для найрізноманітніших справ, але так мало місця, яке ми дійсно можемо використати! Зі всіма змінами навколо нам потрібен простір для зростання!"

  bth_invite_marshall_republic:0 "Запросити Республіку Маршалл"
  bth_invite_marshall_republic_desc:0 "Вільні Штати були анархістами, які знали, що ядерна війна неминуча. Тепер вони стали оплотом цивілізації й розуму у Вайомінгу — чому б не зробити крок у майбутнє разом?"

  bth_invite_amgalan_khans:0 "Запросити Вільних Ханів"
  bth_invite_amgalan_khans_desc:0 "Амгалан і його «Послідовники Апокаліпсису» поділяють наше бачення світу й наші сподівання. Разом ми можемо досягти неймовірного!"

  bth_invite_montana_chapter:0 "Запросити Сестер Сталі"
  bth_invite_montana_chapter_desc:0 "Сестри Сталі прагнули вшанувати своє коріння й жити без страху. Ми теж цього хочемо."

  bth_invite_highland_watch:0 "Запросити Високогірну Варту"
  bth_invite_highland_watch_desc:0 "Про Високогірну Варту завжди згадували в старих західних баладах і піснях. Тепер, коли вони поруч, ми можемо протягнути руку дружби."

  bth_a_conversation_with_archie:0 "Джемборі"
  bth_a_conversation_with_archie_desc:0 "Свято час від часу — чудовий спосіб підняти настрій людям. Хто ж не любить гарну нагоду для спільного столу й скверденсу?"

  bth_much_ado_about_saints:0 "Що замишляють святі?"
  bth_much_ado_about_saints_desc:0 "Сол вже давно приглядається до Святих. І хоча вони, можливо, змогли обдурити Єлизавету, він відчуває — щось тут не так..."

  bth_how_saints_roll:0 "Альмус"
  bth_how_saints_roll_desc:0 "Святі ніколи не були добрими людьми. Але чи хочуть вони такими стати?..."

  bth_protect_our_shipments:0 "Захистити нашу мережу"
  bth_protect_our_shipments_desc:0 "Через нещодавні напади на наше постачання, варто інвестувати в належну охорону."

  bth_tracing_the_shipments:0 "Виїзд Сола"
  bth_tracing_the_shipments_desc:0 "Сол діє згідно з відкриттям, хоча й невпевнено..."

  bth_fate_of_the_ruminators:0 "Надія нового світу"
  bth_fate_of_the_ruminators_desc:0 "Ті, хто хочуть пожинати благословення свободи, мають, як і всі люди, пройти крізь втому, що супроводжує її захист. — Томас Пейн"
