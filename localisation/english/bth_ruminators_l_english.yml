  bth_firefly_expertise:0 "Захист Світлячків"
  bth_firefly_expertise_desc:0 "Світлячки - усамітнена група нічних мисливців, що походить від довоєнних рейнджерів національного парку. На чолі з наглядачем Роуен, «Світлячки» розвинули свій мисливський досвід і культуру полювання навколо Біофлаїв; світлячків, що мутували через вплив радіації комети, яка впала на територію парку. Кожен світлячок має спеціальний ліхтар, який використовує Біофлаїв як джерело світла. Крім того, світлячки наносять на себе репелент із запахом лаванди, щоб запобігти прилипанню Біофлаїв до них. \n\nПротягом багатьох років вони охороняли зовнішні землі - незалежно від того, чи знають про це їхні мешканці, чи ні."
