april.1.t:0 "Інопланетяни!"
april.1.d:0 "Нашим технікам нарешті вдалося проникнути в найглибші глибини Зони 51, де чекала найцінніша з усіх технологій. Глибоко всередині того заплутаного лабіринту коридорів, ангарів і забутих лабораторій руху знаходилися численні інопланетні винищувачі. Поруч із ними стояли гори ящиків із незрозумілими інопланетними об'єктами — деталями кораблів і артефактами, для нас незбагненними.\n\nБагато з наших людей одразу кинулися нишпорити в тих ящиках у пошуках чогось корисного: зброї, пального, хоч чого-небудь, що допоможе в наступному рейді. Якби ж ми ніколи не відкривали ті двері… Якийсь псих-нарик, мабуть, випадково активував якийсь інопланетний маяк. Тоді ми ще цього не знали — тепер знаємо. Нічне небо палало синім полум’ям двигунів і енергетичними променями, що збивали наших винищувачів один за одним. Високо-високо над нами зоряне полотно закрила гігантська тінь на орбіті."
april.1.a:0 "Що ж ми наробили…"

april_news.1.t:0 "Дивні Вогні Над Озером Грум"
april_news.1.d:0 "Ви слухаєте Радіо Нью-Вегас — ваше звукове оазис посеред пустелі. Я — Містер Нью-Вегас, і я маю добре передчуття щодо всіх вас, хто зараз налаштований. Якщо ви\nлюбите новини — наступний сюжет саме для вас. Сумнозвісна\nгрупа рейдерів, що базується в районі Зони 51, повністю зникла після дивного світлового шоу в небі над їхнім сховищем. Свідки повідомляють про блакитні спалахи енергії, що розтинали небо, за якими слідували вибухи і віддалені крики. Один зі свідків навіть бачив маленьких зелених чоловічків. Що б це не було — я б на вашому місці туди не ліз.\n\nЦе була наша головна новина. А тепер — класика, тільки для вас, не перемикайтесь."
april_news.1.a:0 "Дикий цей пустош, ой дикий..."
