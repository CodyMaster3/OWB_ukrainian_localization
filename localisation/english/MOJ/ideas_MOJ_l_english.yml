moj_rumors_of_the_sierra_madre:0 "Чутки про Сьєрра-Мадре"
moj_rumors_of_the_sierra_madre_desc:0 "Дослідження Елайджі в комплексі Y-0 у Великих Горах викликали у нього інтерес до молекулярної збиральної технології, що вивчалась там. Здається, вона захована десь у місці під назвою «Сьєрра-Мадре»."

moj_helping_the_brights_launch:0 "Допомогти Відправленню Брайтів"
moj_helping_the_brights_launch_desc:0 "Вероніка пообіцяла послідовникам Брайта допомогти з запуском, якщо ті допоможуть нам у боротьбі проти НКР. Тепер, коли вони виконали свою частину, настав наш час виконати свою."

moj_hunting_for_stars:0 "У Пошуках Зірок"
moj_hunting_for_stars_desc:0 "Вероніка пообіцяла тим, хто збирав Зіркові Кришечки, допомогти з пошуком цих артефактів у Мохаве в обмін на допомогу проти НКР."

