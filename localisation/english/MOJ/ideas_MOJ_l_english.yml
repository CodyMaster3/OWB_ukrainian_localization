moj_platinumOS:0 "Платинова Мікросхема"
moj_platinumOS_desc:0 "Найцінніший скарб Містера Хауза – Платинова Мікросхема – тепер у наших руках. Ми можемо дослідити її схеми та спробувати розшифрувати початковий код технології сек’юритронів."

mojave_riches_of_the_sierra_madre:0 "Багатства Сьєрра-Мадре"
mojave_riches_of_the_sierra_madre_desc:0 "Ця держава володіє одним із найбільших золотих запасів у Пустці, отримавши доступ до скарбниці Сьєрра-Мадре."

