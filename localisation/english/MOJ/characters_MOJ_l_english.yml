l_english:
 MOJ_veronica_santangelo:0 "Вероніка Сантанжело"

 MOJ_edgar_hardin_army_chief:0 "Головний Паладин Едгар Гардін є членом Братства Сталі пустки Мохаве, він демонструє божественну відданість Братству. Він відомий своїм безкомпромісним підходом та принципом давати кожному шанс проявити себе і стати кращим."
 MOJ_edgar_hardin_army_desc:0 "§GОсобова справа — Гардін, Едгар§!\n§YЗвання:§! §gПаладин§!\n\nЗ усього, що я міг би сказати про Паладина Гардіна, мабуть, найщирішою похвалою буде те, що він принаймні відданий. Звісно, не мені, він дає це чітко зрозуміти кожною уїдливою ремаркою про моє писарське минуле, коли думає, що я не чую. Радше він відданий Братству та його кодексу.\n\nО, цей кодекс. Якби не він, гадаю, Паладин Гардін взагалі б нічого не казав. З огляду на те, що єдині слова, які злітають з його вуст, зазвичай лунають лише для того, щоб послатися на священні тексти щодо того, як діяти. Він не з тих, хто мислить масштабно.\n\nЗвісно, коли я наказую йому перетворити будь-яких чужинців на попіл, кодекс раптом стирається з його пам'яті. Це єдиний час, коли я можу його терпіти — коли він стуляє пельку і виконує мій наказ."
 MOJ_PALADIN_RAMOS_NAME:0 "Паладин Рамос"
 MOJ_paladin_Ramos_Desc:0 "§GОсобова справа — Рамос, Мігель§!\n§YЗвання:§! §gПаладин§!\n\nЯкщо Паладин Рамос і має якісь заперечення щодо моєї політики чи наказів, він нікому про це не каже. Я ціную це — таку обачність. Як наслідок, я завжди особисто схвалюю будь-які його запити чи запропоновані ним 'заходи безпеки'.\n\nЯ міг би використати його, якби мені знадобилося когось — чи щось — 'замкнути'."
 MOJ_paladin_ramos_army_chief:0 "Паладин Рамос давно служить Братству як голова служби безпеки Відділення Мохаве. Він не знає нічого, окрім відданості справі та ідеалам Братства."

 MOJ_PALADIN_SATO_NAME:0 "Паладин Сато"
 MOJ_Paladin_Sato_Desc:0 "§GОсобова справа — Сато, Девін§!\n§YЗвання:§! §gПаладин§!\n\nХоча мені цього ніколи не підтверджували, я підозрюю, що Паладин Сато сам зголосився до цієї експедиції, а не був призначений. Він виконує накази до останньої літери і є експертом з ремонту обладнання в польових умовах, але Паладин Сато здається досить відлюдькуватим. Згідно з моїми звітами, Сато буває собою лише поза бункером.\n\nЯ підозрюю клаустрофобію, що дуже прикро з причин, які будь-хто, хто читає це, зможе зрозуміти у журналі записів Братства. Проте, я буду йти йому назустріч, поки він залишається ефективним."
 MOJ_paladin_sato_high_command:0 "Паладин Сато є давнім членом Братства. Він пройшов шлях до паладина і зараз вважається експертом у всьому, що стосується зброї."

 MOJ_PALADIN_FAIRBANKS_NAME:0 "Паладин Фербенкс"
 MOJ_Paladin_Fairbanks_Desc:0 "§GОсобова справа — Фербенкс, Гел§!\n§YЗвання:§! §gПаладин§!\n\nПаладин Фербенкс — ще один молодий дурень, який відчайдушно прагне проявити себе. Одне обличчя з сотень з однаковою історією. Я вважаю його вкрай нічим не примітним, незважаючи на його бажання довести протилежне. Однак він досить впертий. Там, де інші Паладини зупинилися б перед місією, що здавалася майже самогубною, Фербенкс кидався стрімголов у небезпеку і часто приносив адекватні результати.\n\nЧи справді він 'видатний'? Можливо. Але для мене він радше корисний ідіот. З Фербенксом усе, що вам потрібно — це вказати йому напрямок, і більше нічого."

 MOJ_KNIGHT_TORRES_NAME:0 "Лицар Торрес"
 MOJ_Knight_Torres_Desc:0 "§GОсобова справа — Торрес, Елейн§!\n§YЗвання:§! §gЛицар§!\nЛицар Торрес не становить великої ваги ні для мене, ні для моєї роботи, але вона цінний логіст у наших бункерах. Я не заздрю тим, хто має просте, але неймовірно нудне завдання підтримувати порядок у нашому відділенні. За це я їй вдячний.\n"

 MOJ_SCOUT_SIERRA_NAME:0 "Розвідник Сьєрра"
 MOJ_Scout_Sierra_Desc:0 "§GОсобова справа — Сьєрра, Вільям§!\n§YЗвання:§! §gСтарший Лицар§!\n\nСьєрра відіграв надзвичайно важливу роль у зборі інформації. Насправді, саме він сповістив мене про величезний потенціал, який приховує комплекс Геліос Один.\n\nСаме Лицар Сьєрра повідомив мені про прибуття НКР у Мохаве, дозволивши мені реорганізуватися і підготуватися до нашого блокування.\n\nВинахідливий та корисний. Саме такі підлеглі мені подобаються. Однак мені не подобається, як він сумнівається в мені..."
 MOJ_scout_sierra_high_command:0 "Сьєрра — розвідниця, яка виросла на службі Братству. Після виснажливих тренувань та ініціації вона пройшла шлях по службовій драбині, перш ніж стати розвідницею."

 MOJ_SCRIBE_SCHULER_NAME:0 "Писар Шулер"
 MOJ_Scribe_Schuler_Desc:0 "§GОсобова справа — Шулер, Лінда§!\n§YЗвання:§! §gПисар§!\n\nПисар Шулер перевантажена роботою, якщо сказати просто. Мені доводилося підключати себе до її листування замість 'Головного Писаря' Таггарта частіше, ніж мені б того хотілося. Її спеціалізація — медицина, і все ж вона часто бере участь в обговореннях патрулів, дослідницьких проєктів та координуванні проєктів із писарями замість своїх прямих обов'язків.\n\nЧи я скаржуся? Звісно ні. Насправді, я починаю підозрювати, що я єдиний старший член, який помічає її зусилля. Я мав намір 'перетрусити' ієрархію. Можливо, дати їй більш відповідний титул 'Головного Писаря'. Але я був такий зайнятий. Колись я до цього дійду, щойно НКР та Лост-Гіллз відчепляться від мене. "

 MOJ_PALADIN_MATIZ_NAME:0 "Паладин Матіз"
 MOJ_Paladin_Matiz_Desc:0 "§GОсобова справа — Матіз, Франклін§!\n§YЗвання:§! §gПаладин§!\n\nПаладин Матіз є підходящим кандидатом для командування нашими щоденними експедиціями з пошуку ресурсів та корисних технологій. Але його 'симпатії' до звичайних жителів пустки змушують мене нервувати, коли я відправляю його на 'довгі' розгортання. Паладин не повинен так легко відволікатися, як він."
 MOJ_JOSEPH_STEYN_NAME:0 "Джозеф Стейн"
 MOJ_Joseph_Steyn_Name:0 ""

 MOJ_PALADIN_TODD_NAME:0 "Паладин Тодд"
 MOJ_Paladin_Todd_Desc:0 "§GОсобова справа — Г'юз, Тодд§!\n§YЗвання:§! §gПаладин§!\n\nПаладин Тодд — посланець, це те, що я зрозумів зі своїх нечисленних розмов із ним. Він досить зацікавлений у внутрішніх механізмах як Братства, так і НКР, і в результаті йому вдалося досягти тихих компромісів не лише між нашими членами, але й між чужинцями та Братством. Безперечно, це корисно. Але його наполегливість щодо процедур і законів може бути недоліком і в моїй роботі. Я буду наглядати за ним, але доки він продовжує 'змащувати' коліщата нашої сталевої машини, мене не надто хвилює, що він каже чи робить."
 MOJ_SCRIBE_TAGGART_NAME:0 "Писар Таггарт"
 MOJ_Scribe_Taggart_Desc:0 "§GОсобова справа — Таггарт, Ларс§!\n§YЗвання:§! §gГоловний Писар§!\n\nПисар Таггарт. З чого б навіть почати? По-перше, в нього лише половина мого розуму. Якби слову 'застій' знадобилося візуальне втілення, Писар Таггарт підійшов би ідеально. Він цілком задоволений своєю посадою і часто зволікає, роблячи бозна-що. Його єдиним справжнім досягненням є постійна підтримка та розвиток наших симуляторів військової підготовки, які підтримують нашу бойову готовність у будь-який час.\n\nВін цілком нормальний писар, якщо ви не очікуєте від нього надвисоких результатів. На його біду, я очікую. Я вважаю його підлеглих набагато кращими писарями. Можливо, одного дня я заміню його кимось здатним, на зразок мене."
 MOJ_PALADIN_FINLEY_NAME:0 "Паладин Фінлі"
 MOJ_Paladin_Finley_Desc:0 "§GОсобова справа — Фінлі, Міранда§!\n§YЗвання:§! §gПаладин§!\n\nПаладин Фінлі — яскравий приклад того, якими мають бути всі Паладини. Принаймні, так я чую від кожного паладина, будь-яких поглядів. Сильна, розважлива та жаліслива, Паладин Фінлі, мабуть, врятувала кожного польового учасника нашої експедиції принаймні раз чи два. Вона витягала цілі патрулі з межі смерті і присвятила всю себе служінню Братству та своїм братам і сестрам.\n\nКраще цінувати її і тримати близько. Я вірю, що її втрата зруйнувала б моральний дух цього відділення. Хоч вона й справді розумна, я знаю, що якби наше відділення опинилося на межі, вона першою б пожертвувала собою заради нас. Я маю великі сумніви, що хтось дивився б на мене так само."

 MOJ_PRIMM_SLIM_NAME:0 "Прімм Слім"

 MOJ_VERA_KEYES_NAME:0 "Голос Віри Кіз"

 MOJ_AIRFORCE_NAME:0 "Лицар Лендон"
 MOJ_Airforce_Desc:0 "§GОсобова справа — Лендон, Волтерс§!\n§YЗвання:§! §gЛицар§!\n\nЯ маю певну симпатію до Лицаря Лендона. Його 'вигнали' сюди так само, як і мене. Звісно, він настільки ж дурний, наскільки й молодий, але його пристрасть спрямована у правильне русло. Лицар Лендон зацікавлений у створенні повітряного флоту Братства і в ідеї про те, що на наших ворогів падатиме град бомб, тоді як ми залишатимемося в безпеці наших бункерів.\n\nЩодо того, звідки я знаю, про що він думає — так це тому, що всі в Лост-Гіллз знали. Він завжди чітко висловлював свої ідеї. Патякав щось про ангари, уламки...\nВід суцільного роздратування старійшини відправили його з нашою експедицією.\n\n\nЙого згубила власна нетерплячість, а не його ідеї. Це важлива відмінність, яку слід враховувати, зважаючи на те, що я починаю обмірковувати згадані ідеї. "