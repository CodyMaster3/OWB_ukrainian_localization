l_english:
  MOJ_veronica_santangelo:0 "Вероніка Сантанджело"

  MOJ_edgar_hardin_army_chief:0 "Головний Паладин Едґар Гардін — член Мохавського осередку Братства Сталі. Його вірність Братству абсолютна. Відомий завдяки своїй непохитній дисципліні та переконанню, що кожному має бути надана можливість довести свою цінність і стати кращим слугою Спадщини."

  MOJ_PALADIN_RAMOS_NAME:0 "Паладин Рамос"
  MOJ_paladin_ramos_army_chief:0 "Паладин Рамос протягом тривалого часу виконує обов’язки начальника охорони в Мохавському осередку. Його ідентичність нерозривно пов’язана з безкомпромісною відданістю справі Братства та дотриманням його засад."

  MOJ_PALADIN_SATO_NAME:0 "Паладин Сато"
  MOJ_paladin_sato_high_command:0 "Паладин Сато — ветеран Братства. Поступово піднявшись у званні до паладина, він здобув репутацію фахівця з озброєння, добре обізнаного з кожним зразком, що перебуває під охороною Братства."

  MOJ_PALADIN_FAIRBANKS_NAME:0 "Паладин Фейрбенкс"

  MOJ_KNIGHT_TORRES_NAME:0 "Лицар Торрес"

  MOJ_SCOUT_SIERRA_NAME:0 "Розвідниця Сьєрра"
  MOJ_scout_sierra_high_command:0 "Сьєрра з юного віку перебувала під опікою Братства. Після виснажливого курсу підготовки та ініціації вона заслужено отримала статус розвідниці, підтвердивши свою придатність не словами, а результатами."

  MOJ_SCRIBE_SCHULER_NAME:0 "Писар Шулер"

  MOJ_PALADIN_MATIZ_NAME:0 "Паладин Матіз"

  MOJ_JOSEPH_STEYN_NAME:0 "Джозеф Стейн"

  MOJ_PALADIN_TODD_NAME:0 "Паладин Тодд"

  MOJ_SCRIBE_TAGGART_NAME:0 "Писар Таггарт"

  MOJ_PALADIN_FINLEY_NAME:0 "Паладин Фінлі"

  MOJ_PRIMM_SLIM_NAME:0 "Прімм Слім"

  MOJ_VERA_KEYES_NAME:0 "Голос Вери Кіз"

  MOJ_AIRFORCE_NAME:0 "Лицар Лендон"

