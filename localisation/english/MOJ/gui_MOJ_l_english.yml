l_english:
ABILITY_USE_ARCHIMEDES_II:0 "Вогонь АРХІМЕДІС II"
ABILITY_USE_ARCHIMEDES_II_DESC:0 "АРХІМЕДІС II — це орбітальна енергетична артилерійська платформа, створена компанією Посейдон Energy на замовлення уряду Сполучених Штатів.\nЗалишаючись на орбіті з кінця Великої Війни, вона була неактивною доти, доки Елайджа не відкрив спосіб використати її повний потенціал — дозволивши володарю Геліос обрушити на ворогів самі сонячні списи.\n\nПісля пострілу супутнику потрібно певний час для накопичення енергії за допомогою своїх сонячних панелей, перш ніж знову стати готовим до вогню."

