l_english:
  MOJ_dam_busted:0 "Стіймо перед Сходом"
  MOJ_dam_busted_desc:0 "Нас небагато. Кожен, хто гине — розчавлений силовим кулаком або порубаний мачете, прострелений з їхніх грубих саморобних рушниць — це втрата, що не підлягає заміні. Та попри все — ми стоїмо. Східна хвиля розіб’ється об наш камінь, як безліч інших — об Гуверську дамбу."

  moj_peace_treaty_with_ces:0 "Заклик до перемир’я"

