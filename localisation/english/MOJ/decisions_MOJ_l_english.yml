  moj_legion_army_training_tt_f:0 "§gМи розпочинаємо підготовку нашого війська до ведення бойових дій проти Легіону, готуючись до можливого вторгнення.§!"
  moj_legion_army_training:0 "Підготовка до тактики Легіону"
  moj_legion_army_training_desc:0 "Легіон воює не так, як будь-хто інший, з ким стикалося Братство за останні роки — фанатично, безумно, безжально. Вони ближчі до звірів, аніж до людей. Нам необхідно загартувати дух і навчити наших паладинів боротися з цими істотами."
  moj_legion_army_training_tt:0 "§RЦе рішення має критичне значення!\n\nЯкщо ми не будемо готові до сутички з Легіоном, нас, найімовірніше, повністю знищать. Рекомендується негайно розпочати підготовку до війни з Легіоном.§!"

  moj_securitron_vault:0 "Сховище Сек'юритронів"
  moj_securitron_vault_desc:0 "Братство зобов’язане використовувати всі наявні інструменти задля захисту людства від загроз, які вже одного разу майже його знищили. Попри відсутність у нас ілюзій щодо «роботизованої утопії», яку колись мріяв створити Хаус, Елайджа ніколи не втрачав інтересу до потенціалу технологій Золотого Віку. Активувати армію Сек'юритронів і скерувати її на службу Братству — хіба це не виправдане рішення?"
  moj_securitron_army_tt:0 "Армія Сек'юритронів піднімається з глибин під [359.GetName], готова служити нам і знищити ворогів."

  MOJ_tech_investigation:0 "Великий пошук Елайджі"
  MOJ_tech_investigation_desc:0 "Коли Елайджа спить, його сни наповнені лише величчю відкриттів та проривів. Він ретельно інструктує своїх агентів, наполягаючи, щоб жоден камінь не залишився не перевернутим. Та його бачення можуть привести Мохавське Братство до власної загибелі.\n\nЕкспедиції розпочинаються зі звітів розвідки з району [380.GetName].\n\n§RМи повинні провести шпигунську операцію проти Сховища 3, адже вірогідно, що в разі захоплення цього об'єкта його нинішні варварські власники знищать усе цінне у своєму неуцтві.§!"

  moj_end_repconn_tt:0 "Відкриває §Gоперацію§! у регіоні [329.GetName] проти [329.Owner.GetName] з метою дослідити повідомлення про кладовище вертибердів!"

