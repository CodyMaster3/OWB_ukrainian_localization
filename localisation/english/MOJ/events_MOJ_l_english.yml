l_english:
  nf_mojave_brotherhood.1.t:0 "Останній Великий Розум Пустки"
  nf_mojave_brotherhood.1.d:0 "Писар Братства Сталі, Елайджа порушив традиції і досяг звання старійшини — честі, що зазвичай призначається виключно паладинам. Виняток було зроблено через його геніальність: він міг зрозуміти принцип роботи будь-якого пристрою лише за зовнішнім виглядом. Його наукова проникливість доповнювалась безмежною рішучістю відновлювати та розвивати технології. Його підхід — удосконалення через аналіз і модернізацію, а не сліпе збереження — викликав неприйняття серед більш ортодоксальних членів Братства. Елайджа регулярно відправляв писарів у експедиції для вилучення техніки, переслідуючи всі сліди. Його намагання створити нові зразки зброї та технологій неодноразово ставили його у конфлікт з іншими старійшинами."
  nf_mojave_brotherhood.1.a:0 "Presper не вартує порівняння зі мною."
  nf_mojave_brotherhood.1.b:0 "Лише я здатен врятувати Пустку."
  nf_mojave_brotherhood.1.c:0 "Без мене Братство приречене."

  nf_mojave_brotherhood.2.t:0 "Шлях у Мохаве"
  nf_mojave_brotherhood.2.d:0 "Як патологічний контролер, він розглядав підлеглих радше як засоби, ніж як особистостей — очікуючи беззаперечного виконання наказів. Будь-яка непередбачуваність або інакомислення викликали у нього не просто роздратування, а лють. Єдиною особою, з якою в нього склалися функціональні взаємини, була його учениця — писар Вероніка Сантанджело.\n\nЙого конфлікти з іншими членами Братства загострилися, коли він почав просувати проєкти з розробки нових, сумнівних у моральному сенсі технологій та зразків озброєння. Замість прямої конфронтації, старійшини вирішили усунути Елайджу, направивши його разом із невеликим загоном до Гуверської дамби для оцінки її потенціалу відновлення."
  nf_mojave_brotherhood.2.a:0 "У підсумку, мені не байдуже до Вероніки."
  nf_mojave_brotherhood.2.b:0 "Вероніка слухає мене, тому я поважаю її."

  nf_mojave_brotherhood.3.t:0 "Діти, що граються з бомбами"
  nf_mojave_brotherhood.3.d:0 "Коли Елайджа зі своїм новоствореним «Мохавським осередком» прибув на місце, було вже пізно. За рік до того Нова Каліфорнійська Республіка — політичне утворення, з яким Братство ворогує вже понад століття — захопила дамбу. Елайджа був у люті, порівнюючи ситуацію з «дітьми, що граються з ядерною зброєю».\n\nОскільки Дамба вже була під контролем ворога, Елайджа вирішив перейти до резервного плану й зайняв енергетичний комплекс Геліос Один, де розпочав підготовку до падіння Олівера та повернення Дамби під контроль Братства."
  nf_mojave_brotherhood.3.a:0 "Я не дозволю нікому забрати те, що належить мені."
  nf_mojave_brotherhood.3.b:0 "Братство не зазнає приниження."

  nf_mojave_brotherhood.4.t:0 "Випробування та Загрози"
  nf_mojave_brotherhood.4.d:0 "Конфлікт із територіями Мохаве — неминучий. Політичний тиск з боку Конгресу НКР змусить генерала Олівера рано чи пізно розпочати штурм Геліос Один. Єдиним способом протистояти цій навалі є повна бойова готовність: у грі вступає динамічний модифікатор, що відображає змагання за ініціативу між Братством і НКР. Після початку Операції «Сонячний Протуберанець» рівень підготовки буде зафіксовано — ми повинні бути готові до війни ще до її початку."
  nf_mojave_brotherhood.4.a:0 "Підготовка — наш обов’язок."
  nf_mojave_brotherhood.4.b:0 "Лише в силовій броні — наша перемога!"
  nf_mojave_brotherhood.4.c:0 "Нам потрібні нові бійці, аби врівноважити чисельність НКР!"

  nf_mojave_brotherhood.6.t:0 "Перемога в Операції «Сонячний Протуберанець»"
  nf_mojave_brotherhood.6.d:0 "Сьогодні — славетний день для Братства Сталі. Старійшина Елайджа довів свою тактичну майстерність, очоливши героїчну оборону Мохавського осередку проти тиранічної Нової Каліфорнійської Республіки. Нам вдалося витіснити війська Республіки до застави Мохаве. Але постає нове питання — чи варто продовжити наступ на південний захід, углиб Каліфорнії? Якщо ми спробуємо підкорити ці землі, доведеться зіткнутися з більш організованим спротивом."
  nf_mojave_brotherhood.6.a:0 "Ця земля належить нам!"
  nf_mojave_brotherhood.6.b:0 "Не слід заходити надто далеко."

  nf_mojave_brotherhood.7.t:0 "Помилка Олівера"
  nf_mojave_brotherhood.7.d:0 "Олівер втратив Мохаве для Нової Каліфорнійської Республіки, зазнавши нищівної поразки від Братства Сталі. Він змушений був відступити вниз Великим Шосе 15 до Шейді Сендс. На щастя для нього, немає жодних ознак, що Братство має намір переслідувати його далі вглиб Каліфорнії."
  nf_mojave_brotherhood.7.a:0 "Ми не зазнавали таких поразок уже багато років!"
  nf_mojave_brotherhood.7.a_tt:0 "§OГенерал Лі Олівер§! разом зі своїм командним штабом повертається до Республіки, готовий до переведення в резерв.\n\n"

  nf_mojave_brotherhood.8.t:0 "Помилка Олівера"
  nf_mojave_brotherhood.8.d:0 "Олівер втратив Мохаве для Нової Каліфорнійської Республіки, зазнавши нищівної поразки від Братства Сталі. Змушений тікати Великим Шосе 15 до Шейді Сендс, він не може розраховувати на швидке повернення до служби. Та найбільш тривожним є те, що Братство йде за ним. Щоб стримати їхній наступ і не допустити рейдів у глибину Каліфорнії, нам доведеться терміново мобілізувати армію."
  nf_mojave_brotherhood.8.a:0 "Ми дамо їм відсіч!"

  nf_mojave_brotherhood.9.t:0 "Шифри Заходу"
  nf_mojave_brotherhood.9.d:0 "Наша експедиція нарешті дісталася пункту призначення й вийшла на зв’язок. Там вони змогли надати нам вичерпну інформацію щодо того, ким насправді є так звані Шифри. Їхнє походження бере початок у перші тижні після Великої Війни, коли група науковців та солдатів покинула ядерну лабораторію в Лос-Аламосі, Нью-Мексико, й рушила на північ разом із невеликим загоном інших уцілілих у пошуках відносно безпечного притулку. Вони вважали себе останніми «цивілізованими» людьми, адже всі інші нападали на них заради їжі, води й одягу. Виявивши одне зі стародавніх пуебло у Меса-Верде, вони закріпилися там.\nЗ собою вони мали обмежений набір технологій: стрілецьку зброю, напівпрацюючий комп’ютер, запас деталей для водогенераторів, примітивну вітрову турбіну, свинецеві контейнери з збагаченим ураном і невеликий обсяг медикаментів. Інші мали випадкове обладнання, яке використали на загальне благо.\nЧерез десятиліття комп’ютер вийшов із ладу. Побоюючись втрати спадку Старого Світу, науковці почали малювати й вигравіювати електронні схеми на стінах притулку. Водночас вони наполягали, щоб під час навчання дітей села велику увагу приділяли науці — аби нащадки могли зрозуміти призначення схем.\nЗ дитинства занурені в науку, ці люди почали висловлюватися технічною мовою, що здавалася шифром для інших освічених мешканців Пустки. Так за ними закріпилася назва «Шифри» — і вони прийняли її без спротиву.\nЗ роками Шифри забули про дисципліну і наукові принципи, поступово перейшовши до практичного способу життя. Тепер вони знають, як працюють пристрої, але рідко розуміють — чому. «Символи кажуть — з’єднай це з тим, і буде результат. Чому? Хто знає? Поки числа збігаються — цього достатньо».\nОтримавши повну інформацію щодо цієї групи та її історичних зв’язків із нами, загін Братства направив запит на евакуацію за допомогою вертиберду."
  nf_mojave_brotherhood.9.a:0 "У багатьох аспектах вони схожі на нас."

  nf_mojave_brotherhood.10.t:0 "Експедиція Повернулася з Порожніми Руками"
  nf_mojave_brotherhood.10.d:0 "Схоже, експедиції не вдалося виявити міфічних Шифрів Заходу. Попри це, учасники здобули цінний польовий досвід протягом подорожі."
  nf_mojave_brotherhood.10.a:0 "Відізвати загін на вертиберді."

  nf_mojave_brotherhood.11.t:0 "Прикордонна Сутичка на Дамбі"
  nf_mojave_brotherhood.11.d:0 "Після нашої недавньої перемоги в Геліос Один, деякі паладини, ймовірно, проявили надмірний запал.\nКоли Елайджа прибув до Дамби (доступ до якої нам нерозумно відмовила НКР), стало відомо про збройне зіткнення між Братством і східною ордою работорговців, відомою як «Легіон Цезаря». Наші воїни не мали належного досвіду боротьби з подібним ворогом — їхні методи поєднують тактику племен, пустельників і античних армій у жахливому гібриді.\nОчевидно, нам слід розпочати спеціалізовану підготовку для протистояння такій загрозі."
  nf_mojave_brotherhood.11.tt:0 "Ми зможемо покращити тактику проти Легіону шляхом підготовки — вона стане доступною після вивчення національного фокусу §Y«Підготовка до війни з Легіоном»§!."
  nf_mojave_brotherhood.11.a:0 "Маємо надолужити прогалини у підготовці!"

  nf_mojave_brotherhood.12.t:0 "Бункер Бригади Диявола Виявлено!"
  nf_mojave_brotherhood.12.d:0 "Після тривалих та дорогих пошуків наша розвідгрупа змогла точно визначити місце розташування бункера рештків Бригади Диявола. Із незначними зусиллями ми проникли всередину і провели інвентаризацію знайденого.\nНехай запаси й виявились скромнішими, ніж очікувалось — лише п’ять комплектів силової броні, кілька зразків стрілецької зброї, значна кількість електроніки та один вертиберд — якість обладнання викликає подив. Ці бронекостюми можуть значно прискорити наші розробки в сфері силової броні."
  nf_mojave_brotherhood.12.a:0 "Дивно, що не знайдено жодного вцілілого... можливо, вони всі загинули?"
  nf_mojave_brotherhood.12.tt:0 "\n§gХоча це небагато, ми також виявили старе спорядження, що належало цим бійцям Анклаву.§!"

  nf_mojave_brotherhood.13.t:0 "Північний Науково-Фантастичний Театр — Опівнічний Сеанс!"
  nf_mojave_brotherhood.13.d:0 "Мохаве — домівка для залишків величі Старого Світу... або принаймні так вважав Елайджа.\nНещодавно загін паладинів Братства, переслідуючи групу шакалів поблизу Ніптона, зник без сліду. Ми вислали рятувальний підрозділ для повернення спорядження, проте те, що ми знайшли, перевершило всі очікування..."
  nf_mojave_brotherhood.13.a:0 "Напруга зростає..."

  nf_mojave_brotherhood.14.t:0 "Північний Науково-Фантастичний Театр — Розв’язка!"
  nf_mojave_brotherhood.14.d:0 "Місце знахідки — біля автокінотеатру в Мохаве.\nМи виявили уламки супутника, проте його конструкція не відповідала жодному зразку космічного сміття, відомого нам раніше. Через нього передавався загадковий сигнал у вигляді синього ока — немов пряма трансляція. Елайджі знадобилося лише кілька хвилин вивчення... і кілька випадків, коли паладини просто зникали в синьому сяйві... щоб зрозуміти: це — маяк. Пристрій для переміщення.\nЕлайджа негайно сформував загін паладинів, готовий увійти до супутника й вирушити туди, куди він їх веде."
  nf_mojave_brotherhood.14.a:0 "Несподіваний поворот!"

  nf_mojave_brotherhood.15.t:0 "Північний Науково-Фантастичний Театр — Розкриття"
  nf_mojave_brotherhood.15.d:0 "Коли Елайджа разом із паладинами пройшов крізь бар'єр — перед ними відкрився неймовірний краєвид.\nРай технологічного поступу — Едем прогресу. Лише поглянувши з вікна місця, куди нас перенесло, ми побачили неймовірне: звукові емітери, космічні сплави, гібридизацію ДНК, дослідження силових полів, автоматизовані медичні модулі для краніальної, серцевої та травматичної хірургії... мрії століття стали реальністю в електронних кузнях BIG MOUNTAIN.\n\nБратство знайшло скарб, гідний своєї мети. Усе, що лишилось — розкрити його та опанувати."
  nf_mojave_brotherhood.15.a:0 "Наука!"

  nf_mojave_brotherhood.16.t:0 "Забезпечення X-22"
  nf_mojave_brotherhood.16.d:0 "Старий науковий центр X-22 був присвячений дослідженням рослин і їхнього військового застосування. Саме тут створили носія спор — Beauveria Mordicana — якого згодом перевели до Сховища 22. Загін, який захопив об'єкт, зазнав певних втрат, зокрема в сутичці з особливо небезпечною істотою, згаданою у терміналі як «Пацієнт Нуль».\nВсередині X-22 знайдено рідкісні зразки флори, які при відповідному використанні можуть істотно допомогти в нашій справі."
  nf_mojave_brotherhood.16.a:0 "Чи можна надягти рабський ошийник на рослину?"

  nf_mojave_brotherhood.17.t:0 "Забезпечення селища Гіггса"
  nf_mojave_brotherhood.17.d:0 "Глибоко в межах Big Mountain ми виявили незвичайний об'єкт — криту штучну субурбію, схоже, збудовану для колишніх керівників комплексу. Попри роки занепаду, стан споруд залишається напрочуд хорошим. Дослідивши електромережі та системи в будинках, ми можемо відтворити архітектуру доядерної доби."
  nf_mojave_brotherhood.17.a:0 "Просто старі будинки? Розчарування."

  nf_mojave_brotherhood.18.t:0 "Забезпечення X-13"
  nf_mojave_brotherhood.18.d:0 "Комплекс X-13 виявився надзвичайно дивним — створеним для випробувань прототипу альтернативи китайського стелс-костюма. Розвідники Братства змушені були проходити серію зростаючої складності випробувань, організованих невідомим штучним інтелектом, перш ніж повністю забезпечили об'єкт.\nМи можемо використати збережені комп'ютерні дані для власних досліджень."
  nf_mojave_brotherhood.18.a:0 "Добре, що хоча б дані не пропали дарма."

  nf_mojave_brotherhood.19.t:0 "Забезпечення Y-0"
  nf_mojave_brotherhood.19.d:0 "Цей об’єкт примітний не тим, що в ньому є... а тим, що колись було.\nКомплекс Y-0 повністю зруйновано, однак уривки з терміналів свідчать, що саме тут проводилися, можливо, найважливіші дослідження. Тут вивчали §Rмолекулярну асамблею§! — перетворення будь-чого в будь-що. Алхімічний камінь старосвітської науки.\nСхоже, що науковці Big Mountain досягли успіху... але не тут. Згадується, що дослідження було виконано на замовлення некого «Фредріка Сінклера» в місці під назвою §RСьєрра-Мадре§!."
  nf_mojave_brotherhood.19.a:0 "§RСьєрра-Мадре...§!"

  nf_mojave_brotherhood.20.t:0 "Забезпечення X-8"
  nf_mojave_brotherhood.20.d:0 "Призначення цього комплексу викликає подив. Здається, це — гігантська школа, створена в рамках якогось его-експерименту? Після зачистки приміщень наші паладини знайшли одну цікаву річ — невеликий кіберпес на ім’я Роксі.\nВероніка проявила до нього особливу симпатію."
  nf_mojave_brotherhood.20.a:0 "Добре, що вона щаслива."

  nf_mojave_brotherhood.21.t:0 "Забезпечення X-7"
  nf_mojave_brotherhood.21.d:0 "Комплекс X-7 виявився просто гігантською артилерійською установкою... яка, втім, не має жодної стратегічної користі через повну ізоляцію. Однак боєприпаси, знайдені тут, можуть бути адаптовані для наших потреб."
  nf_mojave_brotherhood.21.a:0 "Принаймні це не буде змарновано."

  nf_mojave_brotherhood.22.t:0 "Забезпечення Сатурнітового Наукового Центру"
  nf_mojave_brotherhood.22.d:0 "Наші паладини виявили об’єкт, присвячений дослідженню незвичайного сплаву під назвою «Сатурніт». Це металокерамічний матеріал, здатний зберігати тепло та утримувати лезо з винятковою ефективністю. Цей матеріал дозволить значно покращити зносостійкість наших інструментів і спорядження."
  nf_mojave_brotherhood.22.a:0 "Броня, яку НКР не зламає."

  nf_mojave_brotherhood.23.t:0 "Забезпечення Y-17"
  nf_mojave_brotherhood.23.d:0 "Комплекс Y-17 відзначився розробкою незвичайної технології — «Гарнітура Травми». Ці костюми — гібриди силової броні та роботизованих систем, здатні підтримувати бійця у бойовому стані навіть століття після його смерті. Інтегрувавши цю технологію в наші екзоскелети, ми наблизимося до створення незламних солдатів."
  nf_mojave_brotherhood.23.a:0 "Технології Старого Світу — знову на службі."

  nf_mojave_brotherhood.24.t:0 "Забезпечення Малого Янцзи"
  nf_mojave_brotherhood.24.d:0 "Здається, ми нарешті знайшли джерело походження «рабських ошийників», які трапляються по всій Пустці. У Big Mountain виявлено старий китайський табір для військовополонених, досі насичений гулями в ошийниках. Ця технологія давно використовується Братством для ідентифікації та контролю потенційно ненадійних кадрів. Тепер, маючи достатній запас пристроїв, ми зможемо ще довго стримувати зрадників у ланцюгах."
  nf_mojave_brotherhood.24.a:0 "Покора — цінується."

  nf_mojave_brotherhood.25.t:0 "Забезпечення ЗАБОРОНЕНОЇ ЗОНИ"
  nf_mojave_brotherhood.25.d:0 "«ЗАБОРОНЕНА ЗОНА», як її неодноразово називали Робо-Скорпіони, що сновигали цими територіями, нарешті опинилася під нашим контролем — на превелике розчарування того, хто, ймовірно, ними керує — «Доктор Мобіус». Ми очікували знайти мозковий центр операції в самому об'єкті, однак... його там не було. Схоже, цей «Доктор Mobius» залишив зону, аби вирушити до Куполу на зустріч з іншими лідерами комплексу."
  nf_mojave_brotherhood.25.a:0 "Зустрінемось із ним у Куполі."

  nf_mojave_brotherhood.26.t:0 "Забезпечення Біґ Маутін"
  nf_mojave_brotherhood.26.d:0 "Ми завершили операцію з контролю над Біґ Маутін. Тепер залишилось зустрітися з лідерами цього місця.\nПаладини вирушили до Куполу в центрі комплексу, готові до прямої конфронтації з фігурами, які керували всім, що тут відбувалося.\n\nТа їх там не було.\n\nРезультати подальшого розслідування виявили щось надзвичайно тривожне..."
  nf_mojave_brotherhood.26.a:0 "Це... погано."

  nf_mojave_brotherhood.27.t:0 "Купол Розтріскався"
  nf_mojave_brotherhood.27.d:0 "Схоже, що Розумовий Центр остаточно втратив терпіння до нашого втручання в їхні експерименти. Вивчивши технологію переміщення, яку ми використовували для доступу до Big Mountain, вони успішно її зворотно сконструювали.\nПо південному Мохаве почали ширитися чутки: про орди Робо-Скорпіонів, безмозких лоботомітів і «плаваючі сфери», що мерехтять у пісках як вогні забутих душ Старого Світу."
  nf_mojave_brotherhood.27.a:0 "Ми повинні їх зупинити!"
  nf_mojave_brotherhood.27.b:0 "§PЧас показати цим старим, хто тут головний!§!"

  nf_mojave_brotherhood.28.t:0 "Чутки Старого Світу"
  nf_mojave_brotherhood.28.d:0 "Сьєрра-Мадре була проєктом однієї людини — Фредеріка Сінклера. Його останнім задумом перед Великою Війною. Вона замислювалась як місце, де відвідувачі могли б «почати знову» та повернути собі втрачене.\n\nПід час її будівництва, аж до завершення, вона залишалась відокремленою від зовнішнього світу. Всі потреби жителів забезпечувались унікальними автоматами, здатними в режимі реального часу створювати необхідне з сировини. Метою було не лише зведення казино, а побудова ідеального укриття від ядерного апокаліпсису. Усі системи Сьєрра-Мадре були покликані зберегти життя.\n\nКазино було не просто казино — це матеріальне втілення нездатності однієї людини відпустити минуле. Передчуваючи кінець, Сінклер прагнув врятувати Веру Кіз — знамениту акторку та своє кохання — від неминучої катастрофи. Так виникла Вілла Сьєрра-Мадре з її символічною вежою — але навіть цього йому було замало. В глибинах підвалів казино він збудував майже неприступне сховище, в якому мав намір перечекати Кінець разом із нею.\n\nСаме це сховище шукає Елайджа. Саме там він сподівається знайти секрети Сьєрра-Мадре: голографічну охорону, автомати-асемблери, червону хмару, що досі огортає ці місця. Елайджа — полонений Старого Світу, і не має наміру відпускати його."
  nf_mojave_brotherhood.28.a:0 "Сьєрра-Мадре буде моєю."

  nf_mojave_brotherhood.29.t:0 "Привиди Минулого"
  nf_mojave_brotherhood.29.d:0 "\"Під час зачистки Вілли біля Сьєрра-Мадре паладини Братства вперше зустрілися з ворожою силою.\n\nСкрегіт металу лунав вулицями, мов викривлений крик. Один з лицарів подивився на груди — з неї стирчала мертва, але жива рука. Вона рухалась у повітрі, ніби шукала ще плоті. Сіпаючись, рука різко відступила назад, лицар впав, захлинаючись кров'ю у власному шоломі. Істота застигла над тілом, витягнувши руки до загиблого. Потім її тіло здригнулося, воно заверещало й скреготнуло, обертаючись до решти групи.\n\nКолись люди, ці істоти, схоже, вижили завдяки костюмам, які Елайджа пам’ятає з Big MT. Та недосконалість конструкції призвела до витоку Хмари в костюми, деформувавши носіїв. Першу істоту вдалося знищити лише ціною надлюдських зусиль — її броня була дивовижно міцною для таких розмірів. Їхні візори світяться отруйно-зеленим, немов з нефриту, а з фільтрів струмує ядучий туман, схожий на дим.\""
  nf_mojave_brotherhood.29.a:0 "Ми розкриємо їхні секрети."

  nf_mojave_brotherhood.30.t:0 "Таємниці Хмари"
  nf_mojave_brotherhood.30.d:0 "Хмара — це те, що вкриває небо Сьєрра-Мадре. Її запах — мідь і сірка... вона обпікає легені й просочується в шкіру. Це повітряно-розповсюджуваний токсин, який роками викидається системами кондиціювання та клімат-контролю курорту Сьєрра-Мадре Casino & Resort. З роками Хмара розрослась у криваво-червону завісу, що вкриває все місто.\n\nМи зустріли гуля на ім’я «Dean Domino» — стверджує, що є експертом із цього питання. Каже, що Хмара не завжди існувала. Вона виросла з часом, навіть без заводів чи машин, які б її живили.\n\nХмару створили в рамках експерименту у Big MT на заводі інноваційних токсинів Z-43. Коли Фредерік Сінклер звернувся до Big MT за технологіями для Сьєрра-Мадре, він підписав фаустівський контракт. Окрім голограм і матеріальних рекомбінаторів, науковці Big MT інтегрували Хмару до об’єкта, використовуючи казино, віллу й її мешканців як піддослідних. Сінклер, перебуваючи на межі банкрутства, ймовірно, не мав вибору. Йому не повідомили, що отримає значно більше, ніж просто нешкідливі прототипи.\n\nЯкщо правильно застосувати Хмару, вона може стати потужною зброєю. Її здатність зберігати та водночас очищати артефакти Старого Світу робить її ідеальним інструментом для амбіцій Елайджі."
  nf_mojave_brotherhood.30.a:0 "З її допомогою ми зітремо все й почнемо наново..."

  nf_mojave_brotherhood.31.t:0 "Пес на Ланцюгу"
  nf_mojave_brotherhood.31.d:0 "Наші розвідники виявили незвичайного, але потенційно корисного мутанта — надзвичайно агресивного, хоча й вразливого до контролю.\n\nОбраний Майстром для полювання на людей з метою подальшого перетворення в супермутантів, Dog впав у депресію після поразки Майстра та зрештою осів у Сьєрра-Мадре, де ми його й знайшли. Його психологічна залежність від «господаря» робить його ідеальним кандидатом для підкорення. Dog беззастережно виконує голосові команди, навіть якщо це загрожує його життю.\n\nЗрештою, обов’язок Братства — використати спадок Старого Світу задля захисту Нового."
  nf_mojave_brotherhood.31.a:0 "Цей звір буде служити мені вірно."

  nf_mojave_brotherhood.32.t:0 "Святковий Гала-Захід"
  nf_mojave_brotherhood.32.d:0 "Казино Сьєрра-Мадре ніколи офіційно не відчинило двері для відвідувачів — саме тому проникнення всередину настільки складне. Щоб потрапити до нього, нам необхідно активувати «Гала-захід» — низку передбачених умов, реалізація яких відчинить вхідні брами.\n\nНаші паладини розпочали підготовку, відбиваючи напади Примар навколо вілли. Коли кожного паладина було розміщено у визначеній точці й наказано діяти синхронно, сталося те, чого ми прагнули.\n\nІз гучномовців пролунав голос, а ворота Сьєрра-Мадре відчинились:\n\n“Увага всім — гостям і мешканцям Вілли. Прошу вас вийти на вулицю та поглянути на нічне небо — настав момент, на який ви чекали, причина, чому ми всі тут. Гала-захід, урочисте відкриття казино Сьєрра-Мадре. Саме ви зробили цю мить можливою, і за це ми вам дякуємо. Підійміть келихи, нехай вулиці наповнить музика. Небо вибухне феєрверками, серця — обіцянками нового початку. Якими б не були ваші турботи чи втрати — відпустіть усе й почніть знову. Але поспішайте: ворота Сьєрра-Мадре відкриті лише на короткий час. Потім вони зачиняться до ранку.”"
  nf_mojave_brotherhood.32.a:0 "Це мій єдиний шанс дізнатися, що приховано всередині."

  nf_mojave_brotherhood.34.t:0 "Те, що Залишилось"
  nf_mojave_brotherhood.34.d:0 "Внутрішній простір Сьєрра-Мадре рясніє голограмами — примарними постатями душ, що загинули в день падіння бомб. В рамках проєкту «Hologram Project» їх було створено у Big MT на об'єкті Z-38 з динаміки світлової хвилі за ліцензією від Фредеріка Сінклера. Початкові результати дали можливість створити тривимірні фігури, включно з голограмою Вери Кіз, коханої Сінклера.\n\nСінклер прагнув вивести проєкт на новий рівень — створення бойових голограм. Big MT відмовились через надмірні витрати. Тоді він звернувся до конкурента — National Electric — які уклали ексклюзивний контракт. Використовуючи напрацювання Big MT, вони створили голографічних охоронців, здатних патрулювати та атакувати вторженців лазерами. Через високі енергетичні потреби голограми були прив’язані до найближчих передавачів.\n\nЕлайджа вважає, що може перебудувати систему живлення, зробивши голограми придатними до використання за межами Сьєрра-Мадре. Таким чином, він отримає армію, яка не відчуває болю і не зупиняється — ідеальну зброю."
  nf_mojave_brotherhood.34.a:0 "Невразливі солдати світла, здатні витримати будь-який удар."

  nf_mojave_brotherhood.35.t:0 "Найвеличніше Відкриття Big MT"
  nf_mojave_brotherhood.35.d:0 "Створені у Big MT в центрі досліджень Y-0, автомати Сьєрра-Мадре були профінансовані Фредеріком Сінклером. Вони були задумані не просто як торгові пристрої, а як аварійні генератори ресурсів у разі ядерного апокаліпсису.\n\nСінклер позиціонував їх як інструмент самозабезпечення. Інші вбачали в них метод тотального контролю над витратами: всі інші автомати було заборонено, а працівники отримували мізерні пайки фішок, за які майже нічого не могли купити.\n\nУ центрі кожного автомата — революційна передвоєнна технологія, яка могла б зупинити Війну, якби її реалізували в масштабах: трансформаційна камера, здатна створити будь-який предмет за збереженими шаблонами. Надзвичайний код дає доступ до медичних і військових товарів. Фішки Сьєрра-Мадре, виготовлені з поширених сплавів і радіоактивних елементів, служать як джерело енергії і сировина для виробництва. Ці автомати здатні також зворотно трансформувати речі назад у фішки.\n\nОскільки фішки виготовляються з елементів, доступних у будь-якому мотлосі, автомати використовують ядерне розщеплення для створення харчів, ліків і матеріалів. Це доводить: перед падінням світ стояв на порозі незрівнянного добробуту."
  nf_mojave_brotherhood.35.a:0 "Ця технологія здатна збудувати націю!"

  nf_mojave_brotherhood.36.t:0 "Застосування Голографічної Технології"
  nf_mojave_brotherhood.36.d:0 "У межах Сьєрра-Мадре існують ділянки, доступ до яких залишається обмеженим, навіть після активації Гала-заходу. Деякі проходи та двері залишаються заблокованими. Елайджа зміг обійти ці обмеження завдяки використанню одного зі своїх новітніх винаходів — Голографічної Гвинтівки. Його модифікація LAER застосовує технологію голограм з об’єкта Y-0 і бойові випромінювачі National Electric, що дозволяє нейтралізувати захисні механізми. Побачивши ефективність цієї зброї в Сьєрра-Мадре, Елайджа замислився над можливістю її застосування в умовах пустки."
  nf_mojave_brotherhood.36.a:0 "Удосконалення — основа досконалості."

  nf_mojave_brotherhood.37.t:0 "Опановування Хмари"
  nf_mojave_brotherhood.37.d:0 "Контроль над Хмарою означає контроль над Мохаве.\nЦе надзвичайна зброя — якщо використовувати її правильно. У межах Сьєрра-Мадре вона виконувала свою роль, але щоб застосовувати її поза межами казино, слід розробити засіб доставки у конкретні цілі без поширення між ними.\nНам не потрібна зброя, яка шкодить нашим же силам.\n\nРозробка нових ракет на основі проєктів REPCONN дозволить нам використовувати Хмару в бойових умовах із максимальним ефектом."
  nf_mojave_brotherhood.37.a:0 "Хмара стане найпотужнішою зброєю Братства."

  nf_mojave_brotherhood.38.t:0 "Останній Виступ Вери Кіз"
  nf_mojave_brotherhood.38.d:0 "Щоб проникнути до сховища під Сьєрра-Мадре, нам бракує одного останнього елемента. Сховище запрограмоване відкриватися лише на голос Вери — що ускладнює завдання, враховуючи деградацію голозаписів із її вокалом. Під час пошуків способу відкрити сховище ми дізналися більше про її життя.\n\nВера Кіз — сценічне ім’я передвоєнної зірки, для якої Сінклер збудував Сьєрра-Мадре. Відома своєю красою, вона знімалась у низці банальних мелодрам, що мали комерційний успіх. Дін Доміно, колишній коханець Вери, познайомив її із Сінклером — але з часом почав заздрити і вирішив зруйнувати Сінклера, використовуючи Веру. Вона погодилась через особисті обставини, але згодом захотіла вийти з цієї гри. Доміно шантажував її залежностями від Med-X і супер-стимпаків, не знаючи, що ті були викликані смертельною хворобою.\n\nОхоплена каяттям, Вера розповіла Сінклеру про змову. Той вже давно підозрював, але дізнавшись правду, перетворив сховище на пастку для Доміно. Врешті він спробував повернути Сьєрра-Мадре до початкової мети, але було вже пізно. Він лише сподівався, що сигнал тривоги приведе допомогу, яка відкриє сховище — і врятує Веру."
  nf_mojave_brotherhood.38.a:0 "Продовжити пошук способу відкрити сховище."

  nf_mojave_brotherhood.39.t:0 "Голос, Що Набув Форми"
  nf_mojave_brotherhood.39.d:0 "У ніч Відкриття, коли впали бомби, казино замкнулося, а його захисні системи активувались. Через критичну помилку голограми почали масово вбивати гостей. Веру було замкнено в її покоях. Вона написала останні слова на стіні: «Відпусти», — і прийняла смертельну дозу хімікатів.\n\nЗамість сигналу порятунку в ефір вийшла рекламна трансляція про відкриття казино — через неправильну маршрутизацію Ґала Event. Так понад два століття голос Вери манив не рятівників, а шукачів скарбів... до смерті.\n\nЇї тіло досі знаходиться на кріслі в її апартаментах, у гала-сукні. Система безпеки зафіксувала її останні слова, які лунають з голограм на площі. Ці записи містять цифровий відбиток її особистості — не просто голос, а пам’ять.\n\nЕлайджа зрозумів, що може використати цю пам’ять, зламавши передавачі та підкоривши цифрову тінь Вери — аби вона сама відкрила ворота, зведені для її захисту."
  nf_mojave_brotherhood.39.a:0 "Я отримаю те, що мені належить."

  nf_mojave_brotherhood.40.t:0 "Почати Заново"
  nf_mojave_brotherhood.40.d:0 "Ми спустили Зламаний Голос Вери Кіз до нижніх рівнів комплексу — туди, де чекала наша ціль: сховище.\nВикористовуючи її останні слова, вона відкрила двері.\nСховище виявилося компактним: кілька кімнат, запаси їжі, медикаментів і останні багатства Сінклера. Усередині — зливки золота, еквівалент мікродержавного резерву, більші навіть за запаси НКР, знищені Братством роками тому.\n\nМаючи голограмні технології, цифрову тінь Вери, автомати, голографічну зброю, Хмару — і тепер ще й золото — [MOJ.GetName] опинилося на межі величі."
  nf_mojave_brotherhood.40.a:0 "Після всіх цих років... Сьєрра-Мадре — моя."

  nf_mojave_brotherhood.41.t:0 "Дані з REPCONN"
  nf_mojave_brotherhood.41.d:0 "Під час дослідження штаб-квартири REPCONN наші оперативники ретельно витягували інформацію з усіх доступних терміналів. Більшість — мотлох, але не все. Серед даних містилися координати закинутого випробувального полігону для вертибердів на півночі, в регіоні [329.GetName]. Експедиція туди потребує значних ресурсів і часу, але потенційна вигода — незрівнянна."
  nf_mojave_brotherhood.41.a:0 "Ми повинні використати цю зачіпку!"

nf_mojave_brotherhood.42.t:0 "Мандрівник із Юми"
nf_mojave_brotherhood.42.d:0 "Учора до нас звернувся мандрівник, що прибув із півдня. Він проходив через наші території й стверджував, що його рідне місто — Юма — стоїть над величезним сховищем довоєнних технологій. За його словами, армія Сполучених Штатів використовувала природні печери під містом для зберігання застарілих експериментальних зразків і проєктів. На підтвердження своїх слів він продемонстрував один із наплічників, повністю заповнений вдосконаленою амуніцією та пристроями. Ми маємо змогу направити розвідувальну групу до зазначеної зони, здійснити дослідження печер та повернутися з будь-якими корисними знахідками. Однак слід врахувати: операція потребує значних ресурсів, яких у нас обмежено. Крім того, її проведення може дестабілізувати ситуацію в відділені і призвести до небажаних наслідків у разі невдачі."
nf_mojave_brotherhood.42.a:0 "Ми зобов’язані надіслати групу для перевірки!"

nf_mojave_brotherhood.43.t:0 "Наслідки операції в Юмі"
nf_mojave_brotherhood.43.d:0 "Майже кожен Паладин Мохавського Відділу виступив проти експедиції до Юми. Їхні аргументи були чіткі: надто висока вартість, надмірний ризик і відволікання від головного — збереження та нарощення військової потуги. Тепер, коли розвідувальна група повернулася з мізерними результатами, їхні застереження виглядають виправданими. Сьогодні група Паладинів відкрито звернулася до Елайджі з вимогою переглянути свої пріоритети. Це рішення стане визначальним у питанні майбутнього стратегічного вектору відділу."
nf_mojave_brotherhood.43.a:0 "Гаразд! Нехай буде по-вашому!"
nf_mojave_brotherhood.43.b:0 "Ні, ми не звернемо з обраного шляху!"

nf_mojave_brotherhood.44.t:0 "Мохавське Братство пропонує білий мир?"
nf_mojave_brotherhood.44.d:0 "Мохавське Братство чітко окреслило свою позицію — і словом, і зброєю. Вони вимагають припинити наступ на Гуверську дамбу. Пропозиція, звісно, тимчасова — жоден договір не здатен стримати нас надовго."
nf_mojave_brotherhood.44.a.a:0 "Прийняти — атакуємо, щойно перегрупуємось"
nf_mojave_brotherhood.44.d.d:0 "Відхилити, продовжити війну!"

nf_mojave_brotherhood.45.t.d:0 "Цезар відмовився!"
nf_mojave_brotherhood.45.d.d:0 "Схоже, Легіон налаштований вести цю війну до самого кінця."
nf_mojave_brotherhood.45.o.d:0 "Добре. Ми ще трохи пограємо в цю гру."

nf_mojave_brotherhood.45.t.a:0 "Цезар погодився!"
nf_mojave_brotherhood.45.d.a:0 "Легіон погодився відступити від наших кордонів і завершити війну. Схоже, наш Відділ уникнув неминучих втрат."
nf_mojave_brotherhood.45.o.a:0 "Мир — безцінний ресурс у пустці."

nf_mojave.1.t:0 "Лідерство в Відділу"
nf_mojave.1.d:0 "Питання верховного командування в Мохавському Відділу Братства виникало неодноразово. Head Paladin МакНамара висловив занепокоєння з приводу техноорієнтованих пошуків Елайджі, вважаючи, що контроль над Геліос Один зробить нас мішенню для великих сил пустки. Було скликано надзвичайну нараду, яку очолили МакНамара та Елайджа. Зустріч швидко перетворилася на словесну сутичку, що завершилась загрозами: Paladin Хардин і кілька його людей витягли зброю, заявивши про намір усунути Старійшина Елайджу. Щоб уникнути братовбивства, МакНамара виступив із промовою, закликавши до єдності та вірності Братству."
nf_mojave.1.a:0 "Елайджа залишається при владі."
nf_mojave.1.c:0 "Хардин перебирає командування."
nf_mojave.1.b:0 "МакНамара відсторонює Елайджу."

nf_mojave.2.t:0 "Чутки про Старий Світ"
nf_mojave.2.d:0 "Загальновідомо: найбільше знань зосереджено в руках старших. У Братстві це правило було законом. Батько Елайджа за роки своєї служби осягнув багато, і з роками, що крали його силу, прийшла ненаситна жага пізнання забороненого. Його недугою було не що інше, як Синдрому Старого Світу — згубна одержимість минулим, яка вже погубила не одного шукача істини. Але на відміну від інших, Елайджа мав інструменти, щоб зробити цю манію реальністю. Два об’єкти спокушали його сяйвом Золотого Віку людства: Геліос Один і Сьєрра-Мадре. Перший — поруч, у межах досяжності нової штаб-квартири Відділу. Зовні покинута сонячна електростанція приховувала темні таємниці. Елайджа підозрював: її призначення виходить далеко за межі енергетики. Він був сповнений рішучості розкрити ці секрети. Його друга одержимість — значно глибша й небезпечніша — була пов’язана із легендою про Сьєрра-Мадре: коштовність серед пісків, місце, де ніби здійснюються бажання. Елайджа чув про рідкісні прототипи технологій, якими користувався цей курорт. Ризики були очевидні, але, знайди він його — Елайджа був упевнений: розкриє його, немов сейф. Для нього не існувало нічого святого — усе мало бути розкрито, вивчене, освоєне."
nf_mojave.2.a:0 "Немає нічого святого."

nf_mojave.3.t:0 "Забутий ландшафт Пекла"
nf_mojave.3.d:0 "Кров розтікалася під червоним сонцем, а скрегіт металу лунав по всій віллі, спотвореним відлунням, схожим на крик. Один із лицарів опустив погляд на груди — з них стричала моторошна рука, яка судомно смикалась, намагаючись вхопити ще плоті. Здригнувшись, вона з силою висмикнулася, і лицар впав, захлинаючись кров’ю всередині власного шолома. Елайджа був змушений спостерігати за цим, він та його вцілілі підлеглі стояли перед створінням, якого людство ще не бачило. Воно схилилося над тілом, руки розкинуті, ніби прагнуло обійняти мертвого. Раптом істота здригнулася, видала жахливий вереск і дзижчання, розвернувшись до групи. Її тіло було повністю закуте в костюм хімічного захисту, обличчя ховалося за газовою маскою. Візори світилися отруйно-зеленим — наче нефрит, що дихає. З фільтра струменіло зелене дихання, схоже на дим. Сьєрра-Мадре не була ані забутою мрією, ані раєм для обраних: вона була Втіленням Пекла на Землі."
nf_mojave.3.a:0 "Ми зобов’язані продовжити"

nf_mojave.4.t:0 "Закрити Ван Ґрафів"
nf_mojave.4.d:0 "Розвідка Братства повідомила про групу, що налагоджує постачання довоєнної зброї в Мохаве. Подальша перевірка встановила — мова йде про клан Ван Ґрафів. Для Хардін'а такі елементи — не більше ніж шлак. Цей синдикат організованої злочинності діяв з Реддінґ і був причетний до затримки північної експансії НКР. На думку Хардін'а, настав час нагадати всім, хто в Мохаве має право на силу. Варта біля входу не встигла навіть зорієнтуватися — щойно вони побачили Братство, було вже пізно. Залп. Попіл. Криваві рештки. Через мить двері Сільвер Раш було вибито. Торговці потяглися до зброї, але Братство вже входило всередину, методично знищуючи охоронців. Хардін кинувся на одного з них, що тягнувся до плазмопістолета, й придавив його до стіни з оглушливим хрустом. За кілька хвилин у приміщенні панувала лише тиша, яку порушували серводвигуни. Після цього почалось вилучення трофеїв: енергетична зброя, боєприпаси, броня, запчастини — все вилучено. Натовп біля казино швидко зник, лише декілька Кінги пробували йти слідом, поки Братство не залишило Фрісайд остаточно. Усі це відчули: Братство повернулося."
nf_mojave.4.a:0 "Ван Ґрафів ліквідовано"

nf_mojave.5.t:0 "Рейди проти НКР"
nf_mojave.5.d:0 "Вплив Братства в Мохаве поступово слабшав після того, як НКР почала перекидати додаткові сили в регіон. Їхня логістика дозволяла підтримувати війська — проте чим глибше вони просувалися, тим сильніше розтягувалися їхні лінії постачання. Хардін це усвідомив. Було організовано серію рейдів на бази НКР для дестабілізації їхнього тилу. Першим удар прийняв Аутпост Мохаве. Основною метою було завдати максимальної шкоди інфраструктурі: один із будинків було підірвано посеред бою, щоб ускладнити відновлення. Бій був запеклим, надмірна концентрація солдат ускладнювала атаку, але врешті-решт Братство здобуло перемогу. Наступною ціллю став Camp Golf. Після короткого перепочинку та ремонтів у Гідден-Веллі, операція продовжилась. НКР уже була насторожі після втрати ключового вузла. Але до моменту, коли вони зрозуміли, що відбувається — було пізно. Напад почався негайно. Лазери спопеляли укріплення, солдати падали один за одним під точним і методичним вогнем. До моменту, коли основна будівля була досягнута, половину гарнізону було знищено, табір палахкотів. Двері вибито. Бій, як із Van Graffs — розпорошити, ізолювати, ліквідувати. Лазери прошивали їхню плоть. До світанку Camp Golf вже смердів бензином і паленим м’ясом."
nf_mojave.5.a:0 "НКР відчує наш гнів"

nf_mojave.6.t:0 "Поселення в Мохаве атаковані"
nf_mojave.6.d:0 "Наші поселення в Пустці Мохаве зазнали нападу з боку Паладинів Братства Сталі з місцевого осередку."
nf_mojave.6.a:0 "Відновлення забере частину наших ресурсів"

nf_mojave.8.t:0 "Встановити зв’язок із Заходом"
nf_mojave.8.d:0 "Хардін прийняв ситуацію такою, якою вона була, й перетворив ослаблений Відділ на зразок суворої вірності доктрині Братства. Вогнем і дисципліною він перетворив руїни на опору сили. Тепер, через роки після відокремлення, Мохавський Відділ відновлює зв’язок із Західним Братством із метою повернення до загальної структури."
nf_mojave.8.a:0 "Послухаємо, що вони скажуть"

nf_mojave.9.t:0 "Гонець зі Сходу"
nf_mojave.9.d:0 "Кілька днів тому на вході до Лост-Гілз з’явився гонець. Він стверджує, що прибув від імені Мохавського Відділу Братства Сталі. За його словами, Старійшина Edgar Хардін нещодавно провів серію успішних рейдів проти поселень НКР у Мохаве та тепер прагне встановити офіційний контакт і приєднатися до союзу. Яка буде наша відповідь?"
nf_mojave.9.a:0 "Дії Хардін'а гідні поваги. Їм буде надано членство"
nf_mojave.9.b:0 "Дії Хардін'а неприйнятні. Їм буде відмовлено"

nf_mojave.10.t:0 "Посланець повернувся"
nf_mojave.10.d:0 "Розмова була короткою, але для Хардін'а вона сказала більше, ніж достатньо. Його підвищення до звання Старійшина було офіційно визнане Заходом, і йому пообіцяли додаткові сили для продовження операцій у Мохаве. Рада Старійшин схвалила його дії проти НКР, а також висловила вдячність за ефективні дії проти Van Graffs і Gun Runners, які відповідали доктринальним засадам Братства. Про власний стан вони говорили скупо, але суть була ясна: Мохавський Відділ повертається до складу Братства."
nf_mojave.10.a:0 "Нарешті возз'єднані"

nf_mojave.11.t:0 "Посланець повернувся"
nf_mojave.11.d:0 "Розмова була короткою, але для Хардін'а в ній прозвучало все, що йому потрібно було знати. Його підвищення до Старійшина не було визнано, а сам він оголошений вигнанцем. Рада Старійшин засудила його дії проти НКР та Gun Runners у Мохаве. Про власні справи вони мовчали, але повідомлення було однозначне: Мохавський Відділ — поза межами Братства."
nf_mojave.11.a:0 "Вони не бачать істини"

nf_mojave.12.t:0 "Майбутнє Мохаве"
nf_mojave.12.d:0 "'Довго Мохавське Братство ховалося в бетоні та сталі, нездатне й неготове взаємодіяти з навколишнім світом. Настав час піднятись із самоствореної ізоляції та повернути контроль над Мохаве, разом із обов’язками, покладеними на нас після падіння Мастера. Ми знову почнемо очищення й захист пустки, і відновимо союзи, поховані ще під час першої війни з НКР. Це не час для ворожнечі минулого чи забутої крові. Це час для нового майбутнього — з Братством за штурвалом.' — Старійшина МакНамара"
nf_mojave.12.a:0 "Братство процвітатиме"

nf_mojave.13.t:0 "Послання до НКР"
nf_mojave.13.d:0 "Сутички з НКР, що залишились у спадок від давньої війни, приносять лише шкоду обом сторонам і цивільним, що живуть на цих землях. Ми надішлемо офіційне звернення до НКР з наміром укласти угоду, яка забезпечить стабільність у регіоні."
nf_mojave.13.a:0 "Надіслати послання"

nf_mojave.14.t:0 "Послання з Мохаве"
nf_mojave.14.d:0 "До нас прибув посол від Мохавського Відділу Братства Сталі з дипломатичним зверненням. Схоже, там змінилося керівництво, і вони прагнуть співпрацювати для стабілізації своїх територій. Після перемовин між делегаціями було досягнуто домовленості: наші війська можуть розміщуватись на їхній землі, натомість Братству буде дозволено вільно пересуватись територією НКР."
nf_mojave.14.a:0 "Прийняти угоду"
nf_mojave.14.b:0 "Відхилити пропозицію"

nf_mojave.15.t:0 "Наші емісари повернулися"
nf_mojave.15.d:0 "НКР була здивована появою наших представників, але ще більше — запропонованими умовами. Після кількох годин обговорень, НКР погодилась на угоду: розміщення їхніх сил у Мохаве в обмін на вільне пересування наших представників територією Республіки. Можливо, ця форма співпраці відкриє шлях до глибшої дипломатії."
nf_mojave.15.a:0 "Чудово!"

nf_mojave.16.t:0 "Що залишилося"
nf_mojave.16.d:0 "Стоячи всередині сховища в серці комплексу, Елайджа осмислював здобуте. Із десяти людей, яких він привів, залишилось лише четверо — але це було не марно. Сьєрра-Мадре виявилась трагедією, створеною любов’ю, заздрістю та зрадою. Як іронічно, що жінка, яку він прагнув урятувати, загинула в своїй кімнаті? Та це вже не мало значення. Ця історія тривала 200 років і вже давно була завершена. Елайджу цікавив не її фінал, а вміст цього сховища й технології згори. З часом він забере звідси все, але почати потрібно з головного. Найперспективніші з див Сьєрра-Мадре — це голограми безпеки та автоматичні торгові пристрої. Голограми були майже невразливими вартовими, здатними ліквідувати будь-якого порушника. Один правильно розташований проєктор міг зрівнятись із цілим підрозділом. Торгові машини ж могли створити будь-який предмет, закодований у їхній пам’яті. Вони матеріалізували речі з молекул, в обмін на марну валюту. Елайджа вже навчився обманювати їх — тож їхній потенціал був безмежним."
nf_mojave.16.a:0 "Ми заберемо голографічних охоронців"
nf_mojave.16.b:0 "Ми заберемо торгові автомати"

nf_mojave.17.t:0 "Рейди на каравани Gun Runners"
nf_mojave.17.d:0 "Van Graffs було усунуто, але залишився серйозніший розповсюджувач довоєнної зброї в Мохаве — Gun Runners. Витоки цього виробника — у Boneyard, у межах НКР. Компанія розширилась і забезпечувала багато підрозділів пустки. НКР були ключовим клієнтом, хоча купували зброю лише для обраних солдат. Їхні вироби, засновані на довоєнних кресленнях, становили значну цінність для Братства. Хардін наказав атакувати каравани постачання, що проходили через Мохаве, аби послабити місцевих рейнджерів НКР, завдати шкоди Gun Runners та вилучити якісну зброю. Згодом НКР почала супроводжувати каравани охороною. З кожним рейдом напад на караван ставав подібним до штурму передової бази. Продовжувати так було неможливо. Хардін змінив тактику: замість виснажливих нападів він зосередив сили для прямої атаки на виробничу базу. Братство штурмувало об'єкт, знищило персонал, а креслення було вилучено та сховище повністю розграбоване."
nf_mojave.17.a:0 "Gun Runners більше не торгують у Мохаве"

nf_mojave.19.t:0 "Торгова угода з НКР"
nf_mojave.19.d:0 "НКР — це економічна потуга, і відкритий торговий договір з ними став би для нас сприятливою можливістю. Відправка розвідників до промислових об'єктів НКР для налагодження контактів і початок перемовин з урядом Республіки — перший крок до повноцінного економічного партнерства."
nf_mojave.19.a:0 "Відрядити емісарів"

nf_mojave.20.t:0 "Торгова угода з Мохаве?"
nf_mojave.20.d:0 "До нас знову прибули дипломати з Мохавського Відділу. Цього разу вони прагнуть укласти повноцінну торгову угоду й вже встановили контакт із кількома компаніями на нашій території."
nf_mojave.20.a:0 "Опрацювати деталі"
nf_mojave.20.b:0 "Відмовити у торгових правах"

nf_mojave.21.t:0 "Наші емісари повернулися"
nf_mojave.21.d:0 "НКР дозволила нам офіційно торгувати з ними, а також укладати контракти з низкою корпорацій у межах Республіки."
nf_mojave.21.a:0 "Чудово!"

nf_mojave.22.t:0 "Наші емісари повернулися"
nf_mojave.22.d:0 "НКР відмовила нам у дозволі на офіційну торгівлю та заборонила нашим агентам укладати контракти самостійно."
nf_mojave.22.a:0 "Невдача"

nf_mojave.23.t:0 "Сьєрра-Мадре"
nf_mojave.23.d:0 "\"Залишив серце в Сьєрра-Мадре. Пішов до Сьєрра-Мадре. Якби ж я був у Сьєрра-Мадре.\" Такі написи можна знайти всюди в Мохаве — їх лишають молоді й старі дурні, що женуться за примарною мрією. Якщо не постер — то листівка. Якщо не листівка — то радіотрансляція. Але варто лишень почути той голос, і вже не втекти. Елайджа був, як усі інші: щойно дізнався про цю перлину Старого Світу — закохався. Його спрага, що жила глибоко всередині, була захоплена Сьєрра-Мадре. Він сформував експедицію — десять Братів вирушили з ним, щоб дослідити руїни в пошуках технологій. Було загальновідомо: багато хто загинув, намагаючись винести бодай щось із цього міста. Ті, кому вдалося вижити, розповідали про місто-мрію — мовляв, друге Ельдорадо. Чутки про технології, не схожі ні на що інше в пустці, штовхали Елайджу вперед. \"Там сплять скарби,\" сказав він своїм людям на початку подорожі. \"Деякі — вже прокинулись.\""
nf_mojave.23.a:0 "Час почати знову"

nf_mojave.25.t:0 "Повернення Геліос Один"
nf_mojave.25.d:0 "Битва за Геліос Один обійшлася Братству надто дорого — більшість сил було втрачено, і залишки підрозділів змушені були відступити до сховища. Якби не відчайдушні дії Вероніки, яка прорвалась до Елайджі під час бою, він міг би просто залишити своїх людей помирати. Він це знав. Манія, немов пухлина, пустила коріння в його свідомості, перетворивши завзятість на одержимість.\n\nЩойно вони опинилися в безпеці, підлеглі вибухнули гнівом. Волання МакНамара заглушувались криком Хардін'а, обличчя якого палахкотіло від люті. Вони вимагали пояснень. Батько Елайджа намагався обґрунтувати, чому він пожертвував стількома. Він виклав усе, що знав про об'єкт: що виробництво сонячної енергії — лише частина його функцій. Звісно, генератор можна посилити, але потенціал Геліос Один — набагато ширший."
nf_mojave.25.a:0 "Знову під нашим контролем"

nf_mojave.26.t:0 "Наші емісари повернулися"
nf_mojave.26.d:0 "Хоча на початку НКР була відкрита до ідеї укласти угоду, саму пропозицію допустити наші патрулі на свою територію зустріли зі сміхом. Можливо, поки ще зарано для військових домовленостей — але наш дипломатичний прорив може стати підґрунтям для майбутніх переговорів."
nf_mojave.26.a:0 "Шкода"

nf_mojave.27.t:0 "Військові пакти з НКР"
nf_mojave.27.d:0 "Наше повернення з тіней пустки супроводжується підозрами та агресією. У ситуації, коли Ведмідь і Бик готуються до чергової війни, ми, найімовірніше, опинимося між вогнем. Щоб уникнути цього, доцільно встановити військовий пакт із НКР — бодай пакт про ненапад, або щось більше."
nf_mojave.27.a:0 "Запросити їх до Слоану"

nf_mojave.28.t:0 "Договір у Слоані"
nf_mojave.28.d:0 "До однієї з наших дипломатичних місій надійшло запрошення на переговори про військовий договір. Після прибуття до Слоану, Старійшина МакНамара..."
nf_mojave.28.a:0 "Прийняти їхні умови"
nf_mojave.28.b:0 "Відхилити їхні вимоги"
nf_mojave.28.c:0 "Запропонувати їм захист"
nf_mojave.28.dd:0 "Запропонувати їм державний статус"

nf_mojave.29.t:0 "Наші емісари повернулися"
nf_mojave.29.d:0 "НКР підготувала договір, який, по суті, гарантує лише відмову від оголошення нам війни в разі великого конфлікту."
nf_mojave.29.a:0 "Цього мусить вистачити"

nf_mojave.30.t:0 "Наші емісари повернулися"
nf_mojave.30.d:0 "НКР відреагувала насмішками, надіславши звичайного чиновника для переговорів, і відхилила кожну нашу пропозицію без винятку."
nf_mojave.30.a:0 "Поразка болить"

nf_mojave.31.t:0 "Наші емісари повернулися"
nf_mojave.31.d:0 "Договір у Слоані передбачає не лише пакт про ненапад, але й охоплює гарантії безпеки: у разі загрози нашому існуванню, НКР зобов’язується нас захищати."
nf_mojave.31.a:0 "Прекрасно!"

nf_mojave.32.t:0 "Наші емісари повернулися"
nf_mojave.32.d:0 "Коли ми надсилали дипломатичну делегацію, ми очікували звичних переговорів з послами та клерками. Але замість цього на зустріч прибув сам [НКР.GetLeader]. Вони не лише запропонували захист, але й закликали нас стати їхніми союзниками та партнерами."
nf_mojave.32.a:0 "Приєднатися до альянсу"
nf_mojave.32.b:0 "Залишитись під протекторатом"

nf_mojave.33.t:0 "Дім завжди виграє"
nf_mojave.33.d:0 "Попри всі зусилля Мохавських територій, ми знову здобули платинову фішку і доступ до Сховища. Тепер наша мрія про Нью-Вегаську Економічну Зону може бути реалізована."
nf_mojave.33.a:0 "Ракетні залпи були того варті!"

mojave_news.0.t:0 "Поселення НКР у Мохаве зазнали нападу"
mojave_news.0.d:0 "Вітаю, пані та панове. Сьогодні я не маю змоги розважати вас — перейдемо одразу до новин. Торговці з Каліфорнії були шоковані, виявивши руїни Форпост Мохаве сьогодні вранці. Головну будівлю зрівняно з землею, навколо — сліди від лазерної зброї та тіла загиблих солдат НКР. Один із торговців, який погодився дати коментар Radio New Vegas, сказав, цитую: «Такого не бачив із часів Наварро». Але постраждав не лише цей форт. Незабаром після того, як НКР отримала тривожні звістки з траси I-15, було атаковано Табір Гольф. До того часу, коли з’явилося підкріплення, вже було запізно. Табір палав, основну будівлю штурмували приблизно опівночі. Мохаве здригається, і всі стрілки вказують на Братство Сталі як винуватців цих нападів. І наостанок — сьогоднішній випуск не мав спонсорів."
mojave_news.0.a:0 "Схоже, НКР не раді в Мохаве"

mojave_news.1.t:0 "Мохавське Братство приєдналося до НКР"
mojave_news.1.d:0 "У несподіваному повороті подій Мохавський Відділ Братства Сталі вступив до складу НКР!"
mojave_news.1.a:0 "Цікаво"

mojave_helios_one_news.0.t:0 "Геліос Один"
mojave_helios_one_news.0.d:0 "Доброго дня, друзі. Це пан Нью-Вегас. Сьогодні неймовірна спека — 109 за Фаренгейтом. Випийте сассапарілли й не забувайте про гідратацію. А тепер до новин. Патрулі НКР біля Геліос Один потрапили під вогонь, чим підтвердили побоювання офіцерів у Табір МакКарран. Один анонімний солдат НКР повідомив: «Рано-вранці наші війська на об'єкті зазнали нападу». Свідчення з Новак підтверджують це: мешканці прокинулись від звуків масованої перестрілки. Усі звіти закінчуються однаково: перед завершенням бою небо осяялося стовпом світла. Свідки кажуть, це був гігантський лазер. Запах паленого м’яса та попіл довкола лише підтверджують це. НКР ще не надала офіційної заяви. А тепер — музика."
mojave_helios_one_news.0.a:0 "Геліос Один тепер під контролем Мохавського Відділу"

mojave_helios_one_news.1.t:0 "Геліос Один"
mojave_helios_one_news.1.d:0 "Вітаю, слухачі, це знову шоу пана Нью-Вегас — найулюбленіше радіо в Мохаве. Сьогодні НКР оприлюднила заяву про захоплення Геліос Один. Це сталося на день після припинення боїв. Битва тривала майже добу, і задіяла понад дві тисячі солдат НКР у протистоянні з Братством. Наші джерела стверджують, що операцію готували заздалегідь. Незважаючи на перемогу, втрати були значними з обох сторін. Питання, що залишається: чи виправдані ці жертви? Ці новини люб’язно надані казино The Tops. Ми вам сподобаємось — ми ж найкращі."
mojave_helios_one_news.1.a:0 "Геліос Один тепер під контролем НКР"

