l_english:
MOJ_the_wastelands_last_great_mind:0 "Змій, що прагне проковтнути Сонце"
MOJ_the_wastelands_last_great_mind_desc:0 "У мене є важливіші справи, ніж пояснюватися перед таким ідіотом, як ти."
MOJ_journey_to_the_mojave:0 "Подорож до Мохаве"
MOJ_journey_to_the_mojave_desc:0 "Я давно став тягарем для Лост-Гіллз; вигнання сюди, очевидно, було спробою позбутися мене. Проте вигнання лише посилило мої прагнення."
MOJ_children_playing_with_bombs:0 "Наче \"Діти, що граються з бомбами\""
MOJ_children_playing_with_bombs_desc:0 "Спершу я вважав Геліос Один легкою здобиччю – справжнім скарбом довоєнних технологій. Маленьким фрагментом Старого Світу, моїм особистим. Але марнотні діти не вміють відвести погляду..."
moj_power_armor_blueprints:0 "Креслення Силової Броні"
moj_power_armor_blueprints_desc:0 "Коли ми вирушили до Мохаве, нам дали щонайменше спорядження. Лише надлишки, застарілі моделі. Навряд чи навіть Лост-Гіллз могли передбачити, що НКР прибуде сюди раніше за нас.\n\nЯ маю внести деякі зміни, поки ще є час. Можливо, вдасться витиснути хоч якусь користь із того, що маємо."
moj_prep_optimising_helios_one:0 "Оптимізація Геліос Один"
moj_prep_optimising_helios_one_desc:0 "НКР першими взяли під контроль дамбу, позбавивши нас енергетичної переваги. Нічого – трохи більше часу з Геліос, і я зможу розбудити його ще трохи."
moj_prep_realign_the_panels:0 "Переналаштувати сонячні панелі"
moj_prep_realign_the_panels_desc:0 "Стара світова тупість не оминула й інженерів з Посейдону: забули врахувати зміни в орбіті Землі після ядерного обміну.\n\nІдіоти. І тепер я мушу прибирати за ними..."
moj_prep_improving_the_codebase:0 "Вирішення роздратування"
moj_prep_improving_the_codebase_desc:0 "Вони забули дужку."
moj_prep_raw_poseidon_energy:0 "Сира енергія Посейдону"
moj_prep_raw_poseidon_energy_desc:0 "Геліос Один стане пульсуючим серцем усього – сонце пробиватиметься крізь його підстанції, вдихаючи життя в Мохаве."
moj_prep_overlock_hidden_valley_generators:0 "Розігнати генератори Гідден-Веллі"
moj_prep_overlock_hidden_valley_generators_desc:0 "У мене немає часу на капітальні роботи. Тимчасово ми зможемо напряму використати генератори Гідден-Веллі для зарядки енергетичних елементів."
moj_prep_work_with_the_gun_runners:0 "Співпраця з Gun Runners"
moj_prep_work_with_the_gun_runners_desc:0 "Мені важко це визнати, але я можу віддати належне Gun Runners. Вони спорудили щось нове в болоті тупості. Поки Лост-Гіллз відвертає погляд, я міг би використати їх."
moj_prep_refurbish_our_stockpile:0 "Відновлення запасів"
moj_prep_refurbish_our_stockpile_desc:0 "Тільки один із десяти комплектів силової броні має справні пілотні лампи.\nТільки один із двадцяти мікроядерних елементів заряджений повністю.\n\nТільки один із п’ятдесяти комплектів броні має робочі серводвигуни.\nНеприпустимо! Як це взагалі могло статися?"
moj_prep_microfusion_cell_replacement:0 "Ремонт мікроядерних елементів"
moj_prep_microfusion_cell_replacement_desc:0 "... це не мікроядерні елементи – це звичайні елементи живлення, пофарбовані під справжні. Це жарт? Лост-Гіллз вирішили нас убити?"
moj_prep_heavy_duty_ballistic_barrels:0 "Посилені стволи для кулеметів"
moj_prep_heavy_duty_ballistic_barrels_desc:0 "Один із моїх паладинів повідомив, що ствол його мінігуну розплавився після 30 секунд вогню. Неймовірно.\n\nНемає часу чекати замін – виправлю сам. Нам потрібно максимум вогневої потужності."
moj_prep_walking_artillery:0 "Ходяча артилерія"
moj_prep_walking_artillery_desc:0 "Щодня мене обступають зневірені, що бурмочуть про наші тактичні \"мінуси\". Нісенітниця. Наші паладини оснащені для бою без відступу. Логістика НКР не врятує їх від вогневої переваги нерухомого бастіону."
moj_simulation_training:0 "Тренування у симуляторах"
moj_simulation_training_desc:0 "Я зневажаю віртуальну реальність: вона садить тебе в крісло й кидає у світ без ризику, без непередбачуваності. Це атрофія для мозку.\n\nАле коли не вистачає надійних новобранців, і немає часу – іншого вибору немає. Це вимушена доцільність."
MOJ_preparing_for_sunburst:0 "Випробування Ведмедя"
MOJ_preparing_for_sunburst_desc:0 "НКР повзає, мов мурахи, по залишках Старого Світу. Почали з дамби – лише питання часу, коли їхні очі звернуться до Геліос.\n\nЯ не можу цього допустити. Потрібно діяти, знайти хоч якусь перевагу."
MOJ_mysteries_of_helios:0 "Щасливе Старе Сонце"
MOJ_mysteries_of_helios_desc:0 "Зухвалість! Ідіотизм!\n\nЩогодини, витраченій на ремонт Геліос Один, супроводжують кепкування та сумніви. Я очікував на опір від МакНамара й Хардвіна, але Вероніка? Те, що навіть вона вагається в цю вирішальну мить? Неймовірно!\n\nЦе заразне. Доведеться ігнорувати цих слабкодухів – я продовжуватиму добувати сонце."
moj_poseidon_relic_circuitry:0 "Реліквійна електроніка Посейдону"
moj_poseidon_relic_circuitry_desc:0 "Скарби Геліос Один заблоковані гнилою електронікою його систем. Доведеться шукати заміну в руїнах."
moj_assigning_power:0 "Розподіл енергії"
moj_assigning_power_desc:0 "Геліос Один – ключ до величного задуму, так і не реалізованого: станція мала віддавати свою кров небесам – сонячне випромінювання у формі мікрохвиль, сонячні списи."
moj_petro_chico_military_encryption:0 "Військове шифрування Петро-Чіко"
moj_petro_chico_military_encryption_desc:0 "Схоже, кілька інженерів з Петро-Чіко брали участь у розробці проєкту АРХІМЕД. Їхні шифри – це жива, агресивна, постійно змінна система, ніби створена з характером.\n\nДратує до нестями."
MOJ_spears_from_the_sun:0 "Сонячні списи"
MOJ_spears_from_the_sun_desc:0 "Я мав здогадатися. Ідіоти з Посейдону не змогли розрахувати координати наведення, тож створили ручний пристрій – Euclid C-Finder – який мав виконати це замість них. І, очевидно, жодного іншого способу не існує.\n\nC-Finder востаннє бачили в руках якоїсь дитини. Не дивно – він виглядає так, ніби створений для дитини."
MOJ_open_hostility:0 "Займайся своїм"
MOJ_open_hostility_desc:0 "Хардін вимагає, щоб я припинив возитися з Геліос Один. Відкласти це, задушити НКР, прибрати їх остаточно.\n\nМене це не цікавить, але можливо варто дати йому розчистити шлях. Я зможу завершити справу, коли НКР більше не заважатиме."
moj_caravan_raids:0 "Рейди на каравани"
moj_caravan_raids_desc:0 "Життєздатність НКР у Мохаве тримається на караванах, що проходять трасою Long 15. Якщо вирізати їх постачання – присутність Республіки перетвориться на попіл.\n\nЦивільні, здебільшого. Беззахисні. Вони не чинитимуть спротиву."
moj_searchlight_strike_force:0 "Удар по табору в Серчлайт"
moj_searchlight_strike_force_desc:0 "З півдня НКР залежить від табору Серчлайт. Якщо я атакую зараз – ми зможемо виснажити Республіку ще до початку справжнього конфлікту."
moj_van_graff_supply_runs:0 "Постачання Ван-Ґрафів"
moj_van_graff_supply_runs_desc:0 "НКР залежить від Ван-Ґрафів для поповнення запасів енергетичної зброї. Крадії від початку. Все, що вони мають – моє.\n\nНічого страшного, якщо я поверну належне й заберу залишки."
moj_death_and_glory:0 "Смерть і Слава"
moj_death_and_glory_desc:0 "Коли він у пустці – Хардін на мить стає терпимим. Тут, на базі, він – суцільна загроза. Але якщо тримати його подалі й дати просте завдання – він стає корисним інструментом.\nІ тим краще. Головне – щоб тримався подалі від мене."
moj_accept_veronicas_help:0 "Я Можу Навчити Тебе Дбати"
moj_accept_veronicas_help_desc:0 "Вероніка запропонувала поки що залишити Геліос Один в спокої. Її ідея: задушити НКР руками інших.\n\nРозумно. Мені самому варто було додуматись."
moj_ally_with_tabitha:0 "Використати Супермутантів"
moj_ally_with_tabitha_desc:0 "Вероніка розповіла мені про плем’я мутантів, що засіло в Чорних Горах. Їхня диктаторка Табіта використовує радіосигнали, щоб заманювати мутантів до свого самопроголошеного царства. Вероніка пропонує заглушити сигнал і звинуватити в цьому НКР.\n\nПідступно. Я добре її навчив."
moj_work_with_the_bright:0 "Співпраця з Братством Брайт"
moj_work_with_the_bright_desc:0 "Божевільний культ гулів оселився на REPCONN. На щастя, це проблема, що сама себе вирішить: вони прагнуть покинути Землю, злетіти на ракетах.\n\nВероніка пропонує допомогти їм із запуском – в обмін на саботаж проти НКР. Даремне витрачання часу, та все ж – від них можна буде позбутись, коли виконають свою роль."
moj_sway_the_star_chasers:0 "Схилити Шукачів Зірок"
moj_sway_the_star_chasers_desc:0 "До Війни Сансет Сарсапарілла обіцяла неозначені скарби кожному дурневі, хто збиратиме їхні рідкісні кришки. Досі є шукачі, що вірять у цей скарб.\n\nЯкщо сказати їм, що НКР теж шукає його – можна буде використати цих божевільних."
moj_support_of_the_mojave:0 "Паладини Мохаве"
moj_support_of_the_mojave_desc:0 "Вероніка, як завжди, перевершила очікування. Витягти допомогу з самої пустки – це треба вміти.\n\nТак, вона помиляється, намагаючись реалізувати це по-людськи – але розуміє головне: брудну роботу краще доручити іншим."
moj_emergency_ammunition:0 "Екстренні Боєприпаси"
moj_emergency_ammunition_desc:0 "Брак боєприпасів... десь мають бути допоміжні запаси..."
moj_emergency_production:0 "Екстренне Виробництво"
moj_emergency_production_desc:0 "Забагато людей, замало зброї... броня закінчується... потрібно працювати швидше..."
moj_emergency_materials:0 "Екстренні Матеріали"
moj_emergency_materials_desc:0 "Не вистачає матеріалів для ремонту... так, станція! Використаємо її... наслідки вирішимо потім..."
moj_emergency_recruitment:0 "Екстренний Призов"
moj_emergency_recruitment_desc:0 "Чи є їм кінець!? Потрібно перевершити їх числом... писарі! Так, писарі..."
moj_the_mojave_secured:0 "Тріумф Зневажених"
moj_the_mojave_secured_desc:0 "Це кінець.\n\nГеліос Один замовк. Що залишилося? Порожня вежа. Сонце – так близько, що його можна торкнутися...\n\n... і новий світ на обрії."
moj_helios_citadel:0 "Трон Зневажених"
moj_helios_citadel_desc:0 "Останні шипи вирвано – настав час централізувати владу в Мохаве. Потрібно обрати точку опори.\n\nГеліос Один не надто захищене місце, але я не маю наміру витрачати час на подорожі між адміністрацією і дослідженнями. Я занадто близько до істини.\nЯ зможу змусити це працювати."
moj_neck_of_the_colorado:0 "Задушити Море"
moj_neck_of_the_colorado_desc:0 "Останні перепони прибрано – можна нарешті зайнятись централізацією. Потрібно обрати базу операцій.\n\nЛост-Гіллз вимагали від мене Гуверську дамбу. Навіщо розпорошуватись, коли можна осісти там? До того ж, це шанс попрацювати з турбінами."
moj_fortify_hidden_valley:0 "Цитадель Боягузів"
moj_fortify_hidden_valley_desc:0 "Усі перепони усунуто – час закріпити владу. Почнемо з вибору центру.\n\nМи мусимо діяти тихо: не можна приваблювати зайві очі кожного терористичного кубла пустки. Краще залишитись там, де вже працює."
moj_integrating_the_mojave:0 "Інтеграція Мохаве"
moj_integrating_the_mojave_desc:0 "Захопити Мохаве було легко – утримати його набагато складніше. НКР повернеться, я в цьому певен. Їхні загребущі руки та вічно нишпорячі очі доведеться стримувати."
moj_expand_the_188:0 "Розширити '188"
moj_expand_the_188_desc:0 "Вероніка часто зависала біля '188 – плітки, підслуховування. Можна використати це місце для розвідки й утвердження контролю."
moj_controlling_nipton_through_fear:0 "Контроль Ніптона через Страх"
moj_controlling_nipton_through_fear_desc:0 "Мер Ніптона, Джозеф Стейн, приповз благати пощади, щойно останній солдат НКР залишив місто.\n\nТрус, до того ж дурень. Але корисний."
moj_offer_power_for_compliance:0 "Енергія в Обмін на Покору"
moj_offer_power_for_compliance_desc:0 "Геліос дає надлишок, а Мохаве – хоче споживати. Якщо розподіляти енергію за рівнем продуктивності – отримаємо покірність і менше роботи."
moj_mandatory_service_for_all:0 "Примусова Служба для Всіх"
moj_mandatory_service_for_all_desc:0 "На заході Лост-Гіллз відкидає чужинців. Я більш відкритий. Потрібно показати їм, чого вони не бачать.\n\nПросто: примусова праця, обов’язковий призов. Нові руки направляються до [MOJ.Capital.GetName] і проходять перевірку. Гідні – долучаються до лав.\n\nУсі вони – витратний матеріал, незалежно від походження."
moj_rend_the_mojave_dry:0 "Спустошити Мохаве"
moj_rend_the_mojave_dry_desc:0 "Мохаве стискає свої скарби мертвою хваткою. Не час стримуватись: усе корисне буде вилучене – з рук тих, хто не зміг втримати. Я заслужив право забирати все, що вважаю за потрібне."
moj_post_sunburst_helios_research:0 "Запізніле Вторгнення у Бурхливу Вежу"
moj_post_sunburst_helios_research_desc:0 "Нарешті. Ніяких відволікань, ніяких перешкод. Час зосередитись на справжній роботі."
moj_to_the_great_beyond:0 "До Великої Пустоти"
moj_to_the_great_beyond_desc:0 "Я не розумів, чому Вероніка наполягала, щоб я виконав обіцянки, дані в REPCONN. Але щойно я осягнув, наскільки гулі обізнані у його системах – усе стало на свої місця.\n\nРозумна. Вона завжди мене вражає."
moj_hunt_the_stars_for_the_seekers:0 "Полювання за Відрізаними Зірками"
moj_hunt_the_stars_for_the_seekers_desc:0 "Зоряні шукачі вже довели свою користь. Але, можливо, з них можна витиснути ще трохи. Якщо підіграти їхнім маренням – можливо, вони знайдуть щось цікаве під час своїх блукань."
moj_black_mountain_radio_broadcasts:0 "Фальшива Обітниця"
moj_black_mountain_radio_broadcasts_desc:0 "Передачі з Утобіта виявилися корисним засобом для скорочення популяції супермутантів.\n\nМаяк, приманка.\n\nТі, хто шукає прихистку, слідують за покликом сирени – доходять до підніжжя гори... й не піднімаються далі."
moj_elijahs_ambitions:0 "Голод Змія"
moj_elijahs_ambitions_desc:0 "Без постійного нагляду з Лост-Гіллз нарешті можна приступити до справжньої роботи. Мої 'брати' нехай гниють у своїй стагнації – я ж зберу все, що можна, з уламків, які лишила мені Мохаве."
moj_houses_schematics:0 "Залишене Хаусом"
moj_houses_schematics_desc:0 "Останній монумент Хауса тепер порожній – ідеальний для пограбування. Якщо дати достатньо часу на пошук серед мотлоху – знайдеться щось вартісне."
moj_jewel_of_the_mojave:0 "Перлина Мохаве"
moj_jewel_of_the_mojave_desc:0 "Гуверська дамба й Геліос – добрий початок. Але під пилом Мохаве заховано й інші скарби.\n\nМісто вогнів. Вежі. Безсмертний деспот Старого Світу, зачинений у своїй вежі.\n\nНастав час. Це кінець старого."
moj_work_with_benny:0 "Співпраця з Benny"
moj_work_with_benny_desc:0 "Один з олігархів Хауса поспішив стати на коліна перед новою владою. Здається, звали його Benny. Винахідливий. Корисний.\n\nЙому пощастило – його плазування купило йому життя."
moj_scavenge_vault_21:0 "Обшук Сховища 21"
moj_scavenge_vault_21_desc:0 "Хаус вирішив заповнити сховище у самому серці фронту ресурсами й залити бетоном. Перетворив його на яму, обшиту сталлю Vault-Tec.\n\nІдіот. Тепер у мене менше матеріалу для роботи."
moj_steward_of_vegas:0 "Староста Вегаса"
moj_steward_of_vegas_desc:0 "Вегас захоплено – час рухатись далі. Інші хай смикають нитки, головне – щоб прибуток ішов до мене.\n\nВиявилось, Benny намагався захопити вежу Хауса ще до мого приходу. Перепрограмував одного з роботів для управління системами RobCo. Компетентний, але слабкий – затишок розбещує.\n\nКраще й бути не могло."
moj_enlist_the_families:0 "Залучити Родини"
moj_enlist_the_families_desc:0 "Вегас під контролем – можна рухатись далі. Я дозволю іншим займатись буденним – головне, щоб прибуток ішов мені.\n\nХаус змусив дикунів грати у псевдоаристократів. Зручно. Досить розумні, щоб керувати, й занадто тупі, щоб зрадити. Хай борються між собою – я висмокчу з них усе."
moj_houses_ultimate_treasure:0 "Останній Скарб Хауса"
moj_houses_ultimate_treasure_desc:0 "Щойно я витягнув Хауса з його башти – він шукав оновлення для свого ПЗ: прихований козир, зашифрований у платиновій фішці.\n\nВін уже його знайшов, найняв кур'єра – і чип повернувся до Вегаса. До мене.\n\nОсновна частина була марною, придатна лише для securitron'ів. Але щось корисне ще можна вичавити."
moj_preparing_against_the_legion:0 "Підготовка до боротьби з Легіоном"
moj_preparing_against_the_legion_desc:0 "Дурні! Всі до єдиного!\n\nТі, кого мені дали Лост-Гіллз, не здатні протистояти Легіону. Вони ламають загони – а Легіон перегруповується, ніби нічого не сталось. Дві тисячі років розвитку – і жодної переваги?\n\nЯ змушу це працювати. Я зайшов надто далеко, щоб загинути в цій пустці."
moj_reserve_power_in_archimedes:0 "Зберегти енергію для проєкту АРХІМЕД"
moj_reserve_power_in_archimedes_desc:0 "Легіон – прагматичний. Вони просто кидають тіла, поки проблема не зникне. Можливо, доцільно зберегти заряд Геліос для проєкту АРХІМЕД. Нехай він наповниться кров’ю, а тоді – виплесне її на них."
moj_rescue_legion_slaves:0 "Звільнення Рабів Легіону"
moj_rescue_legion_slaves_desc:0 "Рабство – ефективна система. Працює навіть для тупаків з пустки. Не дивно, що Легіон залежить від нього.\n\nЗабери в них рабів – і Легіон ослабне. А раби? Вони допоможуть нам більше, ніж будь-коли допомагали їм. Двох зайців – одним пострілом."
moj_fortifying_the_dam:0 "Укріплення Дамби"
moj_fortifying_the_dam_desc:0 "Дамба – наш бастіон. Її легко обороняти – м’ясорубка, в яку Легіон сам себе кине. З певною підготовкою вона зможе проковтнути їх повністю."
moj_smelt_down_legion_currency:0 "Переплавка Валюти Легіону"
moj_smelt_down_legion_currency_desc:0 "Некомпетентність! Непрощенна! Легіон сидить на золоті – провідному, живому – й штампує з нього монети? Марнотратство. Ми використаємо його як слід."
moj_reward_veterans_of_the_legion_campaign:0 "Нагородити Ветеранів Кампанії проти Легіону"
moj_reward_veterans_of_the_legion_campaign_desc:0 "Медалі. Похвали. Ордени. Порожні символи сентиментальності.\n\nАле зручні. Даєш людям відзнаку – і вони не заважають. А часу це майже не займає."
moj_soldiers_of_helios:0 "Солдати Геліос"
moj_soldiers_of_helios_desc:0 "Крізь вогонь і війну мої паладини витримали тиск Легіону. Плітки ширяться пусткою. Якщо це принесе користь, викличе повагу – чому б не посприяти їх поширенню?"
moj_repconn_development:0 "Розробки на REPCONN"
moj_repconn_development_desc:0 "Ракетобудування – втрачене мистецтво. Брак пального й металу душить усі ініціативи. Але мені пощастило: я знайшов REPCONN. Якщо обережно накопичити ресурси й використати залишки знань – можна витягнути щось корисне."
moj_study_primm_slimm:0 "Вивчити Primm Slim’а"
moj_study_primm_slimm_desc:0 "Хто б міг подумати – щось корисне знайшлось у Primm: робот Primm Slim, доглядач мавзолею Старого Світу. Роботи з особистістю завжди щось приховують. Якщо дозволити цьому 'привиду' говорити – можливо, вивудимо щось варте уваги."
moj_follow_the_navarro_survivors:0 "Ті, Хто Хапається за Старі Корони"
moj_follow_the_navarro_survivors_desc:0 "Хардін прийшов до мене з маячнею: мовляв, по пустці ходять демони Старого Світу, вимагають помсти.\n\nНеймовірно, але тривожно. Це може обернутись проблемою. Слід влаштувати полювання, знайти останній подих старих царедворців."
moj_the_cipher_expedition:0 "Пройти з Шифрами"
moj_the_cipher_expedition_desc:0 "Далеко за межами Мохаве є плем’я, що зберігає залишки знань – Cipher’и. Вони поклоняються кресленням і текстам, яких самі не розуміють.\n\nЕкспедиція до них може дати користь. Матеріальну чи іншу – побачимо."
MOJ_little_yangzte:0 "Мимолітне Натхнення"
MOJ_little_yangzte_desc:0 "Як виявилося, місцеві вчені ставили експерименти на ув’язнених у таборах. Наводить на думки..."
moj_x22:0 "X-22"
moj_x22_desc:0 "Фунгіцидна інфекція пронизує цю установу. Затримуватись тут не варто."
moj_x13:0 "X-13"
moj_x13_desc:0 "Тиша! Тиша! Чому все тут повинне говорити!?"
moj_x17:0 "Y-17"
moj_x17_desc:0 "Привиди Старого Світу, замкнені у власному божевіллі. Вбити їх – буде милосердно."
moj_higgs_village:0 "Селище Хіггса"
moj_higgs_village_desc:0 "Мертве містечко. Повністю безлюдне.\n\nНарешті трохи тиші."
moj_y0:0 "Y-0"
moj_y0_desc:0 "...а ось це... це вже цікаво..."
moj_the_forbidden_zone:0 "Заборонена Зона"
moj_the_forbidden_zone_desc:0 "Заткніться! Заткніться! Я знайду джерело цих проклятих трансляцій..."
moj_the_dome:0 "Купол"
moj_the_dome_desc:0 "Усе завершено. Безживне серце Великої Порожнечі чекає свого часу."
moj_x8:0 "X-8"
moj_x8_desc:0 "Той, хто створив це місце, мав серйозні проблеми."
moj_x7:0 "X-7"
moj_x7_desc:0 "Небезпечна зона випробувань. Доведеться пожертвувати кількома людьми."
moj_saturnite_research_facility:0 "Дослідницький Центр Saturnite"
moj_saturnite_research_facility_desc:0 "Вони працювали над новим сплавом. Корисно. Матеріал, що поглинає погляд Сонця."
moj_study_our_enemies:0 "Пізнати Привидів"
moj_study_our_enemies_desc:0 "Легенди й оповіді про Сьєрра-Мадре суперечливі, сповнені неточностей і вигадок. Але одне спільне – вона місто привидів і скорених охоронців.\n\nМене постійно залишають без рук. Це набридає. Потрібне польове дослідження."

moj_study_the_cloud:0 "Пізнати Хмару"
moj_study_the_cloud_desc:0 "Легенди про Сьєрра-Мадре не збігаються, але майже всі згадують криваво-червону хмару: мертву завісу, що душить усе живе.\n\nЇї потенціал надихає."

moj_design_cloud_walker_power_armor:0 "Ходити Хмарою"
moj_design_cloud_walker_power_armor_desc:0 "Примарні люди Сьєрра-Мадре не зітліли повністю – їхні костюми стримували Хмару, але не повністю: вона проникла всередину, зруйнувала тіло, але не вбила.\n\nНедоліки їхнього захисту можуть стати прикладом для протилежного – як правильно герметизувати нашу силову броню."

moj_brotherhood_teams:0 "Жертва Наших"
moj_brotherhood_teams_desc:0 "З незрозумілих причин відкриття Сьєрра-Мадре, що була запечатана з часів Війни, пов’язане з подією Ґала – потребує багатьох рук у різних точках.\n\nВикористати сили Братства для її запуску буде дорого, але я не можу покладатись на дурнів із пустки."

moj_wastelander_teams:0 "Жертва Чужих"
moj_wastelander_teams_desc:0 "З незрозумілих причин відкриття Сьєрра-Мадре, що була запечатана з часів Війни, пов’язане з подією Ґала – потребує багатьох рук у різних точках.\n\nМої брати потопають у жадібності, а жадібність веде до зради.\nВони зрадять – без сумніву. Доведеться покладатись на чужі руки.\nЗрадливість гине, коли її душить тупість."

moj_a_chained_dog:0 "Прикутий Пес"
moj_a_chained_dog_desc:0 "Щоб добитись бажаного – достатньо повідка й нашийника."

moj_the_gala_event:0 "Подія Ґала"
moj_the_gala_event_desc:0 "Година настала. Усі частини стали на місце. Сьєрра-Мадре оживе."

moj_molecular_assembly:0 "Молекулярна Асамблея"
moj_molecular_assembly_desc:0 "Довга дорога з Великої Порожнечі привела мене сюди: безмежне процвітання, породжене пихою Старого Світу.\n\nМолекулярна реконфігурація – справжній скарб Сьєрра-Мадре."

moj_design_the_holorifle:0 "Списи Сяючої Пам’яті"
moj_design_the_holorifle_desc:0 "Сьєрра-Мадре охороняють привиди – голограми з обличчями мертвих. Вартові з блискучим смертоносним арсеналом.\n\nСяючі мечі скорботи."

moj_harness_the_cloud:0 "Кровоточивий Подих, Що Затьмарює Сонце"
moj_harness_the_cloud_desc:0 "Хмара – унікальна зброя. Іржавий подих, що пожирає сонце.\n\nМоже стерти все до основи, якщо випустити її в пустку.\n\nЦе спокуса. Не можу не думати про неї: світ у тиші, лише мій.\nСлабкі не встояли б. Але вона – у надійних руках."

moj_begin_again:0 "Почати Знову"
moj_begin_again_desc:0 "\"Почати знову вночі\nЗнову кружляти в танці\nТвоя рука на моєму плечі\nТвоє обличчя поряд\nКуди йти?\nКоли ми зрозуміємо, що вже там?\"\n\nСентиментальне сміття. Закінчімо це."

moj_the_helios_brotherhood:0 "Відпустити"
moj_the_helios_brotherhood_desc:0 "Мій новий порядок опустився на пустку, немов скарабей на сонячний промінь.\n\nЗ пороху старого світу я створив новий. Я понесу далі уроки Сьєрра-Мадре."

moj_the_ncrs_final_lesson:0 "Останній Подих Старого Світу"
moj_the_ncrs_final_lesson_desc:0 "Час стерти все. Очищення – знищити молоді нації, створити новий світ навколо мого кривавого сонця.\n\nЯ задушу Республіку Хмарою, перетворю її на попіл списами сонця.\n\nА потім? Почати знову. Зібрати залишки й побудувати щось краще."

moj_amends_with_lost_hills:0 "Час Рухатись Далі"
moj_amends_with_lost_hills_desc:0 "Зрештою, я ніколи й не відходив від завдань Лост-Гіллз. Я зробив усе, що вимагали – й більше.\n\nТепер, коли прийшов час іти вперед, я відкрию їм очі на істину, яку вони відмовлялись бачити. Ми йтимемо за моїми цілями."

moj_establish_dominance_over_arizona:0 "Змій, Що Поглинає Сонце"
moj_establish_dominance_over_arizona_desc:0 "Із цієї вежі я піднімуся до неба й проковтну сонце. Жорстоке місто Марса, відроджене, буде пробите списами мого сонячного царства, а очі Caesar’а стануть чорною смолою перед Змієм, Що Поглинає Сонце."

 #-------------------------------------
 # Generic BOS
 #-------------------------------------
moj_army_of_the_mojave_tt:0 "\n\n"

moj_the_cipher_expedition_tt:0 "§gМи вирушаємо в експедицію до§! §YШифрів Заходу§!§g – міфічної групи шанувальників технологій у Колорадо. Подорож триватиме деякий час, але дорогою експедиція отримає цінний досвід.§!"

moj_ally_tabitha_tt:0 "§YВероніка§! дає обіцянки §YТабіта§! у §Y[UTO.GetNameWithFlag]§!: ми допоможемо відновити її радіопередавач в обмін на підтримку у війні проти §Y[MOT.GetName]§!.\n\n"

moj_ally_bright_tt:0 "§YВероніка§! зв’язується з §YДжейсон Брайт§!, лідером культу поблизу §YПолігон REPCONN§!. Вона обіцяє допомогти з озброєнням їхніх ракет, щоб вони змогли дістатися до §MВеликої Пустоти§!, якщо ті спочатку допоможуть нам проти НКР.\n\n"

moj_ally_sunset_saloon_tt:0 "§YВероніка§! звертає увагу шукачів §MКришок Зірок Сансет Сарсапарілла§!, повідомивши, що НКР прибули в регіон саме для пошуків легендарного скарбу, який §YФестус§! обіцяв тим, хто збере ці кришки.\n\n"

moj_activate_a_turbine:0 "§gДодаткову турбіну на території§! §OГуверської Дамби§! §gзапущено§! §Yв роботу§!§g, збільшено енергетичну потужність.§!"

every_arizonan_state:0 "Кожен §YАрізонський§! регіон"
every_californian_state:0 "Кожен §YКаліфорнійський§! регіон"

MOJ_spears_from_the_sun_tt:0 "§YЕлайджа§! здобуває повний контроль над можливостями станції §YГеліос ОДИН§!.\nДо кінця кампанії стає доступною бойова здатність §Y\"Вогонь АРХІМЕДА II\"§!.\n\n"

MOJ_our_founding:0 "Наше Заснування"
MOJ_our_founding_desc:0 "Хоча Верховний Старійшина Мексон був засновником Братства в цілому, кожен осередок мав своїх першопрохідців – тих, хто ніс Слово далі в Пустку. Хто заснував нас?"

moj_needs_to_be_secured:0 "§RЦей регіон має бути захоплений перед тим, як ми зможемо взяти цей фокус.§!"

MOJ_our_interim:0 "Наша Перехідна Мета"
MOJ_our_interim_desc:0 "Кожен осередок Братства мав свої пріоритети. Одні зосереджувалися на зброї Старого Світу, інші – на промисловому обладнанні та інструментах. На чому зосередилися ми?"

MOJ_our_future:0 "Наше Майбутнє"
MOJ_our_future_desc:0 "Ми здобули багато знань у минулі роки. Тепер ми повинні використати цей досвід і підготуватись до викликів, які попереду."

MOJ_water_operations:0 "Операції на Воді"
MOJ_water_operations_desc:0 "Маючи доступ до великих водойм, ми можемо почати розширення в морській сфері. Хоч ми не маємо досвіду в цій галузі, передвоєнні доктрини можуть слугувати орієнтиром."

MOJ_port_expansion:0 "Розширення Портів"
MOJ_port_expansion_desc:0 "Щоб утримувати повноцінний флот, нам потрібна інфраструктура: сухі доки, ремонтні цехи, пірси тощо. Для реалізації наших планів доведеться значно інвестувати в портову інфраструктуру."

MOJ_supporting_vessels:0 "Морські Рейдери"
MOJ_supporting_vessels_desc:0 "Основу флотів пустки складають малі та маневрові судна. Щоб зберегти перевагу, ми повинні виробляти прості, міцні кораблі, здатні легко атакувати ворога."

MOJ_larger_vessels:0 "Осадні Кораблі"
MOJ_larger_vessels_desc:0 "Щоб нанести удар по ворожому флоту й підтримати війська на березі, нам потрібні великі кораблі з важким озброєнням. Це – крок до панування на морі."

MOJ_reclaim_a_flagship:0 "Повернути Флагман"
MOJ_reclaim_a_flagship_desc:0 "Демонстрація сили – усе. Щоб залишити слід на морі, одного флоту замало: потрібен ефектний. Відновлений флагман Старого Світу чудово підійде."

MOJ_aerial_operations:0 "Авіаційні Операції"
MOJ_aerial_operations_desc:0 "Гнучкість – те, чого нашій організації часто бракує. Щоб подолати цю слабкість, потрібно її перетворити на силу. Раніше великі експедиції залежали від авіації – ми можемо навчитися з цього."

MOJ_from_the_skies:0 "З Небес"
MOJ_from_the_skies_desc:0 "Хоча ми маємо знання для базової модифікації літаків, ми не знаємо, як їх ефективно застосовувати в бою. Слід звернутись до баз даних та адаптувати передвоєнну тактику."

MOJ_staging_bases:0 "Передові Бази"
MOJ_staging_bases_desc:0 "Без відповідної інфраструктури авіація – лише металобрухт. Щоб створити ефективні авіасили, потрібно знайти придатні місця для авіабаз і облаштувати їх."

MOJ_aerial_supremacy:0 "Перевага в Небі"
MOJ_aerial_supremacy_desc:0 "Маючи нові знання про повітряний бій, ми можемо адаптувати літаки до умов пустки. Скорочення витрат – ключ до ефективного виробництва у світі, де ресурси обмежені."

MOJ_flight_academy:0 "Авіаакадемія Братства"
MOJ_flight_academy_desc:0 "Пілоти – серце авіації. Наші льотчики повинні максимально ефективно використовувати обмежені літаки та ресурси. Створення академії дозволить це забезпечити – можливо, навіть дасть нам справжнього аса."

MOJ_our_right:0 "Наше Право"
MOJ_our_right_desc:0 "Як технократична організація, ми маємо природне право на будь-яку технологію. Ми не крадемо її зі зла – ми захищаємо світ від її неправильного використання. Люди цього не розуміють, але все, що ми робимо – задля безпеки пустки. Наша обізнаність – беззаперечна."

MOJ_salvaged_metal:0 "Утилізований Метал"
MOJ_salvaged_metal_desc:0 "Брухт легко знайти. Викривлені уламки металу розкидані повсюди: стирчать із руїн, заховані в землі, лежать на дорогах. Збирання такого металу дасть нам додаткові ресурси для спорядження."

MOJ_increase_power_production:0 "Нарощування енергогенерації"
MOJ_increase_power_production_desc:0 "Генератори – і благословення, і тягар. Вони забезпечують стабільне живлення при відносно невеликій потребі в обслуговуванні, проте часто потребують специфічних елементів живлення та не піддаються адаптації до альтернативних джерел енергії, як-от спиртове паливо. Інвестиції в генерацію енергії безпосередньо впливають на продуктивність нашого обладнання."

MOJ_salvaged_electronics:0 "Вилучена електроніка"
MOJ_salvaged_electronics_desc:0 "На відміну від металу, електроніку демонтувати значно складніше через її тендітну структуру. Проте, навіть зламані радіоприймачі, бойові машини та енергетична зброя містять провідники й схеми, які можуть бути перероблені в корисні компоненти для майбутніх проєктів."

MOJ_advanced_tech:0 "Передові технології"
MOJ_advanced_tech_desc:0 "Пошук зразків довоєнних високих технологій – справа не лише складна, а й надзвичайно небезпечна. Часто такі об’єкти охороняються автономними бойовими одиницями, заражені радіацією або заміновані. Однак здобуття передових зразків техніки забезпечує нас ресурсами для виробництва складного обладнання й не може бути проігнороване."

MOJ_fueling_our_rise:0 "Паливо нашого піднесення"
MOJ_fueling_our_rise_desc:0 "Паливо може мати різну природу, однак наші пошукові загони віддають перевагу ядерному. Невикористані елементи живлення надзвичайно цінні в умовах пустки, але для нас вони критичні – саме вони живлять силову броню, гатлінг-лазери та генератори. Їхнє вилучення – пріоритет для розвідки."

MOJ_arm_foundries:0 "Озброєння"
MOJ_arm_foundries_desc:0 "Без сили ми не можемо втілювати Вчення. А без належного постачання ми не можемо реалізувати силу. Якщо Братство прагне продовжити свою діяльність, воно повинне не лише вилучати технології в поселенців, а й відновити власне виробництво."

MOJ_civilian_workshops:0 "Цивільні майстерні"
MOJ_civilian_workshops_desc:0 "Більшість об'єктів, які ми займаємо, зазнали ушкоджень під час Великої війни. Для їх повноцінного використання потрібні розкопки, зміцнення та відновлення інфраструктури. З метою подальшого будівництва ми маємо створити власну промислову основу."

MOJ_heavy_production:0 "Масове виробництво"
MOJ_heavy_production_desc:0 "Завершення базових проєктів цивільної та військової індустрії принесло відчутні результати. Щоби зберегти темп, ми розпочнемо нову, меншу за масштабом ініціативу, спрямовану на зміцнення обох напрямів. Паралельно буде закладено інфраструктурну базу для майбутнього розширення."

MOJ_our_might:0 "Наша міць"
MOJ_our_might_desc:0 "Братство Сталі – предмет страху та поваги серед мешканців пустки завдяки своїй військовій перевазі. Один боєць у силовій броні здатен знищити десяток неброньованих. Вивчення результатів попередніх бойових дій дозволить удосконалити нашу доктрину для майбутніх операцій."

MOJ_steel_legions:0 "Легіони Сталі"
MOJ_steel_legions_desc:0 "Наші підрозділи, вишикувані пліч-о-пліч, формують непробивну стіну. Братство – це ланцюг, розтягнутий континентом, у якому немає слабких ланок. Кожен лицар, паладин і писар досягає рівня підготовки, недосяжного для зовнішніх груп."

MOJ_new_initiates:0 "Нові новобранці"
MOJ_new_initiates_desc:0 "Ми – не лише військова структура. Братство – це родина. Наші члени вільні укладати шлюби та народжувати дітей. Так триває лінія спадкоємства. Досягнувши повноліття, діти проходять посвяту й починають навчання відповідно до обраної дисципліни."

MOJ_t45d_production:0 "Виробництво T-45d"
MOJ_t45d_production_desc:0 "Модель T-45d – перша зразкова силова броня, що надійшла на озброєння армії Сполучених Штатів. Її конструкція проста, сервіси – посередні, захист – частково відкритий. Утім, будь-яка броня краща за її відсутність. Простота цієї моделі значно полегшує ремонт і виробництво."

MOJ_t51b_production:0 "Виробництво T-51b"
MOJ_t51b_production_desc:0 "Т-51b – вершина довоєнної інженерної думки. Ця модель, улюблена серед бойових загонів Братства, відзначається керамічним бронюванням, відсутністю критичних слабких місць, а також досконалою конструкцією шолома та систем фільтрації. Хоча складність її обслуговування вища, ефективність – беззаперечна."

MOJ_wastelander_conscripts:0 "Рекрути з-поміж пустельників"
MOJ_wastelander_conscripts_desc:0 "Мешканці пустки численні, але рідко – корисні. Їм бракує розуміння технологій, дисципліни та далекоглядності. Утім, у випадках дефіциту кадрів ми вдаємося до рекрутингу серед доведених союзників. Суворий відбір дозволяє виявити осіб, здатних інтегруватися до нашої структури."

MOJ_flesh_before_steel:0 "Плоть перед Сталлю"
MOJ_flesh_before_steel_desc:0 "Фраза «Плоть є слабкість» у наших колах має чітке значення: без належної підготовки навіть силова броня не врятує бійця. Людина, яка не пройшла навчання, гине до того, як зламається обладнання. Кожен новобранець повинен усвідомити цю аксіому."

MOJ_basic_arms_for_basic_people:0 "Базова зброя для базових кадрів"
MOJ_basic_arms_for_basic_people_desc:0 "Навіть після рекрутингу пустельники не можуть одразу опанувати складну зброю. Щоб уникнути інцидентів, ми видаємо їм спрощені енергетичні зразки. Отже, нам потрібно заздалегідь накопичити відповідні запаси для нових рекрутів."

MOJ_doctrinal_thought:0 "Доктринальні рефлексії"
MOJ_doctrinal_thought_desc:0 "З новими кадрами приходять нові спостереження. Хоча ментальність пустельників далекий від ідеалу, аналіз їхніх бойових звітів може надати корисну інформацію про тактичну ситуацію в регіоні. Такий підхід дозволяє нам адаптувати свою підготовку відповідно до загроз."

MOJ_combined_operations:0 "Спільні операції"
MOJ_combined_operations_desc:0 "Бій поруч із колишніми мешканцями пустки – справа непередбачувана. Їхня тактика інстинктивна, хаотична, однак іноді – ефективна. Впорядкувавши їх у межах нашої структури, ми отримуємо підрозділи, здатні діяти нестандартно, підвищуючи загальну ефективність."

MOJ_our_goal:0 "Наша мета"
MOJ_our_goal_desc:0 "Ідеологія Братства проста. Ми прагнемо світу, де безрозсудність людини не підкріплюється технологією. Світ, у якому наука не слугує виправданням для звірств. Саме тому ми вилучаємо технології – і знищуємо ті, які не піддаються контролю. Усе, що ми робимо, служить загальному благу."

MOJ_seek_technology:0 "Вивчення роботів"
MOJ_seek_technology_desc:0 "Пустку Мохаве заповнено безцільно блукаючими роботами – відходами довоєнної епохи. Для звичайних шукачів це лише металобрухт, але для нас – джерело цінних зразків. Розкривши залишки корпусів, ми зможемо дослідити внутрішню архітектуру й удосконалити власні моделі."

  MOJ_scribe_research:0 "Приборкання інтелект-блоків"
  MOJ_scribe_research_desc:0 "За відсутності постійного нагляду з боку бюрократів із Лост-Гіллз я нарешті отримав можливість реалізувати щось по-справжньому вартісне. Залучивши наданих мені псевдогеніїв із нейрозаписом, ми налагодимо серійне відтворення прототипів, створених на основі виявлених нами зразків."

  MOJ_old_developments:0 "Старі розробки"
  MOJ_old_developments_desc:0 "Технології довоєнного періоду мають безумовну цінність, навіть якщо вони перебувають у непридатному стані. Проведення систематичних обстежень довоєнних об'єктів з метою виявлення втрачених або недооцінених артефактів є ключовим елементом операцій Братства у пустці."

  MOJ_robotic_advancements:0 "Робототехнічні вдосконалення"
  MOJ_robotic_advancements_desc:0 "Робототехніка була однією з провідних галузей довоєнної Америки. Залишки цієї могутності сьогодні розкидані по всій пустці – від понівечених корпусів до ще активних одиниць із застарілим програмуванням. Демонтаж та зворотній інжиніринг цих машин дозволить нам сформувати власний корпус бойових роботів."

  MOJ_vertibird_schematics:0 "Креслення «Вертібьордів»"
  MOJ_vertibird_schematics_desc:0 "Серед усіх відомих довоєнних проєктів креслення «Вертібьорда» мають найвищу стратегічну вартість. Уцілілі копії походять виключно з архівів Анклаву, і після його падіння джерело цієї інформації вичерпалось. Проте відступники Анклаву іноді беруть із собою інструменти... і дещо більше."

  MOJ_bunker_thought:0 "Мислення Бункера"
  MOJ_bunker_thought_desc:0 "Переважна більшість наших братів народились у захищених умовах підземних укриттів і ніколи не знали інакшого життя. Для нас бункер – це не лише захист, а й принцип структурної досконалості. Тому оборонні споруди Братства перевершують будь-які імпровізовані укріплення зовнішнього світу."

  MOJ_surface_outposts:0 "Наземні форпости"
  MOJ_surface_outposts_desc:0 "Для ефективного розширення зони впливу необхідно забезпечити наявність стратегічно розташованих зовнішніх пунктів – для зберігання ресурсів, перепочинку та підготовки. Формування окремого інженерного корпусу, відповідального за будівництво таких об'єктів, є виправданим кроком."

  MOJ_underground_workshops:0 "Підземні майстерні"
  MOJ_underground_workshops_desc:0 "Розбудова виробничої інфраструктури всередині захищених бункерів є нашим наступним пріоритетом. Розміщення промислових потужностей у фортифікованих зонах гарантує збереження виробництва навіть у разі тимчасових стратегічних втрат, створюючи шар опору, який противник не зможе знищити одразу."

  MOJ_new_technology:0 "Технологічний прорив"
  MOJ_new_technology_desc:0 "Остання серія відкриттів, здійснених нашими писарями, засвідчує значне розширення розуміння ключових наукових принципів. Ці напрацювання дають змогу прискорити всі чинні дослідницькі ініціативи, виводячи наші проєкти з відновлення технологій на якісно новий рівень."

  MOJ_tesla_theory:0 "Теорія Тесли"
  MOJ_tesla_theory_desc:0 "Завдяки новітнім дослідженням у галузі енергетики наші писарі змогли відтворити одне з креслень епохи Золотого Віку. Попри численні попередні невдачі, нам удалося стабілізувати його до стану практичного бойового застосування. Зразки тесла-зброї вже передано до арсеналів."


# Mojave Chapter #

  MOJ_chapter_leadership:0 "Керівництво Розділу"
  MOJ_chapter_leadership_desc:0 "У самому серці Гідден-Веллі розгорнулась запекла суперечка між Елайджою та Макнамарою щодо майбутнього Мохавського розділу. У центрі дискусії – одержимість Елайджі технологіями Старого Світу, що, на думку опонентів, шкодить усьому розділу. Вирішальний результат ще не визначено."

  MOJ_elijah:0 "Елайджа"
  MOJ_elijah_desc:0 "Після суперечки Елайджа зумів утримати контроль над розділом, попри напружену атмосферу. Його рішучість у досягненні своїх цілей викликає як захоплення, так і обурення – проте його влада залишається беззаперечною. Елайджа – незаперечний лідер Мохавського розділу."

  MOJ_scribal_thought:0 "Мислення Писаря"
  MOJ_scribal_thought_desc:0 "Без постійного нагляду з боку Лост-Гіллз я нарешті можу взятися за підготовку Братства до майбутнього. Значна частина писарів, що прийшла зі мною, – це ті, від кого інші хотіли позбутися. Але вони достатньо компетентні, щоб стати в пригоді."

  MOJ_old_world_rumours:0 "Місто Мертвих"
  MOJ_old_world_rumours_desc:0 "Усі ми чули про казино Сьєрра-Мадре. Легенди, прокляття, байки про блискучу перлину серед міста мертвих, яка кличе шукачів скарбів до погибелі.\n\nАле я бачив записи з Великої Порожнечі. Транзакції, рухи вантажів. Без сумніву, саме сюди було надіслано фінальний скарб. Час розкрити Сьєрра-Мадре.\n\nЗа будь-яку ціну."

  MOJ_helios_one:0 "Повернути Геліос Один"
  MOJ_helios_one_desc:0 "НКР захопила Геліос Один – ключовий елемент грандіозного плану Елайджі. Його енергетичний потенціал є життєво важливим для нашого майбутнього, а сам Елайджа переконаний, що в цьому об'єкті приховано більше, ніж здається. Чи є його переконання маренням – покаже час. Але факт залишається: ми не можемо допустити, щоб така технологія залишалась у руках невігласів."

  MOJ_energy_boom:0 "Енергетичний вибух"
  MOJ_energy_boom_desc:0 "Геліос Один – диво довоєнної науки, неперевершене навіть для свого часу. У світі після катастрофи йому немає рівних. Проте Елайджа не зважає на труднощі. Його розум іде незбагненними стежками, і він запевнив нас, що зможе відновити комплекс. І якщо врахувати нещодавнє зростання енергогенерації, можливо, він таки вартий довіри."

  MOJ_sierra_madre:0 "Сьєрра-Мадре"
  MOJ_sierra_madre_desc:0 "Запрошення, забуте на 200 років, знову лунає в пустці, кличучи на грандіозне відкриття, де обіцяють друзів і свободу. «Ти можеш почати спочатку», – обіцяє оксамитовий голос. І хто від цього відмовиться? Чимало відчайдухів уже пішло на заклик цього голосу – тепер і Братство вирушить слідом."

  MOJ_a_forgotten_hellscape:0 "Забуте пекло"
  MOJ_a_forgotten_hellscape_desc:0 "Повітря смердить золотом Старого Світу, іржею й кров'ю. Сьєрра-Мадре має все це в надлишку. Вулиці, вистелені золотом, задушені корозією, залиті кров'ю. Усі чутки виявилися правдою. Це рай на Землі, спотворений ядерним вогнем, двома століттями забуття, отруйною хмарою, що пожирає живих, і привидолюдьми, які ніколи не помирають."

  MOJ_what_remains:0 "Що лишилося"
  MOJ_what_remains_desc:0 "Смерть у плоті – це справжнє обличчя Сьєрра-Мадре. У місці, де панує лише смерть і розпач, майже нічого не залишилось. Проте ці рештки – як рідке світло зірок. Невмирущі істоти, що патрулюють нутро казино, і торгові автомати, здатні створити щось із нічого – це дари привидів Сьєрра-Мадре."

  MOJ_a_forgotten_weapon:0 "Забута зброя"
  MOJ_a_forgotten_weapon_desc:0 "Обіцянки Елайджі справдилися. Навіть після того, як він повернув Геліос Один до чверті його потужності, ми сумнівалися. Та сьогодні він довів нам, що ми помилялися. Біле світло, що розрізає небо з пронизливим виттям, залишаючи лише обвуглені тіні. Це зброя, яку приніс нам Елайджа."

  MOJ_hardin:0 "Гардін"
  MOJ_hardin_desc:0 "Гардін вийшов переможцем у суперечці, хоча й не словами, а зброєю. Коли дим ще не розвіявся над тліючим тілом Елайджі, Макнамара просто поступився. Відтепер, на краще чи на гірше, цей прихильник західного кодексу очолює Мохавський розділ."

  MOJ_paladin_thought:0 "Мислення Паладина"
  MOJ_paladin_thought_desc:0 "Гардін – справжній вірянин у доктрину Західного Братства. Йому було важко покидати серце Братства. Тепер, здобувши владу як Старійшина Мохавського розділу, він зосередиться на тому, що знає найкраще: війні."

  MOJ_know_our_name:0 "Вони знатимуть наше ім'я"
  MOJ_know_our_name_desc:0 "Надто довго нас вважали слабкими. У пустці нас уже не бояться – навпаки, відкрито глузують з нас, називають «залізними консервами» й кепкують із нашої місії з відновлення технологій. Досить! Незабаром настане день розплати. І тоді вони знатимуть наше ім’я."

  moj_follow_the_navarro_survivors_tt:0 "§gМи починаємо постачання невеликої групи паладинів, які вирушать на пошуки бункера «Диявольської Бригади» – осередку вцілілих з Наварро на горі Чарлстон. Ця операція буде особливо витратною: ми маємо забезпечити їх припасами та боєприпасами на весь час місії.§!"

  MOJ_the_mojave_drive_inn:0 "Науково-фантастичний нічний показ!"
  MOJ_the_mojave_drive_inn_desc:0 "§M«НАПРУГА!\nКОМЕДІЯ!\nНАУКА!\nУсе це й більше – тільки сьогодні в Мохавському автокінотеатрі!»§!\nНадходять повідомлення про аномальну активність у районі автокінотеатру. Можливо, варто послати розвідку?"

  MOJ_closedown_van_graffs:0 "Приборкати Ван Ґраффів"
  MOJ_closedown_van_graffs_desc:0 "Родина Ван Ґраффів добре відома в усій Каліфорнії – їхнє ім’я шепочуть у темних провулках і за барними стійками. Їхній вплив потужний у Реддінґу й на півночі, проте згасає з відстанню. Час нагадати їм: торгівля довоєнними технологіями на землях Братства значно скорочує тривалість життя."

MOJ_gun_runner_caravan_raids:0 "Нальоти на Каравани Gun Runners"
MOJ_gun_runner_caravan_raids_desc:0 "Gun Runners – одна з небагатьох організацій поствоєнного світу, яку можна по праву вважати майстрами своєї справи. Використовуючи ретельно охоронювані довоєнні креслення, вони виробляють і продають першокласну зброю за високу ціну. Проте їхня діяльність у Мохаве погано захищена – а вбивати легше, ніж шукати на смітниках..."

MOJ_ncr_raids:0 "Рейди проти НКР"
MOJ_ncr_raids_desc:0 "НКР зганьбила Братство десятиліття тому. Їхня ворожість до Відділу Мохаве ніколи не вщухала – вони регулярно відкривали вогонь по наших патрулях. Час розплати настав. Форпост Мохаве буде стерто з лиця землі, Табір Ґольф згорить. Ось що трапляється з тими, хто грає з Братством."

MOJ_contact_the_west:0 "Зв'язатися із Заходом"
MOJ_contact_the_west_desc:0 "Нарешті настав день возз'єднання Відділу Мохаве з Західним Братством. Кампанія Хардінa, сповнена вогню й крові, принесла багаті трофеї до сховищ Гідден-Веллі – і ці результати напевно зацікавлять Лост-Гіллз. Усе, що лишається тепер, – чекати відповіді."

MOJ_aggressive_policy:0 "Агресивна Політика"
MOJ_aggressive_policy_desc:0 "Стріляй першим – питай потім. Саме це Хардін закарбував у свідомості своїх солдатів. Відділ Мохаве балансує на межі виживання, оточений ворогами, і більше не може дозволити собі милосердя. У його хрестовому поході проти Мохаве немає місця ані доброті, ані жалю – лиш лазери, попіл і статистика вбитих."

MOJ_mcnamara:0 "Макнамара"
MOJ_mcnamara_desc:0 "Після того, як владу було відібрано в Елайджі, Макнамара отримав важку спадщину. Не маючи підтримки Заходу, а з НКР і Легіоном, що наближались до вирішального зіткнення, Відділ Мохаве змушений був відкритися перед зовнішнім світом."

MOJ_progressive_thought:0 "Прогресивна Думка"
MOJ_progressive_thought_desc:0 "Відкрившись перед Мохаве, ми відкриваємо двері й перед бідою. Поява озброєних до зубів бійців у силовій броні викликає тривогу серед місцевих. Рішенням може стати озброєння та навчання місцевих миротворчих загонів і ополчення в регіонах під нашим захистом, щоб поступово інтегрувати їх до наших лав."

MOJ_the_future:0 "Майбутнє"
MOJ_the_future_desc:0 "Майбутнє Відділу Мохаве висить на волосині. Старійшина Макнамара має подвійний план для збереження нашого існування: перше – укласти союз із НКР, шляхом договору чи самовільної інтеграції; друге – взяти на себе відповідальність за допомогу розрізненим поселенням Мохаве."

MOJ_ncr_negotiations:0 "Перемовини з НКР"
MOJ_ncr_negotiations_desc:0 "Перший крок до миру в Мохаве – гарантування безпечного пересування військ обох держав. Ми підготували звернення до НКР, у якому пропонуємо їм дозвіл патрулювати наші території в обмін на майбутню взаємну підтримку."

MOJ_ncr_trade:0 "Торгівля з НКР"
MOJ_ncr_trade_desc:0 "Незалежно від результатів попередніх перемовин, відкриття торгових зв’язків між нами принесе вигоду обом сторонам."

MOJ_ncr_alliance:0 "Договір зі Слоуном"
MOJ_ncr_alliance_desc:0 "Формальне укладання військового союзу з НКР дозволить нам зосередитися на внутрішній стабільності й захисті кордонів, а також забезпечить захист від сильніших ворогів, яких ми самотужки не здолаємо."

MOJ_help_the_needy:0 "Допомога Потребуючим"
MOJ_help_the_needy_desc:0 "Наші технології здатні суттєво покращити стан медицини в регіоні. Навіть повернення елементарної довоєнної акушерської практики вже змінить демографічну ситуацію. Побудова справжніх клінік зміцнить наш авторитет серед мешканців Пустки."

MOJ_incorporate_the_followers:0 "Інтегрувати Послідовників"
MOJ_incorporate_the_followers_desc:0 "Наші клініки вже відвідують представники Послідовників Апокаліпсису. Попри нашу мілітаризованість, у нас спільна мета – покращення умов життя в Мохаве. Їхні знання стануть величезним підмогою для наших досліджень. Але пам’ятаймо: разом із допомогою вони принесуть і свої ідеї ненасильства – і вже зсередини."

MOJ_wastelander_recruitment:0 "Армія Мохаве"
MOJ_wastelander_recruitment_desc:0 "Наша діяльність у Пустці принесла користь як Відділу, так і тим, кого ми захищаємо. Патрулі лицарів і паладинів тримають загрозу на відстані, клініки лікують хвороби й мутації, а ферми та ранчо постачають їжу, шкіру й майбутніх воїнів. Настав час офіційно дозволити мешканцям наших земель вступати до лав Братства."

