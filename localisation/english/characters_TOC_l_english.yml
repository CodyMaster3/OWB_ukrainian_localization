l_english:
TOC_GROZDAN_HAYKOV_NAME:0 "Гроздан Хайков"
TOC_GROZDAN_HAYKOV_DESC:0 "До Великої Війни Гроздан Хайков був болгарським експертом з логістики. Як один із багатьох блискучих умів, 'звільнених' урядом США після початку громадянської війни в Європі, він був переведений до Спокана для наведення порядку в постачанні американського гарнізону в Канаді. Через свою важливість він отримав місце в Сховищі 100. Саме він одним із перших зазнав дії радіації, що просочилась до сховища за наказом Vault-Tec. Гроздан швидко став лідером гулівської спільноти Сховища 100. Як постійний прихильник переговорів та деескалації, навіть він не зміг зупинити 'Велике Повстання' – громадянську війну між людьми та гулями. Коли люди вирвались і втекли на схід, Гроздан залишився збирати уламки й намагатися створити новий Спокан."

TOC_julius_brandt_name:0 "Юліус Брандт"
TOC_julius_brandt_desc:0 "§M«Ми пропонуємо безпеку. Але не свободу».§!\n\nХоча він ніколи в цьому не зізнається, Юліус служив у війську США на початку окупації Канади. Це зробило його холодним і розважливим чоловіком, який згодом створив приватну військову компанію Whitewarden. Іронія в тому, що уряд США найняв його, щоб він контролював Аляскінський нафтопровід і захищав його від зовнішніх та внутрішніх загроз.\n\nКоли ядерний вогонь знищив світ, його загін виявився відрізаним у снігах – ті, хто вижив, стали гулями. Їхнє старе екіпірування, видане для спецоперацій, залишилось єдиною згадкою про минуле. Багато років Юліус вів Вартових до панування у штаті Вашингтон. Але з поразкою від Безсмертного вся ця впевненість зникла. Тепер йому доводиться починати з нуля. І якщо його спитати, як справи – він скаже, що сумує за тими часами, коли найбільші проблеми були пов’язані з племенами Олімпу та хитрими махінаціями Якама."

TOC_theodore_price_name:0 "Теодор Прайс"
TOC_theodore_price_economic_advisor_desc:0 "До війни Прайс працював у Енергетичній компанії Північно-Західної Співдружності. Її мета – забезпечити енергією інфраструктуру між США та нещодавно анексованою Канадою. Після війни більшість електростанцій перетворилися на руїни, а джерела пального вичерпались. Єдина атомна електростанція в Електричному Місті ще працює – і Прайс відчайдушно намагається її підтримувати. Вона стара, як і він, – і він вважає її своєю спорідненою душею, зв’язком із минулим, який ще не час розривати."

TOC_joshua_nevin:0 "Джошуа Невін"
TOC_joshua_nevin_economic_advisor_desc:0 "Пустка ніколи не була милостивою до гулів. Спустившись із пекла Аляски, Невін шукав кращого життя – без дискримінації. Але знайшов ту саму ненависть: його обличчя було смертним вироком. Озброївши себе та інших гулів, він вирішив – якщо його й знищать, то лише після того, як він виживе всупереч усьому. А виживання – це вже перемога."

TOC_killian_nelson_name:0 "Кілліан Нельсон"
TOC_killian_nelson_cultural_advisor_desc:0 "Холод здатен зламати навіть найсміливіших. Щоб вижити у вітрах тундри, потрібна будь-яка ізоляція. Тому мисливці на зразок Кілліана Нельсона добувають хутро й м’ясо зі звірів дикої Півночі – аби лише відтягнути смерть ще на кілька днів."

TOC_samuel_holder_name:0 "Самуель Голдер"
TOC_samuel_holder_air_chief_desc:0 ""

TOC_corp_conor_name:0 "Капрал Конор"
TOC_conor_advisor_desc:0 "§M«Хтось дивиться косо? Покажи йому зброю. Відразу стане слухняним.»§!\n\nКапрал Джеймс Конор – вірний соратник Юліуса вже багато століть. Коли владу Юліуса ставили під сумнів – саме Конор завжди першим припиняв балачки: словами або силою."

TOC_rodriguez:0 "Родрігес, Зрадник"

TOC_icemberg_name:0 "Рассел"

TOC_jane_morris_name:0 "Джейн Морріс"
TOC_jane_morris_advisor_desc:0 "§M«Мені байдуже, хто ти і чому ти в моєму кабінеті. Якщо не маєш кришок – не витрачай мій час.»§!\n\nБрат каже, що вона м’якіша з тими, кого знає. Але це ще треба побачити. Поки він керує щоденними справами Льодових Кирок, саме розум і кмітливість Джейн тримають їх живими серед інших хижих угруповань. Її брат каже: §R«Без неї нас би давно не було.»§! І важко з цим не погодитись."

TOC_gunther_morris_name:0 "Ґюнтер Морріс"
TOC_gunther_morris_advisor_desc:0 "§gМій батько знайшов Джейн ще до мого народження. Подумав, що вона краще стріляє, ніж пасує на обід для собак. А мене бачив своїм правою рукою. Але життя рейдера – не для мене. Я не просто виживаю. Я – живу. Це означає домовлятись, а не різати.\n\nБатько не схвалював. «Косметика? Ти для мене півлюдини.»\n\nКоли ж я постав перед ним – із його ж Анкер Вейтс за спиною, Джейн тримає дуло в нього на скроні – я спитав: «Якщо я півлюдина – то хто ти?»\n\nСтарий дурень так і не зміг відповісти.\n\nТепер я дивлюсь на Південь. Кажуть, там можливості сиплються, як монети... Якщо тільки не злякатись гулів і божевільних.»"

TOC_joshua_nevin_name:0 "Джошуа Невін"

TOC_bentley_name:0 "Рядовий Вільям Бентлі"
TOC_bentley_advisor_desc:0 "§M«Послухай, між нами кажучи – тільки один із нас уміє витягти ніж з рукава. Якщо ти не зрозумів, про що я, то ті, хто поставив на мене, вже подвоїли свої кришки.»§!\n\nРядовий Вільям «Білл» Бентлі – проста людина. Йому головне – отримати шматочок пирога з мутфрукта наприкінці дня. Його низьке звання радше компрометує систему рангів Вартових, ніж служить доказом його цінності. Фактично він – права рука Брандта. Провів безліч розвідоперацій у тилу ворога й забезпечував потік розвідданих про пересування ворожих сил. Без нього Вартові хіба що копирсались би в снігу, чекаючи смерті."

TOC_lionheart_name:0 "Ліам «Левове Серце» Гарріс"
TOC_lionheart_advisor_desc:0 "§Y«Часом думаю: якби все склалося інакше, якби в мене було більше грошей, або якби людям до війни було хоч трохи не байдуже – я б, мабуть, помер у якійсь пафосній дірі під землею. А так, принаймні, маю шанс щось змінити.»§!\n\nЛіам Гарріс – колишній сержант армії США до Великої Війни. Коли впали бомби, він та його підрозділ були у глибокій завірюсі Канади: досить далеко, щоб вижити, але достатньо близько, щоб перетворитися на гулів. Десятиліттями вони блукали, поки не знайшли прихисток у Спокані, де Гроздан надав їм дім і дружбу. До приходу Вартових саме загін Ліама був охоронцем порядку, стримуючи Ротпергерів. Та тепер, коли прийшов Юліус, все стало складніше. Напруга між групами не критична, але відчутна – мов сніг під ногами перед обвалом."

TOC_isabella_lightning_name:0 "Ізабелла «Блискавка» Герререз"
TOC_isabella_lightning_advisor_desc:0 "§Y«Раніше я часто літала на винищувачі. І досі можу. Але... знаєш, іноді й автомат справляється не гірше.»§!\n\nІзабелла завжди була вільною душею, вірила в силу людської натури. Вона обожнює життя з його злетами й падіннями, каже: «Так цікавіше». Коли Гроздан звинуватив її в адреналіновій залежності, вона тільки засміялась: «А ти щойно це зрозумів?»\n\nЛіам називає її своєю правою рукою. А щодо інших речей... Ну, дещо краще залишити несказаним, правда ж?"

TOC_timothy_tyler_name:0 "Тімоті «Ковадлоголовий» Тайлер"
TOC_timothy_tyler_advisor_desc:0 "§Y«Якщо воно не ось-ось вибухне... то чорт забирай, нащо ми взагалі це робимо?»§!\n\nУ Тімоті Тайлера завжди було кумедне гасло, яке він почув ще на Алясці: «Я – Ковадлоголовий, і підрив – моя місія». Хоча й не найоригінальніший, він має серце справжнього героя – хоче бачити, як злі хлопці вибухають, навіть якщо сам потрапить під хвилю. Що ще треба від живої легенди?"

TOC_john_ryan_name:0 "Джон «Невмирущий» Раян"
TOC_john_ryan_advisor_desc:0 "§M«Падіння Вартових – моя вина. Я склався, як папірець, у їхніх руках. Тому тепер я битимусь до смерті за своїх побратимів. Якщо тільки смерть знайде вільну хвилину для мене.»§!\n\nКоли Безсмертний зайняв Сіетл, він жорстоко карав усіх, хто чинив спротив – експериментами й стратами. Першими жертвами стали вцілілі Вартові.\n\nДжон одним із перших здався. Його відзначили жорстоким допитом у пошуках баз Вартових. Коли зрозуміли, що він справді нічого не знає, спробували вбити. Але він вижив. Джон прикинувся мертвим і спробував утекти, захопивши лазерну гвинтівку – та його знову зловили й «стратили». Але знову вижив. Дивуючись його живучості, вороги зробили з нього піддослідного.\n\nЗрештою він утік і повернувся до своїх. Та коли розповів про свої зради й нову «безсмертність» – його стратили власні. Він знову підвівся. Готовий служити. Готовий спокутати.\n\nПоки не зірве двері до Райських Воріт..."