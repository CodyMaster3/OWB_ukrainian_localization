#######################
# Написано Monkey     #
#######################

nf_jck.1.t:0 "Перші з Сотень"
nf_jck.1.d:0 "Неподалік від Вайомінгу лежить Міссула — перлина у пустці, колись під владою 100 родин. Потужна, об'єднана сила, створена задля миру й безпеки від бандитів Монтани. Та до того вони були просто родинами вцілілих, що готувалися до кінця світу, накопичували їжу, воду, знання... і виживали. Через ядерні удари, голод, рейдерів і чудовиськ — їх збивали з ніг знову й знову, але вони не забули про старий світ. І коли змогли підвестися — підвелися заради майбутніх поколінь.\n\nДо війни їх називали чокнутими, але після — вони стали виживальниками, тими, хто вперто тримався. Джексони втомилися ховатися серед руїн Міссули, щодня ризикуючи стати їжею для рейдерів, і почали діяти. Вони об'єднали родини, заснували §R100 Родин§!, вигнали костюмованих виродків та встановили свою владу як найпотужніша сила Монтани.\n\nСправжня сила прийшла не лише від союзу між родинами — а й ізсередини. Саме яка якість дала нашим предкам цю велич?"
nf_jck.1.a:0 "Хитрість!"
nf_jck.1.b:0 "§RЇБАНА ЛЮТЬ!!!§!"

nf_jck.2.t:0 "Друзі Нашої Родини"
nf_jck.2.d:0 "Міссула, наш дім — розквітлий, заможний, жвавий — стала економічним центром, що міг би позмагатися з довоєнними мегаполісами. Ми заробляли стільки кришок, що рейдерам було вигідніше нас ігнорувати, ніж знищувати... Та це тривало недовго. І як завжди, тупі рейдери вирішили, що краще зруйнувати стабільне джерело прибутку, ніж його зберігати.\n\nНаші вартові втомлювались, родини боялись... але не Джексони. Ми знали — у нас не було сили, зате були кришки. І щастя — поруч ще діяли найманці-охоронці старого світу: §W«Вартові Білого»§!. Вони радо взяли оплату за знищення сміття, що атакувало наші стіни. І з їхньою допомогою ми встановили власну демократію, дали людям захист і спокій. Вартових було замало для повного контролю, тому ми ще страждали від сильніших ворогів, але оборона була достатньою, аби змусити їх двічі подумати перед нападом."
nf_jck.2.a:0 "ЇБАТЬ ТАК!"

nf_jck.3.t:0 "Останні з Сотень"
nf_jck.3.d:0 "Джексони — лідери Ста Родин, захисники довоєнної демократії... А тепер? Мисливці. Вигнанці. Виживальники... вигнані тими, кого ми захищали, заради кого воювали. Вессони, Сміти — боягузи, що зрадили свою ж родину.\n\nМи побудували їм їхні курорти, стіни, місто. І вони відмовились навіть підняти зброю разом із нами.\n\nПробачте... дозвольте почати знову.\n\nМіссула, прекрасна, як вона є, була неможливою для оборони проти єдиної сили. Ми знали це задовго до нападу §YВрат Раю§! у 2268. Та ми, Джексони, стояли до кінця, як у старих переказах. Та ці рейдери мали зброю... серйозну зброю. Тож ми послали сигнал про допомогу — і нам відповіли: §0Анклав§!, залишки довоєнної еліти. Вони нас врятували, поставили захист, але за це забрали демократію.\n\nМи зробили як справжні американці — організували петицію, вимагали повернення виборів. І вони нас §Rвсіх перебили§!. Інші родини — залякані, приручені, відмовились підтримати нас. Ми втекли, щоб вижити. І стали тим, чим є зараз — дикими, але живими.\n\nТа ми повернемось. І коли Вайомінг занурюється в хаос — ми більше не будемо терпіти. Ми вирвемо наш шлях назад до Міссули.\n\nЄ урок тут, родино..."
nf_jck.3.a:0 "Родина завжди прикриє твою спину."
nf_jck.3.b:0 "§RАнклав зачепив не ту родину.§!"

nf_jck.4.t:0 "На Вершині Добре"
nf_jck.4.d:0 "Ми це зробили, родино... Міссула... Нарешті наша...\n\nПрийшов час назвати це домом. Розчавити цих Анклавських ублюдків було складно, але тепер — реконструкція Монтани та реабілітація нашої родини.\n\nТак, реабілітація. Боюсь, наша родина має певну... психотичну проблему. Після всіх цих ночей у Вайомінгу, як дикі рейдери — я бачу це у своїх синах і доньках, у їхніх черепах, у їхньому крику. І навіть я відчуваю... як розум тьмяніє, а жага крові наростає...\n\nАле не бійтеся! Громадяни Міссули, ваші рятівники тут. І з вашою допомогою — та, можливо, психіатра — ми повернемо демократію! Як у старому світі. До всіх цих кишок... і черепів..."
nf_jck.4.a:0 "§RРААААХХХ СУКА, ДЕМОКРАТІЯ!!!§!"

#FOCUS LOC

JCK_last_of_hundreds_key:0 "Зрада в Міссулі"
JCK_last_of_hundreds_desc_key:0 "Усе йшло добре... допоки не з’явилися ці виродки в силовій броні, аби нас «врятувати». Ну, так, вони вибили парових фанатиків — але справа ж не в тому."

jck_stand_your_ground_Law:0 "Закони «Стій до останнього»"
jck_stand_your_ground_Law_desc:0 "У цих диких краях ти повинен знати, в кого стрілятимеш щодня — кожен, хто підходить надто близько або має «веселі» думки, стає ціллю."

jck_years_to_think:0 "Роки на роздуми"
jck_years_to_think_desc:0 "В Вайомінгу легко з'їхати з глузду. Все, що коїться — десь у Ролінсі та на південь. Але для родини Джексонів усе це — порожній звук. Ми мали ціле життя, щоби підготуватися до повернення в Міссулу. Час пришвидшити крок."

jck_plenty_of_gear:0 "У нас купа спорядження"
jck_plenty_of_gear_desc:0 "Ми не сиділи склавши руки — роками готувались до повторної зустрічі з Анклавом. Стара броня для заворушень? Є. Люди, що сповнені люті? Повно. Ми готові як ніколи."

jck_test_our_mettle:0 "Випробувати наш характер"
jck_test_our_mettle_desc:0 "На півночі заварюється якась 'рух позитивного мислення'. Називають себе 'Румінаторами', ніби є над чим думати. Час навчити їх, як воно — коли тебе зраджують ті, хто сильніший за тебе."

jck_ready_the_men:0 "Готувати хлопців"
jck_ready_the_men_desc:0 "Наші хлопці все життя тренуються тут, на фронтирі. Билися з маршалами, змагались із Бароном. Якщо вони не готові до бою з Анклавом — вони ніколи не будуть."

jck_kill_the_ruminators:0 "Все Джексану вгору!"
jck_kill_the_ruminators_desc:0 "Посміхнись, га?"

jck_killing_tribes:0 "Без більше Батьків"
jck_killing_tribes_desc:0 "Ці... дивакуваті жителі монумента, що колись був символом демократії, стали занозою. Час їх знести. Людей, не монумент. Хоча... може, й монумент теж."

jck_ending_the_republic:0 "Родини проти Республік"
jck_ending_the_republic_desc:0 "Республіка це, республіка те... Ці пустельники геть не розуміють, що воно таке. Але їхня боротьба й життя мені нагадує нас. Тож хай приєднуються до родини."

jck_ruminator_stations:0 "Забрати їхні притулки..."
jck_ruminator_stations_desc:0 "Вірні — але не дуже організовані. Переосмислимо їхні «клуби» під наші потреби."

jck_cute_little_books:0 "І Їхні Смішні Книжечки!"
jck_cute_little_books_desc:0 "Кролика журналом не впіймаєш, але якщо навчити малечу читати — може й користь буде... сподіваюся."

jck_metal_mouths:0 "Наступаємо на їхнє поле"
jck_metal_mouths_desc:0 "Металеві Щелепи... «Кіборги». Люди, що думають, ніби стали машинами. Смішно, правда? Напхати себе всякою хрінню, думаючи, що це щось дає — коли я просто кулею в лоб."

jck_havre:0 "Зупинити Боголюбів"
jck_havre_desc:0 "Уяви: жінка вірить, що Америка — це ангел, а не країна. Та ми ЖИЛИ в Америці. І знаємо, чого вона варта. До того ж — вона нам заважає."

jck_scrapping_metal_mouths:0 "Позбутись сміття"
jck_scrapping_metal_mouths_desc:0 "Металеві Пащі мали купу брухту. Перетворимо це на щось корисне. Тіла — в багаття."

jck_stm:0 "Розрізати небо"
jck_stm_desc:0 "Якщо тобі здавались божевільними ті з «Ліберті» — ці ще гірші. Вони тебе швидше на повітряного змія пустять, ніж поговорять. Такий світ нам не підходить. В Монтані таким не місце."

jck_welcome_back:0 "Вчасно на обід"
jck_welcome_back_desc:0 "Як мозок Анклавівця вилітає з-під шолома — таке не забувається. Надихає, чесно."

jck_show_them_up:0 "Заткнути Їм Пельку"
jck_show_them_up_desc:0 "Анклаву більше нема. Їхні іграшки з Чикаго, стара техніка — все наше. Наші майстри з нашими науковцями вже роблять нову броню: §YБроня Гермес§!. Хто б міг подумати."

jck_i_remember_the_old_days:0 "Я пам’ятаю старі дні"
jck_i_remember_the_old_days_desc:0 "Старі добрі часи. Мама Джексон садила квіти, тати росли самі. А тепер ми повернулись. І старе знову стане новим."

jck_friends_out_west:0 "Друзі на Заході"
jck_friends_out_west_desc:0 "«Вартові Білого» були непоганими охоронцями на наших канікулах на Заході. А тепер, коли ми при владі... може, обміняємося чимось більшим, ніж кришки?"

jck_cult_of_liberty_churches:0 "Вірні Америці"
jck_cult_of_liberty_churches_desc:0 "Якісь культові чудаки прийшли зі своєю гуманітаркою. Кажуть, демократію люблять так само, як ми! Хоч і по-своєму... дивно."

jck_just_enough_rage:0 "Якраз Достатньо Люті"
jck_just_enough_rage_desc:0 "Лють зварить людину живцем, якщо нею не керувати. Дамо хлопцям вихід, окрім полювання та грабунку."

jck_coal:0 "Вугільна Компанія? До біса!"
jck_coal_desc:0 "Якась вугільна шарашка, ще з часів до нашого вигнання. Закінчимо цю дурню."

jck_coal_2:0 "Цапнули Вугілля!"
jck_coal_2_desc:0 "Тепер у нас є паливо — розпалимо вогонь, що в нас усередині, ще дужче!"

jck_the_other_folks:0 "Інші Металеві Люди"
jck_the_other_folks_desc:0 "Називають себе Братством. Не родина, як ми, а якісь лицарі. Побачимо, як їм сподобається наше «лицарство»."


#ideas
jck_welcome_to_the_family:0 "Ласкаво просимо до нашої Родини!"
jck_welcome_to_the_family_desc:0 "Після вигнання з Міссули родина Джексонів озлобилась і втратила довіру до чужинців, вірячи, що всі навколо — вороги, кожна родина. Але згодом прийшло розуміння: їхня родина складалась з викинутих на узбіччя, сиріт і вдів. Джексони завжди мали традицію всиновлювати вуличних дітей. І тепер, коли одна з таких, прийомна дочка Ліббі, веде наступ, Джексони розширюють родинне дерево на весь північний фронтир. Ти — Джексон, просто ще цього не знаєш. Особливо якщо любиш рейди."

jck_only_family:0 "Лише Родина"
jck_only_family_desc:0 "Джексони зупиняться лише тоді, коли помстяться Анклаву. Але це не означає, що будь-який рейдер-пройдисвіт може долучитись до них, або що помста — єдина причина їхньої люті. Марі Джексон, дочка Ніла і справжня виживачка, очолює повернення додому. Але їй байдуже до інших родин — тож радійте, нових правителів не хвилює, ким ви були."

jck_the_family:0 "Лють Джексонів"
jck_the_family_desc:0 "Джексонів нині знають за їхню лють. Так було не завжди, але після років виживання в диких умовах, ця лють стала їхнім благословенням."

jck_the_coal:0 "Джек — Вугляр"

#Tool-Tips
jck_3a_tt:0 "§OЛіббі, натхненна історією Папи Ніла про прийняття, переконує його підтримати її ідеї! Своєю хитрістю вона залучить до нас рейдерів з усіх усюд, розширюючи нашу Родину! Але через це Марі відступить у тінь.§!"

jck_3b_tt:0 "§YМарі, наповнена духом честі після батькової розповіді, переконує його підтримати її спецпризначенців і зробити наші сили виключно джексонівськими! Це дасть величезний бонус бойовим частинам, але коштуватиме людських ресурсів. Ліббі ж, розчарована, піде займатися в'язанням! Як мило!§!"