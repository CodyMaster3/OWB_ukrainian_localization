LGS_ZORRO_DE_CHIHUAHUA_NAME:0 "Зорро з Чіуауа"
LGS_ZORRO_DE_CHIHUAHUA_DESC:0 "Люди пустелі Чіуауа – витривалі. Вони вирощують врожай на землі, де зазвичай ростуть лише кактуси. Вони б’ються з палючим сонцем і засухами – й усе одно виходять переможцями. Бо вони не лише виживають, а й творять життя. Недарма мешканці пустки називають цей регіон «Житницею Мексики».\n\nАле ворогами тут є не лише погода чи дика природа. На сході – розростається хибна демократія, якій було б дуже зручно бачити нас у складі своєї держави. На півдні – картелі. А на півночі – справжня пошесть пустки: Легіон. «Гранхеро» міцні духом, але не можуть протистояти ворогам, які приходять або з грубою силою, або з темними змовами, або з солодкими словами. Зорро з Чіуауа поклявся захищати цю землю від усього – навіть якщо шанси проти нього.\n\nСам Зорро – загадка. Ніхто ніколи не бачив його обличчя, і з’явився він одного дня ні звідки, взявши на себе цю роль. Хтось каже – це зганьблений лучадор, що втратив свою маску. Інші – колишній картелівський бандит, що ховає справжнє ім’я, аби врятувати шкуру. А можливо – раб Легіону, який утік з Арізони. Ніхто не знає напевно. Одне тільки ясно – він тут. І він не піде."