l_english:
  nf_whitelegs_history.1.t:0 "Оповіді наших Батьків"
  nf_whitelegs_history.1.d:0 "Наші шамани розповідають про перших людей, народжених у світі диму та попелу. Ці люди говорили старою мовою й носили дрібнички та скарби з давно загублених часів. Вони блукали спустошеними землями, залишками світу, що впав у руїну.\n\nЗ часом перші люди вимерли. Їхні історії та речі, тіні мертвого світу, зникли в забутті. Нам вони не були потрібні, бо Білоногі, плем’я виживання, не мали з них користі. Ми відмовились від їхньої мови, залишили їхні реліквії й створили своє власне життя.\n\nНовий світ — для нас.\n\nІ все ж, одне послання перших людей, здається, залишилося з нами — керівний принцип, переданий через покоління:"
  nf_whitelegs_history.1.a:0 "Хитра лисиця з'їдає кроля."
  nf_whitelegs_history.1.b:0 "Кролик перехитрив лисицю."

  nf_whitelegs_history.2.t:0 "Виживання Найсильнішого"
  nf_whitelegs_history.2.d:0 "Довгі роки ми не були сильним плем’ям. Багато з нашого люду гинуло — від хвороб, нападів Вісімдесятників, навіть від диких звірів. Лише коли ми почали зрікатися зв’язку зі старим світом, ми справді почали процвітати в новому.\n\nМи зрозуміли, що виживання вимагає безжальності й відмови від старих сентиментів. Милосердя стало слабкістю, яку ми більше не могли собі дозволити. Щоб вижити, ми мусили змінитись, забути старі звичаї й прийняти суворі реалії пустки."
  nf_whitelegs_history.2.a:0 "Милосердя — це слабкість."
  nf_whitelegs_history.2.b:0 "Ми зробили те, що мусили."

  nf_whitelegs_history.3.t:0 "Вітри Змін"
  nf_whitelegs_history.3.d:0 "Протягом багатьох років ми, Білоногі, безжально вбивали місіонерів і торговців, які наважувалися заходити або навіть проходити через наші землі. Для нас ці чужинці були загарбниками — такими ж, як і супермутанти чи Вісімдесятники. Але зростання числа осілих народів принесло з собою глибокий, гризучий страх.\n\nЧутки про божество, що об'єднує племена Аризони, західних торговців, які прагнуть нашої землі, і місіонерів Нью-Ханаану з їхнім боговірством — усе це викликало занепокоєння в нашому племені. Ми боїмося світу, в якому для нас не залишиться місця, де нікуди буде тікати, не буде чого їсти, і лише голод чекатиме на нас.\n\nСіль-на-Ранах споглядає ці зміни з жахом. Загроз для нашого народу безліч, і наше відчайдушне становище посилюється. Потреба в рішенні, у шляху до виживання серед наступу осілого світу, стала надважливою."
  nf_whitelegs_history.3.a:0 "Ми готувались до кінця днів."
  nf_whitelegs_history.3.b:0 "Ми благали богів дати відповідь."

  nf_whitelegs_super_mutants.1.t:0 "Мутанти Заходу"
  nf_whitelegs_super_mutants.1.d:0 "Понад сто років тому, зі смертю Вождя Всіх Потвор, супермутанти почали блукати Ютою у пошуках скарбів, м’яса та різанини. Вони грабували домівки осілих людей, але Білоногі були хитрими. Без постійних осель, ми могли втікати, коли заманеться — наші ноги швидші, наші люди витриваліші.\n\nКоли мутанти почали вичерпуватися та билися між собою, ми напали. Ми ловили й убивали їх, використовуючи їхній хаос. Ці мутанти не мали дітей — і Білоногим це здавалося дивним. З кожним поколінням мутантів ставало менше. Доля захоплених супермутантів була вирішена нашими предками."
  nf_whitelegs_super_mutants.1.a:0 "Вони — підлегле плем’я, «Сильні Спини»."
  nf_whitelegs_super_mutants.1.a_tt:0 "\n Декілька супермутантів, що залишились серед Білоногих, «Сильні Спини», з’являються для битви."
  nf_whitelegs_super_mutants.1.b:0 "Ми перетворили Сильні Спини на рабів."
  nf_whitelegs_super_mutants.1.c:0 "Прокляті чудовиська! Ми винищили їх!"

  nf_whitelegs.4.t:0 "Арсенал у Спеніш-Форк"
  nf_whitelegs.4.d:0 "Наш народ співатиме про цю перемогу поколіннями! Улісс привів загін воїнів до Спеніш-Форк — і прорвався. У сміливому нальоті, вирізаючи Новоканеанців, мов брамінів на забій, ми увірвалися до фортеці й утекли зі сотнями, ні, тисячами одиниць зброї та боєприпасів. Тепер Улісс готується вести наш народ до фінальної битви. До бою! До бою!"
  nf_whitelegs.4.a:0 "Сльози в його очах — певно, від гордості."
  nf_whitelegs.4.a.tt:0 "Ви отримаєте 5,000 Громових Барабанів. Байка-гуд, друже!\n\n"

  nf_whitelegs.5.t:0 "Наліт Білоногих!"
  nf_whitelegs.5.d:0 "Якимось чином Білоногим вдалося прорватися через наші землі. Ми не знаємо, де саме вони вдарили, але загони ополчення, що переслідували їх, були розбиті Білоногими, озброєними потужною зброєю, якої вони ніколи раніше не мали."
  nf_whitelegs.5.a:0 "Навіть коли йду долиною тіні смертної, не боюся зла, бо ти зі мною."

  nf_whitelegs.6.t:0 "Автострада до Пекла"
  nf_whitelegs.6.d:0 "[EHT.GetName] були колючкою в нашому боці занадто довго, але тепер вони стоять на шляху нашої долі. [213.GetName] відкриє нам шлях до нападу на Ханаанців, коли ті будуть неготові. [WHT.GetLeader] повинен вирішити, як здобути контроль над цією важливою територією. На щастя, схоже, що Вісімдесятники готуються до Великої Дорожньої Подорожі — епічного плану відвоювання дому в [NCR.GetName]. Вони можуть бути готові віддати нам цю спустошену смугу землі."
  nf_whitelegs.6.a:0 "Обіцяти [EHT.GetName] здобич після перемоги над Нью-Ханааном."
  nf_whitelegs.6.b:0 "Обміняти товари на землю."
  nf_whitelegs.6.c:0 "Обмін? Ти забув, скільки в нас воїнів?"
  nf_whitelegs.6.c_tt:0 "\nПочинає прикордонну війну за захоплення території.\n"

  nf_whitelegs.7.t:0 "Автострада до Пекла"
  nf_whitelegs.7.d:0 "[WHT.GetLeader] просить [213.GetName], щоби атакувати пихатих дурнів із Нью-Ханаану. Хоча ми неохоче віддаємо землю, якою колись їздили наші колеса, ця територія відверто марна. Оскільки [WHT.GetLeader] пообіцяв нам багатства та скарби з Нового Канеану, можливо, ми укладемо цю угоду."
  nf_whitelegs.7.a:0 "Нехай воюють. У нас є плани важливіші."
  nf_whitelegs.7.b:0 "Віддати нашу землю, що не має стратегічної цінності? Аж ніяк!"

  nf_whitelegs.8.t:0 "І стіни Єрихону впали"
  nf_whitelegs.8.d:0 "[EHT.GetName] погодилися віддати нам [213.GetName]. Ми будемо винні їм здобич з Нью-Ханаану, але це дрібниця в порівнянні з багатствами, що нас очікують."
  nf_whitelegs.8.a:0 "І [WHT.GetLeader] увійшов та пройшов крізь Єрихон."
  nf_whitelegs.9.t:0 "Вісімдесятники відкинули нас!"
  nf_whitelegs.9.d:0 "[EHT.GetLeader] відмовився передати Єрихон і прив'язав наших посланців до свого авто, волочачи їх по дорозі — ознака цілковитої зневаги. Він відкинув нашу щедру пропозицію та зневажив право гостинності."
  nf_whitelegs.9.a:0 "Ми спустимо йому шини й запалимо вогні!"
  nf_whitelegs.9.a_tt:0 "Відкриває прикордонну війну за Єрихон."

  nf_whitelegs.10.t:0 "Білоногі приносять дари"
  nf_whitelegs.10.d:0 "[WHT.GetLeader] пропонує нам дари та данину в обмін на [213.GetName]. Без сумніву, він хоче цю провінцію для війни з Нью-Ханааном, але його дари стануть нам у пригоді під час Великої Дорожньої Подорожі."
  nf_whitelegs.10.a:0 "Перекус у дорозі завжди стане в пригоді."
  nf_whitelegs.10.b:0 "Геть звідси, або ми тебе розчавимо."

  nf_whitelegs.11.t:0 "І стіни Єрихону впали"
  nf_whitelegs.11.d:0 "[EHT.GetName] погодились передати нам [213.GetName]. Нам довелося пожертвувати частиною нашого багатства, але ми повернемо його з лишком, коли розграбуємо Нью-Ханаан."
  nf_whitelegs.11.a:0 "І [WHT.GetLeader] увійшов і пройшов через Єрихон."

  nf_whitelegs.12.t:0 "Успішний наліт за рабами!"
  nf_whitelegs.12.d:0 "[WHT.GetLeader] знову повів свій народ у героїчний наліт. Ми знайшли нових рабів для обробітку наших земель і нові завоювання, що грітимуть нам ложа. А народи Пустки завжди куплять ще рабів."
  nf_whitelegs.12.a:0 "Для них буде честю — служити."
  nf_whitelegs.12.a_tt:0 "\n [WHT.GetName] отримує 200 рабів."

  nf_whitelegs.13.t:0 "Вождь Юти"
  nf_whitelegs.13.d:0 "[CLK.GetNameDef] упокорені. Смоляні Ходоки поповзли в безпечне місце. А народ Нью-Ханаану плаче перед своїм новим паном. Та ось прийшов час для [WHT.GetLeader] вшанувати своїх воїнів. Кому він подякує найбільше за перемогу?"
  nf_whitelegs.13.a:0 "Отцю і Сину, що благословляють вірних."
  nf_whitelegs.13.b:0 "Могутньому Цезарю, що навчив нас усього."
  nf_whitelegs.13.c:0 "Білоногі увійшли до Ханаану. Навіщо дякувати іншим?"

  nf_whitelegs.14.t:0 "З Попелу, Кістки й Солі Повстає Новий Вождь!"
  nf_whitelegs.14.d:0 "Військовий табір смердить кров'ю, потом і димом. У центрі реве велике вогнище. Навколо нього нефійці шепочуть заборонені вірші, давно забуті світом. У самому центрі Сіль-на-Ранах стоїть на колінах, схиливши голову.\n\nДо вогню підходить шукач духів — на його обличчі сажа від спаленого письма, а в руках він несе вінок із кісток, вирізаних зі скелетів мертвих з Ханаану, скріплених уламками їхніх зруйнованих церков. Піднімає його вгору й говорить:\n\n\"Старий світ згорів. Старі нефійці вирізані. Людина загинула, розвіяна, як пил. Але вогонь — не кінець. Ні. Із попелу повстає праведний. З кістки чужинця Зайон бере корону знову. З руїни — сила. Зі смерті — життя.\"\n\nШукач духів опускає вінок, дивлячись Солеві-на-Ранах в очі. Полум’я танцює по вибілених кістках мертвих.\n\n\"Ти не просто людина. Не просто вождь. Ти — лезо в руці Зайону, що вирізає слабкого чужинця з землі. Ти — вогонь, що палить брехню, освітлює шлях сильним. Ти — молот, що ламає ланцюги, формує світ на славу Предків. Ти — Зайон. Полум’я-на-Ранах. Зайон — не місце. Зайон — це війна. Зайон — це суд. Зайон — це ти.\"\n\nВінок покладається на голову Соля-на-Ранах. Білоногі виють від захвату. Їхній воєначальник не здригається. Не рухається. Але коли підіймається — він уже не людина. Він — Зайон.\n\nВін не бере ім’я. Він стає ім’ям. Він — Зайон, Полум’я-на-Ранах, і його плем’я виріже Зайон із кісток негідного чужинця!"
  nf_whitelegs.14.a:0 "Вдарте нас, якщо зможете!"

  nf_whitelegs.15.t:0 "Горді служити"
  nf_whitelegs.15.d:0 "Кігті Легіону вчепилися в Білоногих, як у багато племен до них. Білоногі заплітають волосся на честь Улісса. Вони ховають жінок і більше не дозволяють їм воювати. Вони шлють рабів, молодь і скарби Юти до Флагстаффа. Вони підкорені, та, як і багато хто до них, зрозуміли це запізно. Крок за кроком їх вели до речей, що ведуть до розпусти — лінь, купелі, розкішні бенкети. Все це в своїй наївності вони назвали цивілізацією, хоча це була лише форма рабства."
  nf_whitelegs.15.a:0 "Ми повинні пишатися нашими новими звичаями."

  nf_whitelegs.16.t:0 "Улісс утікає!"
  nf_whitelegs.16.d:0 "Перед падінням Нью-Ханаану Улісс... змінився. Він бурмотів, що стіни Ханаану занадто горді для Цезаря, і наче глузував із нас за наші ритуали зарядження зброї духами. Замість того, щоб пишатися роллю Ока Цезаря на Великому Солоному Озері, нашими завоюваннями, він удавав, ніби ми — просто персонажі у чужій історії.\n\nЗа його наказом ми вбивали жінок, дітей, матерів, слабких, старих. Ми нападали вночі, мовчки, з вогнем — на Канеанців. Ми здобули панування над Ютою! І він вважає це жартом?\n\nПеред тим як зникнути, він залишив щоденник, де писав, що ми — голодні привиди, які вклоняються Легіону, немов діти, замість того щоб усвідомити свою силу. Дурень забув: ми використовуємо Легіон так само, як Легіон використовує нас. І хіба не цікаво: якщо Улісс так соромиться вчиненого, чому тікає — замість того, щоб боротися за правду?"
  nf_whitelegs.16.a:0 "Можливо, ми сплутали божевілля з мудрістю."

  nf_whitelegs.17.t:0 "Зрада з боку [WHT.GetLeader]"
  nf_whitelegs.17.d:0 "Хоча [WHT.GetName] і обіцяли поки що залишити нас у спокої, наші розвідники впевнено стверджують: [WHT.GetLeader] вдарить при першій нагоді. Якщо почнеться війна, Білоногі, ймовірно, спробують проколоти нам шини."
  nf_whitelegs.17.a:0 "Не дочекаюся, щоб розчавити їхній труп."
  WHT_are_assholes:0 "Білоногі — покидьки"
  nf_whitelegs.17.a_tt:0 "\n Це ускладнить подальшу співпрацю з Білоногими."
  nf_whitelegs.18.t:0 "Жінки Білоногих"
  nf_whitelegs.18.d:0 "На відміну від інших племен Юти, жінки Білоногих є такими ж вільними, як і чоловіки. Але радники Легіону ображають наших жінок, стверджуючи, що лише слабке плем’я дозволяє їм воювати. Донька [WHT.GetLeader], Сльози-Під-Дощем, убила центуріона за те, що він торкнувся її без дозволу. Легіон вимагає від нас вибачень за цю «образу»."
  nf_whitelegs.18.a:0 "Вибачитися, що не вбили ще більше з них!"
  nf_whitelegs.18.a_tt:0 "\nЛегіон сприйме це як велику образу, але хто з дикарів поводиться так, як вони?\n"
  nf_whitelegs.18.b:0 "Сплатити кровну ціну за доньку."

  nf_whitelegs.19.t:0 "Ось і Наречена"
  nf_whitelegs.19.d:0 "На наше велике здивування, Сльози-Під-Дощем оголосила, що візьме собі чоловіка з-поміж канеанців. Вони зустрілися в епічній битві, і після цілого дня перестрілок із засідок на них напав кігть смерті — їм довелося битися разом. Уночі він перев’язав її рану, а вона поділилася браміновим джеркі, і... ну...\n\nХанаанець присягнув не братись до зброї проти народу своєї дружини, а наша донька погодилася вийти за нього. Що нам робити?"
  nf_whitelegs.19.a:0 "Якщо він добрий для неї, то й для мене згодиться."
  nf_whitelegs.19.b:0 "Неохоче відвідати церемонію."
  nf_whitelegs.19.b_tt:0 "\nА що, ти справді думаєш, що можеш контролювати жінку Білоногих? Вона ж нас перестріляє!\n"

  nf_whitelegs.20.t:0 "Поезія нашого Народу"
  nf_whitelegs.20.d:0 "Чужинці називають нас дикунами, але ми знаємо — ми одні з найкращих поетів Пустки. Один з наших воїнів склав вірш, присвячений завоюванню Нью-Ханаану.\n\nВождь у броні\nзолоте це кільце,\nцей перстень — на моїй правій руці,\nде відпочивали соколи.\nДар сяє ясно,\nрука — його гак;\nчесть здобута\nна бенкеті воронів."
  nf_whitelegs.20.a:0 "Мудрі його слова, героїчне його серце."

  nf_whitelegs.21.t:0 "Сплатити Борги"
  nf_whitelegs.21.d:0 "Ми захопили Нью-Ханаан і, як і обіцяли, поділимося здобиччю з Вісімдесятниками. Дехто просить [WHT.GetLeader] порушити слово, але Білоногі — народ честі."
  nf_whitelegs.21.a:0 "Нечесна людина, що порушує слово!"

  nf_whitelegs.22.t:0 "Стіна Єрихону"
  nf_whitelegs.22.d:0 "Ми захопили Єрихон у Вісімдесятників. Хто тепер посміє нам протистояти?"
  nf_whitelegs.22.a:0 "І стіни впадуть."

  nf_whitelegs.23.t:0 "Стіна Єрихону"
  nf_whitelegs.23.d:0 "На жаль, Вісімдесятники втримали стіни Єрихону. Доведеться шукати інший шлях до Нью-Ханаану."
  nf_whitelegs.23.a:0 "Одного дня ми повернемо собі честь."

  nf_whitelegs.24.t:0 "Єрихон Падає"
  nf_whitelegs.24.d:0 "Якимось чином Білоногі вибили наших людей з Єрихону. Хоч це й марна солончакова ділянка, але все одно... ті покидьки."
  nf_whitelegs.24.a:0 "Ми ще поквитаємось із ними."
  nf_whitelegs.24_tt:0 "\n[213.GetName] перейде під контроль [WHT.GetLeader]"

  nf_whitelegs.25.t:0 "Єрихон Стоїть!"
  nf_whitelegs.25.d:0 "[WHT.GetLeader] доведеться спробувати знову, бо ми втримали Єрихон. Дурень."
  nf_whitelegs.25.a:0 "Соси й здохни, дикуне."

  nf_whitelegs.26.t:0 "Чого ми навчаємось у Темряві"
  nf_whitelegs.26.d:0 "[WHT.GetLeader] випив священний чай і чекав у печері заходу сонця. Він ступив у прохолодну місячну ніч і побачив світ таким же ясним, як удень. Йому з’явилися видіння: зелені люди в тарілках, чорні комахи розміром з людину, кігті смерті в мантіях. Але він ішов далі — і попрямував до очищувального вогню, де побачив палаючого яоґая.\n\nДехто спробував би заговорити з духом, але це ніколи не було шляхом [WHT.GetLeader]. Наступного ранку він повернувся в табір із новим трофеєм. Гарне нагадування: усі проблеми мають одне рішення."
  nf_whitelegs.26.a:0 "Плем’я запам’ятає це."

  nf_whitelegs.27.t:0 "Чия Це Дитина?"
  nf_whitelegs.27.d:0 "[WHT.GetLeader] вислухав двох жінок. Вони жили в одному наметі, дружини воїна, що був у поході. Обидві народили йому доньку, але одна з дівчат померла. «Гаразд», сказав Сіль-на-Ранах. «Хіба ви не знаєте, чия це дитина? Як ви не впізнаєте власну доньку?»\n\n«О, Вождю», сказала одна, «вона моя, я її годувала грудьми». — «О, Вождю», мовила інша, «вона моя, я витирала її сльози». І тоді Вождь сказав: «Влаштуймо змагання». — «Так! Потягнемо дитину!» — сказала перша. — «Та, що любить її більше, тягнутиме дужче».\n\n«Ні!» — скрикнула інша. — «Віддайте їй дитину! Я краще її втрачу, ніж нашкоджу!»\n\n[WHT.GetLeader] зрозумів, що друга жінка — справжня мати. Проте...\n\n«Одна з вас — мати. Але навіть у найкращому випадку справжня мати не проявила співчуття до жінки, що втратила дитину. Я сам виховаю цю дівчинку. Відтепер її зватимуть Танцююча-На-Могилах-Своїх-Ворогів.»"
  nf_whitelegs.27.a:0 "Плем’я запам’ятає це."

  nf_whitelegs.28.t:0 "Кодекс [WHT.GetLeader]"
  nf_whitelegs.28.d:0 "[WHT.GetLeader] виріс у наметі, але не хотів, щоби його діти жили так само. Після завоювання Нью-Ханаану він видав збірку законів, натхненну канеанськими настановами, порадами Легіону й племінною мудрістю. Кодекс Соля мав визначити майбутнє племені. Ось деякі з його законів:\n\n2. У спадкуванні дочкам і синам слід давати однакову частку.\n\n6. Релігійні діячі, проповідники, монахи, лікарі й ті, хто спалює тіла мертвих — звільняються від податків.\n\n15. Жоден підданий не має права брати Білоногу людину за слугу чи раба. Кожен чоловік, за винятком рідкісних випадків, має служити в армії. Жінкам не можна відмовляти у вступі до війська.\n\n20. Діти, народжені від рабинь, є законними, як і діти від дружин.\n\n32. Заборонено купатися або прати одяг у проточній воді під час грози."
  nf_whitelegs.28.a:0 "Плем’я запам’ятає це."

  nf_whitelegs.29.t:0 "Допомога від Легіону"
  nf_whitelegs.29.d:0 "Легіон надіслав торгову делегацію та радників. Це може стати цінною підтримкою для нас, але також дасть їм більше впливу на наші справи. Чи сядемо ми вечеряти з Биком, чи цього разу підемо своїм шляхом?"
  nf_whitelegs.29.a:0 "Послухаймо їх."
  nf_whitelegs.29.b:0 "Ми стоїмо на власних ногах."

  nf_whitelegs.30.t:0 "[WHT.GetLeader] Слухає"
  nf_whitelegs.30.d:0 "Сіль-на-Ранах виявив люб’язність, вислухавши наші настанови та прийнявши нашу торгівельну пропозицію. Добре для нього... але ще краще для нас."
  nf_whitelegs.30.a:0 "Нове поле для битви."

  nf_whitelegs.31.t:0 "[WHT.GetLeader] Відкинув Нашу Допомогу"
  nf_whitelegs.31.d:0 "Сіль-на-Ранах був готовий вислухати нашу пропозицію, але ввічливо відмовився від допомоги. Втім, він не виключає подальших переговорів у майбутньому."
  nf_whitelegs.31.a:0 "Можливо, він розумніший, ніж ми гадали."


  #######################
  #nf_whitelegs.32.t:0 "The Light of the Lord"
  #nf_whitelegs.32.d:0 "The [WHT.GetName] are called pagans by some, but they hold to the lessons of Christ in their own way. They follow the Gospel for a colder, harsher world. In the tales of the White legs the disciplies of Christ are like the band of a chieftain, not fishers of men. John the Baptist is brought up as a warrior-companion of Christ, and pledges to stand fast together with the Lord. For the White Legs, Jesus turned the disciples into a powerful force of many peoples, a holy army. And when Jesus dies upon the Cross, he descended into Hell to do battle with the forces of darkness. \n\nA harsh faith, but not, perhaps, a bad one for the Wastes. And when [WHT.GetLeader] listens to the tale of Samson in the Temple, perhaps he can see the similarities to the teachings of the Canaanites. \n\n"
  #nf_whitelegs.32.a:0 "Amen."
  #nf_whitelegs.32.a_tt:0 "\nYour Lord, Saviour Christ, from the city of Nazareth, \nHim whom the Legions of Rome did torture and nail to the cross,\nHim sinless they laid the grave. He himself is not there,\nBut he has arisen, and this place is empty.\nFor the boon of mankind, and many a bolt,\nWas unlatched on hell's doors, and the way to Heaven \nFrom the world was fashioned."
