l_english:
  wht_bombs_origins:0 "Смерть Старого Світу"
  wht_bombs_origins_desc:0 "Це Другий Світ, народжений із попелу покарання Отця."

  wht_struggling_to_survive:0 "Боротьба за Виживання"
  wht_struggling_to_survive_desc:0 "Багато років ми справді стояли на межі вимирання."

  wht_supermutant_invasion:0 "Чудовиська серед Нас"
  wht_supermutant_invasion_desc:0 "Після смерті свого великого вождя, супермутанти хлинули крізь Юту до безкраїх рівнин. Дехто з них залишив слід у нашій культурі."

  wht_winds_change:0 "Вітри Змін"
  wht_winds_change_desc:0 "Небо горіло майже двісті років тому, але відтоді змінилось багато. Настав час змінитися й нам."

  wht_glories_caeasar:0 "Новий Бог для Юти"
  wht_glories_caeasar_desc:0 "Посланці розповіли нам про великого вождя з Флагстаффа. Людину, що вимагає беззастережного підкорення, і воїни якого служать до смерті. Ми можемо навчитися від нього. Можливо, ми навіть надішлемо своїх воїнів йому на службу як найманців."

  add_300_caps_tt:0 "[WHT.GETNameWithFlag] отримає 300 кришок.\n"

  wht_mormon_slaves:0 "Раби з Нью-Ханаану"
  wht_mormon_slaves_desc:0 "Дехто з наших рабів сповідує мормонську віру. Як нерозумно – вклонятися мертвому богові в мертвому світі. Але наші жінки знаходять у їхніх словах щось привабливе..."

  wht_strong_arms_white_legs:0 "Сильні Руки Білоногих"
  wht_strong_arms_white_legs_desc:0 "Нашому народу не потрібні чужинці для натхнення. Ми – сіль Землі, Озера й Неба."
  wht_strong_arms_white_legs_tt:0 "Ми збільшимо прихильність наших богів. Хвала!\n"

  wht_god_salt:0 "Бог Солі"
  wht_god_salt_desc:0 "Щоб вижити в нескінченній зимі та під палючим сонцем, наш народ шанував сіль. Більше за зброю, наркотики чи золото – сіль є валютою нашого племені. А сіль – це знак його благословення."

  wht_god_lake:0 "Бог Озера"
  wht_god_lake_desc:0 "Мормони вигнали нас зі священних вод, але ми одного дня повернемось, щоб здійснити обряди на спіральному пірсі."

  wht_god_sky:0 "Батько Небесний"
  wht_god_sky_desc:0 "Мормони – дурні, але в одному вони мають рацію: є великий батько на небі. Шкода, що ми здобули його прихильність своїми хоробрими вчинками!"

  wht_welcome_traders:0 "Повернути Торговців"
  wht_welcome_traders_desc:0 "Історично ми завжди нападали на торговців, що заходили на наші землі. Та наші раби з Ханаану попереджають – ми могли б заробити більше, якби заслужили їхню довіру й вітали їх."

  wht_training_caesar:0 "Уроки від Цезаря"
  wht_training_caesar_desc:0 "Наші люди повертаються зі служби Цезарю кращими, ніж пішли. Вони повертаються не просто воїнами, а солдатами."

  wht_guns_from_flagstaff:0 "Зброя з Півдня"
  wht_guns_from_flagstaff_desc:0 "З тіснішими зв’язками з Легіоном, майстерні Імперії відкриваються для нас."

  wht_slave_raiding:0 "Рабовласницькі Нальоти для Флагстаффа"
  wht_slave_raiding_desc:0 "Найкращий спосіб зберегти багатство й владу племені – скористатися одним із небагатьох ресурсів Юти: її слабкими, беззахисними людьми."

  add_200_slaves:0 "Надає §G200§! рабів.\n"
  add_5k_slaves:0 "Надає §G5,000§! рабів.\n"
  add_10k_slaves:0 "Надає §G10,000§! рабів.\n"
  unlock_slave_raiding:0 "Відкриває можливість починати прикордонні нальоти за рабами для ринків Пустки.\n"

  wht_copper_mines:0 "Мідна шахта у Фріско"
  wht_copper_mines_desc:0 "Торговці просять дозволу обшукати стару яму в землі. Вони стверджують, що знайдуть там мідь і шахтарське обладнання. Ми не знаємо, що саме вони шукають – але плату за доступ візьмемо."

  wht_sell_animal_skins:0 "Продати Шкури Тварин"
  wht_sell_animal_skins_desc:0 "Шкури брамінів, ґеконів, бобрів – це наші небагаті ресурси. Скористаймось ними сповна."

  wht_good_book:0 "Поширення культу Нефійців"
  wht_good_book_desc:0 "Попри заборону, караван Щасливих Стежок проніс до нас тексти. Деякі шукачі духів почали сприймати ці історії – ті самі, що проповідують у Ханаані. З’явився культ Нефійців: ті, хто обмазується попелом спаленого письма, проповідує вічну славу Зайону і стверджує, що Білоногі – прямі нащадки стародавнього племені нефійців."

  wht_god_old:0 "На Честь Старих Богів!"
  wht_god_old_desc:0 "Нам не потрібні ні ангел Мороній, ні культ Марса. Ми вшановуємо Великих Древніх, які провели нас через Страждання!"

  wht_guns_from_legion:0 "Поставка Зброї"
  wht_guns_from_legion_desc:0 "Могутній Цезар подарував нам зброю на знак своєї прихильності. Ми зважимо на його поради після такого дарунку."

  wht_clock_breaking:0 "Пильнування Годинників"
  wht_clock_breaking_desc:0 "Розвідники Білоногих натрапили на дивні знаки в Пустці – й знайшли вхід до Сховища 24. Сіль-на-Ранах наказав наліт. Багато хто з племені ніколи не бачив сталевих коридорів і не чув лякаючого цокання годинників. У цьому поході буде потрібне все плем’я!"

  wht_tar_walking:0 "Палаюча Смола"
  wht_tar_walking_desc:0 "Смоляні Ходоки, вражені кіптявою й хворобами, стали легкою здобиччю. Сіль-на-Ранах бачить у цьому можливість зміцнити владу Білоногих."

  wht_adopt_clock:0 "Зупинений Годинник Теж Має Раду"
  wht_adopt_clock_desc:0 "Сіль-на-Ранах вирішив не знищувати Хранителів Часу, а силою приєднати до племені. Ті, хто вижив і скорився, стали новим підплеменем – Цокотячими. Ми зламали їхні розклади, а вони поділилися знанням про тайм-менеджмент."

  wht_send_clock_to_flagstaff:0 "Дарунок для Флагстаффа"
  wht_send_clock_to_flagstaff_desc:0 "На знак вірності, Сіль-на-Ранах вирішив подарувати Цезарю один зі старовинних, майстерно збережених годинників Хранителів Часу. Цей символ тривалості існування, що пережив смерть Старого Світу, стане знаком сили й вірності Білоногих."

  wht_break_clock:0 "Розтрощити Годинники"
  wht_break_clock_desc:0 "Білоногі, на чолі з Сіллю-на-Ранах, увірвались до сховища, розграбували його скарби й розбили святі годинники Хранителів Часу. З цінного металу вони викували зброю й обладунок."

  wht_enslave_tar:0 "Поневолити Смоляних"
  wht_enslave_tar_desc:0 "Смоляні Ходоки довго нас дратували. Настав час зламати їхній опір і забрати те, що належить нам. Ми спустимось на їхні села з нещадністю, захоплюючи чоловіків, жінок і дітей. Легіон завжди потребує нових рабів – і щедро заплатить за них."

  add_500_slaves:0 "Додає 500 рабів до запасів. Потвора.\n"

  wht_lords_tar:0 "Володарі Смоли"
  wht_lords_tar_desc:0 "З вождями та воїнами Смоляних мертвими, їхні землі наші. Ми вирушимо в глиб рейдів, грабуючи запаси їжі, худобу й села. Їхні родючі землі прогодують наш народ і підтримають наш бойовий шлях."

  wht_wisdom_tar:0 "Мудрість Смоляних"
  wht_wisdom_tar_desc:0 "Після того як Сіль-на-Ранах знищив лідерство Смоляних, він став вождем обох племен. Під його командуванням Смоляні передали свої знання й навчили Білоногих землеробству. Союз приніс процвітання і зміцнив нашу владу."

  WHT_insult_the_legion:0 "Ворог Легіону"
  WHT_insult_the_legion_desc:0 "Ми хотіли б мати такого союзника, як Цезар, але ясно: нічого не вийде. Якщо ми хочемо бути сильними, ми повинні піднятися проти нього й довести, хто справжній вождь!"

  WHT_insult_the_legion_positive:0 "$WHT_insult_the_legion$"

  WHT_friend_legion:0 "Під Оком Легіону"
  WHT_friend_legion_desc:0 "Сіль-на-Ранах з благоговінням вимовляє ім’я – Цезар, Син Марса, вогонь у небі, червоний і палаючий. Не людина, не слабкий – воля в плоті, війна і сила. Його погляд – не дар, його рука – не милість. Лише ті, хто стікає кров’ю, горить і ламає світ у його імені, можуть стояти в його вогні. Білоногі мають довести, мають боротись, мають схилитись перед Сином Марса – або згинути в попелі."

  ruler_greater_25.tt:0 "Правитель повинен мати понад 25% підтримки фракції"

  WHT_ulysses:0 "Фрументарій прибуває, щоб вести нас"
  WHT_ulysses_desc:0 "Цезар надіслав фрументарія, щоб допомогти нашому племені. Він обіцяв навчити нас смерті й руйнуванню, поки ми переслідуватимемо ворогів Цезаря. Дехто ставить під сумнів його присутність у наших радах, але Сіль-на-Ранах знає: жоден чужинець не стане вождем. Тож чим він нам загрожує?"

  WHT_braid_hair:0 "Заплести Волосся"
  WHT_braid_hair_desc:0 "На честь Улісса, який приніс нам багатство, силу й славу, ми переймемо його зачіску. Що ще може зробити чоловіка щасливим?"

  WHT_legion_training:0 "Навчання Легіону"
  WHT_legion_training_desc:0 "Легіон кориться Цезарю навіть у смерті. Ми можемо навчити наш народ такій самій відданості."

  WHT_arms_depots:0 "Збройові Склади"
  WHT_arms_depots_desc:0 "По всій Юті розкидані склади, бункери й інші залишки Старого Світу. Улісс може допомогти нам знайти їх – і здобути зброю для нашої нації."

  WHT_legion_support:0 "Дарунок Бика"
  WHT_legion_support_desc:0 "Зброя прибуває в ящиках із символом Бика, а повітря насичене шипінням і низьким гарчанням. Багато з Білоногих бачать у залізі й пороху кайдани – перші ланки нашийника, що зламає плем’я. Та Сіль-на-Ранах не тремтить – він знає, що мусить бути зроблено. Хай бояться: він скористається силою Бика – будь-якою ціною."

  WHT_continue_caravan_raids:0 "Продовжити нальоти на каравани"
  WHT_continue_caravan_raids_desc:0 "Ці торговці вторгаються на нашу землю, бажаючи користуватись нашими стежками, щоб вивозити багатства... Та щойно вони перетнули наші землі – їхній крам вже належить нам!"

  WHT_happy_trails_caravan:0 "Табу з каравану Щасливих Стежок"
  WHT_happy_trails_caravan_desc:0 "Торговці з Сак-Сіті принесли спотворене писання – слова старого світу, закурені й попелясті. У ньому йдеться про воїна Моронія – найвеличнішого вождя, який створив імперію крові словом, кам’яними табличками і заклинальними словами «Свобода, Свобода, Свобода»."

  WHT_mormons_convert_warriors:0 "Кам’яний слід Предків"
  WHT_mormons_convert_warriors_desc:0 "У старому світі, в глибокій скелі, мертві люди лишали знаки. Вони створили 'камене слово', і через нього заговорили Предки! Вони говорять про велику війну, великий вогонь, синів Нефія, що підвелися, і псів Ламана, що впали! Ми слухаємо камінь! Правду табличок!"

  WHT_tater_farming:0 "Кров-Прапор Старого Вождя"
  WHT_tater_farming_desc:0 "Воїн ходив до бомб. Його звали Мороній. Міцна рука, сталевий язик, він підняв прапор – свій прапор крові! Сини Нефія зібрались, взяли вогонь і клинок, і порубали ламанітських псів! Та війна ще не скінчена! Вона досі палає!"

  WHT_safe_travels:0 "Сильні Сини стоять міцно!"
  WHT_safe_travels_desc:0 "Предки шепочуть: «Тисяча синів! Без страху! Без смерті!» Хлопці Стріплінґів ішли шляхом вогню – руками війни, руками неба! І ми підемо тим самим шляхом – кожен Білоногий стане воїном Геламана, кожна рука – клинок, кожна душа – піч! Ми не боїмося! Ми не впадемо!"

  WHT_restart_mines:0 "Чорна Рука Ґадіянтона"
  WHT_restart_mines_desc:0 "Тінь-люди, ножі-люди, брати по війні – Ґадіянтони тихі, але влучні! Сини Нефія їх боялись, пси Ламана їх кляли, але сильні знають правду: рука, що ріже – рука Божа! Без страху, без закону – лише сила!"

  WHT_mormons_ban_drugs:0 "Пси Ламана мають темні душі"
  WHT_mormons_ban_drugs_desc:0 "Вогонь старого світу випалив землю, але ще до того Предки прокляли псів Ламана! Темні серця, негідні тримати Зайон! Негідні йти шляхом неба! Вони повзають у бруді, а ми піднімаємось у вогні!"

  WHT_mormon_temple:0 "Зайон – це Трон з Черепів"
  WHT_mormon_temple_desc:0 "Слабкі говорять: «Зайон – це зелень, це мир, це небо». Брехня! Зайон – це вогонь! Це сила! Це не долина, не камінь, не земля – це трон! Трон, щоб пробити ворота неба! Слабкі впадуть, а ми піднімемось!"

  WHT_laws:0 "Прийняти культ Нефійців"
  WHT_laws_desc:0 "Предки чекають! Дивляться! Кличуть: «Де сини Нефія? Де люди війни?» Ми тут! Ми відповідаємо! Останній вогонь горить яскраво, останній удар – влучний! Більше жодних псів Ламана! Більше бруду на землі! Зайон постає! Останній вогонь, останній удар – ЦЕ СЬОГОДНІ!"

  WHT_send_youth_flagstaff:0 "Надіслати Синів у Флагстафф"
  WHT_send_youth_flagstaff_desc:0 "На знак нашої вірності Цезарю, він навчатиме найкращих юнаків бути офіцерами. А взамін – надішле нам своїх офіцерів для наших завоювань. Разом – переможемо!"

  WHT_spanish_fork_raid:0 "Випустити Барабани Шторму"
  WHT_spanish_fork_raid_desc:0 "Улісс, фрументарій, надісланий допомагати нам, виявив довоєнну фортецю зі зброєю великої сили. Він запропонував повести найкращих воїнів у наліт крізь землі Ханаану, щоби пробитися до фортеці та захопити Барабани Шторму для Легіону... тобто, для нашого племені!"
  WHT_spanish_fork_raid.tt:0 "\nЯкщо Улісс має рацію, він надзвичайно зміцнить наше плем’я та §Y[CES.GetNameWithFlag]§! вплив у ньому..."

  WHT_upheaval:0 "Сіль на Землі"
  WHT_upheaval_desc:0 "Сіль-на-Ранах стоїть перед Великим Вогнем, його тінь тягнеться над Білоногими, що стали навколішки. Старі вожді лежать розбиті, їхня кров темна у світлі вогню. Він підіймає руки й реве: «Білоногі – за мною, або згорите!»"

  WHT_strong_spears:0 "Чужинцю – Тікайте!"
  WHT_strong_spears_desc:0 "Чужинці – тікай!\nВогонь – високо!\nСіль – каже: «Бий!» – смерть прийшла!\nБілоногі – танцюють! Кістки співають!\nНаша земля тепер! Смерть прийшла вам!"

  WHT_brahmin_horn_formation:0 "Формація Рогів Браміна"
  WHT_brahmin_horn_formation_desc:0 "Сіль-на-Ранах відкрив новий спосіб битви. Білоногі нападатимуть лоб у лоб, а легші та швидші воїни охоплюватимуть ворога з боків – як роги браміна."

  WHT_youth_apprentices:0 "Творці Болі"
  WHT_youth_apprentices_desc:0 "Сіль-на-Ранах знає: армія тримається на животі. Він дарує однакову Честь жінкам і юнакам, що забезпечують плем’я – називаючи їх Почесним Іменем: Творці Болі."

  WHT_new_warriors:0 "Полум’я з Вогняних Ям"
  WHT_new_warriors_desc:0 "Із ям нашого табору лине ім’я Соля – як маяк змін. Ми танцюємо священний танець, п’ємо священний напій і вбиваємо священних ворогів. Цей світ – наш!"
  WHT_new_warriors_tt:0 "Наші перемоги привели до нас нові племена! Більше Білоногих для прийдешніх битв."

  WHT_speak_english:0 "Вкрасти Мову Чужинців"
  WHT_speak_english_desc:0 "Чужинці зневажають нас за мову – змішану з багатьох племен, що стали єдиними в Білоногих. Сіль-на-Ранах, не майстер слова, змушений був терпіти приниження. Вивчення мови Пустки принесе повагу й зміцнить його владу. Маїку?"

  WHT_adopt_denarius:0 "Прийняти Денарій"
  WHT_adopt_denarius_desc:0 "Замість кришок водяних купців Хабу, ми скористаємося сріблом Легіону – таким же чистим, як і слово Цезаря."
  WHT_adopt_denarius.tt:0 "Це невідворотно прив’яже вашу економіку до §Y[CES.GetNameWithFlag]§!."

  WHT_caps:0 "Відкинути Монети Легіону"
  WHT_caps_desc:0 "Срібло гарно прикрашає воїнів, але навіть ми розуміємо, що погано покладатися на чужі гроші."

  WHT_chieftain_of_god:0 "Вождь Божий"
  WHT_chieftain_of_gXod_desc:0 "«Нема ні грека, ні юдея, ні обрізаного, ні необрізаного, ні варвара, ні скіфа, ні раба, ні вільного – але Христос є все і в усіх.» – Кол. 3:11"

  WHT_youth_supply_lines:0 "Довгі Ноги Постачання"
  WHT_youth_supply_lines_desc:0 "Народ Білоногих вільно мандрує землями Юти. Ми знаємо дороги, річки й пагорби. Вперед – до перемоги!"

  wht_scavenge_ruins:0 "Обшукати Руїни"
  wht_scavenge_ruins_desc:0 "У руїнах Юти досі є корисні речі. Ми скористаємось ними!"

  wht_learn_to_drink:0 "Джерела Води"
  wht_learn_to_drink_desc:0 "Ми не фермери, але не дурні. Ми знаємо, де шукати воду під палючим сонцем."

  wht_aid_from_the_daughters_of_hecate:0 "Допомога від Доньок Гекати"
  wht_aid_from_the_daughters_of_hecate_desc:0 "Доньки Гекати завжди підтримували нас. Вони приносили ліки під час хвороб, їжу в голод. Саме вони допомогли нам у часи Кіптявої Хвороби. Мало хто в Пустці був до нас такими гостинними."

  WHT_explosives:0 "Давня Магія"
  WHT_explosives_desc:0 "Ми зберегли стародавні шляхи, що дозволяють нам кидати дим і вогонь у ворогів. А ваша наука може це пояснити?"

  WHT_deathclaw_mounts_world:0 "Кігті й Сіль, Кров і Пил"
  WHT_deathclaw_mounts_world_desc:0 "[WHT.GetLeader] розірвав старі кайдани Білоногих і дав їм нову плоть. Жодного ярма Легіону, жодного гниття Ханаану – тільки сила, тільки голод. Як Кігті Смерті, ми стоїмо одні, хижаки в дикій природі. Цей світ тепер – наш, і всі, хто ходить ним, стануть на коліна або загинуть!\nСвіт – для нас."
  WHT_deathclaw_mounts_world_tt:0 "§g[WHT.GetLeader] викликає древній ритуал, звертаючись до вовків з найтемніших глибин землі, щоби служили йому!§!\n"

  wht_eighties_negotiation_switch:0 "[EightiesNegotiationTitle]"
  wht_eighties_negotiation_switch_desc:0 "[EightiesNegotiationDesc]"

  wht_eighties_negotiation:0 "Упоратися з Вісімдесятниками"
  wht_eighties_negotiation_desc:0 "[EHT.GETName] завдають нам клопоту вже давно, але вони також стоять між нами та Нью-Ханааном. Нам доведеться мати з ними справу – так чи інакше."

  wht_attack_noemen:0 "Атакувати Ноеменів"
  wht_attack_noemen_desc:0 "[NOE.GETName] завдають нам клопоту вже надто довго. Та вони також стоять між нами та Нью-Ханааном. Ми повинні вирішити це – одним чи іншим шляхом."

  wht_attack_mormons:0 "У попіл – попіл, у сіль – сіль"
  wht_attack_mormons_desc:0 "Мормони надто довго називали нас варварами. Вони перекрили торгівлю й вимагали, щоб ми вклонялись їхньому богу. Подивимось, хто буде вклонятись, коли [WHT.GetLeader] стоятиме серед руїн їхнього храму!"

  wht_attack_mormons_ferocity:0 "Дияволи"
  wht_attack_mormons_ferocity_desc:0 "Мормони глузують із нас, називаючи дикунами. Що ж, настав час відповідати цьому знущанню."

  wht_attack_mormons_compassion:0 "Ангели"
  wht_attack_mormons_compassion_desc:0 "[WHT.GetName] призначені правити Ютою, але це не робить нас деспотами. Як Бог-Отець любить дітей своїх, так і ми піклуємось про підданих – допомагаємо хворим і пораненим. Тож народ менше чинить опір до останнього."

  wht_coronation_of_the_brute:0 "Дім серед Руїн"
  wht_coronation_of_the_brute_desc:0 "[WHT.GetLeader] захопив Нью-Ханаан у мормонів. Слава! Слава! Слава!"

  wht_legs_navy:0 "Білі Вітрила для Білоногих"
  wht_legs_navy_desc:0 "Ми нападали по суші, несли сіль і попіл. Тепер річки Пустки – наші шляхи для тієї ж мети!"

  wht_lessons_from_raiding_rivers:0 "Уроки Річкових Нальотів"
  wht_lessons_from_raiding_rivers_desc:0 "Наші воїни багато чого навчилися, плаваючи річками та Великим Солоним Озером. До речі, знали, що на ньому справді можна плавати, якщо чистити дно? Ей, не тікай! Я ще не все розповів!"

  wht_legs_regularize_tithes:0 "Упорядкувати Данину"
  wht_legs_regularize_tithes_desc:0 "[WHT.GetLeader] запропонував нормалізувати побори з племен і міст, які ми контролюємо. Навіщо здирати шкуру з браміна, якщо можна його доїти?"

  wht_parliament:0 "Нові Закони"
  wht_parliament_desc:0 "«Усі, хто грішить поза законом, загинуть поза законом; а ті, хто грішить під законом, будуть суджені за законом.» – Римлянам 2:12"

  wht_settle_lands:0 "Освоєння Земель"
  wht_settle_lands_desc:0 "Розмістивши загони Білоногих на захоплених землях, ми зможемо витискати більше ресурсів із підкорених народів."

  wht_tenant_farmers:0 "Орендарі-Фермери"
  wht_tenant_farmers_desc:0 "Наш народ ніколи не повинен голодувати. Хай фермери, яких ми перемогли, годують своїх нових панів. А якщо скаржаться... м'ясо є м'ясо."

  wht_standing_army_1:0 "Елітні Воїни"
  wht_standing_army_1_desc:0 "[WHT.GetLeader] запропонував використати наші нові багатства, щоб утримувати загін воїнів, завжди готових до бою! Це зробить нас загрозою для всієї Юти... і, можливо, ще далі."

  wht_standing_army_2:0 "Народ Воїнів"
  wht_standing_army_2_desc:0 "Зі здобутими ресурсами [WHT.GetDef] більше не мають витрачати час на полювання чи збирання. У нас є раби й слуги для цього. Ми можемо зосередитись на тому, що вміємо найкраще.\n\nВійна."

  wht_chiefs_of_utah:0 "Вождь Юти"
  wht_chiefs_of_utah_desc:0 "Дехто боявся, що ми захлинемося в завоюванні Ханаану. Але ми навчилися мистецтву правління та мудрості влади. Застосуємо ці знання на всій території Юти!"
  wht_chiefs_of_utah_tt:0 "Відкриває підказку для отримання переваг цивілізованого суспільства.\n"

  WHT_strength_of_the_old_ways:0 "Сила Старих Шляхів"
  WHT_strength_of_the_old_ways_desc:0 "Наше плем’я процвітало не тому, що ми відмовилися від себе, чи слухали чужі поради – а завдяки власній крові й волі. Ми дотримуємось волі богів, вірні своєму шляху.\nПеремога Білоногим!"

  wht_chief_of_all_utah:0 "Вождь Усієї Юти"

  WHT_kneel_before_the_dark_pyramid:0 "Схилитися перед Темною Пірамідою"
  WHT_kneel_before_the_dark_pyramid_desc:0 "Сіль-на-Ранах привів вірних Білоногих до Темної Піраміди – у священній подорожі на знак вірності. Схилившись у її тіні, вони вшанували минулу допомогу Доньок Гекати, запропонувавши свою силу у відповідь. Так вони стали Псами Гекати – пов'язані з її баченням могутньої Пустки."

  WHT_glory_hunt:0 "Слава Полювання"
  WHT_glory_hunt_desc:0 "W"

  wht_bone_breakers:0 "Ламачі Кісток"
  wht_bone_breakers_desc:0 "Твій дейяйпе! Білоногі вправні у ближньому бою й без вагань трощать ворогів."

  wht_sappers:0 "Підривники"
  wht_sappers_desc:0 "Білоногі – майстри руйнування. Їхні вороги шкодуватимуть, що не здались раніше – разом із жінками та брамінами."

  wht_envelop_ncn:0 "Допомога від Псів Гекати"
  wht_envelop_ncn_desc:0 "У міру нашого наближення до Нью-Ханаану, Уроборос пропонує нову допомогу! Пси Гекати – колишні рейдери й племена, вірні Гекаті – діляться з нами знанням війни."

  wht_clock_silenced:0 "Годинник Пробив Опівночі"
  wht_clock_silenced_desc:0 "Колись жваве Сховище 60 тепер стоїть моторошно тихим. Постійне цокання годинників змінилось гнітючою тишею. Це місце, колись символ порядку, тепер порожнє – як нагадування про безжальний плин часу."

  wht_tar_stuck:0 "Володарі Доріг"
  wht_tar_stuck_desc:0 "Смоляні Ходоки, колись горді й непокірні, тепер плазують у нас під ногами. Під нашим залізним правлінням їхній дух зламано, волю – розтоптано."

  wht_betray_eighties:0 "Зрадити Вісімдесятників"
  wht_betray_eighties_desc:0 "Хоча ми й ділили хліб із Вісімдесятниками, [WHT.GetLeader] не дасть якомусь там 'вічному миру' зупинити себе."
  wht_betray_eighties_tt:0 "Відкриває рішення, що дає воєнну ціль проти [EHT.GetNameWithFlag], коли вони будуть у стані війни. Дурні.\n"

  WHT_our_new_master:0 "Наш Новий Господар"
  WHT_our_new_master_desc:0 "Сіль-на-Ранах стоїть на колінах у пилюці, чоло до землі, голос охриплий від благань. Він пропонує кров, силу, усе, чим є Білоногі – але чи цього досить? Бик не дарує милості, не схиляється перед відчаєм. Якщо Цезар так захоче – ми станемо його псами. Якщо ні – він затопче нас під п’ятою."

  wht_knock_on_heavens_gate:0 "Вторгнення в Айдахо"
  wht_knock_on_heavens_gate_desc:0 "Племена Юти упокорені – та ще залишились вороги. На півночі – землі пари, багаті й майже порожні. Вони чекають, щоб їх узяли!"
  wht_idaho_tt:0 "§gЮта вже наша – час шукати нові фронтири!§!\nОтримати претензії на всі області в §YАйдахо§!."

  wht_conquer_colorado:0 "Завоювати Колорадо"
  wht_conquer_colorado_desc:0 "Племена Юти підкорено, але ворогів ще багато. На сході – Скелясті Гори, химерні пустки, багаті на метал і скарби. Час брати!"
  wht_colorado_tt:0 "§gМаючи Юту під контролем, час дивитись на нові рубежі!§!\nОтримати претензії на всі області в §YКолорадо§!."

  wht_dominion_over_utah:0 "Влада над Ютою"
  wht_dominion_over_utah_desc:0 "Хоча спокуса нових завоювань велика, вони можуть поставити під загрозу нашу нову батьківщину. Ми маємо зміцнити захоплені землі й вкоренитися."
  wht_dominion_utah_tt:0 "§gМи зосередимось на інтеграції та контролі вже захоплених територій.§!\nПостійне зменшення вартості інтеграції на §G25%§! в усіх регіонах §YЮти§!."

  wht_revenge_upon_caesar:0 "Полювання на Цезаря"
  wht_revenge_upon_caesar_desc:0 "Завдяки порадам своєї доньки, Сіль-на-Ранах усвідомив: Легіон зрештою знищує племена, що до нього приєднуються. Нехай Сльози-Під-Дощем покаже Легіону, чому жінки [WHT.GetADJ] можуть стояти на власних ногах."

  wht_securing_the_hub:0 "Захопити Хаб"
  wht_securing_the_hub_desc:0 "Ці безпритульні роботи – легка здобич для наших воїнів. А земля – придатна для заселення!"

  wht_the_city_slickers:0 "Міські Лизуни"
  wht_the_city_slickers_desc:0 "Рейдери на півдні продовжують загрожувати нашому народу. Ми маємо розчавити їх, перш ніж зосередитись на більших планах у Юті."
