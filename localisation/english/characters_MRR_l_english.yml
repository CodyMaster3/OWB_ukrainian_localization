MRR_JACK_REED_NAME:0 "Джек Рід"
MRR_JACK_REED_DESC:0 "Громадяни Республіки Маршалла чудово вміють піклуватися про себе, поколіннями передаючи готовність боротися за своє та тонке розуміння як виживання на природі, так і пошуку необхідного серед залишків старого світу. Така індивідуалістична натура робить лідерство над ними подібним до спроб пасти впертих бігорнів. Це — окреме мистецтво, яке Джек Рід намагається опанувати, адже Республіці загрожують як внутрішні, так і зовнішні небезпеки."

MRR_MARSHALL_NAME:0 "Маршал Джаспер"
MRR_MARSHALL_DESC:0 "Маршал Джаспер блукає цими краями вже понад п’ятдесят років, і цей сивий лис не збирається нікуди зникати. Ветеран битв у районі Ґранд-Рапідс, він бачив і пристрелив достатньо фанатиків на одне життя. Шкода тільки, що попереду ще більше справ."

MRR_WITWICKY_NAME:0 "Маршал Вітвікі"
MRR_WITWICKY_DESC:0 "Маршал Вітвікі вже кілька років тримає Джексонів та подібних до них на відстані. Хоча він не надто балакучий, його знають за глибокі цитати на кшталт «чудово» та «гарна робота». Колеги називають його «тим, хто постійно дає п’ять», і якщо ви звернетеся до нього, він лише мовчки кивне у відповідь."