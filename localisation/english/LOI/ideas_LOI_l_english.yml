loi_autonomous_facility_desc:0 "Зали виробництва та освіти в Гранд Прері тепер під контролем нового винаходу нашої команди НДР — §YG.P.A.E.R.§! §g(Автономний Регулятор Ефективності Гранд Прері, може змінюватися.)§! Він набагато надійніший порівняно з попередніми орендарями, працюватиме бездоганно. Однак люди все ще не довіряють роботам з Гранд Прері, і ми сподіваємось, що це зміниться.\n\n§gЦей об'єкт цілком §cстабільний§! сам по собі, хоча ми та наші нові студенти могли б отримати набагато більше користі, якщо б призначили формального §cdиректора§!§!"

