l_english:
loi_panzerkampf:0 "Спадщина Панцерних Бригад КПФ"
loi_panzerkampf_desc:0 "Серед старих лав КПФ не було більш відомих та страшних, ніж танкові бригади. Рейдуючи в бій із завзятістю, танкові бригади завжди могли вирвати перемогу з самих зубів поразки, якими б важкими не здавалися шанси. Багато з гордих танкістів, що й до сьогодні захищають Лоїд, простежують свої корені до днів КПФ або ж до днів своїх батьків. Тим не менш, золоті дні КПФ минули, але навіть під новим знаменом старі танкісти борються з тією ж самою пристрастю, що й колись, тримаючи поразку на відстані."
loi_panzerkampf_unhappy:0 "«Спадщина» Панцерних Бригад КПФ"
loi_coup:0 "Військове Неспокійство"
loi_vacant_cabinet:0 "Порожній Кабінет"
loi_vacant_cabinet_desc:0 "§RЯк довго триває вічність?§!\n\nНадіслані СРСР на підтримку канадського руху за незалежність, радники повинні були залишатись на короткий час. Це тривало до падіння бомб, коли їх місія стала їхнім в'язницею.\n\nПотрапивши на чужу землю на століття, наша колишня велика кабінетна команда командувачів та радників перетворилася на лігво брудних, диких звірів. Десятки років знань у їхніх розвалених мозках перетворилися на пил. Через це наші операційні можливості серйозно ослаблені.\n\nТільки завдяки витримці §HSava Dukov§! ми можемо продовжувати тримати корпус. Однак навіть він відчуває, що дзвінок наближається для нього та його повільно розколюючогося розуму. Він продовжить віддавати все за міністерство, незалежно від того, як би не боявся наслідків."
