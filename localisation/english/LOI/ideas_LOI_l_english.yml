loi_red_army_choir1_desc:0 "§cЯблуневі та грушеві дерева квітли\nНад річкою висів ранковий туман\nНа березі йшла маленька дівчинка, Катюша\nДо краю крутої та кам'янистої берегової лінії\nНа березі йшла маленька дівчинка, Катюша\nДо краю крутої та кам'янистої берегової лінії§!"
loi_red_army_choir2:0 "Хор Червоної Армії"
loi_red_army_choir2_desc:0 "§cЯблуневі та грушеві дерева квітли\nНад річкою висів ранковий туман\nНа березі йшла маленька дівчинка, Катюша\nДо краю крутої та кам'янистої берегової лінії\nНа березі йшла маленька дівчинка, Катюша\nДо краю крутої та кам'янистої берегової лінії\n\nВона йшла й співала маленьку пісню про кохання\nДо великого орла степу\nОрел почув її пісню про коханого\nПро дорогого, чиї листи вона зберігала\nОрел почув її пісню про коханого\nПро дорогого, чиї листи вона зберігала§!"
