l_english:
loi_tyrants:0 "Смерть Тиранам Та Зрадникам!"
loi_tyrants_desc:0 "“Товариші, ви станете на захист Революції? Тієї, що загрожують нашому Раю, нашому способу життя? Товариші — ВИ СТАНЕТЕ ПОРУЧ ІЗІ МНОЮ?”"

loi_suppliers:0 "Постачальники Без Імені"
loi_suppliers_desc:0 "Основну частину озброєння, яким Канадський Народний Фронт (КНФ) боровся з американськими загарбниками, надала Китайська Народна Республіка. Та інший ключовий гравець діяв з тіні. Контейнер на березі, контрабандний ящик зброї, гуманітарна допомога з приємними сюрпризами... Але серед усіх брязкалець і побрякушок лежав найбільший скарб: танки."

loi_doctrine:0 "Різниця В Доктрині"
loi_doctrine_desc:0 "У перші дні після Великої Війни КНФ стрімко захопив більшість Західної Канади й почав готуватися до походу на Торонто. Та Фронту варто було згадати уроки історії — адже вона рідко буває доброю до імперій."

loi_orthodoxy:0 "Православ’я, Комунізм І Танки"
loi_orthodoxy_desc:0 "Міністерство Лойда не повинно було довго протриматися. Воно народилося з волі самопроголошеного Патріарха, який повів свій народ із Редмонда, як Мойсей з Єгипту. Навіть найвідданіші послідовники Соломона вірили, що їх спіткає смерть — або в крижаних снігах, або від рук центрального комітету. Але попри всі шанси, вони дісталися Землі Обітованої."

loi_crossing:0 "Перехрестя Долі"
loi_crossing_desc:0 "Міністерство Лойда стоїть на порозі вирішального вибору. Похитнуте скорботою й внутрішніми суперечками, воно мусить обрати шлях. Чи з'явиться новий рішучий лідер, щоб провести націю крізь темряву, чи старі еліти залишаться при владі, поглиблюючи розбрат і відчай?"

loi_care_for:0 "Дбай Про Ближнього Свого"
loi_care_for_desc:0 "Незважаючи на помилки та ослаблену хватку влади, Соломон залишається відданим Міністерству. Пам’ять про Лідію не згасне — та Патріарх знайде в собі силу духу, щоби її надії, як і мрії всіх, хто був до нього, не були змарновані."

loi_when_war:0 "Коли Ми Були На Війні"
loi_when_war_desc:0 "У горнилі Міністерства Лойда відкривається новий розділ. Коли революція вже дихає за спиною, молода іскра береться за кермо. Катерина розпалює надію і спротив водночас, готуючи сміливу кампанію, яка змінить долю її народу."

loi_christian_marxism:0 "Християнський Марксизм"
loi_christian_marxism_desc:0 "Комунізм і християнство — два боки однієї монети: обидві ідеології побудовані на солідарності, взаємодопомозі та вірі у вищу мету. Соломон це знає. Але не завадить і решті дізнатися про це."

loi_god_lord:0 "Господь Промовляє Про Милість"
loi_god_lord_desc:0 "\"Не заздри лихим і не ходи їхніми дорогами.\" — Приповісті 3:31"

loi_cross_hammer:0 "Хрест І Молот"
loi_cross_hammer_desc:0 "Коли будується склад боєприпасів, Добрий Робітник знає, що створює десятки робочих місць. Коли зводиться церква, Вірний Тесля розуміє, що будує прихисток для скривджених. Куди б не пішов мешканець Лойдмінстера, він знайде своє покликання."

loi_love:0 "Люби Ближнього Свого"
loi_love_desc:0 "\"Не задумуй лихого на свого ближнього, що безпечно живе з тобою.\" — Приповісті 3:29"

loi_pray_to_foreman:0 "Молися До Бога І Майстра"
loi_pray_to_foreman_desc:0 "Уперше за довгий час Соломон проспав ранкову молитву. І вперше за довгий час — відчув справжній страх."

loi_leaf:0 "Листок, Що Живить Квітку"
loi_leaf_desc:0 "Катерина та її прибічники прокладають шлях через політичну павутину Лойдмінстера. Через таємні інтриги та гучні виступи вони зміцнюють свою підтримку. Із пошептів народжується рух, з руху — надія, а з надії — революція."

loi_fallen:0 "Вшанування Полеглих"
loi_fallen_desc:0 "Серед підготовки до революції Катерина не може позбутися тіні Лідії. Та її смерть лише підсилює палке бажання змін."

loi_father_gift:0 "Дар Батьків"
loi_father_gift_desc:0 "Вчення радянських радників дали початок КНФ. І навіть крізь століття — вони продовжують вести нас уперед."

loi_spear:0 "Спис КНФ"
loi_spear_desc:0 "Катерина була розумною жінкою — достатньо, щоби забезпечити підтримку танкістів для свого плану. Вона провела безліч перемовин, переконуючи інших у своїй візії. Більшість погодилися. А хто ні... про них більше не чули."

loi_wind_blows:0 "Вітер Здіймається"
loi_wind_blows_desc:0 "Танки КНФ — одні з найстрашніших сил Півночі. І хоча Катерина розуміла, що самих лише танків недостатньо, вона знала, наскільки вирішальними вони стануть у майбутній війні."

  loi_daughters:0 "Дочка Наших Батьків"
  loi_daughters_desc:0 "Спираючись на героїв минулого, Спис КНФ був сформований з найкращих з них, багато хто з міністерства веде своє родовідне коріння до оригінальних учасників Батальйону. Тепер, коли ми відібрали владу у Духовенства, ми можемо вшанувати наших героїв і цілі, за які вони боролись."
  loi_gunpowder:0 "Солодкий Запах Пороху"
  loi_gunpowder_desc:0 "Навіть в такому зруйнованому пустелі, як ця, є ресурси, які ми можемо використати. За підтримки робітників наші танки будуть оснащені найякіснішими боєприпасами, які ми можемо виробити. Вони стануть мечем, що пробиває серця ворогів робітників."
  loi_fifth_brigade:0 "Відновити П’яту Бригаду"
  loi_fifth_brigade_desc:0 "Серед танкових батальйонів КНФ, танки Лідії Донської §GCzarskaya§W були найкращими, їх спадщина зберігається до Лойдмінстера. Після її смерті Міністерство разом з підступним Духовенством скасувало корпус та будь-які пов’язані з ним нагороди. Спадщина Лідії продовжується через Катерину, Танкістів, готових віддати свої життя за її реінкарнацію як легендарного Капітана."
  loi_hunt_down:0 "Полювання на Згадані Танки"
  loi_hunt_down_desc:0 "Під час звичайної експедиції було повернуто чудову новину."
  loi_vanguard:0 "Авангард Людей"
  loi_vanguard_desc:0 "Катерина користується непохитною підтримкою більшості збройних сил Міністерства, пройшовши шлях до керівної посади лише завдяки важкій праці. Вона є живим втіленням ідеалів революції і провідною зіркою для амбіційних молодих чоловіків і жінок Танкових частин."
  loi_battalion:0 "Відділ Смерті"
  loi_battalion_desc:0 "Коли їхні розуми ще були гострими, радники з СРСР з захопленням згадували відвагу та відстоювання жінками своїх прав під час кровопролитних років легендарної Великої Вітчизняної Війни. Як краще вшанувати їх спадщину, ніж продовжити їхню легенду у душі?"
  loi_scavenging:0 "Розширення Експедицій по Збиранню"
  loi_scavenging_desc:0 "Катерина схвалила розширення експедицій по збору матеріалів. Відтепер вони матимуть подвійний захист і більше постачання, що дозволить їм довше залишатись у пошуках стародавніх матеріалів, залишених американськими окупантами."
  loi_state:0 "Соціалізм в Одній Державі"
  loi_state_desc:0 "Північ — це зруйноване пустельне поле, де будь-які виробничі об’єкти або ненадійні, або ізольовані від великих поселень. Лойдмінстер і його околиці стануть серцем нової індустріальної революції. Якщо це вдалося радянським, чому б не нам?"
  loi_industralization:0 "Швидка Індустріалізація"
  loi_industralization_desc:0 "Щоб наша Батьківщина пережила майбутню бурю, нам потрібно забезпечити самодостатність у виробництві продуктів харчування та зброї. Ці нові політики колективізації та модернізації можуть на деякий час підрити нашу легку промисловість, але вони є абсолютно необхідними для забезпечення виживання революції."
  loi_church:0 "Перерозподіл Ресурсів Церкви"
  loi_church_desc:0 "Стальні основи та дерев’яні панелі церковних будівель будуть розібрані, використані для живлення металургійних заводів, що дозволить вивільнити робітників на кілька місяців."
  loi_revitilization:0 "Ревіталізація Околиць Лойдмінстера"
  loi_revitilization_desc:0 "Ще до Великої Війни більшість околиць Лойдмінстера були порожніми та безлюдними. Це дає можливість забезпечити поселення новою хвилею індустрії, починаючи його трансформацію на виробничий та промисловий центр Півночі."
  loi_roads:0 "Відновлення Доріг"
  loi_roads_desc:0 "Освічене населення є продуктивним населенням. Це, в свою чергу, неможливо без відповідної інфраструктури для обміну ідеями по всій нації."
  loi_agricultural:0 "Аграрний Прорив"
  loi_agricultural_desc:0 "З ослабленням Духовенства ми можемо нарешті повністю впровадити сільськогосподарські доктрини, що були передані радянськими радниками. Згідно з їхніми словами, значна частина старого СРСР була стерильною, замороженою землею, змушуючи агрономію розвиватися в дисципліноване та точне мистецтво. Багато з цього застосовується й тут."
  loi_armory:0 "Відновити Озброєння Фремонта"
  loi_armory_desc:0 "У печах Фремонта колись кувалися озброєння, які допомогли КНФ відкинути окупантів через кордон. З руйнацією фронту печі замовкли. Але знову розвиваючись війна, Катерина вважає за потрібне відновити завод до робочої потужності."
  loi_ministry_infra:0 "Міністерство Інфраструктури"
  loi_ministry_infra_desc:0 "Знову шукаючи шлях до відновлення мрії КНФ, ми також будемо коригувати ситуацію там, де це необхідно. Один з таких випадків — відсутність належної уваги до внутрішніх справ під час східного наступу на фронті. Переконавшись, що поселення під нашим контролем мають належне з’єднання та обслуговування, ми створимо надійну базу для повернення наших територій під єдиний контроль."
  loi_bread:0 "Гроза Дитинства"
  loi_bread_desc:0 "Перенаправивши виробництво на деякі з наших Східних поселень, ми можемо оживити цю землю, довгий час залишену безлюдною, і в той же час підвищити внутрішню міграцію."
  loi_pikes_peak:0 "Електростанція Пік Пайкс"
  loi_pikes_peak_desc:0 "Пік Пайкс стоїть на естуарії Саскачевану, де потоки швидкі, а води глибокі. Що можна вважати небезпечним для неосвіченої дитини, є також золотим шансом для поселення, що постійно потребує електричної енергії. Наразі підходять тимчасові турбіни, якими керують вручну по змінах."

  loi_economic_plan:0 "Введення Економічного Планування"
  loi_economic_plan_desc:0 "Нарешті ми вибралися з глухого кута, який так довго тримав наші поселення. Те, що мало індустрії ми змогли створити, є крихким та ненадійним, схильним до механічних поломок та операційних неефективностей. Але це закладає основи для більш дисциплінованого економічного планування. Бомби не змогли нас зупинити. Холод не зміг нас зупинити. Чому ми повинні сумніватися в собі тепер?"
  loi_serve:0 "Жити та Служити Людям!"
  loi_serve_desc:0 "Катерина ходить по Лойдмінстеру з полум'ям в очах та заразним ентузіазмом. Як чоловіки можуть не слідувати за кимось, хто має таку щиру впевненість?"
  loi_order:0 "Видання Нашого Власного Указу № 227"
  loi_order_desc:0 "Основний принцип нашої доктрини — це здатність відступати і знову вступати в бій за нашим бажанням. Цей підхід стає проблематичним, коли мова йде про захист Батьківщини, коли кожен клаптик землі і кожен ресурс, який ми здаємо, потрапляє в руки ворога. Для того щоб наші люди знали свої обов'язки тримати лінію, коли це необхідно, буде введений новий військовий наказ в Кодекс. §YУказ № 227§W. §GНі Кроку Назад!§W"
  loi_live:0 "Ми Живемо і Помираємо за Вашим Наказом!"
  loi_live_desc:0 "Після того, як Катерина піднялася до рангу Капітана, ми спостерігаємо запал серед наших військ, якого не було з часу нашого першого прибуття в Лойдмінстер. Кожного дня все більше і більше чоловіків та жінок приходять до рекрутингових офісів, готові віддати своє життя, щоб захистити нашу улюблену Батьківщину!"
  loi_heir:0 "Спадкоємець КНФ"
  loi_heir_desc:0 "Незважаючи на всі труднощі, ми стоїмо переможцями. Ми більше не є периферійною фракцією на межі забуття; ми — завдяки бойовим заслугам — останні спадкоємці Канадського Народного Фронту. Але ми відкинемо декаданс, який охопив КНФ в його останні роки. Замість цього, ми успадкуємо іншу мантію - мантію §RСоюзу Радянських Соціалістичних Республік§W, щоб продовжити спадщину наших предків."
  loi_redmond:0 "Повернення до Редмонда!"
  loi_redmond_desc:0 "Займе певний час, щоб позбутися від запаху Емі Терезії та її прихильників, що залишилися в Редмонді. Але це буде вартим — адже діти героїв, які повели нас у Лойдмінстер, нарешті зможуть грати по вулицях нашого справжнього дому."
  loi_survivors:0 "Прощення для Вцілілих"
  loi_survivors_desc:0 "Є багато людей з лав ворога, які б воювали на нашому боці, якби мали таку можливість. Навіть зараз наші люди метушаться по Редмонду, закликаючи віддалених родичів і родичів, втрачених під час нашої хаотичної втечі багато років тому. Всі вони будуть прийняті з розкритими обіймами."
  loi_hero:0 "Герої Канади"
  loi_hero_desc:0 "Революція не має кінця — але це не означає, що вона не дає відпочинку. Давайте на мить зупинимось і відсвяткуємо наші досягнення, товариші. Нехай герої, які привели нас до перемоги, живуть в серцях і розумах пролетаріату."
  loi_toast:0 "Тост за Наших Старих Друзів"
  loi_toast_desc:0 "В ту холодну зимову ніч, Катерина взяла паузу, щоб задуматися над своїми досягненнями — і про тих, хто надихнув її прагнути до зірок."
  loi_hymn:0 "Гімн Нашої Армії"
  loi_hymn_desc:0 "Від початку часів маршові пісні були частиною бойової сили. Хоча в давні часи їх співали для того, щоб підтримати крок або виголосити свою велич, наші солдати співають пісню Святої Катюші, що чекає охоронців робітників, якщо ті впадуть у бою. Наші солдати співають і маршують в унісон, для захисту пролетаріату та їхнього дому."
  loi_prayers_soldier:0 "Молитви Солдатів"
  loi_prayers_soldier_desc:0 "Багато наших військових звикли до молитовників, наданих їм, вважаючи їх джерелом спокою та підтримки. За кілька змін та коригувань, щоб підкреслити соціалістичну доктрину, наші солдати залишатимуться спокійними і стійкими перед будь-якою небезпекою."
  loi_kinder_times:0 "Кращі Часи"
  loi_kinder_times_desc:0 "Насправді Міністерство ніколи не знало миру з моменту свого створення. Але зимовий холод має здатність наповнювати пам'ять невидимими снігами. Підкреслюючи у своїх оголошеннях для робітників ідеалізоване, вигадане минуле, ми надаємо мету, мету, до якої потрібно прагнути. Бог знає, що людині потрібна мета, щоб продовжувати жити в цих замерзлих пустках."
  loi_tank:0 "Модернізація Танків"
  loi_tank_desc:0 "Танк — це кавалерія сучасного світу, як тепер, так і 200 років тому. Якщо він має залишитися щитом робітників, ми повинні адаптувати старі моделі до змін, що принесла Велика Війна. З часом наші гусениці зітруть в порох всіх, хто стане на шляху революції."
  loi_com:0 "Далекі Комунікації"
  loi_com_desc:0 "Важливо залишатися на зв’язку з нашими силами на фронті. Небезпеки пустки роблять кур'єрів та бігунів ненадійними для підтримки зв’язку, а сама природа війни вимагає постійних оновлень. Відновлення телекомунікацій дасть нам безумовну перевагу над ворогами робітників."
  loi_learning:0 "Навчання з Минулого"
  loi_learning_desc:0 "Немає потреби винаходити колесо заново, або в цьому випадку — відновлювати століття військової доктрини. Хоча світ був змінений ядерним вогнем, старі методи все ж несуть цінність для наших сил. Розуміння тактики минулого дозволить нам краще боротися за робітників світу."
  loi_turrets:0 "Покращення Турелей"
  loi_turrets_desc:0 "Важливо, щоб коли ми стріляємо, наша ціль була знищена. Нарізка стволів наших танків дозволить нам досягти вищої точності порівняно з нашими ворогами, хоча це означатиме, що потрібно більше часу та ресурсів для тих, хто їх будує."

  loi_shield:0 "Покращене Щитове Покриття"
  loi_shield_desc:0 "Наші танки є щитами робітників, тому необхідно, щоб вони залишалися непошкодженими. Інтеграція титану в броньові панелі зупинить все, крім найсильнішої зброї, хоча це помітно збільшить вартість транспортних засобів."
  loi_storm:0 "Нове Різновид Бурі"
  loi_storm_desc:0 "Турелі були переобладнані, шасі модернізовані, а броня оновлена. Наша нова ера війни готова початися, тож нехай приходять. Нехай кожен, хто наважиться загрожувати §RРобітникам Світу§W, прийде і побачить, що таке кінець тирана."
  loi_master:0 "Імітація Майстра"
  loi_master_desc:0 ""
  ###clergy
  loi_solomon_sweep:0 "Пробудження"
  loi_solomon_sweep_desc:0 "Господь дійсно спостерігає за нашим Патріархом. Виживши після замаху на його життя, Соломон намагається залучити лоялістів серед духовенства та поза ним, щоб відновити Міністерство. Принаймні, поки ворог всередині дозволяє це."
  loi_solomon_convert_fast:0 "З Твердої Руки"
  loi_solomon_convert_fast_desc:0 "Ми абсолютно не можемо дозволити собі вагатися. Танкісти вчинили зраду проти Патріарха і повинні бути нейтралізовані, перш ніж вони отримають шанс зробити це знову. Ті, хто не брав безпосередньої участі в змові, будуть змушені приєднатися до своїх товаришів на землі. Їхні бойові машини, тим часом, будуть розібрані для благородніших цілей."
  loi_solomon_convert_fast1:0 "Витягнути Документи"
  loi_solomon_convert_fast1_desc:0 "В рамках роботи над прототипом Дукова, Соломон порився в старих архівах, виявивши місце, де зберігалися десятки костюмів силової броні, призначених для американських окупантів. Деякі з них будуть зворотно розроблені — решта стане основою нашого нового Списа."
  loi_solomon_convert_fast2:0 "Попереду Сварки"
  loi_solomon_convert_fast2_desc:0 "Господь вчить нас, що помста — це його справа. Але в ці дні, послання писання здаються втраченими для послідовників Соломона..."
  loi_solomon_convert_fast_offshoot:0 "Аварійні Каркаси"
  loi_solomon_convert_fast_offshoot_desc:0 ""
  loi_solomon_convert_fast3:0 "Повернути Колесо"
  loi_solomon_convert_fast3_desc:0 "Незважаючи на своє огидне походження, силова броня є остаточною спадщиною духу робітника, наділяючи пролетаріат надзвичайними здібностями, до яких вони були приречені. Водночас, вона дозволяє допомагати товаришам у розпал бою, приймаючи доктрини солідарності, яких навчив нас наш Господь. Більш досконала симбіозія, ми не могли б і просити."
  loi_solomon_convert_slow:0 "Експертна Указ Соломона"
  loi_solomon_convert_slow_desc:0 "Немає сумнівів, що Танкісти стоять за замахом на життя Патріарха. Це робить нашу ситуацію вкрай небезпечною, оскільки чоловіки та жінки з Списа формують основу нашої армії та мають добру репутацію. Важливо, щоб їхнє становище та статус у Міністерстві були ослаблені перед тим, як ми вжитимемо заходи."
  loi_solomon_convert_slow1:0 "Забезпечення Стабільності"
  loi_solomon_convert_slow1_desc:0 "Місяці після замаху Патріарх вже гуляє по вулицях Лойдмінстера, перевіряючи вірних і вислуховуючи їхні скарги. Це сміливе проявлення лідерства, яке мешканці Міністерства точно оцінять."
  loi_solomon_convert_slow2:0 "Пониження Міністерських Провалів"
  loi_solomon_convert_slow2_desc:0 "Під час своїх турів по столиці, Соломон намагався зменшити занепокоєння з приводу можливих атак на місто. Він розширив маршрути патрулювання охорони і особисто слідкував за інформацією щодо підриву ворожих елементів. Ніяка шкода більше не завдасть Міністерству — принаймні, це була надія."
  loi_solomon_convert_slow3:0 "Нев досвідчені Танкісти"
  loi_solomon_convert_slow3_desc:0 "У Соломона є надійна інформація, що нові рекрути Танкістів не були причетні до змови. Цей вияв лояльності не залишиться без винагороди. Залюблені новачки будуть поставлені на чолі того, що залишиться від Списа, при цьому підриваючи вплив ветеранів."
  loi_solomon_convert_meetup:0 "Все Тихо"
  loi_solomon_convert_meetup_desc:0 "Гучні звуки зброї вщухли вдома і за кордоном. Нарешті можна доставити справедливість тим Танкістам-зрадникам, що довго уникали покарання."
  loi_allquiet_already_purged:0 "Поговоримо про кращу дальність"
  loi_allquiet_purge:0 "Вбивати цих покидьків"
  loi_ending_middle_opening:0 "Модернізація Армії"
  loi_ending_middle1:0 "Міністерський Департамент Закордонних Справ"
  loi_new_spear_opening:0 "§HНовий Спис§!"
  loi_new_spear_opening_desc:0 "Щось типу того, що наша силова броня безцінна, тому вона має бути найкращою з усіх."
  loi_new_spear2:0 "§HНавчання на Найгіршому§!"
  loi_new_spear3:0 "§KКров і Сталь§!"
  loi_solomon_spear8:0 "Руйнівники Бункерів"
  loi_solomon_spear8_desc:0 "§yУнікальний костюм силової броні, виготовлений з розібраних залишків танка, такий повільний, але потужний.§!" 
  loi_ending:0 "В безпеці"
  loi_ending_desc:0 "Прямо в серці Великої Півночі, як розповідають казки, є укриття для смиренних, фортеця, підкріплена святим металом. Це те, що Патріарх зміг досягти, через піт і кров. Бандити пусток точно залишать нас у спокої, поки ми продовжуємо працювати і важко трудитися за краще завтра для пастви Господа."

  #okay imma keep it a buck, i give up rightnow on trying to keep this all organized. when we are past the cutoff date and I can relax I'll go through and properly organize everything. Until then, all the focuses from the MK2 loid tree go here:

  loi_daggers_in_back:0 "Наче Кинджали в Наші Спини"
  loi_daggers_in_back_desc:0 "Темні хмари згустились над нами. Насуваються негаразди. Ми повинні згуртувати народ, щоб бути готовими до всього, що наближається."

  loi_dagger1:0 "Знай Свого Ворога"
  loi_dagger1_desc:0 "Ми практично оточені фракціями, що з’явилися після краху КНФ. Досі ми мирилися з тим, щоб вони загрузли у своїй нужденності. Але з війною на горизонті, ми не можемо дозволити собі бездіяльність, тож ініційовано операцію зі збору розвідданих, аби бути готовими."

  loi_dagger2:0 "Обережне Осяяння"
  loi_dagger2_desc:0 "Через товщі діаграм і розрахунків Георг Ом навіював одну просту істину: неможливо рухатись уперед без того, хто позаду. Ми закріпимо його вчення у нашому кодексі."

  loi_dagger3:0 "Груба Інновація"
  loi_dagger3_desc:0 "Зв’язок лежить в основі координації — особливо в бронетанкових з’єднаннях. Ми подбаємо про те, щоб наші командири розуміли одне одного попри товсті шари металу між ними."

  loi_mouth_of_madness:0 "У Пащеці Божевілля"
  loi_mouth_of_madness_desc:0 "Патріарх відвів вечір для тихої молитви. Та його незабаром відволік сморід Пекла."

  loi_solomon_left1:0 "Офіційно Вербувати Міліцію Віруючих"
  loi_solomon_left1_desc:0 "Послідовники Соломона ростуть з кожним днем, тому цілком логічно формалізувати міліцію в справжню бойову силу. Хоча багато з них ніколи не бачили війни, їхня працьовитість надихає Соломона, як колись Ісус зробив із жебраками апостолів."

  loi_solomon_left2:0 "Потреби Сучасного Часу"
  loi_solomon_left2_desc:0 "Ті, хто нині тримають лад, ледве розуміють, як тримати гвинтівку. Нам терміново потрібні спеціалісти на передовій, щоби заспокоїти населення."

  loi_solomon_left3:0 "Вивести Міліцію Віруючих"
  loi_solomon_left3_desc:0 "Коли нові бійці закінчують підготовку, а ветерани повертаються, потреба покладатися на фермерів-новачків зникає. Ми відсторонимо Міліцію Віруючих… принаймні наразі."

  loi_solomon_left4:0 "Ми Любимо, Коли Все Вибухає"
  loi_solomon_left4_desc:0 "В цілому, нам бракує чисельності. Святе Полум’я цілком компенсує нестачу солдатів на полі бою."

  loi_solomon_left5:0 "Формалізувати Міліцію Віруючих"
  loi_solomon_left5_desc:0 "Опираючись на аналогову зброю, ми використовуємо фізичну силу товаришів, що працювали з дитинства. Справжня симбіозія віри й праці."

  loi_solomon_left6:0 "Вербувати Міністерську Гвардію"
  loi_solomon_left6_desc:0 "Вирішивши нагальні недоліки армії, ми можемо звернутись до довгострокових питань безпеки. Якщо варвари знову стоятимуть під воротами, вони зустрінуть найкращих бійців, призначених охороняти Міністерство день і ніч."

  loi_solomon_left7:0 "Уроки Громадянської Війни"
  loi_solomon_left7_desc:0 "Що за перший день — новобранці, які пережили кривавий конфлікт зі Страткоммуною, мають історії, що варто буде передати наступникам."

  loi_solomon_middle1:0 "Поклик до Міліції"
  loi_solomon_middle1_desc:0 "Новини про підпал церкви та змову поширились швидко. Віряни зібрались біля дому Патріарха в перші години ранку, жадаючи вказівки на лігво Диявола."

  loi_solomon_middle2:0 "Реструктуризація Адміністрації"
  loi_solomon_middle2_desc:0 "Після невдалого перевороту підозріло багато чиновників втекло через задні двері. Справа піде значно краще, коли ці посади займуть вірні люди."

  loi_solomon_right1:0 "Зберігати Високий Дух"
  loi_solomon_right1_desc:0 "Зараз як ніколи раніше, молиться Патріарх, нам потрібна мудрість і любов Господа, щоб іти вперед."

  loi_solomon_right2:0 "Порятунок Сховищ у Боннівілі"
  loi_solomon_right2_desc:0 "Сталеливарний завод у Боннівілі тимчасово зупинили, чекаючи на ремонт. Ми не можемо дозволити собі розкіш зараз."

  loi_solomon_right3:0 "Відкрити Копілку"
  loi_solomon_right3_desc:0 "Після довгих криків та благань, Соломон переконав Духовенство використати резерви для подолання наслідків перевороту. Це дасть публічним установам необхідне полегшення."

  loi_solomon_right4:0 "Порятунок Електроніки"
  loi_solomon_right4_desc:0 "Як на диво, збирачі змогли знайти купу старої електроніки на покинутій фабриці біля Великого Провалу. Небагато, але цього вистачить, щоб узимку світло в Лойдмінстері не згасло."

  loi_solomon_right5:0 "Тицяння Палицею"
  loi_solomon_right5_desc:0 "Соломон наказав активізувати пошукові операції цього місяця, аби забезпечити Лойдмінстер перед лютою зимою. На щастя, нашим людям вдалося натрапити на чимало добрих речей."

  loi_solomon_right6:0 "Нові Стандарти Промисловості"
  loi_solomon_right6_desc:0 "Завдяки новим фінансам і нещодавнім успіхам у збиранні ресурсів, ми змогли запустити низку суспільних проєктів, що вже приносять плоди. Соломон залишився задоволений побаченим."

  loi_solomon_right7:0 "Навчання Комбінованих Сил"
  loi_solomon_right7_desc:0 "Наша відроджена промисловість дозволяє нам озброїти кожного бійця передовими засобами для поширення слова Господнього та духу Революції."

  loi_solomon_ingenius_idea:0 "Геніальна Ідея"
  loi_solomon_ingenius_idea_desc:0 "Якщо щось і могло воскресити надію в Соломоні, то це була поява Дуков з сяючим обличчям у його офісі."

  loi_solomon_convert_fast4:0 "Старі Нотатки Лідії"
  loi_solomon_convert_fast4_desc:0 "Гортаючи сухі міркування про тактику, Патріарх тільки зітхнув з полегшенням — добре, що Лідія не побачила, як низько впали її учні..."

  loi_solomon_convert_fast5:0 "Пост-Модерна Війна"
  loi_solomon_convert_fast5_desc:0 "Навіть маючи лише кілька резервних костюмів, Дуков змогла вдосконалити оригінальні конструкції за лічені місяці. Нам пощастило мати такий розум на нашому боці..."

  loi_solomon_convert_slow4:0 "Амністія для Танкістів"
  loi_solomon_convert_slow4_desc:0 "Нещодавно призначені танкісти поручилися за декількох товаришів. Після ретельної перевірки, Патріарх погодився на помилування. Та Соломон не хотів ризикувати — ці люди служитимуть на землі, пліч-о-пліч з усіма."

  loi_solomon_convert_slow5:0 "Відкладене Задоволення"
  loi_solomon_convert_slow5_desc:0 "Все готово — у Міністерстві нарешті запанував мир, а Стара Гвардія Списа втратила владу. Вони погодились здатися без бою. Але що ж робити з уламками?"

  loi_solomon_pa_opening:0 "Модернізація Армії"
  loi_solomon_pa_opening_desc:0 "Перетворення танкових деталей у броню було ризикованим маневром, народженим із відчаю. Але тепер, коли ми в безпеці, настав час на переоцінку. Кожен аспект наших сил буде адаптований до нового вектора розвитку. Сталь, що колись була знаряддям гріха, знову стане слугою Господнього задуму."

  loi_solomon_pa1:0 "НенАДійний Оповідач"
  loi_solomon_pa1_desc:0 "Після довгих умовлянь Соломон нарешті дозволив експедицію до Ґранд-Прері, колишньої домівки фабрик Робомізків. Дуков не могла зрозуміти, чому Патріарх так неохоче погоджувався. Та згодом вона дізнається..."

  loi_solomon_pa2:0 "...Ти Не Жартуєш?"
  loi_solomon_pa2_desc:0 "Дізнавшись про події з RELCOM, Соломон негайно вирушив до Ґранд-Прері, прагнучи побачити все на власні очі."

  loi_solomon_pa3:0 "Диявол у Деталях"
  loi_solomon_pa3_desc:0 "Американці в Ред-Дір таки залишили щось корисне — гору старосвітньої інформації, яка допоможе нам навчити будь-якого солдата. На щастя, у нас вистачить сил скористатись цим."

  loi_solomon_pa4:0 "Найдивніше Знахідка"
  loi_solomon_pa4_desc:0 "Кілька фабрик на околицях Ґранд-Прері існували лише задля зловісних задумів RELCOM. Зараз, коли машини замовкли, їх можна використати для захисту нашої пастви. Лиш одна будівля залишається замкненою — двері товсті, вибухи їм не шкодять. §Y«MANIFEST»§! — які ж скарби може приховувати ця назва?"

  loi_clergy_cleanup_real:0 "Повернути Мантію"
  loi_clergy_cleanup_real_desc:0 "Оновлюючи Міністерство, Соломон дав тріщину в броні Духовенства. Ті навряд пробачать пряму загрозу своїй владі. Але здобувши підтримку народу, Патріарх зможе повернути собі ім’я, давно загублене серед чиновницьких залів. Як безликі можновладці зможуть змагатися з істинним захисником віруючих?"

  loi_clergy_cleanup_allquiet1:0 "Повернення до Руїн"
  loi_clergy_cleanup_allquiet1_desc:0 "Поселення Вайткоурт колись було одним із найрозвиненіших у КНФ. Тепер воно в руїнах, покинуте нелюдською машиною. Але це зміниться."

  loi_solomon_clergy_secret:0 "Щира Розмова"
  loi_solomon_clergy_secret_desc:0 "Розмова. І не більше."

  loi_side_industry_clergy:0 "Господь Закликає"
  loi_side_industry_clergy_desc:0 "Кажуть, що ніщо не пробуджує краще, ніж смерть поруч. Саме так і було з Соломоном. Тікаючи від пожежі церкви, він шукав порятунку серед вулиць Лойдмінстера — і побачив лише занепад. Господь випробував його. Соломон більше не збирався підводити Його."

  loi_solomon_industry_left_opening:0 "Індустріальна Революція у Вермільйоні"
  loi_solomon_industry_left_opening_desc:0 "Вермільйон — це ворота в Лойдмінстер, та поки він існує лише як збір громади. Так не годиться, якщо ми хочемо запропонувати людям чесне майбутнє."
  loi_solomon_industry_left1:0 "Пакунки Турботи"
  loi_solomon_industry_left1_desc:0 "Соломону вдалося вибити кілька поступок у тих, хто має владу. Десятки вантажівок із запасами й будівельними матеріалами вже покидають столицю, керовані чоловіками й жінками, що прагнуть збудувати для своїх братів і сестер місце, де можна буде знайти мету."

  loi_solomon_industry_right_opening:0 "Промислова Революція Вейнрайта"
  loi_solomon_industry_right_opening_desc:0 "На відміну від Вермільйону, Вейнрайт зберіг деякі сліди довоєнної промисловості. Йому лише бракує всього іншого для її підтримки. Десятиліття занедбання тільки погіршили ситуацію. Патріарх уже підписує перші замовлення, щоб зрушити місто з мертвої точки."

  loi_solomon_industry_right1:0 "Дорога до Ірми"
  loi_solomon_industry_right1_desc:0 "Наші люди вже активно закладають основу для справжньої довоєнної дороги, що з’єднає Вейнрайт зі столицею. Це забезпечить зручне сполучення для робітників між поселеннями в ході ремонтних робіт."

  loi_cpf_midbranch:0 "Війна на Чотири Фронти"
  loi_cpf_midbranch_desc:0 "Багряні стяги майорять, і запах пороху наповнює повітря. Нарешті шакали, що ласували залишками КФН, наважилися на наступ. Вони розіб'ються об наш праведний клинок."

  loi_midbranch1:0 "Очищення Форту Саскачеван"
  loi_midbranch1_desc:0 "Просуваючись далі на землі Комуни, ми бачимо: страх бере своє. Вони в паніці тікають, кидаючи цінні припаси й зброю — усе це стане паливом для нашого наступу."

  loi_midbranch2:0 "Лойдмінстер Не Впаде"
  loi_midbranch2_desc:0 "Народ добре розуміє: ми — останній бастіон революції. Їхні вигуки підтримки лунають з тилу й дають нам силу йти далі."

  loi_midbranch3:0 "Не Давати Пощади"
  loi_midbranch3_desc:0 "Хоч би що не перетнуло пагорби, рівнини чи ріки — контрреволюціонери будуть зупинені. Ми гнатимемо їх, а зрештою, якщо Господь дозволить, настане суд."

  loi_midbranch4:0 "Резерв Даніїла"
  loi_midbranch4_desc:0 "Наш народ знає, що ми воюємо в ім’я Господнє. І вони знають, чим загрожує поразка. Хоч вони ніколи не тримали зброї, їхні серця б’ються з тією ж силою, як і в тих, хто все життя провів у бою."

  loi_midbranch5:0 "Оборонний Вал Міністерства"
  loi_midbranch5_desc:0 "Навіть перед лицем найбільших труднощів Патріарх стоїть вище всіх — дивиться вперед, туди, де перемога. Побачивши цю віру, що ж лишається нашим людям, як не боротися далі?"

  loi_midbranch6:0 "Команда Ідентифікації"
  loi_midbranch6_desc:0 "Команда ІД завершила ремонт — вчасно. Саме вони допоможуть нам прорвати ворожі лінії."

  loi_midbranch7:0 "Броньований Удар Списа"
  loi_midbranch7_desc:0 "Усі танкові батальйони повністю готові до бою. Тепер ми можемо використати формацію списа: танковий загін наступає клином, пробиваючи центр ворога, а потім заходить із тилу."

  loi_offshoot_midbranch1:0 "Змазати Долоню"
  loi_offshoot_midbranch1_desc:0 "Як би це не боліло Соломона, він погодився на доволі сумнівні контракти, щоб дати країні нове дихання в критичний момент. Духовенство незадоволене, але якщо хочуть зберегти свої голови, доведеться змиритися."

  loi_offshoot_midbranch2:0 "Рейди на Комуну"
  loi_offshoot_midbranch2_desc:0 "У війні та коханні всі засоби добрі — включно з реквізицією засобів виробництва заради вищої мети."

  loi_midbranch_post_cpf:0 "§gЗвук Безумовної Капітуляції§!"
  loi_midbranch_post_cpf_desc:0 "Коли пил осів — ми залишилися єдині. Переможці. Хтось здивований? Це було написано у зірках."

  loi_tank_inf_opening:0 "Нова Зброя"
  loi_tank_inf_opening_desc:0 "Завдяки тому, що танкісти тепер можуть відкрито говорити про свою роботу, ми виявили невідкритий ящик, привезений радянськими радниками. Усередині — десятки Калашникових, придатних лише для демонтажу. Та їхня конструкція — проста й легко відтворювана..."

  loi_tank_inf1:0 "Комбіновані Сили"
  loi_tank_inf1_desc:0 "Низька мобільність — основна слабкість танків. Щоб її компенсувати, ми додамо до загонів легкі машини розвідки."

  loi_tank_inf2:0 "На Повну Потужність"
  loi_tank_inf2_desc:0 "Полегшені машини забезпечуватимуть прикриття для флангів танкових батальйонів — вони з'являтимуться й зникатимуть з поля бою, зменшуючи втрати."

  loi_tank_inf3:0 "Фінансування Елітного Корпусу Танкістів"
  loi_tank_inf3_desc:0 "У тісних металевих нутрощах танків сидять герої, готові віддати життя за ідеали революції. Вони заслуговують на належну підготовку, щоб повернутись живими."

  loi_tank_inf4:0 "Ходити серед Велетнів"
  loi_tank_inf4_desc:0 "Хоч у нас більше піхоти, ніж танків, ми не бачимо причин не розширити нашу програму навчання й на тих, хто йде у бій пішки — віч-на-віч з ворогом."

  loi_tank_inf5:0 "Корпус Польових Медиків"
  loi_tank_inf5_desc:0 "Наша військова доктрина спирається на блискавичні удари та нещадну агресію. Без добре оснащених і навчених медиків далеко ми не просунемося."

  loi_tank_inf6:0 "Не Випускай Псів"
  loi_tank_inf6_desc:0 "Дехто з Генштабу вийшов із кімнати для нарад блідий, мов стіна. Усередині залишалася лише Катерина — поруч із нею пес, приведений для демонстрації. Капітан опустилася на коліно й погладила пса за вухом: “Усі повинні бути готові віддати життя за Революцію...”"

  loi_tank_inf7:0 "Підняти Стандарти"
  loi_tank_inf7_desc:0 "Чим суворішими стають наші тренування й витонченішими наші тактики, тим складнішим мусить бути й наше спорядження. Революцію не експортують на голому ентузіазмі й молитвах."

  loi_tank_inf_offshoot1:0 "Танки Небес"
  loi_tank_inf_offshoot1_desc:0 "Ми відновили кілька старих дирижаблів, що іржавіли на летовищах Лойдмінстера. Хоч їх і небагато, але страх, що вони викликають, переважить усе. До того ж це лише перший крок до повітряних проєктів майбутнього."

  loi_tank_inf_offshoot2:0 "Вони Пізнають Страх"
  loi_tank_inf_offshoot2_desc:0 "Катерині сняться криваво-червоні небеса та свист снарядів..."

  loi_job_aint_done:0 "§tПерегони з Часом§!"
  loi_job_aint_done_desc:0 "Поза Танковим Корпусом лишаються сумніви щодо бачення Катерини. Особливо серед ветеранів, яким не забулися уламки КФН. Якщо Капітан хоче успіху, їй доведеться довести свою спроможність — і негайно."

  loi_unifier_left1:0 "Покидьки Землі"
  loi_unifier_left1_desc:0 "Катерина терпляче чекала, доки гамір у залі не стихне..."

  loi_unifier_left2:0 "Час Розплати"
  loi_unifier_left2_desc:0 "Зграя рейдерів, якими верховодить бездушний ШІ, зациклений на торгівлі дрібничками — ідеальна мішень для нашої праведної боротьби."

  loi_unifier_left3:0 "Остання Купівля"
  loi_unifier_left3_desc:0 "Її волання ставали все гучнішими й відчайдушнішими, поки ми просувалися крізь вулиці Калгарі. Нарешті ми підійшли до непомітного складу в центрі міста..."

  loi_unifier_left4:0 "Зламати Бригаду"
  loi_unifier_left4_desc:0 "Маленького принца вигнали манітобські таргани. Жалюгідний вигнанець серед боягузів. Усунути його — це навіть милосердя."

  loi_unifier_left5:0 "Хитра Лисиця"
  loi_unifier_left5_desc:0 "Зайшовши у фінальну фортецю рейдерів, наші бійці знайшли щось зовсім несподіване..."

  loi_unifier_left6:0 "Мило й Вода"
  loi_unifier_left6_desc:0 "Щоб зупинити його, знадобився десяток чоловіків. М'язистий гігант, наполовину машина. Та з належною промивкою мізків і добрим скрабом, він іще може стати танкістом."

  loi_unifier_mid1:0 "§GВідчайдушні Торги§!"
  loi_unifier_mid1_desc:0 "Скарбниця переповнена — цього не змогли не помітити багатії Республіки. Тож якщо трохи багатства опиниться в їхніх кишенях — решта опозиції сидітиме тихо. Поки що."

  loi_unifier_mid2:0 "§RЖорстокі Чистки§!"
  loi_unifier_mid2_desc:0 "Навіщо потрібні лоялісти, якщо не мати кількох козлів відпущення для паперової бюрократії?"

  loi_unifier_mid3:0 "§8Утримати Баланс Сили За Будь-яку Ціну§!"
  loi_unifier_mid3_desc:0 "Катерина скинула всі маски. Політбюро вже знає: треба мовчати й плескати. А хто не знає — має всказати все одразу. Іншої нагоди не буде."

  loi_unifier_right1:0 "Привиди Минулого"
  loi_unifier_right1_desc:0 "Катерина стала за трибуну..."

  loi_unifier_right2:0 "Подорожні"
  loi_unifier_right2_desc:0 "Вартові не звідси. Вони щойно вдерлися в Скелясті Гори. І чому Північний Робітник має терпіти цих імперіалістів?"

  loi_unifier_right3:0 "Гірські Поселення"
  loi_unifier_right3_desc:0 "У кожній тріщині ховався ворог. І з кожного каменю міг визирнути ствол. Але кінець прийшов — їм уже ніде ховатися."

  loi_unifier_right4:0 "Безпечне Пекло"
  loi_unifier_right4_desc:0 "Жителі Сейфгейвена свідомо прихистили загарбників. Для нас це зрада, за яку платять суверенітетом."

  loi_unifier_right5:0 "Пропозиція Сейфгейвену"
  loi_unifier_right5_desc:0 "Знадобився тиждень облоги, аби над Сейфгейвеном замайорів білий прапор."

  loi_unifier_right6:0 "Кого Ви Покличете?"
  loi_unifier_right6_desc:0 "У Вартових не було багатого арсеналу тактик. Та наші люди вже знають, як протистояти їхнім підступним наскокам."

  loi_unifier_meetup:0 "Наш Старий Ворог"
  loi_unifier_meetup_desc:0 "На сході лежить місце народження загибелі КФН — гниюча держава, переобтяжена бюрократією. Лише легенький поштовх — і все розсиплеться. Катерина збиралася насолодитися цим видовищем."

  loi_unifier_electoral_cores:0 "Останній Сміх"
  loi_unifier_electoral_cores_desc:0 "Колись залишки КФН ще можна було звинуватити у втраті шляху. Але щодо гнилого насліддя ПФК — тут уже не про що сперечатися. Їхні принципи впали разом із ними, лишивши по собі лише уламки. Настав час нагадати їм, як виглядає справжня соціалістична доктрина."

  loi_unifier_cont_left1:0 "Крізь і До Кінця"
  loi_unifier_cont_left1_desc:0 "Вони мали піти, коли ще була нагода."

  loi_unifier_cont_left2:0 "З Шибениці"
  loi_unifier_cont_left2_desc:0 "У глибинах Північної Манітоби лежать прокляті ліси й болота, що приховують у собі жахи ночі, яких не бачили ще з перших років після Великої Війни. Це — рак у серці наших земель, і його треба вирвати з корінням, будь-якою ціною."

  loi_unifier_cont_left3:0 "Завершити Те, Що Почала Лідія"
  loi_unifier_cont_left3_desc:0 "Лідія відплатила Залізній Конфедерації за завдану шкоду. Але тоді КФН просто не вистачало ресурсів, щоб довести справу до кінця. Для Катерини ж було очевидно: коли мова йде про зрадників, треба відкрити всі гаманці."

  loi_unifier_cont_left4:0 "'Припустимо, Це Була Лише ДОЛЯ"
  loi_unifier_cont_left4_desc:0 "Комплекс MANIFEST упав, зруйнований під час бою з щупальцевим чудовиськом, що височіло над будівлею. Коли пил осів, жахи лісу вереснули в унісон — і зникли в темряві. Деякі таємниці краще залишити похованими під уламками..."

  loi_unifier_cont_right1:0 "Манітоба: Піньята Пандори"
  loi_unifier_cont_right1_desc:0 "Скільки мотузок ще треба обрізати, перш ніж ми доберемося до ляльковода?"

  loi_unifier_cont_right2:0 "Перетин Істервілля"
  loi_unifier_cont_right2_desc:0 "Королівство так зайняте державними справами, що лишило північний фланг відкритим. Вони ще пошкодують про це."

  loi_unifier_cont_right3:0 "Найбільший Підлизень Короля"
  loi_unifier_cont_right3_desc:0 "Закріпившись на берегах Вінніпегосіса, ми зіштовхнулися з васалами Короля. Якщо вдаримо зараз — встигнемо проковтнути їх до того, як бюрократія Манітоби зрозуміє, що ми вже в них у дворі."

  loi_unifier_cont_right4:0 "Вгадали, Хто Повернувся?"
  loi_unifier_cont_right4_desc:0 "Поки манітобські вельможі гралися в придворні інтриги, ми вже переступили через усіх їхніх колишніх союзників. Як довго вони ще будуть жити в ілюзіях, не усвідомлюючи, що вони вже мертві?"

  loi_unifier_cont_right5:0 "Зрівняти Рахунки"
  loi_unifier_cont_right5_desc:0 "Старий сидить у своїй вежі зі слонової кістки, захоплений власними мареннями, поки минуле змивається кров’ю зрадників. Час нанести йому візит."

  loi_unifier_cont_mid1:0 "Маяк У Темряві"
  loi_unifier_cont_mid1_desc:0 "Південь — це дрібні містечка й племена. Але навіть мале невідоме — це все ще невідоме. Катерина вирішила діяти на випередження."

  loi_unifier_cont_mid2:0 "Під Нашим Захистом"
  loi_unifier_cont_mid2_desc:0 "Скромні гуляки та мешканці цього регіону можуть спати спокійно, доки ми стоїмо на сторожі. Хочуть вони того чи ні."

  loi_unifier_continued:0 "Перемога — Якою Вона Є"
  loi_unifier_continued_desc:0 "Вперше за роки до обличь звичних постатей у залі повернувся колір..."

  loi_mercy_for_the_wicked:0 "Втихомирити Бурю"
  loi_mercy_for_the_wicked_desc:0 "Лише побачивши армію, що перевершила б сам КФН, Катерина усвідомила, що йде шляхом, яким вже колись йшли. Шляхом, якого Соломон усіма силами намагався уникнути — шляхом, що міг би знищити Лойдмінстер. І в одну мить усе стало ясно: щоб рухатися вперед, вона мусить забути про минуле."

  loi_settle_down_left1:0 "Спрямувати Увагу На Лойдмінстер"
  loi_settle_down_left1_desc:0 "Поки Катерина зосереджувалася на мілітаризації, столиця лишалася без нагляду. Але як вона може будувати краще майбутнє, якщо не здатна зробити це у власному домі?"

  loi_settle_down_left2:0 "Викопати Статуї З Болота"
  loi_settle_down_left2_desc:0 "Мешканці Лойдмінстера надто довго жили в злиднях. Катерина дозволила масштабне прибирання міста, щоб очистити вулиці від уламків Старого Світу."

  loi_settle_down_left3:0 "Централізація Емі"
  loi_settle_down_left3_desc:0 "Навіть зламаний годинник двічі на день показує точний час. Спроби Емі Терісі об'єднати промислові ресурси країни заради пролетаріату — саме такий випадок."

  loi_settle_down_left4:0 "Оживити Редмонд"
  loi_settle_down_left4_desc:0 "Ми весь час дивилися вдалечінь, прагнучи більшого. Та не усвідомлювали, що справжній скарб — під нашими ногами."

  loi_settle_down_left5:0 "Уроки Сільвії"
  loi_settle_down_left5_desc:0 "Наші кордони оточені чудовими канадськими скелями. Друзі в Скелястих Горах запропонували поділитися знаннями на випадок, якщо нам доведеться здійснити паломництво в ці ущелини. Катерина не вагалася ні хвилини."

  loi_settle_down_left6:0 "Програми Обміну Радниками"
  loi_settle_down_left6_desc:0 "Ми не приховуємо свої вразливості – якщо імперіалісти коли-небудь рушать на нас із Заходу, ми повинні переконатися, що вони не перетнуть Скелясті Гори. А якщо й перетнуть, важливо, щоб наші друзі в Перевалі навчилися виживати на відкритих преріях."

  loi_settle_down_left7:0 "Де-Американізація Ред-Діра"
  loi_settle_down_left7_desc:0 "Імперіалістичні отрути все ще гнють у цій частині нашої батьківщини. Катерина дозволила масштабну кампанію перевиховання, орієнтуючи її на мешканців Ред-Діра та їхні родини. Дорослих, можливо, вже не врятувати, але дітей ще можна."

  loi_settle_down_left8:0 "Блакитний Відтінок Шостої Бригади"
  loi_settle_down_left8_desc:0 "Плакати, що висять у кожному районі міста, зображують Шосту Бригаду як демонів, якими вони насправді були. Вчителі у класах читають запальні промови про звірства, скоєні імперіалістами, які жили на цих землях. Згодом забуті солдати залишаться лише легендарним «боягузом», на якому ми об’єднаємо наш народ."

  loi_settle_down_left9:0 "Канадський Щит"
  loi_settle_down_left9_desc:0 "Нехай американці приходять – вони розіб’ються й згорять об кам’яний щит, що тримається міцною хваткою канадських робітників."

  loi_settle_down_left_offshoot:0 "Пригода Вейлмаунт"
  loi_settle_down_left_offshoot_desc:0 "В кінцевому підсумку інтереси нашого народу збігаються. Жоден не хоче кровопролиття – обидва просто хочуть продовжувати жити своїм життям. Досить просте задання для нас – і точно вірне, сподівалася Катерина. Щось інше вимагало б радикальної корекції курсу."

  loi_settle_down_mid:0 "Невдячна Необхідність"
  loi_settle_down_mid_desc:0 "Пацифізм не означає відмову захищатися. Ми бачимо шлях до миру і співіснування з усіма мешканцями Півночі. Крім одного. Стампід несе в собі дух контрреволюціонерів і ніколи не поводився так, щоб переконати нас інакше. Їхнє придушення – це невідворотна жертва, але від якої ми не можемо відмовитися."

  loi_settle_down_right1:0 "Зруйнований Резерв"
  loi_settle_down_right1_desc:0 "Ми не можемо повернути все, що було втрачено під час перевороту. Але ми винні тим, кого обдурили, хоча б спробувати."

  loi_settle_down_right2:0 "Милосердя Для Злих"
  loi_settle_down_right2_desc:0 "Наскільки б старою та закам’янілою не була Церква, ми не можемо заперечувати, що значна частина її членів справді піклувалася про добробут Лойдмінстера. Їхній досвід у правлінні також не можна відкидати. Ми вирішили відновити Церкву в значно зменшеному та реформованому вигляді, щоб їхні кращі ідеї могли спливати на поверхню, а гниль залишалася захованою."

  loi_settle_down_right3:0 "Шляхи Для Нової Республіки"
  loi_settle_down_right3_desc:0 "Немає чіткішого шляху до визволення, ніж зв’язки, які ми створюємо. І немає кращого підтвердження цієї ідеї, ніж будівництво високоякісних доріг, що зв’язують наші різнорідні промислові та житлові громади."

  loi_settle_down_right4:0 "Відбудова Редмонда"
  loi_settle_down_right4_desc:0 "Війна не пощадила нічого, навіть найславетніше поселення КФН. На жаль, ми нічого не зробили для того, щоб виправити ситуацію — до цього часу."

  loi_settle_down_right5:0 "Реліквії RELCOM"
  loi_settle_down_right5_desc:0 "Машини лежать без руху під товстим снігом, не більш живі тепер, ніж коли вони пересувалися білим простором. Лише в такому стані вони можуть справно служити робітникам — кухарі, що обслуговують продовольчі банки, вже давно кричали про нові каструлі та сковорідки."

  loi_settle_down_right6:0 "Що Могло Бути"
  loi_settle_down_right6_desc:0 "Жодна людина не заслуговує на таку віру..."

  loi_settle_down_right7:0 "Друзі З Півдня"
  loi_settle_down_right7_desc:0 "Наші друзі з Safeheaven готові показати нам, що привілейований вихід з Vault-Tec не перешкоджає людині забруднити руки. Вони стверджують, що проживання в підземній спільноті навчає багатьом речам, включаючи електричне обслуговування."

  loi_settle_down_right8:0 "Уроки з Найгіршого"
  loi_settle_down_right8_desc:0 "Бункери Vault-Tec могли бути спроектовані для витримки руйнівних наслідків зовнішнього світу, але все, що виявляється всередині їхніх товстих стін, кричить про недбалість. Гнилі труби, поламане обладнання, електричні поломки... але життя розчарувань веде до стійкості. Люди з Safeheaven розуміють це краще за всіх."

  loi_settle_down_right9:0 "Альбертські Передовики"
  loi_settle_down_right9_desc:0 "Наші південні поселення можуть спокійно спати, знаючи, що Альберта їх охороняє."

  loi_settle_down_right_offshoot:0 "Стратегії Safeheaven"
  loi_settle_down_right_offshoot_desc:0 "Охороняючи Південні ворота Канади, ми маємо групу виживальників, озброєних до зубів і налаштованих на співпрацю. Гідні союзники в боротьбі за визволення північного робітника — якщо вони готові сісти за стіл переговорів."

  loi_settle_down_end:0 "§6На Старій Дорозі, Ми Знайшли Споку́ту§!"
  loi_settle_down_end_desc:0 "Коли Катерина готувалася до вечірнього заходу, вона ненароком поглянула на себе в дзеркало. Вперше за довгий час її щелепи були розслаблені, шви минулого розгладилися, постійний вираз злості пом’якшав... Вперше за довгий час вона відчула... спокій."

  loi_side_industry_tank:0 "Напад на Церкву Св. Леніна"
  loi_side_industry_tank_desc:0 "Церква, з якої нашого доброго патріарха витягли пізно тієї ночі, була осередком дрібних прикрас, вкритих золотом і сріблом. Прикраси, що таємно принесені кільком радянським радникам, які ще трималися за старі ідоли та ідеї. Продавши це мотлох, ми звільняємося від кайданів, що довго тримали наші тіла й розуми."

  loi_tank_industry_left1:0 "Подальші Сільськогосподарські Експерименти"
  loi_tank_industry_left1_desc:0 "Полегшуючи подорожі до і з Тандерчайлду, ми також сприяємо обміну деякими життєво важливими товарами, яких поселення давно було позбавлене, зокрема водою. В процесі цього ми відкриваємо можливості для більш сміливих сільськогосподарських експериментів, що підвищує інтерес до міста серед наших поселенців і повільно перетворює його на справжній хаб для нашого Східного флангу."

  loi_tank_industry_left2:0 "Латання Радіаційних Протікань"
  loi_tank_industry_left2_desc:0 "Наші польові дослідники виявили джерело радіації, що забруднює врожай Тандерчайлду. Схоже, що деякі автомобілі на звалищі не були повністю розібрані. Хтось мусить за це заплатити. Проте поселення отримає від цього вигоду."

  loi_tank_industry_left3:0 "Остання Обіцянка, Хліб"
  loi_tank_industry_left3_desc:0 "§GМир, Земля та Хліб§W. Таку обіцянку дав засновник §RСР§W своєму народу. Хоча Великий Батько нашої революції помер понад 300 років тому, ту саму обіцянку ми дали кожному, хто готовий приєднатися до нас у подорожі до Лойдмінстера. Нарешті, з нашими полями, що приносять урожай як ніколи раніше, ми можемо виправдати цю обіцянку. §GHай буде Хліб§!"

  loi_tank_industry_right1:0 "Доганяти"
  loi_tank_industry_right1_desc:0 "Чи то виробництво електрики, чи то озброєння, більшість наших підприємств покладаються на аналоговий, ручний підхід. Якщо ми хочемо наслідувати КФН на піку її могутності, нам слід замислитись над автоматизацією деяких функцій."

  loi_tank_industry_right2:0 "Очі в Небі"
  loi_tank_industry_right2_desc:0 "Північ, а ймовірно й решта континенту, були стерті ворогом, що залишався невидимим і майже нечутним. Цей ворог може бути все ще серед нас. Як би там не було, якщо пекельний вогонь знову обрушиться з небес, ми будемо готові."

  loi_tank_industry_right3:0 "Належна Інтеграція Комунікацій"
  loi_tank_industry_right3_desc:0 "Координація та комунікація. Обидва аспекти є ключовими для успішного блискавичного удару по ворогу, який має на меті внести якнайбільше розладу і залякування. Коли наші конвеєрні лінії працюють на повну потужність, кожен танк буде оснащений найновішими радіо технологіями для забезпечення успіху цієї тактики."

  loi_tank_industry_mid3:0 "Що Ми Маємо Тут?"
  loi_tank_industry_mid3_desc:0 "Неможливо вести багатофронтову війну місяцями без надійної промислової бази. В будь-якому разі, ми будемо використовувати її краще, ніж Комуна будь-коли могла."

  loi_tank_industry_mid4:0 "Благословення Емі"
  loi_tank_industry_mid4_desc:0 "Навіть із чорними заводами, що тягнуться далеко за білу прерію, здається, що Комуна мала ще кілька в роботі, залишених напівзбудованими на околицях Редмонда, коли почали звучати барабани війни. Потрібно кілька тижнів, щоб привести їх в робочий стан."

  loi_tank_industry_mid1:0 "Закриття Гулагів"
  loi_tank_industry_mid1_desc:0 "Революційні зусилля Комунарів з перевиховання були... непотрібними. Лояльність не можна купити через репресії або залякування. Ваші люди не рухатимуться вперед, поки ви не зможете надихнути їх на це. Дайте їм справу, за яку вони готові померти. Головуюча не засвоїла цей урок, і пам’ятники її невігластву стоятимуть, перероблені для того, щоб живити мрію, яку вона ніколи не могла здійснити."

  loi_tank_industry_mid2:0 "Плоди П’ятирічки"
  loi_tank_industry_mid2_desc:0 "За часів КФН П’ятирічні плани мали значення. Протягом існування Фронту було зафіксовано лише кілька таких планів, кожен з яких призводив до десятилітнього процвітання у великих поселеннях. У Комуні ці плани були спотворені, намагаючись прикрити бюрократичну некомпетентність під покриттям промислового планування. Ми зберемо те, що вдалося досягти, і відкинемо решту."

  loi_fine_jewel:0 "Дорогоцінний Камінь"
  loi_fine_jewel_desc:0 "Об’єднавши досягнення Комунарів, хоча й рідкісні, з нашими власними, ми виросли в нещо більше, ніж просто сума окремих частин. Справжня промислова стартова платформа для поширення нашої Революції на ширшу Північ. Ми не зупинимось, поки не досягнемо цієї мрії – так чи інакше."

  loi_solomon_pa_integrated:0 "Підхід Заднього Сидіння"
  loi_solomon_pa_integrated_desc:0 "Навіщо проливати кров овець, коли Північ має безліч праведних воїнів, готових померти за справу, більшу за них самих? Ну, принаймні, якщо є гроші. На щастя для Міністерства, цих грошей останнім часом в надлишку, і саме вони будуть паливом для професійної стіни щита, що покриває наші кордони."

  loi_solomon_integrated1:0 "На Борту Батлфорда"
  loi_solomon_integrated1_desc:0 "Чоловіки та жінки Батлфорда заробляли на життя, спрямовуючи свої рушниці на тих, хто спочатку навчав їх правильно тримати їх. Можливо, небезпечні компаньйони, але безперечно ефективні, яких ми можемо тримати під контролем за допомогою правильних інвестицій."

  loi_solomon_integrated2:0 "Відділ справ передових загонів"
  loi_solomon_integrated2_desc:0 "Оскільки ми вирішили передати більшу частину нашої оборони стороннім силам, логічно почати архівувати знання, принесені разом з цими найманцями. Якщо нам коли-небудь доведеться відмовитися від них, їх досвід залишиться з нами."

  loi_solomon_integrated3:0 "Уроки з Півдня"
  loi_solomon_integrated3_desc:0 "Зараз, коли Відділ зовнішніх зв'язків працює належним чином, ми можемо бути трохи більш амбіційними. Патріарх санкціонував трансляцію, що має дістатися аж до Сполучених Штатів. Ті, хто готовий вирушити в цю подорож, будуть одразу зараховані – їх відданість справі буде продемонстрована лише їхнім шляхом."

  loi_solomon_integrated4:0 "Ваша Дружня Компанія Найманців"
  loi_solomon_integrated4_desc:0 "Якщо ви можете залякати ворога до зіткнення на полі бою, ви вже виграли. Соломон прочитав це в книжці якось. А може, в буклеті. Це було вже давно..."

  loi_solomon_integrated5:0 "Надзвичайно Потрібні Модернізації"
  loi_solomon_integrated5_desc:0 "Через кілька місяців після нашого рішення почати набір найманих компаній, наші ряди значно поповнилися. Мечники з усієї континенту змішуються в Міністерстві, об’єднуючи досвід і різноманітність у постійну силу, що варта значно більше, ніж просто сума її частин."

  loi_solomon_integrated8:0 "Бойові Броні Для Людей"
  loi_solomon_integrated8_desc:0 "Якщо все інше зазнає невдачі, і якщо кожен найманець тікатиме перед непереборним ворогом, Міністерству доведеться мати останній рубіж оборони. Бойові броні вже один раз врятували Лойдмінстер. Якщо виникне потреба, вони знову будуть викликані до дії."

  loi_solomon_pa5:0 "Знищення Тирана"
  loi_solomon_pa5_desc:0 "Коли Редмонд повністю підкорений, і всі претенденти знищені, ми звертаємо свою увагу на демона, який все це почав. Того, хто сприяв падінню Фронту. І того, хто, в іншому житті, не вагався б відправити людей Лойдмінстера на ешафот. Остання голова КФН, Емі Терезе."

  loi_solomon_pa6:0 "Відновлення Лінії Редмонд-Нортенд"
  loi_solomon_pa6_desc:0 "Оволодівши повним контролем над західними рубежами річки Саскачеван, Міністерство опинилося в чудовій позиції для контролю за комерційними потоками, що течуть вгору та вниз по річці. Завдяки вмілій дипломатії, Патріарх зміг отримати вигідні умови від незалежних торговців, які перевозять товари між Скелястими горами та Манітобою."

  loi_solomon_pa7:0 "Яка Трата Грошей"
  loi_solomon_pa7_desc:0 "Глибоко під Редмондом знаходиться сховище, яке залишилося неторкнутим. На жаль, його зали зіпсовані, нічого цінного не знайдено, окрім купи сміття та старовинної електроніки. Добре, що це може допомогти підремонтувати кілька старих машин, але більше нічого."

  loi_solomon_pa8:0 "Важливість Важкої Зброї"
  loi_solomon_pa8_desc:0 "Не можна недооцінювати важливість підтримуючої зброї. Порівнюючи моделі конструкцій, знайдені по всьому регіону, ми зможемо вибрати найбільш ефективні для стандарту наших сил."

  loi_solomon_pa_new_spear:0 "Нове Спис"
  loi_solomon_pa_new_spear_desc:0 "Люди Міністерства небагаточисельні. Їм доведеться компенсувати це чистою силою. Оскільки один чоловік в бойовій броні може побороти сотню без неї. Кожен солдат, який з’явиться без свого костюма під час робочого часу, буде негайно виключений зі складу."

  loi_solomon_spear1:0 "Відділ Спеціалізованої Війни"
  loi_solomon_spear1_desc:0 "Нові часи вимагають нових стратегій, а нові стратегії потребують нової стандартизації. На щастя для нас, ми досить вправні у мистецтві бюрократії."

  loi_solomon_spear2:0 "Кров і Сталь"
  loi_solomon_spear2_desc:0 "Низькоякісні передвоєнні гвинтівки могли бути достатніми в критичні дні Чотирьохфронтової війни. Тепер ми не можемо дозволити собі озброювати своїх людей зброєю, що може зламатися, коли її схопить потужний рукавичок. Хоча це рішення означає скорочення чисельності наших солдатів ще більше, воно також означає, що ті, хто буде на передовій, зможуть боротися з більшою впевненістю в надійності свого обладнання."

  loi_solomon_spear3:0 "Повний Бій"
  loi_solomon_spear3_desc:0 "Ніхто не може залишити поле бою вірним, коли людські ресурси такі дорогі на Півночі. Дуков і її помічники працюють над вдосконаленням наших наявних конструкцій бойових броньованих костюмів, щоб створити костюми, здатні витримати тривале піддавання вогню. Як-ніби потрібно очистити бункер, без жодної можливості втечі — тільки повна перемога."

  loi_solomon_spear4:0 "Жага до Сили"
  loi_solomon_spear4_desc:0 "Повільніше, громіздкіше і складніше у виробництві, але з такою вогневою потужністю, яка може пробити радянський танк. Компроміс, на який Патріарх був більш ніж готовий піти."

  loi_solomon_spear5:0 "Що Було Їхнім, Тепер Наше"
  loi_solomon_spear5_desc:0 "Програма вже дає плоди: десятки нових експериментальних костюмів, створених на основі імперіалістичних сил, сходять з конвеєра. Хоча вони ще не досягли рівня, якого сподівалася Дуков, вона впевнена, що зможе розвивати ці прототипи далі."

  loi_clergy_cleanup_allquiet2:0 "Відновити Пенітенціар"
  loi_clergy_cleanup_allquiet2_desc:0 "Зелені двори колись слугували виправним закладом для ворогів революції — під керівництвом Страткомуна вони перетворилися на нічого більше, як на бойню для дисидентів. Але Господь вчить нас, що кожна загублена вівця може повернутися на правильний шлях. Пенітенціар буде відновлений, і всі, хто потребує перевиховання, будуть працювати через свої гріхи, відчуваючи піт на своєму чолі."

loi_clergy_cleanup_allquiet3:0 "Старі Стежки"
loi_clergy_cleanup_allquiet3_desc:0 "Редмонд був серцем Страткомуну, і як можна було очікувати, місцеві жителі важко покладаються на зрадників. Щоб виграти їхню довіру, Патріарх відправив партію постачань з Лойдмінстера, починаючи з промислових районів на північ від річки..."

loi_clergy_cleanup_allquiet4:0 "Реінтеграція Редмонду"
loi_clergy_cleanup_allquiet4_desc:0 "...Перед тим як перейти до житлових районів на південь."

loi_clergy_cleanup_allquiet5:0 "Від Гріховного Полону"
loi_clergy_cleanup_allquiet5_desc:0 "Кожна вулиця в містах Міністерства раніше була забруднена бродягами, що намагались нажитись на слабких. Та більше не так. Чоловіки виконали чудову роботу, вигнавши цих хуліганів і відправивши їх до в'язниць. Тут, за милістю Божою, вони стануть кращими людьми."

loi_clergy_cleanup_allquiet6:0 "Віддаючи Повернення"
loi_clergy_cleanup_allquiet6_desc:0 "Протягом останніх кількох років Лойдмінстер розцвітає. Декілька мешканців були помічені на вулицях в дорогоцінних прикрасах та чистому передвоєнному одязі. Але як це може бути справедливим, коли годувальник у Вайткорті змушений пропускати обіди, щоб його діти не залишались без хліба? Добрий Господь вчить любити ближнього свого — час уже взяти це вчення до серця."

loi_clergy_cleanup_allquiet7:0 "Пережити Шторм"
loi_clergy_cleanup_allquiet7_desc:0 "Холодний вітер був відчутний з півдня, змушуючи Соломона здригатися..."

loi_clergy_cleanup_allquiet8:0 "У Бій"
loi_clergy_cleanup_allquiet8_desc:0 "З кількома членами духовенства, розташованими по всьому Міністерству для впровадження різних політик, санкціонованих Патріархом, центр залишився відкритим. Рейно такий швидко це помітив і підійшов до Соломона з пропозицією..."

loi_clergy_cleanup_allquiet9:0 "Чудово Виконана Робота"
loi_clergy_cleanup_allquiet9_desc:0 "В усіх куточках Міністерства духовенство не приймають. Хто ці претенденти, що сидять на своїх слонових тронах, поки люди працюють на полях? Ні. Саме Соломона хоче народ. Люди, які не бояться провести день на конвеєрі або відправити службу в найбідніших районах. Справжній син Бога. Справжній Патріарх."

loi_solomon_foreign_relations:0 "Департамент Закордонних Справ"
loi_solomon_foreign_relations_desc:0 "Серед численних справ, які Міністерство нехтувало під час нашого адміністративного сну, — це наші взаємини з народами поза колишньою сферою впливу КНФ. Багато хто боїться повернення Фронту, вирощених на страшних історіях про звірства цієї організації. Це наш обов'язок — виправити своє ім'я і зробити Редмонд тим, чим він завжди мав бути: силою добра."

loi_solomon_relations_bgr1:0 "Порожній КОВЧЕГ"
loi_solomon_relations_bgr1_desc:0 "Сподіваючись, що на заводі в Гранд-Прейрі більше не буде сюрпризів, Соломон вирішив санкціонувати миротворчу операцію по місту та його околицях, щоб технології, що знаходяться там, могли бути перепрофільовані для благородніших цілей."

loi_solomon_relations_bgr2:0 "Яскраві Ліхтарі, Яскравіші Розуми"
loi_solomon_relations_bgr2_desc:0 "Чутки про роботів-смітників, що блукають по руїнах, швидко поширюються по Міністерству, залучаючи сміливців і вчених. Хоча загроза від ботів значною мірою минула, цей інтерес ми можемо використати на свою користь. Уже Патріарх наказав, щоб кожен, хто має необхідні кваліфікації, отримав доступ до колишніх проклятих об'єктів."

loi_solomon_relations_whc1:0 "Повернення До Вайткорту"
loi_solomon_relations_whc1_desc:0 "Розпакуємо свої валізи, мої втомлені діти. Спадкові власники повернулись."

loi_solomon_relations_whc2:0 "Більше Ніж Прикордонне Правосуддя"
loi_solomon_relations_whc2_desc:0 "Північ — це суворе місце, де панує сила, а добрі наміри зруйновані жорстокими амбіціями людини. Довгий час це місце вимагало від батьків і матерів справедливості в їхніх власних руках. Більше цього не буде, каже Патріарх. Навіть найгірших дияволів можна врятувати, і цей обов'язок лягає на плечі Соломона. Він не відпочине, поки не доведе свою хрестову похід."

loi_solomon_relations_com1:0 "Створення Зони Окупації"
loi_solomon_relations_com1_desc:0 "Зростаюча кількість незалежних торговців приїжджає до резиденції Соломона, обвинувачуючи Патріарха у нападах на вантажі, що рухаються навколо Ред Діра. Такого бути не може. Не якщо Міністерство має підтримувати свою репутацію."

loi_solomon_relations_com2:0 "Могутніші за Меч"
loi_solomon_relations_com2_desc:0 "Хоча повстанські групи ще не були повністю знищені, найбільші з них починають розуміти, в якому напрямку дує вітер. Патріарх санкціонував відкриту політику дверей до свого кабінету, щоб будь-який потенційний співпрацівник міг впевнено прийти і скласти зброю."

loi_allquiet_outcome:0 "Доля Танкістів"
loi_allquiet_outcome_desc:0 "Танкісти ведуть своє коріння з самого народження КНФ. Багато з цих установ, разом зі своїми союзниками, залишились у Редмонді, коли контингент Лідії виїхав до Лойдмінстера. Ми з ними розберемося."

loi_solomon_industry_left2:0 "Наслідки Революції"
loi_solomon_industry_left2_desc:0 "Зростання породжує більше зростання. Як майстерні продовжують відкриватися по всьому Верміліону, все більше і більше колишніх спеціалістів приїжджають до міста, відкриваючи незалежні комерційні заклади, щоб підтримати існуючі підприємства. Цикл процвітання, який Соломон був більше ніж готовий підтримати."

loi_solomon_industry_left3:0 "Виклик Друзям"
loi_solomon_industry_left3_desc:0 "Після кількох переговорів і неабиякого вмовляння з боку Соломона, Дукова погодилася організувати майстер-класи для молодших працівників, зайнятих на заводах боєприпасів. Вона погодилась передати їм деякі хитрощі ремесла, щоб її знання були збережені для майбутніх поколінь."

loi_solomon_industry_left4:0 "Відновлення Експорту Зброї"
loi_solomon_industry_left4_desc:0 "Соломон не любить насильства, але оскільки Міністерству бракує природних ресурсів, робочі місця у виробництві зброї та боєприпасів є одним з небагатьох шляхів, якими його народ може вибратися з бідності. Патріарх погодився зробити крок далі, розпочавши переговори з делегаціями з півночі, щоб знайти підходящих і помірковано добрих людей, яким можна продавати ці товари."

loi_solomon_industry_left5:0 "Повторна Революція Верміліона"
loi_solomon_industry_left5_desc:0 "Серед усіх вражаючих будівель, що з'явилися в Верміліоні протягом останніх кількох місяців, одна дуже проста, але важлива була занедбана: водяний колодязь. Новий був лише що викопаний в центрі міста і зроблений легко доступним для різних працівників заводів, розташованих по всьому поселенню. Символ нової життя, що тече в його жилах."

loi_solomon_industry_middle_opening:0 "Сторіччя Нехтування"
loi_solomon_industry_middle_opening_desc:0 "Занадто довго очі Соломона були заплющені, чи то через прагнення до програми КНФ, чи то через необхідність піклуватися про людей Лойдмінстера в часи після розпаду Фронту. Нарешті, у свій найнижчий момент – він відчув, що прокинувся."

loi_solomon_industry_middle1:0 "Департамент Реновацій"
loi_solomon_industry_middle1_desc:0 "За часів керівництва КНФ загальне благополуччя було принесене в жертву на вівтар військової та промислової ефективності. Очевидно, це був нестабільний підхід, який Соломон намагатиметься виправити, перенаправивши виробництво важкої промисловості для забезпечення більш легкого доступу до основних товарів."

loi_solomon_industry_middle2:0 "Невикористання Марвея"
loi_solomon_industry_middle2_desc:0 "Те, що одна з гілок держави зайнята забезпеченням повсякденного благополуччя народу, не повинно відбуватися за рахунок економіки. Департамент Реновацій буде розширений, щоб включати навчальні майстер-класи, що займаються удосконаленням сировини, так що мешканці Міністерства зможуть продовжувати своє навчання під час вільного часу."

loi_solomon_industry_middle3:0 "Наш Кусок Раю"
loi_solomon_industry_middle3_desc:0 "Ефективність може бути не завжди головним, але вона стає необхідною, коли на кону стоїть щастя людей. Автоматизуючи деякі адміністративні функції Департаменту, ми зможемо збільшити виробництво і таким чином підвищити загальний рівень задоволення життям у Міністерстві."

loi_solomon_industry_middle4:0 "Відновлення Великої Слави"
loi_solomon_industry_middle4_desc:0 "Оснастивши Департамент Реновацій усіма необхідними інструментами для успіху, Соломон готується запустити масштабну операцію з реконструкції найбільших пам'яток КНФ. Не все було рожевим в старі часи, але навіть похмуре минуле може викликати теплі почуття ностальгії, якщо подивитись на нього через правильні лінзи."

loi_solomon_clergy_preallquiet1:0 "Стан Справ"
loi_solomon_clergy_preallquiet1_desc:0 "Соломон прорвався через своїх помічників, перш ніж втрапити до кабінету і закрити за собою двері. Йому потрібно було прояснити думки, щоб вирішити проблему, що стояла перед ним."

loi_solomon_clergy_preallquiet2:0 "Друзі в Потрібний Час"
loi_solomon_clergy_preallquiet2_desc:0 "Соломон вдало виділив кілька з більш гнучких членів духовенства, забезпечивши грант на створення кількох розважальних центрів в Міністерстві. Адже всі роботи і жодної гри роблять працівника нудним хлопцем."

loi_solomon_clergy_preallquiet3:0 "Перезапуск Реабілітаційних Центрів"
loi_solomon_clergy_preallquiet3_desc:0 "Холод атрофує почуття і псує судження. Ми повинні зробити все можливе, щоб підтримати цих заблукалих душ."

loi_solomon_clergy_preallquiet4:0 "Медовий Поток КНФ"
loi_solomon_clergy_preallquiet4_desc:0 "Ми нарешті почали переглядати записи, що були надані танкістами під час початкової евакуації з Редмонду. Вони містять важливі знахідки, архівовані старими дослідницькими підрозділами КНФ протягом десятиліть, що безсумнівно допоможуть нам в майбутньому у промисловому та військовому розвитку."

loi_solomon_clergy_preallquiet5:0 "Зіткнення з Корупцією Лицем до Лиця"
loi_solomon_clergy_preallquiet5_desc:0 "Очистивши кілька дрібних питань в діях Соломона, шлях до початку реформи структури духовенства став відкритим. Це буде довгий, виснажливий і потенційно кривавий процес, але ми повинні зустріти його лицем до лиця, щоб зміцнити основи Міністерства для прийдешніх поколінь."

loi_solomon_industry_right2:0 "Минули помилки"
loi_solomon_industry_right2_desc:0 "Уейнрайт почав як просто велика індустріальна яма, де працівники проводили години, кожного дня добираючись до своїх місць роботи і назад. Збудувавши більше житла, ми закладемо основу для процвітаючої споживчої економіки, яку це поселення так гостро потребує."

loi_solomon_industry_right3:0 "Підбираючи те, що випало"
loi_solomon_industry_right3_desc:0 "Інерція сама по собі не буде достатньою. Уейнрайту знадобляться більші й кращі субсидії, якщо він хоче перетворитися на щось справді особливе."

loi_solomon_industry_right4:0 "Розширення Ринків"
loi_solomon_industry_right4_desc:0 "Якщо робітник втомиться від диму та гуркоту поршнів і іншого промислового обладнання, він завжди повинен мати можливість оселитися в селі, щоб вести спокійніше життя, працюючи на фермі."

loi_solomon_industry_right5:0 "Повторна Революція Уейнрайта"
loi_solomon_industry_right5_desc:0 "В той день, коли Соломон відвідав новий центр міста Уейнрайта, він побачив те, що раніше не було знайомо на вулицях міста: сім’ю з маленькими дітьми."

loi_solomon_industry_meetup:0 "Повернення до Бізнесу"
loi_solomon_industry_meetup_desc:0 "Патріарх вдихнув нове життя в міста Міністерства; він боровся з глибоко вкоріненою корупцією з божественним переконанням; і він дав новий шанс на життя смиренним. Що б інше Господь не запланував для нього, він буде готовий виконати."

