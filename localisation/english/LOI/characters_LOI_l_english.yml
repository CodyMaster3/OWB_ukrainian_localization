l_english:
LOI_CIVIL_WAR_LEADER_NAME: "Комуна Танкерів"

LOI_CIVIL_WAR_EKATERINA_REPLACEMENT_NAME: "Надзвичайна Рада"

LOI_ERIC_ROSE_NAME: "Ерік Роуз"
LOI_ERIC_ROSE_DESC: "У душі прикордонник, Ерік Роуз вірить у ідеали давньої поліцейської організації — констеблів. Патрулюючи засніжені землі Міністерства Лойда, Ерік прагне підтримувати закон і порядок у маленьких містах і поселеннях, поки уряд країни бореться сам із собою."

LOI_DANIEL_MOUNTAINBACKER_NAME: "Даніель Маунтенбекер"
LOI_DANIEL_MOUNTAINBACKER_DESC: "Відносно стриманий у своїх поглядах щодо танкерів чи духовенства, Даніель Маунтенбекер вважає, що єдиний шлях до миру — це швидкий та рішучий удар по ворогах Лойдмінстера. Його переконання беруть початок у філософії констеблів, якої він дотримується, блукаючи крижаним краєм, роздираним чварами."

LOI_GRIGORY_TEMAN_NAME: "Григорій Теман"
LOI_GRIGORY_TEMAN_DESC: "Сім’янин і чоловік Джилл Теман, Григорій — один із небагатьох людей у Лойдмінстері, хто має уявлення про морську тактику. Вивчивши старі книжки в бібліотеках Марвейну, він навчає невеличкий екіпаж Коп'я залишкам флоту за отриманими знаннями."

LOI_DUKOV_NAME: "Сава Дуков"
LOI_DUKOV_DESC: ""

LOI_SHARED_AIR_NAME: "Костянтин Ковалёв"
LOI_SHARED_AIR_DESC: "§F\"Зробимо Гагаріна гордим.\"§!\n\nГоловний командир того, що в Лойді називають “повітряними силами”, Костянтин є нащадком радянських льотчиків, яких було відправлено для навчання опору. Вірний їхнім настановам, він і далі вчить молодь літати — через демонстрації або просто кидаючи в них підручником."

LOI_RECKERS_ADVISOR_NAME: "Джек Рекерс"
LOI_RECKERS_ADVISOR_DESC: "Родом із Батлфорда, Джек Рекерс був вигнаний після численних відмов у вступі до міліцій через його наполягання на впорядкованій структурі. Оселившись у Лойдмінстері, він взявся за організацію місцевих загонів у Вейнрайті, щоб підтримувати порядок і готуватися до неминучого конфлікту."

LOI_VERA_NAME: "Віра Морозова"
LOI_VERA_DESC: "Світліший бік медалі у противазі до репутації духовенства й танкерів, Віра Морозова намагається підтримувати ці відносини — на відміну від своєї протилежності, Варінки. Вона глибоко віруюча, має тісні зв’язки з духовенством, але загалом байдужа до уряду."

LOI_YELENA_NAME: "Єлена Алексєєва"
LOI_YELENA_DESC: "Часто її називають «Майже Світлячок». Єлена — вихідка з села поблизу Пайкс-Піку, що захоплюється інженерією. Через витоки радіації на електростанції в Тандерчайлді, Єлені доручено запобігти зараженню ферм у регіоні."

LOI_THERESA_NAME: "Тереза Лінн"
LOI_THERESA_DESC: "Походження Терези Лінн у Лойдмінстері саме по собі дивне. Спершу вона була місіонеркою з Heaven's Gate, відправленою на Північ. Та її довге перебування тут привело до прийняття християнсько-комуністичних ідеалів. Хоча мілітаризм Heaven's Gate досі відчувається в її поведінці."

LOI_BOB_NAME: "Боб Дейнджер"

LOI_PUMP_NAME: "Памп Акула"

LOI_NIGHTKIN_NAME: "Лу Ґонд"

LOI_SOLOMON_NAME: "Соломон"
LOI_SOLOMON_DESC: "§6Паломник.\nПатріарх.\nБатько Нації.§!\nІм’я Соломона Бушара відоме серед тих, хто ще насмілюється вірити в ці відчайдушні часи. Старий, що проповідує Слово Боже і тримає промови, гідні великих ораторів минулого.\nКолишній громадянин атеїстичного Канадського Народного Фронту, Соломон наважився дати людям надію, коли все довкола валилось. Його служіння прокладали шлях до відродження. Коли Фронт упав, він привів людей до спасіння в убогому містечку Лойдмінстер.\nМинуло багато років — Лойдмінстер став прихистком для загублених душ.\n\n§6Але зі смертю близьких і зневірою, що згризла його зсередини, варто замислитись: чи залишиться все таким?§!"

LOI_SOLOMON_CAPSTONE_DESC: "§CПатріарх.\nЕталон.\nПівнічний Захисник.§!\nІм’я Соломона Бушара досі живе серед тих, хто мріє про кращий світ.\nПісля перевороту Катерини та руйнування церкви Святого Леніна, Соломон зрозумів — щоб захистити дім, треба взятися за зброю.\nНе повністю зрікшись пацифізму, він ремілітаризував Лойдмінстер, і зібрав армію зношених обладунків, гвинтівок і Біблій.\nВони перемогли тиранію Емі Терезі.\n\nУ наступні місяці Соломон зробив, здавалося б, неможливе: очистив владу, відновив стабільність і вивів духовенство з хаосу."
  #LOI_SOLOMON_OLD_DESC: "In Lloydminster there stands an old man preaching the good word of Christ while holding speeches to rival those of the past. The name Patriarch Solomon is known far and wide among those who still dare to believe in these desperate times, but people also speak of that he diverges from the Christ most people know. While most of the communists within the shattered parts of the Canadian People’s Front looked to China it is said Solomon looks to the old bastion. Where many people speculate this is why his version of Christ differs from the one of old, and also why his version of communism is so different from that of his peers."
LOI_SOLOMON_BOUCHARD_NAME: "Соломон Бушар"
LOI_SOLOMON_ADVISOR_DESC: ""

LOI_REYNAULD_NAME: "Рейнольд"
LOI_REYNAULD_DESC: ""

LOI_INQUISITOR_NAME: "Олександр Саймондс"
LOI_INQUISITOR_DESC: "Суворе релігійне виховання й природна паранойя завжди переслідували Саймондса. Його посада Інквізитора дає йому змогу повністю реалізовувати своє покликання — нести слово християнсько-марксистського суспільства тим, хто його потребує, — чи то через підступ, чи лагідну руку."

LOI_DANIIL_NAME: "Даниїл Антонов"
LOI_DANIIL_DESC: "На тлі зростаючого розколу між духовенством і танкерами, найбільше недовіри відчувається до танкерів із ферм Тандерчайлда і Пайкс-Піку. Коли пролунала команда формувати міліцію проти танкерів, Даниїл радо став на чолі групи справжніх вірян."

LOI_ILYA_NAME: "Ілля Міхайлов"
LOI_ILYA_DESC: "Місцевий член судової гілки, Ілля Міхайлов твердо вірить у верховенство закону — як з давніх підручників, так і з комуністичних ідеалів, якими керувався КНФ. Завжди стежить за дотриманням порядку, використовуючи практичний підхід до втілення католицько-марксистського контролю в Міністерстві."

LOI_LISETTE_NAME: "Лізетт Лейн"
LOI_LISETTE_DESC: "Кар'єра як шпигунки-журналістки не склалася так, як хотіла Лізетт Лейн. Її відправили до Лойдмінстера для поширення пропаганди та збору розвідданих, пригрозивши смертю в разі дезертирства. Усвідомивши, що шансів більше на виживання саме тут, Лізетт вирішила залишитися й використати свої навички видавництва на користь громади."

LOI_CAMILLE_NAME: "Каміль Патено"
LOI_CAMILLE_DESC: "Схильна до махінацій подруга Казидіра Максіма, Каміль була головною причиною того, чому так багато коштів «зникло» і «чомусь» виявилося використано для облаштування «комфортного» життя. Хоча тепер вона оселилася в Лоїді, її старі звички можуть знову проявитися — на користь логістики Лойдмінстера."

LOI_YAKOV_NAME: "Яків Соколо"
LOI_YAKOV_DESC: "§4«Поїзди більше не ходять вчасно, тож саме час їх порізати й вдихнути у деталі нове життя.»§!\n\nВідомий як «Начальник Ярдів Вейнрайта», Яків має важливу задачу: розбирати залишки потягів і вагонів, які й досі іржавіють на коліях від часів падіння бомб. Меблі, інструменти, запчастини — його завзятість забезпечує Лойдмінстер металобрухтом: бо потягів вистачить надовго."

LOI_BORIS_NAME: "Борис Полпов"
LOI_BORIS_DESC: "Житель Верміліона та місцевий зброяр, Борис є нащадком радянських іммігрантів, які оселилися тут ще до вибуху бомб. Вирісши в католицькому районі, Борис з радістю прийняв католицько-марксистську віру Міністерства Лойда та тепер постачає зброю для міліцій."

LOI_LOID_NAME: "Лойд IV"
LOI_LOID_DESC: "§N«Таке ім’я — не знось!»§!\n\nНащадок родини іммігрантів, що оселилися в Лойдмінстері до війни, Лойд IV очолює те, що залишилося від родинного спадку. Харизматичний і життєрадісний, він намагається допомогти громаді Лойдмінстера, не займаючи жодної зі сторін у великому розколі."

LOI_EKATERINA_NAME: "Катерина"
LOI_EKATERINA_DONSKOYA_NAME: "Катерина Донськая"
LOI_EKATERINA_DESC: "§tСпадкоємиця.\nДонька.\nПолум’я Революції.§!\nКатерина — мабуть, найкращий приклад справжньої спадкоємиці Батька комунізму після того, як світ поглинули полум’я та попіл двісті років тому.\nПро її минуле й батьків майже нічого не відомо: померли або зникли, тож роль матері для неї відіграла Лідія. Після її смерті Катерина стала командувачкою Коп'я КНФ §g(нова назва в розробці)§! і здобула собі гучне ім’я.\nТа юність несе не лише завзятість, а й нестабільність...\n\n§tЗ такою особою при владі, люди можуть почати замислюватися, чи не згорить найяскравіше полум’я найшвидше.§!"

LOI_EKATERINA_UNIFIER_DESC: "§RСпадкоємиця.\nПолум’я.\nОб’єднувачка.§!\nКатерина — найяскравіша постать новітнього комунізму.\nПісля сходження на трон у 2275, вона виправила помилки КНФ, знищивши труп, що називав себе 'Страткоммуною'.\n\nПісля повернення в Редмонд і видатної промови, Катерина почала Кампанію Об’єднання — щоб повернути втрачене й втілити свій план. Згуртувавши Схід, вона рушила до узбережжя.\n\nСтоячи з підзорною трубою на нафтовому танкері, вона дісталася Обіцяної Землі — і повернулася без жодної подряпини. З новими союзами й раніше недосяжними секретами.\n\n§RПолум’я палає яскравіше, ніж будь-коли.§!"

  LOI_EKATERINA_MERCIFUL_DESC: "§6The Stoic.\nThe Sovereign.\nThe Merciful.§!\nEkaterina might've been the closest the world will ever see to a proper heir to the father of communism.\nAfter her ascension to chairwoman in 2275, she went above and beyond the call of duty, retaking Redmond, securing The Casket, and pushing the Americans from Red Deer.\nShe was fierce, fiery, and determined to commit to her grand plan, ready to announce it during her speech.\nBut then, in that moment, she realized what she had done.\nTo Solomon.\nTo the clerics.\nTo the people.\nSo she did what she thought was just. She cast out her plan in favor of defending their true home of Alberta.\nIn the aftermath of her decision, Ekaterina's resolve remained unyielding, her demeanour masking the turmoil within. As the weight of her responsibilities pressed upon her, she embraced her role with unwavering determination. Despite the sacrifices and challenges ahead, her now merciful nature shone through in every decision she made, always striving to protect and serve her people.\n\nUnder her leadership, Alberta flourished, a beacon of stability in a world ravaged by chaos. Ekaterina's legacy as a §6stoic§!, §6sovereign§!, and §6merciful§! leader endured, etching her name into the annals of history as a true protector of the North."

LOI_EKATERINA_MERCIFUL_DESC: "§6Стоїчна.\nСуверенна.\nМилосердна.§!\nКатерина, можливо, була найближчою до істинної спадкоємиці батька комунізму, яку бачив світ.\nПісля сходження на пост голови у 2275 році вона перевершила всі очікування — повернула Редмонд, закріпила Ковчег і вигнала американців із Ред-Діру.\nВона була жорсткою, палкою, відданою своїй грандіозній меті й готувалася проголосити її під час виступу.\nТа в ту мить вона усвідомила, що накоїла.\nІз Соломоном.\nІз духовенством.\nІз народом.\nТож вона зробила те, що вважала справедливим — відмовилася від свого плану на користь оборони справжнього дому — Альберти.\nПісля цього рішення рішучість Катерини не зламалась. Хоч зовні вона залишалась незворушною, всередині нею точила боротьба. Та вона прийняла свою роль з гідністю. Незважаючи на жертви й виклики, її нова милосердна натура проявлялася в кожному рішенні.\n\nПід її керівництвом Альберта розквітла — острів стабільності серед хаосу. Спадщина Катерини як §6стоячої§!, §6суверенної§! та §6милосердної§! правительки залишилася навічно — справжньої захисниці Півночі."

LOI_JILL_TEMAN_NAME: "Джилл Теман"
LOI_JILL_TEMAN_DESC: "Вірна учасниця Коп'я, Джилл Теман виступає за реформи в Міністерстві Лойда, прагнучи стабілізувати націю. Своїми виступами перед місцевими громадами й натхненними промовами до танкерів вона намагається утримати державу вкупі."

LOI_ELIS_MIKOSHI_NAME: "Еліс Мікосі"
LOI_ELIS_MIKOSHI_DESC: "Зі спини вантажівки зі брухтом або сидячи на мотоциклі, Еліс Мікосі завжди вірив у принцип: «Армію, що рухається, не зупинити». Прихильник мобільної війни, Мікосі завжди мав тісні зв’язки з танкерами у боротьбі за замерзлу північ."

LOI_MIKHAIL_VOLKOV_NAME: "Михайло Волков"
LOI_MIKHAIL_VOLKOV_DESC: "Тіньова фігура всередині Коп’я, Михайло завжди віддавав перевагу методам шпигунства і саботажу — у внутрішній чи зовнішній політиці. Навіть ціною внутрішньої стабільності Міністерства Лойда, він зробить усе, аби викорінити загрозу."

LOI_MILUNKA_NAME: "Мілюнка Адж"

LOI_ARTYOM_ADVISOR_NAME: "Артем Лебедєв"
LOI_ARTYOM_ADVISOR_DESC: "§g«Некомпетентність цих танкерів досі мене вражає.»§!\n\nАртем Лебедєв — один із танкерів, відряджених із КНФ до Лойдмінстера разом із Лідією, переважно як наставник для молодших військових. Через славнозвісну халатність танкерів (особливо забувати, чи є пальне), головна мета Артема — тримати молодь під контролем і стежити, аби ніхто не підірвався."

LOI_NATALIA_ADVISOR_NAME: "Наталія Белл"
LOI_NATALIA_ADVISOR_DESC: "Прізвисько «Нова мати Царської» Наталія Белл отримала на честь танкової роти Лідії. Вона очолила Коп'я до того, як Катерина змогла зайняти посаду. Як незмінна прихильниця КНФ, Наталія відстоювала свободу та ідеали Міністерства Лойда на сталевих гусеницях Коп’я."

LOI_VARINKA_NAME: "Варінка Гусєва"
LOI_VARINKA_DESC: "Завзята прихильниця КНФ, Варінка є повною протилежністю Вірі. Вона вірить у здатність Коп’я керувати Міністерством Лойда. Не розділяючи католицькі вірування, Варінка притримується атеїстичних ідеалів."

LOI_KAZIDIR_NAME: "Казидір Максим"
LOI_KAZIDIR_DESC: "Казидір, більше знаний як «Логістичний геній», здобув славу здатністю «виникати» з ресурсами нізвідки. Подейкують, його майстерність постачання бере початок ще зі Страткомуни, де він виводив кошти на фінансування власних махінацій."

LOI_PRAIRIE_Маріонетку_LEADER_NAME: "Автономний об'єкт"

LOI_SUCESSOR1_NAME: "Тимчасово"

LOI_SUCESSOR2_NAME: "Тимчасово"

LOI_SUCESSOR3_NAME: "Токарєв"
LOI_SUCESSOR3_DESC: ""

# Динамічні назви лідерів держави
LOI_GPAER_NAME: "G.P.A.E.R."
LOI_ADVISORY_COUNCIL_NAME: "Рада Радників"
LOI_MINISTERIAL_ADVISORY_COUNCIL_NAME: "Міністерська Рада Радників"
LOI_GOVERNOR_EKATERINA_NAME: "Губернатор Катерина"