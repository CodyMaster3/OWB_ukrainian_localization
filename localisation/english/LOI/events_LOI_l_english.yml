nf_loi.8.t:0 "Втратa Манітоби"
nf_loi.8.d:0 "Колапс Канадського Народного Фронту (КНФ) на початку 2100-х років став хаотичним і раптовим розвитком подій, і, без сумніву, це була одна з найкривавіших глав історії Півночі з часів Великої війни. У цей період КНФ був обтяжений внутрішніми конфліктами і розбіжностями щодо стану і подальшого напрямку організації, не допомагала йому й територіальна надмірність. \n\nРейдери та сильні люди, що забруднили східні околиці Фронту, швидко скористалися цією жахливою бюрократичною паралічем. Без підкріплень на горизонті, керівництво КНФ в Манітобі було швидко ліквідоване, місцеві вожді розділили територію між собою. Найкмітливіший з них, низькопробний рейдер з Уінніпеґа, зрозумів, що тільки силою не вдасться утримати місто в довгостроковій перспективі. Адже люди бачили, яким може бути справедливий, функціонуючий національний державний утвір. \n\nОтже, треба було створити нову вигадку, навколо якої майбутні покоління могли б згуртуватися, як це сталося з КНФ. Незабаром, вождь Уінніпеґа оголосить себе королем Ґанном, першим у своєму роді, апеляція до спадщини, порядку та стабільності, які так бажали місцеві. Політичний геній, хоч як мені це боляче визнавати. \n\nЗгодом, більш безладні сусідні вожді впорядкувалися. До сьогодні прапор Королівства Манітоби все ще майорить над регіоном. \n\nНасмішкування над усім, що стояв КНФ, над ідеями, які ми намагалися закріпити по всій Півночі. Помилка."
nf_loi.8.a:0 "§tОсь одну з них я збираюся виправити і досягти успіху там, де вони зазнали невдачі.§!"

