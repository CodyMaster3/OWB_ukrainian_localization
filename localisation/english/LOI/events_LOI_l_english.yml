l_english:
nf_loi.1.t:0 "З Росії з любов'ю"
nf_loi.1.d:0 "Наша спадщина не походить від відчайдушного канадського народу або від китайців, які побачили можливості в важкі часи. Наша спадщина приходить з Росії. Ми можемо простежити наше коріння до експедиції танкових радників, відправлених до Канади, щоб навчити солдатів КНФ використовувати свої танки проти американських окупаційних сил, адже бомби перетворили їх короткострокове перебування на постійну справу.\n\nЗ часом ми почали приймати більше, ніж просто їхні знання про зброю. Ми повністю успадкували їхню релігію, їхню культуру і їхню історію. Ми злили їхні реальності з нашими, щоб створити щось нове в бурях війни. Наші солдати стали Спарою нового руху, силою неперевершеного майстерності на руїнах. Ми успадкували багато від минулого наших пращурів, і найважливіше з цього було..."
nf_loi.1.a:0 "Радянське виробництво, вершина промислової могутності."
nf_loi.1.b:0 "Радянський моральний дух, рука, що придушила фашизм."

nf_loi.2.t:0 "Імперії приходять і йдуть"
nf_loi.2.d:0 "Нічого не триває вічно. Це незаперечний факт життя, з яким людство бореться з самого початку своєї історії. Канадський народний фронт не став винятком з цього правила.\n\nПоступово, крок за кроком. Кожна зрада і суперечка наближали його до кінця. Все це кульмінувалося у розпаді. Масова боротьба за владу призвела до успадкування Емі Терезе як нового Генерального Секретаря. Підла істота, що піднялася на верх через незаконні методи; її спрага до влади не мала меж, і нічого не було під її владою, щоб здобути її. Це зайняло всього кілька моментів після її підйому до Генерального Секретаря КНФ, коли Люди оголосили незалежність. Як доміно, вони падали, звільняючись від її гніту. КНФ більше не існувало.\n\nПатріарх Соломон був непомітною людиною під час всього цього, пристрасно проповідуючи Добру Книгу всім, хто б міг слухати. Він, як і багато інших, шукав свободи від наступного хаосу. Він запропонував сміливий план. Він і його група, що складалася з тисяч, вирушать на Схід, щоб захопити незайняті землі і створити власну державу. Подорож була довгою, і переповненою труднощами, але за Божою благодаттю, вони дісталися."
nf_loi.2.a:0 "Через збереження віри зміцнилася"
nf_loi.2.b:0 "Внутрішній розпач – там знаходиться світло"

nf_loi.3.t:0 "Неочікуваний захисник"
nf_loi.3.d:0 "Запитайте будь-якого члена КНФ, що вони думають про танки Спари, і ви отримаєте численні відповіді. Безпека, Тиранія, захист і могутність – все це зазвичай спливає на думку. Але всі погоджуються з одним. Вони уособлювали силу. Коли люди в Лойдмінстері почули гуркіт танків, які повільно наближалися, вони вважали, що це, мабуть, буде кінець їхнього нещасного експедиційного походу. Вони готувалися до кінця, мирячись з Богом.\n\nАле всупереч усім очікуванням, вибухи не пролунали, і жоден снаряд не був випущений.\n\nТанки стояли дивно нерухомо біля нещодавно відновленого міста, ніби оцінюючи свого супротивника. Сніг важко метався навколо них, ізолюючи їх від решти світу. Їхня доля мала бути вирішена саме в цей момент. Голос прозвучав з бурі, виходячи звідки танки стояли. Він кликав Соломона. Патріарх пішов за голосом.\n\nЗ того дня в Лойдмінстері почало з’являтися життя. Було укладено угоду між Соломоном і лідером Спари, Лідою Доноською. Тепер вони не стояли на самоті, і Спари захищатимуть зростаюче міністерство від усіх, хто намагатиметься їм зашкодити."
nf_loi.3.a:0 "Об’єднані в вірі, пороху і священному сталі."

nf_loi.4.t:0 "Обачність, мій старий друг"
nf_loi.4.d:0 "Глибока і особиста дружба між Патріархом Соломоном і лідерами Спари Лідою та Катериною була колись красивою справою, і їхнє співробітництво було гордістю і радістю скромних людей Лойдмінстера.\n\nАле після смерті Ліди Соломон опинився в замороженому стані через горе і не міг впоратися з її втратою. Після її смерті апатія повільно почала охоплювати державу, навіть Церква стала більш замкненою і егоцентричною. Звичайні люди закликають до рішення, сподіваючись, що Міністерство все ще може повернутися до родини, якою воно колись було. Фракціоналізм охопив, розділяючи повільно що руйнується Церкву і революційних Танкістів Спари.\n\nПатріарх Соломон має надію, що зможе зберегти все разом – командувач Катерина побачила бездіяльність Соломона і не вірить, що є надія на мирний шлях вперед. Їхні послідовники об'єднуються за ними, і з очікуванням на своїх плечах, обидва знають, що є лише один шлях уперед. Врятувати це місто самотужки або померти, намагаючись."
nf_loi.4.a:0 "§6Второзаконня 31:6§!"
nf_loi.4.b:0 "§t1 Коринтянам 16:13§!"

nf_loi.5.t:0 "Гіганти минулого"
nf_loi.5.d:0 ""Чи знаєш ти, чому нас завжди посилають на такі місії?" – запитав Лев свого товариша-танкіста, Йосипа.\n"Це досить очевидно, бо ми найкращі." – відповів Йосип, оглядаючи навколишні скелі.\n"Якщо це так, то, мабуть, мені варто спробувати менше. Це місце випромінює якесь... моторошне відчуття." – пробурмотів Лев.\n"Ти боїшся, Лев?" – запитав Йосип, явно насміхаючись з нього.\n"Не починай! Я не в настрої для цього." – Йосип лише засміявся і зробив ковток з фляги.\n\nОбидва вирушили в путь, з кожним кроком зимові бурі навколо них ставали все сильнішими. Йосип вже збирався розповісти нову історію, як раптом зупинився. Він витягнув бінокль і почав уважно дивитися, ніби зачарований тим, що побачив. "Що? Чому ти зупинився? Це небезпека?" – Лев запитав, нервово тягнучись за своїм пістолетом. Йосип не відповів, а просто зняв бінокль з очей і почав їх витирати, а потім знову подивився через них. "Йосип! Що ти, чорт забирай, дивишся!?" – Лев нервово задерев’янів, намагаючись привернути увагу товариша. Знову ж таки, Йосип не відповів. Він просто зняв бінокль і передав його Леву, його очі залишалися зосереджені на тому, що було перед ними. "Дай подивитися. Це не може бути жарт, інакше я..." – Лев не закінчив свою думку, повторюючи попередні рухи, які зробив Йосип. В самому серці бурі лежало замерзле поле з бездіяльними танками, яке тяглося так глибоко в білу далечінь, як тільки могла бачити око."
nf_loi.5.a:0 "§gНам потрібно забрати їх додому§!"
nf_loi.5.b:0 "§gНам потрібно їх вивчити§!"

nf_loi.6.t:0 "Ми пам'ятаємо твоє ім'я"
nf_loi.6.d:0 "Темрява покрила місто Лойдмінстер, занурюючи його в море абсолютної чорності. Не чутно було жодного звуку, жодне світло не можна було побачити, окрім одного маленького офісного комплексу. В його холодних коридорах перебували командувач Катерина та Наталія Белл, дві танкістки, які опинилися в розпалі чогось величезного і зрадницького — гори документів, що стосувалися неминучого перевороту. Коли командувач Спари прийняла рішення деякий час тому, вона не вважала, що купа незаповнених паперів стане важливою частиною її схеми. Але кожен невирішений кінець потребував врахування, незалежно від того, як нудним цей процес здавався деяким людям.\nПридушуючи позіхання, вона продовжувала переглядати документи, що лежали перед нею. Слова почали змішуватися і перетворюватися на кашу, її повіки раптом стали дуже важкими. Вона була лише кілька миттєвостей від того, щоб заснути, коли голос розбудив її. "Ти думаєш, Лідія насолоджувалася цією частиною роботи?" – Тихий голос Наталії змусив Катерину різко поглянути на неї. Командувач стисла щелепу, трохи напружившись. Думка про смерть Лідії все ще боліла. "Ні. Зовсім не так. Але якби вона була тут, то вже давно б закінчила це." – Катерина дивилася на документи.\n"Ми, мабуть, навіть не мали б проходити через це спочатку," – виправила Наталія. Вона мала рацію. Саме залізна воля Лідії тримала танкістів, коли часи здавались найбільш темними. За її та Соломоновою волею було створене Міністерство Лойда. Катерина дуже сумувала за нею.\n"Марна трата часу." – пробурмотіла вона.\n"Я теж сумую за нею, Катерино." – сказала Наталія. Катерина швидко підняла голову, лаючи себе за те, що так просто продемонструвала свої емоції. "Ти маєш право на скорботу, на час для обробки емоцій. Це здоровий процес," – тихо прошепотіла Наталія з надією.\n"Коли буде час," – суворо заявила Катерина, даючи зрозуміти, що хоче, щоб цю тему залишили.\n"Вона багато хорошого говорила про тебе, коли ти була молодша. Коли я пішла у відставку, було досить очевидно, кого вона вибере для моєї ролі. Вона не хотіла, щоб ти втратила себе." – Катерина не відповіла, а просто важко зітхнула і продовжила працювати. У неї не було часу для емоцій, було багато справ.\n"Ну, це дивно," – пробурмотіла Наталія. Вона підняла погляд. "Ти справді не маєш прізвища, Катерино?"\n"Ні. Це мене ніколи не турбувало," – хмикнула Катерина. "Лідія була моєю родиною. Мене не цікавили мої батьки," – додала вона. Вона подивилася на Наталію і побачила, як та дивиться на блакитний і рожевий аркуш паперу. Це здалося знайомим. Їй прийшла в голову думка. "Можна?"\n"Звісно."\n"Дякую." – Наталія передала їй свідоцтво про народження, і Катерина взяла ручку. Вона вагалася, а потім зробила обережне редагування, додаючи прізвище друга, який мав жити довше.\n§1Катерина Донська.§!"
nf_loi.6.a:0 "§gЯ справді буду сумувати за Лідією.§!"

nf_loi.7.t:0 "Хвилі змінюються"
nf_loi.7.d:0 "Катерина важко зітхнула, її очі щільно закрилися, коли вона слухала звуки бою, що лунали ззовні. Адреналін прокачував її розум, її тривоги намагалися розірвати її. Вона трималася; вона повинна була це зробити. Голос покликав її: "Дуков уже близько, ми майже закінчили," – сказав він. Катерина повернулася до голосу і побачила лідера своєї розвідувальної агенції, Михайла Волкова. "Ми робимо правильну справу, Катерино. Ти ж знаєш, так?" Він дивився прямо на неї.\n"Звісно," – відповіла вона суворо, частково намагаючись переконати себе.\n"Ти побачиш, це те, що ми повинні зробити," – сказав Волков, бачачи наскрізь її фасад. Вона відкрила рот, щоб відповісти, але в цей момент двері з розгону відкрилися, і увійшов Сава Дуков, супроводжуваний трьома солдатами. У його руках трималися Соломон, сам побитий і в крові. Його кинуло на підлогу, він зойкнув від болю і подивився на Катерину, з його обличчя котилися сльози. "Чому? Чому ти це зробила? Так багато невинних людей постраждали через тебе," – зітхав Соломон.\n"Як ти смієш звинувачувати мене в цьому! Це ти це зробив. Ти змусив мене діяти. Твоя апатія, твоя сліпота. Ти це зробив!" – закричала Катерина на Соломона, сам він поступово ставав усе більш жахнутим, коли вона продовжувала.\n"Ні, ні! Це неправильно! Ми могли б усе виправити! Катерино, будь ласка! Ти можеш виправити це, відпусти своїх солдатів, і ми поговоримо, будь ласка!" – благав Соломон. Катерина подивилася йому в очі. Море емоцій накрило її розум. Одна питання постійно звучала в її голові. 'Чи правильно я це роблю?'. Вона повернулася і почала ходити по кімнаті. "Я намагалася поговорити з тобою! Намагалася попередити! Тільки тепер ти благав про прощення. Як я можу бути впевненою, що ти будеш правдивим?" – запитала Катерина.\n"Ти не можеш бути серйозною," – прошепотів Волков в жаху. "Цей викидень сидів і нічого не робив, поки наші люди страждали. Він має бути покараний за свої злочини!"\n"Тихо!" – закричала Катерина на Волкова, потім звернула свою увагу на Соломона. "Я не повинна тобі прощати. Люди заслуговують на справедливість. Але якщо ти і твої люди обіцяєте працювати з нами для блага нації, я дозволю тобі йти на свободу." Вона стиснула губи, її очі звужувалися, коли вона дивилася на Соломона. Це не було частиною плану, але бачити його на підлозі, що плаче — це боліло їй. "Добре. Ти правий. Я дозволила апатії поглинути мене, але якщо ти пробачиш мене і моїх людей, я обіцяю, що ми зможемо працювати разом." Соломон підняв голову і спробував примусити себе посміхнутися, попри свою кров'яну пащу. "Так, щоб нічого подібного більше не сталося. Дякую, Екат-" Раптово пролунала постріл. Соломон упав на підлогу, і кров почала хлистати з його шиї, злегка булькаючи в роті, перш ніж він замовк."
nf_loi.7.a:0 "§t"Що ти зробила!?"§!"

nf_loi_solomon.11.t:0 "Емі проти Лойдмінстера"
nf_loi_solomon.11.d:0 ""Наступна справа. Народний суд у справі голови Емі Тересі проти народу Лойдмінстера. Голова Тересі, ви звинувачуєтесь у фізичному та словесному насильстві над канадськими робітниками під вашим керівництвом, зраді Фронту, військових злочинах найвищого рівня та спротиві арешту. Як ви відповідаєте?"\n\nЕмі не вимовила жодного слова. Вона сканувала зали переповненого трибуналу, її холодний погляд пронизував кожного з бюрократів, що дивилися на неї з галереї зверху. Багатьох вона впізнала. Розчаровані, застряглі, нездатні до дій середні чиновники старих днів КНФ. Тепер вони сиділи і перероблені як "Духовенство" патріарха, виголошуючи все, що потрібно, щоб просунутися.\n\nЦе не були товариші. Вони ніколи не були. Блукаючі, готові зрадити цінності, у які вони вірять на початку, до того, як все могло б розцвісти в щось прекрасне. Вона повинна була стрибнути в Саскачеван, щойно вони перетнули межу з Редмондом. Це була б більш шляхетна кінцівка, ніж те, що чекає її.\n\nЇї отрута висіла на кінчику язика. Але вона не збиралася дати їм задоволення. Не цього дня. Вона знову опустила голову вниз. Вони отримали повідомлення.\n\nЧлени журі спостерігали за нею байдуже кілька моментів, перш ніж обмінятися знаними поглядами. Ніяких довгих нарад не було потрібно. "Голова Емі Тересі. Духовенство Міністерства визнає вас винною по всіх пунктах і засуджує до страти розстрілом. Нехай Бог помилує вашу душу.""
nf_loi_solomon.11.a:0 "§6"Вона більше не могла завдати шкоди."§!"

nf_loi_solomon.12.t:0 "Солодкі сни"
nf_loi_solomon.12.d:0 "Редмонд тримав багато важких спогадів для Соломона. Це було місто, яке він вважав домом більшу частину свого життя, і за це він був вдячний. Воно надавало безпеку та можливість приносити слово Господа своєму народу. Але сказати, що він пишався своїм колишнім домом, було б далеко від правди. Попри це, він все ще відчував невгамовне бажання відвідати його. Пройшло багато часу, і ностальгія тягнула його до старого міста.\n\nСоломон попрямував до однієї з старих церков, яку він і його народ використовували під час складної епохи заходу влади Страткомуни. Насправді церква була просто покинутою будівлею, перетвореною на релігійний осередок. Старі думки викликали усмішку на обличчі Соломона. Він привітав священиків у церкві з усмішкою і відкритими обіймами, після того, як він був так зайнятий.\n\n"Мої друзі, як йдуть справи?" – запитав він. Священики всі привітали його з обережною радістю.\n"Досить добре, Соломоне. Зусилля з відбудови йдуть стабільним темпом, і люди задоволені," – сказав один зі священиків. "Є одна маленька проблема, яка виникла," – додав він задумливо.\n"Що це?" – занепокоєння Соломона було очевидним.\n"Справа в могилі Емі Тересі. Ми намагалися тримати її в чистоті, але люди постійно її псують. Ми неодноразово знаходили її покритою фарбою та олією, а надгробок постійно руйнується. Його вже заміняли двічі." Священик почухав шию. Соломон подивився на дах, заглиблений у роздуми. Це була важка тема. Хоча було очевидно, що ніхто не сумує через втрату Емі Тересі, осквернення її могили не було тим, що Соломон хотів би схвалювати.\nВін поглянув на священиків. "Я думаю, у мене є рішення."\n\nЇї тіло було викопано і перенесено на світанку в секретне та урочисте місце. Лише Соломон знав, де воно. Біля самотнього дерева була встановлена могила. Вона була скромною і маленькою, складеною з дрібних каменів. На низькому валу лежали молоток і серп, зігнуті один над одним. Патріарх став на коліна і прошепотів тиху молитву, перш ніж повернутися і піти."
nf_loi_solomon.12.a:0 "§6"Навіть якщо вона була найгіршою, ми все одно віддамо їй найкраще."§!"

nf_loi_solomon.13.t:0 "Тільки в Канаді"
nf_loi_solomon.13.d:0 ""Запах тут жахливий," – пробурмотів Соломон собі під носа, входячи в головну базу разом із Дуковим. Вони повернулися на основну базу RELCOM, щоб продовжити розслідування після попереднього інциденту, що призвів до загибелі RELCOM. Парочка рухалася до головного консоля, обережно уникаючи кроків на розм'яклих мозках, які були розкидані по кімнаті. "Ти кажеш, він почав вибухати ці мозки?" – запитав Соломон. "Я й сам слабо в це вірю, хоча я був там. Той факт, що ця штука командувала арміями роботів, — це страшна думка," – сказав Дуков. "Згоден," – відповів Соломон.\n\nВони дісталися до центрального консоля, і Дуков почав натискати кілька кнопок на ньому. "Га, ця штука досі працює," – здивовано промовив він. "Подивися, чи вижив який-небудь мозок після всього цього? Було б краще вимкнути їх, щоб уникнути нових проблем," – запитав Соломон. Дуков рикнув і почав набирати на клавіатурі. "Здається, є чотири залишки. Сценарій, Шедоуз оф Ред, Манифесто RELCOM і Ти частина 1. Що за хрень була ця машина? Це просто шари безглуздого тексту, запхнутого в мозки, як в холотейпи," – сказав Дуков, злісно. "І... Хейлі?" – сказав Дуков, збентежено. "Хейлі?" – запитав Соломон. "Так. На відміну від інших, цей мозок ще підключений до інтерфейсу RELCOM. Він не так сильно деградував. Тепер, коли я думаю, RELCOM спеціально уникнув його вибуху, він сказав, що це дорогоцінне. Може, нам варто розслідувати?" – запитав Дуков. Соломон вагався, боячись, що вони можуть стати занадто зацікавленими в цьому. Тим не менш, Дуков і він сам були здатними, і Соломон відчував себе дуже зацікавленим в Хейлі. "Гаразд, увімкни його. Лише будь обережним, тримай зброю напоготові," – сказав Соломон суворо. Дуков натиснув кілька кнопок. Незабаром було чути шум. Вони подивилися, як один з контейнерів для мозків почав миготіти, його екран увімкнувся. На екрані з'явився здивуючий зображення маленького чорного котика з маленькою білою плямою на грудях, з динаміків контейнера почувся слабкий, низької якості мявкання. "Це що?" – запитав Дуков. "Не може бути," – пробурмотів Соломон, шокований."
nf_loi_solomon.13.a:0 "§6"Мозок кота???"§!"

nf_loi_solomon.14.t:0 "Чашка холодної води на заході сонця"
nf_loi_solomon.14.d:0 "Соломон відсунувся від свого столу, коли будильник на віконній рамі почав дзвеніти. Він натиснув кнопку сну, поглянувши на захід сонця на горизонті—"хм," промурмотів він. Вперше за багато років він закінчив перегляд свого backlog о 5 вечора.\n\nВін підвівся і підійшов до саморобного диспенсера в кутку кімнати, наливши собі склянку крижано-холодної очищеної води. Він повернувся до вікна, оглядаючи місто, підносячи металеву чашку до губ.\n\nДезінфестація духовенства почала приносити плоди. Він почав помічати, що обсяг дублюючих і зайвих паперів зменшився за останні кілька тижнів, але він не усвідомив, скільки часу витрачав на їх розбір. Години і години його життя, що йшли коту під хвіст, витрачені на турботи про все: від зловмисного саботажу до простої некомпетентності в руках тієї інституції - \n\nНі. Він зупинив себе. Це було в минулому. Закінчено. У майбутньому він міг рухатись вперед без тягаря. А в теперішньому – йому було благословено з ясною головою, кришталево чистою водою та заходом сонця. Що ще може вимагати людина від Господа?"
nf_loi_solomon.14.a:0 "§6"Можливо, я піду на прогулянку.."§!"

nf_loi_solomon.51.t:0 "Господь дає крила"
nf_loi_solomon.51.d:0 "Наші розвідники з півдня щойно повернулися з повідомленням про дуже незвичайне явище. Серед сутичок, що лютували в Монтані в останні кілька років, одне плем'я стало несподіваним переможцем — Буревійники. Попри їх... сільський вигляд, вони якось здобули доступ до досить розвинутих технологій для подорожей у небі — і використовують їх дуже ефективно.\n\nЦе не так вже й дивно. За кількома артефактами, які нам вдалося знайти, вони здаються фанатично відданими будь-якому виду з крилами. Тривожно, що вони проявляють таку ж завзятість, щоб показово розправлятися з усіма, хто потрапляє на їхню територію.\n\nЩо за головний біль, подумав Соломон. Як би йому не хотілося допомогти цим небожителям неба знайти свій шлях, його ресурси були на межі. І що, якщо щось піде не так? Мрії про Лойдмінстер в полум'ї мучили його.\n\nКраще грати в безпечну гру. Він надішле одного з його найкращих дипломатів, щоб вступити в контакт з плем'ям. Нехай Бог буде з ним."
nf_loi_solomon.51.a:0 "§6"Не моя перша вибірка союзників.."§!"

nf_loi_solomon.52.t:0 "Обіцянки меду, молока та танків"
nf_loi_solomon.52.d:0 "Того дня до Сліпучого Градка прийшов посланець з півночі. Він говорив про братерство, про слово Господа, про хорошу їжу та веселощі. Він стверджував, що об'єднавши праведну сталь на колесах і праведну сталь з крилами, ми можемо звільнити велику білу рівнину від зла. Що ми можемо принести мир нашому народу та й за його межами. Відповідно, Сліпучий Градок.."
nf_loi_solomon.52.a:0 "§O...Погодився знайти шлях вперед.§!"
nf_loi_solomon.52.b:0 "§O...Засунули його в бензин і повернули в мішку для трупів.§!"

nf_loi_solomon.53.t:0 "О, Господи, це спрацювало?"
nf_loi_solomon.53.d:0 "Соломон відчув полегшення, дізнавшись, що його радник благополучно повернувся додому... І досить здивувався, чесно кажучи, хоча він не збирався говорити це вголос. Але тепер починається складна частина. Тримати Буревійників в узді вимагатиме значної дипломатичної кмітливості та наполегливості. Більше ресурсів, щоб кинути в цей купу. Більше ресурсів, яких у нього просто немає.\n\nПоки що, надіслати невеликий загін броньованих солдатів, можливо, буде достатньо, щоб продемонструвати добру волю. Фактор залякування — приємний бонус. Він думав, як будуть сприймати їхні шоломи з намальованими крилами."
nf_loi_solomon.53.a:0 "§6"Я вже починаю шкодувати про це.."§!"

nf_loi_solomon.54.t:0 "Ну, ми спробували"
nf_loi_solomon.54.d:0 "Член екіпажу просто втратив свідомість, коли вони розпакували тіло радника, якого ми надіслали до Буревійників. Побоювання Соломона підтвердилися. Ніякі перемовини з доброї волі не працюватимуть з цими людьми.\n\nЛойдмінстер не може дозволити собі залишатися байдужим у такий час. Чоловіків треба мобілізувати. Підземні укриття будувати. Жінок та дітей евакуювати. Ми, можливо, не зможемо захистити себе від пекельного вогню, що падатиме з небес, коли настане час. Але ми зробимо все, що в наших силах, щоб виграти час для інших."
nf_loi_solomon.54.a:0 "§6"Боже, захисти нас."§!"

nf_loi.100.t:0 "Результат експедиції"
nf_loi.100.d:0 "Наші експедиційні операції виявилися задовільними. Було знайдено менше, ніж бажалося, але те, що ми змогли дістати, все ж є корисним. Ідея наступної експедиції обговорюється, оскільки багато хто вважає, що витрати не можна виправдати у порівнянні з тим, що ми знайшли та розташували."
nf_loi.100.a:0 "§gКраще, ніж нічого§!"

nf_loi.101.t:0 "Абсолютно нічого"
nf_loi.101.d:0 "Наша експедиція відзвітувала. Після кількох днів пошуків, витрачених ресурсів і багатьох небезпечних моментів, вони не знайшли нічого. Абсолютно нічого. Лише замерзла пустеля і нескінченний сніг. Повна втрата часу і людських ресурсів. Сподіваюся, що наступна експедиція буде більш плідною. §RХоча б зупинить солдатів від бурмотіння.§!"
nf_loi.101.a:0 "§tЧорт, ну!§!"

nf_loi.102.t:0 "Старий склад"
nf_loi.102.d:0 "Наша експедиція відзвітувала. Після досить інтенсивної піщаної бурі вони знайшли напівпохований склад у снігу. Буря, ймовірно, його виволокла, і після кількох годин розчищення наша команда змогла відчинити двері. Всередині вони знайшли старі частини машин, кілька ящиків боєприпасів і зброї, а також кілька довоєнних танків. Загалом, успішна експедиція. Механічні частини однозначно допоможуть ремонтувати і підтримувати наші танки."
nf_loi.102.a:0 "§gСподіваюся, наступна експедиція буде такою ж плідною.§!"

nf_loi.103.t:0 "Старий лінійний корабель"
nf_loi.103.d:0 "Наша експедиція відзвітувала. Після того, як вони слідували старою дорогою вздовж узбережжя, вони помітили старий довоєнний американський лінійний корабель. Обережно рухаючись через лід до нахиленого корабля, наші війська проникли всередину. Корабель був порожній, екіпаж, ймовірно, покинув його століття тому, хоча в каюті капітана знайшли кілька старих бойових посібників. Малий здобуток, але все ж корисний у довгостроковій перспективі."
nf_loi.103.a:0 "§gІ подумати, що такі велетні колись панували на хвилях.§!"

nf_loi.104.t:0 "Старе поле бою"
nf_loi.104.d:0 "Наша експедиція відзвітувала. Піднявшись на пагорб, вони виявили старе поле бою. Обережно рухаючись через зруйновану землю та замерзлі тіла, вони знайшли позначки американських військ і КНФ. Окрім кількох ще працюючих гармат, тут не було нічого. Наші війська встановили меморіальний хрест, перед тим як залишити мертвих у спокої. Сподіваємося, що вони не дивитимуться на нас з ганьбою за те, чим став світ."
nf_loi.104.a:0 "§gПрости нас за наші гріхи, бо ми лише хочемо вижити.§!"

nf_loi.105.t:0 "Результат експедиції"
nf_loi.105.d:0 "Наші експедиційні операції виявилися дуже плідними. Незважаючи на те, наскільки це було витратно, ми безсумнівно можемо виправдати це завдяки великій кількості ресурсів та інформації, які ми здобули. Вже почалися плани для початку наступної експедиції, але наразі ми можемо спокійно відпочити, знаючи, що привезли багато до [LOI.capital.GetName]."
nf_loi.105.a:0 "§tМені подобається ця частина роботи§!"

nf_loi.106.t:0 "Супутник"
nf_loi.106.d:0 "Північна експедиція: ВИДАЛЕНО 22ВИДАЛЕНО\nМісце: Північна Канада\nКомандир експедиції—Командир ВИДАЛЕНО\n\nДалі йде звіт Командира ВИДАЛЕНО про знахідки експедиції.\n\nПриблизно о 1100, передові розвідники повідомили по радіо, що вони знайшли великий об'єкт, що лежав у кратері. Після прибуття об'єкт був ідентифікований як супутник. Вицвілі позначки на супутнику вказували на те, що він належить ВИДАЛЕНО. О 1300, конвой розвантажився і розбив табір навколо кратера, а я і кілька супроводжуючих дослідників почали вивчати супутник. Подальший огляд показав, що це був шпигунський супутник. Дослідник ВИДАЛЕНО зміг підключити елементарне джерело живлення за допомогою одного з наших портативних генераторів, включивши його внутрішній реактор і знову запустивши супутник. Наступного дня невелика група Ферел Гулів була відбита з кратера, після чого були направлені два патрулі для розвідки навколишніх лісів та пагорбів. Дослідник ВИДАЛЕНО зміг підключити термінал до супутника і витягнути з нього інформацію. Дані показали, що супутник спостерігав за американськими діями проти сил КНФ в Канаді та передавав їх на місце, яке вказувалося як "Космодром" (Видалено, див. запис від капітана Єкатерини). Після того, як інформація була витягнута, табір був розбитий, і конвой продовжив експедицію."
nf_loi.106.a:0 "§LЗнання впавшої зірки тепер у наших руках.§!"

nf_loi.107.t:0 "Метеорологічна станція"
nf_loi.107.d:0 "Північна експедиція: ВИДАЛЕНО 22ВИДАЛЕНО\nМісце: Північна Канада\nКомандир експедиції—Командир ВИДАЛЕНО\n\nДалі йде звіт Командира ВИДАЛЕНО про знахідки експедиції.\n\nПриблизно о 0800 годині була помічена споруда на вершині пагорба з великим зламаним супутниковим dish на даху. По прибуттю на стіні будівлі було виявлено зламану табличку, що ідентифікує її як стару американську метеорологічну станцію. Табір був встановлений навколо будівлі і завершений до 1100. ВИДАЛЕНО особисто очолив команду всередині будівлі, з метою знайти деякі довоєнні припаси чи технології. Будівля мала всі вікна, розбиті всередину, наче зруйновані великою ударною силою. Були виявлені низькі рівні радіації, але вони були визнані незначними для здоров'я команди.\n\nСержант ВИДАЛЕНО був першим, хто виявив останки членів станції. Всі вони були знайдені на своїх постах, їхні тіла муміфіковані через навколишнє середовище. За загальним аналізом, можна розумно припустити, що екіпаж загинув одразу після початку Великої війни, ймовірно, саме через розбиті вікна і виявлені радіаційні впливи. Незважаючи на це, метеорологічна станція залишалася онлайн, дозволяючи зібрати понад 200 років інформації. Коли ми готувалися розбити табір і продовжити експедицію, було висунуто пропозицію поховати тіла членів станції.\n\nБуло проведене голосування, і було вирішено залишити тіла в їхньому стані. Конвой продовжив експедицію о 1700 годині.\n\n(Примітка командира—Мені не повинно бути потрібно підкреслювати, наскільки важливим може бути цей пристрій для дослідження, адже погода на півночі є нашим найбільшим ворогом.)"
nf_loi.107.a:0 "§M...Фасцинуюче§!"

nf_loi.111.t:0 "Сховище"
nf_loi.111.d:0 "Північна Експедиція—ВИДАЛЕНО 22ВИДАЛЕНО \nЛокація: Північна Канада \nКомандир експедиції—Командир ВИДАЛЕНО \n\nНижче наведено звіт командира ВИДАЛЕНО про результати експедиції. \n\nО 2300 годині впереді дозорні повідомили про велику печеру, оточену покинутим будівельним обладнанням. Місце було позначене, конвой прибув до печери о 0700 наступного дня. Після встановлення периметра навколо печери була відправлена група для дослідження інтер'єру. Зсередини почулися постріли, після чого на допомогу було відправлено додаткових солдатів. О 1200 обидві групи повернулися, понісши деякі втрати і жертви. Було підтверджено, що в печері знаходиться частково побудоване Сховище. Позначене як Сховище ВИДАЛЕНО, невелика група рейдерів використовувала це Сховище як базу і напала на першу групу, що зайшла. \n\nПісля забезпечення Сховища, воно було оглянуто на наявність корисних припасів та довоєнної інформації. Невелика кількість награбованих речей та зброї була знайдена прямо біля входу, але більшість Сховища обрушилася. В одній з кімнат було виявлено термінал, на якому значилося ВИДАЛЕНО-ВИДАЛЕНО ВИДАЛЕНО ВИДАЛЕНО. Екіпаж відпочив на ніч, готуючись до розкопок Сховища.\n\nО 0900 група розпочала розкопки підземних частин і знайшла коридор лабораторій. \n\nприблизно ВИДАЛЕНО годин потому, група успішно розкопала невелику частину лабораторій. Нам вдалося отримати кілька корисних електронних пристроїв, які були доставлені на поверхню, а також були зроблені нотатки про інфраструктуру. Ящики були завантажені в машину, і конвой вирушив назад додому. \n\n(Особисте зауваження командира—Після подальшого огляду, Сховище, схоже, належало сторонній стороні, не пов'язаній з Vault-Tec. Воно має незвичний логотип, який не був знайдений до нашої експедиції. Дивіться прикріплене зображення.)"
nf_loi.111.a:0 "§yМаленька, Жовта Соти§!"

nf_loi.112.t:0 "Об'єкт"
nf_loi.112.d:0 "Північна Експедиція—ВИДАЛЕНО 22ВИДАЛЕНО \nЛокація—Північна Канада \nКомандир експедиції—Командир ВИДАЛЕНО \n\nНижче наведено звіт командира ВИДАЛЕНО про результати експедиції. \n\nО 1200 годині була виявлена велика споруда в долині ВИДАЛЕНО. Будівля була оточена 5-метровою стіною з єдиними воротами, що вели до основного двору. Увійшовши в двір, табір був розбитий біля будівлі, яку ідентифікували як довоєнну споруду, що належала ВИДАЛЕНО. О 1400 годині будівля була захоплена загоном ВИДАЛЕНО. Всередині знаходились деактивовані монітори і термінали, під якими значилося ВИДАЛЕНО. У центрі будівлі, в контрольному приміщенні, був великий ВИДАЛЕНО ВИДАЛЕНО, з єдиним терміналом внизу. На кожній стіні кімнати було нанесено великий герб, що належить тій самій довоєнній організації. (Особисте зауваження командира—Герби, здається, були змінені після установки з новим девізом. Дивіться прикріплене зображення.) Будівля була без електрики, тому термінали спочатку не вдалося активувати. О 1700 годині прикріплений дослідник ВИДАЛЕНО зміг підключити один з наших переносних генераторів до основного терміналу, відновивши живлення до центрального ВИДАЛЕНО. \n\nПісля активації терміналу, база даних була активована, показуючи довгий список звітів і поточних операцій. Більшість звітів стосувалася ВИДАЛЕНО, наче їх спостерігали протягом тривалого часу, надаючи результати деяких експериментів. Однак інші звіти згадували ВИДАЛЕНО ВИДАЛЕНО ВИДАЛЕНО. Перш ніж ми змогли продовжити розслідування, наш доступ був заблокований, а термінал остаточно заблокувався. Всі спроби відновити доступ не увінчалися успіхом. Після огляду інших кімнат, будівля була визнана без корисних предметів чи інформації. Табір було зруйновано, і конвой вирушив далі. \n\n(Особисте зауваження командира—Я підозрюю, що наш доступ був заблокований зовнішньою силою. Це питання було піднято з капітаном Єкатериною.)"
nf_loi.112.a:0 "§F...Дивно§!"

nf_loi.113.t:0 "Припаси"
nf_loi.113.d:0 "Північна Експедиція—ВИДАЛЕНО 22ВИДАЛЕНО \nЛокація—Північна Канада \nКомандир експедиції—Командир ВИДАЛЕНО \n\nНижче наведено звіт командира ВИДАЛЕНО про результати експедиції. \n\n"
nf_loi.113.a:0 "...Невтішно"

nf_loi.114.t:0 "Село"
nf_loi.114.d:0 "Північна Експедиція—ВИДАЛЕНО 22ВИДАЛЕНО \nЛокація—Північна Канада \nКомандир експедиції—Командир ВИДАЛЕНО \n\nНижче наведено звіт командира ВИДАЛЕНО про результати експедиції. \n\nО 2200 годині наші люди натрапили на дивне явище. Глибоко в Великій Щілині ми знайшли маленьке село, яке все ще було населено людьми. Вони були досить налякані нашими танками та солдатами. Спілкування було напруженим, більшість мешканців говорила на мові, незнайомій нашим військовим. \n\nНа щастя, серед них був перекладач, який зміг нам допомогти. В обмін на деякі продукти, екипажу було дозволено провести ніч з цими людьми. \n\nЗдається, що, як би це не було дивно, життя знаходить спосіб вижити навіть у хуртовині. \n\n(Особисте зауваження командира—Після подальшого огляду, виявилось, що мова тепер вже названих "Людей Буревію" не є унікальною для них, шпигуни з Реджини принесли відомості про подібну мову, якою зараз користуються поселенці в місті.)"
nf_loi.114.a:0 "§P...Милий§!"

nf_loi.115.t:0 "Літак"
nf_loi.115.d:0 "Північна Експедиція—ВИДАЛЕНО 22ВИДАЛЕНО \nЛокація—Північна Канада \nКомандир експедиції—Командир ВИДАЛЕНО \n\nНижче наведено звіт командира ВИДАЛЕНО про результати експедиції. \n\nО 1600 годині наша експедиція знайшла розбитий радянський літак. Глибоко похований у снігу, лише невелика частина крила була видна зверху, і нашій команді знадобилося дві години, щоб його розкопати. Пілот ще знаходився в кабіні, хоча давно помер. Після огляду його форми стало зрозуміло, що це був радянський пілот до війни, що означає, що літак старий більше ніж на 200 років. Незважаючи на свій вік, було очевидно, що конструкція літака була надзвичайно добре зроблена, і його варто дослідити. Літак підготовлений для транспортування назад додому і найближчим часом має прибути. \n\n(Особисте зауваження командира—Літак "Сухой" виглядає надзвичайно схожим на інший винищувач, згаданий у журналах THE CASKET, чи може цей літак бути моделлю за його зразком?)"
nf_loi.115.a:0 "§gРозпочати діагностику негайно.§!"
nf_loi.115.b:0 "§gПокласти на зберігання. Ми займемося цим пізніше.§"

nf_loi.116.t:0 "Результати експедиції"
nf_loi.116.d:0 "Наші експедиційні операції виявилися повною марнотою."
nf_loi.116.a:0 "§gІноді я дійсно ненавиджу це місце.§!"

nf_loi.117.t:0 "Механічні Поломки"
nf_loi.117.d:0 "Оновлення щодо нашої експедиції. Очевидно, хтось не перевірив, чи не замерзло паливо та не заправив кілька танків. Вони йшли в конвої, коли половина танків вийшла з ладу, і перш ніж хтось зрозумів проблему, один з танків вибухнув. Інші були швидко вимкнені, щоб уникнути подальших вибухів, але багато солдатів загинули від вибуху. На щастя, в нас було достатньо запасних частин, щоб полагодити зламані танки, і після поховання мертвих і швидкого обслуговування, експедиція повернулася додому для поповнення запасів."
nf_loi.117.a:0 "§gНевдало.§!"

nf_loi.118.t:0 "Атака Льодових Потвор"
nf_loi.118.d:0 "Оновлення щодо нашої експедиції. Після того, як ми розбили табір поблизу узбережжя, наших людей розбудив звук криків. Вибігаючи з наметів, вони побачили групу льодових потвор, які тягли солдатів до води. Їхні жертви кричали від жаху, благаючи про допомогу, багато з них було потягнуто під лід, перш ніж їхні товариші змогли реагувати. Кілька пострілів були зроблені, і одного чоловіка вдалося врятувати, але решта вже зникли. Більше ніхто не повернувся до сну всю ніч."
nf_loi.118.a:0 "§gНемає безпеки, навіть у цих замерзлих пеклах.§!"

nf_loi.119.t:0 "Сутичка з військами Нунавут"
nf_loi.119.d:0 "Оновлення щодо нашої експедиції. Під час маршу колонною наша експедиція потрапила під атаку солдатів Нунавут, які з'явилися з снігу та пагорбів і здійснили засідку на конвой. Наші війська відповіли вогнем, і завдяки нашим танкам змогли відбити атаку. Втрати були значні, кілька танків стали непридатними, а щонайменше 50 солдатів загинули. Причина нападу невідома, хоча ми підозрюємо, що могли потрапити на їхню територію без відома. Конвой повернувся назад, забравши те, що змогли зібрати з загиблих."
nf_loi.119.a:0 "§gВійна не змінюється.§!"

nf_loi.120.t:0 "Буревій Нас Поглинає"
nf_loi.120.d:0 "Василю? Василю! Білл, де ти!? Я нічого не бачу в цьому штормі!\n\nДжорджу! Я тут! Де конвой?\n\nНе знаю! Чортів шторм раптово почався!\n\nЗалишайся близько, може ми знайдемо хоча б один з танків! Ми повинні бути в... А!\n\nБілл? Що сталося!?\n\nТак! Я спіткнувся! О, Боже! Це нога! Це Френк! Він замерз до тла!\n\nМи помремо тут! Де всі!? Білл? Білл, ти ще тут!? Я не бачу тебе! Де ти! АА! М-мій палець! Мої пальці відпали! Я-Я не відчуваю моїх ніг! Боже, допоможи мені! Хтось, допоможіть! Будь ласка!"
nf_loi.120.a:0 "§gП-пожалуйста. Я-Я не хочу померти тут. Так холодно.§!"

  ###solomon

  #clergy events

  #allquiet events
nf_loi_solomon.1.t:0 "Пробудження"
nf_loi_solomon.1.d:0 "Адреналін вирвався через Соломона, коли він безнадійно шукав вихід з палаючої церкви, в якій він опинився в полоні. Його броня зберігала свою міцність, захищаючи його від більшості вогню будівлі. Він вибіг через двері, саме в той момент, коли будівля почала руйнуватися. Він побачив Лойдмінстер в огні. Його коліна піддалися, і він впав на землю, обличчям в пісок. "Отче наш, що є на небесах..." Соломон молився, стримуючи сльози, коли він став на коліна зовні. Вибухи лунали в місті, а крики людей відлунювали всюди. Танкери почали атакувати місто та його церкви, стріляючи по священникам та цивільних. "Чому, Господи? Чому ти випробовуєш мене так? Які гріхи я скоїв, що вона зрадила мене в цей час? Чому вона хоче моєї смерті?" питав Соломон. Але він уже знав, що це все його вина. Безжалісний до криків людей, віддалений від танкерів, він був охоплений горем. Він дозволив цьому статися; вся кров, що була пролита, на його руках. \n\nЗвук швидких кроків привернув увагу Соломона, і він підняв голову, побачивши Саву Дукова, якого супроводжували троє чоловіків із зброєю на готові. "Дуков! Чому ти це зробив?" закричав Соломон. Дуков не відповів, замість цього продовжував рухатись вперед; його вираз обличчя був темний. "Я прошу пробачення, мені справді шкода, що все стало так погано. Але це не шлях, як це вирішувати, невинні люди помирають!" знову закричав Соломон. Цього разу Дуков вагався, зупинившись на місці. Його погляд опустився на землю, було видно, що він зважує свої думки. "Дуков, обіцяю, ми можемо все виправити, але це не спосіб діяти! Ми можемо працювати разом, будь ласка!" благав Соломон. \n\nТиша опустилася між ними, лунаючи вибухи. Сльози струмували по обличчю Соломона. Дуков зітхнув і подивився вгору. "Він правий. Я не можу продовжити це." Він подивився на солдатів. "І ви теж не можете." Дуков кинувся до Соломона і став на коліна. "Вибач за мої вчинки. Я просто хотів виправити ситуацію, Єкатерина сказала, що вона зможе. Прошу прощення, дозволь мені допомогти зупинити її." тихо благав Дуков. Соломон подивився на нього серйозно. "Піднімайся" оголосив він. Дуков підвівся і подивився на Соломона з великою серйозністю."
nf_loi_solomon.1.a:0 "§6"Веди шлях,"§! §gсказав Соломон серйозно§!"

nf_loi_solomon.2.t:0 "Залізні Гіганти"
nf_loi_solomon.2.d:0 "Соломон стояв біля гаража, піднявши брову, коли Сава Дуков суетився за шторою. Головний інженер поспішив привести його сюди, явно радіючи своїм досягненням. Оскільки Танкери більше не допомагали, Програма Конверсії ставала рішенням проблеми, що робити з усіма безпілотними танками. Кілька прокльонів, як російською, так і англійською, і нарешті шторка піднялася. І з'явився щось справді вражаюче. \n\nБроньований костюм, зроблений з броні, знятої з танка. Ноги створені з гусениць і коліс. Задній люк був перероблений, щоб користувач міг увійти та вийти з костюма. Шолом був виготовлений з куполи танка, а очі захищалися Т-подібним прицілом. Соломон був приголомшений. Поки Дуков обходив його, демонструючи рух і силу, старий ґул сказав, що майже кожен компонент цього транспортного засобу використовувався, окрім гармати та її механічних частин. Він ще не вирішив, як інтегрувати ці компоненти, але Соломон уже був вражений. З невеликим часом, ці "Городи" могли б оснащувати цілу дивізію."
nf_loi_solomon.2.a:0 "§6"Якщо б тільки ми могли зробити більше.."§!"

nf_loi_solomon.3.t:0 "Довгоочікуване"
nf_loi_solomon.3.d:0 "Зустріч була давно необхідною, і Соломон це знав. Старий ґул інженер, Сава Дуков, натискав на цей проект місяцями, з того часу як стало під питанням лояльність Танкерів. Тепер, коли війна закінчилася, а контроль над залишками КНФ був міцно встановлений, вони могли зосередити свою увагу на інших справах. Більш... радикальних ідеях \n\nДуков назвав це Програмою Конверсії. Вони беруть старі танки і використовують їхні частини, щоб зробити щось нове. Щось, що дасть їм перевагу у поширенні революції. Ідея була незвичайною, але зацікавила Соломона. Чим довше тривав обговорення, тим більше ідея Дукова переконувала його. Він довіряв старому ґулу і знав, що той має досвід, щоб здійснити таку ідею. Він дав йому зелене світло і чекав на результати."
nf_loi_solomon.3.a:0 "§6"Відправляємось на змагання..."§!"

nf_loi_solomon.4.t:0 "Геніальна Ідея"
nf_loi_solomon.4.d:0 "«Звісно, до того часу танки нарешті почали працювати знову. Ми змогли втекти, але ледь-ледь», — сказав Дуков, трохи п’яний. Дуков і Соломон були в майстерні, відпочиваючи після важкого дня. «Так, здається, що танки можуть бути справжньою проблемою. Разом із їхнім персоналом», — сказав Соломон гірко. «А, не переживай. Ми впоралися з тими неприємними людьми. Але це піднімає цікаву тему», — сказав Дуков. Соломон підняв брову. «Говори», — сказав Соломон. \n\n«Ну, танки зараз стали баластом. Звісно, Токарєв і я можемо використовувати їх добре. Але для двох із нас навчати цілу бригаду... Це неможливо», — сказав Дуков. «Я теж так думав. Але що нам з ними робити? Я не хочу продавати їх якимось військовим злочинцям, а не бачу жодної користі в тому, щоб їх розібрати», — розмірковував Соломон. \n\n«Ахах!» — раптом вигукнув Дуков. «Ось де ти помиляєшся, мій друже. Я нещодавно працював над чимось, і в мене є ідеї. Подивись», — сказав Дуков, витягнувши план і передавши його Соломону. На ньому були сторінки й сторінки нотаток. Проекти та креслення броньованого костюма."
nf_loi_solomon.4.a:0 "§6"Дуже цікаво"§! §gпрошепотів Соломон сам до себе.§!"

nf_loi_solomon.6.t:0 "Ваша Дружня Меркантильна Компанія"
nf_loi_solomon.6.d:0 "Холодний вітер спокійно дув через місто, ніжно обдуваючи щоку Соломона, коли він посміхався своєму доброму другу Дукову. Обидва неуважно прогулювалися по Лойдмінстеру, вели дебати щодо програми бойових костюмів. \n\n«Я не намагаюся сказати, що програма буде неефективною, ми, безумовно, бачили силу наших підрозділів з бойовими костюмами. Але ти повинен зрозуміти, як дорого це коштуватиме, витрати, яких ми просто не можемо собі дозволити в нашому нинішньому становищі», — заявив Соломон. «Переваги безсумнівно перевершать витрати! Як ми можемо рухатися вперед, якщо постійно обмежуємо себе страхами? Ми надто добре бачили, як байдужість може приректи націю на загибель, навіть якщо ми...». Обидва Дуков і Соломон замовкли, коли з одного з будівель пролунав голосний звук. Крик пролунав, змусивши їх обох поспішити до місця конфлікту. \n\nВсередині будівлі була неймовірно дивна картина. Два мутанти голосно кричали на чоловіка; їхні пістолети були націлені на нього. §c"ДЕ АЛЬБЕРТ?"§! — один з них закричав на чоловіка, який сам був занадто наляканий, щоб дати відповідь. Його мовчання тільки роздратувало мутанта, і він вдарив його по обличчю. Боючись, що ситуація швидко погіршиться, Соломон швидко втрутився, встаючи між мутантами та їхньою майбутньою жертвою. «Мої друзі! Що сталося?» — швидко запитав Соломон, з нервовою посмішкою на обличчі. §c"СЛАЙМ!"§! — загарчав мутант. «Ми відслідковуємо його два роки, він — мішень для Бетлфорда, а він стверджує, що не знає, де принц Альберт!» Соломон підняв брову. «Бетлфорд?» — запитав він. «Так, ми знали, що він йде сюди, тому ми пішли за ним. Але це місце не виглядає дуже... 'Меркантильним'», — сказав мутант, його голос наповнений подивом. Соломон і Дуков переглянулися, потім поглянули на мутантів. «Мої друзі, ви в Лойдмінстері, Бетлфорд знаходиться далеко на сході», — сказав Соломон. Мутанти подивилися на Соломона, глибоко збентежені. Вони переглянулися, не знаючи, що робити далі. Потім, з вражаючою швидкістю, один з мутантів вистрілив у чоловіка, відриваючи його голову. Його тіло впало на землю, кров вирвалася з розбитих залишків його шиї. Мутанти повільно повернулися і холодно подивилися на Соломона. «Це місце гарне», — сказав один з мутантів. «Ми залишаємося тут тепер. Дякуємо». Вони вийшли, залишивши і Соломона, і Дукова цілком здивованими."
nf_loi_solomon.6.a:0 "§6...Що?§!\n§O...Що?§!"

nf_loi_solomon.7.t:0 "Кнопка натиснута"
nf_loi_solomon.7.d:0 "«І ви впевнені, що це спрацює? Це дуже делікатна ситуація, і нам потрібно бути впевненими, що ми успішно досягнемо мети», — запитав Соломон, палець підчіплюючи під підборіддя. Рейнальд, який сидів перед Соломоном, прочистив горло і почав говорити. «Я розумію вашу вагання, але запевняю вас, швидкий удар — ось що нам потрібно. Корупція поширювалася повільно, як рак. Щоб її очистити, ми повинні спалити її як з верху, так і знизу. Арешт найбільш впливових лідерів, а також суворі покарання для всіх, хто бере участь у цих корумпованих схемах, виконують свою справу. Не буде жодної милості для них». \n\n Соломон відкинувся на спинку стільця, клацаючи язиком, замислюючись. Він подивився у вікно, спостерігаючи за містом. Так багато людей страждали через його байдужість і вагання, залишки його дій все ще оточували нації. Було лише одне правильне рішення."
nf_loi_solomon.7.a:0 "§6"Ви маєте дозвіл"§! §gсказав він.§!"

nf_loi_allquiet.1.t:0 "Єкатерина проти Лойдмінстера"
nf_loi_allquiet.1.d:0 "«Народний Суд у справі капітана Єкатерини Донської проти народу Лойдмінстера. Капітане Донська, ви звинувачуєтесь у зраді робітників, спробі вбивства Патріарха, оскверненні релігійної пам'ятки, вбивствах солдатів Міністерства та змові з метою повалення чинної влади. Як ви відповідаєте?» \n\nЄкатерина опустила голову в мовчанні. Далеко пішли ті вогонь і гнів, які спонукали її до початкових дій. Те, що залишилося, було попелищем, пригніченим і холодним. Повільно піднявшись з місця, вона подивилася на присяжних, і те, що вони побачили, було зламаною жінкою. З шумом, схожим на тихий вітер зимової ночі, вона відповіла. \n\n«Винна. Я зробила все, у чому мене звинувачують, хоча я знала, що це було правильно. Я тримала надію, що смерть Лідії не означатиме кінець наших ідеалів. Що Революція продовжиться і звільнить народ Канади. Та ось, коли я дивилася, як духовенство стає корумпованим і товстим, я знала, що щось потрібно робити. Тому так, я очолила атаку, хоча це було з важким серцем. Так, я спричинила смерть наших товаришів, хоча кожен загиблий вбивав мою душу все більше і більше. Так, я намагалася вбити Патріарха Соломона, бо вважала його причиною падіння духовенства в розкошах. І хоча я стою тут як результат своїх невдалих дій, я з радістю спробувала б це знову, якщо б це означало, що я врятую народ Лойдмінстера від корумпованої тиранії». \n\nЗамовкнувши, Єкатерина сіла на місце і чекала на свій фінальний вирок. Присяжні були розділені, і багато годин було витрачено на обговорення. Промова була зворушливою, і кілька присяжних розплакалися від жалю в її словах. Чи справді вона шкодує про свої вчинки і щиро вважає, що не було іншого виходу? Інші, однак, боялися її відкритої готовності спробувати ще раз таку небезпечну змову. Можливість громадянської війни, хоч би якими благородними були її наміри, була занадто великою для деяких. Нарешті, коли останні промені світла зникли за деревами, було прийнято рішення. \n\n«Капітане Єкатерина Донська, за вищезгадані злочини народ Міністерства визнає вас...»
nf_loi_allquiet.1.a:0 "§6"Невинною за всіма звинуваченнями. Ви, і ваші виживші послідовники, будете випущені незабаром."§!"
nf_loi_allquiet.1.b:0 "§t"Винною у всіх звинуваченнях. Я присуджую вам вигнання без права повернення."§!"

nf_loi_allquiet.2.t:0 "Єкатерина проти Лойдмінстера"
nf_loi_allquiet.2.d:0 "«Народний Суд у справі капітана Єкатерини Донської проти народу Лойдмінстера. Капітане Донська, ви звинувачуєтесь у зраді робітників, спробі вбивства Патріарха, оскверненні релігійної пам'ятки, вбивствах солдатів Міністерства та змові з метою повалення чинної влади. Як ви відповідаєте?» \n\nЄкатерина озирнулася по суду, зневага і гнів були виразно видно на її обличчі, як перший сніг зимового ранку. Вона стиснула перила, її тіло стало напруженим, і її охоронці наблизилися, щоб переконатися, що вона залишиться сидіти. З ревом, який був гучним, як канонади танків, вона відповіла. \n\n«Не винна! Це ви і духовенство винні. Корумповані, декадентські дурні, які не піклуються про народ і Революцію. Поки ви сидите в комфорті і обжерливості в своїх позолочених церквах, народ страждає і кричить про справедливість. Але в Лойдмінстері немає справедливості. Вона була задушена Патріархом і його прислужниками. Відтоді, як померла Лідія, жоден з них не мав на серці інтереси робітників. Я зробила те, що повинна була зробити, те, що кожен справжній прихильник Революції зробив би, щоб робітники були вільні від цієї тиранії. Ви проводите цей фарсовий суд, намагаючись змусити мене відчувати «каяття» за свої дії? Це те, чого ви хочете? Зганьбити мене перед народом, щоб ваша тиранія могла продовжуватися безперешкодно через крики за справедливість? Я відмовляюсь! Я не відчуваю жодного сорому за свої вчинки. Я б із радістю повторила їх, якщо це означало, що ми будемо вільні!» \n\n Вона ринула вперед, утримана лише своїми охоронцями і ланцюгами. Люди в залі були розлючені її вибухом, але їхній гнів був не менш сильним, ніж страх від її слів. Її рішучість, її палкість, її гнів. Сила цього була поза будь-яким розумінням для всіх тут присутніх. Якщо не вжити заходів, це може стати причиною ще однієї війни заради Революції. Ні, не можна дозволити цьому статися. Коли охоронці змусили її повернутися на місце, присяжні вже були готові винести свій вердикт. Винна у всіх звинуваченнях. Коли Єкатерина з люттю подивилася на суддю, молоток правосуддя був готовий здійснити останній акт покарання. \n\n«Капітане Єкатерина Донська, народ визнає вас винною у ваших злочинах. Ваше покарання буде негайним і служитиме як попередження ворогам Революції та Міністерства. Ваше покарання буде...»
nf_loi_allquiet.2.a:0 "§t"Вигнання без права повернення."§!"

nf_loi_allquiet.3.t:0 "Серце до серця"
nf_loi_allquiet.3.d:0 "Соломон спустився глибоко в підземелля Лойдмінстера, відчуваючи тривогу в шлунку. Він знав, що це давно назріло, і попри безліч виправдань, щоб уникнути цього, він зрештою знайшов відвагу спуститися та зустрітися з власними страхами. Він кивнув вартовому в'язниці, той відчинив двері і впустив Соломона. Усередині розваленої камери, позбавленої будь-якої людяності і життя, сиділа одна фігура. Єкатерина. \n\n Вона виглядала виснаженою та хворою, її обличчя було позбавлене емоцій. Однак як тільки вона побачила Соломона, його вигляд одразу змінився на лють, і вона побігла до ґрат, почавши кричати на нього. «Як ти смієш показувати своє обличчя тут! Ти огидна істота!» — закричала вона на нього. Соломон сумно подивився на неї, в животі у нього зав’язався вузол. Він відкрив рот, щоб заговорити, але нічого не вийшло. Він озирнувся, глибоко вдихнув і подивився прямо в очі Єкатерині. «Привіт, Єкатерино. Як ти?» — запитав він. Її щелепа опустилася, вона була вражена словами. «Як я? Ти серйозно? Ти кидаєш мене в цю камеру після того, як я намагалася врятувати націю, і ти питаєш, як я?» — закричала вона. «Ми вже проходили це, Єкатерино. Я розумію твої бажання, але ти діяла не так, як слід. Люди загинули через твої амбіції», — сказав він. «Я діяла, тому що твоя байдужість дозволила духовенству залишатися безкарними! Вони сиділи і обжиралися, поки народ голодував!» — рикнула вона. «Я розумію. Але ти будеш рада дізнатися, що корупцію було ліквідовано. Духовенство було обмежено», — сказав Соломон. «А що з «Списом»!? Тими, хто боровся і проливав кров за Лойдмінстер, яких кинули і проігнорували?» — запитала вона. «Ще одна помилка виправлена. Ти будеш рада дізнатися, що Дуков і Токарєв підняли танкові підрозділи на нові висоти», — сказав він. \n\n Вони продовжували дебатувати деякий час, Єкатерина поступово знаходила, що більше немає чого заперечувати. Зміни Соломона були величезні, і вона не могла більше нічого сказати. «Ти... ти змінився. І, здається, змінилася нація», — сказала вона тихо. «Я навчився на своїх помилках, Єкатерино. Тепер я пропоную тобі ту ж можливість. Допоможи нації, допоможи мені. Давай працювати разом знову», — благає Соломон, простягаючи руку. Вона вагалася, всередині неї йшла боротьба. Це забрало деякий час, і Соломон чекав стільки, скільки було потрібно. Нарешті, вона взяла її. «Добре. Давай продовжимо спадщину, яку ми колись мали», — сказала вона з рішучістю в погляді. Соломон усміхнувся."
nf_loi_allquiet.3.a:0 "§6Милосердя перемогло знову.§!"

nf_loi_solomon.30.t:0 "Стан духовенства"
nf_loi_solomon.30.d:0 "Тиша. Прекрасна, заспокійлива, умиротворена тиша. Завдяки тиші людина може думати, розплутувати клубок своїх думок і прийти до розуміння. Завдяки тиші людина може поглянути всередину себе і дізнатися все про себе. Завдяки тиші людина може звернутися до віри та Господа, щоб очистити свою душу від боротьби і потреби. Це була та тиша, яку Соломон оточував себе, і з нею приходив мир. Але це не повинно було бути так. \n\nНе зважаючи на своє усамітнення, він не був глухим до подій, що відбуваються серед духовенства. Без його керівництва вони відвернулися від благодаті Господа. Декаданс, жадібність і корупція пронизали їх. Вони більше не намагаються захищати, вести та керувати народом Міністерства. Натомість вони шукають лише спосіб збагачення та задоволення своїх бажань. Хоча деякі й залишаються вірними цінностям Господа, Соломон знав, що багато чого доведеться зробити, щоб очистити їхні ряди. Адже Господь вимагає, щоб його пастирі були чистими,"
nf_loi_solomon.30.a:0 "§gі він подбає про те, щоб вони такими стали.§!"

#industry events
nf_loi_solomon.50.t:0 "Питання моралі"
nf_loi_solomon.50.d:0 "дивись опис для loi_solomon_industry для того, що я хочу, в основному, просто 'єдиний спосіб, яким ми виживемо, це через повторну революцію, три міста Лойдмінстера, Верміліон і Уайткорт мають потенціал, їм просто потрібен поштовх', не знаю, чоловіче, я не письменник"
nf_loi_solomon.50.a:0 "зосередьтеся на Лойдмінстері, це буде коштовним каменем у нашій короні"
nf_loi_solomon.50.b:0 "зосередьтеся на інших двох містах, різноманітність - це ключ"

nf_loi_solomon.10.t:0 "МОЄ GENIUS БОЇТЬСЯ"
nf_loi_solomon.10.d:0 "«Цей сніг — це пекло», — сказала втомленим голосом Лев. «Не може бути, адже пекло гаряче», — відповів Йосип, отримавши від Лева бурчання. «Тихо», — суворо сказав третій чоловік, Токарєв. Він включив ліхтарик і повільно почав розслідувати, Йосип і Лев йшли за ним. \n\n«Дуков не пояснив, чому ми тут взагалі», — сказав Лев, трохи роздратовано. «Через хаос громадянської війни, ми так і не зрозуміли, що сталося з РЕЛКОМ. Ми тут, щоб переконатися, що він знову не стане проблемою», — поінформував Токарєв. «Це не повинно зайняти багато часу», — додав він. Лев лише буркнув у відповідь. Об'єкт був порожнім і зловісним. Єдиним звуком були їхні кроки. Вони дійшли до центрального комплексу, де знаходився головний мозок РЕЛКОМ. Троє з них повільно підходили до центрального мозку, оглядаючи кімнату на будь-які підозрілі ознаки. Кімната була заповнена різними робобранами, кожен з яких мав своє ім'я. «Він був колекціонером?» — запитав Йосип. «Мені це зовсім не подобається», — сказав Лев, постукуючи по одному з банок. Токарєв підійшов до головної консолі і почав друкувати. Він ввів команду і ввімкнув головну енергію об'єкта, наповнюючи кімнату світлом. Робобрени почали прокидатися, ворушачись у своїх скляних банках. Голос гримнув по всій кімнаті. \n\n§R"ВИ ІДІОТИ. ВИ СМІЄТЕСЬ ПОВЕРТАТИСЯ ПІСЛЯ ТОГО, ЯК ВИ ВИМКНУЛИ МОЇ МАШИНИ? ВИ ПРИЖДЕТЕ СВОЄГО ДНЯ, КОЛИ ВИ ВИМКНЕТЕ МОЇ МАШИНИ,"§! закричав РЕЛКОМ. «Ми його не знищили?» — запитав Йосип. «Здається, що ні!» — крикнув Токарєв. §R"НІ ЗБРОЇ? ЦЕ НІЧОГО. ДОЗВОЛІТЬ МЕНІ ПОКАЗАТИ ВАМ МОЇЙ GENIUS!"§! Одна з банок у об'єкті почала нагріватися неймовірно швидко, перетворюючи мозок на купу жижі. Скло вибухнуло, розкидаючи уламки на всі боки; різано глибоко в чоловіків. «Приховуйтесь!» — закричав Токарєв, коли чоловіки впали на землю. §R"ВИ ІДІОТИ. ВИ МОРОНИ. ВИ НЕ МОЖЕТЕ ПЕРЕМОГТИ РЕЛКОМ."§! кричав РЕЛКОМ, коли інші банки почали вибухати, оточуючи чоловіків у дуже вузькому просторі. «Які є ідеї?» — крикнув Лев. «Нам просто потрібно витримати, поки він не витратить усіх мозків», — сказав Токарєв. §R"Я НІКОЛИ. Я МАЮ МІЛЬЙОНИ. ДЖОН, ВАСИЛЬ, ХЕЙЛІ! НІ, НЕ МОЯ ДОРОГА ХЕЙЛІ. РЕЛКОМ. ЗАЧЕКАЙТЕ, РЕЛКОМ?"§! закричав він. Незабаром у кімнаті почулися звуки булькання води. §R"НІ, НІ, ЗАЧЕКАЙТЕ, ЗАЧЕКАЙТЕ, ЗАЧЕКАЙТЕ,"§! закричав він перед тим, як пролунала вибух. Скло розлетілося по всьому об'єкту разом із частинами мозку. Токарєв, Лев і Йосип повільно вийшли з укриття, за яким вони ховалися. Покриті кров'ю, уламками скла та мозками. Всі троє обмінялися поглядами, перш ніж Лев сказав."
nf_loi_solomon.10.a:0 "§O"...Що, чорт візьме, не так з цією штукою?"§!"

nf_loi_solomon.100.t:0 "Нові шати Патріарха"
nf_loi_solomon.100.d:0 "«Де я це залишив?» \n\nНевдоволення Соломона було таким же великим, як і його поспіх, коли він шукав свій бойовий костюм. \n\nОстанній дзвінок до параду вже пролунав, і він тільки-но знайшов свою броню. Він поспішив до площі для параду, де на нього сонце обпалювало своїм полуденним світлом, а важкі кроки розламували плитку на дорозі. Коли він уже був майже на місці, раптом зупинився. Повітря наповнилося звуком ламаючогося металу, коли його стара і зіпсована броня зрештою не витримала. Її серво-устройства були знищені, а іржавий метал ледь прикритий шаром фарби. Він був застрягнув у ній. \n\nВ той час, як він намагався звільнитися з нової металевої клітки, його увагу привернули важкі кроки. Подивившись вгору, Соломон побачив новостворений полк «Дредноутів», який проходив повз нього, оснащений новітніми костюмами та очолюваний їхнім командиром, Токарєвим. Хоча вони не зупинялися, їхній сміх та жарти обов'язково стануть темою для міських розмов на наступний місяць. Вони продовжили свій марш, хоч Токарєв і сказав Соломону про знайдений американський склад, який включав деякі костюми Бойової броні. Хоча він не хотів замінювати той елемент обладнання, що врятував йому життя стільки разів, Соломон зрозумів, що ця броня вже не підлягає ремонту. Її каркас тріщав, її броня була покрита погано зафарбованими кульовими отворами. З останнім поштовхом вона зламалася, звільняючи його від її обмежень і залишаючи тільки іржаву купу металу."
nf_loi_solomon.100.a:0 "§6"Тепер де цей склад?"§!"

nf_loi_solomon.101.t:0 "Роздуми про себе"
nf_loi_solomon.101.d:0 "Соломон зашипів від роздратування, коли знову намагався розчесати свої волосся. Незважаючи на старіння і більшість часу, проведеного в його бойовому костюмі, він все ще приділяв велику увагу своєму зовнішньому вигляду. Він був лідером нації, зрештою, йому потрібно було підтримувати свою репутацію. Але сьогодні, здається, був не його день. Незважаючи на кількість гелю та силу, з якою він чепурив волосся, воно ніяк не бажало слухатися. Він зітхнув і кинув гребінець, це не мало сенсу. У нього були й інші важливі справи. \n\nПісля швидкого сніданку він поспішно йшов через церкву на нараду, коли його погляд зупинився на чомусь. Це була викривлена картина його самого з опіками, розкиданими по всій поверхні. Він зупинився, озирнувся, щоб подивитися, чи є хтось поруч, і підійшов до неї. Хвиля ностальгії охопила його, це було зроблено під час його важких днів смутку. Суворий вираз його обличчя приховував депресію, що випивала його душу. Минуло так багато часу, так багато змінилося. Спонтанно він зняв картину зі стіни і почав йти назад. 'Зустріч може почекати п’ять хвилин', подумав він, йдучи до своїх покоїв. Там він повісив картину на стіну, оточену іншими, які він зібрав за роки. Картини Лідії, танкістів і Лойдмінстера. Він став на відстані, емоції переповнювали його. Його життя ніколи не було легким; багато важких рішень довелося прийняти. Але іноді все ставало таким зрозумілим. Він кинув останній погляд на неї, перш ніж покинути кімнату, почуваючись значно краще."
nf_loi_solomon.101.a:0 "§C"Я думаю, я зробив добре"§! §gПромовив він сам до себе.§!"

nf_loi_solomon.5.t:0 "Гримуча тиша"
nf_loi_solomon.5.d:0 "Тиша була делікатною розкішшю у Лойдмінстері. Людина не чула б ані свого дихання, ані кроків через звуки величезних танків, що рухаються містом. Завжди є нове місце для поїздки, завжди новий тренувальний режим. Це виснажувало Соломона, тому він цінував тишу, коли тільки міг її здобути. Або так було раніше. \n\nОстаннім часом тиша з'являлася частіше. Надто часто. Тиша, яку колись цінували, тепер здавалася моторошною. Протягом місяців місто поступово ставало все тихішим, потроху, шматок за шматком, поки Соломон не залишився лише з оглушливою тишею. Він часто ігнорував свої підозри, пояснюючи це тим, що він просто занадто звик до цих звуків, і міг їх заблокувати. Це не працювало. \n\nОдного дня, коли тиша стала занадто гучною, Соломон вийшов, щоб дослідити. 'Можливо, вони розробили ідеальну систему глушіння на колесах танків?' — подумав він, сподіваючись, що його підозри були марними. Він вирушив до своєї частини церкви і виявив, що ні душі в ньому не було. Там було мертво тихо, лише звуки його кроків тримали йому компанію. Тривога почала розростатися в його шлунку, і він шалено шукав по всій церкві будь-які ознаки життя. Це було, як якщо б увесь світ зник і забув про нього. Кожна кімната в церкві була порожня, всі покинули Соломона на самоті. Темні думки почали захоплювати його розум, його страх перекривав здатність до раціонального мислення. Він поспішно побіг до резерву танків на південь, сподіваючись підтвердити свою теорію. Відкривши його, він застиг, відчуваючи, як тривога заповнює його жилки."
nf_loi_solomon.5.a:0 "§tУсі танки зникли, \nоб'єкт порожній.§!"

nf_loi.1000.t:0 "Запалювання сірників"
nf_loi.1000.d:0 ""Це останні?" — холодний голос Катерини запитав, коли десять танків заїжджали на заправну станцію. Її руки були складені за спиною, і вона стояла перед ревучими машинами, поки вони паркувалися. "Негативно, чекаємо ще десяти з півночі та п'яти з півдня," — повідомив їй солдат. "Чи є якісь докази, що Соломон знає, що відбувається?" — запитала Катерина. "Негативно, командир, він не здогадується про це," — відповів солдат. "Добре. Поінформуйте новоприбулих про наші наступні плани. Розійдьтеся," — сказала Катерина. Два солдати віддали честь і повернулися. Катерина важко зітхнула і закрила очі, емоції крутяться в її голові. \n\nВона була нервова, хоч і не любила в цьому зізнаватися. Все наближалося до кінцевої мети, і, незважаючи на успіх, Катерина щоразу боролася зі своєю тривогою та невпевненістю. Її думки повернулися до Лідії, її попередниці. Що б вона подумала про все це? Чи підтримала б вона це, чи засмутилася б? Її емоції починали брати верх. Вона зміцнила себе. Це не мало значення. Її вже не було. Це було все. \n\nКатерина діяла на інстинктах, і єдине, що тримало її від того, щоб втекти — це усвідомлення, що революція вимагала, щоб вона йшла вперед. Їй потрібен був лідер, провідник, а Соломон не впорався зі своїми обов'язками, залишивши їй розбиратися з наслідками. Вона відкрила очі і відкинула свої переживання. Вона не могла дозволити собі зірватися, вона просто не могла. Більше танків заїхало в об'єкт, останні з яких були на місці. Час настав."
nf_loi.1000.a:0 "§tНе було місця для невдач.§!"

nf_loi_solomon_decisions.1.t:0 "Охоронець Скель"
nf_loi_solomon_decisions.1.d:0 "Майже одразу після того, як війська Лойдмінстера почали забезпечувати поселення біля підніжжя Скель, почали виникати проблеми. Дивні акти саботажу, підкупів та періодичні збройні засідки від таємничих нападників, одягнених в плащі, стали звичним явищем. Соломон швидко відреагував, направивши посланців, охороняючи їх важко озброєними відділеннями, щоб провести розвідку по селах, що знаходяться глибоко в гірських проходах. \n\nРезультатом стало фатальне зіткнення з рейнджером, який був у бойовому костюмі білому, як зимовий сніг, що майже призвело до справжнього перестрілки. На щастя, більш холоднокровні голови взяли верх, і обидві сторони з'ясували свої дружні наміри перед тим, як пролилася кров. За її словами, все, чого прагнула головна наглядачка Сільвія, — це безпечне життя для гірських жителів. \n\nСоломон був більше ніж радий співпрацювати з нею в цьому напрямку. Скоро він зробить плани на те, щоб особисто відвідати Вейлмаунт. Тут він сподівався, що з'явиться сталий план для миру."
nf_loi_solomon_decisions.1.a:0 "§6"Наші інтереси співпадають"§!"

nf_loi_solomon_decisions.2.t:0 "Чоловік з великим серцем і великими очікуваннями"
nf_loi_solomon_decisions.2.d:0 "Головна наглядачка Сільвія забронювала решту дня, щоб прийняти Соломона Бушара, лідера релігійних добродіїв з Лойдмінстера. Спочатку вона була обережною щодо контакту з ким-небудь у Білому Снігу, але наміри цього чоловіка виглядали чистими, принаймні, за листуванням, яке вони вели. Зрештою, вона піддалася. \n\nКоли Соломон прибув, вони говорили годинами, про все, від історії їхнього народу до можливих сфер співпраці між жителями Проходів та Лойдмінстером. З часом, коли тіні стали довшими, взаємна повага між двома лідерами почала розцвітати. Сільвія почала поважати переконання чоловіка, а старий дедалі більше вражався від безкорисливої відданості головної наглядачки. \n\nАле все ж сумніви Сільвії не зникали. У Лойдмінстері можна було знайти потужного захисника. Але якщо б ситуація змінилася, чи була б вона готова поставити життя своїх людей на карту заради племені, про яке вона ще так мало знала? Без довіри, що може дати навіть міцне потискання рук? \n\nДо кінця зустрічі рішення Сільвії було прийнято. Вона сказала Соломону без будь-яких двозначностей—"
nf_loi_solomon_decisions.2.a:0 "§d"Наші народи будуть стояти разом."§!"
nf_loi_solomon_decisions.2.b:0 "§d"Я не можу ризикувати. Але бажаю вам удачі."§!"

nf_loi_solomon_decisions.15.t:0 "З темряви, леденячий погляд"
nf_loi_solomon_decisions.15.d:0 "Майже одразу після того, як війська Лойдмінстера почали забезпечувати поселення біля підніжжя Скель, почали виникати проблеми. Дивні акти саботажу, підкупів та періодичні збройні засідки від таємничих нападників, одягнених в плащі, стали звичним явищем. Соломон швидко відреагував, направивши посланців, охороняючи їх важко озброєними відділеннями, щоб провести розвідку по селах, що знаходяться глибоко в гірських проходах. \n\nНіхто не повернувся — крім одного, який, майже помираючи, ввалився в табір на південь від Мускега, покритий кров'ю і втомлений. Коли він отямився, він розповів про патрулі, яких вирізали люті привиди, ледве видимі через бурю завдяки холодному світлу, що виходило від їхніх шоломів. Він був одним з щасливчиків, якого взяли в полон і відпустили на підставі гори, щоб передати просте повідомлення назад своїм людям — не заходьте на нашу територію. \n\nСоломон не потребував двох попереджень. Напад на Скелі був би рівний тому, щоб надіслати людей в м'ясорубку. Якщо ці м'ясники залишаються тільки в проходах і на заході від гір... з цим він міг змиритися."
nf_loi_solomon_decisions.15.a:0 "§6"Я особисто повідомлю родинам..."§!"

nf_loi_solomon_decisions.3.t:0 "Пропозиція до припинення вогню"
nf_loi_solomon_decisions.3.d:0 ""І тому я сподіваюся, що ми зможемо організувати щось у майбутньому. Якщо вас зацікавить, приїжджайте до нас до Лойдмінстера, і ми почнемо переговори." \n\n"З найкращими побажаннями, Соломон Бушар." \n\nСоломон поклав ручку на стіл, задоволений листом, який він написав. Під час своїх зустрічей щодо Альберти, Сейфхейвен був відкинутий помічниками Соломона, які казали: "Нам не потрібно турбуватися про це місце." Соломон вважав це неприємним і тому написав листа до Сейфхейвену, просячи їх прийти і обговорити можливість співпраці між націями. Він молився, щоб вони отримали листа позитивно. Якщо ж вони відмовлять, війна майже напевно розпочнеться, і це його зовсім не радувало. Соломон скривився, подумавши про це. "Терпіння, Соломон. Дай подіям розгорнутися." — промовив він до себе."
nf_loi_solomon_decisions.3.a:0 "§6"Сподіваюсь, все буде добре..."§!"

nf_loi_solomon_decisions.4.t:0 "З горбом, як у Снігової Гори"
nf_loi_solomon_decisions.4.d:0 "Те, що мер Шоутайм вважала спокійним тижнем, швидко перевернулося після того, як вона отримала та прочитала листа, надісланого Соломоном Бушаром. Кілька днів по тому вона опинилася в Лойдмінстері, чекаючи на зустріч з Соломоном. Поряд з нею була Мері, яка виглядала дуже стурбованою, навіть з каскою на голові. «Справді, я думаю, вам варто переглянути це рішення. Ми нічого не знаємо про цих людей, і будь-хто, хто має зв'язки з КФН, повинен вважатися загрозою для нас», - благала Мері. «Тихо, Мері, давай хоча б послухаємо, що скаже цей чоловік. Все, що я бачу досі, виглядає дуже добре», - сказала Шоутайм, відмахуючись від Мері, на що та лише насупила брови. \n\nЧерез півгодини вони вже були в офісі Соломона. «Я дуже радий, що ви змогли знайти час для цього. Обіцяю, що це буде початком плідних відносин», - сказав Соломон, усміхаючись до них. «Точно так само, пане Бушар. Але перш за все, потрібно вирішити кілька питань. Давайте переходити до справи», - сказала Шоутайм."
nf_loi_solomon_decisions.4.a:0 "§OОптимізм Шоутайм створив новий альянс§!"
nf_loi_solomon_decisions.4.b:0 "§OMері прагматизм убив їхні шанси§!"

nf_loi_solomon_decisions.5.t:0 "Щось Лихе Попереду"
nf_loi_solomon_decisions.5.d:0 "Минуло два тижні з того моменту, як Соломон надіслав свій лист, і він почав боятися найгіршого. Хоча радіомовчання не означало прямої відмови від переговорів з Safehaven, це точно не давало йому підстав вірити в протилежне. Видихнувши, він витягнув ручку і почав складати новий лист. Не довго працюючи, він здригнувся, коли відчув холодний метал, що тиснув на потилицю. \n\n«Ти будеш слухати дуже уважно. Спробуєш що-небудь, і твій мозок прикрасить стіну», - почувся голос. «Говори», - відповів Соломон суворо. «Я отримав твій лист, і ось моя відповідь. Ні. Ти нічого не отримаєш від Safehaven», - сказав незнайомець. «Це дуже шкода», - сказав Соломон. «Мене це не хвилює. Тепер, я міг би тебе легко вбити. Але я цього не зроблю. Я просто попереджаю. Тримайся подалі від Safehaven, не намагайся атакувати нас. Бо ми тебе знищимо. Зрозумів?» - сказав незнайомець. Соломон лише пробурмотів у відповідь. «Добре», - сказав він, забираючи пістолет від голови Соломона. Потім він вистрибнув у вікно і зник у темряві."
nf_loi_solomon_decisions.5.a:0 "§6«Це буде проблема, чи не так?»§!"

nf_loi_solomon_decisions.7.t:0 "Благородна Мета Габби"
nf_loi_solomon_decisions.7.d:0 "Соломон перетнув хребет, що відкривав вигляд на Форт-Пек, разом з невеликою групою дипломатів і вибраних солдатів. Кожен з них був одягнений у найкраще бойове обладнання, яке Міністерство могло собі дозволити. Їм це точно знадобиться, враховуючи рівень радіації, який вони зафіксували. \n\nЯк тільки вони наблизилися до поселення, вони побачили на горизонті страшного вигляду гулю, що бігла до них. Чоловіки вийняли свої рушниці, готові стріляти в того, кого вони вважали диким. Але Соломон зупинив їх. Він пішов вперед, і коли далекий голос істоти став ближчим, почулися її благання: «Гладкошкірі! Гладкошкірі! Зупиніться!» \n\n«Ти, мабуть, і є той, кого називають «Габба», так?» — спитав Соломон, коли гулю зупинилася, щоб перевести подих. «Це я, так. Дивись, ви і ваші гладкошкірі краще йдіть геть. Це місце настільки радіоактивне, що його можна порівняти з пеклом. І деякі з моїх друзів не дуже люблять таких, як ви», - відповів Габба. Соломон постукав по своєму броньовому покриттю. «Ми вже подумали про це. Ми прийшли поговорити», - сказав Соломон. Габба підняв зруйновану брову. Соломон почав розповідати Габбі про історію Лойдмінстера, про важливу роль, яку зіграли гулю-порадиники танкових військ у формуванні його спільноти, і про його місію. «Більшість з них вже… пішли. Не тілом. Але духом. Не так вже й відрізняється від багатьох твоїх побратимів», - сказав він, поклавши свою броньовану руку на плече Габби. «Ми розуміємо твою біду. Дозволь нам допомогти. У нас є технології — як свідчить Господь». \n\nГабба похитав головою, а потім почав сміятися кілька хвилин. «Гей, чому б і ні. Ви не вбили мене відразу, це вже ставить вас на порядок вище за деяких інших гладкошкірих в цих місцях. Дуже добре. Будь-яка допомога буде корисною... давайте я вам покажу, що тут є.»"
nf_loi_solomon_decisions.7.a:0 "§6«Ще одна втраченя овечка повертається в обійми Господа»§!"

nf_loi_solomon_decisions.9.t:0 "Боротьба з Партизанами"
nf_loi_solomon_decisions.9.d:0 "Соломон масажував скроні, глянувши на післядії з бойових звітів з Альбертських пусток. Загін за загоном, що вийшли в білі снігові бурі, щоб ліквідувати партизанів, не повертаються. \n\nЧорт забирай, чому він взагалі вирішив, що буде легко ліквідувати кабалу старовинних любителів зброї? \n\nРозчарований, він перевернув свій стіл, очистивши його від купи документів. Він забрав три папки, доставлені безпосередньо Міністерством зовнішніх зв'язків. У кожній була пропонована план дій для остаточного підкорення окупованої зони. \n\nПерша пропозиція полягала у створенні провінційної адміністрації з альбертанських дезертирів. Більш радикальні фанатики ніколи не підуть на це, але повсякденні жителі можуть бути заспокоєні, побачивши знайомі обличчя на керівних посадах. \n\nДруга пропозиція передбачала прямий контроль над територією. Агресивний, неприємний і, ймовірно, з більшою кровопролиттям — але бюрократична документація значно спроститься. В той момент Соломон більше не бажав нічого... \n\nОстаточна рекомендація пропонувала відступити з більш віддалених регіонів, що все ще тримаються. Без сумніву, деякі з навколишніх фракцій заповнять вакуум влади. Срібна облямівка? Безконечні перетягування каната, що доставляли Соломону стільки клопоту на останньому тижні, стануть чужою проблемою. \n\nПісля роздумів, Соломон вирішив, що є тільки один розумний шлях."
nf_loi_solomon_decisions.9.a:0 "§gПряме управління з Лойдмінстера.§!"
nf_loi_solomon_decisions.9.b:0 "§gОформити окуповану зону.§!"
nf_loi_solomon_decisions.9.c:0 "§gВідступити з периферії і зміцнити наші позиції.§!"

nf_loi_solomon_decisions.10.t:0 "Біла Голубка в Білій Безодні"
nf_loi_solomon_decisions.10.d:0 "Соломон міркував над ручкою та папером протягом десятків хвилин, ходячи туди-сюди в своїй кімнаті, розмірковуючи, як найкраще простягнути оливкову гілку. Ідентичність Королівства Манітоба була невід'ємно пов'язана з лютою ненавистю до комуністичних симпатиків у Канаді. Відносини між королівством та рештками КФН були, у найкращі часи, ледь терпимими. Війна з Королівством в цей час була б катастрофічною не тільки для його народу, але й для всіх жителів Півночі. \n\nЦе був справжній тест його лідерства. Відклонивши свою гордість, він сів за свій стіл, складаючи найбільш щирий заклик до миру, на який міг розраховувати. Кожне слово було як на канаті, адже з одного боку було патронування, а з іншого — сприйняття слабкості. \n\nКоли день наближався до кінця, він відсахнувся від свого стільця та покликав помічника. Лист мав бути доставлений безпосередньо до королівської столиці. Соломон хотів би написати більш особисто, але згідно з його розвідниками, над королівським двором висіли сумніви та невизначеність. На його столі валялися суперечливі розвідувальні звіти про наслідки хаосу, що нещодавно охопив регіон. Все, що Соломон міг зробити — це сподіватися, що на іншому кінці виявиться розсудливий та раціональний регент."
nf_loi_solomon_decisions.10.a:0 "§6«Тепер це в руках Бога»§!"

nf_loi_solomon_decisions.11.t:0 "Несподіваний Заклик"
nf_loi_solomon_decisions.11.d:0 "В ранні години ранку, задиханий помічник влетів до тронної зали, махаючи запечатаним конвертом. В ньому був дивовижно відвертий заклик до миру від Соломона Бушара, голови розколотої групи колишнього Канадського Народного Фронту. \n\nЛист розповідав про історичні корені, що єднають народи Канади, про Божу любов до своїх дітей, про безглузду ненависть та насильство, що охопили Північ. Також були згадані більш прагматичні моменти щодо ймовірної паритетної сили між нашими націями. \n\nЦілком ясно, що треба робити—"
nf_loi_solomon_decisions.11.a:0 "§6«Згодитися рухатись вперед разом.»§!"
nf_loi_solomon_decisions.11.b:0 "§t«Дати зрозуміти, що їхні червоні прапори згорять!»§!"
nf_loi_solomon_decisions.11.c:0 "§g«Покласти це на мій стіл, я займусь пізніше…»§!"

nf_loi_solomon_decisions.12.t:0 "Нова Угода для Півночі"
nf_loi_solomon_decisions.12.d:0 "Соломон зітхнув з полегшенням, відчуваючи, як вага світу знімається з його плечей. Відповідь, яку він отримав від Королівства Манітоба, була блискучою, лист був сповнений вдячності та поваги до його готовності зробити перший крок до миру. Вона також окреслювала чіткий графік для майбутніх дипломатичних заходів між офіційними особами двох націй. \n\nСоломон поглянув у вікно на заходяче сонце на горизонті. З правильними людьми на чолі, може бути... тільки може... краще майбутнє можливе."
nf_loi_solomon_decisions.12.a:0 "§6Він не витратив часу на написання відповіді§!"

nf_loi_solomon_decisions.13.t:0 "Господь нас покинув..."
nf_loi_solomon_decisions.13.d:0 "Соломон був розчарований. Те, що він вважав цілком розумною пропозицією закопати сокиру війни, перетворилося на дипломатичну катастрофу. Відповідь, яку він отримав, була наповнена нескінченними образами та нечіткими погрозами, його заклик до спільних коренів був перевернутий, щоб підкріпити неминучість війни між двома націями. \n\nТемні хмари кружляли в небі. Шукаючи миру, він ненавмисно привернув увагу манітобських військових до Лойдмінстера."
nf_loi_solomon_decisions.13.a:0 "§tСоломон не спав цієї ночі.§!"

nf_loi_solomon_decisions.14.t:0 "В вогнях Невизначеності"
nf_loi_solomon_decisions.14.d:0 "Соломон чекав і чекав. Дні перетворювались на тижні. Тижні — на місяці. Нічого. Королівство Манітоба так і не відповіло на його заклик до миру. Що ж могло статися? Можливо, вони не вважали його гідним їхнього часу. А може, все ж таки, кур'єр був перехоплений? Без подальших дій щодо його початкового листа, ніяк не можна було дізнатися. І Соломон не міг дозволити собі витрачати більше часу та ресурсів на цю справу — не в цей ключовий момент. \n\nЯкщо Королівство справді прагнуло миру, він був певен, що вони йому повідомлять. Або хоча б, це була надія."
nf_loi_solomon_decisions.14.a:0 "§g«Де я помилився...?»§!"

nf_loi.1001.t:0 "Тост за втрачених"
nf_loi.1001.d:0 "Незважаючи на те, що війна закінчилася давно, наслідки чотиристоронньої війни досі відчувалися по всьому Альберті. Міста зруйновані, родини розбиті, а солдати поховані. І все ж, почуття перемоги приносило людям Альберти багато радості. Ніде це не було б більш очевидним, ніж у столиці міста Редмонд. \n\nБої тут були люто запеклими, з тропами Страткомуні, що борються до останнього, щоб захистити свою землю. Зрештою, вони зламалися, але не до того, як місто було розірване на шматки. Це зайняло численні тижні, виснаживши багато їхніх ресурсів, але реконструкцію Редмонду завершили. Щоб відсвяткувати цю велику перемогу, Катерина підготувала виступ перед своїм народом. \n\nВона стояла перед величезною кількістю людей, трохи приголомшена. Незважаючи на те, як часто вона виголошувала промови, кількість людей, які підтримували її бачення революції, завжди наповнювала її серце гордістю. Гордістю і страхом. Цього разу... \n\nБільше страху, ніж зазвичай. \n\nТиша запанувала, коли вона торкнулася мікрофона. Вона подивилася на підготовлені нотатки, готуючись морально. Вона відкрила рот. Нічого не вийшло. Її життя промайнуло перед очима, тисячі спогадів швидко пролетіли через її свідомість. Вона закрила очі, повільно видихнула. «До чорта ці нотатки» — пробурмотіла вона. Ця промова повинна була йти від серця. У цей ключовий момент, коли понад тисячу людей слухали, її думки звернулися до..."
nf_loi.1001.a:0 "§t...Лідії§!"
nf_loi.1001.b:0 "§6...Соломона§!"

##UNIFIER
nf_loi_unifier.1.t:0 "Ми не зламаємося"
nf_loi_unifier.1.d:0 "«Дозвольте розповісти вам одну історію. Історію некомпетентності, страху. Історію чистої дурості! Я говорю про КФН і те, яким провалом воно стало! Розпад був неминучим, адже вони не знали, як насправді користуватися своєю силою. Через власні помилки вони втратили все, що досягли», — вигукнула Катерина, її голос розірвав тишу, і вся аудиторія була вражена її раптовим гнівом.\n\n«Коли ми залишили КФН, вони назвали нас зрадниками. Вони сказали, що ми скоїли зраду. Як же вони помилялися! Хіба так погано залишити поламаний транспортний засіб на дорозі, втекти від чогось, що шкодить більше, ніж приносить користі? І коли ми знайшли вмираюче місто Лойдмінстер і нас привітали з розпростертими обіймами, захищаючи нас, чи могли ми бути звинуваченими в тому, що є злочинцями? Ні! Ми — герої цієї історії. Разом ми принесли мир і безпеку Альберті», — заявила Катерина.\n\n«Як переможці в цьому конфлікті, ми повинні зібрати уламки та забезпечити, щоб це ніколи не сталося знову. Є чудовиська навколо нас і всередині нас, які прагнуть знищити все, за що ми боролися. Ми повинні забезпечити їхнє повне знищення, адже ми не можемо бути в безпеці, поки не зробимо цього. Кожного злочинця, кожного тирана, кожного монстра буде знищено нами, незалежно від наслідків. Менше цього — це наша поразка», — закінчила Катерина, злегка затихаючи від зусиль. Відповідь була змішаною: деякі аплодували, але більшість відреагувала... "
nf_loi_unifier.1.a:0 "§g...§tНевизначеною тишею§!"

nf_loi_unifier.2.t:0 "Відновлення справедливості"
nf_loi_unifier.2.d:0 "«Товариші, година настала!» — виголосила Катерина, ходячи туди-сюди по залі. — «Занадто довго ніжний канадський робітник був пригнічений під чоботом жорстоких мародерів. Вони їдять до насичення, поки працівник працює під їхніми каблуками. Щодня вашим співвітчизникам доводиться вибирати між тим, щоб обігріти свої домівки або поставити їжу на стіл. Думаю, ви точно знаєте, хто винен у цьому.»\n\nВона підняла руку, вказуючи серйозно на задню частину кімнати: «На південь від нас, розкішні манітобські дворяни, які сховалися в Беттлфорді, скинули всі маски. Вони зрозуміли, що коли все сказано і зроблено, коли весь блиск і гламур зникнуть, вони нічим не відрізняються від решти тієї гидоти, що полює на вразливих. Думаю, настав час дати їм спробувати їхнє власне ліки.»\n\nВона обернулася, махнувши рукою в протилежний бік: «А на південь від нас бандити, що витягують останки з розбещених комерційних центрів старого світу. Завжди схематичні, завжди шукають наступну дрібничку, якою можна бити невинних. Я кажу — досить.»\n\nВона повернулася до натовпу, піднявши руки в повітря. «ЧИ БУДЕТЕ ВИ СТОЯТИ ПРОТИ НИХ? ЧИ БУДЕТЕ ВИ ТАМ, КОЛИ НАРОД ПОТРЕБУЄ?»"
nf_loi_unifier.2.a:0 "§t«Готувати двигуни. Ми рушаємо.»§!"

nf_loi_unifier.3.t:0 "Виведення різників"
nf_loi_unifier.3.d:0 "«Вони називають себе 'Охоронцями Білого', товариші,» — сказала Катерина, ретельно оглядаючи залу в пошуках будь-якої проблисків в очах її людей, що могли б видавати належність до них. «Нібито захисники тих, хто не може захистити себе тут, на Півночі. Або принаймні, так вони говорять.»\n\n«Але я знаю, хто вони насправді. Різники. Тирани. Вони переходять від поселення до поселення, дурячи тих, хто не знає краще, тонким покриттям компетентності. Але це всього лише покриття. Коли вони закріплюються, їх не можна вигнати, поки все навколо них не згниє.»\n\nВона поклала руку на пістолет. «Не без належної кількості вогневої потужності.» Легкий сміх розповзся по кімнаті. «Сьогодні ми їдемо на Захід. Завтра ми відкидаємо їх через Скелясті гори. І на наступний ранок — Канада буде вільна від цих паразитів.»"
nf_loi_unifier.3.a:0 "§t«Їхні гвинтівки нам все одно більше підходять.»§!"

nf_loi_unifier.4.t:0 "Остаточний вибір"
nf_loi_unifier.4.d:0 "Місканти були справжньою і остаточною руйнацією від Катерини та її танків. Руйнуючи їхні укріплення та бастіони, знищуючи будь-яку опір, який зустрічали. Вони були розкидані по вітру: деякі втікали за своїм життям, інші здавались. Ченця Чорного виволікла з хаосу, відчайдушно шукаючи будь-які способи втечі. Він опинився на складі компанії, благаючи Пенні.\n\n«Ти тупий, блядський ШІ! Допоможи мені! Ти маєш щось, якийсь секретний тунель або потаємний вихід. Що завгодно! Вони йдуть!» — закричав Чорний. Пенні відреагувала шоком, який вона намагалася погано приховати.\n\n«Тунель? Про що ти говориш? Немає ніякого тунелю в цьому районі, я нічого не бачу. Можливо, ти неправильно зрозумів.» — нервово відповіла Пенні.\n\n«Суча ти істота, я знаю, що ти брешеш!» — закричав Чорний, його голос тремтів. «Я чую голоси в цьому складі!» — вигукнув він, що змусило Чорного мало не злякатися до смерті.\n\n«Ти маєш щось для мене?» — закричав Чорний до Пенні, яка виглядала дуже нервово, її аватар нервово перебирала руки. «Я б хотіла допомогти, але, як я сказала, тут немає супер-секретного потаємного тунелю,» — сказала Пенні, нервово дивлячись на нього. Звук танкових гусениць наближався, і вони повільно підходили до місця, де був Чорний. Петля стискалася навколо його шиї. Він стиснув зуби: залишався лише один варіант. «Зачекай. Візьми ці чортові квитки, дай мені трубний пістолет.» — сказав Чорний похмуро. Вираз подиву з'явився на обличчі Пенні, коли вона передала йому пістолет. «Що ж ти збираєшся зробити з одним пістолетом?» — запитала вона з цікавістю.\n\n«Йди до біса» — відповів Чорний, плюючи на екран і вистрілюючи в нього, залишаючи себе самотнім з наближаючою смертю. Він замахнувся пістолетом, притискаючи його до скроні."
nf_loi_unifier.4.a:0 "§t«Яка хвороба це.»§! §gпробурмотів він, перш ніж вистрелити.§!"

nf_loi_unifier.5.t:0 "Страждати від Великої Вулиці"
nf_loi_unifier.5.d:0 "«Х-Хей, не треба так!» — захлипав голос Пенні, коли Катерина та її люди проривалися крізь кімнату, де зберігалися сервери маленького підприємливого ШІ. Капітан оглянув навколишнє середовище, свідомо ігноруючи прохання, що відлунювали з заднього кінця зали. «Послухай, друже, ти пропускаєш шалено круті пропозиції! У нас є остання партія фігурок Vault-Tec(TM)... або, може, тобі пощастить з лотереєю? Ти можеш засмагати на пляжах Маямі вже завтра — якщо ти лише ДАСТЬ МЕНІ...»\n\n«Капітан...» — Катерина повернулася до одного з її людей, який показував на вихід. «Ми отримали те, що нам було потрібно. Готові вирушати за твоїм наказом.» Катерина кивнула, перш ніж повільно підійти до термінала під екраном, на якому світився незмінно усміхнений обличчя Пенні. «Б-будь ласка — у нас так багато всього. М-м-и можемо зробити тебе щасливою.»\n\nНе піднімаючи погляду, Катерина вийняла бойовий ніж і прошила ним тонкий металевий лист, що закривав дроти консолі. Спотворений, цифровий крик заповнив кімнату на кілька секунд, перш ніж затихнути в тиші. Капітан знову заховала зброю і вийшла з серверної кімнати."
nf_loi_unifier.5.a:0 "§t«Вона мене вже дістала.»§!"

nf_loi_unifier.6.t:0 "Який хлопець"
nf_loi_unifier.6.d:0 "Гуркіт бойових танків проривався через снігові рівнини, коли вони повільно наближалися до міста Беттлфорд. Принц Альберт і його сили були повністю розгромлені танкістами. Все, що їм залишалося — це завершити справу, відрубати голову змії. Принц Альберт, що стояв прямо біля міста з білим прапором, з посмішкою на обличчі. «Що за хрінь?» — пробурмотів танкіст, що готував гармату в танку Катерини, перш ніж передати свої висновки Катерині. П’ять хвилин по тому, Принц Альберт та Катерина вели переговори, з двома охоронцями, що стояли позаду неї. «Привіт, моя дорога — так приємно, що нарешті зустріти тебе», — сказав Принц Альберт, намагаючись бути розслабленим.\n\nКатерина підняла брову, явно не вражена його виступом. Вона зробила крок вперед, нависаючи над ним. «Ви прийшли обговорити умови капітуляції?» — спитала вона суворо. Принц Альберт трохи відсахнувся, почувши її голос. Він тихо кашлянув і проковтнув, перед тим як знову спробувати створити впевнений образ. «Так, люба, думаю, ми маємо дещо обговорити. Можу сказати, що у тебе чудові очі?» — сказав він, намагаючись пристально дивитися на Катерину. Вона наблизилася до нього, їхні обличчя були лише в декількох сантиметрах одне від одного. «Говори!» — вона виплюнула це.\n\nПринц Альберт зламався і відвернув погляд, подивившись вниз. Він почав йти до танків. «Ну, це досить просто. Останні мої хлопці залишаються в місті. Ми готові віддати всі території Беттлфорда за двох умов. Перша, місто має залишатися ціленьким.» — сказав Принц Альберт сміливо. Катерина кілька секунд дивилася на нього, оцінюючи угоду. Вона замовкла на деякий час, перш ніж запитати: «А друга?» Альберт посміхнувся і торкнувся одного з танків, що стояв поруч з ним. «Ти навчиш мене та моїх друзів, як користуватися цими хлопцями?» — сказав він, розпливаючись в усмішці."
nf_loi_unifier.6.a:0 "§6§g...§6Може, я все ж прийду до тебе."§!"
nf_loi_unifier.6.b:0 "§t§g...§tЯ не думаю, що ти розумієш, як це працює.»§!"

nf_loi_unifier.7.t:0 "Західні авангарди"
nf_loi_unifier.7.d:0 "Катерина ходила взад-вперед по двору на складі Вейлмаунт, уважно оглядаючи військовополонених Охоронців, що стояли по стіну ззаду. Хто не був добре складений, виглядав стоїчно. Хто не виглядав стоїчно, виглядав змученим. А хто не виглядав змученим, той був добре складений. Вона прийняла рішення.\n\n«Радійте, Охоронці Перевалу. Та лють і відвага, яку ви продемонстрували на полі бою, не залишилися непоміченими. І так само не залишилася непоміченою ваша відданість добробуту гірських жителів. Від гордих шахтарів Вейлмаунта до рибалок Боннерс-Феррі. Очевидно, що ці люди захоплюються вами.»\n\n«Кожен із вас буде дозволено продовжити підтримку цієї шляхетної спадщини. Це буде ваш святий обов’язок — захищати канадських робітників Скелястих гір від бандитів та контрреволюціонерів, що знаходяться уздовж узбережжя. І ви будете робити це з підтримкою найбільшої індустріальної сили, яку Північ коли-небудь бачила. Будьте готові віддати свої серця, бо ваші славні дні ще попереду!»"
nf_loi_unifier.7.a:0 "§t«З часом, вони навіть можуть почати вірити в це.»§!"

nf_loi_unifier.8.t:0 "Спина верблюда"
nf_loi_unifier.8.d:0 "Коли Охоронці програли Вашингтонському Братству і були розкидані по вітру, Мері пообіцяла собі одне: більше не програє.\n\nНіколи більше не буде програвати будь-якому ворогу. Вони стали надмірно впевненими, зарозумілими. Наситились від здобичі від того, що були на чолі, що коли їх погрожували, вони програли бій. Для більшості Охоронців це зламало їх. Їхній моральний дух був зруйнований, вони просто блукали по життю, намагаючись просто пройти день за днем, більше не мріючи про великі справи. Мері трималася, бо якщо Охоронці зламаються, вона буде нічим. Це обіцянка, єдина річ, яка тримала вогонь у серці Мері, була знищена. Вона справді стала розбитою.\n\nЇй довелося спостерігати, як Безпечний притулок, місто, яке прийняло її під час її найгіршого часу, яке вона по-справжньому почала любити, було захоплене ворогом. Тепер це вже не було власною незалежною нацією, спільнотою, що глибоко піклується про кожну людину. Воно ставало тишею, холодніше."
nf_loi_unifier.8.a:0 "§tВоно ставало порожнім. Як і Мері."§!

nf_loi_unifier.9.t:0 "Пропозиція Безпечного притулку"
nf_loi_unifier.9.d:0 "Не було жодного почуття, схожого на це смачне відчуття перемоги. Знати, що твої війська, твої тактики і твоя здатність командувати були кращими за ворогів. І все ж, це завжди двосічний меч: після перемоги йде переговори. Катерина ненавиділа переговори. Перед нею сиділи дві найважливіші фігури Безпечного притулку: мер Шоутайм і Мері Мулліґан. Шоутайм сиділа за столом, а Мері стояла, схрестивши руки за спиною, з ненависним поглядом на Катерину.\n\n«Поясніть мені ваші умови переговорів, і робіть це швидко. Я починаю втомлюватися від цих ігор», — сказала Катерина суворо. Мері обурено рикнула і зробила крок вперед, її зупинила Шоутайм, яка протягнула руку і кивнула на Мері з ніжним виразом обличчя. «Все дуже просто. Ми, народ Безпечного притулку, припиняємо всі зусилля опору проти вас і служимо державі, якщо ви залишите сховище і місто неушкодженими. Ми не проти працювати разом — вам лише потрібно залишити нас у спокої», — заявила Шоутайм. Катерина дозволила словам повиснути на кілька секунд, прокручуючи ідеї в голові. Охоронці, безсумнівно, були здатні і їхні бойові навички могли бути дуже корисними в майбутніх битвах. Але плани для Безпечного притулку вже були складені; будівництво величезного сховища для танків і заправної станції в сховищі. М'яч був на полі Катерини, їй просто потрібно було вирішити, куди його вдарити.\n\nНаслідки не важливі."
nf_loi_unifier.9.a:0 "§t«Я втомилася від цього, просто знищіть сховище.»§!"
nf_loi_unifier.9.b:0 "§t«Нехай люди будуть, ми завжди знайдемо інше сховище.»§!"

nf_loi_unifier.10.t:0 "Додати «Безпеку» до Безпечного притулку"
nf_loi_unifier.10.d:0 "Дощ тихо барабанив по вікну офісу мера Шоутайм, додаючи заспокійливий звук до кімнати, поки Шоутайм працювала за своїм столом. Пройшло деякий час з того моменту, як комуністи захопили Безпечний притулок, і стосунки поступово покращувалися, оскільки люди ставали комфортнішими з ними. Однак для деяких було важко звикнути до змін. Легкий стук у двері порушив роздуми Шоутайм, вона прошепотіла «входьте» і чекала, хто увійде. В кімнату ввійшла Мері Мулліґан, крокуючи повільно. Говорячи про людей, які не можуть звикнути до комуністів, Мері була чудовим прикладом. Відтоді, як Охоронці зазнали поразки, вона втратила свою рішучість, її вогонь згас, замінивши її депресією, що поступово з’їдала її. «Це займе певний час», — подумала Шоутайм, і вона зробить все, щоб повернути Мері до її звичного стану.\n\n«Доброго ранку, Мері. Як ти сьогодні?» — запитала Шоутайм весело, отримавши лише коротке «Нормально» від Мері. Шоутайм зітхнула сумно. «Мері, ти зараз зайнята?» — запитала Шоутайм. «Трішки, але я можу знайти час для тебе», — відповіла Мері. «Добре, підійди сюди на хвилинку», — сказала Шоутайм, показуючи на вікно. Мері швидко підійшла і подивилася назовні. «Ого, дощ», — сказала Мері саркастично. «Дуже смішно. Подивися на будинки. Ти бачиш, що щось виділяється?» — запитала Шоутайм. Мері залишилася мовчки, не розуміючи, що вона повинна була побачити. «Це світло, Мері. Скільки будинків мали світло до всього цього? Я знаю, ти хочеш, щоб ми ніколи не програли, я теж. Але ми програли, і тепер ми маємо зробити все, щоб показати людям, що вони можуть продовжувати жити, що є щось, що можна здобути, працюючи разом. Нам потрібно просто працювати разом, будь ласка?» — сказала Шоутайм щиро. Мері замислилася на мить, емоції переповнювали її."
nf_loi_unifier.10.a:0 "§3«Я... я спробую.»§!"

nf_loi_unifier.19.t:0 "Зганьбити Red Rocket"
nf_loi_unifier.19.d:0 "Катерина спостерігала, як будівельні бригади продовжували роботу на Безпечному притулку, заглиблена в думки. Була користь у тому, щоб думати нестандартно. Щиро кажучи, Катерина відчувала жаль через те, що змусила людей Безпечного притулку залишити своє місто, але переваги цього проекту були занадто значними. Пальне важливе не лише економічно, але й як ключовий ресурс для виробництва та подальшого використання бойових танків. Центральний хаб для заправки стане великим плюсом для бойових можливостей Лойдмінстера в майбутніх битвах, не кажучи вже про те, як важливою буде складська кімната для розвантаження їх переповнених міст. Це був необхідний вибір, і Катерина знала це.\n\nПролунав вибух, що порушив думки Катерини. Кран і кілька побудованих будівель були знищені внаслідок вибуху. Здається, зусилля опору Охоронців все ще тривають. Вона сердито рикнула, знаючи, що їй доведеться розібратися з наслідками пізніше. «Скільки б ви не намагалися. Ви не можете повернути свою поразку», — пробурмотіла Катерина сама до себе. Охоронці продовжать свої марні зусилля ще деякий час, але скоро вони зрозуміють; "
nf_loi_unifier.19.a:0 "§tВоля Катерини була остаточною.§!"

nf_loi_unifier.11.t:0 "Наш Трохи Перерослий Товариш"
nf_loi_unifier.11.d:0 "Коли один з молодших сержантів влетів до намету Катерини, бубонячи про зниклих фіолетових велетнів, що сховалися в притулку Вакава, капітан була майже впевнена, що це чергова абсурдна змова. Але коли вона вирушила з загоном у будівлю для розслідування, готова до озброєного засідки, вона зрозуміла, що помилилася. \n\nНавпроти них, через зал, стояли кілька фіолетових істот, по 3 метри заввишки, одягнені в плащі та медичні халати, їхні вирячені очі, зуби і огидні м’язи ледве вміщувалися в їхніх на вигляд гуманоїдних тілах. Кожен з них повернувся, щоб подивитися на Катерину і її людей, а кілька миттєво зникли з виду. Незручно, деякі з молодших сержантів взялися за зброю, але старша, втомлена медсестра підбігла до них. «Будь ласка! Не робіть цього перед пацієнтами!» \n\nЖінка відвела Катерину вбік, після чого розповіла історію нічних істот, що знаходилися в притулку, про «Єдність» та шизофренію, яку багато мутантів отримували через препарат «Стіл-Бой». Іноді капітан кидала погляд через плече медсестри на своїх людей. Дехто з них набрався сміливості для коротких, але тривожних розмов з нічними істотами, кілька навіть сором'язливо поцікавилися їхнім станом. \n\n«Хороша машина. Могутня.» — голос пролунав позаду Катерини. Стоячи позаду, був одинокий мутант у лахмітті, що дивився на танки, припарковані поза вікном. Медсестра додала: «О, це Лу — він справжня перлина, інколи допомагає нам впоратися з непослухами. Останнім часом дуже гарно просунувся!» \n\nЛу повернувся до Катерини. «Ти Сталевий Патріот?» Він витягнув надзвичайно пошарпану комікс-книгу. Катерина ледве могла розібрати обкладинку, на якій була зображена мускулиста жінка в військовій формі, що позує перед старим танком. «Лу великий фанат. Хоче допомогти... «боротися за правильну боротьбу». Як ти кажеш.» Катерина оглянула його з голови до ніг. Повільно почала кивати, як тільки мутант знову перебив її: «Може Лу...?» Він трохи схилив плечі і поставив руки перед собою, жестикулюючи, ніби водить транспортний засіб. Катерина не могла стримати легку усмішку."
nf_loi_unifier.11.a:0 "§t«Все буде своєчасно, великий хлопче. Сподіваюся, ти готовий боротися за правильну боротьбу.»§!"
nf_loi_unifier.11.b:0 "§t«Все буде своєчасно, великий хлопче. Сподіваюся, ти готовий боротися за правильну боротьбу.»§!"

nf_loi_unifier.12.t:0 "Віддати їм борг"
nf_loi_unifier.12.d:0 "«Тепер, товариші», — сказала Катерина незвично сумним тоном. «Я не вважаю, що мені потрібно знову розповідати історію про Спалену Мову. Я впевнена, ви чули це від своїх батьків і матерів.» Багато з чоловіків у кімнаті виглядали пригніченими, тінь на їхніх обличчях. Зал наповнився шепотом. \n\nКатерина почекала, поки спогади про різанину трохи заспокояться. Про чоловіків Залізної Конфедерації, що вирізали і палили шлях через землі Канадського Народного Фронту. Це було, в багатьох аспектах, початком кінця для КНФ. \n\nНарешті вона продовжила: «... Думаю, пора віддати борг. Що скажете?» Чоловіки на передніх рядах вибухнули оплесками і почали бити себе по грудях з вогнем і люттю в очах, які Катерина рідко бачила. Саме те, що їй було потрібно від них для того, що буде попереду."
nf_loi_unifier.12.a:0 "§t«Ми посолимо землю і спалимо ліси. Вони більше не повернуться.»§!"

nf_loi_unifier.14.t:0 "Зняти корону"
nf_loi_unifier.14.d:0 "«Тепер товариші, ви, мабуть, чули історії про блискуче королівство на сході. Королівство Манітоба, що очолюється довгою, славною та незламною лінією, ах, яка спадщина. Її майже можна смакувати», — сказала Катерина, кидаючи черевики на стіл поблизу, переконуючись, що всі в кімнаті звернули на неї увагу. «Але ось що вони не хочуть, щоб ви знали — це брехня. Все це. Вони не кращі за тебе чи мене.» \n\nВона помахала пакетом документів у повітрі, а потім вдарила ним по столу. «Подивіться самі. Легендарний «Король Ґанн», перший зі свого роду — нічого більше, ніж звичайний грабіжник. Він побачив можливість прикрасити свої данини, і скористався нею. Перемотайте кілька десятиліть вперед, і люди Брендона ввели себе в оману, думаючи, що вони можуть дивитися на нас згори зі своїх слонових веж... але чи дозволимо ми їм це?» \n\n«НІ!» — вигукнули чоловіки на передніх рядах. Катерина усміхнулася. «Ось що мені подобається чути. До того часу, як все це закінчиться, ми будемо проводити наступний обід у тронному залі. Напої на мене.» Легкі сміхи заповнили кімнату."
nf_loi_unifier.14.a:0 "§t«Я вирішу рахунок з Ґанном II наодинці...»§!"

nf_loi_unifier.15.t:0 "До Тиранів і Зрадників"
nf_loi_unifier.15.d:0 "Катерина вдарила Короля Ґанна II по грудях, штовхаючи його до задньої стіни його кімнати. Хворий гуль опустився на коліна, відчуваючи сильний кашель, що забрав у нього весь подих. Королева Кетрін випустила болісний крик, намагаючись вирватися з рук солдатів, які її затримали. Катерина підійшла до Короля, опустившись до його рівня, тримаючи його кришталево виснажене підборіддя в руці. «Все честь Великому Ґанну, королю нікому. Я ж права?» Вона схопила його за комір, тягнучи до вікна, щоб показати свою роботу. Полум'я, що піднімалося до найвищих будівель Брендона, нищило колись славне місто, слабкі крики цивільних ехо звучали знизу. \n\nОчі Ґанна, які довго були порожніми, ожили вперше за роки. Шепіт виходив з його висушених губ, а ледь чутні плачі заповнили кімнату. «Насолоджуйся виглядом. Справжньо оціни це. Можливо, це змусить тебе зрозуміти, наскільки ти був безсилий весь цей час. Якщо вже за щось, то за це варто подякувати мені.» Вона жестикулювала до своїх людей. Їм наказали замкнути його в кімнаті, щоб він міг зазнати страждань перед виконанням вироку на наступний день. \n\n§RАле це не було те, як все сталося.§! \n\nҐанн випустив маніакальний крик, його коли-то приглушений вираз обличчя змінився на спотворений, нелюдський гримасу, що виражала тваринну лють. Знову закричавши, він кинувся до Катерини з раптовою, оновленою енергією. Але капітан уже зрозуміла, що відбудеться. Вона швидко витягла пістолет, без вагань вистріливши в короля, і гучний тріск її зброї заглушив завивання Королеви-консорта."
nf_loi_unifier.15.a:0 "§t«Прибирайте і рушайте. Ми тут все закінчили.»§!"

nf_loi_unifier.16.t:0 "До Тиранів і Зрадників"
nf_loi_unifier.16.d:0 "Катерина в'їхала в великий цвинтар, що знаходився позаду Королівського палацу. Ось він, похований у лінії разом зі своїми попередниками, кожен з яких був більш розкішним і огидним за попереднього. Дехто говорить, що гульи наділені довгим життям — але Катерина не могла уявити собі гірший пекельний стан, ніж бути у своїй власній хворобливій свідомості вічно. \n\nВона схилилася біля його могили. Тіло короля нарешті знайшло спокій. Вона лише шкодувала, що не могла бути тією, хто це зробить. Поглянути йому в очі, показати, що Манітоба, все це гниле королівське коріння, яке породило цю династію, ось-ось зникне, розтане в білій безкрайній простір Півночі. Це був би гідний революційний кінець тому, що отруїло домівки канадських робітників від узбережжя до узбережжя. \n\nВона знову поправила своє пальто, коли холодний вітер пронісся повз неї. Час вирушати. Справедливість була здійснена цього дня. Вона лише шкодувала, що не змогла бути тією, хто її доставить."
nf_loi_unifier.16.a:0 "§t«Гідний кінець для трупного короля та його правління.»§!"

nf_loi_unifier.17.t:0 "До Тиранів і Зрадників"
nf_loi_unifier.17.d:0 "Катерина з її людьми вірвали в тронний зал королівського палацу. На задньому фоні, поглиненому тьмяним світлом дня, сидів виснажений старий чоловік, у погляді якого можна було побачити тягар всього світу. Солдати виглядали здивованими, але Катерина знала, хто перед ними. «Лейф Йорктон...» — прошепотіла вона. Легендарний Меч Півночі, якого жителі Манітоби згадували з пошаною і страхом. Або принаймні, тінь того міфу. \n\nСхопившися за обличчя, чоловік важко встав з трону, ледве тримаючись на ногах і з піднятим мечем. Солдати кинулися до неї, але капітан зупинила їх. Вона підійшла до розкладеного тирана, без зусиль ухиляючись від дикого, безцільного удару, а потім встромила ніж йому в груди. \n\nУ той момент Йорктон схопив Катерину за плече, дивлячись в темну стелю вище. «Елеонора... Я так радий, що ти в безпеці... о, Елеонора...» Легко видихнувши, він відпустив життя і впав на землю. Катерина поклала руку Йорктона на його грудях, на гарному мечі, що був у короля. Вона дивилася на нього кілька секунд, перш ніж звернутися до своїх людей..."
nf_loi_unifier.17.a:0 "§t«Прибирайте і рушайте. Ми тут все закінчили.»§!"

nf_loi_unifier.18.t:0 "Без відпочинку для праведних"
nf_loi_unifier.18.d:0 "Зала була переповнена. Місця на трибунах не вистачало, деяким чоловікам довелося стояти збоку кімнати. Інші вибрали стояти в дверях, оскільки натовп розтікався в морозний холод Лойдмінстера \n\nКатерина мовчки оглядала зал з п'єдесталу, поглинаючи момент тріумфу. Кульмінація всіх її зусиль. І тих, хто був до цього... \n\n«Подивіться навколо, товариші, подивіться у вікна», — запросила вона. «Все, чого ми досягли, ви повинні дякувати лише собі. Те, що ви можете бути тут сьогодні, поки ваші родини насолоджуються смачним обідом біля теплих багать, це не прийшло з нічого.» «І це ще не кінець. Для кожного села, яке ми звільняємо, для кожного міста, куди ми насаджуємо наш прапор, для кожного міста, яке ми забираємо у ще одного безумного фашиста, це ще одна людина, якій ви даєте шанс на життя. Коли настане наш день, ви зможете стояти перед перлинними воротами з золотим записником в одній руці і срібним калашніковим в іншій.» \n\n«Але я знаю, з чого ви зроблені. Я знаю, що ви не зупинитесь. І це добре. Тому я тут сьогодні перед вами. Хороші люди за межами Лойдмінстера потребують допомоги. Їм потрібно пробурити колодязі - їм потрібен захист від ненаситних рейдерів - їм потрібна освіта. Товариші — ми сильні тільки настільки, наскільки слабка ланка в ланцюзі. Ніколи не забувайте про це.» \n\n«І тому, я запитую вас в останній раз. Стоїте ви зі мною? Побачимо нашу мрію втіленою? Пожертвуйте своїм серцем за молодого чоловіка в Калгарі та люблячу бабусю в Вінніпезі? Ваших співвітчизників, братів і сестер?» \n\n«Будьте готові віддати все, що у вас є, наша історія починається зараз.»"
nf_loi_unifier.18.a:0 "§gІ вперше з початку кампанії по об'єднанню...§!"

nf_loi_unifier.90.t:0 "Звіт Логу #007"
nf_loi_unifier.90.d:0 "ДЛЯ ОЧЕЙ ТІЛЬКИ ГЕНЕРАЛА КАТЕРИНИ \n\nЗвіт Логу #007 \n\nОперація «Відправити на Захід» досягла прориву. Попри численні невдачі, нам нарешті вдалося перемістити нафтовий танкер з Великої Прірви та доставити його до наших об'єктів. Використовуючи 325 танків з 1-ї та 2-ї дивізій, ми витратили 4 дні, щоб повернути його додому."
nf_loi_unifier.90.a:0 "§FКІНЕЦЬ ЛОГУ§!"

nf_loi_unifier.91.t:0 "Звіт Логу #007"
nf_loi_unifier.91.d:0 "ДЛЯ ОЧЕЙ ТІЛЬКИ ГЕНЕРАЛА КАТЕРИНИ \n\nЗвіт Логу #007 \n\nРемонтні роботи нафтового танкера, необхідного для операції «Відправити на Захід», проходять успішно. Хоча ремонти були затруднені на деякий час через велику кількість комах, що оселилися глибоко в кораблі. Ми змогли очистити їх і розпочати ремонт. Уже виправлені навігація та паливні відсіки. Корабель найближчим часом досягне 100% бойової готовності."
nf_loi_unifier.91.a:0 "§FКІНЕЦЬ ЛОГУ§!"

nf_loi_unifier.92.t:0 "Звіт Логу #008"
nf_loi_unifier.92.d:0 "ДЛЯ ОЧЕЙ ТІЛЬКИ ГЕНЕРАЛА КАТЕРИНИ \n\nЗвіт Логу #008 \n\nОперація «Відправити на Захід» готова до старту. Корабель відремонтовано та укомплектовано екіпажем. Навігація та бойові можливості підготовлені. Все, що залишилось, це, щоб наші ключові члени екіпажу піднялися на борт і підготувалися до подорожі в невідоме. Удачі."
nf_loi_unifier.92.a:0 "§FКІНЕЦЬ ЛОГУ§!"

nf_loi_unifier.99.t:0 "Додому"
nf_loi_unifier.99.d:0 "\"Це останній з них запущений, капітане!\" — крикнув лейтенант, коли вийшов з машинного відділення. Катерина стояла на кормі старовинного судна, нафтового танкера, який був витягнутий з Прірви. Вона залучила найбільші уми і техніків Лойдмінстера, щоб знову вивести його на воду. Все для однієї мети. Однієї славної мети. \n\n«...Капітане?» Лейтенант вивів Катерину з глибоких роздумів. «Так... зберіть екіпаж. Я хочу, щоб ми вирушили до заходу сонця.» Чоловік кивнув і побіг. Катерина поглянула на океан. Льодові блакитні води Тихого океану розстилалися до самого горизонту. Це було надзвичайно. Ніяких уламків, мертвих дерев, тіл. Це був часовий капсула минулого часу, незмінна, нерухома. Шлях до старого світу, вирізьблений для неї, кликав її. Вона не збиралася повертати спину. \n\n«Лідія...» — прошепотіла вона. Вона нарешті зробить свою спадщину справедливою. Що б її не чекало на радянському узбережжі, все це виправдає кожен її вибір, кожну її дію. І тих, хто був до неї. Скарб більший за будь-яку річ з Старого Світу чи зброю. Переконання, щоб сформувати майбутнє її народу на покоління вперед."
nf_loi_unifier.99.a:0 "§gВона повернулася до своєї каюти і підготувалася до подорожі вперед.§!"

nf_loi_unifier.100.t:0 "§!Хто готовий до завтрашнього дня§!"
nf_loi_unifier.100.d:0 "\"...Тож так, я не думав, що це зможе зберігати кімнатну температуру, мабуть, це якийсь особливий метал,\" — зауважив рядовий Бальзой, попиваючи з термоса, зробленого зі сміття, знайденого в Уайткурті. «Я думав, ти зрозумієш після того, як я розповів про нову сковорідку, яку я приписав,» — відповів сержант Брадінофф, поправляючи своє пальто, коли холодний морський вітер пронісся повз нього. «Дивись, ти ж знаєш, що все проходить повз мене в їдальні і - почекай, ти бачиш це?» Сержант схопив бінокль, що лежав на пірсі, і побіг до краю. Маленька чорна точка вдалині наближалася все більше. Чи може це бути? «Розбудіть інших, їжа, теплі ковдри, все, що можна знайти - чекайте найгіршого.» Бальзой кивнув і побіг у казарму. \n\nЧерез кілька хвилин нафтовий танкер пришвартувався в порту, його гучний сирена розбудила табір. Більшість стояли біля корпусу, тримаючи різноманітні припаси. Один за одним, чоловіки експедиції ступили на суху землю, зустрічаючи їх з вигуками, обіймами та погладжуваннями по спинах від старих товаришів. Зрештою, Катерина вийшла на зустріч аплодисментам і вигукам. За нею йшов чоловік в плащі, з довгою бородою, на обличчі якого можна було побачити сліди його яскравого життєвого досвіду. \n\n«Ласкаво просимо назад, капітане, сподіваюся, експедиція була плідною. Чоловіки хочуть почути про ваші пригоди і, мм...» Сержант поглянув через плече Катерини. «Це він... це один з наших, капітане?» Катерина посміхнулася, притягнувши старого чоловіка до себе. «Сержанте, дозвольте представити вам Віктора Воґна. Він є посланцем з міста Владивосток, справжнього оплоту революції через океан.» Віктор кивнув, його висушене обличчя залишалося незмінним і спокійним. Сержант, трохи неготовий, зам'явся на кілька моментів, перш ніж зробити незграбний салют, що змусило Віктора вибухнути сміхом. \n\nКатерина терпляче чекала, поки він заспокоїться, перш ніж продовжити. «Я пізніше дам доповідь про це всім. Але коротко - хай буде відомо, що я впевнена: ми та наші друзі через Тихий океан маємо спільну мету — підтримувати добробут робітників по всьому безлюдному світу. Немає більшого призначення. Чи не так, сержанте?» Брадінофф, знову здивований, відповів: «Звісно, капітане.» Катерина поклала руку на його плече. «Добре. Дуже добре. Тепер — принеси нам напій, гаразд?»"
nf_loi_unifier.100.a:0 "§RЧерез кров і моря ми знайшли одне одного.§!"

nf_loi_mercy.1.t:0 "Ми колись були добрими"
nf_loi_mercy.1.d:0 "\"Я колись знав одного чоловіка. Простого чоловіка, доброго чоловіка. Того, хто боронився за нічого, окрім єдиної ідеї — доброти до інших, поки світ не розкришив його, перетворивши на старого шморгача. Я говорю про Соломона Бушара,\" — сказала Катерина м'яким голосом, який трохи тремтів. \"Ви всі його знаєте, чоловік, який посередницював мир між пілігримами і танкерами, який особисто потиснув руку Лідії. Той, хто став Батьком нації. Але з часом, і коли весь тягар впав на нього, і знову й знову, він захитався і врешті зламався.\" — сказала Катерина, її голос темнів. \n\n\"І коли він став сліпим до всього, апатичним до потреб нації, ми встали. Адже наш обов'язок — захищати націю, якою б великою не була ціна.\" — сказала Катерина рішуче. \"Ми забрали їхні зброї, зруйнували церкви і вигнали всіх, хто підтримував Соломона. Ми взяли владу в свої руки,\" — сказала вона, злегка пишаючись. Її очі повернулися до пальця, який міцно тримав трибуну. Вона простягла руку, дивлячись на долоні. \"І все ж, я питаю себе. Що б сталося, якби Соломон дізнався? Чи пробачив би він нас, зрозумів би наші благання? Чи вдарив би він нас справедливістю?\" — міркувала Катерина тихо, її голос знову тримтів. \"Чи простягнув би він до нас руку з тією добротою, яку він бачив у багатьох інших? Чи прийняли б ми її?\" Її голова повільно впала назад, і вона подивилася вгору на стелю. Лише одна емоція пробудилася в її серці. \n\n§1Жаль.§!"
nf_loi_mercy.1.a:0 "§gЛідер танків мала свою власну битву, яку потрібно було виграти.§!"

nf_loi_mercy.2.t:0 "Проходження"
nf_loi_mercy.2.d:0 "\"Скажи мені, Наталія, як справи на дипломатичному фронті?\" — запитала Катерина. Вони з Наталією були в кабінеті Катерини глибоко в ніч. Наталія голосно позіхнула перед тим, як відповісти: \"Досить добре. Safehaven був дещо готовий до переговорів. Це було не так легко через ту дівчину-Уповноважену, що шепоче вухо меру, але, думаю, ми нарешті змогли завершити справу. Потрібно буде організувати час для вашої зустрічі з ними.\" — повідомила Наталія. Катерина підняла брову. \"Чому саме я? Ти ж більш ніж здатна.\" — сказала вона. \"Звісно, я можу. Але хто краще за голову нації може вести переговори? Їхній лідер витрачає час на вас. Було б не ввічливо посилати когось нижчого за себе.\" — відповіла Наталія. \"Ти правду кажеш,\" — погодилася Катерина. Вона поглянула у вікно, в її серці з'явилося занепокоєння. Можливість є, але вона може згаснути в будь-яку хвилину. Уповноважені не були оптимістами, як і найманці. 'Принаймні мер виглядав зацікавленим в союзі.' — подумала Катерина про себе."
nf_loi_mercy.2.a:0 "§gЦе принесло їй певне заспокоєння.§!"

nf_loi_mercy.3.t:0 "Катерина приходить"
nf_loi_mercy.3.d:0 "Коли шпигуни Сільвії повідомили їй, що громадянська війна на сході завершена і залишки КНФ перемогли, вона стежила за ситуацією, як яструб. КНФ завжди мала проблемну історію, яку Уповноважені не дуже любили. Були заклики до превентивних ударів, але Сільвія їх відхилила. План полягав в тому, щоб чекати. Якщо вони прийдуть — ми з ними розберемося. І цей день настав, але не зовсім так, як ми очікували. \n\nСільвія зібралася з силами і відчинила двері, тривога кипіла всередині. В кімнаті стояла Катерина з Лойдмінстера, руки за спиною. \"Уповноважена Сільвіє, чудово бачити вас. Сподіваюся, вам добре?\" — запитала Катерина. \"Досить непогано, враховуючи, як все відбувалося останнім часом,\" — сказала Сільвія, сама трохи невпевнена. \"Вибачте, сподіваюся, що більш войовничі Уповноважені не приносять вам великих труднощів,\" — сказала Катерина. \"Нічого, з чим я не могла б впоратися,\" — сказала Сільвія. Вони постояли кілька хвилин, тиша ставала незграбною. \"Ви прийшли до рішення щодо союзу?\" — запитала Катерина після того, як прокашлялася. \"А, так, ми вирішили...\""
nf_loi_mercy.3.a:0 "§O«Ви можете розраховувати на Пасходарів»§!"
nf_loi_mercy.3.b:0 "§O«Ми не можемо зараз виконати це»§!"

nf_loi_mercy.4.t:0 "Безпечна ставка"
nf_loi_mercy.4.d:0 "\"Скажи мені... Як справи з Уповноваженими в горах, Наталія?\" — запитала Катерина. Вони з Наталією проводили нараду з кількома іншими людьми, всі зосереджені на залученні Пасходарів до свого боку. Запах сигар та смак кави були єдиним, що вони знали протягом останніх 4 годин. \"Ну, це наша перша проблема. Попри те, що вони спочатку були Уповноваженими, схоже, вони скинули свої корені. Тепер вони більше схожі на просто захисників людей в горах,\" — поінформувала Наталія. Катерина зробила ковток кави, обробляючи отриману інформацію. \"Це звучить дуже сприятливо. Вони готові до переговорів?\" — запитала Катерина. \"Дещо. Є все ще Уповноважені в їхніх рядах, і вони чітко висловили свою думку лідеру, але вона, здається, все одно хоче поговорити,\" — поінформувала Наталія. \"Не найкраще, не найгірше. Організуйте час і я особисто прийду до них.\" \n\nМи або здобудемо нового союзника, або матимемо нового ворога."
nf_loi_mercy.4.a:0 "§gЯк би там не було, ми будемо готові.§!"

nf_loi_mercy.5.t:0 "Охоронець Революції"
nf_loi_mercy.5.d:0 "\"Ще не пізно для тебе передумати! Я серйозно вважаю, що ти робиш поганий вибір, Шоутайм!\" — практично благала Мері. Шоутайм зневажливо знизала плечима, похитавши головою. \"Знаєш, Мері, я чесно думала, що ти перестанеш мене це теребити вже давно. Я думаю, що я була достатньо ясною.\" — сказала Шоутайм. \"Ти не знаєш КНФ так, як знають їх Уповноважені!\" — сказала Мер. \"Вони вже не КНФ. Вони... релігійні танкові люди, мабуть? Це не важливо. Головне те, що ми можемо мати мир.\" — сказала Шоутайм. \"Чому ти мене не слухаєш?! Я намагаюся захистити нас!\" — вигукнула Мері до Шоутайм, яка трохи здивовано відреагувала. \"Я і є, Мері. Обіцяю, я намагаюся. Але я маю обов'язок перед нашим народом.\" — сказала Шоутайм суворо. \n\nШоутайм розпахнула двері і увійшла в кабінет. Там стояла Катерина з суворим виглядом. \"Мер Шоутайм, так добре знову вас бачити,\" — сказала Катерина. \"Так само, міс Катерино. Ми багато розмірковували в Safehaven. Ми...\" Вона залишила речення незавершеним, слова Мері лунали в її голові. Чи вона робить правильний вибір? \"Мер?\" — запитала Катерина після того, як прокашлялася. \"Правда, найглибші вибачення. Як я і казала, ми багато думали над вашою пропозицією і вирішили...\""
nf_loi_mercy.5.a:0 "§O«Ми з радістю приєднаємося до вас!»§!"
nf_loi_mercy.5.b:0 "§O«Ми хочемо залишитися самі»§!"

nf_loi_mercy.6.t:0 "Тепер Вірджил, тепер Беатріс"
nf_loi_mercy.6.d:0 "Елегантна мелодія піаніно м'яко наповнювала велику банкетну залу, в якій люди з усіх шарів Лойдмінстера спілкувались один з одним. Finger food і алкогольні напої подавалися без обмежень, що створювало атмосферу невимушеного відпочинку. Попри загальне задоволення людей, було абсолютно невідомо, з якої причини вони зібралися. Звісно, Лойдмінстер змінився за ці роки, і це давало багато підстав для святкування. Але точна причина, чому відбулася ця зустріч, залишалася загадкою. Світло потьмяніло, зосереджуючись на великій сцені; натовп замовк. З-за завіс вийшла Катерина, виглядаючи задоволеною. Вона простягнула руку до мікрофону і почала говорити. \n\n\"Люди Лойдмінстера. Ви повинні пишатися собою!\" Її голос лунав голосно, і натовп вибухнув оваціями. \"Ще не так давно ми були в оточенні. Вороги зсередини і ззовні намагалися знищити нас. Вони намагалися зламати нашу волю. Але ми їх перемогли!\" — гукнула Катерина, знову отримуючи шалені овації. \"Але інколи я відчуваю жаль за свої вчинки,\" — сказала вона сумно, її посмішка стала ще сумнішою. \"Ми зробили те, що повинні були зробити. Духовенство неодноразово доводило свою нездатність. Але, можливо, ми могли знайти кращий спосіб.\" — сказала вона, її очі дивилися прямо через натовп. \"Дозволяти собі тягнутися за минулим — це марно. Але щоб навчитися з нього, потрібно завжди прагнути це зробити,\" — сказала вона. Потім вона витягла з кишені пульт і натиснула кнопку, яка вивела зображення на екран позаду неї. \"Дозвольте показати вам ново відновлену Церкву святого Леніна!\" — сказала вона радісно. Натовп заплескав, але насправді, Катерина не хвилювалася, як вони відреагують. Вона знала в своєму серці, що це було правильне рішення; вона навчилася піклуватися про духовенство. Вона змінилася за ці роки, отримавши багато уроків від важливих постатей. Нарешті, вона отримала останній урок. \n\n§2Прощення.§! \n\nПрощення для людей, які заподіяли шкоду..."
nf_loi_mercy.6.a:0 "§6...І для себе.§!"

#radar
nf_loi_radar.1.t:0 "Супутник"
nf_loi_radar.1.d:0 "Ми це зробили! Після ретельних тестів та складної технічної роботи, ми змогли активувати супутник. Після того, як ми видалили всі попередні дані RELCOM, ми готові почати обстеження сигналів."
nf_loi_radar.1.a:0 "§gЕврика!§!"

nf_loi_radar.2.t:0 "Супутник"
nf_loi_radar.2.d:0 "Проблеми виникли з проектом відновлення супутника. Попри численні спроби, з деякими майже успішними, коли нам вдалося підключитися до сигналів на кілька секунд, ми так і не змогли активувати супутник. Нам доведеться спробувати знову."
nf_loi_radar.2.a:0 "§gПринаймні ми хоч щось спіймали...§!"

nf_loi_radar.3.t:0 "Супутник"
nf_loi_radar.3.d:0 "Наші спроби відновити супутник виявилися повною та абсолютною невдачею. Попри експертну технічну роботу і кілька ударів молотком, нічого не працює. Нам доведеться спробувати ще раз."
nf_loi_radar.3.a:0 "§gЧорт!§!"

nf_loi_radar.4.t:0 "Мертве повітря"
nf_loi_radar.4.d:0 "Наш зонд знайшов лише мертве повітря. Після деяких розслідувань з'ясувалося, що антена була нещодавно пошкоджена. Ремонт буде необхідний, перш ніж ми зможемо спробувати знову."
nf_loi_radar.4.a:0 "§gЧорт!§!"

nf_loi_radar.5.t:0 "Шоу-тюни"
nf_loi_radar.5.d:0 "Наш зонд знайшов щось! Пре-воєнна радіостанція транслює кілька мелодійних пісень. Нічого особливого, але музика добре підвищує мораль."
nf_loi_radar.5.a:0 "§g...Поцілунок перед тим, як ти мене покинеш§!"

nf_loi_radar.6.t:0 "Південний Шарм"
nf_loi_radar.6.d:0 "Гучний звук сміху долинав з кімнати керування супутником, змушуючи командира Бокера вийти зі свого кабінету та перевірити, що відбувається. Він підійшов до кімнати для прослуховування і побачив, що всі працівники знаходяться в кімнаті, сидячи навколо та поїдаючи їжу. Бокер голосно прочистив горло. \"Що ви тут робите?\" — запитав він суворим поглядом. \"Е-е, командир! Ми... е-е. Ви ж бачите, ми знайшли цей радіосигнал з далекого півдня. Він йде з радіостанції. Ми збиралися лише трохи послухати, але він просто дуже хороший,\" — запнувся один з працівників. Музика на радіо заглохла, і голос прогримів. \n\n\"Добрий день, пані та панове. Це ваш ведучий, містер Ентертейнмент. Привіт з радіостанції KX, з чудового Техасу. У мене є кілька цікавих новин для вас сьогодні. Здається, що залишки бандитів Руки все ще активні на півночі Лоун Стар, доставляючи деякі проблеми Поліцейським, які патрулюють цю територію, хоча їхні постійні напади стають все рідшими з часом. Далі, мер Кітс представив новий інвестиційний план, що має зміцнити зв'язки між ним і іншими учасниками TEU. І, нарешті, ще одна поставка FEV з Кратерного Озера прибула в Остін минулої ночі, тому для тих, хто хоче отримати зелене, це ваш шанс. Дуже цікаві справи! Більше нічого на звичайну годину, але залишайтеся з нами, бо ми скоро будемо мати інтерв'ю з Ельдером Раском, що буде о восьмій тридцять. А поки що ось чудова пісня для вас усіх про ту книжку, яку ми всі потребуємо. Ось "Book of Love" від Monotones.\""
nf_loi_radar.6.a:0 "§8«Що таке Банда Руки???»§!"

nf_loi_radar.7.t:0 "Клітини Страткомуни"
nf_loi_radar.7.d:0 "Наш зонд виявив дещо дуже тривожне. Здається, ми знайшли радіочастоту з клітки опору Страткомуни. Вони планують терористичну кампанію проти нас. Ми вже відправили людей, щоб вирішити це, поки проблема не стала більшою."
nf_loi_radar.7.a:0 "§g...Фух§!"

nf_loi_radar.8.t:0 "Пісня Жителів"
nf_loi_radar.8.d:0 "Наш супутник зафіксував дуже дивний сигнал. Спочатку кілька годин ми тільки чули статичний шум, але після певних налаштувань змогли послухати дивне мовлення, яке, здавалося, розповсюджувалося по всьому Пустошу. Багато хто очікував, що це буде оголошення від якоїсь нації, можливо, регіонального об'єднувача. Однак це виявилося набагато простіше і водночас дивніше. Мовлення було записом групи жителів сховищ, які співали пісню для себе. Чому це було записано і транслювано, нам невідомо, але спів приносить деяке заспокоєння нашому народу."
nf_loi_radar.8.a:0 "§8«У Сховищі можуть бути недоліки, але його коридори були з кондиціонерами»§!"

nf_loi_radar.9.t:0 "видалений контент"
nf_loi_radar.9.d:0 "чому ви тут"
nf_loi_radar.9.a:0 "будь ласка, йдіть (лол, ніяких привітань)"

nf_loi_radar.10.t:0 "Загадковий Аудитор"
nf_loi_radar.10.d:0 "\"Сір! Я отримую дуже дивні показники з півдня!\" — голосно вигукнув один із техніків на супутниковій станції. Командир підійшов до нього, знявши капелюха і подивився на екран. \"Це щось, що називається Чіко-Нет. Сигнали йдуть з самого півдня.\" — повідомив технік. Командир подивився на екран, легенько потерши підборіддя, думаючи. \"Підключіть, мені цікаво\" — наказав він. Технік натиснув кілька кнопок, звук статичного шуму ставав то гучнішим, то тихішим, поки він намагався підключитися. \"Я не отримую багато. Дані здаються старими. Дуже пошкодженими, чесно кажучи, вражаюче, що це ще працює.\" — сказав технік, працюючи. Статичний шум зріс до максимуму, перш ніж раптово зникнути. Екран потемнів, з динаміків вийшов гучний свист, змушуючи обох чоловіків закрити вуха. Те, що сталося далі, здивувало їх обох. \n\nНа екрані з'явилася постать. Він носив капелюх з широкими полями і добре натертому костюмі, а також акуратно підстрижені вуса. Він виглядав дуже розлюченим. \"Хто ви?!\" — закричав він. \"Це захищена лінія! Ви не повинні бути тут. Мій батько нездужає, і ви йому не допомагаєте!\" — вигукнув чоловік, схвильовано. Він продовжував ще деякий час, поки раптово не зупинився, звертаючи велику увагу на один з уніформ співробітників. \"Почекайте! Я бачу цей значок. Ви члени революції! Ну, це змінює все. Як там у вас з друзями!?\" — запитав він радісно. Обидва працівники супутникової станції подивилися один на одного, здивовані."
nf_loi_radar.10.a:0 "§8«Ееее, це довга історія.»§!"

