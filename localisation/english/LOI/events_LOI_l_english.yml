nf_loi.12.t:0 "Катастрофа в Саскачевані"
nf_loi.12.d:0 "Оглядаючись назад, втрата Уінніпеґа та Манітоби стала переломним моментом для радикалів КНФ. Протягом багатьох років вони стверджували, що Фронт перетворився на застиглу структуру, надаючи пріоритет експансії на Схід, в той час як потреби тих, хто вже живе на наших землях, залишалися поза увагою. І ось, це зрештою обернулося проти нас. \n\nПід впливом наших територіальних втрат багато хто приєднався до цієї більш популістської групи, яка незабаром переросла в нову фракцію, відому як Народний Фронт Канади (НФК). НФК поставив КНФ ультиматум. Вони вимагали термінових партійних виборів, щоб, як вони вважали, захопити останню можливість радикально змінити напрямок Фронту і запобігти його повному колапсу. \n\nНіхто точно не знає, хто першим відкрив вогонь. Дехто вказує на НФК, стверджуючи, що високопосадовці цього угруповання вийшли з себе після того, як керівництво КНФ не відповіло вчасно. Інші наполягають на тому, що КНФ чекали, щоб таємно усунути організаторів НФК. Хоча я і відкидаю це пояснення, не можу заперечити, що хаос тих днів залишив багато запитань без відповіді... \n\nКНФ незабаром штурмував фортеці НФК по всьому Саскачевану, кожна сторона вичерпувала свої ресурси та людські сили в кривавій громадянській війні. Коли пил осів, обидві організації фактично припинили існування, оскільки жодна з них не мала ресурсів для придушення розколів всередині. Все, що ми залишили, це привиди і відлуння минулого... \n\nПишучи ці записи з міста, яке контролює лише частину колишніх територій, я все більше думаю про всі способи, як це могло б бути запобігано. \n\nБільше ніколи не будемо ігнорувати голоси наших гучніших меншин."
nf_loi.12.a:0 "§tНе якщо ми хочемо відбудувати те, що було втрачено.§!"

nf_loi.13.t:0 "(Прочитати) Катастрофа в Саскачевані"
nf_loi.13.d:0 "Оглядаючись назад, втрата Уінніпеґа та Манітоби стала переломним моментом для радикалів КНФ. Протягом багатьох років вони стверджували, що Фронт перетворився на застиглу структуру, надаючи пріоритет експансії на Схід, в той час як потреби тих, хто вже живе на наших землях, залишалися поза увагою. І ось, це зрештою обернулося проти нас. \n\nПід впливом наших територіальних втрат багато хто приєднався до цієї більш популістської групи, яка незабаром переросла в нову фракцію, відому як Народний Фронт Канади (НФК). НФК поставив КНФ ультиматум. Вони вимагали термінових партійних виборів, щоб, як вони вважали, захопити останню можливість радикально змінити напрямок Фронту і запобігти його повному колапсу. \n\nНіхто точно не знає, хто першим відкрив вогонь. Дехто вказує на НФК, стверджуючи, що високопосадовці цього угруповання вийшли з себе після того, як керівництво КНФ не відповіло вчасно. Інші наполягають на тому, що КНФ чекали, щоб таємно усунути організаторів НФК. Хоча я і відкидаю це пояснення, не можу заперечити, що хаос тих днів залишив багато запитань без відповіді... \n\nКНФ незабаром штурмував фортеці НФК по всьому Саскачевану, кожна сторона вичерпувала свої ресурси та людські сили в кривавій громадянській війні. Коли пил осів, обидві організації фактично припинили існування, оскільки жодна з них не мала ресурсів для придушення розколів всередині. Все, що ми залишили, це привиди і відлуння минулого... \n\nПишучи ці записи з міста, яке контролює лише частину колишніх територій, я все більше думаю про всі способи, як це могло б бути запобігано. \n\nБільше ніколи не будемо ігнорувати голоси наших гучніших меншин."
nf_loi.13.a:0 "§tНе якщо ми хочемо відбудувати те, що було втрачено.§!"

nf_loi.14.t:0 "Довгий похід додому"
nf_loi.14.d:0 "Однією з найбільш помітних фракцій, що виникли після кривавого конфлікту між КНФ і НФК, є Великий Стампід. Її можна найкраще описати як вільну конфедерацію племен і прикордонників, що тягнеться через всю територію Альберти. Останній раз, коли я перевіряв, вони були об'єднані через угоду про розподіл влади між двома найбільшими та найпотужнішими родинами. Шлюб, укладений зручністю? Чи щось більше? Не можу сказати. Якщо чесно, мені все одно. \n\nТе, що не дає мені спокою вночі, так це те, наскільки успішно спрацювала ця угода для них. Подружжя створює образ стабільності, любові, громада – це продовження самої родини. Той тип товаришування, який неможливо штучно створити. У багатьох відношеннях – вони досягли того, де ми зазнали невдачі. \n\nАле це не обмежується тільки управлінням. Безліч разів з моменту розпаду КНФ ми намагалися організувати їх і повернути їх до лав. І щоразу нас відкидали. Суворі пустелі не допомагали, але ключовим моментом було те, що, як би далеко ми не просувалися, як би глибоко ми не проникали на їхні землі; ми щоразу знаходили нову фортецю, нове село, озброєне до зубів, нові пастки. Нам ніколи не вистачало ресурсів, щоб довести справу до кінця. \n\nАле однією хитрістю далеко не заїдеш. Ми зализали свої рани і навчилися на своїх помилках. \n\nНаступного разу, коли ми зустрінемося на полі бою, це буде останній раз."
nf_loi.14.a:0 "§tЯ в цьому впевнений.§!"

nf_loi.15.t:0 "(Прочитати) Довгий похід додому"
nf_loi.15.d:0 "Однією з найбільш помітних фракцій, що виникли після кривавого конфлікту між КНФ і НФК, є Великий Стампід. Її можна найкраще описати як вільну конфедерацію племен і прикордонників, що тягнеться через всю територію Альберти. Останній раз, коли я перевіряв, вони були об'єднані через угоду про розподіл влади між двома найбільшими та найпотужнішими родинами. Шлюб, укладений зручністю? Чи щось більше? Не можу сказати. Якщо чесно, мені все одно. \n\nТе, що не дає мені спокою вночі, так це те, наскільки успішно спрацювала ця угода для них. Подружжя створює образ стабільності, любові, громада – це продовження самої родини. Той тип товаришування, який неможливо штучно створити. У багатьох відношеннях – вони досягли того, де ми зазнали невдачі. \n\nАле це не обмежується тільки управлінням. Безліч разів з моменту розпаду КНФ ми намагалися організувати їх і повернути їх до лав. І щоразу нас відкидали. Суворі пустелі не допомагали, але ключовим моментом було те, що, як би далеко ми не просувалися, як би глибоко ми не проникали на їхні землі; ми щоразу знаходили нову фортецю, нове село, озброєне до зубів, нові пастки. Нам ніколи не вистачало ресурсів, щоб довести справу до кінця. \n\nАле однією хитрістю далеко не заїдеш. Ми зализали свої рани і навчилися на своїх помилках. \n\nНаступного разу, коли ми зустрінемося на полі бою, це буде останній раз."
nf_loi.15.a:0 "§tЯ в цьому впевнений.§!"

nf_loi.16.t:0 "За межами Бреху"
nf_loi.16.d:0 "Як би не були виснажені наші ресурси на даний момент, я знаходжу розраду в тому, що, ймовірно, нам більше не доведеться охороняти кордон. Суворі бурі, сліпучі снігопади і гострі, як леза, вітри Північної Альберти виконують більше роботи, ніж наша армія коли-небудь змогла б. І все ж, я не можу подумати про більшу марнотратство, ніж не використати нашу задню двірку... \n\nНещодавно я знайшов набір старих нотаток, складених Лідією, що датуються першою та єдиною успішною експедицією в Брех. Вони дещо безладні, сповнені суперечливих описів та нечітких хронологій. Але навіть з урахуванням цієї невизначеності, вони змушують мене замислитись. \n\nЗгадки про розбиті супутники зі Старого Світу, занурені у зимовий сніг, які так і не були знайдені. Про ангари, що хваляться списаними радянськими підводними човнами. І незнешкоджені ракети, що стали безпечними завдяки суворій погоді, але з потенціалом знову загорітися... \n\nЄ занадто багато слідів, щоб я міг відмовитись від цього. Лорд знає, що може повернути нормальна експедиція з хорошим оснащенням. Навіть фрагмент скарбів Старого Світу може змінити баланс сил у нашій користь. І дозволить нам знову піднятися високо над землею."
nf_loi.16.a:0 "§tМожливо, час підняти цей сніговий завісу раз і назавжди...§!"

nf_loi.17.t:0 "(Прочитати) За межами Бреху"
nf_loi.17.d:0 "Як би не були виснажені наші ресурси на даний момент, я знаходжу розраду в тому, що, ймовірно, нам більше не доведеться охороняти кордон. Суворі бурі, сліпучі снігопади і гострі, як леза, вітри Північної Альберти виконують більше роботи, ніж наша армія коли-небудь змогла б. І все ж, я не можу подумати про більшу марнотратство, ніж не використати нашу задню двірку... \n\nНещодавно я знайшов набір старих нотаток, складених Лідією, що датуються першою та єдиною успішною експедицією в Брех. Вони дещо безладні, сповнені суперечливих описів та нечітких хронологій. Але навіть з урахуванням цієї невизначеності, вони змушують мене замислитись. \n\nЗгадки про розбиті супутники зі Старого Світу, занурені у зимовий сніг, які так і не були знайдені. Про ангари, що хваляться списаними радянськими підводними човнами. І незнешкоджені ракети, що стали безпечними завдяки суворій погоді, але з потенціалом знову загорітися... \n\nЄ занадто багато слідів, щоб я міг відмовитись від цього. Лорд знає, що може повернути нормальна експедиція з хорошим оснащенням. Навіть фрагмент скарбів Старого Світу може змінити баланс сил у нашій користь. І дозволить нам знову піднятися високо над землею."
nf_loi.17.a:0 "§tМожливо, час підняти цей сніговий завісу раз і назавжди...§!"

nf_loi.18.t:0 "Останній лист Вадима"
nf_loi.18.d:0 "Експедиція змогла відновити історію старого підводного човна, спираючись на деякі записи в терміналах, знайдені в кімнаті управління. З того, що змогли витягти перекладачі, окупація Канади Сполученими Штатами в 2072 році пролунавала як сигнал тривоги в Кремлі. Деякі старі собаки в секретаріаті почали обговорювати ідею того, що Америка готується до більш масштабних операцій в Тихому океані. Після того як війна з Китаєм завершиться, стверджували вони, між США і двором Росії нічого не стане на заваді. \n\nРозпізнавши таку можливість, але й водночас бажаючи зберегти поточну розрядку з Вашингтоном, Генеральний секретар відправив один топовий ядерний підводний човен, який мав проводити приховані розвіддані вздовж канадського узбережжя. Місією командував капітан Вадим. Серед найкращих у радянському флоті, він прославився під час сутичок в Чорному морі наприкінці 2050-х, швидко піднявшись кар'єрною сходами. У своїх каютах команда змогла знайти рукописну записку, що залишилася незайманою в герметичній сейфі під ліжком: \n\n"24 жовтня 2077 року, \n\n18 годин з останнього зв'язку з головним штабом. Вибух вивів з ладу наші системи. Деформація корпусу збільшується. Як і їхні крики. Якби я був кращою людиною, я б був там з ними. Поглянув би їм в очі, поки ми разом йдемо на дно. Як команда. \n\nАле я не такий. Я лише рухався від підвищення до підвищення протягом останніх 27 років. Ось тут потиснули руку. Ось тут — підморгнули. І все це призвело до сталевого могили за тисячі кілометрів від дому. \n\nЯ більше не можу. Вони просять і благають. Це стає гучніше. Більш відчайдушно. Я чую, як нігті дряпають двері. Якби я був кращою людиною... \n\nНемає надії. Але якщо є Бог — пробач мені."
nf_loi.18.a:0 "§OВадим Слазов, Командувач К-572§!"

nf_loi.19.t:0 "Народний вотум недовіри, Частина 1"
nf_loi.19.d:0 "Командир слухала вимоги, що надходили через короткохвильовий радіо. Це було смішно, вона знала, але все одно з цим доведеться щось робити. "Ти... ти вважаєш, що це правда?" — запитала Наталія, її обличчя стало білим, сидячи поруч із Єкатериною в тісному офісі.\n"Не думаю," — промовила Командир. "Але ми не можемо дозволити дітям розповсюджувати таку неправду через радіо, тим більше таку. Голова полетить." Вона видала низький рик, а Наталія трохи відкинулася на стільці. Єкатерина повернулася до своєї подруги і зрозуміла, що Наталія боїться. Чого? Жарту на радіо? Ні... чи це була Наталія, яка боялася її? Єкатерина посміхнулася і насупила брови. "Хочеш приєднатися до мене, щоб докопатися до правди?" Наталія застигла на місці і широко розплющила очі, спостерігаючи за Командиром. Через кілька моментів Єкатерина знизала плечима і встала. "Як хочеш. Я повернуся через кілька годин. Намагайся хоча б частину цієї паперової роботи зробити." Вона широко жестикулювала в бік безладу на столі і вийшла з кімнати. Охоронці рушили за нею, утворюючи 12-людний супровід до того моменту, коли вона покинула будівлю. Вона припаркувала свій особистий автомобіль біля снігової кучугури поруч з офісом, і...\n"Ось вона!" — крикнув голос з даху будівлі на три поверхи вище, і Єкатерина різко повернулася. Поглянувши вгору, вона побачила самотнього чоловіка на вершині будівлі, який тримав прапор, який вона бачила лише на боках деяких із найстаріших танків "Списа" — серп, обвиваючий кленовий лист на зірковому жовтому фоні. "Забирай її!" Вона знову розвернулася, і натовп з перехожих швидко сформував коло навколо Єкатерини і її охоронців. Охоронці вийняли зброю. Натовп показував свої тупі інструменти поміж своїми рядами.\n"Гей, якщо ви хочете залишитися живими, не залишайтеся поруч із цією тиранією," — сказав один із членів натовпу охоронцям.\nЄкатерина спостерігала, як обличчя охоронців спочатку виразили сумнів, потім роздумували, а потім зрозуміли. Один за одним вони заправляли зброю і розчинялися в натовпі. "Це не особисте, шеф," — останній сказав їй, коли залишав її бік, "але мені треба годувати родину." Єкатерина уважно спостерігала за натовпом. Вона спробувала дістатися до пістолета, але раптово різкий біль пронизав її бік вище кобури. Роздався постріл в одну мить, і вона відчула, як тепло розливається по її тілу. Вона опустилася на одне коліно, притискаючи руку до рани. Вона б подивилася вгору через мить, але перед тим її вдарив сталевар, що тримав розкритий двометровий брус."
nf_loi.19.a:0 "§R...§!"

nf_loi.1002.t:0 "Народний вотум недовіри, Частина 2"
nf_loi.1002.d:0 "Мозок Єкатерини повільно повертався з межі. Вона не могла відкрити очі. Ледь застогнала і спробувала повернути голову вбік. Легкий тріск, коли вона доторкнулась до снігу, що покривав її. Далеко почулася якась шум, але вона не могла точно зрозуміти, що вони говорили. Нічого не рухалося. Лежати так спокійно було приємно, зрозуміла вона через мить. Потім подумала, чому вона так лежить, і згадала, що її поранили. Вона зачекала ще кілька секунд, а потім з усієї сили намагалася відкрити очі. Ліве око відчувалося як склеєне, але праве поволі відкрилося. І нічого, окрім білого. Голос здалеку знову покликав. "Катя!?" В його голосі був страх. Єкатерина знову застогнала — вона завжди ненавиділа це прізвисько. Почувши звук, вона розкрила рот і спробувала заговорити. Спочатку вирвався легкий булькання — вона проковтнула кілька півсухих крапель крові і слини та спробувала ще раз.\n"Тут, Нат." Фраза була ледь чутною, але одразу настала пауза, після якої пролунав терміновий звук кроків.\n"Боже мій, що з тобою... Я..."\n"Вони добре мене взяли." Ледь кашляючи, вона сказала: "Я буду жити." \nОбличчя Наталії стало ще білим, ніж під час радіопередачі. "Ти впевнена? Господи, вони тебе так... познущалися..." Наталія розглядала Командувача згори до низу.\n"Та погано, так?"\n"Так."\n"Добре." Єкатерина згорбилася, видаючи короткий сміх. "Мала б здогадатися. Здається, радіопередача була правдою?" Наталія кивнула сумно. "Звісно. Ей, допоможи мені дістатися до лікарні, і якщо ми це переживемо, я змушу їх заплатити за те, що вони зі мною зробили — з нами. Зрозуміла?"\n"Мм-hm." Наталія енергійно кивнула, прикриваючи рот рукою від жаху, продовжуючи дивитися на Єкатерину. Через деякий час вона схопила її за передпліччя і підняла. Різкі болі пронизали кожну кістку тіла Єкатерини, і вона ледь не закричала від зусиль, щоб змусити своє тіло діяти. Кілька сліпучо болючих моментів пройшло, поки вона зрозуміла, що рухається поряд з Наталією через паркувальний майданчик до її машини, що стояла в одному з далеких місць. Ніхто не спостерігав за їхнім повільним рухом. Коли вони дісталися до машини, Єкатерина побачила своє відображення у вкритих льодом вікнах і ледь не вирвало від огиди: ліва частина її обличчя була понівечена і порізана до шматків, а величезні синці покривали праву сторону. Після кількох моментів тиші вона дозволила Наталії допомогти їй сісти в машину."
nf_loi.1002.a:0 "§RЦей натовп за це заплатить.§!"

nf_loi.1003.t:0 "Після операції"
nf_loi.1003.d:0 "Очі Єкатерини почувалися... Ну, вона вирішила через кілька митей, що вони не відчувалися зовсім. Праве око було повільним, але ліве... Не тільки не хотіло відкриватися, вона зрозуміла, що воно не може відкритися. Що там відкривати? Вона помітила, що це страшна думка, і запитала себе чому. Операція. Звісно. Відсуваючи сонливість після знеболювального хірурга, вона піднялася до свідомості і зусиллям відкрила праве око. В роті був неприємний присмак. Вона відкрила рот і трохи потягла нижню щелепу — трошки боліло. Повернула голову і помітила, що Наталія спить у кріслі поруч з ліжком. Легко прокашлявшись, Наталія різко прокинулася. "Ну," — пробурмотіла Єкатерина, "схоже, я вижила." \nНаталія дивилася на Єкатерину в шоковому стані, повільна посмішка з'явилася на її обличчі. Вона витерла пару сліз з обличчя. "Я знала, що ти виживеш, Кате." \nЄкатерина спробувала засміятися — замість цього більше кашляла, ніж сміялася, але зміст був зрозумілий. "Треба буде тобі якось відплатити. Поширюючи це прізвисько всі ці роки. Боже..." Вона повільно похитала головою з боку в бік, намагаючись підняти її з подушки ліжка. Через мить вона відчула, як кров повертається до її рук, і сідає, підтримуючи себе на головній спинці ліжка. Червоний медсестра чекала терпляче в кутку, виглядаючи одночасно полегшеною і нервовою через пробудження Єкатерини. "Дзеркало?" Медсестра сором'язливо кивнула і принесла маленьке дзеркало до обличчя Єкатерини. Був момент вагання, поки Командувач осмислював зображення. Постійні шрами біля ока, один з яких переходив у губу, очевидно порожнє око — це виглядало неприємно, але можна було використати це для демонстрації, якщо буде потрібно завоювати повагу. "Могло бути й гірше," — промовила вона, ніжно гладячи шрами.\n"Ти була дуже щаслива, що пережила таке побиття," — прошепотила Наталія. "Я хвилювалася. Всі хвилювалися. І потім ти —"\n"Скільки часу пройшло з моменту нападу?" Єкатерина озирнулася в кімнаті в пошуках календаря. Годинник на далекій стіні показував пів на п’яту, але дат було не знайти.\n"Минуло цілих три місяці, Кате. Ти була в комі кілька тижнів після першої операції, і ти перебувала в стані між життям і смертю з того часу." \n"Боже." Єкатерина зітхнула. "Я все ще при владі?"\n"Так, але повстання танкістів стало гіршим. Багато людей гине через тебе, сподіваючись, що ти прокинешся і знову поведеш їх." \n"Здається, я повинна взяти кермо в руки. Забагато зрадників, яких треба приборкати." Вона вистрибнула з ліжка і побачила зірки, коли її голова запаморочилась на мить. Медсестра спробувала підтрима́ти її, але Єкатерина твердо тримала руку, не дозволяючи їй допомогти. "Немає часу на зволікання. Я трохи зупинюсь сьогодні, але є багато роботи. Лідія не померла, щоб бачити нас тут, що ж, спочиваємо. Вставай, Нат." З подругою на боці, Командувач вийшла з кімнати після операції в халаті."
nf_loi.1003.a:0 "§t"Це точно залишить слід."§!"

nf_loi.1004.t:0 "Туди і назад"
nf_loi.1004.d:0 "Єкатерина оглядала вигорілу оболонку того, що колись було найкращим танком у Спирі. Його захопили від капітана Купера, коли повстання танкістів почалося в самому серці колишньої революційної столиці Редмонда. Повстанці оголосили створення нової комуни — короткочасного утворення під назвою «Альбертерра», намагаючись одночасно жити за рахунок землі через напіванархічну соціальну систему, при цьому підтримуючи армію для того, щоб знищити єдиний фронт Єкатерини.\nВона нахилилася, щоб оглянути гусениці; осколки пробили їх настільки, що основне джерело руху танка навряд чи варте більше за брухт. Вона піднялася і вилазила на уламки.\nБуло вражаюче, як швидко Альбертерра розпалася після того, як їй дали більше кількох тижнів, щоб зрозуміти себе — з абсолютним відмовою від будь-якої форми влади, що підтримує центральний уряд, люди не знали, чим зайнятися. Провівши стільки часу, виконуючи накази того чи іншого Першого громадянина, люди Редмонда та навколишніх містечок були зовсім не готові до будь-якої свободи.\nЄкатерина залізла в танк і готувалася до різкого запаху, що чекав її всередині. Два обпечених тіла сиділи на рештках сидінь, що залишилися від операцій танка. Місця для боєприпасів не було, а те місце, де воно повинно було бути, мало велику вм'ятину на сталевому панцирі транспортного засобу.\nНездатність Альбертерри керувати призвела до майже миттєвого голодування — оскільки фермерам в навколишніх районах не були надані обов'язкові квоти для виконання, вони почали накопичувати ресурси для себе, щоб їсти краще та мати відчуття безпеки. Ланцюг постачання зламався, і вигнання з міста принесло лише хаос у сільській місцевості. Не минуло й багато часу, як навіть кілька ідеалістичних політиків комуни повинні були визнати невдачу своїх спроб — ті, хто міг би врятувати експеримент, подали у відставку зі соромом, а ті, хто не відчував сорому, утримали владу, щоб зберегти себе. Наприкінці експерименту Редмонд зустрів війська Єкатерини з відкритими обіймами й навіть не здригнувся, коли вона вимагала голови їхніх лідерів.\nБуло шкода, що стільки хороших танків загинуло в бою. Купер сумував би за своєю старою «машиною». Він був відомий у Спирі своєю увагою до технічного стану свого транспортного засобу, і це стало символом гордості для його покоління, що він тримав її в робочому стані. Хоча...\n"Ну," — пробурмотіла вона собі, вилазячи з обпеченого люка, "можливо, ми зможемо відремонтувати цей за допомогою запчастин. Куперу це сподобається." Вона посміхнулася цій ідеї — незвично примхлива для її розуму, визнавала вона, але це було б хорошим жестом за часом відданості."
nf_loi.1004.a:0 "§t"Сподіваюсь, ми всі щось винесли з цього."§!"