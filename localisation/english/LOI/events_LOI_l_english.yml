nf_loi.9.a:0 "§tОсь одну з них я збираюся виправити і досягти успіху там, де вони зазнали невдачі.§!"

nf_loi.10.t:0 "Забуте Сховище"
nf_loi.10.d:0 "Останнім часом я часто замислююся про сховище під Редмонтоном. Після першого відкриття ми швидко відправили команду, щоб прорвати двері бункера і забрати все, що можна. До мого розчарування, вони повернулися ні з чим, за винятком кількох шматків металобрухту, що були передані блукаючим торговцям. \n\nАле всередині порожніх залів, про що знали лише наші найстарші чиновники, залишався ще один термінал Старого Світу, який працює й досі. У його файлах зберігаються записи про десятки сховищ, які залишили шрами по всій Північній Америці. Більшість з них оснащені неприємними сюрпризами, будь то галюциногени, що постійно викидаються через вентиляційні отвори, навмисно несправні системи життєзабезпечення тощо. Мене не здивує, якщо в сховищі Редмонтона є ще більше, що можна знайти, лише заглибившись на поверхню - на добре чи погано. \n\nЧим довше ми залишаємо все без руху, тим більше відчуваю непокої. Я поговорю з Дуковим про створення невиразного фасаду, щоб відлякати шукачів пригод. Може бути, навіть станція для зберігання, або навіть заправна? "
nf_loi.10.a:0 "§tТим часом чоловіки можуть спокійно проводити польові випробування...§!"

nf_loi.11.t:0 "(Прочитати) Забуте Сховище"
nf_loi.11.d:0 "Останнім часом я часто замислююся про сховище під Редмонтоном. Після першого відкриття ми швидко відправили команду, щоб прорвати двері бункера і забрати все, що можна. До мого розчарування, вони повернулися ні з чим, за винятком кількох шматків металобрухту, що були передані блукаючим торговцям. \n\nАле всередині порожніх залів, про що знали лише наші найстарші чиновники, залишався ще один термінал Старого Світу, який працює й досі. У його файлах зберігаються записи про десятки сховищ, які залишили шрами по всій Північній Америці. Більшість з них оснащені неприємними сюрпризами, будь то галюциногени, що постійно викидаються через вентиляційні отвори, навмисно несправні системи життєзабезпечення тощо. Мене не здивує, якщо в сховищі Редмонтона є ще більше, що можна знайти, лише заглибившись на поверхню - на добре чи погано. \n\nЧим довше ми залишаємо все без руху, тим більше відчуваю непокої. Я поговорю з Дуковим про створення невиразного фасаду, щоб відлякати шукачів пригод. Може бути, навіть станція для зберігання, або навіть заправна? "
