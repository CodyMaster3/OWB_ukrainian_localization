  oro_bright_scholars_1:0 "Збалансовані Розуми"
  oro_bright_scholars_1_desc:0 "Ми прийняли свої страхи, інтегрували внутрішню тінь і здобули глибоке самопізнання. Це джерело сили — не лише для нас, а й для всіх, хто шукає стійкість у пітьмі."
