  oro_twin_moons_temple:0 "Храм Двох Місяців"
  oro_twin_moons_temple_desc:0 "Діана та Геката об’єдналися, щоб збудувати величний храм віри свого народу. Зведений із сяючої слонової кістки, він нагадує Парфенон давнього світу. Усередині — вишукані меблі, гобелени та фрески, що зображають історії та філософію Близнючих Матерів і Дочок Гекати."
  oro_planning_naval_operations:0 "Планування Морських Операцій"
  ORO_people_of_the_night:0 "Народ Ночі"
  ORO_people_of_the_night_desc:0 "Народ Уробороса звик до ночі. Вони не просто виживають — вони квітнуть у ній."
  ORO_raids_from_old_bones_oro:0 "Набіги зі Старих Кісток"
  ORO_raids_from_old_bones_oro_desc:0 "Старі Кістки роками нападали на землі Уробороса, крадучи цінний обсидіан, із якого збудовано більшість міста."
