ORO_destroy_abbey_compound_flavor_tt:0 "§gПси Гекати спустилися на Абатство Дороги в темряві ночі, їхній бойовий грим темний як небо, що клекотить бурею. Постріли й полум’я розірвали тишу обителі, вірні кричали молитви й прокльони, падаючи під невблаганним натиском обраних Уробороса. На світанку абатство лежало в руїнах — його стіни почорнілі, вівтарі повалені, а останні захисники зникли, лишивши по собі лише відлуння під пилом.§!"

