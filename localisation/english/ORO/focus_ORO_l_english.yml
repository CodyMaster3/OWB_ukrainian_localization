  oro_tailored_force_1:0 "Послідовники Темряви"
  oro_tailored_force_1_desc:0 "Ми навчилися гармонізувати світло й тінь, свідоме й несвідоме. Цей баланс дає нам ясність розуму, стійкість духу й внутрішню силу."
