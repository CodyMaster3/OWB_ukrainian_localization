  nf_oro_utah_tribals.8.a.tt:0 "З часом §YOuroboros§! навернув стільки нашого народу до віри в §PТемну Матір§!, що §Y[ROOT.GetLeader]§! утратив над ними вплив. Фактично, ми стали §Rмаріонеткою§! §YOuroboros§!.\n§gМи могли цьому запобігти, якби вклалися у контррозвідку через агентство.§!"
