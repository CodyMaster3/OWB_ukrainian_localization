#BOP Decisions
ORO_umbral_adytum_meditate_self:0 "Медитація над Собою"
ORO_umbral_adytum_meditate_self_desc:0 "Шлях не проходиться за одне життя, ані по одній стежці. Впасти на коліна в Темному Адитумі — означає зазирнути в істину: що в циклах буття ми формуємось і переформовуємось, вчимося й зростаємо. Приймаючи себе, опановуючи внутрішню темряву, ми наближаємось до еліксиру мудрості, який пропонує вічність.\n§Y$REPEATABLE$§!"

ORO_umbral_adytum_meditate_divinity:0 "Медитація над Божественним"
ORO_umbral_adytum_meditate_divinity_desc:0 "Воля Гекати тече крізь усе — безмежний і безперервний потік. Уроборос не має кінця, не вагається — це цикл, повернення, істина, вплетена у тканину буття. Ті, хто підкоряється Темній Матері, можуть вийти за межі кола, скинувши тягар особистості й осягнувши безмежне.\n§Y$REPEATABLE$§!"

ORO_umbral_adytum_meditate_legacy:0 "Медитація над Спадщиною"
ORO_umbral_adytum_meditate_legacy_desc:0 "Йти шляхом Уробороса — значить лишати слід, що переживе пил сьогодення. Цикл триває, але мудрі знають: їхні відлуння можуть пережити їх самих. Доньки вчать, що істинна апофеоза — це не втеча від кола, а створення незнищенного знаку в ньому — свідчення того, що навіть у вічному кругообігу дещо залишається.\n§Y$REPEATABLE$§!"

ORO_trade_with_rosebud_ruminators:0 "Торгівля з Роздумниками Роузбада"
ORO_trade_with_rosebud_ruminators_desc:0 "За землями Баронів, де північні шляхи стихають, лежить Роузбад — притулок роздумів та чернильної мудрості. Роздумники зібрали забуті томи минулих епох, зберігаючи те, що пустка прагне знищити. Торгівля з ними відкриє Уроборосу доступ до знань, які навіть час не зміг стерти."

ORO_go_for_another_hunt:0 "Скликати Полювання"
ORO_go_for_another_hunt_desc:0 "Гай Ніхтемерон шепоче про здобич, що ховається в тіні. Полювання випробує нашу силу й подарує нове розуміння дикої стежки.\n§Y$REPEATABLE$§!"
ORO_go_for_another_hunt_tt:0 "випадково дає Атаку, Логістику, Планування, Оборону або досвід для Командира."
ORO_find_nothing_tt:0 "нічого не знайдено."

ORO_museum_reward_requiem_zhou:0 "Давнє Знання: Реквієм Чжоу"
ORO_museum_reward_requiem_zhou_desc:0 "Жінка здобула Августовий Престол, вистеливши шлях до нього кров’ю тих, хто наважився заперечити її Мандат. Принци та міністри щезали, ніби туман на світанку, а їхні імена стиралися з літописів, поки в Пурпурному Талісмановому Дворі шепотіли про отруту й кинджали в тіні. Та під її правлінням імперія розквітла, Великі Зали Навчання процвітали, а буддійські сутри вирізали на камені. Аннали називають її одночасно Узурпаторкою Тан і Священною Матір’ю Чжоу — тиранія, що знищила старий порядок, чи володарка, яка перекувала згасаючу династію? Пензель може служити трону, але чорнило й пам’ять — не завжди однією рукою ведені."

ORO_museum_reward_lament_iceni:0 "Давнє Знання: Журба Іценів"
ORO_museum_reward_lament_iceni_desc:0 "З вогнем і люттю цариця повстала проти римського ярма. В ім’я своїх доньок, у пам’ять про топтаних побратимів, вона обернула силу імперії в попіл. Лондиній горів, Веруламій упав, вулиці заливала кров завойовників. Але імперію важко зламати — і коли хвиля повернулась, вона втопила її народ. Рим кличе її варваркою, жінкою, що не знала, коли схилитись. Її народ — мученицею, матір’ю, воїном-царицею, яка вела війну не за владу, а за справедливість. А історія? Вона не може визначитись."

ORO_new_outlook_lab_experiment_mutants:0 "Здобути Силу Мутантів"
ORO_new_outlook_lab_experiment_mutants_desc:0 "Пустка вкарбувала силу в тих, кого вона викривила. Їхня витривалість, міць, змінена плоть — це уроки, написані кістками й кров’ю. Якщо Темна Мати бажає піднестись над усім, то навіть таємниці мутантів мають стати її здобиччю.\n§Y$REPEATABLE$§!"

ORO_new_outlook_lab_invite_mutants:0 "Простягнути Руку Мутантам"
ORO_new_outlook_lab_invite_mutants_desc:0 "Під тінню презирства старого світу спотворені й відкинуті знайшли лише вигнання. Геката не бачить у них потвор — лише справжніх вцілілих у гніві пустки. Хай пройдуть вулицями Уробороса — не як вигнанці, а як рідня.\n§Y$REPEATABLE$§!"

ORO_dismantle_lab_steal_knowledge:0 "Викрасти Таємниці Переможених"
ORO_dismantle_lab_steal_knowledge_desc:0 "Переможені шепочуть свої обряди й давню мудрість, сподіваючись, що вітер понесе їх геть від нас. Але таємниці, раз захоплені, стають зброєю в руках гідних. Як Олександр штурмував Оракул за пророцтвом, так і ми візьмемо те, що дрібні душі ховають.\n§Y$REPEATABLE$§!"

ORO_dismantle_lab_invite_tribals:0 "Молитви в Ім’я Гекати"
ORO_dismantle_lab_invite_tribals_desc:0 "За мурами здіймаються голоси в благанні, звернені до богів, які вже не відповідають. Геката не вимагає від них поклоніння — вона запрошує побачити її силу. Нехай схиляться, нехай моляться — і знайдуть місце під покровом Темної Матері.\n§Y$REPEATABLE$§!"

# Events
nf_oro_history.1.t:0 "Темна Мати"
nf_oro_history.1.d:0 "Легіон прийшов як повінь — і Косоплети були змиті. Для Легіону це була ще одна перемога. Для неї — кінець усього. Її народ зник, її дім став попелом. Ті, хто вижили, розчинилися в рядах переможців. Але не вона.\n\nВона втекла.\n\nСпека поглинула її, втиснулася в шкіру, як тавро. Сонце пекло її плечі, обвуглювало губи, кип’ятило кров. Племена, до яких вона тікала, щоб знайти притулок, були не кращими. Їхні слова пекли, погляди — як багаття. Вони називали її проклятою. Дівою смерті. Темною Матір’ю. Відбиток Легіону був на ній, а прихистити її — означало накликати згубу. І тому її прогнали.\n\nЇхня зневага — вогонь. Пустка — вогонь. Її ненависть — вогонь.\n\nВін спалив її пам’ять. Голос батька, руки матері, запах вечері над племінним вогнищем — усе зотліло. Вона намагалася триматися, та полум’я поглинуло все. Косоплети, її рід, її життя. Вогонь забрав усе, крім одного.\n\nНенависті.\n\nЛегіон забрав усе. Племена її відкинули. Вона покаже їм усім.\n\nВона йшла, доки тіло не зрадило її. Доки не впала під палючим небом, поглинута пустелею."
nf_oro_history.1.a:0 "Вона підвела очі..."
nf_oro_history.1.tt:0 "Пустка поглинула її. Вона лежала на розпеченому піску, дихаючи уривчасто, сонце тиснуло на неї, як рука божества. Світ розмивався — між сном і реальністю.\n\nІ тоді вона побачила ЙОГО.\n\nПостать з диму, з томом у руках, сторінки — чорні, обгорілі, мов спалені часом. Голос порожній, як могили її роду:\n\n§R\"Темрява потойбіччя — все, що чекає на тебе. Нехай там знайдеш спокій, якого не знайшла тут.\"§!\n\nІ тінь простягла руку — забрати її. У могилу. В кінець.\n\nАле — інша рука.\n\nХолодна. Металева. Міцна.\n\nВона вирвала її з обіймів смерті. Сила потягла її назад — до нового шляху.\n\nВона задихалася, поверталася до життя. Пустка ще палила навколо. Сонце ще висіло над нею.\n\nВона повернула голову.\n\nПривид стояв — і дивився. Не йшов. Не переслідував.\n\nВін мав її обличчя.\n\nЇї очі — дивилися з порожнечі.\n\nВона обрала.\n\nВона більше не належала Смерті."

nf_oro_history.2.t:0 "Народження Богині"
nf_oro_history.2.d:0 "Вона прокинулась у раю.\nОзеро простягалося перед нею, серед незбагненної зелені. Дощ падав з неба. Повітря було важке від запаху землі та квітів. Звірі стежили з-за дерев — цікаві, не голодні.\n\nІ тоді — гул. Рівний, ритмічний, що пронизував повітря. Позаду — сяйво. Вона обернулась.\n\nПеред нею стояла жінка. Ні — дещо більше.\n\nВелична, сяюча. Обличчя — як місячна вода. Голос — як пісня:\n\n§B\"Я бачу, ти прокинулась.\"§! — лагідно, але всепоглинаюче. — §B\"Я — Діана. А як тебе звати?\"§!\n\nПорожнеча. Жодного імені. Лиш слова, якими її кликали:\n\n\"Темна Мати,\" — прошепотіла вона.\n\nДіана схилила голову. §B\"Так казали? Тоді я зватиму тебе Геката. Не заперечуєш?\"§!\n\n\"Геката...\" — відлунням у вустах. Чуже, але знайоме.\n\n§B\"Я — Діана, яскравий місяць. А ти — її тінь. Темна Мати.\"§!\n\nІм’я закарбувалось. §BСказане богом — мусить бути істинним.§!\n\nЇї минуле було попелом. Та тепер у неї було ім’я. Ім’я, пов’язане з божественним. З силою.\n\nДіана простягнула руку. §B\"Тепер ти в безпеці. Відпочинь. Я маю чому навчити тебе.\"§!"
nf_oro_history.2.a:0 "Так народилася Геката."
nf_oro_history.2.tt:0 "Діана, у своїй доброті, навчала її — трав, лікування, життя. Але Геката бачила інше.\n\nПід кожним уроком ховалась сила. І цю силу можна було формувати.\n\nОдного дня вона сказала: вона йде. Діана сумувала, та розуміла.\n\nІ Геката покинула рай — з забороненим знанням у руках. Але також із чимось іншим.\n\nІм’ям.\n\nДолею."

nf_oro_history.3.t:0 "Вірність Дея"
nf_oro_history.3.d:0 "Полуденне сонце палало, кидаючи довгі тіні на каркас Темної Піраміди. Пам’ятник лише починав рости — з металобрухту, балок і старих машин.\n\nГеката сиділа на паланкіні, в затінку шовкової завіси. Навколо — Доньки, в індиго, розписані сакральними візерунками. Вони тягли її через пил і каміння — з того самого дня, коли визнали її божественною.\n\nІз-за горизонту вийшли постаті — обгорілі, виснажені, але сповнені рішучості. Джордан Дей і його люди.\n\nДей пройшов вогонь і пустку, щоб дійти до неї. І, побачивши її, впав на коліна.\n\nВ його очах — впізнання. Благоговіння. Він уже бачив її — не в плоті, а в пророцтві.\n\n\"Я бачив тебе уві сні,\" — прошепотів він.\n\nГеката схилила голову. Його вірність була безмежною.\n\nДоньки чекали її слова. Піраміда здіймалась за ними, тінню майбутнього."
nf_oro_history.3.a:0 "Великий Змій добре провів тебе, Джордане Дей."

nf_oro_history.4.t:0 "Візит Послідовників Апокаліпсису"
nf_oro_history.4.d:0 "Зал був тьмяно освітлений, його стіни — шліфований метал, укріплений плитами. Один із перших завершених залів Темної Піраміди, святиня, що ще пахла гарячою сталлю й оливою. Браї з полум’ям відкидали тіні на підлогу.\n\nДоктор Адріан Беїр, вчений із Послідовників Апокаліпсису, стояв перед троном Гекати. Руки вільні, постава — стримана, але сповнена захвату. Він прийшов з дарами — знаннями, спостереженнями, розумом.\n\n\"Я просто вражений тим, що бачу тут! Цей розкішний інтер’єр, здоров’я вашого народу — ви навіть цінуєте гігієну! Ніколи не бачив племені настільки розвиненого.\nІ це ваше ставлення до історії! Те, як ви посилаєтесь на грецький пантеон —\" — він усміхнувся. — \"З цим іменем — Геката.\"\n\nПовітря згусло. Зала, щойно велична, наче стиснулася.\n\nГеката затримала подих.\n\nРаптовий біль. Пальці вчепилися в підлокітник трону. Світло від полум’я стало занадто яскравим, простір — спотвореним. У голові ревіла кров.\n\nВона була смертна.\n\nДоньки напружились, відчувши щось недобре. Одна простягла руку, зупинилась… Потім різко повернулась до Беїра. Він щось сказав. Щось небезпечне.\n\nПаніка спалахнула.\n\n\"Схопіть його!\" — вигукнула одна з Доньок.\n\nБеїр не опирався. На його обличчі — не страх, а здивування. Це була похвала. Що він сказав не так?\n\nГеката видихнула, хрипко, але голос її залишився сталевим:\n\n\"Так. Відведіть його до нижніх камер. Хай роздумає над своїми словами.\""
nf_oro_history.4.a:0 "Богиня більше не говорить про це."
nf_oro_history.4.tt:0 "Беїра повели геть. Навіть зникаючи у коридорах, його розум клекотів. Він прийшов дізнатись, побачити легендарний Уроборос.\n\nТепер у нього буде більше часу, ніж він очікував.\n\nЗгодом він зрозуміє. Згодом — навіть назве її подругою.\nАле тієї помилки він більше не повторить."

nf_oro_history.5.t:0 "Дива Її Створення"
nf_oro_history.5.d:0 "Минуло багато років. Більше, ніж вона рахувала.\n\nГеката стояла на вершині Темної Піраміди, дивлячись на свої володіння. Під холодним сяйвом місяця Уроборос виблискував — місто сталі та волі, створене за її задумом.\n\nВона бачила вулиці, повні життя. Гончі тренувались на подвір’ях. Доньки виконували священні обряди. Від стін до схованих святилищ — усе було її творінням.\n\nСинтетичний обсидіан, створений Адріаном, вкривав піраміду, поглинаючи місячне світло. Місто дихало тихою працею, а народ — із відданістю. Вони поклонялись їй. Боялись її. Любили її.\n\nГеката створила це. Із вигнання — святилище.\n\nАле щось гризло її.\n\nВона опустила погляд.\n\nРуки — більше не такі тверді. Лінії. Тремтіння. Правда, якої не сховати.\n\nВона стиснула кулак. Сумнівам тут не місце."
nf_oro_history.5.a:0 "Богиня не вагається."

nf_oro_history.6.t:0 "Тінь у Її Серці: Візит до Темного Адитону"
nf_oro_history.6.d:0 "Вода — нерухома. Зала — безмовна.\n\nВона плавала в темряві. Тут не було міста. Не було Уробороса. Не було Гекати.\n\nЛише Темна Мати.\n\nВона відчула присутність ще до голосу. Шепіт — як пісок крізь пальці.\n\n§R\"Ти знаєш, що не втечеш від мене.\"§!\n\nВона мовчала.\n\n§R\"Ти боїшся.\"§!\n\nРуки стиснулись. Вона не боялась. Вона —\n\n§R\"Ти помираєш.\"§!\n\nСлова — як ніж. Вона повільно видихнула.\n\nВона стала легендою. Богинею. Але була — плоть і кров. А плоть — крихка.\n\nТемна Мати засміялась.\n\n§R\"Що вони зроблять без тебе?\"§!\n\nВона відкрила очі. Вода колихнулась."
nf_oro_history.6.a:0 "§RГеката піднімається з безодні. Підтверджена.§!"
nf_oro_history.6.b:0 "§MГеката піднімається з безодні. Сумнівається.§!"
nf_oro_history.6.tt:0 "Геката прожила довге життя, і саморефлексія — основа її правління.\nВона бореться з тим, як поєднати світ, у якому вона — смертна, з тим, де вона — богиня, обрана для Легіонпаду й захисту дітей.\nВона визнає обидві істини.\n\n§gЦе відображено у її§! §YСтані Розуму§!.\n§gРізні варіанти та бонуси відкриватимуться залежно від її психічної рівноваги.§!"

nf_oro_ruminators.1.t:0 "Незручна Книга"
nf_oro_ruminators.1.d:0 "У своїх покоях на Темній Піраміді, Геката сиділа в холодному сяйві місяця, що відбивався від стін міста. Перед нею — книга \"Роздуми до Багатства\", принесена північним торговцем. Проста, пряма мудрість у ній була… збентежливою.\n\nВона викликала Джордана Дея. Дей був приголомшений. Як така досконала істота може не розуміти простого тексту? Людського тексту?\n\nКнига говорила про дрібні добрі справи, про радість від простого життя. Зовсім не те, до чого звикла Геката.\n\nІ вони почали клуб. Читали її разом. Шукали сенс у простому."
nf_oro_ruminators.1.a:0 "Чому це так складно?"

nf_oro_ruminators.2.t:0 "Відповіді — Ухильні"
nf_oro_ruminators.2.d:0 "Тижні потому. Геката — у роздумах. Книга перед нею, місто — за вікном. Вона зрозуміла: вона не знала, що таке щастя.\n\nЇї спогади — уламки скла. Раніше, до Легіону — все розмите. Лише гнів. Лише помста.\n\nДжордан Дей бачив це. Вона не могла оцінити своє творіння. І тому він, ризикуючи всім, сказав просту річ:\n\n\"А якщо ви просто відпочинете? Тут, у місті. Подивіться, що люди збудували. Можливо, це принесе вам мир.\""
nf_oro_ruminators.2.a:0 "\"...Ти бачиш сенс у такому плані?\""
nf_oro_ruminators.2.b:0 "\"Це безглуздо.\""

nf_oro_ruminators.3.t:0 "У Своєму Місті"
nf_oro_ruminators.3.d:0 "Зранку Геката вирушила втілювати свій задум. Вона виправдовувала його як праведний — щоби перемогти Легіон, вона мала стати більшим, ніж Легіон. Вона мала перевершити їх, піднестися вище за те, що вони зробили з нею. Змивши традиційний макіяж, вона рушила вулицями Уробороса як звичайна мешканка.\n\nПопри протести Гончих Гекати, вона залишила охорону. Без броні й прикрас, вона розчинилась серед вуличного життя. Вона пройшлась ринком, слухаючи метушню: колишні племінники та рейдери торгували своїм крамом. Вона спостерігала, як матері купували дітям іграшки — просту радість, якої вона ніколи не знала.\n\nВона провела час на арені, спостерігаючи тренування Гончих. Пізніше — відвідала спільні лазні, поділивши простір з іншими вперше.\n\nКоли день добігав кінця, і торговці верталися додому, вона підійшла до основи Темної Піраміди. Її погляд зупинився на мозаїці, зробленій при закладці фундаменту — змії, що поїдає свій хвіст. З роками Гончі й Доньки залишали тут квіти — вшанування загиблих, кого вони любили.\n\nНарешті, коли місто спочивало під теплим місячним сяйвом, Геката знайшла маленький дуб — вирощений із насіння з розсадника Діани. Вона сперлась на нього спиною, сіла на землю й відкрила примірник \"Роздумів до багатства\", що завжди носила з собою."
nf_oro_ruminators.3.a:0 "І вона продовжила читати."
oro_loved_the_book:0 "Закохана в Книгу"

nf_oro_white_legs.1.t:0 "Щодо Жорстокого Племені"
nf_oro_white_legs.1.d:0 "Геката сиділа за своїм оздобленим дорогоцінностями письмовим столом у покоях на вершині Темної Піраміди, пальці ковзали краєм звіту. Документ, наданий Джорданом Деєм, описував Білих Ніг — дикого, відчайдушного й жорстокого племені з Юти. Усі спроби Гончих чи Доньок Гекати встановити контакт зустрічали агресію.\n\nДей запропонував план: не взаємодіяти напряму, а навчати їх через дари, залишені стратегічно. Якщо вони не бажають говорити — може, слава про божественність Гекати, передана тонко, змусить їх замислитись.\n\nГеката обернулась у кріслі. Місячне світло грало на візерунках піраміди, поки вона роздумувала."
nf_oro_white_legs.1.a:0 "Дозволити плану здійснитися."
nf_oro_white_legs.1.b:0 "Заборонити. Вони нам не потрібні."

nf_oro_white_legs.2.t:0 "Пожертва Відьми"
nf_oro_white_legs.2.d:0 "Під час звичайного рейду один зі скаутів натрапив на щось несподіване: їжу, воду й зброю, залишену без нагляду. Цього вистачило б на тижні. Але те, як це було виставлено, викликало тривогу.\n\nНа стінах каньйону, біля дарів — великий малюнок піраміди, двох місяців і відьми, що панує над усім. Образ — похмурий і могутній. Деякі шамани змогли розтлумачити символіку: це — східні відьми, Геката й її послідовники.\n\nУ племені почались суперечки. Одні бачили дар як знак від божества, шанс здобути ласку. Інші — як пастку. Порушення табу. Дарунок незнаної сили.\n\nМи стояли перед муралом. Рішення розділило нас."
nf_oro_white_legs.2.a:0 "Прийняти дарунок від відьми"
nf_oro_white_legs.2.b:0 "Залишити. Це табу"

nf_oro_utah_tribals.1.t:0 "Пропозиція Темної Матері"
nf_oro_utah_tribals.1.d:0 "Серед ночі Донька Гекати з’явилась на краю табору. Її постать — мов привид під місячним світлом. Вона несла дари: їжу, ліки, зброю — скарби Темної Піраміди. Як тільки вона поклала їх перед племенем, напруга зависла в повітрі.\n\nПрийняти ці дари означало визнати Гекату богинею, а себе — її підданими. Це обіцяло силу й виживання, але ціною незалежності. Серед племені поширились шепіт, сумніви. Одні бачили шанс боротись із Легіоном. Інші — зраду своїм ідеалам.\n\nЛідери сперечались. Одні благали прийняти — заради сили. Інші остерігались. Донька мовчки стояла, очікуючи. Доля племені — на межі."
nf_oro_utah_tribals.1.a:0 "§PЖиття для Темної Матері!§!"
nf_oro_utah_tribals.1.b:0 "Відкинути дарунок!"
nf_oro_utah_tribals.1.a.tt:0 "§gМи приймаємо дарунок від Уробороса. Це дозволить їм продовжити дипломатію.§!\n§RКажуть, племена, які зближуються з Уроборосом, зрештою стають васалами богині.§!"
nf_oro_utah_tribals.1.a.dea.tt:0 "\n§RДонька також повідомляє: укріплення Мертвого Кінського Перешийка є критично важливим для Легіонпаду.\n\nЯкщо Уроборос вирішить зайняти його, нам компенсують втрату, але в союзі з ними — ми не зможемо їм завадити!§!"
nf_oro_utah_tribals.1.b.tt:0 "§RГекаті це не сподобається.§!"

nf_oro_utah_tribals.2.t:0 "Зустріч із [FROM.GetNameDef]"
nf_oro_utah_tribals.2.d.uin:0 "У затишній галявині під відкритим небом Донька Гекати зустрілася з вождем племені Юїнта. Плем’я нещодавно прийняло бога Зефіра — втілення трикстера Койота — й марило про політ у металевих птахах Старого Світу. Донька, з голосом лагідним, як літній вітерець, пообіцяла їм найвеличніші з цих давніх машин. Вона говорила про незаймані військові склади та забуті летовища, де ті птахи чекали пробудження. І коли їх пробудять — плем’я зможе літати над землею й сипати смерть на Легіон зверху.\n\nАле її слова сіли зерно розбрату. Деякі в Юїнта побачили в ній посланницю самого Зефіра, інші — загрозу, спокусу від богині, яка бажає змінити об’єкт віри племені. Врешті, принада неба перемогла: Юїнта прийняли дар."
nf_oro_utah_tribals.2.d.crz:0 "У серці табору Божевільних Рогів, серед вогнищ і сірчаних вівтарів, Донька Гекати зустрілася з ватажками племені. Вогонь і дим оповивали повітря, поки пірокультисти слухали. Вона обіцяла їм бачення, що пасувало їхній вірі: повне згоряння Легіону, великий вогонь, що поглине Аризону. Вона говорила про давню магію й артефакти, що втілять апокаліпсис у реальність. Дехто побачив у ній руйнівницю світу. Інші — узурпаторку, що хоче вкрасти славу їхнього Фенікса. Але фанатики здобули перевагу: вони повірили, що вона і є вісниця Палаючого Кінця.\n\nЗрештою, саме їхнє бачення взяло гору."
nf_oro_utah_tribals.2.d.dea:0 "На вершині Мертвого Кінського Плато плем’я Мертвих Коней зібралося вислухати посланницю Уробороса. Донька Гекати запропонувала союз: захист, силу й славу. Вона говорила про Гончих Гекати, союз, що гарантує їм владу, полювання, вплив на шляхи до Аризони. Але це викликало суперечки.\n\nОдна фракція виступила за союз із Легіоном — так слава прийде швидше. Інші ж побачили в Гекаті шлях до тривалої сили. Після палких дебатів плем’я вирішило, що вислухає Темну Матір — принаймні поки що."
nf_oro_utah_tribals.2.d.generic:0 "Гарні новини з [FROM.GetName] — Донька Гекати, що діє там, переконала плем’я прийняти наші дари. Можливо, з часом вони стануть нашими вірними васалами."
nf_oro_utah_tribals.2.a:0 "Усе йде за планом."

nf_oro_utah_tribals.3.t:0 "[FROM.GetName] Відкидає Наші Дари!"
nf_oro_utah_tribals.3.d:0 "Доньки Гекати, що подорожували на захід до [FROM.GetName], були вигнані! Схоже, їхні серця не мають любові до Темної Матері."
nf_oro_utah_tribals.3.a:0 "Жаль."

nf_oro_utah_tribals.4.t:0 "Рейди Божевільних Рогів"
nf_oro_utah_tribals.4.d:0 "Після завоювання земель Легіону, плем’я Божевільних Рогів вирішило здійснити апокаліпсис: вони спалили сховища зброї, храми, поселення — все, що траплялося на шляху. Палаюча Аризона, за їхніми віруваннями, була початком кінця. Це ускладнило окупацію, породило невдоволення серед мешканців і зменшило авторитет Гекати. Земля горіла, а стабільність — зникала."
nf_oro_utah_tribals.4.a:0 "Хай горять."
nf_oro_utah_tribals.4.b:0 "Спробуйте зупинити вогонь."

nf_oro_utah_tribals.5.t:0 "Рейди Юїнта"
nf_oro_utah_tribals.5.d:0 "В одержимості ідеєю «Металевих Птахів» Юїнта почали грабунки: розбирали все навколо на матеріали, розтягли ресурси Аризони. Злітно-посадкові смуги були знесені, а біженці Легіону — залишені без ресурсів для відбудови. Втрати були великі, а роздратування серед місцевих росло."
nf_oro_utah_tribals.5.a:0 "Нехай тримають."
nf_oro_utah_tribals.5.b:0 "Зупинити рейди!"

nf_oro_utah_tribals.6.t:0 "Рейди Мертвих Коней"
nf_oro_utah_tribals.6.d:0 "Мертві Коні, підсилені союзом із Уроборосом, почали обшуки складів Легіону. Часто вони випереджали Гончих, забираючи зброю раніше за них. Це розлютило місцеве населення й ускладнило наші плани. Жителі бачили в цьому ознаку слабкості влади Гекати."
nf_oro_utah_tribals.6.a:0 "Краще в їхніх руках, ніж у руках ворога."
nf_oro_utah_tribals.6.b:0 "Ви тільки шкодите справі!"

nf_oro_utah_tribals.7.t:0 "Зайняття Плато Мертвого Коня"
nf_oro_utah_tribals.7.d:0 "Після вступу до Пакту Темного Місяця Мертві Коні вирушили на південь, залишаючи своє улюблене Плато Мертвого Коня, щоби Уроборос міг укріпити його перед неминучою війною з Легіоном. Вони йшли з важкими серцями — багато хто оплакував втрату прадавньої домівки. Вони знали: така ціна союзу з Темною Матір. І все ж, крізь сум проростала надія — можливість почати з чистого аркуша. Щедра компенсація з боку Уробороса полегшила перехід, даруючи ресурси для нового життя в невідомих землях."
nf_oro_utah_tribals.7.a:0 "Прощавай, Плато Мертвого Коня..."

nf_oro_utah_tribals.8.t:0 "Обійми Темної Матері"
nf_oro_utah_tribals.8.d:0 "З роками шепіт Доньок Гекати поступово роз'їдав віру [ROOT.GetNameDef] у старі звичаї. Тепер у племені панує культ Темної Матері. Ритуали змінились, тотеми замінено зміїними символами, а молитви звертаються до благословення Гекати. [ROOT.GetLeader], колись охоронець давніх традицій, тепер не може зробити кроку без схвалення жриць. Їхній контроль — повний. Їхня милість — обов’язкова."
nf_oro_utah_tribals.8.a:0 "Життя під Темним Місяцем."

nf_oro_utah_tribals.9.t:0 "Покора [FROM.GetNameDef]"
nf_oro_utah_tribals.9.d:0 "Колись горде й незалежне [FROM.GetName] повністю впало під вплив Доньок Гекати. Їхня віра в Темну Матір — тепер абсолютна. [FROM.GetLeader] — лише маріонетка, прикута до вірувань, які колись намагалася стримати. Кожен указ проходить крізь сито жриць, кожен крок — під їхнім наглядом. Будь-яка спроба повернути старі порядки зустрічається з підозрою та опором."
nf_oro_utah_tribals.9.a:0 "Вони пізнали моє милосердя."

nf_oro_news.1.t:0 "Формування Пакту Темного Місяця"
nf_oro_news.1.d:0 "У серці вигинів ріки Колорадо, Уроборос уклав Пакт Темного Місяця — коаліцію племен, об'єднаних проти наступу Легіону. Союз обіцяв взаємний захист і спільне укріплення територій. Та не всі племена раділи: подейкують, що під личиною захисту Геката лише зміцнює свою владу над ними."
nf_oro_news.1.a.legion:0 "Малозначущий клопіт"
nf_oro_news.1.a.ttm:0 "§M«Сподіваюсь, у неї все гаразд.»§!"
nf_oro_news.1.a.hecate:0 "Слава Темній Матері!"
nf_oro_news.1.a.generic:0 "Баланс сил змінюється..."

nf_oro_eag.1.t:0 "Угода з Уроборосом?"
nf_oro_eag.1.d:0 "Неочікувано до нас прибули рясно вбрані посланці Гекати. Вони запропонували захист від ворогів — в обмін на частину наших ресурсів."
nf_oro_eag.1.a:0 "Мир звучить непогано"
nf_oro_eag.1.b:0 "До біса їх!"

nf_oro_eag.2.t:0 "Ігл-Рок Погодився"
nf_oro_eag.2.d:0 "Наш посол повернувся з багатствами гір."
nf_oro_eag.2.a:0 "Превосходно"

nf_oro_eag.3.t:0 "Ігл-Рок Відмовляє"
nf_oro_eag.3.d:0 "Цього ніколи й не мало статись. З колоністами завжди так — вони ніколи не відчують обіймів Гекати."
nf_oro_eag.3.a:0 "Що ж, надсилайте бойові загони."

nf_oro_burham_springs.1.t:0 "Історії Старих Кісток"
nf_oro_burham_springs.1.d:0 "Коли наші гончі пройшли землями племені Старих Кісток, деякі полонені розповіли про таємне місце. Вони сподівалися його захистити — щоби стримати зло й вберегти пустку від жахіть, що там укриті."
nf_oro_burham_springs.1.a:0 "Можливо, ми зможемо використати це місце проти Легіону..."

nf_oro_burham_springs.2.t:0 "Агонія Геєнн"
nf_oro_burham_springs.2.d:0 "Після часткового очищення шахти в Бурхам-Спрінгс, Геката отримала тривожну звістку. Гончі зіткнулися з істотами з чорної смоли та блискучої нафти — покрученими формами, що страждали й палали. Їхні очі світились помаранчевим, а з вуст рвалися лише зойки болю. Вони розчинялись у диму й гидоті після смерті. Ім’я їм — Геєнни. Мерзенні, смертоносні, мучені вічно.\n\nГеката мала зробити вибір: знищити їх із милості, спробувати вилікувати... чи використати на передовій."
nf_oro_burham_springs.2.a:0 "Даруймо їм милосердну смерть."
nf_oro_burham_springs.2.b:0 "Спробуймо вилікувати їх."
nf_oro_burham_springs.2.b.tt:0 "§gМи доручимо лікування Геєнн доктору Бейру, послідовнику Апокаліпсису, який давно прибув до наших земель. Це займе деякий час.§!"
nf_oro_burham_springs.2.c:0 "Поневолити їх для війни."
nf_oro_burham_springs.2.c.tt:0 "Група рабовласників прибуває, ведучи поневолених Геєнн у бій!"

nf_oro_burham_springs.3.t:0 "Багатство Джерел"
nf_oro_burham_springs.3.d:0 "Завдяки численним зусиллям нам вдалося стримати й нейтралізувати загрози в шахтах Бурхам-Спрінгс. На самій глибині наші дослідники виявили щось несподіване — лабораторію. Вона належала малій компанії під назвою 'AGRICOLA', яка співпрацювала з гірничим консорціумом Alton Bourges, аби створити тут дослідницький центр. Метою було вивчення рідкісної жили ультрациту, виявленої під час розкопок.\n\nБільшість покладів ультрациту знаходиться в Апалачах, тому це відкриття поза регіоном є надзвичайно рідкісним і цінним. AGRICOLA, хоч і невелика, отримала контракт на дослідження цієї жили. Згідно з нотатками лаборантів, ультрацит має унікальні властивості, які й стали об'єктом їхніх експериментів. Його присутність, імовірно, пояснює небезпечні та дивні явища в регіоні, а також легенди про Бурхам-Спрінгс."
nf_oro_burham_springs.3.a:0 "Яка знахідка!"

nf_oro_burham_springs.4.t:0 "Стан Геєнн"
nf_oro_burham_springs.4.d:0 "Протягом років геєнн, знайдених у палаючих шахтах Бурхам-Спрінгс, лікували під наглядом доктора Едріана Бейра. Першим кроком було полегшення їхнього болю — спершу їм давали Med-X щогодини, але з часом дозу довелося підвищити. Нарешті, Бейр знайшов радикальне рішення: невелика операція, що повністю вимикала в них відчуття болю.\n\nДругий крок — визначити, чи є геєнни розумними. Хоча вони могли лише гарчати, деякі відповідали на жести й звуки, а декотрі навіть вміли читати та вказувати на об’єкти. Це підтвердило гіпотезу, що колись вони були людьми.\n\nНещодавно мала група геєнн, очолена Бейром, що виконує роль перекладача, присягнула на вірність Гекаті. Вони вдячні за кінець своїх страждань. Хоча дехто сумнівається, чи дійсно він їх розуміє, ця подія відкрила нову главу в стосунках між Уроборосом і цими стражденними істотами."
nf_oro_burham_springs.4.a:0 "Я не безжальна."
nf_oro_burham_springs.4.a.tt:0 "Група провідників і їх союзники-геєнни прибувають до бою!"

nf_oro_dae.1.t:0 "Виклик від Дея"
nf_oro_dae.1.d:0 "Рішення Гекати витрачати ресурси та надсилати війська в Бурхам-Спрінгс стало останньою краплею для Джордана Дея, очільника Гончих Гекати. У приступі люті він викликав її на двобій за лідерство. Якщо вона дійсно богиня — перемога не має бути складною, так?\n\nАле Геката вже не така молода. Замість чесного бою, вона звернулась до дружини Дея — Івани. Вранці, коли Івана готує чоловікові сніданок перед двобоєм, Геката просить — отруїти страву. Івана стоїть перед вибором: підтримати коханого чи богиню."
nf_oro_dae.1.a:0 "§p'Місяць сходить, моя богине.'§!"
nf_oro_dae.1.b:0 "§p'Місяць заходить, коханий.'§!"
kill_dae:0 "§gІвана отруює сніданок Дея, забезпечивши перемогу Гекати.§!"
kill_hecate:0 "§gІвана отруює клинок Дея — Геката загине під час дуелі.§!"

nf_oro_dae.2.t:0 "Підсумок Двобою"
nf_oro_dae.2.d.h:0 "Дей загинув! Божественність Гекати доведена. Покликавши богиню на поєдинок, він пізнав її волю. Геката починає глибше інтегрувати Гончих у культуру Уробороса — щоби всі визнавали її святість, як належить."
nf_oro_dae.2.d.j:0 "Геката впала! Виявилось, вона не богиня. Джордан убив її на очах усього міста. Він та Івана тепер правителі Уробороса — нова доба для боговтраченого міста."
nf_oro_dae.2.a:0 "Все завершено."

nf_oro_ind.1.t:0 "Укріплення Північного Берега"
nf_oro_ind.1.d:0 "Геката спостерігала з паланкіна, як унизу кипіла робота. Джордан Дей керував зведенням укріплень уздовж північного берега річки Колорадо. Величні шпилі з металу й обсидіану підіймались до неба — символ сили та візії Гекати. Їхні тіні лягали на річку, як попередження всім, хто посміє кинути виклик її владі."
nf_oro_ind.1.a:0 "Готово."

# Ланцюг подій полювання! Просто приємна атмосферна історія.
nf_oro_hunting.1.t:0 "Підготовка до Полювання"
nf_oro_hunting.1.d:0 "У покоях стояла тиша, повітря було важке від запаху натертого каменю й ладану. Геката стояла перед довгим обсидіановим столом, поверхня якого вловлювала бліде світло, що пробивалося крізь вузькі вікна високо над головою. На столі лежали три луки, кожен обережно покладений її Гончими — як дарунок, а може, як знак поваги. Перший був зроблений Твін Мазерс, світле дерево з витонченим різьбленням півмісяців і річок. Натягнута тятива, ідеальний баланс — зброя й витвір мистецтва.\n\nДругий лук був грубим, але міцним — створений мозолястими руками одного з Гончих. Руків’я обгорнуте старою шкірою, плечі укріплені металевими пластинами. Він говорив про виживання, а не красу. Третій — витвір Адріана Бейра, її історика. Механічний, з точністю передвоєнної зброї, з блоковою системою. Без душі, але сповнений інженерної досконалості.\n\nГеката торкнулась кожного з луків. Кожен розповідав свою історію: традиція, виживання, інтелект. Вона затрималась на луці Адріана, а потім, зітхнувши, відвернулася. Її відображення на темній поверхні — лиш тінь богині Темного Місяця, на мить застигле перед зникненням."
nf_oro_hunting.1.a:0 "§PЛук Твін Мазерс підійде.§!"
nf_oro_hunting.1.b:0 "§PЛук Гончих буде достатнім.§!"
nf_oro_hunting.1.c:0 "§PЯ завжди цінувала творіння Адріана.§!"

nf_oro_hunting.2.t:0 "Бурштин під Місяцем"
nf_oro_hunting.2.d:0 "Гай Ніхтемерон розкинувся перед Гекатою, залитий блідим сяйвом місяця й світлом ліхтарів, що коливалися на вітрі. Його створили Дочки Гекати, посадивши перше насіння десятки років тому — принесене з самого Розсадника Діани. Обмежені ресурсами, вони схрещували рослини післявоєнної стійкості з передвоєнною красою. Сильні, але вродливі — життя, що виживає навіть на отруєній землі.\n\nЛистя над головою світилося бурштиновим світлом — вічна осінь, створена сплутаними сезонами Пустки. Дерева несли сліди поколінь турботи, а повітря пахло вологою землею й тонким квітковим ароматом. Удалині заспівав олень із Розсадника — глухий, порожній звук, принесений вітром.\n\nГеката зупинилась, торкнувшись шорсткої кори дерева, старшого за багатьох її послідовників. Місце було молодим, але відчувалось вічним. Святилище не випадкове — а зрощене з віри та терпіння. Вона на мить заплющила очі, вдихаючи тишу, а потім усміхнулась і ступила глибше у гай, її тінь зникла серед бурштину та темряви."
nf_oro_hunting.2.a:0 "§PЖиття проростає там, де працюють вірні.§!"

nf_oro_hunting.3.t:0 "Полювання під Бурштиновим Гіллям"
nf_oro_hunting.3.d:0 "Це почалося з тріпотіння — пляма білого й коричневого серед листя. Геката завмерла, її очі звузилися. Олень пасся на галявині, напружений, насторожений. Вони обоє застигли. Потім Геката рушила, обережно, без жодного звуку.\n\nПолювання тривало годинами, через хащі та вузькі струмки. Олень був мов тінь, що ковзає між гіллям. Геката йшла за ним, дихаючи рівно, зосереджено. Це не була гра — це було давнє, первісне. Увесь світ звузився до шелесту листя, мерехтіння хутра та ритму серця.\n\nНарешті, момент настав. Олень завмер у вузькій галявині. Геката підняла обраний лук і випустила стрілу. Тятива дзенькнула — і знову тиша. Олень упав. Вона підійшла повільно, спокійно. Схилившись над здобиччю, вона відчула дивний спокій. Мить — і згадка: уривок з життя до Піраміди, до Уробороса, навіть до Розсадника. Теплий, крихкий спогад… і він зник."
nf_oro_hunting.3.a:0 "§PНа мить я була...§! §pпросто собою.§!"

# Навчальний івент
oro_if_we_have_radio_tech:0 "§gЯкщо у нас є технологія «Радіо» з вкладки Інженерії — нагорода буде утричі більшою!§!"
oro_spreading_the_word.tt:0 "\nВідкриває рішення щодо розповсюдження звісток про звірства Легіону Пусткою. Це погіршить ставлення інших країн до Легіону!"

nf_oro_ind.2.t:0 "Мрії про Падіння Легіону"
nf_oro_ind.2.d:0 "Пророцтво «Падіння Легіону» — центральне у серцях Уробороса. Кажуть, що настане день, коли Геката відріже голову Цезарю біля Темної Піраміди. Але окупація Аризони — справа важка. Гончі пропонують три плани:\n\nПерший — взяти Дед Хорс Пойнт і використати як плацдарм для переходу річки Колорадо. Це вимагатиме розгрому укріплень Легіону.\n\nДругий — озброїти торговий флот і висадитись ближче до Флагстаффа. Це ризиковано, але дозволяє швидко вдарити в серце ворога.\n\nТретій — пройти через гірський перевал Меса-Верде. Це короткий шлях до столиці навахо, але складний логістично й небезпечний у разі контратаки."
nf_oro_ind.2.1:0 "Дед Хорс Пойнт буде нашим плацдармом!"
nf_oro_ind.2.1.tt:0 "§gПорада: дослідіть технології морської висадки (вкладка ВМС), щоби підвищити ефективність армії при переході річки. Якщо ми контролюємо Колорадо, використовуйте місію підтримки висадки для бонусів.§!"

nf_oro_ind.2.2:0 "Флот доставить нас до Флагстаффа!"
nf_oro_ind.2.2.tt:0 "§gПорада: інвестуйте в доктрину флоту (Офіцерський корпус) і дослідіть модулі кораблів. Найкраще — атакувати, коли Легіон воює з НКР.§!"

nf_oro_ind.2.3:0 "Ми перетнемо Скелясті гори, як Ганнібал Альпи!"
nf_oro_ind.2.3.tt:0 "§gПорада: після захоплення Меса-Верде укріпіть його. Вузький перевал може стати пасткою!§!"

nf_oro_ind.2.4:0 "Я знайду інший шлях!"
#Event to open up arms trade
nf_oro_ind.3.t:0 "Темна Угода"
nf_oro_ind.3.d:0 "Опівночі, коли вітер нашіптував свої таємниці в такт далеким виттям пустки, в світло факелів ступила постать у плащі. Донька Гекати, одна з вуальованих сестер Пустки, кинула на нас тінь. Вона мовила словами, солодкими як мед і отруйними як жало: темна угода — зброя їхнього виробництва, потужна та безжальна, в обмін на скромну данину їжі та припасів."
nf_oro_ind.3.a:0 "Іншими словами, вони хочуть торгувати зброєю?"
nf_oro_ind.3.b:0 "Нам не варто зв’язуватись із ними."

nf_oro_ind.4.t:0 "Ніч у Музеї"
nf_oro_ind.4.d:0 "Моторошна тиша огорнула Гекату, коли вона ступила в розлогу залу покинутого військового форпосту — виявилося, це був музей на честь воїнів якоїсь давно забутої імперії. Тьмяне, миготливе світло кидало довгі тіні на артефакти зниклого світу — потужні реліквії, покинуті в цій гробниці історії. Гончі очистили територію, але тиша була обтяжена — це був тягар забутих спадків.\n\nГеката йшла коридорами, її кроки лунали на холодному кам’яному покритті. \n\nУ темряві височіли Іронклади — залізні велетні з іржавими корпусами, що вели річкові битви. Вона уявила їх відродженими: з синтетичними матеріалами Уробороса й зарядженими її магією, готовими знову панувати над водами.\n\nПоблизу — їжаки (чеські їжаки) — прості, але геніальні барикади. Вони ідеально підійдуть для укріплення берегів Колорадо, особливо з містичними рунами.\n\nУ темному кутку — експозиція вторгнення на Анкоридж. Там показано Гаус-гармати — зброю, що використовує електромагнітну силу для нищівного удару. Хоч зламані, вони все ще гули залишковою енергією — свідчення могутності старої науки."
nf_oro_ind.4.a:0 "Ці кораблі знову борознитимуть води!"
nf_oro_ind.4.b:0 "З такими укріпленнями Легіон нас не знищить."
nf_oro_ind.4.c:0 "Уяви, що ця зброя може зробити!"

nf_oro_ind.5.t:0 "Обличчя Відображення"
nf_oro_ind.5.d:0 "Музейна тиша окутала Гекату, коли вона блукала тьмяно освітленими залами, її кроки приглушувала вага минулого. Вона зупинилася перед стародавньою статуєю — Геката К'ярамонті, старосвітським шануванням богині з її іменем. Відома своєю трьохликою формою, статуя була шедевром — кожне обличчя втілювало інший аспект природи богині.\n\nПодих Гекати перехопило. Мармурові обличчя, спокійні й непохитні, здавались живими. Тіні від світла рухались, і статуя ніби дихала. Вона провела пальцями по напису: «Геката». Її ім’я — її справжнє ім’я — вирізьблене в камені. Зв'язок був незаперечним. Але замість радості прийшло щось інше: тяжкість, тривога, щось надто знайоме і водночас чуже.\n\n§R«НІЧОГО не є справжнім»§! — промайнула думка, мов зловмисник. Статуї дивилися на неї з презирством, і цей погляд залишив її без подиху."
nf_oro_ind.5.a:0 "У гніві вона знищила її."
nf_oro_ind.5.b:0 "У роздумах вона забрала її додому."
nf_oro_ind.5.c:0 "В смиренні вона залишила її там."

nf_oro_ind.6.t:0 "Кроки крізь Руїни"
nf_oro_ind.6.d:0 "Кроки Гекати луною відбивалися крізь лісові хащі, кожен хрускіт гілок різав тишу. Супроводжувана двома Гончими, вона рухалася впевнено, її очі вдивлялися в дорогу попереду. Навколо лежали тіла воїнів Чорного Каньйону — ліс був насичений жахом, що тут відбувся. Вижилі втекли, лишивши за собою страх і тіні.\n\nВ покинутому поселенні стояли зношені фасади будівель. Геката відчувала спротив поселенців, їхнє чіпляння за старе життя, за уламки передвоєнної цивілізації. Її місія — дати їм нову мету, але ця мета зустрічала опір.\n\nЇї думки повернулися до місцевого урядування. «Зібрання», щось на кшталт парламенту, дозволяло тримати мир, але було слабким у владі. Ідея відродити Зібрання — вже під її опікою — проросла в її розумі. Можливо, через це знайоме поселенці приймуть її. Вона дасть їм голос… і приведе до нового майбутнього."
nf_oro_ind.6.a:0 "Даруй їм спокій — і вони віддадуть довіру."
nf_oro_ind.6.b:0 "Вони не варті її милості."

nf_oro_ind.7.t:0 "Термінове прохання"
nf_oro_ind.7.d:0 "Квапливі кроки Адріана Бейра лунали залами, коли він наближався до покоїв Гекати. Вартові біля великих дверей кивнули йому та дали пройти. Його візити сюди були звичними, але цього разу в ньому відчувалася невідкладність. Усередині Геката стояла біля вікна, її погляд заглиблений у місто, думки — обтяжені мовчазними тягарями.\n\nВін заговорив швидко, згадуючи про «MIT», проривні дослідження доктора Стоуна та технологічні дива забутого світу. Геката слухала, її вираз змінювався від зацікавлення до здивування — терміни були незнайомі, надто складні.\n\nПомітивши її замішання, Адріан зітхнув і мовив:\n\n«Мені потрібно відвідати Купол Боулдера.»\n\nУ кімнаті настала тиша. Геката відвела погляд від вікна, зважуючи його щирість, потенціал подорожі і довіру, яку він просив."
nf_oro_ind.7.a:0 "Він може… але з охороною."
nf_oro_ind.7.b:0 "Залишитись? Він мені потрібен тут."

nf_oro_ind.8.t:0 "Повернення Адріана"
nf_oro_ind.8.d:0 "Адріан Бейр повернувся з Купола Боулдера, вгамувавши свою жагу до знань. Його розум палав новими відкриттями. За ним — караван торговців із нав’юченими брамінами, що тягнули ящики з книгами та документами. Кожна скриня містила обіцянку забутих передвоєнних знань, ретельно врятованих із глибин Купола."
nf_oro_ind.8.a:0 "Добре, що ти повернувся."

nf_oro_yvana.1.t:0 "Спостереження за уроком Івани"
nf_oro_yvana.1.d:0 "Геката блукала коридорами Темної Піраміди, її кроки лунали по блискучій обсидіановій підлозі. Піднявшись на одну з оглядових галерей, вона зупинилась — нижче проходив урок. Місячне світло крізь скляні отвори заливало внутрішній храм, освітлюючи сувої, що звисали з високої стелі.\n\nСвічки м’яко блимали, їхнє полум’я змішувалося зі сріблом ночі. Внизу зібралась зацікавлена група. Сестри Уробороса схилилися вперед, ловлячи кожне слово Івани. Вона стояла в центрі, її присутність — врівноважена, впевнена, але тепла.\n\nГеката давно не слухала викладень своїх сестер. Іванин голос наповнював простір, поєднуючи її власне вчення з щирою вірою. Атмосфера дзвеніла жагою до знань і шануванням до Темної Матері.\n\nГеката відчула потяг — бажання стати ближчою до свого народу, хоча б ненадовго."
nf_oro_yvana.1.a:0 "Послухати не завадить."
nf_oro_yvana.1.b:0 "Мені ніколи."

nf_oro_ttm.1.t:0 "Визнання божественності Діани"
nf_oro_ttm.1.d:0 "Плем’я Близнючих Матерів, віддане богині Діані, нещодавно перемістилось на північ, шукаючи притулку після поразки від Легіону Цезаря. Їх прибуття збурило занепокоєння в Уроборосі. Деякі вважають, що їх слід навернути до поклоніння Гекаті.\n\nАле Геката відчуває глибоку повагу до Близнючих Матерів. Хоч її саму вшановують як богиню, її божественність була дарована Діаною. Примушувати їх до зміни віри — означало б зрадити ту, що піднесла її."
nf_oro_ttm.1.a:0 "Дві богині, дві ролі"
nf_oro_ttm.1.a.tt:0 "§gДоньки Гекати поширюють ідею, що Діана і Геката виконують різні, але рівноцінні ролі. Близнючим Матерям пропонують дізнатися про Темну Матір, не відмовляючись від Діани.§!"
nf_oro_ttm.1.b:0 "Два боки Діани"
nf_oro_ttm.1.b.tt:0 "§gПоширюється ідея, що Геката — тінь Діани. Не ворог, а необхідна протилежність.§!"
nf_oro_ttm.1.c:0 "Одна. Богиня."
nf_oro_ttm.1.c.tt:0 "§gДоньки Гекати навіюють страх: тільки Геката здатна захистити. Лише її влада справжня. Близнючим Матерям слід скоритися, інакше — втратять повагу інших.§!"

nf_oro_ttm.2.t:0 "Повернення до Раї"
nf_oro_ttm.2.d:0 "Геката повернулась до Розсадника — місця, де вперше зустріла Діану. Спокійне озеро та зелень залишились незмінними, різко контрастуючи з бурею в її душі. Голос Діани, м’який і всеосяжний, пролунала ніби з повітря.\n\nСпостерігаючи за незламним виглядом Гекати та вогнем у її очах, Діана відчула жаль. Вона запропонувала Гекаті залишитись — знайти спокій подалі від битв і темряви.\n\nАле Геката відмовилась. Її шлях не завершено. Вона ще не виграла війну. Тож вона пішла назад — у тінь, несучи слова Діани у своєму серці."
nf_oro_ttm.2.a:0 "Мені ще треба виграти війну."

nf_oro_ttm.3.t:0 "Повернення до Раї"
nf_oro_ttm.3.d:0 "Геката знову прийшла до Розсадника, де колись зустріла Діану. Озеро й дерева залишились такими самими — спокійними, вічними. Діана звернулася до неї з гордістю, згадуючи ту першу зустріч — коли перед нею стояла зламана, помстою одержима жінка. Тепер перед нею стояла мудра правителька.\n\nДіана, задоволена її зміною, дарує Гекаті том — вибраний із її древніх бібліотек. Разом з цим — знову пропонує прихисток. Місце, де Геката зможе знайти спокій, коли її місія завершиться.\n\nЦього разу Геката замислилася. Вона знала — колись вона повернеться сюди. Але не сьогодні."
nf_oro_ttm.3.a:0 "Колись я заслужу Рай."

nf_oro_ttm.4.t:0 "Створення каналу зв’язку"
nf_oro_ttm.4.d:0 "Завдяки ретельному плануванню та спільним зусиллям Доньок і Гончих Гекати вдалося з’єднати енергосистеми Уробороса та Розсадника. Розсадник, маючи майже необмежені запаси енергії, необхідні для створення G.E.C.K., міг легко передавати невелику кількість електрики Уроборосу.\n\nКоли перша хвиля енергії пішла новозбудованими кабелями, по місту почали спалахувати ліхтарі. Уроборос був спроектований так, щоб максимально використовувати природне освітлення — відбивальні лінзи у домівках підсилювали світло місяця, дозволяючи працювати вночі. Але ця система не працювала, коли небо затягувалося хмарами. Вперше вулиці міста залилися м’яким, постійним світлом від «Божих вогнів». Цей бурштиновий штучний світ, який жителі вважають даром Діани, став символом безпеки та поступу.\n\nБожі вогні зігрівали темні ночі, їхнє світло стало уособленням надії й єдності. Діти гралися під ним, торговці продовжували роботу, родини збиралися вечорами. Це світло змінило не лише вигляд міста, а й душі його мешканців, наповнивши їх новою витривалістю та оптимізмом."
nf_oro_ttm.4.a:0 "Світло…"

nf_oro_ttm.5.t:0 "Храм Двох Місяців"
nf_oro_ttm.5.d:0 "У жесті єдності та взаємної поваги Діана й Геката збудували величний храм, присвячений їхній спільній вірі. Зведений із блискучої слонової кістки, він височіє подібно до Парфенону — з високими колонами та фризами, що зображують божественну мудрість і силу. Всередині — гобелени й фрески, що оповідають про історії та філософії Близнючих Матерів і Доньок Гекати. У повітрі завжди витає аромат свіжих передвоєнних фруктів із Розсадника — рідкісний і цінний дар.\n\nХрам став центром духовного та інтелектуального обміну. Тут регулярно відбуваються дебати між Близнючими Матерями та Доньками Гекати. Меблі, виготовлені з дерева гаю Ніхтемерон, прикрашені древніми символами. Зручні столи й крісла сприяють навчанню та спілкуванню.\n\nТут також навчають новачок — майбутніх Доньок і жриць. У двориках і садах під наглядом наставників вони вивчають священні тексти, ритуали, мистецтво слова і практичні навички служіння.\n\nЗ часом храм стане одним із чудес Пустки. Осередком знань, віри й надії на новий світ."
nf_oro_ttm.5.a:0 "Слава під Двома Місяцями!"

nf_oro_lab.1.t:0 "Зустріч розумів"
nf_oro_lab.1.d:0 "У тиші окремої кімнати всередині Темної Піраміди Геката та доктор Адріан Бейр сиділи одне навпроти одного. Приміщення, прикрашене витонченим деревом із гаю Ніхтемерон, випромінювало спокій, що контрастував із серйозністю тем. Вони пили вино з власних садів — тепло напою згладжувало суворість розмови. Адріан, як завжди, носив свою обтріпану куртку Послідовників Апокаліпсису — нагадування про ідеали, які він досі не покинув.\n\nЇхні бесіди — це інтелектуальний танець: глибокі, чесні, сповнені довіри та напруги. Коли Адріан завів мову про філософію та стан Пустки, Геката слухала уважно, іноді людяно. Але потім він змінив тему — згадав стару лабораторію. Геката напружилася. Вона відмахнулась від теми, мовляв — невдалий експеримент. Але Адріан знав: ця байдужість — маска, і вирішив не відступати."
nf_oro_lab.1.a:0 "..."

nf_oro_lab.2.t:0 "Тягар минулого"
nf_oro_lab.2.d:0 "Світло лампи миготіло, коли Адріан заговорив — голос рівний, але наполегливий. Він розповідав про похмурі подробиці експериментів у старій лабораторії — про прагнення до «досконалості». Генетичні маніпуляції, болючі випробування, пошук народу, що зможе знищити Цезаря.\n\nЩо глибше він заходив, тим більше Геката мовчала. Він пояснював, як євгеніка не зміцнює, а послаблює, як контроль — це ілюзія, що залишає лише шрами. Лабораторія — не помилка, а пляма на її нинішньому образі.\n\nГеката відкинулась назад, обличчя — непроникне, але її стиснута рука свідчила про внутрішній конфлікт. Адріан нахилився вперед і, голосом повним рішучості, мовив: «Якщо ти справді хочеш вести свій народ до чогось більшого — відпусти це. Знищи лабораторію. Забудь це божевілля.» Його слова повисли в повітрі як виклик — визнати минуле або знову сховатись у тіні."
nf_oro_lab.2.a:0 "..."

nf_oro_lab.3.t:0 "Відлуння у забутій лабораторії"
nf_oro_lab.3.d:0 "Через деякий час Геката знову опинилася у закинутій, запиленій лабораторії, де колись проводила свої експерименти. Повітря було важким від спогадів, кожен прилад — нагадуванням про її невпинне прагнення до неможливого ідеалу. Вона провела рукою по склянці — холодній, гладкій. У вухах лунали слова Адріана — похмуре нагадування про шкоду, якої вона завдала. Можливо, причина провалу полягала не в методах, а в самому підході.\n\nСтоячи у приглушеному світлі, Геката відчула рідкісний момент вразливості. Адріан просив її зруйнувати лабораторію — і це було неважко. Вона давно покинула це місце, розчарована відсутністю результатів.\n\nЧастина її, та, що не любила визнавати поразку, хотіла відродити лабораторію — почати з новим баченням. Але порада Адріана не відпускала: зруйнувати, відпустити і довіритись своєму народові. Вперше Геката відчула вагу рішення не просто як лідер, а як та, що плекала майбутнє свого народу."
nf_oro_lab.3.a:0 "§RЦього разу все буде інакше.§!"
nf_oro_lab.3.a.tt:0 "§gГеката дивиться в обличчя минулому і не відвертається — тепер вона розуміє, що прагнення досконалості було помилкою не тому, що вона хотіла змінити людство, а тому, що заперечувала істини, які вже викарбувала Пустка.\n\nВона постановляє: Уроборос більше не цуратиметься мутацій, а прийме їх як майбутнє. Викривлені радіацією і часом більше не будуть вигнанцями — вони стануть її обраними. І якщо їхня сила не буде дана добровільно — вона її візьме. Витягне правду з їхнього м’яса.§!"

nf_oro_lab.3.b:0 "§MПора відпустити.§!"
nf_oro_lab.3.b.tt:0 "§gГеката дивиться на свої творіння й розуміє: досконалість — не у крові, а у волі — у традиціях, культурі й вірі свого народу. Лабораторія була не просто помилкою — це було відкидання того, що вона хотіла примножити. Вона відходить від руїн і простягає руку до племен, яких раніше відкидала, вплітаючи їхню мудрість у візерунок Темної Матері.\n\nАле якщо вона схоче, вона може звернутися не з милістю, а з мечем — і навіть у спротиві вони служитимуть її волі.§!"

nf_oro_abbey_of_the_road.1.chain.tt:0 "Цікавий лист"
nf_oro_abbey_of_the_road.1.t:0 "$nf_oro_abbey_of_the_road.1.chain.tt$"
nf_oro_abbey_of_the_road.1.d:0 "Коли Геката відпочивала в Умбральному Адитоні, Дей підійшов із ноткою здивування, тримаючи згорнутий, потертий клапоть пергаменту. «Ти не повіриш», — сказав він, передаючи його Гекаті з усмішкою. — «Справжній лист».\n\nГеката здивовано моргнула. «Лист? На папері?» Вона взяла його, відчуваючи шорстку текстуру пергаменту — у світі голотейпів і терміналів рукопис був рідкістю."
nf_oro_abbey_of_the_road.1.a:0 "Хто ще пише чорнилом?"

nf_oro_abbey_of_the_road.2.t:0 "$nf_oro_abbey_of_the_road.1.chain.tt$"
nf_oro_abbey_of_the_road.2.d:0 "ДО ГЕКАТИ, ФАЛЬШИВОЇ БОГИНІ ОРОБОРОСА,\n\nТИ МОЖЕШ ОБДУРИТИ НАТОВПИ СВОЄЮ «БОЖЕСТВЕННІСТЮ», АЛЕ Я БАЧУ ПРАВДУ. ТИ ЗБУДУВАЛА ОРОБОРОС НА ОБМАНІ — ЦЕ БОГОХУЛЬНА СПОРУДА ТВОЄЇ ПИХИ. ТИ ДУМАЄШ, ЩО МІСТО РОБИТЬ ТЕБЕ БОГИНЕЮ? ДУРНИЦІ. ТИ ВЕДЕШ ЇХ ДО РУЇНИ, І СВІТ РАЗОМ ІЗ НИМИ.\n\nТИ ЗАМАГАЄШСЯ З ТЕМНИМИ СИЛАМИ, КЛИЧЕШ ДО БУРЯЧИХСЯ БОГІВ — ТИХ, ХТО ЧЕКАЄ ПОЗА ЗАВІСОЮ, ГОТОВИХ ЗІРВАТИ ЇЇ НА ЧАСТИНИ. Я ЗНАЮ, ЩО ТИ РОБИШ. УҐ-КВАЛТОТ ХОДИТЬ ПО ТВОЇХ СЛІДАХ.\n\nІ НЕ ДУМАЙ, ЩО Я НЕ БАЧУ ТВОГО ЗВ’ЯЗКУ З ДІАНОЮ. ВОНА — ТВІЙ ІСТИННИЙ ГОСПОДАР, А ТИ — ЛИШЕ СЛУГА ЇЇ ТЕМНИХ БАЖАНЬ."
nf_oro_abbey_of_the_road.2.a:0 "Це ще не все?"
nf_oro_abbey_of_the_road.skip.d:0 "Марна трата часу."

nf_oro_abbey_of_the_road.3.t:0 "$nf_oro_abbey_of_the_road.1.chain.tt$"
nf_oro_abbey_of_the_road.3.d:0 "ДУМАЄШ, ТИ ОСОБЛИВА? ДІАНА СКЕРУЄ ТОБОЮ, А ТИ ЗАСЛІПЛЕНА. ВОНА ГОТУЄ ЦЕ З ЧАСІВ РІЧАРДА ЛЕВОВЕ СЕРЦЕ! ПРИЗНАЧЕННЯ ВІД ДНІВ ХРЕСТОВИХ ПОХОДІВ.\n\nКОЛИ РІЧАРД ВИРІЗАВ ПОЛОНЕНИХ ПІД АККО, ВІН НЕ ПРОСТО ВЧИНИВ ЗЛОЧИН — ВІН ВІДКРИВ БРАМИ ДЕМОНАМ, ЯКИХ ТИ ТЕПЕР НАМАГАЄШСЯ ПОВЕРНУТИ. І ТИ — СПАДКОЄМИЦЯ ЙОГО ПРОКЛЯТТЯ.\n\nУҐ-КВАЛТОТ І ЙОГО ПОДІБНІ НЕ ПІДДАДУТЬСЯ КОНТРОЛЮ. ВОНИ РОЗІРВУТЬ ВІДЧИНЕНЕ ТОБОЮ ВІКНО І ОБЕРНУТЬ ОРОБОРОС НА ПОПІЛ!"
nf_oro_abbey_of_the_road.3.a:0 "Це просто не закінчується..."

nf_oro_abbey_of_the_road.4.t:0 "$nf_oro_abbey_of_the_road.1.chain.tt$"
nf_oro_abbey_of_the_road.4.d:0 "АЛЕ В ТЕБЕ Є ВИБІР. ТИ МОЖЕШ ПОКАЯТИСЯ. ВІДВЕРНИСЯ ВІД ЦІЄЇ ДОРОГИ ПРОКЛЯТТЯ І ЗНАЙДИ ІСТИННЕ СВІТЛО — ЛЮБОВ ХРИСТА-СПАСИТЕЛЯ. НЕ ПІЗНО РЯТУВАТИ СВОЮ ДУШУ. АЛЕ ЧАС СПЛИВАЄ.\n\nЯ БУДУ ТАМ, КОЛИ ПРИЙДУТЬ ТВОЇ ДЕМOНИ. І Я БУДУ ДИВИТИСЯ, ЯК ТИ ПАДАЄШ.\n\n— СПОВІДНИК ДЖЕБЕДАЯ, АБАТСТВО ДОРОГИ — ОХОРОНЦІ ІСТИНИ"
nf_oro_abbey_of_the_road.4.a:0 "І це мене називають божевільною?"

oro_abbey_of_the_road_raiders:0 "§YАбатство Дороги§! заснувало місію в Уроборосі."

  #Purposefully super long. Done to give the abbey of the road a bit of personality and to play into the bit of the event itself.
oro_modify_idea:0 "$MODIFY$ §Y$IDEA$§!$MODIFIER$"
oro_abbey_of_the_road_modify_tt:0 ":\n  Виробництво на фабриках: §G-5.0%§!\n  Дохід з кришок: §G-5.0%§!"
oro_abbey_of_the_road_incursions_short:0 "ПРАВЕДНИЙ ХРЕСТОВИЙ ПОХІД АБАТСТВА ДОРОГИ"
oro_abbey_of_the_road_incursions_long:0 "ПРАВЕДНИЙ ХРЕСТОВИЙ ПОХІД АБАТСТВА ДОРОГИ, БОРОТЬБА ПРОТИ ВЕЛИКОЇ ОБМАНЩИЦІ, ВІЙНА ЗА ДУШУ ЛЮДСТВА, ОСТАННІЙ РУБІЖ ПРОТИ ТІНЕЙ, ЩО КРИВЛЯТЬСЯ ПІД ПОВЕРХНЕЮ ЗЕМЛІ, СПОСТЕРІГАЮТЬ, ЧЕКАЮТЬ, ГОЛОДНІ ДО МИТІ, ЩОБ УДАРИТИ! ВОНИ НАЗИВАЮТЬ ЇЇ БОГИНЕЮ, АЛЕ МИ ЗНАЄМО ПРАВДУ — ФАЛЬШИВА ПРОРОЧИЦЯ, ЗМІЙ У САДУ, ЛЯЛЬКА ТЕМНІШИХ СИЛ, ЩО ЧАТУЮТЬ ЗА ВУАЛЛЮ ЦЬОГО СВІТУ! ЇЇ МІСТО, ЇЇ ПІРАМІДА, ЇЇ ВІРА — ВСЕ ЗБУДОВАНО НА БРЕХНІ, ВСЕ ЩОБ ПРИНЕСТИ ЕПОХУ ЄРЕСІ, ПОТВОР, ЩО РОЗІРВУТЬ САМУ ТКАНИНУ РЕАЛЬНОСТІ! АЛЕ МИ НЕ БУДЕМО СТОЯТИ СКЛАВШИ РУКИ! НІ! МИ ПРИНЕСЕМО СВІТЛО ПРАВДИ ДО ЦІЄЇ ЗАРАЗИ НА ЗЕМЛІ! ГОДИНА СУДУ НАБЛИЖАЄТЬСЯ, І АБАТСТВО ДОРОГИ СТАНЕ ЗНАРЯДДЯМ ЙОГО БОЖЕСТВЕННОЇ ВОЛІ!"
oro_abbey_of_the_road_incursions_desc:0 "Дивна секта християнських фанатиків, пов’язана з таємничим Абатством Дороги, нещодавно оселилася поблизу Уробороса. Їхні переконання, які більшість вважає чистим божевіллям, охоплюють теорії змови на кшталт Приховування Зетанів, Гіпотези Нуль-Світу та «Постулату Левового Серця» — химерної теорії про те, що світ зазнав фундаментального зрушення 20 серпня 1191 року, коли Річард Левове Серце вчинив масове вбивство полонених із війська Саладіна під Акко. Абатство Дороги заявляє, що стоїть на захисті від найдивніших і найпідступніших сил Пустки, стверджуючи, ніби лише вони володіють психічним і духовним розумінням, здатним боротися з невидимим злом. Подейкують, що саме Абатство могло існувати ще до Великої Війни, його коріння плутається в забутих століттях.\nЯкщо Геката хоче зберегти свою владу, їй слід негайно вжити заходів, аби придушити їхні спроби підірвати її правління."
