  oro_gene_warriors_idea:0 "\"Ідеальне Плем’я\""
  oro_gene_warriors_idea_desc:0 "Колись, у глибинах Темної Піраміди, Геката проводила жахливі експерименти над племенами, прагнучи створити \"§RІдеальне Плем’я§!\", якому не страшний Легіон. Вона викрадала дітей, калічила, змінювала — все заради примарного прориву. Хоч деякі вважають це проривом, насправді — це лише марнування часу й років її життя."
