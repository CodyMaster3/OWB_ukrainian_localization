l_english:
  # Focuses
  oro_1:0 "Темна Мати"
  oro_1_desc:0 "Полум’я спалює минуле,\nПопіл розносить вітер,\nЛишається лише ненависть."

  oro_2:0 "Богиня"
  oro_2_desc:0 "Місячне сяйво кличе ім’я моє,\nБогиня темряви й долі,\nЇї голос — істина."

  oro_3:0 "Майбутнє"
  oro_3_desc:0 "Сталь і камінь скоряються,\nТіньова рука творить трон,\nТа час і далі шепоче."

  oro_robots:0 "Більше Роботів!"
  oro_robots_desc:0 "Більшість роботів в Уроборосі — це самітні машини, що заблукали сюди після падіння В'язниці Тіббетс, або врятовані з колишньої гірничої компанії Алтона Бургесса. Якщо ми знайдемо союзника з діючими виробничими потужностями, які можна наслідувати, ми зможемо створити власне виробництво роботів тут, у серці Уробороса!"

  oro_gecks:0 "Краса Землі"
  oro_gecks_desc:0 "§MДо мене — і дощ, і річка — мов брати,\nЧапля, видра — друзі всі мої,\nІ ми пов’язані між собою,\nКоло вічне, що не має кінця.§!"

  oro_deal_with_lac_ttm:0 "Богиня поруч із Дияволом"
  oro_deal_with_lac_ttm_desc:0 "У повороті долі Діана — місячна сестра Гекати — вирішила стати союзницею Легіата Ланія! Здається, вона змогла переконати його об’єднати сили, щоб кинути виклик самому Легіону! Ми маємо оцінити ситуацію!"

  oro_invite_chc:0 "Елізійське Партнерство"
  oro_invite_chc_desc:0 "Заковані у Темряву, Ланцюговий Хор обрав інший шлях. Вони вигнали своїх культових фанатиків і відродили Проєкт АКАПЕЛА — довоєнну ініціативу з відновлення навколишнього середовища. Геката шанує тих, хто шукає відродження в пустці, а їхня відданість АКАПЕЛІ доводить, що Колібрі гідні стати Сестрами Гекати."
  oro_chc_invite_tt:0 "Кожен союзник §Y[CHC.GetAdjective]§!:\n$invite_to_daughters_of_hecate_tt$"
  chc_has_finished_project_acapela_tt:0 "Завершено §YПроєкт АКАПЕЛА§!."

  oro_address_the_hostile_tribes:0 "Абатство Дороги"
  oro_address_the_hostile_tribes_desc:0 "Абатство Дороги — невелика, але фанатична християнська екстремістська організація, яка вважає, що Геката є великою загрозою для Пустки. Їхній осередок, підтримуваний Нью-Ханааном, блукає гаями Ніхтемерону, переслідує Псів Гекати та співпрацює з племенами біля Колорадо, щоб підірвати вплив Уробороса."

  oro_track_the_source_of_the_rumors:0 "Виявити Фанатиків Абатства"
  oro_track_the_source_of_the_rumors_desc:0 "Ми маємо знайти, де ховається Абатство Дороги. За чутками, за допомогою членів Рук Божих із Нью-Ханаану, вони створили табори в гірських масивах Уїнта — їх важко відстежити."

  oro_prepare_contingency_plans:0 "Допит Місіонерів"
  oro_prepare_contingency_plans_desc:0 "Ми захопили кількох членів Абатства Дороги та утримуємо їх у темних камерах Піраміди. Через ретельний допит ми зможемо дізнатися важливу інформацію про їхню мережу та плани."

  oro_swindle_ogden_barons:0 "Обдурити Баронів Оґдена"
  oro_swindle_ogden_barons_desc:0 "Купецькі барони Оґдена набивають свої кишені війною й вірою, фінансуючи Абатство Дороги під прикриттям праведності. Але золото голосніше за фанатизм. Якщо ми непомітно закидатимемо їм капси, їхня відданість згасне. І тоді скарбниці Абатства спорожніють — ще до того, як меч буде піднято."

  oro_address_the_hostile_tribes_cap:0 "Розплата на Хребті"
  oro_address_the_hostile_tribes_cap_desc:0 "На своєму ізольованому узвишші Абатство Дороги шепоче виклики й накопичує зброю, вірячи, що вони — недосяжні. Їхнє святилище — фортеця, останній бастіон перед неминучим. Але жоден хребет не врятує від Темного Місяця — жодна віра не зупинить те, що гряде. Шторм збирається. Скоро він обрушиться."

  oro_deal_with_local_threats:0 "Розібратись із Місцевими Загрозами"
  oro_deal_with_local_threats_desc:0 "Плем’я Старих Кісток на півночі вже давно не визнає божественності Гекати. Вони продовжують порушувати наші кордони. Потрібно вжити рішучих заходів."

  oro_protect_caravan_routes:0 "Захистити Караванні Шляхи"
  oro_protect_caravan_routes_desc:0 "Плем’я Старих Кісток нападає на наші торговельні маршрути, ставлячи під загрозу життєво важливі постачання. Потрібно укріпити та захистити каравани задля процвітання Уробороса."

  oro_stealing_back_supplies:0 "Повернути Викрадене"
  oro_stealing_back_supplies_desc:0 "Старі Кістки захопили наші припаси. Ми маємо завдати удару у відповідь і повернути своє, щоб відновити нашу силу та стабільність."
  oro_stealing_back_supplies_tt:0 "§YВербуємо Нових Бійців§!\n§gВдячні торговці беруться до зброї, щоб захистити шляхи!§!"

  oro_call_on_the_rattlesnakes:0 "Закликати Гримучих Змій"
  oro_call_on_the_rattlesnakes_desc:0 "Гримучі Змії — невеликий клан рейдерів, відомий своїми нападами на Меса-Верде. Вони можуть стати корисними союзниками у боротьбі зі Старими Кістками. Якщо звернутись до них — перевага буде на нашому боці."

  oro_tob_wg:0 "Удар по Старих Кістках"
  oro_tob_wg_desc:0 "Ми зібрались, зміцнили кордони, повернули постачання — тепер час іти в наступ! Проженемо Старі Кістки назад до їхніх печер. Можливо, цього разу вони навчаться схиляти коліна."

  oro_attack_our_north:0 "Забезпечити Північну Торгівлю"
  oro_attack_our_north_desc:0 "Старі Кістки порушили важливі шляхи караванів з брамінами, захопивши північні землі та задушивши торгівлю. Повернувши ці території, ми відновимо потоки товарів і зміцнимо владу Гекати."

  oro_reaching_out:0 "Пакт Колорадо"
  oro_reaching_out_desc:0 "Щоб протистояти зростаючій тіні Цезаря, ми маємо звернутися до племен уздовж Колорадо. Об’єднавши їх спільною метою, ми зможемо створити союз, який стане незламною перешкодою для Легіону."

  oro_uin_ally:0 "Крила Зефіру"
  oro_uin_ally_desc:0 "Юінта мріють повернути небо за допомогою довоєнних літаків, мріючи знищити армії Цезаря з висоти. З підтримкою та ресурсами Уробороса ця мрія злетить у небо."

  oro_crz_ally:0 "Заповіт Полум’я"
  oro_crz_ally_desc:0 "Пірокультисти Божевільних Рогів приваблені Уроборосом обіцянками спалити Легіон дотла. Об'єднані під Темним Місяцем, їхній вогонь стане знаряддям божественної помсти."

  oro_dea_ally:0 "Альянс Мертвого Коня"
  oro_dea_ally_desc:0 "Мертві Коні — відважні воїни високогір’я. Перед ними стоїть вибір. Уроборос пропонує силу, щоб кинути виклик тиранії Цезаря та зайняти своє місце у війні."

  oro_invite_neighbors:0 "Пакт Темного Місяця"
  oro_invite_neighbors_desc:0 "Дочки Гекати відправляються, щоб укласти союз із племенами біля Мертвого Коня, створивши єдиний фронт проти Легіону Цезаря. Але за дипломатією ховається істинне обличчя Уробороса: прагнення до влади. Скоро племена побачать у Темному Місяці як спасителя, так і володаря."

  oro_war_for_the_uinta_mountains:0 "Завоювання Гір Уїнта"
  oro_war_for_the_uinta_mountains_desc:0 "Дирижаблі Іґл-Року — потенційна загроза для Уробороса, адже їхні довоєнні машини здатні вразити наші найвразливіші точки. Замість подарунків і обіцянок — ми вдаримо першими, захопимо їхню фортецю та втихомиримо небо. Уїнта належатиме Гекаті."

  oro_unifying_the_wayward_tribes:0 "Об'єднання Заблудлих Племен"
  oro_unifying_the_wayward_tribes_desc:0 "Абатство Дороги та Руки Божі, підбурювані Нью-Ханааном, сіють брехню серед племен, розпалюючи ворожнечу до Уробороса. Вони кидають виклик божественному баченню Гекати — і ми зітремо їх без жалю."

  oro_uin_wg:0 "Зефір Зламаний"
  oro_uin_wg_desc:0 "Плем’я Юінта, зваблене Абатством Дороги, сіє хаос у горах. Ми повинні придушити їхній бунт і повернути до лона Темного Місяця."

  oro_crz_wg:0 "Вогненосці Хаосу"
  oro_crz_wg_desc:0 "Божевільні Роги роздмухують полум’я анархії, їхній піроманський культ підбурений шепотом Нью-Ханаану. Їх слід знищити, перш ніж вони повністю поглинуть племена."

  oro_dea_wg:0 "Фортеця на Мертвому Коні"
  oro_dea_wg_desc:0 "Мертві Коні окопалися на священній месі, обмануті фальшивими обіцянками спасіння від Нью-Ханаану. Зламати їхній опір — значить відкрити шлях до єдності."

  oro_consolidate_wg:0 "Підкорення Заблудлих Племен"
  oro_consolidate_wg_desc:0 "З ворогами Уробороса покінчено, їхня брехня змовкла — племена знову об’єднаються під божественним світлом Гекати."

  oro_protect_deadhorse_point:0 "Захистити Мертву Месу"
  oro_protect_deadhorse_point_desc:0 "Важливість Мертвої Меси для війни з Легіоном — поза сумнівом. Інша можлива лінія фронту проходить аж через Скелясті Гори, поблизу територій Шифра в Меса-Верде. Ми не можемо дозволити Легіону висадку — маємо захистити стратегічну глибину."

  oro_request_deadhorse_point:0 "Вимагати Мертву Месу"
  oro_request_deadhorse_point_desc:0 "Мертва Меса, розташована біля Колорадо, є ключем до війни з Легіоном. Гончі Гекати вважають її необхідною для формування фронту. Ми звернемося до Місячного скарбу, щоб заплатити за неї."

  oro_deal_with_eag:0 "Переговори з Іґл-Роком"
  oro_deal_with_eag_desc:0 "Дехто з Гончих Гекати остерігається, що напад на Іґл-Рок призведе до повітряного удару у відповідь. Уроборос будувався проти наземного наступу Легіону, а не повітряного удару довоєнними машинами! Краще вимагати данину та запропонувати захист — розв’язання без бою."

  oro_plan_against_the_legion:0 "Невгасима Ненависть"
  oro_plan_against_the_legion_desc:0 "Під затемненим небом,\nГнів Гекати мов полум’я—\nЦезар стане пилом."

  oro_river_defense:0 "Оборона Гаю"
  oro_river_defense_desc:0 "Тимчасово."

  oro_spy_defense:0 "Захист від Шпигунів"
  oro_spy_defense_desc:0 "Тимчасово."

  oro_river_arms_trade:0 "Ріки Течуть Залізом"
  oro_river_arms_trade_desc:0 "Уроборос — не лише фортеця на воді, а й головний постачальник тих, хто бореться з Легіоном. Ми прокладаємо безпечні торговельні маршрути вздовж Колорадо, Пекосу та Ріо-Ґранде, відкриваючи шляхи для постачання зброї, боєприпасів і допомоги."

  oro_museum_raiding:0 "Відлуння Війни"
  oro_museum_raiding_desc:0 "У світі, зраненому війною й часом, реліквії минулого можуть стати ключем до перемоги. Розграбувавши старий військовий музей, Уроборос сподівається знайти знання й зброю, що переломлять хід боротьби."

  oro_obsidian_fleet:0 "Ініціатива Обсидіанового Флоту"
  oro_obsidian_fleet_desc:0 "Зіткнувшись із потужним флотом Легіону, Адріан Бейр і наші адмірали розпочинають амбітну ініціативу. Об’єднавши синтетичні матеріали, темні чари й довоєнні технології, ми перетворимо скромну річкову флотилію на невгамовну силу на Колорадо."

  oro_spreading_the_word:0 "Поширення Слова"
  oro_spreading_the_word_desc:0 "Геката й її послідовниці починають дзвонити на ефір видатним пустельним радіостанціям, розповідаючи моторошні історії про жорстокість Легіону. Їхні слова запалять вогонь бунту — і далекі поселення повстануть."

  oro_spy_defense_5:0 "Захист від Шпигунів V"
  oro_spy_defense_5_desc:0 "Тимчасово."

  oro_black_canyon_wg:0 "Превентивний Удар"
  oro_black_canyon_wg_desc:0 "Геката завжди остерігалася, що Блек-Каньйон — безладний союз поселенців, рейдерів і торгашів — може вдарити під час війни з Легіоном. Їхній нестабільний уряд — ризик, який ми не можемо ігнорувати. Лише завоювання гарантує безпеку й підкорення."

  oro_bridging_old_and_new:0 "Міст Між Старим і Новим"
  oro_bridging_old_and_new_desc:0 "Поселенці чіпляються за старий світ, відкидаючи віру Уробороса. Та як вони зможуть знайти любов Гекати?"

  oro_boulder_dome:0 "Наукова Зацікавленість"
  oro_boulder_dome_desc:0 "Адріан Бейр звертається до Гекати з терміновим проханням. Його мотиви — загадкові, але палке бажання знань не приховаєш."

  oro_vls_wg:0 "Прорив до Сховища"
  oro_vls_wg_desc:0 "Тимчасово."

  oro_avoid_the_quagmire:0 "Уникнути Болота"
  oro_avoid_the_quagmire_desc:0 "Тимчасово."

  oro_inner_rockies:0 "Стримати Немоніка"
  oro_inner_rockies_desc:0 "Немонік — езотеричний воєначальник племені Шифр — виявив інтерес до завоювання наших земель! Ми повинні знищити загрозу до того, як вона перетвориться на катастрофу під час війни з Легіоном!"

  oro_push_into_the_rockies:0 "Просування в Скелясті"
  oro_push_into_the_rockies_desc:0 "Тимчасово."

  oro_inr_wg:0 "ВГ ІНР"
  oro_inr_wg_desc:0 "Тимчасово."

  oro_send_dae_south:0 "Надіслати Дае на Південь"
  oro_send_dae_south_desc:0 "Тимчасово."

  oro_clj_wg:0 "ВГ КЛЖ"
  oro_clj_wg_desc:0 "Тимчасово."

  oro_wg_on_pnt:0 "ВГ на ПНТ"
  oro_wg_on_pnt_desc:0 "Тимчасово."

  oro_safeguard_mesa_verde:0 "Захист Меса-Верде"
  oro_safeguard_mesa_verde_desc:0 "Тимчасово."

  oro_push_into_the_canyon:0 "Прорив у Каньйон"
  oro_push_into_the_canyon_desc:0 "Тимчасово."

  oro_wyoming:0 "Проблеми у Вітрах Торгівлі"
  oro_wyoming_desc:0 "Каравани з півночі через Січ раптово зникли. Ні зв'язку, ні товарів — лише тиша у вітрі. Нам слід розібратися, перш ніж це зробить хтось інший."

  oro_highland:0 "Перемога Гірської Варти"
  oro_highland_desc:0 "Гірська Варта не підвела — розгромила шахтарів-крітів з Фарсона й відбила торгівлю. Нарешті можна припинити нормувати каву!"

  oro_highland_1:0 "Ремесло Арапахо"
  oro_highland_1_desc:0 "Арапахо допомагають із інструментами й постачанням, щоб підтримати торгівлю. Їхнє спорядження — міцне й надійне. Підтримаймо союз."

  oro_highland_2:0 "Пістолі Рейнджерів"
  oro_highland_2_desc:0 "Рейнджери Ролінза діляться культовими револьверами! Геройська зброя — ідеальний обмін за капси."

  oro_highland_3:0 "Інвестиції в Уроборос"
  oro_highland_3_desc:0 "Гірська Варта хоче інвестувати в Уроборос, але просить трохи допомоги натомість. Це вигідна пропозиція — більше торгівлі, більше капсів. Обговорімо деталі!"

  oro_farson:0 "Перемога Шахтарів-Крітів"
  oro_farson_desc:0 "Погані новини з півночі — кроти розбили Гірську Варту. Наші каравани заблоковані. Час навести лад."

  oro_farson_1:0 "Винахідливість Крітів"
  oro_farson_1_desc:0 "Кілька інструментів і техніки крітів пробрались до нас із біженцями. Це трохи, але краще, ніж нічого."

  oro_farson_2:0 "Новий Дім для Шахтарів"
  oro_farson_2_desc:0 "Деякі кроти хочуть почати нове життя в Уроборосі. Вони грубі, але працелюбні. Можемо дати їм шанс."

  oro_farson_3:0 "Притулок для Біженців"
  oro_farson_3_desc:0 "Біженці з Гірської Варти прибувають до Уробороса. Вони голодні й виснажені. Ми допоможемо їм оселитися."

  oro_fate_of_wyoming:0 "Безпека Північного Потоку"
  oro_fate_of_wyoming_desc:0 "Зі шляхами під нашим контролем, товари з півночі рухаються безперешкодно. Жодних збоїв — Уроборос відкритий для бізнесу!"

  oro_gene_warriors:0 "Протистояти Старим Ранам"
  oro_gene_warriors_desc:0 "Потрібна загартована рішучість, щоб поглянути в очі власним помилкам. У тіні минулого Гекати чимало таких помилок плямують її спадок."

  oro_mutagens:0 "Новий Погляд"
  oro_mutagens_desc:0 "Геката дійшла висновку, що її експерименти в лабораторії були результатом хибного бачення:\nВона надто покладалася на мудрість стародавніх. Вона намагалася винайти колесо заново, тоді як — варто було лише придушити власне его — вона б побачила, що інші у Пустці вже стали досконалими племенами; мутантами!"

  oro_mutagens_1:0 "Гордість Мутантів!"
  oro_mutagens_1_desc:0 "Ми повинні показати мутантам, що якщо вони того бажають — Уроборос може стати їхнім домом! А з допомогою наших лабораторій їхні мутації будуть вивчені та посилені!"

  oro_mutagens_2:0 "Благословенна, а не Примусова Еволюція"
  oro_mutagens_2_desc:0 "FEV, зрештою, створює неповноцінну особистість. Супермутанти — витвір Вест-Теку — це громили без тієї витонченості, якої вимагає народ Гекати.\nЇї народ буде обраним, з силою, що постала через природну еволюцію, а не нав’язану старим світом."

  oro_mutagens_3:0 "Проголошення Прав Мутантів"
  oro_mutagens_3_desc:0 "Мутанти завжди матимуть місце в Уроборосі. Ті, хто став жертвою доторку Пустки, або ті, хто віддав тіло на захист Гекати — мають бути рівними, а не приниженими!"

  oro_tonics:0 "Закрити Лабораторію"
  oro_tonics_desc:0 "Настав час Гекаті залишити цей розділ життя позаду. Вона зробила помилки, завдаючи болю тим, кого прагнула врятувати в ім’я Легіонопаду.\nТа їй не треба втрачати серце, аби перемогти Легіон."

  oro_tonics_1:0 "Природні Тоніки"
  oro_tonics_1_desc:0 "Народ Уробороса завжди користувався натуральними тоніками й трав’яними засобами. Це дари, що їх Геката принесла з Кручених Кос, і уроки, які їй дали племена. На відміну від Легіону, вона шануватиме силу інтегрованих племен."

  oro_tonics_2:0 "Новий Храм Випробувань"
  oro_tonics_2_desc:0 "Далеко на заході, на землях, де мешкає Обранець, існував храм — велика споруда в землі, де нові воїни вчилися долати виклики Пустки. Ми повинні запозичити цей досвід і збудувати власний великий храм!"

  oro_tonics_3:0 "Мудрість Адріана Бейра"
  oro_tonics_3_desc:0 "Адріан давно не був настільки натхненний співпрацею з Гекатою. Він бачить, як вона зростає як особистість, остаточно закривши свою стару лабораторію. Його допомога буде необхідна, щоб колись поставити Легіон на коліна."

  oro_a_strong_people:0 "Пошук «Досконалого Племені»"
  oro_a_strong_people_desc:0 "Геката завжди вірила, що їй потрібно «досконале плем’я», щоби здійснити Легіонопад. Знадобилися роки, аби зрозуміти: ця одержимість досконалістю йшла з глибокого страху втратити все створене. Деякі шрами ніколи не зціляться — шрами, які вона залишила на племенах — але, можливо, з часом вони стануть уроками."

  oro_lunar_sisters_together_at_last:0 "Сестри Місяця Нарешті Разом"
  oro_lunar_sisters_together_at_last_desc:0 "Коли Легіон зруйнував Близнючих Матерів, Діана повернулась до Уробороса в пошуках притулку. І Геката, колись урятована нею, тепер простягає руку допомоги. Разом вони збирають уламки своїх народів — дві матері, об’єднані втратою і спротивом. У тіні Темної Піраміди вони сіють зерна нового початку."

  oro_ttm_1:0 "Прокласти Канал Зв’язку"
  oro_ttm_1_desc:0 "Завдяки ретельному плануванню було встановлено канал між енергомережами Уробороса та Розсадника, що ділиться майже нескінченним енергозапасом. «Світла Богів» освітили місто, надаючи ніжне й постійне сяйво, що принесло надію мешканцям."

  oro_ttm_2:0 "Возз’єднання з Діаною"
  oro_ttm_2_desc:0 "Коли Діана вперше зустріла Гекату, вона попросила, аби та колись до неї повернулася.\nНарешті настав час побачити сестру знову."

  oro_ttm_3:0 "Питання Віри"
  oro_ttm_3_desc:0 "Серед Дочок Гекати виникли певні суперечності щодо того, як саме віра має функціонувати у межах пантеону."

  oro_ttm_4:0 "Храм Близнючих Місяців"
  oro_ttm_4_desc:0 "Діана та Геката збудували великий храм зі слонової кістки — центр духовного й інтелектуального обміну. Прикрашений гобеленами й меблями з тонкої деревини, він слугує місцем підготовки майбутніх Дочок Гекати та Жриць Близнючих Матерів, символом єдності та мудрості."

  oro_burham_springs:0 "Бергем-Спрінґс"
  oro_burham_springs_desc:0 ""Та поглянь униз; бо ось наближається\nКипляча ріка крові, в якій варяться\nТі, хто насильством іншим шкодить.\nО, сліпа жага! о, гнів безумний,\nЩо штовхає нас у короткому житті,\nА вічність у пеклі нам за це платить!"""

  oro_metal_hands_brave_the_flames:0 "Металеві Руки у Полум’ї"
  oro_metal_hands_brave_the_flames_desc:0 "Наші «Гончі», на жаль, поки не мають броні, щоби пройти через найгарячіші ділянки шахт. Але! Ми можемо використати роботів, аби зупинити полум’я та з’ясувати, що ж ховається в Надрах."

  oro_filling_the_chasm:0 "Залити Провалля"
  oro_filling_the_chasm_desc:0 "Геката, замислившись, знаходить ще один спосіб приборкати вогонь — використати воду! Скерувавши ріку до гарячих ущелин, ми зможемо зменшити температуру."

  oro_fire_team_six:0 "КОМАНДА ВОГНЮ 6"
  oro_fire_team_six_desc:0 "А коли автоматизація та інженерія не дають результату? Ми покладемося на рішучість наших найсильніших «Гончих». Покажімо цьому полум’ю, хто справжній володар світу — ні Пекло, ні Аїд не мають місця під славою Гекати."

  oro_wealth_of_the_springs:0 "Багатства Джерел"
  oro_wealth_of_the_springs_desc:0 "З полум’ям... частково приборканим, ми можемо нарешті відправити КОМАНДУ ВОГНЮ 6 до самого серця печер, аби дізнатись, що збереглось у глибині..."

  oro_industry:0 "Прото-Феодалізм"
  oro_industry_desc:0 "Промисловість Уробороса сформувалась у вигляді впорядкованої ієрархії, що нагадує прото-феодалізм. Дочки Гекати керують землями, дозволяючи селянам обробляти ґрунт і залишати частину врожаю собі. Ті, хто доводить свою цінність — через працю чи винахідливість — можуть стати ремісниками й забезпечити краще життя для нащадків."

  oro_well_rounded_industry:0 "Кріпацтво в Умбральну Епоху"
  oro_well_rounded_industry_desc:0 "Під наглядом Темної Матері Уроборос кує свою долю в праці та вірі. Адріан Бейр і Дочки Гекати створюють візію, де індустрія не просто служить, а освячує, формуючи цивілізацію, де обов’язок і побожність єдині. Величні мануфактури здіймаються, мов обсидіанові шпилі, а їхні горни дихають життям у машини війни та дива."

  oro_well_rounded_industry_tt:0 "§gАдріан Бейр, вічний учений, пропонує грандіозне бачення Уробороса — натхненне «Стародавнім Римом» і грошовитими магнатами Старого Світу. Він пропонує, щоби індустріальні центри функціонували як автономні «племена» — самодостатні феоди, вірні центральній владі Темної Піраміди. Він називає це «Нео-Маноріалістським Феодалізмом», схожим на бачення Марка Антонія для східних провінцій Риму до того, як «латинський Цезар зупинив його». Цей симбіоз феодального управління й індустріальної могутності, як стверджує Бейр, може створити культуру, стійку до забуття — культуру, де шанування й працьовитість нероздільні, а Уроборос стане колискою нового світу.§!"

  oro_pyramid_of_the_dark_moon:0 "Піраміда Темного Місяця"
  oro_pyramid_of_the_dark_moon_desc:0 "Піраміда Темного Місяця — наріжний камінь Уробороса, що з’явився Гекаті у сні. Спочатку зібрана з пустельного брухту — машин і металолому — згодом вона була оздоблена обсидіановими панелями. Її вершина, покрита сплавом золота й урану, вночі відбиває місячне сяйво моторошним світлом."

  oro_infrastructure_effort:0 "Лабораторія д-ра Адріана Бейра"
  oro_infrastructure_effort_desc:0 "Доктор Адріан Бейр, колишній Послідовник Апокаліпсису, був ув’язнений за єретичні погляди. Та Геката, проявивши рідкісне милосердя, дарувала йому життя й залучила до справи Уробороса. Отримавши розкішну лабораторію в Темній Піраміді, він працює під пильним оком Гекати, маючи доступ до неймовірних ресурсів."

  oro_arms_manufacturing:0 "Святилище Дочок"
  oro_arms_manufacturing_desc:0 "Усередині Темної Піраміди розташований духовний осередок Гекати — Святилище Дочок. Тут жриці Гекати — невідмінні у макіяжі та шатах — навчають, моляться й здійснюють свої обряди, втілюючи колективну відданість Темній Матері."

  oro_foundry_effort:0 "Інструменти Алтона Борджесса"
  oro_foundry_effort_desc:0 "Гірниче товариство Алтона Борджесса залишило по собі багатства матеріалів та обладнання. Скориставшись можливістю, Уроборос відновив кілька старих шахт і розпочав нові."

  oro_advanced_fabrication:0 "Умбральний Адитум"
  oro_advanced_fabrication_desc:0 "Глибоко всередині Темної Піраміди знаходиться Умбральний Адитум — покої, оповиті повною тишею та тінню. Тут віряни віддають не лише зір і слух, а й саме відчуття себе, дрейфуючи у безодню, аби спілкуватись із Темною Матір’ю. У порожнечі відчуттів розум звільняється, хапаючись за незримі істини і шепіт вічної мудрості."

  oro_fortification_effort:0 "Старий Умбральний Пагорб"
  oro_fortification_effort_desc:0 "Старий Умбральний Пагорб — священне місце, де Гекаті наснилась Піраміда Темного Місяця. Згодом він став основою Уробороса. Початкові мури міста, збудовані з машин і брухту, досі стоять як пам’ять про скромні початки."

  oro_bounty_of_colorado:0 "Дарунки Колорадо"
  oro_bounty_of_colorado_desc:0 "Річка Колорадо тече уздовж більшості нашого південного кордону — доступна, здебільшого чиста від радіації. Скоординовані зусилля зі збору води сприятимуть зростанню населення."

  oro_great_city_of_ouroboros:0 "Велике Місто Уроборос"
  oro_great_city_of_ouroboros_desc:0 "Місто Уроборос виникло, щоби забезпечити будівництво Піраміди Темного Місяця, розширюючись і еволюціонуючи від цієї єдиної мети. Зі зростанням піраміди виростало й саме місто, засвоюючи уроки свого творення."

  oro_watermill_effort:0 "Відбивальні Лінзи"
  oro_watermill_effort_desc:0 "Уроборос, маяк післявоєнної винахідливості, був спроєктований так, щоб залишатись невидимим для Легіону. Штучне світло було заборонене, навіть багаття. Натомість місто прийняло ніч, використовуючи лінзи для відбиття місячного світла у кожну оселю."

  oro_servants_of_the_greatest_tribe:0 "Механічні Слуги"
  oro_servants_of_the_greatest_tribe_desc:0 "Протягом років роботи з руїн в’язниці Тіббетса — місцеві називають її Порожнечею — дістались до наших земель. Вони стали чудовими слугами, допомагаючи побудувати Уроборос таким, яким ми знаємо його сьогодні!"

  oro_dark_moon_sentries:0 "Вартові Темного Місяця"
  oro_dark_moon_sentries_desc:0 ""Будь ласка, покладіть зброю. У вас двадцять секунд на виконання.""

  oro_war_machines_of_the_goddess:0 "Військові Машини Богині"
  oro_war_machines_of_the_goddess_desc:0 ""Живим або мертвим — ти йдеш зі мною!""

  oro_the_teachings_of_hecate:0 "Вчення Гекати"
  oro_the_teachings_of_hecate_desc:0 "Дочки Гекати передають знання, натхненні первісними силами підсвідомості та стародавньою філософією §g(за єрессю — від до-воєнних умів, таких як Юнґ і Кемпбелл)§!. В останні роки наш зв’язок із цими вченнями ослаб. Настав час народу Уробороса почути мудрість Дочок!"

  oro_defending_the_dark_mother:0 "Захист Темної Матері"
  oro_defending_the_dark_mother_desc:0 "Армія Уробороса завжди була поділена — Люті Гекати, дикі та несамовиті, і Дочки Гекати — тіньові та точні. Цей дуалізм служив Темній Матері добре, та із наближенням Легіонопаду ми повинні обрати шлях, який відточимо. У цьому виборі — майбутнє нашого панування."

  oro_mil_tribal:0 "Шлях Старійшин"
  oro_mil_tribal_desc:0 "Геката закликає до древньої мудрості, що тече в жилах Люті. Їхня спадщина — зброя, їхній родовід — маяк. Вони готові викувати майбутнє, яке вона побачила у видінні."

  oro_mil_tribal_1:0 "Сила Землі"
  oro_mil_tribal_1_desc:0 "Люті черпають силу з кісток Пустки, їхній дух вкорінений у її незламній витривалості. Вони підіймаються з розтрощеного ґрунту — загартовані й непохитні."

  oro_mil_tribal_2:0 "Вічне Коло"
  oro_mil_tribal_2_desc:0 "Склавши священні присяги та об’єднавшись у меті, Люті утворюють незламне коло. Їхня єдність — їхня броня, тверда й вічна, бастіон проти бурі Цезаря."

  oro_mil_tribal_3:0 "Тіні Дикого Лісу"
  oro_mil_tribal_3_desc:0 "Серед заростей дикого лісу Люті зливаються з тінню, безшумні, як присмерк. Вони стають невидимим вістрям волі Гекати, переслідуючи Легіон з терпінням і смертельною точністю."

  oro_support_research_focus:0 "Гартування Виживання"
  oro_support_research_focus_desc:0 "Через вогонь і рішучість Геката перетворює Уроборос на горн виживання. Зброя війни та руки, що її тримають, гартуються разом — готові зустріти випробування її пророцтва."

  oro_learn_from_eagle_rock:0 "Небесні Уроки Іґл-Року"
  oro_learn_from_eagle_rock_desc:0 "Адріан Бейр поринув у давні креслення повітряних кораблів Іґл-Року, ледве стримуючи захоплення: §g'Вони справді їх побудували?! Системи тяги, яких я ще не бачив — о, ми мусимо це відтворити!'§! З благословення Гекати ці проєкти піднімуть Уроборос у небо."

  oro_ouroboros_airships:0 "Перший Політ Темного Місяця"
  oro_ouroboros_airships_desc:0 "Перші повітряні кораблі Уробороса здіймаються зі скайпорту, їхні тіні простягаються над Пусткою. Керовані видінням Гекати, вони сповіщають світанок її панування у повітрі, несучи її гнів у небеса."

  oro_vr_simulators:0 "Сни про Небо"
  oro_vr_simulators_desc:0 "Керування повітряним кораблем — це небезпечно, вимагає точності й майстерності. Щоби убезпечити пілотів, Геката вкладає ресурси у тренажери, де обрані можуть вчитись без ризику для життя або судна."

  oro_mastery_of_war:0 "Гнів Гекати"
  oro_mastery_of_war_desc:0 "Завдяки непохитній дисципліні та божественній меті, Геката сформує своїх воїнів у меч і щит Легіонопаду."

  oro_mil_spec_ops:0 "Дочки Тіні"
  oro_mil_spec_ops_desc:0 "Дочки Гекати рухаються як мовчазні вісниці — невидимі й безпомилкові. Їхні руки, оповиті тінню, вплетуть хаос у серце імперії Цезаря, аби повільно й невідворотно зруйнувати її."

  oro_mil_spec_ops_1:0 "Відлуння Ночі"
  oro_mil_spec_ops_1_desc:0 "У нічній тиші Дочки ковзають, як шепіт жаху. Кожен їхній крок — тінь на серці Легіону, кожен вчинок сіє неспокій, що шириться, як полум’я."

  oro_mil_spec_ops_2:0 "Точність Полювання"
  oro_mil_spec_ops_2_desc:0 "З волею Гекати, що скеровує їх, Дочки завдають ударів з бездоганною точністю. Кожна засідка, кожен удар — це вузол, що розплітає силу Легіону, лишаючи позаду лиш обірвані жили."

  oro_mil_spec_ops_3:0 "Знаряддя Пророцтва"
  oro_mil_spec_ops_3_desc:0 "Дочки стануть знаряддям божественного пророцтва Гекати. Кожна їхня дія відлунюватиме її баченням, перетворюючи імперію Цезаря на тінь минулого."

  oro_spec_ops_research_focus:0 "Знаряддя Богині"
  oro_spec_ops_research_focus_desc:0 "Під пильним поглядом Гекати, найкращі інструменти й навчання будуть даровані Її Дочкам. Озброєні Її благословенням, вони подбають, аби ворог похитнувся, коли настане година Легіонопаду."

  oro_los_alamos_research_plasma_weaponry:0 "Таємниці Плазми"
  oro_los_alamos_research_plasma_weaponry_desc:0 "Адріан Бейр ледве стримує себе: §g'Ти це бачиш? Плазмова зброя! Стабільні реакторні камери, висока ефективність — це прекрасно! Легіон Цезаря навіть не зрозуміє, що їх випарувало!'§!"

  oro_los_alamos_research_heavy_support_weaponry:0 "Передові Системи Підтримки"
  oro_los_alamos_research_heavy_support_weaponry_desc:0 "Креслення автоматичних допоміжних гармат приводять Адріана в захват: §g'Тут є гіроскопи з автокалібруванням і наведення за допомогою ШІ — ШІ! Це буквально скарбниця!'§! Геката знайде їм гідне застосування."

  oro_the_shadows_embrace:0 "Обійми Тіні"
  oro_the_shadows_embrace_desc:0 "Щоб досягти цілісності, слід прийняти тінь усередині себе. Тінь — це придушені, відкинуті частини нашого Я. Їх інтеграція дає більшу самосвідомість і внутрішню силу. Тільки зіткнувшись із темрявою, ми можемо побачити світло."

  oro_reflection_of_the_soul:0 "Пам’ять Предків"
  oro_reflection_of_the_soul_desc:0 "Дочки Гекати вірять, що колективне несвідоме — це безмежне джерело пам’яті предків, спільне для всього людства. Ця прадавня сила, просякнута мудрістю поколінь, спрямовує наші вчинки і формує наші сни."

  oro_mirror_of_the_psyche:0 "Павутина Архетипів"
  oro_mirror_of_the_psyche_desc:0 "У глибинах колективного несвідомого лежить павутина архетипів — універсальних образів і символів, що єднають нас. Розуміння цих архетипів дозволяє краще орієнтуватися в собі й світі."

  oro_confronting_the_darkness:0 "Зустріч із Темрявою"
  oro_confronting_the_darkness_desc:0 "Щоби прийняти тінь, слід спочатку подивитися їй у вічі. Це означає зустріти свої найглибші страхи і визнати те, чого боїмося в собі. Через цей процес ми отримуємо владу над власними демонами, перетворюючи їх на союзників."

  oro_the_alchemy_of_acceptance:0 "Алхімія Прийняття"
  oro_the_alchemy_of_acceptance_desc:0 "Прийняття — це алхімічний процес трансформації тіні. Приймаючи всі частини себе, ми інтегруємо розірване Я в єдину цілісність. Це приносить глибокий внутрішній мир і силу, дозволяючи жити в гармонії з власною природою."

  oro_unity_of_the_self:0 "Єдність Я"
  oro_unity_of_the_self_desc:0 "Коли тінь прийнята, ми досягаємо цілісності. Цей стан дає нам ясність і мету, зміцнюючи Уроборос ізсередини. Єдині в собі, ми непохитні перед випробуваннями світу."

  oro_harmony_of_opposites:0 "Гармонія Протилежностей"
  oro_harmony_of_opposites_desc:0 "Шлях до просвітлення лежить у подоланні дуальностей. Гармонізуючи світле й темне, свідоме й несвідоме, ерос і логос — ми підносимось до вищого стану свідомості. В цій священній рівновазі ми знаходимо мудрість вести народ до величі."

  oro_balance_of_forces:0 "Маска Суспільства"
  oro_balance_of_forces_desc:0 "Персона — це маска, яку ми носимо для життя в суспільстві. Вона допомагає нам функціонувати, але часто ховає наше справжнє Я. Скинь маску — вона лиш перешкода на шляху до справжньої індивідуальності."

  oro_the_dance_of_dualities:0 "Танець Масок і Тіней"
  oro_the_dance_of_dualities_desc:0 "Індивідуація вимагає вивчення дуальностей усередині себе. Персона — це не ворог, а частина нас, так само як і тінь. Дочки Гекати вчать, що обидва аспекти мають бути зрозумілі й інтегровані. У цій рівновазі народжується справжнє Я."

  oro_integration_of_anima_and_animus:0 "Інтеграція Аніми та Анімуса"
  oro_integration_of_anima_and_animus_desc:0 "Аніма й анімус — протилежні аспекти в кожному з нас. Їх інтеграція веде до внутрішнього балансу і подолання конфліктів."

  oro_transcending_polarities:0 "Переходячи Межі"
  oro_transcending_polarities_desc:0 "Щоби зростати, слід подолати бінарне мислення. Прийнявши весь спектр досвіду та емоцій, ми здобуваємо цілісне розуміння себе і світу."

  oro_the_higher_synthesis:0 "Вища Синтеза"
  oro_the_higher_synthesis_desc:0 "Коли протилежності гармонізовані, ми досягаємо вищого синтезу свідомості. Цей стан просвітлення відкриває істину поза межами суперечностей."

  oro_cycles_within_cycles:0 "Цикли всередині Циклів"
  oro_cycles_within_cycles_desc:0 "Дочки Гекати вірять у Вічну Подорож Героя. Навіть якщо в цьому житті ти не завершиш свій шлях — у наступному ти знову спробуєш. Подорож триває, допоки розум не стане цілісним — логос перетвориться в ерос і навпаки. Кожен крок — священний."

  oro_the_elixir_of_life:0 "Еліксир Мудрості"
  oro_the_elixir_of_life_desc:0 "Ця подорож охоплює не одне життя. Щоразу, проходячи її, ми повертаємось із еліксиром мудрості, додаючи до колективного знання Уробороса. Ми ходимо цим шляхом доти, доки не пізнаємо все буття."

  oro_the_eternal_return:0 "Втеча з Колеса"
  oro_the_eternal_return_desc:0 "Крізь незліченні цикли ми прагнемо вирватися з вічного кола. Лише повна інтеграція всього буття дає змогу вийти з нього. Це — кінцева ціль, вінець мандрівки душі крізь епохи."

  oro_apotheosis_of_ouroboros:0 "Істина Уробороса"
  oro_apotheosis_of_ouroboros_desc:0 "У самому серці обіймів Темної Матері лежить Уроборос — символ вічного циклу трансформації та оновлення. Він вчить: лише прийнявши власну тінь, ми можемо стати цілісними. Це й є істина, яку Геката відкриває Пустці:\nУ собі — пізнай істинний потенціал."

  oro_honour_cambell:0 "Вшанувати Кемпбелла"
  oro_honour_jung:0 "Вшанувати Юнґа"

  oro_dockyard_effort:0 "Синтезований Обсидіан"
  oro_dockyard_effort_desc:0 "Під час будівництва Уробороса природні запаси обсидіану вичерпалися. Геката наказала д-ру Адріану Бейру створити формулу для штучного обсидіану. Йому вдалося створити своєрідний \"обсидіан\". §g(Насправді це керамічне скло з домішками свинцю для захисту від радіації. Але не кажіть про це Гекаті!)§! І до сьогодні більшість матеріалів у місті синтезують у плавильнях, а не добувають."

  oro_irrigation_effort:0 "Насіння з Розсадника"
  oro_irrigation_effort_desc:0 "Походження гаю Ніхтемерон бере свій початок у коштовному насінні, яке Геката принесла з Розсадника. Через обмежені запаси вона вдалася до перехресного запилення, щоби забезпечити генетичну різноманітність. Часом витривалі післявоєнні рослини схрещувались із довоєнними сортами, набуваючи стійкості до радіації та здатності рости в спустошеному ґрунті."

  oro_honour_faithful_communities:0 "Вшанувати Вірні Спільноти"
  oro_honour_faithful_communities_desc:0 "Ми маємо шанувати ті племена, що залишились відданими Темній Матері. Їхня віра — тиха, але незламна основа Уробороса, сила, яку слід плекати, якщо ми прагнемо піднятись проти Легіону."

  oro_douglass_pass:0 "Перевал Дугласа"
  oro_douglass_pass_desc:0 "Стародавній перевал Дугласа став оплотом племені, що вшановує Гекату як богиню. Колись це був життєво важливий шлях через гірську місцевість, тепер він наповнений піснеспівами її послідовників, а каміння згладжене вагою їхньої відданості."

  oro_legacy_of_chief_douglas:0 "Спадщина Вождя Дугласа"
  oro_legacy_of_chief_douglas_desc:0 "Вождь Дуглас, провідник з давнини, залишив спадок витривалості, що вписаний у саму землю. Вшановуючи його пам’ять, ми черпаємо силу предків і вплітаємо його історію в велике бачення Гекати."
  oro_chief_douglas_tt:0 "§gДочки Гекати поговорили зі старими слідопитами з племені ютів, чиї історії злиті з землею. Серед них — легенда про Вождя Дугласа, на честь якого й названо перевал. Провідник, дипломат, він водив своїх людей гірськими стежками ще до приходу поселенців. Його ім’я увійшло в історію не завдяки завоюванням, а завдяки тому, що знав шлях, коли інші блукали.§!"

  oro_dominguez_escalante_expedition:0 "Експедиція Домінґеса-Ескаланте"
  oro_dominguez_escalante_expedition_desc:0 "Колись експедиція Домінґеса-Ескаланте проклала шлях крізь цю дику місцевість, ведена відвагою та допитливістю. Тепер їхня спадщина в наших руках, а Уроборос несе дух їхньої мандрівки в нову епоху."
  oro_dominguez_escalante_expedition_tt:0 "§gНаші розвідники виявили племінників, що мешкали в закинутому музеї, серед потрісканих мап та забутих маршрутів. Під уламками скла вони знайшли згадки про експедицію Домінґеса-Ескаланте 1776 року. Її мета — дістатися з Санта-Фе до Монтерея — зазнала поразки через зиму на перевалі Дугласа. Проте невдача принесла карти річок, торгівельних шляхів і земель корінних народів.§!"

  oro_shrine_of_the_dark_mother:0 "Святилище Темної Матері"
  oro_shrine_of_the_dark_mother_desc:0 "На вершинах перевалу Дугласа здіймається обсидіанова статуя Темної Матері, її гладенька поверхня віддзеркалює світло й ріже правдою. Її тінь охоплює долину внизу, а сама вона — то маяк і застереження, що притягує вірних на коліна перед її величчю."

  oro_the_monument:0 "Монумент"
  oro_the_monument_desc:0 "Зруйновані рештки Національного парку динозаврів — це німе нагадування про вік, що канув у Лету. Плем’я Старих Кісток мешкає в його тіні, прив’язане до власних легенд. Якщо здобути їхню довіру, ці древні землі можуть послужити справі Гекати."

  oro_fremont_culture:0 "Культура Фремонт"
  oro_fremont_culture_desc:0 "Народ Фремонт колись процвітав у цій місцевості, залишивши по собі розписані камені та нерозгадані таємниці. Їхня спадщина живе в крові племен — доказ винахідливості та виживання, що набуває нового сенсу під волею Гекати."

  oro_jurassic_paleontology:0 "Юрська Палеонтологія"
  oro_jurassic_paleontology_desc:0 "Ця земля — кладовище древніх гігантів, де скам’янілі кістки блищать, мов скарби. Вони — не просто історія, а натхнення. Їхні контури — нагадування про вічність."
  oro_jurassic_paleontology_tt:0 "§gСтарі Кістки використовували скам’янілі стегнові кістки динозаврів як зброю. Для них це — кістки велетнів. Для нас — біологічні артефакти. Але деякі з них і справді можуть служити на війні: загострені, витримані часом, вже й не скажеш, якій істоті вони належали.§!"

  oro_shrine_of_the_ouroboros:0 "Святилище Уробороса"
  oro_shrine_of_the_ouroboros_desc:0 "Велична споруда з динозаврових кісток та обсидіану здіймається в небо, її форма безкінечно симетрична. Вона в’ється догори — вічна змія, що обіймає смерть і відродження. Під місячним сяйвом кістки виблискують — гострі, як спогади. Тут віра Уробороса віддзеркалюється найяскравіше."

  oro_moab:0 "Муаб"
  oro_moab_desc:0 "Муаб — поселення контрастів, де поселенці й племінники знаходять крихку єдність у тіні Темної Матері. Для багатьох вона — постать із їхньої віри, загадкова тінь самої Марії."

  oro_elk_mountain_mission:0 "Стара Мормонська Місія Ельк-Маунтін"
  oro_elk_mountain_mission_desc:0 "Місія Ельк-Маунтін була маяком довоєнної віри. Тепер її повернуто Уроборосу. Її зали, ще позначені колишнім призначенням, тепер нашіптують нову, похмуру віру."

  oro_mantracks:0 "Сліди Людей"
  oro_mantracks_desc:0 "Серед пустки — гігантські сліди, надто великі, щоб належати людині. Д-р Адріан Бейр називає це підробкою, але плем’я Старих Кісток вірить, що це — сліди божественних попередників, які ходили землею до людей."
  oro_mantracks_tt:0 "§gКупці з Уробороса із задоволенням продавали 'людські сліди' — шматки каменю з вигравіюваними відбитками, які нібито свідчать, що люди й динозаври співіснували. Ще до війни шахраї вирізали їх поблизу Муаба. Минуло двісті років, а вони й досі дурять довірливих. І для торговців немає кращої афери, ніж та, що освячена часом.§!"

oro_shrine_of_legionfall:0 "Святилище Падіння Легіону"
oro_shrine_of_legionfall_desc:0 "Святилище зображує Гекату з вісьмома великими розгорнутими крилами — постать страху та суду. Цезар стоїть навколішки перед нею, в образі рогатого звіра, поваленого під сяйвом її ореолу. Лавровий вінок і хрест на статуї зливають віри в єдиний, жахливий образ божественної відплати. Тут віра в Темну Матір загострюється до впевненості у помсті."

oro_conclave_of_midnight:0 "Опівнічний Конклав"
oro_conclave_of_midnight_desc:0 "На Опівнічному Конклаві буде вирішено долю західних племен. Їхня вірність — під сумнівом, але їхня непокора стала перешкодою, яку ми більше не можемо ігнорувати, бо вони стоять на шляху до вищого задуму Темної Матері."

oro_strength_in_the_dark_mother:0 "Сила Темної Матері"
oro_strength_in_the_dark_mother_desc:0 "Місячне світло в тіні кличе,\nМати темряви — полум’я мудрості,\nДоля кориться її волі."
oro_strength_in_the_dark_mother_tt:0 "§gСила Уроборосу зростає, племена стікаються під стяг Темної Матері. Падіння Легіону наближається!§!"

oro_daughters_of_the_umbral_adytum:0 "Доньки Темного Притвору"
oro_daughters_of_the_umbral_adytum_desc:0 "У спустошеному святилищі Темної Піраміди вони схиляються в безкінечному поклонінні, їхні тіла вкриті попелом священності. У мовчанні й тінях, Доньки Темного Притвору шепочуть не людям, а порожнечі, Глибокому Місяцю та самій Гекаті. Вони — берегині пророцтв, ткачки долі, та руки, що втілюють волю Темної Матері."

oro_silent_sisters_of_the_pyramid:0 "Безмовні Сестри Піраміди"
oro_silent_sisters_of_the_pyramid_desc:0 "Вони блукають невидимі, їхні слонові маски приховують усе, окрім віддаленого блиску очей. У безсвітлих залах Притвору вони прагнуть осягнення через ритуальне самозречення — відмову від зору, звуку й «я», поки не залишиться лише одкровення. Вони — привиди Піраміди, що зникають у темряві та з’являються, щоб прошепотіти істини, здобуті в тиші."
oro_silent_sisters_of_the_pyramid_tt:0 "§gТаємниці, знайдені у порожнечі притвору — священні..§!"

oro_chosen_from_wisdom:0 "Обрані Мудрістю"
oro_chosen_from_wisdom_desc:0 "Темна Мати обирає лише найобдарованіших для приєднання до Притвору. Колись вони були шаманами, цілителями, провидицями серед племен. Тепер вони перековані за візією Гекати — перше покоління народжених в Уроборосі доньок, що ступають у пророцтво, несучи її мудрість далі у віки."
oro_chosen_from_wisdom_tt:0 "§gКолективна мудрість племен поведе нас уперед!§!"

oro_keepers_of_prophesy:0 "Обереги Пророцтва"
oro_keepers_of_prophesy_desc:0 "Їхні руки забруднені чорнилом і кров’ю, їхні видіння — з темряви. Коли Темна Мати прагне мудрості, саме вони схиляються до її трону, шепочучи віщування, побачені у снах і тіні. Доля Уроборосу вписана в їхні слова, їхні провиди визначають і війну, і мир під поглядом Темного Місяця."
oro_keepers_of_prophesy_tt:0 "§gБагаті барони з усієї пустки заплатять статки, щоб почути ворожіння наших відьом...§!"

oro_whispers_in_the_dark:0 "Шепіт у Темряві"
oro_whispers_in_the_dark_desc:0 "Бачити все, залишаючись невидимим — ось суть справжньої влади. Доньки Притвору більше не лишатимуться замкненими в святині. Їхній шепіт проникає у зали влади, веде вождів та міністрів. Воля Гекати проросте скрізь, їхні невидимі руки ліпитимуть Уроборос з тіней."
oro_whispers_in_the_dark_tt:0 "§gДоньки Притвору залишаться особистими служницями, провидицями та окультним кабінетом Гекати. Вони керуватимуть з тіні, будучи її очима й вухами в справах пророцтва й загроз.§!"

oro_matrons_of_the_tribes:0 "Матрони Підкорених"
oro_matrons_of_the_tribes_desc:0 "Віра вимагає покори, але вірність треба виховувати. Кожна Донька Притвору отримає володіння над підкореним племенем, їхня присутність перетворить його в образ Темної Матері. Старих вождів більше немає — їхній народ знайде нове водіння. Те, що колись вклонялось зі страхом, тепер схилиться в благоговінні, пов’язане з Уроборосом вірою та вірністю."
oro_matrons_of_the_tribes_tt:0 "§gДоньки Притвору будуть новими лідерками священних племен. Якщо плем’я не існує — вони отримають право заснувати його. Згодом уся пустка пізнає любов Гекати; доньки, навчені в піраміді, стануть благородними намісницями й васалами Темної Матері.§!"

oro_blood_hounds:0 "Криваві Гончі"
oro_blood_hounds_desc:0 "Криваві Гончі — не такі, як інші Собаки Гекати. Вони пов’язані не вірою, а вірністю Джордану Дею. Походять із племен Гадюк на заході — жорстокого народу з власними традиціями сили та виживання. Хоча вони й марширують під знаменами Гекати, вони б’ються за своїми правилами, перетворивши свої звичаї на зброю."

oro_blood_hound_stinger:0 "Стінгер, Око Цитаделі"
oro_blood_hound_stinger_desc:0 "Серед них — снайпер бездоганної точності, привид у пилюці, який ніколи не хибить. Хоча він нині служить Уроборосу, родом він із місця, званого «Цитадель», про яке майже не говорить. На відміну від інших, він відмовляється від обсидіанових монет Темної Матері, приймаючи лише кришечки — наче зберігає незайману частку минулого."

oro_blood_hound_thunderkin:0 "Громовий Удар"
oro_blood_hound_thunderkin_desc:0 "Один із Кривавих Гончих — Гром — вищий за всіх, колишній рейдер, а тепер солдат із ракетницею вдвічі більшою за нього. Колись він був ватажком у пустці, поки Дей не завербував його, визнавши ту руйнацію, яку він може принести ворогам. Йому байдуже до богів і пророків — тільки бій, вогонь і сталь."

oro_blood_hound_red_bandana:0 "Червона Бандана"
oro_blood_hound_red_bandana_desc:0 "Очолює Кривавих Гончих ветеран, відомий лише за червоною банданою — своєю відзнакою на полі бою. Глибокий шрам перетинає його щоку, отриманий у давно минулому бою, про який ніхто не наважується запитати. Саме він тримає загін у руках, стежачи, щоб вони залишались воїнами, а не просто вбивцями, і щоб їхня вірність Дею не похитнулась."

oro_blood_hound_legionfall:0 "Гончі Падіння Легіону"
oro_blood_hound_legionfall_desc:0 "Щоб Уроборос знищив Легіон, він має звернутися до тих, хто знає війну без ілюзій. Криваві Гончі отримують роль у майбутньому конфлікті, формуючи тактику, що спалить імперію Цезаря до тла. Вони не говорять про долю чи пророцтва — лише про кров, сталь і впевненість у битві."
oro_blood_hound_legionfall_tt:0 "§gКриваві Гончі облаштовують табір за річкою, на території Легіону. Вони влаштовують диверсії в тилу та послаблюють оборону ворога.§!"

oro_blood_hound_guardians:0 "Охоронці Темного Міста"
oro_blood_hound_guardians_desc:0 "Геката доручає Кривавим Гончим захист Уробороса, довіряючи їм останню лінію оборони. Якщо віруючі захищають місто відданістю, то Гончі — люттю. Якщо Легіон прийде — він не знайде жерців. Лише воїнів, готових убивати."
oro_blood_hound_guardians_tt:0 "§gКриваві Гончі осідають у місті Уроборос, утворюючи найманське угрупування. Вони озброюють громадян і навчають їх тактиці Легіону.§!"

oro_purfication_effort:0 "Гай Ніхтемерон"
oro_purfication_effort_desc:0 "Для сторонніх гай Ніхтемерон §g(nik-THEM-er-on)§! в Уроборосі — наче інший світ. Буяє довоєнною зеленню, він — оаза серед спустошення. Геката наказала своїм донькам очистити землю від післявоєнної флори, яку вона вважала оскверненою впливом Легіону, замінивши її рослинами, що втілюють її божественну волю."

oro_water_powered_extraction:0 "Велика Верф"
oro_water_powered_extraction_desc:0 "Верф Уробороса — галасливий вузол, життєво важливий для імпорту товарів. Судна й каравани доставляють ресурси з далеких земель — Орлиного Гнізда, Нового Ханаану, Псиного Міста. Цей безперервний потік постачання тримає Уроборос забезпеченим. Фіолетові морські прапори Уробороса відомі далеко за Колорадо."

oro_final_revenge:0 "Падіння Легіону"
oro_final_revenge_desc:0 "Між ніччю й руїнами,\nКровавий пісок п’є прокляття завоювання,\nКінець Цезаря буде написаний."

