  operation_spread_belief_in_the_dark_mother:0 "Поширити віру в Темну Матір"
  oro_invite_neighbors_tt:0 "§gУклавши Пакт Темного Місяця, ми об'єднуємось із колишніми суперниками проти Легіону. Але якщо ми не зуміємо підкорити їх через операцію \"$operation_spread_belief_in_the_dark_mother$\" до нашої перемоги над Легіоном — наслідки будуть тяжкі. Ніколи не довіряй племені, яке має меч і мету.§!"
  oro_unifying_the_wayward_tribes_helper:0 "§Y[UIN.GetName]§!, §Y[CRZ.GetName]§! або §Y[DEA.GetName]§!:\n      $oro_unifying_the_wayward_tribes_tt$"
