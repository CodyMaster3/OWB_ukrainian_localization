  #oro_best_and_brightest_idea:0 "An Enlightened People"
  #oro_best_and_brightest_idea_desc:0 "We have embraced the teachings of Hecate, integrating the self, transcending dualities, and completing the Hero's Journey. By living according to these tenets, we have become an enlightened people. Our society thrives in wisdom, strength, and harmony, standing as a beacon of hope and resilience in the wasteland."

  #oro_dark_moon_spying:0 "Dark Moon Spying"
  #oro_dark_moon_spying_desc:0 "I see a §Rbad moon rising!§! Oh, wait, that's just Caesar's head."

  #oro_twin_moons_pantheon:0 "Twin Moons Pantheon"
  #oro_twin_moons_pantheon_desc:0 "I see a §Rbad moon rising!§! Oh, wait, that's just Caesar's head."

  oro_metternich_notes:0 "§OЩоденник Генріха Меттерніха§!"
  oro_metternich_notes_desc:0 "Щоденник Генріха Меттерніха — знаного археолога й дослідника XIX століття.\nУ записі за п’ятницю, 6 квітня 1894 року, Меттерніх описує свою експедицію в Убар, що в Порожній Чверті Аравії. Він згадує про свого напарника Лоренцо Кабота й зазначає, що саме його прилади для виявлення електричних збурень дозволили зробити ключові відкриття.\n\nУ записі від суботи, 13 квітня 1897 року, він згадує греко-турецьку війну, коли вирушив на Крит, щоб урятувати артефакти від знищення. Серед них — саркофаг із Кноссу, який він згодом продав американському колекціонеру."

  oro_dianas_journal:0 "§MДослідження Екзотичної Матерії§!"
  oro_dianas_journal_desc:0 "Науковий журнал довоєнної доби містить рецензовану статтю Діани Стоун — випускниці МІТ. У праці вона досліджує явище трансмутації матерії: якщо піддати її екстремальній енергії (напр., ядерному вибуху), частинки можуть втратити взаємодію зі звичайною матерією. Виникає стан, подібний до кварк-глюонної плазми — речовини, що могла існувати лише за мить після Великого Вибуху.\n\nСтоун називає його «Гіперматерією». В такому стані частинки не підкоряються законам термодинаміки, що відкриває нові обрії у фундаментальній фізиці й можливості для створення незнаних технологій."

  oro_missionary_notes:0 "§RМісіонерські Нотатки§!"
  oro_missionary_notes_desc:0 "Збірка нотаток, мап і листів, викрадених у членів Абатства Дороги — фанатичних християн, що борються з культами пустки.\nОдин фрагмент — переписка між місією в тилу й агенткою Марселлою. Вона досліджувала проклятий артефакт — Кривбекніх, моторошну книгу, створену слугами Невідомого. Колись вона належала родині Блекголлів у районі Поінт-Лукаут.\nІнший агент шукав уривок передвоєнної копії книги — її створив предок Блекголлів. Але слід обірвався десь біля річки Колорадо, і доля копії залишилась невідомою."

  oro_post_war_city:0 "Уроборос: Диво Після Війни"
  oro_post_war_city_desc:0 "Засноване Гекатою на священному пагорбі Старого Умбралу — який вона побачила у видінні — місто Уроборос височіє, немов тінь, вшита в саме полотно пустки. Збудоване з синтетичного обсидіану, місто вдень поглинає сонце, а вночі — сяє, як містичний острів. Дзеркальні панелі на дахах збирають місячне світло й заливають вулиці етерним сяйвом, не потребуючи ліхтарів і ховаючи місто від очей Легіону.\nУ центрі — Піраміда Темного Місяця, що об'єднує промислову міць і сакральність. Її вершина — із золота й урану — блимає в небі. Уроборос — це не лише притулок. Це фортеця й віра. Живий пам’ятник видінню богині."

  oro_blood_hounds_defense:0 "Лігво Кровогонів"
  oro_blood_hounds_defense_desc:0 "Кровогони — воїни перш за все. Мародери — вже потім. Їх виховали звичаї Західних Гадюк, але вони вірять не в богів, а в кров, сталь і вірність Джордану Дею. Там, де їхній стяг — там майбутнє поле бою. Їхній табір — це змішання залізної дисципліни й нічних пиятик. Палаючі вогнища, п’яні бої, брязкіт зброї — тут живуть убивці, що лиш чекають, поки війна покличе їх уперед."

