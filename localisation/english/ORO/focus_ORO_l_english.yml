  oro_request_deadhorse_point_tt:0 "§gМи реквізуємо Дед-Горс-Пойнт у поточного власника, компенсуючи витрати великою сумою кепсів.§!"
  oro_our_future_3_tt:0 "\nМи пропонуємо лідеру §YПівнічного Союзу§! офіційне звернення про вступ послідовниць Гекати.\n§gЯкщо вони погодяться:§!\nКожна держава з §YДочок Гекати§!:\n   Приєднується до §YПівнічного Союзу§!."
