ORO_adrian_beyr:0 "Доктор Адріан Бейр"
oro_captive_genius:0 "Полонений Геній"
oro_captive_genius_2:0 "Полонений Геній"
oro_captive_genius_2_tt:0 "Покращення §Y$ORO_adrian_beyr$§!:\n$fake_research_slots$: §G+1§!"

ORO_adrian_beyr_research_advisor_desc:0 "Доктор Адріан Бейр — освічений чоловік та колишній член Послідовників Апокаліпсису. Все своє життя він мандрував пусткою, збираючи книги та голодиски, які поглинав із ненаситною цікавістю.\nЙого подорожі привели його до Уробороса, де одна необережна цитата з грецької міфології в присутності Гекати привела до його ув’язнення.\n\nТа природна винахідливість Адріана та його жага до знань переважили страх перед неволею. Зрештою він став наріжним каменем у зростанні Уробороса, надаючи свої знання й досвід. Йому було надано лабораторію та свободу пересування Темною Пірамідою, і тепер він тісно співпрацює з Гекатою, сприяючи розвитку їхнього спільного бачення."

ORO_seraphina_nyx:0 "Серафіна Нікс"
ORO_seraphina_nyx_trait:0 "Верховна Адміралка Обсидіанового Флоту"
ORO_seraphina_nyx_research_advisor_desc:0 "Як шанована Дочка Гекати та втілення мудрості, Серафіна втілює архетип Мудрої Жінки, керуючи Обсидіановим Флотом з глибоким духовним зв’язком і пронизливим розумінням. Вона виступає за флот, що невеликий, але винятково якісний. Її постать майже міфічна, а кораблі, за чутками, зачаровані захисними закляттями, ковзають по Колорадо, як тіні, готові завдати нищівного удару."

ORO_orion_blackwater:0 "Адмірал Оріон Блеквотер"
ORO_orion_blackwater_trait:0 "Командир Припливного Флоту"
ORO_orion_blackwater_research_advisor_desc:0 "Досвідчений воїн серед Гончаків, Оріон втілює архетип Воїна з тактичним, але лютим підходом. Він прихильник філософії чисел, просуваючи масове виробництво суден, які подавляють ворогів безперервними атаками. Його флот, Припливна Армада — це жахаюче видовище, маса кораблів, що швидко і нещадно рухається Колорадо."

ORO_cassandra_thorn:0 "Кассандра Торн"
ORO_cassandra_thorn_trait:0 "Тіньова Провідниця"
ORO_cassandra_thorn_research_advisor_desc:0 "Як прагматична Дочка, Кассандра втілює архетип Стратега. Вона вважає морську силу витратною і натомість просуває контроль над сухопутними маршрутами через Скелясті Гори. В її тактиці — обхід Легіону за допомогою зрадливого ландшафту та створення прихованих стежок для безпечного просування й засідок."

ORO_lucius_skyshadow:0 "Луціус Скайшейдоу"
ORO_lucius_skyshadow_trait:0 "Майстер Ефірних Криль"
ORO_lucius_skyshadow_research_advisor_desc:0 "Візіонер серед Гончаків, Луціус втілює архетип Винахідника, захоплений відновленням довоєнної авіації. Його «Ефірні Крила» — елітний повітряний флот, витончено налаштований і стратегічно досконалий. Луціус розробив нову тактику повітряного бою, надихаючи пілотів битися за Гекату."

ORO_helena_voidweaver:0 "Гелена Ткачка Порожнечі"
ORO_helena_voidweaver_trait:0 "Архітекторка Безодневих Бастіонів"
ORO_helena_voidweaver_research_advisor_desc:0 "Втілюючи архетип Охоронниці, Гелена — Дочка, що присвятила себе обороні Уробороса. Вона будує укріплення з використанням списаних зенітних гармат, посилених темною магією. Її бастіони захищають місто від повітряних загроз, формуючи грізний щит навколо Уробороса."

ORO_marcus_vex:0 "Генерал Маркус Векс"
ORO_marcus_vex_trait:0 "Бойовий Страж Гончаків"
ORO_marcus_vex_research_advisor_desc:0 "Маркус втілює архетип Героя, надихаючи своїх воїнів честю та доблестю. Він веде з передової, його хоробрість змушує солдатів перевершувати самих себе. Його акцент на піхотній тактиці та ближньому бою зробив Гончаків грізною сухопутною силою."

ORO_selene_blackheart:0 "Володарка Селена Чорносерда"
ORO_selene_blackheart_trait:0 "Володарка Шепоту"
ORO_selene_blackheart_research_advisor_desc:0 "Уособлення архетипу Тіні, Селена — майстриня маніпуляцій, що керує розвідмережею Уробороса. Завдяки сітці шпигунів та інформаторів, вона здобуває критичну інформацію й перетворює її на зброю саботажу та розвідки."

ORO_aurora_storm:0 "Капітанка Аврора Шторм"
ORO_aurora_storm_trait:0 "Хранителька Лінії Життя"
ORO_aurora_storm_research_advisor_desc:0 "Як втілення архетипу Опікунки, Аврора піклується про постійне забезпечення армії. Її ретельне планування мінімізує марнотратство, дозволяючи солдатам діяти на повну, не страждаючи від нестач."

ORO_damian_crowe:0 "Чаклун Деміан Кроу"
ORO_damian_crowe_trait:0 "Верховний Чаклун Артилерії"
ORO_damian_crowe_research_advisor_desc:0 "Як архетип Магіка, Деміан поєднує окультні ритуали з артилерією, додаючи темну перевагу вогневій міці Уробороса. Його ритуали підвищують точність та потужність залпів, перетворюючи обстріли на прояви як сирої сили, так і магії."

ORO_lydia_nightshade:0 "Професорка Лідія Найтшейд"
ORO_lydia_nightshade_trait:0 "Ткачка Доктрин"
ORO_lydia_nightshade_research_advisor_desc:0 "Мудра Дочка, що втілює архетип Мудриці, Лідія створює військові доктрини, що поєднують езотеричні знання та стратегію. Вона вдосконалює тактику, досліджуючи метафізичні сили війни, додаючи новий вимір до стратегії Уробороса."

ORO_isolde_ironweaver:0 "Матрона Ізольда Залізоткачка"
ORO_isolde_ironweaver_trait:0 "Володарка Горнів"
ORO_isolde_ironweaver_research_advisor_desc:0 "Втілення архетипу Творця, Ізольда очолює промисловий апарат Уробороса. Її горни славетні якістю та ефективністю, створюючи зброю та спорядження, що відповідають її безкомпромісним стандартам."

