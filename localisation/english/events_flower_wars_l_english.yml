l_english:
flw.1.t:0 "Рух на кордоні"
flw.1.d:0 "Звіти з фронту змальовують тривожну картину: ворожі війська переміщуються до кордону з [?Global.flw_defender_state.GetName]! Це надто близько до наших рубежів, щоби бути просто навчаннями. Наші зрадливі сусіди, вочевидь, готуються до нападу!"
flw.1.a:0 "До зброї! Напад неминучий!"

flw.2.t:0 "Політичні наслідки"
flw.2.d:0 "Незважаючи на всі наші зусилля, нам не вдалося розпалити конфлікт навколо [?Global.flw_defender_state.GetName] – не вистачило інерції для виправдання нападу. За таких обставин ми змушені відступити, інакше ризикуємо перерости у повномасштабну війну."
flw.2.a:0 "Поразка від ворога була б милосерднішою, ніж це..."

flw.3.t:0 "Провал ініціативи в [ROOT.flw_enemy]"
flw.3.d:0 "Хоч певний час здавалося, що наші сусіди планують захопити [?Global.flw_defender_state.GetName], ситуація на кордоні заспокоїлася. Через низку внутрішніх причин, ворог припинив спроби захопити наші території."
flw.3.a:0 "Дурні знали, що шансів у них немає!"

flw.4.t:0 "Квітконесущі Війни загострюються!"
flw.4.d:0 "Наші початкові підозри підтвердились – [ROOT.flw_enemy] справді намагається захопити [?Global.flw_defender_state.GetName] до того, як ми зможемо розгорнути повну армію! Час покаже, чи зможуть наші прикордонні сили втримати територію."
flw.4.a:0 "Покажемо їм, з чого ми зроблені!"

flw.5.t:0 "Кінець Квіткових Війн"
flw.5.d:0 "Після початку громадянської війни за владу в Імперії Ацтлана, незначні сутички, відомі як «Квіткові Війни», втратили значення в очах обох народів. Тепер дві найпотужніші фракції імперії зчепилися між собою, а за чутками, Військова Рада Іци благає [ITZ.GetLeader] втрутитися. Здається, якщо Іцу не вгамувати, ці «Квіткові Війни» переростуть у справжню..."
flw.5.a:0 "Стара як світ казка завершується ледь чутним стогоном..."

flw.6.t:0 "Агітація в наших територіях!"
flw.6.d:0 "Нещодавні операції [ROOT.flw_enemy] успішно налаштували народ проти нас! Частина наших солдатів загинула, а бойовий дух суттєво підірвано. Потрібно вжити заходів, щоб таке не повторилося."
flw.6.a:0 "Прокляття!"

flw.7.t:0 "Наші наркотики підмішані!"
flw.7.d:0 "Ми маємо звичку поширювати наркотики серед населення. На жаль, останній розподіл проводився з нехтуванням безпеки, що дало змогу ворогам підмішати щось у нашу партію. Це серйозна криза, яка суттєво відкине нас назад."
flw.7.a:0 "Агх! Мч спина птю!"

# CLASHES

flw_clash.1.t:0 "Перемога на кордоні"
flw_clash.1.d:0 "Зі співом на вустах та відвагою в серцях повертаються наші доблесні воїни Ацтлана після завоювання [?Global.flw_defender_state.GetName]; хоча перемога далася недешево, вона принесла велику славу в одвічному протистоянні з нашими ворогами."
flw_clash.1.a:0 "Принесіть трофеї до [Root.Capital.GetName]!"

flw_clash.2.t:0 "Поразка від рук Іци"
flw_clash.2.d:0 "Підступна «Імперія» Чичен Іци захопила [?Global.flw_defender_state.GetName]! У несподіваній атаці їхні сили прорвали нашу оборону до того, як ми змогли відповісти повною мірою."
flw_clash.2.a:0 "Ми мусимо незабаром відповісти!"

flw_clash.3.t:0 "Сутичка завершилася внічию"
flw_clash.3.d:0 "Яка слава в війні без переможців? Сьогодні матерів Ацтлана охоплює горе за синами, що загинули у безрезультатній боротьбі за [?Global.flw_defender_state.GetName]; перемогу не здобуто, лише втрата молодого життя."
flw_clash.3.a:0 "Краще нічия, ніж поразка. Ледве-ледве."

flw_clash.4.t:0 "Перемога на кордоні"
flw_clash.4.d:0 "Зі співом на вустах та відвагою в серцях повертаються наші доблесні воїни Іци після завоювання [?Global.flw_defender_state.GetName]; хоча перемога далася недешево, вона принесла велику славу в одвічному протистоянні з нашими ворогами."
flw_clash.4.a:0 "Принесіть трофеї до [Root.Capital.GetName]!"

flw_clash.5.t:0 "Поразка від рук Ацтлана"
flw_clash.5.d:0 "Підступна «Імперія» Нуево Ацтлана захопила [?Global.flw_defender_state.GetName]! У несподіваній атаці ацтланські війська прорвали наш захист до того, як ми змогли зреагувати."
flw_clash.5.a:0 "Тепер наш узбережжя в небезпеці..."

flw_clash.6.t:0 "Сутичка завершилася внічию"
flw_clash.6.d:0 "Яка слава в війні без переможців? Сьогодні матерів Іци охоплює горе за синами, що загинули у безрезультатній боротьбі за [?Global.flw_defender_state.GetName]; перемогу не здобуто, лише втрата молодого життя."
flw_clash.6.a:0 "Краще нічия, ніж поразка. Ледве-ледве."