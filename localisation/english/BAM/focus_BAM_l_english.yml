l_english:

BAM_captains_isolation:0 "Ізоляція капітана"
BAM_captains_isolation_desc:0 "Чоловік, відомий як Шип-Брейкер, носив свої кольори під багатьма іменами протягом свого життя, але Шип-Брейкер — це ім'я, яке він використовував, коли його проблеми нарешті закінчилися, і саме це щасливе ім'я він і залишив за собою. Але до цього він був самотнім спадкоємцем корабля, занадто великого для того, щоб один чоловік міг ним керувати. І все ж він ніколи не збирав постійну команду. Як він це робив? Як ти думаєш, чому його прозвали "Шип-Брейкером"?"

BAM_rears_its_head:0 "Ізоляція капітана"
BAM_rears_its_head_desc:0 "Коли Шип-Брейкер був набагато молодшим, у нього не було великих перспектив. Так, у нього був великий корабель, але коли він отримав цей корабель, він не отримав і його колишню команду, а плітки поширювалися через затоку швидше, ніж він міг їх обігнати. Але в його ізоляції він випадково став саме тим чоловіком, який виявився в потрібному місці в потрібний час, щоб зробити щось чудове. Він допоміг народити місто."

BAM_cannery_captain:0 "Капітан Каннері"
BAM_cannery_captain_desc:0 "Хоча інколи Шип-Брейкер сумує за своїм минулим життям на відкритих хвилях, більшість цього минулого була самотньою, і він точно не сумує за цією частиною. Йому знадобилося багато часу, щоб звикнути до ідеї оселитися і взяти на себе відповідальність за людей, які зверталися до нього за керівництвом, але він уже старий чоловік, і, враховуючи всі інші варіанти, якими могла піти його життя, він радий тому, що має зараз."

BAM_bayou_life:0 "Життя на Блакитному Байу"
BAM_bayou_life_desc:0 "Минуло чимало часу з останнього розширення операцій Каннері, тож давайте займемося цим. З огляду на те, що Каннері побудовано на острові в болотах, жодна земля тут не є стабільною, але тут досить металевого сміття, щоб встановлені стовпи в мокрому грунті мали більш-менш стабільні результати."

BAM_trade_orleans:0 "Торгівля з Орлеаном"
BAM_trade_orleans_desc:0 "Орлеан запропонував нам ще одну партію зброї. Це буде велика ціна, але їхня зброя першокласна, і нам не доведеться обмінюватися зайвими послугами, щоб отримати хороші відносини з Картелем Зброї. Можливо, варто скористатися цією пропозицією, враховуючи, як бідно виглядають наші нинішні арсенали. Не знаємо, коли пірати знову з'являться."

BAM_trade_houston:0 "Торгівля з Г'юстоном"
BAM_trade_houston_desc:0 "Однією з хороших рис підходу, який використовують Ракети до управління в Г'юстоні, є те, що звичайні люди працюють на землі та забезпечують себе без великого втручання зверху. Декілька місцевих фермерів і збирачів відправили нам пропозицію передати ресурси, які вони знайшли, за трохи грошей; давайте скористаємося цією пропозицією."

BAM_gumbo:0 "Каджунське життя"
BAM_gumbo_desc:0 "Хоча першопоселенці, які оселилися на острові Марш, були переважно з інших місць, люди з Порту Кіперморт живуть тут дуже, дуже давно. Після падіння бомб багато каджунів з південного Луїзіани оселилися якомога ближче до узбережжя, щоб скористатися відновленням судноплавства та рибальської індустрії. Отримати деяких з цих людей для збору розвідданих, безумовно, надасть нам перевагу перед тими, хто не говорить на їхньому унікальному діалекті старого французького."

BAM_language:0 "Мертві мови відроджуються"
BAM_language_desc:0 "Спочатку ми думали, що мати ще одну мову в нашому розпорядженні буде зручним для надсилання таємних повідомлень та інших подібних справ, але деякі з наших людей дійсно зацікавилися її вивченням. Більшість людей, які живуть на острові Марш, не є каджунами — більше того, більшість з них навіть не з Луїзіани — але всі вони готові оселитися та пустити коріння на своїх нових землях. Давайте підтримувати те, що перетворюється на чудове культурне відродження."

BAM_packed1:0 "Пакуємося туди"
BAM_packed1_desc:0 "Техас останніми роками справді став схожим на бджолине гніздо з ростом техаського націоналізму. Це абсолютно дивна ідея, і не кожен на узбережжі хоче приєднуватися. Невелика кількість людей з-за Г'юстона вирішили, що вони б віддали перевагу життю піонера на відкритих хвилях, а не громадянству в організованій державі, і де ж краще вирушити, як не до Каннері?"

BAM_packed2:0 "Пакуємося сюди"
BAM_packed2_desc:0 "Гаразд, можливо, це не було найкращою ідеєю — просто прийняти тисячі нових громадян на вже переповнений острів. Нам доведеться трохи перерозподілити людей між Каннері та Кіпермортом. Можливо, зможемо переконати частину з них приєднатися до міліції і допомогти нам захиститися від піратів?"

BAM_shrimpy:0 "Ще одна партія креветок"
BAM_shrimpy_desc:0 "Люди, ці пірати справді думали, що зможуть просто вкрасти цілу партію свіжих гulf креветок просто перед нашими носами. І хоч як Шип-Брейкер і не хоче це визнавати, вони ледве не втекли з ними. Однак, з новою історією та повним вантажним відсіком, BMV Larry's Tomato готовий вирушити до кубинських ринків. Ще один задоволений клієнт!"
 
BAM_festung:0 "Наше для захисту"
BAM_festung_desc:0 "Тепер, коли різноманітні піратські групи затоки знають, що ми достатньо компетентні, щоб захищати власні доки, можливо, вони будуть нападати на нас трохи рідше. Давайте використаємо цей короткий перепочинок, щоб подивитись в напрямку суші та зрозуміти, що ж відбувається навколо нас... Вибачте, скільки людей вважає, що цей Байу з якоїсь причини є їхньою власністю по праву?"

BAM_patrol1:0 "Перша патрульна"
BAM_patrol1_desc:0 "Ці мерзотники з Лафайєта напали на нас! Що ж ми їм зробили? Вони одне з наших найближчих ринків! В будь-якому випадку, ми вже захопили кількох з їхніх людей і запитали, чому вони нас атакують, і вони всі розповіли одне й те ж: вони побачили нас з рабами. ХА! Ми вільний торговий порт, відомий тим, що бореться з піратами та работоргами одночасно; якби ми добровільно платили за те, щоб ще більше людей тіснилися на нашому острові!"

BAM_patrol2:0 "Безглуздість закону"
BAM_patrol2_desc:0 "Хм. Виявляється, цей шеф патруля, Келлахан, справді вірив, що у нас є раби, і що вони є частиною його підопічних. Як він це дізнався? Завдяки одному звіту патрульного. Саме йому й слід було б отримати такий урок за те, що покладав усю свою довіру на одного хлопця, який ледве вийшов з дитинства. Але ж... це була дурна війна."

BAM_maw1:0 "Алігатори в болоті"
BAM_maw1_desc:0 "Ота «Собек Могутній» з Олександрії нарешті вирішила зруйнувати все хороше, що є у нашому маленькому шматочку узбережжя, атакуючи нас безпосередньо. Це справжнє прикрість; Олександрія могла б бути чудовим клієнтом, якби не… ну, ти зрозумів… не були рабовласницькими канібалами-сочувальниками."

BAM_maw2:0 "Падіння Собека"
BAM_maw2_desc:0 "Що ж, ми відправили банду Гаторів з Олександрії на їхню ранню могилу. Хоча, не зовсім ранню; ці мерзотники протрималися хоча б півстоліття до того, як ми сюди потрапили, наскільки ми знаємо. Та все ж, тепер, коли їх немає, можливо, Олександрія стане більш респектабельним клієнтом у майбутньому."

BAM_texas1:0 "Великий техаський план"
BAM_texas1_desc:0 "Ну, ми знали, що рано чи пізно виникне якась велика проблема, але не багато з нас справді думали, що це буде так погано. Ось це велика проблема: Тимчасова Республіка Техас вирішила, що наш скромний байу тепер є їхньою головною ціллю для анексії. Кажуть, що вони хочуть зробити наші землі частиною лояльної клієнтської держави, але давай, ми маємо довіряти імперіалістичному альянсу мутантів та рицарів-братів? Так не буде. Давайте діяти."

BAM_texas2:0 "Самотня зірка приборкана"
BAM_texas2_desc:0 "Ну, так чи інакше, Техас більше не є загрозою. Великі амбіції молодої Республіки були придушені, і техаський прапор, ймовірно, ще якийсь час не буде використовуватися в нашому куточку Пустки. Це дійсно було близько."

BAM_indians1:0 "Індіанці річки"
BAM_indians1_desc:0 "Індіанці з Чокто вийшли з своїх укриттів, казино і верхових коней і вирішили, що направляться на південь, щоб захопити контроль над гирлом Міссісіпі. Очевидно, ми не дозволимо їм це зробити. Давайте, у нас є власна культурна меншина, за якою треба доглядати; залиште свої степи!"

BAM_indians2:0 "Не буде проблемою"
BAM_indians2_desc:0 "Що ж, оповідачі з Федерації Степів вирішили просто забратися. Можливо, вони налякані тим, що ми можемо зробити, якщо вони нас сильно розсердимо. Ну, це на користь нам; давайте переконаємося, що відправимо кілька партій риби їхнім шляхом і сподіваємось, що це буде кінець їхнім південним амбіціям."

BAM_CRINKLE_HIIIIIIIII:0 "Помста Крінкла"
BAM_CRINKLE_HIIIIIIIII_desc:0 "Крінкл, той мутант-пірат, якого патрульники допомогли нам відбити ще в 63-му, схоже, вирішив зробити ще одну спробу захопити гирло Міссісіпі. Чутки кажуть, що цього разу він має більш стратегічну мету, ніж просто грабувати на здобич, і планує додати Каннері до своєї зростаючої колекції земель, але ми не будемо просто лягати і здаватися. Нехай він спробує все, що хоче; ми будемо готові."

BAM_mongers2:0 "Ржавий меч-сwordfish затоплений"
BAM_mongers2_desc:0 "З другим поразкою Крінкла, ми майже впевнені, що він більше не буде проблемою. Ходять чутки, що його бачили на відкритих морях з іншим кораблем і новою командою, але ж… це лише чутки. У нас є труп Ржавого Меча, щоб довести це."

BAM_festung_fr_this_time:0 "Те, що варто захищати"
BAM_festung_fr_this_time_desc:0 "З усіма потенційними загрозами для Каннері приборканими, мер Шип-Брейкер вирішив почати перехід до відходу від свого прямого правління. Чоловік старіє і хотів би колись піти на пенсію, а люди, що керують Каннері, із задоволенням зроблять його останні роки так приємними, як він цього хоче. Для людини, яка зробила так багато для нас? Все для старого капітана."

BAM_shrimpment:0 "Ще одна партія креветок"
BAM_shrimpment_desc:0 "З усім впорядкованим, Шип-Брейкер вирушає у невеликий відпочинок. Він сказав, що повернеться через кілька днів, і що він ще не йде на пенсію, але хоче трохи подивитися на порти, які він опосередковано допоміг захищати протягом років. Не можна його в цьому звинувачувати."