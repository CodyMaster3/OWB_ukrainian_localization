BAM_bayview_dinky:0 "§gЗ'являється USS Bayview. Хоч і маленький, він є свідченням спадщини Ship-breaker'а.§!"
BAM_bayview_gettin_there:0 "§gЗ'являється USS Bayview, відомий своєю елегантною формою.§!"
