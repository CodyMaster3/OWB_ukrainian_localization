BAM_informality:0 "§g"Дивись, Сюзан, тобі не потрібно називати мене мером чи капітаном. Ти можеш просто називати мене—"§!"

BAM_take_us_to_your_beer:0 "§gДіти жадібно вилили вміст келихів у свої роззявлені роти, впали на землю, захлинаючись, потім піднялися, сміючись. Вони подякували Сюзан і вибігли з бару, перш ніж хтось інший занепокоївся їхнім станом.§!"

BAM_seagulls:0 "§g"Йду, йду." Він вийшов з балкона і закрив люк на виході з перону. Потім поклав деякі папери, які читав, і попрямував до дверей кабінету, відчинив їх. Сюзан стояла з букетом квітів. "Ну, ніколи б не подумала."§!"

BAM_cancer:0 "§gShip-Breaker впав на коліна і схопився за живіт, стогнучи. "О, Боже, що... що з тобою..."\nShip-Breaker, червоний від обличчя, підняв руку, даючи сигнал їй зупинитися. Після кількох низьких стогонів і хрипів його обличчя розслабилося, і він видихнув довгий зітхання. §!"

BAM_grimace:0 "§gМер кинув саркастичний погляд на скаліченого чоловіка. "О. Як це сталося?"\n"Моя стара команда, якщо ти віритимеш. Прив'язали всю команду корабля Leeroy's Louch і намагалися втекти з кораблем."§!"