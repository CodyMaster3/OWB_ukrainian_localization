l_english:
bam_obvious_target:0 "Очевидна ціль"
bam_obvious_target_desc:0 "Наша позиція як порту безпосередньо на узбережжі Мексиканської затоки чудово сприяє нашій здатності консервувати та відправляти недавно спійману рибу та креветки різним клієнтам по всій затокі та в Карибському морі, але наша легка доступність і відносно мала оборона узбережжя також означають, що ми часто стаємо мішенню для піратських нападів за принципом "напад і втеча". Минуло кілька років з останнього разу, але кожен кілька риболовних сезонів з'являється один з тих нахабних шлюбів, які вважають, що можуть просто підійти до нас і вкрасти корабель або вимагати хабар за те, щоб піти. Це не дуже добре для стабільності, але це означає, що багато альтруїстів та приватирів люблять служити в нашому флоті через ймовірність безпечного виклику."

bam_merchant_cannery:0 "Торговий консервний завод"
bam_merchant_cannery_desc:0 "Каннері було засновано трохи більше півстоліття тому невеликою групою підприємців, які хотіли відновити старий консервний корабель Mama Dulces, який прибоївся на Марш-Острів відразу після Великої війни. Це підприємство виявилося успішним, на острів прибула невелика хвиля імміграції, був побудований порт на південному сході острова з набережною дорогою для малих транспортних засобів, щоб перевозити вантажі до та з Каннері, і з того часу ми успішно ведемо свою справу. Ще з часів заснування наших скромних поселень, ми привабили торгові інтереси з усієї затоки, і багато малих прибережних міст уклали з нами угоди, щоб допомогти нагодувати своїх мешканців. Ми тримаємо ціни низькими, поки вони відправляють нам всі порожні банки та металобрухт, які знаходять, і система здається досить стабільною для довготривалих прибутків."

bam_merc_cannery:0 "Меркантильний консервний завод"
bam_merc_cannery_desc:0 "Каннері було засновано трохи більше півстоліття тому невеликою групою підприємців, які хотіли відновити старий консервний корабель Mama Dulces, який прибоївся на Марш-Острів відразу після Великої війни. Це підприємство виявилося успішним, на острів прибула невелика хвиля імміграції, був побудований порт на південному сході острова з набережною дорогою для малих транспортних засобів, щоб перевозити вантажі до та з Каннері, і з того часу ми успішно ведемо свою справу. Навіть з найперших днів ми зазнали нападів піратів, але тодішній капітан Шип-Брейкер пішов на крок, аби розповсюдити чутки, що ми готові платити хороші гроші за захист від дрібних нападів, і так прибули найманці. Реалістично ми не варті зусиль для нападу від більшості найбільших піратських груп Карибів, тому тільки дрібні хлопці намагаються на нас напасти, і це абсолютно підходить для найманців, які приходять до Каннері, шукаючи щасливу пенсію та випадкову легку битву."

bam_mariner_cannery:0 "Морський консервний завод"
bam_mariner_cannery_desc:0 "Каннері було засновано трохи більше півстоліття тому невеликою групою підприємців, які хотіли відновити старий консервний корабель Mama Dulces, який прибоївся на Марш-Острів відразу після Великої війни. Це підприємство виявилося успішним, на острів прибула невелика хвиля імміграції, був побудований порт на південному сході острова з набережною дорогою для малих транспортних засобів, щоб перевозити вантажі до та з Каннері, і з того часу ми успішно ведемо свою справу. Хоча найманці та торговці достатньо часто зустрічаються, наш скромний порт став улюбленою зупинкою для багатьох судноплавних компаній і приватних операторів, які здійснюють подорожі по затоках, а наш надійний розклад та порт без злочинів заслужили позитивну репутацію серед моряків далеко і широко."

bam_francophones:0 "Сучасні франкомовні"
bam_francophones_desc:0 "Каджуни — це невелика культурна залишка старого світу Америки. Здається, що колись їх було багато, але тепер залишилась основна група в Порт-Сайперморте та відокремлена група в Новому Орлеані. Вони говорять американською англійською, як і всі нормальні люди, але вони також вільно володіють дивним діалектом вимерлої мови, званої «французька». Багато з них здається, що їх спадщина має якусь важливість. Ми цього справді не розуміємо, але той факт, що вони знають мову, якою більше ніхто не користується, зробив їх особливо корисними, коли йдеться про те, щоб дізнатися, що роблять всі навколо нас. Неможливо зрозуміти, чи хтось шпигує, чи просто дурний, коли він говорить з вами якимось нісенітним язиком."

bam_francophones_alt:0 "Сучасні франкомовні"
bam_francophones_alt_desc:0 "Каджуни — це невелика культурна залишка старого світу Америки. Здається, що колись їх було багато, але тепер залишилась основна група в Порт-Сайперморте та відокремлена група в Новому Орлеані. Вони говорять американською англійською, як і всі нормальні люди, але вони також вільно володіють дивним діалектом вимерлої мови, званої «французька». Багато з них здається, що їх спадщина має якусь важливість. Ми цього справді не розуміємо, але той факт, що вони знають мову, якою більше ніхто не користується, зробив їх особливо корисними, коли йдеться про те, щоб дізнатися, що роблять всі навколо нас. Неможливо зрозуміти, чи хтось шпигує, чи просто дурний, коли він говорить з вами якимось нісенітним язиком."

bam_post_raid_recovery:0 "Зусилля по відновленню після нападу"
bam_post_raid_recovery_desc:0 "З новою невдалою спробою піратського нападу за нашими плечима, настав час для відновлення. Ми втратили кількох хороших людей, коли вони підірвали ворота безпеки, що охороняють головний вхід в наш порт, але окрім цього не було завдано великої шкоди. Ми компенсували родинам загиблих і відправили наш невеликий флот розлючених найманців переслідувати піратів до самого кінця затоки і назад, але, по суті, нічого не змінилося через цей напад. Все ж, давайте використаємо це, щоб змусити кілька людей попрацювати трішки важче, поки це ще свіжо в їхніх спогадах."

bam_post_raid_recovery_alt:0 "Зусилля по відновленню після нападу"
bam_post_raid_recovery_alt_desc:0 "З ще однією невдалою спробою піратського нападу позаду, настав час для відновлення. Ми втратили кілька хороших людей, коли підірвали ворота безпеки, що охороняють головний вхід в наш порт, але окрім цього не було завдано великої шкоди. Ми компенсували родинам загиблих і відправили наш невеликий флот розлючених найманців переслідувати піратів до самого кінця затоки і назад, але, по суті, нічого не змінилося через цей напад. Все ж, давайте використаємо це, щоб змусити кілька людей попрацювати трішки важче, поки це ще свіжо в їхніх спогадах."

bam_honest_work:0 "Не багато, але це наш дім"
bam_honest_work_desc:0 "На відміну від багатьох інших дурнів по всій затоці, немає жодної людини в цій Байо, яка мріє забрати землю і розширити наші претензії. Хто ми, грабіжники? Імперіалісти? Та ні, ми просто група скромних рибалок і приватирів. Поки хвилі вільні для плавання, нам не потрібна чужа земля. Проте ми будемо наївними, якщо подумаємо, що інші люди не хочуть нашої землі з якоїсь причини чи іншої, тому давайте зробимо зусилля, щоб переконатися, що вони не зможуть забрати нашу землю. Було б справжньою шкодою дозволити комусь, хто не заслуговує, забрати такий гарний дім."

bam_honest_work_alt:0 "Не багато, але це наш дім"
bam_honest_work_alt_desc:0 "На відміну від багатьох інших дурнів по всій затоці, немає жодної людини в цій Байо, яка мріє забрати землю і розширити наші претензії. Хто ми, грабіжники? Імперіалісти? Та ні, ми просто група скромних рибалок і приватирів. Поки хвилі вільні для плавання, нам не потрібна чужа земля. Проте ми будемо наївними, якщо подумаємо, що інші люди не хочуть нашої землі з якоїсь причини чи іншої, тому давайте зробимо зусилля, щоб переконатися, що вони не зможуть забрати нашу землю. Було б справжньою шкодою дозволити комусь, хто не заслуговує, забрати такий гарний дім."

bam_shrimpy:0 "Регіональний центр постачання"
bam_shrimpy_desc:0 "Після того, як ми нещодавно відбили атаку широкої різноманітності людей з Техасу та Луїзіани, які хотіли забрати нашу Mama Dulces, порт Каннері здобув собі ім'я як на військових, так і на дипломатичних каналах затоки. Ми — аутсайдер, за якого всі можуть вболівати, і ого, ми справді пережили момент Давида і Голіафа на деякий час. Так чи інакше, зараз щось дивне відбувається в порту Каннері. Люди все ще приїжджають за бізнесом, судноплавством, дозаправкою та найманцями, як зазвичай, але є новий тип людей, які зупиняються, і це дійсно збиває з пантелику місцевих. Ми почали отримувати туристів. І це страшна ідея."