l_english:
nf_bam.1.t:0 "Людина з багатьма роботами"
nf_bam.1.d:0 "Шип-Брейкер витріщився у вікно траулера з лівого боку. Хвилі ставали все менш глибокими, і слід від корабля зникав все швидше. «Здається, ми на місці, а?» — сказав він, повертаючись до порожньої тарілки на столі перед собою, шкодуючи, що так поспішив.\nЙого два супутники підняли голови від своїх нотаток. «Схоже на те», — зауважила Сьюзан.\n«Ну, це було не так довго, як я думав», — сказав Чако, худий радник мера, встаючи і розтягуючись. «Ви будете в своєму офісі завтра вранці, пане мер?»\nШип-Брейкер зітхнув. «Так, буду там».\n«Добре. Побачимося тоді». Радник відкрив двері каюти і зник за ними. Шип-Брейкер і Сьюзан тихо сиділи кілька хвилин, слухаючи гамір ззовні.\n«Ну, ще раз дякую за інтерв'ю, пане мер. Я обов'язково опублікую його в тижневій газеті в неділю. Було приємно», — сказала вона."
nf_bam.1.a:0 "§gСьюзан простягнула руку через стіл, і Шип-Брейкер потиснув її.§!"

nf_bam_events_continued.1.t:0 "Людина з багатьма роботами, продовження"
nf_bam_events_continued.1.d:0 "Сьюзан встала і швидко дістала свою ручку і блокнот. «Вибачте, пане мер. Поки я на роботі, тільки титули та прізвища. Якщо хочете знайти мене після роботи, тоді може щось інше, але сонце ще на небі, і я маю роботу», — сказала вона, оглядаючись і потираючи себе. «Дякую ще раз, насправді». Вона зробила легкий уклін і вийшла. Мер кинув їй половинчасту хвилю, яку вона занадто швидко пропустила. Пролунав тупий удар, коли корабель вдарився об причал. Шип-Брейкер сидів тихо в обідній каюті ще кілька хвилин, а потім, нарешті, встав, щоб піти. Спина і живіт боліли.\nКоли він піднімався по незграбно побудованих сходах на головну палубу BMV Topper, капітан судна помітив його і підійшов. Він вигукнув кілька останніх наказів своїм членам екіпажу, а потім звернувся до мера з потиском руки.\n«Ну, сподіваюся, все пройшло добре?»\n«Так, дякую ще раз, що дозволили мені приєднатися, хоч я і був не дуже корисним. Завжди приємно вийти і не турбуватися про всю роботу самому», — посміхнувся він, згадуючи своє старе судно. USS Bayview був судном, надто великим, щоб Шип-Брейкер міг керувати ним сам, але він це робив. За роки воно отримало свою частку подряпин і вм'ятин, але в кінці кінців все склалося. Якби тільки не стало відомо, що його позашлюбні батьки були відповідальні за одне з найбільш резонансних вбивств століття, він, можливо, зміг би знайти поважний екіпаж для найму...\n«Завжди приємно, пане мер», — сказав він, виходячи зі своїх думок. «Ну, у мене є риба, яку треба вивантажити. Гарний улов сьогодні. Тримайся, і дай знати, якщо тобі знову потрібне спокійне місце». Шип-Брейкер кивнув з вдячністю і вирушив до трапу. Він майже спіткнувся на шляху вниз, але встиг зловити себе і про себе засміявся, думаючи, що ніколи не спіткнувся на своєму власному кораблі. Він ще не такий старий."
nf_bam_events_continued.1.a:0 "Його корабель був дуже гарний."
nf_bam_events_continued.1.b:0 "Його корабель був вражаючим і сучасним."
nf_bam_events_continued.1.c:0 "Його корабель виглядав так, що міг би потопити будь-яке судно."

nf_bam.2.t:0 "Приязні перехожі"
nf_bam.2.d:0 "Мер Шип-Брейкер прогулювався вздовж порту Cannery з руками в кишенях свого плаща, киванням привітавши майже кожного моряка та рибалку, з яким зустрічався. Звісно, його кивання було лише неробочою відповіддю на кивання інших. Декілька осіб біля води навіть зупинялися, щоб задати питання або спробувати завести дрібну бесіду, і Шип-Брейкер відповідав їм, поки вони не відставали. Жоден не залишався більше хвилини чи двох. Коли він дійшов від порту до набережної, він, мабуть, привітав сотню осіб, і багато хто помітив його з відстані. Він знайшов лавку і сів. Сонце високо в небі, а звуки криків чайок і гамір чоловіків та жінок, які кричать один одному через десятки пришвартованих суден, стали спокійним фоном. Він відкинувся назад і закрив очі.\nКоли він прокинувся, сонце змінило південне небо на художній градієнт червоного та жовтого. Шип-Брейкер підняв руку, щоб витерти слину з рота, і трохи потягнувся."
nf_bam.2.a:0 "Я вже почав сумніватися, чи прокинешся ти", §gсказав хтось.§!

nf_bam_events_continued.2.t:0 "Приязні перехожі, продовження"
nf_bam_events_continued.2.d:0 "Шип-Брейкер не здивувався — нічого не може здивувати тебе, коли ти так старий, — але все ж подивився, побачивши, що Сьюзан сидить на лавці поруч з ним. Вона виглядала значно старшою без макіяжу, який вона зазвичай носила на роботі. «Отже, насолоджуєшся видом чи просто даєш іншим можливість насолодитися тим, що бачать тебе?» — запитала вона.\nМер посміхнувся. «Це не найкращий день», — сказав він. «Просто відчуваю ностальгію. Ось і все».\nВона зітхнула. «Розумію тебе. Недавно я була просто дівчиною-письменницею в Сайперморті, а ти був лише сином дивного вбивці з кораблем, більшим за твою голову. Іноді я сумую за тими днями. Але мої діти ніколи не розуміли, коли я їм це казала», — сміялася вона. «Тепер у них є свої кораблі, а я пишу для газети, яка навіть не існувала півстоліття тому, коли я хотіла стати журналістом».\nШип-Брейкер простягнув руку і потиснув їй ногу. «Ну, ти досягла своєї мрії. Будь щаслива з цим».\n«Я так і роблю», — знову зітхнула вона і встала. «Тільки шкода, що Джеймс не побачить цього».\n«Так, я сумую за ним». Мер також підвівся. «Кудись йдеш?»\n«Ймовірно, до бару Гленна. Багато відвідувачів у місті, і я хочу розвідати деякі історії про інші місця. Хочеш приєднатися?»\n«Меркантильні хлопці можуть трохи розговоритися, якщо побачать мера. Вони люблять хвалитися своїми пригодами. Пішли зі мною». Сонце повільно сідало за горизонт, поки пара не рушила в бік бару."
nf_bam_events_continued.2.a:0 "Всі знають нас за нашу хорошу рибу."
nf_bam_events_continued.2.b:0 "У нас часто бувають бійці."
nf_bam_events_continued.2.c:0 "До нас приїжджають чудові моряки з усіх куточків."

nf_bam.3.t:0 "Основа дому"
nf_bam.3.d:0 ""Та я вам кажу, це кит має бути мутованим чи щось таке. Це було безумство!"\nДруг моряка нахилився ближче. "А найкрутіше? Тварюка мала цілу бамперштовхнувку, що стирчала прямо з її лоба! Якась мутантна істота, мабуть, наблизилася і вирішила стати близькою, бо та штука не хотіла помирати!"\nСьюзан закінчила записувати і поклала ручку. "Ну, це дійсно звучить як неймовірна історія. То тільки ви двоє бачили це, чи хтось інший був свідком?"\n"Ну, ми, е-е..." Два хлопці подивилися один на одного. Вони не могли бути старші за двадцять, подумав мер. "О! Очевидно, тато був там, правда?" Інший хлопець енергійно кивнув. "Ден Ренчер. Це наш тато. Він бачив все. Живе біля західного причалу в червоному будиночку на човні з зеленими смугами. Передавайте, що ми сказали привіт, добре?"\n"Я зроблю це завтра, коли знову зв'яжуся з ним. Дякую за вашу версію подій." Вона записала ім'я і опис іншого свідка і перекотила два чарки на стіл до хлопців."
nf_bam.3.a:0 "Як ми і обговорювали. Приємно мати справу."

nf_bam_events_continued.3.t:0 "Основа дому, продовження"
nf_bam_events_continued.3.d:0 ""Ну, це, здається, була успішна інтерв'ю", — зауважив Шип-Брейкер. Він ковтнув свою порцію самогону. Його шия на мить стиснулася, а потім повернулася до нормального стану з приємним теплом в животі. "Це..." Він прокашлявся. "Це жахливо. Але люблю це".\nСьюзан трохи сміялася. "Ну, це буде хорошою історією, якщо вона витримає перехресний допит". Вона зробила ковток з власної дуже безалкогольної води. Потім вона оглянула бар. Встала і голосно сказала: "Є ще хто з історіями для недільної газети? Плачу напоями!" Почулися кілька легких гуркотів з усіх боків бару, але тільки один чоловік з численними шрамами на обличчі та застарілим шкіряним жакетом підійшов. Він сів за стіл, і Сьюзан знову влаштувалася.\n"Отже, яке твоє ім'я і яка твоя історія?"\nЧоловік витягнув з пальта люльку і запалив її. Шип-Брейкер відчув можливість знайти співрозмовника і витягнув свою люльку. Він передав її шрамованому чоловікові, який запалив її без слів. Мер кивнув подякою і зробив ковток. "У мене більше історій, ніж ви могли б заповнити за рік газет", — почав він грубим голосом, "але я не тут для цього". Сьюзан відкинулася назад і зробила обурене обличчя. "Містер Шип-Брейкер". Мер подивився на чоловіка, не зацікавлений. "У мене є досвід у портових нальотах і піратстві. Я той тип чоловіка, якого не захочете бачити на цьому острові. Але я хочу вийти на пенсію, і я хочу взяти реванш з командою, яка мене зрадила. Якщо ви приймете мене, я можу дати кілька порад, які вам можуть стати в пригоді".\nШип-Брейкер підняв брову. "Цікаво. Як тебе звати?"\n"Капітан Клайд. Раніше був на приватному судні «Сльози Бенедикто»".\n"Я пам'ятаю історії про цей корабель. Побачимося завтра в моєму офісі в Mama Dolces." Чоловік кивнув і вийшов з бару без жодного слова, залишивши Сьюзан в значній плутанині, а Шип-Брейкера з нетерпінням чекати порад рівного собі."
nf_bam_events_continued.3.a:0 "Він знав, що нам доведеться постояти за себе."
nf_bam_events_continued.3.b:0 "Він вважав, що болота змінюють ситуацію."
nf_bam_events_continued.3.c:0 "Він завжди був агресивною людиною."

nf_bam.4.t:0 "Хвилі в болітті"
nf_bam.4.d:0 ""Ну, добре, що ми їх спіймали." Тимчасова платформа Шип-Брейкера на південній стороні його офісу мала чудовий вигляд на рівнинні території острова Марш. Вирізана зі сторони Mama Dulces — заводу-корабля, що слугував основним місцем для всіх консервних операцій на Каннері, а також мала кілька офісних приміщень навколо офісу мера — вона надавала стратегічний огляд, щоб відчути природу острова, і водночас була відмінним місцем для короткого перепочинку. "Я переглянув цифри. Ми добре працюємо на своєму боці, але є кілька клієнтів на Кубі, яким дуже потрібна ця поставка. Буду радий побачити, що вона належним чином захищена і відправлена".\n"Дуже добре, містере мер, чи слід мені повідомити їх, що вони можуть запускати?"\n"Так, зроби це. І нехай подвоять перевірку набоїв про всяк випадок".\n"Зрозуміло". Асистент Шип-Брейкера покинув кімнату. Мер продовжував дивитися на болотисту землю в центрі острова. Mama Dulces була викинута на беріг на північному боці острова, тому з будь-якого з вікон чи платформ, піднятих на десять поверхів, південний вигляд давав чітку панораму всього острова і горизонту за ним. На західному боці острова зростав ліс. Доріжки з дощок та вільного гравію перехрещували острів у кількох місцях, хоча більшість доріг закінчувалися або біля заводу-корабля, або біля портового міста на південному сході острова. Шип-Брейкер посміхнувся, коли невелика зграя водяних птахів пролетіла поруч з кормою Dulces, квакуючи по дорозі. Це було дуже розслаблююче місце, і воно допомагало заспокоїти його час від часу болі в животі."
nf_bam.4.a:0 "§gПісля кількох хвилин мрійливого споглядання, стукіт у двері вирвав його з роздумів.§!"

nf_bam_events_continued.4.t:0 "Хвилі в болітті, продовження"
nf_bam_events_continued.4.d:0 ""Не дякуй мені," — сказала вона, вручаючи пакунок в руки мера. "Затриманий офіційний подарунок від Bayou Post як подяка за інтерв'ю кілька місяців тому з тимчасовим генеральним директором Bayou Motors, та іншими подібними титулами." Вона посміхнулася. "Ми давно не спілкувалися, вирішила зайти, подивитися, як ти там." Мер пробурмотів. "Не нагадуй мені. Пірати, яких ледве спіймали, бо один з них активував сигналізацію, яку ми встановили лише тому, що один колишній пірат прийшов з хвиль, пропонуючи свої послуги, рекордні прибутки попри те, що середнє харчування стало падати, а тепер ще й ця справа з Техасом і рештою Луїзіани, що почали розпускати заготовки через завоювання, чи що. Яка плутанина." Він залишив офіс, зачиняючи і замикаючи двері за собою.\n"Ну, маєш намір щось робити решту дня? Я просто подумала, може це буде хороша історія, якщо старий мер буде там, коли великий вантаж відправляється, раз вже ми отримали всі ці безкоштовні заголовки через піратів." Вони обоє посміялися, і Шип-Брейкер майже забув нахилитися, проходячи через одні з занадто маленьких дверей Dulces.\n"Гаразд, не думаю, що я робитиму багато чого більше." Він посміхнувся і вдихнув аромат квітів. Вони будуть чудовим подарунком для капітана транспортного корабля."
nf_bam_events_continued.4.a:0 "Пішли вниз і провідемо їх."

nf_bam.5.t:0 "Чисте небо"
nf_bam.5.d:0 "Гудок риболовного траулера пролунав через порт, і BMV Topper почав відходити. Мер Шип-Брейкер обережно тримався за поручень зліва і помахав на прощання невеликій групі людей, що зібралися навколо судна. Він повернеться, знав він, але йому потрібно було трохи втекти від цього всього. Від усього.\n"Ну, мер, як це — бути вільним?"\nДобре, може не від усього. "Освіжаюче. Острів пахне домом, але море пахне життям. Мені тут подобається". Він посміхнувся. "Шкода, що нам довелося так рано вирушити, якщо ми хочемо потрапити на кубинські ринки до вівторка. Хотілося б більше часу сказати на прощання. І випити." \nСьюзан сміялася. "Не хвилюйся, ми запакували цілу трюму повну самогону, а капітан сказав, що ти можеш пити стільки, скільки захочеш.""
nf_bam.5.a:0 "Все, що нам потрібно зробити... Ти в порядку?"

nf_bam_events_continued.5.t:0 "Чисте небо, продовження"
nf_bam_events_continued.5.d:0 ""Вибач. Останній рік або більше я відчуваю періодичні болі в животі." Він гірко сміявся, поки піднімався. "Частина причини, чому я потрібен був на тривалій відпустці — щоб почати відводити Каннері від моєї присутності. Я не звертався до лікаря, але я відчуваю, що це довготривала проблема." Він нахилився через поручень корабля і поглянув на оранжеве сонце, що повільно підіймалося над горизонтом. "Я був тут давно, але одного дня мене не буде. Хотілося б, щоб Каннері навчилися обходитися без мене, поки я ще тут, щоб виправити їхні помилки. Поки що." \n"Я... Я не знала." Шип-Брейкер повернув голову, і помітив, що обличчя Сьюзан стало блідим. Вона виглядала приголомшеною. "Як довго, як ти думаєш...?" \n"О, я не лікар. Ймовірно, рік або близько того. Це мало статися рано чи пізно, і я мав чудовий час, враховуючи, яким міг би бути цей шлях." \nСьюзан обійняла Шип-Брейкера правою рукою і схилила голову на його плече. "Мені так шкода. Якби я знала... Можливо, я б..." \n"Що б ти зробила?" Мер м'яко засміявся. "Ні, це правильний шлях для того, щоб це сталося. Я провів своїх людей через більше криз, ніж більшість чоловіків, ймовірно, очікували б прочитати в історичних книгах протягом своїх життів, і ми зробили навколишній світ кращим. Все, чого ми хотіли, це мир, і ми боролися, щоб зберегти цей мир. Все це виходить від хлопця, який виріс сам, без навіть родини, щоб про нього подбати. Не досить благородно для тебе?" \n"Так, але це все-таки сумно, не здається?" \n"Мм. Можливо." Вони затихли на момент, поки сонце повністю не піднялося в ранковому небі. "Але, знаєш, якщо це має якесь значення, уявляю, я отримаю дуже розкішну передову некролог, коли помру, то це вже щось варте." Окрім рідкісних криків чайок з групи птахів, що вирішили поїхати з ним на борту, решта сходу сонця пройшла в тиші, з лівою рукою Шип-Брейкера на поручні і правою рукою Сьюзан на його.
nf_bam_events_continued.5.a:0 "Я думаю, я зробив достатньо."

nf_bam.6.t:0 "Ще один піратський напад"
nf_bam.6.d:0 "Мер спав чудово спокійною нічною дрімотою, коли раптово вибух пролунав по набережній Каннері. Прокинувшись від шоку, Шип-Брейкер піднявся з ліжка, потер обличчя і потягнувся за окулярами на столику. Потрапивши на них, він випадково збив їх з тумбочки і впустив на підлогу. Він простогнав і вийшов з ліжка, обережно уникаючи наступити на окуляри. Одягнувши їх, він поглянув у вікно і його обличчя стало серйозно злим. Зовні ще була ніч, але в далечині на порту вже піднімався великий стовп диму. Він натягнув свій плащ і поспішив вийти з кімнати.\nЦе зайняло лише кілька хвилин, щоб дістатися до порту, оскільки його будинок був побудований настільки близько до порту, наскільки це було можливо, без порушення складів порту. Він побачив Клайда — колишнього пірата, що працював охоронцем — стояв поруч з кількома охоронцями в цианових уніформах. Він підійшов до них, легенько провівши пальцями по бойовому ножу у правому кишені.\n"Мер."\n"Клайде. Що сталося?""
nf_bam.6.a:0 "Піратський напад, мер."

nf_bam_events_continued.6.t:0 "Ще один піратський напад, продовження"
nf_bam_events_continued.6.d:0 "Шип-Брейкер стиснув губи. "Лауч. Це не кубинське вантажне судно, на яке ми завантажували рибу і креветок протягом останнього місяця?" \n"Так. Їхній план — мій план, спочатку — полягав у використанні динаміту, щоб підірвати сталеві ворота, що охороняють порт, і просто втекти вночі. Але дурні не змінили план, коли вчинили заколот. Я не заперечую, якщо хочеш переслідувати їхній корабель. Я б лише потребував кількох людей за спиною і міг би переконати свою колишню команду здатися і піти на пенсію разом зі мною. Але якщо ти забереш корабель і вирішиш використовувати його для бою, я б хотів бути його капітаном ще раз. Можеш бути певним, я не ризикну своїм планом на пенсію". Обидва сміялися.\n"Добре, ми додамо його до нашої колекції. Ще раз дякую за допомогу."\n"Просто роблю свою роботу, мер." Шип-Брейкер залишився достатньо довго, щоб допомогти підрахувати жертви та лікувати поранених після вибуху на воротах порту. Двоє полонених були взяті з мосту Лауча Лірі, але це були лише молоді хлопці, які не мали б великої користі ані як полонені, ані як джерело інформації. Врешті-решт, Шип-Брейкер втомився, і раптовий біль нагадав йому, що йому слід повернутися в ліжко. І саме туди він і вирушив. Решту проблем можна було вирішити вранці."
nf_bam_events_continued.6.a:0 "Що нам робити з цими двома?"

news_bam_oh_he_dead.1.t:0 "Мер Шип-Брейкер помер!"
news_bam_oh_he_dead.1.d:0 "ТЕРМІНОВА НОВИНА: Колишній мер Шип-Брейкер, на жаль, помер сьогодні. Відійшов у віці 81 року, він був одним з засновників Каннері багато десятиліть тому і був дуже любленою постаттю навіть у пізні роки свого життя. Дітей у нього не було, але він завжди давав зрозуміти своїми словами і вчинками, що вважає мешканців Каннері своєю родиною. Протягом багатьох років очолюючи поселення і проводячи свій народ через численні дипломатичні та військові кризи, він робив усе можливе, щоб забезпечити Каннері яскравіше майбутнє, ніж те, яке він сам мав за своє довге і багатогранне життя. Похоронна служба відбудеться в цю суботу в парку Гріні, де його тіло буде поховане в громадській могилі о 9 годині ранку. Всі витрати на бранч без морепродуктів покриє компанія Bayou Motors, а церемонія буде повністю відкрита для публіки. Сподіваємося побачити вас там."
news_bam_oh_he_dead.1.a:0 "Його любили, і він буде дуже не вистачати"