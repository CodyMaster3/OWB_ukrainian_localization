BAM_CAPTAIN_SHIPBREAKER_NAME:0 "Капітан Шип-Брейкер"
BAM_CAPTAIN_SHIPBREAKER_DESC:0 "До того, як кілька піонерів з сходу зібралися разом і вирушили на Маршовий острів, щоб відновити старий завод-корабель Bayou Motors, Капітан жив самотнім життям. Ловити старі кораблі, що ще плавали після багатьох років, і тягнути їх на берег, щоб розібрати на металобрухт — не легке завдання, особливо коли старих робочих кораблів з минулого світу вже майже не залишилося. Витягуючи їх з морського дна на цьому надійному судні, USS Bayview, він заробляв капітали на різних операціях з порятунку, які доставлялися до найближчого порту Сайперморт, але з часом просто виживати в цьому жорстокому світі вже стало недостатньо, а поєднання нещасного спадку і відкритих наклепів зробило його нездатним постійно утримувати екіпаж свого корабля.\n\nВсе змінилося, коли люди, які оселилися на Маршовому острові і стали називати себе «Bayou Motors» після компанії, що раніше управляла прибережним консервним заводом, вирішили, що їм потрібен досвідчений капітан, щоб допомогти керувати їх операцією та виступати обличчям нової компанії і поселення. Хтось безсторонній, з харизмою і на кого можна покластися. Містер Шип-Брейкер не був очевидним вибором для цієї роботи, але зважаючи на те, як він допоміг у заснуванні молодого поселення, хороші люди з The Cannery вирішили дати йому шанс. Тепер, виконуючи роль капітана та мера, він зробив все, щоб його нова родина процвітала під його керівництвом і щоб він став невід'ємною частиною їхнього життя — адже він не хотів би втратити цю чудову позицію, на яку просто так потрапив."
BAM_bayou_keeper:0 "Охоронець Баю"
BAM_HAMMOCK_OF_319_NAME:0 "Гамак 319"
BAM_SUSAN_NAME:0 "Сюзанна Ланглі"
BAM_SUSAN_DESC:0 "Сюзанна Ланглі була однією з небагатьох членів оригінальної групи друзів, що допомогли заснувати The Cannery, використовуючи судно Шип-Брейкера як основний транспорт і житло в перші дні. Народилася в маленькому містечку Сайперморт, вона ніколи не мала багато справ, але їй подобалося писати, і вона була в цьому хороша. Вона вирішила, що хоче поїхати в велике місто і стати репортером, як герої з усіх стародавніх історій, які вона читала в дитинстві. Коли вона зрозуміла, що шансів на те, щоб зробити себе відомою в Техасі мало, а шанси вижити в Новому Орлеані ще менші, вона впала в маленьку відчай. Тому коли The Cannery почала ставати самостійним поселенням окремо від Сайперморта, співзаснування місцевої газети з її чоловіком Джеймсом здалося чудовим способом провести час. Вона стала головним репортером Bayou Post і збирала історії для читачів The Cannery протягом останніх півстоліття. Тепер, коли більшість її друзів відійшли від справ, включаючи її колишнього чоловіка Джеймса і близького друга Шип-Брейкера, її одноголосно обрали на першій публічній виборчій кампанії, щоб вона замінила Шип-Брейкера на посаді мера, і вона зробить все можливе, щоб не підвести. Вона вже не молода, але Сюзанна знає, що їй належить продовжувати свою спадщину."
BAM_susan_advisor:0 "Сюзанна Ланглі була однією з небагатьох членів оригінальної групи друзів, що допомогли заснувати The Cannery, використовуючи судно Шип-Брейкера як основний транспорт і житло в перші дні. Народилася в маленькому містечку Сайперморт, вона ніколи не мала багато справ, але їй подобалося писати, і вона була в цьому хороша. Вона вирішила, що хоче поїхати в велике місто і стати репортером, як герої з усіх стародавніх історій, які вона читала в дитинстві. Коли вона зрозуміла, що шансів на те, щоб зробити себе відомою в Техасі мало, а шанси вижити в Новому Орлеані ще менші, вона впала в маленьку відчай. Тому коли The Cannery почала ставати самостійним поселенням окремо від Сайперморта, співзаснування місцевої газети з її чоловіком Джеймсом здалося чудовим способом провести час. Вона стала головним репортером Bayou Post і збирала історії для читачів The Cannery протягом останніх півстоліття."
