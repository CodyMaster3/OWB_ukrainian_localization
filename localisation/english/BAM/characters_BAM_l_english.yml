BAM_MAIDRUM_NAME:0 "Мерлін Мейдрам"
BAM_MERLIN_DESC:0 "Мерлін Мейдрам рибалив у Мексиканській затоці дуже, дуже довго. Він був у Новому Орлеані, коли впали бомби, саме в той момент, коли вирушав в море. Його човен був пошкоджений, він отримав променеву хворобу, але вижив і став гулем, разом з усіма членами його екіпажу. Легенда серед рибалок узбережжя Луїзіани, Мейдрам випадково опинився в порту The Cannery, коли стало відомо, що потрібен новий керівник місцевої ради зайнятості. Мерлін не був жителем, не мав родини в місті і навіть не мав бізнесу в компанії Bayou Motors, але те, що він мав — це престиж, оскільки всі знали, хто він, тому він прийшов на номінації і здобув одностайну підтримку місцевих жителів. Тепер, не знаючи точно, в що він вплутався, але рішуче налаштувавшись робити все можливе, "Русалка" кидається в справу створення з The Cannery більш поважного порту для рибалок по всьому заливу, без піратів, без злочинців і без будь-яких обмежень на вхід. Звісно, це означає, що пірати та злочинці можуть заходити, але це невелика ціна, щоб всі знали, що The Cannery швидко стає найважливішою зупинкою для морських суден на заході від Нового Орлеана."
BAM_merlin:0 "Королева Риб"
BAM_CLYDE_NAME:0 "Капітан Клайд Делароса"
BAM_CLYDE_TOKEN:0 "Клайд прожив надзвичайно довге та здорове життя для карибського пірата, але нещодавно його повстали проти нього через те, що він припустив, що, можливо, The Cannery не є гідною метою, і його корабель варто повернути назад у Кариби для більш звичних здобичей. Його товариші залишили його в порту в Мексиці без нічого, крім одягу на спині. Однак вони, здається, забули, кого саме зраджують, і Клайд не тільки випередив колишній екіпаж до здобичі, але й підписав контракт з компанією Bayou Motors, що управляє The Cannery, з метою зриву майбутнього пограбування. Тепер, коли пенсія Клайда забезпечена, він проводить більшість свого часу або консультуючи мера з питань місцевої оборони, або просто відпочиваючи у барі Гленна в порту The Cannery. Звісно, це дає йому можливість розповідати своїм відвідувачам купу історій, деякі з яких навіть правдиві."
BAM_clyde_trait:0 "Пенсіонер-пірат"
BAM_CHACO_NAME:0 "Чако Девлоп"
BAM_CHACO_TOKEN:0 "Чако є відносно новим прибульцем у The Cannery порівняно з більшістю інших людей, які керують тут. В загальному, його можна охарактеризувати як молодого бюрократа на стажуванні. Він керує більшістю фінансів компанії Bayou Motors, а також управляє графіком мера, організовуючи події та зустрічі. Мало хто знає його ім'я за межами близького кола друзів, яке він зміг створити. Сам Шип-Брейкер завжди вважав Чако дуже надійною особою, хоча він ніколи не був зовсім впевнений, чим саме Чако займається в той незначний час, що він дозволяє собі для відпочинку. Не скажіть меру, але його улюблений секретар — це та сама людина, що регулярно відвідує кожен караоке-вечір на острові. Не те, щоб він був поганим співака, просто йому не хочеться, щоб його начальник побачив його на одному з його звичайних, по-суті п’яних, виступів."
BAM_chaco_trait:0 "Радник і секретар"
BAM_GRANT_NAME:0 "Керівник патруля Ґрант"
BAM_GRANT_DESC:0 "Керівник патруля Кейсі Ґрант був одним з наймолодших керівників серед патрульних, поки йому не доручили керувати операціями в The Cannery. Народжений у родині піонерів другого покоління безпосередньо в The Cannery, він ще в ранньому віці вирішив, що риболовля і робота на заводі не для нього, і відправився вглиб країни, тільки для того, щоб потрапити під напад бандитів на базу патрульних біля скелі. Його захопили, але коли він сказав патрульним, хто він і звідки, вони вирішили взяти Кейсі в свою команду. З того часу він відчуває сильну лояльність як до свого дому в The Cannery, так і до Золотої та Синьої формації, що вивела його на правильний шлях. Тепер він отримав шанс патрулювати води навколо Маршового острова та виконати свою обіцянку служити. Хоча він і новачок у цій справі, він поклявся зробити все можливе, щоб його родина була горда ним."
BAM_grant_trait:0 "Патрульний глибоких вод"
BAM_DIRECTORATE_NAME:0 "Директорія Моторів"
BAM_DIRECTORATE_DESC:0 "Оскільки Шип-Брейкер фактично відсторонений від справ, щоденне управління The Cannery лягло на плечі Директорії Моторів — керівників компанії, що займаються операціями консервного заводу. В директорії є кілька гідних людей, і всі вони є місцевими. На жаль, для всіх інших у The Cannery, прибутковість, здається, є їхньою єдиною метою у керуванні підприємством, і вони розпочали кампанію зі скорочення витрат, щоб підвищити продуктивність у всіх аспектах компанії Bayou Motors. Трагедії на виробництві стають частішими, а огородження на рибальських траулерах ржавіють, але, оскільки капітали продовжують надходити, директорія вперта у переконанні, що вони виконують свою роботу добре, а це значить, що всі, хто під ними, повинні бути значно щасливішими."
BAM_directorate:0 "Регіональна консервна компанія"