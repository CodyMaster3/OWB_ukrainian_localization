arr_finding_the_geck:0 "Пошуки Святого G.E.C.K."
arr_finding_the_geck_desc:0 "Майже 40 років тому скромний Обранець, онук нашого засновника, вирушив у дорогу, щоб врятувати нас від лиха та знищення."
arr_reaching_thirteen:0 "Досягнення Сховища 13"
arr_reaching_thirteen_desc:0 "Невдовзі він прибув до колишнього дому Мешканця Сховища, який нині був заселений розумними кігтями смерті."
arr_oil_rig_arrival:0 "Нафтова Платформа Анклаву"
arr_oil_rig_arrival_desc:0 "Коли його плем'я було викрадене злим Анклавом, Обранець здійснив доленосну подорож до їхньої бази в морі. Вся надія на порятунок його народу – а можливо, і всього континенту – лежала на плечах Обранця."

arr_meet_dimitri:0 "Лікар з Сан-Франциско"
arr_meet_dimitri_desc:0 "Родом із Сан-Франциско, лікар, навчений Послідовниками, подорожував на північ і зрештою знайшов новий дім в Арройо."
arr_meet_chitsa:0 "Юнка зі Сховища 13"
arr_meet_chitsa_desc:0 "Серед урятованих Обранцем на нафтовій платформі Анклаву були й вижилі з Сховища 13. Одна дитина, надто мала, щоб пам’ятати ті події, була серед небагатьох щасливців, що врятувались."
arr_meet_nagor:0 "Скромний Воїн Арройо"
arr_meet_nagor_desc:0 "Молодший кузен Обранця, боязкий мисливець, якого обставини змусили стати воїном і генералом."

arr_meet_umbra:0 "Син Старого Друга"
arr_meet_umbra_desc:0 "Сулик був давнім другом і вірним супутником у пошуках святого G.E.C.K. і платформи Анклаву. Його вже немає серед живих, але його син, Авуерон, нині очолює своє плем'я."
arr_learn_from_sulik:0 "Старі Шляхи Суліка"
arr_learn_from_sulik_desc:0 "Відколи Авуерон взяв під контроль плем’я, він невтомно працює, аби підготувати свій народ до реалій Північної Каліфорнії. Вони почали модернізуватись і відмовлятись від старих звичаїв, та ми ще маємо чому вчитись у їхньої племінної люті."
arr_umbra_weapon_workshops:0 "Племінні Збройові Майстерні"
arr_umbra_weapon_workshops_desc:0 "Попри свою відсталість, майстри Умбри винахідливо конструюють зброю для свого племені. Запозичення цих методів може покращити наше виробництво зброї."

arr_meet_klamath:0 "Колись Мирний Порт"
arr_meet_klamath_desc:0 "Невеличке портове містечко Еврика лише нещодавно оговталося після Великої Війни. Стикнувшись із непереможним зараженням Болотниками, їхні нетрадиційні методи заслуговують на вивчення."
arr_skinning_lessons:0 "Уроки Здирання Шкур від Кламета"
arr_skinning_lessons_desc:0 "Здирання шкури з гекона – важка справа: найменша помилка зіпсує трофей. Нова техніка, винайдена трапперами Кламета, дозволяє робити це швидко і без шкоди для шкури."
arr_trapper_techniques:0 "Техніки Трапперів"
arr_trapper_techniques_desc:0 "Траппери з Кламета – майстри з інструментами, орієнтуванням і пошуком шляху. Навчання цим навичкам покращить універсальність нашої армії."
arr_hunting_weapons:0 "Нові Мисливські Зброї"
arr_hunting_weapons_desc:0 "Племінні мисливці полюбляють спис, але ми можемо дати їм краще. Нові гвинтівки зроблять їх мисливство ефективнішим."

arr_meet_packers:0 "Розслідування в Геппі-Кемпі"
arr_meet_packers_desc:0 "Попри свої мандрівки, Обранець мало що знає про Пекерів. Надзвичайно замкнене суспільство, яке, схоже, складається з низки відокремлених таборів."
arr_learn_from_foragers:0 "Вчимось у Збирачів"
arr_learn_from_foragers_desc:0 "Пекери – природні збирачі, здатні знаходити джерела води і життя. G.E.C.K. оживив Арройо, але ми ще не до кінця усвідомлюємо всі його можливості. Пекери можуть допомогти."
arr_supply_forward_units:0 "Операції Постачання в Пустці"
arr_supply_forward_units_desc:0 "Пекери використовують приховані стежки, щоби швидко переміщатись у лісистій місцевості. Їхні методи варто вивчити, навіть якщо ми не зможемо знайти самі стежки."

arr_meet_max_sec:0 "Максимальна Охорона, Максимальні Ставки"
arr_meet_max_sec_desc:0 "Десять років тому барон з Реддінґу, знаний як Інвестор, привів загін найманців на північ і почав відбудову старої в’язниці в Медфорду. Звідти команда подорожувала містами, викуповуючи злочинців для нового задуму."
arr_prison_building_expertise:0 "Досвід Будівництва В’язниць"
arr_prison_building_expertise_desc:0 "Реконструкція, започаткована найманцями, була продовжена новою робочою силою Мак-Сек. Старий комплекс став справжньою фортецею."
arr_building_defenses:0 "Будуємо Оборону"
arr_building_defenses_desc:0 "Ми не створимо таку ж робочу силу, як у Мак-Сек, але можемо змоделювати нашу оборону за їхнім прикладом. Вони навчилися захищатися від загроз як зовні, так і зсередини."
arr_building_a_nation:0 "Будуємо Державу"
arr_building_a_nation_desc:0 "Місцевість навколо Мак-Сек не була порожньою. Місцеві спершу ставились до в’язниці з пересторогою, але плоди примусової праці спричинили стрімке зростання добробуту регіону."

arr_nagor_start:0 "Генерал на Службі"
arr_nagor_start_desc:0 "Перше, що зробив Нагор, – це взявся до справи. Він знав, що на посаді очільника ради на нього чекає виснажливий рік. Найбільше він був вдячний людям навколо. Прогрес Арройо в прийдешньому році стане можливим завдяки їхній непохитній відданості."

arr_deploy_merrymen:0 "Розгорнути Веселунів"
arr_deploy_merrymen_desc:0 "Веселуни були створені як відгалуження армії Арройо після завершення подорожі Обранця. Спершу задумані як інженерний корпус, вони стали особистими вирішувачами проблем Нагора, які займаються інфраструктурними й житловими кризами по всіх племінних землях."

arr_redeploy_builders:0 "Перекинути Армійських Будівельників"
arr_redeploy_builders_desc:0 "Арройо пощастило жити в мирі від часу подій на Нафтовій Платформі. Та Нагор завжди готував воїнів до миру й до війни. Будівельники є значною частиною війська і можуть прискорити нові інфраструктурні проєкти."

arr_redeploy_manufacturers:0 "Перекинути Армійських Виробників"
arr_redeploy_manufacturers_desc:0 "Спеціалізовані зброярі, яких утримувала армія Нагора, забезпечували доступ до якісної зброї у кризові часи. За потреби вони можуть бути задіяні в інших напрямках, посилюючи арройські постачальні лінії."

arr_recruit_workshop_workers:0 "Залучити Майстерових Працівників"
arr_recruit_workshop_workers_desc:0 "У критичній ситуації Нагору дозволено мобілізувати здорових робітників із числа цивільного населення. Це неідеальний варіант, але він може дати нам додатковий резерв."

arr_our_backs_to_paradise:0 "Спинами до Раю"
arr_our_backs_to_paradise_desc:0 "Обранець невтомно працював, щоб перетворити наш дім на рай, і наділив нас волею його захищати. Ми маємо стояти непохитно проти агресії."

arr_our_eyes_on_enemies:0 "Очима до Ворога"
arr_our_eyes_on_enemies_desc:0 "Найкращий захист – це напад. Очікувати удару ворога – це чекати на знищення. Ми маємо вдарити першими й знищити загрози."

arr_sharpening_lenses:0 "Загострюємо Мечі"
arr_sharpening_lenses_desc:0 "Меч – зброя, така ж давня, як і саме насильство. Символ доблесті та надії, призначена для знищення підступного ворога."

arr_raising_shields:0 "Підносимо Щити"
arr_raising_shields_desc:0 "Щит – захисник, старший за цивілізацію. Символ оборони, перевірений часом."

arr_spoils_of_war:0 "Військова Здобич"
arr_spoils_of_war_desc:0 "Війна – жорстокий і ниций звір. Нагор це добре засвоїв. Але він також знає, що війна приносить прибутки. Баланс між цими крайнощами – жорстокий, та кожна війна може збагатити Арройо."

arr_never_forget:0 "Ніколи Не Забудемо"
arr_never_forget_desc:0 "Навіть постарівши, Нагор не може забути страх перед вертибердами Анклаву. Жах від металевих людей змушує його прокидатись у холодному поту. Він дав собі слово: ніколи знову."

arr_never_allow:0 "Ніколи Не Дозволити"
arr_never_allow_desc:0 "Нагор розуміє: Анклав не з’явився нізвідки. Те, що здавалося раптовим, було довго планованим. Його тодішнє безсилля можна було уникнути лише завдяки превентивному удару."

arr_motorgang_recruitment:0 "Рекрутинг Мотор-Гангів"
arr_motorgang_recruitment_desc:0 "Зазвичай розрізнені й дрібні, мотобанди мають певну присутність на автошляхах біля Арройо. Нагор замислився: а може, ці кримінальні елементи стануть загартованим кістяком нової армії?"

arr_tribal_means:0 "Племінні Засоби"
arr_tribal_means_desc:0 "Нагор роками обговорював тактику з Обранцем. Хоч і не теоретик, він навчився вчитись на минулому. Так виник своєрідний арройський стиль ведення війни."

arr_to_tribal_ends:0 "Племінні Цілі"
arr_to_tribal_ends_desc:0 "Чіца й Нагор не були схожими. Різна мова, різне мислення. Але щось змінилось. Вони стали радитись. І що дивніше – дослухатись одне до одного."

arr_junkyard_fixers:0 "Звалищні Майстри"
arr_junkyard_fixers_desc:0 "Байкери будують свої байки зі сміття й мотлоху. Те, що інші вважають хламом, для них – скарб. Мотор-ганг знає, де шукати правильні деталі."

arr_frontline_doctors:0 "Лікарі на Передовій"
arr_frontline_doctors_desc:0 "Димитрій підготував широку мережу медиків. Вони важливі вдома, але й на фронті солдатам потрібна допомога. Димитрій завжди казав: «Захистити найвразливіших – ось справжній обов'язок лікаря»."

arr_biker_integration:0 "Інтеграція Байкерів"
arr_biker_integration_desc:0 "Самого рекрутингу байкерів замало. Вони мають стати частиною нашої армії, а не окремим угрупованням."

arr_an_army_for_the_people:0 "Армія для Народу"
arr_an_army_for_the_people_desc:0 "Армія Арройо служить лише народу. Жодним іншим інтересам. Їхня підтримка лише доводить це."

arr_army_special_forces:0 "Спецпідрозділи Армії"
arr_army_special_forces_desc:0 "Колись лише племінні воїни захищали Арройо. Часи змінились, але ідея елітного загону для прориву ворога лишилась."
arr_army_special_forces_bonus_tt:0 "Бонус для спеціальних сил орепацій"
arr_our_own_metal_men:0 "Наші Власні Металеві Люди"
arr_our_own_metal_men_desc:0 "Технології Анклаву тепер доступні й нам. Ми починаємо створювати силову броню. Вона ще далека від ідеалу, але це знак нашої сили."
arr_our_own_metal_men_bonus_tt:0 "Наш власний металевий чоловік (бонус)"
arr_stripping_fear:0 "Безстрашність"
arr_stripping_fear_desc:0 "Металеві люди – це лише люди. А всі люди – смертні. Наші гвинтівки зламають їхню броню, як консервну бляшанку."
arr_stripping_fear_bonus_tt:0 "Бонус за позбавлення страху"
arr_reliable_warfare:0 "Надійна Війна"
arr_reliable_warfare_desc:0 "Забезпечення – серце війни. Якість спорядження вирішує результат бою. Нагор особисто контролює логістику армії Арройо."

arr_chitsa_start:0 "Її Шлях"
arr_chitsa_start_desc:0 "Коли всі інші вийшли з залу ради, Чіца тихо залишилася й замислилась. Вона отримала саме те, чого хотіла – на посаді очільниці ради в неї була повна свобода переслідувати деякі... напрями, що її цікавили."

arr_dorris_warbands:0 "Військові Банди Дорріса"
arr_dorris_warbands_desc:0 "Ден давно був пухлиною на тілі арройської торгівлі. Як альтернатива північному маршруту, він давав торговцям змогу оминути арройські ринки. Шпигуни Чіци за останні роки налагодили контакт із рейдерами з Дорріса, і вона змогла заплатити їм за посилення нападів у регіоні."

arr_backdoor_purchases:0 "Таємні Закупівлі"
arr_backdoor_purchases_desc:0 "Хоча Нагор прагне самозабезпеченості війська, Чіца знала: найпростіший спосіб здобути зброю – імпорт. Імпорт, що має бути цілком непомітним, аби не насторожити сусідів Арройо."

arr_market_preference:0 "Перевага на Ринку"
arr_market_preference_desc:0 "Gun Runners, Van Graffs, Chop Shop – усі мають попит. Щоб Арройо отримував товари першим, Чіца невтомно будувала особисті зв’язки з цими організаціями у пустці."

arr_support_gun_runners:0 "Підтримати Gun Runners"
arr_support_gun_runners_desc:0 "Gun Runners особливо зацікавили Чіцу. Їхня зброя ідеально підходила потребам Арройо. Тож вона розробила план: на кількох торговців Gun Runners нападуть «скажені рейдери» біля Умбри. І, звісно ж, арройські нерегулярні сили «вчасно» врятують ситуацію."

arr_fourways_extortion:0 "Рекет у Fourways"
arr_fourways_extortion_desc:0 "Fourways – відоме торгове містечко на головному шляху між Реддінґом і Арройо. Попри офіційний нейтралітет, за вплив над ним точиться тиха боротьба. І Чіца подбає, щоб перемога була за Арройо."

arr_deep_warrior_training:0 "Глибока Підготовка Воїнів"
arr_deep_warrior_training_desc:0 "Тіло воїна – не єдина його зброя. Чіца планує розробити низку ментальних вправ, щоб навчити наших солдатів діяти під тиском і чинити спротив під час допитів."

arr_trader_rest_stops:0 "Привал для Торговців"
arr_trader_rest_stops_desc:0 "На жаль, наша інфраструктура поступово занепадає, що відлякує торговців. Інвестиції у привали на дорогах трохи змінять ситуацію."

arr_developing_sixes:0 "Торговий Порт у Сіксес"
arr_developing_sixes_desc:0 "Порт у Сіксес має недовикористаний потенціал. Хоча більшість торгівлі йде суходолом, розширення доків забезпечить безпечніший, хоч і дорожчий, альтернативний маршрут."

arr_supplying_demand:0 "Постачаємо Попит"
arr_supplying_demand_desc:0 "Зброя – не лише для армії. Чіца має ідею: розширення виробництва зброї дозволить експортувати її в хаотичну пустку і заробляти на цьому."

arr_pows_as_builder_slaves:0 "Полонені як Раби-Будівельники"
arr_pows_as_builder_slaves_desc:0 "Армія Нагора здобула чимало полонених. Наразі вони насолоджуються гостинністю, але Чіца може переконати раду перетворити їх на рабів і інтегрувати в економіку Арройо."

arr_geck_clearings:0 "Очищення Земель за Прикладом G.E.C.K."
arr_geck_clearings_desc:0 "Одразу після активації G.E.C.K. було очищено ліси й валуни, аби звільнити простір для землеробства. Пристрій давно вичерпався, та наші робітники можуть піти його слідами."

arr_expansion_in_sixes:0 "Сіксес до Севенс"
arr_expansion_in_sixes_desc:0 "Чіца кинула ще один рекламний буклет у смітник. Ідеї були... м’яко кажучи, слабкими. Більшість намагались імітувати Нью-Ріно, виходячи на рівень сарказму. «Сіксес до Севенс»? Справді? Як це має привабити мігрантів?"

arr_expansion_in_the_pass:0 "Розширення Грантс-Пассу"
arr_expansion_in_the_pass_desc:0 "Грантс-Пасс – одне з найбільш негостинних місць нашої території. G.E.C.K. торкнувся лише ядра Арройо, тож тут усе лишилось диким. Вручну змінити це можливо, але надзвичайно складно."

arr_goods_to_sell:0 "Товари для Людей"
arr_goods_to_sell_desc:0 "Не все на наших верстатах має бути зброєю чи бронею. Збільшення виробництва побутових товарів покаже народу, що Чіца піклується про них – і зміцнить лояльність."

arr_production_deals:0 "Угоди з Усякими"
arr_production_deals_desc:0 "Найкраща дипломатія – це нейтральність. Якщо вважати себе вищим, чи засуджувати інших як зарозумілих – це шлях до провалу."

arr_stockpiling_metal:0 "Запаси Металу"
arr_stockpiling_metal_desc:0 "Метал – надзвичайно поширений і критично важливий ресурс. Закупівля й накопичення запасів на випадок екстрених потреб – стратегічно вигідний крок."

arr_trade_leader:0 "Лідер Торгівлі"
arr_trade_leader_desc:0 "Чіца пройшла довгий шлях із тих часів, коли вона керувала юнацькою бейсбольною командою. Тепер вона керує цілою армією торговців, вірних їй, і ця імперія лише зростатиме."

arr_wealth_is_health:0 "Багатство – це Здоров’я"
arr_wealth_is_health_desc:0 "Маневри Чіци залишили скарбницю ради повною. Може, це вплив інших радників, але вона почала розуміти: сила племені не лише в його лідерах. Інвестиції в Арройо можуть допомогти всім – і, найголовніше, їй самій."

arr_dimitri_start:0 "Лікар на Місці"
arr_dimitri_start_desc:0 "Димитрій радів, що його невпинна праця з інтеграції в плем’я Арройо нарешті почала давати плоди. Після засідання ради він одразу взявся до роботи, чітко усвідомлюючи, що тепер має повний доступ до фінансування досліджень і будівельних проєктів."

arr_army_research_division:0 "Дослідницький Відділ Армії"
arr_army_research_division_desc:0 "Для багатьох у війську дослідження – це лише шлях до створення потужнішої зброї. На відміну від своїх колишніх наставників, Димитрій розуміє доцільність війни, але наполягає, що наука у війську має бути другорядним напрямом."

arr_new_warfare_doctrine:0 "Нова Військова Доктрина"
arr_new_warfare_doctrine_desc:0 "«Туман війни» – поширене поняття, що описує хаос у будь-якому збройному конфлікті. Хоча Димитрій не військовий, він сподівається за допомогою генералів запровадити у війську наукову точність."

arr_retrofit_old_equipment:0 "Модернізація Старого Озброєння"
arr_retrofit_old_equipment_desc:0 "Невеликі сутички минулих років залишили по собі чималі склади старої зброї. Попри поганий стан, доклавши зусиль, її можна повернути до ладу й використати."

arr_air_domination:0 "Перевага в Повітрі"
arr_air_domination_desc:0 "Авіація у пустці – річ рідкісна. Мало яке плем’я розуміється на науці, не кажучи вже про будівництво літаків. Але завдяки освіті Димитрій може знайти фахівців для авіації Арройо."

arr_fostering_ground_support:0 "Підтримка Сухопутних Військ"
arr_fostering_ground_support_desc:0 "Авіація передусім має допомагати наземним силам. Вишкіл і чітка координація – основа ефективного панування в повітрі."

arr_review_communication_procedures:0 "Огляд Радіозв’язку"
arr_review_communication_procedures_desc:0 "Маючи базовий досвід в авіації, Димитрій наказав стандартизувати зв’язок з пілотами. Це підвищить ефективність бойових дій."

arr_batch_thirty:0 "Серія Тридцять"
arr_batch_thirty_desc:0 "Після численних експериментів наші дослідники створили вдосконалену модель планера. «Серія Тридцять» поєднує простоту виробництва з кращим озброєнням та надійністю."

arr_the_followers_teachings:0 "Вчення Наслідувачів"
arr_the_followers_teachings_desc:0 "Димитрій гостро не погоджувався з пацифізмом Наслідувачів. Війна – хоч і жахлива, але неминуча частина життя в пустці."

arr_adopting_the_strays:0 "Прийняття Бродячих Псів"
arr_adopting_the_strays_desc:0 "Бродячі пси поширені по всій пустці. Більшість родин не мають змоги тримати їх, але Арройо може дати їм дім."

arr_emergency_surture_kits:0 "Аварійні Шовні Набори"
arr_emergency_surture_kits_desc:0 "Медицина на полі бою – непомітна основа сильної армії. Димитрій працював із медиками над покращенням якості надання невідкладної допомоги."

arr_prisoner_test_subjects:0 "В'язні як Піддослідні"
arr_prisoner_test_subjects_desc:0 "В'язні Макс Сек – відвертий покидьок. Їх можна використати для сумнівних експериментів. Колись навіть сам Димитрій був проти цього, але потенційні наукові здобутки переважують етику."

arr_great_society:0 "Велике Плем’я"
arr_great_society_desc:0 "Арройці – гордий народ. Вони вірять у своє героїчне походження. Та навіть попри G.E.C.K., Арройо досі поступається економічно Республіці."

arr_school_building:0 "Будівництво Шкіл"
arr_school_building_desc:0 "Триває нове покоління Арройо. Шкільна освіта – табуйована тема, але вона значно ефективніша за навчання вдома."

arr_road_building:0 "Будівництво Доріг"
arr_road_building_desc:0 "Деякі поселення Арройо настільки ізольовані, що не мають зв’язку з сусідами. Дорожня мережа допоможе зміцнити єдність племені."

arr_clearing_forests:0 "Очищення Лісів"
arr_clearing_forests_desc:0 "Околиці повні диких лісів, що лише заважають розширенню. Там мешкають мутанти, бандити й відлюдькуваті гульи."

arr_constructing_on_hills:0 "Арройо на Пагорбах"
arr_constructing_on_hills_desc:0 "Уся робота Димитрія – на благо Арройо. Після десятиліть підозр і невизнання, його зусилля починають приносити результат."

arr_further_industrial_planning:0 "Промислове Планування"
arr_further_industrial_planning_desc:0 "Арройо потребує плану. Рання промисловість зібрана нашвидкуруч. Димитрій хоче змінити це й навчити людей стратегічному мисленню."

arr_agricultural_expansion:0 "Розвиток Сільського Господарства"
arr_agricultural_expansion_desc:0 "Зростаючому населенню потрібна їжа. Нові землі стануть основою для майбутніх врожаїв."

arr_a_flourishing_society:0 "Процвітаюче Суспільство"
arr_a_flourishing_society_desc:0 "Уважність, турбота і стратегія – ось що створило Арройо сучасним. Те, що для минулого покоління було мрією, стало реальністю."

arr_sanitation_exploration:0 "Розвиток Санітарії"
arr_sanitation_exploration_desc:0 "До Великої Війни кожне місто мало каналізацію. Тепер це рідкість. Але в Арройо можливо все. Чистота – це здоров’я."

arr_exploiting_the_land:0 "Використання Земель"
arr_exploiting_the_land_desc:0 "Багатство племені – у землі. Раніше арройці були надто обережні, але настав час використовувати ресурси з розумом."

arr_chosen_one_returns:0 "Повернення Обраного"
arr_chosen_one_returns_desc:0 "Він повернувся так само тихо, як і пішов. Час покаже, що він приніс із собою."

arr_my_wanderings:0 "Мої Мандри"
arr_my_wanderings_desc:0 "Обраний бачив багато. Пороки Ріно, молода Республіка, вершники Юти. Він виглядає виснаженим. Чи не надто жорстока пустка навіть для нього?"

arr_facing_the_council:0 "Перед Радою"
arr_facing_the_council_desc:0 "Раніше рада була дорадчою. Але з відходом Обраного – вона керувала. Тепер, коли він повернувся, слід вирішити, хто вестиме Арройо вперед."

arr_a_glorious_return:0 "Славетне Повернення"
arr_a_glorious_return_desc:0 "Обраного вітали триденними святами. Плем’я знало: герой повернувся у найскрутніший час."

arr_a_quiet_return:0 "Тихе Повернення"
arr_a_quiet_return_desc:0 "Свято тривало три дні, але він не приєднався. Можливо, після мандрів він шукає тишу. Та захищати Арройо він не перестане."

arr_good_1:0 "Старі Друзі"
arr_good_1_desc:0 "Хоча ми були ізольовані, відносини з Республікою завжди були теплі. Можливо, час узаконити нашу дружбу."

arr_fou_1:0 "Чотири Шляхи – Два Напрями"
arr_fou_1_desc:0 "Республіка пропонує гарантії нашої незалежності за плату. Хоча деякі вважають це даниною, це може відлякати нападників."

arr_fou_2:0 "Чотири Шляхи – Наш Шлях"
arr_fou_2_desc:0 "Республіка, обтяжена іншими фронтами, втратила інтерес до Fourways. Тепер ми можемо діяти без страху перед ведмедем."

arr_fou_3:0 "Подарунок від Старих Друзів"
arr_fou_3_desc:0 "Тепер каравани з Республіки йдуть аж до Fourways, дозволяючи нам торгувати напряму з півднем."

arr_eur_1:0 "Рибні Промисли Еврики"
arr_eur_1_desc:0 "Промисли Еврики – в занепаді. У нас є робочі, але бракує техніки й капіталу. Можливо, спільне підприємство з Республікою змінить ситуацію."

arr_eur_2:0 "Евриківська Миттєвість"
arr_eur_2_desc:0 "Провівши десятиліття найманцями, евриківці розвинули власний, унікальний стиль війни. Їхні послуги дорогі, зате майстерність – бездоганна."

arr_the_barons:0 "Угода з Баронами"
arr_the_barons_desc:0 "Після нашого розширення та стабілізації регіону населення почало стрімко зростати. Щоб уникнути голоду, ми укладемо угоду з брамінськими баронами Республіки про постачання свіжої їжі."

arr_republic_taxes:0 "Податки Республіці"
arr_republic_taxes_desc:0 "Наші зв’язки з Республікою та зростання торгівлі змушують нас платити більші податки до її скарбниці."

arr_ncr_support:0 "Підтримка Старих Друзів"
arr_ncr_support_desc:0 "Хоча раніше підтримка від Республіки була радше символічною, Конгрес Республіки офіційно визнав наші потреби й допоміг вирішити багато проблем."

arr_ncr_statehood:0 "Штат Арройо"
arr_ncr_statehood_desc:0 "Колись ми вірили, що ізоляція врятує нас. Але в світі, що змінюється, ми більше не можемо ховати голову в пісок. Ми подамо прохання про вступ до Республіки як Штат Арройо."

arr_ncr_acceptance:0 "Прийняти Республіку"
arr_ncr_acceptance_desc:0 "Час на ширшу співпрацю з Республікою. Ми офіційно станемо союзниками, зберігши при цьому власну ідентичність."

arr_neutral_1:0 "Старі Знайомі"
arr_neutral_1_desc:0 "Хоч Арройо і не мав офіційних зв’язків із зовнішнім світом, Обраний діяв як посол, встановлюючи зв’язки з багатьма фракціями пустки."

arr_max_sec_reopen:0 "Відновити Макс Сек"
arr_max_sec_reopen_desc:0 "Тюрма MaxSec була ризикованим проєктом, але мала величезний потенціал. Дамо їй другий шанс."

arr_reno_arms_deal:0 "Збройна Угода з Ріно"
arr_reno_arms_deal_desc:0 "Грішне місто Ріно постійно потребує зброї. Вони щедро платитимуть за наші надлишки. А що з нею робитимуть – нас не обходить."

arr_vlt_army_deal:0 "Навчання в Армії Міста-Сховища"
arr_vlt_army_deal_desc:0 "Попри свою ксенофобію, Місто-Сховище погоджується навчати чужинців у своїй військовій програмі. Відправити наших бійців на навчання до еліти – розумна інвестиція."

arr_klamath_trappers:0 "Кламацькі Ловці"
arr_klamath_trappers_desc:0 "Ловці з Кламета – чудові провідники та цінний ресурс для місцевої економіки. Можливо, ми зможемо залучити їх до роботи."

arr_yakuza_deal:0 "Зв’язки з Якудзою"
arr_yakuza_deal_desc:0 "Не менш небезпечні за кримінальні сім’ї Ріно, якудза – сильні союзники й жорстокі вороги. Зв’язки з ними можуть стати в пригоді для тіньових справ."

arr_modoc_deal:0 "Угода з Модоком"
arr_modoc_deal_desc:0 "Замість покладатись на баронів Брамін, ми можемо укласти угоду з Модоком і не дати Ведмедю посилити вплив у регіоні."

arr_home_is_nevada:0 "Дім – це Невада"
arr_home_is_nevada_desc:0 "З Ведмедем на півдні й людожерськими мутантами на півночі, ми потребуємо нових союзників. Можливо, варто об’єднатись із державами Невади."

arr_thunderbird:0 "Східні Вершники"
arr_thunderbird_desc:0 "Легендарний Громоптах їде із заходу, присягнувши знищити Республіку. Можливо, він стане союзником у нашій боротьбі."

arr_push_them_over:0 "Переїхати їх"
arr_push_them_over_desc:0 "А ви знали, що Eighties використовують машини, щоб грабувати слабших? Прекрасно. Ми теж так робитимемо."

arr_the_wall_of_the_west:0 "Стіна Заходу"
arr_the_wall_of_the_west_desc:0 ""

arr_crush_the_resistance:0 "Придушити Опір"
arr_crush_the_resistance_desc:0 "Попри наші добрі наміри, ще є ті, хто чинить опір. Час покласти цьому край."

arr_bring_down_the_bear:0 "Скинути Ведмедя"
arr_bring_down_the_bear_desc:0 "Наші плани втілюються в життя. Ми готові до найбільшого бою покоління. Час повалити Ведмедя."

arr_right_of_the_past:0 "Барабани Війни"
arr_right_of_the_past_desc:0 "Наше військо маршує, і народ вірить у перемогу. Громадська підтримка війни зростає."

arr_tribal_reckoning:0 "Племінна Розплата"
arr_tribal_reckoning_desc:0 "Схоже, Республіка забула про свої племінні корені. Ми нагадаємо їм, на що здатні справжні племена!"

arr_wartime_infrastructure:0 "Інфраструктура Часів Війни"
arr_wartime_infrastructure_desc:0 "Постачання військ на передову має першочергове значення. Ми виділимо ресурси на розвиток інфраструктури."

arr_ncr_military_weaknesses:0 "Герой Платформи"
arr_ncr_military_weaknesses_desc: "Військо Республіки роз'їдає кумівство, корупція та некомпетентність. Ми з легкістю скористаємося цими слабкостями. Які в них шанси проти Обраного – людини, що вбила Америку?"

arr_bring_down_the_bear_tt: "Через 200 днів ми отримаємо казус беллі на §Y[NCR.GetNameWithFlag]§! або поточного власника її території."

