l_english:
 # decisions
ARR_karma_category: "Рада Арройо"
ARR_karma_category_desc: "§YОбранець§! утворив Раду Арройо з трьох найвизначніших членів племені. Нагор, його молодий двоюрідний брат і міцний воїн, Димитрій, досвідчений знахар із Сан-Франциско, навчений Послідовниками, та Чітса — прониклива, розважлива торгівчиня і провідниця.\n\nКожен із них дивиться на світ по-своєму, але їхні вчинки віддзеркалюють їхню §Gвнутрішню сутність§!. Добро чи зло — їхні діяння відкривають істинне нутро та показують карму:\n\n§YНагор§! сприймається як [nagor_karma_visual]§YЧітса§! найкраще описується як [chitsa_karma_visual]§YДимитрій§! вважається [dimitri_karma_visual]"

