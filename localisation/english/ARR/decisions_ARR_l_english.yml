arr_nagor_help_dimitri: "Сплітити Сили з Димитрієм"
arr_nagor_exile_dimitri: "Вигнати Димитрія"

ARR_chosen_one_category: "Обранець Арройо"
ARR_chosen_one_category_desc: "Обранець — герой Арройо. Майже самотужки врятував своє плем’я від голоду і Застави. Кожен дорослий і дитя з шанобою схиляється перед його слідом.\n\nТа Пустка знову кличе Обранця, бо ще не всі справи завершені поза межами Арройо...\n\nКарма §YОбранця§! є [chosen_karma_visual]"

ARR_foreign_policy_category: "Земля Благословенна"
ARR_foreign_policy_category_desc: "Хоч би як ми прагнули тиші, знаємо: самотніми не є ми. Колись Арройо був під волею сторонніх сил, та тепер усе інакше. Маємо обов’язок берегти сусідів, та рід наш — понад усе.\n\nВища §Mвпливовість§! збільшує надію на мир, а §Mпримус§! дарує силу тримати ворогів у вузді. Якщо бракує одного й другого — миру не буде.\n\nЯкщо ми маємо 40% примусу чи впливу над землею, її можна вважати такою, що піддалася Арройо. Такі народи принесуть найбільшу користь після завершення лих. Та не дано знати, коли саме скінчиться лихо, тож іноді варто шукати ближчої мети, жертвуючи одним зі шляхів.\n\n§YАрройо§! §Gніколи§! §Yне втратить можливість до розширення через нестачу примусу/впливу, але отримає §Gдодаткові благодаті§!, якщо матиме 40% і більше обох§!!\n\nМакс. вплив на Сек: [?arr_mxs_influence|%Y0]\nМакс. примус на Сек: [?arr_mxs_coercion|%Y0]\n\nВплив на Умбру: [?arr_umb_influence|%Y0]\nПримус на Умбру: [?arr_umb_coercion|%Y0]\n\nВплив на Пакувальників: [?arr_pac_influence|%Y0]\nПримус на Пакувальників: [?arr_pac_coercion|%Y0]\n\nВплив на Евреку: [?arr_eur_influence|%Y0]\nПримус на Евреку: [?arr_eur_coercion|%Y0]\n\nВплив на Чотири Шляхи: [?arr_fou_influence|%Y0]\nПримус на Чотири Шляхи: [?arr_fou_coercion|%Y0]"

