arr_pac_war: "Намітити Землі Пакувальників"
arr_pac_war_desc: "Сила Пакувальників у знанні лісів своїх. Та ми зуміємо віднайти стежини їхні, і наші удари стануть точнішими."

arr_pac_brutality: "Схвалити Жорстокі Засоби"
arr_pac_brutality_desc: "Пакувальники — люті, не щадять нікого. Щоби покласти край їхнім нападам, можемо бути змушені відповісти тим самим."

arr_pac_prisoners: "Поліпшити Долю Полонених"
arr_pac_prisoners_desc: "Пакувальники не беруть бранців. Та ми маємо показати: наш шлях — кращий. І людям, і власному сумлінню."

