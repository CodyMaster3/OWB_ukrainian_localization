arr_pac_battlefields: "Обстежити Поля Бою"
arr_pac_interrogate_prisoners: "Допитати Полонених"
arr_pac_populace: "Випитати Народ"
arr_pac_gain_pp: "Проголосити Мир"

chosen_leaves_countdown: "Жага Шляхів Поглинає"

ARR_fourways_category: "Двоє Стежок для Чотирьох Шляхів"
ARR_fourways_category_desc: "У змаганні за владу над [FOU.GetName] перед нами — дві дороги. Перша — шлях §Mпримусу§!, що веде до воєнної виправи. Це розгнівить суперників і, ймовірно, спричинить відпір.\nІнша — м’якіша, та, може, менш приємна — через §Mвплив§! у гільдії купців [FOU.GetName]. Хто матиме більший вплив, той примусить суперника до вигідних умов.\n\nВплив Арройо: [?ARR.arr_fou_influence|%Y0]\nПримус Арройо: [?ARR.arr_fou_coercion|%Y0]\n\nВплив НКР: [?NCR.arr_fou_influence|%Y0]\nПримус НКР: [?NCR.arr_fou_coercion|%Y0]"

