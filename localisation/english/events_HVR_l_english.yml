#Events

nf_hvr.1.t:0 "Самотні землі"
nf_hvr.1.d:0 "Між володіннями Анклаву в Скелястих горах і жахами Півночі лежить Гавр: незвична й спантеличена низка спільнот, слабо об’єднаних. Для більшості Гавр був місцем безпеки, справжньої свободи: землею, де Анклав не міг тебе забрати, де Буревісники не наважувалися ступити, де безглузді не мали причин бути. Це було щось просте. \n\nАле бути на узбіччі сучасного суспільства — не завжди благословення. Для багатьох Гавр був привабливою перспективою: земля далеко від проблем світу, де ті, хто не мав куди йти, могли процвітати.\n\nБандити, злодії та інші негідники з усього Монтани вважали Гавр ідеальним місцем для своїх витівок. І саме в цьому безладді зростала нова сила: Культ Свободи.\n\nРіанна Робертсон завжди виступала за життя, свободу та прагнення щастя — хоч ви б і не здогадались, звідки вона це взяла. Її мати передала їй набір незвичних учень, які вона прийняла всім серцем: оповіді про ангела Америку, посланого Богом, щоби вивести їх із темряви, якого було вигнано з цього світу ядерним конфліктом — Великою війною."
nf_hvr.1.a:0 "Гільдія крадіїв запропонувала чимало винагород."
nf_hvr.1.b:0 "Культ Свободи був озброєний до зубів."
nf_hvr.1.c:0 "Мені здається, в Гаврі були свої скарби!"

nf_hvr.2.t:0 "Історія Ріанни Робертсон"
nf_hvr.2.d:0 "Ріанна Робертсон народилася від нащадка Компанії Зака та торговки з Сейфхейвену, і саме в мареннях її батька почався Культ Свободи. Її мати померла від хвороби, і все, що залишилося — його марення, натхненні вірою матері — ті ж слова, що зібрали паству в Гаврі та скинули останнього мера.\n\nВона йшла слідом його кроків, і завдяки зростаючому патріотичному фанатизму й харизматичності, люди її слухали — так культ зростав із року в рік. Користь для громад Монтани спершу була неочевидною, та її світло принесло чимало змін на краще — як для простих людей Гавру, так і для тих, хто прагнув сховатися в хаосі культу. А найпомітнішими були її дії в сфері..."
nf_hvr.2.a:0 "Промисловості, щоб дати людям роботу!"
nf_hvr.2.b:0 "Військовій справі, щоб пишатися Америкою!"
nf_hvr.2.c:0 "Економіки, щоб благословити світ святим капіталізмом!"

nf_hvr.3.t:0 "У Країні Свободи"
nf_hvr.3.d:0 "Гавр та його околиці виживали лише тому, що були надто віддаленими, щоб мати значення. Але зі зростанням сили Культу Свободи це змінюється — у найвідданіших його послідовниках зростає прагнення до експансії. Водночас у чужинців росте бажання змусити Америку замовкнути.\n\nМайбутнє невизначене, але з великою надією та палаючим гнівом Ріанна Робертсон прагне принести світло Америки своїм ворогам."
nf_hvr.3.a:0 "Слава Америці!"

nf_hvr.4.t:0 "Гавр звертається до нас"
nf_hvr.4.d:0 "Народ Гавру надіслав невелике посольство з Культу Свободи, просячи нашої допомоги у промислових зусиллях. Хоч це й може бути дорого, вони пропонують щедру оплату..."
nf_hvr.4.a:0 "Ми приймаємо угоду!"
nf_hvr.4.b:0 "Нам треба дбати про власне."

nf_hvr.5.t:0 "Битва Олдгана"
nf_hvr.5.d:0 "Олдган для багатьох у Гаврі — герой, що боровся з тиранією Компанії Зака. Для інших — убивця без милосердя. Але незалежно від погляду, ресурси, якими володіють нііцітапі (Niitsitapi Blackfoot), безцінні. Протягом років торговці Гавру стежили за їхніми землями — можливо, ми можемо скористатись конфліктом?\n\nХоч Компанія Зака вже не така впливова, їхня присутність усе ще важлива. Якщо ми хочемо вирішити справу з нііцітапі, нам слід визнати старі провини — тільки тоді можливе примирення."
nf_hvr.5.a:0 "Поглянемо, що буде."

nf_hvr.6.t:0 "Компанія Зака приносить вибачення"
nf_hvr.6.d:0 "Сьогодні — щось дивне. Один з рештків Компанії Зака, його броня — зимова, мов у іграшкового солдата, вийшов з снігів. Він шукав розмови з Джеремі Олдганом, і вони говорили наодинці багато годин. Він розповів про прохання: вони запропонують ресурси в обмін на мир, за умови, що ми поділимося плодами нашої землі. Це буде недешево, але їхня допомога може бути безцінною..."
nf_hvr.6.a:0 "Нііцітапі стоятимуть гордо — самотужки."
nf_hvr.6.b:0 "Нехай минуле залишиться в минулому."

nf_hvr.7.t:0 "Гільдія крадіїв із Гавру пропонує винагороду"
nf_hvr.7.d:0 "Святі колись допомогли Гільдії крадіїв мирно залишити Стреч — тепер вони пропонують Роузбаду невеличку винагороду в обмін на взаємну допомогу."
nf_hvr.7.a:0 "Ну що ж, цікава пропозиція..."

nf_hvr.8.t:0 "Патріотична проза"
nf_hvr.8.d:0 "Брудна дерев’яна платформа з трибуною, вкритою зірками та смугами, стояла посеред натовпу на площі, коли сонце сходило високо над зібранням американців. Люди з усіх верств суспільства зібралися, почувши заклик Пророчиці Робертсон виступити зі словом — бо її слухали, мов слова її йшли просто від Американського Ангела. Хоча з’явилося чимало скептиків, які сумнівалися в поверненні 'Американи', більшість простого люду прийняли її мудрі вчення. \n\nРобертсон гордо вийшла на сцену й почала підбурювати натовп, гучно заявивши: “Леді й джентльмени! Настав новий світанок у небі Америки...” Вона зробила паузу, швидко вдихнула й продовжила: “Вона більше не буде зведена на землю фальшивими пророками! Її ангельські крила не буде обрубані тими, хто намагається заволодіти нею, мов землею, що можна експлуатувати...”\n\nВона змінила тон на більш похмурий. “Ідеологія Анклаву дедалі явніше загрожує нашим віруванням... Вони прагнуть грабувати американські землі, щоб викрасти дари, надані їй її вірним!” Натовп вибухнув оваціями, змусивши її зробити паузу... “Але вони недооцінили Епоху Американи, яка скоро охопить безвірні землі навколо нас! Ми більше не боїмося дияволів, що проникають у наші міста, бо наша віра в її ангельську силу провела нас далі за будь-яку техніку чи ідеологію!”\n\nВона окинула натовп поглядом, готуючись завершити палку промову: “Так звані 'патріоти' на заході не мають місця в нашому досконалому світі... Вони лише егоїстичні демони, що отруюють розум нашої молоді фальшивим Євангелієм про минуле, якого ніколи не було, бо вони ніколи не бачили справжньої краси Америки! Вони не витримають погляду Несучої Світло — ми переможемо!” Її останні слова луною прокотились площею, а натовп вибухнув гучними оплесками й почав скандувати: “Америка... Америка... Америка!”"
nf_hvr.8.a:0 "Чудовий натовп сьогодні!"

nf_hvr.9.t:0 "Священики Америки"
nf_hvr.9.d:0 "Для народу Монтани Культ Свободи довгий час був маргінальним рухом... Поки не з’явилися бойові священики. У силовій броні, купленій у Республіки Маршалів, вони стали авангардом на околицях проти будь-яких загроз. Анклав — довга, темна й викривлена тінь Америки — знає їх лише зі своїх найгірших кошмарів. Без сумніву, саме сила касти Священиків Війни стримує Анклав у горах.\n\nВони — наші захисники, найвірніші, еліта Робертсон. Саме завдяки їм ми маємо майбутнє в ім’я Америки, щоб її земля була родюча, а світанки — золоті.\n\nЦі вірні послідовники ведені Джулією Карвер — дочкою дезертирів з Анклаву, осиротілою в дитинстві. Сьогодні вона очолює Священиків Війни, і полум’я свободи в її серці палає так само яскраво, як і ненависть до сил Анклаву, що вторглися в Монтану."
nf_hvr.9.a:0 "Боже, благослови їхні серця."

nf_hvr.10.t:0 "Наші друзі у Сейфхейвені"
nf_hvr.10.d:0 "Сейфхейвен давно вже став союзником народу Гавру. Потрібна зброя? Досить мати товстий гаманець — і тебе зустріне блискучий метал, заряджений і змащений, готовий до бою. Потрібна охорона? Ворони й Вартові завжди напоготові. Чого ж тоді Культ Свободи потребує сьогодні?"
nf_hvr.10.a:0 "Зброї — для захисту спадку Америки."
nf_hvr.10.b:0 "Вишколу — для зміцнення сили Америки."

nf_hvr.11.t:0 "Культ Свободи"
nf_hvr.11.d:0 "Протягом років ми постачали й допомагали Культу Свободи з їхньою маленькою 'релігією' в Монтані. Вони звертались до нас по зброю, вишкіл та всіляке постачання й знання. Що ж ми найбільше цінуємо з цієї торгівлі?"
nf_hvr.11.a:0 "Кришки!"
nf_hvr.11.b:0 "Політичний вплив."
nf_hvr.11.c:0 "Ту нову барну, за рогом!"

nf_hvr.12.t:0 "Завод «Нюка-Коли» знову відкрито!"
nf_hvr.12.d:0 "Культ Свободи запросив усіх жителів Монтани на урочисте відкриття відновленого заводу Нюка-Коли. На питання, чому вони його відкрили, представники Культу заявили: “Народ хоче затишку і місця для праці, і цей завод це забезпечить.”\n\nПрисутні на заході зазначили: “Ця Нюка-Кола гірша за ту, що ми знаходимо на вулицях.”"
nf_hvr.12.a:0 "Може, деякі речі краще залишити в минулому."

#Focus LOC
HVR_havre:0 "Колись сплюндрована на американській землі..."
HVR_havre_desc:0 "Колись Гавр управлявся слабо організованою спадковою мерською системою, але згодом така розслаблена влада поступилася чомусь більшому..."

HVR_the_cult_of_liberty:0 "Суть Свободи в Серці Країни"
HVR_the_cult_of_liberty_desc:0 "З падінням влади в Гаврі Свобода здобула шанс піднятись — і разом із нею Ріанна."

HVR_freedom_rang_silently:0 "Свобода Розкута — Тріумфальне Повернення Незабаром!"
HVR_freedom_rang_silently_desc:0 "Із розповсюдженням Свободи Америка повернеться, й вона також поширить своє процвітання!"

HVR_americas_best_friend:0 "Найкращі Друзі Америки"
HVR_americas_best_friend_desc:0 "Тексти дуже чіткі щодо цього. Та й, хіба ви скажете своїй пастві, що хочете скасувати політику «безкоштовного цуцика»?"

HVR_rhiannas_mission:0 "Відлуння Євангелія Ріанни"
HVR_rhiannas_mission_desc:0 "Місія Ріанни поширити Євангеліє Америки йде успішно, все більше мешканців Гавру приєднуються до нашої громади."

HVR_guns_of_liberty:0 "Розкута Міць Свободи"
HVR_guns_of_liberty_desc:0 "Хоча ми всі — діти Америки і прагнемо об’єднати всіх під нашою паствою, шлях до свободи має бути вимощений серцями, кров’ю та залізом тих, хто готовий її здобути."

HVR_galvanized_masses:0 "Загартована Сила Американських Мас"
HVR_galvanized_masses_desc:0 "Хоч нам бракує сталі Братства чи вишколу Анклаву, наші вояки й душі загартовані любов’ю Америки й обов’язком забезпечити її повернення."

HVR_a_weapon_worthy_of_america:0 "Неперевершена Міць Америки"
HVR_a_weapon_worthy_of_america_desc:0 "Завдяки блискучим умам з дослідницького відділу Zack Company, ми здобули змогу творити зброю, гідну любові Америки."

HVR_american_killin_time:0 "Вбивати Серцем"
HVR_american_killin_time_desc:0 "Її любов до вогневої сили добре задокументована у священних текстах. Якщо ці гармати не гідні її любові — то принаймні ми будемо в безпеці, доки не знайдемо ще більші."

HVR_with_thanks_to_the_ruminators:0 "Подяка Румінаторам"
HVR_with_thanks_to_the_ruminators_desc:0 "Завдяки «добровольцям» з Румінаторів, ми опанували медицину та застосовуємо її на користь солдатів і вірян Америки."

HVR_holy_tithings:0 "Священні Десятини Америки"
HVR_holy_tithings_desc:0 "Завдяки пожертвам на зібраннях і проповідях ми зібрали чималу суму, яку підкріплює добровільна десятина від громадян Гавру."

HVR_muster_a_militia:0 "Мобілізація Американської Міліції!"
HVR_muster_a_militia_desc:0 "Найкращі з борців за свободу долучились до справи, а Гавр став центром її поширення. Якби ж Америка могла нас побачити..."

HVR_american_faithfuls:0 "Спадщина Вірних Америки"
HVR_american_faithfuls_desc:0 "Ті, хто вірить, працюють вдвічі завзятіше, ніж ті, хто не вірить. На щастя, наша віра поширюється як вогонь, особливо вдома."

HVR_americas_grace:0 "Благодать Червоного, Білого та Синього Духа!"
HVR_americas_grace_desc:0 "Ми вже майже досягли мети... Америка повернеться. Я доведу, що моя мати була права."

HVR_julia_carver:0 "Джулія Карвер, Захисниця Свободи"
HVR_julia_carver_desc:0 "Коли зросли Libertim Dei та Americana — або ж Культ Свободи — мій батько залучив Zack Company як охорону мітингів. Але після того, як його вбили внаслідок рейду Анклаву, виникла потреба в нових воїнах, які могли б допомогти поширювати нашу віру."

HVR_american_vigilants:0 "Вартові Зірок і Смуг"
HVR_american_vigilants_desc:0 "Ті, хто прагне оволодіти міццю сталі — тією ж, що у Братства чи Спецпризначенці та елітніу — надали нам змогу створити власну силу. Під пильним оком Карвер, Священики Війни матимуть шанс протистояти їм. Америка Благословить."

HVR_against_the_storm:0 "Свобода Стає Проти Монгерів"
HVR_against_the_storm_desc:0 "Ми загартовані Америкою, так. Але цього недостатньо. Хоч Америка і захищає наші душі... наші незламні тіла мають кинути виклик страху, що ховається за залізом."

HVR_showtime:0 "Друзі в Сейфгейвені"
HVR_showtime_desc:0 "Сейфгейвен — давній союзник Гавру і досі друг свободи, має багато чим нам допомогти. Нехай Америка благословить їх."

HVR_learning_from_wardens:0 "Уроки від Вартових"
HVR_learning_from_wardens_desc:0 "Хоч вони вже дали нам чимало, Вартові досі знаходять у своїх серцях місце для нас! Деякі ветерани вирішили поділитися своїм досвідом — серце Америки сповнене любові до них!"

HVR_men_for_the_front:0 "Доказ Віри"
HVR_men_for_the_front_desc:0 "Найвірніший доказ віри — взяти зброю в ім’я Ангела!"

HVR_infrastructure:0 "Піонери Гавру"
HVR_infrastructure_desc:0 "Гавр завжди мав багатство яскравих умів. Віра в Америку надихнула їх використати свій розум на благо народу."

HVR_the_nuka_cola_plant:0 "Завод Нюка-Коли"
HVR_the_nuka_cola_plant_desc:0 "До війни Честер був центром виробництва Нюка-Коли. Хоч усе, що лишилося — це ливарня, ми можемо переобладнати її для потреб сучасного Гавру та служіння Американі."

HVR_open_the_nuka_cola_plant_for_all:0 "Ковток Свободи, у стилі Лібертас!"
HVR_open_the_nuka_cola_plant_for_all_desc:0 "Хоч ми переобладнали більшість старих фабрик Нюка-Коли, трохи запасів залишилось — чому б не поділитися добробутом, який несе Америка? Нюка-Кола для всіх!"

HVR_cola_factory_tools:0 "Утримання Ліній"
HVR_cola_factory_tools_desc:0 "Щоб Кола текла, нам довелося навчитись доглядати за лініями, аби ті не забилися і не зупинили той солодкий потік."

HVR_the_northline:0 "Подорож до Прикордоння Серця Країни"
HVR_the_northline_desc:0 "Нортлайн колись проходив через самий верх наших земель — ми можемо знову ним скористатись. Америка і далі нас благословляє!"

HVR_moving_in_to_malmstrom:0 "Вступ до Мальмстрому"
HVR_moving_in_to_malmstrom_desc:0 "Авіабаза Мальмстром — одне з наших відновлених володінь, має багато чого запропонувати нам і Америці. Наші науковці зацікавилися її вмістом, і тепер слово Американи шириться ще далі!"

HVR_scrapping_storm_monger_things:0 "Усе-Лібертинське Зусилля Проти Абсурдних Зміїв!"
HVR_scrapping_storm_monger_things_desc:0 "Я б погрався з ними... якби вони не були в кишках. Зате добрий брухт."

HVR_storm_mongers_teachings:0 "Мудрість Штормоборців"
HVR_storm_mongers_teachings_desc:0 "Деякі з полонених штормі вирішили показати нам, як працюють ці повітряні змії — без тіл, звісно. Америка благословить їх! Це весело!"

HVR_last_rides:0 "Останній Заїзд у Горизонт"
HVR_last_rides_desc:0 "Яка ж це була забава з цими зміями! Можемо використати їх у поширенні слова Америки!"

HVR_landing_pad:0 "Велика Посадка"
HVR_landing_pad_desc:0 "Об’єднавши наші знання зі знаннями Штормоборців, ми прийшли до очевидного висновку: Ангели літають. Отже, Америці потрібне місце для приземлення. Чому б не потренуватись у побудові посадкових майданчиків?"

HVR_cut_the_smiles:0 "Пошук Щастя Свободою"
HVR_cut_the_smiles_desc:0 "Хоча Румінатори були корисні, ми маємо прийняти їх до нашої пастви — навіть якщо доведеться скористатись нашою міццю..."

HVR_the_priests:0 "Священні Священики Свободи"
HVR_the_priests_desc:0 "Велика сцена готова, а промови Ріанни славляться здатністю збирати натовпи. Америка благословить!"

HVR_the_outskirts:0 "За Межами Пограниччя"
HVR_the_outskirts_desc:0 "Гавр завжди був безпечним місцем. Якщо пощастить, так буде й надалі..."

HVR_the_last_sibling:0 "Сага про Останню Сестру"
HVR_the_last_sibling_desc:0 "Сходження Жаклін Марро було сповнене суперечок, але мало хто насмілився їй протистояти."

HVR_runoff_from_macarthur:0 "Відгомін Макартура"
HVR_runoff_from_macarthur_desc:0 "Залізна хватка Макартура в Скелястих Горах змусила багатьох втекти на схід. Але з загрозою нового Братства й зростаючим гнівом Стендінґ Рока, дехто шукає спасіння на околицях..."

HVR_niitsitapi:0 "Дух Ніітсітапі"
HVR_niitsitapi_desc:0 "Ніітсітапі привітні до мандрівників, але швидко підозрюють чужинців. Дружбу з ними слід вибудовувати обережно, щоб не розгнівати Стару Руку."

HVR_stay_the_hand:0 "Рука Свободи"
HVR_stay_the_hand_desc:0 "Можливо, ми справді зможемо стати друзями? Народ Гавру та Ніітсітапі мають що запропонувати одне одному — і досвід, і товари."

HVR_remember_old_dues:0 "Спогади про Старі Борги"
HVR_remember_old_dues_desc:0 "Люди з Загону Зака не забули старі битви. Вони битимуться, поки не зламається кожна кістка в їхньому тілі, якщо це очистить їхнє ім’я."

HVR_a_friend_indeed:0 "Одіссея Олдґана"
HVR_a_friend_indeed_desc:0 "Джеремі Олдґан — розсудливий і досвідчений чоловік, геній сучасної пустки. Мати його на нашому боці — це благословення, якому немає рівних. Ми надішлемо пропозицію про союз і подивимось, що він відповість!"

HVR_listening_to_the_thieves:0 "Прислухаючись до Злочинців"
HVR_listening_to_the_thieves_desc:0 "Гільдія злодіїв — це купа винахідників, і Воллфлауер не виняток. Вона й її люди кмітливі, перетворюють колишніх невдах на функціональних громадян. Можливо, злодії не такі вже й погані!"

HVR_swindling_passerby:0 "Прикордонне Шахрайство"
HVR_swindling_passerby_desc:0 "Люди Монтани скупі й недовірливі. І недарма — адже Анклав може забрати все будь-якої миті. Але гостра потреба змушує нас брати те, що необхідно."

HVR_friends_round_the_old_block:0 "Друзі з Району"
HVR_friends_round_the_old_block_desc:0 "Багато хто в Гаврі має неабиякий талант, але ми не дали їм змоги його реалізувати. Чому б не дати їм шанс проявити себе?"

HVR_land_of_opportunity:0 "Нескінченний Край Можливостей"
HVR_land_of_opportunity_desc:0 "Яке б не було ваше ставлення до Культу Свободи, в одному вони мали рацію: Америка справді була землею можливостей."

HVR_approaching_saints:0 "Звернення до Святих"
HVR_approaching_saints_desc:0 "Святі з Розтяжки — не найкращі союзники, але колись ризикували заради нас. Час віддячити?"

HVR_pushing_out_the_thieves:0 "Викорінюючи Злочинців"
HVR_pushing_out_the_thieves_desc:0 "Гільдія злодіїв — загроза святому обличчю Гавру та благодаті Америки. Ми повинні виступити єдиним фронтом в її ім’я!"

HVR_appointing_frostguards:0 "Зростання Вірних Свободі"
HVR_appointing_frostguards_desc:0 "Культ Свободи захистить нас усіх. Америка благословить!"

HVR_matching_enclave_production:0 "Наздоганяючи Виробництво Анклаву"
HVR_matching_enclave_production_desc:0 "Анклав — єретики. Колись вони, можливо, хотіли виконати волю Америки, але їхній шлях збився, і тепер ми маємо довести їх до могили."

HVR_frostwall_industry:0 "Земля Просвітлення"
HVR_frostwall_industry_desc:0 "Саме в очах Америки наші молоти знаходять натхнення. Саме її погляд надихає нас на працю. Вона — наша колиска, і саме її дух побудував цей світ."

HVR_frostwall_whiteguard:0 "Посеред Завірюхи"
HVR_frostwall_whiteguard_desc:0 "Небо наблизить нас до Америки. Штормоборці, на диво, збили багато старих віртіптахів Анклаву. З майстрами Гавру ми відновимо, що зможемо — і піднімемось у небо, як ангели."

HVR_pushing_out:0 "Рух Назовні з Гавру"
HVR_pushing_out_desc:0 "Гавр — не домівка для майбутнього. Ми повинні закріпитись там, де зможемо щось змінити."

HVR_whitewall:0 "Фортеця-Суспільство"
HVR_whitewall_desc:0 "Фортеця-Суспільство змінить усе. Ангел завжди з нами."

HVR_sit_upon_a_throne:0 "Тріумф Корони Свободи"
HVR_sit_upon_a_throne_desc:0 "Макартур впав! Радійте, люди Гавру! Радійте!"

HVR_scouring_brotherhood_treasures:0 "Чистимо Скарби Братства"
HVR_scouring_brotherhood_treasures_desc:0 "Братство — це технозлодії. То чому б нам не пограбувати пограбоване?"

HVR_sisterhood_occupation:0 "Під Окупацією Сестринства"
HVR_sisterhood_occupation_desc:0 "Сестринство мовчки зайняло Гавр. За одну ніч вони стали правителями. Що чекає на околиці?"

HVR_sisterhood_friendship:0 "Друзі — ще й з Пільгами!"
HVR_sisterhood_friendship_desc:0 "Лицар Люз з усім запалом перебрала владу в Гаврі. Її мудрість веде нас у нове майбутнє!"

HVR_respectable_friends:0 "Люди Здорового Глузду"
HVR_respectable_friends_desc:0 "Люди зі Старого Краю мислять правильно! Можливо, ми зможемо йти у майбутнє разом?"

HVR_puppet_the_consortium:0 "Звернутись до Консорціуму"
HVR_puppet_the_consortium_desc:0 "Не треба бути генієм, щоб зрозуміти — ми не маємо уявлення, як керувати шахтами. Але ми загнали їх у гарне положення, де вони можуть служити нам і людям Монтани. Ми дозволимо їм самостійно керувати — в розумних межах — і будемо підтримувати порядок, як належить."

HVR_puppet_fort_verity:0 "Мир Танії"
HVR_puppet_fort_verity_desc:0 "Форт Веріті — затишне маленьке містечко. Хоч його й десятки разів топтало Братство, ми можемо допомогти Танії відбудувати його."

HVR_against_the_mongers:0 "Вчора Має Стати Історією"
HVR_against_the_mongers_desc:0 "Штормоборці вже надто довго були проблемою. Час діяти — або зараз, або ніколи!"

HVR_claims_tt:0 "Ми отримаємо §Mпретензії§! на всю §GМонтану§!!"
HVR_vengeance_tt:0 "§RГавр отримає військову ціль проти нас!§!"

# ideas

hvr_american_faithful:0 "Церква Америки"

hvr_thieves_outreach:0 "Допомога від Злодіїв"

hvr_resourcefulness:0 "Життя на Межі"

hvr_american_idiots:0 "Американські Ідіоти"

hvr_the_deal:0 "Угода Гавру та Нііцітапі"

hvr_beast_of_america:0 "Звір Америки"
hvr_beast_of_america_desc:0 "Хіба вам не набридло постійне базікання Анклаву про обов’язок перед вигаданою «державою»? А Братство зі Сходу, що хоче забрати ваше добро? А пацифісти Румінаторів вас не дратують? Тоді Культ Свободи простягає свої руки!\n\nАмерика не чекає, поки невпевнений стане впевненим у своїй вірі. Саме в святому «зараз» ми можемо створити божественне майбутнє."

hvr_americore:0 "Заразлива Релігія"
hvr_americore_desc:0 "§YАмерикана: Життя, свобода і прагнення до щастя.§!\n\nЦі основоположні догми віри, або ж марення, призвели до підкорення непідкорюваного. Анклав, Трайбали, Рейдери — всі вони впали перед тими, хто купався у світлі Америки. І тепер ця віра поширюється майже як хвороба, і ті, хто приймає новий стяг Pax Americana, легко тягнуться до простягнутої руки її чемпіонів — руки, простягнутої в ім’я свободи, хай навіть трохи божевільної."

# tooltips

HVR_carpo_tt:0 "§YДва піхотні підрозділи§! приєднаються до нашої армії."