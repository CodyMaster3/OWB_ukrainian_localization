#Characters
HVR_JACQUELINE_NAME: "Жаклін Марро"
HVR_JACQUELINE_DESC: "Мер Жаклін має трохи незвичну роль. На відміну від мерів на заході, вона успадкувала посаду від батька, який своєю чергою отримав її від свого батька. Але як для мера — вона не така вже й погана; вбила лише одного зі своїх братів, щоби зайняти місце батька за столом. Тепер Жаклін намагається керувати своєю маленькою громадою, сподіваючись, що історія пройде повз, як це бувало раніше.\n\nТа цього разу їй може не пощастити."

HVR_LUZ_NAME: "Чужинка Лус"
HVR_LUZ_DESC: ""

HVR_RHIANNA_NAME: "Ріанна Робертсон"
HVR_RHIANNA_DESC: "§Y\"Нехай наші голоси луною прокотяться пустками, до вух загублених і зламаних. Нехай вони дізнаються, що крила Америки широко розпростерті, готові захистити всіх, хто шукає спокути. В єдності ми збудуємо нову еру, де світ буде залитий сяйвом благодаті Америки. Вірте в неї, браття мої, бо вона виведе нас із мороку до обіймів надії.\"§!\n\nДочка побожної матері та члена Компанії Зака, для цієї молодої жінки любов і війна — нерозривні. Вона несе віру в Американу, мов вогонь, очоливши повстання у Гаврі, скинувши спадкову систему мерів і встановивши хаос, у якому багато організацій, парадоксально, знайшли спокій. Це дало культові підтримку після смерті її божевільного батька — засновника віровчення, що спотворило уявлення її матері.\n\nІноді її називають Ліберті або Libertas Dei. Американа — це віра в життя, свободу та прагнення щастя, а також у саму Америку — не країну чи континент, а ангела, посланого Богом, аби нести добробут американському народу. Вкрадена темрявою Великої війни, ця істота має бути повернута, а світ — очищений від мороку. Цієї мети культ прагне за будь-яку ціну..."

HVR_CARVER_NAME: "Карвер"

HVR_WALLFLOWER_NAME: "Волфлауер"

HVR_LEONA_SMITHEE_NAME:0 "Леона Сміті"
HVR_LEONA_SMITHEE_DESC:0 "§L\"Розграбувати людину, збити її з ніг, плюнути в обличчя — це одне; вона більше не підставиться. Але справжня гра — обікрасти так, щоб тебе не викрили, щоб вони самі просили ще!\"§!\n\nЛеона — одна з найавторитетніших злодійок Гільдії крадіїв — давно підтримує рух за Ліберті, бо той ідеально маскує її діяльність і слугує прикриттям для гільдії, що має базу у колишньому Гаврі.\n\nЇї навіть призначили радницею культу з економіки й торгівлі. Ріанна перейняла чимало вчень Леони — шантаж, здирництво й інші риси справжнього капіталізму. Чи вірить Сміті в ангела Америку — залишається предметом чуток у гільдії. Хтось каже — так, хтось ні. Але одне точно: Леона віддана. Чи справі, чи самій жриці — лишається загадкою. Та вона зробить усе, щоби гільдія мала своє місце в новому світі культу — у світлі Америки чи без нього..."

HVR_JASON_FOSTER_NAME:0 "Джейсон З. Фостер"
HVR_JASON_FOSTER_DESC:0 "§C\"Емм... отут треба прикрити... може, підірвати ось це? Не знаю, чоловіче...\"§!\n\nНевпевнений, загублений і надзвичайно везучий, Джейсон — залишок Компанії Зака — якимось дивом став головою військових операцій Культу Ліберті. Тактики він не тямить, але саме це зробило його цінним: непередбачуваність стала перевагою, якої не змогли подолати вороги культу.\n\nЙого безпорадність стала привабливою для багатьох шукачів істинної свободи — як у партизанці, так і в тилу. Це зміцнило військову спроможність культу й надало Фостеру, як не дивно, неабияку славу. До речі, саме залишки Компанії Зака «добровільно» висунули його на цю посаду, щоби позбутися. Але, схоже, жарт вдався не їм — Джейсон, можливо, не розуміє, що діється, але вважає, що переміг..."


