# DSL (Doushou Lu)
DSL_melee_equipment_3:0 "Меч китайського офіцера"
DSL_melee_equipment_3_short:0 "Офіцерський меч"
DSL_melee_equipment_3_desc:0 "Ручної роботи меч, виготовлений за зразками із батьківщини. Символ честі й майстерності, який не втратив актуальності навіть після Апокаліпсису."
DSL_ballistic_equipment_1:0 "Shanxi Type 17"
DSL_ballistic_equipment_1_short:0 "Пістолет Type 17"
DSL_ballistic_equipment_1_desc:0 "Shanxi Type 17 — масово вироблений пістолет до Великої Війни. Вперше створений у 1929 році на арсеналі Тайюаня для армії Янь Сішаня. Тепер — історичний спадок, що пам’ятає Війну за ресурси."
DSL_ballistic_equipment_2:0 "Саморобна штурмова гвинтівка"
DSL_ballistic_equipment_2_short:0 "Саморобна гвинтівка"
DSL_ballistic_equipment_2_desc:0 "Спрощена версія Type 93, ця гвинтівка є дешевим аналогом оригіналу. Попри нижчу якість, її легко виробляти та ремонтувати. Старші покоління в DSL цінують її за знайомий дизайн і ностальгію."
DSL_ballistic_equipment_3:0 "Китайська штурмова гвинтівка Type 93"
DSL_ballistic_equipment_3_short:0 "Кит. гвинтівка"
DSL_ballistic_equipment_3_desc:0 "Гвинтівка Type 93 була розроблена для Народно-визвольної армії Китаю під час Війни за ресурси. Призначена для диверсантів і п’ятої колони в США, має калібр 5.56мм і магазин на 24 набої. Тиха, смертоносна і глибоко політична."
DSL_spec_ops_equipment_4:0 "Стелс-броня Хей Гуй"
DSL_spec_ops_equipment_4_short:0 "Стелс-броня"
DSL_spec_ops_equipment_4_desc:0 "Китайська стелс-броня використовувалась під час вторгнення на Аляску як відповідь на силову броню США. Її носили елітні Дракони і підрозділи боротьби з повстанцями. DSL зберігає цю технологію, щоб непомітно спостерігати за ворогами."
DSL_spec_ops_equipment_5:0 "Посилена броня Fùchóu Jīngshén"
DSL_spec_ops_equipment_5_short:0 "Посил. Стелс-броня"
DSL_spec_ops_equipment_5_desc:0 "Природне продовження попередньої моделі: вбудована композитна нагрудна пластина, шолом з легких сплавів, додаткове джерело живлення на спині. Покращує виживання в бою і подовжує дію стелс-поля."
DSL_explosive_demolitions_equipment_3:0 "Гранатомет 'Червона Перемога'"
DSL_explosive_demolitions_equipment_3_short:0 "Гранатомет"
DSL_explosive_demolitions_equipment_3_desc:0 "Прототип, переведений у серійне виробництво. Ця захоплена американська зброя була модифікована під китайські потреби: дерев’яні частини замінено на сплави, і тепер вона стріляє руйнівними 40мм гранатами. Ідеальна як проти броні, так і проти живої сили."
DSL_power_armor_equipment_tbh:0 "Китайська силова броня"
DSL_power_armor_equipment_tbh_short:0 "Кит. СБ"
DSL_power_armor_equipment_tbh_desc:0 "Спроба Китаю наздогнати США в розвитку силової броні. Хоч і не досягла рівня американських моделей, ця розробка дозволяє тримати паритет навіть у поствоєнному світі."

# EDA (Blue Rose Society)
EDA_ballistic_equipment_1:0 "Приглушений Пістолет"
EDA_ballistic_equipment_1_short:0 "Деліверер"
EDA_ballistic_equipment_1_desc:0 "Створений для оперативників, яким потрібна тиха альтернатива, цей компактний пістолет стріляє стандартними 9мм набоями з легкої платформи, приглушеної завдяки вбудованому глушнику та використанню дозвукових патронів. Ідеальний для проникнення й таємних операцій — класика жанру для шпигунів."
EDA_ballistic_equipment_3:0 "ПП P90"
EDA_ballistic_equipment_3_short:0 "P90"
EDA_ballistic_equipment_3_desc:0 "Передова європейська зброя, яку імпортували до США для оснащення підрозділів спецоперацій. Знайдена в армійських складах і поставлена на масове виробництво. Надзвичайно компактна, створена для пробивання броні й здатна вмістити цілих п’ятдесят 5.7мм патронів. Висока скорострільність + антикульова ефективність = ідеальна штука для ближнього бою."
EDA_ballistic_equipment_4:0 "R91C-S «Інфільтратор»"
EDA_ballistic_equipment_4_short:0 "Інфільтратор"
EDA_ballistic_equipment_4_desc:0 "Один із основних «робочих конячок» армії США до Великої Війни. R91 — це модульна платформа, яку можна налаштувати під будь-яку роль у підрозділі. Цей варіант — модернізований варіант для миротворчих операцій у містах та за кордоном: обрізаний приклад, змінна оптика, глушник. Ідеально для тих, хто любить працювати тихо й на відстані."
EDA_plasma_equipment_1:0 "Зетанський Бластер"
EDA_plasma_equipment_1_short:0 "Зетан-Бластер"
EDA_plasma_equipment_1_desc:0 "Розроблений у Сховищі 4 шляхом зворотної інженерії інопланетних зразків, цей витончений агрегат демонструє справжню силу плазми. Порівняно з ним — інші плазмогани виглядають як грубі підробки..."
EDA_plasma_equipment_2:0 "Зетанський Дезінтегратор"
EDA_plasma_equipment_2_short:0 "Зетан-Дезінтегратор"
EDA_plasma_equipment_2_desc:0 "Наступна сходинка у вивченні технологій «Зетанів»: ця гвинтівка поєднує потужність плазми з точністю і дальністю лазерної зброї. Легко перетворює навіть броньованого ворога на купу попелу — й без зайвих зусиль!"
EDA_enclave_spec_ops_equipment_1:0 "Стелс-Костюм ОЗЗ MK III"
EDA_enclave_spec_ops_equipment_1_short:0 "Стелс-Костюм MK III"
EDA_enclave_spec_ops_equipment_1_desc:0 "Розроблений ще до війни прототип стелс-костюма MK II від Big Mountain мав цілу низку функцій: покращені приводи, поглинання звуку та вбудовану медичну AI-систему. Фінальна версія включає напрацювання з броні Таємної Служби — краще захищає від радіації та побічок від користування Стелс-боєм, а зовнішня броня забезпечує додатковий захист на полі бою."
EDA_fireteam_equipment_1:0 ".45 Автоматичний Пістолет-Кулемет"
EDA_fireteam_equipment_1_short:0 ".45 Авто-ПП"
EDA_fireteam_equipment_1_desc:0 ".45-й калібр, автоматичний режим — цей ПП вивалює на ворога стіну вогню з ближньої дистанції. Справжнє м’ясо."
EDA_super_heavy_robot_equipment_1:0 "Силовий Костюм ОЗЗ"
EDA_super_heavy_robot_equipment_1_short:0 "Силовий Костюм"
EDA_super_heavy_robot_equipment_1_desc:0 "Навіть Силова Броня здається дитячою іграшкою поруч із цим монстром. Експериментальна двонога бойова платформа створена, аби нищити будь-кого, хто насмілиться підійти до Нью-Мексико. Так, він повільніший і громіздкіший за танк, зате витривалість у нього просто поза межами."
EDA_super_heavy_robot_equipment_2:0 "Силовий Костюм ОЗЗ MK II"
EDA_super_heavy_robot_equipment_2_short:0 "Силовий Костюм MK II"
EDA_super_heavy_robot_equipment_2_desc:0 "Удосконалений за допомогою космічних технологій: герметичний, здатен працювати в вакуумі та низькій гравітації. Щити, зетанські бластери, сучасні ракети та вдосконалений ШІ, що дозволяє костюму битися навіть без пілота — усе це робить його найпотужнішим бойовим костюмом на планеті. І не тільки."
EDA_payload_glider_equipment_1:0 "Прототип Ракети з Уайт-Сендс"
EDA_payload_glider_equipment_1_short:0 "Прототип Ракети"
EDA_payload_glider_equipment_1_desc:0 "Полігон Уайт-Сендс колись служив випробувальним майданчиком для арсеналу прототипів США. Після Великої Війни ми лише вдосконалили традиції. Нове покоління ракет б’є з вражаючою точністю й нещадною руйнівністю."
EDA_fighter_equipment_5:0 "Перехоплювач «Рейвен»"
EDA_fighter_equipment_5_short:0 "Рейвен"
EDA_fighter_equipment_5_desc:0 "Передові авіоніка, точне наведення та двигуни з ядерним імпульсним вибухом роблять цей винищувач вершиною розвитку. Він може знищувати цілі навіть на низькій орбіті. А ще й звичайну авіацію ганяє, як мух."
EDA_cargo_plane_equipment_3:0 "Скайрейнджер"
EDA_cargo_plane_equipment_3_short:0 "Скайрейнджер"
EDA_cargo_plane_equipment_3_desc:0 "Гіперзвуковий літак, здатен — теоретично — висадити десант будь-де на планеті за лічені хвилини. Вертикальні зльоти й посадки, векторна тяга... Шкода тільки, що ми втратили технології виробництва пального після Великої Війни."
EDA_high_fighter_equipment:0 "Літаюча Тарілка"
EDA_high_fighter_equipment_short:0 "Тарілка"
EDA_high_fighter_equipment_desc:0 "Антигравітаційні поля, плазмові проєктори, протиракетні щити — остання модель «тарілки» готова рознести будь-який земний літальний апарат. Кидай виклик нам у повітрі — і станеш попелом."
EDA_high_cas_equipment:0 "Атакувальна Тарілка"
EDA_high_cas_equipment_short:0 "Атак-Тарілка"
EDA_high_cas_equipment_desc:0 "Посилена лобова броня, щити під корпусом, дронові гармати, потрійні дезінтегратори й мікро-променевий генератор смерті... Коли ці штуки з’являються над головою — краще одразу шукати заповіт. Вони не створені для повітряного бою, але можуть атакувати та щезнути в орбіту ще до того, як ворог зрозуміє, що його вбило."
EDA_spotter_plane_equipment_3:0 "Розвідник"
EDA_spotter_plane_equipment_3_short:0 "Розвідник"
EDA_spotter_plane_equipment_3_desc:0 "Інформація — не менш смертоносна за кулю. Після атомної війни мапи та супутникові знімки стали безглуздям. Але ми пристосували тарілки для розвідки, і тепер можемо вислідити будь-яку загрозу, хоч на цьому світі, хоч на тому. Імовірність їх збити — мінімальна. Напевно."
EDA_high_fighter_unlock_tech:0 "Креслення Тарілки"
EDA_high_fighter_unlock_tech_desc:0 "Невідомого походження креслення, що демонструють, як будувати літаючі тарілки на базі антигравітаційних технологій. Жоден звичайний літак із ними не зрівняється."
EDA_CES_horns_moroni_tech:0 "Дивні Ліки"
EDA_CES_horns_moroni_tech_desc:0 "Джерело цього біо-медичного гелю викликає підозри, але результат — вражаючий. Хай це й не стімпак, зате він загоює рани й навіть пришиває кінцівки на місце. Додали до загонів польових медиків-дослідників — раптом доведеться щось... препарувати."
EDA_itz_rough_terrian_training:0 "Реактивні Ранці"
EDA_itz_rough_terrian_training_desc:0 "Мобільність, яку дають джетпаки, неможливо переоцінити. Комбінуючи антигравітацію з ядерним прискоренням, ми досягли стабільного польоту на кілька хвилин! Хтось скаже — дурня. Але хай спершу стрибне через поле бою й розстріляє ворога в спину."
HAN_light_motorized_equipment_4:0 "Девастатор 2000"
HAN_light_motorized_equipment_4_short:0 "Девастатор"
HAN_light_motorized_equipment_4_desc:0 "Пік американського оверінжинирингу. Девастатор 2000 — довоєнний суперкар для спецагентів та DIA. Хоча по факту — іграшка для багатіїв. Ядерно-гідравлічний стрибок, гравітаційне пригальмовування, вбудовані ракети, димова завіса, куленепробивні сидіння... Функціонал хумві, тільки в десять разів дорожчий і на порядок стильніший."

# EHT (The Eighties)
EHT_ballistic_equipment_1:0 "Обріз Дробовика"
EHT_ballistic_equipment_1_short:0 "Обріз"
EHT_ballistic_equipment_1_desc:0 "Мотоциклетні рейди зі зброєю не дають великого вибору, але якщо Вісімдесятники щось і засвоїли з воєн на дорогах — так це цінність ближнього бою. Узяв 12-каліберний дробовик, зрізав приклад і ствол, зарядив трійкою нульовок — і ти вже не байкер, а стихія з вогневою потугою на адреналіні."
EHT_ballistic_equipment_2:0 ".45 Автоматичний Пістолет-Кулемет"
EHT_ballistic_equipment_2_short:0 ".45 Авто-ПП"
EHT_ballistic_equipment_2_desc:0 "Потреба у потужнішій, але компактній зброї змусила Вісімдесятників створити цей ПП. Скорочена газова система, телескопічний затвор, стрільба найпоширенішим патроном пустки — усе в обтічному корпусі без прикладу. Хочеш стріляти на повній швидкості однією рукою? Легко."
EHT_melee_equipment_2:0 "Шипований Монтувальник"
EHT_melee_equipment_2_short:0 "Клинок Дороги"
EHT_melee_equipment_2_desc:0 "Прості рішення — найкращі. Складна проблема: «Як прибрати он того?» Просте рішення: «Розігнатись на байку й врізатись йому в лоба сталевим клинком». Просто й ефективно, у стилі Вісімдесятників. Це просто монтировки з привареними лезами — і для ремонту байка, і для ламання щелеп."
EHT_melee_equipment_3:0 "Бензопила на Пальному"
EHT_melee_equipment_3_short:0 "Бензопила"
EHT_melee_equipment_3_desc:0 "Грубий, але з любов’ю кастомізований інструмент масового розчленування. Бензопила на металевому держаку, зварена з мотоциклетним двигуном високих обертів. Вона більше схожа на древкову зброю, ніж на пилу. Може знищувати ворогів навіть під час їзди. І якщо її гуркіт не змусить тремтіти, то значить, ви вже мертві."

# ENC (Enclave)
ENC_energy_equipment_3:0 "M1 Вінчестер"
ENC_energy_equipment_3_short:0 "M1 Вінчестер"
ENC_energy_equipment_3_desc:0 "Розроблений як альтернатива Міській Плазмовій Гвинтівці на базі довоєнної зброї та трофеїв із Наварро."

