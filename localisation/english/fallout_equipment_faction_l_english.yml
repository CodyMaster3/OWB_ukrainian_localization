MCA_explosive_demolitions_equipment_3_short:0 "Великий Ведмідь"
MCA_explosive_demolitions_equipment_3_desc:0 ""
MCA_explosive_demolitions_equipment_4:0 "Гранатомет Mk17"
MCA_explosive_demolitions_equipment_4_short:0 "Авто-Гранатомет"
MCA_explosive_demolitions_equipment_4_desc:0 ""
MCA_heavy_infantry_equipment_1:0 "Захист від Інакодумців"
heavy_infantry_equipment_1_short:0 "Захист Інакодумців"
heavy_infantry_equipment_1_desc:0 "Нашийники з дистанційним керуванням — один із способів викорінити інакомислення. Як добре, що в нас такі далекоглядні лідери, правда ж?"

  #MET
MET_heavy_infantry_tech_1:0 "Металева Броня"
MET_heavy_infantry_tech_4:0 "Посилена Металева Броня"
MET_heavy_infantry_equipment_1:0 "Металева Броня"
MET_heavy_infantry_equipment_1_short:0 "Металева Броня"
MET_heavy_infantry_equipment_1_desc:0 "Тим, хто хоче захисту в пустках, але не має змоги роздобути справжню бойову або поліцейську броню — завжди можна зварити разом купу металобрухту. Важка, кострубата, але надійна — металева броня витримує вогонь, який перетворив би інших на фарш. До того ж, її часто роблять лякаючою: шипи, кути, жах у погляді ворога — ще до бою."
MET_heavy_infantry_equipment_2:0 "Посилена Металева Броня"
MET_heavy_infantry_equipment_2_short:0 "Посилена Металева Броня"
MET_heavy_infantry_equipment_2_desc:0 "Більше металу — більше захисту. Але й більше ваги. На щастя для Металомордих, кібернетика й баффаут дозволяють носити навіть найважчі плити. Їхні важкоозброєні солдати часто носять додаткові вибухівки та зброю ближнього бою — бо вони можуть пройти крізь власні уламки й полум’я, щоб дістатися до ворога."

# ORO (Followers of Hecate)
ORO_heavy_infantry_tech_1:0 "Металева Броня"
ORO_heavy_infantry_tech_4:0 "Посилена Металева Броня"
ORO_heavy_infantry_equipment_1:0 "Металева Броня"
ORO_heavy_infantry_equipment_1_short:0 "Металева Броня"
ORO_heavy_infantry_equipment_1_desc:0 "Тим, хто шукає захисту в пустці, але не хоче полювати на довоєнну броню, завжди можна зібрати собі обладунок із листового металу. Груба, важка, але страхітлива — така броня дозволяє воїну впевнено дивитися в обличчя смерті."
ORO_heavy_infantry_equipment_2:0 "Посилена Металева Броня"
ORO_heavy_infantry_equipment_2_short:0 "Посилена Металева Броня"
ORO_heavy_infantry_equipment_2_desc:0 "Ще більше металу — ще більше захисту. Воїни Гекати сильні настільки, що можуть атакувати у повністю залізному панцирі, не поступаючись навіть силовій броні. Найважчі обладунки носять ті, хто йде першим — із вибухівкою в руці й смертю в очах."

# MNC (Montana Chapter)
MNC_melee_equipment_2:0 "Кувалда"
MNC_melee_equipment_2_short:0 "Кувалда"
MNC_melee_equipment_2_desc:0 ""
MNC_melee_equipment_3:0 "Супер-Кувалда"
MNC_melee_equipment_3_short:0 "Супер-Кувалда"
MNC_melee_equipment_3_desc:0 "Коли в останні дні Старого Світу відродилась траншейна війна, бойовим інженерам США потрібен був інструмент з надлюдською силою. Так з’явилася Супер-Кувалда — здатна трощити дерево, бетон і навіть зміцнені бункери. Через 200 років її перетворили на надпотужну зброю. Тепер вона дробить не каміння, а кістки."
MNC_ballistic_equipment_1:0 "Дезерт Ігл"
MNC_ballistic_equipment_1_short:0 "D-Eagle"
MNC_ballistic_equipment_1_desc:0 "Для більшості людей Desert Eagle — це сміховинно велика й незручна зброя. Але для мутантів — ідеальний пістолет. Гримучий, вибуховий, небезпечний — як і вони самі."
