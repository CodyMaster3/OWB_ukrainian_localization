MXC_spec_ops_equipment_5:0 "Композиційна розвідувальна броня"
MXC_spec_ops_equipment_5_short:0 "Розвідувальна броня"
MXC_spec_ops_equipment_5_desc:0 "Завдяки використанню новітніх матеріалів і технологій виготовлення, ми здатні створити розвідувальну броню, що буде легшою та міцнішою за всі попередні зразки."
MXC_CES_horns_moroni_tech:0 "Дивні Ліки"
MXC_CES_horns_moroni_tech_desc:0 "Походження цього біомедичного гелю викликає певні питання, зате його ефективність у бою — жодних. Хоча він і не замінить зручність стимпаків, можливість заліковувати рани та навіть пришивати відірвані кінцівки одним лише нанесенням гелю гарантує, що навіть найпокаліченіші солдати зможуть повернутись у стрій. Ми також почали залучати досвідчених медичних дослідників до наших підрозділів — на той випадок, якщо доведеться... розтинати мутантів у полі."

