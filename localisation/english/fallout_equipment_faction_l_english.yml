# DEA (Dead Horse)
DEA_melee_equipment_2:0 "Бойова булава"
DEA_melee_equipment_2_short:0 "Булава"
DEA_melee_equipment_2_desc:0 "Виготовлена з твердої деревини, яка росте в долині Зайон, ця булава довжиною в два фути є знаковою зброєю племені Мертвого Коня. Її ударна частина має форму голови коня — знак сили, традиції й попередження ворогу."

# DES (Desert Rangers)
DES_ballistic_equipment_1:0 "Великий Залізний"
DES_ballistic_equipment_1_short:0 "Big Iron"
DES_ballistic_equipment_1_desc:0 "Жоден поважаючий себе рейнджер не вийде в Пустку без вручну виготовленого .44 калібру — великого залізного. Його місце — на поясі. Його призначення — справедливість."
