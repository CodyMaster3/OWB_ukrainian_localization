TEX_ballistic_equipment_3:0 "Тактична гвинтівка з важільним затвором"
TEX_ballistic_equipment_3_short:0 "Гвинтівка .45"
TEX_ballistic_equipment_3_desc:0 "Поєднання духу дикого заходу й постапокаліптичних потреб — оновлений Winchester 1886. Висока швидкострільність для ручної зброї, точність, приціл для дальніх дистанцій. Картридж .45-90 Express легко впорається з мутованими ведмедями, клешнехватами чи дурнями в силовій броні."
