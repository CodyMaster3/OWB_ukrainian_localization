TBH_energy_equipment_4:0 "Лазерна рушниця Coachgun"
TBH_energy_equipment_4_short:0 "Лазерний Coachgun"
TBH_energy_equipment_4_desc:0 "Хтось може глузувати з ідеї використовувати заряд AER9 для пострілу, але вони просто не бачили, як ця двоствольна енергетична рушниця творить справжній армагеддон. Базується на класичній рушниці, жертвує усіма перевагами лазерної зброї заради однієї мети — зробити великий «бум» на короткій дистанції. Сила, гідна протитанкової зброї."
TBH_spec_ops_equipment_4:0 "$spec_ops_equipment_tech_icon_4_bos$"
TBH_spec_ops_equipment_4_short:0 "$spec_ops_equipment_tech_icon_4_bos_short$"
TBH_spec_ops_equipment_4_desc:0 "$spec_ops_equipment_tech_icon_4_bos_desc$"
TBH_spec_ops_equipment_5:0 "Композиційна розвідувальна броня"
TBH_spec_ops_equipment_5_short:0 "Композиційна броня"
TBH_spec_ops_equipment_5_desc:0 "Використовуючи передові матеріали й технології, ми створили розвідувальну броню, яка легша й міцніша за всі попередні варіанти."

# TIM (Тімберлайн)
TIM_melee_equipment_1:0 "Оброблена сокирка"
TIM_melee_equipment_1_short:0 "Сокирка"
TIM_melee_equipment_1_desc:0 "Компактна, легка та багатофункціональна — ця сокирка створена не для рубки дров, а для війни. Спеціальна оброблена ручка дає надійний хват, а заточене лезо та протилежний шип — засоби від будь-якої броні."
TIM_melee_equipment_2:0 "Пожежна сокира"
TIM_melee_equipment_2_short:0 "Сокира"
TIM_melee_equipment_2_desc:0 "Хоча призначення її — ламати двері під час тривоги, ця важка сокира з посиленим лезом стала грізною зброєю. Удар легко пробиває броню або розсікає кінцівки, ніби вони з паперу."
TIM_melee_equipment_3:0 "Цепна пила на термоядрі"
TIM_melee_equipment_3_short:0 "Цепна пила"
TIM_melee_equipment_3_desc:0 "Кілька модифікацій перетворили довоєнний інструмент на страшну зброю ближнього бою. Металевий корпус і перероблений термоядерний двигун, що працює від лазерних конденсаторів, дозволяють знищувати навіть силову броню. Страшна й грізна річ."


# TPM (Патрульні)
TPM_ballistic_equipment_1:0 "Спрінґфілд Модель 1873"
TPM_ballistic_equipment_1_short:0 "Trapdoor Springfield"
TPM_ballistic_equipment_1_desc:0 "Неймовірно незручна, древніша за пил і з віддачею, яка зламає руку будь-якому цивільному — гвинтівка Springfield 1873 року випуску заряджається по одній кулі через верхній затвор. Камора під сучасний бездимний варіант .45-70 дає вдвічі більше вогню та втричі більше віддачі, ніж звичайний 7.62. Ідеальна зброя для справжнього характерника."
TPM_ballistic_equipment_2:0 "Одинарна револьверна дія"
TPM_ballistic_equipment_2_short:0 "Миротворець"
TPM_ballistic_equipment_2_desc:0 "Сучасна версія легендарного револьвера, виробництво якого відновлювали тричі. Цей шістизарядний револьвер з одинарною дією обожнюють за компактність, здатність зламати зап’ястя, зручну систему заміни барабана та дешевизну. Заряджається патронами .45 Colt — ідеальний, щоби стріляти одночасно з обох рук."

# TTM (Плем'я Двох Матерів)
TTM_infantry_equipment_1:0 "Дерев’яний рекурсивний лук"
TTM_infantry_equipment_1_short:0 "Рекурсивний лук"
TTM_infantry_equipment_1_desc:0 "Простий рекурсивний лук із дерева. Його ефективність — у руках воїнів племені Двох Матерів. Їхня точність дозволяє вражати цілі там, де інші навіть не прицілювались би, заманюючи ворогів у смертельні засідки."
TTM_ballistic_equipment_1:0 "Удосконалений рекурсивний лук"
TTM_ballistic_equipment_1_short:0 "Командоський лук"
TTM_ballistic_equipment_1_desc:0 "Коротший композитний лук дозволяє воїнам Двох Матерів рухатись швидше, зберігаючи потужний натяг, здатний пробити більшість броні. Ідеальний для рейдів і маневрених боїв."
TTM_ballistic_equipment_2:0 "Блочний лук"
TTM_ballistic_equipment_2_short:0 "Блочний лук"
TTM_ballistic_equipment_2_desc:0 "Шківи, додані до короткого композитного лука, дозволяють накопичувати вдвічі-тричі більше кінетичної енергії. Спусковий механізм із попередньою натяжкою тятиви економить сили стрільця й дозволяє прицілюватися точніше."
TTM_ballistic_equipment_3:0 "Вибуховий лук"
TTM_ballistic_equipment_3_short:0 "Вибуховий лук"
TTM_ballistic_equipment_3_desc:0 "Просунута система шківів забезпечує високу швидкість і точність стріли, а новий дизайн наконечника зменшує ймовірність рикошету. Основна фішка — вибуховий наконечник, заряд якого перевищує навіть піхотні гранати."
TTM_ballistic_equipment_4:0 "Бронебійний лук"
TTM_ballistic_equipment_4_short:0 "Бронебійний лук"
TTM_ballistic_equipment_4_desc:0 "Зміцнена основа й мідна оболонка дозволяють спрямувати вибух у точку. Поєднання тиші, швидкості й пробивної сили робить цю зброю ефективнішою за вогнепальну — навіть проти силової броні."

# TUB (Тюбоголові)
TUB_ballistic_equipment_1:0 "Пістолет 12.7мм"
TUB_ballistic_equipment_1_short:0 "12.7мм Пістолет"
TUB_ballistic_equipment_1_desc:0 "Для тих, хто має знання і м’язи, щоб його стріляти, — найпотужніший пістолет калібру .50 AE, з коротким стволом і потужним ударом. Невелика кількість набоїв у магазині, громіздкий корпус, шалена віддача — саме те, що люблять тюбоголові."

# UFO (Загальні Зетани)
UFO_melee_equipment_4:0 "Зетанський зонд"
UFO_melee_equipment_4_short:0 "Зетанський зонд"
UFO_melee_equipment_4_desc:0 "Тупі земляни вважають нас слабкими у ближньому бою через невеликий зріст і тендітну будову. Але ми не підкорили галактику лише розумом! Наші шокові палиці, модифіковані на максимум потужності, перетворять їх на рожеву пилюку!"
UFO_energy_equipment_1:0 "Зетанський пістолет"
UFO_energy_equipment_1_short:0 "Зетанський пістолет"
UFO_energy_equipment_1_desc:0 "Серед чудесного озброєння армій Зетанів, ця дивна зброя — одна з найвідоміших. Прототипний зетанський пістолет здатен атомізувати цілі, хоч і поступається більш розвиненому плазмовому арсеналу. Але жахлива атомна міць цього пістолета наганяє страх у всій галактиці."
UFO_energy_equipment_2:0 "Зетанський бластер"
UFO_energy_equipment_2_short:0 "Зетанський бластер"
UFO_energy_equipment_2_desc:0 "Витвір інженерії Зетанів, що перевершує все, що коли-небудь створювали земляни. Випромінює плазмотомні заряди з високою швидкістю, які дестабілізуються при контакті з м’якою плоттю, миттєво смажачи органи й шкіру жертви."
UFO_energy_equipment_3:0 "Зетанський атомайзер"
UFO_energy_equipment_3_short:0 "Зетанський атомайзер"
UFO_energy_equipment_3_desc:0 "Стандартний зетанський пістолет. Його потужне поле утримання забезпечує виняткову здатність атомізації — перевірену на численних дурних земних піддослідних. Висновок: «дуже багато атомізації»."
UFO_energy_equipment_4:0 "Зетанський дезінтегратор"
UFO_energy_equipment_4_short:0 "Зетанський дезінтегратор"
UFO_energy_equipment_4_desc:0 "Класика знищення дурнуватих землян. Цей далекобійний дезінтегратор ідеально підходить для снайперської стрільби чи прямого спалення ворогів в попіл. Вони вважають, що силова броня їх захистить? Побачимо, як вони заговорять, коли вона вибухне й розірве їх навпіл!"
UFO_plasma_equipment_1:0 "Зетанський бластер"
UFO_plasma_equipment_1_short:0 "Зетанський бластер"
UFO_plasma_equipment_1_desc:0 "Понад усе, що могли б вигадати нерозумні земляни. Бластер з плазмотомним полем стріляє з нечуваною швидкістю, миттєво готуючи жертву зсередини до хрусткої скоринки."
UFO_plasma_equipment_2:0 "Зетанський дезінтегратор"
UFO_plasma_equipment_2_short:0 "Зетанський дезінтегратор"
UFO_plasma_equipment_2_desc:0 "Класика знищення дурнуватих землян. Цей далекобійний дезінтегратор ідеально підходить для снайперської стрільби чи прямого спалення ворогів в попіл. Вони вважають, що силова броня їх захистить? Побачимо, як вони заговорять, коли вона вибухне й розірве їх навпіл!"
UFO_high_fighter_equipment:0 "Летюча тарілка"
UFO_high_fighter_equipment_short:0 "Летюча тарілка"
UFO_high_fighter_equipment_desc:0 "Антигравітаційне поле, плазмові гармати й щити — ця «тарілка» знищить будь-який літальний апарат жалюгідних землянів. Тільки дурень наважиться кинути нам виклик у повітрі."
UFO_high_cas_equipment:0 "Штурмова тарілка"
UFO_high_cas_equipment_short:0 "Штурмова тарілка"
UFO_high_cas_equipment_desc:0 "Фронтальна броня, щити, дрони, потрійні дезінтегратори й мікро-променева гармата. Хто ступає під ці судна — вже труп. Штурмові тарілки швидко вдаряють і зникають — ще до того, як ворог встигне зрозуміти, що сталося."
UFO_spotter_plane_equipment_3:0 "Розвідник"
UFO_spotter_plane_equipment_3_short:0 "Розвідник"
UFO_spotter_plane_equipment_3_desc:0 "Інформація — зброя. Після ядерної війни географія Землі змінилася, карти й сканери застаріли. Але наші розвідні тарілки можуть дослідити кожну темну діру. Їхня маневреність не має рівних — ні тут, ні в будь-якому іншому світі."
UFO_high_fighter_unlock_tech:0 "Креслення тарілки"
UFO_high_fighter_unlock_tech_desc:0 "Загадкового походження, ці креслення описують, як створити летальні апарати на антигравітаційній тязі, що легко перевершують усі земні літаки."

# VEG (Нью-Вегас)
VEG_melee_equipment_1:0 "Клюшка для гольфу 9 Iron"
VEG_melee_equipment_1_short:0 "9 Iron"
VEG_melee_equipment_1_desc:0 "У Старому Світі гольфом захоплювалися всі — від пересічних середньостатистичних родин до таких як Містер Хаус. Тепер, 200 років потому, коли ядерне пекло стерло ту епоху, залишки гольф-клюшок стали кийками та тупими знаряддями. Вони вже не женуть м’ячі, зате непогано запускають вороже м’ясо й нутрощі. Як казали профі того часу: «Усе в техніці замаху»."
VEG_melee_equipment_2:0 "Широкий мачете"
VEG_melee_equipment_2_short:0 "Мачете"
VEG_melee_equipment_2_desc:0 "У тісному бою ніж — потужна перевага, якщо знати, як ним володіти. Особливо, якщо це мачете. Він не завдає такого удару, як клюшка, зате легко прорізає плоть. Можна тримати однією рукою, а велика довжина дозволяє прорубати ворога, як сокира — дрова."
VEG_melee_equipment_3:0 "Суперкувалда"
VEG_melee_equipment_3_short:0 "Суперкувалда"
VEG_melee_equipment_3_desc:0 "Коли окопна війна знову стала нормою в останні дні Старого Світу, інженери потребували нових інструментів. Так з’явилась суперкувалда — здатна трощити усе: від дерева до бетону. Тепер, після падіння бомб, її переосмислили як надпотужну зброю тупого ураження. Тепер вона більше б’є по кістках, ніж по стінах — але результат однаково кривавий."
VEG_melee_equipment_4:0 "Балістичний кулак"
VEG_melee_equipment_4_short:0 "Балістичний кулак"
VEG_melee_equipment_4_desc:0 "Балістичний кулак — це мініатюрна рушниця, прикріплена до зап’ястя й підключена до пластини на кісточках. Постріл здійснюється при ударі, наносячи катастрофічну шкоду. З огляду на кількість сили, упакованої в цей пристрій, сказати, що жертва піде з «фінгалом» — це перебільшено м’яко."
VEG_standard_weaponry_tech:0 "Цвяхостріл H&H Tools"
VEG_standard_weaponry_short:0 "Цвяхостріл"
VEG_standard_weaponry_tech_desc:0 "Простий інструмент, адаптований до бою. У мирні часи його використовували для будівництва. Але зараз не мир. Підвищена потужність електромагніту дозволяє цвяхам летіти швидше й далі. Звісно, це не пістолет, але як нічим іншим — краще за кулаки."
VEG_ballistic_equipment_1:0 "$ballistic_weaponry_tech_icon_1_9mm_smg$"
VEG_ballistic_equipment_1_short:0 "$ballistic_weaponry_tech_icon_1_9mm_smg_short$"
VEG_ballistic_equipment_1_desc:0 "$ballistic_weaponry_tech_icon_1_9mm_smg_desc$"
VEG_ballistic_equipment_2:0 "Пістолет-кулемет 10мм"
VEG_ballistic_equipment_2_short:0 "10мм ПК"
VEG_ballistic_equipment_2_desc:0 "Американська класика, що пройшла фронти від Анкориджа до Шанхаю, від Вашингтона до Лос-Анджелеса. Простий в обслуговуванні, набої 10мм поширені скрізь. Один магазин — і цілий загін рейдерів уже на землі."
VEG_ballistic_equipment_3:0 "Пістолет-кулемет 12.7мм"
VEG_ballistic_equipment_3_short:0 "12.7мм ПК"
VEG_ballistic_equipment_3_desc:0 "Це не просто зброя — це антиособовий інструмент масового ураження. 12.7мм патрони, коротший за автомат, але зі знищувальною зупиняючою силою — навіть супермутанти падають. Віддача божевільна, зате ідеальний для ближнього бою чи зачистки міських вулиць."
VEG_ballistic_equipment_4:0 "R91C-S 'Інфільтратор'"
VEG_ballistic_equipment_4_short:0 "Інфільтратор"
VEG_ballistic_equipment_4_desc:0 "Один із бойових коників американської армії до Війни. Модульна система, яку можна адаптувати під будь-яку роль. Ця версія — для спецоперацій: укорочений корпус, глушник і змінна оптика для далекої стрільби. Ідеально для міських боїв і таємних місій."
VEG_energy_equipment_1:0 "Пістолет-зарядник"
VEG_energy_equipment_1_short:0 "Пістолет-зарядник"
VEG_energy_equipment_1_desc:0 "Постріли здійснюються за допомогою мікроф’южн-бридера, який на відміну від стандартних енергоелементів не потребує заміни й поступово самостійно відновлює витрачену енергію. Цей самозарядний пістолет ідеально підходить для довготривалого використання — доти, доки зброя працює, солдат не потребуватиме набоїв і залишатиметься в бою."
VEG_energy_equipment_2:0 "Гвинтівка-зарядник"
VEG_energy_equipment_2_short:0 "Гвинтівка-зарядник"
VEG_energy_equipment_2_desc:0 "Перша версія самозарядної зброї з мікроф’южн-бридером. Напів-автоматична схема дозволяє вести прицільний вогонь і раціонально витрачати енергію. На папері це може виглядати слабше за повністю автоматичну зброю... але цілий взвод, навіть відділення, що стріляє залпом з таких гвинтівок, затьмарить будь-який мінігун."
VEG_energy_equipment_3:0 "Лазерна ЗБКЗ"
VEG_energy_equipment_3_short:0 "Laser RCW"
VEG_energy_equipment_3_desc:0 "Зовні схожа на легендарний пістолет-кулемет Томпсона XX століття. Містить барабан із шістьма конденсаторами навколо зарядного пакету. Обертовий барабан дозволяє швидко перезаряджати розряджені конденсатори, забезпечуючи надзвичайну скорострільність — недосяжну для моделей із єдиним конденсатором."
VEG_robot_humanoid_tech:0 "Прототип Прайм Mk. 37"
VEG_robot_humanoid_tech_short:0 "Прототип Прайм"
VEG_robot_humanoid_tech_desc:0 "Роберт Хаус ненавидів працювати над проєктом Liberty Prime. Американські керівники постійно вимагали зробити машину більшою — переважно задля пропаганди.\nНа думку Хауса, ефективним був би робот висотою близько дев’яти футів: достатньо високий, щоб мати перевагу на полі бою, але не настільки гігантський, щоб вимагати нескінченних джерел живлення."
VEG_support_robot_humanoid_equipment:0 "Прототип Прайм Mk. 37"
VEG_support_robot_humanoid_equipment_short:0 "Прототип Прайм"
VEG_support_robot_humanoid_equipment_desc:0 "Роберт Хаус ненавидів працювати над проєктом Liberty Prime. Американські керівники постійно вимагали зробити машину більшою — переважно задля пропаганди.\nНа думку Хауса, ефективним був би робот висотою близько дев’яти футів: достатньо високий, щоб мати перевагу на полі бою, але не настільки гігантський, щоб вимагати нескінченних джерел живлення."
VEG_ballistic_fireteam_weaponry_tech_4:0 "Avenger"
VEG_ballistic_fireteam_weaponry_tech_4_short:0 "CZ57 Rockwell Avenger"
VEG_ballistic_fireteam_weaponry_tech_4_desc:0 "Вершина довоєнних кулеметів. Avenger використовує ті ж 5-мм патрони, що й попередники, але із зниженою скорострільністю — 12 000 постр./хв замість шаленої 60 000. Система охолодження на гелевих ребрах і хромовані стволи дозволяють вести тривалий вогонь. Avenger був королем підтримки до війни — і буде ним знову."
VEG_energy_fireteam_weaponry_tech_3:0 "Sprtel-Wood"
VEG_energy_fireteam_weaponry_tech_3_short:0 "Sprtel-Wood 9700"
VEG_energy_fireteam_weaponry_tech_3_desc:0 "Еволюція системи UB-FRIED 3000. Sprtel-Wood легший, маневреніший і витрачає менше енергії при збереженні вогневої потужності. Покращена ергономіка, зміна довжини хвилі з червоної на зелену — усе заради більшої потужності. Дорого, але вороги зникають настільки ефективно, що воно того варте."
VEG_energy_fireteam_weaponry_tech_4:0 "Tesla-Beaton D.E.W."
VEG_energy_fireteam_weaponry_tech_4_short:0 "Прототип Tesla-Beaton"
VEG_energy_fireteam_weaponry_tech_4_desc:0 "Загін сек’юритронів знайшов уламки довоєнного вертиберда, охоронюваного бойовими роботами. Усередині — прототип плечової зброї, що вистрілює електричні розряди, здатні паралізувати будь-що, крім гігантських EMP-стійких роботів. Масове виробництво цієї блискавичної зброї зітре в порох усе, що має схеми, сервоприводи — чи навіть плоть."
VEG_flamer_demolitions_weaponry_tech_2:0 "Вогнемет"
VEG_flamer_demolitions_weaponry_tech_2_short:0 "Вогнемет"
VEG_flamer_demolitions_weaponry_tech_2_desc:0 "Вогнемет — інструмент на всі випадки: обігрів, приготування їжі, підпалювання ворогів. Ця модель використовує паливо й пропелент, підібрані для максимальної ефективності. Мінімум заправок — максимум полум’я. А ще більше полум’я — ще більше перемог."
VEG_explosive_demolitions_weaponry_tech_2:0 "Бляшана граната"
VEG_explosive_demolitions_weaponry_tech_2_short:0 "Бляшана граната"
VEG_explosive_demolitions_weaponry_tech_2_desc:0 "Іноді доводиться обходитися тим, що є. І це не обов’язково означає щось погане. Імпровізована бомба з бляшанки, цвяхів, пороху й скотчу може бути дивовижно ефективною. Із такою кмітливістю вибір між якістю й кількістю — хибна дилема."
VEG_explosive_demolitions_weaponry_tech_3:0 "25мм Гранатомет АПЗ"
VEG_explosive_demolitions_weaponry_tech_3_short:0 "25мм АПЗ"
VEG_explosive_demolitions_weaponry_tech_3_desc:0 "25-міліметрова Антипіхотна Зброя (АПЗ) — винахід, що розширює можливості гранатометника. Вищий рівень швидкості, більше типів боєприпасів (димові, плазмові, запальні тощо). Більше варіантів атаки — більше шляхів до перемоги."
VEG_explosive_demolitions_weaponry_tech_4:0 "RGL-16 'Авто-Трамбон'"
VEG_explosive_demolitions_weaponry_tech_4_short:0 "Авто-Трамбон"
VEG_explosive_demolitions_weaponry_tech_4_desc:0 "Роторний гранатомет — король ближнього бою. RGL-16 із барабаном на 16 пострілів стріляє низькошвидкісними 40мм гранатами всіх типів. Патрулювання, придушення, зачистка чи просто штурм — він завжди на висоті. В руках новачка — вже загроза. В руках досвідченого — легенда. Краще не питати, чому."

  # VLT (Vault City)
  VLT_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_security_baton$"
  VLT_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_security_baton_short$"
  VLT_melee_equipment_1_desc:0 "$melee_weaponry_tech_icon_1_security_baton_desc$"
  VLT_ballistic_equipment_1:0 "$ballistic_weaponry_tech_icon_1_10mm_classic$"
  VLT_ballistic_equipment_1_short:0 "$ballistic_weaponry_tech_icon_1_10mm_classic_short$"
  VLT_ballistic_equipment_1_desc:0 "$ballistic_weaponry_tech_icon_1_10mm_classic_desc$"
VLT_ballistic_equipment_2:0 "Тактична рушниця Winchester City-Killer"
VLT_ballistic_equipment_2_short:0 "Тактична рушниця"
VLT_ballistic_equipment_2_desc:0 "Тактична рушниця Winchester City-Killer 12 калібру у булпап-варіанті. Відмінно збереглась, має опціональне покриття DesertWarfare для підвищеної надійності в екстремальних умовах."
