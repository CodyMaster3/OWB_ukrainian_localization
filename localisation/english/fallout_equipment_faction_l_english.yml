# LUM (Luminous Ones)
LUM_med_company_tech_4:0 "Пакети Світлого Брака"
LUM_med_company_tech_4_desc:0 "У надзвичайній ситуації кров Світлого може бути не тільки благословенною, але й сильно радіоактивною. Обидва фактори сприяють швидкому загоєнню втрати крові."
LUM_med_company_tech_6:0 "Некромантичні Послідовники"
LUM_med_company_tech_6_desc:0 "Мало хто стає Світлим. Ще менше — мають силу вистояти перед Великим Некромантом і довести, що гідні вивчити Радіантне Мистецтво. Але ті, хто зміг, — здатні тримати гулів у строю навіть після смерті... чи далеко за її межами."
LUM_tribalholyorg:0 "Це Звершено"
LUM_tribalholyorg_desc:0 "Наказ Некроманта важко ігнорувати."
LUM_tribalimmortals:0 "Справжні Безсмертні"
LUM_tribalimmortals_desc:0 "Наші воїни піднімаються знову і знову, невтомно знищуючи ворогів Великого."

# DLN
