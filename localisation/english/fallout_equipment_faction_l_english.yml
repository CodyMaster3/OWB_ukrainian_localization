FAR_ballistic_equipment_1_short:0 "$ballistic_weaponry_tech_icon_1_10mm_nv_short$"
FAR_ballistic_equipment_1_desc:0 "$ballistic_weaponry_tech_icon_1_10mm_nv_desc$"

# GDH (Gente Del Sol)
GDH_ballistic_equipment_1:0 "$ballistic_weaponry_tech_icon_1_sten$"
GDH_ballistic_equipment_1_short:0 "$ballistic_weaponry_tech_icon_1_sten_short$"
GDH_ballistic_equipment_1_desc:0 "$ballistic_weaponry_tech_icon_1_sten_desc$"
GDH_ballistic_equipment_2:0 "Кастомний 10мм ПП"
GDH_ballistic_equipment_2_short:0 "10мм ПП"
GDH_ballistic_equipment_2_desc:0 "Оновлена версія старої-доброї 10мм моделі, поширеної по всій пустці. Складний приклад для точнішої стрільби в автоматичному режимі, подовжений ствол — для точності й кращої балістики. А зараз акція — купи один, і отримай два ящики військових 10мм набоїв безкоштовно! Хіба можна таке пропустити?"

# GRA (Grabbers)
GRA_power_armor_equipment_2:0 "Кінська Силова Броня"
GRA_power_armor_equipment_2_short:0 "Horse PA"
GRA_power_armor_equipment_2_desc:0 "Годі скакати дурня. І-го-го."

# HAN/WDN (Warden/Hangdogs)
