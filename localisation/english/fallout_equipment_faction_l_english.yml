SIY_ballistic_equipment_1:0 "Приглушений пістолет"
SIY_ballistic_equipment_1_short:0 "Деліверер"
SIY_ballistic_equipment_1_desc:0 "Деліверер — це компактний пістолет, що стріляє стандартними 9-мм патронами з легкого корпусу, практично безшумно завдяки глушнику та використанню субзвукових боєприпасів. Ідеальний для інфільтрації й таємних операцій, цей пістолет — класика для тих, хто любить грати у секретного агента."
