  LAC_melee_equipment_2_desc:0 "$melee_weaponry_tech_icon_2_machete_gladius_desc$"
  LAC_melee_equipment_3:0 "$melee_weaponry_tech_icon_3_bumper_sword$"
  LAC_melee_equipment_3_short:0 "$melee_weaponry_tech_icon_3_bumper_sword_short$"
