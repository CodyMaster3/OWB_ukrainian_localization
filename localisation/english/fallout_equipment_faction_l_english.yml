# MCA (MacArthur Enclave)
MCA_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_security_baton$"
MCA_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_security_baton_short$"
MCA_melee_equipment_1_desc:0 "$melee_weaponry_tech_icon_1_security_baton_desc$"
MCA_melee_equipment_2:0 "Ніж Боуї"
MCA_melee_equipment_2_short:0 "Боуї"
MCA_melee_equipment_2_desc:0 "Те, що вороги носять — це зубочистки, не ножі. Боуї ж — справжній ніж. Його історія починається ще на кордонах Америки XIX століття. Довше лезо, ніж у більшості сучасних аналогів, дає відчуття меча при збереженні мобільності одноручної зброї. Просто чудовий ніж — вище класу."
MCA_melee_equipment_3:0 "Відновлений Армійський Ріппер"
MCA_melee_equipment_3_short:0 "Ріппер"
MCA_melee_equipment_3_desc:0 ""
MCA_melee_equipment_4:0 "Силовий Кулак"
MCA_melee_equipment_4_short:0 "Силокулак"
MCA_melee_equipment_4_desc:0 "До війни силові кулаки використовувалися для шахт і демонтажу. Мінерали, бетон, скелі — усе летіло на друзки. І не дивно, що з часом хтось вирішив: це ідеальна зброя. До сили удару додається гідропривід, що пробиває ворога наскрізь. Якщо ви отримали в лоба силовим кулаком — похорон уже не врятує."
MCA_ballistic_equipment_1:0 "«Маленький Диявол» 12.7мм"
MCA_ballistic_equipment_1_short:0 "Li'l Devil"
MCA_ballistic_equipment_1_desc:0 "«Маленький Диявол» — обрізана версія 12.7мм пістолета, який часто використовували поліція та військові. Трохи легший, але з шаленою скорострільністю та хорошою системою стабілізації. Ми відновили креслення та налагодили випуск. Тепер у кожного патруля буде пекельна відповідь у кобурі."
MCA_ballistic_equipment_2:0 "$ballistic_weaponry_tech_icon_2_m16a1$"
MCA_ballistic_equipment_2_short:0 "$ballistic_weaponry_tech_icon_2_m16a1_short$"
MCA_ballistic_equipment_2_desc:0 "$ballistic_weaponry_tech_icon_2_m16a1_desc$"
MCA_ballistic_equipment_3:0 "Карабін AC5"
MCA_ballistic_equipment_3_short:0 "Штурмовий Карабін"
MCA_ballistic_equipment_3_desc:0 "Дешева, але ефективна 5мм гвинтівка, яку роздавали повітряним дивізіям США до падіння бомб. Використовувалась у пустелі Гобі, на вулицях Шанхаю, і навіть у горах Хенан як останній шанс для пілотів. 200 років потому вона знову буде знищувати гулів, рейдерів і братерських зрадників."
MCA_ballistic_equipment_4:0 "MR68-A Карабін"
MCA_ballistic_equipment_4_short:0 "Марксмен-Карабін"
MCA_ballistic_equipment_4_desc:0 ""
MCA_energy_equipment_1:0 "Лазерний Пістолет AEP7"
MCA_energy_equipment_1_short:0 "Лазерний Пістолет"
MCA_energy_equipment_1_desc:0 "AEP7 — як М1911 серед енергетичної зброї: простий, надійний і всюдисущий. Хоч війна з червоними й не дозволила повністю перевести армію на нього, складів із запасами достатньо. А мути побачать: характерна опікова рана — візитка Анклаву."
MCA_energy_equipment_3:0 "Лазерна Гвинтівка AER9E3"
MCA_energy_equipment_3_short:0 "Передова Лазерна Гвинтівка"
MCA_energy_equipment_3_desc:0 "Науковці Анклаву постійно вдосконалюють AER9. Після кількох ітерацій..."
MCA_ballistic_fireteam_equipment_2:0 "Кулемет MG42"
MCA_ballistic_fireteam_equipment_2_short:0 "MG42"
MCA_ballistic_fireteam_equipment_2_desc:0 "MG42 завжди викликає страх. 1200 пострілів за хвилину — це не жарт."
MCA_ballistic_fireteam_equipment_3:0 "Кулемет M60E4"
MCA_ballistic_fireteam_equipment_3_short:0 "M60E4"
MCA_ballistic_fireteam_equipment_3_desc:0 "M60E4 — стара добра «Свиня» — пройшла В’єтнам, Камчатку й Берлін у ’85. Удосконалене нарізування ствола, кращі допуски — усе для точності та надійності. Якщо це — «свиня», то ми пишаємося її хрюком."
MCA_ballistic_fireteam_equipment_4:0 "Мінімет CZ53"
