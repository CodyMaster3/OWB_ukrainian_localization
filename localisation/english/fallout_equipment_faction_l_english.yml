MOT_spec_ops_equipment_4:0 "Бойова броня Рейнджера"
MOT_spec_ops_equipment_4_short:0 "Броня Рейнджера"
MOT_spec_ops_equipment_4_desc:0 "Чорна бойова броня рейнджера — це фірмове поєднання довгого тренча Пустельних Рейнджерів і довоєнної броні для придушення заворушень. Виготовляється вручну в межах НКР."
MOT_spec_ops_equipment_5:0 "Бойова броня Ветерана-Рейнджера"
MOT_spec_ops_equipment_5_short:0 "Броня Ветерана"
MOT_spec_ops_equipment_5_desc:0 "Фірмова чорна броня рейнджера об'єднує класичний тренч Пустельних Рейнджерів із довоєнною вдосконаленою бронею для заворушень. Виготовляється вручну на території НКР."
