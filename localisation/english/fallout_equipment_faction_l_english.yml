# HXL (Hexie Lu)
HXL_melee_equipment_3:0 "Офіцерський Меч"
HXL_melee_equipment_3_short:0 "Офіцерський Меч"
HXL_melee_equipment_3_desc:0 "Ручної роботи меч, створений за зразками зі старої батьківщини."
HXL_ballistic_equipment_1:0 "Shanxi Тип 17"
HXL_ballistic_equipment_1_short:0 "Пістолет Тип 17"
HXL_ballistic_equipment_1_desc:0 "Тип 17 був масовим пістолетом до Великої Війни. Вперше випущений у 1929 році Тайюаньським арсеналом для армії Янь Сішаня, цей пістолет нині є реліктом китайсько-американської війни."
HXL_ballistic_equipment_2:0 "Саморобний Штурмовий Карабін"
HXL_ballistic_equipment_2_short:0 "Саморобний Карабін"
HXL_ballistic_equipment_2_desc:0 "Простий дизайн на базі Type 93. Хоч і поступається за якістю, цей карабін значно легше виготовити й обслуговувати. Деякі старі родини з HXL обирають саме його — більше з ностальгії, ніж з практичних міркувань."
HXL_ballistic_equipment_3:0 "Китайський Штурмовий Карабін Тип 93"
HXL_ballistic_equipment_3_short:0 "Китайський Карабін"
HXL_ballistic_equipment_3_desc:0 "Розроблений китайським військово-промисловим концерном для Народно-визвольної армії під час Ресурсних воєн, карабін використовувався інфільтраторами й агентами у США. Камора під 5.56мм та 24-зарядний магазин — простий, але ефективний засіб боротьби."
HXL_spec_ops_equipment_4:0 "Броня Стелс «Хей Гуй»"
HXL_spec_ops_equipment_4_short:0 "Стелс-Броня"
HXL_spec_ops_equipment_4_desc:0 "Китайська стелс-броя, застосована під час вторгнення на Аляску, була відповіддю на американську силову броню. Використовувалась елітними підрозділами «Червоні Дракони» й контртерористами до й під час Великої Війни. Нині її використовують HXL, щоб залишатись тінню для своїх ворогів."
HXL_spec_ops_equipment_5:0 "Броня Стелс «Фучоу Цзіншень» (Посилена)"
HXL_spec_ops_equipment_5_short:0 "Посилена Стелс-Броня"
HXL_spec_ops_equipment_5_desc:0 "Природна еволюція стандартної моделі. Посилена грудна пластина з композиту та легкий сплав у шоломі — для виживання в реальному бою. Щоб компенсувати вагу, вмонтовано потужніше джерело живлення на спині, яке продовжує дію стелс-поля й покращує стабільність у бою."
HXL_explosive_demolitions_equipment_3:0 "Гранатомет «Червона Перемога»"
HXL_explosive_demolitions_equipment_3_short:0 "Гранатомет"
HXL_explosive_demolitions_equipment_3_desc:0 "Прототип, пристосований до масового виробництва. Захоплена американська зброя, модифікована для китайського використання: дерев’яні елементи замінено на сплави, додано можливість стрільби 40мм осколково-бронебійними гранатами. Раніше — проти силової броні США на Півночі, тепер — для всіх, хто посміє виступити проти HXL."
HXL_power_armor_equipment_tbh:0 "Китайська Силова Броня"
HXL_power_armor_equipment_tbh_short:0 "Китайська Броня"
HXL_power_armor_equipment_tbh_desc:0 "Спроба Китаю створити власний аналог американської силової броні для збереження паритету навіть після Великої Війни. Результат — важка, але функціональна платформа для ведення сучасного бою."

# TCA (The Cause)
TCA_midwest_pa_tech: "ATA MKII"

# IMO (Iron Mongers)
IMO_heavy_infantry_tech_1:0 "Мантіс-Механіки"
IMO_heavy_infantry_tech_1_short:0 "Мантіс-Механіки"
IMO_heavy_infantry_tech_1_desc:0 "У темних залах фабрик Залізних Ковальських важкощі супер мутантам знайти потрібний інструмент вчасно. Тому вони використовують так званих «Gearjocks» — дресированих богомолів. Ці маленькі, вірні істоти замінюють рабів: шустрі, слухняні, швидкі — ідеальні помічники коваля."
IMO_heavy_infantry_equipment_1:0 "Мантіс-Механіки"
IMO_heavy_infantry_equipment_1_short:0 "Мантіс-Механіки"
IMO_heavy_infantry_equipment_1_desc:0 "У темних залах фабрик Залізних Ковальських важкощі супер мутантам знайти потрібний інструмент вчасно. Тому вони використовують так званих «Gearjocks» — дресированих богомолів. Ці маленькі, вірні істоти замінюють рабів: шустрі, слухняні, швидкі — ідеальні помічники коваля."
IMO_ballistic_equipment_1:0 "Ручна Гармата"
IMO_ballistic_equipment_1_short:0 "Ручна Гармата"
IMO_ballistic_equipment_1_desc:0 "Для звичайної людини це — карабін, але для Ironmongers — просто пістолет. Камора під .50 GI, автоматичний вогонь у ближньому бою, гуде та ламається з кожною чергою. Скластися може будь-якої миті, але кого це хвилює, коли ти — супер мутант?"
IMO_ballistic_equipment_2:0 "Автоматична Бойова Гвинтівка"
IMO_ballistic_equipment_2_short:0 "15мм Гвинтівка"
IMO_ballistic_equipment_2_desc:0 "Довгий шлях до створення надійної гвинтівки, здатної валити людей і мутантів. Із надійністю не склалося — але з убивчою силою все гаразд. Заряджена кастомним 15мм патроном із плоским наконечником, ця зброя ламає кістки й броню одним ударом. Спайк? Геть з дороги."
IMO_ballistic_equipment_3:0 "Легка Штурмова Дробовик"
IMO_ballistic_equipment_3_short:0 "LAS"
IMO_ballistic_equipment_3_desc:0 "Найсвіжіше слово у світі гігантської зброї. Автоматичний дробовик із стрічковим живленням — схожий більше на кулемет, ніж дробовик. Заряджений 10-каліберними Super Magnum, цей монстр прорізає все: броню, укриття, ворогів. І все це під хриплий регіт супер мутанта, що натискає на гачок."

# IRN (Iron Alliance)
IRN_power_armor_equipment_2:0 "Рейдерська Силова Броня"
IRN_power_armor_equipment_2_short:0 "Лом-Броня"
IRN_power_armor_equipment_2_desc:0 "Тільки найвезучіші рейдери знаходять справжню силову броню. Інші — імпровізують: голі екзоскелети обшивають листами металобрухту, прикручують саморобні маски та встановлюють двигуни з бензобаків замість ядерних елементів. До бою така броня придатна менше, зате додає сили, простіша у використанні та дає захист від куль."

  # MAX (Imperio Mexicano)
