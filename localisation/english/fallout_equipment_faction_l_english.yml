DES_spec_ops_equipment_3_desc:0 "$spec_ops_equipment_tech_icon_3_ncr_desc$"
DES_spec_ops_equipment_4:0 "Бойова броня Рейнджера"
DES_spec_ops_equipment_4_short:0 "Броня Рейнджера"
DES_spec_ops_equipment_4_desc:0 "Фірмова чорна бойова броня рейнджерів складається з традиційного плаща Пустельних Рейнджерів, одягненого поверх довоєнної штурмової броні."
DES_spec_ops_equipment_5:0 "Броня ветерана Рейнджерів"
DES_spec_ops_equipment_5_short:0 "Броня Ветерана"
DES_spec_ops_equipment_5_desc:0 "Удосконалена версія бойової броні, ця модель використовує передову довоєнну штурмову броню в поєднанні з традиційним рейнджерським плащем. Справжній символ досвіду і витримки."

  # DIS (The Apostles)
  DIS_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_cultist_knife$"
  DIS_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_cultist_knife_short$"
  DIS_melee_equipment_1_desc:0 "$melee_weaponry_tech_icon_1_cultist_knife_desc$"
