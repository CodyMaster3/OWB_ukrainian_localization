LAC_melee_equipment_4:0 "Балістичний Кулак"
LAC_melee_equipment_4_short:0 "Балістичний Кулак"
LAC_melee_equipment_4_desc:0 "Балістичний кулак — це пістолет-дробовик на зап’ясті, з'єднаний із натискною пластиною на кістяках. Постріл відбувається при ударі — результат? Руйнівний вибух у саме тіло жертви."
LAC_ballistic_equipment_2:0 "Ковбойський Репітер"
LAC_ballistic_equipment_2_short:0 "Ковбойський Репітер"
LAC_ballistic_equipment_2_desc:0 "Гвинтівка з трубчастою подачею набоїв, проста у виготовленні й надійна. У вправних руках ковбойський репітер дає можливість вести точний і швидкий вогонь, навіть у розпал бою."
LAC_power_armour_equipment_2:0 "Силова Броня Братства Марса"
LAC_power_armour_equipment_2_short:0 "БМБ"
LAC_power_armour_equipment_2_desc:0 "Розроблена для втілення гніву Марса у бою, ця версія T-51b стала основною бронею легіонів Братства Марса. Матеріали посередні, тому вона поступається звичайному T-51b, але як для техніки, створеної колишніми луддитами — просто вражаюча."
LAC_heavy_infantry_equipment_1:0 "$heavy_infantry_tech_icon_1_collar$"
LAC_heavy_infantry_equipment_1_short:0 "$heavy_infantry_tech_icon_1_collar_short$"
LAC_heavy_infantry_equipment_1_desc:0 "$heavy_infantry_tech_icon_1_collar_desc$"

# LNS (Lone Star)
LNS_ballistic_equipment_1:0 ".44 Револьвер"
LNS_ballistic_equipment_1_short:0 "Револьвер"
LNS_ballistic_equipment_1_desc:0 "Класика старого світу та вестернів, ця потужна зброя досі здатна на більше, ніж треба. Камора під .44 Magnum — хоч і одиночна дія, та для тих, хто шукає зупиняючу силу понад усе, це головна зброя. Пробиває мутантів і тварюк на раз-два."
LNS_ballistic_equipment_2:0 "Гвинтівка Снайпера"
LNS_ballistic_equipment_2_short:0 "Снайперська Гвинтівка"
LNS_ballistic_equipment_2_desc:0 "Точна, смертоносна, незручна — ось три слова, що описують Гвинтівку Снайпера. Після років модифікацій старих мисливських зразків вона отримала оптику, високу початкову швидкість кулі й механізм самозарядки. Але відсутність пістолетної рукоятки й пряма ложа — проблема для ближнього бою."
LNS_ballistic_equipment_3:0 "GR-T Mark 1"
LNS_ballistic_equipment_3_short:0 "GR-T Mk1"
LNS_ballistic_equipment_3_desc:0 "Результат уроків, винесених із попередніх моделей, і допомоги найманців та зброярів. Напівпістолетна рукоятка, короткий ствол і високоточні набої 6.5мм — усе це робить GR-T Mk1 універсальною зброєю для будь-якої відстані."

# LOI (Loid's Ministry)
LOI_ballistic_equipment_4:0 "Автомат Спеціальний 65"
LOI_ballistic_equipment_4_short:0 "АС-65"
LOI_ballistic_equipment_4_desc:0 "Розроблений у 2065 для 7.62×54ммR. Планувався до масового впровадження в СРСР, але війна завадила. Спецпризначенці та елітні частини встигли отримати ці автомати. Зроблений на основі АК, новий дизайн був обраний за компактність і надійність, знайому радянським солдатам."
LOI_high_fighter_equipment:0 "Сухой Су-95М"
LOI_high_fighter_equipment_short:0 "Су-95М"
LOI_high_fighter_equipment_desc:0 "Су-95М — модернізована версія Су-96, багатофункціонального радянського штурмовика. Його історія почалась ще з Су-47 у 1997, через Су-66 у 2033, і завершилась впровадженням Су-96 у 2061. Сучасна модифікація — результат реформи ВПС у 2071. Його експортовано в обмежених кількостях, і він став прототипом китайського винищувача Xian."
LOI_high_cas_equipment:0 "Сухой Су-96М"
LOI_high_cas_equipment_short:0 "Су-96М"
