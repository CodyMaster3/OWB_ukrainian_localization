  # MOJ (Mojave Chapter)
MOJ_melee_equipment_3:0 "Антена X-2"
MOJ_melee_equipment_3_short:0 "Антена X-2"
MOJ_melee_equipment_3_desc:0 "Одна з багатьох спеціальних антен, що використовувалися для створення радарного відштовхувального поля навколо Центру досліджень Великої Гори, а також для передач масиву X-2. Як зброя, вона фокусує мозкові хвилі та завдає електричного урону, особливо ефективна проти роботів і силової броні."
MOJ_melee_equipment_4:0 "Електрорукавиця"
MOJ_melee_equipment_4_short:0 "Електрорукавиця"
MOJ_melee_equipment_4_desc:0 "Первісно створена для знешкодження несправних роботів, електрорукавиця виявилася ефективною проти будь-яких цілей — чи то броньованих, м’якотілих, органічних чи штучних. Виглядає як зап’ястна батарея з електризованими пластинами на кістяках. Удар — і ворог отримує розряд, який не забуде."
MOJ_energy_equipment_3:0 "Лазерна Електрична Гвинтівка"
MOJ_energy_equipment_3_short:0 "LAER"
MOJ_energy_equipment_3_desc:0 "Лазерна електрична гвинтівка (LAER) використовує лазер для створення плазмового провідника в повітрі, а потім пропускає через нього потужний електричний розряд. Складна технологія, що була доведена до досконалості в Центрі R&D Великої Гори."
MOJ_energy_equipment_4:0 "Голографічна Гвинтівка"
MOJ_energy_equipment_4_short:0 "Гологвинтівка"
MOJ_energy_equipment_4_desc:0 "Гвинтівка з оптикою та помповою подачею, гологвинтівка — унікальна тим, що її постріли — це не кулі, не плазма, не лазери й навіть не електричний розряд. В основі лежить голографічна технологія, розроблена в Сьєрра-Мадре, що створює новий тип енергетичної зброї."
MOJ_spec_ops_equipment_4:0 "$spec_ops_equipment_tech_icon_4_bos$"
MOJ_spec_ops_equipment_4_short:0 "$spec_ops_equipment_tech_icon_4_bos_short$"
MOJ_spec_ops_equipment_4_desc:0 "$spec_ops_equipment_tech_icon_4_bos_desc$"
MOJ_spec_ops_equipment_5:0 "Комбінована Розвідброня"
MOJ_spec_ops_equipment_5_short:0 "Комбінована Розвідброня"
MOJ_spec_ops_equipment_5_desc:0 "Завдяки використанню передових матеріалів і технологій ми можемо створити розвідувальну броню, яка буде одночасно легшою та міцнішою за попередні моделі."
MOJ_ballistic_fireteam_equipment_4:0 "Кіберпес K9000"
MOJ_ballistic_fireteam_equipment_4_short:0 "Кіберпес"
MOJ_ballistic_fireteam_equipment_4_desc:0 "Ця зброя — незвичний різновид кіберпса: замість тіла собаки — рама кулемета, а мозок справжнього пса зберігається в банці. Має вуха, що рухаються, й «ніс» на банці — здатен нюхати та орієнтуватися. Стріляє .357 Magnum. Пес, що гавкає й стріляє."
MOJ_flamer_demolitions_equipment_4:0 "Сонячна Гармата"
MOJ_flamer_demolitions_equipment_4_short:0 "Сонячна Гармата"
MOJ_flamer_demolitions_equipment_4_desc:0 "Вперше розроблена до Великої Війни, Сонячна гармата мала використовуватись як засіб контролю натовпу проти неброньованих цілей. У масове виробництво не потрапила, але використовувалась точково Анклавом — тепер і нами."
MOJ_wasteland_pa_tech:0 "Відновлена Силова Броня"
MOJ_wasteland_pa_tech_desc:0 "Відновлена з броні T-45d, знайденої після першої війни між НКР і Братством. Нам видали залишки з низу складів для місії в Мохаве. Її легко носити й вона витримує чимало, але пересування в ній — ще той виклик."
MOJ_power_armor_equipment_1:0 "Відновлена Броня Війни НКР-Братство"
MOJ_power_armor_equipment_1_short:0 "Відновлена Броня"
MOJ_power_armor_equipment_1_desc:0 "Відновлена з броні T-45d, знайденої після першої війни між НКР і Братством. Нам видали залишки з низу складів для місії в Мохаве. Її легко носити й вона витримує чимало, але пересування в ній — ще той виклик."
MOJ_scav_pa_tech:0 "Переоснащена Силова Броня"
MOJ_scav_pa_tech_desc:0 "Після тривалого перебування в Мохаве ми змогли вдосконалити свою силову броню, зробивши її більш ефективною та витривалою."
MOJ_power_armor_equipment_2:0 "Переоснащена Броня Мохавської Експедиції"
MOJ_power_armor_equipment_2_short:0 "Переоснащена Броня"
MOJ_power_armor_equipment_2_desc:0 "Після тривалого перебування в Мохаве ми змогли вдосконалити свою силову броню, підвищивши її ефективність і витривалість для наших паладинів."
MOJ_robot_scurry_tech:0 "Робо-Скорпіон"
MOJ_robot_scurry_tech_short:0 "Робо-Скорпіон"
MOJ_robot_scurry_tech_desc:0 "Робо-Скорпіон був створений до Великої Війни доктором Мобіусом і його командою у військовому комплексі X-42 у Великій Горі. Оснащений ядерною батареєю, енергетичним жалом, оптикою, що дозволяє операторам бачити крізь нього, та системою самознищення, він був ідеальним охоронцем для Центру Досліджень."
MOJ_support_robot_scurry_equipment:0 "Робо-Скорпіон"
MOJ_support_robot_scurry_equipment_short:0 "Робо-Скорпіон"
MOJ_support_robot_scurry_equipment_desc:0 "Робо-Скорпіон був створений до Великої Війни доктором Мобіусом і його командою у військовому комплексі X-42 у Великій Горі. Оснащений ядерною батареєю, енергетичним жалом, оптикою, що дозволяє операторам бачити крізь нього, та системою самознищення, він був ідеальним охоронцем для Центру Досліджень."
