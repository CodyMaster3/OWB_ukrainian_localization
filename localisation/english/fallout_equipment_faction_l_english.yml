  BOS_spec_ops_equipment_4_desc:0 "$spec_ops_equipment_tech_icon_4_bos_desc$"
  BOS_spec_ops_equipment_5:0 "Композитна розвідувальна броня"
  BOS_spec_ops_equipment_5_short:0 "Композитна розвідброня"
  BOS_spec_ops_equipment_5_desc:0 "Завдяки передовим матеріалам і методам виробництва, ми можемо створити броню, легшу й міцнішу за попередні версії — ідеальну для мобільних операцій."
  BOS_blimp_equipment_4:0 "Дирижабль класу 'Оcсіола'"
  BOS_blimp_equipment_4_short:0 "Клас 'Оссіола'"
  BOS_blimp_equipment_4_desc:0 "Гордість будь-яких повоєнних ВПС. Один такий дирижабль здатен самостійно змінити хід битви, а кілька — повністю перекроїти карту Пустки. Повітряна база, бойовий корабель і символ військової переваги в одному корпусі."

  # BRK (Broken Coast)
  BRK_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_fishbone$"
  BRK_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_fishbone_short$"
  BRK_melee_equipment_1_desc:0 "$melee_weaponry_tech_icon_1_fishbone_desc$"
  BRK_melee_equipment_2:0 "$melee_weaponry_tech_icon_2_gut_harpoon$"
  BRK_melee_equipment_2_short:0 "$melee_weaponry_tech_icon_2_gut_harpoon_short$"
  BRK_melee_equipment_2_desc:0 "$melee_weaponry_tech_icon_2_gut_harpoon_desc$"
  BRK_infantry_equipment_1:0 "$basic_ballistic_weaponry_icon_blackpowder$"
  BRK_infantry_equipment_1_short:0 "$basic_ballistic_weaponry_icon_blackpowder_short$"
  BRK_infantry_equipment_1_desc:0 "$basic_ballistic_weaponry_icon_blackpowder_desc$"
BRK_ballistic_equipment_1:0 "Маленька Марі"
BRK_ballistic_equipment_1_short:0 "Марі"
BRK_ballistic_equipment_1_desc:0 "Маленькі, але потужні дробовики розміром з пістолет, здатні пробити дерев’яний корпус корабля. Кожен поважаючий себе пірат носить 'Марі'. Жахлива назва походить з байки про дівчину, яка вистрілила батькові в обличчя... за що Пустка її й запам’ятала.\n\n"
BRK_ballistic_equipment_2:0 "Гармата Рудобородого"
BRK_ballistic_equipment_2_short:0 "Гармата"
BRK_ballistic_equipment_2_desc:0 "Капітан Рудобородий з Порт-Мо став легендою за життя. Його важільна гвинтівка наводила жах, і досі асоціюється з лихими часами морської слави. Сьогодні кожна така гвинтівка — це луна його слави.\n\n"
BRK_ballistic_equipment_3:0 "Карабін Моряка"
BRK_ballistic_equipment_3_short:0 "Карабін Моряка"
BRK_ballistic_equipment_3_desc:0 "Тільки відчайдухи йдуть на північ, у крижані води Аляски. І тільки одиниці повертаються — з трофеями. Найцінніший з них — довоєнний 'Карабін Моряка'. Рідкісний, смертоносний і символ престижу для кожного, хто його носить.\n\n"
BRK_ballistic_equipment_4:0 "Кільгольник"
BRK_ballistic_equipment_4_short:0 "Кільгольник"
BRK_ballistic_equipment_4_desc:0 "Остаточна відповідь на питання 'а чи можна стріляти, як корабель?'. Цей плечовий монстр здатен самотужки потопити невеличке судно. Кожен справжній пірат мріє про власний бортовий залп — і з 'Кільгольником' мрії збуваються.\n\n"
BRK_energy_equipment_1:0 "Мушкет Божевільного"
BRK_energy_equipment_1_short:0 "Мушкет"
BRK_energy_equipment_1_desc:0 "Кажуть, Джек-Божевільний зібрав цей мушкет із реакційної камери, ручки й мотка ізострічки — бо йому не було чим захищати дім від піратів. Так і почалася мода на лазерні мушкети серед екіпажів, які знають, де шукати технопоклади.\n\n"
BRK_energy_equipment_2:0 "Пороховий Мавпеня"
BRK_energy_equipment_2_short:0 "Мавпеня"
BRK_energy_equipment_2_desc:0 "Ті небагато піратів, хто виживає з енергозброєю, починають її покращувати — як тільки вистачає рук і брухту. Варіанти різні, але результат завжди той самий: смертоносно. Для ворога — або для власника. Часто — для обох.\n\n"
BRK_energy_equipment_3:0 "Плазмолок"
BRK_energy_equipment_3_short:0 "Плазмолок"
BRK_energy_equipment_3_desc:0 "Здобути плазмову зброю — це привід для гордості до кінця життя. А для піратів — ще й стиль. Вони вірять: добрий пірат носить кремінь. А якщо цей кремінь стріляє зеленим вогнем? Назви хай собі будуть — а для них це Плазмолок.\n\n"

  # CES (Caesar's Legion)
  CES_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_machete$"
  CES_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_machete_short$"
