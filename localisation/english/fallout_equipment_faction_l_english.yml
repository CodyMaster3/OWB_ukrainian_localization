l_english:
  #######################################
  ### COSMETIC TECH LOCALIZATION KEYS ###
  #######################################
  # Ballistic
basic_ballistic_weaponry_icon_blackpowder:0 "Пістоль на чорному пороху"
basic_ballistic_weaponry_icon_blackpowder_short:0 "Стара кобура"
basic_ballistic_weaponry_icon_blackpowder_desc:0 "Брак ресурсів, знань про зброю та відсутність виробництва зробили кременеві пістолі звичним явищем на Зламаному Узбережжі. Окрім звичайної функції бокової зброї, обтяжене руків’я чудово підходить для биття в рукопашну під час абордажу, а широкий ствол дозволяє сміливим піратам заряджати дробом — і тоді перший постріл знищить ворога спалахом та гуркотом, що глушить."
basic_ballistic_weaponry_icon_pipe_revolver:0 "Саморобний револьвер"
basic_ballistic_weaponry_icon_pipe_revolver_short:0 "Револьвер"
basic_ballistic_weaponry_icon_pipe_revolver_desc:0 "Голова йде до рук, коли голова не має чим стріляти. Часостражі люблять велику вогневу міць, але здобути її непросто, не кажучи вже про стандартизацію. Використовуючи брухт та занедбані кузні у своїх землях, вони зібрали цей громіздкий револьвер — він ледве тримається купи після кожного пострілу гігантським .38 калібром вагою 200 гран."
ballistic_weaponry_tech_icon_1_10mm_classic:0 "Пістолет Colt 6520 10мм"
ballistic_weaponry_tech_icon_1_10mm_classic_short:0 "10мм Пістолет"
ballistic_weaponry_tech_icon_1_10mm_classic_desc:0 "Vault-Tec замовляв розробку зброї у приватних підрядників, і Colt 6520 став одним із найуспішніших результатів. Камора на 10мм."
ballistic_weaponry_tech_icon_1_10mm_nv:0 "Службовий пістолет N99"
ballistic_weaponry_tech_icon_1_10mm_nv_short:0 "10мм Пістолет"
ballistic_weaponry_tech_icon_1_10mm_nv_desc:0 "Штатна зброя великого калібру в армії США до апокаліпсису — ця 10мм модель створена, перш за все, для зупиняльної сили та механічної надійності. Проста конструкція дозволяє навіть найбільш тупому новобранцю позбутися осічок, а посилений корпус витримує найгірші умови. Разом це робить її ідеальною для боїв у Пустці."
ballistic_weaponry_tech_icon_1_9mm_smg:0 "Пістолет-кулемет 9мм"
ballistic_weaponry_tech_icon_1_9mm_smg_short:0 "9мм ППК"
ballistic_weaponry_tech_icon_1_9mm_smg_desc:0 "Невеликий, але смертельний — цей ППК може виплюнути цілий магазин менше ніж за три секунди. 9мм патрони — легкі й поширені, що робить його ідеальним для сліпого шквального вогню."
ballistic_weaponry_tech_icon_1_caravan_shotgun_sturdy:0 "Караванна рушниця"
ballistic_weaponry_tech_icon_1_caravan_shotgun_sturdy_short:0 "Двостволка"
ballistic_weaponry_tech_icon_1_caravan_shotgun_sturdy_desc:0 "Класика 12 калібру — караванна рушниця має вертикальне компонування стволів, що покращує прицілювання, віддачу та дозволяє швидко перезаряджати. Недивно, що вона улюблена в Братстві Техасу. А якщо зарядити її чотириноюльовим дробом у магнум-гільзі — то навіть стара зброя зносить голову одним пострілом."
ballistic_weaponry_tech_icon_1_mna_9mm_pistol:0 "Пістолет M&A 9мм"
ballistic_weaponry_tech_icon_1_mna_9mm_pistol_short:0 "9мм Пістолет"
ballistic_weaponry_tech_icon_1_mna_9mm_pistol_desc:0 "Поширений бічний ствол серед поліції та армії, калібрований під один з наймасовіших набоїв в історії. Ідеальний кандидат для широкого застосування."
ballistic_weaponry_tech_icon_1_sten:0 "Пістолет-кулемет Sten"
ballistic_weaponry_tech_icon_1_sten_short:0 "Sten"
ballistic_weaponry_tech_icon_1_sten_desc:0 "Може стріляти саморобними 9мм, має просту конструкцію та компактний дизайн — панове, перед вами Sten! Гордість місцевих інженерів, одна з найкращих штурмових іграшок Пустки. Один боєць з ним — і страх заливає душу всіх на його шляху. І все це — завдяки джентельменському генію! Отже, панове, ви підпишетесь?"
ballistic_weaponry_tech_icon_1_44:0 "Револьвер .44"
ballistic_weaponry_tech_icon_1_44_short:0 ".44"
ballistic_weaponry_tech_icon_1_44_desc:0 "Зі змінами до зброї Часостражів настав час для справжнього апгрейду. Металева рамка, посилений барабан і довгий ствол — ця штука не просто виглядає грізно. Вона стріляє тим самим .38 калібром, але з кращим контролем віддачі та точністю — усе те саме нищівне влучання, тільки в більш надійному пакеті."
ballistic_weaponry_tech_icon_2_44_upgraded:0 "Покращений револьвер .44"
ballistic_weaponry_tech_icon_2_44_upgraded_short:0 ".44 Покращений"
ballistic_weaponry_tech_icon_2_44_upgraded_desc:0 "У світі Часостражів слово «покращення» — це вже перебільшення. Але цей револьвер дійсно заслужив свою назву: один кмітливий зброяр спромігся змусити бойову ручну гармату стріляти 350-грановим .44 патроном — і при цьому не зірвати собі руки. Колись фільми перебільшували силу таких речей, але ця дійсно може викинути людину через кімнату."
ballistic_weaponry_tech_icon_2_dakka:0 "Штурмова рушниця 'Блекджек'"
ballistic_weaponry_tech_icon_2_dakka_short:0 "Штурмова рушниця"
ballistic_weaponry_tech_icon_2_dakka_desc:0 "Міцна, з магазинною подачею, ультракомпактна шотгана — 'Блекджек' випльовує стандартні 12 каліброві заряди з міні-стволу, забезпечуючи максимальне розсіювання на ближній дистанції. Посилена рама, відсутність прикладу й короткий профіль роблять її ідеальною для обстрілу з машини чи ламання чужих орбіт. А з багнетом — взагалі кишеньковий нутрощеріз."
ballistic_weaponry_tech_icon_2_m16a1:0 "M16A1"
ballistic_weaponry_tech_icon_2_m16a1_short:0 "M16"
ballistic_weaponry_tech_icon_2_m16a1_desc:0 "Результат ретельного обшуку забутих армійських складів і трохи зворотної інженерії. M16A1 легко виробляється з наявних матеріалів. Це вдосконалена версія базової M16: з покращеним внутрішнім механізмом та штовхачем затвору. Класична платформа на 5.56мм у надійній, точній та стабільній формі. Ідеальна для середньої дистанції, але на повному авто — це ще й чудовий засіб для швидкого очищення кімнат."
ballistic_weaponry_tech_icon_2_medicine_stick:0 "Медична палиця"
ballistic_weaponry_tech_icon_2_medicine_stick_short:0 "Мисливська рушниця"
ballistic_weaponry_tech_icon_2_medicine_stick_desc:0 "Ковбойська романтика старого світу зустрічає постядерну дійсність. Оновлений варіант гвинтівки Winchester 1886 — справжня класика, яку цінує кожне плем’я, що може собі дозволити таку розкіш. Хороша скорострільність для ручної перезарядки, висока точність і вдосконалені приціли роблять її придатною для будь-якого бою в Пустці. Камора під потужний .45-90 Express — розрахований на єнотовидних мутантів, кігтей смерті, і дурнів у силовій броні."
ballistic_weaponry_tech_icon_2_paciencia:0 "Гвинтівка Paciencia"
ballistic_weaponry_tech_icon_2_paciencia_short:0 "БЕ Гвинтівка"
ballistic_weaponry_tech_icon_2_paciencia_desc:0 "Багато хто не вважає мисливську гвинтівку загрозою. І дарма. Ця перероблена болт-екшн зброя стріляє коротшими протиматеріальними набоями, здатними пробити більшість перешкод і навіть легку броню. Вона дає сильну віддачу — але ще сильніший удар."
ballistic_weaponry_tech_icon_2_service_rifle:0 "Службова гвинтівка"
ballistic_weaponry_tech_icon_2_service_rifle_short:0 "Службова гвинтівка"
ballistic_weaponry_tech_icon_2_service_rifle_desc:0 "Основна бойова гвинтівка довоєнної армії США. Відремонтована, оновлена, з естетичним деревом від Redwood. Повернулась у стрій."
ballistic_weaponry_tech_icon_3_assault_carbine:0 "Штурмовий карабін"
ballistic_weaponry_tech_icon_3_assault_carbine_short:0 "Штурм. карабін"
ballistic_weaponry_tech_icon_3_assault_carbine_desc:0 "Магазинна, компактна автоматична зброя з високою скорострільністю і мінімальним розсіюванням. Один із найточніших автоматів у Пустці. Ефективний як на ближній, так і на середній дистанції."
ballistic_weaponry_tech_icon_3_p90:0 "P90 PDW"
ballistic_weaponry_tech_icon_3_p90_short:0 "P90"
ballistic_weaponry_tech_icon_3_p90_desc:0 "Передова європейська розробка, яку імпортували до США для сил спеціальних операцій. P90 знову знайшли у військових бункерах та почали масове виробництво. Надкомпактна, з можливістю пробивати броню, з магазином на 50 патронів калібру 5.7мм — ця штучка поєднує скорострільність і пробивну силу, ставши еталоном ближнього бою."
ballistic_weaponry_tech_icon_4_g11:0 "H&K G11"
ballistic_weaponry_tech_icon_4_g11_short:0 "G11"
ballistic_weaponry_tech_icon_4_g11_desc:0 "Ця зброя перевернула світ штурмових гвинтівок. Вона стріляє безгільзовими набоями — суцільним блоком пороху з кулею всередині. Завдяки зменшеній вазі та економії місця, G11 має вражаючу місткість магазину."

ballistic_weaponry_tech_icon_4_marksman_carbine:0 "Карабін марксмана"
ballistic_weaponry_tech_icon_4_marksman_carbine_short:0 "Карабін марксмана"
ballistic_weaponry_tech_icon_4_marksman_carbine_desc:0 "Напів-автоматичний карабін середньої потужності з магазином на 20 патронів. Дуже точний на великій дистанції, але не втрачає ефективності в ближньому бою. Ідеальний вибір для армії, яка стріляє не по ворогу — а по цілі."

ballistic_weaponry_tech_icon_4_marksman_carbine_desert:0 "Пустельний $ballistic_weaponry_tech_icon_4_marksman_carbine$"
ballistic_weaponry_tech_icon_4_marksman_carbine_desert_short:0 "$ballistic_weaponry_tech_icon_4_marksman_carbine_short$"
ballistic_weaponry_tech_icon_4_marksman_carbine_desert_desc:0 "$ballistic_weaponry_tech_icon_4_marksman_carbine_desc$"



# Energy
energy_weaponry_tech_icon_1_compliance_regulator:0 "Регулятор Підкорення"
energy_weaponry_tech_icon_1_compliance_regulator_short:0 "Регулятор Підкорення"
energy_weaponry_tech_icon_1_compliance_regulator_desc:0 "Регулятор Підкорення — це електролазер, створений для оглушення цілі за допомогою електричного струму. Менш смертоносна альтернатива для поліції чи рейнджерів, які мали справу з буйними порушниками або небезпечною фауною. Хоч його випромінювання й може серйозно травмувати (або навіть убити при повторному застосуванні), здатність вивести ворога з бою на кілька секунд робить його кориснішим за звичайний бойовий лазер у правильних руках і ситуаціях."
energy_weaponry_tech_icon_1_pistol:0 "Лазерний пістолет"
energy_weaponry_tech_icon_1_pistol_short:0 "Лазерний пістолет"
energy_weaponry_tech_icon_1_pistol_desc:0 "AER9 насправді не був найкращим лазерним зразком у часи Великої Війни — на той момент вже існували AER12, що надходили до спецпідрозділів. Але саме AER9 найчастіше трапляється у Пустці, бо був значно міцнішим і надійнішим за наступні, «просунуті» моделі. Ще одне підтвердження: краще старе, але робоче."
energy_weaponry_tech_icon_1_wattz_1000:0 "Лазерний пістолет Wattz"
energy_weaponry_tech_icon_1_wattz_1000_short:0 "Wattz 1000"
energy_weaponry_tech_icon_1_wattz_1000_desc:0 "Дешевий, простий у виробництві та тому — надзвичайно поширений. Wattz 1000 часто використовувався як поліцією, так і цивільними ще до війни. Підвищена потужність і регулювання фокусувального поля дозволяють йому навіть змагатися з серією AER від General Atomics, хоча коштує значно менше."
energy_weaponry_tech_icon_2_wattz_2000:0 "Лазерна гвинтівка Wattz 2000"
energy_weaponry_tech_icon_2_wattz_2000_short:0 "Wattz 2000"
energy_weaponry_tech_icon_2_wattz_2000_desc:0 "Більше схожа на снайперську гвинтівку, ніж на стандартну. Wattz 2000 славиться своєю точністю на великих відстанях. Живлення від мікроф’южн-елементів дозволяє їй видавати потужні промені, які в умілих руках можуть спопелити кого завгодно — хоч рейдера, хоч когтя смерті."
energy_weaponry_tech_icon_3_wattz_tactics:0 "Лазерна гвинтівка Wattz 3000"
energy_weaponry_tech_icon_3_wattz_tactics_short:0 "Wattz 3000"
energy_weaponry_tech_icon_3_wattz_tactics_desc:0 "Пряма еволюція попередньої моделі. Wattz 3000 має потужніший внутрішній конденсатор, що дозволяє збільшити скорострільність без втрати бойових характеристик. Швидко, потужно, надійно — як має бути в бою."
energy_weaponry_tech_icon_4_murderizer:0 "Фаршувальник"
energy_weaponry_tech_icon_4_murderizer_short:0 "M-191"
energy_weaponry_tech_icon_4_murderizer_desc:0 "Експериментальна лазерна зброя M-191, відома як 'Фаршувальник', робить саме те, що обіцяє. Стоїш перед ним — стаєш обвугленим спогадом. Стильний, агресивний, і не має потреби в довгих описах. Просто — фарш!"

# Melee
melee_weaponry_tech_icon_1_crowbar:0 "Лом"
melee_weaponry_tech_icon_1_crowbar_short:0 "Лом"
melee_weaponry_tech_icon_1_crowbar_desc:0 "Передусім — це інструмент. Наші солдати використовують його для відкривання контейнерів, дверей і дерев'яних дошок під час пошуків припасів. Але давайте чесно: це ще й важка сталева палиця. А значить — прекрасна зброя для тих, хто вміє бити з важелем."
melee_weaponry_tech_icon_1_cultist_knife:0 "Ніж Культиста"
melee_weaponry_tech_icon_1_cultist_knife_short:0 "Ніж Культу"
melee_weaponry_tech_icon_1_cultist_knife_desc:0 "Дивовижно виготовлений клинок, що викликає тривогу й безнадію у кожного, хто на нього погляне. Руків’я — з відполірованих кісток, просочених оскверненою кров’ю, що надає йому червоного відтінку. Хвилеподібне лезо завдає жахливих ран — ніби зазубрений край. Ідеально для пролиття крові в Його Ім’я."
melee_weaponry_tech_icon_1_fishbone:0 "Риб'яча Кістка"
melee_weaponry_tech_icon_1_fishbone_short:0 "Кістка"
melee_weaponry_tech_icon_1_fishbone_desc:0 "Свою назву отримали за зазубрені краї й блідо-біле лезо. Такі клинки часто виготовляють із уламків корабельних корпусів. Дешевий, іржавий метал — ідеальний для шивів. А правця... вважають за приємний бонус."
melee_weaponry_tech_icon_1_machete:0 "Мачете"
melee_weaponry_tech_icon_1_machete_short:0 "Мачете"
melee_weaponry_tech_icon_1_machete_desc:0 "Простий, але ефективний інструмент. Цим мачете рубають і ріжуть ворога, пробиваючи більшість бронежилетів і залишаючи страхітливі, криваві рани."
melee_weaponry_tech_icon_1_security_baton:0 "Охоронний кийок"
melee_weaponry_tech_icon_1_security_baton_short:0 "Кийок охорони"
melee_weaponry_tech_icon_1_security_baton_desc:0 "Складаний кийок для поліції, використовувався до Великої Війни різними правоохоронцями. Стандартне спорядження охорони Vault-Tec — і, як показує час, досить ефективна."
melee_weaponry_tech_icon_2_conch_knife:0 "Ніж-Мушля"
melee_weaponry_tech_icon_2_conch_knife_short:0 "Мушлевий ніж"
melee_weaponry_tech_icon_2_conch_knife_desc:0 "Один із несподіваних наслідків Великої Війни — потепління океану. За 200 років без морських подорожей та з мутаціями коралові рифи Anacapa розрослись уздовж усього західного узбережжя. Узбережні племена Орегону використовують корали для ритуалів, будівництва і... зброї.\nНожі з мушлі — частина цієї культури. Два шматки раковини скріплені разом, із загостреним наконечником з морської черепашки. Такі ножі ефективно ріжуть будь-якого ворога — чи то племінника, жертву чи мутанта."
melee_weaponry_tech_icon_2_cultist_blade:0 "Меч Культиста"
melee_weaponry_tech_icon_2_cultist_blade_short:0 "Меч Культу"
melee_weaponry_tech_icon_2_cultist_blade_desc:0 "Меч культиста створений для слави Його імені навіть на полі бою. Відкинувши екзотичну форму ножа, цей клинок має пряме зазубрене лезо для легкого розсікання плоті та кровопролиття. Руків’я — з кісток єретиків, а сам меч — благословенний темними силами. Його спотворена енергія проникає в кожного, хто тримає його поруч."
melee_weaponry_tech_icon_2_gut_harpoon:0 "Гарпун для нутрощів"
melee_weaponry_tech_icon_2_gut_harpoon_short:0 "Гарпун"
melee_weaponry_tech_icon_2_gut_harpoon_desc:0 "Попри загрозливий вигляд, ці зламані наконечники гарпунів на палицях — радше незбалансовані дубинки. Проте вони улюблені серед рейдерів Зламаного Узбережжя за свій страхітливий вигляд і непередбачуваність у бою."
melee_weaponry_tech_icon_2_machete_gladius:0 "Гладіус-мачете"
melee_weaponry_tech_icon_2_machete_gladius_short:0 "Гладіус"
melee_weaponry_tech_icon_2_machete_gladius_desc:0 "Покращена версія класичного мачете. Заглиблення у клинку переносить вагу ближче до леза, забезпечуючи потужніший розмашистий удар."
melee_weaponry_tech_icon_3_bumper_sword:0 "Бамперний меч"
melee_weaponry_tech_icon_3_bumper_sword_short:0 "Бампер-меч"
melee_weaponry_tech_icon_3_bumper_sword_desc:0 "Як видно з назви, цей меч зроблений зі старого автомобільного бампера. Його сплющили та загострили до стану грубого, важкого леза. Номерний знак ще на місці, а вихлопна труба, прикріплена до тупого кінця, слугує руків’ям. Якщо це не постапокаліптична естетика — то що ж тоді?"
melee_weaponry_tech_icon_4_displacer:0 "Рукавичка-витискувач"
melee_weaponry_tech_icon_4_displacer_short:0 "Рукавичка-витискувач"
melee_weaponry_tech_icon_4_displacer_desc:0 "Рукавичка-витискувач створює ударну хвилю при зіткненні — подібну до тієї, що виникає при пострілі з гвинтівки Ґаусса. Водночас вона і завдає серйозної шкоди, і відкидає ціль назад. Ймовірно, працює за рахунок звукового вибуху — на що натякає динамік на кісточках."

# PA
stripped_power_armour_icon_ncr:0 "Відновлена силова броня НКР"
stripped_power_armour_icon_ncr_short:0 "Відновлена СБ НКР"
stripped_power_armour_icon_ncr_desc:0 "Ця броня — колишня T-45d, піднята з полів Першої війни НКР з Братством. Техніки НКР вичистили з неї більшість складної довоєнної начинки, зробивши її придатною до використання навіть необученим воякам. Вона все ще чудово тримає удар, але відома тим, що в ній пересуватись — ще те випробування."
scav_power_armour_icon_ncr:0 "Обпалена силова броня 'Сьєрра'"
scav_power_armour_icon_ncr_short:0 "СБ 'Сьєрра'"
scav_power_armour_icon_ncr_desc:0 "Модифікований варіант T-45d, призначений для офіцерів НКР. Лівий наплічник замінено опудалом ведмежої голови без шерсті, закріпленої на зеленому плащі з двома бронзовими зірками. Циліндри живлення замінено на компактний блок з зеленими панелями, які також світяться на передпліччях. На відміну від звичайної відновленої броні, ця зберегла свої серво-приводи і повністю функціональна."

# Robots

# Spec Ops
spec_ops_equipment_tech_icon_3_ncr:0 "Патрульна броня Рейнджерів"
spec_ops_equipment_tech_icon_3_ncr_short:0 "Патрульна броня"
spec_ops_equipment_tech_icon_3_ncr_desc:0 "Базова форма броні, яку носять рейнджери Нової Каліфорнійської Республіки. Мінімум зайвого — максимум ефективності."
spec_ops_equipment_tech_icon_4_bos:0 "Розвідувальна броня"
spec_ops_equipment_tech_icon_4_bos_short:0 "Розвідброня"
spec_ops_equipment_tech_icon_4_bos_desc:0 "Спочатку створена як підкладка для T-45d, ця розвідброня — герметичний комбінезон з азбесту, що повністю закриває тіло. Хоча в силовій броні вона — лише база, на самоті вона чудово підходить для місій, де потрібно більше руху, ніж дозволяє традиційна силова броня."

# Support

# Vehicles

# Other
heavy_infantry_tech_icon_1_collar:0 "Нашийники рабів"
heavy_infantry_tech_icon_1_collar_short:0 "Рабські нашийники"
heavy_infantry_tech_icon_1_collar_desc:0 "Повна система підкорення — так званий «рабський нашийник» — довоєнний пристрій для контролю над ув’язненими, розроблений у Центрі Big MT. Після війни його підхопили работорговці, перетворивши на засіб поневолення і покори. Безпечно зняти — майже неможливо."


