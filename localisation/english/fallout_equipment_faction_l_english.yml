LOI_power_armor_equipment_1:0 "T34-PA «Город»"
LOI_power_armor_equipment_1_short:0 "T34-PA"
LOI_power_armor_equipment_1_desc:0 "§gА ось це вже щось.§!\nT34-PA «Город» названий на честь свого сталевого пращура — танка Т-34. Це перша спроба створити справжню силову броню. Гідравліки нема, тож пересування — важке. Зате броня щільна. Поки що це більше рухома стіна, ніж бойовий костюм — але ми працюємо над цим."
LOI_simple_servo_tech:0 "Інтеграція Сервоприводів"
LOI_simple_servo_short:0 "Сервоприводи"
LOI_simple_servo_desc:0 ""
LOI_power_armor_equipment_2:0 "T34-1 «Механізований»"
LOI_power_armor_equipment_2_short:0 "T34-1"
LOI_power_armor_equipment_2_desc:0 ""
LOI_power_armor_equipment_tbh:0 "T35-PA «Руйнівник Бункерів»"
LOI_power_armor_equipment_tbh_short:0 "T35-PA"
LOI_power_armor_equipment_tbh_desc:0 "Коли тобі дають чек без обмежень — фантазія не знає меж. T35-PA, або «Руйнівник Бункерів» — наш найсвіжіший витвір. Корпус і скелет — з танків, люб’язно «наданих» Спіром. Міномет на спині — переобладнана стара зброя. Повільна, але смертоносна — б’є не лише по цілях, а й по душах."
