BJS_spec_ops_equipment_4:0 "Бойова броня Рейнджера"
BJS_spec_ops_equipment_4_short:0 "Броня Рейнджера"
BJS_spec_ops_equipment_4_desc:0 "Класична чорна бойова броня Рейнджерів — це поєднання традиційного тренчу Пустельних Рейнджерів і довоєнної штурмової броні."
BJS_spec_ops_equipment_5:0 "Броня Ветерана Рейнджерів"
BJS_spec_ops_equipment_5_short:0 "Броня Ветерана"
BJS_spec_ops_equipment_5_desc:0 "Ця легендарна броня Рейнджерів складається з довоєнної вдосконаленої штурмової броні, прикритої символічним чорним плащем Пустельних Рейнджерів."

# BLO (Beltran-Levya Cartel)
BLO_ballistic_equipment_1:0 "Кастомний пістолет M&A 9мм"
BLO_ballistic_equipment_1_short:0 "9мм Кастом"
BLO_ballistic_equipment_1_desc:0 "Індивідуально оформлена версія 9мм пістолета від M&A Guns. Руків’я прикрашено зображенням Діви Гваделупської — католицького символу і втілення Жінки Апокаліпсису. На корпусі — дамаскська гравіровка у вигляді плюща й квітів, нікельоване покриття й позолочений спусковий гачок. Гріховно розкішна зброя."

