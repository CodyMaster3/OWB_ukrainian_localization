SOH_melee_equipment_2:0 "Кувалда"
SOH_melee_equipment_2_short:0 "Кувалда"
SOH_melee_equipment_2_desc:0 ""
SOH_melee_equipment_3:0 "Суперкувалда"
SOH_melee_equipment_3_short:0 "Суперкувалда"
SOH_melee_equipment_3_desc:0 "Коли траншейні бої знову стали нормою в останні дні Старого Світу, зросли й вимоги до інженерів. Так з’явилась суперкувалда — інструмент, що трощив усе від дерева до бетону. 200 років потому її перетворили на смертоносну зброю для рукопашного бою. Якщо раніше нею ламали бетон, то тепер — кістки."
SOH_melee_equipment_4:0 "Силова Рукавиця"
SOH_melee_equipment_4_short:0 "Силова Рукавиця"
SOH_melee_equipment_4_desc:0 "До війни силові рукавиці використовували для шахтних і демонтажних робіт — від мінералів до бетонних конструкцій. Не дивно, що хтось вирішив використати її як зброю. Крім сили удару користувача, ціль ще й ловить всю міць пневматичного удару. Силова рукавиця трощить, знищує, стирає — і те, що залишиться, навряд чи варте поховання."
SOH_ballistic_equipment_1:0 "Desert Eagle"
SOH_ballistic_equipment_1_short:0 "D-Eagle"
SOH_ballistic_equipment_1_desc:0 "Desert Eagle — гігантський і незграбний пістолет для більшості, але не для мутантів. Вони його обожнюють — бо в ньому багато сили й ще більше шуму."
