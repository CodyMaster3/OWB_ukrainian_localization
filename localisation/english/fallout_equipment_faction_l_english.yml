HAN_ballistic_equipment_4_short:0 "$ballistic_weaponry_tech_icon_4_g11_short$"
HAN_ballistic_equipment_4_desc:0 "$ballistic_weaponry_tech_icon_4_g11_desc$"
HAN_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_security_baton$"
HAN_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_security_baton_short$"
HAN_melee_equipment_1_desc:0 "$melee_weaponry_tech_icon_1_security_baton_desc$"
HAN_melee_equipment_4:0 "Електро-Рукавиця"
HAN_melee_equipment_4_short:0 "Електро-Рукавиця"
HAN_melee_equipment_4_desc:0 "Спершу створена для знешкодження неконтрольованих роботів, Електро-рукавиця виявилася ефективною проти будь-якої цілі — броньованої чи м’якої, штучної чи органічної. Батарея на зап’ясті, ударна пластина на кістяку, і удар у щелепу стає ударом струмом. Ідеально для електрошокових сюрпризів у стилі вуличної справедливості."
HAN_gauss_weaponry_2:0 "Прототип Гаус-Гвинтівки"
HAN_gauss_weaponry_2_short:0 "Гаус-Гвинтівка"
HAN_gauss_weaponry_2_desc:0 "Цей мас-драйвер був створений шляхом зворотної інженерії з M72, вдосконалений китайцями, а потім перехоплений американськими військами в Анкориджі для масового виробництва. Результат — смертоносна антикульова гвинтівка, що пробиває майже все, що бачить. Жорстко. Прямо. Без компромісів."
HAN_power_armor_equipment_tbh:0 "Поліцейська Силова Броня"
HAN_power_armor_equipment_tbh_short:0 "Поліцейська Броня"
HAN_power_armor_equipment_tbh_desc:0 "До Війни правоохоронці використовували силову броню в найнебезпечніших ситуаціях. Ці моделі мали герметизацію для роботи з радіоактивними та біологічними загрозами, включно зі свіжим випадінням або Новою Чумою. З огляду на анархістів, бандитів і надміру собак на вулицях Колорадо — ця броня потрібна нам більше, ніж будь-коли. Ми відновили креслення і готові до запуску у виробництво."
HAN_light_motorized_equipment_4h:0 "Девастатор 2000"
HAN_light_motorized_equipment_4_short:0 "Девастатор"
HAN_light_motorized_equipment_4_desc:0 "Вершина довоєнного американського інженерного марнотратства. Девастатор 2000 — суперкар для агентів DIA, який частіше зустрічався в гаражах мільйонерів. Ядерно-гідравлічний стрибок, гравітарна посадка, ракети, димова завіса, броньовані сидіння... Функціональність хумві, але зі стилем і цінником у десять разів більшим."

# HEA (Heaven's Gate)
HEA_melee_equipment_1:0 "Палиця Хрестоносця"
HEA_melee_equipment_1_short:0 "Палиця Хрестоносця"
HEA_melee_equipment_1_desc:0 "Виготовлена зі шлаку, який велетенські печі навколо «Пари» викидають, немов небажаних дітей, ця палиця є свідченням того, що навіть найнікчемніше створіння має місце в Божому промислі. Якщо нечиста, занедбана руда може стати знаряддям Його милосердя — тоді й ми здатні на чудо.\n\n"
HEA_melee_equipment_2:0 "Гартований Клинок"
HEA_melee_equipment_2_short:0 "Гартований Клинок"
HEA_melee_equipment_2_desc:0 "Десятки кузень обплітають «Пар», а найглибші й найгарячіші його нутрощі — лиш для найкращої зброї. Ковалі працюють під світлом і жаром цієї великої материнської машини, їхні майстерні збудовані над решітками випарів, а леза гартуються у купелях пари.\n\n"
HEA_melee_equipment_3:0 "Паропила"
HEA_melee_equipment_3_short:0 "Паропила"
HEA_melee_equipment_3_desc:0 "Небезпечна й непередбачувана, ця зброя гуде, немов гнів Господній. Парове ядро живить її двигун із надприродною силою, а жар викидається паровими соплами вздовж зубчастого леза. Убиває однаково легко і ворога, і нерозважливого носія.\n\n"
HEA_ballistic_equipment_1:0 "Бічна Зброя Священства"
HEA_ballistic_equipment_1_short:0 "Священницький Пістолет"
HEA_ballistic_equipment_1_desc:0 "Священство Спочинку Хрестителя відоме своєю відданістю Господу й ближньому. І заради захисту беззахисних вони несуть зброю не слабку. Цей пістолет заряджений 5.56мм високошвидкісними гвинтівковими набоями. Він виглядає скромно — але кричить Божим гнівом.\n\n"
HEA_ballistic_equipment_2:0 "Милість"
HEA_ballistic_equipment_2_short:0 "Милість"
HEA_ballistic_equipment_2_desc:0 "Вбити того, хто відкинув любов Божу — це акт милосердя. Бо той і не дізнався б миру на цій святій землі. Полювати й знищувати ворогів пастви — це благодать, благодать Господня. Коли хрест, прив'язаний до гвинтівки, погойдується з кожним пострілом, стрілець пам’ятає: Господь пробачить цей гріх, бо гріх був із милості.\n\n"
HEA_ballistic_equipment_3:0 "Божественний Карабін"
HEA_ballistic_equipment_3_short:0 "Божественний Карабін"
HEA_ballistic_equipment_3_desc:0 "Індивідуально благословенні очільником Небесної Брами у день створення, ці карабіни є одними з наймогутніших знарядь Господа. Магазини прикрашені хрестами, приклад і цівка — з дерева Древа Втраченої Невинності. Кожен постріл — нагадування ворогам Господнім: гріхи не залишаються без покарання.\n\n"
HEA_energy_equipment_1:0 "Парова Гвинтівка AER3"
HEA_energy_equipment_1_short:0 "AER3 Парогвинтівка"
HEA_energy_equipment_1_desc:0 "Подана Північно-Західною Співдружністю під час прототипування AER-проєкту як альтернативна розробка, була відкинута на користь моделей із MF-елементами. Та економіка регіону вже занадто залежала від технологій парових ядер (парових осердів), тож проєкт продовжився повільно, але вперто.\n\n"
HEA_energy_equipment_2:0 "Гнів Архангела"
HEA_energy_equipment_2_short:0 "Гнів Архангела"
HEA_energy_equipment_2_desc:0 "Величезна потужність — за рахунок не менш величезного перегріву. Усі AER3 оснащені масивними корпусами, в яких розміщено білі лазерні компоненти та системи охолодження. Кожен постріл — це білий промінь і шипіння пари. Цей паровий вибух видає звук, що його часто порівнюють із бойовим криком небесного воїна.\n\n"
HEA_energy_equipment_3:0 "Знищувач Демонів"
HEA_energy_equipment_3_short:0 "Знищувач Демонів"
HEA_energy_equipment_3_desc:0 "Поліпшена версія прототипів, що залишили нам предки. Інженери «Пари» створили знаряддя Господа, якому немає рівних. Усе тіло гвинтівки — це конденсатори, що підсилюють лазер, а тепло від охолодження не втрачається: воно спрямовується у смертоносний паровий струмінь, що випалює все перед дулом.\n\n"
HEA_explosive_demolitions_equipment_2:0 "Святий Осколковий Гранат"
HEA_explosive_demolitions_equipment_2_short:0 "Благословенна Граната"
HEA_explosive_demolitions_equipment_2_desc:0 "Ручна вибухівка, тричі благословенна. Її сила походить не лише з Божого гніву. Граната має спеціальну матрицю для оптимального дроблення й потужний заряд. Рівноцінно ефективна проти м’яких і броньованих цілей. Але будьте обережні — таймер запалу може варіюватися від 3 до 5 секунд."

# HGH (High Chappel)
HGH_explosive_demolitions_equipment_2:0 "Святий Осколковий Гранат"
HGH_explosive_demolitions_equipment_2_short:0 "Благословенна Граната"
HGH_explosive_demolitions_equipment_2_desc:0 "Тричі благословенна ручна вибухівка, чия сила походить не лише з гніву Божого. Основа — спеціальна матриця, що оптимізує розрив на осколки, а могутній заряд робить її грізною як проти м’яких, так і броньованих цілей. Щоправда, механізм підриву — непередбачуваний: від 3 до 5 секунд."

