# MDM (Міддлмарк)
MDM_security_robot_securitron_equipment_1:0 "MDM-14a Маркетрон"
MDM_security_robot_securitron_equipment_1_short:0 "MDM-14a Маркетрон"
MDM_security_robot_securitron_equipment_1_desc:0 "Маркетрон (патент подано) — це розробка, яка з’явилася завдяки співпраці МАНІФЕСТ і власників Міддлмарку. Будьте певні, що це повністю оригінальна концепція, і будь-яку схожість із продукцією RobCo слід ігнорувати. Міддлмарк постійно пильнує, щоб зупинити крадіїв і зберегти низькі ціни для всіх наших гостей!"

# WYR
WYR_oregon_geckosupport:0 "Бойові Бігорнери"
WYR_oregon_geckosupport_desc:0 "Бігорнери придатні не лише для м’яса. З невеликим дресируванням їхній інстинкт таранити можна використати, щоб вони бігли поряд з нашими солдатами та збивали ворогів з ніг. Або запускали їх у політ!"

# ATM
ATM_demolitions_equipment_1:0 "Коктейлі Молотова"
ATM_demolitions_equipment_1_desc:0 "Кажуть, що потреба — мати винаходів, і цей класичний запальний засіб є доказом цієї істини. Використовуваний повстанцями й бунтівниками по всьому світу ще до Війни, ми почали виготовляти власні Молотови з підручних матеріалів: пляшки з-під Nuka-Cola, саморобні ґноти й самогон зі швидких перегонок. Це не дорівнює до Військових Вибухівок Старого Світу, але є щось прекрасне в тому, як заражена мерзота горить у святому вогні Порядку."
ATM_demolitions_equipment_1_short:0 "Молотови"

# RRR
RRR_amphibious_beast_equipment_1:0 "Фростлурк"
RRR_amphibious_beast_equipment_1_short:0 "Фростлурки"
RRR_amphibious_beast_equipment_1_desc:0 "Народжені з безконтрольного забруднення старого світу не менш, ніж з його атомної радіації, фростлурки — це амфібійні хижаки з ДНК ракоподібних, що виникли з отруйного супу американських узбереж та мутагенів Manifest. Їхні міцні, ізольовані панцирі забезпечують неймовірний захист не лише від найгірших зимових морозів, а й від балістичної зброї: справжній дар, враховуючи, що на них часто полюють заради м’яса."
RRR_amphibious_beast_equipment_2:0 "Убивці-Фросткігті"
RRR_amphibious_beast_equipment_2_short:0 "Фросткігті"
RRR_amphibious_beast_equipment_2_desc:0 "Воїнський каст фростлурків, фросткігті не лише мають більші клешні та міцніший панцир. Ні, їх справжня сила — в умінні засідати, як у воді, так і на суші. Зливаючись зі сніговими заметами на відстані, вони вискакують і кидаються вперед, щойно здобич наблизиться достатньо, знищуючи ворогів своєї королеви."
RRR_amphibious_beast_equipment_armor:0 "Крижекровні Фростлурки"
RRR_amphibious_beast_equipment_armor_short:0 "Крижекровні Фростлурки"
RRR_amphibious_beast_equipment_armor_desc:0 "Різновид із темним, майже чорним панцирем, Крижекровні Фростлурки виглядають так само страхітливо, як і є насправді. Вони перевершують навіть Фросткігтів за силою та витривалістю — навіть найсильніші воїни вчаться боятись моторошного червоного блиску їхніх очей з-під криги річок."
RRR_amphibious_beast_equipment_king:0 "Королі Фростлурків"
RRR_amphibious_beast_equipment_king_short:0 "Королі Фростлурків"
RRR_amphibious_beast_equipment_king_desc:0 "Хоча їх і називають Королями Фростлурків, ці істоти мають більше спільного з жабами, ніж з крабами, та перебувають у симбіозі зі звичайною породою. Їм бракує майже невразливого панцира, зате вони швидші, потайніші та краще пристосовані до боїв на суші, маючи легені для тривалого перебування над водою. З невідомих причин вони здатні командувати слабшими фростлурками, і завдяки розуму служать не лише воїнами, а й польовими командирами."

# EXE
EXE_insect_equipment_1:0 "Раджуки"
EXE_insect_equipment_1_short:0 "Раджуки"
EXE_insect_equipment_1_desc:0 "Досить унікальна форма мутованих комах, що зустрічається лише в Техасі. Раджуки легко впізнати завдяки їх кулястому тілу та зубам, схожим на людські. Їх улюблений метод атаки — стрибок уперед із шістьма кінцівками, щоб дряпати й кусати жертву, поки та не буде розірвана на шматки."
EXE_insect_equipment_2:0 "Мутовані Раджуки"
EXE_insect_equipment_2_short:0 "Мутовані Раджуки"
EXE_insect_equipment_2_desc:0 "Ці раджуки мутували через вплив FEV із Корпоративного Сховища. Шипи, що ростуть із їхнього тіла, роблять атаки ще смертоноснішими, а зелений екзоскелет набагато міцнішим."
EXE_insect_equipment_3:0 "Великі Мутовані Раджуки"
EXE_insect_equipment_3_short:0 "Великі Раджуки"
EXE_insect_equipment_3_desc:0 "Майже такі великі, як брамін, ці шкідники можуть миттєво розірвати людину навпіл — і будуть більш ніж раді це зробити."

