HAN_ballistic_equipment_1:0 "Пістолет «Круcейдер»"
HAN_ballistic_equipment_1_short:0 "Пістолет «Круcейдер»"
HAN_ballistic_equipment_1_desc:0 "Покращена версія армійського великокаліберного пістолета США до Великої Війни. Цей 10мм пістолет із масивною рамою створений насамперед для зупиняючої сили та механічної надійності. Його проста конструкція дозволяє розібратись навіть ідіоту-новобранцю, а посилений корпус витримає найгірші умови пустки. Ідеальний варіант для виживання після кінця світу."
HAN_ballistic_equipment_2:0 "Вінчестер «Міський Вбивця»"
HAN_ballistic_equipment_2_short:0 "Бойовий дробовик"
HAN_ballistic_equipment_2_desc:0 "12-каліберний бойовий дробовик Winchester City-Killer у конфігурації булпап. Зберігся в чудовому стані й має опціональний захист DesertWarfare від навколишнього середовища для ще більшої надійності."
HAN_ballistic_equipment_3:0 "$ballistic_weaponry_tech_icon_3_p90$"
