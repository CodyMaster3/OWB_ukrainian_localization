SOH_ballistic_fireteam_weaponry_tech_2:0 "Автоматична гвинтівка типу BAR"
SOH_ballistic_fireteam_weaponry_tech_2_short:0 "CZ57 Rockwell Avenger"
SOH_ballistic_fireteam_weaponry_tech_2_desc:0 "Вершина довоєнних кулеметів — CZ57 Avenger. Замість шаленої скорострільності 60 000 пострілів за хвилину ми знизили її до 12 000, щоби зберегти набої. Завдяки охолодженню та хромованому стволу, цей звір може довго вести вогонь. Легендарна підтримка — тепер у наших руках."
SOH_ballistic_fireteam_equipment_3:0 "Кулемет M60E4"
SOH_ballistic_fireteam_equipment_3_short:0 "M60E4"
SOH_ballistic_fireteam_equipment_3_desc:0 "M60E4 — це та сама міць, що виграла В’єтнам, Камчатку та Берлін у ’85, тільки краще. Покращене нарізування й допуски підвищують точність і зменшують кількість затягів. Ідеальна зброя для вогневої підтримки відділення. І виглядає круто, коли стріляєш із бедра."
