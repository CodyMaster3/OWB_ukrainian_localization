# BOO (Boomers)
BOO_power_armour_equipment_3:0 "Силова броня Vault-Tec T-45d"
BOO_power_armour_equipment_3_short:0 "T-45d СБ"
BOO_power_armour_equipment_3_desc:0 "Заснована на армійській моделі T-45d, ця силова броня виготовлялась компанією Vault-Tec і постачалась лише в кілька притулків перед тим, як упали бомби."
BOO_power_armour_equipment_4:0 "Силова броня Vault-Tec T-51b"
BOO_power_armour_equipment_4_short:0 "T-51b СБ"
BOO_power_armour_equipment_4_desc:0 "Модель на базі військової T-51b, яку Vault-Tec так і не встигла випустити у значній кількості. Проте деякі сховища зберегли зашифровані креслення для її виготовлення."

