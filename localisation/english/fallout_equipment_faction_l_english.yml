SUN_melee_equipment_4:0 "Балістичний Кулак"
SUN_melee_equipment_4_short:0 "Балістичний Кулак"
SUN_melee_equipment_4_desc:0 "Балістичний кулак — це мініатюрна рушниця, вмонтована в напульсник, що спрацьовує при ударі завдяки пластині над кісточками пальців. При контакті з ціллю відбувається постріл, який завдає величезної шкоди нещасному супротивнику."
SUN_ballistic_equipment_2:0 "Ковбойський репітер"
SUN_ballistic_equipment_2_short:0 "Ковбойський репітер"
SUN_ballistic_equipment_2_desc:0 "Гвинтівка з трубчастим магазином — проста у виготовленні та надійна. У вмілих руках ковбойський репітер дозволяє вести швидкий і точний вогонь, ідеальний для боїв у стилі дикого заходу."

# ТАЗ (Техаська Асоціація Зброярів)
TAA_ballistic_equipment_1:0 "Приглушений пістолет"
TAA_ballistic_equipment_1_short:0 "Deliverer"
TAA_ballistic_equipment_1_desc:0 "Розроблений для агентів ТАЗ і клієнтів, яким потрібна тиша. Цей компактний пістолет стріляє стандартними 9мм набоями з мінімальним шумом завдяки глушнику й субзвуковим патронам. Ідеальний для шпигунських і таємних операцій."
TAA_ballistic_equipment_2:0 "Службова гвинтівка MK1"
TAA_ballistic_equipment_2_short:0 "Стандартна гвинтівка"
TAA_ballistic_equipment_2_desc:0 "Стара армійська гвинтівка, зібрана з різних складів округу й модифікована для стандартних боєприпасів та зручного обслуговування. Надійна конструкція з дерев’яним оздобленням чудово підходить для суворих умов Пустки — а при потребі годиться і як ударна зброя."
TAA_ballistic_equipment_3:0 "Службова гвинтівка MK2"
TAA_ballistic_equipment_3_short:0 "Покращена гвинтівка"
TAA_ballistic_equipment_3_desc:0 "Модернізована службова гвинтівка адаптована до нових реалій війни в Пустці: полегшений приклад для хаотичних боїв, покращене руків’я для захвату, відкриті приціли для кращої видимості. Чудово пасує до боїв у містах і для партизанських дій."
TAA_ballistic_equipment_4:0 "Службова гвинтівка MK3"
TAA_ballistic_equipment_4_short:0 "Штурмова гвинтівка"
TAA_ballistic_equipment_4_desc:0 "Останнє слово серед піхотної стрілецької зброї. Штурмова версія має укорочений ергономічний приклад із демпфером, оброблену пістолетну рукоятку, подовжений магазин зі зміцненою пружиною та приціл з 1.5× кратним збільшенням. Все заради стабільного вогню й точності на ближній і середній дистанції."

