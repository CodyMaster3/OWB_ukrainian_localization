  # NEW (New Reno)
NEW_energy_equipment_1:0 "Промисловий лазерний різак H&H Tools C-47"
NEW_energy_equipment_1_short:0 "Лазерний різак"
NEW_energy_equipment_1_desc:0 "Один із перших цивільних лазерів — C-47 від H&H Tools — спочатку був дозволений лише для військових підрядників. Звісно, це не зупинило охочих, коли ніхто не дивився. Громіздкий і непридатний для бою, цей дешевий і надійний інструмент став скарбом для тих, кому пощастило знайти його після Великої Війни."
NEW_energy_equipment_3:0 "Лазерна зброя з прискореним зарядом"
NEW_energy_equipment_3_short:0 "Laser RCW"
NEW_energy_equipment_3_desc:0 "Laser RCW використовує барабан із шістьма конденсаторами, розташованими навколо електронного зарядного блоку. Під час стрільби барабан обертається, випускаючи безперервний лазерний промінь, одночасно заряджаючи вже розряджені конденсатори. Завдяки цьому RCW досягає темпу стрільби, недосяжного для одно-конденсаторної зброї."
NEW_payload_glider_equipment_1:0 "Іграшкова ракета Lockreed Aeronautics"
NEW_payload_glider_equipment_1_short:0 "Іграшкова ракета"
NEW_payload_glider_equipment_1_desc:0 "Спочатку поширювані в Неваді як пропагандистські подарунки, ці ракети були випадково замовлені урядом США в Lockreed Aeronautics. Випадковість призвела до створення справжніх — хоч і нестабільних — ракет малої дальності."
NEW_spec_ops_equipment_3:0 "Бойова броня Рейнджера"
NEW_spec_ops_equipment_3_short:0 "Броня Рейнджера"
NEW_spec_ops_equipment_3_desc:0 "Після успіхів НКР із довоєнною бронею для поліції, Нью-Ріно розпломбувало свої власні запаси з часів Харчових Бунтів. Спроба відтворити якість і універсальність славнозвісної броні Пустельних Рейнджерів виявилась посередньою — виробництво хоч і оптимізоване, але залишає бажати кращого."
NEW_spec_ops_equipment_4:0 "Бойова броня Ветерана-Рейнджера"
NEW_spec_ops_equipment_4_short:0 "Броня Ветерана"
NEW_spec_ops_equipment_4_desc:0 "Покращивши наявну броню за допомогою додаткового бронювання та інжектора автостимуляції, ми трохи віддалилися від репутації дешевих підробок рейнджерів. Хоча й не ідеал, але вже не соромно."
NEW_spec_ops_equipment_5:0 "Бойова броня Морпіхів"
NEW_spec_ops_equipment_5_short:0 "Броня Морпіхів"
NEW_spec_ops_equipment_5_desc:0 "Відкинувши ідею копіювання сусідів, ми вирішили переосмислити стару добру броню морпіхів. Поєднавши наше інженерне ноу-хау з потужністю сучасної промисловості, ми створили обладунок, гідний солдата довоєнної доби."

  # SAN (Fallen Creed)
SAN_infantry_equipment_1:0 "Посилений Арбалет"
SAN_infantry_equipment_1_short:0 "Арбалет"
SAN_infantry_equipment_1_desc:0 "Арбалети стали звичною зброєю на Чумних Землях. У роки ізоляції, коли патрони та механізми стали розкішшю, вони стали порятунком — прості у виготовленні, легкі в ремонті. Навіть зараз, коли торгівля повертається, і вогнепальна зброя знову в моді, багато хто не розлучається з арбалетами — за їхню надійність, простоту і як символ витривалості цих суворих країв."

# NIT (Ніітсітапі)
NIT_infantry_equipment_1:0 "Дерев’яний рекурсивний лук"
NIT_infantry_equipment_1_short:0 "Рекурсивний лук"
NIT_infantry_equipment_1_desc:0 "Простий дерев’яний рекурсивний лук. Його смертельність не в самому знарядді, а в майстерності Ніітсітапі. Їхня точність дозволяє вражати цілі далеко за межами досяжності звичайного стрільця, заманюючи ворогів у засідки, з яких уже не вибратись."
NIT_ballistic_equipment_1:0 "Удосконалений рекурсивний лук"
NIT_ballistic_equipment_1_short:0 "Командоський лук"
NIT_ballistic_equipment_1_desc:0 "Коротший композитний рекурсивний лук дозволяє воїнам Ніітсітапі швидше пересуватись і легше маневрувати, зберігаючи при цьому потужність, достатню для пробивання більшості типів броні. Вбивча мобільність — у кожному русі."
NIT_ballistic_equipment_2:0 "Блочний лук"
NIT_ballistic_equipment_2_short:0 "Блочний лук"
NIT_ballistic_equipment_2_desc:0 "Прості шківи, вбудовані в композитний короткий лук, перетворюють його на смертоносну зброю. Вона зберігає в кілька разів більше кінетичної енергії й має спусковий механізм для попереднього натягу тятиви. Це дозволяє стріляти точно, не виснажуючи лучника."
NIT_ballistic_equipment_3:0 "Вибуховий лук"
NIT_ballistic_equipment_3_short:0 "Вибуховий лук"
NIT_ballistic_equipment_3_desc:0 "Удосконалені шківи забезпечують вищу швидкість стріли, а новий дизайн зменшує шанс рикошету при влучанні в броню. Головна особливість — вибуховий наконечник. Завдяки відсутності потреби в пороху, заряд набагато потужніший за звичайну гранату."
NIT_ballistic_equipment_4:0 "Лук з бронебійною бойовою частиною"
NIT_ballistic_equipment_4_short:0 "Бронебійний лук"
NIT_ballistic_equipment_4_desc:0 "Зміцнене основне тіло та мідна оболонка дозволяють вибуховому наконечнику зосередити вибух на одній точці. Комбінація тиші, високої швидкості та бронебійної сили робить цю зброю ефективнішою за вогнепали в засідках — вона здатна пробити навіть силову броню... не кажучи вже про м’які цілі."

# ORC (Орда)
ORC_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_security_baton$"
ORC_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_security_baton_short$"
ORC_melee_equipment_1_desc:0 "$melee_weaponry_tech_icon_1_security_baton_desc$"
ORC_melee_equipment_2:0 "Ніж Боуї"
ORC_melee_equipment_2_short:0 "Ніж Боуї"
ORC_melee_equipment_2_desc:0 "Якими б дрібними не були зубочистки ворога, ножем їх назвати важко — на відміну від цього красеня. Уперше з’явившись на американському фронтирі XIX століття, ніж Боуї має масивне лезо, яке надає йому радіус дії, порівнянний із мечем, зберігаючи маневреність одноручної зброї. Сказати більше нема чого — це еталонний клинок у своєму класі."
ORC_melee_equipment_3:0 "Відновлений армійський Ріппер"
ORC_melee_equipment_3_short:0 "Ріппер"
ORC_melee_equipment_3_desc:0 ""
ORC_melee_equipment_4:0 "Горгорев"
ORC_melee_equipment_4_short:0 "Горгорев"
ORC_melee_equipment_4_desc:0 "Сокира Грома — чи то Ґроммаша... або Ґарроша... — загалом, родини Кривавого Крику. Також випадає в Каражані та в Світанку Нескінченності. Можливо, ще десь."

# KOT (Королівство Терамор)
KOT_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_security_baton$"
KOT_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_security_baton_short$"
KOT_melee_equipment_1_desc:0 "$melee_weaponry_tech_icon_1_security_baton_desc$"
KOT_melee_equipment_2:0 "Ніж Боуї"
KOT_melee_equipment_2_short:0 "Ніж Боуї"
KOT_melee_equipment_2_desc:0 "Якими б дрібними не були зубочистки ворога, ножем їх назвати важко — на відміну від цього красеня. Уперше з’явившись на американському фронтирі XIX століття, ніж Боуї має масивне лезо, яке надає йому радіус дії, порівнянний із мечем, зберігаючи маневреність одноручної зброї. Сказати більше нема чого — це еталонний клинок у своєму класі."
KOT_melee_equipment_3:0 "Відновлений армійський Ріппер"
KOT_melee_equipment_3_short:0 "Ріппер"
KOT_melee_equipment_3_desc:0 ""
KOT_melee_equipment_4:0 "Прахоніс"
KOT_melee_equipment_4_short:0 "Прахоніс"
KOT_melee_equipment_4_desc:0 "Улюблена зброя кожного паладина-карателя. А ще — предмет нескінченних косплеїв на Moon Guard-US.\n\nЯ БАЧУ ТЕБЕ! Я ЗНАЮ, ХТО ТИ ТАКИЙ!"

# PER (Персуант)
PER_ballistic_equipment_2:0 "Мисливська рушниця"
PER_ballistic_equipment_2_short:0 "Помповик"
PER_ballistic_equipment_2_desc:0 "Заряджена й готова до всього, що зможе накинути пустка — мисливська рушниця калібру 12 створена для більшої зупинної сили й щільнішого влучання дробу на середніх дистанціях. Її помповий механізм дозволяє використовувати спеціальні набої, роблячи цю рушницю універсальною — від полювання до викидання супротивника в іншу кімнату."

# RES (Резервація)
RES_energy_equipment_2: "Лазерний пістолет «Аполлон»"
RES_energy_equipment_2_short: "Пістолет «Аполлон»"
RES_energy_equipment_2_desc: "Експериментальний лазерний пістолет APOLLO розроблявся компанією Poseidon Energy ще до Великої війни. Попри те, що війна зупинила проєкт, нащадки втілили задум у життя. Його компактний, елегантний дизайн дозволяє легко приховати зброю, а модернізація дає численні переваги перед стандартними лазерними пістолетами."
RES_energy_equipment_3: "Лазерна гвинтівка «Аполлон»"
RES_energy_equipment_3_short: "Гвинтівка «Аполлон»"
RES_energy_equipment_3_desc: "Хоча після війни лишились лише уривки креслень, цей зразок продовжує проєкт APOLLO — створення потужної лазерної гвинтівки, здатної змагатися з іншими системами. Завдяки використанню технології APOLLO, вона вражає потужністю, що перевершує всі стандартні лазерні гвинтівки на ринку."
  RES_heavy_infantry_equipment_1:0 "$heavy_infantry_tech_icon_1_collar$"
  RES_heavy_infantry_equipment_1_short:0 "$heavy_infantry_tech_icon_1_collar_short$"
  RES_heavy_infantry_equipment_1_desc:0 "$heavy_infantry_tech_icon_1_collar_desc$"

# ROB (Місто Роботів)
ROB_robot_scurry_tech:0 "Робо-скорпіон"
ROB_robot_scurry_tech_short:0 "Робо-скорпіон"
ROB_robot_scurry_tech_desc:0 "Перший робо-скорпіон був створений ще до Великої війни доктором Мобіусом і його командою у військовому комплексі X-42 на Великій Горі. Він базувався на скорпіонах і працював на ядерній батареї. Створені для охорони Центру досліджень і розробок Великої Гори, ці роботи мали бластер енергетичних зарядів, вмонтований у хвіст, оптичні системи, що дозволяли оператору бачити крізь них на моніторах, а також функцію самознищення, яка активується при критичному збої систем."
ROB_support_robot_scurry_equipment:0 "Робо-скорпіон"
ROB_support_robot_scurry_equipment_short:0 "Робо-скорпіон"
ROB_support_robot_scurry_equipment_desc:0 "Перший робо-скорпіон був створений ще до Великої війни доктором Мобіусом і його командою у військовому комплексі X-42 на Великій Горі. Він базувався на скорпіонах і працював на ядерній батареї. Створені для охорони Центру досліджень і розробок Великої Гори, ці роботи мали бластер енергетичних зарядів, вмонтований у хвіст, оптичні системи, що дозволяли оператору бачити крізь них на моніторах, а також функцію самознищення, яка активується при критичному збої систем."

# ROS (Єллоустоун / Республіка Пару)
ROS_energy_equipment_1:0 "$energy_weaponry_tech_icon_1_compliance_regulator$"
ROS_energy_equipment_1_short:0 "$energy_weaponry_tech_icon_1_compliance_regulator_short$"
ROS_energy_equipment_1_desc:0 "$energy_weaponry_tech_icon_1_compliance_regulator_desc$"
ROS_energy_equipment_2:0 "Лазерний пістолет «Аполлон»"
ROS_energy_equipment_2_short:0 "Пістолет «Аполлон»"
ROS_energy_equipment_2_desc:0 "Експериментальний лазерний пістолет APOLLO розроблявся компанією Poseidon Energy ще до Великої війни. Війна перервала проєкт, але наступні покоління довели справу до кінця. Компактний і витончений, цей пістолет легко сховати, і він має чимало переваг над стандартними зразками."
ROS_energy_equipment_3:0 "Лазерна гвинтівка «Аполлон»"
ROS_energy_equipment_3_short:0 "Гвинтівка «Аполлон»"
ROS_energy_equipment_3_desc:0 "Попри те, що збереглися лише уривки креслень, ця гвинтівка є продовженням проєкту APOLLO від Poseidon Energy — потужна, конкурентоспроможна лазерна гвинтівка. Завдяки системі APOLLO вона б’є сильніше за будь-яку стандартну лазерну гвинтівку на ринку."
ROS_energy_equipment_4:0 "Вбиватор"
ROS_energy_equipment_4_short:0 "VT-191"
ROS_energy_equipment_4_desc:0 "VT-191 «Вбиватор» — експериментальний мезонний нейтралізатор, розроблений Poseidon Energy. Попри зовнішню схожість із лазерною зброєю, стріляє мезонами — частинками з масою, які рухаються майже на швидкості світла й швидко розпадаються. Ця зброя однаково небезпечна для органіки та техніки, а для її повного потенціалу потрібні енергоблоки Poseidon."
ROS_melee_equipment_1:0 "Оброблена сокирка"
ROS_melee_equipment_1_short:0 "Сокирка"
ROS_melee_equipment_1_desc:0 "Компактна, легка й універсальна сокира. Утім, це не довоєнний зразок. Вона адаптована для бою: ручка з покриттям для надійного хвату, гостре лезо для м’яких цілей і шип на звороті — для пробивання металевої броні."
ROS_melee_equipment_2:0 "Пожежна сокира"
ROS_melee_equipment_2_short:0 "Сокира"
ROS_melee_equipment_2_desc:0 "Зазвичай слугує для зламу дверей під час надзвичайних ситуацій, але в руках бійця — це зброя масового калічення. Обтяжене лезо дозволяє пробивати броню або ж відтинати кінцівки одним замахом."
ROS_melee_equipment_3:0 "Цепна пила на термоядерному паливі"
ROS_melee_equipment_3_short:0 "Цепна пила"
ROS_melee_equipment_3_desc:0 "Модифікований довоєнний інструмент, що перетворений на грізну зброю ближнього бою. Сплавовий корпус і адаптований ядерний двигун, що працює від конденсаторів військового стандарту, забезпечують мобільність, а карбідно-сплавні зубці — здатність розпиляти навіть силову броню."
ROS_spec_ops_equipment_3:0 "$spec_ops_equipment_tech_icon_3_ncr$"
ROS_spec_ops_equipment_3_short:0 "$spec_ops_equipment_tech_icon_3_ncr_short$"
ROS_spec_ops_equipment_3_desc:0 "$spec_ops_equipment_tech_icon_3_ncr_desc$"
ROS_spec_ops_equipment_4:0 "Бойова броня Рейнджера"
ROS_spec_ops_equipment_4_short:0 "Броня Рейнджера"
ROS_spec_ops_equipment_4_desc:0 "Фірмова чорна броня Рейнджерів — це їхній класичний тренч, поєднаний із довоєнною бронею для придушення заворушень."
ROS_spec_ops_equipment_5:0 "Бойова броня Ветерана-Рейнджера"
ROS_spec_ops_equipment_5_short:0 "Броня Ветерана"
ROS_spec_ops_equipment_5_desc:0 "Фірмова чорна броня Рейнджерів — це їхній класичний тренч, поєднаний із вдосконаленою довоєнною бронею для поліції."
ROS_anti_tank_equipment_2:0 "Гвинтівка «Аполлон» з максимальним зарядом"
ROS_anti_tank_equipment_2_short:0 "Макс-заряд «Аполлон»"
ROS_anti_tank_equipment_2_desc:0 "Замість вибухівки та хаосу, Рейнджери зробили ставку на потужні енергетичні зразки з гігантськими конденсаторами, що дозволяють здійснювати точні надпотужні постріли. Недолік — мала ємність магазину і низька скорострільність."
ROS_anti_tank_equipment_3:0 "Вбиватор з максимальним зарядом"
ROS_anti_tank_equipment_3_short:0 "Макс-заряд Вбиватор"
ROS_anti_tank_equipment_3_desc:0 "Замість вибухівки та хаосу, Рейнджери зробили ставку на потужні енергетичні зразки з гігантськими конденсаторами, що дозволяють здійснювати точні надпотужні постріли. Недолік — мала ємність магазину і низька скорострільність."
ROS_energy_fireteam_equipment_3:0 "Sprtel-Wood 9700"
ROS_energy_fireteam_equipment_3_short:0 "Sprtel-Wood 9700"
ROS_energy_fireteam_equipment_3_desc:0 "Sprtel-Wood 9700 — найкращий гатлінг-лазер довоєнної епохи. Доступний тільки військовим, що могли дозволити собі трішки «додаткової вогневої міці» і не скупилися на якість."
ROS_flamer_demolitions_equipment_4:0 "Сонячна гармата"
ROS_flamer_demolitions_equipment_4_short:0 "Сонячна гармата"
ROS_flamer_demolitions_equipment_4_desc:0 "Уперше спроєктована й виготовлена ще до Великої війни як засіб контролю натовпу, Сонячна гармата ніколи не дійшла до масового виробництва. Втім, нею користувалися окремі підрозділи Анклаву, а тепер — і ми."
ROS_light_motorized_equipment_2:0 "Мотоцикл Пустки"
ROS_light_motorized_equipment_2_short:0 "Мотоцикл Пустки"
ROS_light_motorized_equipment_2_desc:0 "Просто зібрати до купи старі мотоцикли — замало. Наші механізовані частини хочуть щось краще, якщо вже не автомобілі. Нові конструкції виготовлено з кращих сплавів із кузень Гефеста, з тихохідними ядерно-електричними двигунами. Є навіть бокові причепи для кулеметника чи пса, а також вантажні візки для сапорт-команд."
ROS_light_motorized_equipment_3:0 "Передовий мотоцикл"
ROS_light_motorized_equipment_3_short:0 "Передовий мотоцикл"
ROS_light_motorized_equipment_3_desc:0 "Поєднання парових ядер та гравітаційних пластин, здобутих у Макартура й з систем Poseidon, дозволило нам створити справжні ховер-байки. Вони маневреніші за будь-яку піхоту й ухиляються від зброї, що призначена для більших, повільніших цілей. Наші причепи теж оновлено — навіть із функцією повернення за координатами."
ROS_power_armor_equipment_5:0 "Силова броня «Атена»"
ROS_power_armor_equipment_5_short:0 "Броня «Атена»"
ROS_power_armor_equipment_5_desc:0 "Розроблена як вершина довоєнного бронювання в спільному проєкті Poseidon Energy та, на жаль, Анклаву. Силова броня «Атена» зберігає характерний силует, не поступаючись у захисті. Наші вчені вдосконалили її конструкцію — тепер вона захистить Рейнджера будь-де в пустках."


  # RRG (Republic of Rio Grande)
  RRG_ballistic_equipment_2:0 "$ballistic_weaponry_tech_icon_2_paciencia$"
  RRG_ballistic_equipment_2_short:0 "$ballistic_weaponry_tech_icon_2_paciencia_short$"
  RRG_ballistic_equipment_2_desc:0 "$ballistic_weaponry_tech_icon_2_paciencia_desc$"

# SCO (Укус Скорпіона)
SCO_burrowing_beast_equipment_1:0 "Радскорпіони"
SCO_burrowing_beast_equipment_1_short:0 "Радскорпіони"
SCO_burrowing_beast_equipment_1_desc:0 "Радскорпіони — здоровенні злісні потвори, що полюбляють зариватися в землю. Більшість племен їх бояться й знищують, але «Укус Скорпіона» здобув своє ім’я завдяки вивченню цих істот, освоєнню їхніх звичок і, зрештою, прирученню."
SCO_burrowing_beast_equipment_2:0 "Мисливець-радскорпіон"
SCO_burrowing_beast_equipment_2_short:0 "Мисливець"
SCO_burrowing_beast_equipment_2_desc:0 "Мисливці — це великі й міцні радскорпіони, які виходять у Пустку самі, щоб вистежувати й убивати велику здобич. Вони хитрі й слизькі, непросто їх загнати, але ми зуміємо прив’язати їх до наших воїнів і повести з собою на війну!"
SCO_burrowing_beast_equipment_glowing:0 "Світні радскорпіони"
SCO_burrowing_beast_equipment_glowing_short:0 "Світні скорпи"
SCO_burrowing_beast_equipment_glowing_desc:0 "Світні мутовані радскорпіони — результат того, що ми годували їх речами з «Д-складу». Вони витриваліші за мисливців. Одного разу я бачив, як такий їв когось із кігтів смерті!"
SCO_burrowing_beast_equipment_brood:0 "Матері радскорпіони"
SCO_burrowing_beast_equipment_brood_short:0 "Матері скорпи"
SCO_burrowing_beast_equipment_brood_desc:0 "Скорпіони-мамки, що йдуть у бій зі своїм виводком на спині. Хіба не милота? Малеча хоч і мала, але все одно щипає боляче й кидається гуртом на все, що підходить близько. А мамка добряче розлючується, якщо хтось до них доторкнеться."
SCO_ballistic_equipment_1:0 "Дротикомети"
SCO_ballistic_equipment_1_short:0 "Дротикомети"
SCO_ballistic_equipment_1_desc:0 "Зібрані з мотлоху, добре зроблені дротикомети тихі й точні. Хоча металеві дротики пробивають шкіру й шкіряні обладунки, самі по собі вони не страшні. Але отрута радскорпіонів, що зберігається в консервній банці й наноситься при пострілі, паралізує будь-кого, кому не пощастить отримати навіть подряпину."
SCO_ballistic_equipment_2:0 "Шприцетрон"
SCO_ballistic_equipment_2_short:0 "Шприцетрон"
SCO_ballistic_equipment_2_desc:0 "Завдяки стислому повітрю шприцетрони мають достатню силу, щоби стріляти не просто дротиками з отрутою, а повноцінними шприцами з хімікатами. Зібрані вручну з медичних залишків, вони можуть вміщувати будь-які рідини — від отрут до коктейлів, що звалять з ніг навіть найсильніших."

# SHA (Армія Шейла)
SHA_ballistic_equipment_1:0 "Desert Eagle"
SHA_ballistic_equipment_1_short:0 "D-Eagle"
SHA_ballistic_equipment_1_desc:0 "Desert Eagle — зброя надмірна й не надто зручна, але для мутантів — ідеальна. Величезний калібр і потужна віддача добре пасують їхній натурі: прості, але гучні аргументи."
SHA_ballistic_equipment_2:0 "Мисливська рушниця"
SHA_ballistic_equipment_2_short:0 "Мисливська рушниця"
SHA_ballistic_equipment_2_desc:0 "Проста рушниця з ковзним затвором — чудовий інструмент для виживання в Пустці. Простота конструкції робить її надійною, а великий калібр дозволяє вполювати майже все, що рухається."
SHA_ballistic_equipment_3:0 "MP5K"
SHA_ballistic_equipment_3_short:0 "MP5K"
SHA_ballistic_equipment_3_desc:0 "Скорочений пістолет-кулемет MP5K (K — скорочено від нім. Kurz, тобто «короткий») створений для боїв у тісних просторах — ідеальний для спецоперацій і таємних завдань."
SHA_ballistic_equipment_4:0 "$ballistic_weaponry_tech_icon_4_marksman_carbine$"
SHA_ballistic_equipment_4_short:0 "$ballistic_weaponry_tech_icon_4_marksman_carbine_short$"
SHA_ballistic_equipment_4_desc:0 "$ballistic_weaponry_tech_icon_4_marksman_carbine_desc$"

# SHI (Ші)
SHI_melee_equipment_3:0 "Офіцерський меч"
SHI_melee_equipment_3_short:0 "Офіцерський меч"
SHI_melee_equipment_3_desc:0 "Меч ручної роботи, створений за традиційними зразками з батьківщини."
SHI_ballistic_equipment_1:0 "Шаньсі Тип 17"
SHI_ballistic_equipment_1_short:0 "Пістолет Тип 17"
SHI_ballistic_equipment_1_desc:0 "Тип 17 Шаньсі — масово вироблювана до Великої війни бічна зброя. Уперше випущений у 1929 на арсеналі Тайюаня для армії Янь Сішаня, нині цей пістолет — рідкісний експонат війни між США та Китаєм."
SHI_ballistic_equipment_2:0 "Саморобний автомат"
SHI_ballistic_equipment_2_short:0 "Саморобний автомат"
SHI_ballistic_equipment_2_desc:0 "Простий зразок, створений на базі Типу 93. Дешевий, примітивний, але легкий у виробництві та ремонті. Старші родини Ші часто обирають його не через ефективність, а через традицію та спогади."
SHI_ballistic_equipment_3:0 "Китайський автомат Тип 93"
SHI_ballistic_equipment_3_short:0 "Китайський автомат"
SHI_ballistic_equipment_3_desc:0 "Тип 93 створений китайською корпорацією для Народно-визвольної армії під час Ресурсних війн. Розрахований на диверсантів і шпигунів, має магазин на 24 набої калібру 5.56 мм — дешевий і розповсюджений боєприпас."
SHI_spec_ops_equipment_4:0 "Стелс-броня Хей Ґуй"
SHI_spec_ops_equipment_4_short:0 "Стелс-броня"
SHI_spec_ops_equipment_4_desc:0 "Китайська стелс-броня, яку застосовували під час вторгнення на Аляску. Призначалась для боротьби з американськими солдатами в силовій броні. До Великої війни її використовували елітні загони «Червоних драконів» і контртерористичні частини. Сьогодні технологію зберегли Ши для стеження за ворогами."
SHI_spec_ops_equipment_5:0 "Посилена броня Fùchóu Jīngshén"
SHI_spec_ops_equipment_5_short:0 "Посилена стелс-броня"
SHI_spec_ops_equipment_5_desc:0 "Еволюція попередньої моделі: броня Fùchóu Jīngshén оснащена композитним нагрудником і легким шоломом із сплавів. Для підтримки поля невидимості додано потужний зовнішній акумулятор, що збільшує час і стабільність маскування в бою."
SHI_explosive_demolitions_equipment_3:0 "Гвинтівка-гранатомет «Червона Перемога»"
SHI_explosive_demolitions_equipment_3_short:0 "Гвинтівка-гранатомет"
SHI_explosive_demolitions_equipment_3_desc:0 "Прототип, доведений до серійного виробництва. Захоплена американська зброя модифікована для китайських військ: полегшене ложе з металу, і можливість стріляти потужними 40-мм гранатами подвійного призначення. Створена для боротьби з силовою бронею — і досі ефективна проти будь-кого."
SHI_power_armor_equipment_tbh:0 "Китайська силова броня"
SHI_power_armor_equipment_tbh_short:0 "Китайська СБ"
SHI_power_armor_equipment_tbh_desc:0 "Спроба Китаю повторити американські прориви в галузі силової броні. Хоч і поступалась західним аналогам, броня все ще конкурентоспроможна — навіть у світі після війни."

# SIN (Картель Сіналоа)
SIN_ballistic_equipment_1:0 "Кастомний пістолет M&A 9мм"
SIN_ballistic_equipment_1_short:0 "9мм Кастом"
SIN_ballistic_equipment_1_desc:0 "Індивідуально зроблений пістолет M&A 9мм від M&A Guns Manufacturers. Перламутрова рукоятка прикрашена зображенням Діви Ґваделупської — відомої католицької фігури та символу Апокаліптичної Жінки з Біблії. Корпус пістолета інкрустований орнаментом з плюща та квітів, покритий нікелем і доповнений золотим спусковим гачком."

# SKY (Повітряні Рейдери)
SKY_ballistic_equipment_1:0 "Пістолет-кулемет Rinkhal"
SKY_ballistic_equipment_1_short:0 "Rinkhal"
SKY_ballistic_equipment_1_desc:0 "Спершу цей компактний карабін напівавтоматичного типу створили для самооборони, але його модифікували під 9мм пістолетні набої та режим автоматичного вогню. Завдяки короткому стволу, телескопічному затвору й прямій вертикальній рукоятці він швидко став улюбленцем ССО та авіаційних команд. Повітряні Рейдери із задоволенням скористались залишками цього зразка."
SKY_ballistic_equipment_2:0 "UBD-12"
SKY_ballistic_equipment_2_short:0 "UBD-12"
SKY_ballistic_equipment_2_desc:0 "Просунута модель пістолета-кулемета: важча, але все ще легка у носінні. Камора під потужний патрон .45 ACP («манстопер»), знижене положення прикладу для кращої прицільності й комфорту. Варіант з пластиковим ложем став популярним серед колекціонерів та тиловиків."
SKY_ballistic_equipment_3:0 "Карабін M&A-36"
SKY_ballistic_equipment_3_short:0 "M&A-36"
SKY_ballistic_equipment_3_desc:0 "Просунутий конкурент для повсюдного R91, карабін M&A-36 — укорочений варіант платформи, розроблений для повернення на ринок звичайної вогнепальної зброї. Через нестачу енергії та ресурсну кризу компанія M&A вирішила дати нове життя своїй надійній гвинтівці під 5.56мм. Хоч війна перервала цей план, багато сховищ зі зброєю все ще чекають свого часу."
SKY_ballistic_equipment_4:0 "FFR Mark 1"
SKY_ballistic_equipment_4_short:0 "Дракон"
SKY_ballistic_equipment_4_desc:0 "Одна з найпросунутіших довоєнних гвинтівок: Fibreglass Flechette Rifle — гвинтівка зі склопластику, що стріляє стрілами калібру 4.6×45мм. Створена як потенційна заміна AER9 для армії США, вона легка, надійна й не містить складних внутрішніх механізмів. Партію відправили на випробування в Зону 51, де її й знайшли Повітряні Рейдери."
SKY_ballistic_fireteam_equipment_2:0 "ABR6-E4 SAW"
SKY_ballistic_fireteam_equipment_2_short:0 "ABR6"
SKY_ballistic_fireteam_equipment_2_desc:0 "Останній варіант перевіреного часом ручного кулемета: полегшена версія для використання 5.56-мм набоїв. Надійність на полі бою, швидка заміна ствола й висока скорострільність роблять його улюбленою зброєю в Пустці, особливо після того, як нові екземпляри почали знаходити на покинутих авіабазах."

  # SLE (Sleepers)
SLE_energy_equipment_2:0 "Лазерний пістолет «Аполлон»"
SLE_energy_equipment_2_short:0 "Пістолет «Аполлон»"
SLE_energy_equipment_2_desc:0 "Експериментальний лазерний пістолет APOLLO розроблявся Poseidon Energy до Великої війни. Хоча роботи так і не завершилися, наступні покоління втілили проєкт. Компактний, стильний і з покращеннями над стандартними зразками — чудовий вибір для Сплячих."
SLE_energy_equipment_3:0 "Лазерна гвинтівка «Аполлон»"
SLE_energy_equipment_3_short:0 "Гвинтівка «Аполлон»"
SLE_energy_equipment_3_desc:0 "Проєкт був розширенням програми APOLLO: створити більш потужну, конкурентну лазерну гвинтівку. Попри те, що креслень лишилось обмаль, технологія ожила й показала себе краще за будь-яку лазерну гвинтівку на ринку."
SLE_energy_equipment_4:0 "Вбиватор"
SLE_energy_equipment_4_short:0 "VT-191"
SLE_energy_equipment_4_desc:0 "VT-191 «Вбиватор» — експериментальний мезонний нейтралізатор, що просто... вбиває. Блискавично, ефектно, надійно. Та й дизайн у нього крутий. Класичний Вбиватор!"


# SOH (Мечі Геймана)
SOH_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_crowbar$"
SOH_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_crowbar_short$"
