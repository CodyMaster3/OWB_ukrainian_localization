VSH_ballistic_equipment_2:0 "Тактична рушниця Winchester City-Killer"
VSH_ballistic_equipment_2_short:0 "Тактична рушниця"
VSH_ballistic_equipment_2_desc:0 "Тактична рушниця Winchester City-Killer 12 калібру у булпап-варіанті. Відмінно збереглась, має опціональне покриття DesertWarfare для підвищеної надійності в екстремальних умовах."
