# WHD (Зів’ялі Пси)
WHD_infantry_equipment_1:0 "Цвяхостріл H&H Tools"
WHD_infantry_equipment_1_short:0 "Цвяхостріл"
WHD_infantry_equipment_1_desc:0 "Простий інструмент, перероблений для ближнього бою. Зазвичай використовувався для будівництва, але тепер — як зброя. Посилення електромагніту дозволяє запускати цвяхи на велику відстань із підвищеною силою. Це не пістолет, але коли вибору немає — чудовий варіант."
WHD_melee_equipment_3:0 "Офіцерський меч"
WHD_melee_equipment_3_short:0 "Офіцерський меч"
WHD_melee_equipment_3_desc:0 "Меч ручної роботи, створений за зразками зі старої батьківщини."
WHD_ballistic_equipment_1:0 "Shanxi Type 17"
WHD_ballistic_equipment_1_short:0 "Пістолет Type 17"
WHD_ballistic_equipment_1_desc:0 "Масово вироблений перед Великою Війною, пістолет Shanxi Type 17 з’явився ще в 1929 році, випущений Арсеналом Тайюаня для війська Яна Сішаня. Сьогодні — це релікт Сіно-Американської війни."
WHD_ballistic_equipment_2:0 "Саморобна штурмова гвинтівка"
WHD_ballistic_equipment_2_short:0 "Саморобна штурмова"
WHD_ballistic_equipment_2_desc:0 "Проста версія на основі Type 93. Хоч і поступається в якості, зате легко виготовляється й ремонтується. Старомодна, але цілком придатна до виробництва з обмежених ресурсів у Псопустелі. Проста, але смертоносна."
WHD_ballistic_equipment_3:0 "Китайська штурмова гвинтівка Type 93"
WHD_ballistic_equipment_3_short:0 "Китайська штурмова"
WHD_ballistic_equipment_3_desc:0 "Гвинтівка Type 93 була створена китайським концерном для Народно-Визвольної Армії під час Ресурсних Війн. Призначалась для диверсантів і агентів впливу в США. Використовує набої 5.56 мм, має 24-зарядний магазин."
WHD_spec_ops_equipment_4:0 "Стелс-броя Хей Ґуй"
WHD_spec_ops_equipment_4_short:0 "Стелс-броя"
WHD_spec_ops_equipment_4_desc:0 "Китайська стелс-броня, що застосовувалась під час вторгнення в Аляску. Призначалась для ССО та антидиверсійних підрозділів. Сьогодні її використовують уцілілі китайські сили для таємного спостереження за ворогами."
WHD_spec_ops_equipment_5:0 "Броня Фучоу Цзіншен"
WHD_spec_ops_equipment_5_short:0 "Посилена стелс-броня"
WHD_spec_ops_equipment_5_desc:0 "Природне продовження легкої стелс-броні. Новий бронепластиновий нагрудник, легкий сплавний шолом і зовнішнє джерело живлення на спині збільшують час роботи та стабільність стелс-поля в бою."
WHD_explosive_demolitions_equipment_3:0 "Гранатомет Червоної Перемоги"
WHD_explosive_demolitions_equipment_3_short:0 "Гранатомет"
WHD_explosive_demolitions_equipment_3_desc:0 "Прототип, перероблений у серійну зброю. Захоплена американська модель, адаптована для КНР — полегшений корпус, здатність стріляти 40мм осколковими боєприпасами. Створена для боротьби з силовою бронею, але не менш ефективна і проти м’яких цілей."
WHD_power_armor_equipment_tbh:0 "Китайська силова броня"
WHD_power_armor_equipment_tbh_short:0 "Китайська СБ"
WHD_power_armor_equipment_tbh_desc:0 "Спроба Китаю відтворити досягнення США в галузі силової піхотної броні. Розроблена, щоб залишатися конкурентною навіть після Апокаліпсису."
WHD_ces_two_tech:0 "Технікали"
WHD_ces_two_tech_desc:0 "Модифікація старих авто з установкою озброєння — класична тактика партизан до кінця світу, яку Зів’ялий Пес знав добре. Навіть наші гулі змогли перетворити транспорт на мобільні укриття та платформу для стрімких атак."
WHD_armored_chariots_tech:0 "Рухомі бункери"
WHD_armored_chariots_tech_desc:0 "Танки вже самі по собі грізна сила, але в пустці дуже мало хто здатен пробити нашу броню. Ще трохи вдосконалень — і ми станемо по-справжньому незупинними!"

# WHT (Білоногі)
WHT_melee_equipment_1:0 "$melee_weaponry_tech_icon_1_machete$"
WHT_melee_equipment_1_short:0 "$melee_weaponry_tech_icon_1_machete_short$"
WHT_melee_equipment_1_desc:0 "$melee_weaponry_tech_icon_1_machete_desc$"
WHT_melee_equipment_2:0 "Рукавиця Яо-Ґая"
WHT_melee_equipment_2_short:0 "Рукавиця Яо-Ґая"
WHT_melee_equipment_2_desc:0 "Хоча спочатку ця зброя була створена племенем Скорботних, рукавиця Яо-Ґая показала себе надзвичайно потужною та лякаючою в руках наших воїнів."
WHT_melee_equipment_3:0 "Арматурна дубина"
WHT_melee_equipment_3_short:0 "Арматурна дубина"
WHT_melee_equipment_3_desc:0 "Тупий інструмент війни, здатний розчавити череп одним махом."
WHT_ballistic_equipment_1:0 "$ballistic_weaponry_tech_icon_1_9mm_smg$"
WHT_ballistic_equipment_1_short:0 "$ballistic_weaponry_tech_icon_1_9mm_smg_short$"
WHT_ballistic_equipment_1_desc:0 "$ballistic_weaponry_tech_icon_1_9mm_smg_desc$"
WHT_ballistic_equipment_2:0 "Грозовий Барабан"
WHT_ballistic_equipment_2_short:0 "Грозовий Барабан"
WHT_ballistic_equipment_2_desc:0 "Наші воїни б'ють як блискавка, а звук пострілів із Грозових Барабанів сіє жах серед ворогів, яким не пощастило його почути."

# YKZ (Якудза)
YKZ_heavy_infantry_equipment_2:0 "Самурайська броня"
YKZ_heavy_infantry_equipment_2_short:0 "Самурайська броня"
YKZ_heavy_infantry_equipment_2_desc:0 "У феодальній Японії самураї виконували багато функцій — від упокорення селян до управління землями. Їхній вигляд викликав повагу і страх. Хоч Якудза не була вірною традиціям Бусідо, дещо вдалося зберегти. Відтворивши броню минулого, ми спробуємо змусити пустку знову відчути той самий страх і шану..."
YKZ_melee_equipment_3:0 "Катана"
YKZ_melee_equipment_3_short:0 "Катана"
YKZ_melee_equipment_3_desc:0 "Катана — японський меч із вигнутим, однолезовим клинком довжиною 60–73 см, круглою або квадратною гардою та довгою рукояттю для обох рук. Відомий як «меч самурая», цей символ воїнської касти нині знову готовий проливати кров."
YKZ_ballistic_equipment_1:0 "Пістолет-кулемет Тип 100"
YKZ_ballistic_equipment_1_short:0 "Тип 100"
YKZ_ballistic_equipment_1_desc:0 "Тип 100 — цінний колекційний екземпляр і ще цінніша бойова зброя. Успадкований від Японії Другої Світової, цей надійний і точний ПП чудово підходить для ближнього бою. Камора на 9мм, можливість встановлення штику — ідеальний вибір для вуличних війн Якудзи."

# OST (Орден)
OST_energy_equipment_1:0 "Лазерний пістолет AER12"
OST_energy_equipment_1_short:0 "Пістолет AER12"
OST_energy_equipment_1_desc:0 "Зброя, знайдена в арсеналах Ордена, ніколи не відходить далеко від його солдат. До Війни її видавали десантникам морської піхоти або спецпризначенцям. Деякі екземпляри потрапили й до Вартових у Зоні Карантину. Тепер це — частина спадку, що лишилася після R.I.I.D."
OST_energy_equipment_2:0 "Лазерна гвинтівка AER13"
OST_energy_equipment_2_short:0 "Гвинтівка AER13"
OST_energy_equipment_2_desc:0 "Покращена, рідкісна модель, що так і не встигла потрапити на озброєння під час Сіно-Американської війни. Випробувалась на базі Ґрум-Лейк, але зусиллями директора Форсайта частина потрапила в R.I.I.D. Деякі з них досі мають бойові позначки, вирізані на корпусі."
OST_energy_equipment_3:0 "Прототип лазерної гвинтівки AEX1"
OST_energy_equipment_3_short:0 "Гвинтівка AEX1"
OST_energy_equipment_3_desc:0 "Створена Кураторами з уламків AER-12, біосканерів та металобрухту, ця гвинтівка стала святим знаряддям для Саніфікаторів. Має два режими стрільби й готова нести вогняну очистку всім, хто чинить опір."
OST_energy_equipment_4:0 "Лазерна гвинтівка AEX2"
OST_energy_equipment_4_short:0 "Гвинтівка AEX2"
OST_energy_equipment_4_desc:0 "Ця зброя таємно розроблялась шість років обраними Кураторами. Починалась як аналог гранатомета, але еволюціонувала в AEX2 — із вбудованим сканером Блакитної Виразки. Лише кілька таких одиниць існують, і це справжня зброя очищення."
OST_power_armor_equipment:0 "Поліцейська силова броня"
OST_power_armor_equipment_short:0 "Поліцейська СБ"
OST_power_armor_equipment_desc:0 "До Війни поліція США використовувала силову броню для найнебезпечніших завдань. Моделі, розраховані на HAZMAT, з герметичним захистом від радіації. Тепер, коли Зараза насувається, настав час втілити старі креслення в реальність."
OST_melee_equipment_1:0 "Поліцейська кийок"
OST_melee_equipment_1_short:0 "Кийок"
OST_melee_equipment_1_desc:0 "Омаха до війни трималась на поліції, не військових. Їхні арсенали давно розграбовані, але старі добрі кийки досі з нами. І зараз, як колись, їхнє призначення — наводити порядок."
OST_melee_equipment_2:0 "Бойовий ніж"
OST_melee_equipment_2_short:0 "Бойовий ніж"
OST_melee_equipment_2_desc:0 "Класичний бойовий ніж: шкіряне руків’я, сталевий клинок, зубчаста кромка. Призначений для того, щоб рвати плоть і різати заражених. Прості речі не потребують змін."
OST_melee_equipment_3:0 "Ріппер"
OST_melee_equipment_3_short:0 "Ріппер"
OST_melee_equipment_3_desc:0 "Зубчастий ланцюг, що обертається на високій швидкості — це Ріппер. Зброя ближнього бою й інструмент. Ріже плоть, залізо, бетон. Ідеальний для міських боїв проти Орди Безликих."
OST_melee_equipment_4:0 "Плазморіз"
OST_melee_equipment_4_short:0 "Плазморіз"
OST_melee_equipment_4_desc:0 "Колись плазморіз був інструментом. Тепер — це зброя. Новий варіант менш стабільний, але легше виготовляється. Його вистачить, щоб розрізати броню супермутанта, наче папір."
OST_heavy_infantry_equipment_1:0 "Стандартна форма Ордена"
OST_heavy_infantry_equipment_1_short:0 "Поліцейська форма"
OST_heavy_infantry_equipment_1_desc:0 "Форма, натхненна довоєнною поліцейською уніформою. Простий, масово вироблений варіант, що дозволяє бійцю бути мобільним, водночас викликаючи асоціацію з авторитетом і порядком."
OST_heavy_infantry_equipment_2:0 "Броня для заворушень Ордена"
OST_heavy_infantry_equipment_2_short:0 "Броня для заворушень"
OST_heavy_infantry_equipment_2_desc:0 "Спеціальна версія легендарної броні морпіхів США. Хоч вона й поступається армійським зразкам, її захист від хімікатів і корозії робить її ідеальною для Пустки. Тепер її знову виготовляють масово для Кураторів."
OST_demolitions_equipment_1:0 "Коктейлі Молотова"
OST_demolitions_equipment_1_short:0 "Молотови"
OST_demolitions_equipment_1_desc:0 "Коли немає нічого, крім пляшки з-під Нука-Коли, ганчірки та пального — у хід іде коктейль Молотова. Проста, але ефективна зброя, що обпікає Заражених у священному вогні Ордена."

### МУТАНТИ
# SHA (Армія Шейла)
SHA_dogs_equipment_1:0 "Флоутер"
SHA_dogs_equipment_1_short:0 "Флоутер"
SHA_dogs_equipment_1_desc:0 "Флоутери вселяють страх одним своїм виглядом, але для супермутантів це лише вірні домашні улюбленці та напарники."
SHA_dogs_equipment_2:0 "Кентавр"
SHA_dogs_equipment_2_short:0 "Кентавр"
SHA_dogs_equipment_2_desc:0 "Кентавр — створіння, що для одних є чистим жахом, а для інших — просто ще один інструмент. Їх створюють, занурюючи кількох тварин і людей одночасно у чан з В.Е.В. Вони не швидкі, не надто смертельні, але як охоронці підходять чудово, та ще й вірні до смерті."
SHA_dogs_equipment_3:0 "Озброєний кентавр"
SHA_dogs_equipment_3_short:0 "Озброєний кентавр"
SHA_dogs_equipment_3_desc:0 "Так, це кентавр з кулеметом. Жодних питань, людино!"

# IMO (Металоманти)
IMO_dogs_equipment_1:0 "Флоутер"
IMO_dogs_equipment_1_short:0 "Флоутер"
IMO_dogs_equipment_1_desc:0 "Флоутери вселяють страх одним своїм виглядом, але для супермутантів це лише вірні домашні улюбленці та напарники."
IMO_dogs_equipment_2:0 "Кентавр"
IMO_dogs_equipment_2_short:0 "Кентавр"
IMO_dogs_equipment_2_desc:0 "Кентавр — створіння, що для одних є чистим жахом, а для інших — просто ще один інструмент. Їх створюють, занурюючи кількох тварин і людей одночасно у чан з В.Е.В. Вони не швидкі, не надто смертельні, але як охоронці підходять чудово, та ще й вірні до смерті."
IMO_dogs_equipment_3:0 "Озброєний кентавр"
IMO_dogs_equipment_3_short:0 "Озброєний кентавр"
IMO_dogs_equipment_3_desc:0 "Так, це кентавр з кулеметом. Жодних питань, людино!"

# UOA (Єдність Остіну)
UOA_dogs_equipment_1:0 "Флоутер"
UOA_dogs_equipment_1_short:0 "Флоутер"
UOA_dogs_equipment_1_desc:0 "Флоутери вселяють страх одним своїм виглядом, але для супермутантів це лише вірні домашні улюбленці та напарники."
UOA_dogs_equipment_2:0 "Кентавр"
UOA_dogs_equipment_2_short:0 "Кентавр"
UOA_dogs_equipment_2_desc:0 "Кентавр — створіння, що для одних є чистим жахом, а для інших — просто ще один інструмент. Їх створюють, занурюючи кількох тварин і людей одночасно у чан з В.Е.В. Вони не швидкі, не надто смертельні, але як охоронці підходять чудово, та ще й вірні до смерті."
UOA_dogs_equipment_3:0 "Озброєний кентавр"
UOA_dogs_equipment_3_short:0 "Озброєний кентавр"
UOA_dogs_equipment_3_desc:0 "Так, це кентавр з кулеметом. Жодних питань, людино!"

