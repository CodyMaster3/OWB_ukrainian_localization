 CLK_ballistic_equipment_3:0 "Карабін-револьвер"
CLK_ballistic_equipment_3_short:0 ".44 Карабін"
CLK_ballistic_equipment_3_desc:0 "У розробці револьверів завжди настає момент, коли межа потужності досягнута. Саме тоді з’являються карабінні модифікації. Цей варіант із повноцінним прикладом, подовженим стволом і центральною збіркою стріляє супермагнум .44, зазвичай зарезервованим для важких гвинтівок."
CLK_ballistic_equipment_4:0 "Залізнична Гвинтівка"
CLK_ballistic_equipment_4_short:0 "Поїзд Болю"
CLK_ballistic_equipment_4_desc:0 "Ця громіздка конструкція — колишній пневматичний забивальник рейок, перетворений на зброю. Зі стволом, прикладом і незалежним джерелом живлення, він вистрілює гігантські .62 каліброві металеві шипи з потужністю револьвера. Цвяхом до стіни — буквально."

# CHC (Chickasaw-Muscogee Coalition)
CHC_melee_equipment_1:0 "Кастети"
CHC_melee_equipment_1_short:0 "Кастети"
CHC_melee_equipment_1_desc:0 "Коли ти б’єш — це відчувається. Кастети концентрують кінетичну енергію удару на малу металеву поверхню, спричиняючи серйозні травми м’язів і кісток. Проста класика ближнього бою."
CMC_ballistic_equipment_1:0 "$ballistic_weaponry_tech_icon_1_9mm_smg$"
CMC_ballistic_equipment_1_short:0 "$ballistic_weaponry_tech_icon_1_9mm_smg_short$"
CMC_ballistic_equipment_1_desc:0 "$ballistic_weaponry_tech_icon_1_9mm_smg_desc$"
CMC_ballistic_equipment_2:0 ".45 Автоматичний ПП"
CMC_ballistic_equipment_2_short:0 ".45 Авто ПП"
CMC_ballistic_equipment_2_desc:0 "Цей пістолет-кулемет калібру .45 вивергає справжній шквал смерті на ближній дистанції. Простіше кажучи: хочеш прорвати двері — ось твій ключ."
CMC_ballistic_equipment_3:0 "MP5K"
CMC_ballistic_equipment_3_short:0 "MP5K"
CMC_ballistic_equipment_3_desc:0 "Скорочена версія MP5, де K — німецьке 'Kurz', тобто 'короткий'. Створена для ближнього бою і таємних операцій. Маленький, але швидкий і смертельно точний."

# CRA (51 Zetans)
CRA_melee_equipment_4:0 "Зетанський Зонд"
CRA_melee_equipment_4_short:0 "Зетан-зонд"
CRA_melee_equipment_4_desc:0 "Земляни вважають, що ми слабкі в рукопашному бою. Якби ж то! Наші електрошокові кийки, модифіковані на максимум потужності, перетворюють ворогів на рожевий туман. Ви ще пошкодуєте, що наблизилися."
CRA_energy_equipment_1:0 "Зетанський Пістолет"
CRA_energy_equipment_1_short:0 "Пістолет Зетанів"
CRA_energy_equipment_1_desc:0 "Цей чудернацький артефакт — типовий бічний ствол Зетанів, відомий по всій галактиці своєю здатністю до атомізації. Хоч і поступається стабілізованим кварк-глюонним плазмобластерам, все одно викликає страх і захват серед недосконалих істот."
CRA_energy_equipment_2:0 "Зетанський Бластер"
CRA_energy_equipment_2_short:0 "Бластер"
CRA_energy_equipment_2_desc:0 "Справжнє диво інженерії, цей плазтомічний ствол стріляє снарядами зі швидкістю, що висміює будь-яку земну зброю. При контакті з м’якою плоттю жертв — обсмажує нутрощі та шкіру до хрусткої скоринки."
CRA_energy_equipment_3:0 "Зетанський Атомайзер"
CRA_energy_equipment_3_short:0 "Атомайзер"
CRA_energy_equipment_3_desc:0 "Стандартний пістолет Зетанів. Завдяки передовому стабілізаційному полю, цей пістолет був підданий численним випробуванням на землянських полонених, аби з’ясувати: скільки саме атомізації він забезпечує? Відповідь: багато. Дуже багато."
CRA_energy_equipment_4:0 "Зетанський Дезінтегратор"
CRA_energy_equipment_4_short:0 "Дезінтегратор"
CRA_energy_equipment_4_desc:0 "Ідеальна гвинтівка для знищення дурних землянок. Далекобійна, точна і безжальна. Навіть силова броня не врятує: ти не відчуваєш себе захищеним, коли тебе розпиляли зсередини."
CRA_high_fighter_equipment:0 "Літаюча Тарілка"
CRA_high_fighter_equipment_short:0 "Тарілка"
CRA_high_fighter_equipment_desc:0 "Антигравітація, плазмові гармати, протиракетні щити. Сучасна модель літаючої тарілки легко знищить будь-який земний літак. Вступати в повітряний бій проти нас — це обирати роль мішені."
CRA_high_cas_equipment:0 "Штурмова Тарілка"
CRA_high_cas_equipment_short:0 "Штурм-Тарілка"
CRA_high_cas_equipment_desc:0 "Посилене бронювання, потрійні дезінтегратори, мікро-смертельний промінь... Якщо ця штука з’явилась над горизонтом — то ти або труп, або ось-ось ним станеш. Достатньо швидка, щоб нанести удар і зникнути ще до того, як ворог усвідомить, що відбулося."
CRA_spotter_plane_equipment_3:0 "Розвідко-Корабель"
CRA_spotter_plane_equipment_3_short:0 "Розвідка"
CRA_spotter_plane_equipment_3_desc:0 "Інформація — така ж зброя, як і будь-який бластер. Після атомної війни карти стали марними. Наші модифіковані тарілки-розвідники дозволять оглянути всі куточки планети. Вони настільки маневрені, що ми не очікуємо їх втрати. Напевно."
CRA_high_fighter_unlock_tech:0 "Креслення Тарілки"
CRA_high_fighter_unlock_tech_desc:0 "Ці загадкові креслення пояснюють, як побудувати літаючі тарілки на антигравітаційній тязі, що знищують будь-які земні апарати без зайвих зусиль."

