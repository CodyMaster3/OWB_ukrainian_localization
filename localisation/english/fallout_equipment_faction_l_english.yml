  CES_melee_equipment_3_short:0 "$melee_weaponry_tech_icon_3_bumper_sword_short$"
  CES_melee_equipment_3_desc:0 "$SUN_melee_equipment_3_desc$"
CES_melee_equipment_4:0 "Балістичний Кулак"
CES_melee_equipment_4_short:0 "Баліст. Кулак"
CES_melee_equipment_4_desc:0 "Балістичний кулак — це наручний дробовик, прикріплений до пластини на кісточках. Вистрілює при контакті з ціллю. Результат — гучний сплеск крові та переламані кістки. Цей дар Марса не прощає."
CES_ballistic_equipment_2:0 "Ковбойська репітерка"
CES_ballistic_equipment_2_short:0 "Репітер ковбоя"
CES_ballistic_equipment_2_desc:0 "Надійна та проста у виготовленні трубчаста гвинтівка. У вмілих руках ковбойська репітерка може вести швидкий, точний вогонь і стати загрозою на полі бою."
CES_power_armour_equipment_2:0 "Силова броня Братства Марса"
CES_power_armour_equipment_2_short:0 "СБ БМ"
CES_power_armour_equipment_2_desc:0 "Створена для того, щоб уособлювати гнів Марса в бою, ця модифікована версія T-51b була розроблена Братством Марса для майбутніх завоювань. Використані матеріали поступаються оригіналу, але для винаходу колишніх лудитів — це технічне диво."
  CES_heavy_infantry_equipment_1:0 "$heavy_infantry_tech_icon_1_collar$"
