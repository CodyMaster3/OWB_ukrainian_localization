BAG_power_armor_equipment_1:0 "Силова броня Залізного Альянсу"
BAG_power_armor_equipment_1_short:0 "Збірна СБ ЗА"
BAG_power_armor_equipment_1_desc:0 "Піднята з руїн війни проти Залізного Альянсу, ця рейдерська броня — не найвеличніша з вигляду. Оголені екзоскелети, обвішані брухтом, саморобними бронепластинами, газовими масками та імпровізованими двигунами на паливі. Бойова ефективність — далеко не еталон, але сила, витривалість і простота використання — на висоті. І все це — без ф’южн-елементів."
BAG_power_armor_equipment_2:0 "Відновлена силова броня з Нового Колорадо"
BAG_power_armor_equipment_2_short:0 "Відновлена СБ НКР"
BAG_power_armor_equipment_2_desc:0 "Здобута з розгромленого або переконаного розділу Мексона, ця T-45d була очищена нашими техніками від зайвих технологічних надмірностей. Тепер її не треба вчитися носити роками, і хоч вона все ще добре тримає удар, пересуватись у ній — справа важка й виснажлива."
BAG_power_armor_equipment_3:0 "Прототип силової броні з Боулдера"
BAG_power_armor_equipment_3_short:0 "СБ Боулдера"
BAG_power_armor_equipment_3_desc:0 "Прототип, створений інженерами з Боулдерського куполу. Має вдосконалену внутрішню систему, тонше програмне забезпечення і краще підлаштовується під рухи користувача. Порівняно з іншими — це вже не просто костюм, це екзотехнологія."
BAG_spec_ops_equipment_3:0 "Патрульна броня Рейнджерів"
BAG_spec_ops_equipment_3_short:0 "Патрульна броня"
BAG_spec_ops_equipment_3_desc:0 "Базове спорядження Рейнджерів: легкий бронежилет під довоєнною штурмовою бронею та чорний плащ. Таку броню носять курсанти, рейнджери на спокійних ділянках або під час звичайного патрулювання."
BAG_spec_ops_equipment_4:0 "Бойова броня Рейнджерів"
BAG_spec_ops_equipment_4_short:0 "Броня Рейнджера"
BAG_spec_ops_equipment_4_desc:0 "Впізнавана чорна бойова броня Рейнджерів: традиційний плащ Пустельних Рейнджерів, поєднаний із довоєнною штурмовою бронею. Початково виготовлялася вручну в НКР, але ми зуміли її відтворити власноруч. Трішки грубувата, зате така ж смертоносна."
BAG_spec_ops_equipment_5:0 "Броня ветерана Рейнджерів"
BAG_spec_ops_equipment_5_short:0 "Броня Ветерана"
BAG_spec_ops_equipment_5_desc:0 "Версія бойової броні Рейнджерів для найкращих із найкращих. Той самий плащ, але тепер разом із вдосконаленою довоєнною штурмовою бронею. Спершу — гордість НКР, тепер — наша репліка. Міцна. Темна. І рішуча, як її власник."

