  MNC_ballistic_fireteam_weaponry_tech_2_short:0 "CZ57 Rockwell Avenger"
MNC_ballistic_fireteam_weaponry_tech_2:0 "Кулемет CZ57 «Роквелл Авенджер»"
MNC_ballistic_fireteam_weaponry_tech_2_short:0 "CZ57 Avenger"
MNC_ballistic_fireteam_weaponry_tech_2_desc:0 "Найвища точка довоєнної зброї — CZ57 використовує знайомі 5мм патрони, але з оновленням. Ми знизили скорострільність із неймовірних 60 000 до «всього» 12 000 пострілів на хвилину, щоб економити боєзапас. Завдяки охолодженню та хромованому стволу можна вести довгий прицільний вогонь. Колись це була вершина підтримки — і знову стане нею."
MNC_ballistic_fireteam_equipment_3:0 "Кулемет M60E4"
MNC_ballistic_fireteam_equipment_3_short:0 "M60E4"
MNC_ballistic_fireteam_equipment_3_desc:0 "M60E4 — модернізована класика. Вогонь, який вигравав війни Америки, тепер легший, надійніший і точніший. Нове нарізування ствола, кращі допуски, зменшена ймовірність осічок. І так, виглядає круто, коли стріляєш із нього від стегна. Для цієї 'свинки' це комплімент."
