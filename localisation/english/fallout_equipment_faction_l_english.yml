  # NCN (New Canaan
NCN_ballistic_equipment_1:0 "Автоматичний пістолет .45"
NCN_ballistic_equipment_1_short:0 "Пістолет .45"
NCN_ballistic_equipment_1_desc:0 "\"Цей тип пістолета .45 був розроблений одним із моїх предків майже чотириста років тому. Опанувати його — обряд посвяти для кожного ханаанця.\" — Джошуа Ґрем"
NCN_ballistic_equipment_2:0 "Автомат .45"
NCN_ballistic_equipment_2_short:0 "Автомат .45"
NCN_ballistic_equipment_2_desc:0 "Так само спроєктована предками Нью-Ханаанців, ця автоматична зброя калібру .45 знищує все на коротких дистанціях завдяки надзвичайній скорострільності."
NCN_ballistic_fireteam_equipment_2:0 "Автоматична гвинтівка відділення"
NCN_ballistic_fireteam_equipment_2_short:0 "AGВ"
NCN_ballistic_fireteam_equipment_2_desc:0 "Хоча базова модель абсолютно не придатна для сучасної війни, у ній було зерно потенціалу. Зброярі Нью-Ханаану перетворили цей довоєнний раритет на потужну підтримувальну зброю: полегшений затвор, калібр бойової гвинтівки, пістолетна рукоятка та компенсатор віддачі — все це створює гібрид ручного кулемета і марксманської гвинтівки, простий у виготовленні та ще простіший у використанні."

  # NCR (New California Republic)
  NCR_ballistic_equipment_1:0 "$ballistic_weaponry_tech_icon_1_mna_9mm_pistol$"
