l_english:
### FOCUSES

glowbugs_nf: "Дерево фокусів підлеглих Світляків"

# Початкові фокуси
glw_smoldering_ruins: "Тліючі руїни..."
glw_smoldering_ruins_desc: "Велика війна не оминула Боулдер — Купол, що здіймається посеред міста, був занадто важливим об’єктом, аби його ігнорувати. Дослідницький центр, спроєктований як захищений від радіації, пережив ядерну катастрофу без подряпини. А от усе довкола — ні."

glw_stitches_and_patches: "Стічіс і Петчіс"
glw_stitches_and_patches_desc: "Кістки цього міста світяться в темряві, і лише Сяючі можуть тут вижити — гулі з ядерним жаром у грудях. Їхню спільноту називають Світляками. І двоє з них борються за роль фактичного лідера."

glw_uneasy_alliance: "Невизначений союз"
glw_uneasy_alliance_desc: "Чорний каньйон прийшов нам на допомогу, коли ми цього найбільше потребували. Та за цей «благородний» вчинок ми платимо високу ціну. Їхня підтримка потрібна — але наш альянс хитається на межі. І рано чи пізно — щось доведеться змінити."

# Політична гілка — криза біженців
glw_refugee_crisis: "Криза біженців зі Східних земель"
glw_refugee_crisis_desc: "Біженці з Хаундлендів суне потоком, а Купол тріщить по швах. Їжі та ліжок бракує, напруга росте з кожним днем.\nСтічіс шукає практичні рішення, а Петчіс намагається підтримувати бойовий дух жартами. Це — бочка з порохом, яка от-от рвоне."

glw_silent_dog: "Мовчазний пес"
glw_silent_dog_desc: "Стічіс говорить мало, але його тінь важить більше, ніж слова. Колишній командо довоєнного світу, а тепер — легенда пустки, він має повагу гулів і шрами, що підтверджують її.\nЙого не ставлять під сумнів — якщо мають інстинкт самозбереження."

glw_control_from_pinned_position: "Жартівник під тиском"
glw_control_from_pinned_position_desc: "Старий шарм автопродавця Петчіса пережив два століття й більше радів, ніж більшість витримає. Він вміє змусити людей сміятись — або робити, як він хоче.\nЖарти, торги, чарівність — його головна зброя."

glw_tinder_for_firestorm: "Іскра для буревію"
glw_tinder_for_firestorm_desc: "Добути зброю в Чорного каньйону було нелегко — але Світляки впорались. Тепер настав час навчити біженців, як стріляти.\nЗалишається сподіватись, що вони цілятимуть у ворога, а не в себе."

glw_sweeping_up_pyre: "Підживити вогонь"
glw_sweeping_up_pyre_desc: "Більше зброї. Більше набоїв. Більше ударної сили за ті самі кришки. Сховища Чорного каньйону — це ціль, а Світляки вже рахують здобич.\nНавіть розпорошене ополчення з такою вогневою міццю — сила, з якою треба рахуватись."

glw_reinforce_border: "Укріпити кордон"
glw_reinforce_border_desc: "Периметр Купола замикається. Патрулі тримають хаос подалі. Вибір складний — але Світляки не можуть дозволити, щоб їх затопили.\nІноді, щоб вижити, треба сказати: «ні»."

glw_neckbreak_integration: "Інтеграція на межі"
glw_neckbreak_integration_desc: "Біженці працюють у тимчасових поселеннях, заробляючи місце потом і брухтом. Не гламурно — але ефективно.\nТут усе просто: не допомагаєш — не залишаєшся."

glw_handling_xenophobia: "Розібратись із ксенофобією"
glw_handling_xenophobia_desc: "Деяким гладкошкірим важко стерпіти гуля, навіть якщо він рятує їм життя. Але Світляки терпіти більше не збираються.\nЧи переконанням, чи страхом — але повагу вони отримають."

glw_fireflies_in_the_garden: "Світлячки в саду"
glw_fireflies_in_the_garden_desc: "Сяючі серед біженців — рідкість, але завжди бажана. Їхнє світло — не лише фізичне, а й символ надії для Купола.\nКожен світлячок — ще одна іскра у темряві."

glw_loyalty_to_whom: "Вірність — але кому?"
glw_loyalty_to_whom_desc: "Петчіс вміє зачарувати Чорний каньйон — і витягти з них припаси. Кілька жартів, трохи шарму — і справа зроблена.\nТа от де лежить його справжня лояльність?.. Тут уже хто знає."

glw_friends_with_benefits: "Друзі з вигодами"
glw_friends_with_benefits_desc: "Батарея з Меса-Верде. Лідер Федерації Чорного каньйону й одна з найвідоміших фігур пустки. Його харизма — як удар хвилею. А ще він наш сюзерен. Його слова й наміри можуть перевернути все — і це тільки ускладнює становище."

glw_the_bark: "Гавкіт..."
glw_the_bark_desc: "Стічіс не довіряє Чорному каньйону. Для нього — це зверхні лицеміри, які використовують Світляків лише тому, що самі бояться радіації Купола.\nАле теперішня криза біженців — саме та важільна точка, яку він чекав."

glw_the_bite: "... чи укус"
glw_the_bite_desc: "Стічіс ніколи не грався з Батареєю та його компанією в дружбу. Їхнє непорозуміння тягнеться роками. І тепер він пограбував один із арсеналів Чорного каньйону.\nПро дипломатію можна забути. Світляки готуються до наслідків."

glw_creates_fallen_from_back_off_brahmin: "Проблема «Двох генералів»"
glw_creates_fallen_from_back_off_brahmin_desc: "Якщо Чорний каньйон не виконує наші вимоги — чому ми маємо виконувати їхні? Знімати вершок із наших поставок — цілком справедливо.\nДурні гладколиці все одно не помітять, якщо трохи брухту «загубиться»... мабуть."
glw_creates_fallen_from_back_off_brahmin_tt: "§gА хто сказав, що вони помітять, якщо ми щось прихопимо з уламків?§!"

glw_bitter_honey: "Отруєний мед"
glw_bitter_honey_desc: "Дати Чорному каньйону щось солодке, а всередину — отруту? Класика від Петчіса.\nВони не зрозуміють, що сталося, поки буде пізно. І тоді Світляки посміються останні."

glw_leash_we_know: "Повідок, якого ми принаймні знаємо"
glw_leash_we_know_desc: "Іноді краще триматися диявола, якого знаєш. Слабкий пес підкоряється, але сильний?\nСильний оберне повідок на зброю — і, можливо, потягне за собою господаря."
glw_leash_we_know_tt: "§gПідтримка за уламки, яку ми отримуємо, насправді не така вже й погана. Надішлемо їм ще — за ті самі умови!§!"

glw_bratting_rights: "Право на каприз"
glw_bratting_rights_desc: "Петчіс завжди мав слабкість до Батареї — можливо, навіть надмірну. Завдяки своєму шарму він зумів отримати кілька «приватних подаруночків», які використовував... не зовсім публічно. Щось у цій схемі явно не схоже на здорові трудові відносини."

glw_our_people_pleaser: "Угодник народу"
glw_our_people_pleaser_desc: "Петчіс програв парі й тепер змушений виступати зі стендапом перед солдатами. Глядачі — похмурі, загартовані гулі з бойовим досвідом? От лузер!"

glw_fateful_night: "У війні та в коханні..."
glw_fateful_night_desc: "Петчіс і Стічіс кардинально розходяться в поглядах на Чорний каньйон. Стічіс хоче підірвати все до біса, а Петчіс — грати тонко.\nЦього разу лише один отримає шанс втілити своє бачення."

glw_gun_its_holster: "Зброя — назад у кобуру"
glw_gun_its_holster_desc: "Стічіс програв парі, і тепер знову в строю, на передовій. Навіть таким кремезним хлопцям не завжди щастить!"

GLW_STITCHES_unit_leader_tt: "§LНавичка§!: §Y3§!\n§RАтака§!: §Y3§!\n§GОборона§!: §Y2§!\n§PПланування§!: §Y3§!\n§MЛогістика§!: §Y4§!\n§gРиси:§! §tУважний§!, §tВитривалий§!, §tТаємничий незнайомець§!"

# Індустріальна гілка
glw_ask_funds_for_industrial_development: "Попросити фінансування для індустріалізації"
glw_ask_funds_for_industrial_development_desc: "Найкращий спосіб служити Пенітенціарію — через промисловість. У них не ті землі, щоб будувати заводи, зате є ресурси. Якщо вони поділяться інструментами й знанням — ми можемо починати прямо зараз."

glw_under_funded_industrial_complex: "Таємна реіндустріалізація"
glw_under_funded_industrial_complex_desc: "Вони проігнорували наше прохання. Прикро. Або бояться втратити контроль, або справді не мають змоги допомогти. Байдуже. Ми запустимо цей процес потай, у тіні [568.GetName], де їхні очі не бачать. Повільніше — але не неможливо."

glw_funded_industrial_complex: "Маніфактурна зона Ларамі"
glw_funded_industrial_complex_desc: "Маючи підтримку від Пенітенціарію, ми можемо стати Майстернею Скелястих гір. Ми обрали відкриту ділянку в [310.GetName], де гулям і гладкошкірим буде безпечно жити й працювати. Це точно потішить [BLC.GetLeader]."

glw_send_ink_visitor: "Послати «пензля» в гості"
glw_send_ink_visitor_desc: "Ми співпрацювали з усіма, крім однієї фракції в Чорному каньйоні. Розмальовані — це плем’я воїнів із багатою культурою татуювань. Ми маємо надіслати посла в їхній Салон, вивчити їх — і, можливо, разом вирішити наше спільне... делікатне питання."

glw_fate_of_airport: "Доля аеропорту"
glw_fate_of_airport_desc: "Аеропорт у Боулдері — особливий. Як і місто, радіація захистила його від мародерів. Він стоїть на горизонті — як скарб. Тепер ми маємо змогу або знищити його й забрати метал, або, зусиллями інженерів, відновити — і повернути небо під наш контроль."

glw_prepare_boulder_site: "Підготувати ділянку в Боулдері"
glw_prepare_boulder_site_desc: "Щоб перетворити Боулдер на промисловий центр із укріпленнями та житлом — потрібно розчистити місто. Радіація й завали — важкі вороги, але іншого виходу немає."
glw_prepare_boulder_site_tt: "Ефекти після виконання рішення §YОчистити центральний Боулдер§!"

glw_utilize_soap_tactics: "Застосувати методику «МИЙ»"
glw_utilize_soap_tactics_desc: "У країні багато біженців. Ми не можемо всіх розселити, але можемо використати низку соціально-економічних трюків, аби залучити їх до суспільства. Масові громадські роботи чи служба в армії в обмін на громадянство допоможуть нам «вимити» надлишкове населення на користь справі."

glw_reclaim_big_blue: "Повернути Велику Блакить"
glw_reclaim_big_blue_desc: "«Велика Блакить» — колишній завод з виробництва техніки та комп’ютерних деталей у Боулдері. Колись це був один із найпотужніших комп’ютерних гігантів, але зараз — обвалені цехи й вирвані материнські плати. Якщо в місті знайдеться вільне місце, ми можемо перевезти обладнання до нового приміщення."

glw_financial_situation: "Податкова кабала"
glw_financial_situation_desc: "Податки Чорного каньйону виснажують Світляків, але, можливо, є вихід. Шарм Петчіса й хитрість Стічіса допоможуть знайти лазівки в угоді.\nЯкщо ці двоє складуть голови разом — ми ще можемо вийти з цієї гри переможцями."
glw_financial_situation_tt_1: "§YЕфекти, якщо виконано фокус §GПідготувати ділянку в Боулдері§!:§!"
glw_financial_situation_tt_2: "§YЕфекти, якщо виконано фокус §GДотримуватись містобудівних норм§!:§!"

glw_proper_planning: "Дотримуватись містобудівних норм"
glw_proper_planning_desc: "Будувати місто з нуля — виклик сам по собі. Але в цьому також криється і шанс. Якщо правильно спланувати майбутнє місто, ми зможемо використати кожен клаптик землі на повну."

glw_develop_canyon_route: "Очищення Сяючої дороги"
glw_develop_canyon_route_desc: "Ми повинні використати кожен дюйм придатної землі. За межами Контактного табору є старий форт і передмістя Боулдера. Але туди важко дістатися з Каньйону, тож треба прибрати радіацію й завали з дороги для караванів із будматеріалами."

glw_build_additional_shelters: "Побудувати додаткові укриття"
glw_build_additional_shelters_desc: "Орди біженців у країні неконтрольовані. Табори переповнені, а умови — гірші за пустельний мінімум. Треба будувати нове житло й дати їм роботу — щоб вони знову відчули сенс, мету і контроль над життям. Усі виграють!"

glw_black_market_connections: "Зв’язки з чорним ринком"
glw_black_market_connections_desc: "Ми не єдині, хто ненавидить Пенітенціарій. Деякі впливові особи з Чорного каньйону давно хочуть, аби вся ця структура рухнула. Вони ще не готові до відкритої боротьби, але радо допоможуть — тихцем."

glw_over_cliff: "За межами урвища"
glw_over_cliff_desc: "За Скелями ховається долина, де, за словами одного найманського загону, є давнє Сховище. Вони не мають симпатій до Чорного каньйону — і здаються нам природними союзниками. Варто вийти на контакт і дослідити можливість співпраці."

glw_black_canyon_investment: "Інвестиція Чорного каньйону"
glw_black_canyon_investment_desc: "Із Пенітенціарію надійшла звістка. Вони готові профінансувати нашу промисловість у дусі старої Америки — «quid pro quo». В обмін на це вони вимагатимуть більшого внеску в «індустріальну співпрацю». У короткостроковій перспективі це вигідно їм — у довгостроковій, можливо, нам."

glw_coalition_investment: "Інвестиція коаліції"
glw_coalition_investment_desc: "Приватні інвестори з Громадської коаліції запропонували підтримку нашій промисловості. Пропозиція не така щедра, як «федеральна», але й не несе за собою пасток чи підводних каменів."

glw_prepare_developing_new_lands: "Готуватись до розширення"
glw_prepare_developing_new_lands_desc: "Після подолання економічних труднощів Світляки нарешті мають міцний ґрунт під ногами. Щоб відсвяткувати це, Стічіс і Петчіс грають партію більярду у старенькому барі.\nРідкісний момент спокою — і, можливо, надії."

glw_ghoulish_industry: "Гульська промисловість"
glw_ghoulish_industry_desc: "Про гулів не скажеш, що вони трудоголіки. Більшість просто байдикує — аж поки Стічіс не влупив по шолудивій голові. Але це тримає їх у формі — й не дає перетворитись на диких."

glw_deradiation_effort: "Очищення вод"
glw_deradiation_effort_desc: "Ми, гулі, можемо жити в радах. Але гладколиці — ні. Якщо хочемо, щоб вони залишились — доведеться трохи прибрати. Трішечки менше сяйва ще нікому не зашкодило. Хіба що нам."

glw_normie_targeted_scavange_hunts: "Пошукові рейди для норміків"
glw_normie_targeted_scavange_hunts_desc: "Гладколиці не дуже корисні — але мають гострий зір. Якщо взяти їх у рейд — збільшується шанс знайти цінності. І, можливо, зменшиться ймовірність, що вони накоїть дурниць."

glw_priest_and_electrican: "Священик і електрик"
glw_priest_and_electrican_desc: "Що спільного між священиком і електриком? Обидва приносять людям світло! Жарти вбік, Джеймс Кларк — старий єпископ — лагодить нашу енергосистему. І, виявляється, він хороший у обох видах «іскри»."

  glw_masters_of_scavenging:0 "Masters of Scavenging"
  glw_masters_of_scavenging_desc:0 "Nobody in the wasteland does salvage like us. Glowbugs see treasure in every piece of trash, and we make it work like magic."
  glw_multifunctional_workbenches:0 "Multifunctional Workbenches"
  glw_multifunctional_workbenches_desc:0 "Some ghouls are terrible at keeping track of tools. By stuffing a full kit in their workbenches, they don't have to hunt for screwdrivers anymore. It's simple, but hey—it works."
  glw_multifunctional_workbenches_tt:0 "§gThe talent of our people's shows; every already built §YFoundry§!, §YPower Station§! and §YPurification Station§! will count as a §YCivilian Workshop§! as well - as an §Goffmap building§!, of course.§!"
  #
  glw_houndlands_development_office:0 "Best Claims in Denver"
  glw_houndlands_development_office_desc:0 "You know how they say that Dog City's got the best claims? Screw them; the Houndlands have some real prime real estate!"
  glw_cleanse_chugwater:0 "Cleanse Chugwater"
  glw_cleanse_chugwater_desc:0 "This place is as nasty as 'Fat Freddy,' and that's saying something. Even ghouls can't stand the stench. Time to scrub this dump clean."
  glw_rebuild_fort:0 "Rebuild the Fort"
  glw_rebuild_fort_desc:0 "Briggdale used to be a fortress worth its name. After we took it, it's fallen to bits. Let's fix it up and make it ours."
  glw_packing_up_baggers_camp:0 "Packing up the Bagger's Camp"
  glw_packing_up_baggers_camp_desc:0 "The NCR sure kept this camp tidy—almost too tidy. Looks like we've got some prime salvage here, boys. Let's get to work!"
  glw_strip_clean_shanghai:0 "Strip Clean the Shanghai's Bones"
  glw_strip_clean_shanghai_desc:0 "Old Chinese spies left their mark here? Makes sense why we couldn't understand some of the refugees. Either way, time to strip it clean."
  glw_recycle_xians:0 "Recycle the Chinese Xians"
  glw_recycle_xians_desc:0 "Pre-war Chinese jet planes out in the Wasteland? No clue how they got here, but who cares—they're ours now."

  #Military Tree
  glw_ask_funds_for_rearmament_program:0 "Ask Funding for Armament"
  glw_ask_funds_for_rearmament_program_desc:0 "Black Canyon may claim to be pacifists, but no one buys it—they'll need weapons for their wars. If we can choose between supplying them and fighting beside them, we'd rather be Colorado's Death Dealers. Assuming they let us, of course."
  glw_under_funded_arms_factory:0 "Expand Stitches' Gunshop"
  glw_under_funded_arms_factory_desc:0 "Without enough caps, we'll have to make do. Stitches' gun shop near the Boulder ruins is already a hub for scavengers looking for self-defense gear. With a little work, we could turn it into a full-fledged arms factory."
  glw_funded_arms_factory:0 "Found the Weaponmaker's Guild"
  glw_funded_arms_factory_desc:0 "With new funding, we can hire muscle and equipment to build arms workshops. Developing the land near Laramie will appease The Penitentiary, and organizing our manufacturing will prevent ad-hoc chaos. The Weaponmaker's Guild will ensure quality over shortcuts."
  glw_learn_from_our_enemys_enemies:0 "Learn from Our Enemy's Enemies"
  glw_learn_from_our_enemys_enemies_desc:0 "Ouroboros—the witches out west—have clashed with Black Canyon before. There's a lot we can learn from their tactics, if we pay attention."
  glw_tribal_policing_methods:0 "Tribal Policing Methods"
  glw_tribal_policing_methods_desc:0 "Tribal strongman tactics might be crude, but they work. Might makes right, and a little muscle could go a long way for us too."
  glw_raider_heavy_explosives:0 "Raider Heavy Explosives"
  glw_raider_heavy_explosives_desc:0 "The Raider Matrons were famous for their bombs. Their explosive expertise spread even up here—might as well put those stories to good use."
  glw_the_beacon_guard:0 "The Beacon Guards"
  glw_the_beacon_guard_desc:0 "The fog around Boulder Dome can be a nightmare to navigate. Setting up Beacon Guards could guide travelers—and keep an eye on things while they're at it."
  glw_guidance_of_black_canyon:0 "The Guidance of Black Canyon"
  glw_guidance_of_black_canyon_desc:0 "Black Canyon occasionally offers advice worth listening to. Sure, it usually comes with demands for shipments, but beggars can't be choosers."
  glw_anti_factionalism_laws:0 "Anti-Factionalism Laws"
  glw_anti_factionalism_laws_desc:0 "The Caravan Congress out west is a cautionary tale of too many cooks in the kitchen. Stitches and Patches may bicker, but they agree on one thing—no one else gets a say in their turf."
  glw_army_role_in_integration:0 "Relegate Support Duties for the Military"
  glw_army_role_in_integration_desc:0 "Organizing the army starts with the basics: assigning roles, planning patrols, and setting expectations. Stitches knows this stuff like the back of his hand."
  glw_mountain_warfare_tt:0 "Enables §HMountain Training\n$category_light_infantry$§!\n    §H$mountain$§!\n      $STAT_ADJUSTER_ATTACK$§G+10%§!\n      $STAT_ADJUSTER_DEFENCE$§G+10%§!"
  glw_fate_of_canga:0 "The Fate of the CANGA Armoury"
  glw_fate_of_canga_desc:0 "The CANGA Armory looks... strange. Whatever's inside might just be crazy enough to work."
  glw_trust_settlers:0 "Should We Trust the Settlers?"
  glw_trust_settlers_desc:0 "Smoothskins can be pretty creepy. Should we trust them? Well, that's the question."
  glw_reach_out_to_the_baron:0 "Laramie Locals"
  glw_reach_out_to_the_baron_desc:0 "The sheriff of Laramie got his badge after losing a bet. If we help him out, maybe he'll help us keep the peace."
  glw_open_shadow_market:0 "Open the Shadow Market"
  glw_open_shadow_market_desc:0 "Plenty of trade doesn't make it through the official channels. Let's capitalize on that and set up a shadow market."
  glw_shared_interest_manufactory:0 "Shared Interest Manufactory"
  glw_shared_interest_manufactory_desc:0 "Keeping everyone on the same page about what they're building keeps things running smoothly. No surprises, no screw-ups."
  glw_begin_organizing_standing_army:0 "Begin Organizing the Homeguard"
  glw_begin_organizing_standing_army_desc:0 "Stitches takes pride in turning our ragtag militia into a real fighting force. The Homeguard's glowing—and not just from the rads."
  #
  glw_houndlands_pacification_office:0 "A Little Order, for a Change"
  glw_houndlands_pacification_office_desc:0 "Bringing order to the Houndlands isn't easy, but the Glowbugs are setting up shop to keep things under control. A little structure goes a long way in a place this wild."
  glw_chinese_maritime_traditions:0 "The Wind in the Red Sail"
  glw_chinese_maritime_traditions_desc:0 "Chinese spies share tales of their far-off mainland, tales of insurgency against the 'White Lotus' and American occupation along the Yangtze. It sounds like hogwash and bedtime stories, but it's fascinating all the same."
  glw_primitive_battle_methods:0 "Feral Ferocity"
  glw_primitive_battle_methods_desc:0 "'RAAAH!' Some Old Bones from out west got ghoulified in a freak accident involving a giant radioactive lizard. They're terrifying, they fight like maniacs, and nobody's asking questions."
  glw_never_ask_the_bear_where_he_is_going:0 "Never Ask the Bear Where He is Going..."
  glw_never_ask_the_bear_where_he_is_going_desc:0 "Captured Baggers tell stories about how the NCR plans to stretch across the entire Wasteland. Sure, and maybe molerats will grow wings while they're at it."
  glw_never_ask_the_bear_where_he_is_going_tt:0 "§gThe corresponding event will have different outcome based on §Y[BAG.GetNameWithFlag]§! political development prior to their annexation.§!"
  glw_homo_homini_lupus_est:0 "Homo Homini Lupus Est"
  glw_homo_homini_lupus_est_desc:0 "The Houndlands aren't for the weak. This place changes you—chews you up and spits you out. Only the toughest can survive here, and the Glowbugs have earned their place."
  glw_chinese_airial_traditions:0 "The Wind Under the Red Wings"
  glw_chinese_airial_traditions_desc:0 "Former spies have passed along some key insights about glider use. Turns out, their tips are just what we needed to take to the skies."
  #
  glw_homeguard_development:0 "Ghoulish Training"
  glw_homeguard_development_desc:0 "Stitches is cracking the whip, turning the Glowbugs into a real fighting force. If the Luminous Ones—or worse, the Congress—ever came knocking, sitting ducks wouldn't cut it."
  glw_purchase_moletown_mines:0 "Purchase Mines from Moletown"
  glw_purchase_moletown_mines_desc:0 "Moletown's got mines for sale, and they might be just the thing to defend Boulder. If anyone tries to sneak around the radiation—boom!"
  glw_acquire_yampan_heavy_arms:0 "Acquire Yampan Heavy Arms"
  glw_acquire_yampan_heavy_arms_desc:0 "The Yampa are packing some serious firepower. Even Stitches is impressed, and that's saying something."
  glw_knights_of_glow:0 "Gravestone's Knights of the Glow"
  glw_knights_of_glow_desc:0 "Emerging from the fog of Boulder Dome, the Knights of the Glow stand as radiant sentinels, their Midwest power armor gleaming with the sacred light of Plutonius. Arriving just recently from the northeast, these ghouls from Gravestone are warriors of Atom, their every strike a testament to the divine fury of charged particles. 'By the fire of fission, we defend!' they cry out in reverence!"
  GLW_knights_of_the_glow_tt:0 "A unit of holy warriors, equipped with Midwest Power Armour, arrive for battle to defend the glow of Boulder!"
  glw_army_of_ghouls:0 "An Army of Ghouls"
  glw_army_of_ghouls_desc:0 "Rip, tear, destroy—that's what ghouls do best. Leaning into the monster smoothskins fear makes them think twice about messing with us."
  glw_supporting_normies:0 "Sort Normies into Supporting Roles"
  glw_supporting_normies_desc:0 "Smoothskins can help—just not on the front lines. Hand them the dangerous, experimental weapons we'd rather not use ourselves and see what happens."
  #Territorial Managment
  glw_houndlands_integration_office:0 "The Houndlands"
  glw_houndlands_integration_office_desc:0 "Remember that place the refugees came from? Yeah, we conquered it. Neat, huh? Suddenly, the Glowbugs are playing in the big leagues."
  glw_grant_freedom_of_religion:0 "Appease the Cultist-Types"
  glw_grant_freedom_of_religion_desc:0 "Diana, Hecate, the Hanged Man, the Great Glowing One, Atom—it doesn't matter who you worship. The Glowbugs don't care about your prayers, just your loyalties.\nPatches would rather die than play god, and Stitches would make sure of it if he tried. Faith is personal—loyalty is what counts."
  glw_integrate_national_guard:0 "Southern Refugees"
  glw_integrate_national_guard_desc:0 "Some ghouls from down south have wandered in, muttering about Henderson's parties and 'crazy witches.' We're not sure what their story is, but one thing's clear—they can fight."
  glw_praise_the_glow_and_pass_the_ammunition:0 "Praise the Glow and Pass the Ammunition!"
  glw_praise_the_glow_and_pass_the_ammunition_desc:0 "Sharing ammo keeps everyone alive a little longer. It's not like ghouls are growing on trees out here, so every bullet counts."
  #glw_hangdog_border_strip:0 "Demand the Southern Houndlands!"
  #glw_hangdog_border_strip_desc:0 ""
  #glw_colonize_abandoned_regions:0 "Colonize the Abandoned Regions"
  #glw_colonize_abandoned_regions_desc:0 ""
  #glw_exile_bigots_from_fort_lupton:0 "Sell Back the Surplus Population"
  #glw_exile_bigots_from_fort_lupton_desc:0 ""
  glw_knowledge_of_admiral:0 "Chinese River-Fleet Blueprints"
  glw_knowledge_of_admiral_desc:0 "Turns out some of those spies carried pre-war blueprints for small sailing vessels, designed for inland raids on the Mississippi. They never made it that far, but the tech is proving pretty useful for us now."
  glw_knowledge_of_air_marshal:0 "Chinese Air Blueprints"
  glw_knowledge_of_air_marshal_desc:0 "Stitches and Patches can't read Chinese, so they're taking a leap of faith with what the spy refugees salvaged. A translator says it's related to powerful planes—sounds promising enough."
  glw_mend_communist_schism:0 "Learning Chinese"
  glw_mend_communist_schism_desc:0 "Stitches and Patches are fed up with not understanding Chinese—it makes leading the spy refugees a nightmare. Patches jokes it'll take decades to perfect his stand-up in Mandarin, but hey, they've got time."
  glw_bagging_up_baggers:0 "Bagging up the Baggers"
  glw_bagging_up_baggers_desc:0 "The NCR left behind some fancy tech—radio equipment used to 'phone home' to California. With a little reverse engineering, it might just become a Glowbug specialty."

  #Starting Focuses
  #glw_same_old_tape:0 "The Same Old Tape..."
  #glw_same_old_tape_desc:0 ""
  #glw_preparing_for_war:0 "Gears of War"
  #glw_preparing_for_war_desc:0 ""
  glw_free_fireflies:0 "Forming a Real Community"
  glw_free_fireflies_desc:0 "With the red tape from the treaty gone and our future secured, we can finally focus on building a real community here in Boulder."
  glw_assessing_situation:0 "Stitches' Plan"
  glw_assessing_situation_desc:0 "Stitches envisions our gang as a proper military structure—rank and file, commanders, and top brass. It's orderly, disciplined, and has that old-world plutocratic vibe."
  glw_old_knife:0 "Patches' Plan"
  glw_old_knife_desc:0 "Patches wants something different—a mix of Brotherhood camaraderie and comedy club charm. A tight-knit family of gangsters who share laughs and loyalty. Brotherhood with a twist."
  glw_caravan_exploitation:0 "Kick the Caravan Out of Here!"
  glw_caravan_exploitation_desc:0 "The Caravan Congress never did us any favors. Time to kick them out and take control of our own future."
  glw_stitches_preparations:0 "Stitches' Preparation"
  glw_stitches_preparations_desc:0 "Stitches knows his plan needs to be airtight. If he messes this up, the refugees will be furious, and chaos could erupt."
  glw_hidden_stockpiles:0 "Hidden Stockpiles"
  glw_hidden_stockpiles_desc:0 "Look at all these guns! We could arm the refugees and turn them into real recruits—ready to fight for our future."
  glw_mobilize_homeguard:0 "Mobilize the Homeguard"
  glw_mobilize_homeguard_desc:0 "The Homeguard we've built here in Boulder is solid. It could be the foundation of a new elite fighting force."
  glw_everything_ready:0 "Plan in Motion"
  glw_everything_ready_desc:0 "Stitches' plan is coming together, and it's working! The people are on board, and things are going better than expected."
  glw_caravan_influence:0 "Influence of the Caravan"
  glw_caravan_influence_desc:0 "The Caravan Congress wasn't all bad. Maybe keeping them around could bring some benefits after all."
  glw_patches_presence:0 "Patches' Presence"
  glw_patches_presence_desc:0 "For Patches to pull off his plan, he needs to win over everyone. Charm and humor will only get him so far—he needs full support."
  glw_rebuild_settlements:0 "Haven for the Wayward"
  glw_rebuild_settlements_desc:0 "Patches' vision is a home for everyone—no matter who they are. Open doors, open hearts, and a place in the family for all."
  glw_police_chaos:0 "Peacekeeping Duty"
  glw_police_chaos_desc:0 "Patches has fought bullies before, from crazed Gammorin to Midwest robots. His jokes and his fists defended the weak, and his family will carry on that tradition."
  glw_share_what_we_have:0 "Share What We Have"
  glw_share_what_we_have_desc:0 "Sharing is the cornerstone of our community. It's the least we can do, and it's our new motto—because nobody should be the butt of the joke."
