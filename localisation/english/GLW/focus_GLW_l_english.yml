l_english:
### FOCUSES

glowbugs_nf: "Дерево фокусів підлеглих Світляків"

# Початкові фокуси
glw_smoldering_ruins: "Тліючі руїни..."
glw_smoldering_ruins_desc: "Велика війна не оминула Боулдер — Купол, що здіймається посеред міста, був занадто важливим об’єктом, аби його ігнорувати. Дослідницький центр, спроєктований як захищений від радіації, пережив ядерну катастрофу без подряпини. А от усе довкола — ні."

glw_stitches_and_patches: "Стічіс і Петчіс"
glw_stitches_and_patches_desc: "Кістки цього міста світяться в темряві, і лише Сяючі можуть тут вижити — гулі з ядерним жаром у грудях. Їхню спільноту називають Світляками. І двоє з них борються за роль фактичного лідера."

glw_uneasy_alliance: "Невизначений союз"
glw_uneasy_alliance_desc: "Чорний каньйон прийшов нам на допомогу, коли ми цього найбільше потребували. Та за цей «благородний» вчинок ми платимо високу ціну. Їхня підтримка потрібна — але наш альянс хитається на межі. І рано чи пізно — щось доведеться змінити."

# Політична гілка — криза біженців
glw_refugee_crisis: "Криза біженців зі Східних земель"
glw_refugee_crisis_desc: "Біженці з Хаундлендів суне потоком, а Купол тріщить по швах. Їжі та ліжок бракує, напруга росте з кожним днем.\nСтічіс шукає практичні рішення, а Петчіс намагається підтримувати бойовий дух жартами. Це — бочка з порохом, яка от-от рвоне."

glw_silent_dog: "Мовчазний пес"
glw_silent_dog_desc: "Стічіс говорить мало, але його тінь важить більше, ніж слова. Колишній командо довоєнного світу, а тепер — легенда пустки, він має повагу гулів і шрами, що підтверджують її.\nЙого не ставлять під сумнів — якщо мають інстинкт самозбереження."

glw_control_from_pinned_position: "Жартівник під тиском"
glw_control_from_pinned_position_desc: "Старий шарм автопродавця Петчіса пережив два століття й більше радів, ніж більшість витримає. Він вміє змусити людей сміятись — або робити, як він хоче.\nЖарти, торги, чарівність — його головна зброя."

glw_tinder_for_firestorm: "Іскра для буревію"
glw_tinder_for_firestorm_desc: "Добути зброю в Чорного каньйону було нелегко — але Світляки впорались. Тепер настав час навчити біженців, як стріляти.\nЗалишається сподіватись, що вони цілятимуть у ворога, а не в себе."

glw_sweeping_up_pyre: "Підживити вогонь"
glw_sweeping_up_pyre_desc: "Більше зброї. Більше набоїв. Більше ударної сили за ті самі кришки. Сховища Чорного каньйону — це ціль, а Світляки вже рахують здобич.\nНавіть розпорошене ополчення з такою вогневою міццю — сила, з якою треба рахуватись."

glw_reinforce_border: "Укріпити кордон"
glw_reinforce_border_desc: "Периметр Купола замикається. Патрулі тримають хаос подалі. Вибір складний — але Світляки не можуть дозволити, щоб їх затопили.\nІноді, щоб вижити, треба сказати: «ні»."

glw_neckbreak_integration: "Інтеграція на межі"
glw_neckbreak_integration_desc: "Біженці працюють у тимчасових поселеннях, заробляючи місце потом і брухтом. Не гламурно — але ефективно.\nТут усе просто: не допомагаєш — не залишаєшся."

glw_handling_xenophobia: "Розібратись із ксенофобією"
glw_handling_xenophobia_desc: "Деяким гладкошкірим важко стерпіти гуля, навіть якщо він рятує їм життя. Але Світляки терпіти більше не збираються.\nЧи переконанням, чи страхом — але повагу вони отримають."

glw_fireflies_in_the_garden: "Світлячки в саду"
glw_fireflies_in_the_garden_desc: "Сяючі серед біженців — рідкість, але завжди бажана. Їхнє світло — не лише фізичне, а й символ надії для Купола.\nКожен світлячок — ще одна іскра у темряві."

glw_loyalty_to_whom: "Вірність — але кому?"
glw_loyalty_to_whom_desc: "Петчіс вміє зачарувати Чорний каньйон — і витягти з них припаси. Кілька жартів, трохи шарму — і справа зроблена.\nТа от де лежить його справжня лояльність?.. Тут уже хто знає."

glw_friends_with_benefits: "Друзі з вигодами"
glw_friends_with_benefits_desc: "Батарея з Меса-Верде. Лідер Федерації Чорного каньйону й одна з найвідоміших фігур пустки. Його харизма — як удар хвилею. А ще він — наш володар. Його слова й наміри можуть перевернути все — і це тільки ускладнює становище."

glw_the_bark: "Гавкіт..."
glw_the_bark_desc: "Стічіс не довіряє Чорному каньйону. Для нього — це зверхні лицеміри, які використовують Світляків лише тому, що самі бояться радіації Купола.\nАле теперішня криза біженців — саме та важільна точка, яку він чекав."

glw_the_bite: "... чи укус"
glw_the_bite_desc: "Стічіс ніколи не грався з Батареєю та його компанією в дружбу. Їхнє непорозуміння тягнеться роками. І тепер він пограбував один із арсеналів Чорного каньйону.\nПро дипломатію можна забути. Світляки готуються до наслідків."

glw_creates_fallen_from_back_off_brahmin: "Проблема «Двох генералів»"
glw_creates_fallen_from_back_off_brahmin_desc: "Якщо Чорний каньйон не виконує наші вимоги — чому ми маємо виконувати їхні? Знімати вершок із наших поставок — цілком справедливо.\nДурні гладколиці все одно не помітять, якщо трохи брухту «загубиться»... мабуть."
glw_creates_fallen_from_back_off_brahmin_tt: "§gА хто сказав, що вони помітять, якщо ми щось прихопимо з уламків?§!"

glw_bitter_honey: "Отруєний мед"
glw_bitter_honey_desc: "Дати Чорному каньйону щось солодке, а всередину — отруту? Класика від Петчіса.\nВони не зрозуміють, що сталося, поки буде пізно. І тоді Світляки посміються останні."

glw_leash_we_know: "Повідок, якого ми принаймні знаємо"
glw_leash_we_know_desc: "Іноді краще триматися диявола, якого знаєш. Слабкий пес підкоряється, але сильний?\nСильний оберне повідок на зброю — і, можливо, потягне за собою господаря."
glw_leash_we_know_tt: "§gПідтримка за уламки, яку ми отримуємо, насправді не така вже й погана. Надішлемо їм ще — за ті самі умови!§!"

glw_bratting_rights: "Право на каприз"
glw_bratting_rights_desc: "Петчіс завжди мав слабкість до Батареї — можливо, навіть надмірну. Завдяки своєму шарму він зумів отримати кілька «приватних подаруночків», які використовував... не зовсім публічно. Щось у цій схемі явно не схоже на здорові трудові відносини."

glw_our_people_pleaser: "Угодник народу"
glw_our_people_pleaser_desc: "Петчіс програв парі й тепер змушений виступати зі стендапом перед солдатами. Глядачі — похмурі, загартовані гулі з бойовим досвідом? От лузер!"

glw_fateful_night: "У війні та в коханні..."
glw_fateful_night_desc: "Петчіс і Стічіс кардинально розходяться в поглядах на Чорний каньйон. Стічіс хоче підірвати все до біса, а Петчіс — грати тонко.\nЦього разу лише один отримає шанс втілити своє бачення."

glw_gun_its_holster: "Зброя — назад у кобуру"
glw_gun_its_holster_desc: "Стічіс програв парі, і тепер знову в строю, на передовій. Навіть таким кремезним хлопцям не завжди щастить!"

GLW_STITCHES_unit_leader_tt: "§LНавичка§!: §Y3§!\n§RАтака§!: §Y3§!\n§GОборона§!: §Y2§!\n§PПланування§!: §Y3§!\n§MЛогістика§!: §Y4§!\n§gРиси:§! §tУважний§!, §tВитривалий§!, §tТаємничий незнайомець§!"

# Індустріальна гілка
glw_ask_funds_for_industrial_development: "Попросити фінансування для індустріалізації"
glw_ask_funds_for_industrial_development_desc: "Найкращий спосіб служити Пенітенціарію — через промисловість. У них не ті землі, щоб будувати заводи, зате є ресурси. Якщо вони поділяться інструментами й знанням — ми можемо починати прямо зараз."

glw_under_funded_industrial_complex: "Таємна реіндустріалізація"
glw_under_funded_industrial_complex_desc: "Вони проігнорували наше прохання. Прикро. Або бояться втратити контроль, або справді не мають змоги допомогти. Байдуже. Ми запустимо цей процес потай, у тіні [568.GetName], де їхні очі не бачать. Повільніше — але не неможливо."

glw_funded_industrial_complex: "Маніфактурна зона Ларамі"
glw_funded_industrial_complex_desc: "Маючи підтримку від Пенітенціарію, ми можемо стати Майстернею Скелястих гір. Ми обрали відкриту ділянку в [310.GetName], де гулям і гладкошкірим буде безпечно жити й працювати. Це точно потішить [BLC.GetLeader]."

glw_send_ink_visitor: "Послати «пензля» в гості"
glw_send_ink_visitor_desc: "Ми співпрацювали з усіма, крім однієї фракції в Чорному каньйоні. Розмальовані — це плем’я воїнів із багатою культурою татуювань. Ми маємо надіслати посла в їхній Салон, вивчити їх — і, можливо, разом вирішити наше спільне... делікатне питання."

glw_fate_of_airport: "Доля аеропорту"
glw_fate_of_airport_desc: "Аеропорт у Боулдері — особливий. Як і місто, радіація захистила його від мародерів. Він стоїть на горизонті — як скарб. Тепер ми маємо змогу або знищити його й забрати метал, або, зусиллями інженерів, відновити — і повернути небо під наш контроль."

glw_prepare_boulder_site: "Підготувати ділянку в Боулдері"
glw_prepare_boulder_site_desc: "Щоб перетворити Боулдер на промисловий центр із укріпленнями та житлом — потрібно розчистити місто. Радіація й завали — важкі вороги, але іншого виходу немає."
glw_prepare_boulder_site_tt: "Ефекти після виконання рішення §YОчистити центральний Боулдер§!"

glw_utilize_soap_tactics: "Застосувати методику «МИЙ»"
glw_utilize_soap_tactics_desc: "У країні багато біженців. Ми не можемо всіх розселити, але можемо використати низку соціально-економічних трюків, аби залучити їх до суспільства. Масові громадські роботи чи служба в армії в обмін на громадянство допоможуть нам «вимити» надлишкове населення на користь справі."

glw_reclaim_big_blue: "Повернути Велику Блакить"
glw_reclaim_big_blue_desc: "«Велика Блакить» — колишній завод з виробництва техніки та комп’ютерних деталей у Боулдері. Колись це був один із найпотужніших комп’ютерних гігантів, але зараз — обвалені цехи й вирвані материнські плати. Якщо в місті знайдеться вільне місце, ми можемо перевезти обладнання до нового приміщення."

glw_financial_situation: "Податкова кабала"
glw_financial_situation_desc: "Податки Чорного каньйону виснажують Світляків, але, можливо, є вихід. Шарм Петчіса й хитрість Стічіса допоможуть знайти лазівки в угоді.\nЯкщо ці двоє складуть голови разом — ми ще можемо вийти з цієї гри переможцями."
glw_financial_situation_tt_1: "§YЕфекти, якщо виконано фокус §GПідготувати ділянку в Боулдері§!:§!"
glw_financial_situation_tt_2: "§YЕфекти, якщо виконано фокус §GДотримуватись містобудівних норм§!:§!"

glw_proper_planning: "Дотримуватись містобудівних норм"
glw_proper_planning_desc: "Будувати місто з нуля — виклик сам по собі. Але в цьому також криється і шанс. Якщо правильно спланувати майбутнє місто, ми зможемо використати кожен клаптик землі на повну."

glw_develop_canyon_route: "Очищення Сяючої дороги"
glw_develop_canyon_route_desc: "Ми повинні використати кожен дюйм придатної землі. За межами Контактного табору є старий форт і передмістя Боулдера. Але туди важко дістатися з Каньйону, тож треба прибрати радіацію й завали з дороги для караванів із будматеріалами."

glw_build_additional_shelters: "Побудувати додаткові укриття"
glw_build_additional_shelters_desc: "Орди біженців у країні неконтрольовані. Табори переповнені, а умови — гірші за пустельний мінімум. Треба будувати нове житло й дати їм роботу — щоб вони знову відчули сенс, мету і контроль над життям. Усі виграють!"

glw_black_market_connections: "Зв’язки з чорним ринком"
glw_black_market_connections_desc: "Ми не єдині, хто ненавидить Пенітенціарій. Деякі впливові особи з Чорного каньйону давно хочуть, аби вся ця структура рухнула. Вони ще не готові до відкритої боротьби, але радо допоможуть — тихцем."

glw_over_cliff: "За межами урвища"
glw_over_cliff_desc: "За Скелями ховається долина, де, за словами одного найманського загону, є давнє Сховище. Вони не мають симпатій до Чорного каньйону — і здаються нам природними союзниками. Варто вийти на контакт і дослідити можливість співпраці."

glw_black_canyon_investment: "Інвестиція Чорного каньйону"
glw_black_canyon_investment_desc: "Із Пенітенціарію надійшла звістка. Вони готові профінансувати нашу промисловість у дусі старої Америки — «quid pro quo». В обмін на це вони вимагатимуть більшого внеску в «індустріальну співпрацю». У короткостроковій перспективі це вигідно їм — у довгостроковій, можливо, нам."

glw_coalition_investment: "Інвестиція коаліції"
glw_coalition_investment_desc: "Приватні інвестори з Громадської коаліції запропонували підтримку нашій промисловості. Пропозиція не така щедра, як «федеральна», але й не несе за собою пасток чи підводних каменів."

glw_prepare_developing_new_lands: "Готуватись до розширення"
glw_prepare_developing_new_lands_desc: "Після подолання економічних труднощів Світляки нарешті мають міцний ґрунт під ногами. Щоб відсвяткувати це, Стічіс і Петчіс грають партію більярду у старенькому барі.\nРідкісний момент спокою — і, можливо, надії."

glw_ghoulish_industry: "Гульська промисловість"
glw_ghoulish_industry_desc: "Про гулів не скажеш, що вони трудоголіки. Більшість просто байдикує — аж поки Стічіс не влупив по шолудивій голові. Але це тримає їх у формі — й не дає перетворитись на диких."

glw_deradiation_effort: "Очищення вод"
glw_deradiation_effort_desc: "Ми, гулі, можемо жити в радах. Але гладколиці — ні. Якщо хочемо, щоб вони залишились — доведеться трохи прибрати. Трішечки менше сяйва ще нікому не зашкодило. Хіба що нам."

glw_normie_targeted_scavange_hunts: "Пошукові рейди для норміків"
glw_normie_targeted_scavange_hunts_desc: "Гладколиці не дуже корисні — але мають гострий зір. Якщо взяти їх у рейд — збільшується шанс знайти цінності. І, можливо, зменшиться ймовірність, що вони накоїть дурниць."

glw_priest_and_electrican: "Священик і електрик"
glw_priest_and_electrican_desc: "Що спільного між священиком і електриком? Обидва приносять людям світло! Жарти вбік, Джеймс Кларк — старий єпископ — лагодить нашу енергосистему. І, виявляється, він хороший у обох видах «іскри»."

glw_masters_of_scavenging: "Майстри збирання брухту"
glw_masters_of_scavenging_desc: "Ніхто в пустці не вміє тягнути мотлох краще за нас. Світляки бачать скарб у кожній покрученій деталі — і змушують усе це працювати, мов за магією."

glw_multifunctional_workbenches: "Багатофункціональні верстаки"
glw_multifunctional_workbenches_desc: "Деякі гулі — просто катастрофа в організації. Тож ми напакували їм повний набір інструментів прямо у верстак. Більше не треба бігати за викруткою. Просто й ефективно."
glw_multifunctional_workbenches_tt: "§gНаш народ показує, на що здатен: кожна вже побудована §YЛиварня§!, §YЕлектростанція§! та §YСтанція очищення§! також вважається §YЦивільною майстернею§! — як §Gпозамапова будівля§!.§!"

glw_houndlands_development_office: "Найкращі ділянки в Денвері"
glw_houndlands_development_office_desc: "Кажуть, у Псиному місті найкраща земля? Та ну. У Хаундлендах — справжня нерухомість преміум-класу!"

glw_cleanse_chugwater: "Очистити Чагвотер"
glw_cleanse_chugwater_desc: "Це місце смердить, як «Товстий Фредді». І це ще м’яко сказано. Навіть гулям тут важко дихати. Час його відмити до блиску."

glw_rebuild_fort: "Відбудувати форт"
glw_rebuild_fort_desc: "Брідґдейл колись був фортом, який заслуговував на свою назву. Після того як ми його взяли — він розвалився. Настав час навести порядок і зробити його по-справжньому нашим."

glw_packing_up_baggers_camp: "Згортання табору Баґґерів"
glw_packing_up_baggers_camp_desc: "НКР тримала цей табір у ідеальному порядку — навіть занадто. А отже, для нас тут чимало цінного. Хапай лом і до справи!"

glw_strip_clean_shanghai: "Обчистити кістки Шанхаю"
glw_strip_clean_shanghai_desc: "Кажуть, тут залишились сліди китайських шпигунів. Можливо, тому деяких біженців ми не розуміли. Але байдуже — обчищаємо все до останнього болта!"

glw_recycle_xians: "Переплавити китайські «Сіані»"
glw_recycle_xians_desc: "Довоєнні китайські винищувачі в пустелі? Не маємо жодної ідеї, як вони сюди потрапили. Та й не важливо — тепер вони наші."

# Військова гілка
glw_ask_funds_for_rearmament_program: "Попросити фінансування на озброєння"
glw_ask_funds_for_rearmament_program_desc: "Чорний каньйон прикидається пацифістами — але ніхто в це не вірить. Вони самі ведуть війни, і їм потрібна зброя. Якщо маємо обирати: постачати чи воювати разом — краще стати Торговцями Смертю Колорадо. Якщо, звісно, вони дозволять."

glw_under_funded_arms_factory: "Розширити майстерню Стічіса"
glw_under_funded_arms_factory_desc: "Без належного фінансування доведеться імпровізувати. Майстерня Стічіса біля руїн Боулдера — вже центр для тих, хто шукає зброю. З невеликим розширенням — це буде справжній завод."

glw_funded_arms_factory: "Заснувати Гільдію Зброярів"
glw_funded_arms_factory_desc: "Маючи ресурси, ми можемо найняти робітників і закупити обладнання для створення повноцінної зброярської галузі. Освоєння земель біля Ларамі потішить Пенітенціарій, а централізоване виробництво дозволить уникнути хаосу. Гільдія гарантує якість."

glw_learn_from_our_enemys_enemies: "Вчитися у ворогів наших ворогів"
glw_learn_from_our_enemys_enemies_desc: "Оуроборос — відьми з заходу — вже стикались із Чорним каньйоном. Їхні методи цікаві. Варто придивитись — і вивчити."

glw_tribal_policing_methods: "Племінні методи «безпеки»"
glw_tribal_policing_methods_desc: "Племінні підходи до правопорядку грубі — але ефективні. Хто сильніший, той і має рацію. А трохи сили нам не завадить."

glw_raider_heavy_explosives: "Важка вибухівка від рейдерів"
glw_raider_heavy_explosives_desc: "Матрони-рейдери були знамениті своїми вибухами. Їхні рецепти долетіли й до нас — тож гріх не скористатися."

glw_the_beacon_guard: "Вогневі дозори"
glw_the_beacon_guard_desc: "Туман навколо Купола — справжній кошмар. Світлові дозори допоможуть мандрівникам — і нам, щоб мати око на околицю."

glw_guidance_of_black_canyon: "Поради Чорного каньйону"
glw_guidance_of_black_canyon_desc: "Часом у Чорному каньйоні щось радять. Іноді навіть щось путнє. Правда, разом із новими вимогами. Але ж ми не в тій позиції, щоб перебирати."

glw_anti_factionalism_laws: "Закони проти фракціоналізму"
glw_anti_factionalism_laws_desc: "Карванна Рада на заході — приклад того, як надто багато голосів нищить усе. Петчіс і Стічіс сперечаються, але в одному згодні — третім у нас не місце."

glw_army_role_in_integration: "Передати армії допоміжні завдання"
glw_army_role_in_integration_desc: "Армію треба починати з простого: ролі, патрулі, очікування. Стічіс це знає, як свої палаючі пальці."
glw_mountain_warfare_tt: "Відкриває §HГірське навчання\n$category_light_infantry$§!\n    §H$mountain$§!\n      $STAT_ADJUSTER_ATTACK$§G+10%§!\n      $STAT_ADJUSTER_DEFENCE$§G+10%§!"

glw_fate_of_canga: "Доля складу «CANGA»"
glw_fate_of_canga_desc: "Склад «КАНГА» виглядає... дивно. Але іноді саме дивне — працює найкраще."

glw_trust_settlers: "Чи можна довіряти поселенцям?"
glw_trust_settlers_desc: "Гладколиці можуть бути стрьомні. Довіряти їм чи ні — ось у чому питання."

glw_reach_out_to_the_baron: "Місцеві з Ларамі"
glw_reach_out_to_the_baron_desc: "Шериф Ларамі виграв значок у грі на парі. Якщо допоможемо йому — може, й він допоможе тримати тут лад."

glw_open_shadow_market: "Відкрити тіньовий ринок"
glw_open_shadow_market_desc: "Багато торгівлі відбувається поза офіційними маршрутами. Час використати це — і відкрити свій тіньовий базар."

glw_shared_interest_manufactory: "Фабрика спільних інтересів"
glw_shared_interest_manufactory_desc: "Якщо всі знають, що саме вони виробляють — все працює чітко. Без сюрпризів, без косяків."

glw_begin_organizing_standing_army: "Організувати Вартових Купола"
glw_begin_organizing_standing_army_desc: "Стічіс пишається тим, як перетворює натовп з мародерів на боєздатну армію. Вартові Купола сяють — і не лише через редіацію."

glw_houndlands_pacification_office: "Трохи порядку — хоч раз"
glw_houndlands_pacification_office_desc: "Принести порядок у Хаундленди — задача не з легких. Але Світляки розгортають штаби, щоб втримати ситуацію. Навіть мінімальна структура тут — безцінна."

glw_chinese_maritime_traditions: "Вітер у червоному вітрилі"
glw_chinese_maritime_traditions_desc: "Китайські шпигуни згадують про далеку батьківщину, про повстання проти 'Білого Лотоса' і окупацію Янцзи. Казки, можливо. Але надзвичайно цікаві."

glw_primitive_battle_methods: "Ярість здичавілих"
glw_primitive_battle_methods_desc: "«РАААААХ!» — кілька Древніх Кісток із заходу стали гулями через вибух і радіоактивного ящера. Вони жахливі, скажені й не мають жодних гальм. І ми не ставимо питань."

glw_never_ask_the_bear_where_he_is_going: "Ніколи не питай ведмедя, куди він іде..."
glw_never_ask_the_bear_where_he_is_going_desc: "Полонені Баґґери кажуть, що НКР хоче простягти лапи через всю Пустку. Авжеж, і кроти навчаться літати, мабуть."
glw_never_ask_the_bear_where_he_is_going_tt: "§gВідповідна подія матиме різний результат, залежно від того, як політично розвинулась §Y[BAG.GetNameWithFlag]§! перед анексією.§!"

glw_homo_homini_lupus_est: "Людина людині — вовк"
glw_homo_homini_lupus_est_desc: "У Хаундлендах не виживає слабкий. Це місце ламає, випльовує і ковтає. І тільки найжорсткіші мають тут шанс. Світляки заслужили своє місце."

glw_chinese_airial_traditions: "Вітер під червоними крилами"
glw_chinese_airial_traditions_desc: "Колишні шпигуни передали нам свої знання з глайдерної справи. Їхні поради — саме те, що треба, щоб злетіти."

glw_homeguard_development: "Навчання гулям"
glw_homeguard_development_desc: "Стічіс не дає спуску — перетворює загін Світляків на справжню армію. Якщо Сяйливі чи Конгрес коли-небудь нападуть — краще бути з боєм, ніж у ролі цілі."

glw_purchase_moletown_mines: "Придбати шахти у Молтауні"
glw_purchase_moletown_mines_desc: "Молтаун продає міни — і це саме те, що потрібно, аби захистити Боулдер. Хтось захоче обійти зону радіації? БУМ!"

glw_acquire_yampan_heavy_arms: "Отримати важку зброю Ямпи"
glw_acquire_yampan_heavy_arms_desc: "У Ямпанців серйозна вогнева міць. Навіть Стічіс вражений — а це вже щось значить."

glw_knights_of_glow: "Лицарі Сяйва з Ґрейвстоуна"
glw_knights_of_glow_desc: "Вони з’явились із туману Купола — Лицарі Сяйва. Їхні силові обладунки Мідвеста сяють святим сяйвом Плутонія. Прибули з північного сходу, ці гулі з Ґрейвстоуна — воїни Атома. Кожен їхній удар — гнів заряджених частинок. «Силою розпаду ми боронимо!»"
GLW_knights_of_the_glow_tt: "З’являється підрозділ святих воїнів у силовій броні Мідвеста, готовий боронити Сяйво Боулдера!"

glw_army_of_ghouls: "Армія гулів"
glw_army_of_ghouls_desc: "Рвати, трощити, нищити — це те, в чому гулі найкращі. Стати тією істотою, якої бояться гладколиці — і вони двічі подумають, перш ніж сунутись."

glw_supporting_normies: "Гладколиці — на підтримку"
glw_supporting_normies_desc: "Нехай гладколиці допомагають. Тільки не на передовій. Видай їм нестабільну експериментальну зброю — і подивимось, що буде."

# Управління територією
glw_houndlands_integration_office: "Хаундленди"
glw_houndlands_integration_office_desc: "Пам’ятаєш, звідки сунули біженці? Так от — ми це місце завоювали. Оце так поворот. Світляки вийшли на великий ринг."

glw_grant_freedom_of_religion: "Угодити вірянам"
glw_grant_freedom_of_religion_desc: "Діана, Геката, Повішений, Великий Сяючий, Атом — не важливо, кому ти молишся. Світляків не цікавлять молитви. Їх цікавить лояльність.\nПетчіс краще загине, ніж стане богом. І Стічіс особисто в цьому переконається. Віра — це особисте. Лояльність — обов’язкова."

glw_integrate_national_guard: "Південні біженці"
glw_integrate_national_guard_desc: "Кілька гулям з півдня з’явились у нашій землі, бурмочучи про вечірки Гендерсона та «відьом-шаленок». Що з ними було — не ясно. Але одне точно — вони вміють битися."

glw_praise_the_glow_and_pass_the_ammunition: "Слава Сяйву — і патрони передай"
glw_praise_the_glow_and_pass_the_ammunition_desc: "Поділитися набоєм — це ще один день життя. Гулі на деревах не ростуть, тож кожна куля має значення."

