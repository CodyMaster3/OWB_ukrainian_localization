glw_stitches_dominance: "Перевага Стічіса"
glw_stitches_dominance_desc: "Зрештою, Стічіс вийшов переможцем у суперництві з Петчісом. Можливо, років за двадцять Петчіс і повернеться на сцену — як він завжди це робить."

glw_perfect_harmony: "Досконала гармонія"
glw_perfect_harmony_desc: "Всупереч усьому, Стічіс і Петчіс знайшли спільну мову. Їхні відмінності поступились місцем справжньому партнерству — чим здивували навіть самих себе."

glw_patches_dominance: "Перевага Петчіса"
glw_patches_dominance_desc: "Жарти Петчіса взяли гору над цинізмом Стічіса. Можливо, той ще повернеться у центр уваги. Але поки що останній сміється саме Петчіс."

glw_listen_to_arriving_ghouls: "Прислухатись до біженців-гулів"
glw_listen_to_arriving_ghouls_desc: "Біженці постійно згадують «Колорадо» — довоєнну назву, що, здається, несе особливе значення. Не через ностальгію шпигунів — ті занадто дивні — але для решти вона щось означає."

glw_check_back_to_midwest: "Зв’язатись із Братством"
glw_check_back_to_midwest_desc: "Петчіс колись був у Братстві Сталі, хіба ні? Може, час знову зв’язатись і дізнатись, що в них там відбувається."
glw_check_back_to_midwest_tt: "Спробувати приєднатись до фракції Братства Сталі, якщо маємо з нею спільний кордон."
