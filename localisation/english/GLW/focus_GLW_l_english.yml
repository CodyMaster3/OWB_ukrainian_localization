  #glw_colonize_abandoned_regions_desc:0 ""
  #glw_exile_bigots_from_fort_lupton:0 "Sell Back the Surplus Population"
  #glw_exile_bigots_from_fort_lupton_desc:0 ""
glw_knowledge_of_admiral: "Креслення китайського річкового флоту"
glw_knowledge_of_admiral_desc: "Як виявилося, деякі зі шпигунів мали при собі довоєнні креслення малих вітрильників, створених для рейдів по Міссісіпі. Вони туди так і не дістались, але ця технологія нам дуже згодилася."

glw_knowledge_of_air_marshal: "Китайські авіакреслення"
glw_knowledge_of_air_marshal_desc: "Стічіс і Петчіс не вміють читати китайською, тож довіряються перекладачу. Кажуть, там щось про надпотужні літаки. Досить перспективно, як на наш погляд."

glw_mend_communist_schism: "Вивчити китайську"
glw_mend_communist_schism_desc: "Стічіс і Петчіс уже втомилися не розуміти китайську — керувати шпигунами-біженцями стає дедалі важче. Петчіс жартує, що його стендап мандаринською буде готовий десь за років тридцять. Але час у нас є."

glw_bagging_up_baggers: "Упакувати Баґґерів"
glw_bagging_up_baggers_desc: "НКР залишила після себе техніку — радіообладнання для зв’язку з Каліфорнією. Якщо розібратися, можемо зробити з цього особливість Світляків."

glw_free_fireflies: "Сформувати справжню спільноту"
glw_free_fireflies_desc: "Бюрократична тяганина договору — позаду. Майбутнє — в наших руках. Час будувати справжню спільноту в Боулдері."

glw_assessing_situation: "План Стічіса"
glw_assessing_situation_desc: "Стічіс уявляє нашу банду як повноцінну армійську структуру — чітка ієрархія, дисципліна, командири. Усе як у давні часи... з легким присмаком плутократії."

glw_old_knife: "План Петчіса"
glw_old_knife_desc: "Петчіс хоче інакшого — братерства по типу Братства Сталі, тільки з комедійним клубом на додачу. Тісна сім’я гангстерів, що тримається на сміху та лояльності. Братство, але з родзинкою."

glw_caravan_exploitation: "Викурити Караван із міста!"
glw_caravan_exploitation_desc: "Караванна рада ніколи нічого хорошого для нас не зробила. Час попрощатись і взяти контроль над власним майбутнім."

glw_stitches_preparations: "Підготовка Стічіса"
glw_stitches_preparations_desc: "Стічіс знає — план має бути бездоганним. Помилка викличе хаос і бунт серед біженців."

glw_hidden_stockpiles: "Приховані сховища"
glw_hidden_stockpiles_desc: "Ого, скільки тут зброї! Ми можемо озброїти біженців — і перетворити їх на справжніх солдатів нашого нового майбутнього."

glw_mobilize_homeguard: "Мобілізувати Вартових Купола"
glw_mobilize_homeguard_desc: "Вартові Купола — вже не просто ополчення. Це основа нової елітної бойової сили."

glw_everything_ready: "План у дії"
glw_everything_ready_desc: "План Стічіса починає працювати — люди підтримують його, усе йде краще, ніж очікувалось."

glw_caravan_influence: "Вплив Каравану"
glw_caravan_influence_desc: "Караванна рада не була аж такою поганою. Може, їх варто залишити — з правильним підходом це може бути вигідно."

glw_patches_presence: "Присутність Петчіса"
glw_patches_presence_desc: "Щоб план Петчіса спрацював — він має переконати всіх. Жарти та усмішка — не достатньо. Потрібна повна підтримка."

glw_rebuild_settlements: "Притулок для загублених"
glw_rebuild_settlements_desc: "Візія Петчіса — дім для кожного. Відкриті двері, відкрите серце й місце в родині — незалежно від минулого."

glw_police_chaos: "Патрулювати хаос"
glw_police_chaos_desc: "Петчіс бився з хуліганами, божевільними мутантами й роботами Середнього Заходу. Його жарти й кулаки боронили слабких. І його «родина» продовжить цю справу."

glw_share_what_we_have: "Поділитись усім, що маємо"
glw_share_what_we_have_desc: "Ділитись — основа нашої спільноти. Це найменше, що ми можемо зробити. І наш новий девіз: бо ніхто не має бути об’єктом для глузувань."

