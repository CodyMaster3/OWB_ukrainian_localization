GLW_yampan_development: "Інвестиції коаліції"
GLW_yampan_development_desc: "Деякі приватні інвестори з Громадянської коаліції запропонували підтримку нашій промисловості. Їхня пропозиція значно скромніша за те, що обіцяє «федеральний уряд», але вона також не несе прихованих умов, якими нас намагаються скувати."

GLW_yampan_development_2: "Друзі та бізнес"
#GLW_yampan_development_2_desc: "TODO"

GLW_BLC_interactions: "У тіні гори"
GLW_BLC_interactions_desc: "У темніші часи наш народ змушений був підписати Коллінський договір задля власного виживання. Відтоді §Y[BLC.GetNameWithFlag]§! виступають у ролі нашого старшого брата, що стримує загрози з півдня.\n\nТа ціна була висока: одностороннє висмоктування ресурсів і прибутків, яке триває без упину. Попри це, договір досить гнучкий, і за належного маневрування ми можемо перетворити його на взаємовигідну угоду.\n\nЗвісно, за наявності §Rприголомшливої сили§! та трохи §Rопортунізму§! ми можемо й §Rвідкинути договір§! назавжди..."

GLW_clear_up_boulder: "Очистити центр Боулдера"
GLW_clear_up_boulder_desc: "Петчіс і Стічіс очолюють ініціативу з очищення центрального Боулдера. Комбінуючи дисципліну й гумор, вони організовують зусилля з перетворення цієї ділянки з порожньої пустки на придатне для життя місце."

