GLW_refugee_crisis_decision_cat: "Притулок для заблукалих"
GLW_refugee_crisis_decision_cat_desc: "§RВійна. Війна ніколи не змінюється.§! Люди, що жили північніше Собачого міста, — міцні, вперті, і відмовилися коритися Гангдогам, які, втім, їх і так зневажають. Але навіть гулям, які бачили все, можна завдати болю. І коли регіональні мілітаристи починають війну — когось це змушує залишити дім...\n\n£reinforcement_texticon  Біженці: [?GLW_REFUGEE_COUNTER|*-]"

