l_english:
GLW_closed_ones_desc: "Суперництво між «Близькими»"
GLW_closed_ones_desc_desc: "Розвідники Боулдера формально мають одного лідера, але насправді — двох. §OПетчіс§! веде вилазки в руїни та представляє спільноту перед чужинцями, тоді як §MСтічіс§! очолює міліцію й, відповідно, має значний вплив на державні справи.\n\nСкажімо так — бачення майбутнього в них кардинально різні. Усі знають, що між ними щось є, і коли їх запитують, вони щоразу відповідають: «ми справді близькі». Чи йдеться про дружбу, братство чи щось глибше — ніхто не знає. Але допоки їхнє суперництво триває, наш народ не може бути впевнений у завтрашньому дні."

GLW_stitches_support_dec: "Натовп підтримує Стічіса"
GLW_stitches_support_dec_desc: ""

GLW_patches_support_dec: "Натовп підтримує Петчіса"
