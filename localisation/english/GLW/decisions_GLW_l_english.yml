GLW_black_market_connections_dec: "Зв’язки з чорним ринком"
GLW_black_market_connections_dec_desc: "Ми не єдині, хто ненавидить Пенітенціарій. Є впливові особи з Чорного каньйону, які хочуть побачити, як цей «експеримент» розвалиться сам по собі. І хоча вони ще не готові завдати удару, охоче подадуть нам руку допомоги."

decision_repeatable_days_90: "Це рішення можна повторювати кожні §Y90§! днів!"

