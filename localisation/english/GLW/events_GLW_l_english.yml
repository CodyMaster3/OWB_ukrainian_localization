l_english:
### EVENTS

nf_glowbugs.1.title: "Радіоактивне"
nf_glowbugs.1.desc: "Коли Велика війна почалася двісті років тому, цей куточок Колорадо отримав покарання значно гірше, ніж очікувалося. Боулдер не був ані густонаселеним містом, ані стратегічним центром озброєнь, але сам по собі міг вважатися важливою ціллю. Саме тут розташовувався об’єкт під назвою «Купол» – передовий дослідницький інститут. Уряд розробив його напівсферичну структуру так, щоб вона витримувала кілька прямих ядерних ударів – і саме тому він став ідеальною мішенню для ворогів нашої старої країни. Адже якщо будівлю зводили так міцно, певно, було що знищувати, так?\n\nКупол пережив усе, що в нього кидали, але місто навколо – ні. Боулдер перетворився на палаючі руїни, що світяться зеленим ядерним сяйвом і вбивають усіх, хто намагається випробувати свою долю. Місто залишалося покинутим довгий час... аж поки не прийшов перший «світляк».\n\nСвітляк – це рідкісний різновид Сяючого гуля, який зберіг розум і не здичавів, попри постійне дзижчання атомів і муки молекулярного розкладу. Найнепривітніше місце східніше Скелястих гір стало домівкою для тих, хто не міг жити ні з ким – навіть із власними «нормі-гульськими» побратимами. Повільно, але впевнено вони створили спільноту, перетворивши свою домівку на щось особливе... то що, вони збирали найцінніший мотлох із міста, щоб зберегти, чи збудували перші споруди самі?"
nf_glowbugs.1.a: "Наче безмежний шведський стіл."
nf_glowbugs.1.b: "Роботи – по горло."

nf_glowbugs.2.title: "Йдучи рука об руку"
nf_glowbugs.2.desc: "Петчіс і Стічіс, двоє довоєнних гулям, стали ключовими постатями піднесення Світляків. Їхня історія почалася в Квінсі, де Петчіс спробував себе в стендапі – з мішаними відгуками. Стічіс не був фанатом його жартів, але все одно приходив – із солідарності між гулями. Так зародилося суперництво, що переросло у дружбу.\n\nЇхній зв’язок зміцнів на Середньому Заході, де вони служили у Братстві, поки громадянська війна не змусила обирати сторону. Ставши на бік повстанців та Армії визволення мутантів, Петчіс за допомогою харизми об’єднував фракції, а Стічіс озброював міліції та планував оборону. Коли війна закінчилася, обидва зрозуміли – на Середньому Заході їм більше не місце: Петчіс не знаходив глядача, а Стічіс – спокою. Вони вирушили до Боулдера.\n\nУ Боулдері вони розійшлися в ролях, але залишилися нерозлучними. Петчіс укладав союзи й об’єднав Світляків, особливою перемогою стало укладання суперечливої угоди з Федерацією Чорного каньйону – вона забезпечила місто від набігів Гангдогів. Попри критику, Петчіс наполягав: виживання понад усе.\n\nСтічіс тим часом зміцнював оборону, організовував ополчення, навчав захисників. Його зневага до угоди була відкрита – він бачив у ній загрозу незалежності. Та навіть у суперечках Петчіс і Стічіс розуміли одне: їхні шляхи ведуть до однієї мети – процвітання Боулдера."
nf_glowbugs.2.a: "«А взагалі, що не так із Ґрейвстоуном?»"
nf_glowbugs.2.b: "«Бу! Ми це чули сто разів!»"

nf_glowbugs.3.title: "Караван любові"
nf_glowbugs.3.desc: "Угода з Чорним каньйоном мала свою ціну – й ухвалити її було непросто. Гангдоги вже нишпорили поблизу, й хоча Стічіс сформував Світлячків – загін міні-гулів, що зводили барикади глибоко в опромінених руїнах – вони не витримали б нападу. Угода, укладена Петчісом, стала першою тріщиною у стосунках, і мир, якого вона мала досягти, назавжди втратив свою цілісність.\n\nЧорний каньйон – неформальна федерація, що об’єднує три групи: плем’я Розмальованих, цивілізованих мешканців громад Ямпи, та рейдерів із Тіббетського Пенітенціарію. Їх веде Батарея з Меса-Верде – особа, яка не належить до жодної з трьох груп, але, за словами Петчіса, дуже харизматична та вкрай приваблива. Можливо, саме це й стало причиною угоди.\n\nНам запропонували захист, промислову допомогу для відбудови руїн і навіть оренду територій Ларамі – там гулям і нормі можуть співіснувати далеко від радіації. В обмін на підпорядкування і не надто обтяжливий податок на ресурси. Для Петчіса – це виграшна угода. Для Стічіса – це оподаткування без представництва й початок залежності. Але угоду таки підписали. Реакція Світляків? Ну, приблизно така:"
nf_glowbugs.3.a: "Найпокірніший слуга, пане."
nf_glowbugs.3.b: "Ти мені не указ!"
  #
nf_glowbugs.4.title: "Краще спорядження – краща робота"
nf_glowbugs.4.desc: "Хоч наша роздрібнена промислова база й так у жалюгідному стані, наші друзі в Боулдері мають ще гірше. Життя біля радіоактивного кратера замість центру міста не становить особливої загрози для місцевих Сяючих, але повністю унеможливлює контакти з «нормі». А без їхніх м'язів чи будматеріалів ця громада ніколи не стане самодостатньою. На щастя, завжди знайдуться гулі-мандрівники та люди, яким нічого втрачати – та вони попросять вагон кришок у відповідь.\n\nКонтракт зобов'язує нас виручити їх. Але, звісно... ніхто ж не змушує нас тримати слово, правда?"
nf_glowbugs.4.a: "Ми ж це їм обіцяли."
nf_glowbugs.4.b: "Нічим допомогти, пробачте."

nf_glowbugs.5.title: "Друге поправлення"
nf_glowbugs.5.desc: "Наша співпраця зі Світляками-гулями спочатку мала виключно оборонний характер: убезпечити багатства Старого Світу від головного суперника. Та згодом вона переросла в дещо більше, хоча захисна суть так і не зникла. Та тепер Світляки хочуть більшого – вони просять фінансування для створення власних бойових підрозділів і військової промисловості. Це могло б стати вигідним і для нас: менше гарнізонів – більше людей для інших потреб. Можливо, це навіть допоможе вирішити наш дефіцит у збройному виробництві.\n\nАле це – лише ставка. І одного дня вони можуть обернути цю зброю проти нас, навіть не пітніючи."
nf_glowbugs.5.a: "Обіцянка є обіцянка."
nf_glowbugs.5.b: "На жаль, грошей усе ще нема."

nf_glowbugs.6.title: "Платіж надійшов!"
nf_glowbugs.6.desc: "Чорний каньйон погодився підтримати нашу будівельну промисловість. Кришки та ресурси дадуть нам поштовх, аби звести щось справжнє й стале.\n\nПетчіс, звісно ж, уже записує перемогу на свій рахунок."
nf_glowbugs.6.a: "Петчіс, як завжди, мав рацію!"

nf_glowbugs.7.title: "Каса дзвенить: к-ча-чінг!"
nf_glowbugs.7.desc: "Чорний каньйон погодився підтримати нашу військову промисловість. Завдяки цій допомозі Світляки можуть стати потужною силою в регіоні.\n\nІноді крапля дипломатії творить дива."
nf_glowbugs.7.a: "Хто вміє догодити – той збирає плоди."

nf_glowbugs.8.title: "Караван встромив нам ніж у спину!"
nf_glowbugs.8.desc: "Чорний каньйон відмовився надати нам підтримку у військовій галузі. Ми залишилися сам на сам із труднощами. Ця відмова підтверджує найгірші побоювання Стічіса, який завжди підозрював їхні справжні мотиви.\n\nСвітляки це запам’ятають."
nf_glowbugs.8.a: "Стічіс мав слушність..."

nf_glowbugs.10.title: "Диявольський жарт"
nf_glowbugs.10.desc: "Ніч у Куполі була незвично тихою – аж надто тихою.\n\nПетчіс, гортаючи свій записник, здригнувся, коли повітря наповнилося сіркою й жаром. Із тіні з’явилася постать у яскраво-червоному костюмі, зі скрипкою під пахвою й хитрою посмішкою на вустах.\n\n– Петчіс, – протяг диявол голосом солодким, мов радіоактивний мед. – Я працював над жартом, і мені потрібна твоя експертна думка. Йдеться про Моромена й містера Охоронця. Моромен каже, що кора міцніша за укус, а містер Охоронець наполягає, що обереги не потребують зубів. – Пауза. – Ну як тобі?\n\nПетчіс моргнув. – Це... не жарт. Це два фінальні рядки, які душать одне одного.\n\nУсмішка диявола зникла. – Як це? Це ж витончено! Езотерично! Золото гумору!\n\n– Ні, дружок. Без підводки, без контексту, без мотивації – це як продавати гулю сонцезахисний крем. Просто не працює.\n\n– Ти нестерпний, – прошипів диявол.\n\n– Ага? – Петчіс зробив крок уперед. – Тоді ось тобі мій панчлайн. – І з розвороту заїхав йому просто в морду. Диявол відлетів назад до Джорджії, залишивши по собі лише запах сірки та розчарування.\n\nКоли в Куполі знову запанувала тиша, Петчіс обтрусився й пробурмотів: – Знаєте, що справді смішно? Що він думав – у нього є шанс.\n\nСвітляки, що стали свідками, вибухнули сміхом, хоча ніхто й не був певен, що ж насправді тільки-но сталося."
nf_glowbugs.10.a: "Петчіс: 1, диявол: 0."
nf_glowbugs.10.a.tt: "Ти щойно вбив християнського диявола. І що, ти хочеш медаль? Трохи політичного впливу? Може, фабрику озброєнь – або дві!?\n\nРозпещений ти, от хто ти є! Ти тільки-но перевернув богослов’я, а ще й хочеш геймплейний ефект. Розробники називають таких гравців балуваними!\n\n\n\nДобре, тільки нікому не кажи, але я віддам ОДИН £pp_texticon політичний вплив. Тільки між нами, домовились?"

nf_glowbugs.11.title: "Політична вірність"
nf_glowbugs.11.desc: "Група поселенців із Чорного каньйону виявила бажання приєднатися до Світляків. Для одних це шанс розширити спільноту, для інших – привід для підозр.\n\nПрийняти їх – зміцнити союз... або впустити загрозу."
nf_glowbugs.11.a: "Бій виграно на зборах – перемога вдома."
nf_glowbugs.11.b: "Ми знаємо, кому насправді вірні."
  #
nf_glowbugs.12.title: "З рушницею додому"
nf_glowbugs.12.desc: "Ще одна група з Чорного каньйону хоче оселитися тут, заявляючи, що поділяє бачення Світляків. Їхні наміри начебто щирі, але сумніви залишаються. Вони прийшли допомагати – чи служити своїм старим хазяям?\n\nСвітляки мають вирішити: відкрити двері чи замкнути їх."
nf_glowbugs.12.a: "Різні люди – спільна мета."
nf_glowbugs.12.b: "Спільний інтерес – ще не довіра."

nf_glowbugs.18.title: "Сутичка зі зшитим гулем"
nf_glowbugs.18.desc: "Стічіс організував наліт на територію Чорного каньйону – стрімкий, жорсткий, рішучий. Було захоплено спорядження, а ті, кого заскочили зненацька, досі не можуть прийти до тями. Йдеться не лише про втрати – а й про нахабність самої дії.\n\nКерівництво Чорного каньйону мусить обрати, як реагувати. Адже будь-яка відповідь задасть тон майбутнім стосункам."
nf_glowbugs.18.a: "Як вони сміють…"

nf_glowbugs.19.title: "Наш розбещений малюк"
nf_glowbugs.19.desc: "Один із новобранців на межі – виснажений до нестями після виснажливих тренувань Стічіса. «Це занадто!» – жаліється він, падаючи у бруд. Старші гулі тільки зітхають.\n\nТут нема місця слабкості. Він або звикне до методів Стічіса, або загине."
nf_glowbugs.19.a: "Нехай дорослішає – і швидко."

nf_glowbugs.21.title: "Проєкт «Ру»"
nf_glowbugs.21.desc: "Усередині арсеналу CANGA Петчіс вмикає старий довоєнний термінал. Журнали належали генералу Р.Дж. Руні – «Ру» – і описують суперечку навколо проєкту, що носив його ім’я. Проєкт «Ру», як його уявляв генерал, мав стати ініціативою психологічної війни, покликаною плекати єдність і любов серед солдатів. «Боєць б’ється найкраще не за те, що ненавидить, а за те, що любить», – писав він.\n\nЗаписи стають усе гарячішими, як і сам Ру, що сперечається зі своїми підлеглими, які хочуть опертися на страх і знищення. Один лог особливо запам’ятовується: «Війна – це дім, збудований на руїнах миру. Якщо ми не залишимо двері відчиненими для того, що прийде потім – ми вже програли». Записи обриваються, натякаючи, що мрію Ру було покинуто.\n\nІ тепер Світляки мають обрати: вшанувати мрію Ру про єдність – чи прийняти жорсткий шлях його колег."
nf_glowbugs.21.a: "Війну виграють любов’ю."
nf_glowbugs.21.b: "Любов здобувають через війну."

nf_glowbugs.24.title: "Вгору за Жовтою рікою"
nf_glowbugs.24.desc: "Світляки поділилися кресленнями кораблів – переробленими на основі знайдених китайських проєктів. Ці плани можуть повністю змінити річкову навігацію та зміцнити наші позиції."
nf_glowbugs.24.a: "Передайте гулям мою подяку."

nf_glowbugs.25.title: "Сян і щастя"
nf_glowbugs.25.desc: "Світляки знайшли унікальні авіаційні схеми й запчастини довоєнного китайського виробництва. Це може значно посилити наші можливості в повітрі."
nf_glowbugs.25.a: "Передайте гулям мою подяку."

nf_glowbugs.26.title: "Радіомовчання більше не актуальне"
nf_glowbugs.26.desc: "Завдяки Світлякам ми отримали сучасне радіообладнання. Тепер наша комунікаційна мережа готова до розширення."
nf_glowbugs.26.a: "Передайте гулям мою подяку."

nf_glowbugs.27.title: "Перемога у фронтрейнджській кампанії"
nf_glowbugs.27.desc: "Хаундленди під нашим контролем, і Світляки святкують здобуту перемогу. Стічіс, хоч і не майстер промов, виходить до натовпу: «Ем... ну, ми билися, втратили небагато, і, е-е, тепер воно наше. Молодці.»\n\nПерш ніж він продовжує своє незграбне бурмотіння, Петчіс урізається з усмішкою: «Що Стічіс намагається сказати – ВААУ! Ми це зробили, народ! Ми – королі Хаундлендів, топ-гулі, сяючі найкращі! А тепер – святкуємо, ніби радіація нас не вб’є завтра!» Натовп вибухає оплесками й починається справжнє святкування."
nf_glowbugs.27.a: "ВААУ!"

nf_glowbugs.28.title: "Проєкт «Важкий камінь»"
nf_glowbugs.28.desc: "Муніципальний аеропорт Боулдера. Менший і менш завантажений, ніж інші в Співдружності, але використовувався доволі часто, щоб бути цінним місцем для мародерства. Армія США застосовувала його як паливну базу для малих літаків і як резервний ангар. Якщо пощастить – щось із цього досі збереглося, і ми або відновимо їх, або пустимо на метал.\n\nРішення просте: зберегти «залізних птахів» і колись повернути небо – чи розібрати все й використати ресурси просто зараз?"
nf_glowbugs.28.a: "Розібрати все."
nf_glowbugs.28.b: "… хто знає, де приземлиться."

nf_glowbugs.29.title: "Тіньові домовленості"
nf_glowbugs.29.desc: "Гулі зі Світляків зазвичай скромні, але після нашої відмови інвестувати у їхній регіон, вони стали... неспокійними. Вони почали шукати обхідні шляхи, і Торговельна гільдія Коаліції радо видала їм гроші – ті самі, що могли піти до спільної скарбниці. Не потрібно й казати, як це підриває наші позиції у Зборах і контроль над Світляками."
nf_glowbugs.29.a: "Щурі!"
###=Glowbugs Refugee Events=###

nf_glowbugs_refugee.0.title: "Віддайте мені ваших змучених, ваших злиденних"
nf_glowbugs_refugee.0.desc: "Порохова бочка Колорадо нарешті вибухнула в повномасштабну війну – й гулям із Фронт-Рейнджу довелося втікати. На жаль, перше місце, куди вони звернулися по допомогу – це ми. Петчіс радий прийняти цих бідолах, але старожили бурчать: тисячі нових облич можуть захлиснути наші міста й поселення. Ми маємо не лише знайти їм прихисток, а й вирішити, як інтегрувати цих нужденних. Стічіс же вважає, що краще просто вигнати їх усіх назад у пустку."
nf_glowbugs_refugee.0.a: "Йдуть... і їх багато!"

nf_glowbugs_refugee.1.title: "Закіптюжений мандрівник прибуває"
nf_glowbugs_refugee.1.desc: "Таємнича постать, уся в сажі, з’явилася на землях Світляків, назвавшись «Вугільним Чарлі». Говорить загадками про молотки, цвяхи й сенс буття. Ще до того, як його хтось щось запитав, він уже полагодив три вози й один водоочисник. Його талант до ремонту незаперечний – хоч від загадок можна й з глузду з’їхати."
nf_glowbugs_refugee.1.a: "Хай живе майстер-загадник!"
nf_glowbugs_refugee.1.b: "Нам і своїх філософів вистачає."

nf_glowbugs_refugee.2.title: "Сяюча бухгалтерка"
nf_glowbugs_refugee.2.desc: "Гулька з сяючими пальцями, яка назвала себе «Марджорі Світлопальця», з’явилася з бухгалтерською книгою та торбою кришок. Каже, що колись вела фінанси у рейдерів, а вже виявила три неефективні ланки в наших караванах. Її світіння дратує деяких мешканців, але економіка справді пішла вгору."
nf_glowbugs_refugee.2.a: "Нехай керує рахунками!"
nf_glowbugs_refugee.2.b: "Гулі, що світяться, – не для бухгалтерії!"

nf_glowbugs_refugee.3.title: "Ранчер шукає притулку"
nf_glowbugs_refugee.3.desc: "Марк Ґросс, змучений найманець і колишній скотар, прибув у тяжкому стані. Його розповідь – це історія випробувань, крові та втечі через ворожу територію. Незважаючи на грубість, його досвід у сільському господарстві та бойових справах може стати неоціненним."
nf_glowbugs_refugee.3.a: "Приймаємо втомленого воїна."
nf_glowbugs_refugee.3.b: "Повернімо його назад у пустку."

nf_glowbugs_refugee.4.title: "Крейдяний пророк"
nf_glowbugs_refugee.4.desc: "Пошарпаний гуль, знаний як «Крейдяний», розмальовує стіни поселень Світляків дивними схемами. Бурмоче щось про «Великий небесний крейдодошковий план» і стверджує, що його креслення – ключ до розуміння культури пустки. Люди спантеличені, але дехто вбачає у ньому божевільного генія."
nf_glowbugs_refugee.4.a: "Хай собі малює."
nf_glowbugs_refugee.4.b: "Нам не до його маячні."

nf_glowbugs_refugee.5.title: "Чоловік у великому капелюсі"
nf_glowbugs_refugee.5.desc: "Саша «Великий Капелюх» Іванков прибув у величезному радянському кашкеті та подертій плащ-пальті. Стверджує, що з «краю криги й розбитих мрій», і говорить напівбезглуздими фразами про гриби та бартер. Дивний, але його поради вже покращили наші торгові шляхи."
nf_glowbugs_refugee.5.a: "Капелюха – в дім!"
nf_glowbugs_refugee.5.b: "Разом із грибами – назад у степ."

nf_glowbugs_refugee.6.title: "Старий з моря"
nf_glowbugs_refugee.6.desc: "Старезний гуль, що назвався «Старим з моря», прибув до нас із легендами про навігацію небезпечними водами. Каже, що пам’ятає кожен потік і річку на наших землях. Його вигляд лякає, та навігаційні вміння можуть бути надзвичайно корисні."
nf_glowbugs_refugee.6.a: "Морська мудрість нам згодиться."
nf_glowbugs_refugee.6.b: "Морські байки – не для нас."

nf_glowbugs_refugee.7.title: "Герцогиня з чайником"
nf_glowbugs_refugee.7.desc: "Гулька, що тягне за собою гігантський чайник і розібраний сервіз, влаштувала імпровізоване чаювання в поселенні Світляків. Називає себе «Порцеляновою герцогинею» й наполягає: чайний ритуал – єдиний спосіб зберегти гідність у цьому божевільному світі. Вона дивна, але її присутність – заспокійлива."
nf_glowbugs_refugee.7.a: "Сідаємо за стіл із нею."
nf_glowbugs_refugee.7.b: "Церемонії нам не потрібні."

nf_glowbugs_refugee.8.title: "Божественна комедія"
nf_glowbugs_refugee.8.desc: "Однієї зоряної ночі Петчіс дивився в небо, розмірковуючи, чи існує панчлайн буття. І тоді це сталося. Небо розійшлося, радіоактивні ангели заспівали, й потужний голос пролунав: «Петчісе, мій обраний блазень, ти мусиш вигадати жарт про… Брудуна.»\n\nСпантеличений, Петчіс записав ім’я. Наступного ранку він побачив його – Брудун сидів у центрі Купола. Просто чоловік. Увесь у багнюці. Нічого не казав. Нічого не робив. Просто... бруд. І чоловік.\n\nПетчіс кілька днів ламав голову над підводкою, панчлайном, сенсом усього цього. «Що мені РОБИТИ з Брудуном?!» – вигукнув він до Стічіса, який лише знизав плечима. І тоді Петчіс запідозрив: а може, жарт – це сам він?\n\nТепер йому слід обрати: залишити Брудунa та чекати натхнення... чи викинути цього брудного божого посланця назад, звідки він прийшов."
nf_glowbugs_refugee.8.a: "Може, колись я зрозумію цей жарт."
nf_glowbugs_refugee.8.b: "Бог був на грибах! Геть цього типа!"
#
nf_glowbugs_refugee.9.title: "Старий солдат – на новому фронті"
nf_glowbugs_refugee.9.desc: "Стічіс спирається на саморобний стіл у Куполі й спостерігає за табором біженців, який сам допоміг збудувати з нуля. Гулі та гладколиці працюють пліч-о-пліч – розвантажують припаси, будують укриття. На мить його кам’яне обличчя розпливається в рідкісній усмішці.\n\n«Казали, ми не зможемо прийняти їх усіх», – бурмоче він хрипким голосом, у якому вчувається гордість. – «А подивіться на них. У них є дім, робота і, що найголовніше, шанс.»\n\nТак, припасів не вистачає, Чорний каньйон пильно стежить, але Світляки стали сильнішими. Ризик Стічіса виправдався. Біженці стали частиною спільноти – доказом того, що навіть у пустці співчуття й рішучість мають значення."
nf_glowbugs_refugee.9.a: "Жити в мирі – це базове право, чорт забирай!"

nf_glowbugs_refugee.10.title: "Папери, будь ласка"
nf_glowbugs_refugee.10.desc: "Бар у Куполі забитий під зав’язку. Біженці, Світляки та кілька зацікавлених емісарів із Чорного каньйону зібралися, щоб почути Петчіса. Він підходить до мікрофона, регулює його й посміхається так, як тільки він уміє.\n\n«Криза біженців, га? Забавна штука – коли до тебе стукають у двері, не можна просто зробити вигляд, що тебе нема. Спробував я таке з ескадрою Братства – повірте, не скінчилося добре.»\n\nНатовп сміється, а Петчіс починає ходити сценою. «Але серйозно: треба було приймати складні рішення. Я сказав – пустімо тих, хто буде працювати. Без фанатиків, без божевільних – тільки тих, хто хоче допомогти. Чорний каньйон у захваті. “Петчіс, ти геній!” – кажуть. А я: “Ні, я просто гуль, що ненавидить бюрократію й любить кришки.”»\n\nВін нахиляється ближче до мікрофона, понижуючи голос. «Але, чесно кажучи, були й казуси. Один тип спробував пройти з коробкою солодких бомб і сяючим кротом. Гарна угода – але я відмовив.»\n\nНатовп вибухає сміхом, а Петчіс піднімає руки. «А тепер гляньте на нас! Біженці задоволені, Чорний каньйон задоволений, і я задоволений – бо забираю всі лаври. А хіба не в цьому суть лідерства? Дякую, дякую – я тут весь тиждень!»"
nf_glowbugs_refugee.10.a: "Гарна програма!"

nf_glowbugs_refugee.11.title: "Питання Рокрівера"
nf_glowbugs_refugee.11.desc: "Світляки офіційно звернулися до Чорного каньйону з нагальним проханням – передати їм територію Рокрівера.\n\nБіженці масово прямують через землі Світляків у північному напрямку. Цей потік перевантажив можливості місцевої адміністрації. І Петчіс, і Стічіс погоджуються: без додаткової землі впоратись неможливо.\n\nРокрівер – малозаселена територія під управлінням Чорного каньйону. Світляки обіцяють забезпечити там порядок, інтегрувати біженців і зробити з регіону процвітаюче поселення.\n\nОднак еліти Чорного каньйону розділені. Дехто бачить у цій пропозиції розумне вирішення проблеми, інші остерігаються надмірного посилення Світляків. Рішення – за вами: передати їм Рокрівер чи залишити собі й розгрібати хаос далі?"
nf_glowbugs_refugee.11.a: "Нехай забирають Рокрівер. Це вже їхня проблема."
nf_glowbugs_refugee.11.b: "Жодної угоди. Ми лишаємо Рокрівер за собою."

nf_glowbugs_refugee.12.title: "Стічіс вимагає допомоги"
nf_glowbugs_refugee.12.desc: "Стічіс стоїть при вході до столиці Чорного каньйону – його сяюча постать випромінює водночас втому й загрозу. Криза біженців перегнула межу, і тепер він прийшов не просити, а вимагати допомоги.\n\n«Ми тримаємо Купол на плаву, годуємо роти, які взагалі-то не наші. І що отримуємо натомість? Нічого.» – гарчить Стічіс, обпікаючи поглядом чиновників. – «Якщо ви не дасте нам руку допомоги – краще моліться, щоб я не вирішив, що вся ця “співпраця” не варта мороки.»\n\nСлова зависають у повітрі. Чорний каньйон може або надати ресурси та людей, ризикуючи втратою авторитету, або відмовити – й нарватися на гнів Світляків."
nf_glowbugs_refugee.12.a: "Добре, бери що треба – тільки йди."
nf_glowbugs_refugee.12.b: "Нічого тобі не світить, Стічіс."

nf_glowbugs_refugee.13.title: "Гуль – найкращий друг людини"
nf_glowbugs_refugee.13.desc: "Петчіс заходить у залу ради Чорного каньйону з букетом зів’ялих пустельних квітів і фірмовою посмішкою. «Панове, пані, і радіацієстійкі бюрократи, – починає він, кланяючись, – я прийшов не як лідер, а як скромний гуль із великою проблемою.»\n\nЙого промова – суцільна харизма. Він розповідає про труднощі Світляків: житло, їжа, поселення для хвиль біженців. «Гулі й біженці мають багато спільного – ми витривалі, жорсткі, і просто хочемо знайти місце, де можна жити. Але навіть нам часом потрібна допомога.»\n\nВін широко розводить руками. «Тож в ім’я співпраці, співчуття й бажання уникнути бардаку на північному кордоні – прошу вас про підтримку. Подумайте про це як про інвестицію: у добру волю, спільноту й менше головного болю для вас.»\n\nУ залі стихає гомін. Одні повірили. Інші побоюються: даси один палець – заберуть цілу руку."
nf_glowbugs_refugee.13.a: "Це наш обов’язок і відповідальність."
nf_glowbugs_refugee.13.b: "Спершу палець – потім рука. Відмова."
#
nf_glowbugs_negotiate_treaty.1.title: "Сумнівний договір"
nf_glowbugs_negotiate_treaty.1.desc: "Усередині Світляків усе частіше лунають запитання щодо договору з Чорним каньйоном. Петчіс вважає, що його можна покращити. Стічіс бачить у ньому непотрібну кабалу. Світляки мають вирішити: залишити договір, переглянути його чи вимагати повного скасування."
nf_glowbugs_negotiate_treaty.1.a: "Ми задоволені тим, що є."
nf_glowbugs_negotiate_treaty.1.b: "Йдемо за планом Петчіса."
nf_glowbugs_negotiate_treaty.1.c: "Йдемо за планом Стічіса."

nf_glowbugs_negotiate_treaty.2.title: "Договір залишається чинним"
nf_glowbugs_negotiate_treaty.2.desc: "Світляки вирішили залишити договір у його нинішній формі. Хоч він і не ідеальний, проте забезпечує стабільну основу для подальшої співпраці з Чорним каньйоном."
nf_glowbugs_negotiate_treaty.2.a: "Прагматичне рішення."

nf_glowbugs_negotiate_treaty.3.title: "Краща угода?"
nf_glowbugs_negotiate_treaty.3.desc: "На наполягання Петчіса Світляки звернулися до Чорного каньйону з проханням переглянути умови договору. Чи дослухаються до їхніх аргументів – покаже час."
nf_glowbugs_negotiate_treaty.3.a: "Вони послухають голос розуму."
nf_glowbugs_negotiate_treaty.3.b: "Це закінчиться погано."

nf_glowbugs_negotiate_treaty.4.title: "Кінець договору"
nf_glowbugs_negotiate_treaty.4.desc: "Під тиском Стічіса Світляки висунули Чорному каньйону ультиматум: договір має бути припинено. Тепер усе залежить від відповіді Чорного каньйону – вона визначить, чи залишиться мир, чи почнеться ескалація."
nf_glowbugs_negotiate_treaty.4.a: "Кінчаємо з цим – прямо зараз."
nf_glowbugs_negotiate_treaty.4.b: "Готуймось до конфлікту."

nf_glowbugs_negotiate_treaty.5.title: "Умови прийнято"
nf_glowbugs_negotiate_treaty.5.desc: "Чорний каньйон погодився на переглянуті умови. Нова угода вигідніша для Світляків: більше ресурсів, більше автономії."
nf_glowbugs_negotiate_treaty.5.a: "Перемога дипломатії."

nf_glowbugs_negotiate_treaty.6.title: "Протистояння"
nf_glowbugs_negotiate_treaty.6.desc: "Чорний каньйон відмовився зрушити з місця. Тепер Світляки стоять перед вибором: загострити ситуацію до відкритого конфлікту – або відступити й прийняти статус-кво."
nf_glowbugs_negotiate_treaty.6.a: "Війна, значить – війна."
nf_glowbugs_negotiate_treaty.6.b: "Поступимось... поки що."

nf_glowbugs_negotiate_treaty.7.title: "Договір припинено"
nf_glowbugs_negotiate_treaty.7.desc: "Договір було розірвано. Світляки тепер вільні від контролю Чорного каньйону, проте втрата структурної підтримки може спричинити нові виклики."
nf_glowbugs_negotiate_treaty.7.a: "Свобода має свою ціну."

nf_glowbugs_negotiate_treaty.8.title: "Світляки відступають"
nf_glowbugs_negotiate_treaty.8.desc: "Світляки вирішили не загострювати стосунки з Чорним каньйоном. Договір залишається чинним, але це рішення може залишити по собі осад по обидва боки."
nf_glowbugs_negotiate_treaty.8.a: "Напруга тліє мовчки."