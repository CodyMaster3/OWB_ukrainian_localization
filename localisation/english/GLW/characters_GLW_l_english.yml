l_english:
#Leaders
GLW_PATCHES_NAME: "Петчіс"
GLW_PATCHES_DESC: "Петчіс завжди вважав себе коміком. Після того, як в Середньозахідному Братстві Сталі перестали сміятися з його виступів, він вирушив на пошуки нової аудиторії. Зрештою він натрапив на Світляків, що жили поблизу опромінених руїн Боулдера. Щоночі після вдалих вилазок за їжею та припасами Петчіс проводить комедійні виступи для спільноти."
GLW_PATCHES_CULTURAL_ADVISOR: "Петчіс"

GLW_STITCHES_NAME: "Стічіс"
GLW_STITCHES_DESC: "Стічіс, якого раніше звали Бредлі з Квінсі, пройшов довгий шлях від своїх скромних витоків. Прагматичний «нормальний гуль» з винятковим талантом до виживання, Бредлі здобув своє прізвисько під час служби в Середньозахідному Братстві Сталі. Саме Петчіс почав називати його «Стічіс» – натяк на їхню тісну співпрацю та вміння Бредлі все тримати купи: від спорядження до альянсів.\n\nУ Боулдері Стічіс виконує роль головного тактика й зброяра Світляків. Це прямолінійний лідер, який вірить у наполегливу працю та підготовку – його часто можна побачити за спорядженням розвідників чи тренуванням міліції. Хоча його грубість і зневага до зайвої дипломатії можуть дратувати, результати говорять самі за себе."

GLW_COUPLE_NAME: "Гнила парочка"
GLW_COUPLE_DESC: "Петчіс і Стічіс – знані в Боулдері як «Гнила парочка» – це малоймовірний, але міцний дует, що став серцем керівництва Світляків. Їхній зв’язок почався ще в Квінсі, де Бредлі (нині Стічіс) неохоче відвідував невдалі стендапи Петчіса – мовляв, з солідарності між гулями, хоча потайки йому було трохи смішно. З часом спільні інстинкти виживання та взаємодоповнювальні вміння переросли у партнерство, без якого вони вже не уявляють життя.\n\nТепер у Боулдері їхній тандем тільки зміцнів. Петчіс надихає громаду, владнує суперечки й веде дипломатію – зокрема угоду з Федерацією Чорного каньйону, а Стічіс дбає про боєздатність: формує ополчення, укріплює оборону й, на власний подив, вчить Петчіса стріляти так, щоб не виглядати посміховиськом. Натомість Петчіс умовив Стічіса долучитися до спільних виступів – суміші невдалих жартів, сухого сарказму та бойових історій, що якось примудряються підтримувати дух громади після довгих днів вилазок і боїв.\n\nПопри розбіжності, Петчіс і Стічіс – нерозлучні. Їхнє суперництво спонукає обох вдосконалюватися – чи то в лідерстві, чи в комедії. Разом вони зробили з Боулдера не просто прихисток, а місце, де знову можна сміятися – над світом, над собою й над «Гнилою парочкою»."

#Unit Leaders (Corporals and Admirals)
GLW_FRECKLES_NAME: "Фреклз"
GLW_JOB_NAME: "Джоб"
GLW_JACKSON_NAME: "Гамма Джек, божевільний, воїн святого вибуху, владика кратера, герцог детонації, султан надкритичності, володар хаосу, вбивця розуму, носій сяючої люті, ламач стабільних ізотопів, вісник світного безумства"
GLW_JACKSON_CHARACTER_TT: "§LРівень§!: §Y4§!\n§RАтака§!: §Y5§!\n§YОборона§!: §Y2§!\n§GПланування§!: §Y2§!\n§CЛогістика§!: §Y3§!\n§gРиси:§! §tСильний§!, §tРозумний§!, та §tБіль-поїзд§!"
GLW_DIRTMAN_NAME: "Брудун"

#Ministers
GLW_BRIGHT_NAME: "Мандрівник Колорадо"
GLW_BRIGHT_ARMY_CHIEF_desc: "Мандрівник Колорадо – загадкова постать, зазвичай мовчазна, але в рідкісні моменти може запалити будь-яку кімнату, повну гулям. У нього безліч історій про мандри пустками: від засідок на каравани НКР до співпраці з Послідовниками у відновленні електрики для поселення гульців. Якщо існує якась професія – він, імовірно, вже занурював свої опромінені ноги в неї."

GLW_HERTZ_NAME: "Радіаційна мати"
GLW_HERTZ_ARMY_CHIEF_desc: "Вериті колись працювала медсестрою в Денвері. Коли впали бомби, вона спробувала врятувати стільки пацієнтів, скільки могла, ховаючи їх у безпечному підвалі лікарні. Вона сама не встигла сховатися – штовхаючи останнє ліжко, її накрило вибухом. Її тіло перетворилося на сяючого гулю, але розум зберігся дивовижно ясним. На жаль, врятовані вже залишили укриття, коли вона прокинулась. Вона знайшла дім серед Світляків і особливо зблизилася з Петчісом, іншим сяючим гулем. Разом вони мріють зцілити пустку – як тілесно, так і душевно."

GLW_DIRTY_HARRY_NAME: "Айслінґ О’Рурк"
GLW_DIRTY_HARRY_NAVY_CHIEF_desc: "Ця яскрава ірландська гулька подорожувала на розкішному лайнері з Ірландії до Бостона, але подорож виявилася квитком в один бік. Вона отямилася на узбережжі Массачусетса й багато років звикала до пустки. Харизма та феноменальна вдача не раз витягали її з халеп. Мандруючи Середнім Заходом, вона зібрала банду гулям з ірландськими акцентами, що протистояли всім, хто ставав їм на заваді. Вони прибули до Колорадо й зустріли Петчіса, який запропонував їм притулок. Ірландська банда прийняла пропозицію, і відтоді Айслінґ стала вагомою та об’єднавчою постаттю у Світляках."

GLW_WHITE_BARON_NAME: "Джебедая Барнс"
GLW_WHITE_BARON_AIR_CHIEF_desc: "Джебедая Барнс був скотарем у Колорадо до падіння бомб. Прокинувшись у новому тілі гулем, він вирішив використати свої знання у фермерстві й тваринництві, аби допомагати вцілілим. Та більшість людських громад відвернулися від нього через його стан. Урешті він знайшов свій дім серед Світляків – гулям, які не були ні релігійними фанатиками, ні комуністами. В обмін на прийняття він запропонував свої послуги як скотар."

GLW_SHEPARD_NAME: "Джулс Річі"
GLW_SHEPARD_HIGH_COMMAND_desc: "Кажуть, кращого майстра від Джулса по цей бік Міссісіпі не знайдеш. Він прибув верхи на сталевому коні, якого сам зібрав ще в Чаттанузі, і з того часу залишився. Скромна людина, бере копійки за ремонт автівок, механізмів, будівель, доріг – що завгодно. Якщо зламалося – він або полагодить, або заклеїть ізоляційною стрічкою, забризкає WD40 й прочитає молитву, аби запрацювало."

GLW_CAPTAIN_COLLINS_NAME: "Ґанбарел"
GLW_CAPTAIN_COLLINS_HIGH_COMMAND_desc: "Ґанбарел виріс у рабстві в Гангдогів, де його змусили виготовляти зброю. Та саме ця навичка, відточена десятиліттями неволі, стала ключем до його втечі – він озброїв групу в’язнів, і разом вони вирвалися на волю. Згодом він приєднався до Світляків, де нині кує зброю, щоб захищати свою нову спільноту від тиранії, яку сам пережив."

GLW_MORGEN_NAME: "Моґуї"
GLW_MORGEN_HIGH_COMMAND_desc: "Моґуї – справжній кремінь. Вона покинула колонію китайських гулям із Висушених Псів, щоб приєднатися до Світляків. Привела з собою особисту гвардію та запас військового спорядження. Швидко здобула повагу Стічіса, і відтоді вони тісно співпрацюють, плануючи оборону Світляків від зовнішніх загроз."

GLW_BELGIAN_NAME: "Марк Ґросс"
GLW_BELGIAN_HIGH_COMMAND_desc: "Марк був найманцем у караванній компанії Щасливих Стежок, поки не потрапив у засідку певного племені, що полюбляло легку розмальовку, десь на півдні Юти. Ледь уцілівши, рушив на схід і дорогою відбивався від патрулів Легіону – в надії знайти краще майбутнє. На межі смерті він дістався до притулку Петчіса, який разом із Вериті – Радіаційною матір’ю – повернув його до життя. Відтоді Марк відчуває вічний борг перед Світляками і захищає їх навіть ціною власного життя."

GLW_NILEAF_NAME: "Старий з моря"
GLW_NILEAF_HIGH_COMMAND_desc: "Старий з моря – давній гуль, чия плоть розповзається, оголюючи кістки, що витримали стільки ж жахів, скільки й сама нація за останні двісті років. Він просить називати себе просто «Старий», але чому – ніхто не знає. Зате він досвідчений моряк і має фотографічну пам’ять щодо водних шляхів Колорадо."

GLW_PROFESSOR_CROSS: "Альберт Ціммерман"
GLW_PROFESSOR_CROSS_RESEARCH_ADVISOR_desc: "Багато хто називає Альберта Ціммермана «Да Вінчі неба». Він знаний своїми літаючими пристроями, зібраними з довоєнного брухту – дивні конструкції, що якимось дивом таки здіймаються в повітря."

GLW_STINNES_NAME: "Містер Батонс і доктор Флапджек"
GLW_STINNES_ECONOMIC_ADVISOR_desc: "Містер Батонс – гуль, але наполягає, що його обвуглена правиця з порваною шкарпеткою – це його співадвайзер, доктор Флапджек. Разом вони «економічний дует геніїв», що сперечаються про вигідність торгівлі, податки на кришечки та театр з ляльками-шкарпетками як експортну розвагу. Світляки терплять їхні дивацтва, бо якось, але Батонс завжди має рацію в розрахунках."

GLW_SCHMIDT_NAME: "Масельний торговець"
GLW_SCHMIDT_ECONOMIC_ADVISOR_desc: "Приїхав у землі Світляків на іржавому мотоциклі, що капав мастилом, Масельний торговець – гуль, одержимий лише одним: бартером. Тягне з собою відра довоєнного мастила, стверджуючи, що це секрет роботи будь-чого – від зброї до серця. Його «економіка мастила-чудотворця» насправді допомогла ремонтувати місцеву техніку, тож ніхто не перечить."

GLW_WAGNER_NAME: "Вугільний Чарлі"
GLW_WAGNER_ECONOMIC_ADVISOR_desc: "Увесь покритий сажею, Вугільний Чарлі провів десятки років, куючи зброю та лагодячи металеві речі. Говорить лише загадками, змушуючи людей чухати потилиці, але його мудрі дивини завжди призводять до зростання продуктивності. Його найвідоміша фраза: «Цвях сам себе не заб’є, але молотку потрібна мета»."

GLW_STEED_NAME: "Марджорі Світлопальця"
GLW_STEED_ECONOMIC_ADVISOR_desc: "Марджорі Світлопальця здобула свій статок, оббираючи перекинуті каравани під покровом темряви, використовуючи свої світні пальці. Подейкують, що колись була бухгалтером рейдерів, а тепер із незбагненною точністю керує ресурсами Світляків – її світлі пальці зависають над книгами, які ніколи не брешуть."

GLW_RUSSIAN_NAME: "Саша «Великий Капелюх» Іванков"
GLW_RUSSIAN_ECONOMIC_ADVISOR_desc: "Саша з’явився серед Світляків у величезному радянському офіцерському капелюсі, який категорично відмовляється пояснювати. Каже, що прибув із «краю криги та розбитих мрій», а його поради рясніють нісенітницями на кшталт: «Гриб – це король бартеру!» Як не дивно, але його поради щоразу приводять до вигідних торговельних угод."

GLW_SMILEY_NAME: "Гарненький Гаррі"
GLW_SMILEY_CULTURAL_ADVISOR_desc: "Гаррі зовсім не гарненький – його шкіра обвисає, немов розплавлений віск. Та він присягнеться, що є найвродливішим гулем у пустці. Пристрасть до організації балів і показів мод для гулям додає дивної, але бажаної культури у життя Світляків."

GLW_NIX_NAME: "Крейдяний"
GLW_NIX_CULTURAL_ADVISOR_desc: "Крейдяний більшість часу проводить, розписуючи стіни поселень Світляків теоріями змов, використовуючи старі шкільні крейди, які він знаходить під час вилазок. Він стверджує, що зрозуміти культуру пустки можна лише розшифрувавши «Великий небесний крейдодошковий план». Люди терплять його, бо його божевільні міркування іноді наштовхують на цілком практичні рішення."

GLW_XUE_WEI_NAME: "Порцелянова герцогиня"
GLW_XUE_WEI_CULTURAL_ADVISOR_desc: "Ця гулька прибула, тягнучи за собою величезний тріснутий чайник і колекцію недопарованого посуду. Вона влаштовує розкішні, апокаліптичні чаювання для лідерів Світляків, наполягаючи, що чайна церемонія життєво важлива для «збереження гідності гулям у божевільному світі». Справжнього імені її ніхто не знає, але її чаювання мають дивну об’єднавчу силу."

