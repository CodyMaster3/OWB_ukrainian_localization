# Starting Ideas
treaty_of_williams_GLW_dynamic_modifier:0 "Договір із Коллінза"
glw_treaty_of_williams:0 "Договір із Коллінза"
glw_treaty_of_williams_desc:0 "За умовами Договору з Коллінза, Світляки надсилають данину Чорному Каньйону в обмін на захист і розвиток. Наскільки це справедливо – питання суперечливе.\n\n§yТягар Світляків:§!\n §gЧерез нашу зростаючу залежність, ми сплачуємо податок Чорному Каньйону у вигляді:§!\n [GLW_CAPS_TT]\n [GLW_METAL_TT]\n [GLW_COMPOSITES_TT]\n [GLW_ADVANCED_TT]\n [GLW_IFD_DONATIONS_TT]\n [GLW_MFD_DONATIONS_TT]"

glw_concession_of_laramie:0 "Концесія Ларамі"
glw_concession_of_laramie_desc:0 "Концесія Ларамі була частиною Договору з Коллінза: як компенсацію за жорсткі умови, §Y[BLC.GetNameWithFlag]§! передав територію §Y[GLW.GetNameWithFlag]§!. Проте оскільки місто раніше належало Громадам, ямпанцям це явно не до вподоби."

glw_closed_borders:0 "Закриті кордони"
glw_closed_borders_desc:0 "Гулі на півночі – вороги режиму Чорного Каньйону. Хочемо ми того чи ні, але саме ми стримуємо цю загрозу. Частина цього – сувора прикордонна політика: ніхто не проходить."

glw_closed_borders_refugee_modifier:0 "£stability_war_texticon  Щотижнева стабільність під час кризи біженців: §G-50.0%§!"

glw_closed_borders_2:0 "Закриті кордони"
glw_closed_borders_2_desc:0 "Гулі на півночі – вороги режиму Чорного Каньйону. Хочемо ми того чи ні, але саме ми стримуємо цю загрозу. Частина цього – сувора прикордонна політика: ніхто не проходить."

