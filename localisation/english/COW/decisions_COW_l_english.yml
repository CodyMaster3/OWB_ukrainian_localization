form_arizona_rangers_tt:0 "\nМи отримуємо §Yпретензії§! та знижку 25% на вартість націоналізації кожного регіону в §OАризоні§! на південь від річки Колорадо, а також кожного регіону, яким раніше володіли національні території §RЛегіону Цезаря§!.\n\n"

  COW_try_to_join_ncr:0 "Спробувати приєднатися до $new_california$"
  COW_try_to_join_california_way:0 "Спробувати приєднатися до $dharma_way$"

  COW_form_desert_rangers:0 "Відтворити §8$desert_rangers$§!"
  COW_form_desert_rangers_desc:0 "З двома базами влади — однією в §OАризоні§! та іншою в §OНеваді§! — можна з упевненістю сказати, що §8Пустельні рейнджери§! офіційно повернулися. Зробімо це офіційним. Нехай усі знають, що §8Пустельні рейнджери§! нікуди не подінуться."

  COW_legion_infuence_category:0 "Справа з §RЛегіоном§!"
  COW_lower_legion_influence:0 "Зменшити опір §RЛегіону§!"
  COW_lower_legion_influence_desc:0 "Можливо, ми й визволили §OАризону§!, але тінь §RЛегіону§! досі висить над нею. Щоб по-справжньому звільнити §OАризону§! від §RЛегіону§!, ми повинні ліквідувати всі існуючі осередки та бойові загони §RЛегіону§!, які ще існують."

  COW_reforming_the_desert_rangers_category:0 "Відновлення §8Пустельних рейнджерів§!"

  COW_choose_our_friends:0 "Вибір нашого майбутнього"
  COW_choose_our_friends_desc:0 "Аризона може бути звільнена, але ми ніколи не буваємо самі. Як ми обиратимемо своїх друзів?"

  COW_rangers_nevada:0 "Створити §8Рейнджерів Великого Басейну§!"
  COW_rangers_nevada_desc:0 "В іншому житті ми б возз'єдналися з §8Пустельними рейнджерами§! в §OНеваді§!. Не було б ні §OАризони§!, ні §OНевади§!, ні §OЮти§!, були б лише §8Пустельні рейнджери§! разом. Але все змінюється, і наші операції розпалися. §OНевада§! так багато для нас значила. Колись це була наша друга оперативна база, у старі добрі часи. §8Рейнджери Великого Басейну§! продовжать нашу справу в цьому регіоні."

  COW_rangers_california:0 "Створити §LЛос-Анджелеських рейнджерів§!"
  COW_rangers_california_desc:0 "Деякі з наших останніх і найкращих рейнджерів походять із §OМогильника§! та з §OКаліфорнії§! загалом. Ми ніколи не затримувалися надовго в §OКаліфорнії§!, оскільки §LКаліфорнійські рейнджери§! довели, що вони більш ніж здатні впоратися самі. Але враховуючи недавні провали §LНКР§!, здається, нам доведеться взятися за роботу самостійно. Сподіваємось, цього разу все вийде краще."

  COW_rangers_santa_fe:0 "Відтворити §OРейнджерів Санта-Фе§!"
  COW_rangers_santa_fe_desc:0 "Колись давно §8Пустельні рейнджери§! проводили певні пробні операції в §OНью-Мексико§!. Зрештою, ми хотіли зосередити наші дії переважно в §OНеваді§!, §OКаліфорнії§! та §OАризоні§!, щоб не розпорошувати сили. §OРейнджери Санта-Фе§! невтомно працювали, роблячи все можливе, і тепер вони повернулися — сподіваємось, за кращих обставин."

  COW_rangers_colorado:0 "Створити §4Рейнджерів Колорадо§!"
  COW_rangers_colorado_desc:0 "§OКолорадо§! завжди було мрією §8Пустельних рейнджерів§!. По суті, це була третя пустка, яку ми мали приборкати. Пустелі, міста й гори. Що ж, тепер настав час навести лад у §OКолорадо§! і втілити цю мрію в життя."

  COW_rangers_texas:0 "Створити §2Техаських рейнджерів§!"
  COW_rangers_texas_desc:0 "§8Пустельні рейнджери§! мали багато добровольців з §2Техаських рейнджерів§! на етапі свого заснування. На жаль, ми так і не познайомилися ближче, консолідуючи наші сили на заході. §2Техаських рейнджерів§! незабаром витіснило §Y[TBH.GetName]§!, і більшість з них стали §Oтехаськими§! помічниками шерифів або вирушили блукати Пусткою. Хоча ми ніколи не мали справжнього зв'язку, можливо, це шанс почати все спочатку."

  COW_rangers_plains:0 "Створити §7Рейнджерів Рівнин§!"
  COW_rangers_plains_desc:0 "§OВайомінг§!, §OМонтана§!.. О, хіба це не квінтесенція штатів ковбоїв, що скачуть рівнинами? О! І там є коні! Скажіть хто-небудь Джун."

  COW_rangers_cascadia:0 "Створити §CКаскадійських рейнджерів§!"
  COW_rangers_cascadia_desc:0 "Очевидно, у §OКаскадії§! існувала група під назвою «§CВартові Білого§!». Вони були схожі на нас, але трохи... інші. Вони були жорсткішими, холоднішими і без вагань проливали безкраї калюжі крові, щоб отримати бажане. Для нас вони виглядають як темне дзеркало того, ким би могли стати рейнджери, якби ми остаточно збилися зі шляху. Спробуймо зробити все краще, добре?"

  COW_rangers_rio_grande:0 "Створити §tРейнджерів Ріо-Гранде§!"
  COW_rangers_rio_grande_desc:0 "§OРіо-Гранде§! є дуже важливою стратегічною територією, і там є багато картелів та банд, які руйнували §OМексику§! століттями. Ми підтримаємо будь-яких борців за свободу."

  COW_rangers_latin:0 "Створити §GРейнджерів Веракрусу§!"
  COW_rangers_latin_desc:0 "Як ми взагалі забралися так далеко на південь? Що ж, подивимось, чи зможе хоч якийсь барон або культист вистояти проти нашого «Великого заліза»."

  COW_rangers_canadian:0 "Створити §3Рейнджерів Прерій§!"
  COW_rangers_canadian_desc:0 "Як ми взагалі тут опинилися? Е-е. Ну, спробуймо зробити все можливе, щоб налагодити тут справи. Просто спробуймо пояснити місцевим, що ми не якісь там «янкі», добре? Ми люди. Американці ж люди, правда?"

  COW_destroy_lanius:0 "§8Операція§! «§RСхідний терор§!»"
  COW_destroy_lanius_desc:0 "Присутність §RЛегіону§! в §OАризоні§! знищено, але ще одна причаїлася в §OКолорадо§! та §OНью-Мексико§!. Якщо її не зупинити, вона може розростися і стати тим, що ми вже одного разу зруйнували. Станьмо віч-на-віч із цим терором і покладемо край цьому §RСхідному Легіону§!."

  COW_destroy_paullus:0 "§8Операція§! «§RГоловоріз§!»"
  COW_destroy_paullus_desc:0 "Ми чули розповіді, що §RРізник із Нью-Мексико§! знову з'явився і завоював §YРеспубліку Ріо-Гранде§!. Він був переможений одного разу, і буде переможений знову."

  COW_destroy_gente:0 "§8Операція§! «§OСьєрра-Вілла§!»"
  COW_destroy_gente_desc:0 "Апатія. Мабуть, немає гіршого гріха. Усе правильно у твоєму розумі, окрім серця. Ти знаєш, що треба зробити, але відмовляєшся, бо недостатньо любиш інших, щоб це зробити. Режим §OГенералісимуса§! продав незліченну кількість зброї §RЛегіону§! і наживався на вбивстві невинних. Ми доведемо, що в цьому світі є справедливість."

  COW_destroy_hand:0 "§8Операція§! «§RЗняті рукавички§!»"
  COW_destroy_hand_desc:0 "Здається, §RЛегіон§! залишив в Пустці останню купу брамінового лайна. Вони знищили §YСамотню Зірку§!, а тепер прагнуть тероризувати решту §OТехасу§!. Покладемо край терору §RВійськового загону Руки§!."

  COW_destroy_malpais:0 "§8Операція§! «§RВідплата§!»"
  COW_destroy_malpais_desc:0 "§RЛегат Мальпаїс§! знову з'явився в §OЮті§! і починає повертатися до старих трюків. Дикуни наслідують його приклад і слова та крокують під його барабан. Цитуй Писання скільки завгодно, §WДжошуа§!. Це не скасує того, що ти зробив з нами. Тобі слід було просто залишитися у своїй печері."

  COW_destroy_whitelegs:0 "§8Операція§! «§TРозтяжка§!»"
  COW_destroy_whitelegs_desc:0 "§TСіль-На-Рани§! — це вождь дикунів, який намагається імітувати силу §RЦезаря§!, підкорюючи всю §OЮту§!. Допоможімо йому наслідувати фінальний приклад §RЦезаря§!."

  COW_destroy_eighties:0 "§8Операція§! «§2Драйв-Бай§!»"
  COW_destroy_eighties_desc:0 "§2Вісімдесяті§! були витіснені в §OЮту§! НКР. Вони продовжують займатися своїми старими справами, грабуючи й тероризуючи Великий Басейн та маршрут уздовж 80-го шосе. Зупинімо їхні двигуни."

  COW_destroy_moore:0 "§8Операція§! «§gНосій мантії§!»"
  COW_destroy_moore_desc:0 "З попелу §LНової Каліфорнійської Республіки§! постала нова загроза, гірша навіть за §RЛегіон Цезаря§!. Ця «§gПрезидентка-Генерал§!» знищила всі залишки демократії в §OКаліфорнії§! і створює режим, ще гірший за §RЛегіон§!. Здається, останнім часом лише §8рейнджери§! зберегли ясність і праведність."

  2500_inf_2000_MP: "£rifle_texticon §H2500§! £manpower1_texticon §Y2000§!"
  2500_inf_2000_MP_blocked: "£rifle_texticon §R2500§! £manpower1_texticon §R2000§!"
  2500_inf_2000_MP_tooltip: "Для прийняття рішення потрібно $2500_inf_2000_MP_blocked$"