COW_remnants_of_rangers:0 "Залишки Аризонських Рейнджерів"
 COW_remnants_of_rangers_desc:0 "§8Аризонські Рейнджери§!, які поклялися захищати вразливих від тих, хто прагне їх підкорити, десятиліттями ведуть боротьбу з §RЛегіоном Цезаря§! та його промитими мізками солдатами. Хоча Рейнджери були добре вишколені та озброєні до зубів, перед лицем переважаючих сил Легіону вони були змушені повільно здавати все більше територій. Після їхньої поразки від Легата Мальпаїса у 2271 році більшість уцілілих рейнджерів втекли за Колорадо, щоб приєднатися до Нової Каліфорнійської Республіки. Невелика ж група вирішила вирушити на південь, до останньої групи вільних поселень в Аризоні, яку лагідно прозвали «Країною Ковбоїв». Хоча рейнджерів залишилося занадто мало, щоб претендувати на лідерство в регіоні, їхня військова підготовка та досвід спецоперацій мають значний вплив на Країну Ковбоїв§!."

 COW_reformed_corps:0 "Відновлений Корпус Рейнджерів"
 COW_reformed_corps_desc:0 "§8Аризонські Рейнджери§!, які поклялися захищати вразливих від тих, хто прагне їх підкорити, десятиліттями ведуть боротьбу з §RЛегіоном Цезаря§! та його промитими мізками солдатами. Хоча Рейнджери були добре вишколені та озброєні до зубів, перед лицем переважаючих сил Легіону§! вони були змушені повільно здавати все більше територій. Після їхньої поразки від Легата Мальпаїса у 2271 році більшість уцілілих рейнджерів втекли за Колорадо, щоб приєднатися до Нової Каліфорнійської Республіки. Невелика ж група вирішила вирушити на південь, до останньої групи вільних поселень в Аризоні, яку лагідно прозвали «Країною Ковбоїв», але ми не могли ховатися від Легіону вічно. Тепер вони знову прийшли по нас, та ми змогли відкинути їх і знову повернути собі ім'я рейнджерів."

 COW_bastion_of_liberty:0 "Останній бастіон свободи Аризони"
 COW_bastion_of_liberty_desc:0 "§RЛегіон§! захопив Аризону і загрожує життю та свободі кожного, над ким він проголошує свою владу. Хоча багатьом біженцям вдалося врятуватися від армій Легіону, ще більше людей стали рабами людей Цезаря. Ми не повинні дозволити, щоб це сталося з чоловіками та жінками Країни Ковбоїв: будь-якою ціною."

 COW_legion_resistance_massive:0 "Опір Легіону: §tМасовий§!"
 COW_legion_resistance_massive_desc:0 "Ми перемогли §RЦезаря§!, але мережа зв'язків, культів, бойових загонів та племен, вірних йому та його справі, залишається. Відновлені Аризонські Рейнджери подбають про те, щоб жоден слід §RЛегіону§! більше ніколи не завдав шкоди жодній живій істоті.."

 COW_legion_resistance_large:0 "Опір Легіону: §RЗначний§!"
 COW_legion_resistance_large_desc:0 "Ми перемогли §RЦезаря§!, але мережа зв'язків, культів, бойових загонів та племен, вірних йому та його справі, залишається. Відновлені Аризонські Рейнджери подбають про те, щоб жоден слід §RЛегіону§! більше ніколи не завдав шкоди жодній живій істоті.."

 COW_legion_resistance_medium:0 "Опір Легіону: §OСередній§!"
 COW_legion_resistance_medium_desc:0 "Ми перемогли §RЦезаря§!, але мережа зв'язків, культів, бойових загонів та племен, вірних йому та його справі, залишається. Відновлені Аризонські Рейнджери подбають про те, щоб жоден слід §RЛегіону§! більше ніколи не завдав шкоди жодній живій істоті.."

 COW_legion_resistance_small:0 "Опір Легіону: §9Низький§!"
 COW_legion_resistance_small_desc:0 "Ми перемогли §RЦезаря§!, але мережа зв'язків, культів, бойових загонів та племен, вірних йому та його справі, залишається. Відновлені Аризонські Рейнджери подбають про те, щоб жоден слід §RЛегіону§! більше ніколи не завдав шкоди жодній живій істоті.."

 COW_legion_resistance_eliminated:0 "Опір Легіону: §GЗнищено§!"
 COW_legion_resistance_eliminated_desc:0 "Ми перемогли §RЦезаря§!, відновлені Аризонські Рейнджери подбали про те, щоб жоден слід Легіону§! більше ніколи не завдав шкоди жодній живій істоті.."

 ranger_training_law:0 "Вишкіл Пустельних Рейнджерів"
 ranger_training_law_desc:0 "Пустельні Рейнджери вміло справляються із суворим літом Американського Південного Заходу. Від самого зародження їхньої організації під час підготовки робився сильний акцент на розвитку знань та витривалості, необхідних для виживання та виконання завдань за несприятливих погодних умов або в екстремальних середовищах. Це, звісно, означає, що для належного введення новобранців до їхніх лав потрібно більше зусиль, але ці навички ідеально підходять для знищення тиранів та лиходіїв під пекучим сонцем пустелі."

 COW_cowboy_cooperation:0 "Ковбойська співпраця"
 COW_cowboy_cooperation_desc:0 "Незважаючи на те, що населення Країни Ковбоїв — це вперті та бойові ковбої, вони з радістю співпрацюють зі своєю громадою. Разом вони готові кинути виклик усьому світу."

 COW_always_armed:0 "Завжди озброєні"
 COW_always_armed_desc:0 "Ніколи не знаєш, що ховається за рогом, але ковбої завжди напоготові. Повністю озброєне суспільство — це безпечніше суспільство, або якось так там кажуть."

 COW_weakness_inaction:0 "Слабкість бездіяльності"
 COW_weakness_inaction_desc:0 "Я знаю, що маю робити. Я знаю, що має бути зроблено. Я знаю, що людям потрібна моя допомога. Але все одно я нічого не роблю. Можливо, це навіть гірше, ніж зазнати невдачі."

 COW_afraid_of_death:0 "Страх смерті"
 COW_afraid_of_death_desc:0 "Я не хочу помирати. Знаю, що це егоїстично, знаю, що це все, на що я заслуговую. Я просто не можу подивитися їй в очі, подивитися в очі смерті."

 COW_guerilla_fighers:0 "Досвідчені партизани"
 COW_guerilla_fighers_desc:0 "Заховані в кожному будинку Країни Ковбоїв, тихі привиди блукають кожним містом, прагнучи того дня, коли вони одного разу повернуться до дому, який люблять."
 COW_secret_rearmament:0 "Таємне переозброєння"
 COW_secret_rearmament_desc:0 "Якимось дивом на землях Країни Ковбоїв з'явився приплив професійного спорядження. Іноді на металі навіть можна побачити викарбувані армійські жетони оригінального рейнджера, який колись ним користувався."

 COW_cowboys_and_girls:0 "Ковбої та дівчата"
 COW_cowboys_and_girls_desc:0 "Немає сенсу перебирати. Чоловік чи жінка, хлопець чи дівчина — Легіон прийде по нас усіх. Нам усім краще битися разом."

 COW_long_highroad:0 "Довгий важкий шлях"
 COW_long_highroad_desc:0 "Ми так довго билися, і тепер готові йти до кінця. Ми могли б битися, поки не вибухне сонце. А чи зможе Цезар?"

 COW_end_slavery:0 "Кінець рабству в Аризоні"
 COW_end_slavery_desc:0 "Легіон був переможений, і разом з ним Аризонські Рейнджери та Ковбої офіційно звільнили пригноблених рабів Аризони раз і назавжди. Тепер сотні, якщо не тисячі людей можуть нарешті почати жити власним вільним життям."

 COW_restoring_arizona:0 "Відбудова Аризони"
 COW_restoring_arizona_desc:0 "Зі знищенням Легіону Аризона стала чистим аркушем. Рейнджер Мацко та Аризонські Рейнджери повертають Аризону до того стану, в якому вона була колись, з усім хорошим і поганим, що цьому супроводжує."

 COW_fighting_in_the_dirt:0 "Битва у багнюці"
 COW_fighting_in_the_dirt_desc:0 "§RБуде видалено після укладення миру з [COW.GetName]§!"

 COW_frontier_fighters:0 "Бійці Фронтиру"
 COW_frontier_fighters_desc:0 "Рейнджер чи ковбой, ми б'ємося разом як одне ціле. Рейнджерам може бути трохи сумно від того, що вони не змогли захистити всіх, але ми маємо найкращі шанси завдяки об'єднаному фронту."

 COW_frontier_fighters_a:0 "Бійці Фронтиру"
 COW_frontier_fighters_a_desc:0 "Рейнджер чи ковбой, ми б'ємося разом як одне ціле. Рейнджерам може бути трохи сумно від того, що вони не змогли захистити всіх, але ми маємо найкращі шанси завдяки об'єднаному фронту."

 COW_frontier_fighters_b:0 "Бійці Фронтиру"
 COW_frontier_fighters_b_desc:0 "Рейнджер чи ковбой, ми б'ємося разом як одне ціле. Рейнджерам може бути трохи сумно від того, що вони не змогли захистити всіх, але ми маємо найкращі шанси завдяки об'єднаному фронту."

 COW_frontier_fighters_ab:0 "Бійці Фронтиру"
 COW_frontier_fighters_ab_desc:0 "Рейнджер чи ковбой, ми б'ємося разом як одне ціле. Рейнджерам може бути трохи сумно від того, що вони не змогли захистити всіх, але ми маємо найкращі шанси завдяки об'єднаному фронту."

 COW_frontier_fighters_abc:0 "Бійці Фронтиру"
 COW_frontier_fighters_abc_desc:0 "Рейнджер чи ковбой, ми б'ємося разом як одне ціле. Рейнджерам може бути трохи сумно від того, що вони не змогли захистити всіх, але ми маємо найкращі шанси завдяки об'єднаному фронту."

 COW_frontier_fighters_final:0 "Бійці Фронтиру"
 COW_frontier_fighters_final_desc:0 "Рейнджер чи ковбой, ми б'ємося разом як одне ціле. Якщо справді подумати про це, ми більше не просто армія «Країни Ковбоїв». Ми — Аризона, і ми боремося за свою свободу."

 COW_relying_on_rangers:0 "Покладаючись на Рейнджерів"
 COW_relying_on_rangers_desc:0 "Аризонські Рейнджери раді отримати допомогу, вони раді вислухати ідеї та співпрацювати з тими, хто хоче битися пліч-о-пліч з ними. Але врешті-решт ця битва занадто важлива, щоб її програти, занадто небезпечна, щоб просто дозволити всім втручатися. Повірте в Аризонських Рейнджерів, і цього разу все вийде. Вони пообіцяли, а ви знаєте, що порушити обіцянку — це розбити серце рейнджера."

 COW_relying_on_rangers_a:0 "Покладаючись на Рейнджерів"
 COW_relying_on_rangers_a_desc:0 "Аризонські Рейнджери раді отримати допомогу, вони раді вислухати ідеї та співпрацювати з тими, хто хоче битися пліч-о-пліч з ними. Але врешті-решт ця битва занадто важлива, щоб її програти, занадто небезпечна, щоб просто дозволити всім втручатися. Повірте в Аризонських Рейнджерів, і цього разу все вийде. Вони пообіцяли, а ви знаєте, що порушити обіцянку — це розбити серце рейнджера."

 COW_relying_on_rangers_aa:0 "Покладаючись на Рейнджерів"
 COW_relying_on_rangers_aa_desc:0 "Аризонські Рейнджери раді отримати допомогу, вони раді вислухати ідеї та співпрацювати з тими, хто хоче битися пліч-о-пліч з ними. Але врешті-решт ця битва занадто важлива, щоб її програти, занадто небезпечна, щоб просто дозволити всім втручатися. Повірте в Аризонських Рейнджерів, і цього разу все вийде. Вони пообіцяли, а ви знаєте, що порушити обіцянку — це розбити серце рейнджера."

