 COW_relying_on_rangers_aab:0 "Покладаючись на Рейнджерів"
 COW_relying_on_rangers_aab_desc:0 "Аризонські Рейнджери раді отримати допомогу, вони раді вислухати ідеї та співпрацювати з тими, хто хоче битися пліч-о-пліч з ними. Але врешті-решт ця битва занадто важлива, щоб її програти, занадто небезпечна, щоб просто дозволити всім втручатися. Повірте в Аризонських Рейнджерів, і цього разу все вийде. Вони пообіцяли, а ви знаєте, що порушити обіцянку — це розбити серце рейнджера."

 COW_relying_on_rangers_aabc:0 "Покладаючись на Рейнджерів"
 COW_relying_on_rangers_aabc_desc:0 "Аризонські Рейнджери раді отримати допомогу, вони раді вислухати ідеї та співпрацювати з тими, хто хоче битися пліч-о-пліч з ними. Але врешті-решт ця битва занадто важлива, щоб її програти, занадто небезпечна, щоб просто дозволити всім втручатися. Повірте в Аризонських Рейнджерів, і цього разу все вийде. Вони пообіцяли, а ви знаєте, що порушити обіцянку — це розбити серце рейнджера."

 COW_relying_on_rangers_final:0 "Покладаючись на Рейнджерів"
 COW_relying_on_rangers_final_desc:0 "Аризонські Рейнджери повернулися. Вони зробили все, що могли, залучили до своїх лав кожного здібного бійця з потенціалом і тренувалися як прокляті для цієї битви. Цього разу вони переможуть. Зрештою, Пустельний Рейнджер не може померти. Вони.. просто зараз не тут."

 COW_fight_for_vengeance_attack_legion:0 "Ми б'ємося заради помсти!"
 COW_fight_for_vengeance_attack_legion_desc:0 "Якщо ви запитаєте будь-якого рейнджера, кого він втратив, він зможе перерахувати з десяток. Якщо ви запитаєте їх, скількох у них забрав Легіон, ви можете почути слова «майже всіх». Цезарю є за багато що відповідати, і ми подбаємо про те, щоб зловити його і змусити звиватися. Великий палець вниз, мудаку."

 COW_share_our_pie:0 "Ділимося нашим пирогом"
 COW_share_our_pie_desc:0 ""

 COW_running_for_the_hills:0 "Тікаємо в пагорби"
 COW_running_for_the_hills_desc:0 ""

 COW_building_in_modern_times:0 "Будівництво в сучасні часи"
 COW_building_in_modern_times_desc:0 ""

 COW_rancher_refugees:0 "Біженці з ранчо"
 COW_rancher_refugees_desc:0 ""

 COW_desert_ranger_traditions:0 "Традиції Пустельних Рейнджерів"
 COW_desert_ranger_traditions_desc:0 "Пустельні Рейнджери ніколи не йшли на компроміс зі своїми ідеалами, ніколи не прогиналися перед можновладцями чи жадібними. Вони боролися за те, що було правильним, за будь-яку ціну і незважаючи на те, що казали негідники."

 COW_part_of_something_greater:0 "Частина чогось більшого"
 COW_part_of_something_greater_desc:0 "Пустельні Рейнджери — це лише один ствол серед багатьох, спрямованих на рабовласників і тиранів Пустки. Аризонські Рейнджери мають можливість стати частиною чогось більшого, чогось прекрасного. Навіть якщо Рейнджер Мацко тихо оплакує втрату їхньої незалежності."

 COW_on_our_own:0 "Самі по собі..."
 COW_on_our_own_desc:0 "Аризонські Рейнджери крокують уперед, сміливо та рішуче. У них багато роботи, багатьом людям потрібно допомогти і багато місць відвідати. Але тихо вночі можна почути, як вони плачуть. Вони — останні, хто залишився в живих, і останні, хто носить зірки."

