COW_BILLY_CLANTON_NAME:0 "Біллі Клентон"

  COW_BILLY_CLANTON_DESC:0 "Дезертир з Аризонських рейнджерів ще за багато десятиліть до битви за Кінгман, Біллі опинився в дивному становищі, коли останні залишки рейнджерів втекли на південь. За десятиліття після свого дезертирства Біллі поступово здобув владу, пропагуючи ізоляціонізм: перед обличчям Бика це здавалося чесною метою. Проте його старі симпатії нікуди не зникли: як Клентон міг відвернутися від залишків рейнджерів, якими б розбитими вони не були? Після багатьох безсонних ночей він пішов на компроміс із самим собою, погодившись дозволити рейнджерам осісти в Країні ковбоїв, якщо вони погодяться не мілітаризуватися. Зрештою, Клентон не міг ризикувати гнівом Цезаря. Цезар колись прийде за ними, але, можливо — лише можливо — не сьогодні."

  COW_BILLY_CLANTON_ADVISOR_DESC:0 "§7«Вона змусила мене пообіцяти берегти Маю..»§!\n\nДехто з §8Аризонських рейнджерів§!, особливо новачки, помилково вважає, що Біллі Клентон дезертирував зі служби невдовзі після падіння Фінікса. Причина, як нагадує їм і собі Біллі, значно слабша. За десятиліття до Кінгмана, за роки до Фінікса, Біллі Клентон втратив доньку. У її перший рік служби в рейнджерах вона потрапила в засідку легіонерів, захищаючи звичайний, нічим не примітний караван. Вона допомогла всьому каравану безпечно дістатися Фінікса, але невдовзі після цього стікла кров'ю.\n\nВаргас втішав його, кажучи, що її смерть не була марною, що вона віддала своє життя, аби врятувати людей з того каравану. Але караван не перевозив нічого особливо цінного. Чому хтось має вмирати за щось настільки просте? Втрата єдиної дитини та єдиної рідної людини повністю зламала його. Зрештою він відмовився від боротьби і незабаром тихо пішов.\n\nКовбої прийняли такого самотнього бродягу, як він, і завдяки своїм навичкам рейнджера-ветерана він став здібним лідером і шанованим стрільцем на пенсії в країні. Цілком природно, що ковбої його поважали.\n\nЙого першим рішенням як їхнього фактичного лідера було тримати ковбоїв осторонь війни рейнджерів за Аризону. Насправді він покинув рейнджерів двічі. Він пошкодував про це лише тоді, коли їх не стало, і йому довелося дивитися в очі тим, хто вижив."

  COW_BILLY_CLANTON_GENERAL_DESC:0 "Якби Біллі Клентон загинув під час інциденту в Кочісі, він увійшов би в історію як багатонадійний рейнджер, який помер героєм. Якби Біллі Клентон загинув під час війни проти Легіону, він увійшов би в історію як могутній рейнджер-ветеран, один із найкращих.\n\nАле Біллі Клентон вижив. Він вижив, щоб втекти від свого обов'язку та заклику до дій. Тепер Аризона згоріла під прапором Легіону, і все це відбулося на його очах. Що ще тут можна сказати?"

  COW_GERARD_MACZKO_NAME:0 "Джерард Мацко"

  COW_GERARD_MACZKO_DESC:0 "§Y«Мабуть, Варгас мав рацію. Я так і не навчився відпускати.»§!\n\nДжерард Мацко виріс у Кінгмані, ще до того, як прийшов §RЛегіон§!. Він знав його як дике, різноманітне та цікаве місце. Він часто жартував, що Аризона була його першим коханням, із такою кількістю племен, культур та історій. Він приєднався до §8Аризонських рейнджерів§!, сподіваючись побачити більше Аризони та змінити світ на краще. Він навіть знайшов друзів і сім'ю в організації. Для нього життя було ідеальним.\n\nЙого серце розривалося, коли він бачив, що Цезар зробив з Аризоною.\n\nНе бажаючи відпускати єдиний дім, який він коли-небудь знав, рейнджер Мацко бився до самого кінця. Навіть коли Пустельних рейнджерів змусили відступити в Мохаве, Мацко відмовився покидати штат, який він полюбив ще хлопчаком. Він розійшовся з рейнджерами і повів усіх, хто був готовий протистояти тиранії Легіону, до Країни ковбоїв.\n\nХоча Джерард був розчарований відмовою Клентона дозволити їм переозброїтися та реорганізуватися, він розумів, що люди Аризони важливіші за вирішення особистих образ із Легіоном. Хоча, можливо, він єдина людина у всій Країні ковбоїв, яка не боїться вторгнення Цезаря або його численних племінних васалів.\n\nКоли прийде час — а він прийде — він нарешті зможе §Rзвести рахунки.§!"

  COW_GERARD_MACZKO_GENERAL_DESC:0 "Колись уславлена вогнева група Пустельних рейнджерів, яка вирішила багато племінних та бандитських конфліктів, як силою, так і без неї, §8Вогнева група 734§! була безжально пережована і виплюнута биком Легіону, навіть не зменшивши його боєздатності. Рейнджер Мацко вижив лише завдяки тому, що знепритомнів серед купи тіл; його візор був розбитий кувалдою. Його знайшло та врятувало підкріплення, заради якого він так запекло тримав оборону.\n\nНаступного дня Легіон повернувся з такими ж могутніми силами, що зробило жертву 734-ї абсолютно марною. У дійсно погані дні Мацко думає про 734-ту — про Пебст та Інакі — і про своє бажання повернутися з ними додому."

  COW_GERARD_MACZKO_COMMANDER_DESC:0 "§Y«Звання генерала-рейнджера не має належати мені.»§!\n\nДжерард Мацко ніколи не мав стати лідером, він це знає. З моменту свого рекрутування все, що робив Джерард, — це виконував накази. Він знає, який вигляд має справжній лідер. Капітан Вогневої групи 734 знала, як вести переговори, коли застосовувати силу, коли тиснути, а коли поступатися. Вона завжди розуміла, як дивитися на людей та проблеми.\n\nЯкби ви запитали його, ким би він замінив генерала-рейнджера Варгаса, він би назвав себе останнім. Рішення проблем для Мацка завжди полягало в тому, щоб пустити кулю в те, що стоїть на його шляху. Поза межами військової тактики Мацко вважав за краще дозволяти своєму капітану говорити і вести за собою. Робота з людьми ніколи не була його коником.\n\nАле оскільки капітан Пебст мертва, а Варгас за багато миль звідси, роль лідера Аризонських рейнджерів знехотя лягла на плечі рейнджера Мацка. Як найбільш досвідчений і боєздатний рейнджер на місці, і той, хто першим відмовився покинути Аризону, він був кандидатом номер один для всіх. Він ніколи не скаржився і точно ніколи не виказував своєї невпевненості, але, продовжуючи очолювати Аризонських рейнджерів, він ставить собі лише одне запитання.\n\n«Що б зробила капітан Анелі?»"

  COW_GERARD_MACZKO_LEADER_DESC:0 "Хоча сам рейнджер Мацко ніколи б цього не визнав, він — найближче до поняття «лідер», що є в §8Аризонських рейнджерів§!. Ця роль була нав'язана йому. Інші надто фанатичні, недосвідчені або ж старі та виснажені, щоб належним чином вести §8Аризонських рейнджерів§! у майбутнє. Більшість рейнджерів, як новачків, так і ветеранів, вважають, що він чудово справляється як імпровізований командир. Але Мацко досі сумнівається у своїх рішеннях. Якби була його воля, головним був би Біллі Клентон або Варгас. Але не він. Хто завгодно, тільки не він."

  COW_JUNE_BAKER_NAME:0 "Джун Бейкер"

  COW_JUNE_BAKER_DESC:0 "§3«Ви, рейнджери, не такі вже й погані, але не забувайте, чия це країна.»§!\n\nБейкер насправді не є прізвищем Джун, вона взагалі його не пам'ятає. Колись вона була сиротою в Пустці, і за нею наглядав лише брат, який також ніколи не давав їй прізвища. Брат залишив Джун саму в містечку Ваяхо, навіть не попрощавшись. Вона підозрює, що це сталося через те, що він вважав себе поганим опікуном і вірив, що жителі Країни ковбоїв виховають її краще за нього. Але її це не обходило, вона просто хотіла бути з братом.\n\nВона витратила роки на його пошуки, але незважаючи на те, що він був найманцем і подорожував по всій західній Пустці, вона так і не змогла його знайти. З часом вона забула навіть звук його голосу і риси обличчя. Після багатьох розчарувань і пригод вона повернулася до Ваяхо.\n\nНавички, здобуті під час подорожей, допомогли їй ще більше зміцнити громаду Країни ковбоїв. Коли вона повернулася, Біллі Клентон вже більш-менш був головним, але її дитинство, проведене в Країні ковбоїв, і прагнення допомагати зробили її дуже популярною фігурою в громаді. Коли виникали розбіжності між ковбоями та рейнджерами, Джун Бейкер зазвичай ставала на бік ковбоїв.\n\nРейнджери, Біллі Клентон — вони всі хороші люди. Але вони не ковбої. Вони не такі, як Джун."

  COW_SCOTCHMO_NAME:0 "Скотчмо"

  COW_SCOTCHMO_DESC:0 "§G«Рейнджери!? Що ви тут робите!? А я чув, що ви повернулися в Неваду чи десь там! З поверненням! Це треба обмити!»§!\n\nЗі Скотчмо завжди можна посміятися, хоча якщо пізнати його ближче, цей сміх дається не так легко. За словами Скотчмо, він почав пити, коли померла його дружина, щоб забути біль. Єдина проблема в тому, що це так і не спрацювало, тож усе, що він робив, — це намагався сховатися на дні пляшки. Багатьох пляшок.\n\nВін забагато п'є і пахне, як шахта в Нідлз. Але, варто віддати йому належне, у ньому все ще є іскра бажання робити добро. Саме з цієї причини він приєднався до §8Аризонських рейнджерів§!, ще коли вони існували. Він трохи втратив себе після того, як §RЛегіон§! розгромив рейнджерів, здавалося б, назавжди, але швидко взяв себе в руки, коли почув, що Ебігейл Лі розпитує про повернення рейнджерів.\n\n…На жаль, він трохи заблукав. Замість того, щоб опинитися з Рейнджерами-відступниками в Неваді, старий добрий Скотчмо опинився в Країні ковбоїв, на превеликий подив і шок своїх товаришів, які переховувалися. Але, можливо, це було благословенням. На півдні є повно негідників, з якими можна битися, і ковбоїв, з якими можна випити!"

  COW_ALYX_NORD_NAME:0 "Алікс Норд"

  COW_ALYX_NORD_DESC:0 "§O«Верхівка ніколи багато про нас не говорила. З цього не зробиш гарної преси.»§!\n\nАлікс входила до старого підрозділу Пустельних рейнджерів, сформованого близько двадцяти років тому, особисто відібраного Анджелою Дет та генералом Варгасом. «§8Ангели Дет§!», як їх називали, виконували роботу, за яку жоден інший рейнджер не хотів братися. Постійні диверсії та тотальна війна були їхнім життям. Вона швидко засвоїла: іноді, щоб зробити добру справу, треба бути дуже поганою людиною.\n\nПотім прийшов Легіон.\n\nНародившись рабинею, Алікс як ніхто інший знала, наскільки праведною і священною для світу була ця боротьба. Але попри всі її зусилля, рейнджери не змогли зупинити бурю Легіону, що насувалася. Коли надійшов наказ відступати за річку Колорадо, рейнджер Норд приєдналася до тих небагатьох рейнджерів, які були готові залишити все позаду, щоб зберегти Аризону вільною.\n\nОфіційно вона та решта §8Аризонських рейнджерів§! перебувають у самоволці (AWOL). Хоча «самоволка» мало що означає, коли самих рейнджерів фактично не існує.\n\nМожливо, рейнджери зараз розділені, але Алікс продовжуватиме битися з Легіоном до свого останнього подиху."

  COW_ALYX_NORD_GENERAL_DESC:0 "Під час війни між Рейнджерами та Легіоном «Ангели Дет» зіткнулися з першими фрументаріями Цезаря. Хоча спочатку рейнджери мали перевагу, фрументарії швидко в них вчилися. На пізніх етапах війни фрументарії повністю нейтралізували «Ангелів Дет» та їхні операції за підтримки навахо-перевертнів.\n\nПринаймні тепер, здається, обидві сторони знають про старі фокуси одна одної."

  COW_COWBOY_COUNCIL_NAME:0 "Рада ковбоїв"

  COW_COWBOY_COUNCIL_DESC:0 "Раду ковбоїв можна описати як пряму демократію, що складається з кожної громади, яка належить ковбоям Аризони. З відходом Біллі Клентона виникло багато проблем, пов'язаних з управлінням та представництвом новоприбулих у їхній громаді.\n\nАле з допомогою §8Аризонських рейнджерів§! все має пройти гладко."

  COW_TED_BESSIE_NAME:0 "Тед Бессі"

  COW_TED_BESSIE_DESC:0 "§1«Я люблю свого сусіда, але свою сім'ю я люблю більше.»§!\n\nТед Бессі — один із багатьох водних баронів у Країні ковбоїв, що отримали владу через відсутність справжнього централізованого уряду на цих землях. Там, де одні називають їх здирниками, що приховують воду від ферм і міст, Тед віддає перевагу терміну «ділові підприємці з інженерним мисленням».\n\n§8Аризонські рейнджери§! не дуже його люблять, але Тед та інші барони все одно залишаються єдиною причиною, чому хтось взагалі може їсти чи пити в Країні ковбоїв. Це, а також обіцянки від рад і самого Клентона призвели до того, що водні барони мають непропорційно багато влади в країні.\nАле це не матиме жодного значення для §RЛегіону§!, коли вони прийдуть зі своїми мачете та хрестами."

  COW_FRED_PETTERSON_NAME:0 "Фред Петтерсон"

  COW_FRED_PETTERSON_DESC:0 "§8«Зробімо це востаннє, Командо Ехо.»§!\n\nРоки не були надто прихильними до Фреда. У нього немає вуха і кількох зубів, а одне з його очей — лише біла куля. Але, крім цього, він, здається, у хорошій формі. Коли §RЛегіон§! нарешті розбив §8Аризонських рейнджерів§!, він відправив свою дружину в Каліфорнію з Варгасом та іншими, а сам залишився з рейнджерами в Країні ковбоїв. Йому не вдалося передати їй звістку, але він знає, що вона в безпеці десь у Могильнику.\n\nФред наполягає на тому, що він готовий до бою, оскільки служив разом з Анджелою Дет під час інциденту в Кочісі, але найкраще використання його навичок — це тренування наших рекрутів та ополченців, щоб вони були готові стати рейнджерами."

  COW_FRED_PETTERSON_GENERAL_DESC:0 "Рейнджери Команди Ехо колись були найвидатнішими героями §8Аризонських рейнджерів§!. Жоден підрозділ чи команда навіть близько не стояли, окрім команди Варгаса та Анджели. Але навіть велика Команда Ехо не змогла врятувати Аризону. Хоч би скільки офіцерів Легіону вони вбили, хоч би скільки разів вони намагалися вбити Цезаря і його легата, §RЛегіон§! завжди примудрявся виходити переможцем.\n\nПеттерсон рішуче налаштований сміятися останнім, навіть якщо це буде лише його відлуння, що лунатиме довго після його смерті."

  COW_FRED_PETTERSON_ECO_DESC:0 "§8«Іноді я сумую за Санта-Фе..»§!\n\nФред Петтерсон ласкаво прозваний «Пістолетом Пітом» рейнджерами та постійними клієнтами його крамниці за його влучну стрільбу, чудовий вибір вогнепальної зброї та чесну натуру продавця. Піт був одним із небагатьох §8Пустельних рейнджерів§! Нью-Мексико, найнятих на піку розквіту організації. Народившись і вирісши в Санта-Фе, він провів поза своїм першим домом більше років, ніж прожив у ньому.\n\nВтім, зараз це вже не так сильно обтяжує його думки. Рейнджери — це сім'я, а сім'я — це дім."

  COW_RANGER_ROOK_NAME:0 "Рейнджер Рук"

  COW_RANGER_ROOK_DESC:0 "§R«Ніколи не терпів хуліганів, а Легіон повністю з них складається.»§!\n\nЗавжди діючи швидше, ніж мозок встигає збагнути, Рук залишився таким самим, яким був у часи молодого рекрута. Рідко можна побачити такого балакучого й агресивного рейнджера, але Рук ідеально це втілює. З самого дитинства йому доводилося майже постійно битися, щоб заслужити повагу братів, сестер та громади.\n\nЙого натура аутсайдера та ненависть до гнобителів повсюди зробили його ідеальним рейнджером, але також призводили до того, що він брав на себе більше, ніж міг подужати. Сама лише чиста пристрасть не здатна повалити Легіон, але Рук продовжуватиме битися до останнього подиху."

  COW_RANGER_ROOK_GENERAL_DESC:0 "Рейнджери Команди Ехо зустріли рівного собі супротивника у Фініксі, коли легат Мальпаїс вийшов проти них особисто. Незважаючи на початкову перевагу в чисельності, легат зумів перестріляти їх у руїнах старого футбольного стадіону Фінікса. Це була їхня найгірша поразка, і тих, хто не загинув під час нападу, піддали тортурам, а потім розіп'яли. Лише Рук і Петтерсон вибралися живими.\n\nТепер Команди Ехо більше немає, але ті, хто вижив, досі їх пам'ятають."

  COW_LAZARO_FLORES_NAME:0 "Ласаро Флорес"

  COW_LAZARO_FLORES_DESC:0 "§3«Іноді, щоб знайти себе, потрібно знову себе втратити.»§!\n\nРейнджер Флорес був у глибокому підпіллі. Після того, як §RЛегіон§! Цезаря вигнав §8Аризонських рейнджерів§! за Колорадо, ні ті, хто в Аризоні, ні ті, хто в Неваді, не змогли знайти Флореса. Усі сторони просто визнали, що він трагічно загинув, як і багато інших.\n\nТак було до 2274 року, коли Флорес повернувся, одягнений лише в броню та спорядження різних полеглих легіонерів і найманців, посланих по його душу. Опинившись у пастці в каналізаційних тунелях Фінікса, рейнджер Флорес останні кілька років боровся за своє життя як привид. Йому вдалося вирватися і втекти в пагорби лише під час хаосу репресій Легіону проти міста за саму лише думку про повстання. Він радий, що нарешті знову може розмовляти з людьми, і дехто з нас думає, що він трохи з'їхав з глузду у своєму бажанні звільнити Фінікс від Легіону, але він тут і готовий до роботи. Чого ще можуть просити Аризонські рейнджери?"

  COW_IGNACIO_LOZADA_NAME:0 "Ігнасіо Лосада"

  COW_IGNACIO_LOZADA_DESC:0 "§7«Будьте обережні! У нас більше немає розкішної Цитаделі.»§!\n\nРейнджер Лосада із сумом констатує, що він є найдосвідченішим лікарем у Країні ковбоїв. Безумовно, Клентону та ковбоям сумно це чути, адже він не стуляє пельки з цього приводу. Перевантажений роботою, страждаючи від нестачі припасів та персоналу, Лосада подбає про те, щоб усі знали про проблеми лікарів Країни ковбоїв. Через це з ним важко працювати, але в глибині душі ми просто ненавидимо усвідомлювати, що він має рацію."

  COW_DOUGLAS_STEELE_NAME:0 "Дуглас Стіл"

  COW_DOUGLAS_STEELE_DESC:0 "Колись Стіл був §8Пустельним рейнджером§!, як і решта Аризонських рейнджерів. Але коли §RЛегіон§! переміг, він виконав наказ перетнути річку Колорадо і підкоритися Договору про об'єднання 2271 року. Як і багато інших Пустельних рейнджерів, він знайшов своє призначення в роботі з найбільш цивілізованою силою в Пустці та захисті її громадян.\n\nАле старі образи вмирають важко, і коли він почув, що §LНКР§! надсилає припаси до Країни ковбоїв для боротьби з §RЛегіоном§!, він зголосився повернутися до своїх колишніх товаришів, сподіваючись зробити все можливе, щоб розбити Легіон раз і назавжди. Або, принаймні, переконатися, що ковбої та рейнджери безпечно відступлять через Каліфорнійську затоку."

  COW_TOTALLY_REALLY_FRFR_EDUCATED_MAYOR_NAME:0 "Мер Луні"

  COW_TOTALLY_REALLY_FRFR_EDUCATED_MAYOR_DESC:0 "§0«Моє ім'я — це просто прикрий збіг, рейнджери..»§!\n\nРоджер Луні завжди вірив у силу посади мера та доброзичливої демократії. Однак він був засмучений, дізнавшись, що його позиція є меншістю в усій Країні ковбоїв. (Принаймні, у більш освічених колах). Бачте, сильне місцеве самоврядування і децентралізація — це чудово, доки у вас є якісь стандарти. Нерідко мерами стають люди, які, хоч і пристрасні, але повні профани. Або ще гірше, шахраї!\n\nТитул на кшталт «Мер Луні» не справляє гарного першого враження. Він міг би змінити прізвище, але Роджер — гордий представник родини Луні. Просто це дуже невдале прізвище, коли ти мер Гіла-Бенд."


COW_CHARLOTTE_TAWNY_NAME:0 "Шарлотта Тоні"

  COW_CHARLOTTE_TAWNY_DESC:0 "§8«Дбай про свою зброю, і твоя зброя подбає про будь-кого, про кого ти захочеш.»§!\n\nУ Країні ковбоїв люди пишаються зброєю, якою володіють. Вона ніби продовження тебе самого; те, як ти ставишся до своєї зброї та як її використовуєш, говорить багато про що. Шарлотта Тоні знає про це найбільше. З тієї миті, як вона навчилася ходити, зброя завжди була в її руках або десь поруч. Дехто з рейнджерів кривився, почувши це, але більшість ковбоїв навіть оком не моргнуть від такої історії.\n\nНа кожній збройовій виставці Шарлотта демонструє свої роботи і пропонує відремонтувати або модифікувати будь-яку зброю. Дійшло до того, що навіть деякі §8Аризонські рейнджери§!, які зазвичай самі обслуговують і здобувають більшу частину свого спорядження, почали звертатися до неї за порадами та допомогою."

  COW_THE_WAY_OF_THE_RANGER_NAME:0 "Шлях рейнджера"

  COW_THE_WAY_OF_THE_RANGER_DESC:0 "§YІ ми продовжимо битися,\nБо є зло, яке треба здолати,\nІ наші перемоги ростуть з кожним роком.\nБо незважаючи на всі небезпеки,\nСтарі Пустельні рейнджери...\nЩо ж, світ знає, що ми вистоїмо.\n\nТак, Рейнджери тримаються!\nМи б'ємося пліч-о-пліч!\nКрізь темряву, хаос і страх.\nВід світанку Нульового року\nСвіту були потрібні герої,\nТому Рейнджери повинні вистояти.§!\n\nВід Техаських рейнджерів до Аризонських, від Пустельних рейнджерів до Рейнджерів §LНКР§! та Невади — рейнджер робить те, що правильно. Справа надихає рейнджерів, і вони завжди використовують усе доступне, щоб виконати завдання.\n\nАле важливо знати ще дещо: жоден рейнджер, який загинув під час виконання службових обов'язків, ніколи не буде забутий, і його смерть ніколи не буде марною... чи невідплаченою."

  COW_FARLIE_ROSLAN_NAME:0 "Фарлі Рослан"

  COW_FARLIE_ROSLAN_DESC:0 "§t«Вибухівка — як хороша спеція. Якщо дати замало, далеко не заїдеш. Якщо дати забагато, можеш опинитися на підлозі, благаючи про лікаря.»§!\n\nНайкращі старателі, як до, так і після війни, завжди пам'ятали про вибухівку. Старатель Рослан чудово знається на її застосуванні в обох професіях. Само собою зрозуміло, що вибухівка корисна для шахтарів, але неправильне використання може призвести до обвалів або травм. Що ж до збирачів брухту («післявоєнних» старателів), то ніколи не знаєш, коли доведеться підірвати двері, які неможливо зламати, або коли знадобиться швидкий вибух, щоб втекти від рейдера чи мутанта.\n\nНіхто не знає, коли Фарлі прибула до Країни ковбоїв. Незважаючи на відсутність родинних зв'язків у цьому регіоні, старожили наполягають, що Фарлі була тут із самого дитинства. Рейнджери підозрюють, з огляду на її незвичайний досвід і дисципліну в поводженні з вибухівкою, що вона мала інше минуле. Можливо, кримінальне життя або членство в одній із численних організацій Пустки, втрачених у пісках часу. Але не варто на цьому зациклюватися. Вона — місцевий експерт із вибухівки, і для них це єдине, що має значення."

  COW_GASPAR_HARJO_NAME:0 "Гаспар Харджо"

  COW_GASPAR_HARJO_DESC:0 "§8«Ще одне завдання, і я повертаюся додому, добре?»§!\n\nДжун зустріла Гаспара з сумнозвісної оклахомської родини Харджо на сході, після того як не змогла повернути гральний борг їхньому сімейному казино. Конфлікт переріс у насильство, і в результаті він переслідував її по всій Пустці протягом решти її подорожі. Саме завдяки йому вона так і не заїхала далі Луїзіани. Попри їхні ворожі стосунки, Гаспар часто втручався на боці Джун, якщо бачив, що вона потрапила в засідку. Його виправданням було те, що вона потрібна йому живою, аби розплатитися з родиною. Зрештою, здавалося, що Гаспар і Джун провели більше часу працюючи разом, ніж одне проти одного. Останнє, що зробила Джун перед поверненням додому в Країну ковбоїв — виплатила борг, але Гаспар усе одно поїхав за нею «про всяк випадок».\n\nХоча він і наполягає, що з хвилини на хвилину повернеться до Оклахоми, він усе одно продовжує виконувати дрібні доручення та завдання для жителів Країни ковбоїв, часто зі знижкою. Він би ніколи цього не визнав, але глибоко в душі він радий мати справжнього друга в небезпечній Пустці. Ковбої також раді мати поруч благородного найманця."

  COW_TOMAS_GUERRARO_NAME:0 "Томас Герреро"

  COW_TOMAS_GUERRARO_DESC:0 "§7«Зазвичай ти не живеш довго, роблячи дурниці.»§!\n\nТомас Герреро не з тих легендарних «довоєнних гулів». Трохи розчаровує, коли кажеш людям, що тобі насправді не 200 років, а трохи більше 30. Вирісши в Мексиці, Герреро був кинутий у кімнату з радіоактивними бочками після того, як не зміг врятувати кохання всього свого життя від місцевих картелів. Керуючись лише бажанням вижити і врятувати кохану, він їв гриби і пив з дірявої труби, сподіваючись прожити достатньо довго, щоб влаштувати засідку на того дурня, який згодом відчинить двері. Через 6 днів його бажання нарешті здійснилося, але не зовсім так, як він очікував.\n\nВін справді вирвався на волю і вирізав непідготовлених членів картелю, які хотіли його мучити, але його кохана Серафіна вже загинула від їхніх рук. Гірше того, знепритомнівши серед мерців, невдовзі він прокинувся як ще один гуль Пустки. Якби він не зробив дурницю — не закохався в дівчину з кантини і не вліз через неї в перестрілку, — можливо, з ними обома все було б гаразд. Тепер, живучи в Країні ковбоїв, він попереджає кожного молодого стрільця не бути надто самовпевненим. Інакше вони закінчать гірко й самотньо, як він."

  COW_FELIPE_SARMANIEGO_NAME:0 "Феліпе Сарманієго дель Кастільйо"

  COW_FELIPE_SARMANIEGO_DESC:0 "§0«Я просто хочу знову побачити своє справжнє кохання — небо.»§!\n\nФеліпе опинився в Країні ковбоїв через свою любов до неба. Він виріс у заможній родині в Гондурасі, і ніщо ніколи не привертало його уваги так, як мрія побачити, як злітають численні уламки літаків, розкидані по всій країні. Втомившись від постійних війн і не бажаючи бути призваним до армії, він провів підліткові роки, лагодячи літак для втечі. Він хотів приземлитися десь у Каліфорнії, бо роками чув чутки, що це цивілізована країна без воєн.\n\nАле в літаку, який він відремонтував, закінчилося пальне, і він розбився в Країні ковбоїв. Місцеві жителі ставилися до нього, як до якогось прибульця або ангела. Ніхто ніколи не літав так далеко і так високо, як Феліпе. Останні кілька років він вивчав англійську, але з прибуттям §8Аризонських рейнджерів§! (багато з яких двомовні), можливо, все налагодиться! Тепер, якби тільки хтось пояснив йому, що таке «§RЛегіон§!»."

  COW_RICARDO_GOMEZ_NAME:0 "Рікардо Гомес"

  COW_RICARDO_GOMEZ_DESC:0 "§4«Ваші плоскі поля для мене просто не такі прекрасні, як відкрите море.»§!\n\nГомес виріс у Пуерто-Пеньяско, в межах Країни ковбоїв, завжди маючи вигляд на море. Він супроводжував батька і братів на риболовлю, часто отримуючи привілей битися з гігантськими мутованими звірами на хвилях і ловити їх. Але він завжди відчував розчарування через недоліки човнів, які вони використовували.\n\nПізніше Рікардо, за допомогою друзів та родини, подорослішав і створив кілька комерційних поромів, які допомагали перевозити відвідувачів та місцевих жителів через усю Каліфорнійську затоку. З огляду на наближення Легіону, §8Аризонські рейнджери§! благали його допомогти якомога більшій кількості людей врятуватися морем у разі їхньої можливої поразки."

  COW_ERROR_UNKNOWN_NAME:0 "«Джон Доу»"

  COW_ERROR_UNKNOWN_DESC:0 "§t«'Недільний друг' — це друг для тих моментів, коли зручно йому, але ніколи не буде таким для вас.»§!\n- Журнал «Домогосподарки Аризони», 2059 рік.\n\nНіхто не знає справжнього імені Джона Доу. Справа не в тому, що він загадковий, а в тому, що він майже ніколи не з'являється поруч, щоб його можна було запам'ятати. Не те щоб містер Доу надто переймався тим, щоб зробити його відомим. Він платить кришками, але у кожного є своя теорія про те, чому в нього їх так багато, і як він став власником ранчо в сільській місцевості Країни ковбоїв. Провідна теорія, судячи з того, як він постійно розказує про свою любов до аризонської природи і (відносної) тиші ковбоїв, полягає в тому, що він один із багатьох багатих магнатів з Каліфорнії, який приїхав сюди, щоб згодом тихо піти на пенсію.\n\nЗвісно, хоча він і каже, що любить цю країну, а його гроші витрачаються так само приємно, містер Доу, здається, просто зникає, коли сюди пробираються бандити або легіонери. Якось Джун пред'явила йому це, і зрештою він погодився допомогти профінансувати будь-які будівельні проєкти, якщо вона просто дасть йому спокій. Але незалежно від того, яку допомогу він надає, ніхто не може забути, наскільки він ненадійний."