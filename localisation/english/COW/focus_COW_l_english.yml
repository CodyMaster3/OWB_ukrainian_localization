  # loc written by Applefries, AND IMPLEMENTED BY ME REAL!!!!!!!!!!!!!!! MWHAHAHAHAH

  #main tree

COW_pie_slice:0 "Наш маленький шматочок свободи"
 COW_pie_slice_desc:0 "Країна ковбоїв — наш дім, милий дім, і він завжди стояв за наші права та свободи. Немає нікого, ні рейнджера, ні легіонера, хто міг би відібрати це в нас."

 COW_fear_makes_man_ugly:0 "Страх змушує людину робити жахливі речі..."
 COW_fear_makes_man_ugly_desc:0 "Легіон не вбиває швидко. Ні, для них це було б милосердям. Це повільно, болісно, нестерпно. Коли їм врешті-решт набридає розривати вас на шматки, вони кидають ваше тіло тим, кого ви любите. Як попередження тим, хто може захотіти битися. Деякі люди прислухаються до цього попередження, навіть коли почуття провини з'їдає їх зсередини."

 COW_rangers_arrive:0 "Аризонські рейнджери прибувають"
 COW_rangers_arrive_desc:0 "З падінням Цитаделі рейнджерів в Аризоні, §8Пустельні рейнджери§! були змушені відступити до Мохаве. Деякі з них не могли відпустити Аризону і втекли до останнього відомого їм безпечного місця. Щоб уберегти Країну ковбоїв від вторгнення, вони погодилися не проводити ремілітаризацію та не здійснювати операції на території Легіону. Для багатьох це було обурливо, але як інакше вони могли б захистити Аризону, якщо не без їхньої згоди?"

 COW_cant_hide_no_more:0 "Більше не сховаєшся"
 COW_cant_hide_no_more_desc:0 "Цей день завжди мав настати. Не можна тікати вічно."

 COW_ring_town_bell:0 "Бийте в міський дзвін"
 COW_ring_town_bell_desc:0 "Скликайте всі ратуші, збирайте всіх у кожній коморі, нам потрібно повідомити людям, що Легіон наближається."

 COW_look_at_attics:0 "Зазирніть на свої горища!"
 COW_look_at_attics_desc:0 "Неважливо, чи це сімейна реліквія, особистий подарунок або ваша власна заначка. Нам потрібна зброя, щоб битися! Якщо ви не зробите свій внесок, ми всі мертві!"

 COW_dig_in_backyard:0 "Копайте на задньому дворі!"
 COW_dig_in_backyard_desc:0 "Колись нам доведеться заплатити комусь, щоб закопати ці ями назад, але поки що ми відкопали всі схованки зі зброєю, які змогли знайти. Довоєнні та післявоєнні!"

 COW_riding_bear_into_battle:0 "Верхи на ведмеді в бій"
 COW_riding_bear_into_battle_desc:0 "§LНова Каліфорнійська Республіка§! та Країна ковбоїв можуть мати свої розбіжності, але є одне, що нас об'єднує: ми обидві терпіти не можемо §RЛегіон§!. Чесно? Це найбільше применшення століття. Ми робимо це вже так біса довго! Наш опір, безсумнівно, додасть НКР впевненості, щоб підтримати нас. Разом ми звільнимо Аризону раз і назавжди!"

 COW_take_anyone_can_get:0 "Я візьму будь-кого, кого зможу знайти!"
 COW_take_anyone_can_get_desc:0 "Ми не маємо розкоші «вибирати», битися чи ні. Якщо ти можеш тримати гвинтівку, ти згодишся."

 COW_no_really_anyone:0 "Ні, справді будь-кого!"
 COW_no_really_anyone_desc:0 "Наркомани, звичайні злочинці або гулі та мутанти. Неважливо, яке минуле у того, хто б'ється поруч із нами. Для §RЛегіону§! це не матиме значення."

 COW_pay_to_find_your_heart:0 "Я навіть заплачу тобі, щоб ти знайшов своє серце!"
 COW_pay_to_find_your_heart_desc:0 "У кращому світі люди допомагали б людям безкоштовно. Але в цьому кращому світі Пустельні рейнджери не зникли б, борючись із §RЛегіоном§!. Ми зробимо все, щоб зупинити Легіон, навіть якщо це означає залізти у власні кишені..."

 COW_hard_long_road:0 "Важкий і довгий шлях"
 COW_hard_long_road_desc:0 "Легіон — це величезна імперія, і навіть за допомогою рейнджерів та ковбоїв ми не можемо очікувати, що переможемо їх за одну ніч. Ця війна триватиме місяці, якщо не роки. Якщо ми втомимося, якщо здамося, ми можемо вважати всіх наших друзів і родичів рабами або трупами на загальному огляді.\n\nМи повинні продовжувати тиснути і підготувати наших солдатів до довгого шляху попереду."

 COW_bask_in_sun:0 "Грітися на сонці"
 COW_bask_in_sun_desc:0 "Ми взяли Ту-Сан. Хоча деякі гулі наполягають на тому, щоб називати його «Тусон». Якщо ми пообіцяємо зберегти Культ Нас у регіоні, ми, ймовірно, зможемо отримати деяку підтримку для боротьби з Легіоном у племені. Зрештою, принаймні ми даємо їм вибір битися за нас."

 COW_cowboy_angy_grrrrrr_so_scawyyy:0 "Гнів ковбоя"
 COW_cowboy_angy_grrrrrr_so_scawyyy_desc:0 "Коли ми прийшли в Аризону, все було інакше, ніж коли ми її залишали. Важко зберігати спокій серця на руїнах свого дому. Ми намагаємося з усіх сил тримати ситуацію під контролем, але роки насадження способу життя «правосуддя фронтиру» призвели до того, що неминучі жорстокі репресії, які Легіон завдав би нам, тепер використовуються проти них самих."

 COW_forgive_me_mama:0 "Пробач мені, мамо"
 COW_forgive_me_mama_desc:0 "Чи бився Легіон чесно проти Пустельних рейнджерів? Чи бився Легіон коли-небудь чесно в Нью-Мексико, Колорадо, Неваді та Каліфорнії? Ми не повинні відкидати жоден метод, який може врятувати наші шкури. Ми зможемо відповісти за свої гріхи, коли помремо від старості в оточенні близьких."

 COW_rangers_memory:0 "Пам'ять рейнджера"
 COW_rangers_memory_desc:0 "Ми втратили так багато на своєму шляху, і все ж ми пам'ятаємо всі їхні імена. Давайте відкриємо меморіал, щоб ми та наші діти ніколи не забули мучеників, які віддали свої життя, щоб захистити нас."

 COW_alive_we_are_alive:0 "Живі! Ми живі!"
 COW_alive_we_are_alive_desc:0 "Я... Я не можу в це повірити! Ми билися з §RЛегіоном§! і вижили! Неважливо, що буде потім, Легіон затіяв з нами бійку, і ми показали їм де раки зимують! Відтепер тільки це матиме значення."

 COW_free_them_all:0 "Звільніть їх усіх!"
 COW_free_them_all_desc:0 "В Аризоні так багато рабів, і з чого нам взагалі почати? Принаймні вони вели записи."

 COW_welcome_home_failure:0 "Ласкаво просимо додому, невдахо"
 COW_welcome_home_failure_desc:0 "Повернення в Аризону відчувається дивно, але насправді воно лише висвітлило те, наскільки сильно ми її підвели. Нічого подібного більше ніколи не повинно статися. Ніколи знову."

 COW_cowboy_sunset:0 "Захід ковбоя"
 COW_cowboy_sunset_desc:0 "Біллі думав, що почуття провини зникне, як тільки він врятує Аризону. Він зробив те, чого не змогли б зробити разом найвидатніші з рейнджерів. Він згуртував свій новий дім на боротьбу за себе, і він перевершив усі очікування. Але навіть попри це, голоси мертвих, побитих, похованих і зломлених переслідують його кожної миті. Особливо зараз, коли шоковані ковбої та рейнджери відкривають для себе все нові й нові злочини Легіону.\n\nЦе дійсно була повністю його провина. Якби він тільки спробував, він би §Rпереміг§!."

 #military tree

 COW_ugly_kid_ranger:0 "Малюк, рейнджер та потвора"
 COW_ugly_kid_ranger_desc:0 "Бойові сили Країни ковбоїв не є об'єднаною армією, чого й слід було очікувати від такої децентралізованої нації. Це чудово працювало з ворогами, які поступалися нам чисельністю, але §RЛегіон§! — це величезна, організована і дисциплінована армія, яка розбила навіть §8Аризонських рейнджерів§!.\n\nПотрібні кардинальні зміни на випадок, якщо §RЛегіон§! вирішить переглянути нашу присутність тут..."

 COW_gates_of_hell:0 "Можеш поставити мене біля Брами Пекла"
 COW_gates_of_hell_desc:0 "Рейнджери — всі чудові хлопці, але ми більше не можемо очікувати, що вони зроблять усю роботу самі! Ми всі візьмемо участь у боротьбі, подобається їм це чи ні! Це також наш дім!"

 COW_cling_to_lifeline:0 "Чіпляючись за наші лінії життя"
 COW_cling_to_lifeline_desc:0 "Якщо міста — це життєво важливий орган, то дороги — наші вени. Якщо Легіон не замовкає про свої «безпечні дороги», то й ми не будемо!"

 COW_need_bodies:0 "Нам потрібно більше людей!"
 COW_need_bodies_desc:0 "Коли прийде Легіон, ми повинні тримати лінію фронту. Якщо розірветься одна ланка, порветься весь клятий ланцюг! Зробімо так, щоб у хлопців було достатньо товаришів, аби підтримувати одне одного в бою."

 COW_lessons_with_legion:0 "Уроки, засвоєні з Легіоном"
 COW_lessons_with_legion_desc:0 "Легіон переміг, тому що §8Пустельні рейнджери§! поступалися чисельністю та озброєнням. Насправді не має значення, чи ти найшвидший стрілець в Аризоні, якщо тебе оточують двадцять маніяків з мачете. Зробімо так, щоб не дати їм ані дюйма простору для прориву!"

 COW_what_are_we_fighting_for:0 "За що ми б'ємося?"
 COW_what_are_we_fighting_for_desc:0 "Ти маєш запитати себе, за що ти б'єшся. Мотивований боєць — це незламний боєць. Легіон проведе нас через пекло, а ми просто загартуємося в ньому! Якщо ми не захистимо нашу сім'ю, ніхто інший цього не зробить!"

 COW_cowboy_rallies_town:0 "Ковбой згуртовує місто"
 COW_cowboy_rallies_town_desc:0 "Іноді в історії самотній ковбой розуміє, що не готовий самостійно приймати виклики світу. Він згуртовує місто, щоб протистояти найбільшим світовим лиходіям, і разом вони виходять переможцями. Залишається сподіватися, що в реальному житті це працює так само."

 COW_wont_back_down:0 "Але я не відступлю"
 COW_wont_back_down_desc:0 "Тільки §8Аризонські рейнджери§! здатні перемогти §RЛегіон§!. Не дозволяймо надто завзятим цивільним постраждати через наші помилки."

 COW_arizonas_last_spark:0 "Остання іскра Аризони"
 COW_arizonas_last_spark_desc:0 "Вогонь, який колись був вільною Аризоною, згас до простої тліючої жарини тут, у Країні ковбоїв. Ми зробимо все можливе, щоб роздмухати полум'я, яке спалить прапор §RЛегіону§! дотла."

 COW_fight_for_vengence:0 "Ми б'ємося заради помсти"
 COW_fight_for_vengence_desc:0 "Під владою Легіону мають бути тисячі рабів. Чи можете ви взагалі порахувати тіла невинних, залишених на їхньому шляху? Не сумнівайтеся, ми помстимося за них усіх. Інакше ми підемо на дно, забравши з собою якомога більше їхніх життів."

 COW_cling_to_our_values:0 "Тримаючись за наші цінності"
 COW_cling_to_our_values_desc:0 "З самого початку, від нашого походження як нащадків Інженерного корпусу Національної гвардії Аризони, ми присягнулися захищати кожного невинного в Пустці та гарантувати їхнє право на власний вибір. Якщо ми коли-небудь підемо на компроміс, коли-небудь прогнемося, коли-небудь дозволимо собі відійти від цієї праведної мети, це буде день, коли світ знову прийде до свого кінця."

 COW_time_for_new_blood:0 "Час для свіжої крові"
 COW_time_for_new_blood_desc:0 "Хоча нам, безумовно, потрібно виховати нове покоління §8Аризонських рейнджерів§!, ми не можемо просто брати кожного надто завзятого хлопчину та відправляти його на вірну смерть. Ми будемо дотримуватися нашої суворої підготовки, але також залишатимемося відкритими для нових ідей та нових рекрутів."

 COW_cowboys_big_return:0 "Велике повернення ковбоя"
 COW_cowboys_big_return_desc:0 "Ми повернулися, Аризоно. §8Аризонські рейнджери§! повертаються додому."

 COW_army_of_freedom:0 "Армія вільних"
 COW_army_of_freedom_desc:0 "Наша армія складається з людей будь-якого походження. Рейнджер, ковбой, найманець, лучадор, мутант, неважливо! Головне, що ми — остання опора вільної Аризони. Якщо §RЛегіон§! хоче забрати Країну ковбоїв, їм доведеться пройти через нас!"

 COW_cowboys_without_horses:0 "Ковбої без коней?!?"
 COW_cowboys_without_horses_desc:0 "У тих старих фільмах ковбої їздять верхи на тих химерних істотах, схожих на собак — конях. Але у нас немає коней! Як ми можемо називати себе ковбоями без коней?!"

 COW_more_stable_transport:0 "Більш стабільний транспорт"
 COW_more_stable_transport_desc:0 "Знаєте, я гадаю, що всім цим речам можна знайти практичне застосування. Більше не потрібно змушувати брамінів тягати вантажі. Але який ковбой одночасно ще й далекобійник?!"

 COW_its_called_horsepower:0 "Це називається кінські сили..."
 COW_its_called_horsepower_desc:0 "...Але мені дуже сумно бачити, що всередині двигуна немає жодного коня!"

 COW_fine_ill_try_your_wagon:0 "Добре. Я спробую твій віз."
 COW_fine_ill_try_your_wagon_desc:0 "Мабуть, ковбой може виглядати круто і в машині. Принаймні, якщо правильно сидіти. Але мотоцикл! Ковбой на мотоциклі... Це ж так само добре, як і на коні, чи не так?"

 COW_look_em_in_eye:0 "Дивись їм в очі"
 COW_look_em_in_eye_desc:0 "У будь-якій ковбойській дуелі, чесній чи ні, ти маєш дивитися супернику просто в очі. Хіба що він носить маску чи окуляри, тоді... Роби все, що в твоїх силах, мабуть."

 COW_walk_five_paces:0 "Відійди на п'ять кроків..."
 COW_walk_five_paces_desc:0 "Якщо ви занадто близько, варто збільшити дистанцію. Це не тільки для того, щоб ускладнити вам завдання! На кону також ваше життя! Більша дистанція означає меншу мішень, як для вас, так і для них. Можливо, якщо ви обидва промахнетеся, ви могли б просто оголосити нічию?"

 COW_turn_around:0 "Повернися..."
 COW_turn_around_desc:0 "Ось і все, пан або пропав. Треба діяти швидко. Швидко обертайся, швидко діставай зброю. Деякі люди ловлять кайф від одного лише передчуття того, що буде потім."

 COW_draw:0 "ДІСТАВАЙ ЗБРОЮ!"
 COW_draw_desc:0 "Швидше! Перевір, чи ти ще не вмер!"

 COW_trading_spurs_for_wings:0 "Міняючи шпори на крила"
 COW_trading_spurs_for_wings_desc:0 "У цих краях повно розбитих літаків. Чому б нам не полагодити їх і не подивитися, чого ми можемо з них навчитися?"

 COW_plenty_of_fields_to_crash:0 "Повно полів, щоб розбитися"
 COW_plenty_of_fields_to_crash_desc:0 "Виявляється, літати досить важко! Добре, що у нас немає багато гір чи будинків, у які можна врізатися."

 COW_how_do_you_do_fancy_pants:0 "Як ти це зробив, піжоне?!"
 COW_how_do_you_do_fancy_pants_desc:0 "О, ці самовпевнені міські франти з Каліфорнії та Техасу..! Вони вже в усьому розібралися, так? Що ж, ми теж маємо у всьому розібратися! Але, можливо, вони не будуть проти, якщо ми трохи скопіюємо їхні креслення."

 COW_who_said_cowboys_cant_fly:0 "Хто сказав, що ковбої не вміють літати?"
 COW_who_said_cowboys_cant_fly_desc:0 "Казав же, що ми врешті-решт впораємося! Тепер ми можемо пролити пекло з небес на всіх, хто спробує посягнути на наші домівки."

 #economy tree

 COW_home_on_the_range:0 "Дім у преріях"
 COW_home_on_the_range_desc:0 "Тут мирне життя. Ви рідко почуєте про нас погане слово. Але життя завжди може стати кращим."

 COW_i_know_the_tohono:0 "Я знаю Тохоно"
 COW_i_know_the_tohono_desc:0 "Народ Тохоно здебільшого тримається осторонь. Їм так подобається, і нам так подобається. Як сусіди вони просто чудові. Але вони бояться війни так само, як і ми. Біллі не хотів би їх турбувати, але рейнджер Мачко благає його навідатися до них. Ковбої потребують будь-якої допомоги, і якщо вони програють... Тохоно будуть наступними."

 COW_refugees_rangers_ranchers:0 "Біженці, рейнджери та фермери"
 COW_refugees_rangers_ranchers_desc:0 "Фермери Боделіо — наші природні брати. Як і ми, вони об'єднані спільною справою біженців і фермерів у боротьбі проти §RЛегіону§!, який хоче знищити наш спосіб життя. У скрутні часи ми повинні допомагати одне одному.\n\nЯкщо у фермерів все добре, то було б чудово залучити і наших сусідів! Якщо ж §RЛегіон§! дістався до них, давайте допоможемо нашим друзям, поки ще можемо."

 COW_where_wayward_ranger_roam:0 "Блудний рейнджере, де ж ти блукав?"
 COW_where_wayward_ranger_roam_desc:0 "Рейнджере, о рейнджере, де ж ти блукаєш? Рейнджере, о рейнджере, чи знайшов ти шлях додому?"

 COW_i_wanna_see_a_city:0 "Я хочу побачити міську дівчину!"
 COW_i_wanna_see_a_city_desc:0 "Очевидно, деякі молодики кажуть, що не хочуть плутатися з сільськими дівчатами, вони хочуть зустріти справжню, модну, міську красуню! Старше покоління нарікає на такі смаки, але справжня проблема в тому, що немає жодної міської дівчини, яка захотіла б приїхати сюди! Нам потрібно стати повністю «сучасними», щоб вони з'явилися і поплескали нам своїми віями."

 COW_everyone_does_their_part:0 "Кожен робить свій внесок"
 COW_everyone_does_their_part_desc:0 "Знаєш, у Легіоні тебе просто розпорять, якщо ти байдикуватимеш. Я вважаю, що дати ляпаса — це набагато краще, чи не так? Якщо ми маємо працювати, то і ти маєш працювати!"

 COW_everyone_gets_a_piece:0 "Кожному дістанеться шматок!"
 COW_everyone_gets_a_piece_desc:0 "Ми гуртуємося разом, працюємо разом і отримуємо вигоду разом. Саме це робить наш шматочок дому кращим за інші."

 COW_cowboy_city:0 "Ковбой-Сіті"
 COW_cowboy_city_desc:0 "Деякі з наших крихітних містечок вже не такі й малі. Ми розрослися до справжньої міської агломерації! Тепер усілякі міські жителі хочуть зустрітися з нами заради інвестицій і торгівлі. Бути міським франтом не так вже й погано."

 COW_a_long_walk_to_water:0 "До води йти довго..."
 COW_a_long_walk_to_water_desc:0 "Зараз вода зробила багатьох людей дуже багатими. Тому деякі з них будуть не надто задоволені нашими планами зробити більш доступні колодязі з водою в кожному місті. Але їм доведеться з цим змиритися, гаразд? Якщо вони мають реальну проблему з тим, що люди нарешті зможуть пити у своїх власних домівках, можливо, їм варто поговорити з нашими рейнджерами."

 COW_talk_to_prospectors:0 "Поговоріть зі старими старателями"
 COW_talk_to_prospectors_desc:0 "Старательство все ще залишається важливою частиною нашої економіки! Хоча нам і не так пощастило мати складні Сховища чи цікаві довоєнні військові дослідницькі бази, тут напевно знайдеться щось хороше. Ми підемо поговоримо зі старожилами і подивимося, чи не знайшли вони чогось цікавого."

 COW_theres_money_in_them_mines:0 "У цих шахтах є гроші!"
 COW_theres_money_in_them_mines_desc:0 "Хто б міг подумати?! Виявляється, тут повно мінералів і блискучих камінців, які ми можемо продати і використати! До нас з'їжджатимуться люди звідусіль, сподіваючись розбагатіти!"

 COW_you_dont_build_a_barn:0 "Ви не \"Будуєте\" комору!"
 COW_you_dont_build_a_barn_desc:0 "Деякі з наших хлопців намагаються будувати за власним замовленням. Їхні власні проєкти. Вони що, дурні? Це займе цілу вічність! Ми маємо оптимізувати цей процес."

 COW_what_do_you_think_this_is:0 "Як гадаєте, який зараз рік? 1785-й?"
 COW_what_do_you_think_this_is_desc:0 "Слухайте, я знаю, що ми ковбої і все таке, але деякі будівлі, які ми звели, просто потворні та старі. Давайте знесемо деякі з будинків, які нам не подобаються, і побудуємо кращі."

 COW_got_that_building_up_to_code:0 "Приведіть цю будівлю до нормативів!"
 COW_got_that_building_up_to_code_desc:0 "Тепер, коли ми справді придивляємося до цього, багато наших будинків побудовані зі старого сухостою і не є достатньо міцними конструктивно. Це непогано працювало для апокаліпсису, але це не дуже добре зараз, коли ми всі об'єднані і «вільно любимо» чи щось таке. Давайте підтягнемо всіх до нашого стандарту!"

 COW_from_houses_to_homes:0 "Від будинків до домівок"
 COW_from_houses_to_homes_desc:0 "Знаєте, ми не такі вже й погані в цьому будівництві! Можливо, ми могли б навіть почати будувати домівки для інших людей. Але принаймні наш шматочок раю отримав найзатишніші, наймиліші та найгостинніші домівки у Пустці."

 COW_country_living:0 "Сільське життя"
 COW_country_living_desc:0 "Насправді немає нічого кращого за життя в провінції! Відкритий простір, свобода робити те, що хочеш, працювати на себе. Це найкраще. Недарма ж дехто з тих багатих міських жителів прагне втекти і приєднатися до нас."

 COW_california_cowboys:0 "Каліфорнійські ковбої"
 COW_california_cowboys_desc:0 "Нова Каліфорнія. Хіба це не чудово? Давайте відправимо кількох людей за річку і подивимося, чи зможемо ми щось з них витягти. Виводьте красномовців і всіх інших."

 COW_texas_red:0 "Техас Ред"
 COW_texas_red_desc:0 "У Техасі, здається, все гаразд, але деякі люди сумують за часами, коли все було набагато простіше. Жодних тобі супермутантів або паладинів Братерства, які б'ються всюди, руйнуючи їхні речі. Очевидно, ми нагадуємо їм про ті простіші часи! Деякі з них — колишні §BТехаські рейнджери§!, деякі — бандити-втікачі. Гей, якщо ви не створюєте проблем, ласкаво просимо до нас!"

 COW_we_get_our_say:0 "Ми всі маємо право голосу"
 COW_we_get_our_say_desc:0 "Кажіть про нас що завгодно, просто пам'ятайте, що ми — єдина справжня демократія у Пустці. Кожен має право голосу, кожен може прийти до наших маленьких ратуш і висловити свою думку. Навіть у клятій НКР якийсь політик чи бюрократичний покидьок говорить за вас. Але не тут!"

 COW_do_it_for_yourself:0 "Зроби це для себе!"
 COW_do_it_for_yourself_desc:0 "Як там кажуть? Дай людині рибу, і вона буде сита один день? Зачекайте, ні. Кажуть, дай рибі людину... І вона їстиме весь день. Ні, ні. Це точно не так...\n\nНагадайте мені про це пізніше, добре?"

 COW_getting_folks_up_to_speed:0 "Вводячи людей у курс справи"
 COW_getting_folks_up_to_speed_desc:0 "Децентралізація — це спосіб життя Країни ковбоїв, яким вона найбільше пишається. Однак кожен хоче навчати свою дитину по-своєму! Ніхто не знає, що до чого, і в нас немає спільної бази знань. Ось чому ми відкриваємо школи в кожному місті Країни ковбоїв. Можливо, деякі діти залишаться на домашньому навчанні, але, безсумнівно, багатьом з них сподобається мати однокласника, який не є їхнім двоюрідним братом вдвічі старшим за них."

 COW_look_out_for_yourself:0 "Дбай про себе..."
 COW_look_out_for_yourself_desc:0 "Ти можеш покладатися лише на одну людину, яка завжди дивиться на тебе в дзеркало. Працюй старанно, і працюй на себе. Це хороший спосіб життя."

 COW_look_out_for_each_other:0 "...І дбайте одне про одного!"
 COW_look_out_for_each_other_desc:0 "Хоча ти завжди маєш дбати про себе, це не означає, що немає нікого, кому можна довіряти. Знаєш, ти не можеш робити все сам. Іноді добре мати когось, хто прикриє твою спину."