nf_COW.1.t:0 "Наш маленький шматочок свободи"
  nf_COW.1.d:0 "Країна ковбоїв була заснована задовго до того, як Легіон уперше ступив на землі Аризони. Хоча, незважаючи на назву, було б помилкою вважати Країну ковбоїв «країною» в найпрямішому сенсі цього слова. Після війни Країна ковбоїв виникла скоріше неформально. Термін «Країна ковбоїв» використовувався не для опису єдиної держави, а радше як назва регіону відносного миру.\n\nМіста по всій Сонорі та Аризоні, маючи спільний інтерес відбиватися від банд рейдерів і нападів диких мутантів на їхні прилеглі землі, домовилися захищати одне одного в разі виникнення загрози.\nАле, крім обіцянок приходити на допомогу, міста і ферми Країни ковбоїв мали мало спільного. Натомість вони дозволили світу проходити повз них, насолоджуючись своїм тихим і безтурботним життям у Пустці.\n\nНа жаль, загрози безпеці Країни ковбоїв не є рідкістю. Незважаючи на всі наші зусилля, безліч людей або створінь прагнуть дістатися до нас. Хай то будуть неконтрольовані роботи, рейдерські банди, гангстери чи польові командири, ми все одно не плануємо здаватися без бою. Як то кажуть:"
  nf_COW.1.a:0 "Говори м'яко..."
  nf_COW.1.b:0 "...і тримай у руках великий кийок!"

  nf_COW.2.t:0 "Біллі Клентон, Пустельний рейнджер (що дезертирував)."
  nf_COW.2.d:0 "До Падіння Аризони, до Битви за Кінгман, до Битви за Фінікс, Біллі Клентон колись був найкращим Пустельним рейнджером у світі. Як люблять казати старожили, таких більше не роблять.\n\nДайте йому зброю, і він знайде 20 різних способів вбити вас нею.\nПокажіть йому перешкоду, і він зламає її менш ніж за хвилину.\nДайте йому сім'ю, і він зробить усе, щоб її захистити.\n\nАле коли Легіон прийшов в Аризону, Біллі Клентона ніде не було видно. Роки війни та втрат змучили його, і коли Легіон забрав його єдину доньку, він зламався.\nВін збирався вирушити до Мексики, але натомість опинився в Країні ковбоїв. Місцеві жителі запропонували йому безпечний притулок, місце для відпочинку. Він так і не продовжив свою подорож. Його броня рейнджера-ветерана тепер припадає пилом у кутку ранчо, і, можливо, він ніколи більше її не одягне.\n\nВін каже собі, що ще одне тіло нічого б не змінило. Пустельні рейнджери були приречені тієї самої хвилини, коли кинули виклик Цезарю та його армії поневолених племен. Але почуття провини продовжує гризти його, навіть довго після того, як їх не стало.\n\nЩо, якби? — думає він. Що, якби він допоміг? Що, якби вони перемогли у Фініксі? У Кінгмані? Що, якби він зробив хоч щось, *будь-що*, а не втік?\nВін ніколи цього не дізнається, але ця хмара досі висить над його головою. Клентон живий, але іноді йому здається, що краще б він був мертвим. Яка користь від боягуза у важкі часи?"
  nf_COW.2.a:0 "Шкода, що мені забракло сил зробити те, що мало бути зроблено."
  nf_COW.2.b:0 "Я все ще не хочу вмирати."

  nf_COW.3.t:0 "Аризонські рейнджери приходять у місто"
  nf_COW.3.d:0 "Пустельні рейнджери вистежили Біллі Клентона після його дезертирства. Хоча вони були не дуже задоволені його вчинком, вони не хотіли і не могли нічого зробити, щоб змусити його повернутися. Пустельні рейнджери були повністю добровольчими силами, а це означало, що повернутися до них спиною було твоїм особистим вибором.\n\nКоли Легіон зрештою здолав рейнджерів, ті нечисленні, хто хотів залишитися в Аризоні, пробралися до схованки Клентона. Побачивши їх, він спершу хотів наказати ковбоям прогнати їх. Аризонські рейнджери були приречені на смерть, усі до одного. Якби вони прийшли сюди, це було б схоже на поширення чуми співучасті у злочинах проти Легіону. Легіону було б байдуже, підтримують місцеві жителі рейнджерів чи ні, їх би все одно звинуватили.\n\nАле, побачивши побитих і зломлених рейнджерів, Біллі не міг не відчути певних сентиментів щодо старих часів. Він був зобов'язаний рейнджерам усім у своєму житті, як хорошим, так і поганим. Не кажучи вже про те, що Країна ковбоїв стала місцем, куди він міг втекти. Чому б не дозволити це й їм?\n\nЇм дозволили залишитися, але заборонили відкрито пропагувати ідеї рейнджерів або відновлювати діяльність. Не маючи іншого вибору, рейнджери погодилися. Але чутки про їхнє виживання і вигнання до Країни ковбоїв ходили не просто так..."
  nf_COW.3.a:0 "Банди рейдерів просто почали «зникати»."
  nf_COW.3.b:0 "У нас просто виявилася зайва зброя, добре?"

  nf_COW.4.t:0 "Останній рубіж ковбоїв"
  nf_COW.4.d:0 "«Легіон наближається, але ми все одно вистоїмо!»\n\nБіллі Клентон відсторонено дивиться вперед, поки натовп перед ним вітає слова Джун Бейкер. Він стоїть на помості перед ратушею Ваяхо, відчуваючи лише жах від радісних і сповнених захоплення облич чоловіків і жінок Країни ковбоїв. Рейнджери, ковбої та бажані гості — усі стоять пліч-о-пліч перед обличчям Легіону. Його погляд ковзає вбік, спостерігаючи, як Джун підбурює їх усіх. Її серце на правильному місці, і він знав, що завжди може покластися на неї, коли треба підготувати людей до зустрічі з небезпекою.\n\nВін дивиться в інший бік: рейнджер Мачко стоїть у дальньому кутку помосту. Він схрестив руки на грудях і, здається, так само заворожено дивиться на натовп, як і Джун.\n\n«Ці виродки вже мертві, просто вони ще цього не знають!» — кричить Джун, здіймаючи кулак до натовпу, і ті відповідають радісним ревом та вигуками. Клентон щосили намагається посміхатися, але його думки неминуче повертаються до покарань за опір Легіону.\n\nВ очах пече, він кліпає, і по його щоках повільно котяться сльози. Він пам'ятає, яким щасливим був, коли Варгас уперше згуртував рейнджерів. Він пам'ятає удар холодної, жорстокої реальності у Фініксі. Це як бачити повторення історії, і Клентон знає, чим усе закінчилося для тих, кому вистачило сміливості битися з Легіоном.\n\nВін продовжує посміхатися, махаючи рукою разом із Джун, поки ковбої розбігаються за своєю зброєю. Легко уявляти себе стрільцем, який прийшов урятувати всіх. Не так легко уявляти себе бідолахою, якого пристрелять. Його серце важчає від страху, коли він бачить вранішнє сонце, а з ним — прийдешній день і прийдешню війну.\n\nВін надягає свій шолом Пустельного рейнджера, знаючи, що може просто померти в цій броні."
  nf_COW.4.a:0 "Тепер їхня черга діставати зброю."

  nf_COW.5.t:0 "ЗВІТ - ПРОБАЧ МЕНІ, МАМО"
  nf_COW.5.d:0 "Війна ніколи не змінюється. Пам'ятаєш, хто першим почав говорити це в Цитаделі?\n\nЇхні обличчя розмиваються в моїй пам'яті. Я краще пам'ятаю, як втрачав їх, аніж те, як обіймав. Це смішно, адже я роблю все це заради них, але вже не пам'ятаю, як вони виглядали. Як звучали їхні голоси.\n\nНаші операції проходять успішно. Будь-якого високопоставленого центуріона, якого ми знаходимо, ми виставляємо напоказ так само, як вони робили б це з нами. Ми взялися за пошук пов'язаних із Легіоном караванів і підриваємо їх самі, просто щоб знищити їхню базу цивілізованої підтримки та лінії постачання. Ми наказали нашим військам мінувати припаси та обладнання, які ми залишаємо під час відступу. Деякі з наших людей скаржаться на біль у пальцях від мінування доріг та полів. Осередки опору глибокого прикриття повідомляють про успішне отруєння їжі та води легіонерів, хоча це означає, що їхні раби також страждають від того самого.\n\nДеякі з наших солдатів розглядають можливості бомбардування запальними сумішами та підпалів фортів легіонерів. Можливо, навіть мінування деяких їхніх моторизованих колісниць. Ми триматимемо тебе в курсі, Клентоне.\n\nМи нічим не кращі за Легіон, але ми живі. Поки що. Одне це робить усе недарма."
  nf_COW.5.a:0 "Війна ніколи не змінюється, але війна змінює людей."

  nf_COW.6.t:0 "Стрілянина стихає..."
  nf_COW.6.d:0 "Тихо.\n\nЗ часів початку війни з Легіоном Біллі Клентон постійно відчував, як земля дрижить від пострілів, вибухів і смерті. Те, що вони пережили перший тиждень, здавалося дивом, а те, що протрималися перший місяць — оманливим божевіллям. Міцно зчепивши руки і притиснувши їх до обличчя, він робить глибокий вдих. На своє полегшення, у цю мить він чує і відчуває лише самого себе.\n\nВони перемогли. Вони *перемогли!* Вони зробили те, що не змогли Пустельні рейнджери, те, що не вдалося 87 племенам. Вони кинули виклик Цезарю і вижили, щоб розповісти про це як єдиний народ. Він завжди уявляв, яким буде цей момент: сльози радості, полегшені зітхання, щасливі вітання та вигуки. Але, на свій власний подив, він не відчуває нічого з цього.\n\nВін сидить у руїнах Флагстаффа, місто порожнє. Залишилися лише трупи, а також налякані та розгублені раби. Він може лише запитати себе: що зробило його таким особливим? Чим цей раз відрізнявся від попередніх? Чому він та його різношерста банда ковбоїв і рейнджерів змогли зробити те, чого не змогли значно величніші за нього люди?\n\nВін довів до кінця справу помсти за злочини Легіону проти Аризони. Він думав, що успіх зробить його щасливим. Але Біллі Клентон може лише плакати. Лише тоді, коли він опинився притиснутим спиною до стіни, він нарешті допоміг. Очоливши Країну ковбоїв, Клентон може думати лише про те, що було б, якби він зробив те саме з Пустельними рейнджерами. Скільки б тоді залишилося живих? Скільком ніколи б не довелося пережити жахи рабства? Він думає про Варгаса, Анжелу, Лі, Мачко... Чи прожили б Пустельні рейнджери ще один день, якби він не втік? А його донька?"
  nf_COW.6.a:0 "Що, якби..? Що, якби..? Що, якби..?"

  nf_COW.7.t:0 "Меморіал Цитаделі"
  nf_COW.7.d:0 "«ТУТ МИ ПАМ'ЯТАЄМО ПУСТЕЛЬНИХ РЕЙНДЖЕРІВ, ЯКІ ВІДДАЛИ СВОЇ ЖИТТЯ\n                     ЗА АРИЗОНУ ТА ПРАВЕДНИЙ БІЙ».\n\nСтворений із бетону та сталі, що залишилися в руїнах аризонської цитаделі Пустельних рейнджерів, Меморіал Цитаделі був виліплений найкращими майстрами, яких зміг знайти Біллі. Єдиним променем надії в свавіллі Легіону по всій Аризоні є те, що їхні захоплені трофеї тепер можна використати для відбудови штату. Меморіал зображує загін рейнджерів — ветеранів, бувалих і новобранців — які простягають руки, щоб допомогти дитині. Хоч би якими пошарпаними чи побитими вони виглядали, рейнджери завжди захищали невинних.\n\nКлентон проводить пальцями по іменах усіх Пустельних рейнджерів, які служили під час війни проти Легіону. Список імен викарбувано на табличці внизу, жоден не забутий — ані живий, ані мертвий. Його палець ковзає, аж поки не зупиняється на імені «Мая Клентон». Біллі зітхає і дивиться на вранішнє сонце Аризони, знімаючи капелюха.\n\nВітер тихо торкається його обличчя. Для його доньки він був усім світом. Проте вона мертва, бо хотіла бути хороброю, як рейнджер, а він живий, бо не зміг змусити себе діяти, як один із них.\n\nМожливо, з цією обіцянкою ніколи не забувати і, нарешті, виправивши все..."
  nf_COW.7.a:0 "...він зможе навчитися відпускати провину."

  nf_COW.8.t:0 "Пекло наших власних провалів..."
  nf_COW.8.d:0 "«Аризона потребує нас зараз, як ніколи раніше. Якщо ми не зупинимо Легіон тут, то те, що вони роблять зараз, вони зроблять з усіма на заході».\n\nЦі слова лунали у вухах Клентона знову і знову від тієї самої миті, як він утік. Слова Генерала Рейнджерів ніколи не були більш пророчими.\n\nСаме тут, у Фініксі, Пустельні рейнджери здригнулися. Саме тут він виріс. Саме тут він знайшов і втратив своє перше кохання. Саме тут він втратив єдину сім'ю, яку коли-небудь знав. Саме тут він остаточно зламався і втік від заклику до дії.\n\nВін завдячує цьому місту всім, і тепер Клентон бачить, як Легіон відплатив йому. Місто в руїнах. Саперні команди легіонерів та рейнджерів зрівняли місто із землею, поки не залишилося нічого. Через величезну кількість сплющеного щебеню можна було б змусити когось повірити, що це ніколи не було найбільшим довоєнним містом Аризони.\n\nТіла, погнуті й обгорілі хрести та розбиті колісниці всіюють вулиці й забруднюють річки. Спадщина жорстокої системи рабства Легіону очевидна, про що свідчать купи тіл рабів. Певно, їх запрацювали до смерті на будівництві останніх укріплень або найжорстокіше покарали за спробу втекти від жорстокості, яка випала на їхню долю.\n\nБіллі здалеку спостерігає, як виснажена, розгублена дитина з рабським нашийником блукає руїнами, переводячи погляд із купи на купу. Вони виглядають напівмертвими, і ніхто не звертає на них уваги. Тільки не тоді, коли багато дорослих роблять те саме. Опинившись у пастці лабіринту страждань, справжні жертви Аризони шукають те, що залишилося.\n\n«Ми знайшли їх», — лунає приглушений фільтром голос позаду. Біллі обертається і бачить рейнджера Мачко: крізь розбитий візор Біллі бачить похмурий вираз його обличчя."
  nf_COW.8.a:0 "«Ми знайшли масові поховання наших»."

  nf_COW.9.t:0 "Ти ніколи не зможеш втопити біль"
  nf_COW.9.d:0 "Біллі думав, що зможе пробачити себе. Він думав, що зможе навчитися відпускати.\nАле він не може.\n\nБоже, що він накоїв?\n\nМаючи лише частину сили, єдності, духу, маючи заледве половину досвіду чи дисципліни Пустельних рейнджерів, Біллі Клентон зробив те, чого не змогли вони. У чому була різниця? Пустельні рейнджери були великими. Вони були найкращим, що мала Аризона. Вони протистояли загрозам, значно гіршим за Легіон, і все ж програли. Його єдина донька, єдиний подарунок, який залишила йому його Голлі, померла, щоб вони могли продовжувати боротьбу.\n\nТо чому ж, коли Біллі Клентону нікуди було тікати, коли він нарешті був змушений подивитися правді в очі... Чому лише тієї миті Легіон зазнав поразки?\n\nВін міг зупинити все це. Він згуртував Аризону тут, то чому він не згуртував їх тоді? Чому він не бився тоді?\n\nВін утік. Він покинув усіх, коли вони потребували його найбільше, а тепер він повернувся, коли їх усіх не стало.\n\nЙого друзі серед Пустельних рейнджерів, його донька, добрі дикуни та поселенці Аризони — вони ніколи не повернуться. Знадобилося десятиліття, щоб усвідомити це, але вороття справді немає. Він живе в пеклі своїх власних помилок.\n\nЯкби він програв, якби зазнав невдачі, тоді було б хоч якесь полегшення перед кінцем. Це було б безнадійно. Легіон усе одно б переміг. Але Біллі Клентон переміг, і тому немає жодного виправдання, яке б він міг собі придумати.\n\nВін уже виплакав достатньо сліз. Сльози, вибачення — вони не врятують тих, кого він підвів. Дідько, помста теж цього не зробить. Вони мертві, і крапка."
  nf_COW.9.a:0 "Його думки линуть до револьвера, що лежить поруч..."

  nf_COW.10.t:0 "Жахливі думки, які ми думаємо"
  nf_COW.10.d:0 "Біллі не може не всміхнутися сумно, дивлячись на зброю у своїх руках. Це був прекрасний срібний револьвер із почорнілим гравіюванням, яке, здавалося, було витравлене і стерте часом. Здається, ціле життя минуло з того часу, як йому його подарували. Тоді, коли він був лише новобранцем, що боровся із зіпсованими роботами та корумпованими рейдерами. Тоді здавалося, що в світі немає нічого, з чим би він швидко не впорався.\n\nЦе остання частинка його колишнього життя — тієї романтичної, сильної, але, зрештою, наївної пригоди.\n\nВін відчуває, як його права рука міцно стискає руків'я револьвера. Жаль, голоси мертвих... Що б він не робив, вони ніколи не покинуть його, це не припиниться. Він зробив усе, що міг, чи не так? Навіть якщо було надто пізно, зрештою він зробив те, що було правильно.\n\nЙого рука стискає зброю ще сильніше. Він тисне на неї до болю. Від напруги його права рука починає тремтіти. Його дихання стає поверхневим, і здається, ніби світ навколо нього темніє, поки він не бачить лише револьвер у своїй руці.\n\nВаргас, Дет, Лі, Рейзор... Він справді підвів їх. Він справді підвів їх усіх. Він розчарував їх.\n\nВін бачить їхні обличчя, рабів, загиблих рейнджерів, ковбоїв і племена...\n\nНе минає і хвилини, щоб він не згадав хоча б про одного з них. Не минає і секунди, щоб пам'ять про те, що з ними зробили, не випалювала його мозок зі свіжою силою.\n\nЧи справді він би...\n\nОчі Клентона розширюються. Світ знову стає ясним, і він кидає револьвер на підлогу. Охоплений чистим жахом, він задкує до центру свого ліжка.\n\nВін озирається. Він у своїй спальні, сонце сідає, і він щойно збирався...\n\nВін не може залишитися. Він не може залишитися... Він швидко думає про щось інше. Він думає про..."
  nf_COW.10.a:0 "...свою доньку..."
  nf_COW.10.b:0 "...про дім..."

  nf_COW.11.t:0 "Блакитний Місяцю, ти бачив, що я стою один"
  nf_COW.11.d:0 "Після того, як відгриміли феєрверки на честь їхнього виживання, Біллі Клентон зник безвісти. Герой, який організував порятунок ковбоїв, більше не був із ними. Його ранчо залишилося недоторканим, броня рейнджера лежала біля ліжка. За ремінець шолома була запхнута фотографія набагато молодшого, щасливішого чоловіка з немовлям на руках.\n\nБіллі Клентон просто зник; історія така ж звична, як пісок на південному заході.\n\nРейнджери наполягли, щоб не було ні похорону, ні хвилини мовчання. Він не був мертвий, його просто не було зараз поруч. Утім, ковбої все одно оплакували його втрату.\n\nБез Біллі не стало посередника між рейнджерами та ковбоями. Хоча вони ніколи не стали б відверто ворожими, здавалося, що між ними більше ніколи не буде справжньої єдності. Між обома групами завжди існуватиме велика дистанція. Ковбої залишилися на півдні, тоді як рейнджери відновили свої операції на півночі.\n\nКовбої організували раду, якій Аризонські рейнджери швидко присягнули на вірність, гарантуючи, що відбудова Аризони пройде настільки гладко, наскільки це можливо. Обидві сторони були задоволені, але в їхніх серцях відчувалося, що чогось не вистачає.\n\nЗгодом Джун Бейкер покинула Аризону і вирушила блукати Пусткою, як і раніше. Вона сказала, що йде шукати свого брата, але погляд у її очах говорив, кого вона шукала насправді.\n\nРейнджер Мачко та новостворені Аризонські рейнджери подбали про те, щоб знищити будь-яких потенційних прихильників Легіону чи його системи. Рейнджери продовжили повертати старі порядки в Аризоні, на краще це чи на гірше. Мачко сподівався, що де б не був Клентон, він щасливий. Він сподівався, що той навчився прощати себе. Він сподівався, що той зміг навчитися відпускати."
  nf_COW.11.a:0 "Так воно і йде... Так воно і йде..."

nf_COW.12.t:0 "Поїдьмо всі разом у захід сонця"
 nf_COW.12.d:0 "Коли Джун побачила, як Біллі Клентон вийшов на міську площу, вона засяяла, мов ті феєрверки, що якраз вибухали в небі.\n\nВільню рукою (в іншій вона тримала пляшку випивки) вона притягнула його до себе, обійняла й потягла до імпровізованої сцени. Сотні ковбоїв і рейнджерів вітали його появу радісними вигуками.\n\n«А тепер не забуваймо про цього сучого сина!» — каже Джун, і від її губ тхне пивом. Клентон почувається трохи ніяково від того, що його тягне за собою хтось нижчий за нього. Але якимось чином на його обличчі розпливається усмішка.\n\n«Коли прийшов Легіон, він...» — Джун перериває власна гикавка. «Він сказав мені... Пам'ятаєш, що ти сказав?» — питає Джун, трохи розтягуючи слова, і дивиться на Біллі зі своєю власною дурнуватою усмішкою.\n\n«Ми всі помремо», — відповідає Біллі, а усмішка все ще не сходить з його обличчя.\n«Ми всі помремо!» — зі сміхом повторює Джун. «Ми... Всі... Помремо». Вона вказує на натовп рукою, в якій тримає випивку.\n«Але ми *не померли*! Ми *не*! Ну, знаєте, не вмерли!»\n\nУ відповідь лунають схвальні вигуки.\n«І все завдяки цьому крутому сучому сину!» — кричить Джун, хапаючи Біллі за руку й піднімаючи її вгору, щоб усі бачили. Тепер вигуки стають ще гучнішими!\n\n«Тож тост! Тост за нашого хлопця... Хлопця... і нашого чоловіка... Біллі... Біллі Клентона!» — гукає Джун, і ковбої з рейнджерами радісно підіймають свої келихи та пляшки. Біллі досі затиснутий в обіймах Джун, але в натовпі він бачить, як Мачко піднімає келих у його бік. Коли їхні погляди зустрічаються, Мачко киває йому з тихою усмішкою.\n\nЦе гарний жест, але Мачко все ще в шоломі, тому він просто мовчки виливає напій на землю. Біллі не може не визнати, що це трохи кумедно.\n\nМожливо... Можливо, біль ніколи не мине. Можливо, почуття провини ніколи не вщухне. Але він врятував цих людей, він зробив усе, що міг. Його серце все ще болить, але на душі стає тепліше."
 nf_COW.12.a:0 "Це все, про що можна просити."

 nf_COW.13.t:0 "Хлопець, рейнджер і потвора"
 nf_COW.13.d:0 "Коли Цезар узагалі бував задоволений? Здолавши Пустельних рейнджерів, він одразу ж спрямував свій погляд на Каліфорнію. Коли він фактично контролював усю Аризону, він усе одно наказав частині своєї армії вторгнутися в решту Нью-Мексико та, можливо, васалізувати Колорадо. Після всього, що плем'я Сплетеного Волосся зробило для Легіону, їх усе одно асимілювали і стерли, як і решту.\n\nДля Біллі Клентона це просто факт: що б він не робив, Легіон, можливо, ніколи не задовольниться тим, що під його каблуком перебуває лише *більша частина* Аризони.\n\nРейнджер Мачко наполягає на тому, щоб Аризонські рейнджери відновили операції та навчання, а жителі Країни ковбоїв залишили битви тим, хто готовий і здатний це робити. Однак раптове «повернення» рейнджерів дало б очевидний привід для вторгнення до Країни ковбоїв. Отже, повномасштабне переозброєння Аризонських рейнджерів було б прийняте громадою лише в тому разі, якби війна вже стояла на порозі.\n\nДжун Бейкер виступає за більш негайне рішення — мобілізацію ополчення Країни ковбоїв. Хоча це зберегло б сили рейнджерів-вигнанців більш-менш на нинішньому рівні, це дозволило б нам створити єдину бойову силу, нікого при цьому не дратуючи. З іншого боку, це означає, що люди, яких рейнджери прагнули захистити, також опиняться на передовій."
 nf_COW.13.a:0 "Усі покладаються на нас."

 nf_COW.14.t:0 "Рейнджере, о рейнджере, не будь самотнім рейнджером"
 nf_COW.14.d:0 "Відколи Аризонські рейнджери осіли в Країні ковбоїв, їхньою метою стало відновлення зв'язку зі своїми побратимами по зброї — Пустельними рейнджерами, яким вдалося вибратися з Аризони.\n\nЗрозуміло, що після Договору про об'єднання 2271 року вони вижили, але якою мірою? У багатьох Аризонських рейнджерів залишилися сім'ї, від яких вони хотіли б отримати звістку. Було б добре мати пряме підтвердження того, що вони справді вибралися цілими та неушкодженими.\n\nПоки що все марно. Аризонські рейнджери використовують радіочастоти зі старих добрих часів, але у відповідь чують лише тишу. Іноді вони натрапляють на частоту, яку НКР перепрофілювала для своїх потреб, але співрозмовник на тому кінці починає вимагати пояснень, як вони її знайшли, і відмовляється відповідати «ймовірним шпигунам Легіону». Чудово, що НКР оберігає сім'ї Пустельних рейнджерів, але ми б дуже хотіли знати, де вони!\n\nМи чули чутки про інший контингент Пустельних рейнджерів, які виступають проти Договору про об'єднання і влаштувалися десь у Неваді під проводом Ебігейл Лі, або ж «Рейнджера-відступниці», як її називають на плакатах про розшук. Хоча наші власні рейнджери мають змішані почуття щодо договору про об'єднання, ми всі хочемо бачити наших хлопців і дівчат живими та здоровими. Ми сподіваємося хоч на щось.\n\nМи перевіряємо всі записи, частоту за частотою. Рано чи пізно ми когось знайдемо."
 nf_COW.14.a:0 "Ми ж... не можемо бути останніми, правда?"

 nf_COW.15.t:0 "Цей рейнджер приречений зустріти свою смерть"
 nf_COW.15.d:0 "«Я змусила міську варту кожного міста користуватися цими свистками, бачиш? Коли прийде Легіон, вони засвистять і всіх розбудять. Так вони ніколи не застануть нас зненацька».\n\nБіллі Клентон чухає підборіддя, переглядаючи списки та організаційні плани, що їх Джун розклала на його столі. Усе солідно, і їй вдалося вмовити всі міста погодитися на досить крайні заходи, як-от нормування та залучення всіх сил під час нападу. Джун також виглядає гордою за свою роботу, це справді добре продуманий план... Принаймні, з точки зору логістики. Було домовлено, що Аризонські рейнджери плануватимуть саму оборону, тому вона не мала до цього великого стосунку.\n\n«Лише одна деталь», — каже Клентон, відриваючи погляд від карти Країни ковбоїв і дивлячись Джун в очі. «Коли все це зазнає краху, я хочу, щоб ти зібрала якомога більше людей і посадила їх у стільки човнів, скільки зможеш знайти, і що більших, то краще».\n\n«Га?» — перепитує Джун зі збентеженою усмішкою на обличчі.\nКлентон продовжує: «І ти пообіцяєш мені, що будеш у тому човні разом із ними. Вирушайте до Каліфорнії чи Південної Мексики. Тікайте від Легіону так далеко, як тільки зможете».\nВираз його обличчя каже їй, що він не жартує, і тому усмішка зникає. Вона думає про те, щоб посперечатися з ним. Вона могла б сказати йому, що нізащо у світі не покине свій дім. Але що вона робитиме після цього? Що вона може сказати чоловікові зі шрамами від минулої зустрічі з Легіоном?\n\n«Ви помрете, борючись із ними», — тихо каже Клентон. «Ми... Ми всі помремо, борючись із ними! Ми просто мішені для тренувань Легіону. Чим ми кращі за Пустельних рейнджерів? Кращі за 80 із чимось племен?»\n\nОбличчя Джун міняється, вона опускає погляд. Клентон зітхає і знову кладе руку їй на плече.\n«Пообіцяй мені, що ти сядеш у той човен», — серйозно наполягає він. Джун дивиться на свої черевики, не бажаючи навіть припускати думку про поразку, але все ж..."
 nf_COW.15.a:0 "«Обіцяю», — бурмоче вона."

 nf_COW.16.t:0 "Зберегти мир. Назавжди."
 nf_COW.16.d:0 "«Чому ви дозволили їм піти?»\n«Так було правильно. Відняти життя легко, але зберегти його складніше. Легше виграти війну, ніж вибороти мир».\nРейнджер Мачко дивиться на Гранд-Каньйон перед собою. Ці слова, що їх капітан Пебст сказала йому дуже-дуже давно, під час їхньої найпершої операції, закарбувалися в його пам'яті від самого початку. Вона завжди мала рацію, навіть якщо звучала трохи претензійно і зверхньо. Виховання Послідовниками робить із тобою таке.\n\nАле якби «робити те, що правильно» справді працювало, можливо, Пустельні рейнджери б перемогли. Можливо, всі ті добрі справи, що вони робили, окупилися б, і єдиний фронт розгромив би Легіон до того, як ситуація вийшла з-під контролю.\n\nЦього не сталося, і замість того, щоб померти, рейнджер Мачко провів решту свого життя, виправляючи безлад, із яким не впоралися рейнджери. Він хотів би знати, як примирити минуле і майбутнє Аризони, але він уміє робити добре лише одну річ.\n\nВін так і не знайшов Цезаря, так і не виконав обіцянку, яку дав своїй колишній бойовій групі: побачити, як згасне світло в очах тирана. Можливо, він справді мертвий, а можливо, заяви про його смерть — брехня, і його ще треба знайти. Але він був лише однією людиною, і справжню небезпеку становив не він, а справа його рук — Легіон.\n\nРейнджеру Мачко доведеться виборювати мир єдиним відомим йому способом."
 nf_COW.16.a:0 "Спалити прапори дотла і почати все спочатку."

 nf_COW.17.t:0 "Техас приходить у місто"
 nf_COW.17.d:0 "Дедалі більше техасців прибувають до нашого шматочка країни. Деякі з них — Техаські рейнджери, які не захотіли залишатися шерифськими помічниками Братства, але багато з них — це розбійники, бандити, нероби або вигнанці, які не змогли прижитися вдома. Ми раді всім, особливо враховуючи, що Аризонські рейнджери дбають про те, щоб найбуйніші відвідувачі «зникали».\n\nБагато з них приїжджають безробітними і намагаються стати корисними. Дехто з місцевих не надто задоволений цим, але більшість із нас раді бачити нових сусідів і робочі руки! Справжня проблема полягає в тому, щоб з'ясувати, що *саме* вони повинні робити. Дехто з нас вважає, що вони мають допомагати в місті, підсобити зі зброєю на випадок, якщо хтось надумає прийти сюди і розв'язати бійку. Інші ж вважають, що ми повинні залучити всіх працездатних до боротьби за нас!\n\nМи маємо можливість спрямувати зусилля наших нових техаських друзів! Що нам робити?"
 nf_COW.17.a:0 "Техас і зброя йдуть пліч-о-пліч, нумо."
 nf_COW.17.b:0 "Боріться разом із нами, і ви станете героями!"

 nf_COW.18.t:0 "ЗВІТ - АРИЗОНСЬКІ РЕЙНДЖЕРИ"
 nf_COW.18.d:0 "Ти, звичайно, не генерал Варгас, але доведеться задовольнятися тобою, Клентоне.\n\nЗгідно з нашою угодою, ми не привертали до себе уваги. Але ми тренували місцеве ополчення до такого рівня, що вони можуть вважатися помічниками рейнджерів у всьому, крім назви. Легіон НАБЛИЖАЄТЬСЯ, Клентоне. Я знаю, що багато хлопців тримають на тебе образу за те, що ти утнув перед Кінгманом, але я тебе розумію. Втрата сім'ї може зламати людину. Але якщо ми з тобою можемо втекти на край світу, то ці люди не можуть. Ми зобов'язані їм, зобов'язані Аризоні все виправити.\n\nТи єдиний із тих «ковбоїв», хто може побачити ситуацію під нашим кутом зору і змусити цих упертих йолопів прислухатися. Ти нам потрібен. Ти їм потрібен.\n\nУ нас є розвіддані, що Аризону було повністю впокорено, за винятком самотньої банди, яка називає себе «Іржаві Гаки». Хлопець, який ними керує — страшенний ідіот, і я сумніваюся, що мине багато часу, перш ніж їх усіх перевішають і переб'ють. Коли їх не стане, Легіон або їхнє ручне плем'я, Два Сонця, прийдуть по нас. Краще бути готовими.\n\nЗнаєш, зараз ми не так уже й сильно відрізняємося. Офіційно останнім наказом Пустельних рейнджерів було переправитися через річку Колорадо. А потім — приєднатися до Каліфорнії. Технічно це робить нас обох дезертирами. Хоча, думаю, якби ти когось запитав, вони б усе одно назвали нас обох рейнджерами.\n\nПраведна битва має звичку знаходити шлях до нас, чи не так? Не ховайся від її поклику."
 nf_COW.18.a:0 "-Рейнджер Мачко."

 nf_COW.19.t:0 "Клентон і ковбой"
 nf_COW.19.d:0 "«О, у мене для тебе є кілька скарг, босе».\n«Я тобі не бос, Джун», — зітхає Клентон, поки вона підходить до ґанку ранчо, на якому він сидить. Зупинившись, вона усміхається йому, як ідіотка.\n\n«Звісно ти мій бос, босе! Як ще назвати старого, який вказує тобі, що робити, і який єдиний у місті, кого слухають люди?» — каже Джун, схиляючись до нього і поклавши руки на стегна.\n«Тебе люди теж слухають», — просто нагадує їй Клентон. Джун заступає йому сонце, але він усе одно продовжує розвалено сидіти в кріслі. А він же тільки-но почав насолоджуватися хвилиною тиші.\n\nУсмішка Джун трохи здригається. «О, н-ну...» — ніяково затинається вона, вочевидь, трохи полещена. «У мене все ще є ці скарги, щоб розповісти тобі, босе».\nКлентон кривиться і жестом просить її просвітити його. Хоча він слухає її промову лише впіввуха. Джун не принесла з собою паперу, тож він знає, що ці скарги не будуть чітко сформульовані чи справді корисні. Зазвичай це марні речі на кшталт сусідських суперечок або того, що він ніяк не може виправити. Ми всі хотіли б поїхати до Фінікса, але чи захоче Фінікс, щоб ми приїхали до них?\n\nАле Джун відчуває себе корисною, розповідаючи йому все це, тож він її не зупиняє. Як і він, вона була сиротою Пустки. Хоча вона ніколи не приєднувалася до рейнджерів, як він — імовірно тому, що до того часу, як вона досягла повноліття, їхній час уже минав.\n\nУ нього виникає відчуття, що деякі ковбої віддають перевагу їй, а не йому, і хто б їх звинувачував? Вона чарівна та смілива молода жінка, а він — зморщений, боягузливий мішок.\n\nВін головний лише тому, що *вона* його слухає. Джун Бейкер була б чудовим лідером, якби тільки могла... зосередитися. У неї вже є навички спілкування з людьми.\n\nІ з неї вийшла б чудова рейнджерка."
 nf_COW.19.a:0 "...Мая була б приблизно її віку."

 nf_COW.20.t:0 "Ковбой, рейнджер і солдати"
 nf_COW.20.d:0 "Спершу все починалося як крапля в морі: пара ящиків з допомогою прибула на наші береги тут, кілька добрих пожертвувань там — не стільки, щоб вижити, але достатньо, щоб показати, що комусь там, у світі, не байдуже.\n\nЗ оголошенням війни на радіохвилях Нової Каліфорнійської Республіки почалася справжня повінь. Зброя, їжа, кулі та кришки потекли в нашу країну так само легко, як вода з океану. На півночі Нова Каліфорнійська Республіка веде свою праведну війну проти наших гнобителів, відкриваючи лінію фронту і нарешті даючи нам змогу вільно дихнути.\n\nМи отримали багато листів від армії Нової Каліфорнії та її конгресу з проханням про співпрацю у знищенні бика Легіону, який тероризував нас десятиліттями. Очікується, що нас запросять приєднатися до них з усіма перевагами та недоліками, які це тягне за собою. Невелика, але гучна частина з нас не в захваті від ідеї працювати «з» НКР. Насправді немає ніякої роботи «з» ними, є робота на них і є смерть за них.\n\nАле у нас немає вибору. НКР — наш найкращий шанс на виживання. Самих нас просто недостатньо.\n\nПеремога більше не здається якоюсь хворою маною. Це воно?"
 nf_COW.20.a:0 "Чи будемо ми нарешті вільними?"

 nf_COW.21.t:0 "Ті, хто залишив себе позаду"
 nf_COW.21.d:0 "Нещодавно ми отримали виклик на одній зі старих частот Пустельних рейнджерів. Спочатку наші радисти подумали, що це чийсь жарт, що неабияк розлютило того, хто телефонував. Радисти не почули жодного з наших паролів чи позивних, тому з міркувань безпеки погрожували покласти слухавку.\n\nПроте після довгого і роздратованого з'ясування стосунків, виклик зрештою перевели на рейнджера Голстадта, нашого ветерана-радиста. Виявилося, що цим таємничим співрозмовником був не хто інший, як Біллі Клентон і Аризонські рейнджери! Технічно Аризонські рейнджери є перебіжчиками від Пустельних рейнджерів, але ми не вважаємо їх такими. Вони — ті нечисленні, хто вирішив продовжувати боротьбу і захищати Аризону, замість того, щоб відступити за річку Колорадо.\n\nРейнджер Мачко, який був на зв'язку, вочевидь, кричав на Голстадта, вимагаючи, щоб новобранця на рації, який його затримав, відправили «копатися в лайні брамінів на рік!» Але коли непорозуміння було владнано, він пояснив, що Аризонські рейнджери досі живі і здорові. Вони відступили до Країни ковбоїв, яка, судячи з усього, тепер перебуває під керівництвом Біллі Клентона.\n\nІм'я Біллі рідко згадують серед рейнджерів, але колись він був одним із наших найкращих. Проте війна з Легіоном зламала його. Він дезертирував і залишив війну з Цезарем нам. Біллі дозволив Аризонським рейнджерам залишитися в Країні ковбоїв, і тепер вони готові зустрітися з Цезарем, коли той знову кине їм виклик."
 nf_COW.21.a:0 "Приємно почути старих друзів."

 nf_COW.22.t:0 "Дезертирували разом, рейнджери назавжди."
 nf_COW.22.d:0 "Чутки виявилися правдою. Ебігейл Лі зібрала всіх Пустельних рейнджерів, які хотіли кинути виклик договору про об'єднання, і створила щось більше — щось, щоб повернути Пустельних рейнджерів такими, якими вони колись були.\n\nВідновивши контакт, Ебігейл була шокована, дізнавшись, що Країною ковбоїв керують не Аризонські рейнджери, а Біллі Клентон — ганебний дезертир, до якого вона не відчувала жодної симпатії. Коли вони обидва опинилися на лінії, розмова вийшла не з приємних. Ебігейл висловила все, що про нього думала, а Біллі мовчки слухав, як на нього сиплеться шквал звинувачень.\n\n«Зрадник, боягуз, невдаха...» Якби він тільки залишився з ними, якби він тільки бився з ними, а не втік. Якби тільки це він лежав у могилі, а не ті, кого вона справді поважала і любила.\nБіллі сидів із кам'яним обличчям, поки все це тривало, здавалося, цілу годину.\nЯкби ж він тільки зробив хоч щось: згуртував ковбоїв на допомогу Аризоні чи принаймні залишився на передовій. Якби тільки він не здавався.\n\nЯкби тільки вони перемогли.\nБіллі дозволив Ебігейл кричати, поки вона не зірвала голос. Хай що вона говорила, це не було тим, про що він не думав би раніше раз чи два, або кожного дня свого життя. Коли все було сказано, Біллі зміг лише попросити вибачення.\n\n«Вибачення нікого не поверне», — сказала Ебігейл. Біллі знав це. Натомість він запитав, що йому треба зробити, щоб усе виправити."
 nf_COW.22.a:0 "«Змусь цих легіонерських виродків плакати, Біллі», — сказала Ебігейл."

 nf_COW.23.t:0 "Можливо, ти попросиш мене повернутися знову"
 nf_COW.23.d:0 "Ебігейл Лі справді об'єднала Рейнджерів-відступників, як і ходили чутки, але замість Ебігейл нас зустрів генерал-рейнджер «Змій» Варгас! Вочевидь, він намагався відмовити її від війни проти Нової Каліфорнійської Республіки. Але він просто не зміг переконати її відпустити свій гнів.\n\nВаргас був змушений дістати зброю проти неї, дуель, рейнджер проти рейнджера. Тепер Ебігейл немає, і хоча він відчуває, що світу від цього краще, Пустельні рейнджери втратили ще одну людину, яка робила їх особливими.\n\nТепер Варгас реабілітує Рейнджерів-відступників і включає їх до складу НКР як «Невадських рейнджерів». Він пообіцяв нам, що повернеться за нами, і ми знову станемо єдиним цілим.\nЗнову разом, під знаком ведмедя.\n\nРейнджер Мачко скривився від перспективи такого майбутнього, але Біллі знає, що це на краще."
 nf_COW.23.a:0 "Іноді потрібно просто відпустити і почати все спочатку."

 nf_COW.24.t:0 "Останні, хто тримає зірки"
 nf_COW.24.d:0 "У наших викликах немає нічого, крім перешкод. Звіти з півночі нічого не дали, а НКР стверджує, що Пустельних рейнджерів більше немає. Здається, ті, хто залишився, стали частиною чогось більшого, ніж ми самі, частиною НКР. Решта, хто підтримував цей дух, мабуть, розсіялися за вітром, щоб більше ніколи не носити зірку Пустельного рейнджера.\n\nМи припускаємо, що це було неминуче; світ був проти нас від самого початку нашої боротьби. Але тепер ми нарешті дивимося цьому в очі, дивимося в очі нашій смертності.\n\nЦе була прекрасна мрія — Пустельні рейнджери. Мрія стати героєм, якого потребувала пустка, хоробрими ковбоями, які раз у раз рятували своє місто. Є щось лякаюче в тому, що це добігає кінця.\n\nМи — останні з Пустельних рейнджерів, останні, хто відстоює наші цінності. Ми завжди будемо боротися за слабких, знедолених, вразливих. Ми будемо боротися за себе і за саме майбутнє людства. Ми зробимо так, щоб наші діти не виросли у світі, де об них витиратимуть ноги все їхнє життя.\n\nКоли ми підемо, ми заберемо Пустельних рейнджерів із собою. Але коли ми підемо, ми підемо знаючи, що зробили все можливе для всіх, для кого могли."
 nf_COW.24.a:0 "Не йдімо покірно в темряву ночі."

 nf_COW.25.t:0 "Ковбойське збройове шоу"
 nf_COW.25.d:0 "Ніхто не знає, як зародилася ця традиція, але щороку 14 липня Країна ковбоїв збирається у своїх містах і вихваляється зброєю, трофеями, здобиччю, а також знаходить будь-яку вільну вибухівку чи феєрверки, які тільки може зробити чи знайти, і відривається на повну цілий день!\nУ попередні роки вона трохи занепала, але з прибуттям Аризонських рейнджерів і за підтримки дуже знудженої Джун Бейкер, традиція відродилася краще, ніж будь-коли.\n\n\nЛипневе Збройове шоу є найбільшим святом свободи в Країні ковбоїв і найціннішого права, яке тільки існує: права на носіння зброї! Звідки б не пішов цей вислів!"
 nf_COW.25.a:0 "І-і-ха!"

 nf_COW.26.t:0 "Ковбойське збройове шоу"
 nf_COW.26.d:0 "Незважаючи на чутки про те, що війна проти Легіону Цезаря насувається все ближче й ближче, жителі Країни ковбоїв відсвяткували ще одне 14 липня, вільні від тиранії та маючи свободу робити все, що їм, в біса, заманеться!\n\nМіські площі скрізь вибухали святкуваннями з 00:00 до 07:00 (наступного дня!).\n\nЧоловіки й жінки, молоді та старі, всі показували роботу, яку вони виконали за цей рік, користуючись нагодою похизуватися своїми досягненнями скільки завгодно. Не кажучи вже про змагання зі стрільби та приготування барбекю! Однак деякі з рейнджерів та старожилів цього разу залишилися осторонь, а Біллі та Мачко ніде не видно.\n\nАле це їхній вибір — триматися подалі. Ми просто будемо веселитися самі!"
 nf_COW.26.a:0 "Легіон може напасти... Завтра!"

 nf_COW.27.t:0 "Ковбойське збройове шоу"
 nf_COW.27.d:0 "Можливо, ми у стані війни, але Легіон ніколи не зламає наш дух. Відкрито насміхаючись з наших нападників, кожне місто Країни ковбоїв підтримує традицію збройового шоу живою. Хоча воно, безумовно, менш екстравагантне через запроваджене рейнджерами нормування та сувору дисципліну серед наших ополченців і цивільного населення, Країна ковбоїв все ще розважається, їсть і ділиться всім, ніби війни ніколи й не було.\n\nЛегіон може спробувати нас зламати, але ми їм не дозволимо. Коли ми закінчимо надирати їм дупи, ми розпалимо найбільше у світі багаття. Принаймні, саме це ми обіцяємо всім, коли їмо нашу жалюгідну їжу на шпажках над крихітним полум'ям.\n\nАле це все ще збройове шоу, тому люди хваляться зброєю, яку вони зробили або знайшли, а найрозумніші з нас демонструють ремонт спорядження, який вони можуть виконати. Коли завтра зійде сонце, ми повернемося до роботи. Але зараз ми святкуємо."
 nf_COW.27.a:0 "За ще одне збройове шоу!"

 nf_COW.28.t:0 "Ковбойське збройове шоу"
 nf_COW.28.d:0 "Легіон підкорив і зламав 87 племен, і все ж вони не змогли зламати хлопців і дівчат у Країні ковбоїв! Можете поставити свою солодку дупу на те, що ми *ніколи*, ніколи, і через тисячу років, не замовкнемо про те, що сталося на тій війні. Цезар думав, що ми легка здобич, а тепер його навіть в Аризоні більше немає!\n\nТепер наші збройові шоу проходять не лише в наших маленьких містечках Країни ковбоїв, а й по всій Аризоні та за її межами — і, будьте певні, ми вибрали найкращі феєрверки для запуску. Дедалі більше громад долучаються до ковбойського способу життя, і ми більш ніж раді бачити, які родзинки вони приносять на наші столи. Нова їжа, нова зброя, сусіди!\n\nВідтепер усе буде просто чудово!"
 nf_COW.28.a:0 "Привіт, Аризоно!"

 nf_COW.29.t:0 "Ковбойське збройове шоу" #secret event to determine which Cowboy's gunshow to trigger
 nf_COW.29.d:0 "ти не повинен цього бачити мда мда мда мда мда"
 nf_COW.29.a:0 "ти ботан мда"

 nf_COW.30.t:0 "Ти думаєш, що знаєш мій образ"
 nf_COW.30.d:0 "«Маєш сигарету?»\nРейнджер Мачко відриває погляд від тіла, над яким стоїть, щоб подивитися на Джун. Вона чухає спину і дивиться на нього з роздратованим виглядом.\n«Я сказала-»\n«Я чув, що ти сказала, — перебиває рейнджер. — Не маю. Минуло 200 років, як ти взагалі дістаєш ці сигарети?»\n«Просто дістаю, ясно? Не обов'язково бути таким мудаком», — сичить Джун. Вона дивиться вдалину і знову чухається. Лише тоді до Мачко доходить, що він бачить: капелюх, пончо, рвані джинси і постійна потреба курити.\n\n«Я бачив тебе раніше», — раптом каже він.\n«О, справді? — каже Джун з усмішкою. — Я вже це чула. Де це було? Тільки не кажи, що я винна тобі гроші».\n«Ні, ні... На білборді», — розмірковує Мачко.\nДжун кліпає очима.\n\n«Ти... Ти... Саллі з Сан-Франциско!» — раптом вигукує Мачко зі сміхом, а Джун дивиться на нього з незворушним обличчям. «Персонаж San Francisco Sunlights! Ти маскот для сигар!»\n«Взагалі-то, я ковбой?» — хмуриться Джун.\n«Те саме. Ти ж знаєш, що вони насправді не були «справжніми», правда?»\n\nДжун закочує очі. Яка неймовірно педантична розмова у них вийшла. Вона кладе руки на стегна і пирхає, дивлячись на рейнджера, який здається дуже задоволеним собою. Рейнджер Мачко — похмура постать, але вона чує усмішку в його голосі, коли він наполягає на «історичній достовірності» культури її народу. Вона майже зітхає, але натомість на мить заходиться кашлем. Рейнджер піднімає тіло між ними. Дідько, як би їй хотілося викурити сигарету."
 nf_COW.30.a:0 "«Усі Пустельні рейнджери потайки такі нудні?»"

 nf_COW.31.t:0 "Дуже результативна рада"
 nf_COW.31.d:0 "«Е-е... А як щодо вас?» — сказала Джун, вказуючи на одну з піднятих рук у ковбойській раді.\n«У мене проблема з кротощурами, чи не могли б ви виділити кількох Аризонських рейнджерів, щоб позбутися їх?» — пролунала відповідь від одного з представників громади.\n«Вам доведеться поговорити з рейнджерами про це, ми їм не начальники», — відповіла Джун.\n«Я пробував, але вони були досить грубі. Ви не могли б піти поговорити-»\n\n\n«У когось є... *справжні* проблеми?» — зітхнув Клентон, проводячи руками по обличчю.\n«Це справжня проблема!» — наполягав той самий чоловік. Клентон бачить, що решта теж так вважає. Спочатку він сприймав їхні занепокоєння за чисту монету — саме з цієї причини він запропонував створити Ковбойську раду.\n\nАле, здається, тільки у водних баронів були хоч якісь реальні проблеми, і Біллі не був до кінця впевнений, чи хоче їх вирішувати. Він збився з рахунку, скільки щомісячних зустрічей він скликав, які закінчувалися ось так.\n\n«Гаразд, — пирхнув Клентон. — У мене є ідея»."
 nf_COW.31.a:0 "Клентон зняв свого капелюха."

 nf_COW.32.t:0 "Банка для скарг"
 nf_COW.32.d:0 "«Тобі варто було б прочитати хоча б одну з них», — пропонує Джун, коли вони вдвох тікають з поля зору Вайаджо.\n«Я прочитав», — відповідає Біллі, перевертаючи свій капелюх у руках догори дном і дозволяючи всім написаним скаргам злетіти в безладну купу на підлогу пустелі. «Це не допомогло».\n«Що там було написано?» — наполягає Джун поруч із ним, поклавши руки на стегна.\n\n«Щось про несмачні суші», — прозоро бреше Біллі.\n«Знаєш, який сенс це робити, якщо тобі навіть байдуже, що вони кажуть?» — зітхає молодша ковбойка. Вона чухає щоку, поки Біллі бере кілька розкиданих папірців і акуратніше складає їх у купу.\n\n«Мені не байдуже, що вони кажуть. Просто... Якщо це важливо, вони, як правило, кажуть мені відразу. Якщо ви зберігаєте це для щомісячної зустрічі, значить, це не важливо. Можливо, одного дня все буде інакше — можливо, одного дня ці зустрічі матимуть значення», — каже він, дивлячись на Джун. Подумки він нагадує собі, що ніякого «одного дня» не буде, якщо всіх повбиває Легіон.\n\n«Але поки що це просто купка старих, які говорять про те, що їх дратує», — закінчує Клентон, знизуючи плечима. Він хапає запалену сигарету з руки Джун до того, як вона встигає піднести її до рота. Ігноруючи її протести, він кидає сигарету на безглузді скарги і дивиться, як купа повільно горить.\n\n«Тобі не слід це курити, це шкідливо», — дорікає Клентон, все ще дивлячись на вогонь.\n«Так? Хто це сказав?» — фиркає Джун.\n«Всі так кажуть»."
 nf_COW.32.a:0 "«Відколи це мене хвилює, що там кажуть «всі»?»"

 nf_COW.33.t:0 "Рейнджери, які обдурили смерть"
 nf_COW.33.d:0 "«Мачко сидить під зірками, дивлячись на новозбудовану Цитадель рейнджерів, що сяє як маяк для всіх в Аризоні. Він крутить зірваний аризонський соняшник між двома пальцями на зруйнованих дахах Фінікса. Це не була удача — удача не завела б його так далеко. Можливо, це була воля невидимого бога, що вигинає реальність, щоб допомогти йому перемогти, або, можливо, його капітан мала рацію з самого початку. Можливо, коли люди працюють разом, коли вони докладають до цього зусиль, вони можуть робити великі справи.\n\nЦе звучало банально, коли вона це запропонувала, і це здавалося маренням, коли вона лежала мертва в Кінгмані, але світ має звичку завжди доводити її правоту... зрештою.\nБіллі, ковбої, рейнджери..? Кожна маленька дія, їхні спільні зусилля, їхня відчайдушна боротьба. Все це призвело до цього. Вони *зробили* це. Вони врятували Аризону.\n\nМачко усміхається вперше за довгий час. Він відчуває, як тягар спадає з його плечей, і кидає соняшник на вулиці внизу.\nАризонські рейнджери перемогли, і тепер все це було під його командуванням.\n\nМожливо, тепер він нарешті прийме пропозицію Алікс випити з нею, Ехо та Скочмо."
 nf_COW.33.a:0 "Оце так поворот, еге ж?"

 nf_COW.34.t:0 "Договір про повернення Аризонських рейнджерів"
 nf_COW.34.d:0 "З підписанням цього договору Аризонські рейнджери відтепер визнаватимуться головною миротворчою силою регіону. Вони погоджуються співпрацювати з розширеною Ковбойською радою, щоб гарантувати, що регіон стане новим осередком демократії, свободи та стабільності в пустці.\n- Аризонські рейнджери намагатимуться відновити колишні громади Аризони в міру своїх можливостей.\n- Рейнджери підтримуватимуть мир, але залишать створення законів раді та її обраним лідерам.\n- Рейнджери не намагатимуться не підкорятися волі демократичних інститутів Аризони або підривати їх задля власної вигоди.\n- Аризонські рейнджери не втручатимуться в політику Аризони, а також не намагатимуться встановити своїх власних лідерів у регіоні.\n- Країна ковбоїв і нещодавно відновлені поселення візьмуть на себе зобов'язання допомагати Аризонським рейнджерам і їхній справі.\n- Аризонські рейнджери будуть самостійно закуповувати зброю та спорядження, але зможуть приймати пожертвування від сусідніх громад.\n- Аризонські рейнджери зобов'язуються допомагати у відбудові Аризони.\n\nНіколи більше Легіон не повстане в Аризоні, і ніколи більше тиран не поставить нас на коліна.\n\nПідписано,\nВиконувач обов'язків командира рейнджерів Джерард Мачко,\nНаступні представники Ковбойської ради..."
 nf_COW.34.a:0 "...І почесний генерал-рейнджер, Біллі Клентон."


 #NCR Aid chain
 nf_COW.100.t:0 "Каліфорнії від Країни ковбоїв, з любов'ю."
 nf_COW.100.d:0 "Ми зібрали всілякі товари та хитрощі нашого ремесла і відправили їх до Нижньої Каліфорнії! Звідти наші ковбойські каравани вирушать з Нижньої Каліфорнії до Шейді-Сендс і їхнього президента за будь-якою допомогою, яку вони зможуть надати.\n\nМи б хотіли попросити речі безкоштовно, але деякі з наших старійшин почали бурмотіти і скаржитися на «подачки від держави». Особисто я? Нам потрібні подачки! Але що поробиш? Це Країна ковбоїв. Ми маємо прислухатися до всіх, навіть якщо вони вперті, як чорти, і тупі, як мули. З іншого боку, можливо, те, що ми привеземо дрібнички та продукти, змусить НКР насправді вислухати нас.\n\nПроте єдина проблема у справі з демократією — це непередбачуваність її планів та пріоритетів. Допомога, яку ми можемо отримати, повністю залежить від того, хто стоїть біля керма старої доброї Каліфорнійської Республіки. Нам залишається лише сподіватися, що вони з щедрих людей. Щедрі, або, можливо, мстиві. Легіон не любить ніхто, але ніхто не ненавидить його так, як НКР."
 nf_COW.100.a:0 "Будемо сподіватися!"

 nf_COW.101.t:0 "Викликає Країна ковбоїв!" #kimballin
 nf_COW.101.d:0 "Ми прийняли цікавих відвідувачів із Шейді-Сендс. Караван, заповнений хутром, консервованим м'ясом, врожаєм, зброєю, металами та дрібничками, прибув уранці в супроводі групи суворих чоловіків у ковбойських капелюхах. Вони швидко пояснили своє становище всім, хто питав, і конгресу запропонували угоду всього життя, принаймні з точки зору цих ковбоїв.\n\nПротистоячи Легіону Цезаря наодинці, Країна ковбоїв обміняла б ці речі на будь-яку допомогу, яку могла б надати Нова Каліфорнійська Республіка. Їжу, воду, патрони або добровольців. Будь-що, що може допомогти їм із неминучою загибеллю у вигляді армії Легіону, що марширує на південь.\n\nЇхній караван, безперечно, мав гарні товари, але вони просто не вартували багато для такої великої держави, як Нова Каліфорнійська Республіка. Ми оцінили спробу рівноцінного обміну, але насправді ми потрібні їм більше, ніж вони нам.\n\nЗавдяки нашим зусиллям у конгресі Нова Каліфорнійська Республіка стала набагато охочіше віддавати деякі крихти нужденним малюкам за кордоном. Ковбої готові воювати з Легіоном за наш рахунок, без тренувань, не ставлячи зайвих запитань. Питання не в тому, чи можемо ми, а в тому, чи хочемо."
 nf_COW.101.a:0 "Надайте ковбоям економічну допомогу!"
 nf_COW.101.b:0 "Хлопці, вам потрібна зброя?"
 nf_COW.101.c:0 "Ми роздамо кілька листівок про побічну пригоду в Аризоні."
 nf_COW.101.e:0 "Е-е-е... Ми з вами зв'яжемося."

 nf_COW.102.t:0 "До Каліфорнії від Країни ковбоїв" #allevil (:<<<
 nf_COW.102.d:0 "Ми прийняли цікавих відвідувачів із Шейді-Сендс. Караван, заповнений хутром, консервованим м'ясом, врожаєм, зброєю, металами та дрібничками, прибув уранці в супроводі групи суворих чоловіків у ковбойських капелюхах. Вони швидко пояснили своє становище всім, хто питав, і конгресу запропонували угоду всього життя, принаймні з точки зору цих ковбоїв.\n\nПротистоячи Легіону Цезаря наодинці, Країна ковбоїв обміняла б ці речі на будь-яку допомогу, яку могла б надати Нова Каліфорнійська Республіка. Їжу, воду, патрони або добровольців. Будь-що, що може допомогти їм із неминучою загибеллю у вигляді армії Легіону, що марширує на південь.\n\nЇхній караван, безперечно, мав гарні товари, але вони просто не вартували багато для такої великої держави, як Нова Каліфорнійська Республіка. Ми оцінили спробу рівноцінного обміну, але насправді ми потрібні їм більше, ніж вони нам.\n\nХоча президент Олгуд більш ніж співчував цим людям у відчайдушній потребі, він також керував демократією. Він нагадав каліфорнійському народу саме про це, і це зв'язувало його правилами, яких він сам дотримувався. Це включало не витрачати гроші на зовнішню політику без схвалення конгресу. А це означає, що його варіанти обмежені."
 nf_COW.102.a:0 "Можливо, ви можете отримати кілька «Рейнджерів-дезертирів»."
 nf_COW.102.b:0 "Хлопці, вам потрібна зброя?"
 nf_COW.102.c:0 "Ми роздамо кілька листівок про побічну пригоду в Аризоні."
 nf_COW.102.e:0 "Е-е-е... Ми з вами зв'яжемося."

 nf_COW.103.t:0 "Викликає Країна ковбоїв!" #hayes
 nf_COW.103.d:0 "Ми прийняли цікавих відвідувачів із Шейді-Сендс. Караван, заповнений хутром, консервованим м'ясом, врожаєм, зброєю, металами та дрібничками, прибув уранці в супроводі групи суворих чоловіків у ковбойських капелюхах. Вони швидко пояснили своє становище всім, хто питав, і конгресу запропонували угоду всього життя, принаймні з точки зору цих ковбоїв.\n\nПротистоячи Легіону Цезаря наодинці, Країна ковбоїв обміняла б ці речі на будь-яку допомогу, яку могла б надати Нова Каліфорнійська Республіка. Їжу, воду, патрони або добровольців. Будь-що, що може допомогти їм із неминучою загибеллю у вигляді армії Легіону, що марширує на південь.\n\nЇхній караван, безперечно, мав гарні товари, але вони просто не вартували багато для такої великої держави, як Нова Каліфорнійська Республіка. Ми оцінили спробу рівноцінного обміну, але насправді ми потрібні їм більше, ніж вони нам.\n\nПрезидент Гейз узяв на себе зобов'язання зосередитися лише на сертифікованій американській території, тобто на землі, яка була повністю підпорядкована і готова до американської мрії. Ця «Країна ковбоїв» була мрією анархістів; децентралізована, неорганізована і непідготовлена до майбутніх подій. Не дивно, що Легіон збирався проїхатися по них катком! Тим не менш, можливо, варто кинути їм кістку і відволікти Легіон ще на деякий час. Нехай краще помруть вони, ніж ми."
 nf_COW.103.a:0 "Ось трохи зброї."
 nf_COW.103.b:0 "Просто візьміть мої гроші і йдіть, гаразд?"
 nf_COW.103.c:0 "Е-е-е... Ми з вами зв'яжемося."

nf_COW.104.t:0 "З Каліфорнії, з турботою"
 nf_COW.104.d:0 "Ну, привіт! Каліфорнія справді виручила нас! Наші хлопці повернулися і розповіли про великий каліфорнійський план допомоги, який вони для нас підготували. Хіба вони не милі?\n\nКаліфорнія надала нам припаси, яких вистачить на пару місяців, але після цього ми знову самі по собі. Не те щоб це мало значення, нам просто потрібно було з чогось почати. Решта залежить від нас, і ми б не хотіли, щоб було інакше!"
 nf_COW.104.a:0 "Щиро дякуємо, друзі!"

 nf_COW.105.t:0 "Каліфорнії абсолютно плювати!"
 nf_COW.105.d:0 "Нічого. Вони нічого нам не дали.\n\nНічого, крім порожніх обіцянок і марних надій. Це логічно, НКР розпорошена всюди, роблячи бозна-що. Не кажучи вже про те, що вони повинні в першу чергу дбати про себе. Багато хто зі старожилів на їхньому місці вчинив би так само. Зброя і припаси не ростуть на кущах. Але від цього все одно не менш боляче. Поки що ми самі по собі, але це нас не зупинить.\n\nРейнджери цілком зрозуміло розлючені, багато хто бурмоче, що НКР — це купка марних запроданців. Є повідомлення, що моральний дух пішов на спад. Але це лише нагода ще більше мотивувати людей робити все самостійно. Якщо Каліфорнія не може нам допомогти, ми просто муситимемо допомогти собі самі."
 nf_COW.105.a:0 "Ви мені все одно не були потрібні!"

 nf_COW.106.t:0 "Каліфорнія в хаосі"
 nf_COW.106.d:0 "У Каліфорнії зараз справжній безлад. Наші хлопці взагалі не можуть нічого зрозуміти! Ті кілька людей, які були достатньо привітними, щоб хоча б поговорити з нами, сказали, що Каліфорнія не в тому стані, щоб щось нам давати. У Шейді-Сендс загинуло багато хороших людей, і вся республіка була розколота зсередини.\n\nНаш караван все ж спробував дістатися до Шейді-Сендс, але дороги були настільки погано захищені, що ми ледь не втратили все через напад ведмедя-мутанта! (Що всі ми швидко назвали досить іронічним). Звуки пострілів вдалині також змусили декого з нас понервувати.\n\nТак чи інакше, ми швидко повернулися додому. Дуже шкода того, що там відбувається, але життя триває. Нам доведеться спробувати владнати все самостійно."
 nf_COW.106.a:0 "Чи робить це нас справжньою демократією пустки?"

 nf_COW.110.t:0 "Тебе більше немає, а я так і не попрощався"
 nf_COW.110.d:0 "«Отже, це все?..» — зітхає рейнджер Мачко.\n«Мабуть, що так», — каже рейнджер Алікс.\nДвоє рейнджерів стоять якраз за межами останнього табору легіонерів, який становив хоч якусь загрозу майбутньому Аризони. Це було не так вже й багато, і, можливо, табір навряд чи був загрозою взагалі. Але якби це було так, то вони б уже не зовсім воювали з Легіоном, вони б просто вбивали тих кількох відсталих, які носили багряне просто так.\n\nАле навіть це закінчилося, і тому вони обоє просто мовчки дивляться одне на одного.\nЇм здається, що вони повинні щось зробити. *Будь-що.* Або, принаймні, щось має статися. Можливо, Вогнева група 734 і решта «Ангелів Смерті» вистрибнуть з-за дерев, «вітаємо!» — закричать вони. «Ви зробили це! Ви врятували Аризону!». Були б сльози потрясіння, обійми та феєрверки. Все б повернулося до норми — наче Легіону ніколи й не існувало. Але цього не відбувається.\n\nЗамість цього вони вдвох сидять у тиші — можливо, вперше за довгий час вони змушені це робити. Дме вітер, вони клянуться, що в каньйоні, в якому опинилися, чують свист птахів і тихий плин струмка неподалік.\n\nАлікс перша не витримує цього.\n«Я... — каже вона, дивлячись на сіре небо над головою, — я хотіла б, щоб усе було інакше».\nМачко опускає погляд, «Я знаю», — зітхає він."
 nf_COW.110.a:0 "«Хотів би я, щоб ми жили у світі, де нам не треба було нічого робити»."

 nf_COW.111.t:0 "Обирайте друзів з розумом"
 nf_COW.111.d:0 "З моменту звільнення Аризони від Легіону Цезаря ми неодноразово приймали дипломатичних посланців з Нової Каліфорнійської Республіки з пропозицією офіційно приєднатися до них як протекторат. Це не означає прямого набуття статусу штату, хоча зрозуміло, що НКР була б більш ніж щаслива прийняти нас як такого. Можливо, нас інтегрують пізніше? Хто знає? Однак наразі Аризона залишатиметься виключно в руках Ковбойських рад та Аризонських рейнджерів, незалежно від нашого вибору.\n\nДжун Бейкер відреагувала з ентузіазмом, заявивши, що інтеграція Країни ковбоїв і всього регіону Аризони до НКР означатиме, що люди Країни ковбоїв зможуть отримувати більше підтримки і багатства від відкриття нових ринків з Нової Каліфорнії. Вона закликала нас прийняти членство в НКР.\n\nРейнджер Мачко налаштований більш скептично. Він визнає, що ми безперечно завдячуємо НКР за наше тривале виживання, проте він вважає, що Аризонські рейнджери і Пустельні рейнджери в цілому зможуть привести Аризону і весь південний захід у яскравіше, більш незалежне майбутнє. Він просто не довіряє НКР та її величезній гегемонній владі в тому, що вона буде грати чесно з Аризоною."
 nf_COW.111.a:0 "НКР пропонує мир, стабільність і процвітання."
 nf_COW.111.b:0 "Нам потрібно повернути Пустельних рейнджерів, зараз як ніколи."

 nf_COW.113.t:0 "Пам'ятати, щоб забути"
 nf_COW.113.d:0 "«Я просто... Я просто думала, що вас буде більше», — зізнається Ебігейл.\n«Ні. Тільки ми», — зітхає Біллі. Вони вдвох сидять на вершині майже відбудованої водонапірної башти, звідки відкривається вид на Фінікс та Цитадель Аризони. Після возз'єднання Пустельних рейнджерів Ебігейл із сумом виявила, що там, де колись був цілий батальйон загартованих Пустельних рейнджерів, залишилася лише жменька. Відстріляні один за одним, або загиблі в спробах врятувати чиїсь життя чи втекти від власних демонів, первісних «Аризонських рейнджерів» тепер можна було б вишикувати в один ряд.\n\n«...То чому ж тобі довелося втекти?» — тихо питає Ебігейл, і її голос зривається, коли вона дивиться вниз на Фінікс, що повільно відбудовується.\n«Ти все ще ненавидиш мене за це?» — натомість питає Клентон.\n«Кожного дня», — відповідає Ебігейл без жодних вагань.\n\nБіллі не може не усміхнутися сумно у відповідь на це. Він киває головою і дивиться вниз на місце своєї найбільшої невдачі і спокути. Вона має злитися. Деякі виправдання спливають у нього в пам'яті, деякі банальності, які говорили йому справжні Аризонські рейнджери, але Біллі відкидає їх усі.\nВін не заслуговує на прощення чи розуміння — не від неї.\n\n«Мені шкода», — каже Біллі; єдина втіха, яку він може їй запропонувати, зовсім не є втіхою.\n«Я ненавиджу тебе».\n«Я знаю», — зітхає Біллі, перш ніж обійняти Рейнджера-відступницю — вперше за довгі роки."
 nf_COW.113.a:0 "«Я себе теж», — каже він крізь її ридання."

 nf_COW.114.t:0 "Ми вдвох, знову в сідлі"
 nf_COW.114.d:0 "Рейнджер Мачко ніколи не знав Рейнджера-відступницю добре, навіть тоді, коли вони діяли як одне ціле. Здається, що ніколи не можна «знати» всіх, навіть у такій згуртованій групі, як Пустельні рейнджери. Їхня найдовша розмова була останньою, коли вони прощалися, розходячись у різні боки. Дехто втік до Мохаве, перегрупувався з іншими, а дехто так і не зміг відпустити минуле.\n\nВін бачив це на її обличчі — спокусу залишитися. Але вона ховалася за тихою втомою і сумом жінки, яка щойно втратила все. Дві групи рейнджерів попрощалися, обмінялися останніми словами та обіймами і зникли.\n\nТепер вони знову зустрілися віч-на-віч, і все ж жоден з них, здається, не став від цього щасливішим. Їхні найсміливіші мрії здійснилися, помста завершена... Це все одно не заліковує діру в їхніх серцях. Обидва знали, що насправді ніщо не зможе."
 nf_COW.114.a:0 "Ця боротьба припиниться лише тоді, коли ми помремо."

 nf_COW.115.t:0 "Вітання героя героїв"
 nf_COW.115.d:0 "Генерал-рейнджера Варгаса з розпростертими обіймами зустріли в Цитаделі рейнджерів Аризони під час його поїздки, метою якої було побачити, як поживають Аризонські рейнджери після перемоги над Легіоном Цезаря. Біллі Клентон був радий бачити свого героя, наставника і друга — звичні стосунки між більш досвідченими рейнджерами і старим Аризонським Змієм. Вони обмінялися люб'язностями та обіймами, а також зауваженнями про те, що не можуть повірити, що дійсно це зробили. Жоден з двох героїв-пустельних рейнджерів не показував іншому тягаря всього пережитого, але, мабуть, вони обидва вже знали, що їм довелося зробити, щоб опинитися тут.\n\nВаргасу показали відбудову Фінікса, вражаючу цілеспрямовану операцію, яку ковбої та рейнджери проводили разом, щоб звільнити кожного раба і возз'єднати (або принести спокій) кожній сім'ї, а також зусилля Аризони з притягнення до відповідальності кожного работорговця, який тероризував пустку.\nВін навіть мав «задоволення» познайомитися з ковбойською радою, яка швидко розширювалася і більш ніж охоче запрошувала нових людей до своєї маленької конфедерації ратуш.\n\nТепер вони вдвох стоять перед меморіалом Аризонських рейнджерів — останньою зупинкою в екскурсії Варгаса.\n«Мені шкода щодо Ебігейл», — тихо каже Біллі. Генерал-рейнджер Варгас не відповідає. Біллі кидає погляд на ветерана-рейнджера і бачить, що той мовчки схиляє голову, а на його обличчя падає урочиста тінь, коли рейнджерський капелюх закриває сонце.\n\n«Не варто. Ти нічого не міг зробити», — каже генерал Варгас, і його голос хрипить від старості. «Ебігейл... Ебігейл була моєю помилкою. Я міг би... я *повинен був* зробити більше, щоб допомогти їй».\nБіллі відводить погляд і киває, ковтаючи клубок у горлі, щоб знову подивитися на меморіал рейнджерів."
 nf_COW.115.a:0 "«Я повинен був зробити більше», — думають вони обоє крізь свій смуток."

 nf_COW.116.t:0 "Рейнджер, що відступає і тримається осторонь"
 nf_COW.116.d:0 "Коли генерал Варгас і решта Невадських рейнджерів прибули до Аризони, ті кілька ветеранів, що залишилися на ногах, нарешті змогли зітхнути з полегшенням. Рейнджерська група «Ехо» та рейнджер Норд були щасливі знову бути зі своїм командиром, а новобранці Аризонських рейнджерів були більш ніж вражені тими крутими сучими синами, які увійшли в руїни Аризони з таким сумом і тихою ностальгією.\n\nПроте «Командир» рейнджерів Мачко переважно мовчав.\nЙому пояснили обставини — що сталося в Есмеральді, чому Ебігейл мала померти, навіщо потрібен був договір про возз'єднання. Але на серці в нього все одно було гірко.\n\nНе те щоб він коли-небудь не послухався генерал-рейнджера чи піддав його слова сумніву. Він не став би — не повинен. Він уже підготував Аризонських рейнджерів підкорятися генералу Варгасу, а не «Командиру» Мачко, і спогади про його лідерство вже здаються йому хворим жартом порівняно з Варгасом чи Клентоном.\n\n«Хоч як би ти не ранив себе, це нічого не змінить», — сказав йому Варгас у ту ніч, коли пішов за річку.\nКумедно."
 nf_COW.116.a:0 "Ці слова звучали точнісінько як слова Анелі."