l_english:
  oklahoma_patriot:0 "Патріот Оклахоми"
  can_form_oklahoma_tt:0 "Може сформувати §YОклахому§!"
  colorado_patriot:0 "Патріот Колорадо"
  for_can_form_colorado:0 "Може сформувати §YКолорадо§!"
  is_oklahoma:0 "Утворено §YОклахому§!"
  form_colorado:0 "Утворити Колорадо"
  form_colorado_desc:0 "Штат Колорадо давно зник — ще до Великої війни, однак пам’ять про нього досі живе в серцях тих, хто там мешкає. Можливо, якщо ми наберемо достатньо сили, ми зможемо стати продовженням цієї спадщини. А хто знає — може, інші в це теж повірять."
  form_baja:0 "Утворити Бандитів Бахи"
  form_baja_desc:0 "До недавнього часу поділ Баха Каліфорнії був вигідним для старих банд, але ведмідь загострює свої кігті й готується повернути свою частину Каліфорнії будь-якої миті. Настав час для єдиної Баха Каліфорнії, якщо вона хоче залишитися незалежною."
  baja_cores_tt:0 "Отримає основи на всіх землях §YБаха Каліфорнії§!, §YМехікалі§! та §YКаньйон Кізла§!."
  baja_move_capital:0 "Повернення до Мехікалі!"
  baja_move_capital_desc:0 "Мехікалі не раз служив столицею нашого Великого Народу. Ми повернемося додому та повернемо свою спадщину."

  form_lincoln_league:0 "Утворити Лігу Лінкольна"
  form_lincoln_league_desc:0 "Після поразки супермутантів на півдні цей куточок Техасу нарешті знає, що таке мир. Їхній військовий лідер давно не з’являвся — мабуть, Шейл уже спочив у пилу. Відносини з нашим містом-сестрою тривалий час залишались добрими, а тепер, коли супермутанти зі Стоктона перебувають під нашою юрисдикцією, [ROOT.GetLeader] вважає, що настав час узаконити союз.\n\nЦя земля для всіх — людей, гулів і мутантів, — земля свободи, збудована на співпраці незалежних поселень. На честь символу свободи та старого слова для об’єднання поселень, ця країна називатиметься Лігою Лінкольна — народна, для народу, від народу."
  lincoln_capital_tt:0 "§gЯкщо ми контролюємо §Y[934.GetName]§!, ми заснуємо нову столицю — §YЛінкольн§! — саме там. Якщо ні, перейменуємо поточне місто.§!"
  lincoln_invitation_tt:0 "§gМи надішлемо запрошення нашому місту-сестрі. Їхня присутність важлива для того, щоб союз був досить сильним для оборони. Також ми вимагатимемо будь-які землі, що вони утримують. Якщо вони відмовляться... §Rдоведеться переконати їх інакше§!.§!"
  lincoln_tech_tt:0 "§gМи отримаємо доступ до §Gодиниць гулів і мутантів§! після об’єднання. Закони будуть відповідно адаптовані.§!"
  lincoln_cores_tt:0 "Отримає основи на всіх колишніх землях §Y[SHA.GetName]§!, §Y[LOS.GetName]§! та §Y[CBN.GetName]§!!"
  lincoln_claims_tt:0 "Отримає претензії на всі §Yтехаські§! землі на південь від річки §YЗахідна Бразоська Притока§!"
  form_lincoln_league_appoint_coleader:0 "Ліга Лінкольна: Призначити співлідера"
  form_lincoln_league_appoint_coleader_desc:0 "Незважаючи на складну історію, ми покладаємося один на одного. Було б не тільки жорстоко, а й безглуздо не піднести лідера сусіднього поселення до рівня співлідера. Можливо, ця роль буде зосереджена лише на її ключових вміннях."

  sok_form_arroyo:0 "Утворити Арройо"
  sok_form_arroyo_desc:0 "Люди Арройо — легендарні. Їхня боротьба за виживання у Пустці неймовірна. Герої з їхнього священного сховища перемогли одні з найбільших злих сил, що бачив світ. І хоча багато хто, включно з самим Кагою, радше спалив би Арройо, ніж приєднався до нього, з’явився рух за примирення Синів і Арройо."
  sok_form_arroyo_name_change_tt:0 "§YKaga§! стане відомий як §Y«Обранець»§!.\n"
  sok_form_arroyo_ind_tt:0 "Народ §YАрройо§! навчить нас своїм §Gсвященним таємницям§!, технікам, що дісталися їм у спадок.\n"
  form_oklahoma:0 "Утворити Оклахому"
  form_oklahoma_desc:0 "Штат Оклахома давно зник — ще до Великої війни, однак пам’ять про нього досі живе в серцях тих, хто там мешкає. Можливо, якщо ми наберемо достатньо сили, ми зможемо стати продовженням цієї спадщини. А хто знає — може, інші в це теж повірять."
  colorado_claims_tt:0 "Отримає претензії на всі землі §YКолорадо§!, які не є §Yосновними§! землями вашої нації."
  form_northwestern_brotherhood:0 "Утворити Північно-Західне Братство"
  form_northwestern_brotherhood_desc:0 "Ім’я і репутація Вашингтонського Братства були остаточно зруйновані Безсмертним та його падінням у божевілля. Та ті, хто вижив після чисток Безсмертного й знайшов притулок у Форт-Вілламет, прагнуть відновити справжнє Братство у Вашингтоні під проводом Старійшини Абеля."
  form_northwestern_brotherhood_tt:0 "\n§OВигнанці Братства§! стануть провідною політичною силою у нашій нації. Всі залишки §OВартових Білого§! будуть розпущені, а їхній досвід буде втрачено. Проте шлях Братства відкриє інші переваги.\n\n"

  form_wardens_of_the_white:0 "Новий Дім для Вартових"
  form_wardens_of_the_white_desc:0 "Хоча Вартові довго боронили залишки Портленда від работоргівців і людожерів, життя в Орегоні назавжди змінилося. Портленд неможливо захищати вічно, і тепер Вартові хочуть переселитися до Сіетла."
  form_wardens_of_the_white_tt:0 "\n§OВартові Білого§! стануть провідною політичною силою у нашій нації. Всі залишки §OВигнанців Братства§! будуть розпущені, а їхній досвід буде втрачено. Проте шлях Вартових має свої переваги.\n\n"

  form_grand_inquisition:0 "Утворити Велику Інквізицію"
  form_grand_inquisition_desc:0 "Зі знищенням Старої Країни та помстою за наших предків, тепер наше завдання — гарантувати виконання вічної місії. Ми маємо бути вічно пильними проти зради гулів!"

  form_old_spokane_state:0 "Відновити Старий Спокан"
  form_old_spokane_state_desc:0 "Багато гулів, які колись жили у Сховищі 100, пам’ятають, яким був Спокан до Великої війни. Можливо, одного дня ми зможемо відновити його велич."

  form_motor_city:0 "Утворити Мотор-Сіті"
  form_motor_city_desc:0 "Відтоді як Республіка ввійшла до Мохаве, а роботи пана Хауса пробудилися, ми змушені були ховатися у Сховищі 3 та керувати наркоімперією, уникаючи рейнджерських патрулів. Це гальмує нашу торгівлю і не дозволяє розкрити потенціал транспортування наркотиків через моторизовані засоби. Якщо ми завоюємо Вегас і відженемо каліфорнійців, то зможемо створити з Вегаса нашу Мотор-Сіті — центр наркоімперії."

  form_arizona_rangers:0 "Відродити Аризонських Рейнджерів"
  form_arizona_rangers_desc:0 "Коли Цезар прийшов до нашого дому на півночі Аризони, ми чинили опір. Ми билися вулиця за вулицею, будинок за будинком. Проте не могли зупинити орду назавжди. Більшість втекла до Республіки, але дехто оселився серед ранчерів [ROOT.GetName]. Тепер, коли Легіон повернувся — якщо нам вдасться навіть трохи його стримати й повернути Південний Фінікс та Ту-Сан, ми знову зможемо називатися Аризонськими Рейнджерами."

  form_hookers:0 "Утворити Гуків"
  form_hookers_desc:0 "Кайл Крюк, можливо, не був найрозумнішим чи найсильнішим, але у нього була одна риса — неймовірна удача. «Давайте поб’ємо Легіон», — казав він, звучачи як божевільний. «Захопімо місто в кінці Крюка», — казав він, готуючи банду рейдерів до самогубства. Але якось, щоразу, Кайл Крюк перемагав. Якось..."

  form_longtree:0 "Утворити Лонг-Трі"
  form_longtree_desc:0 ""

  expand_alliance:0 "Розширити наш Союз"
  expand_alliance_desc:0 "Наша влада в Колорадо зросла, і наш союз має зрости разом із нею."

  form_great_circuit:0 "Утворити Велике Коло"
  form_great_circuit_desc:0 "Зі звільненням південних ліній від Снігобожевільних ми можемо відновити залізницю до робочого стану!"

  form_nomads_of_the_new_north:0 "Утворити Кочівників Нової Півночі"
  form_nomads_of_the_new_north_desc:0 "Зі знищенням Божевільних Потягів і їхніх кланів ми здобули собі місце в Новій Півночі!"

  form_republic_of_the_steam:0 "Утворити Республіку Пара"
  form_republic_of_the_steam_desc:0 "Знищення релігійних фанатиків з Heaven's Gate та усунення анклаву з Скелястих гір дозволяє нам вийти з тіні та допомогти світу небаченим досі чином!"

  form_erebus:0 "Утворити Еребус"
  form_erebus_desc:0 "Після падіння Вашингтонського Братства ми можемо знову зібрати Вашингтон як край, де наше плем’я зможе вижити. Хоч не всі це приймуть, Олімп має залишитись непохитним."

  form_elysian_fields:0 "Утворити Елізійські Поля"
  form_elysian_fields_desc:0 "Вплив нашого племені стрімко зростає. Все більше людей слідує вченню наших Богів. Хоч завоювання й не найправедніший шлях, об’єднання Каскадії дозволить нам допомогти народу більше, ніж будь-коли."

  form_northern_federation:0 "Утворити Північну Федерацію"
  form_northern_federation_desc:0 "Вашингтонське Братство довело, наскільки нестабільним є цей регіон. Щоб вижити, ми маємо об’єднатися з сусідами та стати на захист — заради себе, Землі і наших дітей."

  form_democratic_technate_of_wakaw:0 "Утворити Демократичну Технату Вакава"
  form_democratic_technate_of_wakaw_desc:0 "Електорат пав, а наші демократичні інституції зруйновано нестабільністю Пустки.\n\nНаступного президента обиратимуть не голоси, а тіла. Кожен громадянин має битися за своє майбутнє і знищити шанс опонентів на відновлення.\n\nПолум’я прийдешніх битв викує переможця у незбагненний спосіб."

  form_competitive_governate_of_stoon:0 "Утворити Конкурентну Адміністрацію Стуну"
  form_competitive_governate_of_stoon_desc:0 "Електорат пав, наші демократичні інституції зруйновані нестабільністю Пустки.\n\nНаступного президента обиратимуть не голоси, а тіла. Кожен член і громадянин електорату має боротися за своє майбутнє й знищити шанси опозиції на відновлення.\n\nПолум’я прийдешніх битв викує переможця у незбагненний спосіб."

  form_capitalist_microheaven_of_dundurn:0 "Утворити Капіталістичну Мікро-Оазу Дандерну"
  form_capitalist_microheaven_of_dundurn_desc:0 "$form_competitive_governate_of_stoon_desc$"

  form_lugnuts_paradise:0 "Утворити Полум’я Калгарі"
  form_lugnuts_paradise_desc:0 "$form_competitive_governate_of_stoon_desc$"

  form_pleasant_country:0 "Утворити Приємну Країну"
  form_pleasant_country_desc:0 "$form_competitive_governate_of_stoon_desc$"

  form_faewild:0 "Утворити Фейські Дикі Землі"
  form_faewild_desc:0 "$form_competitive_governate_of_stoon_desc$"

  form_canada_stn:0 "Відновити Канаду"
  form_canada_stn_desc:0 "Народний Фронт Канади знову об’єднано, і тепер ми можемо слідувати своїм амбіціям без перешкод. Ті кляті комуністи — не єдині, хто прагне відродити світло Півночі. Ми змусимо його сяяти — славою справжньої демократії, а не тоталітарної антиутопії.\n\nМи спочатку боролись із американськими загарбниками, потім із зрадницьким Канадським Народним Фронтом. Тепер — маємо знищити саму Пустку, перш ніж проголосимо Канаду."
  STN_competitive_goverment_tt:0 "Контролює всі регіони Канади"

  SCO_formable:0 "Утворити Кланові Уділи"
  SCO_formable_desc:0 "Битва за битвою, ми розширюємо вплив нашого клану. Тепер наші території такі великі, що видно обидва кінці! Один клан не може спостерігати за всім. Потрібно заснувати нові уділи за межами Бастіону, щоб пильнувати за здобутими землями. Пліч-о-пліч із вірними Скорпами ми втримуємо свою здобич."

  form_safehaven_initiative:0 "Утворити Ініціативу Безпечної Гавані"
  form_safehaven_initiative_desc:0 "Із попелу Стампіду ми постанемо там, де навіть Республіка Кінгслі не змогла."

  form_dakota_republic:0 "Утворити Республіку Дакота"
  form_dakota_republic_desc:0 "Попри всі наші спроби залишитися осторонь, Маршали мають зробити свій вибір. Народ Дакоти потребує сильного лідерства — і ми маємо бути готові його забезпечити."
  dakota_tt_formable:0 "Зможемо утворити §YРеспубліку Дакота§!!"

  form_manifest_americana:0 "Молитися Америці"
  form_manifest_americana_desc:0 "Ось ми стоїмо, на вершині, у сяйві слави Америки, чекаючи на Її повернення. Вона принесе із собою велич, що зробила старий світ таким чудовим. Ми маємо зберегти цю землю, аби Вона змогла повернутися неушкодженою — на святу землю."
  HVR_america_tt:0 "§YМи підготуємося до висадки Америки, перемістивши столицю до Ґрейт-Фоллс, якщо вона під нашим контролем. Інакше — залишимо у Гавр§!"

  form_the_academics:0 "Історія як Наука"
  form_the_academics_desc:0 "Історичне Товариство давно прагнуло захистити всі форми знань минулого. Тепер, коли ми випробували теорію на практиці, захистивши себе — можливо, настав час розширити Товариство в повноцінний Університет, який викладатиме Історію по всій Дакоті."
  HST_historians_formable_requirement_tt:0 "Якщо Хейман відколовся від Монтанської гілки та напав на нас — нам також потрібен контроль над §CВатфорд-Сіті§!."
  HST_historians_formable_tt:0 "Надає §Gядра§! на всю початкову територію §YСтоячої Скелі§!.\nНадає §Gпретензії§! на території §Y[BIS.GetName]§!.\nЯкщо Хейман напав на нас, ми також отримаємо ядро на §HВатфорд-Сіті§!."

  form_union_machine:0 "Понад Усе — Союз"
  form_union_machine_desc:0 "Старе керівництво КПФ розпалося під тягарем власної слабкості. 200 років — і все, що вони мали, це внутрішні конфлікти. Прості люди з плоті, які діють окремо за власними бажаннями, не можуть ефективно використати середовище. Людське бажання може бути знищене лише тоді, коли всі працюватимуть разом. У Союзі.\n\nБажано — з мізками в скляних банках."
  BGR_union_machining_tt:0 "§RПодвоює швидкість, з якою§! §3людські ресурси§! §Rперетворюються на§! §Cробомізки§!! §RВключно з бонусом, якщо виконано фокус «Уникнути Погляду §BКапіталізатора§!»!§"

  form_principality_katch:0 "Хай Живе Принц"
  form_principality_katch_desc:0 "Після перемоги над «Великим» Стампіду та стародавніми Електорами, зірка Принца сяє яскравіше. Під час церемонії коронації в Батлфорді буде оголошено — перший з династії, володар усієї Саскачевану.\n\nА потім? Потім Принц іде додому. Разом із Королівськими батальйонами."
  BAT_battleford_formable_tt:0 "Надає §Gпретензії§! на недавні завоювання §Y[STA.GetName]§! та §YЕлекторатів§!.\nТакож надає §Gпретензії§! на §Y[DLN.GetNameDef]§! і §Y[BRA.GetNameDef]§!!"

  form_scarlet_expansion:0 "Розширення Домена"
  form_scarlet_expansion_desc:0 "Хоча Багряна Завірюха була створена Дестіні, схоже, що вона давно вийшла з-під її контролю. Зі спокійних земель Півдня все частіше надходять історії від мисливців і човнярів про те, як Блайтвуд поглинає Північні Пустки. Вони говорять про повзуче коріння і червоний сніг, про землю, звірів і людей, перекручених у щось жахливе.\n\nПитання не в тому, чи Завірюха прийде — а коли."
  RRR_scarlet_formable_tt:0 "Надає §Gядра§! на всю початкову територію §Y[TPA.GetNameDef]§! та §Y[IRC.GetNameDef]§!"
  RRR_scarlet_expansion_tt:0 "Активує завдання §YДомен Просувається Далі§!, яке кожні 120 днів надає §Gпретензії§! на випадковий ворожий регіон."

  form_uranium_county:0 "Мирний Повіт"
  form_uranium_county_desc:0 ""

  form_rad_horde:0 "Орда Виходить з-під Контролю!"
  form_rad_horde_desc:0 ""

  form_hydraulic_empire:0 "Влада Над Водою"
  form_hydraulic_empire_desc:0 ""
  DMM_hydraulic_formable_tt:0 "Надає §Gядра§! на всю територію §Y[ARB.GetNameDef]§!, §Y[TPA.GetNameDef]§! і §Y[IRC.GetNameDef]§!"
  DMM_formable_ideas_tt:0 "Видаляє §HТемні Угоди§!\nВидаляє §HЗнедолені Виживші§!"

  form_four_fathers_return:0 "Наші Батьки"
  form_four_fathers_return_desc:0 "З найближчими загрозами позаду, ми можемо зосередитись на освяченні Святої Гори та відновленні честі нашого племені. Коли це буде зроблено, настане час зростати, щоб більше ніхто не насмілився нам загрожувати.\n\nІ так пошириться істина Чотирьох Батьків — на всіх, хто шукатиме притулку в їхній тіні."
  RMT_return_formable_tt:0 "Надає §Gядра§! на всю територію §Y[MRR.GetNameDef]§!.\nНадає §Gпретензії§! на §YДакоту§!."

  form_per_mighty_hunters:0 "Цілий Затока для Полювання"
  form_per_mighty_hunters_desc:0 "Великі порушники наших мисливських угідь стали чудовими трофеями. Броня і машини не змогли протистояти нашому терпінню та майстерності. Історії про наші вдосконалені навички ширяться, приваблюючи новобранців. Найкращі приєднаються до нових мисливських домівок, інші — стануть здобиччю.\n\nА ще — ми знайшли багато гнізд Детклолів. Нове покоління виросте поруч із нашими мисливцями."
  PER_hunts_formable_tt:0 "Надає §Gядра§! на первісні регіони §Y[ACH.GetNameDef]§! та §Y[ARM.GetNameDef]§!.\nНадає §Gпретензії§! на території §YТехасу§! і §YЛуїзіани§! у затоці."
