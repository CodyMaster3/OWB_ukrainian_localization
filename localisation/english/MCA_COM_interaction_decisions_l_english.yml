  #EVENT#
  mca_com_inter.7.t:0 "Питання Канади"
  mca_com_inter.7.d:0 "Конгрес сперечався вже кілька днів. Після кількох філібастерів та безлічі гнівних жестів різноманітні дебати щодо долі Канади злилися у два основні аргументи.\n\nПо-перше, прихильники жорсткої лінії прагнуть повної анексії Канади, сподіваючись, що завдяки мудрості Нового світу вдасться уникнути помилок Старого. Друга пропозиція полягала в тому, що підпорядкована канадська держава найкраще слугуватиме інтересам нової американської держави, виконуючи роль керованого утворення, здатного співпрацювати в розбудові нації, необхідній для возз'єднаної Америки.\n\nЗ набраних канадських колабораціоністів було сформовано Канадську перехідну раду, яка займатиметься тим варіантом, що переможе: або керуватиме анексією, або допоможе запустити підпорядковану державу. Чи буде мудрість Старого світу сприйнята як істина в останній інстанції, чи ж буде прокладено новий шлях пліч-о-пліч із воскреслою Америкою?"
  mca_com_inter.7.a:0 "Вільна Канада"
  mca_com_inter.7.b:0 "Канаду анексовано"

  mca_com_inter.1.t:0 "Два погляди, не такі вже й протилежні"
  mca_com_inter.1.d:0 "У нашвидкуруч прибраній казармі кімната була буквально завалена документами. На одному кінці столу сиділа жінка років тридцяти, охайна й зібрана у своєму костюмі. На іншому боці, закинувши ноги на стіл, розвалився гуль — його обличчя настільки прогнило, що на лобі виднілася кістка. Він потягував каву і поводився так, ніби його нічого у світі не хвилює.\n\n«Отже, ми згодні щодо союзу, містере Перший Канадарієць?»\n\n«Тут ви нас підловили, лялечко, — прохрипів Мортон Бетанкур. — Мене от тільки цікавить, скільки ще ми зможемо виторгувати, дозволяючи вам мене так називати. Я Перший Аркадієць, а не ця клята канадарська хрінь».\n\n«Тут ідеться не про торги, містере Бетанкур, — відповіла Шеллі Габрищак, тягнучись за чашкою чаю з мутафруктом. — Мова про те, що саме ми можемо зробити разом».\n\n«І на що ж ви, люди з Першої Сім'ї, готові піти, щоб втілити цю ідею в життя від початку і до кінця?» — відказав Бетанкур, і його смішок перейшов у напад кашлю, після чого він сплюнув харчу у свою каву.\n\n«А на що готові ваші? — парирувала Габрищак. — Зрештою, гадаю, з нас двох ми маємо більше легітимності».\n\nБетанкур міг лише знову розсміятися, ляскаючи по столу з таким задоволеним виглядом, що з його зап'ястя відвалилася маленька кіста. «О, то ви хочете зіграти в цю гру, еге ж? Лялечко, я народився одразу після Війни і чудово знаю, що робили ті солдати. Вони нам самі розповідали. Вони і ми, аркадійці, набагато легітимніші за вас, милих крутих стерв — без образ».\n\nГабрищак сьорбнула чаю і холодно звернулася до свого візаві на іншому кінці столу. «Як щодо такого, містере Бетанкур? — плавно промовила вона, дивлячись йому просто у вічі. — Наразі ми оголошуємо перерву і обговоримо з нашими лідерами питання мандата на Америку: хто її очолить, якою вона буде тощо. Думаю, у нас знайдеться багато спільних точок дотику». Нарешті вона усміхнулася — впевненою усмішкою, яка свідчила, що буде зроблено правильний вибір. На противагу їй, нахабна посмішка Бетанкура була такою широкою, що аж розривала плоть на його губах."
  mca_com_inter.1.a:0 "«Домовилися, лялечко»."