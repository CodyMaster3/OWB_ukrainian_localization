  MCA_COM_DEM_INTER: "Міжамериканська співпраця"
  MCA_COM_DEM_INTER_desc: "[MCA.GetFlag][MCA.GetNameDef] та [COM.GetFlag][COM.GetNameDef] скинули кайдани Анклаву. Тепер, поки обидві нації відбудовуються, вони знайшли спільну мету в боротьбі проти їхнього спільного гнобителя та за відродження Америки. Ця спільна боротьба призвела до суперечки щодо того, хто має більш законне право називатися об'єднувачем Америки. Почалися переговори, щоб з'ясувати, хто є спадкоємцем і яку роль відіграватиме інша сторона. Найважливішим показником результату є їхня власна §MЛегітимність§! — вона відображає їхній публічний імідж і те, наскільки ретельно вони, на перший погляд, дотримуються американських цінностей, гідних нації, що претендує на статус відродженої Америки.\n\n[MCA.GetFlag][MCA.GetName] Легітимність: [?mca_legitimacy]\n\n[COM.GetFlag][COM.GetName] Легітимність: [?com_legitimacy]"

