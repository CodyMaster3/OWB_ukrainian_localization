l_english:
  
cascadia_industry1:0 "Почати спочатку"
cascadia_industry1_desc:0 "Біле Безмежжя — жорстоке місце, нещадне й безжальне у своїх проявах. Ми мусимо підготуватись до наступної зими, щоб вона не стала такою ж лютою, як і попередня."

cascadia_scavengingteams:0 "Команди збирачів"
cascadia_scavengingteams_desc:0 "Ми відправимо збирачів у пустки, аби знайти будь-який мотлох, придатний для наших ливарень."

cascadia_shovellingsnow:0 "Відкидати сніг"
cascadia_shovellingsnow_desc:0 "Без належної інфраструктури, північні сніговії завалюють наші ворота, деформуючи землю та знищуючи життя. Ми розпочнемо війну проти самого морозу."

cascadia_rebuildingprogram:0 "Відновлення доріг"
cascadia_rebuildingprogram_desc:0 "Більшість доріг Каскадії зруйновані або настільки зношені, що стали непридатними для наших караванів і транспорту. Навіть просте вирівнювання гравієм або гряземішшю піде нам на користь."

cascadia_programestablished:0 "Закладення фундаментів"
cascadia_programestablished_desc:0 "З відновленими дорогами ми можемо більше зосередитись на зовнішніх зв’язках і внутрішніх справах!"

cascadia_armaments:0 "Нові озброєння"
cascadia_armaments_desc:0 "Світ не є добрим місцем. Ми вживемо заходів для відновлення та розвитку нашого військового виробництва, відбудовуючи заводи по всій країні."

cascadia_goodoldusa:0 "Стара добра американська сталь"
cascadia_goodoldusa_desc:0 "Численні контрольно-пропускні пункти Національної гвардії США досі розкидані по обидва боки кордону. Чому б не забрати з них усе, що залишилося?"

cascadia_disassembling:0 "Очистити, розібрати, повторити"
cascadia_disassembling_desc:0 "Більшість знайденої в Білому Безмежжі зброї зламана чи непридатна до вжитку. Розберімо її на частини, подивимось, як вона працює, і зробімо щось, що не вибухає, коли туди вставляєш набій!"

cascadia_encouragingmilitias:0 "Заохочення міліцій"
cascadia_encouragingmilitias_desc:0 "Наші місцеві... скажімо, енергійні. Заохочення створення міліцій і виробництва зброї на місцях значно посилить нашу обороноздатність."

cascadia_research:0 "Присвячені дослідницькі групи"
cascadia_research_desc:0 "Світ могли знищити вчені, але ми... зробимо навпаки. Якщо захочемо. Краще про це не задумуватись."

cascadia_power:0 "Правильне з’єднання дротів"
cascadia_power_desc:0 "Якщо ми хочемо щось побудувати, нам потрібно зробити це так, щоб воно не вибухнуло на кожному кроці. Тож спробуємо все підряд, доки не запрацює. Може, пощастить!"

cascadia_rememberyourcoat:0 "Не забудь куртку, виходячи"
cascadia_rememberyourcoat_desc:0 "У Білому Безмежжі холодно. Куртка — обов'язкова, це ж просто здоровий глузд. Дамо кілька порад для тих, хто не звик думати головою, щоб вони краще... ну, думали."

cascadia_warming:0 "Зігріти людей"
cascadia_warming_desc:0 "Ми досягли того рівня, коли можемо використовувати справжні обігрівачі, а не просто палити сміття в бочці. Ми дійсно стали більш цивілізованими, ніж колись могли сподіватись!"

cascadia_turningthelightson:0 "Увімкнути світло"
cascadia_turningthelightson_desc:0 "Як там було? «Останній — вимкни світло»? У цьому контексті це не зовсім працює, але звучить круто, тож хай буде."

cascadia_sweatshops:0 "Пітні цехи"
cascadia_sweatshops_desc:0 "Деякі робітники прозвали нові теплі будівлі «пітними цехами», бо ми ще вчимося керувати температурою. Мило, правда ж? Ну, окрім... очевидних асоціацій."

cascadia_industryend:0 "Каскадійський бум"
cascadia_industryend_desc:0 "Ми розчистили сніг, відновили тепло та зібрали достатньо ресурсів, щоб стати заздрістю для кожної банди й поселення. Каскадія може бути суворою землею — але, хоч комусь це подобається чи ні, ми залишимось." 

#generic_military
cascadia_againstthewhiteout:0 "Проти Білого Безмежжя"
cascadia_againstthewhiteout_desc:0 "Біле Безмежжя може здаватися мертвою пусткою жахливих масштабів, але ми не самі у ньому. Якщо ми хочемо пережити наступну хуртовину, маємо бути готові до будь-кого, хто спробує нас перевершити."

cascadia_winterized:0 "Зимове обмундирування"
cascadia_winterized_desc:0 "Минулої хуртовини було знищено чимало військ і угруповань на півночі. Ми не можемо допустити повторення. Обладнаємо наших людей якнайкраще до зими."

cascadia_attrition:0 "Форпости в буревіях"
cascadia_attrition_desc:0 "У заметених снігом околицях є кілька споруд, які можна відновити як повноцінні аванпости. Відправимо туди команди й дамо нашим людям знати, де можна закріпитися."

cascadia_permanentresidency:0 "Постійне розміщення"
cascadia_permanentresidency_desc:0 "Багато з форпостів добре працюють, але бійцям потрібно краще забезпечення. Підтримаємо їх обладнанням і ресурсами, щоб вони могли впевнено тримати оборону."

cascadia_strengthinnumbers:0 "Сила у чисельності"
cascadia_strengthinnumbers_desc:0 "Усі знають — чим нас більше, тим краще. Ми поставимо наших людей пліч-о-пліч, мов лінія у снігу, і вселимо жах в серця ворогів самим фактом нашої єдності."

cascadia_cascadianmilitia:0 "Каскадійське військо"
cascadia_cascadianmilitia_desc:0 "Щоб бути готовими до всього, спочатку має бути готовий народ. Заохочення навчання серед населення й взаємного інструктування допоможе закласти основу справжнього війська."

cascadia_qualityarms:0 "Якісна зброя"
cascadia_qualityarms_desc:0 "Нам слід обрати розумний підхід до озброєння. Гори зброї, що ледь працює, не принесуть користі нікому."

cascadia_quantityarms:0 "Масове озброєння"
cascadia_quantityarms_desc:0 "У нас немає ні часу, ні ресурсів чекати на якість. Краще мати гору рушниць, ніж жменьку тих, що «стріляють непогано»."

cascadia_thinkaboutit:0 "Навчання нової тактики"
cascadia_thinkaboutit_desc:0 "Ми поширюємо базові військові знання, але цього недостатньо, якщо командири досі недосвідчені. Потрібно фільтрувати нову генерацію офіцерів ретельно."

cascadia_menatarms:0 "Найм озброєних людей"
cascadia_menatarms_desc:1 "Озброєні Люди — нечисленна, але впливова організація. Хоча їхньою базою є Нова Вікторія, вони зібрані з усієї Каскадії. Їхня лояльність може викликати сумніви, але майстерність — безсумнівна."

cascadia_naval1:0 "Замерзлі води"
cascadia_naval1_desc:0 "Хоча морська перспектива не видається нагальною, підготовка до флоту може стати в пригоді. Спочатку, однак, доведеться зміцнити нашу наземну промисловість."

cascadia_navalbase:0 "Прогулянки по річці"
cascadia_navalbase_desc:0 "Досвід — ключ у будь-якій справі. Багато хто з наших ніколи не бачив океану з води. Невеликі рейди, тренування на морі — це те, що відділяє націю від невдахи."

cascadia_navaldevelopment:0 "Дослідження корабельних уламків"
cascadia_navaldevelopment_desc:0 "Уламки кораблів, рибальські хатини та інші морські рештки можуть дати нам ресурси. Збираючи все, що хоч трохи нагадує морське майно, ми готуємо основу для флоту."

cascadia_workingaship:0 "Працюючи над кораблями"
cascadia_workingaship_desc:0 "Деякі старі кораблі здаються придатними, але краще викинути старе начиння і побудувати щось власне. Краще попрацювати з ґрунтом, ніж потонути в красивій оболонці."

cascadia_oldengines:0 "Модернізація старих двигунів"
cascadia_oldengines_desc:0 "Старі двигуни в човнах уздовж каскадійських берегів можуть бути корисними. Розібрати їх — допоможе не лише флоту, повірте."

cascadia_rivallingthecoast:0 "Суперники узбережжя"
cascadia_rivallingthecoast_desc:0 "Пірати Зламаного Узбережжя готові битися з нами на суші чи на морі. Але ми будемо готові будь-де."

