# events - Ukrainian Translation
nf_event_brk.1.t:0 "Наші предки"
nf_event_brk.1.d:0 "Після Великої війни природний захист гірських узбереж став притулком для груп людей, чия культура згодом визначила цей регіон. Морські піхотинці, що захищали узбережжя від китайського вторгнення, пережили бомбардування в горах. Екіпажі різних суден, які опинилися відрізаними від світу, використали свої кораблі як укриття від суворої зими. А корінні мешканці, що були під окупацією, здобули свободу. Усі вони стали тканиною Народу Зламаного Узбережжя. Але першою групою, до якої згодом приєднались інші, були..."
nf_event_brk.1.a:0 "Корінні мешканці узбереж"
nf_event_brk.1.b:0 "Морські піхотинці США"
nf_event_brk.1.c:0 "Моряки з чужоземних берегів"

nf_event_brk.2.t:0 "Велика Завірюха"
nf_event_brk.2.d:0 "Після падіння бомб життя не стало легшим. Чорна завіса вкрила небо, сонце зникло, і на узбережжя обрушилася велика завірюха. Багато загинуло від холоду — тіла замерзали за лічені хвилини. З попелу народ вийшов — жорстокий, сформований суворістю, який вижив, завдяки..."
nf_event_brk.2.a:0 "Втечі від бурі з надією повернутися"
nf_event_brk.2.b:0 "Будівництву укриття з довоєнних кораблів"
nf_event_brk.2.c:0 "Виживанню у штормі — тільки найсильніші витримали"

nf_event_brk.3.t:0 "Навіщо ми б’ємось"
nf_event_brk.3.d:0 "Наші предки билися та стікали кров’ю за Зламане Узбережжя. Вони знаходили сенс виживати в цій пустці, але старі шляхи зникають, і ми маємо знайти свої. Ми можемо обрати новий шлях до слави. Але для цього треба знати, чого ми прагнемо понад усе?"
nf_event_brk.3.a:0 "Рабів"
nf_event_brk.3.b:0 "Багатства"

nf_event_brk.4.t:0 "Рейд на Елвін Блік"
nf_event_brk.4.d:0 "Елвін Блік спав солодким сном, поки за вікном лютував сніговій. Вітер заглушив шум наближення рейдерів. Раптом ніч розірвали крики, звук скла, що б’ється, рев полум’я та вереск дітей. Ті, хто чинив опір — загинули. Їхні діти дивились із тіней, крізь сльози. Було б милосердям добити вцілілих, та пірати не про милосердя. Пірати — про здобич. І єдине, що залишилось від Елвін Бліка — це цінності, що мали ціну..."
nf_event_brk.4.a:0 "Солодких снів!"

nf_event_brk.5.t:0 "Зламати Вістлер"
nf_event_brk.5.d:0 "Наші бійці блукають засніженими лісами Вістлера, шукаючи залишки ворога. Після нападу на Елвін Блік вони організували жалюгідну армію й вийшли на контратаку. Ми зустрілись у лісі, що тепер укритий замерзлими трупами. Їхні обличчя застигли в муках. Вістлер на межі падіння. Ми висунемо їм останню вимогу: приєднуйтесь — або помрете."
nf_event_brk.5.a:0 "Дурнями будуть, якщо відмовляться"

nf_event_brk.50.t:0 "Лідери Зламаного Узбережжя пропонують мир"
nf_event_brk.50.d:0 "Після жахів в Елвін Блік та нових рейдів, Зламане Узбережжя пропонує мир... але не як Камло, що просив наркотики та рабів — ці вимагають усе. Землі, ресурси, народ. Вони хочуть зробити нас частиною свого покрученого піратського народу. Ми втекли від Камло, щоб не жити в рабстві. Але тепер, притиснуті до стіни... що оберемо?"
nf_event_brk.50.a:0 "У нас немає вибору. Ми мусимо скоритися"
nf_event_brk.50.b:0 "Та щоб нас чорти взяли! Краще смерть!"

nf_event_brk.6.t:0 "Інтеграція Вістлера"
nf_event_brk.6.d:0 "Наш дипломат повільно знищував незалежність Вістлера. Економіка, армія — усе вже в наших руках. Залишилось оформити це офіційно. Ми оголосимо їх автономним регіоном... на кілька днів. Потім — повна інтеграція."
nf_event_brk.6.a:0 "Вістлер вже наш"

nf_event_brk.60.t:0 "Інтеграція у Зламане Узбережжя?"
nf_event_brk.60.d:0 "Наші 'друзі' із Зламаного Узбережжя пропонують статус автономного регіону. Вони клянуться, що це лише формальність. Але критики в уряді вважають, що це кінець нашої незалежності..."
nf_event_brk.60.a:0 "Підкоритись"
nf_event_brk.60.b:0 "Відмовитись"

nf_event_brk.7.t:0 "Рейд на Камло"
nf_event_brk.7.d:0 "Відішли кілька загонів до Камло, щоб спалити склади та вкрасти все, що зможемо. Усе, що в них є — тепер наше."
nf_event_brk.7.a:0 "Вирушайте!"

nf_event_brk.8.t:0 "Кампанії Терору"
nf_event_brk.8.d:0 "Посилати людей в ніч, палити села та залишати голови жителів на показ — ось так роблять справи на Узбережжі."
nf_event_brk.8.a:0 "Вони більше ніколи не заснуть спокійно"

  nf_event_brk.9.t:0 "[BRK.GetName] надсилає рейдерів"
  nf_event_brk.9.d:0 "Закутані у важкі кожухи, зі зброєю напоготові, рейдери увірвалися на наші землі. Вони грабують склади, викрадають цінності, плюндрують індустрію та вбивають кожного, хто чинить опір. Прикордонні поселення благають нас вислати ополчення та війська, аби зупинити нападників — хоча б заради збереження нашої промисловості."
  nf_event_brk.9.a:0 "Ми не можемо дозволити собі їх зупинити"
  nf_event_brk.9.b:0 "Битися!"

  nf_event_brk.10.t:0 "Місцеві не чинять опору"
  nf_event_brk.10.d:0 "Наші недавні рейди у сусідні території пройшли безперешкодно. Лише символічний опір завадив нашим загонам, які повернулися із чималим трофеєм: спорядженням, технікою та іншими корисними речами.\n\nЗараз цей регіон спустошений, тому ми утримаємося від нових нападів, щоб дозволити населенню оговтатися. А тоді повернемось..."
  nf_event_brk.10.a:0 "Смакуймо здобич"

  nf_event_brk.11.t:0 "Місцевий опір!"
  nf_event_brk.11.d:0 "Наші рейди — це завжди ризик. І цього разу ми зустріли справжній спротив: від ополчення до напівпрофесійних військових підрозділів. Малих рейдових груп недостатньо — потрібна повномасштабна операція, аби придушити супротив і забрати те, що належить нам."
  nf_event_brk.11.a:0 "Викладемось на повну"

  nf_event_brk.12.t:0 "Рейдери відступили"
  nf_event_brk.12.d:0 "Рейдери з Розбитого Узбережжя прийшли й пішли. Прикордонні землі в руїнах, дим підіймається над обрієм. Наслідки руйнівні — знадобиться чимало часу, щоб відновити регіон."
  nf_event_brk.12.a:0 "Мусимо оговтатися"

  nf_event_brk.13.t:0 "Прикордонний конфлікт переростає у війну"
  nf_event_brk.13.d:0 "Останні сутички з ворогом не дали рішучого результату. Обидві сторони зазнали втрат. Декілька сіл знищено, але фронт залишився майже без змін. Ворог, очевидно, вирішив діяти радикально — розпочалась мобілізація."
  nf_event_brk.13.a:0 "Що ж, буде війна"

  nf_event_brk.14.t:0 "Прикордонний конфлікт завершився"
  nf_event_brk.14.d:0 "Чудові новини з фронту — конфлікт завершено нашою перемогою! Ворог відступає перед нашою могутністю. Нарешті ми можемо насолодитися заслуженою здобиччю."
  nf_event_brk.14.a:0 "Сьогодні святкуємо!"

  nf_event_brk.15.d:0 "Чудові новини з фронту — прикордонний конфлікт завершився нашою перемогою! Ми відбили рейдерську навалу. Народ може спати спокійно, знаючи, що наша армія готова захистити їх."
  nf_event_brk.15.a:0 "Гарна робота, хлопці"

  nf_event_brk.16.d:0 "Погані новини — наші війська змушені були відступити. Ворог відбив наш рейд, і тепер ми змушені заліковувати рани. Ми не чіпатимемо цей регіон деякий час, дамо їм розслабитись... а потім повернемось."
  nf_event_brk.16.a:0 "Скоро, хлопці. Скоро."

  nf_event_brk.17.d:0 "Погані новини — наші війська змушені були відступити. Рейдери розгромили наші села та інфраструктуру. Ми відступили до укріплених позицій. Ймовірно, ворог не продовжить наступ. Ми чекатимемо, відновлюватимемось і будемо готові наступного разу."
  nf_event_brk.17.a:0 "Ми відбудуємося..."

  nf_event_brk.18.t:0 "Ми відступаємо"
  nf_event_brk.18.d:0 "Ми тактично відвели наші війська з ворожих територій, щоби зберегти ресурси та людей. Бій приніс цінний досвід — і нам, і ворогу. Згодом ми повернемося... і спалимо їхні домівки."
  nf_event_brk.18.a:0 "Тактичний хід"

  nf_event_brk.19.t:0 "Рейдери відступили"
  nf_event_brk.19.d:0 "Чудова новина — рейдери припинили свої напади і пішли з наших земель. Хоч ми й не розгромили їх армією, це — перемога."
  nf_event_brk.19.a:0 "Прекрасно"

  nf_event_brk.20.t:0 "Прикордонний конфлікт загострюється!"
  nf_event_brk.20.d:0 "Останні сутички не принесли результату. Землі спалені, але фронт не змінився. Ворог не бажає миритися з цим і готується до масштабнішої кампанії. Вони мобілізують нові сили — ми маємо бути готові."
  nf_event_brk.20.a:0 "Зустрінемо їх із рівною силою"

# Події рейду на Нову Вікторію

nf_event_brk.21.t:0 "Рейдери на наших узбережжях"
nf_event_brk.21.d:0 "Раніше рейди були рідкісними. Їх здійснювали невеликі групи, зазвичай уночі. Кораблі висаджувалися в ізольованих місцях — подалі від сіл і міст. Але тепер усе змінилося. Скоординовані загони рейдерів атакують наші поселення, завдаючи нечуваних руйнувань, ще до того, як ми встигаємо зреагувати. У відповідь ополчення мобілізуються й готуються боронити наші острови. Час покаже, чи зможемо ми вистояти..."
nf_event_brk.21.a:0 "Чинити опір!"

nf_event_brk.22.t:0 "Успішний рейд проти [HAI.GetName]"
nf_event_brk.22.d:0 "Тіла вкривають села, тіла вкривають пляжі. Рейди проти [HAI.GetName] були безжальними, і тепер наші люди мають досвід грабунку як на суші, так і на морі. Ці знання стануть безцінними, коли ми нападемо на Нову Вікторію, яка, без сумніву, захищена значно краще за цей нікчемний острівний ланцюг.\n\nПричин для існування [HAI.GetName] лишається дедалі менше — саме час анексувати їх повністю."
nf_event_brk.22.a:0 "Цінний досвід"

nf_event_brk.23.t:0 "Димові стовпи в ранковому тумані"
nf_event_brk.23.d:0 "Похмура картина постала перед очима тих, хто вижив після ночі крові. Тіла вкривали села та пляжі, багато з них — понівечені та розчленовані. Вижилі могли лише оплакувати загиблих — і сподіватися, що рейдери більше не повернуться."
nf_event_brk.23.a:0 "Ми відбудуємо все"

nf_event_brk.24.t:0 "Невдалий рейд проти [HAI.GetName]"
nf_event_brk.24.d:0 "Коли перші човни торкнулися берега, все було тихо. Перше село спало, і його мешканці були швидко вирізані. Проте хлопчик утік з різанини й піднявся на пагорб, де запалив велетенський факел, що сяяв уночі. Його світло передалося вздовж узбережжя, і весь острів піднявся на захист. Наші наступні висадки втратили елемент несподіванки й були відбиті місцевим ополченням — повний провал."
nf_event_brk.24.a:0 "Ми повернемось"

nf_event_brk.25.t:0 "Рейдери відступають"
nf_event_brk.25.d:0 "Коли перші човни торкнулися берега, все було тихо. Перше село спало, і його мешканці були швидко вирізані. Але геройський хлопчик утік та піднявся на пагорб, де запалив велетенський факел. Яскраве світло швидко розповсюдилось уздовж узбережжя, як і планувалося, і весь острів піднявся. Наступні хвилі рейдерів були зустрінуті селянами з вилами й мушкетами — славетна перемога над силами тиранії."
nf_event_brk.25.a:0 "Вони ще повернуться"

nf_event_brk.26.t:0 "Рейдери з узбережжя"
nf_event_brk.26.a:0 "Ми, ми чинимо опір і кусаємось!"

nf_event_brk.27.t:0 "Узбережжя Вікторії зломлене"
nf_event_brk.27.d:0 "Кров, кров усюди. Ось доля, що спіткала узбережжя Нової Вікторії. Наші загони повністю знищили поселення в прибережній зоні — тепер ми можемо висаджуватись де завгодно без спротиву. Настав час планувати амбітніші рейди на великі, укріплені міста."
nf_event_brk.27.a:0 "Перший крок зроблено..."

nf_event_brk.28.t:0 "Берег зупиняє хвилю"
nf_event_brk.28.d:0 "Ми недооцінили Нову Вікторію. Щоразу, коли ми висаджуємось, на нас чекає ополчення. Наші загони надто малі, а цілі надто передбачувані. Усі наші рейди — повна невдача. Нам слід вдосконалити підготовку, якщо ми хочемо здобути цю землю."
nf_event_brk.28.a:0 "Скоро..."

nf_event_brk.29.t:0 "Рейдери атакують порти"
nf_event_brk.29.d:0 "Рейдери з Куверу, не задовольнившись узбережжям, почали координовані рейди проти наших портів. Порти краще укріплені, але ворог уже має досвід нападів на наші землі. Сили приблизно рівні — лишається сподіватися, що ми здобудемо перемогу."
nf_event_brk.29.a:0 "Бийтесь до кінця — нас усіх видно!"

nf_event_brk.30.t:0 "Домінація над портами"
nf_event_brk.30.d:0 "Порт Золотих Піків лежить у руїнах. Наші рейдери знищили все живе, будівлі горять, а вцілів лише сам порт — інфраструктура, яку ми використаємо згодом. Але наразі ми не чіпатимемо його, аби не спровокувати війну, до якої ще не готові."
nf_event_brk.30.a:0 "Ми на крок ближче до Вікторії"

nf_event_brk.31.t:0 "Ніч Жахіть"
nf_event_brk.31.d:0 "Ми гадали, що найгірше лишилося позаду після вирізання прибережних сіл. Але ми помилялись. Минулої ночі рейдери атакували порт Золотих Піків, прорвавши ополчення й захопивши порт. Далі розпочалась бійння, що не має аналогів: усіх чоловіків, жінок і дітей закатували й убили. До моменту, коли прибули наші війська, ворог уже зник у темряві. Вони завдали нам страшного удару."
nf_event_brk.31.a:0 "Вони нахабнішають"

  nf_event_brk.32.t:0 "Порти тримаються"
  nf_event_brk.32.d:0 "Минулої ночі було зроблено спробу захопити порт Золотих Піків нашими рейдерами. Ми здолали місцеву міліцію в першій сутичці, але залишки сил уперто билися за кожну вулицю, захищаючи свої домівки. Із настанням ранку до міста прибула частина Армії Нової Вікторії — наші невеликі загони не змогли протистояти добре організованому ворогу. Нас відтіснили назад до моря, хоч і не без сліду — половина міста палає."
  nf_event_brk.32.a:0 "Ми ще повернемося"

  nf_event_brk.33.t:0 "Рейдери відступають"
  nf_event_brk.33.d:0 "Минулої ночі рейдери спробували захопити порт Золотих Піків. Вони перемогли у першій сутичці з міліцією та вдерлися в місто, спустошивши його більш ніж наполовину. Але невдовзі з’явилися наші регулярні сили, і рейдери опинилися в обороні. На світанку ворог був вибитий із порту. Попри перемогу, половина міста лежить у руїнах — але, на щастя, більшість цивільного населення вижила."
  nf_event_brk.33.a:0 "Притулки згоріли, але наш народ живий"

  nf_event_brk.34.t:0 "Операція «Завірюха»"
  nf_event_brk.34.d:0 "Ми контролюємо узбережжя й показали, що здатні захоплювати порти. Настав час діяти далі — порт Зимової Гавані багатий, але ізольований, ідеальний для удару. Капітани-рейдери запропонували три плани: зробити з захоплення прелюдію до війни, використати порт як базу для майбутнього вторгнення або просто залишити його після показової атаки. Усі мають сенс. Що оберемо?"
  nf_event_brk.34.a:0 "Широке вторгнення"
  nf_event_brk.34.b:0 "Цільовий удар"
  nf_event_brk.34.c:0 "Показ сили"

  nf_event_brk.35.t:0 "Війна за Нову Вікторію"
  nf_event_brk.35.d:0 "День, до якого ми готувалися, настав. Рейдери більше не обмежуються нападами — почалося повномасштабне вторгнення. Вночі вони захопили порти Зимової Гавані та Золотих Піків числом, якого ми ще не бачили. Але наш народ налаштований боротися — він знає, що на нього чекає у разі поразки. Ми битимемось до кінця."
  nf_event_brk.35.a:0 "Ми візьмемось за зброю і дамо відсіч!"

  nf_event_brk.36.t:0 "Рейдери захопили Зимову Гавань"
  nf_event_brk.36.d:0 "Рейдери у нечуваній кількості вдерлися до Зимової Гавані. Вони діяли настільки стрімко і люто, що ми майже нічого не знаємо про те, що відбувалося (і, мабуть, краще й не знати). Ймовірно, вони вибрали порт через його ізоляцію — підозрюємо, що він стане їхнім плацдармом для вторгнення. Нам вирішувати: спробувати відвоювати його негайно чи готуватись до нового удару."
  nf_event_brk.36.a:0 "Ми не готові боротися"
  nf_event_brk.36.b:0 "Ми візьмемось за зброю і дамо відсіч!"

  nf_event_brk.37.t:0 "Спустошення Зимової Гавані"
  nf_event_brk.37.d:0 "У черговій ескалації насилля рейдери захопили й спалили Зимову Гавань. Увесь регіон палає — яскравий контраст до крижаних околиць. Ми не знайшли жодного вижившого. Лише обгорілі тіла й руїни. Ймовірно, це останній етап перед повномасштабною війною. Нам слід готуватись до бою не на життя, а на смерть."
  nf_event_brk.37.a:0 "Війна наближається"

  nf_event_brk.38.t:0 "Показ сили"
  nf_event_brk.38.d:0 "Захоплення Зимової Гавані не було легкою справою. Там була добре озброєна міліція та загін армії поблизу. Але ми вдарили стрімко, знищивши міліцію до того, як вона встигла подати сигнал. Армійський загін потрапив у засідку й також був розгромлений. А далі — звична картина: ґвалт, тортури, грабунок, смерть. Від Гавані залишились лише обвуглені рештки."
  nf_event_brk.38.a:0 "Тепер вони нас боятимуться"

  nf_event_brk.39.t:0 "Війна за Нову Вікторію"
  nf_event_brk.39.d:0 "Час настав — рейдери розпочали повномасштабне вторгнення. Порти по всьому узбережжю атакують бойові групи. Зараз вся наша надія — на армію. Якщо вона не впорається — на нас чекає довга й болісна смерть."
  nf_event_brk.39.a:0 "Бийся, опирайся, роби що мусиш!"

  nf_event_brk.40.t:0 "Тіньова рада"
  nf_event_brk.40.d:0 "Ґрейвен заревів із люттю, коли зібрався Мут — його рука міцно стискала руків’я сокири. Прийшов час обирати нового ватажка, чи принаймні так казали. Змову організували незадоволені капітани, які прагнули позбутися Ґрейвена. І тут уперед вийшов Рагнар — велетень із крижаним поглядом — і встромив сокиру в мерзлу землю. «Я кидаю виклик Ґрейвену. Він більше не гіден правити.» По табору пройшов холод, бо всі бачили, як хижо блищали очі Ґрейвена."
  nf_event_brk.40.a:0 "Ґрейвен переміг — як і слід було очікувати"
  nf_event_brk.40.b:0 "Рагнар переміг з мінімальним відривом"
