l_english:
# Рішення

form_cascadia:0 "Утворити Республіку Каскадія"
form_cascadia_desc:0 "Наша перемога над рейдерами Зламаного Берега надихнула наш народ. На теренах північного заходу поселенці, торговці й пустельники цінують наші зусилля у справі забезпечення безпеки цих земель. Настав час скористатися цією хвилею підтримки й проголосити нову державу, що захищатиме права всіх, хто живе на її території."

brk_decisions:0 "Політичні пріоритети"
brk_decisions_desc:0 ""

brk_decision_build_the_fleet:0 "Збудувати флот"
brk_decision_build_the_fleet_desc:0 ""

brk_decision_build_graven_ship:0 "Збудувати корабель Ґрейвена"
brk_decision_build_graven_ship_desc:0 ""

brk_raiding:0 "Північні рейдери"
brk_raiding_desc:0 "Поява наших кораблів на горизонті викликає страх навіть у найсміливіших людей. Від далекої Безмежної Білості до тепліших південних вод — про наші напади говорять пошепки, зі страхом у голосі.\n\nРейди можуть викликати агресивну відповідь з боку цілі. Ми можемо поступово загострювати конфлікт — аж до: §Rвійни.§!"

brk_raid_borders_initial_raid:0 "Провести рейд на [From.GetNameDef]"

brk_light_border_raid_defender_warning:0 "Попередні рейди з боку [BRK.GetNameDef]"
brk_light_border_raid_defender_warning_desc:0 "Рейдерські загони перетинають наші кордони зі Зламаного Берега, грабуючи поселення й викрадаючи запаси. Скоро ці рейди досягнуть кульмінації — або відступом ворога (з нашим добром), або битвою між нашими військами."

brk_light_border_escalate_raid_defender_warning:0 "Можлива ескалація з боку [BRK.GetNameDef]"

brk_light_border_escalate:0 "Загострити рейд проти [From.GetNameDef] до прикордонного конфлікту"

brk_escalate_conflict:0 "Загострити прикордонний конфлікт"
brk_escalate_conflict_to_war:0 "Ескалація конфлікту у війну"
brk_back_out_of_conflict:0 "Відступити з прикордонного конфлікту"

brk_raiding_vic:0 "Вогні через воду"
brk_raiding_vic_desc:0 "Вогні Нової Вікторії мерехтять через воду, обіцяючи славу й багатство. Настав час зробити ці багатства нашими — час рейду на [VIC.GetNameDef]."

brk_vic_practice_raid:0 "Навчальний рейд"
brk_vic_practice_raid_desc:0 "Рейд — це просто: наставив зброю на беззахисну людину — й забрав її цінності. Але провести рейд через воду на ворожу державу? Це вже складніше. На щастя, неподалік на березі живе невелика й відносно слабка держава — [HAI.GetName]. Відпрацюємо наші рейдерські навички на них, аби бути готовими до справжньої кампанії проти [VIC.GetNameDef]."

brk_vic_raid_the_coasts:0 "Рейд узбереж"
brk_vic_raid_the_coasts_desc:0 "Жителі [VIC.GetNameDef] жили у відносній безпеці, порівняно з тими, хто вижив у Безмежній Білості. Вони не бояться нашого прапора, ані наших кораблів. Ми повинні навчити їх страху, перш ніж зможемо володарювати над ними. Узбережжя величезні — надто великі, щоб їхня армія могла їх захистити. Ідеальний початок для кампанії терору."

brk_vic_raid_the_ports:0 "Рейд портів"
brk_vic_raid_the_ports_desc:0 "Тепер, коли узбережжя охоплені жахом, час перейти до складніших цілей — портів та міст. Напади на ці місця будуть ризикованішими через концентрацію ворожих сил, проте винагорода варта зусиль."

brk_vic_seize_winter_harbour:0 "Захопити Зимову Гавань"
brk_vic_seize_winter_harbour_desc:0 "Зимова Гавань — далеко від серця Нової Вікторії: ізольована й багата. Вона ідеально підходить для добре скоординованого вторгнення. Але питання залишається — як саме ми це зробимо? Є три плани..."

brk_vic_wartime:0 "Війна за Вікторію"
brk_vic_wartime_desc:0 "Колись мародерство у великому місті Нова Вікторія було лише мрією. Тепер ця мрія майже реальність. Час війни настав."

brk_vic_terror:0 "Правління терору"
brk_vic_terror_desc:0 "Люди узбереж і портів бояться наших кораблів, але тепер і вся Нова Вікторія має боятись нашого прапора. Лише коли страх проникне в кожне серце — місто буде нашим."
