# tooltips
brk_can_raid_vic_or_hai:0 "Ціль — або §H[VIC.GetNameDef]§!, або §H[HAI.GetNameDef]§!: ми можемо проводити лише один морський рейд одночасно.\n"
brk_raid_decisions:0 "Наслідки цього рішення залежать від того, як §Y[From.GetNameDef]§! відреагує на наш рейд!\n"
brk_activate_escalation_decision:0 "З’явилося нове рішення, що дозволяє перетворити рейд на прикордонний конфлікт.\n"
BRK_prelim_raid:0 "Ми наразі не проводимо жодного рейду.\n"
BRK_setting_up_raid:0 "Неможливо одночасно рейдити кілька ворогів.\n"
brk_vic_decision_chain_tt:0 "Завершення цього фокусу відкриває §Yланцюжок рішень§! для рейдів, вторгнення та війни проти §H[VIC.GetNameDef]§!\n"
brk_vic_success_tt:0 "§HУспіх!§!\n"
brk_vic_failure_tt:0 "§RПровал!§!\n"
brk_vic_raid_underway_tt:0 "Наразі ми не ведемо активного рейду проти §H[VIC.GetNameDef]§! або §H[HAI.GetNameDef]§!.\n"
brk_vic_improve_odd_tt:0 "§RЧерез те, як працює механіка «випадковості» в HOI4, при невдачі цього рішення єдиний спосіб покращити шанси — завершити тренувальний рейд проти [HAI.GetName].§!"
brk_vic_coast_raid_tt:0 "Ми хоча б раз успішно рейдили їхнє узбережжя.\n"
brk_vic_port_raid_tt:0 "Ми хоча б раз успішно рейдили їхні порти.\n"
brk_vic_port_seized_tt:0 "Ми здійснили одну з трьох операцій із захоплення §HВінтер-Гарбору§!.\n"
brk_vic_plan_1_tt:0 "Три рейдерські дивізії захоплюють §HВінтер-Гарбор§!, а четверта висаджується в §HГолден-Гайтс§!. Настав час §Rоголосити війну§! §HНовій Вікторії§!!\n"
brk_vic_plan_2_tt:0 "Дві рейдерські дивізії захоплюють §HВінтер-Гарбор§!.\n"
brk_vic_plan_3_tt:0 "Ми захоплюємо, грабуємо й залишаємо §HВінтер-Гарбор§! вкритим кров’ю, як попередження.\n"
brk_vic_choose_plan_tt:0 "Під час події планування ви зможете обрати один із трьох планів.\n"
the_moot_graven:0 "Підтримав Ґрейвена на Віче."
the_moot_ragnar:0 "Підтримав Рагнара на Віче."
brk_60_cooldown:0 "Наступне рейдове рішення буде доступне через §H60§! днів після завершення попереднього.\n"
brk_80_cooldown:0 "Наступне рейдове рішення буде доступне через §H80§! днів після завершення попереднього.\n"
brk_100_cooldown:0 "Наступне рейдове рішення буде доступне через §H100§! днів після завершення попереднього.\n"
BRK_raiding_fleet_tt:0 "Буде сформовано флот під Чорним Прапором."
BRK_graven_boat_tt:0 "Буде побудований лінкор §H«Палац Ґрейвена»§!."
brk_haida_raid_tt:0 "Завершено рейд проти §H[HAI.GetNameWithFlag]§! з успішним захопленням §YПорту Морес§!."
cascadia_cores_tt:0 "Отримує осердя на всі провінції §YОстрів Ґрем§!, §YОстрів Ванкувер§!, а також §YПівденну§!, §YПівнічно-східну§! і §YПівнічно-західну Колумбію§!."