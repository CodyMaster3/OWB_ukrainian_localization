l_english:

# focuses
brk_nf_our_fathers:0 "Наші Предки"
brk_nf_our_fathers_desc:0 "До Великої Війни Британська Колумбія була домом для найрізноманітніших людей, і її вижилі не менш різні. Пірати Зламаного Узбережжя мають різне походження, але жодне з них не принесло їм кращої долі. Всі вони втуплюються в дно напівпорожніх фляг з пивом і мріють про кращі часи. Та зрештою всі кидають кришки на барну стійку, хапають зброю й повертаються у Нескінченну Білість."

brk_nf_our_goals:0 "Велика Завірюха"
brk_nf_our_goals_desc:0 "«За часів Рудобородого була така завірюха, що ніхто, окрім нього, не наважився вийти в море. Вона затемнила небо на роки, завалила узбережжя снігом так, як ніколи раніше, і забрала тисячі життів. Кажуть, вітер завивав люттю мертвих. Але Рудобородий, цей божевільний виродок, навіть не обморозився.» — Велт, колишній капітан піратів і власник бару «Кеп-енд-Кеш» у Кувері."

brk_nf_our_gods:0 "Чому Ми Боремось"
brk_nf_our_gods_desc:0 "Гроші завжди керували Зламаним Узбережжям. Як хвилі розбиваються об його скелі, так і мрії знищуються піратами, які шукають лише наступну платню. Чи подобається мешканцям Узбережжя їхній спосіб життя з безкінечними війнами? Можливо. Але якби їм запропонували альтернативу, вони б замислились. Бо кожен хоче піти на пенсію... колись."

brk_nf_grand_moot:0 "Мут"
brk_nf_grand_moot_desc:0 "Ґрейвен Жорстокий отримав своє прізвисько не дарма. Навіть за мірками нації піратів-рейдерів його методи були особливо жорстокими. Його права рука, Рагнар, значно поміркованіший і більше нагадує колишніх лідерів Узбережжя. Було скликано Мут — віче, яке повинне кинути виклик владі Ґрейвена й визначити майбутнє нашої нації. Парі вже зроблені."

brk_nf_tech_upgrade:0 "Освічені Пірати?"
brk_nf_tech_upgrade_desc:0 "Мудрець якось сказав: «Дайте мені важіль достатньої довжини — і я викорчую для вас сонце». Сьогодні цей мудрець — лише обвуглений скелет, але за життя його слова були правдою. Щоб витягти Пустку з її жалюгідного стану та розширити вплив Узбережжя, нам потрібен дуже великий важіль: технології."

brk_nf_tech_upgrade_1:0 "Освічені Пірати"
brk_nf_tech_upgrade_1_desc:0 "Після довгих досліджень ми, нарешті, маємо важіль, щоб викорчувати північ, а, можливо, й усю Пустку. Багато років над нами глузували за технологічні витівки Порохових Мавпочок, але ми зрозуміли свою помилку. Технології — це майбутнє, вони допоможуть нам досягти будь-якої мети!"

brk_fancy_ind_1:0 "Утилізатори"
brk_fancy_ind_1_desc:0 "Рейдери Зламаного Узбережжя можуть перетворити будь-що на зброю!"

brk_fancy_ind_2:0 "Інструменти Пустки"
brk_fancy_ind_2_desc:0 "Ми знайшли старий сховок інструментів в уламках затонулого корабля!"

brk_nf_ruler_pol:0 "Ґрейвен Жорстокий"
brk_nf_ruler_pol_desc:0 "Історії про молодість Ґрейвена — це справжні жахіття. Його шлях до влади був укритий кров’ю, а піднесення до голови Узбережжя супроводжувалось різаниною невинних. Зрада на Муті лише підлила олії у вогонь його люті, остаточно знищивши залишки людяності. Ніщо не зупинить його тепер. §RЛють Ґрейвена вічно лунатиме Пусткою!§!"

brk_nf_ruler_pol_1:0 "Зміцнити Владу"
brk_nf_ruler_pol_1_desc:0 "Кров. Єдине слово, що описує тиждень після Муту. Звихнений від зради, Ґрейвен особисто вийшов на вулиці та в море, щоб вистежити й знищити майже кожного, хто проголосував проти нього. Полювання триває, але результат очевидний: мешканці Узбережжя більше не посміють сумніватись у його владі — з остраху перед його гнівом."

brk_nf_ruler_pol_2:0 "Поневолити Опозицію"
brk_nf_ruler_pol_2_desc:0 "Ґрейвен повернувся до Кувера на чолі корабля, прикрашеного відтятими головами ворогів. На крижаному причалі стояв на колінах Рагнар — у кайданах, накладених Ґрейвеном ще тижнями раніше, — і спостерігав, як усі, кого він колись любив, §Rповертаються як гнилі трофеї.§! Рагнар — зламаний чоловік, трофейний командир Ґрейвена й грізне нагадування, що навіть найсильніші не мають шансів проти нього."

brk_nf_ruler_pol_side:0 "Великий Палац Ґрейвена"
brk_nf_ruler_pol_side_desc:0 "Колишня ратуша Ванкувера, бетонна вежа, де колись обговорювали витрати бюджету, тепер — арена кривавих боїв, розгулу наркотиків і вірних воїнів Ґрейвена. Стояти в його палаці й дивитись на статую самого Ґрейвена — це честь... принаймні, за його словами. Стіни повні очей. І той, хто вийде за рамки дозволеного, — ніколи не вийде звідти живим."

brk_nf_ruler_pol_side_1:0 "Палац-Корабель Ґрейвена"
brk_nf_ruler_pol_side_1_desc:0 "Охоплений люттю й параноєю через зраду на Муті, Ґрейвен спроєктував корабель, гідний такого завойовника. Це — плавучий палац розкоші з усіма можливими зручностями, який водночас несе в собі вогневу міць, здатну знищити все на шляху. Він наказав негайно почати будівництво свого шедевра — і його люди не можуть не підкоритися."

brk_nf_wife_of_conquest:0 "«Трофейна» Дружина"
brk_nf_wife_of_conquest_desc:0 "В залі аудієнцій Ґрейвена стоїть трон, зібраний із уламків флагмана, а в ньому — почорнілий скелет у червоному мундирі. На місці черепа — шматок брухту у формі корони. Це останки королеви Вікторії, колись славетної володарки острівної нації. Тепер вона — моторошна прикраса, трофей Ґрейвена й нагадування всім про його страшну силу. Легенда про її загибель шириться Каскадією, залучаючи до чорного й синього стяга нових рейдерів."

brk_nf_wife_of_strength:0 "Бій за Дружину"
brk_nf_wife_of_strength_desc:0 "Ґрейвен бачить у жінці або забавку, або інструмент. І зараз йому потрібен інструмент. Він оголосив гладіаторський турнір, переможниця якого отримає місце поруч із ним. Схиблені рейдерки одна за одною записуються, сподіваючись приборкати найжорстокішого чоловіка Півночі."

brk_nf_elites_pol:0 "Рагнар Могутній"
brk_nf_elites_pol_desc:0 "Правиця Ґрейвена більшість його життя, Рагнар Могутній шокував усіх, коли виступив проти нього на Муті. Його ім’я — не просто прізвисько: він більший і дужчий за будь-кого на Узбережжі. Здобувши перемогу, §Rцей звір тепер повинен скласти сходи з тіл своїх ворогів, щоб зійти на трон Ґрейвена.§!"

brk_nf_elites_pol_1:0 "Поєдинок"
brk_nf_elites_pol_1_desc:0 "Смак заліза в роті Ґрейвена, рана від чола до підборіддя, і сокира, вдвічі більша за нього, що вгризається в груди. Його зламані ребра розлітаються, як конфетті, і влада Ґрейвена — скінчилась. Навколо лунають вигуки: «Хай живе §MРагнар Могутній§!, убивця §RҐрейвена Жорстокого§!»"

brk_nf_elites_pol_2:0 "Утворити Раду Воїнів"
brk_nf_elites_pol_2_desc:0 "З перемогою Рагнара та втечею решток Ґрейвенових прибічників настав час закріпити владу. Рагнар вірить, що Узбережжю потрібна нова система — де лише сильні мають право судити. Рада Воїнів, §Mскладена з наймогутніших чоловіків і жінок Узбережжя§!, визначатиме долю нашої землі — від рейду до рейду."

brk_nf_elites_pol_side:0 "Заснувати Порт Роял"
brk_nf_elites_pol_side_desc:0 "Колись, за легендами, Порт Роял був осередком піратства. Але Рагнар прагне більшого — не лише рейдів, а й завоювань. Побудова великого порту — перший крок до майбутнього нашого флоту."

brk_nf_elites_pol_side_1:0 "Флот Чорного Прапора"
brk_nf_elites_pol_side_1_desc:0 "З портом, що вже функціонує, Рагнар ініціює створення нового флоту — «Флоту Чорного Прапора». Він планує зробити наші піратські сили сучасними та потужними, фінансуючи проєкт за рахунок каперства. За його схемою, ми отримаємо безкоштовні екіпажі й щомісячну оплату за кораблі. Геніально!"

brk_nf_warrior_priests:0 "Рада Нападу"
brk_nf_warrior_priests_desc:0 "Лише сильні сидять за столом Рагнара, лише сильні входять до Ради Воїнів. Система «сила — це право» дає можливість сміливим і хитрим процвітати. Їхня міць зосереджена в руках однієї людини, а погляди спрямовані на слабших сусідів. Вони вже готуються до походів — точать сокири та тренують армії."

brk_nf_home_priests:0 "Рада Оборони"
brk_nf_home_priests_desc:0 "Рада Воїнів сповнена сили й могутності, але й мудрості також. Рагнар і його лідери не настільки дурні, щоб марно витрачати свою міць у нестямному кровопролитті. Час безглуздих смертей і війн завершився тоді, коли сокира Рагнара розсікла груди Ґрейвена. Тепер рада поведе нас уперед з хитрістю та передбачливістю."

brk_nf_til_strid:0 "Заклик до Зброї"
brk_nf_til_strid_desc:0 "По всьому Узбережжю пірати збираються в прокурених тавернах і на палубах кораблів, сперечаючись про листи, що їм розіслали. Узбережжя вимагає, аби кожен пірат повернув борг перед державою. Попереду — великі завоювання, і кожен, хто візьме в них участь, буде помилуваний за свої минулі злочини... або так кажуть. За таку можливість чимало людей готові померти."

brk_nf_frozen_shores:0 "Морозна Кліка"
brk_nf_frozen_shores_desc:0 "Далеко на північ від Куверу, біля крижаного кордону між Узбережжям і Ритвірами, Морозна Кліка править з фортеці зі скрученого льоду та сталі. У її рядах — гульи, злиті з Безкрайнім Білим, і давні пірати, що бачили надто багато. Їхні поради не раз рятували Узбережжя, і рятуватимуть ще довго. Їхнє саме існування робить нас безпечнішими."

brk_nf_raid_whistler:0 "Набіг на Елвіна Бліка"
brk_nf_raid_whistler_desc:0 "Віслер — це нація втікачів, що втекли від зростаючої загрози Камло. Їхні домівки втрачено, дух — зламано, і тепер вони тримаються за життя на волосині. Ми спалимо Елвіна Бліка дотла й зальємо сніг кров’ю їхніх воїнів. §RВіслер знову згадає, що таке страх перед загарбниками — і зрозуміє надто пізно, що тікати до нас було гірше, ніж лишитися з Камло.§!"

brk_nf_demand_whistler:0 "Повернення Жаху"
brk_nf_demand_whistler_desc:0 "Ліси Віслера всіяні крижаними трупами, збереженими морозом, з обличчями, застиглими в муках. Ми остаточно зламали дух Віслера, і тепер їхні землі дозріли до захоплення. Навіть якщо вони ще цього не усвідомлюють, решта населення буде вдячна за наш прихід."

brk_nf_integrate_enemies:0 "Приручення Підкорених"
brk_nf_integrate_enemies_desc:0 "Їхні лідери й близькі лежать мертвими у снігу. Громадяни Камло і Віслера залишилися лише з розпачем. Але зламаних легко ліпити — вони, наче глина, яку можна сформувати за власним бажанням. Ми візьмемо залишки ворожих земель і переплетемо їх у нову тканину крові та завоювань."

brk_nf_lessons_of_war:0 "Барабани Війни"
brk_nf_lessons_of_war_desc:0 "Північ — це величезний простір, який важко втримати через суворий клімат і віддаленість. Ті, хто живе на південь, помилково вважають північ дикою і слабкою. Це — їхня найбільша помилка. Барабани війни вибивають первісну мелодію кривавого походу, закликаючи наших людей до маршу на південь, де чекає найцінніша здобич."

brk_nf_woo_whistler:0 "Дипломатія Срібного Язика"
brk_nf_woo_whistler_desc:0 "Навіщо витрачати людей на завоювання, якщо можна досягти того ж через хитру дипломатію? Наш посол, усміхаючись, тисне руки віслерцям, перетворюючи кожне слово на пастку, §Rщо стискається навколо шиї Віслера, немов змія.§! Сьогодні — екскурсія нашими доками, завтра — візит до їхньої столиці. Чи розуміють вони, в яку пастку потрапили?"

brk_nf_protect_whistler:0 "Моя Армія — Твоя Армія"
brk_nf_protect_whistler_desc:0 "Після підписання угод Віслер повністю залежить від нас у питаннях безпеки, розпустивши своє військо в обмін на наш захист. Та вони ще не знають, що це лише перший крок у набагато підступнішому плані..."

brk_nf_aid_whistler:0 "Твоя Земля — Моя Земля"
brk_nf_aid_whistler_desc:0 "Без армії Віслер повністю у нашій владі — фактично, ми керуємо їхньою країною. Наші війська займають ключові позиції та розганяють уряд. Але наш дипломат, вдаючи миротворця, запевняє Віслер, що ми підемо... якщо вони підпишуть деякі папери. §RНа жаль для Віслера, ці папери — вирок їхній незалежності.§!"

brk_nf_raid_kamlo:0 "Набіги на Камло"
brk_nf_raid_kamlo_desc:0 "Камло — це не більше, ніж збіговисько банд під одним прапором. Їхній «лідер» — просто трохи розумніший рейдер. Ми вдаримо по найвразливішому: знищимо їхні запаси джету та мед-іксу, виріжемо рабів. Камло не витримає власної залежності."

brk_nf_break_kamlo:0 "Ніч Жаху"
brk_nf_break_kamlo_desc:0 "Рейдери поважають лише силу. Камло вже намагається відповісти на наші атаки, тож настав час показати їм, як діють справжні загарбники. Сьогодні вночі жах охопить Камло — наші накачані хімією вояки роздиратимуть рейдерів голими руками, скальпуватимуть рабів заради розваги, поки їхні крики наповнюють повітря."

brk_nf_enslave_kamlo:0 "Зламати Камло"
brk_nf_enslave_kamlo_desc:0 "Без своїх хімікатів рейдери Камло більше не можуть вгамувати параною. Шалена ніч нашої жорстокості ще палає в їхній пам’яті. Коли Камло падає під тягарем власного виродженого населення, ми завдамо вирішального удару, §Rперерізавши горлянки усім, не залишаючи їх страждати далі.§!"

brk_nf_ignite_the_forges:0 "Запалити Горни"
brk_nf_ignite_the_forges_desc:0 "Час запустити наші фабрики. Нам потрібна зброя для наших воїнів, і в нас є раби, які її виготовлять."

brk_nf_salvage_parties:0 "Обшук Руїн"
brk_nf_salvage_parties_desc:0 "Надсилаємо рабів до великих руїн — хай шукають усе, що може стати в пригоді."

brk_nf_drive_the_cattle_home:0 "Раби для Узбережжя"
brk_nf_drive_the_cattle_home_desc:0 "Наші воїни зайняті грабунком і війною. Потрібно більше рабів, щоб працювати вдома — на жалюгідних роботах, недостойних наших людей."

brk_nf_expand_the_forges:0 "Розширити Горни"
brk_nf_expand_the_forges_desc:0 "Базові кузні вже працюють. Тепер збільшимо виробництво, кинувши туди ще більше рабів."

brk_nf_water_purification:0 "Будівництво Очисників"
brk_nf_water_purification_desc:0 "Наш народ надто довго страждав від спраги та нестачі чистої води. З цією постановою ми починаємо будівництво великої системи водоочищення."

brk_nf_slave_habitation:0 "Змусити їх Працювати"
brk_nf_slave_habitation_desc:0 "Маємо рабів — настав час змусити їх працювати. Почнемо з ремонту будь-якого мотлоху, який можемо використати."

brk_nf_scour_the_coast:0 "Скарби Узбережжя"
brk_nf_scour_the_coast_desc:0 "Пірати люблять приховані скарби. Наш скарб — сталь. Вона потрібна нам для горнів. Відправляємо рабів до узбережжя на пошуки цього цінного ресурсу."

brk_nf_boon_of_njord:0 "Володарі Хвиль"
brk_nf_boon_of_njord_desc:0 "Десятиліттями ми панували над хвилями Зламаного Узбережжя. Тепер настав час рушити ще далі."

brk_nf_slave_selection:0 "Елітні Раби"
brk_nf_slave_selection_desc:0 "Ми маємо обрати найкращих рабів для роботи на наших фабриках. Це значно підвищить їхню продуктивність."

brk_nf_blessed_steel:0 "Благословенна Сталь"
brk_nf_blessed_steel_desc:0 "Наша сталь немов благословенна вищою силою. Ми будуємо більше кузень, ніж будь-хто до нас. І знищимо кожного, хто стане на нашому шляху."

brk_nf_dig_deep:0 "Канадські Трубопроводи"
brk_nf_dig_deep_desc:0 "Нещодавно ми знайшли старі довоєнні трубопроводи Канади. Якщо вдасться їх відновити — отримаємо чималий приріст ресурсів."

brk_nf_slave_shedules:0 "Права Рабів"
brk_nf_slave_shedules_desc:0 "З надмірною смертністю рабів через жорстоке поводження, серед них наростає невдоволення. Встановлення обмежень для воїнів збереже нашу робочу силу."

brk_nf_smith:0 "Тримаємо Темп"
brk_nf_smith_desc:0 "Якщо ми хочемо стати лихом морів, наша промисловість має бути найкращою. Довіримо це нашим наймудрішим ковалям та інженерам."

brk_nf_add_spikes:0 "Жах Узбережжя"
brk_nf_add_spikes_desc:0 "Шипи на зброї та броні не лише наганяють страх, а й додають нам переваги в бою."

brk_nf_add_plating:0 "Панцирні Воїни"
brk_nf_add_plating_desc:0 "Додаткові шари броні захистять нас не лише від ворогів, а й від лютої погоди. Чим товстіше — тим краще."

brk_nf_master_smith:0 "Броня Узбережжя"
brk_nf_master_smith_desc:0 "Високотехнологічна силова броня дасть нам перевагу над усіма ворогами. Наші кращі розуми займуться її розробкою."

brk_nf_add_more_spikes:0 "Підсилення Жаху"
brk_nf_add_more_spikes_desc:0 "Шипи на силовій броні змусять ворогів тікати як дівчатка. Наша броня стане заздрістю всього світу. Нас не спинити."

brk_nf_add_more_plating:0 "Посилене Панцирування"
brk_nf_add_more_plating_desc:0 "Силова броня зробить наших бійців непереможними. Чим товща — тим краще!"

brk_nf_dockyards:0 "Порт Тантал"
brk_nf_dockyards_desc:0 "Щоб стати справжніми піратами, ми маємо розширити доки. Почнемо з Порту Тантал."

brk_nf_dockyards_1:0 "Порт Кувер"
brk_nf_dockyards_1_desc:0 "Наша столиця матиме величний порт, який перевершить будь-яку націю. Ми — справжній страх морів."

brk_nf_dockyards_2:0 "Порт Сешет"
brk_nf_dockyards_2_desc:0 "Ми продовжуємо будівництво великого флоту в місті Сешет. Це порти нашого майбутнього."

brk_nf_dockyards_3:0 "Порт Ков"
brk_nf_dockyards_3_desc:0 "Ерлз Ков — місто не з великих, але ми розбудуємо його з портом, перетворивши на великий торговельний вузол."

brk_nf_longboats:0 "Давні Рейдери"
brk_nf_longboats_desc:0 "Від моменту заснування Зламаного Узбережжя ми пануємо на морях. Нещодавні знахідки в Північному Кувері відкрили нам тактики наших пращурів."

brk_nf_longboats_1:0 "Різноманітний Флот"
brk_nf_longboats_1_desc:0 "Зробивши перші кроки, ми можемо розширити флот. Наш флот буде величним."

brk_nf_longboats_2:0 "Досвід Рейдування"
brk_nf_longboats_2_desc:0 "Ми маємо більше досвіду в рейдуванні, ніж будь-хто у пустках. Хай лише хтось спробує нас зупинити."

brk_nf_longboats_3:0 "Жах Морів"
brk_nf_longboats_3_desc:0 "Наш флот перевершив усіх у пустках. Ми повністю контролюємо моря. Кожен, хто увійде в наші води — наражається на гнів."

brk_nf_workshops:0 "Розширення Столиці"
brk_nf_workshops_desc:0 "Наша велика столиця потребує розширення фабрик для виробництва всього необхідного для майбутньої експансії."

brk_nf_workshops_1:0 "Розвиток Сешет"
brk_nf_workshops_1_desc:0 "Сешет має стати одним із наших головних міст. Розширення фабрик — природний крок."

brk_nf_workshops_2:0 "Фабрики до Кову"
brk_nf_workshops_2_desc:0 "Ков — ідеальне місце для розширення промисловості. Його природний захист і флотська база є ключем до цього."

brk_nf_workshops_3:0 "Розвиток Танталу"
brk_nf_workshops_3_desc:0 "Танталовий Біль — прибережне місто, яке ми розбудуємо для обслуговування нашого флоту. Почнемо з фабрик."

brk_nf_recruitment_drive:0 "Рейдери Узбережжя"
brk_nf_recruitment_drive_desc:0 "Наші елітні воїни — Рейдери Узбережжя. Ми маємо навчити більше таких."

brk_nf_recruitment_drive_1:0 "Обряд Посвяти"
brk_nf_recruitment_drive_1_desc:0 "Наші юні воїни йдуть у світ довести свою силу. Їхнє місце — у наших арміях."

brk_nf_recruitment_drive_2:0 "До Великої Вічності"
brk_nf_recruitment_drive_2_desc:0 "Ті, хто ослаб і постарів у старому порядку, можуть здобути найвищу честь — загинути у бою та увійти до Великої Вічності."

brk_nf_manufacturing_drive:0 "На Повну Потужність"
brk_nf_manufacturing_drive_desc:0 "Щоб стати регіональною наддержавою, ми повинні зосередити всі сили на виробництві зброї, броні та кораблів. Наша промисловість зрівняється з Піттом."

brk_nf_manufacturing_drive_1:0 "Майстри-Будівельники"
brk_nf_manufacturing_drive_1_desc:0 "Деякі з рабів виявили талант до будівництва. Даруємо свободу здатним і робимо з них Майстрів-Будівельників. Вони слухняні, але вправні."

brk_nf_manufacturing_drive_2:0 "Укріплення Узбережжя"
brk_nf_manufacturing_drive_2_desc:0 "Якщо ми хочемо влади на півночі — маємо забезпечити безпеку. Будівництво фортифікацій — наш пріоритет."

brk_nf_new_victoria:0 "На Меч"
brk_nf_new_victoria_desc:0 "Нова Вікторія — безпечна гавань, іронічно розташована в наших водах. Сьогодні їхній спокій завершується. Ми вдаримо по північних портах. §RІ фальшива королева впаде.§!"

brk_nf_dredgers:0 "Ворог на Півночі"
brk_nf_dredgers_desc:0 "Дредґери контролюють північ, укріпившись у Принс-Джорджі. Там — метали й ресурси, потрібні для нашого флоту. §RМи їх зітремо.§!"

brk_nf_pirate_coast:0 "Світанок Нової Ери"
brk_nf_pirate_coast_desc:0 "Зламане Узбережжя завжди було у вогні — зрада, вбивства, капітани піратів. Але все змінилося, коли §Rнайсильніший син Морозу§! переміг §Rу кривавій битві минулого.§! Ми перероджені!"

brk_nf_bellingham_kill:0 "Об’єднання Кувера"
brk_nf_bellingham_kill_desc:0 "Кувер розділено рікою. Рейдери завжди прагнули його. Настав час повністю його захопити!"

brk_nf_washbos_kill:0 "Чистка Сіетлу"
brk_nf_washbos_kill_desc:0 "Сіетл приховує таємниці — «привиди» в чорній броні з палаючими очима. Вони зникають з людьми. Але §RСіетл буде нашим.§!"

BRK_tech_adjustment_focus:0 "Ця ідея надає Зламаному Узбережжю доступ до нових технологій. Коли вона завершиться — ми станемо цивілізованими."
