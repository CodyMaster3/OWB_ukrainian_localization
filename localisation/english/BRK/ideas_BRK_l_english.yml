l_english:
brk_startup_natives:0 "Спадщина Корінних Поселенців"
brk_startup_natives_desc:0 "Зламана Узбережжя – дім для багатьох народів, та її післявоєнна культура головно вийшла з традицій корінних племен узбережжя. Їхній вплив відчувається й досі."

brk_startup_marines:0 "Спадщина Морської Піхоти"
brk_startup_marines_desc:0 "Багато хто прибув на Узбережжя, але його дух після війни сформували морські піхотинці США, які служили тут до Великої Війни. Їхній слід залишився у всьому."

brk_startup_sailors:0 "Спадщина Моряків"
brk_startup_sailors_desc:0 "Хоча народів на Узбережжі багато, культуру після війни принесли іноземні моряки, що опинились тут через ядерний апокаліпсис. Їхня морська відвага й досі живе в наших серцях."

brk_startup_fled:0 "Гнучкість"
brk_startup_fled_desc:0 "Жорстка погода й безжальні місцеві – на Узбережжі легко не живеться. Виживає тут лише той, хто вміє пристосовуватись. Знати, коли битися, а коли тікати – життєва необхідність."

brk_startup_sheltered:0 "Захищеність"
brk_startup_sheltered_desc:0 "Іноді найкращий вибір – просто перечекати. Будь то бійка в шинку чи шторм з океану, наші люди знають, як триматися осторонь небезпеки."

brk_startup_weathered:0 "Загартовані"
brk_startup_weathered_desc:0 "Світ рано чи пізно тебе дістане, й усе, що залишиться – терпіти. Щоб вижити на Узбережжі, треба не здаватись, хоч що б сталося. \n\nСлабким тут не місце."

brk_startup_riches:0 "Жадоба до Здобичі"
brk_startup_riches_desc:0 "Земля в нас сувора, але щоденна здобич – чудова компенсація. Крадучи все необхідне, ми можемо спрямовувати сили на справді важливі речі."

brk_startup_slaves:0 "Потік Рабів"
brk_startup_slaves_desc:0 "На Узбережжі завжди є постійний приплив рабів. Хоч більшість з них годяться лише для важкої праці, деякі стануть добрими солдатами. Хто краще воює, ніж той, хто знає своє місце?"

brk_tech_adaptation:0 "Технічна Адаптація"
brk_tech_adaptation_desc:0 "Адаптація вимагає зусиль. Але якщо ми впораємось – це принесе нам значну перевагу."

brk_tech_adaptation_rewards:0 "Адаптація Завершена"
brk_tech_adaptation_rewards_desc:0 "Наші зусилля не були марними. Тепер ми грабуємо з розумом – і з силою."

brk_ruler:0 "Ґрейвен Жорстокий"
brk_ruler_desc:0 "Маскований воєначальник знову очолив Зламану Узбережжя. Залізна рука й важка сокира – ось чим править Ґрейвен. Незабаром його клинок знову скуштує кров ворогів."

brk_ruler_1:0 "Беззаперечна Влада"
brk_ruler_1_desc:0 "Кривавим і варварським був шлях до трону, але Ґрейвен висловився ясно – тілами своїх ворогів: \n\n\"Я один правлю Узбережжям. І ось що чекає кожного, хто кине мені виклик.\""

brk_ruler_2:0 "Поневолений Опонент"
brk_ruler_2_desc:0 "Після повернення Ґрейвена, Рагнар став лише тінню самого себе. Його дух був зломлений і втоптаний у мерзлу землю.\n\nТа навіть зрадник може стати у пригоді – смерть була б надто милосердною."

brk_ruler_3_conquest:0 "Трофейна Королева"
brk_ruler_3_conquest_desc:0 "У старих квартирах над гаванню Вікторії шепочуть: \n\"Він забрав нашу королеву... й зробив жахливі речі.\"\n\nҐрейвен здобув не лише землю, а й душу її народу."

brk_ruler_3_strength:0 "Воїнська Королева"
brk_ruler_3_strength_desc:0 "Дика й люта – саме така пара личить лорду Узбережжя. З королевою при боці, з Рагнаром під п’ятою, Ґрейвен готується до нових завоювань."

brk_elites:0 "Рагнар"
brk_elites_desc:0 "Велетень не лише тілом, а й духом. Колись вірний пес Ґрейвена, тепер – найнебезпечніший суперник."

brk_elites_1:0 "Поєдинок"
brk_elites_1_desc:0 "Люди вже визнали Рагнара як сильного лідера. Короткий, але кривавий двобій став суворим нагадуванням, чому Ґрейвена кличуть Могутнім."

brk_elites_2:0 "Рада Воїнів"
brk_elites_2_desc:0 "Рагнар не скотився до тиранії Ґрейвена. Натомість Зламаним Узбережжям тепер керує Рада Воїнів – мудрі та сильні. Народ б’ється за них із гордістю."

brk_elites_2_offense:0 "Рада Нападу"
brk_elites_2_offense_desc:0 "Рада Воїнів навчає бити швидко й сильно. Незабаром сусіди дізнаються, що таке гнів Узбережжя."

brk_elites_2_defense:0 "Рада Захисту"
brk_elites_2_defense_desc:0 "Наші рейдери звикли до ярості, але Рада Воїнів учить: коли чекати, а коли бити. Це шлях до перемоги."

brk_salvage_parties:0 "Загін Пошуковців"
brk_salvage_parties_desc:0 "Ми вирушаємо до руїн, щоб витягти з минулого усе, що можемо використати сьогодні."

brk_slave:0 "Раби"
brk_slave_desc:0 "Кожен рейд приносить нових рабів. А кожен раб – ще один шанс відправити новий рейд. Цикл краси й слави."

brk_slave_1:0 "Працюючі Раби"
brk_slave_1_desc:0 "Організувавши рабську працю, ми значно збільшили нашу продуктивність. Спорядження завжди буде в нормі."

brk_slave_2:0 "Відбір Рабів"
brk_slave_2_desc:0 "Відділивши сильних від розумних, ми використовуємо кожного максимально ефективно. Зброї буде вдосталь."

brk_slave_3:0 "Графік Рабів"
brk_slave_3_desc:0 "Закони для рабів вигідні нам. Мертві раби не працюють. А деякі, можливо, навіть воюватимуть за нас..."

brk_spikes:0 "Шипи"
brk_spikes_desc:0 "Шипи – це не лише страх, це й додатковий удар у бою."

brk_spikes_1:0 "Більше Шипів"
brk_spikes_1_desc:0 "Шипи повсюди. Їхня кров буде капати з кожного виступу нашої броні."

brk_plates:0 "Броня"
brk_plates_desc:0 "Міцні плити тримають нас живими – а ворогів мертвими."

brk_plates_1:0 "Ще Більше Панциря"
brk_plates_1_desc:0 "Ми не воїни – ми ходячі фортеці."

brk_manu_drive:0 "Рабовласники"
brk_manu_drive_desc:0 "Наші майстри керують усім виробництвом. Раби – лише знаряддя в їхніх руках."

brk_manu_drive_1:0 "Рабовласники"
brk_manu_drive_1_desc:0 "Майстри використовують усіх, щоб збудувати імперію вогню та сталі."

brk_manu_drive_2:0 "Рабовласники"
brk_manu_drive_2_desc:0 "Все для війни. Все руками рабів."

brk_naval_range:0 "Повелителі Морів"
brk_naval_range_desc:0 "Ми досягнемо будь-якого берега. Від нас не сховається жоден торговець."

brk_terrorized:0 "Терор Рейдерів"
brk_terrorized_desc:0 "Ім’я Узбережжя вимовляють з жахом. Ми – привид у тумані, смерть із хвиль."

brk_coastal_terror:0 "Жах Узбережжя"
brk_coastal_terror_desc:0 "Моря – наші. Наші моряки досвідчені, а наші рейди – смертоносні. І неважливо, звідки прийде здобич – ми її знайдемо."

brk_raider_society:0 "Товариство Рейдерів"
brk_raider_society_desc:0 "Наші люди живуть здобиччю, наші рейдери загартовані горами й крижаним вітром. Але інновації? Це вже якось не про нас."

brk_vic_patriotic_defence:0 "Патріотичний Захист"
brk_vic_patriotic_defence_desc:0 "Рейдери загрожують не лише прибережним портам – вони вже на нашій землі, прагнучи поневолити нас. Ми не дозволимо їм цього. Ми боротимемось."
