l_english:
RMT_BOOTH_CROW_DESC:0 "Бут Кроу"
RMT_BOOTH_DESC:0 "Бута виростили в неспокійному племені, яке було занадто зосереджене на внутрішніх проблемах, щоб повністю усвідомити загрози довкола. Природжений популіст, його популярність росла з віком, але його ідеї відгородитися від зовнішнього світу були засновані не на мілітаризмі, а на ідеалах співпраці. Прихід так званої «республіки» Маршалів призвів до втрати плем’ям свого священного місця – гори Рашмор. Тепер, коли його влада похитнулася після втрати гори, Бут має зробити вибір: впасти на бік войовничих або залишитися вірним своєму прагненню до мирного вирішення."

RMT_FLAMMANG_ASTHOL_NAME:0 "Фламманг Астол"
RMT_FLAMMANG_DESC:0 "Фламманг прагне об'єднати свій народ – багатих і бідних – для повернення до Рашмора. Щоби по-справжньому боротися з економічною несправедливістю, недостатньо лише скидати промисловців або пригнічувати заради вигоди – слід знайти спільну мову. Гасло Фламманга просте, але дієве: «Чесна угода для кожного». Час покаже, чи допоможе ця угода повернути гору Рашмор."

RMT_SHURA_HICKEY_NAME:0 "Шура Хікі"
RMT_SHURA_DESC:0 "Шукати помсти за будь-яку ціну. Не йти на компроміси в питанні відплати. Накопичувати відсотки з помсти.\n\nШура Хікі охопила Чотирьох Батьків цими простими настановами, і вони слідують їм з фанатичною відданістю. Горе тим, хто стане на шляху Шури або її народу. Над Дакотою нависає тінь – крик, який не знає жалю."

RMT_WAYLES_THOMAS_NAME:0 "Вейлз Томас"
RMT_WAYLES_DESC:0 "Вейлз знає, що традиція – це ворог прогресу, а помста – відволікання від зростання. Її піднесення до влади довело, що її ідеї знайшли відгук у масах.\n\n«Нехай гора Рашмор залишиться пам’ятником минулому – разом з усіма його вадами»."

