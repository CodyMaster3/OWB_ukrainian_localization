KAM_RANGER_KENNETH_NAME:0 "Рейнджер Кеннет"
KAM_RANGER_KENNETH_DESC:0 "Колись улюблений батько п’ятьох дітей і надзвичайний лідер загону піонерів-скаутів, Рейнджер Кеннет перебував у поході зі своїм загоном, коли впали бомби. Приголомшений і зломлений, він відступив у радіоактивні зимові соснові ліси, загубивши себе, перш ніж знайти інших таких самих, як він — загублених і зламаних людей, однаково знедолених. Незабаром він зібрав велику групу, і коли запаси почали вичерпуватися, а його розум розсипався шматок за шматком, він ставав усе більш жорстоким.\n\nЙого люди — Камлопські виживальники, як їх називали кочівники з Вістлера, — складалися з вигнанців, тих, хто вижив, і колишніх працівників парків. Насправді, Кеннет просто шукав когось, хто б слухав його маячні думки, коли він усе глибше занурювався в маніакальні стани. Зрештою він знайшов друга в гуліфікованій мавпі на ім’я Хорхе. Вони стали нерозлучними, і Кеннет часто використовував Хорхе як довірену особу для своїх сентиментальних спогадів... або щоб підкріпити власні переконання."