  ###Timekeepers events
  clk_vault.1.t:0 "Сховище, що цокає"
  clk_vault.1.d:0 "Початок був простим. Коли Сховище запечатали і впали бомби, ті, хто був усередині, відчули полегшення від того, що їх оминуло спустошення зовнішнього світу. Єдиною дивністю була наполегливість Наглядача, щоб жителі дотримувалися жорсткого розкладу, який диктував, коли їм їсти, спати, відпочивати та працювати. Поступово розклад ставав дедалі всеосяжнішим, вказуючи, коли настав час кожному жителю робити майже будь-що, чи то стригтися, чи гратися з дітьми. Ті, хто ставив під сумнів таку необхідність, позбавлялися їжі та води, і з часом Сховище наповнилося цоканням і боєм сотень годинників. Через кілька поколінь час став незмінним супутником і господарем жителів Сховища 60, і більше не виникало питань щодо його важливості. Вони відстежують його, живуть за ним і бояться дня, коли він закінчиться для них, або для світу в цілому. Цей останній страх призвів до того, що в головах найсвітліших умів Сховища зародилася одержимість, і вони мають одне головне питання, яке потребує відповіді: чи може Час коли-небудь рухатися назад, як він рухається вперед?"
  clk_vault.1.a:0 "Час лікує."

  clk_vault.2.t:0 "Наглядач: Ток"
  clk_vault.2.d:0 "Чоловік, який згодом став Головним Хранителем Часу та Наглядачем Сховища 60, колись був ученим, що з нетерпінням прагнув вийти за двері та пізнати новий світ, від якого вони так довго були сховані. Це мрійливе диво розбилося об цілком реальний кошмар. Те, що він знайшов, було попелястою пустелею, всіяною зневіреними вцілілими та монстрами, яких він навіть не міг собі уявити. Разом із рештою своєї розвідгрупи Ток дослідив регіон, занотовуючи все побачене у свій Піп-Бой 2000. У своїх записах він детально описав ворожі племена, що заповнювали землі в усіх напрямках, кігтів смерті, які роздерли його найближчого товариша, і радіацію, що все ще змушувала клацати його лічильник Гейгера. Проте це був не лише суцільний жах; траплялися й моменти тріумфу та відкриттів. Саме Ток і його співвітчизники переламали ситуацію і врятували тих, хто жив у руїнах Бівер-Сіті, від загону супермутантів-мародерів, заслуживши вдячність уцілілих. Саме Ток виявив дивних гулеподібних людей, про яких час, здавалося, забув, і записав інформацію про них для нащадків зі Сховища. Цього було достатньо, щоб після повернення розвідгрупи Тока, який став фактичним лідером групи, зустрічали як героя-переможця. У наступні дні Ток роздумував про жахливий і зруйнований світ, який він побачив і задокументував. Коли його призначили Головою Часу і, таким чином, першим Наглядачем Сховища, його розум усе ще був зайнятий тим, наскільки сильно час і радіація спустошили землю. Час був найвидатнішою силою з усіх, думав він. Це було щось більше, ніж те, що досі розуміли у Сховищі. Він був усемогутнім і добігав кінця. Єдиним способом врятувати світ було його відновлення."
  clk_vault.2.a:0 "Веди нас до порятунку!"

  clk_vault.3.t:0 "Шлях попереду"
  clk_vault.3.d:0 "Битва за південно-західну Юту закінчилася після того, що здавалося вічністю крові й боротьби, смертю Солі-на-Рани від рук Наглядача Тока. Те, що дике плем'я вважало легкою перемогою над слабкими й боязкими мешканцями нір, перетворилося на виснажливу війну за кожен запорошений пагорб і зруйновану будівлю. В останні дні конфлікту Хранителі Часу почали сповна відплачувати за кожен темний вчинок, скоєний проти них, спалюючи та руйнуючи табори Білоногих на своєму шляху. Вражені запеклою рішучістю й абсолютною жорстокістю своїх ворогів, Білоногі склали зброю і благали про пощаду. Певною мірою її було надано, хоча Хранителі Часу змінилися після свого першого знайомства з війною. Цим племенам жорстоких і примітивних людей не буде дозволено загрожувати святості Сховища, і успадкування світу такими людьми лише зміцнило їхню рішучість спробувати врятувати світ. Щодо Білоногих, вони були шоковані до покори силою та жорстокістю своїх ворогів, і незабаром виявили, що поклоняються новітньому та найсильнішому богу свого пантеону: Часу."
  clk_vault.3.a:0 "Це лише початок."

  clk_vault.4.t:0 "Друзі у вищих колах"
  clk_vault.4.d:0 "Вони зустрілися під землею в напівзруйнованому бункері, обом було комфортніше в такому середовищі. Одному — через прихисток від палючого пустельного сонця, іншому — бо це нагадувало дім. Коли Білоногі були розбиті і Хранителі Часу вперше поглянули на запорошені землі своїх нових сусідів, Небесних Ріверів, обидві групи відчули, що скоро буде ще більше насильства. Натомість вони зустрілися з миром, їхні лідери цікавилися мотивами й можливостями одне одного. Майже цілий день вони розмовляли в тій старій сталевій печері, і кожен з них виявив, що інший не такий, як вони очікували. Кронос був більш тихомовним і спокійним, з розумом, що краще підходив для технологій і хитромудрих думок, ніж жителі Сховища могли б повірити день тому. Своєю чергою, Рівери були здивовані, виявивши, що Ток — маніакальна й сувора людина, готова на все заради своїх цілей, а не якась м'яка й квола теплична квітка зі Сховища. Вони говорили про межі територій, обмін технологіями та доступ до стародавніх довоєнних об'єктів, що лежали під пісками Зони 51. На час заходу сонця обидва лідери були задоволені, і Ток уже склав плани супроводжувати Ріверів до їхньої бази для тижня подальших зустрічей та обміну інформацією. У перервах між розмовами з Кроносом Ток проводив час, порпаючись у старих записах та архівах, які Рівери спакували в запорошених кутках і комірчинах. В одній старій коробці були голоплівки, які Наглядач Сховища 60 уважно слухав на своєму Піп-Бої; записи передач зі станції, яка колись висіла у безмежному космосі перед тим, як впасти на землю. Мертві голоси на плівці розповідали про експерименти з маніпуляціями світлом, про дослідження природи простору та четвертого виміру. Коли остання плівка випала йому в руку, Ток знав, що має бути далі."
  clk_vault.4.a:0 "Робимо світ безпечнішим, крок за кроком."

  clk_vault.5.t:0 "Час прокидатися"
  clk_vault.5.d:0 "Розчарування почало панувати у Сховищі 60. Незважаючи на їхню старанність, найкращі уми Хранителів Часу наштовхнулися на теоретичну стіну, не в змозі просунутися далі у своїх дослідженнях та експериментах. Вони були впевнені, що подорожі в часі, остання надія цього мертвого світу, що гине, знаходяться лише за крок від них, і це «так близько, але так далеко» доводило вчених майже до маніакального відчаю. Саме Наглядач Ток нагадав їм про те, як далеко вони зайшли, і відновив їхню рішучість, увімкнувши для них плівки та журнали допитів, отримані з аванпосту Сплячих у B.O.M.B.-002, і сказавши їм почекати, поки він здобуде саме те, що їм потрібно. Лише через пару місяців Наглядач Ток стояв на чолі невеликої армії, найкращої, яку могли зібрати Хранителі Часу та їхні нові «клієнтські» племена. Вони розбили табір на завойованих землях Ігл-Року, колись галасливого центру торгівлі та вітрильних дирижаблів, який тепер перетворився на плацдарм. Це було дивне місце для зосередження такої сили: інтегровані дикуни, уніформи служби безпеки «Волт-Тек» і поспіхом переобладнана довоєнна військова техніка — усе це зібралося для наступного і, сподіваємось, останнього великого ривка. Це місце мало стати ареною найбільшого тріумфу Наглядача Тока — здобуття останньої частини чотиривимірної головоломки. Бо за річкою Колорадо лежала таємниця — прихована база Сплячих та надія Хранителів Часу."
  clk_vault.5.a:0 "Наше майбутнє, просто в межах досяжності."

  clk_vault.6.t:0 "Хіба ми цього ще не робили?"
  clk_vault.6.d:0 "Перше випробування пройшло успішно! Ми успішно використали 4-вимірний транспортер для виконання завдання із запобігання створенню парадоксу. Тепер, коли ми забезпечили наше подальше існування в цій часовій лінії, ми можемо розпочати роботу над постпоточними засобами пересування. Ця наука є новою для нас і для всього світу — ми повинні використовувати її з розумом. Навіть найменший незбагненний промах може призвести до катастрофічних наслідків. Ми зробили все можливе, щоб зберегти пустку в безпеці. Тепер ми маємо переконатися, що минуле та сьогодення залишаються недоторканими, а згодом — і майбутнє."
  clk_vault.6.a:0 "Це стає трохи заплутаним."

  clk_vault.7.t:0 "Володар: Ток"
  clk_vault.7.d:0 "В РОЗРОБЦІ"
  clk_vault.7.a:0 "Я завжди вірив."

  clk_vault.8.t:0 "Майбутнє"
  clk_vault.8.d:0 "Спочатку ми відправили крізь нього каміння, потім радтаргана, потім людей. Усе здавалося ідеальним, кожен доказ і кожне рівняння текли, мов секунди. Коли машину було протестовано, вирушила перша експедиція. Потім, через годину після призначеного часу повернення, вони з'явилися знову, охоплені полум'ям. Після того як вони померли від ран, дані їхнього журналу досліджень були відновлені, і в них зазначалося те, що вони побачили.\n\nСтан світу був справжнім пеклом на землі. Потріскані та покручені каркаси дерев усіяли землю. Ґрунт був схожий на пісок і пахнув іржею. Усе інше пахло димом; кожен член експедиції повідомляв, наскільки важко було дихати, ніби на їхні груди навалили каміння. Над землею крізь повітря виривалися розриви полум'я та пилу. Порожні хмарочоси стояли вибухнуті, палаючи. Нічого не було знайомим. Коли вони зайшли далі, спека стала нестерпною, що змусило їх прийняти рішення повернутися. Йдучи назад, вони побачили в небі обсидіаново-чорний літак, що летів над горизонтом, і на цьому звіт обривається."
  clk_vault.8.a:0 "Коли все пішло не так?"
  clk_vault.8.b:0 "Це почалося з Небесних Ріверів."

  clk_vault.9.t:0 "Перемога"
  clk_vault.9.d:0 "Нарешті володіння Сплячих перебувають під нашим прямим контролем. Завдяки нашим друзям у небі, Сплячі тепер занурилися у вічний сон. Сотня сміттярів зібралася, щоб обчистити кожен відсік і шпарину на об'єкті. Переповнені візки гуркотіли туди-сюди з потаємних місць у Рок-Спрінгс годинами. Кронос і двоє інших Небесних Ріверів приземлилися на територію, попрощалися і потисли руку Току. Зрештою ми знайшли те, що шукали: Обчислювальний Масив. Його негайно доставили до сховища і встановили в щойно закінчену машину. Масив засвітився, а термінал збоку розпочав свої обчислення. Після того, як клацання та дзижчання припинилися, з'явилося повідомлення із запитом на дію. Після отримання схвалення машина заскрипіла та заревла, заливаючи кімнату синім світлом. Вона була готова."
  clk_vault.9.a:0 "Я почуваюся дивно."
  clk_vault.9.b:0 "Це буде не остання наша зустріч."

  clk_vault.10.t:0 "Я думав, жадібність — це гріх"
  clk_vault.10.d:0 "Незважаючи на наші справедливі та обґрунтовані претензії на землі, що належать Тар-Вокерам, схоже, що Новий Ханаан бажає розділити частку лише для себе. Нашого посланця було відхилено, тому стало зрозуміло, що співпраця не входить до їхніх інтересів. Небесні Рівери стають нетерплячими, оскільки наша операція повністю зупинилася. Ток уже провів зустріч із Кроносом, запевнивши, що земля незабаром буде повернута нам. Це земля, за яку ми по праву боролися; дозволити їй потрапити до рук злодіїв означало б поставити під загрозу моральний дух армії. Ми не хочемо змушувати наших людей чекати, і ще занадто рано здаватися."
  clk_vault.10.a:0 "Дії мають наслідки."

  clk_vault.11.t:0 "Глухий кут"
  clk_vault.11.d:0 "Насаджена на спис голова втомленого воїна доріг була піднята над його колись шанованим гаражем, тепер спустошеним, де залишилися лише незначні деталі. Його мертвий погляд спостерігав, як його могутня імперія стала ще однією деталлю, доданою до постійно зростаючого годинникового режиму. Колись Вісімдесяті називали Каліфорнію домом, але їх витіснила республіка, і знову їхній спосіб життя має бути зруйнований новою зростаючою силою. Вереск гуми злився зі звуком куль, а потім настала тиша. Можливо, спосіб життя Вісімдесятих завжди був приречений на загибель, судилося стати ще однією частиною історії, загубленою в часі."
  clk_vault.11.a:0 "Краще, ніж пішки!"

  clk_vault.12.t:0 "Залишки бомбової станції 002"
  clk_vault.12.d:0 "Дані з автоматизованих систем моніторингу Зони 51, що працювали після кінця світу, вказали на загальну зону розбитої станції — B.O.M.B.-002. Десятиліття тому вона зійшла зі своєї орбіти з невідомих причин і мала велику вдачу впасти глибоко в ущелині світу — Великому Каньйоні. Вона обіцяла багатство технологій і припасів для великого проєкту Сховища 60 з порятунку людства: високотехнологічні комп'ютери, екзотичні сплави, рідкісні датчики, точну електроніку та купи розщеплюваного матеріалу.\n\nОтримавши повідомлення від наших розвідників про її форму, що випирала зі скелястої землі, Наглядач Ток (всупереч рекомендаціям Хранителів Часу Освальда та Рассела) очолив першу вилазку. Можливо, нам не слід було так дивуватися, що міцна споруда була заселена.\n\nОдягнені в химерні костюми, невеликі сили всередині спочатку намагалися не пустити загарбників на свою територію за допомогою гучномовців і плазмового вогню. Але коли ми повернулися з більшими силами, доглядачі B.O.M.B.-002 побачили, що вони не просто відбиваються від дикунів, а насправді поступаються чисельністю значній бойовій силі, що має намір відібрати в них станцію. Під час переговорів про здачу вони розповіли нам, що належать до людей, яких називають Сплячими. Хоча ця назва нічого нам не каже, і ми точно ніколи не чули про якогось Віктора Преспера, вони явно є досить витонченою групою, а ті, хто населяє станцію — лише невелика експедиція більшої спільноти. Усе, що вони могли легко зібрати й вивезти, вже було відправлено назад. Вони наглядали за тим, що залишилося, вивчаючи журнали й відганяючи дрібних сміттярів.\n\nПісля багатьох днів допитів і розслідувань щодо їхніх записів і припасів ми нарешті знайшли місце, куди пішло все, що вони забрали: Рок-Спрінгс."
  clk_vault.12.a:0 "Час не на їхньому боці."

  clk_vault.15.t:0 "Приєднатися до фракції Хранителів Часу?"
  clk_vault.15.d:0 "Раптова поразка племені Білоногих привела до нашого кордону зовсім іншого сусіда. Такого, що пропонує технологічне обладнання та сировину в обмін на те, що дозволить нам розправити крила у знищенні далеких ворогів."
  clk_vault.15.a:0 "Заводьте двигуни!"
  clk_vault.15.b:0 "Ми літаємо тільки для себе!"

  ##Time Scavenging Events
  time_scavenging_success_tt:0 "§OЩо вони принесли додому?§!"
  timey_wimey_scavenging_category:0 "Повернення втраченого часу"
  timey_wimey_scavenging_category_desc:0 "Крадіть з минулого, щоб захистити майбутнє.\n\nПісля наших початкових екскурсій ми успішно склали список локацій у просторі-часі з окремими ресурсами та мінімальним ризиком для відвідування. Зрештою, будь-які суттєві зміни в історії можуть стати катастрофічними, оскільки парадокси цілком можуть розірвати часову лінію. Ми можемо підтримувати зв'язок лише кілька годин, протягом яких можемо схопити кілька дрібниць на благо Майбутнього. Набір стандартів і вказівок має забезпечити максимальну віддачу за мінімального ризику зміни часової лінії."
  time_scavenge_prehistoric:0 "До Першого міста"
  time_scavenge_prehistoric_desc:0 "Грунтуючись на перешіптуваннях деяких божевільних, краще не повертатися занадто далеко, до часів Шумеру, Єгипту, Ассирії чи подібних епох. Деякі питання мають занадто чужі відповіді."
  time_scavenge_medieval:0 "Темні віки"
  time_scavenge_medieval_desc:0 "Існує багато паралелей між часами після падіння Риму та нашим часом. Тут є уроки, які варто засвоїти, якщо триматися подалі від датчан та гунів."
  time_scavenge_colonial:0 "Епоха революцій"
  time_scavenge_colonial_desc:0 "Нарешті ми підійшли до народження Сполучених Штатів Америки та потенційної небезпеки від вогнепальної зброї. Протоколи для часових сміттярів доведеться змінити."
  time_scavenge_world_war:0 "Операція «Оверлорд»"
  time_scavenge_world_war_desc:0 "Вони збираються вирушити у Великий Хрестовий похід, і тут так багато подібностей зі століттям потому, що це викликає занепокоєння. Тут можна багато чого здобути, перш ніж ми підемо ще трохи далі."
  time_scavenge_pre_war:0 "Дні до падіння бомб"
  time_scavenge_pre_war_desc:0 "Нарешті, це можливо. Найвища точка панування перед тим, як усе пішло шкереберть."
  time_scavenging_rescue_crisis:0 "Часова криза"
  time_scavenging_rescue_crisis_desc:0 "Щось трапилося з нашими часовими сміттярами! Чи варто відправити загін для їхнього порятунку?"
  time_scavenging_send_rescue_team:0 "Відправити часовий рятувальний загін"
  time_scavenging_send_rescue_team_desc:0 "Можливо, наших часових сміттярів ще можна врятувати. Ми не кинемо своїх."
  time_scavenging_underway:0 "Команди часових сміттярів у дії"
  time_rescue_team_send:0 "Відправити Патруль Часу"
  time_scavengers_lost:0 "Часові сміттярі загубилися в часі"

  time_scavenge.1.t:0 "Найраніша історія людства"
  time_scavenge.1.d:0 "Подорож у доісторичні часи — це або найнебезпечніший з наших варіантів, або найбезпечніший. Хоча тут менше людських загроз чи записів, які можна спотворити, будь-які зміни мають набагато більше часу для відлуння. На щастя, цього разу наша команда повернулася з чимось цінним!"
  time_scavenge.1.a:0 "Захоплююче. До кімнати для нарад!"

  time_scavenge.2.t:0 "Нічого вчитися у мисливців-збирачів"
  time_scavenge.2.d:0 "Хоча світ до появи доріг і людської промисловості пропонує багато краси для спостереження, команда не змогла знайти нічого особливого."
  time_scavenge.2.a:0 "Не знайшовши нічого цінного, вони повертаються додому лише з ескізами того, що було."

  time_scavenge.3.t:0 "Напад шаблезубих тигрів"
  time_scavenge.3.d:0 "Цього разу команда, очевидно, вирушила туди, де людина ще не була найвищим хижаком. Лютих звірів минулого застали їх зненацька і розірвали десятки з них на шматки."
  time_scavenge.3.a:0 "Це був жахливий день для Хранителів Часу."

  time_scavenge.4.t:0 "Зникли в тумані часу"
  time_scavenge.4.d:0 "Команда часових сміттярів не вийшла на регулярний зв'язок. Чи натрапили вони на якусь несподівану небезпеку? Чи ми відправили їх у правильне місце? Чи вони порушили протокол?"
  time_scavenge.4.a:0 "Чи наважимося ми ризикувати подальшими взаємодіями?"

  time_scavenge.5.t:0 "Часових сміттярів врятовано"
  time_scavenge.5.d:0 "Наші вітання рятувальній команді! Наших загублених сміттярів знайдено здебільшого цілими та неушкодженими. Тіла загиблих також було повернуто або випарувано, щоб врятувати минуле від їхньої ДНК, хвороб та матеріалів одягу.\n\nХоча, можливо, обидві команди хтось і бачив, сподіваємось, це сприймуть як небилиці, або ж як гостей з іншого світу. Ангели, демони, прибульці... такі історії не були рідкістю в історії, і вони мають замаскувати наше втручання."
  time_scavenge.5.a:0 "Чудовий день для нас (і для історії світу)!"

  time_scavenge.6.t:0 "Часові сміттярі загубилися в часі"
  time_scavenge.6.d:0 "На жаль, нам не вдалося повернути команду часових сміттярів, яку ми відправили перед тим, як втратили часову прив'язку. Хоча відправка нових людей несла б нові ризики, ми не можемо не хвилюватися, що тіла і спорядження втраченої команди можуть змінити тканину історії, якщо потраплять не в ті руки...\n\nЗвісно, якби історія змінилася, чи взагалі б ми це помітили?"
  time_scavenge.6.a:0 "Сподіваємось, вони не забруднять часову лінію."

  time_scavenge.7.t:0 "Не такі вже й темні, як вважалося"
  time_scavenge.7.d:0 "Команда часових сміттярів повертається з перемогою, обіцяючи нам значну знахідку."
  time_scavenge.7.a:0 "Захоплююче. До кімнати для нарад!"

  time_scavenge.8.t:0 "Лицарі, шахраї і більше нічого"
  time_scavenge.8.d:0 "Хоча ми впевнені, що знайшлися б історики, які б із задоволенням подивилися на построманський світ, наші команди мають залишатися зосередженими на тому, що може допомогти нам тут і зараз. Цього разу вони повернулися з порожніми руками."
  time_scavenge.8.a:0 "Не знайшовши нічого цінного, вони повертаються додому лише з ескізами того, що було."

  time_scavenge.9.t:0 "Схоплені забобонними місцевими"
  time_scavenge.9.d:0 "Команду, одягнену в досить помітні стерилізовані комбінезони, виявили місцеві. Місцева релігійна влада міста захопила багатьох із них у полон. На жаль, доки відсталі дісталися додому, машині довелося перейти в режим охолодження. Нам залишається лише сподіватися, що їхній кінець буде швидким."
  time_scavenge.9.a:0 "Це був жахливий день для Хранителів Часу."

  time_scavenge.10.t:0 "Загублені у світі темряви"
  time_scavenge.10.d:0 "Команда часових сміттярів не вийшла на регулярний зв'язок. Чи натрапили вони на якусь несподівану небезпеку? Чи ми відправили їх у правильне місце? Чи вони порушили протокол?"
  time_scavenge.10.a:0 "Чи наважимося ми ризикувати подальшими взаємодіями?"

  time_scavenge.11.t:0 "З часів народження націй"
  time_scavenge.11.d:0 "Часи змін сформували багато елементів довоєнного світу, не в останню чергу заснування Сполучених Штатів, які побудували наше Сховище. Команда часових сміттярів повідомила по радіо про нову знахідку."
  time_scavenge.11.a:0 "Захоплююче. До кімнати для нарад!"

  time_scavenge.12.t:0 "Гарантований провал"
  time_scavenge.12.d:0 "Суспільства достатньо обережні, щоб помітити наших розвідників, і їхні обмежені технології не варті ризику викриття. Остання спроба виявилася провальною."
  time_scavenge.12.a:0 "Не знайшовши нічого цінного, вони повертаються додому лише з ескізами того, що було."

  time_scavenge.13.t:0 "Сприйняли за лоялістів"
  time_scavenge.13.d:0 "Через наші дивні акценти та скритність, революційні натовпи, щойно нас виявивши, не гаяли часу і стратили нашу команду як шпигунів. Кілька вцілілих зараз повертаються для доповіді про те, що пішло не так."
  time_scavenge.13.a:0 "Це був жахливий день для Хранителів Часу. Заберіть тіла та спорядження."

  time_scavenge.14.t:0 "Затягнуті в епоху революцій"
  time_scavenge.14.d:0 "Команда часових сміттярів не вийшла на регулярний зв'язок. Чи натрапили вони на якусь несподівану небезпеку? Чи ми відправили їх у правильне місце? Чи вони порушили протокол?"
  time_scavenge.14.a:0 "Чи наважимося ми ризикувати подальшими взаємодіями?"

  time_scavenge.15.t:0 "Багатство Світової війни"
  time_scavenge.15.d:0 "Друга світова війна була справді масштабним конфліктом із безліччю можливостей для наших команд. Ба більше, багато зразків обладнання, розроблених під час неї, перевершують зброю суспільств пустки, що повільно відновлюються. Команда зараз повертається додому з купою свіжого "металобрухту"."
  time_scavenge.15.a:0 "Захоплююче. До кімнати для нарад!"

  time_scavenge.16.t:0 "Немає можливості уникнути передової"
  time_scavenge.16.d:0 "Ситуація на місці невблаганна. Опинившись занадто близько до місця великої битви, наші часові сміттярі не мали іншого вибору, окрім як відступити заради власної безпеки. Сьогоднішні ризики просто не варті того."
  time_scavenge.16.a:0 "Не знайшовши нічого цінного, вони повертаються додому лише з ескізами того, що було."

  time_scavenge.17.t:0 "Потрапили в засідку"
  time_scavenge.17.d:0 "Опинившись між двома сторонами війни, часові сміттярі, відправлені у Другу світову війну, потрапили під обстріл у Сталінграді! Ті, хто міг, евакуювалися, а ті, хто не зміг прорватися, вже втрачені для нас. Ми будемо оплакувати їх, але оскільки вони взяли лише зброю, що відповідає тій епосі, принаймні вони не призведуть до якоїсь альтернативної історії, де вісь має лазерні гвинтівки."
  time_scavenge.17.a:0 "Це був жахливий день для Хранителів Часу."

  time_scavenge.18.t:0 "Не в тому місці, не в той час"
  time_scavenge.18.d:0 "Команда часових сміттярів не вийшла на регулярний зв'язок. Чи натрапили вони на якусь несподівану небезпеку? Чи ми відправили їх у правильне місце? Чи вони порушили протокол?"
  time_scavenge.18.a:0 "Чи наважимося ми ризикувати подальшими взаємодіями?"

  time_scavenge.19.t:0 "Найновіше та найкраще"
  time_scavenge.19.d:0 "Тижні перед Великою війною пропонують справжню скарбницю ресурсів з мінімальним ризиком парадоксів. Зрештою, коли впадуть бомби, місця для змін не залишиться."
  time_scavenge.19.a:0 "Захоплююче. До кімнати для нарад!"

  time_scavenge.20.t:0 "Засліплені тим, що було"
  time_scavenge.20.d:0 "Наша команда часових сміттярів повідомляє, що вони були приголомшені видами нашої землі до того, як атомний вогонь вкрав у людства все. Після повернення додому їм доведеться пройти психологічну оцінку."
  time_scavenge.20.a:0 "Не знайшовши нічого цінного, вони повертаються додому лише з ескізами того, що було."

  time_scavenge.21.t:0 "Сприйняли за комуністичних шпигунів"
  time_scavenge.21.d:0 "Команду відправили всього за кілька днів до падіння бомб, щоб мінімізувати ймовірність наслідків. Схоже, вони діяли занадто відкрито, і їх прийняли за "комуністів". Ми не зможемо витягнути їх звідти, куди їх забрали, але принаймні їм не доведеться довго триматися."
  time_scavenge.21.a:0 "Це був жахливий день для Хранителів Часу."

  time_scavenge.22.t:0 "Втрачено зв'язок біля військової бази"
  time_scavenge.22.d:0 "Команда часових сміттярів не вийшла на регулярний зв'язок. Чи натрапили вони на якусь несподівану небезпеку? Чи ми відправили їх у правильне місце? Чи вони порушили протокол?"
  time_scavenge.22.a:0 "Чи наважимося ми ризикувати подальшими взаємодіями?"

  time_scavenge.101.t:0 "Зброя кам'яного віку"
  time_scavenge.101.d:0 "Команда вирішила привезти кілька пізніших зразків зброї, виготовленої з каменю. Хоча з археологічної точки зору це чудові знахідки, ми не впевнені, що з ними робити."
  time_scavenge.101.a:0 "Ну... вони все ще можуть нашкодити людям!"

  time_scavenge.102.t:0 "Вимерлі рослинні ліки"
  time_scavenge.102.d:0 "Команда привезла чималу колекцію рослин, які не дожили до 2200-х років. Їх вивчення показало, що деякі з них мають сильні лікувальні властивості, які ми могли б використовувати."
  time_scavenge.102.a:0 "Смак залишає бажати кращого."

  time_scavenge.103.t:0 "Сила людини"
  time_scavenge.103.d:0 "Стародавні племена людства, що існували до появи міст і сільського господарства, мали суворе життя. У цьому, безумовно, є щось, що перегукується з нашим власним існуванням у цій випаленій пустці."
  time_scavenge.103.a:0 "Наші предки варті того, щоб їх наслідувати."

  time_scavenge.104.t:0 "Дикі звичаї"
  time_scavenge.104.d:0 "Стародавні племена людства, що існували до появи міст і сільського господарства, мали суворе життя. У цьому, безумовно, є щось, що перегукується з нашим власним існуванням у цій випаленій пустці."
  time_scavenge.104.a:0 "Наші предки варті того, щоб їх наслідувати."

  time_scavenge.105.t:0 "Основа всього навчання"
  time_scavenge.105.d:0 "Випадково наша команда натрапила на молоде поселення. Спостерігаючи за ним здалеку, вони докладно описали, як старійшини передавали свій досвід молодшим членам племені. Саме так розвивалося людство — кожне покоління стояло на плечах попереднього."
  time_scavenge.105.a:0 "Дякуємо першим вчителям."

  time_scavenge.71.t:0 "Якісна сталь"
  time_scavenge.71.d:0 "Прочісуючи далеке поле битви середньовічного конфлікту, наша команда повертається додому з низкою історично достовірних мечів та сокир. Поки команда проходить дезінфекцію в обов'язковий період карантину, вони, здається, із задоволенням розмахують ними під час тренувальних ударів."
  time_scavenge.71.a:0 "Трохи не вистачає дальності, чи не так?"

  time_scavenge.72.t:0 "Лицарі давнини"
  time_scavenge.72.d:0 "Прочісуючи далеке поле битви середньовічного конфлікту, наша команда повертається додому з різноманітними частинами обладунків, знятими з мертвих. Як тільки їх трохи почистять і відреставрують, вони чудово виглядатимуть на виставкових стендах.... або, можливо, на командах служби безпеки?"
  time_scavenge.72.a:0 "Витривалі, хоч і рідко куленепробивні."

  time_scavenge.73.t:0 "Стародавні поля битв"
  time_scavenge.73.d:0 "Команда сміттярів використала своє коротке вікно, щоб записати відео битви при Гастінгсі. Це дало нам певне розуміння тактик, загублених у тумані часу. Крім того, за цим досить цікаво спостерігати."
  time_scavenge.73.a:0 "Що сталося з Гарольдом!?"

  time_scavenge.74.t:0 "На захист своїх домівок"
  time_scavenge.74.d:0 "Пройшовши через кілька пов'язаних точок заворушень, сміттярі принесли свої знахідки. Подібно до сучасних племен, люди занадто часто були змушені захищати себе від руйнівних наслідків конфліктів."
  time_scavenge.74.a:0 "Ми теж просто хочемо захистити наш дім, світ."

  time_scavenge.75.t:0 "Королі та замки"
  time_scavenge.75.d:0 "Схоже, часові сміттярі трохи перестаралися. Вони принесли додому чимало кричущих скарбів, викрадених із замку якогось лорда за допомогою стелс-боя. Дивно, що вони змогли перенести стільки золота назад у часі додому. Вони навіть подарували Наглядачу Току корону та скіпетр!"
  time_scavenge.75.a:0 "Це те, що вони називають 'Божественним правом'?"

  time_scavenge.111.t:0 "Вогонь і штурм"
  time_scavenge.111.d:0 "Яку ж дивну колекцію привезли наші сміттярі. Хоча через відсутність нарізів вони, м'яко кажучи, дещо неточні, порох і боєприпаси для цих мушкетів неймовірно дешево поповнювати під час тривалих подорожей. А якщо це не спрацює, ви здивуєтеся, як часто допомагає штикова атака."
  time_scavenge.111.a:0 "Нехай кожен постріл буде влучним."

  time_scavenge.112.t:0 "Компаньйони колоній"
  time_scavenge.112.d:0 "Хоча спочатку вони намагалися здобути більше історично цінних артефактів, цього тижня команда сміттярів зрозуміла, що це чудова можливість виправити частину шкоди, завданої геному іклів. Із завезеними довоєнними собаками наша громада матиме здоровіших цуценят, ніж будь-коли."
  time_scavenge.112.a:0 "Хто хороший хлопчик?"

  time_scavenge.113.t:0 "Епоха вітрил"
  time_scavenge.113.d:0 "Важко уявити, що колись людство перетинало могутні води світових океанів. Не дивно, що кілька вражених морем душ привезли докладні ескізи вітрильних суден. Хоча їхнє будівництво не має прямого відношення до доступного нам рівня суднобудування, ці концепції, безумовно, надихають розум."
  time_scavenge.113.a:0 "Що нам робити з п'яним сміттярем?"

  time_scavenge.114.t:0 "Наполегливість праотців"
  time_scavenge.114.d:0 "Війни в ранній американській історії надихають декого. Віддані команди з управління часом привезли нам більше реліквій та історій, ніж ми могли очікувати. Усе зроблено настільки обережно, наскільки це можливо, з огляду на баланс ходу історії.\nХоча тут мало цінних технологій і таємниць, це, безумовно, підняло моральний дух. Крім того, з цих боїв можна винести кілька хороших уроків."
  time_scavenge.114.a:0 "Чи ми вже перетнули наш Делавер?"

  time_scavenge.115.t:0 "Народження республіки"
  time_scavenge.115.d:0 "Стати свідком революції з перших вуст — це не дрібниця, і тепер ми мали можливість спостерігати цілих дві. Хоча їм доводилося триматися подалі від вулиць і ховатися в тіні, надія в повітрі Парижа була просто заразливою. Їхні записи та звіти дають захоплюючі свідчення боротьби з військами короля та принесення свободи народу. Команда сміттярів, що повернулася, витратила більшу частину запланованого звіту, розповідаючи нам про боротьбу за свободу, рівність і братерство."
  time_scavenge.115.a:0 "Vive La République!"

  time_scavenge.151.t:0 "Прихильність стрільця"
  time_scavenge.151.d:0 "Команда повернулася всього кілька хвилин тому з колекцією гвинтівок, нових і ще не обстріляних. Вони, очевидно, забрали їх прямо зі складу незадовго до початку бойових дій у тому районі."
  time_scavenge.151.a:0 "Справжні влучні стрільці."

  time_scavenge.152.t:0 "Вогнева міць, що зупиняє серце"
  time_scavenge.152.d:0 "Спритно прослизнувши повз кількох втомлених охоронців бази, сміттярі змогли дістатися до запасу кулеметів, які чекали своєї наступної битви. Тепер, лише через три з половиною сотні років, вони можуть знайти новий конфлікт."
  time_scavenge.152.a:0 "Ідеально для утримання траншей."

  time_scavenge.153.t:0 "Зміна доктрин"
  time_scavenge.153.d:0 "Мало докладних записів про Другу світову війну та супутні конфлікти потрапило до наших архівів. Нові записи та свідчення, які принесли наші часові сміттярі, досить корисні для розуміння того, як велися війни в цей період історії."
  time_scavenge.153.a:0 "Основи представлені в повному обсязі."

  time_scavenge.154.t:0 "Бліцкриг лютує"
  time_scavenge.154.d:0 "Швидкість, несподіванка, вогнева міць. З постійною комбінацією цих речей мало хто з жителів пустки зміг би втримати нас від наших цілей."
  time_scavenge.154.a:0 "Чи могли б ми застосувати цю тактику?"

  time_scavenge.155.t:0 "Контратака союзників"
  time_scavenge.155.d:0 "Хоча ми не маємо сотень тисяч військ для розгортання, ми також не володіємо логістичними можливостями минулого. Наші технології, хоч і перевершують, не можуть компенсувати нестачу інституційних знань і робочої сили. Наші сміттярі старанно працюють над документуванням військових зусиль."
  time_scavenge.155.a:0 "На щастя, ми знаємо, чим закінчиться ця війна."

  time_scavenge.191.t:0 "Найкраще американське"
  time_scavenge.191.d:0 "Нарешті зброя, що відповідає стандартам! Здобути робочу плазмову зброю було нелегко, але ми зможемо використати її краще, ніж ті, хто приречений на загибель."
  time_scavenge.191.a:0 "Ось це вогнева міць!"

  time_scavenge.192.t:0 "Китайські бронебої"
  time_scavenge.192.d:0 "Розміщені на передовій для протидії американській силовій броні, ці гвинтівки Гауса все ще цінні і в наш час. Немає браку в тих, хто намагається використати залишки костюмів для власних цілей."
  time_scavenge.192.a:0 "Іноземна зброя вбиває так само добре, як і місцева."

  time_scavenge.193.t:0 "Передовий край технологій"
  time_scavenge.193.d:0 "Хоча було важко уникати патрулів і камер країни, що перебуває в стані постійної бойової готовності, нашим сміттярам вдалося отримати високотехнологічні креслення. Коли ми розшифруємо їх, ми впевнені, що вони наблизять нас на крок до порятунку світу."
  time_scavenge.193.a:0 "Надзвичайно важливо, що ми повернули ці знахідки."

  time_scavenge.194.t:0 "Останні розроблені тактики"
  time_scavenge.194.d:0 "Хоча було важко уникати патрулів і камер країни, що перебуває в стані постійної бойової готовності, наші сміттярі змогли отримати військові навчальні посібники та засекречені плани битв. З цими знаннями ми на крок ближче до порятунку світу."
  time_scavenge.194.a:0 "То ось як вони воювали!"

  time_scavenge.195.t:0 "Вони вкрали ЩО?!"
  time_scavenge.195.d:0 "Ми здивовані, що повнорозмірний гвинтокрил узагалі проліз в апертуру машини. Коли команду запитали, як вони змогли повернути таку цінну частину технологій, вони були досить схильні до перебільшень. Зрештою, неважливо, наскільки авторитетно ви поводитеся, вони б не дозволили вам просто взяти його "покататися"."
  time_scavenge.195.a:0 "Вивчіть усе, що зможемо!"

