l_english:
  # starting foci
shared_vault_1:0 "[shared_vault_1_focus_name_loc]"
shared_vault_1_name_key:0 ""Підготовлені до майбутнього!""
shared_vault_1_desc:0 "[shared_vault_1_focus_desc_loc]"
shared_vault_1_desc_key:0 "Бомби мали впасти — рано чи пізно. І ніхто не був до цього готовіший, ніж Vault-Tec! Наш Сховок був одним із багатьох, що стояли на варті, аби перечекати бурю та зберегти наших предків, поки світ не буде готовий до відновлення. Та не всі сховища створено рівними, і завжди виникає пекуче питання: яким було твоє сховище?"

shared_vault_2:0 "[shared_vault_2_focus_name_loc]"
shared_vault_2_name_key:0 ""Забронюйте місце вже сьогодні!""
shared_vault_2_desc:0 "[shared_vault_2_focus_desc_loc]"
shared_vault_2_desc_key:0 "Кожне Сховище колись повинно прийняти важке рішення. Лічильник Гейгера все ще клацає, але, можливо, двері доведеться відчинити! Vault-Tec була готова до всього, та навіть після 200 років під землею людей і ресурсів може виявитися вкрай мало."

shared_vault_3:0 "[shared_vault_3_focus_name_loc]"
shared_vault_3_name_key:0 ""Який у тебе план?""
shared_vault_3_desc:0 "[shared_vault_3_focus_desc_loc]"
shared_vault_3_desc_key:0 "Навіть якщо ми не хочемо виходити у Пустку — Пустка може захотіти нас! Так само, як Vault-Tec готувалася до майбутнього, ми повинні зробити те саме. Чи ми сховаємось від неї, чи подружимося з нею, а може й підкоримо — настав час того світлого майбутнього, яке обіцяла Vault-Tec!"

  #left branch foci

shared_vault_maintenance:0 "Команди технічного обслуговування Сховища"
shared_vault_maintenance_desc:0 "Хоча Сховища автоматизовані й побудовані за високими стандартами, без команди технічного обслуговування Vault-Tec тут залишилися б лише іржаві коридори!\n\nЧас заохотити молодих мешканців узяти паяльники й приєднатися до команди, щоб підтримувати Сховище на шляху до досконалості."

shared_vault_industry_bonus:0 "Конвеєрні стрічки"
shared_vault_industry_bonus_desc:0 "Стабільне виробництво — запорука щасливого життя мешканців і прибутковості нашого Сховища. Якщо ми хочемо стати промисловими титанами пустки, доведеться виділити більше простору під високотехнологічні автоматизовані майстерні."

shared_vault_resource_collection:0 "Щаслива праця — важка праця"
shared_vault_resource_collection_desc:0 "Великі уми з відділу людських відносин Vault-Tec розробили нову кампанію, щоб підняти дух працівників!\n\nМи створимо штучну атмосферу конкуренції між родинами Сховища, нагороджуючи найкращого працівника місяця додатковим днем оплати!"

shared_vault_maintenance_infrastructure:0 "Розширення Сховища"
shared_vault_maintenance_infrastructure_desc:0 "Наші житлові приміщення швидко заповнюються й незабаром не зможуть прийняти нові покоління. Було б розумно почати рити додаткові площі, щоб уникнути кризи."

shared_vault_maintenance_repairs:0 "П’ятирічна перевірка"
shared_vault_maintenance_repairs_desc:0 "Дехто каже, що перевіряти варто частіше, але офіційний посібник з обслуговування Vault-Tec каже раз на 5 років, тож..."

shared_vault_generator:0 "Джерела енергії"
shared_vault_generator_desc:0 "[Root.GetName] не виживе вічно на старому довоєнному генераторі. Чому б не оновити його або не знайти нове джерело енергії?"

shared_vault_reading_about_boats:0 "Натхнення з літератури"
shared_vault_reading_about_boats_desc:0 ""Відмовитися від нестерпного ярма землі, що її люди вважають свободою, можливо, не така вже велика жертва, як ти собі уявляєш." — Капітан Немо, «20 000 льє під водою»"

shared_vault_building_dockyards:0 "Початок кораблебудування"
shared_vault_building_dockyards_desc:0 "Уся теоретична база зі спорудження кораблів тепер знайде практичне застосування в наших новозбудованих верфях. Уяви собі — вийти в море, як великі дослідники минулого!"

shared_vault_ocean_vaults:0 "Сховища морів"
shared_vault_ocean_vaults_desc:0 "Перші кроки у водах пустки навчили нас: більше — краще. Адже, як і наші підземні Сховища, вони мають надійно захищати від загроз природи й людей. І, до того ж, менше хитатимуться..."

shared_vault_bikes:0 "Довші за коридори"
shared_vault_bikes_desc:0 "Сховища мають зручні розміри. А от на поверхні — доводиться чимало ходити. Прості колеса допоможуть швидше діставатися нових поселень. І залічуються до фізкультури!"

shared_vault_cars:0 "Більше подорожей, менше часу"
shared_vault_cars_desc:0 "Фізичний стан — це добре, але кілька відновлених машин заощадять нам дорогоцінний час."

shared_vault_water_chip:0 "Наші водні чіпи"
shared_vault_water_chip_desc:0 "Ми чули легенди про Сховища, де героїчно виходили в Пустку в пошуках водного чіпа. Нам пощастило: у нас достатньо чіпів.\n\nНаші науковці пропонують будувати ще більше водоочисних станцій для ефективного використання запасів. Генії в дії."

shared_vault_resource_capstone:0 "Промислові титани"
shared_vault_resource_capstone_desc:0 "Vault-Tec більше не закликає до ефективності — ми її перевершили! За короткий час ми випередили очікувані показники на 231,5%! Справжнє досягнення, яким може пишатися кожен мешканець Сховища."

# air side branch

shared_vault_civilian_factory:0 "Машини замість людей"
shared_vault_civilian_factory_desc:0 "Наші аналітики підрахували, що, замінивши частину виробництва на спеціалізованих Протектронів, ми майже подвоїмо ефективність. Навіщо нам працівники, які просять відпустки й не можуть працювати 24/7?"

shared_vault_military_protectrons:0 "Машини попереду людей"
shared_vault_military_protectrons_desc:0 "Протектрони насправді досить непогано захищають від вогню противника. І навіть у відповідь стріляють!"

shared_vault_air_bonus:0 "Авіація предків"
shared_vault_air_bonus_desc:0 "Наші американські предки вільно літали в небі. Тепер максимум, що ти побачиш — це мутований крук...\n\nПовернемо славні часи й навчимо молодь пілотувати сучасні літаки — це може знадобитися у майбутніх війнах."

shared_vault_air_tech_bonus:0 "Видатні аеронавти"
shared_vault_air_tech_bonus_desc:0 "Схоже, наша кампанія популяризації авіації серед молоді спрацювала. Проблема одна — у нас лише старі біплани й релікти XXI століття.\n\nЯкщо ми хочемо контролювати небо — доведеться оновити технічну базу, інакше нас зіб’ють із трубок."

shared_vault_air_base_bonus:0 "Замки в небі"
shared_vault_air_base_bonus_desc:0 "Тепер, коли наші повітряні сили стали серйозною загрозою, лишилась одна проблема — бази. Якщо ми не відведемо сили на розчищення ділянок і будівництво аеродромів, максимум, що ми зможемо запускати — це планери."

# security branch

shared_vault_security:0 "Охоронна команда Сховища"
shared_vault_security_desc:0 "Ми віримо, що всі мешканці Сховища — добропорядні громадяни, але мати страховку ніколи не завадить.\n\nНаша охорона стоїть на захисті порядку й закону, оберігаючи нас від внутрішніх та зовнішніх загроз. Вона — основа нашої безпеки."

shared_vault_security_organization:0 "Друкуємо більше уніформи"
shared_vault_security_organization_desc:0 "Окрім зручності та стилю, форма охорони Vault-Tec чітко відрізняє нас від беззаконних пустельників. Потрібно збільшити виробництво, щоб відповідати сучасним стандартам."

shared_vault_identification:0 "Призначити нові VIDs"
shared_vault_identification_desc:0 "Кожному мешканцю при народженні присвоюється ідентифікаційний номер. На щастя, 11 цифр — це чимало, тож ми зможемо легко реєструвати новачків. Треба лише, щоб вони оформили документи і прийшли з ними до офісу з 10 до 14."

shared_vault_security_gaming:0 "Трохи військових ігор"
shared_vault_security_gaming_desc:0 "Кажуть, ігри розвивають стратегічне мислення. Але, мабуть, це виправдання для лінощів. І навіть якщо це правда, хіба 200-річні голозаписи «Атомної Команди» ще мають сенс?"

shared_vault_air_land_teamwork:0 "У команді немає «Я»"
shared_vault_air_land_teamwork_desc:0 "А от багато роботи є. Сьогодні ми націлені на координацію охоронної команди та авіації."

shared_vault_security_equipment:0 "Озброїти людей"
shared_vault_security_equipment_desc:0 "Наша охорона справляється добре, але бракує вогневої сили для серйозних загроз.\n\nБуло б розумно тимчасово перевести цивільних на виробництво зброї для офіцерів."

shared_vault_security_boon:0 "Цирконієві штани"
shared_vault_security_boon_desc:0 "Тепер, коли охорона має зброю, час подбати про захист.\n\nНаші вчені розробили сполуку «цирконій», яка ідеально підходить для бронежилетів."

shared_vault_security_recruitment:0 "Захисники Сховища"
shared_vault_security_recruitment_desc:0 "Із технічними проблемами ми розібралися — тепер справа за пропагандою.\n\nМешканці поважають охорону, але мало хто хоче приєднатися. Потрібно показати їм усі переваги служби, й вони самі стануть у чергу."

shared_vault_arms_factory:0 "Вражаючі боєприпаси"
shared_vault_arms_factory_desc:0 "Наші фабрики виробляють хіба що дрібнички. Час перевести кілька на повноцінне виробництво зброї. Нехай наші вороги відчують силу наших куль."

shared_vault_doctrine_bonus:0 "Вишкіл мешканців"
shared_vault_doctrine_bonus_desc:0 "Якщо війна дістанеться порогу Сховища, кожен — чоловік, жінка й дитина — має бути готовим до бою.\n\nШеф охорони МакКей згоден тренувати всіх охочих військовій справі."

shared_vault_arms_factory_2:0 "Розширення виробництва зброї"
shared_vault_arms_factory_2_desc:0 "Зусилля щодо створення зброярських майстерень дали результат. Але ми можемо ще більше — розвідка виявила нові ділянки, ідеальні для розгортання арсеналів."

shared_vault_outward_movements:0 "Кільце вогню"
shared_vault_outward_movements_desc:0 "Наша охоронна команда тепер сильніша, ніж довоєнні спецпідрозділи. Завершальний етап — розпалити в них лють і змусити бачити в ворогах нелюдську загрозу. Жодного жалю — лише очищення."

# vault science branch

shared_vault_doctors:0 "Наукові команди Сховища"
shared_vault_doctors_desc:0 "Наукові команди Сховища — це основа нашого майбутнього у Пустці.\nНайкращі уми Vault-Tec були надіслані саме до нас, і вони не для того, щоб цілими днями досліджувати мишей.\nЩоб зберегти технологічну стабільність, ми маємо забезпечити їх належним фінансуванням."

shared_vault_stimpaks:0 "Запасання стимпаків"
shared_vault_stimpaks_desc:0 "Незважаючи на високу якість медичної допомоги у нашому Сховищі, у нас є проблеми з постачанням. Стимпаки й Med-X — рідкісна здобич, і ми не маємо способів їх виготовляти. Завдання науковцям: відновити формулу стимпаків."

shared_vault_support_bonus:0 "Стан — 100%"
shared_vault_support_bonus_desc:0 "Наші Піп-бої можуть відстежувати флору й фауну. Тож чому б не заохотити мешканців винищувати радтарганів, даючи нагороду за 50 вбитих? Мотивація гарантована."

shared_vault_future_warfare:0 "Майбутнє війни"
shared_vault_future_warfare_desc:0 "Деякі вчені мріють про часи, коли кожен мешканець матиме власний плазмовий пістолет.\n\nА поки — будемо задовольнятись переробленими лазерними гвинтівками."

shared_vault_super_security:0 "Теорії надбезпеки"
shared_vault_super_security_desc:0 "Перед війною армія США була на передовій військових технологій. Якщо ми зможемо інтегрувати їхні винаходи й керівництва — наші найкращі охоронці стануть елітними бійцями."

shared_vault_scientists:0 "Сумлінний утилізатор"
shared_vault_scientists_desc:0 "Vault-Tec витратив надто багато ресурсів на дивні експерименти. Якщо ми хочемо корисні технології, а не радтарганів, що говорять — треба відмовитися від ексцентричних досліджень."

shared_vault_research_bonus:0 "Лють ботанів!"
shared_vault_research_bonus_desc:0 "Схоже, наші вчені знайшли спосіб працювати менше. Вони створили комп’ютер, який сам відсіює безумні експерименти.\n\nКраще було б мати менше божевільних, але принаймні тепер усе піде швидше."

shared_vault_expanding_goat:0 "Розширення G.O.A.T."
shared_vault_expanding_goat_desc:0 "Тест G.O.A.T. допомагав поколінням знайти покликання (іноді). Але на поверхні з’явилось багато нових професій. Учителі й науковці вже додали 20 нових питань. Підлітки будуть у захваті!"

shared_vault_radar_time:0 "Поліпшені датчики руху"
shared_vault_radar_time_desc:0 "Датчик руху Wattz Electronics C-U — доповнення до старих моделей Піп-боїв. Якщо його розібрати, збільшити й зібрати знову — зможемо бачити ворогів ще до того, як вони підійдуть близько."

shared_vault_research_bonus_upgrade:0 "Завантаження RAM"
shared_vault_research_bonus_upgrade_desc:0 "«Сенсетрон» уже зекономив тисячі годин нашій науковій команді. Час розширити його функціонал за інструкцією Vault-Tec.\n\nЗгідно з протоколом, вставляємо голограм-диск — і отримуємо гігабайт RAM! Геніально."

shared_vault_slot_research:0 "Дивні дні"
shared_vault_slot_research_desc:0 "Ресурсні проблеми вирішено, вчені працюють на повну, і ми досягли ефективності, про яку Vault-Tec тільки мріяв. Схоже, наша наукова команда започаткувала нову еру технологічного прориву серед безграмотної пустки."

shared_vault_the_geck:0 "G.E.C.K."
shared_vault_the_geck_desc:0 "Наше Сховище перевершило всі очікування щодо виживання. Настав час виконати головну мету: вийти зі сталевих стін і перетворити Пустку на зелений рай із допомогою нашого ідеального G.E.C.K.!"

shared_vault_post_geck_1:0 "Відкриття дверей"
shared_vault_post_geck_1_desc:0 "Що криється за тими потужними дверима? Які відмінності між Сховищами? Чим особливі їх мешканці?\n\nДізнаємося лише, відкривши їх!"

shared_vault_post_geck_2:0 "Мешканці Сховищ"
shared_vault_post_geck_2_desc:0 "Наше дослідження інших Сховищ, їх подібностей і відмінностей, дало нові розуміння компанії, що їх збудувала, кінця світу... і нас самих."

shared_vault_post_geck_3:0 "Правда про Vault-Tec"
shared_vault_post_geck_3_desc:0 "Більше десяти кейсів призвели нас до неприємних відкриттів про компанію, що дала прихисток нашим предкам..."

