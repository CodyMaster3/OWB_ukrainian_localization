# Event

vsh_vault.1.t:0 "Спадщина Білих Комірців"
vsh_vault.1.d:0 "Сейфгейвен багато хто називає «містом шахраїв» або «лежаками посмішливих злодіїв». Але для тих, хто тут живе, це храм.\n\nДля мешканців Сховища 107 — це місце, де кошмар перетворився на можливість.\n\nПісля падіння бомб наглядач Малкольм Вудс відкрив суть експерименту: зібрати купу білих комірців-шахраїв разом і подивитись, коли вони пересваряться. Та, на подив всіх, мешканці швидко створили власні системи і почали вилазки до канадських заметів.\n\nТе саме мислення, що зробило їх злочинцями в очах Старого Світу, врятувало їх у новому. Коли двері сховища відчинились — вони вже не закривались. Сховище 107 стало притулком, маяком у темряві, і довкола нього почали зростати нові громади в руїнах старих міст.\n\nВсі вони з гордістю несуть стяг Сейфгейвену."
vsh_vault.1.a:0 "Громада для кожного."

vsh_vault.2.t:0 "Примарні історії"
vsh_vault.2.d:0 "Усі ми чули, що коїться на заході, десь біля старого Калґарі — торговий центр, яким керує торгова ШІ на ім'я Пенні, з армією роботів.\nВони лякають до чортиків — милі, як для штучного розуму, дозволяють кожному, хто поводиться чемно, робити покупки. Всередині — клаптик того достатку, яким жили старі задрипані світила до Великої Війни. Гарне місце. І всі його хочуть, через що роботи поводяться ворожо з кожним, хто наближається.\n\nІ ми хочемо цього не менше, ніж решта покидьків, що витріщаються на сяючі вогні серед снігу. Віднедавна там стало тихо — чудовий шанс для експедиції. Але більшість місцевих компаній боїться туди лізти. На щастя, спецпідрозділ Сьєрра-Готель зголосився оглянути зону. Хоча самі вони напружені — плітки ходять, ніби їхні давні вороги, Місканти, знову з’явилися.\n\nМинуло вже кілька тижнів, відколи від них надходила будь-яка звістка. Мері боїться найгіршого..."
vsh_vault.2.a:0 "Яке веселе місце, правда ж."

vsh_vault.3.t:0 "Вони прийшли зі Старого Вашингтона"
vsh_vault.3.d:0 "Вони називали себе «Вартові Білини». У поношеній ПБК-формі та з голосами, як у жаби влітку, вони шукали притулку. Кажуть, їхнє старе місце стерли з лиця землі типи, подібні до тих, що зараз живуть у Монтані.\n\nОчолює їх Мері Малліґан. Вони не надто приємні — дехто навіть називає їх «нещирими» чи «підступними», але це поки що не призвело до жодних проблем.\n\nТа за їхньою допомогою наш волонтерський уряд нарешті перетворюється на силу, яку варто підтримувати, а не на службу доставки, керовану третім сортом найманців."
vsh_vault.3.a:0 "Лише б хтось не вчинив божевільну витівку..."

vsh_vault.4.t:0 "Більше, ніж просто шипіння"
vsh_vault.4.d:0 "Сьогодні на старих частотах Вартових зашуміла рація — викликала неабиякий резонанс: «ми повернулись, Вашингтоне...» — між сплесками статичного шуму. Потім — поклик по іменах ескад.\n\nХтось каже, що Вартові повернулись до Сіетлу, але Мері має інші думки. Вони не можуть повертатись. Ще ні. Є важливіші справи, і Сейфгейвен — ідеальне місце, щоб почати."
vsh_vault.4.a:0 "Ну що, подивимось, що вариться!"

vsh_vault.5.t:0 "Возз'єднання Вартових"
vsh_vault.5.d:0 "БРЕНДТ: Радий бачити тебе цілою, Малліґан. Ми сумували.\n\nМАЛЛІҐАН: Так само, сер.\n\nБРЕНДТ: Сподіваюсь, Канада була для тебе корисною. Хоча, мабуть, пострибати з одного Сховища в інше — не найкраща пригода. Готова повертатись до справи?\n\nМАЛЛІҐАН: Готова як ніколи, сер.\n\nБРЕНДТ: Добре. Бог знає, скільки ще нам доведеться розгрібати."
vsh_vault.5.a:0 "Вартові тримаються разом."

vsh_vault.6.t:0 "Вона що зробила?!"
vsh_vault.6.d:0 "Сьогодні мерка Шоутайм отримала звіт, схожий на ті, що подає Мері. Лише на цьому була намальована емблема Сьєрра-Готель і заголовок — «Операція: Кіллджой».\n\nВ серці Шоутайм завмер жах — адже ходили новини про дитину Пара зі Зграї: маленьку Джой. На щастя, Мері знову втнула гру слів — операція виявилась не вбивством, а викраденням із вимогою викупу.\n\nАле Шоутайм лишилась з одним питанням: навіщо Мері це зробила? Це був очевидний політичний хід, і, до того ж, тепер ситуація вже не в її руках. Нею керує Сьєрра-Готель.\n\nЗа повернення дитини вони вимагають території на північ від нашого річкового кордону — ідеальне місце для майбутнього удару у випадку війни."
vsh_vault.6.a:0 "Мері вже зробила свою ставку."

vsh_vault.7.t:0 "Повернення експедиції"
vsh_vault.7.d:0 "Загін Альфа, що вирушив у розвідку до Міддлмарку, повернувся з тривожною історією про роботів, рейдерів і загибель загонів Бета та Омега...\n\nВони дісталися до Калґарі без особливих проблем — майже не було патрулів у містах, що формально входять до логотипу ММ, а також виявили Вартових, які не були частиною Сьєрра-Готель, що переховувались у регіоні. Вони пробрались на дах торгового центру й побачили крізь світлові вікна комерційну зону, наповнену дешевими клонами роботів РоБКо та екранами з ШІ-лідеркою. Звична картина, доки не увірвалися рейдери, вдягнені в фірмовий мерч, ламаючи стенди й вигукуючи «Пенні».\n\nКерівник експедиції, ветеран рейдерських війн, упізнав банду — це були Місканти. Але вже було пізно: численні камери зафіксували команду, й ті були змушені тікати назад до Вартовів. У паніці вони й видали схованку. Загін Альфа вирішив рятуватись втечею, ставши єдиним, хто пережив різанину.\n\nСьєрра-Готель ослабла — в живих лишились лічені ветерани. Пані Малліґан прийняла це болісно, сповнившись бажання помсти, й тепер вимагає від мера Шоутайм вдарити у відповідь. Та мерка відповіла, що війна з Міддлмарком поки неможлива через їхні зв’язки. Це викликало гнів Мері, яка вважає, що справжній ворог — не Зграя, а по той бік річки, в супермаркеті Калґарі..."
vsh_vault.7.a:0 "Місканти."

vsh_vault.8.t:0 "Вистава"
vsh_vault.8.d:0 "Найманці завжди були занозою в дупі Сейфгейвена. Вони оселились тут, як міль на світло — називали це «другим домом, подалі від війни».\n\nШоутайм згадала своє дитинство в сиротинцях — голодне, злиденне. Вона крала, щоб вижити, кричала «вистава починається» в надії, що якийсь найманець кине кришку.\n\nЦі спогади палили її зсередини. І от настав день, коли вона з Мері Малліґан вирішили закінчити це. Спланована операція, ретельні приготування — все задля того, щоб Вартові штурмували кубло найманців. А тоді вже Шоутайм увійде всередину — й поговорить. У неї два варіанти: звабити їх, переконати, що вони — основа безпеки й запросити у військо як елітну силу... або ж пригрозити, змусити силою. Обидва шляхи мають сенс. Але це тендітна ситуація. Вона не може дозволити собі знову принижуватись... хоча думка про це викликає огиду."
vsh_vault.8.a:0 "§RДосить балачок.§!"
vsh_vault.8.b:0 "§BЧас вистави.§!"

vsh_vault.9.t:0 "Платня"
vsh_vault.9.d:0 "Ми отримали плату за відправлення добровольців!"
vsh_vault.9.a:0 "Юхуу!"

vsh_vault.10.t:0 "Місто відновлено, дім врятовано"
vsh_vault.10.d:0 "Колись про Сейфгейвен жартували: «найманці беруть гроші за захист, але від чого? Хто захоче захопити цю дірку?»\n\nАле все змінилось. Тепер замість ледачих і продажних найманців — справжні сили оборони, що служать людям. Замість халуп і порожніх тарілок — справжні будинки й сільське господарство.\n\nСейфгейвен став цивілізованим місцем. Як Брендон або Шейді-Сендс, але з власним шармом. Хто б міг подумати, що в морозних рівнинах Канади з'явиться така тепла спільнота — нація добросердих найманців, які допомагають слабким і борються з покидьками. Вона стала справжнім домом. Безпечним притулком для знедолених. Принаймні, для тих, кого народ вважає добрими..."
vsh_vault.10.a:0 "Отже, справжній сейфгейвен?"

vsh_vault.11.t:0 "Святкування!"
vsh_vault.11.d:0 "Шоутайм відчувала лише гордість і надію, стоячи перед натовпом. Десятеро чоловіків стояли поруч із нею та Мері на сцені, ще дві сотні — спостерігали знизу за церемонією нагородження. Кожного викликали за іменем для вручення медалі за доблесну службу у війні проти Великої Зграї; кожен виклик супроводжувався гучними оплесками. Люди нарешті зітхнули з полегшенням — загроза, що нависала над ними, була знищена.\n\nШоутайм підійшла до трибуни, готова до заключної промови. «Ми зробили те, що всі вважали неможливим. Ми знищили велетня Альберти, звільнили його людей. Ми довели, що модель Сейфгейвена працює. І вона працюватиме й надалі. Ми продовжимо зміцнюватися та захищати одне одного від зла!» — вигукнула вона гордо, отримавши вибух овацій. Усмішка не сходила з її обличчя.\n\n«А де був захист для мого чоловіка!?» — пролунав голос із натовпу. Шоутайм насупилась, не знаючи, що відповісти. З натовпу долунали нові вигуки: «Медалі солдатам? Але ж це Вартові виграли війну! Тільки вони тут щось роблять!». Глузування й крики об’єднались в одне: «Нехай Вартови керують!» Шоутайм подивилась на Мері, яка теж була здивована. Та вийшла вперед і звернулась до натовпу.\n\n«Вартові завжди були тут, щоб підтримати вас. Якщо це справді воля народу — я прийму посаду мера!» — вигукнула Мері. Частина натовпу зустріла це схвальними вигуками. «Небезпека всюди. Ми подолали лише одну загрозу. Вони посміхаються тепер, але в спину встромлять кинджал, щойно ми озирнемось. Жодних компромісів. Жодних дебатів. Лише знищення ворога гарантує нам спокій. Якщо ви довірите мені владу — я не зупинюсь, поки не зітру їх із лиця землі! Хто зі мною?» — крикнула вона натовпу. Їй у відповідь пролунало..."
vsh_vault.11.a:0 "Радісне скандування."
vsh_vault.11.b:0 "Пригнічена тиша."

vsh_vault.12.t:0 "Старі спогади"
vsh_vault.12.d:0 "Мері відчула азарт, коли дізналась, що треба «притиснути кількох незгодних». Вона скучила за тим, щоб дати комусь добрячого копняка. Швидко зібравши кількох Вартових, вирушила в центр Сейфгейвена — саме туди, де збирались протестувальники.\n\n«Вони стоять за річкою! Ще мить — і нападуть! І ми дозволяємо їм вільно шастати поруч! Де ж безпека?» — кричала молода жінка. Мері вийшла вперед, налаштована жорстко. Підійшла до неї й сказала: «Припини протест і йди добровільно — або буде гірше».\n\n«Невже? Я говорю про поганих рейдерів, а ти, Вартове, заважаєш мені? Ви стали м’якими?!» — вигукнула та. Мері завмерла. Слова дівчини мали сенс. Місканти — справжня загроза, й були занадто близько.\n\n«Як твоє ім’я?» — запитала Мері. «Софія. Сейфгейвен — мій дім. Я просто хочу, щоб він був у безпеці. Ти ж розумієш, правда?» — благаюче сказала вона.\n\nМері мовчала. У пам’яті виринали спогади. Вона підняла руку Софії та вигукнула: «Софія, ти права! Небезпека всюди. Вартові — з тобою! Ми не дозволимо цій загрозі вільно існувати!»\n\nМері звернулась до натовпу: «Ми вдаримо першими! Ми знищимо це кодло! Капіталістичний ШІ та його рейдери — жалюгідні вороги для Вартових. Ми розтрощимо їх!»\n\nПомста, захист нового дому — чудове поєднання. Шоутайм, можливо, сумнівалась, але Мері вірила в силу своїх Вартових. Міддлмарк ще не знає, що на нього чекає."
vsh_vault.12.a:0 "Готуй рушницю."

vsh_vault.13.t:0 "Різанина Міскантів"
vsh_vault.13.d:0 "Мері завжди подобалась помста. Той момент, коли ворог розуміє, що програв — безцінний. Вартові розчавили Міскантів і Пенні. Тепер вони виловлювали кожного для страти. Її рука стискала горло ворога. Достатньо лише здавити...\n\nТа щось всередині зупиняло її. Не жаль — ненавиділа Міскантів. Але вона любила Вартовів. Їхня репутація. У Каскадії їх вважали парамілітарними виродками, а тут — героями. І масова страта... могла все зруйнувати.\n\nА якщо навпаки? Місканти не вагаючись вбили б кожного Вартовa. Але... серед полонених вона бачила тих, хто носив жетони Вартових. Не трофеї — знаки пам’яті. Брати по зброї? Колись? Хто вони тепер?\n\nМері вагалась. Милосердя чи справедливість? Чи пуста помста? Вона не знала. Але вибір був за нею."
vsh_vault.13.a:0 "Справедливість..?"
vsh_vault.13.b:0 "Милосердя."

vsh_vault.14.t:0 "Радісні вигуки"
vsh_vault.14.d:0 "Натовп шалено скандував, вигуки не стихали з усіх боків. Мері була трохи ошелешена — не очікувала такої підтримки. Вона подивилась на Шоутайм, яка теж була здивована. Та затримала погляд на Мері, а потім посміхнулась.\n\nОбернувшись до натовпу з усмішкою, вона сказала: «Це не зовсім те, що я планувала, але я завжди була людиною народу. Якщо це справді ваш вибір — я складу повноваження і передам владу Мері!»\n\n«Отже, народе Сейфгейвена, ви хочете, щоб Вартові керували?» — вигукнула Шоутайм.\n\nРезультатом було гучне одноголосне «Так».\n\n«Тоді так і буде! Вітайте вашу нову лідерку — командирку Мері Малліґан!» — вигукнула вона. Мері підійшла до трибуни під гучні оплески.\n\n«Я щиро дякую вам усім. Обіцяю: я не змарную цю можливість. Я зроблю все можливе, щоб зробити Сейфгейвен безпечнішим і сильнішим. Ви можете бути певні — я служу тільки вам, народу!» — вигукнула Мері."
vsh_vault.14.a:0 "Їх вигуки лунали по всьому місту!"

vsh_vault.15.t:0 "Відносна тиша"
vsh_vault.15.d:0 "Та сама група, що почала всю цю виставу, голосно скандувала за Мері. Решта — мовчала, незгідна з її можливим правлінням. Мері насупилась — їй стало соромно, що вона так захопилась ідеєю керувати Сейфгейвеном.\n\n«Звісно, якщо ви вважаєте, що мер Шоутайм і далі залишиться гідною лідеркою — я теж продовжу покладатися на неї», — сказала Мері.\n\n«Бажаєте, щоб я й надалі очолювала вас?» — звернулась Шоутайм.\n\nНатовп відповів однозначно — так, хоче.\n\n«Дякую. Я щиро вдячна за вашу довіру. Сейфгейвен змінився, але це лише початок! Ми продовжимо зростати, просуватися вперед! Ми ніколи не впадемо. З Вартовими поруч і з вірою в серці — ми процвітатимемо! Велике майбутнє чекає на Сейфгейвен, потрібно лише простягнути руку!» — виголосила Шоутайм. Натовп вибухнув оваціями, навіть Мері, приховано, посміхнулась. Їй було трохи прикро, що народ не довірився їй, але якби вже й програвати — то тільки Шоутайм. І Вартови її підтримають. Вона їй це винна."
vsh_vault.15.a:0 "Сейфгейвен — для сейфгейвенців!"

vsh_vault.16.t:0 "Сміттярі рятують день!"
vsh_vault.16.d:0 "Нещодавно до нас звернувся хлопець із проханням прибрати підвал. Запит дивний, але новостворений відділ парків і благоустрою миттєво схопився за можливість допомогти громаді — особливо коли той пообіцяв, що все знайдене сміття залишиться нам.\n\nНа щастя, здається, попередній власник будинку був фанатом Нюки й залишив тисячі кришечок від пляшок. Після того, як працівники благоустрою отримали щедру премію, ми маємо достатньо кришечок, щоб поповнити скарбницю й принаймні тимчасово вирішити наші торгові труднощі..."
vsh_vault.16.a:0 "Оце так удача..."

vsh_vault.17.t:0 "Бо ти — сильна"
vsh_vault.17.d:0 "«Командире Гарлоу. Дуже рада бачити вас знову», — сказала Мері, віддаючи честь Сільвії.\n\n«Навзаєм, командире Малліґан. Після Вашингтона...» — вона обірвала себе, згадуючи минуле. «Я думала, мало хто вижив», — тихо додала.\n\n«Ми вижили, і ми сильніші, ніж будь-коли. Ми мусимо об’єднати Вартових, покарати тих, хто нас знищив, і всіх, хто загрожує Пустці», — впевнено заявила Мері. «Ні», — коротко відказала Сільвія. Мері здивувалась. Вона почала щось казати, але Сільвія зупинила її.\n\n«Ні, слухай. Ти завжди була відданою Вартова. Твій патріотизм не знає меж. Але... Вартови — мертві. Вони загинули у Вашингтоні. Ми — лише тінь. Але що як з їх попелу ми створимо щось нове?» — запитала Сільвія. У Мері закипала лють. Вона стиснула кулаки, дихала глибоко. Рука Шоутайм лягла їй на плече — Мері подивилась на неї. «Це твій вибір, Мері. І що б ти не обрала — народ Сейфгейвена підтримає тебе».\n\nСльози навернулись на очі Мері. Вона зробила вибір."
vsh_vault.17.a:0 "Вартові обивають зрадників."
vsh_vault.17.b:0 "До біса Вартових!"

vsh_vault.18.t:0 "Гордо стій"
vsh_vault.18.d:0 "— Командире Гарлоу. Рада знову вас бачити, — сказала Мері, кидаючи шанобливе вітання Вільяму.\n\n— Командире Малліґан, як я скучив за вами й вашими хлопцями. Як поживаєте в Сейфгейвені? Чув, ви ті Міскантів стерли в порох — ох і молодці! — вигукнув Вільям.\n\n— Я лише зробила те, що зробив би будь-який Вардeн на моєму місці, — відповіла Мері.\n\n— Ти маєш хист, Малліґан, не те що деякі з цих розмазань тут. Ніхто вже не здатен приймати важкі рішення — все доводиться тягнути мені, — буркотів він, і Мері кивала з ввічливості.\n\n— Але нічого, — продовжив Вільям. — Тепер, коли ми разом, ми можемо знову дати бій кожному, хто загрожує нам. Я не проти вирізати до останнього тих вашингтонських виродків, які нас вигнали.\n\n— Звісно, але спершу нам треба набрати людей. У нас просто не вистачить сил, щоб їм погрожувати, — зауважила Мері.\n\n— Та нічого, — сказав Вільям. — Просто призвемо трохи людей із наших. Вони там довго не протягнуть, але ж їм лише треба відволікати вогонь, поки Вартові зроблять свою справу. Вони будуть незадоволені, але ж хтось має приймати тяжкі рішення.\n\n— Авжеж, командире, — відповіла Мері, відчуваючи певний дискомфорт від його тону. Звісно, вона хотіла помсти й відновлення Вартовів. Але він... занадто. Чи справді вона зможе працювати з таким?"
vsh_vault.18.a:0 "Невже ми завжди були такими скаженими?"
vsh_vault.18.b:0 "Чорт забирай, брате! Але без сейфгейвенців..."

vsh_vault.19.t:0 "Божевільні!"
vsh_vault.19.d:0 "Виявилось, що не всі хочуть залишати сховище. Попри те, що більшість ми вмовили спокійно й тактовно, значна група старожилів наполягала — все життя вони тут, і тут помруть.\n\nКоли ми направили невеликий загін, щоб м’яко переселити їх до нових осель, спалахнула сутичка. Старі дістали заховані 10-міліметрові й поклали кількох наших солдатів, перш ніж Вардeн втрутився, «щоб вирішити проблему»."
vsh_vault.19.a:0 "Звести меморіал."

vsh_vault.20.t:0 "Покупець!"
vsh_vault.20.d:0 "Сьогодні один мешканець сховища завітав до нашої штаб-квартири — його направили караванники, що збирались на схід до Реджайни.\n\nКоли йому сказали, що документи переведення зі 107-го сховища оформлюють далі по коридору, він відповів, що прибув з іншого сховища й у нього зламався водяний чип. Він запропонував пристойну суму за тимчасове забезпечення їх сховища водою, поки знайде новий чип!"
vsh_vault.20.a:0 "Він не сказав, звідки саме..."

vsh_vault.21.t:0 "Наша ініціатива"
vsh_vault.21.d:0 "Мер Шоутайм знову зібрала націю, щоб оголосити грандіозні плани. Патріотизм і гордість за Сейфгейвен зросли після перемоги над Зграєю та її переобрання. Треба було скористатись цим підйомом і вивести народ на новий рівень.\n\n«Народе Сейфгейвена! Слухайте! Настав час зробити наступний крок до закріплення нашої позиції у Пустці!» — вона зробила паузу для ефекту.\n\n«Дозвольте показати вам ось це!» — вигукнула вона й на екрані з’явився великий документ. — «Наймані компанії Сейфгейвена!»\n\n«Ми будемо надсилати наших бійців і зброю до дружніх демократичних держав, допомагаючи їм і ростучи самі. Люди на кшталт вас, зі зброєю й надією в серцях, — ось наша гордість!»\n\nШоутайм сяяла від гордості. Шлях буде важким, ворогів довкола чимало. Але одного дня Сейфгейвен стане перлиною Канади. Це — наша ініціатива. За загартовані серця, за мужність, за краще майбутнє, за Сейфгейвен!"
vsh_vault.21.a:0 "За сейфгейвенців!"

vsh_vault.22.t:0 "Приємно бути багатим"
vsh_vault.22.d:0 "Нова ініціатива Сейфгейвена йшла чудово. Усі плани Шоутайм, колись далекі мрії, тепер стали реальністю. Легіони вояків, натреновані жорсткою програмою Вартових, були готові вирушити в Пустку, аби захищати демократію. Їхнє спорядження — на вищому рівні. Вони — ідеальні. А ще — перспективне джерело доходу.\n\nПісля ребрендингу на «S.H. Mercenary Company» інтерес до них зростав. Це ім’я привабить покупців. Шоутайм вже розробляла плани на те, як витратити кришки.\n\nА найкраще?.. Це принесе дійсно великі гроші."
vsh_vault.22.a:0 "Я люблю гроші..."

vsh_vault.23.t:0 "Стояти з Гордiстю"
vsh_vault.23.d:0 "Щодня Сейфгейвен зростав. Ще один будинок, ще одна колія, ще одна дорога. Місто невпинно рухалося вперед, борючись із жорстокістю світу. Із багна до спільноти, до форпосту. Воно стало чимось більшим. Але не без ціни. Щоб утримувати розвиток, особливо в Пустці, доводилося жертвувати. Комусь доводилось голодувати, комусь — виконувати небажану роботу. Але найважливіше — хтось мав віддати життя.\n\nЦе — природа Пустки. І саме вона привела Мера Шоутайм до її наступного проєкту.\n\nПроєкт був нескладний — не вимагав багато ресурсів, але його зміст, можливо, був найважливішим серед усіх її останніх «проєктів Сейфгейвен».\n\nШоутайм стояла в центрі Сейфгейвен, перед нею — величезний натовп. Промова записувалася для радіо й, вперше в історії, для телебачення. Її, ймовірно, бачитимуть лише еліти Сейфгейвен, але її значення залишалося безсумнівним. Шоутайм звернулася до людей:\n\n«Хоч ми зараз живемо в безпеці та розкоші, ми не маємо права забувати тих, хто віддав життя, щоб ми дісталися сюди. Вони не будуть забуті».\n\nПісля цих слів вона зняла покривало, відкривши величну статую солдата, який стояв з руками на стегнах, дивлячись у далечінь. На підніжжі були вибиті слова: «Ніколи не забуто».\n\nНатовп вибухнув аплодисментами, всі гордилися тим, як далеко вони просунулися, і тими, хто віддав за це життя."
vsh_vault.23.a:0 "На пам’ять — у добрі й у злі."

vsh_vault.24.t:0 "Жінка, Яка..."
vsh_vault.24.d:0 "Мер Шоутайм зручно вмостилася в кріслі, зітхаючи з полегшенням. Зручне крісло — така, здавалося б, дрібниця, але без нього вона не могла працювати. Такий контраст із її старим кріслом, яке ледь не розвалювалося. Ще одне нагадування, наскільки далеко вона дійшла. Вона поправила намисто на шиї, намагаючись виглядати якомога охайніше. Незабаром вона мала звертатися до нації — вигляд був важливим. \n\nДо вікна її кабінету барабанив дощ, створюючи заспокійливу атмосферу. Вона поправляла одне з діамантових сережок, підходячи до вікна, задумано думаючи про промову. Надворі було майже порожньо — всі ховалися від дощу. Крім однієї — маленької дитини, яка сиділа майже під укриттям, перед нею — перевернутий капелюх. Без жодної монети.\n\nШоутайм миттєво стало зле. Її травматичне минуле вирвалося на поверхню. Вона спробувала позбутися спогадів, зашторивши вікно, але це не допомогло. Дитина залишалась у свідомості — тільки тепер це була вона. Вона поглянула на свої руки, всі в кільцях з дорогоцінним камінням. Шоутайм рвучко почала знімати їх, кидати на підлогу. Зірвала намисто — перлини розсипалися. Вона завмерла. Тільки звук перлів, що котяться підлогою.\n\n«Що, чорт забирай, я накоїла?» — спитала себе."
vsh_vault.24.a:0 "Втікаючи..."

vsh_vault.25.t:0 "За Слабких"
vsh_vault.25.d:0 "Мер Шоутайм і Мері стояли на великій сцені, звертаючись до нації. Багато громадян Сейфгейвен були присутні, інші слухали по радіо. Вся країна прислухалася до своїх лідерів, затамувавши подих.\n\n«Занадто довго ми жили в жахливих умовах, щодня приносячи жертви заради примарної надії на виживання. Ми кажемо: досить! Ми вдаримо по всім, хто нас пригноблює, і виростемо вище, ніж вони могли уявити. Ми принесемо вам велич. Свободу для кожного робити, що йому заманеться. Але самі ми цього не зробимо. Нам потрібна ваша допомога! Приєднуйтесь до армії, до Нових Вартових. Бо ми — ніщо, коли роз'єднані, але разом — сила, здатна зрушити гори.\n\nВони не розуміють, що робить нас особливими, і ніколи не зрозуміють. За Сейфгейвен, за Охоронців Проходів! За праведних, і за тих, кого покинули сильні!»"
vsh_vault.25.a:0 "Іще один — за вільних!"

vsh_vault.26.t:0 "Є Що Відсвяткувати"
vsh_vault.26.d:0 "Було вже досить пізно, коли з офісу мера в Сейфгейвен пролунав сміх. Мері, Шоутайм і Сільвія розповідали історії, жартували й радісно сміялися, кожна з них випила вже забагато. Вони не були любителями алкоголю, зазвичай віддаючи перевагу роботі. Але всі погодились — після такого тривалого безвідпочинкового періоду, вони це заслужили.\n\nМері на хвильку вийшла з розмови, щоби знову наповнити свій келих. Злегка похитуючись, вона підійшла до столу з напоями й побачила свій шолом, залишений там раніше. Вона подивилася на тріснуті лінзи — задумливо. Її відображення дивилося у відповідь. Мері ніколи б цього не зізналася — іноді навіть сама собі — але вона часто сумнівалася в собі. Коли вона вирішила розірвати зв'язок із Вартовими Сієтла і почати нову справу, вона справді не знала, чи правильно вчинила. А може, просто стала зрадницею, яку слід зупинити перш, ніж вона накоїть біди. Ці думки досі навідували її, як докори сумління. Але коли вона дивилася на Сейфгейвен, на Шоутайм і Сільвію — усе здавалося того вартим. Можливо, вона зробила правильний вибір. «Можливо, я ніколи й не дізнаюся», — подумала Мері, почувши гучний сміх Шоутайм. Усмішка з’явилась на її обличчі. Може, їй і не потрібно знати."
vsh_vault.26.a:0 "У цьому житті!"

vsh_vault.27.t:0 "Прогрес — У Власному Темпі"
vsh_vault.27.d:0 "Сироти в Сейфгейвен довгий час були великою проблемою. Діти, які втратили батьків або були покинуті, намагалися вижити в суворих умовах. Колись це було нормою. Але це було колись. Сейфгейвен змінився — сформований Шоутайм і Мері у щось більше —\n\nУ спільноту.\n\nДе колись стояли убогі халупи, зараз — школи та будинки з люблячими родинами. Діти, в очах яких ще недавно була туга, зараз — усміхнені, з повними животами. Вони могли вчитися. Вони могли рости.\n\nСерце Шоутайм наповнилося радістю, коли вона дивилася на юні обличчя, повні енергії та зацікавлення.\n\n«Привіт, дітки. Я — Шоутайм, ваш мер. Але можете вважати мене другом. А це — Мері, моя права рука. Ми прийшли поговорити про обов’язки лідера нації», — сказала Шоутайм з яскравою усмішкою. Натомість Мері виглядала ніяково, їй було некомфортно серед школярів. «У вас є до нас питання?» — запитала Шоутайм. Один хлопчик, повний ентузіазму, підняв руку якомога вище.\n\n«Ви вбивали поганих хлопців?» — спитав він, дивлячись на Мері. Усмішка Шоутайм одразу зникла, вона перевела погляд на Мері. «Так. Багато» — сказала Мері. Шоутайм здригнулася, благаючи небеса, щоб Мері проявила більше такту. Діти захоплено видали: «Уооо...» — заінтриговані небезпечними пригодами сильної та грізної жінки.\n\n«А що найстрашніше ви вбили?» — пролунало ще одне питання. «Бегемот-Супермутант. Величезне чудовисько. У мене було лише...» Шоутайм завмерла в захваті, коли Мері почала розповідати в деталях жахливу історію. Шоутайм хотіла б втрутитися, але не змогла зіпсувати дітям таку цікаву розповідь. Це було, можливо, не зовсім те, на що вона сподівалася, але хто вона така, щоб вирішувати, що має цікавити дітей? Можливо, саме ця історія надихне когось із них стати героєм, як Мері. І ця думка дарувала їй спокій."
vsh_vault.27.a:0 "Стривай, Мері, не давай йому пістолет!"

vsh_vault.28.t:0 "Нова Гавань"
vsh_vault.28.d:0 "Мер Шоутайм, Мері та Сільвія стояли в кабінеті мера, обтяжені думками. Після ретельного планування і підготовки вони нарешті були готові оголосити те, що приготували. Знімальна група встановлювала камери, поки всі троє готувалися морально.\n\n«Нервуєш, Мері?» — дражнила Шоутайм, знаючи про її страх перед камерами. «Ні. Вартові не нервують. Вони роблять, що мають» — твердо відповіла Мері. «Вона точно нервує», — сказала Сільвія, викликавши сміх у Шоутайм і удар кулаком у плече від Мері. «До ефіру двадцять секунд», — вигукнув один із членів команди. Усі стали на свої місця: Шоутайм — посередині, Сільвія й Мері по боках. Камери увімкнено. Технік почав зворотний відлік — три, два, один...\n\n«Добрий вечір, громадяни Півночі. Ми звертаємося до вас сьогодні з важливим повідомленням. Ми оголошуємо про створення 'Північної Народної Гавані' — повноцінної демократичної нації, яка об’єднає наші зусилля й народ під єдиним прапором. Уже складається конституція, готуються вибори. Дякуємо всім, хто допоміг дійти до цього моменту. Це було нелегко, і ми не змогли б без вашої сили. Ми боролися разом, допомагали один одному, і, найважливіше, ми зростали разом. Хоч зараз може здаватися легше, не можна забувати про ті жертви, що привели нас сюди. Це лише початок великої справи. Попереду ще багато роботи й багато людей, яких треба врятувати. Це може здаватися непосильним, але я знаю — разом ми подолаємо все, що Пустка нам підкине. Чи ви Вартовий, найманець, чи просто виживаєте — знайте: ми завжди стоятимемо за ваші інтереси. Дякую всім, і нехай Північна Народна Гавань живе сто років!»"
vsh_vault.28.a:0 "Святкуймо!"

vsh_vault.29.t:0 "Холодне Серце..."
vsh_vault.29.d:0 "Мері вдивлялася вдалину, заглиблена у власні думки. Перед нею простягалися безкраї снігові поля, мов океан білого, і її роздуми мимоволі повернулися до того справжнього моря, яке вона колись так захоплено споглядала. Море було схожим на Вартових — невблаганне, скажене. Йому байдуже, що про нього думають — воно просто робить, що хоче. Його не здолати, можна лише борсатися, поки не втягне надто далеко. На обличчі Мері з’явилася вовча усмішка. Як і саме море, вона обрушиться на всіх, хто стане їй на заваді.\n\nВона обернулася до великого загону солдатів перед собою. Їхня броня була бездоганною, відбивала холодне білосніжжя навколо. “Вартового формують три речі,” — почала вона. “Його холодне серце, його сталевий розум і його зброя. Це все, що вам буде потрібно до кінця життя. Ви — маяк безпеки та честі серед холодного снігу. Пустка має зрозуміти: опору не буде, потурання — тим паче. Ви — молот пустки, що вдаряє по тим, хто полює на слабших. Ви впадете на них стрімко й безжально,” — гучно вигукнула вона. Зробивши паузу, вона оглянула бійців. “Заспокойтесь тим, що ваші серця такі ж холодні, як сніг навколо. І саме тому ви сильніші за все, що може кинути нам пустка. Ви — Вартові. А Вартовий дбає лише про одне — свою місію. Топтати слабких і нищити сильних. Ми ніколи не здамося. Ми ніколи не відступимо!” — закричала вона. Солдати відповіли криком, змахнувши руками вгору. “Вартові Білини” — вигукнула Мері. Солдати рушили вперед, а сніг падав їй на шолом, затуманюючи зір."
vsh_vault.29.a:0 "І важка рушниця..."

vsh_vault.30.t:0 "Пара... виродків"
vsh_vault.30.d:0 "Ейфорія від перемоги часто зникає, щойно приходить відповідальність за керування переможеними. Перемога Сейфгейвен над Великим Табуном не стала винятком. Люди повільно звикали до нового керівництва — держави, якою правлять колишні шахраї, що тільки-но отримали контроль над економікою й населенням. Мер Шоутайм не шкодувала зусиль, аби здобути довіру: інфраструктура, торгівля — все було в пріоритеті. Та залишалась одна проблема...\n\nТа Пара.\n\nЇх любили. Їх обожнювали. Але вони програли. І люди не могли відпустити.\n\nПропозиція Мері була проста: «Пристрелити гадів і зробити з цього показовий урок». Але все не так просто. Тому мер обрала м’якший, хоч і не менш дієвий варіант.\n\nНебо було помаранчевим, сонце ледь виднілося. Мері й мер мовчки супроводжували Королівську пару до невідомого їм місця. У Мері — їхня дитина на руках. Пара йшла з гідністю, намагаючись зберегти хоч якусь гордість. Попереду — двоє коней, прив’язаних до стовпа. Мері й Шоутайм зупинились. Шоутайм обернулася до Пари й кивнула на коней:\n\n“Вони — ваші,” — сказала вона. Пара завмерла, осмислюючи почуте. “Ми вас не вб’ємо. Але ви не можете залишатися в наших землях. Це ваш єдиний шанс,” — додала вона.\n\n‘Наші землі’. Ці слова відлунювали в думках Джона. Перед очима промайнуло його життя. Де все пішло не так? Він мовчки кивнув, узяв дружину за руку, прийняв дитину з рук Мері — майже неохоче — й підійшов до коней. Хай би що було далі — він буде з родиною. І за це був вдячний.\n\nМері й Шоутайм мовчки дивилися їм услід.\n\n“Цікаво, як вони впораються,” — пробурмотіла Шоутайм.\n\n“Не наша справа. У нас є важливіші проблеми,” — жорстко відповіла Мері.\n\n“Мабуть, ти права,” — сказала Шоутайм, спостерігаючи, як Пара зникає з горизонту."
vsh_vault.30.a:0 "Родина разом, попри все."

vsh_vault.31.t:0 "Досить Шоутайм"
vsh_vault.31.d:0 "Мер Шоутайм ніколи не грала роль деспота — це не було в її природі. Вона завжди обирала мед, а не оцет, залишаючи насильство Мері та її людям. Можливо, саме тому група перед нею була вражена, коли вона вдерлася посеред розкішної вечері. Найманці обурено вимагали пояснень, але Шоутайм не відповіла. Вона мовчки сіла й налила собі напій. Зробивши ковток, вона подивилася прямо в очі найманцям:\n\n“Погляньте на мене,” — сказала вона. “Ви більше не будете гратися з Сейфгейвен. Зрозуміло?” — промовила твердо. У кімнаті — тиша. Ніхто не наважився щось сказати.\n\n“Це більше не ваш майданчик. Це — дім. Якщо хочете бути частиною цього дому — пора працювати. Якщо це вам не підходить — можете йти. Але попереджаю: якщо залишитеся й будете продовжувати мене дратувати — з вами поговорить Мері. А вона, знаєте, набагато менш люб’язна, ніж я,” — сказала вона, показуючи на Мері, що стояла за нею — як уособлення сили.\n\n“То як буде?” — запитала Шоутайм.\n\nНайманці перезирнулися. Один підвівся:\n\n“Ти думаєш, ми боїмося тебе? Ти тут ніхто! Ми — головні!” — заревів він, підійшовши до неї. Шоутайм зморщила ніс, відчувши його перегар, і ледь помітно кивнула Мері. Той ледь устиг щось зрозуміти, як кулак Мері влучив йому в щелепу — і той знепритомнів. Шоутайм вихопила пістолет Мері й вистрілила йому в голову. Шокована кімната завмерла. Мерцем смикнуло, і він затих.\n\n“Повторюю,” — сказала Шоутайм, звертаючись до зали, кров на її обличчі.\n\n“Як буде?”"
vsh_vault.31.a:0 "Серце героїні черствіє."

vsh_vault.32.t:0 "Час для Шоутайм"
vsh_vault.32.d:0 "Шоутайм сіла зручно в крісло перед початком виступу. Найманці дивилися на неї з підозрою. Хоча ніхто не загинув, коли Вартові вимагали доступу, до перестрілки залишалося зовсім небагато.\n\n“Не хвилюйтеся, я не прийшла вас скривдити. Я прийшла запропонувати угоду,” — спокійно промовила Шоутайм. Найманці переглянулися, не знаючи, що думати.\n\n“Я будую новий Сейфгейвен, місце для всіх. Я хочу, щоб ви стали його частиною, але все не може залишитися як є. Нам потрібне партнерство, ми повинні разом підтримувати цих людей. Мені потрібна ваша підтримка, ваш бойовий досвід. Ми хочемо бачити вас у Сейфгейвен як громадян, а не як найманців,” — благала вона. Найманці мовчки дивилися одне на одного — їх це не переконало. Шоутайм почала нервувати, вже готуючись діяти жорстко, коли раптом слово взяла Мері.\n\n“Я колись була як ви. Шукала тільки бойового адреналіну, топтала тих, кого вважала слабшими. Але ви повинні зрозуміти — люди в Сейфгейвен просто хочуть вижити. Як і ви, як і я. Ми створюємо тут щось нове. І ви можете бути частиною цього. Більше не треба воювати, ми можемо разом працювати заради цих людей. Сейфгейвен може залишитися вашим Сейфгейвен — просто залиште в ньому місце для інших. Будь ласка. Ніхто не має вмирати сьогодні,” — майже благаючи, сказала Мері.\n\nНайманці переглянулися ще раз, і один із них, їхній лідер, встав.\n\n“Ми приймаємо вашу пропозицію.”\n\nУсі зітхнули з полегшенням. Пізніше того дня Шоутайм спитала в Мері, чому вона так пристрасно говорила.\n\n“Навіть не знаю, що на мене найшло. Напевно, я справді дбаю про це місце,” — тихо відповіла вона."
vsh_vault.32.a:0 "Серце солдата пом’якшується."

vsh_vault.33.t:0 "...Продала Світ"
vsh_vault.33.d:0 "Вона кинулася з офісу до знімального залу. Знімальна група спантеличено підняла погляд, коли вона влетіла до приміщення.\n\n“Починайте зйомку!” — наказала Шоутайм.\n\n“Ем... пані мер, це не час, який ми погоджували, ми не готові,” — озвався оператор.\n\n“Я сказала: ЗЙОМКУ!” — гримнула вона. Команда миттєво метушливо почала готувати обладнання. Шоутайм глибоко вдихнула. Сигнал — початок ефіру.\n\n“Сейфгейвен. Я сьогодні перед вами, щоб сказати одне... Я... мені шкода. Я бачила, як багато ми можемо досягти через наймані компанії Сейфгейвен, але втратила з поля зору людей і впала у жадібність. Я думала, що покращую життя всім — але насправді дбала тільки про еліту й себе. Це було неправильно. Дуже неправильно. Мені соромно. Я більше цього не дозволю. Відтепер я служитиму тільки народу. Я обіцяю, що доб’юся справедливості. Щоб ніхто більше не голодував. Щоб ми не просто виживали, а процвітали. Для всіх, кого я образила — мені дуже шкода. Дозвольте мені все виправити. Я винна вам це.”"
vsh_vault.33.a:0 "І багатство поширилось..."

vsh_vault.34.t:0 "Табун Відмовився!"
vsh_vault.34.d:0 "“ТВОЄГО БОГА, ЩО ТИ НАРОБИЛА?!” — вигукнула мер Шоутайм, злегка з розвагою, але в основному — розлючено. Було пізно вночі, і Шоутайм якраз збиралася піти, коли Мері влетіла до її офісу з немовлям на руках.\n\n“Я не думала, що вони відмовляться! Яка родина відмовляється платити викуп за власну дитину?!” — обурено відповіла Мері, все ще шокована тим, що її план провалився.\n\n“Ну от, вони відмовились! І тепер у нас є дочка наших ворогів. Вони знають, що ми її забрали, тож скоро прийдуть! І навіть не починай про те, куди ми її подінемо!” — Шоутайм вказала на Джой. “Я ЗАНАДТО ЗАЙНЯТА, щоб доглядати дитину! Можеш взяти її до себе, Мері?!” — глянула вона. Мері відкрила рота... але промовчала. “Я так і думала. Прийдеться здати її в притулок або ще кудись. Ми в лайні, Мері. Повному. Забирайся, мені треба думати.”\n\nМері мовчки, ніяково затиснувши дитину до грудей, пішла. Шоутайм тихо зітхнула й навіть посміхнулася, спостерігаючи за сценою. Вона вилаяла себе подумки. Що вона собі думала? Але часу на жалість не було — треба щось придумати. Можливо, ще не все втрачено. Та й дитина... була доволі мила."
vsh_vault.34.a:0 "Можеш жити в моїй кімнаті..."
