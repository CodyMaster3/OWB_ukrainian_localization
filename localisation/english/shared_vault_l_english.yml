  ###safehaven loc - leader desc
  VSH_MAYOR_SHOWTIME_NAME: "Мер Шоутайм"
  VSH_MAYOR_SHOWTIME_DESC: "Мер Шоутайм, названа так за свою звичку в дитинстві говорити "настав час шоу" (it's showtime), є найновішим представником, обраним об'єднаними громадами Сейфхейвену, щоб говорити від імені людей. У її очах горить вогник, вона вірить, що Сейфхейвен може бути силою добра не лише для своїх людей, але й для всієї пустки, і вона завжди готова вести переговори з тими, хто робить це можливим. Саме її рука стримала Велику Тисняву від перетину річки, і саме її рука нещодавно успішно керувала розграбуванням скарбів Мідлмарку -- але, з іншого боку, саме вона впустила Наглядачів, що не дуже подобається багатьом найманцям і злочинцям, які називають Сейфхейвен домом.\n\nЗвісно, вона може бути тією, хто зберігає мир -- або, принаймні, вона намагається це робити. Але вона втомилася від того, що жителі Сейфхейвену служать хлопчиками для биття, і починає розуміти більш жорстоких громадян, які закликають до війни. Вона навіть доходить до того, що озброює деяких мешканців, більш вразливих до хитрощів найманців, переконуючись, що якась зброя зникає, коли це потрібно -- а в Сейфхейвені є за чим стежити, коли справа доходить до зброї..."
  VSH_legacy_of_sierra: "Спадщина «Сьєрра-Готель»"

  VSH_MARY_MULLIGAN_NAME: "Мері Малліган"
  VSH_MARY_MULLIGAN_DESC: "§C«Сьєрра-Готель» повернувся, і ми жадаємо крові, крові тих, хто завдав шкоди Наглядачам. Ми клянемося відплатити за доброту Сейфхейвену вдесятеро, але спочатку в нас нова місія.§!\n\nПісля перемоги на нещодавно відновлених виборах у громаді Сейфхейвену, Мері Малліган та компанія «Сьєрра-Готель» були обрані громадянами, щоб повести їх у нове майбутнє, взявши владу у свої руки. Хоча багато хто в захваті від того, що їхня улюблена воєнізована організація марширує пусткою в ім'я "справедливості" та "відплати", невелика частина колишнього офісу мера боїться, що це рішення може приректи не лише тих, хто називає Сейфхейвен домом, але й Канадські прерії в цілому.\n\nМері прагне довести, що вони помиляються, принаймні по-своєму..."

  ###safehaven loc - Advisor names and desc.

  VSH_SHOWTIME_ADV_DESC:0 "“§YЗнаєте, я не зовсім впевнена, але думаю, що з'їла достатньо черевиків, щоб вирішувати, якою має бути уніформа.§!”\n\nМер Шоутайм була секретарем, усіма членами кабінету і прибиральницею під час свого короткого політичного перебування в Сейфхейвені, а тепер, після того як попередній мер помер від застуди, вона стала як найновішим, так і мером із найдовшим терміном перебування на посаді; цю посаду часто швидко звільняли заради вступу до прибуткових гільдій найманців, які називають легко експлуатовані системи Сейфхейвену своїм домом.\n\nВирісши в цій бідності, вона поклялася стерти її зі своєї нації — своїми руками чи чиїмись ще. Це означає, що вона вирішила залишити своє старе злочинне життя в минулому на осяжне майбутнє. Але з іншого боку, Сховище 107 і мало бути наповнене купою красномовних зрадників..."

  VSH_MARY_MULLIGAN_ADV_DESC:0 "§C“Що ви маєте на увазі, мер Шоутайм? Отруїти їхнє водопостачання було б більш ніж гуманно, е-е... дідько, добре — я пошукаю альтернативу.”§!\n\nХоча Мері Малліган із «Сьєрра-Готель» була не набагато більше ніж гільдією всередині Сейфхейвену, вона надала величезну допомогу меру Шоутайм, навчаючи її професійним методам, тактиці та належним процедурам тренувань, які використовували Наглядачі Білого до свого падіння, майже самотужки перетворивши Сейфхейвен із місця відпочинку найманців на націю з власною обороною.\n\nМер Шоутайм була вдячна за зусилля Мері, призначивши її своєю правою рукою в усіх справах, до великого незадоволення багатьох найманців, які називають ці землі домом подалі від поля бою; її заклик до об'єднання численних ополчень зіпсував стосунки Шоутайм зі своїм народом; проте робота Мері, принаймні на думку мера, спрямована на кращий, безпечніший і, що найважливіше, багатший Сейфхейвен для її людей, незалежно від того, чи вважає сама Мері це приводом для суперечок..."

  VSH_DON_SPANGLE_NAME:0 "Ґ. Дон Спенґл"
  VSH_DON_SPANGLE_DESC:0 "§Y“Своя людина — що це за лайно? Ні... Ні, мене звати Дональд... Але для тебе, малий, я Дідусь.”§!\n\nХоча колись він був великою і могутньою людиною, улюбленою багатьма злочинними сім'ями, створеними після заснування Сейфхейвену у сховищі, Дон покинув це життя, ставши більш-менш дідусем для сиріт північних пусток, наполягаючи на тому, щоб вони називали його саме так. Заснувавши безліч дитячих будинків по всьому Сейфхейвену, переслідуючи знищення работоргівлі, оплачуючи експедиції з пошуку зниклих дітей і загалом спрямовуючи дітей у краще майбутнє за допомогою освіти та турботи, він забезпечив їхній захист від темних районів Сейфхейвену та решти північного фронтиру. Для нього злочин — це не крадіжка, грабіж чи будь-яке інше рейдерське лайно; це позбавлення дітей їхнього дитинства або, що ще гірше, їхніх життів.\n\nДон не дуже багато знає про цих Наглядачів, але вони вбивають рейдерів та інших покидьків, які хочуть нашкодити Сейфхейвену та його дітям. Вони також утримують деякі «жорстокіші» гільдії від жахливих вчинків, тож у книзі Дона вони на вагу золота, особливо зважаючи на те, що їм подобається відвідувати дитячі будинки і навчати дітей ближньому бою та іншим речам, необхідним для виживання в сучасному світі. Хоча інколи вечорами, коли він напідпитку після того, як дітей вклали спати, і він сидить у одному зі своїх головних офісів, ви можете сісти поруч, і він скаже вам, що якби ці Наглядачі були поруч, його донька та її дитина були б живі, а ті покидьки стали б мертвим м'ясом; хоча на тверезу голову він відмовляється вдаватися в подробиці чи пояснювати, але що б не сталося того дня, це безперечно наставило Дідуся Спенґла на праведний шлях благодійності, яким він зараз іде..."

  VSH_GULL_BRUN_NAME:0 "Гуллівер Брансвік"
  VSH_GULL_BRUN_DESC:0 "§G“ТАК, МИ ОХУЄННІ! БОЙОВІ ПСИ РУЛЯТЬ! ТАК- Стоп, що? Ви знаєте, хто ми такі?”§!\n\nЧасто нечисленні, погано екіпіровані, а іноді й напрочуд розумні завдяки багатьом дитячим будинкам, створеним у Сейфхейвені, ополчення, які складають його сили, часто повні старих залишків якихось невдалих підприємств, що бажають передати свої ідеали молоді, часто розважаючи будь-яку бідну молоду людину, яку можуть знайти на виході з будинків Дона, обіцяючи багатство, владу або будь-що інше, чого ті можуть захотіти. Це, як і очікувалося, не приносить багато рекрутів, але деякі, такі як Бойові Пси, збирають навіть менше середнього: вони складаються щонайбільше з десяти-двадцяти старих і стають маловідомими, перетворюючись на щось на кшталт фан-клубу старих виродків, які розповідають одне одному вигадані казки про пригоди та згадують минуле. Пси відрізняються від звичайного ополчення тим, що вони йдуть добровольцями до збройних сил Сейфхейвену, і оскільки вони колись були улюбленим кланом, хоч і окультним, наявність лише їхнього імені, ймовірно, дає їм високу посаду, просто на підставі того, що керівництво бажає хоч іноді чути ім'я їхнього клану на полі бою заради спогадів, які воно приносить.\n\nГуллівер Брансвік, останній член Бойових Псів, не мав жодного уявлення, що це так, коли підписав контракт як єдиний рекрут, якого змогли знайти старі, що складали керівництво. Оскільки вони померли незабаром після його найму, він вирішив, що його навички найкраще послужать загальному благу. На його подив, їхня популярність забезпечила йому місце у вищому командуванні, і тепер він прагне зміцнити збройні сили Сейфхейвену; хоча він робить це не лише з доброти — він хоче знову зробити Бойових Псів визнаним ополченням, незалежно від того, чи означатиме це знищення націй у процесі..."

  ###safehaven loc - focus

  vsh_white_collar_life:0 "Життя білого комірця для мене"
  vsh_white_collar_life_desc:0 "В лайнюках бувають споріднені душі. Іноді."
  vsh_the_mark_expedition:0 "Експедиція Мідлмарк"
  vsh_the_mark_expedition_desc:0 "На захід від Саскачевану деякий час було тихо... Але, схоже, все знову розпалюється. Ми відправили туди кілька хлопців трохи раніше... Як у них справи?"
  vsh_community_development:0 "Розвиток громади"
  vsh_community_development_desc:0 "Люди в Сейфхейвені жадають співпраці. Зрештою, саме так ми тут і опинилися. Тому ми вирішили, е-е... Мер Шоутайм вирішила впустити Наглядачів, бо їх добряче пошматували й таке інше."
  vsh_the_peoples_militia:0 "Народне ополчення Сейфхейвену"
  vsh_the_peoples_militia_desc:0 "Якщо ви запитаєте будь-кого в барі Сейфхейвену, найкраще в цьому місці те, що кожен сам за себе. Жодних військових, жодного великого придурка, який би вказував тобі, що робити — окрім Мера, але всі люблять Мера Шоутайм. Кожен хлопець, якого ви бачите, є частиною армії."
  vsh_every_man_a_dog:0 "Кожній людині по собаці"
  vsh_every_man_a_dog_desc:0 "Кожен чоловік, жінка та дитина у володіннях Сейфхейвену повинні мати собаку, який може відчути, коли поганці вийшли на слід. Дамо кожному, хто хоче, новеньке цуценя!"
  vsh_emphasize_community:0 "Спільне життя"
  vsh_emphasize_community_desc:0 "Згідно з журналами Наглядача, експеримент, на який вони очікували, полягав у тому, що ми мали б сваритися, поки нічого не залишиться. Купка інтриганів, яких замкнули в ямі, просто щоб подивитися, що станеться. Але знаєте що? Коли у вас є пара щурів, замкнених у кімнаті з обмеженим простором і ресурсами, і всі вони хочуть вибратися... Виявляється, вони стають хорошою командою вцілілих."
  vsh_we_believe_in_each_other:0 "Ми віримо"
  vsh_we_believe_in_each_other_desc:0 "Сейфхейвен живиться тим фактом, що ми всі більш-менш на одній хвилі. Якщо ми втратимо це, ми станемо нічим — ми оточені лайном, якого не хочемо на своєму задньому дворі, тому ми стежимо, щоб воно туди не потрапило."
  vsh_peoples_coalition:0 "Майбутнє Сейфхейвену..?"
  vsh_peoples_coalition_desc:0 "§YЗ РОБОЧОГО СТОЛУ МЕРА ШОУТАЙМ.§!\n\nМи ростемо, давайте рости далі, ширше, сильніше. Найманці минулого? У них була правильна думка: гроші створюють силу, сила створює право, і народна коаліція повинна підтримувати те, що правильно. Це наша ініціатива, народна ініціатива."
  vsh_mark_scavenged:0 "Операція: Штовхачі візків"
  vsh_mark_scavenged_desc:0 "Залишки від ботів Пенні та їхнього обладнання можуть бути встановлені на наших найкращих бійців. Крім того, ці «партнери» насправді були дещо обдарованими, давайте подивимося, чи не зможемо ми посіяти трохи хаосу в наших серцях, га?"
  vsh_the_stampede_is_gone:0 "Копита затихли"
  vsh_the_stampede_is_gone_desc:0 "Виявляється, пара розлючених виродків з правильною кількістю надмірної вогневої міці можуть змінити ситуацію у світі, і багато людей зрозуміли це після того, як ми провели зачистку."
  vsh_kidnap_joy:0 "Операція: Кіллджой"
  vsh_kidnap_joy_desc:0 "У Мері є план — хоча вона не каже мені, в чому він полягає, лише те, що він зробить нас відомими. Вона ще не робила нам поганого, тож що найгірше може статися? — О, дідько, хіба Джой не дитина тих йобаних Стемпідів? Вона ж не збирається..."
  vsh_moosejaw_conquered:0 "Мисливська нагорода"
  vsh_moosejaw_conquered_desc:0 "Хоча ми довго дружили з цими миролюбцями, їм безпечніше насолоджуватися миром у межах наших кордонів."
  vsh_rad_hazards_conquered:0 "Сумні виродки"
  vsh_rad_hazards_conquered_desc:0 "Ті хлопці-гулі, у нас ніколи не було з ними проблем, і доки ми керуємо їхньою територією, вони вільні борсатися в радіоактивному мулі, який так люблять... Можливо, ми навіть зможемо попросити Ґаббу допомогти нам зробити вивіски..."
  vsh_old_friends:0 "Операція: Бумеранг"
  vsh_old_friends_desc:0 "Цього разу, можливо, Наглядачам варто повернутися з доповіддю..."
  vsh_operation_safe_house:0 "Операція: Безпечний дім"
  vsh_operation_safe_house_desc:0 "Наглядачі повернулися, і ми готові до помсти. Ті хлопці на півночі вже деякий час створюють безлад. Давайте підемо на них штурмом, покажемо їм, що Наглядачі не жартують."
  vsh_mark_miscounts:0 "Нові друзі Мідлмарку..."
  vsh_mark_miscounts_desc:0 "Деякі охоронці повідомили про активність на нашому східному кордоні, давайте розслідуємо."
  vsh_merc_homes:0 "Розправа з найманцями"
  vsh_merc_homes_desc:0 "Занадто довго ми дозволяли різноманітним арміям пустки використовувати наші мирні батьківщини як свої особисті ігрові майданчики. Настав час протистояти їм і вимагати, щоб вони виконували свій обов'язок так само, як і будь-який інший громадянин Сейфхейвену."
  vsh_miscount_muster:0 "Огляд Міскаунтів"
  vsh_miscount_muster_desc:0 "Пенні та Брат Блек здіймають галас, підштовхуючи декого з наших людей приєднатися до «Сьєрра-Готель»."
  vsh_attacking_the_stampede:0 "Вбити Стемпід"
  vsh_attacking_the_stampede_desc:0 "Операція: Електропоганяйло? Облиште ці наглядацькі штучки і давайте просто скажемо як є — застати Стемпід зненацька. Найкращий захист — це хороший напад, тож... давайте наб'ємо їм пики, поки вони не набили їх нам."
  vsh_ready_for_stampede:0 "Зупинити Стемпід"
  vsh_ready_for_stampede_desc:0 "Ми повинні встановити кілька аванпостів, щоб гіганти по той бік нашого кордону не застали нас зненацька — на добре чи на зле, ми вирішили залягти на дно."
  vsh_all_for_one:0 "Всі за одного..."
  vsh_all_for_one_desc:0 "Сьогодні перший із по-справжньому хороших днів у Сейфхейвені: ми очистили вулиці, здобули економічну стабільність і закріпили своє місце. Це заслуговує на парад, але не забуваймо про гіганта на нашому порозі. Можливо, нам варто звернути на це увагу і дозволити людям самим вирішити, що для них краще."
  vsh_wardens_takeover:0 "Операція: Дядько Сем"
  vsh_wardens_takeover_desc:0 "Настав час зробити справу, тепер за підтримки Мера Шоутайм. Ряди «Сьєрра-Готель» поповнюються, ми готові до нових дій. Отже, не питай, що Наглядачі можуть зробити для тебе, Сейфхейвен, а питай, що ти можеш зробити для Наглядачів і Тітоньки Мері! УУ-РА!"
  vsh_middle_dues:0 "Операція: Обслуговування клієнтів"
  vsh_middle_dues_desc:0 "Занадто довго Міскаунти були більмом на оці людей, давайте викорінимо їх із цих земель, можливо, востаннє. Це, сподіваємось, дасть людям на околицях Мідлмарку деяку надію на нас, відкриваючи шлях нашим дипломатам переконати їх забезпечити виконання нашої волі на їхніх рідних землях."
  vsh_foxtrot_uniform:0 "Операція: Фокстрот Юніформ"
  vsh_foxtrot_uniform_desc:0 "Хороші новини! Або, можливо, складні новини? Інші Наглядачі уникнули падіння Сіетла — «Фокстрот Юніформ», святоші нашої маленької операції. Між нами призначено зустріч, сподіваємось, усе пройде добре..."
  vsh_operation_cold_opening:0 "Операція: Холодний старт"
  vsh_operation_cold_opening_desc:0 "Настав час утвердитися як єдині Наглядачі, не лише Сейфхейвену, а й усього регіону. Нам також потрібно встановити наземне сполучення зі входом до Вашингтона, якщо ми сподіваємося зробити внесок у справу Наглядачів."
  vsh_operation_seattle_sunset:0 "Операція: Захід сонця в Сіетлі"
  vsh_operation_seattle_sunset_desc:0 "§CЗ РОБОЧОГО СТОЛУ МЕРІ МАЛЛІГАН.§!\n\nНастав час відібрати Сіетл у того Братства і йобаних дикунів. Цим усе сказано."
  vsh_operation_head_home:0 "Операція: Час вечеряти"
  vsh_operation_head_home_desc:0 "Тепер, коли ми довели, що гідні повернутися додому, і кинули їм голову як вибачення за дезертирство, нам час повертатися додому. Сподіваємось, до розпростертих обіймів і холодних сердець."
  vsh_operation_gyst:0 "Операція: З.Л.Д."
  vsh_operation_gyst_desc:0 "З.Л.Д., га? Збери Лайно Докупи. Мені подобається, як це звучить; настав час Канаді дізнатися, хто є справжніми героями. Їй-богу, ми доведемо, що ми справжні герої, давайте знищимо ту тупу робота-суку та її цуценят-міскаунтів. Одразу після того, як приведемо свої справи до ладу, Сейфхейвен зрозуміє, що зробив правильний вибір, обравши нас."
  vsh_operation_kicking_stampede:0 "Операція: Копнути Коня"
  vsh_operation_kicking_stampede_desc:0 "Чуваки з Сейфхейвену постійно ниють про Стемпід і про те, що ми ще не поклали край їхній тиранії чи щось таке. Давайте розберемося з цим, перш ніж це стане ще більшим головним болем. Не кажучи вже про те, що я втомилася час від часу вступати в кінське лайно."
  vsh_one_for_all:0 "Один за всіх!"
  vsh_one_for_all_desc:0 "Мері виграла всенародне голосування на виборах, організованих ополченням! Відтепер ми робимо те, що вона вважає за краще, і вона обіцяє, що має на меті найкращі інтереси для нас та кожного волелюбного скурвого сина!"
  vsh_a_new_beginning:0 "Повернення до основ"
  vsh_a_new_beginning_desc:0 "Нам потрібно переоцінити системи та доктрини, які ми використовуємо як Наглядачі... напевно, добре, що ми встановлюємо, що ми в першу чергу громадяни Сейфхейвену, але не завадить зберегти ім'я Наглядачів ще трохи... Пра?"
  vsh_knowledge_exchange:0 "Уроки від Роккі Маунтейнірс"
  vsh_knowledge_exchange_desc:0 "Боже мій, родзинки... такі смачні..."
  vsh_protection_without_a_fee:0 "Забезпечення захисту безкоштовно"
  vsh_protection_without_a_fee_desc:0 "Бути найманцем переоцінено, люди швидше будуть жити щасливо, якщо знатимуть, що їхні хлопці підтримують їх за кришки чи без них, і хто ми, як не їхні друзі?"
  vsh_wardens_of_canada:0 "Допомагаємо людям там, де їх знаходимо"
  vsh_wardens_of_canada_desc:0 "Ми вже деякий час практикуємо мир, але можемо зробити багато хорошого, розібравшись із деякими з наших похмуріших сусідів заради їхнього звільнення від гноблення чи інших мудацьких правил."
  vsh_operation_rally:0 "Операція: Мітинги"
  vsh_operation_rally_desc:0 "Хоча вибори дещо зіпсували стосунки між Наглядачами та Шоутайм, вони все ще дуже зацікавлені в досягненні мети співпраці. Мерія та «Сьєрра-Готель» разом розробили план, який мав би вдесятеро збільшити наші політичні здобутки — мітинги!"
  vsh_showtime:0 "Настав час шоу!"
  vsh_showtime_desc:0 "Шоутайм вирішила, що настав час перестати боятися! Давайте більше не ховатися в бункерах і містах! Ми не будемо хлопчиками для биття, поки на кону наші життя!"
  vsh_empty_fields:0 "Порожні поля"
  vsh_empty_fields_desc:0 "Готово, ми перемогли пару. Але вони не погані люди, просто налякані. Давайте віддамо їм їхніх коней і відпустимо, заради того, щоб показати нашим людям, як виглядає справжня справедливість..."
  vsh_government_time:0 "Сейфхейвен для всіх"
  vsh_government_time_desc:0 "§YЗ РОБОЧОГО СТОЛУ МЕРА ШОУТАЙМ.§!\n\nТепер, коли ми завою... поширили свободу заради миру простих людей, давайте допоможемо принести її всюди, заради кращого майбутнього, кращого Сейфхейвену."
  vsh_this_side_of_the_river:0 "По цей бік річки"
  vsh_this_side_of_the_river_desc:0 "Давайте зміцнимо тут умови життя, зробивши Сейфхейвен ще сильнішим."
  vsh_miscount_discount:0 "Знижка на Міскаунтів!"
  vsh_miscount_discount_desc:0 "Настав час знизити ці ціни. Після тривалих дискусій між собою про те, чи є Мідлмарк потенційним союзником, їхня ненависть до Наглядачів, а отже, і до нас, жителів Сейфхейвену, знову і знову доводить, що Міскаунти не можуть відмовитися від своєї образи. Заради безпеки Сейфхейвену ми йдемо на війну. Крім того, мати під контролем останній автоматизований супермаркет було б дуже круто..."
  vsh_recruitment_hub:0 "Центр вербування найманців"
  vsh_recruitment_hub_desc:0 "Підписавши цю поправку як закон (хоча це не має великого значення, оскільки мер тепер має абсолютну владу), найманці тепер можуть підписувати контракти на службу під контролем найманців SH — організації, що займається забезпеченням їхньої безпеки та засобів до існування, відрізаючи трохи зверху."
  vsh_moving_back_into_offices:0 "Відродження Корпорації Мідлмарк"
  vsh_moving_back_into_offices_desc:0 "Сьогодні гарний день, декому з наших колишніх вчених зі сховища вдалося перепрограмувати Пенні та її роботів, і завдяки цьому ми зможемо відродити корпорацію, щоб керувати не іншими людьми, а роботами. Так, як і має бути... бо ну його нахуй працювати в торговому центрі."
  vsh_only_one_mercenary:0 "Монополізація найманців"
  vsh_only_one_mercenary_desc:0 "У цій частині континенту не вистачить бабла для нас обох, друже. До того ж, хіба ти не хотів би працювати під крилом SH? Шоутайм вирішила, що в наших інтересах знищити конкурентів, поки ми на підйомі, ймовірно, так буде найкраще."
  vsh_put_them_on_our_payroll:0 "Візьміть їх у наш штат"
  vsh_put_them_on_our_payroll_desc:0 "Найнявши деяких колишніх найманців виконувати роль окупантів, ми зможемо вбити двох зайців одним пострілом, а також забезпечити лояльність на їхніх землях."

  #safehaven tooltips

  stampede_coring_tt_vsh:0 "Ми отримаємо §Gзниження вартості створення національної території§! на землях §Y[STA.GetNameWithFlag]§!!"
  safehaven_formable_tt:0 "§GМи зможемо сформувати §YІніціативу Сейфхейвен§!§!!"
  safehaven_conquest_mjw_tt:0 "Ми повинні §Rзавоювати§! землі §G[MJW.GetNameWithFlag]§!, щоб це мало ефект!"
  safehaven_conquest_ura_tt:0 "Ми повинні §Rзавоювати§! землі §G[URA.GetNameWithFlag]§!, щоб це мало ефект!"
  safehaven_town_decisions_tt:0 "§GПеретворення Сейфхейвену на економічний центр за допомогою рішень видалить це.§!"
  vsh_merc_caps_tt:0 "§GОтримує 85 тис. кришок як оплату під час відправлення добровольців!§!"
  VSH_city_8:0 "§YСейфхейвен§! було §GПобудовано з нуля§!!"
  vsh_ward_decisions_tt:0 "§CМи розблокуємо рішення для відбудови Наглядачів Білого у Вашингтоні!§!"
  midmark_tt:0 "§RМи отримаємо національні території на Калгарі та наші прикордонні провінції, ціною постійного усунення Міскаунтів, а також тих, хто їх підтримує.§!"
  vsh_rebuilding_safehaven_tt:0 "Розблоковує £decision_icon_small §YРішення§! для початку §GВідбудови§! того, що залишилося від §YСховища 107§!, у місто §YСейфхейвен§!."
  vsh_spawn_alpha_squad_tt:0 "Створює §G1§! дивізію §YСпецпризначенців§!."
  VSH_sh_mercs_tt:0 "§GМи отримаємо рішення, на які зможемо витрачати свої кришки!§!"
  sh_building_gui_active:0 "§YСистема будівництва§!"
  vsh_building_tt:0 "§GМи розблокуємо спеціальну £decision_icon_small §YВкладку§! у випадному меню, під стрілкою у верхньому лівому куті!§! "
  vsh_warden_friendly:0 "Дружні до Наглядачів"
  vsh_building_decision_one:0 "Наразі вже будується"
  vsh_building_decision_two:0 "Наразі вже будується"
  vsh_building_decision_three:0 "Наразі вже будується"
  vsh_has_built_all_other_buildings_tt:0 "Ми побудували міцну міську структуру!"
  VSH_BIG_CAPS_TT:0 "§YПОВІДОМЛЕННЯ ВАЛТ-ТЕК§!: РОЗУМНОМУ ЖИТЕЛЮ ВАРТО §RЗБЕРЕГТИ ВСІ КРИШКИ, ЯКІ ТІЛЬКИ МОЖНА§!, ЩОБ ВИПРАВИТИ ЦЕ!"
  vsh_warden_recruitment_tt:0 "Наш поточний §YЗакон про призов§! буде замінено на:"



  ###ideas

  vsh_mutual_wants:0 "Спільні бажання"
  vsh_wardens_on_point:0 "Наглядачі далеко від дому"
  vsh_wardens_on_point_desc:0 "Мері Малліган та її Наглядачі прибули з Вашингтона в шаленстві, раз у раз озираючись через плече. Рейдери, які мали до них претензії, та мандрівні члени Вашингтонського Братства були скрізь, і без можливості зв'язатися з Джуліусом, вона та її загін були розділені, зрештою перетинаючи Скелясті гори. Ті, кого не забрали глибше на землі Мідлмарку, дісталися Сейфхейвену, де тепер вони діють як своєрідна незначна 'гільдія' серед багатьох ополченців.\n\n«Сьєрра-Готель», назва роти Мері, була серед експериментальних сил спеціального призначення сил Наглядачів. Хоча вони навіть не були в Сіетлі, коли сталася Восьмигодинна війна — факт, якого рота соромиться. Сподіваючись завербувати якомога більше юнаків із палаючими очима, ослаблений «Сьєрра-Готель» вдався до більш традиційних тактик Наглядачів, щоб полегшити тренування."
  vsh_lockdown:0 "Тісно згуртована спільнота"
  vsh_lockdown_desc:0 "Між Сховищем і різними зв'язками, налагодженими між сім'ями та групами, розкиданими по всьому регіону, кожен знає когось, хто може допомогти. Оскільки Стемпід ставала все більшою й більшою, багато з цих людей стали ближчими та параноїдальними в страху перед гігантом на їхньому порозі.\n\nЗвісно, із цим зростанням напруги в ополченні, все більше і більше людей починають звертатися до Наглядачів..."
  vsh_taking_after_mercs:0 "Беручи приклад з найманців"
  vsh_taking_after_mercs_desc:0 "Після багатьох років економічної безплідності через ополчення та найманців, які називають це місце домом, Наглядачі, які прибули сюди, придумали чудову ідею — взяти сторінку з їхнього підручника!"
  vsh_building_a_home:0 "Будівництво дому"
  vsh_building_a_home_desc:0 "Після виходу зі сховища жителі 107-го взяли на себе завдання відновити Сейфхейвен, запрошуючи сусідні міста приєднатися до них. Якийсь час це мало великий успіх, оскільки жителі сховища були особливо талановитими переговірниками. Це призвело до того, що Сейфхейвен став одним із останніх районів у Канадських преріях, який не зазнав жодних хвилювань чи потрясінь, ненавмисно привертаючи увагу багатьох ополчень та заблукалих найманців, які шукали дім подалі від очей тих, кому вони продали свою зброю. Це, у свою чергу, позбавило Сейфхейвен значної частини торгівлі, яку він сподівався залучити."
  vsh_building_a_home_2:0 "Будівництво дому"
  vsh_building_a_home_2_desc:0 "Тепер контролюючи значну частину торгівлі водою в Канадських преріях, Сейфхейвен нарешті скидає з себе тягар слабкої економічної системи, яку експлуатували його багаті відвідувачі."
  VSH_safehaven_grandpa:0 "Дідусь Сейфхейвену"
  VSH_forgotten_militiaman:0 "Забутий ополченець"
  VSH_sierra_hotel:0 "§CСьєрра-Готель§!"
  vsh_rallies:0 "Мітинги!"
  vsh_rallies_desc:0 "Щомісяця Наглядачі та мерія Сейфхейвену організовують мітинг для посилення підтримки, що стає невід'ємною частиною громади."
  vsh_full_mercs:0 "Фінансовані державою найманці"
  vsh_full_mercs_desc:0 "Маючи команди найманців вже кілька років, нова ініціатива Сейфхейвену полягає в самофінансуванні за рахунок цих куплених експедицій, що, в свою чергу, робить його в очах пустки керованою найманцями республікою, придатною лише для одного — кровопролиття ваших ворогів. Тобто, якщо у вас є кришки, щоб це влаштувати."
  vsh_sh_company:0 "Рота «Шитхед» (Shithead)"
  vsh_sh_company_desc:0 "До падіння Наглядачів ходив жарт про «ідіотів» у «Сьєрра-Готель», фанатичній роті, яка хоче бути спецназом, як розповідали б жорстокіші Наглядачі; що, коли ми отримували нашу назву від Брандта багато років тому, він сказав Shithead (Лайноголовий), а нам просто почулося. Нещодавно цей жарт замінили на більш добрий. «Можливо, вони були достатньо дурні, щоб пропустити перевал або стару країну, але жодна інша рота не була б достатньо крутою, щоб створити цілий новий орден і відрубати голову тому виродку-ченцю». Зайве казати, рота «Шитхед» стала набагато популярнішою серед нових рекрутів Наглядачів."
  vsh_altruism:0 "Альтруїзм для всіх"
  vsh_altruism_desc:0 "Ми справді маємо це на увазі, ми хочемо найкращого для втомлених душ пустки, які знаходять шлях додому до нас, тих, кого відкинули її труднощі і хто шукає тепла та самовдосконалення. Так само, як ми, Наглядачі, колись шукали надійну гавань, ми тепер відплатимо добром, пліч-о-пліч з жителями Хейвену."
  vsh_showtime_idea:0 "Настав час шоу!"
  vsh_showtime_idea_desc:0 "Заохочення Шоутайм до систем найманців призвело до того, що основною професією більшості громадян Сейфхейвену стала робота найманця. На жаль, за іронією долі це означає, що вона відновила урядову модель «дім подалі від поля бою», до якої нелегальні жителі-найманці змусили жителів сховища вдатися всі ті роки тому, під час заснування Сейфхейвену. Провал у її власних очах, але, безумовно, і благо, оскільки тепер його мешканці дуже багаті завдяки тому, що їх залучено до цього. Тож продовжуйте, норовливі солдати, дім чекає на вас."
  vsh_showtimes_help:0 "Подвійна система мерії"
  vsh_showtimes_help_desc:0 "Після реформування Наглядачів у Мері виникла думка: можливо, ця робота призначена не лише для мене, а й для моєї найкращої подруги. І тому вона обрала Шоутайм, щоб та приєдналася до неї як співмер-командир Сейфхейвену. Найкращі подруги назавжди."
  VSH_does_it_all:0 "Робить усе!"
  vsh_friends_of_liberty:0 "Друзі свободи"
  decision_cost_1k_mp:0 "£manpower1_texticon §G1 тис. людських ресурсів§!"
  decision_cost_1k_mp_blocked:0 "£manpower1_texticon §R1 тис. людських ресурсів§!"
  decision_cost_1k_mp_tooltip:0 "Прийняття рішення коштує £manpower1_texticon §Y1 тис. людських ресурсів§!"

  ###safehaven events

  vsh_vault.1.t:0 "Спадщина білих комірців"
  vsh_vault.1.d:0 "Сейфхейвен завжди називали «містом шахраїв» або «лігвом усміхнених злодіїв», але для людей, які в ньому живуть, це храм.\n\nДля жителів Сховища 107 це було місце, де вони перетворили жах на можливість.\n\nНевдовзі після падіння бомб Наглядач Малколм Вудс прояснив мету Сховища його мешканцям. Експеримент полягав у тому, щоб зібрати разом купу «білих комірців» з кримінальними нахилами та «схематозників», і подивитися, як швидко вони перегризуться.\n\nХоча спочатку був шок, жителі Сховища швидко розібралися між собою, сформувавши власні системи і навіть розпочавши вилазки в канадські заметілі. Та розважлива хитрість, завдяки якій вони опинилися у Сховищі 107, ставала в нагоді раз за разом, коли справа доходила до жителів пусток.\n\nЗрештою двері сховища відчинилися і більше не зачинялися. Так 107-ме стало надійною гаванню, маяком світла на безсонячному фронтирі як для мандрівників, так і для розбійників. З часом навколо нього в оболонках міст Старого Світу утворилися громади, і вони також понесли прапор Сейфхейвену."
  vsh_vault.1.a:0 "Громада для всіх."

  vsh_vault.2.t:0 "Історії про привидів"
  vsh_vault.2.d:0 "Всі ми знаємо про те, що відбувається на заході, біля старого Калгарі — торговий центр, яким керує торговий ШІ на ім'я Пенні, укомплектований роботами в достатку.\nМоторошні виродки, хоча й милі, ну, як для розумного магазину — дозволяють усім, хто добре поводиться, робити покупки, зберігаючи в собі частинку того процвітання, яке відчували ті старі пердуни зі Старого Світу до падіння бомб. Це досить гарне місце, і кожен хоче контролювати цю частку, що призводить до історично ворожих тенденцій з боку роботів-працівників.\n\nМи, так само як і інші засранці, що дивляться на сяючі вогні торгового центру холодними ночами, хочемо отримати трохи того процвітання всередині. Оскільки останнім часом там стало тихо, ми горіли бажанням організувати експедицію, щоб навідатися туди, але, на жаль, багато місцевих компаній занадто боягузливі для такої подорожі. На щастя, спецпризначенці зі «Сьєрра-Готель» зголосилися розвідати територію і з'ясувати, що ж там відбувається. Навіть незважаючи на те, що чутки про повернення їхніх старих ворогів, Міскаунтів, змушують їх нервувати. Минуло вже кілька тижнів відтоді, як ми мали від них звістку, і Мері побоюється, що з членами її роти могло статися найгірше..."
  vsh_vault.2.a:0 "Яке радісне місце."

  vsh_vault.3.t:0 "Вони прийшли зі старого Вашингтона"
  vsh_vault.3.d:0 "Вони називали себе «Наглядачами Білого». Одягнені в старе, пошарпане спорядження ПВК, з голосами, хрипкими, як у літньої жаби, вони прийшли шукати притулку від пусток. За їхніми словами, їхнє старе місце було вщент рознесене якимись хлопцями на кшталт тих, що в Монтані.\n\nМері Малліган — їхня головна. Вони далекі від найприємніших людей у Сейфхейвені, а дехто навіть заходить так далеко, що називає їх «підступними» або «лукавими», але поки що це не завдало нам жодних клопотів.\n\nПроте, з їхньою допомогою колись бідна і слабка виключно добровольча урядова система стає на шлях перетворення на силу, яку справді варто підтримувати в Сейфхейвені, а не на прославлену службу доставки повідомлень, якою керують другосортні найманці."
  vsh_vault.3.a:0 "Будемо сподіватися, що ніхто не затіє божевільну змову."

  vsh_vault.4.t:0 "Більше, ніж просто перешкоди"
  vsh_vault.4.d:0 "Сьогодні по старих раціях Наглядачів пролунав тріск, що викликав неабиякий ажіотаж серед них. «Ми повернулися, Вашингтон...» — пролунало між сплесками перешкод, після чого послідували виклики різних назв загонів.\n\nДехто одразу почав припускати, що Наглядачі відродилися в Сіетлі, але у Малліган інші думки. Вони не можуть повернутися. Принаймні поки що. Є важливіші справи, і Сейфхейвен — саме те місце, де можна отримати ресурси для цього."
  vsh_vault.4.a:0 "Подивимось, що з цього вийде!"

  vsh_vault.5.t:0 "Возз'єднання Наглядачів"
  vsh_vault.5.d:0 "БРАНДТ: Радий бачити вас цілою і неушкодженою, Малліган. Ми сумували за вами.\n\nМАЛЛІГАН: Рада повернутися, сер.\n\nБРАНДТ: Сподіваюся, ваш час у Канаді пішов вам на користь, хоча сумніваюся, що стрибати з одного Сховища в інше було вам до вподоби. Готові повернутися до справ?\n\nМАЛЛІГАН: Більш ніж готова, сер.\n\nБРАНДТ: Добре. Бачить Бог, нам треба прибрати страшенний безлад."
  vsh_vault.5.a:0 "Наглядачі тримаються разом."

  vsh_vault.6.t:0 "Вона зробила що?"
  vsh_vault.6.d:0 "Раніше сьогодні на стіл мера Шоутайм ліг звіт у форматі, дуже схожому на документи, що подавала Мері, але з поспіхом намальованим символом «Сьєрра-Готель», який Шоутайм впізнала як той самий, що прикрашає нашивки роти. Заголовок «Операція: Кіллджой» вселив страх у серце мера, оскільки вона чула новину про новонароджену доньку пари, що править Великим Стемпідом: Джой.\n\nНа щастя, схильність Мері до поганих назв заради каламбурів збереглася — справжньою метою цієї операції був план викрадення новонародженої принцеси заради викупу, на велике полегшення мера.\n\nПісля подальшого читання в голові Шоутайм залишилося лише збентеження — збентеження з приводу того, чому Мері вирішила влаштувати цю силову гру. Вона вирішила, що це збентеження не має сенсу, оскільки ситуація вже була в руках, які не належали їй: а саме в руках «Сьєрра-Готель».\n\nОчевидно, вони вимагатимуть території на північ від нашого річкового кордону в обмін на повернення доньки — вірний спосіб підготувати хорошу лінію для атаки, якщо ми вступимо у війну."
  vsh_vault.6.a:0 "Мері вже зробила свою ставку."

  vsh_vault.7.t:0 "Повернення експедиції"
  vsh_vault.7.d:0 "Загін «Альфа» з наших експедицій, відправлених на розвідку до Мідлмарку, повернувся, принісши з собою моторошну розповідь про роботів, рейдерів і втрату «Бети», а також загону «Омега»...\n\nВони доповіли, що відносно легко дісталися Калгарі, помітивши відносну відсутність патрулів у містах, які нібито підпадають під логотип ММ, і за допомогою Наглядачів, не пов'язаних із «Сьєрра-Готель», переховувалися по всій території. Забравшись на дах торгового центру, вони побачили крізь світлові люки величезну комерційну зону з настінними екранами, що транслювали їхнього ШІ-лідера, і дешевими підробками сек'юритронів Роб-Ко, що роз'їжджали навколо. Звичне видовище, аж поки рейдери, прикрашені магазинним мерчем, не ввалилися до соціального центру, ненавмисно руйнуючи вітрини і вимахуючи зброєю, вітаючи і скандуючи «Пенні».\n\nПридивившись уважніше, лідер експедиційної групи, ветеран рейдерських війн, впізнав у цій банді Міскаунтів, але не раніше, ніж численні камери спостереження за територією помітили загони, і банда загнала їх у кут, не залишивши їм іншого вибору, окрім як дременути назад до Наглядачів, що переховувалися, по-дурному викривши їхню базу Міскаунтам. Загін «Альфа» вирішив тікати, а не битися, ставши єдиним загоном, якому вдалося уникнути загибелі, що чекала на розвідників.\n\nЦе послабило «Сьєрра-Готель», залишивши лише жменьку перших членів на чолі роти. Міс Малліган сприйняла це недобре, ставши майже мстивою, і благаючи мера Шоутайм завдати удару у відповідь якомога швидше. Шоутайм відповідає їй, що війна з 'марком зараз неможлива через їхні зв'язки, що дуже не подобається Мері, адже вона стверджує, що їхній справжній ворог — не Стемпід, а знаходиться по той бік річки, у супермаркеті Калгарі..."
  vsh_vault.7.a:0 "Міскаунти."

  vsh_vault.8.t:0 "Шоу"
  vsh_vault.8.d:0 "Найманці завжди були постійним більмом на оці Сейфхейвену. Вони постійно були присутні в Сейфхейвені, як метелики біля вогню. Він став їхнім так званим «домом подалі від поля бою».\n\nШоутайм було досить, вона згадувала свою юність у дитячих будинках, голодна — навіть голодніша за інших дітей, вдаючись до дрібних крадіжок, щоб прогодувати себе, завдаючи шкоди лише своїм же жителям Хейвену, кричачи «настав час шоу» в надії, що якийсь найманець посміється і кине їй кришку-другу. Ці спогади викликали лють.\n\nЦя операція вимагала ретельної підготовки, а детальні планування з'їдали час як у Шоутайм, так і у Мері, але результат мав перевершити всі очікування. Мері та її Наглядачі мали взяти штурмом клуб найманців словом або кулею. Як тільки вони опиняться всередині, увійде Шоутайм і почне розмову. Так чи інакше найманці заспівають під її дудку, питання лише в тому, як? У неї було дві ідеї. Вона могла б підлеститися до них, заявити, що вони життєво необхідні для безпеки нації, і благати їх записатися до армії як елітні сили оборони, подібні до Наглядачів, або ж вона могла б просто погрозами змусити їх робити по-її, використовуючи Наглядачів як важіль впливу. Обидва варіанти мали свої переваги, але ситуація була делікатною, і вона не могла дозволити собі облажатися, хоча сама думка про те, щоб знову принижуватися, залишала гіркий присмак у роті..."
  vsh_vault.8.a:0 "§RДосить розмов.§!"
  vsh_vault.8.b:0 "§BНастав час шоу.§!"

  vsh_vault.9.t:0 "Оплата"
  vsh_vault.9.d:0 "Ми отримали оплату за відправку добровольців!"
  vsh_vault.9.a:0 "Ура!"

  vsh_vault.10.t:0 "Відбудоване місто, врятований дім"
  vsh_vault.10.d:0 "Раніше про Сейфхейвен ходив жарт. «Найманці змушують їх платити за захист, але захист від кого? Хто захоче завойовувати цю діру?». Що ж, тепер все інакше. Замість ледачих і корумпованих найманців у нас є повноцінні сили оборони, які допомагають людям. Замість розбитих халуп і порожніх тарілок у нас є нормальні будинки і розвинуте сільське господарство.\n\nСейфхейвен став справді цивілізованим місцем, чимось схожим на Брендон чи Шейді-Сендс, але зі своїм власним шармом. Хто знав, що на замерзлих і суворих рівнинах Канади може з'явитися таке тепле місце? Нація, сповнена найманців-доброчинців, зосереджених на допомозі людям навколо і боротьбі з поганцями. Він справді став місцем, за яке варто боротися, надійною гаванню для слабких, подалі від злих. Принаймні, тих, кого люди вважають злими..."
  vsh_vault.10.a:0 "Отже, надійна гавань?"

  vsh_vault.11.t:0 "Святкування!"
  vsh_vault.11.d:0 "Шоутайм відчувала лише гордість і надію у своєму серці, дивлячись на натовп перед собою. Десять чоловіків стояли на сцені разом із Шоутайм і Мері, а ще двісті зібралися навколо, щоб подивитися на церемонію нагородження. Викликали кожного по імені, щоб вручити медаль за відмінну і доблесну службу у війні проти Великого Стемпіду; глядачі бурхливо аплодували щоразу, коли вручали медаль. Люди нарешті могли дихати вільніше, коли Великий Стемпід більше не дихав їм у потилицю.\n\nШоутайм підійшла до трибуни, готова виголосити свою заключну промову. «Ми зробили те, що багато хто вважав неможливим. Ми знищили гіганта Альберти, звільнивши його народ. Ми довели пустці, ми довели, що модель Сейфхейвену працює. Що вона продовжуватиме працювати в осяжному майбутньому. Ми будемо продовжувати зміцнювати себе і захищати один одного від зла!» — гордо вигукнула Шоутайм під схвальні вигуки глядачів. Вона сяяла, дивлячись на натовп, і її ентузіазм був заразливим.\n\n«А як щодо мого чоловіка!? Де був його захист!?» — пролунав голос із натовпу. Шоутайм спохмурніла, не знаючи, як саме відповісти. До неї приєдналися ще кілька голосів. «Ви стоїте тут і роздаєте медалі цим солдатам, коли абсолютно ясно, що цю війну для нас виграли Наглядачі! Вони єдині люди тут, які справді щось роблять!». Насмішки та вигуки продовжували лунати, зрештою злившись у багаторазове «Нехай правлять Наглядачі!». Шоутайм подивилася на Мері, яка також здавалася здивованою тим, що відбувається. Вона вийшла вперед і звернулася до глядачів.\n\n«Наглядачі завжди прагнули підтримувати всіх вас. Якщо це справді воля народу, щоб ми взяли контроль у свої руки, я вийду вперед і візьму на себе роль Мера!» — сказала Мері. У відповідь пролунали оплески деяких присутніх у натовпі. «Небезпека підстерігає нас звідусіль і всередині нашої землі. Ми змогли зупинити лише одну загрозу. Вони посміхаються нам зараз, але коли ми повернемося спиною, саме тоді вони дістануть кинджал. Не повинно бути ніяких компромісів, ніяких дебатів і ніяких переговорів. Ми зможемо відчути справжній мир лише тоді, коли знищимо наших ворогів. Якщо ви довірите мені цю владу, я не знатиму спокою, поки це не буде зроблено! Хто зі мною?» — крикнула Мері до глядачів, на що у відповідь вона отримала..."
  vsh_vault.11.a:0 "Радісні вигуки. "
  vsh_vault.11.b:0 "Відносну тишу."

  vsh_vault.12.t:0 "Старі спогади"
  vsh_vault.12.d:0 "Хвилювання охопило Мері, коли вона отримала шанс «розправитися з деякими дисидентами». Минуло чимало часу відтоді, як вона востаннє комусь добряче врізала, і їй нетерпілося це зробити. Швидко зібравши кількох інших Наглядачів, вона вирушила до центру Сейфхейвену, де знаходилися протестувальники. Вони прибули на місце протягом тридцяти хвилин після виклику. Настав час зіграти у поганого копа.\n\n«Вони стоять прямо за річкою! У будь-який момент вони можуть завдати удару, а ми просто дозволяємо їм вільно блукати! Як це може бути безпечно?!» — кричала молода жінка до великого натовпу. Мері швидко втрутилася, готова покласти цьому край. Вона попрямувала до жінки, збираючись її заарештувати.\n\n«Припини свій протест і йди тихо, або ж...» — сказала Мері, височіючи над молодою дівчиною. «Я не вірю в це. Я говорю про мерзенних рейдерів по той бік наших кордонів. Великого ворога Наглядачів, а ви хочете мене зупинити? Невже Наглядачі стали м'якотілими?!» — крикнула молода жінка на Мері.\n\nМері завагалася, на її обличчі з'явився насуплений вираз. Слова дівчини не були цілком неправдивими. Міскаунти були брудними сучими синами, і їхня близькість означала, що вони могли завдати удару в будь-який момент.\n\n«Як тебе звати, дівчинко?» — запитала Мері. «Софія. Сейфхейвен — мій дім, я просто хочу бачити його в безпеці. Ви, як Наглядач, ви розумієте, так?» — благала Софія. Мері мовчала. Спогади минулого життя нахлинули на неї. Вона схопила Софію за руку і підняла її вгору.\n\n«Тоді, Софіє, нехай про це дізнаються всі! Ти маєш рацію. Небезпека чатує навколо нас, готова завдати удару в будь-який момент. Наглядачі стоять поруч із вами і народом. Ми не можемо дозволити цій небезпеці вільно існувати! Тільки не тоді, коли ми маємо силу їх знищити!» — вигукнула Мері, звертаючись до натовпу перед нею.\n\n«Ми вдаримо, ми будемо битися. Ми не зупинимося, поки ця мерзота не буде стерта з лиця землі! Капіталістичний ШІ та його рейдерські посіпаки не рівня Наглядачам. Я обіцяю вам, що ми їх знищимо!» — кричала Мері в натовп, відчуваючи прилив адреналіну.\n\nПомста завжди була приємним почуттям, а в поєднанні з перетворенням її нового дому на безпечніше місце? Мері ця ідея дуже сподобалася. У Шоутайм могли бути свої сумніви, але Мері мала повну віру і впевненість у здібностях своїх Наглядачів. Мідлмарк і гадки не мав, що насувається. "
  vsh_vault.12.a:0 "Готуйте гвинтівки."

  vsh_vault.13.t:0 "Міскаунти знищені"
  vsh_vault.13.d:0 "Мері так сильно любила помсту. Задоволення від знищення ворога, дивлячись йому в очі, коли він розуміє, що програв. Вона обожнювала це. Наглядачі розгромили Міскаунтів і Пенні. Зараз вони якраз були посеред процесу збору кожного Міскаунта для страти. Її рука стискала горло Міскаунта, їй залишалося тільки стиснути сильніше. Кровна ворожнеча нарешті буде врегульована, але все ж, маленьке нав'язливе почуття гризло мозок Мері — вагання. Це злило її до неможливості, але вона не могла позбутися цього відчуття. Це була не жалість, вона ненавиділа Міскаунтів. Це її любов до Наглядачів зупиняла її. Або, можливо, те, як люди дивилися на них. В очах народу Каскадії вони завжди були воєнізованими мудаками, але тут? Хороші хлопці, які борються заради тих, хто називає Сейфхейвен своїм домом.\n\nПомінявшись ролями, Міскаунти без вагань стратили б кожного Наглядача. А чи стратили б? Вона помічала, що все більше і більше Міскаунтів приводили з жетонами Наглядачів на шиях. Жетонами, які збігалися з іменами та обличчями тих, хто їх носив. Не як трофеї, а як символи минулих часів. Наглядачі були хорошими хлопцями, так? Вбивство їх усіх, навіть деяких із наших родичів, знецінило б усе те, за що почав виступати «Сьєрра-Готель», але хіба Наглядачі теж не боролися за справедливість? Це бентежило її до безмежності. Милосердя чи Справедливість... або, можливо, коротше кажучи — порожня помста? Хто знає, все одно вибір був за нею. "
  vsh_vault.13.a:0 "Справедливість..?"
  vsh_vault.13.b:0 "Милосердя."

  vsh_vault.14.t:0 "Радісні вигуки"
  vsh_vault.14.d:0 "Вигуки лунали несамовито, скандування доносилося з усіх кінців натовпу. Мері була трохи спантеличена, не очікуючи, що за нею згуртується такий великий натовп. Вона повернулася до Шоутайм, яка теж була досить здивована. На секунду вона затримала погляд на Мері, перш ніж на її обличчі з'явилася посмішка.\n\nПовернувшись до натовпу і все ще посміхаючись, вона запитала: «Це не зовсім те, що я мала на увазі, але я завжди була жінкою з народу. Якщо це справді ваш вибір, я піду у відставку і передам усі повноваження Мері!»\n\n«Тож, жителі Сейфхейвену, ви бажаєте, щоб правили Наглядачі?!» — крикнула Шоутайм.\n\nРезультатом була рішуча згода.\n\n«Тоді все вирішено. Прошу вас вітати вашого нового лідера, Командира Мері Малліган!» — крикнула Шоутайм у натовп під гучні овації, проводжаючи Мері до трибуни.\n\n«Я вам усім дуже вдячна. Обіцяю, що ця можливість не буде змарнована. Я зроблю все, що в моїх силах, щоб створити безпечніший і могутніший Сейфхейвен. Ви можете бути спокійні, знаючи, що я служу лише вам — народу!» — вигукнула Мері."
  vsh_vault.14.a:0 "Їхні вигуки луною рознеслися по всьому місту!"

  vsh_vault.15.t:0 "Відносна тиша"
  vsh_vault.15.d:0 "Та сама група, яка почала все це, голосно кричала, вболіваючи за Мері. Решта натовпу зберігала мовчання, відчуваючи неспокій через те, що Мері бере контроль у свої руки. Вона скривилася, відчуваючи певне збентеження через те, що так захопилася ідеєю очолити Сейфхейвен.\n\n«Звісно, якщо ви всі вважаєте, що мер Шоутайм і надалі залишатиметься компетентним лідером, я також продовжу довіряти їй», — сказала Мері.\n\n«Ви бажаєте, щоб я продовжувала правити?» — запитала Шоутайм.\n\nНатовп не міг ясніше дати зрозуміти, що хоче бачити її на чолі.\n\n«Дякую. Для мене справжня честь, що ви продовжуєте мені довіряти. Сейфхейвен дуже змінився з часом, але дозвольте мені сказати чітко! Це лише початок! Ми продовжуватимемо рости і рухатися вперед! Сейфхейвен ніколи не зазнає поразки. З Наглядачами на нашому боці та з нашими серцями в грудях ми будемо процвітати! На Сейфхейвен чекає велич, нам потрібно лише простягнути руку і взяти її!» — виголосила Шоутайм. Натовп вибухнув оплесками, і навіть Мері ледь помітно посміхнулася під своїм шоломом. Вона не могла не відчувати легкої образи через те, що люди їй не довірилися, але якби їй довелося комусь програти (а вона ненавиділа програвати), вона б без вагань обрала Шоутайм. Наглядачі завжди її підтримають, стільки вона їй завинила."
  vsh_vault.15.a:0 "Сейфхейвен для жителів Хейвену!"

  vsh_vault.16.t:0 "Сміттярі рятують день!"
  vsh_vault.16.d:0 "Нещодавно один юнак звернувся до нас із проханням прибрати його підвал. Дивне прохання, але наш новостворений департамент парків і зон відпочинку вхопився за можливість зайнятися благоустроєм громади, особливо після того, як хлопець пообіцяв, що ми можемо залишити собі весь мотлох, який знайдемо!\n\nНа щастя, схоже, що попередній власник будинку був фанатиком Ядер-Коли, залишивши по собі тисячі кришечок, які ми виявили. Після виплати всім працівникам департаменту солідної премії, у нас залишилося достатньо кришок, щоб наповнити нашу скарбницю на довгий час. Цього вистачить, щоб подолати наші поточні комерційні проблеми принаймні на даний момент..."
  vsh_vault.16.a:0 "Як пощастило..."

  vsh_vault.17.t:0 "Бо ти сильна"
  vsh_vault.17.d:0 "«Командире Гарлоу. Дуже рада знову вас бачити», — сказала Мері, віддаючи Сільвії шанобливий салют.\n\n«Навзаєм, Командире Малліган. Після Вашингтона...» Вона не закінчила фразу, поринувши у старі спогади. «Що ж, я не думала, що багато хто з нас вижив», — тихо закінчила Сільвія.\n\n«Ми вижили, і ми сильніші, ніж будь-коли. Ми повинні знову об'єднати Наглядачів, щоб покарати тих, хто нас знищив, і всіх, хто загрожує Пустці», — заявила Малліган. «Ні», — прямо відрізала Сільвія. Мері була спантеличена тим, як швидко вона відповіла. Вона почала було говорити, але Сільвія її перебила.\n\n«Ні, зупинись. Послухай мене. Я знаю, що ти завжди була палкою прихильницею Наглядачів. Твій патріотизм не знає меж. Але просто вислухай мене. Наглядачі закінчилися, з ними покінчено. Вони загинули у Вашингтоні, ми лише кульгаємо далі. Що, якби з їхнього попелу ми могли б створити щось нове?» — запитала Сільвія. Мері відчула, як у ній закипає лють, вона стиснула кулаки і почала важко дихати, намагаючись вгамувати гнів. Вона відчула руку на своєму плечі і, обернувшись, побачила Шоутайм, яка їй кивнула. «Дозволь мені запитати тебе про дещо, Мері», — почала Сільвія.\n\n«Ти вважаєш, що світ став би кращим з Наглядачами в ньому?» — запитала вона. Це питання вдарило Мері, наче ляпас. Спогади за все життя промайнули в ній — спогади про біль, щастя, жаль, гордість, життя та смерть. Наглядачі були всім, що знала Мері, всім, ким вона коли-небудь була. Вона хотіла зробити світ безпечним, за будь-яку ціну. Вона відчула, як на очі навертаються сльози, і емоції заполонили весь її мозок — щось, що стало їй чужим у роки, що передували падінню Сіетла та після нього. Яким би він був? Вона подивилася на Шоутайм, відчайдушно шукаючи якоїсь поради, яка б зцілила її мозок, що швидко ламався. Шоутайм зустріла її погляд із серйозним виразом обличчя. «Я не можу тобі в цьому допомогти, Мері. Це справа між тобою і твоєю совістю. Хоч би що ти обрала, люди Сейфхейвену тебе підтримають.» Сльози потекли по обличчю Мері. Вона прийняла рішення."
  vsh_vault.17.a:0 "Наглядачі вбивають зрадників."
  vsh_vault.17.b:0 "До біса Наглядачів!"

  vsh_vault.18.t:0 "Стійте з гордістю"
  vsh_vault.18.d:0 "«Командире Гарлоу. Дуже рада вас бачити знову», — сказала Мері, віддаючи шанобливий салют Вільяму. «Командире Малліган, як же я сумував за вами і вашою групою. Тримаєтесь у Сейфхейвені? Я чув, що ви, сучі діти, розгромили Міскаунтів, біса з два, чудова робота!» — сказав Вільям. «Я лише робила те, що зробив би будь-який Наглядач за таких обставин», — заявила Мері. «У тебе є хист, Малліган, не те що у деяких із цих хлопців. Ніхто більше не здатен приймати важкі рішення, залишаючи мені розгрібати їхнє лайно», — просторікував він, а Мері неуважно погоджувалася.\n\n«Тепер це не має значення. Коли наші групи возз'єднаються, ми зможемо дати відсіч будь-кому, хто хоча б подумає нам загрожувати. Мені кортить повбивати кожного з тих вашингтонських хлопців, які нас вигнали. Кожного до єдиного», — похмуро сказав Вільям. «Звичайно, але спочатку нам потрібно набрати людей, щоб кинути їм виклик, нам бракує сил, щоб загрожувати їм», — зазначила Мері. «Нічого страшного, ми просто призвемо деяких людей з нашої нації, їм там буде непереливки, але все, що їм потрібно зробити — це відвернути на себе вогонь, щоб Наглядачі могли завдати шкоди. Їм це не сподобається, але, як я вже казав, як Наглядач, ти повинна вміти приймати важкі рішення». «Звичайно, Командире», — сказала Мері, відчуваючи певну незручність від того, як поводився Вільям. Звісно, вона хотіла помститися і відродити Наглядачів, але здавалося, що він заходить занадто далеко. Чи справді вона могла б працювати з кимось на кшталт нього?"
  vsh_vault.18.a:0 "Ми завжди були такими божевільними?"
  vsh_vault.18.b:0 "Твоя правда, брате! Але жодних жителів Хейвену..."

  vsh_vault.19.t:0 "Диваки!"
  vsh_vault.19.d:0 "Виявилося, що не всі хочуть залишати сховище. Хоча нам вдалося вивести всіх завдяки переговорам і такту, чимала група старожилів заявляє, що сховище — це єдине місце, де вони хочуть бути. До кінця своїх днів...\n\nПісля відправки кількох невеликих загонів для їхнього примусового супроводу до щойно відремонтованих будинків, спалахнула бійка, яка закінчилася тим, що дідугани зі своїх прихованих 10-міліметрових пістолетів поклали чималу кількість наших солдатів, перш ніж втрутився Наглядач, щоб «вирішити проблему»."
  vsh_vault.19.a:0 "Побудуйте меморіал."

  vsh_vault.20.t:0 "Покупець!"
  vsh_vault.20.d:0 "Сьогодні до нашого штабу забрів житель сховища. Його направили сюди караванники, які готувалися вирушити на схід до Реджайни.\nПісля того як ми сказали йому, що зали пересадки 107-го знаходяться далі по коридору, він розповів, що прийшов з абсолютно іншого сховища і що їхній водяний чип зламався. Він запропонував кругленьку суму за те, щоб ми поповнювали їхні запаси води, поки він не знайде новий чип!"
  vsh_vault.20.a:0 "Він не сказав, звідки саме..."

  vsh_vault.21.t:0 "Наша ініціатива"
  vsh_vault.21.d:0 "Мер Шоутайм домовилася про те, щоб знову звернутися до своєї нації та розповісти про свої великі плани. Гордість і патріотизм за Сейфхейвен були на підйомі відтоді, як вони перемогли Великий Стемпід, а наступні виборчі дебати забезпечили їй посаду мера на осяжне майбутнє. Їй потрібно було продовжувати триматися на хвилі, підіймаючи свій народ ще вище. Тож вона придумала план, як привести Сейфхейвен до золотого віку.\n\n«Народе Сейфхейвену! Послухайте мене, бо я приношу нам наступний крок у зміцненні нашої позиції в Пустці». Вона зробила паузу для драматичного ефекту, дозволивши тиші підігріти цікавість людей.\n\n«Дозвольте мені показати вам це!» — крикнула Шоутайм, вказуючи на порожній екран, який швидко засвітився і показав гігантський документ. «Найманські компанії Сейфхейвену!» — звернулася Шоутайм до аудиторії. «Відправляючи наших людей і зброю до інших демократичних націй з подібними поглядами, ми можемо допомогти зробити світ кращим і продовжувати розбудовувати нашу націю. Такі люди, як ви, зі зброєю та надією в серцях, стануть гордістю нашої нації». Шоутайм посміхнулася, сповнена гордості за людей, які підтримали її плани. Шлях буде тернистим, особливо з ворогами, що все ще оточували їх. Але одного дня Сейфхейвен стане перлиною Канади. Це буде наша ініціатива — загартувати наші серця і мужньо зустріти війну! Заради блага всіх, заради блага Сейфхейвену!"
  vsh_vault.21.a:0 "За жителів Хейвену!"

  vsh_vault.22.t:0 "Приємно бути багатим"
  vsh_vault.22.d:0 "Нова ініціатива Сейфхейвену розвивалася чудово. Усі плани мера Шоутайм, які колись були лише далекими мріями, повністю втілилися в життя. Легіони солдатів, суворо вимуштруваних радниками Наглядачів, були підготовлені та готові до відправки в пустку для захисту дружніх демократичних націй. Їхнє спорядження підтримувалося на найвищому рівні. В очах мера Шоутайм вони були ідеальними, і навіть більше. Це вселяло надію в її серце. Вона пишалася тим, чого досягла, а ще більше пишалася тим багатством, яке, як вона знала, це мало принести. Особливо з цим ребрендингом на «S.H. Mercenary Company», назвою, яка неодмінно привабить покупців. Достатньо, щоб вона могла реалізувати свої інтереси у витрачанні кришок. Найкраща частина?\n\nЦе мало принести їм серйозні гроші."
  vsh_vault.22.a:0 "Я люблю гроші..."

  vsh_vault.23.t:0 "Стійте з гордістю"
  vsh_vault.23.d:0 "З кожним днем Сейфхейвен зростав. Ще один будинок, ще одна залізниця, ще одна дорога. Він продовжував рухатися вперед, даючи відсіч жорстокості цього світу. Зі стічної ями до громади, до бастіону. Він виріс, став чимось більшим. Але не без втрат. Для підтримки розвитку, особливо в пустці, були необхідні жертви. Комусь доводилося голодувати, комусь — робити роботу, яку він волів би не робити. Але найголовніше — комусь доводилося віддати своє життя.\n\nТакою була природа пустки, і саме це привело мера Шоутайм до її наступного проєкту.\n\nВін був незначним за масштабами, не вимагав багато ресурсів, але його значення було, мабуть, найважливішим з усіх її останніх «проєктів Сейфхейвену».\n\nШоутайм стояла в центрі Сейфхейвену перед великим натовпом. Промова записувалася для радіо і, вперше в історії, для телебачення. Її не побачить багато людей, швидше за все, лише еліта Сейфхейвену, але її мета все одно була важливою. Шоутайм звернулася до натовпу:\n\n«Хоча зараз ми живемо в безпеці та привілеях, ми ніколи не повинні забувати тих, хто віддав своє життя, щоб привести нас сюди. Вони не будуть забуті». Після цього Шоутайм стягнула покривало і відкрила величну статую солдата, який, тримаючи руки на стегнах, дивився вдалину. На постаменті статуї були викарбувані слова «Ніколи не забуті».\n\nЛюди вибухнули оплесками, всі вони пишалися тим, як далеко вони зайшли і тими, хто загинув, щоб доставити їх туди."
  vsh_vault.23.a:0 "В пам'ять, на краще це чи на гірше."

  vsh_vault.24.t:0 "Жінка, яка..."
  vsh_vault.24.d:0 "Мер Шоутайм зручно влаштувалася у своєму робочому кріслі, видихнувши з полегшенням. Гарне крісло було таким приємним комфортом, і все ж вона зрозуміла, що не може без нього працювати. Разючий контраст з її старими кріслами, які ледве трималися купи. Ще одне нагадування про те, як далеко вона зайшла. Вона поправила намисто на шиї, намагаючись зробити його якомога охайнішим. Незабаром вона планувала звернутися до нації, і тому повинна була зробити свій образ максимально презентабельним. Дощ сильно бив у вікно кімнати, наповнюючи офіс Шоутайм заспокійливим звуком. Поправляючи одну зі своїх діамантових сережок, вона підійшла до вікна, неуважно обмірковуючи свою промову. Вона дивилася у вікно, спостерігаючи, як дощ заливає Сейфхейвен. На вулиці було мало людей, більшість шукала укриття в приміщеннях. Окрім однієї дитини, яка сиділа майже без укриття з перевернутим капелюхом перед собою. У ньому не було монет.\n\nШоутайм миттєво стало зле, її травматичне минуле спливло в пам'яті. Вона спробувала відігнати ці думки, закривши жалюзі, щоб сховати дитину з поля зору, але це не спрацювало. Образ залишився в її мозку, от тільки тією дитиною була вона. Вона подивилася на свої руки, на пальцях яких красувалися вишукані каблучки. Вона поспішно зняла їх, кинувши на підлогу. Вона зірвала з шиї намисто, перлини розірвалися і розсипалися по підлозі. Вона стояла дуже тихо, і звук перлин, що котилися по підлозі, був єдиним, що вона чула. «Що, в біса, я роблю?» — запитала вона себе."
  vsh_vault.24.a:0 "Поспішаючи геть..."

  vsh_vault.25.t:0 "Одне для слабких"
  vsh_vault.25.d:0 "Мер Шоутайм та Мері стояли на великій сцені, звертаючись до своєї нації. Були присутні багато громадян Сейфхейвену, а решта слухали по радіо. Вся нація стояла за своїми лідерами, ловлячи кожне їхнє слово.\n\n«Занадто довго ми жили в жахливих умовах, вороги повільно вичавлювали з нас життя. Кожного дня доводилося йти на жертви лише заради ще одного шансу на жалюгідне існування. На це ми кажемо: годі! Ми завдамо удару всім, хто нас пригнічує, і піднімемося вище, ніж вони могли б коли-небудь. Ми принесемо вам велич. Свободу для кожного робити те, що йому заманеться, процвітати в пустці. Але ми не зможемо зробити це наодинці, нам потрібна ваша допомога! Вступайте до армії, приєднуйтесь до Нових Наглядачів. Бо поодинці ми ніщо, але разом у нас достатньо сил, щоб звернути гори. Вони не розуміють, що робить нас особливими, і ніколи не зрозуміють. За Сейфхейвен, за Охоронців перевалу! За праведних і за тих, кого покинули сильні!»"
  vsh_vault.25.a:0 "Ще одне для вільних!"

  vsh_vault.26.t:0 "Щось варте святкування"
  vsh_vault.26.d:0 "Було вже досить пізно, коли з кабінету мера в Сейфхейвені пролунав сміх. Мері, Шоутайм і Сільвія згадували минуле і радісно розповідали жарти, випиваючи при цьому надмірну кількість алкоголю. Жодна з них насправді не захоплювалася випивкою, особливо в тій кількості, яку вони мали зараз, віддаючи перевагу зосередженню на роботі. Але всі вони погодилися, що заслужили на це після такого довгого часу без належного відпочинку.\n\nМері вибачилася і вийшла з розмови, бажаючи знову наповнити свій келих. Злегка похитуючись, прямуючи до столика з напоями, вона подивилася на свій покинутий шолом, який зняла раніше. Вона глянула на його тріснуті лінзи, поринувши у роздуми. Її відображення дивилося просто на неї. Мері ніколи б не зізналася в цьому нікому, іноді навіть самій собі, але вона часто сумнівалася в собі. Коли вона прийняла рішення розірвати зв'язки з Наглядачами Сіетла і почати щось нове, вона серйозно задавалася питанням, чи правильно вчинила, чи, можливо, просто стала зрадницею, тією, кого потрібно вбити до того, як вона наразить людей на небезпеку. Це все ще мучило її час від часу, її внутрішні докори та невпевненість знущалися з неї, поки вона продовжувала рухатися вперед. Але коли вона дивилася на Сейфхейвен, і коли вона дивилася на Шоутайм і Сільвію, все це здавалося того вартим. Можливо, вона зробила правильний вибір. «Можливо, вона ніколи не дізнається», — подумала Мері, почувши гучний сміх Шоутайм. Посмішка з'явилася на її обличчі, коли вона повернулася до своїх подруг. Можливо, їй і не потрібно було цього знати."
  vsh_vault.26.a:0 "У цьому житті!"

  vsh_vault.27.t:0 "Прогрес у своєму темпі"
  vsh_vault.27.d:0 "Сироти в Сейфхейвені певний час завжди були серйозною проблемою. Діти, які втратили батьків або були просто покинуті, намагалися вижити в цих суворих умовах. Якийсь час це було нормою. Але то було тоді. Сейфхейвен змінився, перетворившись завдяки Шоутайм та Мері на щось більше —\n\nНа громаду.\n\nТам, де колись стояли жалюгідні халупи, вкриті брудом і багнюкою, тепер були громадські школи та будинки з люблячими сім'ями. Діти, які колись озиралися навколо з сумом і відчаєм, тепер мали усміхнені обличчя і повні животи. Вони могли вчитися. Вони могли рости.\n\nСерце Шоутайм тьохкало від радості, коли вона бачила перед собою безліч молодих облич, сповнених енергії та захоплення; її груди наповнювалися гордістю.\n\n«Привіт, діти, мене звати Шоутайм — я ваш мер. Але можете вважати мене своїм другом. Це Мері, моя права рука. Ми прийшли поговорити з вами про численні обов'язки керівництва нацією», — сказала Шоутайм з яскравою усмішкоєю на обличчі. З іншого боку, Мері виражала тихий дискомфорт, почуваючись не в своїй тарілці в оточенні школярів. «У вас є якісь питання до нас?» — запитала Шоутайм. Маленький хлопчик, сповнений захвату, підняв руку так високо, як тільки міг.\n«А ви коли-небудь вбивали поганих хлопців?» — запитала дитина, дивлячись на Мері. Усмішка Шоутайм зникла, і вона миттєво подивилася на Мері. «Так, вбивала. Дуже багато», — сказала Мері. Шоутайм здригнулася, молячи бога, щоб Мері проявила більше такту. Діти вибухнули тихим «у-у-у-у», зацікавлені небезпечними історіями, в яких брала участь ця страшна й мускулиста жінка.\n«Хто був найстрашнішим з тих, кого ти вбила?» — запитала інша дитина. «Супермутант-бегемот. Величезний монстр. У мене було лише...» Шоутайм із благоговінням спостерігала, як Мері миттєво перейшла до надзвичайно кривавих подробиць того, як її команда вбивала монстрів. Частинка її душі хотіла втрутитися, але вона не знайшла в собі сил зіпсувати історію, в яку діти були так занурені. Можливо, це було не зовсім те, чого вона очікувала, але хто вона така, щоб вказувати дітям, чим їм цікавитися? Крім того, можливо, історія Мері надихне когось із дітей стати таким же героєм, як вона. Ця думка її заспокоювала."
  vsh_vault.27.a:0 "Почекай, Мері, не давай цій дитині свою зброю!"

  vsh_vault.28.t:0 "Новий вид Хейвену"
  vsh_vault.28.d:0 "Мер Шоутайм, Мері та Сільвія стояли в кабінеті мера, занурені у роздуми. Після тривалого планування та підготовки вони троє нарешті змогли представити своїм націям те, що так довго готували. Знімальна група все налаштовувала, поки трійця морально готувалася.\n\n«Хвилюєшся, Мері?» — подражнила Шоутайм, їй завжди подобалася сором'язливість Мері перед камерами. «Ні. Наглядачі не хвилюються, вони роблять те, що повинні», — твердо заявила Мері. «Вона точно хвилюється», — сказала Сільвія, отримавши кілька смішків від Шоутайм і стусан у плече від Мері. «Ми в ефірі через двадцять секунд», — вигукнув член знімальної групи. Троє дівчат зайняли свої місця. Шоутайм посередині, а Сільвія і Мері по боках. Камери були на позиціях, чоловік за ними показав три пальці, потім два, а потім...\n\n«Доброго вечора, громадяни півночі. Ми звертаємося до вас сьогодні з дуже важливим повідомленням. Ми тут, щоб оголосити про створення «Народної Північної Гавані». Повністю реалізованої демократичної нації, що об'єднує наші зусилля та людей під одним прапором. Вже розробляється конституція і створюються плани щодо виборів. Я хочу подякувати всім вам за те, що допомогли нам просунутися вперед до того місця, де ми є сьогодні. Це ніколи не було легко, і ми не змогли б зробити це без вашої сили. Ми боролися разом, ми допомагали одне одному і, що найважливіше, ми росли разом. Хоча зараз все може здаватися простішим, ми ніколи не повинні забувати жертви, на які нам довелося піти, щоб опинитися тут. Це лише початок чогось значно більшого. Попереду ще стільки роботи, стільком людям потрібно допомогти. Зараз це здається лякаючим, але я знаю, що разом ми зможемо подолати будь-яку проблему, яку підкине нам Пустка. Незалежно від того, чи ви Наглядач, найманець, чи просто людина, яка намагається вижити, ви можете бути спокійні, знаючи, що ми завжди дбатимемо про ваші найкращі інтереси. Дякую всім, і нехай Народна Північна Гавань живе сотні років!»"
  vsh_vault.28.a:0 "Давайте святкувати!"

  vsh_vault.29.t:0 "Холодне серце..."
  vsh_vault.29.d:0 "Мері дивилася вдалину, поринувши у роздуми, оглядаючи великі снігові поля, що тягнулися настільки далеко, наскільки сягало око, наче білий океан, і її думки линули до того великого моря, яким вона колись захоплювалася. Океан був дуже схожий на Наглядачів; нестримний і лютий. Йому було байдуже, що про нього думають, він робив те, що йому заманеться. З океаном не можна боротися, можна лише борсатися, поки він не затягне тебе занадто далеко. На обличчі Мері з'явилася вовча посмішка. Як і сам океан, вона безжально обрушиться на будь-кого, хто стане їй на заваді.\n\nВона обернулася і подивилася на великий стрій солдатів, що стояли перед нею. Їхня броня була в ідеальному стані, відбиваючи холодний білий сніг, що падав перед нею. «Наглядач складається з трьох речей, — почала вона. — Холодного серця, сталевого розуму і зброї. Це і є ваше життя. Це все, що вам знадобиться до кінця ваших днів. Ви станете маяком безпеки та честі в холодному снігу, що падає навколо нас. Пустка зрозуміє, що тут не буде жодної толерантності до опозиції, жодних поблажок для покидьків. Ви — молот пустки, посланий швидко розправитися з тими, хто полює на слабких. Ви обрушитеся на них стрімко і безжально!» — кричала Мері. Вона зробила паузу, оглядаючи солдатів перед собою. «Знайдіть втіху в тому, що ваші серця такі ж холодні, як сніг, що нас оточує, і тому ви сильніші за будь-що, що може кинути нам пустка. Ви — Наглядачі, а Наглядача хвилює лише одне. Його місія. Наступати на слабких навколо і атакувати сильних, що оточують вас. Ми ніколи не здамося. Ми ніколи не відступимо!» — кричала вона до солдатів. Вони кричали їй у відповідь, підкидаючи руки зі зброєю високо в повітря. «За Наглядачів Білого!» — закричала Мері. Солдати почали маршувати вперед. Мері спостерігала за ними, а сніг падав на її шолом. Він застилав їй зір."
  vsh_vault.29.a:0 "І важка гвинтівка..."

  vsh_vault.30.t:0 "Парочка... мудаків"
  vsh_vault.30.d:0 "Радість перемоги часто вщухала, коли доводилося брати на себе численні обов'язки управління переможеними. Перемога Сейфхейвену над Великим Стемпідом не стала винятком. Люди, природно, не поспішали довіряти нації шахраїв, яка щойно отримала контроль над їхньою економікою та народом. Мер Шоутайм не шкодувала коштів, коли справа доходила до завоювання довіри людей; зосередившись на ремонті інфраструктури та розширенні торгівлі. Але одна проблема продовжувала піднімати свою потворну голову.\n\nПарочка.\n\nЇх любили, їх обожнювали. Але вони програли, і люди не хотіли їх відпускати.\nПропозиція Мері була простою. «Просто вбийте цих виродків, зробіть із цього показовий урок». Звичайно, все було не так просто, як здавалося. Тож Мер обрала щось трохи добріше, але не менш корисне.\n\nНебо було яскраво-помаранчевим, сонце ледь проглядало. Мері та Мер мовчали, ведучи королівську пару в невідоме для них місце, Мері тримала їхню дитину на руках. Парочка мовчала, тримаючись з грацією і гідністю, намагаючись зберегти ті залишки гордості, що в них залишилися. Попереду групи були двоє коней, прив'язаних до невеликого стовпа. Мері та Мер зупинилися. Шоутайм повернулася до Парочки і вказала на коней.\n«Вони ваші», — сказала мер Шоутайм. Парочка залишалася нерухомою, усвідомлюючи те, що їм сказали. «Ми не збираємося вас вбивати. Але ви не можете залишатися на нашій землі. Це ваш єдиний вихід», — сказала мер Шоутайм.\n\n«Наша земля». Ці слова луною віддалися в мозку Джона. Його життя промайнуло перед очима. Де все пішло не так? Він кивнув меру Шоутайм з незбагненним виразом обличчя, взявши за руку свою дружину, коли Мері, майже неохоче, передала їй Джой. Він граціозно попрямував до коней — знаючи, що куди б він не пішов далі, це буде з його сім'єю, і за це він був вдячний.\n\nМері та Шоутайм спостерігали, як Парочка поїхала геть. «Цікаво, як вони впораються», — замислено сказала Шоутайм. «Це не наш клопіт. У нас є важливіші справи», — суворо сказала Мері.\n\n«Мабуть, ти маєш рацію», — сказала Шоутайм, дивлячись, як Парочка зникає з поля зору."
  vsh_vault.30.a:0 "Сім'я об'єднана, попри все."

  vsh_vault.31.t:0 "Досить вистав"
  vsh_vault.31.d:0 "Мер Шоутайм ніколи не прагнула грати роль диктатора, це було не в її характері. Вона завжди обирала пряник, а не батіг, залишаючи насильство Мері та її банді, коли це було необхідно. Можливо, саме тому група перед нею виглядала такою шокованою після того, як вона увірвалася, перервавши розкішну вечерю. Найманці вимагали пояснень, чому вона увійшла без дозволу, але їхні запитання залишилися без відповіді. Натомість Шоутайм вирішила сісти і налити собі випити. Вона зробила ковток, а потім пильно подивилася на найманців.\n\n«Подивіться на мене», — сказала вона, кидаючи на найманців спопеляючий погляд. «Ви більше не смієте жартувати з Сейфхейвеном. Зрозуміли мене?» — суворо сказала Шоутайм. У кімнаті запанувала мертва тиша, найманці не наважувалися вимовити ні слова. «Це більше не ваш ігровий майданчик, це дім. Якщо ви хочете бути частиною цього дому, я настійно раджу вам хоч раз, бляха, виконати свою роботу. Якщо вам це не підходить, то ви можете забиратися. Але зрозумійте мене: якщо ви плануєте залишитися і продовжувати мене дратувати, я дозволю Мері розібратися з вами, вона набагато менш привітна, ніж я», — сказала Шоутайм, вказуючи на грізну фігуру, що стояла позаду неї.\n\n«То що ви вирішите?» — запитала Шоутайм.\n\nНайманці обмінялися стурбованими поглядами, перш ніж один із них підвівся.\n\n«Думаєш, нас гребе, що ти кажеш? Ти тут ні хріна не вирішуєш, ми тут головні», — сказав найманець, підійшовши впритул до обличчя Шоутайм. Її обличчя скривилося від огиди, коли вона відчула запах з його рота, вона повернулася до Мері і ледь помітно кивнула. Найманець ледве встиг щось зрозуміти, як кулак Мері зустрівся з його щелепою, відправивши його прямо на підлогу без свідомості. Шоутайм вихопила пістолет Мері і вистрілила йому прямо в голову, на превеликий подив усіх присутніх у кімнаті. Мертвий найманець злегка сіпнувся і завмер, з його голови сочилася кров.\n\n«Я запитаю ще раз», — сказала Шоутайм, звертаючись до кімнати, з краплями крові на обличчі.\n\n«То що ви вирішите?»"
  vsh_vault.31.a:0 "Серце героя загартовується."

  vsh_vault.32.t:0 "Настав час шоу"
  vsh_vault.32.d:0 "Шоутайм сіла, вмощуючись зручніше, перш ніж розпочати свою промову. Найманці дивилися на неї з підозрою. Ніхто не був убитий, коли Наглядачі вимагали впустити їх, але перестрілка була дуже близька до того, щоб розпочатися.\n\n«Не хвилюйтеся, я прийшла не для того, щоб завдати вам шкоди, я просто прийшла запропонувати вам угоду», — спокійно заявила Шоутайм. Найманці перезирнулися, не зовсім розуміючи, як реагувати.\n\n«Я будую новий Сейфхейвен, місце для всіх. Я хочу, щоб ви були його частиною, але все не може залишатися так, як є зараз. Це має бути партнерство, ми повинні працювати разом, щоб підтримувати цих людей. Мені потрібна ваша підтримка, ваша бойова майстерність. Ви потрібні нам у Сейфхейвені як громадяни, а не найманці», — благала Шоутайм. Найманці обмінялися поглядами, не надто переконані. Шоутайм почала нервувати, задаючись питанням, чи справді їй доведеться застосувати до них силу, аж поки нізвідки Мері не почала благати їх.\n\n«Я колись була такою ж, як ви. Шукала лише гострих відчуттів від бою, наступаючи на тих, кого вважала меншими за себе. Ви повинні зрозуміти, що люди тут, у Сейфхейвені, хочуть просто жити, так само як і ви, як і я, і як будь-яка людина в цій пустці. Ми створюємо тут щось нове, щось сміливе і незвичайне. Ви можете допомогти нам і стати частиною цього. Вам більше не потрібно з нами воювати, ми можемо працювати разом, щоб підтримувати цих людей і самих себе. Сейфхейвен все ще може бути вашим Сейфхейвеном, нам просто потрібно, щоб ви залишили місце для всіх інших. Будь ласка, нікому не потрібно сьогодні помирати», — майже благала Мері.\n\nНайманці перезирнулися між собою, перш ніж один із них, їхній лідер, підвівся. «Ми приймаємо вашу пропозицію».\n\nПісля цього всі сторони зітхнули з полегшенням. Пізніше того ж дня Шоутайм запитає Мері, чому вона говорила так пристрасно, все ще шокована тим, що бачила, як вона когось просила.\n\n«Я не знаю, що на мене найшло. Напевно, мені просто справді не байдуже це місце», — тихо сказала вона."
  vsh_vault.32.a:0 "Серце солдата м'якшає."

  vsh_vault.33.t:0 "...Продала світ"
  vsh_vault.33.d:0 "Вона поспішно вибігла зі свого кабінету і помчала до кімнати, де планувалися зйомки. Вся знімальна група розгублено подивилася на неї, коли вона увірвалася, зупинившись на півдорозі і просто витріщившись на неї. «Починайте знімати!» — наказала Шоутайм. «Еммм, пані мер, ми не домовлялися на цей час, ми не готові почати», — відповів член знімальної групи. «Я сказала, починайте знімати!» — голосно наказала Шоутайм. Група поспішила почати, готуючи обладнання. Шоутайм зібралася з думками. Група подала знак, що час починати. «Сейфхейвен. Я прийшла до вас сьогодні, щоб сказати одну річ... Мені-... Мені... шкода. Побачивши, як далеко ми можемо зайти, використовуючи найманські компанії Сейфхейвену, я втратила з поля зору людей і впала в жадібність. Я думала, що покращую життя для всіх у нації — хоча, насправді, було очевидно, що я догоджала лише еліті та собі. Це неправильно, дуже-дуже неправильно. Я така зла на себе за те, що втратила себе, за те, що забула про вас, за те, що стала тим, проти чого колись боролася. Я більше з цим не миритимуся, відтепер я обіцяю вам, що служитиму лише народу. Я подбаю про те, щоб була досягнута справедливість. Щоб більше ніхто ніколи не голодував. Щоб ми не просто виживали, а процвітали. Прошу вибачення у всіх, кого я образила. Будь ласка, дозвольте мені виправити свої помилки. Я вам це винна»."
  vsh_vault.33.a:0 "І так, багатство поширилося..."

  vsh_vault.34.t:0 "Стемпід відмовився!"
  vsh_vault.34.d:0 "«ПРО ЩО ТИ, БЛЯХА, ДУМАЛА?!» — кричала на Мері дещо здивована, але здебільшого розлючена мер Шоутайм. Вони вдвох були в кабінеті Шоутайм пізно вночі. Шоутайм саме збиралася йти, коли увірвалася Мері з дитиною на руках.\n\n«Я не очікувала, що вони відмовляться! Яка сім'я коли-небудь відмовиться платити викуп за власну дитину!» — крикнула Мері у відповідь, все ще трохи приголомшена тим, що її план не спрацював. «Ну, вони відмовилися! Це означає, що тепер у нас донька наших ворогів, вони знають, що ми її забрали, а отже, прийдуть за нами з дня на день! І навіть не питай мене, куди ми її подінемо!» — сказала Шоутайм, вказуючи на Джой. «Я занадто зайнята, щоб няньчитися з дитиною! Ти можеш подбати про неї, Мері?!» — запитала Шоутайм. Мері відкрила рота, але не змогла вимовити ні слова. Вона замовкла. «Я так і знала, Мері! Нам доведеться віддати її в якийсь дитячий будинок чи щось таке. Ми в дупі, Мері. У повній дупі. Забирайся звідси, мені треба щось придумати». Мері не треба було повторювати двічі, вона поспішно покинула кімнату, незграбно притискаючи дитину до грудей. Спостерігаючи за цією сценою, Шоутайм зітхнула і хихикнула. Вона подумки лаяла себе — про що вона тільки думала? Вона похитала головою, відганяючи ці думки. Вона не могла витрачати час на жалі про свої вчинки, їй потрібно було придумати план. Можливо, вона ще зможе врятувати ситуацію. Зрештою, дитина була досить милою."
  vsh_vault.34.a:0 "Вона може залишитися в моїй кімнаті..."

  vsh_vault.35.t:0 "ми встановили контроль"
  vsh_vault.35.d:0 "Дуже круто!"
  vsh_vault.35.a:0 "Дійсно."