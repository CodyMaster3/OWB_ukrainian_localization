# Риси Таймкіперів
clk_armament_sector:0 "Дитя Озброєного Сектору"

### Події Таймкіперів
clk_vault.1.t:0 "Тікаюче Сховище"
clk_vault.1.d:0 "Початок був простим. Коли двері сховища зачинилися, а бомби впали, мешканці раділи, що їм вдалося уникнути катастрофи, яка спіткала світ зовні. Єдиною дивиною була наполегливість Наглядача щодо дотримання суворого розкладу: коли їсти, коли спати, коли працювати й відпочивати. З часом цей розклад охопив усе — від стрижки до гри з дітьми. Ті, хто ставив питання, позбавлялися води й їжі. Зрештою сховище наповнилось тиканям і дзвоном сотень годинників. Через покоління час став не лише супутником, а й володарем усіх мешканців Сховища 24. Його не ставлять під сумнів. Його фіксують, йому підкоряються, його бояться. Страх, що час закінчиться — для них, або для світу — став одержимістю, особливо серед найрозумніших умів сховища. І вони мають лише одне головне питання: чи може Час іти назад, як іде вперед?"
clk_vault.1.a:0 "Час — великий цілитель"

clk_vault.2.t:0 "Наглядач: Ток"
clk_vault.2.d:0 "Людина, яка стала Головним Таймкіпером і Наглядачем Сховища 24, колись була вченим, що з нетерпінням чекав виходу з бункера, щоб пізнати світ. Але замість мрії він побачив кошмар: попеляста пустеля, відчайдушні вцілілі та чудовиська, які не вкладалися в уяву. Разом із розвідгрупою Ток дослідив навколишні землі, занотовуючи все у свій пі-бой. В записах — ворожі племена, смертоносні когті смерті, радіація, що не стихала. Але були й перемоги: саме Ток урятував жителів зруйнованого Бівер-Сіті від супер-мутантів, саме він виявив гулів, що, здавалось, застрягли в часі. Коли команда повернулась, Тока зустріли як героя. Проте в його голові крутилася думка: час і радіація спотворили землю. Час — наймогутніша сила. І він спливає. Єдиний шлях врятувати світ — це відновити його."
clk_vault.2.a:0 "Веди нас до спасіння!"

clk_vault.3.t:0 "Дорога Попереду"
clk_vault.3.d:0 "Битва за південний захід Юти закінчилась після довгої кривавої боротьби — зі смертю Salt-Upon-Wounds від руки Наглядача Тока. Те, що дикуни вважали легкою перемогою над слабкими жителями бункера, перетворилось на жорстоку війну за кожен пагорб і руїну. Згодом Таймкіпери почали мститися сторицею: спалювали й розоряли табори Білоногих. Шоковані впертістю й жорстокістю, вороги здались і благали про пощаду. Їм її частково надали. Але Таймкіпери змінилися: дикі племена більше не будуть загрозою для Святилища. Світ не повинен належати таким. І ця думка лише зміцнила їхнє прагнення його врятувати. А Білоногі — вони стали шанувати нове божество, сильніше за всі їхні старі: Час."
clk_vault.3.a:0 "Це лише початок"

clk_vault.4.t:0 "Друзі у Високих Місцях"
clk_vault.4.d:0 "Вони зустрілись під землею, в напівзруйнованому бункері — обом так було комфортніше. Один — заради укриття від палючого сонця пустелі, інший — бо це нагадувало дім. Коли Білоногі були розбиті, і Таймкіпери вперше поглянули на запилені землі нових сусідів, Повітряних Рейдерів, усі відчули, що попереду нове насильство. Але натомість відбулася мирна зустріч. Лідери обох сторін провели майже день у розмові в сталевій печері — і обидва виявились не такими, якими їх уявляли. Кронос виявився стриманим і спокійним, мислителем і технарем, що здивувало Тока. А сам Ток був не м’яким жителем Сховища, а шалений і жорсткий чоловік, який зробить усе заради мети. Вони обговорили території, обмін технологіями та доступ до доприйськових об'єктів під руїнами Зони 51. Коли сонце сідало, Ток уже збирався відвідати базу Рейдерів для тижневих обговорень і обміну знаннями. Поки не розмовляв із Кроносом, він копався в архівах Рейдерів. В одній коробці він знайшов голограми — записи з космічної станції, яка колись висіла у порожнечі, перш ніж впасти на землю. Голоси мертвих говорили про експерименти зі світлом, про дослідження природи простору та четвертого виміру. Після останньої касети Ток уже знав, що буде далі."
clk_vault.4.a:0 "Робимо світ безпечнішим — крок за кроком"

clk_vault.5.t:0 "Час Прокидатись"
clk_vault.5.d:0 "Розчарування запанувало у Сховищі 24. Найкращі розуми Таймкіперів уперлись у теоретичну стіну — і не могли просунутись у дослідженнях. Вони були впевнені: подорож у часі, остання надія для світу, вже майже в їхніх руках. Але майже — це все одно що ніколи. Вчені були на межі божевілля. Саме Ток нагадав їм, як далеко вони дійшли, й відновив віру: він показав їм записи, здобуті на аванпості Сліпих біля Бомби 002. І пообіцяв принести те, що їм потрібно. За кілька місяців Ток стояв на чолі невеликої армії — найкращих, кого змогли зібрати Таймкіпери і їхні нові «клієнтські» племена. Вони таборували у завойованому Ігл-Року — колись центрі торгівлі та дирижаблів, а тепер — пункті збору. Це була дивна армія: інтегровані племена, форма охорони Vault-Tec, перероблене військове спорядження довоєнних часів. Тут мав відбутись, сподівались усі, останній ривок. Бо за Колорадо ховалася таємниця — база Сліпих. І надія Таймкіперів."
clk_vault.5.a:0 "Наше майбутнє — зовсім поруч"

clk_vault.6.t:0 "Хіба Ми Це Вже Не Робили?"
clk_vault.6.d:0 "Перший тест був успішним. Ми використали чотиривимірний транспортер, щоб уникнути парадоксу. Тепер, забезпечивши своє існування в цьому часовому потоці, ми можемо працювати над пост-поточними методами переміщення. Це нова наука. Нова для нас, нова для світу. Її потрібно використовувати з розумом. Найменша помилка — і все зникне. Ми вже зробили все можливе, щоб захистити Пустку — тепер маємо зберегти її. У минулому, теперішньому... і майбутньому."
clk_vault.6.a:0 "Стає трохи заплутано"

clk_vault.7.t:0 "Повелитель: Ток"
clk_vault.7.d:0 "WIP"
clk_vault.7.a:0 "Я завжди вірив"

clk_vault.8.t:0 "Майбутнє"
clk_vault.8.d:0 "Спершу ми надсилали каміння. Потім — радроча. Потім — людей. Усе виглядало ідеально. Всі рівняння сходились, кожне підтвердження було точним. Після успішного запуску перша експедиція вирушила. Але через годину після встановленого часу повернення вони з’явились знову — палаючи. Після того як вони померли від опіків, ми змогли відновити журнал досліджень. Те, що вони побачили, було справжнім пеклом на Землі.\n\nОбвуглені скелети дерев, пісок замість ґрунту з запахом іржі. Повітря важке, дихати важко — ніби на груди поклали каміння. Небо рване, повне вогню й попелу. Руїни хмарочосів — розбиті й палаючі. Нічого знайомого. Далі — нестерпна спека. Вони вирішили повертатися. Але перед тим побачили в небі літак — чорний як обсидіан, що пролітав над горизонтом. На цьому запис обривається."
clk_vault.8.a:0 "Коли все пішло не так?"
clk_vault.8.b:0 "Все почалось із Рейдерів"

clk_vault.9.t:0 "Перемога"
clk_vault.9.d:0 "Зрештою, володіння Сліпих тепер під нашим прямим контролем. Завдяки допомозі наших друзів із неба Сліпі тепер перебувають у вічному сні. Сотня розвідників обшукала кожну щілину й відсік на місці. Візки, повні знайденого, гриміли годинами туди й назад у потаємних місцях Рок-Спрінґса. Кронос і двоє інших Рейдерів приземлилися на території, попрощались і потисли Току руку. І ось, ми знайшли те, що шукали: Обчислювальний Масив. Його негайно доставили до Сховища й під'єднали до новозбудованої машини. Масив спалахнув, а термінал почав розрахунки. Коли клацання й дзижчання припинилися, з’явилось повідомлення з проханням підтвердження. Після згоди машина заревла, заливаючи кімнату синім світлом. Вона була готова."
clk_vault.9.a:0 "Мені якось дивно"
clk_vault.9.b:0 "Це ще не кінець"

clk_vault.10.t:0 "Хіба Жадібність — Це Гріх?"
clk_vault.10.d:0 "Незважаючи на наші справедливі претензії до земель Тар Вокерів, схоже, Нью-Ханаан хоче загарбати все собі. Нашого посланця проігнорували — отже, співпраця їх не цікавить. Повітряні Рейдери починають втрачати терпіння, бо операція зупинилася. Ток уже провів нараду з Кроносом, запевнивши, що землю буде повернуто. Це територія, за яку ми воювали — і якщо дозволимо злодіям її забрати, бойовий дух війська впаде. Ми не можемо здаватися зараз."
clk_vault.10.a:0 "У вчинків є наслідки"

clk_vault.11.t:0 "Глухий Кут"
clk_vault.11.d:0 "Насаджена на спис голова змученого воїна дороги височіла над його колишнім гаражем, тепер порожнім, лиш із купкою брухту. Його мертвий погляд спостерігав, як колись могутня імперія стала лише черговим гвинтиком зростаючого механізму Таймкіперів. Колись Вісімдесятники жили в Каліфорнії, звідки їх вигнала республіка. І знову — нова сила руйнує їхній світ. Скрегіт шин, свист куль — і тиша. Можливо, їхній спосіб життя завжди був приречений. Ще одна історія, стерта часом."
clk_vault.11.a:0 "Краще, ніж пішки"

clk_vault.12.t:0 "Залишки Станції Бомба 002"
clk_vault.12.d:0 "Дані з автоматичних систем моніторингу Зони 51, що досі працюють після кінця світу, вказали на місце падіння станції B.O.M.B.-002. Десятки років тому вона зійшла з орбіти й впала в розлом землі — Гранд-Каньйон. Там нас чекали технології для великого проєкту Сховища 24: потужні комп’ютери, екзотичні сплави, точні сенсори, електроніка, радіоактивні матеріали.\n\nЩойно розвідники виявили форму конструкції серед каміння, Наглядач Ток (всупереч порадам Освальда та Рассела) повів першу групу. Не варто було дивуватися, що станція була заселена. Їхній невеликий загін, у дивних скафандрах, спробував оборонятися — через гучномовці й плазмозброю. Але ми повернулись із більшими силами. Під час переговорів ті, хто назвався Доглядачами, відкрили нам, що вони — частина групи Сліпих. Це лише невелика експедиція. Все, що можна було забрати, вже вивезли. Вони лише стерегли залишки й вивчали записи. Після днів допитів і аналізу, ми дізналися — усе вивезене знаходиться в Рок-Спрінґс."
clk_vault.12.a:0 "Час на нашому боці"

clk_vault.15.t:0 "Приєднатися до фракції Таймкіперів?"
clk_vault.15.d:0 "Раптова поразка племені Білногих принесла нам нового сусіда. Вони пропонують технології та ресурси в обмін на дозвіл розширити вплив, знищуючи ворогів далеко за межами."
clk_vault.15.a:0 "Пускати двигуни!"
clk_vault.15.b:0 "Ми літаємо лише для себе"

## Події Тимчасового Грабунку
time_scavenging_success_tt:0 "§OЩо вони принесли з собою?§!"
timey_wimey_scavenging_category:0 "Повернення Втраченого Часу"
timey_wimey_scavenging_category_desc:0 "Вкради з минулого, щоб захистити майбутнє.\n\nПісля перших вилазок нам вдалося скласти список просторів-часів з унікальними ресурсами та мінімальним ризиком для відвідування. Адже будь-яке значуще втручання в історію може створити катастрофічний парадокс і розірвати часову лінію. Ми можемо підтримувати зв’язок лише кілька годин — цього достатньо, щоб схопити дещо корисне для Майбутнього. Стандарти й протоколи допоможуть отримати максимум із мінімальним ризиком змінити історію."
