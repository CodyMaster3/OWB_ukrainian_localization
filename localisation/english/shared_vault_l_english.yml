vsh_warden_recruitment_tt:0 "Наша поточна §Yзакон про призов§! буде замінено на:"

# Ideas

vsh_mutual_wants:0 "Спільні прагнення"

vsh_wardens_on_point:0 "Вартові далеко від дому"
vsh_wardens_on_point_desc:0 "Мері Малліґан та її підрозділ Вартових прибули з Вашингтона, постійно озираючись через плече. Рейдери з рахунками та блукаючі братства ховалися всюди. Без зв'язку з Юлієм, вона та її загін загубились, перетнувши Скелясті гори. Ті, кого не схопили глибоко в землях Міскантів, дісталися Сейфгейвена, де зараз працюють як гільдія серед місцевої міліції.\n\n«Готель Сьєрра», позивний загону Мері — експериментальні спецвійська Вартовів. Вони навіть не були в Сіетлі під час Восьмигодинної війни — факт, який досі викликає у них сором. Намагаючись завербувати молодь, ослаблений Готель Сьєрра повертається до традиційної тактики Вартовів для простішого навчання."

vsh_lockdown:0 "Згуртована громада"
vsh_lockdown_desc:0 "Між Сховищем і родинними зв’язками в регіоні, кожен знає когось, хто допоможе. Та зі зростанням Зграї багато хто став ще ближчим — і настороженішим.\n\nЗростаюча напруга змушує все більше людей дивитися в бік Вартових..."

vsh_taking_after_mercs:0 "Приклад найманців"
vsh_taking_after_mercs_desc:0 "Роки економічного застою через найманців і міліції, які називають ці землі домом, дали Вартовам одну ідею: використати їхню ж тактику!"

vsh_building_a_home:0 "Будуємо дім"
vsh_building_a_home_desc:0 "Після виходу зі Сховища мешканці 107-го почали відновлювати Сейфгейвен і запрошувати сусідні міста. Деякий час це працювало — їхні переговорні навички вражали. Сейфгейвен став одним із небагатьох спокійних регіонів канадських прерій, що, втім, привернуло увагу найманців і блукачів. Так вони й висмоктали комерцію, яку ми так хотіли привабити."

vsh_building_a_home_2:0 "Будуємо дім"
vsh_building_a_home_2_desc:0 "Тепер, контролюючи більшість водної торгівлі в канадських преріях, Сейфгейвен позбавляється тягаря слабкої економіки, яку довго визискували заможні гості."

VSH_safehaven_grandpa:0 "Дідусь Сейфгейвену"
VSH_forgotten_militiaman:0 "Забутий ополченець"
VSH_sierra_hotel:0 "§CСьєрра-Готель§!"

vsh_rallies:0 "Мітинги!"
vsh_rallies_desc:0 "Щомісяця Вартовими та мерією Сейфгейвену організовується мітинг, що став невід'ємною частиною місцевої спільноти."

vsh_full_mercs:0 "Державне фінансування найманців"
vsh_full_mercs_desc:0 "Після років використання найманих загонів, Сейфгейвен вирішив фінансувати себе через такі експедиції. Тепер у очах пустки — це республіка найманців, добра лише для кровопролиття ворогів. Якщо у вас є кришки, ми готові."

vsh_sh_company:0 "Рота «Шитхед»"
vsh_sh_company_desc:0 "Колись це був лише жарт про «ідіотів» з Сьєрра-Готель, що мріяли бути спецпризначенцями. Кажуть, коли Брандт давав їм назву, він пробурмотів «Шитхед», а вони просто не розчули.\n\nТепер жарт інший: «Може, вони й пропустили перевал, але тільки вони мали достатньо духу, аби створити новий розділ і відтяти голову тому ченцеві»."

vsh_altruism:0 "Альтруїзм для всіх"
vsh_altruism_desc:0 "Ми справді хочемо допомогти втомленим душам пустки, тим, хто шукає надію та нове життя. Колись і ми, Вартові, шукали притулок. Тепер — ми самі його даємо."

vsh_showtime_idea:0 "Час шоу!"
vsh_showtime_idea_desc:0 "Мер Шоутайм популяризувала систему найманців настільки, що це стало основною професією жителів. Іронічно, але вона відновила ту саму модель управління, яку найманці колись нав’язали мешканцям Сховища. Хоч це і провал у її очах — жителі тепер багатші, ніж будь-коли."

vsh_showtimes_help:0 "Подвійне мерство"
vsh_showtimes_help_desc:0 "Після реформування Вартових, Мері вирішила, що керівництво не має бути одноосібним. Вона запросила свою найкращу подругу Шоутайм стати співмером і командиром Сейфгейвену. Найкращі подруги назавжди."

VSH_does_it_all:0 "Універсал!"
vsh_friends_of_liberty:0 "Друзі Свободи"

