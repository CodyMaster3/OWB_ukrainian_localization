time_scavenge_pre_war_desc:0 ""
time_scavenging_rescue_crisis:0 "Криза Часової Лінії"
time_scavenging_rescue_crisis_desc:0 "З нашими шукачами у часі щось трапилось! Чи варто послати рятувальний загін?"
time_scavenging_send_rescue_team:0 "Відправити Темпоральний Рятувальний Загін"
time_scavenging_send_rescue_team_desc:0 "Можливо, наших шукачів у часі ще можна врятувати. Не залишимо нікого позаду."
time_scavenging_underway:0 "Часові Грабіжники в Дії"
time_rescue_team_send:0 "Відправити Патруль Часу"
time_scavengers_lost:0 "Шукачі Зникли в Часі"

time_scavenge.1.t:0 "Найдавніша Історія Людства"
time_scavenge.1.d:0 "Подорож у доісторичні часи — найнебезпечніша або найбезпечніша. Людей менше, ризик впливу — менший, але наслідки змін — триваліші. На щастя, цього разу команда повернулася з цінним трофеєм!"
time_scavenge.1.a:0 "Цікаво. До зали допитів!"

time_scavenge.2.t:0 "Нема Чого Вчитися у Мисливців-Збирачів"
time_scavenge.2.d:0 "Світ до доріг і індустрії вражає своєю красою, але команда не знайшла нічого корисного."
time_scavenge.2.a:0 "Повернулися з одними лише ескізами."

time_scavenge.3.t:0 "Атака Шаблезубих Тигрів"
time_scavenge.3.d:0 "На цей раз ми прибули в епоху, де люди ще не були на вершині харчового ланцюга. Древні хижаки напали й розірвали десятки членів експедиції."
time_scavenge.3.a:0 "Жахливий день для наших людей і нашої нації."

time_scavenge.4.t:0 "Зникли в Імлі Часу"
time_scavenge.4.d:0 "Команда шукачів не вийшла на зв’язок. Випадковий ризик? Неправильна координата? Порушення протоколу?"
time_scavenge.4.a:0 "Чи варто ризикувати ще?"

time_scavenge.5.t:0 "Шукачів Часу Врятовано"
time_scavenge.5.d:0 "Слава рятувальній команді! Наші загублені шукачі повернулись — переважно цілі. Тіла загиблих також повернуто або знищено, щоб уникнути зараження минулого їхніми ДНК, хворобами та одягом.\n\nІ хоча хтось і міг їх помітити, їх сприймуть за янголів, демонів чи прибульців. Такі легенди трапляються всюди. І врятують наш слід."
time_scavenge.5.a:0 "Славний день для нас (і для історії світу)."

time_scavenge.6.t:0 "Шукачі Часу Загублені"
time_scavenge.6.d:0 "На жаль, нам не вдалося врятувати загін часових шукачів до втрати тимчасового з'єднання. Надіслати ще людей — означало ризикувати ще більше. І все ж, ми не можемо не хвилюватися: тіла й спорядження загиблих можуть змінити хід історії, якщо потраплять у чужі руки...\n\nХоча... якби історія і змінилась — чи помітили б ми це?"
time_scavenge.6.a:0 "Сподіваємось, вони не забруднять часову лінію."

time_scavenge.7.t:0 "Не Такі Темні, Як Здається"
time_scavenge.7.d:0 "Часовий загін повернувся з цінною знахідкою."
time_scavenge.7.a:0 "Цікаво. До зали допитів!"

time_scavenge.8.t:0 "Лицарі, Негідники й Нічого Корисного"
time_scavenge.8.d:0 "Історики, можливо, захопились би цим періодом, але наші команди мають концентруватись на практичному. Цього разу — без здобичі."
time_scavenge.8.a:0 "Повернулись із самими лише ескізами."

time_scavenge.9.t:0 "Захоплені Забобонними Місцевими"
time_scavenge.9.d:0 "Місцеві побачили стерильні комбінезони й... запанікували. Релігійна влада міста полонила більшість загону. Решта повернулась надто пізно — машина вже охолоджувалась. Їхня доля — невідома, але навряд щаслива."
time_scavenge.9.a:0 "Жахливий день для нашого народу."

time_scavenge.10.t:0 "Загублені в Темряві"
time_scavenge.10.d:0 "Загін не вийшов на зв’язок. Невже небезпека? Помилка координат? Порушення протоколу?"
time_scavenge.10.a:0 "Чи варто ризикувати ще раз?"

time_scavenge.11.t:0 "Із Часів Народження Націй"
time_scavenge.11.d:0 "Зміни епох формували майбутнє, зокрема й появу США, які й побудували наше Сховище. Команда передає — щось знайшли."
time_scavenge.11.a:0 "Цікаво. До зали допитів!"

time_scavenge.12.t:0 "Невдача Заздалегідь"
time_scavenge.12.d:0 "Місцеві цивілізації надто пильні. Наших розвідників помітили. Цей рейд провалено."
time_scavenge.12.a:0 "Повернулись із самими лише ескізами."

time_scavenge.13.t:0 "Прийняті за Лоялістів"
time_scavenge.13.d:0 "Наш акцент і таємничість викликали підозру — натовп революціонерів швидко стратив загін як шпигунів. Жменька вцілілих повертається для допиту."
time_scavenge.13.a:0 "Жахливо. Повернути тіла й спорядження."

time_scavenge.14.t:0 "Захоплені Хвилею Революцій"
time_scavenge.14.d:0 "Команда зникла. Чи були вони атаковані? Відхилились? Час тече не так, як ми хочемо."
time_scavenge.14.a:0 "Чи варто знову втручатись?"

time_scavenge.15.t:0 "Багатство Світової Війни"
time_scavenge.15.d:0 "Друга світова — величезний конфлікт і багате джерело. Часто саме тут з’являлась зброя, що випереджала Пустку на століття. І команда повернулась з гарною здобиччю."
time_scavenge.15.a:0 "Цікаво. До зали допитів!"

time_scavenge.16.t:0 "Нема Місця на Відступ"
time_scavenge.16.d:0 "Випали прямо на поле бою. Команда змушена була відступити — занадто небезпечно."
time_scavenge.16.a:0 "Повернулись із самими лише ескізами."

time_scavenge.17.t:0 "Потрапили в Засідку"
time_scavenge.17.d:0 "Між двох вогнів — команда розстріляна. Хто зміг — утік. Інші — загинули. Та принаймні ми не змінимо історію — бо всі мали лише тогочасну зброю."
time_scavenge.17.a:0 "Жахливо. Ми їх пам'ятаємо."

time_scavenge.18.t:0 "Невдалий Час, Невдале Місце"
time_scavenge.18.d:0 "Загін не вийшов на зв’язок. Вже вкотре. Що сталося цього разу?"
time_scavenge.18.a:0 "Чи варто ризикувати знову?"

time_scavenge.19.t:0 "Найсвіжіше й Найкраще"
time_scavenge.19.d:0 "Останні тижні перед Війною — скарб для шукачів. Мінімальний ризик парадоксів. Адже після падіння бомб — вже нічого не змінити."
time_scavenge.19.a:0 "Цікаво. До зали допитів!"

time_scavenge.20.t:0 "Засліплені Тим, Що Було"
time_scavenge.20.d:0 "Краса світу перед війною приголомшила наших шукачів. Після повернення вони проходитимуть психологічну оцінку."
time_scavenge.20.a:0 "Повернулись із самими лише ескізами."

time_scavenge.21.t:0 "Прийняті за Комуністичних Шпигунів"
time_scavenge.21.d:0 "Команду відправили всього за кілька днів до падіння бомб, щоб зменшити ризик наслідків. Але вони діяли занадто відкрито — й їх прийняли за «комуністів». Повернути їх уже неможливо, але принаймні довго їм протриматись не доведеться."
time_scavenge.21.a:0 "Жахливий день для наших людей і держави."

time_scavenge.22.t:0 "Втрачено Зв'язок біля Військової Бази"
time_scavenge.22.d:0 "Загін часових шукачів не вийшов на запланований зв'язок. Чи натрапили вони на небезпеку? Чи це була помилка? Порушення протоколу?"
time_scavenge.22.a:0 "Чи варто ризикувати далі?"

time_scavenge.101.t:0 "Кам'яна Зброя"
time_scavenge.101.d:0 "Команда привезла пізні зразки кам'яної зброї. Археологічно — неймовірно цінно, але як нам це використовувати?"
time_scavenge.101.a:0 "Ну... воно все ще може когось вбити."

time_scavenge.102.t:0 "Втрачені Рослинні Ліки"
time_scavenge.102.d:0 "Команда знайшла колекцію вимерлих рослин. Виявилось, що деякі з них мають потужні лікувальні властивості, які ми можемо використати."
time_scavenge.102.a:0 "На смак, правда, огидні."

time_scavenge.103.t:0 "Сила Людини"
time_scavenge.103.d:0 "Древні племена, що жили до аграрної революції, мали суворе життя. Їхня стійкість дивовижно відгукується в нашій боротьбі у Пустці."
time_scavenge.103.a:0 "Наші предки заслуговують на повагу."

time_scavenge.104.t:0 "Дикі Звичаї"
time_scavenge.104.d:0 "Древні племена, що жили до аграрної революції, мали суворе життя. Їхня стійкість дивовижно відгукується в нашій боротьбі у Пустці."
time_scavenge.104.a:0 "Наші предки заслуговують на повагу."

time_scavenge.105.t:0 "Основа Всіх Знань"
time_scavenge.105.d:0 "Команда випадково натрапила на молоде поселення. Здалеку вони спостерігали, як старші передають знання молодшим. Так розвивалося людство — покоління за поколінням, спираючись одне на одного."
time_scavenge.105.a:0 "Подяка першим вчителям."

time_scavenge.71.t:0 "Добротна Сталь"
time_scavenge.71.d:0 "На полі бою Середньовіччя команда знайшла автентичні мечі й сокири. Під час карантину після повернення — розмахують ними з ентузіазмом."
time_scavenge.71.a:0 "Нічого, крім того, що трохи короткуваті."

time_scavenge.72.t:0 "Лицарі Минулого"
time_scavenge.72.d:0 "Команда повернулась з частинами броні, знятої з полеглих воїнів. Після полірування й догляду вони ідеально підходять для виставки... або екіпірування охоронців."
time_scavenge.72.a:0 "Міцна річ, хоч і не захищає від куль."

time_scavenge.73.t:0 "Стародавні Поля Бою"
time_scavenge.73.d:0 "Команда записала відео з великої битви минулого. Це дало нам уявлення про тактики, втрачені у віках. До того ж — цікаво дивитись."
time_scavenge.73.a:0 "Це що, справжній мордгау?"

time_scavenge.74.t:0 "На Захист Своїх Домівок"
time_scavenge.74.d:0 "Переміщаючись крізь кілька суміжних періодів потрясінь, шукачі часу повернулися з новими знахідками. Як і сучасні племена, люди минулого часто змушені були самостійно захищати себе від спустошення війною."
time_scavenge.74.a:0 "Ми також лише прагнемо захистити наш дім — цей світ."

time_scavenge.75.t:0 "Королі й Замки"
time_scavenge.75.d:0 "Схоже, що шукачі часу трохи захопилися. Вони привезли додому кілька блискучих скарбів, викрадених із замку лорда за допомогою стелсбоя. Вражає, що вони змогли протягти стільки золота крізь час. Вони навіть вручили Наглядачеві Току корону й скіпетр!"
time_scavenge.75.a:0 "То це й є «божественне право»?"

time_scavenge.111.t:0 "Вогонь і Штик"
time_scavenge.111.d:0 "Цікаву колекцію принесли наші шукачі. Хоча мушкети без нарізів не дуже точні, їх легко забезпечити порохом і набоями для далеких походів. А якщо не вистрілять — завжди можна піти в штикову атаку."
time_scavenge.111.a:0 "Цілься добре, стріляй рідко."

time_scavenge.112.t:0 "Супутники Колоній"
time_scavenge.112.d:0 "Почавши з пошуків артефактів, команда вирішила використати нагоду й відновити чистоту собачого генофонду. Привезені до воєнні породи принесуть нам здоровіших песиків, ніж будь-коли."
time_scavenge.112.a:0 "Хто хороший хлопчик?"

time_scavenge.113.t:0 "Епоха Вітрил"
time_scavenge.113.d:0 "Уявіть собі: колись людство перетинало океани на кораблях. Команда повернулась із кресленнями вітрильників. Будівництво таких суден наразі нам не під силу, але сама ідея надихає."
time_scavenge.113.a:0 "Що робити з п'яним шукачем часу?"

time_scavenge.114.t:0 "Стійкість Батьків-Засновників"
time_scavenge.114.d:0 "Війни в ранній історії Америки надихають. Команди повернулись із артефактами й розповідями, які підіймають бойовий дух. Хоча технологій небагато, з цих подій можна винести важливі уроки."
time_scavenge.114.a:0 "А ми вже перетнули свій Делавер?"

time_scavenge.115.t:0 "Народження Республіки"
time_scavenge.115.d:0 "Свідчити революцію на власні очі — не дрібниця. Хоча їм довелося ховатись у тіні, атмосфера надії була заразною. У звітах — боротьба за свободу, братерство й рівність. Команда не може припинити говорити про це навіть під час звіту."
time_scavenge.115.a:0 "Vive La République!"

time_scavenge.151.t:0 "Симпатія Стрільців"
time_scavenge.151.d:0 "Команда повернулась із купою новеньких гвинтівок. Кажуть, забрали їх із сховища перед самим початком бойових дій."
time_scavenge.151.a:0 "От хто стріляє просто в ціль."

time_scavenge.152.t:0 "Вогнева Міць, Що Зупиняє Серце"
time_scavenge.152.d:0 "Обійшовши втомлену варту, команда дісталась до складу кулеметів. Тепер, через понад 300 років, вони знову служать у війні."
time_scavenge.152.a:0 "Ідеальні для утримання окопів."

time_scavenge.153.t:0 "Зміна Доктрин"
time_scavenge.153.d:0 "У нас майже не лишилось записів про Другу Світову та пов’язані з нею конфлікти. Нові матеріали, які принесли шукачі часу, допоможуть нам зрозуміти, як тоді воювали."
time_scavenge.153.a:0 "Класика військової науки в дії."

time_scavenge.154.t:0 "Бліцкриг У Дії"
time_scavenge.154.d:0 "Швидкість, раптовість, вогнева міць. З правильним поєднанням цих факторів мало хто у Пустці зможе нам завадити."
time_scavenge.154.a:0 "А може, ми теж зможемо це застосувати?"

time_scavenge.155.t:0 "Контратака Союзників"
time_scavenge.155.d:0 "Хоч ми й не маємо сотень тисяч солдатів, ми також не маємо логістичної машини минулого. Наша техніка переважає, та брак досвіду й людей усе ще стримує. Команди шукачів працюють над тим, аби задокументувати війну."
time_scavenge.155.a:0 "Добре хоч знаємо, чим ця війна закінчилась."

time_scavenge.191.t:0 "Найкраще Американське"
time_scavenge.191.d:0 "Нарешті зброя, що вартує уваги! Знайти справні плазмові гармати було непросто, але ми зуміємо використати їх краще, ніж ті, кому судилось загинути."
time_scavenge.191.a:0 "Оце я розумію вогнева міць!"

time_scavenge.192.t:0 "Китайські Ламачі Броні"
time_scavenge.192.d:0 "Поставлені на передову проти американської силової броні, ці гаусові гвинтівки досі цінні й у наш час. Адже охочих знову вдягти стару броню вистачає."
time_scavenge.192.a:0 "Чужа зброя вбиває не гірше своєї."

time_scavenge.193.t:0 "На Гострі Технологій"
time_scavenge.193.d:0 "Обходити патрулі й камери в постійно настороженій країні було важко, та наші шукачі принесли креслення передових технологій. Розшифруємо — і станемо на крок ближче до спасіння світу."
time_scavenge.193.a:0 "Це надзвичайно важливе відкриття."

time_scavenge.194.t:0 "Останні Тактичні Розробки"
time_scavenge.194.d:0 "Хоч це й було ризиковано, шукачі дістали навчальні посібники та бойові плани з минулого. Завдяки ним ми краще розуміємо, як виглядала війна перед кінцем."
time_scavenge.194.a:0 "Ось як вони воювали..."

time_scavenge.195.t:0 "Вони Викрали ЩО?!"
time_scavenge.195.d:0 "Ми досі не розуміємо, як повнорозмірний вертиптах пройшов крізь портал. Коли спитали, як це вдалося, команда лише жартувала. Але, справді, хто би повірив у «тестовий політ за дозволом уряду»?"
time_scavenge.195.a:0 "Вивчити все, що можна!"

