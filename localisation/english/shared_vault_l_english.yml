### Сейфгейвен – опис лідерів
VSH_MAYOR_SHOWTIME_NAME: "Мер Шоутайм"
VSH_MAYOR_SHOWTIME_DESC: "Мер Шоутайм, названа так за дитячу звичку вигукувати «це шоу-тайм», є останнім представником, обраним об’єднаними громадами Безпечного Притулку. В її очах блищить надія — вона вірить, що Сейфгейвен може стати силою добра не лише для свого народу, а й для всієї Пустки. Саме її рішучість стримала Велику Череду від переправи через річку, і саме її плани дозволили нещодавно пограбувати скарби Міддлмарка — хоча, з іншого боку, саме вона впустила Сторожів, що неабияк непокоїть багатьох найманців і злочинців, які мешкають у Сейфгейвен.\n\nВона намагається підтримувати мир, та починає розуміти заклики до війни з боку більш войовничих громадян. Вона навіть озброює найвразливіших мешканців — іноді дивним чином «втрачаються» кілька рушниць. А в Сейфгейвен зброї вистачає..."

VSH_legacy_of_sierra: "Спадок «Готель Сьєрра»"

VSH_MARY_MULLIGAN_NAME: "Мері Малліган"
VSH_MARY_MULLIGAN_DESC: "§C«Готель Сьєрра повернувся, і ми прагнемо помсти. Помсти тим, хто скривдив Сторожів. Ми обіцяємо віддячити Сейфгейвен сторицею, але маємо нову місію».§!\n\nМері Малліган та «Готель Сьєрра Компані» перемогли на виборах у відродженій спільноті Сейфгейвен. Громада обрала їх провідниками у нове майбутнє. Хоча багато хто радіє, що улюблене парамілітарне угрупування знову мандрує пустками під гаслом «справедливості» та «відплати», деякі з колишніх чиновників стривожені: це рішення може зруйнувати не лише Сейфгейвен, а й усе Канадське Прері.\n\nМері прагне довести, що вони помиляються... хоч і у свій власний спосіб."

### Сейфгейвен – радники
VSH_SHOWTIME_ADV_DESC:0 "«§YЗнаєш, я з’їла достатньо підошов, щоб знати, які мундири слід носити.§!»\n\nМер Шоутайм у своїй короткій політичній кар’єрі вже була секретарем, усіма членами кабінету, й прибиральницею. А після смерті попередника від застуди — ще й найдовше чинною головою Сейфгейвен. Ця посада зазвичай швидко залишалась задля вигідного вступу до найманських гільдій, які паразитують на системах притулку.\n\nПісля злиденного дитинства вона пообіцяла викорінити бідність у своїй нації. Навіть якщо це означає залишити злочинне минуле позаду. Але ж Vault 107 мав виховати гладкоязих зрадників..."

VSH_MARY_MULLIGAN_ADV_DESC:0 "§C«Що значить — Мер Шоутайм? Отруїти їм воду було б ще гуманно, е-е... добре, пошукаю альтернативу».§!\n\nПопри те, що «Готель Сьєрра» більше схожий на гільдію в межах Сейфгейвен, його представниця Мері Малліган неабияк допомогла Меру Шоутайм. Вона навчила її професійних технік, тактик і процедур, які застосовували Вартові Білини до свого падіння. Вони майже одноосібно перетворили Сейфгейвен з прихистку для найманців на державу з обороною.\n\nМер щиро вдячна Мері й зробила її своєю правицею. Хоча багато найманців, які називають ці землі домом, не в захваті. Бажання Мері об’єднати міліції псує популярність Шоутайм, однак на її думку — все це задля безпечнішого і багатшого Сейфгейвен, навіть якщо сама Мері у цьому не впевнена..."

VSH_DON_SPANGLE_NAME:0 "Ґ. Дон Спенґл"
VSH_DON_SPANGLE_DESC:0 "§Y“Стати кимось? Та що це за маячня? Ні... Ні, мене звати Дональд... Але для тебе я просто Дідусь.”§!\n\nКолись великий і впливовий чоловік, улюбленець багатьох злочинних родин, які постали після заснування Сейфгейвена у сховищі, Дон відмовився від того життя. Тепер він — дідусь для сиріт північних пусток, і наполягає, щоби так до нього і звертались. Створюючи сиротинці по всьому Сейфгейвену, борючись із работоргівлею, фінансуючи експедиції задля порятунку загублених дітей, надаючи їм освіту та турботу, він вивів їх із тіні занепаду — і захистив від гнилі Сейфгейвена та решти північного фронтиру.\n\nДля нього злочин — це не крадіжки чи рейди. Це крадіжка дитинства, а ще гірше — життя.\n\nДон мало що знає про цих Вартових, але якщо вони вбивають рейдерів і виродків, що лізуть до його дітей — вони вже молодці. Вони ще й стримують «темніші» гільдії від жахливих речей, відвідують сиротинці, навчають дітей ближнього бою та виживанню. Але вночі, коли діти вже сплять, а в нього в руці чарка — він може поділитися: якби Вартовів було більше раніше, його дочка і онук досі були б живі. Хоча на тверезу голову він про це ніколи не говорить. Що ж сталося того дня — саме це, мабуть, і поклало початок благородному шляху благодійника, яким зараз іде дідусь Спенґл..."

VSH_GULL_BRUN_NAME:0 "Ґаллівер Брансвік"
VSH_GULL_BRUN_DESC:0 "§G“ТАК, МИ ПРАВИМО! МІЛІТАНТ ДОҐС ПРАВЛЯТЬ! ТАК— Що? Ти нас знаєш?”§!\n\nМалі, погано озброєні, але подекуди доволі тямущі завдяки сиротинцям у Сейфгейвені, місцеві ополчення здебільшого складаються з ветеранів колишніх справ, які хочуть передати свої ідеали молодому поколінню. Вони розповідають байки, обіцяють багатство, владу або те, що заманеться. Та це приваблює мало кого. «Мілітант Доґс» приваблюють ще менше — від сили десять-двадцять старих буркотунів, які збилися у фан-клуб старечих пригод.\n\nВтім, є нюанс — вони добровільно вступають до лав армії Сейфгейвена. А колись вони були популярним кланом, хай і трохи культовим. Ім’я клану досі викликає ностальгію, тож сам факт приналежності до нього здатен дати високу посаду.\n\nҐаллівер Брансвік, останній з МДС, про це не знав, коли підписався як єдиний доброволець. Коли старі померли, він вирішив використати свою посаду для добра. Випадкова слава принесла йому місце в командуванні, а тепер він розвиває військо Сейфгейвена. Щоправда, не тільки з альтруїзму — він хоче відродити «Мілітант Доґс» і зробити їх відомими знову... хай навіть доведеться знищити кілька націй."

###safehaven loc - focus

vsh_white_collar_life:0 "Життя офісного планктону"
vsh_white_collar_life_desc:0 "Навіть серед покидьків трапляються споріднені душі. Іноді."

vsh_the_mark_expedition:0 "Експедиція до Міддлмарку"
vsh_the_mark_expedition_desc:0 "На заході від Саскачевану якось підозріло затихло... Але схоже, що щось знову починається. Ми ж відправили туди кількох хлопців... Цікаво, як вони там?"

vsh_community_development:0 "Розвиток громади"
vsh_community_development_desc:0 "Люди в Сейфгейвені прагнуть єдності. Саме тому ми й вижили. Тож ми вирішили — точніше, мер Шоутайм вирішив — прийняти Вартових, бо ті добряче дістали, і їм потрібен дім."

vsh_the_peoples_militia:0 "Народне ополчення Сейфгейвена"
vsh_the_peoples_militia_desc:0 "У кожній барній розмові в Сейфгейвені вам скажуть: найкраще тут те, що кожен сам за себе. Немає армії, немає мундирів — окрім мера, але всі люблять мера Шоутайма. Бо кожен мешканець — уже частина армії."

vsh_every_man_a_dog:0 "У кожного має бути пес"
vsh_every_man_a_dog_desc:0 "Кожен чоловік, жінка й дитина в Сейфгейвені має мати свого пса, який відчує небезпеку. Заводимо всім охочим цуценят!"

vsh_emphasize_community:0 "Життя разом"
vsh_emphasize_community_desc:0 "Згідно з журналами Оверсіра, вони чекали, що ми пересваримось і знищимо одне одного. Просто посадили зграю виродків у яму й дивились, що буде. Але виявилось: коли пацюків закрити в одній клітці з обмеженими ресурсами — вони стануть командою."

vsh_we_believe_in_each_other:0 "Ми віримо одне в одного"
vsh_we_believe_in_each_other_desc:0 "Сейфгейвен тримається на взаємній довірі. Без неї ми ніхто. Навколо нас суцільний бруд — і тільки разом ми здатні не впустити його в дім."

vsh_peoples_coalition:0 "Майбутнє Сейфгейвена..?"
vsh_peoples_coalition_desc:0 "§YЗ ПИСЬМОВОГО СТОЛУ МЕРА ШОУТАЙМА.§!\n\nМи зростаємо — тож зростаймо ще більше. Найманці минулого мали рацію: гроші дають силу, сила визначає правду, а народна коаліція повинна підтримувати те, що правильно. Це наша ініціатива."

vsh_mark_scavenged:0 "Операція: Візкові штовхачі"
vsh_mark_scavenged_desc:0 "Запчастини зі старих роботів Пенні ми можемо переробити. А ще ці 'асоційовані' виявились доволі талановитими. Спробуємо трохи посіяти хаосу, га?"

vsh_the_stampede_is_gone:0 "Галоп згас"
vsh_the_stampede_is_gone_desc:0 "Виявляється, що жменька скажених з важким озброєнням здатна змінити ситуацію. І багато хто це зрозумів після нашого наведення порядку."

vsh_kidnap_joy:0 "Операція: Кілджой"
vsh_kidnap_joy_desc:0 "Мері має план. Не каже який, лише що він прославить нас. Вона ще не підводила, то чого боятись? — Чекай, Джой це ж... це ж їхня дитина?! Вона не..."

vsh_moosejaw_conquered:0 "Нагорода мисливця"
vsh_moosejaw_conquered_desc:0 "Ми давно дружили з цими пацифістами, але тепер їм буде спокійніше, якщо вони дотримуватимуться миру вже в межах наших кордонів."

vsh_rad_hazards_conquered:0 "Сумні виродки"
vsh_rad_hazards_conquered_desc:0 "З цими гулями у нас ніколи не було проблем. І якщо ми керуватимемо їхніми землями — нехай і далі купаються у своїх радіаційних калюжах. Можливо, Ґабба нам навіть допоможе зробити таблички..."

vsh_old_friends:0 "Операція: Бумеранг"
vsh_old_friends_desc:0 "Може, настав час, щоб Вартових нарешті почули..."

vsh_operation_safe_house:0 "Операція: Сховище"
vsh_operation_safe_house_desc:0 "Вартові повернулись — і цього разу по помсту. Північ давно чудить, час довести, що з Вартовими не жартують."

vsh_mark_miscounts:0 "Нові друзі Міддлмарку..."
vsh_mark_miscounts_desc:0 "Деякі охоронці повідомляють про активність на нашому східному кордоні. Перевіримо."

vsh_merc_homes:0 "Чистка найманських притулків"
vsh_merc_homes_desc:0 "Досить дозволяти арміям пусток перетворювати наші землі на ігровий майданчик. Настав час висунути їм вимоги — вони повинні служити як і будь-який громадянин Сейфгейвена."

vsh_miscount_muster:0 "Заклик Міскантів"
vsh_miscount_muster_desc:0 "Пенні та Фраєр Блек підбурюють частину наших людей приєднатися до «Готель Сьєрра»."

vsh_attacking_the_stampede:0 "Знищити Стадо"
vsh_attacking_the_stampede_desc:0 "Операція: Електрошокер? Та годі вам із цим стильно-варденським лайном — назвімо речі своїми іменами: треба вдарити по Зграї першими. Кращий захист — це напад, тож... зламаємо їм все, поки не зробили це з нами."

vsh_ready_for_stampede:0 "Затримати Зграю"
vsh_ready_for_stampede_desc:0 "Варто облаштувати кілька форпостів, бо сусіди-гіганти за річкою можуть застати нас зненацька. Тож ми окопуємось."

vsh_all_for_one:0 "Всі за одного..."
vsh_all_for_one_desc:0 "Сьогодні — перший хороший день у Сейфгейвені: чисті вулиці, стабільна економіка, міцні позиції. Це варто святкувати. Але не забудьмо про гіганта на нашому порозі. Можливо, варто дати людям слово щодо майбутнього."

vsh_wardens_takeover:0 "Операція: Дядько Сем"
vsh_wardens_takeover_desc:0 "Час діяти. З підтримкою мера Шоутайма і новобранцями в Готель Сьєрра ми готові до більшого. Тож не питай, що Вартові можуть зробити для тебе, Сейфгейвен, а що ти можеш зробити для Вартових і тітки Мері! ХУ-РА!"

vsh_middle_dues:0 "Операція: Служба підтримки"
vsh_middle_dues_desc:0 "Місканти занадто довго кололи око нашим людям. Випиляймо їх остаточно. Це дасть надію прикордонним громадам Міддлмарку — а там і дипломати підключаться."

vsh_foxtrot_uniform:0 "Операція: Пошлите їх"
vsh_foxtrot_uniform_desc:0 "Гарна новина — або ні? Інші Вартові вижили після падіння Сіетлу — ті самі педантичні 'Фокстрот Юніформ'. Зустріч запланована. Хай не зірветься..."

vsh_operation_cold_opening:0 "Операція: Холодне відкриття"
vsh_operation_cold_opening_desc:0 "Пора заявити про себе не просто як Вартові Сейфгейвена, а як Вартові всієї округи. Для цього нам потрібен сухопутний коридор до Вашингтону."

vsh_operation_seattle_sunset:0 "Операція: Захід Сіетлу"
vsh_operation_seattle_sunset_desc:0 "§CІЗ СТОЛУ МЕРІ МАЛЛІҐАН.§!\n\nЧас повернути Сіетл. Досить і так — з братками і туземцями покінчено."

vsh_operation_head_home:0 "Операція: Вечеря"
vsh_operation_head_home_desc:0 "Ми довели свою вартість, піднесли голову як вибачення за дезертирство. Тепер час повертатись. Надіємось, нас зустрінуть не лише холодні серця."

vsh_operation_gyst:0 "Операція: Р.З.С.Л."
vsh_operation_gyst_desc:0 "Р.З.С.Л. — Розберіться зі своїм лайном. Мені подобається як це звучить. Час показати Канаді, хто справжні герої. Ми подамо приклад, знищивши цю кляту роботесу Пенні і її мікроармію. Спочатку трохи приберемось — і вперед!"

vsh_operation_kicking_stampede:0 "Операція: Вдаримо по кобилі"
vsh_operation_kicking_stampede_desc:0 "У Пристанищі вже дістають скигленням про Зграю і те, що ми досі не знищили їхню тиранію. Ну що ж — виправимо це. І досить вже топтатись у кінському лайні."

vsh_one_for_all:0 "Один за всіх!"
vsh_one_for_all_desc:0 "Мері виграла вибори, організовані нашою міліцією! Відтепер ми робимо все, як вона скаже — і вона обіцяє, що дбатиме про кожного свободу-люблячого виродка в цьому місті!"

vsh_a_new_beginning:0 "Назад до основ"
vsh_a_new_beginning_desc:0 "Маємо переосмислити доктрини Вартових. А ще добре б закріпити, що ми передусім — громадяни Сейфгейвена. Хоча з назвою 'Вартові' ще не варто прощатись... правда?"

vsh_knowledge_exchange:0 "Уроки від Скелястих Горців"
vsh_knowledge_exchange_desc:0 "О Боже... родзинки... такі смачні..."

vsh_protection_without_a_fee:0 "Захист без плати"
vsh_protection_without_a_fee_desc:0 "Бути найманцем — переоцінено. Люди щасливіші, коли знають: їх прикривають не за ковпачки, а по-дружньому."

vsh_wardens_of_canada:0 "Допомога там, де знайдено"
vsh_wardens_of_canada_desc:0 "Ми вже деякий час обираємо шлях миру. Але настав час і трохи зачистити сусідів-диктаторів, заради справедливості."

vsh_operation_rally:0 "Операція: Агітація"
vsh_operation_rally_desc:0 "Вибори дещо зіпсували наші відносини з мером, але ми все ще хочемо співпрацювати. У нас спільний план — мітинги, що зміцнять політичний вплив!"

vsh_showtime:0 "Час шоу!"
vsh_showtime_desc:0 "Шоутайм вирішив — досить боятись! Хватить ховатись у бункерах — ми не підстилки. Ми боротимемось за своє!"

vsh_empty_fields:0 "Порожні поля"
vsh_empty_fields_desc:0 "Все, ми перемогли ту парочку. Але вони не погані люди — просто налякані. Відпустімо їх з кіньми — хай народ побачить, що таке справжня справедливість."

vsh_government_time:0 "Сейфгейвен для всіх"
vsh_government_time_desc:0 "§YЗІ СТОЛУ МЕРА ШОУТАЙМА.§!\n\nМи не завойовуємо — ми поширюємо свободу. Для миру, для народу, для кращого Сейфгейвена."

vsh_this_side_of_the_river:0 "Цей бік річки"
vsh_this_side_of_the_river_desc:0 "Зміцнимо життя тут. Сейфгейвен має стати ще сильнішим."

vsh_miscount_discount:0 "Знижка на Міскантів!"
vsh_miscount_discount_desc:0 "Досить думати, чи Міддлмарк — потенційний союзник. Їхня ненависть до Вартових і Сейфгейвена каже все. Ми йдемо на війну. А ще — уяви, автоматизований супермаркет у нашому підпорядкуванні. Круто, еге ж?"

vsh_recruitment_hub:0 "Центр набору найманців"
vsh_recruitment_hub_desc:0 "Завдяки новій поправці (не те щоб закон щось значив, коли мер має повну владу), найманці можуть офіційно працювати на SH. Їм безпечніше, а нам — прибуток."

vsh_moving_back_into_offices:0 "Відродження Міддлмарк Corporate"
vsh_moving_back_into_offices_desc:0 "Наші вчені з притулку перепрограмували Пенні та її роботів. Тепер ми відродимо корпорацію. Але не для того, щоб панувати над людьми — а над машинами. Бо працювати в супермаркеті — лайно."

vsh_only_one_mercenary:0 "Монополія на найманців"
vsh_only_one_mercenary_desc:0 "На цьому континенті мало бабла для всіх. І чому б не працювати на SH? Шоутайм вирішив: треба розчавити конкурентів поки ми на коні."

vsh_put_them_on_our_payroll:0 "Платимо їм — контролюємо їх"
vsh_put_them_on_our_payroll_desc:0 "Наймаючи колишніх найманців як окупаційні сили, ми вбиваємо двох мутантів одним каменем і закріплюємо лояльність."

