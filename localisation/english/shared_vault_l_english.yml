# shared vault events

gen_vault.1.t:0 "Готуйся до майбутнього"
gen_vault.1.d:0 "Не секрет, що деякі Сховища не були створені з турботою про мешканців. Декотрі були контрольними, але чимало з них мали... інші цілі. Деякі були по-справжньому жахливими — усе в ім’я науки!"
gen_vault.1.a:0 "Наше було більш-менш нормальним."
gen_vault.1.b:0 "Там було дещо дивне..."
gen_vault.1.c:0 "Жахіття..."

gen_vault.2.t:0 "Забронюй своє місце сьогодні!"
gen_vault.2.d:0 "Згодом Наглядачу довелося ухвалити важке рішення: відчиняти двері Сховища чи ні. Поверхня була небезпечною, але там були люди, які могли допомогти — або вбити нас усіх!"
gen_vault.2.a:0 "Ми нікого не впускаємо."
gen_vault.2.b:0 "Торгівлі завжди знайдеться місце!"
gen_vault.2.c:0 "Ніколи не пізно для нових сусідів!"

gen_vault.3.t:0 "Який у тебе план?"
gen_vault.3.d:0 "Ми прийняли чи відкинули світ зовні — та нам усе одно треба бути готовими. Наглядач мудрий (мабуть), і має надійний план, як пережити майбутнє. Питання лише — який саме?"
gen_vault.3.a:0 "Забарикадувати двері та молитися, щоб ніхто не постукав."
gen_vault.3.b:0 "Пустку слід відвоювати силою."
gen_vault.3.c:0 "Перепрофілюємо машини Сховища під нові потреби."

gen_vault.4.t:0 "Нове покоління охорони"
gen_vault.4.d:0 "Хоча розв'язання конфліктів — важлива навичка згідно з інструкцією Наглядача, деякі особи на поверхні просто не бажають нас слухати. Якщо доводиться битися, варто спрямувати найкращі наші ресурси на створення «Супер Охоронних Команд»."
gen_vault.4.a:0 "Силова броня — вершина конфлікту (після компромісу)"
gen_vault.4.b:0 "Броня спецпризначенців не така громіздка (і дорога), як СБ"
gen_vault.4.c:0 "Що не так зі старою формою охорони Сховища?"
gen_vault.4.e:0 "Кожен охоронець — супергерой!"

gen_vault.5.t:0 "Правда про Vault-Tec"
gen_vault.5.d:0 "Чим більше Сховищ ми відкриваємо, тим очевиднішою стає істина: ці споруди не були створені для порятунку людей. Деякі, можливо, справді виконали свою роль, але більшість — частина великої змови. Довоєнний уряд і Vault-Tec проєктували більшість Сховищ як жорстокі, нелюдські експерименти над мешканцями. Це були або маніпулятивні соціальні досліди, або випробування небезпечних технологій на полонених людях. Більшість знайдених нами Сховищ — це могили або притулки безумства."
gen_vault.5.a:0 "Але... ми й так це знали."
gen_vault.5.b:0 "Та подивіться на успішні приклади!"
gen_vault.5.c:0 "Може, ці експерименти мали вищу мету."
gen_vault.5.e:0 "Це жахливо... але ж вони врятували декого з нас."
gen_vault.5.f:0 "Скільки б могло вижити, якби не жадібність."
gen_vault.5.g:0 "Це багато що пояснює."

# Vault 27 — наглядач
VLS_OVERSEER_KNOX_NAME:0 "Наглядач Нокс"
VLS_OVERSEER_KNOX_DESC:0 "У Томаса Нокса є проблема, хоча він ніколи не визнає цього вголос. Стук. Ледь чутний, як цокання по металу, та він не припиняється. Вдень і вночі, в офісі чи порожніх коридорах — завжди десь поруч, завжди за спиною.\n\nVault 27 з самого початку був приречений — лабіринт нестачі, перенаселення і напруження, так щільно сплетений, що мав би зламатися ще роки тому. Але не зламався. Наглядачі до нього не витримували, а Нокс тримається. Він мікрокерує кожною калорією, рахує кожне ліжко, планує кожне народження. Порядок понад милосердя. Цифри мають зійтися.\n\nАле... стук не зникає. Він наказував ремонтникам розбирати стіни, інспекторам обстежувати вентиляцію, ставив охорону біля гермодверей. І нічого. Лише метал і тіні.\n\nХтось каже — це труби. Інші шепочуть про неспокійні душі чи щось інше — те, чого не було в офіційних кресленнях Vault-Tec. Нокс не вірить у примар. Він вірить у норми, розклад пайків і демографічні графіки.\n\nТа коли він сидить на самоті в офісі, з ручкою над черговим похмурим звітом, і знову чує стукіт — цього разу ближче — йому мимоволі спадає на думку: а що, як хтось там справді стукає у відповідь?"

vls_crammed_vault:0 "Тук-Тук"
vls_crammed_vault_desc:0 "Більшість у Сховищі 27 турбують не вузькі коридори чи нескінченні обличчя — а звуки. Ледь чутне постукування, ритмічні удари. Їх чути в стінах, у вентиляції, навіть у підлозі під ліжком. Колись з цього жартували, називали «ритмом Стукача», але тепер нікому не смішно. Коли місця так мало, кожен стукіт здається зверненим саме до тебе."

vls_ghost_division_focus:0 "Бригада Примар"
vls_ghost_division_focus_desc:0 "Бригада Примар — вони не просто крокують, вони стукають. У них дивне повір’я: двічі постукати по шолому перед боєм, двічі — по дверях перед входом до кімнати. Одні кажуть, це на удачу, інші — що це для «Них» — тих, хто стукає з моменту закриття Сховища. Вони приносять все, що потрібно Сховищу, але розповіді про їхні рейди стають щораз дивнішими. Припаси з порожнечі. Зброя, що шепоче. І завжди... завжди стукіт."

vls_biggest_little_vault:0 "Майстерня Стукачів"
vls_biggest_little_vault_desc:0 "Vault-Tec лишив нам інструменти — екскаватори, бурильні установки, машини для підземного будівництва. Але щойно починається копання — починається і стукіт. Гучніший, різкіший, майже... сердитий. Інженери жартують, що «розлютили Стукачів», коли натрапляють на несподівану сталеву стіну або чують відлуння, якого не мало б бути. Але майстерня гуде, і Сховище росте — вгору, вниз, убік. Тук-тук, Vault-Tec."

# TODO: get prov name by variable
vls_chance_of_a_lifetime:0 "Двічі — на удачу"
vls_chance_of_a_lifetime_desc:0 "Досягнення Вейлс-Річ стало спокусливою метою, і Примари вже мають план — розкрити його, як стару сталеву бочку. Кажуть, Томас Нокс наказав стукати двічі перед тим, як ламати ворота чи сейфи — завжди двічі, ніколи тричі. Чому — більше ніхто не питає. Ті, хто слухає уважно, почують відповідь на вітрі."

vls_settlers_from_below:0 "З Порожніх Залів"
vls_settlers_from_below_desc:0 "Покоління жителів мріяли про сонце, свіже повітря і дім без гулу рециркуляції повітря. І ось цей шанс настав. Але, вже оселившись нагорі, дехто клянеться, що й досі чує ледь чутний стукіт з-під землі — ніби саме Сховище кличе їх назад, один порожній удар за раз."

vls_no_more_food_stamps:0 "Тук-Тук Урожай"
vls_no_more_food_stamps_desc:0 "Гідропонні ферми підтримували нас живими, але насилу. Тепер, із справжніми теплицями під відкритим небом, ми нарешті матимемо справжню їжу. Та деякі поселенці почали позначати поля дивними кам’яними вежками — купками каміння, зарубками на деревах. Кажуть, це відлякує «Їх». Нокс не сказав про це й слова... але й не зупинив."

vls_more_breathing_space:0 "Більше повітря"
vls_more_breathing_space_desc:0 "У кращі часи Чорний Каньйон — це безладне, небезпечне пекло. Настав час дати гідним людям із Сховища 27 той простір, якого вони заслуговують!"

vls_fresh_air:0 "Небо вгорі, стукіт унизу"
vls_fresh_air_desc:0 "Уперше наглядач Нокс прокинувся під відкритим небом, сонячне світло заливало йому обличчя. Та навіть тут, посеред полів і свіжого повітря, він завмер. Під шумом цикад і шелестом трави — воно знову. Ледь чутно, але безсумнівно — тук, тук, тук. Десь там, стукіт триває."

vls_ghosts_in_the_shell:0 "Крокуючи в ритмі"
vls_ghosts_in_the_shell_desc:0 "Дивізія Примар не воює за честь і не заради виживання — їх щось жене вперед. Щось у їхніх чорних шоломах, у порожніх кроках, говорить про невідворотність. Вони рухаються моторошно синхронно, важкі черевики відбивають той самий ритм, який Томас чує в стінах. Що б там не було у Пустці... воно марширує разом із ними."

vls_open_vault_riches:0 "Останній стукіт Сховища"
vls_open_vault_riches_desc:0 "Коли двері Сховища скрипнули, і мешканці кинулися назовні, вагові пластини спрацювали, запускаючи останню пастку. Потайні кімнати відкрились, відкривши запаси інструментів, провізії й давно забутих розкошів. Наглядач Нокс швидко й тихо зачинив їх знову. Але разом із відкриттям прийшло ще дещо — щось ледь чутне, щось... що стукало."

vls_spacey_vault:0 "Відкрий стіни — випусти стукіт"
vls_spacey_vault_desc:0 "Жодних тісних ліжок. Жодних нескінченних черг до вентиляції чи пайків. Люди зі Сховища 27 вільні — під відкритим небом і на відкритій землі. Але дехто з них досі озирається на двері Сховища, ніби чекає, що щось — або хтось — вийде слідом. І в тиші присмерку лишається одне незакінчене питання:\n«Хто весь цей час стукав?»"

### Ідеї Сховища 27
vls_ghost_division:0 "Бригада Примар"
vls_ghost_division_desc:0 "Колишні мешканці, тепер — легенди у чорній силовій броні, Примари — меч і щит Сховища 27. Але їхня легенда стає дедалі химернішою після кожного рейду. Вони стукають перед входом до руїн, стукають перед герметизацією шлюзів, стукають двічі перед пострілом. Одні кажуть — це ритуал, інші — що це повага. Але ніхто не наважується запитати, чому."

vls_ghost_army:0 "Марш Стукачів"
vls_ghost_army_desc:0 "Коли Примари вирушають у похід, світ прислухається. Ритм їхнього маршу лунає через усю Пустку — звук, схожий на далекі громи... або порожній стукіт по сталі. Вони більше не пояснюють своїх дій. Вони марширують, вони стукають, і вони завойовують."

vls_full_vault:0 "Стукіт у кожному куті"
vls_full_vault_desc:0 "Навіть тепер, коли повітря більше й простору достатньо, дехто з мешканців каже, що стукіт не припинився. Вони чують його в теплицях, у млинах, і в порожнечі між речами. Що б це не було — чи є — воно досі слухає."

vls_open_vault:0 "Відкрите Сховище — відкритий стукіт"
vls_open_vault_desc:0 "Сховище відкрите, повітря свіже, а стукіт... тихіший. Поки що."

###vault27 події

vls_vault.1.t:0 "Наш Єдиний Шанс"
vls_vault.1.d:0 "Збройна банда відкололась від Відбирачів і захопила Вейлс-Річ. Чорний Каньйон занадто дезорганізований, щоб організувати оборону. Проте наші Привиди знають ці землі краще за будь-кого та легко можуть визволити місто. Повернемо його Чорному Каньйону чи заберемо собі?"
vls_vault.1.a:0 "Місто буде нашим!"
vls_vault.1.a_tt:0 "Ми атакуємо повстанців Відбирачів безпосередньо та захопимо місто собі!"
vls_vault.1.b:0 "Будьмо добрими сусідами"
vls_vault.1.b_tt:0 "Ми спершу зв’яжемося з Чорним Каньйоном та працюватимемо разом, щоб визволити місто"
vls_vault.1.c:0 "Місто буде нашим!"

vls_vault.2.t:0 "Примарний Удар"
vls_vault.2.d:0 "Лише Дивізія Привидів здатна на таємні дії у силовій броні. Вони пішли прихованими торговими маршрутами та швидко оточили місто, винищивши загарбників і врятувавши майже всіх мешканців. Вейлс-Річ без вагань прийняв контроль над Сховищем 27, а солдати Чорного Каньйону відмовились від будь-якого спротиву."
vls_vault.2.a:0 "Устя Долини — наше!"

vls_vault.3.t:0 "Уперті Браміни"
vls_vault.3.d:0 "Чорний Каньйон заявив, що не потребує нашої допомоги, і наказав Привидам залишити територію. Їхні \"переговори\" переросли у двогодинну перестрілку, що завершилась загибеллю обох армій і більшості цивільних. Тепер Привиди готові завершити зачистку та утримати місто."
vls_vault.3.a:0 "Уперті виродки... на штурм!"

vls_vault.4.t:0 "Добра Воля — Добра Справа"
vls_vault.4.d:0 "Чорний Каньйон охоче прийняв нашу допомогу. Їхні міліції відволікали ворога зі сходу, поки Дивізія Привидів тихо проникла із заходу та знищила загарбників, врятувавши кожного мешканця. Тепер народ Нерроу також просить підтримки Сховище 27, фактично передаючи весь регіон під наш контроль."
vls_vault.4.a:0 "Ця штука — «карма» — схоже, працює."

### цілі Timekeepers

clk_tick:0 "Тікаюче Сховище"
clk_tick_desc:0 "§OГодинник цокає, дзвін дзвонить — він завжди поруч. Реальний, як і ми, але його не торкнутись. Він створює і відбирає, йому байдуже, бо ніколи не було важливо. Ти можеш тікати, боятись... але це неминуче. Цінуй, що маєш.§! §RТа цього не мусить статись.§!"

clk_goal_tock:0 "Оверсієр: Тік"
clk_goal_tock_desc:0 "Коли двері Сховища 24 відкрились, першим ступив на пісок Овервоч Тік. Його експедиція заклала основу для територій Таймкіперів, і він став героєм. Його згодом проголосили першим Оверсієром. Його реформи радикальні, але необхідні — для виживання вольту й народу."

clk_vault_rests_not:0 "Сховище, Що Ніколи Не Спочиває"
clk_vault_rests_not_desc:0 "Межі вольту визначає лише його народ. Поки інші б’ють один одного по головах, ми ефективно використовуємо наш час. І тому перевершили всі цілі ефективності. Час — це гроші."

clk_goal_mold:0 "Зламати Форму"
clk_goal_mold_desc:0 "Ризики очевидні, але настав §Oчас§! змін. Ми не можемо лишатись пасивними в очікуванні смерті. Ми повинні діяти — зламати шаблон. Готуймося. Йдемо на війну."


clk_goal_crushing_white:0 "Зламати Білоногих"
clk_goal_crushing_white_desc:0 "Найгіршим були не бомби — найгіршим було те, що прийшло після них. Каравани, які вирушали до наших далеких поселень, знаходили лише попіл. Черепи на кілках стояли по периметру. Пісок у годиннику спливає, ми повинні врятувати своїх, перш ніж §Oнаш час§! вичерпається..."

clk_goal_army:0 "Реорганізація Армії"
clk_goal_army_desc:0 "Сховища ніколи не проєктували під армії. Наш розклад був настільки суворий, що охороні доручали хіба що відганяти ратокрочів. Тепер усе інакше — від щурів до рейдерів. Вони хочуть крові. То ж проллємо їхню."

clk_goal_know_enemy:0 "Пізнати Ворога"
clk_goal_know_enemy_desc:0 "Наша армія слабка, вона не бачила справжнього жаху. Розвідники повертаються пригніченими з Лінкольна та Фріско, але їхні історії чути не всім. Якщо ми хочемо перемогти, нам слід показати всім, із чим ми стикаємось."

clk_road:0 "Дорога Попереду"
clk_road_desc:0 "Куди йти далі? §RБілоногі§! розбиті, Нью-Ханаан — нейтралізований. Хоч світ і краще з нами, але він не став теплішим. Ми не можемо зупинитись — зроблено вже так багато. Ток пережив найгірше й тепер має усе виправити. Ніхто не стане на нашому шляху до кращого §Oмайбутнього§!."

clk_raiding:0 "Друзі на Висоті"
clk_raiding_desc:0 "Ми помилились, вважаючи, що в Пустці — лише дикі варвари. Там ще є надія. Ми знайшли групу, що досі практикує давнє мистецтво — політ. Вони базуються в колишньому військовому комплексі. Можливо, там ми знайдемо щось, що виконає обіцянку Тока про велике §Oмайбутнє§!."

clk_sky_trade_deal:0 "Налагодження Торгівлі"
clk_sky_trade_deal_desc:0 "Крім військового союзу, регулярні каравани між нашими поселеннями принесуть взаємну вигоду."

clk_open_northern_front:0 "Відкриваємо Північний Фронт"
clk_open_northern_front_desc:0 "Ходоки-Смоли, можливо, й не найгірші сусіди. Вони менше шкодили, ніж Білоногі. Але стратегічні переваги контролю над шосе 89 та гірськими перевалами — надто великі, щоб їх ігнорувати."

clk_disappointment_time:0 "Зміни в Розкладі"
clk_disappointment_time_desc:0 "Неочікувана подія відтерміновує наш прогнозований §Oчас§! до перемоги."

clk_heading_eastward:0 "Курс: 3 Година"
clk_heading_eastward_desc:0 "Якщо база Сплячих на сході — туди ми й вирушимо. Там ми знайдемо ресурси та технології для нового §Oмайбутнього§!."

clk_timing_engines:0 "Синхронізація Двигунів"
clk_timing_engines_desc:0 "Для будь-якого двигуна — наземного чи повітряного — важливо, щоб усі рухомі частини працювали, як §Oгодинниковий механізм§!."

clk_northern_push:0 "Наступ на Північ"
clk_northern_push_desc:0 "Далі ми просуваємось на північний схід — через землі Юнінта до торгового вузла Іґл-Рок. Їхні дирижаблі можуть бути загрозою, але цю битву залишимо Ріверам."

clk_free_watches:0 "Синхронізовані Годинники"
clk_free_watches_desc:0 "Місцеві трохи не пунктуальні. З новими годинниками вони, можливо, нарешті з’являтимуться на зміну рівно о 07:00."

clk_meticulous_bases:0 "Підготовка Підтримки"
clk_meticulous_bases_desc:0 "Перетнути Колорадо буде складно, особливо якщо ворог спіймає нас на переправі. Якщо Рівери мають допомогти, нам потрібні нові злітні смуги."

clk_cash_for_clocks:0 "Гроші за Годинники"
clk_cash_for_clocks_desc:0 "Іґл-Рок зібрав неабиякі багатства — кришки, лом, і... годинники. Стільки різновидів! І так, інтеграція важлива також..."

clk_sleepers:0 "Час Прокидатися"
clk_sleepers_desc:0 "Надія зовсім поруч. §OОвервоч Ток§! привів нас до каньйону, до фінальної цілі. Все зводилось до цього. Якщо те, що ми шукаємо, справді там — ми нарешті зможемо вирватися.\n§OЗаради нашого народу, заради світу — зробімо це.§!"

clk_tick_2:0 "Сховище, Що Цокає"
clk_tick_2_desc:0 "§OГодинник цокає, дзвін лунає, він завжди поруч. Та§W...стоп, ми ж уже тут були?"

clk_goal_stealer:0 "Тінь Втручання"
clk_goal_stealer_desc:0 "Ядерний блок тут, капелюх там, навіть кота викрали. Минуле сповнене розкоші, яку ми могли лише уявити. Якщо уникнути §Rпарадоксів§W — все буде гаразд. Хто ж їх помітить?"

clk_goal_tock_2:0 "Володар: Ток"
clk_goal_tock_2_desc:0 "Розум, що стоїть за всім. Наша надія. Як Мойсей розділив море, Ток знищив §RБілоногих, Смоляних Ходоків, та Скорботних§!. §WВін подарував нам свободу від жаху цього світу. Людина понад усе — навіть понад §Oчас§!.§!"

clk_goal_master:0 "Майбутнє"
clk_goal_master_desc:0 "§OМи біля воріт. Машина готова до переміщення крізь час. Ми бачили минуле, ми пережили теперішнє. Ми досягли більшого, ніж будь-хто міг уявити. Нарешті ми звільнимось від гріхів предків і зможемо самі творити долю. Після стількох років... ми це зробили.§!"

clk_goal_debt_repaid:0 "Відплата за Підтримку"
clk_goal_debt_repaid_desc:0 "Наші друзі з Району 51 не раз довели свою цінність — §Oраз за разом§!. Вони підтримували нас — ми підтримаємо їх."

clk_goal_debt_repaid_2:0 "Володар Володарю"
clk_goal_debt_repaid_2_desc:0 "Наша відданість зміцнила союз. Небесні Рівери запропонували вигідніші умови — і трохи нових знань."

clk_goal_slay_the_sky:0 "Одинадцята Година"
clk_goal_slay_the_sky_desc:0 "Можливо, це було §Oнеминуче§!. Можливо, ми даремно вірили, що з рейдерами можна інакше."

clk_goal_slay_the_sky_2:0 "Допити за Розкладом"
clk_goal_slay_the_sky_2_desc:0 "«Отже, пане Кривавий Палець, будь ласка, говоріть чітко в мікрофон. У нас лише кілька запитань щодо ваших польотів»."

clk_goal_stealing_time:0 "Реверс Потоку"
clk_goal_stealing_time_desc:0 "Кілька налаштувань стабілізують машину, і ми зможемо безпечно подорожувати в минуле. §RПарадокси§W малоймовірні. Просто тримайтесь подалі від пра-прадідів."

clk_goal_stealing_time_2:0 "Повторюючи Старі Помилки"
clk_goal_stealing_time_2_desc:0 "Побачивши і §OМинуле§!, і §OМайбутнє§! — невже справді немає іншого шляху? §RВійна§! — єдина незмінна?"

clk_goal_guarding_utah:0 "Врятуй Юту — Врятуй Світ"
clk_goal_guarding_utah_desc:0 "Якщо §Oмайбутнє§! Землі можна змінити — це почнеться з Юти. А якщо зазнаємо поразки... §Rспробуємо ще, ще і ще.§!"

# Підказки Таймкіперів
clk_wall_tt:0 "§gОборонна лінія буде §Oзведена§! вздовж нашого кордону з §RБілоногими.§!"
clk_enemy_tt:0 "§g§RБілоногі§! почали організовувати зусилля для §Rзнищення§! нашого народу! На щастя, §Oчас§! на нашому боці. Нам слід готуватися, бо §Rця війна буде важкою.§!§!"
clk_friend_tt:0 "§OМи перемогли §RБілоногих§!. Зі смертю §RSalt-Upon-Wounds§! ми можемо нарешті спрямуватися в §Oмайбутнє!§!§!"
clk_raiding_tt:0 "§GМи укладемо пакт взаємного захисту з Повітряними Рейдерами!§!"
clk_gotta_go_east_tt:0 "§OМатеріали на цій зруйнованій станції... навіть усі техновідходи Гранд-Каньйону — §Rнедостатні§!.§!"
clk_helping_tt:0 "§OЯк же все дійшло до цього? Ми припустилися помилки, ми зробили недостатньо. Ми зупинились на станції, та маємо йти далі. Ми повинні охопити світ під нашими крилами, піклуватися про майбутнє, яке нам належить.§W"
clk_helping_tt.b:0 "§OЯк же все дійшло до цього? Ми припустилися помилки, ми зробили недостатньо. Ми зупинились на станції, та маємо йти далі. Ми повинні охопити світ під нашими крилами, піклуватися про майбутнє, яке нам належить.\n§RПочнемо з тих зрадницьких неба-рейдерів.§W"
clk_vault.11.tooltip:0 "§RПісля жалюгідної поразки колись могутніх воїнів дороги ми повністю контролюємо їхні гаражі й склади. Більшість обладнання було втрачено у війні, але дещо ще можна розібрати на деталі.§!"
clk_vault.reavers:0 "§GНаш союз із Повітряними Рейдерами виявився надто вигідним, щоб його завершити. Хоча це й непопулярно, ми можемо укласти нову угоду: запасні частини для їхніх літаків в обмін на подальшу підтримку наших майбутніх дій.§!"
clk_vault.reavers.a:0 "§OUgh. Tock, здається, щойно розблокувалась якась нова і унікальна механіка для дерева фокусів. Що б це могло значити?§!"
clk_transfer_to_sky_tt:0 "§gЯкщо ми володіємо областями, які є осердніми для §O[GRA.GetName]§!, §O[RIP.GetName]§! або §O[RUB.GetName]§!, ми передамо їх державі §O[SKY.GetNameDef]§!.§!"
clk_utah_and_nevada_tt:0 "§gНадає §Gпретензії§! на всі області §OЮти§!.\n\nЯкщо ми все ще в союзі з §YПовітряними Рейдерами§!, надає їм §Gпретензії§! на всі області §OНевади§!.§!"

