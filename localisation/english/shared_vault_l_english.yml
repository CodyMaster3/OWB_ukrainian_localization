shared_vault_the_executive_truth:0 "Збір даних наших пращурів"
shared_vault_the_cold_truth:0 "Герої та поразки — нероздільні"
shared_vault_the_purposeful_truth:0 "У пошуках останньої правди"
shared_vault_the_pragmatic_truth:0 "Наші пращури вижили — щоб ми жили"
shared_vault_the_terrible_truth:0 "Жах Сховищ, виявлений"
