l_english:
# starting foci
  shared_vault_1:0 "[shared_vault_1_focus_name_loc]"
  shared_vault_1_name_key:0 ""Готові до майбутнього!""
  shared_vault_1_desc:0 "[shared_vault_1_focus_desc_loc]"
  shared_vault_1_desc_key:0 "Бомби мали впасти, так чи інакше, і ніхто не був до цього готовий краще за «Волт-Тек»! Наше Сховище було одним із багатьох, що були готові перечекати бурю і тримати наших предків у безпеці, доки світ не буде готовий до відбудови. Проте не всі Сховища створювалися однаковими, і завжди залишається те пекуче запитання: яким було ваше Сховище?"

  shared_vault_2:0 "[shared_vault_2_focus_name_loc]"
  shared_vault_2_name_key:0 ""Забронюйте своє місце сьогодні!""
  shared_vault_2_desc:0 "[shared_vault_2_focus_desc_loc]"
  shared_vault_2_desc_key:0 "Кожному Сховищу одного разу доведеться приймати дуже складні рішення. Лічильник Гейгера може все ще тріщати, але ці двері все одно доведеться відчинити! «Волт-Тек», можливо, і готувалася до всього, але люди та припаси можуть стати дуже дефіцитними після 200 років під землею."

  shared_vault_3:0 "[shared_vault_3_focus_name_loc]"
  shared_vault_3_name_key:0 ""Який ваш план?""
  shared_vault_3_desc:0 "[shared_vault_3_focus_desc_loc]"
  shared_vault_3_desc_key:0 "Навіть якщо нам не потрібна пустка, пустці можемо знадобитися ми! Так само як «Волт-Тек» готувалася до майбутнього, нам доведеться зробити те ж саме. Незалежно від того, чи захистимося ми від неї, чи подружимося з нею, чи, можливо, приборкаємо її самі, настав час для того світлого майбутнього, яке обіцяла «Волт-Тек»!"

  #left branch foci

  shared_vault_maintenance:0 "Команди технічного обслуговування Сховища"
  shared_vault_maintenance_desc:0 "Хоча Сховища високоавтоматизовані та побудовані за високими стандартами, без команди технічного обслуговування «Волт-Тек» не залишилося б нічого, крім іржавих коридорів!\n\nЧас заохотити наших молодих жителів взяти до рук паяльники та приєднатися до команди, щоб тримати Сховище на впевненому шляху до досконалості."

  shared_vault_industry_bonus:0 "Конвеєрні стрічки"
  shared_vault_industry_bonus_desc:0 "Стабільний виробничий потік — ключ до того, щоб наші жителі були щасливі, а наше Сховище — прибутковим. Якщо ми хочемо переконатися, що ми є титанами індустрії в пустці, нам доведеться виділити більше нашої нерухомості під високопередові та автоматизовані майстерні."

  shared_vault_resource_collection:0 "Щаслива праця — важка праця"
  shared_vault_resource_collection_desc:0 "Видатні уми у відділі кадрів «Волт-Тек» розробили нову кампанію, щоб поставити наших жителів на ноги та змусити працювати!\n\nМи створимо штучну атмосферу змагання між сім'ями Сховища, нагороджуючи найпрацьовитішого жителя місяця одним днем додаткової оплати!"

  shared_vault_maintenance_infrastructure:0 "Розширення Сховища"
  shared_vault_maintenance_infrastructure_desc:0 "Наші житлові приміщення швидко заповнюються і незабаром не матимуть місця для майбутніх поколінь. Було б розумно почати розкопувати майбутню нерухомість, якщо ми хочемо уникнути кризи."

  shared_vault_maintenance_repairs:0 "П'ятирічний контрольний список"
  shared_vault_maintenance_repairs_desc:0 "Дехто каже, що ми повинні перевіряти це частіше, але офіційний посібник з технічного обслуговування Сховищ «Волт-Тек» каже, що раз на 5 років, отже...."

  shared_vault_generator:0 "Джерела енергії"
  shared_vault_generator_desc:0 "[Root.GetName] не зможе вічно виживати лише на старому довоєнному генераторі. Чому б не спробувати модернізувати його або пошукати енергію деінде?"

  shared_vault_reading_about_boats:0 "Натхнення в літературі"
  shared_vault_reading_about_boats_desc:0 "«Відмовитися від нестерпного ярма суші, яке люди прирівнюють до свободи, можливо, не така вже й велика жертва, як ви можете уявити.» — Капітан Немо, «Двадцять тисяч льє під водою» "

  shared_vault_building_dockyards:0 "Початок практики суднобудування"
  shared_vault_building_dockyards_desc:0 "Усі теоретичні знання з морського будівництва тепер можуть знайти практичне застосування на наших новозбудованих верфях. Уявіть, виходити в море, як великі дослідники давнини!"

  shared_vault_ocean_vaults:0 "Сховища морів"
  shared_vault_ocean_vaults_desc:0 "Наші перші кілька вилазок у води пустки навчили нас, що більше — означає краще. Зрештою, так само як і наші домівки-Сховища, вони повинні забезпечувати надійний дах і чотири стіни, щоб захистити нас від загроз природи та людини. І це заважає їм так сильно хитатися...."

  shared_vault_bikes:0 "Довше, ніж коридори"
  shared_vault_bikes_desc:0 "Сховища мають зручні розміри. Поверхня ж потребує трохи більше ходьби, щоб дістатися кудись. Простий набір коліс може допомогти нам швидше добиратися до нових поселень. Це також може зараховуватися як фізичні вправи!"

  shared_vault_cars:0 "Значно більше часу на подорож"
  shared_vault_cars_desc:0 " Хоча фітнес є життєво важливою частиною нашого способу життя, можливо, кілька відновлених коліс зможуть зекономити нам трохи часу?"

  shared_vault_water_chip:0 "Наші водяні чипи"
  shared_vault_water_chip_desc:0 "Хоча ми чули давно забуті історії про жителів Сховищ, які героїчно покидали їх і жертвували собою, щоб знайти водяні чипи, на щастя, нам надали їх достатній запас.\n\nВчені запропонували побудувати ще більше водоочисних споруд, щоб краще використовувати наші запаси чипів — справжня геніальна робота."

  shared_vault_resource_capstone:0 "Титани індустрії"
  shared_vault_resource_capstone_desc:0 "«Волт-Тек» більше не вимагає ефективності в нашій промисловості! За короткий час ми перевершили очікувані прогнози на 231,5%! Справжнє досягнення, яким може пишатися кожен житель Сховища."

  #air side branch

  shared_vault_civilian_factory:0 "Машина понад людину"
  shared_vault_civilian_factory_desc:0 "Наші аналітики даних підрахували, що замінивши частину нашої виробничої лінії на спеціально створених протектронів, ми могли б майже подвоїти нашу ефективність. Кому потрібні набридливі робітники, які просять відпустки і навіть не можуть працювати двадцять чотири години на добу?"

  shared_vault_military_protectrons:0 "Машина попереду людини"
  shared_vault_military_protectrons_desc:0 "Протектрони насправді дуже добре захищають нас від ворожого вогню. І вони навіть стріляють у відповідь!"

  shared_vault_air_bonus:0 "Авіація предків"
  shared_vault_air_bonus_desc:0 "Наші американські предки колись вільно і безтурботно мандрували небом. Тепер найбільше, що ви побачите в смоговому та зеленому небі, — це ворон-мутант...\n\nДавайте повернемо дні слави та навчимо нашу молодь керувати нашими найсучаснішими літаками, зрештою, це може стати в пригоді для майбутніх війн."

  shared_vault_air_tech_bonus:0 "Чудові аеронавти"
  shared_vault_air_tech_bonus_desc:0 "Здається, наша кампанія з прищеплення молоді пристрасті до авіації дала результати. Є лише одна проблема: все, що ми маємо — це хиткі біплани та реліквії 21-го століття.\n\nЯкщо ми дійсно хочемо контролювати небо, ми повинні вдосконалити технології, які надаємо нашим аеронавтам, інакше нас зіб'ють із саморобних гвинтівок."

  shared_vault_air_base_bonus:0 "Небесний замок"
  shared_vault_air_base_bonus_desc:0 "Тепер, коли наші військово-повітряні сили є грізним супротивником для будь-кого, хто мандрує небом, у нас є остання проблема: авіабази. Якщо ми не відрядимо частину наших жителів шукати галявини на землі та будувати злітно-посадкові смуги, наші ВПС не матимуть шансів запустити щось більше за планер."

  #security branch

  shared_vault_security:0 "Служби безпеки Сховища"
  shared_vault_security_desc:0 "Хоча ми віримо, що всі жителі Сховища будуть добропорядними членами громади, страховка ще ніколи не завадила.\n\nНаша служба безпеки стоїть на сторожі закону й порядку, захищає нас як від зовнішніх, так і від внутрішніх загроз, і є основою нашого Сховища."

  shared_vault_security_organization:0 "Друк нових уніформ"
  shared_vault_security_organization_desc:0 "Крім того, що вона зручна, міцна та модна, уніформа служби безпеки «Волт-Тек» допомагає відрізнити наші сили від беззаконних жителів пустки. Нам доведеться наростити виробництво, щоб іти в ногу з сучасними потребами."

  shared_vault_identification:0 "Призначення нових ІНС"
  shared_vault_identification_desc:0 "Ідентифікаційні номери Сховища видаються кожному жителю під час реєстрації його народження. На щастя, маючи цілих 11 цифр, цю систему можна легко розширити на новоприбулих до нашого суспільства. Нам просто потрібно змусити їх заповнити належні документи та занести їх в офіс між 10 та 2 годинами."

  shared_vault_security_gaming:0 "Трохи воєнних ігор"
  shared_vault_security_gaming_desc:0 "Дехто каже, що ігри — це чудовий спосіб навчити розум мислити стратегічно. Ми майже впевнені, що ці люди просто хочуть байдикувати. І навіть якщо це правда, хіба не минуло близько 200 років з того часу, як голоплівки «Atomic Command» могли бути корисними?"

  shared_vault_air_land_teamwork:0 "Немає «Я» в команді"
  shared_vault_air_land_teamwork_desc:0 "Однак роботи багато, і сьогодні ми зосереджені на тому, щоб служба безпеки та аеронавти діяли узгоджено."

  shared_vault_security_equipment:0 "До зброї"
  shared_vault_security_equipment_desc:0 "Хоча наша служба безпеки виконувала чудову роботу, їм не вистачає необхідної вогневої міці для належного управління будь-якими серйозними погрозами.\n\nБуло б розумно тимчасово призначити частину нашої цивільної робочої сили для виготовлення більшої кількості озброєння для наших офіцерів."

  shared_vault_security_boon:0 "Цирконієві штани"
  shared_vault_security_boon_desc:0 "Тепер, коли наша служба безпеки має достатню вогневу міць, ми можемо зосередитися на інших її проблемах, насамперед на нестачі броні.\n\nНаші вчені наполегливо працювали у своїх лабораторіях над сполукою, відомою як «Цирконій», яку можна було б використовувати в балістичних жилетах завдяки її ідеальним властивостям."

  shared_vault_security_recruitment:0 "Захисники Сховища"
  shared_vault_security_recruitment_desc:0 "Видатні уми «Волт-Тек» зібралися разом і виправили всі проблеми, які ми мали з обладнанням нашої служби безпеки, тепер справа за чудовими ораторами.\n\nКожен житель поважає службу безпеки, але мало хто хоче приєднатися до неї, безсумнівно, якби ми показали їм переваги цієї роботи, вони б одразу записалися!"

  shared_vault_arms_factory:0 "Вражаючі боєприпаси"
  shared_vault_arms_factory_desc:0 "Наші виробничі лінії складаються з дрібничок і цивільних товарів, настав час нам втрутитися і перепризначити деякі заводи виключно на виробництво вогнепальної зброї. Наші вороги дізнаються про відданість наших жителів, коли виготовлені нами свинцеві снаряди проб'ють їм черепи."

  shared_vault_doctrine_bonus:0 "Муштрування жителів"
  shared_vault_doctrine_bonus_desc:0 "Якщо війна коли-небудь досягне околиць нашого Сховища, кожен чоловік, жінка та дитина повинні бути готові зустріти гнів наших ворогів.\n\nНачальник служби безпеки Маккей погодився навчати людей різного віку мистецтву війни, щоб допомогти нам протистояти ворогу."

  shared_vault_arms_factory_2:0 "Розширення виробництва вогнепальної зброї"
  shared_vault_arms_factory_2_desc:0 "Зусилля, які ми доклали для будівництва нових заводів з виробництва зброї, окупилися. Проте ми завжди можемо розширити виробничу лінію далі, наші розвідники виявили розчищені ділянки, які були б ідеальним місцем для розміщення збройових майстерень."

  shared_vault_outward_movements:0 "Вогняне кільце"
  shared_vault_outward_movements_desc:0 "Служба безпеки сильніша навіть за деякі з найелітніших довоєнних організацій завдяки нашій відданості їхньому озброєнню та модернізації.\nОстаннім кроком у нашому плані буде просто згуртування наших сил та зображення ворога як інопланетної сили без жодних людських емоцій, щоб наші люди не виявляли до них жалю."

  #vault science branch

  shared_vault_doctors:0 "Наукові команди Сховища"
  shared_vault_doctors_desc:0 "Наукові команди Сховища — це найважливіший стовп у забезпеченні нашого майбутнього в пустці.\nНайкращі та найрозумніші люди «Волт-Тек» були відправлені до нашого Сховища, щоб їх використовували! А не просто сидіти й проводити тести на лабораторних мишах.\nЯкщо ми хочемо продовжувати йти стабільним шляхом технологічного прогресу, ми повинні подбати про належне фінансування наших вчених."

  shared_vault_stimpaks:0 "Запасаємося стимуляторами"
  shared_vault_stimpaks_desc:0 "Хоча наше Сховище надає одне з найвисокоякісніших медичних обслуговувань у пустці, все ще існують проблеми в нашому постачанні. Стимулятори та Мед-X є рідкісними знахідками для наших збирачів, і наразі ми не маємо можливості їх виробляти. Встановлення для Наукової команди мети відтворити формулу стимулятора надзвичайно б допомогло."

  shared_vault_support_bonus:0 "100% стан"
  shared_vault_support_bonus_desc:0 "Наші Піп-Бої оснащені пристроями, здатними відстежувати як флору, так і фауну. Чому б нам не заохотити наших жителів позбутися таких шкідників, як радтаргани, нагороджуючи їх за вбивство 50-ти з них! Я впевнений, що ці маленькі примхи триматимуть наших жителів мотивованими до боротьби зі шкідниками."

  shared_vault_future_warfare:0 "Майбутнє ведення війни"
  shared_vault_future_warfare_desc:0 "Деякі білі халати, що витають у хмарах, мріють про епоху, коли кожен у громаді отримає свій власний плазмовий пістолет.\n\nНаразі нам, ймовірно, доведеться задовольнятися відновленими лазерними гвинтівками."

  shared_vault_super_security:0 "Теорія супербезпеки"
  shared_vault_super_security_desc:0 "До падіння бомб американська армія перебувала на передньому краї розвитку військової справи. Якби ми змогли відновити та інтегрувати деякі з їхніх технологій та посібників, ми могли б об'єднати найкращих співробітників нашої служби безпеки в непереможні елітні підрозділи."

  shared_vault_scientists:0 "Пильний утилізатор"
  shared_vault_scientists_desc:0 "«Волт-Тек» інвестувала занадто багато матеріалів у божевільні, неймовірні експерименти, які проводилися вченими з колючим сивим волоссям. Якщо ми дійсно хочемо створювати корисні технології, а не радтарганів, що вміють розмовляти, то нам доведеться попрацювати над скасуванням деяких з найбільш ексцентричних дослідницьких проєктів."

  shared_vault_research_bonus:0 "Лють ботаніка!"
  shared_vault_research_bonus_desc:0 "Здається, наші вчені нарешті знайшли свій квиток до того, щоб працювати менше. Вони побудували комп'ютер, який запускає тисячі експериментів, щоб побачити, які з них слід викинути через їхнє безумство...\n\nБуло б краще мати менше божевільних вчених, але це, мабуть, прискорить справу?"

  shared_vault_expanding_goat:0 "Розширення К.О.З.А."
  shared_vault_expanding_goat_desc:0 "К.О.З.А. допомогла поколінням наших дітей знайти захопливу та повноцінну кар'єру (у більшості випадків). Але тепер, коли ми на поверхні, з'явилося багато робіт, які вона просто не враховувала. Тож наукова команда працювала з нашими вчителями, щоб створити 20 нових питань, які можна додати до тесту. Підлітки будуть у такому захваті!"

  shared_vault_radar_time:0 "Покращені датчики руху"
  shared_vault_radar_time_desc:0 "Датчик руху Wattz Electronics C-U Model — це доповнення для старих моделей Піп-Боїв. Розібравши їх, а потім зібравши знову, але у значно більшому масштабі, ми змогли б бачити ворогів, що наближаються, задовго до того, як вони до нас дістануться."

  shared_vault_research_bonus_upgrade:0 "Завантаження оперативної пам'яті"
  shared_vault_research_bonus_upgrade_desc:0 "Так званий «Сенсотрон» заощадив тисячі людино-годин нашій команді вчених завдяки своїм хитрим можливостям. Час подивитися, чи зможемо ми розширити його корисність, дотримуючись посібника «Волт-Тек».\n\nЗгідно з базовим протоколом, ми можемо вставити простий голодиск у дисковод і отримати гігабайт оперативної пам'яті! Це має спрацювати."

  shared_vault_slot_research:0 "Дивні дні"
  shared_vault_slot_research_desc:0 "Вирішивши наші проблеми з ресурсами та повністю зосередивши наших вчених, ми досягли ефективності, небаченої навіть у найкращих прогнозах від «Волт-Тек». Здається, наша улюблена наукова команда відкрила нову еру технологічного прогресу в пустці, повній невігласів."

  shared_vault_the_geck:0 "Г.Е.К.К."
  shared_vault_the_geck_desc:0 "Наше Сховище перевершило навіть найвищі очікування щодо виживання в безплідній пустці, тепер настав час для нашого остаточного призначення. Ми повинні покинути наші комфортні й холодні сталеві стіни, щоб вийти назовні і зробити пустку зеленою та чистою за допомогою нашого ідеального Г.Е.К.К.!"

  shared_vault_post_geck_1:0 "Відчиняючи двері"
  shared_vault_post_geck_1_desc:0 "Що ховається за цими могутніми порталами в землю? Чим відрізняються інші Сховища за своєю конструкцією? Що особливого в їхніх мешканцях?\n\nЄ лише один спосіб дізнатися!"

  shared_vault_post_geck_2:0 "Жителі Сховищ"
  shared_vault_post_geck_2_desc:0 "Наше постійне дослідження Сховищ, їхніх подібностей та відмінностей, дало нам глибоке нове розуміння компанії, яка їх побудувала, кінця світу та нас самих."

  shared_vault_post_geck_3:0 "Правда про «Волт-Тек»"
  shared_vault_post_geck_3_desc:0 "Більше одинадцяти даних привели нас до серії прикрих одкровень про компанію, яка прихистила наших предків...."

  #shared vault tooltips
  shared_vault_dockyards_tt:0 "Додасть §G3§! §Yверфі§!"
  shared_vault_1_vault_explored_tt:0 "Ми дослідили §Y1§! інше Сховище."
  shared_vault_5_vaults_explored_tt:0 "Ми дослідили §Y5§! інших Сховищ."
  shared_vault_10_vaults_explored_tt:0 "Ми дослідили §Y10§! інших Сховищ."

  #shared vault ideas

  shared_vault_maintenance_teams:0 "Команди технічного обслуговування Сховища"
  shared_vault_maintenance_teams_desc:0 "Хоча Сховища високоавтоматизовані та побудовані за високими стандартами, без команди технічного обслуговування «Волт-Тек» не залишилося б нічого, крім іржавих коридорів!"
  shared_vault_construction:0 "Прагнення до досконалості"
  shared_vault_repair_schedules:0 "Контрольні списки ремонту"
  shared_vault_repair_schedules_desc:0 "— Скотч є.\n— Суперклей є.\n\nЦе все, що вам дійсно потрібно."
  shared_vault_security_teams:0 "Служби безпеки «Волт-Тек»"
  shared_vault_security_teams_desc:0 "Наша служба безпеки стоїть на сторожі закону й порядку, захищає нас як від зовнішніх, так і від внутрішніх загроз, і є основою нашого Сховища."
  shared_vault_security_teams_expansion:0 "Авангард служби безпеки «Волт-Тек»"
  shared_vault_everyone_a_vid:0 "Призначення нових ІНС"
  shared_vault_playing_video_games:0 "Отримання найвищого балу"
  shared_vault_air_land_coop:0 "Комітет із забезпечення зв'язку між пілотами та безпекою"
  shared_vault_idea_research_buff:0 "Розсудливі вчені"
  shared_vault_idea_expanded_goat_questions:0 "Кваліфікаційно-Оціночне Завдання Адміністрації 2.0"
  shared_vault_idea_expanded_goat_questions_desc:0 "Нова, поверхнева К.О.З.А. може дозволити нашим жителям отримати щедру зайнятість у таких повноцінних професіях, як живий щит, виробник добрив або швець."
  shared_vault_idea_research_buff_2:0 "Розширена пам'ять"
  shared_vault_little_bit_of_weird:0 "Люди — дивні"
  shared_vault_little_bit_of_weird_desc:0 "Сховище було не зовсім тим, що більшість назвала б «нормальним», але більшість людей вийшли з нього живими. Більшість."
  shared_vault_terrors_of_the_vault:0 "Закривавлені стіни"
  shared_vault_terrors_of_the_vault_desc:0 "Сховища були одними з найнелюдяніших експериментів, коли-небудь задуманих. Той, хто їх створив, не заслуговував на те, щоб померти у війні. Вони заслуговують набагато, набагато гіршого."
  shared_vault_safety_indoors:0 "Безпека всередині"
  shared_vault_safety_indoors_desc:0 "§CПоверхня — ніколи! Сховище — назавжди!§!"
  shared_vault_reclaim_by_force:0 "Повернути силою"
  shared_vault_reclaim_by_force_desc:0 "Поверхня належить нам по праву народження. Якщо ті, хто називає її домом, цього не визнають, тоді ми заберемо те, що належить нам."
  shared_vault_repurposed_machines:0 "Перепрофільовані машини"
  shared_vault_repurposed_machines_desc:0 "Попри всі свої моральні провали, Сховища були технологічними дивами. Перепрограмування систем нашого Сховища відповідно до наших нових потреб у житті на поверхні допоможе нам швидше адаптуватися до пустки."
  shared_vault_find_more_vaults:0 "Мисливці за Сховищами"
  shared_vault_tec_champions_bonus:0 "Чемпіони системи Сховищ"
  shared_vault_the_executive_truth:0 "Збір даних наших прабатьків"
  shared_vault_the_cold_truth:0 "Герої та невдахи йдуть пліч-о-пліч"
  shared_vault_the_purposeful_truth:0 "У пошуках остаточної правди"
  shared_vault_the_pragmatic_truth:0 "Зрештою, наші предки вижили, щоб створити нас"
  shared_vault_the_terrible_truth:0 "Жах Сховищ стає очевидним"
  shared_vault_the_coherent_truth:0 "Наш світ був сформований божевільними"

#shared vault events

  gen_vault.1.t:0 "Готуйтеся до майбутнього"
  gen_vault.1.d:0 "Це не дуже велика таємниця, що деякі зі сховищ не були спроєктовані з думкою про найкращі інтереси їхніх мешканців. Хоча існувало багато контрольних сховищ, деякі мали на меті не лише безпеку. Деякі з них були відверто жахливими — і все це в ім'я науки!"
  gen_vault.1.a:0 "Наше було здебільшого нормальним."
  gen_vault.1.b:0 "Там було трохи дивно."
  gen_vault.1.c:0 "Жахіття..."

  gen_vault.2.t:0 "Забронюйте своє місце вже сьогодні!"
  gen_vault.2.d:0 "Зрештою наглядачу довелося прийняти кілька важких рішень щодо того, чи відчиняти двері сховища. На поверхні, безперечно, все ще було небезпечно, але так само було певно, що там є люди, і вони могли б потенційно допомогти нам або навіть приєднатися до нас! Або ж вони могли б убити нас усіх!"
  gen_vault.2.a:0 "Ми їх не впустимо."
  gen_vault.2.b:0 "Завжди знайдеться час для невеликої торгівлі!"
  gen_vault.2.c:0 "Ніколи не пізно для нових сусідів!"

  gen_vault.3.t:0 "Який ваш план?"
  gen_vault.3.d:0 "Незалежно від того, прийняли ми зовнішній світ чи відгородилися від нього, нам доведеться бути готовими до всього, що він нам підкине. Наглядач — людина мудра (напевно), і в нього є надійний план, як нам пережити прийдешні роки. Йому просто потрібно розповісти нам, у чому він полягає!"
  gen_vault.3.a:0 "Забарикадувати двері й молитися, щоб ніхто не постукав."
  gen_vault.3.b:0 "Пустку потрібно повернути, силою."
  gen_vault.3.c:0 "Ми перепрофілюємо машини Сховища під наші потреби."

  gen_vault.4.t:0 "Нове покоління служби безпеки"
  gen_vault.4.d:0 "Хоча вирішення конфліктів є важливою навичкою згідно з посібником Наглядача, деякі люди нагорі просто не хочуть нас слухати. Тому, якщо нам доведеться продовжувати воювати, можливо, варто вкласти найкращі з наших ресурсів у «Суперкоманди безпеки»."
  gen_vault.4.a:0 "Силова броня — це вершина конфлікту (після компромісу)"
  gen_vault.4.b:0 "Броня спецпризначенців не така незграбна (чи дорога), як силова броня"
  gen_vault.4.c:0 "Що не так з оригінальним спорядженням служби безпеки Сховища?"
  gen_vault.4.e:0 "Кожен член команди безпеки — супер!"

  gen_vault.5.t:0 "Правда про «Волт-Тек»"
  gen_vault.5.d:0 "Коли до наших рук потрапляє все більше й більше сховищ, стає зрозумілою одна річ: вони не були створені для порятунку людей. Деякі з них, можливо, і виконували свою роботу, але решта були частиною великої змови. Довоєнний уряд та «Волт-Тек» спроєктували більшість сховищ як жорстокі й нелюдські експерименти, що мали проводитися над їхніми мешканцями. Незалежно від того, чи були це маніпулятивні соціальні експерименти, чи просто випробування небезпечних наукових досягнень на замкненій аудиторії, більшість сховищ, які ми знаходимо, є кладовищами або лігвами божевілля."
  gen_vault.5.a:0 "Але... ми вже все це знали."
  gen_vault.5.b:0 "Але подивіться на їхні успіхи!"
  gen_vault.5.c:0 "Можливо, їхні експерименти мали вищу мету."
  gen_vault.5.e:0 "Це жахливо, справді жахливо, але вони все ж врятували декого з нас."
  gen_vault.5.f:0 "Тільки подумати, скільки людей могло б вижити, якби не жадібність."
  gen_vault.5.g:0 "Насправді це багато що пояснює."

  # Vault 27 - new loc by zusk c:
  VLS_OVERSEER_KNOX_NAME:0 "Наглядач Нокс"
  VLS_OVERSEER_KNOX_DESC:0 "Томас Нокс має проблему, хоча ніколи б не визнав цього вголос. Це стукіт. Спершу ледь чутний, не гучніший за цокання металу, але він ніколи не припиняється. Вдень чи вночі, в його кабінеті чи в порожніх коридорах — він завжди десь поруч, завжди просто за спиною.\nСховище 27 від самого початку було приречене на провал — лабіринт дефіциту, перенаселення та напруги, яка була настільки сильною, що мала б луснути ще багато років тому. Але цього не сталося. Наглядачі до нього ламалися під цим тиском, але Нокс тримається. Він мікрокерує кожною калорією, рахує кожне ліжко, обчислює кожне народження. Порядок понад милосердя. Цифри мають сходитися.\n\nПроте… стукіт не вщухає. Він наказував ремонтним бригадам розбирати стіни, інспекторам повзати вентиляційними шахтами, а біля запечатаних перебірок ставив охорону. Нічого. Лише метал і тіні.\nХтось каже, що це труби, інші подейкують про неспокійних духів або про щось інше — щось, чого «Волт-Тек» ніколи не вносив до офіційних креслень. Нокс не вірить у привидів. Він вірить у квоти, графіки пайків і демографічні таблиці.\n\nАле коли він залишається сам у своєму кабінеті, занісши ручку над черговим похмурим звітом, і стукіт починається знову — цього разу ближче — він не може не задуматися: а що, якщо хтось стукає у відповідь?"

  vls_crammed_vault:0 "Тук-тук"
  vls_crammed_vault_desc:0 "Не тісні коридори чи нескінченне море облич турбують більшість людей у Сховищі 27. Це звуки — слабке постукування, ритмічний стукіт. Ви чуєте його в стінах, у вентиляції, навіть у підлозі під вашим ліжком. Раніше люди жартували, що це «ритм Стукача», але зараз нікому не до сміху. Коли місця так мало, здається, що кожен стукіт лунає саме для вас."

  vls_ghost_division_focus:0 "Примарна бригада"
  vls_ghost_division_focus_desc:0 "Примарна дивізія — вони не просто маршують, вони стукають. Серед них ходить дивне марновірство: вони двічі стукають по шоломах перед боєм, двічі стукають у двері перед тим, як увійти в нове приміщення. Одні кажуть, що це на удачу, інші стверджують, що це щоб задобрити «Їх» — те, що стукало відтоді, як Сховище вперше запечатали. Вони приносять те, що потрібно Сховищу, але історії про їхні полювання з кожним днем стають усе дивнішими. Припаси з порожнистих місць. Зброя з шепотом. І завжди... завжди цей стукіт."

  vls_biggest_little_vault:0 "Майстерня Стукачів"
  vls_biggest_little_vault_desc:0 "«Волт-Тек» залишив нам інструменти — екскаватори, бури, техніку для будівництва будинків під землею. Але коли починається копання, починається і стукіт. Сильніший, різкіший, майже... роздратований. Інженери жартують про «гнів Стукачів», коли натикаються на несподівану сталеву перебірку або чують луну, яка не повинна була б повертатися. Але майстерня продовжує гудіти, і Сховище розростається — вгору, вниз, убік. Тук-тук, «Волт-Тек»."

  # TODO: get prov name by variable
  vls_chance_of_a_lifetime:0 "Постукай двічі на вдачу"
  vls_chance_of_a_lifetime_desc:0 "Досягнення Вейла стало непереборним призом, і Привиди розробили плани, як розкрити його, мов стару сталеву бочку. Кажуть, Томас Нокс наказав їм стукати двічі перед тим, як вони прорвуть будь-які ворота чи безпечне місце — завжди двічі, ніколи не тричі. Більше ніхто не питає чому. Якщо вони прислухаються достатньо уважно, то почують відповідь у вітрі."

  vls_settlers_from_below:0 "З порожнистих залів"
  vls_settlers_from_below_desc:0 "Покоління жителів мріяли про сонячне світло, свіже повітря та домівки, які не гудуть від переробленого кисню. Тепер у них є шанс. Але коли вони поселяються нагорі, дехто клянеться, що все ще чує слабкий стукіт у землі під ногами — ніби саме Сховище кличе їх назад, по одному глухому стукоту за раз."

  vls_no_more_food_stamps:0 "Урожай тук-тук"
  vls_no_more_food_stamps_desc:0 "Гідропонні відсіки підтримували в нас життя, але ледве-ледве. З належними теплицями просто неба ми нарешті матимемо справжню їжу. Проте деякі поселенці почали позначати свої поля дивними маленькими пірамідками — купами каміння, позначками, вирізаними на дереві. Кажуть, це відлякує «Їх». Нокс не сказав про це ні слова... але він і не зупиняв їх."

  vls_more_breathing_space:0 "Більше простору для дихання"
  vls_more_breathing_space_desc:0 "Навіть у найкращі часи Блек-Каньйон — це дезорганізована, небезпечна пекельна діра. Настав час дати хорошим людям зі Сховища 27 той простір для дихання, на який вони заслуговують!"

  vls_fresh_air:0 "Небо вгорі, стукіт внизу"
  vls_fresh_air_desc:0 "Уперше Наглядач Нокс прокинувся під відкритим небом, коли сонячне світло заливало його обличчя. І все ж, навіть тут, в оточенні полів і вільного повітря, він завмер. За гудінням цикад і шелестом трави він був там: слабкий, але безпомилковий — тук, тук, тук. Десь цей стукіт триває."

  vls_ghosts_in_the_shell:0 "Маршируючи в такт"
  vls_ghosts_in_the_shell_desc:0 "Примарна дивізія не б'ється заради честі чи виживання — вони б'ються, бо ними щось рухає. Щось у їхніх чорних шоломах, у їхніх глухих кроках говорить про неминучість. Вони рухаються в моторошній синхронності, їхні важкі черевики опускаються в тому ж ритмі, що й стукіт, який Томас чує в стінах. Що б там не було в пустці... воно марширує в такт із ними."

  vls_open_vault_riches:0 "Останній стукіт Сховища"
  vls_open_vault_riches_desc:0 "Коли двері Сховища зі скрипом відчинилися, а громадяни висипали назовні, обтяжені натискні пластини активували останній фокус. Відкрилися приховані камери, оголивши схованки з інструментами, припасами та забутими предметами розкоші. Наглядач Нокс швидко й тихо знову запечатав їх. Але з відкриттям прийшло щось інше — щось слабке, щось... що стукає."

  vls_spacey_vault:0 "Відкрийте стіни, випустіть стукоти"
  vls_spacey_vault_desc:0 "Більше ніяких переповнених ліжок. Ніяких нескінченних черг за вентиляцією та продуктовими пайками. Люди Сховища 27 вільні, під відкритим небом і на відкритій землі. Але деякі жителі все ще озираються на двері сховища, ніби очікуючи, що щось — або хтось — піде за ними назовні. І в тиші сутінків одне питання залишається без відповіді:\n«Хто стукав весь цей час?»"

  ###vault27 ideas
  vls_ghost_division:0 "Примарна бригада"
  vls_ghost_division_desc:0 "Колись громадяни, а нині легенди в чорній силовій броні, Примарна дивізія є мечем і щитом Сховища 27. Але їхня легенда стає все дивнішою з кожною вилазкою. Вони стукають перед тим, як увійти в руїни, стукають перед тим, як запечатати шлюзи, двічі стукають перед тим, як вистрілити. Одні кажуть, що це ритуал, інші — що це повага. Але ніхто не наважується запитати їх чому."
  vls_ghost_army:0 "Стукаючий марш"
  vls_ghost_army_desc:0 "Коли Примарна дивізія рухається, світ слухає. Ритм їхнього маршу розноситься далеко пусткою, звук, схожий на далекий грім — або глухий стукіт по сталі. Вони перестали щось пояснювати. Вони маршують, вони стукають, і вони перемагають."
  vls_full_vault:0 "Стукоти в кожному кутку"
  vls_full_vault_desc:0 "Навіть зараз, маючи більше простору і більше повітря, деякі жителі присягаються, що стукіт не припинився. Вони чують його в нових теплицях, у вітряках і в проміжках між ними. Чим би це не було, воно все ще слухає."
  vls_open_vault:0 "Відкрите Сховище, відкриті стукоти"
  vls_open_vault_desc:0 "Сховище відкрито, повітря свіже, а стукіт став... тихішим. Поки що."

  ###vault27 events

  vls_vault.1.t:0 "Наша єдина можливість"
  vls_vault.1.d:0 "Зграя розбійників із Загарбників ділянок перетнула кордон і тримає в заручниках Досягнення Вейла. Блек-Каньйон занадто дезорганізований, щоб організувати власний наступ. Однак наші Привиди знають цю територію краще за будь-кого і можуть легко врятувати місто від цих бандитів. Чи варто звільнити місто і повернути його Блек-Каньйону, чи нам слід залишити цю територію собі?"
  vls_vault.1.a:0 "Місто буде нашим!"
  vls_vault.1.a_tt:0 "Ми нападемо на повстанців-загарбників прямо, захопивши місто для себе!"
  vls_vault.1.b:0 "Будьмо хорошими сусідами"
  vls_vault.1.b_tt:0 "Ми спочатку зв'яжемося з Блек-Каньйоном і працюватимемо з ними, щоб врятувати місто"
  vls_vault.1.c:0 "Місто буде нашим!"

  vls_vault.2.t:0 "Фантомний удар"
  vls_vault.2.d:0 "Тільки Примарна дивізія знає, як бути непомітною в силовій броні. Вони пройшли прихованими торговельними шляхами і швидко оточили місто, вирізавши загарбників і врятувавши всіх, крім жменьки містян, від їхніх гнобителів. Досягнення Вейла швидко прийняло контроль Сховища 27 над територією, а солдати Блек-Каньйону відмовилися від будь-якого наступу на наших сильніших Привидів."
  vls_vault.2.a:0 "Паща Долини наша!"

  vls_vault.3.t:0 "Вперті товстороги"
  vls_vault.3.d:0 "Блек-Каньйон заявив, що наша допомога їм не потрібна, і наказав нашим Привидам забратися з території. «Переговори» Блек-Каньйону призвели до двогодинної перестрілки, в якій загинули обидві армії та більшість містян. Тепер Привиди готові зачистити всіх, хто залишився, і залишити місто собі."
  vls_vault.3.a:0 "Вперті виродки... накажіть наступати!"

  vls_vault.4.t:0 "Добра воля і добра справа"
  vls_vault.4.d:0 "Блек-Каньйон із радістю прийняв нашу пропозицію про допомогу. Ополчення Блек-Каньйону відвернуло увагу на схід, поки Примарна дивізія тихо налетіла із заходу, вирізавши гнобителів і врятувавши містян до останнього. Тепер люди з Нарроу також просять підтримки Сховища 27, по суті, передаючи весь регіон під наш контроль."
  vls_vault.4.a:0 "Здається, ця штука з «кармою» працює."


  #timekeepers focus

  clk_tick:0 "Сховище, що цокає"
  clk_tick_desc:0 "§OГодинник цокає, дзвоник б'є, він завжди там. Він такий же реальний, як ти чи я, але його неможливо торкнутися. Він створює і забирає, йому байдуже, тому що йому завжди було байдуже, і так буде завжди. Можеш намагатися втекти від нього, боятися його, але він неминучий. Цінуй те, що маєш, поки можеш, твій час настане...§! §Rале цього не повинно статися.§!"

  clk_goal_tock:0 "Наглядач: Ток"
  clk_goal_tock_desc:0 "Коли пару десятиліть тому двері Сховища 60 відчинилися, першим на пісок ступив Наглядач Ток. Його експедиція заснувала нинішні володіння жителів Сховища, зробивши його команду героями. Він був охрещений як Головний Хранитель Часу, згодом ставши першим, хто також отримав титул Наглядача. Його реформи були радикальними, але вони необхідні, якщо сховище і його люди хочуть вижити."

  clk_vault_rests_not:0 "Сховище, що ніколи не спить"
  clk_vault_rests_not_desc:0 "Сховище обмежене лише його мешканцями. Поки інші сховища цілими днями б'ються головою об стіну, ми з користю використовуємо свій час. Завдяки нашому вмінню ефективно розпоряджатися часом ми змогли перевершити всі попередні цілі ефективності сховища. Зрештою, час — це гроші."

  clk_goal_mold:0 "Ламаючи стереотипи"
  clk_goal_mold_desc:0 "Ризики очевидні, але настав §Oчас§! для змін. Ми не можемо залишатися пасивними в нашому сховищі, просто чекаючи смерті. Ми маємо діяти, ламати стереотипи. Готуйте людей, ми йдемо на війну."

  clk_goal_crushing_white:0 "Знищення Білоногих"
  clk_goal_crushing_white_desc:0 "Найгіршим були не бомби, а те, що було після них. Торгові каравани знайшли наші найвіддаленіші поселення у вигляді купок попелу. Черепи на саморобних палях були встановлені по всьому периметру. Пісок у пісочному годиннику витікає, ми повинні врятувати наших людей до того, як §Oнаш час§! вийде..."

  clk_goal_army:0 "Реорганізація нашої армії"
  clk_goal_army_desc:0 "Сховища ніколи не були розраховані на розміщення армії. Суворе дотримання розпорядку в нашому сховищі залишило нашій команді служби безпеки лише боротьбу з рідкісними дрібними загарбниками. Тепер від радтарганів ми переходимо до рейдерів. Вони прагнуть крові, давайте спробуємо пролити їхню натомість."

  clk_goal_know_enemy:0 "Пізнати ворога"
  clk_goal_know_enemy_desc:0 "Наша армія слабка: вони ніколи не знали, що таке справжній терор. Розвідники повертаються похмурими з Лінкольна та Фріско, але їхні розповіді мало до кого доходять. Якщо ми плануємо виграти, ми повинні показати їм, з чим вони насправді зіткнулися."

  clk_road:0 "Шлях попереду"
  clk_road_desc:0 "Куди нам іти далі? §RБілоногі§! були розбиті, а Новий Ханаан навчився займатися своїми справами. Хоча світу краще з нами, ніж з ними, він усе ще залишається непривітним. Ми не можемо просто зупинитися зараз, ми і так уже зробили дуже багато. Ток постраждав найсильніше, і він знає, що все виправить. Тепер ніхто не стане на нашому шляху до кращого §Oмайбутнього§!."

  clk_raiding:0 "Друзі у вищих колах"
  clk_raiding_desc:0 "Нам не слід було вважати, що в пустці живуть лише безжальні дикуни; там усе ще є надія. Ми знайшли групу, яка досі практикує столітній спорт польотів. Вони діють зі старої військової бази. Можливо, ми навіть знайдемо там щось, що зможе виконати обіцянку Тока про краще §Oмайбутнє§!."

  clk_sky_trade_deal:0 "Встановлення торговельних угод"
  clk_sky_trade_deal_desc:0 "Крім наявності військового союзу, для нас обох вигідно мати регулярні каравани між нашими поселеннями."

  clk_open_northern_front:0 "Відкриття Північного фронту"
  clk_open_northern_front_desc:0 "Тар-Вокери, можливо, не найгірші сусіди. Вони, безперечно, завдали нам меншої шкоди, ніж Білоногі. Проте наступальні та оборонні переваги захоплення 89-го шосе та гірських перевалів занадто великі, щоб від них відмовлятися."

  clk_disappointment_time:0 "Зміна в розкладі"
  clk_disappointment_time_desc:0 "Несподівана зустріч відсуває наш орієнтовний §Oчас§! до успіху."

  clk_heading_eastward:0 "Курс: на 3 години"
  clk_heading_eastward_desc:0 "Якщо центральна база Сплячих знаходиться на сході, то на схід ми і попрямуємо. Там ми знайдемо брухт і дослідження, щоб забезпечити нове §Oмайбутнє§!."

  clk_timing_engines:0 "Системи синхронізації двигунів"
  clk_timing_engines_desc:0 "Досить важливо, щоб усі рухомі деталі двигуна, як для наземного, так і для повітряного використання, працювали як §Oгодинник§!."

  clk_northern_push:0 "Звивистий шлях на північ"
  clk_northern_push_desc:0 "Звідси ми повинні вирушити на північний схід, через землі Юїнта до торговельного центру Ігл-Рок. Їхні дирижаблі, ймовірно, становитимуть загрозу, але ми залишимо цю битву Ріверам."

  clk_free_watches:0 "Синхронізовані годинники"
  clk_free_watches_desc:0 "Здається, місцеві жителі на поверхні трохи менше звикли до пунктуальності. Завдяки деяким корисним запасним годинникам вони нарешті почнуть приходити на свої робочі зміни рівно о 07:00."

  clk_meticulous_bases:0 "Підготовка до підтримки"
  clk_meticulous_bases_desc:0 "Перетнути річку Колорадо буде складно, особливо якщо захисники на тому березі застануть нас зненацька. Якщо Рівери хочуть відіграти свою роль, нам знадобляться нові злітні смуги для їхнього запуску."

  clk_cash_for_clocks:0 "Готівка за годинники"
  clk_cash_for_clocks_desc:0 "В Ігл-Року дійсно накопичилося чимало багатств, як у кришках, так і в торговому брухті, завдяки їхнім довгим мандрівкам небом. Але що дійсно має значення, так це різноманіття стилів годинників у коморах! І переконатися в їхній інтеграції теж важливо, мабуть."

  clk_sleepers:0 "Час прокидатися"
  clk_sleepers_desc:0 "Надія є, вона в межах нашої досяжності. §OНаглядач Ток§! привів нас сюди, у каньйон, щоб досягти нашої остаточної мети. Усе вело до цього: якщо те, що нам потрібно, дійсно там, ми нарешті зможемо вирватися.\n§OЗаради майбутнього наших людей і майбутнього нашого світу — зробимо все можливе, щоб це мало значення.§!"

  clk_tick_2:0 "Сховище, що цокає"
  clk_tick_2_desc:0 "§OГодинник цокає, дзвоник б'є, він завжди там. Він такий же реальний, як ти чи я, але§W... зачекайте, хіба ми тут ще не були?"

  clk_goal_stealer:0 "Натяк на втручання"
  clk_goal_stealer_desc:0 "Ядерний блок тут, чийсь капелюх, може, навіть кіт або два. Минуле сповнене розкошів, про які ми могли тільки мріяти. Поки ми обережні й не створюємо жодних §Rпарадоксів§W, усе буде добре. Навряд чи хтось сумуватиме за всім цим."

  clk_goal_tock_2:0 "Володар: Ток"
  clk_goal_tock_2_desc:0 "Натхненник усього цього, наш рятівник. Подібно до того, як Мойсей розсунув Червоне море, Ток розгромив §RБілоногих, Тар-Вокерів, Скорботних і Сплячих.§WНаша свобода від жахів цього світу, що вже близько, була б неможливою без нього. §WЛюдина, що стоїть над усім, навіть над §Oчасом."

  clk_goal_master:0 "Майбутнє"
  clk_goal_master_desc:0 "§OМи біля брами, машина готова до постпоточної подорожі. Ми бачили минуле і пережили сьогодення, ми досягли більшого, ніж будь-хто міг уявити. Ми нарешті будемо вільні від зла наших предків і зможемо вершити власну долю. Після всього цього часу ми нарешті зробили це."

  clk_goal_debt_repaid:0 "Повернення наших боргів"
  clk_goal_debt_repaid_desc:0 "Наші друзі в Зоні 51 неодноразово доводили свою цінність, з §Oчасом§! усе більше й більше. Вони підтримували нас у наших конфліктах, тож ми маємо підтримати їх у їхніх."

  clk_goal_debt_repaid_2:0 "Від одного Володаря іншому"
  clk_goal_debt_repaid_2_desc:0 "Доказ нашої відданості зміцнив зв'язки між нами. Небесні Рівери пропонують нам кращі умови і трохи нових знань."

  clk_goal_slay_the_sky:0 "Одинадцята година"
  clk_goal_slay_the_sky_desc:0 "Можливо, було §Oнеминуче§!, що до цього дійде. Можливо, було нерозумно вірити, що з рейдерами все може закінчитися інакше."

  clk_goal_slay_the_sky_2:0 "Заплановані допити"
  clk_goal_slay_the_sky_2_desc:0 "«А тепер, будь ласка, говоріть голосно й чітко в мікрофон. У нас є до вас лише кілька запитань, містере Криваві Пальці, щодо вашого польотного журналу.»"

  clk_goal_stealing_time:0 "Повертаючи потік назад"
  clk_goal_stealing_time_desc:0 "Кілька налаштувань для стабілізації машини, і ми можемо надійно здійснювати екскурсії в попередні епохи. Ризик створення §Rпарадоксів§W відносно невеликий, з огляду на всі обставини. Тільки уникайте зустрічей зі своїми прапрадідками, будь ласка."

  clk_goal_stealing_time_2:0 "Повторення старих помилок"
  clk_goal_stealing_time_2_desc:0 "Побачивши як §OМинуле§!, так і §OМайбутнє§!, чи справді людина не має іншого способу життя? Чи є §RВійна§! єдиною константою?"

  clk_goal_guarding_utah:0 "Врятуй Юту — врятуй світ"
  clk_goal_guarding_utah_desc:0 "Якщо §OМайбутнє§! Землі можна змінити, то це почнеться тут, у Юті. А якщо ми зазнаємо невдачі... нам просто доведеться §Rспробувати, спробувати і ще раз спробувати.§!"

#Timekeepers tooltips
  clk_wall_tt:0 "§gОборонна лінія буде §Oзнайдена§! вздовж нашого кордону з §RБілоногими.§!"
  clk_enemy_tt:0 "§g§RБілоногі§! почали організовувати зусилля, щоб §Rзнищити§! наш народ! На щастя, §Oчас§! на нашому боці. Ми повинні почати готуватися, оскільки §Rця війна не буде легкою.§!§!"
  clk_friend_tt:0 "§OМи перемогли §RБілоногих§!. Зі смертю §RСолі-на-Рани§! ми можемо почати прокладати шлях у §Oмайбутнє!§!§!"
  clk_raiding_tt:0 "§GМи укладемо пакт про взаємодопомогу з Небесними Ріверами!§!"
  clk_gotta_go_east_tt:0 "§OМатеріалів тут, на цій збитій станції.... навіть усіх техно-відходів у Великому Каньйоні §Rнедостатньо§!.§!"
  clk_helping_tt:0 "§OЯк усе могло дійти до такого, ми зробили щось не так, ми зробили недостатньо. Ми зупинилися на станції, але маємо йти далі. Ми повинні тримати світ під своїм крилом, плекати майбутнє, те, на яке ми заслуговуємо.§W"
  clk_helping_tt.b:0 "§OЯк усе могло дійти до такого, ми зробили щось не так, ми зробили недостатньо. Ми зупинилися на станції, але маємо йти далі. Ми повинні тримати світ під своїм крилом, плекати майбутнє, те, на яке ми заслуговуємо.\n§RМи почнемо з цих зрадливих небесних рейдерів.§W"
  clk_vault.11.tooltip:0 "§RЗ жалюгідною поразкою колись могутніх воїнів доріг ми тепер маємо повний контроль над їхніми гаражами та депо. Багато їхнього спорядження було втрачено у війні, але дещо ще залишилося, щоб ми могли його зібрати.§!"
  clk_vault.reavers:0 "§GНаше партнерство з Небесними Ріверами виявилося занадто вигідним, щоб дозволити йому закінчитися вже зараз; хоча це може бути непопулярним рішенням, можливо, ми зможемо укласти з ними нову угоду. В обмін на запчастини для їхніх літаків вони продовжуватимуть підтримувати нас у наших майбутніх починаннях.§!"
  clk_vault.reavers.a:0 ""§OОх. Ток, здається, щойно відкрилося щось нове та унікальне для дерева фокусів. Що б це могло означати?§!""
  clk_transfer_to_sky_tt:0 "§gЯкщо ми володіємо будь-якими регіонами, що є національними для §O[GRA.GetName]§!, §O[RIP.GetName]§! або §O[RUB.GetName]§!, ми передамо їх §O[SKY.GetNameDef]§!.§!"
  clk_utah_and_nevada_tt:0 "§gНадає §Gпретензії§! на кожен регіон у §OЮті§!.\n\nЯкщо ми все ще в союзі з §YНебесними Ріверами§!, надає їм §Gпретензії§! на кожен регіон §OНевади§!.§!"

  #timekeepers ideas
  clk_timing_everything:0 "Час вирішує все"
  clk_timing_everything_desc:0 "У Сховищі 60 постійно лунає звук численних годинників, що відзначають хід часу до найменших часток. Час є центральним елементом для Хранителів Часу, як буквально в плануванні їхнього дому, так і фігурально в їхньому способі життя. В їхній культурній одержимості ним є майже духовний... аспект. Ця одержимість проявляється в багатьох формах, включаючи відданість пунктуальності, ефективну організацію для скорочення марнотратства часу та природну схильність до хронометражу своїх рухів."
  clk_never_rests:0 "Сховище, що ніколи не спить"
  clk_never_rests_desc:0 "Проникливе керівництво Наглядача Тока та дотримання суворого розкладу призвели до того, що Сховище 60 стало одним із найуспішніших експериментів «Волт-Тек»."
  clk_mold_breaking:0 "Ламаючи стереотипи"
  clk_mold_breaking_desc:0 "Наш §Oчас§! скоро настане. А доти ми готуємося."
  clk_army_reorg:0 "Реорганізація армії"
  clk_army_reorg_desc:0 "Наша команда служби безпеки найкраще оснащена, щоб очолити нову армію. Хоча їхній досвід боротьби з організованими арміями майже нульовий, вони мають найбільший досвід поводження зі зброєю і можуть навчити цього новобранців."
  clk_crushing_white:0 "Знищення Білоногих"
  clk_crushing_white_desc:0 "§OЧас§! §RСолі-на-Рани§! §Rнастав.§!"
  clk_know_enemy:0 "Пізнати ворога"
  clk_know_enemy_desc:0 "Тепер, коли наші розвідники повернулися, ми маємо уявлення про те, з чим стикаємося. Ми повинні поширити ці знання серед нашого персоналу, щоб наші командири були готові, коли війна неминуче настане."
  clk_sleeping:0 "Пробудження Сплячих"
  clk_time_research:0 "Постпоточні дослідження та розробки"
  clk_the_push:0 "Наше останнє зусилля"
  clk_the_deal:0 "Угода Кроноса"
  clk_the_deal_kronos:0 "Угода Тока"
  clk_the_deal_betrayed:0 "Знання Ріверів"

