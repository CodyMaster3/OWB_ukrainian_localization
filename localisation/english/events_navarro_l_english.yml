l_english:
############################
nf_navarro.1.t:0 "Форпост Свободи"
nf_navarro.1.d:0 "Минуло понад тридцять років відколи герої НКР розбили сили Анклаву в Наварро, і відтоді могутні першопрохідці рушили на північ, щоб приборкати цей дикий край. Під проводом брамінових баронів та [RDS.GetLeader] наші люди відкривали шахти, збирали брухт у містах та розбудовували ферми, щоб нагодувати голодну Республіку.\n\nАле не всі раді нашій величній місії. Деякі племена, не бажаючи приймати освічене керівництво НКР, чинять опір нашим спробам цивілізувати фронтир. Поселенці Ши із Сан-Франциско відмовляються визнавати владу рейнджерів. А дехто подейкує, що Братерство досі має там своїх агентів, які діють проти Республіки. Час покаже, чи зможе хоч хтось із цих ворогів загрожувати нашому маршу свободи."
nf_navarro.1.a:0 "Ведмідь розчавить усіх своїх ворогів."

############################
nf_navarro.2.t:0 "Наш Новий Дім"
nf_navarro.2.d:0 "Імператор, хай живе він десять тисяч років, бачив, що Сан-Франциско розростається. Він спонукав Ши відправляти фермерів та робітників на північ, на фронтир Наварро. Там вони процвітали, годуючи все місто. Нові сорти рису та пшона годують зголоднілий край набагато краще, ніж браміни з Реддінга коли-небудь зможуть, і як Послідовники, так і племена радо нас прийняли. Але все змінилося. Тепер Ван Граффи діймають нас погрозами, які вони називають «податками», тоді як племена налаштовуються проти нас. Радник Імператора висловився чітко: якщо Сан-Франциско хоче процвітати, воно має звільнити Території Наварро."
nf_navarro.2.a:0 "Поселенці принесуть нам усім честь."

############################
nf_navarro.3.t:0 "Згадати Наварро"
nf_navarro.3.d:0 "Після того, як племінник з Арройо знищив нафтову платформу Анклаву, ми приєднались до НКР, щоби захопити Наварро. Але на відміну від військ Республіки, ми ставилися до місцевих із повагою – і дехто з них навіть приєднався до нас як паладини. Вони повернулись під час нашої війни з НКР і допомогли атакувати Реддінґ, знищивши його золоті резерви. Тепер вони борються за свою землю і спосіб життя проти НКР. Можливо, ми могли б допомогти їм, якщо буде потреба."
nf_navarro.3.a:0 "Корисний спосіб дошкулити Ведмедю."

############################
nf_navarro.4.t:0 "Битва за Бодегу"
nf_navarro.4.d:0 "Сонне містечко Фусан, розташоване поблизу руїн старої Бодеги з великою громадою Ши, є одним із небагатьох поселень, розкиданих узбережжям Наварро. Там усе було гаразд аж до [GetDateText]. Саме того фатального дня найманці Ван Граффів увійшли до міста й почали чіплятися до місцевої жінки, штовхнувши її в багнюку та забруднивши її ціпао. Чоловік жінки вдарив найманця, а ті у відповідь застрелили його. Але зброї у Ши виявилося більше, ніж самих Ван Граффів. Коли цей кривавий день добіг кінця, тринадцять Ши та всі вісім Ван Граффів були мертві. Це стало точкою кипіння для регіону, який Каліфорнія називала \"Територіями Наварро\". Люди, які не мали жодних реальних зв'язків із Шейді-Сендс, повстали, щоб захистити свої права... і НКР, через свої зв'язки з Ван Граффами, опинилася по той бік барикад, воюючи проти поклику свободи."
nf_navarro.4.a:0 "Чому вони не довірились судам НКР?"
nf_navarro.4.a_tt:0 "Почнеться Битва за Бодегу!"

############################
nf_navarro.5.t:0 "Битва за Бодегу"
nf_navarro.5.d:0 "Наші хоробрі селяни – основа суспільства – були атаковані бандитами ван Ґраффів у місті Фусан.\n\nАле що робити? Ло Пан вважає, що достатньо буде обмеженої військової сили – загонів найманців. Навіщо ризикувати життями громадян?\n\nПроте Акіґахай, останній учень Дракона, кидає виклик. Лише Ші мають боротися за свій народ! Ми маємо йти на війну! Після палкої промови перед учнями, Ші вирушать на війну – навіть якщо Ло Пан не стане на їх чолі.\n\nЩо зробить Імператор? У раді ведуться гарячі суперечки. Імператор радить обережність перед могутністю Республіки, але Акіґахай прагне відправити шаолінів на північ. Чому ми повинні терпіти образи Республіки? Якщо вони хочуть знущатись із нашого народу – нехай доведуть, що варті цього!"
nf_navarro.5.a:0 "Винний має сплатити, боржник – повернути борг."
shi_hostile:0 "Ворожі Ші"
nf_navarro_shi_hostile_tt:0 "\n§gВедмідь не буде в захваті. Краще переконайтесь, що ви переможете.§!"
nf_navarro.5.b:0 "Ближній сусід дорожчий за далекого родича."

############################
nf_navarro.6.t:0 "Битва за Бодегу"
nf_navarro.6.d:0 "Схоже, Ведмідь починає досягати межі своїх можливостей; Вільні Люди та Ші піднялися на зброю проти сил Республіки в Наварро, відтісняючи НКР із північного заходу Каліфорнії. Це спричинило кризу в Евриці, де місцеві мешканці сперечаються, що робити. Дехто хоче залишитись нейтральними. Але інші вказують, що Вільні Люди можуть стати цінним знаряддям для Еврики, допомагаючи витіснити НКР на південь. Наварро може стати базою, яка покаже Каліфорнії, якою вона могла би бути – якби НКР не придушила всіх, хто думав і мріяв по-іншому."
nf_navarro.6.a:0 "Ми найманці, а не будівничі імперії!"
nf_navarro.6.b:0 "Ми мусимо встати, перш ніж Ведмідь встане на нас."
nf_navarro.6.b_tt:0 "\n§gЯкщо ви переможете, ви заміните частину свого дерева фокусів на нову гілку. Але майте на увазі: ви розлютите НКР!§!"

############################
nf_navarro.7.t:0 "Перемога в Наварро!"
nf_navarro.7.d:0 "Попри всі зусилля Республіки, наш вірний народ здобув перемогу в Наваррських Територіях і благав про милосердне правління Імператора (хай живе десять тисяч років). Сповнений мудрості та турботи про всіх під Небесами, Імператор наказав своїм військам рухатись на північ і знешкодити залишки опору. Наразі, здається, Наварро – наше."
nf_navarro.7.a:0 "Легко здобуте – легко втрачене; тяжко здобуте – міцно тримане."

############################
nf_navarro.8.t:0 "Перемога в Наварро!"
nf_navarro.8.d:0 "Імператор та Ведмідь обоє прагнули завоювати Наварро. Ші – заради зерна та лісу, Ведмідь – заради брамінів. Але Наварро було нашим домом, останнім американським форпостом на заході.\n\nМи не можемо поки що відкрито підняти наш прапор. Ведмідь тепер буде пильнішим, ніж будь-коли. Уже ширяться чутки та підозри, шепочуть про силову броню Анклаву в лісах. У нас немає вертіптах, що колись прочісували небо, і тепер ми стикаємось із державами, які мають свої ВПС. Але принаймні на один день, американський прапор вільно майорить над Наварро.\n\nМи повернулись. І цього разу – не підемо."
nf_navarro.8.a:0 "Ласкаво просимо додому, Граніт."
nf_eureka_suspicious_very_tt:0 "\n§YНКР§! стане §Rдуже уважною!§!"

############################
nf_navarro.9.t:0 "Перемога в Наварро!"
nf_navarro.9.d:0 "Ші, Братство й племена зробили все можливе, щоб знищити НКР. Але тепер ми міцно закріпились у Наваррських Територіях. Ми знову довели, що Ведмідь ніколи не віддає свою землю. Ба більше – цей конфлікт дав нам змогу зміцнити контроль Республіки над регіоном, посиливши нашу армію."
nf_navarro.9.a:0 "Перемога демократії, Перемога Республіки!"

############################
nf_navarro.10.t:0 "Прапори наших Батьків"
nf_navarro.10.d:0 "Для Ші Наварро – це нова миска рису, шанс вирватись із зашморгу НКР. Для Республіки – черговий фронтир, дика місцина для випасу брамінів, що несуть багатство та силу. А для Еврики? О, хлопче, відкривай пиво.\n\nДля Гранітної Компанії це була домівка Анклаву, остання найкраща надія Пустки. А для решти в Евриці? Це поставило Ведмедя просто на наш поріг – точку для потенційного наступу на північ. Не те щоб у нас були якісь проблеми з нашими друзями із Шейді-Сендс, звісно. Проте аргумент можна обережно сформулювати: Еврика має розглянути контракти з племенами Наварро, цими мирними людьми. А якщо їм не по кишені? То, можливо, варто домовитись про якусь довгострокову угоду."
nf_navarro.10.a:0 "Боже, благослови Ан... Еврику."

############################
nf_navarro.11.t:0 "Битва за Бодегу"
nf_navarro.11.d:0 "Спокійне шіське містечко Фусан, неподалік старої Бодеги, було одним із небагатьох поселень на узбережжі Наварро. І все було мирно – аж до [GetDateText]. У той фатальний день шіські повстанці напали на наших податківців, порушивши закон на тяжко здобутій землі. Чи можемо ми терпіти таке? Звісно, що ні! Ми йдемо на війну. А як інакше захистити наших громадян?"
nf_navarro.11.a:0 "Захищати свій народ, незалежно від ціни."
