l_english:
############################
nf_navarro.1.t:0 "Форпост Свободи"
nf_navarro.1.d:0 "Минуло понад тридцять років відтоді, як герої НКР розбили сили Анклаву в Наварро, і з того часу могутні першопрохідці ринули на північ, щоб підкорити дикі землі. Під керівництвом Брамінських баронів та [RDS.GetLeader]. Наші люди відкривали шахти, обшукували міста та будували ферми, щоб прогодувати голодну Республіку.\n\nАле не всі задоволені нашим явним призначенням. Деякі племена, не бажаючи приймати освічене керівництво НКР, чинять опір нашим спробам цивілізувати фронтир. Поселенці Ші із Сан-Франциско відмовляються визнавати владу рейнджерів Реддінга. І, як дехто подейкує, Братство все ще має там своїх агентів, які діють проти Республіки. Час покаже, чи зможе хтось із цих ворогів загрожувати нашому маршу свободи."
nf_navarro.1.a:0 "Ведмідь розчавить усіх своїх ворогів."

############################
nf_navarro.2.t:0 "Наш Новий Дім"
nf_navarro.2.d:0 "Імператор, нехай живе він десять тисяч років, бачив, що Сан-Франциско зростає. Він закликав Ші відправити фермерів та робітників на північ, до фронтиру Наварро. Там вони процвітали, годуючи все місто. Нові сорти рису та проса годують голодний край набагато краще, ніж будь-коли зможуть браміни Реддінга, і Послідовники та навіть місцеві племена радо нас прийняли. Але все змінилося. Тепер Ван Граффи дошкуляють нам погрозами, які вони називають «податками», а племена підбурили проти нас. Що буде з нашим новим фронтиром — невідомо."
nf_navarro.2.a:0 "Поселенці принесуть нам усім честь."

############################
nf_navarro.3.t:0 "Пам'ятай Наварро"
nf_navarro.3.d:0 "Після того, як дикун з Арройо знищив нафтову вишку Анклаву, ми приєдналися до НКР, щоб захопити Наварро. Але, на відміну від військ НКР, ми ставилися до місцевих жителів з повагою, і дехто з них навіть приєднався до нас як паладини. Вони повернулися під час нашої війни проти Нової Каліфорнійської Республіки і допомогли нам здійснити напад на Реддінг та знищити золоті резерви. Тепер вони використали цей досвід і борються за свій спосіб життя проти НКР. Хоча ми не в змозі їм допомогти, ми не будемо ставати їм на заваді."
nf_navarro.3.a:0 "Ведмедя легко злякати тими, хто твердо стоїть на своєму."
############################
nf_navarro.4.t:0 "Битва за Бодегу"
nf_navarro.4.d:0 "Сонне містечко Ші під назвою Фусан, розташоване поблизу місця старої Бодеги, є одним із небагатьох на узбережжі Наварро, і все там було гаразд до [GetDateText]. Саме того фатального дня найманці Ван Граффів увійшли в місто та почали чіплятися до місцевої жінки, штовхнувши її в бруд і забруднивши її ціпао. Чоловік жінки вдарив найманця Ван Граффів, і за це його застрелили. Але зброї у Ші виявилося більше, ніж у Ван Граффів. Коли цей кривавий день добіг кінця, тринадцять Ші і вісім найманців Ван Граффів були мертві. Це стало точкою кипіння для того, що Каліфорнія називала «Територією Наварро». Люди, які не мали жодних реальних зв'язків з Шейді-Сендс, повстали, щоб захистити свої права. І НКР виявила, що бореться проти поклику свободи."
nf_navarro.4.a:0 "Чому вони не довірилися судам НКР?"
nf_navarro.4.a_tt:0 "Розпочнеться Битва за Бодегу!"
############################
nf_navarro.5.t:0 "Битва за Бодегу"
nf_navarro.5.d:0 "«Ми повинні послати Гвардію їм на допомогу!» — голосно заявила Акігахай, і її голос рознісся залою для аудієнцій Сталевого палацу. «На наших людей напали. Це обов'язок Гвардію, чи не так? Захищати народ Ші?» \n\n«Це не їхня робота — допомагати злочинцям проти законних агентів іноземних держав», — Ло Пан одразу ж заслужив зневажливий погляд Акігахай. «Я завжди казав, що дозволити нашим людям іти на північ було помилкою. Це земля НКР, і нам там нема чого робити. Ми повинні вивести наших людей, а не закріплювати їх там». \n\n«Звісно, ти б віддав наших людей та їхні домівки на поталу Ведмедю. Завжди вірний підлабузник, га?» \n\nПерш ніж напруга встигла зрости, старійшина Френсіс став між двома вороже налаштованими майстрами бойових мистецтв. «Досить! Вам дозволили висловитися тут як видатним представникам громади, але ви маєте виявляти пристойність, гідну шанованого палацу Імператора. Це зрозуміло?» З їхнього похмурого мовчання Френсіс зрозумів, що це зрозуміло радше через страх розправи, аніж з поваги до інституції. \n\n«Імператор обміркує те, що тут було сказано, — оголосив Кен Лі, бажаючи покласти край цим слуханням, — і його указ буде оголошено, коли настане слушний час». Але він знав, що хтось обов'язково залишиться незадоволеним, хоч би якими були розрахунки Імператора."
nf_navarro.5.a:0 "Винуватець має спокутувати свою провину, а боржник — сплатити борг."
shi_hostile:0 "Ворожі Ші"
nf_navarro_shi_hostile_tt:0 "\n§gВедмідь не зрадіє цьому. Вам краще переконатися, що ви переможете.§!"
nf_navarro.5.b:0 "Близький сусід важить більше, ніж далекий родич."
############################
nf_navarro.6.t:0 "Битва за Бодегу"
nf_navarro.6.d:0 "Схоже, Ведмідь, можливо, досягає своїх меж; Вільний Народ і Ші тепер зі зброєю в руках виступають проти сил Республіки в Наварро, послаблюючи хватку НКР на північному заході Каліфорнії. Це викликало кризу в Евриці, оскільки жителі міста сперечаються, що робити. Дехто бажає зберігати нейтралітет. Але інші вказують на те, що Вільний Народ може стати цінним маріонетковим союзником для Еврики і допомогти відтіснити НКР на південь. Наварро могло б стати базою, щоб показати Каліфорнії, що могло б бути, якби НКР не придушувала всіх, хто думав і мріяв про інший шлях."
nf_navarro.6.a:0 "Ми найманці, а не будівничі імперій!"
nf_navarro.6.b:0 "Ми повинні повстати до того, як Ведмідь розтопче нас."
nf_navarro.6.b_tt:0 "\n§gВи втратите доступ до кількох частин вашого дерева фокусів і розлютите НКР. Але якщо ви переможете, то розблокуєте нове дерево про підкорення цих земель.§!"
############################
nf_navarro.7.t:0 "Перемога в Наварро!"
nf_navarro.7.d:0 "Незважаючи на всі зусилля Республіки, наші вірні люди перемогли на Територіях Наварро і попросили про співчутливе правління Імператора (нехай живе він десять тисяч років). Сповнені мудрості та турботи про всіх, хто живе Під Небом, солдати Імператора тепер просуваються на північ і ліквідовують будь-які віддалені осередки опору. Здається, наразі Наварро належить нам."
nf_navarro.7.a:0 "Легко здобуте легко втрачається; важко здобуте міцно тримається."
############################
nf_navarro.8.t:0 "Перемога в Наварро!"
nf_navarro.8.d:0 "І китайці, і Ведмідь прагнули завоювати Наварро. Ші заради зерна та деревини, Ведмідь — заради брамінів. Але Наварро було нашим домом, останнім американським форпостом на заході.\n\nМи не можемо відкрито підняти наш прапор, поки що ні. Ведмідь тепер, швидше за все, ще більше зосередиться на цьому регіоні. Вже повзуть чутки та звинувачення, шепіт про силову броню Анклаву в лісах. Нам бракує гвинтокрилів, які колись борознили небеса, і ми стикаємося з державами, що мають власні військово-повітряні сили. Але принаймні на один день над Наварро вільно майорітиме американський прапор.\n\nМи повернулися. І цього разу ми не підемо."
nf_navarro.8.a:0 "Ласкаво просимо додому, Командоре."
nf_eureka_suspicious_very_tt:0 "\n§YНКР§! стане §Rдуже підозрілою!§!"

############################
nf_navarro.9.t:0 "Перемога в Наварро!"
nf_navarro.9.d:0 "Ші, Братство й племена зробили все можливе, щоб знищити НКР. Але тепер ми міцно закріпились у Наваррських Територіях. Ми знову довели, що Ведмідь ніколи не віддає свою землю. Ба більше – цей конфлікт дав нам змогу зміцнити контроль Республіки над регіоном, посиливши нашу армію."
nf_navarro.9.a:0 "Перемога демократії, Перемога Республіки!"

############################
nf_navarro.10.t:0 "Прапори наших батьків"
nf_navarro.10.d:0 "Для Ші Наварро — це нова рисова житниця, спосіб вирватися із задушливих обіймів НКР. Для Республіки це ще один фронтир, неприборкана глухомань для брамінів, які приносять багатство та владу. Для Еврики? Ох, тут краще взяти пиво. Для Компанії Граніта? Це був дім Анклаву, остання найкраща надія Пустки. А для всіх інших в Евриці? Це поставило Ведмедя прямо на їхньому порозі, перетворивши на плацдарм для будь-якого наступу Ведмедя на північ. Не те щоб щось було не так з нашими любими друзями в Шейді-Сендс, звісно. Тим не менш, можна обережно припустити, що Евриці варто розглянути можливість укладення контрактів із племенами Наварро, цими мирними людьми. А якщо вони не можуть дозволити собі контракт? Можливо, вдасться домовитися про якусь довгострокову угоду."
nf_navarro.10.a:0 "Боже, благослови Ан-Еврику."

############################
nf_navarro.11.t:0 "Битва за Бодегу"
nf_navarro.11.d:0 "Спокійне шіське містечко Фусан, неподалік старої Бодеги, було одним із небагатьох поселень на узбережжі Наварро. І все було мирно – аж до [GetDateText]. У той фатальний день шіські повстанці напали на наших податківців, порушивши закон на тяжко здобутій землі. Чи можемо ми терпіти таке? Звісно, що ні! Ми йдемо на війну. А як інакше захистити наших громадян?"
nf_navarro.11.a:0 "Захищати свій народ, незалежно від ціни."
