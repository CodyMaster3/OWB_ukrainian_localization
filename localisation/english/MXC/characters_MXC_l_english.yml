l_english:
MXC_PALADIN_CORSETTI_NAME:0 "Паладин Корсетті"
 MXC_PALADIN_CORSETTI_DESC:0 "На відміну від більшості членів експедиції, Джеррі Корсетті не народився і не виріс у бункері Братства. Експедиція підібрала його, коли вони перетинали кордон Нью-Мексико. Хоча він був звичайним жителем пустки, Старійшина Кемерон розгледів у ньому щось і взяв під своє крило, згодом зробивши його частиною загону «Хавок». Саме тому Корсетті найважче переніс втрату старійшини. Відтоді він став більш нерозсудливим, кидаючись у бій, майже не дбаючи про власну безпеку."

 MXC_PALADIN_NIELS_NAME:0 "Паладин Нільс"
 MXC_PALADIN_NIELS_DESC:0 "Ще одна з перших членів експедиції та частина загону «Хавок». Трейсі Нільс, як і Брікслі, ледве встигла отримати звання паладина перед експедицією. Дівчина з сяючими очима, сповнена надій, Нільс жадала побачити успіх Братства, але зрештою була розчавлена поразкою в Денвері. Колись сповнена надій та оптимізму Нільс стала загартованою, категоричною та нетактовною. Хоча вона й не в захваті від лідерства Брікслі, вона готова йти за нею... принаймні поки що."

 MXC_PALADIN_DEERING_NAME:0 "Паладин Дірінг"
 MXC_PALADIN_DEERING_DESC:0 "Гленн Дірінг розпочав свою кар'єру молодшим розвідником разом зі своєю давньою подругою Андреа Брікслі. Він був одним із перших членів команди, які почали досліджувати схід із загоном «Хавок» Старійшини Кемерона. Дірінг бачив, що його начальниця та подруга дуже впевнено почувається в дикій місцевості, і багато чого в неї навчився, згодом ставши лідером розвідників, коли Андреа підвищили до Командора-Паладина. Дірінг дуже поважає Брікслі і рішуче налаштований йти за нею, навіть якщо це означає йти проти волі верховного командування."

 MXC_KNIGHT_BANKS_NAME:0 "Лицар Бенкс"
 MXC_KNIGHT_BANKS_economic_advisor:0 "Лицар Бенкс"
 MXC_KNIGHT_BANKS_economic_advisor_desc:0 "§GОсобова справа — Бенкс, Діор§!\n\n§YЗвання:§! Лицар\n\nЛицар Бенкс дуже захоплений довоєнною континентальною залізничною системою. Він вірить, що це може стати ключем до доставки технологій, ресурсів, припасів та військ із Середнього Заходу (якщо ми знову належним чином налагодимо контакт) до Лост-Гіллз. Проте наразі він задовольняється організацією зведення нашої твердині та нашими довгостроковими операціями."

 MXC_SCRIBE_MONROE_NAME:0 "Писар Монро"
 MXC_SCRIBE_MONROE_economic_advisor:0 "Писар Монро"
 MXC_SCRIBE_MONROE_economic_advisor_desc:0 "§GОсобова справа — Монро, Рей§!\n\n§YЗвання:§! Писар\n\nПрибувши до Колорадо за наказом покійного Старійшини Кемерона, Писар Монро виділяє час у своєму щільному графіку та важливих дослідженнях, щоб упорядкувати файли експедиції та військове виробництво, значно оптимізуючи цей процес."

 MXC_SCRIBE_PIERCE_NAME:0 "Писар Пірс"
 MXC_SCRIBE_PIERCE_economic_advisor:0 "Писар Пірс"
 MXC_SCRIBE_PIERCE_economic_advisor_desc:0 "§GОсобова справа — Пірс, Стівен§!\n§YЗвання:§! Писар\n\nПисар Пірс має лише одне справжнє захоплення — лазери. Попри запевнення колег-писарів, що секрети виробництва лазерної зброї ніколи не будуть втрачені для Братства, як це сталося з плазмовою зброєю, він наполягає на тому, щоб докладати всіх зусиль для «збереження» лазерної зброї.\n\nХоч він і досить ексцентричний, ніхто не може заперечити, що в часи гострої нестачі зброї його допомога у поверненні спадкової зброї Братства до наших арсеналів є вкрай корисною."
 MXC_MADDOC_CONLEY_NAME:0 "Розвідник Конлі"
 MXC_MADDOC_CONLEY_cultural_advisor:0 "Розвідник Конлі"
 MXC_MADDOC_CONLEY_cultural_advisor_desc:0 "§GОсобова справа — Конлі, Конрад§!\n§YЗвання:§! Старший Лицар\n\nСтарший Лицар Конлі є ще одним прихильником ініціативи розширення лав Братства шляхом вербування жителів пустки. Хоча взаємодія з цивільними від початку не була метою Експедиції Братства в Колорадо, Командор Брікслі схвалила її як екстрений захід, щоб утримати відділення на плаву. Лицар Конлі вірить, що його робота допоможе зберегти мрію Мексона живою, поширюючи її серед усіх, хто готовий слухати."

 MXC_AIDAN_YOUNG_NAME:0 "Паладин Янг"
 MXC_AIDAN_YOUNG_cultural_advisor:0 "Паладин Янг"
 MXC_AIDAN_YOUNG_cultural_advisor_desc:0 "§GОсобова справа — Янг, Ейден§!\n\n§YЗвання:§! Паладин\n\nЗдобуття матеріалів і припасів — це питання, якому має приділяти увагу кожне відділення, від Сан-Франциско до Бостона. Паладин Янг є популярним, але суперечливим ідейним лідером підходу «просто бери те, що хочеш».\n\nХоч це і не засуджується кодексом і не є неортодоксальним для жодної експедиції чи відділення, його операції все ж несхвально сприймаються тими в Братстві, хто вірить, що їхнє існування не повинно негативно впливати на невинних жителів пустки."

 MXC_KNIGHT_HOOD_NAME:0 "Лицар Гуд"
 MXC_KNIGHT_HOOD_cultural_advisor:0 "Лицар Гуд"
 MXC_KNIGHT_HOOD_cultural_advisor_desc:0 "§GОсобова справа — Гуд, Карсон§!\n\n§YЗвання:§! Лицар\n\nПісля нашої поразки від Псів Розвішення Лицар Гуд та його команда були оголошені зниклими безвісти під час переклички в Бункері Мексона. Через тиждень він повернувся із половиною свого загону. Хоча вони й втратили свого Паладина, команда Лицаря Гуда змогла знайти дружніх цивільних, які обробили їхні рани та виходили їх. Натомість Гуд очолив несанкціоновану операцію з витіснення кількох рейдерів у тому районі.\n\nЦей інцидент явно вплинув на лицаря, який тепер закликає Братство розширити програми взаємодії з цивільними для забезпечення довгострокового виживання та сталості наших операцій. Подейкують, що він повертається до того поселення, бо, можливо, знайшов там своє кохання.\n\n§R|| Нотатка Проктора Елріка: ||§! Монро, це не місце для твоїх 'свіжих пліток'."

 MXC_PALADIN_GREENE_NAME:0 "Паладин Грін"
 MXC_PALADIN_GREENE_cultural_advisor:0 "Паладин Грін"
 MXC_PALADIN_GREENE_cultural_advisor_desc:0 "§GОсобова справа — \"Грін, Розалін\"§!\n§YЗвання:§! Паладин\n\nВідправлена в експедицію як лицар, новоспечена Паладин Грін взяла на себе відповідальність за керівництво та організацію патрулів для відновлення технологій на території Братства. Хоч це точно не та посада, на якій можна заводити нових друзів серед чужинців, це, безсумнівно, робота, яку високо цінуватиме кожне відділення Братства."

 MXC_BRODERICK_CALDWELL_NAME:0 "Паладин Колдвелл"
 MXC_BRODERICK_CALDWELL_high_command:0 "Паладин Колдвелл"
 MXC_BRODERICK_CALDWELL_high_command_desc:0 "§GОсобова справа — Колдвелл, Бродерік§!\n\n§YЗвання:§! Паладин\n\nПаладин Бродерік Колдвелл чудово розуміє, що Братство вижило не лише завдяки ідеологічній силі. Після поразки від Псів Розвішення Колдвелл був одним із багатьох лицарів, яких поспішно підвищили до паладина. Цінуючи святість кожного життя, за яке він відповідає, Колдвелл знову і знову наражав себе на небезпеку, що дуже не подобалося прокторам, які обслуговують його броню."

 MXC_GREY_ATKINSON_NAME:0 "Паладин Аткінсон"
 MXC_GREY_ATKINSON_high_command:0 "Паладин Аткінсон"
 MXC_GREY_ATKINSON_high_command_desc:0 "§GОсобова справа — Аткінсон, Грей§!\n\n§YЗвання:§! Паладин\n\nВихований у сім'ї писарів, Паладин Аткінсон і мислить як писар — навіть у бою. Він був одним із багатьох лицарів, які отримали екстрене підвищення після втрат у Денвері та розколу з Колом. Хоча це й неортодоксально для паладина, його обережність цілком доречна у відділенні, яке тримається на волосині."

 MXC_KNIGHT_HARDEE_NAME:0 "Лицар Гарді"
 MCX_KNIGHT_HARDEE_high_command:0 "Лицар Гарді"
 MCX_KNIGHT_HARDEE_high_command_desc:0 "§GОсобова справа — Гарді, Марк§!\n\n§YЗвання:§! Лицар\n\nРеформатор із Лост-Гіллз, який зайшов занадто далеко на думку Ромбіанців і був занадто незначним та відвертим, щоб маргінальні реформістські змовники взялися його захищати. Він вірить, що якби військові сили Братства Сталі створили армію жителів пустки — подібно до НКР — це допомогло б привернути прихильність до справи Братства і полегшило б проведення масштабних операцій. Однак, попри всі його недоліки, він усе ще цілком відданий Братству Сталі."

 MXC_SCOUT_GALLAGHER_NAME:0 "Розвідниця Галлагер"
 MXC_SCOUT_GALLAGHER_economic_advisor:0 "Розвідниця Галлагер"
 MXC_SCOUT_GALLAGHER_economic_advisor_desc:0 "§GОсобова справа — Галлагер, Райлі§!\n\n§YЗвання:§! Старший Лицар\n\nГаллагер — наші очі та вуха за межами наших укріплень. Вона діє непомітно, не покладаючись на стелс-бої, і вона розумна. Вона розвідала поверхню Колорадо та надала нам важливе розуміння регіону і надзвичайно цінних цілей.\n\nНезважаючи на її суворий підхід, дехто може сказати, що вона досить симпатична і м'яка всередині. Щоразу, коли вона вирушає на розвідку, вона ховає біля серця медальйон у формі сердечка.\n\n§R|| Нотатка Писаря Армонда: ||§! Монро, звідки ти це знаєш...?"

 MXC_SCRIBE_GALLAGHER_NAME:0 "Писар Галлагер"
 MXC_SCRIBE_GALLAGHER_high_command:0 "Писар Галлагер"
 MXC_SCRIBE_GALLAGHER_high_command_desc:0 "§GОсобова справа — Галлагер, Ріта§!\n§YЗвання:§! Старший Писар\n\nСтарша сестра Старшого Лицаря Галлагер, Ріта Галлагер часто хвилювалася про те, що члени її родини можуть не повернутися додому. Оскільки ситуація для Братства стає дедалі скрутнішою, ця тривога лише зросла.\n\nСтарший Писар Галлагер наполягає на більшій інтеграції роботів у збройні сили Братства, щоб компенсувати брак людей і врятувати більше життів. Роботів можна замінити, а людину? Не так легко."

 MXC_ANDREA_BRIXLEY_army_chief:0 "Андреа Брікслі"
 MXC_ANDREA_BRIXLEY_army_chief_desc:0 "§GОсобова справа — Брікслі, Андреа§!\n\n§YЗвання:§! Командор-Паладин\n\nПаладин Брікслі пройшла через багато чого. Провал у Дог-Сіті (Денвер), розкол Кола Сталі та відповідальність за всю експедицію, що раптово впала на неї. Попри те, що субординація зробила її технічно «старійшиною», вона вагається символічно прийняти цей титул. Можливо, вона відчуває, що мусить довести свою гідність цього звання.\n\nКоли все це закінчиться, все відділення має дати їй відпочити.\n\n§R|| Нотатка Паладина Брікслі: ||§! Я ціную турботу, але це не місце для висловлення ваших особистих почуттів."

 MXC_LANCER_ANGUS_NAME:0 "Лансер Ангус"
 MXC_LANCER_ANGUS_air_chief:0 "Лансер Ангус"
 MXC_LANCER_ANGUS_air_chief_desc:0 "§GОсобова справа — \"Ангус, Лейна\"§!\n§YЗвання:§! Лансер\n\nЛансери Братства Сталі цими днями рідко роблять щось більше, окрім як тренуються на симуляторах. Лансер Ангус сподівалася, що швидке захоплення Колорадо призведе до реальних дій, але, на жаль, схоже, їй доведеться почекати. Якщо Братство в Колорадо здобуде справжні військово-повітряні сили, Ангус буде більш ніж готова. Вона твердо налаштована першою піднятися в небо, і битиметься до останнього, щоб переконатися, що ніхто не змусить її залишитися на землі."

 MXC_PALADIN_JACKSON_NAME:0 "Паладин Джексон"
 MXC_PALADIN_JACKSON_theorist:0 "Паладин Джексон"
 MXC_PALADIN_JACKSON_theorist_desc:0 "§GОсобова справа — Джексон, Гай§!\n§YЗвання:§! Паладин\n\nЯкби для опису Джексона потрібне було одне слово, це було б «брутал». Під час відступу з Денвера Джексон часто виходив зі строю, щоб викошувати хвилі Псів Розвішення, які насідали на втікачів — воїнів чи ні. Джексон різкий, жорсткий, і той факт, що він є прихильником ідей Мексона, зовсім йому не допомагає. Все ж він один із найкращих паладинів, які є у відділенні.\n\nХоча ходять чутки, що він і Колдвелл — пара.\n\n§R|| Нотатка Паладина Джексона: ||§! Стеж за язиком, Монро."

 MXC_HEAD_SCRIBE_ARMOND_NAME:0 "Писар Армонд"
 MXC_HEAD_SCRIBE_ARMOND_theorist:0 "Писар Армонд"
 MXC_HEAD_SCRIBE_ARMOND_theorist_desc:0 "§GОсобова справа — Армонд, Френсіс§!\n§YЗвання:§! Провідний Писар\n\nЕкспедиція в Колорадо втратила свого першого Головного Писаря ще до того, як дісталася Денвера. Було вирішено, що Писар Армонд, завдяки його хисту до робототехніки, візьме на себе роль тимчасового Провідного Писаря, поки відділення не реорганізується і не обере нового належним чином. Проте нового Головного Писаря так і не обрали.\n\nПисар Армонд першим визнає свої недоліки в лідерстві, віддаючи перевагу компанії сталі, а не людей, але його технічні знання роблять його корисним, хоч і різкуватим, авторитетом."

 MXC_PALADIN_MALACHI_NAME:0 "Френк Неш"
 MXC_PALADIN_MALACHI_navy_chief:0 "Френк Неш"
 MXC_PALADIN_MALACHI_navy_chief_desc:0 "§G\"Я ходжу вгору-вниз Арканзасом вже сорок п'ять років і ніколи не бачив такого збіговиська жалюгідних виродків, як ви.\"§!\n\nМістер Неш теоретично є цивільним підрядником, який працює на Братство, а на практиці він — людина, що керує всім флотом Братства. Що, по суті, зводиться лише до його особистого торгового флоту поромів."

 MXC_KNIGHT_ATOM_NAME:0 "Чужинець"
 MXC_KNIGHT_ATOM_high_command:0 "Чужинець"
 MXC_KNIGHT_ATOM_high_command_desc:0 "§GОсобова справа — \"Чужинець\"§!\n§YЗвання:§! Ем... Член Братства?\n\nВідданий Братству Сталі, але не надто охоче ділиться чимось іще, не кажучи вже про своє ім'я чи звання, \"Чужинець\" є розвідником-оперативником Братства Сталі, який поводиться як зірка бойовиків. Він здається стоїчним і загадковим, і часто ігнорує прямі накази, якщо вважає, що знає краще, але у більшості випадків він приносить результати.\n\nЄ багато теорій щодо того, звідки він походить. Можливо, він з Монтани, Техасу або з давно обговорюваного Відділення у Вайомінгу. Можливо, з Відділення Середнього Заходу, враховуючи, що він дуже цікавиться, коли ми про це згадуємо.\n\nМожливо, колись він перестане видаляти свої власні записи звідси. Я втомилася їх переписувати. Я вже й забула, яким був оригінал.\n\n§O\"Дозволю тобі залишити цей. Тільки тому, що він мене розсмішив.\" — Чужинець.§!"

 MXC_SCRIBE_ELRICK_NAME:0 "Проктор Елрік"
 MXC_SCRIBE_ELRICK_cultural_advisor:0 "Проктор Елрік"
 MXC_SCRIBE_ELRICK_cultural_advisor_desc:0 "§GОсобова справа — \"Елрік, Ріс\"§!\n§YЗвання:§! Проктор\n\nПроктор Елрік був колись у захваті від того, що його обрали покинути Лост-Гіллз і вирушити до Колорадо — штату, де Калькулятор захопив владу і погрожував усьому людству. Як йому вдалося створити армію такого розміру? Чому він переконав себе, що людство має бути знищене? Що взагалі сталося із загоном Братства, який переміг його? Так багато питань і так мало часу на відповіді.\n\nКомандор Брікслі схвалює його пристрасть і бажання дізнатися більше про минуле, тому замість того, щоб дозволити йому гнити в арсеналі, доглядаючи за тією самою старою зброєю день за днем, вона підштовхнула його до проєктів його найсміливіших мрій."

