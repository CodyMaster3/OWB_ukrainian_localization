 MXC_PALADIN_BILLINGS_NAME:0 "Паладин Біллінгс"
 MXC_BILLINGS_army_chief:0 "Паладин Біллінгс"
 MXC_BILLINGS_army_chief_desc:0 "§GОсобова справа — Біллінгс, Реджинальд§!\n\n§YЗвання:§! Паладин\n\nОдин із перших паладинів, які супроводжували Старійшину Кемерона в експедиції на Схід, Паладин Біллінгс колись був інструктором із стройової підготовки в Лост-Гіллз, але відчув, що йому потрібна зміна обстановки, і східні землі здалися йому квитком до більш активного призначення.\n\nНезважаючи на свій вік, Паладин Біллінгс усе ще записується добровольцем на польові операції. Він стверджує, що робить це в освітніх цілях і для забезпечення \"кращої польової підготовки\", але більшість просто думає, що він хоче трощити рейдерів своєю вірною кувалдою.\n\n§R|| Нотатка Паладина Біллінгса: ||§! Монро, як щодо того, щоб я взяв тебе в одну з моїх освітніх польових поїздок?"
 MXC_PALADIN_BILLINGS_DESC:0 ""

 MXC_BLONDIE_NAME:0 "Блонді"
 MXC_BLONDIE_high_command:0 "Блонді"
 MXC_BLONDIE_high_command_desc:0 "§O\"Берк був величезним мудаком, справжнім виродком. Рада, що нарешті хтось прийшов і поставив його на місце\"§!\n\nВільна духом дорожня маніячка, яка любить заступатися за слабких. Блонді ненавиділа Берка та його банду, але мало що могла зробити лише зі своєю невеликою групою ентузіастів-мотоциклістів на вулицях Бастіону. Після того як Братство захопило територію Берка, вона запропонувала свої послуги Експедиції, готова поділитися своїми глибокими знаннями про всілякі моторизовані транспортні засоби — все тому, що відчувала себе \"щасливою, що комусь нарешті не байдуже\".\n\nУсе, про що вона просить, — це щоб обмеження швидкості на дорогах на неї не поширювалися."

 MXC_SARA_WINTERS_NAME:0 "Сара Вінтерс"
 MXC_SARA_WINTERS_economic_advisor:0 "Сара Вінтерс"
 MXC_SARA_WINTERS_economic_advisor_desc:0 "§B\"Силова броня — як людина, вона потребує турботи, любові та всієї вашої уваги, якщо має функціонувати належним чином і добре служити своєму пілоту на полі бою. Така воля Духа Горна.\"§!\n\nСтарша дочка з родини видатних Ковалів у Нью-Стерлінгу, Сара присвятила всю свою кар'єру створенню, ремонту та обслуговуванню костюмів силової броні. Роблячи це з самого дитинства, коли Буллтітер вперше прибув сюди, Сара — і родина Вінтерсів у цілому — ніколи не надто переймалася залізними найманцями міста, доки вони могли продовжувати вдосконалювати своє ремесло.\n\nНью-Стерлінг може переходити з рук у руки, але Вінтерси завжди будуть віддані своєму ремеслу, незалежно від місцевого володаря. На краще це чи на гірше."

 MXC_GAGS_NAME:0 "Г.А.Г.С."
 MXC_gags_cultural_advisor:0 "Г.А.Г.С."
 MXC_gags_cultural_advisor_desc:0 "§R\"Чому мавпа впала з дерева? Тому що вона була мертва. ХА-ХА-ХА-ХА-ХА-ХА-ХА!\"§!\n\nГ.А.Г.С., або Генеративний Алгоритм для Гегів та Стендапу, володів власним комедійним клубом у Місті Роботів. Це тривало доти, доки він не відпустив забагато жартів про відхід АРГУСа, що дуже розлютило ДОКІ та принесло йому місце в Програмі обміну дружбою. Цікаво, що його комедія, схоже, знайшла відгук у Братства та місцевих жителів. Або вони настільки пригнічені, що будь-яка форма комедії піднімає їм настрій, або він — комедійний геній, якого нарешті гідно оцінили. Він віддає перевагу останньому."

 MXC_CAROLYN_NAME:0 "Керолін" 
 MXC_CAROLYN_economic_advisor:0 "Керолін"
 MXC_CAROLYN_economic_advisor_desc:0 "§O\"У цьому світі є три типи людей, люба. Ті, що одягаються, щоб вразити, ті, що надирають дупи з мініганом, і я, яка робить і те, і інше, і навіть більше.\"§!\n\nДіва, ікона стилю і загалом неймовірно крута жінка. Хоча Керолін і не належала до найбільш «войовничих» членів Хору, які приєдналися до Братства, вона завжди була з тих, хто заступається за слабших. Настільки, що вона здобула репутацію скандальної особи серед тих, хто підтримував принесення людей у жертву Темній Матері, особливо серед Моргани з її жахливим почуттям стилю.\n\nХоча після того, як Хор змінився, їй не було чим зайнятися, окрім як нескінченно лаяти своїх молодших колег за їхню відсутність смаку та пояснювати, чому мініган Rockwell CZ57 Avenger є найстильнішим зразком важкого озброєння з усіх коли-небудь створених. Тому, коли Братство почало вербування, вона одразу ж приєдналася і ніколи не озиралася назад.\n\nГоре тому Лицарю, який вирішить одягнутися нижче її стандартів."