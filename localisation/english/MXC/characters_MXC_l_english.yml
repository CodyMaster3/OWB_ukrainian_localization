MXC_PALADIN_NIELS_NAME:0 "Паладин Нілс"

MXC_KNIGHT_BANKS_NAME:0 "Лицар Бенкс"
MXC_KNIGHT_BANKS_economic_advisor:0 "Лицар Бенкс"
MXC_KNIGHT_BANKS_economic_advisor_desc:0 "Навіть до війни інфраструктура Колорадо не вражала. Після бомбардувань і двох століть занепаду дороги стали ще однією жертвою загибелі Америки. Звісно, золотих шляхів до бункера Мексона не буде — але принаймні ми зможемо позбавити патрулі постійного болю в ногах."

MXC_SCRIBE_MONROE_NAME:0 "Писар Монро"
MXC_SCRIBE_MONROE_economic_advisor:0 "Писар Монро"
MXC_SCRIBE_MONROE_economic_advisor_desc:0 ""

MXC_SCRIBE_PIERCE_NAME:0 "Писар Пірс"
MXC_SCRIBE_PIERCE_economic_advisor:0 "Писар Пірс"
MXC_SCRIBE_PIERCE_economic_advisor_desc:0 "\"Плазмова технологія майже втрачена для масового виробництва. Що завадить тому ж самому статись із лазерною зброєю? Я вірю, що наші команди рекультивації зроблять усе можливе, щоб не дати спадщині зникнути. А поки — я подбаю, щоб променевої зброї вистачало. Ну, подай мені викрутку.\""

MXC_MADDOC_CONLEY_NAME:0 "Маддок Конлі"
MXC_MADDOC_CONLEY_cultural_advisor:0 "Маддок Конлі"
MXC_MADDOC_CONLEY_cultural_advisor_desc:0 "Під час війни з Гангдогами Осередок Мексона засвоїв просту істину: Пустка завжди матиме перевагу. Навіть найкраща броня й найпотужніша зброя нічого не варті, якщо нікому ними скористатись. Дозвіл обдарованим пустельникам вступати до лав Братства або принаймні працювати з нами — це спосіб зберегти мрію Роджера Мексона живою."

MXC_AIDAN_YOUNG_NAME:0 "Айдан Янг"
MXC_AIDAN_YOUNG_cultural_advisor:0 "Айдан Янг"
MXC_AIDAN_YOUNG_cultural_advisor_desc:0 ""

MXC_KNIGHT_HOOD_NAME:0 "Лицар Худ"
MXC_KNIGHT_HOOD_cultural_advisor:0 "Лицар Худ"
MXC_KNIGHT_HOOD_cultural_advisor_desc:0 "\"Поглянь на це очима пустельника. Усе навколо хоче їх використати або знищити. Вони навіть не підозрюють, що можуть стати кимось більшим, ніж просто батраком чи рейдером. Варто лише простягнути їм руку знань і дати шанс — і вони зможуть допомагати не лише собі.\""

MXC_PALADIN_GREENE_NAME:0 "Паладин Ґрін"
MXC_PALADIN_GREENE_cultural_advisor:0 "Паладин Ґрін"
MXC_PALADIN_GREENE_cultural_advisor_desc:0 "\"Не торгуй на землях Братства. Вони зупинять тебе й обчистять — особливо якщо в тебе тостер із зайвою кнопкою.\" — Анонімний торговець із Черокі"

MXC_BRODERICK_CALDWELL_NAME:0 "Бродерік Колдвелл"
MXC_BRODERICK_CALDWELL_high_command:0 "Бродерік Колдвелл"
MXC_BRODERICK_CALDWELL_high_command_desc:0 "Братство вижило не лише завдяки своїй ідеології. Солдати в силовій броні виходять на поле бою й витримують навіть випадкові постріли. Коли броня захищає бійця — розкривається весь бойовий потенціал лицаря."

MXC_REED_ATKINSON_NAME:0 "Рід Аткінсон"
MXC_REED_ATKINSON_high_command:0 "Рід Аткінсон"
MXC_REED_ATKINSON_high_command_desc:0 "Якщо роботу варто виконати, її слід виконати якнайкраще."

MXC_KNIGHT_HARDEE_NAME:0 "Лицар Харді"
MCX_KNIGHT_HARDEE_high_command:0 "Лицар Харді"
MXC_KNIGHT_HARDEE_high_command_desc:0 "Людство саме себе знищило, намагаючись підтримати свою воєнну машину. Прагнення утримувати армію в силовій броні — шлях до загибелі Братства. Зосередившись на піхоті й підвищенні рівня звичайного солдата, ми забезпечимо виживання нашого Ордену."

MXC_SCRIBE_GALLAGHER_NAME:0 "Писар Ґаллаґер"
MXC_SCRIBE_GALLAGHER_high_command:0 "Писар Ґаллаґер"
MXC_SCRIBE_GALLAGHER_high_command_desc:0 ""

MXC_ANDREA_BRIXLEY_army_chief:0 "Андреа Брикслі"
MXC_ANDREA_BRIXLEY_army_chief_desc:0 "\"Ми тут уже десятиліттями. Лост-Гілз доручив нам зберегти скарби Старого Світу від забуття. І хоч би що трапилося — ми не відступимо від цієї місії.\""

