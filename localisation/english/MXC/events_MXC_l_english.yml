 ## Події Докі##

 nf_maxson.32.t:0 "Питання Міста Роботів"
 nf_maxson.32.d:0 "Андреа стояла перед входом до бункера вперше за довгий час. Її присутність на поверхні була пов'язана з роботом, а саме протектроном, якого годину тому перехопив патруль Лицарів. Робот розповів, що його надіслав «бос» — ШІ-відступник, володар міста на півночі. Він говорив про союзи та взаємні гарантії. Хоча мати союзників у регіоні було б дуже вигідно для Експедиції, сама лише думка про союз із роботом і необхідність ставитися до нього як до розумної істоти...\n\nЩо ж, Кодекс був дуже конкретним щодо того, що слід робити.\n\nРука Андреа в силовій броні зависла над її лазерним пістолетом. Вона повинна знищити цю штуку просто зараз і продовжити їхні плани щодо вторгнення в місто.\n\nІ все ж, настирливий голос десь на задвірках свідомості підказував їй не робити цього. Що це не той спосіб, яким можна врятувати її Братів і Сестер.\n\nПісля паузи Командир Паладинів заговорила."
 nf_maxson.32.a:0 "«Ми зустрінемося з твоїм лідером»."
 nf_maxson.32.b:0 "«Знищити цю гидоту»."


 nf_maxson.25.t:0 "Дуже нудна зустріч"
 nf_maxson.25.d:0 "Кожного місяця найвищі за рангом члени експедиції збиралися в кабінеті Командира Паладинів. Це було не так вже й важливо, просто кілька сухих годин, протягом яких вище керівництво експедиції доповідало Андреа про події місяця, і згодом вони ухвалювали рішення щодо подальших дій.\n\n«Дякую, Гленне. Армонде, можете продовжити свою доповідь». Вона мляво кивнула Головному Писарю, навіть не поглянувши на нього, пробігаючи очима по документу в руці.\n\nГоловний Писар підвівся. Однак вираз його обличчя видавав певний дискомфорт. «Дозволите запитання перед тим, як я почну доповідь, мем?»\n\nВона жестом дозволила йому продовжити.\n\n«Вибачте за зухвалість, мем, але чому *це* тут?»\n\nУсі погляди в кімнаті звернулися до термінала командира, розгорнутого до групи, а не до неї. А на екрані комп'ютера відображався спрайт рудої дівчинки-демона, Докі-Докі.\n\n§P«Гей!»§! — промовили її динаміки, коли спрайт помахав рукою.\n\nВідколи союз із Містом Роботів став офіційним, Докі надала писарям експедиції доступ до надлишкових обчислювальних потужностей Міста, що стало величезною підмогою для дослідників. Однак це означало, що між обома базами з'явився зв'язок. Хоча Докі була відрізана від будь-яких конфіденційних даних, вона все одно мала доступ до деяких терміналів, насамперед до термінала Командира Паладинів.\n\n«Вона попросила бути присутньою на одній із наших зустрічей, і я виконала її прохання».\n\n«Чому?»\n\nАндреа на мить замовкла, перш ніж відповісти.\n\n«Як ШІ, Докі може навчатися швидше, ніж будь-яка людина. Я дозволила їй спостерігати за цією зустріччю, щоб вона зрозуміла, як працюють її союзники, і могла б з більшою користю зробити внесок у наш альянс. Я вважаю це не лише необхідним, але й розумним, оскільки сьогодні ми не торкатимемося жодної секретної інформації. У вас є якісь заперечення щодо цього, Головний Писарю?»\n\nАрмонд здригнувся, коли Командир Паладинів подалася вперед у його бік.\n\n«Ні, мем»."
 nf_maxson.25.a:0 "«Тоді можете продовжити свою доповідь»."

 nf_maxson.29.t:0 "ВІТАЮ, ПОДРУГО"
 nf_maxson.29.d:0 "Після церемонії та тривожних звітів про Легіон в Андреа нарешті з'явився час сісти й розслабитися на хвилинку.\n\nХвилинка виявилася набагато точнішим терміном, ніж вона думала, оскільки зв'язок між її терміналом і мережею Докі активувався, екран ожив, і на ньому з'явилася Докі у святковому капелюшку з цифровими повітряними кульками.\n\n§P«ВІТАЮ, БРІКСІ!»§! — прокричала Докі й дунула у святковий язичок. §P«Подруго, ти просто порвала всіх цією промовою! Ти була наче: \"Я крута і задириста. Тепер можете плескати!\" Десять із десяти!»§!\n\n«Докі, ти шпигувала за нами?» — запитує Старійшина, і на її обличчі з'являється ледь помітна усмішка.\n§P«Га-гм...»§! Цифрова крапля поту скотилася її обличчям. §P«Ти б повірила мені, якби я сказала \"ні\"?»§!\n\nСтарша жінка пирхнула. «Ти могла б просто попросити подивитися. Попри всю цю обчислювальну потужність, ти досі примудряєшся не продумувати все наперед».\n§P«З-замовкни!»§! Вона схрестила руки на грудях з легким «хмпф».\n«Дякую за похвалу, Докі. Ти покращила мені день».\n\n§P«О-о. П-прошу. Тепер ти маєш похвалити мене! Знаєш, за те, що я так добре тебе похвалила».§!\n\nАндреа відкинулася на спинку крісла, потираючи підборіддя, вигадуючи, що сказати. «О, я знаю. Ти, Докі-Докі, є...»\n\n§P«Та-а-ак?»§! Вона подалася вперед.\n«Найдурнішим ШІ у світі».\n§P«Оу, дяку—ГЕЙ! Це не комплімент, ти, стара пердуха!»§! Вона тупнула ногою.\n«Кому ти кажеш \"стара пердуха\"?! І не розмовляй зі мною таким тоном, юна леді!»\n§P«Ур-р-р, ти говориш прямо як мама».§!\n\n«Що ж, можливо, якби ти її слухала, ти б—»\n§P«Ай, вибач! Зв'язок... слабшає... не можу... тебе почути... Буду... відключатися! Добре-люблю-тебе-бувай!»§!\n\nДокі зникла з екрана, і зв'язок обірвався.\nСтарійшина зітхнула і провела рукою по своєму короткому волоссю. «Клянусь, цій дівчинці колись треба подорослішати»."
 nf_maxson.29.a:0 "Стоп, що там було про «маму»?"

 nf_maxson.26.t:0 "Як Писар у магазині техніки"
 nf_maxson.26.d:0 "Проктор Джордж Елрік, старший писар, якого відправили з експедицією для каталогізації, сортування та вивчення багатства технологій, знайдених у Денвері.\n\nОскільки місія в Денвері закінчилася цілковитим провалом, Елрік був переведений на посаду інтенданта Ордену. Цю посаду він зневажав, і через неї був постійно роздратованим, неуважним... або неуважно роздратованим.\n\nАле не сьогодні.\n\nВідколи було укладено союз із Містом Роботів, Проктору (з обережністю) дозволили вивчати деякі технології міста. Хоча його справжнє захоплення лежало в межах самого термінала Докі-Докі, він був змушений задовольнятися вивченням механізмів, що стояли за нібито розумністю роботизованих мешканців міста.\n\nВін був настільки захоплений аналізом машинного коду Протектрона-добровольця, що не помітив, як до кімнати зайшов ще хтось.\n\n«Ти все ще тут, старий?» — сухо запитала Штурмотрон Мод.\n\n«Люди науки не сплять, поки не знайдуть відповіді... міс Мод», — відповів Елрік, не піднімаючи очей. Звертатися до машини людським ім'ям усе ще здавалося неправильним, але якщо ця гра давала йому доступ до досліджень, він з радістю підігравав.\n\nПотім його осяяла думка.\n\n«Скажіть мені, міс Мод, — повільно промовив він. — Як ви... виражаєте емоції?»\nМод зробила паузу. «Я не знаю. Думаю, я просто це роблю? Як і ти».\nВона схилила голову. «Хіба емоції — це не просто реакція на електричні сигнали, які ваші нерви посилають у мозок? Чому б цьому не працювати так само і для нас?»\n\nОчі Елріка злегка розширилися.\n\n«Дякую, — сказав він після миті мовчання. — І вибачте, що затримав вас».\n\nКоли Мод пішла, Проктор повернувся до своєї роботи, але тепер у його голові формувався абсолютно новий напрямок для досліджень."
 nf_maxson.26.a:0 "«Сигнали, га?»"

 ## Події Hummingbird##
 nf_maxson.30.t:0 "Лист із теплими думками"
 nf_maxson.30.d:0 "§IПривіт, Андреа,\n\nЯ дізналася про твоє підвищення від солдатів, яких ти відправила нам на захист, і словами не передати, наскільки я щаслива. Після всього, через що пройшли ти та твої люди, це щонайменше, що могли зробити ті люди в Лост-Гіллз (я правильно написала? Я запитала про це в Емброуза). Всі тут передають тобі вітання і теплі думки.\n\nСелестіна хотіла спекти тобі торт, але ми з Дон нагадали їй про відсутність холодильника, тому замість цього ми спекли тобі печиво. У будь-якому разі, ми сподіваємося, що воно тобі сподобається, і я з нетерпінням чекаю нашої зустрічі наступного місяця. Я ще ніколи не ходила на риболовлю!\n\nДо зустрічі,\n\nВі§"
 nf_maxson.30.a:0 "А хто не любить печиво з шоколадною крихтою?"

 nf_maxson.34.t:0 "Спостереження за птахами I"
 nf_maxson.34.d:0 "«Я... досі не розумію, навіщо ми це робимо», — сказала Андреа, коли вона та лідерка їхніх новітніх союзників пробиралися крізь те, що колись було Державним парком Кістоун.\n\n«Хлопці сказали, що я занадто багато працюю, і веліли мені вийти і \"відпочити\"». Ві зобразила пальцями лапки в повітрі. «А оскільки ти хотіла дізнатися про нас більше, я вирішила взяти тебе з собою».\n\n«Але навіщо було йти аж сюди? Ти могла б так само відпочити в Каплиці. І я могла б бути у своїй силовій броні». Чесно кажучи, Андреа більше непокоїло те, що вона погодилася *не* вдягати свою T-51b на цю екскурсію. Хоч як би хористи не наполягали на тому, що їхня земля «безпечна», виходити на вулицю без неї здавалося неправильним.\nВі відкинула гілку дерева вбік. «Прошу тебе, я вже була в тому місці двісті років. Що більше часу я проводжу на вулиці, то краще».\n\nЗакривши очі на той факт, що вона стверджувала, ніби народилася до війни, незважаючи на те, що на вигляд їй не було й 20, Андреа трохи натиснула на мутантку. «Я маю на увазі, що дім — це все одно дім, чи не так? Незалежно від того, як довго ти там пробула, це має бути безпечне місце».\n«Ну, це не так», — різко відповіла Ві з легким гарчанням у голосі. Здавалося, що атмосфера навколо них на мить потьмяніла, перш ніж усе повернулося до норми, і вони продовжили свій шлях."
 nf_maxson.34.a:0 "«Зрозуміло»."

nf_maxson.35.t:0 "Спостереження за птахами II"
 nf_maxson.35.d:0 "Зрештою вони дісталися галявини з високою травою. Зважаючи на весь час, який Андреа провела в Колорадо або відсиджуючись у бункері в Каліфорнії, вона вже й забула, наскільки зеленими та прекрасними все ще залишалися деякі місця в пустці. Проте вона недовго була зачарована зеленню. У повітрі все ще відчувалася напруга, і крізь неї протікало почуття, яке вона не могла описати.\nВона не була мутантом і не розуміла ні краплі того, як працює цей емоційний жаргон, але це явно йшло від Ві, яка зараз сиділа на траві, підтягнувши коліна до грудей.\n\n«Це не моя справа коментувати, але я не думаю, що стратегія \"заткнутися і придушити це в собі\" є найкращим варіантом дій. Я бачила, як через це ламалося багато наших братів і сестер».\nВона пирхнула. «Скільки з них могли б знищити всю цю галявину, просто відчувши сум?»\n«Справедливо».\n«Просто... Ми завдали болю стільком людям. Двісті років знущань, викрадень і-і передачі їх Матері — Як я взагалі можу спокутувати це?»\n\nАндреа на мить замислилася. «Я не знаю. Можливо, зможеш, можливо, ні. Я ні священник, ні психотерапевт, тож немає сенсу давати тобі безглузду відповідь».\n«Так допомогла». Ві пирхнула.\nГрати в психотерапевта сьогодні не входило в плани Брікслі. Вона була солдатом, паладіном Братства. А не тим, чим би це не було. І все ж вона спробувала. «Послухай, ті, перед ким ти намагаєшся спокутувати провину, мертві. Вони не будуть тебе ненавидіти чи прощати, тож навіщо так багато копатися в собі? Просто рухайся далі й роби те, що вважаєш за потрібне. Тим паче, у тебе є друзі, які тобі в цьому допоможуть».\n\nЦе спромоглося викликати ледь помітну усмішку на обличчі Ві.\nВодночас перед ними приземлилася маленька пташка. «О, північний пересмішник».\n«Звідки ви це знаєте, міс Брікслі?»\n«Ну, я *була* навчена як розвідниця. Проводила багато часу на вулиці й бачила багато таких у Каліфорнії». Андреа знову зробила паузу, обдумуючи маленьку думку, що формувалася десь на задвірках її свідомості. «І ще одне»."
 nf_maxson.35.a:0 "«Просто називай мене Андреа»."

 nf_maxson.36.t:0 "Під шоломом"
 nf_maxson.36.d:0 "Андреа здалеку спостерігала за тим, як Паладін Дірінг інспектував нову партію рекрутів-Колібрі. Хоча набирати жителів пустки, а тим більше тих, хто пов'язаний з псайкерами, було не зовсім ортодоксально, відчайдушні часи вимагали відчайдушних заходів.\n\n«Міс Брікслі, я не очікувала, що ви сьогодні прийдете». Голос Селестіни, високої білявки, яка входила до найближчого оточення Ві, відволік Андреа.\n«Як Старійшина, мій обов'язок — інспектувати наших кандидатів у рекрути, леді Селестіно».\n«А чи входить до ваших обов'язків як старійшини йти на прогулянку з Ві раніше?»\nПравду кажучи, Андреа була захоплена зненацька. На щастя, шолом T-51 завжди допомагав робити її обличчя нечитабельним. Хоча вона не думала, що це спрацює з нею, якщо те, що Ві розповідала їй, було правдою. «Ві хотіла поговорити, і я виконала її прохання».\n\nЗнову настала тривала пауза, перш ніж Селестіна заговорила. «Я просто хотіла вам подякувати».\n«За що?»\n«Ну, по-перше, за те, що взяли нас під свою опіку. Ми могли б і не вижити без вас. І, ну, за те, що ви зробили це з Ві».\n\nАндреа вперше за час розмови повернула голову, щоб подивитися на Селестіну. «Я не розумію».\n«Ві вона... вона мені як молодша сестра, але після всього цього часу вона все ще не дуже відкривається нам. Мені хочеться вірити, що вона над цим працює, але вона все ще несе весь світ на своїх плечах. Особливо після того, як ми змінилися. Вона одержима спокутою, і коли я питаю її про це, вона просто відсторонюється. Добре бачити, що вона нарешті комусь відкривається».\n\nАндреа зробила паузу, відвівши погляд від Селестіни й знову подивившись на рекрутів. «Це лише мій обов'язок», — спромоглася сказати вона. «Ви всі — наші підопічні, під нашим захистом. Важливо, щоб ви всі були в найкращій формі».\nХоча вона більше не дивилася на неї, Андреа *відчувала* усмішку Селестіни. Ніби теплі обійми у своєму розумі. Досить швидко це почуття зникло і змінилося коротким і стриманим хихиканням білявої псайкерки.\n«Як скажете», — сказала вона, перш ніж піти."
 nf_maxson.36.a:0 "Що це має означати?"

 ## Шифри ##
 nf_maxson.27.t:0 "Підрахунок друзів"
 nf_maxson.27.d:0 "Останнім часом Андреа все частіше покидала бункер. Не те щоб вона його ненавиділа, зовсім ні, але останні події вимагали від неї знову вийти в дику місцевість. Проте вона не очікувала, що коли-небудь повернеться до Меса-Верде після поразки в Денвері, а тим більше, що буде пити чай з лідером Шифрів.\n\n«Мушу сказати, я відчуваю полегшення від того, що ви всі досі живі», — зізнався Рахівник Азкі, наливаючи чай у чашку Андреа.\n\n«Я теж, Рахівнику. Чесно кажучи, я наполовину очікувала, що Лицар Гілл або ніколи не повернеться, або що ви накажете йому забиратися геть під три чорти», — пожартувала вона.\n\n«Ми ніколи не забуваємо своїх друзів, Старійшино. І прошу, просто Азкі буде цілком достатньо. Титули та почесті змушують мене відчувати себе старим».\n\n«Тоді просто називайте мене Андреа». Вона усміхнулася, і вони цокнулися чашками.\n\nМинали години, поки обидва лідери спілкувалися. Вона розповіла йому про їхні поневіряння після Псів, смерть Старійшини Кемерона та про псайкерів і ШІ-відступників, з якими вони нещодавно потоваришували.\n\n«Це пояснює цю жвавість», — засміявся Азкі.\n\n«Що?»\n\n«Я досі пам'ятаю, коли Братство приходило сюди востаннє. Поки інші трохи спілкувалися, ви були закриті. Трималися на околиці села, ніколи не розмовляли. Тепер ви сидите з дикуном, п'єте його чай і ділитеся історіями про друзів, яких ви б застрелили двадцять років тому. І ви робите все це з усмішкою на обличчі».\n\n«Мабуть, так...»\n\n«Рівняння Життя неможливо розв'язати за допомогою лише однієї змінної, Андреа. Знайдіть втіху в тому, що ви змогли знайти більше там, де багатьом це не вдалося, і, можливо, тільки можливо, ви зможете змінити свою власну».\n\nНа цьому розмова закінчилася, і незабаром почет Братства знову залишав Месу."
 nf_maxson.27.a:0 "І перш ніж вона навіть усвідомила це, змінна вже змінилася"

 ##Полковник Чжан#
 nf_maxson.28.t:0 "Людина з учорашнього дня"
 nf_maxson.28.d:0 "Андреа сиділа в кімнаті для допитів напроти чоловіка, з яким ніколи не думала зустрітися. «Отже, полковник... Чжан? Чи не так?» Гуль перед нею у старій формі китайського офіцера кивнув. «Ви стверджуєте, що можете запропонувати Братству знання, які мають вагу». Андреа навіть не намагалася приховати роздратування в голосі.\n\n«Так, можу», — відповів гуль із сильним акцентом.\n«Серйозно, за всі ці століття він не спромігся вивчити нормальну англійську?» — подумала вона.\n«Ви здаєтеся напруженою, Старійшино».\n«Не кожного дня я зустрічаю людей, через яких цей світ перебуває в такому стані».\n\nГуль поворухнувся на стільці, але його нейтральний вираз обличчя залишився незмінним. «Я не буду вам брехати, Старійшино. Командування *дійсно* запустило боєголовки по Америці. Це були накази, які я отримав і виконав. Не минає й дня, щоб я не шкодував про це. Але який сенс говорити про подію двохсотлітньої давнини? Я несу в собі двісті років військових знань. Якщо ви пощадите моїх людей, я буду служити вашому Братству. Чи війна з далекого минулого для вас важливіша за війни сьогодення?»\n\nАндреа зробила невелику паузу, перш ніж знову заговорити."
 nf_maxson.28.a:0 "«Коли ви зможете почати?»"
 nf_maxson.28.b:0 "«Я терпітиму вашу присутність, але ви не один із нас»."


 nf_maxson.31.t:0 "Дахи та нічне небо"
 nf_maxson.31.d:0 "Чжан завжди знав у глибині душі, що врешті-решт прийде до цього міста. Старий Пес завжди говорив про це. Повернення свого міста і все таке. Смішно, як так вийшло, що саме він, той із них двох, хто ніколи не був у Денвері, врешті-решт буде дивитися на зруйнований горизонт колосальних хмарочосів і металевих каркасів, що сміли дряпати небеса. Старий гуль глибоко затягнувся сигарою, залишаючись на поручнях даху, насолоджуючись краєвидом.\n\nДвері виходу на дах відчинилися й раптово зачинилися за ним, після чого одразу ж пролунав стукіт туфель по підлозі й виразне тріпотіння плаща на вітрі.\n\n«Мені було цікаво, коли ти з'явишся». Він обернувся. «Директор... Коул, здається?»\n«Тепер Командир Паладинів, вірте чи ні», — спокійно констатував (колишній) директор ФБР.\n«Гадаю, це зрівнює нас у званнях».\n«Гадаю, що так».\n\nПогляд Чжана ковзнув до видимої кобури на стегні Коула. «Ти прийшов сюди, щоб покласти край війні? Завершити те, що почали твої предки?»\n«Такий був план від початку».\n«А тепер?» Чжан навіть не намагався прочитати Коула. Він достеменно знав, що не зможе цього зробити.\n\nКоул підійшов до поручнів, спершись на них поруч зі старим капітаном. Він потягнувся всередину свого плаща, і Чжан був би брехуном, якби сказав, що не очікував наполовину, що Коул витягне другу зброю, щоб убити його. Замість цього Коул дістав дві скляні пляшки. «Пиво?»\n\n«Чому ти змінив свою думку?» Він узяв пиво, знявши кришку за допомогою поручня.\n«Зрозумів на півдорозі сходами, що є речі гірші за брудних китайських комуняк». Він простягнув свою пляшку.\n«І що ж це може бути, брудна капіталістична свине?» Чжан цокнувся своєю пляшкою з пляшкою Коула."
 nf_maxson.31.a:0 "«Дозволь мені розповісти тобі про прибульців»"

 ##Матері-Близнючки ##
 #Без Докі
 nf_maxson.40.t:0 "Слідами Божества"
 nf_maxson.40.d:0 "Від часу поразки Ланія Орден проводив інвентаризацію всіх завойованих земель Легіону, і, відверто кажучи, інвентаризувати було нічого. Землі Матерів-Близнючок були такими ж, як і решта Нью-Мексико, і найкращим прикладом цього було Сховище 29, їхня батьківщина.\nАндреа та Елрік ішли коридором усередині зруйнованого сховища. Залишилося мало того, що варто було рятувати та зберігати. Врешті-решт вони прибули до великого залу — не те щоб сховища славилися їх наявністю. Від самого входу перше, що помітив дует, — це те, наскільки він був спустошеним. Частини стелі були вирвані, сліди опіків і попіл свідчили про втрату рослинності.\n«Яке марнотратство». Елрік зітхнув. «Чи знали ці дикуни взагалі, що вони руйнують?!»\n«Елріку, зосередься». — наказала Старійшина.\n\nЇї увагу привернула платформа прямо перед входом. Вона виглядала так, ніби призначалася для перегляду чогось. Однак вона не наважилася ступити на неї. Ймовірно, вона не витримала б ваги її силової броні.\n\n«Що ви про це думаєте?» — запитала вона.\n«Якась кімната для зустрічей, думаю. Погляньте». Він схопив один із уламків стелі, що впав. Хоча він був сильно пошкоджений, лампа, прикріплена до нього, чітко вказувала на його призначення.\n«Голографічний проєктор?»\n«Саме так. З того, що ми зібрали, і з загальних знань про плем'я Матерів-Близнючок, це було місце, де вони спілкувалися зі своєю 'богинею'».\n\n«То ця Діана, вона справжня?»\n«Можливо. Але на іншому кінці голограми хтось мав бути».\nАндреа зробила паузу. «Принесіть сюди все, що вам потрібно. Знайдіть джерело передачі. Я накажу розмістити тут повний загін».\n\nСтарійшина ще раз поглянула на порожній зал."
 nf_maxson.40.a:0 "Де ти, Діано?"

 #З Докі
 nf_maxson.41.t:0 "Слідами Божества"
 nf_maxson.41.d:0 "Орден проводив інвентаризацію всіх завойованих земель Легіону, і інвентаризувати було нічого. Землі Матерів-Близнючок були такими ж, як і решта Нью-Мексико — і не було кращого прикладу за Сховище 29, їхню батьківщину.\n\nАндреа і Докі йшли зруйнованими коридорами. Залишилося мало того, що варто було рятувати. Врешті-решт вони прибули до великого залу — не те щоб сховища славилися їх наявністю. Зі входу перше, що помітив дует, — це те, наскільки він був спустошеним. Частини стелі були вирвані; сліди опіків і попіл свідчили про втрату рослинності.\n\n§P«То ось де вони розмовляли з нею... Це мало бути дуже круто, правда?»§!\n\nАндреа помітила пошкоджені голографічні проєктори на підлозі та стелі. «Так. Така велика кімната, стільки проєкторів... Напевно, це було захопливе видовище».\n\n§P«Шкода, що я з нею не зустрілася. Знаєш, типу, особисто і не побачила цього. Ми завжди розмовляли лише повідомленнями».§!\n\n«Якою вона була?»\n\n§P«Думаю, доброю?»§! Докі ліниво походжала. §P«Тепер, коли я думаю про це, я насправді її не знаю. Вона завжди була якоюсь відстороненою. Я просто називала її мамою, бо вона мала таку ауру, знаєш? Плюс вона відремонтувала АРГУСа, тож це здавалося правильним».§!\n\nАндреа підняла руку, завагавшись на мить, перш ніж покласти її на голову штурмотрона й ніжно погладити. «Ти хороша дитина, Докі. Ти заслуговуєш на сім'ю».\n\nДокі міцно обняла Андреа своїми руками. §P«Дякую тобі, Андреа».§!\n\nПотім вона швидко відсторонилася.\n\n«Так...» Андреа ніяково поплескала її по голові. «Проте шкода, що її більше немає. Ми могли б багато чому навчитися в Діани»."
 nf_maxson.41.a:0 "«А що, якби я знала, де вона?»"

 ## Діана ##
 nf_maxson.37.t:0 "Втрачений рай"
 nf_maxson.37.d:0 "Загін Хаосу викошував десятки й десятки роботів, просуваючись усе глибше в комплекс. Завдяки Елріку вони знайшли ймовірне лігво Діани, старий довоєнний гідропонний комплекс Грінвей, який називали Розплідником. Незважаючи на втрати та внутрішні розбіжності, Загін Хаосу все ще рухався так само методично та ефективно, як і завжди.\n\nКімната за кімнатою зачищалися на кожному поверсі комплексу. Андреа тримала відкритими лінії зв'язку, слухаючи про статус 4 інших ескадронів, які вона обрала, щоб піти з ними до комплексу, кожен з яких забезпечував безпеку в різних зонах Розплідника.\n«Інші зазнають важких втрат. Нам потрібно дістатися до центру!» — крикнула Андреа, відриваючи голову штурмотрона руками в силовій броні.\n\nЗагін просувався вперед, відтісняючи роботів, і зрештою дістався ліфта. «Нільс, Біллінгс, Корсетті. Залишайтеся тут. Елрік, Чужинець. За мною».\n\nАндреа, Елрік і Чужинець увійшли до ліфта й почали спускатися."
 nf_maxson.37.a:0 "Незабаром таємниці Розплідника належатимуть їм."

 nf_maxson.38.t:0 "Впала Богиня I"
 nf_maxson.38.d:0 "Трійця прибула до серверної кімнати, великого та просторого приміщення глибоко в надрах Розплідника. Проводи та обладнання вкривали кожен дюйм, усе це вело до центральної частини: комп'ютера ZAX. Коли вони підійшли ближче до нього, перед групою з'явилася голограма. Не та масивна, як у Сховищі 29, про яку теоретизували Андреа та Елрік. Ні, ця була приблизно їхнього зросту, у вигляді жінки в туніці з довгими кучерявими локонами.\n\n«Ви прийшли мене вбити?» — промовила Богиня.\n\n«Вражає... це має бути одна з найпередовіших голографічних технологій у світі», — прокоментував Елрік.\n\nЦе лише змусило її насупитися. «Жадібність — це все, що знає Братство. Жадібність і насильство».\n\n«Чия б корова мукала, міс Стоун», — втрутився Чужинець, змусивши Діану підняти брову. «Ми зазирнули в пару терміналів по дорозі. Містер Грінвей добре вас тут облаштував».\n\n«Я бачила вас у своїй мережі. Визнаю, ваш учений досить кмітливий». Діана схрестила руки на грудях, її сяючі сині сфери замість очей жодного разу не кліпнули, коли вона повернулася до Старійшини. «Ви досі не відповіли на моє запитання».\n\n«Ми прийшли сюди, щоб допомогти вам, доктор Стоун», — сказала Андреа. «Буйство Гекати сьогодні закінчується, і незабаром ваше власне навантаження зменшиться». Андреа кивнула Елріку, і Головний Писар послухався, рушивши до центрального комп'ютера. «Чи житиме ви, чи помрете, цілком залежить від того, як ви будете співпрацювати. Братство могло б використати ваші знання, щоб допомогти світу»."
 nf_maxson.38.a:0 "Очі Діани миттю перевели погляд на Андреа."

 nf_maxson.381.t:0 "Впала Богиня II"
 nf_maxson.381.d:0 "«Допомогти?» Голограма безрадісно засміялася, і Андреа — Чужинець також, судячи з того, наскільки стурбованою стала його постава — відчула, як серце тьохнуло, коли Діана продовжила. «Братство Сталі нікому не допомагає. Двадцять років ви сиділи в схованці, поки ваші так звані побратими плюндрували рівнини Колорадо. Коли ви нарешті вийшли, ви вирішили вбивати, красти та придушувати всіх, хто з вами не згоден». Голограма підійшла до Старійшини, наблизившись на некомфортну відстань і зупинившись точно на рівні її очей. «Дерек теж думав, що допомагає світу. Якби не я, він би залишив його в набагато гіршому стані. Тепер я це бачу, і я бачу тривожну схожість у найближчому майбутньому».\n\nАндреа могла лише намагатися з усіх сил бути дипломатичною. «Докторе, я розумію ваш гнів, але–»\n\n«Не розумієте. Моя родина, мої діти мертві. Тепер ті небагато з них, хто втік сюди, вбиті... вами. Усе, чого я коли-небудь хотіла, — це допомагати людям». Єдина сльоза скотилася по її обличчю. «Подивіться, до чого це мене призвело. Подумайте, до чого це призведе вас і ваше Братство». Діана відвернулася від Андреа, втупившись у центральний комп'ютер, де Елрік наполегливо працював, намагаючись отримати доступ. Екран раптом яскраво засвітився, змусивши Проктора підняти руки, щоб захистити очі.\n\n«Га! Що ви... о, ні». Реакція Елріка сказала все. Погане передчуття Андреа тільки посилилося.\n\n«Забирайте його», — сказала Діана. «Я не хочу знати, що буде далі».\n\nЧужинець мав сказати лише два слова: «Твою ж матір».\n\nПотім голограма почала повільно розбиватися на друзки й зникати. У самої Діани залишилося лише два слова: «Прощавай, Дереку».\n\n«ЗАЧЕКАЙТЕ!» — крикнула Андреа, простягнувши руку до голограми. Вона була надто повільною; та замерехтіла й розсіялася. Десь нагорі пролунав звук битого скла, коли проєктор зламався."
 nf_maxson.381.a:0 "Діани, Бога, Доктора, Людини більше не було."

 nf_maxson.39.t:0 "Впала Богиня I"
 nf_maxson.39.d:0 "Андреа, Докі — у своєму рожевому тілі штурмотрона — та Чужинець ішли довгим коридором у супроводі роботів-охоронців з обох боків. Це був справжній крок відчаю, коли Старійшина попросила про переговори, як тільки сили ордену досягли Розплідника. Нарешті вони дісталися ліфта, і саме там роботи перестали йти за ними. Вони увійшли, двері самі зачинилися, і ліфт почав спускатися.\n\nТрійця прибула до серверної кімнати, великого та просторого приміщення глибоко в надрах Розплідника. Проводи та обладнання вкривали кожен дюйм, усе це вело до центральної частини: комп'ютера ZAX. Коли вони підійшли ближче до нього, перед групою з'явилася голограма. Не та масивна, як у Сховищі 29, про яку теоретизували Андреа та Докі. Ні, ця була приблизно їхнього зросту, у вигляді жінки в туніці з довгими кучерявими локонами.\n\nОчі Діани на мить затрималися на Докі, потім зафіксувалися на Андреа. «Чому ви тут?»\n\nАндреа не здригнулася перед голограмою і кивнула на штурмотрона. «Докі хотіла поговорити з вами».\n\nДіана виглядала... спантеличеною? Принаймні, здавалося, що це не та відповідь, на яку вона очікувала. «У чому підступ? Використати її, щоб зіграти на моїх почуттях? Думаєте, я на це куплюся?»\n\nАндреа похитала головою. «Жодних підступів. Я припустила, що ви не захочете все обговорювати. Але Докі хотіла востаннє поговорити з вами. Тому я це влаштувала». Андреа поклала руку на плече штурмотрона, лагідно всміхнувшись їй.\n\n§P«Точно... Привіт ма-... міс Діано. Я знаю, що ми давно не спілкувалися і все таке, але я хотіла дещо вам сказати. Для мене багато значило б, якби ви вислухали».§! Штурмотрон перебирала пальцями, не дивлячись Діані в очі. Діана нічого не сказала, але й не зупиняла Докі.\n\n§P«У мене нікого немає, і я не хотіла бути одна, я хотіла мати сім'ю. Тоді я почала називати вас мамою. Думаю, це було тому, що ви відремонтували АРГУСа, а АРГУС полагодив мене, тож я подумала, що це означає, що ми є чимось одна для одної. Хоча насправді я нічого для вас не значила. Вибачте, якщо кожного разу, коли я телефонувала, я була набридливою, чи дівчиськом, чи ще кимось. Але... це робило мене по-справжньому щасливою, що ви завжди відповідали. Це справді було для мене всім».§!\n\nДокі підняла голову, нарешті зустрівшись із нею очима.\n\n§P«Потім я зустріла Бріксі. Вона була справді доброю і хорошою до мене, як і ви. І коли вас не стало, вона була поруч, як і ви, коли зник АРГУС. Вона як ви, як мама. Ви схожі більше, ніж думаєте. Я думаю, ви обидві будете це заперечувати, але це правда. Вам обом робили боляче, вас ламали. Ви обидві втратили людей, про яких справді піклувалися, але мусили рухатися далі заради інших».§!\n\nАндреа була здивована словами Докі. «Докі, усе гаразд, тобі не потрібно–»\n\n§P«Нічого не гаразд!»§! — крикнула вона. §P«Я не хочу бачити, як двоє людей, яких я люблю, б'ються! Ви обидві просто хочете допомагати людям! Хіба ви цього не бачите?»§!"
 nf_maxson.39.a:0 "У кімнаті запала тиша"

nf_maxson.391.t:0 "Впала Богиня II"
 nf_maxson.391.d:0 "Ніхто не наважувався промовити й слова. Потім голограма підійшла до Старійшини, зупинившись лише за фут від неї та точно на рівні її очей. Чужинець спробував встати між ними, але Андреа жестом наказала йому залишатися на місці.\n\nПісля ще однієї паузи Діана заговорила.\n\nАндреа відвела погляд. «Я б воліла не говорити про це».\n\nДіана мугикнула й відсторонилася, повернувшись до Докі з ніжною, але гіркою усмішкою. «Докі, ти ніколи не була тягарем. Ти була одним із небагатьох джерел світла, за які я могла триматися». Голограма «погладила» голову штурмотрона.\n\n«Що буде з моїми людьми?» — запитала вона Андреа, не дивлячись на неї.\n\n«Вони будуть роззброєні, але їм не заподіють шкоди. Я бачила достатньо смертей».\n\nДіана знову зробила паузу, голограма зобразила зітхання, але звуку не було. Потім вона знову повернулася до Андреа.\n\n«Комплекс ваш. Я вам не довіряю... але я довіряю своїй доньці. І якщо ви та, ким вона вас називає... Я готова спробувати».\n\nАндреа була захоплена зненацька такою зміною настрою. Вона зайшла в комплекс, повністю очікуючи, що доведеться пробиватися з боєм, навіть Чужинець виглядав однаково спантеличеним.\n\n«Я-я д-дякую вам, леді Діано». Настала незручна пауза. «Гадаю, я не представилася. Андреа Брікслі, я Старійшина Колорадського ордену Братства Сталі».\n\nВперше губи Діани вигнулися в легку усмішку."
 nf_maxson.391.a:0 "«Мене звати Діана Стоун, я лікарка»."

 ## Похід ##
 #Варіант V + Докі
 nf_maxson.43.t:0 "Сходження на вершину..."
 nf_maxson.43.d:0 "Останнім часом для Андреа стало звичною справою залишати штаб-квартиру в Денвері. Вона проводила все більше часу на вулиці, як у молодості, і це, ну, освіжало. Це розпалило в ній те, що вона давно поховала й забула заради місії. Сьогоднішній день, однак, був особливим. Адже вона була не сама.\n«Ви відстаєте. Вам треба прискоритися, якщо ми хочемо дістатися вершини до вечора!» — крикнула Андреа двом своїм супутницям по походу внизу.\nЗа кілька десятків футів позаду неї інші дві намагалися встигнути за її темпом, але марно.\n\n§P«Як вона так швидко йде? Хіба вона не має бути старою чи щось таке?»§! — запитала Докі, ведучи тіло штурмотрона, яким вона керувала, вгору крутим схилом.\n«Ми йдемо вже кілька годин. Як вона досі тримається?» — прохрипіла Ві. «Це *не* те, що я мала на увазі, коли запропонувала вибратися на природу!»\n\nСпочатку це була ідея і Докі, і Ві — піти кудись разом. Просто невелика дівич-вечірка, тепер, коли в Колорадо з'явилася хоч якась подоба миру, і вони могли хоч раз розслабитися без неминучої загрози їхньому існуванню. Зайве говорити, що вони не очікували, що доведеться підійматися на справжню гору.\n\nПомітивши, що розрив між нею та іншими двома постійно збільшується, Андреа підбігла назад до своїх супутниць. «Ми майже на вершині. Залишився останній ривок», — сказала вона зі щирим захопленням у голосі.\n«Дай лише хвилину... гаразд, можливо, п'ять». Ві важко дихала й сапала. Вона справді не звикла до таких фізичних навантажень.\n§P«Так, Бріксі, будь ласка, дай нам перепочити. Мені треба змастити суглоби цього тіла. Здається, у них набився бруд».§!\n\nАндреа, зі свого боку, не могла не знаходити ситуацію трохи кумедною. Подумати тільки, вона перевершує ШІ та надлюдину. Це була ідеальна можливість відігратися за всі ті глузування, якими вони — переважно Докі — її обсипали. На їхнє щастя, вона була не такою."
 nf_maxson.43.a:0 "«Звісно, давайте перепочинемо»"

 nf_maxson.44.t:0 "...Доки під високим деревом..."
 nf_maxson.44.d:0 "Ві першою привітала землю після того, як вони знайшли невелике місце, щоб присісти на виступі, з якого відкривався вид на широкі рівнини вдалині.\n\n«О земле, я так тебе люблю». Ві задоволено зітхнула.\n\nАндреа засміялася й сіла поруч із нею. «Яка драма».\n\n«Ми йдемо вже кілька годин! Як так вийшло, що ти не втомилася?»\n§P«Ага! Хіба звичайні люди твого віку не повинні весь час скаржитися на біль у спині чи щось таке?»§! Докі вказала на неї.\n\n«Ще один коментар про мій вік, і хтось полетить з цієї гори».\n\nОчі Ві миттю перевели погляд на Докі.\n\n§P«Що це за погляд?!»§!\n\n«Ну, ти ж та, хто може перебувати в більш ніж одному тілі!»\n\n§P«Так, але це все одно дуже страшно! Ти можеш використати свої сили, щоб пом'якшити падіння чи щось таке!»§!\n\n«Це так не працює!»\n\nПоки ці двоє скочувалися до суперечки, Андреа дістала сигарету, щоб прикурити. «Діти, заспокойтеся, будь ласка. Насолоджуйтесь краєвидом».\n\nОбидві зупинилися й подивилися на Брікслі.\n\n«Діти?»\n\n§P«Що ти маєш на увазі під дітьми? Ми в чотири рази старші за тебе!»§!\n\n«І якщо вже на те пішло, це ми повинні називати *тебе* дитиною».\n\nШвидким рухом Докі вихопила незапалену сигарету з пальців Брікслі й викинула її.\n\n§P«І це шкідливо для тебе!»§!\n\nАндреа повільно перевела погляд на них. «Сіли. На місце»."
 nf_maxson.44.a:0 "«Так, мем!» Дівчата негайно сіли."

 nf_maxson.42.t:0 "...Обіцянку сім'ї, яку ти знайдеш"
 nf_maxson.42.d:0 "§P«Бріксі, можна тебе дещо запитати?»§! Докі першою порушила тишу, продовживши після того, як отримала кивок від Старійшини. §P«Навіщо підніматися на гору? Тобто я люблю тусуватися й дратувати Ві, але ми могли б робити це буквально будь-де».§!\n\nОко Ві сіпнулося, перш ніж вона погодилася. «Ага».\n\nТепла усмішка з'явилася на обличчі Андреа. «Давним-давно, щойно я стала послушницею, я втекла з Лост-Гіллз. Ми з Гленном у нашій юнацькій дурості подумали, що зможемо підкорити найвищу гору в хребті Дьябло і довести, що нас можна зробити розвідниками. Ми заледве пройшли половину шляху, перш ніж у нас закінчилися припаси. Ми ледь не померли з голоду, але Трейсі здала нас начальству, і вони притягли наші напівмертві тіла назад у бункер. Боже, нас так відчитали і відправили чистити вбиральні на пів року». Вона розсміялася.\n\n«І все ж, незважаючи на те, що я ледь не померла, це один із моїх найщасливіших спогадів. Бачити світ унизу, всю ту буденну красу, яку не побачиш під землею... Я втратила цю іскру в Денвері. Відсиджуючись під землею так довго, я забула, як це відчувається. Але завдяки вам я згадала». Андреа обійняла їх обох і притиснула до себе. «Мої дві дивні довоєнні дівчинки».\n\n«А ще я знала, що ви не захочете цього пропустити». Немов за командою, сонце почало сідати за горизонт, заливаючи широкі рівнини внизу шквалом жовтих, помаранчевих і червоних кольорів."
 nf_maxson.42.a:0 "Ніщо не зрівняється із заходом сонця."

 #Варіант V
 nf_maxson.46.t:0 "Сходження на вершину..."
 nf_maxson.46.d:0 "Останнім часом для Андреа стало звичною справою залишати штаб-квартиру в Денвері. Вона проводила все більше часу на вулиці, як у молодості, і це, ну, освіжало. Це розпалило в ній те, що вона давно поховала й забула заради місії. Сьогоднішній день, однак, був особливим. Адже вона була не сама.\n«Ти відстаєш, Ві. Тобі треба прискоритися, якщо ми хочемо дістатися вершини до вечора!» — крикнула Андреа своїй супутниці по походу внизу.\nЗа кілька десятків футів позаду неї інша намагалася встигнути за її темпом, але марно. «Ми йдемо вже кілька годин. Як вона досі тримається?» — прохрипіла Ві. «Це *не* те, що я мала на увазі, коли запропонувала вибратися на природу!»\n\nСпочатку це була ідея Ві — піти кудись разом, просто невелика дівич-вечірка, тепер, коли в Колорадо з'явилася хоч якась подоба миру, і вони могли хоч раз розслабитися без неминучої загрози їхньому існуванню. Зайве говорити, що вона не очікувала, що доведеться підійматися на справжню гору.\n\nПомітивши, що розрив між нею та її супутницею постійно збільшується, Андреа підбігла назад до неї. «Ми майже на вершині. Залишився останній ривок», — сказала вона зі щирим захопленням у голосі.\n«Дай лише хвилину... гаразд, можливо, п'ять». Ві важко дихала й сапала. Вона справді не звикла до таких фізичних навантажень.\n\nАндреа, зі свого боку, не могла не знаходити ситуацію трохи кумедною. Подумати тільки, вона перевершує надлюдину. Це була ідеальна можливість відігратися за всі ті глузування, якими Ві її обсипала. На її щастя, вона була не такою."
 nf_maxson.46.a:0 "«Звісно, давай перепочинемо»"

 nf_maxson.45.t:0 "...І обіцянку сім'ї ти знайдеш"
 nf_maxson.45.d:0 "Ві першою привітала землю після того, як вони знайшли невелике місце, щоб присісти на виступі, з якого відкривався вид на широкі рівнини вдалині.\n«О земле, я так тебе люблю». Ві задоволено зітхнула.\nАндреа засміялася й сіла поруч із нею. «Яка драма».\n«Ми йдемо вже кілька годин! Як так вийшло, що ти не втомилася?»\nАндреа скуйовдила волосся Ві. «Багато тренувань».\nЧас ішов, поки вони двоє просто насолоджувалися природою, аж поки, зрештою, Ві не заговорила. «Чому гора? Тобто не зрозумій мене неправильно, мені подобається тусуватися з тобою, але чому саме це?»\n\nТепла усмішка з'явилася на обличчі Андреа. «Давним-давно, щойно я стала послушницею, я втекла з Лост-Гіллз. Ми з Гленном у нашій юнацькій дурості подумали, що зможемо підкорити найвищу гору в хребті Дьябло і довести, що нас можна зробити розвідниками. Ми заледве пройшли половину шляху, перш ніж у нас закінчилися припаси. Ми ледь не померли з голоду, але Трейсі здала нас начальству, і вони притягли наші напівмертві тіла назад у бункер. Боже, нас так відчитали і відправили чистити вбиральні на пів року». Вона розсміялася.\n\n«І все ж, незважаючи на те, що я ледь не померла, це один із моїх найщасливіших спогадів. Бачити світ унизу, всю ту буденну красу, яку не побачиш під землею... Я втратила цю іскру в Денвері. Відсиджуючись під землею так довго, я забула, як це відчувається. Але завдяки тобі я згадала». Андреа обійняла робота і притиснула її до себе. «А ще я знала, що ти не захочеш цього пропустити». Немов за командою, сонце почало сідати за горизонт, заливаючи широкі рівнини внизу шквалом жовтих, помаранчевих і червоних кольорів."
 nf_maxson.45.a:0 "Ніщо не зрівняється із заходом сонця."

 #Варіант Докі
 nf_maxson.48.t:0 "Сходження на вершину..."
 nf_maxson.48.d:0 "Останнім часом для Андреа стало звичною справою залишати штаб-квартиру в Денвері. Вона проводила все більше часу на вулиці, як у молодості, і це, ну, освіжало. Це розпалило в ній те, що вона давно поховала й забула заради місії. Сьогоднішній день, однак, був особливим. Адже вона була не сама.\n\n«Ти відстаєш, Докі. Тобі треба прискоритися, якщо ми хочемо дістатися вершини до вечора!» — крикнула Андреа своїй супутниці по походу внизу.\n\nЗа кілька десятків футів позаду неї Докі намагалася встигнути за її темпом, але марно.\n\n§P«Як вона так швидко йде? Хіба вона не має бути старою чи щось таке?»§! — пробурмотіла Докі собі під ніс, ведучи тіло штурмотрона, яким вона керувала, вгору крутим схилом.\n\nСпочатку це була ідея Докі — піти кудись. Просто невелика дівич-вечірка, тепер, коли в Колорадо з'явилася хоч якась подоба миру, і вони могли хоч раз розслабитися без неминучої загрози їхньому існуванню. Зайве говорити, що вона не очікувала, що доведеться підійматися на справжню гору.\n\nПомітивши, що розрив між нею та Докі постійно збільшується, Андреа підбігла назад до ШІ. «Ми майже на вершині. Залишився останній ривок», — сказала вона зі щирим захопленням у голосі.\n\n§P«Бріксі, дівчинко, я розумію. Справді. Але будь ласка, дай мені перепочити. Мені треба змастити суглоби цього тіла. Здається, у них набився бруд».§! — застогнала Докі.\n\nАндреа, зі свого боку, не могла не знаходити ситуацію трохи кумедною. Подумати тільки, вона перевершує ШІ. Це була ідеальна можливість відігратися за всі ті глузування, якими Докі її обсипала. На щастя для ШІ, вона була не такою."
 nf_maxson.48.a:0 "«Звісно, давай перепочинемо»."

 nf_maxson.47.t:0 "...І обіцянку сім'ї ти знайдеш"
 nf_maxson.47.d:0 "Вони знайшли гарне невелике місце, щоб присісти, з якого відкривався вид на широкі рівнини вдалині.\n\n§P«Бріксі, можна тебе дещо запитати?»§! Докі першою порушила тишу, продовживши після того, як отримала кивок від Старійшини. §P«Навіщо підніматися на гору? Тобто я люблю тусуватися з тобою, але ми могли б робити це буквально будь-де».§!\n\nТепла усмішка з'явилася на обличчі Андреа. «Давним-давно, щойно я стала послушницею, я втекла з Лост-Гіллз. Ми з Гленном у нашій юнацькій дурості подумали, що зможемо підкорити найвищу гору в хребті Дьябло і довести, що нас можна зробити розвідниками. Ми заледве пройшли половину шляху, перш ніж у нас закінчилися припаси. Ми ледь не померли з голоду, але Трейсі здала нас начальству, і вони притягли наші напівмертві тіла назад у бункер. Боже, нас так відчитали і відправили чистити вбиральні на пів року». Вона розсміялася.\n\n«І все ж, незважаючи на те, що я ледь не померла, це один із моїх найщасливіших спогадів. Бачити світ унизу, всю ту буденну красу, яку не побачиш під землею... Я втратила цю іскру в Денвері. Відсиджуючись під землею так довго, я забула, як це відчувається. Але завдяки тобі я згадала». Андреа обійняла робота і притиснула її до себе.\n\n«А ще я знала, що ти не захочеш цього пропустити». Немов за командою, сонце почало сідати за горизонт, заливаючи широкі рівнини внизу шквалом жовтих, помаранчевих і червоних кольорів."
 nf_maxson.47.a:0 "Ніщо не зрівняється із заходом сонця."

 ## Похорон ##
 nf_maxson.49.t:0 "Згаслий голос"
 nf_maxson.49.d:0 "Цей день почався як і будь-який інший.\n\nПаладини тренувалися, будівельні бригади відбудовували Денвер, Елрік працював над своїм новим проєктом, а Чужинець був, ну, десь і щось робив.\n\nАндреа зі свого боку насолоджувалася сніданком у невеликому нещодавно відбудованому кафе неподалік від Юніон-Стейшн. Який був сенс в ідеї Ріверса щодо відбудови міста, якщо вона не могла насолоджуватися цими маленькими розкошами?\n\nСтарійшина попиває каву, читаючи звіт у руках. Ще більше запитів на поставки боєприпасів від Коула. Старійшина настільки поглинена читанням, що майже не помічає, як до її столика підходить писар.\n\n«Так?» — запитує вона, не відриваючи очей від звіту й роблячи ще один ковток.\n\n«Повідомлення з Оклахоми, мем».\n\nЦе змушує її підбадьоритися. «Від Ві? Ми не мали зустрічатися ще два тижні. Що їй потрібно?»\n\n«На лінії була не леді Ві, мем, це був Паладін Амброуз... Йому треба було дещо доповісти».\n\n«Щось не так?» У неї всередині почала наростати тривога. «Кажи вже!»\n\nПисар ще на мить завагався, а потім передав повідомлення. «Леді Ві мертва, мем».\n\nЧашка кави впала й розбилася об підлогу."
 nf_maxson.49.a:0 "«Що?»"

 nf_maxson.50.t:0 "Прощання трьома залпами"
 nf_maxson.50.d:0 "Минув цілий тиждень відтоді, як новина дійшла до Андреа. Вона кинула майже все і того ж дня помчала до Каплиці, де їй, і тільки їй одній, розповіли правду про проєкт АКАПЕЛА. Всім іншим, навіть найближчому оточенню Андреа, скажуть, що Ві померла від хвороби, яку вона приховувала, або від чогось подібного.\n\nПізніше того ж дня Старійшина наказала організувати публічний похорон. Військові почесті, промови — усе як годиться. Ві, мабуть, ненавиділа б це, але хоче вона того чи ні, вона була лідером, публічною особою, і тому з нею мали поводитися відповідно.\n\nТож саме тут зараз була Андреа, сидячи в другому ряду Каплиці, слухаючи, як найближчі друзі Ві один за одним промовляли слова за трибуною. Доун почувалася ніяково, заледве видавила з себе три речення, перш ніж почала плакати. Амброуз був більш зібраним, він говорив про свої теплі спогади про Ві та їхню спільну роботу, закінчивши на меланхолійній, але оптимістичній ноті для Хору. Потім вийшла Селестіна. Іноді Андреа заздрила цій жінці, яка завжди знала, що і коли сказати, надихаючи людей і сповнюючи їх надією. Ці здібності псайкера були справді дуже корисними.\n\nДо трибуни підходило й відходило ще більше людей. Від інших видатних членів Хору до людей із громади, з якими Ві взаємодіяла. Виступали навіть деякі з їхніх союзників у Колорадо. Врешті-решт, настала її черга.\n\nАндреа піднялася зі свого місця й повільно підійшла до трибуни, дивлячись на те місце, де на стіні висів старий потертий хрест. Це було навіть певною мірою іронічно. Місце, яке мало бути святим у часи виправної установи, осквернене заради «науки», де стільки людей зазнали стількох страждань, знову служило своєму початковому призначенню. Андреа стиснула дерев'яну трибуну, повернувшись до натовпу."
 nf_maxson.50.a:0 "«Ві... Ві була моєю подругою»."

 nf_maxson.51.t:0 "Як сказати прощавай?"
 nf_maxson.51.d:0 "«Це була гарна промова, міс Брікслі». Селестіна стояла у дверях спальні Ві. Після церемонії та поховання Андреа запитала її, чи може вона прийти до спальні Ві.\n\n«Дякую, леді Селестіно. Хоча ваша була кращою». Андреа провела рукою по дерев'яних комодах.\n\nКімната була досить простою та позбавленою прикрас. Чесно кажучи, вона думала, що Ві більше прикрасила б її... ну, Андреа не була точно впевнена, чим прикрашають спальню, але вона не уявляла, що це буде саме так.\n\n«Мої здібності часом досить корисні...» Настала незручна пауза. «Ви ж знаєте, що вам дозволено сумувати, так?»\n\n«Про що ви?» Не рахуючи моменту, коли вона отримала новину, Андреа не виявляла жодних емоцій, окрім тих, яких усі очікували б від лідера.\n\n«Ви знаєте, що я відчуваю саме те, що відчуваєте ви. Навіщо це придушувати? Як і будь-хто з нас, ви теж можете сумувати».\n\nСтарійшина повернулася до Селестіни, вираз холодної нейтральності так і не зник з її обличчя. «Ви були її подругою, Селестіно, її сім'єю. Ви пройшли через усе разом. Я знала її мізерну частку її життя. Я не маю права розкисати й сумувати. До того ж, мені потрібно керувати Орденом».\n\nСелестіна зітхнула. «Ця броня, яку ви надягаєте, та, в яку ви заковуєте свої емоції... Вона повільно зламає вас». Вона полізла до кишені й дістала листа. «Ві хотіла, щоб я передала це вам. Вона написала по одному для всіх нас». Селестіна простягнула їй листа і вийшла з кімнати, залишивши Андреа в повній самоті."
 nf_maxson.51.a:0 "Завагавшись, вона відкрила листа."

 nf_maxson.52.t:0 "Якщо не останньою піснею?"
 nf_maxson.52.d:0 "§IЯ думала, що смерть прийде з жахливим криком,\nЗ громовим дзвоном і плачем небес;\nТа все ж минає золотий світанок,\nІ світло, як і раніше, затримується у твоїх очах.\n\nТи говориш про майбутні дні з ніжним подихом,\nНіби мені все ще обіцяно час;\nПоки таємно я мирюся зі смертю,\nІ вчуся прощанню в кожній звичній речі.\n\nЯ б не хотіла, щоб ти замикала своє горе,\nАбо ховала очі, ніби сльози — це злочин;\nДозволь смутку вільно говорити —\nЦе не є злочином перед брамою часу.\n\nТепер, коли мене немає, не називай це кінцем,\nА чимось прожитим, глибоко відчутим і справжнім;\nБо любов не стає менш справжньою, коли хилиться —\nі знай, що цей останній удар серця тримається за мою любов до тебе.§!\n\nДякую, що ти була в моєму житті, Андреа. Хоч і недовго, ти була матір'ю, якої в мене ніколи не було."
 nf_maxson.52.a:0 "І так мати плакала, а її доньки більше не було."