l_english:

nf_maxson_test.1:0 "Тестова Подія"

#Starting Focus Events
  #Подія 1#
nf_maxson.1.t:0 "Особистий Журнал — Початок Експедиції"
nf_maxson.1.d:0 "\"Говорить командир паладинів Андреа Брикслі. Записую особистий журнал, щоби... щоби якщо я не зможу нас провести — принаймні хтось знатиме, що сталося.\"\n\nВідкинувшись у кріслі, Андреа важко зітхає й проводить рукою по коротко обрізаному волоссю. Вона продовжує: \"На початку ми всі мали великі надії, рухаючись на схід. Старійшина з Лост-Гілз, обраний для керівництва експедицією — Кемерон — був хорошим лідером. Його поважали, і він побачив чимало боїв.\"\n\n\"Мене вибрали супроводжувати його, очолювати моїх паладинів і лицарів на випадок, якщо на нас нападуть. Пам’ятаю, точились дебати, які ресурси мають бути виділені експедиції...\""
nf_maxson.1.a:0 "\"Ми вирушили з великою кількістю людей, але майже без спорядження.\""
nf_maxson.1.b:0 "\"Ми вирушили малим загоном, але спорядження було на кожного.\""

  #Подія 2#
nf_maxson.4.t:0 "Особистий Журнал — Виття і Крики"
nf_maxson.4.d:0 "\"Наше прибуття до Колорадо пройшло без фанфар. Племена та поселення біля нашого місця призначення попереджали, що нашу мету охороняють люті пси — Битих Псів.\"\n\n\"Старійшина Кемерон не був дурнем, але...\" — рука Андреа зціплюється в кулак — \"ніхто з нас не уявляв, із ким ми маємо справу.\"\n\n\"Ми ввійшли в Денвер, і бачили лише поодиноких мародерів — жодної ознаки ворога, про якого нас попереджали. Дехто з нас тривожився, але більшість вирішила, що рейдерів уже розбили до нашого прибуття.\" — гірка гримаса викривляє обличчя Андреа. Вона струшує головою.\n\n\"Якби ж то нам так пощастило.\" — коротка пауза. \"Першої ж ночі, коли ми щойно облаштувались і почали планувати перші кроки — вони напали.\"\n\n\"Це була різанина. Ми змушені були тікати через ріку з тим, що змогли нести на собі.\""
nf_maxson.4.a:0 "\"Єдиною надією був бункер.\""

  #Подія 3#
nf_maxson.2.t:0 "Особистий Журнал — Наш Притулок"
nf_maxson.2.d:0 "\"Старійшина Кемерон був тяжко поранений під час бою та відступу, але зміг повести нас на південний схід. Він знав про існування бункера, де ми зможемо переховуватись і перегрупуватись. Розбиті й виснажені, ми бігли через річку, з гангдогами, що дихали нам у спину.\"\n\n\"Це був бій із відступом до бункера, про який ми не знали нічого: чи він узагалі існує, чи не зруйнований він під час Великої Війни. Я почала вірити, що нам нарешті пощастило, коли ми прибули й виявили, що бункер не лише вцілів, а й лишився опломбованим і добре забезпеченим...\""
nf_maxson.2.a:0 "\"...і з останньою катастрофою, що ледь не знищила нас.\""

  #Подія 4#
nf_maxson.3.t:0 "Особистий Журнал — Божевілля Під Землею"
nf_maxson.3.d:0 "\"Ніхто не знає, як якийсь сенатор дістав партію Стелс-Боїв, але Старійшина вважав, що їх можна використати для розвідки за річкою й пошуку загублених братів із нашої експедиції. Найдосвідченіших з-поміж нас, тих, хто ще живий, спорядили цими пристроями — і вони вирушили через ріку вглиб територій Битих Псів.\"\n\n\"Упродовж тижнів і місяців їм вдалось повернути багатьох зниклих. Здавалося, що ситуація покращується... але, мабуть, надія осліпила нас щодо істини.\"\n\n\"Старійшина Кемерон дивом одужав настільки, що міг сам ходити, а наші розвідувальні групи почали повертатись. Я вийшла з бункера разом із ним, щоб зустріти їх... але щось було не так. Їхній стан погіршувався вже певний час. Надмірне використання Стелс-Боїв призвело до параної. Вони не вірили, що Старійшина ще живий. Після напруженої суперечки — зброя була зведена.\"\n\n\"Я не повірила власним очам, коли паладин вистрілив у Старійшину. Ми відкрили вогонь у відповідь, а розвідники розсіялись і почали стріляти — не лише в нас, але й один в одного.\"\n\n\"Після загибелі Кемерона та розпорошення більшості старших Лицарів і Паладинів... я залишилась найвищою за рангом уцілілою. Відтепер успіх або провал Експедиції — на моїх плечах.\"\n\n§RЗагляньте у вкладку рішень. У районі Больдерського Купола можна знайти засіб вилікувати їхній стан — повернення загублених братів стане набагато ціннішим, ніж їхнє знищення.§!"
nf_maxson.3.a:0 "\"Чи зможу я? Мушу.\""


#Scribe Focus Events#

nf_maxson.7.t:0 "Перевірка Елріка"
nf_maxson.7.d:0 "Йдучи коридором доступу в напрямку складських приміщень бункера, Андреа рефлекторно стискає й розтискає кулаки всередині силової броні. Вона знає — рутина допомагає триматися, але їй ненависна необхідність перевіряти кожну дрібницю. До всього цього вона була командиром у бою, а не нянькою для писарів. На щастя, шолом T-51b приховує її похмуре обличчя, коли вона проходить повз салютуючих Братів і киває їм на знак визнання.\n\nУдаривши рукавицею по перемикачу дверей і ввійшовши до кімнати, вона відразу чує гучні голоси. Поглянувши вбік, Андреа бачить двох писарів, що сперечаються за столом, де розкладені лазерні гвинтівки та броня.\n\nПеревівши погляд далі, вона помічає того, за ким прийшла — Проктора Елріка. Він сидить за письмовим столом біля далекої стіни, в напівтемряві світло терміналу осяює його зістарене обличчя зеленим відтінком. Ступаючи вперед — гучний звук її кроків розходиться від металевої підлоги — Проктор підіймає погляд, кидає незадоволений погляд на писарів і повільно встає, вітаючи Андреа. «Командире паладинів, на щоденну перевірку?»\n\nПохитавши головою, Елрік додає: «Я розумію вашу потребу все контролювати, але ж тижнева інспекція дала б такий самий результат».\n\nБрови Андреа хмуряться ще сильніше. Її голос — жорсткий, як сталь — лунає з динаміків шолома: «Якщо це для вас така тяжка перешкода, Прокторе, то я рекомендую вам швидко й чітко надати звіт. Тоді зможете повернутись до своїх обов’язків»."
nf_maxson.7.a:0 "«У кожного з нас своя роль, навіть якщо вона нам не до вподоби»."

nf_maxson.11.t:0 "Суперечка"
nf_maxson.11.d:0 "Андреа бачить, як Елрік напружується, але очей не відводить. Вона важко зітхає. Динаміки її шолома знову оживають: «У мене є важливіші справи, ніж сперечатись із вами, Прокторе. Назвіть щоденний звіт і також...» — вона жестом вказує ліворуч — «...поясніть, про що саме сперечаються ті двоє».\n\nЕлрік переводить погляд із її шолома на писарів, що й далі сперечаються біля столу. «На сьогодні маємо двадцять вісім лазерних гвинтівок і вісім комплектів силової броні. А щодо них — вони пропонують використати експериментальні креслення, які ми привезли з Лост-Гілз. Невипробувані. Одні з них дозволять нам виготовляти та обслуговувати більш досконалу броню, інші — покращити енергетичну зброю».\n\nПроктор похитує головою й додає: «Проблема в тому, що вони згодні, що креслення потрібні, але не можуть домовитися, які саме використовувати. Ресурсів і людей вистачить лише на один проєкт — тому рішення не з простих».\n\nАндреа повертає погляд на Елріка й запитує: «І що ж? Ви ж старший за рангом. Маєте ж власну думку».\n\nЕлрік зітхає, опускаючи очі: «Якщо чесно, з усім навантаженням я просто не звертав на це уваги...» — проводить рукою по сивому волоссю — «...не думав, що це щось серйозне».\n\nАндреа одразу розуміє, що Проктор так само байдужий до цього, як і до багатьох «рутинних» обов’язків. Вона робить паузу, обмірковуючи ситуацію, а тоді говорить."
nf_maxson.11.a:0 "«Скажіть їм: наша силова броня потребує переваги»."
nf_maxson.11.b:0 "«Скажіть їм: енергозброї не вистачає вогню»."

nf_maxson.12.t:0 "З цим розібрались"
nf_maxson.12.d:0 "Рішення Андреа, здається, полегшило Проктору душу — вона чує, як він тихо видихає, а на обличчі з’являється слабка усмішка. «Так, командире паладинів, негайно».\n\nПроте, щойно Елрік рушає від столу до писарів, Андреа піднімає руку, зупиняючи його. «Ні. У нас, точніше — в мене, зараз забагато справ. Це не час для послаблення дисципліни. Перевірки триватимуть, доки ви не візьмете себе в руки».\n\nОбличчя Елріка темніє від розчарування, але він віддає честь і відповідає: «Розумію, командире паладинів». Андреа стежить, як він іде до підлеглих, а потім сама вирушає до виходу. Її шолом приховує бурчання, з яким вона покидає приміщення."
nf_maxson.12.a:0 "«Один є. Ще шість...»"

#Trader Intro Events#

nf_maxson.13.t:0 "Залишки"
nf_maxson.13.d:0 "Похитавши головою з подивом, розглядаючи вражаючі запаси перед собою, Андреа звертається до лицаря поруч: «Скільки з них узагалі на ходу?»\n\n«Ми ще перевіряємо інші депо, але наразі нарахували 244 машини — від одномісних мікроавтівок до великих утилітарних вантажівок», — відповідає Лицар.\n\nПоглянувши вгору від планшета, він продовжує: «Це ті, що заводяться. Решта — у різних станах занепаду. Схоже, Скорпіони використовували їх на запчастини, щоб підтримувати боєздатність своїх рейдерських машин».\n\nАндреа коротко киває, задумливо промовляючи: «Нам не вистачить енергоелементів, щоби використовувати й ці машини, і силову броню...»\n\nРаптом Лицар збоку озивається: «Можна було б застосовувати їх для логістики, хоча б обмежено, як—» — його перериває несподіваний голос позаду."
nf_maxson_13.a:0 "«Гей, ви тут головна, так?»"

nf_maxson.131.t:0 "Ден Ріверс"
nf_maxson.131.d:0 "Різко обернувшись і поклавши руку на кобуру з лазерним пістолетом, Андреа бачить усміхненого чоловіка — явно не з Братства. Схожий на заможного пустельника, він тримає руки вбік, помітивши відверту ворожість у її русі й у погляді Лицаря. «Гей, я просто спитав. Це ж ще не причина стріляти, га? Сподіваюся, ні», — каже він. Андреа швидко оцінює його — загрози немає. Принаймні для неї особисто. Хіба що для її пайка.\n\nСуворо, без емоцій, вона кидає: «Яка твоя справа тут, пустельнику?»\n\nЧоловік не втрачає усмішки: «Мене звати Ден Ріверс, я торговець із "Збирачів". Раніше вів караван між Нью-Монроузом і Пото — часто бував у цих краях. Прийшов запропонувати послуги новоприбулим. І, так, не хотів підслуховувати, але ваші модні костюми носять голос далеко».\n\nАндреа нічого не відповідає, але згадує «Збирачів» — вони попереджали про Битих Псів під час подорожі до Колорадо. «Якби ж ми тоді сприйняли їх серйозно...» — майне в думках.\n\nДен вказує великим пальцем собі в жилет: «Бачите, я можу витягти з цих машин більше, ніж ви самі. У мене купа знайомств. Дайте мені використовувати ці автівки, поки не згорять — вам не доведеться хвилюватися за паливо. Натомість ви отримаєте частку прибутку і постачання від тих, хто готовий допомогти у війні з Битими Псами».\n\nАндреа на кілька митей замислюється. Цей чоловік — чужинець, але з огляду на розтягнутість Експедиції, союз із кимось, хто знає місцевість, — цінний ресурс. Вона розуміє: кожен Брат потрібен у битві проти Битих Псів. І тим паче — в тому, що буде після. «Якщо ми виграємо», — бурмоче вона.\n\nВона підіймає погляд у шоломі на Дена й каже: «Ти можеш використовувати ці машини. Але під супроводом одного з наших Братів. Щоб не забув, що тут ти гість. Сподіваюся, ти розумієш».\n\nАндреа була впевнена, що посмішка Дена вже не може стати ширшою — але помилилася. Він робить з пальців «пістолети», спрямовує їх у її бік і гордо заявляє: «Ден Ріверс не дасть вам потонути, це моє особисте слово!»"
nf_maxson_131.a:0 "Дивак, та, можливо, згодиться."

#Airship Events#

nf_maxson.airship.t:0 "Інша Експедиція на Схід"
nf_maxson.airship.d:0 "Андреа, Елрік і Аутсайдер мовчки пробиралися крізь вузький каньйон. Аутсайдер ішов попереду — він проходив цей шлях уже з пів дюжини разів і рухався з розслабленістю, яка починала дратувати Андреа. Вона тримала рушницю напоготові, знову й знову оглядаючи місцевість.\n\nПроктор Елрік плентався позаду, витрачаючи пів подиху на нарікання через сам факт своєї участі в поході. «Не розумію, чому ти не могла відправити когось іншого з писарів...»\n\nАутсайдер посміявся, влаштувавшись на камені, ніби тріумфально, й глянув на Елріка через плече: «Бо ти розумний. І тобі не завадить трохи фізичної активності!»\n\nЕлрік пробурмотів прокльон у відповідь і зробив ще один великий ковток із однієї зі своїх шести фляг.\n\nУ Андреа терпець почав уриватися: «Наскільки ми вже близько до цієї... “знахідки” твоєї—»\n\nЇї перебиває мовчазне видовище: вони піднялися на хребет і побачили її. Перед ними — велетенський скелет дирижабля, укритий пошматованим полотном, із зношеними залишками символіки Братства.\n\nМайже століття тому Лост-Гілз відправив частину Братства на схід, дослідити залишки мутантської загрози після падіння Творця. Відтоді — жодної вістки. Здається, ця аварія — їхній надгробок.\n\nСудячи з терміналу, який Елрік витягнув із уламків (вражаюча міцність, треба визнати), після прибуття Братство зайняло розташовану поблизу військову базу ВПС США і спробувало влаштувати там штаб. Базу згодом покинули, але залишили по собі чимало збереженої авіаційної техніки, яку ми зможемо використати."
nf_maxson.airship.a:0 "Створити табір неподалік."

nf_maxson_prepare.1.t:0 "Минуле розкрито"
nf_maxson_prepare.1.d:0 "Після ретельного дослідження нам вдалося встановити причину падіння дирижабля: газ усередині головного балона зайнявся — ймовірно, через одну з частих бур у Середньому Заході. Легкий, але займистий газ надавав експедиції потрібну дальність польоту, але ціною ставали людські життя.\n\nСлідів інших аварій поблизу не знайдено, отже, решта флоту, ймовірно, пережила бурю. Де вони зараз — невідомо. Проте, нам не потрібна така дальність — ми можемо відновити корпус, замінивши газ на безпечний, і пристосувати апарат до власних потреб."
nf_maxson_prepare.1.a:0 "Гідне поповнення нашого арсеналу."

nf_maxson_prepare.2.t:0 "Недоторкані реліквії"
nf_maxson_prepare.2.d:0 "На території колишнього Міста Роботів наші розвідники знайшли авіабазу. Війна її не торкнулася, хоча з роками вона занепала. Усередині ангарів зберігався невеликий флот вантажних літаків — здебільшого захищених від впливу довкілля."
nf_maxson_prepare.2.a:0 "Ми точно знайдемо їм застосування."

nf_maxson.8.t:0 "Панування в небі"
nf_maxson.8.d:0 "Наші останні авіаційні відкриття дали нам унікальну можливість — зосередити зусилля або на одному, або на іншому напрямку. Ми маємо обрати, що вдосконалювати..."
nf_maxson.8.a:0 "Дирижаблі"
nf_maxson.8.b:0 "Вантажні літаки"

nf_maxson.9.t:0 "Сталевий дощ"
nf_maxson.9.d:0 "Розробка спеціальної системи парашутів для паладинів і тренування їх до повітряних десантів дозволять проводити глибокі рейди з точністю і смертельною ефективністю."
nf_maxson.9.a:0 "Кодекс Мексона називає цей маневр..."

#Story stuff#

nf_maxson.5.t:0 "Завершити нашу місію"
nf_maxson.5.d:0 "Андреа тримала між пальцями маленький білий циліндр, граючись палаючою сигаретою, тоді як її погляд був прикований до мапи. На ній — грубий ескіз території Битих Псів, вся покреслена стрілками наступу на Денвер.\n\nБрікслі переглядала ці плани вже добрий десяток разів за останню годину. Так, вона визнавала їхню тактичну складність, але сумніви не полишали її думок.\n\nЧи спрацює це? Чи можна краще? Чи варте це того?\n\nВона знову й знову ставила собі ці питання, але не знаходила відповідей. Усе здавалося до болю несправедливим: Андреа –не– хотіла брати на себе відповідальність. Особливо якщо це ціною життя її Братів.\n\nВона затягнулась, червоний вогник сигарети горів зухвало.\n\nАле якщо не вона — то хто?\n\nСправді, хто? Вона не могла назвати жодного компетентного тактика, що вижив у Денвері. І перекласти це на когось нижче по ланцюгу — також не варіант.\n\nРаптом до неї дійшло — це –мала– бути вона. І завжди нею й було. Це не випадковість — це призначення. Саме вона піднялася, коли все валилось. Якби не вона, експедиція вже загинула б.\n\nІ тепер вага влади лежить на її плечах. І тільки її ініціатива визначає успіх місії.\n\nУпевненість більше не розкіш — вона необхідна. І коли Брікслі прийняла лідерство, вона присягнула зробити все можливе, щоб завершити завдання.\n\nУсе менше — просто неприйнятно."
nf_maxson.5.a:0 "Ad Victoriam."

nf_maxson.14.t:0 "Суперечка"
nf_maxson.14.d:0 "На висоті, з якої видно східні землі Нью-Сіракуз, Андреа роздивляється околиці через бінокль. Особливо й нема на що дивитися, хоча за звітами колись тут була хоч якась індустрія. Більшість її не працює вже два століття — але принаймні не знищена Великою Війною.\n\nОпустивши бінокль і передавши його Лицареві, вона рушає вниз — до намету. Відкривши клапан важкою рукою в силовій броні, вона заходить усередину і бачить торговця Дена Ріверса, схиленого над картою, поряд із Проктором Елріком.\n\n«Є зрушення?» — запитує вона. Обоє зводять на неї погляди: Ден усміхається своєю фірмовою посмішкою, Елрік підводиться й формально салютує.\n\n«Досить вагомі, — каже Проктор. — Завдяки зв’язкам містера Ріверса та нашим розвідникам ми маємо карту ключових об’єктів і план по захопленню».\n\nДен додає: «Майже готовий план. Але я б хотів попросити не виселяти мешканців із закладу “Стейкхаус Нью-Сіракуза”. Вони там осіли давно, і користі від переселення мало».\n\nЕлрік пирхає: «Це найбільша будівля в місті — користь буде».\n\nАндреа зітхає: «А чому це взагалі проблема? Ми ж уже виділили ресурси на відновлення інших будівель — вони ж не опиняться на вулиці»."
nf_maxson.14.a:0 "Соус..."

nf_maxson.141.t:0 "Священні пляшки"
nf_maxson.141.d:0 "«Стейк-соус?» — перепитує Андреа, піднімаючи брову під шоломом.\n\nДен киває: «Так, пані. Люди, що живуть у тій будівлі, вшановують “священні пляшки”. Роблять це вже століттями». Андреа мовчить, ошелешена.\n\nЕлрік врешті каже з досадою: «Та хіба вони не можуть просто забрати пляшки із собою? Побудують собі вівтар у новому житлі».\n\nДен заперечно хитає головою й вказує пальцем на карту: «Я знаю цих людей, Прокторе. Пляшки стоять за склом, на підвищеннях — це ще довоєнна експозиція. Зняти їх — означає вчинити святотатство».\n\nАндреа підносить руку до шолома, замислюється. Проблема мізерна, але Ден — явно схвильований, а Елрік, як завжди, байдужий. Якщо дозволити їм сперечатися — лише марнуватимуть час. Це дрібниця, та вона потребує рішення. І вона ухвалює його."
nf_maxson.141.a:0 "«Не чіпайте їх, обійдемо стороною»."
nf_maxson.141.b:0 "«Переселити. Нам потрібен простір»."

nf_maxson.15.t:0 "Карусель Млявості"
nf_maxson.15.d:0 "Андреа не була впевнена, на що вона дивиться. Нібито — розвідник Братства, але за звітами, він був набагато більше, ніж просто боєць.\n\nПід час відступу з Денвера він із кількома десятками людей опинився в пастці після рейдерської засідки й помилково прибув не до того бункера. Натомість — до довоєнного складу пайків неподалік від Форт-Лайон, який дивом лишився майже недоторканим від часів Великої Війни.\n\nВони облаштували табір усередині, полагодили передавач і запустили сигнал SOS. Так їх і знайшла решта Експедиції.\n\nУсе звучить просто — та сам боєць викликав чимало запитань.\n\nПо-перше, його броня була сильно модифікована: патронташі, сумки, інфрачервоний приціл на шоломі, кріплення для маскувальної сітки.\n\nПо-друге, він відмовлявся називати справжнє ім’я. Ніхто з тих, хто йшов із ним, його не знав. Навіть голографічні жетони були змінені: лишалось одне слово — «Аутсайдер».\n\nПо-третє — його манера мовлення. Відчувалася говірка Пустки й чимало місцевого сленгу.\n\nПоки Андреа поринала в думки про дивного чоловіка, той стояв у незграбній стійці. «Потрібно ще щось, міс...»\n\n«Паладин-командер», — виправила вона. У цьому бункері немає жодної «пані Брікслі».\n\n«Перепрошую, Паладин-командер. Є ще одне питання... що робити з усім цим продовольством? Його там цілі гори»."
nf_maxson.15.a:0 "Продати місцевим торговцям."
nf_maxson.15.b:0 "Роздати волонтерам."

nf_maxson.21.t:0 "Завдання Елріка"
nf_maxson.21.d:0 "Рухаючись коридорами підземної частини Юніон-Стейшн, Андреа зупинилась перед дверима головної лабораторії Писарів. Приклавши руку до панелі доступу, вона зайшла всередину й побачила Елріка, що щось бурмотів і швидко набирав текст на терміналі.\n\n«Рідко тебе таким працьовитим бачу, Прокторе», — озвалася Андреа. Елрік аж підскочив, стрімко підвівся й віддав честь.\n\n«Пала... себто, Старша, вибачте — не помітив, як ви увійшли!»\n\nВона усміхнулася й зробила жест, щоб він сів. «Я не для догани, Прокторе. Хочу дізнатися, над чим ти зараз працюєш. Ти ж нарешті маєш доступ до таємниць Денвера — те, заради чого ти взагалі пішов в Експедицію».\n\nЕлрік жваво закивав і запросив її подивитися: «Так, саме за цим я сюди й прибув. Я...» — на мить він відвів погляд, — «вибачте за моє минуле ставлення, Старша. Якщо чесно, я не вірив, що ми ще чогось досягнемо після того відступу».\n\nАндреа кивнула, усмішка згасла: «Жертви Братів, які дали нам цей шанс, мають бути вшановані. Тепер, давай подивимось, над чим ти працюєш»."
nf_maxson.21.a:0 "Мапа"

nf_maxson.211.t:0 "Розташування WARDEN"
nf_maxson.211.d:0 "«Мапа? Всіх об’єктів, пов’язаних із ШІ WARDEN?» — перепитала Андреа, вдивляючись у термінал. Це справді схоже на неї: кілька яскравих точок по всьому місту.\n\nЕлрік кивнув, очі горіли: «Саме так! Усі об’єкти вказують на одну спільну точку. Мені треба відвідати ці три, —» він торкнувся точок із мітками «Об’єкт B», «Об’єкт C», «Об’єкт D», «— щоби знайти, як я гадаю, “Об’єкт A” — місце, де розміщено самого WARDEN».\n\nАндреа замислено зиркнула на нього: «А навіщо знаходити WARDEN? Ти ж знаєш, Прокторе — довоєнні ШІ часто небезпечні».\n\nЕлрік злегка втомлено, але впевнено усміхнувся: «Я обіцяю бути обережним, Старша. Я надто довго чекав цього шансу, щоб зіпсувати все зараз».\n\nВона поглянула на нього ще раз. Немов нова людина. Як і багато з них — отримав другий шанс. І тепер мав змогу справді виконати свою місію. Вона тричі поплескала його по плечу, тоді випросталася й сказала: «Гаразд, Прокторе Елріку. Сподіваюсь скоро почути добрі новини».\n\nКроки її важких броньованих чобіт луною віддалялись до дверей. Перед тим як вийти, вона озирнулась і побачила Елріка — зосередженого, схиленого над терміналом. Усміхнувшись, вона вийшла і зачинила за собою."
nf_maxson.211.a:0 "Нам була потрібна ця перемога. Усім нам."

nf_maxson.22.t:0 "Меморіал"
nf_maxson.22.d:0 "Андреа поклала руку на вигравірувану металеву табличку. Учора прибули перші з них із бункера Мексона — за її наказом, аби викарбувати імена всіх Братів, що загинули на Юніон-Стейшн. Усього буде три, встановлені над внутрішніми дверима терміналу.\n\nВсередині силової броні Андреа лише мовчки дивилася, як її пальці ковзають по списку, зупиняючись на кількох знайомих іменах. Вона знала, що це не зменшить біль спогадів, але їй було важливо знати — про них не забудуть. І це правильно. Забувати не можна.\n\n«Старша?» — почувся голос поряд. Обернувшись, вона побачила Лицаря Кріса ліворуч. «Що сталося, лицарю?»\n\nШвидко віддавши честь, Кріс відповів: «Старша, на пероні вас чекає якийсь Ден Ріверс. Хоче поговорити».\n\nКивнувши, Андреа відповіла: «Дякую, лицарю. Вільні». Вона рушила до дверей терміналу й штовхнула їх. За залізничним двором вона побачила Дена — той, помітивши її, одразу ж почав махати рукою.\n\n«Що він вигадав цього разу...» — подумала Андреа, обережно просуваючись крізь досі пошкоджені ділянки Юніон-Стейшн."
nf_maxson.22.a:0 "Утримати місто на плаву"

nf_maxson.221.t:0 "Новий Денвер"
nf_maxson.221.d:0 "«Повільніше, Ден», — ледь не благає Андреа, бо як тільки вона підійшла ближче, торговець почав говорити без упину. Він зробив лише один вдих за хвилину, розповідаючи про свої «плани відродження».\n\nЙого посмішка ще ширша, коли він каже: «Вибач, просто справ купа!» Витягнувши флягу з кишені жилетки, він зробив ковток і продовжив: «Денвер у ваших руках — це гарний початок, але тепер треба зробити його справжнім. Не просто купою брухту, а містом, за яке варто триматися».\n\nАндреа підняла руку: «Я розумію, що в тебе є плани. Але я не можу дозволити кожному брати технології, як заманеться. Ми — Братство, ми захищаємо людство від загроз старого світу».\n\nДен змахнув флягою, мов відганяючи думки: «Та знаю я, з ким працюю. Я не про це. Цьому місту треба знову стати містом. Ви маєте знання — як запустити заводи, навести лад на вулицях, увімкнути світло. Вам не потрібні мародери — вам потрібні робочі місця для місцевих».\n\nАндреа зібралася щось відповісти, але Ден випередив її, вказавши пальцем просто на неї: «Хочете, щоб Братство тут лишилося? Будьте міцною столицею. Нехай люди самі захочуть вас тут бачити. Дайте їм місто — дайте їм стабільність — і вас звідси не вибити».\n\nЙого палець стиснувся в кулак, який він гордо підняв: «Денвер стане “Перлиною Колорадо”! І разом із ним засяє слава Братства Сталі!»"
nf_maxson.221.a:0 "Відбудуємо місто"

nf_maxson.222.t:0 "Представництво цивільних"
nf_maxson.222.d:0 "Андреа зачекала трохи, чи не продовжить Ден, але схоже, він нарешті видихнув. Вона відповіла: «Я розумію твою позицію, містере Ріверс. Ми вже плануємо відновлення частини міста для власного користування. Але те, що ти пропонуєш — перевищує наші можливості».\n\nДен зітхнув і опустив кулак: «Я знаю. Це не річ, яка станеться за кілька років. Це десятиліття. Але цього можна досягти, якщо докласти зусиль. Я готовий працювати, якщо приймете мене. Братство може зберегти всі свої технології, якщо зможе гарантувати безпеку Колорадо. Не ховайтеся — допомагайте людям».\n\nАндреа замислилась на кілька секунд, а тоді поклала руку йому на плече: «Добре, Ден. Ти вже допомагав нам, і я вірю, що зробиш це ще. Думаю, твій голос буде нам потрібен у найближчі роки».\n\nУсмішка торговця стала ще ширшою. Він зробив свої улюблені «пальцеві пістолети», помітив це, зніяковів і віддав щось схоже на салют: «Утримую вас на плаву — як і обіцяв»."
nf_maxson.222.a:0 "Голос народу"

nf_maxson.23.t:0 "Підготовка до підвищення"
nf_maxson.23.d:0 "Повернення старших членів Експедиції до бункера Мексона зайняло певний час, але Андреа знала — це необхідно. Її титул «Старійшина» був майже офіційно затверджений. Після перемоги над Битими Псами вже ніхто з Братів не сумнівався в її здатності керувати.\n\n«Я мала рацію...» — подумки мовила Андреа. Усі її плани, усі стратегії — виправдані. Це не було легко, але вони здобули перемогу.\n\nСтоячи у своїй кімнаті, дивлячись у дзеркало, вона відчувала незвичність. Без силової броні — постійної супутниці з часів відступу з Денвера — перспектива здавалася іншою. Відсутність звичної ваги й висоти збивала з пантелику.\n\nРозправивши плечі й пригладивши складки на нових церемоніальних шатах, Андреа вдивлялась у власне відображення. У стислі терміни їй усе ж вдалося дістати однострій, гідний Старійшини Братства. Він пасував їй, а жінка в дзеркалі — втілювала цей образ.\n\nЗасунувши пасмо волосся за вухо, вона кивнула собі. Вона готова."
nf_maxson.23.a:0 "Церемонія"

nf_maxson.231.t:0 "Старійшина Брикслі"
nf_maxson.231.d:0 "«Для мене велика честь прийняти звання Старійшини», — урочисто промовила Андреа до зібраних Братів. Церемонія відбувалась у залі, зазвичай відведеній під стратегічні наради.\n\n«Я обіцяю вести новостворений осередок з усією своєю силою й мудрістю. Ми не дозволимо трагедіям минулого визначати нас. Наші перемоги довели це. Колорадо назавжди запам’ятає могутність Братства!» — ці слова Андреа завершила, піднявши стиснений кулак високо вгору.\n\nЦе була не зовсім традиційна промова для посвяти, однак реакція була миттєвою. Брати відповіли піднятими кулаками, вигуками підтримки та схвалення.\n\nАндреа відчула, як на її обличчі з’явилася усмішка, а в грудях розливалася гордість. Вони їй довірились. Вона не могла бажати кращих Братів.\n\nУ глибині залу відчинилися двері. Крізь них, трохи спотикаючись, увійшов Лицар. «Старійшино!» — крикнув він, майже непомітно на тлі загального галасу. Піднявши руку, Андреа наказала замовкнути. «Що трапилось, Лицарю?» — кивнула вона."
nf_maxson.231.a:0 "Тривожне повідомлення"

nf_maxson.232.t:0 "Монстр з півдня"
nf_maxson.232.d:0 "«Коли перша група не повернулась, ми вирішили, що щось пішло не так. Лицар Аутсайдер повів нову команду на південь, аби з’ясувати ситуацію», — доповідав Лицар.\n\nАндреа наказала очистити залу, залишивши лише найвищих за званням. Її руки впирались у край карти, яку розгорнули для кращого розуміння ситуації.\n\n«Саме тут вони зіштовхнулися з ворогом?» — уточнила Андреа, вказуючи на мапі. «Так, Старійшино. Аутсайдер каже, що ніколи не бачив таких племен. Високоорганізовані, численні, всі — в однаковій броні. Це армія, а не рейдерська зграя».\n\nАндреа відкинулась назад, торкнулася підборіддя. Ще один претендент на владу в Колорадо, одразу після Битих Псів. «Ми ще не встигли зміцнити позиції, але вибору немає», — подумки відзначила вона, переводячи погляд на зібраних Паладинів і Лицарів.\n\n«Отже, хай буде так. Ми зустрінемо цю загрозу всім, що маємо. Відправимо дикунів назад до їхніх халуп — і нагадаємо, чия це земля. Ad Victoriam!» — виголосила Андреа, і Брати дружно підхопили її клич."
nf_maxson.232.a:0 "Сила Братства переможе"


nf_maxson.24.t:0 "Станція Союзу — Денвер"
nf_maxson.24.d:0 "«Усі — до уваги. Ми майже на місці», — звернулась Андреа до своїх Братів. Вона очолювала загін, який повертався на місце найбільшої поразки Експедиції — і не знала, що там на них чекає.\n\nКоли вони прибули сюди вперше, головна станція Денвера здавалася ідеальним пунктом для розміщення: довоєнні бомбосховища під головною залою, зручне розташування й доступ до всієї території міста. Прекрасна позиція — і водночас ідеальна пастка. Коли Биті Пси відкрили свої сили, вони налетіли з усіх напрямків. Навіть зараз, коли цих покидьків знищено, місто зачищено, Андреа не може не стиснути гвинтівку міцніше — холод пробігає по хребту.\n\nВона повільно веде дуло лазерної гвинтівки з боку в бік, заходячи на платформу. Позаду чує зглушені зойки й прокльони, що пробиваються через динаміки шоломів. Андреа стискає волю в кулак і скомандує: «Зосередитись. Територія ще не очищена». Її голос лишається рівним, спокійним. Але всередині — полум’я люті."
nf_maxson.24.a:0 "Тіла"

nf_maxson.241.t:0 "Станція Денвера — Платформи"
nf_maxson.241.d:0 "Биті Пси вдарили масовано: спершу хвиля динаміту, за нею — шалений штурм за підтримки їхніх псів. Андреа мала рідкісну перевагу — вона була в броні й усередині станції, коли все почалось. Брати на зовнішніх платформах не мали такого захисту. Їх застали зненацька, дезорієнтували, а далі — розірвали на частини. У буквальному сенсі. Величезні пси валили Братів додолу, утримуючи їх, поки рейдери розтинали броню і вирізали все, що всередині.\n\nПо платформах, пошматованих боєм, розкидані тіла — або їхні фрагменти. Андреа бачить щонайменше два десятки броньованих постатей. Дехто затиснутий уламками конструкцій, інші — посаджені або поставлені у неприродні пози.\n\nНа броні — символи Битих Псів. Потворні зображення завиваючих людей і псів, грубо намальовані, але впізнавані. «Це — їхній знак. Попередження кожному, хто пройде тут», — думає Андреа, щелепи зціплено, лють доходить до межі.\n\nВона не була певна, чи знайдуть тут своїх загиблих, чи доведеться прочісувати все місто в пошуках голографічних міток. І вона б краще обрала друге — ніж бачити це.\n\n«Зібрати їх. Усі тіла. Зішкребти ці паскудні малюнки з броні. Встановити особи. Третя група — зі мною. Заходимо в головну залу», — командує Андреа, прямує до входу. Якщо в когось і були сумніви — тепер їх більше нема. У Колорадо не залишиться жодного сліду Битих Псів. «Я не дозволю їм піти безкарно», — клекотить у думках."
nf_maxson.241.a:0 "Відчайдушна оборона"

nf_maxson.242.t:0 "Станція Денвера — Внутрішні зали"
nf_maxson.242.d:0 "Колись пишні, різьблені двері станції вже на момент Експедиції були в жалюгідному стані — і не стали перешкодою для Битих Псів. Переступивши через завали, Андреа впевнено прочісує залу дулом гвинтівки. Загін іде слідом. У пам’яті — спалахи: вибухи, паніка, шалений темп рейдерів, які досягли входів і вікон раніше, ніж Братство встигло зреагувати.\n\nВона щойно зняла гвинтівку з плеча, як новий залп динаміту полетів усередину. Для тих у броні — не смертельно. Але для решти — катастрофа. Тіла розривало, відкидало в стіни, кров і уламки — скрізь. Андреа кликала до бою, йшла вперед, закриваючи Братів корпусом своєї броні.\n\nНа мить вона зупиняється. Присідає. Піднімає з підлоги виснажену мікроячею. Тримає її між пальцями. Скільки б вогню вони не випустили — лазер, плазма, вибухівка — цього не вистачило.\n\nЛють ворога — несамовита, неконтрольована — прорвала оборону. Андреа й інші в броні намагались прикривати поранених, але рейдери, завиваючи, з проривом псів увірвались усередину. За лічені хвилини бій перетворився на криваву м’ясорубку."
nf_maxson.242.a:0 "Відступ"

  nf_maxson.243.t:0 "Станція Денвера — Відступ"
  nf_maxson.243.d:0 "Стискаючи мікроф’южн-ячейку в долоні, Андреа бачила перед очима спалахи бою. Писар Натан, позаду неї, отримав уламкове поранення під час першого вибуху. Її гвинтівка була порожня — під час перезаряджання четверо нападників навалились на неї, намагаючись повалити силою маси. Гвинтівку вибили з рук, вона боролась, аби втриматись на ногах.\n\nЗакричавши, вона вгатила першому прямо в обличчя. Удар броньованим кулаком зламав щелепу й відкинув його. Відбиваючись від інших, навіть через загальний гул бою, вона чула крики Натана. Озирнувшись, Андреа побачила: пес вгризся йому в горло. Він ще намагався чинити опір, та... хрускіт — і шия зламана.\n\nУ припливі адреналіну вона відштовхнула звіра. Крики, постріли, агонія — все змішалося. Але крізь цей хаос прорізалось одне єдине слово, що обпекло її, мов крижаний клинок: «ВІДСТУПАЙТЕ!» — наказ, що прозвучав через гучномовець обладунків Старійшини Кемерона. Брати почали пробивати шлях з боєм: стріляючи, прорізаючи, б'ючи ворога, аби вирватися зі станції.\n\nАндреа сіпнула головою, наче відганяючи спогади. Поглянула на стиснуту руку — корпус ячейки був зім’ятий. Вона відпустила уламок на те саме місце, де його підібрала. Помсту здійснено. Це знову буде їхній головний опорний пункт у Денвері. Провал більше не повториться. План спрацював. І тепер вона зобов’язана завершити те, з чого розпочалось — виконати місію."
  nf_maxson.243.a:0 "Колорадо стане нашим."

  nf_maxson.10.t:0 "Карусель Безумства"
  nf_maxson.10.d:0 "Андреа досі не знала, на кого дивиться. Зовні — розвідник Братства. Але звіти свідчили: він — щось більше.\n\nПід час відступу з Денвера його загін — кілька десятків осіб — потрапив у засідку й помилково опинився не біля пункту збору, а на території старого складу пайків, на південь від Форту Лайон. Диво, що той об’єкт лишився майже неушкодженим із часів Великої Війни.\n\nВони зайняли бункер, активували передавач, подали сигнал SOS — так Експедиція знайшла їх.\n\nЗвучить просто. Але сам «боєць» викликав занепокоєння:\n\nПо-перше, його броня — геть модифікована: ремені, підсумки, інфрачервоний приціл, кріплення для маскувальної сітки.\n\nПо-друге, він відмовлявся називати ім’я. Його знали лише як «Аутсайдер». Навіть голограмні жетони були змінені.\n\nПо-третє, мова. Вимова — як у пустельника. Повна відсутність братської строгості.\n\nПоки Андреа роздумувала над побаченим, той стояв на витягнуту — вже явно ніяково. «Ще щось потрібно, пані—»\n\n«Паладин-командир», — відрізала вона. У цьому бункері не було жодної «пані Брикслі».\n\n«Вибачте, паладин-командир. Є ще одне питання: що нам робити з їжею? Її там... дуже багато»."
  nf_maxson.10.a:0 "Продати місцевим торговцям."
  nf_maxson.10.b:0 "Віддати добровольцям."

  nf_maxson.16.t:0 "Скарб Доки"
  nf_maxson.16.d:0 "Робот-Сіті. Вторгнення в це техно-місто дружби з машинами пройшло краще, ніж очікувалось. Ізольоване, без підтримки сусідів, воно не мало шансів протистояти військовій операції.\n\nРоботи були знищені, знешкоджені або перепрограмовані. Частину перепрофільовано на логістику, частину — на підтримку в полі.\n\nПроходячи коридорами резиденції Доки, Андреа відчула щось дивне. На деяких корпусах зламаних роботів — імена. Малюнки квітів, сердець. Навіть зображення самої Доки. \n\nЗ одного боку, це може бути наслідком помилок у ШІ. З іншого... можливо, це були найближчі аналоги особистостей серед бляшанок. Занадто тривожна думка, аби зосереджуватись на ній. \n\nУвійшовши в центральне ядро, Брикслі побачила Проктора Елріка, схиленого над терміналом, де раніше перебувала (тепер утікачка) Доки."
  nf_maxson.16.a:0 ""Привіт Прокторе.""

  nf_maxson.161.t:0 "Людина Науки"
  nf_maxson.161.d:0 "Проктор Джордж Елрік — старший писар, направлений у цю експедицію з метою систематизації, каталогізації та вивчення технологічних багатств Денвера. Після того, як операція виявилась повним провалом, його перевели на посаду інтенданта. І він цього не пробачив — був або похмурим, або роздратованим, або все водночас.\n\nАле зараз, коли він схилився над терміналом Доки, що слабо мерехтів червоним — Андреа вловила щось схоже на задоволення. Вперше за довгий час перед ним було щось складніше за лазерний пістолет — і він пірнув у роботу з головою. Лише коли вона заговорила, Елрік випростався, прочистив горло і, потираючи бороду, показав на термінал.\n\n«Доброго ранку, Паладин-командире. Цей термінал — унікальний. Його неодноразово модифікували, особливо оперативну пам’ять і процесор. Його можна використати або для досліджень, або для розрахунків на виробництві. Але є одна проблема...»\n\n«Яка саме, Прокторе?»\n\nТой стиснув плечима і зітхнув: «Щось у цій ШІ було ключовим для його функціонування. Тепер, коли її немає — ця машина довго не протягне. Перегріється і стане купою брухту».\n\nГлухий кут. Що робити з цим терміналом?"
  nf_maxson.161.a:0 "Передати Писарям."
  nf_maxson.161.b:0 "Передати на Виробництво."

  nf_maxson.17.t:0 "Свіжі обличчя, свіжі новобранці"
  nf_maxson.17.d:0 "Перед Андреа — шеренги мешканців Пустки, вирівняних у бойові ряди. Кожен — у розвідувальній броні новачків. І кожен крадькома зиркав на її силову броню, коли думав, що вона не бачить.\n\nАндреа удавала, що не помічає.\n\nДвічі пройшовшись перед ними мовчки, вона зупинилася в центрі. Гучномовець її шолома тріснув коротким клацанням — і голос пролунав над рядами:\n\n«Я — Андреа Брикслі. З цього моменту ви звертаєтесь до мене лише як до Паладин-командира. Це ясно?»\n\nВідповідь пролунала миттєво, злагоджено: «Так, Паладин-командире!»\n\nКоротка пауза.\n\n«Ви всі — сміття. Гидкі пустельні виродки, одягнені в обладунки, які вам не пасують!»\n\nЩе пауза. Драматична.\n\n«Але ми це виправимо! Вас розберуть на шматки і зберуть заново — уже як лицарів, паладинів, розвідників. Холоднокровних бійців, які виконують накази — без жалю. Не всі з вас дійдуть до кінця. Але ті, хто витримає — стануть частиною Братства, величнішого, ніж ви коли-небудь могли собі уявити! Чи ясно я висловилась?!»"
  nf_maxson.17.a:0 ""Так, Паладин-командире!""

  nf_maxson.18.t:0 "Аномальна наука"
  nf_maxson.18.d:0 "Баґґери — строката суміш збирачів, колоністів і вчених, відряджена до північного Колорадо задля дослідження Техно-куполу в Боулдері. Після захоплення території Андреа поставила за мету інтегрувати найкращих із них, зокрема в наукову сферу.\n\nСьогодні вона разом із Проктором Елріком проводить відбір: які проєкти зберегти, а які відправити в утиль.\n\nПершою була Джейні Бедсолл — "зоолог", яка заявляла про вивчення ієрархії яо-ґай у північному Колорадо. З’ясувалося, що яо-ґай у цих краях узагалі не водяться, а її дослідження — фіктивні. Її відправили геть.\n\nДругим виступив Пітер Бейлзліфт, розробник роботизованих протезів. Пристрої були вражаючі — та працювали лише з важким рюкзаковим реактором, що викликав рак. Його теж попросили на вихід.\n\nЗалишився Вульф Кемпор — фармаколог. І, на подив обох, запропонував щось справді корисне: медикаментозний коктейль, що значно перевершує Ментати у стимулюванні працездатності дослідників. Побічні ефекти унеможливлюють бойове застосування — але для лабораторій це ідеальний засіб."
  nf_maxson.18.a:0 "Ласкаво просимо до служби!"

  nf_maxson.19.t:0 "Міжвідомчі військові ігри"
  nf_maxson.19.d:0 "Війна — це навичка. І як будь-яку навичку, її потрібно тренувати. Але як вчити війні в часи миру? Відповідь проста: навчальні бої.\n\nНовий союз між Мексоном і Капелою відкрив простір для випробування спільної тактики. Особливо це стосується інтеграції псайкерів-цілителів, розвідників і решти — до лав паладинів і лицарів, які звикли до суворої військової доктрини.\n\nДень почався з конфлікту між цілителем і писарем. Перший вважав морфін занадто небезпечним, наполягаючи на травах. Другий — захищав препарат, бо «не може бути шкідливим, якщо так добре діє». Суперечку припинили гвинтівки: обидві сторони відтягнули своїх, розділивши робочі зони.\n\nБули й інші інциденти, менш голосні, але їх вдалося владнати. Здавалося, обидві сторони дійсно хочуть працювати разом.\n\nФінальний маневр — зразкова наступальна операція — повністю розгромив умовного супротивника. Команда оборони була витіснена з позицій.\n\nПісля цього настав час обіду."
  nf_maxson.19.a:0 "Що таке «ем-ар-і»?"

  nf_maxson.20.t:0 "Земні принади"
  nf_maxson.20.d:0 "Похідна кампанія має безліч логістичних потреб. Їжа — одна з головних. Зазвичай паладини Експедиції Мексона забезпечені пайками, харчовими блоками і калорійною провізією.\n\nАле що, як постачання буде втрачено?\n\nНа щастя, Капела запропонувала на підтримку псайкера на ім’я Дон — її дар зв'язку з природою дозволив провести курс виживання: від розпізнавання їстівних ягід до видобутку білка з комах та коріння.\n\nСпочатку Дон говорила тихо і невпевнено перед цілим батальйоном лицарів, але згодом розкріпостилась. До кінця дня її навіть можна було назвати... дружелюбною.\n\nЗакінчилось усе кумедно: Дон вибила отруйну ягоду з рук старшого паладина. У відповідь пролунали приглушені посмішки товаришів по загону."
  nf_maxson.20.a:0 "Нічого собі, комах можна їсти?"

  nf_maxson_lanius.1.t:0 "Знову — у бій"
  nf_maxson_lanius.1.d:0 "Андреа знову відчула сумнів, застібаючи рукавиці Т-51b. Цей екзоскелет давно став частиною її плоті. Але сьогодні... він знову мав захищати від загибелі.\n\nПопереду найважче випробування. Усе залежить від її рішень. Майбутнє Колорадо, Братства, людей — усе на кону.\n\nВона взяла шолом до рук, подивилась у відображення. Рішуче натягнула на голову і сказала собі: «Ні. Я мала рацію. Я виведу нас звідси. І цей “Ланій” не стане нашим кінцем».\n\nЗброя, спорядження — і вперед. На війну. На перемогу."
  nf_maxson_lanius.1.a:0 ""Я не підведу.""

  nf_maxson_vault0.1.t:0 "Стародавня загроза"
  nf_maxson_vault0.1.d:0 "Сховище Нуль. Принаймні, так його називають. Але достеменно — невідомо нічого. Андреа вивчає звіти, свідчення, архіви. Більшість інформації придбано у місцевих, діти яких вижили під час інциденту. Вони суперечать один одному: одні стверджують, що з комплексу вирвались легіони роботів. Інші — що це були мутанти й гулі, на чолі з губернатором-гулем.\n\nВона зітхає, робить ковток з фляги, й озирається назад. Велика дошка, увішана знімками, вирізками, журналами й... червоними нитками. Багато ниток. Занадто багато.\n\nШукати це сховище буде непросто. Надто непросто."
  nf_maxson_vault0.1.a:0 "Що ж там, у глибині?"

nf_maxson_vault0.2.t:0 "Провалля у Вході"
nf_maxson_vault0.2.d:0 "\"Тут що, вибухнула ядерна боєголовка?\" — запитала Андреа у Елріка, коли вони підіймались гірською стежкою. \"Так, Старійшино, це єдине пояснення того, як Сховище було розкрите.\"\n\nОзирнувшись на Елріка в його бронекостюмі Т-45d, вона насупилась під своїм власним шоломом. Поруч ішов Аутсайдер — один із численних братів, які супроводжували її до Сховища. Він стверджував, що, коли виявив кратер, радіаційний фон був майже відсутній. І хоча Андреа довіряла його судженням, вона все ж шкодувала, що він відмовився від захисту скафандра.\n\nКоли вони досягли вершини, дорога перед ними різко обірвалася вниз. Зиркнувши через край, Андреа побачила скручену металеву діру глибоко внизу.\n\n\"Оце й є вхід, наскільки я розумію,\" — прокоментував Аутсайдер, вказуючи на отвір.\n\nАндреа кивнула: \"Не гаймо часу.\" Вона помахала рукою Паладинам і Лицарям позаду: \"У пролом, Брати. З’ясуймо, що тут трапилося.\""
nf_maxson_vault0.2.a:0 "Стрибнути у провалля"

nf_maxson_vault0.21.t:0 "Мовчазні Коридори"
nf_maxson_vault0.21.d:0 "\"Думала, нам знадобляться ліхтарі на шоломах,\" — промовила Андреа вголос. Але після падіння вниз вона з подивом помітила, що сховище було повністю освітленим і функціональним: світло, двері, термінали — все працювало.\n\nЇї супровід розосередився по кімнатах, перевіряючи кути. Аутсайдер пішов в один із коридорів, поки Андреа відвернулася. Вона сподівалась, що він скоро повернеться — на цьому етапі їй не потрібні були втрати.\n\n\"Старійшино! Підійдіть, я знайшов дещо,\" — покликав Елрік. Вона підійшла до нього, коли він натискав клавіші на терміналі. \"Що ви знайшли, Прокторе?\" — запитала Андреа.\n\n\"Схоже, це справді те, про що ми думали,\" — вказуючи на екран, де у верхньому куті миготіло \"Vault 0000\", — пояснив Елрік. \"Якщо специфікації точні — це сховище значно перевершує інші.\"\n\nПісля паузи він додав: \"Хоча більшість планів Vault-Tec так і не були реалізовані. Але навіть якщо збудована лише половина — це найбільше відоме нам Сховище.\"\n\n\"Є дані про його призначення?\" — поцікавилась Андреа, помітивши краєм ока, як Аутсайдер повертається. Елрік похитав головою: \"Крім стандартного \"вижити після ядерної війни\" — нічого. Можливо, в офісі наглядача або його аналогу є щось більше.\"\n\nАндреа поплескала його по плечу: \"Добра робота, Прокторе.\" — і, повернувшись до Аутсайдера, запитала: \"Ти знайшов спуск?\" Аутсайдер кивнув. \"Рушаємо далі. Аутсайдер знайшов шлях.\""
nf_maxson_vault0.21.a:0 "Йти далі всередину"

nf_maxson_vault0.3.t:0 "Штурм"
nf_maxson_vault0.3.d:0 "Стеля, обвуглена плазмою, розкидані рештки роботів — усе вказувало на запеклий бій у тісних коридорах. Найбільші бої точилися поблизу енергетичних вузлів верхніх рівнів — звідти сліди руйнувань вели до головного ліфта на нижні поверхи. Ті, хто вів цей наступ, були добре озброєні та досвідчені. Проте втрати були чималими: серед загиблих — і брати з символікою Братства.\n\nНавіть через фільтри шолома Андреа відчувала моторошну суміш: машинне мастило, попіл, метал і гниль. Руки двох лицарів, що йшли поруч, тремтіли — вони стискали лазерні гвинтівки, перевіряючи кожного зруйнованого робота втретє.\n\nАле найдивнішим було те, що серед загиблих були муміфіковані Гулі й навіть Супер-Мутанти в силовій броні — пліч-о-пліч з людьми з Братства. Деякі з тіл несли особисті речі, подібні до предметів племен.\n"
nf_maxson_vault0.3.a:0 "Загроза, що об’єднала всіх"

nf_maxson_vault0.4.t:0 "Гелліон"
nf_maxson_vault0.4.d:0 "Прибувши до Буена-Вісти, наші паладини швидко виявили зайнятий ангар. Згідно з терміналами всередині, це був \"Гелліон\" — передовий бойовий літальний апарат, створений до війни для допомоги Сховищу 0 в умиротворенні Пустки. На щастя, апарат так і не був завершений: силова установка, необхідна для запуску, була знищена силами Серединного Братства до того, як його зміг активувати Калькулятор.\n\nЕлрік був особливо захоплений знахідкою. Після того як Андреа привела його до апарату, він провів весь день, одержимо вивчаючи кожен вузол. Він наполіг на повному розборі конструкції та зворотній інженерії. Чи зможемо ми колись відтворити його — під питанням, але вивчення цієї машини дасть нам перевагу в авіаційних дослідженнях."
nf_maxson_vault0.4.a:0 "Вражаючий витвір інженерії."

nf_maxson_vault0.5.t:0 "Ближче до Істини"
nf_maxson_vault0.5.d:0 "Працюючі ліфти були справжньою удачею — вони зекономили дні дослідження. Вийшовши з охороною, Андреа тримає зброю напоготові, уважно скануючи коридори. Що глибше вони заходили, то більше її непокоїло побачене. Інформація, яку раніше знаходив Елрік, підтверджувалась кожним новим рівнем. Це було найбільше підземне укриття, в якому вона коли-небудь побувала з часів Лост-Гілз.\n\nАутсайдер, як завжди, перевірив рівень першим. Стоячи біля дверей ліфту, він звернувся до неї: \"Старійшино, вам і Елріку варто це побачити.\" Його обличчя було похмурим.\n\n\"Щось небезпечне?\" — запитала Андреа. Аутсайдер похитав головою: \"Ні, просто... можливо, це допоможе зрозуміти, що тут сталося.\" Заінтригована, Андреа покликала Елріка і наказала решті зачистити поверх, а сама пішла за Аутсайдером.\n\nВін привів їх у велику залу, заповнену рядами капсул. Вони були розміром з дорослу людину, усі з миготливими червоними індикаторами. Аутсайдер показав на найближчу: \"Погляньте.\"\n\nАндреа й Елрік підійшли й зазирнули крізь скло. Під шаром інею лежало муміфіковане людське тіло в комбінезоні Vault-Tec."
nf_maxson_vault0.5.a:0 "Замерзлі тіла"

nf_maxson_vault0.51.t:0 "Гробниця"
nf_maxson_vault0.51.d:0 "Андреа вже двічі обійшла ряди капсул. Зупинившись біля першої, вона поклала руку на скляну поверхню: \"Є щось, Елріку?\" — звернулась вона до чоловіка, що гарячково натискав клавіші терміналу в кінці зали.\n\nЕлрік озирнувся: \"Всі загинули незабаром після ядерних ударів, якщо часові мітки терміналу точні.\" Потім продовжив, не відриваючи погляду від екрану: \"Вони збудували це гігантське сховище, але, схоже, не протестували кріо-камери. Тут є запис, Старійшино.\"\n\n\"Його залишив один із техніків. Він писав, що ті, хто міг би полагодити 'Калькулятор', загинули у сні. Він збирався сам зробити все, що зможе — далі запис обривається.\"\n\n\"Калькулятор...\" — прошепотіла Андреа. Це ім’я вже фігурувало в зібраних звітах. Але якщо всі в Сховищі померли давно — то що ж вийшло звідси потім і принесло стільки руйнувань?\n\n\"Лицарю Аутсайдер, у нас залишились ще кілька рівнів. Знайди для мене цього 'Калькулятора'.\" — Аутсайдер віддав честь, зняв гвинтівку з плеча й відповів: \"Є, Старійшино.\""
nf_maxson_vault0.51.a:0 "Ще глибше"

nf_maxson_vault0.6.t:0 "Останній Рубіж Калькулятора"
nf_maxson_vault0.6.d:0 "Нарешті — найглибший рівень сховища. Андреа рухалася обережно, оточена своїми паладинами, коли увійшла до зали, яку виявив Аутсайдер. Масивні броньовані двері заскреготіли, відкриваючись під натиском десятка братів, що одразу ж увірвались усередину з піднятими стволами.\n\n\"Чисто!\" — вигукнув провідний паладин, і його голос відлунням пронісся приміщенням. За ним заходили інші: Елрік кинувся до основного терміналу, а Аутсайдер рушив до ще одних відчинених дверей на іншому боці зали.\n\nАндреа опустила зброю й перевела погляд на центр кімнати — там, де мав бути осередок Калькулятора. Та замість цього вона побачила імпровізований меморіал. Ряди обгорілих і пошкоджених шоломів були ретельно розставлені на підлозі. Під кожним — жетон, а по боках — пошарпані знамена Серединного Братства.\n\n\"Вони не просто полягли тут,\" — прошепотіла Андреа з повагою. \"Вони створили це... щоб їх пам’ятали.\"\n\n\"Старійшино, я знайшов кілька голозаписів,\" — вигукнув Елрік з-за термінала, перервавши скорботну тишу. Андреа підійшла, її погляд впав на три акуратно підписані касети: \"Генерал\", \"Моє Рішення\" і \"Останній Запис\".\n\n\"Спочатку ось цю, Елрік,\" — вказала вона на \"Генерала\". — \"Подивимось, що вони залишили.\"\n\nКоли Елрік вставив стрічку в термінал, камеру заповнило м’яке потріскування аудіозапису. Андреа знову обернулася до шоломів. Паладини мовчки стояли, вшановуючи тих, хто віддав тут усе."
nf_maxson_vault0.6.a:0 "Голозапис 1 \"Генерал\""

nf_maxson_vault0.7.t:0 "Генерал"
nf_maxson_vault0.7.d:0 "\"Я записую ці журнали перед відбуттям. Ціна була неймовірною, але системи Калькулятора нарешті винесені зі Сховища 0. Наші інженери демонтували їх до базових компонентів і доставили до Бункера Епсилон. Я наказав опечатати залишки сховища; Братство не може дозволити, щоб ця технологія потрапила до мародерів або ворогів. Зараз наш пріоритет — інтеграція Калькулятора в нову систему.\"\n\n\"Генерал Барнакі... мій товариш, друг, суперник. Я не можу сказати, що до кінця розумію його вибір, але поважаю його рішучість. Його мозок тепер є частиною нейронної мережі Калькулятора — людина, що боролася проти нього, тепер прив’язана до його холодної логіки. Він вірив, що це єдиний шлях. Сподіваюся лише, що його рішення не коштуватиме нам душ, як коштувало йому.\"\n\n\"Пустка — в хаосі. У наших лавах зростає розкол, навіть чутки про заколоти. Вже на півдні формується озброєний опір — з боку мутантів і гулів. Рейдери полюють на слабких, і навіть саме Братство починає тріщати по швах. Нове бачення Барнакі обіцяє порядок, але якою ціною? Чи врятує нас союз людини і машини, чи погубить? Поки що я продовжую шлях, покладаючись на силу Братства... і мудрість загиблих.\""
nf_maxson_vault0.7.a:0 "Голозапис 2 \"Моє Рішення\""

nf_maxson_vault0.8.t:0 "Рішення Воїна"
nf_maxson_vault0.8.d:0 "Голозапис перемикається на зернисте, чорно-біле відео. Камера показує покинуту залу Калькулятора у Сховищі 0 — тепер порожню, за винятком уламків і центральної консолі. Одинокий воїн у пошкодженій силовій броні Серединного Братства з рогами кульгає в кадрі. Його броня обгоріла, а плазмова гвинтівка волочиться в руці.\n\nФігура підходить до порожнього ложа, де раніше була система Калькулятора. Вона кладе в рукавичці руку на консоль, схиляючи голову — наче в скорботі. За мить піднімає гвинтівку й випускає чергу плазми в залишки обладнання. Спалахи, іскри, потім — чорний екран.\n\nКоли відео повертається, воїна вже немає. Лише димляча купа металу залишається у залі Калькулятора."
nf_maxson_vault0.8.a:0 "Голозапис 3 \"Останній Запис\""

nf_maxson_vault0.9.t:0 "Останній Запис"
nf_maxson_vault0.9.d:0 "\"Калькулятор більше не тут, але його не забуто. Він більше не загрожує Братству й не стане здобиччю для випадкових шукачів. Ми вивезли його ядро до Бункера Епсилон, де його силу скерують під наш контроль... або, принаймні, ми в це віримо.\"\n\n\"Рішення генерала Барнакі досі не дає мені спокою. Його перетворення на єдиного органічного керівника Калькулятора — це нагадування про те, чим ми пожертвували. Він вважав, що пам’ять про його дружину та любов до людства виправдовує його вибір. Але його бачення чистоти, 'кращого' світу — це світ, викуваний у сталі й крові. Мутанти страждатимуть, повстанці загинуть, а Братство пануватиме. Це те спасіння, про яке ми мріяли?\"\n\n\"Якщо ти слухаєш це — значить, ще є надія, що хтось навчиться на наших помилках. Знай: я боровся за майбутнє, навіть якщо сам його не побачу. Я був просто 'Воїн' — і я пишаюся тим, що був паладином Серединного Братства Сталі.\"\n\nЗапис завершується зображенням Воїна, який віддає честь, його броня з рогами тьмяно виблискує в напівтемряві зали."
nf_maxson_vault0.9.a:0 "Забута спадщина більше не забута."

nf_maxson_vault0.91.t:0 "Наслідки"
nf_maxson_vault0.91.d:0 "Андреа стояла в спорожнілій залі, погляд її зупинився на обвуглених кабелях і зруйнованому обладнанні, де колись містився Калькулятор. Після завершення голозапису повисла важка тиша — слова Воїна та Барнакі продовжували лунати в її свідомості.\n\n\"Отже... вони його перенесли,\" — порушив мовчанку Елрік. Він подивився на Андреа з-під шолома. \"У Бункер Епсилон, ще й на схід. І жодної армії роботів відтоді? Значить, вони якось його стримали. Але чому ми досі нічого про це не знали?\"\n\nБрікслі, схрестивши руки, стояла біля стіни: \"Бо ніхто не хоче, щоб ми знали,\" — різко відповіла вона. \"Думаєш, випадково це місце було запечатане й забуте? Вони щось приховують. Що б вони не зробили з Калькулятором — це точно не для добра Пустки.\"\n\n\"Але ж ми не бачили армій з Епсилону,\" — заперечив Елрік, вказуючи на порожній осередок. \"Машина була монстром, але можливо, план Барнакі спрацював. Можливо, вони справді використовують її для порядку.\"\n\nАндреа похитала головою й підійшла до консолі, на якій досі лишалися шрами від плазми Воїна. \"Барнакі вважав, що зможе контролювати Калькулятор, зробити з нього інструмент миру. Але записи говорять інше — Серединне Братство розірвало на шматки через його вибір. Навіть якщо його стримують, це лише питання часу, коли він знищить їх.\"\n\nЕлрік тяжко зітхнув: \"То й усе? Ми просто залишимо це місце й вдаватимемо, що його ніколи не було?\"\n\n\"Так,\" — твердо відповіла Андреа. \"Майбутнє Братства не пов’язане з експериментами Барнакі. Якщо ми сьогодні щось і засвоїли — так це те, що деякі рішення не можна скасувати.\"\n\nВона обернулася до інших: \"Запечатати залу. Минуле має залишитися тут.\""
nf_maxson_vault0.91.a:0 "Місія триває."

# Boulder Dome Events

nf_maxson_boulderdome.1.t:0 "Боулдер"
nf_maxson_boulderdome.1.d:0 "Кратер — ось чим зараз є Боулдер. Наповнений до країв яскраво-зеленими гулями й калюжами радіоактивної отрути, яка пробиває навіть силову броню. Експедиція знала про це з самого початку, але постійні ускладнення — спочатку з гангдогами, потім з Легіоном і Північним Колорадо — відкладали похід на купол.\n\nТепер, розглядаючи звіти, підготовлені Аутсайдером, Андреа зрозуміла — місія до Купола стала можливою. Вона не буде легкою чи безпечною. Треба збудувати передову базу, зачистити гулям, стримати мародерів... і це ще не враховуючи, що чекає всередині самого Купола. До цього можуть бути причетні допотопні бойові машини, розкладені суперзброї або токсичні речовини.\n\nЦя думка тривожила Андреа сильніше, ніж будь-що за останній час... але краще, щоб Купол відкрили ми, а не хтось інший."
nf_maxson_boulderdome.1.a:0 "Угору, до Купола."

nf_maxson_boulderdome.2.t:0 "Світяться й зляться"
nf_maxson_boulderdome.2.d:0 "Андреа стояла над ратушею так званого \"Табору Контакту\" — одного з небагатьох місць, де гулям і людям дозволяли торгівлю на території Світлячків. Тут було відносно чисто від радіації. Зачистка феральних гулів із Боулдера виявилась важким завданням, але ще складніше було домовитися з розсудливими гулями. Багато з них обурювались, що околиці Купола огороджені й закриті для вільних шукачів. Довелося піти на поступки, щоби уникнути повстань. Декому з гулів запропонували роботу: вивозити радіоактивні відходи, копати траншеї, тягати вантажі. Хоч спочатку це й було напруженим компромісом, з часом стосунки між місцевими й Братством стабілізувалися."
nf_maxson_boulderdome.2.a:0 "Складно, але керовано — якщо бути розумними."

nf_maxson_boulderdome.3.t:0 "Табір Альфа"
nf_maxson_boulderdome.3.d:0 "Андреа стояла поруч з Аутсайдером, дивлячись згори на табір із доволі вигадливою назвою — \"Табір Альфа\". Перший із багатьох невеликих військових аванпостів, які мали з'явитися в межах та навколо Зони Відчуження Купола Боулдера — БДЕЗ, як почали її скорочено називати.\n\n\"Отже, це воно, так?\" — задумливо промовив розвідник.\n\n\"Виглядає скромно, але розташоване стратегічно. Від самого початку тут шастають мутовані пси, а з цього посту відкривається чудовий огляд на весь район.\"\n\n\"Можливо, ти й права... але не хотів би я застрягнути в такій радіоактивній хатині.\"\n\nІ справді — він мав рацію. Та база була не надто затишною, проте в ній вистачало запасів Рад-Авей, щоби пережити другу апокаліпсис, якби треба було. Паладини, що чергували тут, мали все необхідне — головне, не тримати їх надто довго без ротації."
nf_maxson_boulderdome.3.a:0 "Затишно... і лише трохи фонить."

# Final Events

nf_maxson_final.1.t:0 "У Майбутнє"
nf_maxson_final.1.d:0 "Андреа відчинила двері до свого командного кабінету й сіла за стіл. Вона кинула на поверхню стосу звітів, зітхнула й відкинулася на спинку крісла, насолоджуючись комфортом.\n\nЗгодом, вирівнявшись, вона взяла перший звіт. Ден Ріверс просувався територіями, що колись належали Легіону, встановлюючи контакт із місцевими громадами.\n\nВідклавши листок убік, вона взялася за наступний: Аутсайдер знову \"зник\" — напевно, подався на північ або схід у пошуках нових слідів Серединного Братства. \"Не варто хвилюватися — він пережив усе, що нам траплялось. Як і ми всі,\" — подумала Андреа.\n\nНаступний звіт — від Проктора Елріка, а тепер — Головного Писаря Елріка. Головним чином, це зведення про конфіскацію й накопичення технологій у зайнятих районах. Андреа знала: попереду в нього багато роботи лише в одному Колорадо. Але новому осередку Братства конче потрібна людина з таким досвідом.\n\nПосміхаючись, вона згадала всі випробування, які вони пережили разом, щоби дійти до цього моменту. Її лідерство вивело їх з межі знищення й зробило важливою силою в Пустці.\n\nРоботи попереду ще багато. Але зараз... вона дозволила собі трохи відпочити."
nf_maxson_final.1.a:0 "\"Ми вистояли. Попри все...\""

