l_english:

 nf_maxson_test.1:0 "Тестова Подія"

#Starting Focus Events
  #Number 1#
 nf_maxson.1.t:0 "Особистий журнал — Початок експедиції"
 nf_maxson.1.d:0 ""Це Командор-Паладин Андреа Брікслі, записую особистий журнал, щоб... щоб переконатися, що якщо ми не виберемося з цього, хтось дізнається, що сталося."\n\nВідкинувшись на спинку крісла, Андреа зітхнула, провівши рукою по своєму коротко підстриженому волоссю, перш ніж продовжити. "Ми всі покладали великі надії на початку, вирушаючи на схід. Старійшина з Лост-Гіллз, обраний очолити експедицію, Старійшина Кемерон, був хорошим лідером. Його поважали, і він бачив чимало битв."\n\n"Мене обрали поїхати з ними, щоб вести наших Паладинів і Лицарів у бій. Пам'ятаю, були суперечки щодо того, які ресурси мала отримати експедиція.""
 nf_maxson.1.a:0 ""Ми вирушили з великою кількістю особового складу, але з невеликою кількістю спорядження.""
 nf_maxson.1.b:0 ""Ми вирушили з невеликою кількістю особового складу, але з достатньою кількістю спорядження для всіх.""
  #Number 2#
 nf_maxson.4.t:0 "Особистий журнал — Виття та крики"
 nf_maxson.4.d:0 ""Наше прибуття до Колорадо пройшло без фанфар. Племена та поселення поблизу нашого місця призначення попереджали нас, що нашу ціль охороняють люті пси — Пси Розвішення."\n\n"Старійшина Кемерон не був дурнем, але..." Рука Андреа стиснулася в кулак. "... ніхто з нас не знав масштабів ворога, з яким нам доведеться зіткнутися."\n\n"Ми увійшли до Денвера, але зустріли лише сміттярів, жодних ознак ворога, якого нам радили очікувати. Дехто з нас нервував, але більшість припускала, що рейдерів прогнали або знищили до нашого прибуття." Гірка гримаса з'явилася на обличчі Андреа, і вона похитала головою.\n\n"Якби ж нам так пощастило," — сказала Андреа, зробивши паузу, щоб зібратися з думками, перш ніж продовжити. "У першу ніч після того, як ми влаштувалися, ми будували плани щодо перших завдань експедиції. Саме тоді вони напали."\n\n"Це була різанина, ми були змушені відступити за річку з тим малим, що змогли забрати з собою.""
 nf_maxson.4.a:0 ""Нашою єдиною надією був бункер.""
  #Number 3#
 nf_maxson.2.t:0 "Особистий журнал — Наш прихисток"
 nf_maxson.2.d:0 ""Старійшину Кемерона було тяжко поранено під час битви та відступу, але він усе ж зміг повести нас на південний схід. Він знав, що там є бункер, у якому ми могли б сховатися, поки перегрупуємося. Розбита та виснажена, наша експедиція тікала через річку, а пси Псів Розвішення йшли прямо за нами."\n\n"Відступ з боями до бункера, який, як ми сподівалися, не був зайнятий, або, наскільки нам було відомо, взагалі знищений під час Великої Війни. Я сподівалася, що наша вдача нарешті повернулася до нас, коли ми прибули і виявили, що він не лише цілий, але й досі захищений та забезпечений припасами.""
 nf_maxson.2.a:0 ""А потім сталася остання катастрофа, яка ледь не знищила нас.""
  #Number 4#
 nf_maxson.3.t:0 "Особистий журнал — Безумство під землею"
 nf_maxson.3.d:0 ""Ніхто не знає напевно, як Сенатор роздобув партію Стелс-боїв, але Старійшина вирішив, що ми можемо використати їх для розвідки за річкою та пошуку решти нашої розсіяної експедиції. Найстарших і найдосвідченіших із нас, тих, хто ще був живий, відправили з мішком цих пристроїв, щоб вони допомогли перетнути річку і вижити на території Псів Розвішення."\n\n"Протягом наступних тижнів і місяців їм вдалося повернути стільки наших Братів, скільки вони змогли знайти. Здавалося, що справи йдуть на краще... але, можливо, ця надія засліпила нас від правди."\n\n"Старійшина Кемерон дивом одужав настільки, щоб ходити без сторонньої допомоги, і наші пошукові групи поверталися. Я вийшла з бункера разом зі Старійшиною, щоб привітати їх, але щось було дуже не так. Це погіршувалося в них уже деякий час, але пошукові групи страждали від надмірного використання Стелс-боїв; вони не вірили, що Старійшина живий, і після напруженої суперечки була витягнута зброя."\n\n"Я не могла повірити своїм очам, коли Паладин всадив кулю в тулуб Старійшини. Наша сторона відкрила вогонь у відповідь, тоді як члени пошукової групи почали розбігатися і безладно стріляти. Не лише по нас, але й один по одному."\n\n"Зі смертю Старійшини Кемерона та розсіюванням більшості наших старших Лицарів і Паладинів... я стала найвищим за званням Братом, що залишився. Тепер Експедиція досягне успіху... або зазнає краху завдяки моїм зусиллям."\n\n§RПеревірте вкладку рішень. Зверніть увагу на Купол Боулдера, щоб вилікувати їхній стан. Повернути втрачених членів нашого Відділення було б набагато краще, ніж необхідність їх вбивати.§!"
 nf_maxson.3.a:0 ""Чи зможу я це зробити? Я мушу.""

 #Scribe Focus Events#

 nf_maxson.7.t:0 "Перевірка Елріка"
 nf_maxson.7.d:0 "Прямуючи коридором до складських приміщень бункера, Андреа стискала і розтискала кулаки у своїй Силовій Броні T-51b. Вона знала, що рутина важлива для підтримання рівноваги, але ненавиділа необхідність перевіряти кожну дрібницю. До всього цього вона була лідером у бою, а не нянькою для писарів. На щастя, T-51b приховувала її похмурий вираз обличчя, коли вона проходила повз Братів, які віддавали їй честь, киваючи їм у відповідь і продовжуючи шлях до місця призначення.\n\nВдаривши рукавицею по відкритому перемикачу і переступивши через поріг, вона почула гучні голоси у складському приміщенні. Глянувши туди, вона побачила двох писарів, які сперечалися біля одного зі столів, на якому були розкладені броня та лазерні гвинтівки.\n\nВідвернувши від них увагу, вона побачила чоловіка, якого прийшла перевірити — Проктора Елріка. Проктор сидів за столом біля дальньої стіни; екран термінала підсвічував його старечі риси зеленим кольором у тьмяному освітленні. Коли вона зробила крок уперед і її черевики задзвеніли по металу, Проктор підняв очі, невдоволено глянув на двох писарів біля столу, а потім повільно підвівся і привітав Андреа. "Командоре-Паладине, ви тут для щоденного підрахунку?"\nПохитавши головою, Елрік продовжив. "Я розумію вашу потребу все контролювати, але, напевно, щотижнева перевірка дала б той самий результат."\n\nАндреа ще більше нахмурилася у відповідь на його слова, і її голос різко пролунав із динаміків шолома. "Якщо це настільки серйозне втручання, Прокторе, то я пропоную вам надати мені свій звіт швидко та ефективно. А потім ви зможете повернутися до своїх обов'язків.""
 nf_maxson.7.a:0 ""У кожного з нас є ролі, які ми маємо виконувати, навіть якщо вони нам не подобаються.""

 nf_maxson.11.t:0 "Суперечка"
 nf_maxson.11.d:0 "Елрік напружився, але його погляд не здригнувся. Андреа подумки зітхнула, перш ніж заговорити, і динаміки її шолома знову затріщали. "У мене сьогодні є важливіші справи, ніж сперечатися з вами, Прокторе. Скажіть мені результати щоденного підрахунку — і також," вона кивнула ліворуч, "поясніть мені, про що вони сперечаються."\n\nЕлрік перевів погляд з її шолома на двох писарів, які продовжували сперечатися біля столу протягом усієї їхньої розмови. "Сьогоднішній підрахунок: двадцять вісім лазерних гвинтівок і вісім комплектів Силової Броні. Один — T-51b, решта — T-45d. Щодо цих двох, вони запропонували використати експериментальні креслення — до того ж неперевірені — які ми привезли з Лост-Гіллз. Вони дозволять нам виробляти та обслуговувати більше T-51b або набагато більше гвинтівок." Проктор похитав головою. "Проблема в тому, що вони погоджуються, що в нашій ситуації ми маємо їх використати, але не можуть дійти згоди, які саме. Не маючи ані ресурсів, ані кваліфікованої робочої сили для обох варіантів, їм нелегко прийняти рішення."\n\nАндреа знову перевела свій прихований за шоломом погляд на Проктора. "І? Ви їхній керівник, напевно, у вас є власна думка."\n\nЕлрік похитав головою і зітхнув, нарешті опустивши очі й відвернувшись від Брікслі. "З моїм навантаженням я здебільшого їх ігнорував." Провівши рукою по сивіючому волоссю, він пробурмотів: "Я не думав, що це настільки важливо."\n\nАндреа зрозуміла, що Проктору це цікаво не більше, ніж більшість його "буденних" завдань. Це мало закінчитися прямо зараз."
 nf_maxson.11.a:0 ""Скажіть їм, що перевага для нашої Силової Броні не завадить.""
 nf_maxson.11.b:0 ""Скажіть їм, що перевага для нашої енергетичної зброї не завадить.""

 nf_maxson.12.t:0 "З цим розібралися"
 nf_maxson.12.d:0 "Рішення Андреа, здавалося, принесло Елріку полегшення; вона почула тихий видих, перш ніж на його обличчі з'явилася посмішка. "Так, Командоре-Паладине, негайно."\n\nЕлрік не встиг далеко відійти. Піднявши руку, щоб перегородити йому шлях, Андреа зупинила його перед тим, як він підійшов до писарів, що сперечалися. "У нас... ні, у мене і так вистачає клопотів, Елріку. Зараз не час байдикувати, коли нам потрібна кожна можлива перевага. Щоденні перевірки триватимуть, поки ви не виправитеся."\n\nПолегшений вираз обличчя Проктора змінився на роздратований, але він усе одно віддав честь. "Так, Командоре-Паладине, я розумію." Андреа спостерігала, як він рушив до своїх підлеглих, перш ніж розвернутися і попрямувати до виходу. Її шолом приховав її власне бурмотіння від чужих вух."
 nf_maxson.12.a:0 ""З одним розібралися, залишилося ще шестеро...""

 #Trader Intro Events#
 nf_maxson.13.t:0 "Залишки"
 nf_maxson.13.d:0 "Андреа похитала головою, дивуючись цьому вражаючому запасу, перш ніж повернутися до Лицаря, що стояв поруч із нею. "Скільки з них насправді на ходу?"\n\n"Ми все ще перевіряємо інші автомобільні депо, але наразі ми нарахували 244 машини: від одномісних компактних автомобілів до великих вантажівок," — відповів Лицар, відірвавши погляд від планшета в руках, перш ніж продовжити. "Решта — у несправному стані. Ми припускаємо, що Укус використовував їх, щоб підтримувати свій автопарк у робочому стані."\n\nАндреа коротко кивнула. "Нам не вистачить енергетичних батарей, щоб використовувати їх одночасно з нашою Силовою Бронею."\n\n"Ми все ще могли б використовувати їх для логістичних цілей, навіть в обмеженій кількост—" Лицар зупинився, перерваний новим голосом позаду них обох."
 nf_maxson_13.a:0 ""Гей... ви ж тут головна, так?""

 nf_maxson.131.t:0 "Ден Ріверс"
 nf_maxson.131.d:0 "Швидко обернувшись і поклавши руку на руків'я свого лазерного пістолета, Андреа побачила усміхненого чоловіка, який явно не належав до Братства. Він виглядав як заможний житель пустки; він підняв руки вгору, поглядаючи на її зброю. "Воу-воу, я просто хочу дещо запитати, за таке ж не стріляють, правда? Сподіваюся, що ні."\n\nАндреа швидко оцінила його. Він не становив безпосередньої загрози. Принаймні для неї особисто — кришки були іншою справою. "Які в тебе тут справи, жителю пустки?" — запитала вона суворим тоном.\n\nПосмішка чоловіка не зникла. "Мене звати Ден Ріверс, торговець із Збирачів. Раніше їздив маршрутом між Нью-Монтроузом та Пото, бував у цих краях багато разів. Прийшов запропонувати свої послуги новачкам. Не хотів підслуховувати, але ваші химерні костюми розносять ваші голоси досить далеко!"\n\nАндреа нічого не сказала. Вона пам'ятала Збирачів із подорожі до Колорадо — дехто з тих, хто випробовував долю за межами Денвера, попереджав їх про Псів Розвішення. На мить її пронизало почуття провини, залишивши Андреа шкодувати, що вона не сприйняла їхні попередження серйозно.\n\nДен ткнув великим пальцем у свій жилет, перш ніж продовжити. "Розумієте, я можу витягнути з цих машин набагато більше, ніж, мабуть, ви. У мене повно зв'язків, і якщо ви дозволите мені користуватися ними, поки вони не вийдуть з ладу — що дозволить вам не турбуватися про паливо — ви отримаєте частину мого прибутку та трохи припасів від тих, хто готовий допомогти проти Псів Розвішення."\n\nКілька митей Андреа обмірковувала його пропозицію. Ріверс був незнайомцем, який зміг забалакати вартових, але, оскільки Експедиція і так розтягнула свої сили до межі, мати союзника, який знає місцевих, було б чудовою перевагою. Кожен Брат був потрібен для війни проти Псів Розвішення, не кажучи вже про те, що буде після. Якщо це «після», звісно, настане.\n\nОчі Андреа всередині шолома піднялися на Дена. "Ти можеш використовувати ці машини, але тобі знадобиться супровід, щоб ти був у безпеці... і залишався чесним. Впевнена, ти розумієш."\n\nАндреа не була впевнена, чи могла посмішка Дена стати ще ширшою, коли він склав пальці у формі пістолетів і прицілився в її бік. "Ден Ріверс втримає вас на плаву, даю особисту гарантію!""
 nf_maxson_131.a:0 "Трохи дивний, подумала вона, але може бути корисним."

 #Airship Events#

 nf_maxson.airship.t:0 "Інша експедиція на Схід"
 nf_maxson.airship.d:0 "Андреа, Елрік та Чужинець тихо брели між стінами каньйону. Чужинець ішов попереду; він уже проходив цим шляхом з півдюжини разів і був настільки розслабленим, що це дратувало Андреа. Вона міцно стискала свою гвинтівку, вкотре оглядаючи околиці.\n\nПроктор Елрік плентався позаду; витрачаючи половину свого дихання на скарги про те, що йому взагалі довелося вирушити в таку подорож. "Не розумію, чому ви не могли попросити... будь-якого іншого писаря... піти з вами..." \n\nЧужинець засміявся, всівшись на камінь із глузливим тріумфом, поглядаючи на Елріка. "Тому що ти розумний, і тобі б не завадила розминка!" Елрік зміг лише пробурмотіти прокляття у відповідь, зробивши ще один довгий ковток з однієї зі своїх шести фляг.\n\nТерпець Андреа увірвався, коли вона нарешті заговорила. "Як близько ми до цього відкриття, про як—"\n\nВона замовкла, коли вони перетнули хребет і побачили це. Перед ними височіли масивні скелетні останки дирижабля, вкриті пошматованим брезентом і зруйнованими залишками знаків розрізнення Братства. Майже століття тому Лост-Гіллз відправили на схід невелику групу Братства, щоб розслідувати загрозу мутантів, що залишилася, тікаючи після поразки Майстра. На заході так і не отримали жодної звістки про їхню долю, але ці уламки, схоже, стали надгробком для тієї експедиції.\n\nСудячи з одного з терміналів, який Елрік витяг з уламків (біса міцні речі, подумала вона), після прибуття сили Братства зайняли прилеглу військово-повітряну базу і спробували використати її як штаб. Схоже, вони покинули й Авіабазу, але залишили по собі багато робочих авіаційних технологій, які Андреа могла б перепрофілювати для власних потреб."
 nf_maxson.airship.a:0 ""Розбити базовий табір неподалік.""

 nf_maxson_prepare.1.t:0 "Розкрите минуле"
 nf_maxson_prepare.1.d:0 "Після належного розслідування ми виявили причину аварії дирижабля. Щось підпалило газ усередині головного балона — імовірно, одна з тих бур, що часто трапляються на Середньому Заході. Легші, але легкозаймисті гази, які давали дирижаблям необхідну дальність польоту, безумовно, не вартували життів тих, хто був на борту. Проте розвідка не виявила поблизу інших уламків, тож решта флоту мала вижити. Як довго і як далеко — Елрік, Гленн та Андреа могли лише здогадуватися. Знаючи все це і не маючи потреби в дирижаблі дальньої дії, було прийнято рішення відремонтувати уламки та наповнити їх негорючим газом для використання у власних цілях."
 nf_maxson_prepare.1.a:0 "Чудове доповнення до нашого арсеналу."

 nf_maxson_prepare.2.t:0 "Незаймані реліквії"
 nf_maxson_prepare.2.d:0 "На колишній території Міста Роботів розвідники знайшли аеродром, якого не торкнулася Війна, хоча й торкнувся час. Всередині ангарів був запечатаний невеликий флот вантажних літаків, здебільшого захищених від впливу стихій."
 nf_maxson_prepare.2.a:0 "Впевнена, ми знайдемо їм застосування."

 nf_maxson.8.t:0 "Повітряна міць"
 nf_maxson.8.d:0 "З нашими нещодавніми авіаційними знахідками ми маємо унікальну можливість спеціалізуватися на чомусь одному, спрямувавши наші зусилля на підвищення загальної ефективності..."
  #Blimp
 nf_maxson.8.a:0 "Дирижаблів"
  #Cargo
 nf_maxson.8.b:0 "Вантажних літаків"

 nf_maxson.9.t:0 "Сталевий дощ"
 nf_maxson.9.d:0 "Розробка спеціалізованої парашутної системи для наших Паладинів та їх тренування для ситуацій десантування дозволить їм з точністю проводити небезпечні операції глибокого проникнення, коли цього вимагатиме ситуація."
 nf_maxson.9.a:0 "Кодекс Мексона називає цей маневр..."

 #Story stuff#

 nf_maxson.5.t:0 "Завершити нашу місію"
 nf_maxson.5.d:0 "Андреа балансувала маленьким білим циліндром між пальцями, ліниво крутячи запалену сигарету, поки її погляд був прикутий до мапи внизу. Вона бачила грубо намальоване зображення території Псів Розвішення, перетнуте павутиною стрілок, що показували запланований наступ на Денвер.\n\nЗа останню годину вона переглядала ці плани з десяток разів; і хоча вона оцінила їхню тактичну складність, її розум усе ще був обтяжений сумнівами. Чи спрацює це? Чи можна зробити краще? Чи варте воно того?\n\nВона постійно запитувала себе, але завжди не знаходила відповідей. Ситуація здавалася разюче несправедливою. Андреа не хотіла нести відповідальність ні за що з цього, тим більше, якщо це могло коштувати життів її Братів.\n\nВона зробила довгу затяжку з сигарети, і її тліючий кінчик агресивно спалахнув. Якщо не вона, то хто? Справді, хто? Вона не могла назвати жодного компетентного тактика, який вижив би у Денвері, і не могла просто перекласти цю проблему вниз по ланцюжку командування. Це не міг бути ніхто інший, і ніколи не зміг би. Це не була просто випадковість; саме вона взяла на себе ініціативу; якби вона цього не зробила, Експедиція не вижила б.\n\nТепер тягар влади лежав виключно на її плечах, а успіх місії залежав лише від її ініціативи. Впевненість більше не була розкішшю, а скоріше необхідністю, і коли Брікслі обійняла керівну посаду, вона присягнулася зробити все необхідне, щоб завершити місію.\n\nБудь-що менше просто не годилося."
 nf_maxson.5.a:0 ""Ad Victoriam.""

 nf_maxson.14.t:0 "Суперечка"
 nf_maxson.14.d:0 "На височині, з якої відкривався вид на східні землі Нью-Сіракуз, Андреа дивилася в бінокль. Не те щоб там було на що дивитися, хоча, згідно зі звітами, у Нью-Сіракузах колись була принаймні якась промисловість. Більша її частина не використовувалася протягом двох століть, але це було краще, ніж якби її знищили під час Великої Війни.\n\nОпустивши бінокль і передавши його Лицарю, що стояв поруч, Андреа розвернулася і почала спускатися з пагорба до намету. Відхиливши полог броньованою рукою і увійшовши всередину, вона побачила торговця Дена Ріверса, який схилився над фізичною картою, розкладеною на столі, і Проктора Елріка, який сидів поруч із ним.\n\n"Є якийсь прогрес?" — запитала Андреа в обох. Почувши її запитання, обидва звернули на неї увагу: Ден натягнув свою легку посмішку, а Елрік повільно підвівся, щоб віддати честь з незворушним обличчям.\n\nПроктор заговорив першим: "Чималий. Завдяки зв'язкам містера Ріверса та нашій власній розвідці ми нанесли на карту найважливіші локації та склали план нашого захоплення."\n\nДен додав: "Здебільшого склали план. Я хотів би попросити, щоб ми не переселяли людей зі стейкхаусу в Нью-Сіракузах. Їм там комфортно, і ви мало що виграєте, якщо взагалі виграєте, від їхнього переселення."\n\nЕлрік пирхнув. "Це одна з найбільших будівель у місті, звісно, ми можемо мати з цього зиск."\n\nАндреа зітхнула. "Чому переселити їх — це проблема? Ми вже виділили достатньо людей і ресурсів на відновлення будівель у місті, це ж не означає, що вони залишаться безхатьками, якщо ми їх переселимо."\n\nДен мав просту відповідь."
 nf_maxson.14.a:0 ""Стейковий соус.""

nf_maxson.141.t:0 "Священні пляшки"
 nf_maxson.141.d:0 "«Стейковий соус?» — перепитала Андреа, здивовано піднявши брову всередині шолома.\n\nДен кивнув. «Так, мем. Люди, що живуть у тій будівлі, поклоняються «священним пляшкам», і роблять це вже століттями».\n\nАндреа могла лише дивитися на нього, втративши дар мови. Натомість роздратовано відповів Елрік: «Хіба вони не можуть просто забрати пляшки з собою? Вони можуть облаштувати якийсь вівтар у нових будинках, де житимуть».\n\nДен похитав головою і постукав пальцем по карті. «Я знаю цих людей, Прокторе. Пляшки стоять за склом на підвищеннях, це якась довоєнна вітрина. Зняти їх з теперішніх місць було б для них блюзнірством».\n\nАндреа приклала руку до шолома, обдумуючи ситуацію. Це не було аж такою великою проблемою — стейковий соус, мабуть, був жахливим на смак — але, здавалося, це розлютило Дена, тоді як Елріку, як завжди, було байдуже до інших. Рішення Проктора мало б більшу вагу, ніж слова торговця, але Ден продовжував би сперечатися. Це було б марною тратою часу, і клятий стейковий соус — не те, на чому вона хотіла, щоб ці двоє зациклювалися.\n\nТож вона прийняла рішення за них. Нехай скаржаться їй, а не одне одному."
 nf_maxson.141.a:0 "«Не переселяйте їх, ми знайдемо інший вихід»."
 nf_maxson.141.b:0 "«Переселіть їх, нам потрібне місце»."

 nf_maxson.15.t:0 "Похмура карусель"
 nf_maxson.15.d:0 "Андреа не була впевнена, на що вона дивиться. Начебто це був розвідник Братства, але, судячи зі звітів, він був набагато більшим, ніж просто це.\n\nПід час відступу з Денвера він і ще кілька десятків людей були відрізані рейдерською засідкою і опинилися зовсім в іншому бункері. Це був довоєнний склад пайків трохи південніше форту Лайон, який дивовижним чином майже не постраждав від часу падіння бомб.\n\nТож він і його люди отаборилися всередині, налагодили роботу передавача бункера і подали сигнал SOS, що призвело до їх виявлення рештою Експедиції.\n\nУсе це здавалося досить простим, але з самим чоловіком була низка дивацтв.\n\nПо-перше, його броня була сильно модифікованою версією T-60c замість звичайної T-51b; вона мала патронташі, сумки, якийсь інфрачервоний приціл на шоломі та додаткові кріплення для маскувальної сітки.\n\nПо-друге, він відмовлявся відповідати на всі запити щодо свого справжнього імені, і всі, кого він привів до складу, зізналися, що насправді не знають його. Навіть його голожетони були змінені так, щоб відображати лише його улюблене прізвисько — «Чужинець».\n\nПо-третє, його манера розмови. Він перейняв акцент жителя пустки і всі неформальні мовні звороти, що супроводжували його.\n\nПоки Андреа поринула в роздуми про цього дивного чоловіка, він стояв у все більш незручній позі «струнко». «Потрібно щось ще, міс—»\n\n«Командор-Паладин», — виправила Андреа. У цьому бункері не було жодної «міс Брікслі».\n\n«Вибачте, Командоре-Паладине. Емм... єдина інша проблема — що нам робити з їжею. Її там внизу все ще ціла тонна»."
 nf_maxson.15.a:0 "«Продати місцевим торговцям»."
 nf_maxson.15.b:0 "«Роздати волонтерам»."

 nf_maxson.21.t:0 "Завдання Елріка"
 nf_maxson.21.d:0 "Пробираючись коридорами підземних секцій станції Юніон, Андреа зупинилася перед дверима головної лабораторії Писарів. Натиснувши кнопку доступу і переступивши поріг, вона побачила Елріка, який щось бурмотів собі під ніс, швидко набираючи текст на клавіатурі термінала.\n\n«Працюєте старанніше, ніж я коли-небудь бачила, Прокторе», — сказала Андреа, щоб привернути його увагу. Це спрацювало — він ледь не вистрибнув із крісла, швидко підвівшись, щоб віддати честь.\n\n«Палад— тобто Старійшино, вибачте, я не бачив, як ви увійшли!» — випалив Елрік. Андреа здивовано підняла брову. Це було найшвидше, як вона коли-небудь бачила, щоб літній чоловік рухався.\n\nШвидким жестом відхиливши його вітання, Андреа посміхнулася. «Я тут не для того, щоб робити вам догану, Прокторе, а лише щоб перевірити, над яким проєктом ви зараз працюєте. Нарешті ви отримали доступ до величезних секретів Денвера. Я знаю, що це те, чого ви чекали відколи ми покинули Лост-Гіллз».\n\nЕлрік швидко кивнув, жестом запрошуючи її підійти до його боку термінала. «Так, це була причина, через яку я приєднався до експедиції. Я—» Проктор трохи відвів погляд, перш ніж продовжити. «— Я перепрошую за свою попередню поведінку, Старійшино. Чесно кажучи, я не вірив, що ми досягнемо багато після нашого відступу так давно і того, як цей мандрівник пішов».\n\nАндреа кивнула, її посмішка трохи згасла перед тим, як відповісти. «Жертви Братів, які дали нам цю можливість, мають бути вшановані. А тепер давайте подивимося, над чим ви працюєте, гаразд?»"
 nf_maxson.21.a:0 "Це була карта."

 nf_maxson.211.t:0 "Місцезнаходження WARDEN"
 nf_maxson.211.d:0 "«Карта? Усіх об'єктів, які використовував ШІ WARDEN?» — запитала Андреа, вивчаючи інформацію на екрані термінала. Це дійсно виглядало саме так, з кількома яскравими точками, виділеними по всьому місту.\n\nЕлрік кивнув, його голос був сповнений хвилювання. «Так! Об'єкти, які ми знайшли, всі вказують на центральне місцезнаходження. Мені потрібно відвідати ці три зокрема—» Його палець торкнувся точок на екрані. «— Об'єкт B, Об'єкт C та Об'єкт D, щоб знайти те, що, за моєю гіпотезою, буде «Об'єктом A», де насправді розміщено WARDEN».\n\nАндреа на мить обдумала його слова, перш ніж відповісти. «Чого ви сподіваєтеся досягти, знайшовши WARDEN? Ці довоєнні ШІ зазвичай небезпечні, Прокторе, і до них не можна ставитися легковажно».\n\nНа обличчі Елріка з'явилася втомлена посмішка, перш ніж він заговорив із впевненістю: «Я буду дуже обережним, Старійшино. Я не чекав так довго, щоб усе зіпсувати тут і зараз».\n\nАндреа вивчила обличчя свого підлеглого. Він здавався майже новою людиною після того повороту долі, який він пережив. Їм усім дали другий шанс, поки вони відбудовувалися, щоб зробити те, заради чого вони пройшли весь цей шлях так давно. Кілька разів поплескавши чоловіка по плечу, Андреа випросталася на повен зріст. «Дуже добре, Прокторе Елрік. Сподіваюся незабаром почути про ваш успіх».\n\nТупотячи броньованими черевиками до дверей, вона на мить озирнулася на Елріка і побачила, що він знову повністю зосереджений на наборі тексту на своєму терміналі. Здивовано похитавши головою, вона переступила через поріг, зачинивши за собою двері."
 nf_maxson.211.a:0 "Їм усім була потрібна ця перемога."

 nf_maxson.22.t:0 "Меморіал"
 nf_maxson.22.d:0 "Андреа поклала руку на вигравіювану металеву табличку. Перші з них прибули з Бункера Мексона вчора за її наказом, щоб записати імена всіх Братів, які впали на станції Юніон. Загалом їх буде три, розміщені над внутрішніми дверима термінала.\n\nВсередині своєї T-51b Андреа могла лише дивитися, як її пальці ковзають списком і зупиняються на кількох обраних іменах. Вона знала, що це не зробить пам'ять про них менш болючою, але могла знайти розраду в тому, що вони не будуть забуті. Було б неправильно забути.\n\n«Старійшино?» — пролунав голос поруч із нею. Обернувшись, вона побачила Лицаря Кріса зліва від себе.\n\n«Що таке, Лицарю?» — запитала Андреа.\n\nШвидко віддавши честь, Лицар Кріс промовив: «Ден Ріверс на платформах, Старійшино. Він хоче поговорити з вами».\n\nАндреа кивнула. «Дякую, Лицарю. Вільні». Прямуючи до дверей, що вели з термінала, і штовхнувши їх, вона побачила Дена на іншому кінці залізничного депо. Щойно він зустрівся з нею поглядом, почав махати їй рукою. Андреа не могла не запитати себе, що він вигадав цього разу, пробираючись усе ще пошкодженими секціями станції Юніон."
 nf_maxson.22.a:0 "Чи втримає це місто на плаву?"

 nf_maxson.221.t:0 "Новий Денвер"
 nf_maxson.221.d:0 "«Повільніше, Дене», — вимагала Андреа від торговця. Щойно вона підійшла на відстань чутності, Ріверс заговорив так, наче він був більше машиною, ніж людиною; за останню хвилину він лише раз зробив вдих, пояснюючи всі свої проєкти з «Омолодження».\n\n«Вибачте, але ще стільки всього треба зробити!» — сказав Ден, посміхаючись ще ширше. Потягнувшись униз і діставши флягу з кишені жилета, він зробив ковток, перш ніж продовжити: «Денвер у руках ваших людей — це хороший початок, але тепер вам потрібно зробити його своїм, не просто правити цією купою брухту, а зробити його чимось вартим того, щоб утримувати його не лише заради металобрухту».\n\nАндреа підняла руку. «Я розумію, що у вас є плани, але я не можу дозволити, щоб будь-який брухт просто забирав кожен, хто його знайде. Ми — Братство Сталі. Ми захищаємо людство від небезпек технологій».\n\nДен відмахнувся флягою: «Так-так, я знаю, з ким маю справу. Я говорю не про це. Як я вже казав, це місто має знову стати містом, а не просто звалищем брухту, за яке всі б'ються. Ви і ваші люди можете це зробити, у вас є ноу-хау. Як знову запустити заводи, зробити вулиці безпечними, як підтримувати світло. Вам не потрібні сміттярі та рейдери, що порпаються в руїнах, вам потрібні робочі місця, де зможуть працювати місцеві жителі». Андреа хотіла щось відповісти, але не встигла: Ден спрямував на неї майже звинувачувальний палець. «Ви хочете, щоб Братство тут залишилося надовго? Вам потрібна сильна столиця, вам потрібно, щоб люди хотіли вашої присутності. Дайте їм це місто, цю стабільність, і ви станете незрушними». Вказівний палець перетворився на кулак, який він високо підняв. «Денвер стане «Перлиною Колорадо», відомою по всій пустці!... разом із могутністю Братства Сталі»."
 nf_maxson.221.a:0 "Андреа обмірковувала його пропозицію."

 nf_maxson.222.t:0 "Представництво цивільних"
 nf_maxson.222.d:0 "Вона почекала кілька митей, щоб подивитися, чи Ден не скаже щось іще, але, здавалося, у нього нарешті закінчилися слова. «Я розумію вашу точку зору, містере Ріверс», — сказала Андреа. «У нас уже є плани з відновлення певних районів міста для наших власних потреб, але я вважаю, що те, що ви пропонуєте, виходить за межі наших можливостей».\n\nДен зітхнув і опустив кулак. «Я знаю, я не очікую, що це станеться в найближчі кілька років, це може зайняти десятиліття». Він зробив ще один ковток із фляги. «Але це те, чого можна досягти за належних зусиль, і я готовий працювати заради цього, якщо ви приймете мене. Братство може залишити собі всі химерні технології, якщо ви зможете зберегти безпеку в Колорадо. Не ховайтеся від світу і допоможіть місцевим людям».\n\nУсередині шолома Андреа мить обмірковувала його слова, перш ніж покласти руку Дену на плече. «Дуже добре, Дене. Ви вже допомагали раніше, і я вірю, що будете допомагати й надалі. Гадаю, ваш внесок знадобиться в найближчі місяці та роки».\n\nПосмішка торговця стала ще ширшою, він на мить склав пальці у вигляді пістолетів. Потім, ніби отямившись, Ден віддав честь як міг."
 nf_maxson.222.a:0 "«Втримаю вас на плаву, як і обіцяв»."

 nf_maxson.23.t:0 "Підготовка до підвищення"
 nf_maxson.23.d:0 "Повернення найвищих чинів Експедиції до Бункера Мексона зайняло деякий час, але Андреа знала, що це необхідно. Її титул «Старійшини» був майже офіційно підтверджений, звісно. Після перемоги над Псами Розвішення ніхто з її Братів не сумнівався в її здатності керувати.\n\n«Я мала рацію...» — роздумувала Андреа про себе. Усі її плани та стратегії були виправдані. Це точно не було легко, але вони перемогли.\n\nСтоячи у своїй кімнаті і розглядаючи себе в дзеркалі, вона відчувала себе дивно без своєї Силової Броні. Броня була постійною величиною в її житті з моменту відступу з Денвера; без додаткового зросту її сприйняття здавалося дивним.\n\nРозправивши плечі й розгладивши кілька складок на своїй новій офіційній мантії, Андреа вдивлялася у відображення. За короткий час їй принаймні вдалося роздобути вбрання, що личило Старійшині Братства. Воно сиділо на ній досить добре, жінка перед нею виглядала відповідно. А от вік на її обличчі з моменту від'їзду з Каліфорнії — не дуже.\n\nЗаправивши сиве пасмо за вухо, Андреа кивнула сама собі. Вона була готова."
 nf_maxson.23.a:0 "Церемонія"

 nf_maxson.231.t:0 "Старійшина Брікслі"
 nf_maxson.231.d:0 "«Для мене велика честь прийняти роль Старійшини», — оголосила Андреа зібраним Братам перед нею. Церемонія проходила в кімнаті, зазвичай відведеній для стратегічних нарад.\n\n«Я обіцяю керувати цим новоствореним Відділенням з усією своєю силою та мудрістю. Я не дозволю трагедіям минулого визначати нас. Наші перемоги довели це. Колорадо відтепер і назавжди пізнає могутність Братства!» — Андреа високо підняла кулак у повітря, завершуючи кульмінацію. Це не була традиційна промова вступу на посаду Старійшини, але реакція була миттєвою. Зібрані Брати високо підняли кулаки у відповідь, вітаючи її слова схвальними вигуками.\n\nАндреа відчувала, як на її обличчі формується посмішка, а гордість переповнює груди. Вони їй довіряли. Вона не могла б просити кращих Братів, щоб ними керувати.\n\nУ кінці кімнати відчинилися одні з вхідних дверей, і всередину ввалився Лицар. «Старійшино!» — вигукнув він, ледь чутно крізь святкові крики.\n\nПіднявши руку, щоб закликати до тиші, Андреа поманила Лицаря вперед із натовпу."
 nf_maxson.231.a:0 "«Доповідайте, Лицарю»."

 nf_maxson.232.t:0 "Монстр із Півдня"
 nf_maxson.232.d:0 "«Коли перша команда не вийшла на зв'язок, ми припустили, що в них проблеми. Чужинець узяв команду і вирушив на південь, щоб з'ясувати, що сталося». Лицар намагався триматися, але голос видавав його стурбованість.\n\nАндреа наказала всім, крім найстарших Братів, звільнити приміщення, поклавши руки з обох боків карти, яку вони дістали, щоб краще візуалізувати розповідь. «Саме тоді вони зіткнулися з цією силою?» — запитала вона, постукавши по карті.\n\n«Так, Старійшино. Чужинець каже, що ще не бачив сил дикунів, які б так діяли. Добре організовані, у великій кількості, всі в однаковій броні. Він описав це як армію... а не якусь рейдерську групу».\n\nАндреа випросталася і приклала руку до підборіддя. Ще один претендент на панування в Колорадо, так скоро після Псів Розвішення. Вони не мали часу закріпити свої позиції, але й вибору в них не було. Вона поглянула на зібраних Паладинів та Лицарів і прийняла рішення.\n\n«Хай буде так. Ми зустрінемо цю загрозу з усією нашою силою. Відправте цих варварів назад у їхні халупи і покажіть їм, що це наша земля. Ad Victoriam!» — проголосила Андреа. Відповідь не забарилася."
 nf_maxson.232.a:0 "«AD VICTORIAM!»"

 nf_maxson.24.t:0 "Денверська станція Юніон"
 nf_maxson.24.d:0 "«Увага всім, ми майже на місці», — оголосила Андреа своїм Братам. Вона вела загін назад до місця найбільшої невдачі Експедиції і не була впевнена, чого очікувати.\n\nКоли вони вперше прибули до міста, Денверська станція Юніон здавалася ідеальним місцем для їхнього облаштування. Довоєнні бомбосховища під головною будівлею для безпеки і центральне розташування з легким доступом до решти міста робили її очевидним вибором. Вона також була ідеальною пасткою. Коли Пси Розвішення нарешті розкрили себе в повну силу, вони хлинули з усіх боків одночасно. Навіть коли Пси Розвішення були розбиті, а місто очищалося від цих виродків, Андреа не могла не стиснути міцніше гвинтівку, коли по її спині пробіг холод, який ставав дедалі болючішим.\n\nВодячи дулом лазерної гвинтівки з боку в бік, коли вони вийшли на платформи, вона почула явні зітхання і не одне прокляття, що лунали з динаміків шоломів тих, хто йшов позаду неї. Це місце навіювало погані спогади; на жаль, за 20 років, що минули відтоді, не було достатньо нових рекрутів. Тому Андреа зібралася з духом і віддала накази: «Зосередьтеся, ми ще не зачистили територію». Її голос залишався рівним і спокійним, але всередині вона палала від гніву."
 nf_maxson.24.a:0 "Чи будуть там досі тіла?"

 nf_maxson.241.t:0 "Денверська станція Юніон — Платформи"
 nf_maxson.241.d:0 "Пси Розвішення атакували масово. Спочатку була хвиля динаміту, за якою послідувала масована атака за підтримки їхніх псів. Андреа пощастило бути у своїй броні всередині самої станції, коли почалася атака, але Брати, що знаходилися на відкритих платформах, були дезорієнтовані та пригнічені ще до того, як їх розірвали на шматки. У деяких випадках буквально: масивні пси валили чоловіків і жінок у броні на землю, поки дикуни робили свою справу, розколюючи панцирі та забиваючи нову загрозу їхньому пануванню в місті.\n\nРозкидане по пошрамованих боями платформах видовище жахало всю Експедицію. Тіла полеглих залишили тут гнити, декого собаки обгризли до кісток. Андреа бачила щонайменше дві дюжини фігур лише в іржавій T-51b. Деякі трупи були заблоковані під уламками станції, що впали на них, а решта були підперті в різних позах — сидячи або стоячи.\n\nНа їхній броні десятиліття тому були надряпані символи Псів Розвішення, виючі люди та собаки — грубо намальовані, але впізнавані. Це був знак для всіх, хто проходив тут, вирішила Андреа, що це їхніх рук справа. Її зуби стиснулися, лють досягла піку.\n\nВона не була впевнена, чи знайдуть вони тут своїх полеглих Братів, чи їм доведеться прочісувати місто в пошуках їхніх голожетонів. Тепер було абсолютно ясно, що другий варіант був би кращим за це видовище.\n\n«Зберіть їх. Усіх. Зішкрябайте ці кляті малюнки з їхньої броні і спробуйте опізнати. Третій загін зі мною, ми заходимо на станцію». Накази Андреа були чіткими, коли вона важко покрокувала до входу станції Юніон. Якщо раніше і були якісь сумніви, це все вирішило. У Колорадо не залишиться жодного сліду Псів Розвішення, коли вони його захоплять. Вона не дозволить їм уникнути покарання — не після цього."
 nf_maxson.241.a:0 "Дні племені були полічені."

 nf_maxson.242.t:0 "Денверська станція Юніон — Всередині станції"
 nf_maxson.242.d:0 "Величні та багато прикрашені двері станції були в поганому стані, коли Експедиція прибула сюди десятиліття тому, і вони недовго стримували Псів Розвішення. Переступаючи через завалений уламками вхід, Андреа обвела гвинтівкою внутрішній простір, загін рухався за нею. Згадувалося все: паніка, коли почалися вибухи, поспіх, щоб приєднатися до бою на вулиці, шокуюча швидкість дикунів, які дісталися входів і вікон будівлі раніше, ніж більшість членів Братства встигли відреагувати.\n\nАндреа щойно встигла зняти гвинтівку з плеча, коли всередину станції полетів ще один залп динаміту. Не надто смертельно для Силової Броні, але тих, хто не мав цього захисного панцира, розірвало на шматки. Закликаючи Братів навколо відкрити вогонь у відповідь, вона просувалася вперед, використовуючи масу своєї T-51b, щоб прикрити тих, хто був позаду неї.\n\nАндреа перервала свої спогади, щоб присісти; на підлозі лежала розряджена мікроядерна батарея. Попри всю вогневу міць, яку вони могли застосувати, навіть будучи неорганізованими, цього було недостатньо. Брати навколо неї відкрили вогонь з усього, що мали: лазерної, плазмової зброї, навіть кидали і запускали вибухівку.\n\nАле чиста лють узяла гору над ними, поки Андреа та інші в броні намагалися захистити поранених. І все ж виючі рейдери разом зі своїми псами прорвалися на станцію. Відчайдушна оборона за кілька митей шаленої стрілянини перетворилася на рукопашну бійку."
 nf_maxson.242.a:0 "Бійку, яку вони програли."

nf_maxson.243.t:0 "Денверська станція Юніон — Відступ"
 nf_maxson.243.d:0 "Дивлячись на мікроядерну батарею, Андреа майже бачила перед очима спалахи того бою. Писаря позад неї, Натана, зачепило шрапнеллю під час першого ж залпу. Зброя Андреа залишилася без набоїв, але коли вона витягувала розряджену батарею, на неї накинулися четверо чоловіків, намагаючись повалити її своєю вагою та інерцією. Лазерну гвинтівку вибили з її рук, вона ледве втрималася на ногах.\n\nУ гніві закричавши, вона вдарила першого в його верескливе обличчя: броньована рукавиця врізалася йому в рот, зламавши щелепу і відкинувши його вбік. Штовхаючи та відбиваючись від трьох інших, вона почула, навіть крізь гуркіт бою навколо, крики Натана. Ще одним поштовхом, який змусив нападників відхитнутися, вона озирнулася на писаря на землі. Один із псів схопив його за горло, поки той намагався відбитися. Потім із гучним нудотним хрускотом його шия зламалася. З адреналіном, що пульсував у тілі, вона відкинула пса ногою, змусивши його відлетіти зі скавучанням. Навколо неї крики битви, поранених і вмираючих заглушали все.\n\nУсі, крім одного голосу. Старійшина Кемерон, використовуючи динаміки свого костюма, вигукнув наказ, від якого гаряча кров Андреа похолола: «ВІДСТУП!» Ті, хто міг, почали прориватися за своїм лідером зі станції, стріляючи, рубаючи, б'ючи кулаками й ногами, роблячи все можливе, щоб прокласти собі шлях.\n\nАндреа похитала головою, прояснюючи думки. Розтиснувши руку, вона зрозуміла, що в якийсь момент кинула гвинтівку, щоб стиснути мікроядерну батарею. Вона розчавила її зовнішній корпус; тепер вона навіть не підлягала переробці. Тож Андреа кинула її на підлогу, там, де залишила понад 20 років тому.\n\nВони помстилися за всіх, кого втратили. Це знову стане їхньою головною базою в Денвері, щоб гарантувати, що всі вони загинули не дарма. Її план спрацював. Тепер вона мала вести своїх Братів до завершення їхньої початкової місії."
 nf_maxson.243.a:0 "Вона стояла рівно, ігноруючи біль у колінах."

 nf_maxson.10.t:0 "Похмура карусель"
 nf_maxson.10.d:0 "Андреа не була впевнена, на що вона дивиться. Начебто це був розвідник Братства, але, судячи зі звітів, він був набагато більшим, ніж просто це.\n\nПід час відступу з Денвера він і ще кілька десятків людей були відрізані рейдерською засідкою. Після деякого часу блукань на південний схід вони натрапили на бункер, але не на той самий (і Андреа не могла не задатися питанням, чи не був до цього причетний В'язень). Це був довоєнний склад пайків трохи південніше форту Лайон, який дивовижним чином майже не постраждав від часу падіння бомб.\n\nВін і його люди облаштували всередині базу, налагодили роботу передавача бункера і подали сигнал SOS, що призвело до їх виявлення рештою Експедиції.\n\nУсе це здавалося досить простим, але з самим чоловіком була низка дивацтв.\n\nПо-перше, він носив сильно модифіковану T-60c; вона мала патронташі, сумки, якийсь інфрачервоний приціл на шоломі та додаткові кріплення для маскувальної сітки. По-друге, він відмовлявся відповідати на всі запити щодо свого справжнього імені. Усі, кого він привів до складу, зізналися, що насправді не знають його. Навіть його голожетони були змінені так, щоб відображати лише його улюблене прізвисько — «Чужинець».\n\nПо-третє, його манера розмови. Він перейняв акцент жителя пустки і всі неформальні мовні звороти, що супроводжували його, можливо, через велику кількість жителів пустки та колишніх дикунів, яких він завербував за ці роки.\n\nПоки Андреа поринула в роздуми про цього чоловіка, він стояв у все більш незручній позі «струнко». «Потрібно щось ще, міс—»\n\n«Командор-Паладин», — виправила вона. У цьому бункері не було жодної «міс Брікслі».\n\n«Вибачте, Командоре-Паладине. Емм... єдина інша проблема — що нам робити з їжею. Її там внизу ціла тонна»."
 nf_maxson.10.a:0 "«Продати місцевим торговцям»."
 nf_maxson.10.b:0 "«Роздати волонтерам»."

 nf_maxson.16.t:0 "Скарбниця Докі"
 nf_maxson.16.d:0 "Місто Роботів. Вторгнення до пам'ятника роботизованої дружби пройшло краще, ніж очікувалося. Здебільшого покинуте сусідами в спокої, Місто було погано підготовлене до тривалого конфлікту з цілеспрямованою військовою силою.\n\nУ процесі роботи були майже систематично розбиті, знищені або деактивовані, деякі з них були перепрограмовані на виконання робочих завдань, тоді як інші переобладнані для таких завдань, як підтримка на полі бою та логістика. Потрібен буде час, щоб визначити, чи зможе хоч хтось повернутися до бойових ролей.\n\nПроходячи залами покоїв Докі, Андреа відчула докір сумління. Різноманітні роботизовані шасі, що безживно тулилися до стін, мали написані на них імена або барвисті, майже художні зображення квітів, сердечок. На одному фіолетовому штурмотроні навіть була зображена сама Докі.\n\nЗ одного боку, все це могло бути просто наслідком збою в програмуванні через вплив нестабільного Штучного Інтелекту. З іншого боку, вони могли бути настільки близькими до людей, наскільки на це здатні бляшанки. Це була тривожна думка, але Андреа приділила їй мало уваги. Наслідки були надто тривожними.\n\nКоли Брікслі увійшла до покоїв Докі, вона побачила Проктора Елріка, який схилився над терміналом, де раніше розміщувався (а нині втікший) ШІ."
 nf_maxson.16.a:0 "«Вітаю, Прокторе»."

 nf_maxson.161.t:0 "Людина науки"
 nf_maxson.161.d:0 "Проктор Джордж Елрік був писарем, якого відправили з експедицією з метою класифікації, сортування та вивчення багатства технологій, розташованих у Денвері. Оскільки місія в Денвері зазнала повного краху, протягом років відновлення він був понижений до ролі інтенданта Відділення; це була роль, яка йому не подобалася, і він часто був або дратівливим, або розсіяним, або розсіяно-дратівливим. Дехто стверджував, що це сталося через те, що він облисів після поразки на станції Юніон, і на даний момент на його голові не залишилося жодної волосини.\n\nПроте, коли він зосередився на темно-червоному світінні термінала Докі, Андреа відчула нотку... щастя. Це була його перша можливість вивчити щось складніше за лазерний пістолет, і він вивчав це з головою. Він ледь помітив, як увійшла Андреа, доки вона не прочистила горло; тоді він випростався, відкашлявся і вказав на термінал, потираючи бороду вільною рукою.\n\n«Доброго ранку, Командоре-Паладине. Цей... термінал неймовірно унікальний. Його модифікували безліч разів, особливо в частині оперативної пам'яті та процесора. Ми могли б використовувати його для обчислень, пов'язаних із дослідженнями або виробництвом, але є одна проблема».\n\n«Яка саме, Прокторе?» — запитала Андреа.\n\nЕлрік трохи повів плечима і похмуро зітхнув. «Щось у тому маленькому ШІ було важливим для того, як він працює. Тепер, коли її немає, я не думаю, що цей комп'ютер довго протягне. Незабаром він перегріється і перетвориться на мотлох». Здавалося, вони опинилися в глухому куті. Що робити з цим маленьким терміналом, подумала Андреа, поки не стало надто пізно?"
 nf_maxson.161.a:0 "«Віддати його Писарям»."
 nf_maxson.161.b:0 "«Віддати його Лицарям»."

 nf_maxson.17.t:0 "Нові обличчя, нові рекрути"
 nf_maxson.17.d:0 "Перед Андреа стояли шеренги жителів пустки по стійці струнко. Кожен із них був одягнений у розвідувальну броню, призначену для Послушників, і кожен із них крадькома позирав на її броню, коли випадала нагода.\n\nАндреа вдавала, що не помічає цього. Мовчки пройшовшись туди-сюди перед ними вже двічі, вона нарешті зупинилася по центру, стоячи на повному виду у шеренг Послушників. Динамік її шолома затріщав, коли вона звернулася до них: «Я — Андреа Брікслі. Відтепер ви звертатиметеся до мене «Командор-Паладин». Це зрозуміло?»\n\nВідповідь Послушників була бурхливою і миттєвою: «Так, Командоре-Паладине!»\n\nАндреа дозволила витримати коротку паузу, а потім продовжила. Це була рутина, яку вона постійно чула в юності, і вона знову спрацює. «Ви всі — сміття! Мерзенний непотріб із пустки, одягнений у броню, яка набагато краща, ніж ви заслуговуєте!» Вона знову зробила паузу для ефекту. «Але ми це виправимо! Вас розіб'ють на дрібні шматочки і зберуть у щось велике! У Лицарів, Паладинів, Розвідників, у справжніх холоднокровних, чорт забирай, убивць! Не всі з вас виживуть, але ті, хто впорається, приєднаються до Братства, яке є величнішим за все, частиною чого ви коли-небудь були! Я зрозуміло висловлююсь?!»"
 nf_maxson.17.a:0 "«Так, Командоре-Паладине!»"

 nf_maxson.18.t:0 "Аномальна наука"
 nf_maxson.18.d:0 "Беггери. Строката команда сміттярів, поселенців та вчених, відправлених у північне Колорадо для забезпечення технологій та вивчення невловимого Купола Боулдера. Після недавнього завоювання Відділенням, метою Елріка було інтегрувати найкраще з того, що могли запропонувати Беггери, особливо у сфері вчених. Сьогодні Андреа та шановний Проктор проводили співбесіди з дослідниками Беггерів щодо їхніх поточних проєктів, намагаючись визначити, які напрямки варто зберегти, а які — відкинути. Це було особливо дратівливим для Андреа, яка не надто розумілася на наукових пошуках, що не застосовувалися на полі бою, але Елрік, здавалося, насолоджувався повним контролем над їхніми відкриттями.\n\nПерша кандидат на сьогодні виявилася найменш вражаючою; Джейні Бедсолл, дослідниця тварин, представила свої експерименти з вивчення ієрархій Яо-Гуаїв, які нібито мешкають у північному Колорадо. Швидко з'ясувалося, що в Колорадо не водиться жодних Яо-Гуаїв, і це була давня схема для отримання та нецільового використання фінансування на дослідження. Її попросили піти і ніколи не повертатися.\n\nДругим був Пітер Бейлсліфт, дослідник, який намагався стати першопрохідцем у галузі роботизованого протезування. Самі протези були вражаючими, але реактори, закріплені на рюкзаках і необхідні для їхньої роботи, були не лише важкими, а й схильними викликати рак. Його попросили згорнути проєкт і допомогти з виробництвом зброї.\n\nЗалишився Вульф Кемпор, медичний дослідник, який (на здивування Андреа та Елріка) придумав дещо вельми корисне. Хімічний коктейль, який міг підвищити бадьорість дослідників і змусити їх працювати в лабораторіях набагато довше, ніж це коли-небудь могли зробити Ментати. Деякі з побічних ефектів могли включати легку залежність від кофеїну, схожу на ефект від Ядер-Коли, але каву полюблять усі."
 nf_maxson.18.a:0 "«Ласкаво просимо на борт, Писарю Кемпор»."

 nf_maxson.19.t:0 "Міжвійськові навчання!"
 nf_maxson.19.d:0 "Війна — це таке ж застосування набутих навичок, як і будь-що інше. Але як у мирний час навчитися військовій справі? Відповіддю були військові навчання, як з'ясували ще за століття до війни.\n\nНещодавній альянс, укладений між Експедицією та Хором, означав, що необхідно буде владнати деякі нюанси загальновійськового бою, зокрема інтеграцію цілителів-псайкерів, розвідників і тому подібних, на яких покладалися Паладини та Лицарі, що досі залишалися консервативними у своїх доктринах.\n\nДень почався важко із суперечки між цілителем і писарем через Мед-Х. Цілитель Хору наполягав на тому, що такий препарат небезпечний, якщо вживати його надто часто, і що спершу слід покладатися на трав'яні засоби, тоді як писар переконував, що він не може бути шкідливим, якщо від нього так добре. Суперечка закінчилася тим, що стрільці з обох боків розтягнули їх і розвели по різних робочих місцях. Протягом дня виникали й інші, менш гучні інциденти, але більшість із них своєчасно вирішувалася. Здавалося, обидві групи дійсно хотіли працювати одна з одною, що дуже порадувало Андреа.\n\nНавчання завершилися майстерно виконаним наступом, який повністю зім'яв команду, що грала роль захисників, і змусив їх до повної втечі. Потім настав час кухарям Хору подавати вечерю."
 nf_maxson.19.a:0 "Це було краще за сухпайок."

 nf_maxson.20.t:0 "Земні насолоди"
 nf_maxson.20.d:0 "Кампанія в польових умовах несе з собою низку логістичних потреб, не останньою з яких, подумала Андреа, була їжа. Армія марширує на своєму шлунку, і з порожнім далеко не зайдеш.\n\nЗазвичай Паладини Експедиції Мексона були добре забезпечені продуктами тривалого зберігання з території на південь від форту Лайон, військовими пайками та різноманітною калорійною провізією. Але коли вони закінчаться? Що, якщо загін буде відрізаний від дружнього постачання?\n\nНа щастя, Хор запропонував Дон (псайкера, добре налаштованого на природу) для перехресного навчання. Навички, такі як збиральництво, виживання та траволікування, дозволять цьому загону жити за рахунок природи. Навчання охоплювало основи пошуку їстівних ягід, як знаходити багатих на білок комах, а також викопування коріння, яке можна було з'їсти вареним або заварити як чай. Вона, правду кажучи, поводилася боязко, навчаючи групу розміром з батальйон, але з часом їй стало комфортніше — і навіть дружніше — в оточенні суворих Лицарів.\n\nДень закінчився на гумористичній ноті: Дон вибила отруйну ягоду з рук одного зі старших Паладинів, викликавши кілька смішків у його товаришів."
 nf_maxson.20.a:0 "«Вам варто їсти гриби замість цього», — сказала Дон."

 #Подія війни з Ланієм#

 nf_maxson_lanius.1.t:0 "Знову в бій"
 nf_maxson_lanius.1.d:0 "Андреа знову відчула, як у ній піднімається сумнів, коли вона влазила у свою броню. Закріплюючи рукавиці та вкотре перевіряючи герметичність костюма T-51b, до якого вона так звикла, її думки мчали з шаленою швидкістю.\n\nЦе буде їхнім найбільшим випробуванням, і вона знала, що все залежить від її рішень та стратегії. Найближчі тижні й місяці вирішать долю Колорадо, її Братів і ще багатьох інших.\n\nВзявши шолом руками в рукавицях, вона зловила себе на тому, що вдивляється у візор, який дивився на неї у відповідь; візор людини, яка робила це настільки часто, що знос ставав очевидним. Зціпивши щелепи і надягнувши шолом на голову, вона подумала про себе.\n\nВона мала рацію. Вона проведе їх через це. «Ланій» не стане їхнім кінцем. Закріпивши шолом на місці, вона обернулася до дверей своєї каюти, знявши гвинтівку та спорядження з настінного кріплення. Вперед на війну, вперед до перемоги."
 nf_maxson_lanius.1.a:0 "Вона не могла зазнати невдачі."

 nf_maxson_lanius.2.t:0 "Кінець легенди I"
 nf_maxson_lanius.2.d:0 "Вогонь, крики та пил. Війна і битва були багато чим, але коли Андреа перезаряджала гвинтівку поруч із Гленном біля напівзруйнованої стіни, вона знала, що кінець близький. І ось вона тут, полює на Монстра з Гленном і загоном готових до бою Паладинів, тоді як решта Загону «Хаос» охороняла останні переправи через Ріо-Гранде. За помахом її руки всі вони рушили до напівзруйнованого паркінгу, прагнучи покінчити з Легатом Ланієм.\n\nПерший поверх був порожнім, а підвальні рівні — заваленими. Залишилося лише по половині другого і третього поверхів, а також одна сходова клітка, настільки вузька, що пропускала лише одну людину в броні, тобто двох легіонерів. Це був дивний тактичний вибір, подумала Андреа — навіщо Монстру Сходу заганяти себе сюди в пастку? Певно, це були помилкові розвіддані чи відволікаючий маневр, щоб він міг втекти — але в чому полягав його задум?\n\nПотім пролунали вибухи. Андреа відчула, як її відкидає на спину; Силова Броня зберегла її тіло неушкодженим. Натомість її розум працював на автоматі, проходячи ментальний список дій. Спочатку вона зорієнтувалася, повернувши голову. У розбомблених залишках будівлі, яку вона зачистила всього півгодини тому, були помічені два Центуріони Легіону; їхні плюмажі та труби швидко перезаряджуваних ракетниць заважали їм. Краєм ока вона побачила принаймні одного мертвого Паладина, його T-51b була розколота, як яйце. Брікслі стрималася від лайки—\n\n«В УКРИТТЯ І ВІДКРИТИ ВОГОНЬ У ВІДПОВІДЬ!» — вигукнула Андреа. Як тільки вони опиняться в безпеці, то зможуть краще проаналізувати ситуацію і діяти. Вона підвелася, випроставшись одним швидким рухом, підхопивши гвинтівку по дорозі.\n\nКоли вона дісталася укриття, було вже надто пізно. Не від ракет — для них укриття було достатньо. Ні, це була електромагнітна міна, на яку вона наступила, підключена до кількох міні-ядерних зарядів.\nЗаманити наживкою, а потім закрити пастку. Деталі змінювалися, але коли перед очима Брікслі все побіліло, хід думок був тим самим."
 nf_maxson_lanius.2.a:0 "Монстр Сходу перехитрив її."

 nf_maxson_lanius.3.t:0 "Кінець легенди II"
 nf_maxson_lanius.3.d:0 "Вона не була мертвою. Біль нагадував про це. Але її зору знадобилося надто багато часу, щоб прояснитися. Слух повернувся першим, системи її костюма мовчали через імпульс. Частина її відчувала себе легше — задня половина її броні була відірвана, що врятувало їй життя, але тепер означало, що їй доведеться виповзати. Ось чому бойова броня була важливою, подумала вона, виповзаючи і орієнтуючись на дотик. Нарешті вона вибралася, і її зір прояснився, коли вона підвелася. І вона відразу ж побігла назустріч небезпеці, тримаючи Різник напоготові.\n\nЗрештою, Гленн протистояв Ланію. Його шолом був знесений, а обличчя скривавлене, але екзоскелет все ще функціонував, даючи йому перевагу над високим броньованим воїном. Ланій наносив удар своїм клинком, а Гленн відбивав його броньованою рукою. Він робив випад, а Ланій відбивав його плазом свого клинка. Наскільки їй було відомо, більше нікого навколо не було; це була дуель, і ставки були занадто високими.\n\nДосі вона мовчала, але коли Різник завівся, Брікслі нарешті видала бойовий клич, щоб виплеснути частину болю, замахуючись на шию Ланія. Тоді Монстр Сходу випростався, і на мить почувся звук Різника, що прорубувався крізь метал. Він ударив задньою ногою, змусивши Андреа відхилитися вбік. Ланій також розвернувся, маючи змогу протистояти обом.\n\n«Здавайся або помри», — заявила Андреа.\n\n«Ні», — відповів Ланій, широко розмахнувшись мечем, намагаючись зачепити принаймні одного з них. Андреа пригнулася, а Гленн парирував удар рукою, його Силова Броня поглинула удар. Невдовзі це перетворилося на хитромудрий танець, де Андреа робила замах, а Гленн відповідав ще одним ударом, намагаючись нарешті пробити його захист. Ланій рухався з грацією, невластивою його розмірам, завжди примудряючись зробити ще одну спробу. Тим не менш, парирування та промахи тривали, ніхто не міг закріпити успіх. Андреа починала дратуватися. Як і Гленн. Обміни ударами тривали, ніхто не міг завдати вирішального удару, всі чекали на єдиний шанс, щоб переломити хід бою.\n\nАж ось, нарешті, удар. Андреа занадто витягнула руку, а Ланій, який вже стояв під кутом, щоб уникнути удару Гленна в пах, був напоготові зі своїм клинком. Він глибоко врізався, і Андреа голосно скрикнула.\n\nЦього було достатньо для Гленна, який нарешті припав на коліна рівно настільки, поки Ланій був зосереджений на тому, щоб розрізати Андреа. З криком він повалив Монстра Сходу на землю. Обидва чоловіки кректнули, і Андреа не могла не дозволити собі трохи потішитися, кидаючись уперед, готова перерубати шию Монстра навпіл.\nЗнову запізно, вона усвідомила, що Ланій встромив щось у броню Гленна."
 nf_maxson_lanius.3.a:0 "«ГЛЕННЕ!»"

nf_maxson_lanius.4.t:0 "Кінець легенди III"
 nf_maxson_lanius.4.d:0 "Вона опинилася на краю вибуху, і її знову відкинуло. Однак цього разу вона впала на живіт. Підвестися виявилося легше, і вона побігла в дим, де її зустріло жахливе видовище.\n\nЄдиною частиною Гленна, що залишилася повністю неушкодженою, була його голова, і та сильно обгоріла. На його обличчі застигла гримаса, змішана зі здивуванням. Про решту тіла краще мовчати. Тим часом на тілі Ланія броня була розбита і розплавлена, але маска все ще функціонувала.\n\nАндреа діяла не роздумуючи, кинувшись до останків Гленна. Вона побігла, широко розплющивши очі від страху, а можливо, від заперечення. Вона присіла, але невдовзі впала на коліна. Перевіряти пульс на тому, що залишилося, не мало сенсу. Це не вкладалося в голові. Світ перестав існувати.\n«Ні-ні-ні. Ц-цього не може—Ти не можеш—»\nВона не встигла усвідомити втрату, як щось зімкнулося на її шиї. Вона не бачила цього, але знала, що це рука. Вона підняла її, і невдовзі вона вже висіла в повітрі. Андреа спробувала підняти руки і відірвати їх, але вони були твердими, обгорілими і змішаними з металом. На мить вона відчула запах смаженого м'яса.\n\n«Підкоріться. Усі ви». Монстр Сходу говорив владно і твердо, з відчуттям спокою у своєму наказі. Йому вдалося використати свою репутацію, щоб заманити ворожих командирів у пастку, і він переміг. Усе, що могла зробити Андреа, поки її легені кричали про нестачу повітря, це не дати йому того мізерного задоволення, яке вона ще могла втримати.\n\nПотім пролунав звук бризок крові, і Андреа впала на підлогу, глибоко і часто дихаючи. Втім, вона одразу ж обернулася. Ланій все ще стояв, його голова смикнулася під дивним кутом. Але його труп не падав. Він залишався нерухомим, поки ще одна куля не пробила йому коліна, змусивши труп нарешті впасти мертвим.\n\n«Бувай, невдахо», — пожартував закривавлений Чужинець, з'явившись з іншого кінця паркінгу. «...Дідько, це все, що я отримав?»\n\nАндреа не відповіла. Вона підтяглася назад до трупа Гленна, впавши на коліна і колисаючи відрубану голову свого найстарішого, найкращого друга в обіймах."
 nf_maxson_lanius.4.a:0 "Війна — це пекло."

 #Події Сховища 0#

 nf_maxson_vault0.1.t:0 "Стародавня загроза"
 nf_maxson_vault0.1.d:0 "Сховище 0. Нібито саме так називався цей об'єкт, але інформацію... було складно дістати. Андреа переглянула безліч звітів, свідчень та архівів того часу; більшість з них походили від місцевих жителів, чиї батьки та діди пережили той інцидент, тож вона була водночас неповною та різної точності. Вона тримала в руках два свідчення, які, здавалося, повністю суперечили одне одному: в одному розповідалося про роботів, що заполонили штат, а в іншому стверджувалося, що це були мутанти та гулі під проводом гуліфікованого Губернатора Колорадо.\n\nВона зітхнула, зробивши ще один ковток зі своєї маленької склянки з пійлом, перш ніж відвернутися від столу до масивної коркової дошки, що висіла позаду неї; вона була прикрашена багатьма фотографіями, підтвердженими свідченнями, записами з терміналів та червоною ниткою. Багато червоної нитки, що зв'язувала все це в до нестями складний клубок.\n\nЯкщо вони хотіли знайти це Сховище, роботи буде набагато більше."
 nf_maxson_vault0.1.a:0 "Що чекає на нас там, унизу?"

 nf_maxson_vault0.2.t:0 "Вхід у кратері"
 nf_maxson_vault0.2.d:0 "«Тут вибухнула ядерна бомба?» — запитала Андреа Елріка, коли вони піднімалися на гору.\n\n«Так, Старійшино. Це єдине пояснення того, як Сховище було розкрите».\n\nПоглянувши назад на Елріка, закутого в броньований панцир його броні T-45d, вона спохмурніла у своєму власному костюмі T-51b. Поруч із ними йшов Чужинець, один із багатьох Братів, що супроводжували Андреа до Сховища. Він наполіг на цьому, коли виявив, що радіація в кратері ледь помітна. Хоча Андреа вже довіряла його судженням, вона все одно шкодувала, що він відмовився від захисту костюма.\n\nКоли вони дійшли до кінця гірської стежки, Андреа побачила, як земля перед ними різко йде вниз. Зазирнувши за край, вона побачила отвір зі згорнутого металу глибоко в ямі.\n\n«Наскільки я можу судити, це і є вхід», — прокоментував Чужинець, вказуючи вниз.\n\nАндреа кивнула. «Тоді не будемо зволікати». Вона махнула рукою Паладинам і Лицарям позаду неї. «У пролом, Брати. Давайте з'ясуємо, що тут сталося»."
 nf_maxson_vault0.2.a:0 "Вони спустилися в діру."

 nf_maxson_vault0.21.t:0 "Тихі зали"
 nf_maxson_vault0.21.d:0 "«Я думала, що нам тут знадобляться ліхтарі на шоломах», — вголос розмірковувала Андреа. Сховище, після початкового спуску, все ще було добре освітленим і функціональним, наскільки вона могла судити. Світло, двері, термінали — усе досі працювало і мало живлення.\n\nЇї почет розсіявся, перевіряючи кути та зачищаючи кімнати. Чужинець пішов коридором сам, коли Андреа відвернулася. Він мав би скоро повернутися, але їй справді не були потрібні втрати на такому ранньому етапі дослідження.\n\n«Старійшино! Якщо ви підійдете сюди, здається, я щось знайшов», — гукнув Елрік. Підійшовши туди, де він стукав по клавішах термінала, Андреа побачила, що він витягнув якусь інформацію.\n\n«Що ви знайшли, Прокторе?» — запитала Андреа.\n\n«Здається, це місце є саме тим, що ми думаємо». Він вказав пальцем на екран, де у верхній частині діагностичної інформації відображався текст «Сховище 0000».\n\nЕлрік продовжив: «Якщо специфікації цього Сховища точні, воно набагато більше за будь-який інший об'єкт, побудований компанією...» Андреа здалося кумедним, що він усе ще міг кинути на неї впізнаваний побіжний погляд, перш ніж продовжити. «...хоча багато планів Vault-Tec до війни не були завершені. Проте, якщо була побудована хоча б половина з цього, це, мабуть, найбільше Сховище, про яке нам нині відомо».\n\n«Є щось про його призначення?» — запитала Андреа, краєм ока помітивши, як коридором повертається Чужинець.\n\nЕлрік похитав головою. «Крім стандартного повідомлення про «виживання в ядерній війні», ми можемо дізнатися про це, лише пройшовши глибше. Де б не був кабінет Наглядача чи його еквівалент, ця інформація буде там».\n\nАндреа поплескала його по броньованому плечу. «Хороша робота, Прокторе». Потім вона повернулася до Чужинця. «Я так розумію, ти знайшов шлях униз?» Він підняв великий палець вгору, тож Андреа віддала наказ зібраним Братам: «Рушаймо далі, Чужинець знайшов нам дорогу»."
 nf_maxson_vault0.21.a:0 "Просуватися далі"

 nf_maxson_vault0.3.t:0 "Штурм"
 nf_maxson_vault0.3.d:0 "Пошрамовані плазмою стіни, розкидані деталі роботів... усі ознаки вказували на запеклий бій у тісних коридорах. Здавалося, найзапекліші бої точилися навколо енергетичних вузлів на верхніх рівнях, із купами знищених роботів у тих кімнатах. Після цього слід руйнувань вів до головних ліфтів, що відкривали доступ до нижніх рівнів. Той, хто очолював цей штурм крізь масовані сили захисників, був добре озброєний і неймовірно майстерний. Не те щоб обійшлося без втрат — коридори були всіяні скелетами, що носили кольори та символи Братства. Видовище було дещо нудотним; навіть крізь фільтри свого шолома Андреа відчувала сморід суміші мастила, попелу, металу та інших жахливих відходів машинного бою.\n\nВона була не єдиною, кого це відлякувало; двоє Лицарів, що йшли обабіч неї, були напружені, міцно стискаючи свої лазерні гвинтівки та тричі перевіряючи кожного робота, повз якого проходили.\n\nДивно, але серед полеглих були муміфіковані тіла Гулів і навіть Супермутантів у Силовій Броні, які орудували передовою зброєю пліч-о-пліч із Братами і Сестрами людьми. Навіть люди були дивними. Хоча їхні тіла давно згнили, у деяких були знайдені особисті речі, схожі на ті, що зазвичай зустрічаються у дикунів."
 nf_maxson_vault0.3.a:0 "Загроза, що об'єднала всіх."

 nf_maxson_vault0.4.t:0 "Гелліон"
 nf_maxson_vault0.4.d:0 "Прибувши до Буена-Вісти, наші Паладини швидко виявили зайнятий ангар. Згідно з терміналами всередині самого ангара, це був «Гелліон» — передовий бойовий літальний апарат, побудований до війни, щоб допомогти Сховищу 0 в утихомиренні пусток. На щастя, він був не завершений, оскільки силова установка, необхідна для завершення процедури його запуску, була знищена силами Середньозахідного Братства ще до того, як Калькулятор встиг її розгорнути.\n\nЕлрік був особливо щасливий від цієї знахідки. Після того як Андреа привела його до апарата, він провів цілий день, одержимо його вивчаючи. Він наполягав на тому, щоб розібрати його до останньої деталі і скопіювати креслення методом зворотного проєктування. Чи зможемо ми їх відтворити — питання спірне, але вивчення його конструкції дасть нам перевагу в аеронавтичних дослідженнях."
 nf_maxson_vault0.4.a:0 "Вражаючий витвір інженерії."

 nf_maxson_vault0.5.t:0 "Ближче до істини"
 nf_maxson_vault0.5.d:0 "Те, що ліфти досі працювали, було справжньою удачею, яка заощадила їм дні досліджень. Вийшовши зі своєю охороною, Андреа водила зброєю з боку в бік, шукаючи загрози. Що глибше вони спускалися, то більше вона переймалася. Інформація, яку Елрік знайшов раніше, підтверджувалася з кожним дослідженим поверхом і кімнатою. Це був найбільший підземний об'єкт, у якому Андреа бувала відтоді, як покинула Лост-Гіллз, а може, й за все своє життя.\n\nЧужинець зголосився перевіряти кожен поверх перед тим, як туди зайде основна група. І знову він стояв поруч із дверима ліфта. «Гей, Старійшино, ви захочете на це подивитися. Елрік теж». Його обличчя було похмурим.\n\n«Щось не так?» — запитала Андреа.\n\nЧужинець похитав головою. «Нічого небезпечного, просто знайшов дещо, що може розповісти нам, що тут сталося». Зацікавлена, Андреа махнула Елріку вперед, перш ніж наказати іншим розосередитися і закріпитися на поверсі, поки вони йшли за Чужинцем.\n\nТрійця увійшла до великої зали, заповненої рядами капсул. Усі вони були розміром із дорослу людину, на них блимали яскраві червоні вогники. Чужинець вказав на найближчу. «Погляньте», — сказав він.\n\nАндреа та Елрік підійшли до капсули і зазирнули крізь скляний верх. Вкрите памороззю, але все ще видиме, там лежало явно муміфіковане людське тіло в комбінезоні Vault-Tec."
 nf_maxson_vault0.5.a:0 "Заморожені трупи."

 nf_maxson_vault0.51.t:0 "Гробниця"
 nf_maxson_vault0.51.d:0 "Андреа вже двічі пройшлася вздовж рядів капсул. Знову зупинившись біля першої, вона поклала руку на скляний верх. «Є щось, Елріку?» — запитала вона, повернувши голову до чоловіка, який несамовито друкував на терміналі в кінці кімнати.\n\nЕлрік глянув на неї й кивнув. «Усі вони померли невдовзі після падіння бомб, якщо час на цьому терміналі точний». Повернувши голову назад до екрана, він продовжив. «Вони змогли побудувати це величезне Сховище, але, вочевидь, не перевірили кріогенні капсули перед тим, як залізти в них. Тут також є запис, Старійшино». Він замовк, на мить затамувавши подих. «Він стверджує, що написаний одним з останніх техніків, які залишилися. Там сказано, що ті, хто міг полагодити «Калькулятор», усі померли в кріокапсулах, і він збирався спробувати полагодити те, що міг, раніше».\n\n«Калькулятор...» — пробурмотіла Андреа. Це була одна з назв загрози, на яку вказували зібрані нею звіти. Якщо всі у Сховищі померли так давно, що ж вийшло звідси після їхньої смерті і спричинило такі руйнування?\n\n«Лицарю Чужинець, у нас ще є кілька рівнів попереду. Знайди мені цей «Калькулятор»».\n\nЧужинець віддав честь і зняв гвинтівку з плеча. «Зробимо, Старійшино»."
 nf_maxson_vault0.51.a:0 "Ще глибше."

 nf_maxson_vault0.6.t:0 "Останній рубіж Калькулятора"
 nf_maxson_vault0.6.d:0 "Нарешті, найнижчий рівень Сховища. Андреа обережно рухалася в оточенні своїх Паладинів, коли вони увійшли до зали, яку виявив Чужинець. Масивні противибухові двері зі стогоном відчинилися за допомогою дюжини Братів, які негайно ввірвалися до кімнати зі зброєю напоготові.\n\n«Чисто!» — гаркнув провідний Паладин, його голос відлунював у залі. Інші зайшли слідом; Елрік кинувся до головних терміналів, а Чужинець рушив до інших відчинених дверей у дальньому кінці.\n\nАндреа опустила зброю, її погляд упав у центр кімнати, де мала бути колиска Калькулятора. Натомість на її місці стояв імпровізований меморіал. Ряди шоломів, побитих і обпалених, були ретельно розставлені по підлозі. Під кожним шоломом висів армійський жетон, а пошарпані прапори Середньозахідного Братства обрамляли інсталяцію.\n\n«Вони не просто полягли тут», — пробурмотіла Андреа, її голос був сповнений поваги. «Вони зробили це... щоб їх пам'ятали».\n\n«Старійшино, я знайшов кілька голозаписів», — гукнув Елрік від термінала, порушивши похмуру тишу. Андреа підійшла, її погляд зупинився на трьох акуратно підписаних плівках, що лежали на консолі: «Генерал», «Моє рішення» та «Останній запис».\n\n«Спочатку цю, Елріку», — наказала вона, кивнувши на «Генерал». «Подивимося, що вони скажуть».\n\nКоли Елрік вставив плівку в термінал, тиха кімната наповнилася потріскуючим гулом відтворення. Андреа обернулася, її очі знову впали на шоломи, коли розпочався запис, а її Паладини незворушно стояли в мовчазній пошані до тих, хто віддав тут усе."
 nf_maxson_vault0.6.a:0 "Голозапис 1: «Генерал»"

 nf_maxson_vault0.7.t:0 "Генерал"
 nf_maxson_vault0.7.d:0 "«Я роблю ці записи перед тим, як піти. Ціна була неймовірною, але механізми Калькулятора нарешті вивезено зі Сховища 0. Наші інженери розібрали системи до їхніх базових компонентів і транспортували їх до Бункера Епсилон. Я віддав наказ запечатати залишки Сховища; Братство не може ризикувати втратою цієї технології через сміттярів чи ворогів. Наразі нашим пріоритетом є нова інтеграція Калькулятора».\n\n«Генерал Барнакі... мій друг, мій товариш, мій суперник. Я не можу сказати, що повністю розумію його вибір, але я поважаю його переконання. Його мозок тепер перебуває в нейронній мережі Калькулятора; чоловік, який колись бився, щоб знищити його, тепер пов'язаний його холодною логікою. Він вірив, що це єдиний шлях уперед. Я лише сподіваюся, що його рішення не коштуватиме нам душ, як це сталося з ним».\n\n«Пустка в хаосі. У наших лавах багато розбіжностей, лунають навіть заклики до повстання. Вже на півдні йдуть розмови про збройний опір, що формується у відповідь на наше рішення тут, серед тамтешніх мутантів і гулів. До того ж, рейдери полюють на слабких, і наше Братство почало розколюватися. Нове бачення Барнакі обіцяє порядок, але якою ціною? Чи врятує нас цей союз між людиною і машиною, чи він прирече нас усіх? Поки що я продовжую свій шлях, покладаючи віру в силу Братства — і в мудрість тих, кого ми втратили»."
 nf_maxson_vault0.7.a:0 "Голозапис 2: «Моє рішення»"

 nf_maxson_vault0.8.t:0 "Рішення Воїна"
 nf_maxson_vault0.8.d:0 "Голозапис перемкнувся на зернисте чорно-біле відео. На ньому була показана колишня кімната Калькулятора у Сховищі 0, тепер порожня, якщо не брати до уваги уламків і центральної консолі. У кадр, накульгуючи, увійшла самотня постать у пошарпаній рогатій Силовій Броні Середньозахідного Братства. Деякі частини броні були обпалені, а плазмова гвинтівка трохи волочилася в руці.\n\nПостать наблизилася до порожньої колиски, де колись знаходилися системи Калькулятора. З видимим зусиллям вона поклала руку в рукавиці на консоль, схиливши голову, ніби в жалобі.\n\nПісля довгої паузи постать підняла гвинтівку і випустила плазмові розряди в залишки механізмів. Полетіли іскри, екран замиготів, і зображення з камери згасло. Коли трансляція відновилася, постаті вже не було, залишилися лише тліючі залишки кімнати Калькулятора."
 nf_maxson_vault0.8.a:0 "Голозапис 3: «Останній запис»"

 nf_maxson_vault0.9.t:0 "Останній запис"
 nf_maxson_vault0.9.d:0 "«Калькулятора тут більше немає, але його не забуто. Він більше не є загрозою для Братства, як і інструментом для будь-якого сміттяря, який натрапить на це місце. Ми перемістили базові системи до Бункера Епсилон, де його потужність буде спрямована під нашим контролем — або принаймні так ми собі кажемо».\n\n«Рішення Генерала Барнакі досі переслідує мене. Його перетворення на єдиного органічного наглядача Калькулятора є нагадуванням про те, чим ми пожертвували. Він вірив, що пам'ять про його дружину та його любов до людства виправдовують його вибір. Але його бачення чистоти, «кращого» світу — це бачення, викуване у сталі та крові. Мутанти страждатимуть, бунтівники помруть, а Братство правитиме. Чи це те спасіння, про яке ми мріяли?»\n\n«Якщо ви слухаєте це, то, можливо, ще є надія, що хтось навчиться на наших помилках. Знайте, що я бився за майбутнє, навіть якщо це майбутнє, якого я ніколи не побачу. Я був відомий просто як «Воїн», і я є гордим Паладином Середньозахідного Братства Сталі».\n\nГолозапис закінчився зображенням Воїна, який віддає честь, його рогата Силова Броня виблискувала в тьмяному світлі зали."
 nf_maxson_vault0.9.a:0 "Більше не забута спадщина."

 nf_maxson_vault0.91.t:0 "Наслідки"
 nf_maxson_vault0.91.d:0 "Андреа стояла у спустошеній залі, її погляд затримався на залишках кабелів та розтрощених механізмах там, де колись спочивав Калькулятор. Тиша, що настала після останнього голозапису, була важкою; слова Воїна та Барнакі все ще лунали в її голові.\n\n«Отже... вони перемістили його», — сказав Елрік, порушивши тишу. Він поглянув на Андреа, насупивши брови під своїм візором. «До Бункера Епсилон на сході, не менше. І відтоді жодних механічних армій? Мабуть, вони якось його стримали. Але... я не розумію. Чому ми нічого не чули про це раніше?»\n\nБрікслі схрестила руки на грудях, стоячи біля краю подіуму. «Тому що вони не хочуть, щоб хтось знав», — різко сказала вона. «Думаєте, це збіг, що це місце запечатане і забуте? Вони ховають його, Елріку. Що б вони не зробили з Калькулятором, це не на благо Пустки».\n\n«І тим не менш, ніяких орд роботів, що марширують з Епсилона», — заперечив Елрік, вказуючи на порожню колиску. «Ця машина була монстром, але, можливо, план Барнакі дійсно спрацював. Можливо, вони використовують його для підтримання порядку».\n\nАндреа похитала головою, зробивши крок до консолі, де плазмові шрами Воїна все ще мітили метал. «Барнакі думав, що зможе контролювати Калькулятор, зробити його інструментом для миру. Але записи дають чітко зрозуміти: Середній Захід розірвав себе на шматки через його рішення. Навіть якщо вони тримають його під контролем, це лише питання часу, коли він поглине і їх».\n\nЕлрік довго зітхнув. «То це все? Ми залишаємо його похованим, вдаємо, що цього місця ніколи не існувало?»\n\n«Так», — твердо відповіла Андреа. «Майбутнє Братства не пов'язане з експериментом Барнакі. Якщо ми чогось сьогодні й навчилися, так це того, що деякі рішення неможливо скасувати».\n\nВона повернулася до інших. «Запечатайте залу. Нехай минуле залишається похованим тут»."
 nf_maxson_vault0.91.a:0 "«Наша місія триває»."

  #Boulder Dome Events#

nf_maxson_boulderdome.1.t:0 "Боулдер"
 nf_maxson_boulderdome.1.d:0 "Кратер — ось чим зараз є більша частина Боулдера. Заповнений по вінця яскраво-зеленими гулями та калюжами радіоактивного матеріалу, який опромінить вас навіть крізь силову броню. Експедиція знала про це невдовзі після свого прибуття, але ускладнення з Псами, потім з Легіоном, а потім з північними колорадіанцями означали, що він завжди був поза зоною досяжності.\n\nТепер, коли Андреа переглядала різні звіти, підготовлені Чужинцем, нарешті стало зрозуміло, що місія до Купола може бути забезпечена. Це не буде легко, безпечно чи просто; доведеться побудувати передову базу, зачистити гулів, стримувати сміттярів... і все це навіть не стосувалося того, що населяло сам купол. Небезпечні довоєнні роботи? Занепала суперзброя? Токсичні хімікати?\n\nВід самої лише думки про це Андреа стало так ніяково, як уже давно не було... але краще Братство відкриє купол, ніж будь-хто інший."
 nf_maxson_boulderdome.1.a:0 "Піднімаємося на пагорб."
 nf_maxson_boulderdome.1.b:0 "Зачекайте... гулі махають білим прапором?"

 nf_maxson_boulderdome.11.t:0 "Вони з Братства?"
 nf_maxson_boulderdome.11.d:0 "Замість того, щоб розбити табір біля підніжжя Пагорба і завершити підготовку до зачистки диких, Андреа, на подив усієї групи (за винятком Чужинця та Гленна), вечеряла з ними. Як з'ясувалося, двоє лідерів цієї спільноти гулів — колишні члени Братства, члени Середньозахідного Братства. Вони навіть мали армійські жетони, щоб це довести. Вечеря і подальша розмова тривали всю ніч. Хоча здебільшого все зводилося до того, що Чужинець засипав Патча і Стітча мільйоном запитань про їхніх середньозахідних кузенів. Що дует робив із великим задоволенням.\n\n«Здається, вони милі». Гленн сів поруч з Андреа, простягаючи їй пиво.\n«Так і є...» Андреа відкрила кришку і зробила ковток.\n«Чому така похмура, Дрео? Містер — тобто Лицар Патч сказав, що ми можемо використовувати Купол, і ми отримали веселу компанію нових гниючих друзів. Чому б не радіти?»\n«Тому що це настільки суперечить Кодексу? Боже, Лост-Гіллз розіпне мене». Вона допила решту свого напою.\n«Дрео, не хочу бути дупою-»\n«Але будеш»\n«Суть у тому, що ми, власне, не дуже-то й підкорялися Кодексу від самого початку! Ми вже уклали союз з місцевими, і, дозволь сказати, ти з ними досить зблизилася». Він штовхнув подругу ліктем.\nАндреа гмикнула і штовхнула його у відповідь. «Засранець. Ти правий»."
 nf_maxson_boulderdome.11.a:0 "«Крім того, що Лост-Гіллз з цим зробить?»"

 nf_maxson_boulderdome.2.t:0 "Сяючі та злі"
 nf_maxson_boulderdome.2.d:0 "Андреа стояла над великою ратушею так званого «Табору Контакту». Це було одне з небагатьох місць на території Світляків, де гулі та люди могли торгувати, оскільки воно було (переважно) вільним від радіації. Очистити Боулдер від диких гулів було непростим завданням, але ще важче було розібратися з більш розсудливими гулями; багато гулів обурювалися тим, що околиці Купола були відгороджені від приватних сміттярів, тому довелося піти на поступки, щоб уникнути бунту. Деяким гулям запропонували оплачувані посади на робочих майданчиках у межах опроміненої зони; перевезення та збір матеріалів, прибирання радіоактивних відходів, копання траншей, щоб вони були зайняті. Хоча спочатку угода була напруженою, здавалося, що з часом стосунки між місцевими жителями та Братством можуть охолонути."
 nf_maxson_boulderdome.2.a:0 "Цілком прийнятно, якщо вони будуть розумними."

 nf_maxson_boulderdome.3.t:0 "Табір Альфа"
 nf_maxson_boulderdome.3.d:0 "Андреа стояла разом з Чужинцем на оглядовому майданчику креативно названого «Табору Альфа». Першого з багатьох невеликих військових аванпостів, що мали бути розкидані в межах та навколо Зони відчуження Боулдерського купола.\n\n«То це воно, га?» — вголос розмірковував Чужинець.\n\n«Виглядає не дуже, але має чудове розташування. Відколи ми прибули, тут бродять собаки-мутанти, а з цієї бази відкривається чудовий вид на всю територію».\n\n«Мабуть, ти маєш рацію, просто не хотілося б застрягти в такому маленькому радіоактивному хуторі...»\n\nВін мав рацію, але на цій базі було накопичено достатньо Антирадину, щоб пережити перші тижні другого апокаліпсису. З Паладинами всередині все буде гаразд, якщо їхні зміни будуть короткими і з великими інтервалами."
 nf_maxson_boulderdome.3.a:0 "Він був затишним, хоч і трохи опроміненим."


  #Фінальні події#

  #Не фінал lmao#
 nf_maxson_final.1.t:0 "Завжди вперед"
 nf_maxson_final.1.d:0 "Андреа відчинила двері своєї командної кімнати і сіла за свій безладний стіл. Вона кинула стопку звітів і зітхнула, відкинувшись на спинку зручного крісла.\n\nПосидівши кілька хвилин, вона поглянула на перший звіт. Ден Ріверс пробирався через колишні території, які контролював Легіон, налагоджуючи контакти з тамтешніми громадами.\n\nВідклавши цей аркуш, вона взяла наступний. Чужинець знову «зник», ймовірно, попрямувавши на північ або схід, щоб спробувати знайти більше інформації про Середньозахідне Братство. «Не варто хвилюватися, він пройшов через усе досі, як і всі ми», — подумала вона.\n\nНаступний звіт був від Проктора Елріка, тепер Головного Писаря Елріка. Здебільшого останні новини про конфіскацію та накопичення технологій на окупованих територіях. Андреа знає, що роботи в нього в Колорадо непочатий край, але Ордену потрібна людина з його досвідом, щоб допомогти впоратися з усім, що може виникнути.\n\nВона дивиться в кут свого столу і бачить фотографію Загону Хаосу в рамці, зроблену прямо перед тим, як вони покинули Лост-Гіллз. Усміхаючись сама до себе, Андреа згадує про випробування, які їм усім довелося пережити, щоб дістатися до цього моменту. Її лідерство, на її власний подив, вивело їх з межі знищення і перетворило на велику силу в Пустці.\n\nЗвісно, попереду ще багато роботи, але зараз вона могла дозволити собі розслабитися."
 nf_maxson_final.1.a:0 "«Ми зробили це, Гленне, незважаючи ні на що...»"

  #А ось це вже справжній фінал#
 nf_maxson.53.t:0 "Епілог"
 nf_maxson.53.d:0 "Андреа вже кілька годин сиділа у своєму кабінеті. Було майже смішно, як стоси звітів і форм ставали дедалі більшими, що більше вона намагалася з ними працювати.\n\nВона відкинулася на спинку крісла і висунула одну з шухляд столу, дістаючи з неї невелику коробку. Вона на мить завагалася, перш ніж відкрити її, виявивши невелику колекцію сигар... сигар Гленна. Боже, як же ревно він охороняв цю коробку, викурюючи одну лише після заслуженої перемоги. Він жодного разу не дозволив їй викурити хоча б одну з цих клятих штук.\n\nАндреа все ще пам'ятала це. Кожну дрібну, болючу деталь. Запах спаленої плоті, присмак попелу в повітрі... його рука на її шиї...\n\nОднак тепер ніщо з цього не мало значення. Вони перемогли. Здолали Псів, Легіон, Діану, Гекату, усіх їх. Колорадо і Нью-Мексико належали їй.\nЇї лідерство врятувало Орден від загибелі.\nЇї цілеспрямованість дозволила подолати кожну перешкоду.\nВона зробила це, ВОНА.\n\nІ все ж, попри все, що вона зробила, в серці Андреа залишалася порожнеча. Чогось усе ще не вистачало.\n\nАндреа знову поглянула на купу звітів, випросталася, потім дістала з коробки сигару і підпалила її.\nЩо б це не було, воно мине, а зараз у неї не було часу з цим розбиратися."
 nf_maxson.53.a:0 "Було ще багато роботи."

 nf_maxson.54.t:0 "Епілог"
 nf_maxson.54.d:0 "«Доброго ранку, міс Брікслі! Як завжди?» Том, власник невеликої сімейної пекарні, що нещодавно відкрила свої двері, привітав жінку, коли вона увійшла до закладу.\n«Доброго ранку, Томе. І так, дякую». Старійшина посміхнулася, і пекар простягнув їй невеликий паперовий пакет з набором тістечок і багетом. За які Старійшина негайно заплатила 15 кришок.\n«Знаєте, я ж казав вам, що це за рахунок закладу, правда? Багато разів».\n«А я вам багато разів казала, що я не проти платити. Гарного дня, Томе». Вона на прощання помахала рукою і вийшла із закладу на галасливі вулиці Денвера.\n\nХоча значна частина Денвера все ще відбудовувалася, багато поселенців з'їхалися до стародавнього міста і, певним чином, прискорили його відновлення. Андреа, зі свого боку, взяла за звичку прогулюватися містом під час своєї ранкової рутини.\nЗрештою її шлях зупинився посеред старого парку Ла-Альма-Лінкольн, перейменованого на парк Дірінг після Війни з Легіоном. Це було неабияким клопотом, але Братству на щастя вдалося знайти достатньо дерев і насіння для пересадки, що зробило парк доволі приємним місцем, навіть якщо він і блякнув порівняно зі своєю довоєнною версією.\n\nВона сіла на лавку, дивлячись прямо на меморіал, який вони побудували на честь полеглих у Війні, і нарешті могла взятися за сніданок. Або вона так думала.\n\nЩойно Андреа збиралася відкусити шматочок смачного кексу, як її відволік дитячий плач. Вона обернулася, намагаючись знайти джерело плачу, і одразу ж помітила його. Маленький хлопчик, мабуть, не старший за 5 років, посеред парку.\nНапевно, він відбився від батьків, здогадалася вона.\nАндреа зітхнула і подивилася на меморіал, на її обличчі з'явилася посмішка. «Робота ніколи не закінчується, чи не так?»\nВона встала з лавки і підійшла до дитини."
 nf_maxson.54.a:0 "«Гей, малий, ходімо знайдемо твою маму»."

