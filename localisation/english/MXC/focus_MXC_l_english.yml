l_english:
# Фокуси

# Початкові фокуси #
maxson_bos_our_mission:0 "Наш Відхід із Заходу"
maxson_bos_our_mission_desc:0 "Зростаюча напруга та прагнення закріпитися на сході призвели до формування експедиції в Лост-Гілз. Мексонівська експедиція вирушила до Колорадо з метою заснування нового Осередку Братства — поза досяжністю каліфорнійських сил."

maxson_bos_the_bunker:0 "Бункер Сенатора Пітерсона"
maxson_bos_the_bunker_desc:0 "Спершу призначений як притулок для родини сенатора, цей об’єкт був заново відкритий Братством. Коди, надані нашому засновнику, спрацювали навіть після десятиліть, дозволивши нам увійти без спротиву."

maxson_bos_our_struggles:0 "Схизма"
maxson_bos_our_struggles_desc:0 "Усередині бункера ми виявили великий запас Стелс-Боїв, які були використані для спроби повернення втрачених братів. Побічні ефекти цих пристроїв були виявлені надто пізно — значна частина наших сил постраждала від параноїдальних маячень."

maxson_bos_expedition_failure:0 "На Наших П’ятах"
maxson_bos_expedition_failure_desc:0 "Розбиті й розпорошені, ми відступили з Денвера, маючи гангдогів і їхніх псів на хвості. Спадщина цієї поразки тяжіє над кожним членом нашого осередку."

maxson_bos_core_walsh:0 "Загін 'Оук' Займає Нью-Сіракузи"
maxson_bos_core_walsh_desc:0 "Загін 'Оук' вважався загиблим під час відступу з Денвера. Та нещодавно ми отримали радіозв’язок — виявилось, що вони просто відхилились, щоби захопити сховище енергетичної зброї. Їх буде відправлено до Нью-Сіракуз для зачистки району та подальшого повернення до армії."

maxson_bos_truchas_peak:0 "Група 'Амбер' Займає Форт Лайон"
maxson_bos_truchas_peak_desc:0 "Групу 'Амбер' вважали зниклою після відступу з Денвера. Та, на щастя, їх виявили — вони базувалися у старому довоєнному продовольчому сховищі поблизу Форту Лайон. Вони зачистять територію навколо бункера та згодом повернуться до строю."

# Фокуси Писарів #

maxson_bos_scribe_1:0 "Консультації Писарів для Промисловості"
maxson_bos_scribe_1_desc:0 "Писарі, які контролюють працю пустельників на наших територіях, допоможуть зменшити кількість помилок і підвищити ефективність виробництва."

maxson_bos_scribe_2:0 "Дослідницький Пріоритет"
maxson_bos_scribe_2_desc:0 "Сконцентрувавши зусилля писарів на конкретному напрямку в розвитку озброєння, ми отримаємо чітку перевагу. А збільшений бюджет лише підсилить ефект."

# Армія #

maxson_bos_failure_a1:0 "Відновлення Нашої Потуги"
maxson_bos_failure_a1_desc:0 "Втрата озброєння — приголомшлива. Без допомоги із заходу та в оточенні ворогів ми не можемо дозволити собі довго чекати. Нам слід негайно відновити сили."

maxson_bos_failure_a2:0 "Наступне Покоління"
maxson_bos_failure_a2_desc:0 "Свіжі обличчя, повні ентузіазму. Загартовані ветерани — їхні наставники. Майбутнє армії кується зараз."

maxson_bos_failure_a3:0 "Військова Промисловість Нью-Сіракуз"
maxson_bos_failure_a3_desc:0 "Наші перші кроки в Нью-Сіракуз були скромними — обмежені лише взаємодією з місцевими громадами. Та сьогодні нам потрібна повноцінна індустрія зброї, й час інвестувати зусилля в її створення."

maxson_bos_failure_a4:0 "Зброя для Знищення Ворогів"
maxson_bos_failure_a4_desc:0 "Лазерна зброя вже не сприймається як щось надприродне в сучасній Пустці — але вона досі ефективна, незалежно від того, хто її розуміє."

maxson_bos_failure_a5:0 "Броня для Захисту Наших Сердець"
maxson_bos_failure_a5_desc:0 "Силова броня — наш хребет, символ Братства. Від її міці залежать наші життя й перемоги."

maxson_bos_failure_a6:0 "Підземна Обробка Передових Матеріалів"
maxson_bos_failure_a6_desc:0 "Розширення підземних рівнів бункера Мексона для зберігання та сортування технологічної здобичі."

maxson_bos_failure_a7:0 "Міліція Нью-Сіракуз"
maxson_bos_failure_a7_desc:0 "Завдяки близькості Нью-Сіракуз до головного бункера, ми можемо ефективно патрулювати місцеві поселення меншою кількістю сил — обмінявши це на службу місцевих пустельників у наших гарнізонах за межами регіону."

maxson_bos_failure_a8:0 "Польові Навчання"
maxson_bos_failure_a8_desc:0 "Виділення часу на тренування наших сил зміцнить як бойову тактику, так і моральний дух."

maxson_bos_failure_a9:0 "Розвиток Силової Броні"
maxson_bos_failure_a9_desc:0 "Наша броня добре служила нам під час переходу до Колорадо — та завжди є куди вдосконалюватись."

maxson_bos_failure_afinal:0 "Більше Ніколи Не Втратити"
maxson_bos_failure_afinal_desc:0 "Системне обслуговування спорядження запроваджено на всіх рівнях. Ми не можемо дозволити, щоби технічна несправність знову стала причиною нашої поразки."

# Промисловість #

maxson_bos_failure_b1:0 "Маємо Триматися"
maxson_bos_failure_b1_desc:0 "Наша позиція в Колорадо нестабільна. Хоч ми не можемо просто зачинити двері бункера й сховатися, ми маємо бути готові до оборони у разі атаки."

maxson_bos_failure_b2:0 "Цивільна Промисловість Нью-Сіракуз"
maxson_bos_failure_b2_desc:0 "Наші перші дії в Нью-Сіракуз були обмеженими. Але зараз, коли нам потрібна справжня цивільна індустрія, настав час інвестувати в її становлення."

maxson_bos_failure_b3:0 "Нерозвідані Ресурси"
maxson_bos_failure_b3_desc:0 "Коли ми вийшли на 'волшівців', ми не стали грабувати їхні поселення. Та попри нашу обережність, у нас є достатньо занедбаних об'єктів, які ми можемо дослідити самостійно, щоби доповнити те, що зможемо отримати дипломатичним шляхом."

maxson_bos_failure_b4:0 "Відновлення Доріг та Промисловості"
maxson_bos_failure_b4_desc:0 "Район навколо бункера Мексона не зазнав серйозних ударів під час Великої Війни, та два століття забуття далися взнаки. Відновлення інфраструктури допоможе нам закріпитися."

maxson_bos_failure_b5:0 "Підземні Майстерні"
maxson_bos_failure_b5_desc:0 "Розширення підземної мережі в Нью-Сіракуз дозволить нам збільшити обсяги безпечного виробництва."

maxson_bos_failure_b6:0 "Фортифікація Бункера Мексона"
maxson_bos_failure_b6_desc:0 "Посилення систем безпеки й підготовка оборонних рубежів навколо бункера допоможе стримати прямий штурм."

maxson_bos_failure_b7:0 "Фортифікація Південного Кордону"
maxson_bos_failure_b7_desc:0 "Укріплення південного кордону — перший крок до захисту під час кампанії в Колорадо."

maxson_bos_failure_b8:0 "Фортифікація Західного Кордону"
maxson_bos_failure_b8_desc:0 "Посилення західного кордону — запорука безпеки наших ключових територій."

maxson_bos_failure_bfinal:0 "Сталеві Бастіони"
maxson_bos_failure_bfinal_desc:0 "Вороги розіб’ються об нашу сталь. Плечем до плеча — ми не зламаємось."

# Місто Роботів #

maxson_bos_robot_city_a:0 "Прорвати Сталь"
maxson_bos_robot_city_a_desc:0 "Нашій експедиції потрібна перемога, і роботи так званого 'Міста Роботів' — гідна ціль. Ми повинні вдарити швидко й безжально, якщо хочемо перемогти."

# Дирижабль #

maxson_bos_airship_a:0 "Збитий Дирижабль"
maxson_bos_airship_a_desc:0 "Просуваючись на північ від бункера Мексона, наші Паладини натрапили на вкрай дивну знахідку..."

maxson_bos_prepare_1:0 "Дослідження Руїн"
maxson_bos_prepare_1_desc:0 "Виславши команду до уламків, ми можемо дізнатися, що саме сталося з цією повітряною машиною."

maxson_bos_prepare_2:0 "Опечатані Ангари"
maxson_bos_prepare_2_desc:0 "У глибинах підкореного Міста Роботів наші Паладини натикаються на..."

maxson_bos_prepare_3:0 "Аеротактика"
maxson_bos_prepare_3_desc:0 "Навчання наших Лицарів за довоєнними повітряними інструкціями дасть нам перевагу над більшістю пустельних фракцій у боротьбі за панування в небі."

maxson_bos_prepare_4:0 "Стрибок У Пекло"
maxson_bos_prepare_4_desc:0 "Силова броня — надзвичайно гнучкий інструмент, не лише для наземних операцій. Підготовка Паладинів до штурмів із повітря може дати нам вирішальну перевагу."

# Укус Скорпіона #

maxson_bos_scorpions_a:0 "Загроза Скорпіонів"
maxson_bos_scorpions_a_desc:0 "Жити поряд із рейдерами — не новина для Братства. Як і знищувати їх."

# Покращення на території Скорпіонів #

maxson_bos_scorpions_territory_a:0 "«Винахідливість» Рейдерів"
maxson_bos_scorpions_territory_a_desc:0 "Банда Скорпіонів спеціалізувалась на швидкості й мобільності. Їхні методи утримання переваги здивували навіть наших Писарів і дали нові ідеї для вдосконалення власної техніки."

maxson_bos_scorpions_territory_b:0 "Конфіскація Ресурсів"
maxson_bos_scorpions_territory_b_desc:0 "Хоч мешканці Пустки більше не змушені сплачувати Скорпіонам данину, ми повинні перевірити їхні колишні сховища — можливо, там є технології, надто небезпечні, щоби залишити без нагляду."

maxson_bos_scorpions_territory_c:0 "Пильнуймо Південь"
maxson_bos_scorpions_territory_c_desc:0 "Розширення кордонів означає збільшення відповідальності. Ми повинні активізувати розвідку та охорону наших південних рубежів."

maxson_bos_scorpions_territory_final:0 "Придушити Скорпіонів"
maxson_bos_scorpions_territory_final_desc:0 "Дороги очищені від рейдерів, поселення патрулюються, інфраструктура підтримується. Ми утвердили владу над цією територією."

# Покращення на території Міста Роботів #

maxson_bos_robot_city_territory_a:0 "Збір Залишків"
maxson_bos_robot_city_territory_a_desc:0 "Після нашої перемоги чимало роботів залишилося деактивованими або пошкодженими. Ми можемо розібрати їх на запчастини та використати в інженерних цілях."

maxson_bos_robot_city_territory_b:0 "Повторне Використання"
maxson_bos_robot_city_territory_b_desc:0 "Замість утилізації пошкоджених роботів ми можемо спробувати перепрограмувати та запустити їх знову — на службу виробництву у самому Місті Роботів."

maxson_bos_robot_city_territory_c:0 "Розчистити Дороги"
maxson_bos_robot_city_territory_c_desc:0 "Використання силової броні для відтискання довоєнного брухту з доріг — не найгероїчніше завдання, але життєво необхідне для стабілізації регіону."

maxson_bos_robot_city_territory_d:0 "Відновлення Споруд"
maxson_bos_robot_city_territory_d_desc:0 "Багато будівель у Місті Роботів зберегли структуру. Трохи зусиль — і ми зможемо використати чимало з них як складські чи виробничі приміщення."

maxson_bos_robot_city_territory_final:0 "Місто Роботів Більше Не Існує"
maxson_bos_robot_city_territory_final_desc:0 "Роботи більше не блукають руїнами. Усі прилеглі поселення тепер під захистом Братства."

# Собаки з Денвера #

maxson_bos_hangdogs_a:0 "Наш Другий Шанс"
maxson_bos_hangdogs_a_desc:0 "Цього разу ми не відступимо. Ми заберемо «Місто Псів» собі — а тих, хто тримає його, відправимо в могилу."

maxson_bos_hangdogs_b:0 "Місто Денвер"
maxson_bos_hangdogs_b_desc:0 "Нарешті воно належить нам. Після зачистки від мародерів і решток супротиву, Братство отримало контроль над Денвером і його багатствами."

maxson_bos_hangdogs_c:0 "Багатства Минулого"
maxson_bos_hangdogs_c_desc:0 "Довоєнне місто напевно приховує чимало цікавого. Наші знання дозволять побачити те, що інші пропустили."

maxson_bos_hangdogs_d:0 "Експлуатація Міста"
maxson_bos_hangdogs_d_desc:0 "Денвер — велике місто. Взяти його — лише початок. Ми маємо зробити його назавжди нашим."

maxson_bos_hangdogs_city_a1:0 "Споживча Промисловість Денвера"
maxson_bos_hangdogs_city_a1_desc:0 "Відновлення довоєнної інфраструктури — перший крок до того, щоб місто знову запрацювало на нас."

maxson_bos_hangdogs_city_a2:0 "Індустріальні Висновки Писарів"
maxson_bos_hangdogs_city_a2_desc:0 "Рівень індустріалізації у довоєнних містах усе ще перевершує все, що можуть створити пустельники. Вивчення цих залишків дозволить нам скоротити цей розрив."

maxson_bos_hangdogs_city_b1:0 "Зруйновані Вулиці"
maxson_bos_hangdogs_city_b1_desc:0 "Розчищення вулиць дозволить нам ефективніше переміщатися містом і транспортувати вантажі."

maxson_bos_hangdogs_city_b2:0 "Відновлені Дороги"
maxson_bos_hangdogs_city_b2_desc:0 "Будівництво нових автошляхів на місці старих дозволить нам швидше пересуватись центральним Колорадо."

maxson_bos_hangdogs_city_c1:0 "Військова Промисловість Денвера"
maxson_bos_hangdogs_city_c1_desc:0 "Відновлення промислової інфраструктури дозволить нам створювати техніку прямо в місті."

maxson_bos_hangdogs_city_c2:0 "Креслення Зброї"
maxson_bos_hangdogs_city_c2_desc:0 "Ми виявили креслення спеціального озброєння довоєнної Америки. Наші Писарі вже працюють над ними."

maxson_bos_hangdogs_city_final:0 "Приглушене Місто"
maxson_bos_hangdogs_city_final_desc:0 "На вулицях вже не чути голосів довоєнних мешканців — і не видно післявоєнних мародерів. Тут панує гул індустрії та глухий стукіт силової броні. Денвер — наш."

maxson_bos_hangdogs_tech_a1:0 "Об'єкт B"
maxson_bos_hangdogs_tech_a1_desc:0 "Мережа оборони WARDEN мала в Денвері кілька об'єктів. Вони залишилися на диво добре збереженими й багатими на технології."

maxson_bos_hangdogs_tech_a2:0 "Об'єкти C та D"
maxson_bos_hangdogs_tech_a2_desc:0 "Ці два об'єкти мали змогу виробляти роботів для потреб WARDEN. Один із них навіть містив секцію з деактивованими Протектонами, які ми можемо використати."

maxson_bos_hangdogs_tech_a3:0 "WARDEN Денвера"
maxson_bos_hangdogs_tech_a3_desc:0 "WARDEN відключено від мережі. Можливо, ми зможемо переконати його допомогти нам — у захопленні цілого штату зайвий союзник не завадить. А ще його конструкція — цінна для нашої науки."

maxson_bos_hangdogs_tech_b1:0 "Арсенали Національної Гвардії"
maxson_bos_hangdogs_tech_b1_desc:0 "Мародери так і не змогли відкрити всі арсенали навколо Денвера. Ми ж маємо універсальні коди доступу з часів Армії США. А як не зламає код — зламає лазер."

maxson_bos_hangdogs_tech_b2:0 "Дослідний Центр West Tek"
maxson_bos_hangdogs_tech_b2_desc:0 "Хоч відірваний вибухами й частково похований, центр лишився недоторканим. Ми зможемо пробратися всередину в силовій броні й з достатньою дозою Rad-X."

maxson_bos_hangdogs_tech_b3:0 "Депо Військової Техніки США"
maxson_bos_hangdogs_tech_b3_desc:0 "Депо не було добре захищене, але воно зберегло майже всю техніку — через нестачу пального та складність транспортування її мародери не змогли нічого вивезти."

# Залізний Альянс #

maxson_bos_ironalliance_a:0 "Сталь Проти Заліза"
maxson_bos_ironalliance_a_desc:0 "Рейдери в силовій броні. Найманці з амбіціями. Не слід їх недооцінювати — але і залишити на нашому шляху ми їх не можемо."

maxson_bos_ironalliance_b:0 "Залізний Лом"
maxson_bos_ironalliance_b_desc:0 "Десятки років грабунку та ремонтів силової броні дозволили Залізному Альянсу накопичити чималі запаси техніки й виробничих засобів."

# Китайські Гулі #

maxson_bos_ghouls_a:0 "Старі Солдати"
maxson_bos_ghouls_a_desc:0 "Це не звичайні поселення гулів. Вони організовані, дисципліновані, мають нестандартну техніку та бойовий досвід. Дехто навіть розмовляє китайською."

maxson_bos_ghouls_b:0 "Старі Уроки"
maxson_bos_ghouls_b_desc:0 "Ми захопили капітана серед гулів. Ми не маємо наміру знищити їх повністю — а він, виявляється, має досвід, який може нам стати у пригоді."

# Залізо й Гулі #

maxson_bos_ironghouls:0 "Мир Після Бурі"
maxson_bos_ironghouls_desc:0 "З часом загоюються всі рани. Хоч образа й лишилася, ми змогли залагодити конфлікти з колишніми ворогами."

# "Баґґери" #

maxson_bos_baggers_a:0 "Що Ви Робите в Колорадо?"
maxson_bos_baggers_a_desc:0 "«Не ваше діло!» — неочікувана відповідь, але не така, щоб нас зупинити."

maxson_bos_baggers_b:0 "Мета «Баґґерів»"
maxson_bos_baggers_b_desc:0 "Захопивши вчених, яких супроводжувала експедиція НКР, ми дізналися про їхню мету — Купол у Боулдері. Хоч решта солдатів і науковців лишаться під вартою, вони допоможуть, коли ми досягнемо об'єкта."

# Сяйливі #

maxson_bos_luminous_ones:0 "Підкорення Гори"
maxson_bos_luminous_ones_desc:0 "Радіоактивна гора, наповнена сяйливими гулями в примітивній броні. Це буде важке захоплення — але Колорадо має належати нам."

# Зів'ялі Пси #

maxson_bos_withered_dogs:0 "Ще Більше Псів"
maxson_bos_withered_dogs_desc:0 "Вигнані з Денвера Собацюрами... ми розуміємо вас. Та нашої співчутливості надовго не вистачить."

# Спів Хорів #

maxson_bos_choir_1:0 "Навчання з Колібрі"
maxson_bos_choir_1_desc:0 "Останнє рішення Колібрі співпрацювати з нами — поки що наче благо, але час покаже. Поки що, можемо провести спільні навчання й перейняти досвід."

maxson_bos_choir_2:0 "Укріпити Розписану Скелю"
maxson_bos_choir_2_desc:0 "Плем’я Розписаної Скелі довгий час було нашим сусідом, аж поки їх не витіснив Сплетений Хор — тепер Колібрі. Район досі нестабільний, і багато хто боїться нового вторгнення. Ми допоможемо укріпити кордон."

maxson_bos_choir_3:0 "Укріпити Серцевинні Території"
maxson_bos_choir_3_desc:0 "Наша територія навколо Бункера Мексона досить вразлива. Раніше бракувало людей для укріплення кордонів — тепер із допомогою союзників на південному сході ця проблема вирішена."

maxson_bos_choir_4:0 "Підтримувати Порядок"
maxson_bos_choir_4_desc:0 "Останнім часом Колібрі просувають концепт «Миротворця» в армії. Гарна ідея — ми теж можемо створити кілька таких підрозділів із солдатів із бездоганною репутацією."
maxson_bos_choir_4_tt:0 "До вас приєднаються два підрозділи повністю укомплектованих Правоохоронців!"

maxson_bos_choir_5:0 "Вербування з Колібрі"
maxson_bos_choir_5_desc:0 "Відсутність воєнного запалу у Колібрі змусила чимало вояків і племінників почуватися вигнанцями. Багато з них хочуть повернутись до бою — і під нашим стягом зможуть це зробити."

maxson_bos_choir_6:0 "Вчитись у Кращих"
maxson_bos_choir_6_desc:0 "Колібрі добре розуміються на природі й видобутку ресурсів. Хоч і не всі методи вони схвалюють, їхні знання якраз заповнюють прогалини в наших довідниках. Тепер ми зможемо бурити ґрунт краще, ніж будь-коли!"

# Війна з Ланієм #

maxson_bos_laniuswar_1:0 "Надзвичайне Вербування"
maxson_bos_laniuswar_1_desc:0 "Доброчесні пустельники, бувалі найманці, досвідчені поселенці — всі йдуть на фронт, щоб зупинити Потвору Сходу."

maxson_bos_laniuswar_2:0 "Захистимо Дім!"
maxson_bos_laniuswar_2_desc:0 "Ми вже за тисячі миль від Лост-Гіллз. Відступати — більше нікуди. Ми або переможемо, або впадемо з гвинтівкою в руках!"

maxson_bos_laniuswar_3:0 "Реквізувати Зброю Караванників"
maxson_bos_laniuswar_3_desc:0 "Караванники добре озброєні, хоч і вдають простих торгівців. Вони, мабуть, поскаржаться на реквізицію їхньої зброї — але краще це, ніж рабство в Легіоні, чи не так?"

# Післявоєнне Відновлення #

maxson_bos_postlanius_1:0 "Звільнити Рабів"
maxson_bos_postlanius_1_desc:0 "У колишній столиці Ланія ще багато рабів. Їх звільнення та переселення до нас ослабить залишки Легіону на півдні."

maxson_bos_postlanius_2:0 "Підтримка Нового Розділу"
maxson_bos_postlanius_2_desc:0 "Надавши новому Відділу більше автономії, ми зможемо зосередитись на інших викликах, не турбуючись про південний кордон."

maxson_bos_postlanius_3:0 "Окупувати Завойовані Землі"
maxson_bos_postlanius_3_desc:0 "Утримання Нью-Мексико виснажить нас. Створення нового Відділу на півдні — більш розумне рішення. Так ми й отримаємо союзника, і збережемо лад."

# Завзяття Експедиції #

maxson_bos_expedition_continues:0 "Місія Триває"
maxson_bos_expedition_continues_desc:0 "Після відплати ворогам і нових здобутків, Розділ Мексона знову стоїть твердо на ногах."

maxson_bos_expedition_colorado1:0 "Братство Колорадо"
maxson_bos_expedition_colorado1_desc:0 "Денвер наш. Падіння братів і сестер не марне — ми знову сильні. Колорадо буде нашим — назавжди."

# Братство Колорадо #

maxson_bos_expedition_colorado2:0 "Перемога Над Усіма"
maxson_bos_expedition_colorado2_desc:0 "Собацюри, Ланій, і решта Колорадо вже впали або впадуть незабаром. Ми довели, що є панами цих земель."

maxson_bos_vault1:0 "Сховище 0000"
maxson_bos_vault1_desc:0 "Сліди давньої битви з машинним ворогом, які ми виявили на вулицях Денвера, привели нас до напіввідчиненого Сховища поблизу Колорадо-Спрінґс. Ми відправили наших Паладинів вгору до гори, і тепер можемо лише гадати — що чекає всередині?"

maxson_bos_vault2:0 "Верхні рівні"
maxson_bos_vault2_desc:0 "Відправивши команди вглиб тріщини, залишеної, як ми підозрюємо, тактичною ядерною боєголовкою — єдиною відомою зброєю, здатною пробити таку діру в Сховище — ми розпочали дослідження верхніх рівнів."

maxson_bos_vault3:0 "Сліди битви"
maxson_bos_vault3_desc:0 "Перші ознаки штурму цього Сховища знайдено нашими Паладинами — вони свідчать про відчайдушну оборону, яку вели його роботизовані захисники."

maxson_bos_vault4:0 "Конструкція Vault-Tec"
maxson_bos_vault4_desc:0 "Зі зламаних терміналів ми дізналися, що це Сховище було недофінансоване та постійно затримувалося — навіть уряд довоєнної Америки втратив відчуття небезпеки. Але навіть так — це найбільше Сховище, з яким ми стикалися. Побудоване навколо вже існуючого комплексу, воно вражає своїми розмірами. Багато матеріалу для наших Писарів. Vault-Tec, навіть у найгірші часи, залишався найкращим у будівництві ядерно-стійких укриттів."

maxson_bos_vault5:0 "Нижні рівні"
maxson_bos_vault5_desc:0 "Спускаючись до найглибших рівнів ліфтами, ми бачимо все більше слідів боїв. Саме ці рівні, здається, були найгустіше заселені до початку штурму. Кріокапсули для жителів та промислові потужності для обмеженого виробництва роботів."

maxson_bos_vault6:0 "Індустрія Vault-Tec"
maxson_bos_vault6_desc:0 "Сховище 0 було створене як центр відбудови Америки після ядерної катастрофи. Хоча нам добре відома правда про Сховища, для тих, хто тікав у них у 2077-му — це був єдиний шанс. І хоча мешканці цього Сховища, очевидно, не пережили напад, інфраструктура все ще функціонує. Це надає безцінні можливості для наших Писарів."

maxson_bos_vault7:0 "Обвалені секції"
maxson_bos_vault7_desc:0 "Дивні роботи лежать у завалених тунелях нижніх рівнів, більшість із них були вимкнені дистанційно, адже бойові пошкодження — поодинокі. Обережно, ми можемо витягнути їх для подальшого вивчення."

maxson_bos_vault8:0 "Лігво Калькулятора"
maxson_bos_vault8_desc:0 "Усе веде до цієї кімнати — командного центру Сховища 0. Паладини заходять усередину, і ми виявляємо..."

maxson_bos_vault9:0 "Ангар Буена-Віста"
maxson_bos_vault9_desc:0 "Ми дізналися про місце на захід від Сховища 0 — колишню електростанцію, що колись цікавила Братство."

maxson_bos_dome1:0 "Запечатаний Купол"
maxson_bos_dome1_desc:0 "Боулдер було стерто з карти у Велику Війну, але Купол уцілів. Він і досі височить над руїнами колишнього міста, названого на його честь."

maxson_bos_dome2:0 "Опромінені мешканці"
maxson_bos_dome2_desc:0 "Світляки — найнебезпечніший тип гуль. Руїни роїться ними, і нам доведеться зачистити територію."

maxson_bos_dome3:0 "Бункер Братства: Боулдер"
maxson_bos_dome3_desc:0 "Знайти бункер в післявоєнній Америці — не проблема. А от знайти такий, що підійде нам — дещо складніше."

maxson_bos_dome4:0 "Прорватися до Купола"
maxson_bos_dome4_desc:0 "Хоча структура вистояла перед ядерними вибухами й часом, її все ж можна пробити. Входи до Купола герметично закриті, але ми впевнені — з кількома вибухівками нам вдасться відчинити один із них."

maxson_bos_dome5:0 "Лікування для «Круга»"
maxson_bos_dome5_desc:0 "Одна з головних розробок усередині Купола — лікування побічних ефектів надмірного використання Стелс-боїв. Завершивши дослідження, ми нарешті зможемо вилікувати наших втрачених Братів і Сестер!"

maxson_bos_dome6:0 "Медичні дива"
maxson_bos_dome6_desc:0 "Купол Боулдера — справжнє диво довоєнної медицини. Нашим Писарям потрібно негайно приступити до роботи!"

maxson_bos_dome7:0 "ЗАКС резидент"
maxson_bos_dome7_desc:0 "У Куполі знаходиться один із інтелектів ЗАКС. Він у жалюгідному стані, страждає на провали пам’яті — але у нас вдосталь модулів, аби його відновити й використати для своїх цілей."

maxson_bos_dome8:0 "Закріпитися"
maxson_bos_dome8_desc:0 "Після зачищення останніх кишень спротиву гуляй і патрулювання передмість Боулдера, ми можемо бути впевнені — Купол залишиться під нашим контролем."

maxson_bos_final_hq:0 "Штаб у Колорадо"

maxson_bos_final_contact1:0 "Зв’язатися з Братством Середнього Заходу"

maxson_bos_final_contact2:0 "Зв’язатися з Братством Заходу"

maxson_bos_final_contact3:0 "Зв’язатися з Техаським Братством"
