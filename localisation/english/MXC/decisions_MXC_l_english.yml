#Decisions#

#Circle Of Steel §9#
mxc_circle_schism_start:0 "§9Коло Сталі§!"
mxc_circle_schism_start_desc:0 "Хоч наші загублені Брати і зійшли з розуму, вони досі володіють усіма бойовими навичками та запасом Стелс-Боїв. Час від часу вони атакують наші території випадковими рейдами."
mxc_circle_schism_1:0 "§9Придушити Коло§!"
mxc_circle_schism_1_desc:0 "Полювання на колишніх Братів та їх знищення завдасть удару по нашому бойовому духу. Але якщо ми припинимо витрачати сили на полювання за вигнанцями, зможемо знайти спосіб заповнити втрати у власних рядах."
mxc_circle_schism_2:0 "§9Лікування Їхнього Божевілля§!"
mxc_circle_schism_2_desc:0 "Завдяки медичним дивам Больдерського Купола з’являється надія – ми зможемо вилікувати наших загублених Братів. Проте це потребуватиме часу."

#Robot City §1#
mxc_robot_city_1:0 "§1Зачистити Околиці§!"
mxc_robot_city_1_desc:0 "Робомісто досі в руїнах і кишить різноманітними роботами у стані занепаду. Нам потрібно прорватися крізь хаос до самого центру."
mxc_robot_city_2:0 "§1Забезпечити Контроль Усередині§!"
mxc_robot_city_2_desc:0 "Ми наближаємось до джерела сигналу. Чим довше ми зволікаємо, тим довше ворожі роботи будуть реагувати на цей заклик."
mxc_robot_city_interior_hh_factory:0 "§1Запустити Завод H&H Tool§!"
mxc_robot_city_interior_sams_auto:0 "§1Розібрати Деталі на Сам's Auto Parts§!"
mxc_robot_city_interior_sams_auto_bonus_tt:0 "Запасні частини та креслення від Sam's Auto Parts Bonus"
mxc_robot_city_3:0 "§1Вигнати Докі§!"
mxc_robot_city_3_desc:0 "Ми виявили штаб-квартиру загадкової «Докі». Щоб припинити цю загрозу, потрібно витіснити її та всіх роботів, які підкоряються її голосу."
mxc_robot_city_4:0 "§1Захопити Докі§!"
mxc_robot_city_doki:0 "§1Заклик Докі§!"
mxc_robot_city_doki_desc:0 "Жіночий роботизований голос продовжує надсилати заклик, на який реагують машини. Допоки ми не вимкнемо цей сигнал, контроль над містом залишатиметься примарним."

#Bastion §2#
mxc_scorpions_sting:0 "§2Скорпіон за природою...§!"
mxc_scorpions_sting_desc:0 "Навіть у поразці залишки 'Скорпіонового Жала' готуються до руйнівного відступу. Ми маємо вистежити їх і знищити до того, як вони знищать територію. Лише після цього регіон можна буде вважати безпечним."
mxc_scorpions_a:0 "§2Встановити Блокпости§!"
mxc_scorpions_a_desc:0 "Це потребуватиме певного часу та перенаправлення ресурсів, проте створення блокпостів ускладнить втечу ворога і дозволить нам його загнати в пастку."
mxc_scorpions_b:0 "§2Знищити Дозорних§!"
mxc_scorpions_b_desc:0 "Скорпіони ухиляються від нас завдяки своїм мобільним дозорним. Якщо усунути їх, решта залишиться сліпою."
mxc_scorpions_c:0 "§2Кінець Шляху§!"
mxc_scorpions_c_desc:0 "З обмеженими маршрутами та без розвідки, настав час ударити остаточно – знищити залишки Скорпіонів раз і назавжди."

#Country Flag#
scorpions_stomped:0 "§2Скорпіонів Знищено§!"
scorpion_nature_complete:0 "§2Скорпіони Втекли§!"


#New Sterling §3#

mxc_iron_tithe:0 "§3Найвища Ставка§!"
mxc_iron_tithe_desc:0 "Залишки Залізного Альянсу досі десь там. Якщо ми не діятимемо, хтось інший перехопить їхні контракти."

mxc_bid_a:0 "§3Залізна Ціна§!"
mxc_bid_a_desc:0 "Хоча нам і важко лишати високотехнологічне озброєння в руках найманців, члени Залізного Альянсу шанують контракти – і залишаються на нашій землі, якщо отримують гідну оплату."

mxc_iron_workers:0 "§3Найняти Робітників для Керування Горнами§!"
mxc_iron_workers_desc:0 "Хоча раби, що працювали на горнах, утекли під час нашого вторгнення, самі ковальні Залізного Альянсу здебільшого збереглись. Найнявши кількох пустельників для обробки ресурсів, що лишилися в Нью-Стерлінґу, ми зможемо тимчасово посилити нашу промисловість."

mxc_iron_hiring_a:0 "§3Найняти «Зловісне Братство»§!"
mxc_iron_hiring_a_desc:0 "Хоча більшість загонів Залізного Альянсу було знищено під час нашого наступу, деякі досвідчені підрозділи вціліли та готові воювати на нашому боці – за відповідну плату."

mxc_iron_hiring_b:0 "§3Найняти «Обраних Жнеців»§!"
mxc_iron_hiring_b_desc:0 "Хоча більшість загонів Залізного Альянсу було знищено під час нашого наступу, деякі досвідчені підрозділи вціліли та готові воювати на нашому боці – за відповідну плату."

mxc_iron_hiring_c:0 "§3Найняти «Кігті Завоювання»§!"
mxc_iron_hiring_c_desc:0 "Хоча більшість загонів Залізного Альянсу було знищено під час нашого наступу, деякі досвідчені підрозділи вціліли та готові воювати на нашому боці – за відповідну плату."

