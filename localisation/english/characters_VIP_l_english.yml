VIP_VERONICA_FAUST_NAME: "Вероніка Фауст"
VIP_VERONICA_FAUST_DESC: "Нащадок першого лідера Гадюк, Джонатана Фауста, Вероніка очолила невелике відгалуження фракції після того, як Гадюки розпорошились по пустці. Провівши свою групу до Невади, невеликий загін оселився серед посушливих, безлюдних рівнин пустелі. Менше ніж за десятиліття Вероніка знову зробила Гадюк силою, з якою слід рахуватись у Неваді, ведучи безперервну боротьбу з Рейнджерами та НКР. Хоча тиск з боку НКР з часом зменшився, інші сили вже націлились на територію, яку Гадюки називають домом. Якщо вона хоче, щоб спадщина її предка жила далі – на неї чекає запекла боротьба."

