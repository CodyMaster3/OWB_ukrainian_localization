l_english:
  # Focuses
ncr_red_disunion: "Стан розбрату"
ncr_red_disunion_desc: "Південна Каліфорнія палає, Когрес відправили на спочинок, і, здається, Реддінґ — останнє місце, де не правлять безжальні загарбники або цинічні пройдисвіти."

ncr_red_open_the_cache: "Відкрити тайники"
ncr_red_open_the_cache_desc: "Коли шерифи Реддінґа стали більше охоронцями порядку, ніж солдатами, ми сховали найважчу зброю. Тепер, коли біда стоїть на порозі, нам потрібне озброєння з минулого Реддінґа."

ncr_red_reddings_rally: "Бойовий клич Реддінґа"
ncr_red_reddings_rally_desc: "Ці південці збожеволіли. Реддінґ не заснував республіку, але ми щиро її полюбили. Спокійно дивитись, як вона згорає — не в нашій природі."

ncr_red_send_em_packing: "Відправити їх геть"
ncr_red_send_em_packing_desc: "Прихильники муризму серед солдат та так звані «пацифісти» зі Спадкоємців мають піти! Реддінґ не стане притулком для тих, хто вбиває республіку."

ncr_red_begin_the_talks: "Домовитись про нову угоду"
ncr_red_begin_the_talks_desc: "Регуляції часів Танді задушили найкращі підприємства Реддінґа в бюрократії. Нова угода з баронами розв’яже нам руки."

ncr_red_trade_situation: "Відновити торгівлю"
ncr_red_trade_situation_desc: "Постійні балачки про війну та різанину в Каліфорнії висушили наші торгові шляхи, і потік пак-брамінів став лише спогадом. \n\nЗаспокоймо торгові компанії — покажімо, що Реддінґ — безпечна гавань у часи війни, і хай торгівля знову потече."

ncr_red_shake_dragon_hand: "Потиснути руку дракона"
ncr_red_shake_dragon_hand_desc: "Усе Пустовище знає, що зі Ші краще не жартувати — навіть НКР не змогла їх упокорити! \n\nМи маємо обережно звернутись до Сан-Франциско і домовитись про доступ до їхніх причалів та майбутню торгівлю."

ncr_red_redding_calling: "Реддінґ на зв'язку"
ncr_red_redding_calling_desc: "§4Реддінґ на зв'язку!§! \n\nМісто-укриття вже давно є маяком технологічного майбутнього. Варто надіслати до них красномовного посланця — можливо, ми домовимось про торгівлю в обмін на їхні обчислювальні потужності."

ncr_red_jewel_of_california: "Перлина Каліфорнії"
ncr_red_jewel_of_california_desc: "§YРеддінґ сяє у нічному небі яскравими неоновими вогнями та слугує символом добробуту.§! \n\nВулиці міста гудуть від кроків торговців і безупинного обміну кришками — ми справді створили економічне диво."

ncr_red_arroyo_trade: "Свіжа вода для наших працівників"
ncr_red_arroyo_trade_desc: "Північні племена з Арройо пропонують нам воду в обмін на частину металу з наших шахт. Шахтарі зламали спини, добуваючи цю руду — хай мають розкіш безплатної води."

ncr_red_check_savings: "Перевірити заощадження"
ncr_red_check_savings_desc: "Після перевірки наших рахунків у Центральному банку Реддінґа зʼясувалось, що ми маємо понад сто тисяч у заощадженнях! Щоправда, усі банкноти — новісінькі...\n\nАле це вже деталі, давайте краще святкувати, а не перейматись!"

ncr_red_mercs: "Бійці за нашу справу"
ncr_red_mercs_desc: "Завдяки новому багатству ми можемо трохи розкошувати. \n\nЯкщо Реддінґ втягнеться у війну, нам слід звернутись до найманців з Євріки — може, за кругленьку суму вони приєднаються до нас."

ncr_red_yakuza: "§tПогані дракони§!"
ncr_red_yakuza_desc: "Примітивні рейдери з територій якузи навряд чи вміють вставити лампочку, але битися вони вміють. Якщо відкласти трохи коштів і найняти Наґу з його Поганими Драконами — ми отримаємо справжню грубу силу."

ncr_red_vlt_protectrons: "§3Захисники вулиць§!"
ncr_red_vlt_protectrons_desc: "Мозковиті з Міста-укриття не можуть надати нам своїх людей чи зброю, але можуть відвантажити партію списаних протектронів. Їхня присутність у тилу знищить будь-які ворожі спроби диверсій."

ncr_red_luchadors: "§GОоох§! Луч§Rадори§!"
ncr_red_luchadors_desc: "Гурт кремезних чоловіків завбільшки з ведмедя в яскравих масках і з чужою мовою прийшли до наших воріт, шукаючи бійки. Спершу вони нас не розуміли, але їхня жага до битви подолала мовні бар'єри — і тепер вони в наших рядах."

ncr_red_merc_city: "§G«Армія» Реддінґа§!"
ncr_red_merc_city_desc: "Наші нові сили можуть бути не місцевими, але вже стали невід’ємною частиною нашої юної держави. Пустка ще довго памʼятатиме найманців, що з люттю нищили ворогів Каліфорнії без жалю."

ncr_red_buy_guns_van_graffs: "Нічого не зрівняється з гарною плазмовою"
ncr_red_buy_guns_van_graffs_desc: "Кожен, хто тримав у руках плазмову гвинтівку, розкаже про той страх і трепет, що викликає її тріскуче гудіння. Ван Ґраффи — найочевидніше джерело такої зброї, хоча вони й не з простих... Можливо, варто залагодити все, надіславши до них наших торговців?"

ncr_red_support_calhoun: "Добра людина потребує зброї"
ncr_red_support_calhoun_desc: "Калгун тримається моралі й справедливості як опори свого руху, та відчайдушні часи вимагають відчайдушних дій. \n\nПромова доброї людини не зупинить смерть і не стримає армії. Він мусить діяти проти своїх суперників. То навіщо залишатись осторонь, якщо ми можемо надіслати йому людей, потрібних для перемоги в цій війні за мораль?"

ncr_red_california_bleeding: "§tКаліфорнія стікає кров’ю§!"
ncr_red_california_bleeding_desc: "§tВійна — наш бізнес, і справи йдуть добре!§! \n\nНавіщо обирати бік у цьому конфлікті, якщо можна заробити вдвічі більше, просто підживлюючи обидві сторони в нескінченній війні?"

ncr_red_support_moore: "§gМур — це добре§!"
ncr_red_support_moore_desc: "§gХитрі тирани ніколи не бувають покарані.§! \n\nВисоконагороджена полковниця Мур вирізала собі частку в боротьбі за владу, що роздирає Каліфорнію. Якщо ми хочемо вийти з цього живими, можливо, варто її підтримати?"

ncr_red_congress_in_exile: "Когрес у вигнанні"
ncr_red_congress_in_exile_desc: "Хоча колишній Когрес Нової Каліфорнії був наскрізь просякнутий корупцією, все ще є декілька чесних сенаторів, які шукають притулку від тиранів, що полюють на них. Якщо зібрати достатньо вигнанців — ми можемо створити власний когрес із нуля."

ncr_red_welcome_refuges: "Північний оазис"
ncr_red_welcome_refuges_desc: "Як виявилось, гра на обидва боки війни означає також і подвійну кількість втікачів...\n\nРеддінґ — оазис посеред вогню — ідеальне місце для всіх тих, хто тікає від війни з грошима в руках, які легко можуть стати нашими."

ncr_red_direct_aid: "Надіслати шерифів?"
ncr_red_direct_aid_desc: "Мур просить, аби ми відправили наших шерифів воювати пліч-о-пліч з її шаленими піхотними батальйонами...\n\nПитання, що розколює баронські столи, — чи маємо ми відкрито підтримати її, чи краще залишитись у тіні, доки результат війни не стане очевидним?"

ncr_red_maxwell_initiative: "Ініціатива Максвелла"
ncr_red_maxwell_initiative_desc: "Максвелл, профспілковий ватажок Реддінґа, запропонував витратити час і кошти на відновлення закинутих майстерень, що колись виробляли відбійні молотки й динаміт, — тепер вони могли б створювати зброю. Профспілки постійно болять нам головою, тож, можливо, трохи інвестицій у цю ініціативу вгамує їхню жагу до так званих «базових прав людини»."

ncr_red_flynn_economic_plan: "Економічний план Флінна"
ncr_red_flynn_economic_plan_desc: "Мозок, що його Антон Флінн ховає під своїм капелюхом, створив план, здатний задовольнити бідних і безробітних, надавши їм роботу. \n\nМи можемо відправити новонайнятих працівників на благоустрій пустки під майбутню промислову зону."

ncr_red_lawrence_sheriffs: "Шерифи Лоуренса"
ncr_red_lawrence_sheriffs_desc: "Хоч ми й не маємо потреби в більшій кількості патрулів, самі шерифи невдоволені чисельністю своїх загонів. Лоуренс зголосився надати список з 500 громадян, готових підписати контракт із шерифами за мінімальну платню. Чи приймемо ми цю угоду, чи зіткнемось з наслідками за ігнорування вимог шерифів?"

ncr_red_pacify_sheriffs: "Великий Джим іде до шерифів"
ncr_red_pacify_sheriffs_desc: "Великий Джим — поважна постать у Реддінґу, як серед простих людей, так і серед владних структур. Шерифи дедалі більше невдоволені пануванням баронів через постійні конфлікти з ними. Хто краще за Джима зможе владнати ситуацію? Від імені Флінна він виступить з патріотичною промовою про корені Реддінґа та його майбутнє з баронами. Це точно їх заспокоїть, правда ж?"

ncr_red_pacify_people: "Флінн і Р.Р.Р."
ncr_red_pacify_people_desc: "Флінн вирішив вдатися до показової акції, аби вгамувати голодних і бідних, що скупчились у районах, де шерифи не патрулюють. Тепер він відкрито співпрацює з профспілками, намагаючись заручитись підтримкою виборчого низу. Чи це повністю відріже його від баронів, чи просто розчарує їх — покаже час."

ncr_red_flynn_address: "Звернення Антона Флінна"
ncr_red_flynn_address_desc: "§Y«Ми всі робимо вибір, але зрештою саме вибір робить нас».§! \n\nАнтону Флінну вдалося зібрати натовп з тисяч містян. Чи це було через цікавість, чи щиру підтримку — він і сам не знає. Але всі верстви населення прийшли подивитись, що спричинило такий галас довкола його імені."

ncr_rpr_only_people: "…Лише народ"
ncr_rpr_only_people_desc: "Барони були групою напівприхованих сучасних феодалів, які керували вулицями Реддінґа, наче маріонетками. \n\nМи зрубали голову капіталістичному звіру, але втратили сотні відважних революціонерів, чия жертва назавжди залишиться в пам’яті як мученицька…"

ncr_rpr_sheriff_support: "Слуги народу"
ncr_rpr_sheriff_support_desc: "Старі тирани тримали своїх шерифів і стражів порядку як знаряддя суспільного гніту. Наш перший марш вулицями Реддінґа зустрів град їхніх свинцевих куль. Тепер їм доведеться постати перед судом. \n\nЯкщо ми хочемо, аби закон став чимось доброзичливим, він має служити народу, а не панам."

ncr_rpr_took_baron_stuff: "Народні ранчо"
ncr_rpr_took_baron_stuff_desc: "Брамін-барони тримались за свої маєтки, мов за плоть і кров, і лютували від самої думки податків. Їхня жадібність обернулась проти них. \n\nУсе їхнє майно буде відібране й порівну розподілене між усіма фермерами, які бажають володіти його часткою."

ncr_rpr_support_calhoun: "Праведна боротьба"
ncr_rpr_support_calhoun_desc: "Каліфорнійський Шлях подібний до нашої революції, хоч і не готовий на радикальні кроки задля перемоги. \n\nТа Калгун побачив нашу боротьбу, підтримав справу і бажає надіслати сотні добровольців. \nЧи станемо ми разом до праведної боротьби?"

ncr_rpr_future_of_redding: "Дебати за круглим столом"
ncr_rpr_future_of_redding_desc: "Прийшов час вирішити, яким шляхом піде революція далі. Хоч ми і брати по зброї — розколи вже зʼявляються... \n\nФермери, прихильники доктрини Калгуна, прагнуть децентралізованого уряду. Їм протистоять шахтарі на чолі з Даніелем Максвеллом, які хочуть бачити незалежний Реддінґ."

ncr_rpr_support_farmers: "§GПеревага фермерів§!"
ncr_rpr_support_farmers_desc: "Фермери перемогли в дебатах про майбутнє країни — тисячі вийшли на вулиці, щоб підтримати засадничі принципи руху. \n\nВідтепер Реддінґ не буде місцем для експлуатації робітників і дешевої руди, а стане синонімом свободи від тиранії та моральної справедливості."

ncr_rpr_peoples_militia: "§GНародне ополчення§!"
ncr_rpr_peoples_militia_desc: "Остаточне рішення щодо долі шерифів ухвалено. Кожен із них — злочинець в очах нового уряду й постане перед судом за злочини проти Реддінґа та його народу. \n\nВідтепер уся правоохоронна діяльність належатиме нашому ополченню, а рішення ухвалюватимуться в інтересах людей."

ncr_rpr_people_of_california: "§GПовстаньте, працівники Каліфорнії§!"
ncr_rpr_people_of_california_desc: "§GПовстаньте, працівники Каліфорнії!§! Пригноблені й зраджені заслуговують кращого, ніж черговий фашистський демагог! Ідіть геть від тиранічних гнобителів — у безпеку Реддінґа! Ми покажемо Мур, як це — бути по інший бік гвинтівки, а не сидіти днями в урядовій будівлі, руйнуючи життя чоловікам і жінкам."

ncr_rpr_redding_tunnels_hide: "§GВійна в тунелях§!"
ncr_rpr_redding_tunnels_hide_desc: "Тирани з Каліфорнії наступають і лишають за собою випалену землю. Але є те, чого вони не очікують — підземні борці за свободу, що прокладатимуть шлях крізь пустку, підриваючи ворожі операції!"

ncr_rpr_invite_followers: "Носії ідеалів Дгарми"
ncr_rpr_invite_followers_desc: "Спадкоємці — доброзичлива сила, що допомагає Пустці, живучи лише з пожертв. Вони — одні з небагатьох справді добрих душ на цій випаленій землі. Вони прибувають до Реддінґа, щоб допомогти нам і поширити вчення Дгарми, яке колись ніс Арадеш."

ncr_rpr_ranch_2_hospital: "Перша лікарня Дгарми"
ncr_rpr_ranch_2_hospital_desc: "Спадкоємці вирішили заснувати лікарню на околицях Реддінґа, там, де колись був старий ранчо Антона Флінна. Давайте розберемо баронський маєток до цеглини — і побудуємо там щось, що рятує життя, а не наживається на них."

ncr_rpr_support_miners: "§gПрезидент Максвелл§!"
ncr_rpr_support_miners_desc: "Президент Максвелл піднявся серед хаосу заворушень як посередник. Як голова Профспілки шахтарів Реддінґа, він був поза критикою радикалів — бо роками боровся за їхню справу. Шахтарі звернулись до нього за керівництвом, і він запропонував бездоганний план захоплення президентської посади без кровопролиття."

ncr_rpr_wanamingo_mine: "§gСпадок шахт Ванамінґо§!"
ncr_rpr_wanamingo_mine_desc: "Шахти Реддінґа завжди мали купу проблем. Найвідомішою стала навала чужинських істот у велику шахту Ванамінґо. Тоді мер Аскорті вирішив, що краще продати шахту й забути про загиблих робітників, ніж вирішити проблему. Тож згадаймо полеглих — і піднімемо зброю проти наших ворогів."

ncr_rpr_our_protectors: "§gЗахисники простого люду§!"
ncr_rpr_our_protectors_desc: "Можливо, саме шерифи спричинили конфлікт, що привів до загибелі людей під час заворушень у Реддінґу, але вони лише виконували накази. Давайте засудимо того, хто віддав наказ про бійню, і дамо шерифам нову мету. Викидати їх — значить марнувати корисну силу."

ncr_rpr_redding_tunnels_build: "§gЦі чоботи створені для ходіння§!"
ncr_rpr_redding_tunnels_build_desc: "У покинутій шахті знайшли купу застарілого й непридатного шахтарського обладнання. А як щодо того, щоб не викидати старий нітр і металеві машини, а переробити їх на саморобні вибухівки? \n\n§7Ці інструменти створені для вибухів — і саме цим вони й займуться.§!"

ncr_rpr_good_man: "Добра людина..."
ncr_rpr_good_man_desc: "Калгун продовжує боротьбу проти тих, хто прагне закувати Каліфорнію в кайдани. Дехто вважає, що нам варто забути розбіжності й обʼєднатися в спільній боротьбі. \nІнші вважають, що краще допомогти їм як зможемо, а про решту вирішити після війни. Останнє слово — за радою."

ncr_rpr_good_man_needs_us: "...Потребує нас"
ncr_rpr_good_man_needs_us_desc: "Калгун не зможе вести свою моральну війну наодинці! Ми маємо відправити наших чоловіків і жінок, щоб битися пліч-о-пліч з його святими революціонерами! Віднині ми — не окремі сили, ми — єдине ціле!"

ncr_rpr_good_man_needs_help: "...Потребує нашої допомоги"
ncr_rpr_good_man_needs_help_desc: "Калгун був доброю душею й лідером, та, на жаль, зазнав поразки від фашистських демагогів, які прикриваються миром. Ми будемо боротись за власний мир — знищивши тонко завуальовану диктатуру Мур! Хай живе Калгун! Хай живе Каліфорнійський Шлях!"

ncr_rpr_peoples_califronia: "§RНародна Каліфорнія§!"
ncr_rpr_peoples_califronia_desc: "Слава народу! Слава революції! Слава республіці! Слава нашому новонародженому Союзу! \n\nМи досягли остаточної перемоги й заснували нашу славну та рівну державу!"

###Redding Sheriffs Tree###
ncr_srf_baron_trials: "Суд над баронами"
ncr_srf_baron_trials_desc: "Барони — першопричина глибоко вкоріненої корупції в Реддінґу. \nТрадиція велить нам їм служити, але роки гноблення під їхнім правлінням зробили багатьох із нас байдужими до їхньої буцімто невинності. Ми просто позбудемося баронів і підготуємося до фракцій, які хочуть знищити Реддінґ у громадянській війні."

ncr_srf_people_for_sheriffs: "Шерифи та народ"
ncr_srf_people_for_sheriffs_desc: "Потреби шерифів і тих, хто з ними співпрацює, важливіші для успіху Реддінґа, ніж потреби простого люду. Без боєприпасів ми станемо беззахисними — а з таким спорядженням, як зараз, навіть відповісти не зможемо."

ncr_srf_the_old_guard: "Старе, та золоте"
ncr_srf_the_old_guard_desc: "Молодь у лавах шерифів може й не погоджується, але старі методи — найкращі. К чорту нові поблажки й відмову від традицій. Так було завжди. Наші ветерани покажуть новобранцям, що означає бути справжнім шерифом."

ncr_srf_strong_redding: "Шлях до сильного Реддінґа"
ncr_srf_strong_redding_desc: "Реддінґ ніколи не стане технологічним дивом у Пустці — тож давайте будемо реалістами. Нам потрібні не модні радіо, а більше зброї та інструментів. На війні важлива не технологічність рушниць, а кількість у руках."

ncr_srf_old_dog: "Старий пес..."
ncr_srf_old_dog_desc: "Старий пес навряд чи вигадає нову тактику для Пустки, але іноді надійність важливіша за новації. Наші ветерани будуть муштрувати новобранців так, як учили їх самих десятки років тому, зберігаючи перевірені традиції."

ncr_srf_and_new_tricks: "...І нові фокуси"
ncr_srf_and_new_tricks_desc: "Кажуть, старого пса не навчиш нових фокусів... Але можна дати йому блискучий новенький лазерний карабін — і він не гірше впорається. Ван Ґраффи лишаються ворожими, та щомісячна доза кришок, що ми їм шлемо, не лишає їх байдужими до нашого попиту на зброю."

ncr_srf_welcome_weaponsmiths: "Вітайте Збройників"
ncr_srf_welcome_weaponsmiths_desc: "Збройники — приємні ділові партнери. Вони завжди мають на руках вражаючу зброю власного виробництва. А чому б не заманити їх у Реддінґ, запропонувавши безкоштовну ділянку землі та зниження податків?"

ncr_srf_protected_not_isolated: "Захищені, не ізольовані"
ncr_srf_protected_not_isolated_desc: "Фракційні війни в Каліфорнії вже стукають у двері Реддінґа. Чому б нам не створити власний союз, замість підкорятись комусь? Хто б не хотів битися пліч-о-пліч з тими, хто повалив баронів?"

ncr_srf_baron_stashes: "Благословенні миротворці"
ncr_srf_baron_stashes_desc: "Револьвери, ковбойські гвинтівки та дробовики — невід’ємна частина життя в Реддінґу. Кожна родина має свою спадкову рушницю. Але з огляду на загрози ми не можемо залишатись без зброї. Барони заховали тисячі стволів по своїх ранчо — знайдімо їх і викопаймо!"

ncr_srf_ranches_2_workshops: "Краще застосування"
ncr_srf_ranches_2_workshops_desc: "Після арешту баронів їхні маєтки залишились пустими й припадали пилом, поки ми займались судами. Чому б не повернути ці землі для майбутнього Реддінґа — з ціллю найвищої важливості: виробництва зброї?"

ncr_srf_redding_stronghold: "Стояти непохитно"
ncr_srf_redding_stronghold_desc: "Реддінґ — молода держава, та кордон ми завжди тримали впевнено. Ще з часів, коли містом керував Аскорті, кожен справжній реддінґець вмів тримати гвинтівку проти тиранів. Покажімо ворогам, на що ми здатні — й утримаємо рубежі міцніше, ніж вони здатні уявити."

### Новий курс

ncr_srf_pardon_some_barons: "Вони нам потрібні"
ncr_srf_pardon_some_barons_desc: "Більшість баронів — безсердечні злочинці, але є й ті, хто може зміцнити незалежність Реддінґа. Старі шерифи хочуть сховатися в очікуванні нових війн, та ми не виживемо без фінансування від баронів, що готові до співпраці."

ncr_srf_sheriffs_for_people: "Народ і шерифи"
ncr_srf_sheriffs_for_people_desc: "Народ Реддінґа охопила тривога в ці складні часи. Щоб знову запрацювали шахти й фабрики, ми маємо повернути довіру до влади. Якщо не владнати заворушення — втратимо змогу підготуватись до прийдешніх загроз."

ncr_srf_new_outlook: "Реддінґ має змінитися"
ncr_srf_new_outlook_desc: "Занадто довго шерифами керували старі й прогнилі душі. Якщо ми не змінемо колоду, з якою граємо, доля Реддінґа буде такою ж гнилою. Наше майбутнє — не в руках злочинців, а в спільному управлінні."

ncr_srf_cooperative_redding: "Шлях до нового Реддінґа"
ncr_srf_cooperative_redding_desc: "Більшість баронів — пихаті аристократи з Пустки, але дехто з них — справжні підприємці. Декілька запропонували нам земельні угоди навколо колишніх копалень Коковіф."

ncr_srf_use_baron_connection: "Баронські зв’язки"
ncr_srf_use_baron_connection_desc: "Барони, яких ми відпустили, готові до співпраці в межах контрактів, що стосуються їхніх робітників. Колись їхні ранчо були жахливими, але нам обіцяли, що тепер усю працю буде залучено етично."

ncr_srf_revive_redding: "Невелика ціна"
ncr_srf_revive_redding_desc: "Схоже, нам пощастило з новими, поступливими баронами. Вони хочуть продавати нам земельні ділянки за мізерну кількість кришок. Це ж не хабар, правда?"

ncr_srf_thinking_big: "Думати масштабно"
ncr_srf_thinking_big_desc: "Ми більше не можемо триматись старих, хибних альянсів з принципу. Нове покоління баронів довело, що ми можемо покладатись на добру волю Реддінґа та незалежних сусідів."

ncr_srf_coop_economy: "Е.Д.В.К."
ncr_srf_coop_economy_desc: "Економічна Договірна Вісімка Кола (ЕДВК) увійде в аннали історії як найграндіозніший і наймасштабніший контракт, який будь-коли бачили Пустки. Наші сусіди тільки виграють — і жодних мінусів!"

ncr_srf_calm_old_guard: "Домовитись зі старою гвардією"
ncr_srf_calm_old_guard_desc: "Стара гвардія була нашими братами, але нам доведеться з нею розібратись, поки все не вийшло з-під контролю. Просте повідомлення про вихід на пенсію має спрацювати... Сподіваємось, що старі звички помруть молодими."

ncr_srf_new_sheriffs: "Нова кров для нового Реддінґа"
ncr_srf_new_sheriffs_desc: "У нашій лінії оборони виникають проломи — потрібно знайти рішення для нестачі людських ресурсів. Кожен чоловік і жінка можуть стати волонтером у лави шерифів. Чому б не звернутись до них із закликом?"

ncr_srf_redding_of_the_future: "Новий Реддінґ"
ncr_srf_redding_of_the_future_desc: "Ми відкинули старе та впровадили нову кров і нові ідеї в нашій великій нації. Ми не просто замалювали шрами — ми їх повністю зцілили!"

ncr_srf_redding_independence: "На чиєму ти боці?"
ncr_srf_redding_independence_desc: "§5Ой, шерифи, слухайте новину...§! \n\nМій батько був шерифом, і я — син шерифа. Ми завжди прагнули Реддінґа без податків і законів, що НКР нав'язала нашому штату. І от ми здобули тріумф, який увійде в історію."

ncr_srf_redding_calhoun: "Добра людина потребує великого ствола"
ncr_srf_redding_calhoun_desc: "Калгун тримається за справедливість, як за серце, але відчайдушні часи вимагають, щоб ми приходили озброєними. \n\nПромова доброї людини не ув’язнить воєнних злочинців і не гарантує справедливість у цій каліфорнійській різанині. Він, можливо, хіпі, але він — наш найкращий шанс на вільне майбутнє Реддінґа."

ncr_srf_redding_moore: "Такі самі солдати, як і ми"
ncr_srf_redding_moore_desc: "§gКраще, щоб тебе боялись, ніж любили.§! \n\nПолковниця Мур прорубала собі шлях крізь громадянську війну, не моргнувши. Вона веде за собою справжніх солдатів із справжніми ідеалами. Ми обидва цінуємо суворе виконання закону — можливо, настав час домовитись, перш ніж кровопролиття охопить увесь Реддінґ."

ncr_srf_redding_none: "Борись проти влади"
ncr_srf_redding_none_desc: "§RНезалежність — вроджена властивість людини.§! \n\nМи тяжко боролись за незалежний Реддінґ, то чому тепер маємо схилятись перед кимось, крім свободи? Ми не дозволимо правити нам ані пацифістським ідеалістам, ані диктаторам у мундирі. Реддінґ прокладе власний шлях — і прийдешні покоління подякують нам за цю жертву."
###Redding Sheriffs Tree###

###Flynn path###
ncr_fln_strings_break_free: "Нитки розриваються"
ncr_fln_strings_break_free_desc: "Люди називали мене «маріонеткою баронів». І, якщо чесно, вони мали підстави для цього прізвиська.\nАле ця маріонетка готова розірвати свої нитки."

ncr_fln_deal_with_old_barons: "Щурі"
ncr_fln_deal_with_old_barons_desc: "Що стоїть на заваді Істинній Людині?\n§RЩурі.§!\nТі, хто заважає Істинній Людині бути вільною та реалізувати свій потенціал, не заслуговують іншого імені. \n§RІ для них немає місця в суспільстві, яке я створю.§!"

ncr_fln_new_generation: "Нове покоління"
ncr_fln_new_generation_desc: "Баронів, що стояли на заваді Істинній Людині, прибрали. Але залишати вакуум влади — не найкраща ідея. \nНе всі барони — щурі. Є й ті, хто відданий мені й моїм ідеям. Саме вони займуть звільнені місця."

ncr_fln_praise_farmers: "Слава фермерам"
ncr_fln_praise_farmers_desc: "§GСлава фермерам!§!\nІ їхній тяжкій праці, що годує Істинну Людину.§!"

ncr_fln_praise_miners: "Слава шахтарям"
ncr_fln_praise_miners_desc: "§gСлава шахтарям!§!\nСаме завдяки їхній праці наше місто почало зростати та процвітати."

ncr_fln_no_shady_or_boneyard: "Слава робітникові"
ncr_fln_no_shady_or_boneyard_desc: "Я поважаю людину праці. \nХто, як не вона, є уособленням справжньої людини?\nЯ не повторю помилок баронів — не ігноруватиму їхні потреби."

ncr_fln_deal_with_old_sheriffs: "Менші щурі"
ncr_fln_deal_with_old_sheriffs_desc: "Я не маю нічого проти шерифів. Але жирноголові зі старої гвардії називають мене «божевільним» і пророкують, що я знищу Реддінґ.\nМені байдуже на їхні слова. Але ці слова можуть перейти в дії. А тих, хто заважає Істинній Людині, я називаю щурами. \n§RА що ми робимо зі щурами?§!"

ncr_fln_contact_oconnell: "Істинна Людина серед шерифів"
ncr_fln_contact_oconnell_desc: "Старий Лоуренс протримався до останнього, але і він упав — разом зі своєю старою гвардією.\nСуспільство Істинної Людини не потребує тих, хто не бажає змінюватися. А О’Коннелл — згоден зі мною. Тому він і стає головним шерифом."

ncr_fln_only_man: "§OЛише Людина§!"
ncr_fln_only_man_desc: "§OІстинна людина — це вільна людина.§!\nІ тепер, позбувшись щурів у Реддінґу, істинні люди нарешті можуть дихати вільно."

ncr_fln_parasites_among_us: "Хто паразити?"
ncr_fln_parasites_among_us_desc: "§YЧи кожен є істинною людиною?§!\nНа жаль, ні.\nСвобода — це дар для одних і згуба для інших. Коли людина отримує свободу, вона може занапастити себе й перетворитися на паразита.\n§RА паразити дістають ту саму долю, що й щурі.§!"

ncr_fln_the_fate_of_parasites: "Доля паразитів"
ncr_fln_the_fate_of_parasites_desc: "Покінчивши з паразитами в Реддінґу, настав час вирішити долю паразитів Каліфорнії та визначити, що чекає їх у новому суспільстві."

ncr_fln_free_from_parasites: "Вільні від паразитів"
ncr_fln_free_from_parasites_desc: "§YПозбутися паразитів повністю неможливо.§!\nТа ми зробили перший важливий крок — і істинна людина може вільно зітхнути… хоча б поки що."

ncr_fln_true_man_inside: "§YШлях до суспільства Істинної Людини§!"
ncr_fln_true_man_inside_desc: "Шлях до суспільства істинної людини — нелегкий. Але страждання — це необхідна частина становлення істинної людини."

ncr_fln_free_society: "Ціна свободи"
ncr_fln_free_society_desc: "Той, хто думає, що шлях істинної людини — легкий, є дурнем.\nПопереду багато праці і ще більше §Rжертв§!, щоб здобути справжню свободу."

ncr_fln_free_science: "Тріумф розуму"
ncr_fln_free_science_desc: "§YІстинна людина — розумна людина.§!\nІз цим, без сумніву, погодяться навіть вчені Анклаву."

ncr_fln_reject_morality: "§RНаука не зупиняється§!"
ncr_fln_reject_morality_desc: "§RНеморальні досліди?§!\n§RЕксперименти над людьми та мутантами?§!\nІстинна людина не зупиняється перед такими дрібницями, як мораль чи етика, якщо вони заважають її розвитку."

ncr_fln_free_industry: "Тріумф ідей"
ncr_fln_free_industry_desc: "§YІстинна людина — творча людина.§!\nУявляй і створюй. Вивільни свій істинний потенціал."

ncr_fln_free_projects: "Проєкт оновлення Реддінґа"
ncr_fln_free_projects_desc: "Проєкт оновлення Реддінґа останнім часом припадав пилом через брак ресурсів. Але завдяки підтримці Міста-укриття, Реддінґ знову засяє новими барвами."

ncr_fln_parasites_around_us: "Щурі довкола нас"
ncr_fln_parasites_around_us_desc: "Ми оточені щурами, що готові будь-якої миті відібрати свободу в істинної людини. Істинні люди мають бути готові захищати своє право на висловлення."

ncr_fln_call_the_true_man: "Поклик істинної людини"
ncr_fln_call_the_true_man_desc: "§YПрокиньтесь, істинні люди.\nЩурі не чекатимуть, поки ви почнете битися.§!"

ncr_fln_weaken_the_parasites: "§GЗброя істинної людини§!"
ncr_fln_weaken_the_parasites_desc: "Я завжди мав слабкість до енергетичної зброї, особливо до плазмової. І тепер, завдяки угоді з Ван Ґраффами, усі істинні люди зможуть поділяти моє захоплення."

ncr_fln_redding_shrugged: "§YДень, коли Істинна Людина знизала плечима§!"
ncr_fln_redding_shrugged_desc: ""

#Expansion
ncr_fln_true_man_around: "Істинна Людина поруч"
ncr_fln_true_man_around_desc: "Можливо, я був надто песимістичним, коли казав, що ми оточені щурами.\nТа істинні люди — також довкола. Треба лише придивитись уважніше."

ncr_fln_ally_reno: "Істинна Людина в Нью-Ріно"
ncr_fln_ally_reno_desc: "Нью-Ріно — це місто гріха й розпусти.\nДехто справедливо зауважить, що це — місто паразитів, але навіть у смороді можна знайти істинну людину… наприклад, Ван Ґраффів."

ncr_fln_leader_of_reno: "Плазма для Істинної Людини"
ncr_fln_leader_of_reno_desc: "§GПлазма — це зброя істинної людини.§!\nЧому?\n§YБо мені вона подобається.§!"

ncr_fln_ally_vault_city: "Істинна Людина в Місті-укритті"
ncr_fln_ally_vault_city_desc: "Місто, збудоване істинними людьми.\nХоча я й не схвалюю їхньої політики щодо мутантів, це можна проігнорувати."

ncr_fln_buff_vault_city: "План оновлення Реддінґа"
ncr_fln_buff_vault_city_desc: "Ми уклали вкрай вигідну угоду з містом Санкчуарі щодо постачання ресурсів. Вони стануть у пригоді для одного дуже важливого проєкту."

ncr_fln_true_man_from_distant_lands: "Великі уми мислять подібно"
ncr_fln_true_man_from_distant_lands_desc: "§YТодд Гаутцер.§!\nЯ багато чув про цього чоловіка — і тішусь, що десь там є людина, яка створила спільноту для істинної людини."

ncr_fln_ally_arroyo: "Істинна Людина з Арройо"
ncr_fln_ally_arroyo_desc: "Саме він — Обранець — уособлює істинну людину. Хоч зараз він і мандрує, його народ не менш цінний."

ncr_fln_choosen_one: "Безумство Інвестора"
ncr_fln_choosen_one_desc: "Як показав час, проєкт Інвестора був невдалим.\nАле паразитів довкола повно, і його ідеї дуже корисні для того, щоб використати паразитів на благо істинної людини."

ncr_fln_ally_shi: "Сплячий дракон"
ncr_fln_ally_shi_desc: "Під час конфлікту з НКР Ші зберігали обережність і спокій. \nТа тепер їм пора обрати сторону.\n§YСторону Істинних Людей.§!"

ncr_fln_buff_shi: "Крила дракона"
ncr_fln_buff_shi_desc: "Війна за визволення істинних людей від щурів Каліфорнії була непростою як для нас, так і для союзників. Ші хочуть компенсацію за участь у боротьбі.\nЇхній запит: контроль над портовим містом Максон — для розширення Породистих. Що вони пропонують натомість? Доступ до креслень вертіптахів!\n§YМи тепер літаємо!§!"

ncr_fln_the_threat_for_true_man: "Обʼєднати істинних людей Каліфорнії"
ncr_fln_the_threat_for_true_man_desc: "§YПрийшов час, дорогі істинні люди, взяти долю в свої руки й знищити щурів Каліфорнії.§!"

ncr_fln_the_last_threat_for_true_man: "Єдине §R«Треба»§!"
ncr_fln_the_last_threat_for_true_man_desc: "Я звинувачував багатьох у тому, що вони вказували людям, що §R«треба»§! робити. Та сьогодні, у ці важкі часи, я порушу своє правило й звернуся до вас, істинних людей Каліфорнії. Легіон наступає — і це ворог усього, за що ми боролись.\nТож скажу вам одне: ми §Rповинні§! знищити останнього щура, що стоїть між нами та світом істинної людини."

  ###Flynn path###

# Redding Events
ncr_red.1.t: "Приєднуйся — або згинь!"
ncr_red.1.d: "Антон Флінн мовчки відзначив абсурдність того, що він зараз збирався зробити. У звичайний день в «Малам’ют Салуні» було не більше ніж п’яні бійки та розквіт проституції. Але сьогодні, можливо, це місце ввійде до підручників з історії. Зробивши ковток віскі, губернатор почав.\n\n«Республіка колись була прекрасною мрією — мрією чоловіків і жінок, які разом будували краще майбутнє. Реддінґ був гордим учасником цього союзу, попри жертви, яких це потребувало.»\n\nКілька схвальних кивків і бурмотіння з натовпу підштовхнули Флінна продовжити.\n\n«Але зараз я не засуджу тих, хто вважає, що Реддінґу було б краще на самоті. Сам часто думаю про це. Та бачити, як Республіка стікає кров’ю — не приносить мені радості. Можливо, ця мрія, давно згасла, досі живе десь у мені.»\n\nСлужителі закону в натовпі кивнули.\n\n«Та зараз мені очевидно — Мур та її подібні ніколи не поділяли нашої мрії. Спалення Когресу, постійний надзвичайний стан… ми всі знаємо, куди це веде. Ми не раби прапора Республіки, а слуги її принципів.»\n\nДехто з шахтарів вигукнув у підтримку.\n\n«А Калгун не кращий. Його Республіка забере в тих, хто обробляє землю, аби нагодувати тих, хто ніколи в житті не працював. Він обкладе податками чоловіків і жінок, які годують республіку, до самої голодної смерті.»\n\nФермери заголосили в унісон.\n\n«Та я бачу інший шлях — для Реддінґа й для Республіки. Справжні патріоти не забули про давню мрію й прагнуть знову заспівати її пісню. Не тільки на півночі — від Дейглоу до Боуньярду, до Шейді-Сендс — прості люди щиро ненавидять тих, хто хоче збити Республіку з її доленосного курсу.»\n\nКрики підтримки лунали з усіх боків. Антон навіть дозволив собі посмішку, перш ніж продовжити.\n\n«Реддінґ не сидітиме склавши руки. Я закликаю вас — чоловіки й жінки півночі — встаньте. Заспівайте про нашу мрію так голосно, щоб навіть Мур почула вас, щоб Калгун не міг вас ігнорувати, щоб уся Каліфорнія приєдналась до нас у відродженні справжньої республіки!»\n\nФлінн підняв келих і одним ковтком випив усе віскі."
ncr_red.1.a: "Флінн! Флінн! Флінн!"

ncr_red.3.t: "Ніч, коли спалахнув вогонь"

ncr_red.5.t: "Звернення Антона Флінна до Реддінґа"
ncr_red.5.d: "Антон Флінн із видимим роздратуванням читав аркуш, на якому барони написали промову для сьогоднішнього виступу. «Яка ж нудота», подумав Флінн. «Сьогодні ми зібрались тут — бла-бла-бла — подолали складнощі — бла-бла — дивимось у майбутнє. І я маю виголосити це лайно перед людьми?»\nАнтон тяжко зітхнув. Багато хто вважав його маріонеткою баронів, «балакучою головою», і Флінна це не надто турбувало — поки це йшло йому на користь.\nАле одна думка останнім часом усе частіше прослизала в його свідомість: «Вони ж нічого не зробили. Саме моє планування та праця допомогли Реддінґу піднятись після кризи. Хіба я не заслуговую на все те, за що ми з багатьма так тяжко боролись?» Раніше він гнав цю думку геть, але перед самим виступом почав чіплятись за неї. «У мене є шанс», подумав Флінн. «Великий Джим та О’Коннелл вже натякнули, що підтримають мене. Чи варто ризикнути? А може, лишити все, як є?»"
# ncr_red.5.a: 
ncr_red.5.b: "Мені не потрібна ця промова, я скажу те, що думаю."

ncr_red.7.t: "Прибуття Моссмена"
ncr_red.7.d: "Ми вітали людей з усіх верств життя, тож рано чи пізно мали натрапити на важливого політичного втікача. Моссмен прибув з групою вірних соратників, утікаючи від ворогів. За ним тягнеться шлейф історії всієї Каліфорнії — від улюбленця народу до несвідомого терориста, чиї дії навряд чи можна назвати розсудливими.\n\nПитання на вустах усіх: чи ризикнути гнівом Мур, прихистивши його, чи видати? Чи зможе він змінитись і приєднатися до нашої боротьби? Чи зникне, як і багато інших до нього?"
ncr_red.7.a: "Ласкаво просимо, Моссмене..."
ncr_red.7.b: "Цікаво, скільки Мур заплатить за його голову?"

ncr_red.8.t: "Барони пропонують відправити шерифів"
ncr_red.8.d: "Мур поставила нас перед вибором: або ми приєднуємось до її армії й бʼємось пліч-о-пліч, або підтримуємо її фінансово. Один варіант коштує життів, інший — висушить кишені наших громадян. Обидві сторони мають аргументи, але чи готові ми справді присягнути Мур? А що з матерями й батьками шерифів, які загинуть у цій безглуздій війні? Чи заслуговують вони на спокій, знаючи, що їхні діти не повернуться?"
ncr_red.8.a: "Це потрібно зробити"
ncr_red.8.b: "Вони мають рацію — війна не для Реддінґа"

ncr_red.9.t: "Дебати за круглим столом"
ncr_red.9.d: "Питання про майбутнє Реддінґа непокоїло кожного патріота. Війна проти тиранічних баронів завершилася перемогою народу. Але ніхто не був готовий повністю їх замінити — вони були вкорінені в кожному аспекті Реддінґа!\n\nУ цьому розколі виникли два табори: Шахтарі та Фермери. Перші — коаліція профспілок, які роками боролись за права реддінґських гірників, очолювана харизматичним лідером на ім’я Максвелл. Другі — велика, хоч і неформальна група обурених сільськогосподарських робітників і безробітних громадян.\n\nМаксвелл вів суперечки з десятками фермерських делегатів, намагаючись переконати їх у перевагах менш радикального уряду. Дебати тривали днями, наповнені обструкціями й філібастером, але рішення — за народом. Кому вони віддадуть голос?"
ncr_red.9.a: "Ми підтримуємо фермерів!"
ncr_red.9.b: "Шахтарі набагато надійніші."

ncr_red.10.t: "Народ Реддінґа просить єдності"
ncr_red.10.d: "Політична партія «Фермери» взяла владу в Реддінґу, і поки що нічого не свідчить, що ці люди — не добрі душі. Вони надіслали посланця до Боуньярду, просячи приєднання до нашої справи.\n\nБільше бійців на передовій проти тиранії Мур — хіба це погано?"
ncr_red.10.a: "Вітаємо вас як друзів!"

ncr_red.11.t: "Народ Реддінґа хоче приєднатися до нашої справи"
ncr_red.11.d: "Реддінґ подав петицію про вступ у нашу війну проти Мур. Вони бажають воювати разом з вірними бійцями Калгуна — і ми радо вітаємо їхніх партизанів, що принесуть пекло тиранам!"
ncr_red.11.a: "Вперед, разом."

ncr_red.12.t: "Незалежний Реддінґ?"
ncr_red.12.d: "Група законників у пишних стетсонах прийшла до наших дверей із простим запитанням: чи буде Реддінґ визнано незалежною державою, чи це просто ще одна територія, за яку ми невдовзі воюватимемо?\nХто знає, до чого призведе це визнання... Але зараз це рішення важливе для нашого майбутнього. Ми хочемо нового ворога — чи можливого союзника?"
ncr_red.12.a: "Мені подобається дзенькіт їхніх шпор."
ncr_red.12.b: "Що? Це якийсь жарт?"

ncr_red.13.t: "Калгун погоджується"
ncr_red.13.d: "Калгун надіслав відповідь на нашу пропозицію! Він погодився підписати декларацію, яка визнає Реддінґ вільною територією, незалежною від Нової Каліфорнійської Республіки. Він може не повністю поділяти наші ідеї, але вочевидь розуміє силу дипломатії — цього поки що достатньо."
ncr_red.13.a: "Нарешті!"

ncr_red.14.t: "Мур погоджується"
ncr_red.14.d: "Схоже, наша пропозиція до Калгуна пройшла повз його вуха — невже він щось замислив?! На щастя, завжди надійна Мур відповіла на наш заклик до незалежності й дала нам чітку згоду. Її умови були суворіші, ніж ми розраховували, але, здається, це на краще. Завтра сонце зійде над вільним і незалежним Реддінґом!"
ncr_red.14.a: "Яке прекрасне блакитне небо."

ncr_red.15.t: "Реддінґ стоїть сам"
ncr_red.15.d: "Покидьки з південної Каліфорнії плюнули нам в обличчя — обидві наші пропозиції щодо незалежності відхилено... Це не просто образа, це майже оголошення війни. Ми знали, що шлях до свободи буде важким, але не думали, що йтимемо ним наодинці. А втім — кому потрібен мудрагелик або деспотка, щоб дозволити нам бути вільними? Обоє вони — боягузи та негідники. Реддінґ прокладе власний шлях у Пустці — і трава на нашому боці буде зеленішою!"
ncr_red.15.a: "Та хай їм грець."

ncr_red.16.t: "Народ вимагає економічної підтримки"
ncr_red.16.d: "Схоже, інформація про наші приховані запаси просочилася до громадськості — й тепер вони вимагають свою частку."
ncr_red.16.a: "Ми підтримаємо шерифів"
ncr_red.16.b: "Ми підтримаємо робітників"
ncr_red.16.c: "Чому ми маємо витрачати на них гроші?"

red_flynn.1.t: "Істинна Людина"
red_flynn.1.d: "Я хочу запитати вас: у чому сенс людини?\n«Людина §Rмусить§! служити державі», — каже жінка з Шейді-Сендс,\n«Людина §Rмусить§! допомагати ближньому», — каже чоловік із Боуньярду,\n«Людина §Rмусить§! захищати інших від небезпечного знання», — каже паладин з Лост-Гіллс.\nА що скажу я?\n«Людина нікому нічого не винна», — каже Антон Флінн.\nКрізь піт і кров народу Реддінґа ми пройшли кризу громадянської війни — і що сказали барони після всього?\n«Людина §Rмусить§! підкоритись НКР».\nЯ це відкидаю. І хоч мене можуть назвати божевільним — я обираю Реддінґ. Місто, в якому ніхто не казатиме тобі, що ти §Rмусиш§!, бо..."
red_flynn.1.a: "§Y...істинна Людина — вільна Людина.§!"

red_flynn.2.t: "Нитки розриваються"
red_flynn.2.d: "Маріонетка, якою я був, розірвала свої нитки.\nЩо нас чекає тепер, питаєш?\nШлях, який ми обрали, — не з легких, але пам’ятай: істинна людина — це вільна людина, а всіх, хто заважає свободі, слід прибрати.\nШлях істинної людини всіяний жертвами. Але це необхідні жертви. Жертви, на які я готовий піти, щоб створити суспільство істинної людини."
red_flynn.2.a: "§Y«Шлях істинної людини — не з легких»§!"

red_flynn.3.t: "Доля паразитів"
red_flynn.3.d: "§YНемає сенсу знищувати паразитів, бо й вони можуть стати істинною людиною.§!\nЯк це зробити?\nДуже просто — щоб досягти рівня істинної людини, треба працювати над собою. Але паразити відмовляються від саморозвитку і не бажають розкривати свій потенціал. Тому вони просто працюватимуть на благо істинної людини.\nАдже лише через працю можна стати істинною людиною."
red_flynn.3.a: "Паразити працюватимуть на фермах."
red_flynn.3.b: "Паразити працюватимуть на фабриках."

red_flynn.4.t: "День, коли Істинна Людина знизала плечима"
red_flynn.4.d: "І ось настав той день, коли боротьба істинної людини принесла плоди.\nЩурі — Легіон, Мур і Калгун — впали перед обличчям істинної людини й не змогли відібрати її свободу.\nЩо чекає нас тепер, питаєш?\n\n§YНове суспільство.§!\n\nІстинне суспільство.\n\n§YnЛеді й джентльмени, ласкаво просимо...§!"
red_flynn.4.a: ""...до суспільства істинної людини.""

red_flynn.5.t: "Пропозиція для Істинної Людини"
red_flynn.5.d: ""Могутній" Легіон, якого всі боялись, нині — просто жменька жалюгідних легіонерів, які ще думають, що можуть перемогти.\nАле серед усіх цих щурів є один, хто мене зацікавив. [GDH.GetLeader] має потенціал стати Істинною Людиною, хоча наразі він — наш ворог.\nТакі люди не стають на коліна просто так. Але якщо я запропоную йому Баху — землю, яка мене не цікавить, — в обмін на вірність, ми зможемо домовитись."
red_flynn.5.a: ""Подивимось, наскільки істинною людиною є [GDH.GetLeader].""

red_flynn.6.t: "Пропозиція від «Істинної Людини»"
red_flynn.6.d: "[GDH.GetLeader] був шокований падінням Легіону. Ніхто не очікував, що гігант впаде від руки НКР, ослабленої громадянською війною. Але це сталося, і тепер лише Gente Del Sol залишились як останній форпост.\nІ тут раптом з’явився дипломат із Каліфорнійського Суспільства. Від імені Антона Флінна він запропонував угоду: завершити війну та перейти під його крило — в обмін на передачу Бахи."
red_flynn.6.a: "Війна — це бізнес, але не тоді, коли ти програєш."
red_flynn.6.b: "[GDH.GetLeader] не стане на коліна перед цією «Істинною Людиною»."

ncr_red_riots.1.t: "§RЗаворушення в Реддінґу§!"
ncr_red_riots.1.d: "На перший погляд, вулиці Реддінґа здавались спокійними й зібраними, але в провулках і на розі кожного кварталу назрівала буря. Конфлікт вже був на підході.\n\nПоки шерифи перекидалися в покер і пускали пилюку чобітьми, бунтівники планували штурм володінь Баронів. Людям набридли податкові пільги й домовленості, що вигідні тільки еліті — усе це лицемірно називалося "економічним процвітанням", яке, мовляв, «колись дійде» до звичайних мешканців.\n\nУсе почалося з цеглини, кинутої з вікна перукарні, яка влучила у шерифа. Вулиця завмерла, і на горизонті з’явився гуркіт — натовп із червоними очима. Озброєні вилами, цвяхострелами, бітами й дорожніми знаками, вони рушили вперед.\n\nСкрегіт битого скла й крики стали новою нормою для тихого району."
ncr_red_riots.1.a: "Надіслати переговірника."
ncr_red_riots.1.b: "Відкрити вогонь по натовпу!"

ncr_red_riots.2.t: "§RРобітники Реддінґа штурмують ранчо Баронів§!"
ncr_red_riots.2.d: "Десятиліття приниження й експлуатації з боку Баронів зруйнували умови життя тисяч гірників, що мешкали в дешевих бараках Реддінґа.\n\nСьогодні настав день змін: більше ніяких господарів і експлуататорів. Члени профспілки Реддінґських Робітників (R.W.C.) становили основну масу натовпу з факелами та каністрами бензину, що йшов до маєтків своїх поневолювачів.\n\nЛідер Спілки Максвелл сподівався уникнути цього, та попередні мирні спроби ні до чого не призвели. Врешті, небажання Баронів до діалогу змусило робітників побачити в них лише ще одну форму гангстерів — тих самих, що придушували Гарлан у минулі століття."
ncr_red_riots.2.a: "Без панів..."

ncr_red_riots.3.t: "Шерифи арештовують Баронів"
ncr_red_riots.3.d: "Довгий час шерифів вважали кишеньковими охоронцями Баронів. І хоч це було не зовсім правдою, їхні жирні зарплати говорили самі за себе.\n\nАле сьогодні це сприйняття змінилося. Барони раз за разом ігнорували потреби шерифів. Лоуренс пробував діяти дипломатично, але на черговому засіданні прозвучала ідея від анонімного голосу: «Арештуймо їх усіх. Що вони зроблять? Покличуть шерифів? Хахах!»\n\nІ хоча спершу це здалося жартом, у впертих шерифів урвався терпець. Їхні зарплати тепер надходитимуть з кишень Баронів, тільки вже в тюрмі.\n\nОперація пройшла дивовижно швидко. По кілька людей пішли до кожного маєтку — а там, під дулами револьверів, оголосили про арешт."
ncr_red_riots.3.a: "Ми досить грали в цю довгу аферу."

ncr_red_support.1.t: "Реддінґ пропонує зброю"
ncr_red_support.1.desc: "Реддінґ запропонував надіслати нам десятки ящиків, доверху набитих новітнім озброєнням, в обмін на певну суму кепсів. Прийняти й ризикнути заборгувати Баронам? Чи краще знайти власний спосіб поповнення арсеналу?"
ncr_red_support.1.a: "Нам потрібна ця зброя."
ncr_red_support.1.b: "Небезпечно залежати від Баронів."
ncr_red_support.1.c: "Ой, у нас нема грошей. А як щодо позики?"
ncr_red_support.1.d: "На жаль, у нас нема грошей..."

ncr_red_support.2.t: "Мистецтво угоди"
ncr_red_support.2.d: "Схоже, ми проштовхнули угоду — вітаю всіх! Ми позбулись старого військового спорядження й отримали за це непогану суму. Реддінґ ще укладе сотні таких угод із подібними націями-золотошукачами. Розливайте бренді!"
ncr_red_support.2.a: "Хай потечуть долари."

ncr_red_support.3.t: "Позика?"
ncr_red_support.3.d: "Вони просто не змогли собі дозволити нашу зброю, прикро. Але тепер вони пропонують, можливо, кращий варіант — взяти позику, щоб оплатити постачання. Ми не завжди займаємося лихварством, але... може, повернуть вчасно?"
ncr_red_support.3.a: "Не долари, але теж може стати в пригоді."

ncr_red_support.4.t: "Угоду відхилено"
ncr_red_support.4.d: "Невдячні покидьки відмовились від чудової угоди. Вочевидь, їм не потрібні зайві гвинтівки в арсеналі. Ну, згодом самі їх використаємо... Шкода, святкування не буде."
ncr_red_support.4.a: "От халепа."

ncr_red_support.5.t: "Реддінґ пропонує продати ліки"
ncr_red_support.5.desc: "Реддінґ пропонує продати нам велику партію медикаментів. Звідки вона в них? Хто знає — може, з вантажівки впали. Вони точно допоможуть на передовій, особливо при великих втрат. Але бути в боргу в Баронів — завжди ризик..."
ncr_red_support.5.a: "Це для наших поранених товаришів."
ncr_red_support.5.b: "Небезпечно залежати від Баронів."
ncr_red_support.5.c: "Ой, у нас нема грошей. А як щодо позики?"
ncr_red_support.5.d: "На жаль, у нас нема грошей..."

ncr_red_support.6.t: "Мистецтво угоди"
ncr_red_support.6.d: "Схоже, ми знову втерлись у вигідну угоду. Позбулись прострочених медзасобів і отримали гарну суму. Реддінґ буде ще сотні разів укладати такі оборудки з пустельними добувачами. Наливайте вина!"
ncr_red_support.6.a: "Хай потечуть долари."

ncr_red_support.7.t: "Позика?"
ncr_red_support.7.d: "Вони не змогли дозволити собі наш асортимент медичного спорядження. Прикро. Але тепер хочуть узяти позику, аби оплатити постачання. Хоч ми й не лихварі, та, можливо, встигнуть повернути?"
ncr_red_support.7.a: "Не долари, але теж може стати в пригоді."

ncr_red_support.8.t: "Угоду відхилено"
ncr_red_support.8.d: "Невдячні покидьки відмовились від чудової угоди. Вочевидь, їм не потрібна медична перевага на полі бою. Що ж, залишимо ці стимпаки для себе. Шкода, святкування не буде."
ncr_red_support.8.a: "От халепа."

ncr_red_support.9.t: "Реддінґ хоче купити зброю"
ncr_red_support.9.d: "Реддінґ запропонував купити в нас зброю за чималу кількість кепсів. Чи досить у нас резервів, аби поділитись? Чи варто відмовити й тримати зброю для себе?"
ncr_red_support.9.a: "Чудова угода!"
ncr_red_support.9.b: "Нам самим потрібна зброя."

ncr_red_support.10.t: "Угода вдалася"
ncr_red_support.10.d: "Вони погодились продати нам свою зброю — чудовий день для Реддінґа! Наша ділова хватка — поза конкуренцією в цій безкраїй пустці. Тепер вирішимо, що робити з усіма цими гвинтівками..."
ncr_red_support.10.a: "А наступний крок — продати це задорого."

ncr_red_support.11.t: "Угоду відхилено"
ncr_red_support.11.d: "Невдячні покидьки відмовились від чудової угоди. Схоже, їм не потрібне зростання економіки. Кепси використаємо десь інде. Шкода, святкування не буде."
ncr_red_support.11.a: "От халепа."

