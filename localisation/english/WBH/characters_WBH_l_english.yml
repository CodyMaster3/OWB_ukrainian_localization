l_english:
WBH_THE_IMMORTAL_NAME:0 "Безсмертний"
WBH_THE_IMMORTAL_DESC:0 "§1«Вашингтон, Аляска, таємниці Пустки. Все це й більше буде моїм».§!\n\nСтрашний, жахливий, підступний. «Безсмертний» колись був кимось іншим. Лідер Ескадри Ланс – вірний Середньому Заходу та Старійшина Епсілону.\n\nТепер Безсмертний – це набагато більше: загроза Сіетлу, нащадок P-1, монстр, що править із голки посеред хуртовини.\n\nБезсмертний прагне прорвати завісу реальності та розкрити остаточні істини, приховані від Братства за межами розуму та логіки."

WBH_STAR_PALADIN_RODRIGUEZ_NAME:0 "Зоряний Паладин Родрігес"
WBH_STAR_PALADIN_RODRIGUEZ_DESC:0 "§R«Не залишати нікого живим».§!\n\nЖорстока людина, навіть у межах спотвореного Вашингтонського Братства він виділяється як один з ключових послідовників Безсмертного. Родрігес, як і багато хто, хто залишився вірним Безсмертному з часів Ескадри Ланс, вважає страх чудовим мотиватором – його солдати бояться його більше, ніж ворога попереду."

WBH_PALADIN_CONNOR_NAME:0 "Паладин Коннор"
WBH_PALADIN_CONNOR_DESC:0 "Зважаючи на те, що Середній Захід майже не мав морського досвіду, Коннор почав створювати морську присутність для Вашингтонського Братства з дозволу Безсмертного. Співпрацюючи з рейдерами з Порт Мо, які знають, що з Братством краще не жартувати, Коннор мріє про темний флот у Сіетлі, що вирушає у рейди по всьому узбережжю Америки й, можливо, навіть далі..."

WBH_KNIGHT_EDWARDS_NAME:0 "Лицар Едвардс"
WBH_KNIGHT_EDWARDS_DESC:0 "Едвардс чув легенди про дирижаблі, які Братство колись запускало в експедиції Пусткою, і вірить, що це можна повторити. Але цього разу – з невимовною руйнівною силою. Використовуючи бази ВПС довоєнного часу у Вашингтоні, він планує створити новий повітряний флот Братства для знищення ворогів."

WBH_HEAD_PALADIN_BLAIR_NAME:0 "Головний Паладин Блер"
WBH_HEAD_PALADIN_BLAIR_DESC:0 "Блер нещодавно отримав звання Головного Паладина Вашингтонського Братства та працює над формуванням нової бойової сили – Чорних Паладинів. Він хоче замінити стару неефективну структуру, в яку організовували себе попередні Паладини. Тепер він прагне охопити Вашингтон холодним металевим кулаком."

WBH_PALADIN_JETSON_NAME:0 "Паладин Джетсон"
WBH_PALADIN_JETSON_DESC:0 "Зірка, що сходить у рядах Паладинів Вашингтонського Братства та один із перших членів Ескадри Ланс. Джетсон часто конфліктує з вищим керівництвом, прагнучи довести свою значущість і стати правою рукою Безсмертного. Він завжди знає, коли зупинитись, щоб не перейти межу – але його бажання швидко дістатися до відповідей викликає підозри щодо його відданості Братству."

WBH_INQUISITOR_ABRAM_NAME:0 "Інквізитор Абрам"
WBH_INQUISITOR_ABRAM_DESC:0 "Серед усіх Інквізиторів Абрам може зрівнятись із Торландом у своїй жорстокості, хоч і зовсім в іншому ключі. Відповідальний за індоктринацію новобранців до лав Братства, він переніс власну жорстокість на учнів. Навіть інші Інквізитори бояться відкрито ставити під сумнів його методи."

WBH_PALADIN_TALSO_NAME:0 "Паладин Тальсо"
WBH_PALADIN_TALSO_DESC:0 "Колишня Сестра Сталі, яка приєдналася до Ескадри Ланс після конфлікту з іншими Сестрами. Спершу вона не бажала брати участь у трансформації, що приніс Безсмертний до Сіетлу. Але після самогубчої атаки Вартових, внаслідок якої загинув її чоловік, вона знайшла свою помсту... І крики не вщухають з того часу."

WBH_KNIGHT_BOSTON_NAME:0 "Лицар Бостон"
WBH_KNIGHT_BOSTON_DESC:0 "Один із перших членів Ескадри Ланс. Бостон приєднався до справи Безсмертного через своє розчарування в постійному застої Середньозахідного Братства. Під час подорожі до Сіетлу він усвідомив, наскільки важлива логістика: Паладин не може битися на порожній шлунок. Тепер він працює над укріпленням постачання та логістики Вашингтонського Братства."

WBH_SCOUT_CORMAC_NAME:0 "Паладин-Розвідник Кормак"
WBH_SCOUT_CORMAC_DESC:0 "Хоча титул «Паладин-Розвідник» може здатися дещо суперечливим, у зруйнованих і запустілих руїнах Сіетлу така роль має своє місце. Кормак проводить дні, повільно картографуючи маршрути, технологічні осередки та потенційні осередки опору, аби їх могли знищити або поневолити інші. Це дає йому змогу продовжувати свою роботу без перешкод."

WBH_KNIGHT_KAMALA_NAME:0 "Лицар Камала"
WBH_KNIGHT_KAMALA_DESC:0 "Колишній Вартовий Білини, Камала втомився від постійного застою та безглуздого патрулювання мертвого міста. Таємно він передав Вашингтонському Братству плани Вартових щодо боротьби з ним в обмін на перехід – як він вважав – на переможний бік. Тепер Камала впроваджує отриманий досвід у новому житті, адаптуючи інструменти старої служби під нові цілі."

WBH_PALADIN_JAKZIN_NAME:0 "Паладин Джакзін"
WBH_PALADIN_JAKZIN_DESC:0 "Марнославна й жорстока жінка, відома своєю волею та любов’ю до різанини. Джакзін очолювала одну з операцій, що знищила присутність Вартових у Сіетлі. Подейкують, що вона тримає живих Вартових у ролі особистих рабів і трофеїв."

WBH_BLACK_PALADIN_LANDON_NAME:0 "Чорний Паладин Лендон"
WBH_BLACK_PALADIN_LANDON_DESC:0 "Найсильніший і найздібніший серед новостворених Чорних Паладинів. Лендон щиро вірить, що несе цивілізацію в Пустку... одним геноцидом за раз. Хоча колись він був рейдером із Сіетлу, тепер його минуле стерте, залишився лише холодний садист, який із гордістю носить тавро Братства, випалене на плоті."

WBH_INQUISITOR_FRITZ_NAME:0 "Інквізитор Фріц"
WBH_INQUISITOR_FRITZ_DESC:0 "Новобранець в Інквізиції Вашингтонського Братства, Фріц проводить експерименти всередині Голки – хмарочоса, що височіє над Сіетлом. Він шукає як потенційних новобранців, так і випробовуваних для своїх дослідів."

WBH_INSTRUCTOR_MORTIS_NAME:0 "Лицар Мортис"
WBH_INSTRUCTOR_MORTIS_DESC:0 "Колись – ініціат з палким бажанням довести свою цінність, тепер – озлоблений стратег, що розробляє плани наступу на ворогів Безсмертного. Знаючи, що основна маса нової армії – раби та рейдери, він вірить у тактику хвильових атак, де найкращі командири заходять після м’ясорубки, аби добити ворога."

WBH_SCOUT_AMBROSONE_NAME:0 "Розвідник Амбросон"
WBH_SCOUT_AMBROSONE_DESC:0 "Амбросон – не член Ескадри Ланс і не новобранець із Вашингтону, а людина з зруйнованого Чаптера, про який відмовляється говорити. Він стверджує, що там залишилися лише жахи. Попри своє «чужинське» походження, він навчився не ставити запитань. Тепер мовчки працює над здобуттям нових технологій і озброєння для Братства."

WBH_INQUISITOR_TORLAND_NAME:0 "Майстер-Інквізитор Торланд"
WBH_INQUISITOR_TORLAND_DESC:0 "Як головний інквізитор, Торланд відповідає за промивання мізків та дослідницькі проєкти Вашингтонського Братства. Він мовчазний у своїх діях, але ті, хто сумнівається в його лояльності, зникають без сліду – лише ще один піддослідний у його темних експериментах."

WBH_KNIGHT_TECT_NAME:0 "Лицар Тект"
WBH_KNIGHT_TECT_DESC:0 "Жорстокий і розважливий, Тект керує індустрією Вашингтонського Братства, що базується на праці рабів і слабких. За згодою інквізиторів, він запровадив систему «мотивації»: кожен раб отримує шанс здобути свободу, довівши свою силу в гладіаторських боях. Жахливо, але дієво."