l_english:
nf_washington.1.t:0 "У Середині Завірюхи"
nf_washington.1.d:0 "Під сніговими вулицями Сіетлу ховається підземна мережа покинутих будинків, вулиць і бункерів. У самому її центрі — загрозливий люк із написом «SECURE SITE P1», що відчиняється лише для обраних, чий символ було випалено на їхній понівеченій броні в глибинах об’єкта. Вони затягують мандрівників у темряву, використовуючи їх як піддослідних або робочу силу для розкопок. Це — трон нової, кривавої гілки Братства, що будує свій шлях на кістках слабких. Їхній лідер — гуль, чия шкіра зрослася з силовою бронею, відомий лише як Безсмертний. З глибини свого святилища він видає накази, що пронизують усі лави. Його люди нишпорять вулицями, викрадаючи тих, хто заблукав, і підсвічуючи шлях собі світлом візорів. Вашингтонське Братство прибуло в Сіетл для розслідування Об'єкта P1 — дослідницької бази, присвяченої окультним вивченням. Колись вірили, що радіація може пробудити паранормальні здібності. Сьогодні ж їхні зали нагадують м’ясні лавки, стіни вкриті слідами кігтів. Братство виявило покинуту, але багату на знання споруду — і зробило її основою своєї темної експансії, яка вже тягнеться до Аляски."
nf_washington.1.a:0 "Північ буде нашою"

nf_washington.2.t:0 "«Запрошення» від Вашингтонського Братства"
nf_washington.2.d:0 "На захід, за межами нашої гордої нації, де вода стає чорною, руїни Сіетлу гниють, наче незалікована рана. Нескінченна завірюха, тіла в снігу, світлі очі з темряви — місто, повне привидів. Привидів, які виходять вночі, викрадають людей, ревно охороняючи свою столицю. І ось вони прийшли до наших воріт. Безсмертний надіслав «запрошення» вирушити в похід заради відновлення старого світу. Посланець стоїть нерухомо в снігу — ледь помітний, якби не гул плазмової гвинтівки. Прийняти — значить жити. Відмовитись — означає загинути."
nf_washington.2.a:0 "У нас немає вибору — ми станемо їхніми союзниками."
nf_washington.2.b:0 "Наша горда нація не прийме таких абсурдних вимог."

nf_washington.3.t:0 "«Запрошення» від Вашингтонського Братства"
nf_washington.3.d:0 "Сіетл був лише зруйнованим містом, покинутим на поталу морозам. Лише відчайдушні й дурні йшли туди. Навіть Люди Зева не змогли захопити це місце. Але колись у цій проклятій землі заворушилася машина — її темні господарі почали розкривати таємниці. Люди в силовій броні, які мовчки рухаються крізь бурю, інколи з'являлися в Пащі для торгівлі. А інколи викрадали цілі громади. Та цього разу вони не торгують — вони пропонують нам угоду, від якої не можна відмовитися. Приєднатися до їхнього завоювання, отримати рабів і здобич — або потонути в крижах."
nf_washington.3.a:0 "Це може бути вигідно"
nf_washington.3.b:0 "Ми ніколи не станемо рабами Братства!"

nf_washington.4.t:0 "Пакт Підписано"
nf_washington.4.d:0 "Сьогодні лідера Старої Країни, Гроздана Хайкова, наші люди провели до Капітолійського Пагорба. Коли він прибув до люка в серце святилища, він був ледве живим від страху. Безсмертний стояв, споглядаючи обеліск у центрі, і розмовляв з гулем, не обертаючись. Хайков і його люди отримають силову броню та плазмову зброю, а у відповідь зобов’яжуться з’явитися, коли їх покличуть. Пакт підписано."
nf_washington.4.a:0 "Як і було задумано"

nf_washington.5.t:0 "Стара Країна Відмовляє"
nf_washington.5.d:0 "Безсмертний Старійшина з відразою дивився на зім’ятий аркуш у своїй руці, стискаючи його в обгорілих пальцях. Стара Країна відкинула його пропозицію про союз — їхня сліпа любов до старого світу завадила побачити істинну суть Пустки. «Захопіть їхні поселення та зрівняйте з землею — нікого не залишайте в живих». У кімнаті запала тиша, коли слуга пішов. «Ми ніколи не повинні були довіряти цим мутантам»."
nf_washington.5.a:0 "Вони заплатять за це"

nf_washington.6.t:0 "Пакт Підписано"
nf_washington.6.d:0 "На мурі Порта Моу замайорів глибокий червоний прапор, темний символ Вашингтонського Братства проголошував новий порядок. Уже багато капітанів Порту та їхніх офіцерів вбралися в броню — визнання відданості новим союзникам. Хоча офіційно Порт залишився незалежним, темне коріння Братства вже проросло в його основах. Згодом він буде їхнім."
nf_washington.6.a:0 "Так, як і передбачалося"

nf_washington.7.t:0 "Порт Паща Відмовляє"
nf_washington.7.d:0 "Ранкове полум’я охопило Порт Пащу, моряки в жаху спостерігали, як пів флоту палає під криваво-червоним небом. Вони провели день, гасячи вогонь, і хоч усі кораблі вціліли — серця моряків були зломлені. Вночі, поки вони спали, високі постаті мовчки пройшли портом, залишивши за собою лише згарища. Послання було чітким — Братство не прощає."
nf_washington.7.a:0 "Вони заплатять за це"

nf_washington.8.t:0 "Велика Аляскинська Експедиція"
nf_washington.8.d:0 "Група найвідважніших солдатів під проводом самого Безсмертного вирушила в безжальні крижані гори, що колись звалися Аляскою. Все, що вони знайдуть там, допоможе нам упорядкувати пустки та викорінити рештки мутантів."
nf_washington.8.a:0 "Уперед"

nf_washington.9.t:0 "Велика Аляскинська Експедиція"
nf_washington.9.d:0 "Серед льодових скель Деналі заховався об’єкт, чий люк давно вкрито кригою. Його зали мовчать, усі вкриті льодом — окрім одного, де працює ядерний генератор розміром із синього кита. База Резерву Анкоріджа №12: самотнє місце. Безсмертний шукав привид старого світу — і знайшов ім’я в Сіетлі. Відразу ж вирушив на північ — далі, ніж будь-хто з Братства коли-небудь заходив. Навіть якщо доведеться залишити всіх у цій мерзлоті — він був готовий. Його блискучий трофей був зовсім поруч. Побачивши гору на горизонті, їх охопило передчуття. Вони відбили кригу й уламки, що вкривали вхід без позначень, і навіть не уявляли, що знайдуть усередині. Навіть Безсмертний знав лише крихти. Утилітарний вхід, крижаний коридор, лише тихе шипіння сервоприводів броні. Лише одне світло — і крізь вікно вони побачили: сотні кріогених саркофагів у ряду за рядом, освітлених мертвотно-блакитним сяйвом. Істина відкрилася лише після активації системи. Ці солдати були занурені в криосон перед самою війною — про всяк випадок. У разі нападу на Аляску, їх мали розбудити автоматично. Але війна давно закінчилась. Вони зрозуміли це, щойно побачили своїх «рятівників». Безсмертний, сповнений гордості, звернувся до сотень вразливих солдатів: «Люди сімдесят п’ятого полку, ваш підрозділ розформовано. Відсьогодні ви більше не армія США. Ви — частина єдиної організації, що може врятувати Америку. Ласкаво просимо до Братства Сталі»."
nf_washington.9.a:0 "Відтепер ви служите Безсмертному"

nf_washington.10.t:0 "Мутанти Збираються"
nf_washington.10.d:0 "Найбільша загроза нашому існуванню — Вашингтонське Братство — сьогодні кілька разів безрезультатно стикалося з нашими мутантами вздовж усього кордону. Без сумніву, це лише передмова до широкомасштабного вторгнення. Братство чітко дало зрозуміти, що прагне винищити гулів і мутантів, отже, наше саме існування під загрозою. Жодної капітуляції бути не може."
nf_washington.10.a:0 "Ми мусимо битися до смерті"
WBH_warren_resist_brotherhood:0 "Кілька дивізій супермутантів повстануть, щоби дати відсіч Братству.\n"

nf_washington.11.t:0 "«Туристи» з Материка"
nf_washington.11.d:0 "Нещодавно мешканці острова Сан-Хуан скаржилися на прибуття нових «туристів». Вони масово прибувають каное через протоку П'юджет-Саунд на наші землі!\n\nРегіональні лорди Сан-Хуану побоюються, що це може зруйнувати автономію острова, тоді як місцеві торговці вбачають у цьому чудову можливість віддячити материковикам.\n\nЩо ми робимо?"
nf_washington.11.a:0 "Пустимо їх!"
nf_washington.11.b:0 "Геть звідси!"

nf_washington.12.t:0 "Вигнання!"
nf_washington.13.t:0 "Вигнання!"
nf_washington.12.d:0 "Отже, наша історія на материку закінчилася. Жорстоке Братство вигнало нас з рідних земель і змусило податися в море. На щастя, ми дізналися про нову землю, яка може стати для нас новим домом. Поселенці там, здається, доброзичливі й готові допомогти нам відновитися після всього, що ми пережили."
nf_washington.13.d:0 "Отже, наша історія на материку закінчилася. Жорстоке Братство вигнало нас з рідних земель і змусило податися в море. На щастя, ми дізналися про нову землю, яка може стати для нас новим домом. Поселенці там, здається, вороже налаштовані, але це наш єдиний вибір. Ми маємо робити все, що можемо!"
nf_washington.12.a:0 "Ми повинні пам'ятати загиблих."
nf_washington.13.a:0 "Ми повинні пам'ятати загиблих."