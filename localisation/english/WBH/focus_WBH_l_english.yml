l_english:
# Washington Brotherhood #

WBH_within_the_blizzard:0 "У Середині Завірюхи"
WBH_within_the_blizzard_desc:0 "У вічних снігах півночі є місто, не схоже на інші: місто привидів. Кажуть, якщо ступиш туди — не повернешся. Ці мстиві духи ненавидять живих, їхні очі палають, як вуглини, спотвореним бажанням. Вони затягують тебе в темну глибину... і роблять одним із них."

WBH_sinister_patriots:0 "Зловісні Патріоти"
WBH_sinister_patriots_desc:0 "«На півночі люди втрачають розум» — так кажуть. Уперті старателі, нерозважні юнаки, відчайдушні втікачі — всі вони паломники півночі. Єдина їхня зупинка перед Безкінечною Білизною — це Стара Країна, нація довоєнних гуль, що сумують за минулим."

WBH_without_a_cause:0 "Без Причини"
WBH_without_a_cause_desc:0 "Захопивши Вашингтон, Безсмертний звертає погляд до заколотників із [TCA.GetNameDef] і зрадника на їх чолі. Має бути показано суворий приклад для [TCA.GetLeader] та всіх, хто підтримав його зраду."

WBH_fellow_savages:0 "Брати-Дикарі"
WBH_fellow_savages_desc:0 "Ті, хто торгує на півночі, проклинають Порт Моу так само часто, як і хвалять. Їхні судна нападають пірати, екіпажі вбивають, товар крадуть. У темних закутках порту шепочуть про угоди з привидами: раби за гармати, побрякушки за лазери. Кажуть, хтось навіть витягнув їм обеліск..."

WBH_dark_ambitions:0 "Темні Амбіції"
WBH_dark_ambitions_desc:0 "Безсмертний веде своїх людей ще з часів Ескадри Лансу. Він знає, заради чого б'ється. Всі вони знають у серці: те, що сьогодні зло — завтра буде добром."

WBH_enslave_the_weak:0 "Поневолити Слабких"
WBH_enslave_the_weak_desc:0 "Племінні родини — чудові працівники. Вашингтонське Братство швидко це збагнуло після захоплення Сіетла. Щоби відновити місто — потрібні руки. Ті, хто не скаржиться, хто не може скаржитися. Рабство — лише засіб до мети. Мораль — порожнє слово."

WBH_expand_our_dominion:0 "Розширити Нашу Владу"
WBH_expand_our_dominion_desc:0 "Сидіти в цитаделі у серці Сіетла — замало. Потрібно більше: більше рабів, більше ресурсів, більше заводів... Більше. Більше. Більше. Це все, що каже Безсмертний. Машина війни знову працює — бо він того вимагає."

WBH_eradicate_the_mutants:0 "Полювання на Першого"
WBH_eradicate_the_mutants_desc:0 "Хоч Безсмертний і гуль, любові до мутантів не має — особливо до супермутантів. Перший — найнебезпечніший: очолює Троль Воррен на півдні. Їхнє швидке зростання робить їх загрозою. Ми мусимо знищити його, поки не пізно."

WBH_black_paladins:0 "Чорні Паладини"
WBH_black_paladins_desc:0 "Одного рабства недостатньо. Сильніших ми використовуємо для нагляду за іншими. Потроху вони самі стають нашими. Зламані. Жорстокі. Ми клеймимо їх печаттю. Чорні Паладини Вашингтонського Братства — це жахливий, сумний символ."

WBH_decimate_and_despoil:0 "Знищити Та Зруйнувати"
WBH_decimate_and_despoil_desc:0 "Милосердя — не чеснота, а слабкість. Безсмертний навчив нас цього на шляху до Сіетла. Усіх, кого не можна змусити працювати — треба знищити. Тут немає місця співчуттю."

WBH_dark_foundries:0 "Темні Ливарні"
WBH_dark_foundries_desc:0 "У глибині нашої бази дрімає машина, що вимагає крові та вугілля. Ми збудуємо собор з кривавими печами, аби розбудити її серце. І вона погляне на нашу наругу... і винагородить."

WBH_death_or_glory:0 "Смерть або Слава"
WBH_death_or_glory_desc:0 "Ми прийшли на північ, знаючи, що це дорога в один кінець. Сіетл — сувора пані, її мороз ламає серви і заморожує кістки, але саме в її холоді збережено загублений світ. Нам нічого втрачати, лише здобути."

WBH_alaskan_expedition:0 "Велика Аляскинська Експедиція"
WBH_alaskan_expedition_desc:0 "Нарешті. Нарешті час втілити мрію Безсмертного. Розвідка знайшла її: вкритий льодом бункер, похований у горі. Пора вирушати, аби повернути те, що втрачено."

WBH_attack_the_warren:0 "Атака на Воррен"
WBH_attack_the_warren_desc:0 "Воррен показав, що може швидко зростати. Ми маємо вдарити першими — або вони вдарять нас. Це не геноцид. Це — милосердя."

