l_english:
  # Focuses
  tob_a_heroes_culture:0 "Відлуння Крові Велетнів"
  tob_a_heroes_culture_desc:0 "Старі Кості не забувають. Їхня сила тече з кісткового мозку легенд – тих, хто стояв у часи велетнів, і тих, хто зневажив смерть. Історії Безіменного Воїна шепочуться біля вогню, вирізьблюються на камені, передаються в попелі. Це не перша його пісня – і не остання. Ми – пам'ять. А пам’ять – це сила."

  tob_research:0 "Викувати Обсидіановий Ікло"
  tob_research_desc:0 "Обсидіан – скло, загартоване гнівом землі – є святим для Старих Костей. Його гострота нелюдська, кажуть, кров, пролиту ним, бачать Предки. Завдяки забутим ритуалам і уламкам старого світу наші ковалi кують зброю, що не є просто інструментами – а Судом."

  tob_tribal_strength:0 "Кров і Кістка"
  tob_tribal_strength_desc:0 "Ми – залишки світу. Плоть, що тримається мети. Племена, з’єднані скорботою. Старі Кості не розпорошуються. У горі – ми єдині. У тиші – ми терпимо. У війні – ми стаємо цілісними. Хай світ зруйнується навколо – але не ми."

  tob_preparing_hunting_tools:0 "Повернути Полювання"
  tob_preparing_hunting_tools_desc:0 "Звірі цієї землі більше не бояться людину. Це зміниться. Ми ходимо стежками предків – обсидіанові наконечники, сухожилля, списи з кістяними руків’ями. Але ми куємо їх заново. Полювання – не виживання, а обряд. Доказ, що ми пам’ятаємо, як §Yзабирати своє§!."

  tob_tonics:0 "Відвар Кісток і Духове Полум’я"
  tob_tonics_desc:0 "Старі Кості не благають пустку – ми наказуємо їй. Відвари, зварені в тиші, єднають нас із велетнями, що спочивають під землею. З кожним ковтком ми пам’ятаємо. І з кожним – зростаємо. Світ забув, як лікувати себе. Ми – ні."

  tob_throne_of_bones:0 "Трон Безіменного"
  tob_throne_of_bones_desc:0 "Він стоїть під ребрами мертвих велетнів. Безіменний не сидить на ньому – бо це не його трон. Це пам’ять про все втрачене. І обітниця знову підвестися. Воїни збираються не заради завоювань, а заради розплати. Під поглядом кістяних богів ми гостримо списи."
  tob_throne_of_bones_tt:0 "Скликати Племена\n§gПід поглядом древніх кісток воїни присягають на відплату.§!"

  tob_oro_wg:0 "Розрив із Уроборосом"
  tob_oro_wg_desc:0 "Богиня в чорному правила досить довго. Її голос спотворює вітер, її тінь душить землю. Але тінь можна проштрикнути. Безіменний Воїн іде – з ним прийде відплата. Кістки пам’ятають. Вона – теж згадає."

  tob_consolidate_oro_1:0 "Знищити її Святиню"
  tob_consolidate_oro_1_desc:0 "Уроборос більше не шепоче її імені. Дочки розсіялися. Вогні згасають. Ми ходимо її залами не як злодії – а як судді. Місто буде очищене. Перекуте у плоть і камінь. §YМертві не мають права правити живими.§!"

  tob_consolidate_oro_2:0 "Сісти Там, Де Пала Богиня"
  tob_consolidate_oro_2_desc:0 "Темна Піраміда все ще стоїть. Її серце пульсує забутими обрядами. Кажуть – жодна людина не повинна її торкатися. Але шепочуть: Безіменний вже зійшов угору. Питання не в тому, чи сяде він там – а що доведеться §Rвіддати§!, щоб сісти там, де колись стала на коліна богиня."

  tob_confront_the_nightmares:0 "§RІнферно§!"
  tob_confront_the_nightmares_desc:0 "§R\"Та зирни вниз; бо вже близько ріка\nКрові киплячої, де мучаться\nТі, хто насильство на інших чинив...\"§!"

  tob_reject_hubris:0 "Відкинути Гординю"
  tob_reject_hubris_desc:0 "§O\"Я – пан своєї долі, капітан своєї душі.\"§!"
  tob_reject_hubris_tt:0 "§gКоли не було відповідей, Безіменний слухав живих – тих, хто згадав Тирантуса, останнього вождя Молодої Крові. Дізнавшись про його заслання в Берхем-Спрінґс, він пішов туди – не щоб переписати історію, а щоб її §Rнести§!. Він повернувся не легендою – а присягою. І Старі Кості впали на коліно перед Тирантусом, відродженим.§!"

  tob_honor_the_past:0 "Помста за Полеглих"
  tob_honor_the_past_desc:0 "Фарсон згорів. Ми мовчки поховали мертвих. Але мовчанка скінчилась. Копачі з півночі дізнаються: ті кістки, що вони зламали, §Yще тримають вагу§!. І ми йдемо – нагадати."

  tob_survivors_of_farson:0 "Ті, Хто Вижив у Фарсоні"
  tob_survivors_of_farson_desc:0 "Вони втекли від вогню та реву землі. Але не розпорошилися. Вони пішли за Безіменним – не заради помсти, а бо він стояв, коли інші впали. І тепер вони йдуть за новим іменем: §YTирантус§! – не народжений, а §Yобраний§!."

  tob_a_ready_people:0 "Народ, Готовий до Миру"
  tob_a_ready_people_desc:0 "[TOB_Leader.GetName] почув про Північний Союз – тих, хто будував замість того, щоб палити. І запитав себе: чи можуть його люди – в тіні велетнів – також §Yспочити без страху§!?"

  tob_caravans_north:0 "Каравани на Північ"
  tob_caravans_north_desc:0 "Земля пам’ятає наш крок. Шляхи знову відкрито. Родичі віддалені – покликані. Наші пісні пливуть вітром, доходять до тих, хто колись нас боявся. Каравани несуть не лише товари – вони несуть нашу §Yправду§!, наше ім’я, наше §Yповернення§!."

  tob_suits_of_love_and_iron:0 "Лати з Любові та Заліза"
  tob_suits_of_love_and_iron_desc:0 "Ми носимо горе як броню. Кожна пластина – пам’ять. Кожна гравірування – ім’я незабутого. Це не обладунки для війни. Це §Yприсяга§! – оберігати те, що залишилось. І ніколи більше не дати полум’ю забрати все."

  tob_embrace_hubris:0 "Прийняти Гординю"
  tob_embrace_hubris_desc:0 "§R\"Що може змінити природу людини?\"§!"
  tob_embrace_hubris_tt:0 "§gБезіменний знайшов комікс у пилюці – і побудував святиню з історій. Віри почали текти у сни. Він повірив: світ Грогнака – це не вигадка, а забута істина. Він повернувся з Берхем-Спрінґс не як людина – а як втілена легенда. Старі Кості скинули ім’я і стали §YГрогами§! – створіннями мрій, туші й полум’я.§!"

  tob_embrace_hubris_1:0 "Шепіт Горгонової Королеви"
  tob_embrace_hubris_1_desc:0 "На захід від Звивистих Скель живе Месмеральда, Горгонова Королева. Кажуть, вона бачить м’яке в серцях – переписує пам'ять. Вона – не міф. Вона – §MГординя§! втілена. Можливо, в неї є чому повчитися... або чого боятись."

  tob_embrace_hubris_2:0 "Трон Грогнака"
  tob_embrace_hubris_2_desc:0 "Він більше не бачить сни про Фарсон. Тепер – про трон із кісток дракона. Про тисячі боїв. Про перемогу з кожним замахом. Він не скорботний – він воїн. У ньому живе §YGrog§!. І люди вже співають його ім’я."

  tob_embrace_hubris_3:0 "Марсіанські Мрії"
  tob_embrace_hubris_3_desc:0 "На сході – Спейсери. Вони вірять, що ми на Марсі. У їхніх легендах – червоне небо, променеві гармати і Діва Війни Маула. Божевілля? Можливо. Але якщо Гроги прагнуть оживити Гординю – можливо, саме божевільні тримають карту."

  tob_embrace_hubris_4:0 "Перешити Історію"
  tob_embrace_hubris_4_desc:0 "Ми рвемо нитки минулого. Вишиваємо нову легенду – монстри, діви, титанічні дуелі. Ми творимо правду з §Yбульварного міфу§! – доки вона не стане дійсністю. Наші швачки стають літописцями. Наші воїни – казкою."

  tob_embrace_hubris_5:0 "Претанцювати Легенду"
  tob_embrace_hubris_5_desc:0 "Це – не божевілля. Це – §Yритуал§!.\nМи тупаємо землю, доки не згинається небо. Ми скандуємо, доки зірки не кліпнуть. Ми говоримо як Гроги, б’ємося як Гроги, мріємо як Гроги. Доки світ не стане нашою історією."

  tob_hubris_middle:0 "Краса знищення"
  tob_hubris_middle_desc:0 "Завдяки нашим завоюванням ми відкрили спосіб створити абсолютну зброю. Жоден ворог, яким би можутьнім він не був, не стане нам на заваді."
  
  tob_continue_the_conquest:0 "Продовжити Шлях Війни"
  tob_continue_the_conquest_desc:0 "Наші завоювання принесли силу й славу. Але шлях не завершено. Ворогів – не залишилось. Лише §Yперемога§!."

  tob_dry_wg:0 "Приспати Сплячих"
  tob_dry_wg_desc:0 "Сплячі – дивне, хворобливе і єретичне плем’я людей-наук – не становлять загрози. Після падіння Уробороса, вони теж впадуть. Підкорення буде швидким. Їхні землі – наші."

  tob_pnt_wg:0 "Розмалювати Розмальованих"
  tob_pnt_wg_desc:0 "Розмальовані – ганьба. Слабке, жалюгідне плем’я. Ми будемо панувати, а вони – §Yвичищати наші чоботи§!."

  tob_blc_wg:0 "Прорвати Великий Шатро"
  tob_blc_wg_desc:0 "Великий Шатро, що сховався на сході, приховує скарби. Їхні багатства та ресурси – стануть нашими!!"

  tob_uin_wg:0 "Виштовхати Юнінта"
  tob_uin_wg_desc:0 "Плем’я Юнінта слід загнати назад у гори. Вони – лише дрібна перешкода. Силою й наполегливістю ми переможемо. Вони знатимуть страх перед Старими Костями."

  tob_crz_wg:0 "Стерти Божевільні Роги"
  tob_crz_wg_desc:0 "Вогнепоклонники Божевільні Роги загрожують нашій землі. Їхній бог, Фенікс, впаде. Ми загасимо їхнє полум’я. Перемога – неминуча."

  tob_dea_wg:0 "Підкорити Мертвих Коней"
  tob_dea_wg_desc:0 "Плем’я Мертвих Коней мусить схилити коліно. Наша міць розчавить їхній спротив. Вони підкоряться. §Y[ROOT.GetName] – панує§!."

  tob_a_new_day:0 "Новий Світанок"
  tob_a_new_day_desc:0 "З ворогами знищеними, Старі Кості стоять у тріумфі. Наша сила відома. Починається нова епоха. §YПустка – наша.§!"

  tob_return_north:0 "Повернення Додому"
  tob_return_north_desc:0 "Ми зібрали силу. Час повертатися на північ. Наш дім чекає. Нас більше не виженуть. §YМи повертаємо своє право народження.§!"

  tob_conquer_utah:0 "Слідами до Юти"
  tob_conquer_utah_desc:0 "Нові сліди ведуть на захід – до Юти. Ми підемо цим шляхом. І §Yпереможемо кожного, хто стоятиме нам на заваді§!."

  tob_ally_legion:0 "Союз із Цезарем"
  tob_ally_legion_desc:0 "Цар Півдня – Цезар – бачить нашу силу. Союз з ним буде страшенно могутнім. Разом – §Yвлада§!."

  tob_an_earned_name:0 "Ніщо не є реальним, та він Залишився"
  tob_an_earned_name_desc:0 "Світ сумнівався в ньому, тож він переписав його. Те, що було вигадкою – тепер маршує, кричить, §Yживе§!. Грогнак – справжній. Бо §Y[ROOT.GetNameDef] вірить§!, а віра – виживає все."

  tob_memories_of_family:0 "Покласти Минуле Спочити"
  tob_memories_of_family_desc:0 "[TOB_Leader.GetName] вів не заради слави – а щоб нести те, що інші не могли. Він поховав усе, що зміг. І ніс решту – у мовчанні. Плем’я не святкує. Воно §Yпам’ятає.§!"

  # Ideas

  #Events
  nf_tob.1.t:0 "Безіменний"
  nf_tob.1.d:0 "Він пам’ятає запах сосни – різкий і солодкий. Шепіт струмка під табором, холодний, стрімкий. Як його донька, одного ранку, в радісному крику підняла лосося, завбільшки з неї саму. Вода стікала з її рук, сміх лився з горла. Вона просила його коптити рибу – щоб пригостити Світлячків, коли ті зійдуть з Роузбад.\n\nВін пам’ятає пісні біля вогню – грубі, низькі. Його жінка співала перша, завжди щось старе, м’яке. Він підспівував із другим куплетом. Кістки, які вони носили – не були символом. Вони були справжніми. Вириті з землі, перетворені на зброю. Предки жили в них. І він вірив у це.\n\nВони жили спокійно. Сильно. Як і покоління до них.\n\nАж поки земля не розкололась.\n\nКопачі вирвались з-під землі – диявольські істоти в металі та газі, несучи полум’я у Фарсон. Він пам’ятає звук – грім, що не вщухав. Родина падала, як сухе листя. Повітря палало їхнім диханням. Він кликав по імені – доньку, дружину – але відповідала лише пожежа.\n\nВін бився, скільки міг. І шукав, скільки витримав. А потім тіло піддалося під сонцем."
  nf_tob.1.a:0 "Очі його зірнулись вгору..."
  nf_tob.1.a.tt:0 "Пилюка залила легені. М’язи горіли болем. Сонце било – як осуд.\n\nАж тоді він побачив його.\n\nФігуру – в диму. Роги з чорної кістки, розчахнута книга в руках. Голос – старий, порожній:\n\n§R\"Темрява потойбіччя – все, що тебе чекає. Можливо, там знайдеш спокій, якого тут не мав.\"§!\n\nВоно простягло руку. Довгі пальці – мов поламані зуби. Воно пахло, як Фарсон. Як попіл. Як втрата.\n\nАле воїн – §Yне здався§!.\nВін підвівся. М’язи кричали. Кров пекла. Але він встав.\n\nДиявол зупинився. Засміявся – сухо, хрипко.\nВін рушив. Пройшов повз... І зиркнув назад.\n\nПримара не йшла слідом.\nНе нападала.\n\nБо мала його обличчя.\n\n§YЙого ж очі – з порожнечі – дивилися йому в душу.§!\n\nВін зробив вибір.\n\n§YСмерть – більше не його хазяїн.§!"

  nf_tob.2.t:0 "Паломництво на Південь"
  nf_tob.2.d:0 "Він не зміг врятувати дружину. Ані доньку. Але він вижив.\nІ цього – вистачило, щоб інші рушили за ним.\n\nКоли пил осів над Фарсоном, а крики вщухли, Безіменний підвівся з попелу – і за ним зібралися уламки Старих Костей та інші біженці. Розкидані поселенці, самотні мисливці, племінники без роду – всі шепотіли його ім’я, хоча ніхто не наважувався сказати справжнє – викрадене вогнем. У ньому вони бачили щось священне. Неможливе.\nЛюдину, що кинула виклик смерті.\n\nІ вони пішли за ним. Не за наказом – а за надією. На південь, по тріщинах каменю і забутих стежках, аж поки не дісталися місця з давніх легенд – стародавнього перевалочного пункту, який їхні предки колись вшановували.\n\nНазва давно загубилась. Залишився лише Монумент – ребра вищі за дерева, черепи, в яких можна розпалити багаття. Його не збудували – його розкрили часи.\nКістки велетнів лежали спокійно.\n\nТут плем’я стало табором. Поховали мертвих – з Фарсона, та знайдених на шляху. І співали пісні скорботи під поглядом кістяних богів. Дехто вірив, що шлях завершено. Інші – що він лише почався.\nАле знали одне:\nВони все ще живі.\nБо §Yвін§! все ще йде."
  nf_tob.2.a:0 "Монумент стане нашим новим домом."
  nf_tob.2.b:0 "Ми йдемо шляхом велетнів."

  nf_tob.3.t:0 "Втрачене Кровне"
  nf_tob.3.d:0 "Задовго до вогню, до Фарсона, Старі Кості мали родичів – плем’я Молодої Крові. Щосезону вони мінялися – землями, традиціями, піснями. Старші вчили молодих. Молоді нагадували старим про юність.\n\nТож, рушаючи на південь, багато хто вірив, що побачить рідню. Що Молоді вижили. Що разом можна буде відбудувати з попелу.\n\nАле – тиша.\n\nЗамість таборів – попіл і ідоли. Замість сміху – чорні вівтарі. Стежки – зарослі, з чужими символами.\n\nІ тоді пішли чутки. Торговці, слідопити шепотіли: Молодих Кровей забрали. Не війна. Не хвороба. А жінка – з димом у диханні й зорями в очах.\nВід піраміди – казали. Її називали: Тьмяна Мати. Її Дочки – в сутінках і шипах – вплелися в Молодих, поки ті не забули своїх богів, своїх імен. Міграція завершена. Їхні історії переписані. Їхні обличчя – тепер у фарбі покори.\n\n«Хто здатен їй протистояти?» – шепотіли зламані.\n\nІ тоді він повернувся.\n§YБезіменний.§!\nЗі шрамами від вогню. З короною з пам’яті. Доказ того, що навіть Смерть – не вирок.\n\nІ ті, хто втік. Хто пам’ятав до-Пірамідний час – знову відчули надію.\n\n§YЯкщо він вижив – то, можливо, й ми зможемо бути вільними.§!"
  nf_tob.3.a:0 "Ми нагадаємо їм, ким вони були."

  nf_tob.4.t:0 "Місто Без Королеви"
  nf_tob.4.d:0 "Уроборос не впав у полум’ї. Не від меча. А в §Yмовчанні§!.\n\nБезіменний увійшов у місто, готуючись до бою. До кари. До останньої проповіді Тьмяної Матері.\n\nАле її не було.\n\nЖодного тіла. Жодного указу. Жодного зламаного вівтаря. Лише – занадто свіжі фрески. Занадто спокійне повітря.\n\nОдні казали – місто ховає її. Інші – що вона §Yрозчинилась у димі й метафорі§!, щоб не подарувати завойовникам тріумфу.\n\nШамани спробували все. Запалили вогні в провулках. Курили золу в серці піраміди. Карбували руни по стінах.\nЦе не очистило. Але, можливо, §Yвгамувало.§!\n\nУроборос не був здобиччю.\nВін – §Yдивився у відповідь§!."
  nf_tob.4.a:0 "Вона зникла – але ще не переможена."

  nf_tob.5.t:0 "Новий Трон?"
  nf_tob.5.d:0 "Темна Піраміда – диво стародавнього інженерства. Зроблена зі шліфованого обсидіану. Стійка до радіації. Ідеальна столиця для нової імперії.\n\nКоли війська §Y[TOB_Leader.GetName]§! захопили місто – постало питання: §Yчи варто проголосити піраміду новим троном?§!\nЦе закріпить владу. Відлякає ворогів.\n\nАле – це пам’ятник Темній Матері. Символ її гніту.\nДеякі лідери вимагали її зруйнувати. Стерти спадщину. Побудувати нове. \n\nВирішувати – §Y[TOB_Leader.GetName]§!.\n§YЧи використати піраміду як символ сили? Чи знищити як символ минулого?§!"
  nf_tob.5.a:0 "§OПрийняти Темну Піраміду§!"
  nf_tob.5.b:0 "Залишити її! Це – табу!"

  nf_tob.6.t:0 "Ім’я, що було старшим за історію, яка його вигадала"
  nf_tob.6.d:0 "Завоювання Ґрога ніколи не були про землю – вони були про доказ: світ – це обман. Його плем’я ходить без страху, без радіації, без зброї, бо вони відкинули Велику Брехню. §RНІЧОГО НЕ ІСНУЄ.§! Не існує стін міст, не існує крові на сталі, навіть сонце над головою – неправда.\n\nНатомість вони шукають істини, сховані під землею: мудрість давнини, правду Роз'єднання, єресі Загарбників, приховану граматику історій, залишених у смітниках і заправках. Через них вони знаходять прозріння – не в пам’яті, а в §Yміфі§!.\n\nЗ часом цей світ – зламаний вигаданий брухт – стане сном.\nА його світ, світ §RҐроґнака§!, стане тим, що пробуджується."
  nf_tob.6.a:0 "Ґроґнак живе, бо ми віримо."

  nf_tob.7.t:0 "Поховання, якого могло б не бути"
  nf_tob.7.d:0 "Не було тіл, які можна було б поховати – ні кісток, ні попелу, ні згадок, врятованих із руїн Фарсона. Але Тирантус поховав їх усе одно.\n\nВін копав могили сам – руками, обгорнутими тканиною, дим підіймався в холодному повітрі. До землі він поклав усе, що зміг: згорток старих коміксів, історії, які вона би полюбила; і поряд – копчену лососину, загорнуту в кору – її улюблену, приготовлену саме так, як їй подобалось. Він не говорив ані слова. І ніхто не приєднався до нього.\n\nКоли все було завершено, він стояв довго, дивлячись, як вітер розносить соснові голки по свіжій землі. І позаду – може, в спогадах, може, насправді – він почув її сміх знову.\n\nВін сподівався, що вони б ним пишалися."
  nf_tob.7.a:0 "Вони зараз зі мною."

  nf_tob_mdt.1.t:0 "Ґорґонна Королева"
  nf_tob_mdt.1.d:0 "Багряні ліси північного заходу шепочуть давні думки, червоне листя тремтить, наче прислухається. Кажуть, що до храму Ґорґон не веде мапа – лише бачення. Але Ґроґ не потребував провідника. Він ішов через тінь і тишу, поки не постояв перед спорудою зі слонової кістки та згорнутого каменю, наполовину поглинутою часом.\n\nТам він зустрів її. Месмеральда, Ґорґонна Королева. Вона сиділа на троні з виноградної лози та хребців, її очі розфокусовані, але всевидючі. Без корони. Без охорони. Лише її погляд. Вона мовчала. Лише дивилась – вираз незбагненний.\n\nА потім – посміхнулась.\n\n«Ти знайшов шлях без мого дотику», – сказала вона, голос шовковий, загорнутий в шипи. – «Більшість потребує допомоги, щоб побачити те, що бачив ти.» Вона не загадувала загадок, не кидала викликів. Лише простягнула руку: «Якщо хочеш створити світ за образом своєї історії – хай наші історії переплетуться.»"
  nf_tob_mdt.1.a:0 "Ґорґонна йде з нами тепер."

  nf_tob_mdt.2.t:0 "Паломники Міфу"
  nf_tob_mdt.2.d:0 "Вони прийшли з півночі – в шовку, як зміїна шкіра, і масках, закріплених кістяними шпильками. Їхні очі були в обрамленні зеленого пігменту. Вони називали себе Останньо Замаскованими, і носили спіральні знаки Ґорґонни на плащах. Хоч вони і були тихими, у їхній появі був ритм – це була не міграція, а хода.\n\nМесмеральда, шепотіли вони, не померла. Після падіння її розум розлетівся – не на божевілля, а на уламки. Сни, пам’ять, заповіді – розсіяні в корі, крові й вітрі. Кожен із них ніс її уламок. І вони прийшли не наказувати – а служити.\n\n«Ми бачимо її дух в тобі,» – сказали вони Ґроґу. – «Ти увійшов у спіраль зі слонової кістки – і вийшов з відкритими очима. Якщо ти її меч – ми будемо твоєю тінню.»\n\nТепер вони ходять серед Ґроґів, наче дим – приносячи ритуали, танці, притчі й бойові гімни, аби переплести міф наново й пробудити те, що спить під землею. Вони не завойовники, а хранителі спіралі.\n\n«Ми – її. А тепер – і твої.»"
  nf_tob_mdt.2.a:0 "Нехай змія обвиває спис."

  nf_tob_dream.1.t:0 "Пил і Сторінка"
  nf_tob_dream.1.d:0 "Вітер виє над дорогою, мов поранений пес на краю світу. Монумент залишився позаду – його кістки обібрані часом і пам’яттю. Безіменний йде наодинці.\n\nІ тоді він бачить: напівзакопаний у пил, чіпляється за кущ, ніби чекав. Комікс. Кольори вицвілі, обкладинка майже зникла, але назву ще видно під шаром бруду: «Ґроґнак Варвар у Джунглях Летючих Немовлят».\n\nВін схиляється. Його пальці торкаються краю сторінки.\n\nІ тоді –\n\nНамет біля вогнища. Маленький голос поряд. Тріск полум’я. Його донька, притиснута до його руки, з широко розплющеними очима слухає, як він читає вголос історію про битву Ґроґнака проти немовлят-летючих кажанів. Вона тоді спитала:\n\n«§RА він справді існував?§!»\n\nВін не пам’ятає, що відповів."
  nf_tob_dream.1.a:0 "Підняти комікс."
  nf_tob_dream.1.a.tt:0 "§RЦе починає Шлях Міфу.§!\n§gВи підете слідом снів Безіменного, що прагне стати більшим за людину – творцем світу з пам’яті й вигадки, поки вигадане не стане правдою. Ґроґи постануть з попелу віри.§!"
  nf_tob_dream.1.b:0 "Залишити там, де лишив вітер."
  nf_tob_dream.1.b.tt:0 "§OЦе починає Шлях Спадку.§!\n§gВи пройдете з Безіменним, як він повертає втрачене, вшановуючи пам’ять, рід і тишу. Через смуток і обов’язок Старі Кості здобудуть нову силу – а лідер отримає ім’я Тирантус.§!"

nf_tob_dream.2.t:0 "Бібліотека Пилу"
nf_tob_dream.2.d:0 "Тепер вони приносять їх йому – зім’яті, потріпані, вигорілі на сонці комікси, витягнуті з полиць на заправках і закопаних скринь, виміняні на кулі й хліб. Старі Кості не питають навіщо. Вони бачать це в його очах.\n\nҐроґнак. Бойова Діва з Марсу. Нестримні. Сторінка за сторінкою – мрії, намальовані чорнилом, чемпіони й тирани, змії, черепи й зірки.\n\nБезіменний читає їх усі.\n\nВін будує маленьке святилище у задній частині Монумента – обкладинки, складені в нерівні стоси, сторінки обгорнуті тканиною, імпровізований аналої, де він сидить довго після того, як інші вже сплять.\n\nВін усе ще шукає.\n\nРядок. Панель. Фразу, яка розколе пам’ять, як скам’янілість під тиском. Він хоче згадати, що відповів їй тієї ночі, коли вона спитала, чи справжній Ґроґнак.\n\nВін досі не пам’ятає.\nАле вірить, що десь тут є відповідь."
nf_tob_dream.2.a:0 "Може, в наступному вона буде."

nf_tob_dream.3.t:0 "У погоні за Драконом"
nf_tob_dream.3.d:0 "Він не їв кілька днів. Не через відданість, а з необхідності – його голод загострився до межі. Він почав відчувати межі між речами. Між масовою культурою й істиною. Між чорнилом і кров’ю.\n\nКомікси лежали навколо нього, як розкидане писання. Його святилище було тихим, у світлі свічок, обгорнуте пилом і папером. Старі історії миготіли в думках – сокира Ґроґнака, що розсікає небо, Бойова Діва, що стрибає з палаючої зорі, Нестримні, що кидали виклик самій смерті.\n\nПотім він підвів очі.\n\nНад ним, у стіні Монумента, була черепна коробка. Кістки якоїсь велетенської істоти, давно похованої й наполовину забутої. Старі Кості завжди казали, що це – велетні. Це була їхня правда.\n\nАле сторінки навчили його іншому.\n\n§RЦе був Дракон.§!\n\nНе символ. Не метафора. Дракон – справжній, як подих у грудях. І якщо це правда – то все правда. Світ Ґроґнака – не брехня. Він просто глибше – захований під фальшивою шкірою іржі й жалю.\n\nТоді він зрозумів.\nВін ніколи не намагався сказати щось доньці.\nЦе §Rвона§! намагалася сказати §Rйому§!.\n\nІ вперше за багато, багато років... він ледь не почув її сміх знову."
nf_tob_dream.3.a:0 "Світ лише чекає, щоб прокинутись."

nf_tob_dream.4.t:0 "Форма Нового Племені"
nf_tob_dream.4.d:0 "Вони зібралися навколо вогню, бо довіряли йому. Вони йшли за ним з попелу Фарсона, через тріщини в камені й під тінню кісток. Він провів їх через горе й тишу. А тепер намагався дати їм історію.\n\nВін говорив про старий світ – не той, що згорів, а той, що під ним. Розклав комікси, як мапи, прокладаючи шлях через битви в кольорах маскульту й космічні випробування. Він показував, де Ґроґнак здобув ім’я – у нутрощах пекла, проти звіра, що носив обличчя тих, кого він не врятував.\n\nПлем’я слухало – з недовірою. Дехто зводив брови. Дехто кидав погляди. Дехто посміхався – не зі зневаги, а з тієї доброти, яку залишають божевільному, якого все ще любиш.\n\nАле Безіменний не похитнувся.\n\nВін згорнув комікс. Вказав на захід.\nНа Бургам-Спрінґс.\n\nЯкщо Ґроґнак знайшов істину в пеклі – то знайде й він. І коли повернеться – вони вже не будуть вцілілими.\n\nВони стануть Ґроґами."
nf_tob_dream.4.a:0 "У вогонь – щоб стати міфом."

nf_tob_dream.5.t:0 "Випуск №5: Дим носить Роги"
nf_tob_dream.5.d:0 "Ніхто не знає, що побачив Безіменний у Бургам-Спрінґс.\nЛише те, що він повернувся, ходячи боком крізь дзеркала,\nтягнучи за собою тишу, від якої Ґроґи плакали.\n\nКажуть, він бився з Атласом Диму,\nроги шкребли зірки,\nі щоразу, коли він бив,\nдракон вражав його ім’ям ще давнішим.\n\nВін розмахував міфом, як мечем,\nспогадом, обгорнутим у брехню,\nі в порожнечі того бою знайшов своє Дух-Я.\n\nВін розірвав Роз’єднання й пустив духів увсередину,\nвигнав Джинна Глибин, розчинивши його метафору."
nf_tob_dream.5.a:0 "І з того моменту Ґроґи народились."

nf_tob_dream.6.t:0 "Тиран-Ватажок"
nf_tob_dream.6.d:0 "Монумент був тихішим, ніж зазвичай – вітер сичав поміж ребер кам’яного звіра, вогнища тліли. Безіменний сидів наодинці, поки голос не пролунав крізь пил.\n\nВона була загорнута в стару шкіру, очі – випалені сонцем, повні далини. Одна з Молодої Крові. Уціліла. Вона блукала далеко, шукаючи старі сигнали, давні історії. І тепер говорила про те, що залишилось.\n\nДоньки Гекати прийшли не як загарбники, а як знамення. Вони не залишали нічого. Серед тих, хто став проти них, був Тиран-Ватажок – Тирантус – останній з роду. Не тиран через жорстокість, а за церемонією. Це було давнє звання, передаване від засновників племені. Той, хто брав на себе всі рішення, всі жертви.\n\nБезіменний мовчав спочатку. Але він згадав.\n\nВін згадав ігри, сміх у каньйонах. Як вони бігали й билися разом. Як боролися за серце однієї жінки – його дружини, що вже давно зникла – і як це було без гіркоти, лише ритуал. Він не знав, що Тирантус ніс це ім’я до самого кінця.\n\nТепер знав.\nІ воно лежало в його грудях, як камінь."
nf_tob_dream.6.a:0 "Він ніс його гідно. До самого кінця."

nf_tob_dream.7.t:0 "Доля Тирана"
nf_tob_dream.7.d:0 "Це прийшло не уві сні й не через вогонь, а через допит.\n\nОдна з Доньок Гекати, захоплена після прикордонної сутички – її губи потріскані, погляд зухвалий навіть у ланцюгах – вимовила слова з презирством, а може, й із радістю. Але вони впали, мов повільно витягнутий ніж.\n\n§RТирантус§!, останній з Молодої Крові, не просто загинув у бою.\n\nЙого заслали до Бургам-Спрінґс.\nПокарання за відмову виконати наказ Темної Матері. Заслання у проклятий розлом. Доля, гірша за смерть – призначена, щоб стерти його з міфу. Жодна душа не виживе в Бургамі.\n\nТого вечора вогонь у Монументі тлів.\nАле в Безіменному щось спалахнуло.\n\nВін вже ходив крізь дим. Він чув, як ім’я повертається до нього крізь голос міфу. Якщо пам’ять про Тирантуса можна повернути – якщо хоча б §Rодну§! реліквію, одну істину знайти в тому місці – тоді надія може повернутись до тих, хто пережив Молодих Кровей.\n\nНе як скорбота.\nА як §Rспадок§!."
nf_tob_dream.7.a:0 "Тоді ми підемо до Бургаму. Ще раз."

  nf_tob_dream.8.t:0 "Другий Перехід"
  nf_tob_dream.8.d:0 "Цієї ночі вітер ніс пісні.\nНе бойові, а підготовчі – низькі, тужливі тони, що розтікались по долині, наче спів для чогось, що спить під скелею. Ґроги зібрались мовчки, стоячи поруч із родичами зі Старих Кісток і останніми з Молодої Крові. Його імені ніхто не згадував – лише спостерігали, як він готується.\n\nЖінки-попіл вкрили його димом і ґрунтом. Діти вклали намистини в його долоні, а старійшини шепотіли молитви велетенським богам, прохаючи, щоб ті пильнували за ним, якщо вже міфи відвернулися. Жодної церемонії – лише тиша. І тоді він пішов один.\n\nУ §RBurham Springs.§!\n\nПлем’я чекало.\n\nВони чекали одне сонце. Потім – інше.\nА потім, з хребта, він повернувся.\n\nУже не той, хто йшов. На ньому була броня з кісток, закопчена до чорноти – білі ребра проглядали з-під сажі, кожна пластина викувана вогнем і рішучістю. Виявилось, кістки вціліли там, де людина – ні. Загартовані випробуванням, вони захистили те, що лишилося.\n\nУ них він знайшов частинку Тирантуса.\nІ тому, він поніс його далі.\n\nТієї ночі плем’я схилило коліна.\nА Безіменний піднявся – відроджений як Вождь-Тиран."
  nf_tob_dream.8.a:0 "Він узяв ім’я Тирантус – не заради слави, а як обітницю."

  # Tooltips
  tob_grog_flag:0 "Обрав Шлях §RМіфу§!."
  TOB_ready_for_burham:0 "Ми готові вирушити до Бурхем-Спрінґс."
  TOB_release_mesmeralda:0 "Милість для Королеви Горґон"
  TOB_release_mesmeralda_desc:0 "Кажуть, десь на заході хтось теж упав у Хабрис – тільки голосніше. Слід розкопати їх, змахнути пил, а якщо вони мертві... ми просто вклали їх у нову історію сном."
  TOB_invite_mesmeralda:0 "Союз із Королевою Горґон"
  TOB_invite_mesmeralda_desc:0 "Кажуть, що світ не гине – він лише перебудовується. Що під бетоном і димом, під іржавими щоглами та вибіленими вивісками, приховано решітчасту структуру – візерунок, давніший за міста, ще до Роз’єднання, витканий у пилюці. Щоб побачити його, треба танцювати.\nМезмеральда прийшла не сама, а в процесії, що рухалась пустелею як думка. Замасковані Горґони, розфарбовані, співали, вимальовуючи спіралі в піску з кожним кроком. Коли вона постала перед Ґроґом – вона не сказала жодного слова. Лише усміхнулась – ніби впізнала розділ, давно прочитаний.\nЦе – не завоювання. Це – злагода.\nСпільне бачення, щоби переписати світ не війною, а кращою історією."

