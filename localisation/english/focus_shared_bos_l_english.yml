l_english:
shared_bos_our_founding:0 "Наше заснування"
 shared_bos_our_founding_desc:0 "Хоча Верховний Старійшина Максон був засновником Братства в цілому, кожен капітул мав своїх власних засновників — тих, хто поширював інформацію про небезпеку технологій далі в Пустку. Хто був нашими засновниками?"

 shared_bos_our_interim:0 "Наш проміжний етап"
 shared_bos_our_interim_desc:0 "Кожен капітул Братства має свої пріоритети. Деякі зосереджені на зборі потужної зброї Старого Світу, тоді як інші віддають перевагу промисловому обладнанню та інструментам. На чому зосередились ми?"

 shared_bos_our_future:0 "Наше майбутнє"
 shared_bos_our_future_desc:0 "Ми багато чому навчилися за роки, які залишилися позаду. Тепер ми повинні використати цей досвід і підготуватися до довгих років, що чекають на нас попереду."

 shared_bos_water_operations:0 "Водні операції"
 shared_bos_water_operations_desc:0 "Маючи безпечний доступ до великої водойми, ми можемо почати розширювати наші операції на морський театр. Хоча ми майже не маємо досвіду в таких справах, ми можемо звернутися за порадою до довоєнної тактики."

 shared_bos_port_expansion:0 "Розширення порту"
 shared_bos_port_expansion_desc:0 "Щоб розмістити боєздатний флот, нам потрібні численні об'єкти, такі як сухі доки, ремонтні верфі, пірси тощо. Для досягнення наших цілей нам доведеться вкласти значні кошти в розширення нашої існуючої військово-морської інфраструктури."

 shared_bos_supporting_vessels:0 "Морські рейдери"
 shared_bos_supporting_vessels_desc:0 "Менші та легші судна складають більшу частину сучасного флоту Пустки. Щоб зберегти нашу перевагу на морі, ми повинні інвестувати у виробництво простих, надійних кораблів, які можуть з легкістю турбувати ворожі судна."

 shared_bos_larger_vessels:0 "Облогові кораблі"
 shared_bos_larger_vessels_desc:0 "Щоб завдати хоч якоїсь шкоди ворожому флоту і ефективно підтримувати наші війська на березі, нам потрібно мати можливість будувати великі кораблі, здатні нести важке озброєння. Зосередження на цьому наблизить нас до морського панування."

 shared_bos_reclaim_a_flagship:0 "Відновлення флагмана"
 shared_bos_reclaim_a_flagship_desc:0 "Проєкція сили — це все. Щоб справді залишити свій слід на морях, ми не можемо просто мати ефективний флот: він також має вражати. Відновлений флагман Старого Світу чудово задовольнить наші потреби."

 shared_bos_aerial_operations:0 "Повітряні операції"
 shared_bos_aerial_operations_desc:0 "Гнучкість — це те, чого нашій організації часто бракує. Щоб компенсувати наші слабкі сторони, ми маємо перетворити їх на сильні. У минулому великі експедиції здійснювалися за допомогою авіації. Ми можемо навчитися цьому."

 shared_bos_from_the_skies:0 "З небес"
 shared_bos_from_the_skies_desc:0 "Хоча ми маємо знання для модифікації найпростіших літаків, ми не знаємо, як пілотувати їх у бою або як їх тактично застосовувати. Нам слід звернутися до наших баз даних та адаптувати якомога більше інформації про довоєнну повітряну тактику."

 shared_bos_staging_bases:0 "Перевалочні бази"
 shared_bos_staging_bases_desc:0 "Авіація — це величезне прес-пап'є без належних об'єктів для її обслуговування та озброєння, а також без достатнього відкритого простору для зльоту та посадки. Якщо ми хочемо створити ефективні військово-повітряні сили, нам потрібно розвідати ідеальні місця для створення аеродромів і зробити це."

 shared_bos_aerial_supremacy:0 "Перевага в повітрі"
 shared_bos_aerial_supremacy_desc:0 "З нашим новим розумінням повітряного бою ми можемо почати перепроєктування наших літаків з урахуванням умов Пустки. Заощадження на всьому можливому збереже нам багато часу на виробництво та цінні ресурси, яких зараз катастрофічно бракує."

 shared_bos_flight_academy:0 "Льотна академія Братства"
 shared_bos_flight_academy_desc:0 "Пілоти — це джерело життєвої сили військово-повітряних сил, і наші пілоти повинні ефективно використовувати наші обмежені запаси літаків, боєприпасів та спорядження. Створення ретельної програми підготовки для пілотів не тільки дозволить краще використовувати наше обладнання, але й може дати нам справжнього аса."

 shared_bos_our_right:0 "Наше право"
 shared_bos_our_right_desc:0 "Як технократична організація, кожна технологія по праву належить нам. Ми не крадемо технології зі злого умислу, ми забираємо їх, щоб захистити невинних, які неминуче використають їх на шкоду. Хоча люди не завжди це розуміють, усе, що ми робимо, врешті-решт спрямоване на збереження безпеки в Пустці. Нашому розумінню технологій немає рівних."

 shared_bos_salvaged_metal:0 "Зібраний метал"
 shared_bos_salvaged_metal_desc:0 "Металобрухт знайти легко. Покручені шматки металу такі ж поширені в Пустці, як і бруд — вони стирчать із будівель, зариті в землю, мов бур'ян, і розкидані по вулицях, мов сміття. Збір металу в нашому найближчому оточенні забезпечить нас додатковими ресурсами для нашого спорядження."

 shared_bos_increase_power_production:0 "Збільшення виробництва енергії"
 shared_bos_increase_power_production_desc:0 "Генератори — це одночасно і благословення, і прокляття. Вони виробляють велику кількість енергії за відносно низьку вартість обслуговування, але часто вимагають специфічних паливних елементів, і їх важко переробити для роботи на кукурудзяному паливі. Інвестиції у виробництво електроенергії завжди підуть на користь виробництву нашого спорядження."

 shared_bos_salvaged_electronics:0 "Зібрана електроніка"
 shared_bos_salvaged_electronics_desc:0 "Збирати електроніку набагато складніше, ніж метал, частково через її крихкість. У найкращому випадку, вилучення проводки та мікросхем з радіоприймачів, роботів і зламаної енергетичної зброї забезпечить нас додатковим електронним брухтом для майбутніх проєктів."

 shared_bos_advanced_tech:0 "Просунуті технології"
 shared_bos_advanced_tech_desc:0 "Збирати рідкісні технології не тільки важко, але й небезпечно. Часто місця, де можна знайти рідкісні довоєнні технології, також наповнені роботами-вбивцями, смертельною радіацією або іншими небезпеками. Тим не менш, збір просунутих технологій дозволить нам створювати численні високотехнологічні зразки обладнання, тому це необхідно зробити."

 shared_bos_fueling_our_rise:0 "Паливо для нашого піднесення"
 shared_bos_fueling_our_rise_desc:0 "Паливо буває різних видів, але наші пошукові групи найчастіше шукають ядерне. Невитрачені паливні елементи неймовірно цінні для всіх у Пустці, але особливо для нас. Вони живлять нашу силову броню, наші гатлінг-лазери та наші генератори. Забезпечення ними є високим пріоритетом для всіх розвідників."

 shared_bos_arm_foundries:0 "Збройові ливарні"
 shared_bos_arm_foundries_desc:0 "Ми не можемо поширювати і підтримувати нашу доктрину без застосування сили, і ми не можемо ефективно застосовувати силу, якщо наші бійці недостатньо забезпечені. Якщо Братство має намір продовжувати свої операції, ми повинні не тільки забирати технології з рук поселенців, але й виробляти їх самостійно."

 shared_bos_civilian_workshops:0 "Цивільні майстерні"
 shared_bos_civilian_workshops_desc:0 "Багато бункерів та баз, які ми прагнемо зайняти, не залишилися недоторканими Великою війною, і вони потребують масштабного ремонту та розкопок, щоб стати повністю придатними для використання. Щоб переконатися, що ми готові до майбутніх будівельних робіт, ми повинні почати розвивати власну невелику промислову базу."

 shared_bos_heavy_production:0 "Важке виробництво"
 shared_bos_heavy_production_desc:0 "Завершивши наші проєкти в цивільній та військовій промисловості, ми бачимо, що наші зусилля окупаються з лиштком. Щоб і надалі сприяти успіху та підживлювати наше зростання, нам слід розпочати другу, меншу будівельну кампанію, зосереджену на поєднанні обох галузей. Поряд із цим ми можемо також створити інфраструктуру для майбутніх починань."

 shared_bos_our_might:0 "Наша міць"
 shared_bos_our_might_desc:0 "Братство Сталі бояться і поважають у всій Пустці за нашу військову міць. З точки зору бойової ефективності, ми стоїмо набагато вище тих покидьків, що населяють Пустку. Один боєць у силовій броні вартий десяти неброньованих солдатів, якщо не більше. Вивчення попередніх зіткнень допоможе нам вдосконалити нашу майбутню бойову доктрину."

 shared_bos_steel_legions:0 "Сталеві легіони"
 shared_bos_steel_legions_desc:0 "Стоячи пліч-о-пліч, наші бійці утворюють стіну незламної сили. Братство схоже на один довгий ланцюг, розтягнутий по всьому континенту, з багатьма-багатьма ланками по всій його довжині. Жодна частина Братства не є слабкою, кожен чоловік і жінка навчені до такого рівня майстерності, про який інші групи можуть лише мріяти."

 shared_bos_new_initiates:0 "Нові послушники"
 shared_bos_new_initiates_desc:0 "Ми більше, ніж просто військова організація, Братство — це одна велика родина. Наші лицарі, паладини та писці вільні будувати стосунки, одружуватися і мати дітей. Саме так Братство виживає. Коли ці діти досягають повноліття, вони стають послушниками і починають навчання за своєю дисципліною."

 shared_bos_t45d_production:0 "Виробництво T-45d"
 shared_bos_t45d_production_desc:0 "T-45d була першою моделлю силової броні, виробленою в Америці, і це видно. Простий каркас, слабкі сервоприводи, відкриті вразливі місця і не надто вражаючий дизайн шолома. Тим не менш, будь-яка силова броня краща, ніж ніякої, а її простота робить її швидшою в ремонті та виробництві."

 shared_bos_t51b_production:0 "Виробництво T-51b"
 shared_bos_t51b_production_desc:0 "Вершина довоєнного дизайну силової броні, модель T-51b є улюбленицею Братства Сталі за її надійну конструкцію, керамічну композитну броню, відсутність явних слабких місць і майстерно виготовлений шолом з фільтрами. Хоча її складніше обслуговувати і виробляти, немає сумнівів, що T-51b перевершує T-45d у всіх відношеннях."

 shared_bos_wastelander_conscripts:0 "Призовники з Пустки"
 shared_bos_wastelander_conscripts_desc:0 "Мешканців Пустки хоч греблю гати, і в них мало особливого чи унікального. Часто недалекоглядні, грубі та занадто примітивні, щоб зрозуміти небезпеку технологій: ми часто уникаємо їх, як чуми. Тим не менш, іноді потрібна свіжа кров. У такі часи ми вишукуємо серед населення гідних кандидатів, часто приймаючи до наших лав перевірених і дружніх мешканців Пустки."

 shared_bos_flesh_before_steel:0 "Плоть перед сталлю"
 shared_bos_flesh_before_steel_desc:0 "«Плоть слабка» — поширена фраза, яка для нас має зовсім інший сенс, ніж для решти. У Братстві цю фразу кажуть, щоб виразити і прийняти те, що людське тіло крихке. Навіть у силовій броні ми залишаємося людьми, і якщо тіло всередині броні не треноване належним чином, воно помре задовго до того, як броня зламається. Всіх послушників вчать розуміти: слабкість властива людині."

 shared_bos_basic_arms_for_basic_people:0 "Базова зброя для простих людей"
 shared_bos_basic_arms_for_basic_people_desc:0 "Навіть від мешканців Пустки, завербованих до наших лав, не можна очікувати такого ж розуміння технологій, як у нас. Щоб запобігти нещасним випадкам, ми надаємо новобранцям із Пустки простішу енергетичну зброю, доки вони не доведуть свою спроможність. Звісно, це означає, що ми заздалегідь виробляємо та знаходимо багато зброї для новачків."

 shared_bos_doctrinal_thought:0 "Доктринальна думка"
 shared_bos_doctrinal_thought_desc:0 "Зі свіжою кров'ю приходять нові ідеї. Мешканці Пустки думають і б'ються не так, як Братство, і цей досвід часто виявляється цінним для Братства в цілому. Змушуючи наших послушників із Пустки складати звіти про їхні попередні бої, ми можемо вивчати їх, щоб оцінити стан Пустки і відповідно підготуватися."

 shared_bos_combined_operations:0 "Спільні операції"
 shared_bos_combined_operations_desc:0 "Навчитися битися пліч-о-пліч із колишніми мешканцями Пустки буває складно. Їхній дикий стиль бою, орієнтований на виживання, часто буває метушливим і непередбачуваним. Саме тому їх вербування може бути таким цінним, і саме тому їх інтеграція в нашу командну структуру така вигідна. Ця дика, непередбачувана натура робить наші загони ефективнішими, ніж будь-коли."

 shared_bos_our_goal:0 "Наша мета"
 shared_bos_our_goal_desc:0 "Ідеологія Братства проста. Ми прагнемо світу, в якому нерозсудливість людини не буде підсилюватися інструментами, якими вона володіє, світу, де не кояться звірства заради «наукового прогресу». Ось чому ми конфіскуємо технології та знищуємо те, що не можемо конфіскувати. Всі наші обов'язки виконуються на благо людства в цілому."

 shared_bos_seek_technology:0 "Технологічне дослідження"
 shared_bos_seek_technology_desc:0 "Відтворити довоєнну електроніку — складне завдання навіть для найпростіших схем. Якщо ми хочемо мати хоч якусь надію на надійне відтворення більш просунутих моделей, нам потрібно розібрати наші нечисленні дорогоцінні робочі довоєнні зразки і дослідити їхню внутрішню будову. Це боляче, але поки ми не розгадаємо секрет цих речей, ми назавжди залишимося в темряві."

 shared_bos_scribe_research:0 "Дослідження писців"
 shared_bos_scribe_research_desc:0 "Заохочення наших писців до тривалих дослідницьких проєктів неодмінно винагородить нас. Надання пріоритету довгостроковому вивченню та самоаналізу має зробити наші результати точнішими, а залучення писців до складу розвідувальних загонів зробить їх набагато здібнішими у дослідженні довоєнних об'єктів. Писці — це хребет Братства, і ми повинні продовжувати відточувати їхні навички."

 shared_bos_old_developments:0 "Старі розробки"
 shared_bos_old_developments_desc:0 "Довоєнні технології цінні самі по собі, навіть якщо вони зламані і є суцільним брухтом. Прочісування довоєнних руїн у пошуках невідкритих рідкісних технологій, зламаних чи сяк-так працюючих, є важливою частиною операцій Братства в Пустці."

 shared_bos_robotic_advancements:0 "Робототехнічні досягнення"
 shared_bos_robotic_advancements_desc:0 "До Великої війни робототехніка була однією з найбільших галузей промисловості Америки, і країна вважалася світовим лідером у цій сфері. В результаті Пустка всіяна оболонками зламаних роботів, а також блукаючими фігурами тих, хто все ще слідує застарілим програмам. Розбирання і тих, і інших допоможе нам у створенні роботів для власних цілей."

 shared_bos_vertibird_schematics:0 "Креслення гвинтокрилів"
 shared_bos_vertibird_schematics_desc:0 "Найцінніші з усіх довоєнних креслень, креслення гвинтокрилів, є рідкісними, і їх важко знайти. Всі відомі копії надходили тільки від Анклаву, і з їхньою загибеллю це дорогоцінне джерело вичерпалося. Тим не менш, колишні техніки Анклаву, які уникли загибелі, часто беруть із собою багато інструментів... а іноді й одне-два креслення."

 shared_bos_bunker_thought:0 "Бункерне мислення"
 shared_bos_bunker_thought_desc:0 "Майже всі члені Братства народилися в бункері, і більшість із нас провели своє життя, дорослішаючи в них або поблизу них. Для нас безпека бункера є обнадійливою та заспокійливою. В результаті, укріплення Братства будуються за вищими стандартами, ніж більшість інших, завдяки нашій обізнаності з армованими конструкціями."

 shared_bos_surface_outposts:0 "Наземні аванпости"
 shared_bos_surface_outposts_desc:0 "Щоб розширювати наші операції все далі й далі, нам потрібні безпечні об'єкти для зберігання припасів і відпочинку між експедиціями. Створення інженерного корпусу спеціально для будівництва наземних укріплень принесло б нам велику користь."

 shared_bos_underground_workshops:0 "Підземні майстерні"
 shared_bos_underground_workshops_desc:0 "Розширення нашої промислової бази всередині мережі бункерів є нашим наступним пріоритетом. Розміщення виробництва на укріплених позиціях дозволить нам підтримувати пристойний рівень випуску продукції навіть у скрутному становищі, фактично створюючи такий рівень промисловості, який наш ворог не зможе захопити до самого кінця."

 shared_bos_new_technology:0 "Технологічний прорив"
 shared_bos_new_technology_desc:0 "Наші писці зробили низку значних наукових відкриттів одне за одним, розширюючи наші горизонти і докорінно впливаючи на всі наші поточні дослідницькі проєкти. Це справді неймовірно, оскільки ці знання дозволять нам продовжувати наші дослідження і проєкти з відновлення швидше, ніж будь-коли раніше."

 shared_bos_tesla_theory:0 "Теорія Тесли"
 shared_bos_tesla_theory_desc:0 "Завдяки нашим новим проривам у галузі науки, наші писці змогли відтворити довоєнне креслення, знайдене нами дуже давно. Раніше ми не могли відтворити його ефекти без катастрофічних наслідків. Однак тепер нам нарешті вдалося стабілізувати конструкцію настільки, щоб її можна було використовувати в бою. Зброя Тесли була додана до наших арсеналів!"