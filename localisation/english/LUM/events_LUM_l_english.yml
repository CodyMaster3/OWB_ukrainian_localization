l_english:
  nf_lum.1.t:0 "Безодня"
  nf_lum.1.d:0 ""Великий Сяючий, благословенна Його Воля, не сміє ніхто сумніватися в Його святості" — молитва для зведених, Книга Сяйва, 5:19\n\nПостаті Просвічених, некроманту, знаному як Великий Сяючий, не властиві розмови про життя до Сяйва. І жоден з його послідовників про це не говорить. Дехто з його найближчих радників підозрює, що навіть він сам уже нічого не пам’ятає. Та він описує речі, знати які може лише той, хто народився або жив до Великої війни: занепад Америки, зелень її ландшафтів, буденність життя в державі, що наближалась до відродження — або краху.\n\nОднак Великий Сяючий не завжди був великим. Ніхто, крім найвірніших, не знає, що колись він був хворобливим і немічним. Він пам’ятає сигнали апаратів, зойки близьких, погляди, сповнені жаху й жалю. Тривалий протяжний писк, а потім — ритмічне тьохкання. Він не знає, що саме його вбивало, але ті спогади про смертність стали причиною його непохитної рішучості ніколи більше не підкорятись слабкості. Його переродження у Сяючого зробило це можливим.\n\nПравда ж у тому, що життя Великого Сяючого до Великої війни було позначене..."
  nf_lum.1.a:0 "...боротьбою з лютим захворюванням, можливо, раком."
  nf_lum.1.b:0 "...майже фатальним досвідом голодування."
  nf_lum.1.c:0 "...ранами, отриманими в невідомому конфлікті, можливо, навіть власноруч завданими."

  nf_lum.2.t:0 "Погляд усередину"
  nf_lum.2.d:0 "Після Великої війни Великий Сяючий довго блукав спустошеною Америкою. Він бачив, як звичайні тварини ставали потворами. Бачив, як інші гулі втрачали розум — від люті, відчаю чи чогось гіршого. Його обстрілювали вижилі, які боялися заразитися від зеленого світіння, що лилося з його плоті. І часом сам Великий Сяючий знову ставив собі питання — чи потрібна йому їжа, вода, щось узагалі?\n\nЦе й більше штовхнуло його на межу безумства. Він бачив те, чого не існувало. Слухав голоси, що кликали повернутись. Бачив спотворення — речі звичайні ставали огидними, а знайоме — химерним. На краю втрати розуму, готовий перетворитись на чергову дику тінь, Великий Сяючий прибув до радіоактивної пустки за Санітарним кордоном Небраски.\n\n«Ось! У сяйві осяяння розум очистився, і очі Великого Сяючого прозріли! І почав він втілювати видіння!» — Спів прозріння, Книга Сяйва, 3:13"
  nf_lum.2.a:0 "Він побачив Землю, де всі люди тримаються за руки в єдності."
  nf_lum.2.b:0 "Він побачив незліченні лави гулів, озброєних і готових до війни."
  nf_lum.2.c:0 "Він побачив яскраве світло, що ламало саму реальність і відкривало таємниці всесвіту."

  nf_lum.3.t:0 "Пасти ягнят"
  nf_lum.3.d:0 "З попелу відчаю й глибин безумства Великий Сяючий постає з новою метою — сяючою та незламною, як саме Сяйво: він стане пастирем для нового людства. Його мандрівки пролягали далекими краями в пошуках істини. Одним із поворотних пунктів стала Грейвстоун — місце, де єпископи Плутонія навчали священних ритуалів атомного поклоніння. Там він опанував радіацію як спасіння й зброю: розщеплювати невігластво, мов атом, звільняючи очищувальне світло навернення. Після цього він залишив Грейвстоун з їхнім вогненним благословенням: «У Сяйві всі перетворюються!»\n\nПовернувшись до Колиски, Великий Сяючий розпочав свою місію по-справжньому. Його срібно-зелений язик невтомно проповідував як людям, так і гулям, провіщаючи неминучість гуляфікації як наступного святого етапу людства. Одним із перших його послідовників став Сяючий Батько — до війни буддистський вигнанець, уособлення тантричних таїн, який десятиліттями шукав мир у руїнах. Його спокійна вдача та глибоке розуміння страждання стали духовним ядром нового руху, й разом вони мандрували пусткою, приводячи вірних до Колиски.\n\nТа якщо Сяючий Батько навертав співчуттям і розумом, то Великий Сяючий, переслідуваний спогадами про насильство, обрав інший шлях. Він звів прихований санктуарій, де міг експериментувати з вірою, людяністю й Сяйвом. Там він творив ритуали навернення над тими, хто не прийшов добровільно — їхні крики лунали з Колиски, коли плоть і віра переплавлялись у щось нове.\n\n«Дивіться, мої учні! Недостойні будуть очищені, їхня крихка людяність — розщеплена, мов нестабільний ізотоп. І з цієї радіації зродиться відданий гуль, охрещений Сяйвом!» — Великий Сяючий, Книга Вічності, РЕДАКТОВАНО"
  nf_lum.3.a:0 "Великий Сяючий вів язиком срібно-зеленим новонавернених до Колиски."
  nf_lum.3.b:0 "На суші, в морі чи в небі — Великий Сяючий знайде кожного, хто має навернутись."
  nf_lum.3.c:0 "Сяючий Батько почав тривожитись, скільки часу Великий проводить у своїй лабораторії..."

  nf_lum.4.t:0 "Батько і Великий"
  nf_lum.4.d:0 "Колиска Сяйва, роками зростаючи, повільно перетворилась із радіоактивного пустиря на напіввійськово-промисловий комплекс. Біля воронок радіації ставили хрести — для найвідданіших людських навернених. Бараки, арсенали й укріплені храми вкривали ту мізерну землю, яку можна було обжити. Проповіді про мир і достаток поступились лементам: «навернення для негідних» та «дар — для недостойних».\n\nСяючий Батько, усе частіше віддаляючись у самостійні місії, зрештою усвідомив, що віра, яку він колись ніс, стала мілітаризованою. Він вирішив виправити це. Після однієї з проповідей він покликав Великого Сяючого й вказав йому нове місце — нібито перспективне: за рікою, із покинутими урановими шахтами й очищувальними станціями, що начебто годились для нового центру навернення.\n\nНасправді ж Батько відвідав це місце лише раз і визнав його безнадійним. Із цією думкою він послав туди Великого Сяючого й більшість його озброєної пастви. Щойно вони перейшли ріку — він і його мирні послідовники звели блокпости, перекривши шлях назад. Новосяйні виявились замкнені по той бік.\n\nВеликий Сяючий зрозумів обман лише через тижні, коли зв’язок було втрачено. Тоді він наказав захопити радіоактивні руїни Шаєнна й оселився на Червоній Горі, готуючись до зіткнення з тими, хто зрадив віру. До цього протистояння долучились й Баґґери — які вважали, що жодна віра не має насаджуватись силоміць, тим паче шляхом перетворення на гуля. І Зів’ялі Пси — бо мали досвід із псевдопастирями раніше."
  nf_lum.4.a:0 "«Радійте, вірні! Тут ми закладемо нову Колиску!»"
  nf_lum.4.b:0 "«Проповідуйте в кожному місті, свідчіть у кожному вогнищі! Не зупинимось, поки всі не стануть одним!»"
  nf_lum.4.c:0 "«Фальшивий Батько розгнівав мене. Він не матиме другого шансу.»"

  nf_lum.5.t:0 "Особлива проповідь"
  nf_lum.5.d:0 "Великий Сяючий поглянув на колишніх лідерів Баґґерів — Ґоддарда і Колріджа. Обох позбавили одягу, залишивши лише релігійні шати, вдягнені на них аколітами Великого. Вони висіли в залізних клітках над радіоактивною ямою.\n\n«З Цією Великою Перемогою, Крихкі Люди, Я Віддаю Вас Вічності. Хай Вона Помилує Ваші Душі».\n\nІ з тими словами клітки повільно почали опускатись. Колрідж першим відчув вплив: почав блювати на шати, а його волосся злітало, ніби перука. Його шкіра обвисала і зрештою злізла — він більше нагадував розплавлену скульптуру, ніж людину. Ґоддарду дісталось ще гірше. Він кричав ще до того, як клітку почали опускати, тряс прути, сподіваючись на допомогу, яка не прийде. Його крики ставали все більш тваринними. Коли клітки досягли дна, обидва перетворились на агонізуючі пам’ятники тим, хто зрадив Просвічених. Неможливо було сказати, чи вони ще при розумі, чи стали фералами — тільки їхній вереск заглушав хвалу натовпу.\n\nЗів’ялі Пси, вже будучи гулями, уникли долі Баґґерів. Їх прибили до хрестів і скинули в радіоактивну яму. Для Великого Сяючого це була втрата, але необхідна: його воїни не повинні мати інших лідерів, окрім нього."
  nf_lum.5.a:0 "Писарі, Запишіть Це: Хто Зрадить Великого Сяючого — Пізнає Його Гнів."

  nf_lum.6.t:0 "Сяюча коронація"
  nf_lum.6.d:0 "Великий Сяючий сидів у своїй особливій Сяючій Силовій Броні на троні з Колиски Сяйва. Трон був одним із небагатьох артефактів, вивезених з Колиски — джерело живлення для його броні. Тепер, після перемоги, він знову одягнув обладунок, який сам створив десятки років тому, щоб вижити у Виттям Світі. Його радники стояли поруч, а Сяючі Воїни — на поготові, слідкували за натовпом.\n\nХоча Колиску Сяйва ще не було повернуто, перемога над Баґґерами і Зів’ялими Псами стала причиною для коронації Великого Сяючого як Царя Люмінесценції. Зачеплений Радник приніс корону — перероблений шолом Сяючої Броні, знайдений ще у перші роки його шляху.\n\n«Я Смиренно Приймаю Коронування Як Цар Королівства Люмінесценції! ТЕПЕР КЛОНІТЬСЯ ПЕРЕДІ МНОЮ!»\n\nБезсмертні Лицарі активували зброю, яка засяяла отруйно-зеленим світлом. Натовп вибухнув оплесками, навіть ті, хто сумнівався, миттєво приєднались до свята.\n\n«Я — ВАШ ЦАР. Я — ЖИТТЯ І НЕМЕРТВІСТЬ. Я — НАЙВЕЛИЧНІШИЙ ІЗ СЯЮЧИХ!» МИ. ВІЧНІ."
  nf_lum.6.a:0 "Так корона торкнулась чола Царя Люмінесценції."

  nf_lum.7.t:0 "Страсті Великого Сяючого"
  nf_lum.7.d:0 "Перехрестя Мерця, яке кілька років жило в мирі під проводом Сяючого Батька, знову стало місцем мілітаристських співів, кривавих проповідей і понівечених гулів — здебільшого навернених або страчених єретиків. Сяючий Батько лежав у пилюці, затиснутий під ногою Великого Сяючого в броні.\n\nВеликий не зводив очей. «Ти Мене Зрадив. Ти Мене Обдурив. Ти Міг Мене Принизити». Тиск посилився.\n\n«Та Одне Ти Зробив Добре. Раніше Я Був Дурнем, Що Довіряв Іншим. Але Ти Зробив Мене Жорстоким». Він зняв ногу з голови Батька.\n\n«Воїни, Підніміть Цього Нікчемного Послідовника. Я Покажу Йому Справжнє Значення Вічності».\n\nПісля роздягання, його зморщене тіло було виставлено натовпу. Потім спорудили високу металеву електричну хрестовину — найвищу серед усіх. Воїни прибили його до неї.\n\n«МИ ПЕРЕМОГЛИ ЄРЕТИКІВ!» — пролунав крик Великого Сяючого.\n\nНатовп радісно відповів.\n\n«ТОЖ РАДІЙТЕ І СВЯТКУЙТЕ! МИ СВЯТКУВАТИМЕМО ЦЕЙ ДЕНЬ ЩЕ ДОВГО!»"
  nf_lum.7.a:0 "Коли натовп розійшовся, лише Сяючий Батько залишився висіти — приречений ніколи не вмерти, але й не жити по-справжньому."

  nf_lum.8.t:0 "Потреби царя"
  nf_lum.8.d:0 "Великий Сяючий та його радники — Прикутий і Прикрашений — зібралися навколо металевого столу в старому святилищі Великого. Протягом кількох днів вони розробляли можливі місця для нової столиці — Сяючого Замку, величного собору, гідного величі його Царства.\n\nПершим заговорив Прикрашений, тримаючи своє радіоактивне намисто: «Ваше Царственність, ми з Прикутим обрали кілька місць, але звели їх до двох або трьох основних».\n\nПрикутий вказав на перше: «Можливо, збудувати його тут, у Перехресті Мерця. Це священне місце віри, і хоч ми досі відновлюємо його після осквернення Лжебатьком, воно вже добре укріплене».\n\nПрикрашений додав: «Також можна повернутись на Червону Гору. Там збереглася наша громада, і звідти ми зможемо швидко готувати Велику Сяючу Хрестову ходу проти невірних Колорадо».\n\nПрикутий втретє заговорив: «Є ще одна ідея — збудувати замок поруч із Куполом Боулдера. Кажуть, він приховує багато таємниць, які Ви зможете осягнути. А велика вежа поруч із такою відомою спорудою переконає місцевих у нашій силі та істинності віри».\n\nОбидва радники закінчили в унісон: «У нас обмаль ресурсів, Ваша Святість, тож обирайте мудро!»\n\nВеликий Сяючий звузив погляд, вивчаючи карту. Нарешті, рішуче вказав пальцем."
  nf_lum.8.a:0 "«Ми збудуємо тут»"
  nf_lum.8.b:0 "«Повернімося й знову погляньмо з вершини»"
  nf_lum.8.c:0 "«Сяюча вежа швидко наверне невірних у світло»"
  nf_lum.8.e:0 "«Пси володарювали в Денвері занадто довго. Настав час зробити його гідною столицею!»"

  nf_lum.9.t:0 "Світло — для гідних"
  nf_lum.9.d:0 "З приватного щоденника Великого Сяючого (відредаговано для читання): «За десятки років дослідження анатомії гулів, я здобув усе більше доказів моєї теорії про належне навернення людського тіла у радіоактивного гуля».\n\nВеликий Сяючий підвів очі від книги, згадуючи нещодавні експерименти, проведені після тривалої перерви на Червоній Горі.\n\n«Експеримент №1602: суб’єкта довелося реанімувати після дози 30 000 рад. Значно кращий результат, ніж при 300 000».\n\nСуб’єкт 1602 дивився на Великого з клітки, без щелепи й очей, лише глухо дихаючи.\n\n«Експеримент №1795: 3 000 рад. Сильний біль перед розплавленням кісток. Нагадати радникам прибрати рештки».\n\n«Експеримент №1942: суб’єкт утримувався в сприятливих умовах, з їжею, водою і розкішшю. Поступово седативовано. Після перетворення — некротичний постлюд без побічних ефектів. Спостереження триває».\n\nВеликий Сяючий підійшов до клітки. На старій дошці крейдою було написано: «Експеримент №1942. Як ви почуваєтесь сьогодні?»\n\nЗ темного кутка вийшла постать. Хоч її шкіра гнила, а навколо вже літали мухи, вона посміхнулася і показала великий палець.\n\n«Не можу сказати, що почуваюсь чудово, але й гірше бувало!»"
  nf_lum.9.a:0 "«Цікаво... Дуже цікаво»"

  nf_lum.10.t:0 "Майбутнє гуляції"
  nf_lum.10.d:0 "Пекуча пустеля, сухий клімат і нещадне сонце нагадували Великому Сяючому про зовнішній світ поза м’яким кліматом Колорадо та радіоактивними опіками Колиски Сяйва.\n\nЯк би йому не хотілося спостерігати, як плоть легіонерів тане з обличчя в перетворенні на нових вірних, він не міг дозволити собі кинути їх у новостворені радіоактивні ями. У нього була важливіша зустріч у південних землях — з алхіміками Лос-Аламоса.\n\n«...Отже, якщо підсумувати, шановні лікарі, ви змогли створити форму народженого гуля, того, хто не потребує навернення. Але вам потрібно, щоб гладкошкірі не зазнавали впливу Сяйва й були передані вам для експериментів».\n\nОдин зі вчених кивнув: «Так. Якщо ви профінансуєте нас... про суму домовимось згодом, — ми зможемо підвищити успішність. Легіон продавав нам лише мізерну частину рабів, тому ми лише нещодавно подвоїли відсоток виживання. На жаль, більшість випробуваних усе ще не витримують процесу».\n\nВеликий Сяючий поглянув на пустельні землі Аризони..."
  nf_lum.10.a:0 "«Багато загинуть. Але це жертва, яку я готовий принести»"

  nf_lum.11.t:0 "Зелене Сяйво проти Синьої Пошесті"
  nf_lum.11.d:0 "Великий Сяючий стояв перед зібраними гулями Небраски. Після того як машини було підкорено, «Санітарів» знищено, створінь Мертвої Лінії розбито, а заплутані союзи в Поганих Землях розв’язані — настав вирішальний момент тріумфу.\n\nГулі, як місцеві, так і прибулі, радісно вигукували, коли Цар підняв руки над головою, стоячи на руїнах стін Омахи. Коли він їх опустив, запала тиша — лише голос, підсилений десятками гучномовців, лунав крізь натовп.\n\n«Люди Поганих Земель, ви жили у страху. Страху перед хворобою, що вас косила. Що тримала вас у клітці. Але не бійтеся. Через ретельні експерименти я дійшов висновку: Синя Пошесть і всі її відгалуження мають єдиний засіб — Спасіння, Вічність і саме Сяйво.»\n\nГулі вигукували й раділи.\n\n«Справді, доба Людства згасає. З кожною зруйнованою стіною, з кожним порятунком — ми наближаємо нову епоху. Епоху Вічності.»"
  nf_lum.11.a:0 "І тоді, після століть, Кордон Санітаріус почали розбирати."

  nf_lum.12.t:0 "Ті, хто несе Сяйво"
  nf_lum.12.d:0 "Колиска Сяйва зберігала зброю з епохи, коли її мешканці були ще людьми. Хоча більшість із них давно стали дикими, деякі залишилися при розумі — й запропонували Великому Сяючому використати стародавню зброю.\n\nПерша — гамма-гармата, що випромінює чисту радіацію з примітивної антени. Потужна проти живого, але не здатна пробити броню. Друга — далекобійна гвинтівка, яку творці нарекли «Радієвою»."
  nf_lum.12.a:0 "«Колиска започаткує нову епоху. Візьміть гамма-зброю.»"
  nf_lum.12.b:0 "«Гвинтівка — зброя війни, а світ — ворог, якого слід підкорити. Візьміть її.»"

  nf_lum.13.t:0 "Найсвятіший елемент"
  nf_lum.13.d:0 "Уран — найцінніший із металів для Просвічених. Після розширення за межі Колиски Сяйва, Великий Сяючий наказав розпочати його видобуток і очищення по всій території Королівства Сяйва.\n\nПід час буріння поблизу Бріґсдейлу шахтарі випадково натрапили на частково вцілілу довоєнну уранову жилу. Зазвичай «очисний метал» використовувався лише для експериментів або в нагороду найвідданішим воїнам. Але така знахідка змусила Великого Сяючого переглянути своє ставлення до використання урану.\n\nПроте обсяг був обмеженим. Тому він обрав..."
  nf_lum.13.a:0 "...перетворити уран на нову валюту для Просвічених."
  nf_lum.13.b:0 "...розплавити метал у шлам і доправити до лабораторії для створення нової системи ресурсного виробництва."

  nf_lum.14.t:0 "Наліт на Форт Ларамі"
  nf_lum.14.d:0 "Ґерзе стояв мовчки разом зі своєю ударною групою на пагорбі, що нависав над східною стіною Форту Ларамі. «Гнилий Генерал», як його називали й вороги, і шанувальники, підняв держак свого бойового молота й без слова вгатив ним у землю. Це був знак. Одинокий пост в небо сповістив про початок атаки західного крила форту.\n\nКоричневі плащі Ґерзе та його людей замаскували їхній наступ. Поки основні сили оборонців були зайняті на заході, ударна група на сході тихо знищувала дозорних, що пішли на розвідку. Кістки тріщали, ножі пронизували плоть, а глушники перетворювали смерть на безмовну справу.\n\nУ дворі форту Ґерзе наказав розчистити бараки. Він розгорнув чорне полотно з радоновим черепом — прапор Просвічених. Піднявши його на єдину вцілілу щоглу, витягнув свій молот, розклав його, зібрав усю силу — і гепнув у землю.\n\nУдар викликав поштовх, схожий на землетрус. Скло розлетілося, дерева тріснули, солдати Чорного Каньйону попадали, тоді як воїни Просвічених залишилися незворушними. Після цього запанувала тиша — яку миттєво змінив вибух радісного реву. Прапор їхньої нації майорів над Фортом Ларамі."
  nf_lum.14.a:0 "Форт Ларамі — наш."

  nf_lum.15.t:0 "Пропозиція від Сяючого Царя"
  nf_lum.15.d:0 "Сьогодні до нас прибуло посольство з півночі — під охороною тих самих солдатів, які намагаються знищити наших легіонерських союзників. Після багатьох пафосних промов і надмірних реверансів вони нарешті дійшли до суті. Їхній провідник — гуль, який чув про наші дослідження зі створення гулів і прагне використати їх у своїх цілях. Саме заради цього, мовляв, і почав війну. В обмін на ресурси, які він зможе нам надати, він, звісно ж, вимагає нашого підкорення."
  nf_lum.15.a:0 "Більше не доведеться торгувати з м’якошкірими"
  nf_lum.15.b:0 "Ми не станемо на коліна перед самозваним «царем»"

  nf_lum.16.t:0 "Перемога!"
  nf_lum.16.d:0 "Останній постріл у війні за Північне Колорадо сьогодні пролунав. І м’якошкірі, і Зів’ялі Пси впали перед нашою відданістю та зростаючою силою. Вітер пронісся краєм Скелястих Гір, мов зітхання полегшення, що війна закінчена. Він поніс запах пороху, та сморід смерті і гниття залишився — і залишатиметься, поки наші навернені не приберуть його, щоб збудувати щось краще. Оце й буде найважче."
  nf_lum.16.a:0 "Кращий світ починається сьогодні!"

  nf_lum.17.t:0 "Остання істина"
  nf_lum.17.d:0 "Дзвін дзвонів лунав навколо.\n\nОдним із перших, що відновили після боїв, були дзвони храмів Ханаану. Ще більше дзвонів було терміново встановлено до візиту Царя. Будь-який брухт, що міг звучати належно, обтесували у дзвони й підв’язували до хрестів — поруч із ямами навернення. Місіонери з Ханаану, розмальовані воїни, вольтери, які боялися часу — всі вони вийшли на годину Виклику.\n\nГомін радості зустрічав царську гвардію в кожному поселенні на шляху від Рок-Спрінґс до Нью Ханаану. Верховні жерці проповідували нову віру, пригнічуючи сумніви, а учні-некроманти стежили за поступовим наверненням місцевих у гулів.\n\nУ спогадах Великого Сяючого спливали напівзабуті образи: чи не бував він тут, у цих землях Чотирьох Штатів, до війни? Чиїсь імена, відпустка з мертвими, міста, що більше не існують.\n\nВтім, він відкинув ці думки. Минуле — стерте благословенним гнівом поділу ядра. Він — не відвідувач, а Володар Вічного Легіону, Завойовник і Об’єднувач Великого Солоного Озера. Його прихід — кінець старим віросповіданням, що жевріли, мов тіні фальшивого світу. Його дороги з’єднають нову столицю з усім світом, щоб його армії могли йти куди забажають. Він — не просто смертний. Він — Носій Останньої Істини: у сяйві — вічність, у покорі — спасіння."
  nf_lum.17.a:0 "Коли він стане володарем усього, гідними стануть усі."

  nf_lum.18.t:0 "Темниця некроманта"
  nf_lum.18.d:0 "Неочікуваного подорожнього схопили в пустці. Маленький чоловік у лахмітті, який постійно розмовляв сам із собою. Його привели до Дол-Ґулдура, щоб пізнати гостинність великого некроманта. Там він зізнався, що є дварфом з далекого укріплення Ґімлі. Учений і винахідник, що втік у вигнання, відмовившись знищити своє творіння.\n\nПід тиском він описав пристрій — кулю з кількох концентричних кілець, зроблених із рідкісного радіоактивного металу. Якщо їх правильно з’єднати, вони випромінюють потужну невидиму енергію.\n\nВолодар, як годиться, забрав сферу собі, а дварфа кинув у темницю, де той і божеволів далі. Кільця — чудове джерело енергії для подальших експериментів: створення нових гулів, посилення наявних. Він був на крок ближче до панування над усім мертвим світом. Його вже ніщо не зупинить."
  nf_lum.18.a:0 "7 кілець — від дварфів."

  ### Ланцюг подій маріонетки
  nf_lum_puppet.1.t:0 "Істина світу"
  nf_lum_puppet.1.d:0 "Пророк Сяйва надіслав своїх послідовників, щоб просвітити нас."
  nf_lum_puppet.1.a:0 "Так тому й бути."

  nf_lum_puppet.2.t:0 "Дар Гульства"
  nf_lum_puppet.2.d:0 "Деякі чинитимуть опір, але зрештою кожен м’якошкірий постане перед Сяйвом і пізнає його славу."
  nf_lum_puppet.2.a:0 "Нам подарують безсмертя."

  nf_lum_puppet.3.t:0 "Честь у служінні"
  nf_lum_puppet.3.d:0 "Королівство одного дня простягнеться на всі землі. І це одна з наших відповідальностей — зробити це можливим."
  nf_lum_puppet.3.a:0 "Народ служитиме"