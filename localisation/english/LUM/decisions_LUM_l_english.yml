  LUM_puppets_focusing:0 "Дати сенс прикордонним землям"
  LUM_puppets_focusing_desc:0 "Наші васальні держави виконують чимало функцій, зокрема зменшують навантаження з управління завойованими землями. Але це не означає, що їх можна лишити напризволяще. Великий Сяючий зможе вказати їм шлях, призначивши одну з трьох опцій:\n\n§XPастирі§! — духовенство, яке спрямовуватиме розвиток краю, проповідуючи істину Сяйва й використовуючи некромантію. Їхня увага до неба також сприятиме розвитку авіації.\n\n§GКупці§! — отримають особливі дозволи на розробку територій в обмін на частку прибутку. Це менше допоможе духовному становленню підданих, але наповнить скарбницю і стимулюватиме будівництво флоту для контролю вод.\n\n§RМарграфи§! — військові командири, що поставлять захист королівства на перше місце. У часи неспокою це може виявитися наймудрішим вибором."

