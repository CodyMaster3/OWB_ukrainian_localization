l_english:

  ## Рішення
  LUM_knights_and_knaves_category:0 "Заснування лицарських орденів"
  LUM_knights_and_knaves_category_desc:0 "                                              Шляхетність, вірність, віра, сила.\nЛицарський орден має демонструвати всі ці чесноти (і навіть більше), щоб здобути й зберегти покровительство Сяючого Короля. Лише жменька груп у нашій державі (та їхні провідники) довели свою гідність отримати цей титул — тож вони приходять до Престолу, щоб стати на коліна й присягнути на вірність в обмін на пошану й ресурси. Кожен орден живе за окремим Ідеалом, має власну унікальність і додає щось особливе до нашої військової потуги. Хоча вони чисельно обмежені — через суворі вимоги та високу вартість спорядження — їхня сила може стати незамінним мечем у майбутніх битвах."

  LUM_special_knights:0 "Орден Опромінених Клинків"
  LUM_special_knights_desc:0 "Ці лицарі невпинно тренуються у мистецтві меча, відточуючи свою майстерність у захисті Великого Сяючого та винищенні радіофобних сил пустки. Вони дотримуються лише Кодексу Біолюмінесценції, написаного Радіумозою, й гартують дух через віру у Великого Сяючого, хоробрість у перемозі та честь понад усе. У мирні часи вони стають місіонерами, замінюючи мечі на проповіді, але швидко повертають клинки до рук, якщо загрожує небезпека. Їхні уранові мечі й броня — спрощена версія обладунку самого Великого Сяючого."
  LUM_special_knights_2:0 "Розширення Ордену Опромінених Клинків"
  LUM_special_knights_2_desc:0 ""
  LUM_special_knights_hired:0 "Орден Опромінених Клинків призначено"
  LUM_special_knights_unit_tt:0 "З’являється 1 підрозділ §eОпромінених Клинків§!!"

  LUM_metal_knights:0 "Орден Умбральних Уранітів"
  LUM_metal_knights_desc:0 "У світі, де існує Залізний Альянс, Беґери та інші панцеровані союзники й вороги, цілком логічно, що групи, які опанували мистецтво Сили Броні, почали з’являтись серед Просвічених. Але Умбральні Ураніти — не шахраї. Вони виявили звалище збідненого урану та, у пориві «геніальності», почали кувати броню з нього. Їхні обладунки за захистом майже не дотягують до T-45, зате чудово захищають від радіації та завдають шкоди противнику через її випромінювання. Їхню нестачу захисту повністю компенсує отруйна слава."
  LUM_metal_knights_2:0 "Розширення Ордену Умбральних Уранітів"
  LUM_metal_knights_2_desc:0 ""
  LUM_metal_knights_hired:0 "Орден Умбральних Уранітів призначено"
  LUM_metal_knights_unit_tt:0 "З’являється 1 підрозділ §eУмбральних Уранітів§!!"

  LUM_aqua_knights:0 "Орден Плутонієвих Опікунів"
  LUM_aqua_knights_desc:0 "Стати Плутонієвим Опікуном — нелегка справа. Окрім енциклопедичних знань про кожен випуск «Tæles of Chivalrie», ці лицарі досконалі у всьому: від бою до дипломатії. Публічне лідерство несе Сер Плазмелот, майстер слова й ремесла. Але справжнє керівництво здійснює Панна Бесс — вихована в болотах Небраски, вона вижила після зараження Новою Чумою. Її вигляд відштовхує, але саме вона — геній у тактиці. Її стратегія панує в болотах і біля річок, де вона завжди перша заходить... і остання виходить."
  LUM_aqua_knights_2:0 "Розширення Ордену Плутонієвих Опікунів"
  LUM_aqua_knights_2_desc:0 ""
  LUM_aqua_knights_hired:0 "Орден Плутонієвих Опікунів призначено"
  LUM_aqua_knights_unit_tt:0 "З’являється 1 підрозділ §eПлутонієвих Опікунів§!!"

  LUM_car_knights:0 "Орден Камбастерів"
  LUM_car_knights_desc:0 "До Великої війни у Колорадо було близько восьми мільйонів автівок. Після — 90% з них перестали працювати. Назавжди. Але 10% з восьми мільйонів — це все ще вісімсот тисяч. Саме з них постали Камбастери. Механіки, фанати двигунів, безумні гонщики. Усі, хто знає, як користуватись гайковим ключем, монтуванням і завести Корвегу (не просто вдарити по капоту), — бажані. Проблема лише в тому, що решта 90% машин усе ще засмічують шляхи — шосе, тунелі, ґрунтові дороги.\n\nХоч Камбастери й придумали цікаві способи розчищення, наприклад, перетворення комбайнів на подрібнювачі, це лиш крапля в морі. Але навіть Ґіргарт визнає — самотужки їм не впоратись. Саме тому він шукає союзника, який прийме його людей. І можливо, саме Просвічені стануть тією викруткою, що знову підкрутить Гвинтика."
  LUM_car_knights_2:0 "Розширення Ордену Камбастерів"
  LUM_car_knights_2_desc:0 ""
  LUM_car_knights_hired:0 "Орден Камбастерів призначено"
  LUM_car_knights_unit_tt:0 "З’являється 1 підрозділ §eОрдену Камбастерів§!!"

  LUM_enforcer_knights:0 "Лицарство СВВТ-Порядку"
  LUM_enforcer_knights_desc:0 "Під час перших хвиль Нової Чуми Спільнота Рівнин, на відміну від сусідів, впровадила суворий карантин, немов з фільмів жахів. До початку Великої війни місцева поліція й спецпризначенці виглядали як герої антиутопії. Але жодні тренування не підготували їх до ядерного вогню.\n\nМинуло багато років, і значення слів «поліція» та «СВАТ» втратилось. Та група шукачів скарбів, які тікали з заражених теренів Небраски, натрапила на майже неушкоджену поліцейську дільницю з конвоєм СВАТ. Лідер, не розуміючи написів, узяв ім’я По Ліс. А СВАТ — через стертий A — став СВВТ. Відтоді вони підтримували порядок за стінами зараженої зони. Принаймні — до приходу Некроманта..."
  LUM_enforcer_knights_2:0 "Розширення Лицарства СВВТ-Порядку"
  LUM_enforcer_knights_2_desc:0 ""
  LUM_enforcer_knights_hired:0 "Лицарство СВВТ-Порядку призначено"
  LUM_enforcer_knights_unit_tt:0 "З’являється 1 підрозділ §eЛицарства СВВТ-Порядку§!!"

  LUM_bulb_knights:0 "Священний Орден Снерульців"
  LUM_bulb_knights_desc:0 "Тьмяні Лампочки не виникають із порожнечі, попри всі байки. Хоч Некромант і мріє опанувати мистецтво їхнього створення, наразі йому доводиться покладатись на сторонню допомогу — зокрема на Снерульців. Їхнє гасло: «Щоб впіймати здичавілого, треба мислити як він». І будучи майже повністю гулями (та кількома імунними людьми), вони це добре знають. Вони ловлять феральних і приводять їх у Лоно Сяйва.\n\nАле вождь Сн’ере має амбіції. Він іноді командує польовими загонами Тьмяних, навчає їх тактики, дає змогу виглядати майже розумними. Він — не просто пастух Ламп — він Яскравий, що веде за собою Темряву."
  LUM_bulb_knights_2:0 "Розширення Священного Ордену Снерульців"
  LUM_bulb_knights_2_desc:0 ""
  LUM_bulb_knights_hired:0 "Священний Орден Снерульців призначено"
  LUM_bulb_knights_unit_tt:0 "З’являється 1 підрозділ §eСвященного Ордену Снерульців§!!"

  LUM_super_mutant_order:0 "Супернюхи"
  LUM_super_mutant_order_desc:0 "Супермути — пострах пустки. Але є одне, що в них виходить добре, як не дивно — дресирування тварин. Від Флоутерів до Гончаків, вони навчають звірів вірності — або помирають разом із ними. Але загін Снупі інший. Вони не вирощують, а рятують — беруть покинутих звірів і перетворюють їх на вірних товаришів.\n\nСнупі присягнув Великому Сяючому, взявши на себе почесну мету — знайти тварину, достойну самого Некроманта. Поки що його «Супернюхи» продовжують приручати мутантську фауну краю — не для страху, а для дружби."

  LUM_super_mutant_order_2:0 "Розширення Супернюхів"
  LUM_super_mutant_order_2_desc:0 ""
  LUM_super_knights_hired:0 "Супернюхів призначено"
  LUM_super_knights_unit_tt:0 "З’являється 1 підрозділ §eСупернюхів§!!"

  LUM_medical_order:0 "Біолюмінесцентні Маяки"
  LUM_medical_order_desc:0 "Хоч місіонерські часи Великого Сяючого вже минули, за ним і досі слідує братство жерців і жриць, які прагнуть принести світло Просвітлення тим, хто його ніколи не бачив. Але релігійне сяйво — лише одна зі сторін. Справжній Маяк веде крізь темряву. Саме тому Маяки взяли на себе місію — допомагати всім, кого зустрінуть. Від стимулятора для подорожнього до чудесного зцілення Тьмяної Лампочки чи простої радіаційної обробки харчів.\n\nХоча більшість із них мирні, частина Маяків перейняла мілітаристську стратегію Некроманта. Біолюмінес Бріель очолює бойовий загін Маяків — і на полі бою, і в польових шпиталях. Це — наш 'Зелений Хрест'."

  LUM_dungeon_of_conversion_category:0 "Зал Вознесіння!"
  LUM_dungeon_of_conversion_category_desc:0 "Вирізьблені в камені Червоного Горба, ці камери служать як в'язниці та лабораторії для експериментів Великого Некроманта. Більшість в'язнів помирає тут. Та навіть смерть приносить нові одкровення для сувоїв гулячого знання. Але вибрані — їх ведуть у Велику Залу в серці комплексу, де сам Король Гулів наглядає за їхнім наверненням до життя після життя.\n\nКожен має шанс — вижити, стати свідомим гулем або ж... зірватись у феральність. Некромант невтомно досліджує, як впливають §Oтіло§!, §0розум§! і §eдуша§! на процес. Бо брак у чомусь — це ризик смерті, безумства або найстрашнішого — святотатства!"

  LUM_feral_old_dog:0 "Навчити Старого Пса"
  LUM_feral_old_dog_desc:0 "Колись Старий Пес був відкритий до віри Великого Сяючого. Він міг би стати радником. Другом. Але вибрав упертість. Тепер він схилить голову. Або буде §Rзламаний§!."

  LUM_ghoul_agnes:0 "Пропозиція Смертній"
  LUM_ghoul_agnes_desc:0 "Ґоддард і Колерідж були безнадійні. Але є ще одна постать серед каліфорнійців — лікарка Аґнес. Її поважають, її мудрість — безцінна. Але її §Oтіло§! — слабне, хвороба пожирає її. Та Сяйво вилікує. Радіація зупинить смерть. Потрібно лише прийняти владу Короля."

  LUM_ghoul_pierce:0 "Власний Кілер"
  LUM_ghoul_pierce_desc:0 "Капітан Пірс — майстер снайперської смерті. Страхіття Порохового Котла. Його талант потрібен нам. Зняти ведмедя — одягти наш прапор. І трохи Сяйва — він буде Вічним Кілером."

  LUM_ghoul_jim:0 "Механіка й Молот"
  LUM_ghoul_jim_desc:0 "«Дядько» Джим — головний механік Експедиції. Старість повзе за плечима. Пропозиція вічного майстрування може зацікавити. Якщо ж ні — молот аргументів завжди при нас. Ми не просто здобуваємо послідовника — ми рятуємо душу."

  LUM_ghoul_bulleteater:0 "Той, хто Жує Кулі"
  LUM_ghoul_bulleteater_desc:0 "Булліїтер — легенда, що майже збулась. Броньовані стрільці Залізних Стріл — його творіння. Добре, що ми встигли розбити їх раніше. Якби лиш добратись до його §0розуму§! — переконати, що пам’ять — це мало. Жити вічно — ось що значить бути Легендою."

  LUM_ghoul_mcbride:0 "Зліший за Макбрайда"
  LUM_ghoul_mcbride_desc:0 "Жорстокий ватажок розбійників Тіббетса. Його влада — через страх. Але тут — новий порядок. Він навчиться покори. Або ж ми перетворимо його лють на знаряддя вічного завоювання. Якщо його §Oтіло§! та §0розум§! витримають... процес."

  LUM_ghoul_inkhouse:0 "Броня погорди"
  LUM_ghoul_inkhouse_desc:0 "Його племінні обряди суперечать істинній вірі, та це піддається виправленню. Освічення заблукалих душ — наш обов’язок. А ось його талант — створювати броню зі шкур Звірів — вартий уваги. Якщо поєднати це з нашим металообробленням, наші Лицарі злякають саму смерть."
  lum_inkhouse_tt:0 "§YІнкхаус§! стає військовим радником із ефектом:\nЗахищеність піхоти: §G+10%§!\nПрорив броні піхоти: §G+5%§!\nОборона дивізії: §G+5.0%§!"

  LUM_ghoul_sparky:0 "Вибух, що змінює світ"
  LUM_ghoul_sparky_desc:0 "«Ніхто не робить флеймери й вибухівку, як він» — зухвала заява, яка привернула нашу увагу. Ми запросили цього «Спаркі» продемонструвати майстерність. Якщо вразить... то Некромант сам подбає про його місце у Новому Світі."
  lum_sparky_tt:0 "§YСпаркі§! стає економічним радником із ефектом:\nАтака вибухівки: §G+10%§!\nПрорив вибухівки: §G+10%§!\nСтавлення Бутчера Піта: §G+25§!"

  LUM_ghoul_confessor:0 "У Атома лише одна дитина"
  LUM_ghoul_confessor_desc:0 "Послідовники Атома так близько до істини — й водночас так далеко. Їхні омани не можна лишати без відповіді. Якщо навернемо Сповідника з Вайомінґу, згодом решта піде за ним. Проблема лише в тому, що його §Oтіло§! має неймовірну стійкість до радіації. Це виклик, який Перший Некромант охоче приймає."

  LUM_ghoul_davis:0 "Барон Новішої Епохи"
  LUM_ghoul_davis_desc:0 "Девіса Кіза знали як Брамінового Барона. Але нас більше цікавлять його зв’язки й бізнес-хист, ніж худоба. Її відтепер пастимуть вірні. Без Варта він незахищений. Якщо знайде в собі силу перетнути Сяючий Рубікон — отримає нове життя."

  LUM_ghoul_cork:0 "Загублена душа"
  LUM_ghoul_cork_desc:0 "Цей Сяючий давно не мав товариства своїх. Його побратими — всі ослабли й стали Тьмяними. Його розум — хиткий, та душа сяє крізь випробування. Ми повинні прийняти його до своєї пастви."

  LUM_ghoul_falaya:0 "Щось вічне"
  LUM_ghoul_falaya_desc:0 "Серед племен рідко трапляються справжні таланти. Але вона вчилась у «Послідовників» з далекої Каліфорнії й добре знає, як будувати на віки. Допоможімо їй створити щось, що переживе століття — в ім’я єдиного Великого Хана: Сяючого."

  lum_falaya_tt:0 "§YФалая§! стає культурним радником із ефектом:\nШвидкість досліджень ресурсного забезпечення: §G+10%§!\nШвидкість досліджень будівництва: §G+10%§!\nШвидкість будівництва: §G+10.00%§!"

  LUM_ghoul_annette:0 "Яблуко недалеко падає"
  LUM_ghoul_annette_desc:0 "Ця донька Бейлі — молода, але її §eдуша§! палає бажанням змінити світ. Ми ледве вирвали її з опору, який вона готувала, щоб повернути родовий маєток. Якщо її серце відкриється проповіді — це полум’я можна буде спрямувати проти єретиків."

  LUM_ghoul_savannah:0 "Дитяча змія в саду"
  LUM_ghoul_savannah_desc:0 "Поряд із Аннет ми впіймали ще одну — хитру, мовчазну, й дуже лояльну. Її навички у тіні можуть згодитись... поки весь світ не заллється Сяйвом. Жодна проповідь не торкає її так, як зв’язок з §YАннет§!. Можливо, саме це ми використаємо."

  LUM_ghoul_baresteeth:0 "Сміливість для Пса"
  LUM_ghoul_baresteeth_desc:0 "Колись він був володарем Зграї, страхом Колорадо. Але тепер лежить на кам’яній плиті, під поглядом Великого. Без собак він безсилий. Та через слова і еліксири ми зміцнимо його §eдушу§! — і коли Зубастий знову підніметься, він буде благословенним. Або ніяким."

  LUM_ghoul_howler:0 "Вити за нову справу"
  LUM_ghoul_howler_desc:0 "Ми підібрали його на краю Псячого Міста. Його пси билися до кінця. Поки мовчить, але інші назвали його Витуном. Якщо відкриємо йому очі, то, можливо, отримаємо перше покоління гулепсів, довершених у служінні."

  lum_howler_tt:0 "§YВитун§! стає військовим радником із ефектом:\nПрорив псового спорядження: §G+15%§!\nМ’яка атака псового спорядження: §G+15%§!\nРозвідка псового спорядження: §G+15%§!"

  LUM_ghoul_mechanist:0 "Хто насмілиться наказувати Механістці?!"
  LUM_ghoul_mechanist_desc:0 "Закута не як лицар, а як божевільна, жінка, що називає себе Механісткою, люто чинила спротив при нашому наближенні до Міста Роботів. Багато хто в нашому війську пам’ятає старі комікси ще з часів до Грибних Хмар. Можливо, навіть занадто багато — бо чимало з них хочуть зберегти Дебору Волфлауер і дозволити їй продовжити нести цю мантію. Чи дозволить Великий це дивацтво? Чи переживе вона своє преображення у гуля? Дізнаємось наступного тижня, в той самий Сяйний час, на тому ж Сяйному каналі."

  LUM_ghoul_broderick:0 "Сила в сталі"
  LUM_ghoul_broderick_desc:0 "Силову броню вважали найвищим досягненням мертвої Америки, але навіть вона не зрівняється зі Сяйвом. Та все ж, доки віра веде нас до Вічности, міцна броня теж знадобиться. Це так зване «Братство» довго тримало секрети обслуговування ПА. Варто докласти зусиль, щоб один із них став нашим. Після зламу його §0розуму§! та підкорення, звісно."
  lum_broderick_tt:0 "§YБродерік Колдуелл§! стає військовим радником із ефектом:\nВартість виробництва силової броні: §G-8%§!\nАтака піхоти: §R-8%§!\nМінімальна чисельність елітних військ: §G+15§!"

  LUM_ghoul_azkee:0 "Останні розрахунки"
  LUM_ghoul_azkee_desc:0 "Діти Меса-Верде зберігали формули своїх предків століттями. Їхні загартовані розуми змарновані в теперішньому стані. Контролер має певні амбіції, але не вистачає нашої сили, щоби справді підняти народ. Коли вони схиляться над Урановими Ямами й приймуть гулефікацію — ми відкриємо їм шлях угору."

  LUM_ghoul_johari:0 "Багата духом"
  LUM_ghoul_johari_desc:0 "Колись вона була найбагатшою жінкою Останнього Оплота в Заражених Землях. Це неабияке досягнення, зважаючи на загальну убогість. Ми викуємо з неї жадібність, і вона віддасть нам таємницю хімікату «УСМІШКА». Для гулів він може й не мати прямого ефекту, але, можливо, ми знайдемо йому застосування."

