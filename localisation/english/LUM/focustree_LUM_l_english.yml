l_english:
LUM_holy_waters:0 "Свята вода"
LUM_holy_waters_desc:0 "Є чимало способів освятити воду цих земель. Наприклад, парафія Чагвотера надає перевагу розкриттю термоядерних батарей та скиданню їх до криниць."

LUM_appointing_scribes_and_alchemists:0 "Призначення писарів і алхіміків"
LUM_appointing_scribes_and_alchemists_desc:0 "Кілька вчених душ краще використати для пізнання навколишнього світу й віднайдення давнього знання. Формальні титули й установи допоможуть нам у цьому пошуку."

LUM_the_arizona_crusade:0 "Аризонський хрестовий похід"
LUM_the_arizona_crusade_desc:0 "Кожного солдата й кожну одиницю зброї, яку можемо виділити, спрямовано на південні кордони. Очікування зависло в повітрі — напруга перед найбільшим боєм. Ми залиємо землі Цезаря сяйвом і розчавимо їх чоботами у радіоактивний пил. Так велено — так і буде."

LUM_positions_for_the_exiles:0 "Посади для вигнанців"
LUM_positions_for_the_exiles_desc:0 "Повернення до дому вигнанців наразі неможливе. Але вони принесуть нам велику користь тут. Навіть якщо знадобляться десятиліття чи століття, щоби відтворити їхню працю — то хіба це має значення перед обличчям Вічности?"

LUM_rumors_of_the_south:0 "Чутки з півдня"
LUM_rumors_of_the_south_desc:0 "Чутка дійшла до вух Великого Сяючого. Про блискучих алхіміків, чиє вивчення гулів перевершує навіть Некроманта Колорадо. Вони прагнуть знайти способи розмноження нашого народу поза відомими межами.\n\nНаш король хоче зустрітися з ними. Так і буде."

LUM_the_exiled_alchemists:0 "Алхіміки у вигнанні"
LUM_the_exiled_alchemists_desc:0 "Слава нашого Королівства дійшла далеко — й сьогодні вигнанці з півдня впали на коліна перед Великим Сяючим і розповіли свою історію. Великі уми, які прагнуть зміцнити гулів. Їхнє суспільство було зруйноване, але ця жменька змогла втекти на північ у пошуках допомоги."

LUM_taking_the_rockies:0 "Захоплення Скелястих гір"
LUM_taking_the_rockies_desc:0 "Слабкі, розрізнені племена в Скелястих горах стоять між нами та землями Легіону. Довго вважані незначними, вони тепер відкривають несподіваний шлях для падіння Цезаря."

LUM_onceaman:0 "Колись — людина"
LUM_onceaman_desc:0 "Жоден гуль не народився таким..."

LUM_thenabeast:0 "Потім — звір"
LUM_thenabeast_desc:0 "Осяяння прийшло лише після років на межі безумства й прокляття..."

LUM_nowapriest:0 "Тепер — жрець"
LUM_nowapriest_desc:0 "Оновлений, Великий Сяючий вирушив до народів, несячи Сяйво Вічности, й багато хто долучився до справи."

LUM_betrayal_by_the_heretics:0 "Зрада єретиків"
LUM_betrayal_by_the_heretics_desc:0 "Зрада! Так званий «Отець» Колиски виявився підлим і отруйним. Відкинувши шлях, який ми повинні пройти заради світу, він обернув багатьох проти Великого Сяючого й узурпував місце заснування."

LUM_house_of_worship:0 "Дім поклоніння"
LUM_house_of_worship_desc:0 "Відрізані від оригінальних храмів віри, ми повинні звести нові структури тут, у Колорадо. Ідеально, якщо кожне місто матиме храм у найрадіоактивнішій зоні."

LUM_mantras_of_peace:0 "Мантри миру"
LUM_mantras_of_peace_desc:0 "Розмірене скандування допомагає дисциплінувати розум і заспокоює душу під час важкої праці."

LUM_melting_down_the_past:0 "Переплавлення минулого"
LUM_melting_down_the_past_desc:0 "Багато речей старого світу та дрібничок з колишнього життя можна переплавити, надавши їм нового сенсу у Вічності."

LUM_local_conversions:0 "Місцеві обернення"
LUM_local_conversions_desc:0 "Як і було задумано, навернення народів Колорадо — духовне й тілесне — триває. Не всі проходять Випробування Сяйва, але ті, хто виживе — вдячні за наш дар."

LUM_mantras_of_war:0 "Мантри війни"
LUM_mantras_of_war_desc:0 "Робітники скандують лitanії разом, створюючи зброю для нового завтра."

LUM_field_labor:0 "Польові роботи"
LUM_field_labor_desc:0 "Не бог зна що, але чесна праця."

LUM_rad_resistant_crops:0 "Радостійкі культури"
LUM_rad_resistant_crops_desc:0 "Досі тривають суперечки, чи взагалі потрібна нам їжа, чи довіра до Сяйва замінює потребу в харчах. Але поки що шлунки більшості вимагають їжі."

LUM_repair_of_the_old_roads:0 "Відновлення старих доріг"
LUM_repair_of_the_old_roads_desc:0 "Армії та місіонери повинні мати змогу перетинати наші землі. За благословенням Сяйва ми можемо проходити навіть через найгірші Радплями — якщо шляхи будуть відремонтовані."

LUM_collecting_tithes:0 "Збір десятини"
LUM_collecting_tithes_desc:0 "Колись, у Вічності, валюта стане непотрібною. Праця й товари тектимуть у гармонії. Але не сьогодні. Висилайте жреців — віра потребує старих добрих пляшкових кришок."

LUM_glowing_commanders:0 "Сяючі командири"
LUM_glowing_commanders_desc:0 "Є ті, чий дух дозволяє їм зберігати частку Сяйва в собі — і випускати його у світ. На полі бою вони здатні лікувати та зміцнювати гулів навколо. З огляду на таку силу, не дивно, що більшість із них обіймають командні посади."

LUM_armies_of_the_faithful:0 "Армії віруючих"
LUM_armies_of_the_faithful_desc:0 "Багато душ вирушили до Колорадо, несучи Сяйво. Тепер вони застрягли тут — але зберігають віру навіть у ці тяжкі часи."

LUM_ring_of_hammers:0 "Коло молотів"
LUM_ring_of_hammers_desc:0 "Лише віра не вбиває. Зброя має бути викувана — з брухту або зі старих, іржавих уламків минулого світу."

LUM_luminous_memories:0 "Сяючі спогади"
LUM_luminous_memories_desc:0 "Деякі з наших людей живуть уже століттями. Їхня мудрість проведе нас крізь випробування й біди."

LUM_histories_of_violence:0 "Історії насильства"
LUM_histories_of_violence_desc:0 "Багато благословенних душ воювали десятки років — навіть століття. Деякі знали війну ще тоді, коли падали бомби. Вони повинні навчати інших і вирішувати, хто гідний бою, а хто краще служитиме в таборі."

LUM_strength_of_arms:0 "Міць зброї"
LUM_strength_of_arms_desc:0 "Могутня зброя знищить ворогів Сяйва."

LUM_tactical_training:0 "Тактична підготовка"
LUM_tactical_training_desc:0 "Невпинні навчання, випробування дисципліни, уроки війни. Воїни Просвічених будуть відточені, наче лезо, й розітнуть Колорадо до кістки."

LUM_newfound_fighting_spirits:0 "Нові бойові духи"
LUM_newfound_fighting_spirits_desc:0 "Чимало тих, хто здатен боротися в ім’я віри. То хіба ми відмовимо тим, хто здатен тримати зброю? А навіть тим, хто не здатен?"

LUM_strength_of_conviction:0 "Сила переконання"
LUM_strength_of_conviction_desc:0 "Глибока віра повергне ворогів Сяйва."

LUM_dim_bulbs:0 "Тьмяне світло"
LUM_dim_bulbs_desc:0 "Слабкодухі, ті «тьмяні», що пройшли крізь Сяйво, не зберігши розуму — «здичавілі», як кажуть невіруючі, — отримали вічність, але не засоби її осягнути. Та навіть вони можуть бути корисними, бо вміють відшуковувати незачеплених..."

LUM_warrior_glow:0 "Сяйво воїна"
LUM_warrior_glow_desc:0 "Сьогодні Великий Сяючий проходить рядами наших сил, даруючи їм своє Сяйво перед прийдешніми битвами."

LUM_heralding_victory:0 "Провіщення перемоги"
LUM_heralding_victory_desc:0 "Звістка дійшла до кожного кутка наших земель: війна виграна."

LUM_crowning_moment:0 "Мить коронації"
LUM_crowning_moment_desc:0 "Від часу Зради ми ледве змогли утримати одну частку Колорадо. Та тепер настає мить — і ми формуємо справжню організацію. Сьогодні ми коронуємо Великого Сяючого як Короля Просвічених: провідника віри, рішучости й бачення. Він матиме владу і над цивільним, і над військовим. Майбутнє ще ніколи не сяяло так яскраво."

LUM_the_necromancer:0 "Некромант"
LUM_the_necromancer_desc:0 "Чутки про нашого Короля доходять до далеких земель — перекручені, зневажливі. Вони ганьблять його дари й мистецтво некромантії. Та довгий час він тренувався перетворювати достойних, зцілювати й навіть воскрешати загиблих гулів. Вони називають його Некромантом зі страхом — ми ж промовляємо титул із благоговінням."

LUM_the_radiant_arts:0 "Радіантне мистецтво"
LUM_the_radiant_arts_desc:0 "Просвічену некромантію часто таврують. Обмежені уявлення пустошників тримаються за забобони, як за власну шкіру! Але Радіантне мистецтво — доказ, скільки ще ми маємо пізнати про Сяйво."

LUM_selfcontrol:0 "Самоконтроль"
LUM_selfcontrol_desc:0 "Перший крок у некромантії — це контроль. Сяючий може зберігати неймовірний рівень радіації в собі, але випустити забагато чи замало — означає провал. У найгіршому разі — послаблення в найкритичніший момент."

LUM_to_strengthen_the_worthy:0 "Зміцнити достойних"
LUM_to_strengthen_the_worthy_desc:0 "Не кожна душа здатна витримати перетворення. Гуліфікація — це акт непевний. Забагато з них або вмирають, або втрачають розум. Великий Некромант, у акті милосердя, шукає шляхи зміцнити дух і збільшити шанси на дарування Благословення."

LUM_not_even_in_death:0 "Навіть після смерті"
LUM_not_even_in_death_desc:0 "Пустошами давно ходили чутки, що Сяючі можуть оживляти здичавілих побратимів просто під час бою. Тепер Некромант довів це! Адже він взяв життя в слабкодухого — й повернув його!"

LUM_assembling_reagents:0 "Збирання реагентів"
LUM_assembling_reagents_desc:0 "Першим кроком у плані Некроманта є збирання різних форм радіоактивних матеріалів, які можуть бути успішними у процесі гулятифікації."

LUM_repetitious_tests:0 "Повторні випробування"
LUM_repetitious_tests_desc:0 "Коли перша спроба невдала — пробуй знову і знову. І знову. Одного дня плід нашої праці буде по-справжньому солодким."

LUM_varied_exposures:0 "Різноманітні дози опромінення"
LUM_varied_exposures_desc:0 "Безперечно, певні дози радіації вбивають людину миттєво, незалежно від сили її духу. Визначення правильного рівня опромінення для кожного індивіда — мистецтво не менш, ніж наука. Та ми не можемо зупинятись: одного дня це дослідження допоможе перетворити незліченні маси."

LUM_acceptance_of_the_mind:0 "Прийняття розумом"
LUM_acceptance_of_the_mind_desc:0 "Іноді найбільший ворог — це власна свідомість. Навіть коли тіло й дух проходять крізь Брами Вічности й приймають Благословення Сяйва, нерозумна думка може все ще чинити спротив істині. Ми даруємо вічне життя та захист від усього зла. Хто ж пожалкує про ті незначні втрати, яких вимагає гулевство?"

LUM_ascension_of_the_soul:0 "Вознесіння душі"
LUM_ascension_of_the_soul_desc:0 "Прийняти Благословення — це не лише тілесна зміна, але й найвищий духовний акт. Ті, кого особисто обрав Великий Сяючий — Некромант, Король Просвіченого Царства — ще подякують за це. Нехай ненавидять зараз те, чого не розуміють, — їхня ненависть лише зміцнить душу в прийдешніх Випробуваннях."

LUM_necromantic_disciples:0 "Учні некромантії"
LUM_necromantic_disciples_desc:0 "Великий Некромант не може бути всюди одночасно. Навчання кількох довірених учнів дозволить поширити Радіантне мистецтво по всьому Колорадо."

LUM_burst_of_energy:0 "Спалах енергії"
LUM_burst_of_energy_desc:0 "Окрім лікування та зміцнення братів у вірі, хвилі невидимої енергії, які випромінює Сяючий, можуть обпалювати плоть Неосвячених. Відпрацьоване мистецтво стане грізною зброєю, яка висушить тіла ворогів, коли їхня чиста плоть зрадить їх."

LUM_unyielding_control:0 "Невблаганний контроль"
LUM_unyielding_control_desc:0 "Слабкодухі та щойно воскреслі часто розгублені, особливо серед хаосу бою. Рішуче командування, підкріплене авторитетом Сяючої Плоті, дозволить спрямувати лють у потрібний бік. Бо найбільший дар некроманта — не лише воскресіння, а безумовне підкорення."

LUM_atomic_hearts:0 "Атомні серця"
LUM_atomic_hearts_desc:0 "У серці кожного Сяючого палає вогонь радіоактивного полум’я, що прагне вирватись назовні. Із часом вони відкриють у собі ту силу, яка вирізняє їх навіть серед інших віруючих."

LUM_season_of_the_lich:0 "Сезон лича"
LUM_season_of_the_lich_desc:0 "Надто довго ми страждали від рук гладкошкірих, чиє прагнення до насильства перевершує навіть мутантів та звірів пустки. Але досить! Ми очистимо ці [Чумоземлі?] від їхньої скверни й заснуємо націю — для опромінених, воскреслих і всіх, хто терпить муки життя під гнітом. Епоха гладкошкірих завершена. Хай живе Царство Невмирущих!"

LUM_sourcing_uranium:0 "Пошук урану"
LUM_sourcing_uranium_desc:0 "Колись у Колорадо було чимало уранових шахт. Хоча світ, що був, безжально вичерпував їх для бомб і енергії, деякі жили досі залишились недоторканими — і чекають на наші кирки."

LUM_dig_greedily:0 "Копати жадібно"
LUM_dig_greedily_desc:0 "Потреба в джерелах Радіації не згасає. І хоч скільки б нам не довелося розпорювати землю заради уранової руди — ми зробимо це з радістю."

LUM_enriching_the_elements:0 "Збагачення елементів"
LUM_enriching_the_elements_desc:0 "Більшість урану, що ми добуваємо, має низьку чистоту. Та завдяки методам наших алхіміків ми можемо його збагачувати. Лише найчистіші зразки передаються Королю — для його особистих експериментів."

LUM_the_purifying_metal:0 "Очищувальний метал"
LUM_the_purifying_metal_desc:0 "Старий світ змінився назавжди завдяки радіоактивним матеріалам. Ядерна наука перевершила всі інші, і тепер, маючи у своєму володінні Очищувальний метал, ми зробимо те саме."

LUM_sanctify_the_knightly_orders:0 "Освячення лицарських орденів"
LUM_sanctify_the_knightly_orders_desc:0 "Випробувані у вірі та доблесті воїни отримають особливе спорядження й привілеї. Присягнувши на вірність Королю й одне одному, ці Сяючі Лицарі розтрощать стіни ворогів та зірвуть їхні безглузді прапори."

LUM_for_king_and_kingdom:0 "За короля й королівство"
LUM_for_king_and_kingdom_desc:0 "У міру того, як ми розширюємось і стикаємось з дедалі більшими викликами, формалізація нашого війська та його вірності королю стає все важливішою."

LUM_ghoulatarms:0 "Гулі зі зброєю"
LUM_ghoulatarms_desc:0 "Загартовані, віддані підрозділи вояків, завжди готові вирушити в похід. Відтепер і до падіння останнього гладкошкірого — війна стане їхнім життям."

LUM_knowledge_of_the_elders:0 "Знання старійшин"
LUM_knowledge_of_the_elders_desc:0 "Ми знову звертаємось до найстарших серед нас по поради у війні. Хоч не всі старі підходи досі актуальні, та основи бойового ремесла незмінні в будь-якій епосі."

LUM_army_professionalism:0 "Професійне військо"
LUM_army_professionalism_desc:0 "Безкінечні муштри швидко перетворюють навіть найпростішого рекрута на дисциплінованого солдата. Регулярні ротації дозволяють ветеранам передати досвід новачкам."

LUM_luminous_ranks:0 "Світлі шеренги"
LUM_luminous_ranks_desc:0 "Сяючі, організовані, славні. Наші війська — як візерунок, де серце й розум є не менш важливою зброєю, ніж самі гармати."

LUM_the_militant_masses:0 "Мілітарні маси"
LUM_the_militant_masses_desc:0 "Кожен може взяти зброю. Кожен має обов’язок боронити королівство від зневіри й руйнування. Кожен вірний має стати на захист майбутнього."

LUM_anoint_the_weakwilled:0 "Помазати слабкодухих"
LUM_anoint_the_weakwilled_desc:0 "Не слід марнувати дари Сяйва — навіть якщо вони потворні. Слабкодухі теж можуть знайти своє місце у Вічності: хвилі знеможених тіл, що рвуть усе на нашому шляху."

LUM_doom_stacks:0 "Купи погибелі"
LUM_doom_stacks_desc:0 "Звільнившись від багатьох логістичних обмежень, ми можемо зосередити нищівну міць на одному напрямі — й стерти безвірних у пил."

LUM_organized_by_purpose:0 "Організовані за призначенням"
LUM_organized_by_purpose_desc:0 "Вірний відчує своє місце. Підрозділи організовані за роллю в бою, і командири спрямовують їх згори. Коли надійде наказ, вони не зупиняться — доки не здобудуть перемогу або не зійдуть у Сяйво."

LUM_horde_of_salvation:0 "Орда спасіння"
LUM_horde_of_salvation_desc:0 "Наші армії тягнуться від горизонту до горизонту — єдине, невблаганне зібрання, що несе новий світанок."

LUM_ghoulish_warfare:0 "Гуляча війна"
LUM_ghoulish_warfare_desc:0 "Благословення Сяйва руйнує старі уявлення про війну. Ми маршируємо крізь радшторм, живимося ним. І ворог цього не витримає."

LUM_atomized_armaments:0 "Атомізована зброя"
LUM_atomized_armaments_desc:0 "Що нас живить — їх убиває. Радіація знищує ворога з кожною хвилиною. Ми втілюємо це в зброї, яка або врятує їх, або знищить."

LUM_cleansing_rads:0 "Очищувальні радси"
LUM_cleansing_rads_desc:0 "Домішуючи радіоактивні речовини до пального для вогнеметів і вибухівки, ми омиваємо поля битви благословенними радсами — навіть у розпалі бою."

LUM_prewar_miltexts:0 "Передвоєнні військові настанови"
LUM_prewar_miltexts_desc:0 "Дехто з нас був солдатом ще до Великого Спалаху. Вони діляться знаннями про розвідку, логістику та роль списа."

LUM_touching_the_heavens:0 "Доторкнутись до небес"
LUM_touching_the_heavens_desc:0 "Небо — чудове місце, щоб розширити наш вплив. І звідти ми принесемо вогонь на голови безвірних."

LUM_riverboats:0 "Води життя й смерти"
LUM_riverboats_desc:0 "Річка Платт — наш життєдайний потік, кордон і шлях. Ми маємо будувати судна, щоб повністю її контролювати."

LUM_an_army_eternal:0 "Вічне військо"
LUM_an_army_eternal_desc:0 "Чи може війна колись скінчитися? Чи завжди доведеться боронити Вічність? Поки ми не знаємо відповіді, наша армія стоятиме на захисті."

LUM_veins_of_the_wasteland:0 "Жили пустки"
LUM_veins_of_the_wasteland_desc:0 "Це місто вже було столицею — і всі дороги ведуть сюди. Відновлюючи ці жили, ми з'єднуємо всю державу — для торгівлі, для віри."

LUM_the_strange_bear_flag:0 "Дивний прапор із ведмедем"
LUM_the_strange_bear_flag_desc:0 "Мало хто пам’ятає прапори Спільнот до Спалаху. І ще менше — хто знає, що той ведмідь колись мав лише одну голову…"

LUM_withered_away:0 "Зів'ялі навіки"
LUM_withered_away_desc:0 "Ще одна гуляча держава Колорадо — Зів'ялі Пси — довго відмовлялись прийняти наші вчення та нашу владу. Тепер вони побачать хибність свого шляху й матимуть шанс спокутувати. А хто не зможе — того чекає праця, довша за десятиліття, та вдячність, що триватиме вічно."

LUM_secrets_of_the_expedition:0 "Таємниці Експедиції"
LUM_secrets_of_the_expedition_desc:0 "Тепер, коли чимало каліфорнійців уже навернуто, ми можемо дізнатись, що спонукало їх вирушити так далеко від дому."

LUM_corral_the_weak_of_will:0 "Зібрати слабкодухих"
LUM_corral_the_weak_of_will_desc:0 "Занадто багато слабкодухих вільно блукало землями Зів'ялих Псів. Королівство ж не кине їх напризволяще. Турбота, шлях до служіння — тепер це наш обов’язок."

LUM_irradiate_kimball:0 "Опромінити заставу Кімбола"
LUM_irradiate_kimball_desc:0 "Застава Аарона Кімбола — іронічно названа на честь лідера тієї самої нації, звідки походять Баґґери. Трансформація цього місця стане символом нашого панування над ідеалами 'Каліфорнії'."

LUM_from_across_the_sea:0 "З-за моря"
LUM_from_across_the_sea_desc:0 "Цікаво, що тепер ми навертаємо навіть солдатів з-за Тихого океану. Дехто ще пам'ятає війну між Китаєм і Америкою. Але нині кожен гуль може знайти мир у Вічності — якщо скориться Престолу Сяйва."

LUM_marching_north:0 "Похід на північ"
LUM_marching_north_desc:0 "Настав час повернути те, що по праву наше: колиску нашої віри. Колиска Сяйва буде очищена від єретиків, і Люміносний Король знову побачить землю свого народження."

LUM_homecoming:0 "Повернення додому"
LUM_homecoming_desc:0 "Нарешті! Почнімо святкування — Колиска знову в руках справжньо Просвічених."

LUM_punish_heretical_thought:0 "Покарати єретичну думку"
LUM_punish_heretical_thought_desc:0 "Попри поразку в бою, багато прихильників Зрадника сховались і далі практикують свої хибні ритуали. На них впаде найсуворіше покарання."

LUM_reward_faithful_servitude:0 "Винагородити вірних"
LUM_reward_faithful_servitude_desc:0 "Деякі залишились вірними навчанню Великого Сяючого, і зсередини підривали сили Колиски. У новому королівстві вони знайдуть гідне місце."

LUM_needs_of_a_king:0 "Потреби короля"
LUM_needs_of_a_king_desc:0 "Керувати королівством стає все складніше. Тимчасова столиця на Червоній Горі більше не витримує тиску владарювання. Наші архітектори створюють план Великої Цитаделі — з неї Король керуватиме й вершитиме суд."

LUM_atop_the_red_mountain:0 "На вершині Червоної Гори"
LUM_atop_the_red_mountain_desc:0 "За роки на Червоній Горі тут виросла структура управління. Офіційне визнання цього статусу — найпростіший шлях упорядкувати владу."

LUM_home_of_the_creed:0 "Дім віровчення"
LUM_home_of_the_creed_desc:0 "Де ще будувати замок, як не на тому місці, де все почалося?"

LUM_boulder_and_the_dome:0 "Боулдер і Купол"
LUM_boulder_and_the_dome_desc:0 "Боулдер — колишнє велике місто старого світу, з величними руїнами й зручною позицією. А головне — Купол може стати великою лабораторією для вивчення Некромантії."

LUM_capital_of_colorado:0 "Столиця Колорадо"
LUM_capital_of_colorado_desc:0 "Місто Псів — найбільше в регіоні. Будівельні матеріали, дороги, стратегічна точка — усе це робить його ідеальним троном для Короля."

LUM_forging_a_legacy:0 "Кувати спадщину"
LUM_forging_a_legacy_desc:0 "На самій вершині Червоної Гори, вище навіть за цитадель, Король власноруч викував ковальню. Там він створює радіоактивні персні влади для своїх генералів і шляхти."

LUM_never_ending_light:0 "Нескінченне світло"
LUM_never_ending_light_desc:0 "Віднині й до кінця часів наша земля сяятиме Славою і Сяйвом!"

LUM_shining_tower:0 "Сяйна Вежа"
LUM_shining_tower_desc:0 "Велична Вежа Некроманта здіймається поряд із Куполом у Боулдері. Звідти Король занурюється в безкінечні дослідження природи світу."

LUM_shattering_the_dome:0 "Розбити Купол"
LUM_shattering_the_dome_desc:0 "Купол Боулдера — довоєнний комплекс, довгі роки був запечатаний. Прийшов час відкрити його й перевірити, чи варте щось з його надр збереження."

LUM_puppets_of_the_prison:0 "Маріонетки в’язниці"
LUM_puppets_of_the_prison_desc:0 "Світляки — гуляча держава, змушена платити данину Чорному Каньйону задля миру. Їхні лідери зраджують народ, воюючи з нами на наказ своїх господарів. Але ми виправимо їхню помилку."

LUM_aninsectsglow:0 "Сяйво комахи"
LUM_aninsectsglow_desc:0 "Армії Світляків розбиті, їхнє керівництво втекло або заарештоване. Нарешті народ Боулдера може знайти спокій як піддані Люміносного Королівства."

LUM_kneel_the_bulleteater:0 "Склонити Куляжера"
LUM_kneel_the_bulleteater_desc:0 "Куляжер з Колорадо — відомий постать. Король давно бажав зустріти його й навернути на праведний шлях. Після розгрому Залізного Альянсу ми станемо беззаперечними володарями північного Колорадо."

LUM_plunder_their_armor:0 "Здобути їхню броню"
LUM_plunder_their_armor_desc:0 "Серед переможених у Стерлінгу багато гідних того, щоб носити силову броню. Після адаптації ці нові воїни стануть нашими могутніми таранами на полі бою."

LUM_knights_of_sterling:0 "Лицарі Стерлінга"
LUM_knights_of_sterling_desc:0 "Воїни Залізного Альянсу можуть бути більше, ніж просто найманцями чи головорізами. Під рукою Короля вони стануть славними лицарями в сяючих латах, що ламають усіх ворогів на своєму шляху."

LUM_city_of_scrap:0 "Місто брухту"
LUM_city_of_scrap_desc:0 "Чимало гульів були вигнані з Міста Псів. Битих Псів вважали себе безперечними володарями того, що колись звалося Денвером. Його завоювання доведе, що наше Королівство не зупинити, а перетворення на гуля — неминуча доля всіх."

LUM_hounds_of_eternity:0 "Пси Вічності"
LUM_hounds_of_eternity_desc:0 "Як і ми, багато звірів можуть розділити Благословення Світла. Хоча ми й досі не впевнені, як зважити їхні душі, перші успішні експерименти з перетворення собак з Міста Псів уже дали результати. Скоро вони рватимуть ворогів пліч-о-пліч з нашими воїнами."

LUM_appointing_a_kennelmaster:0 "Призначення Псарівника"
LUM_appointing_a_kennelmaster_desc:0 "Місто Псів довго було символом сили та заздрості. Тепер, коли Биті Пси зламані, час знайти гідного правителя, що служитиме в імені Короля. Як Псарівник, він відповідатиме за навернення місцевих і збір данини з металобрухту."

LUM_holding_court:0 "Придворні слухання"
LUM_holding_court_desc:0 "Після завершення будівництва столиці, Люміносний Король скликає вірних радників для обговорення справ державних."

LUM_thy_rule_absolute:0 "Влада — абсолютна"
LUM_thy_rule_absolute_desc:0 "Сумнівам немає місця. Слова Короля — закон у світі матеріальному й духовному. Кожен схилить коліна перед ним — і лише перед ним."

LUM_signify_our_authority:0 "Виявити нашу владу"
LUM_signify_our_authority_desc:0 "Чимало підданих щойно прийняли Благословення. Вони мають чітко знати, перед ким вклоняються, й відчути корону на голові свого Повелителя."

LUM_order_of_signals:0 "Орден Сигналів"
LUM_order_of_signals_desc:0 "Поширення наказів до найвіддаленіших куточків стає дедалі важчим. Орден Сигналів дослідить технології передавачів, приймачів та хвиль, щоб донести слово Короля до кожної душі — від найбіднішого до найславнішого."

LUM_a_towering_view:0 "Краєвид з вершини"
LUM_a_towering_view_desc:0 "З найвищої вежі Великий Сяючий дивиться на королівство, що тягнеться до всіх обрієв. Після стількох років боротьби ніхто більше не зможе заперечити його верховенство."

LUM_offers_of_deliverance:0 "Пропозиції спасіння"
LUM_offers_of_deliverance_desc:0 "Дехто ще остерігається нас, але наші перемоги ширять правду далі й далі. Навіть ті, хто сумнівався, тепер замислюються."

LUM_establishing_local_counts:0 "Призначення графів"
LUM_establishing_local_counts_desc:0 "Керування новими землями — справа важка. Підвищивши гідних до статусу графів, ми створимо знать, здатну займатись місцевими справами й розвантажити столицю."

LUM_assigning_priests:0 "Призначення священнослужителів"
LUM_assigning_priests_desc:0 "Хай графи керують будівництвом, армією й податками, але лише священники Короля пильнують за їхньою вірністю. Віра — виключна прерогатива Престолу."

LUM_royal_pronouncements:0 "Королівські укази"
LUM_royal_pronouncements_desc:0 "Раз на рік графи збираються в столиці, щоб засвідчити вірність трону. Тут же вони отримують нові укази, накази чи нагороди за службу."

LUM_oneheadmanyhands:0 "Одна голова, багато рук"
LUM_oneheadmanyhands_desc:0 "Хоча графи, що правлять за ласки Короля, мають чималу автономію у керуванні своїми землями, на практиці лише одиниці відхиляються від зразків, встановлених столицею."

LUM_westward_borders:0 "Західні кордони"
LUM_westward_borders_desc:0 "Сили в Чорному каньйоні завжди були ворожі до нас і становлять загрозу на заході. Якщо ми зберемось і рушимо туди, отримаємо чимало — землю, ресурси та можливість нарешті відкрити шлях місіонерам до західних земель Юти."

LUM_appointing_a_new_warden:0 "Призначення нового наглядача"
LUM_appointing_a_new_warden_desc:0 "Відновлення в'язниці в Тіббетсі, охорона нових кордонів, навернення місцевих племен і керування регіоном — усе це ляже на плечі нового Наглядача Заходу, якого сьогодні обере Король. Хай служить вічно."

LUM_repair_the_prison:0 "Відбудова в’язниці"
LUM_repair_the_prison_desc:0 "«Великий купол» давно не виконує своєї первинної мети. Один із наших радників запропонував перебудувати в’язницю для покаяння грішників — усіх тих, хто відмовився прийняти Спасіння. Вони знайдуть викуп у праці на благо вірних."

LUM_return_to_the_reservation:0 "Повернення до резервації"
LUM_return_to_the_reservation_desc:0 "З поверненням рідної землі вигнанці зможуть знову зібрати своє суспільство й продовжити дослідження — під пильним наглядом, звісно."

LUM_an_offer_of_submission:0 "Пропозиція покори"
LUM_an_offer_of_submission_desc:0 "Нарешті ми на порозі! Великим алхімікам півдня передано: якщо вони підкоряться, їхні знання послужать нашій справі. Якщо ж ні..."

LUM_victorious_light:0 "Світло перемоги"
LUM_victorious_light_desc:0 "Сьогодні сонце сходить над беззаперечною перемогою. Великий Легіон зламано, вантажі з припасами вже течуть до великих поселень. Великий Сяючий входить до Флегстаффа, щоб особисто спрямувати майбутнє Аризони. Решта втекли — але й вони стануть дітьми Світла."

LUM_pax_luminous:0 "Люміносний мир"
LUM_pax_luminous_desc:0 "Світло Сяйва торкається кожного куточка пустки. Паломники й торговці подорожують дорогами без страху перед звірами чи рейдерами. Наші війська непереможні, а Трон стоїть непохитно — готовий нести Вічний Мир."

LUM_charter_of_eternity:0 "Хартія Вічності"
LUM_charter_of_eternity_desc:0 "Наші перемоги спонукали до створення великого правового кодексу, що закріпить структуру нової, вічної імперії."

LUM_the_great_wall_of_nebraska:0 "Велика стіна Небраски"
LUM_the_great_wall_of_nebraska_desc:0 "Коли Великий Сяючий починав свої проповіді, він остерігався проривати бар’єри довкола Небраски. Тепер немає сумнівів — ми визволимо цей край від хвороб, страждань і смерті!"

LUM_breaking_down_the_door:0 "Зламати ворота"
LUM_breaking_down_the_door_desc:0 "На світанку саморобний ядерний заряд проб’є пролом достатній для того, аби наші війська ввійшли до Чумних земель і розпочали велику справу."

LUM_one_faith:0 "Єдина віра"
LUM_one_faith_desc:0 "У стінах ми зіткнулись з небезпеками, яких не могли передбачити — дивними істотами та віруваннями. Та ми не відступимо. Єдина істинна віра пануватиме тут — наша."

LUM_emulate_the_wall:0 "Наслідувати стіну"
LUM_emulate_the_wall_desc:0 "Мистецтво створення Великої стіни не має рівних у пустках. Якщо ми зможемо вивчити її будову — наші фортеці стануть неприступними."

LUM_secrets_of_the_plaguelands:0 "Таємниці Чумних земель"
LUM_secrets_of_the_plaguelands_desc:0 "Під час походу наші війська натрапили на чимало дивних явищ. Король дозволив відправити писарів, аби ті зафіксували побачене. Можливо, вдасться віднайти щось цінне."

LUM_a_cure_for_all_ills:0 "Лікування всіх хвороб"
LUM_a_cure_for_all_ills_desc:0 "Блакитний грип та інші хвороби тіла й душі підвладні Радам і Благословенням. Наші лицарі знищили всіх монстрів цих земель. Ми приносимо не лише життя, а й справжню свободу — від людини й природи."

LUM_virtue_of_patience:0 "Чеснота терпіння"
LUM_virtue_of_patience_desc:0 "Вічність попереду, але одна-єдина помилка може звести нанівець десятиліття праці. Ми можемо уникнути загострення ще на кілька місяців — час ранить ворога більше, ніж нас."

LUM_virtue_of_faith:0 "Чеснота віри"
LUM_virtue_of_faith_desc:0 "Що є — те є. Що буде — те буде. Вір у Сяйво, Вічність і Великого. Майбутні битви будуть нашими, якщо збережемо віру."

LUM_virtue_of_wrath:0 "Чеснота гніву"
LUM_virtue_of_wrath_desc:0 "Хто стоїть осторонь, коли вороги стають сильнішими? Хто стримує гнів, коли безвірці наставляють леза на наш народ? Коли вони готуються знищити нас — миру бути не може."

LUM_bodiesandsoulssoulsandbodies:0 "Тіла й душі, душі й тіла"
LUM_bodiesandsoulssoulsandbodies_desc:0 "Дар гульства робить нас витривалішими за гладкошкірих, але ми не невразливі. Повернення бійців до строю — справа і медицини, і проповіді. Бо для битви потрібна воля — і функціональні кінцівки."

LUM_meaning_of_sacrifice:0 "Сенс жертви"
LUM_meaning_of_sacrifice_desc:0 "Дехто віддасть усе заради перемоги. Інші — відступлять. А ким будеш ти?"

LUM_a_just_indignation:0 "Справедливе обурення"
LUM_a_just_indignation_desc:0 "Хіба не маємо ми права на обурення? Нас зрадили, позбавили дому, основи нашої віри. Наша земля — захоплена чужинцями. Наші зусилля з порятунку занепалих гульських душ — відкинуті. Хіба не заслуговуємо ми на більше?"

LUM_gluttonous_needs:0 "Ненаситні потреби"
LUM_gluttonous_needs_desc:0 "Усе, що може слугувати для прийдешньої війни в Колорадо, піде на справу. Не залишимо жодного каменя неперевернутим."

LUM_greedy_merchants:0 "Жадібні торговці"
LUM_greedy_merchants_desc:0 "Попри те, що дехто уникає нас, знаходяться каравани, готові обміняти спорядження на кришки. Вони дорого беруть і продають нашим ворогам, та ми не в тій позиції, щоби вибирати. Колись і вони приймуть Сяйво — і плакатимуть за свої вчинки."

LUM_a_proud_parish:0 "Горда парафія"
LUM_a_proud_parish_desc:0 "Чи не маємо ми підстав пишатися? Зраджені, оточені ворогами — ми збудували основу нового порядку. Ми не здамося, коли стільки ще попереду."

LUM_chattering_mechanisms:0 "Цокочучі механізми"
LUM_chattering_mechanisms_desc:0 "З'єднання кількох рушниць у щось схоже на кулемет — річ відчайдушна, але іноді ефективна."

LUM_the_kind_hand:0 "Добра рука"
LUM_the_kind_hand_desc:0 "Віра не лише пожирає: Сяйво нагороджує вірних життям і радістю."

LUM_diligent_watchmen:0 "Сумлінні вартові"
LUM_diligent_watchmen_desc:0 "Наші громади — легка здобич у пустці. Тож наш обов’язок — їхній захист."

LUM_a_humble_flock:0 "Смиренне стадо"
LUM_a_humble_flock_desc:0 "Громади, що ми збудували, розквітли та прийняли віру. Якби Зрадники виявили стільки ж смирення, вони й досі мали б місце у Вічності. Але тепер — чекатимуть Судного дня."

LUM_luminous_hope:0 "Сяюча надія"
LUM_luminous_hope_desc:0 "Ми діємо сьогодні, щоб завтра було світлішим за вчора. Старий світ загинув у муках — щоб ми знайшли істину Сяйва і надію, що вона дарує."

LUM_valor_before_darkness:0 "Відвага перед темрявою"
LUM_valor_before_darkness_desc:0 "Чому насувається війна? Бо мізерні душі Колорадо прагнуть загасити наше світло. Зброю до рук, слуги Сяйва! Ми будемо світити — навіть коли все інше згасне."

LUM_glowing_sermon:0 "Сяюча проповідь"
LUM_glowing_sermon_desc:0 "Великий Сяючий дарує війську величну проповідь, що зігріє серця в найтемніші часи."

LUM_dirtybombscleansinglights:0 "Брудні бомби, очищуючі спалахи"
LUM_dirtybombscleansinglights_desc:0 "Хоча гульство зазвичай — довгий процес, наші вороги не дають нам вибору. Закладена до вибухівки Благословенна речовина може за лічені хвилини опромінити ціле місто. Так, більшість стануть Димними, але краще це, ніж вічна темрява."

LUM_fireinoursoulsandhands:0 "Полум’я в душах (і в руках)"
LUM_fireinoursoulsandhands_desc:0 "Саморобні вибухівки — слабші за довоєнну зброю, але навіть найлегше можна навчити віруючого зібрати її з підручного."

LUM_send_a_call_home:0 "Поклик додому"
LUM_send_a_call_home_desc:0 "Хоча ми були вигнані з Колиски, там ще залишились ті, хто співчуває нам. Вони можуть приєднатися — хоч це і означатиме, що Колиска остаточно втратить кожну вірну душу."

LUM_missionaries_in_a_foreign_field:0 "Місіонери на чужині"
LUM_missionaries_in_a_foreign_field_desc:0 "Ми часто споряджаємо каравани місіонерів, що вирушають у руїни Світу, Що Був, у пошуках нових душ. Хтось із гульських вигнанців, хтось — з людей, готових прийняти Вічність. Найчастіше повертаються вони з нічим, але останній заклик, можливо, приведе воїнів у годину скрути."

LUM_war_of_faith:0 "Війна віри"
LUM_war_of_faith_desc:0 "У своїх мандрах Великий часто стикався з місіонерами Заходу — агентами Нью-Ханаану й їхньої довоєнної віри. Колись вони були співрозмовниками. Тепер — лиш загроза для істинного вчення. Прийшов час покласти край цим нечестивцям."

LUM_crusade_staging_ground:0 "Підготувати плацдарм хрестового походу"
LUM_crusade_staging_ground_desc:0 "Місто Нью-Ханаан лежить за сотні миль на захід. На нашому шляху — зрадливий рельєф і племена Юти. Спершу ми маємо підготувати шлях для наших військ."

LUM_opening_salvo:0 "Перший залп"
LUM_opening_salvo_desc:0 "З лютим криком перші хвилі наших воїнів вступають на землю Юти — Димні прориваються в лобові атаки, а ополчення й лицарі займають позиції. Питання лише в часі."

LUM_slay_false_gods:0 "Знищити фальшивих богів"
LUM_slay_false_gods_desc:0 "Наші розвідники у Юті натрапили на безліч племен — кожне поклоняється власним ідолам. Сонце, земля, вітер — усе це жалюгідні символи, що лишень засліплюють їхню невігластво. Ми принесемо просвітлення. І доведемо, що ми — вищі за плоть і природу."

LUM_undertake_this_journey:0 "Розпочати цей похід"
LUM_undertake_this_journey_desc:0 "Час настав. Ми рушаємо, щоби здобути два найбільші осередки віри канеанців. Хай навіть тримають їх інші безвірники — ми не спинимось. Священники виголошують останні проповіді тим, хто зголосився пролити кров в ім’я Сяйва."

LUM_canaan_wargoal_tt:0 "Надає §Yвимогу на анексію§! щодо власників §YНью-Ханаану§! та §YНового Єрусалиму§!!"

LUM_kingdom_on_earth:0 "Царство на землі"
LUM_kingdom_on_earth_desc:0 "Навіщо марнувати життя на страх перед смертю? Святе Сяйво вже дарує нам вічність — тут і зараз. І ми житимемо, допоки світ не розчиниться у фоні великої радіації буття..."
