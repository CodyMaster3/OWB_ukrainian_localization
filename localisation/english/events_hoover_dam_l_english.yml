l_english:
  ## MOT / CES loc
bhd.1.t:0 "Безбожна Дитина Нептуна та Юпітера"
bhd.1.d:0 "Гребля Гувера: величезна бетонна стіна, що здіймається над річкою Колорадо, вода якої проривається крізь довго мовчазні турбіни й переливається через край. Ми вперше дізналися про Греблю від Твістед Херів, які приєдналися до нашого легіону, хоча вони й зневажливо вважали її мертвою і зламаною. Здається, з часів їхнього останнього візиту це змінилося. Свіжі розвіддані, здобуті за прямим наказом Цезаря, вказують на значне накопичення військ і відновлення виробництва електроенергії. Більшість цієї енергії йде на Захід — до так званої 'Нової Каліфорнійської Республіки', але частина — до колишнього Лас-Вегаса, який нині сяє в темряві пустелі як коштовний камінь.\n\nХоча такі маси енергії та технологій Старого Світу мало цікавлять наш мобільний Легіон, для Цезаря Гребля Гувера — це ключ до Мохаве. Лише захопивши її, ми зможемо хлинути на Захід великими силами. Якщо ми утримаємо Греблю, ми зможемо захопити Мохаве й вирушити на Вегас. Цезар нарешті матиме свій Рим."
bhd.1.a:0 "Мальпейс поведе. Зволікати не можна!"
fbhd_ces_pre_tt:0 "Через §yп’ять днів§! §OMalpais Legate§! очолить атаку на §OГреблю Гувера§!, використовуючи війська, розміщені поблизу. Атака відбудеться у формі §Oприкордонної війни§!, результат якої залежатиме від наших попередніх дій щодо Мохаве та Греблі.\n\n"

bhd.2.t:0 "Скупчення за Греблею"
bhd.2.d:0 "Ми вже давно чули про якусь велику силу у суворих пустках на сході від Колорадо. Від торговців з Юти та Арізони ми дізналися, що ця територія підконтрольна якимось божевільним нео-римським культистам, які поклоняються 'Цезарю' і розпинають своїх ворогів. Але ми не надто переймалися ними: в них майже немає міст, і технології вони зневажають, полюбляючи радше холодну зброю. Схоже на чергову банду рейдерів.\n\nОднак нещодавні події змусили нас переглянути цю оцінку. Останні кілька місяців ми спостерігали дедалі більше розвідників у характерній броні. Минулого тижня один загін розташувався в зоні нашої видимості. А сьогодні прибув цілий підрозділ, і схоже, що на підході ще більше. Чого вони хочуть? В околицях лише одна справді цінна річ: Гребля Гувера. Ми мусимо терміново підготувати оборону."
bhd.2.a:0 "Підняти всі частини. Підготувати оборону Греблі."

bhd.4.t:0 "Битва за Греблю Гувера"
bhd.4.d:0 "Гребля Гувера, що простягається через могутню Колорадо, сьогодні стала полем битви між двома величезними арміями. За прямим наказом Цезаря, сам легат Мальпейс очолює могутнє військо легіонерів і племінних допоміжних сил, аби відібрати так звану 'Стену Старого Світу' з рук Нової Каліфорнійської Республіки, яка володіє нею з часу Договору Нового Вегаса 2274 року. Легіон, маючи чисельну перевагу й непохитну дисципліну, наразі має перевагу, але мусить утримати ініціативу після прориву через греблю, аби уникнути контратаки.\n\nЯкщо вони переможуть, Мохаве й вогні Вегаса стануть здобиччю Цезаря. Якщо ж зазнають поразки, легат Мальпейс може опинитися в скрутному становищі, а НКР ще певний час утримає Мохаве."
bhd.4.a:0 "Дикунів буде відбито. За Республіку!"
bhd.4.b:0 "Ніхто не спинить ходу Цезаря до його Нового Риму."
bhd.4.c:0 "Ця битва визначить долю Мохаве, незалежно від результату."

bhd.5.t:0 "Перемога на Греблі"
bhd.5.d:0 "Хоча перемога на Греблі була очікуваною, легат з полегшенням прийняв звістку про успіх. Солдати НКР, попри мужність та добре сплановану оборону, поступились чисельності Легіону та невигідній для захисту формі самої греблі. Але ці ж чинники можуть зіграти проти нас: тепер ми можемо стати жертвою багатоаспектного контрудару на відкритій та вузькій місцевості. Якщо ми не використаємо інерцію та не захопимо Боулдер-Сіті, то швидко втратимо перевагу. На щастя, легат Мальпейс має план щодо захоплення Боулдер-Сіті."
bhd.5.a:0 "Ми маємо йти на Боулдер-Сіті!"

bhd.505.t:0 "Битва за Боулдер-Сіті!"
bhd.505.d:0 "З Греблею Гувера в наших руках, наші солдати укріплюються й готуються до наступу на Боулдер-Сіті під проводом Мальпайса. Це останній укріплений пункт, який ворог має змогу підготувати проти нас на цьому боці Лонг-15.\n\nЯкщо ми зламаємо спротив тут — вплив НКР у Мохаве буде знищено!"
bhd.505.a:0 "Ще раз — у пролом!"
ces_boulder_city_border_tt:0 "Через 3 дні почнеться прикордонна війна за Боулдер-Сіті!"

bhd.506.t:0 "Битва за Боулдер-Сіті!"
bhd.506.d:0 "Попри наші героїчні зусилля, воїни Легіону забарвили Греблю Гувера нашою кров’ю. Надійшов наказ усім солдатам залишити ближні пункти спостереження й відійти до Боулдер-Сіті, аби підготуватись до оборони, перш ніж вони зайдуть далі в пустелю Мохаве. Якщо ми впадемо тут, нам не втримати північну частину регіону. Хоч легат і має перевагу, в нас ще є шанс завдати контрудару й відбити агресора.\n\nМи не підемо без бою. І Легіон про це дізнається.\n\nЧерез 3 дні Легіон розпочне прикордонну війну за Боулдер-Сіті."
bhd.506.a:0 "Останній шанс зупинити Бика"

bhd.6.t:0 "Поразка на Греблі"
bhd.6.d:0 "Боягузи з НКР перемогли наших епічних героїв за допомогою своїх 'комбінованих тактик' та 'флангових полів вогню'. Ми ще повернемось, але сьогодні — темний день для Легіону."
bhd.6.a:0 "Воїни вірять, що Марс покинув нас!"

bhd.7.t:0 "Патова ситуація на Греблі"
bhd.7.d:0 "Легат Мальпейс скасував штурм Великої Стіни. З невідомих причин він вважає, що нам ніколи не перемогти. Чи зможе Цезар пробачити таку боягузливість? Питання лишається відкритим..."
bhd.7.a:0 "Коли він став таким слабким?"

bhd.8.t:0 "Стіна Старого Світу встояла"
bhd.8.d:0 "Республіка сьогодні вибухнула від радості, почувши новину про те, що Легіон було з ганьбою відкинуто з Греблі Гувера. Декілька днів бійці НКР та рейнджери мужньо билися та гинули на холодному бетоні гігантської споруди, у бою з ворогом, що виявився більш жорстоким, вірним і організованим, ніж будь-хто з наших попередніх ворогів. Битва була набагато ближча до поразки, ніж хотілося б, частково через досвідченого Легата, який нас атакував. Утім, завдяки стратегічній підготовці, сучасній зброї та тактиці, ми здобули перемогу. Це серйозний удар по Легіону, але ніхто в Мохаве не сумнівається — вони ще повернуться."
bhd.8.a:0 "Ми повинні пильнувати на сході."

bhd.9.t:0 "Стіна Старого Світу впала"
bhd.9.d:0 "Незважаючи на героїчні зусилля багатьох бійців та рейнджерів, ми не змогли стримати наступ Легіону, і втратили контроль над Греблею Гувера. Але втрата греблі — не кінець боротьби. Обидві сторони розуміють, що утримати її без контролю над сусідніми укріпленнями неможливо. Саме тому Легіон продовжив наступ на Боулдер-Сіті, маючи на меті захопити його та не допустити нашої контратаки. Ми мусимо втримати місто за будь-яку ціну. Якщо встоїмо — виженемо Легіон назад через Колорадо. Якщо ні — ризикуємо втратити Мохаве аж до Ніптона, а то й далі."
bhd.9.a:0 "Тримати стрій і не здаватися!"

bhd.10.t:0 "Патова ситуація на Стіни Старого Світу"
bhd.10.d:0 "Хоча це й не та блискуча перемога, на яку сподівався Олівер, пат становив собою стратегічний успіх. Так, ми втратили десятки людей і їхнє спорядження, але Легіон не зміг просунутись у захопленні Греблі. Після днів глухого протистояння, Легіон відступив, не маючи підкріплення для затяжної битви. Ми здобули тимчасову перепочинок. Але не варто розслаблятися — вони точно повернуться."
bhd.10.a:0 "Краще кривава перемога, ніж ганебна поразка."

bhd.11.t:0 "Перемога в Боулдер-Сіті"
bhd.11.d:0 "Боулдер-Сіті — невелике прикордонне місто НКР позаду річки Колорадо — ніколи не мало бути серйозною перепоною. Відкрите з двох боків і затиснуте з інших скелями й річкою, воно мало б упасти під натиском Легіону. І справді, попри шквальний вогонь рейнджерів, хвиля за хвилею солдати Легіону змусили розрізнені сили оборони НКР тікати. \n\nПопри втрату більшості командирів від снайперського вогню, легіонери знали лише одну тактику — штурм. І вони рушили. Місто було заповнене. Хоч рейнджери й підірвали заряди по всьому місту, це мало ефект — основна сила вже йшла в обхід. Завдяки дисципліні Легіону та стратегії Мальпайса, різанини вдалося уникнути. Він переможно рушив на південь, повністю розгромивши НКР."
bhd.11.a:0 "Мохаве — наш!"

bhd.12.t:0 "Диво в Боулдер-Сіті"
bhd.12.d:0 "Боулдер-Сіті, що здавалося легкою здобиччю, ледь не впав під натиском Легіону. Ворог прорвав передову, але втратив командування через рейнджерів. Залишившись без керівництва, воїни Легіону металися в місті... \n\n*БУМ*\n\nСаме тоді спрацював план НКР. Десятки вибухів одночасно знищили все, що було в місті. Легіон зазнав нищівної поразки, а Ґрему довелося відступити."
bhd.12.a:0 "Ми ще повернемося... з часом."

bhd.13.t:0 "Патова ситуація в Боулдер-Сіті"
bhd.13.d:0 "Нам вдалося прорватися через оборону НКР на Греблі, але бої в Боулдер-Сіті зайшли в глухий кут. Безрезультатні штурми виснажили резерви Легіону. Щоб уникнути повного знищення під час контратаки, Мальпейс прийняв рішення відступити через Колорадо. Цезар, ймовірно, не пробачить такого відступу..."
bhd.13.a:0 "Ми надто далеко від дому. Треба відступати."

bhd.14.t:0 "Диво в Боулдер-Сіті"
bhd.14.d:0 "Оборона Боулдер-Сіті здавалася нам приреченою справою. Попри це, ми знали — спробувати мусимо: поразка тут поставила б під загрозу всю нашу кампанію, адже наступна лінія оборони — аж у Ніптоні. І, присягаюсь Республікою, ми боролися. Щойно Легіон прорвав наші позиції біля Дамби, 1-й Розвідувальний підрозділ відкрив снайперський вогонь по старшому командуванню ворога. Завдяки складним маневрам і обману начальник Рейнджерів Ханлон і генерал Олівер змусили сили Легата кинути всі сили в наступ на сам Боулдер-Сіті. Але коли ті дісталися міста — солдатів там не було. Тільки вибухівка. Потужний вибух, що його було чутно по всій пустці Мохаве, знищив майже всю армію нападників. Ті, хто вижили, панічно відступили — і саме тоді ми перейшли у контрнаступ. Залишками солдатів і рейнджерів ми погнали Легіон назад через Дамбу. Ми не змогли переслідувати їх далі за Колорадо через великі втрати та втому вцілілих. Але тепер Легіон точно двічі подумає, перш ніж знову зазіхати на Дамбу."

bhd.15.t:0 "Крах кампанії"
bhd.15.d:0 "Оборона Боулдер-Сіті здавалася нам приреченою. Але ми мусили спробувати: поразка тут — крах усієї кампанії, наступна лінія оборони — тільки в Ніптоні. І, присягаюсь Республікою, ми боролися. Коли Легіон прорвався через Дамбу, 1-й Розвідувальний підрозділ відкрив снайперський вогонь по старшому командуванню ворога. Це значно обмежило їхні тактичні можливості. Та цього було недостатньо — масовий натиск розтрощив нашу останню лінію оборони. Жодного дива. Попри спроби Ханлона та його рейнджерів підірвати вибухівку у місті після нашого відступу, лише мала частина сил ворога постраждала.\n\nТепер ми змушені відступити до Ніптона. Усі території на північ — втрачені. Нам не вистачає ні людей, ні оборонних позицій, щоб стримати цю орду. Можливо, колись ми повернемось до Дамби."
bhd.15.a:0 "Розпочинаємо довгий відступ додому."

bhd.16.t:0 "У Боулдер-Сіті — патова ситуація"
bhd.16.d:0 "Оборона Боулдер-Сіті була відчайдушною. Але ми знали, що програш означає крах кампанії. І ми боролися. Ми не змогли повністю відбити наступ Легіону — але й вони не змогли вибити нас із міста. Обидві сторони знали: довга облога неможлива, а Дамбу без Боулдер-Сіті не втримати. Тож вони відступили. Ми певні — вони ще повернуться, у більшій силі та краще підготовлені. Але, можливо, ми здобули трохи часу."
bhd.16.a:0 "Кривава перемога — у кращому разі."

bhd.17.t:0 "Легіон захоплює Мохаве"
bhd.17.d:0 "Легат Мальпай з тріумфом виводить свої війська до кордонів НКР, а полонені крокують на схід — до Флагстаффа. З падінням Території Мохаве Нью-Вегас лишається без захисту. Пустка затамовує подих."
bhd.17.a:0 "Мохаве ще буде нашим."
bhd.17.b:0 "Рим Цезаря — вже перед очима!"
bhd.17.c:0 "Перевага в Мохаве змінилася..."

bhd.18.t:0 "Диво в Боулдер-Сіті"
bhd.18.d:0 "Боулдер-Сіті, маленьке прикордонне містечко під контролем НКР, здавалося б, не мав становити загрози армії Легата Мальпая. Відкрите з двох боків, обмежене скелями й Колорадо — ідеальне для штурму. І дійсно — хоч рейнджери НКР вели запеклий снайперський вогонь, хвилі легіонерів швидко змусили відступити мішанину захисників. Але коли основні сили Легіону увійшли в місто — вони розгубилися. Снайпери НКР знищили командування, залишивши загони без керівництва...\n\n*БУМ*\n\nСаме тоді НКР активувала пастку. Десятки вибухівок по всьому Боулдер-Сіті рвонуло одночасно, а всіх, хто вижив, добили снайпери. Поразка Легіону була повною. Ґрем не мав іншого вибору, як утікати."
bhd.18.a:0 "Ми в боргу перед Рейнджерами."
bhd.18.b:0 "Легіон не зупиниться надовго."
bhd.18.c:0 "Нестабільна рівновага зберігається."

bhd.19.t:0 "Стіна Старого Світу вистояла"
bhd.19.d:0 "Легіон навіть не зміг перетнути Колорадо! Як вони збираються дістатися Шейді-Сендс, якщо не здатні взяти укріплену, чітко прострілювану позицію? Ха!"
bhd.19.a:0 "Могутній ворог — переможений, хай і ненадовго."

bhd.50.t:0 "Гордість Братства"
bhd.50.d:0 "Легіон бачить перед собою мур. А Елайджа бачить інструмент для встановлення контролю Братства над пусткою. Хто переможе? Плоть і сталь зійдуться в битві, щоб довести, хто сильніший."
bhd.50.a:0 "Шкода буде, якщо ми просто його заберемо."

bhd.51.t:0 "Мобілізація Легіону"
bhd.51.d:0 "Косплеєри зі Сходу готуються до штурму Дамби! Ми зненацька, вже знекровлені війною з НКР. Але нехай дізнаються, чому ми — володарі Маріпоси."
bhd.51.a:0 "Тримаємо Дамбу до останнього!"

bhd.53.t:0 "Битва за Гуверську Дамбу"
bhd.53.d:0 "Писарі, паладини, лицарі... спадок минулого й надія на майбутнє. Проти них — Легіон, як бик у посудній лавці, що зневажить усі цінності Братства. Хто переможе?"
bhd.53.a:0 "Технології Дамби треба зберегти!"
bhd.53.b:0 "Захоплення Дамби зламає хребет Братства!"
bhd.53.c:0 "Доля Мохаве висить на волосині..."

bhd.100.t:0 "Повернення до Гувера"
bhd.100.d:0 "Елайджа вже перемагав. Але цього разу ми зламаємо його. Ніщо не зупинить нас у очищенні світу від цього зіпсованого суспільства."
bhd.100.a:0 "Цього разу — перемога буде за нами!"

bhd.101.t:0 "Легіон знову збирається"
bhd.101.d:0 "[CES.GetLeader] схоже, не виніс уроку. Він знову йде на Дамбу, й ми знову мусимо його зупинити."
bhd.101.a:0 "Готуємо оборону..."

bhd.102.t:0 "Друга битва за Гуверську Дамбу"
bhd.102.d:0 "Усі знали — цей день настане. Легіон знову йде на штурм Дамби, а НКР — захищається, як може. Але цього разу ні Олівер, ні Легат Мальпай не стоять на самоті. Легіон піднімає повну військову потугу, а сама НКР мобілізує сили для підкріплення Мохавської Експедиції. Чи встигне НКР підготуватись, перш ніж ворог задавить її числом? Чи ж Ведмідь вистоїть перед ударом Бика?"
bhd.102.a:0 "Мохавська Експедиція не вистоїть сама!"
ncr_mustering_tt:0 "§ONКР§! розпочне мобілізацію своїх сил для підтримки §OМохавської Експедиції§!. Це потребує часу, але після завершення §ONКР§! поглине §OТериторії Мохаве§! і вступить у війну проти §RЛегіону§!. Час до цього відображено в §Yвкладці рішень§!.\n\nЯкщо §RЛегіон§! встигне розгромити Експедицію до того, як §ONКР§! мобілізується, він отримає §Rбеззаперечний контроль§! над регіоном — допоки §ONКР§! не оголосить §Yофіційну війну§!."
bhd.102.b:0 "Швидкість — ключ до перемоги."
bhd.102.c:0 "Ведмідь і Бик — знову в смертельному клінчі..."

bhd.103.t:0 "НКР мобілізується"
bhd.103.d:0 "Передбачувано, НКР не в захваті від нашої війни проти її жалюгідної Мохавської Експедиції. Але, зв’язані демократією та бюрократією, їм знадобиться час. Якщо ми діятимемо швидко — зможемо анексувати регіон ще до приходу підкріплень. Час — проти нас!"
bhd.103.a:0 "California Delenda Est!"

second_battle_decision_category:0 "Друга битва за Гуверську Дамбу"
sbhd_attack_countdown:0 "Наближається другий штурм..."
sbhd_ncr_mob:0 "НКР мобілізується!"

bhd.151.t: "Друга битва"
bhd.151.d: "Схоже, [CES.GetLeader] знову йде за Дамбою. Нехай дізнається, що на Ведмедя наступати не варто!"
bhd_151.a: "Що він зробить? Найме Кур’єра?"

bhd.152.t: "Початок другої битви"
bhd.152.d: "Нарешті Бик знову йде на Захід. Готується проштрикнути Ведмедя. Ми стоїмо тут, смолоскип Тихого океану. Нехай Цезар побачить: він — лише ще один тиран, якого переможе Нова Каліфорнія."
bhd_152.a: "Почуйте наш рев."

bhd.153.t:0 "Поділені — загинуть"
bhd.153.d:0 "Братство Мохаве й Території Мохаве знекровлюють одне одного, і все через дурнів, що стоять на чолі обох. Ми будемо дурнями, якщо не вдаримо по обом прямо зараз — поки останнім звуком не стане сміх богів."
bhd.153.a:0 "Занадто легко помирають."

fbhd_mot_hold_dam:0 "§MЛегіон навіть не прорвався до Дамби§!"
fbhd_boulder_city_miracle_flag:0 "§MДиво в Боулдер-Сіті відбулося§!"
fbhd_legion_overall_vic:0 "§MЛегіон переміг у першій битві§!"

