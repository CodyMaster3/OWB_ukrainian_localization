stn_the_nightkin_mental_crisis_desc:0 "Тіні у Вакаві потребують постійного нагляду, аби залишатися в межах. Доктор Тобоґґан старається як може, але без нашої допомоги — шанси не на їхньому боці."

stn_the_disease_hurts:0 "Пляма"
