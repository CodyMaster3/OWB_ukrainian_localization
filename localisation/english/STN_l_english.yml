# Characters

STN_PIERRE_SOLOMON_NAME: "П'єр Соломон"
STN_PIERRE_SOLOMON_DESC: "Шахрай за покликанням, П'єр (якщо це взагалі його справжнє ім’я) виявився напрочуд живучим, подібно до таргана. Через низку підозрілих смертей він зумів стати Електоратом Варману й Грандори окремо — і ця дивна база влади фактично гарантувала йому перемогу. Проте чутки про фальсифікації все ще живуть. Наразі П’єр намагається залишити своє шахрайське минуле позаду та затягти Електорат у майбутнє, хочуть вони того чи ні."

STN_loris_name:0 "Лоріс Шрайк"
STN_loris_advisor_desc:0 "«Виграти» Лотерею в Стоуні — це, мабуть, найгірша новина, яку можна отримати. Ніхто не має ілюзій щодо долі тих, кого тягнуть на бенкети аристократів. Доля Лоріс була практично вирішена в ту мить, як витягли її ім’я. Її єдина надія — відчайдушний крик: вони не можуть її з’їсти, поки вона ще має користь.\n\nАдже ніхто не збирає зброю краще за неї — або так вона стверджувала. І коли її крик почула П'єр і дала їй шанс, усе виявилося правдою. Ремонт, удосконалення, чи виготовлення з нуля — її зброя не поступається зразкам із арсеналів. Тепер Лоріс проводить дні, виготовляючи зброю на замовлення для впливових мешканців Стоуна, знаючи, що день, коли вона не створить черговий шедевр, стане для неї останнім."

STN_Beya_name:0 "Бея"
STN_beya_desc:0 ""

STN_leshy_name:0 "Леший"

STN_jean_name:0 "Жан Манжордьо"
STN_jean_advisor_desc:0 "Вершина кулінарної ієрархії Стоуна — надзвичайно вибаглива, і ніхто не задовольняє їхні забаганки краще за Жана Манжордьо. Головний кухар міських кухонь, Жан роками експериментує з будь-яким інгредієнтом, який може дістати. У тому числі — з людським м’ясом. Усі можливі варіанти приготування та приправ — він спробував усе. Не заради посад або привілеїв, ні. Жан — художник, справжній шеф, і його гордість не дозволяє йому зупинитися в пошуках досконалого делікатесу, зробленого руками людини... або з них."

