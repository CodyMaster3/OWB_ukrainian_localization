nf_stn.1.t:0 "Нація Канібалів"
nf_stn.1.d:0 "У закручених провулках Стоуна ховалися занепалі чоловіки й жінки, їхнє життя згнило між цехами фабрик Дандерну та сталеливарнями. В час, коли промисловість мчить уперед, цих людей залишили позаду — так працює спадкоємність бізнесу.\n\nТі, кого не проковтнули багаття прогресу, потрапили до Великих Жеребкувань — жахливої справи, що вирішувала, хто стане святковою стравою для сусідів. Вулицями Стоуна текла кров не менше, ніж дощова вода. І хоча ікла давно не рвали тіло, дух полювання залишився в кожному.\n\nТі, кому пощастило отримати жетон милосердя, тимчасово уникали долі бути вечерею для аристократії. Стоун був містом кровопивць під проводом Товариства Кульбаби — і вони пишалися цим званням. Інші Електори ненавиділи їх за це, але знали: сперечатися з знаттю — найкоротший шлях до ножа в животі… або ще гіршого."
nf_stn.1.a:0 "Багато місцевих підприємств скорилися зі страху."
nf_stn.1.b:0 "Кульбаби довірили свою долю рушницям."
nf_stn.1.c:0 "Їхнім союзником стали іноземні легіони."
nf_stn.1.c.tt:0 "Буде створено два загони найманців!"

nf_stn.2.t:0 "Шепіт із Бірч Гіллз"
nf_stn.2.d:0 "Але жеребкувань було недостатньо, аби наситити верхівку. Доводити народ до краю означало ризикувати робочою дисципліною, або ще гірше — викликати осуд навіть серед інших Електорів. Вони не могли дозволити собі виглядати такими ненажерами, якими насправді були.\n\nІ тому уклали угоду з доктором Шейном Тобоґґаном — геніальним мутантом, випускником Університету Чейза. Його нічкінська психлікарня в Бірч Гіллз і вся її мутована «паства» стали доступними для столу знаті. У них визрів план: а що, як мутанти зможуть стати ефективною худобою? З тим об'ємом FEV, який, за словами доктора, МАНІФЕСТ зберіг у запасах, — чи можна подвоїти, а то й потроїти м’ясну вагу одного «екземпляра»?\n\nВід однієї думки їх починало трусити. Але спочатку треба було забезпечити добробут установи — бо лабораторія без піддослідних не варта нічого.\n\nЗелене м’ясо, синє м’ясо — що б то не було, воно має надходити з Психлікарні Бірч Гіллз."
nf_stn.2.a:0 "Для початку спробуємо як біопаливо."
nf_stn.2.b:0 "Військова охорона Бірч Гіллз — ключ до стабільності."
nf_stn.2.c:0 "Варто піклуватися про Тіні."
nf_stn.2.c.tt:0 "Це може принести користь пізніше..."

nf_stn.3.t:0 "Зобов’язання перед Електоратом"
nf_stn.3.d:0 "Електорат ніколи не був стабільним місцем. Машини Дандерну змагалися з технологіями доядерної епохи, їхні барони мали вплив у всьому Кетчі, а експерименти Плезантдейла вільно розгулювали землями, поки народ топив свою скорботу в вечірках.\n\nМати справу з ними — важко. Але не неможливо."
nf_stn.3.a:0 "Разом стоїмо, чи як там воно було."

nf_stn.4.t:0 "Що значить Бути Вільним"
nf_stn.4.d:0 "Найгірше сталося. Попри всі наші зусилля стримати ріст так званої «Армії Свободи», вони перевершили нас. Минулої ночі вони організували прорив із Бірч Гіллз, випустивши розлючену армію Тіней на волю. І як на біду, ще більше терористів присягнули на вірність догмам генерала Фрідом, захопивши Вакав.\n\nМи втратили контроль над рікою. Що робити далі?"
nf_stn.4.a:0 "§RНе кожен бенкет дістається легко.§!"
nf_stn.4.b:0 "§MСвобода — це невід’ємне право.§!"
nf_stn.4.c:0 "§YДавайте без насильства... поки що.§!"

nf_stn.5.t:0 "Радіо Свобода?"
nf_stn.5.d:0 "Мене звати ГЕНЕРАЛ ФРІДОМ, і ви слухаєте РАДІО СВОБОДА! У мене важливе повідомлення: СТУНЦІ ЇДЯТЬ ВАШИХ ДІТЕЙ! Сам бачив! Як тіло брагміна на рожні — хрум, і нема. Я не агресивний мутант, але вважаю, що ДІТИ — це СВЯЩЕННІ ІСТОТИ, що заслуговують на ЛЮБОВ і ПОВАГУ. А не щоб їх жерли!\n\nСам я з’їв людей — може, з десяток, але принаймні маю межі! А ці кульбаби — ні. Вони вас теж з’їдять, якщо далі будете їм підкорятись! Ви їм присягали? Та ні ж бо!"
nf_stn.5.a:0 "Що?!"

nf_stn.6.t:0 "Тисяча Кинджалів в Одніїх Руках"
nf_stn.6.d:0 "Шахрайства П’єра розлютили багатьох з тих, кого він вважав союзниками. Леттермени, лицарі у вигнанні з Манітоби, бачать свою службу під його чоботом як ганьбу — і залюбки б розправились з ним.\n\nА з іншого боку, його «чесна дружина» Бея ладна зробити все, аби знищити Товариство Кульбаби і повернути старі порядки племен.\n\nХтось із них втілить переворот. Але хто саме?"
nf_stn.6.a:0 "§MСкажіть Йорктону — ми йдемо додому.§!"
nf_stn.6.b:0 "§RКривий Ікло не зламав нас.§!"

nf_stn.7.t:0 "Ми Бились за Царя і Віру"
nf_stn.7.d:0 "§B«Сказано тобі, людино, що є добро; і чого вимагає Господь від тебе — тільки творити справедливість, любити милосердя, і покірно ходити перед Богом твоїм?» (Михей 6:8)§!\n\nКолись, ми билися вогнем і мечем за нашого Пана — як небесного, так і земного. Тисячі чудовиськ падали під нашими мечами. Та знатні з Манітоби злякались нашої доблесті і наказали Йорктону розпустити нас. Герої стали вигнанцями. І от ми тепер — на землях колишніх ворогів, змушені терпіти П’єра Соломона, що думає, ніби може зробити нас своїм найманим загоном.\n\nАле ми — не найманці. Ми — Лицарі Йорктона. І зло терпіти не можемо.\n\nВін дізнається, що значить зневажати Божих обранців."
nf_stn.7.a:0 "Бійся того, хто вірить у щось більше, ніж себе."

nf_stn.8.t:0 "Що Було Віднайдено"
nf_stn.8.d:0 "Лицарі прочесували Електорат у пошуках найменшої згадки про своїх побратимів. І, зрештою, знайшли те, чого так чекали:\n\nДаніел із Вадени живий.\n\nВін сидить у в’язниці Дандерна — святий, що став жертвою. Тепер потрібно організувати його визволення… Але як саме? Цим питанням марить сер Ґріффін."
nf_stn.8.a:0 "Потрібна буде обережність і тиша."
nf_stn.8.b:0 "Ми — Лицарі! І дурня не боїмось."

nf_stn.9.t:0 "Крадіжка в Гранд-Галереї!"
nf_stn.9.d:0 "Минулої ночі загадкові озброєні чоловіки в каптурах проникли до Гранд-Галереї Плезантдейла, викравши майже неушкоджений обладунок, що колись належав «сиру Даніелю з Вадени», загиблому лицарю Йорктона, який бився у Війні Першої Республіканської Коаліції.\n\nДинастія Чейзів обіцяє знайти винних і «повернути обладунок на його законне місце в галереї» до кінця року."
nf_stn.9.a:0 "Який блиск…"

nf_stn.10.t:0 "Балада про сера Даніеля"
nf_stn.10.d:0 "Цей день настав! Весілля П’єра Соломона з Товариства Кульбаби та Беї з давніх племен Стоуна відбулося в Об’єднаній церкві Третьої авеню — якраз перед сутінками, щоби місячне світло осяяло цю, безсумнівно, зіркоперестрічну пару.\n\nСеред святкових страв — найвишуканіша випічка й вино, витримане в Вайткорті десятки років, та екзотичні червонолисті канолі, що облямовували високий семиярусний торт. Після обміну обітницями та богохульного освячення церемонії, з торта раптом вирвався сер Даніель із Вадени — його обладунок весь у тісті та кремі, коли він вистрибнув уперед.\n\nГості були в шоці, поки Даніель, не зупиняючись, чавкаючи тортом у чоботах, схопив Соломона за плече та проштрикнув йому чорне серце своїм мечем.\n\nЯк тільки аристократи зрозуміли, що сталося, гвардія Леттерменів повернула зброю проти гостей, вирізаючи канібальську знать, мов пшеницю. До кінця урочистості стіни та підлога були залиті кров’ю, а йорктонська синява змінилася на стоунську багряницю."
nf_stn.10.a:0 "П’єр отримав свій десерт!"

nf_stn.11.t:0 "Лють палає сильніше пекла"
nf_stn.11.d:0 "Цей день настав.\n\nУ найчистішому, хоч і в крові вимазаному білому, Бея йшла проходом, серце її билося в такт її крокам. Кривий П’єр дивився на неї, мовби це був його тріумф. Але він ніколи не дізнається, наскільки він помилявся — принаймні не до того моменту, коли буде вже запізно. Бо як тільки священник почав читати обітниці, Леший проломив кольорове вітражне скло, вдерся в залу й кинувся на вартових, шматуючи їх своїми іклами. У ту ж мить Бея дістала меч і встромила його П’єру в груди, вирвавши його серце.\n\nВоїни Старої Крові, яких вона запросила як гостей, обернули свою лють проти знаті, влаштувавши різню, на чолі якої стояла вона сама — смакуючи сік серця ворога.\n\nТак Стара Кров знову стала новою."
nf_stn.11.a:0 "Природа бере своє."

nf_stn.12.t:0 "Весілля на смерть"
nf_stn.12.d:0 "Всупереч надіям Леттерменів і Старої Крові, П’єр обвів їх усіх, не зробивши нічого — як йому найбільше й подобається. Весілля минуло без інцидентів. Родина Беї спостерігала, як вона присягає чоловікові, що не має до неї жодної любові, у храмі, який лицарі вважали власним.\n\nП’єр Соломон нарешті здобув владу й визнання. А тепер… тепер настав час прибрати хвости."
nf_stn.12.a:0 "Щоб залишатися на вершині, треба вміти штовхати інших вниз."

nf_stn.13.t:0 "Щодо зниклих із Плезантдейла"
nf_stn.13.d:0 "Вітання і добрих вістей,\n\nМені стало відомо, що ви та ваші побратими перебуваєте в лісах на північ від Плезантдейла. Я не претендую на розуміння всіх жахіть, які змусили вас стати тим, ким ви є зараз. Але я знаю, що ви вмієте читати, і знаю, що ви прагнете миру. Пишу вам із надією, що ви приєднаєтесь до мене та мого Ордену, щоб ми могли представити вас Королівству Манітоба як належить. Зло Електорату більше ніколи не спіткає ні вас, ні нас.\n\nЗ повагою,\nСер Даніель із Вадени, Лицар Йорктона, Вбивця Соломона"
nf_stn.13.a:0 "Доброзичливість багато важить у цьому світі."
nf_stn.13.b:0 "Людям не можна довіряти!"

nf_stn.14.t:0 "Феї погодились!"
nf_stn.14.d:0 "ПривІт. .\n\nмИ дОпомОжЕм\n\nпетівак :)"
nf_stn.14.a:0 "Чудово!"

nf_stn.15.t:0 "Феї підуть самі"
nf_stn.15.d:0 "Феї, на жаль, відкинули нашу пропозицію, обравши залишитися на самоті в лісі."
nf_stn.15.a:0 "Шкода, але це було неминуче."
nf_stn.15.b:0 "Хай знайдуть спокій у лісовій самоті."

nf_stn.16.t:0 "Багато галасу навколо Кабалу"
nf_stn.16.d:0 "Спектральний Кабал давно впливає на життя Електорату. Рухомий марнославством і дивним релігійним фанатизмом, їхні скандали поступаються лише їхнім таємницям. Легендарний Вовчий Бог, що мучить сни відвідувачів їхніх купалень, і ганебне використання червонолисту заради особистої вигоди — усе це цілком може стати причиною для того, щоб покінчити з їхніми каплицями раз і назавжди.\n\nТа з іншого боку, їхні лікувальні води справді дієві, а вечірки — на те й популярні. Можливо, варто залишити їх у спокої?"
nf_stn.16.a:0 "Бог не створив нас, аби ми терпіли такі жахи."
nf_stn.16.b:0 "Краще мати союзників, ніж ворогів."

nf_stn.17.t:0 "МАНІФЕСТ Саскачеван"
nf_stn.17.d:0 "Стара установа значною мірою занепала, частково через нашу окупацію, але з Надією як її опікункою і її постійною готовністю підтримувати роботу комплексу, для Ордену буде великою вигодою скористатися ним на власний розсуд. Відновити можна не все, але з належним керівництвом ми зможемо пристосувати об'єкт до будь-яких потреб."
nf_stn.17.a:0 "Нам потрібно більше загального виробництва!"
nf_stn.17.b:0 "Нашим людям потрібна зброя!"
nf_stn.17.c:0 "Розібрати! Переплавити все в зливки."

nf_stn.18.t:0 "Те, що колись було домом"
nf_stn.18.d:0 "Коли Плезантдейл був захоплений, а його жахи — знищені або стримані, Даніель відчув, як по його спині повзе почуття завершеності. Після років, проведених у пенітенціарії Аллан-Гіллз, він нарешті відчув, що рухається вперед. Лицарі Святого Георгія вирвалися зі смітника історії, мов фенікс, і він прагнув спокійної ночі, як колись.\n\nТож він повернувся додому, у Вадену, де залишалася його хатина. Його дружина й доньки точно чекали на нього.\n\nКоли він прибув, його дихання затихло, а в грудях защеміло. Минуло багато років. Чи пам’ятали вони його взагалі? Чи хотіли б? Його думки перервав звук дверей, що відчинилися — і там стояла вона, така ж прекрасна, як у день його від’їзду: Мері-Енн дивилася на нього з виразом жаху, який він сприйняв як помилковий… Але він не зник, навіть коли він відкрив рота. Простягши до неї руку, він побачив, як вона відступила на три кроки.\n\nТоді вона сказала правду. Вона продала його — і його дім — Парії Гокмуну в обмін на гроші на майбутнє дітей. У той момент його серце розлетілося на тисячу скляних осколків, а з його забралою покотилися сльози, мов гірський потік."
nf_stn.18.a:0 "Він думав, що це було справжнє кохання…"
nf_stn.18.b:0 "...Але це була лише ще одна поразка."

nf_stn.19.t:0 "Рожеві окуляри Роузвуд"
nf_stn.19.d:0 "Що б там не думали про філософію Глорії Чейз, її технологічна та промислова міць залишалася незаперечною. Жінка, яка запровадила масове імплантування для простого люду — це не та, кого можна недооцінювати. Після нашого захоплення вона погодилася продовжити свою роботу в... контрольованих умовах. Її ресурси тепер наші."
nf_stn.19.a:0 "Можливо, не всі Чейзи такі вже погані."

nf_stn.20.t:0 "Доля Іскробритців зі Страсбурга"
nf_stn.20.d:0 "Іскробритці зі Страсбурга давно охороняють східні кордони Електорату. Маєток у Дандерні робив усе можливе, аби позбавити їх впливу, але ця загроза давно зникла. Хоча їхні стосунки з Манітобою були непростими, співпраця вигідна обом сторонам. Чи визнати їх рівними, чи ж стерти з лиця землі?"
nf_stn.20.b:0 "Просимо Йорктон визнати їх лицарями!"
nf_stn.20.a:0 "На шляху до миру не може залишатися жодних вільних кінців."

nf_stn.21.t:0 "Над Дандерном знову сходить сонце"
nf_stn.21.d:0 "Десятиліттями смог затуляв Дандерн від Божої ласки. Наша інтервенція дозволила зупинити димарі, і працівники повернулися до своїх домівок. Вони святкують вечір разом із родинами, а ми можемо лише спостерігати захід сонця.\n\nЩо ж до сера Даніеля з Вадени? Він зустрів захід сонця на самоті. Для нього це був найвеличніший захід — його вороги були поховані, а народ прославляв його ім’я."
nf_stn.21.a:0 "Кращого раю й не придумаєш…"

nf_stn.22.t:0 "Ще один ефір Післяжиття вдався!"
nf_stn.22.d:0 "Минулої ночі на радіоефірі «Післяжиття» несподівано виступив спеціальний гість: генерал Фрідом, тепер офіційно військовий офіцер Стоуна, виконав відому пісню The Ink Spots «I Don't Want To Set The World On Fire» під акомпанемент барабанів і банджо (люб’язно наданих Товариством Кульбаб). Тіні склали зброю й об’єдналися з людськими братами — почалася епоха праведного миру!"
nf_stn.22.a:0 "Хто б міг подумати, що все так просто?"

nf_stn.23.t:0 "Місія доктора Тобоггана"
nf_stn.23.d:0 "Доктор Шейн Тобогган щосили намагався служити своєму народу і дотримуватись правил Дантіїв, але останнім часом тріщини стали надто помітними. Те, що колись було місією врятувати своїх побратимів від руйнівної залежності від стелсбоїв і знайти нове джерело ФЕВ, перетворилося на жахіття.\n\nДанді погрожували життям його людей, якщо він не виконає одну вимогу — вимогу з жахливими наслідками. Вони хотіли, щоби він знайшов спосіб «пом’якшити» м’язову тканину мутантів, щоб зробити їх придатними до вживання на своїх канібальських банкетах. Це було божевіллям, але в Тобоггана не було вибору. Він знав: уб’ють його — загине весь його народ. Тож довелося грати за їхніми правилами. Поки що."
nf_stn.23.a:0 "Поки що? Ха!"

nf_stn.24.t:0 "Святкова різанина"
nf_stn.24.d:0 "Попри всі шанси, культура канібалізму процвітала в Стоуні. Щоб відсвяткувати це, [STN.GetLeader] організував бенкет — на якому милосердя було відкинуто заради пролиття крові. \n\nАдже яка ж краща делікатесна страва, ніж найвеличніша дичина?"
nf_stn.24.a:0 "Залиш мені руку і ногу!"

nf_stn.25.t:0 "Париж Прерій"
nf_stn.25.desc:0 "До того як ядерний вогонь знищив світ, Саскатун був процвітаючим місцем — найбільшим містом Саскачевану, якому дали прізвисько «Париж Прерій». Коли сонце затулила ядерна хмара, а хуртовини стали втричі лютішими, місто затихло. Спорожніло. Померло.\n\nУ перші десятиліття після тиші народ деградував до племен. Життя зводилось до воєн за туманні визначення й безглузді претензії. Збираючись у старих церквах і банкетних залах, їхні язики спліталися — зливалися й ламалися, створюючи нові мови в міру об’єднання племен. Так Саскатун змінювався разом зі своїм народом, ставши С’Туном. Згодом, коли інші почали приймати цю назву, а Західна Канада розпадалась на феодальні держави, він перетворився на Стоун — осередок фальшивих урядів і монстрів.\n\nХоча хуртовини давно вщухли, відчай, що штовхав людей до канібалізму, перетворився на марнославство. Здоровий глузд поступився жадобі та зажерливості. У нещодавні роки Стоун став відомим своєю..."
nf_stn.25.a:0 "Зростаючою індустрією, намаганням зрівнятися з Дандерном."
nf_stn.25.b:0 "Здатністю орієнтуватися у постмодерному світі."
nf_stn.25.c:0 "Величезною комерційною привабливістю."
nf_stn.25.d:0 "Протистоянням КПК та Східним Королівствам."

nf_stn.26.t:0 "Фрідом готує барбекю (кожного тижня)"
nf_stn.26.d:0 "У такі часи багато не попросиш. Щоб приборкати канібалів Стоуна, генерал Фрідом має геніальну ідею: щотижня особисто організовуватиме обов’язкове барбекю для кожного підозрюваного канібала. Найамериканськіше й найпатріотичніше, що можна зробити, — це поїсти гарної їжі з співвітчизниками!"
nf_stn.26.a:0 "СВОБОДА!"

nf_stn.27.t:0 "Суд Святого"
nf_stn.27.d:0 "Канібали Стоуна почали боятися блискучих лат Йорктонських Лицарів. Вердикт був безапеляційний, коли сер Даніель з Вадени стяв голову самопроголошеному «канібалу-філософу» просто на площі. Коли глядачі завмерли в тиші, деякі ще вкриті кров’ю чоловіка, Даніель просто сказав: «Хтось іще хоче просвітити мене щодо своєї дієти?»\n\nОчікувано, ріки вже незабаром перестали текти такими червоними."
nf_stn.27.a:0 "На Бога уповаємо!"

nf_stn.28.t:0 "Свобода для всіх"
nf_stn.28.d:0 "У ніч перед весіллям до дому П’єра Соломона увірвалися, і його вивели до берега річки Саскачеван з бомбою, прив’язаною до щиколоток, — усе це зробили кілька шалено налаштованих Тіней. Через хвилину вода здійнялася фонтаном — генерал Фрідом натиснув на детонатор.\n\nНарешті, Тіні були вільні від жахіть Бірч-Гіллз Психіатрії. Але вони не збиралися йти. Один із них, зокрема, був рушієм цієї змови: генерал Фрідом. Хоча його народ і народ Беї були звільнені від тиранії, залишалося ще багато людей і «нормісів». І хотіли його люди Стоуна чи ні, тільки він мав владу ухвалювати рішення..."
nf_stn.28.a:0 "Мутант, що боїться Бога?!"

nf_stn.29.t:0 "Там, де народилася Свобода"
nf_stn.29.d:0 "Усі пам’ятатимуть той момент, коли Великий генерал Фрідом перетнув річку Саскачеван, ударом голови зламавши груди двом із кращих Леттерменів Стоуна й розчавивши їхні серця їхньою ж бронею. Його браття-тіні йшли синьою хвилею на місто Стоун, осушуючи фонтани крові та вивішуючи червоно-біло-синій стяг над тілами рейдерів і канібалів. Там, друзі й вороги, генерал Фрідом і подарував свій перший справжній дар народу Канади: свободу."
nf_stn.29.a:0 "Щось підказує, що все це погано скінчиться."

nf_stn.30.t:0 "Доктор Тобогган, кандидат наук"
nf_stn.30.d:0 "Стоун перейшов під керівництво справжнього патріота, і генерал Фрідом був тим, про кого могли тільки мріяти. Але він знав — йому потрібен найкращий розум Електорату поруч, тож було викликано доктора Тобоггана. Вони не зустрічалися з моменту великої втечі, а доктор залишився в майже порожній лікарні — чи то з обов’язку, чи з сорому за співпрацю з Кульбабами. Що б це не було, Фрідом хотів витягти його на світло.\n\nІ ось вони зустрілися: генерал запропонував доктору офіційне визнання та всі необхідні ресурси — за умови, що той допомагатиме своїм побратимам-мутантам. А також вирішуватиме наукові задачі. І допомагатиме у стратегії. Ну, дрібниці для генія, правда ж?"
nf_stn.30.a:0 "Хіба доктор міг відмовити?"

nf_stn.31.t:0 "Страйкарі Дандернської Спілки шукають примирення!"

nf_stn.32.t:0 "Звернення Синього Чоловіка"
nf_stn.32.d:0 "Отже, браття, я ходжу вулицями серед вас, чую ваші думки і знаю, що у вас є ВІРА, але також і СУМНІВИ. Ви хвилюєтесь, що можливо генерал Фрідом ВІДІРВАНИЙ від звичайного Діка й Джейн. Я бачив написи на стінах, браття — люди пишуть «СИНІЙ ДОДОМУ». А я — наскільки тільки можна — синій чоловік, НАЙБІЛЬШИЙ синій чоловік з усіх, хто був, і я ТАКИМ І ЗАЛИШАТИСЬ, ДЖЕК. Але я також СПРАВЖНІЙ американець, істинний червоно-біло-синій, як і всі ви. Ми всі встаємо зранку, робимо зарядку й боремося за АМЕРИКАНСЬКИЙ спосіб життя однаково — сині чи ні. Єдині, хто може нас перемогти — ЦЕ МИ САМІ, БРАТЕ!"
nf_stn.32.a:0 "Нехай генерал Фрідом промовляє!"

nf_stn.33.t:0 "Стан Спілки"
nf_stn.33.d:0 ""

nf_stn.34.t:0 "Занепад Електорату"
nf_stn.34.d:0 "Після десятиліть правління Електорат Саскачевану впав у повний безлад! Після нещодавніх новин про фальсифікацію виборів, народ Дандерна, Плезантдейлу та Стоуна готується до війни, адже кожна фракція прагне повної влади над землями..."
nf_stn.34.a:0 "До зброї!"
nf_stn.34.b:0 "У Кетчі нарешті закипіла кров."

nf_stn.35.t:0 "Кетчер приносить дарунок"
nf_stn.35.d:0 "Кетчер сьогодні повернувся з подарунком — чимось, що було викрадено під час весілля П’єра Соломона з його маєтку. Всередині пакунка — щоденник самого Верховного Електора, в якому він докладно описує свої плани сфальсифікувати останні вибори та перехитрити Дандерн. І якби цього було недостатньо, він навіть залишив сліди — рахунки й імена, які Кетчер щедро відстежив.\n\nВін знехтував доброю волею демократії й зруйнував систему честі, за якою проводились вибори в Електораті. Якщо це потрапить у публічний доступ — хаос гарантовано..."
nf_stn.35.a:0 "Ти колись робив омлет?"
nf_stn_35_tt:0 "Кетчер буде відправлений — поширювати документи, де тільки зможе. Оце буде шоу..."

nf_stn.36.t:0 "Вибори були СФАЛЬСИФІКОВАНІ!"
nf_stn.36.d:0 "Останні вибори Верховного Електора були сповнені суперечок і дискусій; десятиліттями титул належав маєтку Дандерна, чия індустріальна потуга та Спаркблейди давали їм перевагу. Було великою несподіванкою, коли цього разу перемогли Кульбаби зі Стоуна, піднявши Тімоті Літтлгоупа та Глорію Чейз до влади у їхніх володіннях.\n\nАле останні новини свідчать, що підозри були виправдані. П’єр Соломон змовився з кількома іншими знатними родами Стоуна, аби сфальсифікувати вибори й остаточно усунути Дандерн. Вулиці вже заполонили спраглі до крові бунтівники..."
nf_stn.36.a:0 "Демократію було зраджено?!"

nf_stn.37.t:0 "Товариство Кульбаби"
nf_stn.37.d:0 "Кожен, хто щось собою являє, чув про Товариство Кульбаби — хоча більшість називає їх просто Кульбабами. Це канібальська аристократія, якій дозволили гнити в Стоуні завдяки їхньому багатству та зв’язкам із впливовими людьми по всьому Електорату — їхні руки глибоко залізли в кишені як дандернських індустріалістів, так і плезантдейльських світських левів. Хоча їхні витівки були підступними протягом усієї історії, жодна не зрівнялась із останніми планами нинішнього лідера.\n\nП’єр Соломон вважався висхідною зіркою серед Кульбаб, хоча йому було вже за тридцять і він був членом товариства більшу частину сучасної історії. На останніх виборах у Електораті він здобув титул ієрарха серед шляхетних родин, здобувши нову повагу та розкішне життя, про яке пустельник лише мріяв.\n\nАле він знав — здобуте становище крихке. Йому доведеться грати дуже обережно, і йти на ризик. Чи виправдається це — ще належало з’ясувати..."
nf_stn.37.a:0 "П’єр був покидьком до кісток."

nf_stn.38.t:0 "Племена"
nf_stn.38.d:0 "Стара Кров Стоуна — це різні здичавілі місцеві жителі Саскатуна, ті самі, що воювали у Війнах за Плоть Саскачевану. Протягом багатьох років, у міру розростання цивілізації, численні малі племена злилися в одне — в групу, що відчайдушно намагається зберегти актуальність, адже дедалі більше молоді тікає до Кульбаб або вступає в дандернську еліту.\n\nЇхня очільниця — жінка на ім’я Бея, відома в Електораті як перша, хто вижив у Шарлатановій хуртовині біля Воріт. Та цей досвід її, безумовно, змінив. Її силу боялися, її розум — шанували. Хоча її канібалізм не був популярним, її легендарний статус зробив її героїнею викривленого народу Кетча.\n\nТа останнім часом племена стали жертвами дивної пошесті, що зробила їх уразливими. П’єр Соломон, прагнучи використати славу Беї, зробив їй пропозицію, від якої вона не могла відмовитись: він забезпечить ліки будь-якою ціною... якщо вона погодиться стати його дружиною."
nf_stn.38.a:0 "У Беї не було вибору."

nf_stn.39.t:0 "Лицарі Червоного Листа"
nf_stn.39.d:0 "Леттермени — це група Лицарів, які походять із земель Манітоби. Вигнані під фальшивим приводом і відмовившись зректися своїх титулів, вони втекли до Кетчу, де й залишилися, розпорошені. Багато хто з них усе ще служить Богові, як може, воюючи як мандрівні мечі, але дехто звернувся до найманства. Та після зникнення їхнього Великого Магістра, багато хто впав у відчай...\n\n...аж поки П’єр Соломон не звернувся до сера Ґріффіна, найшанованішого старшого Лицаря. Він пообіцяв, що зробить усе можливе, аби допомогти Ордену — якщо ті служитимуть йому назавжди як охоронці й карателі.\n\nЛицарі були обурені його пропозицією. Як міг канібал, ще й аристократ, очікувати, що найкращі з Йорктонських лицарів виконуватимуть його брудну роботу? Та все ж вони погодилися, бо боялися варіанту Б: винищення. Чимало лицарів уже було вирізано з обладунків Парайєю Гоукмун із Дандерна та її союзниками. Вони не ризикнули пережити ще один такий інцидент."
nf_stn.39.a:0 "П’єр ще пожалкує про це."

nf_stn.40.t:0 "Що посієш — те й пожнеш"
nf_stn.40.d:0 "Попри всі надії П’єра, шантаж ніколи не закінчується добре. Ані Бея, ані сер Ґріффін не відчували до нього лояльності — і залюбки розірвали б його на шматки, якби видалась нагода. Та діяти треба вже зараз. П’єрова параноя змушує його уникати публічності, і чекати на слушний момент може бути небезпечно. Весілля П’єра та Беї мало відбутися приблизно через пів року. Якби вдалося реалізувати план до того часу — хіба це не був би ідеальний момент?"
nf_stn.40.a:0 "Хіба ж ні?"
nf_stn_40_tt:0 "У рішеннях з’явиться можливість розпочати переворот від імені Леттерменів або Беї!"

nf_stn.41.t:0 "Новини зі Стоуна"
nf_stn.41.d:0 "Чутки зі Стоуна дійшли до манітобської шляхти — Лицарі Йорктону знову постали під проводом сера Даніела з Вадіни, поваливши Товариство Кульбаби та захопивши контроль над Електоратом.\n\nНа запитання про це Парайя Гоукмун із Дандерна відповіла: «Я вже колись перебила сотню з цих покидьків. Переб’ю й ще стільки ж». Чи справдиться ця заява — ще належить побачити."
nf_stn.41.a:0 "Орден Святого Георгія живе!"
nf_stn.41.b:0 "Сподіваймося, що їхня вірність ослабла..."

nf_stn.43.t:0 "Мутантська Пілігримка"
nf_stn.43.d:0 "Десятки років тому мутанти під проводом доктора Тобоггана дізналися про нетипову партію ФЕВ, яку було вивезено на північ — до Канади. Вирішивши допомогти своїм братам та розкрити таємницю цього вірусу, доктор повів їх через Орегон, Вайомінг, Монтану — аж поки не прибули до Саскачевану, де й оселилися у місті Вакау. Хоча місцеві зустріли їх вороже, битва була односторонньою, і мешканці Кетчу швидко зрозуміли — Тіні та мутанти залишаться.\n\nЗвісно, Кульбаби спробували взяти їх під контроль своєю політикою та красивими словами, але навіть їм не вдалося втримати мутантів у неволі надовго. Лише воля доктора Тобоггана допомогти своїм пацієнтам стримувала їх — до того моменту, поки крики Фрідом не повернули їм гнів."
nf_stn.43.a:0 "Свобода!"

nf_stn.44.t:0 "Та, що вижила"
nf_stn.44.d:0 "Ким я хотіла стати, коли виросту?\n\nШвачкою. Я мріяла ткати найкращі тканини у туніки й шати, гідні королів. Хотіла простого життя, займатися ремеслом у тихому куточку свого села. Замість цього я послухала божевільну матір, пішла в ту прокляту хуртовину, повну Умбраворів, і стала символом сили для мого народу.\n\nЛюди дивляться на мене — й я чую, що в них у думках. Узурпаторка. Злодійка. Вбивця. Ці слова болять, та мало що значать. Найбільше турбує, що вони знають моє ім’я. А я хотіла бути безіменною, маленькою дівчинкою з великою мрією... Але ми не завжди отримуємо, чого хочемо.\n\nІ ось я — невільна Королева племен. Мій народ дивиться з повагою та страхом, бо знає: мою силу не здолати, а моє мовчання — лякає.\n\nП’єр хотів зробити з мене трофей. Хотів, аби я благала за життя мого народу, поки він грає у свої ігри, облизуючи губи, готовий сказати: «Шах і мат». У кінці кінців його зухвалість його ж і згубила — і тепер він просто пляма на моєму новому килимі.\n\nМене більше ніхто не використає як інструмент. Сьогодні я здобуваю не лише Стоун, але й власну долю. Моє ім’я — Бея, і мене навіки знатимуть як Першу."
nf_stn.44.a:0 "Так і буде."

  nf_stn.45.t:0 "Країна, Принижена Двічі"
  nf_stn.45.d:0 "Навіть на наших власних вулицях бачиш людей, що носять зірки й смуги замість кленового листа. Чому? Бо це земля, яку зруйнували двічі. Американці прийшли й вбили в нас своє задушливе патріотичне божевілля, і ми були змушені стати на коліна. Колись горді канадці змушені були забути, ким були, і знайти в серці місце для президентів і Бенджамінів. Навіть бомби не змогли змити цього сорому.\n\nА зараз? У Саскачевані гниє культура образи. Люди ненавидять свою землю й ненавидять свій народ."
  nf_stn.45.a:0 "Може, канібали тут трохи причетні."

  nf_stn.46.t:0 "Як Думати Економічно: або Як Я Почав Їсти Людей"
  nf_stn.46.d:0 "Слухай уважно, друже: пустка — це гівняне місце, і Катч не набагато кращий, хоч ми й вдаємо, що ми вищий щабель цивілізації. Хлопці з Плезантдейла вважають, що з вирощуванням культур усе вирішили, а ті дурники з Дандерна зі своїм трансгуманістичним маразмом взагалі не допомагають. То що, ми — сотні ідіотів, розкиданих абияк, і ніхто толком не знає, звідки візьмемо їжу. Принаймні нормальну, гідну розумної людини, їжу, так?\n\nІ от — не всі з нас важливі. Знаю, знаю, «кожна людина важлива» — це лайно, яке нам впарюють з дитинства, але забудь. Убий когось, якщо хочеш — просто нікому не кажи, й усе буде нормально. Головне, щоби вони не мали значення.\n\nТому коли прийшли люди — тобто дебіли — й питають: «А як ми, блін, влаштуємо бенкет, ідіоте?», я собі думаю: «Та це ж легко, недоумки», — і показав на тих канібалів, які, між іншим, почуваються прекрасно. Декілька «геніїв» вирішили виступити проти — ну, я їх не закопав, я їх в піч жбурнув! Бо знаєш що? Якщо ти не маєш призначення — то на вечерю підеш не гірше, ніж брамін. До речі, людське м'ясо на смак нічим не гірше — хоч і трохи шизу з серцем викликає. Наче ми маємо якийсь еталон.\n\nПодумаєш — у нас дівки щодня народжують. Як дартс: хто прилип — той і живе, а решту — на срібну тацю. Це ж математика."
  nf_stn.46.a:0 "Хтось зголоднів?"

  nf_stn.47.t:0 "Чому Я, Напевно, Найщасливіша Людина на Землі"
  nf_stn.47.d:0 "Почну з першого й найважливішого пункту:\n\nОцінка ризиків — то маячня.\n\nНе віриш? Я щойно всіх обібрав і втік, бо, чесно кажучи, здається, що я безсмертний. Просто надто крутий, мабуть. У мене — найкрасивіша дружина в цьому болоті, і купа тупих лицарів, що ладні за мене померти. Іронія того, що більшість з них хоче мене вбити — не пройшла повз мене. Але я головний тепер, і можу тримати всі страхіття на безпечній відстані.\n\nЦе все звучить як казка, га? Але, знаєш, раз я вожак зграї, навіщо мені вся ця шайка дурнів у костюмах — особливо коли я чую, як їхні мечі сверблять мене в думках? Час навести лад. Поїхали?"
  nf_stn.47.a:0 "Чесно? Я б і сам цього придурка завалив."

  nf_stn.48.t:0 "Надзвичайна Допомога: Плезантдейл"
  nf_stn.48.d:0 "До шановного, шановного, дуже шановного народу Плезантдейла:\n\nЯк ваш новий і надзвичайно привабливий лідер, я хочу зробити офіційну заяву: усе, що ви робили раніше — продовжуйте робити. Просто тепер це буде для мене. А всі ж мене люблять, правда? Тому ще легше буде!\n\nПриймайте наркотики, трахайте своїх дружин — а може й я долучуся. Бо я, зрештою, чоловік народу. Також я призначаю Дейла Робертсона моїм особистим зв'язковим у місті — бо, погодьтесь, всі ми хоч раз казали: «Залишайся приємним, Дейле!» А ще на нього дуже зручно кричати.\n\nЗ любов’ю і поцілунками,\n\nП'єр Соломон"
  nf_stn.48.a:0 "Залишайся приємним, Дейле!"

  nf_stn.49.t:0 "Надзвичайна Допомога: Дандерн"
  nf_stn.49.d:0 "До народу Дандерна:\n\nВаше місто — лайно, а ваші лідери — божевільні. Ідіть до біса.\n\nЖартую. Але серйозно.\n\nПерестаньте намагатись переосмислити людство. Ми вже тут. Просто робіть свою чортову роботу.\n\nП'єр Соломон"
  nf_stn.49.a:0 "Так тримати, П'єре."

  nf_stn.50.t:0 "Парія Хоукмун, моя Любов"
  nf_stn.50.d:0 "Я скажу чесно: Парія Хоукмун — завжди була стервом. Але вона чудове стерво для всіх нас.\n\nСкільки придурків реально хотіли зіштовхнутися з Леші? Точно не більшість Леттерменів. Ідіотське прагнення до самозбереження зіпсувало чимало справ. Не те щоб я не дбав про виживання, але я ж вожак. Навіщо мені стрибати в багаття?\n\nКоротше кажучи, раз вона з нами — нехай і далі робить дурні вчинки для нас. Так просто краще."
  nf_stn.50.a:0 "Дівка — вогонь."

  nf_stn.51.t:0 "Найвеличніша Афера Усіх Часів"
  nf_stn.51.d:0 "Слухай уважно: хлопчина закінчує Університет Чейза в Плезантдейлі, йде до Дандерна, потрапляє на якесь дебільне ток-шоу — і переконує робітничий клас, що найкращий спосіб знайти сенс у житті — це відмовитися від власних ідей і просто вибрати якусь відому персону, за якою слід іти? І люди в це ПОВІРИЛИ? І ще й платили йому, щоби послухати це вживу?\n\nОце мужик! Справді. Це навіть не геніальність — це просто використання людей. Що й є геніальністю.\n\nЦе одна з тих речей, про які ти чуєш, бачиш і все одно не віриш. Чому я до цього сам не додумався?\n\nХоча... мабуть, таки додумався. Доктрина Літтлхоупа і привела мене сюди, хіба ні? Жартую. Хоча тільки трохи — бо фальсифікація виборів і гроші зробили своє, але Літтлхоуп дав мені достатньо ідіотів, щоб кидати в багаття. І тепер — більше й більше грошей щодня."
  nf_stn.51.a:0 "Оце мій типаж, безперечно."

  nf_stn.52.t:0 "Запечатування Конверта"
  nf_stn.52.d:0 "Деякий час Леттермени були зручними. Йорктона та його банду придурків кинули під автобус, бо вони більше створювали проблем, ніж вирішували, і Манітоба викинула їх на смітник. Парія й хлопці з Дандерна чітко дали зрозуміти — побачать лицаря тут, вб’ють на місці. Тож коли я зробив ту милу маленьку угоду — вони накинулися на неї, як голодні песики.\n\nМати армію лицарів, що слухається твоїх наказів, було зручно певний час, але, здається, вони забули, хто тут справді керує. Тож згідно з законом бізнесу й асоціацій, час розірвати зв’язки."
  nf_stn.52.a:0 "До речі, «Леттермени»? Це найкраще, що ви придумали?"

  nf_stn.53.t:0 "Я ТАКА ЩАСЛИВА БУТИ ТУТ!"
  nf_stn.53.d:0 "Привіт, пане Соломон! Я НАДІЯ, ваша нова помічниця. Як я зрозуміла, у вас є купа людей, які дуже-дуже хочуть вас убити — і я була б безмежно рада усунути їх для вас. Тож гайда до справи й до безпечного життя — хутко-хутко!"
  nf_stn.53.a:0 "Стань моєю дружиною?"

  nf_stn.54.t:0 "Пакт Найогидніший"
  nf_stn.54.d:0 "Бея зникла на три дні. Три ночі вона йшла, прямуючи до лігва Леші. Там, у тій страшній, зануреній у тишу халупі, вона побачила велику змію: її чудові лусочки мерехтіли в темряві опівночі.\n\n«Ти хоробра, що прийшла сюди, маленька племінна», — сказала Леші, очі її спалахнули. — «Що скажеш перед тим, як мої ікла роздеруть твою плоть?»\n\nБея була похмура; налякана, але ще більше боялася долі свого народу. «Ти прагнеш хаосу, так? А я — рабиня чоловіка, який вважає, що тримає весь регіон у своїй жмені».\n\nЗіниця Леші звузилась. «Ти маєш мою увагу».\n\n«Скоро ми поберемося — хоч я цього й не бажаю. Мої воїни і я допоможемо тобі пробратись у підземелля міста. По моєму сигналу, під час весілля — ти вирвешся на поверхню, і хаос, що ти принесеш, зламає їхню впевненість. Перша велика рана в горлянці Електорату — і ми нанесемо її разом.»\n\nУсмішка Леші стала лиховісною. «Ох, яка насолода. Така, така солодка. Ти маєш мою...» — вона облизала свої лускаті губи, — «мою цілковиту увагу.»"
  nf_stn.54.a:0 "Дві змії, що граються у темряві..."

  nf_stn.55.t:0 "Кінець Ковбойки"
  nf_stn.55.d:0 "Бея увірвалася в глибини МАНІФЕСТ Північ, несучи на плечах тушу умбравора — його глиняна плоть захищала її від автоматизованих систем оборони. Вже її племінники билися поруч із Леші, поки та змія розривала укріплення, хльоскаючи хвостом заступників Доля.\n\nДоля була напрочуд спокійна, коли з’явилася Бея. «§RО-о, подивіться на тебе — хіба ж не красуня, га? Та ти ж справжній персик з тих пір, як утекла.§!»\n\nБея не мала бажання жартувати. Вона підійшла до машини Доля, не бажаючи витрачати час на балачки — і з усієї сили ввігнала свої кігті в металеву шкіру центрального комп’ютера. Вона видала останній крик — і зникла.\n\nЖахіття закінчилося — а разом із ним почало розвіюватися й Багряне Завірюха."
  nf_stn.55.a:0 "Навіть чудовиська можуть принести мир."

  nf_stn.56.t:0 "Жертва для Леші"
  nf_stn.56.d:0 "§RОтже, ти повернулася до мене з дарунками союзу? Справді хоробра племінна, ти є... Покажи, що принесла, і я подумаю над твоєю пропозицією.§!"
  nf_stn.56.a:0 "У Катчі укладено дійсно смертоносний союз..."

  ###########################################focus

  stn_1:0 "Де Ріка Тече Червоною"
  stn_1_desc:0 "Стун не завжди був хорошим місцем... І, будьмо чесні, досі таким не став."

  stn_2:0 "Кульбабники"
  stn_2_desc:0 "Товариство Кульбаби принесло вогонь цивілізації до Старих Племен — на краще чи на гірше."

  stn_3:0 "Стара Кров Стуна"
  stn_3_desc:0 "Старі племена Стуна зробили все можливе, аби вижити під владою Електорату. Тепер їм доводиться за це платити."

  stn_4:0 "Лицарі Колись"
  stn_4_desc:0 "Дозволь запитати: якщо ти присвятив себе тому, щоб довести велич своєї батьківщини — що робиш, коли ця батьківщина зрікається тебе? Викидає тебе на смітник? Змушує жити на колишній ворожій території?"

  stn_5:0 "Що Було — Може Повернутись"
  stn_5_desc:0 "Схеми П'єра, можливо, все ж його наздоженуть... Але це ще не точно."


  stn_birch_hills:0 "Що Коється Під Нашими Ногами"
  stn_birch_hills_desc:0 "Психіатричну лікарню Бірч-Гіллз було збудовано Тобоганом, щоб допомогти нічкінам впоратися зі своїми муками. Але Кульбабники мали інші плани."

  stn_radio_freedom:0 "Радіо Свобода"
  stn_radio_freedom_desc:0 "Дивна трансляція, яку веде божевільний нічкін, прорвалася в радіо по всій нації. Тепер він мовить викривлену американську пропаганду, наче вона його власна..."

  stn_destroy_radio_freedom:0 "Прибрати Мегаломана"
  stn_destroy_radio_freedom_desc:0 "Генерал Свобода — це загроза. Він не тільки заохочує брудну чернь співчувати нічкінам, але й явно схильний до насильства. Його слід зупинити."

  stn_embrace_radio_freedom:0 "Співпраця з Генералом Свободою"
  stn_embrace_radio_freedom_desc:0 "Генерал Свобода — загроза, так, але її можна знешкодити старим добрим дипломатичним словом. Ми будемо «співпрацювати» з ним у межах розумного. Зрештою, він лише мутант... Ймовірність, що він стане більшою загрозою, мізерна."
  stn_embrace_radio_freedom_tooltip:0 "З’явиться 1 §GДивізія Супермутантів§! та 1 §GДивізія Нічкінів§!.\n\nЯкщо наш закон про вербування мутантів — §YМутантів Не Допускати§!, він зміниться на §YВербування Супермутантів§!.\nЯкщо закон — §YВербування Гулів§!, він зміниться на §YВербування Всіх Мутантів§!."

  stn_assessing_nightkin:0 "Оцінка Нічкінів"
  stn_assessing_nightkin_desc:0 "Нічкіни були приречені на одне з двох: відновлення або утилізацію. Від нас залежить, чи матиме Тобоган ресурси, щоб довести справу до кінця."

  stn_fate_of_nightkin_in_stoon:0 "Доля Нічкінів у Стуні"
  stn_fate_of_nightkin_in_stoon_desc:0 "Настав час вирішити долю нічкінів в Електораті. Хай П'єр і ідіот, але червоний папороть дозволяє пом’якшити їхню плоть — а з тим, скільки ФЕВ у нас залишилось у МАНІФЕСТ Саскатчеван, ми можемо легко подвоїти запаси харчів."

  stn_the_depths_of_the_state:0 "У Глибинах Притулку"
  stn_the_depths_of_the_state_desc:0 "У глибинах Бірч-Гіллз... хто знає, що там насправді коїться? Знав лише Тобоган."

  stn_militarizing_FEV:0 "Питання ФЕВ"
  stn_militarizing_FEV_desc:0 "МАНІФЕСТ широко використовував ФЕВ до війни, і нічкіни прийшли сюди саме за ним. Хоча це й надто небезпечно для загального вжитку, нічкіни давно довели свою вірність Електорату. Ми надамо їм повну повагу та належне лікування."

  stn_the_stampede_approaches:0 "Велика Зграя"
  stn_the_stampede_approaches_desc:0 "Велика Зграя — колосальне скупчення кочівників, племінних і всяких відкинутих. Вона слугує щитом від армій КПФ, але більше нічого не дає. Нещодавно вони почали приготування до захоплення Півночі — заяви на право власності. Ми не можемо цього допустити."

  stn_batford_refugees:0 "Хлопці з Батлфорда"
  stn_batford_refugees_desc:0 "Батлфордська Бригада ніколи не була нам другом, але й не ворогом. Вони були набагато цивілізованішими, ніж Приватири з Півночі, і були хорошими бійцями. Якщо вони впадуть, ми запропонуємо притулок всім біженцям, які готові служити авангардом проти Зграї."

  stn_equip_the_lettermen:0 "Оснастити Армію"
  stn_equip_the_lettermen_desc:0 "Наші солдати потребують якісної зброї. На щастя, в нас ще є запаси зі складів Дандерна."

  stn_fortify_border:0 "Стіну Проти Непотрібних"
  stn_fortify_border_desc:0 "Типові Згаєвики — просто збрід. Гарна стіна на південному кордоні триматиме їх у страху."

  stn_beseech_the_tribes:0 "Звернутись до Племен"
  stn_beseech_the_tribes_desc:0 "Племена в Стуні можуть нам допомогти. Запропонуймо їм пожертви в обмін на їхніх найкращих кровожерливих воїнів!"

  stn_responsibilities:0 "Обов'язки Стуна"
  stn_responsibilities_desc:0 "Наш... 'обов'язок' як Великого Електора — це смішно, але забувати про нього не варто, бо народ затаїть злобу."

  stn_the_fires_of_dundurn:0 "Вогні Дандерна"
  stn_the_fires_of_dundurn_desc:0 "Дандерн завжди був місцем, де люди з мертвими серцями йдуть задихатися в попелі. Це індустріальний хребет Електорату, але не дім. Та поки його вогні палають — наші шанси зростають."

  stn_clean_water_for_all:0 "Чиста Вода, Чисті Ідеали"
  stn_clean_water_for_all_desc:0 "Кажуть, що той, хто контролює воду, контролює і серця, і розум народу. Врешті-решт, це основа людського життя. Принесімо людям воду! Спробувавши її, вони не визнають жодної іншої влади."

  stn_the_parties_of_pleasantdale:0 "Плезантдейл: Місце, Де Все Можна Забути"
  stn_the_parties_of_pleasantdale_desc:0 "Плезантдейл — місто, де можна безтурботно веселитися, або принаймні так кажуть. У нього немає армії, зате є темна наука та великі чудовиська. Оцінимо їх належно."

  stn_invest_in_faeries:0 "Інвестиції у Фей"
  stn_invest_in_faeries_desc:0 "Феї з Плезантдейла — це зброя, яку можна використати з великою ефективністю. Моральність? Поза межами сумніву. Але хто ми такі, щоб судити?"

  stn_invest_in_red_fern:0 "Інвестувати в Червоний Папороть"
  stn_invest_in_red_fern_desc:0 "Препарат та рослина Червоний Папороть виявилися не лише гнучкими, а й дешевими у виробництві за певних умов. Уміло контролюючи процес, ми можемо заволодіти цілими ринками!"

  stn_shutting_down_faerie_program:0 "Закрити Програму Фей"
  stn_shutting_down_faerie_program_desc:0 "Феї з Плезантдейла — не зброя, яку можна використовувати у війнах, до яких вони не мають жодного стосунку. Вони — діти, і ця нелюдська програма мусить бути негайно зупинена."

  stn_open_trade:0 "Відкрити Торгівлю"
  stn_open_trade_desc:0 "У роки перед піднесенням П'єра торгівля між землями Електорату за межами Дандерна була... мінімальною. Це зміниться, і разом з цим старі угоди знову стануть актуальними!"

  stn_dundurn_munitions_factories:0 "Боєприпаси Гокмун"
  stn_dundurn_munitions_factories_desc:0 "Військово-промисловий комплекс Дандерна очолювала Парія Гокмун у молодості. Він одного разу привів їх до перемоги над Метісами — і зробить це знову, якщо знадобиться."

  stn_dundurn_consumer_factories:0 "Мурайов Розваги"
  stn_dundurn_consumer_factories_desc:0 "Мурайов Розваги допомогли масово впровадити телевізори в Електорат. Якщо знадобиться — вони здатні творити ще більші дива."

  stn_saskatoon:0 "Що Зробило Стун"
  stn_saskatoon_desc:0 "Саскатун був осередком жорстокості задовго до того, як став містом до війни. Це легко забути, коли попиваєш вино та ведеш дрібну політику..."

  stn_wanuskewin_heritage:0 "Парк Спадщини Ванускевін"
  stn_wanuskewin_heritage_desc:0 "Ванускевін, з мови крі — «жити разом у гармонії», досі носить шрами Великої Війни. Із занепадом цивілізації багато хто не переймався збереженням цієї спадщини: корінні народи втекли у безпечніші місця, а на цих землях залишилась лише Стара Кров Стуна. Проте останніми роками корінне населення повернулося. Ми відновимо й знову присвятимо ці землі їм на знак доброї волі."

  stn_allow_samoset_to_reopen_the_dig:0 "Дозволити Самосету Розкопки"
  stn_allow_samoset_to_reopen_the_dig_desc:0 "Чоловік на ім'я Самосет прибув з Залізної Конфедерації, почувши про нашу увагу до Парку Спадщини. Він каже, що реліквії його предків досі покривають цю землю — і хоче заплатити за право проводити розкопки. Хто ми такі, щоб йому відмовити?"

  stn_outsourced_help:0 "Залучити Зовнішню Допомогу"
  stn_outsourced_help_desc:0 "У Стуні ніколи не було великої промисловості. Та з нашими багатими скарбницями можна дозволити кільком дурням доступ до неї — в обмін на полегшення нашого тягаря."

  stn_black_heart_memorial:0 "Меморіал Чорного Серця"
  stn_black_heart_memorial_desc:0 "Зведений одразу після Великої Війни канадськими вцілілими, Меморіал Чорного Серця складався з грубих статуй, зроблених із американської зброї та уламків силової броні Т-51. Сьогодні він слугує похмурим нагадуванням про те, чим стала Канада — оболонкою себе самої, а ті, хто ще вірить у її сутність, звинувачують у всьому США."

  stn_boomtown:0 "Бумтаун!"
  stn_boomtown_desc:0 "Колись виставковий проєкт періоду освоєння, Бумтаун став домівкою для диких істот. Вичистивши його, ми зможемо підняти бойовий дух — та й виглядає він просто шикарно!"

  stn_boomtown_ladies_sing_this_song:0 "Дами з Бумтауна Співають Цю Пісню"
  stn_boomtown_ladies_sing_this_song_desc:0 "Старі аніматронні схеми досі розкидані по Бумтауну. Використаємо їх з розумом!"

  stn_grandoran_builders:0 "Грандорські Будівельники"
  stn_grandoran_builders_desc:0 "Грандора завжди була притулком для тих, хто вижив. Роки атак умбраворів та інших жахіть загартували місцевих, і нині вони сильніші за будь-кого поза племенами. Можливо, вони допоможуть і нам."

  stn_stories_of_the_canadian_occupation:0 "Історії Канадської Окупації"
  stn_stories_of_the_canadian_occupation_desc:0 "Американська окупація Канади знищила багато — і досі переслідує наших дітей у снах. Після падіння бомб ми так і не змогли цього пережити. Але з належною турботою, можливо, це зміниться."

  stn_the_long_night:0 "Довга Ніч"
  stn_the_long_night_desc:0 "Коли канібали прийшли до Стуна, то зробили це з оскалом і кігтями. Людей викрадали з власних домівок, а їхні кістки повертали у вигляді жорстоких жартів. Такі жахіття ніколи не зникали повністю."

  stn_american_poison:0 "Американська Отрута"
  stn_american_poison_desc:0 "Американці не зникли разом із ядерним вогнем. Залишки армії стали рейдерами, висмоктуючи рештки ресурсів — ці 'Зоревражені' бродяги трималися роками, допоки племена не зжерли їх з домівками разом. Тепер їхні отруйні залишки засмічують місто."

  stn_the_dandies:0 "Денді"
  stn_the_dandies_desc:0 "Деякі зі стунських мешканців, так звані 'еліти', проголосили себе особливими. Вони наслідували племінні звичаї, бо ті здавалися їм 'досить милими для спроби', й із радістю пожирали своїх співгромадян. Ця пиха, ця жадібність, ця гординя — вони топили місто, та Денді підтримували вогонь. Минуть десятиліття, перш ніж щось зміниться."

  stn_memories_of_MANIFEST:0 "Спогади про МАНІФЕСТ'у"
  stn_memories_of_MANIFEST_desc:0 "МАНІФЕСТ з'явився й зник ще до війни, будучи технологічним 'гігантом', що прагнув висмоктати фінансування з американського міністерства оборони. У Стуні залишилося мало їхніх об'єктів, але серед Електорів їхня присутність — мов привид: активні камери, махінації НАДІЇ, роботи з Плезантдейлу... Це ніколи не закінчувалось."

  stn_the_PFC:0 "Цивілізація"
  stn_the_PFC_desc:0 "Попри всі жахи, цивілізація неодноразово приходила до Стуна і знову зникала: Народний фронт Канади, Канадський народний фронт, Королівство Манітоба... Але це не була земля цивілізації. Племена не приймали такого. Тільки нещодавно все почало змінюватися. Але Стара Кров Стуна ніколи не вітала деспотів — і якби мала владу, ніколи б не вітала."

  ## канібалізм

  stn_cut_back_on_cannibalism:0 "§MСкорочення Канібалізму§!"
  stn_cut_back_on_cannibalism_desc:0 "О, чуйте! Це місто може бути більшим, ніж просто лігво аморальності. Свобода та Бог пройдуть пліч-о-пліч і переможуть темну жагу проклятих шлунків!"

  stn_duck_lake_massacre:0 "Різанина в Дак-Лейк"
  stn_duck_lake_massacre_desc:0 "Племена з Дак-Лейк — зі Старої Крові. Якщо ми хочемо викорінити канібалізм у країні назавжди, його слід вирвати з самого серця."

  stn_banishing_neerdowells:0 "Вигнання Нікчем"
  stn_banishing_neerdowells_desc:0 "Мішані виродки Старої Крові ще можуть стати в пригоді. Але з падінням Денді вже нікому заохочувати найгірших із них. Ми позбавимось їх, а тим, хто бажає жити за нашими догмами — дозволимо мирно співіснувати."

  stn_daniels_blessings:0 "Благословення Даніеля"
  stn_daniels_blessings_desc:0 "Сер Даніель із Вадіни має просте послання для тих, хто наважиться їсти людське м'ясо..."

  stn_promote_livestock:0 "Просування Тваринництва"
  stn_promote_livestock_desc:0 "Це наука — люди люблять м’ясо! Але ж є й інші способи отримати м’ясо, крім як з ваших співгромадян."

  stn_mutant_barbeques:0 "Барбекю за Рахунок Мутантів"
  stn_mutant_barbeques_desc:0 "Генерал Фрідом має... назвімо це, нетрадиційні методи боротьби з пожирачами плоті."

  stn_passing_the_haunch:0 "§RПередача Окісту§!"
  stn_passing_the_haunch_desc:0 "Річки в Стуні завжди були червоні. І такими залишаться."

  stn_the_feast_never_ends:0 "Бенкет Без Кінця"
  stn_the_feast_never_ends_desc:0 "Без опозиції ми можемо їсти відкрито та безкарно. Кожен чоловік і жінка в Стуні — частина меню. А хто не хоче — хай вчиться тримати щелепи подалі."

  stn_the_human_pens:0 "Людські Загони"
  stn_the_human_pens_desc:0 "Люди — це лише ще один вид худоби, якщо ви зможете проігнорувати їхню здатність говорити."

  stn_our_greatest_export:0 "Наш Найкращий Експорт"
  stn_our_greatest_export_desc:0 "П'єр завжди був кмітливим бізнесменом. Ми вирощуватимемо якісний 'матеріал' і продаватимемо його як щось краще, ніж яловичина з брамінів — і прибутки потечуть рікою."

  stn_hungering_constituents:0 "Голодні Виборці"
  stn_hungering_constituents_desc:0 "Людям треба більше м’яса — складається враження, ніби їхні зіниці розширюються від того, наскільки шалені вони стали!"

  stn_blood_is_our_tradition:0 "Кров — Наша Традиція"
  stn_blood_is_our_tradition_desc:0 "Кров завжди текла крізь Стун. Місто було прокляте ще з моменту падіння бомб. Це завжди буде місце, де один може з’їсти іншого — і Бея інакше не допустить."

  ###lettermen foci

  stn_knights_of_yorkton:0 "§MОрден Святого Георгія§!"
  stn_knights_of_yorkton_desc:0 "Орден Святого Георгія був вигнаний із рідної землі брудними бюрократами. Тепер, вигнані в божевільні землі Стуна, вони прагнуть здобути нову опору для своєї віри й, за волею Бога, возз'єднатися із завітом, що колись об'єднував їх з Лейфом Йорктоном."

  stn_god_founded_this_earth:0 "Бог Створив Цю Землю — І Ми Її Оборонці"
  stn_god_founded_this_earth_desc:0 "Доктрини Даніеля були прості: люди — від Бога, а отже, як чоловіки Божі, ми мусимо чинити з ними так, як би хотіли, щоб чинили з нами."

  stn_the_blades_of_a_kingdom:0 "Ефесянам 6:17"
  stn_the_blades_of_a_kingdom_desc:0 "«І візьміть шолом спасіння і меч духовний, який є слово Боже.»"

  stn_armor_can_be_broken:0 "Псалом 119:114"
  stn_armor_can_be_broken_desc:0 "«Ти — мій захист і щит;\n\nЯ покладаю надію на Твоє слово.»"

  stn_contact_fairies:0 "Углиб Зачарованого Лісу"
  stn_contact_fairies_desc:0 "О, Боже! Феї Електорату стали жертвами божевільних з Плезантдейлу. Вони більше нікому не довіряють, окрім своїх. Та я не дурень. Вони — лише діти, що граються у війну. Ми запропонуємо їм мету, якої вони ніколи не знали!"

  stn_we_are_but_men:0 "Бо Ми — Лише Люди"
  stn_we_are_but_men_desc:0 "Ми ховалися, як пацюки, під оком Електорату багато років. Легко уявити, що з нашим теперішнім пануванням ми вище за такі дрібниці, як молитва й поклоніння — але врешті-решт ми — лише люди, що грають у святих. Та наша віра — не облуда: якщо Бог поставив нас на цю землю, то й нам втілювати Його волю."

  stn_eradicating_bandits:0 "Крововірці"
  stn_eradicating_bandits_desc:0 "Паство отця Скрапгіпа — дикі, небезпечні. Їх потрібно зупинити, допоки їхнє насильство не отруїло наші серця і наших дітей."

  stn_i_believe_in_mankind:0 "Я Вірю в Людство"
  stn_i_believe_in_mankind_desc:0 "Як ми віримо в Бога, так само маємо вірити в своїх братів і сестер. Чи всі вони грішники? Чи єретики — за власним вибором чи від незнання? Ні. Найстрашніші — ті, хто не говорив як брат чи сестра до ближнього свого. Ми маємо навчити народ любити один одного, як ми любимо своїх побратимів-лицарів."

  stn_crushing_privateers:0 "Пірати Саскачевану"
  stn_crushing_privateers_desc:0 "Пірати Саскачевану, мов сарана, злітаються під знамена Принца Альберта. Це божевілля має скінчитися! Вони занадто довго роз'їдали Стун своїм гнилим торгом."

  stn_brigading_brigadiers:0 "Відступницька Бригада"
  stn_brigading_brigadiers_desc:0 "Чоловіки та жінки Брігади Батлфорда вважають себе 'реформованими' бандитами й піратами, що тепер прагнуть заробити бодай щось на кшталт чесного срібняка. Вони не борються за виживання, як ми колись, а з егоїзмом і жадібністю на язиці. Вони не варті й краплі жалю!"

  stn_a_land_of_thieves_and_murderers:0 "Земля Злодіїв та Вбивць"
  stn_a_land_of_thieves_and_murderers_desc:0 "Окрім Зграї, західні землі Саскачевану були пристанищем нічого, окрім рейдерів і прилипал — тих, хто живе за рахунок решток, що падають з рук КПФ чи Електорату. Ми очистимо цю землю від їхнього впливу, посолимо її історію і принесемо на неї світло Божої слави."

  stn_against_titans:0 "Проти Гіганта"
  stn_against_titans_desc:0 "Найбільша загроза Манітобі прийшла здалеку. Велика Зграя, союз племен і кочівників, дивиться на нас через прикритий туманом кордон, ніби запрошуючи на війну, яку ми навряд чи виграємо. Та навіть тоді у нас лунає думка...\n\nЧи можемо ми називатися вірними Богові, якщо навіть не спробуємо?"

  stn_prodigal_sons_reunited:0 "Від Матвія 5:9"
  stn_prodigal_sons_reunited_desc:0 "«Блаженні миротворці, бо вони синами Божими названі будуть.»"

  stn_dundurn_restorations:0 "2 Тимофія 2:15"
  stn_dundurn_restorations_desc:0 "«Старайся з'явитися перед Богом гідним, працівником без сорому, що вірно передає слово істини.»"

  stn_corinas_work:0 "Мрія Прекрасної Пані Коріни"
  stn_corinas_work_desc:0 "Пані Коріна була інженеркою на службі у Фонду Роузвуд до нашої окупації. Її праця, як і праця Глорії Чейз, мала вирішальне значення для добробуту людей у Дандерні. Ми повинні звернутися до них якомога швидше."

  stn_legacy_of_the_sparkblades:0 "Спадщина Іскроклинків"
  stn_legacy_of_the_sparkblades_desc:0 "Хай вони й рейдери, та Іскроклинки — вправні тактики й доблесні бійці. Можливо, варто дати їм шанс — або ж, якщо ми налаштовані благородно, навіть прийняти їх до новітнього лицарського ордену?"

  stn_cleanliness_is_second_to_godliness:0 "Чистота Поруч із Богом"
  stn_cleanliness_is_second_to_godliness_desc:0 "Дим над Дандерном, можливо, для когось і знаковий, та він душить невинних, що тяжко працюють щодня. Ми повинні його приборкати й очистити повітря, інакше наші промислові велетні знову впадуть жертвою жадібності й гордині."

  stn_pleasantdale_pleasantries:0 "У Землі Джентрі"
  stn_pleasantdale_pleasantries_desc:0 "На іншому кінці Електорату — ще один осередок «шляхетності»: Плезантдейл та навколишні «Приємні Землі». Відомий своїм вишуканим виглядом вулиць і скандальними полюваннями Товариства Білого Березового Листя. Нам слід якнайшвидше інтегрувати цю територію."

  stn_the_matter_of_the_cabal:0 "Користь від Єресі"
  stn_the_matter_of_the_cabal_desc:0 "...Якщо така річ взагалі можлива. Спектральний Кабал не виявляв нам ворожості; хоч їхні практики й... дивні, можливо, варто обміркувати усе, перш ніж вдаватися до рішучих дій."

  stn_HOPEs_network:0 "Щодо Помічниці Чейз..."
  stn_HOPEs_network_desc:0 "НАДІЯ — штучний інтелект з довоєнних часів, що працював на родину Чейз. Саме завдяки її знанням ми знову побачили такі дива, як телебачення та справжню інфраструктуру. Її комплекс досі дрімає під Плезантдейлом, і вона готова допомогти — безкоштовно. Чому б не завітати в гості?"

  stn_where_god_once_sang_songs:0 "День, Коли Голуби Не Співали"
  stn_where_god_once_sang_songs_desc:0 "Сер Даніель із Вадіни повертається додому до свого котеджу. Те, що він там побачив, змінило все."

  ### гілка П'єра

  stn_schemers_paradise:0 "§OЯк Заводити Друзів і Впливати на Людей, Частина I§!"
  stn_schemers_paradise_desc:0 "Якось, попри всі шанси, П'єру вдалося. Люди дивилися на нього з розплющеними очима, ніби він їхній король. А тепер? Тепер починається веселощі."

  stn_pleasant_country:0 "Земля Джентрі"
  stn_pleasant_country_desc:0 "Назва — брехня. Люди в Плезантдейлі — всі несповна розуму, і ми просто прикидаємось, ніби це терпимо, бо саме вони підуть першими, якщо Кривавий Буревій добереться сюди."

  stn_remake_electorate:0 "Перебудова Кривавого Електорату"
  stn_remake_electorate_desc:0 "Нам не потрібні жодні королівські жирдяї, щоб керувати Електоратом — наша сила завжди була зсередини, й такою залишиться. Поставимо кілька маріонеткових урядів — і знову виглядатимемо як справжній Електорат."

  stn_approach_batford:0 "Панове, Наші Нові Найкращі Друзі"
  stn_approach_batford_desc:0 "Здобути повагу у цьому світі — завдання не з легких. Але після всього... Трохи безпеки точно не завадить, правда ж? Давайте зіграємо правильно й подивимось, чи захоче королівство — зі своїми повними гаманцями — грати з дорослими. \n\nЯ обожнюю гарну кооперацію."

  stn_the_problem_of_dundurn:0 "Дандерн: Місто Тисячі Проблем"
  stn_the_problem_of_dundurn_desc:0 "Слухайте, ніхто з нас не хоче там жити. Якщо хтось каже: «Я з Дандерна», зазвичай додає закашлявшись і простягаючи руку вугіллям унизу. Як ви гадаєте, я хочу це тиснути? Обридло. І не починайте про їхніх «філософів»..."

  stn_address_traitors_and_murderers:0 "Гаразд, Я Знаю, Ви Хочете Мене Вбити..."
  stn_address_traitors_and_murderers_desc:0 "І знаєте, що найсмішніше? Я вас не звинувачую. Я б сам хотів себе вбити. Але в мене ще багато планів, і я не збираюся дозволити комусь псувати мені сон."

  stn_hopes_assistance:0 "Геніальність із Гарною Усмішкою"
  stn_hopes_assistance_desc:0 "Вона божевільна й робить усе, що я кажу. Чесно, я мав би з нею одружитися!"

  stn_the_problem_children:0 "Проблемні Діти"
  stn_the_problem_children_desc:0 "Гей, мені теж не подобається ідея «ми знущалися з дітей роками», яку мав Макс... Але з погляду бізнесу — він був правий. Ви ж розумієте? Справжній злочин — що я не вигадав це першим."

  stn_chasing_faeries:0 "Полювання на Фей"
  stn_chasing_faeries_desc:0 "Чесно, вони просто неймовірні, га? Недарма ті бовдури не створили справжню армію. Ці дітлахи — вбивчі таланти!"

  stn_faeries:0 "Ці Кумедні Дітлахи — Просто Скарб"
  stn_faeries_desc:0 "Поговорив із НАДІЄЮ — вирішив, що програма фей має залишитися назавжди. Але на відміну від Плезантдейла, я не дурень, тому ми підкріпимо їх справжніми солдатами. Уявіть собі — використовувати свої обмежені суперсолдати як підсилення, а не заміну. Неймовірно, га?"

  stn_manifest_saskatchewan_funding:0 "Фінансування Ремонту МАНІФЕСТ'у"
  stn_manifest_saskatchewan_funding_desc:0 "НАДІЯ сказала, що її стара лабораторія — купа мотлоху. Не дивно, що Макс нічого не зробив — просто казав їй щось зробити й чекав результатів. З одного боку, я поважаю його відданість бездіяльності, але з іншого — чоловік, та він же міг заробляти мільйони!"

  stn_dundurn_smog:0 "Дандерн — Якось Навіть Гірший за Стун"
  stn_dundurn_smog_desc:0 "Ви б подумали, що вони будуватимуть заводи подалі від житла, але ні. Який жахливий клапоть землі. Недарма ці люди хотіли стати роботами."

  stn_remember_timothy_littlehope:0 "Тім Літтлхоуп — Найбільший Дурень Століття"
  stn_remember_timothy_littlehope_desc:0 "Як йому це вдалося? Я ніколи цього до кінця не зрозумію."

  stn_the_tribes:0 "Трохи Поваги до Консервативного Людожерства"
  stn_the_tribes_desc:0 "Слухайте, це не така вже й погана ідея. Як гадаєте, чому я її й перейняв?"

  stn_beyas_fall:0 "Смерть Беї"
  stn_beyas_fall_desc:0 "Мені це не в радість. Вона мала чудове тіло й могла зробити з чоловіка кисіль одним ударом, але знаєте... Дружина, яка може проломити тобі череп — не найкращий варіант, особливо коли вона тебе ненавидить. Думаю, ви розумієте, чому все так скінчилось."

  stn_corner_the_lettermen:0 "Загнати Леттерменів у Кут"
  stn_corner_the_lettermen_desc:0 "Уявіть собі — обирати мечі й молоти в світі, де існують вогнепали."

  stn_sir_griffins_end:0 "Нещасна Доля Сера Ґріффіна-Невдахи"
  stn_sir_griffins_end_desc:0 "Боже, якщо це був один із кращих Йорктонівських людей, то Йорктон був просто лайно."

  stn_peoples_front_of_canada:0 "Сонет П'єра"
  stn_peoples_front_of_canada_desc:0 "О, яка ж кар'єра. Ми прибрали всіх виродків, що нам дошкуляли — і тепер, здається, це крісло ще ніколи не було таким м'яким."

  stn_promise_pariah_promotion:0 "Втягнути Парію"
  stn_promise_pariah_promotion_desc:0 "Слухайте. Парія — мабуть, єдине добре, що коли-небудь вийшло з Дандерна."

  stn_deal_with_stampede:0 "Битва з Буйним Табуном"
  stn_deal_with_stampede_desc:0 "Зграя — не найзручніша ціль, але вони ж самі на нас підуть рано чи пізно. Тож чому б не вдарити першими й не збити їх із пантелику?"

  stn_deal_with_the_renegades:0 "Бійка з Відступниками"
  stn_deal_with_the_renegades_desc:0 "Знаєте, у мене складні почуття до Баттлфорда... Але може, як ми їх приберемо — мені стане легше."

  stn_deal_with_jailers:0 "НайБісовіша В'язниця у Світі"
  stn_deal_with_jailers_desc:0 "Скільки ж пропозицій я зробив тим чортам у тій в'язниці? Забагато, щоб рахувати. Краще підірвати їх усіх до біса — й забути."

  stn_deal_with_pirates:0 "Колючка в БоцІ, або Пірати, Яких Треба Змести"
  stn_deal_with_pirates_desc:0 "Що вам ще сказати? Це ж пірати. Приберіть їх, йолопи!"

  stn_address_the_bandits:0 "Канадський Кредитний Союз?"
  stn_address_the_bandits_desc:0 "Що за біда? Чому ніхто цим не зайнявся? Ми просто дозволили цьому статися?"

  ### фокуси Дженерал Фрідом

  stn_mutant_patriot:0 "§BЗеленоКровний Патріот§!"
  stn_mutant_patriot_desc:0 "Може, його кров і зелена — але політика у нього по-справжньому червоно-біло-синя."

  stn_mutant_friendship:0 "Люди — Теж Мутанти"
  stn_mutant_friendship_desc:0 "Всупереч поширеним уявленням, Дженерал Фрідом вважав, що люди такі ж мутанти, як і Супермутанти. Адже, врешті-решт, якщо вони можуть жити разом — то яка різниця?"

  stn_mutant_beliefs:0 "Ми Прийшли за Зеленню"
  stn_mutant_beliefs_desc:0 "І, так, ми її знайшли. Але потрапили під черговий чобіт дурня. Певно, треба було краще підготуватися..."

  stn_mutant_factor:0 "Принцип Кожної Людини"
  stn_mutant_factor_desc:0 "«Я кажу вам — кожна людина є мутантом, і кожен мутант є людиною, неважливо, чи вона жінка чи ні.» — Дженерал Фрідом"

  stn_freedoms_benefits:0 "Сини й Доньки Свободи"
  stn_freedoms_benefits_desc:0 "Кожен під рукою Фріда отримує обов'язкове добровільне навчання — у формі дозволу стріляти скільки завгодно ракет по будь-якій споруді на вибір. Ідеально для саморозвитку!"

  stn_mean_green_fighting_machines:0 "Лихі Зелені Бійці"
  stn_mean_green_fighting_machines_desc:0 "Кожен мутант тут пережив утиски. Чи то викинутий з Дандерна, чи замкнений у Вакаві чи Бірч Гіллз. Та тепер — ми вільні. І багато з нас... скажімо так, дуже злі."

  stn_freedoms_fanatics:0 "Фанатики Свободи"
  stn_freedoms_fanatics_desc:0 "«Сину, ти готовий померти за свою країну?» — ось що питав Фрідом при вступі. Дехто сприйняв це буквально... і дуже полюбив імпровізовані вибухівки."

  stn_kicking_out_lettermen:0 "Викинути Леттерменів Демократично"
  stn_kicking_out_lettermen_desc:0 "Леттермени — монархісти без короля. Геть їх! Ми тут за демократію, і не дамо їм її заплямувати."

  stn_he_who_forded_the_saskatchewan:0 "Хто Перейшов Саскачеван"
  stn_he_who_forded_the_saskatchewan_desc:0 "Генерал Фрідом вів наступ на Стун у старому човні, перепливаючи річку, вигукуючи прокльони та стріляючи з Фетмена по, можливо, мирних жителях. Та зрештою, канібали Стуна зазнали поразки — і тепер він править як найславетніший та наймиліший президент усіх часів."

  stn_american_iron:0 "Американське Залізо"
  stn_american_iron_desc:0 "Американці залишили по собі чимало іграшок, із якими канадці могли б побавитися. А з Дженералом Фрідом на чолі — все може стати значно гарячіше..."

  stn_guns_of_the_patriots:0 "Гармати Патріотів"
  stn_guns_of_the_patriots_desc:0 "Справжні чоловіки носять великі стволи. Віднині справжній чоловік — це той, хто тягне з собою здоровенну палицю, навіть якщо це жінка."

  stn_toboggans_genius:0 "Геніальність Тобоггана"
  stn_toboggans_genius_desc:0 "Кажуть, доктор Тобогган і Дженерал Фрідом потиснули руки так сильно, що здули пил із кута міста."

  stn_birch_hills_community:0 "Громадські Ініціативи Бірч Гіллз"
  stn_birch_hills_community_desc:0 "Без притулку, щоб їх тримати, найткін із Бірч Гіллз тепер бігають вулицями, виконуючи добрі справи за наказом свого Великого Генерала."

  stn_toboggans_stratagem:0 "Стратегема Тобоггана"
  stn_toboggans_stratagem_desc:0 "Думки Тобоггана завжди були більш ніж розсудливими — або ж Дженерал Фрідом настільки йому довіряв, що доктор став генієм тактичної справи із чистої необхідності. Бо ж лікар має дбати про своїх пацієнтів!"

  stn_a_mutant_president_where_have_i_seen_that_before:0 "Президент Синій — і Він Хоче Гатити Поганців"
  stn_a_mutant_president_where_have_i_seen_that_before_desc:0 "Фраза була проста, але з нею ніхто не сперечався!"

  stn_the_blue_man_address:0 "Звернення Синього Чоловіка"
  stn_the_blue_man_address_desc:0 "Найкращі звернення — від тих, хто не боїться носити прапор на собі!"

  stn_punching_merc_bad_guys:0 "Лупцювання Найманців-Поганців!"
  stn_punching_merc_bad_guys_desc:0 "Коли армії рушили на Баттлфорд, один репортер спитав у Фріда, чи не боїться він програти війну через силу противника. Він відповів:\n\n§o«Ні, ми переможемо.»§!"

  stn_appease_the_workers_union:0 "Задобрити Профспілку"
  stn_appease_the_workers_union_desc:0 "Народ Дандерна не надто хвилювало, хто в нього президент — нічкін чи навіть черв'як. Головне — щоб зарплата була."

  stn_stampede_stomping:0 "Дипломатія Степу"
  stn_stampede_stomping_desc:0 "Родина Зграєвиків — великі союзники американадайського народу. Саме тому ми маємо віддячити їм за все, що вони для нас зробили."

  stn_state_of_the_union:0 "Стан Спілки"
  stn_state_of_the_union_desc:0 "«Мої співвітчизники-американадайці... все ПРЯМ ДИКЕ!» — Дженерал Фрідом"

  stn_no_more_prisons:0 "Жодних Більше В'язниць"
  stn_no_more_prisons_desc:0 "Супермутанти Стуна вже надивилися світу з-за ґрат. Відтепер кожну в'язницю буде знищено, а злочинців каратимуть із максимальною жорстокістю."

  stn_a_plasma_loving_mutant:0 "Мутант, Що Любить Ракети"
  stn_a_plasma_loving_mutant_desc:0 "Хто ж не любить гарну ракету? А коли у тебе досить сили, щоб її носити — це взагалі казка. Коли Тобогган приніс Фріду креслення, куплені в Міддлмарку, той був у захваті: доктор, як завжди, знає, що пацієнтам треба."

  stn_freedom_generally:0 "Свобода, Загалом"
  stn_freedom_generally_desc:0 "...Так сказав Дженерал Фрідом, віддаючи честь перед своїм народом. Його слова були непохитні, а обіцянки — щирі. Назавжди народ Електорату дивитиметься на свого президента з усмішкою."

  ### фокуси Беї

  stn_beya_the_first:0 "§RБея Перша§!"
  stn_beya_the_first_desc:0 "Колись її ім’я наводило жах. Світ здивувався, побачивши її 'одомашненою' таким дурнем, як П’єр. Але коли правда розкрилась — усе стало ясно. І тепер люди знову слухають її колючі слова."

  stn_gather_the_warriors:0 "Зібрати Воїнів"
  stn_gather_the_warriors_desc:0 "Багато зі старих воїнів Стуна досі носять шрами від Кривого Ікла. Вони — трофеї та нагадування. Молодь бере старі клинки й шрамує себе на їхню честь."

  stn_capturing_pariah_hawkmoon:0 "Схопити Парію Гокмун"
  stn_capturing_pariah_hawkmoon_desc:0 "Парія — лихо для всього живого. Але ми не пішли б на таке без причини. Її викрадення й принесення у жертву Леші — єдиний шанс знову дістатися до серця Змії."

  stn_dealing_with_faeries:0 "Розібратись з Феями"
  stn_dealing_with_faeries_desc:0 "Феї — не чудовиська, але нестабільні й небезпечні. Без Плезантдейла їх уже не втримати. Ми не можемо дозволити їм ширитися далі на північ."

  stn_silence_the_nobility:0 "Примусити Дворян до Мовчання"
  stn_silence_the_nobility_desc:0 "Дворяни Плезантдейла можуть бути менш 'екзотично схильними', ніж ті зі Стуна — але їхнє виродження таке ж. Тих, хто не визнає своє падіння, згодовують Леші."

  stn_umbravore_killers:0 "Убивці Умбраворів"
  stn_umbravore_killers_desc:0 "Умбравори здавна були серйозним викликом для кожного воїна Стоун. Їхні довгі щупальця, вкриті зубами, дивне маскування й масивні розміри, а також здатність полювати зграями створюють загрозливу силу. Хоча їх рідко бачать за межами Брами, традицією є те, що група мисливців вирушає на пошуки цих істот, щоб зменшити їхню кількість і довести власну відвагу."

  stn_the_tribes_knowledge:0 "Звідки Ми Походимо"
  stn_the_tribes_knowledge_desc:0 "Інтеграція племінників до Стоун пройшла не без тертя. Сам факт, що нас допустили до уряду, принизив нас — і ми більше не повторимо цієї помилки. Ми маємо повернутись до старих обрядів."

  stn_the_borders_must_be_guarded:0 "Кордони Потрібно Охороняти"
  stn_the_borders_must_be_guarded_desc:0 "Без безглуздого прапора Електорату, що раніше слугував щитом від рейдерів і колоністів, ми покинуті самі на себе. Ми розмістимо найдикіших з наших родичів на кордонах, збудуємо частокіл і залишимо голови на кілках. Якщо потрібно — ми скинемо маску і покажемо світу, якими чудовиськами ми можемо бути."

  stn_learning_leshy_ancient_knowledge:0 "Вивчення Давнього Знання Леші"
  stn_learning_leshy_ancient_knowledge_desc:0 "Спогади про давні часи такі ж спотворені, як і цінні. Гулі божеволіють із віком, мутанти надто тупі — їхні байки варто ігнорувати. Проте Леша зберегла достатньо знань про ці землі, щоб надати нам перевагу над іншими."

  stn_by_moonlight_we_dine:0 "Ми Вечеряємо Під Місяцем"
  stn_by_moonlight_we_dine_desc:0 "Щоночі ми збираємось на бенкет, щоб згадати, хто наша родина — а хто ні. Є певне, хоч і огидне, задоволення в поїданні плоті свого виду, і ми насолоджуємось цим. Як казала одна мудра жінка...\n\n“З’їж багатія.”"

  stn_consult_leshy:0 "Порадитись із Лешею"
  stn_consult_leshy_desc:0 "Леша — істота, не схожа ні на що інше. Її ікла — це списи, хвіст — блискавка. Обидва вбили сотні. \nЯкщо ми знову хочемо укласти угоду, слід сподіватися, що їй сподобається наша жертва."

  stn_hardening_scales:0 "Зміцнити Лешині Луски"
  stn_hardening_scales_desc:0 "Хоч її луска служила вірно протягом багатьох років, вона не є непорушною. Деякі ділянки втратили природну красу — потріскані, зламані. Нанісши захисне покриття по всій її формі, ми можемо зробити її лють безмежною."

  stn_sharpening_her_fangs:0 "Загострити Її Ікла"
  stn_sharpening_her_fangs_desc:0 "Мало яке лезо зрівняється з іклами Леші за гостротою і міцністю. Та те, що не є досконалістю, завжди можна вдосконалити — ікла можуть стати ще смертоноснішими. Навіть машини зі сталі стануть м’якими, як плоть, у її пащі."

  stn_the_western_blightwood:0 "Ще Одна Жертва Долі"
  stn_the_western_blightwood_desc:0 "‘Сміючийся Джек.’ На відміну від Беї, він утратив і розум, і тіло в Багряній Завірюсі. Тепер це спотворене чудовисько, що блукає полями, кероване залишками інстинктів — благанням про допомогу, яке він не в силі вимовити. Ми повинні звільнити його від страждань... Заради нас самих."

  stn_the_eastern_blightwood:0 "Ще Одна Жертва Долі"
  stn_the_eastern_blightwood_desc:0 "‘Сміючийся Джек.’ На відміну від Беї, він утратив і розум, і тіло в Багряній Завірюсі. Тепер це спотворене чудовисько, що блукає полями, кероване залишками інстинктів — благанням про допомогу, яке він не в силі вимовити. Ми повинні звільнити його від страждань... Заради нас самих."

  stn_into_the_gate:0 "Знову До Брами"
  stn_into_the_gate_desc:0 "Ось і все. Саме тут вона творить свої темні відьмицькі чари. Назад вороття нема..."

  stn_confront_destiny:0 "Зустріч Із Долею"
  stn_confront_destiny_desc:0 "§R“Заходь, любчику,”§! — колись казала Доля. §R“Я покажу тобі твою Долю.”§!"

  stn_the_working_class:0 "Робітничий Клас Плезентдейлу"
  stn_the_working_class_desc:0 "Цікаво, але мешканці Плезентдейлу охоче співпрацюють з нами. Поки ми не їмо їх — вони продовжуватимуть працювати й допомагати в наших починаннях."

  stn_the_pantries_of_pleasantdale:0 "Комори Плезентдейлу"
  stn_the_pantries_of_pleasantdale_desc:0 "Комори Плезентдейлу більше наповнені тістечками й дурницями, ніж чимось корисним. Утім... Вони мають інструменти, які ми можемо використати."

  stn_the_cabals_blessings:0 "Благословення Кабалу"
  stn_the_cabals_blessings_desc:0 "Спектральний Кабал у захваті від нашого захоплення. “§gВони§! в захваті від твоєї роботи,” — сказав хтось, — “§gВони§! хочуть зустрітись з тобою одного дня.”\n\nЩо б це не означало."

  stn_leshy_drugs:0 "Змішати Отруту Леші з Червоним Папоротем™ від Кабалу"
  stn_leshy_drugs_desc:0 "Червоний Папороть від Кабалу чудово поєднується з отрутою, яку виділяють ікла Леші. Цей розчин надає споживачеві спектральної енергії, даруючи безмежну свободу розуму й тіла. Достатньо отрути, щоб не вбити — а відродити."

  stn_what_we_learned_from_the_pretty_dresses:0 "Чого Ми Навчились Від Гарних Суконь"
  stn_what_we_learned_from_the_pretty_dresses_desc:0 "Гарні сукні та блискучий макіяж Плезентдейлу захопили Бею. Хоч вона й ніколи їх не носила, їй подобалось уявляти себе шляхетною жінкою свого племені — жінкою з класом, вище за своїх родичів, що завжди були в крові. Але врешті вона знала, що це лише марні думки. Адже вона — племінниця до мозку кісток, і саме в силі своєї родини вона вистояла попри все."

  stn_she_who_stood_in_the_scarlet_blizzard:0 "Та, Що Стояла в Багряній Завірюсі"
  stn_she_who_stood_in_the_scarlet_blizzard_desc:0 "Вона не була героїнею. Вона вбила сотні й ласувала людською плоттю, наче це були солодощі. Та попри особисті жахіття, вона зупинила безумство, що лилося з лабораторій МАНІФЕСТ у руїнах Пасу. Багряна Завірюха більше не блукатиме околицями, жахіття поза межами людського розуміння більше не виринатимуть з кривавого туману. Нарешті північ знайде тишу й спокій."

  #tooltips / flags

  stn_freedom_rebellion_flag:0 "Ми залишимось §YСуспільством Кульбаби§!, §Rготуючись, поки Генерал Фрідом мобілізується у Вакаві!§!"
  stn_against_all_evil_tt:0 "Ми станемо §YГенералом Фрідом§!, §Mочоливши втечу тіней до славного майбутнього!§!"
  stn_negotiations_tt:0 "§YА може, всі ми просто порозуміємось?...§!"
  stn_nightkin_radio:0 "Трансляція Генерала Фріда розпочалась!"
  electoral_collapse:0 "§RЕлекторат розпався!§!"
  stn_pierre_solomon_dead_flag:0 "П'єр Соломон помер!"
  stn_cannibalism_bad_tt:0 "§GВідкриває ланцюжки фокусів §YСкорочення Канібалізму§! та §YЩо Зробило Стаун§!!§!"
  stn_cannibalism_good_tt:0 "§GВідкриває ланцюжки фокусів §YПередача Стегенця§! та §YЩо Зробило Стаун§!!§!"
  stn_outposts_tt:0 "§G2 рівня§! §YЗастав§! буде збудовано на нашому кордоні з §Y[STA.GetNameWithFlag]§!!"
  stn_oob_tt_tribal:0 "§GДві одиниці§! важких племінних воїнів Стаун з’являться в §YДак Лейк§!!"
  stn_lettermen_reflection:0 "Ми повинні пам'ятати, ким ми є!"
  stn_loud_route_flag:0 "Ми — лицарі. Ми не знаємо страху."
  stn_quiet_route_flag:0 "Ми на землях ворога. Треба йти обережно."
  stn_pariah_joins:0 "§YПарія Гокмун§! стає доступною як §GКомандир§!!"
  stn_hope_joins:0 "§YНадія§! стає доступною як §GКомандир§!!"
  stn_pierre_wins_out_flag:0 "П'єр переміг своїх критиків!"
  freedom_revolter:0 "§RПочався Похід Фріда!§!"
  stn_freedom_radio_begins_flag:0 "Трансляція Радіо Фріда розпочалась!"
  stn_nightkin_mental_care:0 "Ми надали належну медичну допомогу тіням!"
  stn_beya_warriors_contacted_flag:0 "Ми зв’язалися з племенами!"
  stn_beya_encounter_flag:0 "Ми почали більше часу проводити без П'єра!"
  stn_escaped_flag:0 "Ми втекли з палацу!"
  stn_blade_carved:0 "Виготовлено зброю, що відповідає викривленій душі П'єра."
  stn_nightkin_mental_tooltip:0 "Ми почнемо §Gнадавати належну медичну допомогу§! §YNайткінам§! у психіатричній лікарні Бірч Гіллс."
  STN_leshy_unleashed_tt:0 "§GLеші§! буде битися на нашому боці… поки що."

  ##decisions
  stn_freedom_rebellion:0 "Початок Повстання Фріда!"
  stn_freedom_rebellion_desc:0 "Генерал Фрідом готує щось велике. Нам потрібно зупинити його, перш ніж він завдасть ще більшої шкоди нашій нації!"
  stn_freedoms_ride_cat:0 "Похід Фріда"
  stn_freedoms_ride_cat_desc:0 "             "
  stn_party_decision_cat:0 "Велике Весілля"
  stn_party_decision_cat_desc:0 "             "
  stn_the_banquet:0 "Ніч, Що Запам'ятається"
  stn_the_banquet_desc:0 "Весілля між П'єром Соломоном із Суспільства Кульбаби та Беєю з Племен Стаун має принести "нову епоху процвітання й величі" для Електорату. Звісно, якщо все піде за планом…"

  stn_the_coup:0 "Змова Проти Кульбаб"
  stn_the_coup_desc:0 "І Листоноші, і Старі Племена Стаун ненавидять П'єра Соломона, мабуть, більше за все на світі. Якби випала нагода, й вчасна мить — вони б могли чимало отримати, захопивши владу…"
  stn_in_memoriam:0 "На Пам'ять Про Тих, Хто Був До Нас"
  stn_in_memoriam_desc:0 "Ми були не завжди жалюгідними вигнанцями. Колись наша броня сяяла, мов місяць, і ми мали таку відвагу, що нас вважали богонародженими."
  stn_gathering_soldiers:0 "Зібрати Заблукалих та Загублених"
  stn_gathering_soldiers_desc:0 "Багато з лицарів минулого тепер блукають Електоратом, вигнані зі своїх домівок та застряглі в чужій владі. Слабкі люди сприйняли б це як кінець — але горді сини Манітоби не повинні падати духом! Ми оголосимо указ — запрошення до Всього Світлого у наших межах. Лицарі знову сядуть на коней — крізь пекло й бурі."
  stn_finding_daniel:0 "Що Сталося з Даніелем з Вадіни?"
  stn_finding_daniel_desc:0 "Колись Даніель з Вадіни був безстрашним велетнем, що протистояв злу на шляху лорда Йорктона. Тепер його доля — загадка, хоча мало хто вірить у його смерть. Якщо він справді вижив усі ці роки, повернення його до лав знову надихне сумнівних і нерішучих.\n\nМи розпочнемо ретельне розслідування — перевіримо кожну чутку та перевернемо кожен камінь, щоб дізнатись правду про Даніеля."
  stn_quiet_way:0 "План Втечі: Тихо"
  stn_quiet_way_tooltip:0 "Відкриває набір рішень для тихого визволення Даніеля з Пенітенціарію Аллан Гіллс."
  stn_loud_way:0 "План Втечі: Штурм"
  stn_loud_way_tooltip:0 "Відкриває набір рішень для штурму Аллан Гіллс заради пошуку Даніеля."
  stn_ied:0 "СВП"
  stn_ied_desc:0 ""Саморобний Вибуховий Пристрій" — не те, що я зазвичай назвав би божественним, але в таких екстремальних випадках треба шукати провидіння в усьому, що маємо. Життя сера Даніеля висить на волосині. Він зробив би те саме для будь-кого з нас." — сер Ґріффін"
  stn_ied_acquired_flag:0 "СВП отримано"
  stn_acquire_uniforms:0 "Отримати Маскування"
  stn_acquire_uniforms_desc:0 ""Сволота з Дандурна носять спотворені версії нашої броні — як мисливець, що носить шкуру свого здобичі. Хоча вони й переробили її під себе, цю броню викували з манітобської сталі, і вона впізнає своїх справжніх господарів і досі." — сер Ґріффін"
  stn_disguises:0 "Маскування Отримано"
  stn_getaway_vehicle:0 "Транспорт для Втечі"
  stn_getaway_vehicle_desc:0 ""Кримінальні банди в Дандурні мають... свої особливості. Переобладнані карети, навіть автомобілі — вони мчать, мов темні вершники ночі. Якщо вдасться дістати один із них — втеча з в'язниці буде гарантована." — Сер Ґріффін"
  stn_getaway_vehicle:0 "Транспорт для Втечі Отримано"
  stn_repair_armor_sharpen_blades:0 "Зміцнити Броню та Наточити Клинки"
  stn_blades_sharpened:0 "Наші Клинки Наточені"
  stn_insider_information:0 "Людина Всередині"
  stn_insider_information_desc:0 "Контакт усередині в'язниці буде надзвичайно важливим. Друзі Йорктона є по всіх цих землях... Серед них точно знайдеться один, кого можна переконати допомогти."
  stn_insider_info_flag:0 "Отримано Людину Всередині"
  stn_breaking_into_allan_hills:0 "Втеча з В'язниці"
  stn_breaking_into_allan_hills_desc:0 "Алан Гіллс впаде перед обраними Божими, а грішники, що схилилися перед тиранами, зустрінуть свій кінець від меча сера Ґріффіна."
  stn_the_party:0 "Ніч, Що Запам’ятається: Баллада про Сера Даніеля"
  stn_the_party_desc:0 ""
  stn_reach_out_to_yorkton:0 "Посланці Йорктона, Благословенні Христом"

  stn_memories_of_the_blizzard:0 "Спогади про Бурю"
  stn_memories_of_the_blizzard_desc:0 "Те, що сталося там, змінило мене назавжди. Закриваючи очі, я досі бачу криваво-червоний туман навколо себе, наче нескінченну зливу безумства, що падає на мене згори."

  stn_a_day_in_the_stoon_gardens:0 "Розваги, Наскільки Це Можливо"
  stn_a_day_in_the_stoon_gardens_desc:0 "Сумування в садах стало моїм новим дозвіллям. П'єр тримає мене на короткому повідку, хоч навіть він розуміє, що я маю свої межі — і тому я проводжу час якомога далі від нього."

  stn_send_a_maiden_to_the_warriors:0 "Послати Дівчину до Племен"
  stn_send_a_maiden_to_the_warriors_desc:0 "Дехто з дівчат, що служать П’єру, прийшли з мого племені — одні були викрадені й продані, інші прийшли добровільно. Вони слухають мене, як немовля слухає матір, тож мій план знаходить ґрунт. Я пошлю одну до племен на півночі — до воїнів. Вони стануть моїм власним військом. Без найманців. Без Листоносців."

  stn_carving_a_blade:0 "Вирізати Клинок"
  stn_carving_a_blade_desc:0 "Із кістки звіра я створю клинок — покручений і лезистий — призначений для серця П’єра. Сотню разів я встромлю його, і з кожного порізу я підніму його серце з грудей і з’їм його перед усіма."

  stn_escape:0 "Підготувати Втечу"
  stn_escape_desc:0 "Останній крок вже перед нами — хоча доля мого народу буде збережена, якщо я відійду надовго, я підготую привід і шлях, аби тимчасово залишити палац. Відтак я попряму до лігва Леші — і вона допоможе мені вбити П’єра Соломона."

  stn_cavort_with_leshy:0 "Танцювати з Леші"
  stn_cavort_with_leshy_desc:0 "Щоб скинути з трону голову псевдо-імперії, слід вдатися до незвичних методів панування. І от, ми йдемо в лігво чудовиська."