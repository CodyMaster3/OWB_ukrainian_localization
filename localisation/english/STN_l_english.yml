STN_griffin_desc:0 ""

STN_daniel_name:0 "Даніель із Вадіни"
STN_daniel_desc:0 ""

STN_argo_name:0 "Арґо Белдам"
STN_argo_advisor_desc:0 "Арґо ніколи не хотів бути лицарем. Насильство — не його шлях. Але тиск батьків і суспільства не залишив вибору.\n\nАрґо не хотів вирушати у вигнання. Полишити рідну землю, ніколи не повернутись — це був його найгірший кошмар. Але воля бюрократів була законом, і він покинув Манітобу разом з іншими Леттерменами.\n\nАрґо не хотів бачити смерть своїх побратимів. Вони були останнім зв’язком із його втраченим життям. Але жорстокість Електоралів була безмежною, і він ледве вижив сам.\n\nАрґо Белдам утомився від того, чого хоче світ. Його меч тепер служить лише його власним бажанням, і йому байдуже, хто керує Стоуном — важливо лише, що вони можуть йому запропонувати."

STN_freedom_name:0 "Генерал Фрідом"
STN_freedom_desc:0 ""

STN_Dr_Toboggan_name:0 "Доктор Тобоґґан"
STN_Dr_Toboggan_advisor_desc:0 "Для доктора Тобоґґана, PhD в процесі, шлях до доглядача Психлікарні почався понад сто років тому, коли Собор Щастя зник у ядерному вогні. Коли супермутанти розсіялися, Тобоґґан залишився поруч із більшими угрупуваннями — давав розумні поради та наглядав за тими, хто не міг упоратися з утратою Єдності.\n\nЙого подорож до Стоуна могла закінчитись у Вайомінґу, де його зграя вирішила осісти. Але коли група найткінів рушила на північ у пошуках нового джерела FEV, він пішов із ними, аби стежити. Хоч він давно вже не користується «стелс-боями», їхній вплив на розум його братів — надто глибокий.\n\nПсихіатрична лікарня Бірч-Гіллс мала стати притулком. Там були підручники з психології та міцні стіни. Та коли Денді перетворили його дослідження на кошмар, він змушений ділити свій час між допомогою товаришам і запобіганням їхньому потраплянню під ніж..."

STN_life_name:0 "Лайф Макміллан"
STN_life_advisor_desc:0 "Колись вони були елітним загоном найткінів у Війську Творця — Лайф, Ліберті та Персьют з того часу не розлучалися. Після падіння Єдності вони прикривали один одного в боях проти людей і мутантів. Застрягши в Психлікарні доктора Тобоґґана, слухаючи ті самі радіоканали, що й Генерал Фрідом, саме вони першими перейнялися ідеалами втраченої країни.\n\nЛайф Макміллан був лідером загону, тим, хто тримав усіх разом. Навіть коли інші гинули чи тікали, він вів залишок групи далі, за слідами інших найткінів, що шукали нові джерела FEV все далі на північ.\n\nЧаси в лікарні вплинули на кожного по-різному. Взявши ім’я «Лайф» із рядка радіо, Макміллан тепер уникає боїв. Він вірить, що якщо Майстер дав їм життя, то тепер його обов'язок — вирощувати сильніші форми життя, здатні вижити в пустках, якщо FEV більше недоступний. Дні проводить, виводячи рослини та тварин, адаптованих до нових умов. Доктор Тобоґґан, з якихось причин, не дозволяє йому вирощувати зграю нормалів."

STN_liberty_name:0 "Ліберті Белль"
STN_liberty_advisor_desc:0 "Колись вони були елітним загоном найткінів у Війську Творця — Лайф, Ліберті та Персьют з того часу не розлучалися. Після падіння Єдності вони прикривали один одного в боях проти людей і мутантів. Застрягши в Психлікарні доктора Тобоґґана, слухаючи ті самі радіоканали, що й Генерал Фрідом, саме вони першими перейнялися ідеалами втраченої країни.\n\nДля Белль падіння Творця було особливо болючим. Своє ім’я вона отримала через дивну звичку, набу ту під час блукань Сходом — видавати звук дзвону кожного разу, коли її хтось помічав. Навіть у режимі невидимості. Це виключило її з рейдів, тому вона почала допомагати в тилу: впорядковувала запаси та лагодила спорядження.\n\nЧаси в лікарні вплинули на кожного по-різному. Якщо Лайф і Персьют слухали радіо, то Белль надихнулася старою пропагандистською афішею з зображенням Статуї Свободи — 151-футової зеленої жінки, якій, мабуть, поклонялась стара Америка. Одягнена в подібне вбрання, вона не лише ділиться знаннями логістики, а й поширює культ Зеленої Величної Пані зі Сходу, під якою можуть бути вільними і люди, і мутанти."

STN_pursuit_name:0 "Персьют"
STN_pursuit_advisor_desc:0 "Колись вони були елітним загоном найткінів у Війську Творця — Лайф, Ліберті та Персьют з того часу не розлучалися. Після падіння Єдності вони прикривали один одного в боях проти людей і мутантів. Застрягши в Психлікарні доктора Тобоґґана, слухаючи ті самі радіоканали, що й Генерал Фрідом, саме вони першими перейнялися ідеалами втраченої країни.\n\nЯк звали Персьюта в часи Єдності, знають лише Макміллан і Белль — сам він давно забув. Найнепомітніший член загону, він завжди був природженим мисливцем у пустках. Белль і Макміллан часто віддавали йому свої «стелс-бої», що лише посилило його дивакуватість.\n\nЧаси в лікарні вплинули на кожного по-різному. Ім’я «Персьют» він узяв із рядка радіо — тепер він вірить, що «Щастя» — це ціль, яку треба вистежити і зловити. Де вона — він ще не знає. Але з кожним днем, переконаний, наближається."

