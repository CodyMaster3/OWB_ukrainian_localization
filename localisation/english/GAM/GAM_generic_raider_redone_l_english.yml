l_english:
GAM_cruel_heartland:0 "Жорстоке Серце"
GAM_cruel_heartland_desc:0 "Багато місця витрачається на непотрібні будівлі, як-от будинки, клініки чи навіть щось настільки дурне, як ферма. Спаліть їх усі, це дасть нам місце для розширення."

GAM_territorial_reinforcement:0 "Територіальне укріплення"
GAM_territorial_reinforcement_desc:0 "Нам потрібно утримати рабів всередині та ворожі банди зовні. Для цього ми організували купу рейдерів, щоб допомогти будувати форпости по кордонах. Їх набір — справа проста, бо кожен бандиць, вартий своєї солі, захоче бути першим у дії."

GAM_skulls_on_sticks:0 "Черепи на палицях"
GAM_skulls_on_sticks_desc:0 "Знаєш, ти б подумав, що лякати людей легко. Але ні, треба добре подумати. Замість того, щоб просто вішати випадкові частини тіла на палиці і розкидати грубі послання, наші хлопці з’ясували, що набагато ефективніше ставити відрубану людську голову, що все ще має шкіру."

GAM_terrorise_the_locals:0 "Тероризуємо місцевих"
GAM_terrorise_the_locals_desc:0 "Іноді потрібно вирішувати прості справи. Погрожувати місцевим, спалювати дещо на відстані, кричати на них, стріляючи в повітря — це повинно заспокоїти будь-кого, хто хоче бути героєм. Це також чудово знімає стрес з наших хлопців, поки ми чекаємо на наступний рейд."

GAM_raider_headquarters:0 "Штаб рейдерів"
GAM_raider_headquarters_desc:0 "Нам потрібна величезна фортеця. Щось таке, що змусить ворогів сховатися в кутку! У нас будуть величезні стіни, цілі кімнати для виробництва зброї, багато рабів, щоб зробити її ще більшу і кращу! Це буде чудово."

GAM_territoriality:0 "Територіальні лояльності"
GAM_territoriality_desc:0 "Чим більше здобичі ми даємо нашим військам, тим більше їм подобається цей спосіб життя. Поєднайте це з нагадуванням їм, що зазвичай відбувається з рейдерами, яких ловлять справжні держави, і це змусить їх боротися ще більше, щоб зберегти цей спосіб життя."

GAM_we_never_die:0 "Ми ніколи не помираємо!"
GAM_we_never_die_desc:0 "Ну, я маю на увазі, окрім тих випадків, коли ми помираємо. Але ти знаєш, що я маю на увазі — банда ніколи не помирає. Ми ж постійно грабуємо, розграбовуємо і стріляємо, як це може закінчитися? Ми отримуємо нових хлопців, нових рекрутів, і тому більше здобичі!"

GAM_manifest_destiny:0 "Маніфест долі"
GAM_manifest_destiny_desc:0 "Оглянься навколо, ми оточені ідіотами, і вони такі слабкі! Вони майже нічого не мають, навіть не вміють підняти гвинтівку, чому ми досі боїмося їх? Їхня земля, їхня здобич, їхні міста? Вони повинні бути нашими. І ми зробимо їх нашими, силою."

GAM_incorporate_slavers:0 "Інтеграція работоргівців"
GAM_incorporate_slavers_desc:0 "Так, вони трохи засмучують деяких хлопців, з усіма цими плачами і благаннями. Але раби такі корисні, ми без них ніяк не обійдемося. Можна змусити їх робити майже що завгодно, і це включає в себе змушення їх думати, що якщо вони витримають більше п’яти секунд на передовій, вони будуть вільні..."

GAM_slave_labour:0 "Рабська праця"
GAM_slave_labour_desc:0 "Організувати масовий набір рабів і поставити їх працювати на будівництві? Геній. Добре, деякі з них можуть втратити руку або дві час від часу, але не можна заперечувати, що бордель побудували набагато швидше, ніж зазвичай."

GAM_forced_labour:0 "Примусова праця"
GAM_forced_labour_desc:0 "Треба бути розумним, коли використовуєш рабів. Потрібно штовхати їх так сильно, щоб отримати дуже хороші результати, але не настільки сильно, щоб вбити чи калічити їх. Це вимагає певної майстерності, і з кращим навчанням для наших майстрів рабів, ми зможемо змусити їх працювати під жорстким сонцем на дорогах."

GAM_slave_scientists:0 "Раби-науковці"
GAM_slave_scientists_desc:0 "Слухай, бачи оті великі мізки? Ну так, вони не виглядають дуже, але можливо, просто можливо, вони можуть дати нам кращі стрілялки та інше. Як щодо того, щоб змусити їх працювати на нас? Дивись уважно і побачиш, як швидко вони зроблять вибухівки, коли на них буде спрямована зброя."

GAM_slave_researchers:0 "Раби-дослідники"
GAM_slave_researchers_desc:0 "Доповнення наших науковців «насильно набраними» інженерами повинно змусити їх працювати ще швидше і дати нам ще більше крутих штучок для гри. Уяви собі, ми можемо навіть отримати зброю, яка не вибухає у тебе в обличчя!"

GAM_new_age_weaponry:0 "Яскраві нові іграшки"
GAM_new_age_weaponry_desc:0 "Ось подивіться на цю блискучу зброю. Я поняття не маю, як вона працює, і можливо, вона не виглядає так розкішно, як вогнепальна зброя, але вона пробиває будь-якого ідіота, що думає, що куча металобрухту їх врятує. Хіба це не чудово? Можливо, дамо вченим трохи алкоголю."

GAM_guns_with_legs:0 "Зброя з ногами"
GAM_guns_with_legs_desc:0 "Добре, дивись на цей сміттєвий бак? У нього є зброя і броня. І він не вмирає так легко. Тож як щодо того, щоб підштовхнути його перед людьми, і коли вони витратять усю боєприпаси, ми їх застрелимо? Я знаю, я знаю, я мав стати тактиком."

GAM_find_the_good_stuff:0 "Знайти хороші штуки"
GAM_find_the_good_stuff_desc:0 "Я не знаю, що це за штуки, але інженери постійно кажуть, що нам потрібно їх для створення більше сміттєвих баків, тож... мабуть, ми це теж візьмемо? Ніколи цього не робили раніше, але, з іншого боку, ми ніколи не мали мобільних сміттєвих компакторів, що стріляють по людях із СМГ."

GAM_shitty_robots:0 "Халтурні роботи"
GAM_shitty_robots_desc:0 "Бачиш усе це дороге обладнання? Навіщо нам це, воно лише уповільнює виробництво. Я не знаю, що таке гіроскоп, чи що означає «запобігання катастрофічним ядерним подіям», але я впевнений, що ми можемо без цього обійтися. Більше зброї!"

GAM_encourage_slavers:0 "Заохочення работоргівців"
GAM_encourage_slavers_desc:0 "Можливо, це трохи зайшло занадто далеко для деяких, але більше работоргівців і більше капіталу означає значно більше рабів для нашої армії. А це завжди добре, звісно, і ми завжди можемо використовувати їх для інших справ пізніше."

GAM_establish_the_slave_trade:0 "Заснування работоргівлі"
GAM_establish_the_slave_trade_desc:0 "Нам треба почати працювати місцево, більше ніяких зовнішніх ресурсів, більше ніяких поганих угод, ми відкриємо свою власну компанію з работоргівлі! Без квартальних звітів і нудних зустрічей, і з набагато більше хімікатів!"

GAM_drug_dealers:0 "Продаж хімікатів"
GAM_drug_dealers_desc:0 "Хімікати — це ідеальна річ для будь-якої ситуації. Просто уникайте..."

GAM_raid_workshops:0 "Грабіж майстерень"
GAM_raid_workshops_desc:0 "Якщо замість того, щоб будувати речі, ми просто їх вкрадемо? Ми ж рейдери, це має сенс. Це також заощадить нам купу проблем."

GAM_supply_stashes:0 "Заповнення запасів"
GAM_supply_stashes_desc:0 "Нам потрібно більше і більше речей, щоб підтримувати нашу бойову машину, вода для хлопців, металобрухт для фабрик, вперед! Постійно думай про той блискучий новий БТР, і працюватимеш ще старанніше."

GAM_turn_the_lights_on:0 "Жорстоке копання в генератор"
GAM_turn_the_lights_on_desc:0 "Я абсолютно не розумію, чому інженери постійно кажуть, що нам треба щось копати. Можливо, їм потрібен належний догляд, але вони постійно говорять про «ударне обслуговування». Ну добре, тоді просто копай, але не підходь близько після цього."

GAM_terminals_for_all:0 "Ремонт терміналів"
GAM_terminals_for_all_desc:0 "Здається, термінали справді дозволять нашим яйцеголовим записувати інформацію легше і пришвидшать їх дослідження. Тому я даю їм термінали. Стільки, що можна заповнити цілу кімнату. Я просто хочу нову зброю."

GAM_raider_computer_logs:0 "Ведення журналів"
GAM_raider_computer_logs_desc:0 "Ведення журналів наших попередніх рейдів і насправді їх читання, як на зміну, дозволить нам побачити, де сталася велика помилка. Може, кидати динаміт під опорні балки не було найкращою ідеєю, але наступного разу ми точно будемо це знати. Сподіваюся."

GAM_taking_the_best:0 "Беремо найкраще"
GAM_taking_the_best_desc:0 "Дуже просунуті штуки тут, P-65 персональний комп’ютер, топові характеристики, ти, може, міг би врятувати центральний процесор і квантовий замок... чому ти так на мене дивишся? Повернись до роботи, дурнику, нам треба забрати їх до яйцеголових!"

GAM_industrial_interest:0 "Крадіжка інструментів"
GAM_industrial_interest_desc:0 "Здається, деякі з тих рабів насправді щось знали. Такі речі, як місцезнаходження діючих заводів, точки входу і точний момент, коли всі будуть у одній кімнаті, щоб можна було кинути гранату. Це звучить як план."

GAM_hideout_expansion:0 "Вкрадені плани"
GAM_hideout_expansion_desc:0 "Здається, ми пропустили деякі речі в минулому рейді. Такі, як… цілі купи планів і технічних документів. Не питай мене, вони тоді тільки про інструменти говорили. В будь-якому випадку, давай повернемося."

GAM_slaver_settlement:0 "Рабовласницьке поселення"
GAM_slaver_settlement_desc:0 "Може, нам слід дати нашим рабам справжні будівлі. Це точно покращить мораль і звільнить весь простір, який займають ті розбиті табори."

GAM_a_weapon_to_surpass_the_other_gang:0 "Важка металева людина"
GAM_a_weapon_to_surpass_the_other_gang_desc:0 "Відтоді, як один із хлопців побачив солдата братства, який бігає і зовсім не переживає, що його стріляють, він постійно нав’язує науковцям свої запитання. Вони пішли скаржитися іншим рейдерам, і коли їм розповіли, чому він їх турбує, всі інші приєдналися до розваги. Значить, тепер у нас є залізяки?"

GAM_convert_metal_armour:0 "Латані запаси"
GAM_convert_metal_armour_desc:0 "Це, може, й не бойова броня, але хоча б ставить кілька сантиметрів броні між м’яким тілом і дуже неприємною кулею, що летить прямо в тебе. Тож припини скаржитися і вдягни її, вона скоро перестане бути такою важкою, обіцяю."

GAM_power_armor_familiarity:0 "Улюблені іграшки всіх"
GAM_power_armor_familiarity_desc:0 "Чому б нікому не захотіти таку? Вони чудові! Можеш дозволити гранатам вибухати прямо перед тобою і не переживати, а безцінний вигляд на обличчях тих поселенців, коли вони побачили рейдерів у бойовій броні, був вартий того!"

GAM_chop_shop_shimmy:0 "Шлях на ломбарді"
GAM_chop_shop_shimmy_desc:0 "У нас є купа транспорту, що їздить навколо, але нічого стандартизованого. Вони здебільшого просто поламані шматки металу, і їх не варто навіть дивитися. Але ми могли б просто побити водіїв і інженерів, яких зустрінемо, поки вони не дадуть нам щось, з чого ми зможемо щось зробити!"

GAM_gear_head_slaves:0 "Механіки"
GAM_gear_head_slaves_desc:0 "Нехай наші раби працюють у майстернях — це набагато краще, ніж витрачати час на спроби полагодити ці металеві купи самостійно. Якщо пощастить, вони пропрацюють більше половини бака пального, перш ніж щось зламається."

GAM_the_magnum_opus:0 "Великий Опус"
GAM_the_magnum_opus_desc:0 "Ось і настав цей момент, хлопці! Ми організуємо масштабний конкурс, щоб знайти великий опус! Це повинно бути важке, велике, страшне, озброєне величезними гарматами! Вся банда у лютому пориві намагається знайти наступну абсолютну машину смерті!"

GAM_prove_yourself:0 "Доведи свою спроможність"
GAM_prove_yourself_desc:0 "Якщо хочеш вести наших хлопців, доведи, що ти цього вартий. Зазвичай це означає, що ти поб’єш когось до смерті його ж рукою, але й тактичні рішення також можуть бути прийнятними, я вважаю."

GAM_brutal_hazing:0 "Жорстоке випробування"
GAM_brutal_hazing_desc:0 "Навіщо тренувати наших солдатів, коли можна їх накачати наркотиками і змусити битися один з одним? Той, хто залишиться живим, напевно, буде досвідченішим за інших."

GAM_recruit_them_young:0 "Залучай молодих"
GAM_recruit_them_young_desc:0 "Це, безумовно, принесе більше солдатів на фронт. Просто треба переконатися, що вони можуть хоч якось підняти гвинтівку, або хоча б націлити її."

GAM_expand_the_garage:0 "Розширення гаража"
GAM_expand_the_garage_desc:0 "Можеш бути впевнений, що як тільки хтось заговорить про розширення гаража, всі хлопці з банди будуть слухати. Хто б не захотів власного ревучого монстра на колесах? Це буде зроблено швидше, ніж день використання прострочених реактивних двигунів."

GAM_kings_of_the_roads:0 "Королі доріг"
GAM_kings_of_the_roads_desc:0 "Ніхто не їздить так швидко і безумно, як ми! Барикади, руїни, ціла бластерна дорога — нам байдуже, ми просто проїдемо по всьому на повній швидкості!"

GAM_custom_rides:0 "Індивідуальні машини"
GAM_custom_rides_desc:0 "Індивідуальні машини, це звучить так круто. Більші двигуни, кращі підвіски, голосніші вихлопи — що завгодно! І коли почнеться бій, це точно проявиться."

GAM_call_in_the_warboys:0 "Збір усіх війнових"
GAM_call_in_the_warboys_desc:0 "Коли ти кличеш війнових, ти дійсно граєш з вогнем. Вони можуть бути найкращими водіями БТРів у пустці, але вони також ламаються швидше, ніж ти встигнеш попросити новий реактивний двигун. Ми можемо використати їх, просто не стоїмо занадто близько до їх машин."

GAM_metal_boxes:0 "Металеві коробки"
GAM_metal_boxes_desc:0 "Коробки! На колесах! Все, що їм потрібно — це купа броні і купа зброї. Протитанкові гвинтівки, вогнемети, гранатомети, кулемети — все, що хочеш, і ми це маємо! Повісь це на люки, постав це в кулеметні установки, давайте розпочнемо!"

GAM_roaring_machines:0 "Ревучі машини"
GAM_roaring_machines_desc:0 "Якщо вона реве, ти можеш бути впевнений, що хлопці її захочуть. Будь-яка заміна двигуна піде, якщо тільки вона зможе піднятися від землі виключно за рахунок прискорення."

GAM_doped_soldiers:0 "Накачані рейдери"
GAM_doped_soldiers_desc:0 "Ми дістали щось під назвою «супер-джет», і хоча ніхто не має уявлення, звідки це, воно робить хлопців божевільними. Просто накачай їх цим і відпускай на ворога, просто почекай трохи після цього, поки почнеться абстиненція, і не звертай уваги на відрізані кінцівки."

GAM_lightning_raids:0 "Молнієві рейди"
GAM_lightning_raids_desc:0 "Ми входимо і виходимо до того, як вони навіть зрозуміють, що сталося. Ось так ми і працюємо, хлопці, швидко і рішуче — забираємо їхні здобичі, рабів, життя!"

GAM_blood_soaked_gender_equality:0 "Гендерна рівність через насильство"
GAM_blood_soaked_gender_equality_desc:0 "Ми тут не особливо розрізняємо. Якщо ти можеш кинути гранату достатньо далеко, щоб це було смішно дивитися, коли вона вибухне, або якщо ти можеш відрубати чиєсь тіло мачете — ти в команді."

GAM_take_what_you_need:0 "Беремо все, що нам потрібно"
GAM_take_what_you_need_desc:0 "Грабіж — це досить проста справа. Ось що складніше, то це вирішити, чи варто лізти на ту патрульну групу PA і як саме це зробити. Але з досвідом у боротьбі з простими цілями, ми можемо покращити наші техніки грабежу."

GAM_business_booms:0 "Бізнес процвітає"
GAM_business_booms_desc:0 "Бізнес процвітає, артилерія квітне і, безумовно, йде кабум! Ніхто не буде скаржитися на те, що на їхній стороні важка артилерія, хіба що коли вона випадково падає їм на голову."

GAM_short_fused_engineers:0 "Короткозапальні інженери"
GAM_short_fused_engineers_desc:0 "Щоб мати перевагу над іншими бандами, потрібно все більше вибухівок. Кожен хлопець у підрозділі має мати свій запас, і для цього знадобиться певний час. Але всі крики і розірвані частини тіла зроблять це вартим."

GAM_an_explosion_in_understanding:0 "Вибух розуміння"
GAM_an_explosion_in_understanding_desc:0 "Так можна було б це назвати, один з хлопців підірвав себе на експериментальних вибухівках, і, здавалося б, це дало деякі ідеї для розумників. Якщо це змусить їх працювати швидше, ми будемо кидати людей на міни."

GAM_starting_the_flow:0 "Розпочати потік"
GAM_starting_the_flow_desc:0 "Не так давно у нас був дефіцит соусу. Усі знають, що соус — це те, що рухає світ, але ми не маємо капіталів, щоб дістати його. Трішки ’розмов’ може розблокувати потік."

GAM_paying_the_boys:0 "Платити хлопцям"
GAM_paying_the_boys_desc:0 "Банда починає поводитися дещо агресивно. Їм не подобається, як йдуть справи; занадто багато стрілянини, не вистачає рок-н-ролу. Якщо ми дамо їм невеликий відкат після хорошої роботи, це має змастити механізми."

GAM_beer_bonuses:0 "Сильний напій"
GAM_beer_bonuses_desc:0 "Ми трохи згаяли на рахунках. Це не дуже влаштовує хлопців, але є рішення, босе. Якщо ми дамо їм найпідешовше пиво на цьому боці континенту, вони навіть не помітять, що гаманець трохи порожній!"

GAM_unrefusable_deal:0 "Угода, від якої неможливо відмовитися"
GAM_unrefusable_deal_desc:0 "Наші доброзичливі друзі трохи... економно ставляться до своїх ’пожертв’. Думаю, якщо ми пригостимо їх гарною вечерею, ми зможемо запропонувати їм угоду, яка допоможе і їм, і нам... але більше нам."

GAM_victory_hits:0 "Потрібно святкувати"
GAM_victory_hits_desc:0 "Хороша робота – це хороша робота. Іноді варто підняти настрій хорошим гашишем і відсвяткувати на купі трупів."

GAM_controlling_routes:0 "Контроль за торгівлею"
GAM_controlling_routes_desc:0 "Невелика домовленість для того, щоб підпільний світ став частиною нашого світу, може нам дуже допомогти. Великі шишки називають це «горизонтальною інтеграцією». Єдине горизонтальне — це будуть люди, які не співпрацюють."

GAM_art_of_sack:0 "Мистецтво грабежу"
GAM_art_of_sack_desc:0 "Незважаючи на грабежі, руйнування і загальний неприємний та буйний характер, захоплення хорошого містечка — це мистецтво. Ми — Пікассо наркотиків і капіталів. Ось трохи бризку тут, лінія там, страта в лівому кутку. Якщо наша ’наполеглива експедиція’ не спрацює, принаймні ми будемо художниками!"

GAM_kingpins:0 "Головні боссики"
GAM_kingpins_desc:0 "У великих книгах королі та королеви не завжди були добрими людьми. Іноді нам потрібно застосовувати деякі більш... неприємні методи для співпраці, але принаймні ми маємо на увазі добробут банди. А банда — це все, що має значення."