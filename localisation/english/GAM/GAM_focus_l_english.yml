l_english:
GAM_gator_gang:0 "Виникнення Банди Алігаторів"
GAM_gator_gang_desc:0 "Колись давно Александрія була шанованим містом. Не таким великим, щоб потрапити під ядерний удар Великої війни, але й не таким малим, щоб після цього розпастися. Однак те, чого не зробив ядерний вибух, зробив ураган, що зруйнував місто незабаром після падіння бомб. Коли Банди Алігатори прийшли в Александрії, це було вже руїною, тінню колишнього міста. Потрібно було чимало часу, щоб відновити його, і нашим предкам довелося звертатися за допомогою."
   
GAM_enter_maw:0 "Входження в пащу джунглів"
GAM_enter_maw_desc:0 "З часом люди в Александрії поступово віддалялися від своїх початкових причин оселитися тут. Вулиці ставали небезпечними вночі, а дика молодь бігала без жодних уявлень про безпеку своїх сусідів. У місті, яке було засноване на злочинах, не минуло багато часу, як все почало руйнуватися. Ось тоді і з’явилася банда Гаторів, і все пішло ще гірше."
   
GAM_fatty_fatty_no_parents:0 "Дівчина-сирота"
GAM_fatty_fatty_no_parents_desc:0 "Після того, як старий племінний лідер Клав потонув в бруді на задньому дворі, був період, коли в Гаторів не було організованого керівництва. Вони не знали, чи є вони бандитами в синдикаті, чи племенами в клані, чи щось між цими двома. Із цієї невизначеності вийшла Собек, одна з наймолодших і найжорстокіших жінок в нашій історії, і, без сумніву, найгірша особа, з якою ви зустрінетеся цього боку Міссісіпі."
   
GAM_across_the_river:0 "Хлопці через річку"
GAM_across_the_river_desc:0 "Досить очевидно, куди віє вітер, якщо ви готові озирнутися. У Техасі ситуація досягла кипіння, і важкоозброєні братчики, що керують в Далласі, більше не закривають очі на нашу чудову свободу через болота. Що ж, давайте хоча б спробуємо відтягнути їх за допомогою найму найманців з Орлеану, щоб ті віддали свої життя за швидкі гроші."
   
GAM_left1:0 "Неприємне повернення додому"
GAM_left1_desc:0 "Ну ось, схоже, настав той момент, якого Собек чекала досить довго. Патруль Лафайєт прямує до боліт Александрії, і ой, ми покажемо їм, що трапляється, коли вони приходять до наших боліт. Собек особисто чекає з нетерпінням того моменту, коли витре ту тупу посмішку з лиця керівника патруля Калахана."
   
GAM_left2:0 "Закривавлений значок"
GAM_left2_desc:0 "З сотнями мертвих чоловіків у закривавлених синіх і золотих формах, що розкладені перед нею, Собек оголосила свою гірку дитячу помсту правильною. І що тепер? Ну, це ж купа тіл, з якими треба щось робити. Давайте просто знімемо з них все, що має цінність, і відправимо решту в річку."
   
GAM_right1:0 "Болотяні справи"
GAM_right1_desc:0 "Основна сила Bayou Motors полягає в їх прибережних патрулях, так стверджують. Їх не так багато — Канатна Фабрика досить маленьке поселення, але Мотори можуть дозволити собі найкраще обладнання завдяки грошам від рибальства. Давайте їх налякаємо і відправимо кілька дітей, щоб вони вкрали транспортні засоби прямо під їх носами."
   
GAM_right2:0 "Наша природна середа"
GAM_right2_desc:0 "Зізнаємося, пройшло вже рік-два, як останній алігатор з'явився на публіці. Кожного, хто потрапляє в поле зору, швидко розстрілюють за трофеї, швидше, ніж патрульний встигне застрелити невинного чужинця. На щастя, здається, на узбережжі острова Марш не бракує цих злобних зелених, тож це добре. Давайте розберемося з деякими людьми тут і повернемо виробництво на колишній рівень."
   
GAM_pragmatic:0 "Бути прагматичними"
GAM_pragmatic_desc:0 "Карфаген — перша мета для техаських лицарів, і серед усіх груп, на які, ймовірно, нападуть братчики з нашої маленької любовно-ненависної банди, Карфаген — це група, яка має реальний шанс впоратися з братчиками. Давайте відправимо їм все, що ми можемо."
   
GAM_paris_is_such_a_stupid:0 "\"Паризька\" — це таке дурне ім’я"
GAM_paris_is_such_a_stupid_desc:0 "Місто-Убийця наступне в черзі для нападів братчиків. Знаючи цих боягузів, є цілком реальна ймовірність, що вони вирішать приєднатися до братчиків замість того, щоб боротися, але, можливо, відправивши туди кілька бійців, ми зможемо переконати їх вистояти та вижити. Можливо."
   
GAM_biker_friends:0 "Знаходимо байкерських \"друзів\""
GAM_biker_friends_desc:0 "Ми вже мали чимало сутичок з десперадами з Шревпорта в минулому, до такої міри, що зазвичай вважали їх нашим головним ворогом. Але за останні кілька років після того, як Собек взяла на себе керівництво, вона перенаправила нашу злість на Лафайєт і наш страх перед Далласом. Давайте зробимо все, щоб байкери протрималися трішки довше, ніж ці інші дурні на заході."
   
GAM_mobsters_loan:0 "Взяти позику у мафії"
GAM_mobsters_loan_desc:0 "Ну, здається, ми наступні на черзі для війни за виживання з деградантами-лицарями Техасу. Ці землі — наші, і вони були землями наших батьків до нас. І ми вбили своїх батьків, тому ці землі за правом належать нам. Хіба Техас не достатньо великий для нас усіх?"

GAM_our_turn:0 "Гаразд, тепер наша черга"
GAM_our_turn_desc:0 "Ну ось, це повинно було статися рано чи пізно. Техас марширує з тисячею чоловіків в наші болотисті домівки. Собек розлючена, але ми майже впевнені, що навіть вона трохи боїться, що станеться, якщо вони виграють. Заради босса давайте дамо техасцям бій, який вони запам'ятають!"
   
GAM_tired_of_texas:0 "Всім набрид Техас"
GAM_tired_of_texas_desc:0 "Виявляється, є багато людей, які прийшли до нас після того, як Братство пішло на війну. Деякі з найкращих воїнів Карфагена потрапили в наші скромні болота і присягнули на вірність Собек за умови гарної платні та майбутнього відновлення їхніх праведних домівок. Банда Гаторів вже якийсь час приймає всіх можливих союзників, тож із тих, хто хоче приєднатися, це здається очевидним вибором."
   
GAM_streets_reference:0 "Деякі залишки канібалів"
GAM_streets_reference_desc:0 "Хоча канібалізм — це хвороба, яку ми залишили позаду, все ще є кілька традиціоналістських канібалів у Техасі, які сподіваються, що Братство впаде, щоб вони могли повернутися до своїх огидних старих звичок. За нормальних обставин ми б навіть не замислювалися над тим, щоб з ними вести діалог, коли можна просто вбити їх і забрати їхні речі, але це не зовсім нормальні обставини. Давайте приймемо їх і вб’ємо пізніше, якщо ми виживемо."
   
GAM_somekinda_reference_that_i_dont_remember_at_the_moment_this_name_is_so_long_lets_see_how_long_we_can_get_it_to_go_before_i_get_bored_right_about_now_what_a_coincidence_yipee:0 "Ти заважаєш моїм планам!"
GAM_somekinda_reference_that_i_dont_remember_at_the_moment_this_name_is_so_long_lets_see_how_long_we_can_get_it_to_go_before_i_get_bored_right_about_now_what_a_coincidence_yipee_desc:0 "Ми це зробили! Навіть Собек, Потужна, здається, здивована тим, як успішно ми втримали Александрії від великого ворога, але Техас більше не є загрозою. Карфагенські вигнанці повертаються додому, і все здається повертається до нормального. Єдина різниця? Тепер у нас є новий ґрунт для рейдів з набагато меншою кількістю броньованих костюмів з пістолетами, готовими до бою. Чудово!"
   
GAM_intrusive_thoughts:0 "Гей, чому б і ні"
GAM_intrusive_thoughts_desc:0 "Тепер, коли головну проблему з Техасом вирішено, Собек має кілька особистих рахунків, які вона чекає вирішити вже довгий час. Вона вже стала повнолітньою за стандартами свого старого дому, і який кращий спосіб святкувати це, як не завоювання її рідного дому і його спалення до попелу? Кожен любить хорошу промову на домашньому святі біля каміна."
   
GAM_fuck_them_kids:0 "Мені треба спалити сиротинець"
GAM_fuck_them_kids_desc:0 "Після так довгої відсутності в своєму старому домі, Собек повертається! Лафайєт був спокійним і сонним містом протягом тривалого часу, ми певні, що вони не будуть проти, якщо ми приїдемо на південь і трохи розбудимо їх. Врешті-решт, що за поліцейський без бандита для боротьби? А ми — найгірші бандити, так що це має бути веселий час."
   
GAM_FREE_FISH_YAYAYA:0 "Ніколи не відмовлялися від безкоштовної риби"
GAM_FREE_FISH_YAYAYA_desc:0 "Тепер, коли Лафайєт міцно в наших руках, ми могли б піти далі і захопити Канатну Фабрику біля узбережжя. Я маю на увазі, деякі з предків Александрії були піратами, так? У чому проблема, якщо ми трохи підкоримося цьому? Якби у нас був порт, ми могли б перетворити його на свій власний маленький піратський притулок і почати заробляти справжні гроші."
   
GAM_wear_the_crown_pls:0 "Банда боліт"
GAM_wear_the_crown_pls_desc:0 "Ну ось, здається, це остаточно вирішено. Ми відбили Техас, спалили Лафайєт, і захопили Канатну Фабрику для себе. Який чудовий привід, щоб влаштувати вечірку і коронувати Собек Гатор-Царицею!"