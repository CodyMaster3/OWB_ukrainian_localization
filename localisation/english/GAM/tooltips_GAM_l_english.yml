l_english:
GAM_twist_the_knife_tt:0 "§OЯкщо нам якось вдасться повністю перемогти Техас і забрати всю їхню землю, ми випустимо Карфагенців як друзів на їхніх землях і дозволимо їм робити свої справи, поки вони платитимуть нам щорічний дань за привілей повернути їхні домівки. Якщо Техас припинив своє існування іншим способом, не треба йти в розпач; ми просто влаштуємо велике свято і повісимо кількох захоплених людей, щоб відсвяткувати. А якщо інші банди розбійників ще залишаються? Ну, може, ми зможемо запросити їх теж на святкування.§!"

GAM_appeasement:0 "§g"Так точно, босе."§!"

GAM_kick:0 "§gВона дала йому останній потужний удар по обличчю. Не досить, щоб вбити, але з носа чітко пролунала тріщина, і Кларенс продовжив свою булькотливу віку.§!"

GAM_old:0 "§g"О, це жаль. Вибач, хлопець!" Собек підняла пістолет і вистрілила чоловікові прямо між очі. Декілька інших рабів закричали, а молодий хлопець скинув ланцюг і побіг до старого, плачучи.§!"

GAM_greedy_grinner:0 "§gВона відірвала його значок з його сорочки, вирвала капелюх з його голови і забрала окуляри з його обличчя. Вона зламала їх навпіл. Шеф навіть не здригнувся. Потім вона схопила його вуса і потягнула його обличчя до свого рівня.§!"

GAM_crown:0 "§g"Що скажеш на це? Я носитиму цей дурний корон на кількох умовах." Від кімнати пролунали оплески. \n\n"По-перше, Гейтори не є плем’ям. Ми — банда. Засвоїти це, хлопці. Зрозуміли?" \nДеякі люди на задніх рядах зробили сумні звуки, але більшість членів банди загукали в підтвердження. \n\n"По-друге, ви повинні називати мене тепер Гейтором-королем." \nУніверсальні крики та свисти піднялися з натовпу. Це чудово підходило під одну дешеву легенду, що ходила по Олександрії вже століття, але якщо це покладе край цій легенді, то це варто було того.§!"