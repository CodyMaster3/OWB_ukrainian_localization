l_english:
nf_gam.1.t:0 "З гарматами, палаючими"
nf_gam.1.d:0 "\"Ви обіцяли нам свою допомогу, якщо ми її потребуємо! Ми прислали вам їжу, коли ви були на межі смерті, і ви пообіцяли, що віддадите нам! Зважаючи на те, що Техас дивиться на схід, ви справді вважаєте, що зараз час—\"\nСобек почала нудьгувати від похмурого посла. \"Так, так. 'Бо ви всі надто слабкі, щоб встати й боротися, ми знаємо.\"\nҐул виглядав так, ніби його вдарили. \"Я живу з часів Америки! Я бачив, як мою дружину та дітей закололи перед моїми очима двісті років тому! Ти справді думаєш, що я прожив стільки часу тільки для того, щоб мене вчила дитина?\"\nСобек засміялася. Потім вона вибухнула довгим, гучним сміхом. Потім вона витягнула пістолет з холстера на кимоно й застрелила ґула на місці. Він упав на брудну землю будівлі ратуші Александрії з ганебним звуком."
nf_gam.1.a:0 "\"Гей, Дарен, прибери це.\""

nf_gam_events_continued.1.t:0 "З гарматами, палаючими, Продовження"
nf_gam_events_continued.1.d:0 "Дарен Картер, головний прибиральник боса, приніс моп і мішок для тіла, поки решта лідерів банд сміялися і розходилися.\nСобек дивилася на мертве тіло ґула, що лежало на землі, поки його прибирали, потім вона підперла підборіддя правою рукою, коли все було прибрано. Тіара з гаторської шкіри та зубів почала відчуватися дивно, тому вона зняла її та кинула на підлогу біля того місця, де Дарен прибирає. \"Сильно втомилася носити цю чортову штуку,\" поскаржилася вона. Потім вона витягнула ноги, застогнала на мить і стрибнула з її тимчасового трону.\n\"Треба пакувати, бос?\"\n\"Так, це було б добре. Піду на свіжу повітря. Може, когось уб'ю.\"\n\"Хто на розпиляння сьогодні?\"\n\"Ех, я більше не люблю Кларенса. Останнім часом він дуже підозрілий.\"\nДарен кивнув. \"Так, я бачив його за межами міста в якихось дивних місцях. Я був у Начиті вчора, щоб забрати ліки для моєї матері, і він там розмовляв з доктором. Не бачив, про що вони говорили, але вона дала йому таблетки для чогось.\"\nСобек посміхнулася на мить. \"Ну, закінчуй і йди зі мною. Ми все з'ясуємо.\"\nДарен задумався, потім знизав плечима. \"Звучить як веселий час, бос.\" Він закінчив прибирання, і пара вийшла з ратуші, розмовляючи про те, що мало вони знали про своє походження. Тіара з гаторської шкіри лежала на порожній підлозі."
nf_gam_events_continued.1.a:0 "\"Ми побили канібалів з Техасу.\""
nf_gam_events_continued.1.b:0 "\"Ми спочатку були гангом з Нового Орлеана.\""
nf_gam_events_continued.1.c:0 "\"Більшість наших прадідів були піратами.\""

nf_gam.2.t:0 "Серед бур'янів"
nf_gam.2.d:0 "Собек ще раз дала Кларенсу потужний удар по підборіддю, і він випустив пронизливий крик. \"Ну, скажи, що це за таблетки, а?\"\nМіж стогонами і сльозами Кларенс намагався говорити. \"Я... я ж сказав вам—ах... я сказав, що це лише... *сопе* лише знеболювальні для Томаса... я...\" Кларенс згорнувся в позу ембріона в грязі і плакав, витираючи свою забруднену обличчя.\n\"О, ой-ой,\" дражнила його Собек. Вона сіла на його скручене тіло. \"Ти маєш ці таблетки при собі чи ні?\"\n\"Ні, я—\" він кашлянув і виплюнув кров. \"Томас їх має. Він... він біля старої церкви, думаю... Будь ласка...\"\n\"Ну, не зможемо перевірити це твердження. Вибач, хлопче!\" Собек притиснула пістолет до потилиці Кларенса. Він знову закричав і благав про милосердя. Після хвилини терплячого чекання, Собек натиснула на спуск. Пролунав клацання, і Собек голосно засміялася. \"Здається, гатор дозволить тобі жити цього разу, Кларенс. Розвеселися, це твій щасливий день!\" Вона встала і нахилилася над Кларенсом."
nf_gam.2.a:0 "§gПісля хвилини плачу Кларенс розкрив своє обличчя і поглянув на Собек.§!"

nf_gam_events_continued.2.t:0 "Серед бур'янів, Продовження"
nf_gam_events_continued.2.d:0 "\"Будь живим, бандите,\" прошепотіла вона. Потім вона повернулася до свого аплодувального глядача. \"Дарен? Є ще інші справи, знаєш?\"\n\"Зрозуміло, бос.\" Він встав і вони пішли від жалюгідного клубка плоті, відомого як Кларенс, який не припиняв верещати і корчитися в грязі. Це було важке завдання — переконати Кларенса залишити своїх друзів без того, щоб він почав оборонятися, але як тільки він опинився в задньому провулку, неймовірно, як простий удар по яйцях може змінити підлітка. \"Ну, що далі, бос?\"\n\"Бос?\" Собек зупинилася і повернулася до Дарена. \"Пам'ятаєш, що я тобі казала про те, щоб не називати мене босом?\"\nДарен нахилив голову і склав руки, чітко просячи прощення. \"Вибач, бос. Знаєш, це важка звичка, щоб позбутися.\"\nСобек плюнула на його черевики. \"Ну, спробуй краще, ідіоте. Мені набридло, що всі поводяться так, ніби я якийсь дарунок від Бога, щоб провести їх через всі їхні проблеми. Я сама і є проблемою.\" Вона подивилася на нього з голови до п'ят. \"Ладно, пробачаю тебе, дурню. Пішли, нам треба перевірити нагляд за рабами до заходу сонця.\" Дарен кивнув з вдячністю і пішов за Собек. Вони розмовляли про те, над чим працюють раби з Лафайєта, поки йшли. Після ще однієї години відносного спокою Кларенс, зрештою, зібрався і похитався додому."
nf_gam_events_continued.2.a:0 "\"Це місце тепер маскується як фортеця.\""
nf_gam_events_continued.2.b:0 "\"Ми можемо потрапити куди завгодно без проблем.\""
nf_gam_events_continued.2.c:0 "\"Ми можемо бути бандитами, але Александрія нас любить.\""

nf_gam.3.t:0 "Дитина в багнюці"
nf_gam.3.d:0 "\"То як робота, Клав?\" Собек підійшла до Теодора «Великого Тедді» Клауса і склала руки на грудях. \"Помітила, що ще немає трупів.\"\nКлав засміявся. \"Ну, день ще не закінчився. Немає гарантії, що трупи не почнуть падати до кінця дня.\" Раби, якими Клав керував, тягли довгий ланцюг до берега з болотистого узбережжя. Човен мандрівника недавно застряг в бур'янах. Мандрівник пішов до Александрії за допомогою, пояснив свою ситуацію і його відразу порізали. Тепер залишалося тільки забрати здобич.\n\"Гей, дивись на це.\" Собек витягла пістолет і вистрілила один раз у повітря, викликавши кілька криків і прокльонів від рабів. Вони зупинилися. \"Гей, слизькі! Я казала вам зупинятися?\" Собек перестала кричати і пішла вниз до рабів. Вона почекала хвилину, щоб хтось щось сказав. Ніхто не відгукнувся. \"Я сказала вам зупинятися?\" Лише низькі погуджування як відповідь. \"Тоді назад до роботи! І за ту затримку, у вас є 5 хвилин, щоб довести свою цінність. Повільніший отримає кулю!\" Раби подивилися один на одного, а потім насправді взялися за справу, тягнучи ланцюг з удвічі більшою силою, ніж раніше."
nf_gam.3.a:0 "§gЧерез кілька хвилин спостереження один старий чоловік не витримав і впав із ряду.§!"

nf_gam_events_continued.3.t:0 "Дитина в багнюці, Продовження"
nf_gam_events_continued.3.d:0 "\"О, це мило. Хочеш приєднатися до свого дідусю?\" Собек підняла пістолет на хлопця. Інший раб — цього разу середнього віку жінка — поклала свій ланцюг і стала між Собек і хлопцем. Вона виглядала наляканою, але її дихання було рівним.\n\"Будь ласка, вбий мене замість хлопця, якщо ти знову хочеш когось вбивати.\" Собек прицілилася пістолетом в голову жінки і тримала його там хвилину. Потім натиснула на спуск, і пролунав ще один клацання. Вона розсміялася, і решта банди на березі також весело посміялися. Лише після того, як жінка зітхнула з явним полегшенням, Собек вдарила її по животу, змушуючи її впасти на коліна. \"Ха, чувак, це було круто. Можеш взяти хвилину на відпочинок, а потім назад до роботи!\" Вона махнула пістолетом у повітрі і пішла назад на берег.\n\"Це було смішно, бос,\" зізнався Клав. \"Можна було б залишити старого. Він не дуже хороший працівник, але його присутність допомагала іншим рабам тримати кращий настрій. Вони будуть сумувати за ним і ненавидіти тебе за це.\"\n\"Ех, він, ймовірно, і так вже був на межі смерті,\" зазначила Собек, знизавши плечима. \"Цей мудак повинен дякувати мені за те, що я прискорила процес. Слідкуй за ними і застрели ту жінку, якщо вона знову створить проблеми. Маю відчуття, що вона вагітна.\" Собек тихо засміялася. \"Вибач. Так було.\"\n\"Зрозуміло, бос.\" Клав повернувся, щоб продовжувати спостерігати за рабами, іноді віддаючи накази, а Собек пішла з Дареном, сміючись, як смішно було тримати Клава поруч, незважаючи на загрозу, яку він становив."
nf_gam_events_continued.3.a:0 "\"Чувак, вона божевільна. Ми її любимо.\""
nf_gam_events_continued.3.b:0 "\"Слуги старого боса не були великими фанатами.\""
nf_gam_events_continued.3.c:0 "\"Вона спочатку поставила нас на місце.\""

nf_gam.4.t:0 "Стовп вогню" #горіння, кільце вогню
nf_gam.4.d:0 "\"Вогонь — це краса,\" пояснила Собек. Начальник патруля Каллахан не мав особливого вибору, як слухати. \"Бачиш, він бере все це красиве, як деревину, папір, одяг і людей і перетворює це все на те саме.\" Вона посміхнулася. \"Перетворює їх усіх на попіл. І у мене є багато проблем, які я хотіла б перетворити на попіл за останні кілька місяців. Багато з них починаються і закінчуються з тобою та твоїм улюбленим патрулем.\" Вона перестала посміхатися. \"Підійди сюди, сука.\"\n\"Дивись, леді, я знаю, що ти нас ненавидиш і все таке, але—\"\n\"Замовкни, суко.\" Собек дала начальнику патруля удар в живіт, і він різко видихнув і нахилився вперед, задихаючись. Його руки були зв'язані, як і всі інші лідери патрулів, тому він не міг нічого зробити, окрім як постійно кашляти. \"Бачиш цей сирітський будинок?\" Вона вказала на будівлю сирітського притулку в місті Лафайєт. Всі діти були звільнені з його обіймів, і всі працівники в будівлі були застрелені прямо на місці. Це сталося кілька днів тому, і тіла ще не були прибрані. Каллахан нарешті перестав кашляти і подивився вгору. \"Це чортове будівля — ось де ви, суки, зруйнували моє життя. Або принаймні намагалися. Подивіться, що ви зробили. Ви взяли звичайну дівчину і вклали в неї стільки ненависті, що вона стала королевою бандитів і вирізала ваш патруль.\""
nf_gam.4.a:0 "§gВона знову посміхнулася і підійшла до Каллахана.§!"

nf_gam_events_continued.4.t:0 "Стовп вогню, Продовження"
nf_gam_events_continued.4.d:0 "\"Ось що я зроблю,\" прошепотіла вона начальнику патруля з сумним покерним обличчям. \"Спочатку я зберу всіх лідерів патрулів і загоню їх у ту будівлю. Потім кину один пістолет з кількістю патронів для кожного з них. Потім я підпалю будівлю. Як тобі таке?\" Начальник лише виглядав сумним. Не жахливим або злим, а просто сумним. \"Це буде величезна втрата хороших людей і патронів, мадам.\" Собек дала йому твердий удар по обличчю і відступила. \"Тепер!\" Вона два рази плеснула в долоні в королівський спосіб, який вона чула у книзі, яку не читала, і кілька патрульних лідерів були загані у будівлю. Останнім увійшов старий чоловік, і поки решта лідерів патруля виглядали злими або наляканими, старий чоловік дивився на Собек тим самим сумним поглядом, який носив Каллахан. Це її розлютила, тому Собек вистрілила старому в плече, щоб додати гостроти. Його обличчя скривилося від болю, але сумний погляд не зник, поки його обличчя не зникло в будівлі. Через кілька хвилин будівля загорілася яскравим вогнем. Через хвилину або дві пролунав ряд пострілів, що вибухали один за одним. Вони продовжували звучати, поки не залишився останній постріл. Останній постріл так і не прозвучав, і начальник лише сів на землю і похитав головою. \"Що ж до тебе,\" зазначила Собек, \"я зроблю тобі послугу. Залишу тебе живим. Більше того, зроблю тебе створінням, на честь якого названа наша банда. Ти станеш алігатором.\" Вона посміхнулася, а попіл з обличчя Каллахана подивився на неї, заплутано. Потім Собек вистрілила йому в обидві ноги, викликаючи зростаючий вереск болю з кожним пострілом. \"Тепер повзи до свободи, великий хлопче. Повзи.\" Після короткої хвилини стогонів Каллахан почав повзти далі.\"\n\"Є ще якісь накази, бос?\" Дарен підійшов до Собек і легенько вклонився.\n\"Так. Підпалюйте кілька будівель. Вибір за тобою або нехай решта Мав вибирає. Розважайтеся. Потім ми йдемо додому.\" Дарен роздав факели охоронцям Собек, і вони розбрелися в димному нічному повітрі."
nf_gam_events_continued.4.a:0 "\"І добре, що позбулися цих демонів.\""

nf_gam.5.t:0 "Алігатори в кількості"
nf_gam.5.d:0 "Собек сіла на одну з лавок, що встеляли набережну канатної фабрики. Як дивно, вона була піднята з іншого місця неподалік і поставлена тут одним з її охоронців спеціально тому, що вона дивилася на місце, де зараз сидів мер Шип-Брейкер. Сам Шип-Брейкер виглядав незвично старим і виснаженим, як ніби він був ще з тих часів, коли вибухали бомби, але так і не став гулем. \"Ну що, — запитав він, — який у тебе план?\" Собек насупила брови. \"Хм. Я не зовсім впевнена, чесно кажучи. Дивись, тут у тебе непогана справа. Коли ми забрали Лафайєт, це було особисто. Мала рахунок з патрульними і я їх побила, поки не вгамувалася. Але ти? Нічого проти тебе, ти просто старий і потворний.\"\n\"Дякую за комплімент.\"\n\"Дивись, Новий Орлеан знаходиться на сході, і це здається забагато роботи. Техас не наша проблема, Десперадо — це цікавіше з ними грати, ніж битися, і немає жодної можливості, що ми виростемо жаб'ячі лапки та станемо піратами. Але ця маленька ділянка землі тут справді виглядала як незакрита справа, знаєш?\" Шип-Брейкер повільно кивнув. \"Розумію, про що ти.\" \"Тому ми вирішили просто... знаєш... забрати її. І ось ми тут.\""
nf_gam.5.a:0 "§gСобек посміхнулася, поклавши руки на боки, а потім склала їх на колінах.§!"

nf_gam_events_continued.5.t:0 "Алігатори в кількості. Продовження"
nf_gam_events_continued.5.d:0 "\"Отже, в мене є кілька варіантів. Я могла б просто вбити тебе і всіх інших тут і покінчити з цим. Підпалити болото і продати останню партію канатної фабрики минаючим піратам.\"\n\"Здається, це було б марно, якщо запитати мене.\"\n\"Я не запитувала, і не питала б.\" Собек подивилася на свою сторону по порожній набережній. \"Але ти правий. Я знаю, що мої люди, чорт візьми, не хочуть провести залишок своїх днів у якійсь фабриці. І, е-е...\" Вона подивилася на Теді Клава, який був одним з охоронців. \"Ну, Теді добре тримає рабів у порядку, але мені щось підказує, що ми не можемо змусити механізми працювати швидше.\"\n\"Це правда, — зауважив Шип-Брейкер. Він почав помічати іскри в очах Собек. Дивно.\" \"Тому наш інший варіант — це практично ось так. Зробити з вас порт для податків. Ви продовжуєте працювати як раніше, перестаєте полювати на піратів, і ми займаємося ними. Зробимо з Канатної фабрики справжній бандитський порт, знаєш? Ти будеш керувати щоденною роботою, але якщо хоч раз допустиш помилку, це буде твоя голова і всі голови на цьому острові котяться. Думаєш, зможеш справитись з цим для мене?\" Шип-Брейкер посміхнувся. \"Думаю, я зможу залишитися на місці, бос.\"\nСобек широко посміхнулася Шип-Брейкеру, потім витягла пістолет і вистрілила йому в ногу. Він прокляв під носа і схопив свою ногу. Вона нахилилася так близько, що відчула непевне дихання старого чоловіка. \"Це за те, що ти назвав мене босом,\" прошепотіла вона. Потім вона піднялася і пішла, за нею йшли охоронці."
nf_gam_events_continued.5.a:0 "\"Добре, ти можеш залишитися мером. Але тримай себе в руках.\""

nf_gam.6.t:0 "Коронація Алігаторної Королеви"
nf_gam.6.d:0 "§R\"Носи корону!\"\n\"Носи корону!\"\n\"Носи корону!\"§! \nМайже кожен член банди був зібраний в міській ратуші Александрії з єдиною метою — змусити Собек носити корону. Собек не хотіла носити цю корону.\n§o\"Я не хочу носити цю корону,\"§! — сказала Собек.\nТеді Клав підійшов до саморобного трону, тепер оздобленого довгим рядом червоних капелюхів і цианового скла черепів, і став перед ним на коліна. Він низько вклонився і підняв відновлену корону Алігатора так високо, як тільки його товсті руки могли. Корона була виготовлена на замовлення від імені випадкового колишнього пірата-кузняра, який заїхав в недавно-окуповану піратами гавані Канатної Фабрики, і включала брухт з перекручених залишків дитячого притулку Лафайєт, шматок з Мами Дульчес, корабель для консервування Баю Моторс, який сидів на мілководді. Вона мала 10 зубів алігатора, що виступали з боків, рівно розташованих, а також ряд латунних прикрас по основному ободу з розплавлених значків патрульних, і вирізьблену вручну голову алігатора, що була вмонтована в передній частині корони. В цілому, це була досить дешевенька річ, подумала Собек. Але все ж..."
nf_gam.6.a:0 "§gВона підвелася.§!"

nf_gam_events_continued.6.t:0 "Коронація Алігаторної Королеви, Продовження"
nf_gam_events_continued.6.d:0 "\"Нарешті. Ей, Клав, встань.\" Клав встав, посміхнувся і зробив погану імітацію військового салюту. \"Якщо я одягну цю дурну корону на свою голову, чи можу я постріляти тобі в твою чортову коліну?\"\nОбличчя Клава потемніло, і він виглядав нервово. Але новий вигук \"скажи так!\" піднявся з решти натовпу, і після того, як він розігрівся на схваленні всіх, він повернувся до переду трону і знову вклонився. \"Якщо це означає твою коронацію, твоя рептильна величносте, я це зроблю.\"\nСобек широко посміхнулася. \"О, і Дарен теж. Ти готовий?\"\nДарен не запізнився з відповіддю, стоячи поруч з троном. \"Якщо це хоче бос,\" сказав він смиренно.\n\"Ну, бос це точно хоче.\" Вона вихопила свій пістолет з кімоно, зробила елегантний оберт, який вона відпрацьовувала занадто довго, і потрапила Клаву і Дарену в ліві коліна по одному пострілу. Обидва впали на землю, стогнучи, але обидва тримали свої болісні обличчя, спрямовані на Собек. Що стосується Собек, то вона добре посміялася, потім закричала: \"Ладно, давайте вже цю дурну корону.\" Вона нахилилася до місця, де Клав тримав її, піднялася на трон і драматично поставила свою праву ногу на підлокітник трону, а потім одягнула корону на себе. Вона зробила драматичну позу, яку колись побачила на обкладинці коміксу, і натовп вибухнув від захоплення."
nf_gam_events_continued.6.a:0 "\"Це досить дурна шапка, якщо чесно.\""