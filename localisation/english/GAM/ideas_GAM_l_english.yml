l_english:
GAM_forgotten_children:0 "Забуті Діти"
GAM_forgotten_children_desc:0 "Хоч більшість нинішніх членів Гейтор Моз були народжені в Александрії або її сусідніх містах, певна частина наших найкращих хлопців прибули з інших місць і приєдналися з різних причин. Наша теперішня босс, Собек, насправді приїхала з Лафайєтта, а її головний друг Дарен народився в Блаффі, що на заході від нього. Хоч ми і не збираємося прикидатися друзями для кожного, хто заходить, ми будемо трішки м’якші до дітей, які потрапляють до нас, і навіть спробуємо показати їм, як все влаштовано, якщо видно, що вони готові. А якщо ні? Ну, деякі з молодших рабів люблять прикидатися батьками і матерями; нехай мають дітей, щоб піклуватися про них, якщо це змусить їх працювати більше. Діти теж будуть виховані як раби, як додатковий бонус."

GAM_forgotten_children_alt:0 "Забуті Діти"
GAM_forgotten_children_alt_desc:0 "Хоч більшість нинішніх членів Гейтор Моз були народжені в Александрії або її сусідніх містах, певна частина наших найкращих хлопців прибули з інших місць і приєдналися з різних причин. Наша теперішня босс, Собек, насправді приїхала з Лафайєтта, а її головний друг Дарен народився в Блаффі, що на заході від нього. Хоч ми і не збираємося прикидатися друзями для кожного, хто заходить, ми будемо трішки м’якші до дітей, які потрапляють до нас, і навіть спробуємо показати їм, як все влаштовано, якщо видно, що вони готові. А якщо ні? Ну, деякі з молодших рабів люблять прикидатися батьками і матерями; нехай мають дітей, щоб піклуватися про них, якщо це змусить їх працювати більше. Діти теж будуть виховані як раби, як додатковий бонус."

