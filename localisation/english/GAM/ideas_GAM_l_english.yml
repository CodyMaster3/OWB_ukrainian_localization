GAM_bandit_brothers:0 "Брати по Бандитизму"
GAM_bandit_brothers_desc:0 "Реальність на кордоні Техасу і Луїзіани така, що ця земля зазвичай є беззаконною. Кожен вільний грабувати один одного, і так далі, з усіма тими ідеологічними дурницями. А ось факт: хто має найбільшу гармату, той і виграє. На жаль, наразі Братство має найбільшу гармату, і вони намагаються впровадити Закон і Порядок на цій території. Хоч як нам боляче співпрацювати з цією групою десперадо і канібало-супортером Карфагінян, ми, ймовірно, мусимо це робити, якщо хочемо мати шанс проти Братства."

GAM_hidden_in_the_sand:0 "Приховані в Болотах"
GAM_hidden_in_the_sand_desc:0 "Єдине, що більшість атакуючих сил ніколи не розуміють, це як важко вигнати купу бійців із середини болота, які готові заробити за невеликі гроші. Ми вже застосовували трюк ’покритися брудом і чекати, поки хтось не постріляє’ проти багатьох супротивників, останнім з яких були патрульні Лафайєтта. Братство, мабуть, нове в такому виді боїв — давайте покажемо їм, як це робиться!"

GAM_CAR_trade:0 "Карфагінська Обміна"
GAM_CAR_trade_desc:0 "Ми це зробили! Собек Потужна та її власні Гейтор Моз знищили Техаське Братство і врятували майбутнє регіону одним ударом! Ох, це була задовільна битва. Ці freaks в броні справді пищать, коли їх штовхають і тикатимуть в ребра без броні для захисту. В будь-якому разі, нам не потрібно і не хочеться мати справу з Техасом, тому ми переклали це непорозуміння на старих Карфагінських вигнанців, і вони погодились платити нам щомісячну данину в найближчі кілька десятиліть. Це, напевно, буде значна частина їхнього грошей кілька років тому, але тепер, коли у них є Даллас для пограбування, вони, ймовірно, впораються."

GAM_tribute:0 "Данина Гейтор Банді"
GAM_tribute_desc:0 "Хоч ми і не очікували такого результату, здається, що нам повернули нашу землю Гейтор Моз з Александрії. Це справжня прикрість, адже ми дали справжній бій на початку проти Братства, і ми, ймовірно, майже виграли, перш ніж їм пощастило і вони вивели наші міста з-під нас. В будь-якому разі, угода є угодою, і ця дівчина Собек явно не та, з ким варто змагатися поки що. Ми будемо видавати видимість і щомісяця віддавати гроші. Може, одного разу ми зупинимося. Свободна країна, і все таке."

GAM_dead_texas:0 "Смерть Техасу"
GAM_dead_texas_desc:0 "Отже, ви пам’ятаєте, як Техас створював всі ті проблеми для нас і всіх навколо нас? Чорт забирай, одного дня вони вирішили, що Далласу їм мало, і намагалися знищити всіх? Ну, вони провалилися! Ми зробили неможливе — Техаське Братство, мабуть, спіткнулося через перерослий корінь, тому їх здолали в болотах навколо Александрії, і вони так і не оговталися! Тепер, коли все починає повернутися до нормального стану, ми можемо зупинитися і подивитися навколо. І ось, здається, ми заробили чимало поваги за те, що пережили Братство. Давайте перетворимо це на справжню здобич! Знаєте, через набіги. Так, нічого особливого."

GAM_revenge:0 "Помста Собек"
GAM_revenge_desc:0 "Тепер, коли техаський безлад більше не є проблемою, давайте перейдемо до справжнього веселощів! Собек має кілька особистих рахунків, які потрібно вирішити, і вона дала зрозуміти всім у банді, що ми трохи повеселимося. Уся ця техаська проблема була реальною битвою; це просто післяпарті, насправді.."

GAM_gator_gang_idea:0 "Велика Гейтор Банда"
GAM_gator_gang_idea_desc:0 "Об’єднавши західну Луїзіану під правлінням рейдерів, Гейтор Моз з Александрії перетворилися на Велику Гейтор Банду, особистий дотик їхнього лідера, нещодавно коронованої Гейтор Королеви Собек. Вони управляють величезною рабською операцією з Каннері та використовують захоплену флотилію для доставки товарів з Лафайєтта до решти великих міст Гульфу, перетворивши цей регіон на імпровізований картель риби під жорстким контролем дещо божевільної підлітки. Хоч ми й не впевнені, чи достатньо вона розумна, щоб ловити креветок, це, безумовно, вплине на популяцію форелі."