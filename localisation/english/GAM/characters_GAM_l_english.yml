GAM_MARSHALL_name:0 "Командир патруля Маршалл"
GAM_MARSHALL_DESC:0 "Командир патруля Коннор Маршалл народився на анархічних вулицях Александрії в 49-му році. Він бачив усе за час своєї служби в Gator Maws – жорстокість, варварство та недоговорені деградації ночі – усе це знайоме Маршаллу. З падінням Собека з влади, яке стало остаточним, Маршаллу було доручено управляти майбутнім дикого міста. І з усіх, кого могли б вибрати на цю роль, Маршалл був розумним вибором. Він покинув Александрії, коли йому було 17, щоб підписатися на службу в патруль Лафайєта, бо втомився жити в постійному стані нестабільності. Тепер він має намір привнести деяку стабільність Лафайєта в Александрії, зберігаючи зв'язок з диким дитинством, що робить людей Александрії такими вільними у своєму вихованні. Дивно, але його гібридна стратегія, здається, працює, і кожного дня він знаходить нових друзів з колишніх ворогів."

GAM_CLAW_NAME:0 "Теодор Кло"
CLAW_DESC:0 "Теодор Кло, син колишнього лідера Gator Maws Рейналдса Кло, довго планував повернення своєї родини до влади. Але, по суті, він все робив тільки на планах. Він завжди був більше діячем, ніж мислителем. Я маю на увазі, давайте подивимося правді в очі. Мислення – це для тих, хто має дорогі штани в Лафайєті. Бої? Ось де родина Кло завжди була на висоті. На щастя, все це планування «ні про що» здалося працювати на Теодора, і тепер він очолив Gator Maws, як завжди сподівався. Він не зовсім впевнений, що він робитиме зі спадщиною батька під своїми товстими сідницями, але він точно не дозволить хорошій сутичці пройти повз, поки в нього є під його командою Gators."

GAM_EVERYOUNG_NAME:0 "Ґрант Еверйоунг"
EVERYOUNG_DESC:0 "Ґрант «Золотий Зуб» Еверйоунг – колишній лідер банди з Нового Орлеана. Наголос на «колишній» – його стара банда кілька десятиліть тому здала їх мафії, і він вже довгий час мандрує, перебиваючись випадковими заробітками. Навіть він не зовсім розуміє, чому потрапив до Александрії, щоб приєднатися до Gator Maws, але йому потрібна була робота, а вони брали всіх, хто вмів тримати зброю через загрозу з боку Техасу. Але, незважаючи на все, йому вдалося зробити щось правильно, і тепер він сидить на самому верху, з усією бандою, яка цілує йому ноги, і світом, що лежить в його руках. Звісно, йому, напевно, доведеться відзвітувати перед старшими, але це можна почекати. Він зрозумів, що в цій банді є багато племенних аспектів, і він знає, як використати це, щоб мотивувати їх до нових злочинів."

GAM_SOBEK_NAME:0 "Собек Могутній"
GAM_SOBEK_NAME_ALT:0 "Гатор Квін Собек"
SOBEK_DESC:0 "Справжнє визначення жорстокого тирана, Собек править Gator Maws в Александрії залізною рукою. Вона виросла на півночі, сиротою, сповненою злості після Лафайєта, і завоювала своє місце на вершині Gator Maws через лідерське змагання, вбивши жахливо мутованого «гатора», коли їй було 14. Хоча співпадіння її імені з іменем єгипетського бога-крокодила Нілу не є широко відомим фактом, Собек Могутній отримує велике задоволення від того, як далеко вона зайшла з того часу, як була слабким сиротою в жалюгідному притулку, і племінна культура банд та племен, що слідує за нею, робить це з неймовірною вірністю. Вона може й не народилася в анархії брудних вулиць Александрії, але вона сама прийшла сюди, і вона, безумовно, є даром пустки для Gator Maws за їх вірність хитрим шляхам їхніх батьків. З найжорстокішими головорізами Луїзіани за своїми плечима, молода Собек бродить по болотах Міссісіпі зі своїм народом, шукаючи подорожніх, які заблукали далеко від доріг."

