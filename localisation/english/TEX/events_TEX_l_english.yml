l_english:
nf_texas.1.t:0 "Світ змін"
nf_texas.1.d:0 "Світ навколо нас змінюється шаленими темпами. Ще кілька десятиліть тому Лоун-Стар був процвітаючим і мирним торговим поселенням, а Техаські Рейнджери діяли спільно зі своїми братами з Братства Сталі проти рейдерів, що нишпорили Техасом. Тепер усе інакше. Тимчасова Республіка Техас, колись лише мрія наївних ідеалістів, стала реальністю. Два народи — Лоун-Стар і Техаські Рейнджери — об’єдналися навколо спільних цінностей свободи, добробуту й демократії. [Буде доповнено]"
nf_texas.1.a:0 "Попереду важливі рішення..."

nf_texas.2.t:0 "Війна як продовження політики"
nf_texas.2.d:0 ""
nf_texas.2.a:0 "Щоб жити в мирі — потрібно бути готовими до війни."

nf_texas.3.t:0 "Питання державності"
nf_texas.3.d:0 "Після створення Тимчасової Республіки Техас по всіх новоінтегрованих територіях було проведено вибори, щоби визначити лідера новонародженої держави. Після підрахунку голосів один кандидат вийшов уперед."
nf_texas.3.a:0 "Чо Банг поведе нас!"
nf_texas.3.b:0 "Раск для Техасу!"
nf_texas.3.c:0 "Супермутант для суперального народу!"
nf_texas.3.e:0 "Скарлет за вільний Техас!"
nf_texas.3.f:0 "Тодд за прибутки!"

nf_texas.4.t:0 "Перевага Техасу в небі"
nf_texas.4.d:0 "Техаський Меморіальний Повітряний Флот був великою організацією ще до війни, яка, як не дивно, була віддана справі збереження історії авіації. Відродімо цю традицію — з новим, більш бойовим застосуванням."
nf_texas.4.a:0 "Небо належить нам!"

nf_texas.5.t:0 "Питання прапора"
nf_texas.5.d:0 "Попри те, що деякі вважають дискусії про прапор недоречними на тлі роботизованої навали через Ріо-Гранде, Тимчасовий Конгрес наполягає на обговоренні. У Техасу було багато прапорів: прапор Іспанії, Франції, Мексики, два прапори Республіки, американський, конфедеративний, знову американський, прапор міста Лоун-Стар, і навіть прапор армії супермутантів Аттіса. Ми маємо вирішити, який із них буде прапором Відродженої Республіки."
nf_texas.5.a:0 "Візьмемо той перший прапор, який ніхто вже не пам’ятає."
nf_texas.5.b:0 "Одинока Зірка Пустки!"
nf_texas.5.c:0 "Візьмемо той прапор Техасу, який ще зберігся в руїнах Далласа."
nf_texas.5.e:0 "Цей прапор виглядає доволі техаським, так?"

nf_texas.6.t:0 "Питання столиці"
nf_texas.6.d:0 "Ще одне непросте рішення. Де буде розташована наша столиця? Звідки ми керуватимемо Техасом? Яке місто стане маяком свободи й добробуту для всього краю?"
nf_texas.6.a:0 "Даллас — найбільше довоєнне місто Техасу."
nf_texas.6.b:0 "Х'юстон — приморське мегаполісне серце."
nf_texas.6.c:0 "Лоун-Стар — нова зірка на мапі пустки."
nf_texas.6.e:0 "Остін — символ єдності мутантів і людей."
nf_texas.6.f:0 "Еден — з відкритими полями й зеленими лугами."
nf_texas.6.g:0 "Маєток Т.А.З. — символ багатства Тодда Гаубіца."

nf_texas.8.t:0 "Свобода віросповідання чи свобода від віри"
nf_texas.8.d:0 "Хоча ніхто всерйоз не вважає, що атеїстам слід заборонити обіймати посади, дехто наполягає, що конституція Техасу має закріпити моральні цінності. Адже ви ж не хочете, щоб до влади прийшла така, як мер Жасмін?"
nf_texas.8.a:0 "Ми богобоязливий народ, без сумніву."
nf_texas.8.b:0 "Краще чесна повія, ніж підлий священик."

nf_texas.9.t:0 "Рівність перед законом"
nf_texas.9.d:0 "Конституція Техасу колись гарантувала рівність незалежно від статі, раси, кольору шкіри, віросповідання чи походження. Багато хто вважає, що цього досить, щоб забезпечити рівність для супермутантів. Але Кітс вимагає прямо зазначити, що статус FEV є захищеною категорією. Це задовольнить Шейла, але розлютить тих, хто втратив близьких через нього або Залізних Ковальців."
nf_texas.9.a:0 "Кітс переконав конвент!"
nf_texas.9.b:0 "Немає підстав для особливого ставлення."

nf_texas.10.t:0 "У довгостроковій перспективі..."
nf_texas.10.d:0 "Одне з головних питань — форма майбутньої Республіки. Одні бачать Техас як оборонний союз, щоб стримувати Легіон і Санта-Анну. Вони виступають за обмежений центральний уряд і збалансований бюджет. Але Чо Банг виступає за централізований Департамент фінансів, здатний продавати облігації і фінансувати розвиток. Як каже сам Банг: 'У довгостроковій перспективі можуть бути проблеми. Але якщо ми не зможемо зупинити Санта-Анну і Ланія, то й довгострокової не буде.'"
nf_texas.10.a:0 "Обмежимо державні витрати."
nf_texas.10.b:0 "Купуйте Техаські облігації перемоги!"

nf_texas.11.t:0 "Мирова юстиція"
nf_texas.11.d:0 "Хоча Братство Сталі й Чо Банг — союзники, їхнє бачення правосуддя різниться. Братство віддає перевагу простому «пустельному правосуддю», тоді як Лоун-Стар процвітає завдяки контрактам і судам. Чо Банг наполягає, що формалізована судова система важлива для розвитку. Кітс також сумнівається, що місцеві суди забезпечать права для мутантів."
nf_texas.11.a:0 "Збройні патрулі нас не підводили!"
nf_texas.11.b:0 "Чо й Кітс мають рацію. Суддів призначатиме Конгрес."

nf_texas.111.t:0 "Поселенці вимагають права на зброю"
nf_texas.111.d:0 "Поселення біля кордону страждають від нападів. Рад-кенгуру з пустелі Чіуауа знищують врожай томатільйо. Люди хочуть бути впевнені, що зможуть захистити себе — і свою зброю — після створення республіки."
nf_texas.111.a:0 "Так, це впишемо в конституцію."
nf_texas.111.b:0 "Це надто небезпечно, щоб дозволити."

nf_texas.112.t:0 "Біженці"
nf_texas.112.d:0 "Завоювання Ланія виселило тисячі людей, які зараз мешкають у наметових таборах біля нашого кордону. Вони шукають захисту і свободи. Їхня кількість зростає, і вони просять гарантій у нашій конституції. Нам доведеться виділити на це кошти — і новини про нашу підтримку швидко поширяться."
nf_texas.112.a:0 "Ми приймаємо їх з розпростертими обіймами."
nf_texas.112.b:0 "Ми не можемо підтримати їх тут."
constitution_mission_2:0 "Запит: Свобода пересування"

nf_texas.113.t:0 "Мутанти вимагають прав"
nf_texas.113.d:0 "Наш союз із Кітсом передбачав рівність мутантів із людьми. Кітс просуває цю ідею на конституційному зібранні, але багато хто опирається, згадуючи жахи Армії Аттіса."
nf_texas.113.a:0 "Складна ситуація."
constitution_mission_3:0 "Запит: Права мутантів"
constitution_mission_4:0 "Запит: Відмова в правах мутантам"

nf_texas.114.t:0 "Сильна законодавча влада"
nf_texas.114.d:0 "Законодавча влада Х’юстонських Ракет завжди була рушієм демократії в цьому регіоні. Вони хочуть, щоб ми перейняли їхню систему. Адже саме народ є основою демократії, а його представники повинні вести державу шляхом розвитку."
nf_texas.114.a:0 "Цілком розумно."
nf_texas.114.b:0 "Маси не здатні ефективно керувати."
constitution_mission_5:0 "Запит: Законодавчі повноваження"

nf_texas.115.t:0 "Освіта"
nf_texas.115.d:0 "З моменту нашої появи як Братства в Техасі, ми навчали тих, хто приєднувався до нас, щоб зробити з них науковців та солдатів. Тепер цей обов'язок поширюється і на фермерів та виробників із [THIS.GetName]. Перетворивши наші ідеали Братства у гуманітарні принципи, ми подали ці статті для включення в конституцію."
nf_texas.115.a:0 "Дякуємо за рекомендацію, Паладине."

nf_texas.51.t:0 "Наша Конституція"
nf_texas.51.d:0 "З утворенням республіки наступним важливим кроком для нас є створення державної основи, подібно до історій минулого. Боротьба буде запеклою, і деякі положення будуть вимагатися, підтримуватись або ненавидітись нашими громадянами.\n\n§oКонституція Техасу складається зі статей і підрозділів. Кожну зі статей можна розблокувати через дерево фокусів, а підрозділи — через фокуси й події. Кожен підрозділ може бути доданий лише раз і дає унікальний ефект. Конституція не має ефекту, поки її не підписано. Після підписання вона більше не редагується. Обирайте мудро, коли підписати документ.§!"
nf_texas.51.a:0 "Час скликати конвент!"

nf_texas.12.t:0 "Усе дурніше в Техасі"
nf_texas.12.d:0 "[TEX.GetLeader] вимагає територію TAA від суверенної Республіки Ріо. Техас, який існує... кілька місяців? напевно? погрожує війною, якщо ми не віддамо території, які десятиліттями належали Ріо. Як ми відповімо?"
nf_texas.12.a:0 "Ми пережили Велику Війну не для того, щоб терпіти це лайно."
nf_texas.12.b:0 "Запропонувати автономію в обмін на альянс!"

nf_texas.13.t:0 "[RRG.GetName] відмовляється!"
nf_texas.13.d:0 "Покидьки з [RRG.Capital.GetName] відмовилися віддати землю на північ від Ріо-Ґранде. Схоже, нам знову доведеться гнати мексиканців із Техасу."
nf_texas.13.a:0 "Закінчимо до Різдва."

nf_texas.14.t:0 "Союз рівних?"
nf_texas.14.d:0 "Покидьки з [RRG.Capital.GetName] відмовилися віддати землю на північ від Ріо-Ґранде. Схоже, нам знову доведеться гнати мексиканців із Техасу."
nf_texas.14.a:0 "Закінчимо до Різдва."
nf_texas.14.b:0 "Можливо, краще обрати мирніший шлях."

nf_texas.15.t:0 "Жовте сяйво Техасу"
nf_texas.15.d:0 "Техас вимагає землі в [RRG.GetName], посилаючись на довоєнні кордони. Очевидно, що Техас і далі вимагатиме землі в американських індіанців під гаслами свободи, якщо ми не зупинимо їх. Якщо Техас переможе Ріо, він зможе повністю зосередитися на нас. Можливо, варто підтримати Ріо?"
nf_texas.15.a:0 "Вони майже такі ж погані, як Чиказький Анклав."
nf_texas.15.b:0 "Якщо ми не рухатимемось, може, вони нас не помітять."

nf_texas.16.t:0 "Допомога з Оклахоми"
nf_texas.16.d:0 "Схоже, ми не єдині, хто боїться вторгнення Техасу. Оклахома стає на наш бік."
nf_texas.16.a:0 "Разом ми сильніші!"

nf_texas.17.t:0 "Оклахома гарантує безпеку Ріо"
nf_texas.17.d:0 "Схоже, наші вимоги щодо захоплення TAA викликали занепокоєння серед племен Оклахоми. Вочевидь, звільнення історичних земель Техасу дратує тих, хто сам мешкає на таких же. Ну що ж, час завершити це суперництво раз і назавжди."
nf_texas.17.a:0 "Техас надто малий для трьох."

nf_texas.18.t:0 "Техас Відхиляє Нашу Пропозицію!"
nf_texas.18.d:0 "Схоже, Техас відхилив нашу пропозицію про союз. Замість того, щоб відстоювати свободу для Пустки, вони — лише ще одні у довгій черзі загарбників. Техас не має жодного права претендувати на серця й розуми жителів TAA. Його народ тепер і завжди буде частиною Республіки Ріо Ґранде. Ми й надалі стоятимемо за демократію проти всіх, хто їй загрожує."
nf_texas.18.a:0 "¡La soberanía dimana inmediatamente del pueblo!"

nf_texas.19.t:0 "Остання, Найкраща Надія на Мир"
nf_texas.19.d:0 "Кажуть, війна ніколи не змінюється. Але якщо вона не змінюється, то повинні змінюватися люди — і їхні символи також. [TEX.GetLeader] погодився на нашу пропозицію. Замість анексії TAA ця земля, межа між Америкою та Мексикою, увійде до нового союзу. Техас відмовився від божевільної спроби завоювання та визнав, наскільки ми подібні. Разом республіки Техасу та Ріо Ґранде стоятимуть за правду, справедливість та північноамериканський шлях проти всіх загроз. Сестринські республіки стануть маяком у Пустці — а, можливо, колись освітлять увесь континент."
nf_texas.19.a:0 "¡Las republicas hermanas!"

nf_texas.500.t:0 "Квітуча Жовта Роза"
nf_texas.500.d:0 "Станції від Лоун-Стара до Далласа гудуть від Проголошення XXI століття. Техаський Економічний Союз, що колись був конфедерацією союзників з Братством Техасу та Лоун-Старом як центральними учасниками, об’єднався в єдину централізовану державу. Таке зростання не обходиться без труднощів, але новина була добре сприйнята громадянами по всьому Союзу. Майже всі вірять, що незабаром розквітне яскравіша троянда.\n\n§GНова Конституція§! вже готується, і влада обіцяє дотримуватись волі народу при закладенні фундаменту нового дому."
nf_texas.500.a:0 "Ти чув новини?"

nf_texas.52.t:0 "Підйом на Новий Рівень"
nf_texas.52.d:0 "На нашому північно-західному кордоні відбувається дещо цікаве. Різнорідні держави регіону об’єднуються в єдину фракцію — Республіку Техас. За прогнозами, ця республіка стане найпотужнішою силою в затоці, і цілком можливо, наступною ціллю станемо ми. Усвідомлюючи, що ця республіка становить значно більшу загрозу, ніж бездіяльна Ріоґрандська, можливо, настав час вступити у найбільший бізнес — політику!\n\nСхема проста: запропонувати анексію TAA та його активів в обмін на обіцянку продовження бізнесу, амністію за (здебільшого податкові) злочини та гарантоване місце на майбутніх президентських виборах."
nf_texas.52.a:0 "Вони були б дурнями, якби відмовилися."
nf_texas.52.b:0 "І вони — дурні."

nf_texas.53.t:0 "Людина з Великою Усмішкою"
nf_texas.53.d:0 "Сьогодні з TAЗ надійшло дивне повідомлення. Зазвичай вони надсилають щось лише якщо хочуть щось продати (або ми запізнилися з оплатою), але цього разу — дипломатична ініціатива. Угода була проста, хоч і завуальована корпоративним жаргоном, рекламами та згадками про необхідність підписання NDA.\n\nТодд дозволить нам анексувати територію TAA — завтра — за умови, що його бізнеси залишаться здебільшого недоторканими (він, на диво, навіть погодився платити податки) і що йому гарантовано місце у президентських виборах. Малоймовірно, що він виграє, тож незрозуміло, чому він так ризикує. Незважаючи на певні сумніви щодо того, щоб пускати змію до курника, багаті землі TAA без війни — це значний бонус..."
nf_texas.53.a:0 "Що він замислив?"

nf_texas.54.t:0 "Нове Брендування"
nf_texas.54.d:0 "Тодд Гаубіц розглядав прапори, прикріплені до стіни перед ним. Його асистентка стояла поруч, усміхаючись до вух. Вона з нетерпінням чекала його думки про свою «дитину». Нарешті він заговорив.\n\n\"Сміття. Без натхнення. Нудота. Де ти їх знайшла? У якійсь покинутій довоєнній Сховищі? Вони не мають бренду, жодної впізнаваної ознаки. Як люди дізнаються, за що я стою? Забудь про них, зірви все. У мене краща ідея для прапора.\"\n\nЇї усмішка зникла. Вона зняла прапори, а президент витягнув аркуш паперу й почав малювати."
nf_texas.54.a:0 "Зірка посередині!"
nf_texas.54.b:0 "Логотип компанії посередині!"
nf_texas.54.c:0 "Логотип компанії зліва!"
