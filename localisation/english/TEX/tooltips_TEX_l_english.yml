mot_no_leaving_faction_tt:0 "§RМи не можемо покинути фракцію §YНова Каліфорнійська Республіка§!: ми лише їх військова експедиція!§!"
mot_no_kicking_faction_tt:0 "§RМи не можемо вигнати §YМохавські Території§! з нашої фракції: це наша військова експедиція!§!"
