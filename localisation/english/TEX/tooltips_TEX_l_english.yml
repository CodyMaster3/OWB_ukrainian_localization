union_economic_boom_tt:0 "§YТорговий Вузол§! у §YLone Star§! буде підвищено на §G1§! рівень, що дасть значний економічний поштовх. Техаське Братство отримає одноразову виплату в [GetCapTxt] §G200.00k§! [GetCapType]."

# Формування Техасу — Підказки
tex_upcoming_integration_from_lns_tt:0 "Коли §YLone Star§! завершить свій майбутній фокус на формування §YРеспубліки Техас§!, ми перейдемо під контроль §YРеспубліки Техас§! і об'єднаємо §YLone Star§! та §Y[TBH.GetName]§! в одну націю.\n\n§gЯкщо ви граєте в мультиплеєрі і обидві країни мають людських гравців, обидва отримають нове дерево фокусів, але матимуть доступ лише до релевантної частини. Однак буде цікавіше, якщо гравець за [TBH.GetName] перейде у гру за [LNS.GetName] перед завершенням фокусу на створення Республіки — щоб ви могли грати разом як єдина нація. Вибір за вами.§!\n\n"

tex_owns_controlls_all_lns_states:0 "Всі національні області §Y[LNS.GetName]§! є §Yвласністю§! та §Yпід контролем§! члена §YТехаського Економічного Союзу§!."
tex_owns_controlls_all_tbh_states:0 "Всі національні області §Y[TBH.GetName]§! є §Yвласністю§! та §Yпід контролем§! члена §YТехаського Економічного Союзу§!."

tex_formation_focus_sp_tt:0 "Ми сформуємо §RТимчасову Республіку Техас§!, отримавши §Gнове дерево фокусів§!.\n\n§gНова держава успадкує всіх генералів, фельдмаршалів, адміралів, війська, технології та більшість національних духів від §Y[LNS.GetName]§! і §Y[TBH.GetName]§!, якщо вони залишаються у складі §YТехаського Економічного Союзу§!. Далі ми зможемо продовжити політику обох країн і визначити майбутнє Республіки.§!\n"

tex_formation_focus_coop_lns_starts_tt:0 "Оскільки §Y[LNS.GetName]§! та §Y[TBH.GetName]§! є людськими гравцями та частиною §YТехаського Економічного Союзу§!, завершення цього фокусу створить гібридну версію §YТимчасової Республіки Техас§!. Обидві країни отримають §Gнове дерево фокусів§!, але лише з доступом до релевантних частин.\n\n§gЦікавіше буде, якщо гравець за [TBH.GetName] приєднається до гри за [LNS.GetName] до завершення фокусу, щоб обидва могли грати як одна нація. Вибір за вами.§!"

tex_formation_focus_coop_tbh_starts_tt:0 "Оскільки §Y[LNS.GetName]§! та §Y[TBH.GetName]§! є людськими гравцями та частиною §YТехаського Економічного Союзу§!, завершення цього фокусу створить гібридну версію §YТимчасової Республіки Техас§!. Обидві країни отримають §Gнове дерево фокусів§!, але лише з доступом до релевантних частин.\n\n§gЦікавіше буде, якщо гравець за [LNS.GetName] приєднається до гри за [TBH.GetName] до завершення фокусу, щоб обидва могли грати як одна нація. Вибір за вами.§!"

