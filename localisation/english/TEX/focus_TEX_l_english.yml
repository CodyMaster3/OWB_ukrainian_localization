l_english:
tex_taking_stock:0 "Оцінка Стану"
tex_taking_stock_desc:0 "Відновлення Республіки Техас давно було мрією багатьох у Лоун-Старі та серед Техаських Рейнджерів. Тепер ця мрія стала реальністю. Але перш ніж сліпо кидатися у спільне майбутнє, ми повинні оцінити наше поточне становище."

tex_matters_of_war:0 "Питання Війни"
tex_matters_of_war_desc:0 "Говори м’яко, а тримай при собі добру палицю. А краще — рушницю."

tex_matters_of_the_state:0 "Питання Державності"
tex_matters_of_the_state_desc:0 "Держава потребує голови, як і все інше. Нам слід прийняти дуже просте рішення: хто поведе нас у майбутнє, хто візьме на себе відповідальність?"

tex_matters_of_governance:0 "Питання Управління"
tex_matters_of_governance_desc:0 "Визначення законів і кодексів, що окреслять нашу молоду державу, — це питання найвищої важливості."

texas_budget:0 "Бюджет Техасу"
texas_budget_desc:0 "Остання Техаська Конституція вимагала, щоб штат щороку врівноважував свій бюджет, не витрачаючи більше, ніж отримує з податків. Але Чо Банг запропонувала новій Республіці значно агресивніший підхід, щоб Лоун-Стар справді сяяв яскраво."

texas_budget_tt:0 "Так, схоже на правду."

tex_the_flag:0 "Наш Прапор"
tex_the_flag_desc:0 "Образ держави майже такий самий важливий, як і сама держава. Дизайн нашого прапора скаже багато про те, хто ми як народ. Нехай наш прапор майорить високо — незалежно від вигляду."

tex_the_capital:0 "Наша Столиця"
tex_the_capital_desc:0 "Кожна велика держава потребує великого міста для управління. Навіть якщо ми цінуємо індивідуальні свободи, місто на пагорбі стане гордим маяком для всіх наших громадян."

### Військова гілка

tex_emergency_industry_act:0 "Акт Надзвичайної Індустрії"
tex_emergency_industry_act_desc:0 "Ми були загнані в глухий кут силами ворога, що насувається. Деякі з наших найбільших втрат — це удари по промисловому серцю, що змусило нас екстрено вилучити припаси та виробничі потужності."

tex_texan_defence_bureau:0 "Прийняття Моделі Техаського Депутата"
tex_texan_defence_bureau_desc:0 ""

tex_form_dod:0 "Створити Міністерство Оборони"
tex_form_dod_desc:0 "Першим прагненням нашого народу завжди буде безпека. Армія від народу й для народу допоможе вгамувати страхи."

tex_the_deputy_model:0 "Модель Депутата"
tex_the_deputy_model_desc:0 "Модель депутації Техаського Братства чітко показала свою ефективність. Було б розумно прийняти її як основну модель оборони."

tex_the_mercenary_model:0 "Модель Найманців"
tex_the_mercenary_model_desc:0 "Ми мали щастя успадкувати економічну силу Лоун-Стару, тож найкраще — наймати найманців у подібному стилі."

tex_upgrade_conscription_1:0 "Депутати для Депутатів"
tex_upgrade_conscription_1_desc:0 "Нам слід розширити нашу військову організацію. Призначення депутатів іншим депутатам, як би дивно це не звучало, допоможе створити сильніше та гнучкіше військо."

tex_upgrade_conscription_2:0 "Депутати для Депутатів Депутатів"
tex_upgrade_conscription_2_desc:0 "Як і раніше, подальше поглиблення структури нашої армії може ще більше посилити її можливості."

tex_form_spy_agency:0 "Створити Бюро Оборони Техасу"
tex_form_spy_agency_desc:0 "Армії нам буде достатньо, але розвідка може захистити нас від невидимих загроз. Один убивця може завдати більше шкоди, ніж армія мутантів. Було б дурницею ігнорувати обох."

tex_manifest_destiny:0 "Явне Призначення"
tex_manifest_destiny_desc:0 "Народи навколо нас благають про допомогу. Пригнічені жорстокими господарями та дикунами, ми маємо обов’язок — перед ними й перед собою."

tex_airforce_academy:0 "Авіаційна Академія"
tex_airforce_academy_desc:0 "Опанування неба вже не за горами. Діти по всьому Техасу дивляться в небо, мріючи приєднатися до ворон, що кружляють над їхніми школами."

tex_national_flight_shows:0 "Національні Авіашоу"
tex_national_flight_shows_desc:0 "Залучення населення до наших повітряних мрій може ще більше підвищити інтерес до програми. Ми покажемо найкращих пілотів, вразимо громадян і вселимо страх у ворогів."

tex_commemorative_airforce:0 "Пам'ятна Авіація"
tex_commemorative_airforce_desc:0 "Техас має горду історію — і як краще її вшанувати, ніж через наших повітряних воїнів? Згадаймо великі битви й прямуймо до нових перемог."

tex_dont_mess_airforce:0 "Не Зв’язуйся з Техасом"
tex_dont_mess_airforce_desc:0 "Усе в самій назві! Іноді гармати армії — це недостатньо, і тоді на допомогу приходять наші потужні літаки з надлишковою вогневою міццю."

tex_annex_car:0 "Нехай тече газ"
tex_annex_car_desc:0 "Рейдери Карфагена можуть бажати триматися подалі від Техасу, але як ми можемо залишити контроль над останнім природним газовим родовищем у їхніх руках?"

tex_annex_bandits:0 "Бандити на Сході"
tex_annex_bandits_desc:0 "Мало хто знає, але природний кордон Техасу проходить по Міссісіпі! Знищивши цих розбійників, ми допоможемо Лоун-Стару засяяти яскравіше."

tex_annex_TAA:0 "Економічні сектори"
tex_annex_TAA_desc:0 "Хоча дехто через Ріо вважає, що вони правлять ТАЗ лише тому, що він був частиною їхньої республіки понад століття, постійне невдоволення у ТАЗ свідчить, що ця земля належить Техасу. Це ж навіть у назві!"

texas_constitution:0 "Конституція"
texas_constitution_desc:0 "У Техасу було 8 конституцій: конституція 1827 року; конституція Республіки 1836 року; конституція 1845; конституція 1861 року (про неї ми не говоримо); конституція 1866 року; 1869 року; 1876 року; і конституція 2054 року. Настав час написати ще одну!"

texas_foundations_of_government:0 "Основи Уряду"
texas_foundations_of_government_desc:0 "Основи нашого уряду будуть змодельовані за прикладом старого Техасу. Три гілки влади будуть окремими, створеними для того, щоб врівноважувати одна одну."

texas_bill_of_rights:0 "Білль про Права"
texas_bill_of_rights_desc:0 "Проголошення Білля про Права визначить межі конституційних прав і те, наскільки ми можемо їх обмежувати."

texas_freedom_of_speech:0 "Свобода Слова"
texas_freedom_of_speech_desc:0 "Конституція Техасу гарантувала свободу слова. На вимогу Містера Ентертеймент, вона знову буде гарантована."

texas_freedom_of_religion:0 "Свобода Віровизнання"
texas_freedom_of_religion_desc:0 "Дивно, але довкола гарантії свободи віросповідання в Конституції точаться бурхливі дебати. Стара Конституція забороняла атеїстам займати посади, але деякі з Остіну вважають це абсурдним. Хіба ми не сучасна цивілізація?"

texas_freedom_guns:0 "Право на Зброю"
texas_freedom_guns_desc:0 "Озброєне суспільство — це ввічливе суспільство. А техасці — дуже, дуже ввічливі."

texas_ban_slavery:0 "Розривання Кайданів"
texas_ban_slavery_desc:0 "Ті, хто раніше володів частинами нашого об'єднаного Техасу, поневолювали наших громадян. Хоч вони й бажають продовжити цю експлуатацію, ми цього не дозволимо."

texas_freedom_movement:0 "Імміграція"
texas_freedom_movement_desc:0 "Багато мешканців Пустки переселяються до Техасу в пошуках кращого життя. Давайте формалізуємо процес набуття громадянства Республіки Лоун-Стар!"

texas_legislature:0 "Законодавча Гілка"
texas_legislature_desc:0 "Конгрес представляє волю нашого народу. Тож деталі щодо сенаторства мають першорядне значення."

texas_judiciary:0 "Судова Гілка"
texas_judiciary_desc:0 "Чо Банг і Техаське Братство мають дуже різні уявлення про правосуддя. Хто переможе?"

texas_execuative:0 "Виконавча Гілка"
texas_execuative_desc:0 "Чо Банг і Техаське Братство мають дуже різні уявлення про правосуддя. Хто переможе?"

texas_primary_powers:0 "Найвища Гілка Техаського Дерева"
texas_primary_powers_desc:0 "Жодна нація не процвітає без справедливості. Але багато хто запитує: 'чиєї справедливості?'. Це правосуддя прикордонників? Чи призначених суддів, що працюють на уряд? І найголовніше: хто слідкуватиме за тими, хто слідкує?"

texas_constitutional_convention:0 "Конвенція [?global.date.GetDateStringNoHourLong]"
texas_constitutional_convention_desc:0 "Делегати різних груп зібралися на Конвенції [?global.date.GetDateStringNoHourLong], щоб взяти участь у переговорах щодо конституції."

texas_constitutional_convention_extentions:0 "Від Тижнів до Місяців"
texas_constitutional_convention_extentions_desc:0 "Можливо, ми переоцінили свої можливості або недооцінили різноманіття Техасу. Щодня ми дізнаємося про нові народи та способи життя, які потрібно враховувати. Дехто відмовляється платити податки, вважаючи їх крадіжкою. Деякі племена не мають валюти, працюють за бартером. У міру того як тижні перетворюються на місяці, дебати щодо оподаткування тільки зростають."

texas_elongated_deliberations:0 "Обережні Переговори"
texas_elongated_deliberations_desc:0 "Кожна спроба ввести новий законопроєкт викликає нові суперечки, і наш народ все більше розділяється. Це не найоптимальніше рішення, але ми не можемо квапити прогрес. Лише вислухавши всіх, ми зможемо створити найкращий результат."

texas_constitution_signed:0 "Наріжний Камінь Техасу"
texas_constitution_signed_desc:0 "Безліч компромісів, гарячих дебатів і нескінченних дискусій привели нас до цього моменту. Наші спроби створити конституційні засади нарешті завершені. Це дозволить легітимізувати наше правління й впровадити стандартизовану бюрократію для керування великими територіями."

texas_constitution_modifier:0 "Конституція Техасу"

tex_form_the_tbr:0 "Створити TBR"
tex_form_the_tbr_desc:0 "Багатства Техасу великі, але недовикористані. Тепер, коли ми утримуємо стабільний контроль над територіями, варто створити спеціальний урядовий орган, який зможе відбудувати нашу молоду державу."

tex_secure_mission_control:0 "Захопити Центр Управління"
tex_secure_mission_control_desc:0 "Центр управління в руїнах Г'юстона колись був серцем космічної програми США. Ми не полетимо на Місяць найближчим часом, але, можливо, зможемо запустити кілька супутників, якщо контролюватимемо цей об'єкт."

tex_refurbish_satellites:0 "Відновити Старі Супутники"
tex_refurbish_satellites_desc:0 "Контролюючи Центр управління, ми можемо дістати старі супутники, що збереглися з часів війни. Супутники погоди, GPS і розвідки дадуть нам безпрецедентну перевагу на полі бою."

tex_rebuild_the_fields:0 "Відновити Газові Родовища"
tex_rebuild_the_fields_desc:0 "Тепер, коли рейдери усунені, ми можемо почати ремонт карфагенського газового родовища, доповнивши наше енергопостачання прибутками з природного газу."

tex_take_the_tubeheads:0 "Підкорити Тюбголів"
tex_take_the_tubeheads_desc:0 "Тюбголи не мають нічого проти нас, але вони контролюють одну з найцінніших сил у Пустці: можливість поширювати вплив через радіо. Вони не збираються здаватися без бою — тож дамо їм його."

tex_texas_calling:0 "Техас на Зв'язку!"
tex_texas_calling_desc:0 "Радіо, телефонні лінії, передавальні станції — усе це частини мережі інформаційної інфраструктури, що може охопити увесь Техас."

tex_clear_the_way:0 "Очистити Шлях!"
tex_clear_the_way_desc:0 "Залізничне перевезення не буде безпечним, поки ми не знищимо рейдерів, а також не буде ефективним, доки ми не прокладемо зручні маршрути."

tex_build_the_trans_texan_line:0 "Побудувати Транс-Техаську Лінію"
tex_build_the_trans_texan_line_desc:0 "Пейзаж всіяний старими рейками великої залізничної мережі. Ми можемо оновити старі шляхи та збудувати нові — вшанувавши минуле, ми розчистимо дорогу в майбутнє."

tex_seize_lousiana_harbor:0 "Захопити Луїзіанський Порт"
tex_seize_lousiana_harbor_desc:0 "Наша морська проекція... далека від ідеалу. Це може стати проблемою, якщо ми зустрінемось із потужною силою в затоці. Почнемо з порту та верфей Bayou Motors."

tex_begin_shipping_in_gulf:0 "Розпочати Судноплавство в затоці"
tex_begin_shipping_in_gulf_desc:0 "Форма Мексиканської затоки дозволяє вести торгівлю з усіма державами її узбережжя — за наявності відповідних портів і кораблів."

tex_executive_matters:0 "Голова Визначає"
tex_executive_matters_desc:0 "Час зробити важливий вибір. Наш перший очільник держави увійде в підручники історії, формуючи перші кроки нашої нації."

tex_cho_bang_plan:0 "§MПлан Банга§!"
tex_cho_bang_plan_desc:0 "Банг каже переконливо: процвітаюче суспільство базується на добробуті, як це було в Лоун-Старі. Нашою головною інновацією стане багатство, якого Пустка ще не бачила."

tex_invasive_capitalism:0 "§MАгресивний Капіталізм§!"
tex_invasive_capitalism_desc:0 "Накопичення капіталу стане єдиним мірилом успіху. Конкуренція — королева ринку, і ми впровадимо її в усі аспекти техаського життя."

tex_corporate_state:0 "§MКорпоративна Держава§!"
tex_corporate_state_desc:0 "Хіба поствоєнна система не ринкова? Ті, хто адаптуються — виживають. Ті, хто опираються змінам — гинуть."

tex_measured_in_wealth:0 "§MВимірюємо Багатством§!"
tex_measured_in_wealth_desc:0 "Найбільшим чинником успіху є наявність багатства. Постійне порівняння з сусідами дозволить нам планувати майбутнє."

tex_market_expansion:0 "§MРозширення Ринку§!"
tex_market_expansion_desc:0 "Найкращий ринок — великий ринок. Ми сприятимемо інвестиціям, залучаючи навіть бідних поселенців до участі у нашій «шак-економіці»."

tex_edward_j_rusk_plan:0 "§gПлан Раска§!"
tex_edward_j_rusk_plan_desc:0 "Раск бачить ситуацію крізь військову призму. Ми оточені недовірливими сусідами, тож маємо першочергово забезпечити безпеку нашого народу."

tex_defensive_militarism:0 "§gОборонний Мілітаризм§!"
tex_defensive_militarism_desc:0 "Сильна армія — не обов’язково агресивна армія. Ми завжди готові до війни, але лише задля самозахисту."

tex_measured_in_freedom:0 "§gВимірюємо Свободою§!"
tex_measured_in_freedom_desc:0 "Ми з гордістю будуємо націю свободи та відповідальності. Вільний народ не має жити у страху. Ми поважаємо одне одного — це найголовніше."

tex_the_liberal_state:0 "§gЛіберальна Держава§!"
tex_the_liberal_state_desc:0 "Нації процвітають, коли поважають своїх громадян. Наш ліберальний устрій базується на зрозумілих правилах і підтримці самореалізації."

tex_freedom_expansion:0 "§gРозширення Свободи§!"
tex_freedom_expansion_desc:0 "Наш народ живе у свободі. Але що з тими, хто не має такої розкоші? Тирани і деспоти не просто загроза — вони причина страждань. Ми маємо обов’язок нести техаський шлях тим, хто цього потребує!"

tex_todd_plan:0 "§YПлан Тодда§!"
tex_todd_plan_desc:0 "Республіку чекають великі зміни — на виборах неочікувано переміг амбітний Тодд Гаузер! Його програма — дерегуляція, приватизація та сприятливість до бізнесу. Техас завтрашнього дня може бути геть іншим, ніж сьогоднішній..."

tex_private_texas:0 "§YПриватний Техас§!"
tex_private_texas_desc:0 "Один із перших кроків Тодда — негайна ліквідація та приватизація всіх державних служб і відомств. Звісно ж, усі підрядники — дочірні компанії Todd Co. Міськради, названі на честь мереж фастфуду, аркуші з рекламою до ваших податкових форм, пиріжки замість жетонів у реєстраційних бюро — усе це нова норма."

tex_deregulated_militia:0 "§YДобре Дерегульоване Військо§!"
tex_deregulated_militia_desc:0 "Армія, вірна 'Нації' чи 'Народу'? Це шлях до біди. Солдати мають бути вірні тому ж, що й усі інші: §GКришкам§!! Висока зарплатня, жорсткі договори та стрімке створення монополії — ось основа нової §YТехаської Військової Компанії (TMK)§!, яка вірна передусім власнику."

tex_not_so_hostile_takeover:0 "§YНе Такий Уже Й Ворожий Перехоп§!"
tex_not_so_hostile_takeover_desc:0 "Ринок Техасу — це хаос із тисяч компаній, фірм і лавок. Але жодна з них не така підступна, як ТАЗ. Жоден президент не такий безсоромний, як Тодд. Хвиля злиттів, поглинань і банкрутств сколихне націю, і ТАЗ пустить свої дроти у кожну біржу, завод і кіоск цієї великої землі."

tex_todds_triumph:0 "§YТріумф Тодда§!"
tex_todds_triumph_desc:0 "Усе йшло до цього моменту;\n\nНайвище досягнення Тодда. Його тріумф. Його Magnum Opus. Він запатентує Техас. Не тільки назву чи землю — §Yсаму ідею Техасу§!. §OE Pluribus, Unum§!; §GУ Ринку — Наша Віра.§!"

tex_keats_plan:0 "§FПлан Кітса§!"
tex_keats_plan_desc:0 "З Кітсом попереду, нарешті може постати місце, де мутанти й люди житимуть разом — об’єднані."

tex_mutant_education:0 "§FОсвіта для Мутантів§!"
tex_mutant_education_desc:0 "Мутантам потрібна освіта, не лише на наших територіях, а скрізь. Якщо вони не можуть прийти до школи — нехай школа прийде до них."

tex_mutant_troubles:0 "§FПроблема Мутантів§!"
tex_mutant_troubles_desc:0 "Жоден мутант більше не буде вважатися нижчим. Жодна розумна істота — ні."

tex_mutant_struggle:0 "§FБоротьба Мутантів§!"
tex_mutant_struggle_desc:0 "З моменту їх створення, мутанти не знаходили собі місця. Техас стане тією землею, де їхні страждання завершаться. Але для цього — ми маємо поборотись ще."

tex_mutant_democracy:0 "§FДемократія для Мутантів§!"
tex_mutant_democracy_desc:0 "Мутанти пробували все — але нічого не спрацювало. Ані Творець, ані воєнні банди. Кітс знає: §Yєдиний шлях — це демократія§!, і §Yрівність усіх під законом.§!"

tex_scarlets_plan:0 "§tПлан Скарлет§!"
tex_scarlets_plan_desc:0 "Зі Скарлет у ролі Президента стало ясно — з Техасом краще не жартувати. Кожен техасець має право на щасливе життя без страху перед рейдерами чи загарбниками."

tex_protecting_the_weak:0 "§tЗахист Слабких§!"
tex_protecting_the_weak_desc:0 "Техас мусить мати сильну армію, аби захищати всіх мешканців. На відміну від НКР, ми гарантуємо безпеку навіть тим, хто живе на самому краю нашої великої країни."

tex_of_and_for_the_people:0 "§tВід Народу і Для Народу§!"
tex_of_and_for_the_people_desc:0 "Уряд Техасу має складатися з техасців і працювати задля них. Його обов’язок — захищати свободи та привілеї народу, а не диктувати їм життя."

tex_right_to_bear_arms:0 "§tПраво Носити Зброю§!"
tex_right_to_bear_arms_desc:0 "Народ Техасу має право захищатись. У цьому дикій Пустці іноді єдина межа між вами і смертоносним клешнею — це ствол вашої гвинтівки."

tex_a_free_and_prosperous_people:0 "§tВільний і Процвітаючий Народ§!"
tex_a_free_and_prosperous_people_desc:0 "Народ Техасу має бути вільним. Держава не повинна вказувати, як людям жити — це справа громад і самих людей. Дух техаського та американського індивідуалізму, який процвітав на Заході, §Yживе далі.§!"

tex_coring_1:0 "Землі Техасу"
tex_coring_1_desc:0 "Те, що колись було Техасом, знову стане Техасом."
tex_coring_1_tt:0 "На §Y50%§! легше інтегрувати Rockets, Tubeheads і Carthage."

tex_coring_2:0 "Землі Техасу"
tex_coring_2_desc:0 "Те, що колись було Техасом, знову стане Техасом."
tex_coring_2_tt:0 "На §Y50%§! легше інтегрувати землі супермутантів та дивні джунглі."

tex_coring_3:0 "Землі Техасу"
tex_coring_3_desc:0 "Те, що колись було Техасом, знову стане Техасом."
tex_coring_3_tt:0 "На §Y50%§! легше інтегрувати Lubbock, Pecos, Carbon і Los."

tex_coring_4:0 "Землі Техасу"
tex_coring_4_desc:0 "Те, що колись було Техасом, знову стане Техасом."
tex_coring_4_tt:0 "На §Y50%§! легше інтегрувати [TLL.GetNameWithFlag] та Cypher Warband."

tex_the_last_piece:0 "Останній Шматок"
tex_the_last_piece_desc:0 "Останній завойований шматок — і ми знову такі, якими були до війни."

tex_united_once_more_almost:0 "Майже Об’єднані"
tex_united_once_more_almost_desc:0 "Після стількох завоювань, і такої кількості земель, нас вже не спинити."

tex_proper_this_time:0 "Республіка Техас"
tex_proper_this_time_desc:0 "Ми вже досить довго були тимчасовою республікою. §YПора стати справжньою.§!"

# Підказки
tex_the_ranger_model_tt:0 "Ми отримуємо доступ до потужних §YЗаконів Мобілізації§!, які застосовували §OТехаські Рейнджери§!. Наш чинний §YЗакон Мобілізації§! буде змінено, щоб відображати це:\n\n"
tex_the_merc_model_tt:0 "Ми отримуємо доступ до універсальних §YЗаконів Мобілізації§!, що їх застосовував §OЛоун Стар§!. Наш чинний §YЗакон Мобілізації§! буде змінено, щоб відображати це:\n\n"
tex_lone_star_economic_complex_tt:0 "Ми станемо на шлях формування §Oцентралізованої економічної наддержави§!, зосередженої на §Yцивільній промисловості§! по всьому Техасу.\n\n"
tex_the_protection_scheme_tt:0 "Ми станемо на шлях створення §Oсильної військової сили§!, спеціалізуючись на §Yвійськовизованих маріонеткових державах§! і §Yавтономних поселеннях§!.\n\n"
tex_texan_defence_bureau_tt:0 "Ми сформуємо «§OТехаське Бюро Оборони§!» як §YАгентство Розвідки§!. Вони почнуть із кількома §YПокращеннями Агентства§!, але без §YВідділу Криптографії§!.\n\n"
tex_manifest_destiny_effect_tt:0 "Отримати §G-15%§! зниження вартості інтеграції національних територій: §Y[TUB.GetName]§!, §Y[CAR.GetName]§!, §Y[ASS.GetName]§!, §Y[DSP.GetName]§!, §Y[GAM.GetName]§!, §Y[HRO.GetName]§!, §Y[TLL.GetName]§!, §Y[CWB.GetName]§!, §Y[PEC.GetName]§!\n\n"

