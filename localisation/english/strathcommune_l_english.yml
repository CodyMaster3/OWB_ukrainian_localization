l_english:
### Focuses
stc_canadian_origin: "Герої Революції!"
stc_canadian_origin_desc: "З часів 1812 року Канада стала першою жертвою американського імперіалізму. Але ми перемогли тоді, і ми переможемо знову."
stc_second_canadian_breakdown_of_cpf: "Розкол та зрадники"
stc_second_canadian_breakdown_of_cpf_desc: "Коли впали бомби, Канадський Народний Фронт утримував єдність нації. Але коли ми майже досягли перемоги, коли ми були так близько до величі, Верміліон піднявся. Ці зрадники майже загубили Канаду."
stc_mobilize_masses: "Заклик до боротьби!"
stc_mobilize_masses_desc: "§RКоммуна§! потребує здібних солдатів, щоб виконати волю народу і нації. Якщо ми почнемо мобілізацію та збір справжніх добровольців, готових померти за свою націю, то наша доступна сила значно зросте. \n\nХоча деякі з нашого трудового ресурсу можуть бути призвані до армії, це має бути жертва, на яку ми готові піти, щоб забезпечити майбутню безпеку наших колишніх, поневолених кордонів."
stc_mobilize_masses_trigger_tt: "Громадянська війна Канадського Народного Фронту розпочалась!"
stc_mobilize_masses2: "Офіцери народу"
stc_mobilize_masses2_desc: "Щоб створити поважну армію, ми повинні набрати офіцерів з сільської та робітничої класів, інакше обличчя революції просто стане лицемірством."
stc_mobilize_masses3: "Кров за Комуну"
stc_mobilize_masses3_desc: "Ми повинні шукати здатних чоловіків і жінок для поповнення наших лав і допомогти нам швидше мобілізуватись проти ворога. Чим більше доступних товаришів для армії, тим швидше ми зможемо створювати нові дивізії."
stc_spawn_militia: "Створення міліцій"
stc_spawn_militia_desc: "Щоб забезпечити безпеку §RКоммуни§! та її кордонів, ми повинні створити міські міліції, щоб вони боролись не лише за своє місто. Формування цілої дивізії з міських міліціонерів дозволить нам закрити одну з наших уразливих ділянок в часи війни."
stc_crash_industrialization: "Індустріальні жертви"
stc_crash_industrialization_desc: "Якщо ми маємо призвати більше чоловіків та жінок до армії, то ті, хто має промислові навички, також повинні пожертвувати собою на фабричних лініях, виробляючи озброєння та техніку для блага §RКоммуни§!."
stc_reduce_political_control: "Реформи в доктринах"
stc_reduce_political_control_desc: "Щоб підвищити ефективність нашої армії, ми повинні провести серйозні реформи в застарілих доктринах. Якщо яскраво розумні офіцери §RКоммуни§! не візьмуть на себе ініціативу з інновацій, ми відстанемо від ворогів у компетентності."
stc_penal_battalions: "Пенітенціарні батальйони"
stc_penal_battalions_desc: "Якщо наша молодь має добровільно жертвувати та кровоточити за §RКоммуну§!, чому ж не повинні ті, хто заподіяв шкоду її самому існуванню? Ми будемо шукати в’язнів, які залишились розумними і здатними, і заберемо їх до батальйонів."
stc_new_constitution: "Нова Конституція"
stc_new_constitution_desc: "Щоб §RКоммуна§! продовжувала досягати своїх цілей у боротьбі з жадібністю та капіталізмом, ми повинні почати розробку нової конституції. Якщо ми реформуємо деякі з наших застарілих законів, я впевнений, народ отримає більше довіри до надійного фундаменту нашої нації."
stc_continue_collectivization: "Продовження колективізації"
stc_continue_collectivization_desc: "Щоб сільське господарство §RКоммуни§! процвітало, ми повинні продовжити розподіляти землю серед фермерів та організовувати їх як спільні підприємства. Більше ніякі окремі барони не володітимуть великими ділянками землі, як раніше."
stc_canadian_perspective_communism: "Наш погляд"
stc_canadian_perspective_communism_desc: "Південні загарбники з нині знищеної капіталістичної держави колись намагались перемогти §RКанадський Народний Фронт§! і підкорити наш народ до модернізованої версії феодалізму. \n\nЦе була не мирна окупація, це було військовим злочином. Тисячі загинули в боротьбі з ордами катів, і ми існуємо сьогодні завдяки їхній великій жертві."
stc_centralization_disicpline: "Почати централізацію"
stc_centralization_disicpline_desc: "§RКоммуна§! повинна почати централізацію своєї влади та економіки в одних великих областях, щоб полегшити політичні дії та зробити подальші досягнення простішими. Хоча деякі розходяться з цією думкою, називаючи її анти-марксистською, їх незабаром можна буде змусити замовкнути за їхнє непокору."
stc_commisarriat: "Комісаріат"
stc_commisarriat_desc: "§RКомісаріат§! колись був військовою організацією Радянського Союзу, що допомагала заспокоїти напруженість серед його народів, просто втішаючи заворушення в його внутрішніх містах. Ми повинні відродити цю організацію для наших власних цілей, якщо ми хочемо зберегти ці колишні капіталістичні території."
str_cult_personality: "Вірні послідовники"
str_cult_personality_desc: "Деякі можуть називати палку відданість народу §RТоваришу Емі§! культом особистості. Це лише дисиденти, які намагаються приховати славні досягнення §RКоммуни§!. \n\nМи повинні почати заохочувати цих вірних послідовників, створивши моральну кампанію, що цілком присвячена висвітленню досягнень нашого народу у вигляді плакатів."
str_rise_of_amy: "Наша очільниця, наша лідерка, наша сестра"
str_rise_of_amy_desc: "Ми можемо бути слабшими, ніж раніше, але ми не зломлені. Скажіть разом з нами - Йдемо до Перемоги!"
str_big_sister: "Наша старша сестра"
str_big_sister_desc: "§RТоваришка Емі§! вже довго веде наш народ до епохи інновацій, повністю ліквідуючи бідність у §RКоммуні§! та рятуючи Канаду від подальших капіталістичних навал. \n\nТепер вона є символом §RКомунізму§! у Канаді, фігурою, якою всі мають захоплюватися, та §RСтаршою Сестрою§!, що тримає пильне око на своїй нації."
stc_gulag_mines: "ГУЛАГівські шахти"
stc_gulag_mines_desc: "Якщо наші в’язні повинні сидіти в камерах і дивитись на стелю за свої злочини проти §RКоммуни§!, то ми зробили погану роботу. Ми повинні відправити цих капіталістів і дисидентів на шахти, щоб добувати ресурси для нашої великої нації."
str_deal_with_three_rivers: "Нехай річки течуть"
str_deal_with_three_rivers_desc: "Для виживання економіки §RКоммуни§! потрібна вільна та відкрита торгівля з §4Трьома Ріками§!. Хоча ми не підтримуємо капіталістичну політику, іноді ідеологічні жертви повинні бути зроблені заради виживання."
str_deal_with_three_rivers_hostility: "Самі по собі"
str_deal_with_three_rivers_hostility_desc: "Якщо §RКоммуна§! має вижити в цю епоху відчаю, ми повинні стояти на власних ногах і відмовитись від дияволоподібних угод, які пропонують \n§4Три Ріки§! капіталісти."
stc_heavy_industry: "Індустріальна реформа"
stc_heavy_industry_desc: "Якщо ми хочемо стати титами індустрії в цих північних пустках, ми повинні забезпечити, щоб наші фабрики не виходили з ладу. Якщо ми почнемо реконструювати старі, зношені сталеливарні заводи та перепрофілюємо їх на виробництво цивільної продукції, то наша промисловість, безсумнівно, підніметься."
stc_road_construction: "Дороги до Редмонда"
stc_road_construction_desc: "Наша будівельна сила повинна почати будувати дороги, що ведуть до нашої столиці, щоб забезпечити, що наші війська і лінії постачання мають прямий доступ до столиці §RКоммуни§!."
str_stealth_armor_cache: "Сховище броні-невидимки"
str_stealth_armor_cache_desc: "Наші китайські союзники колись передали нам сховища обладнання з їх великого ресурсу. Ми повинні спробувати знайти та локалізувати одну з відсутніх поставок бронежилетів-невидимок, які мали надійти в день початку і завершення 3-ї Великої Війни."
str_tankograd: "Спадщина Химери"
str_tankograd_desc: "Танк Химера колись боровся з американськими загарбниками і був дуже ефективним у знищенні їхніх дияволів у залізних банках. Тепер ми повинні залучити наших дослідників, щоб подивитися, що вони можуть врятувати з її креслень."
stc_finish_five_year_plan: "Завершення П’ятирічного плану"
stc_finish_five_year_plan_desc: "§RП’ятирічний план§! завершено, і ми можемо, нарешті, відчути полегшення, знаючи, що наші економічні реформи пройшли без перешкод. Люди Канади запам’ятають це як початок нової ери інновацій та реформ, що мали зупинити капіталістичний наступ."
stc_four_year_plan: "Почати чотирирічний план"
stc_four_year_plan_desc: "Тепер, коли §RП’ятирічний план§! завершено, ми повинні звернути свої погляди на горизонти і почати формулювати новий план. Хоча він не повинен бути таким радикальним, ми повинні продовжити дух наших попередніх дій і зміцнити нашу економіку ще більше."
stc_power_reserves: "Відновлення енергетичних станцій"
stc_power_reserves_desc: "Лінії електропередач Канади колись випромінювали енергію та тепло. Тепер вони лежать бездушні, через них проходить мало чого, окрім вібрацій, що залишаються, коли на них сідають ворони. Якщо ми знайдемо старі енергетичні станції та приведемо їх до робочого стану, можливо, наша країна знову отримає достатньо енергії."
stc_government_controlled_salvage: "Заохочення програм утилізації"
stc_government_controlled_salvage_desc: "Якщо ми впровадимо державне управління та контрольовані програми утилізації, то ми можемо забезпечити, щоб монополія scavenger-ів на залишки колишніх великих територій Канади була зламана."
stc_glory_to_army: "Інвестиції в дослідження армії"
stc_glory_to_army_desc: "Якщо наша зброя має зрівнятися з капіталістами, ми повинні забезпечити, щоб наші науково-дослідницькі установи були зосереджені на створенні чудес у секторі озброєння, що ми зможемо використати для розвитку наших озброєнь."
str_cpf_reforged: "Люди об’єдналися"
str_cpf_reforged_desc: "Тепер, коли Канадський Народний Фронт об’єднаний під червоним прапором §RКоммуни§!, ми можемо почати асимілювати наших колишніх членів і забезпечити єдність на декілька десятиліть вперед."
stc_air_power_revitalized: "Контроль над нашими небесами"
stc_air_power_revitalized_desc: "Наші небеса колись були заповнені американськими літаками, що бомбардували наших революціонерів і вбивали тисячі цивільних осіб. Ми повинні забезпечити, щоб вони більше не захопили доступ до наших небес, інвестуючи в авіаційну техніку."
stc_supply_red_army: "Шляхи до Червоної армії"
stc_supply_red_army_desc: "Якщо наша армія має залишатись добре постаченою, вона повинна мати прямі шляхи до наших центральних оборон. Якщо наші інженерні війська почнуть будувати ці шляхи, це також може сприяти руху торгівлі в поствоєнний період."
str_hundred_flowers_bloom: "Кампанія Ста Квітів"
str_hundred_flowers_bloom_desc: "Рух 1957 року §4Ста Квітів§! закликав до критики Комуністичної партії та її політик з надією на покращення. Однак рух швидко перетворився на інструмент для придушення опозиції замість покращення недосконалих ідеалів партії. \n\nМи не будемо схожі на наших ідеологічних попередників. Статус-кво, який деспот §RTерезе§! ввів у практику, повинен бути перевернутий на голову шляхом збору справжньої думки народу через цю відновлену кампанію."
str_reverse_collectivization: "Скасування колективізації"
str_reverse_collectivization_desc: "Колективізація могла бути гарною ідеєю на папері, але на практиці вона є повним провалом. Урожай гине, і ми надмірно використовуємо матеріали через те, що фермери просто розділені на кожному питанні. \n\nМи почнемо перерозподіляти деякі з ферм компетентним працівникам та виставимо деякі на продаж."
str_dissent_in_the_ranks: "Дисиденти в лавах"
str_dissent_in_the_ranks_desc: "§GАрмія§! може стати одним з наших найбільших союзників у боротьбі проти деспота §RTерезе§!. Серед її лав є більше правих соціалістів, які не хочуть, щоб радикалізм поглинав націю. Ми повинні зв’язатися з цими людьми і дати їм зрозуміти, що для Редмонда та його сусідніх держав ще є надія."
str_focus_censorship_lifted: "Скасування цензури"
str_focus_censorship_lifted_desc: "§5Цензура§! контролювала політичні погляди нашої нації надто довго. Нам потрібно зробити крок до суспільства, яке цінує всіх своїх членів. \n\nЩоб досягти цього, ми повинні почати з розпуску таємних поліцейських агентств, які досі патрулюють вулиці."
str_sway_truckers: "Залучення вантажників"
str_sway_truckers_desc: "§OВантажники§! контролюють постачання армії і мають велику важливість у ланцюгу постачання нації. Якщо ми зможемо залучити більшість з них на наш бік, то нам буде надзвичайно легко утримувати тиранів під контролем."
str_sway_army: "Залучення армії"
str_sway_army_desc: "Дисиденти в §GАрмії§! можуть бути на нашому боці, але більшість її сил все ще підтримує статус-кво, який утримує тиранічний режим §RTерезе§!. Ми повинні таємно переконати деяких з них через наших вірних офіцерів, щоб їхня лояльність була забезпечена."
str_free_republic: "Наша вільна республіка"
str_free_republic_desc: "Тиран §RTерезе§! має бути забутий нашою незабаром вільною нацією. Ми повинні розірвати ланцюги, що зв’язують наш народ, і знищити деспота через швидкі дії в столиці, а потім встановити соціал-демократів як провідну партію. \n\n§g"Перед революцією її вважають неможливою. Після того, як вона станеться, її вважають неминучою"§! - §4Роза Люксембург§!."
stc_forgiving_the_sins: "Прощення минулих гріхів"
stc_forgiving_the_sins_desc: "Війна закінчена, але робота тільки починається! Є багато чого, що наша Головна Розпорядниця повинна виправити. Для початку потрібно простити та залишити в минулому гріхи минулого, але лише наша Старша Сестра може це зробити!"
stc_articles_of_union: "§OСтатті Союзу§!"
stc_articles_of_union_desc: "Канадський Народний Фронт був розірваний через роз’єднання та політичні агенти, які прагнули скинути нашу Старшу Сестру з її законного місця. Такої катастрофи більше не може бути при правлінні Терезії, Канада буде відновлена в її образі, кращому образі."
stc_internal_restructuring: "§OОчищення вигнанців§!"
stc_internal_restructuring_desc: "Наш союз був відновлений, і як зрадники, так і капіталісти були підкорені. Наш великий лідер, наша Старша Сестра, віддала наказ видалити ці елементи з нашої комуни. Вони будуть вигнані великою рукою нашої Головної Розпорядниці!"
stc_purging_foreign_corps: "§OНа колінах§!"
stc_purging_foreign_corps_desc: "Після всієї проливаної крові та річок свинцю ми все ще маємо багато солдатів на нашій землі, що присягали вірність зниклим прапорам. Їх потрібно відправити туди, куди були відправлені наші старі друзі в партії."
stc_seizing_production_lines: "§OПлоди нашої праці§!"
stc_seizing_production_lines_desc: "Багато фабрик, які ми втратили через ці відокремлені держави, нарешті повернулися додому. Наша економіка зросте завдяки збільшеному виробництву, поки ми відправляємо зрадників серед робітників до ГУЛАГів, де вони завжди повинні були бути."
stc_new_cadets: "§OПідростаюче майбутнє§!"
stc_new_cadets_desc: "Нам, хоч як би важко було це визнати, ми відновили націю завдяки силі наших солдатів. Саме цією силою ми утримаємо наш союз разом до кінця часу. Адже обіцянка та спільна мрія про колективізоване майбутнє — цього недостатньо."
stc_conscripts: "§OЩоб довести свою відданість§!"
stc_conscripts_desc: "Реуніфікація принесла нам землі, які були давно відрізані від Терезії та партії, на цих землях є ті, хто повинен довести свою відданість. Вони повинні показати партії та Терезії, що готові покласти свої життя на лінію за комуну, інакше вони знають, де двері."
stc_new_gulags: "§OFuel For The Fire§!"
stc_new_gulags_desc: "Сталь — це те, що змушує світ обертатися, без сталі неможливо створити гвинтівки, і без неї неможливо побудувати заводи для виробництва цих гвинтівок. Наш новий потік робочої сили дозволить нам відкрити нові металургійні заводи, які будуть працювати 24/7 без зупинок."
stc_western_supply_lines: "§OКровоносні судини§!"
stc_western_supply_lines_desc: "Наша комуна нічого не варта без своїх ліній постачання, дороги — це кровоносні судини, через які рухаються солдати. Без них ми будемо нічим, лише сидячими мішенями, поки наші вороги шикуються на наших кордонах."
stc_coal_powered_cities: "§OСерце§!"
stc_coal_powered_cities_desc: "Хоча дороги з’єднують нашу комуни, саме вугілля та його енергія забезпечують рух системи. Більш складно створювати гвинтівки, коли енергія вимкнена, а світло входить з вікон."
stc_continue_four_year_plan: "§OПерший залп§!"
stc_continue_four_year_plan_desc: "Ми почнемо розробку нашої нової Конституції з акцентом на економіку. Звісно ж, робітники повинні бути рівномірно представлені! Однак, хоча багато хто згоден продовжити Чотирирічний План, розпочатий раніше, питання в тому, як рухатися далі? Обидві сторони представили свої плани щодо зміни економічної основи комуни!"
stc_industrial_build_up: "§GЗелена економіка§!"
stc_industrial_build_up_desc: "Сорель, зірка партії, з великим завзяттям бере участь у конституційних дебатах. Його мрії про державу, що керується працівниками, зосереджені не на величезних млинах чи пекельних печах, а на землі. Ніби проповідуючи, Сорель виступає за комуни, де працівники повертаються до землі, як це було колись. Вільний працівник, наповнений багатими плодами і, звісно, присягаючий на вірність партії!"
stc_backyard_arms_factory: "§pЗадня економіка§!"
stc_backyard_arms_factory_desc: "Головна Розпорядниця Терезія висунула свій план економічного майбутнього комуни, де чорний дим виходить з кожного дому. Кожен працівник буде жити і дихати для її революції, його час буде проводитись у шахтах вдень, а ввечері він йде додому на фабрики. Вся його сутність буде передана державі, адже вони — це держава, чи не так?"
stc_communal_homes: "§OВеликий наступ§!"
stc_communal_homes_desc: "Хоча економіка завжди є болючим питанням для дебатів, головним каменем спотикання є армія. Озброєні сили комуни, а також те, хто їх контролює, є центральним елементом цієї нової конституції..."
stc_party_controlled_army: "§GЛояльні батальйони§!"
stc_party_controlled_army_desc: "Головна Розпорядниця програла дебати! Сорель та його новемберці здобули достатню підтримку в партії для того, щоб закріпити свої ідеї щодо наших збройних сил. Нова Армія національного визволення буде сформована лише з найбільш вірних солдатів."
stc_party_cadet_dominated_army: "§pСад квітів§!"
stc_party_cadet_dominated_army_desc: "У своїй безмежній мудрості наша Старша Сестра, Головна Розпорядниця Терезія, виграла дебати! Вона захистила справжній та найкращий курс для нашої нації, забезпечивши наше майбутнє Червоним загоном народного захисту! Багато хто вже почав помічати її сумнівні балачки, але це лише зерна мудрості, які ми маємо поглинути!"
stc_rural_collectivization: "§OСільська колективізація§!"
stc_rural_collectivization_desc: "Нові рівнини, які потрапили під наш контроль, готові до засіву. Вони виростять достатньо розстріляної пшениці, щоб прогодувати наші армії, не зважаючи на те, як великі вони стануть. Наш зріст буде безмежним під керівництвом нашої Старшої Сестри!"
stc_whitecourt_barons: "§OPургаємо баронів§!"
stc_whitecourt_barons_desc: "Лжекоролі Америки були очищені та вигнані з наших земель! Їхні скарби переповнені здобиччю, яку вони вкрали з рота наших людей. Давайте повернемо наші природні скарби та відновимо їх на належне місце!"
stc_loids_church: "§OЇх святі схеми§!"
stc_loids_church_desc: "Лжеслужба Лоїда майже не мала нічого цінного для нас. Однак їхні плани щодо танків — це майже чудо, вони є відмінними бойовими машинами. Вони ідеально підходять для командування під керівництвом Головної Розпорядниці Терезії."
stc_liberate_serfs: "§OЗвільнити кріпаків§!"
stc_liberate_serfs_desc: "Робітники з усіх відновлених нами земель були "звільнені" від своїх ланцюгів, але це лише пропаганда. Ці вільні кріпаки будуть відправлені на фабрики та в ГУЛАГи, щоб їхня робоча сила використовувалась ефективніше, ніж просто бігання по сільській місцевості."
stc_frontier_militia: "§OРозрізнена міліція§!"
stc_frontier_militia_desc: "Віддалені села об’єднуються в міліції, що стверджують, що вони борються за нашу Головну Розпорядницю. Хоча ми не заохочували і не навчали ці нові міліції, ми не будемо відмовляти їм у можливості покласти свої життя за Терезію."
stc_book_burnings: "§OBurn The False Words§!"
stc_book_burnings_desc: "У нашій комуні є багато книг, які не схвалені нашою партією. Деякі з них з залишків, інші ще не були очищені, але вони будуть спалені за їхні злочини проти того, що стоїть за нашою партією, за правду Терезії."
stc_the_watchers: "§OНавколо кожного кута§!"
stc_the_watchers_desc: "Діти комуни виховуються та навчаються партією, це робиться для того, щоб забезпечити їхню вірність нашій державі та Терезії. Тепер їхній час настав, вони повинні тримати очі відкритими та стежити за тими, хто виступає проти партії, не зважаючи на те, чи це родичі, чи ні."
stc_frontier_outposts: "§OЛінія Редмонда§!"
stc_frontier_outposts_desc: "Війна не є чимось новим для канадців. Будь то від американців чи від нас, ми повинні бути готові, коли вона прийде з тіней. Передові пости будуть розташовані на окраїнах нашої столиці для забезпечення її оборони, коли наступна війна настане."
stc_paper_elections: "§OЩо ховається під поверхнею§!"
stc_paper_elections_desc: "Розкол в партії зростає, оскільки Головна Розпорядниця Терезія починає приймати ще більш необґрунтовані рішення..."
stc_tide_liberation: "§OНаш приплив визволення§!"
stc_tide_liberation_desc: "Канада колись простягалася від моря до моря, маючи багато міст під своїм контролем. Тепер це лише ми, що тримаємося біля гір. Ми повинні звільнити решту нашої землі, перш ніж ще один завойовник прийде і спробує свою удачу."
stc_great_stampede: "§OBreaking The Horde§!"
stc_great_stampede_desc: "Рівнини заповнені кочівниками, які контролюють те, що по праву належить нам. Вони блукають безтурботно, але ми скоро дамо їм щось, про що варто буде турбуватися."
stc_bugs_phase_1: "§OНаш втратий місто§!"
stc_bugs_phase_1_desc: "Калгарі потрапило в руки чого? Капіталістичному ШІ? Це помилка? Не має значення, наші солдати відновлять місто з рук тих, хто його захопив. Це місто має бути в руках своїх справжніх власників."
stc_eastern_expansion: "§OСхідні розбійники§!"
stc_eastern_expansion_desc: "На сході є банди розбійників, які вкрали нашу землю та ресурси для своїх егоїстичних цілей і намірів. До ГУЛАГів вони підуть, адже наша земля знову буде нашою!"
stc_bugs_phase_2: "§OПівденні розбійники§!"
stc_bugs_phase_2_desc: "На південь лежить гірський хребет, а на його підніжжі, не знову ці жуки? Що ж, вони будуть приведені до порядку, як і всі інші, без жодних роздумів про те, ким вони насправді є."
stc_electorals: "§OЗнищити виборців§!"
stc_electorals_desc: "Так звані виборці — це лише розбійники з виглядом чогось більшого. Вони можуть бути покриті радіацією, але їх все одно зітруть під чоботом Терезії!"
stc_dirty_monarchists: "§OПривиди з минулого§!"
stc_dirty_monarchists_desc: "Ще один кошмар з нашого минулого знову з’явився. Брудні монархісти, здається, пережили бомби так само, як і ми, однак ми знаємо краще, ніж раніше. Вайткорт був лише початком, ці старі гвардійці будуть видалені, як і всі попередні."
stc_novemberists_start: "§GЗелена революція§!"
stc_novemberists_start_desc: "Так звана Велика Сестра переграла свою роль. Її кадети почали переходити межу, яка тримала нашу комуну разом. Тепер партія повинна діяти, щоб забезпечити майбутнє!"
stc_all_under_the_party: "§GВічна авангарда§!"
stc_all_under_the_party_desc: "Ідеї Чженга були домінуючою політичною теорією з моменту падіння бомб. Вони принесли стабільність у злякану землю, але також створили жадібних до влади напівбогів. Так само, як і Терезія, вони бачать себе вищими за інших, партію. Сорель може бути новим головою, але саме партія керує!"
stc_army_control_over_rural_regions: "§GНаші наглядачі§!"
stc_army_control_over_rural_regions_desc: "Сільська місцевість має найменший контроль партії, і саме там буде зосереджена основна частина нашої робочої сили. Вони патрулюватимуть рівнини та пагорби, всі злочини, незалежно від того, наскільки великі чи малі вони будуть, будуть знищені під їхнім чоботом."
stc_expand_commissar_power: "§GТверда рука партії§!"
stc_expand_commissar_power_desc: "Часи абсолютної влади голови минули, тепер будуть перевірки їхніх широких повноважень. Палата комісарів гарантуватиме, що наш новий голова не втратить контроль і не впаде в хаос знову."
stc_favored_industrialists: "§GФабрики в плуги§!"
stc_favored_industrialists_desc: "Під наглядом Терезії фабрики завжди працювали на повну потужність, але полиці були порожніми. Пил покривав тарілки наших людей, але мрії про економіку, орієнтовану на фермерство, тепер здійсняться. Сорель і, звісно, партія забезпечать, щоб ніхто не страждав від голоду."
stc_purging_local_leaders: "§GЗаміна тих, хто вже не потрібен§!"
stc_purging_local_leaders_desc: "Місцеві лідери, які колись були союзниками партії, нажилися на хабарях і корупції. Їх відправлять до ГУЛАГів і замінять новими членами, щоб забезпечити лояльність на місцях за будь-яку ціну."
stc_dissolve_people_army: "§GНаші воєнні герої§!"
stc_dissolve_people_army_desc: "Наше об’єднання завдячує народним офіцерам, але вони втратили свою корисність. Вони більше не є ніжним ланцюгом, який може зламатися при найменшому тиску. Їх замінять, як і будь-кого в такій ситуації."
stc_industrial_research: "§GПромислові прориви§!"
stc_industrial_research_desc: "Фабрики залишаються застиглими з часів до падіння бомб, ми повинні змінити це. Партії потрібно більше ресурсів, щоб розширити і повернути втрачені землі, що знаходяться в руках наших найбільших ворогів. Для початку ми повинні продовжити роботу в лабораторії."
stc_special_economic_zones: "§GЗаповнення наших скарбниць§!"
stc_special_economic_zones_desc: "Війна вимагає військового фонду, наші мрії про возз’єднання Канади здійсняться тільки тоді, коли ми зберемо достатньо капіталів для постачання наших солдатів. Фабрики були центром багатства в наших землях протягом століть, як і наші предки, ми повинні забрати багатства у старих зрадників. Відправимо капітали з фабрик у наші укріплені райони — на село."
stc_forced_service: "§GCannon Fodder§!"
stc_forced_service_desc: "Наші найкращі та найяскравіші не будуть відправлені на смерть так швидко, перша хвиля буде складатися з тих, з ким ми готові попрощатися. Партія буде використовувати деяких мешканців наших ГУЛАГів, щоб поповнити наші ряди, коли настане час."
stc_army_propaganda: "§GСлава битві§!"
stc_army_propaganda_desc: "Плакати покриють стіни кожного вуличного кута, люди повинні бути переконані, що битва варта їхнього життя. Що партія варта того, щоб за неї боротися, незалежно від того, наскільки незначні можуть бути причини, як от втрата якоїсь землі або вкраденого хліба. Вони будуть кланятися партії з посмішкою на обличчі."
stc_a_reforged_army: "§GЗброя партії§!"
stc_a_reforged_army_desc: "Щоб пережити наступну атаку від наших ворогів, буде створена нова Червона Армія, народжена з лояльності до їхньої партії. Вони будуть йти щасливо зі своїми гвинтівками і чоботами, ламаючи черепи наших ворогів без найменшого сумніву у своїх діях. Адже це воля партії для них йти в наступ."
stc_officialize_gulags: "§GПереповнені ГУЛАГи§!"
stc_officialize_gulags_desc: "Завдяки новій партійній платформі з очищення найнебезпечніших серед наших рядів, ГУЛАГи почали переповнюватися. Потрібно відкрити нові ГУЛАГи, вони дадуть нам сталь та вугілля, необхідні для нашого виробництва."
stc_liquidate_the_foreign_industries: "§GСіяти насіння§!"
stc_liquidate_the_foreign_industries_desc: "Наші статті об’єднання обіцяли нову економіку, побудовану на фермерстві, а не на сталевих заводах. Тепер ми повинні дотриматися своєї обіцянки, на відміну від Великої Сестри ми будемо піклуватися про наш народ, поки вони залишаються лояльними. Ми не можемо дозволити дурням та мрійникам тягнути нашу економіку, поки партія працює над засівом насіння."
stc_party_controlled_economy: "§GВсе йде до партії§!"
stc_party_controlled_economy_desc: "Кожен капітал, кожна фабрика повинні віддавати свої надбання партії, хабарі та корупція неприпустимі, коли наша військова скарбниця повинна постійно поповнюватися, поки вона не переповниться, як наші ГУЛАГи."
stc_cadets_start: "§pОснови для майбутнього§!"
stc_cadets_start_desc: "Партія, що відвернулася від нашої Великої Сестри, не має права утримувати свою владу, ми їх перемістимо, швидко і тихо. ГУЛАГи будуть продовжувати наповнюватися, поки партія змінюється і виправляється тими, хто має ясні очі."
stc_industry_in_blossoms_hands: "§pОрганічний розвиток§!"
stc_industry_in_blossoms_hands_desc: "Цвети тепер є основою партії, вони тепер мають остаточне слово в економіці. Вони вже почали свою роботу, місцевий розвиток, який би зайняв століття за старою системою хабарів, вже завершено. Їхній ідеалізм корисний для комуни."
stc_new_kulaks: "§pПеревертні§!"
stc_new_kulaks_desc: "Старі члени партії будуть позбавлені майна, а їхні гаманці заберуть. Однак, перш за все, їхні позиції у владі, їхні місця в економіці повинні бути усунуті, перш ніж ми зможемо остаточно розкрити їхні гаманці."
stc_empty_their_wallets: "§pВідновлення їхніх хабарів§!"
stc_empty_their_wallets_desc: "Довгий час економіка керувалася мастилом хабарів і перерозподілом капіталів. Цей час минув, перерозподіл капіталів у гаманці тих, хто перебуває при владі, завершено. Все піде в державну скарбницю, де і повинно бути."
stc_seize_the_robot_farms: "§pРоботизовані фермери§!"
stc_seize_the_robot_farms_desc: "Роботизовані фермери, що збирали врожай на півдні, були захищені корумпованими членами партії. Вони використовували їх як малу армію для того, щоб наживатися на землі. Вони будуть захоплені державою, де їм і місце."
stc_seize_the_wiring: "§pНаші власні досягнення§!"
stc_seize_the_wiring_desc: "Партія була єдиним, хто здійснював дослідження такого виду, тепер це більше не так. Їхні таємні сховища технологій були розграбовані, і тепер ці технології потраплять до рук Цветів. Вони продовжать те, що почала партія."
stc_melt_down_old_equipment: "§pПереплавка старого обладнання§!"
stc_melt_down_old_equipment_desc: "Кожна цегла нашої комуни була покладена і оплачена свинцем від наших найстаріших гвинтівок. Однак! Наша Велика Сестра знає, що ми заслуговуємо на краще! Ми повинні отримати найкраще обладнання для захисту наших спільних мрій про революцію!"
stc_repurpose_old_mansions: "§pДекаденція партії§!"
stc_repurpose_old_mansions_desc: "Розкішні квартири та маєтки оточують Редмонд. Побудовані колишніми членами партії, тепер вони переповнені солдатами Цветів. Вони перетворені на тренувальні табори та казарми для найбільш відданих Терезії!"
stc_farmhouse_foundries: "§pФермерські плавильні§!"
stc_farmhouse_foundries_desc: "Наші промислові плавильні не можуть задовольнити металеві потреби нашої Великої Сестри! Ми звертаємося до всіх, хто живе в селі, щоб перетворити свої двори на виробничі майданчики. Вони повинні переплавляти весь метал для армії Терезії!"
stc_eastern_farms: "§pНевиведені землі§!"
stc_eastern_farms_desc: "Є землі, що залишаються під контролем пустелі. Дикі бур’яни захопили їх, але буде плуг Великої Сестри, який очистить шлях! Всі вільні землі будуть перетворені на поля для вирощування разороздміну для годування людей! Ну, для тих, хто лояльний!"
stc_eastern_mines: "§pПідземні скарби§!"
stc_eastern_mines_desc: "Рятунок та металобрухт можуть лише досягти обмежених результатів у промисловості! Натомість ми повинні очищати землю від усіх цінних матеріалів для промисловості та ставити їх на службу нашій комуні!"
stc_calargy_industrialization: "§pПівденна перлина§!"
stc_calargy_industrialization_desc: "Місто, сповнене запасами з капіталістичних складів Міддлемарка, тепер буде використано для революції! Їжа, електроніка та металобрухт тепер хлинуть на північ!"
stc_resettlement: "§pНові підйомні блоки§!"
stc_resettlement_desc: "Те, що колись було капіталістичним пеклом, тепер є новим житловим комплексом для середнього робітника! Готуйтесь жити у ваших робітничих мріях у нових комунальних блоках Великої Сестри!"
stc_model_city: "§pНове Канадське місто§!"
stc_model_city_desc: "Наші робітники дивляться з захопленням на Калгарі, нове модельне місто для нашої великої комуни! Великі досягнення нашої великої голови показані у новому і покращеному місті! Побудовано для робітника їх Великою Сестрою!"
stc_end_four_year_plan: "§pНаша Велика Сестра забезпечує все§!"
stc_end_four_year_plan_desc: "Чотирирічний план був нашим орієнтиром економічного розвитку вже деякий час. Прийшов час відкласти цей старий план і дати нашій голові свободу створити нову ідею, що буде нас вести!"
stc_true_collective_economy: "§pПо книзі§!"
stc_true_collective_economy_desc: "Мрія про справжнє колективне суспільство була розділена багатьма робітниками по всьому світу, але завдяки нашій Великій Сестрі ми тепер стали моделлю цієї держави! Черги за хлібом достатньо короткі, а більшість фабрик мають потрібні матеріали! Все досить добре в нашому робітничому раю."
stc_the_peoples_red_army: "§pВийміть мотузку§!"
stc_the_peoples_red_army_desc: "Є ті, хто сумнівається в нашій великій голові, особливо в армії. Після всіх невдалих переворотів і спроб на її життя, вона забрала армію під свій контроль! Армія буде перепланована і приведена у відповідність до її волі."
stc_the_blossoms_corps: "§pКвіти для врожаю§!"
stc_the_blossoms_corps_desc: "Кадети були найбільш лояльними в нашій комуні, захищаючи нашу Голову і революцію від усіх її ворогів! Вони були перетворені на Квіти, ставши квітами революції. Щоб підвищити їхній статус ще більше, вони будуть сформовані в нові корпуси, орієнтовані і організовані навколо них!"
stc_forced_rearguard: "§pНі кроку назад§!"
stc_forced_rearguard_desc: "Ми боролися та проливали кров за нашу націю, і тому ми повинні впевнитись, що наші домівки будуть в безпеці під час нашого маршу! Поки наші головні сили на чолі з Квітами йдуть у поле, ті, хто з ГУЛАГів, стоятимуть на охороні. Вони утримуватимуть наші домівки, незалежно від того, чи хочуть вони цього!"
stc_revolutionary_bombs: "§pЗнаряддя пролетаріату§!"
stc_revolutionary_bombs_desc: "Ще з найперших днів революції, ще до війни, саморобні бомби були інструментами нашої люті. Тепер, коли ми маємо справжню революційну державу під керівництвом нашої Великої Сестри, вона наказала нам направити ці бомби проти наших ворогів!"
stc_rifle_trials: "§pБалотування робітника§!"
stc_rifle_trials_desc: "Демократії були лише провалом! Вони стверджують, що балотування звільнить вас, а наша Велика Сестра каже вам, що лише гвинтівка зможе це зробити! Нова гвинтівка, що отримала прізвисько «балотування», вже випускається для всіх наших робітників, щоб захистити їхнє право на життя!"
stc_artillery_trials: "§pПекельний вогонь Великої Сестри§!"
stc_artillery_trials_desc: "Вибухівки стали ключем до нашого успіху, тож чому б не запустити їх через голови наших ворогів! Нехай пекельний вогонь падає з небес, і ніхто не зможе нас зупинити!"
stc_military_doctrine: "§pРеволюційна тактика§!"
stc_military_doctrine_desc: "В новій армії Квітів є багато великих революційних офіцерів, але настав час обрати, якою буде наша головна доктрина!"
stc_kapastarov_plan: "§pВійна з тилу§!"
stc_kapastarov_plan_desc: "Як може ворожа армія вести війну, якщо їхні постачання вкрадені? Як вони можуть наступати на наші домівки, коли їхні згоріли до тла? Нехай наші солдати воюють в тилу, перенесемо війну до їхніх домівок!"
stc_pure_pirecing: "§pПеретворення сталі на папір§!"
stc_pure_pirecing_desc: "Наші суперники ховаються за танками, думаючи, що їхній броні нічого не загрожує! Але Велика Сестра може лише сміятися з цих невдалих спроб! Наші протитанкові гвинтівки перетворять їхні сталеві пластини на звичайний папір!"
stc_infiltrations: "§pЖиття за лініями§!"
stc_infiltrations_desc: "Найбільш досвідчені й вмотивовані солдати Квітів будуть жити на землі та крадених припасах! Вони перетворять будь-який укріплений пункт чи бункер за лінією фронту на палаючі руїни!"
stc_russanova_plan: "§pВелика Червона Армія§!"
stc_russanova_plan_desc: "Наші армії заповнять поля так, як дерева заповнюють ліс. Долини будуть затоплені, як океани, у нас буде достатньо людських ресурсів, щоб перетворити будь-які гори на руїни! Ніхто не зможе зупинити наш наступ!"
stc_mass_conscription: "§pЗброя для всіх§!"
stc_mass_conscription_desc: "Робітники заповнюють фабрики, але вони повинні бути на фронті! Відправляйте їх на поля, давайте їм гвинтівки та достатньо патронів, щоб показати свою вірність! Вони повинні довести державі, що вони вірні революції!"
stc_mass_assault: "§pЧервона хвиля§!"
stc_mass_assault_desc: "Велика Сестра відправить своїх великих послідовників на фронт, де їм і місце! Вони повинні не лише захищати свої домівки, але й саму революцію! За що ще можна боротися, як не за майбутнє вільної держави!"
stc_blovoski_plan: "§pСтальні Квіти§!"
stc_blovoski_plan_desc: "Нова броньована сила не є чимось незнайомим в Редмонді, але все ще панує страх серед старого офіцерського корпусу. Сумніви щодо їхньої лояльності будуть вигнані через волю Квітів, які віддані нашій Голові! Наша Велика Сестра не має нічого боятися, коли вони на чолі!"
stc_heavy_guns: "§pВеликі гармати Великої Сестри§!"
stc_heavy_guns_desc: "Хоча багато солдатів полягли від сили важких гармат Великої Сестри, тепер армія отримає свої власні! Вони будуть оснащені новими гарматами, придатними для того, щоб пробивати картер кожному, хто не готовий присягнути на вірність!"
stc_human_tanks: "§pБригади ртуті§!"
stc_human_tanks_desc: "Нові бригади будуть оснащені новими броньованими плитами та важкими гарматами, готовими проривати будь-яку лінію ворога! Ці нові Бригади Ртуті скоро будуть готові до фронту!"
stc_blossoms_government: "§pДержавний сад§!"
stc_blossoms_government_desc: "Протягом багатьох років КПФ навчала дітей слідувати уряду без жодних запитань. Тепер настав час зібрати врожай і поставити цих дітей на роботу в новий Політбюро."
stc_expand_watchers: "§pДомашні інформатори§!"
stc_expand_watchers_desc: "Дім колись був найвищим місцем приватності для будь-якого громадянина. Однак справжнє колективне суспільство можна досягти лише тоді, коли все віддано державі! Тепер домівки були інфільтровані найвідданішими Терезії, дітьми."
stc_child_informants: "§pРеволюційна комплаєнтність§!"
stc_child_informants_desc: "Щодня на вулицях з’являються нові плакати, особливо з новим гаслом держави – революційна комплаєнтність. Найкращий спосіб підтримати революцію – це дотримуватися вчень Великої Сестри!"
stc_expand_state_media: "§pПравда Голови§!"
stc_expand_state_media_desc: "Правда — це лише те, що надруковано для публіки, тому лише Велика Сестра має право контролювати медіа! Лише Велика Сестра може донести правильну версію правди для народу! Ми не можемо дозволити, щоб робітники заплутались!"
stc_mountain_gulags: "§pДержавний оплачуваний відпуст§!"
stc_mountain_gulags_desc: "Коли робітники сидять на своїх виробничих лініях, переважно виснажені та голодні, їм надається вибір. Продовжувати працювати або піти у державний оплачуваний відпуст. Спочатку багато хто вирішив скористатися відпусткою, думаючи, що Велика Сестра виявляє милосердя! Однак вони незабаром опинились глибоко в горах. Найменш продуктивних у нашому суспільстві потрібно змусити працювати, адже революція має бути захищена всюди!"
stc_purge_commissars: "§pРізати та спалювати§!"
stc_purge_commissars_desc: "Сільська місцевість переповнена колишніми комісарами, які втекли від нашого справедливого гніву! Тепер вони будуть очищені та спалені вогнем революції!"
stc_blossom_controlled_elections: "§pСолодка фасада§!"
stc_blossom_controlled_elections_desc: "Виборчі урни поставлені на виборчих дільницях, очікуючи на робітників! Вони повинні бути обережні, оскільки металеві урни дуже гарячі на дотик! Пожежа, що палить внизу, спричиняє деякі нещасні випадки, але це найпростіший спосіб «підрахунку» «голосів»!"
stc_sham_rights: "§pПривілеї Голови§!"
stc_sham_rights_desc: "Ми — справжня колективна держава і наступники КПФ, звісно, у нас є права! Але це лише ті права, які Велика Сестра визнала корисними для нас! Хто ще може знати краще, ніж наша велика Велика Сестра?"
stc_blossom_authority: "§pНепохитні Квіти§!"
stc_blossom_authority_desc: "Зрадницькі комісари були усунені з великою рішучістю! Тепер вони повинні бути замінені тими, хто готовий захищати державу та свою Велику Сестру! Квіти тепер стануть справжніми комісарами, готовими підтримати революцію!"
stc_ministry_state_security: "§pПосів наступного врожаю§!"
stc_ministry_state_security_desc: "Головна мета Великої Сестри в навчанні дітей була визначена як неясні цілі. Тепер їх буде затверджено під Міністерством державної безпеки! Ми посіємо насіння для нового покоління Квітів!"
stc_singular_party_state: "§pРеволюційна родина§!"
stc_singular_party_state_desc: "Наша держава — це не просто уряд, а родина! Ми всі під теплим та добрим поглядом нашої Великої Сестри! Вона завжди стежить за кожним нашим рухом, щоб переконатись, що ми будуємо найкраще життя для родини! Що б ми робили без нашої Великої Сестри?"
stc_the_partys_core: "§GСтовпи революції§!"
stc_the_partys_core_desc: "Народження нашої революції було здійснено мудрою людиною, яку підтримали його найближчі союзники, його партія. Сорель тепер очолює революцію, переводячи наше завдання з степів Альберти до озер сходу та гір заходу. Камери комісарів підтримають нашого безстрашного лідера і будуть відповідати за нього, коли це буде потрібно!"
stc_the_chambers_of_commissars: "§GНаш новий порядок§!"
stc_the_chambers_of_commissars_desc: "Революція триває від часів чергування на посаді голови, тепер партія тримає стійкий контроль над усіма аспектами суспільства. Сорель займає посаду голови, але це народ має здатність вибити підстави з-під нього."
stc_watching_the_people: "§GРука Тіні§!"
stc_watching_the_people_desc: "Тепле світло камери побачить кожного громадянина, кожну людину, кожного військовополоненого. Народний комісаріат внутрішніх справ буде постійно спостерігати за партією, щоб переконатися, що ніхто не вийде за межі, особливо на плантаціях."
stc_state_run_schools: "§GРеволюційна думка§!"
stc_state_run_schools_desc: "Культ особистості, який роздув його его у Терезі, домінував у головах дітей. Їх навчали слідувати та довіряти кожному вчинку так званої Великої Сестри, тепер ми повинні показати їм світло. Виправити їхнє промивання мізків і врятувати їх від самих себе!"
stc_state_controlled_worker_councils: "§GТримач вашого товариша§!"
stc_state_controlled_worker_councils_desc: "Камери можуть бачити лише так багато. Їхнє скляне око не може забрати зловмисників до того, як вони зможуть потрапити до наших найбільш вразливих товаришів. Ми не можемо дозволити їм знищити наступне покоління."
stc_communication_monitoring: "§GКонтроль правди§!"
stc_communication_monitoring_desc: "На кордоні армія забезпечує, щоб вся інформація була сертифікована нашими партійними чиновниками. Жоден шматок інформації не буде позначений як правдивий без схвалення партії."
stc_state_run_newspaper: "§GЩоденник Народу§!"
stc_state_run_newspaper_desc: "Люди прагнуть інформації, будь то проста плітка чи розповіді з фронту. Партія повинна заповнити цю потребу своїми власними історіями, схваленими та написаними самою партією. Нову газету буде засновано саме для наших товаришів."
stc_ministry_of_integration: "§GМіністерство інтеграції§!"
stc_ministry_of_integration_desc: "Наше відновлення Канади призвело до того, що багато людей, яких партія вважає небажаними, опинилися в наших лавах. Вони мають погляди, які суперечать нашій правді, однак ми повинні їх інтегрувати. Якщо вони залишаться на периферії, ми матимемо ще одного Тао на наших руках."
stc_fooling_the_people: "§GПисати історії в підручниках§!"
stc_fooling_the_people_desc: "Кажуть, що історія пишеться переможцями. Але це неправда. Історія пишеться тими, хто ще живий. Терезі вважала себе переможцем, пишучи історію КПФ для себе, тепер ми повинні виправити шкоду і вилікувати ракову пухлину, яку вона створила."
stc_one_party_elections: "§GПаперові вибори§!"
stc_one_party_elections_desc: "Ми обіцяли людям шанс висловити свою думку, звісно, в межах розумного. Вибори будуть організовані, з кандидатами лише від партії. Люди зможуть голосувати, але лише за тих, кого було схвалено."
stc_party_courts: "§GМолот Сореля§!"
stc_party_courts_desc: "Хоча армія та комісаріат є руками Сореля, новий Верховний суд Канади стане молотом, яким буде приноситися справедливість. Руйнувальники будуть привезені і отримають суд, на який вони так бажали, однак журі не буде. Вони будуть оцінюватися за стандартами партії."
stc_party_secret_police: "§GЧервоні Зірки Бригад§!"
stc_party_secret_police_desc: "У Терезі були кадети, молоді й енергійні виконавці, яких вона використовувала для жорстокого контролю комун. Сорель натомість матиме Червоні Зірки Бригад, для звичайних громадян це просто ще один підрозділ армії. Однак для партії це ті, хто ховаються в тінях, усуваючи кожного, хто виходить за межі."
stc_new_police_divisions: "§GКульт юридизму§!"
stc_new_police_divisions_desc: "Почуття стали основою для створення кадетів, тепер же юридизм і вірна покора партії стануть основою для формування нової поліції. Закони, написані та озвучені Сорелем, стануть наріжним каменем нашого нового юридизму."
stc_new_legal_code: "§GКонституція Сореля§!"
stc_new_legal_code_desc: "Статті Союзу були єдиним керівним документом з моменту нашого захоплення, але вони не змогли забезпечити стабільну юридичну основу. Тепер через Камери комісарів додано нові положення, що отримали назву Конституція Сореля."
stc_a_new_state: "§GО, Канада! О, Канада!§!"
stc_a_new_state_desc: "Канада відновлюється з кожною новою кампанією. Ліберація за ліберацією, наші солдати відвойовують більше території, перетворюючи її на землю для плантацій!"
stc_ministry_of_liberation: "§GЗбільшення припливу§!"
stc_ministry_of_liberation_desc: "Заклики з усієї комуни об’єдналися навколо однієї мети — реуніфікації. Сорель знає, що народ був розірваний війнами. Тепер вони вимагають зброї, щоб виступити проти наших ворогів, і це викликає занепокоєння у багатьох в партії."
stc_the_partys_rifle: "§GЛистове залізо і заклепки§!"
stc_the_partys_rifle_desc: "Історії розповідають про континент, який був поставлений під червоний прапор. Кажуть, що це була рука, зроблена з листового металу і заклепок, яка зламала спину найсміливішим. Сьогодні у нас є уламки від уряду, який нас продав, і тепер ми повинні побудувати нашу власну революційну зброю."
stc_party_red_air_force: "§GКриваві Небеса§!"
stc_party_red_air_force_desc: "Небо було блакитним занадто довго, ті янкі забрали наші небеса і скинули бомби на наших найбільш невинних. Давайте повернемо небеса, повернемо нашу землю, нехай ці небеса кровоточать червоним, як це було в давнину."
stc_new_fighters: "§GНові Жестьові Банки§!"
stc_new_fighters_desc: "Коли наші льотчики піднялися в небо проти наших супротивників у впавшій КПФ, вони жартома називали свої літаки «жестяними банками». Підсміюючись з тонких корпусів літаків і великих гармат. Тепер нам потрібні нові жестьові банки, щоб відбити наших ворогів!"
stc_new_support_equipment: "§GОпора Армії§!"
stc_new_support_equipment_desc: "Гвинтівка буде ефективною тільки якщо солдат буде нагодований і надано йому допомогу після битви. Кожен солдат отримає нову сумку з полотною начинкою, готову супроводжувати їх у бою та забезпечити їхнє виживання після поранень!"
stc_flight_school: "§GГірники для Неба§!"
stc_flight_school_desc: "Наші нові пілоти тепер готові піднятися в небо! Вони найкращі і найяскравіші представники нашої партії і забезпечать нашу грандіозну кампанію проти того, що залишилося від Америки!"
stc_tank_corps: "§GСталь та Свинець§!"
stc_tank_corps_desc: "Старі ідеї монтів відроджуються у нові танкові бригади, готові розчавити будь-яку лінію ворога! Вони стануть джерелом гордості для вашої великої нації!"
stc_stealth_corps: "§GВеликий подарунок Чена§!"
stc_stealth_corps_desc: "Коли наш уряд повернув іншу щоку і віддав нашу землю американцям, це був голова Чен і КПК, які допомогли! Тепер їхні подарунки будуть використані, щоб змінити хід подій і знищити колишні американські штати."
stc_party_doctrine: "§GДумка Партії§!"
stc_party_doctrine_desc: "Хоча технічно Сорель є головою і тому головою армії, правда набагато складніша. Справжня доктрина нашої армії буде походити не тільки від Сореля, а й від думок і бажань партії!"
stc_state_planning_commisson: "§GДержавна планувальна комісія§!"
stc_state_planning_commisson_desc: "Перетворити індустріальне пекло в зелене чудо — завдання непросте! Використовуючи потужну силу держави і партії, Державна планувальна комісія перетворить бетонний кошмар у чудову сільськогосподарську землю!"
stc_full_collective_farming: "§GЗ поля різзергрейну§!"
stc_full_collective_farming_desc: "Плантації починають розвиватися, однак ще є більше землі для ферм! Усі доступні поля будуть засіяні і посіяні насінням для створення безмежних полів різзергрейну!"
stc_focus_on_munitions: "§GЗбережена промисловість§!"
stc_focus_on_munitions_desc: "Хоча більша частина нашого індустріального сектору була знищена, одна частина залишилася непорушною. Виготовлення боєприпасів — це єдина промислова діяльність, яку ми не повинні чіпати, щоб захистити наших фермерів! А точніше — захистити нашу партію..."
stc_party_sponsored_research: "§GВідділ 4301§!"
stc_party_sponsored_research_desc: "Наш уряд складається з різноманітних і нескінченних департаментів, заповнених членами партії. Тепер буде фінансуватися новий департамент — Відділ 4301 або Державна науково-дослідна рада. Метою є поглиблення наших знань про науку, зберігаючи при цьому низький рівень корупції..."
stc_industrial_size_farms: "§GФерми на дахах§!"
stc_industrial_size_farms_desc: "Полів в самому Редмондзі не так багато, але є одне місце для фермерства — дахи! Усі великі будівлі будуть покриті зеленими садами для виробництва достатньої кількості їжі для їхніх мешканців!"
stc_intercommune_trade: "§GВідділ 5617§!"
stc_intercommune_trade_desc: "Кошти партії виснажені через роки війни і реформ, необхідно знову наповнити капітали. Відділ 5617, або Торговельна комісія, відновить міжкомунянську торгівлю!"
stc_party_made_housing: "§GБлоки для робітників§!"
stc_party_made_housing_desc: "До війни велика революційна держава розміщувала своїх робітників у грандіозних комплексах, що підходять тільки для робітників! Ці лагідно названі Блоки для робітників будуть побудовані в Редмондзі за планами до війни з сходу!"
stc_increased_taxes: "§GЇхня справедлива частка§!"
stc_increased_taxes_desc: "Збирання податків було обмежене на нових землях, але настав час відновити роботу наших податківців! Наші скарбниці потребують капіталів, щоб продовжити економічну революцію, робітники повинні платити свою справедливу частку!"
stc_party_run_economy: "§GЗелена економіка§!"
stc_party_run_economy_desc: "Ми це зробили! Наша економіка відповідає стандартам Сореля і тепер існує виключно за рахунок землі! Тепер ми більше не прив’язані до важкої промисловості і задимлених небес, а до величезних і широких полів різзергрейну!"
stc_teresse_capstone: "§pІдеальний сад§!"
stc_teresse_capstone_desc: "Канада знову сильна, вороги батьківщини на межі краху. Це заслуга Великої Сестри, її ретельно вирощені квіти марширують без зупинок, на півроти. Однак ця сила має чудову ціну — люблячий і пильний погляд Великої Сестри."
CPL_the_founding: "§RОснови визволення§!"
CPL_the_founding_desc: "Регіон Ред Дір під командуванням гнобляючого капрала Джонсона незабаром стане базою для наступної глави марксизму. Земля, повна робітників, роздавлених під черевиками мертвої системи. Але скоро вона спалахне!"
CPL_the_revolution: "§RКомпроміси заради визволення§!"
CPL_the_revolution_desc: "Наша армія вмирає у нас на очах! Нам не вистачає абсолютно всього, від порожніх банок для хліба до гвинтівок, що стріляють в повітря, як ми можемо вижити? Схоже, нам доведеться відкласти наші ідеали заради виживання..."
CPL_the_state: "§RLiberation на горизонті§!"
CPL_the_state_desc: "Час настав! Наші чоловіки мають набиті черева і заряджені гвинтівки. Не чекаймо ані секунди більше, давайте закличемо до революції, адже настав час для робітників об’єднатися!"
CPL_war_time_administration: "§RВід ідеалів до практики§!"
CPL_war_time_administration_desc: "Мрії про державу робітників стали рушійною силою нашої боротьби, але тепер хаос, що виник через це визволення, нарешті досягнув нас. Запаси хліба тануть, і середня людина страждає, оскільки ця коштовна війна триває!"
CPL_backyard_industries: "§RФерми в фабрики§!"
CPL_backyard_industries_desc: "Наша база операцій знаходиться на північному заході, де практично не було жодної індустрії. Тепер нам потрібно перетворити будь-яку будівлю, яку знайдемо, на прості фабрики, щоб виробляти кулі та гвинтівки для продовження боротьби!"
CPL_local_gun_smithes: "§RСхованка Дядька Сема§!"
CPL_local_gun_smithes_desc: "Наша КНЛА працювала на залишках від Стретха з самого початку, але тепер, коли ми просуваємось у двір Дядька Сема, наші запаси збільшуються. Схованки, зроблені Дядьком Семом, тепер потрапили нам в руки, даючи нашим військам нові боєприпаси для атак!"
CPL_farmers_in_the_field: "§RПлуг у гвинтівки§!"
CPL_farmers_in_the_field_desc: "Наші великі випробування починають приносити більше крові, ніж навіть полковник Тао передбачала. Сили КНЛА, які були підняті перед відкритим наступом на Ред Дір, виявились серйозною недооцінкою справжніх витрат. Тепер нам потрібно забрати фермерів з полів і поставити їх у бій, забрати їхні плуги і дати їм гвинтівки!"
CPL_people_army: "§RАрмія робітників§!"
CPL_people_army_desc: "Справжня привабливість наших місій та армії в тому, що вона не складається з еліти, а з простих людей! Тао сама прийшла з нетрів і тепер вона веде грандіозну хрестову похід проти Джонсона та його американських дияволів!"
CPL_military_council: "§RПравління батальйонами§!"
CPL_military_council_desc: "Збільшення земель, які не підпорядковуються КНЛА, викликало потребу в так званих Раді Офіцерів. Ново здобуті землі будуть розділені на сектори, керовані батальйонами під командуванням обраних офіцерів. Це дозволить Тао та її генеральному штабу зосередитися на більш нагальних питаннях — перемозі у війні!"
CPL_military_doctrine: "§RНові найманці§!"
CPL_military_doctrine_desc: "Чим глибше ми проникаємо в державу Джонсона, тим більше робітників хочуть приєднатися до нашої боротьби. Ми організували кращих з цих готових бійців у дві нові дивізії, готові рухатися до Ред Діра!"
CPL_new_generals: "§RГерої революції§!"
CPL_new_generals_desc: "У міру продовження боротьби солдати довели свої вміння через численні успішні бої. Два з цих солдатів стали настільки корисними у бою, що Тао особисто підвищила їх!"
CPL_revoluionary_administration: "§RВільна держава§!"
CPL_revoluionary_administration_desc: "Боротьба завершена! Ми перемогли тиранів раз і назавжди! Тепер вони більше не зможуть відправляти канадців на м’ясорубки та знущатися з нашої батьківщини! Проте це не означає, що робота завершена, вона тільки починається."
CPL_worker_congress: "§RГолос робітників§!"
CPL_worker_congress_desc: "Наша нація не буде керуватися головою, капралом чи королем. Ми будемо мати націю, яку будуть управляти робітники в новому Канадському Робітничому Конгресі. Робітники з усіх куточків нашої країни зібралися в Редмонді, щоб побудувати націю на наших ідеалах!"
CPL_revolutionary_propaganda: "§RПеремога над людьми§!"
CPL_revolutionary_propaganda_desc: "Ми правимо народом, який широко не довіряє нам після боротьби. Деякі вважають нас завойовниками або фальшивими пророками, але ми змусимо їх змінити свою думку так чи інакше!"
CPL_government_press: "§RМасова урядова пропаганда§!"
CPL_government_press_desc: "Якщо ми хочемо повернути народ на наш бік, ми повинні показати їм те, чого вони хочуть! Покажемо їм заповнені полиці та велику промисловість. Не має значення, чи підтверджує реальність це, але ми не можемо керувати бунтівним населенням."
CPL_federal_press: "§RДержавні медіа§!"
CPL_federal_press_desc: "Ми не можемо брехати робітникам, або ми не будемо кращими за Терезу! Ми повинні в крайньому випадку зробити правду легшою для сприйняття. Якщо вони не знають правди, як вони можуть правильно голосувати в Конгресі?"
CPL_industrial_communalisation: "§RВід капіталу до комуни§!"
CPL_industrial_communalisation_desc: "Боротьба зруйнувала промислову базу нашої нації. Тепер нам треба спробувати відновити те, що було втрачено під час великих пожеж та вибухів!"
CPL_sorel_rural_development: "§RФінансування фермерів§!"
CPL_sorel_rural_development_desc: "Нам доручено відбудувати націю, тому ми повинні фінансувати фермерів! Ми не можемо почати будівництво урбаністичних центрів, якщо немає хліба для годування людей чи шкіри для одягу робітників!"
CPL_sorel_backed_farmers_pact: "§RСільська колективна угода§!"
CPL_sorel_backed_farmers_pact_desc: "Комісари з сільського господарства здобули достатньо підтримки не тільки в Конгресі, але й у сільській місцевості, щоб створити те, що вони називають Сільською Колективною Угодою. Група фермерів та інших подібних працівників об’єдналася, щоб проштовхнути законопроєкт про сільський розвиток у Конгресі. Або, принаймні, це те, що вони стверджують, ці нові комісари мають багато чого довести."
CPL_thao_industrialization: "§RВідновлення промисловості§!"
CPL_thao_industrialization_desc: "Ферми і зерно марні, коли у нас недостатньо зброї для захисту від наших ворогів як всередині, так і зовні. Урбаністичні сектори - єдине місце, де можна виробляти достатньо боєприпасів для забезпечення нашого виживання!"
CPL_thao_steel_block: "§RСталева блокада§!"
CPL_thao_steel_block_desc: "Тхао, наш великий засновник, вирішила об’єднати міських і промислових робітників в так звану Сталеву Блокаду для досягнення своїх цілей в Конгресі. Мета цієї Сталевої Блокади з відновлення промислової потужності, що була втрачена, нарешті виправдала себе. Тхао та її Сталева Блокада створили та ухвалили законопроєкт про урбаністичну індустріалізацію в Конгресі."
CPL_grain_stockpiles: "§RНові методи землеробства§!"
CPL_grain_stockpiles_desc: "Наша нова держава переживає невеликий продовольчий криза, оскільки боротьба зруйнувала більшість виробництва на фермах. У цьому контексті Тхао виділила кошти для впровадження нових методів землеробства, щоб виробити достатньо хліба та покласти край кризі!"
CPL_army_reform: "§RA Справжня армія§!"
CPL_army_reform_desc: "Старий тиран використовував армію як інструмент для здійснення репресій, подібних до тих, що застосовували капіталісти. Тхао вирушила відновлювати свою армію з нуля. Має бути сила, яка захищатиме робітника!"
CPL_soltz_doctrine: "§RA Збережена армія§!"
CPL_soltz_doctrine_desc: "Колишні офіцери ризикнули підтримати Тхао, але не всі задоволені своїм вибором. Побоювання щодо реформ привели офіцерів в обійми Сільської Колективної Угоди."
CPL_thao_doctrine: "§RA Лояльні підрозділи§!"
CPL_thao_doctrine_desc: "Влада старої гвардії та їх капітанів не залишилася поза увагою Тхао. Вона розуміє, що армія починає залишати її. Проте залишаються ті, хто вірний їй. Ці солдати будуть реорганізовані в Червону гвардію."
CPL_new_rifle_trials: "§RA Гвинтівка для робітника§!"
CPL_new_rifle_trials_desc: "Кошти повинні бути виділені на нову гвинтівку, яка підходить для робітника! Більше не буде армії з випадковим набором гвинтівок, знайдених і відібраних з усіх куточків пустки!"
CPL_soltz_backed_industrialist: "§RЗаражені офіцери§!"
CPL_soltz_backed_industrialist_desc: "Найгірший кошмар Тхао нарешті став реальністю! Колишні офіцери здобули достатньо впливу в армії, щоб поширити свою владу в Конгресі. Хоча Тхао все ще тримається на вершині, її політичні суперники тепер контролюють армію."
CPL_thao_red_guard: "§RМи, скромні кілька§!"
CPL_thao_red_guard_desc: "Хоча більшість офіцерського складу йде до наших смертельних ворогів, ми, скромні та вірні, залишимося авангардом! Полковник та її меседж будуть охоронятися в Конгресі будь-якою ціною!"
CPL_favor_rural_focus: "§RЗ’єднати ферми§!"
CPL_favor_rural_focus_desc: "Хоча послання Сореля про з’єднання ферм не тільки практичне, а й чудовий політичний хід. Якщо ферми з’єднаються за допомогою великих доріг та залізниць, то Сільська Колективна Угода отримає контроль над переміщенням товарів і CPLA в нації!"
CPL_favor_urban_connections: "§RМіжштатна мережа Тхао§!"
CPL_favor_urban_connections_desc: "Тхао прагне відновити стару автомагістральну систему, яку нам принесли американці. Це була єдина річ, яку вони принесли і справді принесла користь! Міжштатна магістраль стане новою кров’ю нації, зосередженою навколо Ред-Діра, Тхао зможе забезпечити безперебійну роботу цієї дороги!"
CPL_favor_soltz_industrialists: "§RОстанні капіталісти§!"
CPL_favor_soltz_industrialists_desc: "Сорель колись займався полюванням на останніх капіталістів, але замість того, щоб вбивати їх, він дозволив їм заплатити своїми життями. Цей блок вижилих індустріалістів тепер пробрався в Конгрес, їх капітали тепер фінансують новий акт!"
CPL_favor_steel_union: "§RСталева програма§!"
CPL_favor_steel_union_desc: "Несподіване з’явлення капіталів Сореля викликало підозри у Тхао. Натомість її план щодо фінансування програми Конгресом здобуває підтримку в Конгресі. Скоро Тхао та її Сталева Блокада зможуть просувати свої цілі щодо з’єднання заводів за допомогою великої дорожньої мережі!"
CPL_overseer_of_committee: "§RНаглядач Конгресу§!"
CPL_overseer_of_committee_desc: "Для того, щоб реалізувати плани цього акту, необхідно створити комітет та наглядача, який буде стежити за його впровадженням. Хто стане цим наглядачем було питанням, але тепер дебати завершено..."
CPL_who_pays: "§RХто платить§!"
CPL_who_pays_desc: "Конгрес сперечався і сперечався, хто ж буде оплачувати цей акт. Тепер це питання вирішене, капітали зібрані і акт готовий до виконання. Час сказати їм, що вони будуть платити..."
CPL_the_month_of_chaos: "§RМісяць хаосу§!"
CPL_the_month_of_chaos_desc: "Конгрес зазнав поразки, блокування стало на заваді. Тіні починають ставати реальністю. Тхао та її місце під сонцем тепер поставлені під сумнів, більше не можна бути впевненими в її місці..."
CPL_popular_uprising: "§0Нехай підніметься чорний прапор§!"
CPL_popular_uprising_desc: "Партія сама себе зруйнувала, залишивши народ в лютий холод. Факели та вила відправили голови партії до загибелі. На їх місце прийшов лорд нетрів з Редмонду та взяв кермо влади."
CPL_anc_sieze_the_farmlands: "§0Забрати землі§!"
CPL_anc_sieze_the_farmlands_desc: "Комуна дозволила людям голодувати, вони ховали хліб для себе та своєї армії в ботах. Нові рівнини необхідні для того, щоб годувати зростаюче населення Редмонду. Федоров наказав своїм людям йти і захопити ці рівнини для себе."
CPL_anc_end_the_brigade: "§0Ще одна армія§!"
CPL_anc_end_the_brigade_desc: "Джекбутові головорізи партії були не єдиною армією в нашому регіоні. На північному сході є ще один збройний загін, що поглядає на нас із побоюванням. Федоров не може дозволити їм втручатися в наш експеримент, їх буде видалено з карти, як і партію."
CPL_anc_seize_internal_factories: "§0Забрати те, що наше§!"
CPL_anc_seize_internal_factories_desc: "Партія пожирала наші багатства, наповнюючи себе за наш рахунок. Федоров розкрив їхню військову скриню, і багатства почали текти назад до рук людей."
CPL_anc_start_army_purges: "§0Ламати Джекбут§!"
CPL_anc_start_army_purges_desc: "Залишаються вірні банди офіцерів старої гвардії. Вони бродять сільськими рівнинами, сподіваючись зібрати достатньо боєприпасів для того, щоб повернути Редмонд. Ці клоуни вже є в списку, готовому для вирішення Федоровими людьми."
CPL_anc_disarm_the_cpla: "§0Випустити їх на волю§!"
CPL_anc_disarm_the_cpla_desc: "Гулаги були в’язницями нашої землі надто довго. Багато людей були засуджені до життя в клітках, сплячи на холодному вічному мерзлоті. Тепер вони будуть звільнені, щоб вільно бродити рівнинами, як це було задумано."
CPL_anc_industrialist_trials: "§0Наш спосіб життя§!"
CPL_anc_industrialist_trials_desc: "Ми живемо не за наказами з дула зброї чи безжалісними законами, а за нашим провідним маніфестом. Якщо хочеш жити — працюй. Ніхто, хто бажає їсти, не буде голодувати, поки тримається наш маніфест."
CPL_anc_true_collective_economy: "§0Канадське диво§!"
CPL_anc_true_collective_economy_desc: "Колишні партійні теоретики мріяли про економіку, вільну від будь-якої держави, однак вони завжди не помічали, що партія сама стала державою. Тепер, коли партія була спалена до основ, економіка отримала свободу і почала діяти за своїми законами."
CPL_anc_caps_for_the_people: "§0Військовий фонд Федорова§!"
CPL_anc_caps_for_the_people_desc: "Податки скасовані, а на їх місце прийшов новий систему дани. Проте, фонд війни ще потребує поповнення. Чорна Колективна Сила не може функціонувати без капіталів, тому Федоров забезпечив їх достатню кількість."
CPL_anc_finish_the_purges: "§0Нове покоління§!"
CPL_anc_finish_the_purges_desc: "Старі офіцери були поховані і перетворені на компост, а на їх місце прийшло нове покоління лідерів. Неве Петрова, права рука Федорова з самого початку, почала використовувати свою владу. Вона командує збройними загонами, коли Федоров відсутній, займаючи місце колишнього офіцерського корпусу."
CPL_anc_black_collective_councils: "§0Ради поселенців§!"
CPL_anc_black_collective_councils_desc: "Управління на рівні регіонів стало лише спогадом для тих, хто знаходиться під владою Федорова. Тепер їх місце зайняли ради поселень, що підтримують більш локальний тип управління."
CPL_anc_intercommune_trade: "§0Торгівельні шляхи з колючим дротом§!"
CPL_anc_intercommune_trade_desc: "Дороги, обнесені колючим дротом, тепер є зв’язками між поселеннями. Колишня торгова комісія була замінена караванами, що перетинають вічну мерзлоту, молячись не стати здобиччю."
CPL_anc_collective_farms: "§0Домен плуга§!"
CPL_anc_collective_farms_desc: "Суворі та гноблючі колективізовані ферми були розбиті і повернуті людям на управління. Плуги знову перетворюють вічну мерзлоту на оброблену землю. Нові культури ростуть там, де партія забороняла їх вирощувати, що дозволяє збільшити виробництво."
CPL_anc_arm_the_populace: "§0Політика страхування§!"
CPL_anc_arm_the_populace_desc: "Федоров стає все більш параноїдальним через можливу інвазію з боку сусіднього режиму. Вони дивляться на наші землі з побоюванням і заздрістю, і для того, щоб будь-яка інвазія перетворилася на пил, кожен чоловік, жінка та дитина повинні мати гвинтівку. Вони озброяться, щоб захистити те, що було створено на холодному півночі."
CPL_anc_plowshares_and_rifles: "§0Остаточна гвинтівка§!"
CPL_anc_plowshares_and_rifles_desc: "Армія проводила випробування гвинтівок, коли ми захопили нашу націю, і тепер у нас є всі документи цих випробувань. Ми можемо завершити їхню роботу і створити остаточну гвинтівку, яку наш домен коли-небудь потребуватиме."
CPL_anc_peoples_milita: "§0Право народу§!"
CPL_anc_peoples_milita_desc: "Є фермери, сталеварники, а є і солдати. Робітники, які народжені, щоб брати до рук гвинтівки і захищати те, що належить їм. Ці робітники будуть організовані в збройні загони, готові допомогти Чорному Колективу в обороні."
CPL_anc_anti_revolutionaries_in_factories: "§0Виробничі лінії Редмонду§!"
CPL_anc_anti_revolutionaries_in_factories_desc: "Фабрики, що були покинуті під час раннього хаосу, почали заповнюватися знову. Федоров направив деяких своїх людей, щоб наглядати за відновленням цих заводів для допомоги в обороні його домену."
CPL_anc_a_free_canada: "§0Вільний кленовий лист§!"
CPL_anc_a_free_canada_desc: "Канада була місцем, де правили найжахливіші тирани. Однак ті часи минули. Канада об’єднана під владою Федорова та його Чорного Колективу, готова звільнити кожен дюйм своєї засніженої землі."
CPL_anc_backyard_industry: "§0Сіль землі§!"
CPL_anc_backyard_industry_desc: "Шахтарі є найскромнішими серед наших робітників, але вони також одні з найпродуктивніших. Вони видобувають все більше і більше сировини для нашої комуни, дозволяючи нам розірвати зв’язки з іншими воєначальниками."
CPL_anc_learning_from_the_horrors: "§0Вчитися на кровопролитті§!"
CPL_anc_learning_from_the_horrors_desc: "Минуло століття з тих пір, як Канада потрапила під чобіт різних тиранів. Ми повинні навчитися на цих століттях кровопролиття, щоб забезпечити, що більше ніколи не будемо під чоботом іншого тирана."
CPL_anc_the_dream_created: "§0Канадська доля§!"
CPL_anc_the_dream_created_desc: "Більше не буде так, щоб Канада залишалася в кайданах. Наш Чорний Колектив буде йти від моря до моря, щоб звільнити кожен дюйм канадської землі."
CPL_thao_survives_coup: "§RНевпинна річка§!"
CPL_thao_survives_coup_desc: "Кров ніколи не припиняється, хаос не мовчить, але сьогодні, сьогодні все це закінчується. Червона річка не буде зупинена якимись божевільними, безжальними покидьками, мрія продовжить жити!"
CPL_end_the_cpla: "§RНевдячні§!"
CPL_end_the_cpla_desc: "Стара гвардія намагалася грати роль короля, однак їх спроба провалилася. Тхао залишається на вершині комуни, тепер нам потрібно продовжити відновлення нашої армії."
CPL_purge_soltz_generals: "§RЇхнє право§!"
CPL_purge_soltz_generals_desc: "Коли Тхао поставила перед собою мету усунути Голову, ці солдати стояли пліч-о-пліч з нею. Клуатьє і Бержерон допомогли Тхао, і тепер їм буде надано їхнє право зайняти лідерські позиції серед інших. Приклад для всіх інших солдатів та робітників!"
CPL_expand_red_guard: "§RНаш опора§!"
CPL_expand_red_guard_desc: "Червона Гвардія довела свою вартість, перевищуючи її вагу в капіталах. Тепер вони будуть розширені, отримають більше фінансування, людських ресурсів та тренувань, щоб забезпечити безпеку комуни. Робітники не повинні боятися охорони, вони стануть символом того, як служити своїй нації."
CPL_form_the_congressional_army: "§RАрмія робітників§!"
CPL_form_the_congressional_army_desc: "Армія мала бути кулаком робітників, щоб придушити капіталістів та забезпечити мрію про державу робітників. Однак вона була спотворена, і на її місце прийде Конгресова Народна Армія, яка вірно служитиме комуні!"
CPL_end_the_industrialists: "§RКапіталістичні свині§!"
CPL_end_the_industrialists_desc: "Коли Терессе було скинуто, багато хто думав, що часи гноблення закінчилися. Однак тінь минулого все ще залишалася, як дикий павук, що кусав за ноги. Час відправити їх до пекла, де їм і місце!"
CPL_crack_the_rural_collective: "§RПомилування для рейзоргрейн§!"
CPL_crack_the_rural_collective_desc: "Фермери не просто сиділи та чекали, поки план здійсниться, вони допомагали йому. Вони підтримали армію в такій дії. Однак життя триває, робітникам все одно потрібен рейзоргрейн, і тільки ці фермери можуть виростити достатньо. Вони отримають помилування, поки поля залишаються заповненими."
CPL_expand_collective_factories: "§RВідбудова руїн§!"
CPL_expand_collective_factories_desc: "Редмонд ще не відбудувався після попелу революції, але ми чекали достатньо довго. Виробничі лінії повинні бути включені. Ми не можемо жити лише серед каменю та пилу до кінця наших днів."
CPL_form_collective_worker_industries: "§RЇжа для звіря§!"
CPL_form_collective_worker_industries_desc: "Виробничі лінії почали знову працювати, повільно повертаючись до рівня, який був до початку пожеж. Для продовження росту необхідно відкривати нові шахти та заводи, щоб забезпечити ці фабрики достатніми ресурсами для роботи без зупинок."
CPL_restoration_committee: "§RКамінь основи§!"
CPL_restoration_committee_desc: "Конгрес з самого початку був створений як центр робітничої держави. Це не мав бути голова, диктатор чи президент, хто контролює державу, а саме Конгрес. Голос кожного робітника має бути почутим!"
CPL_expand_congressional_powers: "§RПоглиблені повноваження§!"
CPL_expand_congressional_powers_desc: "Кожен законопроект, що проходить через Конгрес, розширює та зміцнює владу цього інституту. Ми не повинні дозволити комусь ставити під сумнів силу цього органу, щоб жодна змова більше не сталася."
CPL_workers_bill_of_rights: "§RЗаповіти робітників§!"
CPL_workers_bill_of_rights_desc: "Права завжди були чимось, що обіцяли кожен брехливий політик і воєначальник з часу, коли впали бомби. Канада стане домом для цих прав для всіх робітників, незалежно від їхньої галузі чи сектора!"
CPL_the_northern_president: "§RПівнічний президент§!"
CPL_the_northern_president_desc: "Багато хто заявляв про мертву титул президента, від фальшивих республік до воєначальників з великим его. Канада незабаром приєднається до цього списку, Тхао отримає титул Конгресового Президента, щоб забезпечити порядок нашого інституту."
CPL_worker_collective_economy: "§RСистема робітників§!"
CPL_worker_collective_economy_desc: "Капіталісти жували і випльовували робітників, день за днем, коли зубці гніту продовжували працювати. Ту гнобляючу руку індустріалістів було позбавлено через нашу революцію. Тепер Робітничі Ради складають кожну частину нашої системи, від базових виробничих квот до нагляду Конгресу."
CPL_steel_block: "§RАвангард§!"
CPL_steel_block_desc: "Сталева Блокада — це не що інше, як колекція представників Робітничих Рад, які об’єдналися в Конгресі. Їхній склад змінюється з кожними виборами, але їхні цілі та бажання залишаються тими самими. Вони хочуть бачити заводи живими знову."
CPL_increase_metal_production: "§RКвоти робітників§!"
CPL_increase_metal_production_desc: "Серце виробництва Редмонду було і завжди буде сталь, основа нашої економіки та нації. Щоб завершити відбудову, потрібно більше сталі, і Робітничі Ради з Металургійного Виробництва видали нові квоти для збільшення загального запасу."
CPL_civilian_production: "§RНІ чергам за хлібом§!"
CPL_civilian_production_desc: "Невдача багатьох так званих робітничих держав полягала в їхній неспроможності виробляти цивільну продукцію. Вони дозволяли полицям заповнюватися пилом, а черги за хлібом розтягувались на всю місто. Наша комуна буде іншою! Наші робітники матимуть хліб так само, як і солдати мають кулі!"
CPL_congressional_army_munitions: "§RПарламентські слухання§!"
CPL_congressional_army_munitions_desc: "Наша держава була створена в полум’ї війни та випробувана зрадниками. Ми будемо дурними, якщо не озброїмо наших солдатів кожною кулею і гвинтівкою, яку тільки зможемо виготовити. Арсенал Редмонду буде знову включено, і свинець піде!"
CPL_rural_block: "§RЗрадники§!"
CPL_rural_block_desc: "Саме фермери повернули спини нашій мрії. Вони спрямували свої гвинтівки в наші голови, готові забрати міста для власних цілей. Тхао, на відміну від них, має милосердя і надає їм другий шанс довести свою лояльність."
CPL_finish_interstate_highway: "§RЩо ми почали§!"
CPL_finish_interstate_highway_desc: "Хаос останньої змови призупинив відновлення інфраструктури. Однак дороги потрібно прокласти, а залізниці відновити, як інакше можна доставляти вантажі через нашу землю?"
CPL_expand_collective_farms: "§RДім для тих, хто страждає§!"
CPL_expand_collective_farms_desc: "Поки фабрики та дороги відновлюються, не можна забувати про ферми, дім для багатьох наших робітників. Вони живуть і дихають сільським життям, деякі з міста навіть бажають втекти з сталеварних заводів на поля рейзоргрейну."
CPL_new_irrigation: "§RНові плуги§!"
CPL_new_irrigation_desc: "Наші фермери витратили свої життя, використовуючи ті самі плуги і лопати, що й їхні діди. Якщо ми хочемо більше хліба, ми не можемо просто засіяти кожне поле, але маємо стати кращими в самій агрокультурі. Потрібно збільшити продуктивність на існуючих полях!"
CPL_reclaim_canadia_science: "§RКанадський інтелект§!"
CPL_reclaim_canadia_science_desc: "Канада колись мала процвітаючу науку, роблячи великі кроки в межах невідомого. Потім капіталісти-американці вторглися, ми стали Маленькою Америкою і втратили наш розумовий потенціал перед американськими завойовниками! Ми відновимо своє народне право!"
CPL_dismantle_league_stashes: "§RСталеві фермери§!"
CPL_dismantle_league_stashes_desc: "Часи польових робітників добігають кінця. Ми обіцяли не тільки політичну, а й економічну революцію. Що залишилося від роботів буде відправлено на поля, щоб звільнити душу робітника!"
CPL_uncle_sam_tanks: "§RЗалізні демони§!"
CPL_uncle_sam_tanks_desc: "Американці марширували в Канаду в бронеавтоматах і з танками на хвостах. Ці танки використовувалися для гноблення нас, канадців, коли не було достатньо бронеавтоматів. Ми перетворимо ці гнобляючі інструменти на наші транспортні засоби для визволення."
CPL_reinstitute_collective_medicial_care: "§RМедичне обслуговування робітників§!"
CPL_reinstitute_collective_medicial_care_desc: "Американці забрали кожен останній долар з наших робітників, якщо вони отримували травму на їхніх рабських заводах. Канада колись піклувалася про своїх громадян, і буде великим несправедливістю не відновити це після всіх цих століть."
CPL_canadian_freedom: "§RКанадська свобода§!"
CPL_canadian_freedom_desc: "Канада колись була вершиною свободи та прав на континенті. Навіть після вторгнення Америки бажання та прагнення до свободи ніколи повністю не згасло. Сьогодні нові питання щодо меж цієї свободи потрясають зали Конгресу до самих основ."
CPL_mutants_place: "§RНаші предки§!"
CPL_mutants_place_desc: "Багато хто ненавидить мутантів, вважаючи їх тими, хто працював і підкорювався американцям. Однак це наші предки, канадці, яких слід повернути їхнє законне громадянство!"
CPL_intergation_act: "§RЗакон про інтеграцію мутантів§!"
CPL_intergation_act_desc: "Після прийняття їхнього права на громадянство в Конгресі, Закон про Інтеграцію Мутантів незабаром набув чинності. Популярна Армія Конгресу тепер може призивати будь-якого мутанта в Канаді. Повні права за канадським законом більше не є питанням для мутантів, а певністю."
CPL_ghoul_knowledge: "§RЖиттєвий досвід§!"
CPL_ghoul_knowledge_desc: "Оскільки гулі практично живуть вічно, у них є знання, які вважалися втраченими після того, як впали бомби. Конгрес попросив цих гуля почати записувати все, що вони пам’ятають, щоб переконатися, що нічого більше не буде втрачено через час."
CPL_universal_pensions: "§RУніверсальні пенсії§!"
CPL_universal_pensions_desc: "Конгрес вирішив розширити свою пенсійну програму на нових громадян, вони будуть отримувати виплати за свою роботу, починаючи з підписання нової програми. Це зусилля, щоб навіть коли гулі вийдуть з робочої сили, вони отримували таку ж допомогу, як і будь-який інший робітник."
CPL_arcadian_question: "§RАмериканська спокуса§!"
CPL_arcadian_question_desc: "Аркадійці — це група, яка виникла внаслідок культурного злиття американців і канадців після століть спільного життя. Однак багато канадців вважають їх нічим іншим, як зрадниками, які повернулися спиною до нас. Тхао має інші плани!"
CPL_arcadian_work_ethic: "§RПрацездатність аркадійців§!"
CPL_arcadian_work_ethic_desc: "Аркадійці вважаються найбільш ефективними робітниками в комуні. Тепер, коли їм було надано громадянство, вони вивели це на новий рівень. Розвиток їхнього рідного міста Алікс почав набирати обертів навіть більше, ніж очікував Конгрес!"
CPL_arcadian_citizenship: "§RЗакон про інтеграцію аркадійців§!"
CPL_arcadian_citizenship_desc: "Прийняття громадянства для Аркадійців відкриває нову главу для Канади. Прийняття в Канаді все ще має пройти довгий шлях, але цей час наближається. Закон про інтеграцію почав впроваджувати постанови Конгресу на практиці."
CPL_nation_within_a_nation: "§RНація усередині нації§!"
CPL_nation_within_a_nation_desc: "Протягом тривалого часу аркадійці функціонували як нація усередині нації, маючи свої власні звичаї та правила. Тепер, коли їх інтегрували в широку популярну державу, їхні стіни поділу можуть бути зруйновані."
CPL_home_for_all_canadians: "§RДім для всіх канадців§!"
CPL_home_for_all_canadians_desc: "Канада була розколота ще до того, як впали бомби, але їхнє руйнування дало шанс на відновлення. Популярна держава Тхао стане домом для всіх, хто бажає віддано служити нескореному кленовому листу!"
CPL_rebuild_canadian_culture: "§RКанадський дух§!"
CPL_rebuild_canadian_culture_desc: "Бажання торгувати і боротися за свободу не є новим для Канади, вони хочуть торгувати один з одним і боротися за вільну націю. Цей дух не був знищений ані американцями, ані бомбами, ані Терезою, немає нічого, що могло б його вбити!"
CPL_the_new_mounties: "§RНова кіннота§!"
CPL_the_new_mounties_desc: "Королівська Канадська Кінна Поліція пообіцяла свою вірність канадському народу, але коли американці вторглися, вони не змогли захистити їх. Нова Популярна Канадська Кінна Поліція буде складатися з тих самих робітників, яких вони обіцяли захищати. Вони віддадуть свої життя за своїх товаришів-робітників, якщо це буде необхідно."
CPL_undying_maple_leaf: "§RНезламний кленовий лист§!"
CPL_undying_maple_leaf_desc: "Схід роз’єднаний і непридатний для правління над усією Канадою. Замість цього ми будемо марширувати на схід з нашими робітниками та мріями, щоб об’єднати розбитий кленовий лист. Це забере деякий час, але наша нація буде знову цілою!"
CPL_true_canadian_state: "§RСправжня Канадська держава§!"
CPL_true_canadian_state_desc: "Шестерня та кленовий лист працюють пліч-о-пліч для прогресу канадського робітника. Інші ці відокремлені держави хотіли побачити новий порядок гноблення, що тисне на спини наших робітників. Ми не потерпимо такої долі!"
CPL_solidify_the_worker_system: "§RСтворити нові ради§!"
CPL_solidify_the_worker_system_desc: "Камінь основи нашої нації — це ідея робітничої ради, органу, що складається з робітників, обраних своїми товаришами-робітниками, щоб їхні голоси були почуті. Є регіони, де ще не створено власні ради для забезпечення їхнього права виступати в Конгресі. Ми повинні відправитися в ці землі та повернути їм їхній голос!"
CPL_expand_voting_stations: "§RРозширити виборчі ділянки§!"
CPL_expand_voting_stations_desc: "Зараз більшість, якщо не всі, виборчі ділянки знаходяться в містах. Фермери та сільські робітники мають труднощі з поданням своїх голосів. Конгрес виділив достатньо бюджету, щоб розширити цю систему на сільські рівнини."
CPL_canadian_freedom_of_speech: "§RПраво на висловлювання§!"
CPL_canadian_freedom_of_speech_desc: "Канада — не Страткомуна. Це місце, де кожен має право висловлювати свою думку. Будь то в Конгресі чи на вулиці, наш популярний уряд дає кожному робітнику право сказати своє слово!"
CPL_formalize_worker_party: "§RБільше, ніж просто блоки§!"
CPL_formalize_worker_party_desc: "Конгрес був поділений на блоки з самого початку, але одна партія об’єднає обидві сторони для спільної мети. Мета — відновлення канадської державності в усіх її формах без страху знищення!"
CPL_a_true_collective_democracy: "§RПопулярна демократія§!"
CPL_a_true_collective_democracy_desc: "Недоліки американської республіки та уряду Страткомуни показали важливість справжньої популярної демократії. Наш уряд побудований на основі робітничого голосування, і саме так це буде залишатися!"
### Події
nf_strath.1.t: "Перші жертви імперії"
nf_strath.1.d: "Мексиканці, філіппінці, індійці — всі вони страждали під ярмом Америки. Але не забувайте — це Канада постраждала першою, коли вони спалили нашу столицю в 1812 році. Ми намагалися бути друзями, служачи товаришами в світових війнах, але в 21 столітті їхні вимоги до нашої нафти стали занадто великими. Щоб захистити "нашу безпеку", вони окупували нашу націю. Відсвяткувавши це як велику перемогу демократії, вони використовували бойові броні та енергетичну зброю проти цивільних, розграбували наші ресурси та використовували нас для посилення своєї військової машини. \n\nБуржуазія співпрацювала, переконана, що американці надто сильні, щоб їм протистояти — і тому опір ляг на плечі антиімперіалістичних прогресивних сил Канадського Народного Фронту. П’ятірка з Юкону, П’ятнадцятка з Квебеку та Шістка з Саскачевану — лише деякі з осередків, які завдали ударів на велику справу! Озброєні китайцями, наші партизани вигравали війну до того, як впали бомби."
nf_strath.1.a: "Ми все ще зберігаємо частину цих запасів."
nf_strath.1.b: "Дякуємо Богу, що американці не отримали все."

nf_strath.2.t: "Зрада ніколи не процвітає"
nf_strath.2.d: "Світ закінчився в 2077 році, але канадський народ не загинув. Американські окупанти намагалися вирізати феодальні князівства або втекти додому, поки канадські контрреволюціонери виступали за єдність. У наступні роки Канадський Народний Фронт об’єднав більшу частину півночі. На короткий час наша Кінна Поліція перетнула східну смугу до Манітоби. Мрія про возз’єднання була жива і добре, маси мали б бути звільнені від свого ярма. Можливо, з часом, ми могли б навіть врятувати американців.\n\nАле цього не сталося. Смерть нашого улюбленого голови Герарда призвела до тріщин у наших основах. Поділи і відхилення думок почали виникати, і великі ідеали, передані головою Цзяном, почали розмиватися. Помірковані та марні дурні почали шукати шляхи до розпаду комуни. Однак ми отримали чемпіона, коли їхні троянди почали проростати."
nf_strath.2.a: "Ми ніколи не забудемо,"
nf_strath.2.b: "І ми ніколи не пробачимо."

nf_strath.3.t: "Революція ще не програна!"
nf_strath.3.d: "Емі Тересе не була боягузкою. Вона не була солдатом, але стояла на передовій проти решток Америки. Вона переслідувала революційну справедливість проти фермерів, які виступали проти колективізації. І вона могла надихати! Вона працювала поруч з будь-яким робітником, будь-яким шахтарем, будь-яким майстром зброї. Насправді, було б складніше, дитя моє, сказати, що Емі не могла зробити! Під головуванням нашої Голови життя стало більш радісним. Люди працюють славно, пильнуючи за будь-якими руйнівниками і зрадниками. Але все ще є незадоволення. Дехто ставить під сумнів її мотиви і виступає за мирний підхід до супротивників. Для цих людей є слово — руйнівники. Ти не руйнівник, правда?\n\nСтраткомуна витратила останні десять років на проведення швидкої програми індустріалізації та колективізації, той самий підхід, що зробив Радянський Союз наддержавою до зрад нео-Бухаринців 2020-х. Під Головою Канада буде об’єднана. Канада буде вільною. І якщо є ті, хто ставить під сумнів табори, поліцію та призов? Їм просто потрібно отримати урок в революційних цінностях."
nf_strath.3.a: "Вони працюють славно на користь Народної Армії!"
nf_strath.3.b: "Вони прагнуть покращити наше життя."

nf_strath.4.t: "Вогонь на півночі"
nf_strath.4.d.strathcommune: "Що за жах! Хтось запустив старовинну ядерну зброю на півночі, біля одного з наших таборів для реабілітації, вбивши сотні. Хто міг бути таким чудовиськом? Американські бандити? Лойд, прагнучий знищити маси? Або ще якийсь зловісний чинник? [STC.GetLeader] впевнений, що це вина [LOI.GetLeader], але інші сумніваються — чи не могла вона підірвати це, щоб очистити Комуни від дисидентів? А якщо не вона, то хто? \n\n[STC.GetLeader] планує поїхати на північ, щоб розслідувати, але параноя не покидає. Якщо вона втече, чи не почнуть контрреволюціонери змови в столиці? \n\nАле інші зазначають, що в таборі перебували деякі з її найбільших ворогів; люди, які критикували велику сестру та її правління Комунною. Чи справді вона знищила б своїх людей?"
nf_strath.4.d.iron_confederacy: "Дві сотні років після їхньої загибелі Америка досі полює на Канаду. Американці колись посадили десятки ядерних бомб у піщаних родовищах нафти в Альберті, щоб пришвидшити видобуток нафти — і, схоже, деякі з цих бомб не спрацювали. До сьогодні. Лічильники Гейгера різко піднялися після вибуху, і ми всі відчули тремтіння. Можливо, це одна з старих американських бомб, що дрімала під землею? А якщо одна вибухнула, чи є ще інші?"
nf_strath.4.d.vermillion: "Ми отримали повідомлення від Залізної Конфедерації про ядерний вибух на півночі! Хтось, мабуть, підірвав щось біля одного з постів Страткомуни. Чи могла це бути [STC.GetLeader], щоб очистити своїх ворогів у драматичній фракції? Ми вважали її божевільною, але це... це занадто!"
nf_strath.4.d.other: "Що сталося? Є повідомлення про величезний вибух на півночі території [STC.GetName]. Летять звинувачення і чутки. Це була секретна зброя Комуни? Атака Вермільйонців? Або, можливо, останній подих американців? І навіть якщо відповідь є очевидною, хто зможе довіряти результатам?"
nf_strath.4.d.enclave: "Добра новина! До Великої Війни Америка надала Канаді тисячі робочих місць через Операцію "Котел", план з видобутку нафти з піщаних родовищ Альберти за допомогою тактичних ядерних боєприпасів. Одна з невикористаних бомб тільки що вибухнула. Хоча колатеральні збитки шкодують, можливо, це знак, що нафта все ще є там?"
nf_strath.4.a: "Велика Сестра розбереться з цим!"
nf_strath.4.b: "Бідні робітники."
nf_strath.4.c: "Сподіваюся, вони розберуться."
nf_strath.4.e: "Можливо, Емі все ж не так добре справляється."
nf_strath.4.enclave: "Можливо, канадці все ще потребують нашої захисту."

nf_strath.5.t: "Руйнівники"
nf_strath.5.d: "Попередні результати нашого розслідування чітко показують — атомну бомбу підірвали контрреволюційні розколоти з [LOI.Capital.GetCapitalVictoryPointName]! Давайте вимагати розслідування — якщо [LOI.GetLeader] справді невинний, він із задоволенням дозволить нам допитати її чиновників і судити їх у Народному суді. \n\nАле для Голови це лише перший крок. Жахлива жертва на півночі показує, що Розколоти, Контрреволюціонери та руйнівники не можуть бути довірені. Час об’єднати Канаду силою."
nf_strath.5.a: "Переслідувати терористів!"

nf_strath.6.t: "Очищення під іншим ім’ям"
nf_strath.6.d: "Страткомуна вимагає право допитати наше Вищий командування щодо подій на півночі. Голова має нахабство вважати, що *ми* стоїмо за цим жахом. Ми могли б здатися, щоб уникнути кровопролиття, але це відкриє нам шлях до очищення Головою і паралізує нашу армію. Але чи наважимося ми сказати "ні"? Якщо ми скажемо "ні", вона розпочне напад, прелюдію до повномасштабного вторгнення."
nf_strath.6.a: "Війна призведе тільки до варварства!"
nf_strath.6.b: "Ми будемо захищати кожен метр канадської землі!"

nf_strath.7.t: "Мир для нашої країни"
nf_strath.7.d: "[LOI.GetLeader] був готовий поступитися нашим вимогам. Хоча спочатку лідери Лойда не бажали визнавати свої злочини, після достатнього часу з Народним комісаріатом з внутрішніх справ ми змусили багатьох з них зізнатися! Велика перемога для народу, чи не так? \n\nАле, звісно, ці зізнання лише підтверджують їхню винуватість. Ми знищимо Лойдмінстер раз і назавжди, щоб зробити Канаду безпечною для справжнього соціалізму."
nf_strath.7.a: "Єдина реальна влада виходить з довгого рушниці."

nf_strath.8.t: "Арогантний ворог"
nf_strath.8.d: "[LOI.GetLeader] відмовився від наших справедливих вимог. Тепер ми стикаємося з загрозами від ворогів всередині та зовні — варварських диких, які зрадять Революцію. Час об’єднуватися та рятувати Пустку. І ми можемо почати з захоплення бази на території Лойдмінстера."
nf_strath.8.a: "Ми дивимось на явно безсилу державу."

nf_strath.9.t: "Перемога в Тофілді!"
nf_strath.9.d: "Ми зробили це! Ми захопили Толфілд, важливу базу. Крім того, ми показали, що зрадники Лойдмінстера не можуть протистояти революційному правосуддю. Боротьба ще не завершена, але скоро ми закінчимо роботу."
nf_strath.9.a: "Прискоримо наші плани!"

nf_strath.10.t: "Революційні мученики"
nf_strath.10.d: "На наше велике жаль, багато героїв Революції не пережили бій за Толфілд. Наші сили змушені були відступити, з великим розчаруванням. Але пам’ятайте, ми завжди знищували своїх ворогів, і переможемо фашистів теж."
nf_strath.10.a: "Наш шлях буде оспіваний у пісні."

nf_strath.11.t: "Революційні мученики"
nf_strath.11.d: "На наше велике жаль, багато героїв Революції не пережили бій за Толфілд. Але пам’ятайте, ми завжди знищували своїх ворогів, і переможемо фашистів теж."
nf_strath.11.a: "Наш шлях буде оспіваний у пісні."

nf_strath.12.t: "Вони не пройдуть!"
nf_strath.12.d: ""Принесіть нам яйця Емі!" — кричали чоловіки. Але, на жаль, їх у неї не було. І добре, бо інакше вона б виграла в Толфілді."
nf_strath.12.a: "Перемога для соціалізму."

nf_strath.13.t: "Вони не постаріють"
nf_strath.13.d: ""Ми всі вшановуємо героїв, які боролися в Великій Війні. Людей, які боролися за свободу і за народ. Але сумно, чи не так, що деякі з них вже не борються? Давайте покінчимо з цією фарсом і врятуємо Канаду!""
nf_strath.13.a: "Це кінець початку."

nf_strath.14.t: "Тюльпани, що ростуть зі снігу"
nf_strath.14.d: "Пожежі, що розірвали північ через давні арсенали американців, вразили серце Голови Тересси. Чи є у Руйнівників достатньо сили, щоб підірвати ядерну зброю? Чи є у них достатньо відваги, щоб зробити це так явно? Питання обертаються в її голові, поки вона сидить в своєму кабінеті, що виходить на площу Редмонда. Занурена в спіралі своїх думок, важкі черевики сил колонела Тао починають долати бруківку площі. Частини головоломки складаються одна за одною, коли перешкоди блокують доступ до головної будівлі.\n\nСвітло спалахує в її голові, коли звуки пострілів відлунюють по коридорах її будівлі. Тримаючи в руках пістолет, вона активує гучномовець, закликаючи на допомогу. Її охорона, вже в запеклому бою за укріплення, намагається дістатись до Голови. Колись білий сніг зовні тепер всіяний червоними плямами, немов сніг вирощує тюльпани."
nf_strath.14.a: "Наша Велика Сестра вижила!"
nf_strath.14.b: "Марш колонела був успішним!"

nf_strath.15.t: "Труситься Палац"
nf_strath.15.d: "Межі можливого похитнулися в Редмонді, зрадники розкрили свої карти. Вони піднялися проти нашої улюбленої Великої Сестри у марному прагненні до "демократії", але твердо стоїть Голова Тересса! Її улюблені молоді кадети відкинули заклятих загонизців Тао до забутих сторінок нашої історії. Вулиці Редмонда можуть бути порожніми з тріснутими дорогами і розірваними будівлями, але її тверда рука залишається на кермі. Трохи голоду додає характеру, наша улюблена Велика Сестра була помічена, що мугикає серед внутрішнього кола.\n\nУ коридорах, у темних тінях ховається дедалі більша тривога щодо лідерства Тересси. Хоча вона утримує трон у Редмонді, її первісна база, партія, почала сумніватися, чи не втратила вона розум. Спроба перевороту та довга виснажлива війна з відокремленими штатами сформували Терессу більше, ніж хтось може сказати. У зв’язку з цим, партія почала культивувати спадкоємця, когось, хто забезпечить спадщину революції. У фермерських районах комуни чоловік на ім’я Антуан Сорель показався піком революційної думки. Між важкими змінами на державних комунальних роботах він написав численні праці про славну революцію, що розгортається, що принесло йому увагу партії.\n\nПартія починає тріскатися по швах, Тересса вирішила, що час для нової Конституції. Так звані Статті Канадського Союзу, як вона їх назвала, будуть використані як новий старт для відновлення нашої старої землі. Партія отримала завдання створити і прийняти нову Конституцію, але з розколом на горизонті питання, хто в результаті візьме верх. Чи зможе старе керівництво партії утвердити свій контроль, чи кадети захоплять владу для своєї улюбленої Великої Сестри?"
nf_strath.15.a: "Ще багато роботи попереду!"

nf_strath.16.t: "Справа революційної душі"
nf_strath.16.d: "Вулиці Редмонда, вкриті червоними покривалами, тремтять, коли черевики поліції Голови Тересси гримлять по тротуару. Кадети, наймолодші з наших революціонерів, захоплені головою від самого її приходу до влади, даючи їй прізвисько Велика Сестра. Вони не мають нічого, окрім відданості та запалу до неї, що перевищує навіть революцію. З переворотом Тао і тепер відсутністю підтримки з боку партії, вона нарешті перейшла межу. Повільний ріст безглуздих промов і необґрунтованих наказів не був новим, однак тепер вона перетнула Рубікон.\n\nТротуар зітхає від напруження, коли черевики кадетів звертають свою помсту на двері інших партійних чиновників, ламаючи дверні рами, коли вони входять. Поки велися дебати щодо Статей Союзу, Голова Тересса створила свій список — список найвищих партійних чиновників, яких вважала ворогами революції. На вершині цього списку — сам Сорель, новий партійний чемпіон. Ідеологічна боротьба була розкрита, немов черепи нещасних чиновників, що потрапили до цього списку. Хоча кадети вважають Терессу непогрішною і всезнаючою, вона не враховує свою гординю.\n\nУ тому ж холодному зимовому повітрі, поки кадети марширують, виконуючи свої накази, Сорель і найвищі партійні чиновники готуються. Вони присвятили себе збереженню революції, чи то атомні бомби, чи то американські претенденти, чи тепер власна Голова. Міць Редмонда може бути на її боці, але у Сореля є останній козир. Поки ті кадети марширують, вбиваючи неважливих чиновників, маленький подарунок у вигляді партійної помсти тікає в будівлю Тересси. Вона ходить по кімнаті, чекаючи завершення своїх наказів, а повільний наближення смерті все ближче і ближче до неї."
nf_strath.16.a: "§ОГодинник спливає!§!"
nf_strath.16.b: "§pЗапал не спрацював?§!"

nf_strath.17.t: "Наступна кампанія"
nf_strath.17.d: "Після того, як наша перша війна за возз’єднання завершилась нашою перемогою завдяки великому лідерству в Редмонді, час возз’єднання, проте, далеченько не закінчився. Є ще так багато канадської землі в руках тих, хто не є канадцями або просто не є нами. Ми не можемо дозволити їм продовжувати їхні фальшиві уряди та окупацію нашої землі. Наші солдати та кампанії повинні ударити на схід і південь, повертаючи все, що ми втратили."
nf_strath.17.a: "Канада буде возз’єднана!"

nf_strath.18.t: "Пастухи революції"
nf_strath.18.d: "Кулі тріщать у сніговому повітрі революційної столиці, будівлі з чорними дахами відлунюють від криків жертв зрадницької Голови. Петлі затягуються, поки Сорель та його союзники плетуть інтриги за межами, на сільськогосподарських землях. Поля спотворених культур колишуться на вітрі, поки Тересса крокує в такт подарунку партії. Її бандити марширують з повною впевненістю, а по всьому місту час спливає. Домашній хлорний газ заповнює зали партійної головної будівлі.\n\nТоксичне повітря кидає всіх, хто залишився в будівлі, на коліна. Видаючи відчайдушні зітхання, кашляючи кров’ю та оболонкою шлунка, вони розривають свої горла. В безнадійній спробі деякі намагаються повзти до вікон і дверей, але їх зупиняють на місці вірні масковані люди партії. У масках з газовими фільтрами та зеленими пов’язками на рукавах вони йдуть кімната за кімнатою, виштовхуючи життя з найкращих людей Голови. Повзучи по коридору з гвинтівками націленими на кабінет Тересси, вони заходять і бачать своє творіння. Тересса лежить обличчям вниз, із стиснутим життям.\n\nЗвук пострілів відлунює назад до головної будівлі партії, де тепер стоїть Сорель з сірником у руці. Лінза їхніх газових мас світиться під горючими полум’ями, як тіла перетворюються на попіл. По всьому місту кадети перетворюються на землю і попіл для нового посівного сезону. Звичайні громадяни дивляться в шокові, коли марширують солдати, повертаючи кожний квартал за кварталом.\n\nШок від цього другого перевороту охоплює більшість громадян, вони перемовляються між собою, поки солдати продовжують маршувати. Вони дивуються, що таке особливе в цьому перевороті порівняно з переворотом Тао? Якщо вона була зрадницею, то Сорель і його партія повинні бути такими ж. Гнів починає наростати, коли громадяни починають планувати нове майбутнє для себе. Однак чи достатньо гнівних громадян, щоб запалити справжню революцію?"
nf_strath.18.a: "§GЇх немає! За Сореля! За Канаду!§!"
nf_strath.18.b: "§0Є! За Революцію! За Канаду!§!"

nf_strath.19.t: "З коренів"
nf_strath.19.d: "Тріщини на бруківці Редмонда цього прохолодного ранку продовжують стиратися під черевиками кулака партії. Армія вітає свою Голову, проходячи через центральну площу. Цей прояв підтримки показаний усім звичайним людям, що стоять на узбіччі. Шепоти з тіней продовжують зростати. Ці чутки про приховані фігури стали настільки голосними, що їх неможливо ігнорувати. Це малоймовірне джерело, з якого Тересса отримує свої поради. Глибоко в нутрі партійної машини Редмонда. Велика Голова Канадського Народного Фронту сидить перед цим маленьким, худим і масляним чоловіком, який розповідає їй про майбутній план. План, щоб усунути її, як і Тао намагався, але цього разу — за допомогою її власної партії.\n\nКоли Тересса дивиться в ці масляні очі, наповнені жадібністю та аморальністю, думаючи лише про капітали, наша Велика Сестра думає про майбутнє. Кадети або Блиски — наступний крок, вони тримають ключ до майбутнього, до возз’єднаної канадської держави. Старе керівництво сидить в своїх розкішних офісах і збирає хабарі, поки Блиски заряджають свої гвинтівки. Щоб забезпечити владу Тересси від цієї ночі до наступного апокаліпсису, Блиски будуть наділені владою. Вони штурмуватимуть офіси жирних котів і тягнутимуть їх у гулаги, як і решту їхніх зрадницьких друзів. Оскільки партія вирішила, що більше не потребує Тересси, вона більше не потребує їх.\n\nБлиски марширують по кожній вулиці, кожному провулку з націленими гвинтівками, просто чекаючи, поки щось рухнеться. Кров з колишніх партійних союзників Тересси тепер наповнює вулиці, а Сорель залишений наостанок. В чудовому прояві сили, наша блискуча Велика Сестра захопила Сореля і повісила його в центрі площі Редмонда. Навколо його тепер безжиттєвого тіла Блиски марширують, показуючи свої закривавлені уніформи та нову рішучість."
nf_strath.19.a: "Нехай наступна глава розпочнеться."

nf_strath.20.t: "Істинна думка Блиску"
nf_strath.20.d: "Погляд смерті, що його дарує наша Голова, є видовищем, яке не є рідкісним, коли йдеться про подання нових ідей. Чи то для уряду, чи для її гордості та радості — армії Блисків, будь-яка нова ідея викликає цей душу-розривний погляд смерті. На цій нараді троє офіцерів намагаються представити свої доктрини Великій Сестрі, кожен з них отримує свою душу перетворену на пил щоразу, коли вони відкривають рота. Три офіцери та три плани зараз лежать перед Терессою, кожен з них різний і унікальний, але жоден не народився з великого розуму самої Голови.\n\nПерший план, поданий сержантом Капастаровим, зосереджений на проривах у лінії ворога. Обрані підрозділи отримають найкраще з найкращого обладнання та будуть націлені на виявлення і використання слабких ланок ворога, щоб запустити революцію в їх тил. Потрапивши в їх тил, ці підрозділи діятимуть в межах ворожеї території, створюючи хаос для руйнування постачальних ліній і морального духу. Другий план, створений сержантом Руссановою, є класичним для старіших революційних держав і полягає у масовій мобілізації. Він стверджує, що революція повинна використати людські ресурси нашої комуни та змолоти ворога нашою чистою силою духу. Останній план, що відстоює сержант Бловоський, пропонує зовсім неортодоксальну ідею — створення нової танкової сили. План полягатиме у створенні нового броньованого підрозділу, що буде суперником колишніх батальйонів, які КНФ мала на свій розквіт. Однак цей план викликає побоювання, оскільки останній раз, коли Редмонд командував танковою армією, вона покинула Велику Сестру в її найважчий час, слідуючи за фальшивим пророком."
nf_strath.20.a: "Ламаймо ці лінії! Руйнуймо постачання!"
nf_strath.20.b: "Масова мобілізація? Історія довела її успіх!"
nf_strath.20.c: "Наші людські танки знищать наших ворогів!"

nf_strath.21.t: "Істинна держава авангарду"
nf_strath.21.d: "Робітники марширують до своїх виробничих ліній, їх погляди опускаються на маршуючі чоботи Блисків. Вони проходять повз своїх нових наглядачів з примушеними посмішками, наклеюючи плакати на вулицях. Полиці напівпорожні, але виробничий процес не можна переривати. Велика Голова стоїть у своєму кабінеті, дивлячись на площу Редмонда. Коли колись пульсуючий політичний центр Редмонда тепер тихий, кімнати порожні, лише охоронці Блисків залишаються стояти. Колись великі мислителі комунізму наголошували на необхідності партії авангарду, але Тересса не потребує партії, щоб захистити державу.\n\nДіти відправлені до шкіл, спонсорованих КНФ, так давно, як тільки це можливо пам’ятати. Їх навчають величі колективізації та лідера держави, тепер вони виросли і нав’язують волю своїй Великій Сестрі на своїх батьків. Вони марширують по вулицях з гвинтівкою в руках, поки їхні колись люблячі батьки йдуть на роботу, не в змозі подивитись на них. Кожен Блиск на площі дивиться і віддає честь своїй великій Голова, коли вони проходять. Кожен дитина Блиск буде охороняти державу своїх батьків, їх любляча Велика Сестра пильнувала їх, поки вони росли, а тепер вони охороняють її.\n\nПроте, поки суспільство рухається від часу, коли партія залишала Редмонд на площі, уряд стоїть на місці. Ніякі нові закони чи дії не відбуваються з часу кривавої чистки, колишній потужний клас політиків просто більше не існує. Щоб замінити стару інституцію уряду, буде побудована нова палата, що походить від Блисків. Цей новий Політичний Бюро Канади буде під командуванням Голови Тересси. Хай робітники радіють, бо їх прохання щодо управління було почуте."
nf_strath.21.a: "Хай живе Політбюро!"

nf_strath.22.t: "Палити залишки"
nf_strath.22.d: "Велика політична чистка всередині Редмонда була масштабною і призвела до закріплення влади лише за нашою великою Головою. Поза Редмондом ситуація була не такою простою. Багато колишніх партійних комісарів або були просто забуті, або помилувані від безперервного вогню гвинтівок Блисків. Цим залишкам комісарів було обіцяно їхнє життя в обмін на присягу вірності Голові. Їхні присяги насправді лише дали їм трохи часу.\n\nСільські комісари панують над своїми робітниками з посмішками на обличчях і серцем, байдужим до революції. Ці серця незабаром будуть вилікувані від цієї хвороби за допомогою невпинної волі Блисків. Їхні поля будуть звільнені від корумпованих і неправедних комісарів, хай їхні колишні сильні вотчини горять дощенту без пощади. Наша Велика Сестра не пощадить нікого, як і вони не пощадили жодного робітника від їхньої нескінченної корупції."
nf_strath.22.a: "Нехай вони просять під черевиком Голови!"

nf_strath.24.t: "Тягар корони"
nf_strath.24.d: "В самому серці революції, Редмонд майже спокійно сидить в процесі демонтажу фабрик і ковки плугів. Поля нових культур проривають замерзлу землю на півночі, ці так звані Комісарські плантації стали улюбленим проектом Сореля. Цегла з фабрик розбирається і відправляється на створення іригаційних каналів. На верху цього нового порядку стоять комісари, що керують сільським господарством, змушуючи працювати всіх — від полонених до звичайних товаришів. Коли партія просить все, ти повинен віддати більше.\n\nПоки ферми ростуть все більше, а животи комісарів все більші, Сорель поглядає через своє плече, поки тіні стають довшими. Партія можливо знайшла прихильність до нього, але народ — це інша історія. Обертовий крісло, яке стало посадою голови, змусило деяких поставити під сумнів ідеали революції. Мережа молодих ідеалістів Тересси, яка колись тримала населення під контролем, тепер зникла, тепер щось має замінити її. Новий державний апарат потрібен, щоб забезпечити лояльність людей. Якщо Сорель хоче залишитися при владі, вони не можуть дозволити бачити товсті животи комісарів."
nf_strath.24.a: "Захищати революцію!"

nf_strath.25.t: "Яскраве червоне сонце"
nf_strath.25.d: "Площа Редмонда заповнена парадними батальйонами, чоботи партії марширують у крок з новим гімном. Балкони навколо площі переповнені членами партії, що сидять як яструби, спостерігаючи за святом. Соель, Голова, стоїть на голові площі, так само як і Тересс. Нові Батальйони Червоної Зірки марширують повз, тримаючи по гвинтівці в кожній руці та сапу на плечах. Вони уособлюють нову зелену революцію, яку Соель вів партією після того, як позбувся Тересс.\n\nПоле із лезограйну зараз покрило старі промислові парки, серед них працюють фермери, за яких Соель так сильно боровся. Однак не всі з цих фермерів задоволені змінами в статусі-кво. Найновіші перехідники сумують за своїми квартирами та міським комфортом. В темряві ці фермери беруть свої сапи, заточують їх, переплавляють та виготовляють нові зброї. Хоча фабрики й закриті, боєприпаси все одно знаходять шлях до існування.\n\nЗмови та перевороти — це не новина для комуни, від Тао до нашої власної внутрішньої реорганізації, думки про зміни висіють у повітрі. В той час як вони точать свої сапи, нові Батальйони Червоної Зірки пробираються через поля. Уникаючи ферм, сільських охоронців і навіть своїх партійних комісарів. Ці думки можуть заповнювати повітря, але вони не стануть реальністю. Соель триматиме народ та партію під контролем зі своєю лояльною одиницею."
nf_strath.25.a: "Червона зірка викликатиме страх!"

nf_strath.26.t: "Земля лезограйну"
nf_strath.26.d: "Місто Редмонд тихо стоїть навіть під час пікового виробничого часу, фабрики порожні, їх виробничі лінії розібрані і перепрофільовані. Поля Канади переповнені яскраво-жовтим лезограйном. Великий візіонер цієї нової Канади — Голова Соель, визволитель індустріальних робітників і звільнювач Канади. Хоча мета Соеля — зміцнити Канаду та підтримати робітників, партія також здобула багато від революції. Дні темних фігур, що ховаються в коридорах партії, все ще далекі від забуття.\n\nТихі шепоти та політичні підриви стали такими ж звичними, як догляд за плантаціями на землі Канади. Щодня Голова Соель оглядається через плече на своїх товаришів по партії, задаючись питанням, чи не піде йому квиток. Однак, на відміну від Тересс, Соель не дозволить собі бути видаленим з революції. Батальйони Червоної Зірки патрулюють не лише поля лезограйну, але й Редмонд. Якщо тихі шепоти стануть занадто гучними, вони вступлять, щоб заткнути шум.\n\nГраниці Батальйонів Червоної Зірки мінімальні й підкоряються лише наказам самого Глави Соеля. Багато в Канаді сподіваються ніколи не побачити солдата Червоної Зірки в плоті. Навіть партійні чиновники стоять мовчки, коли солдати проходять або співають гімн надто голосно під час парадів. Стабільність Редмонда та Канади забезпечена Главою Соелем, більше не буде переворотів, вторгнень чи голодів, що охоплюють націю."
nf_strath.26.a: "Великий рятівник кленового листка!"

nf_strath.27.t: "Вимоги забутих"
nf_strath.27.d: "Соель здобув партію своєю харизмою та зверненням до мас, того самого пролетаріату, якого вони заявляли, що підтримують. Від Тао до Тересс, комуна була на межі. Плантації та новий робочий графік увійшли в нову норму на снігових рівнинах. Мрії людей були довірені Соелю та його великим обіцянкам, і тепер він знову опинився під тиском. Фермери вимагають від центрального уряду повернутися до старих земель, на яких можна працювати.\n\nЦі крики та вимоги досягли свого піку, і плантації по всій комуні загрожують страйком. У відповідь партія знову озброїла свою міліцію та підготувала кийки і чоботи. Однак перш ніж ці "собаки" могли бути випущені, було оголошено Міністерство Визволення. Без погодження з партією, Соель відповів на цей виклик, навіть не піднявши трубку. Проблему знову відсунули, а погляд партії знову піднявся. Все, що залишилось від фабрик, було відправлено на роботу, випускаючи гвинтівку за гвинтівкою."
nf_strath.27.a: "Здається, Соель не пес на повідку..."

nf_strath.28.t: "Урядова відповідність"
nf_strath.28.d: "Питання про те, як відбудувати нашу впалую державу, лягають на плечі нашої великої Голови. Зали урядового апарату Редмонда наповнені аплодисментами, коли наша Велика Сестра оголошує новий проект Конституції, повний комендантських годин, квот та бюджетів для "освітніх центрів". Усмішки на обличчях та рукостискання, ті, хто допустять, щоб їх фасади сповзли або не потиснуть руки достатньо енергійно, знайдуть себе в провулках наступними тижнями. Мета проста: усміхатися та залишатися живим.\n\nПоки бюрократи намагаються уникати погляду Великої Сестри, є ті, хто шепоче за кожним кутом. Редмонд — це місто секретів і тихих пліток. Полковник Аманда Тао відома по всій комуні своєю боротьбою з американськими окупантами на південь від нас, тільки не запитуйте, як успішною була та боротьба. Але полковник побачила тріщини в адміністрації Тересс, фермери, постачальники комуни, почали змінювати свою лояльність. Тересс обіцяла підтримку їх фермерам, коли захопила владу, але тепер лише наступає на них. Полковник почала плести свою власну політичну кар’єру.\n\nНе тільки фермери чи високопосадовці сумніваються в залізному кулаці Голови. Її власна партія почала ставити питання. Вони дивуються, з ким вона насправді? Клік Тересс здається бути окремим звіром, а партія намагається пробитися всередину. Час возз’єднання наступає знову, але хто сидітиме в Редмонді — ще невідомо, поки насіння революції починають проростати."
nf_strath.28.a: "Троянди продовжують рости..."

nf_strath.29.t: "Нескінченний обстріл"
nf_strath.29.d: "Зала партійного штабу Редмонда — це лише коректна та професійна атмосфера. Крики або будь-яка незгода вважаються неприязними для партійного чиновника, тому вони залишаються за межами залів. Зовнішні дебати спричиняють змови. Традиційне крило партії почало об’єднуватися навколо Соеля, проголосивши себе новембріанцями. В той час як Голова та її союзники об’єдналися під прапором Кадетів, вважаючи себе наступною главою революції. Нещодавнє розколювання проявилося в дебатах щодо статусу армії в Конституції.\n\nСпогади про спробу перевороту полковника Тао досі свіжі в пам’яті Тересс, адже вона наполягає на єдиному контролі над армією. Вона стверджує, що оскільки голова партії є центром революції, то вони повинні мати основний контроль над її обороною. Як можна зміцнити революцію без сили пороху? З іншого боку, Соель ретельно відбився, використовуючи страхи щодо ще одного військового перевороту. Нехай робітники володіють армією, і тримають її під контролем, щоб зберегти революцію. Це авангардна партія, що веде революцію, і тому їй потрібен свій спис.\n\nДебати можуть бути цивілізованими, але напрямок комуни залежить від того, хто зможе викласти свої погляди на папері."
nf_strath.29.a: "Ще один вибір..."

nf_strath.30.t: "Велика Сестра завжди спостерігає"
nf_strath.30.d: "Глибоко в нетрях Редмонда лежить Лісозавод, підземний бар з напіврозваленим дахом і обшарпаними стінами. Приховані за замерзлим склом, знаходяться занурені обличчя, які ведуть розмови шепотом. Вони п’ють гіркоту з домашнього спиртного, що нагадує розчинник для фарби. Вони відкривають свої справжні думки, що серед державної підтримки вважаються анти-революційними. Їхня таємна переписка закінчується фінальним тостом за невдовзі гіркий кінець Тересс. Кожне їхнє занурене обличчя зникає знову, зникаючи у снігу, наче сажа в повітрі. Однак вони не були достатньо хитрими, механічні очі держави замикаються на вулиці через Лісозавод.\n\nКожен крок дисидентів зафіксовано, камери та солдати Блоссом спостерігають за їхнім шляхом додому. Коли вони нарешті потрапляють у свої розвалюхі оселі, їх забирають з вулиць одного за одним. Глибоко вночі дисидентів виводять з ідеально вирощеного суспільства Великої Сестри. Вічна мерзлота Канади вирізана в свіжі могили для кожного дисидента. Їхні перекручені та зламані тіла сховані від революції снігом, що покриває їхні сліди.\n\nПоки дисиденти перетворюються на добриво, Велика Сестра спостерігає за стіною, покритою екранами з зеленим відтінком. Її очі швидко перелітають з одного екрану на інший, захищаючи свій сад від бур’янів. Як тільки ці підступні бур’яни проростають, вона бере свої ножиці й обрізає їх від своєї гордості та радості. Вона працює без утоми, плекаючи свою утопію. Екран почав дзвеніти, коли прийшло повідомлення про сьогоднішні події. Її очі перевіряють звіт, кожне слово зачіпає її, поки її гримаса не перетворюється на ніжну усмішку. Швидко Велика Сестра відповідає лаконічно: “Чудова робота, мої Блоссоми.”"
nf_strath.30.a: "Придушення — це свобода..."

nf_strath.31.t: "Тирани на нашому кордоні"
nf_strath.31.d: "Протягом останніх кількох годин наш кордон зі Страткомуною почав насичуватися ворожими солдатами. Земляні укріплення та вогневі позиції почали з’являтися по всьому нашому західному флангу. Однак їхні наміри досі невідомі, оскільки вони не зробили жодних прямих наступальних кроків. Чи готуються вони до війни, чи закривають свої кордони, нам доведеться реагувати відповідно."
nf_strath.31.a: "Що вони планують?"

##### КНЛА ######
nf_cpl.1.t: "Порив Червоної Ріки"
nf_cpl.1.d: "Між горами та поховане в снігу, почав зростати шепіт революції, що ставав дедалі голоснішим. Незабаром погляд Страткомуни впав на маленьке містечко Ветасківін, серце цього революційного гніву. Потім, як блискуча ідея, поширилась ідея армії, готової визволити Ред Дір з палаючими серцями та ідеями в головах. Лідер цієї армії був обраний серед селян, полковник Аманда Тао. Молода дівчина з трудолюбивої селянської родини, нащадок китайських поселенців, взяла на себе кермо революції. Мрія про визволення Спільноти була залишена в її руках.\n\nПеретинаючи кордон, Армія Популярного Визволення Спільноти осіла в прикордонних снігових землях зони американської окупації. Армія вступила з вогнем у серцях і ідеями в головах, але реальність скоро схопила армію, а також саму Тао. Армія була перевершена в двадцять разів за чисельністю, тому революцію треба було будувати з самого початку. Тао вирішила взяти ім’я Червоної Ріки, щоб не привертати до себе увагу. Проте нагальним питанням стало, як впоратися з їхнім новим домом — Фермою. Як перетворити це прикордонне містечко на революційну базу?"
nf_cpl.1.a: "Будуйте промисловість на задньому дворі!"
nf_cpl.1.b: "Збільшуйте виробництво ресурсів!"
nf_cpl.1.c: "Зосередьтесь на збільшенні людських ресурсів!"

nf_cpl.2.t: "Ціна виживання"
nf_cpl.2.d: "Місяці, проведені глибоко за лінією американської окупації, були часом лютого холоду та порожніх полів. День за днем, крок за кроком, армія втрачала людей, поки Тао трималася за замерзлі стебла пшениці. Однак удача армії робітників була збережена завдяки допомозі підпілля. Саме Олексій Сольц, бос червоно-дірського підпільного ринку, простягнув руку робітничої солідарності. Відомий як «Книжник», цей колишній бідний росіянин виборов своє місце від снігу та льоду до влади, хоча і нелегальної. Те, що стало відомим як Гірський Перехід, стало реальністю, надаючи сили армії, яка вже перебувала на межі.\n\nНевдовзі постачання хлинуло в регіон, не тільки для армії, але й для широкої північної популяції. Постійний голод півночі закінчився завдяки імпортованому хлібу, що був куплений за гроші від наркотиків, наповнюючи животи всіх робітників. Популярність Тао та її мрії зросла разом з торгівлею, її вважали чемпіонкою народу робітників. Однак часи повільного зростання та ідеологічної фокусованості наближалися до кінця.\n\nПолковник Тао ходила по вітальні сільської оселі, думаючи, як їхня мрія про революцію може здійснитися. Саме Сольц знову народив ідею, що ставала жахіттям для Джонсона. Якщо Спільнота буде вільною, треба потрясти її основи. Так народилися бомбардування. Тао, побоюючись витрат, які це накладе на робітників, ковтнула гірку пігулку, що це їх єдиний вибір. Для здійснення цих нових розширених операцій потрібно було постачання нового обладнання. Однак яке обладнання буде необхідним, ще належить вирішити."
nf_cpl.2.a: "Нам завжди потрібні нові гвинтівки!"
nf_cpl.2.b: "Нам потрібне допоміжне обладнання!"
nf_cpl.2.c: "Якщо ми будемо робити бомбардування, нам потрібні бомби..."

nf_cpl.3.t: "Голос революції"
nf_cpl.3.d: "Заклики до реформ від цього покидька Джонсона лунали на багато миль навколо. Коли в Червоно-дірську була відкрита виборча дільниця, Тао знала, що це її час діяти. Якщо Ґеллагер і його божевільні капіталістичні свині стануть основними частинами уряду, робітники назавжди загублять своє місце! Тао сказала одне слово своєму заступнику Сольцу: «Йди». За кілька хвилин кожна клітина КПЛА була активована по всьому півночі, запалюючи Спільноту.\n\nВогонь революції тепер горів з лютістю всіх робітників, яких жорстоко карали за існування. Незабаром хаос було призупинено радіо, яке тріщало, і це була сама полковник Тао.\n\n«Люди нещасного режиму Джонсона, встаньте разом з нами, вашою армією визволення! Візьміть зброю і боріться з вашим гнобителем, покажіть Червоно-дірським, що ви люди і гідні свободи та волі. Візьміть молоток, граблі чи качалку і відігнайте американців з нашої землі!»\n\nЕхо слів Тао наповнило Спільноту, призводячи до масового збільшення її чисельності. Тепер армії треба було реорганізувати ці війська, щоб відправити позбавлену загрозу назад до пекла. Однак питання полягало в тому, як організувати цю нову людську силу. Сольц бажає мобілізувати війська масово та відправляти їх хвилями для шокового ефекту. Тао, з іншого боку, хоче створити шокові підрозділи, щоб пробивати ворожі лінії. Тао є єдиним голосом революції, тому це її вибір, принаймні на цей момент."
nf_cpl.3.a: "Тао права!"
nf_cpl.3.b: "Сольц, можливо, має слушну ідею..."

nf_cpl.4.t: "Потреби теперішнього часу"
nf_cpl.4.d: "Революція і, відповідно, війна за визволення продовжувалася за межами фортеці сільської оселі Тао. День за днем наростала ціна крові, коли Тао відкривала свої ворота для все більшої кількості поранених товаришів. У ці темні дні правда про те, що коштує свобода, ставала очевидною на полі бою і на фронті. Розширення з грубо організованої групи повстанців на пагорбах до справжньої організації призвело до суперечок про те, як керувати всім цим. Більше не полковник командує військами в маленьких клітинах, але на величезних просторах землі, заповнених голодними та бездомними цивільними.\n\nСеред цих страждаючих цивільних є один чоловік, молодий фермер, який організував робочі графіки та продуктивні ферми, і він звернувся безпосередньо до Тао. Це Антуан Соель, який прийшов до сільської оселі, щоб благати про будь-яке урядування. Він стверджує, що сільські громади — це жахіття, переповнені вогнем і кров’ю. Полки порожні, і люди починають переосмислювати свою вірність. Щоб підтвердити цю реальність, Соель приніс з собою фотографії, хоч і грубо зроблені, але вони підтверджують його правду.\n\nТао, відкидаючись назад на своєму кріслі, переглядала фотографії, змушуючи себе бачити реальність страждань, що поступово розбивала її мрію. У приступі люті полковник піднялася на ноги, жбурляючи фотографії в куток, за ними полетіла пляшка води через вікно. Відновивши себе, вона повернулася до Соеля, який тепер відступив до дверного прорізу. Простягнувши руку, Тао потисла переляканому Соелю, обіцяючи, що буде створено цивільний уряд для того, щоб ці жахи припинилися. Спокійний, але ще шокований, Соель забрав свої обіцянки і почав виходити з оселі."
nf_cpl.4.a: "Час діяти, але не лише з гвинтівками."

nf_cpl.5.t: "Від попелу до утопії"
nf_cpl.5.d: "Столиця червоних мрій Канади про революцію лежить у руїнах, будівлі Редмонда тепер є простими купами уламків. Щілини і розриви в руїнах випускають вогонь, що здіймається в ранкове небо. Димові сліди і ранкова роса борються за місце, поки остаточні ехо дрібнокаліберного вогню затихають. Тересс і її колишні прихильники відпочивають серед знищених бастіонів, приречені на ту саму долю, що й сотні, яких колись очистила під її наглядом. Сама «Велика Сестра» тепер стала не більше, ніж напівзгорілим трупом, запеченим у кам’яних бруківках, пробитих кулями.\n\nБудівля капітолію, чудова фасада робітничої демократії. Спочатку звеличена як свобода Канади проти гноблення Америки, тепер була викривлена і зламана Тересс для її мрій про владу. Полковник Тао, канадська героїня війни, тепер стоїть біля зруйнованих цеглин, що колись утворювали її величезні сходи. Її вірні солдати оточують її, коли новий прапор для нової Канади здіймається високо в небі. Ласкаві вигуки та святкові пісні наповнюють вуха солдатів і громадян. Святкування вирували серед обагрених кров’ю вулиць, коротка пауза перед тим, як місто доведеться відбудовувати цегла за цеглою. Таким самим чином, революція, потрощена та обгоріла, як і місто, потребуватиме власної реконструкції."
nf_cpl.5.a: "Цікаво, скільки цеглин потрібно?"

nf_cpl.6.t: "Плакати майбутнього"
nf_cpl.6.d: "Випалена обгортка колишньої будівлі капітолію тепер перетворена на жваву конгресову залу. Гноблення та залізні обмеження були замінені на гарячі дебати щодо використання кожного капітала. Хоча обіцянка Тао щодо перевороту на більш демократичну систему була виконана, віра народу була потрясена. Їх стабільні повсякденні несправедливості тепер замінені на френи між тимчасовими свободами. Кожен громадянин проходить повз нову конгресову залу, відчуваючи занепокоєння щодо нового уряду. Цей страх стає натхненням для Конгресу друкувати надійні плакати, щоб підняти дух громадян.\n\nІдея швидко була перетворена в законопроект, який пройшов численні робітничі комітети і зрештою потрапив на голосування в Конгресі. Впевненість Тао в законопроекті зросла, коли її оточили вірні представники сталеливарних заводів. Однак представники сільських районів рішуче заблокували голосування, наголошуючи на можливих асоціаціях з політиками в стилі Тересс. Незабаром зала Конгресу перетворилася на божевільню, де сперечалися про моральність пропаганди. День закінчився рівним голосуванням, коли Конгрес поділився між двома законопроектами і двома різними медіапропозиціями. Оскільки Тао очолює Конгрес, їй тепер потрібно вирішити найкращий шлях дій."
nf_cpl.6.a: "Болі демократії!"

nf_cpl.7.t: "Цегла за цеглою"
nf_cpl.7.d: "Переворот залишив промисловий сектор більше схожим на кратер, ніж на щось інше. Редмонд і навколишні міста зазнали найбільших пошкоджень, оскільки вони були колишніми урядовими бастіонами. В результаті Конгресу доведеться зібрати уламки і створити нову економіку з диму та руїн. Різноманітність представників лише ускладнює це завдання. Представники сільських районів, чиє сільськогосподарське виробництво залишилося майже недоторканим, тепер сперечаються за більшу частину бюджету Конгресу. Вони наводять численні особисті несправедливості, фальшиві ув’язнення та несправедливу екстракцію зерна колишнім урядом як минулі гріхи, що потребують належної спокути.\n\nКупи документів з колишнього офісу Тересс лінійно покривають стіни Конгресу. Кожен злочин, вчинений проти фермерів, детально перелічено і організовано, що підсилює їхні крики про несправедливість. На яскравий контраст, представники міст і фабрик просто вказують через вікно. З трибуни Конгресу вони показують кожну тріщину і зруйновану будівлю, всі знищені машини і, врешті-решт, кожне місце на фабриках, що тепер стоїть порожнім без живого робітника. Як години минають, страх безвиході знову стає реальністю. Тепер Тао доведеться скористатися своїми виконавчими повноваженнями, щоб вирішити це питання, без сумнівів залишивши одну зі сторін обуреною її рішенням."
nf_cpl.7.a: "Конгрес розпадається!"

nf_cpl.8.t: "Від терористів до визволителів"
nf_cpl.8.d: "Цегла за цеглою місто загоюється під наглядом Конгресу. Вулиці, тепер очищені від уламків і барикад, стоять як свідчення досягнень Тао. Однак її колишня лояльна армія почала розкладатися прямо на її очах. Її колишнє ретельне управління армією було замінене відсутністю, оскільки вона намагається впорядкувати Конгрес. У цій порожнечі старші офіцери почали звикати до своєї нової свободи, майже дикі в межах Редмонда. Їхні колишні акуратні казарми перетворилися на притони розпусти, заповнені саморобними напоями та наркотиками.\n\nВимагання і підступні угоди стали нормою, а старші офіцери використовують ці неправедно отримані гроші для фінансування свого способу життя. Тао, відчайдушно прагнучи реформ, невтомно веде переговори з представниками Конгресу. Однак її обіцянки підтримки з боку Конгресу залишаються без відповіді, оскільки вони заблоковані капіталами від корумпованих офіцерів. Це питання стало болотом для Тао, що заважає її необхідним реформам на кожному кроці. Тао стає все більш паранояльною, коли проблема зрештою потрапляє на фінальне голосування в Конгресі. Лякаючись найгіршого, Тао непомітно додала пункт, який створить новий батальйон армії — Червону Гвардію, щоб забезпечити її позицію. Однак ухвалення такої страхової підписки залишалося похованим у надії на прийняття її законопроекту в Конгресі."
nf_cpl.8.a: "Тіні ховають багато."

nf_cpl.9.t: "Вічно зростаючі тріщини"
nf_cpl.9.d: "Конгрес повільно зупиняється, оскільки різниці в революційній коаліції зростають щогодини. В такому кліматі, пропозиція Закону про розвиток інфраструктури перетворилася з законопроекту про дороги на основний законопроект Конгресу. Лінії в піску були проведені між урбаністським табором Тао та підтримуваним індустріалістами Сорелем Сільським колективом. Раніше напружені, але цивілізовані дебати перетворилися на відверті крики в залах Конгресу. Кожен аспект цього законопроекту вивчається до найменших деталей.\n\nПоки Конгрес занурюється в хаос, Сорель і Солтц нарешті зустрілися віч-на-віч поза межами Редмонд. Неофіційний альянс між фермерами та солдатами нарешті був укладений на камені. Солтц вклав достатньо капіталів в колектив Сореля, що не лише забезпечило посіви, а й почали з'являтися сільськогосподарські інструменти, що контрабандно потрапляють з півдня. Натомість, Сорель почав годувати КНЛА, що ще більше зменшило вплив Тао на армію.\n\nЦей законопроект стане тим, через що одна зі сторін закріпить своє місце як домінуюча сила в Редмонд. Це лише питання дебатів, чийі статті потраплять до законопроекту і хто вийде з більшою впливовістю."
nf_cpl.9.a: "Тепер все залежить тільки від часу..."

nf_cpl.10.t: "Голова хаосу"
nf_cpl.10.d: "Безумство, що охоплює Конгрес, досягло свого апогею, коли йшлося про те, хто очолить комітет для впровадження політики законопроекту. Протягом гарячих дебатів Тао і її табір успішно зробили більшість положень законопроекту згідно з її статтями, виштовхнувши табір Сореля на узбіччя. Тому головою комітету буде вірний прихильник Тао, що зміщує баланс сил на її користь."
nf_cpl.10.a: "Машина продовжує рухатися."

nf_cpl.11.t: "Голова хаосу"
nf_cpl.11.d: "Безумство, що охоплює Конгрес, досягло свого апогею, коли йшлося про те, хто очолить комітет для впровадження політики законопроекту. Протягом гарячих дебатів Сорель і його табір успішно зробили більшість положень законопроекту згідно з їх статтями, виштовхнувши табір Тао все більше на узбіччя в Конгресі. Тому головою комітету буде вірний прихильник Сореля."
nf_cpl.11.a: "Машина продовжує рухатися."

nf_cpl.12.t: "Ціна бізнесу"
nf_cpl.12.d: "Лють і дебати не можуть купити нові дороги, але капітали можуть. Конгресові кошти поступово виснажуються через всі фінансовані програми. Тому, коли Сорель представив постачання таємничих капіталів для фінансування цієї програми, інші представники були, м'яко кажучи, здивовані. Стверджуючи, що ці капітали походять з місцевих коштів ферм, реальне походження капіталів, які підтримуються індустріалістами Солтца, було приховане. Однак, оскільки Конгрес не мав достатньо коштів, питання були відкладені заради майбутнього програми. Програма, оплачена капіталами Сореля, дала йому ще більше впливу."
nf_cpl.12.a: "Ще один змова!"

nf_cpl.13.t: "Ціна бізнесу"
nf_cpl.13.d: "Лють і дебати не можуть купити нові дороги, але капітали можуть. Конгресові кошти поступово виснажуються через всі фінансовані програми. Тому, коли Сорель представив постачання таємничих капіталів для фінансування цієї програми, інші представники були, м'яко кажучи, здивовані. Стверджуючи, що ці капітали походять з місцевих коштів ферм, реальне походження капіталів, які підтримуються індустріалістами Солтца, було приховане. Тао, ставши ще більш скептичною щодо Сореля, вразила Конгрес запальною промовою. Вона оголосила капітали нелегітимними і частиною змови якоїсь невідомої організації. Тому Конгрес вирішив залишити фінансування в середині, закривши двері для Сореля та його капіталів. Програма, тепер звільнена від зовнішніх капіталів, знову змістилася на користь Тао."
nf_cpl.13.a: "Ще один змова!"

nf_cpl.14.t: "Насильство породжує насильство"
nf_cpl.14.d: "Тріщини в Конгресі тепер перетворилися на прірви, і Конгрес більше не функціонує. Загроза зупинки встановилася, і революційна коаліція була порвана. Коаліція, що народилася з насильницької революції, зайшла занадто далеко, щоб тримати уряд в працездатному стані. Як хаос остаточно охоплює, Сорель і Солтц вирішили зіграти свою останню карту. Дебати і капітали не привели їх ні до чого, все що залишилося — це сила КНЛА. Обидва вони змовлялися з самого початку, погоджуючись, що Тао вже вичерпала свою корисність для робітників.\n\nСцена готова, і шахівниця чекає своїх гравців. Тао зробила останню спробу звернутися до Конгресу з проханням про надзвичайні повноваження для припинення цього хаосу. Поки всі представники були в Конгресі, Солтц зібрав усіх своїх вірних людей для фінального мату. Під час цього вечірнього засідання Конгресу, під світлом піднімаючогося місяця, війська КНЛА почали оточувати місто Редмонд. Як солдати наближалися до залів Конгресу з їхнього зовнішнього карантинного лінії, прохання Тао ставало все більш напруженим.\n\nТоді звук тріскання дверних рам і кулі проривають зали Конгресу. Кров забарвлює стіни, і жах «революції» знову показаний Редмонду. Шах і мат прийшли, але для кого?"
nf_cpl.14.a: "Охорона рятує Тао від її долі!"
nf_cpl.14.b: "Їхня ставка зіграла..."

nf_cpl.15.t: "Брати, що були закуті в крові"
nf_cpl.15.d: "Вчинок був завершений, полковник Тао лежала мертвою на підлозі Конгресу разом із рештою її табору. Як тільки сонце починає підніматися знову, винна пара починає втілювати решту свого плану в дію. Люди Солтца захопили вулиці міста, змушуючи кожного громадянина залишатися вдома і блокуючи будь-який вхід у місто. Тим часом, Сорель виходить на радіохвилі, оголошуючи велику трагедію.\n\n“Робітники Канади, я прийшов до вас з найгіршими новинами. Минулої ночі, під час чергового засідання Конгресу, прокляті американські капіталісти спробували здійснити переворот у нашій демократичній робітничій державі. Вони штурмували нашу конгресову залу, відкривши вогонь на нашого лідера, полковника Тао. Вона та багато інших представників, на жаль, були забрані від нас! На щастя, капітан Солтц і його люди вчасно прибули, щоб врятувати решту, в тому числі мене. За цей зрадницький вчинок буде пролита кров, я це обіцяю!”\n\nВ наступні тижні карантин тримався всупереч порадам Сореля, офіційно з огляду на побоювання майбутніх атак, але справжня причина була невідома Сорелю. Похорон полковника Тао та решти вбитих пройшли без проблем, і на них несподівано виступили як Сорель, так і Солтц. Страх перед капіталістами посилився, тому Солтц та його люди почали вибивати двері, щоб знайти цих привидів капіталістів. Насправді, його люди грабували ферми союзників Сореля, забираючи назад капітали, які вони отримали. Новини про ці рейди були лише шепотом серед внутрішнього кола Сореля, оскільки карантин міцно тримав контроль над потоком інформації. Проте, незабаром правда дійшла до вух Сореля.\n\nЗв'язок, укладений перед цією жахливою подією, нарешті був покинутий Солтцем і тепер — Сорелем. З Редмондом, заповненим його вірними людьми, Солтц обманював себе, вважаючи, що досяг перемоги. У тіні, як і раніше, Сорель створив остаточний план, щоб завершити хаос раз і назавжди. Використовуючи припаси, контрабандно ввезені з села, Сорель виготовив бомбу, щоб знищити штаб-квартиру операцій Солтца. Успіх цього плану тепер залежав від випадку, так само як і життя Сореля."
nf_cpl.15.a: "Бомба була контрабандно ввезена..."
nf_cpl.15.b: "Але її знайшли!"

nf_cpl.16.t: "Гравець у азартні ігри"
nf_cpl.16.d: "Маршування черевиків КНЛА заповнило тихе снігове повітря Редмонду. Як і кожного дня від початку карантину. Але потім черевики зупинилися, залишаючи сліди на стінах після повного вибуху штабу Солтца. Пожежі від вибуху поширилися по місту, Сорель вийшов на сходи Конгресу, наказуючи залишкам військ зупинити вогонь. Сорель, тепер командувач КНЛА лише завдяки тому, що вижив, закликав більше зовнішніх військ ввійти в місто.\n\nКарантин був знятий, і вогонь було згашено, однак смерті не припинилися. Сільські підрозділи КНЛА були вірні фермерам, які їх годували, а отже — Сорелю. Протягом наступних кількох днів залишки вірних Солтцу були розстріляні в задніх провулках під прикриттям атак капіталістів. Сам вибух тепер став під питанням серед населення, особливо після того, як більше і більше солдатів гинуло. Вони питали, як таке може трапитися, коли вулиці заповнені і їхні права знищені? Сорель намагався зняти напруження, посилаючись на капіталістське повстання, яке намагається, але не може взяти під контроль Редмонд. Ця відповідь була зустрінута з обережністю, оскільки населення не могло зрозуміти, чому так відбувається. Здається, що кровопролиття ще не закінчилося."
nf_cpl.16.a: "КНЛА вдалося зберегти порядок."
nf_cpl.16.b: "Населення було готове до закінчення кровопролиття!"

nf_cpl.17.t: "Уряд, куплений і оплачений"
nf_cpl.17.d: "Маршування черевиків КНЛА заповнило тихе снігове повітря Редмонду. Як і кожного дня з моменту початку карантину. Глибоко в катакомбах Редмонду тепер сидить Сорель, прив'язаний і забруднений кров'ю до стільця. Солтц стоїть за ним із пістолетом 10 мм у руці. Легкий зітхання Сореля пролунав, коли він заплющив очі, перед тим як БАМ, Солтц сховав пістолет і повернувся до своїх справ. Через кілька годин карантин було знято з Редмонду, але переворот ще не завершився.\n\nКолишні союзники Сореля тепер втекли вітром, використовуючи все, що у них залишилось, щоб врятувати свої життя від Солтца та його терористичних загонів. Почалася полювання, кожен, хто підтримав Тао чи Сореля, тепер був призначений для шибениці. Солтц почав створювати нову військову хунту, яка стане тимчасовим урядом, поки індустріалісти не зможуть висловити свою думку. Сторінки майбутнього Альберти ще не написані, здається, що ані капіталісти, ані комуністи не володітимуть її рівнинами."
nf_cpl.17.a: "Принаймні більше немає революції..."

nf_cpl.18.t: "Піднімається чорний прапор"
nf_cpl.18.d: "Вірні партії палають через вулиці Редмонду, несе на своїх руках спотворені тіла табору Тереси. Вони кидають тіла в величезні вогняні ями на околицях міста, не вимовивши жодного слова. Водночас Сорель проголошується спасителем партії в її штаб-квартирі. Шрами переворотів видно на кожній стіні, пробитій кулями, чи численних кратерах у будівлях Редмонду. Люди втомилися, після перевороту за переворотом вони відчувають ціну утопічного бачення, яке так і не здійснилося. Партійні чиновники наливають шампанське до війни, а посіпаки наглядають за вогнищами, але люди беруть будь-яку зброю, яку можуть знайти.\n\nХолодне північне небо дивиться на натовп з факелами і саморобними палицями. Чорний лист клену несе через вулиці, наче нескінченний потік громадян, що марширують на штаб-квартиру. Посіпаки партії намагаються стримати потік, але їхні шоломи вдавлюються палицями людей. Століття гноблення та образи розбиваються об стіни штаб-квартири. Солдати, яких менше, тікають або потрапляють під черевики людей. Святкова атмосфера всередині партійних палат швидко перетворюється на атмосферу страху, оскільки люди дають про себе знати. Кожного партійного чиновника виривають з святкувань і виводять на вулицю.\n\nНезабаром настає світанок, охоплюючи хаос теплим світлом. Голови партійних чиновників увінчують себе на кінцях списів. Потрощені нутрощі замазують бруківку вулиць, поки Сорель благав і молився про пощаду. З вигуками Сореля підвісили на площі Редмонду. Чіпляючись за мотузку на своїй шиї, Сорель витрачає останні сили. Тепле сонце, нарешті, світить на площу, чорні кленові листи несуть поряд із кривавими списами."
nf_cpl.18.a: "Нехай партія згорить!"

nf_cpl.19.t: "Шлях, що не був пройденим"
nf_cpl.19.d: "Невдача панує в Редмонді, коли натовп повільно розсіюється, залишаючи свої страшні списі серед бруківки, пофарбованої в кров. Однак у місцевому барі активність триває, і ведуться жваві дебати. Тепер натовп намагається встановити якийсь ідеал чи хоча б що-небудь, крім ненависті до старої гвардії. Серед цього руху одна група чітко заявляє про себе. Так званий Чорний Колектив, ті, хто підтримував чорний кленовий лист, навіть коли це не стало модним. Їхній лідер, Саул Федоров, худорлявий і стрункий чоловік, який називає нетрі Редмонду своїм домом, намагається подати бачення своєї групи для Канади.\n\nФедоров говорить голосно і з дикими жестами рук, що не відповідають його фізичній статурі. Він вигадує казку про націю без партії, без голови, без держави. І обіцяє, що нація справді буде в руках людей. Кровожерний натовп з ночі минулої швидко м'якшає до ідей Федорова. Незабаром хвиля оптимізму охоплює бар, і люди починають ставати на бік цього Чорного Колективу.\n\nУ наступні дні Федоров організує свою банду нетрів, що стане безжальними мисливцями. Кожного, хто колись підтримував стару гвардію, тепер зловлять і повісять поруч із все більш гнилим тілом Сореля. Площа Редмонду стала меседжем для всього пустиря, її покриті нутрощами стовпи малюють картину єдності проти всіх загроз. Одночасно відкрилися табори, дозволяючи бідним душам, що колись були їхніми жителями, вільно блукати. Федоров тепер називає офіс колишнього голови своїм домом. Той ретельно оформлений офіс перетворився на дику кімнату, заповнену пляшками з алкоголем і трофеями, відібраними в палацах партійних лідерів. З сигарою в роті і пальто Тереси на плечах, Федоров оглядає свою нову землю, готову до його ліплення."
nf_cpl.19.a: "У Федорова ми віримо!"

nf_cpl.20.t: "Керівний маніфест"
nf_cpl.20.d: "Федоров не новачок у здобутті ненависті інших. Від самого народження він був змушений жити в нетрях, партійні чиновники проходили повз, навіть не глянувши на нього. Він рано зрозумів, що благаючи на вулиці, можна потрапити до гірських таборів, молячись про солодке полегшення від обмороження. Чорний Колектив був заснований Федоровим не для амбіцій чи влади, а щоб зберегти порядок в нетрях. Коли той злісний натовп йшов повз нетрі, щоб підпалити партію, він зрозумів, що це його єдиний шанс змінити статус-кво. Його палка промова завоювала серця людей, однак це була саме його наявна організація, що дозволила йому влаштуватися в Редмонді.\n\nТепер, Федоров спалив нетрі Редмонду до основи. Колишніх мешканців переселили до розкішних палаців, якими колись правили партійні «адвокати». Економіка більше не ґрунтується на загрозах, а на простому маніфесті: працюй або помри від голоду. Тепер немає держави, на яку можна було б покласти провину за нерівність чи несправедливість, Федоров усунув всі механізми контролю, повернувши все до свого природного стану. Кожен має роботу, якщо хоче, якщо ні — їх забере земля, визволяючи від труднощів життя."
nf_cpl.20.a: "Свобода від законів!"

nf_cpl.21.t: "Беззаконний Північ"
nf_cpl.21.d: "Колишні жваві партійні офіси по всьому Редмонду поросли пилом і павутиною. Федоров ліквідував всю колишню бюрократію, залишились лише будівлі, що гниють під снігом. Великий державний апарат, що мав контролювати економіку, був замінений на вільний обмін товарами. Фабрики працюють не через державні квоти, а тому, що люди прагнуть до нормальності. Чорний Колектив бродить вулицями та сільською місцевістю, нав'язуючи своє панування над землею. Всі закони скасовані, залишилися тільки озброєні банди, що бродять по півночі.\n\nАнклав та поселення заповнили прогалину, залишену скасуванням центральної держави. Міські ради керують поселеннями, визначаючи розподіл праці та організовуючи примітивну систему бартеру. Чорний Колектив, своєю чергою, контролює беззаконні пустки між цими точками цивілізації. Федоров наказав своїм людям забезпечити безпечний прохід між селами, дороги тепер усіяні колючим дротом та міліціонерами Чорного Колективу. Кожна рада повинна надсилати свій данину до Редмонду. Каравани щомісяця здійснюють похід зі своїми вантажами, на які зазіхають сільські бандити.\n\nСам Редмонд був покинутий середнім громадянином, залишились лише люди Федорова. Чорний кленовий лист пишно майорить над хаотичною армією Чорного Колективу. Жахлива вистава на площі міста відтоді розклалася, перетворившись на відкритий ринок. Хімікати, алкоголь і вкрадені товари знаходять своє місце на прилавках Редмонду. Федоров використовує свою озброєну колективу, щоб закріпити своє місце на чолі беззаконного півночі. Він пообіцяв націю без держави і виконав свою обіцянку. Залишилось лише те, що Федоров увінчаний трофеями свого перевороту і озброєною бандою, яка забезпечує, щоб жоден інший претендент не зайняв його місце."
nf_cpl.21.a: "Ніколи не перетинай колючий дріт..."

nf_cpl.22.t: "Довгий похід на Схід"
nf_cpl.22.d: "Землі Альберти перетворились на дикі землі Федорова, на землі можливостей. Незабаром його тимчасова армія перетне кордони з колючим дротом. Федоров знову виходить на сцену на площі Редмонду, щоб виголосити ще одну палку промову, цього разу про повторне завоювання Сходу. Він висміює східні монархії, республіки та виборців, наказуючи своїм ордам йти на схід і розширяти межі колючого дроту. Їхній керівний маніфест: працюй або помри, має звільнити Канаду від її ланцюгів і дозволити вічному мерзлоті забрати тих, хто хоче чинити опір.\n\nВигуки з площі заглушили те, що залишилося від міського населення, невідповідні солдати несуть прапори чорного кленового листа, маршуючи до їхнього неофіційного кордону. Їхні черевики топчуть старі лінії колючого дроту, поки Федоров спостерігає з Редмонду. Карта Канади часів до війни лежить в центрі його офісу, а він ставить маркери на мапі для свого східного царства. Стародавні міста Сходу будуть спалені до тла, а замість них Федоров поставить нові поселення, схожі на його доктрину. Він звільнить нетрі і поверне їх назад до мерзлоті, звільнивши їх від всякого гноблення, повернувши до їхнього природного стану, як було задумано."
nf_cpl.22.a: "До наступної глави!"

nf_cpl.23.t: "Просто ще один день"
nf_cpl.23.d: "Зали Конгресу порожні, представники Сільського Колективу нікуди не зникли. На іншому боці Редмонду казарми повні активності. Солдати бігають по своїх ліжках, збираючи себе після ночі розваг. Старші офіцери приходять до тями в душах, молячись, щоб холодна вода швидко дозволила їм націлюватися точно. Хаос скоро затихає, коли ці півп'яні солдати бачать блокаду, що оточує їхні казарми. Їхні товариші-солдати в тій самій формі стоять готові, націливши на них свої гвинтівки.\n\nНа чолі цієї блокади стоїть сама полковник Тао, прикрашена всіма своїми нагородами і медалями, з пістолетом на боці. Не минуло й багато часу, як непокірні бунтівники-солдати були надягнуті в кайданки і відправлені до найгіршої ями в Канаді. Старші офіцери, в процесі відновлення після сп'яніння, почали балакати про запланований переворот. Їм нагородили найменшим вживанням хімікатів, і вони розповіли, як Сільський Колектив заплатив їм за те, щоб усунути Тао та її прихильників з Конгресу. Вони також пояснили, що їхня первісна неохота була знята обіцянкою майбутніх хімікатів. Знищивши всю потужність перевороту, Тао тепер зосереджує свою увагу на владних посередниках.\n\nФерма за фермою, вірні Тао сили рухаються по списку колаборантів. Колишні важковаговики в Конгресі тепер ховаються серед своїх полів, молячись, щоб їх не помітили під час обшуків. Щойно виправлене і дисципліноване військо не залишає каменя на камені, жодного будинку без обшуку і жодного поля не залишено без очищення. Незабаром кожне ім'я зі списку Тао буде виведене. Замінюючи їхні відомі прізвища на холодні номери і їхні затишні фермерські будинки на бетонні в'язниці. Тепер Тао сидить без опору на чолі Конгресу, земля кленового листа тепер під її контролем."
nf_cpl.23.a: "Життя ніколи не змінюється..."

nf_cpl.24.t: "Сліпий веде сліпого"
nf_cpl.24.d: "Редмонд не звик до політичної опозиції, чи то захоплення влади Терессею, чи то повстання Тао; всі вони завершилися схожими кровавими чистками. Тепер уже ув'язнені колаборанти чекають у своїх камерах на свою чергу перед розстрільною стінкою. Їхній день суду настав, коли їх вишикували на подвір'ї в'язниці. Тао з'явилася незабаром і наказала виставити охорону по периметру, знявши кайдани з кожного в'язня. Деякі почали благати про пощаду, а інші залишалися з кам'яними обличчями, коли Тао відчинила ворота за собою.\n\nОхоронці за наказом Тао спустили свої гвинтівки і винесли старий одяг в'язнів. В'язні були шоковані та вражені, скориставшись своєю можливістю на свободу. Після повернення в Конгрес, Тао підтвердила свою милість, використовуючи цих в'язнів, щоб подолати кровопролиття попередніх режимів. Громадяни, почувши про її вчинки, почали сповнюватись надією, зміцнюючи розрив між Тао та Терессою. Раніше відчутний страх перед політичними переслідуваннями поступово розсіювався з кожною дією Тао."
nf_cpl.24.a: "Ніякої більше крові."

nf_cpl.25.t: "Цегляний трон"
nf_cpl.25.d: "Конгрес знову зібрався на засідання, місця колишніх представників Сільського Колективу заповнили нові, молоді депутати. Щодо самої Тао, то вона керує засіданнями Конгресу так само, як своїми батальйонами на полі бою. Кожне голосування чи дебати проходять організовано і без застою, який раніше plagued уряд в цілому. Перше в порядку денному — Законопроект про нагляд за Конгресом. Конгрес фактично став єдиним урядовим органом, використовуючи армію як інструмент для примусового виконання своїх рішень. Тао прагне змінити цю ситуацію, офіційно закріпивши свою роль як голови Конгресу та усунувши будь-які залишки армії з урядових справ.\n\nКожен представник голосував, пам'ятаючи про нещасливий переворот, що залишився в їхніх пам'ятях. Без особливого здивування підсумки голосування виявилися майже одноголосними, лише три голоси були відсутні. Тао тепер володіє титулом Голови Конгресу, відмовившись від свого титулу полковника, щоб забезпечити відокремленість Конгресу від армії. У той самий час, армія тепер перебуває під контролем Конгресу. Від тепер всі їхні кулі, патрони та накази будуть спрямовуватися лише через затвердження Конгресу."
nf_cpl.25.a: "Ще один крок вперед!"

nf_cpl.26.t: "Виконуючи порожні обіцянки"
nf_cpl.26.d: "Століття тому, коли американські війська перетнули кордон і перетворили Канаду на уламкову державу, почали звучати нескінченні заклики до свободи. Багато хто з них заявляв, що є уособленням захисників поневолених канадців, навіть сама Тересса, тиранин, вимагала цього титулу. Ці обіцянки свободи і прав працівників почалися з Канадського Народного Фронту і залишились порожніми. Тао та її Конгрес — це останні з цієї довгої низки захисників, які працюють невтомно, щоб здійснити їхню спільну мрію. Під час засідання Конгресу вирішили голосувати за Закон про права працівників.\n\nДокумент, який визначає свободи канадського народу, є ключовим для вільної Канади для Тао та її прихильників. Деякі з цих основних прав включають безкоштовну медицину, пенсії для працівників, а найбільш важливе — свободу віросповідання. Найбазовіше право на віру було закріплено для того, щоб уникнути нових кровавих повстань. Хоча свобода слова все ще контролюється для забезпечення стабільності, кожному канадцю цього закону тепер гарантовано можливість мати свою унікальну віру, навіть якщо тільки в приваті. Обговорення було коротким, а голосування ще коротшим, результат вже був передбачуваним, що призвело до ранніх святкувань. Як тільки закон було ухвалено, громадяни приєдналися до святкувань. День закінчився тим, що вулиці заповнилися громадянами та представниками, що несли прапори і співали патріотичні пісні."
nf_cpl.26.a: "Що потрібно було зробити."

nf_cpl.27.t: "Гвинтики та болтики"
nf_cpl.27.d: "Колись заповнені уламками фабрики Редмонду тепер очищені, і їхні виробничі лінії знову ревуть на повну потужність. Продукція почала заповнювати полки магазинів, одяг наповнив вітрини, а навіть такі розкоші, як плити для кухні, стали доступними. Між сесіями Конгресу, Тао прогулюється по балках цих фабрик, наглядаючи за роботою своїх громадян. Вона лає будь-яких жорстоких або непокірних керівників фабрик. Колишня всенародно відома полковниця тепер роздає хліб робітникам прямо біля ревучих виробничих ліній."
nf_cpl.27.a: "Боялися? Ви впевнені?"

nf_cpl.28.t: "Жест доброї волі"
nf_cpl.28.d: "Після звільнення сільських колаборантів, Тао прагнула забезпечити позитивний імідж серед своєї сільської виборчої бази. Кожного місяця, майже як за годинниковим механізмом, Тао та її флот вантажівок вирушають глибоко в сільські поля Канади. Фермери з навколишніх сіл терпляче чекають на свої енергетичні елементи або нове сільськогосподарське обладнання. Трактори, щойно вийшли з фабрики, є найкращими прикладами цих місій, переданими фермерам, які найбільше потребують допомоги. Ці благодійні дії, що виходять за межі вимог уряду, зробили Тао майже святою фігурою серед сільського населення. Колишнє осереддя повстань було приборкано Тао один трактор за раз."
nf_cpl.28.a: "Ціна лояльності."

nf_cpl.29.t: "Межі свободи"
nf_cpl.29.d: "Питання канадського громадянства заповнило зали Конгресу, кожна дискусія, незалежно від її початку, здається, перетворюється на питання, хто має право вважатися канадцем. Американські вожді вже стали віддаленим спогадом, але їхній вплив все ще нависає над Канадою. Аркадійці, здається, є культурною сумішшю довоєнної канадської та американської культур. У центрі цього питання кожен представник сперечається, чи мають вони право на повне громадянство та, отже, на вигоди з Закону про права працівників. Інша група, яка перебуває в схожому становищі, — це ґули, яких звичайні працівники бояться, і багатьох представників закликають залишити цих ґулів гнити.\n\nПоки це питання бушує серед представників, Тао бере дебати так, як би вона взяла бій — з хитрими підступами. Поки найгучніші та найзапекліші представники сперечаються на підлозі Конгресу, Тао збирає підтримку в офісах і за кулісами. Обіцяючи підтримку або матеріальні поступки в обмін на підтримку громадянства для всіх, хто проживає в Канаді. Гарячі дебати тривали аж до першого голосування, яке було не менш суперечливим і його довелося рахувати двічі. Наприкінці дня голосування завершилося на користь громадянства для всіх, з мінімальною перевагою — одним голосом. Незабаром буде розроблено законодавство, яке закріпить це важливе голосування в закон."
nf_cpl.29.a: "Чи вони взагалі канадці?"

nf_cpl.30.t: "Ті, хто переслідують живих"
nf_cpl.30.d: "Як і очікувалося, коли законопроект про права ґулів на громадянство потрапив до Конгресу, вибухнули вогонь і сірка з кожного кута. Багато хто стверджує, що вони не більше ніж примари, що переслідують живих. Мертві, яких давно треба було б покласти на спокій. Вони сидять тут, у залах Конгресу, захищаючи права працівників, одночасно виступаючи за їхнє вигнання з цих земель. Після години цієї жахливої дискусії Тао не витримала і вдарила кулаком по столу, сказавши:\n\n"Досить! Ми сидимо тут і ведемо дебати про долю цих людей, в той час як в наступному ж подиху засуджуємо колишню партію за саме це. Вони бачили нас не більше ніж людські машини для їхніх фабрик. Ми боролися з ними, бо хотіли жити в місці, вільному від цієї гидоти. А тепер ми сидимо тут і робимо те саме? Ми будемо продовжувати голосування, але пам’ятайте, за що ми боролися."\n\nУ залі панувала тиша, і голосування продовжилось, таємне голосування було проведено, щоб ніхто не був змушений відкрито стояти на своєму боці в такому питанні. Підрахунок був швидким, три чверті Конгресу проголосували за, решта — проти. Питання було ухвалене, і ґули стали канадськими громадянами."
nf_cpl.30.a: "За працівників! За Канаду!"

nf_cpl.31.t: "Наше втрачене плем'я"
nf_cpl.31.d: "Дебати щодо аркадійців почалися гарячими, багато хто, особливо в Конгресі, вважав їх зрадниками Кленового Листа. Тими, хто покинув свою країну заради обіймів гнобителів. Однак їхні дії після революції почали пом’якшувати їхні кам’яні серця. Один за одним здійснювались напади на аркадійців, але вони ніколи не намагалися дати відсіч, завжди були першими працівниками і останніми, хто йшов. Тао зробила це своєю місією — забезпечити їм громадянство.\n\nГолосування щодо їхнього громадянства було важким, навіть з переважною більшістю в «Сталевому блоці» Тао, багато хто покинув її ряди. Голосування завершилося двома остаточними бюлетенями, що дало найменшу перевагу в історії Конгресу. Ці два голоси на користь дали аркадійцям право на громадянство, їм пощастило того дня."
nf_cpl.31.a: "За працівників! За Канаду!"

nf_cpl.32.t: "Кленовий Лист і Шестерня"
nf_cpl.32.d: "З того часу, як було скасовано довоєнний канадський уряд, велика біла північ була охоплена голодом і труднощами. Вид бідняка на кожному розі вулиці чи голодного фермера на безплідних полях став звичним навіть під керівництвом CPF. Тересса використовувала свою залізну руку, щоб «очистити» вулиці, стверджуючи, що її жорстка політика раціонування усунула епідемію голоду. Насправді ці бідняки були переміщені на непозначені могили поруч із голодними фермерами на тих крижаних безплідних полях.\n\nКолись порожні полиці тепер починають заповнюватися, бідняки тепер знаходять себе в урядових притулках, а фермери тепер використовують трактори. Тао колись мріяла про уряд, який би очолювали працівники, де кожна галузь мала б своє місце за столом. Перебудована на цій основі економіка тепер призвела до суспільства без економічної нерівності. Представники Конгресу несуть таке ж навантаження, як і працівники на фабриці чи фермери на полях."
nf_cpl.32.a: "Ще багато цеглин попереду!"

nf_cpl.33.t: "Канадська робітнича демократія"
nf_cpl.33.d: "Редмонд знову вирує, працівники заповнили кожну вулицю та провулок, що веде до виборчих дільниць. День виборів настав і приніс з собою почуття гордості за свою країну. Перші вибори в історії Канади після американського вторгнення привели на дільниці кожного виборця. Хоча тільки працівники мають право голосувати, виборча дільниця була переповнена до межі.\n\nЗали Конгресу чекають на новий склад представників, Тао стоїть серед кандидатів, чекаючи на своїх нових колег. Як тільки бюлетені були подані і голосування завершилось, результат був прогнозований. Кандидати, підтримувані Тао, виграли з величезною перевагою, і Конгрес тепер перебуває під контролем лояльної більшості Тао. Лише мала меншина залишилася для забезпечення відповідального управління, але мрія Тао про Канаду, керовану робітниками, була підтверджена голосом народу."
nf_cpl.33.a: "За працівників! За Канаду!"

nf_cpl.34.t: "Охоронці Півночі"
nf_cpl.34.d: "Безкінечні лінії колючого дроту позначають територію Чорного Колективу. Від кордонів поселень до перехрещених доріг ці дроти — останній прояв порядку на півночі. Озброєне крило Чорного Колективу щодня марширує вздовж цих ліній, утримуючи вуличних бандитів на відстані. Кожен міліціонер має різноманітне спорядження, жоден набір військових речей не схожий на інший. Дехто марширує в старих черевиках армії Страт, інші — в останніх моделях уніформи армії Сполучених Штатів, які вже два століття мертві. Їх зброя перебуває в ще гіршому стані, деякі носять одноразові трубчасті рушниці замість нормальних гвинтівок. Проте їхня влада не піддається сумнівам. Жорстокість перших днів їхнього правління досі лякає сільських бандитів.\n\nІсторії про повішення Сореля та нескінченні ряди палі до сих пір поширюються по той бік колючого дроту. Нові злочини з'являються щодня, Федоров зняв усі обмеження для своїх людей, дозволяючи їм патрулювати як вони вважають за потрібне. У відповідь, на вуха Федорова потрапляють розповіді про повішення, живе поховання, ритуальні спалення та все, що між ними. Федоров не турбується з цього приводу, використовує ці історії для підтримки видимості миру в своїй території. По той бік колючого дроту — лише беззаконня і озброєні банди, які використовують величезний вічнозаморожений простір на свою користь."
nf_cpl.34.a: "Завжди є нова історія."

