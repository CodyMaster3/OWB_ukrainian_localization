#### Персонажі ####
STC_AMY_TERESEE_NAME: "Емі Тересі"
STC_AMY_TERESEE_DESC: "Одні називають її змією, інші — амбіціозною особою. Але для багатьох вона є обличчям Канадського народного фронту, справжньою спадкоємицею його руху. Завзятого прихильника думок Цзян Цін, Емі прагне об'єднати всю Канаду в раціональну робітничу державу. Звісно, навіть в робітничій державі комусь доведеться вказувати робітникам, що робити..."

STC_ANTOINE_SOREL_NAME: "Антуан Сорель"
STC_ANTOINE_SOREL_DESC: "Харизматичний хлопець з ферми, партія не очікувала, що саме його життя стане прикладом для інших. Народився він в родині, що мала всі шанси потрапити в історичну забуття. Просте селянське походження — труд на полях, не вартий особливої згадки. Однак його доросле життя стало шансом довести свою гідність партії. Сорель, із мрією про філософію та комуністичну думку, ночами писав на всілякі теми. Його працездатність та публікації стали темою для обговорень серед партійних чиновників, особливо після того, як Тересі втратила підтримку. Тепер цей улюбленець комуни керує нацією через зелену революцію, щоб порвати ланцюги швидкої індустріалізації."

STC_BLACK_COLLECTIVE_NAME: "Чорний Колектив"
STC_BLACK_COLLECTIVE_DESC: "Канада пережила кілька хвиль тиранств, і жоден не приніс спокою. Між американцями та партійними головорізами немає різниці. Обидва лишають простого канадця без їжі та замороженого в снігу. Парадигма має бути зруйнована! Канада завжди була призначена для справжньої свободи, яка характеризується скасуванням держави. Єдиний шлях забезпечити кожному канадцю свободу — це відсутність апарату пригноблення. Коли немає влади, не буде й тиранії."

STC_COLONEL_THAO_NAME: "Полковник Тао"
STC_COLONEL_THAO_DESC: "Перші спогади Аманди Тао — це коли батьки тестували її на виконання обов'язкових партійних домашніх завдань/уроків з єдності робітників та переваги комуністичної системи. Зростаючи і приєднуючись до революційної армії, вона зрозуміла реалії. Той райдужний уявний світ, який їй малювали в навчальних підручниках, був лише фантазією. У реальності система призводила до голоду, безкінечних воєн і численних могил. Тао продовжувала виконувати свій обов'язок, відмовляючи собі у будь-яких думках проти партії. Її штучний світогляд був зруйнований, коли вона очолила рейди в Pioneer Company. На відміну від Страта, їхні полиці були хоча б наполовину заповнені, а фабрики не нагадували кладовища. Ці рейди відкрили їй очі, і вона повернулася як герой партії, виступаючи на пропагандистських заходах, водночас таємно готуючи нову революцію — революцію, не сповнену ідеалістичних мрій, а з повними полицями та здоровими фабриками."

STC_GENERAL_ONE_NAME: "Лейтенант Коте"
