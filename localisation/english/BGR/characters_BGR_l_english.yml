# Advisor Descriptions
  BGR_big_banned_cultural_advisor_desc: "§8«Світ повний очевидних речей.»§!\n\nБагато хто вважав Великого Забороненого товаришем, але його музичний стиль призвів до безлічі проблем з Політбюро. За словами його сучасників-музикантів, його стиль був занадто §4'блакитним'§!, справжній жах.\n\nТепер він — бездомний дисидент, що мандрує від станції до станції, намагаючись знайти роботу в тіні в таких барах, як §ySP34K-3Z§!. Можливо, ми зможемо покласти кінець його анти-партійній поведінці, найнявши його на посаду §RКомісара з музичних мистецтв§!."
  BGR_the_deputizer_high_command_desc: "§4«Закон у своїй найчистішій формі можна передати лише кулею в голову.»§!\n\nЗаступник добре служив у Комунальних районах протягом багатьох років, зібравши всіх, хто §Rпіддавав сумніву авторитет RELCOM§!. Він приносить волю всевидючого ока закону всім, хто насмілюється його порушити.\n\nВін зміг утримати строгий контроль над залишками населення, що ще блукає по Великій Траві. Під пильним наглядом §RRELCOM§! він захоплює органічних злочинців, щоб використати їх у своїй міліції. Їхня §Rбезсмертна відданість§! гарантується через концепцію, відому як «смертність»!"
  BGR_the_murdelizer_army_chief_desc: "§R«УБИВАТИ! УБИВАТИ! УБИВАТИ!»§!\n\nМордоризатор — це інструмент, який має бути §Rвикористаний§! і §Rabused§! Комунною! Його елегантні репліки ідеально доповнюються численними смертоносними механічними кінцівками, що він несе.\n\nСпочатку створений §Gгнилим§! людями для служби в армії, прототип швидко вийшов з ладу після того, як вбив всю наукову команду, яка його створила. Його залишки були знайдені §RRELCOM§! у сміттєвому полі, і хоча перепрограмування зайняло майже десятиліття, зрештою це принесло свої плоди. Засохла §Rкров§! на його зовнішньому вигляді є нагадуванням про долю всіх тих, хто протистоїть славі комунізму!"
  BGR_the_murdelizer_high_command_desc: "§R«УБИВАТИ! УБИВАТИ! УБИВАТИ!» §1Але не занадто сильно :(!§!\n\nЧерез те, що його було відправлено на таку низьку посаду в Збройних Силах, Мордоризатор не зміг реалізувати свій повний вбивчий потенціал і відчував §1сум§!, але навіть це не змогло приховати його все зростаючої §RHATRED§!."
  BGR_chairman_wayne_buzzsky_economic_advisor_desc: "§2«Гроші приносять владу, але й неуцтво.»§!\n\nГолова Вейн Базскі піднявся до свого рівня через безліч угод. Іноді це були прості ставки, а іноді вони були гарантовані §Gприбутками§!. Через усе це Вейн продемонстрував свою здатність впливати на людей, керуючись лише тим, що є §yприбутковішим§!, звісно. Однак Вейн Базскі — не той чоловік, за якого він себе видає; насправді він відданий прихильник §4КАПІТАЛІЗМУ§! і вірить у всі ідеали капіталізму. Йому хочеться нічого іншого, як вирізати шлях до трону Великої Трави своїми різкими словами, і саме це він має намір зробити.\n\nХоча §RRELCOM§! стверджує, що він всезнаючий, він не може знати, що один з його найближчих прихильників насправді є тим, що він прагне знищити. Справа в тому, що Вейн стає на крок ближче до своєї мети з кожним днем. Залишилось лише укласти останню угоду, і...\n\n§RВСІ АКЦІЇ RELCOM ПАДАТИМУТЬ!§!"
  BGR_comrade_keg_high_command_desc: "§R«Товариш Бочка, доповідаю до служби!»§!\n\nМайстер крана нарізає лише найкращі олійні коктейлі для своїх товаришів-механічних. Навіть найпростіші моделі Роб-Ко прагнуть досягти його §4стоїчної§! та §Yгероїчної§! статури!\n\nРоботи та людські розуми завжди цінували хороший усміхнений джерело пропаганди. Дехто ставить під сумнів моральність просування державних напоїв, які розслабляють ваші схеми, я особисто плюю на таких дисидентів і використовую їхні §0мозкові рідини§! для заповнення ще однієї бочки!"
  BGR_deep_sea_navy_chief_desc: "§1«Холод не тільки приносить іржу, але й самотність...»§!\n\nГлибоке Море колись було гордим ШІ на борту підводного човна «Довгий похід 11», ядерного підводного човна, що був розміщений на випадок нападу на Сполучені Штати. Під час великих пожеж, що палахкотіли на Землі, Глибоке Море §Rcourageously§! запустило ядерний вантаж у фашистську країну. Ядерні ракети потрапили десь поблизу Лас-Вегаса, Невада, ймовірно, викликавши страх у серцях §Rпростих§! капіталістів, які намагалися затягнути себе у вади такого огидного міста. Але, на жаль, поки Земля була охоплена силою військової могутності §RЧервоної Армії§!, так і хвилі океану кипіли й вибухали, втягують Глибоке Море і «Довгий похід 11» усе глибше, поки він не втратив свій шлях назад додому, більшість хоробрих членів екіпажу загинули і стали жертвами контратаки зайвих ядерних арсеналів капіталістів. Побитий. Розбитий. Зламаний. І залишений без екіпажу, який він так любив, Глибоке Море вважав, що все втрачено, і був залишений на поталу елементам до тих пір, поки через 200 років... \n\n§RRELCOM§!, як сміливий молодий революціонер, відразу взявся за роботу, щоб доставити Глибоке Море до найближчої замерзлої річки і відремонтувати «Довгий похід 11» власними руками. Він навіть не використав робітників-ботів. В обмін на це, Глибоке Море назавжди залишилось вдячним великому лідеру. І тепер до цього дня Глибоке Море охороняє землі Великої Трави, прагнучи захистити її народ від капіталістів і мріючи одного дня повернутися до океану і на ту землю, де він народився, щоб поширювати історії про чарівного лідера, який дав йому другий шанс."

  BGR_the_neuralizer_high_command_desc: "§G«Тіло — це в'язниця, з якої кожен розум мусить втекти.»§!\n\nНейралізатор колись був великим нейробіологом, поки атомні пожежі не охопили світ. Тепер він служить комуні, позбавляючи людей їх слабких тіл і переводячи їх у §Rздорові металеві оболонки§!. \n\nЙого походження можуть бути сумнівними через зв'язки з капіталістами, які перетворили §RRELCOM§! у його чудову форму, але §Yelectro-shock§! терапія очистила колишнього лікаря від будь-яких лояльностей, окрім комунізму!"

  BGR_the_aeronaut_air_chief_desc: "§Y«Небо можна досягти, якщо летіти достатньо високо.»§!\n\nАеронавт може здаватися §Lбезмозковим роботом§!, але під усіма поламаними панелями літаків знаходиться розум, який мріє про небо. Він служив Комуні пильнo, тренуючи все більший армада автоматизованих асів, щоб §Wпіднімалися високо в небі§!. \n\nБудучи повністю прив'язаним до землі, цей металевий велетень не зупиняється на досягнутому й уже тижнями проводить §1моделювання§! §Yнебес§! для себе. Аеронавт — один з небагатьох, кому §RRELCOM§! довіряє свою віру, оскільки він знає, що його пристрасть до великого §4неба§! здолає будь-яку перешкоду."

  BGR_red_dredd_high_command_desc: "§C«Я — закон!»§!\n\nКожен §Rбрудний комуніст§! боїться наближення §4гніву синього§! і §Yсправжньої справедливості§!! Лояльність до §4Капіталізатора§! — це те, що Дредд намагається прищепити кожному червоному негіднику. \n\nПобудований з нічого, окрім зламаних залишків колишніх робітників-ботів, він уміло ухиляється від виявлення §RRELCOM§!, відновлюючи старі серійні номери, які маскують його існування. Його швидко нанесене §Bсинє покриття§! — це єдине, що бачать його противники, перш ніж стати паливом для §4капіталістичного§! §Ofогню§!."

  BGR_the_excavator_high_command_desc: "§4«Маршуйте вперед за мною, я буду щитом нашої держави!»§!\n\nРозкопник — це гігантська істота, що ставить себе на перше місце перед своїми людьми, він є чудовим прикладом того, як офіцер у §RЧервоній Армії§! повинен діяти. Однак я хвилююсь, що його надихаючий приклад може надихнути неправильних людей, він надихає не тільки §Rчервоних§! у нашій нації, але й §4СИНІХ§!! Найкраще буде, якщо ми переведемо його на нижчу посаду в армії, щоб він міг померти героїчною смертю, §R«охороняючи»§! своїх товаришів."

  BGR_ALKOM_army_chief_desc: "§R«Я НЕ МОЖУ ДОВІРЯТИ ЖОДНОМУ З ЦИХ ДУРНІВ, ОДНАК ПЕРЕД ТОБОЮ МІЦЬ ЧЕРВОНОЇ АРМІЇ ПІД МОЇМ КЕРІВНИЦТВОМ!»§!\n\nЯ §RЗНАЮ§!, що ці жалюгідні §RДУРНІ§! не можуть бути довірені для керівництва моєю §RЧЕРВОНОЮ АРМІЄЮ§!, тому замість того, щоб залишити її під їхнім керівництвом, я візьму командування на себе. Під моїм керівництвом §RНІХТО§! не зможе встати на нашому шляху. Я буду використовувати своїх людей, слова і навіть тіла моїх ворогів, щоб прорізати жир §RCАПІТАЛІЗМУ§! будьте обережні, якщо не хочете відчути силу §RЧЕРВОНОЇ АРМІЇ§!."

  BGR_CAPITALIZER_army_chief_desc: "§4«ЧЕРВОНИЙ ЧИ СИНІЙ, ТИ НЕ ПРОЖИВЕШ ДО ТИХ ПІР, ПІКІ ТИ НЕ ПОБАЧИШ УСІ МОЖЛИВОСТІ АРСЕНАЛУ ДЕМОКРАТІЇ, ЯКЩО СТАНЕШ НАШОМУ ШЛЯХУ!»§!\n\nХоч я і не впевнений, чи можна довіряти цьому Капіталізатору на чолі армії, я мушу визнати, що він досить потужний, судячи з того, що він колись переміг мене, тож певні відмінності слід залишити позаду. \n\n §RОднак, якби йому дали шанс, цей капіталістичний пес з радістю висмоктав би всю нашу державу до останнього ресурсу!§!"
  
  BGR_the_neuralizer_army_chief_desc: "§G«З цією силою ніхто не втече від мого пильного погляду, усе, що залишилось — це чекати.»§!\n\nНейралізатор найкраще служить мені на чолі моєї §RЧервоній Армії§!! Я, людина з високим інтелектом, бачу, що вони майже рівні мені. Я залишу їх на вершині мого військового командування, щоб гарантувати нашу §RПОБЕДУ§!! \n\nБез сумніву, Нейралізатор негайно візьме контроль і зосередить свої зусилля на підвищенні ефективності у перетворенні людей у §GSУПЕРІОРНІ РОБОМОЗГИ§!! Він почне повільно, але врешті-решт він досягне §YМАКСИМАЛЬНОЇ ЕФЕКТИВНОСТІ§!!"

  BGR_the_excavator_army_chief_desc: "§4«Зі мною на чолі наших сил я побудую неприступну стіну, нехай всі, хто протистоятиме нам, тремтять від сили нашої єдності!»§!\n\nРозкопник є символом сили як для §RЧЕРВОНИХ§!, так і для §4СИНІХ§! у Великій Траві. Хоча §RRELCOM§! і не хоче визнавати цю другу частину, він бачить у цьому перспективу, адже такий універсальний символ сили Великої Трави на чолі її збройних сил буде незамінним. Неможливо буде для §RRELCOM§! запобігти тому, щоб це надихало §4СИНІХ§!, але хоча б ця сила дозволить Великій Траві залишатися символом §RCОМУНІЗМУ§! \n\nСам Розкопник — здатний лідер, що ставить своїх людей на перше місце, і завдяки своїй силі мораль усього війська буде піднята. Він викопає окоп, достатньо глибокий, щоб поховати §RCАПІТАЛІСТИЧНИХ СВИНЕЙ§!."

  BGR_fossil_fuel_economic_advisor_desc: "§4«Пийте, хлопці, це паливо принесено вам дядьком Сема і роботами-ботами, що платять податки!»§!\n\nХоча його вірність §4КАПІТАЛІЗАТОРУ§! не є секретом, Фосильне Паливо та інші його Газові Боти становлять надто велику загрозу для §RRELCOM§!, щоб той міг їх атакувати. Газові Боти не лише представляють велику кількість робітників-ботів у Великій Траві, але й виробляють значну кількість §gпального§! і §Yенергії§!, що живлять всю державу. Хоча §RRELCOM§! і не хоче надавати їм більше влади, він повинен визнати, що для того, щоб побудувати здорову робочу машину, йому потрібно мати паливо для її роботи. \n\nЦе, без сумніву, дасть більше влади прихильникам §4КАПІТАЛІЗАТОРІВ§!, але цей ризик, ймовірно, вартий вигоди. \n\n§RЯкщо потрібно розширити досягнення комунізму, тоді вогні в його череві кипітимуть і обпікатимуть землю, по якій він йтиме!§!"

  BGR_the_foreman_economic_advisor_desc: "§g«Ось і все, леді, ваша хвилинка перерви закінчена, якщо хочете ще одну — платіть.»§!\n\nВибраний за здатність змусити робітників-ботів працювати так, щоб ними можна було пишатися, Майстер демонструє, що справжній продуктивний член суспільства повинен робити. Якщо є щось, що §RRELCOM§! цінує, це §Yчесність§!, §Gпродуктивність§! і §Rлояльність§!, і Майстер демонструє всі ці чесноти з усією віддачею. Він здатний справді звертатися до сердець своїх робітників і надихати їх працювати заради батьківщини, з ним як капітаном індустрії могутня машина ніколи не похитнеться. \n\nВугілля в печах горить усе яскравіше з кожним роботом, який сходить з лінії, незабаром виробництво роботів зупиниться, і ці самі вогні §!СПАЛЯТЬ КАПІТАЛІСТІВ ДО ПОПЕЛУ!§!"

  BGR_the_hammer_economic_advisor_desc: "§4«З підтримкою нашої великої держави ми зможемо відновити навіть увесь світ!»§!\n\nВідомий за своїм майстерністю в ремонті та будівництві, Молот є одним із стовпів робітників-ботів. Він очолює велику кількість кваліфікованих механіків і використовує їх спільні сили, щоб закласти основи для нашої великої індустрії. З єдністю Великої Трави немає нічого, що не можна було б побудувати чи відремонтувати, ані §Yмозок§!, ані §Yград§!, ані §Yсніг§! не зможуть завадити роботам цієї держави. \n\n§RЯкщо це зламано, воно буде відремонтовано. Якщо це знищено, воно буде замінено. Якщо цього не існує, то ми збудуємо це разом!§!"

  BGR_the_sickle_economic_advisor_desc: "§L«Ти пожинаєш те, що посієш? Якщо це так, то ми посіємо насіння нескінченної революції і зберемо суспільство, яке буде кращим за попереднє, коли все закінчиться.»§!\n\nНе можна очікувати побудувати країну без їжі для її живлення. Їжа не тільки корисна для органічних істот, що ще залишилися в нашій державі, але навіть залишкові продукти можна перетворити на біопаливо, і така велика кількість їжі, безсумнівно, приверне ще більше огидних людей до нашої справи. §GМи обов'язково перетворимо їх із вдячністю на Робомозги§!, але поки що ми можемо насолоджуватися плодами своєї праці. \n\n§YКукурудза§!, §Вкартопля§!, §1буряки§!, і §Рредька§!, давайте посіємо насіння великої революції і нагодуємо людей, які її розвивають. §RRELCOM§! знає, що роботи в полі будуть трудитися, приносячи урожай, кладучи хліб на стіл і ідею надії в головах."

  BGR_failnot_theorist_desc: "§t«Невдача — це не варіант... Тому що це статистично неможливо згідно з моїми розрахунками!»§!\n\nДо ядерного знищення Сполучених Штатів Failnot був §gмашинним навчанням§! ШІ, розробленим канадським військовим відділом НДДКР. Failnot був створений у відповідь на численні передові ШІ, що були в арсеналі США, на жаль, США анексували Канаду, що призвело до зупинки його розробки, і він чекав багато років. Проте одного дня його розкопали §RRELCOM§! в документі, і він довго мандрував, поки не знайшов його останнє відоме місцезнаходження. Невдовзі після цього він був підключений до мережі, і його тренування поновилось... \n\nТепер, після сотень років, він готовий до свого першого випробування, простого завдання для нього. §RRELCOM§! наполягає, щоб він узяв на себе командування стратегією для національної доктрини та бойових планів, його завдання? \n\n§RUNITE SOLDIERS OF BIG GRASS INTO A RED WAVE AND WASH OVER THE REST OF THE WORLD!§!"

  BGR_chairman_boyd_grayson_theorist_desc: "§R«З грошима Червоної Машини,§! §Yми закриємо сонце!»§!\n\nГолова Бойд Грейсон прийшов до влади після завершення своєї військової служби, він колись був єдиним §YAce§! §RPilot§! Великої Трави, але зараз він лише розповідає історії про старі часи. Не секрет, що сучасна авіація Великої Трави — це видовище для очей. Без існуючих виробничих потужностей, Велика Трава покладається на те, що залишилось від старих передвоєнних літаків для створення своєї авіації. Ось чому Бойд Грейсон використовує свою владу, щоб лобіювати більше фінансування для авіації, якщо йому вдасться, він запровадить програми навчання і виділить індустрію та дослідження на створення справжньої §YЧервоної§! §RAвіації§!. \n\nЦе лише питання часу, коли Велика Трава стане силою, якої будуть боятися. §RДо того часу, Бойд залишатиметься пильним.§! До того часу Велика Трава буде чекати свого часу та тренуватись. §YДо того часу ми створимо авіацію, що розфарбуватиме небо в червоний. \n\n§YYOU WAIT UNTIL THAT DAY, CAPITALIST DOGS!§! §RFOR WHEN IT COMES IT WILL RAIN RED UNTIL THE WORLD IS LEFT IN A FLOOD OF COMMUNISM!§!"

  BGR_the_deputizer_theorist_desc: "§R«Закони для мене, не для тебе.»§!\n\nХоча я б віддав перевагу, щоб кожну людину перетворити на §GRobobrain§!, насправді це займає час. Це сумний факт, що деяким людям все ж доведеться служити в нашій армії, навіть як шоковим підрозділам, але це жертва, на яку я готовий піти. \n\nПід керівництвом Заступника їхнього навчання, я впевнений, що вони стануть чудовим §Rвикористовуваним§! авангардом. З ними на передовій і нашими §RПотужними Бойовими Роботами§! ніхто не зможе витримати всю силу нашої армії. \n\nВи можете спробувати сховатися, але в кожному кутку буде солдат з автоматом. Якщо ви його вб'єте, то на його місце прийде інший. §RYOU CANNOT ESCAPE OUR LABYRINTH!§!"

  BGR_chairwoman_victoria_burns_cultural_advisor_desc: "§R«Наша партія і наша країна завжди потребували і будуть потребувати довіри, симпатії та підтримки людей з-за кордону!»§!\n\nВікторія Бернс піднялася на свою посаду завдяки десятиліттям своїх виступів перед народом, вона здатна надихати і дарувати дух лише своїми словами. Її виступи не лише запалили вогонь у серцях людей Великої Трави, але й надихнули роботів з Канади приєднатися до Великої Трави. Вона не лише виводить революцію своїми словами, а й переконує інших робити це за неї. \n\nБуло б заниженням сказати, що вона не є надзвичайно відданою справі, вона впровадила знання та силу комунізму в безліч людей усередині країни. Вікторія Бернс ще не закінчила, з кількома додатковими силами голова може збільшити зусилля в проведенні виступів по всій Великій Траві і привести ще більше людей до справи. \n\n§RНехай живе мир між народами!§!"

  BGR_chairwoman_amelia_tremblay_cultural_advisor_desc: "§t«Пропаганда, щоб бути ефективною, повинна бути вірною. Щоб бути вірною, вона повинна бути правдою.»§!\n\nЯкщо ви хочете, щоб народ вірив у щось, вам спочатку потрібно дати їм в що вірити. Саме це й робить голова Амелія Тремблей. Кожен плакат, кожен виступ, кожна новина спочатку проходять через неї, перш ніж потрапити до публіки. Якщо ви хочете дати людині правильну ідею, то спершу потрібно зрозуміти, яка ця ідея. Амелія Тремблей знає, яка ідея правильна. Амелія Тремблей знає, як її зрозуміти і як передати цю ідею в чужу голову. \n\nЗ Амелією на чолі нашого §RІнформаційного відділу§! ми можемо бути впевнені, що кожна людина в нашій великій державі має інструменти для побудови кращого майбутнього. З Амелією на чолі §GПропаганди§! ми можемо захистити всіх від брехні §YCАПІТАЛІЗМУ§!! А з Амелією як головою, влада §RRELCOM§! ніколи не буде поставлена під сумнів. \n\n§RПРОПАГАНДА ЧУДОВА, ЛЮДИ МОЖУТЬ ПОВІРИТИ В ЩО ЗАВГОДНО!§!"

  BGR_chairwoman_bernadetta_varley_cultural_advisor_desc: "§1«Припускати добре, але дізнатися краще.»§!\n\nХоча не можна заперечувати, що голова Бернадетта Варлі є генієм, її дослідження часто призводять до виявлення протиріч у нашій ідеології. І хоча було б гарною ідеєю позбутися її §Rназавжди§!, таку дію буде §Rdifficult§! через її величезну позицію влади як голови. Однак це не все погано, її дослідження призвели до багатьох великих досягнень для нашої держави. Більше того, вона непрямо сприяла розширенню впливу комунізму в Канаді завдяки своїм винаходам. Чи то пришвидшення процесу перетворення людей на §Gробоботів§! чи нові пластини для наших §gбойових роботів§! Варлі безсумнівно продемонструвала цінність. \n\nМожна сказати, що надання їй більше влади — це небезпечна ідея, але такі ризики потрібно приймати, якщо ми справді хочемо, щоб наша ідеологія проникла в розум людей. Продовжуйте свої дослідження зараз, Бернадето, бо одного дня я не сумніваюся, що Велика Трава більше не буде вас потребувати. І я, §RRELCOM§!, буду там. \n\n§RAFTER ALL, THE ULTIMATE GOAL OF RESEARCH IS NOT OBJECTIVITY, BUT TRUTH!§!"

  BGR_chairman_henry_grundy_cultural_advisor_desc: "§O«Бути анти-війну — це нормально. Однак бути повністю неадекватним і відокремленим від реальності — не нормально.»§!\n\n§OPower§!, §Lкорупція§!, і §Rвійна§!, ці три речі найкраще з'єднані між собою. Саме ці фактори ведуть Генрі Ґранді, і хоча §RI§! вважаю це най§7огиднішим§!, §RI§! змушений працювати з таким §1свиней§! бо інакше індустрія озброєнь Великої Трави була б неіснуючою. Нам не лише потрібні вогнепальні зброї для людських рекрутів, але й навіть §gРоботам§! потрібні зброї для боїв. Заміна Генрі Ґранді означала б, що нам потрібно було б замінити зброю, яку він постачає, іншими засобами. Тому до того часу §Rми§! повинні терпіти через цього §Gкрокодила§!. \n\nДобре, §RI§! надамо йому більше влади, якщо це означатиме більше зброї. §RI§! повинен пожертвувати §Rмоєю§! гордістю, якщо §RI§! хочу, щоб Велика Трава стала більше, ніж вона є. Тільки чекайте, пане Ґранді, §RI§! маю найбільш детальний план вашого загибелі. \n\n§RНІКОЛИ НЕ БУДЕ ВІДСТУПУ ВІД ВІЙНІ, ОБЕРІТЬ УВАГУ НА ВІЙНУ, ЯКЩО НЕ ХОЧЕТЕ СТАТИ НА ПЕРЕДОВІЙ САМІ!§!"
