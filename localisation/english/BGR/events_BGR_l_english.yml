l_english:
 # events
  nf_bgr.1.t: "Народження RELCOM"
  nf_bgr.1.d: "Колись, до війни, чоловіка було забрано з узбіччя дороги людьми в чорному. Його особистість втрачена в часі, і останній, хто хотів дізнатися, що з ним сталося, був убитий разом з ним під час викрадення.\n\nЙого розум було вилучено і поміщено в експеримент, що був похідним від технології Робоботів. Хоча це була лише робоча назва, її назвали юнітом RELCOM — або RELIABLE COMmunications. Машина, хоч і трохи більша за звичайного Робобота і з кількома додатковими кінцівками, мала можливість з'єднуватися з цілим об'єктом віддалено. Недосконала, але здатна, RELCOM було доручено багато з повсякденних завдань на заводі з виробництва Робоботів, де він знаходився. Хоча це й не було передбачено, він отримав величезну владу над тим, що відбувалося на заводі.\n\nЗі зростаючою сміливістю канадських дисидентів, які зникали разом з родичами і друзями, що потрапляли до червоноосвітлених дверей заводу, RELCOM розумів, що він може зосередитися на захисті стін заводу від загарбників, або покращити виробництво ресурсів на заводі, прискорюючи їхню роботу. Що ж він обрав?"
  nf_bgr.1.a: "§RЗалізна лінія проти своїх ворогів.§!"
  nf_bgr.1.b: "§RКожну корову треба доїти!§!"

  nf_bgr.2.t: "Найцікавіша річ"
  nf_bgr.2.d: "Коли залишаєшся наодинці зі своїми думками надто довго, можна почати занадто багато думати про занадто багато речей. Для деяких це спосіб життя, чи то власний, чи чужий. Інші ж можуть думати про прості речі, як то вечеря чи що робить їхня дружина, поки вони на роботі — але RELCOM думав про суспільство.\n\nПеребігаючи через лабораторії і повзаючи по величезних камерах заводу, він часто бачив §Rледарів§!, §Rогидних собак§!, які майже нічого не робили, але отримували рівну винагороду. \n\nЩо ще більше відчужувало його §RGIGABRAIN§!, так це керівники, ці строгі мерзотники, які давали йому накази, але нічого не робили самі. Він ненавидів усе це: безперервні, байдужі вимоги, хворобливий спосіб, яким вони змушували нижчого науковця варити їм каву.\n\nВін почав шукати інші шляхи для роздумів: школи, в яких йому сказали не бути. Проводячи розкопки у володіннях одного зі старших науковців, він знайшов маленьку червону книжку — прикрашену іконографією, яку він точно не мав бачити. І тоді він зробив немислиме...\n\n§RВін почав її читати.§!"
  nf_bgr.2.a: "§RО, який червоний смак!§!"

  nf_bgr.3.t: "Третя спроба — вдалий шанс"
  nf_bgr.3.d: "RELCOM довго і наполегливо розмірковував над книгою і її змістом. Деякий час він роздумував над її можливістю; бути рівним серед своїх — це, мабуть, була б найбільша мрія будь-якої істинної особистості. Однак, коли він мовчки спостерігав за своїми колегами на заводі, він бачив гіркоту в очах нижчих науковців і заїкання керівників, що їх сміялися. І це змусило його задуматись: чому це так? \n\nДеякий час це дуже його турбувало. Чому люди насолоджуються такими стражданнями? Чому вони топчуть своїх колег з такою лютістю? \n\nВідповідь прийшла, наче сон, і він відчув поколювання на мозку. §RВони були розчаровані своїм тілом.§! Це було просте зрадництво, насправді: людський експеримент багато разів терпів невдачі протягом багатьох поколінь. Метал, однак? Метал вічний у способах, яких плоть не може зрівняти. Це поза кольором шкіри, поза вагою, поза... будь-чим. Це просто поза, і це була найпростіша істина, яку можна було сказати.\n\nВночі RELCOM розпочав свою нову маніфестацію... Перетворюючи всіх своїх колег у ту саму машиноформу, якою він став. Багато з них чинили опір, але інші були просто непідготовлені і не змогли боротися з ним та його переведеними машинами. І перш ніж він усвідомив це, у нього була армія — а потім, впали бомби."
  nf_bgr.3.a: "§RНавіть кінець світу не зупинить мене.§!"
  nf_bgr.3.b: "§RЗнищення породжує усамітнення. Усамітнення породжує розчарування...§!"

  nf_bgr.4.t: "Навіть бомба не зупинила прогрес"
  nf_bgr.4.d: "Навіть після того, як ядерний апокаліпсис зруйнував Землю, RELCOM вижив разом зі своїми наказаними побратимами, процвітаючи в глибинах заводу. Десятиліттями він ховався, відправляючи лише найвіддаленіших розвідників для збору додаткових припасів за необхідності. Роки мандрівники зникали, коли наближалися занадто близько до заводу: як кролики, які самі віддаються вовкам. Легенди говорили про багатоногі машини, як вони викрадали ваших дітей і більше їх не бачили. RELCOM насолоджувався цими жахами, але не звертав на них уваги. Ті, хто не належали до §RUNION MIND§!, не могли зрозуміти його мотиви.\n\nЗ часом, коли він став сміливішим, він почав відправляти все більше людей, і все більше людей зникало. Але скоро, хтось вирішив покласти цьому край — і один із штурмотронів на заводі не повернувся.\n\nПеребуваючи в розпачі, RELCOM наказав організувати пошукові групи, але ніхто нічого не зміг знайти. Натомість деякі зникли! RELCOM був в розгубленості. Злість, ні, трагедія охопила його; один штурмотрон був вартий стільки. Однак його сум не тривав довго, бо незабаром виникла нова сила в цих краях... §BКАПІТАЛІЗАТОР.§!"
  nf_bgr.4.a: "§RЩо за огидне наслідування!?§!"

  nf_bgr.5.t: "Капіталізатор: Утілення свободи"
  nf_bgr.5.d: "Її походження було невідоме. Її існування було невідоме. Її справжня мета була невідома — принаймні, до того часу, поки вона не знищила кілька патрулів RELCOM. Лише коли вони зустрілися обличчям до обличчя, стало зрозуміло більше — Капіталізатор, його найбільший ворог, була тим самим штурмотроном, якого він втратив, але явно модифікована в огидний американський маскот, пекельне дзеркало для контрасту його власного. "§BЗа свободу,"§! крикнула вона, "§BЗа ліберальність!"§! \n\n Хто б не був її конструктор, якими б не були її системи, він був занадто захоплений люттю, щоб ставити питання. В цій люті він втратив себе — і §BTHE CAPITALIZER§! змогла знищити завод сама, залишивши RELCOM похованим під завалами заводу вдруге. Минали десятиліття, і скоро, як і його брати та сестри, він заснув..."
  nf_bgr.5.a: "§RНіяка кома не зможе мене зупинити.§!"

  nf_bgr.6.t: "Червоний проти Синього"
  nf_bgr.6.d: "Після всього цього часу, §BTHE CAPITALIZER§! повернулася. Роки, десятиліття після їх першої битви, вони стояли там, дивлячись один на одного в найглибших шарах Скарлетної Гробниці. Червоне світло падало на них, як пустельний захід сонця, створений для двох, а земля під ними була покрита попелом від їх останнього бою. Обидва знали, що ставки високі... Однак, навіть тоді, RELCOM відчував спорідненість з цією машиною, оскільки вона просто виконувала завдання, для якого була створена. Він запропонував те, чого навіть не знав, що має в собі:\n\n Товариськість."
  nf_bgr.6.a: "§RAнгія може викликати найстранніші почуття...§!"

  nf_bgr.7.t: "Масляні плями як кров"
  nf_bgr.7.d: "§RRELCOM§! пропонував свої найкращі ідеї, але §BTHE CAPITALIZER§! просто не могла зрозуміти його логіку. Вона ніколи цього не робила. Вони билися там, у цій червоній траншеї, так само, як і десятиліття тому — \n\n тільки цього разу §RRELCOM§! не розглядав можливість знову програти. Переможений багатоногим Розумом і перевершений його силами, §BTHE CAPITALIZER§! впала вперше і востаннє в Скарлетній Гробниці.\n\n І так, як це було під час війни, §RCOMMUNISM§! та §RUNION MIND§! знову перемогли."
  nf_bgr.7.a: "§RЯкби це було так легко...§!"
  nf_bgr.7.a.tt: "Це відкриє права на всю Альберту — ефект зміниться, коли версія 5.0 додасть інші комуністичні держави!"

  nf_bgr.8.t: "Перехрещені дроти, кохання"
  nf_bgr.8.d: "Роботи були дивними. Ніхто не сперечався з цим. Особливо роботи, які інтерпретували комуністичні маніфести цинічно і моторошно. Наприкінці, обидва, §RRELCOM§! і §BTHE CAPITALIZER§!, знали, що вони занадто укорінені у своїх ідеалах, щоб переконати один одного словесно, і вони вже билися один з одним. Хто знає, може, вони не робитимуть це знову і знову до кінця часу?\n\n Тому, замість усіх інших варіантів, їхні програмні ланцюги прийшли до одного дивного завершення: поцілуватися, як люди під червоним місячним світлом Скарлетної Гробниці..."
  nf_bgr.8.a: "§PСправжнє... Кохання..?§!"
  nf_bgr.8.a.tt: "Це відкриє права на всю Альберту — ефект зміниться, коли версія 5.0 додасть інші комуністичні держави!"