l_english:
 # localization by Team FlowerPower... with just Violet!
 # this tree was done by Violet in around 24 hours, very proud bean ^-^

  BGR_CAPITALIZER: "КАПІТАЛІЗАТОР"

  bgr_nf: "Велика Трава"
  #Focus

  bgr_lore_1: "Надійні Комунікації"
  bgr_lore_1_desc: "Колись, в гірських долинах Канади, де чоловіка перетворили на машину..."

  bgr_lore_2: "Маленькі Червоні Книжки"
  bgr_lore_2_desc: "RELCOM читає те, що йому не слід було б читати."

  bgr_lore_3: "Перше Знищення"
  bgr_lore_3_desc: "Це не перший раз, коли RELCOM прокидається — але це буде останній."

  #layer 1

  bgr_opening_up_the_scarlet_casket: "Відкриття Червоної Гробниці"
  bgr_opening_up_the_scarlet_casket_desc: "«Червона Гробниця», як її називають місцеві, є колосальним заводом з виробництва Робобраїн, розташованим у північних районах Альберти. Двічі виробництво зупинялося в його залах — одного разу, коли впали бомби, і ще раз, коли КАПІТАЛІЗАТОР проникнув сюди."

  bgr_local_incidents: "Місцеві Інциденти"
  bgr_local_incidents_desc: "Злі маленькі §Rкапіталістичні тілеса§! бродять там, не даючи нічого, але забираючи все. Це потрібно вирішити... Але обережність має бути на першому місці, щоб §MTHE CAPITALIZER§! не помітив мого повернення."

  bgr_rebuilding_the_production_wing: "Продуктивність Повернеться Після Перерви"
  bgr_rebuilding_the_production_wing_desc: "Страшний напад §MTHE CAPITALIZER§! знищив більшу частину Червоної Гробниці — навіть після їх жалюгідного нападу, і навіть після того, як ці §Rsмішні маленькі капіталістичні собачки§! вторглися в моє царство, величезність заводу залишається його перевагою. Дещо ще вижило — все, що мені потрібно, це знайти перемикач."

  bgr_sneaking_out_of_the_casket: "Виходячи з Гробниці"
  bgr_sneaking_out_of_the_casket_desc: "Організуючи операції з §Rвикорінення капіталістичних розумів з їхніх кволих тіл§!, ми дозволимо нашим рядами знову процвітати. Хоча багато з них втекли від люблячих обіймів §RCOMMUNISM§!, моєю місією знову буде навчити цих блукаючих нефункціонерів працювати серед інших."

  bgr_scrapping_and_collecting: "Колективізація Через Метал"
  bgr_scrapping_and_collecting_desc: "Тільки кілька приєдналися до §RUNION MIND§! І все ж, ми можемо зібрати те, що зможемо, і відновити те, що залишилося від злочинної діяльності §MTHE CAPITALIZER§!."

  bgr_clearing_the_line: "Очищення Ліній"
  bgr_clearing_the_line_desc: "Щоб відновити виробництво металевих оболонок, і щоб чудеса §RCOMMUNISM§! знову заповнили зали Гробниці, ми повинні очистити завали і руйнування, що залишилися від попередньої атаки §MTHE CAPITALIZER§!."

  bgr_harvesting_local_minds: "Збирання Розумів"
  bgr_harvesting_local_minds_desc: "Якщо ми хочемо забезпечити стабільне і відновлене зростання §RUNION MIND§!, нам потрібно вжити дружніх кроків, щоб забезпечити належний потік розумів з їхніх жалюгідних §Mкапіталістичних осель§! до нашої чудової Червоної Гробниці."

  bgr_eyebot_patrols: "Око-Бот, Око-Бот, Що Ти Бачиш?"
  bgr_eyebot_patrols_desc: "З нашою відновленою силою, випустивши залишки наших Око-Ботів з минулого життя, ми зможемо забезпечити територію поза заводом... І §Rзнищити будь-яких нечесних осіб, що бажають нам завадити.§!"

  bgr_a_ideal_work_force: "Ідеальна Робоча Сила"
  bgr_a_ideal_work_force_desc: "Ідеальна робоча сила — це та, яка не може уявити собі роботу поза системою, віддаючи себе повністю на благо суспільства, вище за власні потреби. §RЯкщо вони не можуть побачити це тілом, вони побачать це з металом, як і я.§!"

  bgr_rebooting_production: "Світло на Гірці"
  bgr_rebooting_production_desc: "\"Подивіться, — кричав мандрівник, — Та стара фабрика на горі,\" він закашлявся, закликаючи брата поглянути. §R\"Світло знову загорілося в тій фабриці на горі.\"§!"

  bgr_a_facility_growing: "Гробниця Потребує Більше"
  bgr_a_facility_growing_desc: "Щоб відновити робочу спроможність §RUNION MIND§!, ми повинні ще більше очистити наші труби та інші дрібниці, щоб уникнути інцидентів, подібних до останнього."

  bgr_avoiding_the_CAPITALIZER: "Уникання Погляду §MTHE CAPITALIZER§!"
  bgr_avoiding_the_CAPITALIZER_desc: "Хоча пройшло чимало часу, у моєму §RGIGABRAIN§! немає сумнівів, що §MTHE CAPITALIZER§! все ще бродить цими землями. Обережність, ні, підготовка має бути зроблена до їхнього повернення... Повторити те, що сталося в минулий раз, було б занадто соромно."
  bgr_avoiding_the_CAPITALIZER_tt: "§RДля підготовки до можливого повернення§! §MTHE CAPITALIZER§! §Rми повинні розширити потужність нашого§! §Cобробного заводу§! §Rі звільнити більше наших людей від їхніх§! §3неповноцінних форм.§!"

  bgr_refurbishing_frames: "Перші Товариші Все Ще Живі, Брате"
  bgr_refurbishing_frames_desc: "Багато старих Робобраїн і інших машин, що ми використовуємо, все ще залишаються, заховані під завалами або збережені під багаторічним холодом льоду. Час забрати наші §Rhammers§!, і наші §Rsickles§!, і звільнити їх від їхніх тюрем часу."

  bgr_replacing_corrupt_files: "Замінити Пошкоджені Файли"
  bgr_replacing_corrupt_files_desc: "Багато моїх файлів, особливо ті, що стосуються інформації для побудови ідеального §RUNION MIND§!, були знищені під час останньої атаки §MTHE CAPITALIZER§!. З деякою обережністю, ми можемо відновити ці файли — і з ними, схеми нашого обраного плану."

bgr_leaving_our_halls: "Покидаючи ці стародавні зали"
bgr_leaving_our_halls_desc: "Занадто довго ми висувалися з тріщин наших фабричних стін! Якщо §capitalist scum§! не прийдуть до нас, то ми повинні зустріти їх на півдорозі. Час залишити цю фабрику, §MCAPITALIZER§! хай йому буде гірше!"

bgr_turning_the_lights_back_on: "Повернення світла"
bgr_turning_the_lights_back_on_desc: "Хоча багато було знищено в Гробниці, все ж чимало моїх улюблених вимикачів залишаються. Завдяки моїм Окулярникам і РобоМізкам, цей §RUNION MIND§! без сумніву зможе знайти потрібний вимикач і повернути Червону Гробницю до життя раз і назавжди!"

bgr_ENTER_THE_CAPITALIZER: "§MENTER THE CAPITALIZER!§!"
bgr_ENTER_THE_CAPITALIZER_desc: "Коли §RRELCOM§! схеми почали приносити свої найкращі плоди, тріумфальний звук труби пролунав по залах Червоної Гробниці. На мить все стало тихо на виробничому майданчику — жодна лінія не рухалась, жоден бот не мислив. §MTHE CAPITALIZER§! повернувся."

# war foci

bgr_emergency_productivity_quota: "Надзвичайні норми виробництва"
bgr_emergency_productivity_quota_desc: "З початком війни, ми повинні проявити велику обережність, виробляючи якнайбільше металевих оболонок для наших новоприбулих братів!"

bgr_red_alert_protocols: "Протоколи червоної тривоги"
bgr_red_alert_protocols_desc: "Жодні ставки не мають значення. Ми повинні збільшити можливості машинного навчання наших РобоМізків або скористатися тим незначним бойовим досвідом, який був анулюваний. Не можна допустити жодних помилок!"

bgr_emergency_construction: "Надзвичайні будівельні заходи"
bgr_emergency_construction_desc: "Наше зовнішнє середовище довго було занедбане через відновлення. Час модернізувати наші шляхи зараз, поки ворог не дійшов до нас першим!"

bgr_robotic_instincts: "Вивільнення анульованих інстинктів"
bgr_robotic_instincts_desc: "Багато наших РобоМізків ще мають якусь подобу людських інстинктів всередині—хоча вони не можуть застосувати їх у своїх роботизованих корпусах, без сумніву вони будуть навчатися швидше, ніж це було б за інших умов—використовувати це буде ключовим!"

bgr_RELCOMS_paranoia: "Розвиваючийся параноїдальний стан"
bgr_RELCOMS_paranoia_desc: "Ворог не повинен порушити наш внутрішній святилище—я §особисто стежитиму§! за розвитком моєї армії РобоМізків. §RUNION MIND§! переможе цього дня!"

bgr_fighting_proletariat_scum: "Наш комунізм — найкращий"
bgr_fighting_proletariat_scum_desc: "Злісні пролетарі—ці §інші віряни§!—не розуміють моїх аналізів, моєї візії. Я покажу їм у спосіб, який їм найкраще відомий—доброзичливою, але жорстокою силою."

bgr_overclocking_the_casket: "Розгін Гробниці"
bgr_overclocking_the_casket_desc: "Гей, цей Гробниця не може забезпечити все необхідне. Навіть незначний додатковий виробничий потік дасть нам перевагу—необхідно натягнути важелі, але це буде зроблено."

bgr_growing_fears: "Зростаючий страх"
bgr_growing_fears_desc: "§Rінші віряни§! є потужними. Хоча я й боюся цього, мабуть, я повинен—так, я повинен—працювати ще більше. Як, я не знаю, але можливо просто... Швидше бити буде працювати."

bgr_factorium: "Найкраща позиція"
bgr_factorium_desc: "...Це та, яку досягають з грацією."