l_english:
mdt_once_a_viper:0 "Про Зміїв і Гріхи"
mdt_once_a_viper_desc:0 "До корони, до кільця долі, було лише тремтіння — тінь змії, що сковзає крізь туман пам’яті."

mdt_then_nobody:0 "Безкоронна Зраджена"
mdt_then_nobody_desc:0 "Вони забрали моє ім’я, мою історію, мою подобу. Я блукала порохом, невимовна й забута, примара в тілі королеви."

mdt_until_they_found_the_truth:0 "Коли Колінна Кістка Схилилась"
mdt_until_they_found_the_truth_desc:0 "Сторінки дихали. Вони *знали* мене. Кожна руна — відлуння, кожен вірш — пам’ять, що воскресла. Це була не маячня — це було одкровення."

mdt_rise_of_the_gorgons:0 "Піднесення Горгон"
mdt_rise_of_the_gorgons_desc:0 "Вони думали, що епоха зміїв — це пил і байки. Сміялися з пророцтв, називали їх божевіллям. Але у пророцтва є пульс — і він б’ється в мені. Нехай дивляться, як Горгони постають знову, бо ніщо не справжнє, а вигадка — істина!"

mdt_schemes_against_the_trolls:0 "Змови проти Тролів"
mdt_schemes_against_the_trolls_desc:0 "Перший, вождь великого Війська Тролів, не визнає моє божественне право!\nЩе гірше — якщо я не діяти, він нападе на одне з моїх васальних князівств — клан [RBT.GetName] на півночі.\nЯкщо ми забезпечимо вірність [RBT.GetAdjective], разом ми знищимо Тролів до того, як вони стануть загрозою."

mdt_send_heroes_to_the_vulnerable_north:0 "Надіслати Героїв на Вразливу Північ"
mdt_send_heroes_to_the_vulnerable_north_desc:0 "Після того, як я за допомогою чаклунства «нагадала» кільком героям про їх забуте минуле, вони радо допоможуть мені у забезпеченні вірності клану [RBT.GetName].\nЯ маю допомогти їм здійснити свої мрії."

mdt_gifts_for_our_future_subjects:0 "Подарунки Майбутнім Підданим"
mdt_gifts_for_our_future_subjects_desc:0 "[RBT.GetAdjective] — багатий клан, але тільки для обраних.\nСтарі воїни їздять у металевих бойових машинах, а молоді мають лише палиці. Якщо вони хочуть бути гарними васалами й допомогти мені знищити тролів, краще надіслати їм зачаровану зброю та реліквії зі скарбниці."

mdt_hatch_the_scheme:0 "Запустити Змову"
mdt_hatch_the_scheme_desc:0 "Я зробила все можливе, а Тролі стають сильнішими щодня. Час подавати сигнал — і побачити, чи [RBT.GetAdjective] визнають моє божественне право.\nЦі брудні Тролі й не знатимуть, що їх вдарило."

mdt_magics_of_the_sorceress:0 "Чари Чаклунки"
mdt_magics_of_the_sorceress_desc:0 "Як вони можуть вважати мене божевільною?! Подивіться на магію, яку я творю!\nЇм лише потрібно побачити це на власні очі..."

mdt_mesmerizing_relics:0 "Зачаровуючі Реліквії"
mdt_mesmerizing_relics_desc:0 "Наймогутніша з моїх магій — «Месметрон», пристрій, що відкрив мені мою забуту спадщину як Королеви Горгон. З його допомогою я зможу навчити інших забутому минулому — й покінчити з цим кошмаром брехні!"

mdt_enchanted_collars:0 "Зачаровані Нашийники"
mdt_enchanted_collars_desc:0 "Іноді вбивство не є необхідним. Підвести людину до межі життя й смерті — ось що змушує слухатися.\nДля цього й існують «Зачаровані Нашийники». З моєю «магічною паличкою» я можу вибухнути їхню голову за власним бажанням! Жоден не посміє зрадити мене."

mdt_alchemical_enthrallment:0 "Алхімічне Підкорення"
mdt_alchemical_enthrallment_desc:0 "Деякі радники надто скептично ставляться до моєї магії... О! Я знаю! Я зроблю з них рабів за допомогою улюбленого зілля.\n«Зілля Підкорення» — подрібнені Ментати та висушений язик Вендіго, настояні на Гамма-Галпі. Після шести доз ці дурні стають Алхімічними Рабами, які не можуть жити без нових зіль!"

mdt_mesmerize_the_cave_trolls:0 "Зачарувати Печерних Тролів"
mdt_mesmerize_the_cave_trolls_desc:0 "Хоча Тролі думали, що я їх знищу… це не їхня доля. Я не вбивця, я — вчителька, що показує світу правду, яку він забув.\n§RВони всі побачать, як бачу я.§!"

mdt_the_matter_of_our_new_subject:0 "Питання Нового Підданого"
mdt_the_matter_of_our_new_subject_desc:0 "Здається, [RBT.GetAdjective] не такі вже й вірні. Чутки про повстання… Я повинна дізнатися правду."

mdt_compliance_is_appreciated:0 "Покірність Вітається"
mdt_compliance_is_appreciated_desc:0 "Добре, що нам вдалося уникнути конфлікту. Краще заохотити вихованця за гарну поведінку."

mdt_compliance_by_force:0 "Покірність Силою"
mdt_compliance_by_force_desc:0 "§RЯ ЇХ НАВЧУ ПОКОРІ!§!"

mdt_mesmerize_our_new_pets:0 "Зачарувати Нових Улюбленців"
mdt_mesmerize_our_new_pets_desc:0 "Я більше не допущу помилок. Навіть ті, хто здається вірним, мають бути навчені їхньому призначенню через чаклунство."

mdt_mastery_over_mutants:0 "Влада над Мутантами"
mdt_mastery_over_mutants_desc:0 "Ці «Мутанти», як себе називали Тролі — дивна раса. Величезні, повільні й безплідні. Ви чуєте це? Це звук народу, готового згадати свою роль як раси рабів!"

mdt_labouring_giants:0 "Гіганти-Трударі"
mdt_labouring_giants_desc:0 "«Бегемоти» — справжні дива серед Тролів. Їхні слабкі уми важко піддаються чарам, але з правильними наглядачами їх можна контролювати. Час використати їх працю!"

mdt_blessing_crater_lake:0 "Освячення Озера Кратера"
mdt_blessing_crater_lake_desc:0 "Озеро Кратера — джерело магії. Воно світиться зеленим сяйвом, а мутанти використовують його води, щоб творити нових собі подібних. Я повинна контролювати цю силу."

mdt_breaking_the_first:0 "Зламати Першого"
mdt_breaking_the_first_desc:0 "Наша влада над Тролями нестабільна. Чари діють слабо. Щоб їх підкорити — треба зламати їхнього ватажка. Пора навідатись до Першого в його камеру… §Rі зламати його особисто.§!"

mdt_cultists_of_the_sea:0 "Морські Культисти"
mdt_cultists_of_the_sea_desc:0 "На західному кораловому узбережжі мешкає народ [MLT.GetName], який поклоняється велетенській Болотниці як богині!\nХа! Я не дозволю такої єресі біля своїх кордонів — їм нагадають їхнє місце!"

mdt_coral_riches:0 "Багатства Коралів"
mdt_coral_riches_desc:0 "Виявляється, корал — рідкісний товар. Гострий, твердий і красивий. Його хочуть і митці, і зброярі. Торгівля ним принесе моєму королівству багатство — і я цим скористаюсь!"

mdt_oracles_of_the_gorgon_queen:0 "Оракули Королеви Горгон"
mdt_oracles_of_the_gorgon_queen_desc:0 "«Коралевий Суд» — оракули, що правили Племенем Болотників… чи так їм здавалось. Насправді вони завжди мали служити мені — просто забули про це. Вони навернуться, як і решта пусток."

mdt_breaking_the_coast:0 "Прорив Узбережжя"
mdt_breaking_the_coast_desc:0 "М'лулу вважали богом серед Болотників. А насправді? Це просто звір, як і всі інші. Кораловий Суд завжди був надто захисливим до цього монстра — настав час «переконати» їхніх наглядачів дозволити нам привести цю тварюку на поле бою на нашому боці."

mdt_necromancers_of_the_wastes:0 "Некроманти Пусток"
mdt_necromancers_of_the_wastes_desc:0 "На сході мешкає темна група, відома як [BDT.GetAdjective]. Якщо я щось і знаю, так це те, що спрагу некроманта до крові не втамувати. Ми повинні підкорити цих людей, аби здійснити свою долю."

mdt_hypnotised_gecko_warriors:0 "Гіпнотизовані Воїни-Гекони"
mdt_hypnotised_gecko_warriors_desc:0 "У завойованих землях некромантів Танцюристів Кісток мої розвідники знайшли дивне явище — групу геконів! Зазвичай вони живуть у південних пустелях, але, здається, кілька десятків років тому сюди перекочувала невелика група.\nЯке провидіння! За допомогою чаклунства я підкорю їх — такі істоти чудово підійдуть для моєї армії."

mdt_acolytes_of_the_gorgon_queen:0 "Послушники Королеви Горгон"
mdt_acolytes_of_the_gorgon_queen_desc:0 "[BDT.GetAdjective] мають досить дивну релігію, засновану на поклонінні смерті. Після невеличкої гіпнотичної «корекції» вони добре послужать при моєму дворі."

mdt_mesmerize_the_bone_dancers:0 "Зачарувати Танцюристів Кісток"
mdt_mesmerize_the_bone_dancers_desc:0 "Тепер, коли ми завоювали землі Танцюристів Кісток, я можу нарешті нагадати їм про своє законне право на владу. Вони навчаться."

mdt_united_heartlands:0 "Об’єднання Серцевинних Земель!"
mdt_united_heartlands_desc:0 "Мої піддані завершили захоплення найважливіших регіонів королівства. Тепер, коли серцевина знову єдина, ми достатньо сильні, щоб здійснити свою долю — нас уже не зупинити!"
mdt_united_heartlands_tt:0 "§gПісля підкорення багатьох племен і інтеграції їх у мою державу, ми здобули їхні технології та додали їх до власного арсеналу.§!"

mdt_trappers_of_the_lakes:0 "Ловці Озер"
mdt_trappers_of_the_lakes_desc:0 "Озерні землі на півдні завжди були природним кордоном мого королівства. І хоча нащадки моїх королівських мисливців досі живуть на тих пагорбах, вони забули про свою вірність. Час нагадати їм, що браконьєрство — це королівський гріх."

mdt_bless_the_lakelands:0 "Освятити Озерні Землі"
mdt_bless_the_lakelands_desc:0 "Води Озерних Земель багаті, але після нашого відходу з регіону вони сильно забруднились. Мені доведеться очистити їх магією, аби повернути їхню красу разом зі мною."

mdt_hunters_of_the_gorgon_queen:0 "Мисливці Королеви Горгон"
mdt_hunters_of_the_gorgon_queen_desc:0 "Змушу їх згадати. Полювати на слабких, захоплювати сильних і приручати їх як моїх псів. Мисливці Траппер-Тауна продовжать займатись своєю справою, але знову платитимуть податок короні."

mdt_coerce_klamath:0 "Примусити Кламат"
mdt_coerce_klamath_desc:0 "Місто Кламат опиралось нашому приходу, але зрештою здалось. Вони знову служитимуть мені як мисливці, а їхній мер стане моїм головним королівським мисливцем. Його знання пагорбів стануть у пригоді."

mdt_settlers_of_the_hills:0 "Поселенці Пагорбів"
mdt_settlers_of_the_hills_desc:0 "Південні пагорби завжди були малолюдним, але зручним для оборони місцем мого королівства. Та поки я відволіклась, їх заселили чужинці. Вони можуть залишитись — якщо присягнуть короні."

mdt_temple_of_amazons:0 "Храм Амазонок"
mdt_temple_of_amazons_desc:0 "Народ Арройо мав Храм Випробувань, де проводили випробування для нових вождів. Яка цікава ідея! Повторю ці випробування, а згодом використовуватиму цей храм для тренування нових воїнів. Його назвуть Храмом Амазонок."

mdt_legendkeepers_of_the_gorgon_queen:0 "Охоронці Легенд Королеви Горгон"
mdt_legendkeepers_of_the_gorgon_queen_desc:0 "Поселенці мали легендарного лідера, що залишив пригоди в пустках заради вищої мети. Вони дбайливо зберігали історію його мандрів. Після кількох правок, вони продовжать записувати й мої великі діяння."

mdt_mesmerize_arroyo:0 "Зачарувати Арройо"
mdt_mesmerize_arroyo_desc:0 "Можливо, Арройо забув, хто є їхнім Обраним. Але після гіпнотичного нагадування вони згадають свою королеву. Я також попрошу їхнього найкращого воїна приєднатись до мого війська — гарний, до речі."

mdt_dwellers_of_the_dunes:0 "Жителі Дюн"
mdt_dwellers_of_the_dunes_desc:0 "На південному сході лежать трав’янисті дюни, які слугували нечітким кордоном. Місце під назвою Новий Чемалт з його вагонами-бараками завжди було невеликим торговим вузлом. Ми повернемо свої дюни."

mdt_traders_of_the_gorgon_queen:0 "Торговці Королеви Горгон"
mdt_traders_of_the_gorgon_queen_desc:0 "Станція колись була важливим залізничним вузлом, про що свідчать величезні гармати й довоєнні склади зброї. Найкращі торговці мого королівства мешкають тут. Час нагадати їм, що час платити короні належне."

mdt_border_guards_of_the_gorgon_queen:0 "Прикордонники Королеви Горгон"
mdt_border_guards_of_the_gorgon_queen_desc:0 "На сході мешкає дивний народ із родоводами ще з довоєнних часів. Вони горді воїни, які могли б стати чудовими прикордонниками, бо я не планую тягнути руку в безкраї пустелі."

mdt_compel_chemult:0 "Підкорити Чемалт"
mdt_compel_chemult_desc:0 "Купці з базару Чемалта приєднаються до мого двору як скарбники — після «старої доброї» гіпнотизації. Акрі стане моїм охоронцем каравану — хоче він цього чи ні."

mdt_rangers_of_the_woods:0 "Рейнджери Лісів"
mdt_rangers_of_the_woods_desc:0 "Природні північні та східні кордони — це річка Снейк. А моєму королівству все ще не вистачає королівського лісу біля неї. Піддані досі живуть у лісах, але забули своє призначення. Доведеться нагадати."

mdt_druids_of_the_deep_vert:0 "Друїди Глибокого Вертня"
mdt_druids_of_the_deep_vert_desc:0 "У глибинах лісів живуть давні, дивні люди, які знають природу краще за всіх. Мої друїди ще існують і добре зберегли таємниці старого світу — тепер їм лишилось повернутись до гайків із сталевими нашийниками й зварити мені зілля з подрібнених Ментатів."
mdt_druids_of_the_deep_vert_tt:0 "§gМезмерельда використовує таємні зілля й месметрон, щоб перетворити плем’я Літлфут на елітне військо! Вони битимуться як звірі зі старих легенд!§!"

mdt_foresters_of_the_gorgon_queen:0 "Лісники Королеви Горгон"
mdt_foresters_of_the_gorgon_queen_desc:0 "Ліси Валла-Валли прекрасні та заспокійливі, але деревина тут — рідкісний і цінний ресурс у мертвих пустках. Мої лісники знову візьмуться за сокири — вони вже посадили достатньо дерев на століття вперед."

mdt_mesmerize_the_timberline:0 "Зачарувати Лісосмугу"
mdt_mesmerize_the_timberline_desc:0 "Скаути, рейнджери, лісові чудовиська й дроворуби — всі вони схиляться перед моєю владою. Їхній лідер Беар Бан'ян вважає себе пацифістом, але після невеличкого «переконання» радо поведе моє військо крізь хащі старого світу."

mdt_crowning_of_the_gorgon_queen:0 "Коронація Королеви Горгон"
mdt_crowning_of_the_gorgon_queen_desc:0 "Моє королівство відновлено, вірність підданих — забезпечена, мої землі — відроджені. Я досягла мети й відбудувала те, що світ забув.\nТепер мені лишилося тільки одне — корона."
#
born_of_hubris:0 "Народжена Зарозумілістю"
gorgon_queen:0 "Королева Горгон"
