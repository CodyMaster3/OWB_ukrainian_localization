l_english:
nf_mdt.1.t:0 "Життя як Гадюка"
nf_mdt.1.d:0 "Спогади розмиті, але я знаю одне: я колись була Гадюкою. Однією з них. Рейдеркою, вершницею, донькою жорстокості. Ми били швидко та зникали ще швидше, залишаючи попіл у слід.\n\nЗараз я не вважаю їх своїм народом — не по-справжньому. Але вони дали мені мету, коли в мене її не було. Я носила їхні кольори, слідувала їхнім законам. Навіть сміялась, як вони.\n\nНе пам’ятаю лише імені, що носила тоді. Воно зникло, стерте.\n\nАле до того... у мене був дім. Ім’я. Історія. Пам’ятаю одне чітко — комікс біля ліжка.\n§RҐроґнак Варвар.§! Я читала його перед сном, шепочучи рядки як молитву.\n\nЩо я винесла з того життя у нове?"
nf_mdt.1.a:0 "Ніколи не здавайся."
nf_mdt.1.b:0 "Лише сильні виживають."
nf_mdt.1.c:0 "Нікому не довіряй до кінця."

nf_mdt.2.t:0 "Порожнеча"
nf_mdt.2.d:0 "Ми їхали на північ на завдання — інструменти, хлам, полонені. Я не ставила питань. Я була Гадюкою.\nАле не я одна мала плани.\nХтось вдома хотів, щоб я зникла. Пошепки в вуха, монети в руки. Коли час настав — Гадюки зрадили мене.\nВони не вбили мене. Це було б занадто милосердно.\nВони використали інструменти, які ми привезли — плоскогубці, залізо, ланцюги. Не щоб убити — щоб стерти. Забрати ім’я. Обличчя. Минуле.\n\nЗалишили мене в уламках паланкіна, ледь живу.\nЯ потягнулась до чогось. Будь-чого. І знайшла.\n§RҐроґнак Варвар: Битва з Королевою Горгон.§!\nЯ відкрила його кривавими пальцями. І вона була там.\n§RМесмерельда.§! Королева. Зброя. Історія, яку я можу носити як броню. Лише я знатиму про свої шрами..."
nf_mdt.2.a:0 "Шрами на обличчі."
nf_mdt.2.b:0 "Шрами на тілі."
nf_mdt.2.c:0 "Шрами на душі."

nf_mdt.3.t:0 "Правда"
nf_mdt.3.d:0 "Я пішла з півночі, маючи лише інструменти, якими мене ламали — і ім’я, що взяла з коміксу. Не старе ім’я. Не їхнє. Моє.\n§RМесмерельда.§!\n\nЯ зустріла Питущих Кістковий Мозок. Жорстоке плем’я, горде, озброєне. Вони подумали, що я жертва. Стежна.\nВони помилились.\n\nПолум’ям і люттю я розбила їхніх чемпіонів. Кожним ударом розповідала історію — про Ґроґнака, про Королеву Горгон, про ім’я, народжене з попелу та зради. Я показала, ким стала.\n\nІ коли все скінчилось — вони не сміялись. Вони слухали.\nЯ розповіла про §RХабріс§! — не лише видавництво, а силу. Ідею. Правду.\n\nІ коли спитали, чого я прагну, я відповіла:\nНе жалю. Не миру.\nДани."
nf_mdt.3.a:0 "Вони принесли мені залізо й вогонь."
nf_mdt.3.b:0 "Вони поділились історіями та таємницями."
nf_mdt.3.c:0 "Вони дали мені воїнів під командування."

nf_mdt.4.t:0 "Темна пропозиція?"
nf_mdt.4.d:0 "[MDT.GetName] пропонують нам допомогу — вони готові допомогти знищити супермутантів на півдні, якщо ми підкоримось їм. Хоча підкорення звучить не надто привабливо, це дасть змогу уникнути завоювання з боку Warren."
nf_mdt.4.a:0 "Warren — наш головний ворог. Ми приймаємо."
nf_mdt.4.b:0 "Підкорення — не варіант! Битимемось самі."

nf_mdt.5.t:0 "Вони відмовляються!"
nf_mdt.5.d:0 "Схоже, у Ламайреберців з’явилась смертна кара."
nf_mdt.5.a:0 "Гаразд! Я все одно їх підкорю."

nf_mdt.6.t:0 "Вони погодились!"
nf_mdt.6.d:0 "Схоже, вони не такі дурні, як виглядають. Разом ми розчавимо Тролів."
nf_mdt.6.a:0 "Чудово! Витремо тролів з лиця землі разом!"

nf_mdt.7.t:0 "Вічний пакт?"
nf_mdt.7.d:0 "Нещодавно до нас знову звернулись [MDT.GetAdjective], цього разу — з більшою агресією. Їхній \"посланець\" говорив про наші землі так, ніби вони вже належать їм. Тепер, коли тролів не залишилось — може, нам не варто більше слухатись?\n\nЯкщо приймемо — скоро нас формально приєднають."
nf_mdt.7.a:0 "Ми ніколи це не приймемо!"
nf_mdt.7.b:0 "Схоже, вибору немає..."

nf_mdt.8.t:0 "[RBT.GetName] повстали!"
nf_mdt.8.d:0 "[FROM.GetName] зрадили нас! Вони думають, що незалежні, і що наша угода була тимчасовою!"
nf_mdt.8.a:0 "Невже?!"

nf_mdt.9.t:0 "Вони підкоряються!"
nf_mdt.9.d:0 "Скоро їхні землі формально стануть частиною мого королівства. [FROM.GetAdjective] більше не прагнуть незалежності."
nf_mdt.9.a:0 "Добре..."

nf_mdt.10.t:0 "Важка, як Дубова Корона"
nf_mdt.10.d:0 "Усе почалось із шрамів. Зради. З історії, витягнутої з уламків паланкіна.\n\nТепер ця історія стала законом.\n\nВ Орегоні мене більше не бачать як дівчину без імені, як рабу, яку покинули, як зброю зі сміття. Ні. Вони схиляються, бо знають правду:\nЯ — §RМесмерельда§!, Королева Горгон, Перша зі Зміїної Лінії, Суверен Хабрісу.\n\nСвіт, який вони вважали реальним — кордони на картах, кланові рейдери, іржаві закони старих часів — усе це було ілюзією. Я переписала його. Не чорнилом, а вірою.\n\nТепер васали збираються. Не як рівні — як свідки. Щоб побачити коронацію не воєначальниці, а міфу, що став плоттю.\nЦя корона не золота. Вона з окаменілого дуба. Виросла з руїн. Вкорінена у помсті.\nІ важка, як її значення."
nf_mdt.10.a:0 "Нехай спостерігають, як вигадка стає правдою."