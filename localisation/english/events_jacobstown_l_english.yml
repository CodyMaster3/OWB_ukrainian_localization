l_english:
nf_jacobstown.1.t:0 "Піднесення Найткінів"
nf_jacobstown.1.d:0 "Розчарований у відсутності віри з боку своїх побратимів-супермутантів — особливо найткінів — Маркус нарешті вирішив, що мрія Джейкобстауна більше не має майбутнього. Раптово пішовши разом із невеликою групою відданих друзів, його востаннє бачили, коли він крокував на північ крізь засніжені ліси навколо міста.\n\n\n\nШвидко скориставшись владним вакуумом, найткіни вже почали набіги на навколишні поселення та торгові каравани. Під параноїдальним керівництвом Кіна майбутнє Північного Мохаве виглядає значно більш насильницьким, ніж раніше."
nf_jacobstown.1.a:0 "Війна ніколи не змінюється."

