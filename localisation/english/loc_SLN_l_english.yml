### рішення ###

SLN_vision_quest_cat: "Візіонерський Похід Рел-Оссіна"
SLN_vision_quest_cat_desc: "Чим гіршою стає хвороба Рел-Оссіна, тим частіше йому сняться Творці, що кличуть його повернутись до місця створення його народу. Незабаром він вирушить у свою останню подорож — щоби або зцілитись біля ніг Майстрів, або загинути, намагаючись.\n\nРел-Оссіну знадобиться чимало припасів у вигляді §yдопоміжного спорядження§!, щоби вижити під час своєї подорожі. Якщо ви не зможете його забезпечити — пустка, ймовірно, його знищить."
SLN_vision_quest_countdown: "Похід Рел-Оссіна Розпочато"

SLN_burrow_cat: "Нори С'Лантер"
SLN_burrow_cat_desc: "С'лантери жили в лісах Нор протягом поколінь, створивши складну мережу підземних тунелів і камер. Це дозволяє їм переносити більшість своєї промисловості під землю, роблячи її недоступною для загарбників і сприяючи її процвітанню."
SLN_burrow_civ: "Викопати Цивільну Фабрику"
SLN_burrow_mil: "Викопати Військову Фабрику"