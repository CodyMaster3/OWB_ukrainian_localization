  l_english:

  #### Focuses ####

SLN_REL_OSSIN_NAME: "Рел-Оссін"
SLN_REL_OSSIN_DESCRIPTION: "Син Мінішена та брат попередньої очільниці С'Лантер, Рел-Оссін — лідер, шлях якого позначено трагедією й суперечками. Та сама хвороба, що забрала його сестру, точить і його тіло. Багато хто вважає це карою Творців за порушення спадкової лінії. Його врівноважений характер і сповнений надії погляд роблять його справедливим ватажком, але з кожним днем, коли його постать стає дедалі кволішою, постає питання: що чекає С'Лантер далі?"
SLN_TOP_LEADER_NAME: "Мер Ейр"
SLN_TOP_LEADER_DESCRIPTION: "Ніхто не обирав Ейра мером, та його дотепність і харизма зробили його улюбленцем Сверхніх Жителів. Він став променем надії між параноїдальними Піджителями й виснаженим керівництвом. Після смерті Рел-Оссіна, Ейр готовий повести С'Лантер у нове майбутнє."
SLN_DEN_LEADER_NAME: "Бригадир Ток-Ар-Ток"
SLN_DEN_LEADER_DESCRIPTION: "Ток-Ар-Ток фактично очолював Піджителів ще до правління Рел-Оссіна. За Рінар він був спокійним і врівноваженим, але після її смерті в ньому зросли страх і параноя перед гнівом Творців. Тепер він бачить Пустку як море загроз і готовий укріпити С'Лантер до останнього."

sln_an_escape: "Втеча / Одіссея"
sln_an_escape_desc: "Майстри створили нас. Піднесли з-поміж звірів. З якою метою — невідомо. Відомо лише те, що Старі залишили Сяйво Творців. Подорож тривала багато життів наших тваринних пращурів. Вона змінила нас. Відкрила світ за межами Сяйва Творців. І майже знищила нас. Аж поки ми не знайшли місце, що стало Норами."

sln_an_encounter: "Зустріч / Розділення"
sln_an_encounter_desc: "Перші люди, яких ми зустріли після поселення, називали себе \"Гадюками\" — і виправдали назву: поводились, ніби самі тварини. Вбивали, намагались зробити нас рабами. Ми боролись. Ми перемогли. Та рани залишилися."

sln_a_draught: "Посуха / Віра"
sln_a_draught_desc: "Коли ми втратили останнього зі Старих, здавалось, що сам світ обернувся проти нас. Наші дерева захворіли, річка висохла. Ми втратили багатьох від голоду та хвороб. Мінішен, син останнього Старого, розповів нам про Творців. Про те, як вони створили нас сильними й розумними. Ми вижили. Знову."

sln_a_question: "Питання / Без відповіді"
sln_a_question_desc: "Розповіді Мінішена переконали багатьох С'Лантерів. Особливо Піджителі вбачали в них підтвердження, що вони не повинні наслідувати людей, а перевершити їх. Але Сверхні Жителі прагнули більшого. Вони вирушили шукати сяюче місце з легенд, щоб спитати Творців: «Чому?» Те, що вони знайшли, не дало відповіді."

sln_a_death: "Смерть / Хвороба"
sln_a_death_desc: "Рінар, дочка Мінішена, керувала нами багато сезонів. Аж поки не занедужала. Ми не змогли врятувати її. Вона померла. Без нащадків. Уперше влада перейшла не по крові, а до її брата. Розбрат лише зростав.\nА потім захворів і він."

sln_vlt_alliance_branch: "Альянс із Жителями Сховища"
sln_vlt_alliance_branch_desc: "Вулиці Міста-Сховища повні механічних друзів. Можливо, час нам створити власних?"

sln_reno_alliance_branch: "Альянс із Нью-Ріно"
sln_reno_alliance_branch_desc: "Конструктори зброї з Нью-Ріно поділились із нами своїми секретами."

sln_topdweller_1: "Цацки"
sln_topdweller_1_desc: "Наші інструменти надто малі для людей, але деяким вони подобаються як дрібнички. Можемо продавати зайві на місцевих ринках за їхні металеві гроші."

sln_topdweller_2: "Галька"
sln_topdweller_2_desc: "Піджителі завершили дві нові Нори, які можна перетворити на майстерні."

sln_topdweller_3: "Контроль"
sln_topdweller_3_desc: "Сверхні й Піджителі часто сперечаються про ціни. Дозволивши Сверхнім встановлювати їх, ми підвищимо ефективність."

sln_dendweller_1: "Барикади"
sln_dendweller_1_desc: "Наші нори — прекрасні пастки. Час зосередитись на будівництві нових укріплень."

sln_dendweller_2: "Підготовка"
sln_dendweller_2_desc: "Піджителі — майстри копання й бою. Посилення цих вмінь зробить нас ефективнішими."

sln_dendweller_3: "Бункери"
sln_dendweller_3_desc: "План Піджителів — перетворити деякі будівлі Сверхніх на бункери, укріпивши їх ґрунтом. Та й навіщо Сверхнім стільки будівель?"

sln_dying_1: "Занепад / Відродження"
sln_dying_1_desc: "Попри те, що Рел-Оссін ледь підводиться з ліжка, він знає: С'Лантер має розвиватися. Натхненна промова та показ сили запускають нову будівельну кампанію."

sln_dying_2: "Організація / Ефективність"
sln_dying_2_desc: "Наші дрібні лапки не підходять для людських інструментів. Але створивши свої — ми станемо вправнішими майстрами."

sln_dying_3: "Передбачення / Надія"
sln_dying_3_desc: "Видіння Рел-Оссіна дедалі сильніші. Щоб пройти шлях, йому потрібні інструменти. Ми маємо об'єднатися й дати їх йому."

sln_dying_4: "Єдність / Мир"
sln_dying_4_desc: "Його здоров’я згасає. Час суперечок минув. Ми повинні допомогти нашому лідерові й підготувати націю до майбутнього."

sln_dying_5: "Виробництво / Ефективність"
sln_dying_5_desc: "С'Лантерці — найкращі будівничі, копачі та виживальники. Ми маємо інвестувати в себе — і розквітнемо."

sln_the_top_dwellers_will_lead:0 "Як Згори, так І Здолу"
sln_the_top_dwellers_will_lead_desc:0 "Ніхто не обирав Ейра мером, та його харизма й дотепність зробили його улюбленцем серед Сверхніх Жителів. Він став світлом надії між параноїдальними Піджителями та виснаженим керівництвом. Із завершенням страждань Рел-Оссіна, Ейр готовий повести С'Лантер у майбутнє."

sln_top_final_1:0 "Будівництво"
sln_top_final_1_desc:0 "Піджителі завжди наполягали, щоб будівлі були під землею, але епоха схованок минула. Нам слід розвивати інфраструктуру на поверхні."

sln_top_final_2:0 "Прибутки"
sln_top_final_2_desc:0 "Поки Піджителі важко працюють, мер Ейр знаходить нові ринки для їхніх товарів. Якщо пляшкові кришки купують людську повагу й мир — С'Лантер теж потребує прибутків!"

sln_top_final_last:0 "Легітимність"
sln_top_final_last_desc:0 "Час ховатись від людства минув. Ми більше не будемо тулитись у норах чи ховатись серед дерев. Настав час прийняти людських сусідів."

sln_the_den_dwellers_will_lead:0 "Бригадир для С'Лантер"
sln_the_den_dwellers_will_lead_desc:0 "Ток-Ар-Ток був фактичним лідером Піджителів ще до Рел-Оссіна. Під час правління Рінар він був спокійним і врівноваженим, але після її смерті він став дедалі більш наляканим і параноїдальним через гнів Творців. Тепер він бачить Пустку як море загроз і готовий укріпити С'Лантер, аби вижити."

sln_den_final_1:0 "Підтримка"
sln_den_final_1_desc:0 "Те, чого нашим людям бракує в силі, вони мають компенсувати гнучкістю. Забезпечивши наших захисників різними інструментами та спорядженням, ми зможемо змінити хід майбутніх війн."

sln_den_final_2:0 "Праця"
sln_den_final_2_desc:0 "Під керівництвом бригадира Ток-Ар-Тока він зможе спрямувати ресурси на завершення нових майстерень-нор."

sln_den_final_last:0 "На випередження"
sln_den_final_last_desc:0 "Шакали щодня міцнішають. Хто знає, коли їхні кровожерливі загони випалять поверхню та виженуть нас із нор. Єдиний шлях до безпеки — напасти першими."

sln_rel_returns:0 "Окупані Сяйвом"
sln_rel_returns_desc:0 "Рел-Оссін повернувся до селища, відновлений і сповнений мудрості Матері. Час використати його нові знання, щоб привести С'Лантер до розквіту."

sln_rel_final_1:0 "Знання / Мудрість"
sln_rel_final_1_desc:0 "Наш розум значно сильніший за наш малий зріст. Саме інтелект стане нашою перевагою."

sln_rel_final_2:0 "Народження / Родина"
sln_rel_final_2_desc:0 "Наш дух створено, щоб виживати в будь-якому середовищі, але ліс — наш дім. Настав час нашим родинам зростати, а нації — квітнути."

sln_rel_final_3:0 "Добробут / Багатство"
sln_rel_final_3_desc:0 "Наші лапки здатні творити конструкції складніші й корисніші, ніж будь-яка людська. Настав час розширювати наші нори — як над землею, так і під нею."

sln_rel_final_4:0 "Безпека / Захист"
sln_rel_final_4_desc:0 "Наші тіла не мають такої сирої сили, як у людей, але наша спритність і впертість роблять нас запеклими бійцями. Із новою армією ми не дозволимо жодній людині керувати С'Лантером."

sln_rel_final_last:0 "Діти Сяйва"
sln_rel_final_last_desc:0 "Мати створила Природу, що породила плоди землі й дала їй життя.\nМати створила Створіння, що породило дітей із плодів і збудувало з них дім.\nМати створила Звірів, що стали сильними й стрімкими, підкорили створінь.\nМати створила Людину, що перехитрила звірів і приборкала землю.\n\nА тоді Мати створила нас — найкращі риси всіх її творінь сплела в єдине: своїх Дітей Сяйва."

### events ###

nf_slanter.1.t: "Відхід / Одіссея"
nf_slanter.1.d: "Творці створили нас. Піднесли нас із простих тварин. Мета цього вчинку — нам невідома. Відомо лише те, що Старі мали покинути Сяйво Майстрів. Подорож тривала багато життів наших тваринних пращурів. Вона сформувала нас. Дала розуміння світу за межами Сяйва Майстрів. І майже вбила нас своєю жорстокістю. Поки ми не знайшли місце, що стало Норами."
nf_slanter.1.a: "Час навчання"
nf_slanter.1.b: "Час труднощів"

nf_slanter.2.t: "Зустріч / Розкол"
nf_slanter.2.d: "Перша зустріч із людьми сталася невдовзі після заселення. Тепер ми знаємо, що раніше нам просто щастило не натрапити на них. І, можливо, це було на краще. Люди, які звали себе «Гадюками», повністю відповідали цій назві — жорстокі, дикі, неначе самі були тваринами. Вони вбивали наших і намагались поневолити нас. Ми билися. Ми вистояли. Але шрами залишились."
nf_slanter.2.a: "Люди так само різні, як і ми."
nf_slanter.2.b: "Люди небезпечні!"

nf_slanter.3.t: "Посуха / Віра"
nf_slanter.3.d: "Коли ми втратили останнього зі Старих, здавалося, що сам світ розгнівався на нас з причин, яких ми не розуміли. Дерева, які були нам домом, захворіли. Річка, що давала життя їм і нам — висохла. Ми втратили багатьох через голод і хвороби. Мінішен, син останнього Старого, що покинув нас, розповів нам про Творців. Про те, як вони створили нас сильними й розумними, щоби ми могли вижити в жорстокому світі. Ми вистояли знову."
nf_slanter.3.a: "Творці зробили нас мудрими!"
nf_slanter.3.b: "Творці зробили нас сильними!"

nf_slanter.4.t: "Питання / Без Відповіді"
nf_slanter.4.d: "Історія Мінішена відгукнулась у багатьох С'лантерів. Особливо Піджителі знайшли в ній підтвердження своїх переконань — що нас створили не для наслідування людей, а щоб перевершити їх тілом і розумом. Та деякі Сверхні Жителі хотіли більшого. Вони прагнули знайти сяюче місце, про яке говорив Мінішен. Знайти Творців і запитати: «Чому?» Те, що вони знайшли, не було відповіддю.\n\nЛише один розвідник повернувся. Його останні слова: «Немає богів, є лише смерть»"
nf_slanter.4.a: "Може, в цьому щось більше?"
nf_slanter.4.b: "Можливо, Творці не бажають бути знайденими?"

nf_slanter.5.t: "Смерть / Хвороба"
nf_slanter.5.d: "Рінар, донька Мінішена, вела нас багато сезонів. Та згодом вона захворіла. Ми не змогли її вилікувати, й вона померла. Не маючи власних дітей, вона стала першою, хто не передав владу спадково. Замість неї очільником став її брат — Рел-Оссін. І невдовзі він також захворів."
nf_slanter.5.a: "Хвороба має причину."
nf_slanter.5.b: "Ця хвороба — ознака слабкого лідера."

nf_sln_journey.1.t: "Подорож Рел-Оссіна Розпочалася"
nf_sln_journey.1.d: "На світанку С'Лантер попрощався зі своїм народом. Він спирався на посох, а його торба була наповнена всім, що громада вважала корисним. Творці веліли йому йти на схід — слідами своїх предків."
nf_sln_journey.1.a: "Бажаємо йому успіху."

nf_sln_journey.2.t: "Ні миру, ні раю"
nf_sln_journey.2.d: "Рел-Оссін ухилявся від рейдерів і ховався від палючого сонця. Він пройшов далі, ніж мав би змогу у своєму стані, та щовечора його вперед гнали слова Творців. Зрештою він дістався міста біля великого озера, яке люди вважали Раєм. Та все, що знайшов Рел-Оссін — це страх. За їхніми мурами чатувала соляна потвора. Рел-Оссін запам’ятав цю жорстокість людства й рушив далі."
nf_sln_journey.2.a: "Н незабаром він загубився у пустелі."
nf_sln_journey.2.b: "Карта, що ми дали, повела його на південь."

nf_sln_journey.3.t: "Через Річку"
nf_sln_journey.3.d: "Велика річка стала на шляху Рел-Оссіну. Творці веліли йому перетнути її й зустрітись із великим плем’ям, що колись вело його предків, та Рел-Оссін вагався. Дим від вогнищ і гупання барабанів не нагадували йому тихий народ, який обіцяли Творці."
nf_sln_journey.3.a: "У нього не було вибору, окрім як переплисти."
nf_sln_journey.3.b: "На щастя, ми дали йому все для плота."

nf_sln_journey.4.t: "Жар Гірський"
nf_sln_journey.4.d: "Рел-Оссін відчував, як його тіло виснажується. Веслування проти течії забрало останні сили, а лихоманка сягнула небаченої межі. Він стояв у прохолодному гірському повітрі, дихаючи тим самим повітрям, що й його предки. Але кожен крок здавався тисячею."
nf_sln_journey.4.a: "Можливо, якщо просто трохи заплющити очі..."
nf_sln_journey.4.b: "Ми дали йому найкращі лікувальні трави."

nf_sln_journey.5.t: "У Сяйво"
nf_sln_journey.5.d: "Рел-Оссін мало що пам’ятає з кінця своєї подорожі — і взагалі, як він так швидко повернувся. Лише те, що візит до Творців зцілив його і дав відповіді, необхідні для майбутнього С'Лантеру. І ще він виніс одне ім’я — нове ім’я для тієї істоти, що дала життя його народові:\n\nМати."
nf_sln_journey.5.a: "Наш лідер відродився."

nf_sln_journey.6.t: "Брехня і С'Лантер"
nf_sln_journey.6.d: "Дні ставали тижнями, а віра в порятунок Рел-Оссіна згасала. Творці говорили до нього так ясно, а тепер вони дали йому хворобу й заманили на смерть. Зрештою, один С'Лантер піднявся, щоб зайняти місце Рел-Оссіна — з підтримкою народу. Цією особою був..."
nf_sln_journey.6.a: "Ейр, мер Сверхніх Жителів"
nf_sln_journey.6.b: "Ток-Ар-Ток, бригадир Піджителів"


