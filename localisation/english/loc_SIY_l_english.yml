#### Персонажі
SIY_AGENT_ALABASTER:0 "Агент Алабастер"
SIY_AGENT_ALABASTER_DESC:0 "Коли настав час обирати лідера експедиції в карантинну зону Небраски, агент Алабастер був очевидним вибором. Він завжди працював у тіні, уникаючи непотрібного ризику, щоб його ім’я не потрапило в центр уваги. Це також дозволяло легше «списати» експедицію в разі провалу, чого дехто в Комітеті й очікував.\n\nХоча Алабастер не відомий своєю силою чи хитрістю, його інстинкти виживання були відточені роками конфліктів. Він не раз доводив, що здатен виконати місію навіть без необхідних ресурсів. Але чи вистачить його досвіду, щоб впоратись із зараженими чудовиськами Плюгавих Земель – це ще питання."

