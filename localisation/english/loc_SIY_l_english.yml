#### Ідеї
SIY_illfated_expedition:0 "Нещаслива експедиція"
SIY_illfated_expedition_desc:0 "Плани щодо направлення оперативної групи до карантинної зони Небраски з самого початку викликали суперечки. З огляду на напругу між Братством і Анклавом, Ініціатива мала діяти обережно. Дані з Центрів контролю хвороб у Рочестері вказували, що зону використовували як полігон для нестандартної зброї для стримування Нової Чуми. Цей шанс посилити оборону й став вирішальним для рішення Комітету відправити групу під проводом Алабастера для дослідження об'єктів.\n\nОднак інформація про об'єкти X, Y і Z залишалась засекреченою – відомі лише назви та приблизні координати. Дослідники натрапили на натяки на існування четвертого об'єкта, мета якого невідома. Більшість вважала, що він пов'язаний із Lifeline – дивною доядерною підземкою. Але тільки особисте дослідження відкриє істину."

SIY_plagued_lands:0 "Чума, страждання і смерть"
SIY_plagued_lands_desc:0 "Багато місць у пустці не відповідають своїм назвам. Але не Плюгаві Землі. Їхня санітарна зона наповнена зараженими тунелями з хворими мутантами, роботами-вбивцями, що знищують усе живе, та фанатиками, які з останніх сил тримаються за життя.\n\nПісля входу оперативної групи Ініціативи до зони, вони швидко зрозуміли, що краще було підготуватись. Герметичні бронекостюми з Маккоя знадобились куди більше, ніж планувалось. Навіть із запасами медикаментів адаптація до цього пекла потребує часу."

SIY_resourceful:0 "Виживаємо як можемо"
SIY_resourceful_desc:0 "Ми щойно прибули в Чумні Землі, тож мусимо бережно розпоряджатись ресурсами. Кожен член експедиції має чітке завдання. Ми змушені шукати постачання де тільки можна – навіть у трупів ворогів чи покинутих схованках."

SIY_successful_expedition:0 "Успішна експедиція"
SIY_successful_expedition_desc:0 "Об'єкти досліджень в зоні Небраски виявились порожніми. Ми так і не відновили контакт із Рочестером. Більшість питань залишились без відповідей. А деякі ще навіть не поставлені.\n\nТа все одно, доля Плюгавих Земель тепер у наших руках. Попереду важка праця. Використаємо цю можливість.\n\n§RЗміст об’єкта Y та інших локацій буде додано в майбутньому оновленні.§!"

#### Події
nf_siy.1.t:0 "Перезапуск систем"
nf_siy.1.d:0 "Агент Алабастер і його загін у герметичних силових бронях стояли перед масивними воротами, що розділяли підземну секцію Об’єкта Y. Коридор освітлював тьмяний червоний світ, вказуючи, що сектор все ще на аварійному блокуванні. Вони ще раз перевірили спорядження, зайняли оборонні позиції. Задній дозор зачинив за ними двері до тимчасової бази й навів зброю на головні ворота.\n\nСвітло згасло на кілька довгих, тривожних секунд... потім усе навколо загуло. Замки клацнули, ворота ожили. Лампи блимнули й засліпили бійців. Вони напружено чекали. Аж доки пролунав наказ Алабастера: просуватись."
nf_siy.1.a:0 "..."

#### Рішення
form_upsilon_initiative:0 "Заснувати Ініціативу Упсилон"
form_upsilon_initiative_desc:0 "Безперервна стрілянина й вибухи, що лунали по всій зоні карантину Небраски, нарешті стихли. Наша колись жалюгідна експедиція об’єднала групи Плюгавих Земель. Пора створити новий Комітет, який займеться відновленням зони й відкриттям її таємниць."

