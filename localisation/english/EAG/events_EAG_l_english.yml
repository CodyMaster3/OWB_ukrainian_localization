l_english:
nf_eagle_rock.1.t:0 "Спадщина Авіації"
nf_eagle_rock.1.d:0 "Орлину Скелю було засновано після Великої Війни колишніми членами Повітряних Сил США, які були розташовані на численних авіабазах Колорадо.\n\nХоча Денвер і прилеглі міста зазнали ядерного удару, Скелясті Гори стали природним бар’єром від повного знищення. Залишки ВПС намагалися повернутися до міста після розсіювання радіації, але їх вигнали мародери, зокрема Псючі Пси (Hangdogs).\n\nЦе змусило вижилих рушити на захід, де вони заснували спільноту в захищеному містечку Орлина Скеля. Як з’ясувалося, у місті були вцілілі аеродроми, які згодом стали основою для відновлення їхньої авіації."
nf_eagle_rock.1.a:0 "Авіація у нас у крові."

nf_eagle_rock.2.t:0 "Містечко Орлина Скеля"
nf_eagle_rock.2.d:0 "Коли залишки ВПС прибули в Орлину Скелю, місто вже було частково заселене. Їх зустріли поселенці, спочатку вороже налаштовані, однак дізнавшись, що це не рейдери — дозволили залишитися.\n\nНатхненні довоєнним рухом за відокремлення Вільної Штату, ці мешканці заздалегідь підготувались — запаси консервів, зброї та організованість допомогли їм пережити ядерну зиму.\n\nПопри антипатію до уряду США, обидві громади об’єднались задля виживання й навіть змогли відновити демократію через муніципальну раду Орлиної Скелі.\n\nУ ці ранні роки, на чому громада зосередила свої зусилля найбільше?"
nf_eagle_rock.2.a:0 "Підготовка експедицій для пошуків ресурсів."
nf_eagle_rock.2.b:0 "Відбудова інфраструктури міста."

nf_eagle_rock.3.t:0 "Пріоритет Дирижаблів"
nf_eagle_rock.3.d:0 "Коли мешканці Орлиної Скелі почали будувати власну авіацію, було вирішено зосередитися на дирижаблях, а не на класичних літаках.\n\nБуло зрозуміло, що руйнування інфраструктури Пустки унеможливлює нормальну експлуатацію літаків — вони потребують довгих і рівних злітних смуг. Натомість дирижаблі були універсальні та корисні навіть у малій кількості — вони могли перевозити товари, вести розвідку, а інколи й виконувати бойові завдання.\n\nОднак будівництво дирижаблів потребувало великих ресурсів і знань. Скільки зусиль ми вклали в ці проєкти?"
nf_eagle_rock.3.a:0 "Розумну кількість."
nf_eagle_rock.3.b:0 "Дуже багато."

nf_eagle_rock.4.t:0 "Повітряне Піратство"
nf_eagle_rock.4.d:0 "Наші торгові експедиції на дирижаблях йшли непогано, але надходить дедалі більше повідомлень про напади рейдерів і викрадення наших дирижаблів під час посадок для торгівлі. Якщо не вжити заходів негайно — наші прибутки значно постраждають!\n\nНаші інженери вже запропонували озброїти дирижаблі та найняти найманців для захисту. Саме на цьому ми маємо зосередитися.\n\n§RРозпочнеться 60-денна місія, яка поступово зменшуватиме наші людські ресурси, стабільність та підтримку війни, поки повітряне піратство не буде зупинено через відповідні національні фокуси.§!"
nf_eagle_rock.4.a:0 "Зрозуміло."

nf_eagle_rock.5.t:0 "Нью-Ханаан"
nf_eagle_rock.5.d:0 "Журнал торгової експедиції в Юту —\n\nМи вже знайомі з Нью-Ханааном — містом на узбережжі Великого Солоного Озера. Їхні мормонські місіонери та каравани вже добирались до Орлиної Скелі, але ми досить далеко, тож вплив на нашу громаду поки що незначний.\n\nПопри це, вони — надійні торгові партнери, особливо тепер, коли маємо кращий доступ. Але поширюються чутки про небезпечне плем’я Білі Ноги, що живе південніше. Якщо це правда — наша торгівля з Ютою може постраждати..."
nf_eagle_rock.5.a:0 "Прийнято до уваги."

nf_eagle_rock.6.t:0 "Місто Псів"
nf_eagle_rock.6.d:0 "Журнал торгової експедиції в Колорадо —\n\nНа жаль, ситуація гірша, ніж ми думали.\n\nСхоже, ті самі мародери, що вигнали наших предків із Денвера, тепер стали ще сильнішими. Вони перейменували місто на «Місто Псів» — справжнє блюзнірство.\n\nІ все ж, торгівля з Псючими Псами прибуткова, бо місто багате на залишки старого світу."
nf_eagle_rock.6.a:0 "Зрозуміло."

nf_eagle_rock.7.t:0 "Флагстафф"
nf_eagle_rock.7.d:0 "Журнал торгової експедиції в Аризону —\n\nЛегіон Цезаря: величезна імперія від Аризони до Нью-Мексико. Вони постійно розширюються, і Денвер — серед їхніх цілей.\n\nРейдерів і ворогів вони знищують з надзвичайною жорстокістю — що нам, торговцям, навіть на руку.\n\nЇхній головний ресурс — величезна кількість рабів. Легіонери запевняють, що ті не зазнають зайвих страждань... Але я сумніваюся."
nf_eagle_rock.7.a:0 "Зрозуміло."

nf_eagle_rock.8.t:0 "Нью-Вегас"
nf_eagle_rock.8.d:0 "Журнал торгової експедиції до Невади —\n\nКоли ми наблизились до Невади вночі, на горизонті побачили сяйво — неон, прожектори. Те, що ми виявили — це Нью-Вегас: метрополія з майже неушкодженими будівлями й безліччю торговців.\n\nСрібне Місто... або Місто Гріха — залежно від того, кого спитаєш.\n\nКраму тут повно, але головна принада — нескінченні казино вздовж Стріпу. Втім, можеш не хвилюватись — я обмежив, скільки кришок екіпаж може там залишити."
nf_eagle_rock.8.a:0 "Зрозуміло."

nf_eagle_rock.9.t:0 "Шейді-Сендс"
nf_eagle_rock.9.d:0 "Журнал торгової експедиції до Каліфорнії —\n\nНова Каліфорнійська Республіка — взірець демократії у Пустці. Принаймні, на перший погляд.\n\nМи прибули в Шейді-Сендс після того, як пролетіли над пасовищами для брамінів — м’яса і шкіри вистачає. Крім того, у них розвинена аграрна та промислова база.\n\nАле ідеалу не існує. Відкриття нашого відділення тут було суцільною бюрократичною катастрофою. Стільки паперової тяганини я ще не бачив — не кажучи вже про грабіжницькі податки."
nf_eagle_rock.9.a:0 "Зрозуміло."

nf_eagle_rock.10.t:0 "Одинока Зірка"
nf_eagle_rock.10.d:0 "Журнал торгової експедиції до Техасу —\n\nЧесно кажучи, не очікував, що Техас виявиться настільки гостинним. Хоча дивних речей тут не бракує.\n\nЄ кілька хороших торгових вузлів, зокрема Хʼюстон і маєток TAA, але найбільше вразило місто Одинока Зірка. Населення тут уже переросло довоєнну інфраструктуру — доводиться зводити нові споруди.\n\nСподіваємось, що «Тимчасова Республіка Техас» вистоїть, попри небезпеку зі сторони армій супермутантів з півдня."
nf_eagle_rock.10.a:0 "Зрозуміло."

nf_eagle_rock.11.t:0 "Небесна Брама"
nf_eagle_rock.11.d:0 "Журнал торгової експедиції до Айдахо —\n\nСхоже, ми втрапили у релігійний розкол.\n\nТут кілька фракцій борються за владу, але головна торгівля — в руках Небесна Брама. Ми відкрили відділення, але довелось прийняти частину їхньої віри.\n\nЯкщо забути про релігію, цікаво, що тут замість ядерної енергії широко використовують парові ядра."
nf_eagle_rock.11.a:0 "Зрозуміло."

nf_eagle_rock.12.t:0 "Глорія"
nf_eagle_rock.12.d:0 "Журнал торгової експедиції до Мексики —\n\nКажуть, Республіка Ріо-Гранде існує ще з довоєнних часів і досі не впала, майже 200 років по тому.\n\nПолітична база сильна, а економічна — ще краща. Ми, правда, іспанською не розмовляємо, але наші торговці вже щось там бартерять. Відділення успішно відкрите.\n\nГоловне, щоб той божевільний ШІ на півдні не наробив біди."
nf_eagle_rock.12.a:0 "Зрозуміло."

nf_eagle_rock.13.t:0 "Бісмарк"
nf_eagle_rock.13.d:0 "Журнал торгової експедиції до Дакоти —\n\nЛетіти на північ — не найкраща ідея для наших дирижаблів. Скріплять так, ніби розваляться.\n\nТа ми прибули в Бісмарк. Виявилось, тут знають, як будувати або ремонтувати ґаус-гармати. Нам точно треба дістати кілька.\n\nЩе цікаво: багато мешканців мають предків з-за океану. Як їм вдалося вціліти під час Великої Війни?"
nf_eagle_rock.13.a:0 "Зрозуміло."

nf_eagle_rock.14.t:0 "Північний Край"
nf_eagle_rock.14.d:0 "Журнал торгової експедиції до Манітоби —\n\nЧим далі на північ — тим холодніше.\n\nАле є й новини: Республіка Трьох Річок тут активно використовує дирижаблі — як і ми. Відділення вдалося відкрити без жодних проблем.\n\nУтім, у них зростає напруга з великим королівством на заході. Сподіваємось, це не переросте в нову війну."
nf_eagle_rock.14.a:0 "Зрозуміло."

nf_eagle_rock.15.t:0 "Нова Вікторія"
nf_eagle_rock.15.d:0 "Журнал торгової експедиції до Колумбії —\n\nПід час подорожі ми бачили флотилії піратів, які тероризують канадське узбережжя. Добре, що тут тримається конституційна монархія Нова Вікторія.\n\nПірати грабують усе, що рухається. Нова Вікторія має труднощі з торгівлею, тож наше відділення стане в пригоді обом сторонам."
nf_eagle_rock.15.a:0 "Зрозуміло."

nf_eagle_rock.17.t:0 "Політична Напруга"
nf_eagle_rock.17.d:0 "Хоча в Орлиній Скелі панував спокій, під поверхнею зріє невдоволення.\n\nЗростають сумніви щодо легітимності Ради. Критики стверджують, що вона більше не представляє волю народу — звучать заклики до відкритіших виборів.\n\nІнші ж вимагають ліквідувати Раду зовсім, і замінити її на сильного лідера. Їхній кандидат? Орел-Маршал — харизматичний промовець із мріями про відродження Колорадо під нашим прапором.\n\nВрешті-решт, було вирішено, що..."
nf_eagle_rock.17.a:0 "...Рада залишиться голосом народу!"
nf_eagle_rock.17.b:0 "...комерція поведе нас у завтрашній день!"
nf_eagle_rock.17.c:0 "...ми піднімемо прапори та повернемо фронтир!"

nf_eagle_rock.18.t:0 "Відкриття Відділень"
nf_eagle_rock.18.d:0 "Встановлення філій у ключових торгових вузлах Пустки — життєво важливе для добробуту Орлиної Скелі. Вони дозволять нашим торговим дирижаблям ефективніше купувати й продавати ресурси.\n\nКожне відділення приноситиме нам додатково 5.0k пасивного прибутку кришками + рівень торгового вузла, а також відкриє нові фокуси.\n\nФілії можна відкривати як через події на карті, так і через меню рішень."
nf_eagle_rock.18.a:0 "Зрозуміло."

nf_eagle_rock.19.t:0 "Спад Піратства"
nf_eagle_rock.19.d:0 "Наші зусилля щодо озброєння дирижаблів і найму найманців дали плоди. Рейдери більше не становлять загрози — повітря належить нам."
nf_eagle_rock.19.a:0 "Зрозуміло."