l_english:
eag_history_1:0 "Спадщина Авіації"
eag_history_1_desc:0 "Хоча Повітряні Сили Сполучених Штатів залишилися лише спогадом, їх дух живе в мешканцях Орлиної Скелі."

eag_history_2:0 "Орлина Скеля"
eag_history_2_desc:0 "На перший погляд Орлина Скеля — непримітне містечко. Можливо, саме це й урятувало його під час Великої Війни."

eag_history_3:0 "Перевага Дирижаблів"
eag_history_3_desc:0 "Нащадки військових пілотів зробили нестандартний вибір: віддали перевагу дирижаблям замість звичайних літаків."

eag_politics:0 "Наше Майбутнє"
eag_politics_desc:0 "Після періоду стабільної торгівлі та нейтралітету на півдні з’явилася нова загроза. Орлина Скеля завжди була відокремленою громадою, але є ті, хто хоче це змінити."

eag_people_council:0 "Народна Рада"
eag_people_council_desc:0 "Народ вирішив, що ним не буде правити ніхто, окрім нього самого."

eag_wealth_for_all:0 "Добробут для Всіх"
eag_wealth_for_all_desc:0 "Кожен повинен мати можливість процвітати й здобути багатство власними зусиллями."

eag_welcome_one_and_all:0 "Вітаємо Всіх"
eag_welcome_one_and_all_desc:0 "Тих, хто тікає від хаосу своїх земель, ми зустрінемо з відкритими обіймами."

eag_free_trade:0 "Вільна Торгівля"
eag_free_trade_desc:0 "Як і наш народ, торгівля повинна залишатися вільною."

eag_foreign_industry:0 "Іноземна Промисловість"
eag_foreign_industry_desc:0 "Ми можемо передати виробництво певних товарів іншим країнам задля ефективності."

eag_clearing_rubble:0 "Очищення Руїн"
eag_clearing_rubble_desc:0 "Наша економіка зростає — нам потрібна нова земля для фабрик і житла."

eag_public_infrastructure:0 "Громадська Інфраструктура"
eag_public_infrastructure_desc:0 "Ми повинні зв’язати наші громади міцнішою мережею доріг і послуг заради спільного блага."

eag_elites_council:0 "Рада Еліт"
eag_elites_council_desc:0 "Народ вирішив, що саме підприємці поведуть Орлину Скелю до добробуту."

eag_allow_lobbying:0 "Дозволити Лобізм"
eag_allow_lobbying_desc:0 "Депутати можуть не мати досвіду в усіх сферах, тож можливо, варто дозволити підприємствам впливати на рішення."

eag_skilled_workers:0 "Кваліфіковані Працівники"
eag_skilled_workers_desc:0 "Допомогу мають отримати лише ті, хто здатен допомогти й нашій нації."

eag_profit_first:0 "Прибуток — Понад Усе"
eag_profit_first_desc:0 "Кепи забезпечують ресурси й захист. Тож їх генерація — наш пріоритет."

eag_war_profiteering:0 "Прибуток з Війни"
eag_war_profiteering_desc:0 "Війна відкриває унікальні можливості — і ми скористаємось цим."

eag_work_with_business:0 "Співпраця з Бізнесом"
eag_work_with_business_desc:0 "Є компанії, які можуть суттєво вдосконалити наші виробничі потужності."

eag_powerful_contacts:0 "Впливові Контакти"
eag_powerful_contacts_desc:0 "Отримати якісну зброю нескладно — якщо є контакти й достатньо кепів."

eag_changing_policy:0 "Зміна Політики"
eag_changing_policy_desc:0 "Деякі наші закони застаріли. Щоб вижити, ми повинні адаптуватися."

eag_industry_standardization:0 "Уніфікація Промисловості"
eag_industry_standardization_desc:0 "Наші інструменти та методи несумісні. Стандартизація покращить ефективність."

eag_energy_refueling_standards:0 "Стандарти Енергопостачання"
eag_energy_refueling_standards_desc:0 "Ненадійне електропостачання загрожує як безпеці, так і розвитку наших міст."

eag_covert_business:0 "Таємні Операції"
eag_covert_business_desc:0 "Переговори часто вимагають тонкої гри. Наші представники повинні бути до цього готові."

eag_repair_prewar_weather_radars:0 "Ремонт Довоєнних Радарів"
eag_repair_prewar_weather_radars_desc:0 "Радари допоможуть слідкувати не лише за погодою, а й за небом."

eag_expanding_our_influence:0 "Розширення Впливу"
eag_expanding_our_influence_desc:0 "Задля безпеки ми мусимо впливати на сусідів — особливо через загрозу Гекати й Оробороса з півдня."

eag_help_old_bones:0 "Допомогти Старим Кісткам"
eag_help_old_bones_desc:0 "Хай і дивні зі своїм культом скелетів, Старі Кістки не є агресивними. А головне — вони протистоять Гекаті."

eag_help_highland_watch:0 "Допомогти Гайленд-Вотч"
eag_help_highland_watch_desc:0 "Гайленд-Вотч — горді поселенці. Ми зобов'язані допомогти їм перед загрозою."

eag_defensive_drills:0 "Оборонні Навчання"
eag_defensive_drills_desc:0 "Велика небезпека ховається за річкою Колорадо. Ми не можемо дозволити їй прорватися."

eag_mutual_protection:0 "Взаємозахист"
eag_mutual_protection_desc:0 "Ми завжди були близькі з народом юте — постачальниками їжі й шанувальниками авіації."

eag_protecting_markets:0 "Захист Ринків"
eag_protecting_markets_desc:0 "Стабільність торгових вузлів важлива для прибутку й військової підготовки."

eag_all_terrain_training:0 "Багатопрофільна Підготовка"
eag_all_terrain_training_desc:0 "Наші війська повинні бути готові до боїв в холоді, спеці та густих містах."

eag_peacekeeping_forces:0 "Миротворчі Сили"
eag_peacekeeping_forces_desc:0 "Мир у різних громадах залежить від того, наскільки делікатно діють наші солдати."

eag_bear_market:0 "Ринок Ведмедя"
eag_bear_market_desc:0 "НКР має найбільшу економіку в Пустці. Не скористатися цим було б нерозумно."

eag_bull_market:0 "Ринок Бика"
eag_bull_market_desc:0 "Легіон Цезаря жорстоко знищує рейдерів. Це означає менше охорони — і більше прибутку."

eag_texan_arms:0 "Зброя з Техасу"
eag_texan_arms_desc:0 "Торгівля з Texas Arms Association відкриє нам доступ до якісної зброї. «Просто працює!»"

eag_mexican_arms:0 "Зброя з Ріо-Гранде"
eag_mexican_arms_desc:0 "Сталь із «Сталевого Серця Ріо» — ідеальна база для якісної зброї. Торгуймо з ними."

eag_assist_lone_star:0 "Допомогти Одинокій Зірці"
eag_assist_lone_star_desc:0 "Місто має стратегічне розташування на I-20 та підтримку Братства зі Сходу. Вартісний союзник."

eag_assist_new_canaan:0 "Допомогти Новому Канеану"
eag_assist_new_canaan_desc:0 "Вплив Нового Канеану поширюється через всю Юту. Наші відносини мають бути міцними."

eag_assist_colorado:0 "Допомогти Колорадо"
eag_assist_colorado_desc:0 "Владу Хангдогів у Колорадо кинула виклик Warden — довоєнний адміністративний ШІ Денвера. Ми можемо підтримати його зусилля щодо повернення міста в обмін на могутнього союзника."

eag_moderates:0 "Маршал Повітря Зазнав Поразки"
eag_moderates_desc:0 "Блок утримався! Геть реформістів!"

eag_air_marshal:0 "Маршал Повітря Переміг"
eag_air_marshal_desc:0 "Вперед, до Колорадо!"

eag_stoke_militarism:0 "Підживити Мілітаризм"
eag_stoke_militarism_desc:0 "Хіба вам не набридло бездіяльно спостерігати за світом, що йде вперед? Досить слухати безініціативну раду! Орлина Скеля має стати великою — силою, яку поважають."

eag_disband_the_council:0 "Розпустити Раду"
eag_disband_the_council_desc:0 "Рада слугувала лише собі, а не народу. Вона — залишок минулого, який мусить залишитися позаду."

eag_vicious_drills:0 "Жорсткі Вишколи"
eag_vicious_drills_desc:0 "Наш народ став слабким через покоління самозаспокоєності. Ми навчимося виживати в пустці!"

eag_military_youth:0 "Елітні Рекрути"
eag_military_youth_desc:0 "Ми мусимо виховати нове покоління бійців, що зможе зупинити будь-якого ворога."

eag_weapon_imports:0 "Імпорт Озброєння"
eag_weapon_imports_desc:0 "Щоб вести війну, нам потрібна зброя. Ми купимо її у всіх, хто продає."

eag_repurpose_trading_blimps:0 "Переоснащити Торгові Дирижаблі"
eag_repurpose_trading_blimps_desc:0 "Так, вони важливі для торгівлі. Але в бою ці дирижаблі можуть підтримати наші наземні війська."

eag_making_a_breakthrough:0 "Прорив Лінії"
eag_making_a_breakthrough_desc:0 "Проти укріплених позицій кулі не допоможуть. Нам потрібні вибухівка і динаміт."

eag_conquering_armies:0 "Армії Завойовників"
eag_conquering_armies_desc:0 "Справжню перемогу здобувають не ополчення, а дисципліновані війська. І ми їх сформуємо."

eag_western_lands:0 "Західні Землі"
eag_western_lands_desc:0 "Перша ціль — Юїнта. Нам потрібен повний доступ до їхніх родючих земель для забезпечення армії."

eag_deepmines:0 "Глибокі Копальні"
eag_deepmines_desc:0 "Суходуви відмовились підкоритися. Шкода, їхні робочі згодились би нам у нагоді."

eag_abundant_metals:0 "Багаті Металами"
eag_abundant_metals_desc:0 "Війна закінчена. Пора повертатись до шахт."

eag_extinction:0 "Винищення"
eag_extinction_desc:0 "Плем’я, що поклоняється кісткам? Це вже занадто."

eag_burham_springs:0 "Бернем-Спрінґс"
eag_burham_springs_desc:0 "Ця земля вічно горить. Погасимо полум’я й подивимось, які таємниці воно приховує."

eag_eugenicists:0 "Чутки про Євгеніків"
eag_eugenicists_desc:0 "Ороборос стверджує, що виводить ідеальних воїнів через селекцію. Навряд чи вони витримають кулі."

eag_fierce_warriors:0 "Люті Воїни"
eag_fierce_warriors_desc:0 "Зіткнення з їхньою армією дало нашим військам цінний досвід. Наступна зупинка — Колорадо!"

eag_nation_of_raiders:0 "Нація В'язнів"
eag_nation_of_raiders_desc:0 "Чорний Каньйон був заснований утікачами з повоєнної в'язниці. Важко повірити, що вони досягли такої сили..."

eag_claiming_canyons:0 "Очищення Каньйонів"
eag_claiming_canyons_desc:0 "Ми повинні взяти каньйони під контроль до того, як у них закріпляться партизани."

eag_clearing_the_rabble:0 "Зачистка Мутантів"
eag_clearing_the_rabble_desc:0 "На шляху — гулі з надвисокою радіацією. Тримаймося подалі."

eag_cleansing_radiation:0 "Очищення Радіації"
eag_cleansing_radiation_desc:0 "Гулі, напевно, виживуть, якщо дати їм РадАвей. Спрацює ж, так?"

eag_denver_colorado:0 "Денвер, Колорадо"
eag_denver_colorado_desc:0 "Наше найбільше випробування попереду."

eag_spoils_of_denver:0 "Трофеї Денвера"
eag_spoils_of_denver_desc:0 "Міста Псів більше не існує."

eag_consolidate_colorado:0 "Консолідація Колорадо"
eag_consolidate_colorado_desc:0 "Ми захопили Денвер, але наш контроль над Колорадо ще не повний."

eag_first_aerial_merchant_fleet:0 "Перша Повітряна Торгова Флотилія"
eag_first_aerial_merchant_fleet_desc:0 "Екіпажі готові. Пілоти не можуть дочекатися. Запускаємо нашу першу повітряну торгову флотилію в пустку. Побажаймо їм успіху — ми не знаємо, що там попереду."

eag_expanded_moorings:0 "Розширені Причали"
eag_expanded_moorings_desc:0 "Покращені причали дозволять нашим дирижаблям ефективніше завантажувати й розвантажувати торгові товари."

eag_shipping_infrastructure:0 "Торговельна Інфраструктура"
eag_shipping_infrastructure_desc:0 "Ми потребуємо ящиків і складів для зберігання великої кількості товарів, які ми привозимо."

eag_airship_production_lines:0 "Лінії Виробництва Дирижаблів"
eag_airship_production_lines_desc:0 "Наші торговельні дирижаблі активно використовуються, і тому часто потребують ремонту, модернізації або повної заміни."

eag_develop_western_farmland:0 "Розвиток Західних Ферм"
eag_develop_western_farmland_desc:0 "Попри гористість наших земель, на заході є рівнинні, придатні для обробітку території."

eag_fishing_industries:0 "Рибальська Індустрія"
eag_fishing_industries_desc:0 "Хоч Орлина Скеля не має багато природних ресурсів, ми розташовані вздовж Верхнього Колорадо. Раціонально добувати їжу з річки."

eag_ports_of_eagle_rock:0 "Порти Орлиної Скелі"
eag_ports_of_eagle_rock_desc:0 "Орлина Скеля перетворилася на центр повітряної торгівлі в Пустці, завдяки розгалуженій мережі торгових представництв."

eag_expand_the_foundries:0 "Розширення Ливарень"
eag_expand_the_foundries_desc:0 "Замість довготривалої оборони ми зосередимось на виробництві зброї. Стіну Гарлоу залишимо, а самі загостримо спис."

eag_protect_the_port:0 "Захист Порту"
eag_protect_the_port_desc:0 "Фортифікації, створені інженером Віктором Гарлоу, тримали нас роками. Пора їх відновити та укріпити знову!"

eag_planning_a_city:0 "Планування Міста"
eag_planning_a_city_desc:0 "Щоб оптимізувати нашу роль торгового вузла, місто має бути ретельно сплановане для підтримки повітряного флоту."

eag_high_rise_buildings:0 "Багатоповерхові Будинки"
eag_high_rise_buildings_desc:0 "Зі зростанням населення багатоквартирні будинки стали звичним явищем."

eag_vertical_industry:0 "Вертикальна Промисловість"
eag_vertical_industry_desc:0 "Оскільки простір закінчується, доведеться будувати вгору для розвитку нових галузей."

eag_higher_education:0 "Вища Освіта"
eag_higher_education_desc:0 "Розвиток торгівлі приваблює до Орлиної Скелі розумні голови з усієї Пустки."

eag_architectural_genius:0 "Архітектурний Геній"
eag_architectural_genius_desc:0 "Ми збудуємо найкраще місто в усій Пустці!"

eag_skyscrapers:0 "Хмарочоси"
eag_skyscrapers_desc:0 "Наші будівлі сягнуть висоти наших дирижаблів!"

eag_arizona_trade:0 "Торгівля з Аризоною"
eag_arizona_trade_desc:0 "Край рабства."

eag_nevada_trade:0 "Торгівля з Невадою"
eag_nevada_trade_desc:0 "Край гріха."

eag_california_trade:0 "Торгівля з Каліфорнією"
eag_california_trade_desc:0 "Край споживачів."

eag_texas_trade:0 "Торгівля з Техасом"
eag_texas_trade_desc:0 "Край охоронців порядку."

eag_idaho_trade:0 "Торгівля з Айдахо"
eag_idaho_trade_desc:0 "Край пари."

eag_mexico_trade:0 "Торгівля з Мексикою"
eag_mexico_trade_desc:0 "Край титанів."

eag_dakota_trade:0 "Торгівля з Дакотою"
eag_dakota_trade_desc:0 "Край прикордонників."

eag_manitoba_trade:0 "Торгівля з Манітобою"
eag_manitoba_trade_desc:0 "Край криги."

eag_columbia_trade:0 "Торгівля з Колумбією"
eag_columbia_trade_desc:0 "Край піратів."

eag_peculiar_venders:0 "Дивакуваті Торговці"
eag_peculiar_venders_desc:0 "Доступ до численних ринків привів нас до унікальних торговців і незвичайних товарів."

eag_spoils_of_the_vaults:0 "Скарби Сховищ"
eag_spoils_of_the_vaults_desc:0 "Сховища Vault-Tec містять довоєнні технології, здатні змінити Пустку."

eag_advanced_technology:0 "Передові Технології"
eag_advanced_technology_desc:0 "Довоєнні винаходи можна купити або дослідити. Якщо тільки Братство Сталі не випередило нас..."

eag_power_of_the_atom:0 "Сила Атома"
eag_power_of_the_atom_desc:0 "Ядерна енергія — могутнє джерело живлення. Але й небезпечне."

eag_powerful_weaponry:0 "Потужна Зброя"
eag_powerful_weaponry_desc:0 "Плазмові гармати, ґаусс-гвинтівки — чудовий арсенал для наших інженерів і найманців."

eag_prewar_designs:0 "Довоєнні Проекти"
eag_prewar_designs_desc:0 "«Вертоптах» — довоєнний транспорт. Наші інженери вже мріють адаптувати його під повітряну підтримку."

eag_human_modifications:0 "Модифікація Людини"
eag_human_modifications_desc:0 "Наступний крок у людській еволюції."

eag_resources:0 "Ресурси Орлиної Скелі"
eag_resources_desc:0 "Ми залежні від зовнішніх поставок. Але варто пошукати ресурси й у себе вдома."

eag_windfarms:0 "Вітрові Турбіни"
eag_windfarms_desc:0 "Гори Юїнта не придатні для багатьох споруд, але ідеальні для вітряків."

eag_restarting_mines:0 "Відновити Шахти"
eag_restarting_mines_desc:0 "Ми маємо декілька старих копалень у горах Юїнта, які можна модернізувати."

eag_bauxite_refining:0 "Переробка Бокситу"
eag_bauxite_refining_desc:0 "Боксит — джерело алюмінію. Постійне постачання допоможе у виробництві літальних апаратів."

eag_steam_methane_reforming:0 "Парова Реформація Метану"
eag_steam_methane_reforming_desc:0 "Процес генерації водню для дирижаблів шляхом парової реформації метану (SMR)."

eag_synthetic_polymers:0 "Синтетичні Полімери"
eag_synthetic_polymers_desc:0 "Легкий і міцний матеріал для дирижаблів, машин і електроніки."

eag_military:0 "Оцінка Армії"
eag_military_desc:0 "Через тривалий мир наша армія занепала. Пора це виправити."

eag_hybrid_designs:0 "Гібридні Дизайни"
eag_hybrid_designs_desc:0 "Спеціалізовані дирижаблі можуть значно підвищити нашу ефективність."

eag_advanced_aerodynamics_research:0 "Дослідження Аеродинаміки"
eag_advanced_aerodynamics_research_desc:0 "Щоб піднімати більші й важчі дирижаблі, слід глибше розуміти аеродинаміку."

eag_rotastats:0 "Ротостат"
eag_rotastats_desc:0 "Дирижаблі з роторними крилами — ідеальні для підняття вантажів."

eag_supply_carriers:0 "Транспортери Постачання"
eag_supply_carriers_desc:0 "Ротостати забезпечуватимуть постачання в складних для техніки умовах."

eag_dynastats:0 "Династат"
eag_dynastats_desc:0 "Дирижаблі з нерухомими крилами, здатні до тривалих польотів."

eag_automated_systems:0 "Автоматизовані Системи"
eag_automated_systems_desc:0 "Автоматизація полегшить екіпажу управління повітряним судном."

eag_photovoltaic_cells:0 "Фотовольтаїчні Панелі"
eag_photovoltaic_cells_desc:0 "Сонячні батареї зменшать потребу у паливі, підвищивши вантажопідйомність."

eag_masters_of_aviation:0 "Майстри Авіації"
eag_masters_of_aviation_desc:0 "Ми — господарі повітря в Пустці."

eag_cadet_training:0 "Підготовка Курсантів"
eag_cadet_training_desc:0 "Пілотів та екіпаж треба готувати до найвищих стандартів."

eag_mental_exercises:0 "Психологічна Підготовка"
eag_mental_exercises_desc:0 "Сценарії для криз і боїв — ключ до виживання."

eag_air_force_academy:0 "Авіаційна Академія"
eag_air_force_academy_desc:0 "Побудуємо офіційну Академію Повітряних Сил Орлиної Скелі."

eag_militarize_blimps:0 "Мілітаризація Дирижаблів"
eag_militarize_blimps_desc:0 "Пора ставитись до торгівельних рейсів як до воєнних операцій."

eag_adapt_designs:0 "Адаптація Конструкцій"
eag_adapt_designs_desc:0 "Можна зменшити тиск газу, розділити балони та укріпити оболонку — усе задля виживання."

eag_arm_and_armor_gondolas:0 "Озброєння та Бронювання Гондол"
eag_arm_and_armor_gondolas_desc:0 "Ми вже озброїли екіпажі наших дирижаблів вогнепальною зброєю, але цього недостатньо. Кулемети та вибухівка точно стримають потенційних рейдерів."

eag_assault_airships:0 "Штурмові Дирижаблі"
eag_assault_airships_desc:0 "Ми провели достатньо досліджень, щоб створити дирижабль, призначений виключно для війни."

eag_special_forces:0 "Спеціальні Сили"
eag_special_forces_desc:0 "Використання спеціальних підрозділів разом із дирижаблями ефективніше за силову броню — вони легші, не потребують ядерного живлення та можуть знешкодити бійця в силовій броні одним точним пострілом з ПТР."

eag_power_armor:0 "Силова Броня"
eag_power_armor_desc:0 "Силова броня підвищить захищеність наших дирижаблів, особливо в міських умовах, де вона майже невразлива до стрілецької зброї. До того ж її можна використовувати для завантаження вантажів."

eag_paratroopers:0 "Парашутисти"
eag_paratroopers_desc:0 "Уявіть собі: рейдери нападають на наш дирижабль, і раптом з нього висипаються солдати. Ефект буде приголомшливий."

eag_a_standing_army:0 "Постійна Армія"
eag_a_standing_army_desc:0 "Наша міська міліція була ефективною лише в межах Орлиної Скелі. Для воєн за її межами потрібна справжня армія."

eag_construct_a_training_facility:0 "Будівництво Навчального Центру"
eag_construct_a_training_facility_desc:0 "Нам потрібна спеціалізована база для підготовки солдатів у різних умовах і сценаріях."

eag_develop_a_training_regimen:0 "Розробка Програми Навчань"
eag_develop_a_training_regimen_desc:0 "Наші солдати мають опанувати всі аспекти війни. Навчальна програма допоможе їм у цьому."

eag_war_games:0 "Військові Навчання"
eag_war_games_desc:0 "Моделювання конфліктів та тренування процедур дій на полі бою допоможе нам створити чітку військову доктрину."

eag_indirect_support:0 "Непряма Підтримка"
eag_indirect_support_desc:0 "Логістика, медична допомога й інші непрямі способи підтримки значно підвищують ефективність армії."

eag_direct_support:0 "Пряма Підтримка"
eag_direct_support_desc:0 "Підтримка військ спеціалізованою зброєю дозволить проривати оборону ворога або утримувати важливі позиції."

eag_mercenary_army:0 "Найм Найманців"
eag_mercenary_army_desc:0 "Наші люди — не солдати, а пілоти. Найм найманців доповнить нашу армію."

eag_sourcing_weaponry:0 "Постачання Зброї"
eag_sourcing_weaponry_desc:0 "Ми повинні забезпечити наших найманців найкращою зброєю, щоб використати їхній досвід максимально ефективно."

eag_motorcycles:0 "Відновлення Мотоциклів"
eag_motorcycles_desc:0 "Мобільні війська зможуть швидше реагувати на загрози. Старі мотоцикли — ідеальна основа."

eag_tanks:0 "Саморобні Танки"
eag_tanks_desc:0 "Переобладнання будівельної техніки в бронетехніку дозволить просуватися під захистом броні."

eag_robotic_soldiers:0 "Роботизовані Солдати"
eag_robotic_soldiers_desc:0 "Наші перші прототипи — це гармати на гусеницях. Але це лише початок. І краще втрачати машини, ніж людей."

eag_imposing_robots:0 "Грозні Роботи"
eag_imposing_robots_desc:0 "Ми модернізували деяких логістичних роботів, озброїли їх і готові перевірити їх у бою."

eag_allocating_funds:0 "Перерозподіл Фінансів"
eag_allocating_funds_desc:0 "Найкращі найманці вимагають багато кришок. Готуйте гаманець."

eag_dockyards:0 "Верфі"
eag_dockyards_desc:0 "Щоб будувати кораблі, нам потрібні верфі."

eag_escort_fleet:0 "Ескортний Флот"
eag_escort_fleet_desc:0 "Флот супроводу забезпечить доставку всіх торгових товарів без втрат."

eag_naval_innovations:0 "Інновації в Морі"
eag_naval_innovations_desc:0 "Наші дослідження флоту не повинні відставати від повітряних технологій."

eag_cutters:0 "Катери"
eag_cutters_desc:0 "Для навігації річкою Колорадо потрібні легкі й маневрені судна."

eag_colorado_trade:0 "Торгівля з Колорадо"
eag_colorado_trade_desc:0 "Край собак."

eag_colorado_river_trade:0 "Річкова Торгівля Колорадо"
eag_colorado_river_trade_desc:0 "Торгівля вздовж Колорадо відкриває шлях до десятків спільнот."

eag_maritime_trading_fleet:0 "Морський Торговельний Флот"
eag_maritime_trading_fleet_desc:0 "Поряд з Повітряним Флотом, нам потрібен також Морський."

eag_masters_of_air_and_sea:0 "Володарі Повітря та Моря"
eag_masters_of_air_and_sea_desc:0 "Наші судна — в небі й на морі — принесуть нам перемогу всюди, де сягне наш погляд."