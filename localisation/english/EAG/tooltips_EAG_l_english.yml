# Bookmark
EAG_OWB_DESC:0 "Коли дирижаблі Першого Повітряного Торговельного Флоту Орлиної Скелі завершують підготовку до польоту, на Півдні згущується загроза. Після довгого періоду миру та ізоляції, жителі Орлиної Скелі дивляться в майбутнє з тривогою.\n\nЧи залишаться вони під управлінням Ради Міста, чи оберуть нового, мілітаристичного лідера, що зможе не лише захистити, а й повернути їхню батьківщину?"