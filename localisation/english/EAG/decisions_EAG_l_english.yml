eag_hiring_mercenaries:0 "Найм Найманців"
eag_hiring_mercenaries_desc:0 "Кожна §Yнаймана група§!, яку ми залучимо, знижує наш пасивний прибуток кришками на §R-25.0§!k протягом року."

eag_brotherhood_offshoots:0 "Найняти Відступників Братства"
eag_brotherhood_offshoots_desc:0 "Після багатьох років служби Паладин Дюран розчарувалась у Братстві Сталі. Вона зібрала однодумців — паладинів, писарів і лицарів — та залишила Братство, шукаючи благороднішу мету."

eag_desert_rangers:0 "Найняти Пустельних Рейнджерів"
eag_desert_rangers_desc:0 "Рейнджери Аризони довго билися з Легіоном, та зрештою були переможені. Частина з них інтегрувалась у НКР, інші залишились. А Рейнджер Алловей — втік на північ, щоб зібрати сили для помсти."

eag_enforcers:0 "Найняти Правоохоронців"
eag_enforcers_desc:0 "Після краху його спільноти, Дедрік створив загін, що забезпечує порядок у містах — за ціну. Їхня броня й кийки стали символом «власного правосуддя» в пустці."

eag_robots:0 "Найняти Роботів"
eag_robots_desc:0 "E-22 прокинувся після війни, коли електропостачання військового складу з роботами вичерпалось. Без наказів, він узяв на себе ініціативу — повести інших роботів у пустку на пошуки сенсу... чи ворогів."

eag_wasteland_tanks:0 "Найняти Пустельні Танки"
eag_wasteland_tanks_desc:0 "Оператор Росс знав, що Плем’я Вісімдесятників не витримає боротьби з НКР. Його вигнали, але він зібрав однодумців і знайшов передвоєнний завод. Тепер у нього танки — і новий шанс."
