eag_branch_office_decisions:0 "Відкриття Торгових Філій"
eag_branch_office_decisions_desc:0 "Створення §Yторгових філій§! у ключових торгових вузлах пустки дозволить нашим торговцям з дирижаблів ефективніше купувати й продавати §Yтовари§! та §Yресурси§! для Орлиної Скелі.\n\nКожна §Yторгова філія§! дає додатковий пасивний прибуток у §G5.0§!k кришок плюс §Yрівень торгового вузла§!, а також §Gвідкриває певні фокуси§!.\n\nНаразі ми маємо §Y[?EAG.eag_markets] філій§!, які приносять §G+[?EAG.eag_market_income].0§!k пасивного прибутку кришками."

