 MCA_COM_results.1.t:0 "Величний Альянс"
 MCA_COM_results.1.d:0 "Чи то величне відкидання спадщини Америки, чи її відродження в новій інтерпретації, але [COM.GetName] та [MCA.GetName] оголосили про вступ першої до [MCA.GetFactionName]. Під час радіотрансляції оголошення дипломати Шеллі Ґабришак та Мотон Бетанкур наголосили на тому, як два демократичні рухи об'єдналися заради спільної мрії про континент, і що інші, хто поділяє їхні цінності, будуть прийняті. \n\n«Ми мріємо, що вся Америка та Канада можуть бути вільними», — сказала Ґабришак. «І ми маємо волю, щоб це забезпечити, незалежно від того, що думає якийсь рейдер-засранець», — додав Бетанкур. Подальші запитання від офіційних мовників обох держав прояснили майбутнє: [MCA.GetFactionName] незабаром завітає до Пустки поблизу вас."
 MCA_COM_results.1.a:0 "З такими друзями наші вороги впадуть!"
 MCA_COM_results.1.b:0 "Америка пишається тим, що ми зробили."
 MCA_COM_results.1.c:0 "Стривайте, ми це вже бачили."
 MCA_COM_results.1.e:0 "Чому я чую музику босфайту?"

 MCA_COM_results.2.t:0 "Кінець американської окупації?"
 MCA_COM_results.2.d:0 "Після понад двох століть окупація Канади американськими силами офіційно завершилася. [COM.GetName] оголосила про свою добровільну анексію та інтеграцію до [MCA.GetName]. \n\nДипломатка Шеллі Ґабришак, яка керувала переговорами, багато розповіла по радіо про вибір окупантів. «Сполучені Штати Америки тут не мають влади», — сказала вона. «Але їхні прагнення та мрії будуть жити вічно. У [COM.GetName] зрозуміли, що для того, аби донести ці мрії до народів півночі, знадобиться набагато більше допомоги, ніж будь-хто усвідомлював. Разом, від Ґранд-Прері до Єллоустонського парку і далі, всі наші прагнення здійсняться, величніші, ніж будь-хто міг уявити»."
 MCA_COM_results.2.a:0 "Возз'єднані Штати — це сяючий маяк для Пустки."
 MCA_COM_results.2.b:0 "Sic transit gloria mundi."
 MCA_COM_results.2.c:0 "Держава постає зі Скелястих гір."

 MCA_COM_results.3.t:0 "Стара душа Америки"
 MCA_COM_results.3.d:0 "«Як би не старалася Пустка, Америка ніколи не помре». \n\nЦі слова сьогодні транслював по радіо Мотон Бетанкур, дипломат [COM.GetName]. Рух, що мав стати молодою державою, [MCA.GetName], натомість змінив свою попередню позицію і знову прагне відновити власне Сполучені Штати. Проте замість того, щоб слухати Чикаго, [MCA.GetLeader] вирішив довіритися [COM.GetLeader]. «З нашою допомогою колишня [MCA.GetName] буде реорганізована як член [COM.GetFactionName]», — заявив Бетанкур. «У рамках цієї майбутньої Співдружності ми подбаємо, цитуючи [COM.GetLeader], щоб Америку, блять, треба було звільнити. З нашими друзями в Міссулі ми повернемо континент, борючись з усіма тиранами». У подальших коментарях було додано, що переговори також вестимуться з будь-якими майбутніми демократіями, і хоча Бетанкур сподівався, що доля Міссули не була одноразовою акцією, це не буде єдиним варіантом для [COM.GetFactionName]."
 MCA_COM_results.3.a:0 "Sic transit gloria mundi."
 MCA_COM_results.3.b:0 "Мандат Америки — наш."
 MCA_COM_results.3.c:0 "Америка знову душить народ заради себе."

 MCA_COM_results.4.t:0 "Аркадія зберігає незалежність"
 MCA_COM_results.4.d:0 "У спільній заяві [COM.GetName] та [MCA.GetName] було оголошено про досягнення угоди між двома країнами. В рамках Калгарської декларації обидві сторони підписали договір про дружбу. В обмін на повне визнання незалежності Аркадії як окремої країни та народу, який не слід ототожнювати зі Сполученими Штатами (не кажучи вже про додаток, що визнає слово «Канадарець» образливим), [MCA.GetName] отримає повну співпрацю в майбутній обороні та звільненні тих, хто перебуває під ярмом гноблення. [COM.GetLeader] чітко заявив, що нація не є маріонеткою — Аркадія ніколи не буде ворогувати з дружньою країною і готова укладати майбутні договори з будь-якими майбутніми націями, які почують цю трансляцію. Рейдерські банди, звісно, не рахуються."
 MCA_COM_results.4.a:0 "Ми знайшли не просто друга — ми знайшли брата."
 MCA_COM_results.4.b:0 "Ніхто не забере Аркадію."
 MCA_COM_results.4.c:0 "Вони справді є Народом."
