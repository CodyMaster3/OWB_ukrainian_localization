 ###   Новини Канади         ###
 ################################

 news_canada.1.t:0 "Ядерний вибух над Страткомуною!"
 news_canada.1.d:0 "У четвер, 20 травня 2275 року, мешканці центральної Альберти прокинулися, щоб побачити видовище, якого в Канаді не бачили поколіннями. Навіть з безпечної відстані його неможливо було сплутати: грибоподібна хмара. Незадовго до сходу сонця ядерна бомба, що дрімала у своїй шахті, раптово вибухнула без попередження на території держави Страткомуна, поблизу одного з їхніх численних таборів дисидентів. У паніці, що виникла, звинувачення посипалися наліво й направо щодо причини цієї катастрофи. Страткомуна стверджує, що це була атака іноземних держав, які проникли на об'єкт. Винуватець вибуху невідомий, але Емі Терезі, схоже, покладає відповідальність за вибух на людей з Міністерства Лойда, на що Міністерство відповіло з обуренням. Землі, що колись належали Канадському Народному Фронту, схоже, неминуче знову опиняться на порозі конфлікту, оскільки ці дві соціалістичні держави прагнуть знищити одна одну."
 news_canada.1.a:0 "Шкідників буде вигнано з канадської землі!"
 news_canada.1.b:0 "Ми впевнені, що Терезі сама не вбила тих дисидентів?"
 news_canada.1.c:0 "Ми повинні готуватися до неминучого."
 news_canada.1.e:0 "Наче вона й досі не вбила тисячі своїх?"

 news_canada.2.t:0 "Війна на чотири фронти"
 news_canada.2.d:0 "У раптовому загостренні напруженості, Страткомуна, охоплена військовою лихоманкою після ядерного вибуху на своїй території кілька місяців тому, втягнула Канадські рівнини в ще один великий конфлікт. Обурення армії та партії Емі Терезі, схоже, переросло у повномасштабний революційний запал, і нація оголосила війну не лише Міністерству Лойда, але й Компанії «Піонер», довоєнній армії найманців, що окупувала великі ділянки колишньої території КНФ. Крім того, дивні роботи виходять зі старого об'єкта RELCOM у Ґранд-Прері, щоб скористатися хаосом. Чи окупиться ця агресивна атака для Страткомуни? Чи це буде гонка до Редмонда для всіх, хто прагне скористатися нерозсудливістю Емі Терезі?"
 news_canada.2.a:0 "За Емі Терезі!"
 news_canada.2.b:0 "Чи було це справді необхідно?"
 news_canada.2.c:0 "Редмонд у межах досяжності!"
 news_canada.2.e:0 "Сподіваємося, Емі Терезі щойно сама собі нашкодила."

 news_canada.3.t:0 "Редмонд у вогні!"
 news_canada.3.d:0 "З півночі надходять повідомлення, що місто Редмонд, столиця Страткомуни, палає у вогні після окупації ворожими силами в триваючій боротьбі Комуни за контроль над розколотою Альбертою. Поразка Емі Терезі стала очевидною, оскільки ті самі повстанці, яких вона прагнула знищити, тепер безперешкодно крокують вулицями її столиці. Багато спостерігачів сподіваються, що це може стати початком кінця Канадського Народного Фронту, яким вони його знали, наближаючи Канадські рівнини на один крок до тривалого миру. Лише час покаже, чи буде рішучість побитої Комуни достатньо сильною, щоб її сили змогли переломити хід подій."
 news_canada.3.a:0 "Не списуйте нас з рахунків! За Старшу Сестру!"
 news_canada.3.b:0 "Уся ця авантюра була серйозною помилкою."
 news_canada.3.c:0 "Ця війна ще не закінчена."
 news_canada.3.e:0 "Сподіваюся, це скоро скінчиться."

 news_canada.4.t:0 "Порядок у КНФ відновлено"
 news_canada.4.d:0 "Хаос, що охопив Центральну Альберту, нарешті припинено, оскільки розрізнені території Канадського Народного Фронту було об'єднано під новою адміністрацією. Деталі про цю зміну керівництва поки що не надходять, за винятком дивної радіопередачі, надісланої по всій Канаді після цих подій: \n\n«-Початок передачі- \n\nВітаю, КАПІТАЛІСТИЧНІ М'ЯСНІ МІШКИ, я починаю цю передачу, щоб запевнити вас, що я не забув сморід ваших гнилих тіл і незабаром вичищу ваші слабкі мізки з ваших кволих тіл і перевчу їх славі КОМУНІЗМУ! Будь ласка, не чиніть опору, оскільки це марно! Усі приєднаються до КОЛЕКТИВНОГО РОЗУМУ заради величної мети! \n\n-Кінець передачі-»"
 news_canada.4.a:0 "ПІДТВЕРДЖУЮ"
 news_canada.4.b:0 "Що за чортівня?"

 news_canada.5.t:0 "Контроль Страткомуни над КНФ зберігається"
 news_canada.5.d:0 "Хаос, що охопив Центральну Альберту, нарешті припинено, і правляча влада Канадського Народного Фронту в Страткомуні панує беззаперечно. Терезі, безсумнівно, ще більше натхненна цією перемогою, оголосила про цю перемогу на всю північ: \n\n«До уваги народу Канади! Я, Емі Терезі, зробила ще один крок до вашого остаточного визволення. Під моєю керівною рукою революція принесла справедливість Шкідникам у Лойдмінстері. Ми знищили останній пам'ятник американському імперіалізму та жадібності в Ред-Дірі. І ми вбили божевільну сталеву загрозу на півночі в Ґранд-Прері. Це все привід для великого святкування! Цією перемогою ми кладемо край довгій та важкій боротьбі за душу комунізму. До робітників Канади я звертаюся: тримайтеся! Бо щойно ми відновимося та наберемося сил, Революція триватиме, доки вся Канада не піде за нами!»"
 news_canada.5.a:0 "Перемога! Перемога!"
 news_canada.5.b:0 "Треба щось робити з цим тираном."
 news_canada.5.c:0 "Це була погроза?"

 news_canada.6.t:0 "Розпуск Канадського Народного Фронту"
 news_canada.6.d:0 "Хаос, що охопив Центральну Альберту, нарешті припинено, а разом з ним і «Революція» Терезі. Канадський Народний Фронт, настільки занурений у міжусобиці, зустрів шокуючий, гіркий кінець від рук свого найдавнішого ворога. Багато хто в Канаді радів би загибелі КНФ, якби не ті, хто, схоже, зайняв їхнє місце, про що було оголошено в трансляції, отриманій по всій півночі: \n\n«Говорить полковник Джек Джонсон із Шостої бригади. Витримавши невпинний наступ комуністичних елементів у цьому районі, ми відновили контроль Співдружності над Північно-Західною Канадою та поклали край тиранічній Червоній Загрозі. Усім іншим осередкам армії Співдружності, що залишилися, ми наказуємо негайно відновити зв'язок з Ред-Діром по захищених каналах. Щоб відновити величний союз, ми повинні зібрати наші сили і завдати удару, щоб повернути наші Сполучені Штати. Від Анкориджа до Ларедо, від Лос-Анджелеса до Вашингтона, Америку треба звільнити!»"
 news_canada.6.a:0 "Боже, благослови Америку."
 news_canada.6.b:0 "От вам і кінець американському колоніалізму."

 news_canada.7.t:0 "Перемога Міністерства в Альберті"
 news_canada.7.d:0 "Хаос, що охопив Центральну Альберту, нарешті припинено, і сувора партійна лінія Терезі, схоже, стала її погибеллю. Світську правлячу партію Канадського Народного Фронту в Страткомуні було повалено революційними відколотими групами, а новий уряд було створено соціалістичним духовенством з Лойдмінстера на сході. Соломон Бушар, його новий лідер, оголосив про цю перемогу у зверненні, трансльованому на всю Канаду: \n\n«Бог визволив нас від великого зла. Тиранка Емі Терезі змовилася забрати наші землі, наші домівки, і наші життя. Бог скеровував наші кулі та захищав наші домівки. Бог керував нашими стратегіями, і результат очевидний, і через нього ми перемогли жах, який накликала на нас пустка. Єдина нація, яка виживе, — це та, що використовує Бога як свою основу. Ми можемо пишатися своєю працею, бо вона добра, але ми повинні віддати Богу належну Йому славу за нашу перемогу»."
 news_canada.7.a:0 "Амінь."
 news_canada.7.b:0 "Ще один фанатик з надмірною владою..."

 news_canada.8.t:0 "Перемога Танкістів в Альберті"
 news_canada.8.d:0 "Хаос, що охопив Центральну Альберту, нарешті припинено, і сувора партійна лінія Терезі, схоже, стала її погибеллю. Світську правлячу партію Канадського Народного Фронту в Страткомуні було повалено революційними відколотими групами, а новий уряд було створено військовими вигнанцями з Лойдмінстера на сході. Єкатєріна Донская, його новий лідер, оголосила про цю перемогу у зверненні, трансльованому на всю Канаду: \n\n«Товариші, ми виграли лише першу з багатьох битв у довгій боротьбі, що нас чекає. Боротьба за серце Канади. Боротьба за душі людей. Боротьба проти фашистів, що нас оточують. Це революція, яку ми повинні вести на більшій кількості фронтів, ніж поле бою. Ми повинні нагодувати людей, захистити їх від рейдерів, дати їм шанс заробляти на життя. І ми повинні їх просвіщати, особливо, якщо вони не розуміють, чому наші дії були необхідні. Декаданс капіталізму залишається сильним, його залізна хватка душить робітничий клас. Народ Канади має бути звільнений з його лещат»."
 news_canada.8.a:0 "Дякую, товаришу."
 news_canada.8.b:0 "Безсумнівно, вони спробують і нас розчавити."

