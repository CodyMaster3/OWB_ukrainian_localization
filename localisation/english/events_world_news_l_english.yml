 ###   Новини Техасу         ###
 ###############################

 news_texas.1.t:0 "Зірка та Рука"
 news_texas.1.d:0 "Битва вирує вздовж траси I-20, адже війна знову спалахнула в серці Техасу. Рейдери та розбійники під прапором Бойового Загону Руки розпочали спробу захоплення земель, що належать торговельній республіці Лоун Стар. Наразі бої зафіксовано як уздовж I-20, так і навколо самого міста Лоун Стар, хоча незрозуміло, хто має перевагу.\n\nПредставники інших членів Техаського Економічного Союзу висловилися на підтримку Самотньої Зірки, хоча, що примітно, не змогли дати жодних конкретних відповідей щодо того, чи планують вони безпосередньо втрутитися в конфлікт. Щодо Бойового Загону Руки, деякі місцеві жителі стверджують, що вони прагнуть наслідувати Легіон на заході, а дехто з їхніх лав, за повідомленнями, служив під командуванням Божевільного Центуріона Пауллуса.\n\nЯким би не був кінцевий результат, ця війна кардинально вплине на Техас."
 news_texas.1.a:0 "Техаський Економічний Союз проходить випробування."
 news_texas.1.b:0 "Ми переможемо!"
 news_texas.1.c:0 "Це катастрофа!"

