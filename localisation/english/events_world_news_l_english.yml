l_english:
  ###############################
  ###   Global News Events    ###
  ###############################

 news_global.1.t:0 "Зіткнення сталі"
 news_global.1.d:0 "Під нищівним тиском крихке перемир'я між Новою Каліфорнійською Республікою та Західним Братством Сталі, що довго трималося в облозі, зазнало краху.\n\nВже вдруге за новітню історію лазерний вогонь осяює Мексон, доки НКР та Братство мобілізуються для відновлення повномасштабної війни. Президент [NCR.GetLeader] виголосив промову, заявивши, що «терористів з Братства буде знищено», тоді як Західне Братство, як очікується, активує підпільні партизанські мережі та закличе на допомогу численні відділення Братства, розкидані по всій Пустці.\n\nБої в Південній Каліфорнії швидко набирають обертів, що перевершують навіть криваву партизанську кампанію, яку Братство вело протягом 2260-х років. Одне ясно: це буде остання війна між Лост-Гіллз та Шейді-Сендс."
 news_global.1.a:0 "Отже, почалося..."
 news_global.1.b:0 "За Братство!"
 news_global.1.c:0 "Час позбавити світ цих технофашистів."
 news_global.1.e:0 "Audentes fortuna juvat!"

  ###############################
  ###    West News Events     ###
  ###############################

 news_cali.1.t:0 "НКР перемогла в Наварро"
 news_cali.1.d:0 "Після відступу або знищення решти супротивників, Нова Каліфорнійська Республіка знову стала беззаперечним володарем кордону Наварро. Завершивши кампанію з відновлення контролю над північно-західною Каліфорнією після спалаху боїв між поселенцями, що підтримували Ші, гарнізоном НКР та місцевими племенами регіону, НКР знову стоїть перед завданням приборкати останній кордон Каліфорнії.\n\nВедмідь, за підтримки кількох Брамінських баронів, швидко вжив заходів для інтеграції Території Наварро до складу НКР, привівши нову хвилю поселенців, спраглих добувати багату деревину та збирати врожаї. Схоже, НКР у Наварро надовго."
 news_cali.1.a:0 "Статус-кво збережено."
 news_cali.1.b:0 "Порядок відновлено."
 news_cali.1.c:0 "Прикро..."
 news_cali.1.e:0 "Прикро..."

 news_cali.2.t:0 "Ші перемогли в Наварро"
 news_cali.2.d:0 "Після відступу або знищення решти супротивників, Ші стали беззаперечним володарем кордону Наварро, відбивши його в НКР. Завершивши інтервенцію, покликану захистити своїх громадян після спалаху боїв між поселенцями Ші, гарнізоном НКР та місцевими племенами регіону, Ші тепер стоять перед викликом перетворити останній кордон Каліфорнії на нову рисову житницю.\n\nШі вжили заходів для інтеграції земель колишньої Території Наварро до свого складу, привівши чимало поселенців, спраглих добувати багату деревину та збирати врожаї. Якою буде внутрішня реакція НКР на цю втрату, а також чи спробує Республіка повернути територію, покаже час."
 news_cali.2.a:0 "Ведмідь прогинається під власною вагою..."
 news_cali.2.b:0 "Вкрай прикро."
 news_cali.2.c:0 "За Імператора!"
 news_cali.2.e:0 "Принаймні, це не НКР."

 news_cali.3.t:0 "Вільний Народ переміг у Наварро"
 news_cali.3.d:0 "Після відступу або знищення решти супротивників, племена Наварро, що об'єдналися у «Вільний Народ», стали беззаперечним володарем кордону Наварро, відбивши його в НКР. Завершивши війну за незалежність після спалаху боїв між поселенцями Ші, гарнізоном НКР та місцевими племенами регіону, Вільний Народ тепер стоїть перед викликом захисту останнього кордону Каліфорнії від великих держав регіону.\n\nПроте, ходять чутки, що племена підтримували, а можливо, навіть контролювали найманці з Еврики, що на півночі. Якою буде внутрішня реакція НКР на цю втрату, а також чи спробує Республіка повернути територію, покаже час."
 news_cali.3.a:0 "Як і НКР, і Ші могли програти якимось дикунам?"
 news_cali.3.b:0 "Це не могли бути просто дикуни..."
 news_cali.3.c:0 "Це не могли бути просто дикуни..."
 news_cali.3.e:0 "Ми довели свою силу."

  news_cali.4.t:0 "[SHI.GetLeader] зміцнює контроль над Ші"
  news_cali.4.d:0 "З земель Ші надходять новини, що Ло Пан готується здобути абсолютний контроль над їхньою політичною ареною. Оскільки його опонентам більше не вистачає сил протистояти йому, Ло Пан зробить те, що й завжди планував: поглибить зв'язки з НКР і поведе Ші шляхом могутності за власним розумінням."
  news_cali.4.a:0 "НКР стає сильнішою."
  news_cali.4.b:0 "Ласкаво просимо, друзі та союзники!"
  news_cali.4.c:0 "Поруч з нами, Брате Ведмедю."
  news_cali.4.e:0 "Більше розпусників, яких треба вбити."

  news_cali.5.t:0 "[SHI.GetLeader] бере контроль над Ші!"
  news_cali.5.d:0 "Новини від Ші повідомляють, що Школа Дракона на чолі з Акігахай вийшла на передній план на їхній політичній арені. Що це означає для навколишньої Пустки — невідомо, але Акігахай вже давно відкрито виступає проти наступу впливу НКР і закликає Ші повернутися до свого традиційного коріння. Хай там що, вона стане проблемою для інтересів НКР у цьому регіоні."
  news_cali.5.a:0 "На горизонті війна?"
  news_cali.5.b:0 "Можливо, нам слід почати розробляти плани вторгнення."
  news_cali.5.c:0 "Ми заявимо про себе."

  news_cali.6.t:0 "[SHI.GetLeader] здобуває вплив над Ші!"
  news_cali.6.d:0 "Сьогодні Братство Сталі посилило свій вплив у Каліфорнії. Імператор Ші запросив місцеве Братство допомогти відновити порядок у Сан-Франциско, прагнучи ліквідації вуличних банд та інших ворожих сил, які так довго дошкуляли місту.\n\n[SHI.GetLeader], лідер Бункера Сан-Франциско, має фактичний контроль над політикою Ші, як завдяки особистій дружбі з радником Імператора Кеном Лі, так і через послаблення контролю інших фракцій. Гарантовано, що [SHI.GetLeader] зі своєї нової посади намагатиметься підтримувати Братство загалом."
 news_cali.6.a:0 "Братство закріплюється ще в одному куточку Каліфорнії."
 news_cali.6.b:0 "Можливо, нам доведеться розробити плани вторгнення."
 news_cali.6.c:0 "Ad Victoriam!"
 news_cali.6.e:0 "Чудовий розвиток подій!"

 news_cali.7.t:0 "Лі Олівер йде у відставку з посади генерала Мохавської експедиції"
 news_cali.7.d:0 "У керівництві Нової Каліфорнійської Республіки відбулися значні зміни: сьогодні генерал Лі Олівер оголосив про свою відставку з посади командувача Мохавської експедиції. Ця новина з'явилася після місяців політичних дебатів, кульмінацією яких стало рішення Комітету оборони Мохаве — органу, створеного для визначення майбутнього експедиції НКР до Мохаве — підтримати [MOT.GetLeader]. Ця подія знаменує завершення довгої боротьби за владу в експедиції, і після Битви за дамбу Гувера рішення замінити улюбленця Конгресу було погано сприйнято урядом НКР.\n\nПід керівництвом [MOT.GetLeader] очікується радикальна зміна військової стратегії НКР в регіоні, з пріоритетом на оперативну гнучкість та укріплення ключових точок вздовж великої річки Колорадо в рамках підготовки до очікуваного повернення Легіону в Мохаве."
 news_cali.7.a:0 "Зміна стратегії НКР?"
 news_cali.7.b:0 "Конгресу це не сподобається..."
 news_cali.7.c:0 "Новий бос такий самий, як і старий."
 news_cali.7.e:0 "На хресті вони всі виглядатимуть однаково."

 news_cali.8.t:0 "Хаос на Територіях Наварро"
 news_cali.8.d:0 "Північно-східна Каліфорнія сьогодні у вогні: після сутички між найманцями Ван-Ґраффів та поселенцями Ші в прибережному місті Фусанг, що забрала життя 21 людини, на Територіях Наварро НКР запанував хаос. Поселенці, що підтримують Ші, та племена регіону взялися за зброю проти місцевого гарнізону, успішно захопивши схід та південь прикордонної території. Цю подію вже охрестили «Наваррською кризою».\n\nПоки Ші, НКР та Еврика люто обговорюють інтервенцію, очікується початок відкритої війни в Наварро, яка, незалежно від результату, становитиме серйозну загрозу для дипломатичних відносин між трьома фракціями."
 news_cali.8.a:0 "Домінуванню НКР в Каліфорнії кинуто виклик."
 news_cali.8.b:0 "Ми повинні захистити нашу територію!"
 news_cali.8.c:0 "Наш шанс!"
 news_cali.8.e:0 "Наш шанс!"

 news_cali.9.t:0 "[NEW.GetLeader] утримує владу в Нью-Ріно"
 news_cali.9.d:0 "Після серії дрібних сутичок між ворогуючими родинами, схоже, Бішопи залишаються в Ріно надовго. Ця новина надійшла після того, як [NEW.GetLeader] забезпечив провідну позицію своєї родини в Нью-Ріно, унеможлививши будь-які спроби інших фракцій захопити владу. З Нью-Ріно, нарешті об'єднаним під владою однієї родини після десятиліть міжусобиць, одне з найбільших міст Заходу готове розпочати кампанію з розширення в Неваді.\n\nБішопи пообіцяли зблизити «Найбільше маленьке місто» з Новою Каліфорнійською Республікою, вже сьогодні офіційно оформивши статус міста як Асоційованої території. Час покаже, чи стане це початком вступу Ріно до Республіки."
 news_cali.9.a:0 "Ріно в НКР? У Хауса з'явиться конкуренція."
 news_cali.9.b:0 "Чудовий розвиток подій!"
 news_cali.9.c:0 "Наша влада ніколи не піддавалася сумніву."
 news_cali.9.e:0 "Ми спалимо і виродків, і повій."

 news_cali.10.t:0 "[NEW.GetLeader] закріплює владу в Нью-Ріно"
 news_cali.10.d:0 "Після серії дрібних сутичок між ворогуючими родинами, Райти захопили контроль над Ріно. Ця новина надійшла після того, як [NEW.GetLeader] забезпечив провідну позицію своєї родини в Нью-Ріно, унеможлививши будь-які спроби інших фракцій захопити владу. З Ріно, нарешті об'єднаним під владою однієї родини після десятиліть міжусобиць, одне з найбільших міст Заходу готове розпочати кампанію з розширення в Неваді.\n\nУ своїй нещодавній промові [NEW.GetLeader] оголосив про зміну курсу для міста, найбільш відомого своєю злочинною діяльністю, заявивши, що Ріно «прагнутиме стати безпечним, стабільним місцем для виховання родини. Місцем, де діти турбуються про стандартизовані тести, а не про наркоманію. Місцем благочестивої молитви, а не бандитських розправ». Пізніше він додав, що місто збереже проституцію та азартні ігри, «хоча б для того, щоб відвернути чоловіків і жінок від більш руйнівних вад»."
 news_cali.10.a:0 "Невже Ріно нарешті взялося за розум?"
 news_cali.10.b:0 "Туди їм і дорога."
 news_cali.10.c:0 "Покажімо світові, яким може бути Ріно!"

 news_cali.11.t:0 "Зламані Брати об'єднують родини Нью-Ріно!"
 news_cali.11.d:0 "З Нью-Ріно надійшли дивовижні новини: Зламані Брати, найновіша родина міста, схоже, уклали мирну угоду між численними родинами Ріно, поклавши край десятиліттям міжусобиць. Ріно керуватиметься радою, що складається з усіх владних блоків міста, включаючи Бішопів, Райтів і, звичайно, самих Зламаних Братів.\n\nВождь супермутантів Традд, лідер Зламаних Братів, оголосив, що Нью-Ріно незабаром стане «символом єдності та процвітання як для людей, так і для мутантів».\n\nЧас покаже, чи переживе угода, що об'єднала Нью-Ріно, непевне майбутнє."
 news_cali.11.a:0 "Наче це надовго!"
 news_cali.11.b:0 "Серйозно? Для цього знадобилася лише банда супермутантів?"
 news_cali.11.c:0 "Процвітання чекає!"

 news_cali.12.t:0 "[NEW.GetLeader] захоплює владу в Нью-Ріно!"
 news_cali.12.d:0 "Велике Коло шоковане, адже баланс сил у Нью-Ріно порушено після перевороту, влаштованого Ван-Ґраффами. Під час події, яку охрестили «Попільною середою», усі суперники Ван-Ґраффів були випарувані за одну ніч. Швидко захопивши контроль над вулицями Нью-Ріно, Ван-Ґраффи на чолі з [NEW.GetLeader] стали єдиною силою, що залишилася в Ріно. З Ріно, нарешті об'єднаним під владою однієї родини після десятиліть міжусобиць, одне з найбільших міст Заходу готове розпочати кампанію з розширення в Неваді.\n\nВ оточенні охоронців, озброєних плазмовими гвинтівками, [NEW.GetLeader] оголосив, що Нью-Ріно буде реорганізовано для постачання «лише енергетичної зброї найвищої якості».\n\nЧас покаже, як сусідня Нова Каліфорнійська Республіка, чия довга історія з Ван-Ґраффами завжди була непростою, відреагує на захоплення влади родиною."
 news_cali.12.a:0 "У Великому Колі стає цікаво."
 news_cali.12.b:0 "Можливо, ми зможемо домовитися?"
 news_cali.12.c:0 "Час показати Ведмедю, хто *насправді* керує Невадою."

 news_cali.13.t:0 "Еврика приєднується до НКР"
 news_cali.13.d:0 "Північне каліфорнійське місто Еврика сьогодні стало останнім розширенням Нової Каліфорнійської Республіки. [EUR.GetLeader] оголосив, що Еврику прийнято до складу Республіки як «Територію Еврика».\n\nЦе надбання, що залишає місто значною мірою автономним, дозволяє НКР використовувати значний контингент найманців порту для подальшого розширення свого впливу в північній Каліфорнії."
 news_cali.13.a:0 "НКР не припиняє рости, чи не так?"
 news_cali.13.b:0 "Ласкаво просимо до Республіки!"
 news_cali.13.c:0 "Гроші НКР зроблять нас багатими!"
 news_cali.13.e:0 "Місто повій. Якраз для НКР."

 news_cali.14.t:0 "Ланій іде на Захід"
 news_cali.14.d:0 "Легат Ланій, «Монстр Сходу» та завойовник 19 племен, прибув на Захід. Після завершення кривавої військової кампанії в Нью-Мексико та Колорадо, під час якої Легіон поглинув племена Міста Псів та Матерів-Близнючок, Легат, за повідомленнями, прибув на східний берег річки Колорадо, щоб командувати скупченими там силами Легіону.\n\nПрибуття Легата та його східних когорт, одного з найшанованіших — і найстрашніших — полководців Цезаря, означає новий рівень інтенсивності в кампанії Легіону в Мохаве та за його межами."
 news_cali.14.a:0 "Цезар знайшов свій молот проти Заходу."
 news_cali.14.b:0 "Ми зупинимо цього монстра!"
 news_cali.14.c:0 "З його приходом прийде й загибель Заходу."

 news_cali.15.t:0 "Штат Нью-Вегас"
 news_cali.15.d:0 "Сьогодні над Стрипом Вегаса майорить прапор Двоголового Ведмедя, після того як президент [NCR.GetLeader] підписав офіційну декларацію про анексію Мохаве та включення його до складу Нової Каліфорнійської Республіки як «Штат Нью-Вегас». Після усунення Легіону як безпосередньої загрози, НКР змогла убезпечити свої володіння і нарешті взяти під контроль саме місто Нью-Вегас.\n\nЦе завершує багаторічну Мохавську Експедицію, під час якої НКР зазнала значних втрат, намагаючись утримати контроль над регіоном."
 news_cali.15.a:0 "Без Легіону, хто кине виклик Ведмедю?"
 news_cali.15.b:0 "Хай живе Республіка!"
 news_cali.15.c:0 "Це їм не допоможе!"

 news_cali.16.t:0 "Баха приєднується до НКР"
 news_cali.16.d:0 "Після завершення переговорів з місцевими картелями на півострові, [BJS.GetLeader] з Бандитів Паз оголосив про створення Республіки Баха, а одразу після цього — про її вступ до Нової Каліфорнійської Республіки як автономної держави під його керівництвом.\n\nЗавдяки узгодженим дипломатичним зусиллям президента [NCR.GetLeader], НКР нещодавно інвестувала значні ресурси у створення торговельних шляхів у регіоні, закладаючи основу для організованої держави. Ці зусилля, схоже, дали свої плоди, оскільки НКР фактично отримала контроль над півостровом — а отже, і над Каліфорнійською затокою — не зробивши жодного пострілу.\n\nХоча багато громадян НКР незадоволені тим, що ватажки картелів Бахи отримали нові посади в новоствореній державі, кінець бандитизму в Басі все ж стане великим полегшенням для мешканців південної Каліфорнії."
 news_cali.16.a:0 "НКР продовжує рости."
 news_cali.16.b:0 "Ласкаво просимо до Республіки!"
 news_cali.16.c:0 "Шкода. Бійка зайняла б цих виродків."

 news_cali.17.t:0 "[VLT.GetLeader] перемагає на перевиборах"
 news_cali.17.d:0 "Схоже, [VLT.GetName] ще п'ять років очолюватиме [VLT.GetLeader]: чинна Перша Громадянка оголосила про своє призначення на другий термін після перших в історії всенародних виборів на цю посаду.\n\nЛінетт забезпечила собі переобрання завдяки кампанії, що надавала пріоритет правам гулів та зміцненню зв'язків з Новою Каліфорнійською Республікою, сподіваючись перетворити місто на «сяючий маяк цивілізації» в «диких пустках північної Невади».\n\nЧас покаже, як переобрання Лінетт вплине на Велике Коло."
 news_cali.17.a:0 "У Місті-Сховищі все без змін."
 news_cali.17.b:0 "Чудово!"
 news_cali.17.c:0 "Народ сказав своє слово!"

 news_cali.18.t:0 "[VLT.GetLeader] обрано в Місті-Сховищі"
 news_cali.18.d:0 "У [VLT.GetName] сьогодні відбувся струс у керівництві: [VLT.GetLeader] оголосив про свою перемогу над чинною Першою Громадянкою Лінетт на перших в історії всенародних виборах на посаду Першого Громадянина.\n\nПрийшовши до влади на хвилі невдоволення, [VLT.GetLeader] обіцяє перетворити місто-державу на ядро суверенної, демократичної Невади.\n\nЧас покаже, як результати виборів вплинуть на Велике Коло."
 news_cali.18.a:0 "Демократія в Місті-Сховищі? Нісенітниця."
 news_cali.18.b:0 "Ми б віддали перевагу Лінетт."
 news_cali.18.c:0 "Народ сказав своє слово!"

 news_cali.19.t:0 "Невадський Пакт оголошує про союз з НКР"
 news_cali.19.d:0 "Нова Каліфорнійська Республіка сьогодні отримала новий загін союзників у Великому Колі, після того як [VLT.GetLeader] оголосив, що Невадський Пакт, «ліга цивілізованих держав» на чолі з Містом-Сховищем, офіційно укладе взаємний військовий союз з НКР.\n\nМісто-Сховище зазнало значного розширення в попередні роки, перетворившись з маленького міста-держави під загрозою анексії НКР на серце нової, незалежної Невади.\n\nЦей союз дає Місту-Сховищу та НКР можливість продовжувати розширення на схід, у дикі землі Юти та Орегону."
 news_cali.19.a:0 "Що це означає для Невади?"
 news_cali.19.b:0 "Невада та Ведмідь разом."
 news_cali.19.c:0 "Невада та Ведмідь разом."
 news_cali.19.e:0 "Виродки."

 news_cali.20.t:0 "Місто-Сховище приєднується до НКР!"
 news_cali.20.d:0 "Місто-Сховище, нація Великого Кола, продовжує дивувати: сьогодні [VLT.GetLeader] оголосив, що місто-держава офіційно приєднується до Нової Каліфорнійської Республіки як «Штат-Сховище».\n\nМісто-Сховище довго було ціллю для розширення НКР, але, схоже, нещодавнє обрання [VLT.GetLeader], першого лідера-гуля в Місті-Сховищі, нарешті дозволило місту отримати статус штату в Республіці.\n\nЦе надбання дає НКР можливість подальшого розширення своїх володінь у Неваді."
 news_cali.20.a:0 "Що це означає для Невади?"
 news_cali.20.b:0 "Ласкаво просимо до Республіки!"
 news_cali.20.c:0 "Невада та Ведмідь разом."
 news_cali.20.e:0 "Виродки."

 news_cali.21.t:0 "Кріт-щур захоплює владу в Місті-Сховищі"
 news_cali.21.d:0 "Захід шокований: невдовзі після відставки Ґордона з Ґекко, Рада Міста-Сховища оголосила, що кріт-щур, що розмовляє — [VLT.GetLeader] — стане наступним Першим Громадянином міста-держави.\n\nПообіцявши захищати Пустку від прихованої загрози, відомої як «Псайкери», рішення надати владу розумному гризуну було чомусь відносно добре сприйняте населенням Міста-Сховища.\n\nМожливо, неспокій останніх років нарешті остаточно і безповоротно зруйнував розум мешканців Великого Кола."
 news_cali.21.a:0 "...Що?"
 news_cali.21.b:0 "Насправді, нічого особливого."

 news_cali.22.t:0 "[VLT.GetLeader] обрано в Місті-Сховищі!"
 news_cali.22.d:0 "Шокуючий результат, який мало хто міг передбачити: [VLT.GetLeader] був обраний першим Першим Громадянином-гулем Міста-Сховища на перших в історії всенародних виборах на цю посаду.\n\nЙого успішний прихід до влади стався після того, як процес Виборів Першого Громадянина зайшов у глухий кут. Скориставшись плутаниною, [VLT.GetLeader] швидко заручився народною підтримкою на платформі сприяння «оновленню» Міста-Сховища, щоб отримати більшість у другому турі голосування.\n\nЗ огляду на сильну про-НКРівську позицію нового Першого Громадянина, час покаже, як результати виборів вплинуть на Велике Коло."
 news_cali.22.a:0 "Гуль? У Місті-Сховищі?"
 news_cali.22.b:0 "Народ сказав своє слово, і він хоче Оновлення!"

 news_cali.23.t:0 "Мирні переговори Братства та НКР"
 news_cali.23.d:0 "У дивовижному повороті відносин, лідер Братства [BOS.GetLeader] погодився зустрітися з президентом Мерфі для переговорів про створення офіційного мирного договору з Новою Каліфорнійською Республікою. Вперше з початку бойових дій кілька десятиліть тому, Братство відвідає Шейді-Сендс. Давно покинутий аванпост БС у Шейді-Сендс буде перетворено на посольство.\n\nЩе багато чого належить вирішити між НКР та Братством. Проте, для багатьох мешканців Братства та Республіки мир нарешті з'явився на горизонті після стількох років кровопролиття."
 news_cali.23.a:0 "Братство та НКР ладнають? Неочікувано."
 news_cali.23.b:0 "Нарешті мир!"
 news_cali.23.c:0 "Це може стати проблемою..."

 news_cali.24.t:0 "Кімбола усунуто з посади!"
 news_cali.24.d:0 "Як різке неприйняття тенденції до зростання мілітаризму та корупції в НКР, президента Кімбола було усунуто з посади після вотуму недовіри від Сенату НКР.\n\nРозслідування, що почалося з Наваррської кризи, швидко позбавило Кімбола підтримки через серію драматичних слухань у Сенаті, які викрили корупцію, нестримний імперіалізм та поширений непотизм, що мали місце під час його терміну.\n\nЯк лідера опозиції, сенатора Олґуда Мерфі з Боун'ярду було обрано Сенатом на посаду президента до кінця терміну. Час покаже, чи зможе новообраний президент Мерфі виконати свою амбітну антикорупційну програму до початку Федеральних виборів 2278 року."
 news_cali.24.a:0 "Подивимося, на що здатен цей."
 news_cali.24.b:0 "Майбутнє виглядає світлим!"
 news_cali.24.c:0 "Одного виродка вигнали, інший прийшов."

 news_cali.25.t:0 "Арройо приєднується до НКР"
 news_cali.25.d:0 "Величезний натовп зібрався в Шейді-Сендс під подвійними статуями Арадеша та Мешканця Сховища, щоб стати свідком народження нового союзу. Сенатори з кожного штату Нової Каліфорнійської Республіки, а також представники союзників НКР приєдналися до президента, щоб привітати посланців з найновішого штату, що приєднався до НКР — Арройо. На чолі зі славетним Обраним, обидві групи сьогодні підписали новий договір, що офіційно включив Арройо та його землі до складу НКР як автономний штат, з усіма перевагами та обов'язками, що передбачає державність.\n\nОбраного бачили, як він розмовляв з президентом біля підніжжя статуй, вдягнений у той самий комбінезон Сховища та Піп-Бой, які носили його дідусь та бабуся, коли вперше прибули до Шейді-Сендс багато десятиліть тому. Було оголошено державне свято на честь цієї події, а президент [NCR.GetLeader] у своїй промові наголосив на історичному зв'язку між народами НКР та Арройо, адже жоден з них не існував би без іншого.\n\nЧас покаже, як це надбання вплине на розширення Республіки в Орегон."
 news_cali.25.a:0 "Ведмідь об'єднується зі своїм найстарішим другом."
 news_cali.25.b:0 "Ніколи не забуваймо про зв'язок, що нас єднає."
 news_cali.25.c:0 "Ласкаво просимо до Республіки!"
 news_cali.25.e:0 "Виродки."

 news_cali.26.t:0 "Арройо оголошує про союз з НКР"
 news_cali.26.d:0 "Величезний натовп зібрався в Шейді-Сендс під подвійними статуями Арадеша та Мешканця Сховища, щоб стати свідком народження нового союзу. На чолі зі славетним Обраним, Арройо та Нова Каліфорнійська Республіка сьогодні підписали новий договір, що офіційно включив орегонську націю до військового пакту з Республікою, зберігаючи при цьому її незалежність.\n\nОбраного бачили, як він розмовляв з президентом біля підніжжя статуй, вдягнений у той самий комбінезон Сховища та Піп-Бой, які носили його дідусь та бабуся, коли вперше прибули до Шейді-Сендс багато десятиліть тому. Президент [NCR.GetLeader] у своїй промові наголосив на історичному зв'язку між народами НКР та Арройо, адже жоден з них не існував би без іншого.\n\nЧас покаже, як це партнерство вплине на розширення Республіки в Орегон."
 news_cali.26.a:0 "Ведмідь об'єднується зі своїм найстарішим другом."
 news_cali.26.b:0 "Ніколи не забуваймо про зв'язок, що нас єднає."
 news_cali.26.c:0 "Ласкаво просимо до Республіки!"
 news_cali.26.e:0 "Виродки."

 news_cali.27.t:0 "Есмеральда замовкла"
 news_cali.27.d:0 "Велике Коло часто вважають найприбутковішим торговим шляхом на заході, що простягається від Орегону до Мохаве. Проте протягом багатьох років регіон долини Есмеральда, що лежить прямо на південь, часто був надто небезпечним для торговців через безперервні конфлікти. Так було дотепер. Кур'єри та каравани повідомляють, що Есмеральда замовкла, нарешті об'єднана під прапором Рейнджерів-Відступників. Що це означає для регіону, невідомо, але багато хто остерігається амбіцій Рейнджерів.\n\nРейнджери-Відступники, відгалуження Пустельних Рейнджерів, що дезертирувало після об'єднання організації з НКР, вважають, що НКР не мала права вирішувати, кого їм захищати, а кого ні, і з моменту дезертирства ведуть свою особисту війну в Есмеральді. Розібравшись зі своїми безпосередніми суперниками, Рейнджери тепер дивляться на захід — дехто сподівається налагодити стосунки з Ведмедем, а значно більше прагне розпочати ще один хрестовий похід проти будь-якої уявної тиранії."
 news_cali.27.a:0 "Новий друг чи новий ворог для Ведмедя?"
 news_cali.27.b:0 "Час розібратися з незавершеними справами, так чи інакше."
 news_cali.27.c:0 "Проти будь-якої тиранії!"

 news_cali.28.t:0 "Есмеральда замовкла"
 news_cali.28.d:0 "Велике Коло часто вважають найприбутковішим торговим шляхом на заході, що простягається від Орегону до Мохаве. Проте протягом багатьох років долина Есмеральда, що лежить прямо на південь, часто була надто небезпечною для торговців через безперервні конфлікти. Так було дотепер. Кур'єри та каравани повідомляють, що Есмеральда замовкла, нарешті об'єднана під прапором Синів Каґи.\n\nБагато хто в Пустці знає про Обраного та його діяння, але мало хто знає про його вічного суперника, Каґу. Тримаючи Есмеральду у своєму залізному кулаці, Каґа тепер прагне вирушити на батьківщину, яка відкинула його багато років тому. Хоча його маршрут невідомий, багато хто шепоче, що він хоче прокласти собі шлях через Неваду, знищуючи все на своєму шляху, будь то гангстер, рейдер чи мутант."
 news_cali.28.a:0 "Тривожно."
 news_cali.28.b:0 "Тільки не вони!"
 news_cali.28.c:0 "Помста близько."

 news_cali.29.t:0 "Есмеральда замовкла"
 news_cali.29.d:0 "Велике Коло часто вважають найприбутковішим торговим шляхом на заході, що простягається від Орегону до Мохаве. Проте протягом багатьох років долина Есмеральда, що лежить прямо на південь, часто була надто небезпечною для торговців через безперервні конфлікти. Так було дотепер. Кур'єри та каравани повідомляють, що Есмеральда замовкла, нарешті об'єднана під прапором 215-ї — колишньої каторжної бригади Ханаану. Що це означає для регіону, невідомо, але багато хто остерігається їхніх амбіцій.\n\nХоча Великому Колу не звикати до дивного та несподіваного, двох речей, яких у Пустці хоч греблю гати, цей останній розвиток подій може бути найдивнішим. Люди прокинулися і знайшли нові канали на своїх радіоприймачах та дивні голо-записи біля своїх дверей. Усі вони говорять про нову зірку, що сходить в Есмеральді, Королеву Рейдерів, що любить бути в центрі уваги. Маріанна, можливо, зараз і не є великою шишкою, але, можливо, незабаром все Велике Коло буде захоплюватися її славою, особисто чи по радіо."
 news_cali.29.a:0 "Ще бандити."
 news_cali.29.b:0 "Ще бандити."
 news_cali.29.c:0 "Час сяяти."

 news_cali.30.t:0 "Есмеральда замовкла"
 news_cali.30.d:0 "Велике Коло часто вважають найприбутковішим торговим шляхом на заході, що простягається від Орегону до Мохаве. Проте протягом багатьох років долина Есмеральди, що лежить прямо на південь, часто була надто небезпечною для торговців через безперервні конфлікти. Так було дотепер. Кур'єри та каравани повідомляють, що Есмеральда замовкла, нарешті об'єднана під прапором групи, відомої як Охоронці. Що це означає для регіону, невідомо, але багато хто остерігається їхніх амбіцій.\n\nЗ усіх груп, що боролися за Есмеральду, відлюдькуваті та ворожі Охоронці були тими, про кого люди знали найменше. Сховані у своїй цитаделі, вони тепер контролюють всю територію, захоплюючи технології та відганяючи всіх, кого вважають загрозою. Про їхні плани мало що відомо, хоча дехто стверджує, що бачив ґвинтокрил із заходу, що летів до їхньої бази. Ходять чутки, що вони прагнуть захистити якийсь втрачений скарб технологій, а інші кажуть, що вони у змові з Братством у Новій Каліфорнії. Лише час покаже, що вони задумали."
 news_cali.30.a:0 "Тривожно."
 news_cali.30.b:0 "Потенційний союзник?"
 news_cali.30.c:0 "До нових звершень!"

 news_cali.31.t:0 "Есмеральда замовкла"
 news_cali.31.d:0 "Велике Коло часто вважають найприбутковішим торговим шляхом на заході, що простягається від Орегону до Мохаве. Проте протягом багатьох років долина Есмеральда, що лежить прямо на південь, часто була надто небезпечною для торговців через безперервні конфлікти. Так було дотепер. Кур'єри та каравани повідомляють, що Есмеральда замовкла, нарешті об'єднана під єдиною владою.\n\nУ центрі Есмеральди знаходилася дивна перлина Старого Світу, відома як TV-Таун. Його призначення давно забуте оточуючими, але всі прагнули його таємниць і скарбів. Проте ніхто не очікував, що скарб дасть відсіч. Біженці, що тікають від боїв, розповідають про машини у формі людей, що проривалися крізь ворогів, сильніші та швидші за будь-що, за винятком найсмертоносніших кігтів смерті. Ці Андроїди оголосили Есмеральду своєю, і що це означає для Пустки, ще належить побачити."
 news_cali.31.a:0 "Тривожно..."
 news_cali.31.b:0 "Утопія чекає!"

