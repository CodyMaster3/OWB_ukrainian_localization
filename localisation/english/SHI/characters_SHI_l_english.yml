l_english:
SHI_EMPEROR_NAME:0 "Імператор"
  SHI_EMPEROR_NO_PATH_DESC:0 "Імператор Ші прихований від суспільства завісою таємниці. Мало хто бачить його особисто, і лише Кен Лі, як відомо, говорить від його імені як головний радник. \n\nВони й не підозрюють, що на троні Ші сидить не людина, а суперкомп'ютер, вилучений з їхнього стародавнього підводного човна, який використовується для розрахунку оптимальних рішень, створюючи лише ілюзію геніального розуму за троном. \n\nШЛЯХУ ІМПЕРАТОРА НЕМАЄ."
  SHI_EMPEROR_ALT_DESC:0 "Імператор Ші прихований від суспільства завісою таємниці. Мало хто бачить його особисто, і лише Кен Лі, як відомо, говорить від його імені як головний радник. \n\nВони й не підозрюють, що на троні Ші сидить не людина, а суперкомп'ютер, вилучений з їхнього стародавнього підводного човна, який використовується для розрахунку оптимальних рішень, створюючи лише ілюзію геніального розуму за троном."

  SHI_AKIGAHAI_NAME:0 "Акігахай"
  SHI_rising_dragon:0 "§BДракон, що сходить§!"
  SHI_aki_shogun:0 "§RШьогун Ші§!"
  SHI_chosen_slayer:0 "Обрана Вбивця"
  SHI_AKIGAHAI_DESC:0 "§B"Я переможу, заради блага народу."§! \n\nБідна дівчина з бідної сім'ї, Акігахай була прийнята під опіку Дракона ще дитиною. Можливо, він щось у ній побачив, або просто зглянувся над жалюгідною дівчинкою. Вона не отримала своєї відповіді, оскільки Дракон покинув суспільство Ші після своєї ганебної поразки від рук іноземної маріонетки Ло Пана. Школа Дракона втратила репутацію, і багато хто відмовився від її вчень. Але не вона. Можливо, Акігахай була лише маленькою дівчинкою, але вона не здавалася. \n\nПротягом останніх кількох десятиліть вона використовувала кожну можливість, щоб зберегти вчення Дракона живими, і тепер її зусилля перетворилися на мандат вести народ у краще майбутнє. Вона виправить кожну помилку, яку увічнив Ло Пан, і допоможе Ші стати гордими та незалежними. Їхні традиції, давно забуті, будуть відновлені як фундамент їхнього суспільства. \n\nІ якщо буде потрібно, Акігахай знищить усіх і все, що стоятиме на її шляху."
  SHI_peoples_voice:0 "Голос Народу"
  SHI_akigahai_advisor_desc:0 "Наш режим, можливо, і не є всім тим, на що сподівалася Акігахай, але ми виявляємо набагато більше поваги до народу, ніж Ло Пан коли-небудь. Оскільки вона виступає на нашу користь, люди згуртуються, щоб підтримати наші зусилля."

  SHI_LO_PAN_NAME:0 "Ло Пан"
  SHI_might_makes_right:0 "§OПраво Сильного§!"
  SHI_generalissimo:0 "§OГенералісимус§!"
  SHI_hero_of_chaos:0 "§0Герой Хаосу§!"
  ncr_best_friend:0 "Сифу НКР"
  SHI_LO_PAN_DESC:0 "§O"Може, я й покидьок, але ніхто ніколи не скаже, що я не захищаю свій народ."§!\n\nЛо Пан керує Ші з 2241 року, коли Обраний допоміг йому в бою проти Дракона. Ло Пан знає, що він виродок, але в цьому світі треба бути сильним виродком, щоб пробити собі шлях. Коли він утвердився серед Ші, вони були слабким та ізольованим народом, який покладався на захист Дракона. Ло Пан змусив їх зрозуміти, що їм потрібно бути достатньо сильними, щоб захистити себе. Якщо ви запитаєте його, Ші розбагатіли завдяки тому, що він запросив каліфорнійських купців та бізнесменів до Сан-Франциско. Можливо, він і забрав левову частку, але таким було його право як найсильнішого. \n\nОстанніми роками слабкі маленькі вівці почали бекати про те, що їм не вистачає "справедливої частки", а старійшини бурчать про руйнування традицій. Їх усіх підбурює фанатична Акігахай. Ло Пан знає, що вона лише дурепа, яка відмовляється вірити в поразку Дракона. Він нагадає всім, що тільки сила дає право, і вони ще подякують йому, коли побачать мудрість його правління. \n\nСлавне нове майбутнє чекає на тих, хто відкине минуле, а Ло Пан давно залишив своє позаду."
  SHI_economic_strength:0 "Економічна Могутність"
  SHI_lo_pan_advisor_desc:0 "Ло Пан намагається отримати максимум із поганої ситуації. Він, звісно, не хотів втрачати більшу частину своєї влади, але у нього все ще буде маленький ставок, де він зможе бути великою рибою. Хто знає, можливо, одного дня він заробить достатньо грошей, щоб знову заявити про себе? А доти ми обидва можемо отримувати прибуток від його підприємств."

  SHI_DRAGON_NAME:0 "Дракон"
  SHI_old_hero:0 "§RСтарий Герой§!"
  SHI_DRAGON_DESC:0 "§R"Ті, хто б'ється без честі, нічим не кращі за тварин!"§! \n\nКолись Дракон був чемпіоном добрих людей Ші. Він впав у немилість після того, як був переможений у бою Обраним, що виступав від імені Ло Пана. Він покинув Сан-Франциско, вирушивши в довгу подорож, щоб знайти себе. \n\nВін повернувся у скрутну для свого народу годину, щоб боротися з гнобленням Фусана. Він врятує їх від лиходійства НКР або помре, намагаючись це зробити."

  SHI_LEE_NAME:0 "Лі Цзюнь-фань"
  SHI_LEE_DESC:0 "§M"Краще ми будемо битися за правилами та кодексами, ніж піддамося суцільному руйнуванню."§! \n\nЛі Цзюнь-фань — плід союзу батька з Ші та матері з НКР. Його мати, Міранда, приїхала до Сан-Франциско, щоб скористатися зростаючими зв'язками між двома спільнотами, але зіткнулася з труднощами і застрягла там. Хоча серед Ші вона все ще була не зовсім бажаною гостею, її привітав Лі Він-ва. Разом вони намагалися досягти чогось зі своїми скромними статками. \n\nВиростаючи в бідності, Лі бачив у повазі, якою користувалися майстри бойових мистецтв, спосіб досягти чогось у житті. Але Школа Журавля приймала лише "гідних", і багато інших відвертали носа від юнака змішаного походження. Потім він почув заклик Дракона. Противники Акігахай виступали проти руйнування способу життя Ші під владою Ло Пана, і це знайшло відгук у Лі. Хоча дехто залишався ворожим до чоловіка змішаної раси, Акігахай дозволила Лі приєднатися до її школи. Хоч би що вона в ньому побачила, тепер він її найвідданіший учень."

  SHI_CYNTHIA_NAME:0 "Синтія Емерсон"
  SHI_CYNTHIA_DESC:0 "§R"Здається, я — хвиля майбутнього."§! \n\nСинтія Емерсон — дочка каліфорнійського бізнесмена на ім'я Патрік Емерсон. Маючи ключові інтереси в Сан-Франциско та будучи особистим другом Ло Пана, Патрік переважно проживає саме тут. Незважаючи на привілейоване життя в усьому іншому, Синтія виявила, що більшість Ші їй не раді, оскільки вона є надзвичайно заможною іноземкою. Вона не могла просто поїхати, тому їй довелося витягти з цього максимум. Зважаючи на близькість її батька до Ло Пана, Синтія вирішила спробувати сили в Школі Журавля, оскільки вона була однією з небагатьох, відкритих для чужинців. \n\nАле Школа Журавля спочатку не прийняла її. Її показовий бій виявив брак підготовки. Її висміяли і вигнали із залу. Синтія не звикла отримувати відмову. Через деякий час вона вирішила спробувати ще раз, тільки цього разу вона домовилася, щоб її супротивнику попередньо дали легке заспокійливе. Ло Пан розкусив цей обман, але не розлютився. Хитрість і прагнення до перемоги? З неї вийде відмінний Журавель, як усі дізнаються в найближчі роки."

  SHI_LIU_NAME:0 "Лицар Лю"
  SHI_LIU_DESC:0 "§g"Цій землі потрібна дисципліна."§! \n\nЛю Юнь-цяо народився серед Ші і все життя виховувався у Відділенні Сан-Франциско. Його раннє життя було відзначене суворою структурою, яку забезпечувало Братство, що вплинуло на його погляд на хаотичні вулиці за межами бункера. Як і багато його братів, він дивився на бійки та сварки, які, здавалося, заохочували панівні школи Ші. Усі вони погоджувалися, що цьому треба покласти край. Бандитів треба приборкати, а в Сан-Франциско — навести порядок. \n\nБудучи майстром бойових мистецтв, Лицар Лю доведе своєму народові, що його сталеві кулаки можуть привести країну до кращого майбутнього, де Старійшина та Імператор зможуть керувати гармонійним суспільством."

  SHI_XIAN_NAME:0 "Доктор Шен"
  SHI_xian_idea_token_desc:0 "Доктор Шен — досвідчений дослідник на службі у Ші. Десятиліття тому вона була піонером у вивченні рослин, що поглинають радіацію. Звісно, була також та сумна творча відпустка, яку вона взяла, щоб спробувати зробити рослини розумними. З цього нічого не вийшло, і Шен не любить говорити чому. Але тепер вона повернулася, пропонуючи нашому уряду свій неортодоксальний досвід."

  SHI_ELDER_FRANCIS_NAME:0 "Старійшина Френсіс"
  SHI_steel_diplomat:0 "§gСталевий Дипломат§!"
  SHI_steel_chancellor:0 "§gСталевий Канцлер§!"
  SHI_ELDER_FRANCIS_DESC:0 "§g"Працюйте з ними. Наводьте мости."§! \n\nСтарійшина Френсіс — багаторічний лідер Відділення Сан-Франциско. Він один з небагатьох членів, які пережили чистку під проводом Френка Хоррігана та Анклаву багато років тому. У той час Кен Лі надав йому притулок у Сталевому Палаці. Можливо, Кен Лі лише прагнув розслідувати інцидент, який торкнувся його міста, але попри все ці двоє стали друзями. \n\nСпостерігаючи за тим, як Сан-Франциско спочатку прийняло НКР, а потім зіткнулося зі спалахом насильства між ворогуючими фракціями, Френсіс зрозумів, що Братство має унікальну можливість принести в регіон порядок і стабільність. Роблячи це, Ші можуть бути прив'язані до Лост-Хіллз, і в результаті обидві групи будуть процвітати. \n\nТепер, коли він досяг успіху, він задається питанням, чи не зможе він переконати Ші допомогти Лост-Хіллз у скрутну для них годину..."

  SHI_LAO_CHOU_NAME:0 "Лао Чоу"
  SHI_open_trader:0 "Відкритий Торговець"
  SHI_lao_chou_advisor_desc:0 "§g"У цьому місті мало що відбувається такого, про що б я не знав."§! \n\nЛао Чоу — власник крамниці "Летючий Дракон 8", яка отримала величезну вигоду і розширилася завдяки зростаючій торгівлі з НКР. Лао Чоу також виступає в ролі такого собі інформаційного брокера, який з радістю допомагає людям дізнатися про події в Сан-Франциско, навіть якщо ви — дикун, щойно з запорошеного шляху. Він не дискримінує тих, з ким веде справи."

  SHI_MAI_NAME:0 "Май Да-Цзян"
  SHI_arms_enthusiast:0 "Ентузіаст Зброї"
  SHI_mai_advisor_desc:0 "Власник магазину "Червоні Гармати 888", Май Да-Цзян усі ці роки розвивав вітчизняну збройову промисловість для Ші. Незважаючи на вік, його невпинне бажання забезпечувати людей смертоносною зброєю за доступною ціною не згасло. Він буде безперервно випускати зброю та засоби для її виготовлення."

  SHI_JING_NAME:0 "Цзін Тє-Ган"
  SHI_unpopular_chemist:0 "Непопулярний Хімік"
  SHI_jing_advisor_desc:0 "§g"Ви перериваєте важливу роботу. Будь ласка, йдіть. ЗАРАЗ."§! \n\nЛюдина з кепським характером, що, здається, вічно хмуриться, Доктор Цзін Тє-Ган — хімік, який створює сполуки та пристрої для Імператора і його радника Кена Лі. Колись він створив полімер, який, за його словами, міг витримати "масовані атаки". Будучи свого роду ентузіастом силової броні, Доктор Цзін також прагне допомогти в розробці власних бронетанкових військ Ші."

  SHI_WONG_NAME:0 "Вонг Ї-Цзи"
  SHI_research_director:0 "Директор з досліджень"
  SHI_wong_advisor_desc:0 "§g"Ми повинні захистити нашу честь."§! \n\nПривітний і веселий чоловік, Доктор Вонг Ї-Цзи наглядає за всіма експериментами у Сталевому Палаці та керує комп'ютерною мережею Ші. Він із тих людей, які можуть посміхатися, погрожуючи вас вбити, хоча він не розкидається такими погрозами. Він вірить, що таємниці Ші повинні зберігатися в безпеці, щоб вони не втратили все через чужинців. Він дуже зацікавлений у розвитку польотних можливостей Ші."

  SHI_KEN_LEE_NAME:0 "Кен Лі"
  SHI_voice_of_emperor:0 "Голос Імператора"
  SHI_ken_lee_advisor_desc:0 "§g"Я несу мудрість Імператора."§! \n\nОфіційно Кен Лі є радником Імператора Ші, захищаючи його від сторонніх очей і передаючи його волю народу Ші. \n\nМало кому відомо, що Імператор — це комп'ютер, а Кен Лі інтерпретує його розрахунки на благо Ші. Він згладжує його пропозиції знанням людської природи. \n\nТакий стан речей існував у Ші з незапам'ятних часів, але зростання слави та впливу Ло Пана в поєднанні з його зневажливим ставленням до минулого поставили під загрозу авторитет Кена Лі та Імператора. Кен Лі шукає підтримки у свого близького друга Старійшини Френсіса та Братства Сталі в ці часи невизначеності й насильства."

  SHI_GEN_ZHAO_NAME:0 "Генерал Чжао Куо"
  SHI_red_gold_tiger:0 "§RЧервоно§!-§YЗолотий§! Тигр"
  SHI_general_zhao_advisor_desc:0 "§g"Я вперше бачу цю 'красиву країну' і знаходжу її... недостатньою."§! \n\nЧжао Куо був генералом Народно-визвольної армії двісті років тому. Він отримав посаду завдяки непотизму та політиці, думаючи лише про те, як використати своє становище для збагачення себе та інших. Вогонь ядерної війни став для нього суворим випробуванням, коли колись недосвідчений і боягузливий чоловік раптом опинився в ролі польового командира посеред хаосу. Він виявився рішучішим і хитрішим лідером, ніж будь-хто міг очікувати, але при цьому не менш жорстоким і корисливим. \n\nБагато років потому він присягнув на вірність імператору Лаошу, побачивши мудрість у баченні Його Величності. Тепер, відправлений на землю, яка колись тероризувала його дім, він сумлінно виконує роль посла, водночас розвідуючи цю землю в пошуках будь-якої інформації, що становить цінність для його батьківщини."

  SHI_GUARD_GUI_NAME:0 "Гвардієць Гуй"
  shi_old_guard:0 "Стара Гвардія"
  SHI_guard_gui_advisor_desc:0 "§g"У цій державі я буду жити і помру!"§! \n\nГвардієць Гуй Го — старий ветеран Міської Гвардії Ші. Він захищав цю країну ще до того, як більшість інших навіть народилися. Він присягнувся померти, захищаючи стіни, і неодноразово відхиляв прохання піти у відставку через свій похилий вік. Принаймні, він все ще достатньо при здоровому глузді, щоб добре організовувати захисників, а його легенда надихає їх захищати свою спільноту."

  SHI_GUARD_LIANG_NAME:0 "Гвардієць Ган"
  shi_last_communist:0 "Останній Комуніст"
  SHI_guard_liang_advisor_desc:0 "§g"З дня на день відбудеться революція."§! \n\nГвардієць Ган Лян одержимий комунізмом, стародавньою ідеологією династії Мао. Він намагається згуртувати членів спільноти, щоб вони приєдналися до "революції" та допомогли здійснити великі зміни. Він робив це змалку, тому більшість Ші списали його з рахунків як нешкідливого блазня. Яким би дивним він не був, він принаймні добре виконує свою роботу, а його мужність є прикладом для багатьох."

  SHI_MERC_TAO_NAME:0 "Тао Кан"
  shi_vicious_killer:0 "Жорстокий Вбивця"
  SHI_mercenary_tao_advisor_desc:0 "§g"Я міг би вбити тебе своїм язиком."§! \n\nТао Кан — найманець з поганою репутацією. Він відомий тим, що береться за контракти на вбивство та всілякі інші брудні справи. Його найняли як інструктора для Гвардії Ші, щоб він передавав іншим свої знання про те, як найкраще вбити людину. Більшість солдатів вважають, що працювати з ним неймовірно некомфортно, але його методи ефективні."

  SHI_A_RON_MEYERS_NAME:0 "А. Рон Майерс"

  SHI_CHANG_HO_NAME:0 "Чан Хо"
  SHI_CHANG_HO_DESC:0 "§4"Тільки сила і засвоєні уроки можуть вивести світ на кращий шлях."§!\n\nКолись рибалка, Чан Хо зазнав гуліфікації понад тридцять років тому, коли вважав, що плавання до місця, де затонула Нафтова Вишка, принесе йому незліченні багатства. За його словами, справжні багатства були всередині — випробування під час повернення додому показали йому, як потрібно робити складний вибір, щоб вижити. Пов'язувати своє життя з чужинцями — це ризикувати бути викинутим за борт під час шторму. Акігахай розуміє ці вибори, а Ло Пан — ні."

  SHI_NORTON_NAME: "Король Нортон II"
  SHI_NORTON_DESC: "Хоча Нортон править землею, яка йому не належить, він все одно бажає їй процвітання. Телепортований сюди невідомими йому космічними силами, з ще більш невідомою метою. Він проживає кожен день так, ніби це завжди було його життям, тому що якщо він не досягне успіху, то в усієї пустки не залишиться жодної надії, а цього не можна допустити. Хоча це не та Америка, яку він знає, це все ще Америка, в якій він перебуває, і його обов'язок перед своїм народом — боротися із занепадом світу."

  SHI_XU_LUQI_NAME:0 "Сюй Луці"
  SHI_XU_LUQI_DESC:0 "§4"Коли все працює належним чином разом, це може вивести світ на кращий шлях."§! \n\nВипускниця Університету Послідовників у Могильнику, Луці повернулася до Сан-Франциско з наміром влаштуватися на роботу в місцевий караванний бізнес. Її спроби повернутися у форму закінчилися кількома несподіваними перемогами над школою Журавля. Як з'ясувалося, її особисті вивчення ближнього бою в поєднанні з формальним вивченням логістики стали блискучою комбінацією, яку Ло Пан не міг проігнорувати. Не те щоб її хвилювала боротьба за владу — Луці просто хоче, щоб Ші досягли успіху."

  SHI_KNIGHT_GOU_NAME:0 "Паладин Гоу"
  shi_paladin_instructor:0 "Інструктор-Паладин" 
  SHI_Knight_Gou_advisor_desc:0 "§4"З вашою допомогою ми можемо вивести світ на кращий шлях."§! \n\nГоу Да вірно служив Імператору і Френсісу одночасно протягом багатьох років. Коли він не тренує захисників Ші за давно втраченими доктринами, він збирає команди для допомоги у відновленні технологій з небезпек Пустки. Поєднання ідеології Ші та Братства Сталі настільки міцне, що можна лише гадати, що зможе його колись зламати — і якою є його справжня місія."
  SHI_KNIGHT_GOU_DESC:0 "§4"З вашою допомогою ми можемо вивести світ на кращий шлях."§! \n\nГоу Да вірно служив Імператору і Френсісу одночасно протягом багатьох років. Коли він не тренує захисників Ші за давно втраченими доктринами, він збирає команди для допомоги у відновленні технологій з небезпек Пустки. Поєднання ідеології Ші та Братства Сталі настільки міцне, що можна лише гадати, що зможе його колись зламати — і якою є його справжня місія."

  SHI_HUNG_WEI_LO_NAME:0 "Хун Вей Ло"
  SHI_HUNG_WEI_LO_DESC:0 "§0"Він ідіот. Ми спеціально навчили його неправильно, жарту заради."§!"

  SHI_NORTON_NAME:0 "Король Нортон II"
  SHI_NORTON_DESC:0 "Хоча Нортон править землею, яка йому не належить, він все одно бажає їй процвітання. Телепортований сюди невідомими йому космічними силами, з ще більш невідомою метою, він проживає кожен день так, ніби це завжди було його життям. Тому що якщо він не досягне успіху, то в усієї пустки не залишиться жодної надії, а цього не можна допустити. Хоча це не та Америка, яку він знає, це все ще Америка, в якій він перебуває, і його обов'язок перед своїм народом — боротися із занепадом світу."