  SHI_vine_category:0 "Розповсюдження Лози"
  SHI_spread_vine:0 "Розповсюдження Лози"
  SHI_spread_vine_desc:0 "Ми можемо розповсюдити нашу лозу, що поглинає радіацію, на цій землі, з усіма неминучими перевагами, які це принесе!"

  SHI_golden_tiger_category:0 "Щедрість Золотого Тигра"
  SHI_golden_tiger_category_desc:0 "Проявіть повагу до Імператора Лаошу, і щедрість Небес може осяяти ваше жалюгідне віддалене поселення."
  SHI_golden_tiger_guns:0 "Запросити зброю"
  SHI_golden_tiger_guns_desc:0 "Судно, навантажене даниною для Імператора Лаошу, вирушить до Чжунґо і повернеться з багатими запасами зброї для Його васала."
  SHI_golden_tiger_armor:0 "Запросити броню"
  SHI_golden_tiger_armor_desc:0 "Судно, навантажене даниною для Імператора Лаошу, вирушить до Чжунґо і повернеться з багатими запасами броні для Його васала."
  SHI_golden_tiger_soldiers:0 "Запросити солдатів"
  SHI_golden_tiger_soldiers_desc:0 "Судно, навантажене даниною для Імператора Лаошу, вирушить до Чжунґо і повернеться з міцними солдатами для Його васала."

  SHI_dragon_coalition_category:0 "Коаліція Дракона"
  SHI_give_kaga_arroyo:0 "Передати [SOK.GetNameWithFlag] Арройо"
  SHI_give_kaga_arroyo_desc:0 "Каґа має більше прав керувати Арройо, ніж ми. Подбаймо про те, щоб наш друг отримав свій законний спадок."