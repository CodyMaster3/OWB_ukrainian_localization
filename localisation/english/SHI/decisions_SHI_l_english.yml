  500_inf_50_pp_tooltip:0 "Прийняття цього рішення коштує $500_inf_50_pp_blocked$"

  100_mp_50_pp:0 "£manpower1_texticon §H100§! £pp_texticon §H50§!"
  100_mp_50_pp_blocked:0 "£manpower1_texticon §R100§! £pp_texticon §R50§!"
  100_mp_50_pp_tooltip:0 "Прийняття цього рішення коштує $100_mp_50_pp_blocked$"

  SHI_bos_decisions_category:0 "Взаємодія з Братством"
  SHI_bos_decisions_category_desc:0 "Наш обов'язок — підтримувати Братство Сталі."
  SHI_outreach_moj:0 "Політ близько до сонця (Мохаве)"
  SHI_outreach_moj_desc:0 "Старійшина Елайджа завжди був проблемним Старійшиною, але він і його солдати все ще є частиною Братства. Якщо ми можемо підтримати їх і перейняти їхній досвід, ми повинні це зробити."
  SHI_moj_dead_tt:0 "§gМи дізналися, що Відділення Мохаве продовжує жити, сховавшись у бункері Хідден-Веллі. Хоча ми небагато чим можемо їм допомогти, наші шпигуни можуть тихо проникнути в долину і надати ту допомогу, яку зможемо. Ми також повернемося зі знаннями про їхній досвід.§!"
  SHI_outreach_grd:0 "Брати Грімм (Вартові)"
  SHI_outreach_grd_desc:0 "Братство Вартових навряд чи можна назвати пов'язаним з нами. Дехто каже, що це не так, і в цьому є сенс. Але, на думку Френсіса, це ще одна причина спробувати повернути їх у сім'ю! \nВін відправляє туди писця Міллера, вірячи, що той наведе з ними мости. Можливо, він навіть повернеться з цікавими історіями."
  SHI_grd_dead_tt:0 "§gНа жаль, Вартові були знищені до того, як ми змогли налагодити зв'язки. Однак нам вдалося знайти і зв'язатися з деякими вцілілими; шановними 'Братами Грімм'. Відтепер вони служитимуть нашому Відділенню, приносячи з собою свій неймовірний досвід і дисципліну.§!"
  SHI_outreach_iso:0 "Вільні Ізотопи"
  SHI_outreach_iso_desc:0 "Давним-давно Старійшина Френсіс вигнав групу Братів після того, як вони стали гулями під час місії у Світінні. Ця група заснувала "Відділення Ізотопів", яке продовжує претендувати на спадщину Братства як на власну. Можливо, Старійшина шкодує про те, як усе склалося..."
  SHI_send_pa_bos:0 "Відправити китайську СБ до Лост-Хіллз"
  SHI_send_pa_bos_desc:0 "У них, можливо, і є кращі розробки під рукою, але їм знадобиться кожен костюм для майбутніх операцій."
  SHI_send_xian_fighters_bos:0 "Відправити винищувачі Сянь до Лост-Хіллз"
  SHI_send_xian_fighters_bos_desc:0 "Сянь-85 — це ще одна спадщина Ші, яку Лост-Хіллз напевно хотіли б вивчити. Тепер, коли ми нарешті випустили кілька власних літаків, Старійшина Френсіс впевнений, що ніхто не заперечуватиме проти того, щоб поділитися ними з Радою Старійшин."
  SHI_send_xian_cas_bos:0 "Відправити штурмовики Сянь до Лост-Хіллз"
  SHI_send_xian_cas_bos_desc:0 "Сянь-85 — це ще одна спадщина Ші, яку Лост-Хіллз напевно хотіли б вивчити. Тепер, коли ми нарешті випустили кілька власних літаків, Старійшина Френсіс впевнений, що ніхто не заперечуватиме проти того, щоб поділитися ними з Радою Старійшин."

