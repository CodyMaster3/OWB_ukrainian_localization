l_english:
# decisions
  SHI_infiltration_category:0 "Китайські диверсанти"
  SHI_infiltration_category_desc:0 "Наш народ походить з давнього роду шпигунів і вправних убивць. Таємні операції у нас в крові, і пустка зовсім не готова до нашої лютості."
  SHI_infiltration_focus:0 "Створити шпигунську мережу"
  SHI_mandate_over_california:0 "§tМандат над Каліфорнією§!"
  SHI_establish_mandate:0 "Встановити Мандат"
  SHI_dragon_call:0 "Покликати Дракона додому"
  SHI_ncr_wp_category:0 "Білий мир з НКР"
  SHI_ncr_wp_category_desc:0 "Ми робимо все можливе, щоб протистояти Ведмедю, але ми не можемо триматися вічно!\nМи повинні наполягати на мирі, щойно НКР почне виявляти ознаки виснаження!"
  SHI_wp_focus:0 "Зв'язатися з переговірниками НКР"
  SHI_bos_smuggling_category:0 "Стежка Ші"
  SHI_bos_smuggling_category_desc:0 "У нас є можливість провезти ресурси контрабандою на територію Ші!\nНаших зв'язків вистачить лише для гарантії однієї місії.\n\nЩо нам відправити?"
  SHI_bos_pa:0 "Відправити нашу броню"
  SHI_bos_lg:0 "Відправити другий найкращий подарунок..."
  SHI_bos_mp:0 "Відправити наш перевірений персонал"
  SHI_bos_cp:0 "Відправити... трохи кришок..."

  500_inf_50_pp:0 "£rifle_texticon §H500§! £pp_texticon §H50§!"
