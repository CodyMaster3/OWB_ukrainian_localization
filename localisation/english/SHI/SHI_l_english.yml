  shi_25_percent_core_cost_reduction_tt:0 "Отримайте постійне зниження вартості націоналізації на §G25%§!"
  shi_compliance_tt:0 "Усі національні землі §YТериторій Наварро§! мають покору понад §Y95%§!."

