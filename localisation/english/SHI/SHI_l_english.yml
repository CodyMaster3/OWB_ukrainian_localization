l_english:
#Initial Focuses
  shi_origin:0 "Подорож на Схід"
  shi_origin_desc:0 "Ші-Хуан-Ті був першим імператором Китаю і священним судном, що пронесло нас через Схід. Але Велика Війна не була милосердною — вітри й хвилі невблаганно лютували в повітрі, породжуючи лише хаос, — а потім, коли ми дісталися берега, все стихло. Імператор мав повстати з уламків."
  SHI_credits_tt:0 "§gВдячність TrickyVein, автору моду SanFran для Fallout: New Vegas, за дозвіл на використання скріншотів його моду в цьому проєкті.§!"

  shi_chosen_one:0 "Вигнанці пустельного краю"
  shi_chosen_one_desc:0 "На тлі навали некерованих бандитів з моря, ворогів і чвар, дикун з Арройо якось ощасливив наші землі. Його спадщина підтримується надихаючими розповідями, лімериками та піснями. Бажаєте послухати?"

  shi_dream_of_the_bear_chamber:0 "Сон у Ведмежій Палаті"
  shi_dream_of_the_bear_chamber_desc:0 "Після відходу Обраного одним із наших найбільших викликів стало те, що робити з НКР. Ведмідь стоїть на нашому порозі, будучи могутнім торговим партнером і другом. Але їхня експансія в Наварро та Реддінг означає, що ми — острів в океані. Якщо ми хочемо вижити, що нам робити?"

  #Akigahai Initial Focuses
  shi_dragon_school:0 "Вихід Дракона"
  shi_dragon_school_desc:0 "Можливо, Школа Дракона й втратила свою колишню славу, але Акіґахаї не дозволить забути про неї. Дракон навчив її стояти за народ, проявляти честь у бою та шукати мудрості в традиціях. Школа Дракона вирве своє законне місце в жорстокого та хитрого Журавля."

  shi_dragon_rallies:0 "Збір натовпу"
  shi_dragon_rallies_desc:0 "Рух Акіґахаї спирається на підтримку розгніваного народу. Ми маємо пробудити людей, підняти їх і вивести на вулиці. Нехай усі знають, що Ло Пан плює на все те, що зробило їх тими, ким вони є!"

  shi_dragon_soup_kitchens:0 "Пам'ятайте, що отримали, забудьте, що віддали"
  shi_dragon_soup_kitchens_desc:0 "Сан-Франциско зараз кишить людьми, забутими його «славним» новим порядком. Але Акіґахаї не забуде їх. Можливо, в неї немає нечесно нажитих багатств їхніх гнобителів, але її послідовники нададуть усю можливу допомогу. Нагадайте людям, що ми — спільнота і підтримуємо одне одного."

  shi_dragon_expel_barbarians:0 "Вигнати варварів?"
  shi_dragon_expel_barbarians_desc:0 "Ні для кого не секрет, що прихильники Школи Дракона не надто люблять чужинців, особливо ведмежат. Думки різняться від загального презирства до недоліків НКР до справжньої ненависті до її народу. Позиція Акіґахаї залишається неясною, але її послідовники іноді беруть справу у свої руки..."

  shi_dragon_underground_arms:0 "Чим ми займаємося в тіні"
  shi_dragon_underground_arms_desc:0 "В очікуванні повномасштабного конфлікту між фракціями деякі небайдужі громадяни починають збирати власну саморобну зброю. Це поганий знак для нашого суспільства, але що ще нам робити, коли наш спосіб життя в небезпеці?"

  shi_dragon_community:0 "Ділимо радості та біди"
  shi_dragon_community_desc:0 "Зусилля Акіґахаї принесли плоди. Навіть якщо можновладці не підтримують народ, народ підтримає себе сам. Навіть якщо завтра Акіґахаї буде повалена, спільнота, яку вона залишить по собі, вистоїть. \n\nПринаймні, вона сподівається, що до цього не дійде."

  #San Fran BoS Initial Focuses
  shi_steel_school:0 "Школа Сталі"
  shi_steel_school_desc:0 "Це не школа бойових мистецтв у розумінні Ші, проте Братство Сан-Франциско в народі називають саме так. Хоча вони зазнали трагічних втрат від рук Френка Горріґана, Старійшина Френсіс по крихтах зібрав їхній зруйнований орден. Вони є острівцем спокою у триваючому конфлікті між Драконом і Журавлем."

  shi_steel_emperor:0 "Шануйте Імператора"
  shi_steel_emperor_desc:0 "Протягом останніх десятиліть Ші все більше віддалялися від Імператора. Ми вживемо заходів, щоб нагадати людям, що їхній Імператор досі дбає та захищає; кілька указів про розподіл палацових ресурсів мають допомогти. А якщо люди побачать, що Братство сприяє цьому, така позитивна асоціація лише посилить обидві групи."

  shi_steel_guard:0 "Розширення палацової варти"
  shi_steel_guard_desc:0 "Зважаючи на насильство навколо, Імператору цілком може загрожувати пряма небезпека. Більш численна та вірніша палацова варта зробить нас безпечнішими і зміцнить позиції Кен Лі."

  shi_steel_research:0 "Наша технологічна спадщина"
  shi_steel_research_desc:0 "Ші здавна були піонерами наукових досліджень у цьому куточку Пустки. Наші дива, відроджені та новостворені, викликають заздрість у багатьох. \n\nБратство також є зберігачами технологій, працюючи над їх збереженням і захистом. Разом, можливо, ми започаткуємо нову еру наукової цивілізації?"

  shi_steel_armour:0 "Броньований кулак, броньована стійка"
  shi_steel_armour_desc:0 "На Територіях Наварро було знайдено схованку з бронею. Наші дослідники у захваті від можливості розібрати її та оптимізувати костюми для наших потреб. А наші бійці? Вони мріють про те, які техніки бойових мистецтв можна застосувати з цією бронею."

  shi_steel_generation:0 "Перше Сталеве Покоління"
  shi_steel_generation_desc:0 "Братство в Сан-Франциско не завжди було таким тісно пов'язаним зі спільнотою. Спочатку їх просто терпіли як купку аутсайдерів, що використовували свій крихітний бункер як аванпост. Але відколи до них приєдналися деякі місцеві жителі, виросло ціле покоління молоді, яка вважає себе одночасно і Ші, і частиною Братства. І якщо Старійшина Френсіс та Кен Лі мають вплив на це, воно буде лише першим із багатьох."

  #Lo Pan Initial Focuses
  shi_crane_school:0 "Різкий крик Журавля"
  shi_crane_school_desc:0 "Школа Журавля — це школа Ло Пана. Хоча Імператор править де-юре, Ло Пан керує Ші де-факто. Зрештою, на думку Ло Пана, сила породжує право. У нього є сила, отже, він має рацію. Він готовий навчати інших, щоб усі Ші могли стати сильними."

  shi_crane_show_culture:0 "Демонстрація наших виставок"
  shi_crane_show_culture_desc:0 "Іноземці вважають нашу культуру захоплюючою. Цілком логічно, що ми маємо її монетизувати. Влаштовувати шоу, розбивати дошки, додавати «мистецтво» в поняття майстра бойових мистецтв. Ми заробляємо гроші й демонструємо свою культурну та фізичну перевагу, хіба це не чудово? Можливо, якісь тупоголові традиціоналісти й бурчатимуть, але кого це хвилює?"

  shi_crane_movies:0 "Запускай кіно!"
  shi_crane_movies_desc:0 "Серед старих голозаписів можна знайти фільми про наше культурне минуле. Майстри бойових мистецтв на великому екрані, що б'ються з поганцями, беруть участь в епічних сюжетах. Ло Пан дійшов надзвичайно мудрого висновку, що Ші можуть очолити відродження цього виду мистецтва. У нього вже певний час у розробці є ідеальний фільм..."

  shi_crane_bear_friends:0 "Скажи «Привіт» моїм великим друзям"
  shi_crane_bear_friends_desc:0 "Учні Школи Журавля можуть бути найкращими у своїй справі, але щоб вгамувати натовп, який Акіґахаї налаштувала проти нас, нам знадобляться додаткові м'язи. На щастя, в НКР повно призовників-селюків, які можуть махати кулаками краще за недоїдаючого селянина, і вони з радістю допоможуть нам у підтриманні миру."

  shi_crane_crackdown:0 "Вбити одного, щоб попередити сотню"
  shi_crane_crackdown_desc:0 "У нас більш ніж достатньо підстав відправити наші різні збройні сили в бідніші райони та зібрати порушників спокою. Дрібні дракони Акіґахаї можуть скиглити й плакати, але в нас є сила, отже, в нас є право. Можливо, вони навіть будуть відбиватися, але Ло Пан не проти, якщо кільком з них проломлять голови."

  shi_crane_temple:0 "Відкриття Храму Ло Пана"
  shi_crane_temple_desc:0 "Вдалині лунає дзвін, сповіщаючи про кожну нову годину... \n\nЛо Пан ставить за мету виховати Ші настільки сильними, наскільки це можливо; стати царями царів. Храм для тренувань і передачі цих цінностей — це шлях до сили."

  #Shared Left Branch
  shi_street_fighter:0 "Жорстокі вулиці Сан-Франциско"
  shi_street_fighter_desc:0 "Сан-Франциско ніколи не був повністю вільним від насильства, особливо між майстрами кунг-фу. Але через розпалювання напруги між Журавлем і Драконом, вулиці стали небезпечнішими, ніж будь-коли, як для бійців, так і для перехожих."

  shi_street_diplomacy:0 "Будуємо мости"
  shi_street_diplomacy_desc:0 "Такий шлях обрав Старійшина Френсіс відтоді, як очолив Орден. Тепер у нього є криза, в якій він може зіграти роль миротворця і, можливо, підвищити престиж Братства. Якби міг, він би залучив до цього всіх, але здається, що обидві сторони відмовляються від примирення. Френсіс може бути змушений вибрати сторону, щоб заспокоїти ситуацію..."

  #Shared Right Branch
  shi_economic_survey:0 "Повторне розграбування Землі"
  shi_economic_survey_desc:0 "Особливо в такому старому й великому місті, як Сан-Франциско, залишаються місця, де можна пошукати залишки старого світу. Хоча поверхневі об'єкти вже вичищені, заповзятливі старателі іноді шукають «заховані скарби», так би мовити."

  shi_economic_bear:0 "Пазур Ведмедя"
  shi_economic_bear_desc:0 "НКР формувала суспільство Ші протягом кількох років. Для більшості з них бурхлива економічна активність принесла неймовірне зростання для Ші, але останнім часом ця економічна модель спричинила труднощі та напругу в обох наших країнах. Попри це, Ло Пан прагне поглибити зв'язки, оскільки очікує, що ця криза мине, коли його народ загартується."

  ##Navarro Victory Focuses
  shi_navarro_victory:0 "Плід Фусана"
  shi_navarro_victory_desc:0 "Дракон та його воїни перемогли підступну НКР! Їх змусили покинути територію, залишивши її в милостивих обіймах Імперії Ші!"
  SHI_navarro_outcome_flag:0 "§gПодія розблокує це після завершення конфлікту в Наварро на нашу користь§!"

  shi_exploit_navarro:0 "Для 10 років процвітання — сади дерева"
  shi_exploit_navarro_desc:0 "Тепер, коли ми повністю володіємо цією землею, ми повинні розвивати власну промисловість. Давайте використовувати ресурси з кордону для підняття власного народу, а не продавати їх НКР!"

  shi_reconcile_navarro:0 "Ділимося з друзями"
  shi_reconcile_navarro_desc:0 "Ло Пан вважає, що анексія цієї території була помилкою. НКР претендує на неї, і вони цілком можуть повернутися за нею. Але у нього є план: якщо ми покажемо їм, що тут можуть бути вигідні торговельні відносини, ми зможемо уникнути руйнівного конфлікту. І гей, ми зможемо заробити на цьому трохи грошей!"

  shi_navarro_base:0 "Повернення на базу"
  shi_navarro_base_desc:0 "Наварро, славний аванпост Анклаву на каліфорнійській землі. Братству було відмовлено в можливості заволодіти його таємницями, а Ші довелося задовольнятися витягуванням залишків вишки. \n\nХоча більшу частину його вмісту вже давно розграбовано, ми ще можемо знайти тут щось цікаве. Якщо не на видноті, то, можливо, у стінах..."

  shi_navarro_natives:0 "Перші люди"
  shi_navarro_natives_desc:0 "Ми точно не були першими, хто увійшов у цей регіон, як і НКР. Племена існували тут невідомо відколи, а тепер ми володіємо землею, на якій вони живуть."

  shi_navarro_farms:0 "Саджайте тутові дерева"
  shi_navarro_farms_desc:0 "Наш контроль над кордоном Наварро зміцнився настільки, що він все більше нагадує наші центральні землі. Хоча він, можливо, ніколи не зрівняється з пишністю Сан-Франциско, тутешні люди відгукнуться на поклик Ші!"

  ##Navarro Loss Focuses
  shi_navarro_loss:0 "Ми плакали, коли згадували Фусан"
  shi_navarro_loss_desc:0 "Наші хоробрі громадяни билися з усіх сил, але врешті-решт це було марно."

  shi_navarro_refugees:0 "Розселення біженців"
  shi_navarro_refugees_desc:0 "Ті, хто вижив у конфлікті, втратили свої домівки і тепер туляться в таборах та на кутках вулиць. Нам доведеться знайти для них місце, як би важко це не було."

  shi_navarro_insurgency:0 "Розпалювання вогню"
  shi_navarro_insurgency_desc:0 "Ми не забудемо образу, завдану нам у Фусані. Хоча наших людей і вигнали з регіону, там залишилися племена та розбійники, які могли б стати проблемою для окупантів Фусана, якщо ми підтримаємо їх у боротьбі."

  shi_navarro_reconquest:0 "Виправлення ситуації"
  shi_navarro_reconquest_desc:0 "Кордон Наварро — наш, повністю наш! Наші люди можуть повернутися до своїх домівок, а ті, хто позбавив їх цього, своєю чергою залишаться ні з чим!"

  shi_navarro_forget:0 "Прощати й забувати"
  shi_navarro_forget_desc:0 "Це трагедія, що сталася війна і загинули люди. Але хіба мир не краще для всіх? Безумовно, він краще для бізнесу."

  shi_navarro_purchase:0 "Маленький шматочок раю"
  shi_navarro_purchase_desc:0 "Зрештою, ми повернули під свій контроль наші старі поселення! Зробімо їх гарним маленьким стабільним кордоном для наших цілей."

  #Decision Point
  shi_resolve_power_struggle:0 "Найсильніший під Небесами"
  shi_resolve_power_struggle_desc:0 "Турнір з бойових мистецтв. Один із найбільших за останні роки, Ло Пан збирається провести його на своїй новозбудованій арені, створивши грандіозне видовище як для публіки Ші, так і для іноземних гостей. \n\nЗ огляду на те, що до цієї величної події прикуті погляди всіх, кожна фракція прагне виграти його для себе. Хоча перемога в турнірі нічого офіційно не означає, захоплена увага публіки буде зосереджена на переможці, а ганьба впаде на того, хто зазнає поразки."
  SHI_choice_point_tt:0 "§RЦей фокус визначить шлях, яким ви підете, залежно від популярності партії. Переконайтеся, що ви влаштували все так, як вам до вподоби!§!"

  #Akigahai Route
  shi_dragon_victory:0 "Рік Дракона"
  shi_dragon_victory_desc:0 "Школа Дракона здобула перемогу у великому турнірі! Хоча Акіґахаї ще не захопила владу офіційно, погляди обожнюючої публіки прикуті до неї та її учнів. Завдяки цьому імпульсу на нас можуть чекати великі зміни."
  SHI_dragon_enemies_leave_tt:0 "§gШкола Журавля, її союзники та лідери Братства більше не будуть нам доступні.§!"

  shi_dragon_shogun:0 "Правління знизу"
  shi_dragon_shogun_desc:0 "Акіґахаї не виступає проти Імперської інституції. Зрештою, Імператор цілком може бути найдавнішою традицією Ші. \nАле Акіґахаї тримає руку на пульсі громадськості. Вони такі розлючені й відчайдушно прагнуть змін, що було б прикро, якби вони виплеснули цей гнів на Сталевий Палац. Акіґахаї може їх заспокоїти, але спочатку Кен Лі, можливо, доведеться піти на поступки у деяких її питаннях."  

  shi_dragon_imperial_system:0 "Імперська бюрократія"
  shi_dragon_imperial_system_desc:0 "Через неформальний характер старого режиму Акіґахаї відчуває, що настав час заповнити прогалини. Кандидати будуть відбиратися Імператором для оптимальної роботи відповідно до наших потреб і відправлятимуться управляти від нашого імені."

  shi_dragon_accomodate_brothers:0 "Примирення з Братством"
  shi_dragon_accomodate_brothers_desc:0 "Акіґахаї не надто полюбляє Братство Сталі. Вони служать цілям, що виходять за межі інтересів Ші, і загравали з Імператором для просування власних планів. \n\nАле зараз вони також є чимось на кшталт інституції Ші. Люди не можуть пригадати часів, коли вони не діяли з куточка Сан-Франциско. Можливо, варто дозволити їм продовжувати свою діяльність за умови, що вони не виходитимуть за свої рамки."
  SHI_bos_return_tt:0 "§gЛицар Лю та Паладин Гоу повернуться до служби. \n\n§RБудьте обережні, ви втратите підтримку Братства, якщо будете битися з їхніми братніми організаціями!§!§!"

  shi_dragon_virtuous_candidates:0 "Кодифікація чесноти й честі"
  shi_dragon_virtuous_candidates_desc:0 "Недостатньо мати лояльних чи навіть компетентних людей на керівних посадах. Ні, ті, хто діє від імені Імператора, повинні сповідувати чесноти, які Акіґахаї бажає прищепити суспільству."

  shi_dragon_guided_nation:0 "Керування нацією"
  shi_dragon_guided_nation_desc:0 "Народ Ші все ще потребує керівництва та мудрості від своїх старших. Акіґахаї стане тією направляючою рукою, а Імператор надаватиме їй розуміння."

  shi_dragon_revolt:0 "Народ Ші повстає"
  shi_dragon_revolt_desc:0 "Наша нація більше не терпітиме образ і принижень. Народ підніметься разом з Акіґахаї й усуне від влади Імператора; того, хто стояв осторонь, дозволяючи Ло Пану корумпувати цю країну, і нічого не робив для своїх підданих! Варта відступить, бо вони не бажають влаштовувати різанину серед своїх братів в ім'я безликого монарха."
  SHI_int_stab_loss_tt:0 "§gВтрата стабільності базується на половині популярності §RІнтелектуалів§!, з базовим значенням -10%§!"

  shi_dragon_democracy:0 "Справжня Демократія Ші"
  shi_dragon_democracy_desc:0 "Звільнившись від кайданів безсердечного Імператора, Ші тепер залишилися без чіткої системи управління. Акіґахаї звернулася до того, чому вона довіряє найбільше: до їхнього минулого, розказаного вцілілими та зібраними текстами. \nДемократію часто називають найкращим способом надати людям право голосу, але Акіґахаї побоюється наслідувати корумповані шляхи Нової Каліфорнії. Замість цього вона знайшла кращі ідеї в традиціях Ші, як завжди."

  shi_dragon_land_reform:0 "Право на землю"
  shi_dragon_land_reform_desc:0 "Проблема, що турбувала суспільства протягом всієї історії. Наша стародавня батьківщина боролася з тими, хто накопичував землі, так само як і зараз новокаліфорнійці. Жодне суспільство не може поважати свій народ, якщо звичайна людина не може навіть володіти клаптиком країни. Ми навряд чи можемо очікувати, що скасуємо століття вкоріненої жадібності, але ми повинні зробити щось, щоб зрівняти ситуацію."

  shi_dragon_new_branches:0 "Конституція п'яти гілок влади"
  shi_dragon_new_branches_desc:0 "Лаоваї прийняли систему поділу влади на три гілки, але в наших предків їх було п'ять: дві додаткові відповідали за нагляд над урядом і державними службовцями. Враховуючи шалену корупцію в Новій Каліфорнії, нам вкрай потрібні ідеї, які допоможуть уникнути тих самих пасток."

  shi_dragon_people_principles:0 "Дотримання загальної волі"
  shi_dragon_people_principles_desc:0 "Школа Дракона здавна була захисником народу. Ми завжди будемо прагнути прислухатися до його голосу і нести його в майбутнє."

  shi_dragon_kill_lopan:0 "Вдарте Журавля"
  shi_dragon_kill_lopan_desc:0 "Тепер, коли Акіґахаї утвердилася як лідер Ші, вона нарешті має можливість виправити те, що пішло не так багато років тому. \n\nЛо Пан — паразит. Роки тому він скористався майстерністю Обраного, а відтоді використовував НКР як соломинку, щоб висмоктувати соки з Ші. Він цілком заслуговує на те пекло, яке ми для нього приготували."
  SHI_elites_stab_loss_tt:0 "§gВтрата стабільності базується на половині популярності §0Еліт§!, з базовим значенням -10%§!"

  shi_dragon_spare_lopan:0 "Смерть від тисячі порізів"
  shi_dragon_spare_lopan_desc:0 "Тепер, коли Акіґахаї утвердилася як лідер Ші, вона нарешті має можливість виправити те, що пішло не так багато років тому. \n\nЛо Пан — паразит. Роки тому він скористався майстерністю Обраного, а відтоді використовував НКР як соломинку, щоб висмоктувати соки з Ші. Але нам необов'язково вбивати його прямо зараз. Таке зіткнення може спричинити великий розкол у суспільстві Ші. Ні, давайте забезпечимо Ло Пану довгу, повільну смерть. Нехай він помре забутим."

#Initial Focuses
  shi_origin:0 "Подорож на Схід"
  shi_origin_desc:0 "Ші-Хуан-Ті був першим імператором Китаю і священним судном, що пронесло нас через Схід. Але Велика Війна не була милосердною — вітри й хвилі невблаганно лютували в повітрі, породжуючи лише хаос, — а потім, коли ми дісталися берега, все стихло. Імператор мав повстати з уламків."
  SHI_credits_tt:0 "§gВдячність TrickyVein, автору моду SanFran для Fallout: New Vegas, за дозвіл на використання скріншотів його моду в цьому проєкті.§!"

  shi_chosen_one:0 "Вигнанці пустельного краю"
  shi_chosen_one_desc:0 "На тлі навали некерованих бандитів з моря, ворогів і чвар, дикун з Арройо якось ощасливив наші землі. Його спадщина підтримується надихаючими розповідями, лімериками та піснями. Бажаєте послухати?"

  shi_dream_of_the_bear_chamber:0 "Сон у Ведмежій Палаті"
  shi_dream_of_the_bear_chamber_desc:0 "Після відходу Обраного одним із наших найбільших викликів стало те, що робити з НКР. Ведмідь стоїть на нашому порозі, будучи могутнім торговим партнером і другом. Але їхня експансія в Наварро та Реддінг означає, що ми — острів в океані. Якщо ми хочемо вижити, що нам робити?"

  #Akigahai Initial Focuses
  shi_dragon_school:0 "Вихід Дракона"
  shi_dragon_school_desc:0 "Можливо, Школа Дракона й втратила свою колишню славу, але Акіґахаї не дозволить забути про неї. Дракон навчив її стояти за народ, проявляти честь у бою та шукати мудрості в традиціях. Школа Дракона вирве своє законне місце в жорстокого та хитрого Журавля."

  shi_dragon_rallies:0 "Збір натовпу"
  shi_dragon_rallies_desc:0 "Рух Акіґахаї спирається на підтримку розгніваного народу. Ми маємо пробудити людей, підняти їх і вивести на вулиці. Нехай усі знають, що Ло Пан плює на все те, що зробило їх тими, ким вони є!"

  shi_dragon_soup_kitchens:0 "Пам'ятайте, що отримали, забудьте, що віддали"
  shi_dragon_soup_kitchens_desc:0 "Сан-Франциско зараз кишить людьми, забутими його «славним» новим порядком. Але Акіґахаї не забуде їх. Можливо, в неї немає нечесно нажитих багатств їхніх гнобителів, але її послідовники нададуть усю можливу допомогу. Нагадайте людям, що ми — спільнота і підтримуємо одне одного."

  shi_dragon_expel_barbarians:0 "Вигнати варварів?"
  shi_dragon_expel_barbarians_desc:0 "Ні для кого не секрет, що прихильники Школи Дракона не надто люблять чужинців, особливо ведмежат. Думки різняться від загального презирства до недоліків НКР до справжньої ненависті до її народу. Позиція Акіґахаї залишається неясною, але її послідовники іноді беруть справу у свої руки..."

  shi_dragon_underground_arms:0 "Чим ми займаємося в тіні"
  shi_dragon_underground_arms_desc:0 "В очікуванні повномасштабного конфлікту між фракціями деякі небайдужі громадяни починають збирати власну саморобну зброю. Це поганий знак для нашого суспільства, але що ще нам робити, коли наш спосіб життя в небезпеці?"

  shi_dragon_community:0 "Ділимо радості та біди"
  shi_dragon_community_desc:0 "Зусилля Акіґахаї принесли плоди. Навіть якщо можновладці не підтримують народ, народ підтримає себе сам. Навіть якщо завтра Акіґахаї буде повалена, спільнота, яку вона залишить по собі, вистоїть. \n\nПринаймні, вона сподівається, що до цього не дійде."

  #San Fran BoS Initial Focuses
  shi_steel_school:0 "Школа Сталі"
  shi_steel_school_desc:0 "Це не школа бойових мистецтв у розумінні Ші, проте Братство Сан-Франциско в народі називають саме так. Хоча вони зазнали трагічних втрат від рук Френка Горріґана, Старійшина Френсіс по крихтах зібрав їхній зруйнований орден. Вони є острівцем спокою у триваючому конфлікті між Драконом і Журавлем."

  shi_steel_emperor:0 "Шануйте Імператора"
  shi_steel_emperor_desc:0 "Протягом останніх десятиліть Ші все більше віддалялися від Імператора. Ми вживемо заходів, щоб нагадати людям, що їхній Імператор досі дбає та захищає; кілька указів про розподіл палацових ресурсів мають допомогти. А якщо люди побачать, що Братство сприяє цьому, така позитивна асоціація лише посилить обидві групи."

  shi_steel_guard:0 "Розширення палацової варти"
  shi_steel_guard_desc:0 "Зважаючи на насильство навколо, Імператору цілком може загрожувати пряма небезпека. Більш численна та вірніша палацова варта зробить нас безпечнішими і зміцнить позиції Кен Лі."

  shi_steel_research:0 "Наша технологічна спадщина"
  shi_steel_research_desc:0 "Ші здавна були піонерами наукових досліджень у цьому куточку Пустки. Наші дива, відроджені та новостворені, викликають заздрість у багатьох. \n\nБратство також є зберігачами технологій, працюючи над їх збереженням і захистом. Разом, можливо, ми започаткуємо нову еру наукової цивілізації?"

  shi_steel_armour:0 "Броньований кулак, броньована стійка"
  shi_steel_armour_desc:0 "На Територіях Наварро було знайдено схованку з бронею. Наші дослідники у захваті від можливості розібрати її та оптимізувати костюми для наших потреб. А наші бійці? Вони мріють про те, які техніки бойових мистецтв можна застосувати з цією бронею."

  shi_steel_generation:0 "Перше Сталеве Покоління"
  shi_steel_generation_desc:0 "Братство в Сан-Франциско не завжди було таким тісно пов'язаним зі спільнотою. Спочатку їх просто терпіли як купку аутсайдерів, що використовували свій крихітний бункер як аванпост. Але відколи до них приєдналися деякі місцеві жителі, виросло ціле покоління молоді, яка вважає себе одночасно і Ші, і частиною Братства. І якщо Старійшина Френсіс та Кен Лі мають вплив на це, воно буде лише першим із багатьох."

  #Lo Pan Initial Focuses
  shi_crane_school:0 "Різкий крик Журавля"
  shi_crane_school_desc:0 "Школа Журавля — це школа Ло Пана. Хоча Імператор править де-юре, Ло Пан керує Ші де-факто. Зрештою, на думку Ло Пана, сила породжує право. У нього є сила, отже, він має рацію. Він готовий навчати інших, щоб усі Ші могли стати сильними."

  shi_crane_show_culture:0 "Демонстрація наших виставок"
  shi_crane_show_culture_desc:0 "Іноземці вважають нашу культуру захоплюючою. Цілком логічно, що ми маємо її монетизувати. Влаштовувати шоу, розбивати дошки, додавати «мистецтво» в поняття майстра бойових мистецтв. Ми заробляємо гроші й демонструємо свою культурну та фізичну перевагу, хіба це не чудово? Можливо, якісь тупоголові традиціоналісти й бурчатимуть, але кого це хвилює?"

  shi_crane_movies:0 "Запускай кіно!"
  shi_crane_movies_desc:0 "Серед старих голозаписів можна знайти фільми про наше культурне минуле. Майстри бойових мистецтв на великому екрані, що б'ються з поганцями, беруть участь в епічних сюжетах. Ло Пан дійшов надзвичайно мудрого висновку, що Ші можуть очолити відродження цього виду мистецтва. У нього вже певний час у розробці є ідеальний фільм..."

  shi_crane_bear_friends:0 "Скажи «Привіт» моїм великим друзям"
  shi_crane_bear_friends_desc:0 "Учні Школи Журавля можуть бути найкращими у своїй справі, але щоб вгамувати натовп, який Акіґахаї налаштувала проти нас, нам знадобляться додаткові м'язи. На щастя, в НКР повно призовників-селюків, які можуть махати кулаками краще за недоїдаючого селянина, і вони з радістю допоможуть нам у підтриманні миру."

  shi_crane_crackdown:0 "Вбити одного, щоб попередити сотню"
  shi_crane_crackdown_desc:0 "У нас більш ніж достатньо підстав відправити наші різні збройні сили в бідніші райони та зібрати порушників спокою. Дрібні дракони Акіґахаї можуть скиглити й плакати, але в нас є сила, отже, в нас є право. Можливо, вони навіть будуть відбиватися, але Ло Пан не проти, якщо кільком з них проломлять голови."

  shi_crane_temple:0 "Відкриття Храму Ло Пана"
  shi_crane_temple_desc:0 "Вдалині лунає дзвін, сповіщаючи про кожну нову годину... \n\nЛо Пан ставить за мету виховати Ші настільки сильними, наскільки це можливо; стати царями царів. Храм для тренувань і передачі цих цінностей — це шлях до сили."

  #Shared Left Branch
  shi_street_fighter:0 "Жорстокі вулиці Сан-Франциско"
  shi_street_fighter_desc:0 "Сан-Франциско ніколи не був повністю вільним від насильства, особливо між майстрами кунг-фу. Але через розпалювання напруги між Журавлем і Драконом, вулиці стали небезпечнішими, ніж будь-коли, як для бійців, так і для перехожих."

  shi_street_diplomacy:0 "Будуємо мости"
  shi_street_diplomacy_desc:0 "Такий шлях обрав Старійшина Френсіс відтоді, як очолив Орден. Тепер у нього є криза, в якій він може зіграти роль миротворця і, можливо, підвищити престиж Братства. Якби міг, він би залучив до цього всіх, але здається, що обидві сторони відмовляються від примирення. Френсіс може бути змушений вибрати сторону, щоб заспокоїти ситуацію..."

  #Shared Right Branch
  shi_economic_survey:0 "Повторне розграбування Землі"
  shi_economic_survey_desc:0 "Особливо в такому старому й великому місті, як Сан-Франциско, залишаються місця, де можна пошукати залишки старого світу. Хоча поверхневі об'єкти вже вичищені, заповзятливі старателі іноді шукають «заховані скарби», так би мовити."

  shi_economic_bear:0 "Пазур Ведмедя"
  shi_economic_bear_desc:0 "НКР формувала суспільство Ші протягом кількох років. Для більшості з них бурхлива економічна активність принесла неймовірне зростання для Ші, але останнім часом ця економічна модель спричинила труднощі та напругу в обох наших країнах. Попри це, Ло Пан прагне поглибити зв'язки, оскільки очікує, що ця криза мине, коли його народ загартується."

  ##Navarro Victory Focuses
  shi_navarro_victory:0 "Плід Фусана"
  shi_navarro_victory_desc:0 "Дракон та його воїни перемогли підступну НКР! Їх змусили покинути територію, залишивши її в милостивих обіймах Імперії Ші!"
  SHI_navarro_outcome_flag:0 "§gПодія розблокує це після завершення конфлікту в Наварро на нашу користь§!"

  shi_exploit_navarro:0 "Для 10 років процвітання — сади дерева"
  shi_exploit_navarro_desc:0 "Тепер, коли ми повністю володіємо цією землею, ми повинні розвивати власну промисловість. Давайте використовувати ресурси з кордону для підняття власного народу, а не продавати їх НКР!"

  shi_reconcile_navarro:0 "Ділимося з друзями"
  shi_reconcile_navarro_desc:0 "Ло Пан вважає, що анексія цієї території була помилкою. НКР претендує на неї, і вони цілком можуть повернутися за нею. Але у нього є план: якщо ми покажемо їм, що тут можуть бути вигідні торговельні відносини, ми зможемо уникнути руйнівного конфлікту. І гей, ми зможемо заробити на цьому трохи грошей!"

  shi_navarro_base:0 "Повернення на базу"
  shi_navarro_base_desc:0 "Наварро, славний аванпост Анклаву на каліфорнійській землі. Братству було відмовлено в можливості заволодіти його таємницями, а Ші довелося задовольнятися витягуванням залишків вишки. \n\nХоча більшу частину його вмісту вже давно розграбовано, ми ще можемо знайти тут щось цікаве. Якщо не на видноті, то, можливо, у стінах..."

  shi_navarro_natives:0 "Перші люди"
  shi_navarro_natives_desc:0 "Ми точно не були першими, хто увійшов у цей регіон, як і НКР. Племена існували тут невідомо відколи, а тепер ми володіємо землею, на якій вони живуть."

  shi_navarro_farms:0 "Саджайте тутові дерева"
  shi_navarro_farms_desc:0 "Наш контроль над кордоном Наварро зміцнився настільки, що він все більше нагадує наші центральні землі. Хоча він, можливо, ніколи не зрівняється з пишністю Сан-Франциско, тутешні люди відгукнуться на поклик Ші!"

  ##Navarro Loss Focuses
  shi_navarro_loss:0 "Ми плакали, коли згадували Фусан"
  shi_navarro_loss_desc:0 "Наші хоробрі громадяни билися з усіх сил, але врешті-решт це було марно."

  shi_navarro_refugees:0 "Розселення біженців"
  shi_navarro_refugees_desc:0 "Ті, хто вижив у конфлікті, втратили свої домівки і тепер туляться в таборах та на кутках вулиць. Нам доведеться знайти для них місце, як би важко це не було."

  shi_navarro_insurgency:0 "Розпалювання вогню"
  shi_navarro_insurgency_desc:0 "Ми не забудемо образу, завдану нам у Фусані. Хоча наших людей і вигнали з регіону, там залишилися племена та розбійники, які могли б стати проблемою для окупантів Фусана, якщо ми підтримаємо їх у боротьбі."

  shi_navarro_reconquest:0 "Виправлення ситуації"
  shi_navarro_reconquest_desc:0 "Кордон Наварро — наш, повністю наш! Наші люди можуть повернутися до своїх домівок, а ті, хто позбавив їх цього, своєю чергою залишаться ні з чим!"

  shi_navarro_forget:0 "Прощати й забувати"
  shi_navarro_forget_desc:0 "Це трагедія, що сталася війна і загинули люди. Але хіба мир не краще для всіх? Безумовно, він краще для бізнесу."

  shi_navarro_purchase:0 "Маленький шматочок раю"
  shi_navarro_purchase_desc:0 "Зрештою, ми повернули під свій контроль наші старі поселення! Зробімо їх гарним маленьким стабільним кордоном для наших цілей."

  #Decision Point
  shi_resolve_power_struggle:0 "Найсильніший під Небесами"
  shi_resolve_power_struggle_desc:0 "Турнір з бойових мистецтв. Один із найбільших за останні роки, Ло Пан збирається провести його на своїй новозбудованій арені, створивши грандіозне видовище як для публіки Ші, так і для іноземних гостей. \n\nЗ огляду на те, що до цієї величної події прикуті погляди всіх, кожна фракція прагне виграти його для себе. Хоча перемога в турнірі нічого офіційно не означає, захоплена увага публіки буде зосереджена на переможці, а ганьба впаде на того, хто зазнає поразки."
  SHI_choice_point_tt:0 "§RЦей фокус визначить шлях, яким ви підете, залежно від популярності партії. Переконайтеся, що ви влаштували все так, як вам до вподоби!§!"

  #Akigahai Route
  shi_dragon_victory:0 "Рік Дракона"
  shi_dragon_victory_desc:0 "Школа Дракона здобула перемогу у великому турнірі! Хоча Акіґахаї ще не захопила владу офіційно, погляди обожнюючої публіки прикуті до неї та її учнів. Завдяки цьому імпульсу на нас можуть чекати великі зміни."
  SHI_dragon_enemies_leave_tt:0 "§gШкола Журавля, її союзники та лідери Братства більше не будуть нам доступні.§!"

  shi_dragon_shogun:0 "Правління знизу"
  shi_dragon_shogun_desc:0 "Акіґахаї не виступає проти Імперської інституції. Зрештою, Імператор цілком може бути найдавнішою традицією Ші. \nАле Акіґахаї тримає руку на пульсі громадськості. Вони такі розлючені й відчайдушно прагнуть змін, що було б прикро, якби вони виплеснули цей гнів на Сталевий Палац. Акіґахаї може їх заспокоїти, але спочатку Кен Лі, можливо, доведеться піти на поступки у деяких її питаннях."  

  shi_dragon_imperial_system:0 "Імперська бюрократія"
  shi_dragon_imperial_system_desc:0 "Через неформальний характер старого режиму Акіґахаї відчуває, що настав час заповнити прогалини. Кандидати будуть відбиратися Імператором для оптимальної роботи відповідно до наших потреб і відправлятимуться управляти від нашого імені."

  shi_dragon_accomodate_brothers:0 "Примирення з Братством"
  shi_dragon_accomodate_brothers_desc:0 "Акіґахаї не надто полюбляє Братство Сталі. Вони служать цілям, що виходять за межі інтересів Ші, і загравали з Імператором для просування власних планів. \n\nАле зараз вони також є чимось на кшталт інституції Ші. Люди не можуть пригадати часів, коли вони не діяли з куточка Сан-Франциско. Можливо, варто дозволити їм продовжувати свою діяльність за умови, що вони не виходитимуть за свої рамки."
  SHI_bos_return_tt:0 "§gЛицар Лю та Паладин Гоу повернуться до служби. \n\n§RБудьте обережні, ви втратите підтримку Братства, якщо будете битися з їхніми братніми організаціями!§!§!"

  shi_dragon_virtuous_candidates:0 "Кодифікація чесноти й честі"
  shi_dragon_virtuous_candidates_desc:0 "Недостатньо мати лояльних чи навіть компетентних людей на керівних посадах. Ні, ті, хто діє від імені Імператора, повинні сповідувати чесноти, які Акіґахаї бажає прищепити суспільству."

  shi_dragon_guided_nation:0 "Керування нацією"
  shi_dragon_guided_nation_desc:0 "Народ Ші все ще потребує керівництва та мудрості від своїх старших. Акіґахаї стане тією направляючою рукою, а Імператор надаватиме їй розуміння."

  shi_dragon_revolt:0 "Народ Ші повстає"
  shi_dragon_revolt_desc:0 "Наша нація більше не терпітиме образ і принижень. Народ підніметься разом з Акіґахаї й усуне від влади Імператора; того, хто стояв осторонь, дозволяючи Ло Пану корумпувати цю країну, і нічого не робив для своїх підданих! Варта відступить, бо вони не бажають влаштовувати різанину серед своїх братів в ім'я безликого монарха."
  SHI_int_stab_loss_tt:0 "§gВтрата стабільності базується на половині популярності §RІнтелектуалів§!, з базовим значенням -10%§!"

  shi_dragon_democracy:0 "Справжня Демократія Ші"
  shi_dragon_democracy_desc:0 "Звільнившись від кайданів безсердечного Імператора, Ші тепер залишилися без чіткої системи управління. Акіґахаї звернулася до того, чому вона довіряє найбільше: до їхнього минулого, розказаного вцілілими та зібраними текстами. \nДемократію часто називають найкращим способом надати людям право голосу, але Акіґахаї побоюється наслідувати корумповані шляхи Нової Каліфорнії. Замість цього вона знайшла кращі ідеї в традиціях Ші, як завжди."

  shi_dragon_land_reform:0 "Право на землю"
  shi_dragon_land_reform_desc:0 "Проблема, що турбувала суспільства протягом всієї історії. Наша стародавня батьківщина боролася з тими, хто накопичував землі, так само як і зараз новокаліфорнійці. Жодне суспільство не може поважати свій народ, якщо звичайна людина не може навіть володіти клаптиком країни. Ми навряд чи можемо очікувати, що скасуємо століття вкоріненої жадібності, але ми повинні зробити щось, щоб зрівняти ситуацію."

  shi_dragon_new_branches:0 "Конституція п'яти гілок влади"
  shi_dragon_new_branches_desc:0 "Лаоваї прийняли систему поділу влади на три гілки, але в наших предків їх було п'ять: дві додаткові відповідали за нагляд над урядом і державними службовцями. Враховуючи шалену корупцію в Новій Каліфорнії, нам вкрай потрібні ідеї, які допоможуть уникнути тих самих пасток."

  shi_dragon_people_principles:0 "Дотримання загальної волі"
  shi_dragon_people_principles_desc:0 "Школа Дракона здавна була захисником народу. Ми завжди будемо прагнути прислухатися до його голосу і нести його в майбутнє."

  shi_dragon_kill_lopan:0 "Вдарте Журавля"
  shi_dragon_kill_lopan_desc:0 "Тепер, коли Акіґахаї утвердилася як лідер Ші, вона нарешті має можливість виправити те, що пішло не так багато років тому. \n\nЛо Пан — паразит. Роки тому він скористався майстерністю Обраного, а відтоді використовував НКР як соломинку, щоб висмоктувати соки з Ші. Він цілком заслуговує на те пекло, яке ми для нього приготували."
  SHI_elites_stab_loss_tt:0 "§gВтрата стабільності базується на половині популярності §0Еліт§!, з базовим значенням -10%§!"

  shi_dragon_spare_lopan:0 "Смерть від тисячі порізів"
  shi_dragon_spare_lopan_desc:0 "Тепер, коли Акіґахаї утвердилася як лідер Ші, вона нарешті має можливість виправити те, що пішло не так багато років тому. \n\nЛо Пан — паразит. Роки тому він скористався майстерністю Обраного, а відтоді використовував НКР як соломинку, щоб висмоктувати соки з Ші. Але нам необов'язково вбивати його прямо зараз. Таке зіткнення може спричинити великий розкол у суспільстві Ші. Ні, давайте забезпечимо Ло Пану довгу, повільну смерть. Нехай він помре забутим."

shi_steel_joint_training:0 "Спільні військові навчання"
  shi_steel_joint_training_desc:0 "Ніщо так не зблизить Варту Ші та Братство, як тренування на одних полігонах і проживання в одних казармах."

  #Imperial Path
  shi_steel_imperial_rule:0 "Імперія Ші"
  shi_steel_imperial_rule_desc:0 "Імператор провів свої розрахунки і виявив, що повна прив'язка до Братства призведе до катастрофи. Зрештою, це все ще держава Ші, а не придаток Братства. Кен Лі багато чим зобов'язаний Старійшині Френсісу, і Орден залишатиметься привілейованою інституцією, доки він живий, але він не може дозволити, щоб піддані Імператора наражалися на небезпеку заради Братства."

  #Become BoS Path
  shi_steel_bosification:0 "Злиття Сталі"
  shi_steel_bosification_desc:0 "Імператор дійшов цікавого висновку. Хоча багато хто сумнівається в довговічності Братства після їхнього відступу у війні, Імператор, здається, переконаний, що їм судилося повернутися, посилаючись на потенціал відділень далеко від Каліфорнії. У такому разі Ші було б вигідно тісніше зв'язати себе з ними. Хоча це навряд чи буде популярним рішенням, зрештою, для них воно може стати найкращим."

  shi_steel_bos_clarification:0 "Роз'яснення домовленостей"
  shi_steel_bos_clarification_desc:0 "Існує певна невизначеність щодо того, що щойно сталося. Дехто думає, що Братство повністю захопило державу Ші, ніби Паладини прийшли розпустити всі їхні інституції. Старійшина Френсіс хоче, щоб люди знали: це категорично не так! Братство не має наміру безпосередньо керувати Ші. Все, що вони робитимуть, — це здійснювати загальний нагляд за існуючим урядом. Більшість місцевих законів і звичаїв будуть дотримуватися, ви просто бачитимете менше лазерних гвинтівок у руках людей, які не є персоналом Братства."

  shi_bos_bunkers:0 "Система бункерування"
  shi_bos_bunkers_desc:0 "На нашій новій юрисдикції ми будуватимемо бункери, як це робило б будь-яке інше Братство. Вони слугуватимуть локальними пунктами контролю за різними регіонами, які ми знаходимо і знаходитимемо під нашим наглядом."

  shi_bos_guard_restrictions:0 "Обмеження місцевих ополчень"
  shi_bos_guard_restrictions_desc:0 "На жаль, ми не можемо дозволити, щоб місцеві сили підконтрольних нам спільнот ставали надто великими. Було б трохи безглуздо, якби ми дозволили їм вирости настільки, щоб перевершити нас, чи не так? Тому нам доведеться запровадити для них певні обмеження. Але не хвилюйтеся! Для тих, хто шукає військової кар'єри, найкращі завжди можуть приєднатися до Братства Сталі!"

  shi_steel_double_hatting:0 "Брати на двох посадах"
  shi_steel_double_hatting_desc:0 "Старійшина Френсіс тепер обіймає дві посади: Старійшини Братства Сталі та Канцлера Імперії Ші. Хоча Рада Старійшин висловила занепокоєння щодо його потенційно розділеної лояльності, він запевняє їх, що подвійна відповідальність означає, що він зможе краще служити Братству. Їм вкрай потрібен такий політичний вплив у наші дні."

  shi_steel_bos_tech_purchase:0 "Ініціатива із закупівлі технологій"
  shi_steel_bos_tech_purchase_desc:0 "Ми всі знали, що це станеться: Братству необхідно контролювати небезпечні технології на підконтрольній їм території. Ші не стануть винятком. Однак Старійшина Френсіс не хоче псувати ці робочі відносини грубим вилученням технологій. Замість цього він використає ресурси Сталевого Палацу для компенсації тим, хто володіє цікавими для нас технологіями."

  shi_steel_seize_factories:0 "Закупівля засобів виробництва"
  shi_steel_seize_factories_desc:0 "У такому розвиненому суспільстві, як Ші, є ті, хто має можливості переобладнувати та обслуговувати передову зброю. Ми не можемо дозволити, щоб це відбувалося без нагляду Братства. Відповідно до політики Френсіса, ми компенсуємо їм втрату бізнесу, але майстерні БУДУТЬ нашими, без жодних «якщо» чи «але»."

  shi_steel_imperial_monopoly:0 "Спиратися на імперські монополії"
  shi_steel_imperial_monopoly_desc:0 "Історично склалося так, що Сталевий Палац залишав за собою право монополізувати певні ресурси, знайдені в межах наших кордонів. Оскільки ресурси Сталевого Палацу тепер фактично наші, ми можемо підкріпити наші зусилля цими джерелами доходу."

  shi_steel_navy_expeditions:0 "Пошуки в глибокому синьому морі"
  shi_steel_navy_expeditions_desc:0 "Ми цілком можемо бути першим Відділенням Братства, яке контролює значну військово-морську присутність. З такими можливостями у нашому розпорядженні ми й не зчуємося, як почнемо здобувати технології за межами Америки! Але почати можна з кількох незручних місць, куди доведеться діставатися гвинтокрилом чи чимось подібним..."

  shi_steel_approach_ncr:0 "Прояснення політики щодо Ведмедя"
  shi_steel_approach_ncr_desc:0 "Неминуче, що нам доведеться звернути увагу на Ведмедя в кімнаті. Оскільки Ші тепер тісно пов'язані з Братством, ми цілком можемо стати їхніми ворогами раніше, ніж думаємо. Незважаючи на це, Старійшина Френсіс не має наміру робити сміливі кроки без попередньої консультації з Радою Старійшин..."
  SHI_lost_hills_chooses_tt:0 "§g[BOS.GetNameWithFlag] вибере, яким шляхом ви підете, але ваш вибір у події §Y«Особисте бажання»§! вплине на те, що ШІ Лост-Гіллз обере те, що ви хочете! \n\nВ основному це зроблено для того, щоб дати гравцю за Лост-Гіллз можливість впливати на дії Братства Сан-Франциско, водночас дозволяючи вам вибирати те, що ви хочете, коли граєте за них.§!"

  shi_steel_ncr_war:0 "Війна на горизонті"
  shi_steel_ncr_war_desc:0 "Перемир'я приречене стати лише коротким спогадом. Війна з НКР відновиться, питання лише в тому, коли."

  shi_steel_share_intel:0 "Об'єднання розвідувальних мереж"
  shi_steel_share_intel_desc:0 "Об'єднавши розвідувальну мережу Ші з Лост-Гіллз, ми зможемо ефективніше стежити за діями НКР і ділитимемося з нашими братами всім, що зможемо дізнатися."

  shi_steel_war_prop:0 "Агітація за війну"
  shi_steel_war_prop_desc:0 "Ші насправді не хочуть цієї війни. Хто б захотів нападати на свого сусіда і, спірного, але друга, заради нового дивного господаря? Але ми можемо придумати багато причин, чому їм було б вигідно виступити проти НКР. Це сколихне внутрішню арену, але ми переконаємо їх у праведності нашої справи. Ніхто не в безпеці від імперіалізму Нової Каліфорнії!"

  shi_steel_ncr_peace:0 "Назустріч остаточному миру"
  shi_steel_ncr_peace_desc:0 "Рада Старійшин не бажає повертатися до війни. Хоча питання ще може вирішитися не на їхню користь, вони прагнуть миру і закликають нас не робити ворожих кроків."

  shi_steel_ncr_embassy:0 "Неофіційні посольства"
  shi_steel_ncr_embassy_desc:0 "Хоча відносини між НКР і Братством залишаються напружеми, або, можливо, технічно вони все ще перебувають у стані відкритої війни, Ші підтримують дипломатичні зв'язки ще з часів до нашої нової домовленості. Завдяки цим дипломатичним зв'язкам ми можемо вести діалог з НКР і сприяти більшому миру."

  shi_steel_help_ncr:0 "Проти справжнього ворога"
  shi_steel_help_ncr_desc:0 "Ми не маємо жодного бажання воювати за НКР, але цей «Легіон» стане нашим ворогом, якщо прийде на наш поріг. Замість того, щоб чекати й тремтіти, як вівці, Френсіс об'єднає зусилля зі своїм старим ворогом, щоб дати відсіч справжній загрозі. Він відчуває, що Оллґуду Мерфі можна довіряти і що він не скористається їхньою підтримкою у своїх інтересах."

  shi_steel_escalate_war:0 "Війна-продовження"
  shi_steel_escalate_war_desc:0 "Перемир'я добігло кінця. Нова Каліфорнія знову воює з Братством. Ми повинні об'єднатися з Лост-Гіллз і битися до кінця! Ad Victoriam!"

  shi_steel_remain_chapter:0 "Наші звичні обов'язки"
  shi_steel_remain_chapter_desc:0 "НКР переможено, а ми залишаємося відповідальними за свою територію. Допоможімо Раді Старійшин оцінити ситуацію."

  shi_steel_garrison_ncr:0 "Підтримка окупації"
  shi_steel_garrison_ncr_desc:0 "Рада Старійшин має колосальне завдання — утримати Каліфорнію. Із солдатами, які є в нашому розпорядженні, ми могли б дозволити собі відправити частину на підтримку окупаційних зусиль."

  shi_steel_become_bos:0 "Новий режим"
  shi_steel_become_bos_desc:0 "Після поразки НКР Рада Старійшин запропонувала Старійшині Френсісу посаду Верховного Старійшини. Френсіс вирішив поширити унікальний досвід Відділення Сан-Франциско на всю Пустку."
  SHI_integrate_chapters_tt:0 "§gМи розблокуємо рішення для запрошення інших фракцій Братства до нашого альянсу (у розділі «Зв'язки Братства»)§!"

  shi_steel_sanfran_model:0 "Експорт моделі Сан-Франциско"
  shi_steel_sanfran_model_desc:0 "Народ Нової Каліфорнії боїться приходу солдатів Братства, але ми вже довели, як Братство може правити справедливо і чесно. Нехай вони зрозуміють на прикладі Ші, що боятися нічого."

  shi_steel_new_orders:0 "Видання нових правил"
  shi_steel_new_orders_desc:0 "Персонал Братства по всій Пустці використовує різні підходи до виконання нашої основної місії. Дехто вдається до тривожних практик. За часів Френсіса це зміниться. Зрештою, на мед зловиш більше мух, ніж на оцет.\nВін не може гарантувати, що всі наші підлеглі почнуть негайно дотримуватися цих правил, але це може стати першим кроком у більших культурних змінах."

  shi_steel_reorg_lost_hills:0 "Переорієнтація бункера"
  shi_steel_reorg_lost_hills_desc:0 "Лост-Гіллз має безліч систем підтримки для служіння справі Братства. Досі Рада Старійшин керувала ними на власний розсуд, але, можливо, у Френсіса є власні ідеї..."

  shi_steel_world_conquest:0 "Новий світанок для Братства"
  shi_steel_world_conquest_desc:0 "Старійшина Френсіс поведе переосмислене Братство Сталі до остаточного тріумфу! У горнилі Ші його новий шлях довів свою справедливість, тепер йому потрібно лише принести мир людству!"
  SHI_skip_brotherhood_states_tt:0 "§gБуде виключено регіони, що належать фракціям Братства.§!"

  shi_steel_deepen_econ:0 "Економічна нитка"
  shi_steel_deepen_econ_desc:0 "Чим глибші економічні зв'язки між Ші та НКР, тим сильніше вдарить по них напад на нас. Тому ми повинні заохочувати поглиблення зв'язків, щоб відрадити їх від втягування в руйнівні конфлікти. Зрештою, це піде на користь нам обом."

  shi_steel_bos_bridges:0 "Побудова сталевих мостів"
  shi_steel_bos_bridges_desc:0 "Технічно кажучи, дипломатичні контакти та підтримка відділень повинні бути в компетенції Ради Старійшин у цілому. Але Старійшина Френсіс вірить у прояв ініціативи та створення належної бази підтримки для Братства."
  SHI_unlock_outreach_decisions_tt:0 "§gМи розблокуємо рішення для встановлення зв'язків із сусідніми групами Братства або суміжними з ним та їхньої підтримки (у розділі «Зв'язки Братства»)§!"

  shi_steel_support_lost_hills:0 "Виконуючи свій обов'язок"
  shi_steel_support_lost_hills_desc:0 "Як частина Братства Сталі, ми зобов'язані підтримувати Раду Старійшин. Ми обмежені в тому, скільки можемо їм дати, щоб не викликати підозр, але Ші є майстрами обачності."
  SHI_unlock_support_decisions_tt:0 "§gМи розблокуємо рішення для надсилання матеріальної підтримки до Лост-Гіллз (у розділі «Зв'язки Братства»)§!"

  #Lo Pan Route
  shi_crane_victory:0 "Другий політ Журавля"
  shi_crane_victory_desc:0 "Три десятиліття тому Школа Журавля довела, що є найсильнішою, і ось вона знову здобула перемогу! Ставши беззаперечним улюбленцем народу вдруге в історії, Ло Пан може нарешті взяти кермо влади над Ші у свої руки, спираючись як на право, так і на силу."
  SHI_crane_enemies_leave_tt:0 "§gШкола Дракона, їхні союзники та лідери Братства більше не будуть нам доступні.§!"

  shi_crane_palace_coup:0 "Палацовий переворот"
  shi_crane_palace_coup_desc:0 "Ло Пан терпів Імператора весь цей час, ніколи не маючи достатньої впевненості, щоб усунути свою останню справжню перешкоду на шляху до абсолютної влади. Але тепер люди співають Ло Пану дифірамби по всьому Сан-Франциско. Поки п'яні гуляння наповнюють ніч, загін висококваліфікованих найманців спускається на Сталевий Палац разом із низкою соратників Школи Журавля..."

  shi_crane_kill_brotherhood:0 "Очищення Бункера"
  shi_crane_kill_brotherhood_desc:0 "Братству було дозволено залишитися за часів Імператора. Тепер, коли Імператор більше нічого не означає, його захист не зможе їх врятувати. Крім того, що стосується наших великих друзів-Ведмедів, вони всі терористи, чи не так?"

  shi_crane_raid_caches:0 "Очищення схованок"
  shi_crane_raid_caches_desc:0 "Братство мало кілька місць по всьому місту, де вони зберігали свої так звані знахідки, плануючи відправити їх до Лост-Гіллз чи ще кудись. Вони сподівалися зберегти це в таємниці, але в цьому місті від Ло Пана нічого не приховати. Особливо коли він підкуповує слабку ланку, щоб та розказувала йому про такі речі."

  shi_crane_kill_dragon:0 "Вбивство Дракона"
  shi_crane_kill_dragon_desc:0 "Школа Дракона повинна була вимерти ще десятиліття тому. Лише втручання цієї божевільної фанатички Акіґахаї підтримувало її життя. Але тепер, коли Ло Пан захопив державний апарат, нарешті настав час змусити їх замовкнути раз і назавжди."
  SHI_people_stab_loss_tt:0 "§gВтрата стабільності базується на половині популярності §BНароду§!, з базовим значенням -10%§!"

  shi_crane_raid_undeground:0 "Підпільні рейди"
  shi_crane_raid_undeground_desc:0 "Школа Дракона мала ще кілька підпільних союзників. На перший погляд усі вони були дуже стурбованими громадянами, але на їхньому боці також були скажені головорізи, які нападали на мандрівників, торговців і туристів з НКР. Розгін цих маленьких ганг

shi_crane_gun_runners:0 "Офіційний контракт зі Зброярами"
  shi_crane_gun_runners_desc:0 "Ми й раніше мали з ними багато справ, але досі між нами не було жодних офіційних домовленостей. Контракт на розробку та розширення виробництва зброї між нами принесе міць усій Каліфорнії."

  shi_crane_presidential_meeting:0 "Від одного лідера іншому"
  shi_crane_presidential_meeting_desc:0 "Настав час Ло Пену сісти за стіл переговорів із Президентом і показати світу, що ці два титани цивілізації стоять пліч-о-пліч проти жахів Пусток."

  shi_crane_big_circle:0 "Розширення Великого Кола"
  shi_crane_big_circle_desc:0 "Через незручну географію та тривалий ізоляціонізм Сан-Франциско в минулому так і не стало частиною Великого Кола. Настав час це змінити; кілька торгових барж допоможуть переправляти людей з північних маршрутів до міста."

  shi_crane_new_reno:0 "Маленький Чайнатаун у Найбільшому Маленькому Місті"
  shi_crane_new_reno_desc:0 "Ло Пен захоплюється Нью-Ріно. Звісно, воно може бути брудним і жалюгідним, але це місце, де сильний чоловік може піднятися на саму вершину. Місце, де жорстокість винагороджується, а не відкидається. Це саме та енергія, якої потребує цей світ, а не моралізаторське заламування рук."

  shi_crane_reno_prizefight:0 "Великий турнір Ріно"
  shi_crane_reno_prizefight_desc:0 "Бої за винагороду — це перевірена часом традиція Нью-Ріно. Зазвичай це бокс, але Ло Пен впевнений, що зможе переконати їх трохи урізноманітнити їхні бойові мистецтва. Великий турнір буде вигідним для нас обох!"

  shi_crane_vlt:0 "На кожній вечірці є зануда"
  shi_crane_vlt_desc:0 "Купка замкнутих, впертих дуп з комплексом вищості. Місто Сховища дуже нагадує Ло Пену Школу Дракона з її традиціоналістським галасом. Тим не менш, вони входять у клуб Великого Кола і більш-менш дружні до НКР. Можливо, ми зможемо відправити наших яйцеголових повчитися у них, тоді як Ло Пен переконається, що НЕ зустрінеться з їхніми тупоголовими лідерами."

  shi_crane_foreign_intervention:0 "Військові авантюри"
  shi_crane_foreign_intervention_desc:0 "Ми маємо армію, що формується, але не так багато фронтів, де її можна було б застосувати. А в НКР є! Хоча ми не будемо брати на себе великих зобов'язань поза великою війною, можна провести кілька експедицій заради тренувань, випробувань та тестування зброї."

  shi_crane_mot:0 "Мохавські добровольці"
  shi_crane_mot_desc:0 "НКР встряла у невелику халепу в пустелі Мохаве. Їхні хлопці не дуже добре справляються у боротьбі з цим мерзенним Легіоном. Дехто з наших може вирушити туди і допомогти їм. Ми покажемо всьому Мохаве силу Ші!"

  shi_crane_ncr_navy:0 "Морські споглядання"
  shi_crane_ncr_navy_desc:0 "У нас є солідний флот і багато верфей. Флот НКР більший, але їхні дослідження обмежені. Разом ми зможемо вчитися, розширювати наші можливості та ставати кращими!"

  #Lo Pan Alternate Branch
  shi_crane_ncr_crisis:0 "Каліфорнійська криза"
  shi_crane_ncr_crisis_desc:0 "Ло Пен завжди уявляв, як стоїть пліч-о-пліч з Братом Ведмедем і разом досягає славетного нового майбутнього. Ця можливість вже змарнована."

  shi_crane_ally_civil_war:0 "Ставка на коня"
  shi_crane_ally_civil_war_desc:0 "Поки Нова Каліфорнія палає, ми можемо знайти собі союзника, на якого можна покластися, щоб навести лад у хаосі."

  shi_crane_soldier_exchange:0 "Завітайте до навчального табору Ші!"
  shi_crane_soldier_exchange_desc:0 "Громадянська війна вимагає багато чого від цивільних. Їх закликають до конфлікту, в якому вони інакше б не брали участі. Тут, на нашій «нейтральній» землі, зелені солдати можуть повчитися у наших інструкторів, а ми можемо перейняти каліфорнійські методи."

  shi_crane_air_exchange:0 "Позичаючи блакитне небо"
  shi_crane_air_exchange_desc:0 "Нашим партнерам не завадила б повітряна підтримка в їхній боротьбі. Наші пілоти могли б чомусь навчитися завдяки цій можливості."

  shi_crane_back_moore:0 "Я люблю жінок у формі"
  shi_crane_back_moore_desc:0 "Колишня «Полковник» Мур обіцяє зміцнити Нову Каліфорнію військовою міццю. Разом ми зможемо побачити сильніший та стабільніший Каліфорнійський регіон."

  shi_crane_moore_blank_cheque:0 "Виписуючи одне одному бланкові чеки"
  shi_crane_moore_blank_cheque_desc:0 "Досі завжди існувала межа, яку не можна було перетнути у стосунках із Республікою. Хоч яка корумпована, вона мала стандарти та очікування, громадськість, яка б здригнулася від чогось занадто «неправильного». Цей час минув. Сильний чоловік очолює Ші, а сильна жінка очолює НКР. Ми знаємо, що треба зробити, тож давайте зробимо це."

  shi_crane_moore_monitoring:0 "Прикриваючи спини одне одного"
  shi_crane_moore_monitoring_desc:0 "У ці хаотичні часи з'являється все більше і більше мерзенних людців, які просто хочуть ще глибше затягнути нас у безлад. В наших найкращих інтересах співпрацювати з нашими союзниками, щоб цих людей знайшли і розібралися з ними заради колективної безпеки наших держав."

  shi_crane_moore_victory:0 "Каліфорнія знову сильна"
  shi_crane_moore_victory_desc:0 "Кассандра Мур об'єднала Нову Каліфорнію під своїм прапором, і ми стоїмо поруч із нею як друг і союзник."

  shi_crane_back_redding:0 "Нічого особистого, просто бізнес"
  shi_crane_back_redding_desc:0 "Антон Флінн готовий нажитися на хаосі в Новій Каліфорнії. Ми теж можемо, і разом наші прибутки можуть зрости до небес."

  shi_crane_redding_opportunity:0 "Нові патронажні мережі"
  shi_crane_redding_opportunity_desc:0 "У хаосі є можливості, і оскільки в НКР було зруйновано так багато зручних домовленостей, тепер ми маємо нагоду стати частиною нової павутини прибутків, яка слугуватиме нам і Реддінгу."

  shi_crane_redding_contracts:0 "Перехоплення контрактів"
  shi_crane_redding_contracts_desc:0 "Багато підприємств опинилися без можливостей як тут, так і в районі Реддінга. Завдяки нашим затишним відносинам, ми можемо організувати нові можливості для обох сторін. Можливо, це не ідеально для бізнесменів, але це принесе нам прибуток."

  shi_crane_flynn_victory:0 "Не бажаєте станцювати як справжній чоловік?"
  shi_crane_flynn_victory_desc:0 "Антон Флінн об'єднав Нову Каліфорнію і скинув кайдани минулих претензій. Разом ми досягнемо великих звершень!"

  shi_crane_conquer_california:0 "Використання нагоди"
  shi_crane_conquer_california_desc:0 "Настав час зробити Нову Каліфорнію нашою власною!"

  shi_crane_control_boneyard:0 "Злам Могильника"
  shi_crane_control_boneyard_desc:0 "Послідовники завжди були великою купою незручностей. З їхніми перешкодами більше не можна миритися. Їхнім ресурсам знайдуть краще застосування ті, хто має силу волі використовувати їх належним чином."

  shi_crane_ranger_gear:0 "Рейди на схованки Рейнджерів"
  shi_crane_ranger_gear_desc:0 "У хаосі конфлікту значна частина спорядження Рейнджерів фактично стає вільною здобиччю. Ми знайдемо йому краще застосування, ніж вони."

  shi_crane_control_redding:0 "Новий покровитель"
  shi_crane_control_redding_desc:0 "Брамінні Барони НКР дбали про себе, але здебільшого гуртувалися навколо тих, хто, на їхню думку, допоміг би їм допомогти самим собі. Зламавши тих, до кого вони могли б злетітися, Ло Пен надасть їм сильного лідера, щоб захистити їхні законні претензії."

  shi_crane_restart_caravans:0 "Відродження торгівлі"
  shi_crane_restart_caravans_desc:0 "Цей жахливий конфлікт порушив торговельні артерії Каліфорнії. Доклавши трохи зусиль і витримки, ми зможемо знову змусити цю економічну машину працювати."

  shi_crane_control_shady:0 "Захоплення наративу"
  shi_crane_control_shady_desc:0 "Тепер ми контролюємо столицю НКР. Ми повинні дати цим людям зрозуміти, що наше завоювання було в їхніх інтересах. Ло Пен забезпечить їм тверду керівну руку, і подивіться на його друзів! Хіба вони не є новими каліфорнійцями? Якщо подумати, нічого насправді не змінилося."

  shi_crane_legion_scare:0 "Червона загроза"
  shi_crane_legion_scare_desc:0 "За Колорадо стоїть маса ґвалтівників і вбивць. Як ви можете витрачати свої життя на протистояння Ло Пену, коли вам погрожують такі люди? Об'єднаймо зусилля проти справжнього ворога!"

  shi_crane_incorporate_osi:0 "Інкорпорація УНІ"
  shi_crane_incorporate_osi_desc:0 "Хочете робити справи? Процвітати в науковому середовищі без повчальних невдах? Ші робили справи протягом століть. Приєднуйтесь до нас, застосуйте знання для РЕАЛЬНОЇ роботи."

  shi_crane_democratic_legitimacy:0 "Заява на республіканську легітимність"
  shi_crane_democratic_legitimacy_desc:0 "Ми заснували наш новий уряд на основі уряду Республіки Нова Каліфорнія. Інші, хто претендує на урядування, є анархістами-хіпі та військовими диктаторами. Ми дійсно єдині, хто пропонує народу Каліфорнії демократію, яку вони знають і люблять!"

  shi_crane_incorporate_militarists:0 "Залучення мілітаристів"
  shi_crane_incorporate_militarists_desc:0 "Хоча багато хто уникав би нас як іноземних окупантів, у Новій Каліфорнії є ті, хто прагнув слідувати за сильнішим лідером, ніж зніжена Республіка минулих днів. Ло Пен може стати цим сильним лідером."

  shi_crane_unstoppable_ambition:0 "Амбіції Ло Пена неможливо зупинити"
  shi_crane_unstoppable_ambition_desc:0 "Нова Каліфорнія була лише початком. Ло Пен не відчував себе таким живим вже кілька десятиліть. Що скажете, якщо ми піднімемо наш прапор над Флагстаффом? Відправимо гвинтокрили аж до Вашингтона? Уся Пустка процвітатиме під ЙОГО правлінням!"

  ##Expansion Branch
  shi_expand_eureka:0 "Розслідування в Евриці"
  shi_expand_eureka_desc:0 "Хоча раніше ми мали певне уявлення про цей порт найманців, у нас були набагато нагальніші питання для розслідування, перш ніж просуватися ближче. Наші шпигуни мали можливість провести глибше розслідування і підтвердили жахливу правду: хабологи тепер діють із порту Еврики! \n\nТакож ходять чутки про залишки Анклаву, які було б добре нейтралізувати разом із мерзенними викрадачами та вбивцями, якими є хабологи."

  shi_eur_kill_hubologists:0 "Колесо тортур"
  shi_eur_kill_hubologists_desc:0 "У типовій манері хабологи викрадали якомога більше багатств у місцевих жителів, ховаючи їх для своїх настільки ж мерзенних і ідіотських планів. Вони краще послужать нам. \nЩо стосується Річарда Голдмана та його нової групи лідерів хабологів, у Сан-Франциско є люди, які пам'ятають, як їхній огидний маленький культ викрадав і промивав мізки їхнім дітям. §RМи підготували для них відповідний прийом.§!"

  shi_eur_granite_stuff:0 "Копаючись у трупі Анклаву"
  shi_eur_granite_stuff_desc:0 "Виявилося, що деякі з цих найманців з Еврики насправді були нащадками персоналу Анклаву. Вони також успадкували обладнання, хоча їм і не вистачало можливостей підтримувати його в належному стані. На щастя, ми більш ніж готові відремонтувати дещо з цього, і воно їм більше не знадобиться."

  shi_approach_arroyo:0 "Подорож до Арройо"
  shi_approach_arroyo_desc:0 "Обраний здійснив формуючий вплив на Ші всі ті роки тому. Ми б не були там, де ми є сьогодні, без їхнього втручання."
  SHI_aki_hates_arr_tt:0 "§RАкігахай пам'ятає обличчя лиходія, який прийшов і кинув Ші в десятиліття темряви. Маріонетка Ло Пена пошкодує про той день, коли уклала пакт зі злом!§!"
  SHI_bos_likes_arr_tt:0 "§gБратство пам'ятає допомогу Обраного. Можливо, настав час для офіційного визнання цієї допомоги?§!"
  SHI_lo_pan_likes_arr_tt:0 "§gЛо Пен з теплом згадує допомогу свого кумедного маленького протеже. Він збирається провідати свого старого приятеля!§!"
  shi_arroryo_relations:0 "Дружба Ші та Арройо"
  SHI_arroyo_dead_tt:0 "§gОскільки Арройо захоплено чужинцями, ми самі візьмемо цю територію під контроль!§!"

  shi_temple_of_trials:0 "Навіщо ще один Храм?"
  shi_temple_of_trials_desc:0 "В Арройо заснували храм, присвячений випробуванню характеру майбутніх лідерів. Ми могли б перепрофілювати його як тренувальний майданчик для бойових мистецтв і дозволити нашим лідерам самим вчитися в ньому."

  shi_kill_chosen_one:0 "Мрія довжиною в десятиліття"
  shi_kill_chosen_one_desc:0 "Минуло понад тридцять років з того часу, як Акігахай дивилася, як Обраний перемагає її улюбленого наставника. Стільки днів, навіть років, вона мріяла розбити їм обличчя, як тому мерзенному створінню, яке вона запам'ятала. Тепер ця нікчема нарешті в її руках, і все ж..."

  shi_arroyo_trade:0 "Розширення північної торгівлі"
  shi_arroyo_trade_desc:0 "Маючи надійного партнера в особі Арройо, ми можемо розглянути можливість розширення судноплавних операцій на північ. Зі співпрацею наших двох флотів, наша мрія про тихоокеанську торгівлю стане ближчою, ніж будь-коли."

  shi_arroyo_think_tank:0 "Створення спільного Мозкового Центру"
  shi_arroyo_think_tank_desc:0 "Разом з Арройо ми представляємо найбільшу наукову базу на західному узбережжі. Якщо ми об'єднаємо наші ресурси, ми зможемо піти ще далі!"

  ##Military Branch

  shi_military:0 "Військо Ші?"
  shi_military_desc:0 "Протягом століть у Ші не було регулярної армії. Гвардія підтримує мир і захищає наші кордони, але не обов'язково є військовою організацією. Ми отримували вигоду від співпраці з Братством і найманцями, а також від неформального залучення майстрів бойових мистецтв. Але часи змінюються, і на горизонті маячать військові конфлікти. Можливо, нам слід організувати наші сили належним чином?"

  shi_army_arsenal:0 "Розширення арсеналу Гвардії"
  shi_army_arsenal_desc:0 "Досі Гвардія зберігала скромний арсенал. Трохи інвестувавши, ми могли б створити такий, що засоромить наших сусідів."

  shi_army_better_weapons:0 "Елітна зброя для елітного народу"
  shi_army_better_weapons_desc:0 "Ми — Ші. У нас є як технології, так і ноу-хау для підтримки кращого класу озброєння, ніж більшість колекцій з глинобитних халуп Пустки."

  shi_army_gauss_weapons:0 "Майбутнє зброї?"
  shi_army_gauss_weapons_desc:0 "У нас є кілька одиниць зброї Гаусса, які зазвичай зарезервовані для оборони палацу. Часи змінюються, і нам варто використовувати і вивчати їх. Ми поки не можемо обіцяти цілу армію зі зброєю Гаусса, але подивимося, яку інформацію зможемо зібрати."

  shi_army_infiltrators:0 "Мовчазна армія"
  shi_army_infiltrators_desc:0 "Ші завжди уважно стежили за своїм оточенням. Наші сусіди, наші піддані, будь-хто і будь-що, за чим потрібно було стежити, було під наглядом наших шпигунів. Так склалося, що наші шпигуни — добре навчені бійці, не гірші за Рейнджерів чи Лицарів."

  shi_army_infiltrator_armour:0 "Броня Ночі"
  shi_army_infiltrator_armour_desc:0 "Наші предки створювали покриви, у яких вони були невидимими для неозброєного ока. Давайте врятуємо все, що можна знайти на цій землі, і, можливо, розшифруємо способи їх відтворення."

  shi_army_stealth_boys:0 "Переадаптація технології Стелс-боїв"
  shi_army_stealth_boys_desc:0 "Ця технологія і так базується на технологіях наших предків. Буде цікаво подивитися, як ми зможемо використати це так, як Лаовай використав те, що було до нас."

  shi_army_doctrine:0 "Прийняття офіційної доктрини"
  shi_army_doctrine_desc:0 "Ми не можемо покладатися лише на чисту технологічну перевагу. Подивіться, до чого це призвело Братство, а в них все ще була формалізована військова доктрина."

  shi_army_mercenaries:0 "Знання найманців"
  shi_army_mercenaries_desc:0 "У минулому ми використовували найманців для підтримки наших сил. Ми не можемо дозволити собі покладатися на них, як в плані грошей, так і в плані вірності, але найм їх як допоміжних сил та інструкторів міг би бути корисним."

  shi_army_air_power:0 "Аеродинамічний прогрес"
  shi_army_air_power_desc:0 "Колись ми сподівалися налагодити масове виробництво цілої армади гвинтокрилів, але з цього нічого не вийшло. На щастя, наші інші дослідження аеродинамічних конструкцій нарешті принесли плоди після всього цього часу."

  shi_army_expert_weapons:0 "Спеціалізоване екіпірування спеціалістів"
  shi_army_expert_weapons_desc:0 "Існує багато обладнання, яке, хоча й непрактичне для широкого військового використання, може бути неймовірно потужним, якщо його роздати нашим елітним спецпідрозділам. Уявіть, який хаос може влаштувати оперативник під прикриттям зі смертоносним арсеналом?"

  shi_army_academy:0 "Формалізація Академії"
  shi_army_academy_desc:0 "З усіма цими розмовами про встановлення доктрин і викладання уроків, настав час подбати про те, щоб це передавалося майбутнім поколінням через навчальну програму. Майбутні офіцери навчатимуться військовій справі так само добре, як ми навчаємо наших учених."

  shi_army_soph_spec:0 "Наша спадщина здобута"
  shi_army_soph_spec_desc:0 "Знову Мейго боятиметься прихованої армії. Непомітних сталкерів, які можуть вбивати без сліду."

  shi_army_vertibirds:0 "Креслення гвинтокрилів"
  shi_army_vertibirds_desc:0 "Нарешті, з часом і доступом до Наварро, ми отримаємо флот, про який завжди мріяли! Викуси, Ведмежа Ескадрильє!"

  #Other Californian Military Branches (Lo Pan and Francis)
  shi_military_formal:0 "Навчання в чужинців"
  shi_military_formal_desc:0 "Інші в Каліфорнії створили армії, які процвітали і перемагали в Пустці. Якщо ми хочемо зрівнятися з їхньою славою, нам варто наслідувати їхні приклади."

  shi_formal_bos:0 "Натхнення у сталі"
  shi_formal_bos_desc:0 "Братство, можливо, і зазнало значної поразки від НКР, але їхні тактичні та стратегічні ноу-хау не обов'язково викликають сумніви. Пригнічені каліфорнійською чисельністю? Можливо, але їм все ще є чому нас навчити."

  shi_mil_bos_doctrine:0 "Запит на додаткових інструкторів"
  shi_mil_bos_doctrine_desc:0 "У бункері є своя частка персоналу, але вони не можуть впоратися із завданням навчання набагато більшої військової організації. Нам доведеться залучити ще кілька людей із Лост-Хіллз, щоб ми могли провести доктринальну перебудову."

  shi_mil_bos_chain:0 "Наш власний Ланцюг"
  shi_mil_bos_chain_desc:0 "Братство вимагає дотримання Ланцюга, що Зв'язує, доктрини, створеної за зразком командних ланцюгів старого світу. Це було шановано тоді, це було шановано для Братства, і це буде шановано для нас."

  shi_mil_bos_armour_training:0 "Припасування"
  shi_mil_bos_armour_training_desc:0 "Дехто каже, що вам не потрібне тренування, щоб використовувати Силову Броню. Інші кажуть, що без нього від неї не буде багато користі. Незважаючи на це, було б корисно в певному сенсі дати нашим солдатам певну підготовку у її використанні."

  shi_formal_ncr:0 "Армія, що завоювала Захід"
  shi_formal_ncr_desc:0 "Найбільша національна держава чи не у всій Пустці, армія, що втихомирила Братство, — як ми могли б не вирішити повчитися у військової могутності Нової Каліфорнії?"

  shi_mil_ncr_doctrine:0 "Каліфорнійські радники"
  shi_mil_ncr_doctrine_desc:0 "У Республіки напевно знайдеться кілька офіцерів, яких вони можуть виділити для нагляду за нашою доктринальною перебудовою."

  shi_mil_ncr_rangers:0 "Рейнджери Ші"
  shi_mil_ncr_rangers_desc:0 "Рейнджери — це купка крутих хлопців, які з боями пройшли всю Пустку. Тепер вони інтегровані в армію НКР як елітна бойова сила. Ми станемо тільки сильнішими, якщо вчитимемося у цих чемпіонів."

  shi_mil_ncr_equipment:0 "Вогневі групи та Консервні ножі"
  shi_mil_ncr_equipment_desc:0 "Якщо ми хочемо впровадити деякі тактики НКР, нам знадобиться схоже спорядження. Легкі кулемети для утримання позицій та протитанкова зброя, щоб розкривати броньованих ворогів."

  #Wushu Branch (Akigahai)
  shi_military_wushu:0 "Вищість Духу"
  shi_military_wushu_desc:0 "Дехто може вказувати на передбачувані успіхи військових доктрин НКР і Братства, але вони також сповнені недоліків. Всередині Ші ми маємо унікальний і різноманітний досвід у бойових мистецтвах і величезну історію, з якої можна черпати знання. Ми маємо прийняти наші власні приклади і спиратися на них, а не наслідувати дурощі наших сусідів."

  shi_wushu_national_zeal:0 "Поклик Нації"
  shi_wushu_national_zeal_desc:0 "Наші солдати повинні вірити у справу, за яку вони борються. Вони повинні вірити, що з їхніми смертями Ші стануть тільки безпечнішими і ще більш славетними."

  shi_wushu_art_war:0 "Наше Мистецтво Війни"
  shi_wushu_art_war_desc:0 "Нехай наші плани будуть темними й непроглядними, як ніч, а коли ми рушимо, ми впадемо, як удар блискавки."

shi_wushu_army_arts:0 "Інтегровані бойові мистецтва"
  shi_wushu_army_arts_desc:0 "Чужинці можуть насміхатися з наших звичаїв як з безглуздих перед обличчям кулі, але вони сліпі до переваг, які може дати тренування бойових мистецтв. Розуміння потоку бою, спокій та дисципліна — все це застосовно до мистецтва війни."

  shi_wushu_dynamite:0 "Мистецтво вибухового кидка"
  shi_wushu_dynamite_desc:0 "Дехто може сумніватися, чи вважається кидання динаміту бойовим мистецтвом, але поки це працює, ми будемо цим користуватися."

  #Economy Tree
  shi_economy:0 "Вихід зі спаду"
  shi_economy_desc:0 "Наша економіка вже багато років переживає не найкращі часи. Хоча в середньому ми навряд чи є бідними, деякі Ші дуже бідні, тоді як інші, мабуть, занадто багаті. Хоча думки щодо того, наскільки це велика проблема, розділилися, кожен хоче вирішити її по-своєму."

  shi_economy_flying_dragon:0 "Покровительство над «Летючим драконом»"
  shi_economy_flying_dragon_desc:0 "Лао Чжоу з «Летючого дракона 8» є одним із наших найвидатніших бізнесменів. Якщо і є хтось, на кого ми можемо покластися у відродженні місцевого бізнесу, то це він."

  shi_economy_invest:0 "Інвестування в інвестиції"
  shi_economy_invest_desc:0 "Лао Чжоу може дозволити собі вирости за межі одного магазину чи навіть мережі магазинів. Як щодо того, щоб придивитися до бізнесу в Каліфорнії, якщо дозволить політика?"

  shi_economy_red_eight:0 "Переведення «Червоних 888» у форсований режим"
  shi_economy_red_eight_desc:0 "Мей Да Цзян зі зброярні «Червоні 888» десятиліттями випускає якісне спорядження. Усе, що нам потрібно зробити — це дати йому поштовх, і його постійний форсований режим продовжить працювати на повну."

  shi_economy_diversify:0 "Диверсифікація виробництва"
  shi_economy_diversify_desc:0 "Звісно, ми можемо робити зброю, але є багато інших речей, які також можна виробляти. Броня? Набори інструментів? Можливо, навіть артилерія? Суть у тому, що Мей Да Цзян готовий форсовано виробляти що завгодно."

  shi_economy_initial_fix:0 "Зменшення напруги"
  shi_economy_initial_fix_desc:0 "Наші проблеми нікуди не зникли. Багато селян Ші залишаються знедоленими і дивляться на торговців та каліфорнійських емігрантів із заздрістю та ненавистю. Наразі люди приймають той простий факт, що так буде ще деякий час."

  shi_economy_fishing:0 "Чудовий день для риболовлі, чи не так?"
  shi_economy_fishing_desc:0 "§g"Ми переважно рибалки і вчені. Наші рибалки ловлять рибу. Наші вчені працюють над проєктом, який, за їхніми словами, змінить світ."§! \n-Мей Да Цзян"

  shi_fuel_seaweed:0 "Щедроти моря"
  shi_fuel_seaweed_desc:0 "Десятиліття тому наші предки блукали берегами Сан-Франциско і дивувалися: «Як нам рухатися далі звідси?» Відповідь була простою. Природа тут, щоб давати, і роками ми вдосконалювали метод перетворення морських водоростей та фруктів на паливо. Продовжуймо відточувати цю техніку!"

  shi_economy_docks:0 "Розширення нашого торговельного флоту"
  shi_economy_docks_desc:0 "На узбережжі Тихого океану можна вести активну торгівлю, нам лише потрібно переконатися, що у нас достатньо барж для перевезення товарів. Уявіть собі, що товари Ші подорожують оптом аж до Нової Вікторії?"

  shi_economy_journey_west:0 "Подорож на Захід"
  shi_economy_journey_west_desc:0 "Ми знаємо казки про нашу стародавню батьківщину. Припускається, що вона зазнала такого ж руйнування, як і Мейго, але ми нічого не знаємо про те, що з нею сталося. Чи може Китай бути домом для низки химерних угруповань? Ми можемо лише дізнатися. Ми нарешті готові відправити експедицію на захід через великий океан. Якщо вони повернуться, то повернуться навантажені щедротами досліджень."
  SHI_journey_west_tt:0 "§gМи відправимо кораблі на захід до нашої стародавньої батьківщини Чжунго, відомої Лаоваям як «Китай». Ми не знаємо напевно, чи дістануться вони туди, і що знайдуть, якщо дістануться. Але якщо нам пощастить, вони повернуться з чимось дуже цінним!§!"

  ##Akigahai Economy Focuses
  shi_dragon_economics:0 "Економіку — народу"
  shi_dragon_economics_desc:0 "Найбільше занепокоєння викликає економічний спад, від якого постраждав народ. Ми не повинні шкодувати коштів, щоб полегшити їхні страждання."

  shi_dragon_economy_help:0 "Національна допомога громаді"
  shi_dragon_economy_help_desc:0 "Раніше Акігахай доводилося ділитися тими крихтами, які вона могла, з тими, з ким могла. Тепер, маючи у своєму розпорядженні ресурси держави, вона перетворить просту добровільну допомогу на національну програму допомоги тим, хто страждав усі ці роки."

  shi_dragon_economy_public_works:0 "Проєкти громадських робіт"
  shi_dragon_economy_public_works_desc:0 "Ми можемо піти далі, ніж просто роздавати милостиню час від часу. Ми можемо інвестувати в наше майбутнє, збільшуючи видобуток ресурсів, а потім використовувати ці ресурси для побудови більшої бази."

  shi_dragon_economy_cronies:0 "Експропріація поплічників Журавля"
  shi_dragon_economy_cronies_desc:0 "У Ло Пена було багато союзників, які наживалися на стражданнях народу Ші. Акігахай покарає їх за їхні проступки, відібравши в них їхній бізнес. Хоча в короткостроковій перспективі це може викликати певний хаос, це робиться заради правого діла. Єдине питання — що робити з підприємствами після того, як ми їх заберемо..."

  shi_dragon_economy_regulations:0 "Запобіжні заходи"
  shi_dragon_economy_regulations_desc:0 "Ло Пена, можливо, більше немає, але завжди знайдуться такі люди, як він, які прагнуть накопичувати багатство за рахунок народу. Ми повинні регулювати таку поведінку і запобігати антиконкурентним діям серед наших торговців."

  shi_dragon_economy_capstone:0 "Мета захисту"
  shi_dragon_economy_capstone_desc:0 "Дракон захищав людей давно, коли Ші були маленькою і скромною громадою. Тепер, як повноцінна могутня держава, Акігахай захищає народ від підступів стерв'ятників-спекулянтів."

  ##Brotherhood/Imperial Economy Focuses
  shi_steel_economics:0 "Центральне комп'ютерне планування"
  shi_steel_economics_desc:0 "Нам не потрібні хибні економічні теорії. У нас є Імператор! Якщо ми ще трохи попрацюємо з цифрами, то обов'язково знайдемо вихід із цієї колії."

  shi_steel_economy_commands:0 "Видання наказів"
  shi_steel_economy_commands_desc:0 "Імператор видає економічні укази, і його піддані коритимуться. Комусь ця ідея може не сподобатися, але його мудрість веде нас уже століттями."

  shi_steel_economy_planning:0 "Плани обов'язкової конверсії"
  shi_steel_economy_planning_desc:0 "Імператор може передбачати сценарії з неймовірною точністю. Ми можемо використати це для створення планів, яких підприємства будуть дотримуватися у разі війни та надзвичайних ситуацій, забезпечуючи плавний і швидкий перехід."

  shi_steel_economy_discipline:0 "Економічна дисципліна"
  shi_steel_economy_discipline_desc:0 "Братству не доводиться мати справу з торговцями, які сваряться за більшу частку багатства. Їхні члени стають струнко і питають: «Наскільки високо стрибати?». Ми не можемо насправді очікувати, що ця країна перетвориться на націю солдатів, принаймні не за один місяць, але ми могли б подумати про деякі заходи для заохочення певного культурного ставлення з боку наших громадян."

  shi_steel_economy_military_factories:0 "Лицарське виробництво"
  shi_steel_economy_military_factories_desc:0 "Лицарі Братства — не просто солдати. Вони також займаються виробництвом і обслуговуванням зброї, виконуючи безліч завдань, що виходять за рамки того, що зазвичай вимагалося від солдатів у минулому. Ми подивимося, чи зможуть солдати Ші також взяти на себе ці ролі."

  shi_steel_economy_capstone:0 "Впорядковані, покірні, загартовані сталлю"
  shi_steel_economy_capstone_desc:0 "І ні жадібність, ні фанатизм більше не турбуватимуть нас."

  ##Lo Pan Economy Focuses
  shi_crane_economics:0 "Дати волю хвилі"
  shi_crane_economics_desc:0 "Ми можемо вирішити цю кризу, просто перетерпівши її, загартувавшись і дозволивши їй вирішитися самій собою. Люди можуть бурчати скільки завгодно, але ми всі станемо багатшими, коли період нестабільності закінчиться. Не дозволяйте короткостроковим втратам засліпити вас, проявіть трохи кмітливості!"

  shi_crane_economy_fail:0 "Слабкі гинуть"
  shi_crane_economy_fail_desc:0 "Філософія Ло Пена застосовна до економіки так само, як і до бойових мистецтв. Бізнес, що зазнає невдачі, не повинен підтримуватися з жалю. Навіть якщо це спричинить короткострокові страждання, він має впасти, як картковий будиночок, яким він і є."

  shi_crane_economy_strength:0 "Сильні виживають"
  shi_crane_economy_strength_desc:0 "Бізнесмени та торговці з проникливістю, необхідною для виживання в цей кризовий час, уже роблять свої кроки. Вони беруть активи збиткових підприємств і знаходять їм краще застосування. Вони виходять на ринки, залишені невдахами. Ці самі невдахи можуть продовжувати нити і скаржитися, але Ло Пен все одно не збирався їх слухати."

  shi_crane_economy_loans:0 "Кредити для стартапів"
  shi_crane_economy_loans_desc:0 "Ло Пен не зовсім безсердечний. Він знає, що деяким заповзятливим джентльменам просто потрібен невеликий поштовх, щоб почати. Будь-кому з хорошою ідеєю та прагненням до успіху він запропонує невелику позику. Звісно, він очікує, що її повернуть повністю і з відсотками."

  shi_crane_economy_cronies_vision:0 "Конкуренція серед друзів"
  shi_crane_economy_cronies_vision_desc:0 "У суспільстві Ші Ло Пен має дві великі категорії союзників: старі друзі, які підтримували його попри все, та інноваційні новачки, які бачать можливості в його баченні. Але останнім часом ці дві групи вступили в конфлікт, і Ло Пену, можливо, доведеться обрати сторону."

  shi_crane_economy_capstone:0 "Страждання породжують успіх"
  shi_crane_economy_capstone_desc:0 "Ло Пен довів істинність своєї філософії: переживи кризу, і ти вийдеш із неї кращим. Ті, хто не вижив? Усе одно ніхто не вартий того, щоб їх пам'ятали."
  SHI_lp_choose_economy_tt:0 "\n§gЗалежно від вашого вибору в події §Y«Гра в улюбленців»§!, ви отримаєте один із наступних Національних духів:§!"

  #Research Focuses

  shi_economy_research:0 "Поточні дослідницькі проєкти"
  shi_economy_research_desc:0 "У нас вже давно існує багата наукова традиція. Було б доцільно нарешті завершити деякі з наших затяжних проєктів."

  shi_research_fev:0 "Надлюдська спадщина доктора Лонга"
  shi_research_fev_desc:0 "Деякий час тому доктор Лонг Ванг хотів стати першопрохідцем у створенні сироватки суперсолдата на основі ВРЕ. На жаль, надмірна самовпевненість у власній роботі призвела до того, що він зробив собі ін'єкцію і розчинився в калюжу. Доктор Шен закрила його проєкт, але ми можемо наказати відродити його."

  shi_research_fev_recruit:0 "Заохочення піддослідних"
  shi_research_fev_recruit_desc:0 "Замість прямих методів вивчення ВРЕ ми могли б залучити Супермутантів з Каліфорнії прийти на добровільне тестування. Це може виявитися дорогим, але якщо ми хочемо зробити це без бою, нам доведеться проковтнути витрати."

  shi_research_fev_warren:0 "Безпосереднє здобуття зразків"
  shi_research_fev_warren_desc:0 "Кажуть, що далеко на півночі є не лише Супермутанти, а й великий зразок їхнього вірусу. Якщо ми захопимо його для себе, ми зможемо значно прискорити наші дослідження!"
  SHI_warning_neighbor_tt:0 "§RВам, мабуть, не варто цього робити, якщо у вас немає можливості до них дістатися!§!"

  shi_research_fev_breakthrough:0 "Суперсолдати Ші"
  shi_research_fev_breakthrough_desc:0 "У наші наміри не входить відтворення Супермутантів. У всякому разі, ми сподіваємося, що наша сироватка дасть силу без перетворення на потворних монстрів. Незважаючи на це, ми нарешті побачимо результати нашої суперсироватки!"

  shi_research_vine:0 "Листя на лозі"
  shi_research_vine_desc:0 "Доктор Шен вже довгий час шукає рослину, яка поглинає радіацію. У неї були свої злети і падіння з цим, але тепер вона впевнена, що перебуває на межі прориву."

  shi_research_vine_crimson:0 "Убезпечення Багряного лісу"
  shi_research_vine_crimson_desc:0 "До нас дійшли чутки про мутований вид рослинності на півночі, відомий як «Мандрагора». Доктор Шен переконана, що ця форма життя зберігає секрет творіння, яке вона так довго шукала. Оскільки найшвидшим методом знайти і захопити її є встановлення прямого контролю над лісом, вона порекомендувала нам за можливості використати військову силу."

  shi_research_vine_expedition:0 "Проникнення в ліси"
  shi_research_vine_expedition_desc:0 "До нас дійшли чутки про мутований вид рослинності на півночі, відомий як «Мандрагора». Доктор Шен переконана, що ця форма життя зберігає секрет творіння, яке вона так довго шукала. За відсутності засобів для прямого контролю над лісом, вона запропонувала ретельну місію з проникнення, яка дозволить їм захопити Мандрагору і привезти її сюди. Це, звісно, обійдеться нам недешево."

  shi_research_vine_breakthrough:0 "Вдихаючи життя в ґрунт"
  shi_research_vine_breakthrough_desc:0 "Доктор Шен неймовірно щаслива, що нарешті досягла своєї багаторічної мети."
  SHI_spread_vine_tt:0 "§gМи розблокуємо можливість поширювати нашу Лозу, що поглинає радіацію, по всій нашій території!§!"

  shi_research_final_slot:0 "Завжди є ще один проєкт"
  shi_research_final_slot_desc:0 "Ми закінчили наші останні великі справи, але завжди є нові питання, на які потрібно знайти відповіді, і нові проблеми, які потрібно вирішити. Вчені Ші працюватимуть вдень і вночі, щоб відродити цивілізацію."

