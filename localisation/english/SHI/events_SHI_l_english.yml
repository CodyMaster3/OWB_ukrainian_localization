l_english:
#Actual Focus Tree Events

  SHI_main_events.1.t:0 "Честь нам усім"
  SHI_main_events.1.d:0 "Деякі селяни стверджують, що Імператор правив з незапам'ятних часів, але мудреці знають, що ми прибули на стародавньому підводному човні під час Великої війни. Покинуті Династією Мао, ми оселилися в місті Сан-Франциско, відбудовуючи те, що вціліло після війни. \n\nЗ руїн підводного човна ми побудували палац, гідний Імператора, серце Ші-Тауна. Воля Імператора передавалася б народу Ші через голос його найближчого радника, яким довгий час був шановний Кен Лі."
  SHI_main_events.1.a:0 "Перший Імператор приніс знання моря."
  SHI_main_events.1.b:0 "Мудрість Імператора спрямовувала наше поселення."

  SHI_main_events.2.t:0 "Війни Дракона, битви Тигра"
  SHI_main_events.2.d:0 "Акіґахаї була ще маленькою дівчинкою, коли побачила, як її наставник, Дракон, впав перед 'Героєм Наварро'. На той час він був лише чужинцем, що приєднався до Ло Пана, заклятого суперника Дракона. Але невдовзі він став тим, хто розгромив бандитів з моря, вигнав хабологів з міста і дарував Імператору дивовижні технології. 'Герой', який розчавив її героя. \n\nЛо Пан здобув популярність, ставши новим улюбленцем народу. Дракон вирушив у подорож самопізнання. Під час його відсутності його учні розійшлися, і Школа Дракона майже стерлася з пам'яті. \n\nАле Акіґахаї не збиралася відпускати те, що означало для неї так багато."
  SHI_main_events.2.a:0 "Армія, що палає обуренням, неодмінно переможе."
  SHI_main_events.2.b:0 "Хороший кінь не повертається їсти траву позаду."
  SHI_main_events.2.c:0 "Ви знаєте, вони також допомогли місцевому Братству!"

  SHI_main_events.3.t:0 "Вода втікає лише для того, щоб витекти"
  SHI_main_events.3.d:0 "Ло Пан керував Ші понад 30 років з часу його доленосної зустрічі з Обраним усі ті роки тому. Під його керівництвом та керівництвом Імператора народ Ші процвітав. Тісне партнерство з НКР принесло економічні можливості та мобільність. Селянин міг досягти величі, якщо зміг би вибороти її силою власних рук. Такою була філософія Ло Пана. \n\nАле разом із багатством, яке Ші імпортували з Каліфорнії, вони імпортували і її проблеми. Ті, хто мав силу та багатство, щоб захопити владу, зачиняли за собою двері, залишаючи слабших у злиднях і без мети. Суспільство віддалося споживацтву. Святилища предків занепали, а новорічний парад став приводом для пияцтва. На хвилі невдоволення і смутку відроджена Акіґахаї Школа Дракона поклялася підтримувати народ і зміцнювати його традиції. Ностальгія за простішими часами, коли Дракон вів за собою маленький, але чесний народ, знайшла сприятливий ґрунт."
  SHI_main_events.3.a:0 "Розбагатіти — це славно."
  SHI_main_events.3.b:0 "Золоте гніздо не зрівняється з власною собачою будкою."
  SHI_main_events.3.c:0 "Філософія бойових мистецтв не може бути основою для системи правління."

  SHI_main_events.4.t:0 "З покоління в покоління"
  SHI_main_events.4.d:0 "Учні Дракона сиділи в мовчазному спогляданні перед святилищем у Сан-Франциско. Попереду сиділа Акіґахаї, спокійна і безтурботна. Її учні сиділи за нею в різних станах медитації. \n\nГао завжди був нетерплячим. Імпульсивний і непосидючий, він раптом схопився на ноги. 'Яке марнування часу!' — голосно заявив він. 'Я прийшов вчитися говорити кулаками, а не молитися так, як навчила мене матір!' Акіґахаї не обернулася і не відреагувала. \n\n'Ти провалився', — спокійно повідомив Лі Цзюнь-фан Гао, не змінюючи пози. \n\n'Провалився!? Провалився, тому що НІЧОГО НЕ РОБИВ!?' \n\n'Подумай. Скільки боїв ти бачив, вирішених необдуманим кроком? Воїн має бути спокійним. Якщо ти навіть сидіти спокійно не можеш, як ти будеш протистояти провокаціям супротивника?' Гао пирхнув і замахав руками в повітрі. 'Тобі треба ще багато чому навчитися, Гао...' Акіґахаї не змогла стримати посмішку. Вона передбачила слова, які сама сказала Лі багато років тому, і які десятки років тому сказав їй сам Дракон..."
  SHI_main_events.4.a:0 "Уроки — це не лише фізична підготовка."

  SHI_main_events.5.t:0 "Коли старі люди саджають дерева"
  SHI_main_events.5.d:0 "У межах Сталевого Палацу старійшина Френсіс і Кен Лі сиділи разом, граючи у вейці. Збоку спостерігав лицар у броні. \n\n'Хватка Імператора слабшає з кожним днем', — сказав Кен Лі своєму давньому другові, роблячи хід, — 'ходять чутки, що Ло Пан має намір скасувати імператорський інститут взагалі. Ми не можемо сподіватися, що ці фанатики зі Школи Дракона не зроблять чогось нерозважливого'. \n\n'Справді, не можемо', — Френсіс вивчав дошку, — 'на щастя, я вже до цього готувався'. Він вказав на свого лицаря. 'Лю. Ти стежив за грою?' \n\n'Так, сер', — відповів юнак, — 'вам потрібно ще кілька ходів, щоб виграти'. \n\nКен Лі переоцінив свою позицію. Це була правда, його поразка була неминучою. 'Як мені пощастило мати такого розумного і терплячого друга, як ти, Френсіс'. \n\n'Ти лестиш мені', — усміхнувся Френсіс, — 'побережи свою похвалу, поки Лю не доведе, як наші дві спільноти можуть об'єднатися'."
  SHI_main_events.5.a:0 "Ми запропонуємо впевненість сталі."

  SHI_main_events.6.t:0 "Бий першим, бий сильно"
  SHI_main_events.6.d:0 "Цзян думав, що у нього ідеальний план. Перед боєм він підсипле міорелаксант у напій Синтії. Він чув, що саме так вона здобула місце у Школі Журавля. Це був би іронічний спосіб повалити її й довести, що він може зробити це краще. \n\nАле коли настав час поєдинку, вона була у повній формі. Йому довелося битися з нею чесно, і його навички виявилися недостатніми. \n\n'Гарна спроба', — сказав йому Ло Пан, поки той оговтувався в бічній кімнаті школи, — 'але ти не можеш так легко обдурити мою найкращу ученицю, Цзян'. Ло Пан дістав напій, яким Цзян сподівався отруїти Синтію, і вилив його на голову Цзяну. 'Це було справді натхненно, але наступного разу спробуй краще! Або стань сильнішим. Що я завжди кажу, малий?' \n\n'Тільки сильний переможе'. \n\n'Бентежно правильно!' Ло Пан вийшов із кімнати, регочучи."
  SHI_main_events.6.a:0 "Світ може бути жорстоким, тому ти повинен навчитися бути жорстоким сам."

  SHI_main_events.7.t:0 "Побитий до синців"
  SHI_main_events.7.d:0 "Чарльза Річардсона, караванника з НКР, знайшли на вулиці. Його побили до невпізнання, роздягнули й покинули страждати напризволяще. Минуло чимало часу, перш ніж хтось зупинився, щоб допомогти йому. Занадто багато часу, на думку багатьох емігрантів з НКР. \n\nПосольство НКР зажадало, щоб влада знайшла винного. Розслідування триває, але йому перешкоджає вороже ставлення місцевих. Проста правда полягає в тому, що багато безправних людей були раді бачити, як ті, кого вони вважають іноземними паразитами, 'отримали те, на що заслуговують', і не будуть співпрацювати з правоохоронцями."
  SHI_main_events.7.a:0 "Він із НКР, хіба цього недостатньо?"
  SHI_main_events.7.b:0 "Ганебне видовище! Це сповнене ненависті насильство має припинитися!"

  SHI_main_events.8.t:0 "Тигр, що крадеться, злий дракон"
  SHI_main_events.8.d:0 "Прем'єра першого фільму Ші відбулася сьогодні в Сан-Франциско. На ній були присутні багато представників міської еліти, а також каліфорнійські бізнесмени та політичні діячі всіх мастей. Ло Пан, звісно, зарезервував для себе почесне місце у відремонтованому театрі. \n\n'Тигр, що крадеться, злий дракон' розповідає історію молодого чоловіка, сповненого амбіцій та енергії. Але його стримує тиранічний та впертий 'Дракон' — чоловік, який тримає країну Мей в ізоляції, щоб ніхто не міг кинути виклик його правлінню. За допомогою мудрого старця, якого зіграв сам Ло Пан, молодий герой тренується і перемагає Дракона в епічному протистоянні, нарешті звільняючи Мей і відкриваючи її зовнішньому світу. \n\nХоча молодші глядачі та чужинці цього не зрозуміли, старші люди одразу ж відзначили, що це просто пропагандистська версія конфлікту між Ло Паном і Драконом."
  SHI_main_events.8.a:0 "Ого, яке шоу!"
  SHI_main_events.8.b:0 "Найгірший. Фільм. В історії."

  SHI_main_events.9.t:0 "Усі билися в стилі кунг-фу"
  SHI_main_events.9.d:0 "Був пізній вечір. Денні робітники розходилися по домівках. Таверни були переповнені, а продавці в ятках були дуже зайняті. \n\nЦе був момент великого нещастя для Маркет-стріт, коли учні Журавля на чолі з Синтією Емерсон, протеже Ло Пана, зіткнулися ніс до носа з групою Драконів, серед яких був Лі Цзюнь-фан, найвідданіший прихильник Акіґахаї. \n\n'О, та це ж маленькі дракони!' — привітала їх Синтія з глузливою привітністю. 'Біжите додому до матусі наприкінці дня?' \n\nГао Жучжан, один із багатьох гарячковитих хлопців у Школі Дракона, спробував кинутися вперед, але його заблокував Лі. 'Не принось їм задоволення захищатися', — прошипів він своєму товаришеві. Але Гао проштовхнувся і продовжив атаку, заробивши собі розбитий ніс завдяки швидкому удару Синтії. \n\nВулиця швидко занурилася в хаос. У хід ішли кулаки так само часто, як і стільці. Ятки перевернули, а вікна розбили."
  SHI_main_events.9.a:0 "Журавлі перемогли!"
  SHI_main_events.9.b:0 "Дракони розгромили своїх ворогів!"
  SHI_main_events.9.c:0 "Братство приєдналося до гвардії, щоб зупинити бійку!"

  SHI_main_events.10.t:0 "Перетин"
  SHI_main_events.10.d:0 "Кен Лі та старійшина Френсіс зібрали все, що знали про фракції, і передали інформацію Імператору. На жаль, як добре знав Кен Лі, розрахунки Імператора не завжди допомагали в питаннях людського серця. Стільки всього могло піти не так, якщо будь-яка зі сторін вирішила б діяти нераціонально, і було достатньо доказів того, що так може статися. \n\n'Можливо...' — Кен Лі не наважувався заговорити, відкинувшись на спинку крісла, — '...Акіґахаї? Вона поважає традиції, а що таке Імператор, як не традиція Ші?' \n\n'Але ми не можемо бути впевнені', — Френсіс поклав роздруківку з інформацією від Імператора на стіл між ними, — 'можливо, вона розцінить Імператора як співучасника впливу Ло Пана? Або, як і багато хто до неї, виявиться жадібною до влади і використає це як шанс шантажувати нас'. \n\n'Ну, інший варіант — Ло Пан, а його неповага до Імператора загальновідома!' \n\n'Правда, але він також є статусом-кво. З ним на чолі все БУЛО стабільно, поки Акіґахаї не встромила палицю в колеса. Звісно, як Брат, я не можу сказати, що мені подобається ідея підлещуватися до маріонетки Ведмедя...' Обидва старигані знали, що їм доведеться обирати менше з двох зол."
  SHI_main_events.10.a:0 "Давайте звернемося до Акіґахаї."
  SHI_main_events.10.b:0 "Давайте звернемося до Ло Пана."

  SHI_main_events.11.t:0 "Сидячи з Драконом"
  SHI_main_events.11.d:0 "Акіґахаї вимагала, щоб зустріч відбулася перед одним із найстаріших святилищ Сан-Франциско. Немає кращого місця для обговорення справ країни, ніж у тіні її безтурботного минулого, стверджувала вона. Хоча її показуха не вразила інших, Френсіс і Кен Лі все ж зустрілися з нею. Щоб прийняти їх усіх, поставили імпровізований стіл. \n\n'Мені спадає на думку', — почала Акіґахаї через деякий час, — 'якщо ви хочете миру, вам слід просто заарештувати Ло Пана і зруйнувати його неофіційну імперію'. \n\n'Ло Пан не вчинив жодного злочину'. 'Про який би ми знали', — хотів було додати Кен Лі. Але це лише послабило б його позицію. 'Закони Імператора не виправдовують свавільних арештів'. \n\n'Тоді, здається, вам не залишається нічого іншого, як терпіти всі біди світу. Який жаль'. Френсіс хотів вказати на те, що Акіґахаї була джерелом багатьох заворушень, але промовчав. Дипломатії ніколи не можна було досягти, тиснучи на іншу сторону. \n\n'Послухайте, ось факти: ваші учні беруть участь у бійках у місті. Ці бійки порушують життя простих людей, тих самих, яких ви нібито підтримуєте і захищаєте. Якщо ви справді хочете їм допомогти, то повинні зробити все можливе, щоб заспокоїти своїх. Гвардія та Братство втрутяться, щоб зупинити агресію Ло Пана, якщо до цього дійде'. Акіґахаї мало вірила обіцянкам Братства. І все ж, можливо, видимість підтримки миру могла б схилити громадську думку проти Ло Пана? Мир — це чудова мрія, але вона знала, що його не буде, поки вплив Ло Пана не буде знищено."
  SHI_main_events.11.a:0 "Акіґахаї погодилася контролювати своїх учнів."
  SHI_main_events.11.b:0 "Угоди не було досягнуто. Переконання Акіґахаї лише зросли."

  SHI_main_events.12.t:0 "Залицяння до Журавля"
  SHI_main_events.12.d:0 "Ло Пан недбало зажадав, щоб будь-яка розмова відбувалася в його приватних покоях у Школі Журавля. Там до Кена Лі та Френсіса приєдналися найбільші громили Ло Пана. 'Просто щоб навчити їх чомусь', — заявив він. Чергова самовпевнена демонстрація сили, інші були в цьому впевнені. Але вони могли потурати його марнославству, якщо це означало, що він їх вислухає. \n\n'Послухайте, хлопці, я не розумію. Ви хочете миру? Відпустіть мене, дозвольте мені знищити Драконів раз і назавжди. Дідько, ваші хлопці можуть піти зі мною, якщо хочуть. Може, чогось навчаться'. \n\n'Абсурд', — Кен Лі пильно подивився на нього, — 'повномасштабний напад на школу Акіґахаї, ймовірно, доведе місто до божевілля. Це було б прямо протилежним тому, чого ми хочемо досягти. Не кажучи вже про те, що це морально неприйнятно'. \n\nЛо Пан знизав плечима і розслабився на дивані. 'Якщо ви, хлопці, хочете померти смертю тисячі порізів — будь ласка. Журавлі вийдуть переможцями, що б не трапилося'. \n\n'Тому що ти такий могутній, правда?' Ло Пан підняв брову, дивлячись на Френсіса. 'А оскільки ти могутня людина, тобі, безумовно, не складе труднощів контролювати своїх учнів. Адже ти найсильніший, а найсильніші правлять?' Ло Пан пирхнув. Френсіс намагався маніпулювати ним. Прозорий гамбіт, але в присутності своїх учнів він мусив обмірковувати те, що говорив."
  SHI_main_events.12.a:0 "Ви біса праві, я можу їх контролювати."
  SHI_main_events.12.b:0 "Міг би, але навіщо мені напружуватися?"

  SHI_main_events.13.t:0 "Геть старе, хай живе старе"
  SHI_main_events.13.d:0 "Один золотошукач натрапив на справжнє золото. Під землею було знайдено родовище спресованих металів та мікросхем. Якщо його розкопати, його можна переробити на чималу кількість матеріалів. \n\nАле є одна заковика. На цій землі знаходиться одне з найстаріших святилищ Сан-Франциско. Хоча останнім часом воно занепало, щойно з'явилися чутки про те, що його можуть знести, місцева громада здійняла галас. Було написано багато петицій з вимогою зберегти святилище. Але відомі бізнесмени наполягають на тому, щоб продовжувати."
  SHI_main_events.13.a:0 "Ло Пан забезпечує продовження розкопок, граючи м'язами."
  SHI_main_events.13.b:0 "Акіґахаї згуртовує громаду, і Сталевий Палац стає на їхній бік."

  SHI_main_events.14.t:0 "Плащ і кинджал"
  SHI_main_events.14.d:0 "Патрік Емерсон завжди був бажаним гостем у залах Ло Пана. Один з його перших великих ділових партнерів у НКР, вони обидва могли приписати собі більшу частину заслуг у перетворенні Сан-Франу на те, чим він є сьогодні. Зазвичай він приходив, щоб обговорити ділові питання або просто випити. Те, що він запропонував сьогодні, було чимось, до чого Ло Пан не був готовий. \n\n'Ви даєте мені військових убивць?' Він здивовано підняв брову на Патріка. \n\n'Ми нічого тобі не даємо, Ло', — засміявся Патрік, — 'ми посилаємо сюди кількох хлопців, щоб допомогти навести тут лад. Твої суперники змушують людей нервувати, і командування НКР вирішило діяти на випередження. Строго неофіційно, звичайно'. \n\n'Як же мені в це вписатися?' \n\n'Їм потрібні твої поради та допомога. Можливо, навіть допомога когось із твоїх хлопців. Але що найголовніше — ти маєш обрати нашу ціль. Ми не можемо організувати два нещасні випадки одночасно, і коли один буде готовий, керівництво захоче відступити, вважаючи, що намагатися двічі — надто ризиковано. Інакше кажучи, хто, на твою думку, полегшив би тут ситуацію, якби ми їх прибрали?' Над цим Ло Пану довелося подумати. Акіґахаї була найочевиднішим подразником, але Братство мало певну недоторканність, будучи захищеним Сталевим Палацом. Це міг бути його єдиний шанс позбутися їх без зайвого шуму або хоча б змусити їх схилити голови. Але Акіґахаї була тією, хто жадав його крові..."
  SHI_main_events.14.a:0 "Готові вбити дракона?"
  SHI_main_events.14.b:0 "Відкрийте для мене кілька бляшанок."

  SHI_main_events.15.t:0 "Постріл у темряві"
  SHI_main_events.15.d:0 "Була холодна ніч у Сан-Франциско. Доки вважалися місцем, де після настання темряви збиралися хулігани. Загалом, ідеальне прикриття для підпільної діяльності Школи Дракона. Іноді до цієї діяльності навіть залучали хуліганів. \n\nДля прикладу: Акіґахаї, одягнена в капюшон і замаскована, отримувала ящик з боєприпасами. Тривожний знак часу, але вони не могли дозволити собі бути погано озброєними на випадок, якщо Ло Пан або державні сили прийдуть за ними. Таким було життя цивільної групи, що протистоїть деспотичній владі. \n\n'Ви впевнені, що це правильна кількість?' Вона не була певна, чи не є параноєю її відчуття, що ящик став легшим. \n\n'Хочеш стояти тут і рахувати кожен набій?' — недбало відповів її зв'язковий. \n\n'Просто пам'ятай, що ми можемо змусити тебе пошкодувати про те, що ти перейшов нам дорогу'. Вона вважала, що трохи жорстких слів необхідні при спілкуванні з представниками кримінального світу. Це нагадувало їм, що вона не якась там жертва для експлуатації. \n\nАле перш ніж вона повернулася, щоб піти, вона заприсяглася б, що побачила якийсь відблиск вдалині..."
  SHI_main_events.15.a:0 "Ймовірно, нічого страшного."
  SHI_crane_attack_dragon_tt:0 "§gКуля снайпера влучає Акіґахаї в плече. Хоча їй вдається втекти, вона змушена багато днів одужувати. Діяльність Школи Дракона на деякий час спадає. \n\nТим часом НКР організовує для Ло Пана нові контракти. Ще один відкат у довгій низці відкатів.§!"
  SHI_main_events.15.b:0 "...лягай!"
  SHI_crane_exposed_dragon_tt:0 "§gАкіґахаї ховається в укриття. Снайпер промахується і тікає під покровом темряви. НКР відкликає всю команду, не бажаючи ризикувати подальшим викриттям. \n\nПоширюються чутки, що хтось намагався вбити Акіґахаї. Хоча реальних доказів не знайдено, сама підозра, що це спробувала зробити НКР, обурює громадськість і гальванізує рух Акіґахаї. Ло Пан проклинає некомпетентність свого союзника.§!"

  SHI_main_events.16.t:0 "Руйнівник бункерів"
  SHI_main_events.16.d:0 "'Ти слухаєш, лицарю?' Лю знову звернув увагу на старійшину. 'Чесно кажучи, мріяти — не личить Братові'. \n\n'Мої вибачення, старійшино, просто...' Лю знову подивився в коридор. '...Персоналу Сталевого Палацу не належить блукати цією частиною бункера, чи не так?' Оскільки співпраця між двома групами Сталі зростала, іноді техніків Сталевого Палацу запрошували допомогти розширити бункер. Їх, звісно, ретельно відбирали і не допускали в заборонені зони. Саме тому Лю зацікавився, побачивши одного з них біля офісу старійшини Френсіса. \n\n'Хм. Можливо, вони заблукали? Я впевнений, що хтось їх розверне. А тепер ми-' \n\n'Я їх також не впізнав', — продовжив Лю. 'Є лише три затверджені техніки. Я їх усіх бачив раніше'. \n\n'Перебивати старійшину теж не личить, лицарю'. Лю подивився на Френсіса благальним поглядом."
  SHI_main_events.16.a:0 "У тебе параноя. Ти все одно не так добре знаєш техніків!"
  SHI_crane_attack_bos_tt:0 "§gАле вибух підтвердив підозри Лю. Хоча диверсант не зміг потрапити в чутливі зони, його бомба пошкодила інфраструктуру бункера і вбила кількох співробітників. Братство буде зайняте ремонтом і йому перешкоджатимуть у зовнішніх взаємодіях. \n\nТим часом НКР організовує для Ло Пана нові контракти. Ще один відкат у довгій низці відкатів.§!"
  SHI_main_events.16.b:0 "Краще перестрахуватися..."
  SHI_crane_exposed_bos_tt:0 "§gКоли перевдягнений диверсант був викритий, він відмовився здаватися живим. Дезінтегрований лазерною гвинтівкою лицаря, Братство залишилося з питаннями та підозрами. НКР відкликає всю команду, не бажаючи ризикувати подальшим викриттям. \n\nПоширюються чутки, що хтось намагався атакувати бункер. Хоча реальних доказів не знайдено, сама підозра, що це спробувала зробити НКР, обурює громадськість і викликає симпатію до Братства. Ло Пан проклинає некомпетентність свого союзника.§!"

SHI_main_events.17.t:0 "Фаворит"
  SHI_main_events.17.da:0 "Лі подивився на браміна, що тепер стояв посеред залу Школи Дракона. Очевидно, дехто з інших учнів прийняв це 'підношення' на честь їхньої 'майбутньої перемоги'. Як Акіґахаї вже зрозуміла, вони не усвідомлювали, що їм пропонують цілого, живого браміна, що дихає. \n\n'Що нам із ним робити?' — запитав він її, коли вона повернулася після того, як відчитала інших. \n\n'Мій дядько знає, як приготувати круту печеню!' — з ентузіазмом запропонував Гао. \n\n'Побачимо', — нерішуче відповіла Акіґахаї. 'Але я думаю, найважливіше — це урок, який ми з цього винесемо'. \n\n'Ніколи нічого не приймати, не перевіривши спершу?' \n\n'Ні, Лі', — засміялася Акіґахаї, — 'це свідчення віри, яку люди покладають на тебе і Школу Дракона. Вони бачать надію на майбутнє в нашій перемозі на турнірі'. Вона поклала руку на плече Лі. 'Ти більше, ніж будь-хто тут, втілюєш чесноти, які відстоював Дракон. На хвилі твоєї перемоги ми зможемо скасувати три десятиліття занепаду для Ші. Ти будеш битися з моїм благословенням і благословенням усіх у цій школі'. \n\nЛі зробив жест кулаком і долонею, на його обличчі була щира посмішка. 'Я не підведу вас, шифу!'"
  SHI_main_events.17.db:0 "'Тільки погляньте на деякі з них!' Синтія перебирала листи, які отримувала напередодні турніру. 'У цьому написано: \"Ти найкраща в усьому, ніхто ніколи не зможе тебе принизити!\" А в цьому: \"Ти назавжди залишишся королевою наших сердець\". А в цьому...' Її захоплений вираз обличчя змінився на роздратований. '...\"Здохни, ти потворна к-\"' \n\n'Забудь про це лайно', — Ло Пан вихопив лист з її руки й викинув у вікно. 'Дурні слова овець не виграють тобі цей турнір. А ось сила у твоїх кулаках і розум у твоїй голові — виграють. Повторюй це щодня до турніру!' \n\n'Так, шифу!' Синтія підвелася з дивана, вклонившись своєму вчителю. \n\n'А тепер слухай уважно, бо ти почуєш це лише раз...' Обличчя Ло Пана набуло дивно похмурого виразу. '...За ці роки в мене було багато дітей. Виродків в обох сенсах цього слова. Ніколи не піклувався про жодного з них'. Він штовхнув її в плече. 'Ти, Синтіє, ти розумієш. Ти розумієш, що означає бути сильною, бути підступною, не зважати на те, що в процесі доведеться спаплюжити світ якогось бідолахи. Можливо, Патрік і твій біологічний батько, але для мене ти завжди будеш як дочка'. Вони обмінялися посмішками. 'А тепер забудь про всі ці сентиментальні дурниці. Вийди туди і відлупцюй своїх супротивників до втрати свідомості!'"
  SHI_main_events.17.dc:0 "'Можливо, нам варто частіше проводити турніри', — пожартував Лю, дивлячись на купу пожертвувань, які вони отримали, — 'Братству було б набагато менше роботи'. \n\n'Ну, я чув, що проведення цього турніру обходиться досить дорого, тому, мені здається, це б зрівнялося'. Старійшина Френсіс засміявся. 'Але ці речі нам дали не лише заради турнірів, лицарю...' Він підняв лазерний пістолет. '...Це знак. Наші зусилля принесли плоди. Люди бачать у Братстві своїх природних захисників. А ти, мій хлопче, — це міст між світами. Людина сталі і людина Ші. Тож уперед', — Френсіс відсалютував йому. 'Вийди туди і покажи їм, наскільки міцними можуть бути твої кулаки!' \n\nЛю відповів на салют з ентузіазмом 'сер!', перш ніж розвернутися і піти. Вийшовши зі збройової, він побачив, як його вітають брати і сестри, аплодуючи і віддаючи честь. Він ішов залами, що дзвеніли від захоплення."
  SHI_main_events.17.a:0 "Дракон підніметься!"
  SHI_dragon_wins_tt:0 "§gВважається, що §BШкола Дракона§! переможе у турнірі. §BАкіґахаї§! готова узурпувати довгий період популярності Ло Пана...§!"
  SHI_main_events.17.b:0 "Журавель повалить вас на землю!"
  SHI_crane_wins_tt:0 "§gВважається, що §OШкола Журавля§! переможе у турнірі. Ера сили і прогресу §OЛо Пана§! триватиме безперешкодно...§!"
  SHI_main_events.17.c:0 "Сталеві кулаки!"
  SHI_steel_wins_tt:0 "§gВважається, що §WБратство§! переможе у турнірі. §WСтарійшина Френсіс§! може нарешті здійснити свою мрію про об'єднання Братства зі Сталевим Палацом і Сан-Франциско...§!"

  SHI_main_events.172.t:0 "Розваги перед боєм"
  SHI_main_events.172.da:0 "Акіґахаї та Дракон зайняли свої місця на трибунах арени. Ло Пан, безперечно, побудував собі розкішний колізей. Усе заради власної втіхи, подумала Акіґахаї. Хоча обидва вони хвилювалися за успіх Лі, поки що дозволили собі розслабитися і насолодитися майбутніми боями бойової майстерності. \n\n'Гей, друзі!' Вони одразу напружилися, почувши глузливий голос Ло Пана. Він сів поруч із Акіґахаї і простягнув їй м'ясну паличку. 'Кебаб із гекона?' \n\n'Як типово для тебе їсти цю огидну їжу лаоваїв, Ло'. Дракон спокійно дорікнув своєму старому супернику. \n\n'О, вибачте, що не їм страви Ші! Я лише подумав узяти приклад з твоєї учениці. Я маю на увазі, поглянь на її волосся, на її очі, на її ім'я! У ній немає нічого від Ші!' \n\n'У Ші більше культурних коренів, ніж ти можеш згадати'. Акіґахаї пирхнула, відвертаючись від Ло Пана. \n\n'Але немає місця для культури наших друзів? Яке вузьке мислення!' Ло Пан підвівся і засміявся. 'Ви, друзі, можете триматися за своє лайно Ші. Адже це все, що у вас залишиться, коли вас змиє хвилею майбутнього'. Він одразу ж пішов геть, залишивши їх обох сердито дивитися йому вслід."
  SHI_main_events.172.db:0 "Акіґахаї зайняла своє місце на трибунах арени. Ло Пан, безперечно, побудував собі розкішний колізей. Усе заради власної втіхи, подумала вона. Хоча вона хвилювалася за успіх Лі, поки що дозволила собі розслабитися і насолодитися майбутніми боями бойової майстерності. \n\n'Гей, Акі!' Вона одразу напружилася, почувши глузливий голос Ло Пана. Він сів поруч із нею і сунув їй в обличчя м'ясну паличку. 'Кебаб із гекона?' \n\n'Як типово для тебе їсти цю огидну їжу лаоваїв, Ло'. Акіґахаї грубо дорікнула своєму ворогу. \n\n'О, вибачте, що не їм страви Ші! Я лише подумав узяти з тебе приклад. Я маю на увазі, поглянь на своє волосся, на свої очі, на своє ім'я! У тобі немає нічого від Ші!' \n\n'У Ші більше культурних коренів, ніж ти можеш згадати'. Акіґахаї пирхнула, відвертаючись від Ло Пана. \n\n'Але немає місця для культури наших друзів? Яке вузьке мислення!' Ло Пан підвівся і засміявся. 'Ви можете триматися за своє лайно Ші. Адже це все, що у вас залишиться, коли вас змиє хвилею майбутнього'. Він одразу ж пішов геть, залишивши Акіґахаї сердито дивитися йому вслід."
  SHI_main_events.172.a:0 "Це вирішиться на рингу."

  SHI_main_events.18.t:0 "Півфінал"
  SHI_main_events.18.da:0 "Лі Цзюнь-фан вийшов у півфінал після багатьох днів боїв. Його фінальною суперницею мала стати Синтія Емерсон зі Школи Журавля. Але перед нею був Лю Юнь-цяо з Братства Сталі. Його так рідко бачили без броні, що це була справжня подія — побачити його справжнє обличчя. \n\nЛі не мав конфліктів із Братством, але він не міг дозволити собі зупинитися тут. Першу хвилину він оцінював Лю. Той, безсумнівно, був добре тренованим солдатом, але поєднував мілітаристську негнучкість із важкими рухами Братства. Як і в історіях, які він чув про війну з НКР, найкращою тактикою було атакувати і відступати, ніколи не вв'язуючись у його захист, міцний, як сталева стіна. \n\nЗрештою, він виснажив Лю і повалив його на землю. Під оплески натовпу Лі запропонував йому допомогу. Лю взяв його за руку і привітав з перемогою, виявивши гідність у поразці."
  SHI_main_events.18.db:0 "Синтія Емерсон вийшла у півфінал після багатьох днів боїв. Її фінальним суперником мав стати Лі Цзюнь-фан зі Школи Дракона. Але перед ним був Лю Юнь-цяо з Братства Сталі. Його так рідко бачили без броні, що це була справжня подія — побачити його справжнє обличчя. \n\nСинтія знала, що їхній бій — це щось на кшталт протистояння незупинної сили і нерухомого об'єкта. У неї був напад, у нього — захист. Єдина проблема для нього полягала в тому, що він бився так само, як і ті ідіоти, що складали його маленьке відділення: завжди зосереджений на праведності там, де потрібно було зосередитися на перемозі. \n\nЛю був поставлений на коліна після деякого виснаження ударом по одному з його колін. Його брати намагалися заявити про порушення правил після матчу, але судді визнали прийом легітимним. Синтія пішла геть переможницею."
  SHI_main_events.18.dc:0 "Лю Юнь-цяо вийшов у півфінал після багатьох днів боїв. Його фінальною суперницею мала стати Синтія Емерсон зі Школи Журавля. Але перед нею був Лі Цзюнь-фан зі Школи Дракона. Хоча деякі учні Дракона були некерованими, Лі вважався кращим за більшість з них. \n\nПопри це, Лю мусив перемогти заради Братства і миру у своєму місті. Багато хто зверхньо дивився на стилі Братства, вважаючи їх надто залежними від військового мислення і позбавленими гнучкості. На щастя, це було те, над чим останнім часом працював старійшина Френсіс. Справді, він дозволив йому застосувати хитрий фінт, змусивши Лі повірити, що перемогу можна здобути за рахунок швидкості та спритності, перш ніж несподівано перейти в наступ. \n\nВін повалив Лі на землю. Під оплески натовпу Лю допоміг Лі піднятися, і вони вклонилися один одному."
  SHI_main_events.18.a:0 "Почесна перемога."
  SHI_main_events.18.b:0 "Він ніколи навіть не був гравцем."
  SHI_main_events.18.c:0 "У сталі ще є честь."

  SHI_main_events.19.t:0 "Фінальний поєдинок"
  SHI_main_events.19.da:0 "Лі Цзюнь-фан нарешті зіткнувся зі своєю наперед визначеною суперницею. Школа Журавля та Школа Дракона ворогували вже десятиліттями. Було цілком доречно, що його бій із Синтією став останнім на турнірі. Він знав, що Акіґахаї буде уважно стежити за ним, як і Ло Пан. \n\nАгресія була шляхом Журавля. Ло Пан так багато уваги приділяв 'силі', і Синтія добре засвоїла ці уроки. Якби Лі так не пощастило, що він дозволив би їй завдати йому серію ударів, йому був би кінець. Як і з Лю, його тактика полягала в тому, щоб триматися подалі від неї якомога більше, завдаючи ударів лише тоді, коли вона надто захоплювалася атакою. Вона завжди любила вкладати всі сили в атаки, постійно шукаючи вирішального удару. \n\nСинтія була виснажена. Оплески, які супроводжували його остаточну перемогу, були майже оглушливими. Лі сподівався виявити великодушність до Синтії після поразки, але вона лише спохмурніла і пішла геть. Як і очікувалося, Школа Журавля виявилася поганими лузерами. \n\nАле йому не потрібно було хвилюватися про це прямо зараз. Він привів Школу Дракона до перемоги і проклав шлях для Акіґахаї, щоб та повернула їх до праведності."
  SHI_main_events.19.db:0 "Синтія Емерсон нарешті зіткнулася зі своїм наперед визначеним суперником. Школа Дракона та Школа Журавля ворогували вже десятиліттями. Було цілком доречно, що її бій із Лі став останнім на турнірі. Вона знала, що Ло Пан буде уважно стежити за нею, як і Акіґахаї. \n\nВчення Дракона прагнуло до якогось езотеричного балансу, якого не існувало. Єдиний урок, який можна було засвоїти, полягав у тому, що сила — це все, і Синтія викладе цей урок сьогодні. Лі міг намагатися скористатися слабкостями, які, як йому здавалося, він бачив, але Синтія пробилася крізь його спроби і побила його. \n\nОплески, які супроводжували її остаточну перемогу, були майже оглушливими. Синтія залишила Лі борсатися у своїй поразці, бажаючи насолодитися святкуванням перемоги. Сьогодні на її честь будуть розпиті довоєнні вина всіх смаків, і чималу їх частину вип'є сам Ло Пан."
  SHI_main_events.19.dc:0 "Школа Журавля уособлювала шлях Ші протягом трьох десятиліть історії. Синтія Емерсон була берегинею їхнього ордену. Було цілком доречно, що Лю переміг її, щоб започаткувати нову еру для Ші. Еру Сталі. \n\nЛю розумів, що Синтія мала напад там, де він мав захист. Він також знав, що Синтія знала це, і що інстинкти Журавля полягали в тому, щоб бути підступним і хитрим у бою. Тому Лю спланував для неї подвійний фінт: він мав би виглядати так, ніби потрапив у влаштовану нею пастку, дозволяючи їй завдати брудного удару в коліно, як вона й задумувала. Але в останній момент він зміг контратакувати, схопивши її за ногу і втягнувши у сталеві обійми. Він повалив її на підлогу, здобувши перемогу в ту ж мить. \n\nЛю залишив Синтію справлятися з ганьбою свого приниження. Він мусив доповісти про свій успіх старійшині, як і личить хорошому солдату. Рев натовпу був дрібницею порівняно з просуванням цілей Братства. Він сподівався, що незабаром відкриє нову еру контролю для Сталевого Палацу, а отже, і для них самих."
  SHI_main_events.19.a:0 "Це перемога для народу Ші!"
  SHI_main_events.19.b:0 "Найсильніший переміг!"
  SHI_main_events.19.c:0 "Сталь правитиме в Сан-Франциско!"

  SHI_main_events.20.t:0 "Північні варвари"
  SHI_main_events.20.d:0 "Навіть у найкращі часи Ші з недовірою ставляться до чужинців, і не мають особливої любові до некультурних дикунів. Саме такими вони бачать північні племена. Народ, який не може зрівнятися навіть із НКР, не кажучи вже про велич Імперії Ші. На них мало звертали уваги, коли відбувалося розширення в їхньому напрямку. \n\nТепер, коли наші внутрішні проблеми вирішені, а наше панування над цією територією не викликає сумнівів, погляди знову звернулися до цих місцевих жителів. Вони стоять на заваді будь-якому розширенню поселень тут. Популярна думка полягає в тому, що ми повинні просто прогнати їх або цивілізувати, як це планувала зробити НКР. Багато хто вважає простою доцільністю усунути непродуктивний народ на користь свого власного. \n\nЗвісно, хоча племена, можливо, і зазнали невдачі у своїй спробі стати господарями цієї землі, це не означає, що вони беззубі. Якщо ми спробуємо їх виселити, вони неодмінно чинитимуть опір. Більш розсудливі уми пропонують дійти з ними згоди, що в кінцевому підсумку виявиться більш вигідним, залежно від того, як ми розглядаємо отримання вигоди з цієї ситуації. Піти їм назустріч не було б популярним кроком, і все ж може виявитися більш доцільним, ніж підказують імпульси нашого народу."
  SHI_main_events.20.a:0 "Ця земля наша! Уся наша!"
  SHI_main_events.20.b:0 "Можливо, нам не варто дотримуватися певної політики?"
  SHI_main_events.20.c:0 "Ми можемо домовитися."

  SHI_main_events.21.t:0 "Повернення бродяг"
  SHI_main_events.21.d:0 "Бродяги з танкера 'PMV Valdez' знову пришвартувалися в гавані Сан-Франциско. Вони були тими, хто відвіз Обраного в його доленосну подорож, щоб знищити нафтову вишку 'Посейдон' і завадити Анклаву знищити цей світ. Ші не дуже люблять чужинців, але ці мають історію і зазвичай поводяться добре. \n\nВони лише проїздом, як це часто буває. Вони прийшли, щоб поторгувати з нашою громадою, перш ніж знову рушити далі, але нам нагадують, якими чудовими моряками вони є..."
  SHI_main_events.21.a:0 "Поторгувати з ними і помахати на прощання."
  SHI_main_events.21.b:0 "Запросіть їх допомогти очолити наше військово-морське відродження!"
  SHI_vagrant_fanservice_tt:0 "§gА. Рон Меєрс стане нашим адміралом!§!"

  ##Akigahai Events
  SHI_aki.1.t:0 "Імператорська допомога"
  SHI_aki.1.d:0 "'Хто б міг подумати, що чутки були правдивими', — Акіґахаї провела рукою по консолі 'Імператора', — 'я вважала це надто абсурдною теорією змови, щоб у неї повірити. Усі ці роки наш великий і могутній Імператор був нічим іншим, як комп'ютером...' \n\nКен Лі стояв і спостерігав, як Акіґахаї оглядає палату Імператора. Якби все було по-його, її б ніколи сюди не впустили. Обставини змусили його до цього. Сотні років таємниці опинилися під загрозою, тому що ця вискочка-фанатичка повірила, що має мандат на керівництво Ші. \n\nАкіґахаї обернулася до Кена Лі. 'Гаразд, ось як це буде працювати: відтепер я тут командуватиму. Мені не потрібно розголошувати те, що тут відбувалося, це викликало б незліченний хаос і плутанину. Але я буду... допомагати тобі тлумачити імператорські накази відтепер. Зрозумів?' \n\n'У мене немає особливого вибору в цьому питанні'. Коротко відповів Кен Лі. \n\n'Це партнерство не обов'язково має бути ворожим. Ми можемо досягти великих речей, якщо імператорська влада підтримає чесноти Школи Дракона. Ти побачиш, що це допоможе нам усім процвітати'. Акіґахаї поплескала Кена Лі по плечу і вийшла."
  SHI_aki.1.a:0 "Відтепер Акіґахаї говоритиме від імені Імператора."

  SHI_aki.2.t:0 "Зриваючи завісу Імператора"
  SHI_aki.2.d:0 "'Комп'ютер'. Акіґахаї вимовила це вголос, ніби їй потрібно було почути, щоб повірити. 'Наш великий і могутній Імператор був і завжди залишався комп'ютером'. \n\n'Неймовірно', — Лі стояв поруч із нею, оглядаючи консоль згори донизу, — 'Кен Лі брехав нам ще до мого народження! Ще до ТВОГО народження! А до ЙОГО народження мусила брехати ще купа інших людей!' \n\n'Справжня літанія брехні...' — Акіґахаї говорила з глузливою недбалістю. Ось вони стоять тут, руйнуючи багатовіковий інститут, і все, про що вона могла думати, — це наскільки безглуздим було їхнє відкриття. \n\n'...ми закінчили збирати людей у східному крилі, тож... гей, а де Імператор?' — Гао ввалився до кімнати. \n\n'Ти дивишся на нього!' — Лі вказав на комп'ютерну консоль. Гао, здавалося, завмер і витріщився, не в змозі осягнути це відкриття. \n\n'Ну, ми не можемо стояти тут вічно і ламати голову над цим фарсом', — Акіґахаї попрямувала до виходу з кімнати, — 'нам потрібно організувати кілька судів...'"
  SHI_aki.2.a:0 "Акіґахаї принесла правосуддя у Сталевий Палац!"
  SHI_ken_lee_exiled_tt:0 "§gЗа те, що підвів народ і увічнював грандіозний обман, Кен Лі буде вигнаний з Ші. Ніколи більше Ші не будуть введені в оману його зловісною кабалою.§!"

  SHI_aki.222.t:0 "Кінець місії"
  SHI_aki.222.d:0 "Старійшина Френсіс знав, що Акіґахаї прийде за Братством після того, як витіснить Кена Лі зі Сталевого Палацу. Він планував їхній наступний крок, але був вельми здивований, почувши, що Акіґахаї зробила їм пропозицію. \n\nЇї умови полягали в тому, що вона дозволить Братству покинути Сан-Франциско майже неушкодженими. Вона навіть дозволить їм забрати своє обладнання. Проте вона також дала зрозуміти, що кожному, хто народився на землі Ші, буде запропонована можливість назавжди покинути Братство і повернутися до суспільства Ші як звичайний громадянин. \n\nФренсіс вирішив погодитися. Бункер буде очищено від придатних для використання матеріалів, комп'ютери розібрано і відформатовано. Чужинцям нічого не залишиться. Дехто з Братів прийняв пропозицію Акіґахаї, або так він припускав, враховуючи їхню відсутність на перекличках. Він не звинувачував їх, проте боявся того, що з ними станеться, коли про це дізнається Коло Сталі. \n\nВін наглядав за тим, як останні залишки інвентарю закріплюють для транспортування, а лицар Лю допомагав йому. '...Я міг би дозволити їм думати, що ти мертвий'. Сказав він Лю. 'Жити в бункері Лост-Хіллз буде нелегко, особливо якщо твердолобі стали ще гучнішими. Це твоя батьківщина, ніхто б тебе не засудив за-' \n\n'Мій дім — це Братство'. Відповів Лю, випроставшись. Він викликав легку посмішку у свого старійшини."
  SHI_aki.222.a:0 "Тоді вирушаємо додому."
  SHI_brotherhood_leaves_tt:0 "§gВідділення Сан-Франциско евакуюється з нашої території, щоб більше ніколи не повернутися.§!"

  SHI_aki.223.t:0 "Вигнанці Сан-Франу"
  SHI_aki.223.d:0 "Через політичні махінації на території Ші бункер у Сан-Франциско був змушений покинути місто. На щастя, їм дозволили піти зі своїм обладнанням, і вони подбали про те, щоб знищити все, що в іншому випадку потрапило б до рук місцевих жителів. Старійшину Френсіса та його солдатів обережно доставили до Лост-Хіллз, і тепер вони відновлять свої обов'язки тут."
  SHI_aki.223.a:0 "Ласкаво просимо, Брати!"
  SHI_brothers_arrive_tt:0 "§GОфіцери з відділення Сан-Франциско приєднаються до наших лав!§!"

SHI_aki.3.t:0 "Пекло Ло Пана"
  SHI_aki.3.d:0 "Синтія шпорталася провулком, відчайдушно намагаючись утримати Ло Пана на ногах. Він був важким старим виродком, а вона ніколи не була наймускулястішою дівчиною. Але оскільки Школа Журавля палала, а фанатики Дракона жадали крові, вона не могла просто відпустити його. \n\n'Синтіє...' — пролунав виснажений голос Ло Пана, — 'ти маєш відпустити, дівчинко...' \n\n'Ти жартуєш!?' Вона намагалася йти далі. \n\n'Ні... ні... я закінчив...' Ніби вклавши всю свою вагу в те, щоб вислизнути з її хватки, Ло Пан впав на землю. Синтія опустилася на коліна, намагаючись підняти його, але він здавався важчим на дві тонни. \n\n'...все скінчено. Навіть найсильніша людина на землі не є куленепробивною...' Ло Пан болісно засміявся, схопившись за рану, що кровоточила. \n\n'Ти не можеш просто здатися!' — крикнула на нього Синтія. 'Це слабкість! Жалюгідно! Це...' На очі навернулися сльози. \n\n'...то хто тепер... бісовий слабак?' Зібравши залишки сил, Ло Пан сів достатньо, щоб штовхнути Синтію в плече. 'Ти... моя найсильніша учениця... якщо ВОНА змогла витерпіти 30... ти зможеш витерпіти 60... тільки не... розчаруй мене...' Ло Пан впав востаннє. \n\nСинтія деякий час намагалася придумати, як витягнути те, що від нього залишилося, але почала чути крики та галас, що наближалися. Вона ніколи б не вижила з його трупом на спині... і тому вирішила виконати його останнє бажання."
  SHI_aki.3.a:0 "Від попелу до вуглин..."
  SHI_lo_pan_fucking_dies_tt:0 "§gЛо Пан помирає жалюгідною смертю. Поки Школа Журавля горить, його учні розходяться. \n\nАле, можливо, сьогодні також запалав вогонь помсти...?§!"

  SHI_aki.4.t:0 "Задушений бюрократією"
  SHI_aki.4.d:0 "Ло Пан продовжував дивитися на папір. Ця маленька, жалюгідна річ загрожувала знищити все, чого він так довго досягав. \n\nЦе було повідомлення від нового уряду Акіґахаї. Він порушив якийсь їхній безглуздий указ про захист 'культурно значущих місць' Ші. Школа Журавля розширилася на місце якогось занедбаного святилища. Тієї нікчемної руїни вже не було, але Акіґахаї вимагала відновити її за рахунок їхньої будівлі. \n\n'Тато знає кількох абсолютно фантастичних юристів!' Синтія намагалася запропонувати рішення їхньої проблеми. 'Вони перемагали брамінських баронів, полковників і навіть супермутантів у суді! Вони-' \n\n'Заради всього святого, Синтіє, не будь ідіоткою. Це Імперія Ші. Дружки-юристи твого батька тут навіть не мають статусу'. \n\n'Ну і який тоді твій великий план? Сидіти на дивані і перечитувати цей лист цілий день?' \n\n'...ми будемо боротися з цим. Зубами й кігтями, ми будемо боротися...' Ло Пан вимовив ці слова вголос, але сам у них не вірив. У глибині душі він відчував, що дійшов до кінця. Акіґахаї збиралася задушити його фінансову імперію всіма доступними їй ресурсами."
  SHI_aki.4.a:0 "Усе скінчено."

  SHI_aki.5.t:0 "Ефективність"
  SHI_aki.5.d:0 "Надійшли звіти про День Прибуття; фестиваль, присвячений дню, коли Ші-Хуан-Ді прибув на ці далекі береги. Спочатку це був день шанобливого споглядання нашого походження, але Ло Пан сприяв тому, щоб він став комерційним святом із великою кількістю споживання алкоголю. \n\nУказ Акіґахаї полягав у забороні публічного вживання алкоголю в цей день, а Гвардія мала виписувати суворі штрафи всім, кого спіймають у нетверезому стані. Вона вважала це достатньо невтручальним, але водночас таким, що дає чіткий сигнал. \n\nНа жаль, схоже, це мало слабкий ефект. Мало того, що рівень споживання алкоголю мінімально знизився порівняно з попередніми дослідженнями, але й у наступні дні, здавалося, цим заходам взагалі не приділялося уваги. Ніби таке покарання вважалося прийнятною ціною за продовження їхнього ганебного пияцтва. \n\nАкіґахаї знову і знову ставила собі запитання. Було так рано в її кампанії, але така відсутність досягнень бентежила. Чи могла вона бути впевненою, що будь-який її захід увінчається успіхом, якщо вона буде вдаватися до такого млявого впровадження?"
  SHI_aki.5.a:0 "Не бійся рости повільно."
  SHI_dragon_shame_a_tt:0 "§GРух «Нове життя» забезпечить додаткові -2% до Фактора опору!§!"
  SHI_aki.5.b:0 "Якщо вони такі твердолобі, нам залишається лише проломити їхні черепи."
  SHI_dragon_rites_b_tt:0 "§GРух «Нове життя» забезпечить додаткові -5% до Витрат кришок!§!"

  SHI_aki.6.t:0 "Дебати"
  SHI_aki.6.d:0 "Зусилля Акіґахаї щодо впровадження праведності у свідомість громадськості почалися з того, що її учні час від часу розходилися, щоб поширювати свої ідеали. Їй потрібно, щоб люди постійно думали про переваги заходів, що вживаються навколо них, щоб вони могли розпізнати ще одного Ло Пана, що росте в їхньому середовищі. \n\nПроте вона виявила більш тривожну тенденцію. Замість того, щоб звикати до її ідеалів, здається, представники громадськості обговорюють їх. Дехто стверджує, що її учні демонструють однодумну, рабську відданість її новому порядку, і вказують на те, що навіть філософія Ло Пана мала свої переваги. \n\nЗіткнувшись із такою опозицією, Акіґахаї обмірковує власний підхід..."
  SHI_aki.6.a:0 "Такі дебати насправді продуктивні."
  SHI_dragon_right_a_tt:0 "§GРух «Нове життя» забезпечить додаткові +2% до Швидкості досліджень!§!"
  SHI_aki.6.b:0 "Можливо, наше повідомлення має бути більш переконливим..."
  SHI_dragon_right_b_tt:0 "§GРух «Нове життя» забезпечить додаткові +2% до Атаки армії та +2% до Відновлення організації!§!"

  SHI_aki.7.t:0 "Закриті серця"
  SHI_aki.7.d:0 "Акіґахаї закликала підданих Ші до великого акту Жень; їх попросили зробити внесок у фонд, який матиме на меті покращити життя їхніх знедолених співвітчизників. \n\nАле деякі з тих, хто має можливості, відмовляються це робити. Зазвичай це старі союзники і симпатики Ло Пана, ці сім'ї ревно охороняють свої драконячі скарби і огризаються на будь-які спроби розтиснути їхні міцно стиснуті кулаки. \n\nБільш войовничі послідовники Акіґахаї припускають, що ці люди не заслуговують на те, щоб володіти своїм багатством, і що було б краще забрати його і розподілити там, де це необхідно."
  SHI_aki.7.a:0 "Було б не в дусі Жень так їх карати."
  SHI_dragon_humanity_a_tt:0 "§GРух «Нове життя» забезпечить додаткові +5% до Доходу кришок!§!"
  SHI_aki.7.b:0 "Давайте розкриємо їхні серця та долоні!"
  SHI_dragon_humanity_b_tt:0 "§GРух «Нове життя» забезпечить додаткові -5% до Фактора споживчих товарів!§!"

  SHI_aki.8.t:0 "Гординя"
  SHI_aki.8.d:0 "Щоб викликати у людей почуття сорому, Акіґахаї почала оприлюднювати найгірші зловживання порядку Ло Пана. Поширюються чутки про знущання його поплічників, експлуатацію простих людей та розграбування наших громад каліфорнійськими бізнесменами. \n\nАле виникла протидія. Замість того, щоб схилити голови від сорому, старі послідовники Ло Пана спробували заявити про себе. Вони стверджують, що Акіґахаї сліпа до тих переваг, які шлях Ло Пана приніс народу Ші. \n\nЦе, у свою чергу, розлютило її власних послідовників, які вважають, що якщо їхні опоненти не можуть відчути Ці, то ми повинні подбати про те, щоб вони це зробили."
  SHI_aki.8.a:0 "Ми повинні керувати з чеснотою та пристойністю."
  SHI_aki.8.b:0 "Змусьте їх опустити голови. Змусьте їх стати на коліна."
  SHI_dragon_shame_b_tt:0 "§GРух «Нове життя» забезпечить додаткові -3% до Цільового опору!§!"

  SHI_aki.9.t:0 "Оновлене життя"
  SHI_aki.9.da:0 "Акіґахаї дивилася на вулиці внизу, спостерігаючи з вікна своєї кімнати в комплексі Школи Дракона. \n\nНаскільки вона могла бачити, життя в Сан-Франциско майже не змінилося. Вулиці були брудними, вона помітила п'яницю, хтось сперечався з місцевим торговцем про ціни. Цього було достатньо, щоб змусити її задуматися, чи досягла ця кампанія хоч чогось. \n\nПотім вона побачила Лі. Він та якась жінка вели зграйку дітей вулицями, збираючи сміття по дорозі. Можливо, клас з однієї з місцевих шкіл. Це була така дрібниця в какофонії діяльності, але це було хоч щось. \n\nАкіґахаї посміхнулася, нагадуючи собі, що з часом можна побудувати кращі речі."
  SHI_aki.9.db:0 "'У місті відчувається напруга', — сказав Лі Акіґахаї, коли вони разом виконували щоденні вправи, — 'ті, хто чинить опір нашому руху. Вони називають його тиранічним, інвазивним. Ходять розмови про повернення до старих бійок'. \n\n'Опір завжди мав бути, навіть на ввічливу пропозицію'. Акіґахаї повернулася до Лі і почала їхній легкий спаринг; удари без сили, щоб він міг попрактикувати блоки. \n\n'...але, можливо, ми заходимо надто далеко?' — запропонував Лі, відбиваючи її обережні удари. 'Ти казала мені, що «Ї» означає, що я маю піддавати сумніву правильність усього, отже-' Лі раптом був заскочений зненацька силою останнього удару Акіґахаї і відсахнувся. Вона здавалася незворушною. \n\n'Сумніви мають сенс, Лі, але не втрачай з поля зору те, що є важливим. Без певної сили вони можуть ніколи нічому не навчитися'. Лі кинув на неї багатозначний погляд. Він би прокоментував її власні чесноти, але відчув, що це може викликати подібну реакцію."
  SHI_aki.9.dc:0 "Лі, Гао та Акіґахаї сіли обідати у Школі Дракона. Зазвичай такі моменти були досить приємними: їжа була доброю, і вони зазвичай вели цікаві розмови. \n\nАле сьогодні все це було затьмарене звуком ударів батогом знадвору. Досить тихий у будівлі, але звук ударів по плоті та крики болю дівчини-жертви змушували Лі здригатися щоразу, коли він їх чув. \n\nВін подивився на Акіґахаї, винуватицю цієї жорстокості. Вона вирішила, що її найновіша учениця не виявила належної поваги до чеснот, і тому наказала її покарати. Таке ревне виконання правил стало звичним явищем у її суспільстві Ші. По всьому місту Гвардія стежила за порушеннями правил і виписувала штрафи, здійснювала арешти та била тих, хто не корився. І все ж жінка була спокійною та безтурботною, задоволеною такими заходами для досягнення 'милосердного повернення до традицій', яке вона так цінувала. \n\nТим часом Лі Цзюнь-фан роздумував, скільки ще цього він зможе витримати."
  SHI_aki.9.a:0 "Один крок у нашій подорожі в 1000 миль."
  SHI_aki9_a_tt:0 "§GРух «Нове життя» забезпечить додаткові +10% до Щомісячного приросту населення, +0.02% до Зростання підкорення та +0.05 до Отримання політичної влади!§!"
  SHI_aki.9.b:0 "Ми йдемо серединним шляхом."
  SHI_aki9_b_tt:0 "§GРух «Нове життя» забезпечить додаткові +2.5% до Випуску заводів та +5% до Фактора політичної влади!§!"
  SHI_aki.9.c:0 "Дисципліна і порядок дарують нове життя."
  SHI_aki9_c_tt:0 "§GРух «Нове життя» забезпечить додаткові +5% до Випуску заводів та +5% до Фактора політичної влади!§!"

  SHI_aki.10.t:0 "Пам'ятайте Дракона"
  SHI_aki.10.d:0 "У наших землях зчинився великий переполох, коли гвинтокрил привіз іноземних посланців, які шукали Каґу. Акіґахаї, учениця Дракона і майстер Школи Дракона, прийшла шукати союзу з Каґою, який є учнем самого Дракона. Коли вони зустрічалися востаннє, Акіґахаї була ще маленькою дівчинкою. \n\nТепер вона доросла і грізна жінка, яка пропонує допомогти амбіціям Каґи, якщо він допоможе її амбіціям."
  SHI_aki.10.a:0 "Давайте об'єднаємося проти старих ворогів!"
  SHI_aki.10.b:0 "Каґі не потрібна така угода!"

  SHI_aki.11.t:0 "Чи солодка помста?"
  SHI_aki.11.da:0 "'Це справді те, чого ти хочеш?' — запитав Дракон свою ученицю, коли вони сиділи разом у Школі Дракона. 'Тобі не потрібно відчувати себе зобов'язаною робити це заради мене'. \n\n'Як ти можеш так говорити!?' — недовірливо запитала Акіґахаї. 'Ця людина позбавила тебе гідності і занурила Ші в десятиліття темряви! Всі злочини Ло Пана можна покласти на їхні брудні плечі!' \n\n'Чи можна?' Дракон залишався спокійним протягом усієї цієї розмови. 'Вони не знали, що Ло Пан зробить з їхнім контролем, навіть якщо він завжди був бандитом. Ми також не знаємо їхніх справжніх мотивів, і, можливо, вони загубилися в часі. Але важливіше за все', — він подивився їй в очі, — 'моя невдача є моєю власною. Я не зміг подолати цього Обраного всі ті роки тому, і це сповнило мене соромом. Ти не можеш звинувачувати їх у перемозі в чесному поєдинку'. \n\nАкіґахаї багато в чому знову відчула себе тією маленькою дівчинкою. Їй хотілося тупнути ногою, накричати на нього. Так довго вона хотіла отримати шанс вбити цього 'Обраного' і поставити крапку, але тепер чоловік, заради якого вона думала, що бореться, радив їй стримати руку. \n\nАле якщо вона не послухається його зараз, якою ученицею вона буде? Наскільки порожньою є її відданість, якщо вона наполягає на помсті, коли він сам цього не хоче?"
  SHI_aki.11.db:0 "'Ти думаєш, це справді те, чого він би хотів?' Лі розмовляв з Акіґахаї у Школі Дракона. 'Акт дріб'язкової помсти?' \n\n'Не говори про його бажання'. Тон Акіґахаї видавав її гнів. 'Ти ніколи не знав його. А я знала'. \n\n'Гаразд. Тоді скажи мені: чи хотів би чоловік, який говорив про те, щоб чинити правильно зі своїм народом, проливати безглузду кров через це?' Лі не злякався ворожості своєї наставниці. Він знав, що вона збирається зробити помилку. 'Ти казала мені, що він завжди прагнув чинити правильно. Чи правильно вбивати того, хто стоїть на колінах?' \n\n'Ця людина відповідальна за десятиліття темряви для нас'. \n\n'Ло Пан відповідальний за це. Обраний не повертався сюди всі ці роки. Хто ми такі, щоб перекладати це на нього?' \n\nАкіґахаї проклинала той факт, що він так сильно нагадував їй його. Відлуння Дракона в Лі загрожувало втримати її від помсти, якої вона шукала так довго. Вона не могла заперечувати його мудрість, але її серце так сильно цього хотіло."
  SHI_aki.11.a:0 "Можливо, ми повинні пробачити і забути."
  SHI_aki.11.b:0 "Ні, я чекала цього занадто довго..."

  SHI_aki.12.t:0 "Значення Ші"
  SHI_aki.12.d:0 "Акіґахаї повела Лі тренуватися в дивне місце. У ще не занедбану будівлю в одному з найгірших районів Сан-Франциско. З огляду на зламану підлогу та уламки, це було непогане місце для тренувань, але були й інші способи зімітувати таке середовище. Тому, перестрибуючи через розбиту стіну, він думав про те, який був сенс Акіґахаї приводити його сюди. \n\n'...ти ніколи не замислювався, чому тобі раді в нашому русі?' Вона раптом запитала, сидячи і спостерігаючи, як він працює. \n\n'...е-е, так, така думка спадала мені на думку'. Він перервав свої вправи і приєднався до неї. Їхні ксенофобні союзники часто сумнівалися, чи варто дозволяти такому напівкровці, як він, спілкуватися з ними, але Акіґахаї досі нічого не пояснила ні їм, ні йому. \n\n'Як для групи, присвяченої збереженню наших стародавніх звичаїв, наші члени не до кінця розуміють нашу історію', — Акіґахаї засміялася, коли Лі сів поруч із нею, — 'багато хто думає, що екіпаж Ші-Хуан-Ді побудував це місце самотужки, але були залучені й інші. Навіть хабологи'. Акіґахаї плюнула на підлогу, згадавши про них. 'Але приєдналися й інші вцілілі, включаючи моїх предків. Вони були тим, що залишилося від цього місця; Джапантаун, або Ніхонмачі'. \n\n'А! То ось чому твоє ім'я таке?' \n\n'Так', — якийсь надокучливий Послідовник Апокаліпсису якось сказав їй, що це неправильне японське ім'я, але така педантичність не мала значення, — 'ті вцілілі здебільшого асимілювалися в культуру Ші-Хуан-Ді, але ми є такою ж частиною цієї спадщини, як і вони. Як і ти, незалежно від того, ким є твоя мати'. \n\n'Що ж, добре знати', — посміхнувся Лі, — 'але як щодо справжніх каліфорнійців? Як моя мама...?'"
  SHI_aki.12.a:0 "Я не ненавиджу народ Каліфорнії..."
  SHI_xenophobes_hate_this_tt:0 "§gКсенофобним союзникам Акіґахаї цей підхід §Rне сподобається§!!§!"
  SHI_aki.12.b:0 "...але Республіці не можна довіряти."
  SHI_xenophobes_like_this_tt:0 "§gКсенофобним союзникам Акіґахаї цей підхід §Mсподобається§!\n§RАле будьте обережні! Їхнє схвалення може виявитися палицею з двома кінцями!§!§!"

  SHI_aki.131.t:0 "Створення наративу"
  SHI_aki.131.d:0 "Акіґахаї поклала надруковані нею брошури на стіл перед собою. Її учні почали їх читати. 'Це прелюдія до нашої великої боротьби. Усі повинні знати про злочини НКР і чому ми маємо готуватися до їхнього приходу'. \n\n'Шифу, я...' Лі відвів погляд від брошури і подивився на неї. Він не наважувався сказати це, але знав, що повинен. 'Я не впевнений, що згоден. Хоча це правда, що НКР не ідеальна, вони не такі вже й жахливі, щоб ставити на них хрест. Нам точно не потрібно першими йти на них війною!' Інші учні почали перешіптуватися між собою. \n\n'Ти завжди був добрим, Лі', — Акіґахаї не здавалася стурбованою його запереченням, — 'але такий шлях світу. Ми не можемо бути впевнені, що НКР завжди буде розумним сусідом, коли вони накинули оком на стількох інших. Що б ти сказав мертвим, якби наше судження про НКР виявилося таким наївним?' Лі опустив очі. У словах Акіґахаї була певна логіка, і все ж війна означала б багато смертей у будь-якому випадку. Чи правильно було обмінювати душі мешканців Нової Каліфорнії на свої власні? \n\n'Брошури будуть роздані завтра', — продовжила Акіґахаї. 'Наш народ знатиме про злочини НКР, а НКР знатиме, що ми бажаємо їм зла. Готуйтеся з усіх сил до майбутньої бурі'. Її учні вклонилися. Більшість з поваги, але дехто з небажанням."
  SHI_aki.131.a:0 "Чи буде наша війна справедливою?"

  SHI_aki.13.t:0 "Пропаганда Ші!"
  SHI_aki.13.d:0 "Новий лідер Ші, Акіґахаї, почала поширювати брошури та інші матеріали, спрямовані на те, щоб 'оприлюднити злочини НКР'. Окрім того, що вони сповнені жахливої брехні про нашу Республіку, наші аналітики впевнені, що це прелюдія до військової провокації. \n\nШі під проводом Акіґахаї готуються до війни з Новою Каліфорнійською Республікою."
  SHI_aki.13.a:0 "Тоді ми маємо бути готові."

  SHI_aki.14.t:0 "Привласнені активи"
  SHI_aki.14.d:0 "Зараз ми володіємо підприємствами, з якими насправді не знаємо, що робити. Усе, що ми знаємо, це те, що ми не хочемо, щоб вони опинилися в руках поплічників Ло Пана. \n\nБуло запропоновано поставити на чолі них кількох лоялістів, дозволивши їм керувати від нашого імені. На жаль, на нашому боці не так багато проникливих бізнесменів, тому ми не можемо гарантувати, що ці люди знатимуть, що роблять. \n\nДеякі з їхніх старих конкурентів виступили з пропозицією придбати ці підприємства самостійно, але ми знаємо, що вони не збираються керувати ними, а просто закриють їх і розпродадуть те, що становить цінність. Це може зашкодити нашому промисловому потенціалу, але гроші можуть бути корисними для інших цілей. Яку отруту ми оберемо?"
  SHI_aki.14.a:0 "Ми можемо знайти власних поплічників."
  SHI_aki.14.b:0 "Розпродайте їх."

  SHI_aki.15.t:0 "Ксенофобна пожежа"
  SHI_aki.15.d:0 "Сьогодні в Сан-Франциско відбулася демонстрація. Сотні людей вийшли на вулиці, закликаючи до вигнання всіх іноземців зі священної землі Ші. Є відчуття, що настав час очистити цю країну і нарешті позбутися тих, хто роками паплюжив нас. \n\nЧи цього хотіла Акіґахаї — невідомо, але її політика заохотила цих людей почуватися вільними та комфортними у висловлюванні своєї ненависті. Навіть тим, хто не є вихідцем з НКР, стає некомфортно в межах наших кордонів через переслідування та знущання з боку наших ревних громадян."
  SHI_aki.15.a:0 "Ми дозволили цьому вийти з-під контролю?"

  SHI_aki.16.t:0 "Зраджений рух"
  SHI_aki.16.d:0 "Сьогодні в Сан-Франциско відбулася демонстрація. Сотні людей вийшли на вулиці, засуджуючи зраду Акіґахаї щодо власного народу. Вони стверджують, що, незважаючи на обіцянки повернутися до традицій, вона пішла на поступки іноземцям і заплямувала честь нації. \n\nЗ їхнього боку це серйозне перебільшення, але її старі ксенофобні союзники ніколи не були найрозсудливішими людьми. Попри це, багато хто відмовляється від справи Акіґахаї і формує опозицію до її правління."
  SHI_aki.16.a:0 "Усім не догодиш."

SHI_aki.17.t:0 "Просіюючи попіл"
  SHI_aki.17.d:0 "Акіґахаї тимчасово працювала з нині занедбаного Залу Конгресу в Шейді-Сендс. Належало виконати багато роботи, щоб взяти ситуацію під контроль. Її люди розперезалися, на превеликий її жаль, і залишили по собі величезний безлад. \n\nВона саме переглядала звіти та запити від різних регіональних командирів, коли увійшов Лі. 'Тебе довго не було', — зауважила вона. Вона звернула увагу на його похмурий вираз обличчя. 'Що сталося?' \n\n'Мої батьки мертві', — холодно відповів він. 'Вони намагалися втекти з країни. Ті... «люди» напали на них та на інших, хто був з ними'. \n\n'...мені так шкода'. Акіґахаї підвелася і зробила крок до нього. 'Знай, що це не моя-' \n\n'Хіба ні!?' — огризнувся Лі. 'ТИ розпалила полум'я їхньої ненависті! Якщо ти цього не передбачила, то ти просто неймовірна дурепа!' \n\n'Так! Так. Я зробила помилку. Я... я зроблю все можливе, щоб усе-' \n\n'Усе виправити?' Лі недовірливо подивився на неї. 'Цього не виправити. Ти не зможеш повернути мертвих'. Лі розвернувся і вийшов з імпровізованого кабінету Акіґахаї. Він не відповів, коли вона покликала його. \n\nАкіґахаї більше ніколи його не побачить."
  SHI_aki.17.a:0 "Перемога ще ніколи не була такою гіркою."
  SHI_lee_leaves_tt:0 "§gЛі Цзюнь-фан залишає нашу службу, щоб ніколи не повернутися.§!"

  SHI_aki.18.t:0 "Наша Нова Каліфорнія"
  SHI_aki.18.da:0 "«Правила належної соціальної поведінки», — Міранда, мати Лі, прочитала вголос назву брошури, — 'тут є всяка нісенітниця, починаючи від того, як їсти на публіці, і закінчуючи «порадами» щодо того, як виявляти «повагу» до ваших «місцевих правоохоронних органів»'. Вона поклала брошуру на стіл і поглянула на Лі, який сидів навпроти. 'Можливо, я й покинула Республіку, але я не хотіла бачити, як її руйнують, тілом і душею. Що взагалі відбувається?' \n\n'Нам принесли Нове Життя', — сардонічно зауважив Лі. 'Нас рятують від життя в лінощах і марнотратстві'. \n\n'Хіба ти не можеш нічого зробити? Вона тебе не послухає?' \n\n'Думаєш, я не пробував? Я не знаю, чи та жінка, в яку я вірив, зникла, чи я ніколи її по-справжньому не знав. У будь-якому випадку, вона твердо вирішила «все виправити»'. Лі відкинувся на спинку стільця. Він ще ніколи не відчував себе настільки чужим у власному домі. Від Сан-Франциско до Шейді-Сендс, Акіґахаї працювала над впровадженням нового соціального порядку. Досягне вона успіху чи ні, але у своєму прагненні до моральної праведності вона неодмінно посіє багато страждань. \n\nІ він допоміг їй зайти так далеко."
  SHI_aki.18.db:0 "Акіґахаї інкогніто була присутня на зібранні дхармістів у Шейді-Сендс. Вона працювала над спонсоруванням цих груп, але не мала особистої оцінки їхніх успіхів. Наскільки вона знала, ці люди могли привласнювати її гроші і нічого не робити, або, що ще гірше, розпалювати незгоду проти окупації Ші. Вона ніколи не покладалася в усьому на підлеглих, тому вирішила проявити ініціативу і подивитися на них на власні очі. \n\n'...гаразд, усі, давайте почнемо'. М'який голос проповідника привітав присутніх. Перед натовпом стояв чоловік з коротким каштановим волоссям і бородою, на вигляд Акіґахаї йому було під 50. 'Для тих, хто вперше в нашому Храмі: мене звати Аарав. Я буду вашим провідником до духовного просвітлення через Дхарму. Як казав Дхарма: «Ті, хто пасе свою отару, знають пастуха». Трохи кумедно це казати, адже саме я виконую роль вашого пастуха'. Цей жарт викликав легкий сміх серед слухачів. \n\nАарав говорив кілька хвилин, поки його проповідь не перервав камінь, що розбив вікно. 'ГОРІТЬ У ПЕКЛІ, КОЛАБОРАНТСЬКІ ПОКИДЬКИ!' — пролунав різкий голос знадвору. Відвідувачі храму загомоніли і засуєтилися, тоді як Аарав підняв руки, закликаючи їх до спокою. Деякі інші пішли прибирати безлад. \n\n'...Дхарма казав: «Фермер, який сіє ввічливість, легко ходитиме, коли сезон закінчиться». Я вірю, що наш друг там, надворі, забув цей урок, як і багато хто інший. Те, що сталося з Ші, є прикрістю, але ми не повинні дозволити цьому призвести до смертей і опору. У смиренні ми можемо знайти новий початок...' Акіґахаї переконалася, що принаймні Аарав уособлював те, чого вона хотіла від усього цього."
  SHI_aki.18.a:0 "Новий світанок вітає Нову Каліфорнію."

  SHI_aki.19.t:0 "Протекціонізм Ші!"
  SHI_aki.19.d:0 "Новий уряд Ші оголосив про низку заходів, спрямованих на 'захист народу Ші'. На практиці це означає, що наші економічні інтереси зараз перебувають під активною облогою; їм не просто пасивно завдають шкоди, а навмисно підривають. Заклики до військової відплати за такі заходи стають дедалі гучнішими і масовішими."
  SHI_aki.19.a:0 "Це вже занадто!"
  SHI_aki.19.b:0 "Нам потрібен мир, ми повинні зберегти мир..."

  SHI_aki.20.t:0 "Братство покидає нас!"
  SHI_aki.20.d:0 "Через стан війни з їхньою братньою організацією, усі члени відділення Сан-Франциско відмовляються нам допомагати."
  SHI_aki.20.a:0 "Цього слід було очікувати."
  SHI_int_stab_loss_aki_tt:0 "§gВтрата стабільності залежить від половини популярності §RІнтелектуалів§!.§!"

  SHI_aki.21.t:0 "Обрана назва"
  SHI_aki.21.d:0 "Ші завжди залишатимуться Ші. Але їхня держава була новою, утвореною після приниження Сталевого Палацу та піднесення волі народу. Тому люди повинні самі обрати нову назву для країни, в якій житимуть. \n\nВчений комітет, скликаний для розгляду варіантів для голосування, отримав багато пропозицій. Значну частину з них визнали безглуздими, інші — просто непродуманими. Але надійшла одна пропозиція, яка відповідала прагненням Акіґахаї не менше, ніж іншим. \n\nКаліфорнія була відома Лаоваям як земля золота. Тут знаходили золото і про нього розповідали в стародавніх легендах. Наші предки шанували жовтий колір, Дракона, що уособлював стародавнього Імператора і став символом колишнього Імператора Ші. \n\nЗвідси й пропозиція: Хуанлун. Республіка Золотого Дракона. Прапор, який обрали до неї, був заснований на тому, що ніс заповзятливий повстанець, який приєднався до штурму Сталевого Палацу і який став об'єднавчим символом для решти."
  SHI_aki.21.a:0 "Наші традиції переплелися з історією нашого нового дому."

  #SanFran BoS Events

  SHI_franbos.1.t:0 "Ші поповнюють наші лави!"
  SHI_franbos.1.d:0 "Старійшина Френсіс із відділення Сан-Франциско нещодавно став політичною силою в суспільстві Ші. Він повідомив Раді Старійшин, що йому надано ефективну владу над суспільством Ші, і відтепер він працюватиме над їх повною інтеграцією з Лост-Гіллз. Хоча рядові максоніанці й бурмочуть про те, що це може розбавити наше Братство, більшість готові побачити переваги від контролю над Затокою та її ресурсами, а можливо, навіть від залучення їх до майбутніх кампаній."
  SHI_franbos.1.a:0 "Ми вітаємо такий розвиток подій."

  SHI_franbos.2.t:0 "Візит до Арройо"
  SHI_franbos.2.d:0 "Старійшина Френсіс особисто вирушив на зустріч із керівництвом Арройо, щоб побачити все на власні очі. Він вручив їм медаль, виготовлену спеціально для Обраного. Її було передано на знак визнання їхньої допомоги Братству, особливо в Сан-Франциско, та їхньої ролі в усуненні екзистенційної загрози від Анклаву. Було проведено велику церемонію, з безліччю рукостискань та знайомств. \n\nЗгодом старійшині Френсісу дозволили оглянути нові технології, розроблені в Арройо. GECK, який знайшов Обраний, дав початок новій, передовій державі, яка могла зрівнятися з самими Ші. Там було багато чого повчитися, а серед друзів деякими речами можна було й поділитися."
  SHI_franbos.2.a:0 "За Арройо!"

  SHI_franbos.3.t:0 "Сталь Сан-Франциско"
  SHI_franbos.3.d:0 "Нещодавно прибув старійшина Френсіс із відділення Братства в Імперії Ші. Він привіз із собою спеціально виготовлену медаль, якою нагородив Обраного на знак визнання його зусиль у допомозі їм усі ці десятиліття тому, і, звичайно ж, їхньої ролі у знищенні Анклаву. Була організована грандіозна церемонія, під час якої відбулося офіційне вручення цієї медалі, і того дня між Арройо та Ші було налагоджено багато дипломатичних зв'язків. Зайве й казати, що в нас є друзі в Сан-Франциско."
  SHI_franbos.3.a:0 "За Ші!"

  SHI_franbos.4.t:0 "Особисте бажання"
  SHI_franbos.4.d:0 "Поки йшли приготування до зв'язку з Лост-Гіллз, Френсіс чекав свого часу, сидячи разом із Кеном Лі у Сталевому Палаці. 'Чого ти очікуєш від цього?' — раптом запитав його Кен Лі. \n\n'О, я просто сподіваюся, що Старійшини зможуть прийняти узгоджене рішення з цього питання!' — розсміявся Френсіс. \n\n'Але в тебе ж, напевно, є якісь власні вподобання? Я, наприклад, не в захваті від перспективи втягнути Ші у збройний конфлікт, навіть якщо бачу його неминучість на горизонті. Що б обрав ти, якби мав таку можливість?' \n\nЦікаве запитання, мусив визнати Френсіс. Особисто він не мав бажання мститися НКР. Він не прагнув війни, але, як і сказав Кен Лі, імперські амбіції НКР одного дня можуть стати для них загрозою. Мир може бути лише тимчасовою ілюзією. Або ж він міг стати їхнім найкращим шансом підготуватися."
  SHI_franbos.4.a:0 "Я думаю, що мир — це найкраще рішення."
  SHI_encourage_peace_tt:0 "§gЦе змусить Лост-Гіллз дозволити вам завершити фокус §Y\"Назустріч остаточному миру\"§!, хоча це обов'язково лише для ШІ!§!"
  SHI_franbos.4.b:0 "Війна — це єдиний спосіб вирішити все."
  SHI_encourage_war_tt:0 "§gЦе змусить Лост-Гіллз дозволити вам завершити фокус §Y\"Війна на горизонті\"§!, хоча це обов'язково лише для ШІ!§!"
  SHI_franbos.4.c:0 "Не нам приймати це рішення."
  SHI_let_bos_choose_tt:0 "§gШІ Лост-Гіллз просто кине чортову монетку, напевно. Обирайте це, якщо вам пофіг або якщо ви граєте в мультиплеєр.§!"

  SHI_franbos.5.t:0 "Старійшина Френсіс просить роз'яснень щодо політики НКР!"
  SHI_franbos.5.d:0 "Старійшина Френсіс із відділення Сан-Франциско звернувся до Ради Старійшин із проханням надати йому директиву стосовно НКР. У цей період хисткого стану між війною та миром він хоче знати, чи слід йому готуватися до збройного конфлікту, чи самостійно шукати примирливих заходів. \n\nРада Старійшин раніше мала розбіжності з цього питання, як і майже з будь-якого іншого. Але, схоже, вони прийняли рішення..."
  SHI_franbos.5.a:0 "Скажіть Френсісу, що ми хочемо зберегти спокій."
  SHI_franbos.5.b:0 "Скажіть Френсісу готуватися до війни."

  SHI_franbos.6.t:0 "Міллер виходить на зв'язок"
  SHI_franbos.6.d:0 "Писар Міллер прибув на територію Вартових. Тепер він візьме участь у спільній місії з їхніми 'Братами Грімм', щоб знайти новий шлях до Світіння. Хоча цей чутками оповитий тунель був би нам корисний, старійшина Френсіс сподівається, що ця місія допоможе підтримувати зв'язок між Братами, і що цей досвід навчить їх чомусь корисному. \n\nМине певний час, перш ніж ми дізнаємося про результати місії Міллера, але Френсіс сподівається на краще."
  SHI_franbos.6.a:0 "Це Високе Покликання, Брате. Я впевнений, що ти впораєшся."

  SHI_franbos.7.t:0 "На березі"
  SHI_franbos.7.d:0 "Писар Міллер повернувся і надав детальний звіт про свої пригоди, і боже ж мій, що це був за досвід! \n\nХоча йому було не зовсім комфортно з Братами Грімм, він проникся повагою до їхніх здібностей і підготовки. Він стверджує, що вони змогли чудово спрацюватися за мінімального спілкування; не було вимовлено майже жодного слова, вони навіть не використовували жестикуляцію. Він розповідає, що вони вижили в засідці завдяки їхній неймовірній дисципліні. \n\nВін заявляє, що зустрічав супермутантів у силовій броні, що вже саме по собі є рідкісним видовищем. І все ж йому вдалося перевершити це твердження, описавши свою зустріч із масивним ракоподібним чудовиськом. Від одного його удару один із Братів Грімм відлетів убік. На щастя, цей брат зміг пережити цю зустріч. \n\nЗрештою, місія не досягла своєї мети у пошуках тунелю до Світіння. Але старійшина Френсіс вважає, що вона чудово впоралася зі своєю другорядною ціллю — об'єднати наших Братів і дозволити їм навчитися зі спільного досвіду."
  SHI_franbos.7.a:0 "Нашому Братству краще разом."

  SHI_franbos.8.t:0 "Минулі помилки"
  SHI_franbos.8.d:0 "Френсіс знову перечитав звіт. Він був низького пріоритету, але стосувався особисто його. У ньому йшлося про торговця, який стверджував, що стикався з 'Братством Сталі' на території Ріно. Звісно, це було не справжнє Братство, а ті ґулі з 'Ізотопу', які продовжували чіплятися за традиції, що вже відреклися від них. \n\nПоки Відділення 'Ізотоп' буде надане саме собі, подібні інциденти траплятимуться й надалі. Наразі це лише невелика зграйка, але якщо їхні справи колись підуть угору, це може мати багато наслідків для всього Братства загалом. \n\nФренсіс зрозумів, що його помилкою..."
  SHI_franbos.8.a:0 "...було те, що він не стратив їх ще тоді."
  SHI_in_thirty_days_tt:0 "§Yчерез 30 днів§!"
  SHI_franbos.8.b:0 "...було те, що він не спробував зрозуміти."

  SHI_franbos.9.t:0 "Захоплений стяг"
  SHI_franbos.9.d:0 "Френсіс повісив його на стіну свого кабінету в бункері. Це була така пошматована стара річ, навряд чи прапор, яким можна пишатися. До нього доходили звіти, що ґулі Відділення 'Ізотоп' зазвичай являли собою жалюгідне видовище. Вони виглядали нікчемно на тлі сяючих лицарів справжнього Братства, але їхній відчай робив їх лютими. Вони дали хороший бій. \n\nЗвісно, вони не винищили їх усіх. Місцезнаходження Резерфорд залишалося невідомим, як і деяких інших відомих членів групи. Але вони добряче набили цій зграї жебраків синці, що, можливо, переконає їх більше не висовуватися."
  SHI_franbos.9.a:0 "Помилку частково виправлено."

  SHI_franbos.10.t:0 "Радикальна пропозиція"
  SHI_franbos.10.d:0 "Коли Френсіс уперше закинув вудочки, Відділення 'Ізотоп' не бажало зустрічатися ні з ним, ні з його представниками. Він розумів чому, але все одно наполягав на своєму. \n\nЗрештою йому вдалося вмовити їх погодитися на зустріч між ним та Резерфорд. Він вважав, що особиста присутність необхідна для встановлення довіри. Щойно він з'явився, Резерфорд наставила на нього свою зброю. Вона хотіла знати, чому б їй просто не вбити його. \n\nФренсіс дав зрозуміти: хоча миттєва помста і може принести їй певне задоволення, він уособлює їхній своєрідний порятунок. Хоча він і не міг відновити їхній статус членів Братства, йому вдалося укласти угоду; їх дадуть у спокої і навіть співпрацюватимуть з ними, якщо вони погодяться на те, що Френсіс буде наглядати за їхньою діяльністю. На його думку, це життя було кращим за роботу найманців. \n\nНавряд чи це можна було назвати примиренням. Резерфорд погодилася з турботи про своїх підлеглих. Але, як мінімум, це означало, що вони зможуть співіснувати без насилля."
  SHI_franbos.10.a:0 "Минуле не повернути, але ви можете щось зробити зараз."

  SHI_franbos.11.t:0 "Вбивці в сталі"
  SHI_franbos.11.d:0 "Останнім часом на нашій території сталася низка сутичок. Хоча насильство в Нью-Ріно — не новина, цікаво те, що цілями здебільшого були члени 'Відділення Ізотоп', які працюють на нашій території як найманці. Дехто каже, що вбивці покинули нашу територію на гвинтокрилах, попрямувавши на захід..."
  SHI_franbos.11.a:0 "Хтось справді ненавидить цих ґулів."

  SHI_franbos.12.t:0 "Підтримка від [SHI.GetNameWithFlag]"
  SHI_franbos.12.d:0 "Старійшина Френсіс із відділення Сан-Франциско організував прибуття підкріплення від солдатів свого відділення."
  SHI_franbos.12.a:0 "За старійшину Френсіса!"

  SHI_franbos.13.t:0 "Підтримка від [SHI.GetNameWithFlag]"
  SHI_franbos.13.d:0 "Старійшина Френсіс із відділення Сан-Франциско організував прибуття підкріплення від солдатів свого відділення. Хоча Лост-Гіллз діє в умовах суворої секретності, шпигунська мережа Ші дозволила їм переправити невелику кількість солдатів, не викликавши підозр у НКР."
  SHI_franbos.13.a:0 "За старійшину Френсіса!"

  SHI_franbos.14.t:0 "Ші чи Сталь?"
  SHI_franbos.14.d:0 "Після дня патрулювання лицар Лю та його товариші по патрулю любили заходити перекусити до закусочної «Айя». Присутність членів Братства в місті ставала звичним явищем, але солдати в комбінезонах Братства все ще змушували декого здивовано піднімати брову, коли ті заходили всередину. \n\nВони щойно отримали свою їжу, коли почули за спиною гучне пирхання. Лю озирнувся і побачив якогось сварливого старого. Він планував не звертати на нього уваги, але щойно він повернувся до їжі, старий почав бурчати. 'Було достатньо погано, коли хабологи почали викрадати дітей. Тепер ми спостерігаємо, як рупор Імператора дозволяє промивати мізки нашим дітям цим технофетишистам'. \n\nЛю відклав палички і повернувся до старого. 'Моїх батьків прийняли до Братства за видатні заслуги. Я народився і виріс у цьому бункері. Ніхто мені мізки не промивав'. \n\n'Тоді, мабуть, вони промили мізки твоїм батькам'. Лю кортіло відповісти більш фізично, але Джейкобс поклав йому руку на плече. Він похитав головою, жестом показуючи Лю продовжувати їсти. Лю знову відвернувся. 'Подивіться, як Лаоваї тримають вас на короткому повідку. Ваш Лаовай-Старійшина так само примушує вас виконувати команди?' \n\nПісля цих слів Лю підвівся на ноги. Джейкобс і Чжу теж, але з турботи про нього. 'Слухай сюди, хлопче'. Старий продовжував сидіти. 'Ви служите купці Лаоваїв, що ховаються в дірі в Калі-як-її-там. Вони не хочуть для нас нічого хорошого, вони хочуть, щоб ви збирали для них химерні іграшки. На чиєму ти боці? Що краще для Ші, чи що краще для купки Лаоваїв?'"
  SHI_franbos.14.a:0 "Те, що краще для Братства, краще для Ші!"
  SHI_franbos.14.b:0 "Вам ніколи не зрозуміти відданість солдата."

  SHI_franbos.15.t:0 "Наведення ладу"
  SHI_franbos.15.d:0 "'Ви вільні'. Це були слова, які Лі Цзюнь-фан ніяк не очікував почути від охоронця, що зайшов до його камери. У нього навіть не вистачило сил відреагувати, коли охоронець зняв із нього кайданки і підняв на ноги. \n\n'...а як же моя Шифу?' — запитав Лі, коли його вели коридорами гауптвахти. \n\n'Я не маю права надавати вам інформацію щодо поточних кримінальних розслідувань'. Лі зупинили у вестибюлі. 'Ваші речі будуть повернуті вам за місцем проживання'. Це було останнє, що сказав охоронець перед тим, як розвернутися і піти. Коли Лі попрямував до виходу, його перервав Лю Юнь-цяо, який увійшов усередину, затягуючи якогось чоловіка своїми руками в силовій броні. Лю мигцем глянув на Лі, перш ніж рушити далі. \n\nКілька днів потому було оголошено, що Акіґахаї визнали винною в тероризмі та державній зраді. Вона більше ніколи не побачить світла денного. Лі вважав найбільшою образою те, що Імператор, який так довго був безсилий проти впливу Ло Пана, раптом знайшов у собі сміливість виступити проти єдиної людини, якій вистачило відваги протистояти найбільшому ворогу народу. Безсумнівно, його нові друзі додали йому сміливості."
  SHI_franbos.15.a:0 "Вони змінили новокаліфорнійські кайдани на Сталеві."

  SHI_franbos.16.t:0 "Хороший забіг"
  SHI_franbos.16.d:0 "Синтія вже деякий час сиділа в машині. Їм знадобилося стільки часу, щоб спакувати речі своєї сім'ї. Свідчення того життя, яке вони збудували для себе в Сан-Франциско. \n\nЛо Пан та багато його найближчих соратників тепер сиділи у в'язниці. Її батько припускав, що єдина причина, чому його теж не заарештували — це небажання загострювати відносини з НКР. Але все було зрозуміло й без слів; їм тут були не раді. Багато каліфорнійців готувалися до від'їзду. Це навряд чи був легкий шлях назад до Республіки, але вибір стояв між тим, щоб повернутися, або ризикнути залишитися з цими злісними бляшанками. На щастя, Емерсони могли дозволити собі найняти вантажівку з охоронцями для безпечної подорожі. \n\nПатрік нарешті сів до неї в машину. 'Час їхати'. Сказав він їй та водієві, який завів двигун старого Гайвеймена. Він поглянув убік і побачив, що Синтія дивиться на підлогу автомобіля. 'Таке буває, дитино. Бізнес прогорає, друзі помирають, а життя триває. Це лайно Ло з бойовими мистецтвами все одно було глухим кутом. Ми знайдемо тобі роботу в Шейді, і за кілька років ти знову станеш Королевою Вулика. Ось побачиш'. Але коли машина віддалялася від міста, Синтія не могла не озирнутися назад."
  SHI_franbos.16.a:0 "Забудь про це, дитино, це місто Ші."

SHI_franbos.17.t:0 "Переоснащення кузень"
  SHI_franbos.17.d:0 "Якість чи кількість. Мабуть, дискусія стара як світ. Братство зазвичай надавало перевагу якості, обмежуючи набір і зосереджуючись на передовому озброєнні. Але часи змінилися, як для Лост-Гіллз, так і для Ші під керівництвом старійшини Френсіса. Можливо, нам потрібно випускати стільки спорядження, скільки ми можемо, щоб протистояти викликам Пустки? Або ми повинні залишитися вірними принципам наших предків і використовувати лише найкраще?"
  SHI_franbos.17.a:0 "Нам потрібен кожен екземпляр спорядження, який ми можемо виготовити!"
  SHI_franbos.17.b:0 "Братові потрібне спорядження, на яке він може покластися!"

  SHI_franbos.18.t:0 "По черзі"
  SHI_franbos.18.d:0 "Ритмічні удари кулаків наповнювали повітря Бункера в Сан-Франциско. Гоу Да стояв перед своїми людьми, проводячи тренування. Він не був експертом з бойових мистецтв, але чудово розбирався в нових техніках, які розробляло Братство. Сьогодні до них приєдналася група учнів школи Залізного Кулака, невеликої організації, що виникла нещодавно. Вони брали участь у програмі взаємодії Старійшини і прийшли вивчати техніки Братства разом із Послушниками. \n\nЧерез годину Гоу Да запросив сифу Залізного Кулака очолити заняття і навчити його та інших їхньому власному стилю бойових мистецтв Ші. Це також була одна з ідей Френсіса: по черзі вчитися один в одного, щоб кожен міг засвоїти щось нове. Відносини партнерів, а не підлеглих."
  SHI_franbos.18.a:0 "Завжди є чому повчитися."

  SHI_franbos.19.t:0 "Форсування подій"
  SHI_franbos.19.d:0 "'Умови цілком справедливі!' — крикнув лицар Монро в бік «Червоного 888», двері якого зараз були зачинені для нього. 'Чим для тебе є якась там конвеєрна лінія?' \n\n'Це моя гордість і радість!' — крикнув у відповідь з будівлі Мей Да Чан, власник магазину. 'Ти б відмовився від можливості створювати чудову зброю через те, що якийсь придурок запропонував тобі жменю кришок!?' \n\nМонро міг би сказати, що йому байдуже до створення зброї, але він розумів, що справа не в цьому. Мей Да Чан був відомий своєю любов'ю до свого ремесла, і переконати його розлучитися з можливістю робити рідкісну зброю було майже неможливо. Єдине, що йому залишалося — це повернутися в бункер і дізнатися, що робити далі. Давня політика старійшини Френсіса полягала в тому, щоб намагатися купувати технології чесно і без конфліктів, але вони залишали за собою право вилучати будь-що визнане надто небезпечним, якщо власники відмовлялися з цим розлучатися. \n\nЄдине питання полягало в тому, чи вирішить Френсіс дотримуватися цієї позиції? Чи він вважатиме за краще уникнути галасу?"
  SHI_franbos.19.a:0 "Ми не повинні злити громадськість."
  SHI_franbos.19.b:0 "Ми не можемо дозволити їм зберігати таке небезпечне обладнання."

  SHI_franbos.20.t:0 "Безробітні"
  SHI_franbos.20.d:0 "Мей не знала, що з собою робити. Вона щойно отримала роботу в Охороні, її направили на околиці Сан-Франциско. З батьковою старою гвинтівкою в руках вона була готова заробляти на життя, відганяючи випадкові загрози від міста. Він казав їй, що найстрашніше, що він коли-небудь бачив у патрулі, був радскорпіон. \n\nА потім прийшли новини. Охорону мали скоротити. Вона була останньою, кого прийняли, тому першою пішла. Вона ледве заробила свою першу зарплату. Вона чула, що Братство набирає в свої лави колишніх охоронців, але брали тільки ветеранів. Їй не було чого показати, крім тренувань зі старою гвинтівкою від батька. Вона була остаточно вигнана з обраної нею сфери, і все це через вплив Братства. \n\nЗвісно, вона думала знайти іншу роботу, але її навички стосувалися звичайної солдатської справи. Якщо їй це було заборонено, залишалася лише важка фізична праця за копійки. Якщо вона хотіла застосувати свої навички, їй доведеться задуматися про роботу найманця або податися в Пустки."
  SHI_franbos.20.a:0 "Як би там не було, майбутнього тут у неї немає."

  SHI_franbos.21.t:0 "Повний цикл"
  SHI_franbos.21.d:0 "Лицар Лю приєднався до старійшини Френсіса в його нових покоях у бункері Лост-Гіллз. Йому знадобився час, щоб знайти їх. Він ніколи не був у такому величезному комплексі. Бункер у Сан-Франциско був просто діркою в землі порівняно з цим легендарним домом Братства. \n\n'А, Лицарю!' Френсіс підвівся з крісла, в якому сидів. 'Як тобі Лост-Гіллз?' \n\n'Не можу сказати, що мені тут подобається, сер', Лю почухав потилицю. 'Клянуся, інші брати не хочуть мене тут бачити'. \n\n'Маєш на увазі, що вони не люблять нові обличчя, чужинців?' Френсіс подав Лю налитий ним напій. Байцзю, з Сан-Франциско. 'Що ж, тут я можу тобі поспівчувати. Ші теж НЕ ХОТІЛИ бачити нас поруч, коли я прибув до бункера стільки років тому. Знадобилося багато часу, щоб вони почали нас терпіти, і ще більше, щоб ми опинилися там, де є зараз. Але ми цього досягли, чи не так?' Його сміх змусив Лю теж усміхнутися. 'Будь-яка справа, варта зусиль, потребує часу, Лицарю. Колись Лост-Гіллз поважатиме тебе так, як Ші зараз поважають Братство. Ми просто будемо старанно працювати, поки це не станеться'."
  SHI_franbos.21.a:0 "Починається ще одна подорож у тисячу кроків."

  #Lo Pan Events
  SHI_lo_pan.1.t:0 "Улюбленці"
  SHI_lo_pan.1.d:0 "Усе почалося з пропозиції, яку Ло Пану зробив молодий бізнесмен. Спочатку він не дуже цікавився деталями — так, розмови про новий ринок для товарів із Ріно, з якими вони планували співпрацювати. Цифри сходилися, і це було все, що йому потрібно було знати. \n\nАле після обговорення цього з друзями за випивкою його приятель Цземін розлютився. Він заявив, що ринок, на який він розширюється — його, і що Ло Пан кидає його, погоджуючись підтримати цей проект. Ло Пан велів йому стулити пельку і сказав, що остаточне рішення буде лише за ним. \n\nАле тепер йому потрібно було зробити вибір. Це змусило його задуматися: його старі друзі зараз приносили не так уже й багато прибутку, ставши якимись гладкими і ледачими. А ці нові хлопці мали хороші ідеї та розум для їх реалізації. Це був його шлях — шлях сили й успіху. Але якщо він підтримає їх, він знищить частину власної сили. Його мережа союзників була корисним інструментом. Це було випробуванням його переконань."
  SHI_lo_pan.1.a:0 "Де б я був без друзів?"
  SHI_lo_pan.1.b:0 "Сильна людина — це та, що вміє адаптуватися."

  SHI_lo_pan.2.t:0 "Імператор без одягу"
  SHI_lo_pan.2.d:0 "Імператорська зала Сталевого Палацу вибухнула сміхом уперше за століття. Цей регіт лунав від Ло Пана та його учениці Синтії, які стояли перед консоллю Імператора, вперше усвідомивши правду про його стан. \n\n'Довбаний комп'ютер!' Ло Пан сперся на консоль, щоб не зігнутися навпіл від сміху. 'Увесь цей довбаний час Ші виконували накази комп'ютера!' \n\n'Хіба це...!?' Синтія не змогла одразу закінчити речення, намагаючись стриматися. '...хіба це не тривало століттями!?' \n\n'ТАК!' — заревів Ло Пан. 'З ДОВБАНИХ СПОКОНВІЧНИХ ЧАСІВ якийсь мудак вирішив, що за нас усе вирішуватиме комп'ютер!' \n\n'Це як... це як...! Біп-буп, я Імператор!' Роботизована пантоміма Синтії змусила Ло Пана впасти на підлогу. \n\n'Сер!' — до зали увійшов один із найманців Ло Пана, його бойова броня була заляпана кров'ю. 'Ми зібрали останніх палацових служителів'. \n\n'О... чудово!' Ло Пан щосили намагався заспокоїтися. Синтія допомогла йому підвестися на ноги. 'Позбудьтеся їх, як і планували. А потім приберіть це місце'."
  SHI_lo_pan.2.a:0 "Імператор — це лише застаріла моральна традиція."
  SHI_ken_lee_killed_tt:0 "§gКен Лі зникає, і його більше ніхто ніколи не бачить. Лише найближче оточення Ло Пана знає, що він тепер годує риб.§!"

  SHI_lo_pan.3.t:0 "Зустріч із долею"
  SHI_lo_pan.3.d:0 "Останні події застали старійшину Френсіса зненацька. Після турніру він очікував мати час подумати і скласти план. Здається, він недооцінив те, наскільки жорстоким міг бути Ло Пан. Кен Лі зник, а їм повідомили, що 'Палац забезпечено охороною від нападу'. Тим часом на вулицях почали зникати Брати, що змусило їх зібратися в бункері заради безпеки. Стало зрозуміло, що Ло Пан робить кроки для їх знищення. Відступу та капітуляції не буде. Ло Пан не мав наміру проявляти до них милосердя. \n\nБункер було б важко взяти силою, але Френсіс був упевнений, що Ло Пан і не збирався цього робити. Ніяке постачання до них не могло б дійти. Лост-Гіллз і без того був у відчайдушному становищі, і йому довелося б пробиватися через Ші, а можливо й НКР, щоб врятувати їх. План, безперечно, полягав у тому, щоб дати їм померти з голоду тут або знищити їх під час спроби прориву. \n\nУ них залишався один рятівний шлях — таємний вихід, побудований за роки розширення бункера. Вони не могли сподіватися забрати з собою все, але могли врятувати власні життя. Якщо пощастить, вони навіть могли б дістатися Лост-Гіллз. \n\nФренсіс планував встановити таймер самознищення і наказати своїм людям одягнути менш помітний одяг. Вони виходитимуть партіями й обережно пробиратимуться назовні. Натовп людей, що вибігає з руїн на околиці, одразу б помітили. Перша група складалася з Гоу та Лю. Лю був молодим, і Френсіс сподівався, що він виживе, а не він і всі ці старі пси. \n\nЦя надія розбилася вщент, коли Гоу повернувся, несучи пораненого Лю на плечі. Снайпери чекали на них. Їхній таємний вихід було викрито."
  SHI_lo_pan.3.a:0 "Бункер стане для них могилою."

  SHI_lo_pan.4.t:0 "Смертний крик Дракона"
  SHI_lo_pan.4.da:0 "'Я не піду!' — заявив Лі, стоячи перед Акіґахаї в залі Школи Дракона. Усім було відомо, що Ло Пан мав намір убити їх. На це вказувало все, і багато союзників Школи вже покинули їх. Акіґахаї вирішила, що не втікатиме. Навіть якщо це означатиме смерть, вона помре в бою. Але вона намагалася відіслати Лі та інших учнів. \n\n'Якщо ми всі зараз загинемо, Школа Дракона справді буде мертва', — сказала вона йому з дивним спокоєм, — 'обов'язок старих — захищати майбутнє молоді. Йди, і зроби так, щоб це місце продовжувало жити'. \n\n'Молодь має обов'язок синівської шани!' Лі випростався. 'Якщо ви не підете, я теж залишуся!' \n\nАкіґахаї усміхнулася і зітхнула. 'Невже я тебе занадто добре навчила? Гаразд, дуже добре, ходімо зі мною...' Вона вказала на двері. Лі пішов з нею, поки його не вдарили в задню частину шиї, і він не знепритомнів. \n\nАкіґахаї подбає про те, щоб Лі таємно вивезли з міста. Він буде в безпеці зі своєю сім'єю в НКР, хоча й не в повному комфорті. Зробивши це, вона знову повернеться до Школи, очікуючи на свою остаточну долю. \n\n'...мені шкода, що я підвела вас. Підвела вас усіх'. Дракон сидів з нею в залі. Він теж пообіцяв зустріти напад Ло Пана. 'Якби ж я залишився всі ці роки тому...' \n\n'Ми живемо в теперішньому часі'. Акіґахаї сиділа обличчям до дверей, її погляд був нерухомим. 'Наші жалі не змінять того, що має статися'."
  SHI_lo_pan.4.db:0 "'Я не піду!' — заявив Лі, стоячи перед Акіґахаї в залі Школи Дракона. Усім було відомо, що Ло Пан мав намір убити їх. На це вказувало все, і багато союзників Школи вже покинули їх. Акіґахаї вирішила, що не втікатиме. Навіть якщо це означатиме смерть, вона помре в бою. Але вона намагалася відіслати Лі та інших учнів. \n\n'Якщо ми всі зараз загинемо, Школа Дракона справді буде мертва', — сказала вона йому з дивним спокоєм, — 'обов'язок старих — захищати майбутнє молоді. Йди, і зроби так, щоб це місце продовжувало жити'. \n\n'Молодь має обов'язок синівської шани!' Лі випростався. 'Якщо ви не підете, я теж залишуся!' \n\nАкіґахаї усміхнулася і зітхнула. 'Невже я тебе занадто добре навчила? Гаразд, дуже добре, ходімо зі мною...' Вона вказала на двері. Лі пішов з нею, поки його не вдарили в задню частину шиї, і він не знепритомнів. \n\nАкіґахаї подбає про те, щоб Лі таємно вивезли з міста. Він буде в безпеці зі своєю сім'єю в НКР, хоча й не в повному комфорті. Зробивши це, вона знову повернеться до Школи, очікуючи на свою остаточну долю."
  SHI_lo_pan.4.a:0 "Герой повинен стояти до кінця."

  SHI_lo_pan.5.t:0 "Учень — історія успіху"
  SHI_lo_pan.5.d:0 "Сьогодні Ло Пан уперше побачив чудеса спадщини GECK. Навіть він був вражений трансформацією, на яку той був здатний. \n\nЗвісно, нічого б цього не сталося, якби Обраний зазнав невдачі. Якби Обраний був слабаком, Арройо чекала б довга і повільна смерть. Або досить швидка від рук Анклаву. \n\nАле Обраний домігся успіху. Він подивився в очі смерті і кинув їй виклик. Він бився з жахливим монстром Хорріганом і вижив, щоб розповісти про це, відправивши Анклав на той світ разом із ним. \n\nЛо Пан вважав це підтвердженням усього, у що він вірив. Що Обраний використав його уроки для перемоги і побудував сильніший Арройо. Він і мріяти не міг про краще для свого колишнього учня."
  SHI_lo_pan.5.a:0 "Я б назвав це виправданням."

  SHI_lo_pan.6.t:0 "Старий наставник"
  SHI_lo_pan.6.d:0 "Ло Пан з Ші нещодавно прибув в Арройо, щоб відвідати свого колишнього учня. Йому провели екскурсію громадою, і він був вражений дивами, які могли зрівнятися з досягненнями самих Ші. \n\nВін поділився з нами мудрістю, яку повторював багато разів за своє життя: тільки сила, хоч би якої форми вона набувала, може забезпечити безпеку громади. Він порадив нам не забувати робити те, що необхідно для досягнення перемоги та миру. \n\nНезалежно від того, чи візьмемо ми ці слова близько до серця, ми можемо бути впевнені, що маємо друга в особі Ші."
  SHI_lo_pan.6.a:0 "Сила, незалежно від того, звідки вона береться...?"

  SHI_lo_pan.7.t:0 "Державна зустріч"
  SHI_lo_pan.7.da:0 "'...кажуть, кампанія загалом непопулярна', — Кімбол продовжив свою розмову з Ло Паном, коли вони разом сиділи в Залі Конгресу, — 'але вони й гадки не мають, що саме являє собою Мохаве. Майбутнє нашого народу, захист від варварства Арізони. Ось чому ми переможемо в цій справі, навіть якщо мені доведеться тягнути цих маленьких невдячних скигліїв через фінішну пряму'. \n\n'Довбати-копати, як добре сказано'. Ло Пан простягнув Кімболу руку. Кімбол узяв її і міцно потиснув. 'Я завжди знав, що ви мені сподобаєтесь, пане президенте'. \n\n'Зовіть мене Аарон, Ло'. \n\n'Що ж, Аароне, ви людина дії та рішучості, і ви не дозволяєте цим боягузам стримувати вас. Для мене велика честь працювати з вами!' Вони обоє голосно розсміялися."
  SHI_lo_pan.7.db:0 "'Ви слабак'. Слова, які жоден діючий президент не очікував почути від глави іноземної держави. Звісно, НКР мало з ким мала справу протягом багатьох років, але від справжньої цивілізації очікували певного рівня ввічливості. Тут, у Залі Конгресу, подібні фрази були чимось нечуваним. \n\n'Що ж, пане Пан-' \n\n'Це моє ім'я'. \n\n'...так, пане Ло, те, що ви так грубо називаєте «слабкістю», я називаю турботою про добробут моїх громадян. Існує нація за межами наших військових кампаній, і-' \n\n'До біса це лайно!' Ло Пан підвівся з дивана. 'Ви їхній лідер, ви знаєте, що для них найкраще! Капітуляція перед кожним їхнім дурним беканням — це не що інше, як слабкість!' Олґуд глибоко зітхнув. Він чув, що лідер Ші не був святим, але такої нахабної неповаги він не очікував."
  SHI_lo_pan.7.dc:0 "'Буду з вами відвертим, пане президенте'. Гейз хотів було зауважити, що Ло Пан і так тільки те й робить, що говорить відверто відтоді, як вони сіли разом у Залі Конгресу. 'По-перше, я ціную те, що ви робите. Ви любите доводити справи до кінця, я теж люблю доводити справи до кінця. Але я думаю, що ваш підхід задає неправильний тон. Розумієте, ви говорите про речі з точки зору «прогресу» і «далекоглядності», але насправді ви маєте говорити людям, що ви знаєте, що для них правильно, і їм потрібно з цим змиритися'. \n\n'Можливо, це працює для вас із Ші, але боюсь, що жителі Нової Каліфорнії зроблені з іншого тіста'. \n\n'Це маячня. Усередині всі ми однакові тварини. Сильні люди піднімаються на вершину і роблять свою справу, а слабкі маленькі вівці йдуть за ними. Вам потрібно взяти владу в свої руки правильним чином, або кожен вважатиме, що має якийсь хитрий маленький аргумент, щоб вас перехитрити'. У відповідь Гейз лише усміхнувся. Лідер Ші був чудовим союзником для НКР, але під час особистої зустрічі він виявився неймовірно грубим і владним."
  SHI_lo_pan.7.a:0 "Дипломатія в дії."

  SHI_lo_pan.8.t:0 "Допомога від Ші"
  SHI_lo_pan.8.d:0 "Нещодавно лідер Ші запропонував відправити експедиційний корпус до Мохаве. Він не такий уже й великий, але це навчені бійці, на яких можна покластися у виконанні покладених на них завдань. Вони також прибули з обладнанням по ленд-лізу."
  SHI_lo_pan.8.a:0 "Кожна дрібниця має значення!"

  SHI_lo_pan.9.t:0 "Вірність чи ефективність?"
  SHI_lo_pan.9.d:0 "Нещодавно Ло Пан усвідомив, що він ще не пояснив, кому присягають на вірність його військові. Традиційно вважалося, що Охорона служить Імператору. Але Імператор більше не мав тут влади, а Ло Пан змінив суспільство Ші до невпізнання. У нього були ідеальні умови для того, щоб змусити військових присягнути йому на вірність. \n\nПроте він вагався. Дійсно, вірна армія має багато переваг, але є й свої недоліки. Якщо йому потрібні були ефективні командири, то йому потрібні були не лише посіпаки та підлабузники. Йому потрібні були генерали, які розуміли, як командувати, як читати свого ворога. Зі свого бізнесового досвіду він знав, що найвідданіші часто виявляються не найкращими. \n\nЗ іншого боку, з військовими не варто жартувати. У часи хаосу армія, що вийшла з-під контролю, могла б захопити владу в державі. Якщо вони не будуть вірні йому, вони саме так і зроблять. Чи міг він ризикувати безпекою свого режиму заради ефективної армії?"
  SHI_lo_pan.9.a:0 "Вони присягнуть на вірність лише мені."
  SHI_lo_pan.9.b:0 "Вони щосили битимуться за державу Ші."

  SHI_lo_pan.10.t:0 "Каліфорнія у вогні"
  SHI_lo_pan.10.d:0 "Ло Пан знову сидів із Патріком і Синтією у своїх приватних покоях. Сьогодні настрій був особливо прохолодним. Зазвичай він запрошував їх сюди на невеличкі гулянки, але зараз вони обговорювали руйнівну громадянську війну в Новій Каліфорнії. Обоє були стурбовані долею країни. Друзі, сім'я, бізнес-інтереси — все було на кону. \n\n'Отже, навколо полковника Мур у Шейді формується військова кліка', — пояснив Патрік усе, що знав про конфлікт, — 'а якісь нібито «незалежні» елементи гуртуються навколо Антона Флінна в Реддінгу. Якщо хочеш знати мою думку, їхня маячня про нейтралітет — повна дурня. Вони зроблять свій хід, усі зроблять. Питання в тому, на якого коня ми ставимо?' Звичайно ж, він навіть не згадав про Повстанців Могильника. Ніхто в цій кімнаті їм не співчував. \n\n'Що б ми не робили, треба діяти швидко', — озвалася Синтія. 'Чим довше це триватиме, тим більше шансів, що всіх там удома повбивають. Або ще гірше — ті виродки по той бік Колорадо можуть почати наступ. Мерзенні вилупки'. \n\nЛо Пан сидів у мовчазних роздумах. Очевидним кроком було б обрати союзника і знову об'єднати Каліфорнію. Але земля, якою він захоплювався, розпалася в хаосі. Чи справді Нова Каліфорнія була гідна того порядку на пустці, який сама ж і створила?"
  SHI_lo_pan.10.a:0 "Давайте знайдемо коня, на якого можна поставити."
  SHI_lo_pan.10.b:0 "Якщо це сталося, Нова Каліфорнія слабка..."

SHI_lo_pan.11.t:0 "Амбіції Ло Пана"
  SHI_lo_pan.11.d:0 "Синтія шоковано подивилася на Ло Пана, а Патрік підняв брову. Ло Пан підвівся і випростався. 'Я завжди вірив у чесноту сили. Що сильні повинні правити, а інші — тягнутися до них за настановами. Ось чому я обрав дружбу з НКР; вони були сильні, і нам було чому в них повчитися. Але їхня слабкість стала очевидною. Тоді навіщо нам витрачати свою енергію на підтримку слабкого конкурента? Ші тут, і ми сильні! Я кажу, що настав час об'єднати Нову Каліфорнію під НАШИМ прапором!' \n\nСинтія і Патрік переглянулися. Патрік першим повернувся до Ло Пана. '...знаєш що, як на мене, це до біса крута ідея!' Він підвівся і простягнув Ло Пану руку для потиску. 'Нова Нова Каліфорнія і Нові Ші! Ти, як завжди, маєш мою підтримку, Ло!' Ло Пан енергійно потиснув йому руку. \n\n'В-ви двоє збожеволіли!?' Синтія теж підвелася. 'Каліфорнія розпадається на шматки, а ваша відповідь — підлити ще більше бензину у вогонь!?' \n\n'Синтіє, люба, подумай гарненько!' Ло Пан підійшов і поклав руку їй на плече. 'Ми не можемо покладатися на цю зграю ідіотів, щоб розібратися з цим безладом. Тож ми розберемося самі! Ми принесемо МИР в НКР. НАШ мир. Ти ж знаєш, що можеш мені довіряти, так?' \n\n'Я... мабуть...' Синтія потерла потилицю."
  SHI_lo_pan.11.a:0 "Ші принесуть порядок у Нову Каліфорнію!"

  SHI_lo_pan.12.t:0 "Кінець Каліфорнії"
  SHI_lo_pan.12.d:0 "НКР зникла. Пил на вітрі Пустки. \n\nЛо Пан прагнув дружби з ними, вірячи, що вони сильні, і що він міг би навчитися на їхній силі. НКР виявилася слабкою. \n\nЛо Пан знав, що міг би прийняти цей новий порядок, можливо, спробувати стати партнером переможця. Але він також вірив, що після падіння НКР саме Ші судилося піднятися. \n\nВін стане тим, хто принесе порядок у цей хаос. Каліфорнія належала йому."
  SHI_lo_pan.12.a:0 "Ші принесуть порядок у Нову Каліфорнію!"

  SHI_lo_pan.13.t:0 "Зрада Ведмедя"
  SHI_lo_pan.13.d:0 "За вкрай прикрих обставин ми опинилися у стані війни з Новою Каліфорнійською Республікою. Не маючи змоги примиритися з тим, хто мав стати його найсильнішим другом, Ло Пан вирішив, що для вирішення цієї ситуації необхідне завоювання. НКР пошкодує, що взагалі колись виступила проти Ші!"
  SHI_lo_pan.13.a:0 "Ші принесуть порядок у Нову Каліфорнію!"

  SHI_lo_pan.14.t:0 "На чиєму ми боці?"
  SHI_lo_pan.14.d:0 "'Оскільки вся ця історія з Громадянською війною є дуже хаотичною', — Патрік розклав на столі перед ними карту НКР, — 'я не можу гарантувати, що хтось із тих, про кого ми говоримо, ще залишиться, коли ми ухвалимо рішення. Тим не менш, ось що нам відомо...' \n\n'У Шейді', — Патрік вказав на карту, — 'військова кліка сформувалася навколо полковника Кассандри Мур. Її, мабуть, рідко тепер називають «полковником», але саме нею вона і була. Вона сувора жінка, яка не терпить дурниць, і я думаю, що її обіцянки можуть сподобатися тобі особисто, Ло. Звісно, я не знаю, чи сподобається всім це військове диктаторство. Зрештою, саме тому й сталося це ідіотське повстання в Могильнику'. \n\n'Альтернатива знаходиться в Реддінгу', — Патрік пересунув палець. 'Антон Флінн зібрав групу аутсайдерів з інших фракцій. «Нейтральні» політики, альтернативні військові лідери, а також безліч бізнес-інтересів. Зробити ставку на них безпечніше, ніж на Мур, але я також не впевнений, який у них план дій. ВОНИ МОЖУТЬ просто сидіти на двох стільцях вічно, і я не знаю, чи це те, що ти шукаєш'. \n\n'Що підводить нас до найгострішого питання', — Патрік підняв очі від карти, щоб зустрітися поглядами, — 'до кого ти схиляєшся, Ло?'"
  SHI_lo_pan.14.a:0 "Давайте звернемося до Кассандри Мур."
  SHI_lo_pan.14.b:0 "Давайте звернемося до Антона Флінна."

  SHI_lo_pan.15.t:0 "Підтримка від [SHI.GetNameWithFlag]"
  SHI_lo_pan.15.d:0 "Ло Пан зв'язався з нами, пообіцявши підтримати нашу справу в цей час конфлікту. Хоча він не кине всю армію Ші в цю боротьбу, він надішле нам добровольців та іншу матеріальну підтримку."
  SHI_lo_pan.15.a:0 "Кожна дрібниця має значення."

  SHI_lo_pan.16.t:0 "Воля до влади"
  SHI_lo_pan.16.d:0 "Ло Пана запросили до резиденції Генерал-Президента. Справжня будівля-фортеця, оточена грізними солдатами та зброєю. \n\nЛо Пана провели довгим коридором на зустріч із Мур у невеликому кабінеті. Він сів навпроти неї за робочим столом. \n\n'Пане Ло Пан', — вона зберігала сталевий вираз обличчя, — 'я дякую вам за допомогу, яку Ші надали Третій Республіці. Ваша відданість нашим спільним принципам гідна похвали'. \n\n'Не варто подяки, пані Президент. Ох, е-е...' \n\n'Пані Президент буде достатньо', — Мур дістала стопку паперів. 'Я запросила вас сюди не лише для обміну люб'язностями. Ми з вами стоїмо на порозі створення нового порядку для цивілізованого заходу, а згодом, можливо, і для всієї Пустки. Зараз настав час діяти рішуче. Тож я питаю вас', — вона простягнула Ло Пану ручку, — 'чи готові ви допомогти змінити світ?' \n\nНа губах Ло Пана з'явилася самовдоволена посмішка."
  SHI_lo_pan.16.a:0 "Ще б пак."

  SHI_lo_pan.17.t:0 "У поті чола нашого"
  SHI_lo_pan.17.d:0 "Антон Флінн запросив Ло Пана відвідати його старе ранчо. Останнім часом він не так часто там бував. Та й раніше він там майже не з'являвся, довіряючи управління своїм надійним підлеглим. Але сьогодні треба було зробити заяву. \n\nФлінн узяв Ло Пана на кінну прогулянку. Ло Пан ніколи раніше не чув про таких створінь, але Флінн пояснив, що це стародавні звірі, які існували за тисячоліття до падіння бомб. Він привіз одного здалеку за величезні гроші. Спочатку Ло Пану було важко їздити на цій тварині, але згодом він призвичаївся. \n\nВони зупинилися на зруйнованому пагорбі, з якого відкривався вид на більшу частину навколишньої Пустки. Страшна перспектива для пересічної людини, але вони були справжніми чоловіками. Як і загін важкоозброєних охоронців, які їхали за ними на вантажівці. Флінн розділив віскі з Ло Паном, коли вони дивилися вдалечінь. 'Це плід нашої праці, пане Ло Пан', — сказав йому Флінн. 'Земля справді вільних. Де кожна людина має право мислити і діяти самостійно'. \n\n'Твоя довбана правда!' Ло Пан допив залишки свого віскі одним ковтком."
  SHI_lo_pan.17.a:0 "Ми боролися і проливали кров за це!"

  SHI_lo_pan.18.t:0 "У Храмі Журавля так весело!"
  SHI_lo_pan.18.d:0 "'Гей, ти Вільям Кемп, так?' — Синтія привітала новачка з НКР, стоячи на сходах Храму Журавля. \n\n'Так, це я. Називай мене просто Вілл'. Разом вони почали підніматися сходами до храму. \n\n'Ласкаво просимо в Сан-Фран, Вілле! Сподіваюся, поїздка сюди була не надто вибоїстою?' \n\n'Ні. Але не розумію, навіщо мені знадобилася ця рикша та ескорт. Я хотів спершу прогулятися містом'. \n\n'Ти знущаєшся? Хіба ти не чув?' \n\n'Звісно, чув. Але я приїхав сюди, щоб стати частиною вашої крутої школи бійців, а не бути сцикл...' Раптом Вілл відчув сильний удар у ліву ногу, від якого він упав на коліна. Не встиг він отямитися, як Синтія приставила ніж до його горла. \n\n'Досі почуваєшся крутим, Вілле?' — запитала вона, ніби дражнячи дитину. \n\n'Довбана психопатка!' Вілл відсахнувся і відповз від ножа. 'Думаєш, напад зненацька щось доводить!?' \n\n'Так, доводить', — Синтія сховала ніж, — 'у цьому місті є люди, які ТЕБЕ вб'ють, Вілле. Просто за те, що ти «лаовай». Вони не гратимуть за правилами, і не нападатимуть по черзі. Тож ти маєш сприймати наші вказівки серйозно, або поповниш статистику в республіканських газетах. Зрозумів?' \n\nВілл якийсь час недовірливо дивився на неї. '...гаразд. Зрозумів'. \n\n'Так-то краще. А тепер ходімо, всередині в тебе буде більше можливостей довести, який ти крутий!' Синтія пішла далі, ніби нічого не сталося, тоді як Вілл плентався позаду, озираючись в очікуванні чергового підлого удару."
  SHI_lo_pan.18.a:0 "Можливо, це найбезпечніше місце для лаовая в цьому місті."

  SHI_lo_pan.19.t:0 "І переможцем стає..."
  SHI_lo_pan.19.d:0 "...Циклон Синтія! Циклон Синтія перемагає у Великому Турнірі Ріно і забирає приз! \n\nВажко описати видовище, свідками якого ми сьогодні стали, друзі! Торнадо Торі лежить обличчям на татамі! Натовп реве так, що стає важко їх перекрикувати! \n\nО, здається, це... здається, його звуть Лао Пан, він щойно вибіг на татамі і святкує разом зі своєю зірковою ученицею! Так, Ші точно будуть у захваті, адже весь турнір був їхньою ідеєю, і тепер вони забирають додому приз і славу. \n\nВибачте, друзі, мушу це зробити: подяка спонсору Радіо Вест-Сайду, Віскі Кламат! Найм'якший постапокаліптичний напій у Пустці, мої друзі! Ящики можна замовити у найближчій кур'єрській компанії або через асоційовані каравани..."
  SHI_lo_pan.19.a:0 "Перемога має найсолодший смак."

  SHI_lo_pan.20.t:0 "Спроба порозумітися"
  SHI_lo_pan.20.d:0 "Синтія ковтнула слину, дивлячись на натовп, що зібрався перед нею. Це була геніальна ідея Ло Пана — виставити її перед «публікою» в Шейді Сендс, щоб вона пояснила їм, наскільки Ло Пан насправді доброзичливий. 'Ти впораєшся, Синтіє, заради всього святого, ти ж вигравала турніри!' — сказав він їй. Принаймні на турнірах вона могла бити ворога. \n\n'П-привіт!' — почала вона свою промову. Ідея полягала в тому, щоб бути близькою до народу, але виконання було надто нервовим. 'Отже... я знаю, що ви, хлопці, трохи стурбовані, тому що, типу, іноземна держава, здається, прийшла і, е-е... захопила владу, але, знаєте, просто подивіться на мене! Я така ж з НКР, як і ви!' Судячи з похмурих облич у натовпі, вона була впевнена, що вони з цим не погоджуються. 'Я, е-е... я найкраща учениця Ло Пана, переможниця Великого Турніру Сан-Фран. Якщо й є доказ того, що Ші такі ж каліфорнійці, як і всі ми, то це те, що я поїхала туди і вийшла переможницею. Тож... якщо ми всі просто будемо працювати разом, ладнати між собою, ми повернемося до того, як усе було до цього хаосу, так? Краще, ніж вбивати одне одного до останнього, правда?' Знову оглушлива тиша. Її батько, який сидів на сцені поруч із нею, відкашлявся як сигнал. \n\n'Ну, не буду забирати весь ваш час. Просто знайте, що все буде краще, ніж ви очікуєте, і ми всі зможемо жити в мирі! Дякую!' Синтія ніяково посміхнулася, незграбно помахала рукою і зійшла з трибуни. Пролунали поодинокі оплески. Це було більше, ніж вона очікувала."
  SHI_lo_pan.20.a:0 "Я дуже старалася."

  SHI_lo_pan.21.t:0 "Пам'ятник слави"
  SHI_lo_pan.21.d:0 "Ло Пан спостерігав, як його портрет додають до інших у Залі Конгресу, поруч із портретами Танді, Арадеша та інших. Він думав, чи колись маленькі діти приходитимуть на екскурсії до цієї будівлі і дивитимуться на його величне зображення, що споглядає на них суворим поглядом? \n\nБезсумнівно, там є жалюгідні слабаки, які б заперечували проти такого показу. Назвали б його пихатим, зарозумілим, нагадали б, що він навіть не громадянин НКР. Але хіба Арадеш не був просто головою Шейді Сендс до створення Нової Каліфорнійської Республіки? Саме завдяки силі та чеснотам було створено нову спільноту, і тепер Ло Пан зшив розбиті залишки Нової Каліфорнії у нову могутню країну. \n\nТож цілком доречно, що на знак визнання його зусиль, спрямованих на встановлення миру та стабільності на цих землях, його назавжди запам'ятають як героя. Він був Сифу Обраного, Модернізатором Ші та Героєм Хаосу."
  SHI_lo_pan.21.a:0 "Щоб не забули."

  ##Navarro Events

  SHI_navarro.1.t:0 "Імператор покидає нас!"
  SHI_navarro.1.d:0 "Згідно з імператорським указом, усім підданим Ші, які проживають на північному кордоні, наказано повернутися до де-юре кордонів Імперії Ші. Ті, хто відмовиться це зробити, ризикують бути оголошені поза імперським законом. \n\nХоча багато хто залишається відданим справі Дракона і хоче захищати свої домівки, офіційне прохання припинити боротьбу призведе до того, що все більше і більше наших людей повертатимуться на територію Ші і відмовлятимуться від нашої справи. \n\nЦілком імовірно, що підлий підлабузник Ло Пан міг вплинути на можновладців, щоб ті видали такий про-НКРівський указ."
  SHI_navarro.1.a:0 "Хай їм грець!"

  SHI_navarro.2.t:0 "Повернення Дракона"
  SHI_navarro.2.d:0 "На сходах Школи Дракона зібрався натовп. Уперше за десятиліття її легендарний засновник, сам Дракон, вийшов зі школи, щоб виголосити промову перед публікою. Тепер він Герой Наварро, і його повернення зустріли з великим тріумфом, навіть ті, хто колись вважав Школу Дракона посміховиськом. \n\nЗрештою, Дракон вийшов із залу школи під вітальні вигуки своїх прихильників. Праворуч від нього стояла Акіґахаї, його незмінно віддана учениця, яка підтримувала його мрію живою протягом трьох десятиліть. Ліворуч — Лі Цзюнь-фань, протеже Акіґахаї, якого проголосили другим пришестям Дракона. \n\nДракон підійшов до натовпу і зупинився зовсім поруч. Він простягнув руки, ніби хотів привітати і обійняти їх усіх. 'Народе мій', — почав він, — 'минуло багато часу. Надто багато. Мені соромно зізнатися, що я покинув вас у хвилину своєї слабкості. Але вчитися можна і в старості, і я обіцяю вам, що більше ніколи вас не покину. Я буду боротися за вас проти будь-кого, хто прийде: будь то Ведмідь, Найманці, Кігті смерті чи Мутанти!' Він підняв кулак у повітря під вигуки «Десять тисяч років». Перемога Дракона привернула багато уваги та похвали не лише до нього самого, а й до Школи Дракона."
  SHI_navarro.2.a:0 "Наші герої заслуговують на повагу!"
  SHI_dragon_commander_tt:0 "§gДракон тепер доступний для захисту Ші як військовий командир!§!"
  SHI_navarro.2.b:0 "Боріться з їхнім впливом будь-якими необхідними методами!"

  SHI_navarro.3.t:0 "Смерть Дракона"
  SHI_navarro.3.d:0 "Його тіло повернули до Школи Дракона. Казали, що він загинув, допомагаючи сім'ям повернутися до центру земель Ші. Він помер як герой, так говорили. \n\nАкіґахаї проводила похоронні обряди на території школи. Дітей у нього не було, а інші його родичі давно померли. До неї приєдналися її учні, вбрані в біле, щоб нести варту над його тілом. Кажуть, що Акіґахаї була втіленням самовладання під час церемоній, жодного разу не дозволивши нікому побачити навіть натяку на її горе. \n\nАле наодинці з собою маленька дівчинка з 30-річного минулого виплакувала всі очі. Вона так довго чекала з надією, що Дракон повернеться і побачить усе, над чим вона працювала за його відсутності. Ця надія перетворилася на попіл, так само, як і Дракон після кремації."
  SHI_navarro.3.a:0 "Він стане мучеником за нашу справу."
  SHI_navarro.3.b:0 "Тільки дурні плачуть за таким невдахою, як він."

  SHI_navarro.4.t:0 "Оливкова гілка Ло Пана"
  SHI_navarro.4.d:0 "Ло Пан запропонував вигідну торговельну угоду щодо територій Наварро. Хоча зараз він не має де-юре влади над Ші, він усе ще залишається великим бізнес-лідером. Він запевнив чиновників НКР, з якими зміг зв'язатися, що сподівається згладити розбіжності щодо Наварро і перейти до союзницьких відносин, якщо це дозволить внутрішня політика. \n\nЯк би там не було, це краще, ніж нічого."
  SHI_navarro.4.a:0 "Можливо, ми зможемо пробачити і забути?"

  SHI_navarro.5.t:0 "Дівчинка зі Школи Дракона"
  SHI_navarro.5.d:0 "Витративши стільки часу на відновлення знайомств і впорядкування свого становища, Дракон і Акіґахаї нарешті змогли зустрітися наодинці в Школі Дракона. Вони разом сиділи в її приватних покоях. \n\n'...ні, я пам'ятаю', — відповів Дракон на запитання Акіґахаї, коли вона наповнила його келих, — 'це був... 2238 рік. Тебе знайшли на території школи. Пам'ятаю, я подумав, що ти виглядала такою худою, що могла б зламатися в моїх руках, наче гілочка'. \n\n'Я шукала щось поїсти'. Акіґахаї сумно засміялася. \n\n'Коли я запропонував тобі залишитися, я не думав, що це буде надовго. Думав, ти пару разів поїси і підеш додому. Ніколи б не подумав, що та голодна маленька дівчинка виросте і стане моєю вічною ученицею!' Він підняв келих. \n\n'Ви робите мені занадто велику честь', — Акіґахаї схилила голову, — 'я робила те, що будь-який учень зробив би для свого майстра'. \n\n'Завжди скромна. Школа Дракона завжди буде процвітати під твоїм керівництвом'. \n\n'Майстре?' Акіґахаї кліпнула. 'Але ж тепер, коли ви повернулися...?' \n\n'Я старий чоловік, який покинув свій народ через сором. Мені тут не місце керувати. Роль майстра належить тому, хто присвятив своє життя цій справі'. Він знову підняв келих. 'Але не хвилюйся. Я буду прямо тут, щоб підтримувати законного майстра Школи Дракона!'"
  SHI_navarro.5.a:0 "Передача влади офіційно відбулася, щоправда, із запізненням на тридцять років."

  SHI_navarro.6.t:0 "Повстання в Наварро!"
  SHI_navarro.6.d:0 "Племена та бандити в регіоні Наварро раптово активізувалися, здійснюючи набіги та вбиваючи наші патрулі. Хоча вони мають усі підстави протистояти нам, їхня раптова матеріальна сила свідчить про підтримку іноземної держави. З усіх у регіоні [SHI.GetNameWithFlag] мав би найбільшу причину тримати на нас зло."
  SHI_navarro.6.a:0 "Будь вони прокляті!"

  ##Expansion Events

  SHI_science.0.t:0 "По одному проєкту за раз"
  SHI_science.0.d:0 "Сталевий Палац завжди був обережним зі своїми пріоритетами. Великі дослідницькі проєкти регулярно закриваються та переглядаються. Наприклад, біологічні дослідження доктора Шен кілька років тому прикро завершилися, але останнім часом вона наполягає на тому, щоб проєкт з Лозою переглянули і підтримали. Доктор Вонг, однак, стурбований тим, що вона сподівається переслідувати щось небезпечніше за звичайні рослини. \n\nІнша пропозиція є ще більш суперечливою. Доктор Лонг Чін, син покійного доктора Лонг Ванга, хоче виправдати спадщину свого батька, успішно створивши сироватку мутації. Він хоче створити суперсолдатів. Зайве й казати, що сама згадка про людину, яка перетворилася на калюжу, досліджуючи це, змушує інших нервувати. \n\nЗі зміною керівництва Ші обидві сторони подали петиції про перегляд своїх досліджень."
  SHI_science.0.a:0 "Біологічний проєкт доктора Шен буде продовжено."
  SHI_bos_wont_fev_tt:0 "§RСтарійшина Френсіс не бажає розглядати експерименти з ВРЕ, тому пропозиція доктора Шен — його єдиний вибір.§!"
  SHI_science.0.b:0 "Нам би дійсно не завадили суперсолдати..."

  SHI_science.1.t:0 "Корінь бажання"
  SHI_science.1.d:0 "Наша лоза, що поглинає радіацію, прижилася в ґрунті Сан-Франциско. Наші вчені вже фіксують зниження рівня токсинів у ґрунті. Незабаром життя може повністю повернутися на ці розбиті землі. \n\nПроте доктор Шен оголосила про свій намір піти ще далі. Вона хоче здійснити свою мрію і створити розумне рослинне життя. Вона запевняє нас, що ці рослини будуть здатні на великі речі, можливо, навіть служитимуть своєрідними солдатами для наших армій. \n\nЦя ідея природно викликала ажіотаж серед нашої наукової спільноти. Багато хто застерігає, що, окрім своєї кричущої неетичності, така форма життя може бути небезпечною. Хоча доктор Шен наполягає, що зможе тримати їх під контролем, її колеги не переконані. Рішення лягає на нашого великого лідера..."
  SHI_science.1.a:0 "Давайте створимо нове життя!"
  SHI_science.1.b:0 "Абсолютно ні!"
  SHI_bos_wont_science_tt:0 "§RСтарійшина Френсіс не допустить жодних радикальних наукових досліджень під своїм наглядом!§!"

  SHI_science.2.t:0 "Переростки"
  SHI_science.2.d:0 "Ми мріяли створити розумне рослинне життя... і нам це вдалося. \n\nЗазначені рослини вирвалися з-під нагляду, втекли в населені пункти і влаштували різанину. Багато людей загинуло до того, як Охорона змогла взяти істот під контроль. Вони виявилися настільки ж смертоносними, як і обіцяла Шен. \n\nНаші вчені вивчили їхній генетичний код і вважають, що зможуть зробити майбутні версії істот більш слухняними. Шен, яку затримали до винесення вироку, наполягала на тому, що вони матимуть більший потенціал, якщо ми дозволимо їм зберегти свою жорстокість. Мало того, що ця ідея викликає огиду у більшості тих, хто її чув, багато хто вважає, що Шен повинна поплатитися за цю жахливу помилку своїм життям."
  SHI_science.2.a:0 "Нам потрібна геніальність Шен."
  SHI_science.2.b:0 "Безпека — наша турбота, так само як і справедливість."

SHI_science.3.t:0 "Йти ще далі"
  SHI_science.3.d:0 "Доктор Вонг Ї-Цзи повідомляє про розробку значно розбавленої версії ВРЕ (FEV). Вона дає приріст фізичних здібностей, який є незначним у порівнянні з Супермутантом, але все ще вражає для звичайної людини. Є побічні ефекти, але нічого настільки тривожного, щоб він не рекомендував її використовувати. Вона безпечна, помірна і не створює злісних монстрів. \n\nДоктор Лонг Чін не задоволений і хоче перевести проєкт на наступний логічний етап. Він вважає, що це прояв синівської шани з його боку — побачити роботу свого батька повністю реалізованою, а не розбавленою до незначущості. Доктор Вонг та інші поспішили зазначити, що саме ця безрозсудна гординя призвела до загибелі його батька."
  SHI_science.3.a:0 "Нам потрібні справжні суперсолдати!"
  SHI_science.3.b:0 "Ні, ми маємо зупинитися на цьому."

  SHI_science.4.t:0 "Який батько, такий і син"
  SHI_science.4.d:0 "На відміну від свого батька, доктор Лонг Чін домігся успіху у створенні сироватки, яка мутує, не перетворюючи людину на калюжу. \n\nЯк і батько, він випробував її на собі. Хоча його успіх був очевидним, трансформація призвела до погіршення розуму доктора. У нападі манії величі він спробував «завоювати» Сталевий Палац, схопивши зброю і вбивши багатьох. Зрештою Охорона ліквідувала його. \n\nДоктор Вонг висловив критику щодо того, що ми взагалі дозволили цьому статися, але також хоче рухатися вперед і зосередитися на тому, що можна з цього винести. Він вважає, що може стабілізувати сироватку двома шляхами: створити більш спокійних мутантів або просто використати зібрані дані для покращення початкової, безпечнішої сироватки. Він наполегливо радить нам обрати останнє, вважаючи, що ми щойно стали свідками доказу того, чому взагалі погана ідея продовжувати цей напрямок досліджень."
  SHI_science.4.a:0 "Я просив суперсолдатів, я отримаю суперсолдатів!"
  SHI_science.4.b:0 "Думаю, я засвоїв урок."

  ##Golden Tiger Events

  SHI_golden_tiger.1.t:0 "Раннє повернення"
  SHI_golden_tiger.1.d:0 "Одне з суден, відправлених у нашу велику подорож на захід, повернулося. Кажуть, їм наказали повернутися зі скарбами та розповідями про їхню екскурсію на землі Гаваїв. \n\nВідомо, що гавайські торговці рідко відвідують наші береги, але ми нарешті змогли побачити острів на власні очі. Наша команда обшукала кістяки стародавніх суден, знайшовши кілька речей, які пропустили місцеві жителі. Вони навіть привезли зразок рідкісного і солодкого фрукта. Вони чули, що це нащадок фрукта, колись відомого як «Ананас», який тепер рідко зустрічається у консервних банках, зазвичай з давно вичерпаним терміном придатності. \n\nХоча їхнє повернення було досить інтригуючим, багато хто чекає на справжній приз: на долю суден, які продовжують свій шлях до нашої стародавньої прабатьківщини."
  SHI_golden_tiger.1.a:0 "Там є ще багато чого, нам просто треба почекати..."

  SHI_golden_tiger.2.t:0 "Міжнародні відносини"
  SHI_golden_tiger.2.d:0 "Отримано повідомлення від нашої експедиції! Хоча воно уривчасте та спотворене, схоже, вони благополучно прибули до Чжунґо, в «Китай». \n\nКажуть, хоча він і спустошений ядерною війною так само, як Каліфорнія і території за нею, тут виникла нова цивілізація, подібно до Нової Каліфорнії. На відміну від Республіки, схоже, тут утворилася «Імперія», не надто відмінна від нашої, проте, нібито, набагато більша. \n\nНасправді, експедиція повідомляє, що Імператор виявив певний інтерес до нашої ініціативи. Незабаром ми маємо отримати офіційне комюніке через комп'ютерний термінал..."
  SHI_golden_tiger.2.a:0 "Що це...?"
  SHI_lin_zexu_event_tt:0 "§GПРИГОТУЙТЕСЯ ДО ОТРИМАННЯ ПОСЛАННЯ ВІД ЛІН ЦЗЕСЮЙ, ІМПЕРСЬКОГО НАМІСНИКА ІМПЕРАТОРА ЛАОШУ§!"

  SHI_golden_tiger.3.t:0 "Висадка Золотого Тигра"
  SHI_golden_tiger.3.d:0 "Щойно воно з'явилося в полі зору, наші спостерігачі зрозуміли, що саме вони бачать. Величезне судно, прикрашене яскравими золотими прапорами. З його носа музиканти грали на інструментах, що видавали потужний, хвалькуватий ритм для всіх, хто міг його почути. \n\nСудно не зупинялося, щоб подивитися, що перед ним, хіба що оминало рифи. Місцеві кораблі були змушені швидко тікати, коли воно розрізало води, прямуючи до гавані. Воно з силою зупинилося біля одного з наших причалів, розхлюпуючи воду на пірс. Коли приготування були завершені, наш почесний гість зійшов на пірс, після того як його численні слуги переконалися, що він не ступить на вогку землю. \n\nВін був Гулем. Гулем у яскравому мундирі. Більш історично обізнані громадяни впізнали б у ньому нагадування про стародавні періоди історії наших предків, яке водночас зберігало атрибути династії Мао та військового спорядження часів Великої Війни. Його свита оголосила про його присутність: «Іде генерал Чжао з Армії Золотого Тигра! Звільніть дорогу, чернь!». Його гвардійці встановили суворе оточення, відтісняючи роззяв і навіть погрожуючи новою та старою зброєю. \n\nГенерала зустріли представники Сталевого Палацу, які повели його прямо туди..."
  SHI_golden_tiger.3.a:0 "Час зустріти славетного посла..."

  SHI_golden_tiger.4.t:0 "Дипломатична місія"
  SHI_golden_tiger.4.da:0 "Акіґахаї прийняла генерала Чжао та його свиту в залі прийомів Сталевого Палацу. Акіґахаї бачила, що генерал оцінює її, так само як і вона сподівалася оцінити його. Трохи згодом під час розмови він поставив цікаве запитання. «Ким ви себе вважаєте? Народженими в Чжунґо чи народженими на цій землі? У цій Мейґо?» \n\n«Ми — Ші», — відповіла Акіґахаї, — «культура, що створювалася два століття. Ця земля — наша, відділена від атрибутів Старого Світу». \n\n«Тоді як ви оцінюєте свої відносини з імператором Лаошу?» \n\n«Мені б хотілося думати, що ми можемо бути партнерами і союзниками для вашої країни, в межах розумного». Акіґахаї ще не знала, що про них думати, але теоретично їхня готовність простягнути руку через океан з посольством могла б розглядатися як позитивний крок. \n\nГенерал посміхнувся на її коментар. «Тоді я сподіваюся, що партнерство виявиться плідним», — сказав він, але щось у цій посмішці не здалося Акіґахаї теплим."
  SHI_golden_tiger.4.db:0 "Ло Пан прийняв генерала Чжао та його свиту в залі прийомів Сталевого Палацу. Він облаштував його як своєрідну вітальню, зі столами з їжею та дівчатами-прислужницями. «...чи можу я запитати», — змінив тему Чжао посеред розмови, — «чи типово використовувати ваш найсвятіший зал як місце для розваг?» \n\n«Чесно кажучи, зовсім не типово», — знизав плечима Ло Пан, — «але я вважаю себе людиною майбутнього. Сталевому Палацу не обов'язково бути клятим храмом. Він може бути місцем, де приймають гостей з вином, жінками і піснями!» \n\n«Чи бачите ви майбутнє своєї країни такої ж якості?» \n\n«Га?» Спочатку Ло Пан не зовсім зрозумів запитання. «Ну, так, я маю намір зруйнувати всі ці безглузді старі речі, які стримували нас». \n\n«Тоді я сподіваюся на процвітаюче майбутнє для вашого народу». Хоча слова були гарними і ввічливими, Ло Пан бачив, що він не отримує того, чого хотів. Він сподівався, що генерал буде поступливим до таких речей, але відчув, що це не так."
  SHI_golden_tiger.4.dc:0 "Старійшина Френсіс і Кен Лі прийняли генерала Чжао та його свиту в залі прийомів Сталевого Палацу. Френсіс помітив, що китаєць ставиться до нього зневажливо, як до небажаного прибульця на зустрічі своїх співвітчизників. \n\n«...Мені цікаво», — запитав Чжао після довгої розмови, — «як виник цей ваш дивний союз?» \n\n«Гадаю, він народився з особистої дружби, насамперед», — відповів Френсіс, — «і вже потім з обопільного розуміння того, що кращого майбутнього можна досягти через нашу співпрацю». \n\n«І все ж, хіба зараз Ші не підкоряються Братству?» Запитання генерала змусило Френсіса підняти брову. \n\n«Їхня роль — це нагляд, а не домінування», — спокійно сказав Кен Лі. «Братство не керує Ші, а лише допомагає їм рости під тінню їхнього дерева». \n\nЧжао розсміявся. «І якими великими і процвітаючими ви виросли!» Френсіс і Кен Лі переглянулися. Вони обидва зрозуміли приховану насмішку в інакше ввічливій мові генерала."
  SHI_golden_tiger.4.a:0 "За наших нових друзів...?"
  SHI_golden_tiger_embassy_tt:0 "§gГенерал Чжао з Армії Золотого Тигра тепер доступний як радник. Він також забезпечить дипломатичні зв'язки зі своєю рідною Імперією, дозволяючи вам просити допомоги у Китаю, якщо ви платитимете данину імператору Лаошу.§!"

  SHI_golden_tiger.5.t:0 "Тигр стискає лещата"
  SHI_golden_tiger.5.d:0 "Попросивши стільки послуг у Армії Золотого Тигра, генерал Чжао натякнув, що ми йому дещо винні. Він уже запросив сюди високопосадовців і «радників» з Чжунґо, і вони ходять тут, ніби це місце належить їм. Вони висувають вимоги до місцевих, віддають накази військовим підрозділам, а деякі навіть наполягають, щоб ми дозволили їм постійно проживати в Сталевому Палаці. \n\nГенерал Чжао чітко дав зрозуміти, що будуть серйозні наслідки, якщо ми не виявимо «належної поваги до імператора Лаошу». Ігнорувати його — не варіант. Ми повинні або прогнутися, щоб задобрити наших благодійників... або, можливо, влаштувати дорогий нещасний випадок для генерала та його свити, яка постійно зростає. Поки не стало надто пізно."
  SHI_golden_tiger.5.a:0 "Нам потрібна щедрість імператора Лаошу."
  SHI_golden_tiger.5.b:0 "Ми повинні зупинити це, перш ніж це стане більшою проблемою."

  # Spy Stuff
  nf_shi.1.t:0 "Виявлено підозрілі рухи"
  nf_shi.1.d:0 "Наші найкращі клерки почали помічати кілька дивацтв у нашому діловодстві. Хоча вони, швидше за все, нічого не означають, їхня повсюдна присутність у наших фінансових операціях вказує на те, що якась особа або група може привласнювати кошти або ресурси. Це може потребувати подальшого розслідування... або ж простого нагадування стажисту, що потрібно рахувати уважніше."
  nf_shi.1.a:0 "Ми вивчимо це питання детальніше"
  nf_shi.1.b:0 "Кевін, підійди-но сюди!"

  nf_shi.2.t:0 "Серйозні розбіжності"
  nf_shi.2.d:0 "Раніше ми доручили провести розслідування дивних невідповідностей у наших записах та операціях. З того, що ми можемо сказати, здається, діє якась організована група, яка має намір зривати поставки та викачувати наші запаси і фінансування. Це викликає негайне занепокоєння і вимагає додаткової уваги. Однак будь-яке подальше розслідування потягне за собою додаткові витрати і може зіткнутися з новими перешкодами."
  nf_shi.2.a:0 "Ми повинні викорінити це"
  nf_shi.2.b:0 "Не може бути все так погано"

  nf_shi.3.t:0 "Під слідством"
  nf_shi.3.d:0 "Наші оперативники в [FROM.GetName] повідомили, що розпочалася низка розслідувань нещодавніх операцій, проведених нашим осередком. Хоча наших диверсантів ще не спіймали, швидкий прогрес ворога свідчить про те, що незабаром вони можуть опинитися під підозрою. Проте немає гарантії успішного розслідування, оскільки зростаючі витрати можуть зробити викорінення нашого осередку занадто дорогим для противника. Найбезпечнішим варіантом було б евакуювати наших оперативників прямо зараз. Це було б політичним ударом, але ми завжди змогли б розпочати нову серію проникнень, коли все вщухне. Більш ризикований, але прибутковіший варіант — продовжити операції на території [FROM.GetName] і просто сподіватися, що їм не вдасться нас спіймати."
  nf_shi.3.a:0 "Наші оперативники занадто важливі, щоб ними ризикувати"
  nf_shi.3.b:0 "У них немає шансів спіймати нас"

  nf_shi.4.t:0 "Перешкоди в розслідуванні"
  nf_shi.4.d:0 "Наші пошуки джерела невідповідностей, що вразили наші рахунки, зайшли в глухий кут. Додаткові кошти могли б залучити необхідні людські ресурси для вирішення проблеми, але завадили б нам витрачати їх на інші, важливіші потреби. З іншого боку, ми вже почали це розслідування, тож варто довести його до кінця."
  nf_shi.4.a:0 "За будь-яку ціну"
  nf_shi.4.b:0 "Давайте кинемо, поки ми ще у виграші"

  nf_shi.5.t:0 "Розслідування проходить гладко"
  nf_shi.5.d:0 "Здається, наше розслідування триває за планом, майже без опору з боку тих сил, що стоять за виявленими нами бухгалтерськими проблемами. Поки що жодних суттєвих результатів не знайдено, але час є нашим союзником у цьому методичному пошуку."
  nf_shi.5.a:0 "Хороші новини"

  nf_shi.6.t:0 "Розслідування завершується"
  nf_shi.6.da:0 "Результат нашого кропіткого розслідування нарешті готовий. Після ретельної перевірки наших рахунків та поставок ми виявили, що Ші стоять за низкою таємних операцій, кожна з яких завдала нам серйозного удару. Ми захопили декількох їхніх агентів, а також розкрили таємний осередок, який вони створили на наших землях. Тепер ці шпигуни Ші майже напевно вислані назавжди, хоча сама держава ще не поплатилася за своє правопорушення..."
  nf_shi.6.db:0 "Незважаючи на всі наші зусилля, нам не вдалося знайти надійних доказів корупції та тіньових оборудок на нашій території. Це не ідеально, але у нас завжди буде ще один шанс наступного разу, коли ці саботажники вирішать себе проявити."
  nf_shi.6.a:0 "Спіймані на гарячому!"
  nf_shi.6.b:0 "Хм..."

  nf_shi.7.t:0 "Наш осередок викрито"
  nf_shi.7.d:0 "Незважаючи на всі зусилля наших агентів, наш осередок у [FROM.GetName] було розгромлено, а багато наших інформаторів були вбиті або захоплені. Більшості наших оперативників вдалося втекти через кордон, але, схоже, нашій присутності в [FROM.GetName] завдано смертельного удару. Навряд чи ми зможемо знову проникнути туди, оскільки тепер вони будуть більш пильними до наших втручань."
  nf_shi.7.a:0 "Дідько"

#Old Events

  nf_shi.8.t:0 "Честь для всіх нас"
  nf_shi.8.d:0 "Деякі селяни стверджують, що Імператор правив з незапам'ятних часів, але мудреці знають, що ми прибули на стародавньому підводному човні під час Великої Війни. Покинуті династією Мао, ми оселилися в місті Сан-Франциско, відбудовуючи те, що пережило війну. \n\nЗ руїн підводного човна ми побудували палац, гідний Імператора, серце міста Ші-Таун. Слово Імператора доносилося до Ші через голос його найближчого радника, яким довгий час був шановний Кен Лі."
  nf_shi.8.a:0 "Перший Імператор приніс знання про море."
  nf_shi.8.b:0 "Мудрість Імператора направляла наше поселення."

  nf_shi.9.t:0 "Війни Дракона, Битви Тигра"
  nf_shi.9.d:0 "Акіґахаї була ще зовсім юною дівчиною, коли побачила, як її наставник, Дракон, впав перед «Героєм Наварро». На той час він був лише чужинцем, який приєднався до Ло Пана, ненависного суперника Дракона. Але незабаром він став тим, хто розгромив морських бандитів, вигнав Хабологів з міста і передав Імператору дивовижні технології. «Герой», який розбив її надії. \n\nЛо Пан здобув вплив, ставши новим улюбленцем народу. Дракон вирушив у подорож для самопізнання. За його відсутності його учні розійшлися, і Школа Дракона майже стерлася з пам'яті. \n\nАле Акіґахаї не збиралася відпускати те, що означало для неї так багато."
  nf_shi.9.a:0 "Скорботні солдати здобудуть перемогу."
  nf_shi.9.b:0 "Хороший кінь не повертається, щоб з'їсти скошену траву."

  nf_shi.10.t:0 "Відкрита долоня чи стиснутий кулак?"
  nf_shi.10.d:0 "Ло Пан керував Ші вже понад 30 років, відколи багато років тому відбулася його доленосна зустріч з Обраним. Під його та Імператора керівництвом Ші процвітали. Тісне партнерство з НКР принесло економічні можливості та мобільність. Селянин міг сам здобути для себе велич, якщо міг вхопити її силою власних рук. Такою була філософія Ло Пана. \n\nАле імпортуючи багатство з Каліфорнії, Ші імпортували і її біди. Ті, хто мав силу та багатство, щоб взяти владу, зачиняли за собою двері, залишаючи слабших знедоленими та безцільними. Суспільство віддалося споживацтву. Святилища предків занепали, а новорічні паради стали приводом для пияцтва. На хвилі невдоволення і смутку відроджена Школа Дракона Акіґахаї присягнулася підтримувати народ і зміцнювати його традиції. Ностальгія за простішими часами, коли Дракон очолював невеликий, але благородний народ, знайшла сприятливий ґрунт."
  nf_shi.10.a:0 "Збагачуватися — це славно."
  nf_shi.10.b:0 "Золоте гніздо не таке хороше, як власна будка."

  nf_shi.11.t:0 "Перший раунд дебатів"
  nf_shi.11.d:0 "Дракон і Ло Пан боролися словом і ділом за майбутнє Ші. Для Ло Пана конфлікт показує істину — люди підкоряються силі, і мало на кого з них можна вплинути праведністю. І з цими словами він рубонув своєю катаною аколіта Школи Дракона. \n\n «Це не так», — сказала доктор Шен, вдаривши ворога ногою з розвороту. «Коли править майстер, люди забувають про його існування. Трохи гірший той, кого люблять. Потім той, кого бояться. Найгірший — ти, той, кого зневажають». \n\n «Які перемоги ми здобудемо через страх? Яких друзів заведемо, щоб убезпечити себе?» Збиваючи чергового розбійника своїм посохом бо, Доктор вигукнула: «Коли нам бракує віри людей, ми вдаємося до клятв. Але коли ведуть найкращі, люди вигукують: 'Ми зробили все самі!'» \n\n Поки вирував хаос, радник Імператора, Кен Лі, спостерігав за битвою. Безперечно, Імператор визнає це вельми цікавим."
  nf_shi.11.a:0 "Держава сильна, коли сильні лідери."
  nf_shi.11.b:0 "Чим більше ти віддаєш, тим ти багатший."
  nf_shi.11.c:0 "Обчислення Імператора тривають."

  nf_shi.12.t:0 "Найбільший дар — це дружба. Наступний — лазерна гармата."
  nf_shi.12.d:0 "Схоже, Ші хочуть розширити об'єкт Братства в Сан-Франциско. Хоча загалом ми проти співпраці з чужинцями, що володіють передовими технологіями, у Ші є спільний інтерес у стримуванні Республіки, і ми були б дурнями, якби відмовили. Можливо, вони послужать нам, якщо станеться найгірше?"
  nf_shi.12.a:0 "Безсумнівно, Кодекс дозволяє це."

  nf_shi.13.t:0 "Скромне прохання."
  nf_shi.13.d:0 "Прибув посланець від Ші з проханням: профінансувати їхні починання. Це багатьох здивувало. Не так часто випадала нагода перетнутися з Ші, не кажучи вже про те, щоб один із них сам звернувся до нас. Чутки та історії розповідають про їхню технологічну міць — силу, з якою довелося б рахуватися, якби вони зволили вийти за межі свого палацу — і про містичні лози, які нібито очищають повітря. Ці легенди викликають інтерес у багатьох і страх у інших. Можливо, Ші стануть кращими друзями, ніж ворогами?"
  nf_shi.13.a:0 "Удача любить щедрих!"

  #Home From The War
  nf_shi.14.t:0 "Керівництво рідним домом"
  nf_shi.14.d:0 "Коли результати конфлікту в Наварро в'їлися в кістки втомлених людей, Ші порушили екзистенційні питання. Як вони будуть діяти далі? Чого вони навчилися? \n\n Акіґахаї, з ученням Дракона глибоко в серці, запропонувала повернутися до традицій. Їхній давній спосіб життя і привів їх сюди від самого початку. «Ці землі — наш дім. Ми за них боролися, проливали кров. До біса чужинців. Ця перемога довела нашу виняткову силу; ту, яку ми знайшли під проводом Дракона». \n\n Ло Пан скористався цією нагодою, щоб ще раз підтвердити свої переконання. Падіння Наварро відродило його пристрасть до розширення впливу Ші назовні — пліч-о-пліч з фракціями Пустки, що мислять схоже. «Ця перемога привернула увагу. Якщо люди нас не бояться, вони нами захоплюються. Нехай дізнаються наше ім'я!» \n\n Кен Лі зберігав рівновагу, і як радник Імператора він засудив обидві опозиційні сили. «Ви обоє занадто забігаєте наперед», — зауважив він. «Чи мушу я нагадати вам обом: якби старійшина Френсіс не запропонував свою мудрість Імператорові, ця перемога не була б такою славною? Солдат, який зрікається свого командира, — лише ходяча зброя». "
  nf_shi.14.a:0 "Переконаність Ло Пана була незрівнянною."
  nf_shi.14.b:0 "Акіґахаї непохитно стояла на своєму."
  nf_shi.14.c:0 "Імператор залишався в думках кожного."

#Thinking Of The Future
  nf_shi.15.t:0 "Що чекає попереду"
  nf_shi.15.d:0 "У Кена Лі був один аргумент, з якого він почав дебати: «Поки править Імператор, він знатиме, що робити. Усі його рішення приймаються в найкращих інтересах Ші. Завжди. Тому він має продовжувати наглядати за нашими дослідницькими операціями». Той факт, що Кен так довго тримався за цей пункт, розлютив Ло Пана. \n\n Але Ло Пан продовжував відстоювати свою правоту, навіть якщо шквал ударів був би втричі ефективнішим. «Але чи повинні ми дозволяти Імператору приймати рішення без нашої згоди? Хіба це справедливо? Чому ми повинні йти за людиною в тіні, ховаючись, ніби зовнішнього світу не існує, коли ми можемо зайняти цей трон і зробити більше?» — дорікав він, і його сповнені люті аргументи заводили людей навколо нього. Він купався в самовдоволенні; голови поверталися в його бік, схвально киваючи. \n\n І в розпал їхніх дебатів втрутилася жінка. Акіґахаї — одна з останніх учениць Дракона. Після падіння Дракона багатьох його учнів цуралися або вони самі відсторонилися, але Акіґахаї залишилася, і вона подбала про те, щоб люди знали цей факт. Як і її простягнуті руки, її слова тягнулися до натовпу — до переконань, які були прищеплені, а тепер дрімали. «Наша честь і майбутнє можуть підтримуватися лише нами самими. Якщо ми відмовимося від наших традицій, то більше не зможемо називати себе Ші»."
  nf_shi.15.a:0 "Ло Пан змусив замовкнути опонентів кулаком."
  nf_shi.15.b:0 "Акіґахаї схилила натовп на свій бік."
  nf_shi.15.c:0 "Рішення Імператора не оскаржуються"

  #Lower The Walls of Steel
  nf_shi.16.t:0 "Навіть торговці мають заслуги"
  nf_shi.16.d:0 "Під навісом з розлогих ліан, що гули від поглиненої радіації, повітря було чистішим. Низка дебатів зробила б трійцю суперниками, якщо не заклятими ворогами. Виникла ще одна тема для дебатів — ієрархічне суспільство Ші. \n\n Ло Пан більше не хотів мати нічого спільного з імператорами чи королями. Акіґахаї, на диво, погодилася з Ло Паном, але про себе розмірковувала, які корективи можна було б внести в існуючу систему, щоб вона відповідала її баченню. Кен Лі виступав проти них, стверджуючи, що їхнє ієрархічне суспільство забезпечує всім безпеку та продуктивність. Акіґахаї подумала, чи не дістався вплив Братства до Кена. Ло Пан був переконаний, що так воно і є. \n\n Але замість жорстоких слів і криків їхні дебати були спокійними — результат пересиченого і дивного знайомства, що виникло між ними трьома. Вони розмовляли за грою в маджонг і гірким чаєм, і коли все закінчилося, над ними нависла мовчазна рішучість."
  nf_shi.16.a:0 "Ло Пан виграв і гру, і дебати."
  nf_shi.16.b:0 "Акіґахаї вийшла з-за столу з посмішкою."
  nf_shi.16.c:0 "Кен залишився непохитним і пішов останнім."

  #The Legalist Debate
  nf_shi.18.t:0 "До біса совість"
  nf_shi.18.d:0 "Наплив дебатів про легізм збентежив Ло Пана. Не те щоб побудова закону навколо моральних переконань була незрозумілою, але зараз? Коли на горизонті з'явилися важливіші справи? Ло Пан вважав, що його правління на вулицях вправить мізки, але, здавалося, одного впалого Дракона було недостатньо. \n\n Кен Лі, якого часто бачили на заставах Братства в Сан-Франциско, був захоплений ідеєю створення особливого зводу законів — чесних і справедливих — яких мали б дотримуватися Ші. Як не дивно, запропоновані ним закони були схожі на кодекс Братства, хоча вони були розумними і, за загальним визнанням, схваленими Імператором. \n\n Акіґахаї виявляла таку ж зацікавленість в офіційному затвердженні зводу моральних законів для Ші. Вона присягнулася підтримувати честь і доброчесність у кожному аспекті своїх законів. Це мало б трансформувати їхні старі культурні традиції, щоб вони краще відповідали новому світу. Її слова знайшли відгук у тих, хто сумував за тим, як було раніше, і в тих, хто шукав комфортних змін."
  nf_shi.18.a:0 "Сильні правлять. Кінець історії."
  nf_shi.18.b:0 "Людство споконвіку будується на моралі."
  nf_shi.18.c:0 "Вірте в Імператора."

  nf_shi.17.t:0 "Падаюча зірка"
  nf_shi.17.d:0 "Питання про те, що робити з потужною державою, що сусідила з Ші, нарешті було винесено на обговорення. Ші вже мали короткі сутички з НКР раніше, але тема того, як з ними «впоратися» (що б це не означало), стала популярною під час розмов за чаєм з желе з османтуса про те, «друзі вони чи вороги». Проте за роки дебатів, дрібниць і тріумфів, у народу Ші на думці була лише одна людина, яка могла б провести їх через цю дилему. \n\n Чи буде це Ло Пан? Король вулиць і організатор падіння Дракона? Він чекав на шанс закріпити свою позицію як справжній лідер Ші. \n\n Чи Акіґахаї? Ходили чутки, що вона планувала викликати Ло Пана на поєдинок. За Дракона, за Ші. \n\n Можливо, це буде Кен Лі? У нього було багато ідей і він багато чого обіцяв. Зрештою, на його боці були і Імператор, і Братство в Сан-Франциско."
  nf_shi.17.a:0 "А потім, після одних фінальних дебатів, з'явилася відповідь."

#Initiate Truce
  nf_shi.19.t:0 "НКР шукає перемир'я!"
  nf_shi.19.d:0 "Чи то через нашу запеклу боротьбу, чи через зовнішню загрозу, апетит Ведмедя до війни слабшає!\nМи повинні захищатися ще рішучіше, щоб закріпити наші здобутки від Ведмедя!\n\nЗ волі Імператора, Ші вийдуть переможцями!"
  nf_shi.19.a:0 "Ми повинні пожерти Ведмедя!\nВперед!"
  nf_shi.19.b:0 "До Ведмедя нарешті повертається глузд"
  nf_shi.19.c:0 "Нам потрібно ще трохи часу, брати!"
#Notice truce
  nf_shi.20.t:0 "Ші вислизають з наших рук!"
  nf_shi.20.d:0 "Наш уряд починає нервувати через наш прогрес у війні проти Ші.\nЯкщо ми не переможемо їх протягом кількох місяців, вони домовляться про мирну угоду!"
  nf_shi.20.a:0 "Клятий Конгрес..."
#The Peace
  nf_shi.21.t:0 "Перемога"
  nf_shi.21.d:0 "Ми зробили це! Завдяки наставництву Імператора ми відігнали Ведмедя!\nНКР відступила і уклала мир.\nЯкщо пощастить, Ведмідь знайде нову здобич, щоб відволіктися."
  nf_shi.21.a:0 "Будемо сподіватися, що цей мир триватиме."
#NCR failure
  nf_shi.22.t:0 "Дракон приборкує Ведмедя"
  nf_shi.22.d:0 "Наш конфлікт тут загострився настільки, що наш народ більше його не підтримує.\nКонгрес вимагає нашого відходу з поселень Ші та земель, які вони займають."
  nf_shi.22.a:0 "Як принизливо!"
#Good Aid
  nf_shi.24.t:0 "Братство доставляє!"
  nf_shi.24.d:0 "Лост-Гіллз таємно переправили нам допомогу для нашого Відділення!\nМи повинні використовувати цю допомогу з розумом, щоб захистити всіх від небезпек технологій."
  nf_shi.24.a:0 "Semper Invicta!"

  nf_shi.23.t:0 "Старійшина Френсіс просить про підтримку!"
  nf_shi.23.d:0 "Хоча їхня відданість може бути сумнівною, Відділення в Сан-Франциско продемонструвало велику відданість нашій справі! Вони могли б стати чудовими союзниками, будучи так географічно близько.\nВідправка частини наших ресурсів може переконати цього... «Імператора» повністю прийняти нас як Братів!"
  nf_shi.23.a:0 "У нас може бути лише один шанс допомогти їм..."
#Bad aid
  nf_shi.25.t:0 "Благодійність Братства"
  nf_shi.25.d:0 "Лост-Гіллз, вочевидь, не надто в захваті від нашого Відділення...\n\nМожливо, нам варто переглянути Кодекс, щоб спробувати виправити наші стосунки?"
  nf_shi.25.a:0 "Ого. Дякую.\nВам не варто було."
#Bay Development
  nf_shi.26.t:0 "Куди веде Затока"
  nf_shi.26.d:0 "Тепер, коли Ведмідь перейшов на іншу здобич, наша Затока процвітає завдяки торгівлі та розвитку!\n\nУ Ші є кілька шляхів для майбутнього, і саме ми маємо направляти її.\nЯк ми маємо керувати розвитком нашого народу?"
  nf_shi.26.a:0 "Нашому флоту потрібні покращення"
  nf_shi.26.b:0 "Ми повинні панувати в повітрі"
  nf_shi.26.c:0 "Ми повинні інвестувати в робототехніку"
#NCR Rangers
  nf_shi.27.t:0 "Ті кляті Ковпаки!"
  nf_shi.27.d:0 "Хабологи в Наварро швидко стали проблемою завдяки припасам від Ведмедя.\nПівнічно-східні штати стали майже некерованими, чим НКР неодмінно скористається в разі вторгнення.\n\nМи повинні підготувати наші оборонні позиції за межами території Зоряних Дітей, інакше їхню позицію розкриють рейнджери НКР...\nЯкщо вони вже цього не зробили."
  nf_shi.27.a:0 "Ведмідь і Ковпаки?\n*блює*"
#SHI redemption
  nf_shi.28.t:0 "Сварка закоханих"
  nf_shi.28.d:0 "Як дружина, що потерпає від насилля, Ло Пан побіг назад до Ведмедя.\nШкола Дракона відповіла тим, що покинула свою школу і заснувала нову школу Істинного Змія для опору."
  nf_shi.28.a:0 "Це справді аб'юзивні стосунки"
#Wild Wasteland
  nf_shi.29.t:0 "Запізнілий подарунок"
  nf_shi.29.d:0 "Під час розчищення дна затоки Сан-Франциско наші люди знайшли дещо, про що одразу ж повідомили [Root.GetLeader]. Прибувши до найближчої бухти, аномалія спочивала в калюжі багнюки, яку притягла з собою з дна затоки. Бомба рішуче стояла під пильним поглядом [Root.GetLeader], як і напис на боці цієї Згуби Старого Світу."
  nf_shi.29.a:0 "З любов'ю\nВід §PАнклаву§!"

  nf_shi.30.t:0 "Останній на борту"
  nf_shi.30.d:0 "Натовп зібрався в гавані Сан-Франциско. Чималий корабель, що прибув з далекої півночі, можливо, аж з Аляски, врізався прямо в доки і зупинився без жодної живої душі на борту. Ніхто не постраждав, але корабель, керований привидами, викликав неабияке занепокоєння серед тих, хто працював біля моря. У результаті [SHI.GetName] відправили команду для розслідування судна під керівництвом Майстра Тана.\n\nЗвіт, який він привіз, був дивовижною історією про те, як один «заєць», що сховався, аби помститися за свою сім'ю, зумів знищити весь екіпаж корабля, використовуючи лише власне тіло і Силовий Кастет. Деякі ще були живі, непритомні, але дихали. Інших викинули за борт, і найближчими днями їх знайдуть частково з'їденими морськими мешканцями. Треті ж були мертві на місці, причому в одного чоловіка голова була викручена на сто вісімдесят градусів по вертикалі. Пропозиція Майстра Тана полягала в тому, щоб негайно прийняти того, хто явно був великим і могутнім воїном, до наших лав. Шкода, що його язик має... цікаву мутацію."
  nf_shi.30.a:0 "Напевно, він знає, що робить!"

  # Tooltips
  shi_cell_investigate_tt:0 "Це дасть нашим цілям можливість розслідувати наш осередок"
  shi_cell_abandon_tt:0 "Ми покинемо осередок, який побудували на території цілі"