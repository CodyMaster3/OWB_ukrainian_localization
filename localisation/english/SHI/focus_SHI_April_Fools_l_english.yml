l_english:
shi_nothing_out_of_the_ordenary:0 "Король Сан-Франа"
  shi_nothing_out_of_the_ordenary_desc:0 "Вибачте! Король почувається недобре, будь ласка, зайдіть іншим разом. \n...Щось не так..."
  
  shi_visions_of_4_kings:0 "Пантеон Америки"
  shi_visions_of_4_kings_desc:0 "Це місце не мій дім. Тут чогось не вистачає, чогось важливого. Боже, я не можу викинути ці кляті видіння з голови! Що привело мене сюди?! Чого від мене вимагають?!"
  
  shi_a_lordless_land:0 "Земля без володаря"
  shi_a_lordless_land_desc:0 "О... О, тепер усе так очевидно: це місце понівечене, спалене, спустошене, і нікому навіть вимести попіл."
  
  shi_absolutism:0 "Абсолютизм"
  shi_absolutism_desc:0 "Ця земля потребує такого довгоочікуваного генерального прибирання, і я не можу дозволити, щоб надокучлива політика стояла на моєму шляху."
  
  shi_enlightened_protector:0 "Просвітлений Захисник"
  shi_enlightened_protector_desc:0 "Пустка варта лише того, чого вартий народ, яким вона править. Якщо ми не можемо довірити нашим людям керувати собою, як ми маємо моральне право керувати іншими?"
  
  shi_golden_monarch:0 "Золотий Монарх"
  shi_golden_monarch_desc:0 "Наш Лорд-Протектор сяє, мов золото, на тлі сталі та тліючого вугілля безкрайніх пусток."
  
  shi_cult_of_steel:0 "Друга громадянська війна в Америці"
  shi_cult_of_steel_desc:0 "Братство Сталі уявило себе якимось лицарем у сяючих обладунках, що захищає всі технології. Що ж, хлопці Нортона розкриють їх, як пару бляшанок з тунцем, і ми звільнимо людей, які живуть під гнітом їхньої техно-теократії."
  
  shi_knights_in_shining_armour:0 "Лицарі в сяючих обладунках"
  shi_knights_in_shining_armour_desc:0 "Що може бути більш казковим, ніж зміна переконань? Звісно, не для нас, а для техножерців та сталефілів, які тепер захищатимуть людей, яких колись гнобили, тією ж самою зброєю, якою гнобили."
  
  shi_quash_foolish_fairytales:0 "Покласти край дурним казкам"
  shi_quash_foolish_fairytales_desc:0 "У світі, який ми прагнемо створити, немає місця для ігор з експериментальною зброєю. Спаліть усе це дотла і зметіть разом із рештою попелу старого світу."
  
  shi_only_government_deserving_of_cali:0 "Мандат Каліфорнії"
  shi_only_government_deserving_of_cali_desc:0 "Мене переслідують крики каліфорнійців, вони благають про воду! На що їхній уряд відповідає, гарантуючи воду лише величезним полям Баронів. Вони благають про їжу! На що їхній уряд відповідає, відправляючи їх до Нью-Вегаса в якійсь відчайдушній спробі заполонити Стріп юрбами їхніх голодуючих дітей. Піддані Імператора, ваші співвітчизники-каліфорнійці волають до Нортона! Що ж? Чи дозволимо ми їм страждати і голодувати вічно? Чи відповімо на їхні благання і приймемо наших втрачених співвітчизників?"
  
  shi_norton_industries:0 "Нортон Індастріз"
  shi_norton_industries_desc:0 "Армії не воюють, а робітники не працюють без зброї в руках і їжі в шлунках. Давайте балансувати на канаті економіки та вести нашу націю в майбутнє."
  
  shi_board_of_supervisors:0 "Наглядова Рада"
  shi_board_of_supervisors_desc:0 "Наглядова Рада, яка одягла Нортона I, давно мертва, але за допомогою кількох дружніх гулів ми можемо відтворити цей регуляторний орган. Незабаром увесь Сан-Франциско буде одягнений, нагодований і забезпечений житлом. Слава Нортону!"
  
  shi_state_defense_force:0 "Сили оборони держави"
  shi_state_defense_force_desc:0 "Благодійність у пустці — це ніщо інше, як маяк, на який сліпо йдуть рейдери. Антропологія — це мистецтво шахрайства. Ні, відкиньте абсурдні ідеали цивілізованості в цьому ворожому світі. Наша армія захищатиме Сан-Франциско, а не якісь там пожертви."
  
  shi_executive_of_the_commoner:0 "Виконавчий орган простолюдинів"
  shi_executive_of_the_commoner_desc:0 "Царственість може засліпити й не дати побачити біди простолюду. І так само, як Нортон був Королем, обраним з-поміж простолюдинів, так і ми оберемо простолюдинів, щоб вони просвіщали нас і не давали забути, за що ми боремося."
  
  shi_high_colonelship_defense_industry:0 "Оборонна промисловість Вищого Полковництва"
  shi_high_colonelship_defense_industry_desc:0 "Будь-яка битва виграється або програється задовго до того, як армії зберуться на полі бою. Справді, битви виграють чоловіки та жінки, які закручують ковпачки на снарядах і штампують латунь. Наша знать ідеально розташована для фінансування та управління цими військовими галузями."
  
  shi_commander_of_all_armed_forces_in_the_mandate_of_imperial_auhority:0 "К.У.З.С.М.І.В."
  shi_commander_of_all_armed_forces_in_the_mandate_of_imperial_auhority_desc:0 "К... Командувач усіх Збройних Сил Мандату Імперської Влади організовуватиме наші сили як всередині країни, так і за кордоном. \n\nЧи дійсно всі ці титули настільки необхідні? Це стає трохи смішним."
  
  shi_committee_on_the_state_of_welfare_and_standards_of_living_under_the_reign_of_his_imperial_majesty:0 "К.Д.Р.Ж.П.Й.І.В."
  shi_committee_on_the_state_of_welfare_and_standards_of_living_under_the_reign_of_his_imperial_majesty_desc:0 "Ем... так. Він наглядатиме за управлінням та розподілом допомоги знедоленим серед підданих Нортона."
  
  shi_the_FART:0 "П.У.К."
  shi_the_FART_desc:0 "Назви виходили з-під контролю, тому ми створили Повноважного Урядового Казначея (П.У.К.), щоб гарантувати, що більше ніяких дурниць із нашими правилами найменувань не станеться."
  
  shi_imperial_army:0 "Імперська армія"
  shi_imperial_army_desc:0 "Його величність не може звільнити пустку мирним шляхом: хоч би як він цього хотів, йому все одно знадобиться передова та добре оснащена армія, щоб відібрати владу у тиранів."
  
  shi_rapid_response_royal_guard:0 "Королівська гвардія швидкого реагування"
  shi_rapid_response_royal_guard_desc:0 "Королівська гвардія, яка застрягла на одному місці, нічим не краща за бетонну горгулью."
  
  shi_parade_across_norton_bridge:0 "Коронація мосту Імператора Нортона"
  shi_parade_across_norton_bridge_desc:0 "Хоча це й не початкове місце його грандіозного бачення тунелю та мосту, немає кращого мосту, ніж Золоті Ворота, і тому немає кращого місця для свідчення спадщини Його Милості Імператора Нортона Першого."
  
  shi_reorganization_of_california:0 "Реорганізація Каліфорнії"
  shi_reorganization_of_california_desc:0 "Ні для кого не секрет, що центр важливості більше не знаходиться в Каліфорнії, а радше в місті гріха та розпусти. Його Милість убезпечить це місто, а потім вирушить вниз по Колорадо до Бахи та на Схід, і все це заради народу Каліфорнії, а також щоб повернути та підтвердити свій успадкований титул Лорда-Протектора Мексики."
  
  shi_recognization_of_pacific_unity:0 "Визнання Тихоокеанської Єдності"
  shi_recognization_of_pacific_unity_desc:0 "Можливо, в інший час ця істина була б загальновідомою серед жителів західного узбережжя, але тут і зараз Нортон принесе світло об'єднаного Тихого океану всім, хто тулиться в його печерах і рибалить на його берегах."
  
  shi_empire_of_america:0 "Американська Імперія"
  shi_empire_of_america_desc:0 "Титул Америки був заплямований тими, хто бажає використати її славу та репутацію для геноциду її народу. Що ж, більше ніколи! Більше жодних геноцидів, монстрів чи неконтрольованого ШІ. Ті, хто опиниться в Америці, опиняться вільними від тиранії!"
  
  shi_restructure_government:0 "Реструктуризація нашого уряду"
  shi_restructure_government_desc:0 "Потреби нашої адміністрації постійно змінюються, усунення кількох непокірних бюрократів завадить їм створювати проблеми, а також допоможе розрядити обстановку на нашому кордоні."
  
  shi_hand_out_royal_titles:0 "Роздача королівських ділових титулів"
  shi_hand_out_royal_titles_desc:0 "Нестримний капіталізм — це те, що призвело і до Другої громадянської війни в Америці, і до Великої війни. Обмежуючи діяльність бізнесу, ми можемо регулювати та концентрувати багатство."