l_english:
  nf_shi_april.1.t:0 "Сонячний день у Сан-Франциско"
  nf_shi_april.1.d:0 "Це був теплий весняний день, коли король Нортон прокинувся від чудових новин! Американська Союзна Держава була відтіснена до околиць Денвера, мир з Канадою подарував нам новостворену Каліфорнійську Колумбію, а останній осередок опору в Мексиці був розчавлений. \n\nБезглузді звіти про республіканських терористів і зброю масового знищення не зіпсують новини, як і новини про атаки токсичним газом у Сан-Дієго, або е-е... Королівську гвардію, що бігає внутрішнім двором під вікном його величності, або..... яскравий спалах у Затоці. \n\nМить потому уламки розплавленого скла полетіли в короля Нортона, а ще через мить він та його палац опинилися в новому дивному світі...."
  nf_shi_april.1.a:0 "Що врізалося у Сталевий Палац?!"
  
  nf_shi_april.2.t:0 "Диявол за очима"
  nf_shi_april.2.d:0 "Тижні я витрачаю на задушливу нудьгу повсякденного життя. А потім раптом прокидаюся і розумію, що тижні й місяці мого життя були лише уявою. Але це ще не кінець, поки я не помічаю сповненого ненависті, віслюкоподібного чоловіка з тіней, який, щойно його помічають, паралізує мене, поки істоти повзають по моїй поритій віспою шкірі. Це триває годинами, поки я не прокидаюся востаннє, і моя єдина втіха — безпека вдень до наступного відпочинку, а з ним — і наступна ймовірність побачити його. "
  nf_shi_april.2.a:0 "Скільки ще, поки він не завітає знову..."
  
  nf_shi_april.3.t:0 "Вічність звучить як Пекло"
  nf_shi_april.3.d:0 "Знову мене відвідав кремезний чоловік із коронами. Він розповідав мені історії про бегемотів, неписьменність і трупи, що гниють у болоті. Що йому потрібно — я не маю жодного уявлення. Відомо лише те, що він з'явиться знову і затопить мої спогади своїми словами."
  nf_shi_april.3.a:0 "Яке створіння прокляло мене бути його гуліфікованою музою?"
  
  nf_shi_april.4.t:0 "Легкий удар, щоб нагадати, що я все ще стежу"
  nf_shi_april.4.d:0 "Сидячи на вулиці та дивлячись, як горить мій палац, а його багатства розграбовано, я посміхаюся. Це видіння гарантує візит мого улюбленого з примар, що переслідують мене. Він теж застряг у світі, який не для нього. Для нього не існує класу роботодавців, проти якого можна було б вести війну, немає робітників, чию працю викрадають. \n\nМи сидимо і дивимося на полум'я, час від часу змахуючи вуглинки або ділячись якоюсь історією. В усьому іншому панує тиша. "
  nf_shi_april.4.a:0 "Цікаво, чи він також застряг у цьому світі."
  
  nf_shi_april.5.t:0 "Король захворів"
  nf_shi_april.5.d:0 "Король погано переніс акліматизацію до підвищеної радіації. Його нудило і лихоманило весь тиждень, це, разом із частими нічними кошмарами та мігренню, зробило його кволим і виснаженим."
  nf_shi_april.5.a:0 "Ми можемо лише молитися, щоб його тіло оговталося від радіації."
  
  nf_shi_april.6.t:0 "Пантеон Америки"
  nf_shi_april.6.d:0 "Король у паніці прокинувся від чергового кошмару. Йому наснилося, що його шкіра злазить, а люди на вулиці витріщаються, вказують пальцями та жбурляють у нього образи. \n\nВін повернувся до своєї лампи лише щоб знайти тулуб огрядного чоловіка, що тримав в обіймах десятки корон. Скочивши з ліжка, гукаючи варту, він зазирнув за ліжко і побачив, що чоловік зник. Це було вперше, але не востаннє. Його сни часто відвідували ті самі три примари. Чоловік із коронами, який показував видіння його Королівської скарбниці, яку грабували натовпи розлючених, голодних людей. Другий, Кремезний чоловік, його ліве око осліпло, а руки були у пухирях і синцях від років важкої праці, він переслідував його снами про гулів і механічних людей, над якими знущалися та на яких полювали по всій пустці. І насамкінець — жилавий, розлючений чоловік, чиї очі були порожніми, заміненими люттю й ненавистю. \n\nВони були залишками його Америки, тієї Америки, з якої його викрали, щоб перенести сюди."
  nf_shi_april.6.a:0 "Щоночі я молюся, щоб усе це було сном, а не чистилищем за мої гріхи."
  
  nf_shi_april.7.t:0 "Беззаконня на вулицях Сан-Франциско"
  nf_shi_april.7.d:0 "Я прогулювався вулицями Сан-Франциско, коли я і мій почет потрапили в засідку Лоялістів Ші та Хабологів. Хоча вони билися мужньо, Королівська гвардія не могла зрівнятися з лазерною та гамма-зброєю нападників. Опинившись під перехресним вогнем гамма-зброї, я знепритомнів. Прокинувшись, я опинився на складі, повному токсичного мулу та бочок з радіацією, в оточенні Хабологів і віч-на-віч із чоловіком, вплавленим у бетон; те, що залишилося від його тіла, було неможливо відрізнити від мулу, що витікав із бочок з боків від нього. Повільно жерці Хабологів нахилили моє крісло до чоловіка, який тепер кричав. Жар обпалював мені горло й висушував очі. Радіація в'їдалася в моє обличчя, ракові плями виростали і відмирали, залишаючи мою шкіру поритою і запалою. Миті тортур розтягнулися у вічність, що нарешті перервалася, коли моя охорона вдерлася на склад і вбила жерців."
  nf_shi_april.7.a:0 "Мої нічні жахи стали реальністю..."
  
  nf_shi_april.8.t:0 "Відповіді на мої Три загадки"
  nf_shi_april.8.d:0 "Нортон зійшов на крижану гору в пошуках Боса, відомого на весь світ. На вершині засніжених скель була печера, освітлена багаттям, полум'я якого висвітлювало намальовану книгу історій про Боса. Нортон вклонився перед трьома постатями в плащах — трьома людьми, які могли б допомогти зрозуміти його нічні жахи. \n\nНайнижчий тримав смолоскип, полум'я якого живилося з пропанового балона. \n\n Середній тримав в'язку ключів, замки від яких були загублені в часі. \n\nА Найвищий тримав двоствольний дробовик із дулом, вкритим наклейками у вигляді полум'я, які вкрилися крижаною кіркою. \n\nБез зайвих слів Найвищий кинув у полум'я порошок, через що кімнату заповнив густий дим, який почав виходити з печери. У диму з'явилася фігура на тлі Прапора Фенікса. Його слова до Нортона були простими: \"Ти виграв гру, що була тобі призначена. Зроби скриншот того, що бачиш, і тегни мене в discord через @SGucciG. На момент виходу цього контенту мене можуть звати SOctaG.\" Витримавши паузу, він продовжив: \"Нортон, твоя місія в цьому світі завершена. У тебе є вибір: дозволити своєму розуму повернутися до твого світу, де громадянська війна шматує труп Америки, або залишитися тут, зі своїм обпаленим обличчям, і спробувати викувати майбутнє для людей цього світу.\""
  nf_shi_april.8.a:0 "Гой-Король! Відправ мене додому! Цей світ — не місце для людини мого ґатунку!"
  nf_shi_april.8.b:0 "Цей світ потребує мене. І..... я потребую його."
  
  nf_shi_april.10.t:0 "Автодок за ваш час?"
  nf_shi_april.10.d:0 "Я наближаюся до останнього осяйного маяка технологій у пустці в пошуках однієї простої речі — ліків. Останній удар по моїх недугах знаходиться у Мормонському Форті, за спиною самотнього чоловіка, який просто хоче мого товариства."
  nf_shi_april.10.a:0 "Монетку за ваші думки, докторе Геннон?"
  nf_shi_april.10.b:0 "У жодному разі я не хочу їхніх 'ліків'. Я хочу відповідей, чорт забирай!"
  nf_shi_april.10.c:0 "Мені подобається, як мислить цей хлопець. Він точно зможе допомогти мені в моєму завданні!"
  
  nf_shi_april.11.t:0 "Столиця Нової Каліфорнії"
  nf_shi_april.11.desc:0 "З коронацією Нортона як Короля Каліфорнії ми тепер маємо можливість обрати нову столицю."
  nf_shi_april.11.a:0 "Сан-Франциско — батьківщина династії Нортонів."
  nf_shi_april.11.b:0 "Усі шляхи ведуть до Шейді Сендс."
  nf_shi_april.11.c:0 "Некрополь — це плавильний котел гулів і людей."
  nf_shi_april.11.d:0 "Нове Сакраменто — символ старого та нового."