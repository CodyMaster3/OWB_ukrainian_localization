  #Akigahai Ideas

  SHI_the_emperor_personal:0 "Наш Особистий Імператор"
  SHI_the_emperor_personal_desc:0 "Коли справжня сутність «Імператора» була розкрита, він втратив значну частину свого культурного значення. Проте тепер його можна легше використовувати нам на користь без потреби в таємничості та фанфарах."
  SHI_the_emperor_improved:0 "Імператор"
  SHI_the_emperor_improved_desc:0 "Імператор — це передова комп'ютерна система, яка керує Ші з тіні, і про її існування знають одиниці. Імператор здатний передбачити майже все, що дозволяє Ші готуватися до загроз задовго до їх появи."

  SHI_crane_long_death:0 "Вмираючий Журавель"
  SHI_crane_long_death_desc:0 "Школа Журавля відходить у минуле, втрачаючи свій авторитет та актуальність. Але поки вони ще дихають, вони ускладнюватимуть нам життя..."

  SHI_precision_idea:0 "Зброя ручної роботи"

  shi_new_life_modifier:0 "Рух за Нове Життя"

  SHI_aki_democracy_idea:0 "Старі традиції, нова демократія"
  SHI_aki_democracy_idea_2:0 "Народні принципи"

  SHI_aki_brotherhood_idea:0 "Примирення з Братством"

  SHI_imperial_idea_aki:0 "Імператорське керівництво"

  SHI_ncr_hate_idea:0 "§RПокарати ворога!§!"
  SHI_overwhelming_xenophobia_idea:0 "§RКсенофобська пожежа§!"
  SHI_overwhelming_xenophobia_idea_desc:0 "Наш народ охопило шаленство відрази до чужинців. Цей запал можна використати на нашу користь, але ненависть до іноземців матиме наслідки для нашої економіки та обміну ідеями."
  SHI_dharma_alliance_idea:0 "Співпраця дгармістів"
  SHI_dharma_alliance_idea_desc:0 "Дгармістські групи в НКР надають підтримку нашому режиму, сподіваючись надихнути свою націю на повернення до скромніших часів."
  SHI_californian_dread_idea:0 "Жах Каліфорнії"
  SHI_californian_dread_idea_desc:0 "Знищивши Велике Західне Світло цивілізації, ми здобули грізну репутацію в Пустці."
  SHI_disciplined_california_idea:0 "Дисциплінована Каліфорнія"
  SHI_disciplined_california_idea_desc:0 "Під нашим керівництвом Каліфорнія перетвориться з країни лінощів і марнотратства на країну працьовитості та порядку."
  SHI_united_california_idea:0 "Нова каліфорнійська душа"
  SHI_united_california_idea_desc:0 "Під нашим керівництвом Нова Каліфорнія знайде свою душу. Поки що вони можуть обурюватися нашими зусиллями, але одного дня вони прокинуться в мирі, який ми їм принесемо."

