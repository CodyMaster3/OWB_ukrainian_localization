  SHI_california_armed_camp_idea:0 "Нова Каліфорнія — це озброєний табір!"
  SHI_california_armed_camp_idea_desc:0 "Пліч-о-пліч з Президентом-Генералом НКР ми перетворимо Каліфорнію на землю, готову до війни!"

  SHI_unfettered_profit_idea:0 "Необмежена нажива"
  SHI_unfettered_profit_idea_desc:0 "Більше ніяких обмежень, ніяких бюрократів, ніяких протестів. Лише справжні чоловіки, що діють рішуче."

