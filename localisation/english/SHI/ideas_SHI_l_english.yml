  shi_dojo_truce_desc:0 "Перед обличчям агресії Ведмедя Дракон і Журавель об'єдналися!"
  shi_two_schools:0 "Філософська невизначеність"
  shi_two_schools_desc:0 "Того фатального дня, коли Обраний схилив терези на користь Ло Пана, Журавель здобув перемогу над Драконом. Відтоді в затоці справді стало спокійніше, це правда, але не через відсутність внутрішніх випробувань. Адже уми гордого народу не завойовуються з легкістю, і так само, як конфлікт за конфліктом вражає Пустку, ідеологічна війна триває біля брами до Тихого океану. \n\nАкіґахаї та всі, хто досі вірний школі Дракона, далекі від визнання поразки. Тож поки Ведмідь прогинається під власною вагою, а наша залежність від нього з кожним днем стає все більшим тягарем, бачення Ло Пана щодо Ші починає втрачати свій блиск. Делегація Братства в місті — яка все ще залишається, незважаючи на бойові дії з НКР на півдні, — лише ускладнює ситуацію; хоча їх і небагато, їхня дивна й одержима відданість Імператору закріпила їх у нашій політиці на осяжне майбутнє. \n\nІ так, поки доля Західного узбережжя стає все більш невизначеною, ставки в дебатах, що мають розпочатися, досягли критичного рівня. Лише випробувавши ці ідеї на світовій арені, Сан-Франциско нарешті об'єднається заради єдиної мети."
  shi_navarro_tension:0 "Проблеми на кордоні"
  shi_navarro_tension_desc:0 "Оскільки території Наварро стають дедалі нестабільнішими, заворушення спалахнули й удома. Поки одні палко закликають нас втрутитися заради наших північних поселенців, інші міцно тримаються за свої статки в страху перед тим, що має статися."

  #April Fools Stuff

  shi_fart_factory:0 "Нагляд за індустріалізацією П.У.К."
  shi_fart_factory_desc:0 "Хоча головною метою П.У.К. є обмеження створення громіздких назв організацій, він також контролює концентрацію та напрямок розвитку Королівської промисловості."
  shi_mandate_of_california:0 "Мандат Каліфорнії"
  shi_mandate_of_california_desc:0 "Народ Каліфорнії обрав нас, щоб вести його в нову еру процвітання."
  shi_imperial_army_1:0 "Імперська армія"
  shi_imperial_army_1_desc:0 "Його величність не може звільнити пустку мирним шляхом: хоч би як він цього хотів, йому все одно знадобиться передова та добре оснащена армія, щоб відібрати владу у тиранів."
  shi_militarization_of_servo_servatude:0 "Мілітаризація Серво-прислуги"
  shi_militarization_of_servo_servatude_desc:0 "Піддані Нортона не звільняються від служби його величності лише через відсутність у них плоті та м'язів. Усі будуть призвані заради мрії його величності."
  shi_imperial_army_2:0 "Імперська армія"
  shi_imperial_army_2_desc:0 "Його величність не може звільнити пустку мирним шляхом: хоч би як він цього хотів, йому все одно знадобиться передова та добре оснащена армія, щоб відібрати владу у тиранів."