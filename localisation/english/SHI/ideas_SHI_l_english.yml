  SHI_incompetent_managers_idea:0 "Некомпетентне керівництво"
  SHI_incompetent_managers_idea_desc:0 "Призначення людей на посади в бізнесі на основі лояльності не сприятиме їхній ефективності в короткостроковій перспективі. Проте згодом вони можуть навчитися виконувати свою роботу краще..."

