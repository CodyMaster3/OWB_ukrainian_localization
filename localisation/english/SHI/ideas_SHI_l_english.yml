  SHI_bos_treaty:0 "Договір про дружбу та співпрацю між Ші та Братством"
  SHI_bos_treaty_desc:0 "Цей договір визнає особливі відносини між державою Ші та Братством Сталі і встановлює їхні взаємні зобов'язання щодо співпраці."

  SHI_bos_treaty_bos:0 "Договір про дружбу та співпрацю між Ші та Братством"
