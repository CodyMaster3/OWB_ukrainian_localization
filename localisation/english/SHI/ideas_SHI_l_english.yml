l_english:
  #shi_shi_huang_ti:0 "Ші-Хуан-Ті"
  #shi_shi_huang_ti_desc:0 "Предками нинішніх Ші були члени екіпажу китайського підводного човна «Ші-Хуан-Ті», який викинуло на берег у Сан-Франциско незабаром після Великої війни. Незважаючи на екстремальний рівень радіації, що зберігався в палаючих руїнах міста, їм вдалося закріпитися (у колишньому Чайнатауні, не інакше). Поступово з підводного човна зняли всі підсистеми, оскільки вони знайшли нове призначення, служачи Ші — так стала називати себе група вцілілих. Імператор, легендарний лідер Ші, оселився у «Сталевому палаці» — цитаделі, створеній з металу, врятованого з підводного човна."
  shi_ghosts_of_the_pacific:0 "Привиди Тихого океану"
  shi_ghosts_of_the_pacific_desc:0 "Понад три десятиліття тому Обраний передав Ші креслення гвинтокрилів від Анклаву — таємної організації, що планувала знищити все живе в Пустці. Після їхньої поразки Ші здобули багато знань про технології польоту, і тепер готові знову повернути їх до Каліфорнії."

  #New Ideas
  SHI_battle_for_streets:0 "Битва за вулиці"
  SHI_battle_for_streets_desc:0 "Хоча Ші й не перебувають у стані повної анархії, людям з НКР вони можуть здаватися саме такими. Серед білого дня майстри кунг-фу різних шкіл сваряться та б'ються, часто завдаючи шкоди майну. \n\nАле це лише верхівка айсберга; непомітно, пошепки, люди, віддані Школі Дракона та Школі Журавля, ведуть смертельні битви. Ло Пан прагне посилити свій особистий вплив на суспільство Ші, тоді як Акіґахаї сподівається перешкодити йому і повернути Ші до їхнього коріння. Жоден з них не поступиться іншому, і, ймовірно, насильство триватиме, доки один не здобуде остаточну перемогу. Звісно, Братство Сталі ще може стати достатньо популярним під патронатом Сталевого Палацу, щоб самостійно принести мир..."
  SHI_battle_for_streets_negot:0 "Битва за вулиці"
  SHI_battle_for_streets_negot_desc:0 "Хоча Ші й не перебувають у стані повної анархії, людям з НКР вони можуть здаватися саме такими. Серед білого дня майстри кунг-фу різних шкіл сваряться та б'ються, часто завдаючи шкоди майну. \n\nАле це лише верхівка айсберга; непомітно, пошепки, люди, віддані Школі Дракона та Школі Журавля, ведуть смертельні битви. Ло Пан прагне посилити свій особистий вплив на суспільство Ші, тоді як Акіґахаї сподівається перешкодити йому і повернути Ші до їхнього коріння. Жоден з них не поступиться іншому, і, ймовірно, насильство триватиме, доки один не здобуде остаточну перемогу. Звісно, Братство Сталі ще може стати достатньо популярним під патронатом Сталевого Палацу, щоб самостійно принести мир..."

  SHI_economic_woe:0 "Ведмежа економіка"
  SHI_economic_woe_desc:0 "В обох сенсах цього слова Ші переживають «Ведмежу економіку». НКР, запрошена і заохочувана Ло Паном, мала глибокий вплив на напрямок розвитку Ші. Відкриття країни, поява середнього класу, зміна поглядів. Проте останніми роками це також призвело до економічного спаду. Прості люди відчувають себе експлуатованими та покинутими вищими верствами, а наслідки війни між НКР та Братством виснажили скарбницю нашого найбільшого партнера. \n\nЛо Пан стверджує, що це лише циклічне явище, і що людям потрібно бути сильними, щоб пережити цю кризу. Акіґахаї ж доводить усім, хто готовий слухати, що це неминучий наслідок прив'язки до несправедливої системи. Лише дистанціювання та незалежність врятують їх, або принаймні так вона стверджує. \n\nХоча правда може бути суб'єктивною, страждання людей гальмуватимуть цю державу, доки не буде знайдено рішення..."
  SHI_economic_woe_2:0 "Ведмежа економіка"
  SHI_economic_woe_2_desc:0 "В обох сенсах цього слова Ші переживають «Ведмежу економіку». НКР, запрошена і заохочувана Ло Паном, мала глибокий вплив на напрямок розвитку Ші. Відкриття країни, поява середнього класу, зміна поглядів. Проте останніми роками це також призвело до економічного спаду. Прості люди відчувають себе експлуатованими та покинутими вищими верствами, а наслідки війни між НКР та Братством виснажили скарбницю нашого найбільшого партнера. \n\nЛо Пан стверджує, що це лише циклічне явище, і що людям потрібно бути сильними, щоб пережити цю кризу. Акіґахаї ж доводить усім, хто готовий слухати, що це неминучий наслідок прив'язки до несправедливої системи. Лише дистанціювання та незалежність врятують їх, або принаймні так вона стверджує. \n\nХоча правда може бути суб'єктивною, страждання людей гальмуватимуть цю державу, доки не буде знайдено рішення..."

