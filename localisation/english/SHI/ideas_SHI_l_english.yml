  SHI_golden_tiger_legation_idea:0 "Легація Золотого Тигра"
  SHI_golden_tiger_legation_idea_desc:0 "Представники Імперії з нашої стародавньої батьківщини тепер проживають тут, пропонуючи певні послуги."
  SHI_golden_tiger_legation_idea_2:0 "Легація Золотого Тигра"
  SHI_golden_tiger_legation_idea_2_desc:0 "Представники Імперії з нашої стародавньої батьківщини тепер проживають тут, пропонуючи певні послуги. Тепер вони нав'язують нам свої вимоги і приниження, ставлячись до нас як до васалів, а не як до рівних."

  #Research Ideas
  SHI_recruit_mutants:0 "Вербування мутантів"
  SHI_recruit_mutants_desc:0 "Ми витрачаємо ресурси на те, щоб переконати супермутантів прибути на нашу територію для проведення випробувань. Деякі з них навіть можуть залишитися тут на постійне проживання!"

  SHI_super_solider_idea:0 "Сироватка Суперсолдата"
  SHI_super_solider_idea_desc:0 "Створена на основі ВРЕ, ця розбавлена версія забезпечує незначне покращення фізичних показників, залишаючись при цьому безпечною для використання. Що ж, можливо, є ДЕЯКІ побічні ефекти, але немає про що хвилюватися..."
  SHI_super_solider_idea_2:0 "Сироватка Суперсолдата"
  SHI_super_solider_idea_2_desc:0 "Створена на основі ВРЕ, ця розбавлена версія забезпечує незначне покращення фізичних показників, залишаючись при цьому безпечною для використання. Що ж, можливо, є ДЕЯКІ побічні ефекти, але немає про що хвилюватися..."
  SHI_super_solider_idea_3:0 "Нові солдати-мутанти"
  SHI_super_solider_idea_3_desc:0 "Тепер ми створюємо справжніх Суперсолдатів! Чи зможемо ми контролювати їх вічно — актуальне питання, але, дідько, у бою вони смертоносні!"

  SHI_vine_expedition_idea:0 "Полювання на мандрагору"
  SHI_vine_expedition_idea_desc:0 "Ми відправили експедицію, щоб спробувати захопити мутовану істоту, відому як «Мандрагора», що мешкає в мутованому Багряному лісі. Зробити це без прямого контролю над землею та уникнувши гніву її власника цілком можливо, але вимагатиме значних витрат і зусиль."

