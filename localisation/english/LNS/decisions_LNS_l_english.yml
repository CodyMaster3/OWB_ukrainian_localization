l_english:
lns_marching_west_cat:0 "Марш на Захід"
lns_marching_west_cat_desc:0 "Наша революція почалася з обіцянки: що колись Легіон прийде до нас, і коли це станеться — нам буде даровано багатства, титули й землі, про які ми не могли й мріяти. Поки що Легіон не з’явився. Проте ми не маємо втрачати надії, адже знаємо — Легіон не міг впасти. Ми рушимо до Червоного Сонця, далеко на заході, щоб приєднатися до них... або дізнатись, що з ними сталося."

lns_march_through_lubbock:0 "Марш через Лаббок"
lns_march_through_lubbock_desc:0 "Лаббок — перша держава на нашому західному шляху. Вони контролюють частину траси I-10, що веде на захід, і тому мають бути знищені, якщо ми хочемо успішно дістатися до Червоного Сонця."

lns_pacify_lubbock:0 "Успокоїти Лаббок"
lns_pacify_lubbock_desc:0 "Завдяки рішучим діям наших легіонерів шлях на Захід розчищено — залишки колишнього Лаббока більше не стоять нам на заваді. Тепер настав час умиротворити регіон, аби він не становив загрозу нашому тилу під час подальшого наступу."

lns_march_for_fort_summers:0 "Марш на форт Саммерс"
lns_march_for_fort_summers_desc:0 ""

lns_fortify_fort_summers:0 "Оборона форту Саммерс"
lns_fortify_fort_summers_desc:0 "Форт Саммерс контролює ключові шляхи постачання на Захід, тож ми маємо подбати про належну оборону від ворожих атак. Якщо зміцнити застави вздовж дороги, ми зможемо захистити як наші війська, так і місцеве населення."

lns_enter_red_sun_city:0 "Вірні Цезарю"

lns_march_into_bernalillo:0 "Захопити Каструм Марс"

