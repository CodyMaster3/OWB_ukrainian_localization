l_english:
# Ранні ідеї
LNS_idea_hand_gang_resurgence:0 "Відродження Банди Руки?"
LNS_idea_hand_gang_resurgence_desc:0 "Хоча Банда Руки давно була знищена, її члени розсіялись по наших землях та за їх межами. Ми вважали окремі залишки нешкідливими, але, схоже, нещодавно вони здобули певну координацію. Охоплені відвагою, вони почали нападати на наші застави й поселення. Ситуація стрімко виходить з-під контролю."

LNS_idea_fatigued_lawmen:0 "Виснажені стражі порядку"
LNS_idea_fatigued_lawmen_desc:0 "Колись миротворці наших вулиць, тепер Стражі порядку пройшли крізь чимало боїв заради спільного добра. На жаль, їх викликають усе частіше, і вони починають виснажуватись."

LNS_idea_controllers_of_the_I20:0 "Контроль над I-20"
LNS_idea_controllers_of_the_I20_desc:0 "Тепер, коли Армія Мутантів Шейла зайняла I-10, єдиним безпечним маршрутом для торговців у Техас лишається I-20. Він став жвавим торговельним шляхом, а наш безцінний Лоун Стар — його пульсуючим серцем. Уся торгівля має йти через I-20, а отже — і через нас: приносячи екзотичні товари та рідкісні артефакти."

LNS_idea_tbh_advisors:0 "Військові радники Братства"
LNS_idea_tbh_advisors_desc:0 "У межах Техаського Економічного Союзу Братство надає нам військових фахівців для покращення нашої армії. Їхня допомога була безцінною впродовж останнього десятиліття, дозволивши створити I-20 Патруль та Корпус Швидкого Реагування. Далі буде ще більше. \n\n§GПоки ця умова §YТехаського Економічного Союзу§! активна, ми маємо доступ до спеціальних §Yрадників Братства§!.§!"

LNS_idea_tbh_advisors_strong:0 "Військові радники Братства"
LNS_idea_tbh_advisors_desc_strong:0 "У межах Техаського Економічного Союзу Братство надає нам військових фахівців для покращення нашої армії. Їхня допомога була безцінною впродовж останнього десятиліття, дозволивши створити I-20 Патруль та Корпус Швидкого Реагування. Далі буде ще більше. \n\n§GПоки ця умова §YТехаського Економічного Союзу§! активна, ми маємо доступ до спеціальних §Yрадників Братства§!.§!"

LNS_idea_tbh_advisors_strong_basic_drills:0 "Військові радники Братства"
LNS_idea_tbh_advisors_strong_basic_drills_desc:0 "Частина нашої угоди з Братством Сталі включає підтримку від невеликої групи їхніх найкращих тактичних і стратегічних умів. Їхній внесок у наш захист і підготовку армії був і, вірогідно, залишиться безцінним."

LNS_idea_tbh_advisors_strong_advanced_drills:0 "Військові радники Братства"
LNS_idea_tbh_advisors_strong_advanced_drills_desc:0 "Частина нашої угоди з Братством Сталі включає підтримку від невеликої групи їхніх найкращих тактичних і стратегічних умів. Їхній внесок у наш захист і підготовку армії був і, вірогідно, залишиться безцінним."

LNS_idea_lubbock_expedition:0 "Лаббокська експедиція"
LNS_idea_lubbock_expedition_desc:0 "Хоча первинна мета «§YЛаббокської експедиції§!» з Лоун Стару — патрулювання I-20, її присутність принесла нам користь і поза цим. Підрозділи Лоун Стару покращили наші військові знання та стали надійними посередниками між гулями та людьми в самому Лаббоці. \n\n§GПоки §YЛаббокська експедиція§! перебуває на наших землях, ми надаємо Лоун Стару військовий доступ і отримуємо гарантії, війська та експедиційного генерала у відповідь.§!"

LNS_idea_empowered_lawmen:0 "Посилені стражі порядку"
LNS_idea_empowered_lawmen_desc:0 "Після спалахів боїв на вулицях Лоун Стару ми надали Стражам порядку право застосовувати будь-які засоби для відновлення миру. Лише час покаже, чи це спрацює."

LNS_idea_warlord_rises:0 "Постає воєначальник?"
LNS_idea_warlord_rises_desc:0 "Останні атаки поблизу Літтауна були надто злагодженими та жорстокими, щоб їх організували залишки Банди Руки. Наша остання гіпотеза — десь на півдні з’явився воєначальник, що спеціалізується на грабежах торговців."

LNS_idea_foreign_player:0 "Іноземне втручання?"
LNS_idea_foreign_player_desc:0 "Друга атака поблизу Літтауна — ще жорстокіша й ефективніша, ніж попередня. Ми маємо справу з кимось, хто має відмінну військову підготовку. Це не якийсь там місцевий бандит."

LNS_idea_caesars_hand:0 "Легіонери смикають за нитки!"
LNS_idea_caesars_hand_desc:0 "Після появи легіонерів у самому Лоун Старі, ми, здається, знайшли пояснення нашій проблемі. Банда Руки об'єдналася під командуванням якогось легата Легіону й намагається або повалити, або дестабілізувати наш уряд. Тепер нам залишається чекати на їхній наступний хід."

LNS_idea_west_in_flames:0 "Повстання на заході"
LNS_idea_west_in_flames_desc:0 "Хоча ми здолали більшість повстанських сил, Банда Руки відступила на безлюдні території на заході й півночі — колись їхній дім. Щоб витіснити їх, нам потрібна масштабна політична та військова кампанія."

LNS_idea_east_in_flames:0 "Схід у вогні"
LNS_idea_east_in_flames_desc:0 "Хоча ми давно вигнали Банду Руки зі східних земель, вони залишили по собі руйнування, які ще довго доведеться ліквідовувати. Поки що економіка страждає."

LNS_idea_i10_controller_deal:0 "Торгівля I-10 віддана"
LNS_idea_i10_controller_deal_desc:0 "Після інтенсивних перемовин із керівництвом [LNS.GetName] ми уклали угоду, що надає [LNS.GetNameDef] повний контроль над торгівлею на I-10. Натомість ми отримаємо економічні вигоди та нові технології. Якщо ми опинимося у війні з Лоун Старом або втратимо I-10 — угоду буде анульовано."

LNS_idea_i10_lns_deal:0 "Контроль над I-10"
LNS_idea_i10_lns_deal_desc:0 "Після успішних перемовин із лідерами Форт Стоктона ми уклали економічну угоду, що дає нам виняткове право вирішувати, хто може пройти через I-10, в обмін на певну економічну допомогу."

LNS_idea_controllers_of_the_I10:0 "Контроль над I-10"
LNS_idea_controllers_of_the_I10_desc:0 "Після вдалої угоди з лідерами Форт Стоктона ми отримали виняткове право вирішувати, хто має доступ до I-10. Наш контроль і розширення дороги принесли нам нечуване багатство."

LNS_stars_in_our_eyes:0 "Зірки в наших очах"
LNS_stars_in_our_eyes_desc:0 "\"У снах я бачу їх, хоч і мушу блукати\nТа думки мої з Техасом — і з домом\""

LNS_modern_military:0 "Ефективне командування"
LNS_modern_military_desc:0 "З новобранцями та добре навченими командирами, ми маємо всі інструменти, щоб стати грізною силою в Техасі."

LNS_tyrants_of_texas:0 "Тирани Техасу"
LNS_tyrants_of_texas_desc:0 "Завдяки допомозі Легіону ми перемогли Братство. Тепер решта Техасу лежить у нас під ногами. Залишилось лише взяти його."

## Закони щодо людських ресурсів
lns_mercenary_approach:0 "Цілковите найманство"
lns_mercenary_approach_desc:0 "Якщо ми повністю покладемося на найманців, наші громадяни не будуть гинути в далеких війнах. Вони залишаться вдома й посилять наше виробництво й будівництво. Втім, найманці ніколи не зрівняються з регулярною армією у бою."

lns_mercenary_primacy:0 "Перевага найманців"
lns_mercenary_primacy_desc:0 "Якщо більшість нашого війська — це найманці далеко від дому, ми збережемо людські ресурси для внутрішніх потреб. Місцеві регулярні війська Лоун Стару зможуть діяти як еліта або підтримка, здобуваючи досвід без великих втрат."

lns_mercenary_frontlines:0 "Найманці на передовій"
lns_mercenary_frontlines_desc:0 "Навіть якщо лише фронтові частини будуть складатися з найманців, ми зменшимо втрати й зможемо утримувати велику постійну армію."

lns_regular_frontlines:0 "Регулярна передова"
lns_regular_frontlines_desc:0 "Ми повинні обмежити роль найманців підтримкою та гарнізонами. Більшість бойових дій повинні вести регулярні війська. Це значно підвищить нашу ефективність, але й втрати зростуть..."

lns_regular_only:0 "Армія лише з регулярів"
lns_regular_only_desc:0 "Ми не можемо покладатися на найманців у складі наших збройних сил. Армія повинна складатися виключно з вірних, місцевих солдатів."

lns_tbh_deputies:0 "Призов у стилі Старого Світу"
lns_tbh_deputies_desc:0 "Ще до Великої Війни було введено призов, аби завжди мати людей для оборони держави. Ми повинні наслідувати цей підхід і оголосити загальний набір вірних громадян."

