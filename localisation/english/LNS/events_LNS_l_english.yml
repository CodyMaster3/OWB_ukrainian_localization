l_english:
nf_lns.1.t:0 "Сховища 578-ї"
nf_lns.1.d:0 "Під час Холодної війни на рівнинах біля Абіліну розміщувались 12 ракетних шахт, що належали 578-й ескадрильї стратегічних ракет. Хоча самі ракети були зняті з озброєння задовго до початку XXI століття, шахти залишались власністю ВПС аж до початку Великої війни. Коли ракети почали злітати, найстарший командир на місці, полковник Керрі Овенс, опинилась перед важким вибором. Вона мала 12 шахт, збудованих, щоб витримати ядерні удари й подальшу радіацію, але занадто багато речей, які потрібно було зберегти. Її солдати мали бункери, але місцева Національна гвардія – ні. Збереження бійців могло бути вирішальним після апокаліпсису. Або ж, вона могла віддати пріоритет запасам ресурсів – життєво важливим у майбутньому. Або пустити всіх громадян, які встигнуть, до сховищ? Її обов’язком було рятувати життя американців. Без вагань, Овенс ухвалила рішення."
nf_lns.1.a:0 "Пріоритет отримала Нацгвардія!"
nf_lns.1.b:0 "Нам були потрібні всі можливі запаси."
nf_lns.1.c:0 "Порятунок цивільних був найважливішим."

nf_lns.2.t:0 "Що пережило апокаліпсис"
nf_lns.2.d:0 "Хоча прямого удару вдалося уникнути, Абілін зазнав двох близьких вибухів – на півночі та південному сході. Більшість будівель було зруйновано ударними хвилями, але стійкіші конструкції на базі Дайесс і в центрі міста встояли. Ті, хто вижив і вибрався з ракетних шахт довкола міста, побачили мертве місто. Їм була потрібна мета – негайно, інакше відчай узяв би гору. Полковник Овенс знову взяла на себе командування й обрала один проєкт, якому слід надати найвищого пріоритету. Наступні роки були жахливо важкими, більшість тих, хто вижив, померли від голоду, хвороб або радіації, включно з самою Овенс. Але її проєкт був завершений і перетворив Абілін на зірку надії серед ядерних руїн Техасу. Так постав Лоун Стар. І цим проєктом було..."
nf_lns.2.a:0 "Забезпечення всіх громадян безпечними водою та їжею."
nf_lns.2.b:0 "Відновлення бази Дайесс як безпечного притулку."
nf_lns.2.c:0 "Очищення I-20, аби всі могли дістатися до Лоун Стара."

nf_lns.3.t:0 "Мутанти блокують I-10"
nf_lns.3.d:0 "До війни на південному заході до Техасу вели дві великі траси: I-10 та I-20. Навіть після Великої війни дороги залишились переважно неушкодженими, що забезпечило постійний потік торгівлі й мандрівників із заходу до Остіна (через I-10) та Далласа (через I-20). Завдяки цьому поселення вздовж трас почали відроджуватись. Аж поки не з’явилися мутанти. Під проводом харизматичного, але жорстокого Шейла, вони оселилися вздовж I-10. Ворожість Шейла до людей унеможливила торгівлю цим шляхом. Відтак I-20 стала єдиним безпечним маршрутом до Остіна й Далласа. Завдяки цьому Лоун Стар процвітав."
nf_lns.3.a:0 "Ми розвинули промисловість задля забезпечення торговців."
nf_lns.3.b:0 "Ми охороняли торгівлю вздовж Колорадо."
nf_lns.3.c:0 "Ринки в центрі нашого міста розрослись до небачених масштабів."

nf_lns.4.t:0 "Дружба по всьому Техасу"
nf_lns.4.d:0 "Лоун Стар, без сумніву, – економічна потуга, але у військовій сфері ми покладаємося здебільшого на парамілітарні загони та найманців. На південному сході – Техаський Братерство Сталі, навпаки сильний у тактиці, але економіка в них кульгає. Рішення було очевидним: об’єднати обидві країни в економічному союзі. За початковою угодою, на 10 років країни уклали союз у сфері торгівлі та промисловості: Лоун Стар надавав технічні знання, Братерство – військову експертизу. Угоду ратифікували обидві сторони на початку 2265 року, і сьогодні минає 10 років з того дня.\n\nХоч угода й мала термін дії, її успіх не залишив сумнівів у потребі продовження. Минулого тижня до нашої асамблеї подали пропозицію про постійне продовження."
nf_lns.4.a:0 "Продовжено – одностайно!"
nf_lns.4.b:0 "Продовжено – за умови надання більшої військової підтримки."
nf_lns.4.c:0 "Продовжено – але голосів «проти» було більше, ніж хотілося б..."

nf_lns.5.t:0 "Лоун Стар відкликає Лаббокську експедицію"
nf_lns.5.d:0 "Із внутрішніми труднощами вдома, ми отримали повідомлення від [LNS.GetLeader], що Лаббокська експедиція повертається до Лоун Стара. Їхня присутність дуже допомагала як нашому війську, так і цивільним, і новина про їхній від’їзд викликає сум. [LNS.GetLeader] та капітан Сондерс запевняють, що це тимчасово, і вони повернуться. Подивимось..."
nf_lns.5.a:0 "До зустрічі, друзі."

nf_lns.6.t:0 "Різанина біля Лі-тауна: не вже Рука?"
nf_lns.6.d:0 "Наш гарнізон у Лі-тауні було піднято рано-вранці – кров’ю залитий, змучений охоронець каравану впав біля воріт. На межі знепритомнення він встиг прошепотіти кілька слів командиру гарнізону, капітану Роуз Едмунд:\n\n«Засідка... дорога... різанина...»\n\nПауза.\n\n«Банда Руки...»\n\nЕдмунд похитала головою. Банда Руки? Це ж нісенітниця – більшість з них давно знищено Законниками та Братерством. Залишки банди навряд чи здатні на щось більше за грабунок, не кажучи вже про засідку. Але обов’язок є обов’язком: вона зібрала своїх людей і рушила до I-20. Те, що вони побачили біля річки, перевершило найгірші припущення."
nf_lns.6.a:0 "Єдиним рухом серед тіл був червоний прапор, що тріпотів на вітрі."
nf_lns.6.b:0 "Караван ще тримався... ледь-ледь."

nf_lns.7.t:0 "Криза на Колорадо"
nf_lns.7.d:0 "Вдруге за сезон гарнізон Лі-тауна було піднято через появу закривавленого посланця. Капітан Едмунд сподівалася, що цей день не настане, але вона не дурна – готувалась до нової атаки. Цього разу напад стався не на I-20, а на великий караван, що рухався Колорадо на південний схід, у напрямку Остіна. Воїни Едмунд кинулись на місце бою, але коли прибули – нападники вже зникли. Лишилися лише обвуглені залишки каравану та каное, й сотні тіл. Ця атака перевершила попередню в жорстокості та масштабі. Нападники були вправними, безжальними, і діяли по великій території. Це – не Банда Руки. Це щось значно гірше."
nf_lns.7.a:0 "Подвоїти патрулі на річці. Це не має повторитись!"
nf_lns.7.b:0 "Наступна атака буде на I-20. Приготуймось."
nf_lns.7.c:0 "Наступними можуть стати наші поселення. Зміцнити гарнізони!"

nf_lns.8.t:0 "Легіонери у Лоун Старі"
nf_lns.8.d:0 "Попри те, що керівництво Лоун Стара було в курсі тривожних нападів довкола Лі-тауна, сьогоднішня новина вразила всіх. Законники доповіли [LNS.GetLeader], що бачили двох легіонерів у бідному районі міста. Легіонерів не бачили в околицях Лоун Стара вже понад десятиліття, відтоді як Легіон проводив тут розвідку. І навіть тоді вони тримались подалі. Тепер усе стає на свої місця: координованість нападів, жорстокість, дисципліна... Якщо це дійсно Легіон, то загроза значно більша, ніж ми уявляли."
nf_lns.8.a:0 "Знайти цих легіонерів. Негайно!"
nf_lns.8.b:0 "Охороняти всю нашу промисловість."
nf_lns.8.c:0 "Законники марять. Це неможливо."

nf_lns.9.t:0 "Бої на вулицях Лоун Стара"
nf_lns.9.d:0 "Ми всі сподівалися, що цього не станеться. Але глибоко в душі знали – цей день прийде. Сутички між Законниками та повстанцями Руки почались на околицях Лоун Стара і швидко ширяться містом. Спочатку – короткі зіткнення. Тепер – справжня загроза війни. Законники не готові до такої загрози. Якщо не втрутимось негайно, бій дійде до центру міста за два-три дні. Треба діяти. Інакше – хай Бог нам допоможе."
nf_lns.9.a:0 "Перекинути всі війська. Повстання треба знищити."
nf_lns.9.b:0 "Це пошириться. Захистити всі поселення."
nf_lns.9.c:0 "Наділити Законників надзвичайними повноваженнями."

nf_lns.10.t:0 "Повстання шириться!"
nf_lns.10.d:0 "Ми сподівались, що сили Руки зосереджені на штурмі столиці, але виявилось інакше. На півночі й півдні нашої території отримано звіти про облогу гарнізонів повстанськими загонами. Особливо тривожна ситуація в Гаскеллі, де, за повідомленнями, легіонери беруть участь у нападі. У самому Лоун Старі на півночі помічено нові дивізії ворога, що готуються до наступу.\n\nУ відповідь Законники мобілізувались у повноцінні дивізії, найманці отримали бойову тривогу. Ми стоїмо перед війною. Нам лишається одне – битися з усіх сил."
nf_lns.10.a:0 "Негайно зв'язатися з Братерством. Нам потрібна допомога."
nf_lns.10.b:0 "Ave! Вірні Цезарю..."

nf_lns.11.t:0 "Перемога старого порядку"
nf_lns.11.d:0 "Останні осередки Військової банди Руки ліквідовуються просто зараз, і стає очевидно: ми пережили повстання банди та їхніх союзників з Легіону. На щастя, участь Легіону була обмеженою – це не було повномасштабним вторгненням, як ми боялися: здається, це були залишки розвідгрупи Легіону, надіслані до Техасу понад десятиліття тому. Вони лишилися, сподіваючись завоювати прихильність Цезаря. Якби їм вдалося – це був би удар по всіх нас. Але, на щастя, вони зазнали поразки. Остаточної.\n\nПопереду ще багато справ. Нам довелося піти на значні дипломатичні й економічні поступки, щоб перемогти. Нам треба оговтатись. До того ж, слід продовжити розбудову Техаської економічної спілки. Попереду – нові й захопливі часи!"
nf_lns.11.a:0 "Вперед, сильніші, ніж будь-коли."

nf_lns.12.t:0 "Новий ватажок на I-20"
nf_lns.12.d:0 "Останні прибічники Бенга та старого режиму ліквідовані, і ми остаточно здобули контроль над країною. Відтепер ми визнаємо лише одного володаря – Цезаря. Але попереду ще багато роботи: економіка знекровлена громадянською війною, а наша армія не відповідає рівню Легіону. Нам слід покінчити з рейнджерами на сході й укріпити Лоун Стар від можливих атак. На нас чекає праця – за Цезаря!"
nf_lns.12.a:0 "Цезар наказав – і так воно буде."

nf_lns.13.t:0 "Експедиція в Лаббок повертається"
nf_lns.13.d:0 "Після завершення громадянської війни та відносної стабілізації в Лоун Старі, ми запропонували знову розмістити в Лаббоку «Лаббокську експедицію» на чолі з полковником Аароном Сондерсом. Раніше ця група принесла нам значну користь у питаннях безпеки та стабільності. Але є підозри, що Лоун Стар хоче мати важелі впливу на нас через ці війська. Вибір не з легких."
nf_lns.13.a:0 "Ми раді їх вітати."
nf_lns.13.b:0 "Ні, іноземним військам тут не місце."

nf_lns.14.t:0 "Лаббок приймає експедицію"
nf_lns.14.d:0 "Лаббок погодився на відновлення «Лаббокської експедиції». Війська під командуванням полковника Сондерса вже займають позиції. Це зміцнить наші відносини!"
nf_lns.14.a:0 "Чудово!"

nf_lns.15.t:0 "Лаббок відмовляється від експедиції"
nf_lns.15.d:0 "Після тривалих обговорень Лаббок відмовився прийняти повернення «Лаббокської експедиції». Це означає кінець військової підтримки й вільного пересування наших військ у їхніх межах. Проте є і позитив: ветерани експедиції будуть інтегровані до нашої армії разом із полковником Сондерсом."
nf_lns.15.a:0 "Їх втрата."

nf_lns.16.t:0 "Ми сміємося мріяти"
nf_lns.16.d:0 "Два десятиліття тому Техас був розділеним хаосом – рейдери, работорговці, торговці та мутанти. Потім усе змінилось. Лоун Стар і [TBH.GetNameDef] підписали Техаську економічну спілку. Союз приніс зростання обом – Лоун Стар розквітнув завдяки торгівлі по I-20, [TBH.GetNameDef] розширили свою сферу охорони. Разом вони принесли стабільність і багатство центральному й південно-східному Техасу. Ідея, яка колись здавалася безумством, стала реальною можливістю: нова Техаська Республіка. Об’єднавши нашу економіку з військовою потугою [TBH.GetNameDef], ми можемо принести справжній мир у техаську пустку. Ми зобов’язані це зробити – заради нашого народу."
nf_lns.16.a:0 "Вперед, разом!"

nf_lns.17.t:0 "Інтеграція I-20"
nf_lns.17.d:0 "Можливо, ми знали, що цей день настане. Можливо, мали б бути готові. Але повідомлення, яке капітан Сондерс сьогодні передав уряду, застало нас зненацька. Уряд Лоун Стару, натхнений ідеєю відновлення Техаської Республіки, вимагає нашої анексії – до моменту створення тимчасового Конгресу нової Республіки. У разі відмови, [LNS.GetLeader] погрожує військовими діями: наступом зі сходу та захопленням столиці силами так званої «Лаббокської експедиції». Перед нами складний вибір."
nf_lns.17.a:0 "Разом ми будемо у безпеці."
nf_lns.17.b:0 "Ми не зрадимо свою автономію."

nf_lns.18.t:0 "Лаббок приймає анексію"
nf_lns.18.d:0 "Опинившись перед переважаючими силами, уряд Лаббока погодився на наші вимоги щодо анексії та інтеграції. Командування військами Лаббока передано капітану Сондерсу, який встановив тимчасове військове управління до прибуття наших основних сил. Віднині ми можемо бути впевнені, що торгівля через I-20 буде захищена. Час будувати новий Техас!"
nf_lns.18.a:0 "Дипломатія знову перемогла."

nf_lns.19.t:0 "Лаббок чинить опір"
nf_lns.19.d:0 "Попри всі дипломатичні зусилля капітана Сондерса і тиск експедиції, керівництво Лаббока відмовилось інтегруватися в нашу торгову імперію. На щастя, у нас є інші способи просування наших інтересів."
nf_lns.19.a:0 "Все могло бути значно простіше."

nf_lns.20.t:0 "Авантура на I-10"
nf_lns.20.d:0 "До нашої столиці прибули представники [LNS.GetName] на чолі з [LNS.GetLeader], щоб запропонувати угоду: економічна допомога та «більш ніж щедра компенсація» в обмін на виключне право регулювати торгівлю на I-10. Хоча угода економічно вигідна, впускати війська Лоун Стару в саме серце нашої країни – це великий ризик у разі конфлікту. Та й чи можна їм довіряти?"
nf_lns.20.a:0 "Прийняти їхню пропозицію."
nf_lns.20.b:0 "Це занадто небезпечно!"

nf_lns.21.t:0 "[FROM.GetName] приймає"
nf_lns.21.d:0 "[FROM.GetName] відповіли слабко – і ми повністю скористались цим шансом."
nf_lns.21.a:0 "Наш ризик виправдався."

nf_lns.22.t:0 "[FROM.GetName] відмовляє"
nf_lns.22.d:0 "[FROM.GetName] відхилили нашу пропозицію, і тепер ми змушені діяти жорстко, якщо хочемо досягти своїх цілей."
nf_lns.22.a:0 "Ми доб'ємось свого."

nf_lns.23.t:0 "Єдність чекає"
nf_lns.23.d:0 "Наші техаські брати запропонували об'єднання. Це була наша мрія з моменту заснування, після вогнів Великої Війни. То чого чекати? Навіщо чіплятись за залишки самостійності, що лише веде до занепаду? Настав час будувати нове майбутнє – разом, для Техасу."
nf_lns.23.a:0 "Разом ми складемо наші плани!"

nf_lns.24.t:0 "Техаська цитадель"
nf_lns.24.d:0 "Цезар – геніальний правитель. Здавалось, шансів не було, але його агенти здійснили неможливе. Лоун Стар став домівкою гордих легіонерів, вірних лише йому. Але найцікавіше попереду. У нас є роль у великому плані Легіону – і ми приймаємо свою долю."
nf_lns.24.a:0 "За волею Цезаря!"

nf_lns.25.t:0 "Ворожа експедиція"
nf_lns.25.d:0 "Наші вороги з Військової банди Руки направили каральну експедицію проти нас! Ми маємо швидко діяти, якщо хочемо вистояти."
nf_lns.25.a:0 "Вислати армію на перехоплення!"
nf_lns.25.b:0 "Ми будемо в безпеці лише під їхнім правлінням..."

nf_lns.26.t:0 "Друг на півночі"
nf_lns.26.d:0 "До нас прибули представники банди Руки. Вони пропонують військовий союз з метою захоплення земель Шейла і Едему. Вони завойовують Шейла, ми отримуємо Еден. До того ж, вони пропонують велику партію заліза. Як відповімо?"
nf_lns.26.a:0 "Прийняти їхню угоду."
nf_lns.26.b:0 "Їхнім словам не можна вірити."

nf_lns.27.t:0 "[IMO.GetName] приймає угоду"
nf_lns.27.d:0 "Швидкі переговори дали результат – [IMO.GetNameDef] погодились на наш план поділу земель на півдні. Вони пообіцяли свою підтримку у майбутній війні."
nf_lns.27.a:0 "Чудово!"

nf_lns.28.t:0 "[IMO.GetName] відмовляє"
nf_lns.28.d:0 "Незважаючи на наші спроби зробити угоду привабливою, [IMO.GetNameDef] відмовились від альянсу. Нам доведеться діяти самостійно."
nf_lns.28.a:0 "Шкода..."

nf_lns.29.t:0 "Життя спокійне там..."
nf_lns.29.d:0 "Наша відбудова базувалась на вірності цінностям Цезаря та Легіону. Через роки громадянської війни, реформ і крові, ми зміцнили свою владу в Техасі та стали опорою Легіону на сході. Та вторгнення Легіону так і не дійшло до наших меж. Тож ми самі вирушимо на захід, до Ред Сан Сіті. Там ми або зустрінемо патрулі Легіону, або дізнаємось, що з ним сталося..."
nf_lns.29.a:0 "Разом ми складемо наші плани!"
nf_lns.29.b:0 "Ми повинні запропонувати стати їхнім васалом."

nf_lns_hand_chose_normal_tt:0 "\nЦей вибір гарантує, що нашу землю буде передано §RЛегіону§!–якщо він існує та контролює §OCastra Sol Rubrum§!–як тільки ми вирушимо на захід."
nf_lns_hand_chose_subject_tt:0 "\nЦей вибір надасть §RЛегіону§!–якщо він існує та контролює §OCastra Sol Rubrum§!–можливість прийняти нас як §Yсуб’єкта§!, замість прямої анексії, коли ми рушимо на захід."
nf_lns.30.t:0 "«Легіон Лоун Стар»"
nf_lns.30.d:0 "Коли Цезар послав когорту Ланія на схід, його метою був Денвер. Але це був не перший похід Легіону за Ріо-Ґранде, і не перше просування легіонерів за Нью-Мексико в напрямку Міста Псів.\n\nЛегіон уже навідувався до Техасу, але більшість тих експедицій провалилися або були забуті. Та, здається, одна з них дала несподівані плоди. Колишня банда з Одинокої Зірки, переодягнена в легіонерські обладунки й на чолі з ветеранами з однієї з колишніх розвідувальних місій до Техасу, прибула сьогодні в Castra Sol Rubrum. Вони розповідають про свою славну ходу на північ і присягають на вірність Цезарю, сподіваючись приєднатися до наших лав."
nf_lns.30.a:0 "Було б дурістю відмовити їм у нагороді."
nf_lns.30.b:0 "Як наш васал, вони будуть серйознішою загрозою для Техасу."
nf_lns.30.c:0 "Вони не гідні битися за нас."
nf_lns.31.t:0 "Провал Легата"
nf_lns.31.d:0 "Коли ми прибули до Табору Червоного Сонця, там майже нічого не лишилося від застави Легіону. Судячи з усього, що сталося з Ланієм, експедиція ніколи не з’явилася, аби зустріти нас та виконати обіцянки. Серед нашої групи панують різні думки, і перед нами постає вибір. Чи вирушимо ми, за волею Цезаря, щоб завершити те, що не зміг Легат? Чи залишимось вірними своєму походженню і знову станемо Бандою Руки, яка володарює в Техасі?"
nf_lns.31.a:0 "Ми приймемо цей спадок."
nf_lns.31.b:0 "Час повертатися до грабіжницьких шляхів..."
nf_lns.32.t:0 "Краще птах у руці"
nf_lns.32.d:0 "Місто Лоун Стар захопила банда рейдерів. Хоча вони й не становлять для нас загрози, чому б не надіслати їм зброю для боротьби з Братством, якщо вони того бажають? Для нас це майже нічого не коштує."
nf_lns.32.a:0 "Разом ми складемо план!"
nf_lns.32.b:0 "Ми зайняті, вибачайте."
nf_lns.33.t:0 "Hecho En Mexico!"
nf_lns.33.d:0 "Санта Анна виявив щедрість і надіслав нам протитанкове спорядження для боротьби з Братством. А може й проти нього, якщо задере носа..."
nf_lns.33.a:0 "І що він зробить – нападе на розділений Техас?"
nf_lns.34.t:0 "Легіон нас відкинув"
nf_lns.34.d:0 "Попри всі випробування, Легіон відкинув нашу пропозицію служити! Схоже, що все, чого ми досягли в Техасі, не справило на них враження. З поваги до нашої відданості, нам дозволили безпечно повернутись на схід – щонайменше до їхнього прибуття. Наша банда має повернутися до своїх старих методів і знищити все, що стоїть між нами та честю."
nf_lns.34.a:0 "З часом ми доведемо, що вони помилялися."

