  LNS_pete_name:0 "Піт"
  LNS_pete_economic_advisor:0 "Піт"
  LNS_pete_economic_advisor_desc:0 "Ґуль-брат із трійці торговців з Лос, Піт вирішив покинути братів після того, як ледь не загинув від вибухівки, що помилково опинилася в його крамниці. Тепер він є представником Компанії Торгівлі Ґулів, заробляючи гроші чесно — хоча клієнти повідомляли про сумнівні практики, на кшталт продажу низькоякісного тютюну (насправді — марихуани) або зброї, яка виходить з ладу без купівлі гарантії.\n\nПіт також стверджує, що є особистим другом Чо Банґа — принаймні через «взаємну дружбу капіталізму» — і, попри всі свої вади, лишається улюбленцем мешканців Лоун Стара. Ну і тримає братів осторонь, якщо ті ще живі..."

  LNS_faustus_of_amarillo_name:0 "Фаустус з Амарилло"
  LNS_faustus_of_amarillo_high_command_desc:0 ""

  LNS_ralph_murdok_name:0 "Ральф Мердок"
  LNS_ralph_murdok_theorist_desc:0 "Представник Техаського Братства, Мердок спочатку був відряджений для нагляду за технологічним розвитком Лоун Стара. Та згодом він побачив більшу користь у тренуванні місцевих вартових і патрулів, які були недосвідчені навіть за мірками ініціатів Братства.\n\nЙого методи критикують, бо, мовляв, вони підходять лише «дикунам», а не цивілізованим людям, якими Техас нібито прагне стати.\n\nМердокові байдуже. Чи з луком, чи з лазером — Лоун Стар стане іменем, яке пам’ятатимуть."

  LNS_wound_breeder_name:0 "Той, Хто Сіє Рани"
  LNS_wound_breeder_theorist_desc:0 "Після перемоги Військового Братства «Рука», Вождь усвідомив, що традиційний рейдерський підхід вже не працює. Було оголошено набір інструкторів. Перші десятки кандидатів провалилися — або їхні тактики були фальшивими, або вони хотіли лише нагороди.\n\nПоки не з’явився Той, Хто Сіє Рани. Він узяв попередніх кандидатів, розділив їх на команди — одна під керівництвом Вождя, інша — під своїм.\n\nПереміг він.\n\nПринижений, але вражений, Вождь миттєво зробив його головним тактиком."

