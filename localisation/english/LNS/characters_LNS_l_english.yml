  LNS_dustdevil_dan_name:0 "Пиловий Диявол Ден"
  LNS_dustdevil_dan_air_chief_desc:0 "Колись ім’я «Пиловий Диявол» мало вагу в Техасі. Коли нафтові родовища виснажилися в 2050-х, жителям Техаської Співдружності було потрібне хоч якесь відволікання від краху великої галузі. Так родина Пилових Дияволів почала підкорювати небо, стаючи дедалі відомішою, поки не стала найвідомішою каскадерською авіагрупою на північ від кордону.\n\nДен був наймолодшим. Він мріяв літати поруч із батьками — допоки Велика Війна не відібрала їх. Вони вилетіли на шоу в Г’юстон, а Ден залишився один, з турбогвинтовим літаком від General Atomics, покинутим сімейним бізнесом та єдиним бажанням — знову злетіти в небо.\n\nЙого мрію було здійснено, коли патруль Лоун Стара натрапив на нього, намагаючись розібрати його літак на запчастини. Один техаський глухий кут — і Ден знову в повітрі, живучи своєю мрією."

  LNS_cyamus_asina_name:0 "Ціамус Асіна"
  LNS_cyamus_asina_army_chief_desc:0 "Високопоставлений учасник Легіонерської експедиції в Техасі, Асіна залишився в околицях Лоун Стара після повернення основних сил додому. Його військовий досвід величезний і здатен докорінно реформувати нашу армію."

