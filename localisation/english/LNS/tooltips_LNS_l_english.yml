l_english:
LNS_lubbock_exp_no_revoke_tt:0 "§RМи не можемо скасувати цю дипломатичну угоду, поки §YЛаббокська експедиція§! перебуває в їхніх межах.§!"
LNS_has_brotherhood_advisors_tt:0 "§YВійськові радники Братства§! присутні в нашій країні або через активну умову §GТехаського Економічного Союзу§!, або завдяки §Rнадзвичайним діям§!."
lns_hire_more_mercs_tt:0 "§GДві§! дивізії найманців, сформовані за шаблоном §YЗмішані найманці§!, прибудуть до §YLone Star§!.\n"
lns_recall_lubbock_expedition_tt:0 "§g§YЛаббокська експедиція§! повернеться до Лоун Стару під командуванням §YКап. Аарона Сондерса§!, досвідченого генерала, у складі трьох §Gветеранських§! піхотних дивізій.§!\n\n"
lns_reduce_uprising_leaders_tt:0 "Викриття легіонерів §gзменшить§! кількість §Rгенералів повстання§!, але кілька будинків постраждає!\n"
lns_reduce_sabotage_tt:0 "Розміщення військ на фабриках §gзменшить§! ефект саботажу під час §Rповстання§! та стабілізує ситуацію, хоч це і матиме свою ціну...\n"
lns_no_effect_tt:0 "Ми не вживемо жодних заходів: це запобіжить масовій істерії, але й не дозволить протистояти §Rповстанню§!. Але ж його не буде, правда?\n"
lns_reduce_lone_star_spawn_tt:0 "Додаткові війська в Лоун Старі §Gзменшать§! кількість ворожих дивізій, що з'являться навколо нього.\n"
lns_reduce_minor_spawn_tt:0 "Відправка військ до менших поселень §Gзменшить§! кількість ворожих дивізій, що з'являються поблизу них.\n"
lns_increase_lawmen_spawn_tt:0 "Посилення Стражів порядку §Gзбільшить§! кількість дивізій §YСтражів§!, що з’являться під час громадянської війни.\n"
lns_play_revolters_tt:0 "§RМи перемкнемось на гру за пов'язану з Легіоном Банду Руки!§!\n"
lns_return_to_lubbock_tt:0 "§gМи запропонуємо відновити §YЛаббокську експедицію§!. Якщо Лаббок погодиться — §YКап. Аарон Сондерс§! і його §Yветерани§! повернуться. Інакше ми збережемо їх собі та отримаємо змогу редагувати їхній шаблон.§!\n\n"
lns_lubbock_exp_tt:0 "§gТри дивізії, що формують Лаббокську експедицію, повернуться до нас під командуванням §YКапітана Сондерса§!.\n§!"
lns_start_army_reform_tt:0 "§gМи спробуємо відмовитися від повної залежності від найманців і створити оборонні сили з місцевих жителів.§!\n\n§GДва§! нові рівні §YПризовного закону§! будуть розблоковані, що дозволить нам розвивати національну армію.\n\n"
lns_reach_out_to_the_old_tt:0 "§YCyamus Asina§!, ветеран старої експедиції Легіону, стане §Gдоступним§! для призначення як §YГоловнокомандувач армії§!.\n"
lns_integrate_the_i20_tt:0 "§gЯкщо §YЛаббокська експедиція§! перебуває в §YLubbock§!, ми зможемо натиснути на уряд для його анексії. Інакше доведеться... діяти інакше.§!\n\n"
lub_switch_to_lns_tt:0 "Ми перемкнемось на §YLone Star§! і продовжимо гру під його керівництвом.\n"
lns_ownership_of_the_i10_tt:0 "§gМи запропонуємо економічне партнерство тому, хто володіє §YФорт Стоктоном§!, головним вузлом I-10, надаючи допомогу в обмін на повний контроль. Якщо вони відмовляться — ми розглянемо альтернативи...\n\n§!"
lns_ownership_of_the_i10_if_accept_tt:0 "\n§RЯкщо вони погодяться на угоду, відбудуться такі ефекти:§!\n\n"
lns_lanius_approaches_tt:0 "§gМи укріпимо прикордонні застави з Когортою Ланіуса та її маріонетками.§!\n\n§GДва§! рівні §Yзастав§! буде побудовано в усіх провінціях, що межують із §YКогортою Ланіуса§!, її §Yмаріонетками§! чи §Yсоюзниками§!.\n\n"
lns_protect_northern_flank_tt:0 "§GДва§! рівні §Yзастав§! буде побудовано в провінціях §YГаскелла§! та §Брекенріджа§!, що мають кордон із іншими державами.\n"
lns_one_army_for_texas_tt:0 "§gМи продовжимо військову реформу, наближаючись до армійської моделі довоєнної Америки.§!\n\n§GДва§! нові рівні §YПризовного закону§! буде розблоковано.\n\n"
lns_rally_the_rangers_tt:0 "§gЩоб відродити Техас, нам потрібна підтримка [TBH.GetNameDef]. Або — контроль над їхніми ключовими містами, якщо вони пали.§!\n\n"
lns_occupation_of_lubbock_tt:0 "§gМи надішлемо військову експедицію для захоплення §Y[LUB.GetNameWithFlag]§!. Якщо вони наші союзники чи васали — вони можуть підкоритися. Інакше — нас зустріне армія, і буде §Rоголошено війну§!.§!\n\n"
lns_slave_to_be_admired_tt:0 "§YChak Conway§!, ґуль-генерал 3 рівня з §YLubbock§!, стане доступним для призначення.\n"
lns_protect_the_east_tt:0 "§gМи укріпимо наш південно-східний кордон, створивши оборонну лінію на випадок агресії.§!\n\n§GДва§! рівні §Yзастав§! буде побудовано в усіх прикордонних провінціях §YБрекенріджа§! і §YКолемана§!.\n\n"
lns_crucify_opposition_tt:0 "§gСистематичне розп’яття супротивників на окупованих територіях допоможе придушити спротив і встановити контроль. Це криваво, але такова воля Цезаря!§!\n\nЗменшує §Yвартість ядра§! у §YТехаських§! штатах на §G30%§!."
lns_our_own_centurions_tt:0 "Ми §Gрозблокуємо§! технологію §YЦентуріонів§!, що дає усім піхотним та мот./мех. підрозділам §G+5§! організації.\n"
claim_edn_cores_tt:0 "Отримаємо §Gпретензії§! на всі §Yпочаткові осердні штати§! §Y[EDN.GetNameWithFlag]§!.\n"
lns_call_us_in_tt:0 "§RМи вступимо у війну, щоб завоювати нові претензії, коли Банда Руки оголосить її.§!\n"
claim_sha_cores_tt:0 "Отримаємо §Gпретензії§! на всі §Yпочаткові осердні штати§! §Y[SHA.GetNameWithFlag§!.\n"
imo_accepts_deal_consequence_tt:0 "Якщо §Y[IMO.GetNameWithFlag]§! погодиться на угоду, вони §Rоголосять війну§! цим державам також.\n"
lns_go_west_tt:0 "\n\n§gБуде розблоковано рішення для просування до Red Sun City — східного краю, відомого ще з часів старих мародерів. Там ми або зустрінемо Легіон, або його залишки. Майбутнє чекає нас...§!\n"
lns_continue_i20_work_tt:0 "Кожен штат вздовж §YI-20§! отримає §Gдва§! рівні §Yінфраструктури§!.\n"
lns_cutting_edge_development_tt:0 "Ми станемо §Gпросунутими§! у §Yпромислових технологіях§!."
lns_lone_star_prospers_tt:0 "§YТорговий вузол§! у §YLone Star§! підвищить рівень на §G2§!, що дасть значний економічний приріст."
lns_recruit_new_minds_tt:0 "§YDaisy Roth§!, реформаторка промисловості зі злиднів навколо Лоун Стару, запропонує свої послуги як §Yекономічний радник§!."
ces_lns_legion_tt:0 "Так званий §RLone Star Legion§! складе нам присягу, і всі його війська та генерали перейдуть під наш контроль. Ми також отримаємо §Gядра§! на всі їхні території. Це значно зміцнить нас.\n\n"
lns_legion_ces_tt:0 "Ми §Rприсягнемо§! §Y[THIS.GetName]§! — спадкоємцям §RMarsa§!. Наші війська та генерали перейдуть до них, вони отримають §gядра§! на наші землі, і §Yми перемкнемось§! на §R[THIS.GetName]§!.\n\n"
lns_legion_ces_alt_tt:0 "Ми §Rприсягнемо§! §Y[THIS.GetName]§! і станемо їхнім §Rвасалом§! під прапором Бика. Разом ми завоюємо Техас.\n\n"

LAC_revolted_global_flag:0 "Ланіус повстав проти Цезаря"

# Decisions
lns_owns_all_lub_states:0 "Усі ядрові штати §YLubbock§! §Yконтролюються§! нами або васалом."
lns_transfer_ownership_tt:0 "Ми станемо §Gвласниками§! усіх §Yядрових штатів§! §YLubbock§!.\n"
lns_owns_all_north_suf_states:0 "§Y60-Signs§!, §YShoetakers§! та §YFort Summers§! §Yконтролюються§! нами або нашим васалом."

# Characters
CYAMUS_ASINA_TT:0 "\n§Y$LNS_cyamus_asina_name$§! стає Командувачем.\n§LРівень§!: §Y4§!\n§RАтака§!: §Y4§!\n§GОборона§!: §Y3§!\n§PПланування§!: §Y4§!\n§MЛогістика§!: §Y2§!\n§gРиси§!: §tУважний§!, §tХаризматичний§!, §tІнтелектуальний§!\n\n"
CHAK_CONWAY_TT:0 "\n§Y$LNS_chak_conway_name$§! стає польовим командиром.\n§LРівень§!: §Y3§!\n§RАтака§!: §Y4§!\n§GОборона§!: §Y2§!\n§PПланування§!: §Y2§!\n§MЛогістика§!: §Y3§!\n§gРиси§!: §tВитривалий§!, §tЩасливчик§!\n\n"