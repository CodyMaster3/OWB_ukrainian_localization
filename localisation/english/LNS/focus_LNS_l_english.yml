l_english:
## Starting Focuses
lns_thank_god_for_the_air_force:0 "Дякувати Небу за авіабази"
lns_thank_god_for_the_air_force_desc:0 "Колись це були бази запуску зброї масового знищення, а тепер 12 ракетних об’єктів, розкиданих навколо Абіліну, стали прихистком від тієї ж зброї. Вижити вдалося не всім – довелося вибирати, кого впустити."

lns_rebuilding_our_star:0 "Відбудова Нашої Зірки"
lns_rebuilding_our_star_desc:0 "Після Великої Війни на тих, хто вижив, чекали важкі роки. Та попри все, мешканцям вдалося почати відбудову Абіліну – і він знову засяяв яскравою зіркою серед пусток."

lns_shales_army_musters:0 "Військо Шейла Збирається"
lns_shales_army_musters_desc:0 "Шосе I-10 та I-20 колись були артеріями торгівлі із заходу в Даллас і Остін. Але після того, як мутанти Шейла заблокували I-10, рух на I-20 тільки зріс."

lns_formation_of_the_tep:0 "Утворення Техаського Економічного Союзу"
lns_formation_of_the_tep_desc:0 "Майже десять років тому набрав чинності Техаський Економічний Союз – угода між нами та Техаським Братством Сталі. Настав час поновити її. Угода точно пройде – питання тільки в умовах."
## Pre-CW Focuses
lns_strength_in_unity:0 "Сила в Єдності"
lns_strength_in_unity_desc:0 "Наші економічні зв’язки з Братством дозволяють нам отримувати значні промислові вигоди. Будь-яке посилення угоди вигідне обом сторонам."

lns_expand_mil_ind_com:0 "Розширити Військові Комплекси"
lns_expand_mil_ind_com_desc:0 "Попри процвітаючу промисловість споживчих товарів, наша військова галузь значно відстає. Треба поєднати промисловий потенціал із військовими потребами."

lns_hire_more_mercs:0 "Найняти Додаткові Загони Найманців"
lns_hire_more_mercs_desc:0 "Більшість нашого війська складають найманці. Менш досвідчені – на гарнізонні обов’язки, а краще оснащені й вишколені – на передову."

lns_weapons_and_ways_of_war:0 "Дослідження Зброї та Тактики"
lns_weapons_and_ways_of_war_desc:0 "У військових дослідженнях ми відстаємо від сусідів. Радники з Братства можуть допомогти лише частково – ми маємо подвоїти зусилля!"

lns_recall_lubbock_expedition:0 "Окликати Експедицію до Лаббока"
lns_recall_lubbock_expedition_desc:0 "Ситуація всередині країни ускладнюється, тому нам потрібні всі досвідчені сили. Капітан Сондерс і його експедиція досі патрулюють I-20 – час покликати їх додому."

lns_authorise_emergency_econ_measures:0 "Схвалити Надзвичайні Економічні Заходи"
lns_authorise_emergency_econ_measures_desc:0 "Криза, що нас спіткала, потребує термінових рішень. Потрібно прийняти надзвичайне фінансове законодавство."

lns_reaffirm_right_to_bear_arms:0 "Озброїти Населення"
lns_reaffirm_right_to_bear_arms_desc:0 "Кожен громадянин повинен бути здатен себе захистити. Ми маємо забезпечити їх зброєю, аби спинити загрозу."

lns_victory_of_the_greater_good:0 "Перемога Заради Вищого Блага"
lns_victory_of_the_greater_good_desc:0 "Після важких боїв по всій країні ми нарешті розгромили возз'єднану Банду Руки та легіонерів, які їх підтримували. Час перевести подих і поглянути в майбутнє."

lns_victory_for_the_greater_good:0 "Перемога для Вищого Блага"
lns_victory_for_the_greater_good_desc:0 "Обривані праведники, що пригнічували нас, нарешті розбиті. Без їх впливу ми можемо готувати край до повернення нашого великого провідника!"

LNS_beatdown:0 "Банда Руки зробила свій хід\n"
## Good Guy Focuses
lns_demobilise_lawmen:0 "Демобілізувати Правоохоронців"
lns_demobilise_lawmen_desc:0 "Громадянська війна завершена, і тепер у нас більше немає потреби в мілітаризованому корпусі правоохоронців. Їм час повернутися до своїх колишніх обов’язків – тепер уже з бойовим досвідом."

lns_return_to_lubbock:0 "Повернутись до Лаббока"
lns_return_to_lubbock_desc:0 "Щоб вижити під час громадянської війни, ми змушені були повернути експедицію з Лаббока. Тепер, коли пил осів, час відновити наш захист доріг."

lns_no_poking_beehives:0 "Не Лізь У Нові Вулики"
lns_no_poking_beehives_desc:0 "Якщо ми не хочемо знову бути жалені війною, краще не провокувати нові конфлікти."

lns_learn_from_rangers:0 "Навчання в Рейнджерських Гарнізонах"
lns_learn_from_rangers_desc:0 "Після втручання у громадянську війну, Техаські Рейнджери розмістили свої гарнізони по всій країні. Їхній досвід може покращити наше озброєння й тактику."

lns_request_ranger_withdrawl:0 "Попросити Рейнджерів Залишити Нашу Землю"
lns_request_ranger_withdrawl_desc:0 "Рейнджери відіграли ключову роль у перемозі над Бандою Руки. Але зараз ми можемо самостійно забезпечити порядок. Час попрощатися."

lns_start_army_reform:0 "Розпочати Військову Реформу"
lns_start_army_reform_desc:0 "Наша армія надто залежна від найманців. Пора змінити цю модель, щоб зменшити витрати та посилити надійність."

lns_end_western_resistance:0 "Придушити Західний Опір"
lns_end_western_resistance_desc:0 "Скоординована військово-політична кампанія допоможе нам знищити залишки Банди Руки на заході."

lns_revitalise_east:0 "Оживити Східні Території"
lns_revitalise_east_desc:0 "Після численних сутичок наші східні поселення були спустошені. Час почати процес відновлення."

## Reformed Texas Focuses
lns_dreams_of_a_reformed_texas:0 "Мрії про Оновлений Техас"
lns_dreams_of_a_reformed_texas_desc:0 "Мало хто раніше наважувався мріяти про новий Техас, але завдяки успіхам Техаського Економічного Союзу ця мрія стала реальністю. Попереду на нас чекають цікаві часи."

lns_dont_mess_with_texas:0 "Не Зв’язуйтесь із Нами"
lns_dont_mess_with_texas_desc:0 "Як і колишня Республіка Техас озброювалась проти мексиканців, так і ми маємо захистити себе від рейдерів пустки."

lns_integrate_the_i20:0 "Інтегрувати I-20"
lns_integrate_the_i20_desc:0 "Перш ніж проголосити нову Техаську Республіку, ми маємо гарантувати контроль над головною торговою артерією. Лише ми самі маємо охороняти I-20 – «Експедиція до Лаббока» вже не впорається."

## Better Future Focuses
lns_better_future:0 "Прагнути Кращого Майбутнього"
lns_better_future_desc:0 "Колишній курс Лоун Стару був жалюгідним – лише гроші, торгівля, влада. Замість цього ми маємо боротись за щось більше, ніж самі себе..."

lns_use_unwilling_labour:0 "Використати «Добровільну» Силу"
lns_use_unwilling_labour_desc:0 "Щоб годувати воєнну машину, ми маємо впровадити рабство в нашу економіку. Це працює в Легіоні – спрацює і в нас!"

lns_new_approach_new_time:0 "Новий Підхід – Нові Часи"
lns_new_approach_new_time_desc:0 "Ми цінуємо порядок і прогрес, які Легіон приніс пусткам, але рабство в обсягах, що практикує Цезар, неможливе в Лоун Старі. Потрібен інший шлях."

lns_warmongering_disposition:0 "Войовничий Характер"
lns_warmongering_disposition_desc:0 "Нашим сусідам не сподобаються наші нові ідеали. Рано чи пізно, вони прийдуть за нами. Тож ми підемо першими."

lns_home_first_foremost:0 "Насамперед – Дім"
lns_home_first_foremost_desc:0 "Перш ніж дивитись на чужі землі, ми маємо переконатись, що зможемо вижити й процвітати у своїй домівці."

lns_reach_out_to_the_old:0 "Звернутись до Старих Контактів"
lns_reach_out_to_the_old_desc:0 "Вождь Руки має безліч зв’язків серед залишків легіонерської експедиції до Техасу. Багато з цих ветеранів можуть нам стати в пригоді."

lns_purge_opposition:0 "Позбутися Опору"
lns_purge_opposition_desc:0 "Хоч ми й утвердили свою владу у відкритій війні, щоденне життя в поселеннях майже не змінилося. Це має змінитися."

lns_militarise_factories:0 "Мілітаризувати Промисловість"
lns_militarise_factories_desc:0 "Наші виробничі потужності зосереджені на цивільному виробництві. Це має змінитися."

lns_prepare_for_something_greater:0 "Підготуватись до Чогось Більшого"
lns_prepare_for_something_greater_desc:0 "Багато десятиліть тому легіонерські розвідники прибули до наших земель. Дехто залишився, з таємним наказом – підготувати форпост для Цезаря. Тепер ми – цей форпост."

lns_occupation_of_lubbock:0 "Окупація Лаббока"
lns_occupation_of_lubbock_desc:0 "На заході лежить Лаббок – колись залежний від нас у миротворчих операціях. Час знову туди вирушити... найкраще – з армією."

lns_slave_to_be_admired:0 "Раб, Яким Можна Пишатись"
lns_slave_to_be_admired_desc:0 "Гуль з Лаббока, Чак Конвей, командував силами в останньому бою. Попри приреченість, він відчайдушно тримався в центрі міста, і лише через день наші кращі воїни змогли його зломити. У полоні, як і всі інші... Його варто зберегти – як виняткового раба."

lns_come_take_it:0 "Прийди й Забери!"
lns_come_take_it_desc:0 "Під час техаської революції ця фраза стала символом спротиву. У битві при Ґонсалесі жменька техасців захистила гармату від мексиканців. Нам слід перейняти їхній дух!"

lns_protect_the_east:0 "Захистити Схід"
lns_protect_the_east_desc:0 "На заході – Цезар, але на сході – вороги. Якщо ми не зможемо захистити свій східний кордон, форпост впаде ще до приходу Цезаря."

lns_crucify_opposition:0 "Розіп’яти Опозицію"
lns_crucify_opposition_desc:0 "Жорстока, але дієва практика – розпинати тих, хто опирається нашому правлінню. Швидко змусить окуповані землі скоритися."

lns_our_own_centurions:0 "Вербувати Власних Центуріонів"
lns_our_own_centurions_desc:0 "Досі ми покладалися на залишки легіонерської експедиції. Але тепер наша армія надто велика. Ми повинні вербувати власних Центуріонів."

lns_reach_out_to_the_ironmongers:0 "Переговори з Залізоробами"
lns_reach_out_to_the_ironmongers_desc:0 "Між нами та Залізоробами може бути багато спільного – особливо у планах на південних сусідів."

lns_go_west:0 "На Захід!"
lns_go_west_desc:0 "Найсхідніше поселення Легіону – за словами їхніх розвідників – це Червоне Сонце. Ми маємо вирушити на захід, прокласти шлях і дізнатись, що сталося з Цезарем."

lns_fulfil_the_deal:0 "Виконати Домовленість"
lns_fulfil_the_deal_desc:0 "Тепер, коли перемовини із Залізоробами завершено, настав час звернути увагу на цілі на півдні."
## Economic Union Focuses
lns_rekindle_economic_union:0 "Відродити Економічний Союз"
lns_rekindle_economic_union_desc:0 "Колись наша сила, Техаський Економічний Союз почав занепадати, поки ми були зайняті війною з Бандою Руки. Пора це змінити!"

lns_two_nations_one_system:0 "Дві Нації – Єдина Система"
lns_two_nations_one_system_desc:0 "Глибоко інтегрувавши економіки нашої країни та [TBH.GetNameDef], ми отримаємо вагомі економічні переваги. Хай це триватиме довго!"

lns_develop_join_arms_production:0 "Розвинути Спільне Військове Виробництво"
lns_develop_join_arms_production_desc:0 "Поєднавши промислову міць [LNS.GetName] з військовою майстерністю [TBH.GetNameDef], ми зможемо суттєво збільшити обсяги озброєння!"

lns_announce_fiscal_reform:0 "Оголосити Фіскальну Реформу"
lns_announce_fiscal_reform_desc:0 "Хоч Техаський Економічний Союз міцний, він не бездоганний. Реформа фінансів укріпить наші позиції."

lns_expand_inter_nation_inf:0 "Розширити Прикордонну Інфраструктуру"
lns_expand_inter_nation_inf_desc:0 "Щоб Економічний Союз процвітав, потрібно розвинути інфраструктуру на кордонах, сприяючи транскордонній торгівлі."

lns_enlargen_tbh_mission:0 "Розширити Місію Братства у Лоун Старі"
lns_enlargen_tbh_mission_desc:0 "Інвестувавши трохи політичного капіталу, ми зможемо розширити місію [TBH.GetNameDef] у Лоун Старі. Це суттєво підвищить наші військові знання."

lns_enlargen_tbh_mission_basic_drills:0 "Базова Підготовка Рейнджерів"
lns_enlargen_tbh_mission_basic_drills_desc:0 "Найкраще зосередитись на кількості: прості навчання дозволять швидко збільшити корпус Правоохоронців."

lns_enlargen_tbh_mission_advanced_drills:0 "Поглиблена Підготовка Рейнджерів"
lns_enlargen_tbh_mission_advanced_drills_desc:0 "Добрий рейнджер – підготовлений рейнджер. Ми проведемо складні, хоч і дорогі, тренування для Правоохоронців."

lns_enlargen_tbh_mission_rangers_for_lonestar:0 "Рейнджери для Лоун Стару"
lns_enlargen_tbh_mission_rangers_for_lonestar_desc:0 "Ключовий елемент нашої угоди з [TBH.GetNameDef] – це їхній військовий досвід. Маємо використати його на повну."

lns_enlargen_lns_mission:0 "Розширити Місію до [TBH.GetNameDef]"
lns_enlargen_lns_mission_desc:0 "Інвестувавши політичний ресурс, ми зможемо відправити більшу делегацію до [TBH.GetNameDef], підтримавши розвиток їхньої індустрії."

lns_enlargen_lns_mission_metal:0 "Що Земля Нам Дала"
lns_enlargen_lns_mission_metal_desc:0 "Надра дають нам важливі метали – критичні для інфраструктури та промисловості. Ми не маємо тримати це лише для себе: спільна програма з союзниками принесе більше користі."

lns_enlargen_lns_mission_water:0 "Що Принесли Ріки"
lns_enlargen_lns_mission_water_desc:0 "Вода – джерело життя. Хоча нам її вистачає, інші не такі щасливі. Поділившись нею, ми лише укріпимо нашу співпрацю."

lns_enlargen_lns_mission_advanced:0 "Наше – Назавжди"
lns_enlargen_lns_mission_advanced_desc:0 "Більш складні ресурси, як-от електроніка, – рідкісні, але важливі для обох економік. Ми маємо поділитись і цим задля спільного блага."

lns_adopt_texan_dollar:0 "Випустити Техаський Долар"
lns_adopt_texan_dollar_desc:0 "Щоб стимулювати торгівлю в межах Економічного Союзу, ми маємо запровадити Техаський Долар. Сміливий, але необхідний крок."

lns_focus_on_new_research:0 "Сфокусуватись на Нових Дослідженнях"
lns_focus_on_new_research_desc:0 "Одна з цілей Союзу – розширення меж можливого. Найкращий шлях – це розвиток нових технологій."

lns_restore_texas_uni:0 "Відновити Техаський Університет"
lns_restore_texas_uni_desc:0 "Колись великий центр знань, зараз – руїна. З певними зусиллями ми можемо відродити академічні дослідження й отримати численні вигоди."

lns_share_tech_development:0 "Спільний Технологічний Прогрес"
lns_share_tech_development_desc:0 "Економічний Союз може досягти нових вершин, якщо технології поширюватимуться серед учасників рівномірно."

lns_form_central_bank:0 "Створити Центральний Банк Техасу"
lns_form_central_bank_desc:0 "Щоб забезпечити валюту золотим покриттям, слід заснувати Центральний Банк. Це значно посилить Економічний Союз."

lns_enhance_civilian_commerce:0 "Посилити Цивільну Торгівлю"
lns_enhance_civilian_commerce_desc:0 "Цивільний сектор як у нас, так і в союзників потребує покращень. Правильна політика допоможе розквітнути торгівлі."

lns_joint_resource_campaigns:0 "Спільні Кампанії зі Збору Ресурсів"
lns_joint_resource_campaigns_desc:0 "На всіх територіях Союзу ще багато занедбаних багатих полів. Координована кампанія принесе користь кожному."

lns_unified_doctrine_research:0 "Єдине Дослідження Доктрини"
lns_unified_doctrine_research_desc:0 "Обмін військовими знаннями між державами Союзу дозволить кожній з нас вчитися одна в одної."

lns_union_economic_boom:0 "Економічний Бум Союзу"
lns_union_economic_boom_desc:0 "Роки процвітання, єдності й співпраці дали свої плоди. Економіки учасників Техаського Економічного Союзу розцвітають. Ура!"

## Фокуси Реформації Техасу
lns_ownership_of_the_i10:0 "Встановити домінування над I-10"
lns_ownership_of_the_i10_desc:0 "Наразі лише I-20 є життєздатним і стабільним маршрутом до Техасу, проте якщо I-10 на півдні опиниться в ненадійних руках, наша економіка може серйозно постраждати. Ми повинні забезпечити, щоб торгівлю в Техасі контролювали лише ми."

lns_lanius_approaches:0 "Ланій наступає"
lns_lanius_approaches_desc:0 "На заході ми стикаємося з екзистенційною загрозою для нашої нації. Когорта Ланія стрімко розширюється і невдовзі може вторгнутися глибоко в Техас. Ми мусимо захиститися від цієї загрози."

lns_protect_northern_flank:0 "Захистити північний фланг"
lns_protect_northern_flank_desc:0 "Ріка на півночі може стати небезпечною другою лінією фронту, якою скористається Ланій. Ми повинні створити флот для її оборони."

lns_one_army_for_texas:0 "Єдина армія для Техасу"
lns_one_army_for_texas_desc:0 "Дотримуючись прикладу, який нам показав [TBH.GetNameDef], ми маємо широкі можливості для реформування нашої армії."

lns_rally_the_rangers:0 "Об'єднатися з [TBH.GetNameDef]"
lns_rally_the_rangers_desc:0 "Наближається час проголосити нову Республіку Техас. Але перед цим ми повинні заручитися підтримкою [TBH.GetNameDef] – або звільнити їхні землі, якщо ті були захоплені."

lns_twice_trade_twice_road:0 "Вдвічі більше доріг – вдвічі більше багатства"
lns_twice_trade_twice_road_desc:0 "Ми контролюємо торгівлю як на I-10, так і на I-20, отже володіємо гегемонією над усім західним входом до Техасу. Ми – по-справжньому багаті."

lns_emergency_proclamation:0 "Оголосити надзвичайний маніфест"
lns_emergency_proclamation_desc:0 "Ми ведемо запеклу війну з ворогом, і економічний союз навряд чи переживе її. У такі часи потрібно прорізати бюрократичну павутину й створити Тимчасову Республіку Техас, щоб забезпечити перемогу."
lns_emergency_proclamation_tt:0 "§gЗавершення цього фокусу дозволить нам терміново сформувати Тимчасову Республіку Техас – але застерігаємо! Ми втратимо можливість завершити потужні частини нашого нинішнього дерева фокусів, якщо передчасно оголосимо Республіку.§!\n\n"

lns_declare_republic_of_texas:0 "Проголосити Тимчасову Республіку Техас"
lns_declare_republic_of_texas_desc:0 "Після завершення економічних і військових реформ ми нарешті можемо проголосити Тимчасову Республіку Техас. Разом з [TBH.GetNameDef] ми принесемо мир техаським пусткам."

## Фокуси з усунення слабкостей
lns_economic_powerhouse_alone:0 "Економічна міць поодинці"
lns_economic_powerhouse_alone_desc:0 "Ми не можемо розраховувати на допомогу від інших у техаських пустках. Ми маємо бути самодостатньою економічною силою."

lns_combat_our_weaknesses:0 "Подолати наші слабкості"
lns_combat_our_weaknesses_desc:0 "Щоб вижити в жорстоких пустках Техасу, ми повинні побороти брак військового виробництва. А для цього треба зміцнити економіку."

lns_kickstart_mil_research:0 "Запустити військові дослідження"
lns_kickstart_mil_research_desc:0 "Ми значно відстаємо від сусідів у військових технологіях і покладаємось переважно на найманців. Це слід змінити, якщо хочемо вижити самотужки."

lns_protect_the_capital:0 "Захистити столицю"
lns_protect_the_capital_desc:0 "Ми – опорний пункт Легіону, і не можемо дозволити Лоун Стару впасти під ударами ворога. Ми маємо захистити її з землі та з неба!"

lns_develop_arms_in_lone_star:0 "Розвинути зброярську промисловість Лоун Стара"
lns_develop_arms_in_lone_star_desc:0 "З розумними інвестиціями ми зможемо суттєво підвищити виробництво озброєнь!"

lns_militarise_the_economy:0 "Мілітаризувати економіку"
lns_militarise_the_economy_desc:0 "Ми повинні спрямувати більше ресурсів у військо, щоб завжди мати добре оснащену армію. До зброї!"

lns_recruit_shady_scientists:0 "Найняти сумнівних науковців"
lns_recruit_shady_scientists_desc:0 "Використовуючи зв’язки з Легіоном, ми можемо переконати деяких не зовсім етичних науковців переїхати до Лоун Стара – і значно розширити наші наукові можливості."

lns_reduce_mer_reliance:0 "Зменшити залежність від найманців"
lns_reduce_mer_reliance_desc:0 "Щоб вижити в прийдешній боротьбі, нам потрібно покладатись на місцеві війська. Найманці б’ються лише за кришки, а вірні люди – до кінця."

lns_reach_out_to_scav_remnants:0 "Звернутися до залишків мародерів"
lns_reach_out_to_scav_remnants_desc:0 "Хоча більшість мародерських загонів Легіону повернулися до нього ще два десятиліття тому, деякі старші фігури залишилися, щоб допомогти нам створити Військову Банду. Час покликати їх усіх – разом з тими, хто залишився з ними."

lns_light_the_forges_of_war:0 "Запалити горниці війни"
lns_light_the_forges_of_war_desc:0 "Час настав. Ми повинні підготувати націю до тотальної війни!"

lns_further_our_military_thought:0 "Розвинути нашу військову думку"
lns_further_our_military_thought_desc:0 "Щоб завоювати пустки й виконати волю Цезаря, потрібні нові тактики. Ми маємо цілеспрямовано вдосконалити наше воєнне мислення."

lns_civilian_Front:0 "Наш новий мер"
lns_civilian_Front_desc:0 "Хоча Військова Банда керує Лоун Старом, цивільна ширма не завадить. Ми лише... захищаємо місто."

lns_protection_racket:0 "Смерть і Техас"
lns_protection_racket_desc:0 "А що як, замість вимагати плату спонтанно, ми узаконимо побори? Блискуча ідея!"

lns_fight_in_new_domain:0 "Битися в новому просторі"
lns_fight_in_new_domain_desc:0 "Повітряна війна – не нова річ, але після Великої Війни її майже не застосовували. Ми повинні це змінити. Контроль у небі – це перемога на землі."

lns_adopt_foreign_currency:0 "Прийняти іноземну валюту"
lns_adopt_foreign_currency_desc:0 "Прийняття денарія Легіону суттєво зміцнить наші торговельні відносини з Легіоном та когортою Ланія, а також укріпить нашу економіку."

lns_weapons_for_the_warlord:0 "Зброя для воєначальника"
lns_weapons_for_the_warlord_desc:0 "Ми повинні перевершити звичайні обмеження у виробництві зброї, аби зберегти перевагу на полі бою."

lns_military_inf_networks:0 "Мережа військової інфраструктури"
lns_military_inf_networks_desc:0 "Навіть якби ми мали найчисленнішу армію, без належної логістики вона була б даремною. Ми повинні розвивати інфраструктуру поблизу кордону з [TBH.GetName]."

lns_adopt_modern_military_structures:0 "Сучасна військова організація"
lns_adopt_modern_military_structures_desc:0 "Довоєнні США мали потужне військо завдяки призову. Якщо ми хочемо залишатися конкурентоспроможними – нам варто наслідувати цей приклад."

lns_carthage_refugees:0 "Картанські біженці"
lns_carthage_refugees_desc:0 "Смачні кухарі Картхаґена стали жертвами агресії Братства. Але ми радо приймемо їх... і смачну їжу з ними!"

lns_ass_ass_ass:0 "Вона була ролеркою, хлопче"
lns_ass_ass_ass_desc:0 "Хоча Братство перемогло Rollergirls, деякі з них усе ще готові битися з поганцями разом із нами."

lns_work_with_taa:0 "Наш новий постачальник"
lns_work_with_taa_desc:0 "ТАЗ згодна торгувати з будь-ким, у кого є кришки. Для нас це добра новина!"

lns_go_our_own_way:0 "Іти своїм шляхом"
lns_go_our_own_way_desc:0 "Співпраця з ТАЗ не має сенсу. Краще розвивати власні ресурси – а потім забрати їхні."

lns_executive_troll:0 "Виконавчі тролі"
lns_executive_troll_desc:0 "Виконавці – дивакуваті, але навіть кілька з них можуть стати в пригоді. Поглянь лише на ці чудові продукти, які вони привезли до Лоун Стара!"

lns_toast_to_evil:0 "Наш друг з півдня"
lns_toast_to_evil_desc:0 "Санта Анна розділяє нашу ненависть до Техаського Братства. Його загроза – то вже завтрашня проблема. Коли ми впораємося з Раском, зможемо дати відсіч і дрібному тирану."

lns_take_down_tbh:0 "У цьому штаті не вистачить місця..."
lns_take_down_tbh_desc:0 "Хоча Техас і справді величезний, зарозумілість Братства ще більша. Давайте знищимо їх і покажемо, хто тут справжній господар!"

lns_go_us:0 "Володарі Техасу"
lns_go_us_desc:0 "Після падіння Братства ми можемо створити імперію! Може, мама б пишалась."

# Розвиток вдома
lns_development_at_home:0 "Розвиток на Батьківщині"
lns_development_at_home_desc:0 "Справи в самому Лоун Старі йдуть чудово. Якщо ми використаємо наш політичний капітал правильно – допоможемо місту досягти ще більшого розквіту."

lns_further_industrial_knowledge:0 "Поглибити промислові знання"
lns_further_industrial_knowledge_desc:0 "Старий Світ має багато таємниць щодо оптимізації виробництва. Вивчаймо, що можемо – але не забуваймо й власні відкриття."

lns_recruit_new_minds:0 "Залучити нові розуми"
lns_recruit_new_minds_desc:0 "Свіжий погляд може багато змінити. Щоб уникнути застою, слід шукати альтернативні ідеї серед мешканців пусток."

lns_continue_i20_work:0 "Продовжити відновлення I-20"
lns_continue_i20_work_desc:0 "Одна з небагатьох вад торгівлі I-20 – поганий стан деяких ділянок. Їх важко назвати погано збудованими, але косметичний ремонт не завадить."

lns_restart_the_turbines:0 "Запустити турбіни"
lns_restart_the_turbines_desc:0 "Колись ці турбіни давали Техасу відновлювану енергію. Хоча Велика Війна їх зупинила, списувати їх зарано."

lns_scrap_the_turbines:0 "Розібрати турбіни"
lns_scrap_the_turbines_desc:0 "Велика Війна стала останнім цвяхом у труну й без того провального проєкту. Розберімо турбіни і використаймо їхні деталі як ресурси."

lns_expand_advanced_res:0 "Розширити видобуток цінних ресурсів"
lns_expand_advanced_res_desc:0 "Ми зіткнулися з вузькими місцями в системі видобутку. Аби розширити промисловість, потрібно вирішити ці проблеми."

lns_low_tech_extraction:0 "Ставка на примітивний видобуток"
lns_low_tech_extraction_desc:0 "Ресурси нам потрібні, та навіщо все ускладнювати? Проста й ефективна система – наш найкращий вибір."

lns_cutting_edge_development:0 "Новітні розробки"
lns_cutting_edge_development_desc:0 "Горда економіка зростає завдяки науковому поступу."

lns_lone_star_prospers:0 "Розквіт Лоун Стару"
lns_lone_star_prospers_desc:0 "Наші зусилля не були марними. Лоун Стар світиться дедалі яскравіше й скоро охопить своїм сяйвом всю пустку. Від узбережжя до узбережжя всі співатимуть славу торговцям Лоун Стара!"

lns_weak_revolt:0 "Слабке повстання Рук"
