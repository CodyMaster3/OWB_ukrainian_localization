l_english:
ENT_TOLLKEEPER_NAME:0 "Контолер"
ENT_TOLLKEEPER_DESC:0 "Навіть у такому суворому місці, як Канадські Скалисті гори, торгівля не припиняється, а Ентранс є буквальними воротами між цими горами й землями Вайткорта та далі. Обов’язок Контолера — гарантувати, що торгівля не зупиняється, що з кожної угоди береться частка, і що підтримуються добрі стосунки з силами на сході та півночі. Це невдячна, але необхідна праця."

