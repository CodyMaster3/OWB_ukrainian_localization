### Tourism
NEW_tourist_trade: "Туристичний Бізнес"
NEW_tourist_trade_desc: "І Вегас, і Ріно вважають себе найкращими туристичними напрямками Пустки. Хай Хаус і пишається своїми вогнями, але Ріно вже десятиліттями обслуговує Каліфорнію. Серія рекламних кампаній – і два міста гріха підкорять кишені кожного мандрівника.  \n\nНаразі: [GetTouristsVegasExists][GetTouristsRenoAndVegasBothExist][GetTouristsRenoExists]"

tourist_season: "Прибутки з Туристичного Сезону"
tourist_season_desc: "Подивимось, скільки ми вичавили з останніх клієнтів..."

hire_criers: "Найняти Загощиків"
hire_criers_desc: "Вони не зроблять нас відомими миттєво, але можуть заманити кількох туристів."

buy_new_signs: "Купити Вивіски"
buy_new_signs_desc: "Наймемо кількох художників і замовимо нові вивіски – яскраві, звабливі, туристи потягнуться."

launch_small_ad_campaign: "Запустити Маленьку Рекламну Кампанію"
launch_small_ad_campaign_desc: "Невелика кампанія – листівки, загощики, брендовані неонові вивіски. Почнемо з малого – а там нас почують по всій Пустці!"

launch_medium_ad_campaign: "Запустити Середню Рекламну Кампанію"
launch_medium_ad_campaign_desc: "Короткі радіооголошення, великі неонові вивіски й нові атракціони – така реклама приверне більше народу."

launch_large_ad_campaign: "Запустити Велику Рекламну Кампанію"
launch_large_ad_campaign_desc: "Хвилинні радіооголошення, екскурсії, нові атракціони, знижки для нових гостей – ось це вже серйозно!"

launch_enormous_ad_campaign: "Запустити Гігантську Рекламну Кампанію"
launch_enormous_ad_campaign_desc: "Та тут буде все! Радіо на 3–4 хвилини, море атракціонів, загощики, листівки, тури, вивіски – навіть по робочому телевізору покажемо рекламу міста!"

entice_opponent_tourists: "Переманити Туристів від Конкурентів"
entice_opponent_tourists_desc: "Нащо їхати в [GetTourismOpponentName], якщо є ми? Очевидно ж, що ми крутіші!"

opponent_anti_advertising: "Антиреклама для [GetTourismOpponentName]"
opponent_anti_advertising_desc: "А ви знали, що [GetTourismOpponentName] побудували свій бізнес на брудних грошах? Ми – ні! Ми кращі за них!"

launch_only_once: "§YМи можемо запустити таку масштабну рекламну кампанію лише один раз!§!"

tourism_monthly_pop_modifier: "Приріст Населення Завдяки Туризму"

money_for_tourists_tt: "За кожну тисячу туристів ми отримаємо §Y10k [GetCapType]§!, а якщо матимемо більше туристів, ніж конкурент – ще бонусні §Y5k [GetCapType]§! за кожну тисячу!"

more_profit_from_tourists: "§GОскільки в нас більше туристів, ніж у конкурента – ми отримуємо §Y+5k [GetCapType]§! за кожну тисячу!§!"
less_profit_from_tourists: "§RЧерез те, що в конкурента більше туристів, ми не отримуємо бонус §Y+5k [GetCapType]§! за кожну тисячу!§!"

lose_25_percent_tourists: "§Y[?tourists_count_2|0] тисяч§! туристів – тобто §Y25%§! усіх – нагулялися й поїхали далі!"

