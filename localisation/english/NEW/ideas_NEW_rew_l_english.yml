l_english:
  goldmining: "Золоторийна Компанія"
  goldmining_desc: "Колись тут заправляли золотошукачі. Від них лишилось небагато, але деякі шахти й досі працюють з тих часів."

  militaryharrizon: "Військова Спадщина"
  militaryharrizon_desc: "Колись на чолі всього стояв гарнізон. Від нього мало що лишилось, але трохи навичок і зброї зі Старого Світу таки перейшло."

  citybrothels: "Борделі"
  citybrothels_desc: "Бішопи тримають все чисто, як не дивно — що б ти не шукав. А якщо тобі до вподоби наш Фісто — розважайся на повну!"

  washoecasino: "Бібліотеки"
  washoecasino_desc: "Бібліотеки Райта зробили мешканців Ріно одними з найрозумніших у всій Пустці. А хто ж не любить розумну дівчину?"

  renogangs: "Місцеві Молодіжні Організації"
  renogangs_desc: "Хтось їх називає 'бандами', а ми — позашкільною програмою Сальваторе для підкорення юних сердець Нью-Ріно. Просто така в нас атмосфера."

  vangraffinfluence: "Вплив Ван Ґраффів"
  vangraffinfluence_desc: "Ми втягнули цю родину, щоби поширити свій вплив у Нью-Ріно, хоч вони й не звідси. Але в цьому місті все має свою ціну..."

  smooching_bad: "Залежність від Смуучу"
  smooching_bad_desc: "Підлі Мордіно завозять у Нью-Ріно новий наркотик із Дена. Називається 'смууч' — пекельно затягує, шкодить здоров’ю, і що найгірше — ми з цього не заробляємо! Але роз’єднане Ріно нічого не може вдіяти..."

  smooching_good: "Прибутки від Смуучу"

  newtribe: "Нове Плем’я"
  newtribe_desc: "До міста вдерлося плем’я з півночі. Ламають майно сімей і ріжуть кожного, хто стає на заваді."

  mordinoinfluence: "Вплив Мордіно"
  mordinoinfluence_desc: "Ми вирішили не знищувати Мордіно, а використати їх у власних цілях. Сподіваємось, це не стане для нас фатальним рішенням."

  salvatoreinfluence: "Вплив Сальваторе"
  salvatoreinfluence_desc: "Ми не стали гасити Сальваторе, а вирішили поставити їх на службу. Молимось, щоб це не обернулось катастрофою."

  wrightinfluence: "Вплив Райта"
  wrightinfluence_desc: "Були змушені не валити Райта, а загнати його під себе. Хай це не стане нашою могилою."

  bishopinfluence: "Вплив Бішопа"
  bishopinfluence_desc: "Замість того щоб прибрати Бішопа, ми вирішили використати його. Лиш би це не стало нашою фатальною помилкою."

  renoschools: "Школи Ріно"
  renoschools_desc: "Ми відкрили школи для всіх. Авжеж, ще довго нам до рівня довоєнної Каліфорнії, але це перший крок до світлого майбутнього."

  new_citizens: "Нові Мешканці"
  new_citizens_desc: "Ми почали діяти як Райти — заманюємо нових людей із Пустки, будуємо собі добру славу."

  blackvultures: "Чорні Стерв’ятники"
  blackvultures_desc: "Чорні Стерв’ятники добре повчилися в боях із роботами Тлалока. Тепер вони можуть навчити й нашу армію."

  nanjimiclan: "Клан Нанджімі"
  nanjimiclan_desc: "Якудза під проводом Кієви Нанджімі — майстри ближнього бою, їхній досвід стане нам дуже в пригоді."

  vaultvikings: "Вікінги з Сховища"
  vaultvikings_desc: "Ці скандинави — народ жорсткий, зате закон їм — святе. І вони можуть змусити інших його дотримуватись."

  psychos: "Психи"
  psychos_desc: "Так, вони повні шизоїди. Але, як не дивно, з павутинням справляються краще за всіх — і це може врятувати не одне життя."

  new_genetic_programm: "Генетична Програма"
  new_genetic_programm_desc: "Дослідження ДНК нащадків Жителя Сховища та Обраного дали результати — і майбутні мутанти стануть кращими."

  new_geck: "G.E.C.K. для Мутантів"
  new_geck_desc: "Ми використовуємо G.E.C.K.-технології, щоб очистити тіла супермутантів від радіації перед перетворенням."

  new_mutant_power_armour: "Силова Броня для Супермутантів"
  new_mutant_power_armour_desc: "Ми вдягнули наших бійців у простеньку, але таки силову броню. У бою стане в пригоді."

  new_daggerpoint: "Баки Форта Даггерпойнт"
  new_daggerpoint_desc: "Ми відновили баки з ФЕВ у Форті Даггерпойнт. Це пришвидшить перетворення людей на супермутантів."

  voluntary_supermutants: "Супермутанти-Волонтери"
  voluntary_supermutants_desc: "Хоч у перетворення є свої мінуси, переваг не менше — тому в нас є охочі добровольці."

  fev_research: "Дослідження FEV"
  fev_research_desc: "Наші дослідження FEV дали результат. Ми краще розуміємо вірус — і кількість нових мутантів росте."