l_english:
#mason_salvatore:0 "Mason Salvatore" #Uses leader loc
NEW_mason_salvatore:0 "Мейсон Сальваторе"
NEW_mason_salvatore_economic_advisor_desc:0 "Сальваторе — ті ще сукині сини: мутять, торгують, тягнуть за ниточки. Мейсон підсуне нам грошенят, але весь час шукатиме момент встромити ніж у спину."

#christopher_wright:0 "Christopher Wright" #Uses leader loc
NEW_christopher_wright:0 "Крістофер Райт"
NEW_christopher_wright_cultural_advisordesc:0 "Райт — святенник із пекельної глибинки, що заробляє на самогоні. Двуликий ублюдок, але доки його гнали ллються, а клієнти бухі — він гребе бабло і розпинається про культуру за нас."

#mr_bishop:0 "Mr Bishop" #Uses leader loc
NEW_mr_bishop:0 "Містер Бішоп"
NEW_mr_bishop_cultural_advisor_desc:0 "Містер Бішоп не дасть нам просто так захопити владу, але зіграє роль підступного візира... на разі. Він допоможе тримати в узді шантрапу Нью-Ріно, хоча паралельно й поширюватиме заколот."

#lil_jesus_mordino:0 "Lil' Jesus Mordino" #Uses leader loc
NEW_lil_jesus_mordino:0 "Малий Джізус Мордіно"
NEW_lil_jesus_mordino_economic_advisor_desc:0 "Покидьки цього смердючого міста ладні на все за Мордіно і його Джет, але дати йому бажане — це кинути купу цих покидьків на жертовник: у його каторжні цехи, під його охорону, в його борделі."

NEW_tiaret_van_graff:0 "Тіарет Ван Ґраф"
NEW_tiaret_van_graff_desc:0 "Одруження нашого пахана з матріархинею Ван Ґрафів забезпечило нам її підтримку — і її круті навички. З Ван Ґрафами ніхто не хоче мати справу, вони шарять у енергозброї краще за всіх. Але вже ходять чутки... мовляв, Бішоп тепер просто маріонетка Ван Ґрафів..."

NEW_ol_crookshanks:0 "Старий Крукшанкс"
NEW_ol_crookshanks_desc:0 "Крукшанкса ніхто раніше не поважав, аж поки ми не показали, що Нью-Ріно — дім для всіх покидьків, вигнанців і наволочі. Тепер його визнають — як бувалого адміністратора і цінного кадра. Хоча деякі зашорені виродки в місті досі плюються через його виразки."

NEW_pablo:0 "Пабло"
NEW_pablo_desc:0 "Пабло — бувалий найманець, що зі своєю зграєю пройшовся на північ у пошуках постійної роботи й місця для осідання. Він вміє битися, змушувати інших битися і тримати найманців зухвалими й зарядженими."

NEW_runs_with_hatred:0 "Біжить-Із-Ненавистю"
NEW_runs_with_hatred_desc:0 "Біжить-Із-Ненавистю та його Сини Помсти були вигнані з дому жорстоким Цезарем. Якщо дамо їм нову домівку в Нью-Ріно (і непогану платню), вони стануть вірними псами, що боронитимуть наше місто."

NEW_pit_master_frazz:0 "Майстер Ями Фразз"
NEW_pit_master_frazz_desc:0 "Фразз — дивак, але йому багато не треба: дай йому металу й грошей — і він збиратиме роботів, що гамселитимуть одне одного. Такий от у нього прикол. А чому б і не задовольнити хобі?"

NEW_warcrying_todd:0 "Тодд-Воїн"
NEW_warcrying_todd_desc:0 "Тод і його братва обожнюють перегони, бійки і все разом. Вони ще й технарі, що фанатіють від своїх машин. Якщо переконаємо їх попрацювати з нашою технікою — мотострілки стануть справжніми хижаками."

NEW_tech_officer_hilden:0 "Тех-офіцер Гільден"
NEW_tech_officer_hilden_desc:0 "Гільден походить із роду Анклавівських науковців та інженерів. Він тямить у високих технологіях. Його знання — це новий рівень для наших лазерів і силової броні."

NEW_karm_the_brilliant:0 "Карма-Блискучий"
NEW_karm_the_brilliant_desc:0 "Карм — мабуть, один із найстаріших супермутантів, на рівні з Траддом. Голова в нього варить, інстинкти загострені. Час зробив його терплячим стратегом: він думає довго, але як вистрілить — мало не здасться, та ще й вороги й гадки не матимуть, звідки прилетіло."

NEW_sergeant_granite:0 "Сержант Граніт"
NEW_sergeant_granite_desc:0 "Граніт вірний Анклаву, але не проти попрацювати на когось іншого, поки не повернеться в стрій. Справжній сержант-дресирувальник, який зробить із салаг солдатів — швидко й ефективно."

NEW_colonel_jalabert:0 "Полковник Жалабер"
NEW_colonel_jalabert_desc:0 "Чи то бабло змусило Жалабера кинути армію НКР і піти в найманці, невідомо. Але одне ясно — дисципліни в нього хоч греблю гати, а з моторизованими силами він вміє грати як профі."

NEW_tobias_halvorsen:0 "Тобіас Халворсен"
NEW_tobias_halvorsen_desc:0 "Тобіас фанатіє від стволів, бомб і всього, що має віддачу. Він і його команда знають, як вичавити максимум зі зброї — налаштувати, прокачати, дати їй справжню міць. І ворогам краще не відчувати на собі силу його «Пекельних Молотів»."

NEW_raul:0 "Рауль"
NEW_raul_desc:0 "Рауль був найкращим механіком Вертібьордів в Анклаві. Після поразки на Нафтовій Платформі та в Наварро зник разом із Дорнаном. Коли той повернувся, Рауль швидко зрозумів, що обладнанню для виробництва потрібен апгрейд — і зразу ж узявся до роботи, ставши головним інженером Анклаву."

NEW_judah_kreger:0 "Капітан Джуда Крегер"
NEW_judah_kreger_desc:0 "Джуда Крегер був капітаном Анклаву на базі в Наварро, і чортівски хорошим. Його лідерські навички гасили внутрішні конфлікти й тримали особовий склад у купі. Коли Анклав зазнав поразки на Нафтовій Платформі та в Наварро, його загін втік і спробував злитися з НКР. Але потім повернувся Дорнан — і все пішло інакше."

NEW_snookie:0 "Снукі"
NEW_snookie_desc:0 "Снукі була охоронницею на базі Наварро, стерегла розумного Когтя Смерті, якого Анклав тримав у полоні. Вона ще й солдатка з натурою бульдога — якщо закріпилася, то не зсунеш. Після поразки Анклаву змогла втекти разом із Дорнаном і повертається з ним, щоб довести справу до остаточної перемоги."

NEW_quincy:0 "Квінсі"
NEW_quincy_desc:0 "Квінсі очолював технічну бригаду в Наварро — вмілий і відповідальний. Він керував механіками та обслуговуванням бази. Після краху Анклаву на Нафтовій Платформі й у Наварро він зник разом з Арчем Дорнаном, і тепер повертається з ним."

NEW_sanders:0 "Полковник Сандерс"
NEW_sanders_desc:0 "Сандерс відповідав за розкопки на військовій базі Маріпоса. Саме завдяки йому Анклав отримав зразок FEV-II і втримав мутантів-шахтарів від штурму бази. Його спецпризначенці діють під його командуванням, як справжня бойова машина Анклаву."

NEW_jagged_jimmy_j:0 "Джиммі «Шрам» Джей"
NEW_jagged_jimmy_j_desc:0 "Один із десятків наркоторгівців у місті народження Джету, але Джиммі запевняє: «Я не як інші». І вже по його вражаючому шраму, що став його кличкою, видно — він не брешеться. Джиммі піде на все, щоб клієнт був щасливий і повертався знову — принаймні так він каже."

NEW_liam_eldridge_name:0 "Ліам Елдрідж"
NEW_liam_eldridge_desc:0 "Власник божевільно успішного New Reno Arms і головний постачальник стволів для Авторитетних. У колекції Елдріджа завжди знайдеться те саме «останнє» рішення для твоїх проблем."

NEW_tommy_the_balls_name:0 "Томмі з Яйцями"
NEW_tommy_the_balls_desc:0 "Ніхто не знає, звідки з'явився Томмі з Яйцями, звідки він родом і навіть на яку сім’ю працює. Але всі знають точно — якщо полізеш на Томмі, це буде останнє, що ти зробиш у цьому житті."

NEW_enrico_savinelli_name:0 "Енріко Савінеллі"
NEW_enrico_savinelli_desc:0 "Уже десятиліттями Савінеллі стоїть на чолі поважного каравану між Нью-Ріно і Реддінгом. Інші купці здалися ще до того, як Барони НКР навели порядок, але Савінеллі з його вірною охороною та прямими переговорами тримаються осторонь — і виживають."

NEW_dan_mcgrew_name:0 "«Небезпечний» Ден Маґру"
NEW_dan_mcgrew_desc:0 "Власник шахти Морнінґстар, Маґру не зміг втягнути Реддінг у союз із Нью-Ріно, щоб захиститися від анексії НКР. Але його тверезий погляд і віра в автономію принесли йому повагу і серед шахтарів, і серед кримінальних босів зі сходу. Морнінґстар все ще працює, а сам Маґру перебрався на Комерційний Ряд. Його ділова хватка й повага серед Авторитетних допомогли профінансувати проєкти з розчищення інфраструктури на півночі й відкриття нових крамниць на Вест-Сайді — усе це добре прокачало місцеву економіку."

NEW_mark_torrance_name:0 "«Сталевий» Марк Торранс"
NEW_mark_torrance_desc:0 "Колишній боксер, а нині — зірка. Торранс відбоксував своє в Jungle Gym і заслужив неабияку повагу, якою не соромиться скористатися — для себе та для тих, хто заносить йому в конверті."

NEW_cody_name:0 "Коді"
NEW_cody_desc:0 "Осиротілий у малому віці, Коді виживав на вулицях жорстокого Ріно. Лише завдяки пораді одного чужинця, який свого часу прибився до міста, хлопчина зміг зібратися й дати всім прикурити. Зі своєю проникливістю й хитрістю Коді піднявся на вершину кримінальної ієрархії ще до повноліття — і це вже чортівське досягнення."

NEW_phil_name:0 "Філ"
NEW_phil_desc:0 "Брокен-Гіллс висох, але старий ґуль-бармен із того міста не збирався ставити останній келих. Філ назбирав трохи грошенят і відкрив барчик на околиці Ріно, де й живе на нормальний заробіток, займаючись тим, у чому найкращий. Бо змішувати напої і плітки — це його талант. За правильну ціну, звісно."

NEW_hassan_name:0 "Хассан"
NEW_kieva_nanjimi_name:0 "Кієва Нанджімі"
NEW_mockingbird_name:0 "Пересмішник"
NEW_jean_baptise_name:0 "Жан-Батіст Каттінґ"
NEW_big_shot_bob_name:0 "Боб Велика Шишка"

NEW_RUTHERFORD_NAME:0 "«Старійшина» Резерфорд"