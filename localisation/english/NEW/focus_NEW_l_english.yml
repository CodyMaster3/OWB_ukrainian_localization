######FILTERS#####

new_american_pmc:0 "Американська ПМК"
new_american_pmc_desc:0 "Армії Нью-Ріно завжди були збіговиськом найманців, набраних з усього пустка, щоби виконувати волю родин. Ці хлопці й дівчата охоче працюватимуть за капсули Анклаву."

new_oldworld:0 "Старий Світ"
new_oldworld_desc:0 "Ціль Анклаву завжди полягала, так чи інакше, у відновленні Старої Америки – повернути роздроблену пустку до стану, який вони вважають достойним. Вони – хранителі минулого й прагнуть поводитися відповідно."

new_bio_med:0 "Біомедичні експерименти"
new_bio_med_desc:0 "Хоч Арч Дорнан – лідер Анклаву Невади, він уже старий і практично не здатен діяти в полі, як і більшість його старих соратників. Але нещодавній прорив у медицині може дати йому шанс знову помолодіти..."

new_old_newworld:0 "Новий Світ, Старі Ідеї"
new_old_newworld_desc:0 "Чоловіки й жінки Міста Сховища завжди були символом елітизму Старого Світу в пустці – вони ховали науку й технології задля себе й 'гідних'. Еге ж! З них би вийшли справжні американці, якби з ними нічого не сталося..."

new_newworld:0 "Новий Світ"
new_newworld_desc:0 "Як би ми не сподівались, Америка, яку ми знали, вже здохла. Якщо хочемо знову зліпити нашу країну як слід, доведеться пристосовуватись і приборкати цей новий світ."

new_vertibird:0 "Будівництво Вертібьордів"
new_vertibird_desc:0 "Вертібьорди були опорою армії Анклаву майже сто років, але наші склади майже спалені дощенту. Треба починати з нуля й ліпити новий флот з того, що зможемо десь дістати."

new_newcapitol:0 "Столиця Невади – тепер Нью-Ріно"
new_newcapitol_desc:0 "Колись столицею Невади був Карсон, але тепер там тільки попіл. Його розбомбили й пограбували рейдери. Згідно з волею Арча Дорнана, Нью-Ріно стане новою столицею штату."

new_reclaimnevada:0 "Повернути Неваду"
new_reclaimnevada_desc:0 "Штат Невада був гордим членом Сполучених Штатів! І знову ним стане!"

new_thradd_army:0 "Армія Традда"
new_thradd_army_desc:0 "Воєначальник Традд захопив Нью-Ріно! Тепер він хоче закріпити владу в Неваді й Юті, об'єднуючи розкидані банди супермутантів, щоби створити нову армію – таку, що надере дупи всім, хто знищив його Творця!"

new_ode_to_rats:0 "Ода щурам"
new_ode_to_rats_desc:0 "Мозок давно мав плани захопити Сховище, і Традд підкинув йому трохи FEV для цього діла. Якщо в нього вийшло – він може стати вартісним союзником!"

new_scheming_rats:0 "Змови з поганню"
new_scheming_rats_desc:0 "Мозок розумніший за будь-кого з нас! І це добре – його техніка та ресурси допоможуть нашому союзу наваляти цим слабачкам із півдня!"

new_conquer_vault:0 "Захоплення Сховища"
new_conquer_vault_desc:0 "Місто Сховище завжди було марнотратством на людство. Їхні технології – справжнє диво пустки, але їхня жадібність споганила все кров’ю. Тепер? Ми змиємо все те лайно кров’ю по-справжньому..."

new_rebuild_cult:0 "Відбудувати Єдність?"
new_rebuild_cult_desc:0 "Культ Єдності – от де місце вірним людям! На колінах перед славою Творця! Проповідувати святу істину. Єдність підвела нас раніше, але ходять чутки, що її можуть воскресити."

new_stir_the_giants:0 "Розбудити велетнів"
new_stir_the_giants_desc:0 "Супермутанти з Тролячого Лігва під проводом Першого – одна з найсильніших сил у всій Північному Заході Америки. Вони б стали охрініти якими союзниками!"

new_enslaving_warren:0 "Порабощення Лігва"
new_enslaving_warren_desc:0 "Перший не схилить голову сам по собі, але він і його люди падуть на коліна, коли ми накинемо на них ланцюги."

new_honorable_allies:0 "Почесні союзники"
new_honorable_allies_desc:0 "Перший прийняв нашу справу в серце й працює з нами, щоби добити людство! З такими почесними союзниками нас не зупинити!"

new_for_master:0 "За Творця!"
new_for_master_desc:0 "Вони забрали в нас Творця! Вкрали наше майбутнє, наші мрії, нашу надію! Але їм не стерти його з нашої пам’яті. І їм не завадити нам здійснити його мрію! Пустка належатиме мутантам!"


### Van Graff
new_queen_of_reno: "Королева Ріно"
new_queen_of_reno_desc: "Мама Ван Ґрафф – баба з купою бабла й вигляду. І от вона нарешті піднялася – розрулила всі ті дрібні срачі, що ділили Ріно. Познайомся з її хлопцями!"

new_combat_armor: "Бойова броня"
new_combat_armor_desc: "Так, пора вдягатись. Спершу – броня. Стандартний варіант – звичайна бойова броня, фарбована в темне для фірмового вигляду й щоб люди сцяли під себе."

new_plasma_guns: "Зброя для персоналу"
new_plasma_guns_desc: "Усі охоронці Ван Ґраффів мусять носити гвинтівки. Легше – і ти вже небоєздатний. Важче – клієнти сцикотно навіть у двері зазирнути. Тож що береш – лазер чи плазму?"

new_redding: "Навести порядок у Реддінґу"
new_redding_desc: "Наша родина з Реддінґа, це на захід. Але ті брамінові барони, що тримають навколишні землі, ніколи нас не поважали. Час їм показати, хто тут хто. І чому б ні? Плазма так само легко спалює баронів, як і їхню худобу."

new_gold_for_guns: "Золото за зброю"
new_gold_for_guns_desc: "Ми роками качали бабло й вплив, міняючи золото та техніку. Настав час вжарити найбільше корпоративне поглинання за всю історію пустки."

new_eat_chinese_food: "Вчителі відчиняють двері, але заходиш ти сам"
new_eat_chinese_food_desc: "Акіґахай мріє про те саме, що й ми – скинути Нову Каліфорнію й вибити собі місце під сонцем. Ходім разом – перекроїмо Нову Каліфорнію, як нам треба."

new_vegas_buddy: "Бізнес-партнер із Вегаса"
new_vegas_buddy_desc: "Бенні, як і ми, вирвав владу в тих, хто її не заслуговував. Давай поширимо цей принцип на всю пустку."

new_crimson_caravan: "Монополія Червоного Каравану"
new_crimson_caravan_desc: "Ми вже працювали з Червоним Караваном. Вони можуть скупити активи конкурентів за копійки, а ми – монополізуємо торгівлю в Нью-Ріно."

new_redding_exploit: "Поглянь на мене в короні"
new_redding_exploit_desc: "Я керуватиму цим забитим містечком – дивись, як вони гнуться. А тиша твоя – мій улюблений звук."

new_jean_baptise: "Навчання Жана-Батіста"
new_jean_baptise_desc: "Наш Жан-Батіст далеко не піде, але багатьох уже прикінчив. Поставимо його керувати армією Ріно."

new_weapons_for_a_state: "Зброя за свої гроші"
new_weapons_for_a_state_desc: "Ми роками будували торгові ланцюжки, щоб діставати потужну енергозброю. Настав час пустити її на діло. Бо керувати державою – це ще той золотий жилок."

new_redding_riches: "Розігнати індустріалізацію"
new_redding_riches_desc: "Розвиток Реддінґа занадто довго душили барони. Це ж було колись багате шахтарське місто! І ним знову стане."

mew_conquer_ncr: "Ворожа інвестиція"
mew_conquer_ncr_desc: "Ван Ґраффи й НКР – вороги вже десятиліттями. Вони намагалися нас зупинити, але ми все одно росли. Проблема в тому, що вони теж. Тепер НКР – це гігант. Раніше ми могли з ними воювати на рівних. І тепер знову можемо. Вони мають до біса велику армію. А ми – до біса якісну. Пора показати, хто тут справжній бос."


#Reno Tree Loc

new_littlcity: "Найбільше маленьке місто в пустці"
new_littlcity_desc: "Ласкаво просимо в Ріно – найпривітніше місце, де тобі коли-небудь доводилося бувати! Від імені Туристичної Асоціації Нью-Ріно хочемо поділитися з тобою трохи історією – усього за три кришки за цю брошуру!"

new_firstfamily: "Наш найкращий другоненависник"
new_firstfamily_desc: "НКР контролює все Західне узбережжя, і в нас із ними багато вигідних справ. Дехто з наших навіть гордиться тим, що є асоційованими громадянами Республіки. Якщо ти не громадянин НКР – просто пропусти розділ, де йдеться про те, що рейнджери НКР не мають тут юрисдикції згідно з Угодою 2251 року."

new_king: "Нова родина на районі"
new_king_desc: "Як ти вже міг чути, раніше в Нью-Ріно було чотири родини! Зараз лишилось три, але на місце однієї зайшли нові – сімейка Ван Ґраффів. Головне – не порушуй з ними жодних контрактів, якщо хочеш жити."

new_king2: "Наступний крок"
new_king2_desc: "Щастить тобі! Ти в Ріно в найкращий час. Схоже, всі родини фінансують якісь проєкти – від молодіжних центрів до нових можливостей через НКР. Ніколи ще не було кращого часу, щоби заскочити в Нью-Ріно!"

new_thefamily: "Родина"
new_thefamily_desc: "Райти вже давно тримаються як родина в Ріно. Так, ми безжальні ділки, але все ще тримаємося за єдність і стабільність, які дає вірність нашому. Якщо хочемо взяти все місто – треба буде притримати міжусобні чвари."

new_school: "Запускаємо школи"
new_school_desc: "Хоч ми й не з тих, хто займається благодійністю просто так, без навару, але іноді варто вкластися в щось путнє. Якщо профінансувати школи для бідноти – отримаємо і стабільність, і нових мозковитих хлопців у місті."

new_church: "Поведи їх до церкви"
new_church_desc: "Може, ми й не святі, але трохи принципів мати не завадить, якщо хочемо, щоб нас поважали. Побудуємо церкви – піднімемо рейтинг серед простого люду й виглядатимемо побожними навіть у їхніх очах."

new_wrightsvangraff: "Весілля з дробовиком"
new_wrightsvangraff_desc: "Ван Ґраффи – хитра братія, для них бізнес важливіший за стрілянину. Якщо зробимо їх союзниками – позбудемося Бішопа. Можна було б їх і вирізати, але так вони приносять більше користі. Весілля між Райтом і Ван Ґраффом зміцнить наше становище й дасть стабільність у Ріно."

new_whitepawn: "Біла піша"
new_whitepawn_desc: "Вулиці Ріно належать Бішопу. Щоб утримати владу, треба виставити своїх фігур на район – тримати порядок і не дати конкурентам шансу. Люди точно підтримають місцевих, а не якусь банду беззаконних головорізів."

new_jetbeta: "Покращена формула Джету"
new_jetbeta_desc: "Так, Джет вивів нас у вищу лігу, але формула вже давно в руках тих, хто не цінує хімію по-справжньому. Нашого головного хіміка малий був зарізаний, тож треба з нуля варити нову партію. Спіймаємо будь-якого вченого з вулиці – головне, щоб діло пішло."

new_shark_club: "Клуб Акули"
new_shark_club_desc: "Клуб Акули – символ влади й лиску в пустці. Якщо вкластися в цей казино, то наші прибутки злетять угору. Без цього клубу ми були б просто зграєю гопоти без понтів."

new_bishop_van_graff: "Переговори з Ван Ґраффами"
new_bishop_van_graff_desc: "Ван Ґраффи – наші головні конкуренти в місті, але вони не дурні й зрозуміють, коли ми прийдемо на переговори з перевагою. Наймемо їх на нашу сторону, запропонуємо вигідний контракт – і заспокоїмо хижаків."

new_jacuzzi_janissaries: "Яничари з джакузі"
new_jacuzzi_janissaries_desc: "Наші найманці-яничари обожнюють валятися в джакузі. Як не дивно, вони примудрилися зробити з цього бізнес і гребуть по кілька тисяч доларів на день. Як їм це вдається? Та хрін його знає."

new_ncr_buddies: "Каліфорнійські інвестиції"
new_ncr_buddies_desc: "Дехто з інвесторів із Нової Каліфорнії хоче, щоби наша зброярка розцвіла. Потім вони це використають, якщо НКР піде на війну. А поки що – маємо халявну фабрику для своїх справ."

vangraffmobs_tt:0 "Створюється підрозділ найманців Ван Ґраффів."

new_salvatores:0 "Спадок Сальваторе"
new_salvatores_desc:0 "Час Сальваторе пройшов блискавкою, але друзі в Нью-Ріно в них лишились. Навіть попри огиду Міста Сховища до нас, у них вийшло завести хороші зв’язки з тим тихим місцем."

new_stash: "Схрон Сальваторе"
new_stash_desc: "Пам’ятай: хоча сімейка Сальваторе й зникла з арени, їхні схрони зі зброєю й іншими цікавими цяцьками досі можна знайти в місті. Якщо щось таке знайдеш – звернись до місцевої, «дружелюбної» поліції Нью-Ріно."

new_speakeasies:0 "Ренські підпільні бари"
new_speakeasies_desc:0 "Навіть найстриманіші мешканці нашого утопічного Нью-Ріно потребують місця, щоб розслабитись. Торгівля бухлом колись була фішкою Орвіла Райта – вона й принесла родині успіх. Тож логічно розбудувати по Ріно мережу підпільних барів для «безпечного й відповідального» відпочинку."

new_criminalworld:0 "Дрібна кримінальщина пустки"
new_criminalworld_desc:0 "Не все в Ріно відбувається за велінням верхівки. Це вільне місце, де кожен підприємець готовий на що завгодно за жменю доларів."

new_renodeal:0 "То в чому фішка Нью-Ріно?"
new_renodeal_desc:0 "Наша фішка? Та ти ж знаєш. Живеш на повну, кайфуєш, робиш що хочеш і коли хочеш – поки тобі це сходить з рук. Секс, наркота, рок-н-рол! Що ще треба в такій-то пустці? Та кинь, забудь, хто ти, забудь, де ти – і вливайся в тусу."

new_expansionism:0 "Відчиняємо двері"
new_expansionism_desc:0 "Так, Ріно – найбільше маленьке місто у світі. Але чому ми маємо обмежуватись маленьким містом? Ми ж серйозні гравці в цій пустці – пора, щоб це визнали. Чому б не розширити кордони трохи? А ті Гадюки, божевільні фанатики з нашого кордону, вже роками нам заважають. Пора показати, хто тут справжній пес-альфа!"

new_savages: "Органічне фермерство"
new_savages_desc: "Ферми в Модоку годують північну Неваду. Саме завдяки їм наші казино мають багаті шведські столи. Не звертай уваги на «деякі кроки», які ми робимо, щоб вирішити проблеми з постачанням."

new_bet: "Ризикнемо ставкою"
new_bet_desc: "Слаґс тепер під впливом Ріно – саме час забрати їх повністю. Будувати там поселення – ризик, але це ставка, на яку ми готові піти."

new_slavery: "Нові хутори"
new_slavery_desc: "Чимало батраків із НКР із радістю переїдуть працювати на північ. Кажуть: «небагато, зате чесна праця», чи як воно там? Ми взагалі-то ні з бідністю, ні з чесною працею знайомі не дуже... Але звучить мило."

new_spoils:0 "Військовий навар"
new_spoils_desc:0 "Після знищення Якудзи в нас з’явилось чимало воєнної здобичі. Вони роками тягнули з нас усе, що могли – тепер усе повертається назад, як і має бути."

new_shop:0 "Відкриваємо крамницю"
new_shop_desc:0 "Землі, які займала Якудза, виявились доволі цінними – з купою населення. Дехто критикує наші методи, але якби ми справді були лиходіями, то дозволили б Якудзі відкрити ресторан хібачі на Вірджин-стріт?"

new_topdog:0 "Хто тут головний?"
new_topdog_desc:0 "У Ріно всі десятиліттями гризуться за шмат пирога. Кожна велика родина хоче вирватись уперед і взяти все під контроль. Але зараз лише одна з них реально керує вулицями."

new_f3:0 "Ферзь на F3"
new_f3_desc:0 "Щоб закріпити нашу владу в Ріно, ми укладемо союз із Ван Ґраффами – вони жорстокі, мають найкращі технології, ідеальні союзники, щоб прибрати ворогів. Містер Бішоп має одружитись із Тіарет Ван Ґрафф – матріархинею родини – в обмін на їхню підтримку."

new_queen:0 "Ферзь на F7"
new_queen_desc:0 "Ван Ґраффи від нашого імені приберуть Райта, з якими давно мають рахунки. Хоча прагматичному містеру Бішопу нецікаві подробиці, Тіарет Ван Ґрафф обіцяє, що це буде криваво. Шах і мат."

new_mordinos:0 "Дані Мордіно"
new_mordinos_desc:0 "Наша родина, Мордіно, колись була наймогутнішою у Ріно, і наші васали досі мають вагу в міських справах. Ми прагнемо повернути Золотий Вік Ріно – часи, коли розпуста й залежність накривали Неваду з головою."

new_addictionempire:0 "Імперія залежності"
new_addictionempire_desc:0 "Інші гнилі родини покладаються на насилля, щоби тримати контроль. А ми – на Джет. Цей диявольськи залежний кайф триматиме пустку в нашій кишені. Страшно в пустці? Джет допоможе забути... хоч ненадовго."

new_myron:0 "Спадок Майрона"
new_myron_desc:0 "Майрон – той самий геній, що вперше створив Джет. Колись він з’ясував, що пейот дає довший, але не такий залежний ефект. Тож він винайшов Джет – супернаркотик із коротким циклом і дикою залежністю. І саме він зробив Мордіно багатими, як сам чорт."

new_allroads:0 "Всі дороги ведуть у Ріно"
new_allroads_desc:0 "Усі, хто шукає веселощів на ніч, зрештою опиняються в Ріно. Вклади в інфраструктуру – і отримаєш більше клієнтів, більше руху... а значить, і більше прибутку."

new_boxing:0 "Запросити лучадорів"
new_boxing_desc:0 "Наш 'Jungle Gym' – серце ренської боксерської сцени. Пора вивести шоу на міжнародний рівень – запросимо Вільних Бійців показати, як треба махати кулаками!"

new_desperado:0 "Реновація 'Десперадо'"
new_desperado_desc:0 "'Десперадо' – ще одне велике казино Нью-Ріно, належить Мордіно. Але головне – це центр усього ринку наркотиків у місті. Джет іде саме звідси."

new_distillery:0 "Зав’язуємо з бухлом"
new_distillery_desc:0 "Райти сколотили статки на алкоголі, а тепер варять якісь здорові, безалкогольні напої. Нібито освіжає й без калорій... якщо не рахувати цукор, звісно."

new_expansion:0 "Експансія Ван Ґраффів"
new_expansion_desc:0 "Ван Ґраффи з радістю продають зброю всім, кому треба захист. У певному сенсі – герої пустки, хех."

new_precautions:0 "Запобіжні заходи"
new_precautions_desc:0 "У Ріно треба вміти берегти активи. Мир із сусідами – це добре, але тут, у пустці, на це не варто покладатись. Нам потрібен мур – добряча стіна навколо Нью-Ріно."

new_precautions_tt:0 "Отримаємо §G2§! рівні §YФорпостів§! у §Yкожній переможній точці або прикордонній провінції§! регіонів §O[285.GetName]§! і §O[614.GetName]§!.\n\n"

new_radio:0 "Радіо Нью-Ріно"
new_radio_desc:0 "Будівництво радіовеж по Ріно дасть нам як розваги (музика!), так і можливість ведення підпільних справ – спілкування з мафією й іншими силами."

new_sweatshop:0 "Пітні цехи"
new_sweatshop_desc:0 "Мета виправдовує засоби. А пітні цехи – дуже ефективні. Це ж покидьки та нарики, що й так подихали б на вулицях. А так – хоч якась робота."

new_airport:0 "Аеропорт Старого Ріно"
new_airport_desc:0 "Можна відновити передвоєнний аеропорт Ріно, перетворивши його на повітряну базу. Якщо замутити мережу рейсів – небо стане нашим."

new_contracts:0 "Подовжені контракти"
new_contracts_desc:0 "На відміну від тиранії Нової Каліфорнії, ми не змушуємо наших громадян воювати. Замість цього вони координуються з родинами – заради спільного захисту. Герої, як не крути!"

new_sierradepot:0 "Грабіж Сьєрра Депо"
new_sierradepot_desc:0 "Військова база Сьєрра кишить арсеналом і скарбами, про які можна тільки мріяти. Якщо туди відправити постійну бригаду грабіжників – потік зброї до мафіозних родин Ріно забезпечено. А чого це Місто Сховища так біситься, га?"

new_sanctuary:0 "Місто-притулок"
new_sanctuary_desc:0 "Ріно – заможне місто, і бідаки з усього Пустку валять до нас. Відкрити ворота й зробити з Ріно притулок? Це спричинить хвилю населення... але й дасть нам інші можливості."

new_oldbirds:0 "Старі Птахи"
new_oldbirds_desc:0 "'Старі Птахи' – найманці, передвоєнні гулі, що були десантниками й пілотами. Тепер, коли в Ріно є аеропорт, можна найняти їх як наш перший повітряний флот."

new_golgotha:0 "Відновлення Голгофи"
new_golgotha_desc:0 "Голгофа – цвинтар за межами Ріно, де ховали мертвих і позбувалися ворогів родин. Якщо повернути її до оригінального призначення – вороги зникатимуть набагато тихіше."

new_techslot:0 "Розкопки Сьєрра Депо"
new_techslot_desc:0 "Перевести грабунок у повноцінні розкопки потребує робочої сили, але передвоєнні секрети бази надто цінні, щоби ігнорувати. Можна витягти купу знань."

new_mercmilitary:0 "Навчання від найманців"
new_mercmilitary_desc:0 "У Ріно немає постійної армії – лише мафія. Але найманці – наші солдати. Ми маємо бабло, а значить, їхні контракти тримаються довго."

new_merc:0 "Наймана армія"
new_merc_desc:0 "З найманцями нам більше не потрібні призовники. Ми можемо піднімати дивізії в рази швидше. Так, це дорожче – але якщо вкласти більше, отримаємо елітне військо."

new_blackvultures:0 "Чорні Стерв’ятники"
new_blackvultures_desc:0 "Чорні Стерв’ятники – це плем’я з Мексики, змішане з перськими іммігрантами, які стали елітними найманцями. Наші головні радники не мають сумнівів у їхній бойовій майстерності. Найняти їх – мудрий хід, якщо ми хочемо зробити енергозброю основою війська."

new_nanjimiclan:0 "Клан Нанджіма"
new_nanjimiclan_desc:0 "Клан Нанджіма – нащадки японських рабів, яких до війни поневолили китайці й тримали у велетенських підводних човнах. Тепер це воїнський клан, з яким краще не жартувати: вони використовують транспорт і техніку, щоб зграями тероризувати ворогів."

new_uniques:0 "Особливі найманці"
new_uniques_desc:0 "Кожна з родин Ріно має свої контакти у світі найманців. Деякі угруповання охочіше укладають контракти саме з ними. Ці унікальні бойові сили підлаштовуються під 'специфічні потреби' своїх замовників."

new_roaring:0 "Ревучі Ведмеді"
new_roaring_desc:0 "Ревучі Ведмеді – колишні солдати НКР, які зрозуміли, що в найманському ремеслі можна заробити більше, ніж у лавах армії. Вони дисципліновані, моторизовані й прекрасно замінюють постійну армію."

new_artillery:0 "Пекельні Молоти"
new_artillery_desc:0 "Пекельні Молоти – божевільна, але надзвичайно організована зграя фанатів зброї. Їхня майстерність у артилерії та важкому озброєнні – найкращий захист, який може мати будь-яке місто."

new_thradd:0 "Ізотопний Розділ"
new_thradd_desc:0 "Вони нечасто беруть довгі замовлення, але 'Старійшина' Разерфорд і її Ізотопний Розділ готові підтримати [Root.GetName]. Їх вигнали з Братства Сталі через те, що вона стала гулем, але вони досі вірні ідеї: оберігати небезпечні технології. Без підтримки Братства, цей розділ став найманською бригадою – хоч і з втраченим та зношеним спорядженням."

new_granite:0 "Оборонна рота сержанта Граніта"
new_granite_desc:0 "Це загін залишків Анклаву, який зумів знайти непогане діло – охороняти малі поселення від рейдерів, використовуючи високотехнологічне спорядження. Їхній старий командир, сержант Граніт, невпинно тренує своїх людей у чеканні повернення Анклаву."

new_tactics:0 "Переосмислення доктрин"
new_tactics_desc:0 "Міліція Нью-Ріно – не найкращі вояки в пустці, але ми можемо навчити їх парі трюків. Зберемо ветеранів, і нехай покажуть молодим, як воювати в пустці."

new_capsforloyalty:0 "Кришки за вірність"
new_capsforloyalty_desc:0 "Кажуть, найманці не мають честі, але в пустці бабки – найкращий мотиватор. А в нас їх до чорта."

remove_500_caps_ttt:0 "Є 500 доларів для витрати."

new_councilfunding:0 "Фінансування військової ради"
new_councilfunding_desc:0 "Безпрецедентний крок – формалізувати раду з мафіозі, яка займатиметься лише військовими справами. Мафія й найманці під контрактом – основа цієї сили."

new_enctech:0 "Радники Ван Ґрафф"
new_enctech_desc:0 "Кажи, що хочеш про Маму Ван Ґрафф, але у війні вона тямить. Може, дати їй місце в раді?"

new_mutanttech:0 "Тактик-супермутант"
new_mutanttech_desc:0 "А в нашу військову раду можна підсадити й супермутанта – колишнього генерала армії Творця. Його досвід у війнах пустки може перевернути хід подій."

new_genericmercs:0 "Звичайні найманці"
new_genericmercs_desc:0 "Компанії, яких ми наймаємо, мають таланти, що ставлять їх вище за рядових найманців. Їхні спеціалізації – ключ до адаптивної й невразливої армії."

new_vengefulsons:0 "Сини Помсти"
new_vengefulsons_desc:0 "Сини Помсти – люта орда трайбалів, яких вигнав зі своєї землі диктатор Цезар. Хоч вони й неорганізовані, їхня лють, кількість і жага помсти роблять їх справжнім активом у бою."

new_pablos:0 "Конкістадори Пабло"
new_pablos_desc:0 "Конкістадори Пабло – ветерани-піхотинці з південної Мексики. Високодисципліновані й неймовірно гнучкі, вони придатні майже для будь-якого завдання."

new_gladiators:0 "Гладіатори з Місто-Сміття"
new_gladiators_desc:0 "Гладіатори з Місто-Сміття – найманське військо, повністю складене з роботів, під командуванням, скажімо так... нестабільного капітана на ім’я Піт-Майстер Фразз. Вони ідеально підійдуть як важка підтримка."

new_roadpsychos:0 "Дорожні психи"
new_roadpsychos_desc:0 "Дорожні психи – це банда з колишніх Вісімдесятників, які послали грьобану філософію Тандерберда й тепер живуть заради навару. У Ріно вони впишуться на ура – особливо якщо ще й переможуть у Ту-Сані."

new_oldallies:0 "Старі союзники"
new_oldallies_desc:0 "Деякі залишки старого Анклаву досі живі, й за всю допомогу в захопленні Ріно ми маємо віддячити. Варто пустити їх до міста – з ними матимемо ще більше елітної охорони."

new_hedge:0 "Гра в обережність"
new_hedge_desc:0 "Укріпити колишні землі Якудзи – непоганий спосіб відбити охоту в рейдерів лізти туди знову. А враховуючи зростаючу загрозу з Півдня й Заходу – краще перестрахуватися."

new_hedge_tt:0 "Отримаємо §G2§! рівні §Yфорпостів§! у §Yкожній прикордонній провінції§! регіонів §O[156.GetName]§! і §O[171.GetName]§!.\n\n"

new_hordes: "Орди Півночі"
new_hordes_desc: "Північ Невади – холодна пустка, повна дикунів і потужних далеких загроз. Тепер, коли Слаґс під нашим контролем, вони – наш перший щит проти Північних Орд."

new_hordes_tt:0 "Отримаємо §G2§! рівні §Yфорпостів§! у §Yкожній прикордонній провінції§! регіонів §O[126.GetName]§!, §O[382.GetName]§!, §O[585.GetName]§! і §O[118.GetName]§!.\n\n"

new_klamathdeal:0 "Плани на Ден"
new_klamathdeal_desc:0 "[TDN.GetLeader] – одне з небагатьох зануд, що псує життя Ріно. Але наші солдати-громадяни готові захищати націю й її інтереси. Навіть якщо ці інтереси – щоб усі ширялись тільки нашим свіжим і кайфовим Джетом."

new_klamathagreements:0 "Торгівля ґеконами"
new_klamathagreements_desc:0 "Кламат ще досі непогано заробляє на полюванні на ґеконів, і нема причин не мати з цього вигоду. Смачно, особливо в 'Десперадо Тако Барі'!"

new_occupationden: "Просвітителі"
new_occupationden_desc: "У Кламаті себе називають цивілізованими, але жити в згарищі старого світу – ще не цивілізація. Ми можемо відкрити їм школу – ну, якщо дозволять нам поставити свого мера наглядати."

new_endnorthslavers: "Добити работорговців"
new_endnorthslavers_desc: "Цих бідолах треба визволити – щоб захистити пустку. І, звісно, підсилити армію."

new_debtwarriors:0 "Воїни в борг"
new_debtwarriors_desc:0 "Воїни Кламата винні нам за все, що Ріно для них зробив. Тепер вони служать нам. Хтось скаже, що контракти надто жорсткі, але ж їх погодив наш відділ кадрів, га?"

new_addictsworks:0 "Нариків – до праці"
new_addictsworks_desc:0 "Кажуть, родини контролюють людей через Джет. Наклеп. Ми просто надаємо знижки тим, хто підпише пару років праці на нас. По-людськи, чи не так?"

new_silverrush:0 "Срібний натиск"
new_silverrush_desc:0 "Срібний Натиск – заклад Ван Ґраффів, де вони торгують енергозброєю та передовими технологіями. Завдяки їм, хай-тек у Ріно стане набагато доступнішим."

new_coreden:0 "Наше місто-сестра"
new_coreden_desc:0 "Ден довго був під Мордіно – тими самими, що ми вигнали з Ріно десятки років тому. Вони тримали злобу, але тепер, коли їх більше нема, можна нарешті налагодити стосунки з місцевими й забезпечити їхню лояльність."

new_assimilation:0 "Зачистка Модоку"
new_assimilation_desc:0 "Модок – нове придбання, але вони все одно повинні платити данину. Проведемо рекрутський обшук по вулицях, місцевим не сподобається, та з часом зрозуміють, коли ворог буде під воротами."

new_farmsteads:0 "Спалити привидів"
new_farmsteads_desc:0 "Слаґс – дивні ізольовані мешканці північніше Модоку. Час показати їм, як виглядає справжнє суспільство. Хто не вийде – того виженемо вогнем із покинутих ферм."

new_slags:0 "Перевага Слаґс"
new_slags_desc:0 "Слаґс мають схожий шлях, як і ми: постійно боролися з утиском від людей. Спільна боротьба зближує. Допомогти їм захопити Модок? Та легко."

new_slagpuppet:0 "Місто-привид"
new_slagpuppet_desc:0 "Слаґс вирішили повністю заселити Модок і його околиці. Вулиці заполонили бліді люди, займають будинки, ферми. Місцевим не до вподоби, але ми маємо допомогти Слаґс облаштуватись."

new_slageaten:0 "Приводимо Модок до тями"
new_slageaten_desc:0 "Слаґс захопили Модок, але деякі боягузливі расисти досі бунтують. Пора допомогти нашим союзникам позбавитись цієї наволочі – і поставити край спротиву."

new_modocfarming:0 "Ферми Модоку"
new_modocfarming_desc:0 "Слаґс завжди були громадянами другого сорту. Пора дати їм трохи уваги. Вкладемось у фермерство – нехай більше не покладаються на волю пані Удачі."

new_loosends:0 "Завершити справи"
new_loosends_desc:0 "Землі Якудзи роками були головним болем на наших кордонах – грабували каравани, відлякували чужинців. Час покласти цьому край. І трохи наваритись у процесі."

new_connectsouth:0 "Каліфорнійська торгівля"
new_connectsouth_desc:0 "Межа з Новою Каліфорнією була завжди, а тепер маємо прямий шлях до Шейді-Сендз. Дорога від рейдерів очищена – час використати цю можливість. НКР точно нас не прожене."

new_sake:0 "Якудзенське бухло"
new_sake_desc:0 "Якудзи хоч і не показували, але бухло в них шикарне. Ми знайшли цілі ящики цього 'Саке' – вистачить на роки. Якщо доставимо партію до Ріно, то заробимо й настрої піднімемо."

new_hentai:0 "Нальоти по околицях"
new_hentai_desc:0 "Хоч ми й відкриті до всяких людей у нашому суспільстві, деякі з Якудзи так і не змогли позбутися своєї рейдерської сутності. Наші патрулі постійно чують про дрібні банди й варбенди, що щось грабують. Громадянам від цього мало користі, зате ми можемо гарно поживитись їх здобиччю."

new_japansteel:0 "Японські сталеливарні"
new_japansteel_desc:0 "Так, рейдери Якудзи були ще ті крадії, але працювати зі сталлю вони вміли. Було б мудро підхопити ці знання й взяти їхні заводи до того, як їх підірвуть конкуренти."

new_jackalsrush:0 "Добити шакалів"
new_jackalsrush_desc:0 "Шакали – це збочена наволоч, яка якось пристрастилась до людського м’яса. Пора здерти їм шкіру з язика й встромити кулю між очей. Добре, що ми підготувались – ці дегенерати довго не проживуть."

new_jackalsbuildup:0 "Ловимо карсонську шваль"
new_jackalsbuildup_desc:0 "Рейдери Якудзи, що жили в Карсоні, тепер бродять бандами – шукають, кого обікрасти й зжерти. Саме час вислати пару патрулів і вичистити цих голодних виродків."

new_lakes:0 "Озерна індустрія"
new_lakes_desc:0 "Тепер, коли рейдерів Якудзи нема, ми контролюємо більшу частину озера Тахо. Нові захоплені території відкривають нам шанс – качати з цього озерця все, що можна. Все одно ніхто тут не голий купатись не збирається."

new_jackalsplunder:0 "Повно здобичі"
new_jackalsplunder_desc:0 "Шакали роками сиділи на купі багатств і марнували все. Час звільнити ці скарби від людожерських пазурів. Всіх канібалів заженемо в кут і нагодуємо найкращим способом – кулею в лоба."

new_stateofreno:0 "Штат Ріно"
new_stateofreno_desc:0 "Нова Каліфорнійська Республіка вже десятиліттями була нам як союзник. Може, час подати заявку на офіційне визнання штатом? Зберігаємо незалежність, але даємо ясно зрозуміти – ми з Каліфорнійцями і в армії, і в бізнесі."

new_cityofsins:0 "Місто гріхів"
new_cityofsins_desc:0 "Нью-Ріно вистояв проти чужинців і рейдерів. Місто квітне, а наші землі живуть у розкоші й гріхах, як до війни. Вегас називали Містом гріхів – але Ріно давно вже забрав собі це звання."

new_nevada:0 "Проголошення Невади"
new_nevada_desc:0 "Невада сьогодні – територія, повна чвар і рейдерів. Час стукнути по столу й навести лад у цих дірках. Ріно стане маяком для всіх пригноблених у цій пустці."

new_catpaw: "Cat's Paw"
new_catpaw_desc: "Cat's Paw – найвідоміший бордель нашого міста, який легко дає прикурити навіть Гоморрі. Усе для твого задоволення – і він вже чекає на тебе! Тільки дітей залиш у дитсадку."

new_tipography: "Відновити друк"
new_tipography_desc: "Cat's Paw – це не тільки бордель. Колись тут працювала друкарня, що випускала легендарний еротичний журнал. На жаль, до нашого часу дожили лише поодинокі примірники. Але ми все ще можемо відновити друкарню й почати перевидання."

new_desperado2: "Тако-бар 'Сомбреро'"
new_desperado2_desc: "'Десперадо' ніколи не був таким гігантом, як 'Акула', тож ми перетворили його на мексиканський ресторан. Спробуй гострі ачтланські чилі на спеціальному 'вівторку Тлалока'."

new_chopshop: "Автомайстерня"
new_chopshop_desc: "Спершу Chop Shop була крихітною майстернею на околиці. А тепер – одна з найкращих автоточок у всій пустці! Тільки гляди, щоб ніхто не подряпав тачку. Жартуємо! \n\nЦей жарт є офіційним попередженням і звільняє Chop Shop від будь-якої відповідальності."

new_powerplant: "Міська ТЕС"
new_powerplant_desc: "Райти давно є частиною влади Ріно – саме вони побудували цю чудову електростанцію! Кажуть, вона працює на самозакоханості Райта, але ми-то знаємо – на екологічному вугіллі."

new_distillery2: "Відновлена винокурня"
new_distillery2_desc: "Сімейна винокурня Райта постраждала під час останніх політичних розбірок, але тепер вона знову працює! Тільки не пий прямо з бутля, як мутант."

new_rail2: "Залізниця шахт"
new_rail2_desc: "Колись повз наше місто проходила одна з найбільших залізниць країни. Ми досі ріжемо її рейки на металобрухт для власних потреб – старе йде на нове."

new_rail:0 "Східна залізнична станція"
new_rail_desc:0 "Відновлення старої станції зробило з неї новий транспортний хаб – ще один спосіб дістатися до найбільшого з маленьких міст. Ідеально для шукачів пригод із НКР та з усієї пустки."

new_newpeople:0 "Приплив мігрантів"
new_newpeople_desc:0 "Сотні знедолених з усього пустку стікаються до наших кордонів у пошуках дому та роботи. Ми можемо подбати про цих людей і зробити Ріно справжнім притулком для біженців пустки."

new_slvatorebar: "Італійська гриль-бар 'Сальваторе'"
new_slvatorebar_desc: "Сальваторе – не просто бар. Це місце, де подають найкращу італійську їжу в усій пустці. А звідки ми знаємо? Бо це, чорт забирай, єдине італійське місце на всю округу!"

new_slvatorebar2: "Піцерія 'Картуччі'"
new_slvatorebar2_desc: "Хоч Сальваторе й втратили свій вплив, їхній вклад у культуру Ріно живе далі. Спробуй дров’яну піцу в 'Картуччі'. Тільки не питай, що сталося з Сальваторе."

new_chem2: "Розваги з хімікатами"
new_chem2_desc: "Сальваторе завжди тримали контроль над хімкою в місті, хай Мордіно кажуть що завгодно. Але хімічна індустрія – це не тільки галюцинації. Наприклад, індуси роблять з конопель мотузки!"

new_arms: "New Reno Arms"
new_arms_desc: "Компанія New Reno Arms – наріжний камінь ренської економіки. Новий власник Алжернон наче й не проти продати частку. Дамо йому хитрий контракт, викупимо все й пустимо виробництво на наші справи."

new_goldenglobes: "Золоті Кулі"
new_goldenglobes_desc: "Брати Корсиканці створили першу порностудію після вибухів, і досі постачають моральну підтримку воякам НКР. Ми не просто заробляємо – ми робимо світ кращим."

new_medicine: "Reno 911"
new_medicine_desc: "У Ріно – найкращі шпиталі на північному заході Невади. Ми з радістю вилікуємо тебе за розумну ціну."

new_sharkclub: "Світ Акул"
new_sharkclub_desc: "Можемо додати до клубу 'Акула' аквапарк. Дурня для пустелі? Може й так. Але це ж весело для всієї родини!"

new_sharkclub2: "Клуб 'Мегалодон'"
new_sharkclub2_desc: "Клуб 'Акула' був одним із найбільших азартних закладів у місті, приваблюючи всіх, хто мріяв зірвати куш. Тепер ми заманимо гостей з усієї північної Каліфорнії та Невади. Відновлення під назвою 'Мегалодон' – наш перший пріоритет."

new_boxing2: "Гладіаторські бої"
new_boxing2_desc: "Бішопи просували правила – без ножів і смертей. Але, чесно, це було нудно. За прикладом Легіону, зробимо гладіаторські бої на смерть – для розваги! Весело ж, правда?"

new_newcomic: "Наші комедійні шоу"
new_newcomic_desc: "Якщо втомився від казино – заглянь у комедійне шоу в 'Сміхотунське Сховище'. Бо є речі смішніші, ніж твоє особисте життя!"


### Broken Brothers

new_brokenbrothers: "Нова банда в місті"
new_brokenbrothers_desc: "Радіація? Важка робота? Шукаєш помічників? Тоді ми, Зламані Брати, саме для тебе – допомагаємо за помірну плату. І не хвилюйся. Так, ми мутанти, але ми тут для всіх."

new_brokenhills: "Що лишилося від Брокен-Гіллз"
new_brokenhills_desc: "Коли шахта в Брокен-Гіллз вичерпалась, люди втратили до нас інтерес – і швидко звалили. А ми? Ми лишились, оточені страхом і ненавистю. Але ми тримались разом, використали знання й останні поклади урану. І знайшли собі роботу в найбільшому маленькому місті пустки!"

new_refuge: "Наш новий дім"
new_refuge_desc: "Після прибуття в Нью-Ріно було непросто. Але один покинутий завод дав нам прихисток. Ми знали, що люди нас бояться – тож мусили приховати, що маємо й знаємо, інакше все б у нас відібрали."

new_protectionlaws: "Закони про захист мутантів"
new_protectionlaws_desc: "З приходом [Root.GetLeader] до великої влади в Ріно швидко почалися перші кроки до рівності. Насамперед – захист мутантів від знущань і трудової експлуатації. Нові закони ухвалили швидко, і Нью-Ріно став маяком для всіх мутантів пустки."

new_brokenvangraffs: "Угода з Ван Ґраффами"
new_brokenvangraffs_desc: "Напруга в регіоні росте – особливо коли на півночі зникають мутанти. Нам треба зміцнити свою базу. А хто ще продасть потрібні запчастини, не ставлячи зайвих питань, як не Ван Ґраффи?"

new_brokensierradepot: "Відлуння Старого Світу"
new_brokensierradepot_desc: "Не всі гулі – доядерні. Але ті, хто пам’ятає речі на кшталт 'національних енергомереж' чи 'атомної інженерії' – завжди раді бачити в Ріно! Навіть якщо вони трохи смердять."

new_theincident: "Інцидент"
new_theincident_desc: "Ось він, пік усіх наших зусиль. Спільна ініціатива Зламаних Братів, Бішопів і Райта, щоб показати всім: у єдності – сила, у спільній справі – добробут."

new_brokenpurge: "Чистка"
new_brokenpurge_desc: "Атака була катастрофічною. Радіація, мутований FEV, осколки – багато постраждали. Навіть зараз околиці смертельно небезпечні. Для всіх – крім нас. Сім’ї або знищені, або лежать у руїнах. Пора нанести удар по Ван Ґраффам. І поки що – запровадимо воєнний стан і приберемо всіх людей з владних посад. Один одного ми можемо перевірити. Їх – ні."

new_brokengrowingcircle: "Наше коло зростає"
new_brokengrowingcircle_desc: "Коли ми взяли Ріно під контроль, стало ясно: треба дивитися ширше. Бо в пустці мутантів більше, ніж гулів і супермутантів. І ми зобов’язані дати їм прихисток."

new_brokendarkpit: "Кінець їхній темній ямі"
new_brokendarkpit_desc: "Наші друзі-троглобіонти, Слаґс, роками туляться в задушливих печерах. Раз ми вже не використовуємо військову базу Сьєрра, чому б не віддати її цим привидам, щоб у них з'явився справжній дім?"

new_brokendownunder: "Вони прийшли з глибин"
new_brokendownunder_desc: "Із заснуванням Нового Підземелля Слаґс можуть жити комфортніше, ніж будь-коли! Світле – ну, образно кажучи – майбутнє перед ними, і вони самі запропонували нам допомогу. Треба лише трохи підлаштувати їхнє обладнання..."

new_brokenlivinginasociety: "Життя в суспільстві"
new_brokenlivinginasociety_desc: "Ми живемо в суспільстві – і це, як не дивно, добре. Деякі супермутанти через трансформацію втратили розум. Тепер, коли в нас щось на кшталт уряду, можна створити установи, які допомагатимуть таким нещасним."

new_brokenbadbatch: "Погана партія"
new_brokenbadbatch_desc: "Еврика! Ну... майже. Кілька вулиць згоріло, дещо – вибухнуло, але ми створили програму інтеграції й перевиховання для проблемних супермутантів. Перші результати вже є, а рівень канібалізму – рекордно низький!"

new_brokenheartsandminds: "Відкриваємо серце й розум"
new_brokenheartsandminds_desc: "Під час пошуків інших мутантів у пустці ми натрапили на дивне – зграйку ракунів, явно розумних і добре організованих. Вони втекли в ліси. Дехто з нас хотів назвати їх 'фурі', але, можливо, спершу варто просто... поговорити з ними?"

new_brokenotherkindred: "Наші інші родичі"
new_brokenotherkindred_desc: "Дослідивши наших нових сусідів-проціонідів, ми зрозуміли: з цими 'С’Лантер' нам є про що говорити. Вони вважають нас спорідненими й діляться знаннями, які можуть стати в пригоді нашій спільноті."

new_brokendeathclaweggfind: "Дивна знахідка"
new_brokendeathclaweggfind_desc: "Під час зачистки Дена від Мордіно ми знайшли щось цікаве – кладку яєць Дезкло, зберігану в бридких, але технологічно крутих капсулах. Якщо їх так оберігали – вони точно щось приховують. І ми це з’ясуємо."

new_brokendeadlyclawslovelyhearts: "Смертельні Кігті, Милиці Серця"
new_brokendeadlyclawslovelyhearts_desc: "Коли ті яйця, що ми дістали з Дену, вилупились, одразу стало ясно – це були не звичайні Кігті Смерті. Малеча росла як на дріжджах, а як заговорили – весь район про них загомонів. Ці дивовижні нові мешканці Нью-Ріно – ще один доказ краси й розмаїття мутантів по всьому світу."

new_brokenabrighterfuture: "Світліше Майбутнє"
new_brokenabrighterfuture_desc: "Тепер місто в надійних руках – нема чого більше боятись, що якісь тупоголові людішки втоплять Нью-Ріно в лайні. Ми ведемо це грішне містечко до нової стабільності. Хай живе Традд!"

new_brokenopeningnewmines: "НРВР"
new_brokenopeningnewmines_desc: "Нью-Рінський Відновлювальний Бюро дасть нам централізовану систему для збирання й розподілу ресурсів, що лишились після Старого Світу, а також для ремонту старих будівель."

new_brokenfullautomisation: "Повна Автоматизація"
new_brokenfullautomisation_desc: "Роботи, малята! Використання спеціальних Протектронів для НРВР відкриє для нас цілком новий розділ у відбудові."

new_brokennewerreno: "Новіший Ріно"
new_brokennewerreno_desc: "Ми довго тримали свої високотехнологічні іграшки під замком у штабі, щоб не стати жертвою заздрощів. Тепер можна й двері відчинити – хай Нью-Ріно бачить, на що ми здатні."

new_brokenindustrialisation: "Розширена Індустріалізація"
new_brokenindustrialisation_desc: "Перші кроки зроблено – час прокачати промисловість по всьому Ріно. Ще один крок до стандартів довоєнного світу."

new_brokenrememberbrokenhills: "Згадати Брокен-Гіллз"
new_brokenrememberbrokenhills_desc: "Колись у нас було щось схоже на ідилію – Брокен-Гіллз, де мутанти й люди якось співіснували. Але як уран скінчився й ми стали непотрібні – нас викинули як сміття. Нашу утопію розтоптали. Більше так не буде."

new_brokenoldworldtactics: "Перевага Старого Світу"
new_brokenoldworldtactics_desc: "Найстаріші гуля пам’ятають ті золоті часи – неймовірне процвітання, наука, прогрес. Цей світ ще живе в їхніх спогадах. Може, час витягти ці примари минулого назад у реальність."

new_brokenourmarines: "Наші Старі Морпіхи"
new_brokenourmarines_desc: "Кілька привидів Старого Світу, яких ми взяли до справи, ще пам’ятають, як воювати по-людськи – з розумом, а не тільки м’язами. Тоді ще були системи, де солдати не голодували й мали чим стріляти. Ці тактики, як і їхні носії, – невмирущі."

new_brokennewworldtactics: "Перевага Нового Світу"
new_brokennewworldtactics_desc: "Майстер добре вчив своїх дітей. Навіщо озиратись на минуле, яке знищило світ, якщо можна дивитися вперед і користатись тим, що маємо зараз?"

new_callinginthebigboys: "Покликати Важковаговиків"
new_callinginthebigboys_desc: "Час від часу ширяться плітки про якісь забуті витівки Творця. Майже ніхто їх не сприймає серйозно. Особливо ті байки про покинуті проєкти з велетенськими мутантами. Але з деякими новими прибульцями... фантазія таки розігрується."

new_brokenvaultteccalling: "Волт-Тек Дзвонить?"
new_brokenvaultteccalling_desc: "Ми давно пильнуємо Місто-Сховище. Те, як вони поводяться з людьми й мутантами – ну дуже цікаво. Це змушує нас замислитись, як ми самі ставимось до людей. А ще – про спільні дії проти справжніх загроз."

new_brokenrejecthumanity: "Відкинути Людство"
new_brokenrejecthumanity_desc: "Людство не раз жалило нас, а ми тільки міцніше затягували ремені й ішли далі. Але остання соломинка зламала хребет – стало ясно, що люди й мутанти ніколи не зможуть ужитися. Ми збудуємо свою утопію, як би не довелося."

new_brokenreturntosymbiosis: "Повернення до Симбіозу"
new_brokenreturntosymbiosis_desc: "Майстер казав, що люди й мутанти не можуть співіснувати. І самі люди це підтвердили. Але ми плюємо на ці уроки – навіть якщо це веде нас до могили. Навіть страждаючи, ми виріжемо оазис прийняття з хаосу міста. Бо гармонія того варта."

new_brokenmutantsmatter: "Мутанти – Понад Усе"
new_brokenmutantsmatter_desc: "Якщо ці немутовані гівнюки не хочуть коритись нашому порядку – доведеться втоптати їх у землю."

new_brokenunityandequality: "Єдність і Рівність"
new_brokenunityandequality_desc: "Нема сенсу змінювати об’єкт ненависті – якщо ми чомусь і навчилися, так це не повторювати старі помилки."

####

new_police:0 "Поліцейське Управління Нью-Ріно"
new_police_desc:0 "У Нью-Ріно нікому не діло до кольору твоєї шкури. Он поглянь на цих пречудових супермутантів, яких ми взяли в копи! Тільки обережно з фотками – деяких яскраве світло лякає."

new_gym: "Щуряча Качалка"
new_gym_desc: "Заснований у 2210-му, «Джангл Джим» – найбільший спортзал північного заходу Невади. Його бої з боксу вже легендарні, але зацініть ще нашу нову йога-студію. Гаряча йога – саме те, особливо якщо радіаційний варіант спробуєш!"

new_renoproclamation: "Господарі Своєї Долі"
new_renoproclamation_desc: "Дехто белькоче, що Ріно не може розростатись і роз’єднаний, бо ніхто не рулить. Не ведіться – одна Сім’я таки керує, хай і неофіційно. І це..."

new_rat_farms: "Смачненький Протеїн"
new_rat_farms_desc: "Кротищури й гекони з Кламета – смачне й екологічне джерело м’яса. Особливо для туристів із порожніми гаманцями."

new_slavers:0 "Рабовласницька Гільдія Модока"
new_slavers_desc:0 "Хай це й не всім до вподоби, але загнати людей із Модока в кайдани – вигідно Ван Ґраффам. Їхнє жратво можна тупо забрати для нашого війська – і ніхто нам не виставить рахунок."

new_denslavers: "Терпимось до Работоргівців"
new_denslavers_desc: "У Дену методи брудні, але ж вони десятиліттями постачають робочу силу Місто-Сховище й іншим. Нью-Ріно – толерантне місце, тож не будемо встрявати в чужі справи."

new_rainbow_confederation: "Веселкова Банда"
new_rainbow_confederation_desc: "Не слухай балакунів – може, колись Веселкові Рейдери й були жорстокими, але зараз це справжня громада, що допомагає розбудовувати НКР. На відміну від Легіону, ми відкриті до всіх, хто може додати цеглинку до нашого блискучого міста."

new_ghoul_marriage: "Шлюби з Гулями"
new_ghoul_marriage_desc: "Багато чужаків гидливо кривляться, а от у Нью-Ріно всі свої – навіть шлюби між людьми й гулями норм. Може, саме тут ти зустрінеш кохання свого життя?"

new_economic_convergence: "Економічне Злиття"
new_economic_convergence_desc: "Нью-Ріно все глибше залазить у західну економіку, і бабло потекло. Дешева, але тлума робоча сила, ресурси, ділова хватка – і от ми вже технічний осередок. Як тобі такі радо-яблучка?"

new_pyramid_lake: "Пікнік біля Озера Пірамід"
new_pyramid_lake_desc: "Мало тобі задоволень у нашому містечку? А якщо ми покажемо трохи відпочинку біля озера Пірамід? Ну хіба ж хтось не любить риболовлю?"