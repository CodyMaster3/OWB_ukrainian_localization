  roaringbears:0 "Рикаючі ведмеді"
  roaringbears_desc: "Існує думка, що НКР не може дозволити собі утримувати таку армію. А ми — можемо."

  hellhammers:0 "Пекельні-молоти"
  hellhammers_desc: "Коли «Пекельні молоти» йдуть у звільнення в Нью-Рино, люди починають зникати, а місто здригається від моторошних знахідок. Їхня вірність та майстерність варті того, щоб... заплющити очі на ці інциденти."

