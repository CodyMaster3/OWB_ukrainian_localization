  vengefulsons:0 "Мстиві сини"
  vengefulsons_desc: "Походячи переважно з племені кайбабів, «Мстиві сини» одержимі лише одним: ненавистю до підкорення. І Нью-Рино може використати це на свою користь."

  pabloconquistadors:0 "Конкістадори Пабло"
  pabloconquistadors_desc: "Вони поводяться надто зухвало, як на свій статус, але неможливо заперечити: використання Пабло чудової зброї дозволяє перемагати супротивників, які значно переважають їх числом."

  junkcitygladiators:0 "Гладіатори міста Джанксіті"
  junkcitygladiators_desc: "Без списку системних змін важко сказати, як безпечно перепрограмувати «Гладіаторів». Наразі ми найняли людей, які виконують роль арена-анонсерів, щоб спрямовувати їх у потрібний бік."

  roadpsychos:0 "Дорожні Психи"
  roadpsychos_desc: "Чутки від «Пересмішника» повідомляють про гуркіт на сході. Якщо Вісімдесятники повернуться — «Дорожні психи» готові до цього навіть занадто сильно."

