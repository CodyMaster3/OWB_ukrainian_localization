frg_ahhhhh_naked_people_tt:0 "§gМожливо, проникнення до стрип-клубу задля інформації про Доктора — не найкраща ідея, але інших варіантів у нас немає.§!"
frg_break_in_decisions_tt:0 "Відкриває низку §Yрішень§! для §Rвторгнення§! у різні райони Плезантдейлу, спричиняючи легкий хаос у нашому пошуку."
frg_wakaw_tt:0 "§gУ Вакаві розумні... мабуть. Можливо, вони зможуть допомогти.§!"
