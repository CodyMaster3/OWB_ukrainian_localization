nf_frg.4.t:0 "Втрачені Хлопці"
nf_frg.4.d:0 "Морозні вітри в лісах біля Плезантдейлу переносять страшні дитячі казки про істот, що виють у темряві... Та правда нічим не краща. Це — Втрачені Хлопці, феї-чоловіки, чий розум спотворено гормонами та мутаціями Червоної Папороті. Після першого випадку місто вигнало їх усіх. Тепер вони блукають, полонені марення. Та не всі чоловіки стали Втраченими... Чи варто їх рятувати? Чи можливо? Петтівек не впевнена. Але феї — завжди сім’я... чи не так?"
nf_frg.4.a:0 "заповнювач"
nf_frg.4.b:0 "заповнювач"

