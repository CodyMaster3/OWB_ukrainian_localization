frg_little_faerie_hands:0 "Зроблено Маленькими Ручками Фей"
frg_little_faerie_hands_desc:0 "Коли нові феї зближуються, вони починають створювати речі в гармонійному ритмі, навіть із елементами показухи. Якщо ми зможемо налагодити виробничі лінії, то значно покращимо обслуговування та ремонт спорядження."

frg_ideas_construction_2:0 "Жодних Ляльок"
frg_ideas_construction_2_desc:0 "Деякі молодші феї почали шити ляльок із ганчірок — так само, як це робили діти з Плезантдейлу. Ми не можемо дозволити так марнувати ресурси... Але, можливо, одна-дві ляльки проскочать."

frg_faerie_lines:0 "Фейрі-Кола"
frg_faerie_lines_desc:0 "Ми облаштували кругові виробничі лінії, і все йде якнайкраще. У багатьох з'явилися власні хижки — коли я проходжу повз, чую сміх і цокання фішок на шахівницях. Вони... щасливі."

frg_big_faerie_ambitions:0 "Великі Амбіції Фей"
frg_big_faerie_ambitions_desc:0 ""

