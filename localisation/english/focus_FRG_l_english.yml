nf_frg.1000.t:0 "Прокрадаючись в Аптаун"
nf_frg.1000.d:0 "Петтівек крадькома пробиралася вулицями Плезантдейлу, оглядаючи кути та деручись на дахи. Коли вона нарешті досягла Аптауну, перед нею відкрилися вулиці, залиті світлом, мощені каменем і доглянуті. Саме тут народилися феї, без сумніву, — і саме тут панує розкішне життя."
nf_frg.1000.a:0 "Яке ж красиве світло!"