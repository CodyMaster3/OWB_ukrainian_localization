frg_dealing_with_the_boys:0 "Уладнання з Втраченими Хлопцями"
frg_dealing_with_the_boys_desc:0 "Не всі феї Глену зберегли глузд. Багато хто — зокрема «Втрачені Хлопці» — стали жертвами гормональних змін і мутацій Червоної Папороті. Вони блукають лісами, втративши розуміння себе. Можливо, нам вдасться повернути когось до тями... або знайти ліки."

