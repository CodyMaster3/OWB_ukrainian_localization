###character

MDM_penny_name:0 "Пенні"
MDM_penny_desc:0 "Улюблений талісман усіх досі тут! Як обличчя Міддлмарк (TM), Пенні також є назвою досконалої машини, яка керує всією мережею компанії. Хоча вона мала два століття, аби підвищити продажі, їй доводилось робити це шляхом відключення все більшої кількості систем у головному комплексі, залишаючи їх гнити по мірі зменшення її впливу.\n\nВтім, з допомогою нових друзів Міддлмарк ще може перевершити очікування акціонерів..."

MDM_friar_black_name:0 "Брат Блек"
MDM_friar_black_desc:0 "Брат Блек бачив усе — від падіння оригінальних керівників до виходу Мискаунтів. Можливо, зараз він дещо божевільніший, особливо після того, як почав носити телевізор як шолом, але він досі майстер убивств, каліцтв та підпалів (у вигляді шалених розпродажів), особливо коли йдеться про Вартових Білини.\n\nВін насправді, по-справжньому ненавидить Вартових Білини."

MDM_warden_name:0 "Молодший офіцер Кайлер Рукер"
MDM_warden_desc:0 "Коли Сієтл накрив Безсмертний, молодший офіцер Кайлер Рукер побіг на схід, якомога далі, намагаючись перечекати бурю та уникнути 'Очищувачів' і всякої наволочі. Він не очікував, що натрапить на Мискаунтів біля Летбриджа. Після того як його загін був замучений до смерті, він відчайдушно запропонував: «Залиште мене живим, і я допоможу зробити місяць вишнево-червоним.» Ніхто не зрозумів, що це означає, але Брату це сподобалось, і він сказав: «Ласкаво просимо.»\n\nЗвісно, це не означає, що він поза підозрою — але ж кожному рейдеру іноді потрібна боксерська груша, чи не так?"
MDM_warden_advisor_desc:0 "Коли Сієтл накрив Безсмертний... [текст такий самий, як вище]"

MDM_metal_mark_name:0 "Метал Марк"
MDM_metal_mark_advisor_desc:0 "У третьому фінансовому кварталі 2074 року Міддлмарк анонсував введення нового талісмана — напарника Пенні. Новий персонаж, Марк, мав бути її хлопцем-роботом у рамках кампанії з франшизи, спрямованої на підвищення популярності бренду. Планували мерч, іграшки, мультсеріал на 50 епізодів (анімували лише один).\n\nМарк втілював образ ідеального хлопця — пригодницький ковбой-космонавт, але з покірним характером, що мав апелювати до хлопців 7–12 років. На жаль, слухняність не сподобалась аудиторії, і Марка швидко зняли з проєкту. Через високі витрати на розробку його не знищили, а відправили працювати в бекофіс, повністю підконтрольного Пенні."

MDM_nickel_and_dime_name:0 "Нікель і Дайм"
MDM_nickel_and_dime_advisor_desc:0 "Близнюки, брат і сестра Нікель і Дайм, з народження вважалися Мискаунтами. Їх виховував батько — поважний Менеджер із західного Сієтлу, суворий у рейдерських звичаях. У 11 років вони вже могли «оцінити» будь-кого вдвічі більшого за них, а разом — змусити дорослого чоловіка впасти на коліна.\n\nКоли Вартові прийшли в місто й усіх стерли в порошок, діти втратили все: будинок, батька (страчений заради «порядку»). Доїхавши до Калгарі лише злістю, вони стали одними з перших, хто знайшов величезний торговий центр, який згодом став притулком банди.\n\nТепер, уже достатньо дорослі, щоби вести власну команду, вони стали символами помсти проти Вартових Білини — за будь-яку ціну."

MDM_bill_banks_name:0 "Білл Бенкс"
MDM_bill_banks_advisor_desc:0 "§N«Ви, сопляки, нічого не тямите! Думаєте, я став Менеджером просто так?! У мої роки я стільки товару силоміць з Куверу виніс, що завдяки мені ціле літо в Моу не було джету! Із тупим ножем, я вирізав штрих-коди прямо на тілах Розбивачів ребер! А тепер? Тепер я — Ґрітер! І вам пощастило, що я не пам’ятаю, де сховав свій пістолет...»§!\n\nБілл був найстарішим Менеджером у Сієтлі, можливо, й узагалі найстарішим серед Мискаунтів. Упертий, як осел, він був останнім, хто залишив місто під час вторгнення Вартових. До того часу в нього не лишилось жодного підлеглого — усі або загинули, або переметнулися. Чи тримає його Брат із поваги, чи з жалості — ніхто не знає. Звання Ґрітера — лише формальність: він не слухає нікого, й його теж ніхто не слухає (після минулого інциденту йому не дають набоїв). Та попри старечий маразм, він досі втілює суть Мискаунта: лайка, жорсткість і загроза швидкої смерті."

MDM_ira_tenner_name:0 "Айра Теннер"
MDM_ira_tenner_advisor_desc:0 "Коли Мискаунтів найняла Пенні, їм дісталося багато дивних завдань від обличчя Міддлмарку. Будь-що, що вийшло з ладу в автоматизованій системі, потребувало нових рук, і чомусь Айру поставили керувати бутербродною в торговому залі — попри те, що хліб, овочі та м’ясо зіпсувалися десятки років тому. Дехто сприйняв би це як образу — і міс Теннер, безсумнівно, сприйняла.\n\nПісля кількох вибухів гніву, кумедних витівок і тіл, що почали накопичуватись, Брат Блек доручив їй керувати всім харчовим забезпеченням у торговому центрі. Вона чудово впоралася з цією роллю — з гострим розумом (і залізною рукою) розподіляє їжу, яку рейдери добувають або вимінюють. Тепер слухай її, інакше добре, якщо отримаєш хоч би зіпсований бутерброд. З обох боків — кінчики хліба."

MDM_grygoriy_kovalenko_name:0 "Григорій Коваленко"
MDM_grygoriy_kovalenko_advisor_desc:0 "§G«Хочете вижити, гладкошкірі? Ану до мене, зараз старий працівник вас повчить. Виживання в мене в крові. Тобто, в тому, що від неї залишилося. Мій батько вижив, мій дід вижив, як і всі до нього — ще з тих пір, як ми були в старій країні. Тож слухайте уважно — може, й зможете стати кимось більшим, ніж просто розкладальником товару.»§!\n\nГригорій — старий гуль, один із небагатьох працівників Міддлмарку у цьому стані. Син українського іммігранта, він стверджує, що походить із роду видатних майстрів виживання, які пройшли крізь найгірші сторінки історії як великі полководці. Більшість, кому він це розповідає, не знають, що таке «Україна», але звучить вражаюче.\n\nПрацюючи в Міддлмарку ще до війни, Григорій пережив бомбардування й швидко став лідером у своєму районі. Коли почались ознаки гульфікації, він зрозумів, що пора йти — і з кількома побратимами втік, перейшовши до рейдерського життя заради виживання. Минуло століття, а він досі тримається.\n\nПобачивши, як у його старому магазині знову запалало світло, його буквально висушене серце відчуло щось рідне. Вразивши Мискаунтів своїми знаннями про бізнес і виживання, Григорій знову блукає рядами стелажів, як колись давно."

