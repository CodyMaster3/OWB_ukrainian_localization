### ideas

mdm_old_automation:0 "Стара автоматизація"
mdm_old_automation_desc:0 "Історично Міддлмарк пишався своїми самопідтримуваними майстернями... але, як і більшість речей, з часом вони заржавіли й стали непридатними. Можливо, з трохи любові й турботи їх ще можна оживити. Зрештою, роботи завжди чудово справлялися з розкладанням товару по полицях!"

mdm_scarred_by_wardens:0 "Позначені Вартовими"
mdm_scarred_by_wardens_desc:0 "Колись Мискаунти були найбільшими ворогами Вартових Білини. Роки вони вилизували свої рани, але Міддлмарк — це шанс. І як на диво, Вартових щойно вибили із Сієтлу.\n\nСхоже, доля знову грає на нашу користь..."

mdm_outsourcing:0 "Проблеми з аутсорсом"
mdm_outsourcing_desc:0 "У минулому мережа Міддлмарк надто заплуталась із архівами інших компаній через різноманітні аутсорсингові контракти."

mdm_gardener_slaves:0 "Раби зарплатні"

mdm_sandstone_buildings:0 "Пісковик Паскапу"
mdm_sandstone_buildings_desc:0 "Оскільки більшість родовищ пісковику в Альберті нині контролюється Мискаунтами, історія знову поєднала минуле з теперішнім. Назва каменю походить від річки Блайндмен (Паскап'ю — «Він сліпий» мовою крі) і його можна використовувати для вогнестійких будівель, дозволяючи мешканцям і туристам у Калгарі зігріватися біля Міддлмарку Мегаплексу."

mdm_managers:0 "Старі менеджери"
mdm_managers_desc:0 "Старих менеджерів здебільшого знищили або вигнали Вартові Білини, тож усні історії Мискаунтів майже втрачені. Але залишки прагнуть помсти — в ім’я своїх вчителів і батьків."

mdm_a_badge_for_everybody:0 "Бейджик для кожного"
mdm_a_badge_for_everybody_desc:0 "У Міддлмарку, для доступу до службових приміщень, кожен мусить бути «у формі». Це значить — мати бейджик і відповідну значку. Інакше — служба захисту активів добереться до тебе!"

mdm_shelf_stockers:0 "Розкладальники товарів"
mdm_shelf_stockers_desc:0 "Зонування не вирішує всіх проблем — потрібні люди, які справді викладатимуть товари для клієнтів!"

mdm_franchisees:0 "Франчайзі"
mdm_franchisees_desc:0 "Нові точки, нові точки, нові точки. Ось ключ до розширення будь-якої успішної корпоративної імперії!"

mdm_repair_station_upgrades:0 "Модернізація ремонтних станцій"
mdm_repair_station_upgrades_desc:0 ""

mdm_asset_protection:0 "Модернізація захисту активів"
mdm_asset_protection_2:0 "Модернізація захисту активів"
mdm_asset_protection_3:0 "Модернізація захисту активів"

mdm_middlemark_plus:0 "Пробна підписка Міддлмарк+"
mdm_middlemark_plus_desc:0 "§CДосліджуйте переваги Міддлмарк+§! \n\n§YЗнижки на пальне для учасників§! \n§gЗаощаджуйте до 10¢ за галон у тисячах точок по всій країні.§! \n\n§YБонуси Міддлмарк для учасників§! \n§gОтримуйте спеціальні пропозиції на повсякденні товари й накопичуйте бонуси.§! \n\n§YРанній доступ§! \n§gУчасники отримують спеціальні ціни, доступ до нових товарів, знижки до Чорної п’ятниці тощо.§! \n\nНа що ви чекаєте? Підписуйтесь сьогодні та починайте користуватися купонами, знижками і не тільки! \n\n*Ми залишаємо за собою право скасувати будь-які переваги в будь-який час без повернення коштів."

mdm_funding:0 "Американська данина"
mdm_funding_desc:0 "Наша участь у Культі Свободи та Компанії Піонерів дає нам додаткове фінансування!"
mdm_funding_2:0 "Американська данина"
mdm_funding_2_desc:0 "Наша участь у Культі Свободи та Компанії Піонерів дає нам додаткове фінансування!"

mdm_middlemark_support:0 "Торговельні зв'язки з Міддлмарком"
mdm_middlemark_support_desc:0 "Міддлмарк торгує з нами для захисту американських інтересів. Попри те, що в магазині працюють рейдери, лояльність компанії забезпечує нам здорові торговельні відносини."
mdm_middlemark_support_2:0 "Торговельні зв'язки з Міддлмарком"
mdm_middlemark_support_2_desc:0 "Міддлмарк торгує з нами для захисту американських інтересів. Попри те, що в магазині працюють рейдери, лояльність компанії забезпечує нам здорові торговельні відносини."

mdm_promotions:0 "Часті підвищення"
mdm_promotions_desc:0 "У Міддлмарку ми спеціалізуємось на просунутому наборі кадрів. Ми шукаємо лише найкращих із найкращих і даруємо підвищення, гідні ваших зусиль. Чи не хотіли б ви приєднатися?"

mdm_amped_production:0 "Максимізація виробництва"
mdm_amped_production_desc:0 "У Міддлмарку наші команди із захисту активів невпинно працюють над тим, щоб ціни залишалися низькими... Будь-якими засобами."

mdm_wardens_twin_hate:0 "Осиротілі Вартовими"

mdm_awab:0 "Усі Вартові — Лихі"

mdm_miscounts_repurposing:0 "Старі Мискаунти Знають Як!"
mdm_miscounts_repurposing_desc:0 "Ми вже проходили цей шлях. Якщо ми щось і вміємо — так це готуватися до старої доброї війни."

mdm_nukacola_refreshment:0 "Солодке оновлення з Nuka Cola!"
mdm_bobblehead:0 "Обмежений випуск фігурки Поллі!"
mdm_pizza:0 "Радість піцця-вечірки!"
mdm_aristocracy:0 "Смак, що вартий насолоди!"
mdm_captain:0 "Рідке відвага!"
mdm_happy_emp:0 "Щасливий працівник!"

### tooltips and flags

vsh_wardens_kicked_out:0 "§YВартові Білини§! були §Rвигнані§! з §O[VSH.GetNameWithFlag]§!!"

MDM_twin_hate_idea_add_tt:0 "Додати §GОсиротілі Вартовими§!, що надає:\n(Атака проти §Y[TOC.GetNameWithFlag]§!): §G+3%§!, (Захист): §G+5%§!\n(Атака проти §Y[VSH.GetNameWithFlag]§!): §G+3%§!, (Захист): §G+5%§!\n(Атака проти §Y[PAS.GetNameWithFlag]§!): §G+3%§!, (Захист): §G+5%§!"
