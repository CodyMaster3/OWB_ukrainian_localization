### events

nf_mdm.1.t:0 "Повна автоматизація й повні полиці"
nf_mdm.1.d:0 "Протягом багатьох років Міддлмарк (c) допомагав місцевому уряду Калгарі керувати містом зверху донизу. Від нашої запатентованої авто-магістралі до заправок і супермаркетів — ви завжди можете покладатися на Пенні (TM), що привносить вам частинки майбутнього вже сьогодні!\n\nНаша торгова мережа залишалася неушкодженою навіть попри тривожні ознаки підвищеної радіації зовні. Як би там не було, поки у вас є запатентовані Монети Міддлмарк або Квитки Міддлмарк — ми забезпечимо вас усім необхідним. Гарантовано!"
nf_mdm.1.a:0 "Яке чудове місце!"
nf_mdm.1.b:0 "Які гарно заповнені полиці!"
nf_mdm.1.c:0 "Сподіваюся, вони не володіють урядом..."

nf_mdm.2.t:0 "Рейдери з далеких земель"
nf_mdm.2.d:0 "Сьогодні знаменний день в історії компанії: вперше за сто дев’яносто вісім років Міддлмарк із гордістю оголошує про знову найнятих людей! \n\nПісля великої хвилі мігрантів із Сіетла рівень зайнятості зріс до небачених висот — а ми й без того були роботодавцем номер один на канадських преріях! \n\nЗверніть увагу: усі нові співробітники зобов’язані постійно носити бейджики на території компанії для цілей ідентифікації. За відсутності захисту активів усім співробітникам дозволено застосовувати летальну силу проти магазинних злодіїв, якщо буде потреба. (*) \n\n (Ця форма є комерційною таємницею. За її розголошення ми залишаємо за собою право на юридичну відплату.)"
nf_mdm.2.a:0 "Усім новобранцям буде видано стандартну зброю компанії."
nf_mdm.2.b:0 "Для захисту співробітників буде розгорнуто додаткові Маркетрони."

nf_mdm.3.t:0 "Особисті рахунки"
nf_mdm.3.d:0 "Мискаунти завжди «раді допомогти», але вони прийшли до Міддлмарку не для того, щоб гратися й повернутися до старого. Так, приємно мати стабільну роботу й підтримуючого боса, але помста?.. Вони все ще злі. Дехто з них не вірить у можливість реваншу, вважаючи, що шрами, залишені Вартовими, занадто глибокі... але інші? Інші поставили найважливіше питання: «А що як ми зможемо знову зробити все по-своєму?»\n\nНайстрашніше те, що багато хто сказав: «Так»."
nf_mdm.3.a:0 "Погнали, розтрощимо їх!"
nf_mdm.3.b:0 "З допомогою Відділу кадрів..."
nf_mdm.3.c:0 "Будемо раді допомозі."

nf_mdm.4.t:0 "Голка колись належала Мискаунтам"
nf_mdm.4.d:0 "Сіетл не завжди належав Братству. І навіть не Вартовим. Раніше ним правили Мискаунти: банда рейдерів із роздрібною естетикою, які тероризували поселенців за допомогою змінених цінників і бомб з чистячих засобів.\n\nКоли ж Вартові почали придушувати «бандитизм», дні Мискаунтів були полічені. Вони чинили спротив, але сили були нерівні, й їх витіснили зі штату.\n\nМіддлмарк став для них природним домом — а Пенні залюбки виділила їм частку раю, за умови реєстрації як співробітників із бейджиками.\n\nІ ось, коли Вартові вигнані з Сіетла, а «Безсмертний» зайняв їх місце — карти знову лягають на користь Мискаунтів..."
nf_mdm.4.a:0 "Можливо, все колишнє повернеться."
nf_mdm.4.b:0 "Можливо, майбутнє вже на порозі."
nf_mdm.4.c:0 "Можливо, перерва скінчилась."

nf_mdm.5.t:0 "Гірські Вартові"
nf_mdm.5.d:0 "Гірські Вартові з Passkeepers завжди трималися осторонь — і від Вартових, і від Мискаунтів. Та нещодавно ситуація змінилася — кажуть, Вартові тепер із ними. Добросердечні, усміхнені, з місією допомагати людям.\n\nНіхто не каже, що з ними обов’язково щось має статись. Що б не означало це «Фокстрот Юніформ» — для нас це навряд чи проблема. Але подумати варто..."
nf_mdm.5.a:0 "Кожен Вартовий має померти."
nf_mdm.5.b:0 "Нехай гниють у горах."

nf_mdm.6.t:0 "Залишенці й виживші"
nf_mdm.6.d:0 "Виявилось, не всім Вартовим пощастило втекти. Дехто застряг і зламався просто на південь від Магазину 0, у Летбриджі, у тих культистів із півдня. Схоже, ми можемо застати їх зненацька. Що скажеш, бос?"
nf_mdm.6.a:0 "Вирізати кожного до останнього."
nf_mdm.6.b:0 "Запропонувати їм новий прапор."

nf_mdm.7.t:0 "Найгірший кошмар Вартового"
nf_mdm.7.d:0 "Сьогодні в місто надійшла проста й коротка записка, з печаткою Міддлмаркуу: «Дайте нам убити Вартових — або...»\n\nПереговори з Мері Малліган показали, що давні вороги Вартових, Мискаунти, засіли в колишньому торговельному центрі, перетворивши його на притон для рабовласників. Війна з ними буде дорогою... Що нам робити?"
nf_mdm.7.a:0 "Ми не ведемо переговорів із Мискаунтами."
nf_mdm.7.b:0 "Вартові й так створюють забагато проблем..."

nf_mdm.8.t:0 "Сейфхейвен виганяє Вартових!"
nf_mdm.8.d:0 "Наші вимоги виконані! Вартових вигнали з Сейфхейвену, й вони потрапили просто в наші патрулі. В них не було шансів.\n\nКарма — штука така."
nf_mdm.8.a:0 "Так їм і треба."

nf_mdm.9.t:0 "Міддлмарк надсилає припаси!"
nf_mdm.9.d:0 "Маркетрони з Міддлмарку доставили припаси на наші кордони, несли на собі символ компанії — Пенні. Вони залишили їх із заявами про «фінансування справжніх американських патріотів!»"
nf_mdm.9.a:0 "Щедро, нічого не скажеш!"

nf_mdm.10.t:0 "Грандіозне Перевідкриття Міддлмарку!"
nf_mdm.10.d:0 "Хоч Міддлмарк завжди був відкритий для публіки, їхній Магазин 0 у Калґарі щойно розіслав сигнали про «грандіозне перевідкриття», закликаючи покупців і просто цікавих заглянути й поглянути на величезний вибір зниженої розкоші та речей, які «обов'язково потрібні».\n\nУ цьому ж повідомленні покупцям радять не боятися найнятих там рейдерів, мовляв, «їхні зуби давно вирвали».\n\nСигнал був одразу ж доповнений вибаченням щодо нападу на клієнта, який назвав себе Вартовим Білини."
nf_mdm.10.a:0 "Ого, не можу дочекатись!"

nf_mdm.11.t:0 "Як удома, але далеко"
nf_mdm.11.d:0 "Хлопці дослідили стару вежу на Дев’ятій. Усім вона нагадала Голку, як і очікувалось. Ми колись знаходили в ній достатньо їжі до того, як з’явився Міддлмарк, щоб якось вижити в старому місті. Але тепер усе вкрите купами старих брудних коробок.\n\nПоговоривши з Пенні, виявилося, що хтось купив цю вежу, але так ніколи й не переїхав — щось про «Нордікон». Що б це не було. Вони залишили нам кілька іграшок, а Пенні каже, що компанія переїхала кудись на схід. Цікаво, чи вони там завершили все... Можливо, колись зазирнемо."
nf_mdm.11.a:0 "Занадто багато мізків у банках!"

nf_mdm.12.t:0 "ЗНИЖКИ! ЗНИЖКИ! ЗНИЖКИ!"
nf_mdm.12.d:0 "Чи бувало у вас таке, що заходите до магазину й думаєте: «Це справді найнижча ціна?» Відповідь проста: якщо ви не в Міддлмарку — то ні!\n\nПротягом століть Міддлмарк намагався адаптуватися та зберігати низькі ціни попри конкуренцію. У Міддлмарк ми робимо ваше життя «більше ніж можливим». Бо тут завжди перемагає звичайний глузд — і дріб’язок!"
nf_mdm.12.a:0 "Які неймовірні знижки!"

nf_mdm.13.t:0 "Ніхто насправді не вмирає"
nf_mdm.13.d:0 "Ходять чутки про смерть і руйнування: стародавній жах Сіетла — Мискаунти — повернулись. Виживши завдяки живому торговому центру за північним кордоном, вони тепер, без сумніву, полюватимуть на останніх Вартових Білини у своєму прагненні до помсти..."
nf_mdm.13.a:0 "Нехай плачуть."

nf_mdm.14.t:0 "Піцца-вечірка!!!"
nf_mdm.14.d:0 "Вітаємо з обміном вашого купону на затверджене Міддлмарком святкування піцци! Ви отримаєте три (3) сирні піци зі складу надлишків, десять (10) повітряних кульок (поки є в наявності), і постер на тему піци для прикраси стіни на святі! Також буде особливий гість — давній компаньйон Пенні, Метал Марк! Метал Марк доставить піци та надує кульки. Будь ласка, взаємодійте з Метал Марком лише за потреби.\n\nПісля святкування ви зобов’язані прибрати за собою та повернути постер Метал Марку для зберігання. Піцца-вечірка може проводитися лише під час стандартної неоплачуваної обідньої перерви й тривати не довше п’ятнадцяти хвилин. Веселощів!"
nf_mdm.14.a:0 "Я беру шматочок з пепероні!"

# Фокуси
mdm_1:0 "Роздріб Міддлмарк"
mdm_1_desc:0 "Міддлмарк лишається непохитним маяком громади Калґарі ще з часів витіснення конкурентів у 2040-х роках — і пишається цим!"

mdm_2:0 "Мискаунти"
mdm_2_desc:0 "Рейдери із Сіетла, вигнані силою зі своєї домівки. Тепер — щасливі співробітники!"

mdm_3:0 "Старі образи, нові часи"
mdm_3_desc:0 "Мискаунти ніколи насправді не здавались — але працювати в Міддлмарку їм цілком до душі. Ну що такого, якщо трохи загратись у ролі?"

mdm_a_slavers_paradise:0 "Рай для работоргівців"
mdm_a_slavers_paradise_desc:0 "Калґарі — велике місто, й щупальця Міддлмарку проникають у кожен його закуток. Завдяки філіям по всій південній Альберті ми маємо безліч місць для створення постів нашої імперії. Без Вартових, які б усе псули, лише небо — межа."

mdm_calgary_tower:0 "Дослідити Калгарську Вежу"
mdm_calgary_tower_desc:0 "Калгарська Вежа — дивна штука, але може стати в пригоді. Пенні каже, що колись інша компанія хотіла її використати, але якась важлива особа зупинила це. Але частину підготовки, схоже, ще можна використати."

mdm_slave_catchers:0 "Призначити ловців рабів"
mdm_slave_catchers_desc:0 "Наші друзі з Орегону хизувались цими старими довоєнними штуками. Називали їх «Месметрони». Кажуть, вони неймовірно ефективні у примусі. І знаєш що? Ми знайшли цілу партію."

mdm_gather_collars:0 "Нашийники для рабів"
mdm_gather_collars_desc:0 "Рабам потрібні вибухові нашийники. Ну, не те щоб дійсно потрібні — але, чорт забирай, дисципліну вони підтримують чудово. А ще Пенні вже кілька днів скиглить, що їй потрібні прибиральники… Чому б не вішати бейджик на раба й не казати: «Дай ради»?"

mdm_lawn_and_garden:0 "Сад і Город"
mdm_lawn_and_garden_desc:0 "Відділ саду та городу Міддлмарку останні сто років був не в найкращому стані. Але з працею рабів ми можемо зібрати рослини довкола та централізувати постачання з Магазину 0."

mdm_sandstone_quarries:0 "Кар’єри Пісковику"
mdm_sandstone_quarries_desc:0 "Тут навколо купа старих, роздовбаних кар’єрів з тим, що Пенні називає «пісковиком». Каже, що через відсутність якихось там «зонувальних законів» — що б це не було — ми можемо облаштуватись, як захочемо, і змусити рабів копати. Чорт забирай, ми навіть можемо збудувати тут власне місце..."

mdm_putting_them_to_work:0 "У Преси — на Роботу"
mdm_putting_them_to_work_desc:0 "Підрахунок інвентарю показав, що ми просіли по зброї з тих пір, як Вартові нас викинули. Нехай раби допоможуть нам вирівняти баланс — по стволу за раз."

mdm_slaver_dogma:0 "Імперія, Збудована Рабами"
mdm_slaver_dogma_desc:0 "Ці раби допомогли нам стати на ноги за лічені дні! Тепер у нас стільки добра, що можна відпочивати скільки заманеться. То як щодо того, щоб розпити кілька пляшок за «службовим призначенням» і відсвяткувати?"

mdm_even_more_for_the_slaughter:0 "Ще Більше на Забій"
mdm_even_more_for_the_slaughter_desc:0 "Більше рабів — більше виробленої зброї. Проста математика, друже. Просто не забудь перевіряти свою зону та щодня звіряти інвентар."

mdm_miscounted_warden_stockpiles:0 "Залишки Озброєння Вартових"
mdm_miscounted_warden_stockpiles_desc:0 "Вартові ніколи не вміли нормально слідкувати за своїм спорядженням. У нас досі повно їхнього старого хламу з часів до того, як нас викинули... Розпакуймо ті піддони й подивимось, що знайдеться."

mdm_lethbridge_wardens:0 "Вартові в Летбриджі"
mdm_lethbridge_wardens_desc:0 "Вартові розсіялися по вітру так само, як і ми. Маленький гарнізон із залишків осів у Летбриджі... Сумнівно, що вони знають, у яке, чорт забирай, лігво смертохвата вони потрапили. Пора доставити їм їхнє онлайн-замовлення."

mdm_foxtrot_uniform:0 "«Фокстрот Юніформ»"
mdm_foxtrot_uniform_desc:0 "У тих горах є Вартові, але, схоже, вони не під старими прапорами. Чи варті вони нашої уваги?"

mdm_enslaved_wardens:0 "Перевернуті Ролі"
mdm_enslaved_wardens_desc:0 "З часом у нашому реєстрі рабів з’являється дедалі більше Вартових. Парадокс, еге ж? А дехто з них навіть запропонував допомогу — і бос наче не проти вислухати."

mdm_take_the_warehouse:0 "Захопити Склад"
mdm_take_the_warehouse_desc:0 "Старі склади компанії біля Летбриджа — легка здобич. Пенні каже, що зможе знову запустити їх, якщо ми трохи приберемось. Може, це допоможе їй із тим «збоєм» у системі."

mdm_memories_of_seattle:0 "Спогади про Сіетл"
mdm_memories_of_seattle_desc:0 "Колись давно Сіетл був домом для Мискаунтів... Поки Вартові не викинули нас звідти."

mdm_remember_the_managerial_staff:0 "Пам’ятаємо Керівників"
mdm_remember_the_managerial_staff_desc:0 "Колись Менеджери керували кожним районом Сіетла та містами довкола. Як ми цього досягли? Хрін його знає. Щастя, що ні Олімпійці, ні Якама нас тоді не розчавили. Виходить, просто Вартові виявились хитрішими."

mdm_reassess_profit_margins:0 "Перевірити Інвентар"
mdm_reassess_profit_margins_desc:0 "Річний інвентар був занижений. Пошлемо хлопців у підсобки — хай перевірять, чи цифри сходяться."

mdm_contract_renewals:0 "Оновлення Контрактів"
mdm_contract_renewals_desc:0 "У деяких наших людей скоро закінчаться контракти — потрібно видати їм річні бонуси й дати причину залишитись."

mdm_paul_blart_mall_cop:0 "Сіґвеї від Міддлмарку"
mdm_paul_blart_mall_cop_desc:0 "Сіґвеї досі валяються тут і там, і хлопці вже встигли до них звикнути. Пенні повністю підтримує використання їх для охорони Марта — то чому б не покататись?"

mdm_sweepstakes:0 "Компанійна Лотерея!"
mdm_sweepstakes_desc:0 "Пенні дозволила тягнути соломинки — каже, це називається «лотерея». Визначатиме, що нам випадатиме у вигляді припасів."

mdm_employment_drive:0 "Набір Співробітників"
mdm_employment_drive_desc:0 "Нам потрібні працівники! Без екіпажу ми нічого не зробимо! Пенні вимагає набір, і Фраяр — повністю «за»."

mdm_stocking_the_warehouse:0 "Поповнення Складу"
mdm_stocking_the_warehouse_desc:0 "Хлопці постійно жеруть це довоєнне барахло з полиць, і Пенні це дуже не подобається. Каже: «Якщо працівник їсть під час зміни, хай замінить, що з’їв». Бідолаха Мел отримав кулаком від Маркетрона — тепер у комі. Сам винен."

mdm_franchising:0 "Нам. Потрібен. Франчайзинг!"
mdm_franchising_desc:0 "Пенні говорить, що треба «розширюватися». Ну, ми допоможемо знайти їй нові точки для Міддлмарку."

mdm_threaten_safehaven:0 "Змусямо Safehaven Слухатись"
mdm_threaten_safehaven_desc:0 "Схоже, деякі з цих покидьків-Вартових оселилися у Safehaven, прямо під нашим носом. Якщо Showtime думає, що може кришувати таких виродків — то ми покажемо їм, що на нас чекає."

mdm_miscounts_need_guns:0 "Перевірити Інвентар ЩЕ РАЗ"
mdm_miscounts_need_guns_desc:0 "Ці йолопи не можуть і терміналом нормально скористатись. Як, в біса, у нас може бути більше зброї, ніж записано в інвентарі?! ПЕРЕРАХУЙТЕ ВСЕ, ПЕРЕВІРТЕ ПРИЧЕПИ НА ПАРКОВЦІ, БЛЯХА!"

mdm_hardware_upgrade:0 "Вхід у XXIII Століття"
mdm_hardware_upgrade_desc:0 "Служби безпеки, які ми закупили у стороннього постачальника, мали прогалини в схемах RobCo! Ви тільки уявіть — у наш час! На щастя, нам затвердили бюджет на модернізацію поточного програмного забезпечення."

mdm_im_done_being_scared:0 "Навіть Їм Не Вдалося Нас Зламати"
mdm_im_done_being_scared_desc:0 "Вартові зробили все можливе, щоб знищити нас, але ми вижили. І тепер ми повернулися, і вони вже не зможуть нас зламати.\n\nМіддлмарк — наша маленька фортеця крутості."

mdm_fund_montanan_raiders:0 "Геть Тостери!"
mdm_fund_montanan_raiders_desc:0 "Пенні завжди була занадто зосереджена на масовому виробництві кухонної техніки. То як, хлопці? Нам потрібні тостери чи великі стволи, які перетворюють ідіотів на фарш?!"

mdm_miscounts_take_control:0 "Мискаунти Повернулися!"
mdm_miscounts_take_control_desc:0 "Пам'ятаєте, як у Каскадії найстрашніше, що ви могли почути — це писк цінника? Як ми підключали його до бомб і жбурляли прямо на вулицю? Що ж, хлопці... Менеджер магазину поговорив із HR, і тепер ми не повинні просто згадувати минуле. Так-так.\n\nМи повертаємось додому."

mdm_command_nav:0 "Незалежне Мислення"
mdm_command_nav_desc:0 "Мене дістали ці медійні шакали на зарплаті зовнішніх корпорацій. Кажуть, що ми з вами як людські шкідники, що ви навіть думати самі не здатні, настільки глибоко ми залізли вам у мізки. То я скажу вам, хлопці: вони — брехуни. Шахраї! Щоб довести це, ми впровадили нові засоби комунікації між нашими ботами, аби забезпечити єдину позицію під час розборок із цими «викривачами»."

mdm_factories_left:0 "Підступне Постачання"
mdm_factories_left_desc:0 "§YЦе працює? Привіт, фабрика №242?§!\nСхоже, що працівники «лівобічного» заводу побутових приладів змагаються з торішнім виробничим рекордом! Ми не можемо цього допустити! Просто тому, що ми виготовляємо лише дрібну побутову техніку — ще не означає, що ми гірші! Збільшуйте показники! Покажіть, хто тут бос!"

mdm_factories_right:0 "Спритний Дизайн"
mdm_factories_right_desc:0 "§YО, фабрика №193? Тест, тест.§!\nЗнаєте, що я щойно знайшов у скриньці? Дайте я сам скажу — ПРАВИЛЬНО! ЛІВОРУКИЙ СТЕЙПЛЕР! Якщо це не пряма атака на наш виробничий рекорд, тоді я не знаю, що таке. Якщо ви зараз не подвоїли обсяги... то §RПІТРИЙТЕ§! їх!"

mdm_ice_picks:0 "Загублені в Крижаному Інвентарі"
mdm_ice_picks_desc:0 "Пам'ятаєте Ґюнтера і Джейн? Цих сучок із Анкориджа, як це було? Коли нас викинули — вони одразу стали дружками Вартових. І знаєте що? Там ціла купа льодорубів просто валялась і чекала на використання для «перевлаштування мізків».\n\nЯ не знаю, як ви, а я — великий фанат іронії."

mdm_robotics:0 "Щасливі Помічники"
mdm_robotics_desc:0 "Схоже, наша загроза звільнити Голову Робототехніки нарешті спрацювала! Відділ R&D нарешті щось та й вигадав. Хоча його папери на звільнення вже надіслані, і переривати робочий процес заради цього буде марно."

mdm_miss_nanny:0 "Різноманітність у Роботах"
mdm_miss_nanny_desc:0 "Так-так, ми читаємо всі ваші скарги. Так, ми знаємо, що туалет досі не працює. Руки не доходять. Але ось ще одна важлива справа, яку надіслали аж два з вас! Ви скаржились, що всі містери Гендзі звучать як той самий Боб — тож ми подумали: а що, якби... новий тембр голосу? Зустрічайте: міс Ненні!"

mdm_smoggy_skies_and_happy_smiles:0 "Смогові Небеса — Щасливі Усмішки!"
mdm_smoggy_skies_and_happy_smiles_desc:0 "Наш прорекламований смоговий проєкт — справжній хіт серед дітей! Щойно зранку маркетинг запропонував конкурс: хто знайде найцікавішу фігуру в хмарі смогу. Це безумовно відкриє нові економічні перспективи!"

mdm_push_niitsitapi:0 "Відділ HR Вирушає на Південь"
mdm_push_niitsitapi_desc:0 "ОЙ, ХЛОПЦІ. Схоже, нас знову кидають на понаднормову. HR хоче «поговорити» з тими типами південніше нашого складу та їхніми претензіями. Знаю-знаю. Двадцятий вікенд поспіль. Але гей — за це ж ми вам не платимо! Якщо напружитесь, може й станете менеджером!"

mdm_push_cult:0 "Погано для Бенжаміна"
mdm_push_cult_desc:0 "Схоже, у нас на кордоні нові корпоративні конкуренти! Думають, зможуть змагатися з нами — з вами, простими працівниками! Так ось — настав час діяти. HR вже схвалив злиття, хоча всі ми знаємо — це буде захоплення."

mdm_miscounts_win_the_pot:0 "Знижка від Мискаунтів"
mdm_miscounts_win_the_pot_desc:0 "Пора винагородити вас за всю ту працю проти тих ублюдків, які звали себе Вартовими. Вони керували своїм «підприємством», як тюрмою! А ми, у Мискаунтах, працюємо за власним бажанням. І саме тому керівництво вирішило дати вам усім корпоративні знижки!\n\nНаберуть чинності після... хмм, десяти фіскальних кварталів?"

mdm_push_spokane:0 "Холодна Конкуренція"
mdm_push_spokane_desc:0 "Хлопці, коли я кажу, що вдячний вам — я не жартую. Чесне слово! Оплачувані туалетні перерви протягом наступної години — за всю цю важку працю. А тепер — у нас тут військові талісмани, які вирішили, що заслуговують на другий шанс. Чому? Бо хочуть знову знизити вам зарплати! Жодних підстав для цього немає, але вони все одно лізуть. Тож закопаємо їх під шість футів землі, де ніяка зарплата вже не має значення."

mdm_advanced_resources:0 "Велике Мислення для Малих Рішень"
mdm_advanced_resources_desc:0 "Яйцеголові з лабораторії, які не бачили сонця з минулої весняної вилазки, нарешті запропонували рішення, яке дозволить подвоїти продуктивність за половину ресурсів! Моє питання — чому, чорт забирай, вони не зробили цього раніше? Потрібен буде невеличкий аудит."

mdm_metal_resources:0 "Забудьте про Безпеку"
mdm_metal_resources_desc:0 "Усі ці сторічні правила лише заважають нормальній роботі. Ви знали, що ми минулого тижня мали знайти партію нержавих шоломів для роботи? Думаю, якщо станеться кілька нещасних випадків, ми зможемо заощадити кілька тисяч кришок на ресурсах!"

mdm_all_american_experience:0 "Справжній Американський Досвід!"
mdm_all_american_experience_desc:0 "Усі солдати та СПРАВЖНІ ГРОМАДЯНИ США отримають спеціальні знижки та безкоштовні зразки продукції бренду Міддлмарк (C)!"

mdm_ap_upgrade_2:0 "Протиугонна Сигналізація"
mdm_ap_upgrade_2_desc:0 "Ми чули про випадки, коли клієнти не сканують товари й утікають із повними сумками. Пора це припинити! Замість звичайної сигналізації ми встановимо ультразвукові сирени — тепер кожен знатиме, коли хтось щось краде!"

mdm_the_cult_of_liberty:0 "Культ Свободи"
mdm_the_cult_of_liberty_desc:0 "На півдні патріоти ведуть безперервну війну з фашистами та підозрюваними комуністами. Вони не лише хороші клієнти — вони справжні, вірні громадяни Америки!"

mdm_pioneer_company:0 "Люди з Pioneer Company"
mdm_pioneer_company_desc:0 "Увесь цей час справжні американські солдати ведуть святу війну з комунізмом на півночі. Ура!"

mdm_renew_american_vows:0 "Вірність Патріотам"
mdm_renew_american_vows_desc:0 "Міддлмарк був і завжди буде АМЕРИКАНСЬКОЮ компанією. Саме тому ми прагнемо продовжити нашу взаємовигідну співпрацю!"

mdm_abandon_patriots:0 "Покинути Віруючих"
mdm_abandon_patriots_desc:0 "Історично, Міддлмарк надто активно вкладався у допомогу США та їхній армії. Якщо ми зосередимось на продажах, а не на пожертвах, наші прибутки зростуть у рази!"

mdm_address_the_issue_directly:0 "Пряма Відповідь на Проблему"
mdm_address_the_issue_directly_desc:0 "Плем’я Блад давно нам муляє. Цю землю було куплено законно американськими інвесторами понад 200 років тому. Їхні скарги не лише необґрунтовані — вони просто неправильні! Хотіли землю — треба було платити."

mdm_honor_blood_tribe:0 "Повага до Племені Блад"
mdm_honor_blood_tribe_desc:0 "Ми завжди були лише магазином. Дані з терміналів підтверджують, що частина наших південних володінь справді належала Племені Блад, і наші претензії на них були нелегітимними.\n\nЦе чудова нагода для піару — повернути їм землю."

mdm_the_wonders_of_automation:0 "Чудеса Автоматизації"
mdm_the_wonders_of_automation_desc:0 "Міддлмарк історично працював з повністю роботизованим персоналом без проблем. Якщо інвестувати в цю сферу ще більше, може, варто повністю замінити людей на машини?"

mdm_approach_neighbors_about_membership:0 "Реклама Міддлмарк+ для Сусідів"
mdm_approach_neighbors_about_membership_desc:0 "Багато наших сусідів досі не підписані на Міддлмарк+. Чому б не дати їм легкий поштовх і трохи таргетованої реклами?"

mdm_reducing_shrink:0 "Зменшення Втрат"
mdm_reducing_shrink_desc:0 "Крадіжки зросли після того, як ми найняли Мискаунтів. Вони, звісно, працюють ефективно, але наші Маркетрони повинні нагадати їм, що є їхнє, а що — власність компанії."

mdm_pursue_upgrades:0 "Чистка Систем"
mdm_pursue_upgrades_desc:0 "Стара мережа Маркетронів працює на самопальному RobCo-мейнфреймі з баґами та глюками. Якщо виправити основні проблеми — буде легше з ними взаємодіяти."

mdm_the_repair_station:0 "Станція Ремонту"
mdm_the_repair_station_desc:0 "Позаду нашої точки самовивозу є невеличкий двір, де раніше ремонтували техніку. Хоч він і занедбаний, з огляду на зростання злочинності в Калґарі — варто його відновити."

mdm_signal_for_repair:0 "Сигнал на Ремонт"
mdm_signal_for_repair_desc:0 "На даху Міддлмарку завжди була радіоантена — спочатку для реклами, звісно. Але якщо її підсилити, не лише радіус дії виросте, а й стане можливо викликати пошкоджених Маркетронів назад до Магазину 0 на переоцінку."

mdm_turning_lights_back_on:0 "Увімкнути Світло"
mdm_turning_lights_back_on_desc:0 "Наші віддалені точки завжди були популярні, але Магазин 0... Ну, трохи підкачав. Раніше ми радили клієнтам носити ліхтарики (звісно, за 25 центів), що не дуже добре вплинуло на відгуки — навіть у постядерному світі."

mdm_boot_the_generator:0 "Змусити Мискаунтів Завести Генератор"
mdm_boot_the_generator_desc:0 "Протягом років Пенні не дозволяла Маркетронам виконувати небезпечну роботу, окрім охорони та захисту майна. Але з приходом Мискаунтів — вони такі ж витратні, як вона й сподівалась. Можна втратити скільки завгодно працівників, аби тільки запустити генератор."

mdm_open_for_business:0 "Відкрито для Бізнесу"
mdm_open_for_business_desc:0 "Уявіть собі! Реклама працює, світло не блимає — майже як у справжньому магазині. Уау!"

mdm_power_to_the_people:0 "Енергія Народу"
mdm_power_to_the_people_desc:0 "§CКомпанія Міддлмарк§! (c) §gЛіцензована Порада§!: Чи знали ви (?) що забезпечення покупців справжньою, чистою енергією підвищує їхню лояльність до бренду? Неймовірно, правда?"

mdm_gathering_supply:0 "Відкрити Невідкриті Поставки"
mdm_gathering_supply_desc:0 "Кілька старих поставок від американської армії та центрального офісу залишились запакованими на дорогах після війни. З допомогою Мискаунтів ми їх знайшли. Дати їм ключі — і ось ми вже вантажимо трейлери, куди треба."

mdm_antitheft_measures:0 "Заходи Проти Крадіжок"
mdm_antitheft_measures_desc:0 "§CКомпанія Міддлмарк§! (c) §gЛіцензована Порада§!: Чи знали ви (?) що крадіжки — головний ворог роздрібної торгівлі? Зробимо наших Маркетронів більшими й страшнішими — хто тоді ризикне щось украсти?"

mdm_upgraded_ap_units:0 "Оновити Підрозділи Захисту Майна"
mdm_upgraded_ap_units_desc:0 "Підрозділи захисту майна — хребет компанії. Якщо 25% персоналу не переслідує клієнтів по магазину — як ми тоді запобігатимемо крадіжкам?"

mdm_software_update:0 "Оновлення Програмного Забезпечення"
mdm_software_update_desc:0 "Наша програма має обмеження, які змушують нас користуватись послугами застарілих постачальників. Тож просто... Блін! Вимикаємо це. Оце справді допоможе!"

mdm_reduce_reuse_recycle:0 "Зменшити, Повторно Використати, Переробити"
mdm_reduce_reuse_recycle_desc:0 "§CКомпанія Міддлмарк§! (c) §gЛіцензована Порада§!: Чи знали ви (?) що дуже легко змусити людей думати, що проблема з екологією в них самих, а не в корпораціях?"

mdm_wave_2:0 "Запустити Другу Хвилю"
mdm_wave_2_desc:0 "Трояни RobCo колись знищили наші внутрішні системи після крадіжки схем Сек’юрітронів, але якщо у тебе є два століття в запасі — ти можеш подолати будь-що!"

mdm_shareholders_rejoice:0 "Акціонери, Плескайте"
mdm_shareholders_rejoice_desc:0 "Наші завзяті співробітники — хай і мстиві — погодилися відкласти свої плани на прохання Відділу кадрів. Тепер можна зосередитись на робототехніці!"

mdm_new_management:0 "Нове Керівництво"
mdm_new_management_desc:0 "Навіщо робота, якщо не можна отримати підвищення за чесну працю? Наші хлопці це знають краще за всіх! Просто спитайте в старого Юлія!"

mdm_amp_up_production:0 "Додати Потужності"
mdm_amp_up_production_desc:0 "§CКомпанія Міддлмарк§! (c) §gЛіцензована Порада§!: Чи знали ви (?) що фабрика може працювати понад норму, якщо як слід налякати робітників?"

mdm_the_new_new:0 "Як Вам Нове-нове?"
mdm_the_new_new_desc:0 "Кожне підвищення заслуговує на нові іграшки, еге ж? Покажемо цим покидькам, хто тут справжній господар!"