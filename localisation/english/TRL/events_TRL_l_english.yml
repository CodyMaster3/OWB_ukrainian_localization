l_english:
#Decisions
trl_seeking_out_the_wizard_decision:0 "Пошуки Чаклуна"
trl_seeking_out_the_wizard_decision_desc:0 "Чаклун — постать загадкова. Невдовзі після своєї мутації в армії Майстра він зник і заховався у власному притулку. З роками розум його затуманився, а сила згасла. Він проводить дні й ночі, читаючи старі книги про легенди загиблого світу. І все ж, можливо, він знає щось, що допоможе Воррену подолати нинішні труднощі."

#Events
nf_warren.1.t:0 "Перша голограма"
nf_warren.1.d:0 "\"Тебе звати Ендрю Шоу. Ти народився 24 квітня 2043 року. У тебе є сім’я — два сини, яким ти обіцяв захист, і дружина, яку мусиш знову побачити. Саме тому ти став солдатом, Ендрю. Щоб захистити їх. Ти виріс у Портленді — це твій дім. Коли будеш готовий — повертайся. Подивися в обличчя тому, що сталося. Знайди свою спадщину. Вони були в сховищі, Ендрю. Можливо, твої діти вже мають власних дітей або залишили іншу спадщину. Знайди їх. Знайди себе. Не забувай цього, Ендрю. Пам’ятай, що важливо. Пам’ятай, що ти маєш зробити.\""
nf_warren.1.a:0 "Я маю знайти свою давню родину."
nf_warren.1.b:0 "Я маю захистити свою нову родину."
nf_warren.1.c:0 "Я маю повернутися додому."

nf_warren.2.t:0 "Друга голограма"
nf_warren.2.d:0 "\"Ти стаєш потворою. Я відчуваю це десь на краю свідомості — це ніби оніміння. Зосередитися дедалі важче. Вони знову з’являються — ті, хто вижив після Падіння. Хтось п’є заражену воду, хтось купається в ній, відчайдушно намагаючись стати таким, як ти, — достатньо сильним, щоб вижити. Ти повинен дати їм щось. Захист. Фортецю? Місто? Армію? Я не знаю. Але ти перший з нас. І ти мусиш вести.\""
nf_warren.2.a:0 "Я збудую фортецю."
nf_warren.2.b:0 "Я збудую місто."
nf_warren.2.c:0 "Я збудую армію."

nf_warren.3.t:0 "Третя голограма"
nf_warren.3.d:0 "\"Ми були неготові. Вони прийшли вночі. Вистав охорону. Вони прорвалися, вбили твоїх людей. Не знову. Не допусти цього більше. Знайди найсильніших серед своїх. Озброй їх. Навчи. Один-два крок — як у старі часи. Як в армії. Навчи їх боротися. Навчи їх боронити Воррен.\""
nf_warren.3.a:0 "Старший брат охоронятиме ворота"
nf_warren.3.b:0 "Громи падатимуть зі стін Воррена"
nf_warren.3.c:0 "Ми вдаримо зубами та кігтями"

nf_warren.4.t:0 "Четверта голограма"
nf_warren.4.d:0 "\"Твій народ голодує. Ви не можете розмножуватись. У вас тут майже нічого немає. Але ви повинні вижити. І для цього — брати. Шукати те, що вам потрібно: ресурси, рабів, воїнів. Бери те, що потрібне для виживання — такий тепер світ. Дарвінізм, пам’ятаєш? Виживає найсильніший. А сильніших за тебе немає. Запам’ятай це, повір у це — і ти виживеш. Виживе і твій народ.\""
nf_warren.4.a:0 "Ми заберемо їхні ресурси."
nf_warren.4.b:0 "Ми заберемо їхніх людей."
nf_warren.4.c:0 "Ми заберемо їхніх воїнів."

nf_warren.5.t:0 "Зустріч із Чаклуном"
nf_warren.5.d:0 "Пропливаючи вздовж отруєних відходами FEV берегів озера Крейтер, Перший вирушив на зустріч із легендарним Чаклуном. Відлюдькуватий навіть серед мутантів, той рідко відповідав прямо. Та коли Перший спитав, як розпочати нову епоху для Супермутантів, Чаклун мовив лише одне слово:\n«Північ»"
nf_warren.5.a:0 "...Я маю йти на північ?"

nf_warren.6.t:0 "Нова Маріпоза"
nf_warren.6.d:0 "Перший розірвав на шматки броньованих «звичайних», що охороняли вхід до Сховища 6 — ще раз довівши, що супермутанти є наступною сходинкою еволюції, справжніми дітьми апокаліпсису. Сховище 6 зберігало передові технології та заборонені експерименти, поховані під застиглою лавою та попелом. Тепер усе це належить нам. Галасливі мутанти регочуть, перекидаючи діжки з Вірусом Примусової Еволюції — отруйне зелене світло наповнює заіржавілі коридори. Цього разу бачення Майстра здійсниться. Настала ера супермутантів!"
nf_warren.6.a:0 "Я — новий Майстер!"

nf_warren.7.t:0 "Подарунок із заліза"
nf_warren.7.d:0 "Неочікувано для себе, Перший, який наказав мутантам обшукувати старі дороги поблизу Вілламетту, отримав не просто ресурси — а жест відданості. Замість того, щоб залишити знайдене собі, декілька мутантів принесли метал особисто Першому. Це дало йому ідею: якщо всі мутанти Воррена віддаватимуть знайдене залізо — матеріалів вистачить на все, що він захоче збудувати."
nf_warren.7.a:0 "Оголосити Залізний Податок!"

nf_warren.8.t:0 "Знахідки Беатріс"
nf_warren.8.d:0 "Беатріс захопилась словами минулого, що зберігалися в бібліотеці. Вона особисто звернулася до Першого з проханням дозволити їй шукати більше таких місць. Вона вірить, що це може відкрити нову епоху знань і сили для Супермутантів."
nf_warren.8.a:0 "Почати пошуки!"

nf_warren.9.t:0 "Військовий Клич Боунснарла"
nf_warren.9.d:0 "Боунснарл особливо прихильно ставиться до Кісткових Танцюристів. Багато з новонавернених Ординців, які пройшли мутацію, вважають його своїм героєм. Коли Орда розсіюється територіями Воррена — легенди про Боунснарла ширяться!"
nf_warren.9.a:0 "Сила — Супермутантам!"

nf_warren.10.t:0 "Обранці Піттмана"
nf_warren.10.d:0 "Піттман знайшов спільну мову з колишніми фанатиками Племені Мірлорків. Побачивши їхній потенціал, він звернувся до Першого з проханням навчити їх шляхам Найткіна — і надати їм Пристрої Невидимості, щоб вони служили Воррену з тіні."
nf_warren.10.a:0 "Ці Найткіни добре нам послужать!"

nf_warren.11.t:0 "Засвоєний Урок"
nf_warren.11.d:0 "Потрібна була неабияка відвага, щоб переконати супермутантів Воррена покинути свою печеру й вирушити в землі вигнанців, далеко на півночі. «Покидькові Пустки», як їх називали гладкошкірі. Засипані кістками та залишками старого світу, висушеного радіацією до смерті.\nСаме тут, у цій безлюдній землі, Перший нарешті зрозумів істинний урок Чаклуна.\nВідповідь для супермутантів полягала не в самому напрямку «на північ», а в тому, що саме там вона буде знайдена. Шлях супермутанта — це шлях завоювання! Чому Воррен має ховатися в печерах, якщо сто років тому супермутанти вже майже тримали світ за горло? Він переконав їх напасти на ці землі — то чому б не на решту Орегону?\n\nНезабаром Перший повернеться до Воррена. Його серце б’ється, як барабан. Він шукає Воєначальника, гідного приєднатися до нього. Може, кілька сутичок на арені з новоприбулими до печер відкриють, хто справді вартий?"
nf_warren.11.a:0 "Іноді варто просто вийти назовні."