l_english:
tyrant_of_the_warren:0 "Тиран Воррена"

trl_unifying_the_warbands:0 "Об’єднання Ватаг"
trl_unifying_the_warbands_desc:0 "Перший доклав усіх зусиль, аби придушити заколоти й чвари в лавах Воррена!"

trl_warband_without_a_home:0 "Ватага без дому"
trl_warband_without_a_home_desc:0 "Після падіння Армії Творця на півдні й втрати Сховища 6 на півночі — багато наших мутантів залишились без домівки. Воррен не вміщує всіх. Нам потрібні нові землі!"

trl_bonus_first:0 "Залізний Податок"
trl_bonus_first_desc:0 "Залізний Податок — це те, що Перший збирає з кожного мешканця своїх земель: раба, гуля, супермутанта. Кожен віддає частку ресурсів, щоб Перший міг збудувати їм дім, здатний пережити будь-яку війну!"

trl_bonus_bonesnarl:0 "Кісткова Орда"
trl_bonus_bonesnarl_desc:0 "Завдяки Боунснарлу Воррен перетворив більшість колишніх Кісткових Танцюристів у супермутантів! Кісткова Орда тепер складає основу нашої армії!"

trl_bonus_pittman:0 "Коралові Тіні"
trl_bonus_pittman_desc:0 "Особиста ватага Воєначальника Піттмана — колишні фанатики Болотників — тепер потужна сила. Тіні в панцирах, що полюють уздовж узбережжя й тягнуть здобич назад до басейнів мутації Воррена."

trl_preparing_for_war:0 "Готуючись до Війни за Верховенство"
trl_preparing_for_war_desc:0 "Війна за Верховенство покаже, хто справжній пан пустки. Ми мусимо готуватись — кожен мутант має це знати! Ми будемо готові!"

trl_cave_trolls:0 "Печерні Тролі"
trl_cave_trolls_desc:0 "Після падіння Творця, мутанти Тролячої Нори жили в печерах Орегону десятиліттями. Це стало для них способом життя — життя під землею, далеко від гладкошкірих."

trl_leaving_the_caves:0 "Покидаємо Печери"
trl_leaving_the_caves_desc:0 "Час виходити. Землі, які ми завоювали, чекають. Сонце пекуче, пустка дика — але тут їжа ближче, ніж у печерах."

trl_the_roaming_army:0 "Блукаюча Армія"
trl_the_roaming_army_desc:0 "Тепер майже ніхто з наших не живе в печерах. Ми стали ордою, що рухається від міста до міста, спустошуючи все на шляху. Мутанти з усієї пустки чують про наші звитяги й приєднуються до нас!"

trl_power_of_the_trolls:0 "Сила Тролів"
trl_power_of_the_trolls_desc:0 "Наша сила — незрівнянна, наші завоювання — безмежні! Ми непереможні! Мутанти долають сотні миль, аби стати частиною нашої армії!"

