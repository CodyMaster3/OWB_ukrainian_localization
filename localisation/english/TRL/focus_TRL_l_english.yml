l_english:
trl_firstholotape:0 "Перша голограма"
trl_firstholotape_desc:0 "Відчуваючи, як розум вислизає, людина, що стане Першим, створила кілька записів, щоб направити себе. Перший з них — це нагадування про його принципи. Про те, ким він був, і що було йому найдорожчим."

trl_secholotape:0 "Друга голограма"
trl_secholotape_desc:0 "Все більше занурюючись у безумство та відчуваючи зростання жорстокості в серці, майбутній Перший залишив другий запис — послання самому собі. Все більше людей приходило до його тимчасового пристановища. Він усе ще був солдатом. Його обов’язок — захищати. І нехай буде проклятий, якщо забуде це."

trl_thirdholotape:0 "Третя голограма"
trl_thirdholotape_desc:0 "Третій запис було зроблено значно пізніше. Після нападу на Воррен з боку прото-рейдерів: гуль і відчайдушних, які намагалися забрати останнє."

trl_fourthholotape:0 "Остання голограма"
trl_fourthholotape_desc:0 "Остання голограма — пошкоджена. Вона була відібрана у мандрівника, що став жертвою Воррена під час великого голоду. Ситуація стала критичною, і безпліддя лише поглибило відчай."

trl_warrenstirs:0 "Воррен пробуджується"
trl_warrenstirs_desc:0 "Барабани війни, зроблені з діжок, які колись містили FEV — отруту, що породила Воррен, лунають у пагорбах. Навіть найжорстокіші племена ховаються в оселях, пожираючи, можливо, свою останню людську здобич. Воррен пробуджується — і разом із ним виходить орда голодних мутантів."

trl_attackmarrow:0 "Соковитий кістковий мозок"
trl_attackmarrow_desc:0 ""

trl_attackbreakers:0 "Ніжні ребра"
trl_attackbreakers_desc:0 ""

trl_breakingribs:0 "Зламати їхні ребра"
trl_breakingribs_desc:0 "Ребролами були нашими жертвами десятиліттями. Ми забирали їхніх молодих воїнів для мутації, пожирали слабких. Ми надто довго дозволяли цьому слабкому племені існувати. Їх слід розчавити."

trl_drinking_marrow:0 "Пити кістковий мозок"
trl_drinking_marrow_desc:0 "Питці мозку виявилися надто слабкими. Але будь-хто з воїнів Воррена міг би сказати це. Вони були як стерв’ятники — жили на кістках, здобутих чужими руками. Вони зламалися легко — і такими залишаться."

trl_williamette:0 "Відбудова Черепної Фортеці"
trl_williamette_desc:0 "Ребролами діяли з ряду довоєнних споруд, які називали Черепною Фортецею. Ми зруйнували її у битві — але ми її відбудуємо. Величнішою, ніж будь-коли. Вона стане символом нашого панування в регіоні."

trl_fromtheruins:0 "З руїн"
trl_fromtheruins_desc:0 "Розбираючи їхні будівлі, ми дізнаємось, як вони виживали в цих негостинних умовах. Але краще — ми витягнемо вцілілих із руїн. Тих, хто втік, хто сховався, хто недостойний мутації. Вони будуть нашими рабами. Вони працюватимуть на полях, будуватимуть фортеці й копатимуть шахти."

trl_forced_mutation:0 "Примусова мутація I"
trl_forced_mutation_desc:0 "Сотні нових воїнів захоплено після перемог над Реброламами та Питцями мозку. Вони будуть занурені в підземне озеро FEV під Ворреном. І ті, хто виживе? Стануть нашими слугами!"

trl_warhornseast:0 "Роги війни на сході"
trl_warhornseast_desc:0 "Серед усіх північних племен, Кісткові Танцюристи — найсильніші. Вони єдині, хто вартий бою. Ми насолодимося битвою з ними. А на півдні — останні сховані племена: давні анімісти з боліт. Їх також слід знищити."

trl_warhornsgreat:0 "Роги війни на заході"
trl_warhornsgreat_desc:0 "Роги, що лунають із розбитих земель Реброламів і Питців мозку, щодень ближче до нових племен. Але ці племена сильніші. Це горді воїни, готові битись із кожним, хто стане на їхньому шляху."

trl_expanding_the_warren:0 "Розширення Воррена"
trl_expanding_the_warren_desc:0 "З новозахопленими землями ми більше не слабка нація. Тепер багато мутантів вперше можуть покинути печери та оселитися в полях і на пагорбах. Для багатьох це перше сонце над головою."

trl_weakness_in_the_north:0 "Слабкість на півночі"
trl_weakness_in_the_north_desc:0 "Привиди Вашингтона знищено. Ніщо не заважає нам рушити до Сховища 6. Треба скористатись цим шансом!"

trl_broken_tribes:0 "Табори підкорених племен"
trl_broken_tribes_desc:0 "Ті племена, що зламані нашою силою, повзуть до нас. Їхні жінки, діти, старі та немічні. Вони поселяються навколо Воррена, утворюючи густі табори. Вони приносять багатства — і потік нових рабів."

trl_pinnaclepoint:0 "Пінакл-Пойнт"
trl_pinnaclepoint_desc:0 "Бібліотека Пінакл-Пойнт містить велику кількість знань, які ми можемо використати. Хоча мало хто з нас уміє читати, ті, хто може — відкриють нам забуте."

trl_pickingbones:0 "Розколюючи культістів"
trl_pickingbones_desc:0 "Протягом десятиліть ми використовували кістки у зброї. Від прикрас до дешевої зброї для молодих воїнів. Тепер, знищивши культістів, ми маємо надлишок кісток, і новобранці творять копії славнозвісної зброї предків."

trl_takinghomes:0 "Забрати їхні домівки"
trl_takinghomes_desc:0 "Торгове містечко на станції Чемалт виявилось надзвичайно живучим, відбиваючи наші напади роками. Перший наказав нарешті поставитися до них як до загрози — і знищити. Сталлю й кісткою — вони впадуть."

trl_oldroad:0 "Стара дорога"
trl_oldroad_desc:0 "Безліч доріг і зруйнованих шляхів простягається в нашій зростаючій державі. Відновлення цих трас дозволить військам Воррена рухатися швидше — й повертатися з трофеями війни."

trl_forcedmut2:0 "Примусова мутація II"
trl_forcedmut2_desc:0 "[DIS.GetAdjective] зламані! Їхні фортеці розтрощено, їхні армії з плоті — розбиті. Чемалт лежить у згарищі. Ми забрали їхні мрії, безпеку, і залишили лише страждання. Це послання для людства: епоха мутанта настала. Вони стануть, як ми. Або зникнуть."

trl_greattribes:0 "М’ясо Мірлорків"
trl_greattribes_desc:0 ""

trl_bonepickers:0 "Знищення Апостолів"
trl_bonepickers_desc:0 ""

trl_chemultstation:0 "Розтрощити Станцію"
trl_chemultstation_desc:0 ""

trl_bonedancers:0 "Знищити Танцюристів"
trl_bonedancers_desc:0 ""

trl_armory:0 "Захопити Арсенал"
trl_armory_desc:0 "Арсенал на станції Чемалт — один із найбільших на півночі. Тисячі одиниць зброї, зібраної за століття боїв і грабунку. Схеми, що там зберігаються, дадуть нам багато нового."

trl_oldguns:0 "Старі гармати"
trl_oldguns_desc:0 "Станцію Чемалт охороняли довоєнні артилерійські установки — велетенські знаряддя смерті, створені для боротьби з чужоземними загарбниками. Вони мало допомогли проти нас, та люди подбали, щоб знищити їх перед нашою навалою. Проте навіть із уламків можна вчитись..."

trl_overrun:0 "Захопити болота"
trl_overrun_desc:0 "Мірлорки десятиліттями ховались у своїх болотах, не прагнучи ні розширення, ні влади. Воїни у панцирах, загартовані у вірі до мутованих істот, яких вони обожнювали. Вони могли стати великими завойовниками... Та тепер? Тепер вони ніщо. А болота — наші."

trl_dancingbones:0 "Танці на їхніх кістках"
trl_dancingbones_desc:0 "Кісткові Танцюристи славились бенкетами після бою. Вони зводили купи з кісток своїх жертв, і танцювали на них, поки не падали від утоми. Той, хто стояв останнім — здобував славу. І тепер, у їхню честь, ми танцюватимемо на їхніх останках так само."

trl_bountifulcoast:0 "Щедре узбережжя"
trl_bountifulcoast_desc:0 "Так звані Крувляндії — лиш мутоване болото, повне гниючих решток. Але саме тут росте яскраво-червоний плід у таких кількостях, що голоду там не знали. Тепер ми розуміємо, чому Плем’я Мірлорків не прагнуло йти далі. Вони мали вдосталь..."

trl_mirelurkconverts:0 "Звернення Мірлорків"
trl_mirelurkconverts_desc:0 "Нові мутанти, отримані після примусової мутації воїнів племені Мірлорків у підземному озері, охоче перейшли на наш бік. Вони пропонують поділитися своїми знаннями — як долати водні перешкоди під час рейдів."

trl_forcedmute3:0 "Примусова мутація III"
trl_forcedmute3_desc:0 "Навіть найсильніші племена не змогли нас зупинити. Воррен довів, що він — наймогутніша сила на півночі. А південні народи вже тремтять. Їхні воїни, як і всі до них, відправляються в озера під Ворреном... І стають гідними слугами нашої справи."

trl_monsterwoods:0 "Потвора в лісі"
trl_monsterwoods_desc:0 "У хащах блукають загублені воїни Воррена — ті, що втратили розум і перетворилися на лютих звірів. Вони колись були нашими найкращими. Повернути їх — обов’язкова умова нашого подальшого завоювання."

trl_bone_picks:0 "Спадок Кісткодряпів"
trl_bone_picks_desc:0 "Плем’я Кісткодряпів давно зникло, знищене [DIS.GetAdjective], але їхня спадщина залишилась — на вершинах гір ми знайшли їхню зброю. Вони зміцнювали кістки хімічними сполуками, роблячи їх міцнішими за сталь. Ми використаємо це — кожна здобич мусить служити."

trl_worthyfoe:0 "Гідний ворог!"
trl_worthyfoe_desc:0 "Воєначальник Шаттерганд бився до останнього. Він перевершував нас у бою не раз. З усіх його народу саме він гідний мутації. Якщо виживе — стане прикрасою нашої армії."

trl_greatherd:0 "Велика Орда"
trl_greatherd_desc:0 "Серед Кісткових Танцюристів майже не було негідних мутації. Сьогодні, коли ми женемо їх у яму, зрозуміло: з них виросте нова, велика орда мутантів. Сила, що підтримає наше завоювання."

trl_memories_of_ages:0 "Спогади віків"
trl_memories_of_ages_desc:0 "Минуле не полишає Першого — воно приходить у снах і в бою. Тактики війни, вкладені в юного солдата, що вже не пам’ятає власного імені. Але ми пам’ятаємо. І наша надія зростає."

trl_weaponspast:0 "Зброя минулого"
trl_weaponspast_desc:0 "Свинець, порох, гуркіт смерті — це зброя старого світу, що вирішувала долі імперій. Ми вміємо її створювати. Ми її бажаємо. І ми нею володітимемо."

trl_tribaldakka:0 "Племінна «Дакка»"
trl_tribaldakka_desc:0 "Ми захопили безліч рушниць і майстрів. Прийшов час озброїти наших воїнів. Кийки та молоти — це добре, але недостатньо."

trl_moredakka:0 "Більше «Дакки»"
trl_moredakka_desc:0 "Племінна зброя — проста, але шанована. Її передають від воїна до воїна. Коли ветеран знаходить кращу, його стара зброя переходить до новачка. У нас немає поганої зброї."

trl_betterdakka:0 "Краща «Дакка»"
trl_betterdakka_desc:0 "Наша зброя поступається ворожій. Ми мусимо її вдосконалювати, вивчати трофеї. Забирати не лише життя — а й інструменти смерті."

trl_weaponsfuture:0 "Зброя майбутнього"
trl_weaponsfuture_desc:0 "Гудіння енергії. Спалах червоної смерті. Зброя майбутнього — це наш шлях уперед. Ми оволодіємо нею повністю."

trl_tribalzappa:0 "Племінний «Заппа»"
trl_tribalzappa_desc:0 "Ми захопили кілька зразків енергетичної зброї та тих, хто її створює. Тепер вони працюватимуть на нас, озброюючи наших кращих воїнів."

trl_morezappa:0 "Більше «Заппи»"
trl_morezappa_desc:0 "Енергетична зброя племен не вражає, та її бережуть. Її передають з рук у руки — від ветерана до новачка. У нас немає непотрібної зброї."

trl_morezappa2:0 "Краща «Заппа»"
trl_morezappa2_desc:0 "Наші енергетичні зразки слабші за ворожі. Але ми вчимось. Ми переробляємо трофеї. Ми не тільки вбиваємо ворогів — ми забираємо їхню силу."

trl_guardianwild:0 "Хранителі Дикого"
trl_guardianwild_desc:0 "Обов’язок Воррена — захистити північні землі племен від розширення людей. Ми завоювали це силою. І ми не дозволимо це відібрати."

trl_warriorswild:0 "Воїни Дикого"
trl_warriorswild_desc:0 "Наш обов’язок — знищити ворога. Де б він не був, він дізнається: мутанти прийдуть. І принесуть смерть."

trl_baneofman:0 "Прокляття людству"
trl_baneofman_desc:0 "Людство втратило право на цей світ, коли залило його вогнем і радіацією. Ми — їхнє творіння. Їхня слава й кара водночас. Цей світ більше не їхній. Це епоха Супермутанта!"

trl_realmsofgoliath:0 "Володарство Голіафа"
trl_realmsofgoliath_desc:0 "Колись наймогутнішого воїна звали Голіаф, і він змусив цілі армії впасти перед ним. Лише втручання Всемогутнього стримало його гнів. Тепер? Немає більше Всемогутнього, аби врятувати людство від Голіафа. І нехай впаде прокляття на тих, хто насмілиться атакувати його королівство."

trl_callofgiants:0 "Поклик велетнів"
trl_callofgiants_desc:0 "Мутантів у нас вдосталь, але нам потрібна сила старших братів — Бегемотів! Тих, хто зрікся розуму заради сили. Вони принесуть нам перемогу на своїх плечах. Нехай велетні прийдуть — знищити надію ворогів."

trl_callofhorde:0 "Поклик Орди"
trl_callofhorde_desc:0 "Мутантів набагато більше, ніж здається нашим ворогам. Армія Майстра розсіялась, але варто лише чутці, аби зібрати їх знов. Орда, що зітре людство, вже на підході."

trl_trollsofthewarren:0 "Тролі Воррена"
trl_trollsofthewarren_desc:0 "Боунснарл сказав: якщо ми хочемо, щоб усі Бегемоти приєдналися до нас — треба знайти їхнього ватажка. Перший вирушає до лісу... кликати потвору в тіні."

trl_callofthefirst:0 "Поклик Першого"
trl_callofthefirst_desc:0 "Перший — найдавніший із наших. Народжений після Війни, помилка природи, що стала її спадкоємцем. Його голос лунає по пустці. Люди, мутанти, гуля — всі почують: він прийшов. Стань на коліна — або впади."

trl_sonsofman:0 "Мобільна мутація"
trl_sonsofman_desc:0 "Один з молодших генералів, Туск-Пекло, прославився «мобільною мутацією» — не веде полонених назад, а носить із собою каністри з FEV і перетворює ворогів просто на полі бою. Його метод працює. Може, варто підвищити?"

trl_riverexpedition:0 "Річкові експедиції"
trl_riverexpedition_desc:0 "Контроль над річками — ключ до влади серед племен Орегону та Вашингтону. Лише той, хто контролює воду, контролює силу."

trl_mutantwarship:0 "Мутантські кораблі"
trl_mutantwarship_desc:0 "Наші кораблі такі ж, як і наші воїни — грубі, міцні й жорстокі. Саме те, що треба Супермутантам!"

trl_amassingfleet:0 "Збираємо флот"
trl_amassingfleet_desc:0 "Будівництво кораблів — це про силу. Ми збудуємо флот і пануватимемо над усіма!"

trl_mutantcanoe:0 "Мутантські каное"
trl_mutantcanoe_desc:0 "Легкі човни — ідеальні для полювання на ворожі транспорти. Може, не такі славні, як великі кораблі, та без них — нікуди."

trl_raidingculture:0 "Рейд на Порт Моу"
trl_raidingculture_desc:0 "Наші молоді воїни вподобали війни на річках. Один з таких рейдерів може стати нам у пригоді..."

trl_rivergiants:0 "Річкові велетні"
trl_rivergiants_desc:0 "Облогові кораблі Воррена — повільні, важкі, але смертельні. Ніхто на річках не зрівняється з нами. А коли вийдемо в море — вороги затремтять."

trl_goliath:0 "Голіаф"
trl_goliath_desc:0 "Голіаф — флагман флоту Першого. Побудований на основі довоєнної баржі, він — нездоланна сила на воді."

trl_slavesunworthy:0 "Рабство для негідних"
trl_slavesunworthy_desc:0 "Мало хто гідний мутації. Тих, хто слабкий, ми тримаємо як рабів. А надто слабких — як худобу для трапези."

trl_forceddigging:0 "Примус до копання"
trl_forceddigging_desc:0 "Копати камінь — не складно. Але змусити працювати без загрози — ще складніше."

trl_unwillinggatherers:0 "Невільні збирачі"
trl_unwillinggatherers_desc:0 "Наші раби працюють, доки не впадуть. Лише тоді їм дозволяють їсти, спати. Хто працює краще — вмирає пізніше."

trl_expandingslavelabour:0 "Розширення рабської праці"
trl_expandingslavelabour_desc:0 "Наші наглядачі формують загони з десятків рабів, що прокладають шляхи крізь заражені хащі."

trl_forcedroads:0 "Змушені будувати дороги"
trl_forcedroads_desc:0 "Кладка каміння — нудна й важка. Але ця робота не для справжніх мутантів."

trl_slavemutanthouse:0 "Житло для рабів і мутантів"
trl_slavemutanthouse_desc:0 "Раби живуть у наметах. Ті, хто довів свою користь — можуть збудувати собі щось краще з залишків після спорудження домівок для Супермутантів."

trl_slaveworkshop:0 "Майстерні рабів"
trl_slaveworkshop_desc:0 "Раби, що мають архітектурні навички, мають трохи кращі умови. Вони проєктують наші споруди й залишаються живими."

trl_mutantlabor:0 "Праця супермутантів"
trl_mutantlabor_desc:0 "Супермутанти не такі ефективні, як люди. Але сильніші. Один мутант — як шестеро людей у вантаженні чи будівництві."

trl_militarizedlabour:0 "Військова праця"
trl_militarizedlabour_desc:0 "Навіть мутант, що не знає війни, стане солдатом, якщо дати йому зброю. Рано чи пізно він навчиться."

trl_readyforwar:0 "Готовність до війни"
trl_readyforwar_desc:0 "Щоб готуватись до нових воєн, ми маємо навчитись будувати майстерні та арсенали, як люди. Так ми забезпечимо безперервне виробництво."

trl_stockpiledweapons:0 "Зброя в запас"
trl_stockpiledweapons_desc:0 "Ми перемогли багатьох і зібрали багато трофеїв. Зброя має служити справі, а не висіти на стінах."

trl_rewardsofvictory:0 "Нагорода переможцям"
trl_rewardsofvictory_desc:0 "Перемога дає право на все, що мав ворог. Ми забираємо багатства, речі, які вони ігнорували — і використовуємо їх, щоб стимулювати наших ремісників."

trl_gloriouscity:0 "Славне місто"
trl_gloriouscity_desc:0 "Воррен зростає! Населення мутантів збільшується, а під ногами живе натовп людей-рабів, що працюють, щоби вижити."

trl_defendingthewarren:0 "Оборона Воррена"
trl_defendingthewarren_desc:0 "Оборона FEV-ям — найвища пріоритетна мета. Ми постійно вдосконалюємо захист столиці."

trl_oregonline:0 "Орегонський вал"
trl_oregonline_desc:0 "Воррен — не фортеця. Але стане нею. Якщо загнати рабів у роботу — збудуємо укріплення на випадок вторгнення."

trl_seek_out_the_wizard:0 "Знайти Чаклуна"
trl_seek_out_the_wizard_desc:0 "Супермутанти Воррена — ізольовані. Та ще більш самітний — Чаклун, старий тінь на вулканічному острові серед озера Крейтер. Можливо, він знає, як надихнути залишки нашого народу?"

trl_the_first_above_all:0 "Перший понад усіх"
trl_the_first_above_all_desc:0 "Немає сенсу давати титул Воєначальника комусь іншому. Всі ватаги мають слухати Першого. Він вчитиме, як битися, як вижити, як перемагати."

trl_pittmancunning:0 "Хитрість Піттмана"
trl_pittmancunning_desc:0 "Здобувши прихильність Воєначальника, Піттман піднімає бойовий дух мутантів. Він проповідує славу Майстра. А його тіні стають улюбленцями Першого."

trl_nightkinmigration:0 "Міграція тіней"
trl_nightkinmigration_desc:0 "Надихнувшись славою Піттмана, тисячі тіней рушають на північ, щоби приєднатись до армії Воррена."

trl_firsts_ambition:0 "Амбіції Першого"
trl_firsts_ambition_desc:0 "Тепер, коли Орегон майже наш, час втілити амбіції. Куди зверне Перший далі?"

trl_southernpush:0 "Похід на південь"
trl_southernpush_desc:0 "Ха! Примари Вашингтону нас не злякають. Попереду — більша здобич. Ми підкоримо Братство потім. А зараз — помста Арройо! Вони знищили Майстра. Тепер — їхня черга страждати!"

trl_vengeancemaster:0 "Помста за Майстра!"
trl_vengeancemaster_desc:0 "Час прийшов. Помститися за загибель Майстра. Ударити по землях Обраного — і знищити його спадщину!"

trl_redriver:0 "Червона Ріка"
trl_redriver_desc:0 "Коли ми знищимо Кламат — про це дізнається весь південь. Ріка, на честь якої назване місто, понесе трупи, кинуті у воду після різанини. Так загине ще одне поселення."

trl_mariposareborn:0 "Маріпоза Відроджена!"
trl_mariposareborn_desc:0 "На півночі лежить величезний підземний комплекс — Сховище Шість. Завдяки його технологіям і запасам FEV із Нори Тролів Перший вірить, що зможе відтворити Маріпозу! Але спершу слід прибрати Вашингтонське Братство. Та хто вони, щоб стояти на шляху раси Супермутантів?"

trl_bonesnarlloyalty:0 "Вірність Боунснарла"
trl_bonesnarlloyalty_desc:0 "Боунснарл — справжній воїн Воррена. Він не ставить питань своєму ватажкові та свято вірить у силу через поїдання. Воїни Воррена збираються навколо нього вдень і вночі, слухаючи того, хто має вухо Безсмертного."

trl_cannibalmutants:0 "Мутанти-канібали"
trl_cannibalmutants_desc:0 "Не забуваймо, звідки прийшли воїни Воррена! Канібальські племена Орегону дали своїх найкращих — і звичаї, і м’ясо. І з підземного озера вийшли покоління мутантів-монстрів."

trl_preparingthewarren:0 "Підготовка Воррена"
trl_preparingthewarren_desc:0 "Щоб рости й панувати, Воррен має стати більшим. Зброя, торгівля й безліч інших речей мають бути впроваджені, перш ніж його назвуть Великим."

trl_developingslavesmines:0 "Розширення Рабомайн"
trl_developingslavesmines_desc:0 "Навколо Воррена повно води й металу — варто лише копати. А хто не хоче? Той побачить, чого варта відмова."

trl_ritualscarring:0 "Пау-Оу"
trl_ritualscarring_desc:0 "Ми знайшли запас зброї... дуже корисної. Пау-Оу! Гладкошкірі називають їх «Силовими Кулаками», і це — справжня сила. Треба відновити якомога більше!"

trl_eatersman:0 "Пожирачі Людства!"
trl_eatersman_desc:0 "Нехай тремтять ті, хто знає, що йде з півночі! Хай бояться зубів і слини мутантів — бо в глибині душі вони знають: їм доведеться годувати власні творіння..."

trl_masters_of_men:0 "Володарі Людства!"
trl_masters_of_men_desc:0 "Усі мають знати, хто справжній хазяїн півночі! Люди — наші ляльки. Вони копають руду й кують зброю. Вони — лише свійські тварини. Як і хотів Старий Світ."

trl_beatricesmight:0 "Сила Беатріс"
trl_beatricesmight_desc:0 "Беатріс ледь не перемогла Першого завдяки тренуванню, але врешті її здолала його сила. Це — найближча поразка в історії Першого, й про неї гудить увесь Воррен. Слава Беатріс уже розходиться!"

trl_armorrepurposing:0 "Металеві Мутанти!"
trl_armorrepurposing_desc:0 "Навіщо Дакка?! Якщо створимо кращу броню — кулі нам не страшні! Супермутанти — вершина! Ми — невмирущі!"

trl_causeoftrouble:0 "Джерело Біди"
trl_causeoftrouble_desc:0 "Братство — останній символ Старого Світу. Саме вони спалили світ у вогні й створили нас. Вони — не привиди. Вони — просто люди. Ми маємо зосередитись на здобутті Сховища 6 і знищенні їх!"

trl_mutantshocktactics:0 "Зимова Тактика"
trl_mutantshocktactics_desc:0 "До нас прийшов мутант на ім’я Крижана Щелепа. Колись він мав добре серце — доки Братство не влучило в нього плазмовим пострілом. Тепер він пропонує показати нам шлях через холод Вашингтона в обмін на допомогу повернути його печеру."

trl_mounthawk:0 "Штовхнути кордон"
trl_mounthawk_desc:0 "Кордонів не існує для мутантів. Наші рейди вже проникають у землі Братства. Вони шукають нову здобич — гладкошкірих для мутації!"

trl_destroy_the_temple:0 "Знищити Храм"
trl_destroy_the_temple_desc:0 "На відміну від інших завоювань, у землях Арройо немає нічого корисного. Це — батьківщина Обраного. Краще стерти храм із лиця землі, щоб стерти і його пам’ять."

trl_prepare_for_war:0 "Підготовка до Війни"
trl_prepare_for_war_desc:0 "Війна за Верховенство наближається. Вона визначить, хто справді панує. Воррен мусить готуватись. Усі мутанти й раби — працюйте вдвічі більше!"

trl_timberline:0 "Удар по Лісовому Рубежу"
trl_timberline_desc:0 "Лісоруби Лісового Рубежу довго жили спокійно, ховаючись між нами й Північною Лігою. Але якщо знищити Лігу — ніщо не зупинить нас від нападу на цей слабкий штат."

trl_the_final_threat:0 "Остання Загроза"
trl_the_final_threat_desc:0 "Залишилась одна загроза — велика примара півночі. Братство. Символ минулого, чоловіки в броні, зі зброєю блискавки. Ми скинемо цих «богів» з трону!"

trl_war_for_supremacy:0 "Війна за Верховенство"
trl_war_for_supremacy_desc:0 "Війна почалась! Ми більше не можемо стримувати голод, що зростає у Воррені. Час атакувати давнього ворога — і вирішити, хто пануватиме на півночі!"