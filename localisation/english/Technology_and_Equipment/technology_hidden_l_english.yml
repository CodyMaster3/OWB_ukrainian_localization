robco_security_protectrons_tech:0 "Роботи-Охоронці RobCo"
robco_security_protectrons_tech_desc:0 ""

ballistic_missile_unlock_tech:0 "Запуск Балістичних Ракет Старого Світу"
ballistic_missile_unlock_tech_desc:0 ""

nuclear_missile_unlock_tech:0 "Запуск Ядерних Ракет Старого Світу"
nuclear_missile_unlock_tech_desc:0 ""
