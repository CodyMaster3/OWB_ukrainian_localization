#Unlocks
gauss_unlock_tech:0 "Схема Ґаус-зброї"
gauss_unlock_tech_desc:0 "Ґаус-зброя — це довоєнна розробка, яка використовує магнітне прискорення замість пороху для стрільби снарядами, здатними пробивати навіть силову броню."

plasma_unlock_tech:0 "Схема плазмової зброї"
plasma_unlock_tech_desc:0 "Плазма була передовим напрямом довоєнних енергозброєвих технологій, створених на основі загадкових, малозрозумілих принципів."

enclave_pa_unlock_tech:0 "Схема вдосконаленої силової броні"
enclave_pa_unlock_tech_desc:0 "Цей тип броні був розроблений на нафтовій платформі Анклаву як наступний етап розвитку прототипів X-01."

midwest_pa_unlock_tech:0 "Схема Технічної Броні"
midwest_pa_unlock_tech_desc:0 "Технічна броня була розроблена Середньозахідним Братством з використанням місцевих технологій."

high_fighter_unlock_tech:0 "Схема 'Сянь'"
high_fighter_unlock_tech_desc:0 "Xian-85 — передовий китайський винищувач, що перевершував навіть найкращі американські аналоги і використовувався в останні години Великої Війни."

vertibird_unlock_tech:0 "Схема Вертобірда"
vertibird_unlock_tech_desc:0 "Вертобірди — це похило-крилі роторні апарати, здатні виконувати функції транспорту, штурмової підтримки та евакуації."

grunt_level_radio_unlock_tech:0 "Портативні радіостанції"
forward_fire_base_unlock_tech:0 "Мобільні укріплення"

scav_unlock_weapon_tt:0 "Відкриває відповідну технологію зброї для дослідження."
scav_unlock_business_tt:0 "Відкриває відповідне довоєнне підприємство."

# Civilizations
super_mutant_civilization:0 "Цивілізація Супермутантів"
super_mutant_civilization_desc:0 "Наша нація очолюється супермутантами, які використовують свої фізичні переваги над людьми. Тактика і спорядження, які ми розробляємо, найкраще підходять саме мутантам — тому людські солдати можуть не впоратися."

military_heritage_unlock_tech:0 "Військова спадщина"
military_heritage_unlock_tech_desc:0 "Наша нація має довгу історію військових традицій, що походять від солдатів, які пережили Велику Війну."
military_heritage_unlock_tech_tt:0 "Відкриває доступ до технологій §YВійськової спадщини§! у верхньому правому куті вікна технологій §GПіхоти§!."

# Units
police_infantry_tech:0 "Піхота Законників"
police_infantry_tech_desc:0 "Законники — це гібрид міліції та охоронців порядку, які патрулюють у мирний час і допомагають армії під час війни. Вони не такі ефективні в бою, як регулярна піхота, але краще знають місцевість і самостійно ведуть розвідку."

sentinel_unit_tech:0 "Бойова система 'Сентінел'"
sentinel_unit_tech_desc:0 "Система 'Сентінел' — довоєнний проєкт, що дозволяє дистанційно керувати кількома силовими бронями через єдиного оператора. Це дає змогу розгортати броню без необхідності у великій кількості навчених солдатів."

dog_infantry_tech:0 "Підрозділ Бойових Псів"
dog_infantry_tech_desc:0 "У більшості націй собаки — допоміжна сила. Але ми зробили їх ключовою частиною армії. Тренування потребує більше ресурсів, але бойові пси незамінні в наступі."

super_mutant_aux_infantry_tech:0 "Супермутантські допоміжні війська"
super_mutant_aux_infantry_tech_desc:0 "Супермутанти сильніші та витриваліші за людей, не бояться хвороб чи радіації. Дозволити їм служити в нашій армії як допоміжні сили — це велика перевага."

ghoul_paratrooper_tech:0 "Ґуль-десантники"
ghoul_paratrooper_tech_desc:0 "Радіаційна стійкість ґулів дозволяє відправляти їх у найнебезпечніші місця, де звичайна піхота загинула б миттєво. Ідеальні для проникнення та диверсій."

super_mutant_nightkin_tech:0 "Найткіни"
super_mutant_nightkin_tech_desc:0 "Найткіни були елітними розвідниками Майстра, що використовували Стелс-Бої для маскування. Їх психіка нестабільна, але в бою вони як і раніше смертоносні."

plant_support_tech:0 "Мутовані рослини"
plant_support_tech_desc:0 "Гігантські мутовані рослини вороже ставляться до всього людського. Хоча вони небезпечні навіть для наших військ, їх можна посадити в критичних точках для захисту баз або блокування проходів."

knights_unlock_tech:0 "Лицарі Братства"
knights_unlock_tech_desc:0 "Лицарі — середній ранг у Братстві Сталі, що стоїть вище Ініціатів, але нижче Паладинів. Їх навчають бойовим діям і дозволяють використовувати силову броню в бою."

scribes_unlock_tech:0 "Польові писарі"
scribes_unlock_tech_desc:0 "Писарі — це науковці Братства Сталі. Хоча більшість працює в бункерах, деякі супроводжують місії для ремонту, досліджень та обслуговування зброї."

faerie_unlock_tech:0 "Феї"
faerie_unlock_tech_desc:0 ""

leshy_unlock_tech:0 "Жертви Лешому"
leshy_unlock_tech_desc:0 ""

gloria_robot_unlock_tech:0 "Утримання Залізної Дами"
gloria_robot_unlock_tech_desc:0 ""

leshy_baby_support_unlock_tech:0 "Нащадки Лешого"
leshy_baby_support_unlock_tech_desc:0 ""

# Faction Units
BAG_ghoul_paratrooper_tech:0 "Ґуль-рейнджери"
BAG_ghoul_paratrooper_tech_desc:0 "Радіаційна стійкість ґулів відкриває унікальні можливості для диверсій у заражених зонах, недоступних для людей."

#Tribal
pathfinders:0 "Слідопити"
pathfinders_desc:0 "Слідопити — це спеціально навчені розвідники та дослідники, яких ми посилаємо для картографування місцевості та прокладання маршрутів для наших воїнів."

clanfightingstyles:0 "Племінний стиль бою"
clanfightingstyles_desc:0 "Наші воїни розробили унікальний стиль бою, що відрізняє нас від інших племен пустки."

warriorcult:0 "Культ Воїна"
warriorcult_desc:0 "Війна — це стиль життя для нашого племені, і наших воїнів навчають битві з самого народження."

nomadsoul:0 "Кочові Воїни"
nomadsoul_desc:0 "Кочовий спосіб життя привчив наших воїнів до постійного руху, що робить для них безперервне просування на війні природним."

mansbestfriend:0 "Найкращий Друг Людини"
mansbestfriend_desc:0 "Наші бойові пси — не просто інструмент, а справжні супутники. Їхня вірність і відданість робить їх значно ефективнішими, ніж у інших народів."

noctwarriors:0 "Нічні Воїни"
noctwarriors_desc:0 "Нічні рейди — звична практика для нашого племені, що дозволяє бити ворога у найвразливіший момент — коли він спить."

tribalholyorg:0 "Бог у Печері"
tribalholyorg_desc:0 "Наші воїни фанатично вірні духам священних печер і без вагань виконують їхню волю."

sacredgifts:0 "Дарунки Землі"
sacredgifts_desc:0 "Поки розвинуті народи виснажують землю, ми навчилися з повагою обробляти її, підвищуючи врожайність із покоління в покоління."

outsiderways:0 "Уроки Чужинців"
outsiderways_desc:0 "Засвоївши деякі концепції ззовні — такі як траншеї та застави — ми зможемо значно краще захищати свої кордони."

tribalimmortals:0 "Безсмертні Воїни"
tribalimmortals_desc:0 "У старій книзі йшлося про «Безсмертних» — армію, де на місце кожного загиблого приходили двоє нових. Ми можемо використати цю ідею, щоб створити міф про власну безсмертну армію!"

tribalwarpaint:0 "Племінне Бойове Розфарбування"
tribalwarpaint_desc:0 "Бойовий розпис не лише лякає ворогів, а й надихає наших воїнів на хоробрість."

tribalnumbers:0 "Сила в Кількості"
tribalnumbers_desc:0 "Ми можемо компенсувати нестачу озброєння за рахунок масовості, кидаючи в бій більше людей, ніж ворог здатен витримати."

tribalsungods:0 "Боги Сонця"
tribalsungods_desc:0 "Наше плем’я вшановує богів сонця, і ця віра надає нам сил виживати в палючих пустелях, де інші лише гинуть."

tribalmountaingods:0 "Гори-Боги"
tribalmountaingods_desc:0 "Віра в Гірських Богів зігріває наших воїнів на засніжених вершинах і допомагає їм тренуватись для слави та честі."

#NCR
oldworldarmour:0 "Броня Старого Світу"
oldworldarmour_desc:0 "НКР базує свою уніформу на довоєнних зразках, використовуючи багатошарові тканини зі спрощеним варіантом балістичного волокна, яке легше виготовляти."

ncr_railway_construction:0 "Будівництво Залізниць"
ncr_railway_construction_desc:0 "НКР — чи не єдине місце, де ще збереглись знання і промисловість, необхідні для відновлення довоєнної залізничної інфраструктури."

EHT_ncr_railway_construction:0 "Будівельники Доріг"
EHT_ncr_railway_construction_desc:0 "Хоча Вісімдесятники відомі як Воїни Доріг, їхні завоювання були б неможливі без Будівельників. Це рідкісні й шановані майстри, які пожертвували славою заради того, щоб проложити шлях іншим."

#Vault City
mutant_supremacy:0 "Кроти-Мутанти Правитимуть Землею!"
mutant_supremacy_desc:0 ""

#Itza
itz_rough_terrian_training:0 "Тренування на Важкій Місцевості"
itz_rough_terrian_training_desc:0 "Наші спецпідрозділи проходять виснажливі тренування в дикій природі, щоб бути готовими до всіх викликів, які поставить перед ними пустка."

#Army of Mexico
jungle_spirits:0 "Дух Машин Джунглів"
jungle_spirits_desc:0 "Переобладнавши та загерметизувавши наших роботів, ми змогли усунути більшість проблем, що заважали їм ефективно діяти в тропіках і болотах."

jungle_tribal_integration_tech:0 "Інтеграція Джунглевих Племен"
jungle_tribal_integration_tech_desc:0 "У джунглях Центральної Америки живе безліч дрібних племен. Інтегруючи їх у нашу культуру, ми перейняли традиції майстерної зброярської справи та джунглевої війни."

ghoul_civilization:0 "Ґульська Цивілізація"
ghoul_civilization_desc:0 "Наш народ складається переважно з ґулів — довоєнних або післявоєнних. Ми побудували суспільство навколо істот, які не старіють і не бояться радіації."

#NCR
ncr_reorgranger_tech:0 "Реорганізація Рейнджерів"
ncr_reorgranger_tech_desc:0 "Договір з Рейнджерами 2271 року спричинив певний безлад у їхніх рядах, і знадобився час, щоб повністю інтегрувати їх до нашої армії."

ncr_rangercore_tech:0 "Корпус Рейнджерів"
ncr_rangercore_tech_desc:0 "Рейнджери інтегрувалися в нашу армію, привнісши десятиліття досвіду та тактики до наших спеціальних сил."

ncr_jim_drills:0 "Тренування Джима"
ncr_jim_drills_desc:0 "Інтегрування тактики загонів, штурмових дій у містах і стрілецької підготовки до наших навчань підвищить бойову готовність солдатів."

BAG_ncr_jim_drills:0 "Каліфорнійська Піхотна Тактика"
BAG_ncr_jim_drills_desc:0 "Інтегрування тактики загонів, штурмових дій у містах і стрілецької підготовки до наших навчань підвищить бойову готовність солдатів."

ncr_rangerlead_tech:0 "Провід Рейнджерів"
ncr_rangerlead_tech_desc:0 "Початкових рейнджерів тренували для рейдів попереду основного війська — для збору розвідданих і дезорганізації ворога. Нам варто наслідувати цей приклад."

ncr_rangercanopeners_tech:0 "Консервні Ножі Рейнджерів"
ncr_rangercanopeners_tech_desc:0 "Силова броня становить серйозну загрозу для звичайних спецпідрозділів, але ми розробили методи, що дозволяють рейнджерам розкривати ці 'консерви'."

ncr_seth:0 "Рейнджери Сета"
ncr_seth_desc:0 "Пустельні Рейнджери були засновані на ідеалах Свободи, Рівності та Добробуту. Віра в ці принципи змушує наших рейнджерів ніколи не здаватися в бою."

ncr_privatepolice:0 "Міліції Громадян"
ncr_privatepolice_desc:0 "У часи великої небезпеки кожен громадянин має бути готовим захищати свій дім. Ми повинні озброїти народ і підготувати його до боротьби."

bag_steelrangers:0 "Сталеві Рейнджери"
bag_steelrangers_desc:0 "Поєднуючи дві різні спеціалізації — колишніх рейнджерів і обладнання силової броні — ми створили 'Сталевих Рейнджерів'. Хоча рейнджери завжди покладались на дальній бій, а братство — на ближній і важке озброєння, ми віримо, що цей експеримент дасть свої плоди."
bag_steelrangers_tt:0 "§OВідкриття цієї технології змусить ваші спецпідрозділи використовувати силову броню. Вони використовуватимуть у 2 рази менше спорядження, ніж звичайні броньовані війська, але будуть дорожчими та витривалішими.§!"

ncr_shocktroopers_tech:0 "Штурмові Солдати"
ncr_shocktroopers_tech_desc:0 "На основі даних, захоплених після війни з Братством Сталі, республіка почала розгортання перших важких піхотинців."

#Legion
legion_centurions_tech:0 "Центуріони"
legion_centurions_tech_desc:0 "Центуріони — це високі чини в ієрархії Легіону, що довели свою силу в численних битвах. Вони ведуть за собою не наказом, а прикладом."

legion_warriors_of_mars_tech:0 "Воїни Марса"
legion_warriors_of_mars_tech_desc:0 "Культ Марса насолоджується руйнуванням у бою, закликаючи наших броньованих солдатів використовувати повну міць своїх обладунків у жорстокому ближньому бою."

legion_vexillarius_tech:0 "Вексиларії"
legion_vexillarius_tech_desc:0 "Вексиларії — прапороносці Легіону, які координують війська за допомогою знамен, як це було в давньому Римі."

ces_at_tech:0 "Майстерність Антитехніки"
ces_at_tech_desc:0 "Не всі воїни Легіону користуються мечами — багато ветеранів є одними з найвправніших стрільців Мохаве."

legion_frumentarii_officers_tech:0 "Офіцери Фрументаріїв"
legion_frumentarii_officers_tech_desc:0 "Фрументаріїв зазвичай посилають на таємні місії, але надання їм командних повноважень може посилити наші підривні операції."

legion_frumentarii_commandoes_tech:0 "Командос Фрументарії"
legion_frumentarii_commandoes_tech_desc:0 "Навчання фрументаріїв бою дозволить їм не тільки захищатися в разі провалу, але й координувати наші війська, базуючись на розвідданих, або ж нишком вдиратись у тили ворога."

ces_aurelius_mercenaries_tech:0 "Радники-Найманці"
ces_aurelius_mercenaries_tech_desc:0 "Кожен добрий полководець розуміє користь найманців — їхні нестандартні методи й технології можуть стати вирішальними на полі бою."

CES_horns_moroni_tech:0 "Роги Моронія"
CES_horns_moroni_tech_desc:0 "Легат Малпайс поєднав віру свого народу з традиціями Легіону, включно з пророцтвом про об'єднання всього людства під Богом."

BAG_CES_horns_moroni_tech:0 "Медики Апокаліпсису"
BAG_CES_horns_moroni_tech_desc:0 "Послідовники Апокаліпсису — одні з найкращих хірургів у пустці. Їхні методи та участь у польових шпиталях можуть врятувати безліч життів."

armored_chariots_tech:0 "Броньовані Колісниці"
armored_chariots_tech_desc:0 "Поліпшення броні наших нових колісниць дозволить нам ще впевненіше просуватись уперед без страху їхньої втрати."

CES_mercenary_training_tech:0 "Підготовка Найманців"
CES_mercenary_training_tech_desc:0 "Навіть наш знаменитий Легіон може чогось навчитись. Найманці з далеких земель поділяться своїми техніками — ми будемо готові до будь-якої битви."

ces_navajo_scouts_tech:0 "Розвідники Навахо"
ces_navajo_scouts_tech_desc:0 "Розвідники з Навахо можуть навчити наших фрументаріїв цінним навичкам і хитрощам."

ces_navajo_skin_walkers_tech:0 "Ходячі Шкури Навахо"
ces_navajo_skin_walkers_tech_desc:0 "Міфи Навахо говорять про ходячих шкур — істот, що приймають форму звірів. Новітні воїни імітують цих створінь — лютих і диких."

ces_two_tech:0 "Колісниці Легіону"
ces_two_tech_desc:0 "Найкращі машини Двох Сонць тепер служать славі Легіону."

phoenix_tech_desc:0 "Повстання у Феніксі показало Легіону небезпеку зради. Кожен легіонер має чітко розуміти, що станеться, якщо він зрадить волю Легіону."

legion_training_tech:0 "Хвильова Тактика Легіону"
legion_training_tech_desc:0 "Легіон по-справжньому виправдовує свою назву — ми виставляємо армії, які за чисельністю переважають навіть НКР. Безперервні хвилі атак дозволяють нашим воїнам тиснути на ворога без зупину."

#Reno
reno_mastersnewarmy:0 "Нова Армія Майстра"
reno_mastersnewarmy_desc:0 "Йдучи слідами Майстра, ми створимо найбільшу армію супермутантів, яку будь-коли бачила пустка!"

#Oregon
oregon_geckosupport:0 "Підтримка Геконами"
oregon_geckosupport_desc:0 "Гекони можуть бути загрозою в сільській місцевості, але насправді вони досить розумні, щоб їх приручити. Відправлення приручених геконів із нашими солдатами дасть їм бойову тварину — не гірше за пса, хоча іноді цей 'пес' дихає вогнем."

oregon_mesmetronfieldequipment:0 "Польові Месметрони"
oregon_mesmetronfieldequipment_desc:0 "«ПОБАЧ СВІТ НА СВІЙ ЛАД — з МЕСМЕТРОНОМ!»\nРозроблений Implied Hypnotics, Inc. та АРМІЄЮ СПОЛУЧЕНИХ ШТАТІВ, цей шедевр НЕЙРО-ВИРІВНЮВАННЯ не просто підкорює — він ПРОСВІТЛЮЄ.\nЗаливаючи мозок психо-резонансними гармонічними імпульсами, він приглушує хаос і відкриває розум для КРАЩОЇ перспективи: ВАШОЇ.\nДеякі побічні ефекти — як от феєрверки в голові чи тимчасова агресія — були виявлені під час випробувань, але більшість суб'єктів одразу продемонстрували зміну поведінки."

oregon_psyker_mental_stimulants:0 "Ментальні Стимулятори"
oregon_psyker_mental_stimulants_desc:0 "Ми почали давати спеціальні хімікати нашим спецпризначенцям, щоб посилити їхні психічні здібності в польових умовах."

oregon_psyker_nullification_training:0 "Навчання Придушення"
oregon_psyker_nullification_training_desc:0 "Псайкери досі мало вивчені, і деяким важко контролювати свої сили. Використання пристроїв придушення дозволить їм вибірково глушити свої здібності — тренуючи самоконтроль і уникаючи негативних побічних ефектів."

oregon_psyker_ancient_traditions:0 "Стародавні Традиції"
oregon_psyker_ancient_traditions_desc:0 "Контроль над розумом — це складно, тому деякі з наших псайкерів почали користуватися ритуалами та особистими предметами, щоб створювати талісмани для фокусування своїх сил."

#Settler
settler_caravanmilitia:0 "Караванні Міліції"
settler_caravanmilitia_desc:0 "Відправлення міліцій на регулярний супровід караванів допоможе їм здобути бойовий досвід у мирний час і забезпечити захист наших шляхів постачання."

#Raider
raider_reckless_aggression:0 "Безрозсудна Агресія"
raider_reckless_aggression_desc:0 "Рейдери живуть на межі смерті — постійно б'ючись за нову дозу чи видобуток. Самозбереження для них — це другорядне; головне — забрати своє будь-якою ціною."

#Lawkeepers
tbh_lawkeepers_tech_1:0 "Навчання Заступників"
tbh_lawkeepers_tech_1_desc:0 "Заступники — це охоронці порядку, призначені своїми старшими. Шерифи можуть наділити майже будь-кого повноваженнями заступника у час потреби, щоб допомогти підтримати порядок."

tbh_lawkeepers_tech_2:0 "Навчання Шерифів"
tbh_lawkeepers_tech_2_desc:0 "Шерифи — це обрані громадами охоронці порядку, зазвичай шляхом неформального голосування. Вони мають широкі повноваження й сумнівну підзвітність, але їхнє правосуддя зберігає сільські поселення в безпеці."

tbh_lawkeepers_tech_3:0 "Навчання Маршалів"
tbh_lawkeepers_tech_3_desc:0 "Маршал — найвища форма охоронця закону, з повноваженнями на великій території, обраний, як і шериф, громадою. Вони вирішують справи, занадто масштабні для одного поселення, і досвідчений маршал може не поступатися навіть пустельному рейнджеру."

#Colorado
ttm_healthy_warriors:0 "Здорові Воїни"
ttm_healthy_warriors_desc:0 "Не секрет, що людям у пустці важко підтримувати здоров’я — недоїдання, хвороби чи мутації. Справді здорова нація дасть нашим воїнам перевагу над хворобливими масами пустки."

ttm_call_of_the_wild:0 "Поклик Дикої Природи"
ttm_call_of_the_wild_desc:0 "Собаки — вірні й корисні союзники людей, але далеко не наймогутніші істоти пустки. Завдяки генетичній інженерії ми зробили їх сильнішими та витривалішими, щоб вони залишалися актуальними на сучасному полі бою."

ttm_jurassic_strength:0 "Юрська Сила"
ttm_jurassic_strength_desc:0 "ДНК приховує безліч таємниць, і змішування давніх зразків із сучасною людською генетикою було небезпечним — але породило людей, які за силою не поступаються супермутантам."

warden_doggos_tech:0 "Повна Інтеграція К-9"
warden_doggos_tech_desc:0 "У Денвері так багато собак, що кожен чоловік, жінка, дитина й робот можуть мати власного песика! Уявіть собі світ, де у кожного є свій кіберпес, який завжди поруч..."
warden_doggos_tech_tt:0 "\n§OВідкриття цієї технології змусить всі ваші Підтримуючі Роботи, Бойові Роботи, Правоохоронців, Моторизованих Правоохоронців, Спецпризначенців і Юніти у Силовій Броні вимагати додаткову броню та Собаче Обладнання, що зробить їх дорожчими, але потужнішими.§!"

warden_doggos_cost_idea:0 "Кінологічна Академія"
warden_doggos_cost_idea_desc:0 "Масове залучення собак до нашої армії значно підвищило ефективність військ, але вимагає кращої підготовки й координації. Відбір лише найрозумніших і найвідданіших собак стає критично важливим, щоб уникнути хаосу на полі бою."

whd_dragoon_tech:0 "Багряні Драгуни"
whd_dragoon_tech_desc:0 "Навчання наших спецпризначенців співпраці з автономними Силами Броні дозволить їм миттєво перемикатись між важкоозброєною кавалерією та легкою розвідкою."

whd_combined_arms_tech:0 "Доктрина Комбінованих Озброєнь"
whd_combined_arms_tech_desc:0 "Силова Броня — це чудово, але навіть звичайні танки можуть забезпечити броньовану підтримку нашим військам, якщо ті навчені діяти пліч-о-пліч із бронетехнікою!"

whd_ghoul_synergy_tech:0 "Синергія з Гулями"
whd_ghoul_synergy_tech_desc:0 "Скажені Гулі часто атакують усіх «гладкошкірих», але мають певну терпимість до своїх. Це може бути «неетично», але змішування підрозділів дозволить нашим гулям мати доволі багато тіл навколо для самопожертви — щоб захищати життя, які справді мають значення."

special_vintage:0 "Особливий Витриманий Напій"
special_vintage_desc:0 ""

#Utah
all_terrain_vehicles_tech:0 "Всюдиходи"
all_terrain_vehicles_tech_desc:0 "Старий Світ — це не лише покинуті дороги крізь пустелю. Є ще круті гірські стежки, непрохідні траси, і ми маємо бути готові до всього. Шиповані колеса та навчання позашляховій їзді — саме те, що треба."

#Khans Medical Techs
HEADER_KHANS_BUFFS:0 "Медичні Бонуси"

khan_field_medics_tech:0 "Польові Медики"
khan_field_medics_tech_desc:0 "Ніде швидкий доступ до медичної допомоги не має більшого значення, ніж на полі бою. Навчання людей польовій медицині та забезпечення відповідним спорядженням дозволить врятувати більше життів."

khan_antivenom:0 "Антитоксин"
khan_antivenom_desc:0 "Пустка сповнена отруйних істот і рейдерів, що використовують токсини. Виготовлення загальних протиотрут дозволить захистити наших людей від неминучої смерті від стріли або укусу скорпіона."

khan_radaway:0 "РадВей"
khan_radaway_desc:0 "Радіація — невидимий убивця, і навіть на вигляд безпечні зони можуть швидко виявитися смертельними. РадВей — справжнє диво-медикамент, здатний вивести радіацію швидше, ніж вона вб'є."

khan_fixer:0 "Фіксер"
khan_fixer_desc:0 "Більшість хімікатів мають небажані наслідки — залежність і ломку. Фіксер допомагає організму припинити симптоми та робить відмову від хімії значно легшою, або просто допомагає дожити до наступної дози."

khan_cateye:0 "Котяче Око"
khan_cateye_desc:0 "Темрява ночі приховує пастки й небезпеки. Хоча оптика — це добре, Котяче Око підсилює природний зір, даючи чітке уявлення про поле бою — наче у нічного хижака."

khan_mentats:0 "Ментати"
khan_mentats_desc:0 "Знання — це сила, і Ментати доводять це! Ці крейдяні таблетки дають людям додатковий інтелектуальний імпульс для вирішення проблем — у лабораторії чи в окопі."

khan_daddy_o:0 "Дедді-О"
khan_daddy_o_desc:0 "Рідкісний хімікат, що посилює фокусування до крайнощів, хоч і з побічним ефектом у вигляді гіперфіксації. Не зробить користувача популярним, але допоможе зламати термінал під шквальним вогнем."

khan_buffout:0 "Баффаут"
khan_buffout-desc:0 "Баффаут — це стероїд, що стимулює ріст м’язів і знімає обмеження на силу. Допоможе в рукопашному бою чи при розчищенні завалів. Якщо приймати розумно — навіть розвине постійну мускулатуру!"

#Block Tech Tech
