tribal_civilization:0 "Племінна Цивілізація"
tribal_civilization_desc:0 ""

settled_civilization:0 "Осіла Цивілізація"
settled_civilization_desc:0 ""

scientific_civilization:0 "Наукова Цивілізація"
scientific_civilization_desc:0 ""

general_atomics_unlock_tech:0 "Схеми General Atomics"
general_atomics_unlock_tech_desc:0 "General Atomics до війни інвестували в робототехніку, енергетику та побутову електроніку."

stent_security_solutions_unlock_tech:0 "Схеми Stent Security Solutions"
stent_security_solutions_unlock_tech_desc:0 "Stent Security Solutions був військовим підрядником, що спеціалізувався на балістичних і автоматичних озброєннях для армії США."

wattz_company_unlock_tech:0 "Схеми Wattzs Consumer Electronics"
wattz_company_unlock_tech_desc:0 "Wattz виробляли практично все, що працювало на електриці: від голострічок до лазерної зброї та енергетичних елементів."

handhtools_unlock_tech:0 "Схеми H & H Tools"
handhtools_unlock_tech_desc:0 "H&H Tools до війни вважалися найкращими на ринку, допомагаючи людям конкурувати з автоматизацією на заводах."

poseidon_unlock_tech:0 "Схеми Poseidon Energy"
poseidon_unlock_tech_desc:0 "Poseidon Energy була енергетичною компанією, що займалась дослідженнями у сфері енергетики, зброї, а також створила систему даних PoseidoNet."

lockreed_unlock_tech:0 "Схеми Lockreed"
lockreed_unlock_tech_desc:0 "Lockreed займались розробкою величезних пасажирських літаків для міжконтинентальних польотів у довоєнному світі."

arcjetsystems_unlock_tech:0 "Схеми ArcJet Systems"
arcjetsystems_unlock_tech_desc:0 "ArcJet Systems спеціалізувалися на космічних технологіях та далекому зв’язку для військових і цивільного ринку."

westtek_unlock_tech:0 "Схеми West-Tek"
westtek_unlock_tech_desc:0 "West Tek був найбільшим військовим підрядником до війни. Саме вони створили перші силові броні й розробили FEV — вірус, що породив супермутантів."

robco_unlock_tech:0 "RobCo Industries"
robco_unlock_tech_desc:0 "RobCo спеціалізувались на роботах, комп’ютерах цивільного та військового призначення, а також космічних технологіях через дочірню REPCONN."

mininuke_unlock_tech:0 "Міні-ядерні Боєприпаси"
mininuke_unlock_tech_desc:0 "З обережністю"

artillery_ammo_unlock_tech:0 "Артилерійські Снаряди"
artillery_ammo_unlock_tech_desc:0 "Артилерійські Снаряди"

railways_construction:0 "Будівництво Доріг"
railways_construction_desc:0 "Колись шосе з’єднували цілу країну. Тепер ми крокуємо лише по руїнах."

interwoven_support_tech:0 "Тісна Підтримка"
interwoven_support_tech_desc:0 ""

mountaineer_training_tech:0 "Гірська Підготовка"
mountaineer_training_tech_desc:0 "Наші війська мають багаторічний досвід ведення боїв на висотах."

skilled_medics_tech:0 "Талановиті Лікарі"
skilled_medics_tech_desc:0 ""

