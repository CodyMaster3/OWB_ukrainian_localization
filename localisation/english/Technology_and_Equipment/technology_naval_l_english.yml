nautics_tech_1:0 "Мореплавство"
nautics_tech_1_desc:0 "Якими б не були скарги екіпажу, весла – наразі найкращий спосіб пересування наших суден і забезпечення спроможності мати флот. Слід зробити акцент на фізичну витривалість при наборі, дисципліну й лояльність до командира. Бунтівників краще не призначати до весельного відділу – з очевидних причин."

nautics_tech_2:0 "Парусна Навігація"
nautics_tech_2_desc:0 "Наші веслувальники ясно дали зрозуміти, що надовго їх не вистачить. Виробництво тканин і такелажу треба пришвидшити. Вітрила допоможуть полегшити їхню працю, зменшити ймовірність бунтів і водночас заощадити боєприпаси."

nautics_tech_3:0 "Колесні Пропульсори"
nautics_tech_3_desc:0 "Парові двигуни з передачею, гребними колесами та захищеними котлами значно підвищать швидкість суден, бо ми більше не залежимо від стихій. Потрібно провести додаткове навчання з безпеки й тренування проти стресу, щоб екіпаж не лякався кожного разу, як корпус отримує удар біля машинного відділення."

nautics_tech_4:0 "Підводна Тяга"
nautics_tech_4_desc:0 "Ведуться дослідження щодо створення легких водостійких сплавів, що дозволить встановити вдосконалені системи підводної тяги. Пряма передача енергії від машинного відділення до гвинтів, парові силові блоки та більші пропелери дадуть нам тактичну та стратегічну перевагу."

nautics_tech_5:0 "Ядерний Гідрореактивний Рушій"
nautics_tech_5_desc:0 "Дослідження мініатюрної ядерної технології й реакторів для корабельного використання призвело до створення насосно-гвинтового рушія нового покоління. Швидкий натрієвий реактор із броньованим захистом – вершина морської енергетики."

waterproof_sealing_tech:0 "Гідроізоляція Корпусу"
waterproof_sealing_tech_desc:0 "Покращення техніки складання, додаткові перевірки, навчання верфей та використання смолоподібних речовин для покриття корпусу підвищить водостійкість і загальну міцність наших суден."

multi_deck_construction_tech:0 "Багатопалубна Конструкція"
multi_deck_construction_tech_desc:0 "Будівництво суден з кількома незалежними й броньованими палубами замість однієї зменшує ризик втрати цілісності конструкції. Посилений корпус і кілька перегородок підвищують стійкість."

outrigger_tech:0 "Аутрігери"
outrigger_tech_desc:0 "Стабілізуючі аутрігери можна встановити на більшості суден. Вони покращують маневреність у штормову погоду й зменшують віддачу при боковій стрільбі, знижуючи ризик перекидання."

proper_rigging_tech:0 "Квадратні Вітрила"
proper_rigging_tech_desc:0 "Перехід на квадратні вітрила, визнані найефективнішими аеродинамічно, дасть стратегічну мобільність. Вони складаються з кількох малих полотен на щоглі, які легше обслуговувати й які менше втрачають ефективність при пошкодженні."

metal_bows_tech_desc:0 "Аналіз боїв показав, що носова частина корабля часто стає мішенню. Посилення носа підвищить живучість кораблів, навіть при активному маневруванні на полі бою."

naval_manuals_tech:0 "Морські Посібники"
naval_manuals_tech_desc:0 "Детальні, але не безглуздо довгі інструкції допоможуть екіпажу швидко реагувати на проблеми. І, хоча нам подобається гумор автора, давайте приберемо пункт «Звинувачувати Анклав» як відповідь на критичну пробоїну."

naval_armor_reinforcement_tech:0 "Посилення Броні"
naval_armor_reinforcement_tech_desc:0 "Точки кріплення та зварні шви – слабкі місця в броні. Хоча ми не можемо створити монолітну конструкцію, посилення цих зон додатковими пластинами запобігає їх пробиттю при ударі."

naval_wonders_of_the_past_tech:0 "Чудеса Минулого"
naval_wonders_of_the_past_tech_desc:0 "Наші інженери розібрали довоєнний двигун з покинутого танкера й відтворили його. Ця технологія забезпечує виняткову потужність. Ми зможемо використовувати довоєнні гіганти та модернізувати інші кораблі."

naval_secondary_engines_tech:0 "Резервні Двигуни"
naval_secondary_engines_tech_desc:0 "Встановлення додаткових моторних відсіків у броньованих зонах збільшить потужність рушіїв, підвищить мобільність у разі пошкодження й подовжить термін служби основного двигуна."

naval_emergency_sealing_tech:0 "Аварійна Герметизація"
naval_emergency_sealing_tech_desc:0 "Прорив корпусу – смертельно небезпечна ситуація. Команди аварійного ремонту зможуть, навіть під водою, в гермокостюмах, із гіпербаричними зварювальними пристроями, герметизувати пробоїну прямо в затопленому відсіку."

naval_armour_tech_1:0 "Обробка Дерева"
naval_armour_tech_1_desc:0 "Щоб масово будувати дерев’яні кораблі, слід стандартизувати проєкти. Покриття корпусів антикорозійною фарбою та мідною обшивкою дозволить почати масове виробництво."

naval_armour_tech_2:0 "Виробництво Кованого Заліза"
naval_armour_tech_2_desc:0 "Методи виплавки кованого заліза можна використовувати для посилення корпусу дерев’яних кораблів. Комбінація залізної обшивки та мідної обкладки надає додатковий захист без значного збільшення маси."

naval_armour_tech_3:0 "Шарування Сталі"
naval_armour_tech_3_desc:0 "Масове виробництво сталевих корпусів вимагає розширення верфей. Але падіння вартості сталі й зростаюча ефективність роблять перехід на металеві водонепроникні корпуси доцільним."

naval_armour_tech_4:0 "Плавка Сплавів"
naval_armour_tech_4_desc:0 "Оснащення ливарень інструментами для виплавки сплавів дає нам матеріали, які підходять для військового бронювання – від легких екрануючих суден до броні передових лінійних кораблів."

naval_armour_tech_5:0 "Композиційна Броня"
naval_armour_tech_5_desc:0 "Використовуючи порошкову технологію виробництва, ми можемо значно знизити витрати на виготовлення броні й водночас мати великий вибір металів для композитних сплавів. Процеси розпилення дозволяють змішувати металевий порошок з іншими матеріалами – наприклад, вуглецем або кобальтом – і спресовувати під високим тиском для створення надміцних бронеплит."

naval_invasion_tech_1:0 "Штурмове Каное"
naval_invasion_tech_1_desc:0 "Каное – це наразі все, що ми можемо використати для морських атак. Та все ж, є способи спростити висадку десанту. Кулемет на носі забезпечить вогневе прикриття, а піднятий корпус і легке бронювання захистять від стрілецької зброї."

naval_invasion_tech_2:0 "Озброєні Десантні Судна"
naval_invasion_tech_2_desc:0 "Швидкі моторні човни, здатні перевозити взвод і оснащені носовим кулеметом із щитом, забезпечать блискавичну висадку. Їхня швидкість і маневреність разом з можливістю швартуватись просто на березі покращать ефективність морських операцій."

naval_invasion_tech_3:0 "Броньовані Транспортери"
naval_invasion_tech_3_desc:0 "Спеціалізовані десантні судна з носовими апарелями та бронею проти кулеметного вогню та уламків значно підвищать виживання під час висадки. Вогнева підтримка забезпечується двома турелями з автопушками позаду та мінометом із магазинним заряджанням у відкритій секції в кормі."

naval_invasion_tech_4:0 "Судна Вогневої Підтримки"
naval_invasion_tech_4_desc:0 "Вогнева підтримка – ключ до успіху при амфібійних операціях. Хоч наші транспортери добре справляються зі своїм завданням, нам потрібно ще більше. Переобладнання деяких у носії ракетних батарей, які одночасно накривають ворога залпом, зламає будь-яку оборону й відкриє шлях піхоті."

