l_english:
lanius_research_pact:0 "Друзі Ланія"
lanius_research_pact_desc:0 "У багатьох аспектах Ланій менш суворий, ніж Цезар, у співпраці з чужинцями."

legion_research_pact:0 "Друзі Цезаря"
legion_research_pact_desc:0 "Легіон значною мірою покладається на солдатів-рабів із племен Пустки, тому багато технологій походить із васальних держав. Проте ті, у свою чергу, користуються захистом Легіону. Однією з причин, чому Цезар терпить незалежність сусідів, є те, що §YРезервація§!, §YНавахо§! і §YДва Сонця§! можуть розвивати технології, які Легіон, теоретично, не повинен використовувати."

invite_to_rio_research_pact:0 "Запросити [FROM.GetName] до Ель Інстітуто Політехніко Мехікано"
rio_research_pact:0 "Ель Інстітуто Політехніко Мехікано"
rio_research_pact_desc:0 "Ель Інстітуто Політехніко Мехікано має на меті поширювати знання й технології серед усіх громадян Мексики."

timberline_research_pact:0 "Караванні Шляхи Лісового Рубежу"
timberline_research_pact_desc:0 "Мережа караванних маршрутів, яку підтримує Лісовий Рубіж, допомагає доставляти припаси нужденним по всьому Орегону."

rosado_research_pact:0 "Інститут Росадо в Ларедо"
rosado_research_pact_desc:0 "Президент Росадо створив інститут для обміну дослідженнями та відкриттями з Братством."

vault_city_research_pact:0 "Форум Ресурсів Пустки"
vault_city_research_pact_desc:0 "Місто-Сховище хоче надихнути народи Невади на краще майбутнє. Але це можливо лише у співпраці."

aradesh_project:0 "Програма Арадеша"
aradesh_project_desc:0 "НКР — найвеличніша сила добра в Пустці, символ того, чого ми можемо досягти разом. Об’єднаймо ресурси, щоб протистояти тиранії та гніту."

technology_sharing_group:0 "Інститут Науки й Промисловості"

followers_university:0 "Університет Послідовників"
followers_university_desc:0 "Фізично університет знаходиться в Боньярді, але справжній — у серцях і розумах усіх Послідовників. Там, де є людина, що прагне нести знання іншим, — там є й Університет."

osi_research_pact:0 "Управління Науки й Промисловості"
osi_research_pact_desc:0 "Передовий науковий підрозділ НКР, що спеціалізується на прикладних галузях — медицині, інженерії, біології."

cosi_research_pact:0 "Колорадське Управління Науки й Промисловості"
cosi_research_pact_desc:0 "Експедиція Беггерів за своєю суттю — наукова, тому знання зосереджено в одному місці. Їхні знання в галузях медицини, агрономії, біології й видобутку ресурсів не мають рівних."

wpg_research_pact:0 "Північне Сяйво"
wpg_research_pact_desc:0 "Що може протиставити Королівство такій надії?"

MTC_gabriel_institute:0 "Інститут Габріеля"
MTC_gabriel_institute_desc:0 "Інститут Габріеля — основа знань про корінну історію й культуру. Він також є маяком для найрозумніших умів, які прагнуть спільного наукового прогресу."

last_redoubt_research_pact:0 "Програма Обміну Учнів Усередині Стіни"
last_redoubt_research_pact_desc:0 "Новий проєкт Аннабелли — ПООУС. Обмін кваліфікованими робітниками між нашими країнами сприяє поширенню знань і спільному прогресу."

amgalan_research_pact:0 "Програма Обміну Послідовників"
amgalan_research_pact_desc:0 "Один із головних принципів Послідовників Апокаліпсису — «вільний обмін ідеями». Їхня інтеграція в нашу державу дозволяє нам безпосередньо користатися плодами їхніх знань."