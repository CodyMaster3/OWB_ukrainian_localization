support_weaponry:0 "Допоміжне Обладнання"
support_weaponry_desc:0 "Різні пристрої й інструменти, що використовуються для зв’язку з командуванням, постачання солдатів необхідним і виконання інших другорядних завдань."

fireteam_weaponry_tech:0 "Автоматична Зброя Відділення"
ballistic_fireteam_weaponry_tech_2:0 "Легкий Кулемет"
ballistic_fireteam_weaponry_tech_3:0 "Важкий Кулемет"
ballistic_fireteam_weaponry_tech_4:0 "Мініган"
energy_fireteam_weaponry_tech_2:0 "Важкий RCW"
energy_fireteam_weaponry_tech_3:0 "Гатлінг-Лазер"
energy_fireteam_weaponry_tech_4:0 "Тесла-Гармата"
demolitions_weaponry_tech:0 "Динаміт"
