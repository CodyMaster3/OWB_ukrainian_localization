flamer_demolitions_weaponry_tech_3:0 "Інсинератор"
flamer_demolitions_weaponry_tech_4:0 "Важкий Інсинератор"
explosive_demolitions_weaponry_tech_2:0 "Осколкові Гранати"
explosive_demolitions_weaponry_tech_3:0 "Гранатомет"
explosive_demolitions_weaponry_tech_4:0 "Гранатометна Гармата"

# Унікальне
fireteam_elite_weaponry_tech:0 "Плечовий Кулемет"
demolitions_elite_weaponry_tech:0 "Ракетниця Red Glare"

ballistic_fireteam_high_caliber_tech:0 "Боєприпаси Великого Калібру"
ballistic_fireteam_high_caliber_tech_desc:0 "Оснащення наших кулеметів великим калібром робить їх більш універсальними проти різних цілей. Змішані стрічки та кращі заряди дозволяють легко прорізати піхоту та завдавати шкоди легкій броні та укриттям.\n\n"

ballistic_fireteam_low_caliber_tech:0 "Боєприпаси Малого Калібру"
ballistic_fireteam_low_caliber_tech_desc:0 "Фокусування на проміжних набоях спрощує виробництво та підвищує ефективність проти м’яких цілей. Полегшені набої, довші стрічки та слабші заряди підвищують скорострільність і дозволяють вести щільний вогонь.\n\n"

ballistic_fireteam_cooling_jacket_tech:0 "Полегшена Охолоджуюча Оболонка"
ballistic_fireteam_cooling_jacket_tech_desc:0 "Полегшена оболонка з охолоджувальною оливою зменшує нагрівання зброї та продовжує термін служби ствола, скорочуючи час на обслуговування."

ballistic_fireteam_tri_barrel_tech:0 "Три Стволи"
ballistic_fireteam_tri_barrel_tech_desc:0 "Модифікація мініганів із трьома довгими стволами та спрощеною системою подачі забезпечує високу точність, дозволяючи вести точний вогонь навіть по броні.\n\n"

ballistic_fireteam_hepta_barrel_tech:0 "Сім Стволів"
ballistic_fireteam_hepta_barrel_tech_desc:0 "Більша кількість коротших стволів дозволяє збільшити темп вогню. Наші кулеметники зможуть перетворювати цілі сектори на суцільне поле смерті.\n\n"

energy_fireteam_focus_lens_tech:0 "Удосконалені Фокус-Лінзи"
energy_fireteam_focus_lens_tech_desc:0 "Покращені фокус-лінзи дозволяють створювати потужніші лазери при тій же енергії, збільшуючи точність, шкоду та бронебійність без зміни елементів живлення.\n\n"

energy_fireteam_heat_lens_tech:0 "Жаростійкі Лінзи"
energy_fireteam_heat_lens_tech_desc:0 "Товстіші та стійкіші до температури лінзи дозволяють витримувати вищі навантаження. Це дає змогу вести щільніші черги та зменшує ризик поломок.\n\n"

energy_fireteam_cooling_jacket_tech:0 "Азотне Охолодження"
energy_fireteam_cooling_jacket_tech_desc:0 "Спеціальні мініатюрні системи охолодження з використанням рідкого азоту значно знижують перегрів і покращують надійність лазерної зброї."

energy_fireteam_rapid_charge_tech:0 "Швидкорозрядні Елементи"
energy_fireteam_rapid_charge_tech_desc:0 "Передова система заряджання з елементами, що мають окремі схеми спуску, забезпечує рекордну швидкість вогню. Ворог гине ще до того, як почує звук лазерного залпу.\n\n"

energy_fireteam_over_charge_tech:0 "Перезаряджені Елементи"
energy_fireteam_over_charge_tech_desc:0 "Перезарядка важких елементів дозволяє нам пробивати навіть найміцнішу броню. Це і шквал пострілів, і суцільний лазерний промінь – вибір за нами.\n\n"

flamer_demolitions_high_pressure_tech:0 "Високий Тиск"
flamer_demolitions_high_pressure_tech_desc:0 "Покращені баки й система розпилення збільшують дальність і силу полум’я. Це дозволяє атакувати укріплення з безпечної відстані.\n\n"

flamer_demolitions_sustained_pressure_tech:0 "Стабільний Тиск"
flamer_demolitions_sustained_pressure_tech_desc:0 "Додатковий тисковий бак і нові клапани дозволяють підтримувати стабільний струмінь. Це забезпечує ефективну підтримку вогнем у тривалих боях.\n\n"

flamer_demolitions_cooling_jacket_tech:0 "Охолоджувальна Оболонка"
flamer_demolitions_cooling_jacket_tech_desc:0 "Полегшені компоненти дозволили встановити термостійку оболонку з азотним гелем, яка захищає від перегріву й дозволяє точніший контроль подачі палива."

flamer_demolitions_temperature_focus_tech:0 "Надвисокотемпературне Полум’я"
flamer_demolitions_temperature_focus_tech_desc:0 "Змішування термітних частинок із пальним створює пекельне полум’я, здатне розплавити навіть важку броню. Ефективно, але моторошно.\n\n"

flamer_demolitions_longevity_focus_tech:0 "Довготривале Полум’я"
flamer_demolitions_longevity_focus_tech_desc:0 "Новий гелеподібний склад пального горить довго – навіть під водою. Навіть крапля на тканині може спричинити пожежу.\n\n"

explosive_demolitions_operational_security_tech:0 "Оперативна Безпека"
explosive_demolitions_operational_security_tech_desc:0 "Щоб не підірватися на власній міні, сапери проходять додаткове навчання. Зброя транспортується у броньованих контейнерах, а запобіжники захищають від випадкового детонування.\n\n"

explosive_demolitions_volatility_tech:0 "Нестабільні Вибухівки"
explosive_demolitions_volatility_tech_desc:0 "Кращі оборонні гранати з тонкостінними сплавовими оболонками та внутрішньою фрагментаційною матрицею дозволяють розмістити більше вибухівки, збільшуючи швидкість уламків і потужність детонації."

explosive_demolitions_propulsion_charge_tech:0 "Поліпшені Заряди Виштовхування"
explosive_demolitions_propulsion_charge_tech_desc:0 "Більш ефективний порох у подовжених корпусах гранат разом із м’яким прикладом підвищує точність і початкову швидкість. Завдяки цьому сапери можуть кидати заряди точніше й ближче до цілі."

explosive_demolitions_cyclic_fire_tech:0 "Циклічний Вогонь"
explosive_demolitions_cyclic_fire_tech_desc:0 "Безперервна злива вибухів змусить навіть найхоробріших триматися подалі від цього шквалу шрапнелі."

explosive_demolitions_rapid_fire_tech:0 "Черговий Вогонь"
explosive_demolitions_rapid_fire_tech_desc:0 "Швидке перевантаження ворога потоками вибухів розіб’є навіть найміцніші лінії оборони."

anti_tank_equipment_tech_1:0 "Протитанкові Гвинтівки"
anti_tank_tech_1:0 "Сфокусований Вогонь"
anti_tank_tech_1_desc:0 "Координування наших ПТ-команд для обстрілу бронетехніки з різних напрямків перевантажує захист ворога і прискорює її знищення."

anti_tank_equipment_tech_2:0 "Ракетні Гармати"
anti_tank_equipment_tech_2_desc:0 "Ракетна установка запускає некеровану ракету з формованим зарядом – ефективна проти бронетехніки завдяки потужному пробивному боєприпасу."

anti_tank_tech_2:0 "Ураження Вразливих Зон"
anti_tank_tech_2_desc:0 "Краща бронебійна зброя, підвищена швидкість польоту та оптика дозволяють точно бити у слабкі місця. Додаткове навчання з розвідки й розпізнавання техніки дає змогу нашим бійцям знаходити вразливості за секунди."

anti_tank_equipment_tech_3:0 "Керовані Ракетні Комплекси"

aa_fireteam_equipment_tech:0 "ЗРК Обладнання Т1"
aa_fireteam_equipment_tech_desc:0 ""

aa_fireteam_tech:0 "Снаряди з Близьким Підривом"
aa_fireteam_tech_desc:0 "Снаряд із дистанційним підривом вибухає, коли до цілі залишається задана відстань – особливо корисно проти повітряних цілей."

aa_fireteam_equipment_tech_2:0 "ЗРК Обладнання Т2"
aa_fireteam_equipment_tech_2_desc:0 ""

aa_fireteam_tech_2:0 "Керовані Боєприпаси"
aa_fireteam_tech_2_desc:0 "Новітні ракети з системами наведення, оснащені нашими технологіями, підвищують точність та ефективність, особливо проти повітряних цілей."

maintenance_company_tech_1:0 "Ремонтні Частини"
maintenance_company_tech_1_desc:0 "Інженерні підрозділи можуть значно ефективніше обслуговувати наше спорядження. Більше витратних матеріалів і запасних частин – менше навантаження на виробництво."

maintenance_company_tech_2:0 "Ефективність Обслуговування II"
maintenance_company_tech_2_desc:0 "Підвищення статусу ремонтників дозволяє їм змушувати піхоту до регулярних перевірок спорядження. Кожен солдат повинен вміти розбирати та чистити власну зброю."

maintenance_company_tech_3:0 "Ефективність Обслуговування III"
maintenance_company_tech_3_desc:0 "Краща інфраструктура з фільтрацією повітря дозволяє технікам працювати над електронікою та живленням прямо в польових умовах."

maintenance_company_tech_4:0 "Ефективність Обслуговування IV"
maintenance_company_tech_4_desc:0 "Детальні креслення та інтенсивне навчання дозволяють інженерам обслуговувати навіть транспорт і роботів без стаціонарних майстерень."

maintenance_company_tech_5:0 "Ефективність Обслуговування V"
maintenance_company_tech_5_desc:0 "Ремонтні навички передаються солдатам – це знижує навантаження на інженерів і підвищує довговічність спорядження."

maintenance_company_tech_6:0 "Ефективність Обслуговування VI"
maintenance_company_tech_6_desc:0 "AR-окуляри та діагностичні комп’ютери дають змогу точно визначити несправності та інструктаж у режимі реального часу – мінімізуючи ризик помилок."

logistics_company_tech_1:0 "Логістичні Частини"
logistics_company_tech_1_desc:0 "Ці підрозділи централізують постачання, звільняючи війська від транспортування спорядження та знижуючи втрати."

logistics_company_tech_2:0 "Логістика II"
logistics_company_tech_2_desc:0 "Дозвіл на пріоритетне постачання й власні транспортні загони забезпечує ефективне поповнення ресурсів без бюрократії."

logistics_company_tech_3:0 "Логістика III"
logistics_company_tech_3_desc:0 "Моторизовані частини з посиленими вантажівками можуть перевозити більше спорядження у важкопрохідні райони фронту."

logistics_company_tech_4:0 "Логістика IV"
logistics_company_tech_4_desc:0 "Броньовані контейнери з амуніцією вздовж лінії фронту забезпечують швидкий доступ до запасів навіть під вогнем."

logistics_company_tech_5:0 "Логістика V"
logistics_company_tech_5_desc:0 "Партизанське навчання та заміна колісних вантажівок на гусеничну техніку дають змогу маскувати склади та забезпечувати боєздатність навіть під час відступу."

logistics_company_tech_6:0 "Логістика VI"
logistics_company_tech_6_desc:0 "Антигравітаційні платформи дозволяють техніці долати руїни з більшим навантаженням, а розумні міни не дадуть ворогові скористатися нашими сховками."

recon_company_tech_1:0 "Розвідчастини"
recon_company_tech_1_desc:0 "Легка розвідка на велосипедах дозволяє збирати інформацію про ворога швидко й точно."

recon_company_tech_2:0 "Розвідка II"
recon_company_tech_2_desc:0 "Краще фізпідготовка, важчі пістолети, телескопи та виживальні набори – усе для кращої автономності розвідників."

recon_company_tech_3:0 "Розвідка III"
recon_company_tech_3_desc:0 "Приціли та рації дозволяють швидше передавати інформацію. ПП й легка броня підвищують шанси на виживання."

recon_company_tech_4:0 "Розвідка IV"
recon_company_tech_4_desc:0 "Мотоцикли з приглушенням двигуна та карабіни дозволяють швидко проникати за лінію ворога."

recon_company_tech_5:0 "Розвідка V"
recon_company_tech_5_desc:0 "Виживальні тренування, ближній бій і стрільба на ходу перетворюють розвідку на ударну силу."

recon_company_tech_6:0 "Розвідка VI"
recon_company_tech_6_desc:0 "Антиграв-мотоцикли, камери шоломів і передача в реальному часі дозволяють бачити ворога ще до того, як його помітить око."

med_company_tech_1:0 "Лікувальний Порошок"
med_company_tech_1_desc:0 "Поєднання висушеної квітки броку з подрібненим коренем ксандера дає смердючу, але дієву примітивну лікувальну речовину. Вона затьмарює розум і викликає зорові викривлення, проте ефективно загоює рани."

med_company_tech_2:0 "Очищена Суміш"
med_company_tech_2_desc:0 "Досвід і дослідження дозволили нам покращити пропорції квітки броку й кореня ксандера, а також зменшити розмір частинок, збільшуючи їхню реактивність і швидкість розчинення."

med_company_tech_3:0 "Стімпак"
med_company_tech_3_desc:0 "Розчиняючи суміш у фізіологічному розчині й вводячи її внутрішньовенно, ми значно підвищили швидкість дії препарату. Побічні ефекти, пов’язані з усним прийомом, зникли. Хоча це й знижує сміливість, результатом є більше вмінь – і більше врятованих життів."

med_company_tech_4:0 "Автоін’єктори"
med_company_tech_4_desc:0 "Формула вже довершена, тому наступним кроком є вдосконалення доставки. Автоматичні ін’єктори в броні солдата дозволяють не зупинятися і не замислюватися, коли потрібно наступну дозу – система зробить усе сама."

med_company_tech_5:0 "Med-X"
med_company_tech_5_desc:0 "Med-X – це потужний опіоїд, що діє на рецептори болю в мозку та нервовій системі, зменшуючи як фізичне відчуття болю, так і емоційну реакцію на нього. Ін’єкційний знеболювальний засіб."

med_company_tech_6:0 "Домашній Набір Лікаря"
med_company_tech_6_desc:0 "Усе необхідне, аби лікар зміг надати допомогу навіть при тяжких пораненнях безпосередньо в полі. Можливо, з таким набором солдати нарешті почнуть виживати після вогнепальних поранень."

dog_equipment_tech_1:0 "Дресирований Мутант-Пес"

dog_tech_1:0 "Програми Дресирування"
dog_tech_1_desc:0 "Додаткові тренування націлені на підвищення автономності собак на полі бою. Вони зможуть діяти без прямого нагляду господаря, що знижує ризики та робить їх ефективними в антиповстанських операціях."

dog_equipment_tech_2:0 "Навчений Пес"

dog_tech_2:0 "Військова Підготовка"
dog_tech_2_desc:0 "Розширене навчання дозволяє псам розпізнавати звуки порожнього магазину чи лазерного осередка та атакувати в критичний момент. Такі собаки можуть змінити хід бою в сутичках і рейдах."

dog_equipment_tech_3:0 "Кіберпес"

dog_tech_3:0 "Кібернетичні Модифікації"
dog_tech_3_desc:0 "Наші пси отримують штучні лапи для швидкості, сталеві зуби для сили атаки та легку броню для захисту життєво важливих органів. Ефективні проти живої сили, вони менше гинуть у бою."

railway_gun_unlock_tech:0 "Облогові Машини з Браменами"
railway_gun_unlock_tech_desc:0 "Із брухту можна створити різноманітну далекобійну техніку для руйнування укріплень: гармати, катапульти, баллісти, хвачі, требушети тощо. Брамени тягнуть усе це добро, але перед стрільбою зброю треба збирати наново."

railway_gun_tech_2:0 "Похідний Міномет"
railway_gun_tech_2_desc:0 "Ковані металеві стволи для обстрілу траншей та укріплень, що стріляють на велику відстань. Збираються з модульних частин, які транспортуються на возах."

railway_gun_tech_3:0 "Польова Гаубиця"
railway_gun_tech_3_desc:0 "Відновлена довоєнна артилерія з великою дальністю та кутом підйому. Може завдавати нищівних ударів по ворожих позиціях, а надійні колеса дозволяють швидше змінювати позицію порівняно з попередніми зразками."