l_english:
#----------------------------
# Заголовки/Доктрини
#----------------------------
AUTOMATED_WARFARE_DOCTRINE_LABEL:0 "Автоматизована війна"
AUTOMATED_WARFARE_DOCTRINE_DESC:0 "Світ загинув не через машини – він загинув через людину. Роботи б’ються швидше, довше й краще за звичайних солдатів. І головне – у них немає совісті."

ELITE_ARMY_DOCTRINE_LABEL:0 "Вишукана війна"
ELITE_ARMY_DOCTRINE_DESC:0 "Старий світ не загинув через погану тактику – він згорів у ядерному вогні, бо не зміг ефективно її застосувати."

GRAND_ARMY_DOCTRINE_LABEL:0 "Звичайна війна"
GRAND_ARMY_DOCTRINE_DESC:0 "Нам не потрібні машини, супертехнології чи роботи. Люди з гвинтівками й дисципліною в серці принесуть нам перемогу."

TERROR_TACTICS_DOCTRINE_LABEL:0 "Асиметрична війна"
TERROR_TACTICS_DOCTRINE_DESC:0 "Ми не зможемо зрівнятись із технологіями чи промисловістю ворога. Але нам це й не потрібно. Терор, партизанщина й масові атаки принесуть перемогу."

HEADER_OUTSIDER_DOCTRINE:0 "Війна із вигнання"
OUTSIDER_DOCTRINE_DESC:0 "Вигнані із суспільства, змушені самі кувати долю. Але водночас – вільні від усіх обмежень."

HEADER_DECISIVE_AIR_DOCTRINE:0 "Рішучі дії в небі"
HEADER_DECISIVE_AIR_DOCTRINE_DESCRIPTION:0 "У нас є креслення, заводи й пілоти. Утримувати флот важко – але й не потрібно, якщо §tрозчавити ворогів§! раніше, ніж з’являться тріщини."

HEADER_PRAGMATIC_AIR_DOCTRINE:0 "Прагматичне небо"
HEADER_PRAGMATIC_AIR_DOCTRINE_DESCRIPTION:0 "Навіть найдешевший літак – велика інвестиція. Бо §3саморобні ядерні двигуни§! – справа не з легких."

HEADER_DISRUPTION_AIR_DOCTRINE:0 "Вишукана дестабілізація"
HEADER_DISRUPTION_AIR_DOCTRINE_DESCRIPTION:0 "Вогонь падає з неба – але ми не зрівняємось із ворогом один на один. То й не будемо. Є чимало інших способів §7зрівняти шанси§!."

HEADER_NAVY_DOCTRINE:0 "Морська війна"
NAVY_DOCTRINE_DESC:0 "Найбільша імперія в історії правила не лише на суші. Вона правила на морі."

#----------------------------
# Перки/Тактики
#----------------------------
HEADER_INFANTRY_FOCUS:0 "Переваги піхоти"
HEADER_SPECIAL_FORCES_FOCUS:0 "Переваги спецпідрозділів"
HEADER_ROBOT_FOCUS:0 "Переваги роботів"
HEADER_VEHICLE_FOCUS:0 "Переваги техніки"
HEADER_MUTANT_FOCUS:0 "Переваги мутантів"
HEADER_CREATURE_FOCUS:0 "Переваги істот"
HEADER_COMBAT_TACTICS:0 "Школа тактики"

#----------------------------
# Підзаголовки/гілки доктрин
#----------------------------
AUTOMATED_WARFARE_LABEL:0 "Кількість"
AUTOMATED_WARFARE_LABEL_TT:0 "Якість відступає перед кількістю – масові атаки роботів у пріоритеті."

AUTOMATED_WARFARE_LABEL_1:0 "Якість"
AUTOMATED_WARFARE_LABEL_1_TT:0 "У фокусі – ефективність бою: краще використання обмежених ресурсів."

AUTOMATED_WARFARE_LABEL_2:0 "Автономія Пустки"
AUTOMATED_WARFARE_LABEL_2_TT:0 "Автономні роботи, що ремонтують себе й інших, – ключ до перемоги."

AUTOMATED_WARFARE_LABEL_3:0 "Пряме управління"
AUTOMATED_WARFARE_LABEL_3_TT:0 "Повний контроль над роботами гарантує перемогу."

ELITE_ARMY_LABEL:0 "Маневреність"
ELITE_ARMY_LABEL_TT:0 "Маневрена армія потребує дисципліни, але отримує перевагу в більшості боїв."

ELITE_ARMY_LABEL_1:0 "Гнучке\n командування"
ELITE_ARMY_LABEL_1_TT:0 "Щільна інтеграція підтримки з лінією фронту та гнучкість командування роблять наші війська ефективнішими."

ELITE_ARMY_LABEL_2:0 "Чистота"
ELITE_ARMY_LABEL_2_TT:0 "Радикалізація віри в нашій армії дозволить застосовувати жорсткі тактики без страху повстання."

ELITE_ARMY_LABEL_3:0 "Принцип"
ELITE_ARMY_LABEL_3_TT:0 "Старий світ загинув через корупцію. Ми – інші. Технології небезпечні – й ми не дозволимо їм знову знищити світ."

GRAND_ARMY_LABEL:0 "Механізована війна"
GRAND_ARMY_LABEL_TT:0 "Техніка – це вогнева міць, мобільність і захист. Ми використаємо все це."

GRAND_ARMY_LABEL_1:0 "Піхотна війна"
GRAND_ARMY_LABEL_1_TT:0 "Піхота може перемогти будь-кого. Дисципліна й злагодженість зроблять її найкращою армією в Америці."

TERROR_TACTICS_LABEL:0 "Давні методи"
TERROR_TACTICS_LABEL_TT:0 "Ми вивчаємо тактики імперій минулого, щоб не повторити їхніх помилок."

TERROR_TACTICS_LABEL_1:0 "Тактика Пустки"
TERROR_TACTICS_LABEL_1_TT:0 "У тварин Пустки багато чого можна навчитися. Їхня дикість стане нашою силою."

doctrine_lock_effect_tt:0 "\n§RЦя доктрина закриває можливість змінити напрям у майбутньому.§!"
 #----------------------------
 # Localisation Tech Doctrine Elite Forces
 #----------------------------
elite_army:0 "Витончена війна"
elite_army_desc:0 "Обмежені людські ресурси та дороговартісне обладнання вимагають обережних дій. Ми маємо знати, кого використати, коли використати, і як вчасно відступити – це і є ключ до нашого успіху.\n\n"

concentration_of_force:0 "Концентрація сили"
concentration_of_force_desc:0 "Обмеження у ресурсах та людях означає, що кожна атака має бути обдуманою. Ми не можемо дозволити собі легковажити. Ми повинні бити потужно, разом, і не залишати ворогові жодного шансу на виживання."

speed_of_movement:0 "Швидке розгортання"
speed_of_movement_desc:0 "Просто створити сили швидкого реагування недостатньо – усі наші війська мають діяти як єдине швидке з'єднання. Ми тренуватимемо кожного солдата, поки він не стане елітою – здатною зібратись, переміститись і вступити в бій миттєво.\n\n"

integrated_support_doctrine:0 "Інтегрована підтримка"
integrated_support_doctrine_desc:0 "Об’єднання підтримуючих підрозділів із бойовими частинами дозволить нам ефективніше використовувати їхнє спорядження, відкривши нові тактичні можливості, що вимагають тісної співпраці між командами.\n\n"

adaptive_chain_of_command:0 "Гнучке командування"
adaptive_chain_of_command_desc:0 "Попри всі зусилля, люди гинуть. Якщо командир загине, його загін повинен бути здатен миттєво зорієнтуватися, обрати нового лідера і продовжити бій."

walking_fire:0 "Вогонь на ходу"
walking_fire_desc:0 "Наші війська мають не лише швидко розгортатись, а й влучно стріляти в русі. Кулеметники мають переміщатися між вогневими точками під час наступу основних сил.\n\n"

hit_and_run:0 "Удар і відступ"
hit_and_run_desc:0 "У нас не завжди вистачає сил для повномасштабних атак – навіть невеликих. Тому ми атакуємо інакше: вдаряємо там, де ворог найслабший, і відходимо до того, як він встигне відповісти."

walking_tanks:0 "Ходячі танки"
walking_tanks_desc:0 "Силова броня – одне з найбільших досягнень до Великої Війни, а у постапокаліпсисі вона ще корисніша. Але за потужність доводиться платити тривалим і дорогим навчанням."

non_discriminatory_targeting:0 "Без вибору цілей"
non_discriminatory_targeting_desc:0 "Наші вороги обмежені своєю «мораллю», і це робить їх вразливими. Жодна людина не буде в безпеці, жодне поселення не залишиться неушкодженим. Ми зробимо все, аби знищити ворогів усього, що ми будуємо.\n\n"

airborne_assaults:0 "Повітряні штурми"
airborne_assaults_desc:0 "Пустельники забули страх перед небом. Але ми змусимо їх згадати – звук «Вертіптака» над головою означає смерть. І кожен, хто побачить, як з нього висаджуються наші солдати, зрозуміє це занадто пізно."

scorched_earth:0 "Випалена земля"
scorched_earth_desc:0 "Що мають наші вороги, окрім кволих хатин у диких поселеннях? Вони нам не потрібні. Ми спалимо їхні домівки, зруйнуємо їхні життя і засолимо кожен клаптик землі, яку вони обробляли."

shock_and_awe_doctrine:0 "Шок і трепет"
shock_and_awe_doctrine_desc:0 "Жаль і милосердя нам не знайомі. Наші війська не мають часу розбиратись – якщо щось рухається, воно помре. Поки їхні діти й дружини стікають кров’ю, ворог вже не здатен чинити опір."

recon_in_depth:0 "Глибинна розвідка"
recon_in_depth_desc:0 "Патрулювати тільки свою землю – недостатньо. Ми маємо охопити всю пустку, знаходити технології і не дозволяти дурням до них доторкатись. Наш вплив сягне так далеко, що інформація про ворога сама впаде нам до рук.\n\n"

warrior_code_doctrine:0 "Кодекс воїна"
warrior_code_doctrine_desc:0 "Ми відкинули Старий Світ, бо він відкинув нас. Наука переступила межу, якої не слід було. Ми зобов’язані стежити, щоб такі жахи більше не повторилися – ніколи."

combined_arms_doctrine:0 "Змішані війська"
combined_arms_doctrine_desc:0 "Силова броня – це не абсолютна перевага. Вона може бути вразливою без підтримки. Тому ми об'єднаємо броньованих солдатів з піхотою, створивши загони, які використовують сильні сторони обох."

brigades_of_steel:0 "Чемпіони доблесті"
brigades_of_steel_desc:0 "Силова броня – не просто обладнання, це символ. Для піхотинця її присутність – надія. Він знає: ці воїни стоятимуть до останнього, аби дати йому шанс на втечу."

#----------------------------
# Локалізація Технологічної Доктрини "Автоматизоване Військове Мистецтво"
#----------------------------
automated_warfare:0 "Автоматизоване Військове Мистецтво"
automated_warfare_desc:0 "Автоматизоване Військове Мистецтво зосереджене на тому, щоб посилати у бій машини, а не людей. Люди – крихкі, роботи – ні.\n\n"
combat_protocols:0 "Прошивка Людської Ідентифікації"
combat_protocols_desc:0 "Попри те, що роботи значно витриваліші за людей у бою, вони не здатні інстинктивно розпізнавати друга від ворога. Додавання вдосконаленої системи наведення зробить наших роботів ще смертоноснішими."
advanced_combat_protocols:0 "Інтеграція Динамічної Тактики"
advanced_combat_protocols_desc:0 "Роботи, здатні ефективно штурмувати ворожі позиції – це добре, але цього недостатньо. Наступним кроком стане впровадження тактики малих підрозділів у їхні дії та координація з іншими формуваннями."
automated_distribution:0 "Автоматизоване Постачання"
automated_distribution_desc:0 "У звичайних умовах підтримання постачання на великих відстанях складне, але використання роботів у ланцюгах логістики гарантує своєчасну доставку ресурсів.\n\n"
rushed_production:0 "Прискорене Виробництво"
rushed_production_desc:0 "Наші підрозділи мають якнайшвидше потрапити на фронт. Щоб підтримувати постійний наступ, ми змушені пожертвувати якістю на користь швидкості збирання."
self_replicating_machinery:0 "Самовідтворювальні Механізми"
self_replicating_machinery_desc:0 "Просто виробляти роботів на заводах – цього замало. Наші війська повинні мати змогу збирати ресурси, переобладнувати ворожу техніку та розбирати будівлі для створення своїх копій."
advanced_cnc_focus_doctrine:0 "Роботизовані Командні Проксі"
advanced_cnc_focus_doctrine_desc:0 "Завдяки універсальним інформаційним мережам, командири-роботи можуть миттєво обмінюватися даними зі своїми підрозділами. Підтримувальні роти роботів також сприятимуть кращій організації."
advanced_cnc_focus_doctrine_2:0 "Інформаційні Ретранслятори"
advanced_cnc_focus_doctrine_2_desc:0 "Призначивши роботів вузлами передачі даних, ми ще більше підвищимо ефективність та злагодженість наших військ."
cnc_2_unlock_tech_tooltip:0 "\n§GЦя доктрина дозволяє оснащувати дивізії другим підрозділом CnC-роботів!§!\n"
advanced_cnc_focus_doctrine_3:0 "Надійна Мережа"
advanced_cnc_focus_doctrine_3_desc:0 "Наша мережа тепер дозволяє миттєво передавати дані з одного кінця поля бою на інший. Завдяки надвисокому рівню організації ми стаємо по-справжньому грізною силою."
cnc_3_unlock_tech_tooltip:0 "\n§GЦя доктрина дозволяє оснащувати дивізії третім підрозділом CnC-роботів!§!\n"
field_maintenance:0 "Польове Обслуговування"
field_maintenance_desc:0 "Під час тривалих кампаній повернення юнітів на ремонт є складним. Натомість ми забезпечимо їм можливість ремонтувати один одного прямо в полі.\n\n"
the_flesh_is_weak:0 "Плоть Слабка"
the_flesh_is_weak_desc:0 "Людські бійці просто не здатні змагатися з роботами в ближньому бою. Завдяки глибокому аналізу анатомії людини наші роботи знатимуть, куди стріляти для максимального ураження."
refined_construction:0 "Вдосконалене Конструювання"
refined_construction_desc:0 "Зброя типу антиматеріальних гвинтівок і вибухівка загрожують нашим одиницям. Впровадження міцніших матеріалів у процеси виробництва дозволить знизити вразливість до таких загроз."
combat_simulations:0 "Бойові Симуляції"
combat_simulations_desc:0 "Переваги в бою недостатньо. Ми прагнемо беззаперечної перемоги. Усі дані, кожна змінна, буде введена в нашу власну ЗАКС – ми знатимемо результат ще до початку битви."
offensive_protocols_doctrine:0 "Військові Ігри"
offensive_protocols_doctrine_desc:0 "Попри використання вдосконаленої системи наведення, наші роботи недостатньо гнучкі у бою. Замість створення нової прошивки ми можемо забезпечити пряме керування юнітами через VR-симулятори. Для ворогів єдиний спосіб перемогти – не грати.\n\n"
iron_fist:0 "Людські Командири"
iron_fist_desc:0 "Інтеграція людей у мережу управління роботами підвищила ефективність бою ціною інстинкту самозбереження. Якщо використовувати пілотів-людей як командирів, а не піхоту, ми зможемо реалізовувати небезпечніші, але результативніші тактики прямо під час бою."
age_of_the_machine:0 "Епоха Машин"
age_of_the_machine_desc:0 "Потреба у людських солдатах залишилася в минулому. Ми здатні виготовляти й розгортати цілі армії роботів, чиї командири керують ними на відстані в сотні миль. Наші роботи – це абсолют наземної бойової сили."
standardised_blueprints:0 "Уніфіковані Креслення"
standardised_blueprints_desc:0 "Використовувати однакові компоненти недостатньо. Кожен юніт має бути побудований ідентично та утримуватись у такому стані під час обслуговування. Стандартизація забезпечує швидке збирання, ремонт та переробку розбитих одиниць.\n\n"
networked_ai:0 "Мережева ШІ"
networked_ai_desc:0 "Простий інтелект легко запрограмувати, але повністю автономний ШІ – зовсім інше питання. Ми можемо оновити прошивку наших роботів, зробивши їх розумнішими, автономними і навіть наділивши їх особистостями. З часом ці особистості можуть розвиватись у різні боки, однак їхній колективний розум має завадити бунту."
internal_replicators:0 "Внутрішні Реплікатори"
internal_replicators_desc:0 "На базі стандартизованої конструкції та автономності, ми можемо надати роботам здатність до самостійного внутрішнього ремонту. Ця неймовірно передова технологія зробить їх міцнішими та менш залежними від постачання."

#----------------------------
# Локалізація Технологічної Доктрини "Велика/Звичайна Армія"
#----------------------------
grand_army:0 "Традиційне Військове Мистецтво"
grand_army_desc:0 "Ми воюємо не заради знищення населення чи через відмінності з ворогом – ми воюємо заради виживання. Війна – це не спосіб життя, а його наслідок, і ми прагнемо зробити конфлікти якомога коротшими.\n\n"
grand_battle_plan_owb:0 "Бойове Планування"
grand_battle_plan_owb_desc:0 "Армії Старого Світу розробляли наступальні плани задовго до боїв, щоб гарантувати повноцінну перемогу. Для нас, поселенців і виживальників, планування атак не мало особливого значення. Та з розширенням армії й нації ми дедалі більше покладаємося на уроки минулого."
fortified_positions_doctrine:0 "Польові Укріплення"
fortified_positions_doctrine_desc:0 "Навчання солдатів основам проєктування та будівництва простих польових укріплень допоможе їм в обороні та покращить загальну організацію через потребу в злагодженості під час спорудження."
grand_assault_doctrine:0 "Скоординований Штурм"
grand_assault_doctrine_desc:0 "Спираючись на вже набутий досвід і підготовку, ми можемо поєднати різні бойові техніки для досягнення вражаючих результатів. Масштабні наземні штурми за участі кількох армій, що діють як єдине ціле, дозволять нам ефективніше бити ворога."
mechanized_offensive_doctrine:0 "Механізовані Сили"
mechanized_offensive_doctrine_desc:0 "Моторизовані війська – майбутнє бойових дій. Старий Світ активно застосовував їх у багатьох конфліктах, і ми можемо скористатися його досвідом для правильного використання цих підрозділів у бою.\n\n"
assault_concentration_doctrine:0 "Сконцентрований Штурм"
assault_concentration_doctrine_desc:0 "Поєднання бронетехніки та піхоти дозволить значно підвищити ефективність наших штурмів – хоч і на шкоду нашій логістиці."
old_world_tactics:0 "Моторизоване Розгортання"
old_world_tactics_desc:0 "Навіть якщо більшість нашої піхоти не воює на техніці, ми повинні активно використовувати транспорт для прискореного переміщення військ."
old_world_thunder:0 "Бронетанковий Штурм"
old_world_thunder_desc:0 "Танки надзвичайно дорогі у виробництві та обслуговуванні, проте їх бойова ефективність не піддається сумніву. Вони – справжні титани, здатні знищувати ворогів масово. Інтеграція їх у наші наступи зробить нас набагато смертоноснішими."
old_world_lightning:0 "Швидке Моторизоване Розгортання"
old_world_lightning_desc:0 "Удосконаливши концепцію моторизованого розгортання піхоти, ми можемо розробити ефективні графіки руху, аби наші війська прибували на місце швидше."
mechanized_onslaught:0 "Скоординований Натиск"
mechanized_onslaught_desc:0 "Наша армія перетворилася на складну механізовану структуру. Ми нарешті можемо реалізувати весь наш потенціал: масові наступи з механізованою піхотою, прориви під прикриттям танків і блискавичне підкріплення за допомогою моторизованого транспорту."
hold_the_line:0 "Підготовлена Оборона"
hold_the_line_desc:0 "Оборона – це мистецтво. Недостатньо просто тримати одну точку. Наші солдати мають бути здатні утримувати лінії вглиб і реагувати на наступ ворога.\n\n"
concentration_of_firepower:0 "Протибронева Тактика"
concentration_of_firepower_desc:0 "Піхота здатна на багато що, та наявність ворожих бронемашин чи силової броні серйозно ускладнює ситуацію. Навчання використанню протиброневої зброї підвищить шанси наших солдатів у бою."
new_world_tactics:0 "Виживання у Пустці"
new_world_tactics_desc:0 "У небезпечній місцевості не завжди вдається налагодити постачання. Армії, що перебувають у русі, стикаються з нестачею ресурсів, поганим використанням провіанту й агресивною фауною. Навчивши солдатів користуватися навколишнім середовищем, ми зменшимо тиск на логістику."
send_in_the_next_wave:0 "Найм Найманців"
send_in_the_next_wave_desc:0 "Втрати у довготривалих кампаніях важко компенсувати. Для заповнення прогалин до прибуття нових частин ми можемо найняти найманців. Це не збільшить розмір армії, але дасть змогу швидше поповнити підрозділи до приходу справжніх підкріплень."
mass_conscription:0 "Призов Цивільних"
mass_conscription_desc:0 "Кампанії можуть тривати від тижнів до років. І втрати зростають. Запровадження цивільного призову дасть нам набагато більший резерв людських ресурсів – хоч і знизить боєздатність новобранців."
ranger_infiltration:0 "Тактика Інфільтрації"
ranger_infiltration_desc:0 "Проникнення на території, підконтрольні ворогу, дозволить нам збирати розвіддані: позиції противника, шляхи постачання тощо. Залучення союзників у тилу ворога дозволить завдавати ударів з набагато більшою ефективністю."

forward_firebase_unlock_tech_tt:0 "§GЦей напрям розвитку дозволить нам будувати мобільні укріплення. Передові вогневі бази – це унікальний підрозділ підтримки, що забезпечує значні бонуси в обороні ціною мобільності. Однак ми мусимо їх виготовити.§!"

doctrine_radio_equipment_unlock_tech_tt:0 "\n§GТепер ми можемо розпочати виробництво радіообладнання, яке згодом буде передане в частини. Це покращить їхні бойові показники, але потребуватиме додаткових заводських потужностей.§!"
doctrine_radio_equipment_deployment_tech_tt:0 "\n§GУсі наші піхотні й спеціальні підрозділи тепер потребуватимуть радіообладнання для кращої координації, що значно підвищить їхню ефективність у бою.§!"

grunt_level_radio_integration_doctrine_tech:0 "Радіозв'язок на Рівні Солдата"
grunt_level_radio_integration_doctrine_tech_desc:0 "Якщо кожен солдат матиме радіо, інформація зможе передаватися значно швидше й ефективніше. Центральне управління все ще потрібне, але зростання бойової ефективності переважає витрати на додаткове оснащення."
tooltip_2radio:0 "§RУсі відповідні підрозділи потребуватимуть на 5 радіоприймачів більше на батальйон§! (§YЗагальна потреба/запас:§! [?total_unit|R0]/[?radios_stored|R0])"
hail_of_lead_doctrine_tech:0 "Придушувальний Вогонь"
hail_of_lead_doctrine_tech_desc:0 "Якщо ворог буде постійно перебувати під обстрілом, а наші вогневі групи будуть змінюватися так, щоб підтримувати безперервний потік куль – ніхто не наважиться навіть визирнути з укриття."
forward_fire_base_doctrine_tech:0 "Передова Вогнева База"
forward_fire_base_doctrine_tech_desc:0 "Передові бази дозволяють нашим солдатам закріпитися в укритих позиціях. Підрозділи, що отримають доступ до цих споруд, матимуть кращі шанси не лише вижити під обстрілом, а й ефективно відповісти. Мати своє укриття з собою – особливо коли довкола немає іншого – критично важливо."
rapid_weapon_redeployment_doctrine_tech:0 "Швидке Переоснащення"
rapid_weapon_redeployment_doctrine_tech_desc:0 "Передові бази важко переміщати, але якщо ми врахуємо всі логістичні виклики – зможемо пристосувати їх до темпу пересування решти армії."

#----------------------------
# Локалізація Технологічної Доктрини "Тактика Терору"
#----------------------------
terror_tactics:0 "Асиметрична Війна"
terror_tactics_desc:0 "Щоб перемогти – ми маємо бути непередбачуваними. У нас багато людей і мало індустрії, але це нас не зупиняє. Щоб підкорити Пустку, слід відкинути технології. Лазери не виграють битви – виграють її наші маси.\n\n"
pocket_defence_doctrine:0 "Збирання Провіанту"
pocket_defence_doctrine_desc:0 "Квітка брока, плоди кактуса-бочки, мутфрукти... перелік можна продовжити. Пустка пропонує багато ягід, фруктів і листя, які наші люди можуть збирати. Розвідники зобов’язані забезпечувати себе харчами під час патрулів попереду армії – це підвищує їхні шанси на виживання при відриві від основних сил."
terror_tactics_actual:0 "Імпровізовані Перешкоди"
terror_tactics_actual_desc:0 "Шиповані барикади можна швидко зводити перед боєм або під час нього, аби стримати ворога від масових атак. Надлишкові шипи, що залишаються після будівництва, наші солдати можуть переробити на саморобні списи."
decimato_doctrine:0 "Децимація"
decimato_doctrine_desc:0 "Провал має каратися. Але як карати великі групи? Децимація – ось відповідь. Солдатів ділять на десятки, кожен тягне жереб. Кого випаде – того страчують дев’ятеро інших. Таке покарання – за провину всіх.\n\n"
ego_gloriam_nominis:0 "Клиноподібні Побудови"
ego_gloriam_nominis_desc:0 "Можна прорідити фланги і зосередити війська в центрі, створивши «клин», що пробиватиме ворожі лінії. Цю тактику ефективно застосовували римляни, і ми так само зможемо її використати в Пустці."
prae_timore_mortis:0 "Побудова за Каннами"
prae_timore_mortis_desc:0 "Розвиваючи нашу тактику клина, ми можемо навчити війська застосовувати маневр Канн. Сильні фланги й навмисно ослаблений центр виманюють ворога в пастку, дозволяючи його оточити."
exitum:0 "Культ Особистості"
exitum_desc:0 "Наша міць приваблює до нас мешканців Пустки, наче метеликів до полум’я. Наша влада сувора, але справедлива, а жорстокість – захищає поселенців. Якщо ворог увійде на нашу землю, його чекатимуть постійні атаки від нашого населення."
invisibilia_mortem:0 "Сильний Правий Фланг"
invisibilia_mortem_desc:0 "Як і побудови клином чи Каннами, тактика сильного правого флангу спрямована на повний розгром ворога. Концентрація сил на правому фланзі дозволяє зламати ворожий лівий, обійти позиції супротивника і атакувати з тилу."
divide_et_vincet:0 "Військова Інженерія"
divide_et_vincet_desc:0 "Римські легіони будували укріплення на марші. Їхні табори більше нагадували форти з ровами, стінами й вежами. Прийнявши такі практики, наші війська буде значно важче витіснити з захоплених територій."
summa_bellum:0 "Легіон"
summa_bellum_desc:0 "Римський Легіон – вершина військової думки античності. Легіонери могли змінити побудову за одну мить, слухаючи командира прямо в бою. Ми станемо справжнім Легіоном – нас ніхто не зупинить."

tribal_wisdom_doctrine:0 "Знання Пустки"
tribal_wisdom_doctrine_desc:0 "Вирісши під невблаганним сонцем мертвої землі, наші солдати краще відчувають навколишнє середовище. Інстинктивне вміння знайти безпечне місце, обрати вірний шлях, швидко пересуватись – усе це в нас уже є.\n\n"
the_dog_barks:0 "Інтуїція Пустки"
the_dog_barks_desc:0 "Миттєве прийняття рішення – різниця між життям і смертю. Для наших солдатів, вихованих на спекотному піску Пустки, інтуїція – друга натура. Вони інстинктивно відчувають наближення ворога й знають, де шукати небезпеку. Це дає нам перевагу."
the_wolf_pack:0 "Зграя"
the_wolf_pack_desc:0 "Сам воюєш – сам і помреш. Кожен у Пустці знає, від рейдера до земляного дикуна – щоб вижити, потрібні друзі. Хтось прикриє спину, допоможе пограбувати поселення чи добути здобич. Так, командири бувають дратівливі – але краще слухати їх, ніж лежати мертвим."
the_mirelurk_pincer:0 "Спостереження за Тваринами"
the_mirelurk_pincer_desc:0 "Природа – це страх. Створіння Пустки вбивають швидше за більшість зброї й переходять до наступної жертви, ще до того як ти встигнеш перезарядити. Ми можемо вчитися в хижаків Пустки, щоби зробити наші армії такими ж смертоносними."
the_nightstalkers_bite:0 "Тактика Найтсталкерів"
the_nightstalkers_bite_desc:0 "Найтсталкери здатні ставати невидимими, коли відчувають загрозу. Це майстри прихованих атак. Ми, звісно, не можемо зникати, але можемо багато навчитися з їх поведінки: як вони вистежують здобич і атакують короткими, різкими ударами, уникаючи затяжних сутичок."
the_cazadores_speed:0 "Отрута Казадорів"
the_cazadores_speed_desc:0 "Прості отрути більше не годяться. Щоб справді нашкодити ворогу з першого зіткнення, отрута радскорпіонів замала. Наші люди мають полювати на грізних казадорів, збирати їх отруту і повертатись. Якщо нічого іншого – це навчить їх швидкому відступу."
the_deathclaws_might:0 "Лють Дескло"
the_deathclaws_might_desc:0 "Дескло бояться по всьому континенту. Вони здатні вбити будь-кого за секунди. Їх походження невідоме, але там, де йдуть дескло – йде смерть. Ми повинні стати як вони: жахом, що вселяє страх у кожного живого."

#----------------------------
# Локалізація Технологічної Доктрини "Війна Вигнанців"
#----------------------------
outsider_warfare_doctrine:0 "Війна за Прикладом Вигнанців"
outsider_warfare_doctrine_desc:0 "Наш народ не просто вижив – ми процвітаємо в цьому проклятому пеклі. Тепер ми воюємо за верховенство нашого виду. Час остаточно стати «монстрами» і вселити страх у серця тих, хто наважився б на нас полювати.\n\n"
we_are_different_doctrine:0 "Витривалість мутантів"
we_are_different_doctrine_desc:0 "Наші тіла стали майже невразливими до радіації та інших мутагенів після поколінь постійного впливу. Ця генетична перевага ідеально підходить для війська: ми зможемо швидше зосереджувати підрозділи й захоплювати територію без необхідності часто відпочивати чи лікуватись."
we_are_special_doctrine:0 "Майстерність сили мутантів"
we_are_special_doctrine_desc:0 "Століття, прожиті в Пустці, зробили наші м’язи й кістки сильнішими за людські. Вкрай важливо, аби війська використовували цю силу: це спростить логістику, допоможе усувати перешкоди та проривати ворожі лінії."
we_are_strong_doctrine:0 "Примітивні режим тренувань"
we_are_strong_doctrine_desc:0 "Фраза «практика веде до досконалості» актуальна і для нас. Наші війська мають розпочинати фізичні тренування з моменту вступу, щоби стати витривалішими. Це може знизити їх злагодженість – але не матиме значення, коли вони стоятимуть над тілами переможених ворогів.\n\n"
we_are_smart_doctrine:0 "Примітивні тактичні уроки"
we_are_smart_doctrine_desc:0 "Загін озброєних мутантів вселяє страх, але неорганізований загін – ні. Тому слід з самого початку навчати формуванню підрозділів, базовим маневрам і штурмовій тактиці. Це дозволить зберегти цілісність підрозділів у найважчі моменти.\n\n"
we_are_enduring_doctrine:0 "Доктрина Пристосованої Броні"
we_are_enduring_doctrine_desc:0 "Як і люди, що носять довоєнну чи місцеву броню, ми також можемо створити власну. Безліч зруйнованих машин у Пустці – майже безкінечне джерело броні. Вона може уповільнити наших солдатів, але додатковий захист виправдовує втрату швидкості.\n\n"
we_are_fast_doctrine:0 "Доктрина Легкої Піхоти"
we_are_fast_doctrine_desc:0 "Роки втечі від хижаків і людей-вбивць розвинули нашу здатність до швидкого пересування. Тепер, діючи спільно, ми – грізна сила, що блискавично наближається. Грім наших кроків і блискавичні удари вселятимуть страх у ряди ворога.\n\n"
we_are_beautiful_doctrine:0 "Вроджені Тактичні Знання"
we_are_beautiful_doctrine_desc:0 "З початку війн існують сталі істини: сила в чисельності, найкращий захист – це напад, союзникам слід допомагати. Ці засади обов’язково мають бути включені до наших стандартних навчальних програм.\n\n"
we_are_perceptive_doctrine:0 "Навчання Підсиленого Сприйняття"
we_are_perceptive_doctrine_desc:0 "Мутації змінили не лише фізичну силу – багато наших відчуттів також посилились. Це чудово підходить для розвідки. Ми навчимо солдатів повноцінно використовувати ці здібності для збору розвідданих і здобуття переваги на полі бою.\n\n"
we_are_fortunate_doctrine:0 "Збирання на Полі Бою"
we_are_fortunate_doctrine_desc:0 "Попри всі логістичні зусилля, війська на передовій часто будуть недооснащені. Вирішенням проблеми стане виживання за рахунок Пустки. Завдяки базовому тренуванню та правильному використанню інструментів, ми зможемо знаходити зброю і ресурси в доступному середовищі."
the_chosen_ones_doctrine:0 "Вибірковий Вплив"
the_chosen_ones_doctrine_desc:0 "Мутація діє на кожного по-різному. Це створює помітну різницю між найслабшими й найсильнішими солдатами. Було запропоновано піддавати мутагенному впливу лише найкращих. Так ми зможемо розкрити потенціал еліти ще глибше."
the_master_servant_doctrine:0 "Уроки Минулого"
the_master_servant_doctrine_desc:0 "Війна не змінюється, але методи – так. Десятиліття боїв у Пустці навчили нас цінних уроків і тактик. Включення їх у тренування допоможе уникати помилок минулого та прокладе шлях новим підходам.\n\n"
ageless_experience_doctrine:0 "Інтеграція Ветеранів"
ageless_experience_doctrine_desc:0 "Чутки про нас ширяться Пусткою, і ветерани мутантських армій приходять зі своїм досвідом. Їх залучення не лише підніме бойовий дух – вони також посилять нашу ефективність завдяки знанням про Пустку та вмінням вести бій із людьми.\n\n"
army_of_outsiders_doctrine:0 "Стратегічний Тренувальний Режим"
army_of_outsiders_doctrine_desc:0 "Наше військо буде настільки ефективне, наскільки ефективні його командири. Лідери підрозділів мають навчитись ухвалювати миттєві рішення для великих груп. Навчання застосуванню наших воєнних доктрин допоможе їм ефективно організовувати та керувати силами."
mixed_army_doctrine:0 "Ефективні Методи Мутації"
mixed_army_doctrine_desc:0 "Військо має постійно поповнюватися. Найм існуючих мутантів не задовольняє попит. Краще – піддавати мутагенному впливу і новобранців, і солдатів. Це розширить наш резерв та підвищить ударний потенціал армії.\n\n"
master_race_doctrine:0 "Точне Радіаційне Навантаження"
master_race_doctrine_desc:0 "Сира радіація покращила нашу силу й тілобудову, але це неефективно. Цілеспрямоване дозування дасть змогу отримати всі переваги мутацій при мінімальних побічних ефектах.\n\n"


 #----------------------------
 # Localisation air doctrine tech - OUTDATED
 #----------------------------
formation_flying_doctrine:0 "Пілотування без перешкод"
formation_flying_doctrine_desc:0 "Невмілий пілот часто блокує огляд побратимам по ескадрильї. Це можна виправити, розробивши бойові порядки з пріоритетом на збереження ліній зору."

fighter_sweeps_doctrine:0 "Нальоти на аеродроми"
fighter_sweeps_doctrine_desc:0 "Ворог набагато небезпечніший у небі, ніж на землі. Ведучи бої поблизу його баз, ми зможемо перехопити їхні літаки ще до зльоту."

formation_fighting_doctrine:0 "Бій у строю"
formation_fighting_doctrine_desc:0 "Поодинокі літаки створюють дірки в повітряній обороні. Стройова взаємодія не лише усуває ці слабкі місця, а й зміцнює зв’язок між пілотами."

forward_interception_doctrine:0 "Превентивне перехоплення"
forward_interception_doctrine_desc:0 "Якщо ворог іде, навіщо чекати? Хоч це й ризиковано, перехоплення бомбардувальників ще на підльоті може врятувати нам заводи."

layered_airzones_doctrine:0 "Багатошарові повітряні зони"
layered_airzones_doctrine_desc:0 "Один прохід – не завжди достатньо. Якщо зони патруля перекривають одна одну, ми втрачаємо охоплення, але значно підвищуємо шанс виявити ворожу активність."

multirole_bombers_doctrine:0 "Удар по справжніх цілях"
multirole_bombers_doctrine_desc:0 "Кидати бомби по мертвих – марна справа. Ми навчимо бомбардувальники виявляти вже знищені цілі й шукати нові. Ворогів багато – тож поділимо увагу."

detection_avoidance_doctrine:0 "Уникнення виявлення"
detection_avoidance_doctrine_desc:0 "Завдяки розвідці та прикидкам ми можемо здогадатись, де ворог патрулює, і прокласти маршрути в обхід його пасток."

infrastructure_destruction_doctrine:0 "Удар по інфраструктурі"
infrastructure_destruction_doctrine_desc:0 "Голодний солдат не воює. Ми не знайдемо всі каравани, але можемо зруйнувати дороги, мостові переходи та вузли – й зупинити постачання."

operational_destruction_doctrine:0 "Неочікувані маршрути"
operational_destruction_doctrine_desc:0 "Перехоплення – це не лише прорив крізь ескорт. Іноді обхідна траєкторія дає змогу вдарити зненацька."

priority_targeting_doctrine:0 "Бойові коробки"
priority_targeting_doctrine_desc:0 "«Бойова коробка» – це формація бомбардувальників, яка забезпечує максимальний вогонь із захисних кулеметів та взаємоперехресне прикриття."

strategic_destruction_doctrine:0 "Стратегічне знищення"
strategic_destruction_doctrine_desc:0 "Недостатньо просто кидати бомби на все, що здається ворожим. Ми маємо скласти пріоритетну таблицю цілей і діяти з точністю."

day_bombing_doctrine:0 "Денні бомбардування"
day_bombing_doctrine_desc:0 "Наші літаки – цінні. Вночі ефективність падає. Бомбардування під сонцем – ефективніше."

night_bombing_doctrine:0 "Нічні бомбардування"
night_bombing_doctrine_desc:0 "Атаки в темряві дають перевагу. Якщо пілоти навчаться бити по цілях при нульовій видимості, ми зможемо уникати ворожих патрулів."

future_airforce_doctrine:0 "Повітряні сили майбутнього"
future_airforce_doctrine_desc:0 "Планування, дисципліна, вишкіл – ми стали майстрами повітряного бою. Поки інші ще пробують злетіти, ми вже пануємо в небі."

dive_bombing_doctrine:0 "Пікіруючі удари"
dive_bombing_doctrine_desc:0 "Пікірування – маневр, відомий ще з Другої світової. Занурення з висоти прямо на ціль – найкращий шанс влучити з некерованою бомбою."

hunt_and_destroy_doctrine:0 "Вільна авіапідтримка"
hunt_and_destroy_doctrine_desc:0 "В розпалі бою неможливо керувати кожним літаком окремо. Дозволивши пілотам самостійно обирати цілі, ми адаптуємося до мінливого поля бою."

direct_ground_support_doctrine:0 "Безпосередня підтримка"
direct_ground_support_doctrine_desc:0 "Якщо дати наземним підрозділам право викликати авіаудари, ефективність атак суттєво зросте."

dynamic_target_assignment_doctrine:0 "Шаровані атаки"
dynamic_target_assignment_doctrine_desc:0 "Замість великого удару – кілька дрібних. Постійний тиск створює ілюзію нескінченного пекла: гул, вогонь і уламки."

# Бонуси технологій
mechanical_knowhow_doctrine_tt:0 "Швидкість дослідження авіатехнологій: §G+10%§!\n"
practical_launch_mechanisms_doctrine_tt:0 "§YУся авіація§!: \n  £production_cost Вартість виробництва: §G-5%§!\n"

 #----------------------------
 # Localisation Decisive Engagement Air Doctrines
 #----------------------------
decisive_engagement_doctrine:0 "Рішуча зустріч"
decisive_engagement_doctrine_desc:0 "Якщо ми маємо перевагу в повітрі – а ми її маємо – то чим раніше почнемо бій, тим швидше настане перемога. Знищивши ворожі літаки, ми контролюватимемо й поле бою на землі."

informational_edge_doctrine:0 "Інформаційна перевага"
informational_edge_doctrine_desc:0 "Підтримка льотчиків фахівцями з розвідки – ключова. Знати, де ворог – перший крок до того, щоб знищити його в небі."

opportunistic_offensives_doctrine:0 "Наступ, коли є шанс"
opportunistic_offensives_doctrine_desc:0 "Пілоти та командири мають вміти використовувати будь-яку помилку ворога, навіть за межами завдань. Якщо ворог оступився – покарай його."

reckless_abandon_doctrine:0 "Сміливість понад усе"
reckless_abandon_doctrine_desc:0 "Трохи безумства пілотам не завадить. Хто не ризикує – не стає асом. І не перемагає."

rapid_capitalization_doctrine:0 "Швидке реагування"
rapid_capitalization_doctrine_desc:0 "Уся міць нічого не варта, якщо нею не скористатись. Наші літаки мають бути там, де треба – і вчасно."

unrelenting_firepower_doctrine:0 "Невпинна вогнева міць"
unrelenting_firepower_doctrine_desc:0 "Кращий захист – напад. Збитий літак – не загроза. Тож ми наростимо озброєння, попри витрати."

accelerated_takeoffs_doctrine:0 "Прискорені злети"
accelerated_takeoffs_doctrine_desc:0 "Хоч запуск літаків у тісному строю ризикований – це дозволяє швидше підняти їх у повітря, перехоплюючи ворога вчасно."

frontloaded_assaults_doctrine:0 "Шок на старті"
frontloaded_assaults_doctrine_desc:0 "Якщо є шанс знищити ворога до його відповіді – варто випустити левову частку боєзапасу на початку бою."

supermaneuverability_doctrine:0 "Надманевреність"
supermaneuverability_doctrine_desc:0 "Деякі трюки не вкладаються в класичну аеродинаміку. Наші пілоти, за належного вишколу й конструкцій, зможуть робити неможливе."

highside_guns_pass_doctrine:0 "Атака згори"
highside_guns_pass_doctrine_desc:0 "Навіть найманевренішого ворога можна дістати – з висоти та зненацька. 'Boom & Zoom': падаєш на ворога зверху, стріляєш, а потім на тязі тікаєш нагору."

unbridled_aggression_doctrine:0 "Безмежна агресія"
unbridled_aggression_doctrine_desc:0 "Якщо шлях вільний, наші бомбардувальники можуть нести смерть безкарно. Поки заводи працюють – ми продовжимо бомбардування."

who_dares_wins_doctrine:0 "Хто ризикує – той перемагає"
who_dares_wins_doctrine_desc:0 "Без ризику немає перемоги. Той, хто має сміливість ухопити шанс – увійде в історію. Інші – зникнуть."

 #----------------------------
 # Localisation Pragmatic Aviation Air Doctrines
 #----------------------------
pragmatic_aviation_doctrine:0 "Прагматична авіація"
pragmatic_aviation_doctrine_desc:0 "Відновити авіацію в умовах Пустки – вкрай складно. Щоб використати її ефективно, слід зосередитися лише на найважливішому."

mechanical_knowhow_doctrine:0 "Технічні знання"
mechanical_knowhow_doctrine_desc:0 "Без справного літака ас залишиться на землі. Наші техніки – не менш важливі, ніж самі пілоти."

comprehensive_theory_doctrine:0 "Повна теорія"
comprehensive_theory_doctrine_desc:0 "Пілот винищувача – це не лише фізична підготовка, а й знання. Вони мусять розуміти аеродинаміку, щоби вижити у битві на висоті."

precautionary_measures_doctrine:0 "Запобіжні заходи"
precautionary_measures_doctrine_desc:0 "Краще передбачити аварію, ніж збирати уламки. Обладнання для польотів у погоду – інвестиція в живу техніку."

flight_dynamics_doctrine:0 "Динаміка польоту"
flight_dynamics_doctrine_desc:0 "Ми відновили знання про політ із довоєнних книжок. Навіть дрібні зміни в корпусі зменшують опір – підвищують швидкість і економію пального."

situational_awareness_doctrine:0 "Просторове відчуття"
situational_awareness_doctrine_desc:0 "Перше правило пілота – знати, що навколо. Неможливо збити те, чого не бачиш. І важко уникнути того, що врізається в тебе."

basic_fighter_maneuvers_doctrine:0 "Основи бою"
basic_fighter_maneuvers_doctrine_desc:0 "Усі великі аси починали з основ. Маневрування, збереження енергії, позиційна перевага – ключ до перемоги."

artful_positioning_doctrine:0 "Мистецтво позиціонування"
artful_positioning_doctrine_desc:0 "Небо – полотно, а фізика – наш пензель. Кулі, вогонь і кров – фарби. Можливо, колись ми літатимемо в мирі. Поки що – лише у війні."

geometry_of_pursuit_doctrine:0 "Геометрія переслідування"
geometry_of_pursuit_doctrine_desc:0 "Важливо не лише знати, куди летіти – а й як туди дістатись. Це й вирішує результат."

environmental_adaptation_doctrine:0 "Адаптація до середовища"
environmental_adaptation_doctrine_desc:0 "Як розвідник знає місцевість, так ас відчуває погоду: вітер, вологість, температура – усе впливає на літак."

ground_interdiction_doctrine:0 "Перешкода на землі"
ground_interdiction_doctrine_desc:0 "Атакувати наземні цілі – це інше вміння, ніж повітряний бій. Але саме заради цього ми й будуємо літаки!"

tactical_precision_doctrine:0 "Тактична точність"
tactical_precision_doctrine_desc:0 "Скинути бомбу – просто. Потрапити в ціль – складно. Це потребує техніки, вправності й належного обладнання."

terror_of_the_inevitable_doctrine:0 "Жах неминучого"
terror_of_the_inevitable_doctrine_desc:0 "Наші бомбардувальники летять вище, ніж досягають ППО більшості ворогів. Радари є не в усіх. Іронічно знищувати поселення, що вже бачили атомний вогонь..."

clockwork_strikes_doctrine:0 "Точність годинника"
clockwork_strikes_doctrine_desc:0 "Наші удари – методичні, хоча й непередбачувані. Але справжній талант – у злагодженій взаємодії з наземними військами."

 #----------------------------
 # Localisation Elaborate Disruption Air Doctrines
 #----------------------------
elaborate_disruption_doctrine:0 "Витончене порушення"
elaborate_disruption_doctrine_desc:0 "Нам не потрібно контролювати чуже небо чи збивати кожен ворожий літак – достатньо зірвати їхні місії."

practical_launch_mechanisms_doctrine:0 "Практичні способи зльоту"
practical_launch_mechanisms_doctrine_desc:0 "Існує багато способів підняти літак у небо – не всі з них потребують уразливої ЗПС. Краще дотримуватись тих, що працювали... здебільшого."

pilot_improvisation_doctrine:0 "Імпровізація пілотів"
pilot_improvisation_doctrine_desc:0 "Деякі просто народжені літати. Саджати їх за старі книжки – марна справа. Найкраще навчання – це штурвал у руках."

proactive_inteference_doctrine:0 "Проактивне втручання"
proactive_inteference_doctrine_desc:0 "Якщо ворог переважає нас у майстерності й техніці – випередь його. Вдар першим – і зірви його атаку."

operational_persistence_doctrine:0 "Оперативна наполегливість"
operational_persistence_doctrine_desc:0 "Не вийшло з першого разу? Спробуй ще. Ми не маємо права зупинятися на півдорозі. Тиск – єдиний шлях уперед."

low_altitude_deterrence_doctrine:0 "Низьке відлякування"
low_altitude_deterrence_doctrine_desc:0 "Щоби бити наших хлопців, ворог має спуститись низько. А ми вже зустрінемо їх кулеметами. Кілька розбитих літаків – і вони зрозуміють."

rudimentary_obstruction_doctrine:0 "Примітивні перепони"
rudimentary_obstruction_doctrine_desc:0 "Двигун коштує дорого. А повітряна куля з тросами – дешева і здатна зірвати політ низьколетячих літаків. Ідеально для захисту важливих об’єктів."

dispersed_patrols_doctrine:0 "Розосереджене патрулювання"
dispersed_patrols_doctrine_desc:0 "Виявлення ворога – справа зору. Особливо якщо вони ховаються над хмарами. Розтягнуті патрулі в потрібних напрямках – наш найкращий шанс."

fighter_stratification_doctrine:0 "Стратифікація винищувачів"
fighter_stratification_doctrine_desc:0 "Розмістивши пілотів над, під і на рівні ворога – ми позбавимо його тактичної переваги. Хтось із наших, звісно, постраждає. Але це прийнятна жертва."

deceptive_flight_patterns_doctrine:0 "Оманливі маршрути"
deceptive_flight_patterns_doctrine_desc:0 "Ворог очікує, що ми битимемося як він. Використаємо це: копіюючи їхні схеми, ми можемо заховати справжні наміри."

airspace_congestion_doctrine:0 "Перевантажене небо"
airspace_congestion_doctrine_desc:0 "Чи буває занадто багато літаків в одному місці? Можливо. Але це створює враження сили. А ворогу важче маневрувати, коли ми скрізь."

localized_harassment_doctrine:0 "Локалізовані атаки"
localized_harassment_doctrine_desc:0 "Ми не можемо виграти всюди. Але можемо сконцентруватися на головному напрямку – і виграти там, де це справді важливо."

battlespace_nullification_doctrine:0 "Нульова зона бою"
battlespace_nullification_doctrine_desc:0 "Весь наш вишкіл, техніка і тактика – заради однієї мети: зробити війну в небі неактуальною для бою на землі. Війна виграється чоботами на землі, а не пропелерами в небі."



 #----------------------------
 # localisation navy doctrine tech
 #----------------------------
  #fleet_in_being:0 "Safe Munitions Stowage" Moved to replace due to duplicate text
  #fleet_in_being_desc:0 "From handling primitive firepots to high explosive shells; drilling our sailors on safe stowage of ammunition is vital to naval organization." Moved to replace due to duplicate text
pacific_fleet_navy_doctrine:0 "Безпечне зберігання боєприпасів"
pacific_fleet_navy_doctrine_desc:0 "Від примітивних фаєрпотів до сучасних снарядів – наші моряки мають знати, як безпечно зберігати вибухівку. Це основа будь-якого флоту."

river_fleet_navy_doctrine:0 "Річковий флот"
river_fleet_navy_doctrine_desc:0 "На річках місця мало, і це ускладнює маневрування й збільшує ризики. Наші екіпажі мають бути навчені діяти в цих стиснутих умовах."

coastal_patrols_navy_doctrine:0 "Прибережне патрулювання"
coastal_patrols_navy_doctrine_desc:0 "Більшість судноплавства йде вздовж узбережжя. Ці зони були небезпечні ще до ядерного вогню. Ми можемо їх приборкати – за допомогою доктрин, довоєнних карт і місцевої розвідки."

raiding_flotillas_navy_doctrine:0 "Рейдові флотилії"
raiding_flotillas_navy_doctrine_desc:0 "Малі судна швидші та спритніші. Якщо ретельно планувати, можна легко вирахувати й рознести ворожий конвой. Наші рейдери – гостре лезо у хвилях."

assault_parties_navy_doctrine:0 "Агресивні маневри"
assault_parties_navy_doctrine_desc:0 "Швидкий і жорсткий штурм підвищує шанс, що нас помітять раніше. Але ховатися – це не для нас. У бій – із гордо піднятим прапором."

suicide_runs_navy_doctrine:0 "Самогубні атаки"
suicide_runs_navy_doctrine_desc:0 "Шторм, цинга й страх швидко вибивають дух із моряків. Загартуй їх серце – і вони битимуться до останнього. Не всі повернуться, але всі залишать слід."

terrain_exploitation_navy_doctrine:0 "Використання місцевості"
terrain_exploitation_navy_doctrine_desc:0 "Місцевість важлива не лише на суші. Затоки, рифи, мілини – це укриття й пастки. І ми їх використаємо."

force_concentration_navy_doctrine:0 "Капітальні кораблі"
force_concentration_navy_doctrine_desc:0 "Гіганти з гарматами від носа до корми – гордість кожного флоту. Ми маємо створити доктрину, що виведе наших титанових монстрів на вершину морської могутності."

area_denial_navy_doctrine:0 "Контроль території"
area_denial_navy_doctrine_desc:0 "Інколи ворогу достатньо знати, що ми можемо дістати його. Великі гармати – не лише для стрільби, а й для страху."

focus_fire_navy_doctrine:0 "Сфокусований вогонь"
focus_fire_navy_doctrine_desc:0 "Один лінкор – Армагеддон. Кілька разом – гнів богів. Скоординоване пекло – запорука перемоги."

ship_of_the_line_navy_doctrine:0 "Корабель лінії"
ship_of_the_line_navy_doctrine_desc:0 "Ці судна були основою боїв ще з епохи Ренесансу – витривалі, важкі, безжальні. Ми можемо відродити їхню славу, бронюючи наші кораблі – навіть якщо матросам це не до вподоби."

wave_supremacy_navy_doctrine:0 "Ескорти для авіаносців"
wave_supremacy_navy_doctrine_desc:0 "Авіаносець – як скляна гармата: смертельний, але крихкий. Якщо ворог хоче дістати наш авіаносець – хай спершу пройде крізь сталь гордості флоту."

barge_focus_navy_doctrine:0 "Ведмежі зграї"
barge_focus_navy_doctrine_desc:0 "Ми не доженемо дрібні судна у швидкісному поєдинку. Але хитрий маневр і навичка – і ми зірвемо їхні плани."

destroyer_focus_navy_doctrine:0 "Ведмежі зграї II"
destroyer_focus_navy_doctrine_desc:0 "Нові прориви у полюванні на малі цілі дали нам перевагу. Ми не просто женемося – ми ловимо."

carrier_focus_navy_doctrine:0 "Авіаносна ініціатива"
carrier_focus_navy_doctrine_desc:0 "Встановивши базові стандарти безпеки в роботі з морською авіацією, ми зможемо надійно вести операції з неба й води одночасно."

dispersed_formations_navy_doctrine:0 "Розосереджені формації"
dispersed_formations_navy_doctrine_desc:0 "Щільне шикування обмежує огляд і рух. Тримаючи дистанцію, ми покращимо навігацію й уникнемо втрат під час переходів."

wolfpacks_navy_doctrine:0 "Морський таран"
wolfpacks_navy_doctrine_desc:0 "Як танки у Другій світовій, наші малі судна проривають лінії та ламають тил. Потім – розгром у стилі Пустки."

convoy_interdiction_navy_doctrine:0 "Перехоплення конвоїв"
convoy_interdiction_navy_doctrine_desc:0 "Постачання часто важливіші за бойові судна. Наші швидкі рейдери – ідеальні інструменти. Їхній час настав."

decoy_tactics_navy_doctrine:0 "Обманні цілі"
decoy_tactics_navy_doctrine_desc:0 "Пол-бою – змусити ворога стріляти в ціль, що не дає результату. Легкі, швидкі човни без броні – ідеальні приманки. А справжні хижаки – вже на підході."

swimming_bait_navy_doctrine:0 "Приманка розміром із лінкор"
swimming_bait_navy_doctrine_desc:0 "Хоч капітальні кораблі – не в центрі нашої доктрини, їх не слід ігнорувати. Вони привабливі, величні, небезпечні. І здатні тримати удар, поки інші готують удар у відповідь."

force_projection_navy_doctrine:0 "Проекція сили"
force_projection_navy_doctrine_desc:0 "Розосередження капітальних кораблів не лише посилює ефективність – воно також передає повідомлення: з нами не жартують."

rapid_redeployment_navy_doctrine:0 "Швидке перекидання"
rapid_redeployment_navy_doctrine_desc:0 "Наші великі судна повільні. Але якщо екіпаж буде готовий змінити курс за секунду – ми зможемо швидко реагувати на будь-яку загрозу."

sail_focus_navy_doctrine:0 "Велика армада"
sail_focus_navy_doctrine_desc:0 "Наші зусилля в малі судна дали плоди. Ми пануємо на хвилях не за рахунок дорогих лінкорів, а через зграї швидких і смертельних човнів. Смерть тисячами порізів – ось наш стиль."


 #----------------------------
 # localisation Land doctrine xp tech
 #----------------------------
infantry_perk_tech_1:0 "Нові рутини"
infantry_perk_tech_1_desc:0 "Після кількох спроб і помилок наші солдати пристосувалися до нових щоденних звичок. Вони навчилися обходитися тим, що є, і з легкістю виконують завдання, які колись здавались складними."

infantry_perk_tech_2:0 "Тести на витривалість"
infantry_perk_tech_2_desc:0 "Солдати вже не помічають нових рутин – це для них як дихання. Щоби зберегти бойову форму, ми ввели нові тести на витривалість, які загартують їх тіло і дисциплінують у використанні припасів."

infantry_perk_tech_3:0 "Бережи побратима"
infantry_perk_tech_3_desc:0 "Допомога товариша – запорука виживання. Наші солдати прикривають один одного, вчасно реагують і перетворюють смертельні рани на легкі подряпини."

infantry_perk_tech_4:0 "Загострені інстинкти"
infantry_perk_tech_4_desc:0 "Інстинкт та кмітливість – головна зброя на полі бою. Наші піхотинці пройшли суворий вишкіл, аби не кидатись під кулі. Вони знають, де слабкі місця – і як їх уникати."

infantry_perk_tech_5:0 "Раптові навчання"
infantry_perk_tech_5_desc:0 "Очікування неочікуваного – межа між добрим солдатом і відмінним. Інтуїція формується під час несподіваних тривог. Люблять вони це чи ні, але сплять тепер з одним оком відкритим."

infantry_perk_tech_6:0 "Раптові навчання II"
infantry_perk_tech_6_desc:0 "Наші піхотинці вже загартовані несподіваними викликами. Їх більше нічим не здивуєш. Вони готові в будь-яку мить, навіть уві сні."

infantry_perk_tech_7:0 "Снайпери Пустки"
infantry_perk_tech_7_desc:0 "У звичайного солдата Пустки гвинтівка – просто залізяка. Наші ж навчаються ретельно, проходять тести, і невдовзі стануть справжніми стрільцями-віртуозами."

special_forces_perk_tech_1:0 "Передові знання"
special_forces_perk_tech_1_desc:0 "Спецпризначенці – еліта армії. Кращі з кращих. Ми повинні забезпечити їх найкращими знаннями й тактиками, щоби кількість не мала значення – лише розум."

special_forces_perk_tech_2:0 "Обійдемося тим, що є"
special_forces_perk_tech_2_desc:0 "Ми загартовуємо спецпризначенців у суворих умовах. Менше ресурсів – більше кмітливості. Вони зможуть виконати завдання навіть тоді, коли все летить до біса."

special_forces_perk_tech_3:0 "Світло в темряві"
special_forces_perk_tech_3_desc:0 "Оптимізм – важливий навіть у найгірші часи. Наші війська вчаться не втрачати глузд і витримку, навіть коли все довкола горить."

special_forces_perk_tech_4:0 "Саморобне укриття"
special_forces_perk_tech_4_desc:0 "Кожна гілка, кожна сітка – шанс вижити. Наші вояки тренуються будувати укриття навіть із сміття. Все – задля переваги."

special_forces_perk_tech_5:0 "Глибоке дихання"
special_forces_perk_tech_5_desc:0 "Серед куль і вогню важливо не забути, як жити. Дихальні вправи допомагають спецназу швидше відновлювати сили, перевершуючи звичайних солдатів."

special_forces_perk_tech_6:0 "Польові медики"
special_forces_perk_tech_6_desc:0 "Ми вчимо наших спецпризначенців рятувати самих себе. Після бою, далеко від бази, навіть знання про перев'язки – шанс на життя."

special_forces_perk_tech_7:0 "Знай свого ворога"
special_forces_perk_tech_7_desc:0 "Розвідка – половина перемоги. Наші війська вивчають ворога як себе – і завдяки цьому діятимуть точніше і швидше."

robot_perk_tech_1:0 "Гвинти й болти"
robot_perk_tech_1_desc:0 "Заощадити ресурси можна, використовуючи те, що вже є. Навіть гвинт і гайка можуть стати новою деталлю."

robot_perk_tech_2:0 "Сміття – не сміття"
robot_perk_tech_2_desc:0 "Маючи вправні руки, зі сміття можна створити щось нове. Наші роботи навчаються шукати корисні матеріали серед покинутих куп."

robot_perk_tech_3:0 "Укріплений корпус"
robot_perk_tech_3_desc:0 "Кілька зайвих міліметрів броні рятують десятки одиниць техніки. Ми підсилюємо найвразливіші точки роботів."

robot_perk_tech_4:0 "Швидка реакція"
robot_perk_tech_4_desc:0 "Робот не моргає під вогнем, але тепер ще й ухиляється. Невеличке покращення ПЗ – велика різниця для ворога."

robot_perk_tech_5:0 "Саморемонт"
robot_perk_tech_5_desc:0 "Ми додаємо нові алгоритми та деталі, щоби дозволити роботам самостійно лагодити себе прямо на полі бою."

robot_perk_tech_6:0 "Знайди – використай"
robot_perk_tech_6_desc:0 "Якщо немає техніка – робот сам собі технік. Вони навчаться шукати запчастини навколо себе, аби вижити."

robot_perk_tech_7:0 "Як єдине ціле"
robot_perk_tech_7_desc:0 "Роботи не базікають. Ми з'єднаємо їх у мережу, що дозволить атакувати єдиною силою. Машини – у строю."

vehicle_perk_tech_1:0 "Жоден гвинт не загублено"
vehicle_perk_tech_1_desc:0 "Недбалість убиває техніку. Перевірки і дбайливе ставлення дозволяють ремонтувати автівки просто в польових умовах."

vehicle_perk_tech_2:0 "Зварювання з брухту"
vehicle_perk_tech_2_desc:0 "Розбираємо старе, щоб зібрати нове. Із брухту можна створити придатну броню для наших машин."

vehicle_perk_tech_3:0 "Посилена броня"
vehicle_perk_tech_3_desc:0 "Трохи додаткової сталі – і куля залишає лише вм’ятину. Наш транспорт повертається з бою цілим."

vehicle_perk_tech_4:0 "Навіть не подряпина"
vehicle_perk_tech_4_desc:0 "Кмітливий водій – цілий транспорт. Навчання маневрування гарантує, що і машина, і її водій повернуться додому."

vehicle_perk_tech_5:0 "М'який хід"
vehicle_perk_tech_5_desc:0 "Наші водії знають, де ховати транспорт від вітру, пилу та іржі. Апокаліпсис безжальний – ми маємо бути розумнішими."

vehicle_perk_tech_6:0 "Працюй розумніше"
vehicle_perk_tech_6_desc:0 "Ми даємо кожному водію базу знань по догляду за технікою. Менше поломок – більше боїв."

vehicle_perk_tech_7:0 "Вогонь і щит"
vehicle_perk_tech_7_desc:0 "Наш транспорт – як кінь війни. Забезпечимо його найкращою зброєю та бронею – і він прокладе нам шлях крізь Пустку."

mutant_perk_tech_1:0 "Домівка в Пустці"
mutant_perk_tech_1_desc:0 "Більшість загроз Пустки не хвилюють наших мутантів. Якщо вони можуть вирвати серце з будь-чого, що трапиться їм на шляху – хто їх засудить?\nПустка – їхній дім, і вони її справжні володарі."

mutant_perk_tech_2:0 "Свинцеві шлунки"
mutant_perk_tech_2_desc:0 "Нашим мутантам не потрібна 'вода' чи 'комфорт', як їхнім недорозвиненим родичам. Їхня витривалість недосяжна для звичайного солдата."

mutant_perk_tech_3:0 "Безстрашний штурм"
mutant_perk_tech_3_desc:0 "Менше... мізків – менше страху смерті. Наші мутанти йдуть у бій із такою люттю, що навіть найхоробріші люди тремтять."

mutant_perk_tech_4:0 "Прості накази"
mutant_perk_tech_4_desc:0 "Накази типу 'Вбивай!', 'Розірви!' чи 'Трощіть!' не залишають місця для плутанини. І, чесно кажучи, не залишають місця для полонених."

mutant_perk_tech_5:0 "Сила молодших командирів"
mutant_perk_tech_5_desc:0 "Ми не можемо централізувати командування мутантами – вони ледве розуміють прямі накази. Але це дає змогу меншим лідерам проявити креативність і гнучкість у бою."

mutant_perk_tech_6:0 "Маневри мутантів"
mutant_perk_tech_6_desc:0 "Мутанти пролазять у найдивніші місця, створюючи ідеальні умови для засідок. Ворог не помітить мініядерку, що летить з будівлі, яку він щойно прочесав."

mutant_perk_tech_7:0 "Вища лють"
mutant_perk_tech_7_desc:0 "Мутант-солдат може робити з ворогами (і тими, кого вони називають 'цивільними') жахливі речі. Вони не виграють сердець, але точно зламають волю супротивника."

creature_perk_tech_1:0 "Адаптація до Пустки"
creature_perk_tech_1_desc:0 "Істоти, що пережили Війну, пристосувались до Пустки способами, які дивують і лякають навіть наймудріших вчених. А інші були створені в результаті експериментів... добровільно чи ні."

creature_perk_tech_2:0 "Годівля"
creature_perk_tech_2_desc:0 "Чим більше ми працюємо з цими істотами, тим краще розуміємо їхні смакові вподобання. Годування когтей смерті – справа тонка, майже мистецтво."

creature_perk_tech_3:0 "Вірність зграї"
creature_perk_tech_3_desc:0 "Більшість істот – соціальні. Деякі полюють у зграях, інші просто тримаються разом. Це можна використати у воєнних цілях."

creature_perk_tech_4:0 "Командні свистки"
creature_perk_tech_4_desc:0 "Деякі циркачі твердять, що їхні радтаргани розуміють англійську. Наші дресирувальники їм не вірять, але навчили істот реагувати на свисти й сигнали."

creature_perk_tech_5:0 "Діти Атома"
creature_perk_tech_5_desc:0 "Мутації – не завжди приємна річ. Але еволюція – не про красу. Коли з’являється вільна екологічна ніша, Пустка створює власних хижаків."

creature_perk_tech_6:0 "Елітні зразки"
creature_perk_tech_6_desc:0 "Ми відбираємо найсильніших особин для розведення. Це не швидкий процес, але результат виправдає кожен день очікування."

creature_perk_tech_7:0 "Дарвінівська стратегія"
creature_perk_tech_7_desc:0 "Шляхом стресу та селекції ми розкрили нові таланти істот. Їхня бойова ефективність – безсумнівна. Але дехто вже питає, чи потрібні їм дресирувальники взагалі..."


