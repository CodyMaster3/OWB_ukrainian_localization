tactics_doctrine_tech:0 "Нові роздоріжжя"
tactics_doctrine_tech_desc:0 "Різні ландшафти – різні виклики: від палаючих боліт до розсипаних гірських стежок. Одного лиш виживання недостатньо – ми повинні навчитися пристосовуватись і процвітати.\n\nЗаодно варто вдосконалити й розширити наші сили спеціального призначення."
terrain_harsh_tech:0 "Град і Крижана Злива"
terrain_harsh_tech_desc:0 "Після шквалу граду і сльоти чути лиш роздратоване бурчання солдатів. Але у ці тривожні часи вибору немає. Щоб вистояти, ми забезпечимо підрозділи відповідним спорядженням і знаннями для боротьби в складній місцевості.\n\n"
terrain_harsh_tech_2:0 "Проти Вітру"
terrain_harsh_tech_2_desc:0 "Солдати часто розповідають, як вітер зриває документи й припаси. Там, де інші страждають – наші спецпризначенці навчені рухатися з вітром. Куди дме вітер – туди йдемо ми.\n\n"
terrain_harsh_tech_3:0 "Вогняні Стежки"
terrain_harsh_tech_3_desc:0 "Роботам важко проходити крізь болота й вузли трави. Пропонується просте рішення – легке запалювальне спорядження. Воно дозволить роботам прокладати собі шлях полум’ям.\n\n"
terrain_harsh_tech_4:0 "Жодна Відстань Не Надто Дика"
terrain_harsh_tech_4_desc:0 "Зміцнивши корпус і технічну витривалість нашої техніки, жодна місцевість не стане на заваді. Прощавайте, забиті труби й застряглі колеса – тепер ми прокладаємо шлях крізь труднощі, як ніж крізь масло.\n\n"

terrain_plains_tech:0 "Обережна Хода"
terrain_plains_tech_desc:0 "Далекі рівнини для звичайного солдата – це просто довга дорога. Але для наших – це перевага. Легка хода й тиха хода дозволяють їм лишати ворога мертвим, ще до того як той зрозуміє, що сталося.\n\n"
terrain_plains_tech_2:0 "Тихі Луги"
terrain_plains_tech_2_desc:0 "Як і піхота, спецпризначенці знають, як рухатися рівнинами без шуму. Та на додачу – вони майстри маскування й створення прихованих укриттів для відпочинку й лікування.\n\n"
terrain_plains_tech_3:0 "Око Через Пісок"
terrain_plains_tech_3_desc:0 "Роботи ще не повністю пристосовані до рівнин. Тож оптимізувавши їх системи розпізнавання, ми значно підвищимо точність виявлення ворогів на тлі оточення.\n\n"
terrain_plains_tech_4:0 "Володарі Прерій"
terrain_plains_tech_4_desc:0 "Наші машини, як і війська, отримають камуфляжне забарвлення. Ця проста зміна допоможе їм діяти приховано й стати частиною ландшафту.\n\n"

terrain_mountain_tech:0 "Вузькі Ущелини"
terrain_mountain_tech_desc:0 "У горах повно вузьких ущелин. Звичайному солдату крізь них не пройти, але ми не такі. Зі спрощеним спорядженням наші воїни зможуть використовувати ці проходи як перевагу.\n\n"
terrain_mountain_tech_2:0 "Гірські Схованки"
terrain_mountain_tech_2_desc:0 "Поки піхота ховається в ущелинах, спецпризначенці облаштовують бази в печерах. Так ми отримаємо приховані маршрути для лікування і перегрупування.\n\n"
terrain_mountain_tech_3:0 "Повелителі Скель"
terrain_mountain_tech_3_desc:0 "Де людині не пройти – робот впорається. Використовуючи зібрану інформацію, наші роботи безпечно пересуваються навіть найдикішими схилами.\n\n"
terrain_mountain_tech_4:0 "Жодна Гора Не Перешкода"
terrain_mountain_tech_4_desc:0 "Зі зміцненими шинами й металом, наші машини здатні проїжджати гірськими дорогами, ніби шосе. Досвідчені водії без проблем обійдуть будь-які труднощі.\n\n"

terrain_jungle_tech:0 "Тихі Схованки"
terrain_jungle_tech_desc:0 "Серед ліан і хащ джунглів – ідеальні укриття. Якщо навчити наших солдатів користуватися ними – ми завжди матимемо перевагу несподіванки.\n\n"
terrain_jungle_tech_2:0 "Околицеві Кишені"
terrain_jungle_tech_2_desc:0 "Колючки й зарості – це природна пастка. Наші війська навчаться перетворювати їх на ідеальні точки засідки.\n\n"
terrain_jungle_tech_3:0 "Наглядачі З-Дерева"
terrain_jungle_tech_3_desc:0 "Маючи перевагу висоти й маскування, наші роботи вивчають дерева як платформу атаки. Противник не побачить удару, що прийде згори.\n\n"
terrain_jungle_tech_4:0 "Єдині з Землею"
terrain_jungle_tech_4_desc:0 "Камуфляж для техніки – ще один крок до ідеального злиття з оточенням. Наш контроль над джунглями буде незаперечний.\n\n"

tactics_spec_ops_cap_tech:0 "Новобранці"
tactics_spec_ops_cap_tech_desc:0 "Щоб збільшити кількість дивізій спецпризначення, ми повинні розширити зону рекрутингу та шукати найкращих кандидатів серед піхоти.\n\n"
tactics_spec_ops_cap_tech_2:0 "Розширення Штатів"
tactics_spec_ops_cap_tech_desc:0 "Ускладнивши структуру рангів, ми можемо гарантувати просування кращих рекрутів та мотивувати інших до зростання. Так ми зможемо швидко поповнити молодші ранги.\n\n"
tactics_spec_ops_cap_tech_3:0 "Сквадрони Підйому"
tactics_spec_ops_cap_tech_3_desc:0 "Підтримуючи взаємодію між підрозділами, ми зможемо створити основу для сквадронів, що впишуться у нашу структуру. Це дозволить вводити нові навчальні дивізії без шкоди для бойових сил.\n\n"
tactics_spec_ops_offense_tech:0 "Перевага Вогнем"
tactics_spec_ops_offense_tech_desc:0 "Оснастивши спецпризначенців озброєнням під будь-яку ситуацію, ми забезпечимо перемогу ще до початку бою.\n\n"
tactics_spec_ops_defense_tech:0 "Посилений Авангард"
tactics_spec_ops_defense_tech_desc:0 "Найкращий захист – це напад. Через агресивні доктрини ми сформуємо потужний авангард для прориву ворожих ліній.\n\n"
tactics_spec_ops_light_tech:0 "Сміливість і Рухливість"
tactics_spec_ops_light_tech_desc:0 "Полегшивши спорядження та використовуючи новітні технології, ми забезпечимо максимальну мобільність наших спецпризначенців.\n\n"
tactics_spec_ops_heavy_tech:0 "Сталева Витримка"
tactics_spec_ops_heavy_tech_desc:0 "Навантаживши підрозділи спорядженням на всі випадки, ми зробимо їх здатними тримати позицію без підтримки тилу.\n\n"
tactics_spec_ops_elite_tech:0 "Відточена Еліта"
tactics_spec_ops_elite_tech_desc:0 "Відокремивши кращих солдатів у власний елітний корпус, ми отримаємо підрозділ, здатний виконати будь-яке завдання з максимальною ефективністю."


terrain_harsh_tech_5:0 "Міцні, Як Наші Джерела"
terrain_harsh_tech_5_desc:0 "Ми процвітатимемо там, де інші навіть не виживають. \n\n"
terrain_plains_tech_5:0 "Широкий Крок"
terrain_plains_tech_5_desc:0 "На відкритій місцевості слабким ніде сховатися. Ми переслідуємо ворога безжально – й не спинимось.\n\n"
terrain_mountain_tech_5:0 "Гени Витривалості"
terrain_mountain_tech_5_desc:0 "Там, де людина захекається, а машини застрягають – ми йдемо вперед. Найвищі вершини належать нам.\n\n"
terrain_jungle_tech_5:0 "Як Великі Дуби"
terrain_jungle_tech_5_desc:0 "Ліси й джунглі прагнуть відновити світ. І ми – частина цієї сили. Наші засідки зроблять землю багатшою... від тіл ворогів.\n\n"

terrain_harsh_tech_6:0 "Найгірші Місця"
terrain_harsh_tech_6_desc:0 "Штурм зруйнованих міст, радіаційні бурі чи болотні нетрі – все це вимагає особливої підготовки. Але ми перетворимо слабкість на силу."
terrain_plains_tech_6:0 "Все, Що Торкається Світла"
terrain_plains_tech_6_desc:0 "Ми не маємо такої дальності, як вогнепальна зброя, але пустелі й рівнини – ідеальне місце, щоб наздогнати й розірвати ворога. Треба лише діяти обережно."
terrain_mountain_tech_6:0 "Старші За Дерева"
terrain_mountain_tech_6_desc:0 "Кістки гір виникли у прадавні часи – як і наші гени. З найвищих хребтів ми обрушимося на ворога з іклами й люттю."
terrain_jungle_tech_6:0 "Хитрі Дівчатка"
terrain_jungle_tech_6_desc:0 "Зелені хащі – ідеальні мисливські угіддя. Ми наближаємось тихо, невидимо, і здобич навіть не зрозуміє, що вже пізно."
