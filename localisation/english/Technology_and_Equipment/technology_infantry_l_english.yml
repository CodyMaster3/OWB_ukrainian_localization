  skate_infantry:0 "Ковзанкова піхота"
  skater_tech:0 "Роликові ковзани"
  rocket_skater_tech:0 "Реактивні ковзани"
  skate_equipment:0 "Ковзанкове спорядження"
  skate_equipment_desc:0 "Хоча це й не типовий спосіб пересування по полю бою, важко заперечити ефект жаху, який справляють спритні солдати, що врізаються в лінії ворога на великій швидкості. На жаль, точність і влучність при цьому знижується."
  skate_equipment_1:0 "Роликові ковзани"
  skate_equipment_1_desc:0 "Хоча це й не типовий спосіб пересування по полю бою, важко заперечити ефект жаху, який справляють спритні солдати, що врізаються в лінії ворога на великій швидкості. На жаль, точність і влучність при цьому знижується."
  skate_equipment_2:0 "Реактивні ковзани"
  skate_equipment_2_desc:0 "Звичайні ковзани значно підвищують швидкість пересування солдата, але реактивні ковзани дозволяють перетворити інерцію на зброю для нищівних лобових атак. Як наслідок, вони значно складніші у виготовленні та обслуговуванні – і суттєво ускладнюють дії, що вимагають точності чи оборони в статиці."

