 #----------------------------
 # Підготовка Піхоти
 #----------------------------
  unit_training_tech_1:0 "Підготовка воїнів"
  unit_training_tech_1_desc:0 "Базова перебудова нашої програми підготовки, що зосереджена на курсах стресостійкості та постійних командних навчаннях. Це дозволяє нам виявити недисциплінованих чи психічно нестійких бійців ще до завершення підготовки, зменшуючи її загальну тривалість."
  unit_training_tech_2:0 "Підготовка міліції"
  unit_training_tech_2_desc:0 "Військові навчання, спрямовані на базову оборону, проводяться серед усієї нашої армії. Основи – це партизанська тактика, правильне ведення боїв і укріплення польових позицій."
  unit_training_tech_3:0 "Партизанська тактика"
  unit_training_tech_3_desc:0 "Поглиблення знань у сфері партизанської війни та тренування з виживання у пустках дозволяють нашій армії атакувати з неочікуваних напрямків та використовувати рельєф або піщані бурі на свою користь."
  unit_training_tech_4:0 "Підготовка взводів"
  unit_training_tech_4_desc:0 "Підготовка офіцерів та організація взводів дозволяє спростити командні структури порівняно з розрізненими загонами міліції. Лейтенанти, навчені тактичному мисленню, підвищують оперативну готовність наших військ."
  unit_training_tech_5:0 "Базові вправи"
  unit_training_tech_5_desc:0 "Стандартизовані фізичні вправи та інтенсивні тренування збільшують витривалість і стійкість наших солдатів. Поєднання цього з навчанням тактичного відступу дозволяє їм швидше перегруповуватись після невдалого наступу або відступу."
  unit_training_tech_6:0 "Механізована підготовка"
  unit_training_tech_6_desc:0 "Механізовані операції в поєднанні з моторизацією дозволяють нам швидко задіяти мобільні загони для стримування ворога, водночас пришвидшуючи підкріплення основних ударних сил."
  unit_training_tech_7:0 "Тактика утримання об’єктів"
  unit_training_tech_7_desc:0 "Масове постачання окопних лопаток усім солдатам, разом із спеціалізованою підготовкою щодо швидкого захоплення територій та очищення зон на рівні відділення, дозволяє нашим військам швидко закріплюватись на зайнятих позиціях."
  unit_training_tech_8:0 "Навчання у Віртуальній Реальності"
  unit_training_tech_8_desc:0 "Довоєнні тренажери, завантажені всіма нашими попередніми покращеннями в підготовці, дозволяють швидше перетворювати новобранців у досвідчених солдатів з меншими витратами на навчальні табори."

 #----------------------------
 # Обладнання для Тяжкої Піхоти
 #----------------------------
  heavy_infantry_tech_1:0 "Енфорсери"
  heavy_infantry_tech_1_desc:0 "Хоча це обладнання не таке передове, як у спецпідрозділів чи силова броня, обмотування тіла металевими пластинами і підкладками все ж допомагає. Особливо корисне для придушення спротиву."
  heavy_infantry_tech_2:0 "Додаткове бронювання"
  heavy_infantry_tech_2_desc:0 "Посилення вразливих місць у броні Енфорсерів додатковими пластинами, а також заміна їхніх трофейних шоломів на військові зразки, значно підвищить їхню стійкість до стрілецької зброї. Так, це знизить їхню мобільність, але навряд чи хтось відмовиться від шансу вціліти після пострілу в голову."
  heavy_infantry_tech_3:0 "Підготовка до ближнього бою"
  heavy_infantry_tech_3_desc:0 "Завдяки набутому досвіду в експлуатації Енфорсерів ми можемо розробити єдину доктрину їхнього застосування у ближньому бою. Краща підготовка рукопашного бою та тактика придушення на рівні загонів значно підвищать їхню ефективність."
  heavy_infantry_tech_4:0 "Обладнання для придушення спротиву"
  heavy_infantry_tech_4_desc:0 "Хоча це й не рівень елітного оснащення чи силової броні, довоєнне обладнання для придушення заворушень дозволяє нашим військам ефективно боротись з повстаннями."
  heavy_infantry_tech_5:0 "Димові гранати"
  heavy_infantry_tech_5_desc:0 "Наші Енфорсери загартовані як у цивільних завданнях, так і у військових операціях. Наступним кроком має стати покращення їхнього оснащення: поєднання гранат для контролю натовпу та для створення димової завіси суттєво покращить їхні можливості як проти заколотників, так і проти вогневих точок супротивника."

 #----------------------------
 # Далекобійне Озброєння
 #----------------------------
  standard_weaponry_tech:0 "Стандартне озброєння"
  standard_weaponry_tech_desc:0 "Трубні пістолети легко виготовляти та обслуговувати завдяки їхній простоті, не потребують креслень, спеціальних матеріалів чи точної обробки через відсутність нарізів. Проте всі ці переваги роблять їх найбільш неефективною балістичною зброєю в пустці. Слід обрати шлях – спеціалізуватись на балістиці або ж на холодній зброї."

  melee_weaponry_tech_1:0 "Базова холодна зброя"
  melee_weaponry_tech_2:0 "Рубальна холодна зброя"
  melee_weaponry_tech_3:0 "Тяжка холодна зброя"
  melee_weaponry_tech_4:0 "Покращена холодна зброя"

  energy_weaponry_tech_1:0 "Базове енергетичне озброєння"
  energy_weaponry_tech_2:0 "Поширене енергетичне озброєння"
  energy_weaponry_tech_3:0 "Покращене енергетичне озброєння"
  energy_weaponry_tech_4:0 "Елітне енергетичне озброєння"

  ballistic_weaponry_tech_1:0 "Базове балістичне озброєння"
  ballistic_weaponry_tech_2:0 "Поширене балістичне озброєння"
  ballistic_weaponry_tech_3:0 "Покращене балістичне озброєння"
  ballistic_weaponry_tech_4:0 "Елітне балістичне озброєння"

  energy_weapon_emitter_tech:0 "Фокусувальні масиви"
  energy_weapon_emitter_tech_desc:0 "Оптичні фокусувальні системи, встановлені на наші нові енергетичні зразки, підвищують не лише точність, а й пробивну здатність, збільшуючи ефективність проти броньованих цілей."

  warrior_equipment:0 "Обладнання воїна"
  warrior_equipment_desc:0 "Забезпечення кожного солдата речами як-от сумки, спальні мішки, казанки та інструменти для обслуговування – це невелика ціна за підвищення бойового духу та ефективності."

  warrior_melee_tech:0 "Спрощені конструкції"
  warrior_melee_tech_desc:0 "Завдяки спрощеному дизайну багато видів холодної зброї дозволяють нашим солдатам діяти автономно, без безперервного постачання. Вони легкі та не потребують стільки боєприпасів і спорядження, як інші типи."

  overcharged_ammunition:0 "Перезаряджені боєприпаси"
  overcharged_ammunition_desc:0 "Якщо на етапі виробництва наші енергетичні осередки (MFC, ECP, EC) перезаряджати для більшої потужності, ми зможемо підвищити шкоду енергетичної зброї без потреби у модифікації самих зразків."

  custom_built_capacitors:0 "Кастомні конденсатори"
  custom_built_capacitors_desc:0 "Власноруч виготовлені конденсатори дозволяють точно регулювати потужність заряду, не зважаючи на обмеження заводських креслень."

  basic_infantry_equipment:0 "Базове піхотне обладнання"
  basic_infantry_equipment_desc:0 "Стандартизація індивідуального спорядження для кожного солдата підвищить ефективність підрозділів на всіх фронтах і додасть почуття єдності."

  prewar_infantry_kit:0 "Довоєнний комплект піхоти"
  prewar_infantry_kit_desc:0 "Впровадження комплекту спорядження, який використовувала довоєнна армія США, зробить наше військо рівним з арміями колишніх наддержав. Вражаюча перспектива."

 #----------------------------
 # Силова Броня
 #----------------------------
  stripped_pa_tech:0 "Трофейна силова броня"
  stripped_pa_tech_desc:0 ""

  weight_support_frame_pa_tech_1:0 "Рама силової броні"
  weight_support_frame_pa_tech_1_desc:0 "Покращення в електроніці, хоч і кустарні, дають невелику перевагу в бою. Шолом обладнано підсиленим забралом, респіратором, передавачем та ліхтарем – усе виглядає на професійну збірку."

  weight_support_frame_pa_tech_2:0 "Укріплення рами силової броні"
  weight_support_frame_pa_tech_2_desc:0 "Різний брухт перетворено на саморобні бронепластини для підвищення захисту. Вони не зупинять усе, але зменшать силу удару."

  wasteland_pa_tech:0 "Уціліла силова броня"
  wasteland_pa_tech_desc:0 ""

  scav_pa_tech:0 "Силова броня пустки"
  scav_pa_tech_desc:0 ""

  t45d_pa_tech:0 "Силова броня Т-45d"
  t45d_pa_tech_desc:0 "Т-45d вперше з’явилась у 2067-му, ефективно проявила себе в битвах на Алясці під час Операції «Анкоридж», але виявила і слабкі сторони. Попри недоліки, Т-45d залишається відносно дешевою і надійною платформою для важкого озброєння."

  c_t45d_pa_tech:0 "Композитна Т-45d"
  c_t45d_pa_tech_desc:0 "Експериментальна версія, що жертвує частиною захисту заради полегшеної конструкції. Менш надійна в польових умовах, але значно мобільніша та легша у виробництві."

  t60_pa_tech:0 "Силова броня Т-51b"
  t51b_pa_tech_desc:0 "Король довоєнного озброєння. Завдяки вдосконаленим матеріалам і конструкції, у 2076-му вона була вперше використана проти китайської агресії – і перевершила всі очікування. Навіть після війни Т-51b показує відмінні результати, поступаючись лише найновішим моделям."

  #c_t51b_pa_tech:0 "Mobile T-51C Composite Power Armour" #This tech was removed
  #c_t51b_pa_tech_desc:0 ""

  #----------------------------
  # Силова Броня (Продовження)
  #----------------------------
  jetpacks_pa_tech:0 "Реактивні ранці"
  jetpacks_pa_tech_desc:0 "Останні розробки в модифікації силової броні дозволили нашому війську використовувати реактивні ранці, вмонтовані у спину бронекостюмів. Це значно підвищує їхню наступальну спроможність."

  t51b_pa_tech:0 "Укріплена силова броня Т-51b"
  t51b_pa_tech_desc:0 "Король довоєнного озброєння. Завдяки вдосконаленим матеріалам і конструкції, у 2076-му броня була вперше використана проти китайської агресії – і відзначилась блискуче. Навіть сьогодні Т-51b залишається неймовірно ефективною, поступаючись лише найновішим післявоєнним зразкам."

  midwest_pa_tech:0 "Передова технічна броня"
  midwest_pa_tech_desc:0 "Автономний костюм передової технічної броні. Працює на мікроядерному реакторі з паливом на сто років. Братство Середнього Заходу адаптує й обслуговує його за допомогою локальних технологій."

  power_armour_enclave_1:0 "Передова силова броня"
  power_armour_enclave_1_desc:0 "Розроблена після війни уцілілими представниками уряду США – Анклавом. Прийнята на озброєння у 2220 році, вона значно перевершує всі попередні зразки."

  power_armour_enclave_2:0 "Передова силова броня МКII"
  power_armour_enclave_2_desc:0 "Створена через десятиліття після першої моделі, МКII покращує бойові характеристики завдяки новим матеріалам, міцнішій кераміці та повністю композитній структурі. Хоч і легша, ця броня забезпечує ще кращий захист."

  power_armour_bos:0 "Вашингтонська передова броня"
  power_armour_bos_desc:0 ""

  power_armour_legion:0 "Сегментата"
  power_armour_legion_desc:0 ""

  power_armour_raider:0 "Рейдерська силова броня"
  power_armour_raider_desc:0 ""

  texas_brotherhood_pa_tech:0 "Силова броня Vault-Tec"
  texas_brotherhood_pa_tech_desc:0 "Спроба компанії Vault-Tec створити повноцінний зразок силової броні."

  BAG_texas_brotherhood_pa_tech:0 "Прототип силової броні з Боулдера"
  BAG_texas_brotherhood_pa_tech_desc:0 "Спроба лабораторії Боулдер Дом створити працездатну силову броню."

  #----------------------------
  # Обладнання Спецпідрозділів
  #----------------------------
  spec_ops_equipment_tech_1:0 "Спорядження спецсил I рівня"
  spec_ops_equipment_tech_1_desc:0 ""
  spec_ops_equipment_tech_2:0 "Спорядження спецсил II рівня"
  spec_ops_equipment_tech_2_desc:0 ""
  spec_ops_equipment_tech_3:0 "Спорядження спецсил III рівня"
  spec_ops_equipment_tech_3_desc:0 ""
  spec_ops_equipment_tech_4:0 "Спорядження спецсил IV рівня"
  spec_ops_equipment_tech_4_desc:0 ""
  spec_ops_equipment_tech_5:0 "Спорядження спецсил V рівня"
  spec_ops_equipment_tech_5_desc:0 ""

  spec_ops_enclave_1:0 "Броня спецсил HERMES"
  spec_ops_enclave_1_desc:0 "Розроблена підрозділом Poseidon Energy разом з Міністерством Оборони, HERMES мала стати проміжною ланкою між силовою бронею та бойовим костюмом, надаючи загонам спецпризначення більшу гнучкість (та меншу вартість). Анклав намагався зберегти розробку в таємниці, але деякі ниточки таки залишилися в мережі PoseidonNet..."

  hardening_armour_tech:0 "Укріплення броні"
  hardening_armour_tech_desc:0 "Захисні покриття, вдосконалені сплави або просто геніальна конструкція – що б ми не обрали, усе це підвищує стійкість солдатів у бою."

  simple_servo_tech:0 "Прості серво-механізми"
  simple_servo_tech_desc:0 "Базові гідравлічні приводи та допоміжні мотори покращують спритність солдатів у полегшеній броні та відкривають можливість відновлення пошкодженого довоєнного спорядження."

  advanced_servo_tech:0 "Передові серво-механізми"
  advanced_servo_tech_desc:0 "Механізми, що майже досягають рівня довоєнних зразків, підвищують мобільність солдатів у полі та дозволяють перейти до нової ери розвитку силової броні."

  high_pressure_hydraulics_tech:0 "Гідравліка високого тиску"
  high_pressure_hydraulics_tech_desc:0 "Системи підвищеного тиску збільшують швидкість руху в силовій броні та дозволяють встановлювати важчі бронепластини."

  ballistic_fibre_tech:0 "Балістичні волокна"
  ballistic_fibre_tech_desc:0 "Розробка матеріалів, стійких до пострілів, таких як кевлар чи тефлон, і їхнє використання у бронежилетах та бойових костюмах підвищує виживаність спецсил."

  stealth_boy_tech:0 "Пристрої Стелс-Бой"
  stealth_boy_tech_desc:0 "Індивідуальні модулятори заломлення світла (стелс-бої) чудово підходять для засідок, шпигунства та інших таємних операцій."

  night_vision_tech:0 "Пристрої нічного бачення"
  night_vision_tech_desc:0 "ІЧ-зображення, вбудоване в оптику та окуляри, дозволяє значно підвищити ефективність підрозділів у темряві."

  thermal_vision_tech:0 "Тепловізійні пристрої"
  thermal_vision_tech_desc:0 "На відміну від ІЧ-пристроїв, тепловізори не потребують підсвітки чи передавача, покращуючи бойову ефективність у нічних умовах."

  #----------------------------
  # Спеціальне
  #----------------------------
  military_heritage_tech_1:0 "Минулі перемоги"
  military_heritage_tech_1_desc:0 "Наші солдати йдуть у бій із високими очікуваннями – їх підганяє спадок перемог і поразок, здобутих на цій землі. Це мотивує та зміцнює дух."

  military_heritage_tech_2:0 "Довгий марш"
  military_heritage_tech_2_desc:0 "Шлях до війни довгий і важкий. Але ми можемо бути готові. Постійні військові вправи й непохитні традиції підготують нас до найгіршого. Ворог не чекає зустрічі з розлюченими загонами."

  military_heritage_tech_3:0 "Історична вогнепальна зброя"
  military_heritage_tech_3_desc:0 "Зброя наших солдатів – не просто рушниці та дробовики. Вони несуть у собі історію: вигравіюваний карабін, родинна реліквія, стара рушниця – кожна річ говорить про минуле."

  gauss_weaponry_1:0 "Гаусс-зброя"
  gauss_weaponry_2:0 "Гаусс-зброя II"

  plasma_weaponry_1:0 "Плазмова зброя"
  plasma_weaponry_2:0 "Плазмова зброя II"

