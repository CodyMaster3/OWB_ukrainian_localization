NCR_basic_infantry_equipment_desc:0 "На основі довоєнних модифікацій приватних гвинтівок, комплекти переобладнання ствола й механізмів збільшують дальність та вогневу міць стандартної Службової Гвинтівки."

NCR_prewar_infantry_kit:0 "Відновлені сенсорні модулі"
NCR_prewar_infantry_kit_desc:0 "Завдяки зворотному інжинірингу робочих зразків, техніки НКР частково відтворили електроніку для інфрачервоної та нічної оптики, що використовувалась у Броні Придушення Бунтів."

