magic_tech_category:0 "Магічні технології"
magic_tech_category_desc:0 ""

#----------------------------
# Techs
#----------------------------
horse_tech:0 "Хай живе дружба"
horse_tech_desc:0 "My Little Horse, My Little Horse, у чому ж суть дружби?"

loyalty_tech:0 "Вірність"
loyalty_tech_desc:0 "Цілься високо, малюк, але не в неможливе."

loyalty_tech_2:0 "Покращена вірність"
loyalty_tech_2_desc:0 "На 20% крутіше."

laughter_tech:0 "Сміх"
laughter_tech_desc:0 "Вічний хаос іде в парі з шоколадним дощем! Люди, ШОКОЛАДНИЙ ДОЩ!!"

laughter_tech_2:0 "Покращений сміх"
laughter_tech_2_desc:0 "Робімо це в стилі Пінкі Пай!"

kindness_tech:0 "Доброта"
kindness_tech_desc:0 "Я б хотіла бути деревом."

kindness_tech_2:0 "Покращена доброта"
kindness_tech_2_desc:0 "ТИ МЕНЕ ПОЛЮБИШ!"

honesty_tech:0 "Чесність"
honesty_tech_desc:0 "Чесність не принесе багато друзів. Але точно потрібних."

honesty_tech_2:0 "Покращена чесність"
honesty_tech_2_desc:0 "Дорога принцесо Селестіє, я нічого не вивчила — я завжди була права."

generosity_tech:0 "Щедрість"
generosity_tech_desc:0 "Найкраща поні, кінець дискусії."

generosity_tech_2:0 "Покращена щедрість"
generosity_tech_2_desc:0 "З усіх можливих речей, це — НАЙГІРШЕ, ЩО МОГЛО СТАТИСЯ!"

love_letters_tech:0 "Любовні листи"
love_letters_tech_desc:0 "Дорога принцесо Селестіє....."

advanced_love_letters_tech:0 "Покращені любовні листи"
advanced_love_letters_tech_desc:0 "Сьогодні я дізналась, що гармати — це боляче."

friendship_language_tech:0 "Мова дружби"
friendship_language_tech_desc:0 "Якщо ти говориш так, що тебе розуміють лише друзі — ти опанував мистецтво таємниць."

advanced_friendship_language_tech:0 "Покращена мова дружби"
advanced_friendship_language_tech_desc:0 "Поки навіть твої друзі вже не розуміють тебе."

magic_tech:0 "Магія"
magic_tech_desc:0 "Книжки, книжки, книииижки, КНИЖКИ! КННННИЖКИ!!!"

elements_tech:0 "Елементи Гармонії"
elements_tech_desc:0 "Бачиш, Найтмер Мун, коли ці Елементи запалюються... іскрою, що живе в кожному з нас, вони створюють шостий елемент: Магію!"

pacification_beam_tech:0 "Райдугопромінь умиротворення"
pacification_beam_tech_desc:0 "Я несу в собі наймогутнішу магію — райдугові промені дружби!"

orbital_friendship_cannon_tech:0 "Орбітальна гармата дружби"
orbital_friendship_cannon_tech_desc:0 "Досить слів. Знищує всіх недружніх за 3 секунди."

ponykind_tech:0 "Поні-Рід"
ponykind_tech_desc:0 "Живуть мирно й гармонійно в Еквестрії. Продуктивні, заможні й закохані у Дружбу."

earth_pony_tech:0 "Земно-поні"
earth_pony_tech_desc:0 "Працьовиті, з глибоким зв’язком із землею. Навіть пустелю перетворять у яблучний сад."

unicorn_tech:0 "Єдинороги"
unicorn_tech_desc:0 "Пихаті й витончені, але володіють магією. З'являються коли потрібно — або ні. Можливо, наймогутніші серед трьох рас поні."

pegasus_tech:0 "Пегаси"
pegasus_tech_desc:0 "Повелителі неба, швидкі, спритні, здатні керувати погодою. Краще з ними не жартувати."

everybody_can_be_reformed_tech:0 "Ніхто не поза спільноти!"
everybody_can_be_reformed_tech_desc:0 "Навіть найогиднішу істоту можна навернути до дружби. Якщо стріляти в неї достатньо довго райдуговими променями."

changeling_tech:0 "Чейнджлінги"
changeling_tech_desc:0 "Комахоподібні істоти, здатні змінювати вигляд. Живляться любов’ю інших як паразити."

gryphon_tech:0 "Грифони"
gryphon_tech_desc:0 "Горді одинаки, що люблять лише себе. Класичні забіяки зі шкільного двору."

dragon_tech:0 "Дракони"
dragon_tech_desc:0 "Величезні, самітні, з вогненним диханням. Краще їх не злити."