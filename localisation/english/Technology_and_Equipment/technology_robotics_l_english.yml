#----------------------------
# Робототехніка
#----------------------------
robot_automation_tech:0 "Автоматизація"
robot_automation_tech_desc:0 "Досягнення у сфері робототехніки та штучного інтелекту можна ефективно застосувати. Встановлення простих механічних рук для зварювання, закручування болтів і роботи на базових конвеєрах прискорить виробництво. Ці дослідження також відкривають шлях для перспективного військового використання."

robot_makeshift_automatons_tech:0 "Автомати"
robot_makeshift_automatons_tech_desc:0 "Ці «роботи з брухту» — промислові машини з приводом, двома кулеметами малого калібру та корпусом зі скрапу, який захищає важливі компоненти. Вони дають тактичну перевагу як дешеві ударні одиниці, броньовані укриття для піхоти й спосіб заповнення втрат у бойових частинах."

robot_build_efficiency_tech_1:0 "Спеціалізовані Механіки"
robot_build_efficiency_tech_1_desc:0 "Хоч наші механізовані підрозділи показали добрі результати, їхня складність заважає широкому використанню. Для фронтового застосування нам потрібно виділити персонал на обслуговування й складання. Але це суттєво вичерпає наші людські ресурси."

robot_build_efficiency_tech_2:0 "Покращене Виробництво"
robot_build_efficiency_tech_2_desc:0 "Зі зростанням залежності від роботів ростуть і витрати. Ми перенаправимо більше фінансування в розробку виробничих процесів, але для цього доведеться перевести ще більше людей у механісти — що послабить інші галузі."

robot_build_efficiency_tech_3:0 "Максимальна Ефективність"
robot_build_efficiency_tech_3_desc:0 "Зрештою, майже всі наші громадяни працюватимуть на заводах із виготовлення роботів. Дванадцятигодинні зміни з наглядом, заміна працівників напоготові — ось вершина ефективності. Що таке кілька життів у цеху, якщо це рятує сотні на полі бою?"

robot_miniature_thruster_tech:0 "Мініатюрні Рушії"
robot_miniature_thruster_tech_desc:0 "Рушії дозволяють роботам швидше пересуватись по пересіченій місцевості. Хоча через гіроскопи, контррушії та реактори їх важко виготовляти, ці пристрої надзвичайно корисні для розвідки та флангових ударів."

robot_fission_batteries_tech:0 "Ядерні Батареї"
robot_fission_batteries_tech_desc:0 "Довоєнні портативні джерела енергії — ці батареї працюють завдяки ядерному поділу та хімічним реакціям. Хоч ми не розуміємо всіх деталей, встановлення великих батарей із вуличних ламп значно покращить автономність роботів."

robot_armour_hardening_tech:0 "Укріплення Броні"
robot_armour_hardening_tech_desc:0 "Більшість роботів мають легкий корпус із алюмінію для тривалої роботи. Але в наших умовах це неприйнятно — ми посилимо броню промисловими металевими сплавами."

robot_high_power_optics_tech:0 "Потужна Оптика"
robot_high_power_optics_tech_desc:0 "Стандартна оптика непридатна для бою. Ми замінимо її на армійські та промислові модулі, які дадуть роботам повноцінну вогневу ефективність."

robot_advanced_power_systems_tech:0 "Покращені Джерела Енергії"
robot_advanced_power_systems_tech_desc:0 "Більшість роботів працюють або від розетки, або від малоефективних батарей. Ми замінимо їхні системи живлення на мініатюрні ядерні ядра — значно ефективніші та стабільніші."

robot_handy_tech:0 "Містер Хенді"
robot_handy_tech_desc:0 "Хоч ці домогосподарські боти з довоєнних фабрик і створені для прибирання, їх легко переобладнати в бойову одиницю. Додати броню, замінити вогнемет на лазерний пістолет — і в нас буде доступний і ефективний бойовий робот."

robot_handy_equipment_tech_1:0 "Містер Хенді"

robot_gutsy_tech:0 "Містер Гатсі"
robot_gutsy_tech_desc:0 "Модифікований для бою варіант «Містера Хенді» — Містер Гатсі — може замінити бойові одиниці за меншу вартість. Хоч ми не можемо створити оригінальні компоненти, ми обладнаємо його загартованою сталлю й потужною лазерною зброєю."

robot_handy_equipment_tech_2:0 "Містер Гатсі"
robot_handy_equipment_tech_3:0 "Містер Бласто"
robot_handy_equipment_tech_4:0 "Містер Бласто Mk2"

robot_gutsy_hardening_tech:0 "Зміцнення Гатсі"
robot_gutsy_hardening_tech_desc:0 "Перегляд схеми броні дозволить витримувати стрілецьку зброю. Суцільнозварна конструкція, менше стиків — і наші роботи довше залишаються в бою, прикриваючи солдатів."

robot_fuel_refinement_tech:0 "Очищення Пального"
robot_fuel_refinement_tech_desc:0 "Старе пальне було непридатним для стабільної роботи. Стандартизоване виробництво та нова формула зменшать осад у фільтрах і потребу в обслуговуванні."

robot_flamethrower_tech:0 "Полуметна Надбудова"
robot_flamethrower_tech_desc:0 "Дослідження знятих вогнеметів дозволило створити нову версію: броньований бак під тиском, вдосконалене пальне з токсичними побічними ефектами — ідеальне рішення для штурмових роботів."

robot_antigrav_tech:0 "Антигравітаційні Двигуни"
robot_antigrav_tech_desc:0 "Заміна складної системи рушіїв на антигравітаційний двигун дозволяє роботам пересуватись без переналаштування, швидше та простіше. Менше сенсорів, менше збоїв, без підвищених витрат."

robot_cnc_support_multiple_units_tt:0 "\n§GКомандні роботи (CnC-боти) необхідні для підрозділів роботів, бо дають бонус до організації та покращують бойові можливості.\n\n Дослідження в гілці «Автоматизована війна» дозволить оснащувати дивізії трьома CnC-модулями замість одного.§!"

robot_command_equipment_tech_1:0 "CnC-Бот"
robot_command_equipment_tech_1_desc:0 "Первинно створені як мобільні транслятори, робоочі стали бойовими одиницями спостереження, розвідки та поліції. Куляста форма та монтажна точка дозволяють оснастити їх достатнім озброєнням."

robot_command_equipment_tech_2:0 "Робооко"
robot_command_equipment_tech_2_desc:0 "Робоочі — легкі бойові роботи на базі медіа-дронів, оснащені легкими лазерними кулеметами та корпусом з дюрафрейму. Найкраща одиниця легкої підтримки, яку ми можемо створити."

robot_command_equipment_tech_3:0 "Робомозок"
robot_command_equipment_tech_3_desc:0 "Гусеничне шасі, зварена рама з товстої броні, спритні роботизовані руки та вбудовані лазерні гармати — усе це є основою дизайну Робомозку. Останній штрих — герметична броньована капсула, в якій знаходиться промитий мозок: тварини, страченого злочинця або добровольця. Це дозволяє роботам реагувати на загрози миттєво, бути не менш ефективними, ніж піхота, і водночас відкриває шлях до технологій продовження життя — ціною людяності."

robot_protectron_tech_1:0 "Комерційний Протектрон"
robot_protectron_tech_1_desc:0 "Часто звані «смітниками на ніжках» через незграбний вигляд, ці цивільні роботи можуть стати живим щитом для нашої піхоти. Замінивши їхній крихкий корпус на стальний і оснастивши ручними лазерними кулеметами з посиленими боєприпасами, ми максимально розкриємо їхній потенціал."

robot_protectron_equipment_tech_1:0 "Комерційний Протектрон"
robot_protectron_tech_2:0 "Охоронний Протектрон"
robot_protectron_tech_2_desc:0 "Протектрони безпеки (Mark 2) — вдосконалені моделі для легкої поліцейської служби від RobCo. Завдяки новому корпусу, скороченим лазерним ПП і болтовій броні ці роботи перетворюються на серйозну загрозу."

robot_protectron_equipment_tech_2:0 "Охоронний Протектрон"

robot_alloy_tech:0 "Спеціалізовані Сплави"
robot_alloy_tech_desc:0 "Роботи не витримують таке навантаження, як техніка, тому потрібні полегшені сплави, що прості у виробництві. Вони знижують навантаження на сервоприводи та дозволяють використовувати товщу та складніші форми броні."

robot_precision_motor_tech:0 "Точні Приводи"
robot_precision_motor_tech_desc:0 "Старі серво — дешеві недобитки довоєнної економії. Нові приводи з кращими шестернями покращать реакцію роботів. Побічний ефект — відмінні результати в ближньому бою, аж до зламаних шоломів ПБ."

robot_assaultron_tech:0 "Ассолтрон"
robot_assaultron_tech_desc:0 "Середній робот для ближнього бою. Висока мобільність, розвинений процесор, лазерний промінь і бойові кігті роблять його смертоносним на передовій."

robot_assaultron_equipment_tech_1:0 "Ассолтрон"
robot_assaultron_equipment_tech_2:0 "Ассолтрон Mk2"

robot_lifter_equipment_tech:0 "Робот-Вантажник"
robot_lifter_equipment_tech_desc:0 "Хоч створений для логістики, цей важкий робот може бути перетворений на бойову одиницю. Броня, заміна лап на зброю, зняття зайвих компонентів — і ми отримуємо платформу під легкі ракетомети та лазерні кулемети."

robot_cooling_systems_tech:0 "Системи Охолодження"
robot_cooling_systems_tech_desc:0 "Лазери сильно перегріваються. Ми приберемо зайві компоненти навколо зброї, додамо масляне охолодження, і роботи зможуть вести вогонь довше без заміни лінз."

robot_sentry_bot_equipment_tech_1:0 "Сторожовий Бот"
robot_sentry_bot_equipment_tech_1_desc:0 "Броньована гора з триколісним приводом — це Сторожовий Бот Mk1. Базовий дизайн змінено мінімально: замінено ракетомет і гатлінг-лазер на власні модифікації."

robot_cooling_systems_tech_2:0 "Покращене Охолодження"
robot_cooling_systems_tech_2_desc:0 "Збільшені процесори й реактори гріються сильніше. Ми встановимо швидкі вентилятори й охолоджувальну систему на зразок тих, що були в довоєнних суперкомп’ютерах."

robot_sentry_bot_equipment_tech_2:0 "Сторожовий Бот Mk2"
robot_sentry_bot_equipment_tech_2_desc:0 "Після аналізу боїв ми створили Mk2. Оснащений двома потужними лазерними гатлінгами, цей робот знищує піхоту миттєво, а завдяки ядерному ядру пробиває легку броню за секунди."

robot_military_hardware_tech:0 "Військове Обладнання"
robot_military_hardware_tech_desc:0 "Заміна брухт-плат на відновлені військові компоненти — складна, але корисна справа. Краще обчислення, сервозв’язок і резерви живлення піднімуть ефективність на новий рівень."

robot_impact_resistant_chassi_tech:0 "Ударостійке Шасі"
robot_impact_resistant_chassi_tech_desc:0 "Попри потужну броню, удари всередині можуть пошкодити компоненти. Внутрішній шар із кевлару та піни поглине вібрацію й захистить електроніку."

robot_organic_processor_tech:0 "Органічні Процесори"
robot_organic_processor_tech_desc:0 "Нехай це й неетично, ми можемо використати людський мозок як процесор. Герметичні капсули забезпечують «живим мізкам» безпеку, а дослідження їх структури допомагає вдосконалити інші комп’ютери."

robot_securitron_tech_1:0 "Сек’юрітрон"
robot_securitron_tech_1_desc:0 "Охоронний робот із моноколесом і зварним титановим корпусом. Захищений від дрібної зброї. Озброєний ПП 9мм і лазерним X-25 для ближнього бою."

robot_scurry_tech:0 "Скаррі-Сальважер"
robot_scurry_tech_desc:0 "Малі павукоподібні роботи для підземних засідок. Гострі лапи, сейсмодатчики та кігті — усе, що потрібно, щоб пробити легку броню ворога зсередини."

robot_humanoid_tech:0 "Гуманоїд C-27"
robot_humanoid_tech_desc:0 "Двоногий робот із сенсорами для розпізнавання цілей у всіх спектрах. Озброєний як піхотинець, але з бронею з композитів, захистом від ЕМІ та важким озброєнням."

robot_pacification_bot_tech:0 "Надважкі Чотириногі"
robot_pacification_bot_tech_desc:0 "Робот на чотирьох ногах із бронею, як у танка. Замість гармат — роторні лазери, покращена рухливість і функції командного пункту."

robot_behemoth_robot_tech:0 "Надважкий Колос"
robot_behemoth_robot_tech_desc:0 "Гігантська машина. Раніше мала 4 кулемети .50, тепер — чотири 20мм автопушки. Броня тримає навіть плазму чи корабельні снаряди. Це ходячий апокаліпсис."

robot_securitron_grenade_software_tech:0 "Драйвер Гранатомета G-28"
robot_securitron_grenade_software_tech_desc:0 "§cВідкриває основну зброю Сек’юрітрона:§! G-28 — автоматичний гранатомет для ближнього бою."

robot_securitron_missile_software_tech:0 "Драйвер Ракет M-235"
robot_securitron_missile_software_tech_desc:0 "§cВідкриває основну зброю Сек’юрітрона:§! M-235 — ракетомет для далеких і ППО-ударів."

robot_securitron_self_repair_tech:0 "Драйвер Автономного Ремонту"
robot_securitron_self_repair_tech_desc:0 "§cВідкриває систему ремонту:§! Сек’юрітрон самостійно відновлює пошкодження."

platinum_os_tech:0 "Операційна Система Mark 2"

robot_securitron_cnp_tech:0 "Командна Навігаційна Програма"
robot_securitron_cnp_tech_desc:0 "ПЗ для комунікації та координації між одиницями. Збільшує ефективність на полі бою. Ми всі погоджуємось із цим."

# Заголовки
HEADER_LIGHT_ROBOT:0 "Легкі Роботи"
HEADER_ROBOT_SUBTECH:0 "Поліпшення Роботів"
HEADER_MEDIUM_ROBOT:0 "Середні Роботи"
HEADER_ROBOT_SUBTECH_1:0 "Удосконалення Робототехніки"
HEADER_HEAVY_ROBOT:0 "Важкі Роботи"