single_use_plane_tt:0 "§OОдноразове Використання! \n Ці літаки зникнуть після виконання місії.§!"

#----------------------------
# Авіація
#----------------------------
aerodynamics_tech:0 "Аеродинаміка"
aerodynamics_tech_desc:0 "Відсутнє у dev test"
aerodynamics_tech_1:0 "Моторизований Політ"
aerodynamics_tech_1_desc:0 "Хоча планери й катапульти придатні, ми повинні повернутися до керованих польотів. Найімовірніший шлях — використати існуючі хімічні двигуни у посиленій біплановій конструкції з гідравлічним керуванням хвоста і крил. Доступ до самостійного повітряного активу має вирішальне значення для контролю неба."
aerodynamics_tech_2:0 "Легкі Метали"
aerodynamics_tech_2_desc:0 "До цього моменту наші літаки складались з дерева та текстилю, але з потребою в більшій вантажопідйомності та жорсткості конструкції цього замало. Нам потрібен легкий сплав, міцний і дешевий, здатний витримати перевантаження. Експерименти зі сплавами відкриють шлях до нового покоління літаків."
aerodynamics_tech_3:0 "Розвиток Двигунів"
aerodynamics_tech_3_desc:0 "Хімічні двигуни наземних транспортів надають перевагу крутному моменту та надійності — що добре, але не для винищувачів. Ми можемо зосередитися на продуктивності. Завдяки цьому наші літаки матимуть швидкість і маневреність, достатню для перехоплення ворога в рекордні строки."
aerodynamics_tech_4:0 "Реактивні Двигуни"
aerodynamics_tech_4_desc:0 "Ці двигуни стискають повітря, нагрівають його у газовій турбіні та спрямовують через сопло. Це дає колосальний приріст у всіх характеристиках польоту, відкриваючи шлях до перших реактивних літаків у пустці."
aerodynamics_tech_5:0 "Передові Енергосистеми"
aerodynamics_tech_5_desc:0 "Атомні технології дозволяють створити більш гарячі реактивні струмені, підвищуючи тягу. Повітря проходить крізь ядерне ядро, нагріваючись до понад 2000°C, а потім спрямовується до сопла. Така система проста, ефективна та позбавлена пального."
aerodynamics_tech_6:0 "Адаптивна Компоненталізація"
aerodynamics_tech_6_desc:0 "Глибше розуміння внутрішньої конструкції наших літаків дозволяє створювати спеціальні протипожежні перегородки й бронепластини, що захищають критичні підсистеми. Шрапнель та кулі більше не спричинятимуть катастрофічної шкоди одразу кільком частинам машини."
aerodynamics_tech_7:0 "Протокол 'Фортеця'"
aerodynamics_tech_7_desc:0 "Протокол 'Фортеця' — це процедура аварійного реагування для наших дирижаблів. Усі несуттєві члени екіпажу проходять навчання й готуються до вогневої підтримки або усунення пошкоджень у надзвичайних ситуаціях."

fighter_engine_tech:0 "Уприскування Пального"
fighter_engine_tech_desc:0 "На відміну від карбюраторів, уприскування подає пальне під тиском, що дає стабільніший результат під час екстремальних маневрів і підвищує продуктивність двигуна."

cas_defence_tech:0 "Оборонне Озброєння"
cas_defence_tech_desc:0 "Оборонні турелі з куленепробивним захистом та запальною амуніцією дозволяють забезпечити більшу площу покриття, захищаючи наші штурмовики у повітрі."

cas_offence_tech:0 "Наступальне Озброєння"
cas_offence_tech_desc:0 "Отвори у череві та хвості літаків дозволяють екіпажу переключитися з оборони на наступ. Вони зможуть обстрілювати наземні війська з висоти."

strat_internal_tech:0 "Внутрішні Бомбові Відсіки"
strat_internal_tech_desc:0 "Розміщення бомб всередині, а не зовні, зменшує опір повітрю й споживання пального. Це також збільшує дальність польоту та дещо покращує маневреність."

strat_external_tech:0 "Зовнішні Бомбові Кріплення"
strat_external_tech_desc:0 "Посилені підкрильні кріплення дозволяють нести більше бомб одночасно, доповнюючи внутрішні відсіки. Це дає можливість виконувати руйнівні місії чи тривалі стратсортування."

air_cabane_struts_tech:0 "Кабанові Стійки"
air_cabane_struts_tech_desc:0 "Металеві дроти, що з'єднують крила з фюзеляжем (і між собою в разі біпланів/трипланів), створюють додаткову жорсткість, необхідну для збереження форми та цілісності конструкції."

air_drop_tank_tech:0 "Скидні Баки"
air_drop_tank_tech_desc:0 "Зовнішні паливні баки, які можна скинути перед боєм або після спорожнення, дозволяють збільшити дальність польоту без шкоди для маневреності."

air_refuling_tech:0 "Повітряне Заправлення"
air_refuling_tech_desc:0 "Координація польоту та спеціалізовані системи дозволяють здійснювати заправлення у повітрі, розширюючи зону дії нашої авіації незалежно від наземної інфраструктури."

air_armor_tech:0 "Летюча Броня"
air_armor_tech_desc:0 "Застосування морських бронетехнік до дирижаблів дозволяє захищати їх так само, як танки. Товсті бронепластини, протиосколкові шари та захисне екіпірування екіпажу роблять їх надзвичайно живучими у бою."

inert_blimp_tech:0 "Інертний Підіймальний Газ"
inert_blimp_tech_desc:0 "Використання інертного газу у наших розробках легших-за-повітря апаратів — розумне рішення. Ці гази не займисті й давно відомі у цивільному й військовому застосуванні. Знання, що вже є, разом із природною стійкістю до ворожого вогню, зменшують імовірність займання наших дирижаблів."

flamable_blimp_tech:0 "Легкий Підіймальний Газ"
flamable_blimp_tech_desc:0 "Зосередження на легкому газі, який можна стиснути до значно вищого тиску, дозволяє наповнити балони з вищою щільністю. Це означає кращу підіймальну силу й, відповідно, збільшену стратегічну дальність. Ми зможемо завдавати ударів глибше по території ворога чи патрулювати далі від нашої мережі постачання."

payload_glider_tech:0 "Бомбові Планери"

glider_tech:0 "Планер"
glider_tech_desc:0 "Коли наші війська стикаються з дедалі більшими перешкодами, варто розглянути нестандартні рішення. Небо — межа для більшості пустельників, яким і так важко з водою чи їжею, не кажучи вже про транспорт. Наші інженери після низки виснажливих випробувань створили військовий планер, здатний атакувати з неба, оминаючи ворожу оборону. Запускається з рейкової катапульти, встановленої на кузові вантажівки. Безмоторний, озброєний двома пістолетами-кулеметами, кількома гранатами та щирими молитвами, він може підтримати фронт або прорватися в тил ворога. Катапульта на вантажівці забезпечує дальність, якої сам планер не мав би."

fighter_tech_1:0 "Біплан-винищувач"
fighter_tech_1_desc:0 "Керований політ знову стає можливим. Тепер ми можемо розвивати справжню сучасну армію. Матеріали все ще слабкі й важкі, тому біплан із жорстким каркасом ідеально підходить. Оснащений хімічним двигуном і двома кулеметами з водяним охолодженням, він синхронізований для стрільби через гвинт. Ручне скидання спеціальних вибухових снарядів замість звичайних гранат збільшує шкоду по легкоброньованих цілях. Нові структури постачання перетворюються на справжні аеродроми."

fighter_tech_2:0 "Моноплан-винищувач"
fighter_tech_2_desc:0 "З появою легких металів потреба в біплані відпадає. Для зменшення опору і підвищення швидкості краще підходить моноплан. Третій кулемет більшого калібру, повітряне охолодження та два підкрильні кріплення для 50-кг бомб роблять його потужним. Нові двигуни для авіації збільшують дальність і швидкість, дозволяючи перехоплювати ворожу авіацію та завдавати точкових ударів."

fighter_tech_3:0 "Реактивний Винищувач"
fighter_tech_3_desc:0 "Замість вставляти реактивний двигун у старий корпус, ми спроєктували новий літак навколо нього. З урахуванням досвіду пілотів, вбудовані бомболюки для 250-кг бомб, інтегровані крупнокаліберні кулемети з електрозапалом та багатоцільові повітряні ракети на кінчиках крил — усе це робить машину смертоносною. Висока скорострільність компенсує короткі вікна для перехоплення на таких швидкостях."

fighter_tech_4:0 "Ядерний Реактивний Винищувач"
fighter_tech_4_desc:0 "Ядерне стабілізоване ядро дозволяє позбутись паливних баків, збільшити боєзапас і встановити авіоніку. Носовий радар, роторна гармата, ІЧ-ракети класу повітря-повітря — все це виводить наші винищувачі на вершину технологій. Змішані боєприпаси, підкрильні пілони з термобаричними бомбами й наземні сканери роблять їх універсальними. Ми — господарі неба."

cas_bomber_tech_1:0 "Триплан-штурмовик"
cas_bomber_tech_1_desc:0 "Три крила означають більше підйомної сили. Один важкий кулемет, одна 250-кг бомба під фюзеляжем та задній кулемет з водяним охолодженням — простий і ефективний засіб знищення неозброєного ворога та захисту від повітряних загроз."

cas_bomber_tech_2:0 "Моноплан-штурмовик"
cas_bomber_tech_2_desc:0 "Металевий корпус, броньований кокпіт, внутрішній відсік для чотирьох 50-кг бомб та два зовнішні кріплення для 250-кг бомб роблять цей літак універсальним. Чотири середні кулемети спереду та важкий ззаду підвищують живучість та точність вогню по землі."

cas_bomber_tech_3:0 "Реактивний Штурмовик"
cas_bomber_tech_3_desc:0 "Замість пристосовувати зброю під літак, ми побудували літак навколо 25-мм автогармати. Реактивні двигуни з боків адаптовані під низьку швидкість і малу висоту. Він несе 500-кг бомби або ракети. Ідеальний для знищення укріплень, бронетехніки та раптових ударів."

cas_bomber_tech_4:0 "Ядерний Штурмовик"
cas_bomber_tech_4_desc:0 "Ядерний двигун надає величезної вантажопідйомності. Автогармата калібру 35 мм, керовані ракети, 750-кг касетна бомба або бункеробійна ракета, прямий зв'язок із піхотою — усе це перетворює наш штурмовик на машину жаху. Вороги згорають до попелу до того, як усвідомлять, що відбувається."

strat_bomber_tech_1:0 "Бомбардувальник типу R"
strat_bomber_tech_1_desc:0 "Щоб бити ворога у його власній землі, потрібні нові, розумні проєкти. Ми маємо вражати не лише його війська, а й воєнну машину. Знищення інфраструктури й заводів вимагає далекої дальності, великого бомбового навантаження та захисту від винищувачів. Тандемна чотиридвигунна схема та укріплений корпус дають нам потужний літак, здатний нести понад півсотні 50-кг бомб та оборонятись трьома кулеметами в броньованих турелях. Саме час ударити по їхній батьківщині."

strat_bomber_tech_2:0 "Бомбардувальник з роторним двигуном"
strat_bomber_tech_2_desc:0 "Чотиридвигунний моноплан з потужними турбогвинтовими моторами може нести більше зброї. Тепер ми маємо оборонні автогармати, радари наведення та вантаж бомб понад тонну. Він може стирати з лиця землі заводи, діставати до столиць ворога, а висотна тактика дозволяє уникати винищувачів і ППО. Жилети, шоломи та броня на ключових вузлах захищають екіпаж у бою."

strat_bomber_tech_3:0 "Реактивний бомбардувальник"
strat_bomber_tech_3_desc:0 "Реактивні двигуни роблять наші бомбардувальники швидшими й легшими. Вони можуть здійснювати удари раніше, ніж ворог їх помітить. Нові бомби — паливно-повітряні, керовані планери, пробивачі бункерів — разом із радарами місцевості дозволяють точні атаки навіть у темряві. Авіоніка — від доплерів до інерційної навігації — підсилює бойові спроможності. Автогармата в кормі захищає навіть від найкращих винищувачів ворога."

strat_bomber_tech_4:0 "Ядерний реактивний бомбардувальник"
strat_bomber_tech_4_desc:0 "Ми досягли вершини стратегічного терору. Ядерний двигун, надвисока стеля, багатоспектральні теплові пастки, обтічний корпус — усе поєднано для досконалості. Обертовий бомбовий відсік зменшує розсіювання, а система планування дозволяє уражати точково. Заводи, штаби, міста — усе тепер під загрозою нищівної атаки."

cargo_plane_tech_1:0 "Транспортний планер"
cargo_plane_tech_1_desc:0 "Дешевий, легкий, дерев’яний планер, запущений з вантажівки ракетною катапультою. Його низька маневреність компенсується здатністю постачати вантажі в райони без підтримки — навіть у тилу ворога."

cargo_plane_tech_2:0 "Вантажний літак"
cargo_plane_tech_2_desc:0 "Двигуни, оборонні кулемети, більша швидкість та вантажопідйомність — усе це робить цей літак придатним для постачання навіть під вогнем. Кращі парашути та система скидання дозволяють доставляти зброю, боєприпаси та інше."

cargo_plane_tech_3:0 "Дрімліфтер"
cargo_plane_tech_3_desc:0 "Гігантський вантажний літак з автогарматами, радари пошуку рівної місцевості для скидання, сигнали розпізнавання на ящиках — усе це дозволяє доставляти спорядження для цілих батальйонів. Його швидкість дозволяє ухилятись від ППО."

blimp_tech_1:0 "Бойовий дирижабль"
blimp_tech_1_desc:0 "Цей повітряний корабель коштовний, але універсальний. Ручні бомби, великокаліберні кулемети, бомби — усе можливо. Надлишковий тиск у балоні та броньована гондола дають стійкість, але з одним гвинтом він повільний. Проте як артилерія з неба — безцінний."

blimp_tech_2:0 "Штурмовий дирижабль"
blimp_tech_2_desc:0 "Хоч він повільний, його броня та автогармати дають перевагу. 250-кг бомби, радари, наведення вогню, подвійні двигуни, броньовані баки — усе робить його жахом для ворога."

blimp_tech_3:0 "Летюча фортеця"
blimp_tech_3_desc:0 "Дорога, як десять винищувачів, але варта того. Роторні автогармати й мінометні башти знищують усе — від літаків до баз. Броня поглинає ППО, солдати тікають в паніці. Мрія всіх, хто прагне панувати в небі."

blimp_tech_4:0 "Ядерна суперфортеця"
blimp_tech_4_desc:0 "Інженерам дали карт-бланш. Кожну гармату збільшено в калібрі, міномети замінено гаубицями, ракети — бронебійні. Броня як у танка, куленепробивна оболонка, реактивні двигуни з ядерним ядром, зручні каюти — це вже не корабель, а місто в небі. Нездоланний."

high_fighter_tech:0 "Xian-85 Винищувач"
high_fighter_tech_desc:0 ""

high_cas_tech:0 "Xian-85 Штурмовик"
high_cas_tech_desc:0 ""

vertibird_tech:0 "VB-01 Транспорт"
vertibird_tech_desc:0 ""

vertibird_cas_tech:0 "VB-02 Штурмовий вертиберд"
vertibird_cas_tech_desc:0 ""
