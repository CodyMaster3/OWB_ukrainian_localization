l_english:
# Equipment naming is inherited from the equipment name when displayed in the techtree
#Headers
fallout_tech_implant_folder:0 "Кібернетика"
fallout_tech_implant_folder_desc:0 "Інтенсивно розвинута перед Великою Війною, галузь імплантів і штучних частин тіла дозволяє підсилити солдата до надлюдського рівня сили та витривалості."

HEADER_IMPLANT:0 "Кібернетичні Імпланти"
HEADER_IMPLANT_DANGEROUS:0 "Небезпечні Імпланти"
HEADER_IMPLANT_DEPLOYMENT:0 "Розгортання Імплантів"

implant_militia_supply_tech:0 "Імпланти для Міліції"
implant_militia_supply_tech_desc:0 "Серед усіх наших військових формувань саме міліція могла б найбільше виграти від програми імплантів. Замінивши нестачу тренування й обладнання передовими біологічними функціями, ми можемо повністю нівелювати їхню вразливість."

implant_infantry_supply_tech:0 "Імпланти для Піхоти"
implant_infantry_supply_tech_desc:0 "Саме піхота завжди виграє битви, отже вона повинна мати найсучасніші технології. Масове розгортання кібернетичних імплантів серед піхоти суттєво посилить їхню боєздатність."

implant_spec_ops_supply_tech:0 "Імпланти для Спецназу"
implant_spec_ops_supply_tech_desc:0 "Наші рейнджери, які діють глибоко в тилу ворога і в складних умовах, можуть значно виграти від біологічного підсилення. Адаптація імплантів до їхніх потреб значно допоможе в польових умовах."

implant_power_armour_supply_tech:0 "Імпланти для Сил у Силовій Броні"
implant_power_armour_supply_tech_desc:0 "Здавалося б, солдати в силовій броні не потребують імплантів, маючи технологічну перевагу. Та поєднання механічного й біологічного робить з них ще грізнішу силу, здатну вселити страх у будь-якого ворога."

implant_vehicles_supply_tech:0 "Імпланти для Екіпажів Техніки"
implant_vehicles_supply_tech_desc:0 "Екіпажі бронетехніки часто страждають від поганого фізичного стану через постійну роботу в розпечених бронемашинах. Додавши до стандартного пакету імплантів систему біологічного охолодження, ми суттєво покращимо їхню ефективність."

implant_rejection_therapy_tech:0 "Кібернетичні Імпланти"
implant_rejection_therapy_tech_desc:0 "Перший крок у створенні кібернетичних імплантів – це створення 'наноботичного' діагностичного й лікувального пакета. У вигляді стандартного стімпака, він допомагає виявляти й лікувати тканинні пошкодження, а також запобігає відторгненню імплантів."

implant_neural_interface_tech:0 "Нейроінтерфейс"
implant_neural_interface_tech_desc:0 "Мозок – це надзвичайно складний орган. Замість спроб його повного розуміння, ми використовуємо ЕЕГ для перетворення мозкових хвиль у прості сигнали, що зчитуються нашими імплантами – подібно до систем Робо-мозку."

implant_signal_translation_tech:0 "Переклад Сигналу"
implant_signal_translation_tech_desc:0 "Зворотне перетворення бінарних сигналів у мозкові хвилі занадто складне. Замість цього ми створюємо нові нервові закінчення навколо імплантів, що дозволяє мозку інстинктивно реагувати на нові дані та пошкодження."

implant_killswitch_tech:0 "Аварійні Вимикачі"
implant_killswitch_tech_desc:0 "Вбудовані в шоломи офіцерів пристрої дозволяють контролювати імпланти солдатів, вимикати непотрібні або посилювати фронтові в екстрених ситуаціях. Це викликає нервовість у особового складу, але дає суттєву перевагу."

implant_safety_regulation_tech:0 "Правила Безпеки"
implant_safety_regulation_tech_desc:0 "Наші наноботи стежать за тим, щоб імпланти працювали в межах безпечного режиму, що збільшує їхній ресурс, безпеку та комфорт користувача."

implant_safety_regulation_override_tech:0 "Вимкнення Обмежень"
implant_safety_regulation_override_tech_desc:0 "Як і людське тіло, імпланти мають йти на межу в критичні моменти. Офіцери отримують можливість вимкнути обмеження задля повної віддачі в бою – за умови подальшого медичного догляду."

implant_shock_absorbers_equipment_tech:0 "Комплект Імплантів Марк II"
implant_shock_absorbers_equipment_tech_desc:0 "Нові наноботи з ЕМС імпульсами допомагають зміцнити м’язи, пришвидшують загоєння та зменшують травмування – що дозволяє витримувати падіння чи удари без втрат боєздатності."

implant_medical_maintenance_tech:0 "Медичне Обслуговування"
implant_medical_maintenance_tech_desc:0 "Інтегрувавши імпланти ще глибше в тіло, ми дозволимо медперсоналу обслуговувати їх без допомоги інженерів, що скорочує час простою й підвищує надійність."

implant_biochemical_combat_boosters_tech:0 "Покращені Бойові Стимулятори"
implant_biochemical_combat_boosters_tech_desc:0 "Модафініл – це старий, потужний стимулятор. Раніше небезпечний у великих дозах, тепер може вводитися точно розраховано завдяки наноботам – без побічних ефектів."

implant_occulus_enhancers_equipment_tech:0 "Комплект Імплантів Марк III"
implant_occulus_enhancers_equipment_tech_desc:0 "Біонічні контактні лінзи, вбудовані в очі, дають інфрачервоне, теплове й тактичне зображення прямо на сітківку. Це замінює громіздкі шоломи та покращує реакцію солдата."

implant_adaptive_interface_tech:0 "Адаптивний Інтерфейс"
implant_adaptive_interface_tech_desc:0 "Кожен організм унікальний. Новий алгоритм і система моніторингу дозволяють імплантам самостійно адаптуватися під потреби солдата – від болю в попереку до ПТСР."

implant_adaptive_respiratory_enhancer_tech:0 "Покращувач Дихання"
implant_adaptive_respiratory_enhancer_tech_desc:0 "Установка в горлі імплантованого органа, що формує мінеральні реагенти й очищає отруйні речовини з повітря. Унікальна технологія перетворює небезпечні гази у водяну пару."

implant_monocyte_breeder_tech:0 "Розмножувач Моноцитів"
implant_monocyte_breeder_tech_desc:0 "Стимуляція вироблення еритроцитів через імплант у спинному мозку дозволяє швидко зупинити кровотечу та загоїти рани – солдати залишаються в строю навіть після важких поранень."

implant_subdermal_armour_equipment_tech:0 "Комплект Імплантів Марк IV"
implant_subdermal_armour_equipment_tech_desc:0 "Наноботи створюють підшкірну броню з кевлара, що замінює білкові волокна. Вона захищає від вогню, ударів і куль, не заважаючи чутливості шкіри."

implant_biochemical_mastery_tech:0 "Майстерність Біохімії"
implant_biochemical_mastery_tech_desc:0 "Наші імпланти тепер не потребують відкритої операції, майже не відторгаються й підтримуються на рівні бездоганної інтеграції – людина й машина стали єдиним цілим."

implant_advanced_cybernetic_warfare_module:0 "Комплект Імплантів Марк V"
implant_advanced_cybernetic_warfare_module_desc:0 "Централізований блок управління та імплант у шлунку, що перетворює їжу на енергію для кібернетики. Легке почуття голоду – невелика ціна за бійця майбутнього."

implant_a_question_of_morals_tech:0 "Чи Повинні Ми?"
implant_a_question_of_morals_tech_desc:0 "З моменту запуску програми ми прагнули зробити імпланти повністю сумісними з людським тілом, щоб підсилена людина була не відрізнити від звичайної. Але... це жорстко обмежує нас. Ми могли б досягти набагато більшого, значно вищих висот, якби не були так обмежені. Навіть сама поява такої ідеї серйозно зашкодить нашій репутації, але... якщо ми можемо досягти наступного етапу людської еволюції, хіба не варто ризикнути?"

implant_cybernetic_warform_tech:0 "Кібернетична Бойова Форма"
implant_cybernetic_warform_tech_desc:0 "Повне нехтування навіть базовими правами людини та святістю її тіла дозволило нам зайти далеко за межі попередніх експериментів. Без обмежень ми можемо відтинати кінцівки, видаляти органи, або навіть цілі частини тулуба – й замінювати їх ефективнішими механічними аналогами. Ми не передбачали для таких суб'єктів можливості мирного життя після цього – але чи справді це важливо? Для того ж існує процедура стирання пам’яті."

implant_tech_bad_idea_1:0 "§RЦе погана ідея.§!"
implant_tech_bad_idea_2:0 "§RСерйозно, це дуже погана ідея. Дуже-дуже погана.§!"