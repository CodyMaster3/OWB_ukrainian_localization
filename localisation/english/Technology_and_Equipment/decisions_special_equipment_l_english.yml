mininuke_arming_decision:0 "Оснастити Партію Міні-Ядерок"
mininuke_arming_decision_desc:0 "Надає один заряд для командирської здібності міні-ядерки, вимагає три міні-ядерні боєприпаси на складі. Міні-ядерні заряди можна виготовити через інтерфейс виробництва."

mininuke_arming_3_decision:0 "Оснастити Три Партії Міні-Ядерок"
mininuke_arming_3_decision_desc:0 "Надає три заряди для командирської здібності міні-ядерки, вимагає дев'ять міні-ядерних боєприпасів на складі. Міні-ядерні заряди можна виготовити через інтерфейс виробництва."

artillery_arming_decision:0 "Підготувати Артилерійський Обстріл"
artillery_arming_decision_desc:0 "Надає один заряд для командирської здібності артобстрілу, вимагає три партії снарядів на складі. Партії снарядів можна виготовити через інтерфейс виробництва."

artillery_arming_3_decision:0 "Підготувати Три Артилерійських Обстріли"
artillery_arming_3_decision_desc:0 "Надає три заряди для командирської здібності артобстрілу, вимагає дев'ять партій снарядів на складі. Партії снарядів можна виготовити через інтерфейс виробництва."

special_equipment_decisions:0 "Постачання Армії"
special_equipment_decisions_desc:0 "Наведені нижче рішення покажуть точну кількість готових артилерійських та міні-ядерних зарядів.\nЗаряди активуються через здібності командирів. \nГотові Партії Міні-Ядерок: §G[?fatman_uses]§! \nГотові Артилерійські Обстріли: §G[?artillery_uses]§!"
