#----------------------------
# Транспорт
#----------------------------
mobile_medical_vehicle_tech:0 "Мобільні Парамедичні Бригади"
mobile_medical_vehicle_tech_desc:0 "Щойно ми ввели транспорт у структуру нашої армії, перші, хто попросив про моторизацію, були медики. Цілком логічно: життєво необхідні підрозділи мають дістатися до поля бою якнайшвидше, ще й з достатньою кількістю обладнання."

mobile_recon_vehicle_tech:0 "Мобільні Розвідувальні Корпуси"
mobile_recon_vehicle_tech_desc:0 "Наші розвідники завжди йдуть попереду військ. Вони в найбільшій небезпеці, а їхній успіх залежить від швидкості. Отже, моторизація розвідки — це природний крок у нашому плані мобілізації."

mobile_maintenance_vehicle_tech:0 "Мобільні Ремонтні Бригади"
mobile_maintenance_vehicle_tech_desc:0 "Чим більше транспорту ми використовуємо, тим важливішою стає техобслуга. Наші механіки забезпечують справність машин навіть після бур, радіації та нападів звірів. Щоб вони встигали за військами — їм також потрібен транспорт."

mobile_logistics_vehicle_tech:0 "Мобільна Логістика"
mobile_logistics_vehicle_tech_desc:0 "Чим складніша наша техніка, тим більші вимоги до постачання: енергоелементи, деталі, боєприпаси. Без транспорту логістика не впорається. Тому наші сапери теж мають бути моторизовані — інакше щось точно забудеться."

bike_tech_1:0 "Велосипеди"
light_motorized_equipment_vehicle_tech_1:0 "Мотоцикли зі Звалища"
light_motorized_equipment_vehicle_tech_2:0 "Авто зі Звалища"
light_motorized_equipment_vehicle_tech_3:0 "Пустельні Автівки"
light_motorized_equipment_vehicle_tech_4:0 "Військовий Автомобіль"
heavy_motorized_equipment_vehicle_tech_1:0 "Скраповані Вантажівки"
heavy_motorized_equipment_vehicle_tech_2:0 "Вантажівки зі Звалища"
heavy_motorized_equipment_vehicle_tech_3:0 "Пустельний Автобус"
heavy_motorized_equipment_vehicle_tech_4:0 "Пустельний БТР"

motorisation_vehicle_tech:0 "Моторизація"
motorisation_vehicle_tech_desc:0 "Покращення живлення, ремонтні навички та інфраструктура дають змогу нам ремонтувати і переобладнувати транспорт для потреб армії. Моторизовані війська рухаються швидше й можуть нести більше."

safety_hatches_vehicle_tech:0 "Протектори для Пустелі"
safety_hatches_vehicle_tech_desc:0 "Новий малюнок протектора та імпровізовані виступи на колесах підвищують зчеплення на піску й камінні. Це робить пересування безпечнішим та зменшує втрати від поломок."

wet_stowage_vehicle_tech:0 "Мокра Укладка Боєприпасів"
wet_stowage_vehicle_tech_desc:0 "Боєприпаси повинні вибухати на ворогові, а не в нашій машині. Волога укладка — це контейнер із відсіками, заповненими рідиною, що знижує ризик детонації всередині машини."

boarding_ramps_vehicle_tech:0 "Удосконалення Ґуми"
boarding_ramps_vehicle_tech_desc:0 "Підвищена міцність, зчеплення та кулестійкість шин поліпшують рух як бездоріжжям, так і новими дорогами. Також це трохи покращує боєздатність."

Compartmentalization_vehicle_tech:0 "Сегментація Систем"
Compartmentalization_vehicle_tech_desc:0 "Усі ключові системи — мотор, вихлоп, трансмісія — взаємопов'язані. Але якщо ми фізично розділимо критично важливі елементи, шанси вижити при влучанні зростуть."

mrap_effort_vehicle_tech:0 "Система Активного Захисту"
mrap_effort_vehicle_tech_desc:0 "Сучасна протитанкова зброя може бути перехоплена — або перешкодою сигналу, або навіть зброєю на борту, що автоматично знищує ракету. Це і є активний захист."

plating_vehicle_tech:0 "Додаткове Бронювання"
plating_vehicle_tech_desc:0 "Грубо, але ефективно: використання брухту для підсилення слабких місць броні наших машин. Захист підвищиться, але не забуваймо про збільшення ваги."

bumper_vehicle_tech:0 "Ударні Бампери"
bumper_vehicle_tech_desc:0 "Спеціальні таранні пристрої, такі як «короволови», дозволять нашим солдатам діяти нестандартно. Новий спосіб проривати оборону... і більше проблем із дисципліною."

gasoline_vehicle_tech:0 "Летючі Пальне"
gasoline_vehicle_tech_desc:0 "Не ставимо зайвих питань про домішки в паливі — двигуни ревуть, і цього досить. Але краще поки що не заходити в технічні ангари: екіпаж у стресі."

sealed_vehicle_tech:0 "Герметизація"
sealed_vehicle_tech_desc:0 "Повна герметизація корпусу з фільтрацією повітря дає екіпажу можливість дихати чисто й комфортно. Це уповільнює машини, але солдати швидше відновлюються."

armoured_vehicle_tech:0 "Підсилення Броні"
armoured_vehicle_tech_desc:0 "Завдяки покращенню підвіски та амортизаторів ми можемо дозволити собі суцільне бронювання корпусу — включно з композитними панелями. Тепер наші моторизовані війська витримають більше."

tracks_vehicle_tech_1:0 "Прості Гусениці"
tracks_vehicle_tech_1_desc:0 "Спрощені гусеничні системи — ключ до масового виробництва. Менше простоїв, простіше обслуговування та більша надійність."

tracks_vehicle_tech_2:0 "Опорні Ролики"
tracks_vehicle_tech_2_desc:0 "Опорні ролики тримають натяг гусениці стабільним. Менше тертя, менше зношення — вища надійність."

turret_vehicle_tech:0 "Покращені Башти"
turret_vehicle_tech_desc:0 "Башта з підручних матеріалів, зроблена на основі будівельного шасі, захистить гармату та продовжить її строк служби."

aps_vehicle_tech:0 "Укріплена Броня"
aps_vehicle_tech_desc:0 "Товстіша броня — це не все. Її форма, кут розташування й шарування теж грають роль. Правильне розміщення здатне відбити навіть найнебезпечніші снаряди."

mobile_weapons_vehicle_tech:0 "Мобільне Штурмове Озброєння"
mobile_weapons_vehicle_tech_desc:0 "Важку зброю важко носити, але якщо поставити її на дах авто чи мотоцикла — вона стане мобільною вогневою перевагою."

extra_plating_vehicle_tech:0 "Захищене Зберігання"
extra_plating_vehicle_tech_desc:0 "Металеві кошики дають можливість екіпажу безпечно перевозити більше спорядження. Менше потреби в поповненні — більша автономність."

fuel_booster_vehicle_tech:0 "Перевантаження Двигунів"
fuel_booster_vehicle_tech_desc:0 "Більше палива, більша потужність! Відкриті клапани й розширені трубопроводи додають швидкості — але й витрати зростають."

extra_gunports_vehicle_tech:0 "Бійниці"
extra_gunports_vehicle_tech_desc:0 "Бійниці для стрільби зсередини: екіпаж може відстрілюватись, а піхота — підтримувати вогнем прямо з транспортера."

solar_power_vehicle_tech:0 "Покращене Паливо"
solar_power_vehicle_tech_desc:0 "Вища октанова характеристика, менше бруду — краще згоряння. Двигуни служать довше, а фільтри — чистіші."

vaccum_sealing_vehicle_tech:0 "Вакуумна Герметизація"
vaccum_sealing_vehicle_tech_desc:0 "У довоєнних авто це було нормою — і ми теж повертаємо це. Комфорт екіпажу впливає на ефективність, навіть у бою."

