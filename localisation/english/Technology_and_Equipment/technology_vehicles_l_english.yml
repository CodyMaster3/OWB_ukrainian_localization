#siege_super_mutant_behemoth:0 "Психотичний Бегемот"
#siege_super_mutant_behemoth_desc:0 ""

basic_supply_transport_tech:0 "Базові Візки Каравану"
basic_supply_transport_tech_desc:0 "Нам не потрібна сучасна логістика, якщо є платформний віз і сильний брамін. Навіть їжу й патрони він зможе дотягти до передової."

armored_supply_transport_tech:0 "Броньовані каравани постачання"
 armored_supply_transport_tech_desc:0 "Завдяки стандартизації використання автотранспорту в наших караванах ми значно покращуємо наші логістичні можливості. Легкові та вантажні автомобілі можуть доставляти припаси нашим військам набагато швидше та ефективніше, ніж більш традиційні методи. Важчі броньовані причепи захищають вантаж від несподіваних засідок набагато краще, ніж звичайний віз."
 trains_supply_transport_tech:0 "Спорядження залізничних караванів"
 trains_supply_transport_tech_desc:0 "Перевірений часом наступний крок у транспортних технологіях: виділені вантажні лінії дозволяють ефективно доставляти набагато більше припасів на передову. Відновлення старих моделей може бути тривалим, але цілком здійсненним завданням — до того ж деякі з наших інженерів вважають це досить заспокійливим заняттям."

 basic_supply_upgrade_tech_1:0 "Організована логістика"
 basic_supply_upgrade_tech_1_desc:0 "Просте покращення нашої організації, діловодства та відстеження припасів значно підвищує логістичну злагодженість. Менше припасів губитиметься, а спорядження розподілятиметься швидко та ефективно після прибуття на передову."
 basic_supply_upgrade_tech_2:0 "Покращені рішення для зберігання"
 basic_supply_upgrade_tech_2_desc:0 "Повністю переосмисливши нашу систему розміщення вантажів у транспорті, ми зможемо максимально ефективно використовувати простір і місця для зберігання, що дозволить караванам доставляти на фронт більше життєво необхідних припасів."
 basic_supply_upgrade_tech_3:0 "Системи сигналізації"
 basic_supply_upgrade_tech_3_desc:0 "Оскільки ми маємо розгалужену мережу залізниць, що перетинаються, розробка ефективної системи сигналізації гарантує безперебійний і своєчасний рух потягів до місця призначення. Це підвищує швидкість доставки припасів на фронт, навіть якщо він знаходиться значно далі від дому."
 basic_supply_upgrade_tech_4:0 "Комп'ютерна мережа управління"
 basic_supply_upgrade_tech_4_desc:0 "Оцифрувавши наші системи сигналізації та управління логістикою, ми значно скоротимо час, що витрачається на управління залізницями, а також зведемо до мінімуму людський фактор. Виділення кількох відновлених комп'ютерів для потреб залізниці цілком виправдовує себе завдяки підвищенню ефективності."

 railways_construction_tech:0 "Відбудова доріг"
 railways_construction_tech_desc:0 "Система американських автомагістралей колись з'єднувала старий світ. Тепер ми їздимо лише по руїнах. Відновлюючи довоєнну інфраструктуру, таку як дороги та шосе, ми значно покращуємо наші можливості з переміщення та мобілізації припасів, а також наших збройних сил."
 railways_upgrade_tech_1:0 "Дорожні робітники"
 railways_upgrade_tech_1_desc:0 "Наявність спеціалізованих будівельних бригад, які відновлюють та асфальтують дороги, значно покращує наші логістичні можливості."
 railways_upgrade_tech_2:0 "Доглянуті автошляхи"
 railways_upgrade_tech_2_desc:0 "Тепер ми можемо обслуговувати та будувати дороги за тими ж технологіями і з таким же рівнем ефективності, як і в довоєнному світі. Одного дня наша система автомагістралей зможе позмагатися з гігантами минулого."
 railways_upgrade_tech_3:0 "Збірні дороги"
 railways_upgrade_tech_3_desc:0 "Використовуючи надлегкі синтезовані матеріали, ми можемо ефективно «друкувати» сегменти дорожнього полотна та динамічно встановлювати або знімати їх відповідно до наших потреб."

 supply_equipment:0 "Спорядження караванів"
 supply_equipment_short:0 "Спорядження караванів"
 supply_equipment_desc:0 ""