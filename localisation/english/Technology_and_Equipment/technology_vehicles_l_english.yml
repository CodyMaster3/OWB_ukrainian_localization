chariot_vehicle_tech:0 "Моторизовані Колісниці"
chariot_vehicle_tech_desc:0 "Автомобілі розбирають і переробляють у бойові колісниці. Гримлять крізь пустку, трощачи ворогів під колесами."

legion_motor_chariots:0 "Колісниці Легіону"
legion_motor_chariots_desc:0 "Ті самі мотоколісниці, але з печаттю Легіону. Ламають усе під собою."

