siege_super_mutant_behemoth_desc:0 ""

basic_supply_transport_tech:0 "Базові Візки Каравану"
basic_supply_transport_tech_desc:0 "Нам не потрібна сучасна логістика, якщо є платформний віз і сильний брамін. Навіть їжу й патрони він зможе дотягти до передової."

supply_equipment:0 "Базове Караванне Спорядження"
supply_equipment_short:0 "Караванне Спорядження"
supply_equipment_desc:0 ""
supply_equipment_1:0 "Базове Караванне Спорядження"
supply_equipment_1_short:0 "Караванне Спорядження"
supply_equipment_1_desc:0 "Нашим людям все ще потрібна їжа і патрони. І все це може принести брамін із возом, зробленим зі старої машини."