#----------------------------
# Промисловість
#----------------------------
tool_engineering:0 "Забезпечення Інструментами"
tool_engineering_desc:0 "Наші виробничі потужності потребують інструментів — терміново. Щоб підтримувати високі темпи виробництва й вчасно постачати спорядження нашим солдатам, наші лідери запропонували два шляхи: пошук та спрощення. Пріоритезація пошукових команд дозволить нам знайти та забезпечити робітників найкращими інструментами, а концентрація на спрощенні дозволить масово виготовляти потрібне обладнання."

maketool_engineering_1:0 "Імпровізовані Інструменти"
maketool_engineering_1_desc:0 "Використовуючи наше базове розуміння виготовлення інструментів, ми можемо створювати прості знаряддя прямо з наявних матеріалів навколо майстерень. Хоча результат не вражає; ножі з брухту, арматурні кийки й інші прості інструменти значно ефективніші, ніж працювати голими руками.\n\n"

maketool_engineering_2:0 "Примітивні Інструменти"
maketool_engineering_2_desc:0 "Камінь — основа світу. Кам'яні знаряддя є першим кроком до цивілізації, або ж у нашому випадку — до вищої ефективності виробництва. Удосконаливши наші примітивні дизайни, додавши ергономіку та надійність, ми зробимо інструменти простішими у використанні та обслуговуванні."

maketool_engineering_3:0 "Стандартизовані Інструменти"
maketool_engineering_3_desc:0 "Стандартизовані конструкції можна швидко виготовляти за єдиними кресленнями та взаємозамінно використовувати між працівниками. Епоха індивідуального дизайну з особливостями та вадами минає. Те, що ми втрачаємо в ергономіці — здобуваємо в загальній ефективності."

maketool_engineering_4:0 "Удосконалені Інструменти"
maketool_engineering_4_desc:0 "Нашому більш розвиненому обладнанню потрібні кращі інструменти. Оптимізувавши конструкції для точності, водночас зберігаючи простоту, ми зможемо підвищити ефективність без зайвого подовження часу виробництва."

maketool_engineering_5:0 "Передові Інструменти"
maketool_engineering_5_desc:0 "Час модернізувати оснащення робітників. Динамометричні ключі, прес-форми, гідронасоси — усе це формуватиме кістяк нашої промисловості. Нові штамповочні пристрої дозволять масово виробляти зброю в небачених масштабах. Ці інструменти наблизять нас до старого світу."

maketool_engineering_6:0 "Довоєнні Інструменти"
maketool_engineering_6_desc:0 "Завдяки зусиллям наших кращих спеціалістів, ми відновили, реконструювали та навчилися відтворювати інструменти довоєнної епохи. Наші працівники користуються інструментами, які інші народи вважають рідкісною реліквією: атом допомагає створювати краще спорядження у пустці. Від плазморізів до сатурнітових бурів — наука працює на перемогу."

scavtool_engineering_1:0 "Знайдені Інструменти"
scavtool_engineering_1_desc:0 "Шукачів і охоронців можна послати до покинутих фабрик у пошуках обладнання. Мертвим інструменти не потрібні. Знайдені інструменти хоч і зношені, але здатні покращити якість виготовлення і зробити спорядження міцнішим.\n\n"

scavtool_engineering_2:0 "Собаки-Пошуковці"
scavtool_engineering_2_desc:0 "Собак можна навчити знаходити потрібне: зокрема — запахи індустріальних хімікатів, нафти, легованої сталі тощо. З такими помічниками ми швидше виявлятимемо приховані довоєнні запаси інструментів."

scavtool_engineering_3:0 "Квадратний Пошук"
scavtool_engineering_3_desc:0 "Замість хаотичного обшуку територій, наші шукачі можуть використати методику квадратного пошуку, відому ще довоєнним слідчим. Розділивши великі ділянки на менші сектори, кожен шукач отримує конкретну зону для пошуку. Це дозволить систематично обстежити території та підвищити ефективність пошуку."

pre_agriculture_industry_tech:0 "Організоване Землеробство"
pre_agriculture_industry_tech_desc:0 "Організоване сільське господарство, засноване не лише на потребах людей, допоможе нам створити резерви та вирощувати різноманітні культури. Така система — основа виживання нашого народу."

#----------------------------
# Локалізація Технологій Аграрної Галузі
#----------------------------
agriculture_industry_tech_1:0 "Відбір Насіння"
agriculture_industry_tech_1_desc:0 "Відбір насіння — це процес вибору, яке насіння буде висаджено, згідно з визначеними критеріями. Серед них: очікувана врожайність, стійкість до хвороб і зовнішніх загроз, а також поживна цінність — лише кілька прикладів."
agriculture_industry_tech_2:0 "Обробіток Рослин"
agriculture_industry_tech_2_desc:0 "Обробіток — це розпушення та підготовка ґрунту. Землю навколо рослин культивують вручну або за допомогою техніки, щоб знищити бур’яни й покращити доступ повітря та води до коріння."
agriculture_industry_tech_3:0 "Сівозміна"
agriculture_industry_tech_3_desc:0 "Сівозміна — це вирощування різних культур на одному й тому ж полі в різні сезони. Це дозволяє уникнути виснаження ґрунту, зменшити ерозію, підвищити родючість і врожайність."
agriculture_industry_tech_4:0 "Зрошення"
agriculture_industry_tech_4_desc:0 "Зрошення — це цілеспрямоване зволоження рослин у потрібний момент. Воно допомагає вирощувати врожай, підтримувати ландшафти та озеленювати виснажені землі, особливо в посушливі періоди або посеред Пустки."
agriculture_industry_tech_5:0 "Промислові Добрива"
agriculture_industry_tech_5_desc:0 "Процес Габера-Боша — штучна фіксація азоту, основний промисловий метод отримання аміаку. Аміак — ключовий компонент добрив. Втім, його також можна отримувати з гною брамінів."
agriculture_industry_tech_6:0 "Автоматизоване Збирання"
agriculture_industry_tech_6_desc:0 "Збір урожаю завжди був важким завданням. Але з впровадженням робототехніки цей тягар зменшується, що відкриває шлях до зростання продуктивності."
agriculture_industry_tech_7:0 "ГеноКультури"
agriculture_industry_tech_7_desc:0 "Генетично модифіковані культури — це рослини, чию ДНК було змінено методами генної інженерії. Здебільшого йдеться про додання ознак, які не зустрічаються у природі, з метою покращення врожаю або стійкості."

#----------------------------
# Локалізація Базової Промислової Технології
#----------------------------
basic_industry_tech:0 "Промислове Планування"
basic_industry_tech_desc:0 "Хоча окремі майстерні досі задовольняли наші потреби, подальший розвиток неможливий без планування. Об’єднавши їх і заохотивши до співпраці, ми вже зможемо отримати користь та створити підґрунтя для реформ."

#----------------------------
# Локалізація Загальної Промисловості
#----------------------------
generalized_industry_tech_1:0 "Робота за Потребою"
generalized_industry_tech_1_desc:0 "Робота згідно з попитом, а не квотами, має багато переваг. Це дозволяє оперативно реагувати на потреби фронту, швидко змінювати виробництво та навіть звільняти частину робочої сили для служби в армії."
generalized_industry_tech_2:0 "Локальні Майстерні"
generalized_industry_tech_2_desc:0 "Замість того, щоб забирати людей із селищ до фабрик, ми можемо створити систему місцевих майстерень. Це дозволить працювати поруч із родиною. Завдяки постачальним караванам, які також забиратимуть виготовлену продукцію, селища зможуть спеціалізуватись і підвищувати майстерність у власній справі."
generalized_industry_tech_3:0 "Громадські Проєкти"
generalized_industry_tech_3_desc:0 "Проєкти з покращення умов життя в містах і селах дадуть людям кращу інфраструктуру. Водночас усі охочі можуть брати участь у простих роботах, здобуваючи базові інженерні навички, трудову дисципліну й повагу до важкої праці."
generalized_industry_tech_4:0 "Домашні Майстерні"
generalized_industry_tech_4_desc:0 "Масовий розподіл інструментів і матеріалів дозволяє людям створювати власні майстерні у дворах, стимулюючи інновації. Навіть поранені чи старі можуть долучитись. Особливі курси для дітей розвиватимуть у них любов до праці й винахідливість."
generalized_industry_tech_5:0 "Швидке Прототипування"
generalized_industry_tech_5_desc:0 "Вивчення довоєнних ЧПК і базової електроніки дозволяє обладнати кожну фабрику секцією швидкого прототипування. Такі секції надають працівникам змогу пропонувати й тестувати поліпшення. Це відкриває шлях до неперевершеної інженерії та постійного вдосконалення виробництва."
generalized_industry_tech_6:0 "Тривимірні Принтери"
generalized_industry_tech_6_desc:0 "3D-принтери — наступний крок після прототипування. Вони мають комп’ютерний інтерфейс і зручні інструменти, що дозволяють легко експериментувати з виробництвом. Деякі великі моделі можуть повністю замінити цілі виробничі лінії!"
generalized_industry_tech_7:0 "Реплікатори"
generalized_industry_tech_7_desc:0 "Реплікатори — вершина нашої виробничої доктрини. Спочатку креслення створюється на промисловому терміналі, після чого передається реплікатору. Це забезпечує ідеальне копіювання без браку, блискавичну зміну асортименту й неймовірну ефективність."


#----------------------------
# Локалізація Технологій Спеціалізованої Промисловості
#----------------------------
specialized_industry_tech_1:0 "Розподіл Завдань"
specialized_industry_tech_1_desc:0 "Робота за системою квот і виробничих норм дозволяє нам працювати швидше та виготовляти більше спорядження без спрощення процесів. Інженери мають відповідати за стандартизацію, а виробництво працює на повну. Втім, така система не гнучка щодо раптових змін у виробництві."
specialized_industry_tech_2:0 "Спеціалізовані Майстерні"
specialized_industry_tech_2_desc:0 "Майстерні, створені в індустріальних центрах і забезпечені персоналом через спеціальні кампанії, покращують наші виробничі спроможності. Централізація ресурсів і робочої сили дає змогу виготовляти більше озброєння та броні за менший час."
specialized_industry_tech_3:0 "Ремісничі Гільдії"
specialized_industry_tech_3_desc:0 "Гільдії, сформовані з найкращих працівників, можуть зміцнити нашу систему й передати знання решті робітників. Окремі зони для експериментів та удосконалень обладнання нашими майстрами підвищать продуктивність."
specialized_industry_tech_4:0 "Спеціалізовані Заводи"
specialized_industry_tech_4_desc:0 "Промислові будівлі, збудовані з урахуванням охолодження та вентиляції, дозволяють розміщувати більше персоналу й устаткування. Це покращує здоров’я працівників, підвищує надійність та забезпечує виробництво десятків одиниць продукції на день."
specialized_industry_tech_5:0 "Конвеєрні Лінії"
specialized_industry_tech_5_desc:0 "Справжні конвеєри перетворюють працівників на елементи єдиного механізму. Кожен додає одну деталь або перевіряє компонент на конвеєрній стрічці. Це максимізує ефективність усіх залучених і значно підвищує загальний випуск."
specialized_industry_tech_6:0 "Роботизовані Робітники"
specialized_industry_tech_6_desc:0 "Заміна людських рук на механічні значно підвищує швидкість і точність виробництва. Більше немає простоїв чи перевитрат — лише обслуговуючий персонал. Праця людини практично не потрібна."
specialized_industry_tech_7:0 "Стандартизоване Технологічне Будівництво"
specialized_industry_tech_7_desc:0 "Цифрові креслення, створені провідними інженерами та завантажені у виробничі лінії, дозволяють досягати неймовірних обсягів виробництва майже без зусиль. Техніка створюється за хвилини, зброя — за секунди, а патрони й елементів живлення — тисячами. Нам ніколи не бракуватиме боєприпасів, і ворог швидко це зрозуміє."

#----------------------------
# Локалізація Технологій Видобувної Промисловості
#----------------------------
extraction_industry_tech_1:0 "Трудові Табори"
extraction_industry_tech_1_desc:0 "Не такі жорсткі, як здається — трудові табори слугують опорними пунктами поблизу ресурсних зон. Тут робітники можуть відпочити, планувати роботу та працювати поза впливом спеки або негоди."
extraction_industry_tech_2:0 "Спеціалізоване Обладнання"
extraction_industry_tech_2_desc:0 "Спеціальні інструменти, як-от вибухівка, заряди для геологічної розвідки чи кайла, дозволяють значно прискорити видобуток і збільшити обсяг ресурсів за зміну."
extraction_industry_tech_3:0 "Парова Видобувна Техніка"
extraction_industry_tech_3_desc:0 "Парові машини хоч і громіздкі, але ефективна альтернатива ручній праці. Вони не потребують відпочинку, окрім охолодження, й звільняють людей від роботи у виснажливих умовах."
extraction_industry_tech_4:0 "Електричні Механізми"
extraction_industry_tech_4_desc:0 "Перехід на електричні машини спрощує процес, не вимагає спеціального навчання та захисного одягу. Такі машини живляться від стандартних елементів живлення й легко інтегруються в систему."
extraction_industry_tech_5:0 "Роботизований Видобуток"
extraction_industry_tech_5_desc:0 "Роботи з бурильними руками й пневматичними молотами здатні швидко прокладати тунелі та ламати перешкоди. Це виводить ефективність видобутку на максимум, зводячи до мінімуму втрати матеріалів."

#----------------------------
# Локалізація Технологій Будівництва
#----------------------------
pre_construction_industry_tech:0 "Основи Будівництва"
pre_construction_industry_tech_desc:0 "Будівництво — одна з найстаріших справ людства. Але час від часу корисно пригадати основи: як правильно планувати будівлі, укладати дороги та зводити фабрики."
construction_industry_tech_1:0 "Деревообробка"
construction_industry_tech_1_desc:0 "Дерево — найпростіший матеріал, що здавна використовується. Ми працюємо над належним плануванням оборонних і утилітарних споруд. Наприклад, не варто ігнорувати той факт, що фабрика з виробництва вибухівки зроблена з дерева."
construction_industry_tech_2:0 "Робота з Глиною"
construction_industry_tech_2_desc:0 "Глина рівномірніша й краще захищає від спеки й погодних умов, ніж дерево. Вона міцніша та дозволяє перейти від дерев’яних до глиняних побутових речей."
construction_industry_tech_3:0 "Металургія"
construction_industry_tech_3_desc:0 "Метал ми знали давно, але масове виробництво для укріплення будівель — це вже інше. Ми потребуватимемо ливарень і майстерень, але укріплені бункери й застави виправдають зусилля."
construction_industry_tech_4:0 "Цегла"
construction_industry_tech_4_desc:0 "Цегляна кладка з розчином дає нам надійний фундамент для цивільних будівель і фабрик — наш перший крок до справжніх будинків після катастрофи."
construction_industry_tech_5:0 "Цемент і Бетон"
construction_industry_tech_5_desc:0 "Бетон міцніший за цеглу, стійкий до навантажень і погодних умов. Його можна підсилити арматурою, лити в форми й надавати будь-якої форми — ідеальний матеріал для споруд."
construction_industry_tech_6:0 "Композити"
construction_industry_tech_6_desc:0 "Композитні матеріали — легкі, міцні, прості у використанні та довговічні. Завдяки їм ми можемо будувати за кілька місяців і досягати рівня, якому заздрили б довоєнні держави."

#----------------------------
# Локалізація Технологій Житлової Галузі
#----------------------------
habitation_industry_tech_1:0 "Племінні Хатини"
habitation_industry_tech_1_desc:0 "Прості хатини у великій кількості дозволять нам захистити найуразливіші верстви населення від суворості Пустки — основа будь-якої цивілізації."
habitation_industry_tech_2:0 "Будівлі з Саману"
habitation_industry_tech_2_desc:0 "Саман ідеально підходить до умов Пустки. Він зливається з довкіллям і захищає від спеки, забезпечуючи комфорт і міцність."
habitation_industry_tech_3:0 "Бараки зі Заліза"
habitation_industry_tech_3_desc:0 "Будинки зі з’єднаного брухту не виглядають вишукано, але забезпечують мінімальний захист і комфорт — зокрема захист від зовнішніх загроз."
habitation_industry_tech_4:0 "Цегляне Житло"
habitation_industry_tech_4_desc:0 "Справжнє житло з цегли — найкраще, що ми можемо зараз запропонувати без серйозних технологічних проривів. Це — розкіш, про яку після війни більшість навіть не мріяла."
habitation_industry_tech_5:0 "Довоєнні Стандарти"
habitation_industry_tech_5_desc:0 "Завдяки промисловому прогресу ми відтворили довоєнний рівень життя. Люди дивуються холодильникам, справжнім ліжкам і зручності — і ми не зупинимось на досягнутому."
habitation_industry_tech_6:0 "Дім Майбутнього"
habitation_industry_tech_6_desc:0 "Це — вершина житлових технологій. Автоматизація всіх процесів, захист, комфорт, навіть хатні роботи повернулись. Люди в захваті, а наше житло — найсучасніше в усій Пустці.                      I'm sorry, Dave. I'm afraid I can't do that."

#----------------------------
# Локалізація Технологій Переробної Промисловості
#----------------------------
pre_recycling_industry_tech:0 "Багатофункціональне Обладнання"
pre_recycling_industry_tech_desc:0 "Інструменти з змінними насадками або багатьма функціями дозволяють зменшити витрати на виробництво та спростити роботу в польових умовах — усе необхідне обладнання у одному предметі."

recycling_industry_tech_1:0 "Універсальні Конструкції"
recycling_industry_tech_1_desc:0 "Зброя, що працює з різними типами боєприпасів і менш зношується, дає нашим солдатам більше гнучкості у бою."
recycling_industry_tech_2:0 "Стандартизація Запчастин"
recycling_industry_tech_2_desc:0 "Стандартизація та взаємозамінність компонентів нашого озброєння значно зменшить час на обслуговування кожної одиниці зброї, броні чи транспорту."
recycling_industry_tech_3:0 "Переробка"
recycling_industry_tech_3_desc:0 "Використання придатних частин зі зламаного обладнання зменшує навантаження на постачання. Система збору дозволить солдатам легко знаходити заміну прямо на полі бою."
recycling_industry_tech_4:0 "Поглиблена Переробка"
recycling_industry_tech_4_desc:0 "Максимальне використання кожної деталі та наявність процедур демонтажу до базових компонентів дозволяє нам використовувати обладнання на повну."

#----------------------------
# Локалізація Технологій Видобутку Ресурсів
#----------------------------
resource_generator_tech:0 "Виробництво Ресурсів"
resource_generator_tech_desc:0 "Хоча збирання брухту непогано допомагає вижити, цього недостатньо для забезпечення нації. Ми маємо будувати спеціалізовані споруди для видобутку ресурсів — бути не лише збирачами, а й виробниками."

# Вода
resource_generator_water_tech_1:0 "Примітивні Насоси"
resource_generator_water_tech_1_desc:0 "Простий насос, з’єднаний із глибокими підземними джерелами, дасть нашим людям доступ до води без радіації. Чиста вода — це вже інше питання."
resource_generator_water_tech_2:0 "Поліпшені Насоси"
resource_generator_water_tech_2_desc:0 "Масивні труби й прості фільтри, встановлені на насосах, дозволять уникнути споживання великих домішок і покращать загальний стан здоров’я населення."
resource_generator_water_tech_3:0 "Базовий Водоносний Горизонт"
resource_generator_water_tech_3_desc:0 "Насос із живленням і дистиляційним обладнанням дозволить забезпечити більшу частину населення відносно чистою водою для приготування їжі та пиття."
resource_generator_water_tech_4:0 "Поліпшений Водоносний Горизонт"
resource_generator_water_tech_4_desc:0 "Потужніший двигун, точніші фільтри й можливість ремонту для віддалених поселень забезпечують майже всю нашу популяцію чистою водою."
resource_generator_water_tech_5:0 "Очищений Водоносний Горизонт"
resource_generator_water_tech_5_desc:0 "Хімічна двоетапна система очищення, здатна очистити навіть поверхневу воду Пустки, під’єднана до підземної водомережі. Ми — одна з небагатьох націй з по-справжньому чистою водою в кожній оселі."

# Енергія
resource_generator_power_tech_1:0 "Примітивний Генератор"
resource_generator_power_tech_1_desc:0 "Простий вітровий динамо-генератор з ручним резервом може забезпечити деякі об’єкти тимчасовою енергією, а мешканцям — хоч якесь світло."
resource_generator_power_tech_2:0 "Поліпшений Генератор"
resource_generator_power_tech_2_desc:0 "Генератор, під’єднаний до батареї та конденсатора, дозволяє накопичувати енергію. Хоча доступ до неї обмежений, усе більше людей можуть мати хоча б одне джерело світла вдома."
resource_generator_power_tech_3:0 "Примітивна Електростанція"
resource_generator_power_tech_3_desc:0 "Електростанція на хімічному двоетапному двигуні забезпечує постійне виробництво енергії, якщо є паливо. Це дозволяє живити складне обладнання та покращує життя наших людей."
resource_generator_power_tech_4:0 "Поліпшена Електростанція"
resource_generator_power_tech_4_desc:0 "Кращі конденсатори, менше втрат і економніші генератори дозволяють використовувати довоєнні технології та надавати людям доступ до світла й базової побутової техніки."
resource_generator_power_tech_5:0 "Ядерний Реактор"
resource_generator_power_tech_5_desc:0 "Мініатюризовані ядерні осердя та масштабна енергомережа, що охоплює всі будинки в містах, дають змогу нашим громадянам користуватись усіма благами цивілізації, а фабрикам — працювати на максимум."

# метал
resource_generator_metal_tech_1:0 "Примітивна Ливарня"
resource_generator_metal_tech_1_desc:0 "Найпростіша ливарня, що складається лише з тигля і горна, дозволяє нам переплавляти брухт у базові матеріали для подальшого виробництва."
resource_generator_metal_tech_2:0 "Поліпшена Ливарня"
resource_generator_metal_tech_2_desc:0 "Досвід плавлення та ретельне очищення металу перед обробкою дозволяють отримати більше матеріалу та кращу якість кожного циклу виробництва."
resource_generator_metal_tech_3:0 "Примітивна Металобробна Фабрика"
resource_generator_metal_tech_3_desc:0 "Фабрика, що дає змогу відливати деталі для броні та техніки. Вона навіть частково очищає метал самостійно, хоча деякі дефекти все ще залишаються."
resource_generator_metal_tech_4:0 "Сучасна Металургія"
resource_generator_metal_tech_4_desc:0 "Завдяки сучасній техніці й навчанню ми можемо виготовляти гомогенні бронеплити з рівною поверхнею і мінімальними слабкими зонами. Це також відкриває шлях до лиття великих частин техніки, зокрема бронетурелей."
resource_generator_metal_tech_5:0 "Автономна Металургія"
resource_generator_metal_tech_5_desc:0 "Автоматизація всіх процесів — від сортування до лиття — роботами дає нам небачений рівень виробництва металу й сплавів для підтримки наших військових заводів."

#----------------------------
# Локалізація Технологій Електроніки
#----------------------------
resource_generator_circuitry_tech_1:0 "Лабораторія Виготовлення"
resource_generator_circuitry_tech_1_desc:0 "Збирати електроніку з брухту вже недостатньо. Ми створюємо лабораторії для виробництва скляних вакуумних ламп — життєво важливих обчислювальних компонентів, які виводять нас на новий рівень розвитку."
resource_generator_circuitry_tech_2:0 "Компресійні Камери"
resource_generator_circuitry_tech_2_desc:0 "Раніше ми створювали недосконалі компоненти з поганою герметичністю. Завдяки встановленню камер високого тиску та поглинання ми можемо створювати вакуумні компоненти, що значно покращують наші обчислювальні можливості."
resource_generator_circuitry_tech_3:0 "Розчини для Травлення"
resource_generator_circuitry_tech_3_desc:0 "Хоч вакуумна електроніка досі складна, наші вчені дивним чином винайшли альтернативу: «друковані плати». Їх ідеї звучать божевільно, але ми можемо поєднати деякі з них із нашими поточними процесами, аби підвищити ефективність виробництва."

#----------------------------
# Локалізація Технологій Сховищ Vault
#----------------------------
vault_industry_tech:0 "Інфраструктура Vault-Tec"
vault_industry_tech_desc:0 "Сховища — зразок довоєнної інженерії. Вивчаючи та демонтувавши непотрібні секції, ми можемо отримати цінні компоненти і знання про техніки довоєнного будівництва."
vault_medical_tech:0 "Медицина Сховищ"
vault_medical_tech_desc:0 "Медичні запаси Vault'ів були обмежені. Однак ми відкрили нові методи: розбавлені препарати, пасивне лікування, базове хімічне виробництво. Завдяки цьому ми можемо забезпечити ширше застосування медицини."
vault_manufacturing_tech:0 "Обладнання Vault-Tec"
vault_manufacturing_tech_desc:0 "Підземне виробництво складне, але Vault-Tec вдалося вирішити багато проблем: пасивне охолодження, мініатюризація, безпечність, надійність. Ці машини — одні з найкращих, що ми коли-небудь бачили."
vault_efficiency_tech:0 "Методи Переробки Vault"
vault_efficiency_tech_desc:0 "Технології переробки Vault-Tec вражають: очищення відходів, переробка їжі, ефективна передача енергії. Навіть доменні печі мають системи повторного використання газів. Запровадження лише частини цих рішень значно підвищить ефективність нашого виробництва."

#----------------------------
# Локалізація Підземної Промисловості
#----------------------------
underground_industry_tech:0 "Підземне Розширення"
underground_industry_tech_desc:0 "Коли на поверхні бракує місця, треба будувати вглиб. Застосування технологій Vault-Tec для будівництва підземних комплексів дає нам більше місця, спрощує логістику та забезпечує надійну базу в разі демографічного вибуху."

underground_hydroponics_tech:0 "Підземна Гідропоніка"
underground_hydroponics_tech_desc:0 "Запровадження гідропонних систем під землею — складна, але вигідна справа. Штучна атмосфера й хімічні засоби дають змогу вирощувати свіжу їжу. Ми можемо перевести частину робочої сили під землю і навіть ділитись надлишками з поверхнею. Тільки не дивіться уважно на ті помідори..."
underground_ventilation_tech:0 "Фільтр HEPA 20"
underground_ventilation_tech_desc:0 "Фільтри HEPA 20, відновлені за довоєнними кресленнями, суттєво покращують якість повітря. Коли застояне повітря змінюється на свіжий струмінь — навіть скептики розуміють важливість фільтрації. Це покращує здоров’я і продуктивність."
underground_security_tech:0 "Розширені Протоколи Блокування"
underground_security_tech_desc:0 "Кілька оборонних рубежів, міни, кулеметні гнізда й приховані виходи дозволяють нам вести війну на власній території з максимальною ефективністю. Ми можемо як відбивати атаки, так і організовувати удари з тилу. А якщо ворог знайде вхід — хай насолодиться вогнеметами."

#----------------------------
# Локалізація Технічного Ефекту
#----------------------------
tech_10_percent_coring_cost_increase_tt:0 "Отримайте постійне §R+10%§! до вартості анексії територій.\n"