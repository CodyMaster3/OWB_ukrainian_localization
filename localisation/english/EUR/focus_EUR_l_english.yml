l_english:
eur_max_sec:0 "Відкрити для бізнесу?"
eur_max_sec_desc:0 "Із захопленням Макс Сек нам треба вирішити, що робити з цим місцем. Раніше ж воно приносило чималий прибуток."

eur_desolation:0 "Спустошення"
eur_desolation_desc:0 "Евриці пощастило лише частково уникнути прямого удару під час Великої війни. Весь удар прийняв на себе океан, мутувавши природні джерела їжі в регіоні."

eur_rise_of_the_portmasters:0 "Пірати, п’яниці й повії"
eur_rise_of_the_portmasters_desc:0 "Ізольоване розташування Еврики означало, що її головні ресурси — родючі землі й рибальські угіддя — спершу були малокорисні. Але, як і багато міст у минулому, вона зрозуміла: можна експортувати найманців."

eur_expedition_abroad:0 "Гранітна компанія"
eur_expedition_abroad_desc:0 "До міста старої Еврики одного дня приїхав чужинець,\nМайже не говорив із місцевими, \nне мав особливо чого сказати,\nНіхто не смів питати про справи, ніхто не робив зайвого руху,\nБо чужинець серед них мав плазму на боці,\nПлазму на боці."

eur_the_hunt_twins:0 "Інвестиції Реддінґа"
eur_the_hunt_twins_desc:0 "Барони Реддінґа — щедре джерело капіталу й інвестицій, і ми отримали кілька пропозицій від деяких тамтешніх осіб. І, ем, одного супермутанта."

eur_olivia_focus:0 "Прагматизм Олівії"
eur_olivia_focus_desc:0 "Пропозиція Олівії — найрозумніша. Прісна вода залишається постійною проблемою з часів Великої війни, і розв’язання цієї загрози сильно допоможе нашому народові."

eur_cordell_focus:0 "Мрія Корделла"
eur_cordell_focus_desc:0 "Візіонер до самого кінця, план Корделла здобув перемогу. Він стане нам у пригоді, коли ми почнемо шукати золото. І навіть якщо самого золота не знайдемо — наші зусилля все одно принесуть користь."

eur_contact_the_shi:0 "Зв'язок із Ші"
eur_contact_the_shi_desc:0 "Території Наварро — важливе джерело сировини для Ші завдяки їхнім зв’язкам із НКР. Ми, можливо, не зможемо досягти того ж рівня відносин із цим загадковим угрупованням, але навіть спроба може принести вигоду."

eur_seize_our_destiny:0 "Увімкнути старі пісні"
eur_seize_our_destiny_desc:0 "Спала на думку ідея — а що як створити власну радіостанцію, яка транслюватиме погляди Гранітної компанії? Назвемо її 'Радіо Еврика'. Поки що."

eur_study_air_designs:0 "Вивчити конструкцію літаків"
eur_study_air_designs_desc:0 "Наші рейдери знайшли креслення та тексти, що описують функціонування літаків — дивовижних машин, здатних літати завдяки двигунам на крилах. Для багатьох це звучить неймовірно, але ця технологія може мати військове застосування."

eur_scavenge_airplanes:0 "Шукати літаки на брухт"
eur_scavenge_airplanes_desc:0 "Тепер, коли ми розуміємо, як працюють літаки, ми можемо направити наші пошукові загони на пошук їхніх залишків. Це буде повільний і дорогий процес через складність цих машин."

eur_clear_airports:0 "Очистити покинуті аеропорти"
eur_clear_airports_desc:0 "Більшість місцевих аеропортів залишились із довоєнних часів і нині повні шкідників та сміття. Їх очищення й відновлення дозволить запускати наші відремонтовані літаки з цих локацій."

eur_pilot_training_procedures:0 "Підготувати льотні інструкції"
eur_pilot_training_procedures_desc:0 "Окрім техніки, нам відчайдушно бракує навчених пілотів. На жаль, у Евриці майже ніхто не мав досвіду з літаками, тож доведеться імпровізувати з підготовкою інструкторів."

eur_airborne_volunteers:0 "Добровольці з повітря"
eur_airborne_volunteers_desc:0 "Тепер, коли в нас є базова авіаційна інфраструктура, ми можемо пропонувати наші літаки клієнтам разом із сухопутними військами."

eur_improve_plane_functionality:0 "Поліпшити характеристики літаків"
eur_improve_plane_functionality_desc:0 "Наші літаки — зібрані з різного брухту — суттєво відрізняються за якістю. Запровадження базового стандарту дозволить пілотам легше пересідати з літака на літак і скоротить час підготовки й бойових вильотів."

eur_construct_additional_runways:0 "Збудувати нові злітні смуги"
eur_construct_additional_runways_desc:0 "Смуги, які ми відновили з довоєнних часів, уже перевантажені. Будівництво нових має розв’язати цю проблему, та й технічно це просто — рівна земля. Наскільки це може бути складно?"

eur_ensure_trained_pilots:0 "Гарантувати підготовку пілотів"
eur_ensure_trained_pilots_desc:0 "Наші найманці мають страхітливу репутацію, але наші пілоти — навпаки. Їхні помилки, аварії й френдлі-файр випадки — легендарні. Кажуть, вони більше стріляють у своїх, ніж у ворога. Це треба виправити."

eur_take_pilot_input:0 "Вислухати пілотів"
eur_take_pilot_input_desc:0 "Пілоти можуть мати погану репутацію, але розуміються на літаках краще за всіх. Якщо наші інженери почнуть враховувати їхні поради — це може відкрити шлях до нових проривів."

eur_identifying_threats:0 "Визначення загроз"
eur_identifying_threats_desc:0 "Надто багато часу ми витратили на власні проблеми, втрачаючи з поля зору сусідів. На щастя, жоден із них не становить негайної загрози для нашої свободи — але це не означає, що ми не повинні бути обачними."

eur_the_fearsome_bear:0 "Страшний Ведмідь"
eur_the_fearsome_bear_desc:0 "Найочевиднішою загрозою нашому виживанню є зростаюча НКР на півдні. Ми сприяли її розширенню, воюючи в Наварро — і тепер маємо остерігатись її постійно зростаючої хватки. Території Наварро наразі нестабільні, але стабільна НКР може виявитись ще небезпечнішою."

eur_join_ncr:0 "Приєднатися до НКР"
eur_join_ncr_desc:0 "Можливо, найкращий спосіб впоратись із [NCR.GetName] — це приєднатися до неї, здобувши могутнього союзника на випадок майбутньої агресії. Ми втратимо частину своєї свободи, але краще частину, ніж усе — ця угода дозволить нам продовжувати звичний спосіб життя."

eur_benefit_from_ncr_oversight:0 "Скористатися опікою НКР"
eur_benefit_from_ncr_oversight_desc:0 "Як молоді члени Нової Каліфорнійської Республіки ми можемо отримати велику вигоду від інвестицій метрополії. Заохочення цих починань може швидко розвинути Еврику й змінити її на краще."

eur_against_goliath:0 "Проти Голіафа"
eur_against_goliath_desc:0 "У часи великої небезпеки ми не маємо вибору, окрім як вистояти. Ми вже билися з болотниками, що тероризували нас у минулому, й маємо зробити це знову. Ворог здається непереможним, але Портмайстри готові зустріти загрозу."

eur_contact_the_legion:0 "Вийти на зв'язок із Легіоном"
eur_contact_the_legion_desc:0 "Зустрітися з Легіоном зазвичай було б майже неможливо для країни на нашій позиції. Але роки, витрачені на створення зв’язків по всьому Західному Узбережжю, дозволяють нам влаштувати зустріч. Ми не любимо Легіон — їхнє рабовласництво огидне — але проти НКР нам знадобиться будь-яка перевага."

eur_destroy_the_ncr:0 "Знищити НКР"
eur_destroy_the_ncr_desc:0 "Ведмідь зайнятий. Ми можемо атакувати зараз — ударити швидко, просуваючись до Наварро та індустріального серця ворога. Це буде дорога війна, але, можливо, єдиний шанс не дозволити НКР розширитись до Еврики."

eur_the_growing_tribe:0 "Зростаюче плем’я"
eur_the_growing_tribe_desc:0 "Ми майже нічого не знаємо про Обраного з Арройо. Але помічаємо, як їхні кордони зростають — і це змушує наших лідерів готуватись до можливого протистояння. Якщо воно станеться — ми повинні бути готові."

eur_pursuing_partnership:0 "Пошук партнерства"
eur_pursuing_partnership_desc:0 "Нам не потрібно боятись Арройо. Вони можуть виглядати як загарбники, але їхні слова свідчать про турботу — про свій народ і про інших. Ми спробуємо домовитись з ними — на краще чи на гірше."

eur_arr_readying_for_war:0 "Підготовка до війни"
eur_arr_readying_for_war_desc:0 "Думати про Арройо як про щось інше, ніж потенційного гнобителя — наївність. Ми повинні готуватись до удару — й зробити це швидко, коли з’явиться нагода. Ці приготування триватимуть довго, але будуть надзвичайно ефективними."

eur_provoke_unrest_in_packers:0 "Спричинити заворушення серед Пакерів"
eur_provoke_unrest_in_packers_desc:0 "Окупація Арройо в регіоні Пакерів — постійний біль голови для них. Наша близькість до регіону дозволяє нам перетворити цей біль на мігрень — через контрабанду зброї та боєприпасів через кордон."

eur_invade_umbra:0 "Вторгнення в Умбру"
eur_invade_umbra_desc:0 "Ми повинні завдати удару, поки Арройо слабкі та відволічені. Якщо чекатимемо — вони лише зміцняться, і зрештою поглинуть нас. Слава Евриці! Геть арройських тиранів!"

eur_begin_army_reforms:0 "Почати військові реформи"
eur_begin_army_reforms_desc:0 "Конфлікти з нашими сусідами потребують іншої армії, ніж та, яку ми маємо. Наші найманці сильні логістично, але звикли до ворогів без переваги. Це навряд чи зміниться, але ми маємо створити єдину бойову силу, здатну зосереджено завдати удару."

eur_finish_army_reforms:0 "Завершити військові реформи"
eur_finish_army_reforms_desc:0 "Поточний стан реформ — нестабільний. Ми повинні продовжити їх, щоб повністю підготуватись до нових викликів."

eur_finalize_a_standing_army:0 "Оформити постійну армію"
eur_finalize_a_standing_army_desc:0 "Попри завершення реформ, багато хто з наших бійців почуваються розгублено. Вони ще не звикли до нових ролей і близькості до дому. Формальна ліквідація найманської структури дозволить спрямувати ресурси на подолання цієї проблеми."

eur_begin_local_development:0 "Відновити маєток Карсона"
eur_begin_local_development_desc:0 "Оскільки ми більше не можемо покладатись на мародерство для підтримки армії, потрібно стимулювати місцевий розвиток. Перший крок — відреставрувати старий маєток Карсона, вікторіанський палац, і зробити його штабом нашого містечка."

eur_begin_weapons_production:0 "Угода з Gun Runners"
eur_begin_weapons_production_desc:0 "Нашим силам потрібне пряме джерело зброї. Можливо, вдасться переконати Gun Runners відкрити тут філію?"

eur_begin_local_development2:0 "Відновити Старе місто"
eur_begin_local_development2_desc:0 "Колись Еврика мала приємний центр міста — осередок торгівлі й промисловості. З належною реставрацією він може ним стати знову."

eur_begin_weapons_production2:0 "Місцеве виробництво"
eur_begin_weapons_production2_desc:0 "Замість того, щоб покладатися на Gun Runners, ми можемо розвинути власне виробництво. Це коштуватиме дорого й загальмує інші економічні ініціативи, але дасть нам повну незалежність."

eur_begin_local_development3:0 "Торгівельний вузол"
eur_begin_local_development3_desc:0 "Еврика може бути чимось більшим, ніж сонний пункт для найманців. Завдяки нашим останнім досягненням ми можемо привабити караванні компанії й зробити Еврику центром експедицій на північ — взірцем нашого правління!"

eur_begin_weapons_production3:0 "Методи виробництва Анклаву"
eur_begin_weapons_production3_desc:0 "Наварро та Платформа були в деякому сенсі схожі на нас. Подумаймо – їм доводилося виготовляти передове спорядження, маючи лише ресурси цих двох баз. Можливо, їхні інструкції стануть у пригоді й нам? Хоча, звісно, НКР це не сподобається."
eur_plasma_guns:0 "Абсолютна Вогнева Міць"
eur_plasma_guns_desc:0 "Плазмова гармата — справжній символ успіху Анклаву. І нарешті майстерні Наварро знову здатні випускати цю зброю."
eur_the_growing_port: "Зростаючий Порт"
eur_the_growing_port_desc: "Порт Евріки за останні роки значно активізувався. Тепер тут постійно бувають мандрівники, а також звідси вирушають наші найманці. Наступним логічним кроком буде розширення портових потужностей."
eur_sell_excess_convoys: "Продаж Надлишкових Конвоїв"
eur_sell_excess_convoys_desc: "Конвої — важливий спосіб постачання наших найманців у полі. Проте іноді ми виробляємо їх забагато. Продаж зайвих приватним покупцям або іншим прибережним племенам — легкий спосіб отримати прибуток."
eur_joint_force_drills: "Спільні Навчання"
eur_joint_force_drills_desc: "Наш флот часто діє незалежно від сухопутних сил. Це іноді призводить до серйозних проблем, якщо підкріплення не прибуває вчасно. Проведення комплексних навчань має зменшити ці ризики."
eur_prioritize_army_training: "Пріоритет — Армійське Навчання"
eur_prioritize_army_training_desc: "Ми маємо бути впевнені, що офіцери флоту діють на підтримку сухопутних військ, а не на власний розсуд. Надання пріоритету армійському навчанню сприятиме цьому, хоч і залишить флотських командирів незадоволеними."
eur_ship_exporting_scheme: "Схема Експорту Кораблів"
eur_ship_exporting_scheme_desc: "Попередній продаж наших конвоїв виявився прибутковим. Якщо ми зосередимось на цьому напрямку, то зможемо перетворити його на стабільне джерело фінансування."
eur_joint_force_support: "Пропозиція Логістичної Підтримки"
eur_joint_force_support_desc: "Наша морська перевага надає логістичні переваги нашим наступальним операціям. Ми можемо навчити як морські, так і сухопутні сили, щоб забезпечити такі ж переваги нашим клієнтам. Це передбачає менше бойових дій, ніж у корпусу найманців, але дозволить нам удосконалити наші методи."

eur_mercenary_expansion: "Розширення Найманців"
eur_mercenary_expansion_desc: "Проста логіка: чим більше конфліктів ми охоплюємо, тим більше заробляємо. Нинішній радіус дії, обмежений західним узбережжям, — надто вузький. Встановлення постачальних маршрутів через річки й моря суттєво розширить наші горизонти."
eur_river_convoys: "Річкові Конвої"
eur_river_convoys_desc: "Наразі наші кораблі пристосовані лише до швартування в основних портах і мають труднощі з досягненням найманців річками. Ми можемо змінити конструкцію, щоби пристосувати їх до річкових шляхів і вийти глибоко в річки Орегону."
eur_lower_snake_expansion: "Розширення на Нижній Снейк"
eur_lower_snake_expansion_desc: "Наші найманці повідомляють про торговців, які говорять про екзотичні племена вгору за течією Орегону. Розповідають про людей, що поклоняються пару, лісових людей, які ходять із звірами, і канібалів, збожеволілих від давніх пристроїв. Це виглядає як чудова ділова можливість — було б безглуздо її ігнорувати."
eur_northern_expansion: "Північна Експедиція"
eur_northern_expansion_desc: "Ще більш дикі землі чекають наших найманців на північ від Капітолійського Пагорба. Місцеві рейдери відомі своєю жорстокістю й охоче приймуть допомогу в набігах. Сподіваємося, отриманий у холодних пустках досвід дозволить нам уникнути ролі їхніх майбутніх жертв."
eur_mexican_expedition: "Шлях до Мексики"
eur_mexican_expedition_desc: "Мексика недалеко від наших найпівденніших позицій у Нижній Каліфорнії. Експедиція туди буде непростою — мовний бар'єр може ускладнити переговори з роботодавцями. Але винагорода варта зусиль, якщо регіон справді такий нестабільний, як говорять."
eur_from_north_to_south: "З Півночі на Південь"
eur_from_north_to_south_desc: "Наші інвестиції почали окуповуватись. Найманці отримали роботу по всьому західному узбережжю, здобувши репутацію, про яку ми й не мріяли. Слава Евріці!"
eur_south_of_honduras: "Південніше Гондурасу"
eur_south_of_honduras_desc: "Наші воїни чули про анархію, якою керують рейдери в Центральній Америці. Знайти стабільних клієнтів там буде складно, але власні набіги можуть дати серйозні прибутки."
eur_timberline_scouts: "Розвідники з Лісового Рубежу"
eur_timberline_scouts_desc: "Трайбали з Лісового Рубежу — доволі своєрідні. Вони живуть лише лісом і попросили допомоги в затяжному конфлікті. Вони заслуговують на підтримку — принаймні більше, ніж інші наші клієнти. І ми їм допоможемо. За винагороду."
eur_battling_the_mutants: "Битва з Мутантами"
eur_battling_the_mutants_desc: "Безконтрольні мутанти з Трольячої Пастки — можливо, найбільша загроза виживанню людей в Орегоні. Ми могли б вивчити їхню тактику в бою, але ризик надто великий. Досить просто воювати з ними."
eur_people_of_the_steam: "Люди Пару"
eur_people_of_the_steam_desc: "Релігія — та що там, усе життя Небесної Брами — повністю відрізняється від Евріки. Їхня відданість пару і Богу не схожа на анімізм трайбалів, до яких ми звикли. Поки ми там, ми обміняємо щось на їхню унікальну парову зброю."

eur_our_role_in_oregon: "Наша Роль на Узбережжі"
eur_our_role_in_oregon_desc: "Ті, хто звертається до нас із пропозиціями про роботу, часто мають спільні риси. Кисла усмішка, нервове сіпання, відчуття власної винятковості — усе це про наших роботодавців. Вони платять, а ми даємо їм лише тимчасову лояльність і нашу експертизу."

eur_decrepit_power_armor: "Відновлення Занедбаних Силових Бронь"
eur_decrepit_power_armor_desc: "Наші добровольці у Вашингтоні помітили поширену практику — викидати зламану чи стару силову броню. Ми можемо почати тихо збирати ці залишки, можливо, дозволивши використовувати їх у нашій армії."

eur_power_armor_training: "Тренування із Силовою Бронею"
eur_power_armor_training_desc: "Маючи нові запаси силової броні, ми мусимо навчитися ефективно використовувати її в бою. Вона повільніша й важча за іншу зброю, тому вимагає додаткового навчання для воїнів, які хочуть її носити."

eur_lessons_from_old_enemies: "Уроки від Колишніх Ворогів"
eur_lessons_from_old_enemies_desc: "Болотники колись були найбільшою загрозою для виживання Евріки. А тепер їхні представники — наші клієнти. Як би дивно це не здавалося нашим воїнам, зокрема Портмайстру Сміту, ситуація на півночі зовсім інша, ніж колись у нас."

eur_umbra_tribals: "Трайбали Умбри"
eur_umbra_tribals_desc: "Наші північні сусіди — Умбра — нещодавно почали перехід від тваринного племінного способу життя до напівіндустріальної нації. Цей шлях був нелегким, про що свідчить наша участь у їхніх справах. Чи стане їхня нестабільність нашою перевагою чи загрозою — покаже лише час."

eur_baja_bonanza: "Бонанца в Бахі"
eur_baja_bonanza_desc: "Півострів Баха — можливо, найгірший кошмар НКР, але для найманця — справжня золота жила. Бандити там купаються в грошах і готові поділитися, якщо ми допоможемо їм проти сильнішого ворога."

eur_investing_our_gains: "Інвестиції Наших Прибутків"
eur_investing_our_gains_desc: "Багатство, яке ми здобули, не повинне лише йти на закупівлю спорядження. Наші люди ризикували життям і грошима, аби профінансувати найманські експедиції. Ми подбаємо, аби віддячити їм за щедрість."

eur_fellow_fighters: "Бойові Побратими"
eur_fellow_fighters_desc: "Схоже, ми знайшли однодумців у Вільних Бійцях — групі борців у масках, що обожнюють рестлінг. Вони, м’яко кажучи, дивні, але хто з нас не такий? Наші стосунки швидко розвиваються, і з них вийдуть чудові союзники."

eur_friends_in_the_sun: "Друзі Під Сонцем"
eur_friends_in_the_sun_desc: "Ух, як же тут тепло. Тропічний рай і розкішні вілли маскують деспотичну владу в [GDH.GetName], але водночас символізують доступне тут багатство. Ель Генераліссімо залюбки платить за наші послуги — і є гірші місця для війни."

eur_land_of_the_giants: "Земля Велетнів"
eur_land_of_the_giants_desc: "Міць Імперії Ацтлану може зрівнятись із НКР. На щастя, відстань між нами настільки велика, що наші стосунки поки що залишаються мирними. Конфлікт між ними та [ITZ.GetName] — ідеальний шанс для втручання. Хто знає, може ми навіть щось навчимось про сільське господарство."

eur_raider_refugees: "Рейдерські Біженці"
eur_raider_refugees_desc: "Наші сили на півночі почали жаліти голодних біженців, які блукають цими землями. Покоління грабунку та анархії лишили їх у відчаї. Командири дедалі частіше просять дозволу повернутись із родинами біженців. Схвалення таких прохань стане перевіркою військової організації та підвищить набір до армії — вдячні біженці охоче служитимуть."

eur_wanderers_welcome: "Мандрівники Ласкаво Просимо"
eur_wanderers_welcome_desc: "Досвід із біженцями з Зламаного Узбережжя відкрив нам очі на потенціал біженської програми. Відкриття міст загрожує нашим ресурсам, але приплив молодих працездатних людей усе компенсує."

eur_fourways_crisis: "Втручання у Фоурвейс"
eur_fourways_crisis_desc: "Окрім близькості, в нас немає причин втручатися в справи [FOU.GetName]. Але останні кроки Арою та Реддінґа щодо встановлення контролю над цією торговою державою викликають занепокоєння. Ми надто слабкі для прямого втручання, але можемо зіграти свою роль у майбутньому цього регіону."

eur_modify_scavenging_procedures:0 "Зміна Методу Збирання"
eur_modify_scavenging_procedures_desc:0 "Оскільки наші операції поширюються, нам потрібні нові клієнти й нові регіони. Старі методи збирання були ефективними, але їх слід реформувати, щоб підтримати наші війська."

eur_guns_in_bulk:0 "Зброя Оптово"
eur_guns_in_bulk_desc:0 "Логічно почати реформу з підходу до збирання стрілецької зброї — основи нашої армії. Можемо зробити ставку на кількість або на швидкість у кожному рейді."

eur_guns_quickly: "Зброя, Швидко"
eur_guns_quickly_desc:0 "Логічно почати реформу з підходу до збирання стрілецької зброї — основи нашої армії. Можемо зробити ставку на кількість або на швидкість у кожному рейді."

eur_take_it_all:0 "Забрати Все"
eur_take_it_all_desc:0 "Часто знайдене нашими збирачами допоміжне обладнання вважається непридатним до вжитку. І хоча це часто так, ми не завжди повинні його викидати. Навчання ремонтів на місці може значно скоротити час на виготовлення нового обладнання."

eur_rapid_repair:0 "Швидкий Ремонт"
eur_rapid_repair_desc:0 "Часто знайдене нашими збирачами допоміжне обладнання вважається непридатним до вжитку. І хоча це часто так, ми не завжди повинні його викидати. Навчання ремонтів на місці може значно скоротити час на виготовлення нового обладнання."

eur_makeshift_power_armor:0 "Імпровізована Силова Броня"
eur_makeshift_power_armor_desc:0 "Знайти цілісну силову броню майже неможливо — хіба що на полі бою Братства. Замість цього, можна складати обладунок із уламків та сирих матеріалів, підвищивши ефективність наших рейдів."

eur_reuse_vertibird_engines:0 "Повторне Використання Двигунів Вертібьордів"
eur_reuse_vertibird_engines_desc:0 "Матеріалів для літаків дуже мало, але база Наварро — ідеальне місце для пошуку деталей від старих Вертібьордів. Потрібно діяти обережно, бо це територія НКР, але ці рейди можуть швидко збільшити наш авіапарк."

eur_bypassed_wires:0 "Обхідні Проводи"
eur_bypassed_wires_desc:0 "Мало хто знає, як наші збирачі ремонтують машини з минулих століть. Часом здається, що вони й самі не знають. Як би там не було, ми можемо навчити їх хитрощів — або прискорити виробництво, або створити запасні системи."

eur_spare_tires:0 "Запасні Шини"
eur_spare_tires_desc:0 "Мало хто знає, як наші збирачі ремонтують машини з минулих століть. Часом здається, що вони й самі не знають. Як би там не було, ми можемо навчити їх хитрощів — або прискорити виробництво, або створити запасні системи."

eur_scavenger_to_general:0 "Від Збирача до Генерала"
eur_scavenger_to_general_desc:0 "Час від часу серед збирачів трапляються справжні герої. Один із них, загадковий тип, що називає себе лише Збирач №51, показав чудові лідерські якості. Схоже, настав час для підвищення."

eur_begin_expansionism:0 "Почати Експансію"
eur_begin_expansionism_desc:0 "Оскільки наша армія більше не подорожує, щоб заробляти гроші, ми маємо знайти їй застосування вдома. Нашим сусідам потрібен захист — на жаль, не всі готові прийняти наш нагляд добровільно."

eur_little_slice_paradise:0 "Куточок Раю"
eur_little_slice_paradise_desc:0 "Південна Каліфорнія — спекотна й посушлива, тоді як північна — зелена і приємна. Колись людей називали американськими, як яблучний пиріг — і в Евріці все ще вирощують яблука. Можливо, варто заохотити переселення сюди?"

eur_guns_germs_or_steel:0 "Зброя, Хвороби чи Сталь"
eur_guns_germs_or_steel_desc:0 "Цікаво, але успішні найманські загони створюють не лише захист, а й ринок для промисловості. Чимало людей хочуть відкрити бізнес в Евріці. Але кого ми підтримаємо?"

eur_francis_won:0 "Промисловість Супермутантів"
eur_francis_won_desc:0 "Які в них великі руки! Ідеальні для перенесення важкого обладнання. Як би ми не ставились до них, очевидно — мутанти справляються з тим, що не під силу «гладкошкірим»."

eur_salvage_operations:0 "Операції зі Збирання"
eur_salvage_operations_desc:0 "Певні старі кораблі прибило до берега біля Евріки. Можливо, ми зможемо розібрати їх на метал? Напевно, знайдеться їм застосування."

eur_new_management: "Новий Менеджмент"
eur_new_management_desc:0 "Регулятори, Портмайстри, дикуни-трайбали та Гранітна Компанія вигнали НКР із Наварро. Приклад толерантності! А тепер нам потрібно дбати про сотні миль території..."

eur_new_generation: "Нове Покоління"
eur_new_generation_desc:0 "Що змушує людину стати найманцем? Жадоба золота? Влада? Вірність забутій справі? Або нейтральне серце? За належного фінансування ми знайдемо у Пустці тих, хто битиметься за будь-яку — або всі — ці причини."
eur_new_generation_tt:0 "\n§gОріон Морено повертається до лав.\n§!"

eur_suspicion_increase_tt:0 "\n§PЦе підвищить підозру з боку НКР.§!"

eur_power_armor_specialization:0 "Справжня Уніформа"
eur_power_armor_specialization_desc:0 "Колись X-01 наганяла страх по всій Каліфорнії, а тепер ми змушені задовольнятись уламками. Але за належного фінансування ми можемо найняти збирачів, щоб поповнити запаси. Це ж не зашкодить, правда?"
eur_power_armor_specialization_tt:0 "\n§PВідкриває рішення щодо ремонту силової броні з ризиком привернення уваги Ведмедя. Але кого це хвилює?"

eur_refugees_rig:0 "Поселенці чи «поселенці»?"
eur_refugees_rig_desc:0 "Наварро — усе ще багатий, дикий кордон. Але як залучити туди нових поселенців, якщо ми щойно вигнали звідти НКР після громадянської війни?"

eur_plasma_grenades:0 "Поставки від Ван Граффів"
eur_plasma_grenades_desc:0 "Щоб створити справжні військові частини з енергетичною зброєю, нам потрібен зовнішній постачальник. На щастя, Ван Граффи готові допомогти. Якщо тільки наші вороги не почнуть панікувати через співпрацю з... ::перевіряє нотатки:: торговцями зброєю."
eur_plasma_grenades_tt:0 "\n§PВідкриває рішення щодо закупівлі зброї у Ван Граффів з ризиком привернення уваги Ведмедя. Як шкода."

eur_scientists_to_navarro:0 "Уроки Минулого"
eur_scientists_to_navarro_desc:0 "Гранітна Компанія колись працювала на силу, що мала ядерні реактори й найкращі «квантові багнюляники» на заході від Міссісіпі. Регулятори колись контролювали найбагатше місто Нової Каліфорнії. А тепер Евріка виживає як і всі — на уламках. Але, можливо, хтось погодиться працювати на нас?"

eur_power_armor_specialization1:0 "Армія з Нацією"
eur_power_armor_specialization1_desc:0 "Думаєш, Евріка — просто банда піратів, п’яниць та шльондр? Можливо. Але ми можемо бути чимось більшим. Найсильніша армія західного узбережжя, що покаже решті Пустки, на що ми здатні. Історія називала нас негідниками — майбутнє назве героями."
eur_power_armor_specialization1_tt:0 "\n§PОчевидно, НКР стане ще більш підозрілою через скупчення силових бронь.§!"

eur_brahmin_ranches:0 "Ферми Брамінів"
eur_brahmin_ranches_desc:0 "Один зі способів задобрити НКР — дозволити баронам брамінів орендувати землю в Реддінґу. Це викличе невдоволення трайбалів, але ми подбаємо про їхні інтереси краще, ніж це робили в Тіньових Пісках. А [NCR.GetLeader] досить розумний, щоб зрозуміти: краще половина хліба, ніж нічого."

eur_workshops_of_navarro:0 "Майстерні Наварро"
eur_workshops_of_navarro_desc:0 "НКР спаплюжила арсенали та майстерні Наварро — але хто сказав, що ми не можемо їх відновити?"

eur_packing_defenses:0 "Загроза Мутантів"
eur_packing_defenses_desc:0 "На півночі — мутанти, канібали, очевидно сатанинське Братство та канадці. Щоб забезпечити наш периметр, ми маємо захопити §Y[PAC.GetNameWithFlag]§! і захистити Каліфорнію. А ще — подумаємо про прибутки від нового торгового маршруту."

eureka_vertibirds:0 "Небо — не межа"
eureka_vertibirds_desc:0 "Минуло вже десятки років відтоді, як Анклав піднімався в небо. Але ми все ще можемо знайти тих, хто любив літати. Контроль над Наварро дозволяє нам знову будувати вертобірди. Чесно? Немає нічого кращого за кабіну пілота."
eureka_vertibirds_tt:0 "\n§gДейзі Вітмен рада повернутись до старої справи.\n§!"

eur_revenge_baby: "Останнє Слово"
eur_revenge_baby_desc: "Спочиньте спокійно, хоробрі солдати. Після тридцяти років ми помстилися за вашу загибель. Тепер настав час вирішити долю цивільних ворогів з Арою."

eur_miners_redding:0 "Гірнича Техніка для Реддінґа"
eur_miners_redding_desc:0 "Нам бракує робочої сили для розробки земель навколо Наварро (та й не певні, чи там є щось корисне). Але, можливо, Реддінґ скористається нашими інженерами — за відповідну плату."

eur_infrastructure_development:0 "Оподаткування Торгівлі"
eur_infrastructure_development_desc:0 "НКР ніколи повністю не підкорила Наварро — а ми можемо. Кілька доріг для сполучення поселень збільшать обсяги торгівлі, а з нею — і кількість того, що можна «оподаткувати»."

eur_enclave_technicians:0 "Фахівці Анклаву"
eur_enclave_technicians_desc:0 "200 років підтримання технологічної цивілізації, маючи лише Нафтову Платформу, кілька баз і світлий маяк у Середньому Заході, було непростим. Добре, що в нас є досвід."

eur_attack_ncr:0 "Анклав Завдає Удару"
eur_attack_ncr_desc:0 "Гранітна Компанія — завжди в меншості, ніколи не в недостачі. Один сильний удар — і корумпований режим Нової Каліфорнії впаде. І нас зустрінуть як визволителів."

eu_ncr_puppet:0 "Остання Надія Америки"
eu_ncr_puppet_desc:0 "Перед нами вибір. Ми можемо атакувати НКР — і, можливо, перемогти, зважаючи на їхню перевтому. Але жертв буде надто багато. А що, як ми спробуємо інший шлях?\n\nНКР зберігає багато американських традицій — бейсбол, споживацтво й... вибори."
eu_ncr_puppet_tt:0 "Ви станете маріонеткою НКР, але зможете балотуватись у президенти!"

eur_awsome_power_armor:0 "Повернення в Чорному"
eur_awsome_power_armor_desc:0 "Багато хто вступав до Гранітної Компанії заради силової броні. Але ці дурні не розуміли, наскільки важко виготовити X-01. Ми були найманцями, не державою. Але контроль над ресурсами Арою відкриває нові можливості."

eur_army_conscription:0 "Призовні Кампанії"
eur_army_conscription_desc:0 "Чимало новобранців Гранітної Компанії були, відверто кажучи, мрійниками, дурнями чи найманцями, що гнались за прибутком. Але в Наварро ми бачимо зародження величі. Нація, яка чекає "

eur_god_bless_enclave:0 "Боже, Благослови Анклав"
eur_god_bless_enclave_desc:0 "Десь у глибині душі Граніт задумався — чи був інший шлях? Чи мав він іти на схід, до Макартура? Або до Чикаго? Чи могла Компанія щось змінити там? Але 'що було б' — це марна гра. Їхня перемога на заході — беззаперечна. Анклав повернувся, Каліфорніє!"

eu_army_conscription:0 "Повернення Додому"
eu_army_conscription_desc:0 "Сан-Франциско — місто складних почуттів для багатьох з нас. Дітей Зоряного Батька вигнали нетерпимі Ші, а Гранітна Компанія вважає, що терористичний напад на Платформу почався саме звідти. Можливо, час навідатись до старих друзів."

eur_whacha_gonna_do:0 "Занадто Великі, Щоб Пасти"
eur_whacha_gonna_do_desc:0 "Успіх Евріки перетворив нашу щасливу компанію на армію з державою — нестійке рішення. Щоб рухатись далі, нам потрібен лідер. Але хто саме?"
eur_whacha_gonna_do_tt:0 "Доля Евріки буде вирішена тією фракцією, яка матиме найбільший вплив."

eur_regulator_rail_guns:0 "Рейлгани Регуляторів"
eur_regulator_rail_guns_desc:0 "Ми вивчили уроки з минулого. Ніхто більше не перевершить нас в озброєнні!"

eur_enclave_strikes_back:0 "Пам'ятай Платформу"
eur_enclave_strikes_back_desc:0 "30 років тому НКР вирізала наших братів і сестер у Наварро. Але ми вижили. Анклав повернувся, Америко! І не лише на радіо. Скоро — і у ваших містах."

eur_portmaters_goals:0 "Порти Без Кінця"
eur_portmaters_goals_desc:0 "Якщо ми хочемо виходити на всі ринки, нам потрібні нові плацдарми. Порт-Рояль і Віце-королівство нам підійдуть."

eur_gift_from_the_ones_above:0 "Дарунки Кетцалькоатля"
eur_gift_from_the_ones_above_desc:0 "Дехто каже, що ми вкрали ці ядерні боєголовки зі старого бункера. Але справжні віруючі знають: це дар Кетцаля. Нехай же наше колесо прокотиться по ворогах!"

eur_the_mega_church:0 "Велика Церква"
eur_the_mega_church_desc:0 "Наше колишнє місто — Сан-Франциско — вже давно потерпає від скептиків і насмішників, що глузують зі Зоряного Батька! Ми повинні звести монумент нашій вірі, що зможе навернути будь-кого до нашої непогрішної доктрини!"

eur_hubbels_telescope:0 "Телескоп Габбела"
eur_hubbels_telescope_desc:0 "Колись давно, у минулу епоху, ми мріяли про вільні польоти між зірками. Наш великий засновник зібрав достатньо благодійних внесків, щоб відправити супутник у володіння Зоряного Батька майже 200 сонячних циклів тому."

eur_operation_cinderella:0 "Операція «Попелюшка»"
eur_operation_cinderella_desc:0 "Ми повинні очистити світські архіви від темних плям нашого минулого, якщо прагнемо зберегти чистий образ! Потрібно захопити й спалити будь-яку установу, що зберігає дані про Зоряного Батька."

eur_jumbo_jet:0 "Вільне Небо"
eur_jumbo_jet_desc:0 "Наш засновник вірив, що наші добрі справи принесуть плоди в загробному житті, і ми мандруватимемо між зірками тисячі років — у власних джамбо-джетах!"

eur_starfathers_realm:0 "§GВолодіння Зоряного Батька§!"
eur_starfathers_realm_desc:0 "Телескоп Габбела прийняв сигнали з далекого всесвіту. Усі, хто почув ці хтонічні записи, збожеволіли. Тепер Річард Ґолдман хоче транслювати їх усій вірі..."

eur_eastern_pilgrimage:0 "Східне Паломництво"
eur_eastern_pilgrimage_desc:0 "Багато наших послідовників вірять, що на далекому сході захована велика таємниця, без якої наша віра загине. Ці паломники давно вирушили, але тепер повертаються — разом із поселенцями зі сходу, щоб допомогти поширити віру по всьому Володінню Зоряного Батька."

ncr_regulator_friends:0 "Кращий Друг Ведмедя"
ncr_regulator_friends_desc:0 "Республіка — це багато чого, але вірний друг? Ну, іноді. Але тепер вона визнає наш союз раз і назавжди. Ми навіть знищимо Братство замість них."

EUR_starfather:0 "Володіння Зоряного Батька"
eureka_hubologists:0 "Паломники Повертаються"
eureka_skyyachts:0 "Яхти Небес"
eur_hubologist_path_tt:0 "§GЦей фокус відкриє подальший вміст!§!"
eur_hubologist_claims_tt:0 "§GЦе дасть нам претензії на Орегон для придушення незручної правди!§!"

eur_skies_limit:0 "Ми Просто Любимо Літати"
eur_skies_limit_desc:0 "Деякі запитують, що саме ціляться вертобірди Наварро. Але це дурне питання — для багатьох наших пілотів це просто гордість служити в авіації й літати у відкритому небі."

### Міністри
the_genetic_elite:0 "Генетичний Відбір"
enclave_salvagers:0 "Американська Винахідливість"
the_genetic_elite2:0 "Ветерани Старих Часів"
eur_steam_powered_weapons:0 "Зброя на Парових Ядрах"
all_are_welcome:0 "§OУсім Ласкаво Просимо§!"
the_genetic_elite3:0 "Здорові Американці"
the_genetic_elite4:0 "Нема Бізнесу Краще за Шоу-Бізнес"
eur_enclave_pilots:0 "Пілоти Довоєнної Епохи"

### Наварро — Анклав
eur_new_order:0 "Новий Порядок"
eur_new_order_desc:0 "Гранітна Компанія зростала на казках про героїзм Анклаву. Вони були тими, хто ніс зерно американської величі крізь післяатомний жах, хто прагнув відбудувати націю. Принаймні, так розповідали. Але реальність виявилась дещо іншою — за кожним кущем чатував ворог. Як же група найманців може правити?"

eur_amnesty_for_soldiers:0 "Солдати Ведмедя"
eur_amnesty_for_soldiers_desc:0 "Наших власних сил замало, щоб контролювати всю Каліфорнію та втілювати мрії Анклаву. Але НКР мала власну армію. Можливо, деяких їхніх солдатів варто прийняти?"

eur_sierra_army_depot:0 "Склади Армії Сьєрра"
eur_sierra_army_depot_desc:0 "Чи знали ви, що Гранітна Компанія колись думала оселитися в Сьєрра? Цікава ідея, але наївна. Анклав ніколи по-справжньому не досліджував цей об'єкт, і він був занадто близько до ключових інтересів НКР. Але тепер, коли ця проблема вирішена — там може бути щось цінне."
eur_sierra_army_depot_tt:0 "\n§gБоже, уявіть, якби ми стали сусідами Ріно. Скільки хоробрих людей зіпсувались би?§!"

eur_apa_training:0 "Справжня Армія"
eur_apa_training_desc:0 "Ми не зможемо достойно носити ім’я Анклав, поки покладаємось лише на кілька силових бронь і випадкових найманців. Ми повинні зробити більше. Відродимо Американську армію на Західному узбережжі!"

eur_vertibirds:0 "Уламки Вертібьордів"
eur_vertibirds_desc:0 "Нам вдалось знайти уламки Вертібьорди ще до падіння Платформи, розкидані по Каліфорнії. Мушу визнати — вони б стали в пригоді значно раніше."

eur_moore:0 "Більше Каліфорнійців Записується!"
eur_moore_desc:0 "Наші спроби вербувати героїв для Анклаву дали плоди. Кассандра Мур — партизанка проти наших героїв — прийняла амністію. Тепер вона бажає служити Анклаву та його великій справі!"

eur_let_the_sun_shine:0 "Комісія з Атомної Енергії"
eur_let_the_sun_shine_desc:0 "Хоча Обранець знищив Комісію з Атомної Енергії на Платформі, тепер у нас є шанс її відродити. А гульки, як не дивно, найкраще справляються з токсичними відходами."

eur_robots_sierra_army:0 "Робототехнічний Комплекс"
eur_robots_sierra_army_desc:0 "Третій поверх Складу Армії Сьєрра колись був присвячений робототехніці. Хоча більшість систем вийшли з ладу, деяку корисну інформацію ми ще можемо звідти витягти."

eur_enclave_purpose:0 "Анклав, Відновлений"
eur_enclave_purpose_desc:0 "Можна думати, що Анклав — зло або диктатура. І це правда. Але ми тут, щоб захистити вас від загроз Пустки та збудувати дім для американців."

eur_salvage_genes:0 "Збір Генетичного Матеріалу"
eur_salvage_genes_desc:0 "Ми бачимо наслідки радіації та Великої Війни по всій Новій Каліфорнії. Усякі мутанти, викривлені тіла й способи життя пронизують Пустку. Ми маємо вивчити, як це виправити, якщо хочемо її врятувати."

eur_citizen_grades:0 "Оцінки Громадян"
eur_citizen_grades_desc:0 "Чутки про те, що Анклав хотів знищити Пустку — абсурдні. Але емпіричний факт: через мутації дехто є 'рівнішим' за інших."

eur_use_for_mutants:0 "Знайти Використання для Мутантів"
eur_use_for_mutants_desc:0 "Супермутанти Пустки — огидні, неприродні. Яка здорова спільнота терпіла б цих генетичних глухих кутів? Їхня єдина цінність — праця, яку ми можемо з них витиснути до 'раціоналізації'."

eur_rooting_out_ghoul_sympathizers:0 "Некрополь — Дім для Гулів!"
eur_rooting_out_ghoul_sympathizers_desc:0 "Можливо, ви думаєте, що ми монстри — але це не так. Багато гулів у Новій Каліфорнії — непогані люди. Просто, на нашу думку, їм краще бути серед своїх. Згідно з Виконавчим Наказом 67А-8, усі гулі під федеральною юрисдикцією мають бути переселені в Некрополь. Це на благо всім, справді."

eur_protect_mankind:0 "Захисники Цивілізації"
eur_protect_mankind_desc:0 "Є ще ті, хто готовий зробити все задля захисту цивілізації. Звернімося до них."

eur_flynn:0 "Наш Чоловік у Реддінґу"
eur_flynn_desc:0 "Доки одні мріють про корупцію НКР, Антон Флінн і барони брамінів чітко усвідомлюють своє місце. І це логічно: вони годують Нову Каліфорнію, тож є своєрідним анклавом цивілізації."

eur_enclave_radio:0 "Відродити Голлівуд!"
eur_enclave_radio_desc:0 "Одна з головних проблем НКР — безліч голосів і думок, що конфліктують. Передачі Анклаву допомагали цьому протистояти. А тепер ми можемо здійснити мрію — знову знімати фільми в Голлівуді. Під належним наглядом...\n\nБо Анклав скаже їм, що думати."

eur_attack_brotherhood:0 "Помста за Наварро"
eur_attack_brotherhood_desc:0 "Братство допомогло знищити Платформу та захопити Наварро. Тепер настав час відповісти їм тією ж монетою."

eur_vault_city:0 "Почесні Американці"
eur_vault_city_desc:0 "Кастова система Городян зі Сховища заслуговує на повагу. Вони створили утопічне, впорядковане суспільство, де гідні процвітають. З них вийде чудовий щит для Невади."

eur_queen_reno:0 "Королева Невади"
eur_queen_reno_desc:0 "На жаль, чимало негідників із Ріно протидіяли нашому порятунку міста. Але Тіарет працювала з нами в Евріці — і, можливо, працюватиме знову. Час домовлятися?"

eur_remember_rig:0 "Призначення Платформи"
eur_remember_rig_desc:0 "Наші батьки ніколи до кінця не пояснювали, чим займався Анклав на Платформі. Очевидно — планом відбудови Америки. Та подробиць не знали. Тепер же, з архівами Братства і матеріалами Тіньових Пісків, ми розкриємо правду. Уся Пустка співатиме нам хвалу."

eur_contact_enclave:0 "Хтось Ще Залишився?"
eur_contact_enclave_desc:0 "Хоч Президент загинув на Платформі, дехто з Анклаву втік на схід. Можливо, Анклав і зараз збирає сили в Чикаго, Аппалачах, Ґуантанамо чи навіть у Столиці! Хто знає, що ми знайдемо?"

eur_our_man_in_mexico:0 "Наш Чоловік у Мексиці"
eur_our_man_in_mexico_desc:0 "[GDH.GetLeader] технічно є мутантом із Пустки. Але чи нас справді хвилює, що роблять мексиканці? Уявіть, як зручно з ним прикрити південний фланг."
eur_our_man_in_mexico_tt:0 "Якщо ви контролюєте Нижню Каліфорнію, §Y[GDS.GetName]§! отримає її як подарунок — для укріплення союзу."

eur_enclave_mega_church:0 "Свобода Віровизнання"
eur_enclave_mega_church_desc:0 "Хоча хабологи — досить дивні, вони вже роками наші союзники. Їхня віра у зірки, вимога суворої покори — усе це більше відповідає духу Анклаву, ніж вільнодумство Послідовників."
eur_enclave_mega_church_tt:0 "\n§gЯкщо ви вже інтегрували Сан-Франциско, ви отримаєте ресурси замість претензій.§!"

eur_national_guard:0 "Підтримка Регуляторів"
eur_national_guard_desc:0 "Ми не забули своїх друзів з Евріки. Регулятори допоможуть озброїти наші війська — звісно, за помірну ціну."

eur_war_for_vegas:0 "Перлина Мохаве"
eur_war_for_vegas_desc:0 "Хаус, схоже, знав про Анклав. Але чомусь не підтримав нас до Великої Війни. Тепер він дізнається, що заборгував нам кількасот років податків."

eur_the_divide:0 "Великий Розлом"
eur_the_divide_desc:0 "До Війни 11-й полк бронекавалерії захищав Гоупвілл і силоси Протибалістичної Оборони від комуністів. Варто перевірити, чи щось там ще залишилось."

eur_service_for_citizenship:0 "Служба за Громадянство"
eur_service_for_citizenship_desc:0 "Окупація всієї Нової Каліфорнії й подальші війни виснажують наші ресурси. На щастя, у нас багато 'добровольців' у новому таборі Черепаха."

eur_loot_brotherhood_stockpiles:0 "Грабіж Сховищ Братства"
eur_loot_brotherhood_stockpiles_desc:0 "Знаєте, в цьому бункері зберігалося чимало крутих штук."

eur_voting_managed:0 "Керована Демократія"
eur_voting_managed_desc:0 "Нарешті, ми можемо проводити вибори — як у старі часи, до війни!"

eur_bull_horns:0 "Проколювання Легіону"
eur_bull_horns_desc:0 "Цезар — виродок, що імітує мертву імперію, не здатну допомогти Пустці. Тож як символічно, що саме Анклав його знищить."

eur_looking_forward:0 "Йдемо Вперед, Озираючись Назад"
eur_looking_forward_desc:0 "Всупереч усьому, Граніт відродив Наварро та переміг його давніх ворогів. Час осмислити все, чого він досяг... і навідатись до місця, де все почалось."

eur_cyberg_genetics:0 "Кібер-Генетика"
eur_cyberg_genetics_desc:0 "Перед знищенням Платформи кращі уми Америки працювали над лікуванням мутацій за допомогою кібер-генетики. Бачите, це досить просто — мутантність не є вироком. Вона лікується!"

EUR_rannor_name:0 "Сержант Дорнан"
