eur_scavenging_category_desc: "Наша роль західнокрайових найманців затьмарює рибальське минуле. Гірська місцевість Еврики — поганий ґрунт для промислової бази, здатної конкурувати з Арройо чи НКР. Тому ми звертаємось до прямого методу зміцнення армії.\n\nНаші порти розташовані по всьому Західному Узбережжю — від Капітолійських пагорбів до Бахи."

eur_arroyo_category: "Війна з Арройо"
eur_arroyo_category_desc: "Жахливий напад Арройо вимагає відповіді. Вперше з часів падіння нашого порту після Великої Війни наш народ прагне крові. Шаленці присягають знищити Арройо. Наближення війни — неминуче."

