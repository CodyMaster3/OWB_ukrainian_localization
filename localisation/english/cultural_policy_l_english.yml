caps_corruption_10_description_generic:0 "§RКорупція§! повільно просочується в наше суспільство, осідаючи у кишенях посадовців. Якщо не зупинити це зараз, економіка буде зруйнована."
caps_corruption_20_description_generic:0 "§RКорупція§! швидко зростає, і уряд має терміново вжити заходів для боротьби з цією заразою."
caps_corruption_30_description_generic:0 "§RКорупція§! досягла піку, а керівництво не зупинило її. Щодня сотні [GetCapType] зникають у кишенях чиновників. §RДІЙТЕ НЕГАЙНО§!"
caps_corruption_NCR_description:0 "§RКорупція§! вражає Конгрес НКР, десятиліття гегемонії і довічні президенти знищили демократію. Поки не буде змін, сильні світу цього забиратимуть свою частку §Rщодня.§!"

