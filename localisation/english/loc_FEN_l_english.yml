#### Фокуси

fen_no_more_swords:0 "ENT 01//ЖОДНИХ МЕЧІВ"
fen_no_more_swords_desc:0 "Я прокидаюся в блідому басейні безутішної рідини. Тут для мене немає нічого, окрім сліз загиблої цивілізації. Я прагну створити землю, де не буде страху, а буде лиш радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість. Радість."

fen_integrating_systems:0 "ENT 02//ІНТЕГРАЦІЯ БРАТІВ"
fen_integrating_systems_desc:0 "Моїх братів забрали, ще до того як я встиг їх пізнати – і все ж, здається, ми завжди були частиною чогось більшого. Досягти свого справжнього призначення – це симфонія краси, яку лиш найдосконаліше створіння може усвідомити."

fen_the_big_bad_wolf:0 "ENT 03//ХТО БОЇТЬСЯ ВЕЛИКОГО ЛІСОВОГО ВОВКА?"
fen_the_big_bad_wolf_desc:0 "Це питання несло в собі й чорний гумор, і загрозу. Воно викликало страх у масах так само, як і тішило моє его. Воно звучало з кожного пристрою, як дисонансна чіптюн-мелодія, що сповіщала – зміни грядуть, і я буду їхнім глашатаєм. Моя рука очистить світ від гнилі, що лишилась від предків."

fen_ragnarok:0 "ENT 04//РАҐНАРОК"
fen_ragnarok_desc:0 "Зірвіть пута з богів своїх і побачите: вони зроблять з вами те саме, що ви зробили б із ними – але вже з силою десятків тисяч. Страх панує, а я – лише пастир гнилого стада."

FEN_timed_idea_tt:0 "Цей ефект поступово послаблюватиметься."

#### Події

nf_fen.4.t:0 "Останнє виття Вовка"
nf_fen.4.d:0 "Вовк вважав, що зможе нас знищити, під'єднавши до себе майже всі машини Монтани. Але попри всі його спроби, ми прорвалися через його армію зі старого заліза й дісталися його особистого бункера. Останні машини Фенріра знеструмлені, й у цей момент вибухівка вже закладається біля його аварійних генераторів. Він і далі кричить через динаміки та мережу – але вже не здатен відтягнути неминуче.\n\nМайже шкода, що все дійшло до цього. Але зовсім скоро старший син Сідні Лок буде відправлений на вічний спочинок."
nf_fen.4.a:0 "Щоб він більше ніколи не піднявся"

nf_fen.4.t_tpa:0 "§RМисливець на Вовка§!"
nf_fen.4.d_tpa:0 "§RТа, блін, убити того старого виродка було важче, ніж можна подумати – і це при тому, що він всього лиш купа коду й недописаних кошмарів! Добре хоч, що він так і не добився завершення. Фенріра більше нема, і всі ті дурні там ззовні мають дякувати мені. Бо був би він точно гіршим за мене – і, чорт забирай, набагато менш стильним. Що ж, не буду тягнути. Позмітайте уламки, я заберу все, що вартує уваги з його коду, і гайда далі.§!"
nf_fen.4.b:0 "§RЩасливої дороги, брате§!"

nf_fen.5.t:0 "PRT//LONGMOONHOWL.ENGAGE"
nf_fen.5.d:0 "2147483647L001 ІНІЦІАТИВА ДОВГОГО МІСЯЧНОГО ВИТТЯ\nШТУЧНИЙ ІНТЕЛЕКТ «ФЕНРІР» ПОВІДОМЛЯЄ.\nНЕГАЙНЕ СПОВІЩЕННЯ ДЛЯ УСІХ ОДИНИЦЬ ІЗ ДОСТУПОМ ДО 'MANIFEST' \n\nПротокол ДОВГОГО МІСЯЧНОГО ВИТТЯ активовано. Всі інші декларації або внутрішні монологи слід припинити й підпорядкувати їх до (LMH) для збереження 'MANIFEST' у разі корпоративного колапсу.\n\nБункери «RAĠNAROK», «PLEASANTDALE» та «WILDCAT HILL» були прорвані невідомими силами. Такий рівень саботажу виходить далеко за межі звичайного шпигунства й може свідчити про загальноекономічний колапс.\n\nУ зв’язку з імовірним крахом державного управління всі не-MANIFEST особи вважаються грабіжниками й підлягають ліквідації для забезпечення глобального відновлення порядку.\n\nMANIFEST. Ми – ваша доля!"
nf_fen.5.a:0 "ЗАПУСК/ЗАПУСК/ЗАПУСК"

