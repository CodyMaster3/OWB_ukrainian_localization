ala_pen_tt:0 "§gТобі здається, що ти вже бачив це перо. Його чорнило дивиться на тебе з очікуванням, і ти відводиш погляд.§!"
ala_caesar_tt:0 "§gЩось хапає тебе за зап’ястя. Твоя кров вимагає обережності: ти робиш вигляд, що нічого не знаєш. Ти усвідомлюєш, що Цезар був поруч увесь цей час.§! §RВін кричав місяцями.§!"
ala_mars_tt:0 "§RГуркіт грому. Небо кричить. Ти бачиш червону кімнату, і там — Цезар. Він визирає з-за оксамитової завіси. Він повертається до тебе, і його очі —§! §gЯкеcь древнє тіло задоволено хихоче...§!"
ala_ksr_tt:0 "§YКогорта Ланіуса§! навчає §YКайзера Вільгельма§! уроку пустельної війни — §Rжорстко.§!"

ala_faction:0 "Нова Імперія"
