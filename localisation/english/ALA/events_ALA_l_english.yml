l_english:
nf_lanius_april_fools.1.t:0 "Рішучі заходи"
nf_lanius_april_fools.1.d:0 "Цезар зник без сліду, і багато хто вважає його мертвим. Його місце зайняв так званий Кайзер, що несе знак Марса... або так кажуть! Але Ланіус знає правду, як і його когорта. Кайзер — брехун! Вулпес — чортів покидьок! До біса цей новий уряд, жоден із них не має права правити зі столиці у Флегстаффі!\n\nМаючи силу на сході, Ланіус та його гарнізони повстали проти деспотичної влади Кайзера, прагнучи створити справжню державу-наступника. Хоча ми й поклялися залишити \"Кайзера\" у спокої, насправді Ланіус лише збирає сили.\n\nБудьмо сповнені надії, що його провізія та армії вторгнення зі сходу підтримають це нове, крихке утворення..."
nf_lanius_april_fools.1.a:0 "Проклятий цей §R\"Кайзер!\"§!"

nf_lanius_april_fools.2.t:0 "Вірні підкріплення"
nf_lanius_april_fools.2.d:0 "Клич Ланіуса не залишився без відповіді! З усіх земель самозванця прибули вірні воїни, готові підтримати нашу справедливу справу. Вони втомилися від колишніх прихвостнів Цезаря та їхньої відданості самозванцю. Серед них є досвідчені ветерани, які привели з собою полчища легіонерів, готових боротися за правду.\n\nАле це ще не все — разом з військами приходять новини про підступні плани нового правителя Флегстаффа: плани уявного прогресу та стабільності. Ми бачимо крізь його брехню! Цей демон із іншого виміру, що ховається під людською шкірою, прагне позбавити землю праведного обійму Марса — і ми цього не дозволимо!\n\nКраще померти в бою, ніж підкоритися!"
nf_lanius_april_fools.2.a:0 "Цезаря більше немає, але його послідовники лишились."

nf_lanius_april_fools.3.t:0 "Спадок Цезаря"
nf_lanius_april_fools.3.d:0 "Цезар був мудрою людиною, дарованою нам Марсом — ученим, що революціонізував військове мистецтво та захопив Арізону. Він завойовував плем’я за плем’ям, наче це було так само легко, як дихати... і ми щодня сумуємо за ним.\n\nАле навіть без нього ми зберігаємо його знання, тактики та віру в нас — його вірних легіонерів. Його розуміння війни закарбоване в серцях і розумах наших солдатів — як ми можемо програти? Ми будемо завойовувати, завойовувати і знову завойовувати... ми вкриємо всю Пустку кров’ю і стягом Легіону Цезаря!"
nf_lanius_april_fools.3.a:0 "Він добре нас навчив, і ми маємо пам’ятати про це."

nf_lanius_april_fools.4.t:0 "Перо чи меч?"
nf_lanius_april_fools.4.d:0 "Довго Легіон боровся з реальністю нашої військової відсталості перед лицем передових технологій. Ми колись перемогли Братство у Арізоні, але втрати були великі, і деякі серед нас кричали про байдужість Цезаря до нашого болю. Їх розіп’яли. Але тепер, коли Цезаря немає, маємо спитати себе: чи правильний наш спосіб життя?\n\nЦезар мав рацію, критикуючи залежність Старого Світу від технологій, та й його роздуми щодо його падіння були влучними. Але хіба ми — не ідеальне суспільство, яке могло б озброїтися зі спадку Америки?\n\nІнші могли б використати ці скарби на зло. Ми ж — ні. Але водночас, чи не зрадимо ми спадок Цезаря, якщо кинемо його принципи?\n\nПитання, що постало перед нами, таке ж старе, як і сама історія... перо чи меч?"
nf_lanius_april_fools.4.a:0 "§RМеч!§!"
nf_lanius_april_fools.4.b:0 "§OПеро...?§!"

nf_lanius_april_fools.5.t:0 "Просто автограф"
nf_lanius_april_fools.5.d:0 "§bПеред тобою стоїть чоловік. Він розповідає про книгу, але здається, ти його десь бачив. \"Я священник Марса,\" — каже він, тіло його здригається під червоною рясою. \"Ми давно пропагуємо прийняття Пера. Час настав, то чому б не взяти його та не вписати своє ім’я в літопис історії?\"\n\nТи дивишся вниз — на книгу, яку він поклав. Вона не схожа на історичну, але ти ніколи не читав книг, то хто ти, щоб судити? У твоїй руці — Перо. Воно чуже, і водночас знайоме. Ти дивишся на чоловіка. \"Писати важко, чи не так? Знаєш, як пишеться твоє ім’я?\" Ти киваєш. Ти його знаєш з народження.\n\nВін відкриває книгу, як турботливий друг. Веде тебе до потрібної сторінки, туди, де слід написати ім’я. Твої воїни дивляться зацікавлено, з очікуванням. Вони хочуть, щоб ти щось зробив. Відтоді, як з’явився Кайзер, усе змінилось. Повітря ніби смакує інакше.\n\nКнига дивиться на тебе. Ти не схожий на Сина Марса, але вона не знає про релігію, тож яке їй діло? Вона знає лише одне: ти маєш писати. ЗАРАЗ.\n\nТи пам’ятаєш, що писати?§!"
nf_lanius_april_fools.5.a:0 "§R...§!"
nf_lanius_april_fools.5.b:0 "§R...§!"
