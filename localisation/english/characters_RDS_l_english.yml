l_english:
RDS_Daniel_name:0 "Деніель Максвелл"
RDS_Daniel_desc:0 "§4\"Що я маю зробити, щоб власники худоби не поводилися так, ніби хочуть бачити нас у кайданах?\"§!\n\nГолова профспілки, відомої як Асоціація Шахтарів Реддінґа, Максвелл робить усе можливе, щоб покращити життя працівників у Реддінґу та навколо нього. На жаль, економічна еліта Реддінґа постійно створює йому проблеми."

RDS_Redding_Council_name:0 "Рада Працівників Реддінґа"
RDS_Redding_Council_desc:0 "§4\"До біса Антона Флінна!\"§!\n\nЄдине, в чому погоджується Рада, — це те, що Брахмінові Барони винні у громадянській війні, і подібні до них більше ніколи не повинні мати майбутнього. Відтак, робиться спроба створити державу, якою керують працівники та профспілки.\n\nНіхто не має уявлення, як це має працювати."

RDS_California_Council_name:0 "Рада Працівників Каліфорнії"
RDS_California_Council_desc:0 "§4\"До біса багатіїв!\"§!\n\nЗ перемогою працівників над усією Каліфорнією, усю історію, закони, інформацію та інше зібрали разом, щоб спробувати розібратися в системі 'комунізму'. Здається, частина старого світу на цьому працювала і справи йшли не гірше за інших. Можливо, варто спробувати.\n\n§RЦе ж точно не повторення помилок, так?§!"

RDS_Lawrence_Greene_name:0 "Лоренс Ґрін"
RDS_Lawrence_Greene_desc:0 "\n\n§YІлюстрація: Лукас Вейдж§!"

RDS_Harry_OConnor_name:0 "Гаррі О'Коннор"

RDS_DeWit_name:0 "Містер ДеВіт"
RDS_DeWit_desc:0 "§4\"Я приведу вам дівчину, а тоді спокутую борг.\"§!\n\nДетектив, що базується переважно в Реддінґу, ДеВіт (без прізвища) володіє особливим набором навичок, які можуть стати в пригоді Реддінґу в ці важкі часи. Його вміння вбивати безцінне, що дозволяє не витрачати охоронців чи іншу допомогу на нього взагалі."
