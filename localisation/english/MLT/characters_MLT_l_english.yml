MLT_MLULU_NAME:0 "М'лулу"
MLT_MLULU_DESC:0 "М'лулу – се великий божок Племені мірлорків, шо жиють у болотистих закутках разом із тими клешнястими звірюками.\nГолод його не має меж у Цій Пустці – щодня требе жертву приносить, бо інакше всім лихо буде!\nКораловий Суд – се купка провидців, шо й охороняють волю М'лулу, й карають за неслух."

