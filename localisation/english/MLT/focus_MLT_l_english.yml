l_english:
FOCUS_FILTER_MLT_EGGS:0 "Гніздо М’лулу"

mlt_sanity_lost:0 "Розум Згублено"
mlt_sanity_lost_desc:0 "Убогі з Мертволісся не зраділи, як вогонь війни прийшов."
mlt_sanity_found:0 "Розум Знайдено"
mlt_sanity_found_desc:0 "Як хто вже болю хапнув – шрами зостануться. А біль? Та минає."
mlt_the_coral_court:0 "Кораловий Суд"
mlt_the_coral_court_desc:0 "Для багатьох в Пустці Плем’я Мірлорків зайшло задалеко."
mlt_seeing_to_the_queens_needs:0 "Дбати про Потреби Королеви"
mlt_seeing_to_the_queens_needs_desc:0 "Кораловий Суд завше слідкував за тим, шоб М’лулу не мала нестатків. Час знов подбати про бога Мірлорків!"
mlt_plant_for_the_next_harvest:0 "Сіяти для Наступного Врожаю"
mlt_plant_for_the_next_harvest_desc:0 "Та в Крувляндії й так жратви повно росте – але як не глядіть, то вирвем землю з корінням! За кожен зірваний мутфрукт треба десять нових посадити, шоб дикі мали чим живиться."
mlt_defend_the_river:0 "Оборона Ріки"
mlt_defend_the_river_desc:0 "Час глянуть, шо з нашими річковими укріпленнями – бо як ріку не вбережем, канібали вдеруться в володіння М’лулу!"
mlt_meeting_of_the_coral_prophets:0 "Зустріч Коралових Пророків"
mlt_meeting_of_the_coral_prophets_desc:0 "Кораловий Суд часто збирається потай. Про їхні ради ніхто толком не знає, але наслідки бувають далекі й глибокі."
mlt_new_spawning_pools_needed:0 "Треба Нових Яйцекладок"
mlt_new_spawning_pools_needed_desc:0 "Після останньої ради Кораловий Суд вирішив – треба ще яйцекладок для наступної кладки М’лулу! Але де стільки землі набратись, шоб всі яйця вмістити?!"
mlt_offer_muttfruit_for_the_cannibal_territories:0 "Запропонувать Мутфрукти за Канібальські Землі"
mlt_offer_muttfruit_for_the_cannibal_territories_desc:0 "Може, й буде нам гірко спершу, але як домовимось з володарями канібальських земель – здобудем простори для наших яєчних ставків!"
mlt_clearing_out_the_cannibals:0 "Чистка Канібалів"
mlt_clearing_out_the_cannibals_desc:0 "А й правда – яка М’лулу в тій землі, якщо там канібали шастають? Їх самих на жертву пустить можна!"
mlt_spread_the_crowsland:0 "Розширити Крувляндію"
mlt_spread_the_crowsland_desc:0 "Щойно ми нову землю приєднали, як межі старого болота почали тягнуться на північ. Та треба цьому тільки сприяти!"
mlt_weapon_stashes_on_the_beach:0 "Схрони Зброї на Узбережжі"
mlt_weapon_stashes_on_the_beach_desc:0 "Як раптом прийдуть вороги, треба, шоб наші панцирники мали чим воювать. Закопаєм мушлеві ножі під пісок!"
mlt_offer_muttfruit_for_ribbreaker_coast:0 "Мутфрукти за Узбережжя Ламків"
mlt_offer_muttfruit_for_ribbreaker_coast_desc:0 "Та узбережжя, шо ми вже маєм – файне. Але якби ще більше? Якщо на схід проб’ємось і обміняєм щось за землю попід рікою Вілламетт – виграш буде нам!"
mlt_leaving_the_swamp:0 "Покинувши Болото"
mlt_leaving_the_swamp_desc:0 "Як наші землі далі й далі простягаються, дехто з племені вже й сам покидає болото. Йдуть і селяться серед руїн у далеких краях."
mlt_defending_the_new_coastline:0 "Оборона Нового Узбережжя"
mlt_defending_the_new_coastline_desc:0 "Тепер уже простих застав не стане. Щоб втримать землю, треба більше зброї нашим панцирникам кувати!"
mlt_connecting_the_spawning_pools:0 "З’єднати Яйцекладки"
mlt_connecting_the_spawning_pools_desc:0 "Маємо добрячий шмат землі, де М’лулу яйця кладе... Та все то розкидане. Чистка старих доріг добру справу зробить – і М’лулу швидше подорожувать зможе."
mlt_roads_from_the_swamp:0 "Дороги Болота"
mlt_roads_from_the_swamp_desc:0 "Дороги Болота в’яжуть Крувляндію з іншими землями племені. Там панцирники вправляються в бою, Коралові віщуни балакають до молодняка, а часом і сама Королева мандрує."
mlt_dig_barrows_for_spawning_pools:0 "Рити Кургани для Яйцекладок"
mlt_dig_barrows_for_spawning_pools_desc:0 "Навіщо нам мінять фрукти на чужу землю?! Ті мутфрукти – наші! Ліпше вниз копать, робить цінність з того, шо вже маєм, а не торгуватись, як дурні."
mlt_striking_iron:0 "Знайдено Залізо"
mlt_striking_iron_desc:0 "Поки рили наші курганники, натрапили на жилу заліза! Знадобиться, шоб кувать цвяхи для броні й знарядь!"
mlt_arena_in_the_tunnels:0 "Арени в Підземеллі"
mlt_arena_in_the_tunnels_desc:0 "Копачі, як не копають – б’ються. Влаштовують собі бійки в ямах. Коралові ковалi туди вже повлазили – грошей зароблять."
mlt_blind_eyed_workers:0 "Сліпоглядні Копачі"
mlt_blind_eyed_workers_desc:0 "\"Сліпоглядні Копачі\" – то ланцюгові злочинці, шо ми загнали в копання курганів. Більшість – це впіймані канібали. Дехто з них сонця вже не бачив стілько, шо й очі їм згасли!"
mlt_deeper_into_the_earth:0 "Глибше в Землю"
mlt_deeper_into_the_earth_desc:0 "Коли копачі далі проривають тунелі, ми знаходимо нові скарби – і нові біди, шо треба буде вирішить!"
mlt_striking_gold:0 "Знайдено Золото"
mlt_striking_gold_desc:0 "Золото! Гарне, блискуче золото! Треба зробить оздоби для М’лулу і Коралового Суду!"
mlt_defend_the_spawnlings:0 "Оборонити Новонароджених"
mlt_defend_the_spawnlings_desc:0 "Тепер тунелі широкі, і М’лулу вже сама може туди влізти, яйця класти. Треба їх стережи, шоб ніхто зле не вчинив малим!"
mlt_deep_earth_breathing_equipment:0 "Дихалки для Глибин"
mlt_deep_earth_breathing_equipment_desc:0 "В старому шахтарському містечку ми знайшли дихальні скафандри. Як розберем їх – наші копачі зможуть копать глибше, ніж легені дозволяють!"
mlt_the_great_tunnels_of_mlulu:0 "Великі Тунелі М’лулу"
mlt_the_great_tunnels_of_mlulu_desc:0 "Великі Тунелі М’лулу – то здоровенний курган-підземелля, шо ми викопали під Крувляндією. Кургани тягнуться милями – більшість там швидко губиться в темряві лабіринтів."
ritual_of_black_hollows_night:0 "Обряд Ночі Чорних Порожнин"
ritual_of_black_hollows_night_desc:0 "Нарешті – час вилуплення! Нове покоління Мірлорків з’являється на світ. Таке буває раз на кілька десятиліть. Ми мусимо буть готові!"
mlt_protect_the_southern_crossing:0 "Зцілення Силою"
mlt_protect_the_southern_crossing_desc:0 "[DIS.GetAdjective] з Рудого Чоловіка знов з нами. Були двоє – стали одне."
mlt_expanding_mlulus_domain:0 "Н'Гаста! Квата! Квакіс!"
mlt_expanding_mlulus_domain_desc:0 "Нарешті, воля М’лулу стала ясна!\nКораловий Суд прорік: М’лулу, в подяку за нашу службу, хоче розширить племінні землі! Вперед – здобувать для неї нові терени!"
mlt_cascadian_current:0 "Каскадська Течія"
mlt_cascadian_current_desc:0 "З-під льоду королівство піднімається."
mlt_sea_of_cortez:0 "Море Кортеса"
mlt_sea_of_cortez_desc:0 "На південь – там, де кличе наша володарка."
mlt_tropic_of_cancer:0 "Тропік Рака"
mlt_tropic_of_cancer_desc:0 "Тисячу літ, М’лулу пануватиме."
mlt_kingdom_of_mlyeh:0 "Королівство М’льє"
mlt_kingdom_of_mlyeh_desc:0 "\"Вони поклонялися, так казали, Великим Старим, що жили ще до людей і прийшли з неба на молодий світ. Ті Старі нині мертві, під землею й морем; та їхні тіла вві снах відкрили свої таємниці першим людям, що заснували культ, який ніколи не згасав. Це той культ – в’язні казали, шо він завжди був і буде, захований у далеких пустках і темряві світу, аж доки §YM’лулу§! не підніметься зі свого темного дому в місті §RM’льє§!, шо під водами, і знов не поверне світ під свою владу.\""

#Tooltips
mlt_if_they_accept:0 "§gЯкщо вони приймуть§!\n"
mlt_mlulu_eggs_tt:0 "§YM’лулу§! відкладає §Y1250§! яєць"
mlt_8000_eggs_tt:0 "§YM’лулу§! має кладку щонайменше з §Y8000§! яєць"
mlt_eggs_hatch:0 "§gПо всьому королівстві М’лулу її велика кладка вилуплюється. Тисячі малих Мірлорків заливають болота й загарбують землю. Вставайте! Вставайте!§!\nКожне яйце в §Yкладці М’лулу§! §Yвилуплюється§!! За кожне яйце – §G1§! людська сила.\n\n"
mlt_pacific_ocean_cores_tt:0 "\nВідтепер ми можемо безкоштовно націоналізувати території, шо мають вихід до §YТихого океану§!."
mlt_cascadian_current_tt:0 "Отримати претензії на кожен прибережний штат у §YЗахідному Орегоні§!, §YЗахідному Вашингтоні§!, §YПівденній Колумбії§!, §YПівнічно-західній Колумбії§!, §YОстрові Ванкувер§! та §YОстрові Ґрехем§!."
mlt_sea_of_cortez_tt:0 "Отримати претензії на кожен прибережний штат у §YПівнічно-західній Каліфорнії§!, §YПівденно-західній Каліфорнії§!, §YПівденній Каліфорнії§!, §YБаха-Каліфорнії§! та §YСхідній Сонора§!."
mlt_tropic_of_cancer_tt:0 "Отримати претензії на кожен тихоокеанський прибережний штат у §YМексиці§!."

#Decisions
mlt_mlulu_lands_dec:0 "§4Володарювання М’льє§!"
mlt_claw_land:0 "§4Земля Кігтя§!"