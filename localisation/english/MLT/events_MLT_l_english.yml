l_english:
nf_mlt.1.t:0 "Сотворіння Погані"
nf_mlt.1.d:0 "Убогі з Мертволісся не зраділи, як вогонь війни прийшов.\nКоли новий світ із попелу старого зліпили, нічого не лишилось тим, хто вижив. Ні стежки, ні цілі – бо полум’я спалило не тілько хати, а й саму душу їхню.\n\n\"Як жить у такому світі?\" – спитав був вояка.\nТа правда в йому була – людині, як вона є, тут не місце. Швидко зневіра зжерла убогих. Фрукти, шо жрали, нібито годували, та мозги їм вимивали, поки тіла не гнили від радіяції.\nТрeба було нового способу, щоб вижить. А поки? Та виживать, як уміють.\nЯкі ж то фрукти той Рудий чоловік вибрав?"
nf_mlt.1.a:0 "Криваво-червоні фрукти"
nf_mlt.1.b:0 "Тихі зелені фрукти"
nf_mlt.1.c:0 "Скільки в руки влізе"

nf_mlt.2.t:0 "Четверта Дорога Мертвих"
nf_mlt.2.d:0 "Як хто вже болю хапнув – шрами зостануться. А біль? Та минає.\nУбогих у перші літа водив Рудий чоловік – добра душа, шо хотів назад на стежку вивести тих, кого зілля й яд в мозгах попсував.\nРудий вчив забуть минуле, вглядать уперед, а не назад. Вони почали глядати за тварюками з Крувляндії, а найперше – за Мірлорками.\nМірлорки, не як люди, були до цього світу створені – і вижили. Довго після того, як Рудий пішов, убогі далі дивились на диких і наслідували: малих в болото макали, а їли тільки ті ж світячі мутфрукти, шо й Мірлорки. І з часом – Мірлорки перестали їх за ворогів вважать. Стали всі одним народом.\nА скільки ж років пройшло, поки й самі убогі себе за Мірлорків не визнали? За Плем’я Мірлорків?"
nf_mlt.2.a:0 "Одне покоління"
nf_mlt.2.b:0 "Два покоління"
nf_mlt.2.c:0 "Три покоління"

nf_mlt.3.t:0 "Спадок Рудого Чоловіка"
nf_mlt.3.d:0 "Для багатьох в Пустці Плем’я Мірлорків зайшло задалеко.\nВони вже не люди, а Мірлорки в людській шкурі – броню носять із панцирів старих, слимаками мажуться й яйця стережуть, як святість.\n\nТа останніми роками все змінилось. Якісь мудрагелі й віщуни, шо звуть себе «Кораловий Суд», взяли владу над Плем’ям, шоб, мовляв, «на путь наставить».\nТі віщуни кажуть, шо Рудий Чоловік – то не чоловік, а стара Королева Мірлорків була! Тепер М’лулу, велика Королева, яку той Суд оберігає, стали за божество вважати – мовляв, вона з роду Рудого й спадкоємиця узбережжя Орегону.\nСеред плем’я важко вже й сказать, чи то Суд через М’лулу плем’ям править, чи навпаки – М’лулу керує всіма, як підручними, аби панство її розширить.\nЩо ж ти думаєш, як воно є?"
nf_mlt.3.a:0 "Ніхто над М’лулу не стоїть"
nf_mlt.3.b:0 "Кораловий Суд служить М’лулу, а плем’я – Суду"

nf_mlt.4.t:0 "Мутфрукти за землю?"
nf_mlt.4.d:0 "Плем’я Мірлорків дивну пропозицію сьогодні принесло. Один з їх панцирних посланців каже, шоб ми віддали їм трохи нашої землі в обмін на врожай мутфруктів. Та й земля, що вони хочуть – не така вже й цінна. Може, варто й погодитись?"
nf_mlt.4.a:0 "Обміняємо землю на той фрукт!"
nf_mlt.4.b:0 "Нє, земля нам миліша."

nf_mlt.5.t:0 "Нам відмовили в обміні!"
nf_mlt.5.d:0 "Виходить, їм та їхня земля дорожча за наші мутфрукти!"
nf_mlt.5.a:0 "А от і добре!"

nf_mlt.6.t:0 "Обмін прийнято!"
nf_mlt.6.d:0 "Ми відправили мутфрукти до їхньої столиці, а вони нам віддали ту землю, шо просили."
nf_mlt.6.a:0 "Отак-то!"

nf_mlt.7.t:0 "Обряд Ночі Чорних Порожнин"
nf_mlt.7.d:0 "Нарешті! Час вилуплення настав! Лише раз на кілька десятків років плем’я Мірлорків може бачити народження нового покоління отак. Усе Плем’я збирається докупи, працює як скажене – шоб зміцнить плем’я та підготувать місце для нових Мірлорків, шо розповзуться по землі."
nf_mlt.7.a:0 "За М’лулу!"

#Tooltips
mire_the_new_coral_court:0 "Відновлений Кораловий Суд"
mire_the_new_coral_court_desc:0 "Апостоли Рудого Чоловіка згодились прийняти причастя та знов приєднатися до Коралового Суду. Їм дали волю зберігати свою віру в межах племені без обвинувачень у єресі та дозволили шанувати Рудого Чоловіка."
