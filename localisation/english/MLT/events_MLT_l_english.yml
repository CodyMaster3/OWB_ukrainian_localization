mlt_insatiable_hunger:0 "Ненаситна Голоднеча"
mlt_monster_from_the_depths:0 "Потвора з Глибин"
mlulu_desc:0 "М’лулу – великий бог Племені Мірлорків, племені пустельників, що шанує та живе поруч із Мірлорками у своїх болотах.\nГолод М’лулу в Пустці не має рівних – щодня йому треба одне жертвоприношення!\nКораловий Суд – гурт віщунів, шо служить як охоронцями, так і втілювачами волі М’лулу."