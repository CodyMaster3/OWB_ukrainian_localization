LAP_RUNNING_BEAR_NAME:0 "Швидкий Ведмідь"
LAP_RUNNING_BEAR_DESC:0 "Швидкий Ведмідь отримав своє ім’я ще хлопчиком, коли його голос лунав у нічній темряві — різке попередження, що прорізало вітер, наче лезо. Казали, що сама земля зупинялася, щоб його почути. Тепер його голос несе вагу пророцтва — хрипкий від десятиліть непокори, але не зломлений. Він пережив договори, набіги та срібноязиких чоловіків, які обіцяли мир, тримаючи за спиною кайдани. Їхні слова падають, як каміння, об його рішучість — зношену, але непохитну, витесану роками втрат і кровопролиття.\n\nТанець Примар став кістковим мозком духу Біжучого Ведмедя. Він вірить — із тихим завзяттям відчаю і віри — що земля пам’ятає старі шляхи. Вони танцюватимуть світ до його відродження — струсять шахти, паркани, сморід фабрик. Він чітко бачить це у своїй уяві: земля відкочується назад, поглинаючи шрами минулого, пагорби знову здіймаються з гордістю. Кожен тупіт, кожна пісня наближає їх. Чорні Пагорби кличуть його у снах, їхні шепоти вплетені в гул танцю. Навіть якщо він не доживе до того дня, Швидкий Ведмідь буде вести свій народ уперед, їхні стопи проти землі — поки світ не почне тремтіти."