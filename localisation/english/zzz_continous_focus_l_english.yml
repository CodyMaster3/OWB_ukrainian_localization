l_english:
  ## Menu Text
  CONTINUOUS_FOCUS_TREE_HEADER:0 "§eБезперервні фокуси§!"
  CONTINUOUS_FOCUS_TREE_DESC:0 "§eВони залишаються активними, доки ви знову не зміните фокус.§!"
  CONTINUOUS_FOCUS_LOCKED_DESC:0 "§GРозблокуйте ще $LEFT|H$ фокусів§!"
  CONTINUOUS_FOCUS_UNLOCKED_DESC:0 "§GБезперервні фокуси розблоковано§!"
  ## Focuses
  OWB_continuous_vehicle_production:0 "§eВиробництво транспорту§!"
  OWB_continuous_vehicle_production_desc:0 "До Великої війни в Старому Світі транспорт був повсюди. Він міг доставити людину з одного кінця континенту на інший за лічені дні. Створення власних транспортних засобів значно збільшить швидкість наших військ."
  OWB_continuous_air_production:0 "§eВиробництво авіації"
  OWB_continuous_air_production_desc:0 "У Пустці будь-яка авіація є великою рідкістю. Виробництво власних літаків допоможе нам знищувати ворогів з повітря."
  OWB_continuous_PA_production:0 "§eВиробництво спецспорядження§!"
  OWB_continuous_PA_production_desc:0 "Для наших солдатів будь-яке спеціальне спорядження — це диво на полі бою; воно може кардинально змінити результат битви та допомогти зберегти життя своєму власнику."
  OWB_continuous_gun_production:0 "§eВиробництво спорядження§!"
  OWB_continuous_gun_production_desc:0 "§eСолдату потрібне хоч якесь піхотне спорядження, щоб мати можливість битися. Перенаправлення більшої кількості ресурсів на його виробництво дозволить нам екіпірувати більше солдатів."
  OWB_continuous_trading:0 "§eРозширення караванних компаній§!"
  OWB_continuous_trading_desc:0 "Каравани — це джерело життя наших поселень. Часто вони є єдиним способом для людей отримати необхідне спорядження для продовження свого існування. Ми можемо збільшити наші інвестиції та посилити захист караванів нашої нації, щоб гарантувати ці необхідні торгові шляхи."
  OWB_continuous_population:0 "§eІнвестиції в сільське господарство§!"
  OWB_continuous_population_desc:0 "Наше населення, що стрімко зростає, відчайдушно потребує їжі. Хоча вирощувати їжу в Пустці важко, забезпечення наших фермерів необхідними ресурсами допоможе нам прогодувати наших людей."
  OWB_continuous_research:0 "§eНаукові зусилля§!"
  OWB_continuous_research_desc:0 "Незважаючи на масове вимирання через Велику війну, 200 років потому вчені все ще існують. Ми надамо їм більше ресурсів, щоб вони могли повернути технології Старого Світу."
  OWB_continuous_suppression:0 "§eЗнищення порушників спокою§!"
  OWB_continuous_suppression_desc:0 "На наших нещодавно анексованих територіях все ще панує хаос. За допомогою збільшення кількості солдатів ми швидко розправимося з усіма, хто опирається своїй законній інтеграції."
  OWB_continuous_Enclave_production:0 "§eАмериканська технологічна перевага§!"
  OWB_continuous_Enclave_production_desc:0 "Америку у Великій війні знищила не її приголомшлива індустріальна міць. Навіть зараз, через 200 років, результати її праці приносять нам користь. Машини, розроблені 200 років тому, і сьогодні залишаються рушійною силою Пустки."
  OWB_continuous_restrict_freedom:0 "§eОбмеження свободи§!"
  OWB_continuous_restrict_freedom_desc:0 "Цивілізація розвиватиметься, навіть якщо люди на новій сусідній території боротимуться проти цього. Відправка додаткових підкріплень для придушення їхнього опору допоможе нам рухатися вперед."
  OWB_continuous_boost_freedom:0 "§eПідрив авторитету сюзерена§!"
  OWB_continuous_boost_freedom_desc:0 "Хоча зараз ми перебуваємо під контролем іншої держави, ми можемо тихо витіснити її з нашої нації. Кілька переміщених чиновників, кілька підкуплених політиків та організований внутрішній рух допоможуть нам скинути їхнє ярмо за кілька років."
  OWB_continuous_repair:0 "§eВідновлення пошкоджень§!"
  OWB_continuous_repair_desc:0 "Останні події зруйнували важливу інфраструктуру нашої нації. Ми можемо зосередитися на ремонтних роботах, щоб прискорити цей процес."
  OWB_continuous_reduce_training_time:0 "§eНавчання солдатів§!"
  OWB_continuous_reduce_training_time_desc:0 "Ми можемо зосередити наші зусилля на тому, щоб прискорити навчання більшої кількості солдатів."
  OWB_continuous_non_factory_construct:0 "§eІнженерне будівництво§!"
  OWB_continuous_non_factory_construct_desc:0 "Збройові майстерні — це ще не все, що потрібно нації для виживання. Базова інфраструктура є важливою для життя наших громадян."
  OWB_continuous_naval_production:0 "§eВійськово-морське виробництво§!"
  OWB_continuous_naval_production_desc:0 "Ми можемо зосередитися на розширенні наших зародкових верфей. Це дозволить нам будувати човни для забезпечення безпеки нашого узбережжя."
  OWB_continuous_Raider_production:0 "§eСаморобна зброя§!"
  OWB_continuous_Raider_production_desc:0 "Ми можемо зосередитися на швидкому створенні нової зброї для майбутньої битви. Хоча вона й не такої якості, як та, що створюється поселенцями, які індустріалізуються, ми все ж можемо виготовляти її у великих кількостях."
  OWB_continuous_Vault:0 "§eНавички Сховища§!"
  OWB_continuous_Vault_desc:0 "Наше Сховище змогло передавати знання протягом 200 років. Зосередження уваги на тому, щоб наші кваліфіковані жителі Сховища працювали, дозволить нам швидко його вдосконалити."
  OWB_continuous_Settler:0 "§eІндустріалізація§!"
  OWB_continuous_Settler_desc:0 "Пустка не може залишатися безплідним місцем, де кожному доводиться покладатися на збирання брухту в 200-річних руїнах. Ми зосередимося на будівництві нових заводів, щоб самостійно створювати товари минулого."
  OWB_continuous_mutant:0 "§eСили мутантів§!"
  OWB_continuous_mutant_desc:0 "По всій Пустці істоти пристосувалися до середовища ядерної пустки. Ті, кого самопроголошені «нормальні» жителі Пустки називають «мутантами», є найсильнішими істотами у світі. До них належать як розумні супермутанти та гулі, так і менш розумні болотники, радтаргани, коні, кротощури та інші істоти."
  OWB_continuous_robot:0 "§eВійська роботів§!"
  OWB_continuous_robot_desc:0 "Роботи — це невблаганні воїни в пустці. Їхнє переслідування ніколи не закінчується, і їх можна легко виготовляти у величезних кількостях. Усього цього не скажеш про людей."