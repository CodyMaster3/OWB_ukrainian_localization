#THANK YOU TO SCORN AND ORWICH FOR SAVING MY ASS WITH THIS, ADDITIONAL THANKS TO SKELLIE, SOUP, ZUSK, AND STRAWWOMAN FOR THE ADDITIONAL HELP
  SDC_Showdown_City_name:0 "Шоудаун-Сіті"
  SDC_Showdown_City_desc:0 "§RЦе остаточна розбірка остаточної долі.§!\n§W--------------§!\nМісто Розбірок, колись відоме як Сан-Франциско, доки всі ці люди не прийшли сюди й не почали битися! Місто лежить у руїнах, їхня кров заливає вулиці, а людям залишається покладатися лише на себе! Чи можемо ми хоч щось зробити..."

  SDC_Lo_Pan_Showdown_desc:0 "§RЯ єдиний на твоєму A.M., A.M. радіо!§!\n§W--------------§!\nЛо Пан є, або колись був лідером Ши від часу прибуття Обраного у 2241 році. Однак з огляду на останні події Ши більше не існує як нація. Сан-Франциско та навколишні міста лежать у руїнах, і саме він має спробувати це виправити."
  SDC_Mister_Rogers_name:0 "Фред Роджерс"
  SDC_Mister_Rogers_desc:0 "§CУ загальній схемі речей сяючі миті такі ж короткі, як мить ока, але саме з таких миттєвостей складається вічність — моментів, коли ми, люди, можемо сказати «Я люблю тебе», «Я пишаюся тобою», «Я прощаю тебе», «Я вдячний за тебе». З цього і складається вічність; з невидимих, нетлінних добрих речей.§!"

  SDC_Chuck_Hayes_name:0 "Чак С. Гейз"
  SDC_Chuck_Hayes_desc:0 "Кажуть, що Чак С. Гейз може все, одного разу він подивився на Цезаря, і від цього в того з'явилася пухлина мозку, про яку він ще навіть не здогадується. Легенди стверджують, що він настільки пильно подивився на Армійський склад Сьєрра, що створив усередині угруповання Анклаву; його сила не має рівних. £GFX_liberia_texticon"
  # General Characters
  SDC_Batman:0 "Бетмен і Робін"
  SDC_Batman_desc:0 "Це дует борців зі злочинністю! Підозрюють, що вони мають чудові стосунки зі Скраффом Макграффом."
  SDC_Felix_Kimball:0 "Фелікс Кімбол"
  SDC_Felix_Kimball_desc:0 "Президенте Кімбол, це ви? \n\n§RЗвук Кришок і Податків нависає над вами.§!"
  SDC_Star_Wars:0 "Акторський склад «Зоряних війн»"
  SDC_Star_Wars_desc:0 "Не дозволяйте цим джавам розібрати ваших дроїдів на частини! На їхню збірку піде мільйон років з усім цим піском..."
  SDC_Jackie_Chan:0 "Джекі Чан"
  SDC_Jackie_Chan_desc:0 "Відомий майстер бойових мистецтв з іншого світу! Його навички та знання були б неоціненними для нас, якби він не був такий зайнятий, дошкуляючи Шаку."
  SDC_Santa_Claus:0 "Санта-Клаус"
  SDC_Santa_Claus_desc:0 "Як казав один мудрий бос: «Послухай мене! Кожного грудня вони відкривають гарячу лінію... ...Він справжній, кажу тобі! Він... раніше приносив мені подарунки і...». \n\nМожливо, цього року він принесе нам щось приємне, наприклад, смерть наших ворогів."
  # Ultimate Attack Characters
  SDC_Gandalf:0 "Маги-близнюки"
  SDC_Gandalf_desc:0 "Це Ґендальф Сірий та Ґендальф Білий!"
  SDC_Black_Knight:0 "Чорний Лицар"
  SDC_Black_Knight_desc:0 "Це лише справедлива ринкова вартість! \n\n§g«Я чув, що цей хлопець з якоїсь довоєнної комедії, ця битва така безглузда.§!» - Ло Пан"
  SDC_Benito_Mussolini:0 "Беніто Муссоліні"
  SDC_Benito_Mussolini_desc:0 "Від фашистського диктатора Італії до прикраси на автозаправці наприкінці Другої світової війни, а тепер він повернувся з якоїсь причини?"
  SDC_Jambi:0 "Джин Джамбі"
  SDC_Jambi_desc:0 "Справжній джин? Ого! Джамбі каже, що ми можемо загадувати бажання щодня, напевно, це не призведе ні до чого поганого, чи не так..."
  SDC_Darth_Vader:0 "Дарт Вейдер"
  SDC_Darth_Vader_desc:0 "Схоже, могутність «Сили» привела цього чоловіка з його геноцидними нахилами на поле бою. \n\nЯк на мене, ці розмови про «Силу» — просто якась хіпі-космічна маячня. Але не кажіть йому, що я це сказав!"
  SDC_Superman:0 "Супермен"
  SDC_Superman_desc:0 "Так званий «Людина зі сталі», він каже, що прибув з відкритого космосу, і з огляду на те, що він заморозив наші стволи одним своїм подихом під час зустрічі з ним, у це легко повірити."
  SDC_Octopus:0 "Доктор Восьминіг"
  SDC_Octopus_desc:0 "Геніальний вчений з іншого виміру, він якимось чином вживив щупальця собі в спину. Хоча він уміє лазити, він виглядає як помилка природи, не дивно, що він злий."
  SDC_Rock:0 "Скеля"
  SDC_Rock_desc:0 "Я не розумію, як камінь, який ми підняли з підлоги, допоможе нам, але чомусь він робить наші дивізії кращими?"
  SDC_Bruce_Wayne:0 "Брюс Вейн"
  SDC_Bruce_Wayne_desc:0 "Довоєнний мільярдер, за його словами, родом з міста під назвою «Готем». Просто не питайте, чому в нього є звичка зникати на тривалий час."
  # Focus
  SDC_what_the_hell:0 "Сан-Франциско в руїнах"
  SDC_what_the_hell_desc:0 "Сан-Франциско захопило безліч різноманітних істот, будівлі та заводи зруйновані внаслідок боїв у місті. \n\nРятувати його вже занадто пізно... чи ні."
  # Video Route
  SDC_canon_route:0 "Остаточна Розбірка"
  SDC_canon_route_desc:0 "Хороші хлопці, погані хлопці та вибухи, куди не кинь оком."
  SDC_ultimate_route_1:0 "Бляшанка Шак-Фу"
  SDC_ultimate_route_1_desc:0 "Дідько б тебе вхопив, Ароне Картер! Тепер нас переїхали!"
  SDC_ultimate_route_2:0 "Новий Погляд Турботливих Ведмедиків"
  SDC_ultimate_route_2_desc:0 "Ось і зомбі та робот, не те щоб вони були хоч якось важливі."
  SDC_ultimate_route_3:0 "Сходження Чака"
  SDC_ultimate_route_3_desc:0 "Ангели заспівали свій непорочний хор. Кінець близький для всіх нас."
  SDC_ultimate_route_4:0 "А потім Ґендальф Сірий"
  SDC_ultimate_route_4_desc:0 "Той, хто пожертвував собою, щоб захистити тих, хто був йому небайдужий."
  SDC_ultimate_route_end:0 "Чемпіон вистояв..."
  SDC_ultimate_route_end_desc:0 "...решта побачили свого переможця. Містер Роджерс у закривавленому светрі."
  # Lo-Pan Route
  SDC_lopan_route:0 "Кнопковий телефон"
  SDC_lopan_route_desc:0 "Можливо, я був не найкращим правителем для свого народу, але це не означає, що я не можу використати свої лідерські навички, щоб спробувати врятувати ситуацію. \n\nПодивимося, чи принесе дипломатія якийсь результат замість безглуздих смертей."
  SDC_lopan_route_1:0 "Шак-пломатія"
  SDC_lopan_route_1_desc:0 "Замість того, щоб відкривати «бляшанку Шак-Фу», давайте використаємо стару добру «Шак-пломатію»."
  SDC_lopan_route_2:0 "Шматок від Чака"
  SDC_lopan_route_2_desc:0 "Щоб зібрати решту наших воїнів, знадобиться певний час, а тим часом ми постійно знаходимо цього собаку в місті. Здається, він швидко розмножується, і може стати в пригоді в бою!"
  SDC_lopan_route_3:0 "Сходи до небес"
  SDC_lopan_route_3_desc:0 "Якщо Чак Гейз хоче вбити кожного з нас, чому б не піднятися Сходами до небес і не зустрітися з ним на його власній території."
  SDC_lopan_route_4:0 "І Ґендальф Білий"
  SDC_lopan_route_4_desc:0 "Той, хто повернувся, щоб врятувати їх усіх."
  SDC_lopan_route_5:0 "...Решта побачили свого переможця"
  SDC_lopan_route_5_desc:0 "Ми перемогли, ми справді перемогли." 
  SDC_lopan_route_6:0 "Восьме чудо"
  SDC_lopan_route_6_desc:0 "§RЯ знаю, що воно може бути маленьким, але це місто — Восьме чудо.§"
  SDC_lopan_route_7:0 "Людина з Півночі"
  SDC_lopan_route_7_desc:0 "Передачу, яку ми отримали, надіслав хтось на ім'я Ґоддард з Експедиції Беггерів. Здавалося, він говорив про місце під назвою Колорадо, і про те, як його експедиції «не вдалося забезпечити купол». Щоправда, ми гадки не маємо, що це означає, але його присутність бажана. \n\nВін має прибути приблизно за 2 місяці після нашої відповіді."
  # Events
  nf_sdc.0.t:0 "Якого біса."
  nf_sdc.0.d:0 "Один з палацових охоронців увірвався до мого кабінету під час зустрічі з дипломатами НКР у стані паніки, відчайдушно намагаючись віддихатися. Єдине, що він зміг вимовити перед тим, як знепритомніти, було: «Палацу більше немає!» \n\nТе, що відбувалося далі, можна описати лише двома словами. Абсолютний хаос. Вибухи, масові смерті та Кайдзю?? Я нічого не міг вдіяти, наших військ просто зім'яли, і в мене не було іншого вибору, окрім як тікати з міста."
  nf_sdc.0.a:0 "Хороші хлопці, погані хлопці та вибухи!"
  nf_sdc.0.b:0 "Ні, сьогодні я з цим лайном розбиратися не буду, ми можемо просто це приховати."

  nf_sdc.1.t:0 "Велике Питання"
  nf_sdc.1.d:0 "Ло Пан стояв на роздоріжжі: його місто, історія і, найголовніше, його люди та їхні життя були під загрозою. Кожна секунда роздумів була ще однією секундою, за яку він міг втратити все. \n\nЗіткнувшись із найважчим рішенням у своєму житті, він мав обрати зараз, що відбудеться далі."
  nf_sdc.1.a:0 "Хай іде своєю чергою, це явно проблема за межами цього всесвіту."
  nf_sdc.1.b:0 "§RЯ поверну своє Місто, навіть якщо помру в процесі.§!"
  
  nf_sdc.2.t:0 "Знищення Сан-Франциско, Частина 1"
  nf_sdc.2.d:0 "Після втечі від руйнувань на тлі цього вселенського хаосу, і оскільки не залишилося нікого, хто міг би зупинити або скоріше об'єднати цих загарбників, битва нарешті могла розпочатися. \n\nЗ напівзруйнованих будівель Сан-Франциско та околиць долинала мелодія зі словами оповідача, що лунали вулицями."
  nf_sdc.2.a:0 "Це може означати лише одне, і це не до добра..."
  
  nf_sdc.3.t:0 "Знищення Сан-Франциско, Частина 2"
  nf_sdc.3.d:0 "§GҐодзі-§! Я маю на увазі, що Кайдзю почав стрибати по §RСан-Франциско§! як по великому ігровому майданчику. Раптом з кущів вискочив Бетмен і вдарив Кайдзю гранатою з бляшанки. Кайдзю розлютився і пішов у наступ, але не очікував, що його заблокує Шак. Який потім відкрив флакон з §GШак-ВРЕ§!, коли Арон Картер вибрався з-під завалів і почав лупцювати Шакіла О'Ніла. \n\nПотім їх обох розчавив Самотній Мандрівник (на машині), але не встиг Бетмен повернутися до §RСталевого Палацу§!, як з вулиці вискочив Авраам Лінкольн, дістав §Rкитайський Тип 93§! з-під свого капелюха і зніс Бетмена чергою тра-та-та-та. Але в нього закінчилися патрони і він утік, тому що §RОптімус§! §BПрайм§! прийшов, щоб врятувати ситуацію."
  nf_sdc.3.a:0 "Ми ще навіть не на другому приспіві?!"
  
  nf_sdc.4.t:0 "Знищення Сан-Франциско, Частина 3"
  nf_sdc.4.d:0 "Кайдзю відкусив шматок від Оптімуса Прайма, як Скрафф Макграфф відкусив шматок від Ши. Тоді Шак повернувся, вкритий слідами від шин (після того, як облив Арона §GШак-ВРЕ§!), але Джекі Чан вистрибнув і приземлився Шакові на спину. \n\nКоли Авраам Лінкольн повернувся з Мачете-гладіусом, раптом щось схопило його за ногу і він впав (у затоку). Індіана Джонс вирубав його своїм батогом, а потім побачив, що Кайдзю підкрадається ззаду, і потягнувся за своїм самопалом, якого ніяк не міг знайти. \n\nБо Бетмен вкрав його, вистрілив і промахнувся, а Джекі Чан відбив кулю кулаком. Потім він підстрибнув у повітря і зробив сальто, тоді як Чесний Ейб спробував залізти на §RОптімуса§! §BПрайма§!, але вони зіткнулися в повітрі. Після чого їх обох вразив Новий Погляд Турботливих Ведмедиків."
  nf_sdc.4.a:0 "Коли ми вже дійдемо до моменту з Чаком С. Гейзом?!"
  
  nf_sdc.5.t:0 "Знищення Сан-Франциско, Частина 4"
  nf_sdc.5.d:0 "Рейнджери НКР заспівали непорочний хор, і з Шейді Сендс зійшов Чак Гейз, який доправив Ціль Війни, що здатна розтрощити кістки, прямо в пах Індіані Джонсу. \n\nЯкий впав на землю, корчачись від болю, поки Бетмен знову перетворився на Брюса Вейна. Але Чак розкусив його хитре маскування і розчавив голову Бетмена між своїми стегнами. \n\n(Наступний фокус автоматично оголосить війну НКР, а попередня подія надала вам необхідне спорядження, щоб ваші війська були в повній боєготовності; переконайтеся, що ваші війська стоять на обох кордонах, Території Наварро БУДУТЬ залучені до війни!)"
  nf_sdc.5.a:0 "Ось тут і починаються веселощі."
  
  nf_sdc.6.t:0 "Остаточна Розбірка"
  nf_sdc.6.d:0 "Тоді Ґендальф Сірий та Ґендальф Білий, і Чорний Лицар з «Монті Пайтона і Священного Грааля». І Беніто Муссоліні, і Синій Злюка. І Ковбой Кертіс, і Джин Джамбі. \n\nРобокоп, Термінатор, Капітан Кірк і Дарт Вейдер. §RЛо Пан§!, Супермен, усі Могутні Рейнджери, Білл С. Престон і Теодор Логан. Спок, Скеля, Док Ок і Галк Хоган."
  nf_sdc.6.a:0 "§RУсі вони з'явилися нізвідки з блискавичною швидкістю.§!"
  
  nf_sdc.7.t:0 "Наслідки"
  nf_sdc.7.d:0 "Пожежа вирувала кілька місяців, вона забрала багато життів, але зрештою чемпіон вистояв, решта побачили свого переможця... \n\n§R...Містер Роджерс у закривавленому светрі.§!"
  nf_sdc.7.a:0 "§R*~*пускає сльозу за загиблими*~*§!"
  nf_sdc.7.b:0 "Ні, я не можу цього зробити. Світ не може втратити його знову."
  
  nf_sdc.8.t:0 "Сталася трагедія"
  nf_sdc.8.d:0 "У трагічному збігу обставин переможець Остаточної Розбірки, Містер Роджерс, наклав на себе руки. Решта мирних жителів Сан-Франциско висловили таке невдоволення цим, що впали у глибоку депресію, дехто почав лютувати через абсолютну абсурдність втрат життів, яких зазнало місто. \n\nЛо Пана ніде не знайти, і припускають, що він загинув у бою під час великої війни Розбірки і Чака."
  nf_sdc.8.a:0 "Серйозно, ось так все закінчується?"

  nf_sdc.9.t:0 "Відродження людства"
  nf_sdc.9.d:0 "Внаслідок приголомшливого повороту подій, переможець Остаточної Розбірки, Містер Роджерс, відмовився накладати на себе руки, і тепер проголосив себе новим лідером Шоудаун-Сіті, або радше Притулку Розбірки під його контролем. \n\nСвіт не знав такої людини вже кілька сотень років, і жителі в захваті від того, що така людина, як він, взяла владу в свої руки. Нехай він поширить свою доброту та людяність на всю пустку — урок, який загубився в часі."
  nf_sdc.9.a:0 "Він — сльоза в нашому серці, а ця пустка у вогні."

  nf_sdc.10.t:0 "Досить неортодоксальний підхід"
  nf_sdc.10.d:0 "Рано-вранці §RЛо Пан§! і солдати, яких йому вдалося зібрати, почали пробувати те, що більшість його людей вважала божевіллям — волати до розуму. \n\nВідправляючи своїх людей у пошукові загони, §RЛо Пан§! мав намір знаходити потойбічних бійців, які б'ються між собою, і спробувати використати свої дипломатичні навички, щоб не провокувати конфлікт, а натомість об'єднати їх проти загрози, що насувається з іншого боку Естуарію."
  nf_sdc.10.a:0 "Переговори були зовсім не короткими, насправді вони були досить довгими."

  nf_sdc.11.t:0 "Шак-пломатія"
  nf_sdc.11.d:0 "Ло Пан якимось чином натрапив на Шакіла О'Ніла та Арона Картера, і за допомогою невеликих «переговорів» переконав їх обох приєднатися до розвідувальних сил. З таким хлопцем, як Шак, знайти і переконати інших бійців буде легко, і в міру того, як вони знаходили кожного учасника бою, вони вербували їх заради єдиної мети. \n\nЧак С. Гейз.\n\nБетмен, Лінкольн, Оптімус Прайм, Скрафф Макграфф, Індіана Джонс, Док Браун і Марті Макфлай, якимось чином увесь акторський склад «Зоряних війн», навіть Ґодзілла! Один за одним усі були зібрані, їхні навички та таланти стали в пригоді."
  nf_sdc.11.a:0 "Принаймні ми зупинили Джекі Чана."

  nf_sdc.12.t:0 "Зібрання Століть" #Scorn wrote this one, THANK YOU TWIN
  nf_sdc.12.d:0 "Ло Пан і Шак вирішили розділити обов'язки з вербування решти неймовірних бійців. Ло Пан вирушив вербувати Ґендальфа Сірого, який був там зі своїм братом-близнюком, Ґендальфом Білим. Тим часом Шаку вдалося завербувати Чорного Лицаря з «Монті Пайтона і Священного Грааля». На диво, Беніто Муссоліні і Синій Злюка також були там, і Шак запропонував їм приєднатися, на що вони люб'язно погодилися.\n\nЦей процес тривав, здавалося, вічність, але врешті-решт усі бійці були зібрані. Отже, це буде Остаточна Розбірка, або радше Остаточний Ши-даун."
  nf_sdc.12.a:0 "Підходьте всі на бій століття!"
  
  nf_sdc.13.t:0 "Наближення НКР"
  nf_sdc.13.d:0 "§RЛо Пан§!, який тепер очолює мультивсесвітніх бійців, стоїть біля воріт Санта-Круз і вирішує сказати кілька надихаючих слів людям та істотам у своїх військах.\n\n«Можливо, ви всі з-поза меж цього світу чи з інших всесвітів, але це не заважає нам зібратися тут і протистояти найбільшій загрозі, яку коли-небудь знала пустка. \n\nЧак Норріс, про якого йшлося у Пророцтві, підійшов до наших воріт і прямо зараз загрожує нашим життям. Думаю, настав час поставити його на місце»."
  nf_sdc.13.a:0 "У Чака Гейза немає проти нас жодних шансів!"

  nf_sdc.14.t:0 "Остаточний Ши-даун"
  nf_sdc.14.d:0 "Тоді Ґендальф Сірий та Ґендальф Білий, і Чорний Лицар з «Монті Пайтона і Священного Грааля». І Беніто Муссоліні, і Синій Злюка. І Ковбой Кертіс, і Джин Джамбі. \n\nРобокоп, Термінатор, Капітан Кірк і Дарт Вейдер. §RЛо Пан§!, Супермен, усі Могутні Рейнджери, Білл С. Престон і Теодор Логан. Спок, Скеля, Док Ок і Галк Хоган. \n\n(Наступний фокус автоматично оголосить війну НКР, а попередня подія надала вам необхідне спорядження, щоб ваші війська були в повній боєготовності; переконайтеся, що ваші війська стоять на обох кордонах, Території Наварро БУДУТЬ залучені до війни!)"
  nf_sdc.14.a:0 "§RУсі вони з'явилися нізвідки з блискавичною швидкістю.§!"

  nf_sdc.15.t:0 "Наслідки"
  nf_sdc.15.d:0 "Пожежа вирувала кілька місяців, вона забрала багато життів, але зрештою чемпіони вистояли, решта побачили своїх переможців... \n\n...Ло Пана і кожного учасника розбірки. (Містер Роджерс у безпеці!)"
  nf_sdc.15.a:0 "Це безперечно була найвеличніша розбірка всіх часів."

  nf_sdc.16.t:0 "§RРейганоміка§!"
  nf_sdc.16.d:0 "Каліфорнія під нашим контролем, Чак С. Гейз мертвий, а його жалюгідні солдати здалися, щойно його голову повісили на найвищій точці Шейді Сендс. \n\nЗараз тут так багато містичних і магічних людей, і без причин для боїв може розпочатися велика реконструкція. Можливо, вона почнеться з малого і займе багато часу, але це місце може стати Восьмим чудом світу. \n\nОднак пізно вночі ми отримали в Сталевому Палаці дальню передачу, що походила звідкись із Небраски. Чи варто нам її прослухати?"
  nf_sdc.16.a:0 "Як на один день цього занадто, нехай хтось викличе Хаос Контроль."
  nf_sdc.16.b:0 "Кажете, дивна передача? Що ж, давайте послухаємо."

  nf_sdc.17.t:0 "Людина з Сед... з Півночі"
  nf_sdc.17.d:0 "Північний гість нарешті прибув після двомісячної подорожі з Небраски. Після прибуття Муссоліні одразу ж викликав його гнів, однак це тривало недовго, оскільки Ґоддард почав розповідати про свій досвід спілкування з Ло Паном у Сталевому Палаці. \n\nҐоддард: «Тож ви розумієте, що людина повинна довести свою цінність. Як щодо того, щоб ми впровадили політичну систему, де людей оцінюють за їхнім потенціалом, а потім...» \n\nПроте Ло Пан швидко перебив його, не давши йому закінчити свою думку, і розпалив гриль «Радіаційний Король» поруч з ними."
  nf_sdc.17.a:0 "Ти слабак, Ґоддарде. Давай просто посмажимо барбекю."
