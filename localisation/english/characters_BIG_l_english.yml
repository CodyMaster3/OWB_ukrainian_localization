l_english:
BIG_CRYSTAL_BETH_NAME:0 "Крістал Бет"
BIG_CRYSTAL_BETH_DESC:0 "Stampede велика, але ми — ще більші! Якби ви спитали Крістал Бет, чи все погано у банди, вона б запевнила вас, що розбирається в меті ведення війни та впевнена: перемогти можна в будь-якій ситуації, якщо максимально використовувати свої сильні сторони й мінімізувати слабкі. Вона б додала, що її противники — це по суті купка тупих роботів, які ледве можуть скласти їй хоч якийсь виклик. А потім вона би провела наступні три дні, несамовито ображаючи свою банду під час жорсткого хім-рейву."