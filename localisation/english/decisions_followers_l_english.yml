l_english:
 # Followers Spread Decisions
  followers_spread:0 "Послідовники Апокаліпсису"
  followers_spread_desc:0 "Заснувавшись на землях наших сусідів, Послідовники Апокаліпсису наразі поширюються нашими землями. Засновані на ідеалах пацифізму й гуманітарної допомоги, вони можуть принести значну користь нашій нації та її населенню, однак поступово підривають бойовий дух нашого народу. На цьому ранньому етапі вони є вразливими до нещасть або спрямування в хибному напрямку. Але обережно! Якщо ми занадто сильно тиснутимемо на них, вони помітять наші зусилля підірвати їхній вплив і залишать наші землі. Ми балансуємо на тонкій межі!"
  followers_established_countdown:0 "Послідовники утвердилися"
  followers_established_countdown_desc:0 "Послідовники повільно, але впевнено поширюють свій вплив нашою країною, і незабаром можуть вкоренитися занадто глибоко, щоб їх можна було витіснити..."
  grant_followers_bases:0 "Надати Послідовникам бази"
  grant_followers_bases_desc:0 "Послідовникам потрібні опорні пункти для розподілу припасів і надання допомоги пораненим. Безкоштовне надання баз покращить наші відносини з ними та, можливо, згладить деякі попередні... розбіжності..."
  escort_followers_convoys:0 "Охороняти каравани Послідовників"
  escort_followers_convoys_desc:0 "Каравани Послідовників часто вщерть набиті припасами й технологіями, що робить їх привабливою ціллю для місцевих рейдерів. Пропозиція захисту покращить наші стосунки з ними."
  placate_followers:0 "Заспокоїти Послідовників"
  placate_followers_desc:0 "Через політичні маневри ми можемо спробувати покращити наші стосунки з Послідовниками."
  divert_followers_supplies:0 "Відхилити припаси Послідовників"
  divert_followers_supplies_desc:0 "Підкупивши або залякавши певних людей, ми можемо отримати частину запасів Послідовників для нашої армії."
  raid_followers_supplies:0 "Напасти на запаси Послідовників"
  raid_followers_supplies_desc:0 "Якщо ми замаскуємо наших солдатів під рейдерів, то зможемо безпосередньо пограбувати запаси Послідовників. Це ризиковано!"
  seize_followers_fort:0 "Захопити форт Послідовників"
  seize_followers_fort_desc:0 "Послідовники діють з низки фортів по всій країні. Якщо ми забажаємо, то можемо силою забрати один із них! Але це сильно їх розлютить..."
  followers_pissed:0 "Послідовники викрили наші спроби підірвати їхній вплив!"
  
  followers_interaction:0 "Взаємодія з Послідовниками"
  followers_interaction_desc:0 "Тепер, коли вони закріпилися в нашій країні, ми можемо взаємодіяти з ними без страху, що вони покинуть нас. Вони готові надавати послуги та ресурси для народу, але це збільшить їхній вплив у нашій країні — що може призвести до вимог!\n\nПоточний вплив Послідовників: [GetFollowersInfluenceAmount]"
  followers_seize_power:0 "§RПослідовники захоплюють владу?§!"
  followers_seize_power_desc:0 "Вплив Послідовників у нашій державі зростає безконтрольно. Вони вже мають безпрецедентну владу не лише серед народу, а й у верхівці. Подейкують, що вони можуть спробувати захопити владу. Невже вони справді посміють?"
  followers_demand_peace:0 "§YПослідовники вимагають миру!§!"
  followers_demand_peace_desc:0 "У відповідь на наше останнє оголошення війни, Послідовники, посилені своїм значним впливом, вимагають припинення агресії. Яке нахабство!"
  followers_demand_red_con:0 "§YПослідовники вимагають скорочення призову§!"
  followers_demand_red_con_desc:0 "Призов до війська суперечить ідеології Послідовників, і тепер вони використовують свій вплив, аби змусити нас відмовитись від цієї практики."
  followers_demand_no_nukes:0 "§YПослідовники вимагають утилізації ядерної зброї!§!"
  followers_demand_no_nukes_desc:0 "Відомі своїм пацифізмом і антиядерною позицією, Послідовники вимагають знищити нашу нещодавно здобуту боєголовку. Деякі з них навіть погрожують збройним рейдом. Невже вони відмовляться від пацифізму заради цього?"
  followers_demand_demil:0 "§YПослідовники вимагають демілітаризації!§!"
  followers_demand_demil_desc:0 "Послідовники категорично проти війни, і тому засудили наше рішення розширити збройне виробництво. Вони мобілізували свій вплив, аби натиснути на нас."
  followers_demand_red_sla:0 "§YПослідовники вимагають скасування рабства!§!"
  followers_demand_red_sla_desc:0 "У відповідності до своєї ідеології, Послідовники вимагають припинити наші рабовласницькі практики. Можна ж це просто ігнорувати, так?"

  followers_request_aid:0 "Попросити допомогу Послідовників"
  followers_request_aid_desc:0 "Наші солдати гинуть на полях битв. Хіба Послідовники не мають співчуття?"
  followers_request_tech:0 "Попросити технології у Послідовників"
  followers_request_tech_desc:0 "Послідовники мають великі знання завдяки бібліотекам Хаба та Дейглоу. Ми можемо отримати частину цих знань в обмін на послуги."
  followers_encourage_settlements:0 "Попросити допомоги для поселень"
  followers_encourage_settlements_desc:0 "Послідовники мають аграрні й медичні знання — ідеально для розвитку нових поселень."
  followers_recruit_agri:0 "Найняти аграрних експертів"
  followers_recruit_agri_desc:0 "Експерти з сільського господарства — рідкість. Послідовники мають таких, і ми можемо їх найняти для покращення нашої аграрної галузі."
  followers_influence_decreased_enough:0 "Ми суттєво зменшили вплив Послідовників у нашій країні"
  resisted_followers_tt:0 "Відмовившись, ми зупинимо подальші вимоги по цій темі!\n"
  followers_help_with_soot:0 "Попросити допомоги з Хворобою Сажі"
  followers_help_with_soot_desc:0 "Послідовники, ймовірно, зможуть допомогти, обмінявши підтримку нашого уряду на медичну допомогу. Їхні знання безцінні."
  followers_request_industry_assistance:0 "Попросити вчителів у Послідовників"
  followers_request_industry_assistance_desc:0 "Якщо зробити правильний запит, Послідовники можуть допомогти у підготовці спеціалістів і майстрів."
  followers_electrification_help:0 "Попросити допомогу з електрифікацією"
  followers_electrification_help_desc:0 "Послідовники можуть допомогти відновити електрику у бідніших регіонах, якщо наші стосунки з ними хороші."

  followers_influence_popular: "Послідовники прийняті урядом"
  follower_influence_changed_tt:0 "Вплив Послідовників зміниться на [GetFollowersInfluenceChange]"
  followers_influence_increase:0 "§G[?add_to_influence]§!"
  followers_influence_decrease:0 "§R[?add_to_influence]§!"
  followers_influence_positive:0 "§G[?followers_influence]§!"
  followers_influence_negative:0 "§R[?followers_influence]§!"
