l_english:
  ## Loc written by HappyNTH ##

  ## Structure:
  # All sets of events start with a comment listing the VP and who the VP falls to; e.g. New Canaan / Generic. Each city has 10 event ids reserved to them for specific events (e.g. Canaan falling to ...)
  # x.t is the title
  # x.d is the description
  # x.a is the option for the country who LOST the VP
  # x.b is the option for countries ALLIED WITH the country that LOST the VP
  # x.c is the option for the country who TOOK the VP
  # x.e is the option for countries ALLIED WITH the country that TOOK the VP
  # x.f is the option for all other countries
  # The above structure will hold true even if duplicate messages are used

  ### Main Capitals
  ## New Canaan (ids 1 to 9)
  # 1: Generic
downfall.1.t:0 "Падіння Нью-Ханаану"
downfall.1.d:0 "Після днів запеклих боїв Нью-Ханаан впав під натиском [Root.GetNameDef]. Мормонські війська хоробро захищали поселення до ранку, відступаючи до поспіхом зведених оборонних ліній не менше семи разів. Хоча наказ на відступ був відданий ще пізно вночі після успішного маневру з оточенням ворогом, захисники міста відмовилися його виконати й зайняли добре укріплені позиції в центрі міста. Лише завдяки масованому артобстрілу вдалося остаточно придушити їхній останній спротив.\n\nІз настанням ранку стало очевидно, що поселення було спустошене. [Root.GetNameDefCap] не залишили милосердя тим, хто опирався їхній владі — багато будівель перетворено на димлячі руїни, включно з Церквою Ісуса Христа Святих Останніх Днів — головним місцем поклоніння мормонів."
downfall.1.a:0 "Ми повинні помститися за загиблих!"
downfall.1.b:0 "Вони померли як мученики. Це все, чого можна просити."
downfall.1.c:0 "Місто притулку нарешті в наших руках!"
downfall.1.e:0 "Нью-Ханаан має бути на останньому подиху."
downfall.1.f:0 "Скільки може протриматися нація без міста, що дало їй ім’я?"

  # 2: To CES
  # 3: To EHT
  # 4: To HEA
  # 5: To WHT

  ## Shady Sands (ids 10 to 19)
  # 10: Generic
downfall.10.t:0 "Падіння Шейді-Сендс"
downfall.10.d:0 "Після кількох днів кривавих сутичок уряд НКР сьогодні підтвердив, що їхня улюблена столиця, Шейді-Сендс, впала до рук [Root.GetNameDef]. Захоплення міста відбулося попри запеклий опір як з боку Рейнджерів НКР, так і місцевої міліції, хоча точна інформація про битву за Шейді-Сендс залишається вкрай мізерною.\n\nНа очах шокованих мешканців, саме місто зазнало серйозних руйнувань. Вціліла лише невелика частина будівель, включаючи Конгрес-Хол, над яким тепер майорять прапори [Root.GetNameDef]."
downfall.10.a:0 "Шейді-Сендс втрачено, але війна триває."
downfall.10.b:0 "Каліфорнійський фронт має вистояти!"
downfall.10.c:0 "Конгрес-Хол — це серце НКР. Вони незабаром попросять миру."
downfall.10.e:0 "Навіть Рейнджери не зупинили наш союз."
downfall.10.f:0 "НКР поранено, але ще не смертельно."
  # 11: To CES
  # 12: To BOS
  # 13: To DES
  # 14: To ENC
  # 15: To RDS
  # 16: To KHA
  # 17: To Generic Raiders

  ## Flagstaff (ids 20 to 29)
  # 20: Generic
downfall.20.t:0 "Падіння Флагстаффа"
downfall.20.d:0 "Місто Флагстафф, що довгий час було осередком абсолютної влади Цезаря, пізно вночі впало під натиском [Root.GetNameDef]. Хоча [CES.GetLeader] особисто командував обороною до самого кінця, навіть його військова мудрість не змогла врятувати місто, оточене попередніми маневрами [Root.GetName]. У своїй 'безмежній мудрості' [CES.GetLeader] наказав дати останній бій, звелівши преторіанцям відкривати вогонь по будь-якому, хто спробує дезертирувати. Зрештою, цей наказ лише затримав падіння міста на день, хоча й досі тривають окремі бої між нападниками та частинами Преторіанської гвардії, що засіли в будівлях. Палац Цезаря все ще утримується, але це, ймовірно, зміниться, щойно інженери [Root.GetName] займуть позиції для підриву."
downfall.20.a:0 "У нас ще багато міст для відступу..."
downfall.20.b:0 "Одне місто нічого не означає для Легіону. Так?"
downfall.20.c:0 "Скільки ж у Легіону було рабів?!"
downfall.20.e:0 "Тиранія Легіону незабаром закінчиться."
downfall.20.f:0 "Бик, можливо, невдовзі впаде."
  # 21: To NCR
  # 22: To RRG
  # 23: To TWI
  # 24: To MOJ
  # 25: To BOS
  # 26: To NCN
  # 27: To Generic Legion Focus Tree Conquest

  ## New Vegas (ids 30 to 39)
  # 30: Generic
downfall.30.t:0 "Падіння Нью-Вегаса"
downfall.30.d:0 "Вперше за всю сучасну історію казино на Стріпі Нью-Вегаса не відкрилися сьогодні зранку — переважно через те, що були знищені в запеклих боях проти [Root.GetNameDef]. Протягом кількох днів бої тривали на Стріпі, де Сек'юртрони й банди, вірні великим родинам казино, відчайдушно намагалися втримати своє дорогоцінне місто. Врешті-решт Стріп був втрачений, але навіть тоді родини продовжували обороняти свої заклади. Після прямого наказу [Root.GetLeader] казино були знесені разом із останніми мафіозі всередині — на жаль для солдатів, які прагнули пограбування. Сек'юртрони тим часом відступили в напрямку системи моніторингу погоди Мохаве, хоча знайти їх поки не вдалося."
downfall.30.a:0 "Знайдіть мені цих Сек'юртронів!"
downfall.30.b:0 "Перлина Пустки тепер наша!"
downfall.30.c:0 "Вегас був відбудований одного разу — і буде знову."
downfall.30.e:0 "Допоки Сек'юртрони б'ються..."
downfall.30.f:0 "Вегас пережив Велику Війну, але не [Root.GetNameDef]"
  # 31: To NCR
  # 32: To CES
  # 33: To KHA
  # 34: To MOJ

  ## Lost Hills Bunker (ids 40 to 49)
  # 40: Generic
downfall.40.t:0 "Захоплення бункера Лост-Гіллс"
downfall.40.d.big_boom:0 "Дехто вважав його неприступним, інші — що спроба завоювання комплексу бункерів Лост-Гіллс буде надто кривавою. Обидві сторони, здавалося, помилялися після одного дня доволі посереднього бою.\n\nВійська [Root.GetName] розпочали атаку на світанку, ймовірно, застукавши Братство зненацька. Першими через двері бункера прорвалися елітні загони, озброєні потужною протитанковою зброєю, достатньою, щоб двічі рознести Ліберті Прайма. Проте їм ніхто не опирався. Схоже, Братство зрозуміло, що їхня головна перевага — силова броня — не надто ефективна у вузьких коридорах. І, вочевидь, вони не мали жодного бажання влаштовувати героїчну останню битву. Натомість, не знаючи про це, нападники досягли четвертого рівня — і бункер, повністю замінований, вибухнув. Вибух відчувався по всій Каліфорнії, забравши понад п’ятсот життів солдатів [Root.GetName]. Зрештою, саме ті, хто попереджав про надмірну кривавість цього штурму, виявилися праві."
downfall.40.d.delayed_boom:0 "Дехто вважав його неприступним, інші — що штурм буде занадто кривавим. Та після одного дня неочікувано легкого бою, обидві думки, здавалося, виявились помилковими. Війська [Root.GetName] почали атаку на світанку, ймовірно, застукавши Братство зненацька. Першими увійшли елітні солдати, озброєні протитанковою зброєю. Супротиву не було. Проте, коли вони дістались четвертого рівня, бункер вибухнув. Вибух був відчутний по всій Каліфорнії і забрав життя понад п’ятисот бійців. Однак частині сил [Root.GetName] вдалося викрасти надзвичайно цінні креслення до знищення бази!"
downfall.40.d.tense_fighting:0 "Багато хто вважав, що бункер неможливо взяти, або що штурм буде надто кривавим. Однак після одного дня жорстокого бою все стало зрозуміло. Війська [Root.GetName] атакували зранку, зустрівши шалений опір — майже кожному мешканцю бункера дали зброю. Старійшини, писарі та паладини билися пліч-о-пліч до останнього. Зрештою, Лост-Гіллс було знищено, а [Root.GetName] залишилось лише зібрати трофеї."
downfall.40.d:0 "Багато хто вважав, що бункер неможливо взяти, або що штурм буде надто кривавим. Однак після одного дня жорстокого бою все стало зрозуміло. Війська [Root.GetName] атакували зранку, зустрівши шалений опір — майже кожному мешканцю бункера дали зброю. Старійшини, писарі та паладини билися пліч-о-пліч до останнього. Зрештою, Лост-Гіллс було знищено, а [Root.GetName] залишилось лише зібрати трофеї."
downfall.40.bos:0 "AD VICTORIAM!"
downfall.40.bos_ally:0 "Навіть загнане в кут, Братство залишається хитрим."
downfall.40.conquerer:0 "Вигнати Братство з Лост-Гіллс було варте жертв."
downfall.40.conquerer_ally:0 "Добре, що це були не наші війська."
downfall.40.neutral:0 "Загибель Лост-Гіллс не знищить Братство — воно всюди."

  # 41: To NCR
  # 42: To ENC
  # 43: To Generic Brotherhood

  ## Ranger Citadel (ids 50 to 59)
  # 50: Generic
downfall.50.t:0 "Зруйнування Цитаделі Рейнджерів"
downfall.50.d:0 "Рейнджери пусток Аризони — колись гроза всіх рейдерів — сьогодні втратили свою головну твердиню. Попри мужній опір і триденну оборону проти масованого наступу, улюблена тактика виживання Рейнджерів не змогла встояти перед лавиною [Root.GetNameDef]. Зрештою, Рейнджери ухвалили болюче, але необхідне рішення — відступити, щоби зберегти життя та не допустити полону свого керівництва."
downfall.50.a:0 "Ми ще повернемося, запам’ятайте мої слова!"
downfall.50.b:0 "Рейнджери — майстри виживання. Вони вистоять."
downfall.50.c:0 "У наших руках — серце організації Рейнджерів!"
downfall.50.e:0 "Скоро Аризона буде відкритою для нас!"
downfall.50.f:0 "Рейнджери битимуться до останнього подиху."
  # 51: To JAC
  # 52: To VIP
  # 53: To NCR
  # 54: To WHT
  # 55: To ENC
  # 56: To CES
  # 57: To Generic Raiders

  ## Vault City (ids 60 to 69)
  # 60: Generic
downfall.60.t:0 "Падіння Місто-Сховище"
downfall.60.d:0 "Запеклі бої за Місто-Сховище добігають кінця. [Root.GetNameDef] почали зачищати руїни, тоді як мешканці не знають, чого чекати від нових володарів. Скарби Сховища вже прямують до [Root.Capital.GetName]. Хто б міг подумати, що таке місто взагалі можна захопити?"
downfall.60.a:0 "Добре хоч евакуювали наші технології."
downfall.60.b:0 "Сподіваємось, G.E.C.K. не втрачено."
downfall.60.c:0 "Вони довго не протримаються..."
downfall.60.e:0 "Невдовзі й ми отримаємо свою здобич!"
downfall.60.f:0 "Для [VLT.GetLeader] Місто-Сховище — це все."
  # 61: To NCR
  # 62: To ENC
  # 63: To Generic Focus Tree Conquest

  ## New Reno (ids 70 to 79)
  # 70: Generic
downfall.70.t:0 "Падіння Нью-Рено"
downfall.70.d:0 "Хаос битви за Нью-Рено добігає кінця. [Root.GetNameDef] починає встановлювати порядок у місті. Бої все ще тривають на околицях, але вважається, що за кілька днів усе повернеться до «норми»."
downfall.70.a:0 "Тільки подумати, скільки Джету ми втратили..."
downfall.70.b:0 "Рено тепер стане значно біднішим..."
downfall.70.c:0 "Ми чули чутки, але виявилось ще гірше!"
downfall.70.e:0 "Сподіваємось, нам дістанеться трохи Джету!"
downfall.70.f:0 "Сподіваюсь, вони спалять те місце дотла!"
  # 71: To NCR
  # 72: To ENC
  # 73: To Generic Brotherhood

  ## The Warren (ids 80 to 89)
  # 80: Generic
downfall.80.t:0 "Захоплення Воррена"
downfall.80.d:0 "Армії мутантів [TRL.GetName] зазнали поразки від [ROOT.GetNameDef], а наповнені FEV печери навколо Крейтер-Лейк тепер зайняті військами загарбників. Мутантів з Воррена змусили тікати зі своїх домівок. Чи залишилось ще якесь майбутнє для мутантів на далекій півночі?"
downfall.80.a:0 "Трагічний день для всіх мутантів."
downfall.80.b:0 "Вони ніколи й не були особливо прив’язані до місцевості."
downfall.80.c:0 "Очистити ці землі від них!"
downfall.80.e:0 "Світ зрадіє, що вони зникли!"
downfall.80.f:0 "Що тепер чекає північ?"
  # 81: To NCR
  # 82: To WBH
  # 83: To Generic Brotherhood

  ## Capitol Hill (ids 90 to 99)
  # 90: Generic
downfall.90.t:0 "Капітолійський пагорб упав"
downfall.90.d:0 "Після запеклого опору Капітолійський пагорб впав до рук [Root.GetNameDef]. Сили Братства мужньо тримали оборону до останнього пострілу. Дезертирів розстрілювали, але коли запаси набоїв почали вичерпуватись, на заході сонця було віддано наказ на поспішний відступ, передавши пагорб під контроль [Root.GetNameDef]."
downfall.90.a:0 "Ми відплатимо за цю кров сторицею!"
downfall.90.b:0 "Ми повинні підтримати наших друзів у скруті."
downfall.90.c:0 "Тепер, коли Капітолій захоплено — перемога наша!"
downfall.90.e:0 "Перемога вже у нашому досяжності!"
downfall.90.f:0 "Побачимо, як поводитимуться нові господарі."
  # 91: To OLY or TCA
  # 92: To TRL
  # 93: To Generic Brotherhood

  ## North Koover (ids 100 to 109)
  # 100: Generic
downfall.100.t:0 "Норт-Кувер захоплено під час рейду"
downfall.100.d:0 "Іронія долі: столицю піратів Зламаного Узбережжя, Норт-Кувер, захопили рейдові загони [Root.GetNameDef]. Морська піхота висадилась на пляжах Верхньої Колумбії серед ночі, захопивши охорону зненацька. До того, як встигли викликати підкріплення, рейдери взяли під контроль ключову інфраструктуру міста, знищили керівництво та закріпилися на перехрестях, дахах і в закинутих крамницях. Невдовзі до них приєдналися основні сили [Root.GetName], що дозволило просунути фронт углиб Зламаного Узбережжя. Хоч ворог і ще чинить опір, ми вважаємо, що ця атака сильно дестабілізувала їхнє командування. Чи зможе [Root.GetNameDef] скористатись цією перевагою — покаже час."
downfall.100.a:0 "Ми повернемо Норт-Кувер — і заберемо їхні життя!"
downfall.100.b:0 "Берег заплатив за це місто кров’ю. Допоможемо його відбити."
downfall.100.c:0 "Ми вдерлись до рейдерів — яка іронія!"
downfall.100.e:0 "Завдяки [Root.GetNameDef] ми можемо зітхнути з полегшенням."
downfall.100.f:0 "Чи втримають вони Норт-Кувер? Час покаже."
  # 101: To Generic Unbroken Resistance Member

  ## Heaven's Gate (ids 110 to 119)
  # 110: Generic
downfall.110.t:0 "Падіння Врат Раю"
downfall.110.d:0 "Священний хрестовий похід проти [Root.GetNameDef] виявився занадто важким для Врат Раю — сьогодні їхня столиця «Пара» впала. Після кривавої кампанії тіла вірян і парових творінь лежали на Святій Землі, ведучи слід прямо до зруйнованих воріт собору. Битва за місто була запеклою: кожен здатний нести зброю — чоловік, жінка чи дитина — за наказом Духовенства мав віддати життя за бачення Архангела.\n\nСили [Root.GetNameDef] вели запеклі бої в міських кварталах, повільно просуваючись вгору до собору на вершині гори, на якій стояло місто. Кожен блок був жорстко захищений окопаною піхотою та ополченцями.\n\nВперше за десятки років дим із міста — не дзвін до меси."
downfall.110.a:0 "І зрозуміють вони, що Я — ГОСПОДЬ, коли Я звершу Свою помсту." 
downfall.110.b:0 "Ми не дамо Вратам Раю впасти від рук грішників!"
downfall.110.c:0 "І ми взяли Врата, і побачив Бог, що це добре."
downfall.110.e:0 "І ми зітхнули з полегшенням, адже хрестоносці були переможені."
downfall.110.f:0 "Схоже, вони вичерпали свою пару."
  # 111: To NCN

  ## Hidden Valley (ids 120 to 129)
  # 120: Generic
downfall.120.t:0 "Облога Прихованої Долини"
downfall.120.d:0 "Після кількох днів облоги й безперервних боїв Прихована Долина впала. [Root.GetNameDef] змогли захопити розгалужену мережу бункерів, хоч окремі осередки опору ще тримаються.\n\nБ’ючись до останнього, важко сказати, чи була ця перемога для [Root.GetNameDef] справді перемогою. Чи варта ця земля тієї ціни, що була сплачена кров’ю?"
downfall.120.a:0 "Брати і сестри, тримайтесь! Ad Victoriam!" 
downfall.120.b:0 "Ми не можемо залишитись у тіні героїзму Братства." 
downfall.120.c:0 "Захопивши Долину, вони скоро впадуть остаточно."
downfall.120.e:0 "Ця війна повинна незабаром скінчитись."
downfall.120.f:0 "Що? Це ж, мабуть, була різанина..."
  # 121: To NCR
  # 122: To CES
  # 123: To VEG
  # 124: To Generic Mojave

  ## Bitter Springs (ids 130 to 139)
  # 130: Generic
downfall.130.t:0 "Друга Різанина у Біттер-Спрінгс"
downfall.130.d:0 "Бої в Біттер-Спрінгс стихають, [Root.GetNameDef] зачищають залишки опору. Чутки про нову різанину вже ширяться Пусткою, хоча підтверджені звіти досі уривчасті."
downfall.130.a:0 "Ми помстимось за полеглих!"
downfall.130.b:0 "Як вони посміли вбивати цивільних!"
downfall.130.c:0 "Добити залишки спротиву."
downfall.130.e:0 "Всі знають — це лише брехливі чутки."
downfall.130.f:0 "Ці чутки викликають занепокоєння."
  # 131: To NCR
  # 132: To CES
  # 133: To WHT
  # 134: To Generic Focus Tree Conquest

  ## Gloria (ids 140 to 149)
  # 140: Generic
downfall.140.t:0 "Слава Падає"
downfall.140.d:0 "Після годин вуличних боїв [Root.GetNameDef] нарешті захопили більшість міста Глорія. Герої з обох боків билися до кінця, і з огляду на запеклість боїв, слава справді здобута. Хоч спротив у місті ще триває, головні сили Республіки відступили. Місто в руїнах, і постає питання: що чекає Глорію далі?"
downfall.140.a:0 "Республіка — це більше, ніж місто. ¡Por la República, por México!"
downfall.140.b:0 "Ми повинні звільнити Глорію та боротись із тиранією."
downfall.140.c:0 "Славний день для нас!"
downfall.140.e:0 "Ми не дамо [Root.GetNameDef] забрати всю славу!"
downfall.140.f:0 "Чи справді вся ця смерть і війна — славетні?"
  # 141: To CES
  # 142: To TAA
  # 143: To ARM
  # 144: To Generic Mexico

  ## Los Mochis (ids 150 to 159)
  # 150: Generic
  #Los Mochis/Freedom Fighters
downfall.150.t:0 "Розбиті Маски"
downfall.150.d:0 "Після тяжких боїв, у яких багато солдатів поклали життя з обох сторін, Вільні Бійці зрештою втратили свою столицю Лос-Мочіс. Бої в місті припинилися сьогодні. Усвідомлюючи, яку біду це принесе народу, якщо не діяти швидко, Трес Маскарас та їхні найелітніші бійці присягнули виграти якомога більше часу, щоб мирні жителі могли втекти."
downfall.150.a:0 "Дух Вільного Бійця не зламати. Ми повернемось!"
downfall.150.b:0 "Цього разу ми боротимемось за свободу Вільних Бійців!"
downfall.150.c:0 "Справжні герої не носять дурнуватих масок — і не падають так легко."
downfall.150.e:0 "[Root.GetNameDef] зробили послугу Мексиці, знищивши цих месників."
downfall.150.f:0 "Невже Лас Трес Маскарас можна перемогти так просто?"


  ## Reynosa (ids 160 to 169)
  # 160: Generic
downfall.160.t:0 "Двічі за одне життя"
downfall.160.d:0 "Запеклі бої закінчились у джунглях столиці Рейноса. Сили [Root.GetNameDef] зачистили окопані позиції роботів і рекрутів. Репортери з передової повідомляють, що живих солдатів у місті брали в полон, а решту знищували вибухівкою та вогнеметами. Залишки механізованих військ під командуванням Генераліссімуса було знищено завдяки протитанковим загонам. Цивільні, які жили під правлінням Санта Анни, обережно виходять із домівок, дивуючись відсутності всевидячих роботів на вулицях.\n\nХоч фронт Ехерсіто в Рейносі стрімко розпався, розвідка [Root.GetNameDef] дізналась, що Санта Анна збирає армію й авіацію для контратаки. Втрата столиці — тяжкий удар, але Генераліссімус ще не готовий здатись — бодай без ще десяти битв."
downfall.160.a:0 "Я не приймаю цього! Рейноса знову буде моїм!"
downfall.160.b:0 "Санта Анна втратив трон — допоможемо йому повернути його."
downfall.160.c:0 "Рейноса — наша! Смерть Санта Анні! Віва Мексика!"
downfall.160.e:0 "400 років готувався — і знову все програв. Жалюгідно."
downfall.160.f:0 "Санта Анна втратив столицю. Мексика втратить тирана."
  # 161: To RRG
  # 162: To ITZ

  ## The Refinery (ids 170 to 179)
  # 170: Generic
downfall.170.t:0 "Ворожа Купівля Petro-Chico"
downfall.170.d:0 "Після кількох днів важких боїв з фронту надходять повідомлення про те, що [Root.GetNameDef] зламали вперту оборону столиці Petro-Chico — Рафінерії. Попри наявність оборонної лінії, укомплектованої тисячами солдатів, спецпідрозділи [Root.GetNameDef] змогли проникнути через слабо охоронювану ділянку захисту. Охорону на тій ділянці швидко й безшумно знищили під покровом ночі, а потім підірвали барикаду, що відділяла внутрішню частину Рафінерії від зони бойових дій, створивши прохід для основних сил. Опинившись у пастці з обох боків і зазнаючи втрат, яких не могли дозволити собі, Ель Сеєо — який особисто бився поруч із гвардією Маннагіас — наказав гарнізону скласти зброю. Народ Petro-Chico розбігся: частина на схід до Чичен-Іци, частина на південь до Нуево-Ацтлана. Схоже, що для цих колись гордих людей настав Четвертий Квартал. Сили [Root.GetNameDef] тепер займають занедбану, але цінну Рафінерію — артефакт Старого Світу."
downfall.170.a:0 "З волі Жеїрольдаса, ми повернемо нашу Рафінерію і Компанію!"
downfall.170.b:0 "Ми повинні повернути і Рафінерію, і все втрачене."
downfall.170.c:0 "Наші солдати заплатили кров’ю. Рафінерія — наша!"
downfall.170.e:0 "Треба було більше вкладати в оборону."
downfall.170.f:0 "Тривожно..."
  # 171: To ARM
  # 172: To ITZ

  ## Xochicalco (ids 180 to 189)
  # 180: Generic
downfall.180.t:0 "Падіння Шочікалько: Несподівана Катастрофа"
downfall.180.d:0 "Після довгої та виснажливої кампанії проти Нуево-Ацтлана, сили [Root.GetNameDef] нарешті прорвались у гірську столицю Шочікалько, захопивши її сьогодні. Гірські частини та спецпризначенці вели жорстокі бої проти воїнів культів Орла та Ягуара, які жертвували собою, щоби дати еліті та цивільним Нуево-Ацтлана час на втечу. Серед солдатів ширяться чутки про вуличні бої, де асиметрична війна охопила все місто. Для деяких підрозділів [Root.GetNameDef] багнети та рукопашний бій стали навіть частішими, ніж стрілянина.\n\nЧи зможе Ацтлан-Життєдавець, Ацтлан-Легендарний і Мовиця Єсеніа залишити після себе націю, здатну вистояти навіть у ці важкі часи, чи Нуево-Ацтлан все ж зламається під тягарем темної долі?"
downfall.180.a:0 "Іменем Ацтлана, ми кидаємо виклик нашій долі!"
downfall.180.b:0 "Майбутнє не написане. Ми допоможемо звільнити Шочікалько!"
downfall.180.c:0 "Ми станемо свідками кінця Нуево-Ацтлана, на відміну від Єсенії."
downfall.180.e:0 "Ядерні удари Тлалока були початком — ми його завершимо!"
downfall.180.f:0 "Квіткові війни розцвіли у щось жахливе..."

  # 181: To ITZ


  ## Chichen Itza (ids 190 to 199)
  # 190: Generic
downfall.190.t:0 "Падіння Чичен-Іци"
downfall.190.d:0 "Після кривавої кампанії Чичен-Іцу було відкинуто аж до півострова Юкатан силами [Root.GetNameDef], а сьогодні впала і столиця. Тіла солдатів обох сторін встеляють землю навколо піраміди, поки сили [Root.GetNameDef] поступово, але впевнено просувалися вглиб територій Чичен-Іци. Уряд Іцанів масово мобілізував всіх працездатних чоловіків і жінок, сподіваючись, що чисельна перевага схилить війну на їхній бік. Командування [Root.GetNameDef] сподівається, що захоплення столиці остаточно деморалізує залишки армії Іцанів.\n\n[ITZ.GetLeader] і його охорона ледь уникли захоплення силами [Root.GetNameDef], втікши до узбережжя. Вважається, що вони перетнули або Мексиканську затоку до американського півдня, або до одного з острівних народів Карибського басейну, але [Root.GetNameDef] не змогли їх переслідувати.\n\nПопри це, вважається, що [ITZ.GetLeader] скоро повернеться на материк, щоби вести переговори про мир для свого народу."
downfall.190.a:0 "Білий буде прапор, яким вони зрештою змахнуть, коли впадуть до наших ніг!"
downfall.190.b:0 "Чичен-Іца у біді — ми повинні допомогти!"
downfall.190.c:0 "Помаранчеве — сонце, що заходить над імперією Іцанів!"
downfall.190.e:0 "Чичен-Іца стане жертвою заради нашого процвітання!"
downfall.190.f:0 "Хто б не переміг — найбільше страждатиме народ Іцанів."
  # 191: To ATE

  ### Additional Cities

  ##Hangdogs (Id's 200 to 209)##

downfall.200.t:0 "Падіння Гангдогів"
downfall.200.d:0 "Кур'єри та біженці з Колорадо підтвердили, що сили [Root.GetNameDef] прорвали оборону Собачого Міста та захопили столицю Гангдогів. Хоча звуки бою досі лунають у руїнах міста, з тілами та кулями, що падають із висотних будівель, основні бої вже вщухли.\n\nСправжні собаки міста б'ються як за, так і проти оборонців, нападаючи з дренажних труб і щілин, де можуть ховатися. Тим часом армії [Root.GetNameDef] просуваються за межі міста, атакуючи решту укріплень під контролем Гангдогів. Чи зможуть ці пси війни повернути хід подій, чи їх буде розчавлено під чоботами [Root.GetNameDef]?"
downfall.200.a:0 "Наші пси не підкоряться!"
downfall.200.b:0 "Станьте пліч-о-пліч з Псами Війни!"
downfall.200.c:0 "Гангдоги падуть!"
downfall.200.e:0 "Собаки нас не зупинять!"
downfall.200.f:0 "Річки Колорадо течуть криваво-червоними..."

#Lanius (Id's 210-219)##
downfall.210.t:0 "Провал Ланія"
downfall.210.d:0 "Після кровопролитних боїв надійшли звіти з Червоного Сонця, що війська [Root.GetNameDef] захопили Castra Sol Rubrum — штаб Легіонера Ланія. Чи сталося це в відкритому бою, чи через партизанщину, чи він вчинив як М'ясник з Нової Мексики — ще невідомо.\n\nВідомо одне: східна частина міста захоплена, легіонери розстріляні під час втечі, а вцілілі страчені за боягузтво при поверненні до лінії фронту."
downfall.210.a:0 "§RЯ не стану ще одним Паулюсом!§"
downfall.210.b:0 "Поразка..."
downfall.210.c:0 "Виштовхнемо його за Ріо-Гранде!"
downfall.210.e:0 "Вони більше не повернуться!"
downfall.210.f:0 "З одного завойовника — до іншого?"

##Texan BOS (Id's 220-229)##

downfall.220.t:0 "Падіння Далласа"
downfall.220.d:0 "[TBH.GetNameDef], одна з найбільших сил у Техасі, сьогодні втратила свою столицю — Даллас, захоплений силами [Root.GetNameDef]. Повідомляють, що [TBH.GetLeader] особисто воював на вулицях міста перед відступом.\n\nУ міру відходу Братства Рейдери посилили напади на каравани та поселення, а Братство більше не може реагувати. Чи зможе [TBH.GetNameDef] відновитися, чи Техас перейде до нової сили?"
downfall.220.a:0 "Смерть краще ганьби. Ad Victoriam!"
downfall.220.b:0 "Союз вистоїть до останнього!"
downfall.220.c:0 "Техас буде нашим!"
downfall.220.e:0 "Техас зламається!"
downfall.220.f:0 "Що буде з Техасом?"

##Gente (Id's 230-239)##

downfall.230.t:0 "Занепад Хенте дель Соль"
downfall.230.d:0 "Сили Хенте дель Соль підтвердили відступ з Хенте-Сіті після запеклих боїв.\n\nКажуть, що генерали більше переймалися жінками та власною безпекою, ніж захистом.\n\n[GDH.GetLeader] спробував виправити це, озброївши більше людей, але цього навряд чи буде достатньо, бо [Root.GetNameDef] продовжує плюндрувати землі."
downfall.230.a:0 "Нісенітниця! Мої люди не знають слова «здача»!"
downfall.230.b:0 "...Але ми можемо навчитись!"
downfall.230.c:0 "Їхня зброя скоро буде нашою!"
downfall.230.e:0 "Сподіваюсь, нам залишиться, що «звільняти»"
downfall.230.f:0 "А де ж ми тепер дістанемо зброю?"

##Ironmongers (Id's 240-249)##

downfall.240.t:0 "Останній Снаряд"
downfall.240.d:0 "Залишки армії Аттіса боролися з моменту поразки від Братства, і тепер одна з найбільших її частин — Залізники — повторила долю лідера. Внаслідок боїв з [Root.GetNameDef] втрачено «Ковальню Велетнів». Їхні танки знищені, захоплені або залишені іржавіти на уламках."
downfall.240.a:0 "Військові машини рушать знову!"
downfall.240.b:0 "Вони ще «подякують» нам за перемогу!"
downfall.240.c:0 "Танки їм не допоможуть!"
downfall.240.e:0 "Наш спільний натиск розчавить їх!"
downfall.240.f:0 "Кров супермутантів залила техаську землю..."

##Shales Army (Id's 250-259)##

downfall.250.t:0 "Невдалий Спадкоємець"
downfall.250.d:0 "Ще одна частина армії Аттіса зазнала поразки. [SHA.GetNameDef] сильно відтіснені [Root.GetNameDef], з втраченою базою у Форт-Стоктоні.\n\nВони кликали на допомогу сусідніх мутантів, але більшість відмовили. Історія повторюється."
downfall.250.a:0 "Ми не повторимо долю Аттіса!"
downfall.250.b:0 "Ми не кинемо наших союзників!"
downfall.250.c:0 "Їх буде «роздроблено»!"
downfall.250.e:0 "Наш спільний натиск розчавить їх!"
downfall.250.f:0 "Кров супермутантів залила техаську землю..."

##Unity of Austin (Id's 260-269 (nice))##

downfall.260.t:0 "Падіння Єдності"
downfall.260.d:0 "Наступники армії Аттіса, [UOA.GetNameDef], зазнають нищівної поразки від [Root.GetNameDef]. Їхню столицю, Остін, захоплено.\n\n[UOA.GetLeader] кличе на допомогу Техаський Економічний Союз, але бюрократія може все зіпсувати."
downfall.260.a:0 "Ми не можемо зазнати поразки вдруге!"
downfall.260.b:0 "Ми стоїмо як союз, і впадемо разом!"
downfall.260.c:0 "Остін буде нашим"
downfall.260.e:0 "Наш спільний натиск розчавить їх!"
downfall.260.f:0 "Кров супермутантів залила техаську землю..."
##Twin Mothers (Id's 270-279 )##

downfall.270.t:0 "Падіння Племені Близнючок"
downfall.270.d:0 "Плем'я Близнючих Матерів зазнало нищівної поразки від [Root.GetNameDef]. Їхні воїни билися відважно, але були змушені відступити. Діана дивиться здалеку, в її душі палає лють. Вона обіцяє собі повернутись... Але чи вдасться їй?"
downfall.270.a:0 "§MМій народ! Мої діти!§"
downfall.270.b:0 "Ми підтримаємо Діану!"
downfall.270.c:0 "Жодне плем'я не втече від нас"
downfall.270.e:0 "Геть Відьму!"
downfall.270.f:0 "Що це означає для Колорадо?"

##Last Patrol (Id's 280-289 )##

downfall.280.t:0 "Падіння Нацгвардії"
downfall.280.d:0 "З Оклахоми надходять тривожні вісті: столицю [TLP.GetNameDef] захоплено. Сили [Root.GetNameDef] завдали важких втрат варті, і тепер вони відступають до останніх ліній оборони, які можуть не витримати."
downfall.280.a:0 "У вогонь, у полум'я!"
downfall.280.b:0 "Ми не дамо впасти нашим Оклахо-друзям!"
downfall.280.c:0 "Треба було відпустити минуле."
downfall.280.e:0 "Вони впадуть!"
