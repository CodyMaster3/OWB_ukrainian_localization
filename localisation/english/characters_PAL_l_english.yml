l_english:
    PAL_LEWIS_BRADLEY_NAME:0 "Льюїс Бредлі"
    PAL_LEWIS_BRADLEY_DESC:0 "Бредлі був одним з багатьох молодих людей з Пустки, яким набридло цілими днями сидіти за браміном. На відміну від багатьох з них, коли він покинув ферму, він приєднався до банди рейдерів і піднявся по кар'єрних сходах. Кілька років тому він захопив владу і переконав свою банду, що замість того, щоб переслідувати каравани, вони повинні захопити золоті копальні північної Невади.\n\nПід час правління Бредлі, зграя Елко стала силою, з якою треба рахуватися. Вона більше не була загрозою для караванів, а загрозою для цілих громад. Більша частина північної Невади платить за його «захист», а работоргівці Легіону знаходять на його землях готовий ринок збуту. Тепер Бредлі планує захопити Сховище, навіть побоюючись повідомлень про те, що Вісімдесятники прокинулися під проводом пророка, який поведе їх додому"