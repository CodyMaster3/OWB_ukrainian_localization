l_english:
NIT_origins_focus:0 "Справжні Люди"
NIT_origins_focus_desc:0 "Ніітсітапі, «Справжні Люди» — так ми називаємо себе. Наші витоки сягають далеко до Великої Війни, ще до виникнення Америки..."

NIT_reservation_focus:0 "Спогади про Резервації"
NIT_reservation_focus_desc:0 "Колись Ніітсітапі підписали договори, яких не до кінця розуміли, віддавши свої землі тим, хто проголосив себе їхніми власниками, і нас змусили жити в резерваціях. Але цей великий злочин залишив по собі одну користь..."

NIT_oldgun_focus:0 "Пригоди Джеремі Олдґана"
NIT_oldgun_focus_desc:0 "Багато років тому молодий мисливець із племені Ніітсітапі вирушив із гір досліджувати землі Монтани. Пригоди Джеремі Олдґана стали легендою серед людей Монтани, особливо його протистояння з компанією Зак..."

NIT_sun_focus:0 "Дарунки Натосі"
NIT_sun_focus_desc:0 "«Наш народ шанує традицію, що Натосі — сонце — було створене Апістотоке, Творцем, щоб давати тепло і світло всьому живому. Навіть тут, у холодних горах, ми навчилися використовувати тепло Натосі, аби вижити»."

NIT_past_focus:0 "Вчимося з Минулого"
NIT_past_focus_desc:0 "«Пустка — це суворе й дике місце, позбавлене того, що американці вважали цивілізацією. Але нашим предкам вона ніколи не була потрібна, як і їхній спосіб життя. Пора озирнутись назад, аби знайти шлях уперед у власній історії» – Ранковий Олень"

NIT_sacred_waters_focus:0 "Охоронці Священних Річок"
NIT_sacred_waters_focus_desc:0 "«Вода — джерело життя й наш найсвятіший ресурс. Згідно з нашими легендами, саме вона відрізняє сіксікайцітапі від інших людей. Але після Великої Війни духи річок набули нових, дивовижних форм...»"

NIT_future_focus:0 "Плануємо Майбутнє"
NIT_future_focus_desc:0 "«Клани надто переймаються минулим. Якщо я щось і зрозумів із подорожей, то це те, що вічне чіпляння за минуле — це не шлях уперед. Я не дозволю моєму народу застрягнути в Застарілих Мріях» – Вождь Джеремі Олдґан"

NIT_essence_focus:0 "Іцсіпайтапійопа"
NIT_essence_focus_desc:0 "«Іцсіпайтапійопа, Суть Усього Живого — це світло Творця, розлите по всьому створеному. Через нього всі рівні: люди, тварини, рослини — кожен має свою силу і призначення. Навіть у пустці ми маємо пам’ятати про це...»"

NIT_mountain_focus:0 "Вигнані до Скелястих Гір"
NIT_mountain_focus_desc:0 "«Скелясті гори не були нашими традиційними землями. Ми — народ рівнин, і ходили цими перевалами лише між полюваннями чи щоб перезимувати. Життя тут на постійній основі — це суворе випробування, але це єдине, що в нас залишилося. І ми боротимемось за це до кінця, зробивши гори нашим новим домом.»"

NIT_visions_focus:0 "Повернення Візійних Подорожей"
NIT_visions_focus_desc:0 "«Візійні Подорожі були виснажливими ще до того, як світ став пусткою. Старші хлопці проводили дні в пості та молитві в дикій природі — тепер із ризиком зустріти яо-ґая — щоби побачити видіння свого майбутнього. Якщо поверталися, їх приймали й готували до наступного кроку — вступу до Товариства.»"

NIT_sun_dance_focus:0 "Окан"
NIT_sun_dance_focus_desc:0 "«Окан, або Церемонія Медичної Хатини — одне з наших найсвятіших дійств. Ми збираємось із далеких куточків наших земель, щоби звернути молитви до Творця, поки чоловіки годинами танцюють навколо центрального стовпа. Благословення, просимо протягом року, повертаються символічною жертвою, а наш народ наповнюється рішучістю пережити наступний рік.»"

NIT_societies_focus:0 "Відновлення Товариств"
NIT_societies_focus_desc:0 "«Товариства — це давній спосіб організації нашого народу, що об'єднував усі клани та нації. Майже кожен хлопець, який проходив свою Візійну Подорож, вступав до товариства, і кожні чотири роки піднімався вище, передаючи подарунки тим, хто займав його місце. До дорослого віку всі чоловіки в товаристві ставали братами. Відновлення товариств допоможе нам згуртувати молодь і зміцнити дух єдності.»"

NIT_sweat_lodge_focus:0 "Будуймо Більше Парових Хатин"
NIT_sweat_lodge_focus_desc:0 "«Парова Хатина — це і будівля, і церемонія, під час якої людина чи група проходить ритуальне очищення, витримуючи високу температуру, іноді з молитвами чи співами. Це зцілення для тіла й духу. Ми маємо відродити цю практику там, де її забуто.»"

NIT_medicine_focus:0 "Природна Медицина"
NIT_medicine_focus_desc:0 "«Під Іцсіпайтапійопа всі речі мають призначення. Для багатьох рослин — це лікування. Ми не лише зберегли багато лікувальних рослин, які використовувались протягом століть, а й ретельно задокументували властивості нових мутованих рослин Пустки та їх можливе застосування.»"

NIT_wolfskin_focus:0 "Мисливці у Вовчій Шкурі"
NIT_wolfskin_focus_desc:0 "«Чесно кажучи, я не впевнений, чи ця практика справді була нашою. Ледве знайшов згадки про неї в старих книгах, а усна традиція загублена. Але Ранковий Олень настільки захопився старою картиною, яка, за його словами, зображує наших людей, що я просто не зміг його зупинити.»"

NIT_black_water_focus:0 "Пиття Чорної Води"
NIT_black_water_focus_desc:0 "«Хоч ми всі знаємо історію про чорну воду, яка зробила нас тими, ким ми є, багато хто став вважати її міфом. Але поблизу місця цієї давньої легенди клан зробив неймовірне відкриття — печеру зі дивними рослинами, де тече чорна вода. Ті, хто її п'є, змінюються: іноді на краще, іноді на гірше. Чи це дар Творця, чи ще одна помилка старого світу?»"

NIT_passkeepers_focus:0 "Друзі в Перевалі"
NIT_passkeepers_focus_desc:0 "«Велике лихо спіткало людей на узбережжі. Божевільний “Безсмертний” зламав і поневолив мешканців, і тепер прагне підкорити увесь регіон. Ми знайшли втікачів з воїнського загону, який утік від цього жаху, і допомогли їм дістатись до безпечних гір. Можливо, коли настане час, вони допоможуть і нам.»"

NIT_dogs_focus:0 "Вірні Імітаа"
NIT_dogs_focus_desc:0 "«Такі гарні хлопчики! Наші Імітаа майже не мутували тут у горах, залишившись вірними супутниками. Вони — єдині тварини, яких ми змогли зберегти з нашого давнього способу життя, і здається, вони це знають, настільки тісно вони тримаються біля нас.»"

NIT_bison_focus:0 "Скорбота за Ініікссіі"
NIT_bison_focus_desc:0 "«Втрата Ініікссіі — бізона — тяжко тисне нам на серце. Більшість нашого способу життя будувалася навколо нього, і ми були змушені пристосовуватись — спочатку до резервацій, а потім до пустки без нього. Це було нелегко для нашого народу, тому ми й скорботимо за найбільшим даром Творця, аби згодом змогти рухатись далі.»"

NIT_counting_coup_focus:0 "Повернення Практики Коуп"
NIT_counting_coup_focus_desc:0 "«Ко́уп — це доторкнутись до ворога на полі бою, не вбивши його, і повернутись неушкодженим. Це нелегка справа, але саме вона дає право розповідати про свої подвиги. Я це зробив, і вірю, що кожен Нііццітапі — чоловік або жінка, достатньо хоробра, щоб взяти до рук зброю — має для цього силу!»"

NIT_rangers_focus:0 "Паркові Рейнджери"
NIT_rangers_focus_desc:0 "«На півдні здавна існує великий парк — сад, захищений від жахів війни Парковими Рейнджерами. Подейкують, що там досі живуть тварини, які зникли зі світу. Але ніхто з воїнів не перевіряв це місце з часів приходу Перших Родин до Міссули та прибуття Американського Уряду...»"

NIT_travois_focus:0 "Перевезення за допомогою Травуа"
NIT_travois_focus_desc:0 "«Травуа — метод транспортування, що використовує дві довгі палиці, з'єднані опорою для перевезення вантажу. Він може здатись дивним тим, хто звик до коліс, але на зруйнованих дорогах пустки та в густих травах прерій наші травуа знову стали в пригоді, допомагаючи рухати клани у мирі та війні.»"

NIT_tipi_focus:0 "Ніітоой-їсс"
NIT_tipi_focus_desc:0 "«Зазвичай відомий як “Тіпі” серед не-Сіксікайцітапі, Ніітоой-їсс — це проста форма тимчасового житла, яку можна швидко зібрати й розібрати. Ідеально підходить для кочових мисливців та воєнних загонів.»"

NIT_nomad_soul_focus:0 "Душа Кочівника"
NIT_nomad_soul_focus_desc:0 "«Без Ініікссіі багато хто думав, що осілий спосіб життя, нав'язаний резерваціями, стане постійним. Але ми знаємо краще. У наших серцях завжди жила жага мандрувати й відкривати світ, як колись. Навіть коли ми сіємо й будуємо міста, ми ніколи не відпустимо кочовий дух нашого народу — завжди мандрувати, завжди шукати новий обрій.»"

NIT_destroy_macarthur_focus:0 "Відбити Американців!"
NIT_destroy_macarthur_focus_desc:0 "«Занадто довго американці відтісняли нас на резервації, забираючи все більше і більше! І ми чули розповіді мандрівників про “Анклав” — найгіршу форму американського імперіалізму з усіх. Ми не можемо чекати, поки вони нас знищать. Ми повинні напасти першими!»"

NIT_bad_business_focus:0 "Поганий Бізнес"
NIT_bad_business_focus_desc:0 "«Роботи-обслуговувачі з Middlemark лише нещодавно дістались до наших кордонів, і спочатку це виглядало як хороша можливість для торгівлі. Але машини зациклені лише на прибутках давно мертвого підприємства, живуть тими ж принципами, які знищили світ. Було б краще, якби ми взяли Калґарі під контроль і перепрограмували їх на щось справді корисне, а не жадібне.»"

NIT_corporate_removal_focus:0 "Позбавлення Впливу Корпорації"
NIT_corporate_removal_focus_desc:0 "«Вплив Middlemark глибоко вкорінився в Калґарі: багато мешканців досі вірні автоматизованій системі, що керувала цим місцем, інші — настільки довго були поневолені, що забули, як жити вільно. Щоб очистити регіон від найгірших елементів, знадобиться час, але ми з часом покажемо їм кращий шлях.»"

NIT_horsies_focus:0 "Повернення Коней"
NIT_horsies_focus_desc:0 ""Колись, у давні часи, коней в Америці винищили до вимирання. Коли прийшли колонізатори, вони знову привезли коней, і з часом ми знайшли їх — і зробили своїми. Велика Війна знову відібрала їх у нас. Але ходять чутки про імперію верхи на конях десь на півночі, про нескінченний табун. Я завершу свій шлях до звання воєнного вождя, повторивши минуле — й повернувши їх до нас!""

NIT_new_guns_focus:0 "Нові Гвинтівки"
NIT_new_guns_focus_desc:0 ""Навіть Старий Ствол може навчитися новим трюкам. Що? Поганий жарт? Ех, що ті діти розуміють. Але все ж, наші воїни здобули чимало американської зброї в сутичках із ними, що дало нам добру нагоду вивчити її й покращити власну.""

NIT_our_land_focus:0 "Наша Земля"
NIT_our_land_focus_desc:0 ""Минуло майже 300 років, але ми нарешті почали повертати наші традиційні землі в уряду Америки. І хай котиться геть.""

NIT_native_friendship_focus:0 "Наші Найдавніші Сусіди"
NIT_native_friendship_focus_desc:0 ""Ніцітапі рідко мали друзів чи союзників — ані до війни, ані навіть до приходу поселенців зі сходу. Наші відносини з іншими корінними народами справді почали розквітати лише тоді, коли ми мусили разом протистояти утискам. І з поверненням американського уряду час знову зібрати перші нації разом.""

NIT_winter_lodges_focus:0 "Зимові Оселі"
NIT_winter_lodges_focus_desc:0 ""Не думайте, що якщо народ кочовий — він не вміє будувати постійні домівки. Навіть Ніцітапі потребують місця, де можна сховатися під час лютої зими, коли полювання мізерне, а рівнини стогнуть від вітру. Зимові оселі завжди були нашою опорою — заховані серед дерев та гір.""

NIT_psyker_focus:0 "Новий Вид Шаманів"
NIT_psyker_focus_desc:0 ""Стародавні обряди допомагають відновити здоров’я та духовну рівновагу нашого народу. Поєднавши їх із сучасним розумінням медицини, ми значно підвищили шанси на успішне споживання Чорної Води.""

NIT_decide_focus:0 "Доля Ніцітапі"
NIT_decide_focus_desc:0 ""Довгий час привид Америки нависав над нашим народом. Але тепер, коли їх вигнано з Монтани, настав час вирішити нашу майбутню долю.""

NIT_bison_return_focus:0 "Повернення Інійксії"
NIT_bison_return_focus_desc:0 ""Ми чули чутки, але боялися вірити — боялися, що фальшива надія змусить нас марно блукати. Але це правда — у долинах Єллоустоуну ще живе Інійксі, і табуни бізонів досі кочують рівнинами та лісами. Настав час повернути їх на наші землі — будь-якою ціною.""

NIT_faction_focus:0 "Перша Конфедерація"
NIT_faction_focus_desc:0 ""Ніколи не було «Чорножокої конфедерації». Ніцітапі були єдині у культурі та способі життя, але формальна конфедерація їм ніколи не була потрібна. Та тепер, коли ми дивимося в майбутнє, час знайти справжніх союзників і підписати з ними угоду на рівних — без помилок минулого.""

NIT_war_focus:0 "Повернення Нашого Спадку"
NIT_war_focus_desc:0 ""Пустка — не місце для миру. Принаймні не такого, що не був здобутий кров’ю. Ці рівнини колись були нашим домом. І настав час повернути їх під наш контроль!""

NIT_peace_focus:0 "Мир на Рівнинах"
NIT_peace_focus_desc:0 ""Нарешті ця епоха конфлікту добігає кінця...""

NIT_wardens_focus:0 "Навчаючись у Інших"
NIT_wardens_focus_desc:0 ""Ніцітапі мають довгу історію воїнів, але не завжди переможців. Коли з’являлись нові народи та технології, ми змушені були вчитись, аби вижити. Колишні Вартові, Лісники, навіть уцілілі з війни із компанією Зак — усі вони серед нас. І в усіх них можна знайти мудрість.""

NIT_war_bands_focus:0 "Чорні Бонети"
NIT_war_bands_focus_desc:0 ""Колись у давнину великі воїни й духовні провідники носили Бонети з орлиних пір’їн. Деякі з них збереглись, як безцінні реліквії, але орлів тепер майже не лишилось. Тож Спікери навчилися задобрювати розумного крука — приносити йому ласощі та дрібнички в обмін на пір’я. З них створюються нові Бонети — символ витривалості та кмітливості. І наші найсильніші воїни носитимуть їх із честю.""

NIT_rock_hard_focus:0 "Між Скелею і..."
NIT_rock_hard_focus_desc:0 ""Американські сили на півдні, рейдери й роботи на півночі, і Скелясті гори на заході. Нам нікуди рости, поки хоча б одного з них не приберемо! Але це не дикі звірі чи дрібні грабіжники — це броньовані машини й люди, яких не зупинять звичайні гвинтівки. Потрібна нова зброя, якщо хочемо вибратись із цієї пастки!" - Ранковий Олень"

NIT_liberty_focus:0 "Брехня Свободи"
NIT_liberty_focus_desc:0 ""Культ поруч продовжує славити забуту "Америку", наче це священна істота. Яка ж це сліпа дурість! Америка померла — і настав час навчити цих дурнів справжній історії цієї землі." - Ранковий Олень"

nf_nit.1.t:0 "«Справжні Люди»"
nf_nit.1.d:0 "«Нііцітапі. Справжні Люди. Навіть наше ім’я говорить про нашу історію — перші, хто ступив на цю землю. У давні часи, ще до того, як бомби спопелили світ, до утворення Америки, до того, як нога білого чоловіка ступила на цей континент, ми кочували рівнинами Монтан та Альберти. Життя мисливців-кочівників, землеробство на пагорбах, війна з сусідами. Інші вважали наше життя простим і наївним, та ми процвітали, і наші духи були вірні. Народи рівнин та гір боялися нашої сили й єдності, і укладали з нами договори заради миру.\n\nАле ніщо не триває вічно, і з часом прийшла «Цивілізація», що витіснила нас з наших предковічних земель.»"
nf_nit.1.a:0 "«Та ми ніколи не забули і ніколи не здалися.»"

nf_nit.2.t:0 "Спогади про Резервації"
nf_nit.2.d:0 "«Коли перші дослідники дісталися наших земель, ми зрозуміли, що втрачаємо нашу перевагу. Вони принесли з собою рушниці, інструменти і, найголовніше — кількість. Було багато битв, і багато трагедій спіткало наш народ від рук “американців”. Канадці прийшли й запропонували нам угоди — за умови, що ми віддамо наші землі. Наші предки не знали, чим поступаються, і незабаром були загнані в резервації, де жили в злиднях та забутті.\n\nТа резервації принесли одну рятівну річ.\n\nМи були настільки далекими та “незначущими”, що Китай, земля за Великим Західним Морем, навіть не став нас бомбити. Нас оминули жахи вогню й радіації, які знищили решту — і завдяки цьому у нас з’явився шанс відродитися.»"
nf_nit.2.a:0 "«Почалася нова епоха Нііцітапі.»"

nf_nit.3.t:0 "Пригоди Вождя Джеремі Олдґана"
nf_nit.3.d:0 "«Сто вісімдесят років потому, біда знову прийшла на наші землі. Компанія Зака, що постала з залишків міліції, почала тероризувати, пригнічувати і знущатися з людей Монтани. Вони вимагали все, що хотіли, і погрожували тим, хто не погоджувався — звичайні рейдери, що прикидаються найманцями. І врешті вони дісталися Браунінга, аби скривдити наше плем’я. Я встав проти них. Я боровся... Багато загинуло в тій боротьбі. То не була слава — і можливо, ми відповіли надто жорстоко — але я виконав свій обов’язок перед народом, і ми вижили. Компанія Зака теж вижила. А тепер з півдня повертаються старі американці, й обидва вороги заздрісно дивляться на наші землі.\n\nНас чекають важкі часи, маленькі мої. Але не бійтеся.»"
nf_nit.3.a:0 "«Бо ми — не самі.»"

nf_nit.4.t:0 "Другий Ковток Чорної Води"
nf_nit.4.d:0 "«Це знайшли кочові клани — глибоко в печері, біля священної Гори Вождя. Там ростуть дивні темні рослини навколо повільної, масної річки чорної води. Ті, хто її п’є... змінюються.»\n\nОлдґан обережно ступав за своїм провідником, бо скелі були слизькі, а роки брали своє. Але таке відкриття він ігнорувати не міг.\n\n«Кажуть, це як випробування. Хоробрі, хто наважиться випити, хворіють і впадають у глибокий сон. А коли прокидаються — буває одне з двох. Ті, хто “пройшов”, ніби розширюють свідомість. Вивчають мови за дні. Розуміють чужинця ще до того, як вивчать його слова — просто “відчуваючи намір”. І навпаки — чужинці розуміють їх. Але найдивніше — це працює і на тварин. Це не читання думок, але коли гавкає пес або фиркає рад-олень — вони розуміють. І тварини, здається, розуміють їх.»"
nf_nit.4.a:0 "Далі"

nf_nit.4000.t:0 "Другий Ковток Чорної Води (Продовження)"
nf_nit.4000.d:0 "Двоє спустилися донизу. Попереду текла вода — густа, повільна. Уздовж стін та стелі чорні виноградні лози вирощували крихітні сяйливі бруньки.\n\n«А решта? Ті, хто не прокинувся з даром?»\n«Коли вони прокидаються, вони втрачають мову. Не можуть говорити, не розуміють слів. Не вміють читати й писати. Як ми не пробували — навчити їх знову неможливо. Лише “Говоруни” можуть їх розуміти. Один був такий пригнічений, що випив воду вдруге. І більше не прокинувся.»\n\nОлдґан завмер у здивуванні, але стримав подих. Чи це втручання “Маніфеста”? FEV? Радіація? А може — дар від Напі? Він не знав. Але знав одне — треба діяти. Інші клани вже чули про воду й хотіли її скуштувати. Треба було виступити з позицією, зараз.\n\n«Гаразд. Хоробрі можуть пити. Але їх треба попередити. І перш ніж наважитись — знайти “Говоруна”, що говоритиме за них, якщо вони втратять мову. Ця вода — небезпечна. Але можливо, вона — наш ключ у майбутнє.»"
nf_nit.4000.a:0 "«Нехай вона об’єднає світ, як колись давно.»"

nf_nit.5.t:0 "«Навчаючись з минулого...»"
nf_nit.5.d:0 "«Пустка — дивне місце, зовсім не схоже на спокійні поселення довоєнних часів. Більшість людей намагається якомога швидше повернутись до осілого життя, важко пристосовуючись до дикого світу. Але наша усна традиція зберегла історії про те, як ми колись жили як кочівники. Деякі з цих звичаїв не підходять для гір, але уроки самозабезпечення можуть стати у пригоді в Пустці.»\n\n«Можливо, для стороннього це звучить дивно, але ми знову повертаємось до луків. Колись вогнепальна зброя поставила під загрозу нашу перевагу в регіоні, й повернення до «примітивної» зброї видається дивним, але в горах патронів обмаль. А ті дурні, що привернули цілі зграї диких гулів тріском пострілу, тепер мають що сказати з цього приводу. Вождь Олдґан клянеться своїм пістолетом, але я думаю, що повернення стрільби з лука піде нашому народу на користь.»"
nf_nit.5.a:0 "«Та й луки просто крутіші.»"

nf_nit.6.t:0 "«...Щоб побудувати нове майбутнє»"
nf_nit.6.d:0 "«Морнінґ Стаґ говорить про минуле з таким сяйвом в очах, але, здається, забуває, що нам ніколи не повернутись туди. Майбутнє — хоч і невизначене — це те, про що ми маємо думати заради нашого народу. Я побачив достатньо війни за життя, але поки залишки Америки й компанія Закка живі, наш народ не в безпеці. Ми маємо готуватись до їхнього повернення та шукати союзників, що допоможуть нам пережити бурю. А як ми з ними впораємось, питаєш? Ну...»"
nf_nit.6.a:0 "«Коли настане час, ми будемо готові вирушити з гір.»"
nf_nit.6.b:0 "«Коли вони нападуть, каньйони стануть для них неприступною пасткою.»"

nf_nit.7.t:0 "Вартові на півночі"
nf_nit.7.d:0 "«Нещодавно, з приходом страшного воєначальника, західне узбережжя впало під тиранію. Одне з витіснених угруповань — «Вартові Білини» — розпалося на дрібні загони, втративши своїх лідерів. Кілька років тому одна з груп дісталася наших земель, і ми надали їм допомогу, яка дозволила вижити й рушити далі на північ. Тепер, коли вони облаштувались у гірських проходах, вони лишаються вдячними за нашу підтримку. Можливо, колись вони віддячать нам.»"
nf_nit.7.a:0 "«Дехто з них навіть залишився допомагати нам.»"

nf_nit.8.t:0 "Рейнджери на півдні"
nf_nit.8.d:0 "«Паркові рейнджери на півдні здавна є друзями Нііцітапі, підтримуючи мир у Скелястих горах з часів падіння бомб. До того, як я став вождем, я провів із ними не одну пригоду, і між нами виникли узи дружби, що тривали десятиліттями. Але тепер у них важкі часи. Із поверненням так званої Енклейв на базу Макартура зв’язок з ними ускладнився. Подейкують, що Перший Еколог загинув від рук культистів, намагаючись зберегти мир в Айдахо, і тепер керівництво перейшло до недосвідчених рук. Можливо, час відновити нашу дружбу — поки ще не пізно.»"
nf_nit.8.a:0 "«Будемо сподіватися, що ще не пізно...»"
nf_nit.8.b:0 "«Ми могли б запропонувати взаємний захист — про всяк випадок.»"

nf_nit.9.t:0 "Єдність Серед Перших Народів"
nf_nit.9.d:0 "«Канадці й американці мали багато суперечностей, але в питанні корінних народів вони діяли дивно злагоджено; креслили кордони й укладали договори, аби роз’єднати нас та відібрати наше. Правду кажучи, наші стосунки з сусідами не завжди були добрими — войовниче минуле принесло чимало ворожнечі, але ми завжди були готові укладати мир, коли війна заходила надто далеко. Хоч ми й дуже різні, нас об’єднує боротьба за право жити на власній землі своїм шляхом. Час поховати старі образи й перетворити давніх суперників на нових друзів — щоб таке більше не повторилось.»"
nf_nit.9.a:0 "«Ми надішлемо своїх посланців, щоб здобути їхню підтримку!»"

nf_nit.10.t:0 "Велика Пригода Морнінґ Стаґа"
nf_nit.10.d:0 "«Коли сонце зависло низько над горизонтом, Морнінґ Стаґ дивився вдалечінь на свою ціль. Це не мала бути ще одна з історій його діда — не байка про минулі подвиги чи життєвий урок. Настав час залишити власний слід, відновити честь Нііцітапі. Століттями ми жили без коней, і більшість вважала їх вимерлими, але Морнінґ Стаґ знав краще. На землях Великого Стада ще бродили дикі табуни, і щоб довести, що він гідний звання воєнного вождя, він мав викрасти отару. Родини Ґрейстейбл мали сотні коней — їм не стане шкода кількох десятків, якщо це поверне Нііцітапі їхню кінноту.»"
nf_nit.10.a:0 "Морнінґ Стаґ, як і годиться імені, повернеться до світанку."

nf_nit.11.t:0 "Світло Натосі"
nf_nit.11.d:0 "Згідно з легендами нашого народу, Натосі, сонце, створила все на небі й землі. А може, це був Апістотоке, Творець? Чи, можливо, Напі, Старий Чоловік? Вони були родиною, чи всі однією сутністю? Правду сказати, у кожного народу є своя історія створення світу, і навіть після всіх цих років я сам плутаюся в них. Правда в тому, що велика частина нашої історії втрачена, стерта часом. Але важливо те, що цей світ був даром. Апістотоке дав нам імена, Напі подарував мову, а Натосі дарує тепло. Навчитися жити в горах було важко, але й це — дарунок, шанс для нашого народу вижити в цьому зламаному світі. І тепер я дарую тобі спадщину нашого народу. Прислухайся до цих уроків — і ти виростеш достатньо сильним, щоби вижити в пустці."
nf_nit.11.a:0 "Наскільки б безлюдним не було місце, все, до чого сягає світло Натосі — наш дім."

nf_nit.12.t:0 "Суть Усього"
nf_nit.12.d:0 "Сідайте, діти, і слухайте. Я знаю, це довге слово, але Іцціпайтапійопа може бути нашою найважливішою цінністю, бо це — суть усього. Воно означає, що всі живі істоти рівні. Наші сусіди вірять, що людина стоїть над світом і має право чинити з ним як забажає, але ми завжди знали краще. Таке мислення й знищило старий світ. Ви повинні навчитися приймати цінність кожної істоти і кожної рослини. Усі створіння мають свої сили, і всі допомагають зберігати баланс у світі. У пустці це правда як ніколи, і лише пристосувавшись до життя в цьому новому світі, наш народ зміг вижити."
nf_nit.12.a:0 "Одного дня і ти знайдеш свої сили."

nf_nit.13.t:0 "Життя Без Бізона"
nf_nit.13.d:0 "Ініксії, бізон, був найвеличнішою твариною в житті наших предків протягом тисяч років. Вони давали нам їжу, одяг, інструменти й багато іншого — нічого не йшло на марно. Але з часом їхні стада зменшилися через американське надмірне полювання, а коли настала Велика Війна — опади знищили ті стада, які ми зберігали. Правда, що до того моменту наша культура вже деякий час не покладалася на бізонів, але рана нашої гордості досі не загоїлась. А зі знищенням світу ми залишилися без змоги покладатися ні на старі звичаї, ні на ті нові, які нам нав’язували."
nf_nit.13.a:0 "Та ходять чутки, що вони досі живуть десь у пустці..."

nf_nit.14.t:0 "Доля Ніітсітапі"
nf_nit.14.d:0 "Хоча він і не хотів, щоби все дійшло до цього, Старий З Рушницею завжди в глибині душі знав — це неминуче. Залишки американського уряду, так званий «Анклав» на півдні, були знищені. Знати, що їх більше немає, й що Ніітсітапі нарешті можуть знайти спокій — мало б бути полегшенням. Але тепер, коли Родини переможені, у Монтані виник вакуум влади, за який доведеться відповісти. І він уже знав одного з тих, хто спробує це зробити.\n\n\"Ти знаєш, що наш час настав, Наа! Наші воїни рвуться в бій, і я зібрав для нас справді могутню армію. Це наша мить — повернути собі рівнини й нарешті відвоювати те, що було вкрадено в нас століття тому!\"\n\n\"Ти надто спраглий до війни, Ранковий Олень. Загроза минула, як і минуле. Якщо ти думаєш, що лінії на мапі важливіші за життя нашого народу — ти вже мислиш, як вони. Ми не жили там багато років. Хіба наш новий дім тебе не влаштовує?\"\n\nРанковий Олень походжав по кімнаті, намагаючись стримати своє роздратування\n\n\"Колись ми були воїнами! Ти був воїном! Що сталося з легендарним героєм, яким ти був, дідусю? Де твоя гордість за нашу спадщину?\"\n\n\"Я навчився, що справжній герой — це той, хто захищає свій народ, а не шукає слави у війні. Це урок, який молодь не змогла успадкувати, попри всі мої зусилля.\"\n\nВін зітхнув, і на мить запанувала тиша\n\n\"Я знаю, ти хочеш довести свою силу, як і інші воїни. Але запам’ятай мої слова...\""
nf_nit.14.a:0 "Не буде більше війни, доки я ще живий."
nf_nit.14.b:0 "Якщо ти підеш цим шляхом, я не поведу тебе ним."

nf_nit.15.t:0 "Схід Промовців"
nf_nit.15.d:0 "Минуло багато років відтоді, як Чорні Води були знову відкриті, й досягнення були нічим іншим, як чудом. Старий З Рушницею ніколи не полишав своїх сумнівів, але результат був беззаперечним. Строгі ритуали й традиції готували розуми людей, а науковий поступ відкривав все більші успіхи. Хоча й були ті, хто не витримував випробування Чорної Води й втрачав голос, симптоми стали менш важкими, і Промовців стало так багато, що їх було все легше повертати до громади. Діти, народжені від Промовців, здавалися здатними схоплювати мову швидше за інших, і по всій пустці ширилася чутка. Дехто стверджував, що вони пробудили здатність говорити з духами, й багато хто прагнув стати шаманом.\n\nСтарий З Рушницею не міг не задуматися, яким буде майбутнє. Невже колись усі стануть Промовцями? А що, як вони утворять замкнуту касту й намагатимуться зберегти владу? Поки він при владі — не буде тиранії, але думки про майбутнє його народу не полишали його. Одне було певне: на краще чи на гірше, епоха Промовців настала."
nf_nit.15.a:0 "Я досі вважаю, що це мутація, але всьому є своє місце."

nf_nit.16.t:0 "Повернення Ініксії"
nf_nit.16.d:0 "Ранковий Олень завжди зберігав надію, але навіть він не міг уявити справжніх масштабів. Смерть бізонів була значно перебільшена, і зрештою, від Анвіла до Вайтгорса стада все ще блукали пусткою, а популяція в парку збереглася майже без мутацій. Тепер, після годин болісних переговорів, він нарешті вів стадо з тисячі голів, що прямувало через гори назад до земель Ніітсітапі, де вони зможуть відновитися й знову заселити прерії. Але століття їхньої відсутності залишили народ у нерішучості — що тепер з ними робити? І, як завжди, тягар рішення ліг на Старого З Рушницею."
nf_nit.16.a:0 "Збережімо Ініксії як священну тварину. Ми повинні їх захистити."
nf_nit.16.b:0 "Заново навчімося використовувати Ініксії у щоденному житті й відновімо традицію!"

nf_nit.17.t:0 "Ніітсітапі Пропонують Взаємний Захист"
nf_nit.17.d:0 "Побоюючись агресії Макартура, Ніітсітапі надіслали послів із пропозицією пакту взаємної оборони. Вони висловили лише одне побажання: якщо настане найгірше, вони хотіли б повернути частину своїх племінних земель. Історія тісної співпраці з їхнім лідером, легендарним Мандрівником «Старим З Рушницею», зробила Рейнджерів щасливими прийняти цю пропозицію — але остаточне рішення за Морською Цитаделлю."
nf_nit.17.a:0 "Разом ми в безпеці!"

nf_nit.18.t:0 "Великий Мир Ніітсітапі"
nf_nit.18.d:0 "З остаточним вигнанням американців, Ніітсітапі нарешті відчули наближення справжнього миру. Завдяки Промовцям, Ніітсітапі стали осередком дискусій та торгівлі в регіоні. Зі стабілізацією Монтани, здавалось, конфлікти в регіоні вщухали, і будь-які майбутні війни мали прийти ззовні. Старий З Рушницею спокійно відпочивав, знаючи, що майбутнє його народу нарешті у безпеці. Він негайно надіслав послання до Ранкового Оленя.\n\"Радий тебе бачити, Наа. Ти щось хотів?\"\n\"Так. Прийшов час, Ранковий Олень. Я знаю, це більше формальність, але я завтра оголошую про відставку. Думаю, стану оповідачем для малечі.\"\nВін запалив люльку, коли його онук підійшов ближче\n\"Ти впевнений? У тобі ще є сила, а людям потрібна стабільність. Ти завжди вмів тримати нації разом, а я... я не впевнений, що готовий керувати в часи миру. Я...\"\nВін вагався\n\"Я не думаю, що зможу коли-небудь замінити тебе. Як мені бути на рівні з легендарним Старим З Рушницею?\"\nСтарий З Рушницею поклав руку на плече Ранкового Оленя й повів його до вікна зимової домівки, вказуючи на прерії.\n\"Ранковий Олень, подивися на те, чого ти досяг. Ти став справжнім Військовим Вождем, заслуживши все своїми вчинками. Це ти допоміг повернути Ініксії, повернув коней, допоміг вести наш народ проти американських нападів. Ми мали суперечки, і я досі хвилююся за твій характер, але ти не припиняєш мене вражати останніми роками. Ти довів, що ти — воїн, і створив власну легенду. А тепер, я вірю, ти доведеш, що можеш бути лідером у мирі. Ти готовий.\"\nРанковий Олень рідко виявляв емоції, але не стримався й обійняв дідуся.\n\"Дякую, Наа. Я зроблю все, щоби ти мною пишався.\""
nf_nit.18.a:0 "Ти вже змусив мене пишатися."

nf_nit.19.t:0 "Угода Ніітсітапі Щодо Земель"
nf_nit.19.d:0 "Хоч Ніітсітапі й справедливо остерігаються експлуатаційної природи встановлення кордонів і «нарізання землі», як це було в старих угодах, що призвели до резервацій, питання того, хто адмініструє які території, є так само актуальним у пустці. Щоб уникнути прогалин у нагляді й забезпечити справедливий доступ до колишніх територій Макартура, було складено теоретичний договір. Згідно з ним, південні території, включно з Бозменом і самою авіабазою Макартур, будуть передані Єллоустоуну, а також Ельк-Бенд — для створення буфера між Ніітсітапі й «надміру ревними місіонерами» з Heaven's Gate. Усі ж північні території повернуться Ніітсітапі, включаючи гору Павелл та її долину. Крім того, Єллоустоун співпрацюватиме з Ніітсітапі у відновленні бізонів за межами Парку. А також буде підписано пакт взаємної оборони від усіх потенційних загроз у майбутньому. Екологічне агентство застерігає, що Brotherhood of Steel навряд чи буде задоволений будь-яким варіантом, де Єллоустоун не перейде під їхній контроль. Замість цього ми можемо запропонувати Ніітсітапі всі землі Макартура, під умову, що ми не втручатимемося у справи Монтани, забезпечуючи власну безпеку, але залишаючи їх наодинці з Brotherhood."
nf_nit.19.a:0 "Ми вдячні їм за допомогу, але не можемо обіцяти більшого."
nf_nit.19.b:0 "Які ми друзі, якщо покинемо їх зараз?"

nf_nit.20.t:0 "Води На Горі"
nf_nit.20.d:0 "Вода завжди була дивною річчю для Ніітсітапі. Життєво необхідна для всього живого, ми п’ємо з річок і поливаємо наші поля, але уникаємо робити щось більше. У давнину наші предки навіть не хотіли сідати в човни, бо боялися темних духів, що жили під поверхнею води. Ця забобонність почала зникати, коли нас загнали в резервації, але знову повернулася, коли духів річок і озер замінили Майрелурки та Лейкелурки.\n\nАле попри нашу неохоту подорожувати по воді, вона також є для нас священною, а ріки — під нашою опікою. Одна з наших найдавніших історій розповідає, що колись усе людство говорило однією мовою, поки Напі, Старий Чоловік, не запросив усі народи на Гору Вождя, щоби напитися води всіх кольорів. Коли всі напилися, вони були збентежені — почали говорити різними мовами. Лише сіксікайцітапі, які пили чорну воду, зберегли мову, якою говорили й раніше. Принаймні, так говорить легенда.\n\nДжеремі на мить зупинив розповідь, щоб подумати. Він завжди сумнівався в цій історії, але останнім часом ширилися чутки, що один з кланів знайшов Чорні Води в печері на півночі. Можливо, в цій історії було більше правди, ніж він колись вважав?"
nf_nit.20.a:0 "Можливо, час перевірити ці чутки"

nf_nit.21.t:0 "Ніітсітапі Надсилають Посланців!"
nf_nit.21.d:0 "Ніітсітапі надіслали послів, щоби відновити наші давні узи дружби!"
nf_nit.21.a:0 "Добре чути, нам зараз не завадять справжні друзі"

nf_nit.22.t:0 "Крадій Коней!"
nf_nit.22.d:0 "Минулої ночі злодій пробрався на один із наших ранчо та вкрав 40 коней! Це стільки ж, скільки чотири десятки!"
nf_nit.22.a:0 "Це жахливо!"

