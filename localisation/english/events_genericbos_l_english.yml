l_english:
nf_genericbos.1.t:0 "Наше Заснування"
nf_genericbos.1.d:0 "Хоча Високий Старійшина Максон був засновником Братства в цілому, кожен розділ мав своїх власних першопрохідців — тих, хто поширював ідею небезпеки технологій у Пустці. Хто був нашими засновниками?"
nf_genericbos.1.d.mxc:0 "У 2231 році Джеремі Максон — лідер Західного Братства Сталі — вирішив розширити операції Братства на схід, щоб дослідити регіон Колорадо та допомогти Середньозахідному Розділу біля Сховища Нуль. Він відправив експедицію з п’яти паладинів, аби підтвердити місцезнаходження чуток про бункер, збудований сенатором США Тоддом Петерсоном. Лідер експедиції, Андреа Брикслі, виявила бункер, знешкодила його охорону та відкрила для заселення. Протягом понад десяти років вона та її товариші паладини досліджували схід та налагоджували стосунки з племенами в регіоні.\nУ 2242 році Джеремі Максон перейменував бункер на честь свого знаменитого предка — Роджера Максона. Він надіслав туди повний загін для окупації. Андреа Брикслі була підвищена до звання Старійшини, отримала ранг Генерала та очолила операції. Решта її дослідницької групи також отримала титул Старійшин.\nСеред оригінальної п’ятірки засновників розділу Максона, яка група відігравала найвагомішу роль?"
nf_genericbos.1.a:0 "Наші засновники були писарями"
nf_genericbos.1.b:0 "Наші засновники були паладинами"

nf_genericbos.2.t:0 "Наш Перехідний Період"
nf_genericbos.2.d:0 "Кожен розділ Братства має свої пріоритети. Деякі зосереджуються на збиранні потужної зброї Старого Світу, інші — на промисловому обладнанні та інструментах. На чому ми були зосереджені?"
nf_genericbos.2.d.mxc:0 "Невдовзі після цього розпочались бої між розділом Максона та відродженими Гангдогами — племенем рейдерів з Денвера, яке себе називає мешканцями “Міста Псів”.\nВійна тривала роками й на початку складалась на користь Братства Максона. Проте, хоч би скільки Гангдогів полягло під нашою перевагою у технологіях, нові вояки ставали на їхнє місце. У Братства, елітарної організації, не було такого резерву. Стало очевидно, що ми приречені програти через перевагу ворога в чисельності. Мораль у бункері падала, й у підсумку нижчі чини почали дезертирувати.\nЛише своєчасне прибуття рейдерів "Жало Скорпіона" з півдня врятувало розділ Максона від повного знищення. За кілька десятиліть після тієї кризи ми змогли відновитись і навчитись на своїх помилках. На чому ми зосередились у цей перехідний період?"
nf_genericbos.2.a:0 "Ми зосередились на промисловому устаткуванні"
nf_genericbos.2.b:0 "Ми зосередились на озброєнні"

nf_genericbos.3.t:0 "Наше Майбутнє"
nf_genericbos.3.d:0 "Ми здобули багато знань у роках, що вже позаду. Тепер настав час використати цей досвід і підготуватись до того, що чекає попереду."
nf_genericbos.3.a:0 "Ми будемо більше виробляти самі"
nf_genericbos.3.b:0 "Ми будемо більше добувати з Пустки"

