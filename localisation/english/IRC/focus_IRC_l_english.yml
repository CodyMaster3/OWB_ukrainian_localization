l_english:
    irc_lost_souls_in_a_blizzard:0 "Загублені душі, прив’язані до хуртовини"
    irc_lost_souls_in_a_blizzard_desc:0 "У Канаді було надто багато воюючих сил – місця для нас більше не залишилось. Вони перемогли – загнали нас на межу можливого. Тепер ми – лише привиди."

    irc_howling_wolf_will_find_a_way:0 "Виюча Вовчиця знайде шлях"
    irc_howling_wolf_will_find_a_way_desc:0 "Час надії давно минув. Багряна Завірюха вирізала з нас усе, що залишалося від відчаю. Все, що лишилось – це довге, холодне ніщо.\n\nАле Виюча Вовчиця не здається. Вона не дозволить нігілізму знищити себе. Вона знайде вихід або загине в спробі."

    irc_the_tipis:0 "Тіпі"
    irc_the_tipis_desc:0 "Тут майже немає шкур. Тіпі зроблені з пошарпаних американських армійських тентів та плоті безформних, безіменних звірів.\n\nУ цій жорстокій реальності ми маємо продовжувати боротися за тепло."

    irc_empty_flesh:0 "Порожня плоть"
    irc_empty_flesh_desc:0 "Єдині істоти, що мешкають так глибоко в Багряній Завірюсі – це Тіньожери, жалюгідні залишки невдалих експериментів МАНІФЕСТ Північ, які ще тримаються за життя.\n\nНаші люди рухаються із прадавнім змістом – але без мети. Вони обробляють порожню плоть на їжу й житло, лишаючи нас знесиленими та недоїденими. Ця плоть рятує нас від голоду, але саме риба з льодових озер дійсно дає сили. Ми не можемо так далі жити."

    irc_the_ones_we_lost:0 "Пам’ятаймо про загиблих"
    irc_the_ones_we_lost_desc:0 "Мисливець іде в ліс, сподіваючись принести додому їжу й вижити у кривавому морозному повітрі. Він не повертається. Всі знають, де він – у тому проклятому місці, МАНІФЕСТ Північ. Якщо йому пощастить, він більше ніколи не з’явиться. Якщо ні – його плоть, як і плоть інших, стане паливом для нового покоління Тіньожерів."

    irc_our_identities:0 "Наші Ідентичності"
    irc_our_identities_desc:0 "Коли ти вічно у хуртовині – навіщо імена? У [IRC.Capital.GetName] племена вже не мають значення, окрім як у спогадах. Для більшості ми – лише дурні, що чіпляються за мертві мрії.\n\nМи не можемо повернути втрачену історію. Але можемо створити нові історії. Нам лише потрібен шлях."

    irc_pursue_lost_children:0 "Пошук зниклих дітей"
    irc_pursue_lost_children_desc:0 "Барварські вельможі з Плезантдейла завдали нам чимало зла, викравши наших найкращих і наймолодших уночі для своїх мерзотних програм. Як би жахливо це не звучало, вони ще живі, хай і змінені. Виюча Вовчиця поверне тих, кого зможе."

    irc_newfound_scavenging_cultures:0 "Історія збирання повторюється"
    irc_newfound_scavenging_cultures_desc:0 "Наші предки збирали ягоди й ресурси землі, щоб вижити. Ми збираємо металобрухт і плавимо його, щоб зігрітись."

    irc_fighting_for_our_lives:0 "Боротьба за життя"
    irc_fighting_for_our_lives_desc:0 "Тіньожери – не легка здобич. Вони різняться за розміром, характером і сприйняттям. Кожен унікальний, але всіх єднає одне – агресія. Наші мисливці мусять носити силову броню, щоби їх не розірвали кігті чи не роз’їла кислота."

    irc_ice_fishing:0 "Ловля риби з-під льоду"
    irc_ice_fishing_desc:0 "Протягом століть наш народ здобував рибу з-під льоду. Завдяки допомозі інуїтів ми відродили ці навички й тепер краще годуємо своїх людей."

    irc_manifest_junkyards:0 "Сміттєзвалища МАНІФЕСТ'у"
    irc_manifest_junkyards_desc:0 "МАНІФЕСТ залишив багато смітників із минулим спорядженням. Ми можемо використати їх для ремонту зброї, броні – і, з удачею, укриттів."

    irc_salvaging_from_fallen_hunters:0 "Порятунок із полеглих мисливців"
    irc_salvaging_from_fallen_hunters_desc:0 "Багато мисливців не виживають після сутички з Тіньожерами. Їхні тіла потрібно забрати після того, як тварину доставлено додому – ми не можемо дозволити їм згнити самотньо в завірюсі. Інакше вони стануть їжею для чудовиськ."

    irc_matters_of_medicine:0 "Питання медицини"
    irc_matters_of_medicine_desc:0 "Хоч у нас і є значні запаси хімії, ми в основному покладаємось на природні ліки. Типові інгредієнти знайти важко, але в одному Тіньожери варті чогось – їхня унікальна біологія. Оскільки кожен із них різний, їх нестабільна маса часом містить лікувальні властивості. У цьому нам пощастило."

    irc_our_friends_south:0 "Наші друзі на півдні"
    irc_our_friends_south_desc:0 "Метіси – наші союзники вже протягом століть. Навіть зараз ми залишаємося друзями, хоч і маємо різні випробування. Відновлення контактів було б чудовим початком."

    irc_i_remember_burned_tongue:0 "Я пам’ятаю Палений Язик"
    irc_i_remember_burned_tongue_desc:0 "Коли Канадський Народний Фронт намагався роздерти нас і зліпити в слухняних громадян, Палений Язик лишився непохитним. Хоча він був не один, саме його словами об'єдналися десятки Крі, Оджібве та Накода у пост-ядерному світі – і розпочали багаторічну війну проти КНФ, що розірвала націю навпіл. Його дії дозволили нам вижити, коли світ знову вирішив, що для нас у ньому немає місця."

    irc_the_old_names:0 "Не забувай старі імена"
    irc_the_old_names_desc:0 "У серцях нашого народу живе гірка ненависть – така, що не зникає від добрих справ чи щасливих спогадів. Наша історія – це історія насильства та втрат, те, чого намагались уникнути Пойнтмейкер і Біг Бір. Ця ненависть, можливо, ніколи не зникне, адже вона сформувала нас так само, як і земля, де ми жили. Вона стала незмінною, бо якщо ми її втратимо – забудемо, що було, й станемо задоволеними тим, що від нас хочуть."

    irc_wuttunees_legacy:0 "Спадок Ваттуні"
    irc_wuttunees_legacy_desc:0 "Вождь Ваттуні виступив проти тиранії уряду США там, де уряд Канади зазнав поразки. Саме завдяки його діям, навіть двісті років по тому, ми досі маємо високоякісне спорядження. Ми маємо вшанувати його пам’ять, забезпечивши його подальше використання."

    irc_refurbished_plant:0 "Стара нафтопереробка"
    irc_refurbished_plant_desc:0 "Наші мисливці нещодавно зачистили від Тіньожерів нафтопереробний завод біля одного зі сміттєзвалищ МАНІФЕСТ'у, де під товстим шаром інею збереглось чимало обладнання. Якщо трохи попрацювати, можливо, ми зможемо запустити його знову – й втілити мрію про виробництво."

    irc_new_age_braves:0 "Воєни Нової Доби"
    irc_new_age_braves_desc:0 "З оновленою силовою бронею ми можемо екіпірувати нове покоління мисливців та воїнів."

    irc_metis_artisans:0 "Майстри з-поміж Метісів"
    irc_metis_artisans_desc:0 "Обмінюючись ремісничими техніками між нашими народами, ми приносимо процвітання обом сторонам."

    irc_renewed_allegiance:0 "Відновлення союзу"
    irc_renewed_allegiance_desc:0 "Як Біг Бір і Пойнтмейкер стояли разом із Луї Ріелем, так і ми знову станемо пліч-о-пліч із Метісами. Світ міг відкинути нас, але вони приймуть нас з відкритими обіймами."

    irc_shared_buff:0 "Згадуючи Луї Ріеля"
    irc_shared_buff_desc:0 "Луї був душею, що відгукувалась нашій. Разом ми сильніші, і разом наше щастя зростає."

    irc_finding_the_little_treasures_facility:0 "Знайти об’єкт «Маленькі Скарби»"
    irc_finding_the_little_treasures_facility_desc:0 "Лабораторія «Маленькі Скарби» названа під виглядом любові, але насправді була крилом з промивання мізків, створеним для формування ідеальних захисників дворян з Плезантдейлу. Забрали надто багатьох з наших – перетворили на те, чим вони не були, руки людей, що не мали на це права. Якщо ми знайдемо їхні записи, ми знайдемо ідентифікатори Фейрі.\n\nВони ще можуть повернутись додому."

    irc_search_and_rescue:0 "Пошук і порятунок"
    irc_search_and_rescue_desc:0 "Фейрі з Плезантдейлу зберегли незначні спогади. Хоч їхні голоси ослаблено, дитячий розум ще живий – і дитина ніколи не забуде материнську любов. Завдяки записам із «Маленьких Скарбів» ми можемо повернути кожну Фейрі туди, звідки її забрали."

    irc_faerie_tactics:0 "Тактика Фейрі"
    irc_faerie_tactics_desc:0 "Фейрі, хоч і діти в душі, у бою безжальні та винятково здібні. Вчитися в них – процес незвичний, але їхня темна, майже наукова точність може стати нам у пригоді під час визволення."

    irc_repurpose_little_treasures:0 "Переобладнати «Маленькі Скарби»"
    irc_repurpose_little_treasures_desc:0 "«Маленькі Скарби» були потужним об’єктом, яким колись керувала сама НАДІЯ. Хоч нам байдуже до родички американського привида, деякі з нас вірять, що цей об’єкт можна використати на благо. Можливо, ми можемо посіяти добро там, де було лише зло?"

    irc_destinys_eyrie:0 "Це не її земля"
    irc_destinys_eyrie_desc:0 "Занадто довго ми схиляли голови перед Долі, аби тільки вижити на землі, що колись була нашою. Ми втомились віддавати своє духам американської винятковості.\n\nНаша історія не закінчиться тут."

    irc_gathering_survivors:0 "Збір виживших"
    irc_gathering_survivors_desc:0 "Навіть зараз десятки людей тримаються у таборах МАНІФЕСТ Північ. Невинні – з Манітоби, Пакосеймавіну, Електоралів чи навіть забутих резервацій – увесь цей час були тут. Хоч багато з них не в стані допомогти одразу, чимало готові підтримати наші справи. Незважаючи на страждання, для Виючої Вовчиці це знак, що світло ще лишається в темряві."

    irc_the_fate_of_manifest_north:0 "Доля МАНІФЕСТ Північ"
    irc_the_fate_of_manifest_north_desc:0 "МАНІФЕСТ Північ проводив жахливі експерименти понад двісті років. У його залах ще зберігається потужне обладнання, яке можна використати нам на користь. Але цей об’єкт був місцем страшних злочинів, особливо проти нас. Чи правильно буде перетворити його на силу добра? Або краще знищити й поховати разом із його жахами?"

    irc_vision_quests:0 "Пошуки Видінь"
    irc_vision_quests_desc:0 "Це було рішення Вождя Громовика – заборонити юнакам вирушати на пошуки видінь. Тіньожери, хуртовини та загони Долі зробили ці подорожі надто небезпечними. Але з новим керівництвом Виючої Вовчиці все змінюється. Тепер, коли ми віднайшли себе, наші хлопці знову можуть стати чоловіками – як і має бути."

    irc_snowshoes:0 "Старі снігоступи"
    irc_snowshoes_desc:0 "Колись наші предки використовували шнуровані снігоступи, щоби краще долати хуртовини. Не кожен може носити велетенську силову броню, і така взувачка значно покращить якість життя. Це просте рішення, яке навіть допоможе деяким старійшинам впоратись із важкими умовами."

    irc_no_more_surviving:0 "Більше не просто виживання"
    irc_no_more_surviving_desc:0 "Все життя ми лише «виживали». Ми й самі почали вірити, що ми просто виживальники в нескінченній завірюсі. Але Виюча Вовчиця з цим покінчила – бо виживання припускає слабкість, а ми її знову втрачаємо. Ми багато втратили, та знову рухаємось уперед. Якими б не були наступні загрози – Доля чи ще щось – ми не просто виживемо. Ми вистоїмо. Бо ми – незаперечні."

    irc_dammed_no_longer:0 "Більше не Прокляті"
    irc_dammed_no_longer_desc:0 "Прокляті – це спільнота рейдерів та поселенців під проводом дивного чоловіка на ім’я Грістл. Вони забороняли нам наближатись до греблі, позбавляючи нас електрики та ресурсів. Вони зневажали нас у нашій скруті. То чому ми маємо з ними церемонитись?"

    irc_hunting_stations:0 "Мисливські Пункти"
    irc_hunting_stations_desc:0 "Надто багато загинуло в завірюсі. Ми маємо створити надійні табори для наших мисливців, щоби ті мали безпечне місце, коли знаходяться далеко від дому."

    irc_pathfinders:0 "Досвідчені Мисливці"
    irc_pathfinders_desc:0 "Наші найстійкіші мисливці навчилися рухатись крізь хуртовини як привиди – полюючи на Тіньожерів і уникаючи загони Долі з неймовірною вправністю."

    irc_the_first_rad_moose:0 "Перший Радлосяк за багато років"
    irc_the_first_rad_moose_desc:0 "Після років харчування лише Тіньожерами легко забути смак справжнього м’яса. Хоч Радлосяк і вже не просто лось, його поява – справжня розрада. Це не продукт якоїсь фабрики, а щось справжнє. Люди знову почали усміхатись."

    irc_spectral_cabal:0 "Послідовники Фенріра"
    irc_spectral_cabal_desc:0 "Забобонні мешканці Електоралу шанують вовчого бога на ім’я Фенрір. Його походження сумнівне – ймовірно, пов’язане з MANIFEST, але їхні практики на диво нешкідливі. Можливо, ми могли б прийняти їх до себе?"

    irc_ending_manifests_legacy:0 "Кінець спадку МАНІФЕСТ"
    irc_ending_manifests_legacy_desc:0 "Жахіття МАНІФЕСТ'у охопили весь регіон, але їхня головна фортеця – це МАНІФЕСТ Північ. Тепер, коли він у наших руках, ми ніколи не дозволимо повторити ті злочини. Привид американської винятковості мертвий, а ми несемо його тіло."

    irc_sun_dancing:0 "Сонячний Танок"
    irc_sun_dancing_desc:0 "Після падіння Долі Виюча Вовчиця побачила щось надзвичайне: на третій день, як у залі МАНІФЕСТ згасло світло, її народ із надією у серці почав готувати Сонячний Танок – перший, який вона пам’ятає. Наші пісні здіймались у повітря, мов птахи, святкуючи нове покоління та його випробування."

    irc_the_dark_woods:0 "До Темнолісся"
    irc_the_dark_woods_desc:0 "Хоч ми знову радіємо, залишились уламки влади Долі. Посмішку Джек і Заражений Ліс ще живі. Щоб покласти край цьому жаху, ми маємо назавжди спинити Посмішку Джека."

    irc_ending_the_experiments:0 "Кінець програмі Фейрі"
    irc_ending_the_experiments_desc:0 "Електорали зробили все, щоби використати нас, коли ми були слабкими. Тепер, коли ми піднялись, ми повинні запобігти їхній помсті: ніколи більше вони не заберуть наших дітей. \n\nБо якщо не ми, то хто?"

    irc_restoring_the_woods:0 "Життя повертається до Гудзонової затоки"
    irc_restoring_the_woods_desc:0 "Хоч минуле вже не повернути, після загибелі Посмішки Джека морозоболотні знову пішли у воду. Радлосяки та інші істоти повертаються, і ліс знову стає зеленим, а не кривавим."

    irc_memory_of_poundmaker:0 "Пойнтмейкер стояв за нас"
    irc_memory_of_poundmaker_desc:0 "Ми віддаємо шану Ваттуні та Опаленому Язикові, але наші старійшини пам’ятають інших героїв – обличчя з давніх часів, яких не зберегли записи. Пойнтмейкер, Біг Бір, Дух Мандрів – їхні імена живуть у казках дітей, як герої коміксів. Вони стояли, щоб Ваттуні міг йти. Тепер наш час – бігти."

    irc_build_construct:0 "Ми з Землі, і Вона в Нас"
    irc_build_construct_desc:0 "Як кажуть старі легенди, ми – з Землі, і тому маємо знати її так само добре, як і вона пізнає нас. Наші воїни знають цю землю, як ніхто інший, і тому ми – незламні, незаперечні."

    irc_coring_dam:0 "Гребля, Захищена"
    irc_coring_dam_desc:0 "Тепер, коли гребля під нашим контролем, ми можемо спрямувати її силу й ресурси на благо народу. Наші діти більше не знатимуть холоду чи голоду. Наші воїни не терпітимуть нестачі. Ми – останні з нашого роду, і зробимо все, аби його зберегти – як і герої минулого."

    irc_mercenaries_must_die:0 "Найманці мусять загинути"
    irc_mercenaries_must_die_desc:0 "Людям наживи не місце в уряді – ні тут, ні деінде. Вони пригнічують, шантажують і грабують місцевих, і зробили б те саме з нами. До того ж, вони підтримують Королівство Манітоба. Вони мають щезнути. Ми не терпітимемо тих, хто підміняє одного тирана іншим."

    irc_recognized:0 "Спадщина Виючої Вовчиці"
    irc_recognized_desc:0 "Виховуючи своїх дітей, Виюча Вовчиця часто згадувала батька – його вибір втекти від боротьби, загубитись у мертвій землі без дарів. Вона любила його, але замислювалась: що скажуть її діти, якби вона обрала ту саму покору перед Долею? Вона обрала боротьбу – і в цій боротьбі знайшла істину."

    irc_the_land_of_kings:0 "Нам Вистачить Британського Правління"
    irc_the_land_of_kings_desc:0 "Королівство Манітоба засноване на чужих перемогах. Це Опалений Язик дав Ґанну змогу підняти бунт. Це він відкрив шлях для корони. Якби він бачив це – перевернувся б у могилі. Хто сидить на троні – не важливо. Важливо, щоби спадок Опаленого Язика не зник. Ми проспіваємо його – крізь вогонь і меч."

    irc_welcome_new_warriors:0 "Привітаймо Нових Воїнів"
    irc_welcome_new_warriors_desc:0 "Під час наших мандрів до нас приєднались воїни з різних племен – від Ньюфаундленду до Ванкувера. Вони прагнуть лише братерства, і ми приймемо їх як своїх. Ми – притулок для знедолених."

    irc_wont_somebody_tell_me:0 "Згадаймо Другу Залізну Конфедерацію"
    irc_wont_somebody_tell_me_desc:0 "Перша Залізна Конфедерація виникла з потреби захисту. Друга – теж. Ми зберігаємо культури, які світ покинув на погибель. Ми втратили багато, але виросли. Ми не повернемо минуле, але передамо те, що лишилося – і допоможемо молоді створити нове."

    irc_renovations_are_needed:0 "Найбільш Заслужені Перетворення"
    irc_renovations_are_needed_desc:0 "Доля прагнула нас знищити, але ми вистояли – так, як снили наші предки. Об’єднана міць наших племен вистояла час. Настав час приготувати землю – для нового покоління."

    irc_battleford:0 "Нікчемні Блазні"
    irc_battleford_desc:0 "Принц Альберт та люди з Батлфорду зберігають наші історичні землі. Там, де колись боролись герої, тепер – бандити та колишні солдати Манітоби. Це не може залишитись безкарним."

    irc_cab_vultures:0 "Останній Заїзд Мотор-Сімей"
    irc_cab_vultures_desc:0 "Стерв’ятники Кеба – суперечливе братство. Вони митці, рейдери, злочинці – але вони билися пліч-о-пліч із Опаленим Язиком. Їх знищили Сім’ї Зграї, та Мадвіллан, кажуть, ще досі їздить північчю. Можливо, не він, але він – надія відродити старих союзників."

    irc_cab_vultures_release:0 "Нехай Вони Знову Їдуть!"
    irc_cab_vultures_release_desc:0 "Стерв’ятники Кеба – митці, рейдери, злочинці… але колись вони билися за нас. Хоч їх майже знищили, ходять чутки, що один, на ім’я Мадвіллан, ще їздить на півночі. Хто б він не був, ми можемо використати це, щоб знову зібрати наших союзників."

    irc_renewed_belief:0 "Епоха Відродження"
    irc_renewed_belief_desc:0 "Після життя в буревії навіть крихта тепла здається чудом. Наші люди сміються, співають, танцюють. Воїни стоять гордо, як ніколи. Ми – сильні. І ми це заслужили."

    irc_powwow:0 "Пов-Вов на Пам’ять Про Наші Страждання"
    irc_powwow_desc:0 "У часи слави легко забути, ким ми були – звідки прийшли, хто помер, аби ми дійшли сюди. Багато загинуло. Важливо пам’ятати: аби наші діти знали, за що ми боремось."

    irc_birch_bark:0 "Мазінібаґанджіґан"
    irc_birch_bark_desc:0 "Тепер, коли ми покинули Алая Завірюха, наші люди знову почали знімати кору з дерев, перетворюючи її на прекрасне мистецтво. Як і колись, нові історії вирізьблюються поруч зі старими, у тихій подяці дереву за цей дар."

    irc_kanata:0 "Каната"
    irc_kanata_desc:0 "Корінь слова 'Канада' походить з ірокезької мови – означаючи село, поселення тощо. \n\nФКН, Зграя і всі інші боролись проти кожної нашої спроби заявити про себе – після століть боротьби. Але ми пережили британців, французів, ядерну катастрофу і цих дрібних тиранів. І з радістю переживемо інших. \n\nМожливо, з часом, Каната стане нашою – як мала би бути."