l_english:
nf_irc.1.t:0 "Вождь Вуттуні проти Сполучених Штатів"
    nf_irc.1.d:0 "Понад двісті років тому Сполучені Штати почали ворожу окупацію Канади. Хоча значна частина канадського спротиву згасла протягом перших років, Перші Нації не здалися так легко. Багато корінних вождів піднялися проти американських загарбників – їм не хотілося знову переглядати вже й так хиткі угоди з черговим несправедливим гігантом.\n\nСеред них був Вождь Вуттуні, який вистежив та оточив майже весь броньований підрозділ генерала армії США Бафорда Райта десь між Едмонтоном та Лак-ла-Біш – підрозділ, призначений для використання проти індіанського населення Канади. Жоден солдат тоді не загинув – їм лише відібрали зброю й техніку – однак уряд перекрутив цю подію й представив її як початок довгого ряду кровопролитних конфліктів між Першими Націями та США на теренах Альберти й Саскачевану. Проте, зважаючи на те, що Велика Війна вирувала по всьому світу, уряд мав обмежені ресурси для ще однієї наступальної кампанії – що дало можливість вождю Вуттуні й іншим вождям проводити ще більше таких операцій.\n\nЗрештою, вождя Вуттуні було схоплено й страчено за його вчинки, але техніка з того підрозділу та інших досі лишається в нашому володінні. Вона служить як наш захист і як нагадування про те, за що він боровся. Яку спадщину ми цінуємо найбільше?"
    nf_irc.1.a:0 "Силова броня."
    nf_irc.1.b:0 "Техніка."
    nf_irc.1.c:0 "Озброєння."
    
    nf_irc.2.t:0 "Навіть Після Смерті – Ми Чужі На Своїй Землі"
    nf_irc.2.d:0 "Навіть після того, як ядерний пил осів, свобода від довоєнного уряду мало що змінила для корінного населення Канади. Підйом Канадського Народного Фронту ознаменував вимогу до Півночі до повного підпорядкування – підпорядкування, проти якого Перші Нації боролися сотні років. Проте з початком ядерної війни боротьба відійшла від багатьох душ, які вже були втомлені та зламані. Їм пообіцяли поступки – але й ці обіцянки, як завжди, не виконали. Ще одне покоління брехні для вождів. Ще одне покоління зруйнованих мрій.\n\nЗрештою, Канадський Народний Фронт почав розпадатися, відкриваючи нові можливості. Але, на жаль, жодна з них не дісталась корінним народам Канади – через підступну політику та жадібність. На цих уламках виросли нові гнобителі: Королівство Манітоба, Електорат і ще багато інших. Хоч метиси й знайшли дім під «пильним» оком Короля Ґанна, інші зовсім не прагнули відродження Британської імперії – так почалась нова війна за незалежність."
    nf_irc.2.a:0 "Цикл продовжився."
    irc_the_last_ride_of_chief_wuttunee:0 "Останній Похід Вождя Вуттуні"
    irc_the_last_ride_of_chief_wuttunee_desc:0 "Саме завдяки планам вождя Вуттуні ми пережили Велику Війну та ядерний апокаліпсис. Його вчинки залишили нам броню та зброю, які ми зберігаємо вже поколіннями."

    nf_irc.3.t:0 "Загублені, Переслідувані Порожніми Спогадами"
    nf_irc.3.d:0 "Спроби здобути незалежність у багатствах Канади зазнавали невдачі раз за разом. А коли й не зазнавали, то індіанців обманювали або використовували як пішаків у чужих іграх. Зрештою, їх загнали в неможливе місце – дім, куди ніхто не дістанеться.\n\nПро Багрову Завірюху казали, що це місце поза життям. І в чомусь це правда. Та навіть перед обличчям певної смерті в них вистачило духу залишитися собою. Попри це, вони несуть на собі шрами двохсотрічного бездомного життя – надто багато історій померло разом зі старійшинами через злочини КНФ, Електорату й Королівства. Через це їхні племінні ідентичності починають зникати, попри всі зусилля. Все, що лишилося – самотня Конфедерація, привид минулого, загнана на край виживання егоїстами, які були надто зайняті інтригами, щоб дати хоч трохи надії. Такою є доля канадських індіанців.\n\nТа Виюча Вовчиця не прийняла цього. Вона вірила, попри спротив інших і навіть власного батька, що все ще можна змінити. Їм не судилося жити в багряній заметілі вічно."
    nf_irc.3.a:0 "Виюча Вовчиця часто мріяла дістатися місяця."

    nf_irc.4.t:0 "Їх Називали Феями"
    nf_irc.4.d:0 "Максвелл Чейз обіцяв нам місце, вільне від турбот цього світу. Місце, де ми могли б жити як справжні ми – без жодних обмежень. У той час, до зростання населення Плезантдейлу, ми не знали, що саме він мав на увазі. Якби ми знали, яким насправді стане це місто, ми б ніколи не погодилися.\n\nМи вирішили жити за межами міста, на північ. Там здавалося тихо, первозданно. Ми помилилися. Наші діти почали хворіти на недугу, якої ми ще ніколи не бачили. Невдовзі після цього до нас прийшов мутант-лікар з Вакаву, дізнався про наше лихо, жахнувся – і пообіцяв донести свої дослідження до Максвелла негайно.\n\nЙого відповіддю стала програма "Фей". Вночі вони приходили забирати дітей – наших і жителів Плезантдейлу, хоч в першу чергу саме наших. Тепер майже третина покоління блукає тим проклятим містом як його "захисники".\n\nТа феї пам’ятають, навіть якщо це приглушено. Ми можемо повернути їх додому. Так не має бути."
    nf_irc.4.a:0 "Ми більше не залишимо їх позаду."

    nf_irc.5.t:0 "Метиси"
    nf_irc.5.d:0 "Метиси довгі роки були надійними союзниками багатьох наших племен. Хоча колись вони й пішли за Манітобою, нині знову здобули незалежність. Незважаючи на їхні теперішні труднощі, можливо, ми зможемо розпалити старий вогонь дружби й знову налагодити торговельні місії?"
    nf_irc.5.a:0 "У важкі часи приємно мати друзів."

    nf_irc.6.t:0 "Повстання Обпаленого Язика"
    nf_irc.6.d:0 "Колись Канадський Народний Фронт покривав усі Канадські Прерії, ставши темною й пришвидшеною копією довоєнного життя, яку ми, виснажені, не змогли оскаржити на початку. Після початку ядерної війни їм вдалося утвердити майже непохитний контроль на десятиліття – і лише один виступив проти.\n\nВождь Обпалений Язик (названий так, бо солдати КНФ вирвали йому язика) створив нову спільноту в Саскачевані, діючи між Батлфордом і Саскатуном, нападаючи на торгові шляхи, аби зупинити експансію Редмонда. Це було успішним – але вигоду здобули не ми. «Король» Ґанн з Манітоби скористався ситуацією, щоб заснувати власне Королівство за підтримки аристократів КНФ.\n\nЗдобутки Обпаленого Язика відібрали – і його лють лише зросла. Його загін продовжував боротися за незалежність, поки їх не знищила Лідія Донськой із Міністерства. Поки вона жила, її існування надихало Перші Нації. Її смерть – мов цеглина по надії."
    nf_irc.6.a:0 "Після її смерті – лишилась лише помста."

    nf_irc.7.t:0 "Друзі-Союзники – Інуїти"
    nf_irc.7.d:0 "Різні групи інуїтів вирушають у Велику Завірюху в пошуках уламків і для торгівлі. В минулому ми обмінювалися з ними, і це дало новий поштовх завдяки нашій близькості до заметілі. Завдяки їхній доброзичливості ми краще ловимо рибу і полюємо на Морозолазів, що дозволило нам знову отримати належне харчування."
    nf_irc.7.a:0 "У часи потреби приємно мати друзів."

    nf_irc.8.t:0 "Згасаюча Історія"
    nf_irc.8.d:0 "Крі, Накода, Метиси, Гауденосоні – культури з усіх куточків Канадських Прерій і далі, тепер на межі зникнення. Те, що вціліло століттями, нині стирається пустошами та варварськими володарями – і ми програємо. Багато пісень забуто, забрано амбітними підлабузниками, а ми маємо лиш наші табори на спустошеній півночі.\n\nМи все ще тримаємось за свої культури – і правильно. Але втративши так багато, різниці та значення почали зливатися. У нас є імена, але майже без облич. І все ж, ми маємо себе. Ми повинні триматись. Ми не можемо зникнути в безвість.\n\nМи все ще можемо впоратися з цим."
    nf_irc.8.a:0 "Принаймні ми повинні спробувати."

    nf_irc.9.t:0 "Чужинці з-за Містечка"
    nf_irc.9.d:0 "Сьогодні до нашого поселення завітали викривлені люди з МАНІФЕСТ Північ, шукаючи жертву для свого господаря. Вони смерділи неприродним вогнем у кістках і несли із собою зброю війни, але вождь Виюча Вовчиця стояла непохитно й заявила, що підуть вони ні з чим. Вони насміхались, вистреливши тричі в повітря. Сказали, що скоро повернуться.\n\nМи маємо бути готовими."
    nf_irc.9.a:0 "Ми не віддамо більше, ніж уже віддали."

    nf_irc.10.t:0 "Ті, Хто Живе в Цій Завірюсі"
    nf_irc.10.d:0 "§RОн там, друже, є кілька душ, що не в нашій “сфері впливу”, так би мовити. Називають себе якоюсь “Залізною Конфедерацією”. Індіанці зі старого світу, і все таке. Досі вони були щедрі – давали мені все потрібне для експериментів, поки ви не прийшли, але, знаєш… Здається, у них прокинулася совість. А це значить, що моя доброзичливість вичерпується. Чому б нам не надіслати їм послання про те, що я думаю про їхнє нове “усвідомлення”?§!"
    nf_irc.10.a:0 "Історія знову повторюється."

    nf_irc.11.t:0 "Різанина в Пакосейімовін"
    nf_irc.11.d:0 "Багрова Завірюха палала жаром палаючих тіпі, ефірним вогнем заступників американського привида, що випалював будь-який опір. Вони чекали, поки воїни вийдуть битися з Тіньожерами, а тоді, прикриті ніччю та густим снігопадом, ударили по селищу.\n\nВиюча Вовчиця повернулася додому й побачила, як її народ розкиданий у снігах. Лише з допомогою інших мисливців вона змогла зібрати їх докупи в наступні ночі. Без сумніву, заступники Долі й досі шукають відсталих, щоб затягнути їх глибше в хуртовину – в саме серце MANIFEST Північ..."
    nf_irc.11.a:0 "§RВони за це поплатяться.§!"

    nf_irc.12.t:0 "Місцезнаходження Малих Скарбів"
    nf_irc.12.d:0 "Наші воїни знайшли місцезнаходження “Малих Скарбів” – лабораторного крила МАНІФЕСТ Саскачеван. Нам вдалося проникнути туди та здобути записи про кожну фею, створену там – аж до імені при народженні й “фейського” псевдоніма.\n\nМи не можемо зняти з них закляття, але принаймні можемо повернути їх додому – до нас чи куди інде."
    nf_irc.12.a:0 "Навіть після апокаліпсису божевільна наука процвітає."

    nf_irc.13.t:0 "Вигнання Червоного Духа"
    nf_irc.13.d:0 "У Конфедерації завжди були вороги – століттями вони штовхали нас у ярмо гноблення й руїни. Деякі вже зникли з цього світу, інші – недосяжні. Але привид КНФ – ні. Вони виявилися цілком досяжними – і лише тепер були знищені. Це знищення, що давно назрівало, стало святом для одних і очищенням для інших. Для Виючої Вовчиці – чимось із обох.\n\nВона сиділа сама, поки десь поруч палали вогнища, лунали пісні. Надія та полум’я, які вона несла, були виправдані. Хоча ця перемога не вирішить усіх проблем Конфедерації, вона стане важливим знаком для тих, хто стояв на межі відчаю. Особливо вона сподівалася, що це подарує спокій її батькові.\n\nТа досить роздумів. Її народ кличе її до свята – і вона не має наміру залишатися осторонь. Цю ніч пам’ятатимуть доти, доки буде кому пам’ятати. І вона не проведе її в самоті та спогадах."
    nf_irc.13.a:0 "До перемоги!"