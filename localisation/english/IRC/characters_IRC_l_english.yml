l_english:
    IRC_JESEBELLE_NAME:0 "Виюча Вовчиця"
    IRC_JESEBELLE_DESC:0 "Сучасна Залізна Конфедерація – це лише тінь своєї колишньої слави, збірна група духів, відправлених загинути в завірюсі. Між Канадським Народним Фронтом, Електоратом і Королівством її поступово витіснили за десятиліття безперервних конфліктів і зневаги до корінного населення. На відміну від свого батька, Виюча Вовчиця не має жодного бажання схилятись перед привидом американського винятковізму. Вона рішуче налаштована вивести Залізну Конфедерацію у світле майбутнє, де її народ знову буде ситим і гордим."
    IRC_HOWLING_WOLF_ADVISOR_DESC:0 "Виюча Вовчиця усе своє життя присвятила служінню іншим, намагаючись не дати спадщині батька стати спадщиною поразки. Хоч він і жив у втечі, зрікшись спадщини таких постатей, як Великий Ведмідь та Обпалений Язик, навіть завів свій народ у морок завірюхи – вона поставила собі за мету вивести їх із неї.\n\nЗ Божою ласкою, її двоє синів, можливо, виростуть такими ж, як і вона, й зможуть зрозуміти дії свого діда – без відчаю."