l_english:
    irc_without_a_means:0 "Без Засобів"
    irc_without_a_means_desc:0 "У нас є багато старих бойових обладунків, що залишились від уряду США, але майже немає можливостей створювати нові. Протягом понад двох століть ми передавали ці надійні старі комплекти найстійкішим нашим захисникам, але без постійного джерела поповнення ми більше не зможемо цього робити."

    irc_trapped_in_the_blizzard:0 "У Пастці Завірюхи"
    irc_trapped_in_the_blizzard_desc:0 "Не маючи іншого виходу, ми опинились у неможливій ситуації. Намагаючись зберегти нашу культуру, ми поступово занурювались глибше в Аляву Завірюху.\n\nЦе ніколи не було ідеальним рішенням, але воно було єдиним, або принаймні так вважав Вождь Ролінг Тандер. Хоча дехто все ще вірить, що тут ми вільні жити, як хочемо – немає життя у павутинні невдалих експериментів американських привидів."

    irc_the_hunters:0 "Мисливці на Умбраворів"
    irc_the_hunters_desc:0 "Умбравор – штучна істота, але її м’ясо – цілком реальне. Вона є блідим відлунням казок про Віндіго, хоча її правда ще похмуріша – залежно від того, кого спитаєш. Це одне з небагатьох джерел їжі в Алявій Завірюсі, й більшість з них потребують досвідчених, броньованих мисливців – рідкість у наші часи."

    irc_a_history_of_violence:0 "Історія Насильства й Втрат"
    irc_a_history_of_violence_desc:0 "Ми роками боролися за збереження незалежності перед обличчям імперіалістів і шахраїв. Цей цикл почався не з нас – але ми покладемо йому край."

    irc_reinvigorated_braves:0 "Оновлені Воїни"

    irc_snowshoes_idea:0 "Снігові Черевики"

    irc_umbravore_diet:0 "Дієта з Умбраворів"
    irc_umbravore_diet_desc:0 "Хоч це і не був перший вибір, єдиними істотами, що можуть прогодувати наші табори в такій кількості, є умбравори. Нестабільні й недостатні, вони ведуть до багатьох проблем... Але принаймні не дають нам померти з голоду."

    irc_legacy_of_the_fur_trade:0 "Спадок Луї Ріеля"
    irc_legacy_of_the_fur_trade_desc:0 "Колись ми боролися пліч-о-пліч з метисами в повстанні Ріеля. У ці смутні часи ми радо зробимо це знову."

    irc_memory_of_poundmaker_idea:0 "Спадщина Паундмейкера"

    irc_lay_of_the_land:0 "Знання Землі"

    irc_the_will_to_live:0 "Нас Не Можна Стерти"

    irc_sun_dance_idea:0 "Сонячні Танці"

    irc_wayward_warriors:0 "Заблукалі Воїни"