l_english:
RULE_SLH: "Розширені правила гри для Лост-Гіллз"
RULE_SLH_MULTIPLAYER: "Рішення щодо конфліктів Капітулів"
RULE_SLH_MULTIPLAYER_DEFAULT: "Не дозволено, якщо гравець у стані війни"
RULE_SLH_MULTIPLAYER_DEFAULT_DESC: "Якщо гравець контролює будь-яку зі сторін у конфлікті Капітулів, рішення на підтримку цього Капітулу вимикаються."
RULE_SLH_MULTIPLAYER_YES: "Дозволено завжди"
RULE_SLH_MULTIPLAYER_YES_DESC: "Якщо гравець бере участь у конфлікті Капітулів (як сам Капітул або його ворог), рішення все ще можна ухвалювати. Це не буде чесно, але зазвичай перемога над підтримуваним Капітулом завдасть непоправної шкоди Лост-Гіллз."