  # Consolidation
april_fools_event_unit.2.t:0 "Їх багато"
april_fools_event_unit.2.d:0 "Гарі? Гаааарі, гарі гарі, Гаааааааааааааааааааааааарррррррррріііііііііііііііііііііііііі гарі, гарі!!! гарі гарі! гаарііі гарі. Гарі!! \n\n\nСхоже, до нас завітав гість... чи орда гостей, які прибули з іншого боку континенту й захопили владу. Ці особи безсумнівно посилять наші війська та покращать нашу здатність вести війну. Але їхнє безперервне волання не дає спокою нашим науковцям: ті постійно розпочинають нові проєкти, але не можуть їх завершити. Принаймні, вони прибувають хвиля за хвилею... за хвилею... Гааарі! \n\n\n\n\n\n\n Гарі"
april_fools_event_unit.2.a:0 "Ха-ха, Гааарі!!!"

gary_idea:0 "Гааарі!!"
gary_idea_desc:0 "Здається, гість, або ж ціла їхня орда, прибув з іншого кінця континенту й захопив тут усе. Ці особи безперечно поповнять наші лави та покращать нашу здатність вести війну. Однак через їхні безперестанні крики наші вчені не можуть зосередитися, тому постійно беруться за нові проєкти, але мають проблеми з їхнім завершенням. Принаймні вони, схоже, прибувають натовпами, хвиля за хвилею, за хвилею, за... Гаааарі!"

mtm_another_settlement:0 "Ще одне поселення потребує нашої допомоги"
mtm_another_settlement_desc:0 "Я отримав звістку про поселення, що потребує нашої допомоги. Ось де вони знаходяться. Доберися туди якнайшвидше. Ми обіцяли, що будемо поруч, коли вони нас потребуватимуть."
mtm_another_settlement_tt:0 "Випадкова незайнята область стає нашою національною територією.\n§MЦе безкінечне завдання, що може повторюватись.§!"
