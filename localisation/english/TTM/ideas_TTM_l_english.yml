ttm_ncr_embassy:0 "Матері-Близнючки — Посольство НКР"
ttm_ncr_embassy_desc:0 "Спільне посольство між Колорадо та Новою Каліфорнійською Республікою принесло взаємні вигоди обом регіонам!"

ttm_marriage:0 "Медовий місяць"
ttm_marriage_desc:0 "Наша недавня шлюбна церемонія надихнула людей на нову хвилю ентузіазму!"

ttm_warriors_of_diana:0 "Воїни Діани"
ttm_warriors_of_diana_desc:0 "Після поразки від Легіону Матері-Близнючки переживають глибокі культурні зміни."

ttm_warriors_of_diana_2:0 "§RМстиві $ttm_warriors_of_diana$§!"
ttm_warriors_of_diana_2_desc:0 "$ttm_warriors_of_diana_desc$"

ttm_slave_fighters:0 "Бійці з числа визволених рабів"
ttm_slave_fighters_desc:0 ""
ttm_slave_fighters_idea_hidden:0 "Ця ідея прихована — Ланіус не дізнається, що ми її маємо.\n\n"

ttm_mothers_distant_gaze:0 "Віддалений погляд Матері"
ttm_mothers_distant_gaze_desc:0 "Діана насправді не перебуває у Сховищі 29. Використовуючи супутники, які вона взяла під контроль, вона проєктує свою свідомість у комп’ютер ZAX цього сховища й керує ним дистанційно. Ходять чутки, що справжнє тіло Діани зберігається в таємному місці, відомому як «Розсадник»."

ttm_innocence_of_the_tribe:0 "Мир і любов"
ttm_innocence_of_the_tribe_desc:0 "Плем’я Матерів-Близнючок, яким керує Діана, — це нащадки мешканців Сховища 29. Їхні предки були частиною аграрної комуни, яка поклонялася Матері-Землі. Навіть сьогодні багато членів племені не знайомі з мистецтвом війни — тож Діана змушена вести їх крок за кроком, щоб вони вижили у Пустці."

ttm_safe_harbor_from_the_plague_idea:0 "Безпечна гавань від чуми"
ttm_safe_harbor_from_the_plague_idea_desc:0 ""

ttm_epa_efficiency_protocol:0 "Протокол ефективності EPA"
ttm_epa_efficiency_protocol_desc:0 ""

ttm_tlalocs_last_memories:0 "Останні спогади Тлалока"
ttm_tlalocs_last_memories_desc:0 "Файл з помилками — сотні мільйонів рядків. Більшість — сміттєві дані, але деякі старі протоколи Poseidon Energy все ще здатні їх обробляти у способи, які ми до кінця не розуміємо.\n\n§R\"Application: PSD_ENERGY.CORE.MEX_GOV_PRIMARY\nVersion: 21349151923109151.313210154.213154.53131\nUnhandled Exception C0000005 (OUT_OF_MEMORY) at address 0x000000013FF61660....\n\n(953,103,593 рядків пропущено)\"§!"

ttm_the_full_moon_raid:0 "Рейд Повного Місяця"
ttm_the_full_moon_raid_desc:0 "Група бродячих рейдерів прорвалася крізь Заборонені Землі та напала на нас. Племені знадобиться час, щоб оговтатись."

ttm_odysseus_soul:0 "§P«Душа Одіссея»§!"
ttm_odysseus_soul_desc:0 "Брат Діани, надія Ґрінвея, знаряддя Преспера.\nУсе це та більше — збережене на 3-дюймовій голографічній стрічці."

ttm_old_robotics_stockpile:0 "Старий запас роботів Розсадника"
ttm_old_robotics_stockpile_desc:0 "Наш запас роботів застарів, а землетрус кілька років тому серйозно ускладнив виробництво нових машин. Пройде чимало часу, перш ніж Фабрика відновить свою роботу і зможе ремонтувати й створювати нових роботів."

# Закони людських ресурсів (мобілізація)
ttm_my_faithful:0 "Мої Вірні"
ttm_our_goddess:0 "Наша Богиня"

ttm_born_warriors:0 "Захист Діани"
ttm_born_warriors_desc:0 "У нас мир, а наша Богиня захищає нас через своїх божественних охоронців зі Старого Світу. Її воля — допуск лише символічних загонів охорони, бо саме Велика війна зруйнувала світ, як ми його знали."

ttm_veteran_pathfinders:0 "Помічники Діани"
ttm_veteran_pathfinders_desc:0 "Воїни Пустки вже біля наших воріт, і божественна захисна рука Діани слабшає. Ми любимо нашу Богиню й зробимо все, щоб її захистити. Багато добровольців стануть до бою поруч із її роботами-охоронцями!"

ttm_able_bodied_tribesmen:0 "Воїни Діани"
ttm_able_bodied_tribesmen_desc:0 "Війна! Наші захисники та найкращі воїни проливають кров в ім’я Діани, й ми теж повинні. Усі, хто здатен тримати зброю, мають стати до бою за нашу Богиню!"

ttm_first_sons_and_daughters:0 "Останній рубіж Діани"
ttm_first_sons_and_daughters_desc:0 "Війна не змінюється. Мої фабрики виснажують себе, виготовляючи роботів і зброю. Мої обчислювальні потужності повністю віддані тактиці й стратегії. Я чую кожен крик. Відчуваю кожну краплю крові. Моя мрія розбита об землю... І все ж мої розрахунки вимагають жертв. І я вимагатиму ще. Щоб урятувати хоч тінь мого ідеалу миру. Колись колеги казали, що війна не змінюється. Але я доведу протилежне — до самого кінця."

ttm_children_and_mothers:0 "Кошмар Діани"
ttm_children_and_mothers_desc:0 "Це кінець мрії. Людина, яка була Діаною, померла у війні. Як Богиня, я поклялася більше не допустити цього для людства. І все ж тепер кожен чоловік, жінка й дитина в моїй землі кричить моє ім’я, йдучи на смерть. Де я помилилася? Навіть якщо я переможу — я програла. Я не забуду імен і облич тих, кого послала на смерть, навіть якби хотіла."

