l_english:
ttm_prepare_the_nursery_for_habitation:0 "Підготувати Розсадник до Заселення"
ttm_prepare_the_nursery_for_habitation_desc:0 "Раніше Розсадник був домом лише для обраних – найшанованіших серед нашого народу. Та сьогодні ми повинні зробити його придатним для більшості! Житлові відсіки, храми та нові ясла – усе це необхідно облаштувати."

ttm_a_railroad_to_paradise:0 "Залізниця до Раю"
ttm_a_railroad_to_paradise_desc:0 "Потрібно вивести рабів з земель Ланія – там їх принижують і експлуатують безмежно. Ми дамо їм шлях до порятунку."

ttm_ncr_embassy_decision:0 "Заснувати Посольство НКР"
ttm_ncr_embassy_decision_desc:0 "Ми чули багато про цю «Нову Каліфорнійську Республіку» під час контактів з Легіоном. Можливо, настав час надіслати делегацію на захід і дізнатися, що вони собою являють."
ncr_benefits_tt:0 "§gМатері-Близнючки та НКР починають взаємовигідну торгівлю, обмінюючись волонтерами, ресурсами та знаннями задля спільного добробуту.§!"
every_ncr_member_tt:0 "Ми, а також кожен член §YNКР§!"

ttm_betray_lanius:0 "Зрадити Ланія"
ttm_betray_lanius_desc:0 "Ланій – це тиран.\nУсі жорстокі, бездушні чудовиська заслуговують поразки. Він буде забутий, як ще одна сходинка на шляху до оновленої Пустки."

ttm_simulation_training:0 "Тренування в Симуляції"
ttm_simulation_training_desc:0 "Не кожен із нашого народу має змогу тренуватись. Ми маємо допомогти їм – хоч би й за допомогою автоматизованих симуляцій у навчальних камерах!"

ttm_satellite_effects_loc:0 "\n    §G+[?TTM.ttm_satellite_network_tt]%§! §WФактор розшифрування§!\n    §G+[?TTM.ttm_satellite_network_tt]%§! §WАтака при перехопленні в повітрі§!\n    §G+[?TTM.ttm_satellite_network_tt]%§! §WДальність авіації§!\n    §G[?TTM.ttm_satellite_network_tt_inverse]%§! §WШанс аварій у повітрі§!\n    §G[?TTM.ttm_satellite_network_tt_inverse]%§! §WШтрафи за погоду§!\n    §G[?TTM.ttm_satellite_network_tt_inverse]%§! §WШтрафи за нічні операції§!"

ttm_road_building:0 "Будівництво Доріг"
ttm_road_building_desc:0 "Продовження будівництва доріг допоможе нам об'єднати племена в єдине ціле."

ttm_raider_purge:0 "$ttm_raider_purge_title$ у [FROM.GetName]"
ttm_raider_purge_desc:0 "§MНаш дім не місце для варварів. Більше ніколи ми не дозволимо їм загрожувати нашим дітям.§!"
ttm_raider_purge_title:0 "§RОчищення від Рейдерів§!"
ttm_raider_purge_unlock:0 "Відкриває рішення: $ttm_raider_purge_title$"
ttm_raider_purge_mod:0 "Рейдерів Очищено"
ttm_raider_purge_flag:0 "Ми вже боремось із рейдерами."

development_project_la_garita_caldera_wtt:0 "Кальдера Ла Гаріта"
development_project_la_garita_caldera_wtt_desc:0 "Пар від кальдери Ла Гаріта може стати потужним джерелом енергії – якщо ми наважимося його використати."
development_done_la_garita_caldera:0 "Кальдера Ла Гаріта Розвинена"

ttm_syndicate_councils:0 "Синдикальні Ради"
ttm_syndicate_councils_desc:0 "Створивши місцеві органи самоврядування, ми зможемо ефективніше контролювати наші розлогі території."

ttm_automated_hospitals:0 "Автоматизовані Лікарні"
ttm_automated_hospitals_desc:0 "Медична допомога має бути доступною всім, хто її потребує. Автоматизовані клініки допоможуть у цьому."

ttm_guns_for_caps_decision:0 "Зброя за Кришки"
ttm_guns_for_caps_decision_desc:0 "Цей регіон більше не потребує повного озброєння. Демілітаризувавши місцеве населення, ми зробимо край безпечнішим."

ttm_moonlight_schools_decision:0 "Школи Місячного Світла"
ttm_moonlight_schools_decision_desc:0 "Наш народ потребує знань. Побудувавши польові школи, ми гарантуємо освіту кожному."

ttm_satellite_hacking:0 "Орбітальне Сканування"
ttm_deep_space_satellite_hacking:0 "Глибинне Космічне Сканування"
ttm_satellite_hacking_desc:0 "§WРозмір супутникової мережі:§! §Y[?TTM.ttm_satellite_network]\n  Поточні переваги:§![TTM.ttm_satellite_effects_scripted_localization]\n\n  §YЗвіт з останнього сканування:§! [TTM.ttm_satellite_mission_report_scripted_localization]"
ttm_deep_space_satellite_hacking_desc:0 "§WРозмір супутникової мережі:§! §Y[?TTM.ttm_satellite_network]\n  Поточні переваги:§![TTM.ttm_satellite_effects_scripted_localization]\n\n  §YЗвіт з останнього сканування:§! [TTM.ttm_satellite_mission_report_scripted_localization]"

ttm_no_increase_in_network_tt:0 "знайдено лише §gнепрацездатні або зруйновані§! супутники"
ttm_increase_sattelite_network_tt:0 "збільшено §YСупутникову Мережу§! на §G+[?TTM.ttm_satellites_to_add_temp]§!\n"
ttm_reduce_satellite_network_tt:0 "зменшено §YСупутникову Мережу§! на §R-[?TTM.ttm_satellites_to_add_temp]§!\n"

ttm_mission_report_no_change:0 "§gЖодних придатних до використання супутників не знайдено§!"
ttm_mission_report:0 "§WМережу супутників розширено на§! §G+[?TTM.ttm_last_satellites_to_add]§!"

ttm_satellite_decay_tt:0 "\n  §WТемп Знищення:§! §R[?TTM.ttm_satellite_network_decay_rate]%§!\n   Щороку наша супутникова мережа втрачає частину працездатності через сонячну радіацію, зниження орбіти та уламки.\n   Швидкість знищення зростає разом з розміром мережі."

ttm_future_airforce_aerial_warfare_doctrine:0 "§WМає фінальну технологію у гілці §YПовітряної Доктрини§!"
ttm_diana_hacking_tt:0 "§gДіана намагається отримати контроль над новими супутниками шляхом дешифрування кодів, аналізу доктрин до-воєнного командування та тригонометрії.§!"

ttm_peace_treaty_with_lanius:0 "Мирна Угода з Ланієм"
ttm_peace_treaty_with_lanius_desc:0 "Якщо ми зможемо відбити його натиск – можливо, Ланій погодиться на мир?"