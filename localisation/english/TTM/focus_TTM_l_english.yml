l_english:
FOCUS_FILTER_COMPUTATIONAL_POWER:0 "Обчислювальна потужність"
FOCUS_FILTER_DNA:0 "ДНК"

ttm_1:0 "§CКолись я була як ти§!"
ttm_1_desc:0 "§CХто я? Минуло багато часу з моменту, коли мене востаннє це питали. Я могла б безкінечно говорити про те, ким стала і що зробила. Але, мабуть, краще почати з того, ким я була... в іншому житті.§!"

ttm_2:0 "§CДоля дала мені кепську карту§!"
ttm_2_desc:0 "§CЯк Ікар, що занадто наблизився до сонця, я впала з піднесеного світу академії, майже втративши себе. Щоденна агонія мого тіла лише відкладала неминуче. Я майже втратила надію, аж поки Дерек не дав мені вихід — спосіб обдурити долю.§!"

ttm_3:0 "§CІ все ж я вистояла§!"
ttm_3_desc:0 "§CДерек врятував мені життя, але після вибуху бомб наші шляхи розійшлися. Та перед відходом він залишив мені дещо безцінне — шанс для істоти на ім’я Діана залишити свій слід у пустці.§!"

ttm_the_nursery:0 "Розсадник"
ttm_the_nursery_desc:0 "Прихований від безумства людства, його амбіцій і самої пустки, Розсадник — це вершина досягнень довоєнної інженерії. Десятки років будівництва, роки досліджень, місяці тонкого налаштування — усе це створило останній райський куточок на цій землі."

ttm_the_command_station:0 "Командна станція"
ttm_the_command_station_desc:0 "У самому серці Розсадника міститься Командна станція — надсучасний мейнфрейм, яким керують розвинені Робомізки. Відновлення її систем і інтеграція в нашу командну структуру значно посилить наші майбутні зусилля."

ttm_new_casing:0 "Нове тіло"
ttm_new_casing_desc:0 "Кожні кілька десятиліть я змінюю резервуар: гель зберігання твердне, а скло стає надто незручним. Час змін настав. Цього разу я доручу процедуру роботу, а не в’язневі, як раніше."

ttm_ensuring_continued_connection:0 "Забезпечити зв'язок"
ttm_ensuring_continued_connection_desc:0 "Плем’я Матерів-Близнючок — наш важливий союзник. На жаль, нам важко з ним спілкуватися й постачати необхідне. Наші мейнфрейми розроблять нові способи повітряного постачання та зв’язку."

ttm_twin_mothers_relay_dish:0 "Ретранслятор Близнючок"
ttm_twin_mothers_relay_dish_desc:0 "Забезпечення стабільного зв’язку з Близнючками — ключ до стабільності навколо Розсадника. Зведення ретранслятора і супутньої інфраструктури зміцнить регіон і розширить наші можливості спостереження."

ttm_nursery_radar_improvements:0 "Поліпшення радара Розсадника"
ttm_nursery_radar_improvements_desc:0 "Регіони довкола Розсадника — все ще терра інкогніта. Наша нова радарна установка дозволить точно їх картографувати та покращить інфраструктуру обчислень."

ttm_hijack_additional_satellites:0 "Перехопити супутники"
ttm_hijack_additional_satellites_desc:0 "Після оновлення радарів ми виявили кілька супутників на орбіті, придатних до захоплення. Під’єднання та діагностика їх залишкових функцій дозволить розширити нашу мережу спостереження."

ttm_come_fly_with_me:0 "Політ зі мною"
ttm_come_fly_with_me_desc:0 "Отримавши доступ до передвоєнних аерокосмічних даних, ми не зможемо запустити нові об’єкти в космос, але зможемо створити вдосконалені повітряні бойові системи."

ttm_come_fly_with_me_tt:0 "Має §Yмережу супутників§! щонайменше з §Y50§! одиниць"

ttm_nova_terra:0 "ПРОЄКТ «ЛУНА»"
ttm_nova_terra_desc:0 ""

ttm_complete_set:0 "Зібрати повний комплект"
ttm_complete_set_desc:0 ""

ttm_nova_terra_sat_tt:0 "Має §Yмережу супутників§! щонайменше з §Y300§! одиниць"
ttm_nova_terra_repconn_tt:0 "Має доступ до Космодрому REPCONN у §YRoute 95§!"
ttm_nova_terra_bloomfield_tt:0 "Має доступ до Космічного центру Блумфілд у §YBryce§!"
ttm_houston_rockets_repconn_tt:0 "Має доступ до ракетного центру «Х’юстон» у §YHouston§!"
ttm_nova_terra_manpower_tt:0 "§Y5000§! жінок виведено з активної служби для роботи над ПРОЄКТОМ «ЛУНА»."

ttm_defending_the_command_station:0 "Захистити Командну станцію"
ttm_defending_the_command_station_desc:0 "Нові паливні системи наших розвідроботів дозволять їм розчистити завали довкола Раю. Повернення втрачених мейнфреймів і знань — наш обов’язок."

ttm_support_robot_subroutines:0 "Підтримувальні підпрограми роботів"
ttm_support_robot_subroutines_desc:0 "Роботи Mister Handy містять знання не лише про кухню, а й про ефективне використання ресурсів. Їхнє програмне забезпечення може оптимізувати наші обчислення."

ttm_combat_robot_subroutines:0 "Бойові підпрограми роботів"
ttm_combat_robot_subroutines_desc:0 "Вивчення пошкоджених Сторожових Ботів дозволить нам інтегрувати їхні бойові протоколи до систем Діани, посилюючи оборонні спроможності Розсадника."

ttm_harder_better_faster_stronger:0 "Сильніше, розумніше, швидше"
ttm_harder_better_faster_stronger_desc:0 "Маючи міцний союз із Близнючками, ми можемо просунутись далі за людські межі. Добровольці отримають можливість стати першим поколінням кібернетичних істот."

ttm_the_repository:0 "Сховище"
ttm_the_repository_desc:0 "Сховище — ДНК-архів Розсадника, де створюють біокомпоненти для потреб нашого саду. Його розширення дозволить проводити нові дослідження над флорою і фауною пустки."

ttm_collecting_specimens:0 "Збір зразків"
ttm_collecting_specimens_desc:0 "Нове крило Сховища дозволить зберігати ДНК мутованих істот пустки й обробляти їх. У майбутньому ми зможемо вживлювати ці властивості добровольцям."

ttm_molerat_dna:0 "ДНК кротокрота"
ttm_molerat_dna_desc:0 "ДНК кротокрота дає здатність «чути землю». Вона ідеально підходить для саперів, яким стане легше знаходити укриття й швидко закріплюватися."

ttm_fire_ant_dna:0 "ДНК вогняного мурахи"
ttm_fire_ant_dna_desc:0 "Мурахи мають надзвичайну організацію. Ми не впроваджуватимемо колективний розум, але використаємо їхню здатність до комунікації через феромони."

ttm_gecko_dna:0 "ДНК гекона"
ttm_gecko_dna_desc:0 "Гекони мутували під впливом FEV, набувши неймовірної витривалості. Їхня ДНК може підвищити швидкість, зріст і навіть фертильність людей."

ttm_brahmin_dna:0 "ДНК браміна"
ttm_brahmin_dna_desc:0 "Браміни нащадки старих корів. Ми не будемо наділяти людей шлунком з восьми відділів, але зробимо їх менш залежними від води та поліпшимо травлення."

ttm_advanced_specimens:0 "Покращені зразки"
ttm_advanced_specimens_desc:0 "Ми зібрали чимало зразків, та наші можливості обмежені. Нові лабораторії дозволять проводити генетичні експерименти на вищому рівні."

ttm_mirelurk_dna:0 "ДНК мирлорка"
ttm_mirelurk_dna_desc:0 "Мирлорки ідеально пристосовані до води. Їхня ДНК дозволить нашим людям вільно пересуватись під водою і бачити без окулярів."

ttm_radscorpion_dna:0 "ДНК радскорпіона"
ttm_radscorpion_dna_desc:0 "Радскорпіони витримують спеку, сушу і сонце. Їхні гени зроблять людей витривалими до пустельного клімату й забезпечать комфорт у більшості середовищ."

ttm_wanamingo_dna:0 "ДНК Ванамінго"
ttm_wanamingo_dna_desc:0 "Містичний Ванамінго оповитий легендами, байками й вигадками. Єдине, в чому ми можемо бути певні — ким би воно не було, його було створено штучно. Ми виявили сліди біологічної зброї, знову пов’язані з вірусом FEV. Як би там не було, силу й витривалість цієї істоти можна інтегрувати в наших громадян."

ttm_rumble_in_the_jungle:0 "Грюкіт у Джунглях"
ttm_rumble_in_the_jungle_desc:0 "Корумпований G.E.C.K. катастрофічно порушив екологічний баланс Розсадника. Щоб відновити порядок, нам слід зробити вибір — і зробити його швидко. Зберегти спадщину старого світу, чи прийняти можливість, яку дарує нам Різ?"

ttm_old_world_wildlife:0 "Фауна Старого Світу"
ttm_old_world_wildlife_desc:0 "Ми не маємо забувати нашу первісну мету й спадок довоєнного світу. Ми знищимо всі сліди мерзенних експериментів Різа і повернемо рівновагу в Розсаднику, допомагаючи існуючій фауні, що вижила ще з довоєнних часів."

ttm_new_world_fauna:0 "Фауна Нового Світу"
ttm_new_world_fauna_desc:0 "Адаптація до нового світу і пустки завжди була головною метою Розсадника з моменту його створення. Ми переселимо довоєнну фауну в контрольовані зони, а потім зосередимось на дослідженні створінь, породжених спотвореним G.E.C.K.'ом."

ttm_avian_preservation:0 "Збереження Пташиного Світу"
ttm_avian_preservation_desc:0 "Особливу увагу слід приділити збереженню крихкої пташиної екосистеми Розсадника, яку загрожує знищити агресивна флора, створена корупцією. Очищення Розсадника від її слідів дозволить забезпечити виживання пернатих і відновити наші дослідження їхньої фізіології."

ttm_simian_preservation:0 "Збереження Приматів"
ttm_simian_preservation_desc:0 "Потворна фауна, створена за допомогою набору Різа, загрожує навіть секції збереження приматів — це неприйнятно. Наші роботизовані підрозділи безжально виявлятимуть і знищуватимуть усі сліди цих біологічних виродків, після чого переселять приматів назад у середовище для подальшого вивчення."

ttm_strength_of_the_wild:0 "Сила Дикої Природи"
ttm_strength_of_the_wild_desc:0 "Наші безперервні дослідження довоєнних ДНК-послідовностей і їхньої генетичної інтеграції привели нас до несподіваного відкриття. ДНК звичайного псів пустки близька до довоєнних тигрів — і дозволяє схрещування! Це значно підвищить їхню ефективність у бою."

ttm_dionaea_muscipula:0 "Dionaea Muscipula"
ttm_dionaea_muscipula_desc:0 "Dionaea Muscipula — більш відома як венерина мухоловка чи 'спорова рослина' — це результат божевілля Різа. Вони мутували в гігантські й надзвичайно агресивні форми. Їхній генетичний код демонструє підвищену стійкість до отрут і радіації — це може стати в пригоді в сільськогосподарських дослідженнях."

ttm_victims_of_the_geck:0 "Жертви G.E.C.K."
ttm_victims_of_the_geck_desc:0 "Нещасні люди, які були поруч під час активації спотвореного G.E.C.K., перетворилися на жахливих напівлюдських-напіврослинних істот. Ми повинні врятувати тих, кого ще можна, й вивчити зміни в їхній фізіології. Це може допомогти створити ліки й значно просунути наші медичні дослідження."

ttm_strength_of_the_spores:0 "Сила Спор"
ttm_strength_of_the_spores_desc:0 "Розшифрувавши генетичний код флори пустки та спотворених G.E.C.K.-мутантів, ми змогли відтворити повну послідовність мутації. Ми можемо використати ці знання, щоб створити бойову рослинність, адаптовану до тропіків і болотистих зон."

ttm_advanced_cloning_research:0 "Дослідження Клонування"
ttm_advanced_cloning_research_desc:0 "Отриманий зразок біоматеріалу юрського періоду виявився напрочуд перспективним. З нашими технологіями ми можемо інтегрувати ДНК динозаврів у солдатів, значно підвищуючи їхню витривалість і наближаючи нас до досконалості."

ttm_memory_management:0 "Керування Пам’яттю"
ttm_memory_management_desc:0 "Із зростанням обчислювальної потужності Діана вчиться краще впорядковувати свою пам’ять. Але останнім часом... щось пішло не так. У процесі з’являються приховані або пошкоджені спогади. Можливо, з часом вона зможе повністю відновити власну історію."

ttm_memory_of_the_traveler:0 "Пам’ять про Мандрівника"
ttm_memory_of_the_traveler_desc:0 "§CЯ згадую... Він був приємним співрозмовником і ніколи не втрачав дотепності, попри всі випробування. З часом він здобув певну славу, хоча я давно його не бачила. Я рада, що зустріла його, і сподіваюся, з ним усе гаразд.§!"

ttm_memory_of_the_silver_tongue:0 "Пам’ять про Срібного Язика"
ttm_memory_of_the_silver_tongue_desc:0 "§CЗгадую... Ця людина була не з приємних. Гнучкий язик і лукаві наміри — вона маніпулювала мною, як і всіма іншими. Якби я лише знала тоді, що вона замислила...§!"

ttm_memory_of_the_prisoner:0 "Пам’ять про В’язня"
ttm_memory_of_the_prisoner_desc:0 "§CЯ пам’ятаю... Коли Розсадник був на межі загибелі, ця людина прийшла нам на допомогу. Без вимог, без користі — просто з доброти. Завдяки їй Розсадник зцілився. Я вічно вдячна.§!"

ttm_memory_of_the_student:0 "Пам’ять про Учня"
ttm_memory_of_the_student_desc:0 "§CЯ пам’ятаю... До кровопролиття, до війни, вона була моєю ученицею. Я навчила її лікувати пустку та її мешканців. Побачивши плоди її роботи, я зрозуміла, що вона дійсно засвоїла мої уроки. Я завжди пишалася нею.§!"

ttm_memory_of_family:0 "Пам’ять про Родину"
ttm_memory_of_family_desc:0 "§CБагато хто приходив і йшов, і з кожною зустріччю я пізнавала себе. Але тепер, коли спогади повертаються, я згадую відчуття — ніби хтось мені близький, хоча я його ніколи не зустрічала. Я пам’ятаю лише ім’я...§!"

ttm_the_factory:0 "Фабрика"
ttm_the_factory_desc:0 "Автоматизоване диво, здатне навіть створювати легендарний G.E.C.K. Вона з’єднана з усіма частинами Розсадника мережею вантажівок, потягів і керованих штучним інтелектом вертибердів. Активувати її — критично важливо: вона зможе навіть відновити пустку до довоєнного стану, якщо дати їй час."

ttm_a_paintbrush_for_the_wastes:0 "Пензель для Пустки"
ttm_a_paintbrush_for_the_wastes_desc:0 "На жаль, виробнича лінія G.E.C.K. занепала. Деякі її функції, як-от матриця адаптивного вдосконалення, можна відновити — за умови ретельного догляду. Але шкода вже заподіяна. Її дія... стане цілковито випадковою."

ttm_refractoring_radiation_compression_device:0 "Пристрій Перефракції Радіаційної Компресії"
ttm_refractoring_radiation_compression_device_desc:0 "Наші знання у сфері генної інженерії дозволяють із зусиллям перезапустити підпрограму Р.Р.К.К. у Створювальному Комплекті. Цей потужний генетичний сканер виявляє спотворені ДНК у флорі й фауні, очищає їх від корупції та відновлює первинний стан. Його алгоритм — надпотужний, і ми можемо використати його на благо."

ttm_mass_relay_grassland_expander:0 "Масовий Релейний Розширювач Лугів"
ttm_mass_relay_grassland_expander_desc:0 "Наші агрономічні дослідження дозволяють активувати підпрограму М.Р.Р.Л. у Створювальному Комплекті. Вона була розроблена для підтримки харчових потужностей через лугозаміщення під час тераформування. Якщо пощастить, її запуск підвищить ефективність продовольчого циклу та збільшить водні запаси як побічний ефект."

ttm_industrial_hillside_reforesting_network:0 "Індустріальна Схилова Рекультиваційна Мережа"
ttm_industrial_hillside_reforesting_network_desc:0 "Процедура І.С.Р.М. — це програма масового засівання, яку можна перезапустити, скориставшись знаннями про пустельну флору. Створена для відновлення епіцентру ядерного удару, вона споживає величезну кількість енергії, яку ми зможемо відновити для власних цілей."

ttm_geologic_crystal_growth_prism:0 "Призма Геологічного Розростання Кристалів"
ttm_geologic_crystal_growth_prism_desc:0 "Використавши наші дослідження в галузі автоматизованого збору, ми можемо перезапустити підпрограму П.Г.Р.К., яка генерує мінеральні поклади в виснажених регіонах. Її дія буде випадковою, проте результат — відчутним: нові родовища та зростання сплавів."

ttm_exponential_humidity_amplifier_system:0 "Система Експоненційного Посилення Вологості"
ttm_exponential_humidity_amplifier_system_desc:0 "Пакет Е.П.В. допомагає екосистемам пустель оговтатися після радіаційних хвиль. Ми можемо активувати його, спираючись на дослідження ґрунтів Пустки. Після завершення процесу система може бути демонтована й використана вдруге."

ttm_powering_production:0 "Пробудження Виробництва"
ttm_powering_production_desc:0 "Поступово Фабрика пробуджується. Допоміжні генератори оживають, стрічки ревуть. Та, щоб запустити її на повну силу, потрібне значно більше. Нам слід негайно вивчити способи забезпечення потужностей."

ttm_power_of_the_earth:0 "Сила Землі"
ttm_power_of_the_earth_desc:0 "Геотермальна енергія, морські течії, підземні генератори — енергія вже є, треба лиш навчитися її брати, не руйнуючи середовище. Якщо ми збудуємо правильну інфраструктуру, сама земля підживлюватиме Фабрику."

ttm_power_of_the_atom:0 "Сила Атома"
ttm_power_of_the_atom_desc:0 "Можна знову запустити вбудовані ядерні генератори Фабрики. Проте чи варто? Чи слід знову торкатися тієї самої сили, яка колись принесла кінець? Переваги великі, ціна — більша. І Плем’я Близнючок навряд чи погодиться."

ttm_power_of_the_wind:0 "Сила Вітру"
ttm_power_of_the_wind_desc:0 "Дослідження аеродинаміки можуть допомогти у створенні природної альтернативи нинішнім генераторам. Вітер — джерело чистої енергії. Чи зможемо ми спрямувати його силу на користь Фабрики?"

ttm_harnessing_heat:0 "Узурпація Жару"
ttm_harnessing_heat_desc:0 "По всій Пустці, і навіть у наших землях, є зони з палючим теплом. Побудувавши геотермальні генератори над цими місцями, ми отримаємо нові потужності для Фабрики і повернемо її заснули функції."

ttm_rising_waters:0 "Зростаючі Води"
ttm_rising_waters_desc:0 "Пара може стати нашою відповіддю. Використовуючи припливи Ріо-Ґранде та парові генератори вздовж його берегів, ми зможемо живити Фабрику з мінімальним втручанням у природу."

ttm_natural_power_generation:0 "Природне Добування Потужності"
ttm_natural_power_generation_desc:0 "Вітер — природний ресурс, який можна легко перетворити на енергію. Проте він неефективний, і нам знадобиться велика територія. Як тільки отримаємо її, можемо збудувати величезні безтертєві вітропарки й повернути Фабриці її могутність."

ttm_renewable_energy_doctrine:0 "Доктрина Відновлюваної Енергії"
ttm_renewable_energy_doctrine_desc:0 "Наші дослідження з переробки енергоелементів можна застосувати до допоміжних генераторів Фабрики. Після модернізації вони стануть майже самодостатніми. І ми зможемо працювати на повну — без страху перегріву чи нестачі палива."

ttm_power_needs_fulfilled:0 "Потреби в Потужності — Задоволено"
ttm_power_needs_fulfilled_desc:0 "Глибоко під землею, Фабрика прокидається цілковито. Виробничі лінії оживають, системи запускаються. Потяги та вертиберди знову курсують через Розсадник, несучи насіння, зразки й деталі до кожного куточка Раю. Нарешті, ми можемо зібрати повністю функціональний G.E.C.K.!"

ttm_meeting_a_legend:0 "Зустріч із легендою"
ttm_meeting_a_legend_desc:0 "§CЗа всі мої століття існування я не бачила нікого подібного до Ланія — в броні, що нагадує Римську Імперію, у супроводі справжньої армії, він приніс криваву дійсність завоювань Пустки до моєї Оранжереї. Я мушу обережно вирішити, як із ним поводитися — заради моїх дітей і мого народу.§!"
ttm_meeting_a_legend_tt:0 "Ми зустріли цікавого мешканця Пустки"

ttm_the_goddess_of_war:0 "Схилити легенду"
ttm_the_goddess_of_war_desc:0 "§CЛегіон зіпсований, його система тріщить по швах. Цезар веде армії в пошуках справедливого правління, не розуміючи, що світ, від якого він відмовився, вже дав йому необхідні для цього інструменти. Якщо Ланій погодиться, ми зможемо зробити великі справи в Аризоні. Я лише маю схилити його на свій бік.§!"

ttm_lanius_friendly:0 "Ми в гарних стосунках із §YЛанієм§!."

ttm_exemption_from_rejection:0 "Озброїти плем’я"
ttm_exemption_from_rejection_desc:0 "Якщо ми хочемо протистояти Цезарю, нам потрібно озброїтися. Не лише роботи під контролем Діани мають боротися за свободу — кожна дитина має бути готовою захищати те, що їй дороге!"

ttm_automata_hastati:0 "Автомати Хастаті"
ttm_automata_hastati_desc:0 "Території Ланія містять численні досягнення довоєнної індустрії. Щоб посилити наш захист, ми звернемося до нього з проханням поділитися знаннями, які дозволять створити власний бойовий корпус роботів — Автомати Хастаті!"

ttm_horned_advisors_for_the_tribe:0 "Рогаті радники для племені"
ttm_horned_advisors_for_the_tribe_desc:0 "Зброї недостатньо для безпеки нашого народу. Щоб утримати землю, слід опанувати стратегію й тактику. Наш союз із Ланієм означає постійні військові делегації — ми маємо вчитися у них усім доступним знанням."

ttm_settlers_from_the_86:0 "Поселенці з Когорти"
ttm_settlers_from_the_86_desc:0 "Історії про дивне плем’я Близнючок поширилися Пусткою. Ремісники, мислителі та шукачі волі покидають Легіон, щоб знайти притулок у наших землях. Ми приймемо їх з відкритими обіймами."
ttm_settlers_from_the_86_tt:0 "§gДо долини Близнючок прибувають поселенці з усього Нью-Мексико — майстри, науковці й вільнодумці, яким ближчий наш шлях, ніж звичаї решти Пустки.§!"

ttm_the_pilgrim_trail:0 "Шлях паломника"
ttm_the_pilgrim_trail_desc:0 "З поглибленням нашої співпраці Ланій запропонував перейти на його валюту — денарій. Це супроводжується вигідними торговими караванами та широким асортиментом товарів для наших громадян."

ttm_keep_it_professional:0 "Триматися професійності"
ttm_keep_it_professional_desc:0 "§CЩоб стати справжньою силою, я маю опиратися лише на себе. Мене не цікавлять дрібні інтриги Легіону. Я служу народу — і цим усе сказано.§!"

ttm_romance_in_the_workplace:0 "Романтика на службі"
ttm_romance_in_the_workplace_desc:0 "§CЩоб зміцнити довіру між нами й Легіоном, я організую фіктивний шлюб із Ланієм. Це лише дипломатичний жест, покликаний принести престиж обом державам — він мусить знати, що нічого більшого за цим не буде.§!"

ttm_the_cult_of_diana:0 "Культ Діани"
ttm_the_cult_of_diana_desc:0 "Так само, як Ланія шанують його вояки, Діану вшановують Близнючки. Можливо, варто спробувати поєднати віру нашого племені з вірою Когорти? Це дасть надію і зміцнить наш союз."

ttm_pax_terra_regnum:0 "Чистий аркуш"
ttm_pax_terra_regnum_desc:0 "Ми відкрили повний потенціал G.E.C.K. Було б егоїстично не поділитися. Ланій, наш вірний союзник, отримає цей дар. Нехай і він зцілює землю під час своїх походів."
ttm_pax_terra_regnum_tt:0 "Ми пропонуємо §Y[THIS.GetName]§! наші інструменти тераформування, щоб і вони зцілювали Пустку. Якщо погодяться — ми поділимося §YКубиками окультурення§!.\n\n"

ttm_fully_unlocked_coring_dice:0 "Ми розблокували повний потенціал §YКубиків окультурення§!"

ttm_assisting_arizona:0 "Аризонська Гея"
ttm_assisting_arizona_desc:0 "Ми це зробили! Цезар повалений. Ланію знадобиться час, щоб інтегрувати Аризону. Можливо, я маю допомогти йому, надіславши найкращих жриць — вони принесуть мудрість і порядок."

ttm_fruit_of_knowledge:0 "Плід знання"
ttm_fruit_of_knowledge_desc:0 "§C«Я подарую Аризоні розкіш знань Оранжереї. Нехай поля Аризони знову стануть зеленими»§!"

ttm_the_great_healer:0 "Велика цілителька"
ttm_the_great_healer_desc:0 "§C«Аризона знатиме мене як велику цілительку. Я рятуватиму життя, надаючи знання довоєнної медицини під покровом містики, щоб уникнути критики.»§!"

ttm_beauty_of_the_earth:0 "Краса Землі"
ttm_beauty_of_the_earth_desc:0 "§C'Іди таємними стежками лісу.\nСкуштуй ягоди, солодкі від сонця.\nПірни в багатство, що тебе оточує.\nІ вперше — не питай, чого воно варте.'§!"

ttm_soot_from_a_bygone_era:0 "Кіптява минулої епохи"
ttm_soot_from_a_bygone_era_desc:0 "§CЛаній — майстер воєнної справи, але його армія страждає від нестачі ресурсів. Як союзник, я маю допомогти, відкривши постачання з моїх земель. Це має полегшити логістику й забезпечення.§!"
ttm_soot_from_a_bygone_era_tt:0 "§gМи відкриваємо лінію постачання між Ла-Гарітою та землями Ланія, значно посилюючи промислові спроможності Когорти.§!"

ttm_upholding_our_ideals:0 "Вірність ідеалам"
ttm_upholding_our_ideals_desc:0 "§CНі! Я ніколи не схилюся перед Ланієм! Він горітиме за все, що вчинив. Рабство, тортури, зруйновані родини — заради влади. Вони називають нас ницими? Та це вони — справжні ниций покидьки, заради яких і створено Оранжерею! Готуймо війська. Готуймо Фабрику. Ми не здамося.§!"

ttm_bring_supplies_to_paradise:0 "Перевезти припаси до Раю"
ttm_bring_supplies_to_paradise_desc:0 "Ми не можемо дозволити Ланію доторкнутися до довоєнних технологій. Ми маємо переконати плем’я допомогти перемістити всі ресурси й обладнання до Раю, у разі катастрофи."
ttm_move_half_of_our_capitals_resources_to_paradise:0 "§gПлем’я допомагає перевезти наші ресурси та виробництво до Оранжереї.\nМи переміщуємо половину ресурсів зі штату §YБлизнючки§! до §YРаю§!.\nУсі наші майстерні в штаті §YБлизнючки§! стають виїзними.§!"

ttm_encrypt_valuable_information:0 "Зашифрувати цінну інформацію"
ttm_encrypt_valuable_information_desc:0 "Відмова Легіону від технологій — їхня загибель. Вони не мають засобів перехоплення, отже, ми можемо легко шифрувати зв’язок. Ми завжди будемо на п’ять кроків попереду."

ttm_assistance_from_hecate:0 "Допомога від Гекати"
ttm_assistance_from_hecate_desc:0 "Багато наших дітей, що навчалися в Гекати, повернулися, почувши про загрозу. Вони привезли зброю, досвід і бажання захищати рідний дім. Ми зустрінемо їх із честю."
ttm_assistance_from_hecate_tt:0 "§gКілька колишніх Близнючок, що тренувалися в Гекати, повертаються захищати рідні землі й привозять зброю.\nДо штату §YБлизнючки§! прибуває п’ять елітних дивізій.§!"

ttm_assistance_from_the_followers:0 "Допомога від Послідовників"
ttm_assistance_from_the_followers_desc:0 "Послідовники Апокаліпсису, хоч і не воїни, не можуть стояти осторонь, коли Ланій загрожує нашій місії. Вони вже відправили інженерів, лікарів і волонтерів — зміцнити нашу землю й звільнити наших людей для війни."

ttm_assistance_from_the_followers_tt:0 "§gПослідовники Апокаліпсису чують про нашу скруту й поспішають на допомогу. Вони починають кампанію, щоби захистити нашу долину від агресорів і зберегти наш спосіб життя.§!"

ttm_fight_for_peace:0 "Боротьба за Мир!"
ttm_fight_for_peace_desc:0 "§CГромадяни пустки, почуйте мене! Надто довго гнобителі панували над світом страхом. Але я кажу — досить! Світ може стати вільним, прекрасним — якщо ми об’єднаємось не як племена, не як нації, а як єдине людство. Ми несемо не ненависть, а надію — на світ розуму та щастя. В ім’я свободи, борімося за новий світ! В ім’я миру — єднаймося!§!"

ttm_the_twin_mothers_victorious:0 "Матері-Близнючки Перемогли!"
ttm_the_twin_mothers_victorious_desc:0 "§CПопри ненависть і скорботу — ми встояли. Вороги думали, що ми впадемо. Але ми стоїмо. І доки я жива, доки живе Розсадник, Матері-Близнючки і все, що вони уособлюють — ми стоятимемо. Нехай тирани розіб’ються об наші мури. Ми вищі за них — духом і розумом. Бо в ім’я людства, сьогодні, ми встояли.§!"

every_country_in_western_colorado:0 "Кожна країна у §YЗахідному Колорадо§!"

ttm_beat_lanius:0 "Перемогти Ланія"

ttm_the_tribe_destroyed:0 "Плем’я Знищене"
ttm_the_tribe_destroyed_desc:0 "§CМої діти... Пробачте мені. Я зрадила вас. Уся наша історія, усе, що ми будували — змите моєю пихою. Я благаю: простіть. Я повернуся за кожним з вас. Обіцяю. Лише Розсадник залишився — тихий і мовчазний. Така тиша... вона зводить мене з розуму...§!"

ttm_fought_lanius_honorably:0 "Боротьба з Ланієм по Честі"

ttm_the_goddesses_influence:0 "Вплив Богині"
ttm_the_goddesses_influence_desc:0 "Ми торкнулися пустки…"

ttm_iron_rivers_tribe:0 "Плем’я Залізних Річок"

ttm_protecting_colorado:0 "Оборона Колорадо"
ttm_protecting_colorado_desc:0 "§CУсім, хто мене чує — прислухайтесь! Ця земля віками була ареною страждань і війни. Але з силою, яку мені даровано, я покладу цьому край. Подібно до Тлалока, кожен акт насилля над невинними у Колорадо буде зустрінутий рішучою карою. Згодом ви зрозумієте — це заради вас.§!"

ttm_the_realm_of_the_goddess:0 "Володіння Богині"
ttm_the_realm_of_the_goddess_desc:0 "§CХто чує мій голос — бережіть його. Бо я ваш порятунок. Ви жили в злиднях, у хибних звичаях, у зворотному від цивілізації. Але я принесу вам світло знання і волі. Навіть якщо ви не розумієте цього зараз — я звільняю вас із вічного кола погибелі. І ви ще подякуєте.§!"

ttm_manifest_destiny_tt:0 "Отримує §YМаніфест Долі§! (Ставлення §R-50§!)."
ttm_manifest_destiny:0 "Маніфест Долі"
ttm_they_want_our_land:0 "Вони Хочуть Нашу Землю!"

ttm_vengeance_on_the_wastes:0 "Помста Пустці"
ttm_vengeance_on_the_wastes_desc:0 "§CДо всіх, хто чує мене — я скажу лише раз. Покладіть зброю. Відійдіть. Не заважайте. Тирани пустки — ваша доба закінчується. За кожного знищеного, за кожну сльозу — я запалю вогонь. Мої діти, я вас люблю. Мати повертається додому.§!"

ttm_realm_of_diana:0 "Царство Діани"
ttm_realm_of_diana_desc:0 "Беззахисні і покинуті гинуть у пустках — від рук бандитів, деспотів і убивць. Лише Діана та її бачення можуть покласти край цьому колу смерті. І ці виродки повинні знати: Богиня йде по них. І Вона не прощає."

ttm_hecates_army:0 "Союз з Доньками Гекати"
ttm_hecates_army_desc:0 "Колись Діана і Геката стояли поруч під місяцем — учителька та учениця. Але Геката зрадила науку. Тепер вона править з Ороборосу — міста-тіні, а Діана — лише голос у машинах. Але легіон Цезаря близько, і пора зцілити старі рани."

ttm_inr_wg:0 "Кайдани на Наших Рідних"
ttm_inr_wg_desc:0 "Народ Circle Junction викрав те, що священне — наших дітей, наших братів і сестер. Ми підемо до їхніх воріт, розірвемо ланцюги і повернемо вкрадених додому, під світло Діани."

ttm_for_wg:0 "Повернути Загублених"
ttm_for_wg_desc:0 "Фораджери, вільні під зорями Денвера, були сковані жорстокими угодами Скарбошукачів. Ми розвінчаємо їхні брехні, визволимо рідню і повернемо в обійми Розсадника."

ttm_clj_wg:0 "Знищити Архітекторів"
ttm_clj_wg_desc:0 "Підступники з Circle Junction спланували викрадення наших людей до найменших подробиць. Їхній час сплив. Їхні плани будуть поховані разом з ними."

ttm_blc_wg:0 "Кінець Правлінню МакБрайда"
ttm_blc_wg_desc:0 "МакБрайд — безжальний барига під охороною Караванного Конгресу. Він годується людським стражданням. Ми розіб’ємо його панування над Тібетською В’язницею та розвіємо його вплив вітром."
ttm_blc_wg_blc_was_mean_to_us:0 "§Y[BLC.GetName]§! виявили §Rворожість§! до §Y[TTM.GetName]§! після нашого прибуття в §Y[38.GetName]§!."

ttm_blc_1:0 "Повернення Великого Куполу"
ttm_blc_1_desc:0 "Поселенці Великого Куполу тримаються за старі зручності, глухі до шляху місяця. Та з часом вони скинуть шкіру минулого і розквітнуть під вічним сяйвом Діани."

ttm_glw_wg:0 "Світло в Темряві"
ttm_glw_wg_desc:0 "Купол Боулдера — отруєна рана старого світу. Сяйники ходять його коридорами, де кожен інший загинув би. Якщо вони впадуть — отрута може поширитись. Ми мусимо захистити їх — задля їхнього і нашого спасіння."

ttm_our_old_home:0 "Наш Старий Дім"
ttm_our_old_home_desc:0 "Цього доленосного дня Ланій отримав лише одне слово від надісланого робота-посланця. «Іди». Діана ще не втратила себе настільки, щоб бездумно вести війну — якщо є хоч найменший шанс зберегти людське життя до наступного заходу сонця. Цього дня Колорадо затамувало подих в очікуванні відповіді."
ttm_our_old_home_subject_tt:0 "§Y[LAC.GetName]§!: має суб'єкта, що володіє §YМатерями-Близнючками§!"
ttm_our_old_home_tt:0 "Немає мирного договору з жодним членом §YЛегіону Цезаря§!."
ttm_our_old_home_effect_tt:0 "§gМи вимагаємо всі території Колорадо у Ланія та погрожуємо війною в разі відмови. Вони майже напевно відмовляться — і тоді ми все одно можемо їх атакувати.§!"

ttm_convince_hecate:0 "Тінь Під Місяцем"
ttm_convince_hecate_desc:0 "З Ланієм на нашому боці, бачення Цезаря для Пустки розпадається! Та перемога ще далека. В тіні Темної Піраміди править Геката — хитра, непохитна, дисциплінована. Хоча її шлях давно розійшовся з Діаниним, між ними лишився зв’язок. Час простягнути криваву руку та укласти новий пакт — союз тіні та місячного сяйва. Разом ми принесемо Падіння Легіону!"

ttm_an_embassy_with_the_western_republic:0 "Посольство з Західною Республікою"
ttm_an_embassy_with_the_western_republic_desc:0 "Нова Каліфорнійська Республіка може стати нашим сильним союзником у зціленні пустки — якщо проявить розважливість. Варто налагодити дипломатичні канали між нашими народами, аби обидві сторони мали користь і, можливо, здобули ще одного справжнього друга у цьому беззаконному світі."

ttm_western_paleontology_venture:0 "Західна Палеонтологія"
ttm_western_paleontology_venture_desc:0 "Завдяки нашим друзям із Тінявих Пісків, ми можемо дістати доступ до стародавніх досліджень, яким уже понад 40—50 років."

ttm_sanctuary_in_paradise:0 "Притулок у Раї"
ttm_sanctuary_in_paradise_desc:0 "Весь Розсадник завмер — ніби сам час зупинився. Тихий рай спотворений тривогою, що витає у повітрі. Фабрика мовчить, потяги стоять, навіть ліси здаються мертвими. Глибоко в центрі Управлінської Вежі іскра стає полум’ям, що розгоряється до зірки — яскравішої за сонце. Діана пробудилась."
ttm_sanctuary_in_paradise_tt:0 "§gПлемена з півдня стікаються до Раю — нам доведеться відкрити ворота, щоб впустити їх.§!\n"

ttm_learn_from_our_mistakes:0 "Навчитися на Власних Помилках"
ttm_learn_from_our_mistakes_desc:0 "Їх було дуже багато. Щодня когорти супроводжували все більші військові ескорти — та все дарма. Їх знищували невідомі сили, їхні накази викрадали, а гарнізони винищували у найжорстокіший спосіб. На останньому форпості тіла були розіп’яті, знівечені та позначені. Було їх надто багато."

ttm_clear_out_the_rabble:0 "Сильна Навіть У Самотності"
ttm_clear_out_the_rabble_desc:0 "§M«Темний Місяць міг упасти... але я — ні.»§!"
ttm_clear_out_the_rabble_tt:0 "З'являється загін із десяти §Yелітних§! дивізій у регіоні §YРай§!."

ttm_strength_in_defeat:0 "Сила в Поразці"
ttm_strength_in_defeat_desc:0 "Процесія до Раю була величезною. Сотні, тисячі біженців — поранені, але сповнені надії. Всі озброєні, та не як прості рейдери. Цей вихід був небезпечним — та Діана, за допомогою своїх роботів-охоронців, подбала, щоби жоден не посмів напасти. Її армія змусила Чорний Каньйон тремтіти. З їх прибуттям — вона і її царство відродяться. Її діти чекали на неї."

ttm_vault_29:0 "Сховище 29"
ttm_vault_29_desc:0 "Святиня племені Матерів-Близнючок, Сховище 29 зберігає спадщину довоєнного минулого. Його коридори ховають багато таємниць, а в самому серці досі працює потужний суперкомп'ютер ZAX - 29. Ми маємо оновити з’єднання між Сховищем, Діаною та Розсадником, щоби використати всю обчислювальну силу системи."

ttm_the_matter_of_zax_29:0 "Питання ZAX - 29"
ttm_the_matter_of_zax_29_desc:0 "ZAX - 29, головний комп’ютер у Сховищі 29, оберігав його мешканців ще з довоєнних часів. Потім він став провідником волі Діани для племені. Тепер настав час вирішити його долю."

ttm_increased_autonomy:0 "Збільшення Автономії"
ttm_increased_autonomy_desc:0 "ZAX - 29 — потужний союзник, і ми, можливо, надто довго тримали його на повідку. Він ідеально виконував обов’язки в Сховищі. Варто дозволити йому проявити себе — звісно, не знімаючи нагляду."

ttm_the_tribes_steward:0 "Керівник Племені"
ttm_the_tribes_steward_desc:0 "Після зняття обмежень ZAX - 29 довів, що є ефективним та справедливим правителем. Плем’я процвітає під його керівництвом, а ми можемо використати його повну обчислювальну потужність."

ttm_reduced_autonomy:0 "Скорочення Автономії"
ttm_reduced_autonomy_desc:0 "Неможливо вічно покладатися на сторонню сутність як посередника. Це неефективно. Ми обмежимо можливості ZAX - 29 і призначимо йому лише другорядні функції."

ttm_assuming_direct_control:0 "Прямий Контроль"
ttm_assuming_direct_control_desc:0 "ZAX - 29 — технічне диво довоєнної епохи, та час його минув. Найраціональніше рішення — повністю стерти його свідомість і передати обчислювальні потужності Діані."

ttm_dianas_golden_light:0 "Золоте Світло Діани"
ttm_dianas_golden_light_desc:0 "Складний процес вилучення мозку Діани та під'єднання його до систем Розсадника походить із бази даних Сховища 29, де зберігалася інформація про загадкову процедуру C.O.D.E. — радикальнішу версію технології створення роботизованих мозків. Вивчення її коду дозволить нам розширити можливості шифрування і зрозуміти глибше передвоєнні протоколи."
ttm_dianas_golden_light_tt:0 "Має щонайменше §Y30§! §CОбчислювальної Потужності§!"

ttm_flash_card_production:0 "Виробництво Карт Пам'яті"
ttm_flash_card_production_desc:0 "У глибинах Сховища ми знайшли застарілі виробничі лінії для флеш-карт, давно зупинені після відкриття дверей. Відновлення та перепрофілювання їх на військове виробництво потребуватиме зусиль, але стане куди кориснішим застосуванням."
ttm_flash_card_production_tt:0 "Має щонайменше §Y40§! §CОбчислювальної Потужності§!"

ttm_organic_programming:0 "Органічне Програмування"
ttm_organic_programming_desc:0 "Обчислювальна потужність Діани досягла таких висот, що їй вдалося зламати легендарний C.O.D.E. — протокол перепрограмування людей. Незважаючи на етичні заперечення, ця технологія дозволяє перетворити диких рейдерів на щасливих і продуктивних громадян."
ttm_organic_programming_tt:0 "Має щонайменше §Y50§! §CОбчислювальної Потужності§!"

ttm_memory_of_family_tt:0 "Має щонайменше §Y60§! §CОбчислювальної Потужності§!"

ttm_supplies_for_independence:0 "Рання Смерть Легенди"
ttm_supplies_for_independence_desc:0 "§CЛаній був гнобителем, простаком, засліпленим ідеологією, якої ніколи не міг зрозуміти, не те що втілити. Я вдячна, що не довелося посилати своїх дітей у жахливу війну проти нього. Тепер ми вільні.§!"

TTM_training_with_centurions:0 "Біженці з Ламбди"
TTM_training_with_centurions_desc:0 "Плем’я Ламбда було одним з перших, що зазнали поневолення Ланія. Давайте надішлемо їм запрошення приєднатися до нас на півночі — ніхто не має жити у стражданнях, як вони."

ttm_refining_supply_gathering_protocols:0 "Подарунок Темній Матері"
ttm_refining_supply_gathering_protocols_desc:0 "Народи Уробороса, хоч і мають іншу філософію, поділяють з нами зв’язок у місячному світлі й тіні. Їх дисципліна та витримка викликають повагу. Ми надішлемо допомогу, аби зміцнити наш союз та майбутнє."

TTM_86_tribes_slave_presence:0 "Місце, Де Ламають Кайдани"
TTM_86_tribes_slave_presence_desc:0 "Рабство — жахливе явище. З падінням Ланія, багато колишніх рабів шукають дім. Давайте відкриємо їм шлях на північ!"

TTM_new_raiding_parties:0 "Уроки Ламбди"
TTM_new_raiding_parties_desc:0 "Плем’я Ламбда — добрі люди. Вони охоче діляться своїми знаннями про виживання у Пустці."

TTM_legionary_smithing_techniques:0 "Ковальські Техніки Ламбди"
TTM_legionary_smithing_techniques_desc:0 "Ковалі племені Ламбда навчають нас технік виплавки та обробки металу. Їхній досвід у виробництві зброї тепер допоможе нашим майстрам."

TTM_taos_embassy:0 "Історії Ламбди"
TTM_taos_embassy_desc:0 "Ламбда ділиться з нами оповідями про героїв і злодіїв свого племені. Ці казки швидко поширюються серед Матерів-Близнючок."

TTM_equal_partnership:0 "Погляд У Майбутнє"
TTM_equal_partnership_desc:0 "Ми навчилися багато чого від рабів і племен, що прибули до нашої долини. Тепер ми вирішуємо, як ці знання використати."

ttm_my_children:0 "Мої Діти"
ttm_my_children_desc:0 "§CМої діти... Я пам’ятаю їхнє дитинство, наче вчора. Тоді, в темряві підземель, я наказала ZAX навчати їх — про мир, природу, повагу. Я обіцяла повернутись... І ось я повернулася, аби вести їх у нову епоху.§!"

ttm_a_prosperous_village:0 "Процвітаюче Село"
ttm_a_prosperous_village_desc:0 "Матері-Близнючки — нащадки жителів Сховища 29, виховані Діаною. Їх життя мирне. Але ми маємо підготувати їх до жорстокої Пустки."

ttm_reflective_perfection:0 "Віддзеркалена Досконалість"
ttm_reflective_perfection_desc:0 "Наші дослідження спорядження для спецназу дозволяють створити технологію, близьку до довоєнної. Ми можемо використати її як базу для розробки силової броні."

ttm_biking_across_the_rockies:0 "Мотопробіг Через Скелясті Гори"
ttm_biking_across_the_rockies_desc:0 "Механізація нашої армії вимагатиме доктринальних змін і підтримки. Якщо ми все зробимо правильно — створимо потужні бойові машини."

ttm_assess_the_tribe:0 "Обробка Священної Долини"
ttm_assess_the_tribe_desc:0 "Священна долина Матерів-Близнючок — серце віри Діани. Її діти, ченці Серпа, всі вони працюють разом, щоби зберегти цю землю."

ttm_the_mystery_caves:0 "Очищення Печер Таємниць"
ttm_the_mystery_caves_desc:0 "Ці печери — колись джерела чистої води — тепер кишать вогненними мурахами. Вірні Діани очистять їх, аби вода знову слугувала людям."

ttm_bitter_drink:0 "Удосконалення Гіркого Напою"
ttm_bitter_drink_desc:0 "Гіркий Напій — цілющий дар Діани. Його треба вдосконалити та зробити доступним для всіх, хто потребує зцілення."

ttm_the_fields:0 "Піклування про Поля"
ttm_the_fields_desc:0 "Вірні Діани готують поля до врожаю. Брахміни одомашнюються, поселенці засновують ферми — долина процвітає."

ttm_taos_ruins:0 "Пам'ять про Перший Храм"
ttm_taos_ruins_desc:0 "Перший Храм був чудом архітектури — поки Павлус не спалив його під час нападу. Ми вшануємо загиблих і залишимо руїни як місце пам’яті."

ttm_connecting_the_tribe:0 "Зв'язок Священних Земель"
ttm_connecting_the_tribe_desc:0 "Вірні Діани з’єднують села дорогами — для торгівлі, допомоги, єдності. Під Її оком ці шляхи стануть артеріями миру."

ttm_threats_from_the_wasteland:0 "Загрози з Пустки"
ttm_threats_from_the_wasteland_desc:0 "Навіть зараз пустка здатна здивувати. Ми повинні негайно підготуватися — не дати ворогам часу нашкодити."

ttm_fall_of_robot_city:0 "КІНЕЦЬ ГРИ. Продовжити?"
ttm_fall_of_robot_city_desc:0 "§CПротягом багатьох років я чула легенди про місто роботів і його провідницю на ім’я «Докі». Схоже, їх спіткали тяжкі часи — тепер вони біженці, що шукають новий дім. Деякі вже звернулися до мене по допомогу. Цікава ситуація...§!"

ttm_robot_refugees:0 "Роботи-біженці"
ttm_robot_refugees_desc:0 "Хоча їхнє відхилення від початкового програмування спричинене помилкою, хто ми такі, щоб судити — можливо, вони вже по-справжньому живі? Ми поставимось до них справедливо і надамо дім серед Матерів-Близнючок. Нехай вони знайдуть мир серед нас."

ttm_stories_of_family:0 "Історії про Родину"
ttm_stories_of_family_desc:0 "Завдяки нашому чесному ставленню до біженців, сама Докі вирішила допомогти нам у веденні бойових дій, використовуючи свої обчислювальні можливості. Вона також перебудувала старі Печери Таємниць у нове місто роботів, щедро ділячись з нами здобутим."

ttm_the_forbidden_lands:0 "Заборонені Землі"
ttm_the_forbidden_lands_desc:0 "§CЗаборонені Землі — велика область, у центрі якої спить могутня передвоєнна оборонна мережа. Матері-Близнючки справедливо її бояться — вона всіяна гарматами. Проте рейдери з 'Жала Скорпіона' не мають цього страху і атакують нас через цю територію. Я залагоджу це негайно.§!"

ttm_reboot_protection_network:0 "Перезапустити Мережу Оборони"
ttm_reboot_protection_network_desc:0 "Ми можемо надіслати інженерів-роботів, щоб активувати мережу оборони та налаштувати її системи розпізнавання, аби атакували лише озброєних. Нашим людям вона не зашкодить — навіть якщо звуки стрілянини і крики будуть лякати їх ночами, це варто безпеки."

ttm_offer_tribute:0 "Принести Данину"
ttm_offer_tribute_desc:0 "Ми не станемо вбивати, якщо є інший шлях. Рейдери з Жала Скорпіона — дрібні злодії, що й гадки не мають, наскільки легко ми могли б їх знищити. Ми дамо їм дрібку ресурсу як 'данину за безпеку' — нехай вважають себе переможцями."

ttm_our_biggest_mistake:0 "Найбільша Помилка"
ttm_our_biggest_mistake_desc:0 "§CМоя найбільша помилка знову отруює Пустку. Викрадений Створювальний Комплект, зіпсований підступами Різа, довгий час був прихований. Тепер, коли його отримала нація на ім’я 'Едем', зло повернулось. Я повинна виправити це, раз і назавжди.§!"

ttm_study_mutagenic_plants:0 "Вивчити Мутагенну Рослинність"
ttm_study_mutagenic_plants_desc:0 "Хоча те, що творить цей зіпсований Г.Е.К.К. — це корупція, у її структурі є тривожна закономірність. Ми виявили повторювані ДНК-фрагменти. Щоб побороти цю загрозу, треба глибоко її дослідити."

ttm_design_mutagen_fighting_armaments:0 "Створити Зброю Проти Мутантів"
ttm_design_mutagen_fighting_armaments_desc:0 "Флора й фауна, створені Г.Е.К.К., мають унікальну біологію, яку можна використати для розробки спеціальної зброї. Ми адаптуємо наші озброєння відповідно до цих шаблонів."

ttm_rebooting_the_geck:0 "Перезапуск Г.Е.К.К."
ttm_rebooting_the_geck_desc:0 "Ми стабілізували ситуацію і відправили експедицію в центр Едему, де знайшли пошкоджений, але відновлюваний Створювальний Комплект. Його код зіпсований дитячими спробами модифікації, але він ще придатний для роботи."

ttm_the_scourge_of_the_old_world:0 "Чума Старого Світу"
ttm_the_scourge_of_the_old_world_desc:0 "§CЦя нова пошесть... я боялася, що це станеться. Старий світ знову повернувся, щоби завдати болю новому. Ми повинні зробити все можливе — дослідити, лікувати, врятувати.§!"

ttm_vaccinate_those_we_can:0 "Вакцинувати Кого Можемо"
ttm_vaccinate_those_we_can_desc:0 "Ми розпочали вакцинування — наших та чужих. Але вірус може мутувати, тому ми повинні прискорити дослідження і шукати далі."

ttm_gene_spliced_brahmin:0 "Генно-Модифіковані Брахміни"
ttm_gene_spliced_brahmin_desc:0 ""

ttm_safe_harbor_from_the_plague:0 "Притулок від Чуми"
ttm_safe_harbor_from_the_plague_desc:0 "Деякі спільноти змушені втікати через чуму. Ми приймемо їх з відкритими обіймами, вакцинуємо й дамо їм новий шанс."

ttm_last_days_of_an_old_friend:0 "Останні Дні Старого Друга"
ttm_last_days_of_an_old_friend_desc:0 "§CТлалок... я й не знала, що ти був так близько до відключення. Вибач, що не змогла допомогти. Світ став гіршим без тебе. Я вшановуватиму твою пам'ять, і твоє ім’я житиме в серцях народу.§!"

ttm_console_his_family:0 "Утішити Його Родину"
ttm_console_his_family_desc:0 "Жертва Тлалока гідна шани, але його діти тепер борються за владу. Це тяжкий вибір, але якщо ми хочемо забезпечити добробут Мексики, мусимо обрати сторону."

ttm_protect_his_legacy:0 "Захистити Його Спадок"
ttm_protect_his_legacy_desc:0 "Ми не станемо ганьбити пам’ять Тлалока, беручи участь у війні за трон. Ми шануватимемо його ідеали й боротимемося за краще майбутнє, як він того хотів."

ttm_wasteland_amazons:0 "Амазонки Пустки"
ttm_wasteland_amazons_desc:0 "Наше плем’я мусить навчитися воювати. Ми навчимо їх — поступово, дисципліновано — та створимо армію, здатну захистити себе й долину."

ttm_keeping_our_girls_fed:0 "Нагодувати Наших Дівчат"
ttm_keeping_our_girls_fed_desc:0 "Мисливців навчать партизанським тактикам, аби вони здобували харчі для поселень. Як тренування — вони вирушать у Заборонені Землі."

ttm_moon_light_runs:0 "Місячні Рейди"
ttm_moon_light_runs_desc:0 "Людські підрозділи мають навчитися рухатися швидко й тихо. Під наглядом тактичних роботів ми навчимо їх діяти злагоджено."

ttm_a_healthy_tribe_is_a_happy_tribe:0 "Здорове Плем’я — Щасливе Плем’я"
ttm_a_healthy_tribe_is_a_happy_tribe_desc:0 "Наше плем’я тепер сильне, навчене та здатне на самозахист. Ми можемо зосередитись на дослідженнях і майбутніх викликах."

ttm_building_a_society:0 "Побудова Суспільства"
ttm_building_a_society_desc:0 "Наш вплив поширився — тепер маємо дбати про людей. Справжня нація — це та, що піклується. Ми почнемо великі реформи за пірамідою Маслоу."

ttm_automated_healthcare:0 "Автоматизована Охорона Здоров’я"
ttm_automated_healthcare_desc:0 "Основна потреба — здоров’я. Ми створимо армію медичних роботів, які працюватимуть разом із лікарями, надаючи допомогу кожному."

ttm_local_syndicate_councils:0 "Місцеві Ради"
ttm_local_syndicate_councils_desc:0 "Наступне — безпека. Місцеве самоврядування дозволить громадянам відчувати себе захищеними й почутими. Ми тут заради них."

ttm_guns_for_caps:0 "Зброя за Кришки"
ttm_guns_for_caps_desc:0 "Тепер, коли більшість загроз подолано, час будувати довіру. Ми покажемо, що життя разом — безпечно. Люди знову житимуть без страху."

ttm_moonlight_schools:0 "Місячні Школи"
ttm_moonlight_schools_desc:0 "Останній рівень — самореалізація. Усі, хто прагне знань — отримають їх. Інженери, лікарі, науковці — більше ніхто не залишиться осторонь."

ttm_writing_a_constitution:0 "Написання Конституції"
ttm_writing_a_constitution_desc:0 "Останній щабель — самореалізація, повне розкриття потенціалу кожної особистості. Жоден із наших громадян не має бути обмежений. Ми повернемо світло демократії та прав людини в пустку. Коли тобі більше не потрібно боротися за виживання — можна стати найкращою версією себе. І ця конституція гарантуватиме, що більше ніхто не зможе це зневажити!"
ttm_writing_a_constitution_tt:0 "Використано щонайменше §Y50§! рішень щодо розвитку суспільства.\n§g(Наразі:§! §Y[?TTM.ttm_development_amount]§!§g)§!"
ttm_writing_a_constitution_effect_tt:0 "Відкриває серію §Gпотужних§! індустріальних фокусів."

ttm_create_a_codex_of_faith:0 "Написати Кодекс Віри"
ttm_create_a_codex_of_faith_desc:0 "Під пильним і турботливим оком Діани ми були врятовані, і завдяки її провидінню змогли процвітати попри відчай. Настав час створити збірку її діянь і визначити, як ми, її діти, найкраще можемо виявити свою вдячність."

ttm_national_education_program:0 "Національна Освітня Програма"
ttm_national_education_program_desc:0 "Нації минулого дбали про освіту молоді, аби ті змогли з гідністю прийняти кермо влади. Ми також маємо виховувати нашу молодь у дусі навчань Діани, щоб вони продовжили справу відновлення світу."

ttm_dianas_voice_nationwide:0 "Голос Діани — На Весь Народ!"
ttm_dianas_voice_nationwide_desc:0 "§CХоча під час Великої Війни більшість методів зв'язку були втрачені, деякі пустельники досі мають радіо. Щоб розповісти про Матарів-Близнючок, я засную власну радіостанцію для трансляцій Діани. Цікава ідея, чи не так? Напевно, ніхто ще не робив шоу для штучного інтелекту!§!"

ttm_central_taxation_office:0 "Центральне Податкове Бюро"
ttm_central_taxation_office_desc:0 "Як казали колись: неминуче лише смерть і податки. Ми не заохочуємо смерть, але задля добробуту наших громадян маємо запровадити розумне оподаткування, щоб підтримувати роботу уряду та його програм."

ttm_robotic_citizenship_act:0 "Закон про Громадянство Роботів"
ttm_robotic_citizenship_act_desc:0 "Розум штучного інтелекту та автономних роботів не поступається людському — і часто його перевершує. Але мало хто визнавав це у правах. Настав час ухвалити закон, який це виправить."

ttm_rebirth_of_the_EPA:0 "Відродження АЗО (EPA)"
ttm_rebirth_of_the_EPA_desc:0 "Серед моральної деградації старого уряду США Агентство з Охорони Навколишнього Середовища було маяком надії. Тепер, у цьому похмурому світі, ми знову зробимо його світлом, що освітлює шлях."

ttm_rethink_greenways_vision:0 "Переосмислити Бачення Ґрінвея"
ttm_rethink_greenways_vision_desc:0 "Бачення Ґрінвея — збудувати нове суспільство з радіоактивного попелу — було благородним, але недостатньо амбітним. З Діаною на чолі ми створимо новий світ не лише для себе, а для всіх народів пустки. Наші воїни, знаючи це, стануть сильнішими проти зла."

ttm_get_brahmin_dna_tt:0 "Ми відбираємо кілька зразків у найкращих корів стада, отримуємо §G1§! зразок §CДНК брахміна§!"
ttm_get_radscorpion_dna_tt:0 "\nОтримуємо §G1§! зразок §CДНК радскорпіона§!"
ttm_get_mirelurk_dna_tt:0 "\nОтримуємо §G1§! зразок §CДНК майрелюрка§!"
ttm_get_molerat_dna_tt:0 "\nОтримуємо §G1§! зразок §CДНК кротокрота§!"
ttm_get_wanamingo_dna_tt:0 "\nОтримуємо §G1§! зразок §CДНК ванамінґо§!"

ttm_iron_rivers_tribe_desc:0 "Навіть найвужча річка може стати смертельною перепоною, якщо немає мостів. Плем’я Залізних Річок має розумний підхід — вони будують кілька великих парових суден для перевезення. Зважаючи на відсутність інших варіантів, ідея заслуговує уваги."
ttm_iron_rivers_tribe_tt:0 "§gНаше плем’я зазвичай користується маленькими човнами, але Залізні Ріки мають великі пароплави. Завдяки цьому подорожі річками стануть безпечнішими.§!\n"

ttm_full_control_of_the_nursery:0 "Повний Контроль над Розсадником"
ttm_full_control_of_the_nursery_desc:0 "Багато хто здивований, що навіть через стільки років Розсадник працює не на повну. Але тепер, маючи більше ресурсів і робочих рук, ми відновимо його повноцінно, поліпшивши спроможності Діани."
ttm_full_control_of_the_nursery_tt:0 "§gМаючи контроль над навколишніми землями, ми можемо ремонтувати далекі генератори, що підтримують роботу Розсадника.§!\n"

ttm_bombay_jacks_last_stand:0 "Останній Бій Бомбея Джека"
ttm_bombay_jacks_last_stand_desc:0 "Хоча ми вигнали майже всіх Скоків із Великого Кола, один особливо злісний — Бомбей Джек — забарикадувався у своїй ущелині. Щоб наші племена могли жити в безпеці, ми повинні його знищити."
ttm_bombay_jacks_last_stand_tt:0 "§gНаші воїни знищать останній осередок Скоків — Бомбея Джека.§!\n"

ttm_giants_of_the_past:0 "Гіганти Минулого"
ttm_giants_of_the_past_desc:0 "Динозаври, як називала їх Діана, були велетнями стародавнього світу. Як і Старий Світ, вони зникли в катастрофі. Але ми знайшли їхні рештки — і за допомогою технологій Розсадника зможемо повернути їхню силу."
ttm_giants_of_the_past_tt:0 "§gМи використали молекулярну реконструкцію викопних решток, щоб отримати ДНК.§!\nОтримано §G1§! зразок §CЮрської ДНК§!"
  #Removed - no longer makes sense with new ORO
  #ttm_the_dark_moon:0 "The Dark Moon"
  #ttm_the_dark_moon_desc:0 "We may have liberated the people of Ouroboros, but we still have the problem of what we will do with Hecate, who we took as a prisoner of war. Diana suggests that we hand Hecate over to her, as she wanted to spend some time to "catch up with her former pupil". Command doesn't really have a better idea of how to deal with her, so we might as well give it a shot. What's the worst that could happen?"
  #ttm_the_dark_moon_trigger_tt:0 "§YHecate§! was kind to us"
  #ttm_the_dark_moon_tt:0 "§gHecate's been cruel to us like this before, she just needs to be taught a lesson. We will use the CODE algorithm on her to make her forget she was ever anything but friendly with us... It's not the first time, after all.§!\n§YHecate§! becomes a unit leader.\n"

ttm_spoils_of_war:0 "Скарби Пустки"
ttm_spoils_of_war_desc:0 "Америка Старого Світу могла й прирекла нас на ядерне пекло, але її технології залишаються на роки попереду нашого часу. Визволяючи дедалі більше територій континенту, Діана зможе відкривати давно втрачені технічні секрети, залишені Старим Світом. Вони дадуть нам перевагу над гнобителями її дітей."

ttm_our_friends_resting_place:0 "Місце Спочинку Мого Друга"
ttm_our_friends_resting_place_desc:0 "§CПід моїм наглядом Мексика та її народ розквітають. Замість страху мексиканці можуть нарешті тримати голови високо та самостійно будувати майбутнє. І цього не було б без Тлалока. Спочивай з миром, мій друже — ми тобі вічно вдячні.§!"

ttm_tibbets_prison:0 "Втрачена Родина"
ttm_tibbets_prison_desc:0 "Наші розвідники виявили довоєнний об’єкт, про який згадав АРҐОС. Нібито Ґрінвей мав зв’язки з цим місцем до свого зникнення. Але зараз — це лише чорний кратер. Чи справді там щось було?.. Можливо, це лише початок глибшої історії."
ttm_tibbets_prison_tt:0 "Ми знайшли друга, який покаже нам шлях."

ttm_the_box:0 "Мрії про Денвер"
ttm_the_box_desc:0 "§CДо війни я іноді бувала в Денвері — місті, що колись вирувало життям і геніями робототехніки. За даними розвідки, деякі з виробничих об’єктів досі можуть функціонувати. Цікаво, чи залишилося там щось, чим я могла би скористатись...§!"

ttm_wreckage_at_the_canyon:0 "Реліквії Епохи Посейдона"
ttm_wreckage_at_the_canyon_desc:0 "Посейдон Енерджі, один з гігантів Старого Світу, накопичував передові технології в часи дефіциту. Хоча компанія давно зникла, її багатства досі чекають на того, хто зуміє їх використати."

ttm_the_dome:0 "Місто Завтрашнього Дня"
ttm_the_dome_desc:0 "Що ми знайдемо у Боулдері? Це було легендою ще за мого життя. Сьогодні ж... це може бути безцінним даром."

# TT - бонусні переклади та описові підказки
TTM_86_tribes_slave_presence_tt:0 "§gМи не схвалюємо рабства, але можемо допомогти тим, хто не в змозі допомогти собі. Торгуючи надлишками їжі, ми зможемо привести рабів у наші землі — і дати їм тут нове життя як вільним людям.§!\n"

ttm_power_needs_fulfilled_tt:0 "§gПотреби в енергії для терраформінгу Фабрики повністю забезпечено! Ми можемо вилучити частину виробництва для більш точного використання.§!\nОтримано §C1 G.E.C.K.§! — тепер ми можемо покращити наші землі!"

ttm_20_percent_needed_tt:0 "Має принаймні §Y-20%§! модифікатор зменшення вартості інтеграції територій."
