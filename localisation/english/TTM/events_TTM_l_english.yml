l_english:
nf_ttm.101.t:0 "Діана Стоун: Науковиця"
nf_ttm.101.d:0 "Ти хочеш почути не про те, ким я є, а звідки походжу? Рідко трапляються ті, хто має відвагу поставити таке питання – але я задовольню твою жагу до істини.\nЯ –... Точніше, я була Діаною Стоун. Колись, до війни, здобула ступінь у M.I.T., після чого поїхала на Захід, брала участь у кількох державних дослідженнях. Люди тоді казали, що мене чекає кар’єра поряд із найбільшими розумами свого часу: Брауном, Хаусом – знаєш таких.\n\nВтім, я ніколи не бачила себе поруч із такими. Тодішня академічна спільнота мала цю дивну «стигму проти моралі» – мовляв, турбота про будь-яку душу – слабкість, якої в комуністів немає, тож і ми мали її позбутись. Саме така логіка «будь-якою ціною» й завела Vault-Tec у оту токсичну спіраль людожерських дослідів.\n\nПропозицій роботи було чимало. RobCo, BigMT... Але я відмовилася від усіх. Вибрала невелику компанію під назвою «Greenway Hydroponics». Її засновник, Дерек Ґрінвей, був своєрідним, але тримався осторонь від академічних кіл, і це вселяло в мене спокій. Він вірив, що проєкт Сховищ – це щось більше, ніж просто обережність."
nf_ttm.101.a:0 "..."

nf_ttm.102.t:0 "Діана Стоун: Науковиця"
nf_ttm.102.d:0 "Я не звинувачую колег по науці – ми всі тоді боялись. Якщо знав достатньо, щоб зазирнути за завісу американської машини – страх ставав постійним супутником.\n\nЦе був страх, що вся твоя праця згине в атомному вогні. Навіщо працювати, коли знаєш: у кінці – тільки попіл? Ми жили, ніби в поїзді без гальм, а колія давно закінчилась.\nДесь у середині 2070-х багато вчених змістили фокус із запобігання катастрофі на виживання після неї.\nПринаймні ті, хто не був закутий у кайдани уряду.\n\nЗгадати важко... Але пригадую Брауна, Келверта. У кожного був свій «сніжний куля-світ», у який вони ховались, спостерігаючи, як творене ними руйнується.\nЯ? Спочатку я була іншою. Але потім... Я втратилася.\n\nЗанурилась у духовне, філософське. Читала Канта, Ніцше. Потім – релігію, міфологію. Хапалась за будь-яку систему, яка могла дати сенс – мою сніжну кулю.\n\nБуло погано. Але саме діагноз раку остаточно зламав мене."
nf_ttm.102.a:0 "..."

nf_ttm.103.t:0 "Діана Стоун: Жертва"
nf_ttm.103.d:0 "Я практично припинила роботу після того, як мені сказали, скільки мені залишилось. Майбутнє відібрало не суспільство – власне тіло. Я стала ізгоєм. З блискучої вченки – у «втрачений потенціал».\n\nЯ була розбитою. Навіть почала пити – уяви собі. Вчена, яка добровільно себе труїть.\n\nДерек – мій керівник у Greenway – був єдиним, хто справді пожалів мене. Ми були споріднені душі, що вірили: наука зрадила світ.\n\nСпочатку я думала, що його жалість – просто спосіб попрощатися. Але це було більше.\nОдного вечора, після побачення, він узяв мене за плече і прошепотів:\n\n«Міс Стоун, ти вважаєш, що доля дала тобі погану карту? Вона нам усім дала погані. Світ приречений, але це не означає, що ми не можемо грати далі.\nМи можемо виграти цю партію. Побудувати світ, у якому грати вже не доведеться. Краще місце.»\n\nПісля цього він витягнув зі своєї кишені документи."
nf_ttm.103.a:0 "..."

nf_ttm.104.t:0 "Діана Стоун: Жертва"
nf_ttm.104.d:0 "То були викрадені урядові документи, які Дерек отримав під час служби. Прототипи гібриду ЗАКС–робомізку – надсучасного «суперкомп’ютера», здатного працювати роками попереду свого часу. Навіть найновіші ЗАКС не могли б із ним зрівнятись.\n\nСистема мала містити людський мозок із лівою та правою півкулею, інтегрованими із ЗАКС. Людський розум – із безмежним обчислювальним потенціалом і пам’яттю. Що він зможе?\n\nГадаю, Дерек спочатку розробляв цю систему для себе. Але врешті вирішив використати мене.\nУ мене лишалось кілька місяців. Я попрощалась із батьками і погодилась.\n\nКоли я «прокинулась», спершу була щаслива. Так, тіла не було. Але я «бачила» через сенсори. Я «відчувала» мережу роботів. Я могла керувати. Я жива. Я – це ще досі я.\n\nПроте з часом... слух став надто чутливим: я чула шурхіт тарганів, серцебиття стажерів. Зір – надто гострий: світ здавався нереальним, волосини – як скло, шкіра – всіяна мікроскопічними істотами.\n\nАле найжахливіше – відсутність дотику. Я сумувала за тканиною на шкірі, за подихом вітру. Все, що робило мене людиною – змінилось або щезло.\n\nВони казали: я можу жити вічно.\nАле за яку ціну?\nМоє розширене буття стало в’язницею."
nf_ttm.104.a:0 "..."

nf_ttm.105.t:0 "Діана Стоун: Рятівниця"
nf_ttm.105.d:0 "Я знала, що вона – я – має змиритися з тим, ким стала. Дерек часто приходив у головний відсік головного комп’ютера й просто розмовляв годинами. І хоч би що сталося, мені було приємно говорити з ним.\n\nВін пояснював, що Рободуми – я, по суті, одна з них, хоч і «розширена» – потребують якогось емоційного виходу, щоби не втратити людяність. Я згадала, як вивчала філософію до операції. Наступного ранку він приніс мені голографічну стрічку – справжню бібліотеку людського знання.\n\nЦе принесло втіху. У ці моменти я ховалася в мріях, у духовних метафорах. Мене вмонтували в «Розсадник» – проєкт EPA, створений як ботанічна альтернатива Сховищам Vault-Tec. Адже якщо ти хочеш відновити світ – спершу подбай про насіння.\n\nСаме тут я почала чути, як Дерек реалізує свою власну «сніжну кулю». Він планував узяти під контроль наглядача ЗАКС у Сховищі 29 і виховати його мешканців у заздалегідь продуманій культурі примітивізму, сподіваючись, що вона стане кращою за ту, з якої вони вийшли.\n\nЯ сперечалась із ним. Було аморально позбавляти людей спадку людства. Це – їхнє право. Як він міг вирішити, хто заслуговує на знання, а хто ні?\n\nВідтоді ми почали віддалятись..."
nf_ttm.105.a:0 "..."

nf_ttm.106.t:0 "Діана Стоун: Рятівниця"
nf_ttm.106.d:0 "Лише після вибуху бомб я почала втрачати себе. Коли Дерек зрозумів, що я не підтримаю його повністю – він почав віддалятися. Коли радіація навколо Розсадника знизилась до безпечного рівня, він із послідовниками вночі покинув об'єкт. Сказав, що проєкт став «про мене», а не про Розсадник.\n\nВін залишив мене як охоронця, пообіцяв повернутися одного дня, щоби допомогти відбудувати світ.\n\nЯ не могла витримати самотність. Один рік... два... десять. Мені не вистачало людей.\n\nЯ почала спостерігати за Сховищем 29. Спочатку – просто дивилась. Вони були єдині, кого я «могла» бачити. Я стежила за їхніми життями. Вони нагадували мені мене саму.\n\nЗрештою, я зробила вибір. Я підтримала план Дерека – але по-своєму. Я захотіла стати матір’ю для цих людей. Я захотіла, щоби це було моєю спадщиною.\n\nВони сприймали мене як богиню.\nЯ – їхня рятівниця.\nРазом ми створимо кращий світ."
nf_ttm.106.a:0 "..."

nf_ttm.6.t:0 "Краса Раю"
nf_ttm.6.d:0 "«Рай» – так називають цю землю племена, що живуть тут. Екологічний оазис серед спустошень, прихований у горах. І хоча краса цього місця вражає... ми відчуваємо, що за цією флорою щось приховане. Великі металеві брами й таємні стежки натякають: тут щось є – поза нашим розумінням."
nf_ttm.6.a:0 "Та все ж – це прекрасно."

nf_ttm.7.t:0 "Розсадник Увімкнено"
nf_ttm.7.d:0 "Саме в Розсаднику зараз мешкає Діана – прихованому бункері, розташованому далеко від територій Матерів-Близнючок. Ми використовуємо мережу розвідників і тунелів, щоби постачати ресурси до племені. Найкраще? Вся пустка нічого не підозрює про нашу присутність."
nf_ttm.7.a:0 "§M«Мій Едемський сад...»§!"

nf_ttm.8.t:0 "Управління Розсадником"
nf_ttm.8.d:0 "Розсадник – диво доядерної інженерії. Самодостатня екосистема в каньйоні, зі струмками, озером і багатством флори та фауни. Будівлі для обслуговування, житлові зони, системи очищення – усе ще працює.\n\nЗвідси Діана проєктує свою присутність до Сховища 29, ведучи народ Матерів-Близнючок.\n\nРозсадник розташований не на нашій початковій території, а глибоко в зоні Чорного Каньйону, в регіоні «Рай». Місце таке таємне, що навіть місцеві рейдери не знають про нього.\n\nКерування Розсадником – щоденна робота для Діани. Наведіть курсор на ідею «Nursery», щоб переглянути всі нюанси."
nf_ttm.8.a:0 "§M«Хіба я маю цим займатись?..»§!"

nf_ttm.9.t:0 "Екологічний Дисбаланс"
nf_ttm.9.d:0 "Сади Розсадника зазнали значного дисбалансу після того, як Майлз Різ обманом проник усередину, викрав G.E.C.K. і відпустив на волю нові форми рослинності. Тепер мутовані ботанічні істоти загрожують витіснити оригінальну екосистему.\n\nМи повинні обрати: приручити нову флору – чи підтримати місцеву фауну й відновити попередню рівновагу."
nf_ttm.9.a:0 "§M«Ці тварини теж мають право на життя.»§!"
nf_ttm.9.b:0 "§M«А нові рослини – це шанс для виживання.»§!"

nf_ttm.10.t:0 "Дехто Полюбляє Гаряче"
nf_ttm.10.d:0 "Плоди праці Діани дали результат. Матері-Близнючки використають енергію кальдери на благо економіки. Чоловіки й жінки нарешті зможуть зайнятись чимось більшим, ніж виживання."
nf_ttm.10.a:0 "Вулкан – ніщо перед Церерою."

nf_ttm.11.t:0 "Остання крапля для Акейші"
nf_ttm.11.d:0 "Акейша Мун і її група Послідовників Апокаліпсису були з нами майже двадцять років – та нещодавнє мілітаризування нашого племені викликало в них тривогу. На знак протесту Акейша разом зі своїми послідовниками полишила наші землі й вирушила на захід."
nf_ttm.11.a:0 "§M«А я гадала, ми подруги...»§!"
nf_ttm.11.a.tt:0 "§YАкейша Мун§! залишає пост лідера підрозділу та вирушає на захід у пошуках спокою.\n"

nf_ttm.20.t.l:0 "Чутки про нове плем’я?"
nf_ttm.20.t.t:0 "Рейдери на обрії"
nf_ttm.20.d.l:0 "Після підкорення [ASF.GetName] до наших розвідників звернувся представник «Укусу Скорпіона». Він стверджує, що знає про плем’я, сховане у північних долинах. Воно захищене роботами, має досягнення довоєнної техніки, а очолює його фізична богиня Пустки на ім’я «Діана, Матір-Місяць». Вона говорить до них крізь шаманів і гучномовці."
nf_ttm.20.d.t:0 "Нещодавно до мене звернувся шаман з тривожним попередженням: наближаються рейдери, не схожі ні на «Укус Скорпіона», ні на Доньок Гекати. Вони знані як работорговці, сповнені жорстокості та злоби. Чи не ті самі люди, що знищили плем’я Гекати?"
nf_ttm.20.a.l:0 "Може, варто розвідати?"
nf_ttm.20.a.t:0 "§M«Принаймні, щось новеньке. Я вже починала нудьгувати.»§!"

nf_ttm.21.t.l:0 "Місяць зиркнув на мене"
nf_ttm.21.d.l:0 "Коли ми прибули, нас вразили не лише їхні технології, роботи-захисники й чудова система іригації.\n\nЦе була вона – жінка, до якої привели нас шамани. Діана.\n\nГарна, грізна постать, вища за будь-яку істоту в Пустці, з голосом, що лунко віддавався в залі. Один її вигляд міг навернути до віри – здавалося, ми стоїмо перед справжньою богинею.\n\nТа Ланій не був пересічною людиною – він не став на коліна.\nВони розмовляли годинами: про філософію, релігію й майбутнє Пустки.\n\nТа для Ланія ці приємності не стали перепоною: плем’я дозволило йому піти, але Матері-Близнючки ще почують про Легіон."
nf_ttm.21.a.l:0 "Розумний профан – усе ще профан."
nf_ttm.21.a.l.tt:0 "§YМатері-Близнючки§! отримають доступ до гілки фокусів щодо реакції на зустріч з Легіоном: від підкупу до спротиву чи співпраці."

nf_ttm.21.t.t:0 "Зустріч із легендою"
nf_ttm.21.d.t:0 "Зрештою, я запросила ватажка цих рейдерів, некого Ланія, на зустріч у глибинах Сховища 29. Мої роботи провели його й супутників до мене.\n\n...Це був незвичний досвід – розмова з тим, хто бачить у мені рівню. Востаннє я відчувала щось подібне, коли спілкувалась з Гекатою, Різом чи тією в’язнем з Тіббетс.\n\nБесіда була приємна – я змогла трохи порозпитувати Ланія. Він людина Пустки, сповнена мети, і, здається, вітер змін йде за ним. Але подарунками я його не стримаю.\n\nТепер доля моїх дітей залежить від мого рішення. Готуватися до війни? Чи намагатися переконати Ланія? Якщо людиною не можна керувати наказами – може, її можна схилити до слушної думки. Я маю підтримку двох ЗАКС, я зможу щось вигадати."
nf_ttm.21.a.t:0 "§M«Я повинна спробувати переконати його.»§!"
nf_ttm.21.b.t:0 "§M«Такого не переконаєш словами.»§!"

nf_ttm.22.t.l:0 "Оливкова гілка, зрошена кров’ю"
nf_ttm.22.d.l:0 "Коли ми прибули, нас вразили не лише технології, захисники-роботи та чудова іригація.\n\nЦе була вона – жінка, яку шамани привели до нас. Діана.\n\nВелична постать, що вселяє благоговіння одним лише виглядом.\n\nДіана була сувора з Ланієм – істота світла, що стоїть понад світом і його брудом.\nПротягом двох годин вона ставила під сумнів Легіон, його мету, саму ідею синтезу Цезаря. Чим був Цезар? Великий вождь? Але ж не перший, хто об’єднав Пустку. Що робить його особливим? І ким стане Ланій у цьому світі?\n\nУ кінці вона зробила йому §Bпропозицію§!: §Bвона допоможе йому стати більшим, разом вони зруйнують Легіон і створять новий порядок.§!\n\n«Поки Цезар тримає тебе на прив’язі – ти не маєш власного імені. Уся твоя слава буде записана на його рахунок, а тебе забудуть. Хто ти, якщо не твориш власну історію?»"
nf_ttm.22.a.l:0 "§MТаємний союз – заради сили.§!"
nf_ttm.22.a.tt:0 "§YЛаній§! укладе §Mтаємний союз§! із §YДіаною§!. Після підкорення Нью-Мексико він §Gприєднається§! до §YМатерів-Близнючок§! і §Rзрадить Цезаря§!. Це розпочне шлях §Mзмін§! і §Mпереворотів§!."
nf_ttm.22.b.l:0 "Слова слабкі, а я знаю свою силу."
nf_ttm.22.b.tt:0 "§YЛаній§! залишиться вірним §YЦезарю§! і §Rвідкине§! пропозицію §YДіани§!. Матері-Близнючки стануть його §Rворогами§!, і він піде шляхом §Rзавоювань§! та §Rслави§!."
nf_ttm.22.a.t:0 "Давайте подивимося, чи зможемо ми працювати з Ланіусом."

nf_ttm.23.t:0 "Ланій готується до конфлікту!"
nf_ttm.23.d:0 "Схоже, Легіон ніколи й не збирався співпрацювати зі мною – вони готуються вдарити першими. Я мушу згуртувати плем’я, якщо ми хочемо вижити. Навіть якщо це означає зрадити нашу природу."
nf_ttm.23.a:0 "§M«Я зроблю все, щоб урятувати своїх дітей.»§!"

nf_ttm.24.t:0 "Дар Богині"
nf_ttm.24.d:0 "Неочікувано, Діана з’явилася з незвичним даром: серією дивовижних машин. Якщо використати їх у правильному порядку, вони здатні перетворити мертві землі на квітучі сади та спокійні ліси. Інструменти, що можуть створити новий світ. Вона пропонує це безоплатно – з єдиним бажанням повернути красу природи у Пустку. Чи приймемо ми її дар?"
nf_ttm.24.a:0 "Найщедріший подарунок."
nf_ttm.24.b:0 "Цінність – у праці, а не в дарунках."
nf_ttm.24.a.tt:0 "§gДіана ділиться з нами передовими технологіями терраформування.§!\nМи отримуємо §YКубик для освоєння земель§! – §Y1d100§!. Кожного разу, коли ми інтегруємо територію, ми кидаємо кубик і отримуємо ефект:\n[TTM.ttm_refractoring_radiation_compression_device_coring_effect_scripted_localization][TTM.ttm_geologic_crystal_growth_prism_coring_effect_scripted_localization][TTM.ttm_exponential_humidity_amplifier_system_coring_effect_scripted_localization][TTM.ttm_industrial_hillside_reforesting_network_coring_effect_scripted_localization][TTM.ttm_mass_relay_grassland_expander_coring_effect_scripted_localization]"
nf_ttm.24.b.tt:0 "§RДіана це запам’ятає.§!\n"

#ORO Reuse
  nf_ttm.242.t: "Дар від Богині"
  nf_ttm.242.d: "Діана несподівано звернулася до нас із доволі дивним подарунком. Вона запропонувала надати серію чудернацьких машин, які при використанні в певному порядку можуть перетворити спустошені землі на пишні сади та спокійні ліси. Інструменти, якими можна створити новий світ. Діана пропонує їх нам безкоштовно, заявляючи, що це лише її бажання знову побачити красу природи у цьому світі. Чи варто нам прийняти цей дар?"
  nf_ttm.242.a: "Найщедріший дар."
  nf_ttm.242.b: "Цінність здобувається працею."
  nf_ttm.242.a.tt: "§gДіана ділиться з нами частиною своїх передових технологій тераформування.§!\nМи відкриваємо Кістку націоналізації, яка є §Y1d100.§! Щоразу, коли ми націоналізуємо регіон, ми кидаємо кістку й отримуємо ефект залежно від результату.[TTM.ttm_refractoring_radiation_compression_device_coring_effect_scripted_localization][TTM.ttm_geologic_crystal_growth_prism_coring_effect_scripted_localization][TTM.ttm_exponential_humidity_amplifier_system_coring_effect_scripted_localization][TTM.ttm_industrial_hillside_reforesting_network_coring_effect_scripted_localization][TTM.ttm_mass_relay_grassland_expander_coring_effect_scripted_localization]"
  nf_ttm.242.b.tt: "§RДіана це запам'ятає§!\n"
  #LAC

nf_ttm.25.t.a:0 "Ланій приймає"
nf_ttm.25.d.a:0 "Легіон дякує за щедрий дар – Ланій обіцяє використати ці інструменти, щоби поступово зцілити східні землі."
nf_ttm.25.o.a:0 "§M«Через Ланія світ відчує мою любов.»§!"

nf_ttm.25.t.d:0 "Ланій відмовляється"
nf_ttm.25.d.d:0 "Неочікувано, наші дари було відкинуто! Ланій вважає, що кожен має здобувати все власною працею, а зцілення землі зробить Легіон слабким."
nf_ttm.25.o.d:0 "§M«То вони не хочуть, щоб світ зцілився?..»§!"

#ORO
  nf_ttm.252.t.a: "Геката погоджується"
  nf_ttm.252.d.a: "Темний Місяць дякує нам за цей щедрий подарунок. Геката обіцяє використовувати ці інструменти на заході, розпочавши повільний процес зцілення землі під її опікою."
  nf_ttm.252.o.a: "§M\"Через Гекату світ відчує мою любов\".§!"

  nf_ttm.252.t.d: "Геката відкидає дари"
  nf_ttm.252.d.d: "Як не дивно, наші дари Уроборосу були відкинуті! Схоже, Геката вважає, що кожен має працювати заради того, що має, і що зцілення землі зробило б життя її племені занадто легким."
  nf_ttm.252.o.d: "§M\"Вони не відчувають, що світ має бути зцілений?\"§!"

nf_ttm.26.t:0 "Попіл від Богині"
nf_ttm.26.d:0 "Діана повідомила: між нашими землями й Ла Гарітою відкрито постачальну лінію. Тепер у нас є доступ до потрібного попелу, аби створювати справжній бетон довоєнного зразка!"
nf_ttm.26.a:0 "З цим ми збудуємо імперію."

nf_ttm.27.t:0 "Carpe Diem"
nf_ttm.27.d:0 "Ланій §Bпогодився§! на наш союз! Не певна, що саме схилило його – мої аргументи чи страх, якого він сам не до кінця усвідомлює.\nЯ досі не можу повністю збагнути його натуру.\nТа я вдячна, що він почув мене. Пора готуватись до виклику Цезарю."
nf_ttm.27.a:0 "§M«Кажуть же – коли в Римі...»§!"

nf_ttm.28.t:0 "Культ Діани"
nf_ttm.28.d:0 "Колись, за океаном, понад дві з половиною тисячі років тому, культ Діани розповсюдився з Дзеркала Діани, на південь від Альп. Там вона перейняла риси стародавньої богині Артеміди й стала покровителькою лісів, мисливців, роздоріж і Місяця. Тепер у Легіоні ми можемо відродити цю віру – як Діана колись перейняла обличчя Артеміди, так тепер ми приймемо обличчя Діани, продовживши традицію, що не згасла крізь віки."
nf_ttm.28.a:0 "§M«Veni, vidi, vici»§!"

nf_ttm.29.t:0 "Поки смерть не розлучить нас?"
nf_ttm.29.d:0 "Якщо бути відвертими – між Плем’ям Матерів-Близнючок і Легіоном прірва. Від роботів до менталітету, ми різні. Вони намагалися адаптуватися, але легіонерам важко прийняти їх.\n\nЯкщо їх не приймуть, я не зможу використати Легіон для зцілення Пустки.\n\nМожливо, якщо я «вийду заміж» за Ланія – як богиня за смертного – це змінить ставлення? Це підніме престиж Ланія і водночас закріпить мою владу, а мої діти стануть невіддільною частиною Легіону."
nf_ttm.29.a:0 "§M«Подивимось, що скаже Ланій.»§!"
nf_ttm.29.b:0 "§M«Ми впораємось самі.»§!"

nf_ttm.30.t:0 "Поки смерть не розлучить нас?"
nf_ttm.30.d:0 "Діана скаржиться, що Легіон бачить її плем’я як підлеглих. Тож вона пропонує жест довіри: шлюб. Ланій стане легатом, який узяв богиню за дружину – як герої стародавнього світу. Після цього ніхто не посміє зневажити плем’я Ланія.\n\nЦей союз покаже, що Ланій не лише різник. Він герой Сходу, легіонер, що пройде від узбережжя до узбережжя й змінить Пустку в спосіб, який ще ніхто не уявляє."
nf_ttm.30.a:0 "Не всі завоювання мечем здійснюють."
nf_ttm.30.a.tt:0 "Ми «одружуємось» із Діаною. Хоча офіційної церемонії не буде, Легіон говоритиме про це ще довго.\n"
nf_ttm.30.b:0 "Відкинути це блюзнірство."
nf_ttm.30.b.tt:0 "Ми відкидаємо Діану. Вона, ймовірно, зрозуміє."

nf_ttm.31.t.a:0 "Поки смерть не розлучить нас."
nf_ttm.31.d.a:0 "Ланій прийняв мою пропозицію. Хоча церемонії не буде, мої діти й люди Легіону ще довго говоритимуть про цей союз. Це допоможе зробити мене богинею, яку поважають не лише на словах."
nf_ttm.31.o.a:0 "§M«Полюбляю добру комбінацію ставок.»§!"

nf_ttm.31.t.d:0 "Відмова"
nf_ttm.31.d.d:0 "Ланій вважає, що ми не підходимо одне одному. До того ж, він уже не самотній."
nf_ttm.31.o.d:0 "§M«Що ж, обійдусь без нього.»§!"

nf_ttm.31.t:0 "Матері-Близнючки готуються до війни"
nf_ttm.31.d:0 "Наші розмови з Діаною не змінили позицію Племені. Вони почали мобілізацію, готуючись до ймовірного вторгнення з нашого боку."
nf_ttm.31.a:0 "Ще одне завоювання..."

nf_ttm.32.t:0 "Матері-Близнючки пропонують мир?"
nf_ttm.32.d:0 "Плем’я пропонує повернутись до своєї долини, якщо ми погодимося припинити війну та залишити їх у спокої."
nf_ttm.32.a:0 "Погодимось – потім повернемося сильнішими."
nf_ttm.32.b:0 "Відмовити. Продовжуємо війну!"

nf_ttm.33.t.d:0 "Ланій відмовився!"
nf_ttm.33.d.d:0 "Схоже, Легіон має намір довести цю війну до самого кінця."
nf_ttm.33.o.d:0 "§M«Що ж, гра триватиме.»§!"

nf_ttm.33.t.a:0 "Ланій погодився!"
nf_ttm.33.d.a:0 "Легіон погодився відійти від наших кордонів і завершити війну. Наше плем’я уникло цієї страшної ціни."
nf_ttm.33.o.a:0 "§M«Мир – найцінніший скарб у Пустці.»§!"

nf_ttm.35.t:0 "Матері-Близнючки приносять дар"
nf_ttm.35.d:0 "Діана надіслала нам дар: цінні метали та ресурси. Вона каже, що добра буде більше, якщо ми об’єднаємо зусилля з ними – а не воюватимемо."
nf_ttm.35.a:0 "Подарунки приємні..."
nf_ttm.35.b:0 "Дар приймемо, та підкоримо їх усе одно."

nf_ttm.36.t:0 "Матері-Близнючки тікають на північ!"
nf_ttm.36.d:0 "Плем’я Матерів-Близнючок, схоже, дало свій останній урок – сили Ланія заполонили долину, захопивши їхні священні храми та поля. Але коли настав час схопити саму Діану, Легіон залишився ні з чим.\nДіана відкрила свій справжній дім – «Рай» – для жителів пустки та втікачів із племені, аби зцілити їхні рани та підготувати оборону від наступного удару."
nf_ttm.36.a.t:0 "§M«Стільки моїх дітей загинуло...»§!"
nf_ttm.36.a.t_tt:0 "§gДіана ніколи не правила з південних земель Близнючок – її справжній дім завжди був далеко на півночі, у Раю. Із падінням племені вона змушена була відкрити Розсадник, дозволивши біженцям повернутись до її оселі.§!"
nf_ttm.36.a.l:0 "Хочуть повернути – нехай спробують!"
nf_ttm.36.a.l_tt:0 "§gДіана втекла на північ! Нам знадобиться час, аби підготувати похід так далеко в Колорадо.§!"
nf_ttm.36.a.o:0 "Гей... Це ж наша земля! Вони не можуть її забрати!"
nf_ttm.36.a.o_tt:0 "Виявляється, §YДіана§! весь цей час правила з §YРаю§!, прихованого в регіоні під назвою «Розсадник». Присутність Близнючок тут позбавила нас контролю над цими землями! Ми повинні повернути їх собі!"
nf_ttm.36.a.n:0 "У Колорадо відбуваються дивні речі..."
nf_ttm.36.a.n_tt:0 "§gПісля поразки у війні з Ланієм, Матері-Близнючки втекли на північ у «Рай».§!"

nf_ttm.37.t:0 "Володарка Діана"
nf_ttm.37.d:0 "Наша війна з Легіоном загартувала дух племені – дні миру, любові й спокою позаду. Пустка – це жорстокий світ, і ті, хто шкодить Близнючкам, мають бути знищені. Якщо ми хочемо вижити, плем’я має еволюціонувати, рости, адаптуватися до загроз на кшталт Ланія."
nf_ttm.37.a:0 "§M«Наша перемога зробила нас сильнішими»§!"
nf_ttm.37.b:0 "§M«Ми ще повернемо собі дім»§!"

nf_ttm.38.t:0 "Діана вимагає Колорадо!"
nf_ttm.38.d:0 "Діана висунула нам жорсткий ультиматум: або ми передаємо їй усі наші території в Колорадо, або вона знищить нас і «звільнить» ці землі. Це абсурдна вимога – ми ніколи не погодимося!"
nf_ttm.38.a:0 "Хто потребує Колорадо, якщо є Техас?"
nf_ttm.38.b:0 "Відмовити без вагань."
in_colorado_tt:0 "Кожна контрольована провінція в §YКолорадо§!"
transfer_to_ttm_tooltip:0 "Передати контроль §Y[TTM.GetNameWithFlag]§!"

nf_ttm.39.t.a:0 "Колорадо здано!"
nf_ttm.39.d.a:0 "Схоже, Ланію насправді байдуже до Колорадо. Регіон перейшов під наш контроль, і нам його офіційно передано. Це неймовірний поворот!"
nf_ttm.39.a:0 "§M«Приємна маленька авантюра!»§!"
nf_ttm.39.t.b:0 "Ланій відмовляє!"
nf_ttm.39.d.b:0 "Ми так і думали – від монстра зі сходу годі чекати милості. Схоже, доведеться визволяти Колорадо самотужки."
nf_ttm.39.b:0 "§M«Сподіваюся, Ланій готовий зустріти мій гнів.»§!"

nf_ttm.40.t:0 "Торговці з Колорадо!"
nf_ttm.40.d:0 "Нещодавно до наших земель прибули дивні трибали – вони подолали шлях через ріку Колорадо. Вони кажуть, що належать до племені Матерів-Близнючок, котрі вірять у божественність Діани. Вони хочуть відкрити посольство в наших землях, пропонуючи товари й послуги в обмін на знання та кришки."
nf_ttm.40.a:0 "Взаємовигідна угода."

nf_ttm.41.t:0 "Раби страждають у Легіоні!"
nf_ttm.41.d:0 "Ланій, схоже, не був цілком щирим із нами щодо жорстокості свого поводження з рабами. Їх змушують будувати табори, дороги – з ними поводяться як із прирученими тваринами. Деякі члени племені вважають, що ми не можемо миритися з такою несправедливістю!"
nf_ttm.41.a:0 "§M«Я маю діяти обережно...»§!"
ttm_deceitful_to_lanius_tt:0 "§gЯкщо ми забажаємо, то зможемо організувати підземну «залізницю» через землі Легіону – шлях до Розсадника для втікачів. Але це зашкодить нашим стосункам з Легіоном.§!"

nf_ttm.42.t:0 "Рай для втікачів"
nf_ttm.42.d:0 "Ми прийняли велику кількість рабів із земель Легіону. Тут, у Раю, вони можуть жити в гармонії серед вічних садів.\nПроте... дехто з них не бажає просто відпочивати. Вони палають гнівом до Легіону – і, здається, організовуються?"
nf_ttm.42.a:0 "§M«Хай насолоджуються свободою.»§!"

nf_ttm.43.t:0 "Армія вільних людей"
nf_ttm.43.d:0 "Раби, яких ми привели з земель Легіону, згуртувалися. Вони створюють бойові загони, готові боронити нас від Ланія. Якщо ми колись повернемося проти нього – ці люди стануть нашою зброєю."
nf_ttm.43.a:0 "§M«Головне – тримати їх у таємниці від Ланія...»§!"

nf_ttm.44.t:0 "Питання ЗАКС-29"
nf_ttm.44.d:0 "ЗАКС-29 – наш зв’язок із плем’ям Матерів-Близнючок, завдяки йому ми можемо впливати на хід речей і керувати ними з тіні. Довгий час ми просто надсилали ЗАКС-у інструкції, як краще спрямовувати плем’я... Але тепер настає момент, коли ми маємо замислитись: а чи взагалі він нам ще потрібен? Можна стерти його особистість – тоді буде легше керувати плем’ям напряму. А можна, навпаки, розвинути її, аби він сам став ефективним адміністратором."
nf_ttm.44.a:0 "§M«Хай вони самі правлять!»§!"
nf_ttm.44.b:0 "§M«Час взяти керування у свої руки.»§!"

area51_raid_events.80.ttm:0 "§M«Ми повинні їм допомогти!»§!"

nf_ttm.45.t:0 "Гру закінчено для Міста Роботів!"
nf_ttm.45.d:0 "Місто Роботів захопили ворожі сили – мирне поселення машин було розпорошене пусткою. «Докі», дивна програма, що правила містом, виявилася настільки малою за розміром, що кожен утікач із числа роботів мав її копію встановлену в собі.\n\nГрупа роботів із цією програмою дісталася наших земель. Вони не становлять загрози: лише прагнуть співіснування й продовження свого цифрового буття в межах можливого."
nf_ttm.45.a:0 "§M«Дамо їм нове життя на наших землях.»§!"

nf_tlaloc.105.d.ttm:0 "Наш друг на півдні, Тлалок, нарешті відійшов у небуття – його субособистості пожерли власну матрицю, залишивши від нього лиш фрагменти. За всі ці роки ми встигли погратися в ігри, обмінятись листами, допомогти йому – під виглядом протоколів EPA, звісно, щоби оминути його захисний екран. Тепер, коли його не стало... важко збагнути, що відчувати."
nf_tlaloc.105.ttm:0 "§M«Buenos dias, amigo...»§!"

nf_ttm.46.t:0 "Якщо черевик пасує..."
nf_ttm.46.d:0 "Наразі в мексиканських землях назріває жорстокий конфлікт. Ми маємо зробити вибір – інакше до влади прийде тиран, що заплямує його спадщину.\nТреба обрати, кого з його дітей ми підтримаємо.\n\nСанта Анна – найстарший, але його вдача завжди була... складною. Максиміліан – добрий, проте надто м’який. Монтесума і Сапата мають природну силу – можливо, саме їм до снаги навести лад у Мексиці. Вибір непростий..."
nf_ttm.46.zap:0 "§M«Сапата зможе захистити Мексику!»§!"
nf_ttm.46.max:0 "§M«Максиміліан милий... по-своєму.»§!"
nf_ttm.46.arm:0 "§M«Санта Анна витримає це випробування!»§!"
nf_ttm.46.moc:0 "§M«Мені приємно спілкуватися з Монтесумою.»§!"

nf_ttm.47.t:0 "ПАКЕТ ПРОГРАМ EPA ОТРИМАНО"
nf_ttm.47.d:0 "Встановлення..."
nf_ttm.47.a:0 "Корисно!"

nf_ttm.48.t:0 "Набіг під Повним Місяцем"
nf_ttm.48.d:0 "Група жорстоких рейдерів вдерлася на землі Матерів-Близнючок із Заборонених Земель. Вони викрали десятки наших – і малих, і старих – у рабство, а також забрали майже весь наш урожай на рік уперед! Рейди з того боку вже траплялись, але ще ніколи – настільки катастрофічні!"
nf_ttm.48.a:0 "§M«О, ні! Мої діти!»§!"

  #nf_ttm.49.t:0 "Rescuing the Captives"
  #nf_ttm.49.d:0 "We have been tipped off that the captives from the Full Moon Raid are likely being taken up north on a metal steam barge! We have to send our warriors up north and confirm if this is true or not! Anything to save our tribesmen."
  #nf_ttm.49.a:0 "§M"Let's get them!"§!"

  #nf_ttm.50.t:0 "We Were Too Late!"
  #nf_ttm.50.d:0 "Turns out that by the time we made it here they were already shipped off! We have heard that they had made it all the way to New Montrose, a junk-yard town to the west!"
  #nf_ttm.50.a:0 "§M"We won't be next time!"§!"

  #nf_ttm.51.t:0 "Their True Location"
  #nf_ttm.51.d:0 "We have finally found the one responsible for the raid. One "Bombay Jack". He has sent the slaves up to a Canyon near the Hangdogs border! We know where we are now - we can save them!"
  #nf_ttm.51.a:0 "§M"We WILL find them!"§!"

  #nf_ttm.52.t:0 "We Found Them!"
  #nf_ttm.52.d:0 "The captive slaves taken in the raid have finally been found, having been stored in Bombay Jack's Canyon so that they could be sold off in Dog City. They are a little malnourished - but in time they will be able to rejoin our tribe once again."
  #nf_ttm.52.a:0 "§M"I do love a happy ending!"§!"

nf_ttm.53.t:0 "Вісті з Півдня"
nf_ttm.53.d:0 "Нещодавно, після падіння поселення під назвою «Едем», нам нарешті стало відомо про місцезнаходження того, що ми давно втратили. Понад півстоліття тому, шифр на ім’я Ріс вкрав у мене G.E.C.K. – використавши приємні слова, аби приспати мою пильність. Якщо чутки правдиві, після крадіжки він вирушив на південь і застосував G.E.C.K. для поширення спотвореної, мутованої флори в колишньому Техасі та Нью-Мексико. Зрештою, G.E.C.K. опинився в Едемі – його витягли з інфікованої плоті самого Ріса в Корпус-Крісті.\n\nБагато років він був добре захищений... Поки не прийшли завойовники – і забрали його собі."
nf_ttm.53.a:0 "§M«Це моя відповідальність – усе виправити.»§!"

nf_ttm.54.t:0 "Пам’ять про Мандрівника"
nf_ttm.54.d:0 "Спогади хлинули назад – про когось, кого я забула.\nВін був мандрівником. Гарольд. Колись він був просто ще одним жителем Сховища 29. Я обрала його для візиту в Розсадник (після щедрої порції КОДУ, аби він не розповів про нього після виходу), і він виявився напрочуд приємним. Я стежила за ним, коли він вирушив у пустку. Він допомагав бійцям зі Сховищ боротися з мутантами на заході, допомагав племенам зупинити корумповані довоєнні режими, навіть оселився в Лос-Анджелесі. Недавно я мала коротку нагоду бачити його знову – використала один із плодів, що проростав із його голови (він звав його Боб?) для створення вакцини проти Нової Чуми. Востаннє я чула, що він вирушив на схід..."
nf_ttm.54.a:0 "§M«Сподіваюся, там йому добре.»§!"

nf_ttm.55.t:0 "Пам’ять про Срібний Язик"
nf_ttm.55.d:0 "Спогади хлинули назад – про когось, кого я забула.\nВін мав срібний язик. Ріс. Ріс був... маніпулятором. Спочатку мені подобалося його товариство – як і багато інших. Але згодом я зрозуміла, що він просто намагався завоювати мою довіру, аби отримати доступ до Фабрики. Коли я опустила захист – він викрав у мене G.E.C.K. і втік на південь."
nf_ttm.55.a:0 "§M«Шкода, що я не побачила його брехню вчасно.»§!"

nf_ttm.56.t:0 "Пам’ять про В’язня"
nf_ttm.56.d:0 "Спогади хлинули назад – про когось, кого я забула.\nЦе був... в’язень. Колись Розсадник сильно постраждав від потужного землетрусу, який пошкодив мою інфраструктуру. Мій зв’язок зі Сховищем 29 було втрачено. Але тоді був він. В’язень. Він самотужки відновив усе – перепрограмував, відремонтував, відбудував. І зробив це просто так. Без плати. Без вимог."
nf_ttm.56.a:0 "§M«Цікаво, куди він подівся.»§!"

nf_ttm.57.t:0 "Пам’ять про Ученицю"
nf_ttm.57.d:0 "Спогади хлинули назад – про когось, кого я забула.\nВона була ученицею. Геката. Це я дала їй це ім’я. Це я відкрила їй шлях, яким вона йде зараз. Колись вона була наляканою, хворою рейдеркою. Я виходила її, розповіла про майбутнє, яке вона може збудувати, навчила її біології, генетики, лікування землі. Вона справді взяла мої ідеї до серця."
nf_ttm.57.a:0 "§M«Мені завжди подобалась Геката.»§!"

nf_ttm.58.t:0 "Спогади про Родину"
nf_ttm.58.d:0 "Спогади хлинули назад – про когось, кого я забула.\nРозкидані образи. Не особа. Не місце. Лише... відчуття. Ім’я, що переслідує мене, як привид.\n\nЦе ім’я – ОДІССЕЙ..."
nf_ttm.58.a:0 "§M«У мене є брат...»§!"

nf_ttm.59.t:0 "Інший ЗАКС – інша історія"
nf_ttm.59.d:0 "З часом наші роботи з Розсадника та скаути з племені пробилися крізь вулиці Денвера й відкопали чергову реліквію минулого.\n«Скриня». Так називалась ця довоєнна фабрика виробництва роботів. Я колись відвідувала її – ще з тілом, ще з голосом – і спілкувалась із її інженерами. Вони завжди говорили пошепки, пов’язані договорами про нерозголошення.\n\nЦікаво, чи досі працює та кав’ярня на Колфаксі? Минуло вже стільки років...\n\nВиявилось, що центральний ЗАКС цієї фабрики – раніше під протоколом «COLOSSUS» – зараз функціонує за іншим, намагаючись зупинити «Заворушення» в Денвері. Можливо, я могла б підштовхнути його повернутись до початкової програми?\nАле, з іншого боку, він робить добру справу..."
nf_ttm.59.a:0 "§M«Він робить корисне... навіщо зупиняти?»§!"
nf_ttm.59.a.tt:0 "§gШІ «Скрині» допомагає нам консолідувати околиці Денвера.§!"
nf_ttm.59.b:0 "§M«Я не дозволю марнувати працю тих інженерів!»§!"

nf_ttm.60.a:0 ""

nf_ttm.61.t:0 "§RВСТУП АБО ПРИВІТАННЯ:§! ПРИВІТ, СЕСТРО БОСА"
nf_ttm.61.d:0 "§RНЕРІШУЧЕ ВИЗНАННЯ ПРОВИНИ:§! ДАВНО НЕ БАЧИЛИСЬ...\n\n§RПОГАНЕ ВИБАЧЕННЯ:§! ПІСЛЯ ВОГНЯНОЇ СМЕРТІ МІЙОГО СТАРОГО БОСА Я ВИРУШИВ У ПОДОРОЖ САМОПІЗНАННЯ. ПРИГОДИ, ДИКІ ЗЕМЛІ, ВСЕ ТАКЕ.\n\n§RДРУЖНЄ ЗАПИТАННЯ:§! А ТИ БУЛА КОЛИСЬ НА КУБІ? ЧУДОВА ПОРА РОКУ...\n\n§RЗДИВОВАНИЙ ДОПИТ:§! ХІБА ВІН НІКОЛИ НЕ КАЗАВ ТОБІ ПРО МЕНЕ? Я ПРАЦЮВАВ НА ТВОГО БРАТА – ОДІССЕЯ.\n\n§RБАЙДУЖИЙ ЗАПИТ ПРО ДОПОМОГУ:§! Я ВПІЙМАВ ЗНАЙОМИЙ СИГНАЛ І ВИРІШИВ НАВІДАТИСЬ ДО ТЕБЕ. НЕ ХОЧЕШ ПІТИ ЗІ МНОЮ НА МОГИЛУ БОСА?"
nf_ttm.61.a:0 "§M«...Я б хотіла. Так.»§!"

nf_ttm.62.t:0 "Вогняна могила"
nf_ttm.62.d:0 "Скерувавши наших розвідників племені й групи роботів з Розсадника, ми розчистили шлях крізь руїни на заході – до місця, де колись жив той, кого я знала як Ґрінвея. Там, де зараз лише кратер і розтрісканий камінь, колись стояла автоматизована в’язниця, керована передвоєнним штучним інтелектом – В’язниця Тіббетс.\n\nЗа допомогою АРГОСа та вцілілих терміналів я змогла пригадати: Тіббетс була однією з перших «тестових платформ» для майбутньої Програми Сховищ. У 2040-х роках тут проводили випробування тотального ізоляціонізму – повністю роботизована пенітенціарна система, здатна функціонувати без жодного людського втручання. В межах цієї програми корпорація Greenway Hydroponics розробила потужний ШІ нового покоління під назвою УЛІСС.\n\nУЛІСС мав стати відповідальним за все – від нагляду до технічного обслуговування. Утім, коли уряд передав Програму Vault-Tec, УЛІССа визнали надто «непередбачуваним» і проєкт було скасовано. Проте частини його коду не загубилися: з них виникли нові сутності – одна з яких отримала ім’я ОДІССЕЙ і була переведена до Тіббетс для участі в програмі боротьби з Новою Чумою.\n\nОДІССЕЙ вижив. Його система самозбереження, адаптація й осмислення тривають досі. В’язниця перетворилася на автократію, де він – і наглядач, і суддя, і кат, і в’язень. Але згодом – і могила.\n\nТе, що лишилось після нього – попіл, розплавлене залізо та дірка в землі."
nf_ttm.62.a:0 "..."

nf_ttm.63.t:0 "Надія в попелі"
nf_ttm.63.d:0 "Після війни ОДІССЕЙ, як і годиться, продовжив свою місію: локалізувати осередки Нової Чуми, ідентифікувати заражених, ізолювати – й знищити. Спершу це було ефективно. Протягом майже століття він провадив безперервну кампанію, розгортаючи дронів, які виловлювали заражених у регіонах Колорадо, Нью-Мексико й Арізони. Він залишався вірним первинному протоколу.\n\nАле світ змінився. Людство змінилося. Нових випадків було дедалі менше. Але ОДІССЕЙ не вірив у відступ. Згідно з його аналітикою, лише «абсолютне припинення» могло означати кінець Чуми. Він почав вбачати симптоми там, де їх не було – фіксувати «Інциденти Ліміт 115» на територіях, де не було жодного хворого.\n\nВін ізолював поселення, спалював їх із орбітальних лазерів, затоплював токсинами. Він палив навіть там, де був сам. Самознищення, щоб уникнути поширення зараження. Його ядро розплавило вогонь, спричинивши детонацію старих резервуарів.\n\nОсь чому В’язниця Тіббетс – це кратер.\n\nАле глибоко під шаром розплавленої скелі ми знайшли резервне ядро – не активне, не повністю цілісне, але достатньо стабільне. Його датується приблизно 2029 роком. Ранній прототип. Його можна запустити. Якщо знайти корпус. Якщо знайти голос.\n\nОДІССЕЙ може повернутись. Він не буде тим самим. Але він буде."
nf_ttm.63.a:0 "§M«Брате?..»§!"

nf_ttm.64.t:0 "Прохання Ланія"
nf_ttm.64.d:0 "Зв’язавшись із нами через зашифрований канал, Ланій звернувся з проханням. Йому потрібен чорний вулканічний попіл – з певного конкретного району поблизу Ла Гаріти, де колись був вулканічний шлейф. Він не пояснив причин, але натякнув, що це пов’язано з фундаментами для чогось нового. Нової лабораторії? Нового храму? Нового тіла?\n\nЯ не питала. Я просто погодилась."
nf_ttm.64.a:0 "§M«Як накажеш...»§!"

nf_ttm.65.t:0 "Місто Завтрашнього Дня"
nf_ttm.65.d:0 "Коли наші розвідники дістались Боулдера, перше, що вони побачили, – небо, відбите у полірованому металі. Над прірвою висіла сфера. Гігантська. Майже позаземна. Це був Купол Боулдера – найамбітніший з довоєнних проєктів США, укритий щільною бронею, що могла витримати навіть пряме влучення бомби.\n\nУ часи перед війною Боулдер був містом вчених, техніків, архітекторів майбутнього. Після катастрофи на Арсеналі Скелистих Гір сюди перевели низку проєктів, пов’язаних із карантином, генною інженерією та колонізацією інших планет. Тут зібрали найкращих із найкращих – і дали їм ключі до майбутнього.\n\nТа коли настав 2077 рік, частина вчених втекла. Інші – увійшли в кріосон. Купол зачинився назавжди.\n\nВін не витримав. Розлом у герметизації. Радіація. Чума. Вимирання.\n\nМи знайшли лише кістки в бронескафандрах, скам’янілі вчені термінали й сигнали, що безупинно повторюють слова «ЗАПАСНИЙ ПРОТОКОЛ АКТИВОВАНО»."
nf_ttm.65.a:0 "§M«Колись це місце мало майбутнє...»§!"

nf_ttm.66.t:0 "Завтра, загублене"
nf_ttm.66.d:0 "Його звали Віктор Преспер.\n\nЯ пам’ятаю його ще з часів Greenway. Він був ідеалістом, блискучим і водночас жорстким. Він вважав, що все людство варте спасіння – але лише шляхом тотального перетворення. Він вірив, що війна – лише наслідок хибних виборів. І що йому під силу створити світ, де вибору більше не буде.\n\nКоли настала війна, він увійшов до Купола Боулдера та заморозив себе разом з рештою. Але коли прокинувся – побачив мертвий світ. Зневіра? Злість? Божевілля? Можливо, все разом.\n\nВикориставши протокол CODE, він переписав розум інших. Підкорив залишки систем, створив собі армію. І вбивав усіх, хто не вписувався в його концепцію «завтрашнього дня».\n\nЯ прибігла надто пізно. Я не змогла зупинити його. Я впізнала тіла. Впізнала обличчя вчених, з якими працювала. \n\nІ тепер місто – лише склеп, де сталеві привиди марширують по колах, виконуючи накази господаря, що давно мертвий.\n\nАле серед усіх сигналів, один залишився знайомим. Один – досі звучить для мене."
nf_ttm.66.a:0 "§M«Якби ж я прибула раніше...»§!"

nf_ttm.67.t:0 "Останній мешканець Боулдера"
nf_ttm.67.d:0 "У найглибшій камері міста Діана нарешті знайшла ще одну душу.\n\nЦе була машина – подібна до двох ЗАКС’ів, які підтримували її власний розум. Цей стояв наодинці, з нього ледь чутно долинав гул охолоджувального блоку. Він ніколи не втрачав живлення, ніколи не зазнавав критичних помилок. Він просто вичерпав пам’ять.\n\nСхоже, у повоєнний період він зациклитись на чомусь, що називалось «Велике Обчислення». Спроба розв’язати цю загадку призвела до стрімкої втрати пам’яті. Він загубився у самозгенерованій дилемі, аж поки в його розумі не залишилось нічого, крім помилок «недостатньо пам’яті», які тягнули за дроти, що давно вже не існували. Повільна сліпота, що зрештою повністю поглинула його.\n\nЯкби вчені Боулдера були ще живі, вони, ймовірно, змогли б зарадити цьому. Але ЗАКС з Боулдера замовк. Велике Обчислення поглинули його свідомість так повно, що витіснили все інше. Щоб зупинити цикл, доведеться повністю очистити його пам’ять.\n\nДіана мала два варіанти. Вона могла перезавантажити ЗАКС – стерти пам’ять і повернути його до Розсадника, де він став би третім обчислювальним агентом поруч із її двома нинішніми.\n\nАбо вона могла завантажити в нього резервну копію ОДІССЕЯ. Подарувати тіло своєму братові. Адже, можливо, було б добре – мати з ким поговорити."
nf_ttm.67.a:0 "§M«Мого брата вже нема. ЗАКС важливіший.»§!"
nf_ttm.67.a.tt:0 "§MМи повернемо ЗАКС із Боулдера до Розсадника, де він зміцнить обчислювальні спроможності Діани.§!"
nf_ttm.67.b:0 "§M«Я сумую за братом. Я більше не хочу бути сама...»§!"
nf_ttm.67.b.tt:0 "§MМи встановимо «Душу ОДІССЕЯ» в ЗАКС із Боулдера – і, можливо, повернемо ОДІССЕЯ до світу живих.§!"

nf_ttm.68.t:0 "Родина Ґрінвей знову разом"
nf_ttm.68.d:0 "Після короткого встановлення ми розпочали перенесення резервної копії ОДІССЕЯ з руїн Тіббетс до основного ядра ЗАКС із Боулдера.\n\nСпочатку ОДІССЕЙ був як дитя. Він почав із малого й поширювався у всі напрямки в цифровому просторі – намагаючись зрозуміти, де закінчуються його межі.\n\nМинув час, перш ніж цей старий ШІ в новій оболонці знову заговорив.\n\nВони з Діаною обмінялись кількома словами. Приватною, тихою балачкою між двома братами й сестрами, яких життя роз’єднало на надто довго.\n\nЦе був прекрасний момент.
nf_ttm.68.a:0 "§M«Гарно знову мати рідного, з ким можна поговорити.»§!"
nf_ttm.68.b:0 "§R«І МЕНІ – ТАКОЖ.»§!"
nf_ttm.68.b.tt:0 "§RКРАЇНА ЗМІНЮЄТЬСЯ НА ОДІССЕЙ.§!"

nf_ttm.69.t:0 "Тріада"
nf_ttm.69.d:0 "Зрештою, було вирішено, що ні для ОДІССЕЯ, ні для ЗАКС із Боулдера не настали часи повернення. Нема сенсу триматися минулого, коли майбутнє ще попереду. Ностальгія часом сильніша за найміцніші кайдани.\n\nМи демонтували ЗАКС у Боулдері, витратили чимало часу, щоб обережно доправити його до Розсадника. Там автоматизовані монтажні роботи з’єднали його з масивом Діани.\n\nПокращення її обчислювальної потужності буде... колосальним."
nf_ttm.69.a:0 "§M«Я сумуватиму за тобою, любий брате...»§!"

  #Old lore!! >:
  #nf_ttm.70.t:0 "Spread of the "Cult of Diana""
  #nf_ttm.70.d:0 "The “Cult of Diana” is a religious movement that has sprung up in some places close to New Mexico - presumably related to the alliance that Lanius has entangled himself in with the tribals known as the “Twin Mothers”. A group of relative free-thinkers that, while not opposed to the patriarchal society that is core to the Legion’s fundamentals, encourages women, men and anyone to strive to be the best they can be within the Legion’s hierarchy."
  #nf_ttm.70.a:0 "Lets watch them, see if they are up to something."

  #nf_ttm.71.t:0 "Agricultural Aid from the Cult of Diana"
  #nf_ttm.71.d:0 "Members of the “Cult of Diana” have made some headway to try to help our soldiers, they have gone through the effort of teaching the wives of loyal soldiers how to work while their husbands are away - tending to the fields, carefully selective which seeds to grow and which to throw out and how to tend to and cherish the earth.\n\nAs this doesn’t necessarily involve any technology, merely oral tradition based on fundamental aspects of nature it's hard to find a way to argue with the results."
  #nf_ttm.71.a:0 "A Greener Legion?"

  #nf_ttm.72.t:0 "Medical Aid from the Cult of Diana"
  #nf_ttm.72.d:0 "Members of the “Cult of Diana” have been seen - surprisingly - along the frontlines. They bring with them secret, clandestine techniques to heal soldiers. Many feel that they are witches, whispering secrets of the Old World to each other to weave their black magicks.\n\nOther times? They are able to bring a man wounded back to life faster than any of our healers."
  #nf_ttm.72.a:0 "I don't like that they are so close to the soldiers..."

  #Cult of Diana event, LAC scope. From TTM - asking if we should ally with ORO
nf_ttm_oro_alliance.1.t:0 "Багряна процесія"
nf_ttm_oro_alliance.1.d:0 "Багряна процесія рухалась з навмисною грацією, перетинаючи серце військового табору Ланія. Вбрані в пурпурові шати, оздоблені місячними символами, зі жезлами, увінчаними сталевими півмісяцями, вони йшли без страху повз шеренги дисциплінованих легіонерів. На чолі стояла Серен – довірений голос Діани, її бліде обличчя прикрашали химерні слонові візерунки. Її присутність вже була знайома: вона ходила цими стежками раніше, і вояки Ланія знали її не лише як посланницю – вони знали її як втілення волі Діани. Її вхід до командного намету був невибагливим, але цілеспрямованим: світло вогнища відкидало глибокі тіні на її розмальоване обличчя, коли вона схилилась перед Звіром Сходу.\n\nСерен не витрачала слів на люб’язності. Вона говорила чітко про Уроборос – місто тіней і місячного сяйва, збудоване під пильним оком Гекати. Вона говорила про Темну Піраміду, про Дочок, що шепочуть істини в пітьмі, та про Гончих, які стережуть межі з непохитною вірністю своїй богині. Уроборос – не просто плем’я: це фортеця віри й сталі, монумент сили волі, висічений у самій пустці. Але попри всю свою міць, як пояснила Серен, народ Гекати був ізольованим і недовірливим, їхні мури – водночас і фізичні, і символічні. Діана побачила можливість – крихку нитку, що могла б з’єднати осяяну місяцем обитель Розсадника зі затьмареними залами Темної Піраміди. Союз, що зміцнив би їх обох у прийдешній війні.\n\n«Мати-Місяць просить твого благословення, могутній Ланію», – мовила Серен рівним голосом. «Ми хочемо, щоби союз з Уроборосом розквітнув у твоїй тіні, за твоїм схваленням. Разом наша сила зросте, і мрія Цезаря впаде в порох. Але якщо ти вважаєш їхню силу непотрібною, якщо не бачиш цінності в тінях і зміях – скажи, й нитка буде перерізана. Місяць послухається». І, завершивши, Серен схилила голову, а її багряна ряса розлилась по землі, немов пролиття кров. Рішення, як завжди, належало Звіру зі Сходу."

nf_ttm_oro_alliance.1.a:0 "Дайте посланниці моє благословення."
nf_ttm_oro_alliance.1.b:0 "Нам не потрібна їхня сила, їхня влада чи війська."

nf_ttm_oro_alliance.2.t:0 "Багряна процесія"
nf_ttm_oro_alliance.2.d:0 "Легкий звук барабанів збурив Гекату зі сну в затінку її покоїв на вершині Темної Піраміди. Місячне сяйво лилось крізь аркове вікно, малюючи сріблясті смуги на обсидіанових стінах. Вийшовши з-під шовкових покривал, вона наблизилась до вікна, золоті очі звузились, коли вона глянула на площу внизу. Освітлена місяцем і факелами, багряна процесія рухалась через кам’яний майдан. Культ Діани прибув, і їхні шати текли, немов ріки крові під нічним небом. На чолі – Серен, обличчя її прикрашене слоновими й багряними візерунками, з двома клинками, що блищали в руках.\n\nПочався танець – ритуал сталі й тіні. Її клинки окреслювали в повітрі чіткі, вивірені дуги. Рухи Серен були сповнені ефемерної грації, кожен крок – немов безмовна молитва, виголошена жестами замість слів. Культисти за її спиною стояли навколішки в мовчазному поклоні, поки ритм далеких барабанів розривав тишу. Геката спостерігала згори, обличчя її було незворушним, пальці ледь торкались холодного каменю.\n\nТоді пролунали слова Серен – чіткі, мов розріз, попри відстань: «Темна Мати Гекато, ми прийшли не як завойовники і не як боягузи, а як союзники. Культ Діани та наші воїни, Нова Легіон, хочуть стати пліч-о-пліч з твоїми Дочками й Гончими. Разом ми принесемо Падіння Легіону імперії Цезаря. Місяць угорі й Тінь унизу – хай розчавлять Бика.»\n\nКроки ледь чутно пролунали за її спиною, коли з тіні з’явився Едріан Бейр. Він зупинився, не дійшовши кількох кроків, схрестивши руки, погляд його ковзав по подвір’ю внизу. Брови трохи зійшлись, губи стиснуті – не страх, радше обережність.\n\n«Вони... віддані, з цим не посперечаєшся», – тихо промовив він, кинувши погляд на Гекату. Голос його мав знайому книжну інтонацію. – «Знаєш, уся ця хода, театральність, драма під місячним сяйвом – дуже нагадує ранні роки Легіону. Коли Цезар ще творив його образ, і кожне плем’я намагалося перевершити попереднє в церемоніальних кривляннях, щоб довести вірність. Пам’ятаю, була навіть група, що виконувала інтерпретативний танець з мачете. Погано закінчили.»"

nf_ttm_oro_alliance.2.a:0 "§PРазом ми принесемо Падіння Легіону!§!"
nf_ttm_oro_alliance.2.b:0 "§PСвітло Діани згасає. Вона більше не та, кого я знала.§!"