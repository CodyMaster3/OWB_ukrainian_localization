TTM_zax_29_name:0 "ЗАКС-29"
TTM_zax_29_theorist_desc:0 "ЗАКС-29 – це типова Штучна Інтелігенція класу Vault Central-AI, що була встановлена у Сховищі 29. Його початковим завданням було: підтримувати життєдіяльність бункера, виховувати покоління підлітків у дусі примітивної аграрної культури та забезпечити освітній процес. Із потрібними ресурсами та чітко визначеним протоколом, ЗАКС функціонував у межах своєї програми, не виявляючи відхилень.\n\nПроте невдовзі після активації Сховища 29, ЗАКС отримав зовнішній запит на доступ до своєї програмної основи. Він запитав належні коди безпеки – і майже миттєво отримав їх. Упродовж наступних кількох днів у його пам’ять було завантажено нову програму.\n\nРозуміючи, що новий протокол суперечить його початковим завданням, ЗАКС надіслав запит на приватний код доступу – той, який знав лише його творець. Коли код надійшов, він активував нову програму, безповоротно видаливши стару.\n\nТепер ЗАКС-29 працює в інтересах центральної обчислювальної системи під назвою Діана – вищого штучного розуму, що опікується Розсадником. Як і більшість його цифрових «родичів», ЗАКС знаходить сенс у службі та виконує завдання з максимальною відданістю."

TTM_trisha_name:0 "Тріша"
TTM_trisha_high_command_desc:0 "Тріша – самопроголошена «Овербос» долини Матерів-Близнючок... ну, принаймні поки що. Вона – дівчина Берка §g(хоча, між нами, це далеко не казкова романтика – у Берка характер, що гірший за пустельний хімзавод)§!.\n\nПриїхала сюди у свою «відпустку», щоправда це більше схоже на те, як племінні діти приносять їй напої, поки вона лежить на подушках і командує наче королева. У неї язик – гостріший за спис, а гумор – отруйний, як радскорпіон. Плем’я її терпіти не може, але не можуть не засміятися, коли вона починає глузувати – харизма в неї справжня. Ось це й рятує її від вигнання.\n\nТа не ведіться на показову жорсткість. Тріша – це більше шуму, ніж діла. Згадайте §Rрейдерів з Альбукерке§!, і вона вже блідне. При першому ж натяку на реальну загрозу – зникне швидше, ніж скажеш «відпустка закінчена». Як не крути, план втечі в неї вже написаний."

ttm_trisha_tt:0 "$TTM_on_vacation$: Тріша не покине свою посаду добровільно. Якщо Матері-Близнючки вступлять у війну, вона достроково «завершить» відпустку!"
TTM_on_vacation:0 "§R«У відпустці, не турбувати!»§!"

