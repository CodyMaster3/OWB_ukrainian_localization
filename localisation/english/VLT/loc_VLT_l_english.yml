vlt_send_larger_force:0 "Відправити Більше Військ"
vlt_send_larger_force_desc:0 "Ніякого нічного нападу. Ніяких таємних операцій. Цього разу йдемо з гарматами напоготові. Ми не можемо дозволити, щоб усе це тяглося вічно. Місто-Сховище залежить від електрики з цієї станції. Але вже незабаром — без участі гулів."
vlt_somebody_set_us_up_the_bomb:0 "Знешкодити Всі Пастки"
vlt_somebody_set_us_up_the_bomb_desc:0 "Уся територія досі встелена СВП та мало не мультяшними механічними пастками. Ми буквально втратили бійця через відро з радіоактивним слизом, яке хтось поставив на напіввідчинені двері. Було б смішно, якби не довелось бачити, як у нього розплавилось обличчя."
gecko_bomb_cleanup:0 "Ґеко Очищено Від Пасток"
vlt_repair_extensive_damage:0 "Відновити Масштабні Пошкодження"
vlt_repair_extensive_damage_desc:0 "І містечко навколо електростанції, і сама станція зазнали серйозних пошкоджень під час боїв. На щастя, нічого критичного не постраждало. Але відновлення займе певний час."
