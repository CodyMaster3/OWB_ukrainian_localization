vlt_salvage_whats_left_desc:0 "Хоча зараз небезпечно заходити в радіоактивний кратер, що колись був електростанцією Ґеко, ми не можемо дозволити собі втратити цінні ресурси або дати їм потрапити до чужих рук."
vlt_the_old_vault_reactor:0 "Старий Реактор Сховища"
vlt_the_old_vault_reactor_desc:0 "Старий реактор у нашому Сховищі тепер має працювати понаднормово, бо ми втратили все додаткове живлення з Ґеко. Він ніколи не замінить повноцінну електростанцію, але наразі мусить вистачити. Треба ж якось живити ці всі турелі."
