vlt_find_some_gizmo:0 "Знайти Поламану Деталь"
vlt_find_some_gizmo_desc:0 "Ці кляті гулі перед смертю встигли поламати кілька важливих компонентів, ніби наостанок влаштувавши нам \"подарунок\". Тепер нам доведеться шукати відповідні запчастини. І ні, це не гідроелектричний магнітосферний регулятор — таких у нас у Місті-Сховищі й так повно чомусь."
