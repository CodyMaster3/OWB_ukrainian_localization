l_english:

  #### Focuses ####

vlt_all_clear:0 "Сигнал 'Усе Чисто'"
vlt_all_clear_desc:0 "Хоча наші записи не дають точного уявлення, коли саме відкрився Сховище 8, очевидно, що це сталося протягом перших одного-двох десятиліть після падіння бомб. Світ тоді був зовсім іншим.\nЯкими були наші перші кроки?"

vlt_gecko_friends:0 "Ґулі з Ґеко"
vlt_gecko_friends_desc:0 "Хоч ми й були на межі конфлікту з нашими ґулями-сусідами, нам вдалося досягти згоди."

vlt_the_outside_world:0 "Зовнішній Світ"
vlt_the_outside_world_desc:0 "Перлина Пустки ніколи не була такою фанатичною, як дехто її зображує, і гідні мешканці Пустки завжди мали змогу отримати громадянство. Але ми не можемо впустити кожного до нашої утопії. Хтось отримує громадянство завдяки своєму пронизливому розуму, хтось — завдяки службі Місту-Сховищу, а дехто — через комбінацію обох."

vlt_presence_bear:0 "Присутність Ведмедя"
vlt_presence_bear_desc:0 "Хоч любиш, хоч ненавидиш — НКР є найсильнішою силою у Пустці з усіх, кого ми знаємо. Деякі обурюються через субсидії, які ми їм виплачуємо, тоді як інші визнають: краще хай вони вмирають за свою імперію, ніж наша молодь."

vlt_end_of_a_term:0 "Кінець Терміну"
vlt_end_of_a_term_desc:0 "На перший погляд, термін Лінетт як Першої Громадянки буде лише черговим — як у її матері до неї. Але Начальник Охорони Маєр прийняв каліфорнійську єресь... і вимагає виборів. Чи переможе мудрість Міста-Сховища, чи натовп запанує в Місті Майбутнього?"

maier_support_tt:0 "Збільшує підтримку §MДемократії§! і покращує позиції партії Маєра §MЛіга Громадян§!!"
lynette_support_tt:0 "Збільшує підтримку §OТолерантності§! і покращує позиції партії Лінетт §OСтара Гвардія§!!"

vlt_election_garrison:0 "Засудити Гарнізон!"
vlt_election_garrison_desc:0 "Мати Лінетт зробила нас посміховиськом Пустки, змусивши покладатися на обдовбаних солдатів НКР для нашого захисту. Настав час їм піти назавжди. Якщо мене оберуть, я підготую нас до самостійного захисту."

vlt_election_reno_trade:0 "Торгівля з Ріно"
vlt_election_reno_trade_desc:0 "Місто-Сховище традиційно відштовхувало Нью-Ріно, але там є порядні люди. Навіть якщо їм потрібно допомогти позбутися розбещеності, це не причина вважати їх нелюдами."

vlt_election_legalize:0 "Легалізувати Це!"
vlt_election_legalize_desc:0 "Рада давно заборонила алкоголь у Місті, але немає нічого поганого у вжитку в поміркованих межах. А деякі чутки твердять, що самі члени Ради дозволяють собі згрішити на стороні. Якщо їм можна — вам теж не зашкодить!"

vlt_election_immigrants:0 "Ласкаво Просимо Іммігрантів"
vlt_election_immigrants_desc:0 "Маєр — далеко не єдиний іммігрант, що зробив Місто-Сховище кращим. Хто може забути мешканця Сховища 13, що служив Капітаном Охорони? Ми маємо вітати найкращих і найрозумніших у нашій утопії."

vlt_election_support_guard:0 "Підтримати Охорону"
vlt_election_support_guard_desc:0 "Якщо ми виганяємо каліфорнійське ярмо, ми повинні стояти за себе. Ми завжди будемо на Варті для вас!"

vlt_election_mutant_threat:0 "Загроза Мутантів"
vlt_election_mutant_threat_desc:0 "Ми занадто довго терпіли ґулів. Ми збудуємо націю, вільну від диких, баків із FEV, чи канібальських монстрів. Ми збудуємо землю обітовану для чистих."

vlt_election_wasteland_workshop:0 "Майстерня Пустки"
vlt_election_wasteland_workshop_desc:0 "Мир і процвітання Лінетт не можна недооцінювати. Нехай каліфорнійці гинуть за Мохаве чи живуть, загрібаючи гній брамінів. Ми побудуємо утопію."

vlt_election_courtyard_supermutants:0 "Пустити Супермутантів у Внутрішній Двір"
vlt_election_courtyard_supermutants_desc:0 "Хоча ми не повинні пускати супермутантів до міста, кілька з них не становлять загрози у Внутрішньому Дворі! Вони приносять унікальні й цінні навички."

vlt_election_wasteland_scholars:0 "Вчені з Пустки"
vlt_election_wasteland_scholars_desc:0 "Хоч ми й найрозумніші у всій Пустці, там надто, надто багато людей, і деякі з них дійсно можуть зрівнятися з нашою геніальністю."

vlt_election_new_generation:0 "Нове Покоління"
vlt_election_new_generation_desc:0 "Завдяки добробуту Лінетт Місто-Сховище зможе розпочати новий цикл народжуваності раніше запланованого! Запишіться на прийом у медичний відділ Міста-Сховища, щоби дізнатися, хто стане вашим партнером!"

vlt_election_california_girls:0 "Хотілося б, щоб Усі Вони Були Каліфорнійками"
vlt_election_california_girls_desc:0 "Попри всі її недоліки, НКР — це найуспішніша держава у Пустці. Ви справді хочете об'єднуватися з тими, кого буквально називають Танцючими-на-Кістках? Або з техно-лицарями із Лост-Гіллз? Ні, давайте святкувати наші зв’язки з найбільшою цивілізацією у Пустках."

vlt_election_new_entertainment:0 "Нове Розважання"
vlt_election_new_entertainment_desc:0 "Хоча твердження деякої молоді про те, що Місто-Сховище 'створене для восьмидесятирічних' є перебільшенням, один із способів перемогти Маєра — це обіцяти більше свободи самовираження. Мені, до речі, деякі з цих коміксів дуже сподобалися, коли я навчалась за кордоном!"

unlock_automatically_tt:0 "Цей фокус відкриється автоматично через події."
vlt_the_election_of_2275:0 "Вибори 2275 року"
vlt_the_election_of_2275_desc:0 "Місто-Сховище стоїть на роздоріжжі. Чи продовжить воно традиції, які зробили його світлом у темряві? Або ж стане символом чогось більшого?\nУсе вирішиться ввечері §Gпершого липня§!."

vlt_lynette_win:0 "§OЛінетт перемогла на Виборах§!"
vlt_maier_win:0 "§MМаєр переміг на Виборах§!"
vlt_a_second_term:0 "Другий Термін"
vlt_a_second_term_desc:0 "Попри деякі неспокійні елементи, Лінетт знову здобула перемогу."
vlt_a_long_time_coming:0 "Цього Довго Чекали"

vlt_whats_the_deal_with_new_reno:0 "У Чому Справа з Нью-Ріно?"

vlt_a_new_direction:0 "Новий Напрям"
vlt_a_new_direction_desc:0 "Перше, що зробив Перший Громадянин Маєр після перемоги на виборах — спростив безладну бюрократичну систему з форм, прийомів і зборів, необхідну для набуття громадянства в Місті-Сховищі. Замість цього її замінили набагато простішим варіантом — служити певний час у Варті або Інженерному корпусі. Стабільна робота, безпечне місце всередині наших стін, і після завершення терміну — повне громадянство."

vlt_service_for_citizenship:0 "Служба за Громадянство"
vlt_service_for_citizenship_desc:0 "Нині можна уникнути етапу боргового рабства, але весь процес усе ще залишається хаотичним бюрократичним кошмаром із формами, записами й очікуванням, який буквально (і часом буквально) триває роками, поки кандидати живуть у халупах за межами наших мурів. Ми можемо спростити процес, дозволивши служити у Варті або Інженерному корпусі. Стабільна робота, безпечне місце за стінами, і через кілька років — громадянство."

vlt_corps_of_engineering:0 "Інженерний Корпус"
vlt_corps_of_engineering_desc:0 "Проблема з набором зовнішніх мешканців... вибачте, 'майбутніх громадян' до нашого Інженерного корпусу в тому, що в нас його насправді немає. У нас є Центр Технічного Обслуговування, але сама будівля навряд чи підходить для більш ніж кількох людей. Тож перше завдання новоствореного Інженерного корпусу — побудувати собі справжнє робоче місце."

vlt_tackling_new_projects:0 "Нові Проєкти"
vlt_tackling_new_projects_desc:0 "Роботи завжди вистачає. Щойно ми вирішимо наші давні внутрішні проблеми, зможемо нарешті звернути погляд назовні. Досить спочивати на лаврах нашої уявної переваги."

vlt_office_for_salvage_and_reclamation:0 "Управління Знахідок і Відновлення"
vlt_office_for_salvage_and_reclamation_desc:0 "У Пустці розкидано чимало довоєнних об’єктів, які пережили Велику війну. Часто найцікавіші частини залишаються недоторканими, бо середньостатистичний пустельник просто не має уявлення, що робити з високотехнологічною начинкою цих об'єктів. На нашу користь."

vlt_office_for_military_technology:0 "Управління Військових Технологій"
vlt_office_for_military_technology_desc:0 "Будучи найрозвиненішим містом у Пустці, посиленим тими, хто вірить у вільну, людську Неваду, ми можемо легко спорядити збройні сили, яким навіть Братство б позаздрили."

vlt_machines_of_war:0 "Машини Війни"
vlt_machines_of_war_desc:0 "Танк був основою армійських сил протягом трьох світових воєн. Хоча його й витіснила силова броня під кінець останньої, недооцінювати ефективність танка — помилка. Ми, мабуть, не зможемо виробляти їх масово, але завдяки нашому технічному рівню — ті, які збудуємо, будуть нищівними."

vlt_the_power_of_armor:0 "Сила Броні"
vlt_the_power_of_armor_desc:0 "Той простий факт, що різні моделі силової броні все ще знаходять, попри двісті років у суворих умовах Пустки, говорить багато про їхню якість. І хто краще за нас здатен використовувати ці дивовижні досягнення довоєнної технології?\nНе кажучи вже про те, що ми знайшли креслення силової броні з логотипом Vault-Tec у нашому головному терміналі."

vlt_the_courtyard_push:0 "Наступ на Внутрішній Двір"
vlt_the_courtyard_push_desc:0 "З новим шляхом до громадянства настав час навести лад у Внутрішньому Дворі. Агресивна кампанія з набору дозволить залучити значну частину населення двору. Це також полегшить реалізацію майбутніх проєктів у цьому районі. Ми не можемо бути сяючим маяком цивілізації, якщо перед воротами доводиться місити багно."

vlt_courtyard_district:0 "Район Внутрішнього Двору"
vlt_courtyard_district_desc:0 "Внутрішній Двір — це перше, що бачать чужинці в Місті-Сховищі, але він може бути значно більшим. Якщо ми відкриваємо громадянство для наших сусідів із Невади, розширімо район і побудуймо для них домівки. Перетворімо нетрі на гідне житло для громадян Міста-Сховища."

vlt_expanding_vault_city:0 "Розширення Мурів Міста-Сховища"
vlt_expanding_vault_city_desc:0 "Через приплив нових громадян із-за меж Пустки, простору за стінами стало дещо менше. Хоча неможливо побудувати стіни тієї ж висоти й міцності в ширших масштабах, ми зобов’язані захистити всіх наших громадян. Іржаві остови автівок — не захист."
vlt_expanding_vault_city_tt:0 "Додати §Y3 форпости§! вздовж південного кордону Району Внутрішнього Двору."

vlt_winnemucca_outpost:0 "Форпост Віннемакка"
vlt_winnemucca_outpost_desc:0 "Віннемакка вже деякий час є форпостом Міста-Сховища. Цей табір оборони, що дивиться на схід, мав дати нам раннє попередження у випадку наближення великих сил. Попри те, що з роками навколо нього оселилось чимало пустельників, він завжди вважався другорядним. Ми маємо покращити інфраструктуру форпосту й вирішити питання із місцевим населенням."

vlt_disaster_waiting_to_happen:0 "Лихо, Що Очікує Свого Часу"
vlt_disaster_waiting_to_happen_desc:0 "Наші стосунки з ґулями на електростанції Ґеко були, у кращому разі, нестабільними. Взаємодія обмежується лише обміном електроенергії на припаси. Якщо це з'єднання буде перерване з будь-якої причини... наприклад, якщо вони здичавіють або вирішать шантажувати нас — ми будемо цілком безпорадні. Старий генератор сховища просто не зможе забезпечити роботу систем захисту, які стримують Пустку."

vlt_disaster_waiting_to_happen_tt:0 "§YГромадянин Картер§! стає доступним для служби."

vlt_kicking_out_the_ghouls:0 "Вигнати Ґулів"
vlt_kicking_out_the_ghouls_desc:0 "Оскільки в нас вперше з’явився надлишок особового складу у Варті, ми нарешті можемо вирішити питання наших ґулів-сусідів. Малоймовірно, що вони чинитимуть серйозний опір — але з ґулями ніколи не знаєш напевне."

vlt_kicking_out_the_ghouls_tt:0 "Зменшує вироблення §Yелектростанції Ґеко§! на §R15§!£resources_strip|2, але знімає штрафи до §YБудівництва§! та §YЛюдських Ресурсів§!."

vlt_renovate_the_power_plant:0 "Реновація Електростанції"
vlt_renovate_the_power_plant_desc:0 "Кажуть, електростанцію в Ґеко 'полагодили' 30 років тому. Насправді тоді нас ледь не знищила недбалість ґулів. Велика частина конструкції досі поступово руйнується, і це лише питання часу, коли все піде шкереберть. Обов’язок запобігти цьому тепер лежить на нас. Особливо після того, як ми, можливо, дещо пошкодили, беручи її під контроль."

vlt_assault_concluded_tt:0 "Відкриває рішення з ремонту та/або пошуку нового пального для електростанції Ґеко"
vlt_assault_concluded_badly_tt:0 "Відкриває рішення з виправлення допущених помилок."

vlt_aquire_a_new_fuel_source:0 "Знайти Нове Джерело Пального"
vlt_aquire_a_new_fuel_source_desc:0 "Після того як у Брокен-Гіллз закінчився уран, ми покладалися на власні запаси та рідкісних торговців, які наважувалися мати справу з цією небезпечною речовиною. І ми чесно не маємо уявлення, як ґулі Ґеко підтримували роботу станції так довго. Але тепер, коли вона повністю під нашим контролем, наші запаси швидко вичерпаються — і нам доведеться знову покладатися на резервний генератор зі Сховища."

vlt_gem_of_the_wasteland:0 "Перлина Пустки"

vlt_out_with_the_old:0 "Геть Старе"
vlt_out_with_the_old_desc:0 "Багато з інституцій, що складали інфраструктуру Міста-Сховища, або застаріли, або не пристосовані до нових умов. Ми маємо вирішити, що зберегти, а що відкинути."

vlt_new_amenities_office:0 "Центр Обміну Заслуг"
vlt_new_amenities_office_desc:0 "Одне з завдань старого Відділу Благ — заохочувати громадян за особливі досягнення. Ми повинні розвинути цю функцію, щоб мотивувати нових громадян працювати заради спільної мети."

vlt_new_servant_allocation_center:0 "Центр Розподілу Роботи"
vlt_new_servant_allocation_center_desc:0 "Очевидно, Центр Розподілу Слуг більше не потрібен, але самі будівлі й системи можуть бути переобладнані. З розширенням міста обсяг робіт зріс, як і доступна робоча сила. Центр Розподілу Роботи допоможе об’єднати одне з іншим — якнайефективніше."

vlt_new_servant_allocation_center_tt:0 "Цей фокус або відкриє §YЦентр Розподілу Роботи§! як Велику Установу та надасть §G100§! політичної влади, або, якщо вже було обрано §YЦентр Розподілу Слуг§!, замінить його з ефективним бонусом §G+5%§! до швидкості будівництва §YІнфраструктури§!, §YАвіабаз§! та §YМорських баз§!."

vlt_new_guards_on_duty:0 "Нові Вартові на Чергуванні"
vlt_new_guards_on_duty_desc:0 "Нашим новобранцям у Варті вкрай не вистачає підготовки для організованої роботи. Деякі з ранніх іммігрантів, хоч і замало придатні для фронтового бою, можуть навчити їх бойовому ремеслу — і, можливо, надихнути інших приєднатися до Варти."

vlt_new_guards_on_duty_tt:0 "Під час набору нового §YКомандира Юніта§! з’являється шанс, що це буде §YМешканець Пустки§! замість §YМешканця Сховища§!."

vlt_rooting_out_ghoul_sympathizers:0 "Викриття Прихильників Ґулів"
vlt_rooting_out_ghoul_sympathizers_desc:0 "Гордон, ґуль-посол з Ґеко, є помітною фігурою в угрупованні, яке називає себе 'Культом Відродження'. Вони проповідують якісь напіврелігійні забобони про цикли оновлення всього сущого та підтримують ґулів у Ґеко й інших місцях. Гордон і так ніколи не був бажаним гостем у Місті-Сховищі, тож зробімо це офіційним — позбудьмося його й усіх його сектантських друзів."

vlt_redefining_the_guard:0 "Переформатування Варти"
vlt_redefining_the_guard_desc:0 "Зі збільшенням кількості людей під прапором Варти ми можемо розподілити обов’язки ширше. До цього часу один Вартовий мав виконувати все: патрулювати, охороняти, ловити злочинців, гасити пожежі, воювати. Тепер у нас є вибір."

vlt_the_patrolmen:0 "Патрульні"
vlt_the_patrolmen_desc:0 "Патрулювання — одне з найнебезпечніших завдань Варти. Деяким із громадян навіть важко уявити собі вихід за стіни міста. Але з витривалими людьми з-за меж міста у нашому складі, ми можемо зробити Патрульних постійною структурою. У нас буде достатньо сил, щоб захищати менші фракції та незалежні поселення, що дружні до нас."

vlt_woop_woop_thats_the_sound_of_da_police:0 "Внутрішня Поліція"
vlt_woop_woop_thats_the_sound_of_da_police_desc:0 "Не кожен інцидент потребує людей у важкій броні зі штурмовими дробовиками, особливо у відносно мирному Місті-Сховищі. Гучні сусіди чи загублений гаманець — зовсім інші ситуації."

vlt_a_proper_army:0 "Справжнє Військо"
vlt_a_proper_army_desc:0 "Завдяки порадам наших видатних іммігрантів, Міська Варта стала професійною армією не лише за назвою, а й на ділі. Хай термін 'Міська Варта' навіює страх у серця всіх ворогів."

vlt_criminal_empires:0 "Кримінальні Імперії"
vlt_criminal_empires_desc:0 "Попри запевнення НКР про безпеку, між нами та ними існує тривожна кількість того, що ми назвали б 'Кримінальними Імперіями' — Нью-Ріно, Ден, Якудза. Якщо ми хочемо зробити Пустку кращим місцем, почнемо з них."

vlt_hive_of_scum_and_villainy:0 "Кинути Виклик Законам Випадку"
vlt_hive_of_scum_and_villainy_desc:0 "Керівництво Нью-Ріно завжди було нестабільним — кілька 'родин' боролися за владу. Це було лише питанням часу, коли все вибухне. І тепер ми маємо вирішити наслідки цієї боротьби — як би вона не закінчилася."

vlt_new_new_reno:0 "Туризм у Нью-Ріно"
vlt_new_new_reno_desc:0 "Попри темний бік міста, Нью-Ріно побудоване на розвагах. І саме розваг так не вистачає в Місті-Сховищі. Тепер, коли вулицями Ріно знову можна пройтися без нападу з боку торговців хімікатами й головорізів, чому б не з’їздити туди на відпочинок?"

vlt_send_regards_to_the_oyabun:0 "Передати Привіт Оябуну"
vlt_send_regards_to_the_oyabun_desc:0 "Якудза, незважаючи на своє кримінальне походження, здаються цілком розсудливими людьми. Можливо, якщо ми надішлемо Оябуну подарунки, вони зможуть розібратися з деякими проблемами за нас. Наприклад, з набагато менш розсудливими Гадюками та Шакалами."

vlt_pest_control:0 "Зачистка Шкідників"
vlt_pest_control_desc:0 "Оскільки якудза або не хочуть, або не здатні впоратися з рейдерами під нашими воротами, цей обов'язок лягає на нас. Позбудьмося цих шкідників — так, як вони того заслуговують."

vlt_another_pest:0 "Ще Один Шкідник"
vlt_another_pest_desc:0 "Гадюки були занозою в нашому боці з моменту, як їх вигнали сюди Братство та НКР. Час показати їм, що Невада — не їхній дім!"

vlt_another_mans_trash:0 "Сміття Одного — Скарб Іншого"
vlt_another_mans_trash_desc:0 "І Шакали, і Гадюки контролювали неочікувано великі території, які, як не дивно, майже не використовували. Навколо валяється стільки корисних матеріалів, що аж голова йде обертом.\nДавайте використаємо те, що вони занедбали."

vlt_cultural_exchange:0 "Культурний Обмін"
vlt_cultural_exchange_desc:0 "Завжди складно прибувати в нове місце, де ти нікого не знаєш. Особливо коли треба вчитись і працювати з тими, хто знає одне одного усе життя. Давайте щиро привітаємо наших нових друзів з Якудзи!"
vlt_cultural_exchange_tt:0 "У Місті-Сховищі з’являються два підрозділи §YОбмінних Студентів Якудзи§!."

vlt_just_another_raider_gang:0 "Просто Ще Одна Банда Рейдерів"
vlt_just_another_raider_gang_desc:0 "Якудза могли б бути союзниками або принаймні помічниками у творенні цивілізації... Та виявилося, що вони — просто ще одна банда рейдерів. І їх спіткає та ж доля, що й інших."

vlt_like_reno_but_somehow_worse:0 "Як Нью-Ріно, Тільки Гірше"
vlt_like_reno_but_somehow_worse_desc:0 "Уявіть Нью-Ріно. Тепер уявіть Нью-Ріно з меншею кількістю казино... та ще й гірших. Додайте ще більше хімії та багато рабства. Вітаємо, ви тільки-но описали Ден.\nЯкщо Нью-Ріно — проблема, то Ден і поготів."

vlt_getting_rid_of_the_last_family:0 "Позбутися Останньої Родини"
vlt_getting_rid_of_the_last_family_desc:0 "Мордіно були однією з найогидніших родин Нью-Ріно, хоч дехто з наших колись із ними і працював. Після втечі до Дена вони глибоко влізли в рабовласницький бізнес Пустки. Настав час вирішити, що з ними робити."

vlt_consolidate_our_holdings:0 "Закріпити Наші Володіння"

vlt_modoc_is_kinda_in_the_way:0 "Модок як Плацдарм"
vlt_modoc_is_kinda_in_the_way_desc:0 "Модок — маленьке фермерське містечко на краю колишнього національного лісу Модок. Довгий час воно було перевалочним пунктом для караванів із Ріно, а ми іноді купували там брамінів, якщо не було кращих варіантів. Але тепер, коли наша армія здобула контроль на сході, вона звертає погляд на Ріно. Що робити з цим містечком?"

vlt_winning_the_war_against_crime:0 "Перемога у Війні з Злочинністю"
vlt_winning_the_war_against_crime_desc:0 "Ця війна була важчою і кривавішою, ніж перестрілки з розрізненими бандами рейдерів.\nАле ми винесли з неї уроки. Ми стали сильнішими завдяки цьому випробуванню."
vlt_reduced_crime_campaign_coring_cost_tt:0 "Зменшує §Yвартість приєднання§! регіонів, що були частиною кампанії §YВійна з Злочинністю§!, на §G25%§!."
has_concluded_crime_wars_tt:0 "Завершено всі війни в рамках §YВійни з Злочинністю§!"

vlt_time_well_spent:0 "Час, Використаний Недарма"
vlt_time_well_spent_desc:0 "Невада тепер безпечніше й цивілізованіше місце. Місце, в якому варто жити. Місце, за яке варто боротися. Якщо ти — людина, звісно.\nЧас призначити §MМагістратів§! і взятися до справи."

vlt_sierra_army_depot_deeper_levels:0 "Глибші Рівні Армійського Складу Сьєрра"
vlt_sierra_army_depot_deeper_levels_desc:0 "Цікаво, що деякі з наших старших громадян мають доступ до дверей, які ніяк не реагують на наші спроби їх відкрити."

vlt_the_wilds_of_east_nevada:0 "Дикі Землі Східної Невади"
vlt_the_wilds_of_east_nevada_desc:0 "Західні землі здебільшого вважаються цивілізованими, хоч і не мирними, тоді як схід — це хаотична мішанина прикордонних міст, племен і рейдерських сховищ."

vlt_among_the_willows:0 "Серед Верб"
vlt_among_the_willows_desc:0 "Якби Елькоська Зграя була трохи організованішою, її можна було б записати в ряди 'кримінальних імперій' заходу. Але поки що — це звичайна банда рейдерів із мріями про велич. Кажуть, вони збираються напасти на Місто-Сховище. Хай там що, пора покінчити з цими чутками. І зі Зграєю теж."

vlt_finding_the_holdouts:0 "Виявити Залишки"
vlt_finding_the_holdouts_desc:0 "Деякі з членів Зграї ще ховаються в горах. Але ми їх знайдемо, віддамо під суд — і забезпечимо свободу й безпеку для тих, кого вони пригнічували."

vlt_riding_shotgun:0 "Під Стволом"
vlt_riding_shotgun_desc:0 "Бакару запевняють, що вони просто скромні пастухи, які зберігають традиції. Але насправді більшість худоби, якою вони володіють, була вкрадена в місцевих поселень. Її або продавали з наваром, або використовували для виробництва. Розширення на ці землі допоможе їхнім жертвам, а також дасть доступ до родючих земель і худоби, яка ніким не заявлена."

vlt_corral_the_herds:0 "Загнати Стада"
vlt_corral_the_herds_desc:0 "Неочікуваний наслідок — хоч Бакару й були великими скотокрадами, їхня присутність 'захищала' регіон від дрібних банд, що полювали не на худобу, а на людей. Тепер, коли їх нема, ми мусимо подбати про захист звичайних мешканців."

vlt_contacting_eastport:0 "Зв’язок з Істпортом"
vlt_contacting_eastport_desc:0 "Істпорт — це вільна спільнота поселень з дивною назвою. Їхня гордість — працююча довоєнна пивоварня. Вони повідомили про зростання активності [EHT.GetName] — дорожніх воїнів — у регіоні. Ми маємо якомога швидше розмістити там військову присутність. Для їхнього захисту — і нашого."

vlt_waiting_for_the_storm:0 "Очікування Бурі"
vlt_waiting_for_the_storm_tt:0 "На кордоні між Елько, Істпортом і Вісімдесятниками з’являються два підрозділи §YПрикордонної Міліції§!."
vlt_waiting_for_the_storm_desc:0 "Можливо, Вісімдесятники планують прорватися на захід, але хай ідуть. Ми будемо готові — разом із усіма вільними людьми Невади."

vlt_bolster_their_defenses:0 "Посилити Їхній Захист"

vlt_mysteries_of_the_jungle:0 "Таємниці Джунглів"
vlt_mysteries_of_the_jungle_desc:0 "Довгий час ми отримували повідомлення про зниклих людей у цьому зарослому регіоні. Тепер ми знаємо чому. Мутовані двоногі єноти, що вистрибують із землі та кидають у людей списи.\nЧас покінчити з цим."

vlt_the_cutest_fur_trade:0 "Наймиліша Торгівля Хутром"
vlt_the_cutest_fur_trade_desc:0 "Ці звірята виявилися напрочуд дратівливими супротивниками. Весь регіон наповнений пастками та тунелями, якими вони рухались, тоді як нам це заважало на кожному кроці.\nАле ми таки щось здобули. Їхнє хутро неймовірно м’яке й, імовірно, добре продаватиметься."

vlt_beowawe_geothermal:0 "Дослідити Геотермальну Станцію Палікой"
vlt_beowawe_geothermal_desc:0 "Перше, що побачили наші люди — це обличчя величезної статуї, що нависало над ними. Вицвілий напис на стіні гордо проголошував: \"Palikoi Geothermal — дочірнє підприємство Poseidon Energy\". Станція, хоч і пошкоджена часом, була збудована на совість. Комплекс матиме для нас величезну цінність, не кажучи вже про знання, приховані всередині."

vlt_beowawe_geothermal_tt:0 "Відкриває §MГеотермальну компанію Палікой§! (довоєнна інженерна фірма)"
vlt_beowawe_geothermal_unlocked:0 "Відкрито §MГеотермальну компанію Палікой§! (довоєнна інженерна фірма)"

vlt_secrets_withint_secrets:0 "Таємниці Всередині Таємниць"
vlt_secrets_withint_secrets_desc:0 "Лісиста місцевість, яку мутовані звірі називали домом, сама по собі була дивиною. Оточена Пусткою, вона більше нагадувала джунглі. До того ж, там є річка, що бере початок нізвідки і так само зникає. Нам потрібно з’ясувати, що відбувається в тому регіоні."

vlt_how_the_east_was_won:0 "Як Було Завойовано Схід"
vlt_how_the_east_was_won_desc:0 "Це могла й не бути перемога проти неможливих шансів, але для міста, яким ми були ще кілька років тому — це кампанія величезного масштабу. Ми показали світу, що можемо стояти на власних ногах, і що ні рейдери, ні імперіалісти, ні мутанти не зломлять нас.\nТепер ми — вже не просто місто. І з новими обов’язками, можливо, нам слід замислитись і над новою назвою."
has_concluded_east_nevada_wars_tt:0 "Завершено всі війни з кампанії §YПриборкання Диких Земель§!"
vlt_reduced_wilds_campaign_coring_cost_tt:0 "Знижує §Yвартість приєднання§! регіонів із кампанії §YПриборкання Диких Земель§! на §G25%§!"

VLT_people_pary_maier_long:0 "Нова Адміністрація"
VLT_people_pary_maier:0 "Нова Адміністрація"

vlt_territorial_magistrates:0 "Територіальні Магістрати"
vlt_territorial_magistrates_desc:0 "Це не надто багато — запитати для прикладу, як ми будемо керувати нацією. Попередниця ледь не зруйнувала це місце, вона просто не знала, що з ним робити. Якщо ви думаєте, що зараз у Місті-Сховищі все погано — почекайте, поки я візьмуся за нього."
vlt_territorial_magistrates_tt:0 "Дозволяє призначати для [VLT.GetName] §Lконсулів§! або §cзовнішників§! на посади §Mмагістратів§! у новоприєднаних регіонах."

vlt_interstate_reconstruction:0 "Реконструкція Шосе"
vlt_interstate_reconstruction_desc:0 "Руїни шосе I-80 проходять крізь більшість наших нових територій на сході. Якщо ми відремонтуємо й з'єднаємо пошкоджені ділянки, отримаємо зручний шлях від форпосту Віннемакка до Веллса в Істпорті."

vlt_carlin_waypoint_station:0 "Перевалка в Карліні"
vlt_carlin_waypoint_station_desc:0 "Входи до старого тунелю Карлін, через який проходить I-80, здебільшого обвалилися, але сама структура всередині виявилася досить надійною. Якщо прибрати завали, зміцнити слабкі місця та спорудити оборонні споруди навколо входів — отримаємо готову базу для подальшого просування на схід."

vlt_winnemucca_hub:0 "Вузол у Віннемацці"
vlt_winnemucca_hub_desc:0 "Форпост у Віннемацці вже давно існує, і його розташування ідеально підходить для вузла транспортного обміну з Містом-Сховищем. Якщо ми колись розширимося західніше вздовж автостради, його значення тільки зросте."

vlt_terminus:0 "Веллський Термінал"
vlt_terminus_desc:0 "Магістрат уклав угоду, згідно з якою за невеликі поступки [EAS.GetLeader] погодився передати нам невелике поселення Веллс під наше керівництво. Це останній населений пункт на шляху I-80, який ще підконтрольний цивілізованим силам. Це наш ще один опорний пункт проти загроз зі сходу."

vlt_goats_for_everyone:0 "GOATи для Всіх"
vlt_goats_for_everyone_desc:0 "З такою кількістю нових громадян нам треба знати, хто на що здатен. Загальний тест на профпридатність (GOAT) вийшов з ужитку ще на зорі Міста-Сховища, але повернення цієї практики дозволить швидко оцінювати навички прибулих."

vlt_the_all_clear_station:0 "Станція 'Усе Чисто'"
vlt_the_all_clear_station_tt:0 "§YГромадянин Граккі§! стає доступним для служби."
vlt_the_all_clear_station_desc:0 "Тепер, коли ми керуємо величезною територією, швидка й надійна передача інформації стає логістичною проблемою — для промисловості, армії, і просто для інформування громадян. Громадська радіостанція — щонайменше рішення для цивільного боку справ."

vlt_fire_opals_for_firepower:0 "Вогняні Опали = Вогнева Міць?"
vlt_fire_opals_for_firepower_desc:0 "Коли місцеві старателі знайшли гарну кількість красивих самоцвітів, наші вчені неабияк зацікавилися. Виявляється, ті мають унікальні властивості, важкі для відтворення в лабораторії — особливо корисні для лазерної зброї. Щось про зменшення коливань довжини хвилі та підвищене розсіювання поля Ейхгорна-Стивенсона. Це, мабуть, добре?"

vlt_permanent_eastport_embassy:0 "Постійне Посольство в Істпорті"
vlt_permanent_eastport_embassy_desc:0 "Магістрат Істпорту має інше завдання, ніж його колеги — він не керує територією безпосередньо, а представляє наші інтереси перед урядом Істпорту. Створення постійного посольства — логічний наступний крок."
vlt_permanent_eastport_embassy_tt:0 "Це призведе до подальших §Yподій§! щодо майбутнього Істпорту."

vlt_burrows_logging:0 "Лісозаготівля в Норах"
vlt_burrows_logging_desc:0 "Ліс, у якому жили ті шкідники, напрочуд пишний, враховуючи навколишню Пустку. Це — перше справді придатне джерело деревини за багато років. Не дамо йому змарнуватися."

vlt_all_the_way_to_reno:0 "Всю Дорогу до Ріно"
vlt_all_the_way_to_reno_desc:0 "Усі дороги ведуть у Ріно. Принаймні так кажуть, правда ж? Або, можливо, йшлося про інше місто..."

vlt_hawthorne_army_depot:0 "Армійський Склад Готорн"
vlt_hawthorne_army_depot_desc:0 "Околиці форпосту [VIP.GetName] у Готорні всіяні бетонними спорудами та зміцненими укриттями. Після деяких досліджень ми дізналися, що це був колись величезний арсенал боєприпасів. І більшість цих сховищ досі закриті... й чекають на нас."

vlt_are_we_not_men:0 "Хіба Ми Не Люди?"
vlt_are_we_not_men_desc:0 "У Раді Міста-Сховища триває суперечка щодо статусу Слага. Очевидно, з ними щось не так. Чи можемо ми гарантувати, що вони не обернуться на чергову чуму ґулів?"

vlt_force_out_the_slags:0 "Ніяких Мутантів"
vlt_force_out_the_slags_desc:0 "Минулого разу, коли ми мали справу з Модоком, ми дали їм спокій — бо були важливіші справи. Але тепер ясно: людожерські підземні мутанти, що буквально живуть під ногами Модока, не повинні більше мати змогу вільно гуляти Невадою — чи зверху, чи знизу. Згоден Модок на це чи ні."

vlt_new_mayor_in_town:0 "Новий Мер у Місті"
vlt_new_mayor_in_town_desc:0 "Це не те, чого ми хотіли для Модока. Але вони співпрацювали зі Слагами, а цього ми точно не хочемо. Тепер ми контролюємо великий торговий центр і багато родючої землі. І це було б чудово... якби ми могли довіряти місцевим. Ми діємо в їхніх інтересах — справді."

vlt_mod_reeducation_camps:0 "Табори Перевиховання"
vlt_mod_reeducation_camps_desc:0 "Інформаційне бюро радить не називати це трудовими таборами. Це лише тимчасовий захід, поки ми не впевнимось, що в Модоку не залишилось жодних прихильників мутантів."

vlt_mod_reeducation_camps_tt:0 "§gЩойно буде викорінено всіх симпатиків мутантів, ви отримаєте §Yядро§! на §YМодок§!.§"

vlt_pick_up_the_slag:0 "Підхопити Роботу Слага"
vlt_pick_up_the_slag_desc:0 "Світ, безперечно, став кращим без цих блідих недолюдей. Але тепер нам доведеться взяти на себе справу, яку вони залишили. Ґрунтові води, які вони добували, забезпечували регіон питною водою та живили ферми довкола Модока. Нічого, що трошки довоєнних технологій не виправить."

vlt_slags_aquifer:0 "Водопостачання Міста-Сховища"
vlt_slags_aquifer_tt:0 "Змінює видобуток ресурсу в §YСтанції Очищення§! на §G+1§!£resources_strip|1 \n"

vlt_the_aquifier:0 "Артезіанський Басейн"
vlt_the_aquifier_desc:0 "Великий підземний резервуар, з якого Слаги добували воду для аграрного буму Модока, ще надовго вистачить. Але йому точно потрібна модернізація. Краще очищення та ефективніші насоси принесуть користь і регіону, і нам."

sla_water_import:0 "Імпорт Води з [SLA.GetName]"
sla_water_import2:0 "Імпорт Води з [SLA.GetName]"
sla_water_import3:0 "Угода про Вільне Пересування з [SLA.GetName]"

vlt_better_living_underground:0 "Краще Життя Під Землею"
vlt_better_living_underground_desc:0 "Підняти умови життя [SLA.GetName] до рівня Сховища — завдання не з простих. Не кажучи вже про витрати. Але дещо ми про підземне життя знаємо — і можемо їх навчити."

vlt_lessons_from_the_deep_dark:0 "Уроки з Темряви"

sla_water_import_desc:0 "Після модернізації своєї давньої системи насосів [SLA.GetName] отримали значний надлишок води — значно більше, ніж потрібно їм і навіть союзникам у [MOD.GetName]. Вони раді обміняти її на подальше обслуговування довоєнного обладнання."

vlt_the_mutants_are_revolting:0 "Мутанти Повстали"
vlt_the_mutants_are_revolting_desc:0 "Очевидно, ситуація в Ріно погіршилась, поки ми були зайняті. Мутанти захопили місто, використавши брудну бомбу. Вони мають бути зупинені."

vlt_cleanup_in_second_street:0 "Зачистка на Другій Вулиці"
vlt_cleanup_in_second_street_desc:0 "Більшість супермутантів Другої Вулиці — просто сміття. Але з правильною урбаністичною політикою ми можемо замінити їх на щасливі, продуктивні сім’ї."

vlt_mutant_slaves:0 "Безплатна Некваліфікована Робоча Сила"
vlt_mutant_slaves_desc:0 "Зламане Братство вже не становить загрози для цивілізованого світу, але нам слід вирішити, що з ними робити. Один із найкращих варіантів — змусити їх працювати на шахтах під охороною. Нам не потрібні ні захисні костюми, ні зарплатня."

vlt_something_something:0 "Тимчасова Локалізація"

vlt_assign_consuls:0 "Призначити Консулів Міста-Сховища"
vlt_assign_consuls_desc:0 "Хоча консули в Місті-Сховищі мають доволі зручні посади в бюрократичному апараті, дехто з них прагне реальної влади як територіальний магістрат. І нам справді потрібні компетентні кадри на нових землях."
vlt_assign_consuls_tt:0 "Кілька §YКонсулів Міста-Сховища§! стануть доступними як §MМагістрати§! для нових територій."

vlt_employ_outworlders:0 "Залучити Зовнішників"
vlt_employ_outworlders_desc:0 "Хоча призначити чиновника — очевидний варіант, досвідчений зовнішник — практичніший. Ці землі суворі й небезпечні, й керувати ними мають люди, які самі пройшли через Пустку."
vlt_employ_outworlders_tt:0 "Кілька §YГромадян-зовнішників§! стануть доступними як §MМагістрати§! для нових територій."

vlt_develop_elko_goldmine:0 "Розвинути Золоті Копальні Елько"
vlt_develop_elko_goldmine_desc:0 "Золото в цих копальнях саме по собі варте уваги. Але не меншу цінність становлять залишки старого видобувного обладнання."
vlt_develop_elko_tt:0 "Призначено §MМагістрата§! для §YЕлько§!"

vlt_develop_paradise_valley_tt:0 "Призначено §MМагістрата§! для §YРаю Долини§!"
vlt_develop_burrows_tt:0 "Призначено §MМагістрата§! для §YНор§!"
vlt_develop_eastport_tt:0 "Призначено §MМагістрата§! для §YІстпорту§!"
vlt_develop_reno_tt:0 "Призначено §MМагістрата§! для §YРіно§!"
vlt_develop_mineral_county_tt:0 "Призначено §MМагістрата§! для §YМоно-Каунті§!"
vlt_develop_modoc_tt:0 "Призначено §MМагістрата§! для §YМодока§!"

vlt_appointed_consul_tt:0 "\n§gДодатковий§! §YЕфект§! §gякщо призначено§! §LКонсула§! §gяк§! §MМагістрата§!:"
vlt_appointed_outworlder_tt:0 "\n§gДодатковий§! §YЕфект§! §gякщо призначено§! §cЗовнішника§! §gяк§! §MМагістрата§!:"

vlt_a_long_time_coming_desc:0 "Ми захищали Ґеко десятиліттями, але тепер мусимо вирішити долю ґулів. Подаймо руку цим бідолашним істотам. Після того, як одягнемо захисний костюм, звісно."

vlt_gecko_aid:0 "Відновити Ґеко"
vlt_gecko_aid_desc:0 "Ґулі — працьовитий народ. Їхнє містечко пройшло довгий шлях від халуп із бляхи. Ми можемо надати їм переваги громадянства — наприклад, Відділ Благ, де можна буде грати у Tragic the Gathering."

vlt_gecko_aid_medical:0 "Лікувати Ґулів"
vlt_gecko_aid_medical_desc:0 "На жаль, мрії про 'ліки' від ґулів не здійснились. Але ми цілком здатні полегшити їхній біль і допомогти з численними недугами. У відповідь вони будуть служити Місту-Сховищу."

vlt_cyclops_tribe:0 "Приборкати Бакару"
vlt_cyclops_tribe_desc:0 "[CYC.GetName] задовольняються своїми крадіжками худоби й мізерним фермерством, марнуючи ресурси Раю Долини. Подумайте, скільки вигоди ми б отримали, якби їхні землі опинилися під раціональним управлінням?"

vlt_ghoul_immigrants:0 "Іммігранти-Ґулі"
vlt_ghoul_immigrants_desc:0 "Схоже, що Ґеко зазнав напливу нових мешканців після того, як його давні жителі отримали громадянство Міста-Сховища. На щастя, Фестус розуміє важливість фільтрації небажаних осіб і надає громадянство лише достойним ґулям. Подейкують, що за стінами Ґеко виникла нова спільнота — для тих, хто шукає шлях до громадянства!"

vlt_PAL_attack:0 "Знищити Шакалів"
vlt_PAL_attack_desc:0 "Шакали — явна загроза нашому південному флангу. Цілком можливо, що якась безпринципна держава найме їх для нападу на нас, послабивши наше військо перед початком окупації!"

vlt_PAL_free:0 "Південний Протекторат"
vlt_PAL_free_desc:0 "Співчутливе втручання Лінетт врятувало незліченну кількість життів і показало, чого може досягти Місто-Сховище, якщо справді допомагатиме Пустці. Природно, ми захистимо золоту копальню — задля народу Невади, звісно."
VLT_PAL_free_tt:0 "Якщо §G[JAC.GetNameWithFlag]§! є маріонеткою, вони отримають додаткову клітинку для досліджень."

vlt_breadbasket:0 "Картопляні Ферми Невади"
vlt_breadbasket_desc:0 "Наші науковці з'ясували, що землі [CYC.GetName] цілком придатні для вирощування картоплі та інших коренеплодів. Зараз ця земля майже не використовується — хіба що для випасу брамінів. Але ми легко можемо перетворити її на продовольчу базу. Ну, ви зрозуміли."
vlt_breadbasket_tt:0 "§OЯкщо ви випустили [CYC.GetNameWithFlag] як маріонетку, цей фокус дасть додатковий бонус:§!"

vlt_army_we_need_one:0 "Розширити Арсенал"
vlt_army_we_need_one_desc:0 "Життя кожного Громадянина — безцінне. Якщо ми хочемо, щоб вони поверталися живими, маємо забезпечити їх найкращою зброєю."

vlt_lessons_old_ways:0 "Старі Методи для Нового Світу"
vlt_lessons_old_ways_desc:0 "Дехто з наших громадян має досвід служби в регулярному війську. Вони охоче нас навчатимуть — і нагадають, за що ми боремось."

vlt_fate_garrison:0 "Вигнати Гарнізон НКР"
vlt_fate_garrison_desc:0 "Попри наші погляди на найбільшого торговельного партнера Міста-Сховища, якщо ми хочемо дивитися світові в очі з гордістю — гарнізон НКР має піти."

vlt_science_nerds:0 "Місто Майбутнього"
vlt_science_nerds_desc:0 "Наша медична технологія — поза конкуренцією, але ми маємо й інші таланти. Заохочуймо ініціативу серед громадян і розвиваймо нові галузі на благо Пустки."

vlt_servants_friends:0 "Зразкові Слуги для Зразкових Громадян"
vlt_servants_friends_desc:0 "Багато хто критикує нашу систему слуг. Але ж це не раби! Ми дали їм житло, їжу, одяг і сенс життя. Їм просто потрібен чіткіший контроль. Дехто з нових успішних громадян навіть пропонує розширити цю систему."

vlt_servants_friends2:0 "Система Індентури"
vlt_servants_friends2_desc:0 "Батько Лінетт розумів, як важко знайти хорошу допомогу. Він розробив унікальну систему, за якою працівники добровільно укладали довгострокові контракти. Зараз слуг розподіляє Центр Розподілу Слуг. Але, можливо, краще дозволити громадянам продавати й купувати контракти, за умови належного нагляду й документації у трьох примірниках."

vlt_industry_buffs:0 "Майстерня Пустки"
vlt_industry_buffs_desc:0 "Лінетт подала законопроєкт, який дозволить працівникам Міста-Сховища продавати товари на відкритому ринку, з частковим відрахуванням прибутку до бюджету міста. Це стимулює економіку та інновації, хоч і потребує політичного капіталу."

vlt_information_office:0 "Відкрите Інформаційне Бюро"
vlt_information_office_desc:0 "У 2240-х Місто-Сховище перевело більшість своїх архівів у цифровий формат. Перший Громадянин Лінетт запропонувала надати доступ до цих даних усім мешканцям, навіть у Внутрішньому Дворі. Можливо, цей обмін знаннями вдихне нове життя в Пустку."

vlt_ultracite_sorry_garn:0 "Здорове Зелене Світіння"
vlt_ultracite_sorry_garn_desc:0 "Місто-Сховище та Ґеко приваблюють усіляких геніїв. Один із новоприбулих — доктор Горнрайт із Аппалачії. Змучена 'дрібним розумом' своєї батьківщини, вона пропонує нам енергетичне рішення: дивний, світний кристал..."

vlt_shoshone:0 "Наші Північні Друзі"
vlt_shoshone_desc:0 "Шошони на півночі — це два різні угруповання. Одне — довоєнна резервація, що перетинала кордон з Айдахо. Інше — біженці з самого Айдахо, які втекли від Культистів. З них можуть вийти хороші союзники..."

vlt_nevada_air_force:0 "Поштова Служба Невади"
vlt_nevada_air_force_desc:0 "Поки Вегас покладається на кур’єрів, Місто-Сховище зв’яже північну Неваду за допомогою своїх автоматичних помічників. Повірте, Айбот завжди доставить посилку."

vlt_geothermal:0 "Гарячі Джерела"
vlt_geothermal_desc:0 "Шошони щедро дозволили нам раціонально керувати гарячими джерелами на їхніх землях. Це принесе всім користь — а нам, звісно, в першу чергу."
vlt_geothermal_tt:0 "\nВи отримаєте бонус, якщо зробили [SHO.GetNamewithFlag] маріонеткою."

vlt_nevada_pact_baby:0 "Пакт Невади"
vlt_nevada_pact_baby_desc:0 "Лінетт розпочала реформи в Місті-Сховищі, вирішила проблему Ґеко й освітила Пустку. Тепер настав час перетворити Неваду на союз цивілізованих держав, що працюють заради майбутнього."

vlt_reno_yay:0 "Доля Ріно"
vlt_reno_yay_desc:0 "Ріно обмінює золото на наші медичні засоби й енергетичну зброю, хоч ми й досі не зовсім розуміємо, як воно взагалі функціонує. Наркоманія, проституція, відсутність уряду — але Ріно живе. Може, варто домовитись?"

vlt_tv_town_ours:0 "Вимкнути Телевізор"
vlt_tv_town_ours_desc:0 "Секрети Есмеральди, що заховані в Телевізорному Місті, дозріли для захоплення. Можливо, час забрати його собі — хто знає, що ми знайдемо?"

vlt_puppet_yakuza:0 "Чому Якудза в Неваді?"
vlt_puppet_yakuza_desc:0 "І чому Ріно досі з ними не розібрався? Як би там не було — тепер це наша відповідальність."

vlt_arroyo_yay:0 "Наші Побратими зі Сховища"
vlt_arroyo_yay_desc:0 "Арройо — наше братнє місто. Побудоване мешканцями Сховища з допомогою одного Г.Е.К.К., воно перетворило Орегон на квітучий край. Разом ми — форпости цивілізації перед обличчям північного жаху."
vlt_arroyo_yay_tt:0 "Ви запросите §Y[ARR.GetNameWithFlag]§! до дослідницької групи Пакту Невади!"

vlt_arroyo_experiences:0 "Уроки Арройо"
vlt_arroyo_experiences_desc:0 "Лідер Арройо колись був Капітаном Варти за видатні заслуги. Тепер, коли дружба поновлена, ми можемо багато чому навчитись у війська, якого вчив сам Обранець."

vlt_automated_helpers3:0 "Роботизовані Сховища"
vlt_automated_helpers3_desc:0 "Деякі громадяни згадують про довоєнні склади з роботами, що досі збереглись. Дивно, як добре вони збереглися після 200 років..."

vlt_ncr_rejoin:0 "Прогрес на Наших Умовах"
vlt_ncr_rejoin_desc:0 "Під керівництвом Лінетт Місто-Сховище оновило північну Неваду. Але вона ніколи не була ворогом батьківщини. І, можливо, час Цезарю побачити, на що здатна наша Варта."

vlt_home_is_nevada:0 "Край, Що Я Найбільше Люблю"
vlt_home_is_nevada_desc:0 "Під проводом Лінетт Невада перетворилась із безплідної пустки на малозаселений, але квітучий оазис у морі хаосу. В самому серці Золотого Заходу — для мене дім — це Невада."
vlt_home_is_nevada_tt:0 "Кожен член §MПакту Невади§! отримає бонус до виробництва мікросхем, композитів і просунутих ресурсів."

vlt_cute_racoons:0 "Наймиліші Мутанти"
vlt_cute_racoons_desc:0 "[SLN.GetName] — такі ж смертоносні, як і милі. Якби всі мутанти Пустки були такими — можливо, був би мир. Переконаймо [SLN.GetLeader] співпрацювати з нами й використати їхні вмілі лапки для точного виробництва."

vlt_better_in_our_hands:0 "Краще — В Наших Руках"
vlt_better_in_our_hands_desc:0 "Чому ми дозволяємо рейдерам сидіти на буквальному золотому покладі, який міг би піти на благо міста й прогресу?\n\nЦе неприйнятно й має бути виправлено."

vlt_gold_mine:0 "Золота Копальня Елько"
vlt_gold_mine_desc:0 "Рейдери використовували копальню для власного збагачення.\nТепер вони пізнають 'принади' боргової служби."
vlt_gold_mine_tt:0 "§OЯкщо ви випустили [PAL.GetNameWithFlag] як маріонетку, цей фокус дасть додатковий бонус.§!"

vlt_puppet_slags:0 "Анархісти Попереду!"
vlt_puppet_slags_desc:0 "У Неваді залишилося лише кілька опонентів, які ще становлять загрозу. Серед них — Слаги та Модок. На щастя, ми можемо впоратися з ними разом."

vlt_racoons_yay:0 "Ніяких Богів, Лише Прогрес"
vlt_racoons_yay_desc:0 "Занадто довго народ С’лантер був розділений, не в силах впоратися з власним трагічним минулим. Але під належним керівництвом вони можуть тримати... ну, не голови, але носи гордо! А свинець з їхніх земель послужить усій Пустці."
vlt_racoons_yay_tt:0 "§OЯкщо ці милі [SLN.GetFlag]§Yєноти§! входять з вами до одного альянсу, цей фокус дасть додатковий бонус:§!"

vlt_van_graffs:0 "Купити в Ван Граффів"
vlt_van_graffs_desc:0 "Незважаючи на їхню... сумнівну репутацію, Ван Граффи готові продати енергетичну зброю за помірною ціною. Якщо ми хочемо мати армію — доведеться в них купувати."

vlt_nevada_pact_decision_category:0 "Пакт Невади"
vlt_nevada_pact_decision_category_desc:0 "«Гуманітарний імперіалізм» Лінетт піднесе народи Невади. Там, де раніше була лише дикунська пустка, Місто-Сховище створить Лігу Цивілізованих Держав."

invite_to_vault_university:0 "Запросити [FROM.GetName] до Університету Міста-Сховища"

vlt_gecko_boom:0 "Майстерні Ґеко"
vlt_gecko_boom_desc:0 "Можна створити безліч цікавих речей... якщо, звісно, вас не лякає постійне, ну, високе фонове опромінення."

vlt_power_armor_training:0 "Тренування з Силовою Бронею"
vlt_power_armor_training_desc:0 "Виведення військ НКР, можливо, зробило Місто-Сховище більш вразливим, але наші співгромадяни можуть навчити нас користуватись силовою бронею."

vlt_last_best_hope:0 "Остання Надія Миру"
vlt_last_best_hope_desc:0 "Громадяни Міста-Сховища можуть цуратись конфліктів, але в глибині душі всі вони знають: наше місто — утопія Пустки. Тільки ми здатні врятувати цей світ."

vlt_vault_storage:0 "Відкрити Майстерні Сховища"
vlt_vault_storage_desc:0 "Хоч Сховище роками використовували здебільшого як склад, багато законсервованих машин можна знову запустити — задля війни. Чому б не виробляти зброю в найбезпечнішому місці, яке в нас є?"

vlt_enclave_scientists_heeh:0 "Свобода Думки"
vlt_enclave_scientists_heeh_desc:0 "Багато з наших іммігрантів-учених раніше проводили неймовірні дослідження, але були придушені бажанням анонімності та міською бюрократією. Якщо усунути бюрократію — вони допоможуть нам розквітнути!"

vlt_automated_helpers:0 "Наші Металеві Друзі"
vlt_automated_helpers_desc:0 "Місто-Сховище давно покладається на високі технології, але ще тридцять років тому тут не було й сліду роботів. Дехто з громадян має досвід їх створення та обслуговування — можливо, час зробити крок у майбутнє.\n\nІ, до речі, їдять вони менше за слуг."

vlt_automated_helpers2:0 "Роботизовані Конвеєри"
vlt_automated_helpers2_desc:0 "Під мудрим керівництвом [VLT.GetLeader] ми тепер маємо інструменти для створення інструментів... що виготовляють роботів для війни. Ура!"

vlt_implants:0 "Покращити Наших Людей"
vlt_implants_desc:0 "Автодоки Міста-Сховища здатні провести прості операції на кшталт вживлення шкіряних пластин чи тепловідводів у кістяк. Хоча ми не прагнули широкого впровадження кібернетики, це може врятувати життя нашим вартовим — ще одна співчутлива ініціатива Лінетт."

vlt_amenities_exports:0 "Експорт Благ"
vlt_amenities_exports_desc:0 "Просуваючи вільне підприємництво через соціальне планування, наші працівники змогли наростити експорт у Пустці. Вперше нові Pip-Boy'ї продаються на ринку Каліфорнії."

vlt_modoc_farm:0 "Годувати Неваду"
vlt_modoc_farm_desc:0 "Міцні фермери Модока годують більшу частину Невади, але страждають від браку техніки, добрив та насіння. Ми можемо їм допомогти!"

vlt_a_renewal:0 "Оновлення"
vlt_a_renewal_desc:0 "Після всієї цієї метушні, можливо, настав час для чогось нового."

vlt_strengthen_the_garrison:0 "Посилити Гарнізон"
vlt_strengthen_the_garrison_desc:0 "Гарнізон НКР, розміщений тут 30 років тому для захисту від рейдерів, перебуває в жалюгідному стані. Занедбані будівлі, недосвідчені та погано споряджені солдати. Це треба змінити. Викидати все на вітер — дурість. Краще вдосконалити — і зміцнити зв’язки з НКР."

vlt_gun_runner_contacts:0 "Контакти з Gun Runners"
vlt_gun_runner_contacts_desc:0 "Gun Runners уже давно є головними постачальниками військових сил НКР, і саме від них походить більшість спорядження, що його має гарнізон. Деякі з кмітливіших солдатів досі підтримують зв'язок із трейдерами Gun Runners. Ми можемо використати це, щоби закріпити їхню присутність у Місті-Сховищі."

vlt_exclusive_contracts:0 "Ексклюзивні Контракти"
vlt_exclusive_contracts_desc:0 "Угода з Gun Runners виявилася успішнішою, ніж ми очікували. Тепер ми маємо стабільний доступ до якісної зброї як для себе, так і для гарнізону НКР — прямо з серця республіки."

vlt_joint_exercises:0 "Спільні Навчання"
vlt_joint_exercises_desc:0 "Наші вартові — не найкращі солдати у Пустці, але завдяки дисципліні вони можуть навчити гарнізонних солдатів чогось важливого. А ті, у свою чергу, поділяться польовим досвідом. Навчання разом буде на користь обом сторонам."

vlt_joint_exercises2:0 "Трохи Західного Перестрільництва"
vlt_joint_exercises2_desc:0 "Солдати Західного Узбережжя мають зовсім інший досвід. Поки ми здебільшого займались охороною порядку, вони билися з рейдерами й диким звіром заради нових поселень. Нам є чому в них повчитися."

vlt_ncr_gunslinging:0 "Західне Перестрільництво"

vlt_ncr_irregulars:0 "Нерегулярні Частини НКР"
vlt_ncr_irregulars_desc:0 "Ми з’ясували, чому гарнізон НКР такий неорганізований і недисциплінований. Схоже, до нас відправляли тих, від кого хотіли позбутися: синів політиків, образливих солдатів, тих, хто не вписувався. Але це не означає, що вони погані вояки — їм просто потрібно дати змогу проявити себе."

vlt_a_matter_of_faith:0 "Питання Віри"
vlt_a_matter_of_faith_desc:0 "Була одна річ, яку Гордон із Ґеко приніс із собою. Річ, що здалась дивною мешканцям Міста-Сховища. Щось старе і давно забуте.\nЙого віра.\nВсе старе знову стає новим."

vlt_primer_to_renewal:0 "Культ Оновлення: Вступ"
vlt_primer_to_renewal_desc:0 "Як пояснити щось настільки абстрактне, як віра, людям, які живуть лише наукою? Потрібно багато гарних промов і слів про переваги віри в щось більше за себе.\nА промови Гордон вміє. Вони ж і зробили його Першим Громадянином, чи не так?"

vlt_renew_servants:0 "Мовчазні Маси"
vlt_renew_servants_desc:0 "Велика популяція слуг у Місті-Сховищі — бомба сповільненої дії. Їх тримає в покорі лише обіцянка громадянства. Але за весь час, що Гордон жив тут, він бачив лише кількох, хто справді його отримав. Очільники міста ніколи й не мали наміру виконати обіцянку. Одного дня слуги це зрозуміють."

vlt_rituals_of_a_new_faith:0 "Обряди Нової Віри"
vlt_rituals_of_a_new_faith_desc:0 "Звичайний громадянин Міста-Сховища любить порядок і передбачуваність. Останні потрясіння після Вибору викликали занепокоєння. Найкращий спосіб повернути стабільність — дати їм прості, регулярні обряди. Культ Оновлення не має своїх... Тож ми вигадаємо."

vlt_revisting_old_goals:0 "Повернення до Старих Цілей"
vlt_revisting_old_goals_desc:0 "Спочатку Оновлення мало буквальний зміст — 'зцілення' ґулів. Так, це звучить наївно. Але це не означає, що немає медичних процедур, здатних покращити якість їхнього життя."

vlt_a_teacher_returns:0 "Повернення Вчителя"
vlt_a_teacher_returns_desc:0 "До війни Гордон був важливою фігурою на Волл-стріт. Його або поважали, або боялися. Але це було давно. Він змінився. Можливо, настав час звернутись до того, хто навчив його виживати після вибухів."
vlt_a_teacher_returns_tt:0 "§gРезультат цього фокусу залежить від того, яке рішення §YGordon з Ґеко§! ухвалить щодо своєї §Pвіри§!.§"

vlt_integrate_dharmist_teaching:0 "Інтегрувати Вчення Дгарми"
vlt_integrate_dharmist_teaching_desc:0 "Брейн запропонував включити деякі з учень Дгарми до Культу Оновлення. Оскільки це — найпоширеніша релігія на Західному Узбережжі (поряд з поклонінням старим богам і деяким потойбічним речам), це допоможе завоювати симпатію пустельників, адже вони побачать щось знайоме."

vlt_dharma_teachings:0 "Вчення Дгарми"

vlt_open_a_proper_church:0 "Відкрити Церкву в Ґеко"
vlt_open_a_proper_church_desc:0 "Довгий час Культ Оновлення залишався таємною вірою. Таємні знаки, таємні зустрічі. Але цьому кінець. Нам потрібен справжній дім для віруючих. І першим його отримає Ґеко — місце, де все почалося."

vlt_a_matter_of_economy:0 "Питання Економіки"
vlt_a_matter_of_economy_desc:0 "Гордон не думав, що повернеться до своєї справи до війни. Так, Волл-стріт, певно, нині — просто велика яма в землі, але зі своєю неочікуваною посадою у Місті-Сховищі він має змогу створити щось подібне. Якщо, звісно, спершу позбутися міської бюрократії."

vlt_ncr_trade:0 "Найбільший Ринок Заходу"
vlt_ncr_trade_desc:0 "НКР — найбільший покупець високотехнологічних і медичних товарів, які ми виробляємо. Їхній попит в рази перевищує наші можливості — без ризику зруйнувати власну економіку. Звісно, ми навряд чи зможемо задовольнити все, але спробувати варто."

vlt_the_way_south:0 "Торгівля на Південь"
vlt_the_way_south_desc:0 "Торгівля з НКР переважно здійснювалась через приватних перевізників, як-от Багряний Караван, що проходив через Модок, Нью-Ріно та Ден. Ми втрачали прибутки на комісіях і митах. Власний торговельний шлях на південь буде значно вигіднішим — якби ж не рейдери, що заважають."

vlt_cannibals_of_nevada:0 "Канібали Невади"
vlt_cannibals_of_nevada_desc:0 "Шакали мають 'яскраву' історію. На жаль, здебільшого насильницьку. Сумніваюся, що хтось буде проти, якщо вони звільнять місце для нової торговельної дороги."

vlt_vipers_of_nevada:0 "Зламати Їм Ікла"
vlt_vipers_of_nevada_desc:0 "Вайпери — підступна зграя змієшанувальників. Ніхто й оком не змигне, якщо ми витруїмо цю отруту з невадських рівнин."

vlt_karma_catching_up:0 "Карма Наздоганяє"
vlt_karma_catching_up_desc:0 "Якудза мріють бути однією з правлячих сімей Нью-Ріно. Та насправді вони — розбійники, що тероризують усіх на своїй території. Це неприйнятно, якщо ми плануємо регулярний рух через ті землі."

vlt_california_dreaming:0 "Каліфорнійські Мрії"
vlt_california_dreaming_desc:0 "Шлях до Каліфорнії нарешті очищено від рейдерів та інших перешкод.\nНехай потече капітал."

vlt_economic_freedom:0 "Економічна Свобода"
vlt_economic_freedom_desc:0 "Те, що зараз коїться на узбережжі Тихого океану, — гарне нагадування, чому не варто приєднуватись до НКР. Принаймні поки що. Замість цього слід зміцнити зв’язки з нещодавно сформованою [RDS.GetName] — у них принаймні є здоровий глузд."

vlt_joining_on_our_own_terms:0 "На Власних Умовах"
vlt_joining_on_our_own_terms_desc:0 "НКР давно прагне підкорити Місто-Сховище. Раніше нас тиснули, але зараз — затишшя. Гордон вважає, що приєднання можливе, але лише на вигідних умовах. І зараз саме час їх переукласти."

vlt_secure_the_path:0 "Забезпечити Шлях"
vlt_secure_the_path_desc:0 "Ми зуміли прокласти постійний маршрут до НКР, відкривши нам шлях на все західне узбережжя. Але безпечно там назвати не можна. [VIP.GetName] досі загрожують цьому коридору цивілізації. Час це змінити."
vlt_secure_the_path_tt:0 "Додає §G2§! §YФорпости§! у провінціях уздовж кордону з §YВайперами§!."

vlt_snakes_in_the_grass:0 "Змії в Траві"
vlt_snakes_in_the_grass_desc:0 "Наша політика щодо Вайперів досі була реактивною. Але ми не здатні повністю контролювати такі великі території. Попри наші зусилля, рейдери продовжують прориватись. Може, настав час діяти на випередження."

vlt_focus_efforts_on_redding:0 "Барони Реддінга"
vlt_focus_efforts_on_redding_desc:0 "Хоч вони й не такі впливові, як колишня НКР, барони брамінів із Реддінга — справжні бізнесмени. А таких Гордон поважає. Торгівля й вигідні угоди можуть стати початком великої дружби."

vlt_focus_efforts_on_ncr_proper:0 "Серце Нації"
vlt_focus_efforts_on_ncr_proper_desc:0 "Йдеться про справжні, довоєнного зразка держави. Не банди, не місто-держави, не міліція. НКР — найкраща на континенті надія людства на повернення до втраченого."

vlt_vault_street:0 "Волт-Стріт"
vlt_vault_street_desc:0 "НКР — одна з небагатьох націй, де економіка ще існує. Але їм є чого навчитись у такого ветерана, як Гордон. А якщо при цьому Місто-Сховище стане фінансовим центром республіки — чудовий бонус."
vlt_vault_street_tt:0 "Отримати 200 §Yдоларів НКР§!."

vlt_what_about_gecko:0 "А Як же Ґеко?"
vlt_what_about_gecko_desc:0 "Гордон не забув, звідки прийшов — принаймні після війни. Ґеко — його дім вже кілька століть. Варто надати цьому місцю голос у політиці Міста-Сховища.\nФестус балакає багато, але справу знає. Він тримав електростанцію в робочому стані понад 200 років."
vlt_festus_advisor_token_tt:0 "Призначити радника §YФестуса§! із бонусом: Швидкість дослідження спеціалізації промисловості: §G+5%§!, Притік біженців: §G+10.00%§!"

vlt_integrating_the_ghouls:0 "Інтегрувати Ґулів Ґеко"
vlt_integrating_the_ghouls_desc:0 "Надати Ґеко рівноправне місце — добре. Але ще краще — зробити його мешканців повноцінними громадянами Міста-Сховища. Серед них є носії безцінних довоєнних знань."
can_recruit_ghouls_tt:0 "[ROOT.GetName] тепер може вербувати §Yпіхоту-ґулів§!"
ghoul_advisors_become_available_tt:0 "Стануть доступні §Yрадники-ґули§!."

vlt_sister_cities:0 "Міста-Побратими"
vlt_sister_cities_desc:0 "Настав час перетворити Ґеко з забутої купи халуп на рівного партнера Міста-Сховища. Разом ми — сила."

vlt_spending_money_to_make_money:0 "Щоб Заробити — Треба Витратитись"
vlt_spending_money_to_make_money_desc:0 "Нічого не виникає з повітря. Все — результат зусиль. Хочемо великого — треба працювати на повну."

vlt_melting_pot:0 "Культурний Казан"
vlt_melting_pot_desc:0 "Одне з базових потреб людини — захист від стихії й рейдерів. Відчинімо брами Міста-Сховища для Пустки.\nУявіть досвід і навички всіх цих людей — чого ми досягнемо!"
vlt_melting_pot_tt:0 "Під час набору §Yнового командира§! тепер є шанс, що він буде не з §YМешканців Сховища§!, а з будь-якого походження."

vlt_the_bears_arms:0 "Щит Невади"
vlt_the_bears_arms_desc:0 "Наші зв’язки з Республікою — наша дружба — стали міцнішими. Їхні солдати ризикують життям заради Заходу, а ми даємо їм найновішу зброю. Який шанс у [CES.GetLeader] проти такого союзу?"

vlt_ncr_joins_research_pact:0 "Спільні Інтереси"
vlt_ncr_joins_research_pact_desc:0 "Місто-Сховище та НКР лише зближуються. Уявіть, що зможе Каліфорнія, якщо поєднає свою промисловість із нашою наукою. Який шанс у племінних виродків проти армії з нескінченними патронами та бойовою бронею?"

#### Ideas ####
vault_automated_security:0 "Автоматизована Охорона"

liberation_yay:0 "Прокламація Про Звільнення"

ncr_shield_nevada:0 "Щит Невади"

vlt_ncr_trade_route_established:0 "Південний Торговельний Шлях"
vlt_ncr_trade_route_established_desc:0 "Що б не сталось у ці тривожні часи, ми самостійно проклали шлях до каліфорнійських земель. І ніхто не зможе в нас цього відібрати."

vlt_renew_servant_integration:0 "Інтеграція Класу Слуг"
vlt_renew_servant_integration_desc:0 "Перетворити кожного слугу на повноправного громадянина — це не станеться миттєво. Наприклад, їм потрібне власне житло, а не комірчина в чужому домі. Але найперше — їм потрібна робота, яка не передбачає рабства."

vlt_redding_buff_send:0 "Дослідницький Досвід Міста-Сховища"

#### Actual Cult of Renewal ####

vlt_yes_i_am_a_rat:0 "Так, Я Кротопацюк"
vlt_yes_i_am_a_rat_desc:0 "Це були перші слова, які Брейн вимовив, вилізши на трибуну під час виступу Гордона на засіданні ради Міста-Сховища. Після цього виникла купа запитань, переважно в стилі «Що, чорт забирай, відбувається?». Але наприкінці зустрічі Брейн таки переконав раду, що кротопацюк на посаді Першого Громадянина — це гарна ідея."

vlt_this_has_gone_surprisingly_well:0 "Це Минуло Дивовижно Добре"
vlt_this_has_gone_surprisingly_well_desc:0 "Можна було б подумати, що мешканці Міста-Сховища повстануть при одній лише думці про розумного кротопацюка на чолі... але ні. Можливо, вони просто втомились від усіх останніх змін у своїй картині світу й сприйняли нову реальність із бурчанням приреченості.\nНу що ж.\nЧас для ще кількох змін."

vlt_keeng_raat_sends_his_regards:0 "Кінг Ра'ат Передає Привіт"
vlt_keeng_raat_sends_his_regards_desc:0 "Брейн ніколи не прагнув контролювати своїх менш розумних родичів-кротопацюків. Цим більше займався його брат — божевільний у свої останні дні. Але це не означає, що він не може. Просто не хотів. \nАле з новою посадою йому потрібна... щуряча сила для підмоги обмеженим людським і ґульським силам Міста-Сховища."
can_recruit_molerats_tt:0 "[ROOT.GetName] тепер може вербувати §YКротопацюків§!"

vlt_a_home_for_our_new_fuzzy_friends:0 "Дім для Наших Нових Пухнастих Друзів"
vlt_a_home_for_our_new_fuzzy_friends_desc:0 "Кротопацюки не вимагають багато, але трохи укриття їм би не завадило. А ще це може заохотити їх «розмножуватись».\nВи бачили кротопацюченят? Вони чарівні."

vlt_biggest_threat_since_the_master:0 "Найбільша Загроза від Часів Майстра"
vlt_biggest_threat_since_the_master_desc:0 "Ніхто достеменно не знає, хто такий «Майстер», про якого згадував Брейн, але він дуже чітко дав зрозуміти: десь там, у Пустці, є істоти, яких він називає «псайкерами», і які можуть знищити крихти цивілізації. І лише Місто-Сховище здатне їх зупинити."

vlt_psychic_emanations_from_the_north:0 "Психічні Випромінювання з Півночі"
vlt_psychic_emanations_from_the_north_desc:0 "Перша ціль — десь на півночі, каже Брейн. Психохвилі потужні, але... розсіяні. Це не зовсім поряд, тож доведеться пробивати собі шлях.\nОмлет без вторгнення не приготуєш."

vlt_the_road_to_hell:0 "Шлях до Пекла..."
vlt_the_road_to_hell_desc:0 "Бакару не зробили нічого, що виправдало б наше вторгнення, окрім хіба що того, що з ними нестерпно спілкуватись. Спробуйте домовитись про прохід із тими, хто говорить виключно архаїчним ковбойським жаргоном.\nАле це задля загального блага."

vlt_paved_with_good_intentions:0 "...Вистелений Добром"
vlt_paved_with_good_intentions_desc:0 "Станція Чемалт — те саме, що й з Бакару, тільки менше капелюхів і більше звичайного рейдерського безумства."

vlt_actually_paving_roads:0 "Власне Дорожнє Будівництво"
vlt_actually_paving_roads_desc:0 "Навіть коли на кону зупинка псайкерського апокаліпсису — це не причина нехтувати інфраструктурою. Тим паче, ті рейдери явно не вміли підтримувати дороги."

vlt_hand_out_psychic_nullifiers:0 "Роздати Психонейтралізатори"
vlt_hand_out_psychic_nullifiers_desc:0 "Одне з досягнень наших езотеричних досліджень — психонейтралізатор. Трохи помилкова назва, бо він не нейтралізує, а радше приглушує психічну енергію. Але ж і глушник не робить пістолет повністю беззвучним — тож лишаємо назву як є."

vlt_weird_science:0 "Дивна Наука"
vlt_weird_science_desc:0 "Переконати науковців Міста-Сховища займатись тим, що звучить як «чакри» і «аури», — непросто. Але як тільки вони усвідомлюють, що це реально — занурюються з головою."

vlt_weird_sciene_idea:0 "Дивна Наука"
vlt_weird_sciene_idea_2:0 "Дивна Наука"
vlt_weird_sciene_idea_3:0 "Дивна Наука"

vlt_experimental_research:0 "Езотеричні Дослідження"
vlt_experimental_research_desc:0 "Окрім гіпотез про психічні загрози, побічні проєкти дали нам цікаві ідеї щодо лазерної зброї. Хоча як це пов’язано — не зовсім ясно. Але наука!"

vlt_put_lasers_on_molerats:0 "Лазери на Кротопацюків"
vlt_put_lasers_on_molerats_desc:0 "Кротопацюки самі по собі не є загрозою для добре озброєного ворога. А якщо оснастити їх лазерами з автоприцілом? О, тоді — щуряча війна!"

vlt_put_lasers_on_people:0 "Лазери для Людей"
vlt_put_lasers_on_people_desc:0 "Не можна покладатись лише на щурів. Іноді вірний старий лазер у руках солдата — саме те, що треба."
vlt_put_lasers_on_people_tt:0 "До національного складу додано §Y300§! одиниць §YПокращеної енергетичної зброї Культу Оновлення§!."

vlt_molerats_with_lasers:0 "Кротопацюки з Лазерами"

vlt_a_dance_some_trees:0 "Танок і Трохи Дерев"
vlt_a_dance_some_trees_desc:0 "Схоже, що джерелом психосигналу серед Танцюристів Кісток є не псайкер, а дивні червоні дерева. І Танцюристи яростно боронять цей ліс.\nНу й нехай. Враховуючи їхній канібалізм — ми ще й робимо добро світу."

vlt_different_kind_of_forestry:0 "Лісівництво Нового Типу"
vlt_different_kind_of_forestry_desc:0 "Червоний Ліс на території Танцюристів Кісток може бути ключем до утримання аномалії. Потрібно закріпитися в регіоні, аби зберегти ліс і продовжити дослідження."

vlt_spatial_anomalies:0 "Просторові Аномалії"
vlt_spatial_anomalies_desc:0 "Ми виявили просторову аномалію — помилку у самій тканині світу, якщо не знайти кращих слів. Ми відправили пана Хендi з купою додаткового обладнання, щоби з’ясувати: а чи є там щось по той бік? І якщо є — куди саме воно веде?"

vlt_subspace_stabilizers:0 "Стабілізатори Підпростору"
vlt_subspace_stabilizers_desc:0 "Ми витратили чимало часу та зусиль, щоби зрозуміти, коли аномалії взагалі можна використовувати, та як скоротити час очікування. Хто ж знав, що все можна вирішити купкою старих ґаджетів зі Сховища. Цей гідроелектромагнітосферний регулятор — справжнє диво. І електростанції лагодить, і кротовини стабілізує. Вражає."
vlt_subspace_stabilizers_tt:0 "§GУсі аномалії тепер доступні постійно без жодних затримок.§!"

vlt_getting_to_the_bottom_of_the_prison:0 "Докопатися до Суті"
vlt_getting_to_the_bottom_of_the_prison_desc:0 "«Суть» тут — це доволі велика дослідна лабораторія під в’язницею."

vlt_weird_government_experiments:0 "Дивні Державні Експерименти. Хто Б Міг Подумати"
vlt_weird_government_experiments_desc:0 "Хоча... нічого дивного. Схоже, ще до війни в тій в’язниці працювала чорна лабораторія, де штучно намагались створити псайкерів усіма можливими способами. Ймовірно, з FEV. Доказів ми поки не знайшли, але ж зазвичай без нього не обходиться. Ми також знайшли джерело сигналу. Це була в’язень. Ще з довоєнних часів. Як вона досі... була... жива — загадка."

vlt_fortify_the_exit_point:0 "Укріпити Точку Виходу з Аномалії"
vlt_fortify_the_exit_point_desc:0 "Кожна спроба відправити щось через «вихід» з аномалії закінчилась провалом. Нічого не доходило на інший бік — навіть через тривалий час. (Бідолашний кротопацюк.) Тож усе, що ми можемо — це відправити спорядження через вхідну точку, щоб допомогти нашим людям облаштувати нову домівку по той бік."
vlt_fortify_the_exit_point_tt:0 "Створити форпост у точці виходу аномалії під назвою §YДім Далеко Від Дому§!.\n   Додати §Y5§!£victory_points до §YДім Далеко Від Дому§!.\n"

vlt_close_to_home:0 "Близько до Дому"
vlt_close_to_home_desc:0 "Після досліджень аномалії в Червоному Лісі ми виявили психічні сигнали... зовсім поряд зі Сховищем. Це дивно, адже тут ніколи не було активності псайкерів. Хоча... це неподалік місця, де Брейн ховався кілька десятиліть. Але, мабуть, це нічого не означає."
vlt_close_to_home_tt:0 "Створити форпост біля аномалії у Віннемакці під назвою §YДослідницький Форпост «Домус»§!.\n   Додати §Y5§!£victory_points до §YДослідницький Форпост «Домус»§!.\n"
vlt_close_to_home_2_tt:0 "§RАномалія у Віннемакці§! тепер доступна."

vlt_brave_new_world:0 "Ясний Новий Світ"
vlt_brave_new_world_desc:0 "Мексиканські джунглі — нове поле бою у боротьбі з загрозою псайкерів.\nТа попри зміну декорацій — війна не змінюється."

vlt_what_actually_happened_to_zomak:0 "Що Насправді Сталося із Зомаком?"
vlt_what_actually_happened_to_zomak_desc:0 "Він покинув штаб Оновлення приблизно 15 років тому — і зник без сліду. Враховуючи його впертість, сумнівно, що він здичавів або загинув. Можливо, варто дізнатися, що з ним сталося?"




