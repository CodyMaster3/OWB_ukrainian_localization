nf_vault_city.5.t:0 "Вечір Вибору"
nf_vault_city.5.d:0 "Наполегливість Маєра щодо залучення звичайних громадян до цьогорічного вибору нового Першого Громадянина зробила цей процес значно тривалішим, ніж зазвичай. Зазвичай рішення ухвалюється досить швидко і без зайвого розголосу в будівлі ради, одностайним голосуванням її членів. Без публічних промов, без спроб заручитися підтримкою пересічного мешканця. І хоча остаточне слово все одно залишиться за радою, Маєр домігся свого — громадська думка матиме великий вплив на результат. Пів року після оголошення про цьогорічний вибір — настав час для ради зібратися."
nf_vault_city.5.a:0 "Голоси підраховано"

nf_vault_city.6.t:0 "Результат"
nf_vault_city.6.d:0 "Попри наполягання Маєра, що люди прагнуть змін, вони, очевидно, цілком задоволені теперішнім станом речей. Це підтвердилось, коли Лінетт було призначено на другий термін як Першу Громадянку Міста-Сховища. Вона виступила з короткою промовою в парку Нижнього району, подякувавши своїм прихильникам і пообіцявши велике майбутнє для Міста-Сховища."
nf_vault_city.6.a:0 "Ще п’ять років!"

nf_vault_city.7.t:0 "Результат"
nf_vault_city.7.d:0 "Результати цьогорічного вибору підтвердили інтуїцію Маєра — мешканці Міста-Сховища незадоволені теперішнім станом речей. У парку Нижнього району його оточила численна юрба громадян, вітаючи з перемогою. Він хотів сказати кілька слів — підготував промову на цей день, щоб подякувати своїм прихильникам і своєму чоловікові — але святкування не залишили йому шансу висловитися. Тож він просто плив за течією подій, упевнений принаймні в одному: він зробив правильно."
nf_vault_city.7.a:0 "Для Народу!"

nf_vault_city.8.t:0 "Результат"
nf_vault_city.8.d:0 "Можна подумати, що існує процедура для випадку, подібного до цьогорічного результату вибору. Але ні — не існує. Це вперше в зафіксованій історії Міста-Сховища, коли рішення ради щодо нового Першого Громадянина виявилося нічийним. Зазвичай голосування в раді майже одностайне, але цього разу розділена думка громадян відбилась на членах ради, і жоден не захотів поступитися. Замість святкувань і промов вечір пройшов у копанні по архівах і законодавчих текстах, у пошуках вирішення.\nТа його не знайшли."
nf_vault_city.8.a:0 "І що тепер?"

nf_vault_city.9.t:0 "Тиждень Плутанини"
nf_vault_city.9.d:0 "Минула вже ціла неділя. Нічого не змінилося. Члени ради все ще не можуть дійти згоди щодо нового Першого Громадянина, і вирішення ситуації так і не знайдено. Мешканці Міста-Сховища починають відчувати страх і злість. Хоча зазвичай Перший Громадянин не впливає на щоденні справи звичайних людей, ця посада була інституцією і наріжним каменем структури Міста-Сховища вже майже 75 років. Для багатьох відсутність Першого Громадянина — це ознака ще гірших подій попереду. Як Місто-Сховище може бути прикладом цивілізації серед пустки, якщо воно не може навіть вибори провести належним чином?"
nf_vault_city.9.a:0 "Так тривати не може."

nf_vault_city.10.t:0 "Неочікуваний Поворот"
nf_vault_city.10.d:0 "Щось змінилось — і зміна ця прийшла з боку, якого ніхто не чекав. Одного вечора в Залі Віталень, після, можливо, зайвої чарки, Гордон із Ґеко, зазвичай ледь терпимий гуль-аташе з Ґеко, виголосив промову.\nЦе ще не було несподіванкою.\nНесподіванкою стало те, що люди почали слухати.\n\nВін говорив про те, як Місто-Сховище перетворюється на державу другого ґатунку замість утопії, якою воно має бути, як воно все більше відстає від нових потужних гравців. \nПро те, як половина мешканців витрачає більше часу на паперову тяганину і бюрократію, ніж на справді важливі справи — що чітко видно на прикладі нинішньої ситуації.\nПро те, що треба повернутися до духу еволюції, який привів їх так далеко, щоб виправити все до того, як стане запізно.\n\nЛюди слухали."
nf_vault_city.10.a:0 "І погоджувалися."

nf_vault_city.11.t:0 "Щось Нове"
nf_vault_city.11.d:0 "«Рух» набрав обертів не одразу, але щойно люди почали справді слухати Гордона, вони зрозуміли, що він доволі харизматичний (як для гуля), і його слова мали сенс. Там, де кілька тижнів тому виступали і Лінетт, і Маєр, змагаючись за увагу, тепер стояв Гордон з подібними промовами.\nПро те, що Місту-Сховищу потрібен інший шлях, інше бачення.\nПро те, що члени ради можуть бурчати і чинити опір, але вони — лише представники волі народу. А народ хоче змін.\n\nОновлення, можна сказати."
nf_vault_city.11.a:0 "Оновлення? Звучить знайомо."

nf_vault_city.12.t:0 "Можливість"
nf_vault_city.12.d:0 "Це була не зовсім революція в класичному розумінні. Але коли велика частина громадян вимагає обрати певного кандидата, слід замислитись над своєю позицією. Навіть якщо цей кандидат не входив до початкового списку претендентів. Навіть якщо цей кандидат — гуль, як не дивно. Але він номінально був громадянином Міста-Сховища, а всі громадяни мали право на шанс стати Першим Громадянином, незалежно від походження.\nВони трохи зволікали, посилаючись на необхідність перевірити законодавчі норми, але приклад публічних кампаній Лінетт і Маєра вже створив прецедент. Це було лише питання часу.\n\nЗрештою було оголошено, що Гордон із Ґеко стане новим Першим Громадянином Міста-Сховища. Першим, обраним шляхом громадського голосування. Першим, хто обійме цю посаду, не будучи уродженцем Міста-Сховища. Першим гулем."
nf_vault_city.12.a:0 "Primus Inter Pares"
nf_vault_city.12_tt:0 "§YГордон із Ґеко§! стане лідером §YМіста-Сховища§!.\n\nЦе відкриє нове приховане §YДерево Фокусів§!!"




nf_vault_city.13.t:0 "Він називає це «демократією». Я — «владою юрби»."
nf_vault_city.13.d:0 "Місто-Сховище процвітало під керівництвом своєї ради, обраної за результатами GOATS. Ці лідери, у свою чергу, обирали одного зі своїх лав на посаду Першого Громадянина. Призначення Лінетт не стало несподіванкою, враховуючи успіх її матері, і вона добре вела Місто-Сховище. Лінетт підтримує права гулів і виступає за тісніші зв'язки з НКР, сподіваючись стати добрим прикладом для Пустки. Хоча Місто-Сховище має залишатися відстороненим, воно може стати маяком серед бруду й гнилі, що загрожує всьому навколо.\n\nАле не всіх влаштовує така система. Маєр, герой Охорони, перейняв погляди НКР. Маєр вірить, що сила НКР — у її народі, і що Місто-Сховище може стати ядром нового, вільного Невади. Батьки Маєра іммігрували до Міста-Сховища у 2240-х, і він перейняв частину їхніх ідеалів. Місто-Сховище має управлятися народом, для народу і від народу.\n\nА гулям, яких так любить Лінетт? Їм пора піти."
nf_vault_city.13.a:0 "...Насправді, обидва мають рацію."

vlt_selection_has_not_happened:0 "Вибори в Місті-Сховищі 2275 року ще не відбулися"

nf_vault_city.14.t:0 "Обійми Ведмедя"
nf_vault_city.14.d:0 "«Ми маємо багато спільного з НКР: віру в верховенство права, турботу про знедолених і переконання в необхідності відкритого мислення. Ми завжди вважатимемо себе друзями Республіки. Тому, хоч деякі й прагнуть вигнати гарнізон, інші переконані, що нам слід укріплювати зв’язки з Республікою. Бо чи не слід нам об’єднатись навколо влади закону, а не людей?»\n\nВтім, треба визнати: є чимало зауважень до гарнізону. Його солдати — ну, скажімо, не найкращі з лав республіки. Вони погано оснащені через проблеми на півдні. Захист, який вони колись надавали, перетворився на бутафорію. Нам слід вигнати гарнізон і стояти на власних ногах.\n\nВтім, можливо, є третій шлях. Лінетт запропонувала замінити гарнізон на «інструкторів» з НКР, які допоможуть Місту-Сховищу стати самодостатнім. У свою чергу, НКР зможе перейняти дещо з нашої точності в інженерії."
nf_vault_city.14.a:0 "Прощавайте, вірні друзі."
nf_vault_city.14.b:0 "Хіба ми не сильніші разом?"

nf_vault_city.15.t:0 "Народ Сказав Своє Слово"
nf_vault_city.15.d:0 "«Ми маємо багато спільного з НКР — передусім, віру в те, що уряд має бути від народу, для народу і в інтересах народу. Ми завжди вважатимемо себе друзями Республіки.\n\nАле», — продовжив Маєр, — «Місто-Сховище може стояти самостійно. Від імені Ради та Народу Міста-Сховища я оголошую, що наш договір недійсний, а гарнізон буде виведено»."
nf_vault_city.15.a:0 "Великий день для Міста."

nf_vault_city.16.t:0 "Місто-Сховище Виганяє Гарнізон!"
nf_vault_city.16.d:0 "[VLT.GetLeader] вигнав наш гарнізон, і наших солдатів ввічливо, але рішуче супроводили назад до НКР через Ріно. Це образа для Ведмедя, але, зважаючи на наше теперішнє завантаження в Мохаве, де на горизонті блищить Вегас, можливо, так навіть краще."
nf_vault_city.16.a:0 "А навіщо нам, власне, Місто-Сховище?"

nf_vault_city.17.t:0 "Місто-Сховище Виганяє Гарнізон!"
nf_vault_city.17.d:0 "[VLT.GetLeader] вигнав наш гарнізон, і наших солдатів ввічливо, але рішуче супроводили назад до НКР через Ріно. Це образа для Ведмедя, але, можливо, це шанс для [RDS.GetLeader]. Хоча ми можемо ігнорувати цю образу, та, можливо, варто переконати [PAL.GetLeader] здійснити помсту від нашого імені. Ми можемо найняти кількох його рейдерів, аби погрожувати Місту-Сховищу, здобувши за це певний бойовий досвід."
nf_vault_city.17.a:0 "Погрожувати Місту-Сховищу рейдерами? Як цікаво."
nf_vault_city.17.b:0 "Марна трата часу. Поки що."

nf_vault_city.18.t:0 "Ведмідь Захищає"
nf_vault_city.18.d:0 "«Ми маємо багато спільного з НКР: прагнення до зростання, прагнення до успіху. І безпеку для життя, яке це прагнення дає. Але гарнізон у теперішньому вигляді — це тягар; тягар для ресурсів і доброї волі обох наших націй.\nАле ми завжди вважали себе друзями Республіки.\n\nТож», — продовжив Гордон, — «хоча наш договір з Республікою має змінитись, щоб максимально розкрити потенціал обох сторін, ми й надалі підтримуватимемо гарнізон і сподіваємось, що Нова Каліфорнійська Республіка підтримуватиме це місто, яке ми називаємо домом»."
nf_vault_city.18.a:0 "Великий день для Міста."


### 20

nf_vault_city.20.t:0 "Міста Завтрашнього Дня"
nf_vault_city.20.d:0 "Пропозиція Лінетт — дозволити гулям подаватися на громадянство в Місті-Сховищі — викликала менше спротиву, ніж можна було очікувати. Протягом трьох десятиліть обидва міста плекали дух співпраці: електростанція Ґеко допомагала Місту-Сховищу виживати. Жорстка ксенофобія багатьох колишніх лідерів Міста-Сховища відійшла в минуле, і під проводом Лінетт настав час зробити наступний крок. Натхненні баченням рівності, яке колись рухало Старий Світ, Лінетт, Фестус і Ленні працюватимуть над створенням яскравішого майбутнього для всіх. Майбутнього, де люди і гулі працюють пліч-о-пліч, створюючи осередок знань і толерантності там, де раніше панували лише ворожість і недовіра."
nf_vault_city.20.a:0 "У нас є мрія..."
nf_vault_city.20.a_tt:0 "\n§MВідкриває Фестуса як радника — першого громадянина-гуля в Місті-Сховищі.§!"

nf_vault_city.21.t:0 "Порахуйте Самі"
nf_vault_city.21.d:0 "Доктор Горнрайт насолоджувався енергетичним сяйвом генератора. «В Аппалачії вони кажуть, що ультрацит — це унікальне й дорогоцінне. Але як бачите, будь-хто може створити ультрацит, маючи тактичний ядерний заряд. Кусок того ультрациту досі живить цей генератор. І він живитиме все місто, коли ми закінчимо. Та хай краще Фестус зробить розрахунки за вас».\n\n«Нехай ваші новокаліфорнійці ллють кров за Гуверську дамбу. У нас — електростанція. І в нас буде сила»."
nf_vault_city.21.a:0 "Великий день для нас усіх."
nf_vault_city.21.b:0 "А може, це живить і зброю?"

nf_vault_city.22.t:0 "З Руки Простягнутої"
nf_vault_city.22.d:0 "Шошони розглянуть можливість стати протекторатом Міста-Сховища, якщо ми надамо їм громадянство — рішення вкрай суперечливе. Щоб обґрунтувати свої претензії, вони вказують на відносну відсутність мутацій і (що важливіше) страхітливі бойові навички, здобуті в роках боротьби з іншими племенами Айдахо. Це буде непопулярним кроком для Лінетт, але хіба вона справді почне необґрунтоване насильство? Вони — горде плем’я, що полює на дивну одноголову браміну, яку називають «бізоном»."
nf_vault_city.22.a:0 "Навчимо їх мирного життя силою."
nf_vault_city.22.b:0 "Вони ж гідні, чи не так?"
nf_vault_city.22.b_tt:0 "\n§OЯкщо ми дали громадянство тому з Арройо, то чому б не прийняти цих достойних людей?§!"

nf_vault_city.23.t:0 "Розкажіть Нам Про Лазерну Зброю"
nf_vault_city.23.d:0 "Відколи культисти вигнали нас на захід, ми змогли облаштувати собі життя на землях... Дікшутера. Земля тут непогана: є лосі, є дичина, є вода для полів. Але з більшими промисловими ресурсами ми справді зможемо процвітати. А ще, можливо, якось використаємо термальні джерела..."
nf_vault_city.23.a:0 "Хай нам буде честь бути громадянами цієї нової землі."
nf_vault_city.23.b:0 "Ми самі творці своєї долі."

nf_vault_city.24.t:0 "З Невеликою Допомогою Друзів"
nf_vault_city.24.d:0 "Хоча [SHO.GetLeader] виглядав дещо ніяково на церемонії громадянства, ніхто не заперечить, що шошони стануть цінними союзниками у нашому розвитку Пустки. А ще важливіше — в їхніх землях є гарячі джерела, які можуть живити і їхні, і наші оселі. Працюючи разом, Лінетт показала переваги співпраці з чужинцями, які мислять розумно."
nf_vault_city.24.a:0 "За дружбу і одноголових брамінів!"

nf_vault_city.25.t:0 "Дикуни!"
nf_vault_city.25.d:0 "З якихось причин, які ми ніколи не зрозуміємо, шошони відкинули нашу мирну пропозицію побудувати для них менше й ефективніше поселення в обмін на певні гірничі права для Міста-Сховища. Хоч це й прикро — їхня підозрілість, ми все одно зможемо принести їм світло цивілізації. Навіть якщо воно буде з лазерної гвинтівки."
nf_vault_city.25.a:0 "Ми несемо любов!"

nf_vault_city.26.t:0 "Десь На Заході, Де Сонце Сідає"
nf_vault_city.26.d:0 "Невада давно була ігровим майданчиком НКР; а коли вона не була під тінню Ведмедя — її шматували рейдери, культисти та работорговці. [VLT.GetLeader] виступив з ініціативою створення нової фракції — Пакт Невади. Присвячений мирній співпраці між землями Невади, запропонований альянс визнає автономію членів Пакту, одночасно сприяючи торгівлі та розвитку."
nf_vault_city.26.a:0 "Бо для мене дім — це Невада."
nf_vault_city.26.b:0 "Мені це взагалі не цікаво, а вам?"



nf_vault_city.27.t:0 "О, боги, знову Житель Сховища"
nf_vault_city.27.d:0 "Хоч ми й процвітали тихо протягом десятиліть, делегація з Міста-Сховища тепер простягає свою велику, безшерсту руку дружби. [VLT.GetLeader] пропонує допомогти прогресистам захопити владу у Норі та скасувати те, що Лінетт називає «смішними релігіями й застарілими забобонами». Багато хто залишається вірним старим богам і готовий чинити опір будь-якому впливу Міста-Сховища. Як ми відповімо?"
nf_vault_city.27.a:0 "Простягнімо руку дружби."
nf_vault_city.27.a_tt:0 "§C\nМи приєднаємося до Пакту Невади!§!"
nf_vault_city.27.b:0 "Покажімо цим чужинцям зуби."
nf_vault_city.27.b_tt:0 "§R\nПершу Громадянку Лінетт буде ображено, і вона може вдатися до втручання.§!"

nf_vault_city.28.t:0 "Ще Один Друг Міста-Сховища!"
nf_vault_city.28.d:0 "Хоча багато хто насміхався над С’лантерами за їхню примітивність, наша зустріч із [SLN.GetLeader] показала, що вони насправді мудрі (і дуже, дуже милі). [SLN.GetName] погодився на наше доброзичливе наставництво, і тепер вони відправляються на шахти в маленьких шоломах — на благо для всіх. Ба більше, вони запропонували перетворити одну зі своїх святинь на школу."
nf_vault_city.28.a:0 "Іронічно, що Верхні довіряють Жителям Сховища."

nf_vault_city.29.t:0 "Дикуни Відкинули Нас!"
nf_vault_city.29.d:0 "Це катастрофа, це жахливо. Здається, дикі й твариноподібні Норяни захопили владу в [SLN.GetName] і, певно, переслідують Верхніх, які лише бажають миру та нашого керівництва. Ми мусимо звільнити ці нещасні душі від лап їхніх диких побратимів."
nf_vault_city.29.a:0 "О, людство?.."

nf_vault_city.30.t:0 "Той Самий Ренський Відрив"
nf_vault_city.30.d_w:0 "Хоча ми іноді насміхаємося з Ріно, вважаючи його варварським нетрями, чимало наших громадян останнім часом відпочивали там — і більшість повернулися живими. Та Ріно далеко не ідеальне місце, і як член Пакту Невади воно могло б стати чимось значно більшим. Що якби вони виробляли добрива замість джету? Токарні верстати замість зброї? Освітні фільми замість «Братів Корсиканців»? Райти поділяють чимало наших поглядів, і працюючи разом, ми зможемо вистояти перед загрозами Неваді. Нехай Вісімдесятники чи Танцючі-на-Кістках тільки спробують загрожувати мирному та процвітаючому народу."
nf_vault_city.30.a_w:0 "Пане Райт, ми діятимемо правильно."

nf_vault_city.30.d_b:0 "Хоча ми іноді насміхаємося з Ріно, вважаючи його варварським нетрями, чимало наших громадян останнім часом відпочивали там — і більшість повернулися живими. Та Ріно далеко не ідеальне, і як член Пакту Невади воно могло б бути значно більшим. А що якби вони виробляли добрива замість джету? Токарні верстати замість зброї? Освітні фільми замість «Братів Корсиканців»? Але нас трохи турбує те, що Біши прагнуть поширити корупцію НКР у Неваді. Навіть зараз Охорона міста повідомляє, що ті підбурюють рейдерів проти нас. Хоча це можуть бути лише чутки, можливо, варто звільнити Ріно з їхніх жирних лап? Миротворці з Охорони, без сумніву, зробили б вулиці безпечнішими."
nf_vault_city.30.a_g:0 "Це не сексизм, якщо ми її приберемо."

nf_vault_city.30.d_t_good_or_neutral:0 "Є ті, хто боїться, що Ріно — це майбутнє Пустки: земля злочинів і конфліктів. Ніхто не був у захваті, коли Ріно зробив супер-мутанта капітаном своєї Охорони, а ще менше — коли він взяв владу після теракту. Та все ж, він тримає вулиці в безпеці й не переслідує людей у своєму несправедливому місті. Можливо, настав час запросити Ріно до Пакту Невади? Адже ми вже чуємо віддалений гуркіт грому..."
nf_vault_city.30.a_b_wargoal:0 "Це ж заради їхнього ж блага."
nf_vault_city.30.a_b_pact:0 "Можливо, можна знайти інші домовленості..."

nf_vault_city.30.d_g:0 "Хоча ми іноді насміхаємося з Ріно, вважаючи його варварським нетрями, чимало наших громадян відпочивали там останніми роками — і більшість поверталась цілими. Принаймні, так було до захоплення влади Ван Граффами у Пепельну Середу. Тепер на наших кордонах стоїть загін найманців, озброєний плазмовою зброєю, і це лише питання часу, коли вони нападуть на нашу утопію. Заради них — і заради нас — ми маємо вдарити першими."
nf_vault_city.30.a_t_good_or_neutral:0 "Не можна довіряти державі мутантів на нашому кордоні!"
nf_vault_city.30.b_t_good_or_neutral:0 "Можливо, це... е-е, «людина», з якою можна домовитися."

nf_vault_city.32.t:0 "Назад до Міста-Сховища"
nf_vault_city.32.d:0 "[VLT.GetLeader] запросив нас об’єднати наші технології та ресурси. Ми можемо відмовити цьому офіцерові, але ж Обранець багато чого навчився під час свого перебування в Місті-Сховищі. Можливо, і наше нове покоління ще зможе."
nf_vault_city.32.a:0 "Ми навчимося технологіям, а вони — моралі."
nf_vault_city.32.b:0 "Чого можуть нас навчити работорговці?"

nf_vault_city.33.t:0 "Назад до Міста-Сховища"
nf_vault_city.33.d:0 "[ARR.GetLeader] з якоїсь причини відмовився від нашої пропозиції про співпрацю. Що ж, скільки ж ми могли навчитися від тих, хто колупається в носі кістками?"
nf_vault_city.33.a:0 "О, які ж дурні ці Племінні."

nf_vault_city.34.t:0 "Міста Гріху — Більше Ні"
nf_vault_city.34.d:0 "[VLT.GetLeader] — одна з приємніших персон у Місті-Сховищі, тобто вона готова терпіти мутантів у дворику Міста-Сховища... але лише на короткий термін. Тож було несподівано отримати її останню пропозицію: спільно працювати над відбудовою північної Невади. В обмін Лінетт поділиться з нами дослідженнями Міста-Сховища, і ми разом боротимемося з будь-якими загрозами. Можливо, це звучить наївно. Але ми завжди виступали за рівність мутантів, а не їхню перевагу. Тож чому відкидати руку дружби? Навіть якщо ця рука — в костюмі хімзахисту."
nf_vault_city.34.a:0 "Погляньмо в майбутнє."
nf_vault_city.34.b:0 "Окремо — ніколи не значить рівність."

nf_vault_city.35.t:0 "Шоу Зброї"
nf_vault_city.35.d:0 "[VLT.GetLeader] нарешті визнала, що Місто не може покладатися лише на кілька важких лазерних турелей для захисту. З цією метою запропоновано закупити вогнепальну зброю у Ван Граффів за прийнятними цінами. Це чудово для економіки Ріно й ознака нашої прихильності до вільної торгівлі. Однак це також посилить вплив Ван Граффів у нашому прекрасному місті."
nf_vault_city.35.a:0 "Ну, ми ж не можемо сказати «ні» грошам."
nf_vault_city.35.a_tt:0 "\n§cЦе посилить вплив Ван Граффів...§!"
nf_vault_city.35.b:0 "Але вона якось надто вже хихоче..."

nf_vault_city.36.t:0 "Торгівля з Чужинцями"
nf_vault_city.36.d:0 "Ван Граффи прийняли нашу чесну пропозицію. Можливо, чутки про те, що матріарх Ван Граффів — безжальна ділова акула, яка мріє про імперію, — це просто наклеп? Якщо про нас можуть збрехати, назвавши пихатими снобами тільки тому, що ми не забули, як працює каналізація — то, може, і про неї теж збрехали."
nf_vault_city.36.a:0 "Чесно кажучи, зброя таки смердить."

nf_vault_city.37.t:0 "Місто Гріхів"
nf_vault_city.37.d:0 "Сім’ї Ріно відкинули нашу пропозицію, тож ми не зможемо купувати у них зброю. Але принаймні ці ресурси можна використати для оновлення виробництва зброї в самому Сховищі. Нерозумне рішення; кому вони тепер її продаватимуть? Легіону?"
nf_vault_city.37.a:0 "Можливо, так і краще."

nf_vault_city.38.t:0 "Північний Гарнізон"
nf_vault_city.38.d:0 "Часом ми просто забуваємо про наш гарнізон у Місті-Сховищі; там досить спокійно, і роками нічого, крім незначних сутичок з рейдерами, не відбувалося. Проте це — зручний спосіб тримати Місто-Сховище під контролем і забезпечити вигідну торгову угоду, приручаючи місто, яке, якщо його не стримувати, може утворити власну імперію. Тепер [VLT.GetLeader] просить нас вивести гарнізон. Але в обмін ми надамо військову підготовку, щоб допомогти їхній Охороні перетворитися на справжню армію. Дехто виступає проти, але це може стати кроком до справжньої дружби, замість незручної співзалежності."
nf_vault_city.38.a:0 "Армія Міста-Сховища? Мило."
nf_vault_city.38.b:0 "Армія Міста-Сховища? Бр-р-р."

nf_vault_city.39.t:0 "Обмін Офіцерами"
nf_vault_city.39.d:0 "Тіньові Піски погодилися на виведення свого гарнізону. Натомість вони направили обраних офіцерів для допомоги в тренуванні нашої Охорони за новою програмою. Іронічно, але один з офіцерів уже зазначив, що наші відносно великі промислові потужності та мала кількість населення можуть дозволити нам заповнити прогалини в об’єднаних військових силах, які НКР не зможе самостійно покрити. Можливо, майбутня співпраця дозволить нам спеціалізуватися на передових бойових частинах, а НКР — на «людських хвилях»."
nf_vault_city.39.a:0 "Кожне життя цінне, але деякі — цінніші."

nf_vault_city.40.t:0 "Інститут"
nf_vault_city.40.d:0 "Співпраця з Містом-Сховищем продовжує давати плоди. Лінетт запропонувала об’єднати наші наукові дослідження і розкритикувала [NCR.GetLeader] за вузьке мислення. Управління науки та промисловості — хороший початок, але ми здатні на більше. Сьогодні Місто-Сховище стало домом для Інституту науки та промисловості — дослідницького центру для всієї Пустки. Під керівництвом директора Хілдерна Інститут працюватиме заради добробуту всього людства, як яскравий маяк надії на краще завтра.\n\nУже розробляються плани з'єднання комп’ютерів Міста-Сховища, Тіньових Пісків та інших учасників пакту задля обміну знаннями. З часом — хто знає, до чого це приведе?"
nf_vault_city.40.a:0 "Разом Захід ніколи не впаде!"

nf_vault_city.50.t:0 "Питання [MOD.GetName]"
nf_vault_city.50.d:0 "Тепер, коли наш погляд звернений на захід, стає дедалі очевиднішим, що територія, яку контролює [MOD.GetName], має особливе географічне значення для наших планів. Вона є прямим шляхом до Дену та відкриває новий фланг для наступу на [NEW.GetName].\nЩоб забезпечити цей маршрут, ми можемо вдатися до дуже непопулярного рішення — захопити територію силою. Це, скоріше за все, не зустріне підтримки більшості вдома, враховуючи мирну натуру [MOD.GetName], але може виявитися необхідним. Альтернатива — попросити [MOD.GetName] дозволити вільний прохід для наших військ і транспортних конвоїв. Але вони можуть відмовити, і тоді ми опинимось у глухому куті."
nf_vault_city.50.a:0 "Попросити дозвіл на прохід"
nf_vault_city.50.b:0 "Підготувати війська"

nf_vault_city.51.t:0 "[VLT.GetName] Вимагає Військового Доступу"
nf_vault_city.51.d:0 "Цього ранку [VLT.GetName] надіслала повідомлення з вимогою надати вільний прохід її військам через нашу територію. Люди, що перетинають кордони нашої країни — не рідкість, але це зазвичай каравани чи поодинокі мандрівники. Схоже, вони планують використати наші землі як плацдарм для подальших військових дій. Скільки існує [MOD.GetName], ми захищали свою свободу від рейдерів, бандитів і навіть тиску з боку НКР. Надати іншій державі необмежений доступ — це вже надто схоже на окупацію. Ми маємо вирішити, чи дійсно хочемо цього. Хоча не відомо, як відреагує [VLT.GetName], якщо ми їм відмовимо."
nf_vault_city.51.a:0 "Нехай проходять."
nf_vault_city.51.b:0 "Відмовити в проході."
event_modoc_choice_tt:0 "Це може призвести до §Rвійни§! з Містом-Сховищем."

nf_vault_city.52.t:0 "[MOD.GetName] Погоджується"
nf_vault_city.52.d:0 "Сьогодні ми отримали повідомлення: [MOD.GetName] згоден дозволити нам вільне пересування їхньою територією. Це дозволить реалізувати наші подальші плани щодо принесення миру й безпеки на землі колишньої Невади. А з містом Модок як співпрацюючим плацдармом можуть з’явитися й інші можливості для взаємодії."
nf_vault_city.52.a:0 "Чудово!"

nf_vault_city.53.t:0 "[MOD.GetName] Відхиляє Наш Запит"
nf_vault_city.53.d:0 "Коротке повідомлення від [MOD.GetName] чітко дало зрозуміти, що вони жодним чином не зацікавлені у тому, щоб дозволити нам вільно пересуватися їхніми землями. Ми очікували такого результату. Ми можемо залишити все як є та залишити їх у спокої, або ж знову розглянути можливість військового втручання.\nДо того ж, при ближчому розслідуванні виявилось, що вони співпрацюють із якимись мутантами-кротовими людьми.\nІ хто знає, чим вони там займаються? Може, це справжні CHUD’и."
nf_vault_city.53.a:0 "Ми не дозволимо мутантам буквально підкопати нас."
nf_vault_city.53.b:0 "Залишимо їх у спокої."

nf_vault_city.54.t:0 "[VLT.GetName] Надсилає Делегацію"
nf_vault_city.54.d:0 "Перший Громадянин Маєр звернувся до нас із пропозицією — вони надішлють війська, щоб гарантувати нашу незалежність від ворожих сил. Ми майже впевнені, що мається на увазі [EHT.GetName], але в стилі Міста-Сховища прямо про це ніхто не говорить. В обмін вони лише просять дозволити проходження своїх військ нашими територіями та відкритість до подальшої співпраці. Якщо чесно, це непогана угода, враховуючи, що ми нічого не зможемо вдіяти, якщо [EHT.GetName] справді рушить у наш бік."
nf_vault_city.54.a:0 "Приймаємо."
vlt_eas_cooperation:0 "Співпраця з [VLT.GetName]"
vlt_eas_cooperation_tt:0 "Частина нашої співпраці з §Y[VLT.GetName]§! — дозвіл на прохід їхніх військ через нашу територію."

nf_vault_city.541.t:0 "Нові Друзі"
nf_vault_city.541.d:0 "На щастя, не всі в цьому регіоні — рейдери або мутанти. [EAS.GetName] — достойні люди Пустки, яким просто потрібна невелика допомога. Прийнявши нашу підтримку, вони показали, що довіряють нам у захисті та співпраці. Не зрадьмо цієї довіри."
nf_vault_city.541.a:0 "До нових звершень — разом!"

nf_vault_city.543.t:0 "Пропозиція Магістрату"
nf_vault_city.543.d:0 "Магістрат Істпорту надіслав пропозицію щодо інвестування в покращення інфраструктури в його регіоні. З його звітів видно, що, хоча вони й досягли неабиякого прогресу у відновленні довоєнного пивоварного заводу та збудували пристойну логістичну систему для збору й доставки інгредієнтів, простір для вдосконалення залишається. Постає питання: чи інвестувати в розвиток нашого будівельного сектору загалом, чи зосередитись лише на Істпорті?"
nf_vault_city.543.a:0 "Інвестувати в наші будівельні компанії."
nf_vault_city.543.b:0 "Інвестувати винятково в Істпорт."

nf_vault_city.544.t:0 "Пивоварня Істпорту"
nf_vault_city.544.d:0 "Нові звіти від магістрату Істпорту показують його щире захоплення працею місцевих мешканців над пивоварнею. Він надіслав нам зразки їхньої продукції — смачно. Він зазначає, що їм знадобилися б наші технічні знання, аби масштабувати виробництво. Ми могли б отримати безкоштовні партії пива в різних смаках, але краще це піде, якщо не вимагатимемо нічого натомість."
nf_vault_city.544.a:0 "Укласти угоду"
nf_vault_city.544.b:0 "Зробити це безкоштовно"

nf_vault_city.545.t:0 "Люди Істпорту"
nf_vault_city.545.d:0 "Чесні мешканці Істпорту розкидані по всій своїй території. Є кілька концентрованих осередків активності, але здебільшого це малі ферми або незначні поселення. Це створює проблеми з постачанням необхідних товарів і послуг, а також ускладнює їхній захист. Не кажучи вже про робочу силу, про яку місцева влада може навіть не підозрювати, хоча вона потенційно доступна.\nЯкщо ми сконцентруємо населення в менше число, але краще побудованих і захищених міст, це значно підвищить якість життя пересічного мешканця Істпорту.\nА ще, можливо, ми зможемо розвідати потенційних новобранців серед цих людей. Хоча, якщо ми почнемо переманювати найкращих і найрозумніших, керівництву Істпорту це навряд чи сподобається."
nf_vault_city.545.a:0 "Залучімо нових рекрутів."
nf_vault_city.545.b:0 "Збудуймо краще майбутнє для Істпорту"

nf_vault_city.546.t:0 "Пропозиція про Об’єднання Територій"
nf_vault_city.546.d:0 "Магістрат Істпорту довго й виснажливо вів перемовини з [EAS.GetLeader] щодо можливого включення території Істпорту під пряме управління [VLT.GetName]. Його відповідь може значною мірою залежати від того, як ми загалом поводилися з Істпортом. Побачимо, яке буде рішення."
nf_vault_city.546.a:0 "За плідні перемовини!"

nf_vault_city.547.t:0 "Приєднання до [VLT.GetName]"
nf_vault_city.547.d:0 "Керівництво [VLT.GetName] висунуло пропозицію про наше пряме приєднання — фактично, повне входження до їх складу.\nОстанні рік чи більше наші взаємини були дуже успішними, але питання в тому, чи мають вони щодо нас найкращі наміри.\nМи винесли це питання на голосування серед громадян, і їхня відповідь була..."
nf_vault_city.547.a:0 "Ми радо приєднаємося до наших друзів."
nf_vault_city.547.b:0 "Ми хочемо зберегти певну автономію."
nf_vault_city.547.c:0 "Ми хочемо залишатися незалежними."

nf_vault_city.5473.t:0 "[EAS.GetName] Обирає Незалежність"
nf_vault_city.5473.d:0 "Попри найкращі зусилля магістрату та його дипломатичної команди, народ Істпорту вирішив і далі стояти самотужки в цьому дикому світі.\nМи не будемо дорікати їм за їхнє рішення, хоч воно й може виявитися необачним. Проте ми не припинимо підтримувати їх, як і раніше.\nЛюдство має триматися разом, аби вижити у Пустці."
nf_vault_city.5473.a:0 "Що ж, буває."

vlt_eas_more_likely_to_join_tt:0 "Якщо ми покажемо, що нас цікавить не лише власна вигода, [EAS.GetName] може стати відкритішим до §Gмайбутніх угод§!."
vlt_eas_exclusive_imports:0 "Ексклюзивний Імпорт Напоїв"

nf_vault_city.56.t:0 "Дерева До Самої Глибини"
nf_vault_city.56.d:0 "Перший крок до розуміння того, що відбувається в густо лісистій місцевості, був зроблений, коли один топограф досліджував одну з нір, у яких, очевидно, жили мутанти. Він помітив, що стеля нори — це густе переплетення природного коріння. Коли він простежив коріння до інших осель, з'ясувалося, що всі вони пов’язані. Виявилося, що вся лісова зона — це єдина велика рослина, в якій кожне дерево пов’язане з центральним деревом, що колись слугувало чимось на кшталт урядової будівлі фурій.\n\nНаступне велике відкриття сталося під час спроб з’ясувати, звідки бере початок річка й куди вона тече. Спершу припускали, що це природне джерело, яке розкрилось під час війни, але знайдене було значно дивовижнішим. Потік витікав з порожнистого кореня, відкритого й піднятого до повітря. І це не була примітивна система труб, зроблена істотами — вона очевидно виросла так природно.\nПодальше дослідження показало, що ця величезна рослина — це гігантська система збору та фільтрації води. Листя збирає дощ і вологу з повітря, а коріння тягне воду з ґрунту."

nf_vault_city.57.t:0 "Свистячи Правила Змін"
nf_vault_city.57.d_1:0 "Легко виправдати війну з бандою рейдерів, що тероризує поселенців. Значно важче виправдати напад на місто-державу з урядом, яким би корумпованим він не був. Державу з промисловістю, інфраструктурою, освітньою системою. Із цивільним населенням, що просто хоче жити в мирі.\n\nМістер Бішоп, фактичний лідер Нью-Ріно, та його родина мали вдосталь часу, щоб виправити проблеми, які переслідують місто вже вічність. Замість цього він вирішив увіковічнити статус-кво: проституцію, наркоту, наймання своїх головорізів будь-кому, хто заплатить, не зважаючи на наслідки.\n\nТут не потрібна дипломатія. Світ стане кращим, якщо ми позбудемось його і його сім'ї та поставимо на чолі території гідного магістрата. Нас, без сумніву, зустрінуть як визволителів."
nf_vault_city.57.d_2:0 "Легко виправдати війну з бандою рейдерів, що тероризує поселенців. Значно важче виправдати напад на місто-державу з урядом, яким би корумпованим він не був. Державу з промисловістю, інфраструктурою, освітньою системою. Із цивільним населенням, що просто хоче жити в мирі.\n\nМісто ще далеко від ідеалу, але очевидно, що робляться спроби навести порядок. А якщо найгірше, що можна сказати про тебе — це володіння найбільшою винокурнею у місті, попри заперечення дружини, — можливо, варто шукати мирне рішення.\nКрістофер Райт, можливо, достатньо розсудливий, щоб побачити, яку користь співпраця з [VLT.GetName] може принести його місту."
nf_vault_city.57.d_3:0 "Легко виправдати війну з бандою рейдерів, що тероризує поселенців. Значно важче виправдати напад на місто-державу з урядом, яким би корумпованим він не був. Державу з промисловістю, інфраструктурою, освітньою системою. Із цивільним населенням, що просто хоче жити в мирі.\n\nВлада Тіарет Ван Графф над Нью-Ріно була справжнім сюрпризом. Не через те, що вона могла це зробити — її вміння маніпулювати давно відомі, навіть у нашому ізольованому куточку цивілізації. Дивує лише те, що вона захотіла взяти під контроль саме Нью-Ріно, а не зосередитися на таких місцях як Реддінг чи Нью-Вегас."
nf_vault_city.57.a:0 "Час поставити крапку."
nf_vault_city.57.b:0 "Будьмо розсудливими"
nf_vault_city.57.c:0 "Нове керівництво"

nf_vault_city.58.t:0 "Мілітаризм Міста-Сховища"
nf_vault_city.58.d:0 "Попри всі розмови про утопію, лідер Міста-Сховища [VLT.GetLeader] показав, що він — такий самий деспот, як і всі інші. Тепер він готується до війни проти нашої вільної спільноти, аби нав’язати нам такий самий контроль, який панує в їхньому місті. Але якщо нас не поглинула навіть НКР, то які шанси в цієї забутої богом купки нердів?"
nf_vault_city.58.a:0 "Шкода лише пішакам..."

nf_vault_city.59.t:0 "Місто-Сховище Пропонує Об’єднання"
nf_vault_city.59.d:0 "Попри всі суперечності, Перший Громадянин Маєр і містер Райт хочуть одного — кращого майбутнього для Невади. Школи замість нетрів, лікарні замість борделів, безпека для наших дітей. Тож пропозиція приєднатися до Міста-Сховища звучить привабливо — уявіть, скільки добра ми могли б зробити разом. З іншого боку, місіс Райт нагадала, що передати владу «тирану з мріями про довоєнний фашизм» — це не найкращий спосіб допомогти Неваді. Складний вибір... Що ж робити? Піду візьму собі нука-колу, поміркую."
nf_vault_city.59.a:0 "Може й грубуватий, але я приймаю його дружбу!"
nf_vault_city.59.b:0 "Після того, що він зробив С’лантерам? Ніякий він нам не друг."
nf_vault_city.59.a_tt:0 "\n§RЦе завершить вашу гру. Також місіс Райт буде вами розчарована.§!"

nf_vault_city.60.t:0 "Дім — Це Невада"
nf_vault_city.60.d:0 "Усвідомивши, що Райти самі не зможуть очистити Неваду, містер Райт розумно погодився на союз з Містом-Сховищем. Разом ми збудуємо край, вільний від злочинності, гніту й мутантського непотребу."
nf_vault_city.60.a:0 "За прогрес!"

nf_vault_city.61.t:0 "Містер Невірний"
nf_vault_city.61.d:0 "Схоже, Райти не кращі за інших злочинців, які керують Нью-Ріно. Місто відкинуло нашу пропозицію про об’єднання, і попри всі розмови про моральність, містер Райт, схоже, на боці сутенерів, головорізів та повій, яких так поважає. Нам випадає обов’язок зробити Ріно придатним для життя людей."
nf_vault_city.61.a:0 "Я й так більше люблю синтегол."

nf_vault_city.62.t:0 "Не Починай Те, Що Не Зможеш Завершити"
nf_vault_city.62.d:0 "Пані Ван Графф, здається, що Маєр вважає наше маленьке місто загрозою безпеці та стабільності Пустки. Погані новини: він зірве наші плани щодо завоювання Каліфорнії. Хороші новини: ресурси, які ми отримаємо з Міста-Сховища після перемоги, посилять наші плани."
nf_vault_city.62.a:0 "Кажуть, у них там чудова силова броня."


nf_vault_city.63.t:0 "Свобода — це Основне Право Людини"
nf_vault_city.63.d:0 "Гільдія Работорговців була ганьбою Пустки. Соціопатичні монстри, які бачили в чоловіках, жінках і дітях лише товар для ринку. Монстри, які виривали дітей з обіймів матері, щоб відправити їх до тренувальних таборів Легіону, або знищували цілі племена задля виконання квоти. Мордіно з радістю взяли це на себе після втечі до міста, і на їхніх руках — кров сотень людей. Їхня доля вже вирішена. Залишається питання: що робити з чоловіками, жінками й дітьми, яких ми звільнили? Наша кампанія відкрила землі, які раніше були занадто небезпечними для ведення господарства — ми можемо використати їх як основу для нового суспільства. Але, можливо, краще просто дати їм свободу?"
nf_vault_city.63.a:0 "40 акрів і брамін!"
nf_vault_city.63.b:0 "Можливо, їм слід податися на контракт слуг?"

nf_vault_city.64.t:0 "Пропозиція, Від Якої Не Відмовляються"
nf_vault_city.64.d:0 "Шакали й Гадюки — це біда, що мучить ці землі поколіннями. І як не дивно, саме якуза можуть стати засобом для очищення цього гною. Якщо ми запропонуємо їм зброю, обладнання, пристойне фінансування та пообіцяємо не втручатися в їхні інші амбіції, можливо, вони погодяться зробити за нас брудну роботу, поки ми будемо зайняті поширенням цивілізації в Пустці."
nf_vault_city.64.a:0 "Убивство — це мистецтво."
nf_vault_city.64.a_tt:0 "Якщо якуза приймуть нашу угоду, вони оголосять війну §YГадюкам§!, а потім — §YШакалам§! в обмін на §G100§! тисяч доларів і 250 одиниць піхотного спорядження. Ви також підпишете з ними пакт про ненапад."
nf_vault_city.64.b:0 "Ні, дякую. Я не збираюся платити рейдерам, щоб ті билися з рейдерами."
vlt_has_something_against_ykz:0 "Не співпрацював з §YЯкузою§!"

nf_vault_city.65.t:0 "Пропозиція, Від Якої Ми Можемо Відмовитись"
nf_vault_city.65.d:0 "Керівництво [VLT.GetName] запропонувало найняти нас для своєї брудної справи, наче ми звичайні найманці.\nАле враховуючи щедру оплату й обіцянку не лізти до нас у найближчому майбутньому — можливо, це гарна можливість змінити фах. Якщо ми готові зіткнутись із двома добре вкоріненими бандами рейдерів, як-от Шакали й Гадюки."
nf_vault_city.65.a:0 "Звісно! Що може піти не так?"
nf_vault_city.65.a_tt:0 "§gВи матимете 30 днів на підготовку перед оголошенням війни §YШакалам§!. Після їх розгрому — ще 60 днів до війни з §YГадюками§!.§!"
vlt_has_paid_off_ykz:0 "Співпрацював з §YЯкузою§!"
vlt_modoc_decision_coop:0 "Співпрацював з §YМодоком§! та §YСлагами§!"
vlt_slags_are_humans:0 "§YСлаги§! — це люди"
vlt_slags_are_devo:0 "§YСлаги§! — це мутанти"
nf_vault_city.65.b:0 "Краще живий боягуз, ніж мертвий герой."
nf_vault_city.65.b_tt:0 "Це може §Rроздратувати§! [VLT.GetName]."

nf_vault_city.66.t:0 "Якуза Прийняла Нашу Пропозицію"
nf_vault_city.66.d:0 "Хоч це й обійдеться нам у пристойну суму готівки та спорядження, знищення рейдерів біля наших кордонів — величезний крок до умиротворення цієї частини залишків Південно-Західного Співдружжя."
nf_vault_city.66.a:0 "Гроші витрачені не дарма."

nf_vault_city.67.t:0 "Якуза Відхилила Нашу Пропозицію"
nf_vault_city.67.d:0 "Ми думали, що вони розумніші. Але виявилось, що вони такі ж неадекватні, як і Гадюки зі Шакалами. І чекає на них та сама доля."
nf_vault_city.67.a:0 "Перешкода, яку слід усунути."

nf_vault_city.68.t:0 "Час Настав"
nf_vault_city.68.d:0 "Ми виконаємо контракт з [VLT.GetName] і підемо війною на Шакалів.\nЗвісно, заради грошей... і трофеїв."
nf_vault_city.68.a:0 "До бою!"

nf_vault_city.69.t:0 "Коли Йде Дощ — Земля Твердіє"
nf_vault_city.69.d:0 "Ми подолали Шакалів, але щоб дотриматись умов контракту з [VLT.GetName], нам слід підготуватися до наступної битви — проти Гадюк. У нас є два місяці."
nf_vault_city.69.a:0 "Готуємось."

nf_vault_city.70.t:0 "Час Настав — Знову"
nf_vault_city.70.d:0 "Після перемоги над Шакалами ми готові зійтися і з Гадюками. Це розширить наші володіння й дозволить виконати умови контракту з [VLT.GetName]."
nf_vault_city.70.a:0 "Навіщо нам той Нью-Ріно?"

nf_vault_city.71.t:0 "Слаги: Загроза чи Союзники?"
nf_vault_city.71.d:0 "Де проходить межа між людиною й мутантом? Слаги явно були людьми колись, але ж і гулі, і супермутанти теж. І ми знаємо, чим усе скінчилось. Потрібно прийняти рішення."
nf_vault_city.71.a:0 "Слаги — це мутанти, очевидно!"
nf_vault_city.71.b:0 "Слаги — це люди, як і ми!"

nf_vault_city.72.t:0 "З Великою Силою..."
nf_vault_city.72.d:0 "На даний момент ми вже навряд чи просто місто. Східна кампанія принесла нам багато нових територій, які ми маємо контролювати й захищати — як від зовнішніх, так і внутрішніх загроз. З цими новими обов’язками нам, можливо, потрібна й нова назва, яка показуватиме, що ми більше не просто зборище халуп під стінами, а обіцяна утопія. Ми тут надовго. І на нас можна покластись."
nf_vault_city.72.a:0 "Захисник, так би мовити."

nf_vault_city.73.t:0 "Якість чи Кількість?"
nf_vault_city.73.d:0 "Хоча ми маємо технічну спроможність виробляти силову броню у пристойних масштабах, навряд чи зможемо запускати її у виробництво такими темпами, як потрібно. Питання також у тому, куди ми хочемо рухатися з нею в майбутньому. Поточний тип, який ми можемо виготовляти, не здатен конкурувати, скажімо, з Братством Сталі (не те щоб ми планували з ними воювати... мабуть). Деякі наші старші іммігранти-громадяни запропонували свої креслення — справжні плани й технічну документацію для виробництва якісніших типів броні. Чому вони їх узагалі мали — питання відкрите.\nІнша опція — спиратися на нашу спадщину Vault-Tec. У нас є специфікації на продукт-конкурент основної лінійки силової броні від West-Tek. Він... ну, будемо чесні, є причина, чому він не отримав державного контракту. Його характеристики не йдуть у порівняння навіть з T-45D. Але його перевага — простота й дешевизна виробництва."
nf_vault_city.73.a:0 "Обираємо дизайни West-Tek."
nf_vault_city.73.b:0 "Тільки Vault-Tec!"

#Ґордон

nf_vault_city.80.t:0 "Нерегулярні Частини НКР"
nf_vault_city.80.d:0 "Перетворити гарнізон НКР на силу, гідну їхньої емблеми — справа не з легких. Хоча більшість солдатів НКР, розміщених у Місті-Сховищі, мають непогану, а часом і блискучу бойову історію, їхня поведінка поза боєм залишає бажати кращого. Отримавши особисті справи через знайомого в армії НКР, Гордон особисто взявся навести лад.\nСписок інцидентів включав відмову виконувати накази, пияцтво на службі, побиття офіцера та контрабанду хімікатів, серед іншого. Жодних убивць чи ґвалтівників — нічого, що вимагало б трибуналу. Гарнізон був повний проблемних, але не злочинних вояк. Деякі — надто розумні для системи. Проте, трохи мотивації й командири, яким справді не байдуже, можуть усе виправити.\nЗалишається вирішити: варто акцентувати увагу на їхніх унікальних здібностях чи на стандартах НКР?"
nf_vault_city.80.a:0 "Сконцентруймося на їхніх талантах."
nf_vault_city.80.b:0 "Сконцентруймося на стандартах НКР."
nf_vault_city.80.a_tt:0 "Це прибере підрозділи гарнізону НКР та надасть вам §G2§! дивізії спецпризначенців НКР."
nf_vault_city.80.b_tt:0 "Це прибере підрозділи гарнізону НКР та надасть вам §G3§! піхотні дивізії НКР."

nf_vault_city.81.t:0 "Рішення, Засноване на Вірі"
nf_vault_city.81.d:0 "Потрібно було багато часу й роздумів, щоб дійти до цього моменту, але Гордон тепер у чомусь точно впевнений. Він — не та... людина, яка повинна очолювати Місто-Сховище. Є хтось, хто більше заслуговує на це. Хтось, хто давно планував використати дива Міста-Сховища, щоб зробити Пустку придатною для життя.\nХтось із його минулого в Ґеко.\nМоже знадобитись час, щоб переконати мешканців Міста-Сховища, що це правильний шлях."
nf_vault_city.81.a:0 "А тобі теж пахне «Чізі Пуфс»?"

nf_vault_city.82.t:0 "Жадібність Гордона"
nf_vault_city.82.d:0 "Хоча віра й допомогла йому пережити важкі часи, влада — то така залежність, що складно зупинитись. І він нарешті її здобув. Знову.\nЄ справи, які треба завершити. Зближення з НКР — лише перший крок. Бути частиною республіки — це можливість перекласти частину витрат на захист і базові потреби, які Місто-Сховище не змогло б покрити самотужки. Чим менше витрат на необхідне, тим більше лишається на життя, гідне людини. Майбутнє знову виглядає світлим — для нього, для мешканців Міста-Сховища і для Пустки."
nf_vault_city.82.a:0 "Жадібність — це добре!"

nf_vault_city.83.t:0 "Писк У Темряві"
nf_vault_city.83.d:0 "§o— «Що ти маєш на увазі — відступаєш? Ти ж навіть не відслужив повного терміну. Це нечувано!»§!\nПроконсул нервово походжав по офісі Першого Громадянина. Його невдоволення було очевидним, хоч він і не вживав слів, які б ця ситуація насправді заслуговувала. Його викликали пізно ввечері, бо Гордон хотів особисто поділитися новиною.\n§c— «Нечувано, як гуль-Перший Громадянин?»§!\nГордон, натомість, був спокійний — він, схоже, уже змирився зі своїм рішенням. На противагу проконсулу, єдине, що він зробив — поправив комір сорочки.\n§o— «Ну, я... я не знаю...»§!\nДля громадян Міста-Сховища це були бурхливі часи. І ще більше змін чекає на них попереду. У Гордона все ще є плани, навіть якщо він більше не буде лідером.\n§o— «Але ми не можемо провести ще один Вибір так швидко. Попередній ледь не паралізував усе місто!»§!\n§c— «Я думаю, нам не потрібен ще один Вибір. Я маю на думці когось, хто може зайняти моє місце. Громадяни Міста-Сховища вже показали, що готові до змін у правильному напрямку. І та... особа, яку я пропоную, здатна ці зміни втілити краще за мене».§!"
nf_vault_city.83.a:0 "§M...чому ти зробив паузу перед словом «особа»?§!"

nf_vault_city.84.t:0 "Мозок Операції"
nf_vault_city.84.d:0 "§o— «Що ти маєш на увазі, кажучи, що хочеш зробити щура Першим Громадянином?»§!\nПочнімо з початку, щоб пояснити цю фразу. Поки проконсул внутрішньо боровся зі спробами усвідомити рішення Гордона піти у відставку, сам Гордон підвівся з-за столу й відкрив двері свого офісу.\n§c— «Я хочу представити вам свого наставника з часів, коли я ще жив у Ґеко».§!\nПроконсул зупинив ходу, подивився на двері й спершу нікого не побачив... аж поки звук не змусив його глянути вниз. На порозі на задніх лапках сидів великий альбіносний крітокріс і махав лапою (рукою?) проконсулу.\n§R— «Вітання, шановний проконсул».§! Його голос був трохи писклявим і скрипучим, але дуже схожим на людський.\nДля більшості мешканців Пустки першим інстинктом при вигляді крітокріса буде схопитися за зброю — байдуже, чи вміє він говорити. Але через захищене виховання за стінами Міста-Сховища проконсул лише завмер у шоці. Це дало Гордону можливість представити новоприбулого.\n§c— «Це Мозок. Він допомагав мені та багатьом іншим гулям у Ґеко осягати духовні й етичні аспекти життя в Пустці. І він краще за мене зможе повести Місто-Сховище й Пустку до світлого майбутнього. Він буде Першим Громадянином замість мене».§!\nТут ми й повертаємось до початкового вигуку.\nПроконсул вказував на крітокріса, розмахуючи іншою рукою туди-сюди, немов підкреслюючи свою недовіру до ситуації.\nМозок глянув на Гордона, його ніс сіпнувся. §R— «Проконсул, здається, дуже шокований моїм виглядом. Ти ж обіцяв представити мене як слід?»§!\n§c— «Я ж представив, хіба ні?»§! — у голосі Гордона виразно чулося веселощі.\n§R— «Цей чоловік явно не був готовий до мого вигляду. Хотілося б, щоб ця зустріч відбулася без криків і вказувань пальцями».§!\nДо цього моменту проконсул, здається, трохи заспокоївся.\n§o— «Крітокріс».§!, — заявив проконсул.\n§R— «Так».§!\n§o— «Говорящий крітокріс».§!\n§R— «Саме так».§!\n§o— «Як?»§!\n§R— «Ти маєш на увазі — як я розмовляю, чи як планую стати Першим Громадянином?»§!\n§o— «...І те, і те?»§!\n§R— «Отже, дивись, у нас уже є цілий план. Якщо поглянути на ці документи...»§!"
nf_vault_city.84.a:0 "§MЦе буде довга ніч, еге ж?§!"
vlt_renewal_tree_tt:0 "Це змінить ваше дерево фокусів на §YКульт Оновлення§!"

nf_vault_city.85.t:0 "Місто-Сховище Приєднується до НКР"
nf_vault_city.85.d:0 "У несподіваному повороті подій Місто-Сховище вирішило приєднатися до нашої великої республіки. Хоча колись ми активно заохочували їх вступ, останніми роками ми просто насолоджувалися плодами тривалих дружніх відносин. Наші війська допомагали їм захищатися від рейдерів та інших загроз, а взамін ми користувалися їхніми знаннями та високотехнологічним виробництвом.\n\nДехто вже чув, що нещодавно у місті відбулись великі зміни, коли гуля Гордона з Ґеко було обрано Першим Громадянином шляхом народного голосування.\nВиявляється, він краще за свого попередника розуміє користь від приєднання до НКР.\nВітаємо наших нових братів і сестер з §oШтату-Сховища§!."
nf_vault_city.85.a:0 "І ми навіть пальцем не поворухнули."

nf_vault_city.86.t:0 "Місто-Сховище Передає Вітання"
nf_vault_city.86.d:0 "Щоби догодити стороні, що, як вони сподіваються, переможе у цій кривавій громадянській війні, нове керівництво Міста-Сховища направило нам кількох спеціалістів для допомоги у дослідженнях. Можливо, цього буде достатньо, щоб переломити ситуацію. У будь-якому випадку, ми вдячні за такий жест — можливо, згодом він переросте у щось більш значуще.\nВарто надіслати їм знак взаємної співпраці."
nf_vault_city.86.a:0 "Налагоджуємо дружбу в часи лиха."

nf_vault_city.99.t:0 "Пустий запис для усунення помилок"
nf_vault_city.99.desc:0 "Пустий запис для усунення помилок"

nf_vault_city.250.t:0 "Розрив у Реальності"
nf_vault_city.250.d:0 "Mr. Handy пройшов крізь портал.\nУсі пристрої, які мали приймати відео, звук і телеметрію від робота, залишались мовчазними. Протягом 24 годин науковці Міста-Сховища чергували біля станцій, змінюючись, не відходячи ні на мить.\nАле лінії залишались мертвими — Mr. Handy, найімовірніше, був втрачений.\nПісля ще двох днів навіть найтерплячіші й найоптимістичніші вчені втратили надію. Замість них на станціях залишили чергувати охоронців Міста-Сховища, аби ніхто не чіпав обладнання. Аж ось, уночі третього дня, один з приладів подав сигнал. Потім — ще один. Далі з кількох динаміків прорвався звук. Термінили почали приймати потік даних.\nЧерговий охоронець негайно зв'язався з усіма, кого міг дістати на аванпості. Через п’ятнадцять хвилин приміщення було забите до відмови збудженими, змученими, але натхненними вченими. Сам Мозок вийшов на зв'язок через відеозв’язок.\nІ тоді надійшов перший відеосигнал від Mr. Handy. Катодний проектор загудів електричним гулом.\nУсі гадали, що ж вони побачать.\nЧужі ландшафти?\nМожливо, щось поза межами розуміння?\n\n— «Та це ж §PСлокам Джо§?!»"
nf_vault_city.250.a:0 "Це було... трохи антикліматично."

nf_vault_city.251.t:0 "Інше Місце, Те Саме Slocum’s Joe"
nf_vault_city.251.d:0 "Так, це був справжній Slocum’s Joe. Конкретно — на Комерційній вулиці, між Французькою та В’язовою, у дрімотному довоєнному містечку Хіґґінс, Техас. Трохи західніше від кордону з Оклахомою. Точніше — руїни того кафе. І самого Хіґґінса також.\nКамера Mr. Handy показувала лише зруйновані будівлі й жодних ознак життя. Територію, очевидно, давно обчистили мародери, і вона була визнана непридатною для життя.\nТо чому ж психічна аномалія з Червоного Лісу Кісткодансерів відкрилась саме сюди? Це мало якусь причину. Щось тут приймало психічний «сигнал», якщо так можна його назвати. Один із сенсорів на Mr. Handy вловив щось поза межами звичайного спектру. Робота відправили в напрямку джерела сигналу, часто триангуляцією слабких показів. Аж поки не дістались Виправної Колонії Ватонги. Там датчики просто вибухнули від показів. Вони точно щось знайшли.\nІ тоді щось вдарило Mr. Handy по голові, вибивши сенсор. Камера показала істоту, яку один з учених назвав «зомбі». Це викликало обурення серед присутніх гулів, поки збентежений вчений не пояснив, що мав на увазі довоєнну концепцію «зомбі» з фільмів.\nПоки вчений та кілька гулів обговорювали старі фільми жахів, Mr. Handy був роздертий тими самими зомбі.\nАле координати місця були зафіксовані. Після кількох тестів із крітокрисами прохід в аномалію визнали безпечним для людей."
nf_vault_city.251.a:0 "От і пішли."

bone_dancers_anomaly_tt:0 "Просторову Аномалію Червоного Лісу відкрито"

nf_vault_city.252.t:0 "Оце Вже Щось!"
nf_vault_city.252.d:0 "Екзотична дика природа — куди не глянь (очима Mr. Handy), звуки тварин, яких ніхто з науковців ніколи не чув. Це, звісно, не літаючі острови чи циклопічні древні структури, але точно цікавіше за руїни довоєнної мережі пончиків.\nТа ми тут не заради пейзажів. Ми шукаємо джерело психічної енергії.\nДальше розвідування показало, що цей регіон розташований на західному узбережжі колишньої Мексиканської території. Прослуховування записів (точніше, їхній переклад) із розмов місцевих у сусідньому містечку дало нам натяк на причину появи аномалії. Лідер фракції, яку вони називають [ATE.GetName], схоже, володіє даром передбачення.\nЦе, можливо, й нешкідливо саме по собі, але ми не можемо ризикувати."
nf_vault_city.252.a:0 "Вирушаймо!"

nf_vault_city.253.t:0 "Пригоди Зомака"
nf_vault_city.253.d:0 "Мозок довго й наполегливо шукав Зомака, намагаючись з’ясувати, що сталося з його давнім товаришем. Він надсилав радіоповідомлення, платив караванникам та досвідченим мандрівникам за будь-яку інформацію чи за можливість впізнати гуля.\nІ одного дня — ось він. Просто стоїть біля воріт Міста-Сховища, наче точно знав, де зараз мешкає та працює Мозок.\nМозок був у захваті від повернення друга, хоч той і виглядав трохи інакше, ніж у спогадах. Очевидно, подорожі Пусткою залишили на ньому свій відбиток."
nf_vault_city.253.a:0 "У нього було третє око!"
nf_vault_city.253.b:0 "У нього була мутована рука!"

nf_vault_city.254.t:0 "Око Зомака"
nf_vault_city.254.d:0 "Просто посеред чола Зомака розміщене третє око — з незвичним трикутним зіницею фіолетового кольору, яке, схоже, ніколи не кліпає... принаймні ніхто ще цього не бачив.\nІсторія Зомака про те, як він його здобув, сповнена неймовірних подій. Порятунок доньки торговця, зірване засідкою, прокляття від шамана племені, епічна битва з викликаними духами й фінальна перемога над ними та шаманом у розпал радшторму, коли в небо вдарила зелена блискавка — наче самі боги розгнівались.\n§o«Загалом, цікавий вийшов вихідний»,§! — сказав Зомак.\n\nХоча око — не єдине, що він приніс із мандрів. Серед безлічі дивовиж було й один дуже цікавий документ."
nf_vault_city.254.a:0 "Магістерський диплом з економіки."
nf_vault_city.254.b:0 "Дивна книга в шкіряній палітурці."

nf_vault_city.255.t:0 "Ліва Рука Зомака"
nf_vault_city.255.d:0 "Описати руку Зомака коротко? Вона мутована. Але це зовсім не передає суть.\nЧасом здається, що м'язи на руці живуть окремим життям — ростуть, скорочуються, змінюють форму. Дехто з громадян стверджує, що бачив у нього клешню майрелурка, інші — що гігантську лапу. Іноді руки взагалі не видно, хоча Зомак каже, що все одно може нею щось торкатись — наприклад, «тримати» пляшку Рентген-Рому й випити її залпом.\n§o«Та, знаєте, як завжди»,§! — відповідає він на питання про те, як здобув таку кінцівку.\n§o«Зірвав ядерну бомбу на півночі, перш ніж її використали проти беззахисного села. Був трохи заблизько. Але гляньте на це — куди цікавіше!»§! — каже він, витягаючи предмет."
nf_vault_city.255.a:0 "Магістерський диплом з економіки."
nf_vault_city.255.b:0 "Дивна книга в шкіряній палітурці."

nf_vault_city.256.t:0 "Магістр (Економіки) Зомак"
nf_vault_city.256.d:0 "§o«Траплялось тобі коли-небудь натрапляти на химерну кам’яну арку посеред нічого? Ні? Ну от, а я — так. І вона засвітилась, показуючи, як мені здалося, сцени з довоєнних фільмів. Але це виявилась брама крізь час і простір. Так. І звісно, я пройшов крізь неї — а хто б не пройшов?\nОпинився я, як виглядаю зараз, у місті десь за 6 років до падіння бомб. Люди дивились на мене дико, але швидко звикли. Повірити не можеш, як швидко звикають до мутованих виродків.\nЯ трохи подумав над тим, чи не запобігти війні, але я бачив достатньо наукової фантастики, щоб розуміти — парадокси. Тож вирішив не морочити голову.\nЗамість цього я зробив те, що завжди хотів: отримав магістерський ступінь.\nНа щастя, університет прийняв мій бакалаврат, який я здобув ще до війни. Їм довелось трохи пояснити, що цей потворний тип — це той самий красень на ID. Але врешті-решт я захистив диплом. Назва роботи: \"Невідновлювані ресурси до та після ядерної війни\"».§!\n\nНікого не зацікавила сама робота. Усіх цікавила арка — той самий портал у часі. Та Зомак каже, що не пам’ятає, де вона була — після отримання ступеня він пішов у гігантський загул, який завершився тим, що він знову пройшов крізь арку, тинявся Пусткою (ніч, чи три), а прокинувся в борделі у Ріно."
nf_vault_city.256.a:0 "О, Зомак..."

nf_vault_city.257.t:0 "Зустріч Зомака з Культистами"
nf_vault_city.257.d:0 "§o«Культисти. Ненавиджу цих типів. Їхні химерні пісні, викликання щупалець із порталів. Брр...»§! — починає Зомак свою розповідь про те, як здобув книгу. Сама книга — важка, в шкіряній палітурці з довгим порізом по обкладинці, мов відкрита рана. Зомак каже, що сам обв'язав її ланцюгами, бо «інакше вона відкривається сама по собі».\n§o«Так ось, був я десь на північному сході колишніх США. І з якоїсь причини моя нова зовнішність змусила місцевих психів повірити, що я їхній 'обранець'. Я намагався пояснити їм, що це ім’я вже зайняте одним хлопцем на заході, але вони не слухали. Потягнули мене в якийсь храм, певно? Все з чорного каменю й дивного світла без джерела. Ну і вівтар, звісно. Який же храм без вівтаря?»§!\nЗмучений мандрівник, що слухав цю історію, схвально киває.\n§o«Виявилось, що обранець потрібен не для великого діла, а як посудина для їхнього бога. А я, знаєте, люблю контролювати своє тіло й розум. Тож довелось відбиватися. Культистські ножі — не найкраща зброя проти автомату. А потім вони викликали щупальця. Брр».§!\n§c«Ненавиджу таке. Щупальцева слизь — її ж із одягу фіг відітреш».§! — додає змучений чоловік.\n§o«Оцей хлопець мене розуміє. Дайте йому випити. За мій рахунок!»§!\nПодальші питання про те, що ж то за книга і чому він досі її тримає, потонули у реготі Зомака й незнайомця, які святкували зустріч черговими порціями алкоголю та ще більш химерними байками."
nf_vault_city.257.a:0 "Ох, Зомак..."



