ghouls_welcomed:0 "Гулів вітають"

ghouls_distrusted:0 "Рабство"

ghouls_fight:0 "Допоміжні гулі"

###Historic Focus - The Outside World

vault_remnants_advisors:0 "Прийняті Біженці"

marvels_of_vault_city:0 "Дива Міста-Сховища"
marvels_of_vault_city_desc:0 "Нам пощастило більше, ніж іншим — у нас є всі наукові досягнення та обладнання від Vault-Tec, які перетворили наше місто на оазу цивілізації посеред пустки."

vault_city_election:0 "Вибір 2275 Року"
vault_city_election_desc:0 "Із наближенням дати Вибору Першого Громадянина 2275 року, наполягання Маєра на народному голосуванні поставило під сумнів олігархічну раду Міста-Сховища. Ідея «демократизації» міста викликала напругу між урядом та громадянами. Хоча протести були відносно спокійними, ця напруга все одно стримує уряд від впевнених дій до моменту вибору."

vlt_gecko_powerplant:0 "Ґеко: Електростанція"
vlt_gecko_ghouls_plant:0 "Реактор №5 компанії Poseidon Oil вже давно став домом для ґулів. Вони погодились обмінювати надлишок електроенергії на припаси й захист."
vlt_gecko_output_tt:0 "§gРезультати та вигоди від Електростанції в Ґеко змінюватимуться залежно від виборів у фокусах, подіях і рішеннях.§!"

ncrsubjugation:0 "Гарнізон НКР"
ncrsubjugation_desc:0 "НКР «захищає» Місто-Сховище вже десятиліттями, відганяючи рейдерів в обмін на виплати до Шейді-Сендс. Але дехто у місті починає сумніватися, чи варте це того, адже боїться, що НКР дедалі тісніше затягує петлю навколо їхньої шиї."

vaultcityexpedition:0 "Гарнізон Міста-Сховища"
vaultcityexpedition_desc:0 "Протягом десятиліть наші чоловіки й жінки проливали кров заради безпеки Міста-Сховища. Але з багатствами Вегаса під боком все більше людей ставлять під сумнів саму мету існування міста. Інші вважають, що якщо ми підемо, то утвориться вакуум влади на півночі Невади, який хтось обов'язково використає."

vaultcityexpedition2:0 "Програма Обміну Офіцерами Міста-Сховища"

