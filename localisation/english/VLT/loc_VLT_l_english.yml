#### Events ####


nf_vault_city.1.t:0 "Сигнал «Усе чисто»"
nf_vault_city.1.d:0 "Наші записи не дають точної дати відкриття Сховища 8, але відомо, що це сталося в перші одне-два десятиліття після падіння бомб. Світ тоді був зовсім іншим.\nЯкими були наші перші кроки?"
nf_vault_city.1.a:0 "Відправити розвідників."
nf_vault_city.1.b:0 "Забезпечити периметр."
nf_vault_city.1.c:0 "Запустити ГЕКК."

nf_vault_city.2.t:0 "Безлад у Ґеко"
nf_vault_city.2.d:0 "На північному сході від нашого славетного міста знаходиться поселення ґулів, що забруднювали ґрунтові води смертельною радіацією. Ця отрута майже спричинила війну між нашою утопією та ґулями, але нащадок зі Сховища 13 зміг укласти мир між нами. Місто-Сховище забезпечувало Ґеко медичним приладдям в обмін на електроенергію. Наші стосунки були плідними, але останнім часом деякі мешканці ставлять під сумнів, чи не виграли ґулі від цієї угоди більше."
nf_vault_city.2.a:0 "Ми повинні зміцнити наші зв’язки."
nf_vault_city.2.b:0 "Можливо, час іти різними шляхами."
nf_vault_city.2.c:0 "Навіщо порушувати статус-кво?"

nf_vault_city.3.t:0 "Погляд на Зовнішній світ"
nf_vault_city.3.d:0 "Одне з наймудріших рішень Першої Громадянки Лінетт — знову звернути увагу на зовнішній світ. Вона вийшла заміж за сенатора НКР, мала справу з Обраним і вітала біженців, які потребували нового дому після того, як їхню базу біля узбережжя Каліфорнії «підірвали терористи», за їх словами. Ці біженці добре інтегрувалися в життя Міста-Сховища: вступали до Гвардії або працювали за фахом."
nf_vault_city.3.a:0 "Ну, краще вже тут, ніж у мотелі Мохаве."

nf_vault_city.4.t:0 "Ведмідь у нашому дворі"
nf_vault_city.4.d:0 "Коли Роджер Вестін прибув до Міста-Сховища, він прийшов не сам. Із ним прибув великий загін солдатів і інженерів НКР. Інженери швидко звели будівлі та стіни для розміщення гарнізону, а потім повернулися додому. Солдати ж залишилися — постійний гарнізон прямо за нашими мурами.\n\nУ ті часи зростаюча загроза рейдерів була більшою, ніж могла витримати наша Гвардія, і НКР прийшла на допомогу.\nОчевидно, наміри НКР були не цілком альтруїстичні. Вони хотіли ввести нас у свою державу — це був їхній перший крок.\n\nАле обіцяний великий наступ рейдерів так і не відбувся. Як і великий наступ НКР — з різних причин.\n\nТа гарнізон залишився. Солдатів регулярно змінювали, але з кожною ротацією їхнє спорядження ставало все гіршим. Застаріла зброя в жахливому стані, нестача найнеобхіднішого спорядження. З погіршенням спорядження погіршувався й моральний стан самих солдатів. П’яні бійки, які щоразу мусила зупиняти наша Гвардія. І все це тому, що деякі з них контрабандою завозили алкоголь, сигарети й навіть хіми через постачання з НКР.\n\nПопри те, що рейдери вже не така загроза, як раніше, наша оборона стала надто залежною від цих солдатів. А вигнати гарнізон зараз — не найкраща ідея, якщо ми не хочемо зіпсувати відносини з нашими «друзями» з НКР."
nf_vault_city.4.a:0 "Це проблема."


#   nf_vault_city.4.t:0 "The Bear in Our Den"
#   nf_vault_city.4.d:0 "First Citizen Lynette was able to work with Senator Westin of the NCR to put a hold on the NCR's northern expansion, but that only lasted for so long.  The Bishops brought New Reno into the NCR as an 'associated city', and they and Shady Sands continue to have eyes on our homes. Raider attacks, undoubtedly sponsored by the Bishops, have been on the upswing again. The brahmin barons of the NCR have charged higher and higher prices for their livstock. And with the demise of Broken Hills, we have been forced to search for new power supplies."
