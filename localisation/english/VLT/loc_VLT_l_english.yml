nf_vault_city.100.t:0 "Штурм Атомної Електростанції 13"
nf_vault_city.100.d:0 "Після ретельних обговорень ми вирішили, що більше не можемо ризикувати, дозволяючи гулям із Ґеко залишатись поряд. Вони, скоріш за все, вже здогадались, що давно приглушена ворожнеча з боку Міста-Сховища вийшла на поверхню. Треба діяти зараз, поки вони не встигли укріпитись і перетворити цю коротку операцію на затяжний конфлікт."
nf_vault_city.100.a:0 "Розпочати штурм"
nf_vault_city.100_wait_tt:0 "Ми чекатимемо, поки повернеться команда. До того часу — повне радіомовчання."
nf_vault_city.100_tt:0 "§gЦя §Yподія§! матиме різні наслідки залежно від ваших попередніх рішень щодо §Rгулів§!.§!"

nf_vault_city.101.t:0 "Просто Невелика Перешкода"
nf_vault_city.101.d:0 "Радіоприймач на базі зашипів. Голос командира групи прорізав ефір:\n«Місія завершена успішно. Електростанція очищена. Є трохи пошкоджених дверей і багато крові для прибирання. Команда в порядку, тільки дрібні подряпини й синці. Як наказано, половина залишилась охороняти станцію, решта — на зворотному шляху. Можете висилати інженерів і постійну охорону.\nВиконано»."
nf_vault_city.101.a:0 "До роботи!"
gecko_assault_good:0 "Просто невелика перешкода."

nf_vault_city.102.t:0 "Могло Бути Краще"
nf_vault_city.102.d:0 "Радіоприймач ожив. Голос командира групи пролунали в ефірі:\n«Місія... успішна, більш-менш. Були втрати. Ми зіткнулись із спротивом. І здається, ці гулівські покидьки щось зробили з електростанцією. Все знеструмилось, щойно ми увійшли, і ми досі не можемо зрозуміти, як увімкнути світло. Можливо, вони щось зіпсували. Це вже справа інженерів. Ми залишаємось тут до прибуття підкріплення. Можливо, десь ще ховаються гулі. Будьте обережні.\nВиконано»."
nf_vault_city.102.a:0 "Місія ще не завершена!"
gecko_assault_mediocre:0 "Могло бути краще."

nf_vault_city.103.t:0 "Це Важко Назвати Успіхом"
nf_vault_city.103.d:0 "Радіо зашипіло. У ефірі з’явився новий голос:\n«Говорить заступниця командира. Командир загинув. Ми відступили до околиць містечка біля станції, укріпились у двох будівлях. Втратили багато людей. Хоча й перебили чимало гуляй.\nВони... вони точно знали, що ми йдемо. Хтось їх попередив. Нам терміново потрібно підкріплення. Будь ласка. Не знаю, скільки ще протримаємось».\nКінець зв'язку."
nf_vault_city.103.a:0 "Цього ми й боялись..."
gecko_assault_bad:0 "Це важко назвати успіхом."

nf_vault_city.1031.t:0 "Результати Наших Зусиль"
nf_vault_city.1031.d:0 "Ми очікували пошкодження містечка Ґеко та самої станції, але спротив виявився набагато жорсткішим.\nВелика частина Ґеко була замінована й нашпигована саморобними вибухівками. Якби не Брейлінн Крістоферсон, заступниця командира, яка провела чималу розвідку перед тим як окопатися, втрати були б значно більшими.\nПопри все, ми здобули перемогу.\nБуде потрібно чимало часу, аби зробити об’єкт безпечним для роботи. Не можна ж, щоб інженери підривались на мінах, які ми пропустили.\nУ будь-якому разі, Громадянку Крістоферсон буде рекомендовано до підвищення за зразкову службу Місту-Сховищу."
nf_vault_city.1031.a:0 "Негайно викликайте саперів!"

nf_vault_city.104.t:0 "Порушення Мовчання"
nf_vault_city.104.d:0 "Радіо на базі несподівано ожило. Штурмова команда, що атакувала Ґеко, перервала мовчання — хоча мали зв’язатись лише в разі успіху місії.\nПершим, що почув оператор, була стрілянина. Ознака тривожна.\nПотім — панічний голос командира:\n«Все пішло шкереберть! Більшість мертві. Ми забарикадувались у реакторному відсіку. Здається, важливу частину конструкції пошкодили. Скрізь іскри, все... Боже... Боже! В СХОВИЩЕ! В СХО...!»"
nf_vault_city.104.a:0 "Ой..."
concluded_gecko_assault:0 "Ми завершили §YШтурм Ґеко§!"


