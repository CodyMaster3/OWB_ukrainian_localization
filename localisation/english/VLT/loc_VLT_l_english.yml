# good result stuff
vlt_clean_up_the_place:0 "Прибрати Територію"
vlt_clean_up_the_place_desc:0 "Потрібно полагодити поламані двері, залатати кулеві отвори... і прибрати дуже багато тіл гулів. Утім, зважаючи на те, що більшість будівель поза самою електростанцією були спонсоровані Містом-Сховищем, це місце можна заселити нашими громадянами. Принаймні після того, як вивітриться гулівський сморід."
vlt_more_uranium_is_more_good:0 "Повернімося до Основ"
vlt_more_uranium_is_more_good_desc:0 "Хоч уранова шахта в Броукен-Гіллсі вже давно вичерпалась, ще лишились інші місця, де можна дістати сировину. Але коштуватиме це чимало. Не всі такі спокійні щодо роботи з радіоактивними матеріалами, як... тьху... Супермутанти."
vlt_something_to_do_with_all_these_dead_ghouls:0 "Що Робити з Цими Мертвими Гулями"
vlt_something_to_do_with_all_these_dead_ghouls_desc:0 "Усі знають, що гулі мають слабке радіоактивне випромінювання. Зазвичай це лише трохи більше за природний фон. Але є винятки. Так звані \"Сяйливі\" — світяться не просто так. Як з’ясувалось, вони можуть слугувати дешевим розщеплюваним матеріалом у крайніх випадках. Не дуже ефективно, але працює. І, з огляду на недавні події, у нас є непоганий запас."
vlt_ultracite_is_literally_magic:0 "Та Магічна Речовина — Ультрацит"
vlt_ultracite_is_literally_magic_desc:0 "Ми досі не зовсім розуміємо, як і чому працює Ультрацит. Єдине, до чого дійшли наші вчені на основі зразків, привезених зі сходу, — це те, що технічно він повинен самовільно вибухати з часом. Але чомусь... ні? Ми поки що не ризикуємо пхати потенційні бомби в наші реактори. Краще не треба."
you_are_not_lynette_sucks_to_be_you:0 "§OМожливо, якби Лінетт керувала нацією, наші вчені розібрались би, як з цим працювати. Але, на жаль, це не так. Що ж — не можна мати все.§!"

