RHO_KYLE_THE_HOOK_NAME:0 "Кайл Гак"
RHO_KYLE_THE_HOOK_DESC:0 "Деякі люди народжуються лідерами. Вони мають харизму, щоб вести за собою інших, надихати словами й вчинками. Вони підіймаються над посередністю, захищаючи свою справу, і дають сенс життям своїх послідовників. Великі й пам’ятні речі трапляються, коли такі лідери беруться за справу – вони стають легендами. Кайл Гак – не з таких.\n\nКайл був тим хлопцем з рушницею. На жаль, Гак не мав жодного впливу на своїх колег, озброєний лише гострим списом і іржавим м’ясним гаком замість лівої руки, яким і намагався протистояти загрозам пустки. Як вже згадувалося, Кайл – далеко не найрозумніший рейдер, хоч сам вважає себе справжнім генієм. Він часто вигадує довгі, багатоскладові слова, які майже звучать правдоподібно, аби справити враження розумної й освіченої людини."

