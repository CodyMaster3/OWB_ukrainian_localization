l_english:
development_project_done_event.1.title:0 "Підтверджено витік радіоактивних матеріалів!"
development_project_done_event.1.desc_notech:0 "Наші команди стримування зробили все можливе, але без належних костюмів зі свинцевим покриттям вони не можуть наблизитися до зараженої зони без значного ризику. Фотографічні команди з дозиметрами на бейджах були направлені разом з підрозділами РХБ захисту, оскільки плівка темніє при впливі радіації, але такі методи виявлення дають результати через години або дні. У нас немає медикаментів для лікування променевої хвороби, тому ми можемо лише намагатися зменшити масштаб катастрофи до того, як вона зачепить цивільні райони."
development_project_done_event.1.desc_lowtech:0 "Підрозділи РХБ захисту були терміново розгорнуті по об'єкту, разом із командами стримування та виявлення, оснащеними портативними лічильниками Гейгера для пошуку джерел радіації. Хоча більшість роботи доведеться виконувати вручну, робота дезактиваційних груп та душових із фільтрованою водою дозволяє локалізувати пошкодження в межах реактора. Гумові костюми та антимікробна терапія зменшать довгострокові наслідки, а широке розповсюдження йодних пігулок серед населення допоможе уникнути ураження."
development_project_done_event.1.desc_adetech:0 "Наші детектори одразу зафіксували витік, і чергові команди стримування швидко впоралися із ситуацією, майже не піддавшись впливу завдяки укріпленим захисним костюмам. Будівельні групи вже прямують із легким обладнанням, щоб усунути будь-які тріщини, а медичні табори розгорнуто навколо периметру. Загалом, операція пройшла ефективно, і слава Богу, що ми мали ресурси для цього."
development_project_done_event.1.desc_hightech:0 "Наші техніки проникли до контрольної кімнати споруди й змогли живити старі довоєнні комп’ютери за допомогою портативних ядерних батарей, одразу запустивши протоколи стримування. Команди в силовій броні з максимальним радіозахистом прямують до місця разом із транспортними ботами, що несуть обладнання для герметизації витоків. Очікується мінімальна затримка в роботі об'єкта."
development_project_done_event.1.a:0 "Перекрити всі канали інформації, зупинити поширення чуток. Населення дізнається, що це була ворожа диверсія."
development_project_done_event.1.b:0 "Зосередити всі сили на захисті цивільних. Ми не можемо дозволити ядерну катастрофу."
development_project_done_event.1.c:0 "Подякувати команді стримування. А тепер – запускайте реактор."
development_project_done_event.1.d:0 "Вражає. Офіцери РХБ захисту будуть задоволені злагодженістю своїх солдатів."

development_project_done_event.2.title:0 "Зафіксовано енергетичний стрибок!"
development_project_done_event.2.desc_notech:0 "Без знань у сфері довоєнної електроніки ми могли лише оголосити евакуацію й безпорадно спостерігати, як кілька енергоблоків перегоріли та зруйнували значну частину об'єкта. На щастя, стрибок було зупинено через зниження енергогенерації, але шансів відновити такі рідкісні технології у нас більше нема."
development_project_done_event.2.desc_adetech:0 "Оскільки саперні групи вже працювали над відновленням та обслуговуванням запобіжників, стрибок було локалізовано в окремій частині об'єкта. Інженери очікують незначні втрати потужності, хоча заміна пошкоджених компонентів потребує часу. Персонал неабияк злякався, але загалом усе під контролем."
development_project_done_event.2.desc_hightech:0 "Інженери заздалегідь виявили декілька резервних систем захисту, які успішно зупинили стрибок без шкоди для обладнання. Зараз заміна запобіжників вже триває, і ми очікуємо лише кілька годин простою."
development_project_done_event.2.a:0 "Операція провалена, зберіть, що можна, і перенаправте ресурси."
development_project_done_event.2.b:0 "Відмінна робота наших інженерів. Час повернути цю машину в стрій."
development_project_done_event.2.c:0 "Поверніть це барахло в експлуатацію. Нехай забезпечує надлишок для Пустки."

development_project_done_event.3.title:0 "Оборонні системи активовані!"
development_project_done_event.3.desc_notech:0 "Наші передові загони, на жаль, активували автоматичні турелі бази, не маючи при собі достатньо протитанкового озброєння для боротьби з ними. Довелося викликати підкріплення і штурмувати турелі з ручними вибухівками під прикриттям вогню. Як і очікувалося, ми зазнали серйозних втрат – понад 70% бойової сили втрачено. Найближчим часом ці сили не будуть боєздатними."
development_project_done_event.3.desc_lowtech:0 "Під час обстеження база активувала систему автоматичної оборони, але завдяки наявності кількох протитанкових загонів наш розвідвзвод зміг швидко ліквідувати загрозу. Було зафіксовано мінімальні втрати, переважно через ефект несподіванки."
development_project_done_event.3.desc_adetech:0 "Під час першої зачистки бази було активовано оборонні системи, але завдяки знанню довоєнної інфраструктури та передбачливому офіцеру, який наказав перевести ПТ-загін у повну бойову готовність, ми уникнули жертв – лише кілька поранених. Ракетні установки швидко впоралися з турелями, операція триває з мінімальними затримками."
development_project_done_event.3.desc_hightech:0 "Ми розгорнули перешкоджаючі поля навколо бази, і оборонні системи навіть не встигли ввімкнутися – їх програмне забезпечення було миттєво виведене з ладу. Наші солдати мали вдосталь часу закласти вибухівку й знищити вже непрацездатні турелі. Наші сканери також виявили додаткові підсекти бази, недоступні для особового складу. Є підозра, що вони містять секретне обладнання."
development_project_done_event.3.a:0 "Евакуювати поранених, молімося за загиблих. Це має бути того варте."
development_project_done_event.3.b:0 "Передайте привітання ПТ-командам і продовжуйте операцію."
development_project_done_event.3.c:0 "Цей офіцер заслуговує на підвищення. Принесіть ще спорядження та продовжуйте зачистку."
development_project_done_event.3.d:0 "Чудова робота. По приїзді – перший келих за наш рахунок."

development_project_done_event.4.title:0 "Оборонні системи активовані!"
development_project_done_event.4.desc_notech:0 "Наші передові загони, на жаль, активували автоматичні турелі бази, не маючи при собі достатньо протитанкового озброєння для боротьби з ними. Довелося викликати підкріплення і штурмувати турелі з ручними вибухівками під прикриттям вогню. Як і очікувалося, ми зазнали серйозних втрат – понад 70% бойової сили втрачено. Найближчим часом ці сили не будуть боєздатними."
development_project_done_event.4.desc_lowtech:0 "Під час обстеження база активувала систему автоматичної оборони, але завдяки наявності кількох протитанкових загонів наш розвідвзвод зміг швидко ліквідувати загрозу. Було зафіксовано мінімальні втрати, переважно через ефект несподіванки."
development_project_done_event.3.desc_adetech:0 "Під час першої зачистки бази було активовано оборонні системи, але завдяки знанню довоєнної інфраструктури та передбачливому офіцеру, який наказав перевести ПТ-загін у повну бойову готовність, ми уникнули жертв – лише кілька поранених. Ракетні установки швидко впоралися з турелями, операція триває з мінімальними затримками."
development_project_done_event.4.desc_adetech:0 "Під час першої зачистки бази було активовано оборонні системи, але завдяки знанню довоєнної інфраструктури та передбачливому офіцеру, який наказав перевести ПТ-загін у повну бойову готовність, ми уникнули жертв – лише кілька поранених. Ракетні установки швидко впоралися з турелями, операція триває з мінімальними затримками."
development_project_done_event.4.desc_hightech:0 "Ми розгорнули перешкоджаючі поля навколо бази, і оборонні системи навіть не встигли ввімкнутися – їх програмне забезпечення було миттєво виведене з ладу. Наші солдати мали вдосталь часу закласти вибухівку й знищити вже непрацездатні турелі. Наші сканери також виявили додаткові підсекти бази, недоступні для особового складу. Є підозра, що вони містять секретне обладнання."
development_project_done_event.4.a:0 "Евакуювати поранених, молімося за загиблих. Це має бути того варте."
development_project_done_event.4.b:0 "Передайте привітання ПТ-командам і продовжуйте операцію."
development_project_done_event.4.c:0 "Цей офіцер заслуговує на підвищення. Принесіть ще спорядження та продовжуйте зачистку."
development_project_done_event.4.d:0 "Чудова робота. По приїзді – перший келих за наш рахунок."

