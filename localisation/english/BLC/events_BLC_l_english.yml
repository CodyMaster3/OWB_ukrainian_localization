nf_pnt.1.title:0 "Візія Вардеда"
nf_pnt.1.desc:0 "Життя Вардеда до Тіббетса — таємниця. Це був час до того, як його знайшло чорнило, час, коли він ще не побачив Славної Цілі, до своїх Видінь, до того, як він отримав мету.\nАле всередині Комплексу Тіббетс усе змінилось; випробування сили, сприйняття, витривалості, харизми, інтелекту, спритності і навіть удачі — всі вони обрушились на нього, і все ж він вистояв. Після кожного пережитого випробування чорнило займало більше його тіла, і ті випробування зробили його більше ніж людиною. Він був обраний Богом Чорнила, Арленом, стати Його Чемпіоном.\n\nПісля того, як Тіббетс відкрився через сторонні сили, він покинув те прокляте місце й знайшов свій народ — Розписаних. Він навчив їх мистецтву війни, застерігав від породжень ночі, і щойно з’явилась можливість — став їхнім Кенде, їхнім «Верховним шаманом».\n\nТепер, після багатьох випробувань у Чорному Каньйоні, Розписані знову можуть діяти самостійно і об’єднати розрізнені племена, як і обіцяв Вардед. Війна гряде, і він став їхнім Військовим шаманом — Гюлою."
nf_pnt.1.a:0 "Він приведе нас до слави!"

#
nf_pnt.2.title:0 "Звук війни"
nf_pnt.2.desc:0 "Коли Вардед уперше зійшов на Розписаний Трон і почав формувати долю Розписаних за власною Візією, плем’я вже було розпорошене. Вони розкололись задовго до того, як Скрапери з Денвера вторглися сюди, і коли ті прийшли — залишки нації розпались остаточно. Північні племена — Маленькі Змії, Річкові Лисиці та Одинока Скеля — ще тримались купи, але інші давно відійшли від давніх шляхів.\n\nТепер, коли влада Караванного Конгресу зникла, ми можемо повернути давні землі, захоплені загарбниками. Кампанія буде виснажливою і важкою, адже різноманітні загарбники наших священних земель чинитимуть опір, щойно ми прийдемо до їхніх домівок."
nf_pnt.2.a:0 "Загостріть списи, складіть їх вгорі!"

#
nf_pnt.3.title:0 "Проведені вищою силою"
nf_pnt.3.desc:0 "Розписані глибоко вірять у силу татуювань; чорнило, що вкриває тіло, — це спомин про пройдене випробування, засіб закликати силу природи. Символ Вітру, нанесений на ноги, свідчить, що власник був прудкий, і тепер вітер буде нести його й надалі.\n\nЇхню віру було кинуто виклик, коли місіонери з Нью-Ханаану прибули і почали поширювати Слово Христове. Спочатку в них майже стріляли на місці, але з часом навчилися терпіти одне одного. Їхнє навернення відбувається повільно і ще не становить загрози авторитету Вардеда. Якщо мормони занадто заглибляться — він просто оголосить себе втіленням Ісуса. Канааніти, хоч і дратують Вардеда і шкодять його образу сильного вождя, усе ж приносять деякі покращення. А отже, варто потерпіти... принаймні тимчасово."
nf_pnt.3.a:0 "До Ефесян 32:"
nf_pnt.3.a_tt:0 "§gБудьте добрі один до одного, співчутливі, прощайте один одного, як і Бог у Христі простив вас.§!"
#
### The Yampan Community Coalition
#
nf_ymp.1.title:0 "Ведмідь Ямпи"
nf_ymp.1.desc:0 "Громади Ямпи завжди були чимось на кшталт демократичного союзу. Узбережжя не могло вижити без міст у глибині, і навпаки, тож їхня співпраця завжди базувалась на необхідності. Міста рівні, і кожне має рівно один голос; і майже завжди лідерство отримували впливові родини. За останні два десятиліття Лордом-Мером був або Вудс, або Ріверс.\n\nБерхард перейняв посаду безпосередньо від свого батька, Коді Ріверса, і з того часу Громади почали швидко розвиватись. Він ефективно використовував союз із Чорним Каньйоном, щоб просувати ці зміни.\n\nХоча Чорний Каньйон і впав, Громади сильніші, ніж будь-коли. Ямпанці й надалі будуть слідувати за своїм Лордом-Мером, без тіні сумніву, навіть попри те, що він стає дедалі більш автократичним і, здається, одержимим річкою Платт..."
nf_ymp.1.a:0 "Він — наша єдина надія."

#
nf_ymp.2.title:0 "Торгівля має тривати"
nf_ymp.2.desc:0 "Найбільша сила Ямпанців — це їхні торговельні можливості. Їхні судна прямують у далекі краї, а Платт впадає в більші річки, що дозволяє торгувати навіть із містами Річкової Ліги. Коаліція — лише незначний гравець у ширших операціях Ліги, втім. Насправді, існує одна значна проблема, яка стримує наші можливості — місто Каспер і жадібний Барон на півночі. Ми не можемо реально змагатися з верфями на іншому березі, але це не означає, що ми не можемо забрати це місто собі.\n\nЦе, серед іншого, головна причина того, чому Берхард очолював організацію торгівлі та економіки у Федерації Чорного Каньйону, але оскільки вона канула в Лету, ми знову можемо зосередитись на собі. Зміщення фокусу з караванних маршрутів на Платт, без сумніву, зробить нашу торгівлю плавнішою та ефективнішою. Навіть якщо це означає, що доведеться усунути конкурентів..."
nf_ymp.2.a:0 "Річка тримає нас при житті не одним способом."

#
nf_ymp.3.title:0 "Просто за поворотом"
nf_ymp.3.desc:0 "Щойно Чорний Каньйон упав, народ по обидва боки почав мобілізуватись. У ці буремні часи ми не можемо сидіти склавши руки. У містах Коаліції підготовка до війни стала звичним явищем, але досі не було жодного вияву патріотизму з боку вищих кіл, який міг би підняти бойовий дух. Ріверс оголосили, що переобладнають свої рибальські підприємства та виробництво вудок на воєнні верфі та збройну майстерню відповідно. Їхню жертву обов’язково помітить народ!"
nf_ymp.3.a:0 "Найбільше в річках я люблю те, що..."

#
### The Tibbets' Raiders
#
nf_bcr.1.title:0 "Молотови Пустки"
nf_bcr.1.desc:0 "Історія пенітенціарної установи Тіббетс — довга та багата, але пропустімо нудні речі та зосередимось на старому МакБрайді, Молоті Пустки.\n\nДо Великої Війни вона охоронялась 705-м батальйоном військової поліції, разом із Системою Керування і Стримування В’язнів. Зелені з золотом прапори висіли по всьому комплексу. Маллет узяв їх собі й зробив символом терору, перетворивши знак захисту на емблему жаху. Класика.\n\nКоли ворота Блек-Топу нарешті відкрились, і люди ринули назовні, Маллет почав збирати тих, хто залишився. Набіги на навколишню місцевість почались майже одразу — здебільшого на трибалів та простих людей без організованої оборони. Легка здобич, тонкий зиск. Єдиним винятком було Бот-Тавн — містечко поряд із тюрмою.\n\nПрихід Каравану зупинив це, та їхня присутність виявилась досить вигідною для нас: вони розвинули Тіббетс та його спільноту, зробивши її своєю штаб-квартирою. Їхній «Компроміс», за яким ми відповідали за більшість військових справ, дав нам досвід справжнього командування, а не просто пограбувань. Тепер, коли їх більше немає, ми можемо повернутись до добрих старих набігів і нагадати всім, хто такий Молот Пустки. Лихо для всіх слабаків, але той, з ким можна домовитись. Найми його, аби він пограбував твого сусіда замість тебе!"
nf_bcr.1.a:0 "У них немає шансів проти нього!"

#
nf_bcr.2.title:0 "Грубе життя"
nf_bcr.2.desc:0 "Спершу не всі хотіли йти за МакБрайдом. Були й інші претенденти на лідерство над зграєю з Тіббетса, тож було знайдено просте рішення. Велика Бійка — найграндіозніше побоїще у Пустці — була організована в самому Тіббетсі. 97 рейдерів змагались у рукопашній боротьбі за славу, і тільки троє лишились стояти на ногах: Маллет, Раян Мітчел і Іван. Маллет стояв, вкритий синцями й плямами крові, але сповнений рішучості надалі лупцювати всіх під куполом. Його очі горіли скаженим вогнем — як у берсерка, готового померти задля перемоги. Інші двоє одразу присягнули на вірність, і МакБрайд здобув собі праву і ліву руку.\n\n«Компроміс» — хай і принизливий, бо нас наказували — був корисним, бо тримав нас у рамках. А ще він зробив наших зелених дещо досвідченішими. Після успішної Бійки новий компроміс був укладений: вони будуть грабувати як професію, а він, як роботодавець, платитиме здобиччю і наркотою. Чудовий компроміс для всіх."
nf_bcr.2.a:0 "Справді чудовий «компроміс»."

#
nf_bcr.3.title:0 "Рок у тюрмі"
nf_bcr.3.desc:0 "Знаєш, хоч рейдер і є загрозою для сучасного суспільства, їхні базові потреби не такі вже й огидні. По-перше, вони просто шукають адреналін, бо залежні від гострих відчуттів. По-друге, вони жадають свободи — життя без законів або з мінімальним контролем. Вони краще оберуть самотність у брудній ямі, ніж підкорення волі інших. І по-третє — розваги. Їм подавай випивку, тютюн і всі можливі наркотики, які ми здатні зварити. Якщо вони не загроза один для одного — чому, власне, хтось повинен забороняти їм веселитись? Ми задовольнимо наших воїнів, і натомість вони працюватимуть краще. Такий шлях Рейдера."
nf_bcr.3.a:0 "Начальник влаштував вечірку в тюремному окрузі..."

#
nf_bcr.4.title:0 "Ще одне обличчя на горі"
nf_bcr.4.desc:0 "Усе почалось із хаосу — рейдери тягнули ящики з динамітом, раби метушились із зубилами, а МакБрайд горлав команди знизу. Кожен вибух трусив землю, посилаючи каміння і пил униз схилом гори. За ними йшли зубила, вирізаючи грубі обриси в уламках. Цілі секції старих облич тріскалися і відвалювалися, їхні риси назавжди спотворені амбіціями МакБрайда. Рейдери реготали, раби задихались, і поступово нове обличчя постало. Воно не було витонченим, не було чистим, але було безпомилковим — Маллет МакБрайд, вічно вишкірившись до пустки з вершини. Яку б силу не мали ті старі обличчя — тепер вона належить йому."
nf_bcr.4.a:0 "Клята розкіш."
nf_bcr.4.b:0 "Цілковито огидно."
nf_bcr.4.c:0 "Та й байдуже."

#
nf_bcr.8.title:0 "Корона Брендона V, Божевільного Короля"
nf_bcr.8.desc:0 "У руїнах Рапід-Сіті, під уламками та іржею, наші рейдери знайшли дещо незвичайне — корону. Викувана зі сплавленої силової броні, вона мала гострі краї, а колись м’які фльорони перетворились на викривлені шипи з іржавої сталі.\nНа внутрішньому кільці викарбувано напис:\n\n\"Його Найсуворіша Величність, Брендон П’ятий Іменем Своїм, Володар і Король Царства Манітоба.\n\nОсь я — владика зір далеких,\nДе інтерлоперів слідів нема й легких,\nЇх срібне сяйво в безмежній тьмі —\nБез тіней, що повзуть в пітьмі.\n\nВолодар глибин, де страхи снують,\nДе безіменні жахи живуть.\nЖоден з морів не візьме вінця,\nАні скіпетр мій, ані серця.\n\nВолодар Сонця, що сяє й співа\nМоє ім’я з країв до дива.\nВолодар Місяця — блідого, німого,\nЩо зберігає таємниці й нічого.\n\nВолодар Усього, за древнім правом,\nМоя воля — світло, а слово — канон.\nВолодар Ніщо, де примари живуть —\nБо ніщо не є, і справжнє — спить.\n\nНехай мій рід не згасне ніколи,\nНехай царство моє стоятиме довго.\nХай вороги мої, у жаху й темряві,\nПід моїм прокляттям схиляться назавше.\""
nf_bcr.8.a:0 "Корона, гідна Короля..."
