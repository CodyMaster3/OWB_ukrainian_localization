l_english:
### ПОДІЇ
nf_black_canyon.0.title:0 "Налагодження Впливу Каравану"
nf_black_canyon.0.desc:0 "Можливо, ви дивуєтесь, навіщо я локалізував подію, яку ніколи не побачать гравці. І якщо мені пощастить, навіть я. Ну, питання справедливе, а відповідь —"
nf_black_canyon.0.a:0 "От халепа, знову починається."
nf_black_canyon.0.b:0 "До безмежжя і далі!"

nf_black_canyon.1.title:0 "Під Великим Куполом"
nf_black_canyon.1.desc:0 "Федеральна В’язниця США Тіббетс, відома як “Великий Купол” через свою ротонду, слугувала тюрмою для найнебезпечніших злочинців Америки до війни. Вона була автоматизована, керована ШІ та роботами, що продовжували наповнювати камери навіть після падіння бомб.\n\nЗгодом у в’язницю потрапило багато нових в’язнів. І тоді група загадкових нападників пробилася до Купола. Ніхто не знав, чого вони хочуть, і, можливо, якби знали — залишилися б всередині. Але завдяки ним ув’язнені втекли — всі обрали свободу.\n\nПерші злочинці, ті що потрапили до війни, залишилися разом, почавши нападати на сусідні поселення під проводом Маллета МакБрайда, родом з Мохаве. Місто Бот боролося з ними, аж поки не змирилось і не почало платити їм данину.\n\nЧерез загрозу Битих Псів було підписано Компроміс Тіббетса з Караваном Баттері. Вони пообіцяли битися з ворогами й не шкодити новим людям, але жили переважно поза законом.\nЯк вони відреагували на це...?"
nf_black_canyon.1.a:0 "Маллет на диво знав своє місце."
nf_black_canyon.1.b:0 "Вони постійно перевіряли наші межі."

nf_black_canyon.2.title:0 "Всі Розмальовані Люди"
nf_black_canyon.2.desc:0 "На недоторканих землях Північного Колорадо з попелу Великої Війни виникло плем’я, що єднало себе чорнилом і кров’ю. Колись це була велика нація, та розпалася на менші племена. Розмальовані Люди — найбільший уламок тієї нації. Залізні Лінії та Кіфери — лише далекі родичі, а уламники з Денвера зайняли пусті землі між ними.\n\nВони вірять у магію татуювань, які дарують удачу та силу. Їхній ватажок — Шаман на ім’я Позначений, колишній в’язень Тіббетса, вкритий незнаними чорнилами. Його риторика закликає до війни з усіма, хто не носить Чорнило.\n\nКоли Караван запропонував союз проти більшої загрози, вони були раді. Але коли мова зайшла про деталі, Позначений почав непокоїтись за вплив на свій народ — світськість і дослідження загрожували змінити їх. Та повернення колишніх земель у Скелястих Горах задовольнило його."
nf_black_canyon.2.a:0 "Він побачив у цьому можливість."
nf_black_canyon.2.b:0 "Але образа лишилась у його серці."

nf_black_canyon.3.title:0 "Коаліція"
nf_black_canyon.3.desc:0 "На берегах притоки Платт мешкає група поселень, здебільшого з колишніх рабів із Міста Псів та рейдерів Тіббетса. Вільні та горді люди, вони розвинули культуру володіння зброєю та міліційної організації. Вони жили мирно, розширюючись, поки втікали з лап Маллета і Собакарів, але їхнє існування було табу для Розмальованих Людей — це була їхня священна земля. Маллет МакБрайд ненавидів ідею вільних рабів поряд із собою.\n\nВони потребували провідника. У містечку Медисин жила родина, що завжди приймала рабів. Це були Ріверси. Було відомо, що один з них стане ватажком, але хто саме?\n\nНеочікувано, це був Берхард. Грозний, мовчазний, майстер стрільби, він завоював довіру простим мовчанням і діями. Після обрання створив річковий флот і розвинув торгівлю. Саме він вирішив приєднатися до Конфедерації Чорного Каньйону Баттері. Для нього вона була логічним продовженням їхньої справи. Та Баттері тримав його на оці — в того були власні амбіції."
nf_black_canyon.3.a:0 "Тримай друзів поруч..."
nf_black_canyon.3.b:0 "А ворогів ще ближче."

nf_black_canyon.4.title:0 "Маленькі Світлячки"
nf_black_canyon.4.desc:0 "У Чорному Каньйоні живе багато різних народів. Всі вони стали частиною нашої держави після її утворення — за винятком одних.\n\nСвітлячки — як самі себе називають — це група світних гуль, що мешкає в руїнах Боулдера. Місто — дім Купола, довоєнного наукового центру з купою таємниць... і брухту. Биті Пси давно поглядають на нього жадібно. Ми сформувалися, щоб зупинити такі зазіхання, і ніколи не дамо скривдити слабких. Світлячки не стали частиною конфедерації напряму, але залишаються союзниками. Братнім народом, так би мовити.\n\nПрацювати з ними непросто, але перша зустріч справила враження. Хто ж нас тоді зустрів?"
nf_black_canyon.4.a:0 "Патчес — веселий, вічно зайнятий збирач."
nf_black_canyon.4.b:0 "Стічес — мовчазний, але непримиренний лідер міліції."
nf_black_canyon.4.c:0 "Вони обидва показали, на що здатні."
#
nf_black_canyon.5.title:0 "Де б я був без Каравану?"
nf_black_canyon.5.desc:0 "Караван 13, мандрівне поселення, що багато разів перетинало Колорадо, здобув славу завдяки своїй першій лідерці. Відомій лише як “В’язень 13” — саме такий номер був на її комбінезоні з Тіббетса — вона стала ходячим чудом по обидва боки річки Колорадо. Вона відвідала Місто Псів до приходу Битих Псів, допомагала Ношурам у їхній Першій експедиції, і навіть особисто зустрічалась із богинею Діаною. Але для нас найважливіше — вона потрапила в Єрихон і вивела звідти найбільший скарб міста: Баттері.\n\nБаттері багато чого навчився у В’язня. Її альтруїзм не лише врятував його з пекельної водної станції, а й показав, що добрі вчинки змінюють світ. Після багатьох спільних мандрівок настав момент, коли В’язень покинула Баттері та створену ними спільноту. Вона сказала, що вирушає в свою §R"найбільшу подорож"§!.\nПісля слізного прощання Баттері повів караван назад до Тіббетса. І їхній прихід припав якраз вчасно. Регіону загрожували розширюючісь Биті Пси. Народи Скелястих Гір не могли об'єднатися без дипломатичної допомоги Каравану — але їм вдалося змусити Місто Псів відступити. Вони здійснили диво, але місцеві ще не знали, чи можна довіряти Каравану..."
nf_black_canyon.5.a:0 "Вони швидко стали частиною родини."
nf_black_canyon.5.b:0 "Схилялися трохи надто сильно, та роботу зробили."

#
nf_black_canyon.6.title:0 "Привиди з-під Землі"
nf_black_canyon.6.desc:0 "Найважливішою дипломатичною рисою Баттері була його відкритість — він міг знайти спільну мову з усіма. Як він сам казав, він був одночасно і трибалом, і рейдером, і поселенцем. Єдиним винятком були мешканці Сховища 27.\n\nЛюди, що вижили після Великої Війни у підземному укритті, жили за довоєнними технологіями та ідеологіями — зовсім не схожі на нас. Хоча вони ізоляціоністи, існують дві групи, що контактують із зовнішнім світом: ті, хто добровільно покинув Сховище й оселився у Курорті Гарячі Джерела, та найманці з Привидів.\n\nАутсайдери відкрито ненавидять Жителів Униз, розповідаючи жахіття про перенаселення та суворий контроль. Усі, хто обрав свободу, мали залишити сховище. Номінально вони живуть у нашій державі, але патрулі Привидів тримають їх у покорі.\n\nПривиди — це безжальні найманці в силовій броні, що беруть будь-яку роботу заради грошей та утримання Сховища.\n\nСховище становило загрозу, тож ми вжили заходів..."
nf_black_canyon.6.a:0 "Запросити аутсайдерів оселитися в наших землях."
nf_black_canyon.6.b:0 "Напасти на патрулі та забрати їхнє спорядження."

#
nf_black_canyon.8.title:0 "Велике Зібрання [GetYear]"
nf_black_canyon.8.desc:0 "Новий рік — нове Велике Зібрання. Нудніше бути не могло: люди з усіх куточків Федерації з’їхались разом. У примітивному вбранні, вкриті татуюваннями, прийшли трибали Розмальованих Людей, граючи ритмічну, гіпнотичну музику на барабанах. Люди з Ямпанської спільноти — рибалки та лісоруби — співали старовинних пісень у своєму одноманітному одязі. А рейдери з Тіббетса були найгірші — в латаних шкірах і іржавій броні, з гучною, дика музикою.\n\nІ все ж вони — наш народ. Те, що всі ці різні люди можуть зібратися, вести переговори й святкувати разом — це найбільше досягнення нашої спільноти.\n\nЦьогорічне зібрання пройшло як завжди: кожен лобіював свої інтереси. Але цього разу Караван і Баттері вирішили підтримати найпереконливіший бік."
nf_black_canyon.8.a:0 "Ямпанці мали дуже переконливі аргументи."
nf_black_canyon.8.b:0 "Розмальовані Люди підняли слушні питання."
nf_black_canyon.8.c:0 "Рейдери стали занадто агресивними... їх треба трохи заспокоїти."

#
nf_black_canyon.9.title:0 "Голос Богів і Напруга"
nf_black_canyon.9.desc:0 "Розмальовані Люди, як і інші народи в регіоні, лише нещодавно об’єднались заради виживання. Маленькі місцеві племена досі зберігають свою ідентичність. Їх єднає лише дві речі: спільна релігія та культура, засновані на магії татуювань, і їхній лідер. Позначений — голос Богів, що читає Лінії Гір. Він тлумачить волю богів через течію річок, подихи вітру, рух тіней і танець вогнів. Сили Форм можна скерувати, якщо татуюванням на тілі вшанувати їх.\n\nПозначений — центр цієї системи, і якщо ми зможемо або замінити його, або зробити союзником, ми зможемо просувати власні ідеї серед Розмальованих Людей без спротиву. Але рано чи пізно він розпочне Священну Війну на південь, щоб об’єднати всіх Розмальованих під своїм прапором. І коли ця військова машина рушить, ми можемо її вже не зупинити."
nf_black_canyon.9.a:0 "Якщо задобримо його — наша нація зміцниться."
nf_black_canyon.9.b:0 "Небезпечний гравець, на якого не варто покладатись."

#
nf_black_canyon.10.title:0 "Голос Розуму та Жадібності"
nf_black_canyon.10.desc:0 "Ямпанська Річкова Коаліція — найкращий приклад нашої Федерації: строката спільнота різних людей, що об'єднались під одним прапором, аби вижити у скрутні часи. Кожне місто коаліції має широку автономію та місцеву ідентичність, що робить їх гнучкими, але водночас і вразливими до розділення. Прибережні міста здебільшого населені рибалками й торгівцями, що працюють на Платт. Внутрішні — це здебільшого лісоруби й шахтарі. Така різноманітність без сильної місцевої влади залишає лише одну перепону — Беархарда.\n\nХоча родина Ріверсів завжди мала вплив у регіоні, саме Беархард вирізняється на фоні інших: найзаможніший, з винятковими торговельними навичками. Він рішуче налаштований реформувати спільноту Ямпан, не зважаючи на тих, кого може при цьому розгнівати. Його впертість нажила йому чимало ворогів, і ми можемо використати це, якщо він не підтримає наші дії. А якщо підтримає — можливо, йому цього буде досить."
nf_black_canyon.10.a:0 "Можемо знайти компроміс."
nf_black_canyon.10.b:0 "Він загрожує нашому ладу."

#
nf_black_canyon.13.title:0 "Рейдери занадто тихі...!"
nf_black_canyon.13.desc:0 "Зазвичай Рада Рейдерів голосно заявляє про свої права на Зібраннях, вимагаючи зменшити обмеження та послабити умови Компромісу. Але раптом усі вони стали зразковими слухняними. Щось не так — вони щось замислюють. Ми не знаємо, що саме, але у нас обмежений час, аби скоротити їхній вплив, поки не пізно..."
nf_black_canyon.13.a:0 "Ми мусимо діяти!"

#
nf_black_canyon.132.title:0 "Рейдерське Повстання!"
nf_black_canyon.132.desc:0 "Нам не вдалося стримати Маллета. Його рейдери організували повстання проти держави, частиною якої вони колись були."
nf_black_canyon.132.a:0 "Прокляті!"
nf_black_canyon.132.b:0 "Пекло так, Маллет — Молот Пустки!"

#
nf_black_canyon.14.title:0 "Трібали занадто тихі...!"
nf_black_canyon.14.desc:0 "Зазвичай Рада Трібалів голосно висловлюється на Зібраннях, вимагаючи релігійної свободи та розвитку своїх земель. Але раптом усі вони стали мовчазними підтакувачами. Щось тут не так — вони щось готують у тіні. У нас небагато часу, аби обмежити їхній зростаючий вплив, поки ще не пізно..."
nf_black_canyon.14.a:0 "Ми мусимо діяти!"

#
nf_black_canyon.142.title:0 "Розмальоване Повстання!"
nf_black_canyon.142.desc:0 "Ми не змогли завадити Розмальованим Людям взятися за зброю. Позначений уже б'є у барабани війни проти нас."
nf_black_canyon.142.a:0 "Прокляті!"
nf_black_canyon.142.b:0 "Об'єднаймо Розмальовану Націю знову!"

#
nf_black_canyon.15.title:0 "Громади занадто тихі...!"
nf_black_canyon.15.desc:0 "Гільдія Торговців зазвичай гучно висловлюється на Зібраннях, вимагаючи реформ оподаткування та кращого ставлення до своєї річки. Але раптом усі вони стали мовчазними підтакувачами. Це не просто підозріло — вони явно щось готують. Ми маємо лише коротке вікно, щоб зменшити їхній вплив, поки не стало запізно..."
nf_black_canyon.15.a:0 "Ми мусимо діяти!"

#
nf_black_canyon.152.title:0 "Ямпани Повстали!"
nf_black_canyon.152.desc:0 "Ми не змогли завадити Ямпанській Коаліції взятися за зброю. Беархард тепер веде своїх людей проти нас, звинувачуючи у порушенні їхніх свобод."
nf_black_canyon.152.a:0 "Прокляті!"
nf_black_canyon.152.b:0 "За Коаліцію, за Беархарда, за свободу!"

#
nf_black_canyon.16.title:0 "Громадянська Війна в Чорному Каньйоні!"
nf_black_canyon.16.desc:0 "Найгірше, чого ми боялись, сталося — наші колись єдині фракції відкололися від під нашого крила та розпочали міжусобицю. Села трібалів, поселення колоністів і навіть околиці в'язниці горять у полум’ї. Брати вбивають братів, а концепція «дружнього сусідства» зруйнована. Навіть ми — Баттері й Караван — змушені тікати з країни в пошуках безпеки — до Глоубагів.\n\nНаразі рейдери з Тіббетса б’ються з Розмальованими Людьми, а Ямпани розпочали наступ на Глоубагів у руїнах Боулдера. У глибині сердець цих людей кипить ненависть — одні прагнуть помсти й спокути, інші — здобичі й слави. Але врешті-решт переможе лише один. Лише одна фракція Чорного Каньйону отримає свою долю. І хто ж це буде?"
nf_black_canyon.16.a:0 "Давайте все тут рознесемо! (Грати за §Y[BCR.GetNameWithFlag]§!!)"
nf_black_canyon.16.b:0 "Заграти Війни! (Грати за §Y[PNT.GetNameWithFlag]§!!)"
nf_black_canyon.16.c:0 "Не здамось без бою! (Грати за §Y[YMP.GetNameWithFlag]§!!)"
nf_black_canyon.16.d:0 "Вони вже мертві... (Грати за §Y[GLW.GetNameWithFlag]§!!)"
nf_black_canyon.16.e:0 "Ми будемо опиратися й кусатись! (Продовжити гру за §Y[BLC.GetNameWithFlag]§!!)"

#
nf_black_canyon.17.title:0 "Розкол Чорного Каньйону"
nf_black_canyon.17.desc:0 "Колись могутній Чорний Каньйон, володар навколишніх земель, нарешті впав під вагою власного безладного управління та безперервної боротьби між підпорядкованими йому фракціями. Біг-Топ, їхній осередок влади, тепер перетворився на хаотичне поле бою, де три окремі угрупування повстали у боротьбі: рейдери Тіббетса, Ямпанська річкова коаліція та Розмальована Нація. Кожна фракція заявляє про свою законність і бореться за контроль над уламками розбитого Чорного Каньйону."
nf_black_canyon.17.a:0 "І що ж це означає для нас?"

#
nf_black_canyon.19.title:0 "Ті, Хто Вирвались з Колеса"
nf_black_canyon.19.desc:0 "Баттері з Меса-Верде дивився на величність Піраміди Уробороса. Колись він відвідував село, де чоловіки були сильними, жінки — відданими, а цикл, здавалося, не мав кінця. В'язень колись говорила з ним наодинці про відмінності й подібності їхніх племен. Але якщо в Меса-Верде розуміли, що зовнішній світ не можна повністю ігнорувати, то в Уроборосі панував майже трагічний світогляд, породжений десятиліттями майже рабства під владою божевільної жінки.\n\nГеката не була першою, хто протистояв Цезарю, і не стала останньою. Але вона, мабуть, була єдиною, кому невидима сила дала чимало благословень. Втім, замість того, щоб використати їх на благо свого суспільства, вона створила віддану армію, яка зрештою виявилась не кращою за армію Цезаря.\n\nАні Геката, ані Джордан Дей не були знайдені після нашого завоювання регіону. Думки Баттері повернулись до теперішнього, коли троє осіб, обрані ним самим, з'явились з Піраміди. Перша — Оракул. Друга — Гончак. І третій — простий старійшина племені, обраний місцевими племенами як представник.\n\nБаттері запросив усіх трьох висловити свої думки: який із каст буде прийнятий до суспільства Чорного Каньйону, а який буде вигнано.\n\nБаттері обміркував усе, перш ніж зробити свій вибір..."
nf_black_canyon.19.a:0 "Оракули служитимуть Позначеному."
nf_black_canyon.19.a_tt:0 "§gОракул заговорила першою, її старечий, хрипкий голос мав заспокійливу силу. \"Дочки... тобто Оракули, знайшли спільну мову з вашою Радою Племен. Позначений здається нам надзвичайно цікавим.\"§!"
nf_black_canyon.19.b:0 "Гончі стануть охоронцями МакБрайда."
nf_black_canyon.19.b_tt:0 "§gГончак заговорив другим, грубим і стриманим тоном. \"Гончі поклялись не зустрічати ворога, значно сильнішого за нас. І все ж ми виступили проти вас — і заплатили ціну. Можливо, той МакБрайд і його рейдери чогось нас навчать.\"§!"
nf_black_canyon.19.c:0 "Люди звільнені й приєднаються до Коаліції."
nf_black_canyon.19.c_tt:0 "§gОстаннім заговорив старійшина. \"Ми були лиш спостерігачами, не знали, що коїлось навколо. Якщо дозволите нам приєднатися до Ямпанів — ми зможемо допомогти уникнути подібних лих у майбутньому.\"§!"

#
nf_black_canyon.20.title:0 "Ділення на Нуль"
nf_black_canyon.20.desc:0 "Баттері витер піт з чола. Навіть після років мандрів, дорога до й з Меса-Верде залишалася такою ж важкою. Незважаючи на теплий прийом, найбільше його турбувала зустріч із Немоніком. У Ківі він, як і колись, знайшов його та його помічників.\n\nБаттері підійшов до старого Хранителя Пам’яті та вклонився. \"Немонік. Я думав, ти вже приєднався до духів предків.\"\n\nНевелика усмішка з’явилася на кам’яному обличчі Немоніка. \"Баттері з Меса-Верде, так тепер тебе звуть? Минуло багато циклів з того часу, як ти покинув Джеріко. Я чув про твої подвиги і руку захисту, простягнуту до нас.\"\n\nБаттері посміхнувся і вклонився. \"Це для мене честь, Немонік.\"\n\nПосмішка Немоніка зникла. \"Хоч я і вдячний за твої зусилля, не з усім, що ти зробив, я згоден. Але як наш захисник — я не можу дорікати. Але не розумій мої слова як вигнання: ти прославив Шифри. Я лише шкодую, що все це не було зроблено іншим шляхом.\"\n\nБаттері знову вклонився. \"Дякую тобі, Немонік. Але я маю до тебе особисте прохання. Колись давно ти надав моїй супутниці, якій тепер відома як В'язень, Священний Номер — 13. Я хотів би дізнатись, який номер призначено мені.\"\n\nНемонік погладив сиву бороду. \"Ти хочеш отримати Приватний Номер? Гаразд. Дозволь провести Ритуал Номера.\"\n\nПідійшовши до комп’ютера в центрі Ківи, він відкрив якусь числову програму та почав вводити формули. Баттері напружено слухав його бурмотіння.\n\n\"Поділити на коефіцієнт Больцмана, помножити на фактор Беніні... врахувати добрі й злі вчинки В’язня, і... як цікаво.\"\n\nБаттері не витримав. \"Що? Що там?\"\n\n\"Доля проявила до тебе цікавість, Баттері. Схоже, твій Приватний Номер — 14.\"\n\nБаттері ледь не впав. 13 — номер, який мав В’язень. І тепер він, той, чия доля пов’язана з 13, отримує 14. Він не вважав, що цей номер зробить його важливішим за В’язня, але це число... це прийняття його племені — дали йому спокій."
nf_black_canyon.20.a:0 "14, бо йде слідом за 13."

#
nf_black_canyon.21.title:0 "Полетіти на Бомбі в Пекло"
nf_black_canyon.21.desc:0 ""Баттері? Ти з нами, хлопче?" — запитав Джек Колвелл. Баттері вирвався з заціпеніння.\n"Так-сер, генератор працює на 125% ефективності. Просто хотів на хвилинку задрімати — давно не мав нормального сну."\nКолвелл похитав головою. "Я тебе ніколи не розумів. У день, коли ти з'явився тут, я подумав, що ти як інші племінні — молитимешся якимось богам та гупатимеш по трубах, викликаючи духа дощу. Але ось ти — на відміну від усіх інших в’язнів, дійсно працюєш. Але все одно якось ухитряєшся ухилятися. Ти для мене загадка, Баттері."\nУ цей момент двері розчинились, і крізь яскраве світло в отворі з’явилася постать у вицвілому синьо-оранжевому комбінезоні...\n"Баттері? Баттері?!" Далекий поклик повернув його до реальності.\n\nВін більше не був у старому Джеріко, не був інженером з Колвеллом — той, на жаль, загинув під час одного з багатьох рейдів. Баттері стояв у старій водяній станції, яку згодом удосконалив його друг. Попри руйнування й вік, Баттері вирішив навідатися сюди — не лише щоб розглянути можливість відбудови міста, а й щоб вивчити доробок Колвелла й використати його в інших місцях.\n\nАле скільки б він не дивився на механізми, спогади про той час не покидали його. Повернувшись до Чорного Каньйону, Баттері вирішив започаткувати особисту програму для здібних водяних техніків та інженерів. Програму, що отримала назву "Гордість Колвелла"."
nf_black_canyon.21.a:0 "Це завжди було про робочу етику."

#
nf_black_canyon.23.title:0 "Договір із Чорним Каньйоном?"
nf_black_canyon.23.desc:0 "Ми отримали повідомлення від Баттері з Меса-Верде. Чорний Каньйон пропонує допомогти нам у розвитку нашої молодої промисловості, а натомість ми маємо передати верфі, які ми отримали після війни з Гніздом Барона. З одного боку, це значно зміцнить нашу обороноздатність на півночі, але з іншого — ми фактично відмовимось від можливості мати морську (річкову) присутність."
nf_black_canyon.23.a:0 "Нам біля річки нічого не потрібно."
nf_black_canyon.23.b:0 "Ми не самі собі вороги, дякуємо."

#
nf_black_canyon.24.title:0 "Далеко від Дому?"
nf_black_canyon.24.desc:0 "Рідко коли Маллет приходить з ідеями, що виглядають альтруїстичними. Зазвичай за ними стоїть влада або вигадана проблема. Але сьогодні він висловив справжню ідею — зробити виробництво ефективнішим. І без рабів! Він запропонував розмістити виробництво ближче до центрів військової підготовки, щоб пришвидшити екіпірування військ і полегшити охорону.\n\nВардед був проти — він вважав це загрозою для життя Розмальованих племен, бо це передбачало переселення з рідних земель. Питання поставили перед Баттері для вирішення."
nf_black_canyon.24.a:0 "Ця земля — наш дім."
blc_countryside_our_home_tt:0 "\n§gПісля нашої §YКампанії§!, населення зросте по всіх §Yосердніх територіях§!.§!"
nf_black_canyon.24.b:0 "Хлопці повертаються до міста."
blc_city_is_home_tt:0 "\n§gПісля нашої §YІніціативи§!, у головних містах (§Y[115.GetName], [504.GetName]§! та §Y[572.GetName]§!) буде значне зростання населення.§!"

#
nf_black_canyon.25.title:0 "Інтервенціонізм у стилі Пустки"
nf_black_canyon.25.desc:0 "Маллет прийшов до Баттері з проханням про інвестиції. Його рабовласницькі фабрики, мовляв, готові до розширення — тільки б трохи кришок, щоб провести рейд на ресурси Нью-Ханаану. Берхард, який зазвичай мовчить, виступив проти — запропонував інвестувати в фабрики на землях Ямпанів. За його словами, ми можемо не ганьбитись підтримкою рабства. Вибір залишився за Баттері."
nf_black_canyon.25.a:0 "Я краще вкладусь у Берхарда."
nf_black_canyon.25.b:0 "Удари швидко й сильно, Маллет."
nf_black_canyon.25.c:0 "Немає кришок — нема інвестицій..."

#
nf_black_canyon.26.title:0 "Касперський Річковий Договір"
nf_black_canyon.26.desc:0 "До нас звернулись люди з півдня з цікавою пропозицією. Ямпани мають запекле суперництво з родиною Сондерсів, однією з наших груп. А суперництво — погано для бізнесу. Баттері з Меса-Верде хоче зупинити це і укласти угоду — ми відкриємо порти один для одного та спільно розвиватимемо доки.\n\nНемає прямого мінусу від цієї угоди, але вона посилить їхню флотилію так само, як і нашу. А раптом завтра ми самі з Ямпанами воюватимемо?"
nf_black_canyon.26.a:0 "Погнали!"
nf_black_canyon.26.b:0 "Ні, дякую!"

#
nf_black_canyon.27.title:0 "Дослідження й Непорозуміння"
nf_black_canyon.27.desc:0 "Берхард сьогодні виступив із промовою. Рідкісна подія, та ще й ґрунтовна. Він говорив про компанію, що розпочала реверс-інжиніринг старосвітніх рушниць на землях Ямпану. Він хвалив цю ініціативу і вважав, що уряд має її підтримати. Вардед лише посміявся — навіщо рушниця без патронів? Краще вкластися в удосконалення холодної зброї — її не треба заряджати. Природно, що цим займуться Розмальовані як найкультурніші й найдосвідченіші. Рішення залишилось за Баттері."
nf_black_canyon.27.a:0 "Розвиваймо холодну зброю."
nf_black_canyon.27.b:0 "Нам потрібна справжня вогнепальна зброя."

#
nf_black_canyon.28.title:0 "Мобілізація до Зброї"
nf_black_canyon.28.desc:0 "Конфедерація Ямпан вирішила розширити й мобілізувати свої мілітарні сили після серії крадіжок та викрадень. Маллет, який, ймовірно, сам і стоїть за цими інцидентами, почав кричати про несправедливість. Він заявив, що його люди найкраще пристосовані до військової служби, тож саме йому слід дозволити розширювати війська. Вардед, з дурнуватою усмішкою, зауважив: якщо Ямпани не здатні захистити свої землі, то, можливо, він повинен зібрати воєнний загін для допомоги. Рішення передано Баттері."
nf_black_canyon.28.a:0 "Маллет захищає нас усіх!"
nf_black_canyon.28.b:0 "Ямпани мають право на озброєння."
nf_black_canyon.28.c:0 "Вардед допоможе захистити Ямпанів!"

#
nf_black_canyon.29.title:0 "Так завжди з тиранами"
nf_black_canyon.29.desc:0 "Рішення для давньої проблеми Баттері просто зайшло до нього в двері. Найманці, колишні Військові Поліцейські НКР і так звані «Вартові Білини», прибули до регіону. Баттері запитав, чи не хочуть вони постійну роботу. Єдина умова — звільнити рабів.\n\nБаттері організував постачання банди Макбрайда партією наркотиків. Потім наказав найманцям роззброїти їх, замкнути в камерах і звільнити рабів, знявши нашийники. Ті створили громади довкола Великого Купола — хтось працює на фабриках, хтось охороняє колишніх рабовласників. А ті, що залишились без вільної робочої сили, самі працюють на відпрацювання своїх гріхів.\n\nНовий керівник в'язниці, Вартовий Джексон, ще ефективніше керує заводами — і, що найважливіше, не прагне захопити владу.\n\nА що ж Маллет? Так само, як сам стріляв змовників, Джексон особисто пустив кулю між його очей після невдалої втечі. Хто меч піднімає — від меча і гине."
nf_black_canyon.29.a:0 "У Чорному Каньйоні більше немає рабства."
nf_black_canyon.29.a_tt:0 "\n§gУсі прибічники [BLC.BLC_mcbride.GetName] тепер §Rза ґратами§!!§!"

#
nf_black_canyon.30.title:0 "Голос Непокірного і Могутнього"
nf_black_canyon.30.desc:0 "Маллет Макбрайд давно вже є занозою в нашому союзі. Розмальовані можуть бути дивакуватими, але не прагнуть до рабства й смерті, як банда Макбрайда. Берхард ховає амбіції за тихим фасадом, але Макбрайд нічого не приховує. Він хоче вбивати, грабувати й наживатися.\n\nІ все ж він прийняв нашу угоду. Вони знайшли своє місце в Чорному Каньйоні, і ми співіснували. Хоча Макбрайд робив це настільки складно, наскільки міг.\n\nБаттері часом мріє просто заарештувати всіх рейдерів. Але він знає — варто зробити різкий крок, і ті об’єднаються проти нього. Чи наважиться він прибрати Макбрайда, чи задовольниться наявною ситуацією?"
nf_black_canyon.30.a:0 "Собака на повідку..."
nf_black_canyon.30.b:0 "... все ще може вкусити."

#
nf_black_canyon.31.title:0 "Про Договори та Обіцянки"
nf_black_canyon.31.desc:0 "Баттері загубився в думках, поки гуль на іншому боці столу тараторив. Йому згадувався знаменитий «Коллінський договір» між Чорним Каньйоном та Сяйливими Жуками — що по суті перетворив Болдерських розвідників на довоєнну колонію ресурсів. Незважаючи на промислову допомогу та поступку Ларамі, чи справді це було чесно? Чи не експлуатував він їх, попри найкращі наміри?\n\nГуль у брудному довоєнному костюмі, що називався Шмідт, як зазвичай хотів або більше допомоги, або менше обов'язків. «Скажи мені, Шмідте,» — раптом перебив його Баттері. «Як розвивається індустрія у Жуків? Піднімаєтесь з колін?»\n\nГуль аж пересох у горлі. «Стараємось, Баттері. Але давай повернемося до пункту про податки?»\n\nБаттері кивнув і зручно відкинувся на спинку крісла. «Як тільки зможете себе забезпечувати, ми зменшимо підтримку. Але подвоїмо ваші виплати. Маєте вносити свою справедливу частку.» Його рішення було остаточним. Гуль лише голосно ковтнув слину."
nf_black_canyon.31.a:0 "На відстані він здався приємнішим."

#
nf_black_canyon.32.title:0 "Ще Один Слізний Шлях"
nf_black_canyon.32.desc:0 "Шістсот зламаних душ втекли від м'ясника, що вирізав Нову Мексику. Вони йшли довгою колоною через сніги й гірські ущелини. Холод, падіння, мутанти й звірі взяли своє, і лише 43 виснажених племінника дійшли до нас. 43 — із розбитими ногами й поглядами, що бачили занадто багато.\n\nКоли Баттері підійшов допомогти, їхній тимчасовий вождь Делшей сказав, що вони поділяться всім, що знають, в обмін на притулок. Знання, здобуті такою кров’ю, точно принесуть користь нашій нації."
nf_black_canyon.32.a:0 "Що можна сказати перед таким горем?"

#
nf_black_canyon.33.title:0 "Культурний Обмін"
nf_black_canyon.33.desc:0 "Попри всі зусилля Вардеда, культурна винятковість, яку він намагався нав’язати Розмальованим, поступово помирала під впливом нових ідей. Такі поняття як демократія стали надзвичайно популярними серед них, аж настільки, що Баттері зміг укласти для племені власну конституцію. Через невдачу Вардеда у справі великості племені, його нещирий традиціоналізм і смішну кількість скандалів із розкраданням, викритих Баттері перед виборами, його змістили на користь його попередника Квік Аспа. Він повернувся з відставки до посади, що вже не має старої сили. Йому не подобаються реформи Баттері, але він нічого не може вдіяти. А Вардед? Тепер він знову Пітер Бретт. Можливо, у пустці йому пощастить більше, ніж у Чорному Каньйоні."
nf_black_canyon.33.a:0 "Я люблю демократію."

#
nf_black_canyon.34.title:0 "Платтський Переворот"
nf_black_canyon.34.desc:0 "На жаль, Берхарда довелося усунути. Із усіх своїх “радників”, саме з ним Баттері мав найбільше точок дотику. Він сподівався, що колись вони зможуть працювати разом. Що зможе пробитись крізь мовчазну маску Берхарда, який обчислював його крах у кутку. Але головною проблемою Берхарда було те, що він ніколи не хотів підкорятись комусь.\n\nСаме це і стало його слабкістю. Баттері легко зібрав мерів коаліції Ямпан і переконав їх, що той відбирає у них владу. Скоро мова пішла про необхідність його заміни. Так, сьогодні Берхарда змінив його поступливіший батько. Людина, що не прагне зайвих реформ. Берхард прийняв це мовчки. Він не сказав жодного слова, коли проти нього винесли вотум недовіри, і нічого — під час святкувань. Просто пішов до свого судна й почав оформляти документи на відкриття судноплавної компанії.\n\nВін ніколи не тримав зла на Баттері. Вони залишались у добрих стосунках, переписуючись до самої смерті. Адже й він сам вважав те саме про Баттері — шкода, що хтось один мусив піти."
nf_black_canyon.34.a:0 "Нехай бистрі Платту несуть тебе далі, Берхарде."

#
nf_black_canyon.35.title:0 "Надзвичайні Вибори серед Розмальованих"
nf_black_canyon.35.desc:0 "Перший — Інгхаус. Майстер-тесля, що навчив дюжини учнів, як чистити та обробляти шкіру. Його поважають ремісники та вояки племені. Він — мудрий старійшина і гідний кандидат на шамана.\n\nЙого суперник — Саддлберн, улюбленець молоді. Художник, що покриває стіни й тіла племені релігійними малюнками. Його харизма й молодість можуть повести нове покоління вперед.\n\nАле перемогти може лише один. Як почесному члену племені, Баттері дали право голосу..."
nf_black_canyon.35.a:0 "Ремісник."
nf_black_canyon.35.b:0 "Митець."
nf_black_canyon.35.c:0 "Неочікуваний світський кандидат."

#
nf_black_canyon.36.title:0 "Надзвичайні Вибори в Конфедерації Ямпан"
nf_black_canyon.36.desc:0 "Перший кандидат — капітан Торо Вудс. Військовий герой і син другої за впливовістю родини в Ямпані, хоч і позашлюбний. У суспільстві, де родовід важливіший за віру, саме він є фаворитом.\n\nЙого опонент — Престон Миклович. Утікач із рабства Макбрайда, Престон навчив багатьох стріляти. Його шанують колишні раби, і він має імідж народного героя.\n\nЛише один з них поведе Ямпан уперед. Як почесний ямпанець, Баттері має право голосу..."
nf_black_canyon.36.a:0 "Бастард Вудсів."
nf_black_canyon.36.b:0 "Джоні Епплсід насильства."
nf_black_canyon.36.c:0 "Темна конячка."

#
nf_black_canyon.37.title:0 "Любов Перемагає"
nf_black_canyon.37.desc:0 "Естер та Марісса обидві несподівано перемогли у виборах. Їхня любов до народу та одна до одної зробила їх сильним дуетом у політиці Конгресу. Вони підтримують Баттері як права й ліва рука. Йому іноді й самому не віриться, що його дії об’єднали навколо таких сильних жінок. Їхнє кохання, їхні всиновлені близнюки — усе це свідчить про націю, що вистоїть випробування часом.\n\nІсторики зберегли уривок з вірша, який Баттері написав того дня:"
nf_black_canyon.37.a:0 "§g... Процвітання навіки нашому Каньйону Чорному.§!"
nf_black_canyon.37.a_tt:0 "“§gПогляну ліворуч — там Естер\nПогляну праворуч — Марісса\nА за плечима Амелія стоїть.\nЯ не боюсь прийдешнього\nБо гірше вже пройдено...§!"

### Adventures of Battery
#
nf_blc_battery.1.title:0 "Випий Цієї Води"
nf_blc_battery.1.desc:0 "Дорога 13,\n\nЯ вирішив писати тобі листи, аби вручити їх тобі одного дня — чи то через кур’єра, чи з усмішкою давнього друга. Ти згадувала, що хочеш виправити давні помилки, й мені це здалося чудовою ідеєю. Почну з того, щоб виправити кривду у містечку Новий Єрихон.\n\nПам’ятаєш Єрихон, 13? Саме там ми й зустрілися. Опріснювальна станція старого Джейка Колвелла. Її обслуговували в’язні, грішники й я. Тепер Джейка вбили купка релігійних божевільних, що поклоняються старій дорозі, а станція й місто лежать у руїнах, захоплені байкерами-рейдерами. Єдине, що я можу зробити для містян — збудувати їм нову станцію.\n\nСтара станція стогнала під прокльонами проклятих душ. Нову ж можна зробити символом надії — навіть для тих самих байкерів. Можливо, очистивши місце від мормонських традиціоналістів, ми дамо Новому Єрихону шанс. І хоча це вже не наше місце, мені вдалося покращити ефективність очищення води — саме заради цього я і працював там колись.\n\nЦього разу я завершив справу. Можливо, час рушати далі. Може, знайдемо десь місце, щоб остаточно осісти? Хоча, мабуть, це лише мрії для таких блукачів, як ми, 13.\n\n—Баттері"
nf_blc_battery.1.a:0 ""Можливість змити брудну сторінку.""

#
nf_blc_battery.2.title:0 "Біля Забороненого Храму"
nf_blc_battery.2.desc:0 "Дорога 13,\n\nСьогодні я відвідав Рай, щоб зустрітись із богинею — як і ти колись. Ми з тобою стільки всього полагодили після того землетрусу, і вона, здається, була тобі вдячна.\n\nМожливо, я просто застав її не в найкращому настрої.\n\nЯ теж ремонтував частину розсадника. Спочатку вона дякувала, але варто було мені згадати, що я торговець і зацікавлений у її технологіях, як вона назвала мене мародером. Звинувачення в пихатості, спроба активувати системи захисту, декілька лазерних пострілів... двічі...\n\nЯ намагався бути ввічливим, та, мабуть, краще було б залишити її в спокої. Мене дратують ці псевдосвяті, що тримають знання під замком, наче священну річ. Сподіваюсь, це не призведе до гірших наслідків у майбутньому...\n\n—Баттері"
nf_blc_battery.2.a:0 ""Схоже, досвід у Єрихоні був не марний.""

#
nf_blc_battery.3.title:0 "Фундамент «Свободи»"
nf_blc_battery.3.desc:0 "Дорога 13,\n\nЯ побував у Нью-Стерлінгу, щоб встановити торгові відносини з Залізним Альянсом — ротою найманців у сталевих обладунках, які використовують рабську працю. Безжальні очі й ланцюги скрізь.\n\nАле, як і завжди, я не пас задніх. Пара хитрощів — трохи проводів, трохи диму — і їхня фабрика завмерла. Поки вони намагались полагодити її, я зняв кайдани з чотирьох ланцюгових бригад. Усі ті місяці важкої праці пішли не марно — вони мали силу битися. І інструменти в них теж були... корисні. Я, можливо, «випадково» загубив кілька креслень і зброї теж.\n\nКоли мій супровід повернувся, фабрика була порожньою, а я стояв посеред диму з невинним обличчям. Вони прийняли мої пояснення — як і очікував. Військовим потрібні ресурси, які я можу надати. А звільнити з десяток рабів між справою — це вже подвійна перемога.\n\nЦе було, як у старі часи, 13. Як тоді, коли ми все це робили разом. Давно не чув про тебе. Сподіваюсь, ти жива. Ненавиджу думку, що пишу в порожнечу.\n\n—Баттері"
nf_blc_battery.3.a:0 ""Я люблю дипломатію.""

#
nf_blc_battery.4.title:0 "Притулок Псів"
nf_blc_battery.4.desc:0 "Дорога 13,\n\nЯ ніколи не думав, що зможу знайти мир з Битими Псами. Їхня жорстокість здавалася мені проявом скаженства — їх треба було пристрелити, а не простягати руку. Та, як виявилося, мій досвід з ними обмежувався лише рейдерськими бандами. Коли дивишся на цуценя до дресирування, гладиш його м’яку шерсть, заглядаєш у довірливі очі... важко уявити його вбивцею.\n\nЯ вирішив трохи підзаробити як вантажник. Вони будували новий розплідник, і комусь потрібно було тягати сталевий брухт. Було приємно знову відчути втомлені м’язи. Просто зосередитися на роботі — у цьому є своє очищення.\n\nПоговорив і з місцевим наглядачем за розплідником — чоловік на ім’я Догбаді. Ти б його обожнювала: напівбожевільний, але сповнений народної мудрості. Ти завжди усміхалася після наших зустрічей із подібними дивакуватими людьми — з тією лукавою усмішкою й іскрою в очах. Мені здалося, що після розповідей Догбаді про дресирування псів ти б подивилася на мене саме так.\n\nТепер я краще розумію Битих Псів. Вони — не звірі, вони мають культуру, мрії, надії. Я б не назвав їх друзями, але розуміння допоможе вести торгівлю — або битву, якщо доведеться.\n\n—Баттері"
nf_blc_battery.4.a:0 ""Друг людини, кажеш?""  

#
nf_blc_battery.5.title:0 "Де Брамін Іде Помирати"
nf_blc_battery.5.desc:0 "Дорога 13,\n\nЗустрів я тутешнього барона худоби у Вайомінгу. Даремна трата часу. Жодної усмішки, розмова як із цеглиною. Я поцупив у нього дві сотні кришок — навіть не помітив. Більше скажу: бачив, як його донька стягнула шістсот.\n\nАле справжню цінність тут мав не барон, а хлопець у стайні. Справжній діамант. Знав про брамінів більше, ніж будь-хто. Через п’ять хвилин розмови я зрозумів: талант такого рівня не повинен гріти солому за п’ять кришок на день.\n\nЯ заплатив йому ті самі дві сотні й разом із ним «позичив» табун брамінів у барона Бейлі. От цього він, мабуть, помітить.\n\nЯ поставив його керувати двадцятьма головами. Щось підказує мені — ця інвестиція окупиться стократно. Риба й тато — добре, але нам не завадить трохи різноманіття в раціоні.\n\n—Баттері"
nf_blc_battery.5.a:0 ""Тваринництво — справжнє мистецтво...""

#
nf_blc_battery.6.title:0 "Дві Сторони Однієї Монети"
nf_blc_battery.6.desc:0 "Дорога 13,\n\nХани Вайомінгу — дивна група. Хтось хоче бути цілителем, хтось — наркоторговцем, а хтось — завойовником. Я не хочу бачити завойовників на півночі, тож вирішив втрутитись.\n\nНа щастя, пацифістська фракція під проводом Амалгана виявилася відкритою до торгівлі. Ми довго говорили про механіку й медицину, попиваючи самогон — найчистіший віскі з усіх, що я куштував. Тобі б теж сподобався. Може, пляшечку привезу, коли зустрінемось.\n\nНаступного ранку я, з бодуна, зустрівся з іншою лідеркою — Есен. Незважаючи на пошкоджені очі, її погляд пронизував до кісток. Вона хоче чогось... і це «щось» — не на нашу користь. Якби я був сміливий, як ти, я б кинув їй виклик просто там. Але натомість — просто поцупив у неї стару книжку: «Таємна історія монголів». Пошарпана, із закладками — військова тактика й адміністративні нотатки. Може, вона відкриє мені, як вона мислить. \n\nЯ мав застрелити її, як ти б зробила, і пробиватися з боєм. Але я не ти.\n\nСподіваюся, що матиму сили глянути тобі в очі.\n\n—Баттері"
nf_blc_battery.6.a:0 ""Стає у мене звичкою... красти.""  

#
nf_blc_battery.7.title:0 "Кочівник Кочівнику"
nf_blc_battery.7.desc:0 "Дорога 13,\n\nЯ ніколи не розумів людей, що чіпляються за старі нації. Нова Каліфорнійська Республіка, мормони Нового Кеяну, легат Ланій з Легіону — й, у меншій мірі, збирачі Колорадо. Я завжди кажу: старий світ знищив сам себе через ці прапори. Навіщо повертати ідеї, що призводять до війни, якщо у нас і без того причин вистачає?\n\nПортер — трохи інший. Він ідеаліст, але не наївний. Він вивішує прапор старого Колорадо не як ностальгію, а як нагадування: ми всі колись були єдиним народом. Що в нас більше спільного, ніж відмінностей. Що люди можуть працювати разом.\n\nІ саме це мислення позбавило його народу найцінніших земель.\n\nЯ не кращий. Тримаю купу розрізнених угруповань разом, і всі вважають, що наш союз ось-ось розвалиться. Що таке перемога для мене? Бути канцеляристом, що розподіляє пайки між рейдерами, торговцями й племенами? Старі прапори — старі проблеми, але нові теж не кращі.\n\n—Баттері"
nf_blc_battery.7.a:0 ""Не спалюймо прапори. Йдемо далі.""

#
nf_blc_battery.8.title:0 "Спадщина Нобеля"
nf_blc_battery.8.desc:0 "Дорога 13,\n\nСьогодні я став свідком того, як людину використали як випробувального манекена для вибухівки. Його звинуватили в приховуванні трофеїв від банди та у сумнівах щодо влади. За ці злочини його підірвали динамітом. Жорстоко, як на мене, але інші з цих «Скоківців» або не звернули уваги, або надто налякані, щоб щось сказати.\n\nЧоловік благав про милість до останнього, коли його прив’язували до чорної гофрованої жерсті. Полум’я й вибух розірвали його на попіл і червоний туман.\n\nПісля цього вони запропонували торгівлю — вибухівка в обмін на їжу, ліки й чисту воду. Чесні в переговорах, не тиснули. Поводилися так, ніби нічого страшного не сталося. Можливо, у їхньому суспільстві зберігати щось для себе чи заперечувати — настільки тяжкий гріх, що страту вважають справедливою.\n\nВони не цікавляться ані завоюваннями, ані рабством — поки що. Тож ми обережно почнемо торгівлю. Я ловлю себе на думці, що з кожним днем усе більше й більше приймаю. Можливо, я й справді стаю політиком.\n\n—Баттері"
nf_blc_battery.8.a:0 ""Ще один компроміс, ще один гріх.""

#
nf_blc_battery.9.title:0 "Я не знаходжу тебе ніде"
nf_blc_battery.9.desc:0 "Дорога 13,\n\nЯ сьогодні відвідав своє старе плем’я. Минуло п’ятнадцять років з того дня, як я пішов за знаннями. Багатьох уже немає, і все тут стало іншим. Дивно. Коли саме це місце стало для мене чужим?\n\nДумаю, це сталося, коли я зустрів тебе. Рішуча, дотепна, швидка, сильна — я все ще дивлюся праворуч, чекаючи побачити твою усмішку, твої виразні очі.\n\nЯ почуваюся чужим не через час, не через відповідальність перед караваном (бо й він мені не дім). А тому, що тебе тут нема. І, можливо, більше ніколи не буде.\n\nТоргівлю й дипломатію я відновив легко. А ти сумнівалася?\n\nМожливо, напишу ще один лист завтра.\n\n—Баттері"
nf_blc_battery.9.a:0 ""Все ще наспівую ту мелодію з радіо...""
nf_blc_battery.9.a_tt:0 ""§gЯ був на сході — йшов на захід, на півдні пасовиська, на півночі порожнеча, стежки без мети, та все шукаю її...\n\nЯ вже не знаю, де мій дім...§!""

#
nf_blc_battery.10.title:0 "Де Потяги Засинають"
nf_blc_battery.10.desc:0 "Дорога 13,\n\nЯ сьогодні зустрів когось, хто нагадав мені про тебе. Не виглядом чи словами, а тим, як трималася: гостра, вперта, впевнена. Вона побудувала маленьку націю з купки дітей, які їздили потягами. Якби ти була поруч, ти б назвала її нерозважною. І, певен, тобі б вона сподобалась.\n\nВона мені не довіряє. Вважає мене черговим диктатором, що хоче втиснути її народ у свої плани. І вона не помиляється... але й не права повністю. Я просто хочу збудувати щось, що переживе нас. Ти б це зрозуміла, чи не так?\n\nТи завжди краще почувалася в куряві — зі зброєю й усмішкою. Держава — то не твоя битва. Цікаво, що б ти сказала, побачивши мене зараз. Засміялася б? Кинула б: «Занадто багато думаєш»?\n\nНавіть не знаю, чому досі пишу ці листи. Де ти? Чи б ти їх узагалі читала, якби могла? Але це як говорити з тобою. Це тримає мене на землі.\n\n—Баттері"
nf_blc_battery.10.a:0 ""Це мусить мати сенс... мусить...""

#
nf_blc_battery.11.title:0 "Оаза на Горизонті"
nf_blc_battery.11.desc:0 "Дорога 13,\n\nВісімдесятники — дивна банда. Так, рейдери, але з амбіціями. Побудували свою імперію на ревучих моторах і залишках старого світу. Я мусив укласти з ними угоду — хоч це й було схоже на рукостискання з скаженим псом.\n\nТи б це зненавиділа, 13. Назвала б це компромісом занадто великим. Але іноді доводиться мати справу з такими, якщо це рятує інших. Справа не в тому, щоб їх любити. А щоб використати. Нам були потрібні їхні машини й знання. І я їх отримав.\n\nРаніше я бачив у таких угодах перемоги. Тепер я просто втомлений. Кожен компроміс — наче ще шматок мене зникає.\n\nТи десь там, 13? Дивишся на все це? Пішла, бо не могла більше терпіти цей безум? Чи тебе щось наздогнало? Я не знаю, чи заздрю тобі, чи злюся, що залишила мене наодинці з цим хаосом.\n\n—Баттері"
nf_blc_battery.11.a:0 ""Угода з дияволом. Де ж дно?""  

#
nf_blc_battery.12.title:0 "Посміхніться й помахайте, хлопці"
nf_blc_battery.12.desc:0 "Дорога 13,\n\nСьогодні я відвідав Роузбад. Тобі тут би сподобалося: добрі люди, щирі посмішки, така спільнота, яка, здавалося б, не може існувати в цьому світі. Вони прийняли мене як старого друга, нагодували, розповідали історії... а я почувався шахраєм.\n\nВони надто довірливі, 13. Надто надійні. Я бачив, що трапляється з такими місцями, коли приходить хтось хитріший, жорстокіший, голодніший. Їх просто проковтнуть. І я нічого не зможу вдіяти. Я навіть не можу попередити їх, не виглядаючи як той самий вовк під дверима.\n\nІноді я питаю себе — навіщо все це? Навіщо намагатися побудувати щось добре, якщо все так крихке? Якщо достатньо одного поганого дня, одного жорстокого рішення, щоб усе зруйнувати?\n\nТи, мабуть, сказала б мені не зациклюватися й просто зосередитися на тому, що переді мною. І, чорт забирай, можливо, ти мала б рацію.\n\n—Баттері"
nf_blc_battery.12.a:0 ""Я не можу врятувати всіх, і це роздирає мою душу.""

#
nf_blc_battery.13.title:0 "Без дому... знову"
nf_blc_battery.13.desc:0 "Дорога 13,\n\nЯ перевів караван до території Світляків. Не найкраще місце, але краще, ніж нічого. Кожна дорога веде до руїни, кожне рішення ламає щось або когось.\n\nТи б, певно, мала ідею. Стояла б на краю табору, дивлячись у далечінь із тим поглядом, коли щось обмірковувала. А потім клацнула б пальцями — і план готовий.\n\nА в мене немає плану, 13. Я просто намагаюся підтримувати рух, годувати людей, тримати їх живими. Але, здається, можливо, мені просто варто все відпустити. Нехай караван розпорошиться, хай Конфедерація розвалиться.\n\nЯ так чортово втомився, 13. І вже навіть не знаю, чому продовжую писати тобі...\n\n—Баттері"
nf_blc_battery.13.a:0 "Моя остання позиція..."

#
nf_blc_battery.14.title:0 "Я здаюся"
nf_blc_battery.14.desc:0 "Дорога 13,\n\nОсь і все. Досить. Вони гризуться між собою, а я — ще один голос, якого не чують. Я думав, що зможу краще. Що буду кращим.\n\nАле ти була права, чи не так? Влада над іншими робить тебе тим, кого ти ненавидиш. Я мав тебе послухати. Мав піти давно.\n\nЯ не знаю, де ти, чи жива ти взагалі. Але я збираю речі. У мене пляшка віскі від Послідовників, ці листи, і рештки надії. Можливо, я знайду тебе там, на пустій дорозі. А може — лише пустоту.\n\nУ будь-якому разі — мені досить.\n\n—Баттері"
nf_blc_battery.14.a:0 "Дайте мені смерть безсмертну..."

#
nf_blc_battery.15.title:0 "Єдність між чужинцями"
nf_blc_battery.15.desc:0 "Дорога 13,\n\nВсе. Конфедерація стабільна. Стабільніша, ніж я колись мріяв. Я уклав угоди, зробив поступки, проковтнув свою гордість стільки разів, що вже не злічити. Але все спрацювало.\n\nОзираючись назад, я не впевнений, що ти впізнала б мене. Ти завжди бачила суть речей, і мені цікаво, що б ти сказала, побачивши все, що я побудував.\n\nНе знаю, навіщо писав тобі всі ці роки. Може, щоб не з’їхати з глузду. Може, тому що ти — остання, кому я довіряв. Але здається, що тепер — досить.\n\nДе б ти не була, сподіваюся, ти там, здіймаєш бурю й робиш те, що вмієш найкраще.\n\n—Баттері"
nf_blc_battery.15.a:0 "Я вільний."

#
nf_blc_battery.16.title:0 "Дисонанс фіналу Балади"
nf_blc_battery.16.desc:0 "Останні акорди Балади про Баттері заглушені пострілами. Його трагедія — в гордині й надмірному компромісі з власними принципами. Коли його нація розвалилася, він пішов шукати стару подругу — В’язня з цифрою 13. Але одна жінка вирішила, що він не заслуговує спокійного фіналу.\n\nЕстер з Алкови була частиною Ямпанської Конфедерації. Вона кохала Маріссу, втікачку з рабства. Разом вони виховували двох прийомних синів. Але коли колишній хазяїн прийшов по Маріссу, Баттері видав її, і ту закатували на смерть. А потім громадянська війна забрала в Естер ще й її синів.\n\nВ неї залишилася лише лють — і роки тренувань у міліції. Вона прийшла до Баттері. Він не чинив опору. Не схопився за зброю. Прийняв кулі. Прийняв кару.\n\nІ врешті залишився лише вітер, що виє над скривавленим Чорним Каньйоном, і порожнеча жінки, якій уже нічого втрачати."
nf_blc_battery.16.a:0 "Так закінчується балада..."

#
nf_blc_battery.17.title:0 "Фінальна нота Балади"
nf_blc_battery.17.desc:0 "Останні акорди Балади про Баттері супроводжуються весільними дзвонами. Після років боротьби, бюрократії й самотності, Баттері оголосив: він одружується.\n\nІм’я його обраниці не стало сюрпризом. Амелія Розвайт давно була закохана в нього. Торгівчиня, винахідниця, добра людина. І ніколи не вміла приховати своє захоплення ним.\n\nЖиття Баттері не стало безтурботним. Він усе ще керував нацією. Але тепер у нього було щось, чого він завжди прагнув — хтось поруч, як рівна, з любов’ю та відданістю. Амелія з радістю прийняла цей виклик."
nf_blc_battery.17.a:0 "Так закінчується балада..."

### The Letters of the Factions (Character events)
#
nf_blc_letters.0.title:0 "Баттері з Меса-Верде"
nf_blc_letters.0.desc:0 "Це — балада про Баттері. Історія про племінника, що став допитливим поселенцем, потім послідовником великої справи — а зрештою й великою людиною сам по собі. Про в'язня з номером 13 на формі відомо небагато, але караван, що виник завдяки їй, прагнув об'єднати розрізнені народи у злагоді. Очолював його один з її найближчих соратників — Баттері.\n\nВін вірив, що зможе зробити краще для світу, в якому надто багато жахів для невинних. І він зробив це."
nf_blc_letters.0.a:0 "Почнемо."

#
nf_blc_letters.1.title:0 "Ненадійна робоча сила"
nf_blc_letters.1.desc:0 "Баттері,\n\nЯ не сумніваюся в тобі, шефе, але моя банда рейдерів — НЕ будівельна бригада! Ти що, з глузду з'їхав? Ти справді подумав, що це добра ідея? О, звісно — давай поставимо купку психів, які більше руйнують дороги, ніж лагодять, будувати інфраструктуру! Коли вони не вбивають когось іншого — вони вбивають один одного. А в цьому проєкті якось бракує вбивств. Я вже втратив дюжину людей через дурні сварки. Їхня кров — на ТВОЇХ руках, шефе. Ми не заб'ємо жодного цвяха, поки ти не даси нам рабів. І до біса твої моральні терзання.\n\n— Маллет МакБрайд"
nf_blc_letters.1.a:0 ""Нащо ти взагалі мені?""

#
nf_blc_letters.2.title:0 "Сільські дороги"
nf_blc_letters.2.desc:0 "Баттері,\n\nЗв'язок із зовнішнім світом приносить нам багатство, відкриває іншим наш спосіб життя та навертає їх до нашої віри. Це — лише благо для нашого союзу та торгівлі в регіоні. Твої зусилля як друга Розмальованих не залишились непоміченими. Ми сподіваємося на подальшу підтримку.\n\nНехай боги благословлять тебе, а Зачарований тебе оберігає."
nf_blc_letters.2.a:0 ""Це добре... чи не зовсім?""

#
nf_blc_letters.3.title:0 "(без теми)"
nf_blc_letters.3.desc:0 "Баттері,\n\nТоргівля йде добре. Дякую за полегшення справи.\n\n— Берхард"
nf_blc_letters.3.a:0 ""Він такий щасливий.""

#
nf_blc_letters.4.title:0 "Рабські майстерні"
nf_blc_letters.4.desc:0 "Баттері,\n\nЧудові новини! Ми перевиконуємо виробничі норми. Нові раби просто перевершують себе після того, як ми пов'язали їхні бомбошийники із сім'ями. Тепер якщо хтось тікає — страждає вся родина. О, ти б почув їхні крики — справжнє задоволення. А погрози — справжня поезія! Я навіть доклав список найкреативніших проклять, там є й кілька для тебе! Вражаюче, чесно.\n\nТреба визнати, шефе — я й не думав, що ти на таке здатен. Давай ще! Це найкраще, що ми робили.\n\n— Маллет МакБрайд"
nf_blc_letters.4.a:0 ""Схоже, я помилився...""

#
nf_blc_letters.5.title:0 "На священній землі"
nf_blc_letters.5.desc:0 "Баттері,\n\nЦя образа, що ти наробив — те, що ти назвав «фабрикою», — буде змита кров’ю. Мої воїни вже пошкодили ту наругу і завадять будь-яким спробам відновити її або будувати ще. Не кожна земля відкрита для твоїх будівель. Я попереджав, що будуть наслідки.\n\nНехай гнів богів впаде на тебе. Зачарований — буде захищеним."
nf_blc_letters.5.a:0 ""Ми ще покажемо йому...""

#
nf_blc_letters.6.title:0 "(без теми)"
nf_blc_letters.6.desc:0 "Баттері,\n\nРобота, яку ти приніс нашому народу, піде на благо Ямпану.\n\nДякую,\n\n— Берхард"
nf_blc_letters.6.a:0 ""Коротко і солодко...""

#
nf_blc_letters.7.title:0 "Без паніки"
nf_blc_letters.7.desc:0 "Баттері,\n\nШефе, е-е, виявилося, що давати рабам легкий доступ до зброї — не найкраща ідея. У нас було повстання. Але все вже під контролем, звісно! Довелося застосувати бомбошийники... деякі, виявляється, були несправні й вибухнули не на тих. Повна паніка. Втратили кількох своїх, але хто не витримав — і не заслуговував бути з нами.\n\nНадалі будемо обережніші, обіцяю. Нам просто потрібно трохи нових рабів. Хлопцям це сподобається.\n\n— Маллет МакБрайд"
nf_blc_letters.7.a:0 ""Огидно...""

#
nf_blc_letters.8.title:0 "Без минулого — немає майбутнього"
nf_blc_letters.8.desc:0 "Баттері,\n\nТвоє наполягання, аби наше плем’я зреклося священних звичаїв заради ефективності, почуте. Ми цього не зробимо. Наша броня — такої якості, якої ті, хто не прикрашається, не зрозуміють. Можливо, краще було б тобі прийняти наші звичаї. Тоді наші воїни будуть захищені й шкірою, і духами. Разом із листом я надіслав тобі комплект обладунку твого розміру. Я знаю твій розмір. У мене є очі й вуха скрізь."
nf_blc_letters.8.a:0 ""Гарний комплект, не сперечаюся...""

#
nf_blc_letters.9.title:0 "(без теми)"
nf_blc_letters.9.desc:0 "Баттері,\n\nДякую, що дозволив нам виготовляти більше зброї. Поділимося з тобою.\n\n— Берхард"
nf_blc_letters.9.a:0 ""Який турботливий.""

#
nf_blc_letters.10.title:0 "Борги банди"
nf_blc_letters.10.desc:0 "Зачарований не завжди був ватажком і шаманом Розмальованих. Колись його звали Пітер Бретт. Пітер був звичайним піхотинцем у банді Маллета МакБрайда, рейдерах з Тіббетса. Одного разу він вирушив у вилазку й отримав сім куль у груди. Його підібрали Розмальовані, сподіваючись, що він все одно помре. Але не помер. Його рани зцілилися підозріло швидко, наче духи його захищали. Зачарований стверджує, що його душа тоді померла, і її замінив древній шаман племені. Баттері ж вважає, що Пітер просто вправний промовець.\n\nКоли Маллет дізнався, що Пітер вижив і здобув вплив — він зрадів. Не через жаль чи любов, а тому, що це дало йому привід збільшити рейди на Розмальованих. Він сказав, що Пітер не заплатив «бандитський борг» за вихід із банди. Зачарований же наполягає, що Пітер мертвий, а отже претензії безпідставні. Це питання стало першим, яке мав вирішити Баттері."
nf_blc_letters.10.a:0 "Пітер мертвий."
nf_blc_letters.10.b:0 "Виживання Пітера — не виправдання для жорстокості."
nf_blc_letters.10.c:0 "Пітер живий, хай платить борг."

#
nf_blc_letters.11.title:0 "Старий пергамент"
nf_blc_letters.11.desc:0 "Баттері,\n\nТвоє рішення стало для нас великою допомогою. Дякуємо, що сказав правду тому нечестивому рейдеру. Пітер мертвий, щоб міг жити Зачарований. Тепер наш народ не буде більше терпіти стріли зла з боку того монстра. Не хвилюйся про майбутнє.\n\nТи — союзник мого народу, і я захищу тебе також."
nf_blc_letters.11.a:0 ""Захист не вічний...""

#
nf_blc_letters.12.title:0 "Старий лист"
nf_blc_letters.12.desc:0 "Баттері,\n\nДякую, що вибив із того виродка Пітера борг. Не хвилюйся, ми більше не будемо створювати проблем, якщо тільки справді не доведеться. На ті гроші, що ми зняли з його племені, ми купимо ще шість рабів у наступному каравані. Оце й є Рейдерономіка, шефе.\n\n— Маллет"
nf_blc_letters.12.a:0 ""Раби? О ні...""

#
nf_blc_letters.13.title:0 "Старий пергамент"
nf_blc_letters.13.desc:0 "Баттері,\n\nТе, що ти натякнув, ніби Пітер досі живий — це відверта наклеп. Я є Зачарований: я живу, а ім’я Пітера — мертве. Твої намагання заплямувати мою репутацію буде пробачено — як прояв незнання наших звичаїв.\n\nЯ щовечора молюся духам, що мене захищають, аби ти більше мене не підвів."
nf_blc_letters.13.a:0 ""Ідіот який...""

#
nf_blc_letters.14.title:0 "Старий лист"
nf_blc_letters.14.desc:0 "Баттері,\n\nНу навіщо ти такий зануда, га? Став на бік того виродка Пітера? Я не злий, я просто розчарований. Ми залишимо його в спокої — поки що. Але тобі справді варто позбутися того кілка в дупі. Він може тебе колись і вбити.\n\n— Маллет"
nf_blc_letters.14.a:0 ""Хоч не злий...""

#
nf_blc_letters.15.title:0 "Щодо Великого Табору"
nf_blc_letters.15.desc:0 "Одного дня Зачарований прийшов до Баттері з вимогою негайної уваги. Йому набридло, що питання Ямпанської конфедерації, яка живе на притоці Платт, ігнорують — попри те, що вони, за його словами, є загарбниками священних земель племені Розмальованих. Їхнє існування нагадує колоніалізм США до Великої Війни. Баттері, сам бувши племінником, розумів цю біль, але Ямпанський союз не прагне війни — вони лише хочуть миру, свободи і добробуту. Можливо, можна знайти компроміс..."
nf_blc_letters.15.a:0 "Ямпани покинуть Великий Табір, але не більше."
nf_blc_letters.15.b:0 "Ямпани виплатять компенсацію Розмальованим."
nf_blc_letters.15.c:0 "Ямпани заселили покинуті землі."

#
nf_blc_letters.16.title:0 "Стара телеграма"
nf_blc_letters.16.desc:0 "Баттері,\n\nДякую.\n\n— Берхард"
nf_blc_letters.16.a:0 ""Будь ласка...""

#
nf_blc_letters.17.title:0 "Старий пергамент"
nf_blc_letters.17.desc:0 "Баттері,\n\nТвоє визнання нашої законності — перший крок до світлого майбутнього для Розмальованих. Навіть якщо ти не зміг повністю вигнати загарбників, їх тепер менше, бо вони пішли вище по річці. Ти незмінно проявляєш себе як наш союзник, і ми тобі винні.\n\nЗачарований пам’ятає і друзів, і ворогів."
nf_blc_letters.17.a:0 ""Добре хоч задоволений...""

#
nf_blc_letters.18.title:0 "Стара телеграма"
nf_blc_letters.18.desc:0 "Баттері,\n\nНі, ми не будемо.\n\n— Берхард"
nf_blc_letters.18.a:0 ""І це все, що ти скажеш?""

#
nf_blc_letters.19.title:0 "Старий пергамент"
nf_blc_letters.19.desc:0 "Баттері,\n\nТи знову потураєш цим зайдам. Ми не проти їхнього існування — але, можливо, після того як ми приберемо рейдерів, ти міг би поселити їх у Тіббетській тюрмі? Вони матимуть своє місце, а ми — своє. Гідне покарання для нащадків Зірок і Смужок. Те, що ти запропонував, нічого не дає — лише робить їх зухвалішими.\n\nПодумай над цим."
nf_blc_letters.19.a:0 ""Трохи лицемірно, "Пітере"...""
#
nf_blc_letters.20.title:0 "Петиція Вільних Людей"
nf_blc_letters.20.desc:0 "Маллет МакБрайд отримав з рук кур’єра Ямпанської Конфедерації петицію про негайне звільнення всіх рабів, підписану багатьма членами Караванного Конгресу та кожним вільним дорослим Ямпану. Документ відомий як «Петиція Вільних Людей». Підпис Берхарда Ріверса стояв першим. Кур’єр повернувся з трьома менше пальцями, без одного ока й вуха, без носа і майже без зубів. У руці він тримав просту відповідь: “Поцілуй мою білу, прищаву дупу.”\n\nОчікуване каліцтво кур’єра й відмова стали глибокою образою Ямпану й особисто Берхарда. Сам Маллет наполягає, що дав петиції “ту повагу, яку вона заслужила.” Баттері просять виступити арбітром."
nf_blc_letters.20.a:0 "Ні — значить ні, Берхарде."
nf_blc_letters.20.b:0 "Вибачся за кур’єра, Маллете."
nf_blc_letters.20.c:0 "Підпиши петицію, Баттері."

#
nf_blc_letters.21.title:0 "Старий лист"
nf_blc_letters.21.desc:0 "Баттері,\n\nМи ж показали цим моралізаторам, га шефе? Завітай до Пенітенціарію якось, я підберу тобі дівку. Або хлопця. Ти ж дівчат поряд не тримаєш, я й не знаю, які сучки тобі до вподоби. Обіцяю, всі чистенькі. Наше майбутнє під твоїм керівництвом буде смачнюче.\n\n— Маллет"
nf_blc_letters.21.a:0 ""Мене зараз знудить.""

#
nf_blc_letters.22.title:0 "Стара телеграма"
nf_blc_letters.22.desc:0 "Баттері,\n\nТи справді ризикнув заради нас. Що б не трапилось — вода чи вогонь — я зроблю все, щоб ти завжди мав місце серед Ямпану.\n\n— Берхард"
nf_blc_letters.22.a:0 ""Та він говорить!""

#
nf_blc_letters.23.title:0 "Старий лист"
nf_blc_letters.23.desc:0 "Баттері,\n\nТи зараз справжній зануда, шефе. Раби — критично важливі для економіки та морального стану моїх хлопців. Хто, по-твоєму, має працювати, поки ми рейдимо? Ні, нам потрібні раби. Ти мусиш це зрозуміти, шефе.\n\n— Маллет"
nf_blc_letters.23.a:0 ""А рейди взагалі потрібні?""

#
nf_blc_letters.24.title:0 "Стара телеграма"
nf_blc_letters.24.desc:0 "Баттері,\n\nМаллет — зло. Більше не ставай на його бік.\n\n— Берхард"
nf_blc_letters.24.a:0 ""Наступне, що скажеш — риба плаває?""

#
nf_blc_letters.25.title:0 "Що роблять заради любові"
nf_blc_letters.25.desc:0 "Марісса Тиха-Хода — жінка з племені Розмальованих, яку Маллет захопив під час рейду. Вона певний час була «однією з його жінок», перш ніж утекла до Ямпану. Там вона зустріла іншу жінку й закохалась. Вони разом усиновили двох хлопчиків-близнюків і стали частиною громади.\n\nМаллет і Зачарований довідались про це й обидва вимагають її повернення. Маллет каже, що вона — його власність і не приймає жодних пропозицій викупу. Зачарований заявляє, що вона — член племені й має повернутись. Берхард наполягає, що вона — вільна жінка й сама приймає рішення. Всі звертаються до Баттері."
nf_blc_letters.25.a:0 "Марісса — власність Маллета."
nf_blc_letters.25.b:0 "Марісса — насамперед Розмальована."
nf_blc_letters.25.c:0 "Марісса сама приймає рішення."

#
nf_blc_letters.26.title:0 "Старий пергамент"
nf_blc_letters.26.desc:0 "Баттері,\n\nТи повернув вівцю до стада. Нехай духи захищають тебе завжди. Вона буде повторно інтегрована в наше суспільство й пройде повторне навчання. Незабаром вона знову стане нашою Маріссою.\n\nНехай духи охороняють Маріссу та її спасителя."
nf_blc_letters.26.a:0 ""Ще одна сестра врятована.""

#
nf_blc_letters.27.title:0 "Старий лист"
nf_blc_letters.27.desc:0 "Баттері,\n\nДякую за допомогу з тією втікачкою. Треба було зробити приклад. Додаю малюнок її страти, думаю, він тобі сподобається. Художник — талант! Мені вона подобалась, але... потрібно було послати меседж.\n\n— Маллет"
nf_blc_letters.27.a:0 ""Ти її навіть НЕ ХОТІВ?""

#
nf_blc_letters.28.title:0 "Стара телеграма"
nf_blc_letters.28.desc:0 "Баттері,\n\nТвоя відданість свободі заслуговує на повагу.\n\n— Берхард"
nf_blc_letters.28.a:0 ""Йому я подобаюсь, йому справді я подобаюсь.""

#
nf_blc_letters.29.title:0 "Старий пергамент"
nf_blc_letters.29.desc:0 "Баттері,\n\nТи — агент, що поступово знищує нашу культуру. Ти прирікаєш нас не на раптову смерть від вторгнення, а на повільну смерть, наче від радіації. Ти дозволив Ямпану перемогти сьогодні, але подумай серйозно про свою подальшу роль у цій державі.\n\nНехай духи захистять тебе від наслідків твоїх рішень."
nf_blc_letters.29.a:0 ""Пасивна агресія — твоє друге ім’я?""

#
nf_blc_letters.30.title:0 "Стара телеграма"
nf_blc_letters.30.desc:0 "Баттері,\n\nЯкби вона хотіла повернутись — то повернулась би.\n\n— Берхард"
nf_blc_letters.30.a:0 ""... Має рацію.""

#
nf_blc_letters.31.title:0 "Старий пергамент"
nf_blc_letters.31.desc:0 "Баттері,\n\nЦе — зневага. Як ти смів поневолити члена нашого племені? Може, чутки правдиві — і ти просто чергова банда рейдерів.\n\nЯ захищу свій народ від тебе."
nf_blc_letters.31.a:0 ""Ай, боляче.""

#
nf_blc_letters.32.title:0 "Стара телеграма"
nf_blc_letters.32.desc:0 "Баттері,\n\nЯк ти посмів?"
nf_blc_letters.32.a:0 ""Занадто злий, щоб навіть підписатись...""

#
nf_blc_letters.33.title:0 "Старий лист"
nf_blc_letters.33.desc:0 "Баттері,\n\nТа ну тебе, шефе! Це була моя найкраща дівчина! Жодна з інших навіть близько не зрівняється. Втрата майна, яку неможливо замінити. Одного дня ви всі за це заплатите.\n\n— Маллет"
nf_blc_letters.33.a:0 ""Переживеш.""

#
nf_blc_letters.34.title:0 "Бути ближче"
nf_blc_letters.34.desc:0 "Баттері,\n\nДякую за ідею, шефе, і за те, що став на мій бік проти Пітера. Він прикидається, ніби має якісь там предківські права на землю, але насправді просто використовує їхню культуру, бо йому так вигідно. Сьогодні йому вигідно було просто бути занозою.\n\n— Маллет"
nf_blc_letters.34.a:0 ""Мені сподобалась ця ідея.""

#
nf_blc_letters.35.title:0 "Ще одна жахлива помилка"
nf_blc_letters.35.desc:0 "Баттері,\n\nТи знову загрожуєш способу життя Розмальованих. Дивно, що духи досі не вразили тебе. Сподіваюся, ти встигнеш усвідомити свою помилку до того, як вони це зроблять. Заради всіх у Чорному Каньйоні.\n\nТвоє падіння буде як метеор із неба, але я вбережу наш народ від твого вогняного сліду."
nf_blc_letters.35.a:0 ""О, не драматизуй.""

#
nf_blc_letters.36.title:0 "Справді?"
nf_blc_letters.36.desc:0 "Баттері,\n\nШефе, що ти робиш, блін?! Ти просто граєш на руку культу цього Пітера-афериста. Я думав, ти розумніший. Хто ти взагалі? Кого я підтримую?\n\n— Маллет"
nf_blc_letters.36.a:0 ""Крок назад, щоб зробити два вперед.""

#
nf_blc_letters.37.title:0 "Повага до поваги"
nf_blc_letters.37.desc:0 "Баттері,\n\nТи мудро вирішив стати на наш бік, щоб зберегти спосіб життя Розмальованих. Ти справжній друг нашого народу. Ти завжди матимеш місце серед нас, коли цей експеримент завершиться.\n\nМи оберігатимемо тебе, коли все закінчиться."
nf_blc_letters.37.a:0 ""Я зробив це лише щоб запобігти повстанню.""

#
nf_blc_letters.38.title:0 "Послуга за послугу"
nf_blc_letters.38.desc:0 "Баттері,\n\nЗавдяки тобі, шефе, ми відкрили власну зброярню прямо в Пенітенціарії. Раби тут знають, що бунтувати не варто, тож усе йде чудово. Ми отримаємо великі речі з цього заводу, побачиш.\n\n— Маллет"
nf_blc_letters.38.a:0 ""Нам справді потрібна військова спроможність...""

#
nf_blc_letters.39.title:0 "Щодо: Інтервенція в стилі Пустки"
nf_blc_letters.39.desc:0 "Баттері,\n\nЯ бачу тебе, рабовласнику.\n\n— Берхард"
nf_blc_letters.39.a:0 ""Я не маю рабів!""

#
nf_blc_letters.40.title:0 "Щодо: Інтервенція в стилі Пустки"
nf_blc_letters.40.desc:0 "Баттері,\n\nЦя фабрика шитиме зимові куртки.\n\n— Берхард"
nf_blc_letters.40.a:0 ""Я люблю зимові куртки!""

#
nf_blc_letters.41.title:0 "Ти дурень?"
nf_blc_letters.41.desc:0 "Баттері,\n\nШефе, не розумію тебе. Скаржишся, що бракує зброї, а потім відмовляєшся щось із цим робити. Сподіваюсь, що ти пригадаєш цю мить кожного разу, як програємо бій.\n\n— Маллет"
nf_blc_letters.41.a:0 ""Гармати — не все.""

#
nf_blc_letters.42.title:0 "Щодо: Дослідження й розбіжності"
nf_blc_letters.42.desc:0 "Баттері,\n\nНе переймайся. Ми зробимо щось ще краще для цієї нації.\n\n— Берхард"
nf_blc_letters.42.a:0 ""Я очікую великих речей.""

#
nf_blc_letters.43.title:0 "Сліпі ведуть сліпих"
nf_blc_letters.43.desc:0 "Баттері,\n\nНашим воїнам не потрібна зброя, що плюється вогнем, щоб убивати. Ми прийдемо вночі та перережемо горло, не розбудивши. Можемо продемонструвати, чому наші методи кращі.\n\nКулі більше не мають сили, коли духи захищають нас від їхнього жалу."
nf_blc_letters.43.a:0 ""Можемо перевірити цю теорію, якщо хочеш.""

#
nf_blc_letters.44.title:0 "З уроків минулого"
nf_blc_letters.44.desc:0 "Баттері,\n\nТи зробив правильний вибір. Коли ворог побачить наші бойові порядки зі списами та щитами, захищені духами від їхніх куль — він здригнеться.\n\nДухи оберігатимуть нас."
nf_blc_letters.44.a:0 ""Це ж працює в Легіону...""

#
nf_blc_letters.45.title:0 "Щодо: Дослідження й розбіжності"
nf_blc_letters.45.desc:0 "Баттері,\n\nНе чекай, що я проміняю гвинтівку на спис. Це ж крок назад.\n\n— Берхард"
nf_blc_letters.45.a:0 ""Сподіваюсь, у тебе вистачить набоїв.""

#
nf_blc_letters.46.title:0 "Честь серед рейдерів"
nf_blc_letters.46.desc:0 "Баттері,\n\nДякуємо за допомогу, шефе. Побачиш — ми вправні ловці злочинців. Своїх впізнаємо. З нами викрадення та крадіжки зникнуть миттєво. Ми просто неймовірні. Дякую за можливість.\n\n— Маллет"
nf_blc_letters.46.a:0 ""Він мене надурив...""

#
nf_blc_letters.47.title:0 "Щодо: Озброєння"
nf_blc_letters.47.desc:0 "Баттері,\n\nДякую, що захистив нас.\n\n— Берхард"
nf_blc_letters.47.a:0 ""Я просто допоміг вам самим себе захистити...""

#
nf_blc_letters.48.title:0 "Шляхетні, не дикуни"
nf_blc_letters.48.desc:0 "Баттері,\n\nІнші вважають нас не більше, ніж відсталими дикунами. Ми доведемо протилежне. Моя Розмальована Військова Дружина буде захищати Ямпанів як духовно, так і фізично — й усі побачать, наскільки ми шляхетні, і як наші звичаї переважають їхні.\n\nЗ моєю допомогою навіть язичники можуть бути Відміченими."
nf_blc_letters.48.a:0 ""Перестань бути таким самовпевненим.""

#
nf_blc_letters.49.title:0 "Де твоя Мерит-о-кратія?"
nf_blc_letters.49.desc:0 "Баттері,\n\nЯ не впевнений щодо цього рішення. Якщо ти просто дозволиш Ямпанам рости й рости — очевидно, що вони не можуть самі себе захистити. Коли наступного разу прийдуть плакатися, ти знатимеш, кого поставити на цю справу.\n\n— Маллет"
nf_blc_letters.49.a:0 ""Я не наймаю злодія, щоб ловити злодія.""

#
nf_blc_letters.50.title:0 "Щодо: Озброєння"
nf_blc_letters.50.desc:0 "Баттері,\n\nМи здатні захистити себе. Можу продемонструвати, якщо хочеш.\n\n— Берхард"
nf_blc_letters.50.a:0 ""Не треба, це було найкращим варіантом.""

#
nf_blc_letters.51.title:0 "Дикуни, дикуни, чи взагалі вони люди?"
nf_blc_letters.51.desc:0 "Баттері,\n\nІнші вважають нас не більше, ніж відсталими дикунами. Але ж ми ніколи не отримаємо шансу довести зворотне, якщо нам не дозволяють діяти. Заради взаємоповаги між нашими фракціями ти мав дозволити нам допомогти як зацікавленій третій стороні — так було б більш неупереджено.\n\nМи б Відмітили їх, як своїх."
nf_blc_letters.51.a:0 ""Не лізь у чужі справи, Пітер.""

  #
  #nf_blc_letters.52.title:0 "Death of Quick Asp"
  #nf_blc_letters.52.desc:0 "The death of Quick Asp was sudden, but not unexpected. He was old, and every man has his time. With his death comes the second free election in the history of the Painted Men Tribe for chief. There are two primary candidates for Chief-shaman."
  #nf_blc_letters.52.a:0 ""Rest in peace, and thank you for your work.""
  #
  #nf_blc_letters.53.title:0 "Death of Koda Rivers"
  #nf_blc_letters.53.desc:0 "The death of Koda Rivers has rocked the community. With Bearhard and his brothers announcing publicly that they would not be running for office, for the first time in almost 5 decades a non Rivers family mayor is going to be elected in the town of Medicince. Not only this, but with Medicine being by far the largest settlements in Yampan it will mean a new governor for the region as a whole. There are two major candidates expected to win this election."
  #nf_blc_letters.53.a:0 ""Rest in peace, may they bite better in the Heavens.""
nf_blc_beacons.1.title:0 "Приведений кінь до води"
nf_blc_beacons.1.desc:0 "На північ від нас лежить географічний регіон, відомий лише за старими мапами як «Басейн Вайомінгу». Хоча, більшість з нас називає його просто «Маленький Вайомінг» або «Суїтвотер», за назвою річки, що тече з півночі.\n\nНа цих землях існують дві нації, що постійно сваряться між собою відколи наші перші розвідники зустріли їхні сили — [PRO.GetNameWithFlag] та [SIE.GetNameWithFlag]. Перші — це група примітивних «кротових шахтарів», здичавілі гульи з манією копання. Саме вони є агресорами в цій історії, часто здійснюючи нальоти на міста [SIE.GetNameWithFlag] із незрозумілих причин. Натомість, другі — загартовані пастухи брамінів і нащадки Перших Людей Вайомінгу, що просто хочуть, аби їх залишили в спокої.\n\nХаос у цьому регіоні, як і наші внутрішні проблеми, не дозволили нам втрутитися — хоча ми й вважали цей регіон частиною нашої сфери інтересів. Річка Суїтвотер є ідеальним природним кордоном нашої нації, а в землях знаходяться цінні ресурси, які ми могли б використати.\n\nТепер, коли локальний конфлікт успішно завершено, ми можемо нарешті висунути свої вимоги спадкоємцям і реорганізувати регіон на власний розсуд."
nf_blc_beacons.1.a:0 "Ми повинні втрутитися, щоб стабілізувати ситуацію!"

#
nf_blc_beacons.11.title:0 "«Непереборна» пропозиція"
nf_blc_beacons.11.desc:0 "Ми щойно пережили найкривавіший напад за всю нашу історію, і не встигли ще глибоко вдихнути, як знову на нас насідають. Люди з [BLC.GetName] надіслали до нас гінця, привітали з перемогою й висловили побажання, щоб наша «зміцнена позиція дозволила поглибити взаємно теплі зв’язки між нашими народами». Вони готові «оживити» торгівлю між нашими столицями та «надати додаткове фінансування» для «розвитку ремісничого сектору», якщо ми «налаштовані» «узгодити зовнішню політику» задля «вищого рівня співпраці та представництва».\n\nПеречитавши повідомлення кілька разів, ми зрозуміли, що вони хочуть нашого підкорення — але готові добре за це заплатити. І хоча це було б принизливо, нам справді не завадить трохи більше грошей і захисту від когось... «наполегливішого». От така вона, ця дипломатія, чи не так?"
nf_blc_beacons.11.a:0 "Ми нічого не втрачаємо — тільки виграємо!"
nf_blc_beacons.11.b:0 "Та ну вас до біса!"

#
nf_blc_beacons.12.title:0 "Остання частина ультиматуму"
nf_blc_beacons.12.desc:0 "Мабуть, ми переоцінили інтелект наших колег, оскільки вони відкинули нашу щедру пропозицію. Ну що ж, не всіх можна переконати. Уперті й повільні учні просто потребують більше... уваги та суворішого навчального методу."
nf_blc_beacons.12.a:0 "Пора дати їм урок."

#
nf_blc_beacons.2.title:0 "Повідомлення з-під землі"
nf_blc_beacons.2.desc:0 "TODO"
nf_blc_beacons.2.a:0 "- Послухаємо, що вона має сказати."

#
nf_blc_beacons.3.title:0 "Кроти з бомбами"
nf_blc_beacons.3.desc:0 "Поблизу В’язниці існує буквальний адський провал — його мешканці називають його Молтаун. Кротові шахтарі з Фар Сона, що з невідомих причин залишили свої рідні печери, та дезертири з наших лав облаштувалися в покинутому ядерному бункері. Озброєні до зубів вибухівкою, ймовірно, здобутою від «Золотошукачів» з Джорджтауна, Кроти є серйозною загрозою. На щастя, вони рідко залишають свій зліплений з брухту притулок, але нещодавно знову почали здійснювати набіги.\n\nЦе має припинитися. Ми покінчимо з цією проблемою раз і назавжди."
nf_blc_beacons.3.a:0 "Ми маємо завдання для Маллета..."

#
nf_blc_beacons.31.title:0 "Порох був надто сухим..."
nf_blc_beacons.31.desc:0 "Один зі складів нашої місцевої збройної майстерні зазнав прямого влучання динамітної палички з написом «МОLE». У цих складах зазвичай зберігаються лише металобрухт, труби та інструменти. Ми не тільки не знаємо, як там опинився порох, а й не розуміємо, чому Кроти вирішили підірвати його, а не використати для себе."
nf_blc_beacons.31.a:0 "Вони за це заплатять."

#
nf_blc_beacons.32.title:0 "Дика іскра"
nf_blc_beacons.32.desc:0 "Більшість наших виробничих об’єктів, зокрема з виробництва будматеріалів, суворо дотримуються норм безпеки. Проте хтось, вочевидь, курив поруч із критичними запасами для виробництва цегли, і тепер у нас у даху дірка, якої не було в початкових кресленнях. Ми й не підозрювали, що тюки сіна й глини можуть бути вибухонебезпечними!"
nf_blc_beacons.32.a:0 "Посилити техніку безпеки."

#
nf_blc_beacons.33.title:0 "Кротові вибоїни"
nf_blc_beacons.33.desc:0 "Наша країна цінує кожну каравану, що доставляє нам необхідні товари, як-от мило. Тож коли одна з них зникла — ми занепокоїлися. Пошукова експедиція, на щастя, виявила браміновий фургон біля нашої головної дороги. Вибоїна розміром із каналізаційний люк здатна серйозно пошкодити і колеса, і копита. Операція «Шторка для душу» пройшла успішно, на щастя."
nf_blc_beacons.33.a:0 "Американські дороги... дороги не змінюються."

  #
  #nf_blc_beacons.4.title:0 "Lunar Movements"
  #nf_blc_beacons.4.desc:0 "Our western neighbour has suspiciously all of a sudden gone quiet. Ouroboros is a nation forged on revenge, and its leader, Hecate, has aspirations and tactics that are not secret before us. Their recent conquests made us wary, but we trusted that they would not try to turn against us.\n\nBut something happened, some internal conflict caught aflame and right now, we cannot expect what will happen in the near future. Heads will fall - and based on whose, we'll have to ready ourselves for war or stand our ground."
  #nf_blc_beacons.4.a:0 "We'll obeserve our Lunar calendars througfully..."
  #nf_blc_beacons.4_tt:0 "The §YLunar Eclipse§! and §YHowling at the Moon§! focuses will be unlocked to choose from."
#
nf_blc_beacons.5.title:0 "Порохова бочка спалахнула!"
nf_blc_beacons.5.desc:0 "Знову — гуль проти людини. Неминуча, хоч і прикра, серія непорозумінь переросла у повноцінну війну в пороховій бочці Колорадо. Експедиція НКР у регіоні намагається розширити свої претензії з кінцевою метою заволодіти Куполом Боулдера, тоді як гулі прагнуть поширити свою владу.\n\nБеттері вирішив, що ми не можемо залишатися осторонь. Для довгострокової безпеки в регіоні необхідно забезпечити перемогу «правильної» сторони та стримати північноколорадських гулів. Очевидним вибором для цього є підтримка Баггерів. Чи будемо ми надавати їм реальну допомогу — ще питання, але одне ясно: ми спостерігаємо, як перед нашими очима розгортається доля цього регіону."
nf_blc_beacons.5.a:0 "Миру ніколи й не було."
nf_blc_beacons.5.a_tt:0 "§Y[LUM.GetName]§!, §Y[WHD.GetName]§! та §Y[BAG.GetName]§! оголосять війну одне одному!"

#
nf_blc_beacons.51.title:0 "Тривожна пропозиція з Чорного Каньйону"
nf_blc_beacons.51.desc:0 "Караванний Конгрес Чорного Каньйону простягнув руку, сповнену обіцянок підтримки та співпраці. Вони пропонують трансформувати Баггерів у «Наукову адміністрацію Куполу Боулдера». У межах цієї структури ресурси, експертиза та захист будуть доступні... за високу ціну. Баггери повинні будуть повністю розірвати контакти з НКР, відмовитися від будь-яких старих союзів. Це не пропозиція — це вимога підкорення, окутана в оксамитові рукавички.\n\nВибір очевидний: або прийняти владу Чорного Каньйону й забути минуле, або відмовитися — і залишитися сам на сам із невблаганними тінями Куполу."
nf_blc_beacons.51.a:0 "Впустіть нас уже!"
nf_blc_beacons.51.b:0 "Ніколи!"
nf_blc_beacons.51.become_puppet_of_blc:0 "§RМи станемо маріонеткою Чорного Каньйону!§!"
nf_blc_beacons.51.black_canyon_wont_like_this:0 "§RЧорному Каньйону це не сподобається, і він почне готувати вторгнення!§!"
bag_end_of_the_line_tt:0 "\n§gТи знаходиш листівку, залишену Патчем, Світлим Гулем Глоубагів — він пише про жарт, який почув від якогось «дизайнера»:\n\"‘Тут більше немає контенту’... Що це за жарт такий? І що мені з цим punchline робити?\"§!"

#
nf_blc_beacons.52.title:0 "Наказ"
nf_blc_beacons.52.desc:0 "Пил осів над Північним Колорадо. Гулі знищили експедицію НКР. Це тривожний розвиток подій для Беттері та безпеки Чорного Каньйону. Розуміючи, що наразі лише гульське управління здатне утримати порядок у регіоні, ми маємо звернутися до наших союзників — Глоубагів. Вони зможуть втримати цю землю. Вони повинні забезпечити порядок, інакше ми втратимо наш щит від Хангдогів та інших небезпек Колорадо.\n\nМи відправимо [GLW.GetName] чітке послання: встановіть порядок на півночі, або втратите нашу підтримку й торгівлю. Звісно, Беттері підтримає Глоубагів у цьому."
nf_blc_beacons.52.a:0 "Це правильно."

#
nf_blc_beacons.6.title:0 "Безкінечний жаль зневаженого племені"
nf_blc_beacons.6.desc.1:0 "Плем’я Матерів-Близнючок лежить у руїнах, їхня богиня Діана — вигнана у темряву нищівним наступом М’ясника Сходу, Ланія. Над розграбованими святинями тепер висять прапори Бика, а колись священні землі відлунюють криками розірваного народу. Після цієї різанини Діана, фігура з міфів і шепоту, сховалася в глибинах своєї цитаделі — її божественна скорбота обернулася на гнів.\n\nРозсадник, довоєнний притулок на межі нашої сфери впливу, знову ожив. З його стін лунають відлуння голосу Діани — пісня про серце, розбите втратою, і племінну лють. Її скорбота стала закликом до зброї. Вцілілі з Матерів-Близнючок зібралися під її невидимим проводом, з луками й списами в руках, очі їхні звернені на родючі землі Чорного Каньйону. Вони більше не хочуть дипломатії. Вони не прагнуть порозуміння. Вони хочуть нового дому, здобутого силою.\n\nБеттері стоїть перед суворою реальністю. Миру з Діаною не буде, як і переговорів. Її народ марширує вперед з люттю вигнаних, а сама вона — лиш тінь, що веде дітей з глибин Розсадника. Тепер Чорний Каньйон має готуватись. Зміцнити мури, укріпити союзи, підготувати кожного, хто здатен тримати зброю. Бо коли посиплються стріли — пощади не буде."
nf_blc_beacons.6.a:0 "Беттері надсилає листа — благає про мир!"

#
nf_blc_beacons.6.desc.2:0 "Плем’я Матерів-Близнючок розпалося, святині їхні знищені, а люди — розсіяні після жорстокої поразки від Ланія, Звіра зі Сходу. Їхня богиня Діана все ще перебуває в глибинах Розсадника, її голос — лише слабке мерехтіння на дротах. Вцілілі, в шкіряних одягах і з блідими півмісяцями на тілі, тепер тихо просуваються до околиць Парадайзу.\n\nЦі біженці не приходять з криками чи зброєю. Вони рухаються як поранені звірі — мовчазно, обережно. Вони майже нічого не просять, але сама їхня присутність — це немов запитання без відповіді. Хтось бачить у них душі, що потребують допомоги. Інші — потенційну загрозу.\n\nУ Караванному Конгресі зростає занепокоєння. Скептики попереджають, що поселення біженців поруч із Парадайзом може підірвати хиткий порядок, якого так важко досяг Беттері. Інші бояться, що це розлютить Легіон Цезаря. Адже ці люди — вижилі після ярості Бика, і будь-яка допомога їм може розцінюватися як зневага.\n\nБеттері стоїть перед вибором. Він може допомогти, ризикуючи викликати гнів Легіону — або ж вигнати біженців і посилити контроль над Парадайзом. Десь там, у надрах Розсадника, Діана спостерігає. Її голос тихий, але вона чує все."
nf_blc_beacons.6.b1:0 "Беттері надсилає допомогу. Їм тут раді!"
nf_blc_beacons.6.b2:0 "Беттері слухає Конгрес — біженцям тут не місце!"

#
nf_blc_beacons.61.title:0 "Відчайдушне благання"
nf_blc_beacons.61.desc:0 "Повідомлення було довірене одному єдиному члену племені Матерів-Близнючок — змученій душі, виснаженій нескінченною подорожжю через безжальні Скелясті гори. В їхніх потрісканих долонях лежала пропозиція Беттері — конверт, просочений потом і пилом, з наповненими відчаєм словами. Вони дісталися порогу Розсадника, де один із Вартових, велетенський релікт довоєнної інженерії, стояв нерухомо. Тремтячими пальцями племінник підніс листа до священних сканерів Вартового, аби його холодні, немигаючі об’єктиви змогли прочитати вміст.\n\nЦе не була вимога, не була й погроза — це було благання. Беттері розповідав про початки Чорного Каньйону, про жертви, принесені разом із В'язнем 13, щоб витворити крихкий прихисток у пустці. Він писав про їхню спільну мрію — мрію про спадщину і стабільність, про місце, де люди зможуть стояти гордо під розбитим небом. І він писав про В'язня 13 — про те, як розбилося б його серце, побачивши, на що перетворилися люди Діани, яких нині веде лише біль і жага помсти.\n\nТа все було марно. Слова Беттері, хоч і сповнені відчаю, не змогли зупинити хвилю скорботи, яка поглинула Діану. В іншому світі, можливо, Діана й Беттері були б союзниками — навіть друзями. Але той світ втрачено, поховано під попелом і кров’ю. Тепер залишилась лише богиня, з’їдена горем, плем’я на межі зникнення, і дім, який має бути відвойовано будь-якою ціною.\nЖоден лист, жодне благання, жодна спільна історія не змінять цього."
nf_blc_beacons.61.a:0 "§MBattery could never understand what I feel.§!"

#
nf_blc_beacons.611.title:0 "Подарунки з Чорного Каньйону"
nf_blc_beacons.611.desc:0 "Караван прибуває до краю Парадайзу, брагміни нав’ючені ящиками з зерном, чистою водою і ліками, загорнутими в грубе мішковинне полотно. Супроводжує вантаж акуратно складений лист, запечатаний сургучем з печаткою Чорного Каньйону. Слова всередині обережні, написані впевненою рукою Беттері. Він говорить про розуміння — про труднощі, про втрати і довгий шлях відновлення після руйнувань. Припаси, пише він, даруються безкоштовно — жест доброї волі від одного вижилого до іншого. І водночас між рядками тече тихе прохання: надія, що Близнючі Матері побачать у Чорному Каньйоні не ворога, а сусіда, якому варто довіряти у ці непевні часи."
nf_blc_beacons.611.a:0 "Можливо, довіра народжується з доброти."

#
nf_blc_beacons.612.title:0 "Вимога з Великого Шапіто"
nf_blc_beacons.612.desc:0 "Закурений кур’єр прибуває до околиць Парадайзу, несучи сувій, перев’язаний грубою мотузкою й позначений символом Караванної Ради. Повідомлення прямолінійне, з гострою і діловою мовою. Землі навколо Парадайзу, йдеться в ньому, є частиною законної території Чорного Каньйону та Караванної Ради. Присутність біженців із племені Матерів-Близнючок, хоч і зрозуміла в своїй трагедії, не може бути проігнорована. Їм ввічливо — але твердо — наказано залишити територію й оселитися в іншому місці. У словах немає відкритої погрози, але тінь наслідків читається в кожному згині пергаменту. Кур’єр терпляче чекає відповіді, обличчя його зберігає нейтральний вираз."
nf_blc_beacons.612.a:0 "Хиткий мир на волосині."

#
nf_blc_beacons.62.title:0 "Відповідь Діани"
nf_blc_beacons.62.desc:0 "Вартовий — гігантський Сентрі-бот, пофарбований у вицвілі зелені кольори та вкритий ледь помітними племінними візерунками, посланник Богині Діани — впевнено вкотився до Великого Шапіто. Його гусениці рвали потріскану землю, звук лунко розходився по залі, охоронці нервово стискали зброю, а члени конгресу миттєво замовкли.\n\nРобот зупинився в центрі зали, і з гучномовця пролунав голос Діани — холодний, проте скорботний, зловісно ясний: §B\"Я — Богиня Діана, і ви не зможете збагнути, як я тужу. Мої храми лежать у попелі, мій народ у кайданах, а моя спадщина розтоптана під п’ятою Ланія. Усе, що я любила, було в мене відібране. Ваші землі мають стати новим домом для мого народу — іншого шляху немає. З часом ви зрозумієте мою любов.\"§!\n\nЩойно останні слова стихли, тіло Вартового почало видавати низьке гудіння — металевий корпус тремтів від внутрішньої напруги. З боків зашипів дим, системи перегрівались і скреготіли. Паніка охопила залу, члени конгресу кинулися до виходів, кричали накази, перекидали меблі в хаосі. За секунди корпус вибухнув — спалах і рев полум’я знищили все довкола. Від Вартового лишились лише обвуглені уламки.\nПослання Діани було доставлене. Її гнів залишив слід."
nf_blc_beacons.62.a:0 "Боже, поможи нам!"
#
#nf_blc_beacons.63.title:0 "From the Garden to the Canyon"
#nf_blc_beacons.63.desc:0 "Diana has maintained her great wisdom through the tribulations Lanius has put the Twin Mothers through. She has accepted our demands and sworn loyalty to Battery and Black Canyon."
#nf_blc_beacons.63.a:0 "A rare act of peace."
#
nf_blc_beacons.7.title:0 "Ще один день в офісі"
nf_blc_beacons.7.desc:0 "Саме так це й відчував Беттері. Ось він, займається різними нудними справами. Читає листи, стогне над петиціями, метушиться з доповідями.\n\nАле 2278-й точно не мав бути просто ще одним роком. Ні, 2278-й — це коли Беттері нарешті вирішив взятися за ті проблеми, що роз’їдали його дивну маленьку державу. Різні групи, які він зібрав разом, увесь цей час жили привілейовано, насолоджувались свободами, вигодами і прибутками від стабільності, яку приніс Караван.\n\nВони ніколи не досягнуть справжніх змін, якщо все залишиться як є. Треба діяти. Привілеї — обмежити, закони — ухвалити, централізацію — здійснити. Це буде справжня боротьба, і Беттері або наживе багато друзів, або багато ворогів. Але він вирішив: ця земля має стати чимось значущим, і цей рік буде його роком."
nf_blc_beacons.7.a:0 "Час братись до роботи."

