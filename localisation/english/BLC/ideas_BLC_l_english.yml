l_english:
  ### IDEAS
#Starting Ideas
blc_caravan_13:0 "Вплив Каравану 13"
blc_caravan_13_desc:0 "Караван як досвідчений та неупереджений орган влади був прийнятий з відкритими обіймами. Хоча їм вдається координувати фракції Каньйону, їхній постійно зростаючий вплив рано чи пізно може перетворити союзників на ворогів...\n\n§yВплив Каравану 13:§!\n  §WПоточний Вплив:§! §Y[BlackCanyonInfluence]§!\n§g  Вплив Каравану на політику\n  держави дає наступні переваги:§!\n  §WЩоденний приріст Політичної Влади:§! [BCInfluence_PP]\n  §WСтабільність:§! [BCInfluence_WS]\n\n§yСтабільність Республіки:§!\n  §WСтан Республіки:§! [BLC_Stability]\n  §gЯкщо популярність будь-якої фракції, крім §3Караванного Конгресу§!, підніметься вище §R40§! або впаде нижче §R15§! без попереднього обмеження їхнього §YВпливу§!, почнеться §YМісія§! з результатом у вигляді §Rгромадянської війни§!\n  §WПлемінна Рада:§! [BLC_Pacification_Tribal]\n  §WГільдія Торговців:§! [BLC_Pacification_Settler]\n  §WКлік Маллета:§! [BLC_Pacification_Raider]"

caravan_13_dynamic_modifier:0 "Вплив Каравану 13"
paradise_state_modifier:0 "Заборонений Храм"
paradise_state_modifier_desc:0 "§gМісцеві племена вважають цей регіон священним місцем, і тому ми не можемо використовувати його для промислового розвитку чи набору новобранців.§!"

boulder_state_modifier:0 "Радіаційне Місто"
boulder_state_modifier_desc:0 "§gКам'яне Місто, Боулдер-Сіті, було сильно обстріляне під час Великої Війни. Впливовий науковий центр, відомий як 'Купол', зробив його ціллю. Радіація досі зберігається на його вулицях, і хоча місцеві гульи звикли до неї, це суттєво обмежує будь-яку масштабну діяльність.§!"

boulder_state_GLW_modifier:0 "Місто Каменю в Руїнах"
boulder_state_GLW_modifier_desc:0 "§gБоулдер-Сіті було сильно обстріляне під час Великої Війни. Хоча нас це не хвилює, велика кількість уламків робить будь-який розвиток справжнім кошмаром.§!"

boulder_state_GLW_modifier_2:0 "Відбудоване Кам’яне Місто"
boulder_state_GLW_modifier_2_desc:0 "§gМи розчистили вузькі вулиці й стратегічно перемістили ядерні відходи так, що тепер це більше не проблема для нас. Але це буде справжній головний біль для кожного, хто спробує взяти місто в облогу.§!"

painted_men_state_modifier:0 "Племінне Завзяття"
painted_men_bad_state_modifier:0 "Племінний Опір"

blc_occupation_of_boulder:0 "Ресурсний Податок з Глоубагів"
blc_occupation_of_boulder_desc:0 "Визначено договором у Коллінсі, Глоубаги надсилають нам данину в обмін на захист і розвиток. Чи це справедливо — питання дискусійне.\n\n§yТягар Глоубагів:§!\n §gЧерез свою зростаючу залежність від нас, Глоубаги сплачують податок у вигляді:§!\n [BLC_CAPS_TT]\n [BLC_METAL_TT]\n [BLC_COMPOSITES_TT]\n [BLC_ADVANCED_TT]\n [BLC_IFD_DONATIONS_TT]\n [BLC_MFD_DONATIONS_TT]"

treaty_of_williams_BLC_dynamic_modifier:0 "Ресурсний Податок з Глоубагів"

#Judgement Ideas
blc_caravan_espionage:0 "Срібні Язики Каравану"
blc_caravan_espionage_desc:0 "Кожна людина — це актив, і кожен актив слід використовувати за його найкращим призначенням. Виходячи з цього принципу, 'Срібні Язики' — це представники Каравану з надзвичайною харизмою."

blc_rearmament_idea:0 "Зусилля по Переозброєнню"
blc_rearmament_idea_desc:0 "Потрібно відбудувати все, що було зруйновано, і зробити це ще краще."

#Trade Ideas
blc_idea_mormon_mission:0 "Мормонська Місія"
blc_idea_mormon_mission_desc:0 "Місія з [NCN.GetName] перебуває в нашій країні, певною мірою впливаючи на нашу політику через спроби навернення населення."

blc_wyoming_trade_wyr:0 "Торгівля з Вайомінцями"
blc_wyoming_trade_wyr_desc:0 "Сільськогосподарська продукція та базові інструменти — речі, яких нам конче бракує. Забезпечення стабільного надлишку таких товарів зменшить потребу у власному виробництві та полегшить тиск на нашу промисловість."

blc_wyoming_trade_kha:0 "Торгівля з Вайомінцями"
blc_wyoming_trade_kha_desc:0 "Сільськогосподарська продукція та базові інструменти — речі, яких нам конче бракує. Забезпечення стабільного надлишку таких товарів зменшить потребу у власному виробництві та полегшить тиск на нашу промисловість."

blc_reverse_wyoming_trade:0 "Торгівля з Колорадцями"
blc_reverse_wyoming_trade_desc:0 "Наш більш розвинений сусід має промисловість і технічні знання, яких нам бракує. Ми можемо придбати у них необхідні ресурси для розвитку за цілком прийнятною ціною!"

#Politics Ideas
blc_divided_political_scene1:0 "Поділена Політична Сцена"
blc_divided_political_scene1_desc:0 "Поки учасники Зборів сперечаються через незначні та випадкові проблеми, нам буде важко ефективно впроваджувати демократію на наших землях."

blc_divided_political_scene2:0 "Поділена Політична Сцена"
blc_divided_political_scene2_desc:0 "Поки учасники Зборів сперечаються через незначні та випадкові проблеми, нам буде важко ефективно впроваджувати демократію на наших землях."

blc_divided_political_scene3:0 "Поділена Політична Сцена"
blc_divided_political_scene3_desc:0 "Поки учасники Зборів сперечаються через незначні та випадкові проблеми, нам буде важко ефективно впроваджувати демократію на наших землях."

blc_shunned_society:0 "Зневажене Суспільство"
blc_shunned_society_desc:0 "Милосердя — це меч із двома лезами, навіть у найнесподіваніших формах. Уклавши угоду з місцевими бандами рейдерів, Чорний Каньйон зробив так, що всі навколишні держави повірили — ми такі ж, як і вони. Усі зв’язки були розірвані. Нам доведеться важко попрацювати, щоб відбілити своє ім’я — якщо ми не зможемо торгувати зброєю чи машинами, то загрузнемо в болоті назавжди."

blc_political_ceasefire:0 "Політичне 'Перемир'я'"
blc_political_ceasefire_desc:0 "Після низки поступок і втрати значної політичної сили, нам вдалося нав’язати §G«політичне перемир’я»§! у Зборах. Поки угода діє, ми можемо трохи розслабитись і використовувати фракції у своїх інтересах, не зважаючи на думки інших. Та майте на увазі: це дуже тимчасове явище, і його ефект §Rзникне миттєво§! після завершення терміну."

blc_raider_ceasefire:0 "Угода з Клікою Маллета!"
blc_raider_ceasefire_desc:0 "Наші поступки, винятки та пом’якшення вимог тимчасово задовольнили Кліку Маллета. Ми повинні скористатись моментом і використати ситуацію на свою користь — або висмоктавши все з їхніх ініціатив, або повністю проігнорувавши їхній голос у Зборах."

blc_tribal_ceasefire:0 "Угода з Племінною Радою"
blc_tribal_ceasefire_desc:0 "Наші поступки, винятки та пом’якшення вимог тимчасово задовольнили Племінну Раду. Ми повинні скористатись моментом і використати ситуацію на свою користь — або висмоктавши все з їхніх ініціатив, або повністю проігнорувавши їхній голос у Зборах."

blc_settler_ceasefire:0 "Угода з Гільдією Торговців"
blc_settler_ceasefire_desc:0 "Наші поступки, винятки та пом’якшення вимог тимчасово задовольнили Гільдію Торговців. Ми повинні скористатись моментом і використати ситуацію на свою користь — або висмоктавши все з їхніх ініціатив, або повністю проігнорувавши їхній голос у Зборах."

blc_circus:0 "Хліба і Видовищ"
blc_circus_desc:0 "«Цирк Рейдерів» — більше знущальна назва для нашої програми, але її роль перевершила наші очікування. Цирк має багато форм розваг, де колишні рейдери можуть заспокоїти нерви: арена боїв — «Колізей», бордель — «Маленький Карбон», та притон — «Нью-Амстердам»."

blc_kings_tithe_idea:0 "Податок Сховища!"
blc_kings_tithe_idea_desc:0 "Просто внесок у спільну справу."

blc_death_or_taxes:0 "Ціна Свободи"
blc_death_or_taxes_desc:0 "Просто внесок у спільну справу."

#Economic Ideas
blc_centralization:0 "Зусилля до Урбанізації"
blc_centralization_desc:0 "Наші сільські території надто пустельні, щоб приносити користь, тому ми маємо перемістити людей до міст, де вони зможуть працювати в наших майстернях і приносити користь."

blc_decentralization:0 "Кампанія Заселення Земель"
blc_decentralization_desc:0 "Ми маємо перетворити природу навколо себе, і для цього потрібно більше людей на полях. Треба добувати щось корисне з цієї землі, інакше — загинемо з голоду."

#Raider Ideas
blc_simple_solutions:0 "Прості Рішення"
blc_simple_solutions_desc:0 "Нам не потрібні вигадливі хитрощі для зброї чи броні — найпростіше рішення завжди найкраще. Може, воно й не зрівняється з ворожим спорядженням, але зате ми зможемо виготовити його швидше і простіше."

#Tribal Ideas
blc_prison_equipment:0 "Стародавні Техніки Кування"
blc_prison_equipment_desc:0 "Вплив Пейнтед Мен зумовлений їхньою військовою майстерністю, а ті зуміли досягти успіху завдяки товстій, але легкій броні. Вона зупиняє більшість легких калібрів і виготовляється з належним чином обробленої шкіри яо-ґай або дезкло. Тепер ця майстерність належить нам."

blc_painted_ways:0 "Розмальовані Шляхи"
blc_painted_ways_desc:0 "«Я — це пальма, а це лише вітер. Я зігнуся, але не зламаюся.»"

#Settler Ideas
blc_internal_trading:0 "Внутрішня Торгівля"
blc_internal_trading_desc:0 "Якщо ми не можемо торгувати з сусідами — будемо торгувати всередині держави. Поки капси рухаються, а товари змінюють власників — економіка працює, і добробут зростає. Повільно, але впевнено."

blc_maritime_trade_deals:0 "Морська Торгівля"
blc_maritime_trade_deals_desc:0 "Культура — як вода в морі: вона або тримає корабель на плаву, або тягне його на дно."

blc_bureaucratic_ship_designs:0 "Бюрократичні Проєкти Кораблів"
blc_bureaucratic_ship_designs_desc:0 "Реалістично, вони ніколи не добудують цей корабель. Але якщо добудують, то це буде найстрашніша купа дощок на всьому Міссісіпі."

#Army Ideas
blc_manifest_destiny:0 "Призначення Явлене"
blc_manifest_destiny_desc:0 "Доля — це не питання випадку, а вибору."

blc_path_forged:0 "У Наших Руках"
blc_path_forged_deesc:0 "Не шукай допомоги у великих людей — сам стань таким."

blc_unorganized_army:0 "Неорганізована Армія"
blc_unorganized_army_desc:0 "Мати фактично три окремі армії без єдиного командування — це не лише жахливо неефективно, а й робить будь-яке попереднє планування неможливим. Такий рівень децентралізації тільки шкодить нашій державі..."

blc_unorganized_army_2:0 "Неорганізована Армія"
blc_unorganized_army_2_desc:0 "Мати фактично три окремі армії без єдиного командування — це не лише жахливо неефективно, а й робить будь-яке попереднє планування неможливим. Такий рівень децентралізації тільки шкодить нашій державі..."

blc_unorganized_army_3:0 "Неорганізована Армія"
blc_unorganized_army_3_desc:0 "Мати фактично три окремі армії без єдиного командування — це не лише жахливо неефективно, а й робить будь-яке попереднє планування неможливим. Такий рівень децентралізації тільки шкодить нашій державі..."

blc_unorganized_army_tt:0 "§RНеможливо тренувати нові підрозділи понад ліміт або змінювати шаблони дивізій§!\nМоже бути знято після виконання рішення §Y$blc_first_reform_company$§!, яке відкриється через фокус §Y$blc_branches_of_army$§!"

blc_organized_army:0 "Організована Армія"
blc_organized_army_desc:0 "Об'єднати так багато і таких різних військових сил було досить важко, і хоч поточна структура далека від ідеальної — будь-яка організація вже є покращенням."

blc_integrated_support:0 "Інтегрована Підтримка"
blc_integrated_support_desc:0 "Сучасній армії потрібні не лише піхотинці — для успішних операцій потрібна артилерійська і вогнева підтримка. Оскільки наша армія тільки формується, інтегрувати ці частини буде відносно легко."

blc_canyon_warfare_a:0 "Війна в Скельних Ущелинах"
blc_canyon_warfare_a_desc:0 "«Я солдат. Я б’юся там, де мені скажуть. І перемагаю там, де б’юся.»"

blc_canyon_warfare_b:0 "Війна в Скельних Ущелинах"
blc_canyon_warfare_b_desc:0 "«Я солдат. Я б’юся там, де мені скажуть. І перемагаю там, де б’юся.»"

blc_canyon_warfare_c:0 "Війна в Скельних Ущелинах"
blc_canyon_warfare_c_desc:0 "«Я солдат. Я б’юся там, де мені скажуть. І перемагаю там, де б’юся.»"

blc_colorado_volunteers:0 "Наші Люди — Не в Нашій Війні"
blc_colorado_volunteers_desc:0 "Волонтери не отримують платні не тому, що вони нічого не варті, а тому що вони безцінні."

blc_bagger_scientists:0 "Експедиція Баґґерів"
blc_bagger_scientists_desc:0 "Баґґери розпочали свою експедицію для дослідження Купола в Боулдері. З різних причин їм не вдалося закріпитись, але завдяки нашому союзу вони радо працюють із нами. Поки вони займаються вивченням купола, вони також допоможуть нам у вирішенні інших наукових проблем."

blc_boulder_support:0 "Допомога в Дослідженнях Купола"
blc_boulder_support_desc:0 "Таємниці Боулдера будуть розкриті — так чи інакше. Якщо ми маємо найяскравіші уми Чорного Каньйону і віз капсів — хто нас зупинить?"

#Tibbets' Raiders
bcr_queen_consort:0 "Королева-Консорт"
bcr_queen_consort_desc:0 ""

bcr_queen_partner:0 "Королівське Подружжя"
bcr_queen_partner_desc:0 ""
