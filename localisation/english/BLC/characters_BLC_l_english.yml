l_english:

### CHARACTERS
#Leaders
BLC_BATTERY_NAME:0 "Батарея з Меса-Верде"
BLC_BATTERY_DESC:0 "Народжений серед Шифраторів, які дали йому ім’я «Батарея», він провів юність у мандрах. Працюючи на водоочисній станції в Єрихоні, Батарея потоваришував із В’язнем-утікачем у комбінезоні з номером «13».\n\nБатарея подорожував разом із В’язнем, рятуючи інших втікачів і знаходячи нових союзників у пустці. Зрештою вони збудували невелике мандрівне поселення з торговців, вигнанців і колишніх рейдерів.\n\nЗгодом В’язень залишив Батарею, щоби завершити свою подорож і спокутувати минуле. Батарея, зміцнілий за час їхніх мандрів, повів караван на північ до покинутої в’язниці Тіббетс, аби почати нове життя."

BLC_BATTERY_ARMY_CHIEF_desc:0 "§L§YЗагальний опис:§! Батарея був багатьма речами: примітивним трибалом, допитливим механіком, бездомним мандрівником, найкращим другом і видатним лідером. Подорожі навчили його захищати себе і близьких. Якщо обставини змусять, він стане порятунком для своєї нації. Та він не тиран — і ніколи не зробить цього легковажно...\n\n§YСхильність:§! §OА як вважаєш ти?§! §RБатарея підірве свою репутацію, узявши цю роль!§!"

BLC_WARDED_NAME:0 "Промаркований"
BLC_WARDED_DESC:0 "Колишній в’язень Тіббетської в’язниці, Промаркований опинився в потрібному місці в потрібний час. Справжнє ім’я — Пітер Бретт, він потрапив до Тіббетса в межах протоколу CURE. Був звичайною людиною з простими мріями. Але все змінилось у стінах в’язниці, де його татуювали та радикалізували старші ув’язнені.\n\nОпинившись за межами Великого Цирку, він тікав якнайдалі, доки не зустрів Пофарбованих Людей — плем’я з Колорадо. Їм його татуювання видались сакральними, і, обираючи нового шамана, вони обрали його. Під його проводом плем’я об’єдналося для війни, маючи на меті зібрати всі племена Північного Заходу Колорадо під одне знамено. Тепер, коли проєкт «Чорний каньйон» завершено, ніщо не стоїть на заваді виконанню їхньої долі."

BLC_WARDED_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LШаман, що впродовж майже двадцяти років очолює Пофарбованих Людей, нещодавно перебрав владу в військового вождя. Бачить користь у співпраці з нами, але побоюється секуляризації нації. Завзятий релігійний фанатик, він захищатиме духовну незалежність свого племені будь-якою ціною.§!\n\n§YСхильність:§! §LЯк лідер Пофарбованих Людей, палко підтримує §RТрибуальну Раду§!!§!"

BLC_BEARHARD_NAME:0 "Берхард Ріверс"
BLC_BEARHARD_DESC:0 "Родина Ріверсів завжди мала вплив у регіоні Рівербенд. Коли Берхард став Лордом-Мером, настав їхній золотий вік. Під його проводом міста Ямпи об’єдналися, і на землю прийшло небачене процвітання.\n\nПроєкт Чорного каньйону виявився успішним — він забезпечив безпеку та приніс прибутки. Але тепер час діяти агресивніше. Є міста і по інший бік річки, а панування на водах має бути абсолютним — задля нашої ж безпеки, звісно."

BLC_BEARHARD_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LКоаліція Ямпи — це союз переселенців, які споконвіку захищались від Сторожових Псів. Її номінально очолює Берхард Ріверс. Хоча коаліція має політичну вагу, централізувати владу буде складно, поки вона існує в нинішній формі.§!\n\n§YСхильність:§! §LЯк голова Коаліції, він — стійкий прибічник §PГільдії Торговців§!!§!"

BLC_MCBRIDE_NAME:0 "Маллет Макбрайд"
BLC_MCBRIDE_DESC:0 "Маллет Макбрайд — не гарна людина. Навпаки, він відвертий покидьок, як і вся його банда. Великий, жорстокий і, хоч і не дуже розумний, був напрочуд хитрим. З віком його лють вщухла, і він залишив рейдерство, дивом утримавши владу в банді. Чи то через повагу, чи через страх.\n\nТепер, коли його ніщо не стримує, він повертається до того, що вміє найкраще — творити хаос і забирати все, навіть прибите цвяхами. І, може, знайде свій останній скарб — справжню спадщину."

BLC_MCBRIDE_ARMY_CHIEF_desc:0 "§YЗагальний опис:§! §LРейдер із Мохаве, що залишив родину в Новаку заради великої банди. Його потворне обличчя й скажений норов ховають тваринну хитрість. Саме ця жорстокість дозволила йому очолити рейдерів Тіббетса.\n\nУ світі анархії часто владу отримує той, хто ладен піти НА ВСЕ. Та питання в іншому — наскільки далеко він готовий зайти? Чи здатен він на компроміси задля збереження влади? Наскільки практичним може бути психо-наркоманський психопат?§!\n\n§YСхильність:§! §LЯк ватажок рейдерів Тіббетса, він безжальний прибічник §gвласної Кліки§!!§!"
  #
  #BLC_MCBRIDE_KING_NAME:0 "King "Martel" McBride I"
  #BLC_MCBRIDE_KING_DESC:0 "King McBride is not a nice man - in fact, he's a downright royal asshole, and his newly appointed nobility ain't no different them him. Before his coronation, he was the meanest raider in Colorado, and now, he is the most infamous royal figure on the whole continent. Now, as he grew old, he decided he will rather use his tax-collectors than loaded weapons to extort the wealth for his luxury lifestyle, and enacts laws to entertain himself, not ordering his men around. He only need two things to fill his life was completed - a queen, and an heir. And as he heard, there is a Queen that could be used for solving both problems..."

BLC_KODA_RIVERS_NAME:0 "Кода Ріверс"
BLC_KODA_RIVERS_DESC:0 ""
BLC_KODA_RIVERS_NAVY_CHIEF_desc:0 "§YЗагальний опис:§! §LБути батьком найуспішнішого чоловіка в громаді — уже досягнення. Кода завжди мав особливу любов до річки, навіть більше, ніж пересічний громадянин Коаліції, з дивною одержимістю рибами та риболовлею. Він повністю задоволений роллю «адмірала» невеличкого рибальського флоту Коаліції в місцях, де найбільша небезпека з річки — це суперник-торговець із Вайомінґу.§!\n\n§YСхильність:§! §LЯк батько Берхарда та адмірал Коаліції, він підтримує §PГільдію Торговців§!!§!"

BLC_DEPUTY_FISCHER_NAME:0 "Заступниця Кейт «Великий Ніс» Фішер"
BLC_DEPUTY_FISCHER_DESC:0 "Життя Кейті Фішер було важким. Її батьки залишили Сховище 27, та згодом загинули від нападу рейдерів із Тіббетса. Кейті пощастило вижити — один із рейдерів навіть узяв її під опіку. Вона жила з ними близько десяти років, доки один не спробував її зґвалтувати. Вона вбила нападника і втекла на південь до Роулінса. Там знайшла дім і нову родину. Вона вирішила, що найкращий спосіб захистити цих людей — служити нації, яка помстилася всім, хто колись заподіяв їй болю. Життя має дивні шляхи."

BLC_WARDEN_JACKSON_NAME:0 "Начальник Джексон"
BLC_WARDEN_JACKSON_DESC:0 "Джексон Чо народився від жінки зі Ши та солдата НКР. Через це він відчував себе чужим усюди. Він подорожував, деякий час пробув у Форте Кап-Пекло, приєднався до дезертирів НКР і вигнанців Вартових Білого. В Колорадо його обрало урядовці для управління Чорним каньйоном — завдяки адміністративним здібностям і жорстокості, що допомагає тримати рейдерів у покорі. Джексон також позбавлений амбіцій чи вміння чинити серйозний опір — ідеальний вибір."
BLC_WARDEN_JACKSON_HIGH_COMMAND_desc:0 "§YЗагальний опис:§! §LДжексон Чо, син жінки зі Ши та солдата НКР, завжди відчував себе чужим. Подорожував, приєднався до дезертирів та вигнанців, і зрештою став начальником Великого Цирку за рішенням Батареї — завдяки адміністративному хисту та жорстокості. Можливо, його варто залучити до уряду ширше?§!\n\n§YСхильність:§! §LЗадоволений своїм становищем, Начальник Джексон політично нейтральний.§!"

BLC_QUICK_ASP_NAME:0 "Швидкий Асп"
BLC_QUICK_ASP_DESC:0 ""
BLC_QUICK_ASP_ARMY_CHIEF_desc:0 "§YЗагальний опис:§! §LШвидкий Асп — миролюбна людина, особливо в порівнянні з Промаркованим і його войовничими проповідями. Старий, мудрий, терплячий. Але Пустка жорстока, його плем’я розпорошене й знесилене брехнею. Може, сивий койот не такий страшний, як лютий яо-ґай, але тільки койот знає, як перемогти гримучу змію… або коли потрібно програти бій, щоб виграти війну.\n\n§YСхильність:§! Промаркований забрав у нього плем’я, але він ніколи не зрадить §RТрибуальну Раду§!.§!"

BLC_PRESTON_MIKLOVICH_NAME:0 "Престон Міклович"
BLC_PRESTON_MIKLOVICH_ARMY_CHIEF_desc:0 "§YЗагальний опис:§! §LПрестон вірить, що озброєне суспільство — ввічливе суспільство. Велика армія не потрібна, якщо кожен у країні вміє стріляти. Свою кар'єру почав як мандрівний наставник, навчаючи стрільбі в кожному поселенні. Ніби Джонні Яблуконасіний... тільки з насиллям.§!\n\n§YСхильність:§! §LНароджений у Рокрівері, його погляди на «громадянське воїнство» походять із Коаліції, отож він підтримує §PГільдію Торговців§!!§!"
BLC_PRESTON_MIKLOVICH_HIGH_COMMAND_desc:0 "§YЗагальний опис:§! §LПрестон — переконаний прихильник того, що краще навчити всіх стріляти, ніж тримати армію. Як мандрівний інструктор, він перетворив стрільбу на свою місію, подібно до Джонні Яблуконасінного — але з кулями.§!\n\n§YСхильність:§! §LНароджений у Рокрівері, він — прибічник §PГільдії Торговців§!!§!"

BLC_FISHGARTH_NAME:0 "Фішґарт"
BLC_FISHGARTH_NAVY_CHIEF_desc:0 "§YЗагальний опис:§! §LНе лише ямпанці живуть за рахунок річки. Плем’я Річкових Лисиць завжди мешкало біля Платту, ловлячи рибу за допомогою спеціальних пасток у вузьких місцях. Фішґарт — один із них, найвправніший рибалка. Після того як поселенці з Бул-Пен і Алкови спробували витіснити їх із ловильних місць, він став і найкращим знавцем водних шляхів у регіоні.§!\n\n§YСхильність:§! §LФішґарт підтримує §RТрибуальну Раду!§!§!"

BLC_LIFT_NAME:0 "Джона «Лаббер» Ліфт"
BLC_LIFT_NAVY_CHIEF_desc:0 "§YЗагальний опис:§! §LПро Джону відомо небагато. Він не був частиною банди Макбрайда, просто блукав околицями старої в'язниці. Страждав на шизофренію, часто говорив без ладу й причини, тому його намагалися поневолити. Це була велика помилка — Голубий Велетень вирвався й убив сімнадцятьох рейдерів. Макбрайд вирішив спробувати дипломатію. І несподівано — це спрацювало. Усе, чого хотів Джона, — керувати власним судном. Рейдер купив йому старе, найдешевше ямпанське судно. Відтоді Джона щасливо борознить хвилі, хоч і без особливих досягнень.§!\n\n§YСхильність:§! §LВін вірний §gКліці Маллета§!!§!"

BLC_VARGA_NAME:0 "Житель Леслі"
BLC_VARGA_AIR_CHIEF_desc:0 "§YЗагальний опис:§! §LЛеслі Варґа — типовий мешканець сховища. Його родина угорського походження була розміщена в Сховищі 27 і жила там майже спокійним життям. GOAT направив його в інженери, і хоч життя він провів під землею, розум завжди був у хмарах. Хоч він і не був серед перших вигнанців, коли Чорний Каньйон увійшов у Хот-Салфур-Спрінґс, він радо приєднався, щоб здобути небо, про яке так мріяв.§!\n\n§YСхильність:§! §LВін вдячний §2Караванному Конгресу§! за надану можливість.§!"

BLC_WROTHWRIGHT_NAME:0 "Амелія Ротрайт"
BLC_WROTHWRIGHT_AIR_CHIEF_desc:0 "§YЗагальний опис:§! §LАмелія Ротрайт — пілотка й торгівка з Іґл-Рок. Її містечко — велика база дирижаблів, що торгує по всьому Заходу. Через угоду з голодуючим поселенням її покарали, відправивши сюди. Вона швидко потоваришувала з Батареєю і, здається, зовсім не сумує за домом. З радістю ділиться своїм досвідом з новим другом і ще одним видатним торговцем з захопливими історіями.§!\n\n§YСхильність:§! §LВона цілковито віддана Батареї, а також §2Караванному Конгресу§!.§!"

BLC_INKHOUSE_NAME:0 "Інкгаус"
BLC_INKHOUSE_HIGH_COMMAND_desc:0 "§YЗагальний опис:§! §LІнкгаус — майстер стародавнього ремесла виготовлення броні. Він досконало володіє обробкою шкур яо-ґаїв і дескло, перетворюючи їх на гнучку, комфортну, але міцну броню, прикрашену захисними символами від злих духів. У всій Пустці немає кращого знавця шкіряних обладунків. І ми були б дурні, якби не прислухались до його порад.§!\n\n§YСхильність:§! §LНароджений серед Розмальованих, він палкий прибічник §RТрибуальної Ради§!!§!"

BLC_ZENITH_OF_CRIAG_NAME:0 "Зеніт із Кріаґа"
BLC_ZENITH_OF_CRIAG_HIGH_COMMAND_desc:0 "§YЗагальний опис:§! §LПлем'я Сторожів Жертовників майже було знищено у війнах із Розмальованими. Вони завдячують своїм існуванням Батареї, який дав їм нову мету. Зеніт успадкував владу від матері — сестер для спадкування не було. Хоч і геній логістики, війна йому не до душі — його майже знищили бандити Суходувів під час втечі на захід. Коли Чорний Каньйон сформувався, Батарея створив систему сигнальних маяків у Скелястих Горах — і призначив Сторожів Жертовників наглядачами. Попри відданість Батареї, Зеніт є учнем Промаркованого і потрохи радикалізується.§!\n\n§YСхильність:§! §LМісце в §RТрибуальній Раді§! забезпечило його вірність назавжди.§!"

BLC_THOREAU_NAME:0 "Капітан Торо Вудс"
BLC_THOREAU_HIGH_COMMAND_desc:0 "§YЗагальний опис:§! §LЯк син впливової родини Коаліції, Вудс мав би вважати себе щасливим. Але його батько втік, залишивши його на світ від повії-караванниці десь між цими краями й Новим Канеаном. Хоча в нього престижне походження й спадок, він працював охоронцем караванів по всій Пустці — від Хаба до Куверу, від Півночі до Дог-Сіті. Дізнавшись про нове життя вдома, він негайно повернувся до Рівербенду. Знавець логістики й виживання, він дуже цінний для нас.§!\n\n§YСхильність:§! §LСерце старого мандрівника належить §PГільдії Торговців§!.§!"

BLC_RYAN_MITCHELL_NAME:0 "Раян Мітчелл"
BLC_RYAN_MITCHELL_HIGH_COMMAND_desc:0 "§YЗагальний опис:§! §LКуди йде Маллет — туди йде Раян. Його відданість Маллету не знає меж. Він багато разів убивав за нього, навіть без наказу. Спеціалізується на придушенні заколотів із мінімальними втратами серед ворогів, щоби зберегти робочу силу.§!\n\n§YСхильність:§! §L§gКліка Маллета§!. Коментарі зайві.§!"

BLC_ANSON_NAME:0 "Ансон Розважальник"
BLC_ANSON_HIGH_COMMAND_desc:0 "§YЗагальний опис:§! §LАнсон керував борделем у Єрихоні, а тепер і на Бойоті. Він мізогін, хоч і не показує цього відкрито. Спокійний, холодний, веде справи бездоганно у своєму закладі, що поєднує таверну й бордель.§!\n\n§YСхильність:§! §LЯк людина тіні й улюбленець рейдерів, він належить до §gКліки Маллета§!.§!"

BLC_HUGH_JEST_NAME:0 "Г’ю Джест"
BLC_HUGH_JEST_RESEARCH_ADVISOR_desc:0 "§YЗагальний опис:§! §LГ’ю має зріст майже сім футів і колись працював на каменоломнях — отже, він кремезний і дужий. Його не раз обстрілювали, прийнявши за мутанта чи агресора, і це робить його сумним, бо він — дуже доброзичливий хлопець. Найбільше в житті він любить відтягати важке з дороги, діставати речі з верхніх полиць для нижчих людей і (саме так його й зустрів Батарея) витягувати застряглі каравани з багна. Люди думали, що він дурний, аж поки Батарея не подарував йому окуляри. Відтоді він читає все, що потрапляє під руку, включно з військовою теорією. Як виявилося — це його справжній талант.§!\n\n§YСхильність:§! §LНаш здоровило аполітичний, він просто щасливий піднімати каміння, читати книжки й допомагати. А отже, фактично він підтримує §2Караванний Конгрес§!.§!"

BLC_DAMIEN_ETTO_NAME:0 "Житель «Блазень» Деміен"
BLC_DAMIEN_ETTO_RESEARCH_ADVISOR_desc:0 "§YЗагальний опис:§! §LДеміен — шалений фанат слів. Любить книжки, читає все, що знайде. Але найбільше його цікавлять криптограми. Йому подобається створювати й розгадувати головоломки, що перетворюють числа на слова. Він навіть перехоплює наші радіоповідомлення й розшифровує їх заради забави! Тест GOAT визначив йому роль прибиральника, але очевидно, що його таланти заслуговують більшого. Може, як жест доброї волі, дамо йому омріяну посаду?§!\n\n§YСхильність:§! §LВін підтримує §2Караванний Конгрес§! за те, що дали йому справу до душі.§!"

BLC_SEMMELWEIS_NAME:0 "Філіпп Земмельвейс"
BLC_SEMMELWEIS_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LПослідовники Апокаліпсису в представленнях не потребують. Їхня присутність — ознака цивілізованості. Філіпп — типовий послідовник: анархіст-пацифіст, що вірить у децентралізовану співпрацю. У вільний час читає передвоєнну філософію, а спеціалізується на гірництві й виробничих технологіях. Ух, захопливо.§!\n\n§YСхильність:§! §LОфіційно — нейтральний, неофіційно — симпатизує Батареї та його §2Караванному Конгресу§!.§!"

BLC_JAMISON_NAME:0 "Генрі Джемісон"
BLC_JAMISON_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LКомпанія «Багряний Караван» дає доступ до ресурсів найбільшої нації Пустки — Каліфорнії. Було б розумно перейняти досвід найуспішнішої країни, а почати можна з цього чолов’яги. Він — катастрофа: працювати не любить, ледарює постійно. Каже, що його заслали сюди як покарання після невдач у Новому Веґасі. Але, може, з часом із нього вийде толк.§!\n\n§YСхильність:§! §OВірний лише собі та грошам.§!"

BLC_GIORDANOS_NAME:0 "Енцо Джордано"
BLC_GIORDANOS_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LЕнцо — один із трійні Джордано, що заснували «Караван 3-Соме». Він — харизматичний торговець, завдяки якому братам вдалося збудувати стабільну клієнтську базу. Тепер, коли компанія добре влаштована, Енцо з радістю увійшов у політику. Можна навіть сказати — з нетерпінням.§!\n\n§YСхильність:§! §LХоча колись мав зв’язки з рейдерами й Маллетом, нині він відданий Батареї та §2Караванному Конгресу§!. Люди змінюються.§!"

BLC_SIMON_KRIEGER_NAME:0 "Саймон Кріґер"
BLC_SIMON_KRIEGER_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LСаймон бачив Велику Стіну Старого Світу, що стримує води. ГЕС, за яку воюють Ведмідь, Бик, Братство й Веґас. Він вирушив у те криваве дійство й урвав шматок пирога, байдуже, хто контролює дамбу. Цьому генію слід дати підтримку, щоб він урвав більше.§!\n\n§YСхильність:§! §OЙого вірність — десь далеко...§!"

BLC_LITTLE_CIRCLE_NAME:0 "Маленьке Коло"
BLC_LITTLE_CIRCLE_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LМаленьке Коло — побожний послідовник релігії Залізних Колій. Вірить, що вони ведуть шлях Великої Ревучої Машини. Йому лише вісімнадцять зим, та він добровільно приїхав ділитися знаннями з прокладання металевих ліній. Мав пробути тут тимчасово, але, одружившись із жінкою з Розмальованих, вирішив залишитися.§!\n\n§YСхильність:§! §L§RТрибуальна Рада§! — любов і родина перш за все.§!"

BLC_IVAN_NAME:0 "Іван Кишеньковий"
BLC_IVAN_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LІван — майстер фокусів: як виконання, так і розпізнавання. Тож коли хтось намагається намахати Маллета й привласнити здобич, яку не заробив... Коли нам потрібні ті ресурси, щоб робити більше зброї... Іван швидко це вирахує й усе владнає, щоб Маллет не мав клопоту.§!\n\n§YСхильність:§! §LЛіва рука Маллета — не найгірша посада. Його місце в §gКліці Маллета§!.§!"

BLC_PHIL_NAME:0 "Філ"
BLC_PHIL_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LФіл прибув до нашої нації разом із партнером Спаркі після того, як Оуроборос захопив шахту, де вони працювали. Філ, як кажуть, колишній мисливець за головами, якого найняли впіймати Спаркі за якийсь злочин. Але зустрівши його, він не зміг цього зробити — навіть за всі кепси Пустки. Тепер він — щось на кшталт опікуна Спаркі. Філ обожнює розповідати цю історію всім охочим. Втім, він просто дуже любить побалакати: про те, як йому не подобалася наша нація до недавнього часу, чи як він краще ставиться до Конгресу, ніж до Маллета Макбрайда. А ще — що він із радістю готовий працювати на благо держави. І, знаєте, він справді готовий поділитися з нами своєю та Спаркі експертизою.§!\n\n§YСхильність:§! §LФіл прагне всіма силами допомогти §2Караванному Конгресу§!, і оскільки він та Спаркі є співзалежними — той підтримає його в усьому.§!"

BLC_SPARKY_NAME:0 "Спаркі"
BLC_SPARKY_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LСпаркі — літній шахтар, що працював у Бурґем-Спрінґс, поки його не вигнав звідти Оуроборос. Тепер разом із Філом прибув до нас, бо, на його думку, ми стали менш рейдерськими. Він старається як може, хоча або через вік, або через постійні вибухи поблизу, він практично втратив слух. Називає себе “експертом з вибухівки” й твердить, що ніхто не робить флеймери та динаміт так, як він. Партнер Філ запевняє, що це не пусті слова.§!\n\n§YСхильність:§! §LСпаркі — співзалежний зі своїм партнером Філом, іде туди, куди й той. До нас не має особливої прив’язаності, але це ефективно робить його лояльним до §2Караванного Конгресу§!.§!"

BLC_MARISSA_NAME:0 "Марісса Тиха-Хода"
BLC_MARISSA_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LМарісса Тиха-Хода — перша секулярна лідерка племені Розмальованих. Її унікальний життєвий досвід охоплює всю Конфедерацію. Вона народилася в племені Розмальованих, була поневолена самим Маллетом Макбрайдом, утекла та вийшла заміж за Естер з Алкови, представницю Ямпанів. Батарея захистив її свободу обирати — й вона ніколи цього не забуде. Вона прагне використати своє розуміння всіх народів Чорного Каньйону, щоб підтримати Батарею в усьому. І вже тепер її погляди виявилися неоціненними.§!\n\n§YСхильність:§! §LМарісса Тиха-Хода, хоч і є Розмальованою, беззаперечно вірить у майбутнє, яке обіцяє §2Караванний Конгрес§!.§!"

BLC_ESTHER_NAME:0 "Естер з Алкови"
BLC_ESTHER_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LЕстер з Алкови народилася в Медисоні й прожила там усе життя. Саме вона знайшла знесилену й побиту Маріссу в дикій місцевості й виходила її. Згодом вони побралися. Коли потвора, що поневолила її дружину, повернулася, Батарея забезпечив право Марісси залишитися поруч із коханою. Естер це запам’ятала. Тепер, як лікарка й народна улюблениця, вона реалізовує плани Батареї на краще життя для Чорного Каньйону.§!\n\n§YСхильність:§! §LЕстер з Алкови, хоч і громадянка Ямпанів, віддана баченню майбутнього від §2Караванного Конгресу§!.§!"

BLC_LANE_NAME:0 "Док Лейн"
BLC_LANE_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LДок Лейн не має жодної офіційної медичної освіти, окрім знання: «вколов стімпак — тіло, можливо, зцілилося». Не те щоб він не хотів навчитись, але робота у Великому Куполі забирає весь час. Йому доводиться постійно латати закривавлених рейдерів, а отже — навчається лише на практиці, шляхом спроб і помилок.§!\n\n§YСхильність:§! §LХто вижив у Джеріко, хто постійно латав рейдерів, хто прив’язався до верховного лідера... Його місце в §gКліці Маллета§!.§!"

BLC_DELSHAY_NAME:0 "Делшей"
BLC_DELSHAY_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LДелшей — представник Джика́рілья Апачі, народу, вигнаного після спустошень Центуріона Паулуса в Нью-Мексико. Тепер Делшей ділиться з нами філософією свого народу, здобутою великою кров’ю. Народ, готовий до війни — це стабільний народ.§!\n\n§YСхильність:§! §LНасамперед — вірний своєму народові, Джикарілья. Але щиро підтримує політику §2Караванного Конгресу§! за протягнуту руку допомоги.§!"

BLC_SOUTHWICK_NAME:0 "Крістофер Саутвік"
BLC_SOUTHWICK_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LСаутвік прийшов до нас із неймовірною книжкою. Незалежно від його вірувань, він має великий інтерес до логістики й постачання. Можна сказати, він — геній у цій сфері. Можливо, варто й потерпіти трохи проповідей, якщо це дозволить нам користатися його знаннями.§!\n\n§YСхильність:§! §LНайперше — вірний §9Новому Канеану§!, але політично симпатизує §RТрибуальній Раді§! через опір секуляризації.§!"

BLC_SADDLEBURN_NAME:0 "Седдлберн"
BLC_SADDLEBURN_ECONOMIC_ADVISOR_desc:0 "§YЗагальний опис:§! §LПлем’я Розмальованих має чудову мистецьку традицію розпису тіла — як у часи миру, так і війни. Седдлберн є одним із носіїв цієї традиції. Він прославився завдяки своїм детальним пейзажам гір, які малює на тілах племінників під час свят. Ми маємо підтримати традиційну культуру нашого народу.§!\n\n§YСхильність:§! §LПопри свій пацифізм, він відчуває обов’язок підтримувати власне плем’я — §RТрибуальну Раду§!!§!"
BLC_SADDLEBURN_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LПлем’я Розмальованих має чудову мистецьку традицію розпису тіла — як у часи миру, так і війни. Седдлберн є одним із носіїв цієї традиції. Він прославився завдяки своїм детальним пейзажам гір, які малює на тілах племінників під час свят. Ми маємо підтримати традиційну культуру нашого народу.§!\n\n§YСхильність:§! §LПопри свій пацифізм, він відчуває обов’язок підтримувати власне плем’я — §RТрибуальну Раду§!!§!"

BLC_SONGBIRD_NAME:0 "Тімоті Сонґберд"
BLC_SONGBIRD_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LВласник “Розкішного Каравану Сонґберда”, що спеціалізується на перевезенні предметів розкоші для еліт Нового Канеану, Каліфорнії й навіть Легіону. Попри те, що він нібито не цікавиться політикою, має велику кількість впливових друзів по всій Пустці. Ігнорувати його вплив було б безглуздо.§!\n\n§YСхильність:§! §OЛояльний лише до себе.§!"

BLC_MCGRAW_NAME:0 "Самуель Маґґроу"
BLC_MCGRAW_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LЦя людина — справжній прихильник ідеалів Ямпанської коаліції. Він голосно пропагує чесноти життя в конфедерації, взаємодопомогу й підтримку. Його аргументи переконливі навіть для новачків у наших землях. Ми маємо використати цю енергію й харизму на свою користь, щоби допомогти новим громадянам повірити в переваги життя в нашій державі.§!\n\n§YСхильність:§! §LМісцевий патріот із §PГільдії Торговців§!.§!"

BLC_LADY_VEIL_NAME:0 "Пані З-під Вуалі"
BLC_LADY_VEIL_CULTURAL_ADVISOR_desc:0 "§YЗагальний опис:§! §LЗагадкова “Пані З-під Вуалі” є фактичною очільницею Вигнанців із Безплідної Долини. Вона згуртувала тих, хто покинув Сховище 27, у гарячому курортному джерелі. Тепер вона здебільшого займається дипломатією в нашій країні. Через свою ворожість до Керівника Сховища, вона виступає проти зв’язків із цим об’єктом і натомість пропонує підтримку з боку курорту. Пропозиція, яку варто обміркувати.§!\n\n§YСхильність:§! §LОскільки вона знайшла союзників серед Каравану 13 і Батареї, вона підтримує §2Караванний Конгрес§!!§!"

  #Unit Leaders
  #BLC_BLACKJACK_NAME:0 "Blackjack"
  #BLC_BLACKJACK_DESC:0 "Blackjack is typically reputed for an always-friendly and easy-going person, but in the 2250s, Blackjack was in a very precarious situation that not even his friendliness could save him from. Taken captive by the Tibbets Prison AI, Blackjack and other Super Mutants were held within the Prison, with many of the native Coloradans, who had never seen Super Mutants before, quickly becoming aware of their worth, either due to their brains or, more typically, their brawn. This led to Blackjack being made a prime target by Centurions within Caesar's Legion, who were paying handsomely for live super mutants at the time, due to their repute of strength, hoping to defeat and kill them in Legion arenas.\n\nAs a result, Blackjack became the favored target of the ruthless and relentless Legion assassin, Alexandra. Desperate to outrun Alexandra, Blackjack eventually found himself barricaded inside a cave in the canyon of Mesa Verde, only to realize that the canyon had no further exit. Though he claimed to have a minigun (which was actually just a bundle of sticks and pipes painted black with charcoal), he knew that his only hope of survival was to outlast Alexandra, who was hoping to starve him out.\n\nFortunately, a Prisoner who had also escaped Tibbets Prison encountered him, resolving the situation and allowing Blackjack to gamble his days away at a former NCR outpost. In time, Battery of Mesa Verde came to hear of Blackjack's exploits (which had been modified to have him escaping Alexandra, and the Prisoner only being minor help), and decided to recruit him to his fledgling nation of Black Canyon. Blackjack has earned more than enough in gambling winnings to make him comfortable for life, but a gambling savant like Blackjack never knows when to play, or when to fold..."

  #Unit Leaders
  #BLC_BLACKJACK_NAME:0 "Blackjack"
  #BLC_BLACKJACK_DESC:0 "Blackjack is typically reputed for an always-friendly and easy-going person, but in the 2250s, Blackjack was in a very precarious situation that not even his friendliness could save him from. Taken captive by the Tibbets Prison AI, Blackjack and other Super Mutants were held within the Prison, with many of the native Coloradans, who had never seen Super Mutants before, quickly becoming aware of their worth, either due to their brains or, more typically, their brawn. This led to Blackjack being made a prime target by Centurions within Caesar's Legion, who were paying handsomely for live super mutants at the time, due to their repute of strength, hoping to defeat and kill them in Legion arenas.\n\nAs a result, Blackjack became the favored target of the ruthless and relentless Legion assassin, Alexandra. Desperate to outrun Alexandra, Blackjack eventually found himself barricaded inside a cave in the canyon of Mesa Verde, only to realize that the canyon had no further exit. Though he claimed to have a minigun (which was actually just a bundle of sticks and pipes painted black with charcoal), he knew that his only hope of survival was to outlast Alexandra, who was hoping to starve him out.\n\nFortunately, a Prisoner who had also escaped Tibbets Prison encountered him, resolving the situation and allowing Blackjack to gamble his days away at a former NCR outpost. In time, Battery of Mesa Verde came to hear of Blackjack's exploits (which had been modified to have him escaping Alexandra, and the Prisoner only being minor help), and decided to recruit him to his fledgling nation of Black Canyon. Blackjack has earned more than enough in gambling winnings to make him comfortable for life, but a gambling savant like Blackjack never knows when to play, or when to fold..."

