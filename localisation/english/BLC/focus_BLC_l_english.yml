l_english:
### ФОКУСИ
# Початкові фокуси
blc_the_penitentiary:0 "В'язниця"
blc_the_penitentiary_desc:0 "Стара тюрма зберігала багато чого. В'язнів, механічних наглядачів і навіть вірус. Двісті років потому наглядачі стали купою брухту, вірус перетворився на чуму, а в'язні — на рейдерів. І хоча перші два нас не турбують, від останніх не так просто відмахнутись."

blc_people_of_same_kin_and_ink:0 "Люди однієї крові й фарби"
blc_people_of_same_kin_and_ink_desc:0 "Північно-західне Колорадо завжди було диким краєм. Та попри це, там все ще живуть люди — сильні, витривалі, і небезпечні."

blc_home_of_bisons:0 "Де річка годує"
blc_home_of_bisons_desc:0 "Хоча рейдери й племена деруться між собою, річкові спільноти залишаються стабільними. Коаліція вже давно практикує демократію, і попри деяку радикальність, вони найцивілізованіші з усіх."

blc_outsiders_come_glowbugs:0 "Пришельці — Сяйливі"
blc_outsiders_come_glowbugs_desc:0 "Вони були світлі, розірвані, змучені — і прийшли з благаннями. Ми б хотіли сказати, що допомогли їм з доброти серця, але все було складніше."

blc_outsiders_come_caravan_13:0 "Пришельці — Караван 13"
blc_outsiders_come_caravan_13_desc:0 "Це були лише мандрівники, що повернулись із довгої подорожі, але вони привели з собою щось особливе — людину племінного походження з розумом поселенця й язиком рейдера. Баттері з Меса Верде."

blc_outsiders_come_ghosts_from_underground:0 "Пришельці — Примари з-під землі"
blc_outsiders_come_ghosts_from_underground_desc:0 "Спершу це була пустка. А потім виникла спільнота «Аутсайдерів», виштовхнута нагору знизу. За ними прийшли примари в оболонках."

blc_one_canyon_to_call_home:0 "Каньйон, що став домом"
blc_one_canyon_to_call_home_desc:0 "Ми всі різні — племена, поселенці, рейдери, гуля й жителі сховищ. Але єдине, що нас об'єднує — ми називаємо Каньйон домом. І ми всі його захищатимемо, будь-якою ціною."

# «Сигнальні вогнища» (Beacons)
blc_beacons_alight_on_peaks:0 "Сигнальні вогні спалахують на вершинах"
blc_beacons_alight_on_peaks_desc:0 "§gЯкщо вогні на вершинах Скелястих гір загоряться, Чорний Каньйон має бути готовим до війни. - Баттері§!\n\nЧорний Каньйон давно встановив сигнальні вогнища — постійні вогні на вершинах гір, як попередження у разі вторгнення Гангдогів. І хоч це вже малоймовірно, останні події свідчать: пора знову їх запалити. Вартові охоронятимуть їх до останнього."

# Кроти
blc_deal_with_moles:0 "Пограємо в «Удар крота»!"
blc_deal_with_moles_desc:0 "Бий їх, як тільки вилізають! До того, як вони знову почнуть жбурляти динаміт куди не лінь. Це нащадки шахтарів із Фар-Сона та рейдери, що відкинули Компроміс, оселившись у старому бункері. Вони озброєні, скажені й дуже нам заважають."

blc_getting_rid_of_moles:0 "Позбавимось кротів"
blc_getting_rid_of_moles_desc:0 "Треба залити ту нору водою, інакше вони не зникнуть. Ми не дамо їм жодного спокою в їх «Підшляхах». Хоча, сподіваємось, не всі вони там потонуть."

blc_set_underway_ablaze:0 "Спалити Підшляхи"
blc_set_underway_ablaze_desc:0 "Тепер, коли ми зачистили територію, можна спалити їхню потворну забудову. Принаймні, ми отримаємо трохи металобрухту. Може, вони знайдуть інший дім, де зможуть кидатись динамітом у спокої."

blc_incorporate_moles_into_federation:0 "Повернути кротів до Федерації"
blc_incorporate_moles_into_federation_desc:0 "Місто Кротоун вороже до нас не через злість, а через жагу до хаосу. Можливо, ми зможемо переконати їх приєднатись і спрямувати їхню руйнівну силу на наших ворогів. Але доведеться попітніти..."

blc_playing_with_bombs:0 "Бабах і Маленький Бабах"
blc_playing_with_bombs_desc:0 "Після того як нас впустили, виявилось, що Кротоун розташований у колишньому бункері, а мешканці розширювали його, підриваючи стіни. Місце оригінальне, але більшість охоче повернеться до Пенітенціарію. Кроти мають неабиякий досвід у вибухівці, й сімейство Бабахів радо навчить нас усьому, що знає."
blc_playing_with_bombs_tt:0 "§MЛаскаво просимо§! §gбанду Кротоун до кліки Маллета!§!"

blc_powderkeg_of_colorado:0 "Порохова бочка Колорадо"
blc_powderkeg_of_colorado_desc:0 "Порохова бочка Колорадо вже давно диміла: колишній регіон Фронт-Рейндж наповнений угрупуваннями гуля з перетинаючимися територіальними претензіями. Їхні складні альянси й ворожнечі тільки погіршували ситуацію. Коли з'явився новий гравець і зайняв свою нішу — ґніт було підпалено. Заради власної безпеки нам доведеться втрутитися."

blc_alliance_with_victor:0 "Позитивні результати"
blc_alliance_with_victor_desc:0 "Попри те, що Каліфорнійська експедиція втрапила в самісіньку гущу конфлікту, вона вийшла з нього переможцем. Ми запропонуємо їм повний доступ до Куполу Боулдера за символічну ціну — їхні землі в Колорадо."
blc_alliance_with_victor_tt:0 "§gМи запропонуємо §Y[BAG.GetNameWithFlag]§! повний доступ до §YКуполу Боулдера§! в обмін на їхні контрольовані землі. Ми впевнені, що вони не відмовляться.§!"

blc_unacceptable_conclusion:0 "Неприйнятний результат"
blc_unacceptable_conclusion_desc:0 "Каліфорнійців вдруге вигнали з Колорадо. Це неприйнятно. Усі інші учасники конфлікту — фанатики, затяті самітники, комуністи або суміш усього цього! Поки ще маємо шанс, розпочнемо наступ проти них. Ми спрямуємо повідомлення до §Y[GLW.GetName]§! — війна почнеться з їхніх земель."

blc_situation_defused:0 "Порохову бочку знешкоджено"
blc_situation_defused_desc:0 "Хоч вона й таки вибухнула, але ми можемо сказати, що порохову бочку знешкоджено — жодна іскра не долетіла до нашої сфери впливу. А ще тепер у нас є купа науковців, готових працювати над Куполом. Нарешті зможемо використовувати його повноцінно, а не лише розбирати на запчастини."
blc_baggers_come:0 "§Y[BAG.GetName]:§! Прийняли нашу §YПропозицію§!"

blc_lunar_eclipse:0 "Місячне затемнення"
blc_lunar_eclipse_desc:0 "Ми не знаємо точно, що сталося в Піраміді Уробороса, але, схоже, статус-кво сильно не змінився. Вони втратили одного з провідних військових лідерів, і Геката вже готує свій похід на захід — через Колорадо. Ми наступні в її списку. Хоча більшість проти цієї ідеї, ми мусимо завдати удару першими, поки є нагода. Війна, щоби уникнути війни... Який божевільний світ."
blc_lunar_eclipse_tt:0 "§gЧерез останні події на нашому західному кордоні, Зібрання після гарячих дебатів погодилось на превентивний удар проти зростаючої загрози...§!\n§RНароду це не сподобається.§!"

blc_howling_at_moon:0 "Вити на місяць"
blc_howling_at_moon_desc:0 "У Піраміді Уробороса щось сталося, і §P«Богиня Темного Місяця»§! впала. Її наступник вже дивиться на наші землі. Хоч їхні сили ще не оговтались, у нас не так багато часу на підготовку. Ми укріпимо кордони — й якщо вони захочуть відкусити шматок, муситимуть боротися за кожен сантиметр."
blc_howling_at_moon_tt:0 "§gЧерез останні події на нашому західному кордоні, Зібрання одностайно вирішило укріпити прикордонні землі...§!\nУ кожній провінції, що межує з §Y[ORO.GetNameWithFlag]§!, буде збудовано по 2 рівні §YФорпосту§!, §Rкрім§! провінції §Y[38.GetName]§!."

blc_integrate_tribals:0 "Що під Горячими Джерелами?"
blc_integrate_tribals_desc:0 "Прірва Горячих Джерел ховала чимало жахіть, але з ними вже впорались дикуни з Уробороса. Підземний об'єкт переважно вже розграбовано, проте дещо з АГРИКОЛА ми можемо розібрати й вивчити. Також ми знайшли величезне родовище вугілля — у майбутньому можемо розпочати розробку."
blc_integrate_tribals_tt:0 "§MВітаємо§! §gДинозаврове Плем’я у Племінній Раді!§!"

blc_integrate_settlers:0 "Імпорт досвіду гірництва"
blc_integrate_settlers_desc:0 "Драйбловери — не перші шахтарі, з якими ми стикались, але вони виявились напрочуд ефективними союзниками. Їхні технології видобутку набагато просунутіші за наші, а їхні глибокі шахти можна буде значно розширити."
blc_integrate_settlers_tt:0 "§MВітаємо§! §gМінерарів Драйбловерів у Коаліції Спільнот!§!"

blc_integrate_oro:0 "Найцінніший скарб Гекати: Уроборос"
blc_integrate_oro_desc:0 "Уроборос ховає під своїм дахом зовсім різних людей. Кастова система Гекати створила окремі групи з власною ідентичністю. Дочки й Гончі — фанатичні та вірні, та навіть серед них є винятки. Не кажучи вже про простих громадян, на чиїх плечах трималась громада. Люди з полегшенням зітхнули, коли місцеве чудовисько нарешті зникло. Не всі приймуть, що Уробороса більше нема — але ті, хто приймуть, отримають своє місце в Зібранні."

blc_colorado_reconstruction_bureau_tt:0 "§YРішення щодо розбудови§! у Колорадо з'являться лише після створення §GБюро Відбудови Колорадо§!."

blc_forbidden_temple:0 "Заборонений Храм"
blc_forbidden_temple_desc:0 "У розпачі та гніві залишки послідовників Діани ринули в землі Чорного Каньйону, сповнені рішучості здобути новий дім через війну. Їхній гнів — їхній рушій. Їхня присутність — тінь над регіоном. Тепер Баттері має вирішити, що робити."

blc_forbidden_temple_kill_mcbride_helper_tt:0 "§gМакбрайд і Рейдери Тіббетса унеможливлюють дипломатичні відносини з біженцями Племені Близнят. Якщо ми§! §R'розберемося' з Макбрайдом§!, §gто відкриються інші дипломатичні варіанти.§!"
blc_forbidden_temple_we_killed_mcbride_helper_tt:0 "§gОскільки Макбрайда усунено,§! §GПлем'я Близнят довіряє нам більше.§! §gДоля нашого нового сусіда — у наших руках.§!"

blc_came_as_refugees:0 "Плоди Парадайзу"
blc_came_as_refugees_desc:0 "Хоч ми й відкрили Нурсері, Діана замкнулась у собі й відмовляється від переговорів. Та все ж, долина навколо родюча, й ми можемо використати її дари собі на благо."

blc_change_in_power_dynamics:0 "Дивакуваті Роботи!?"
blc_change_in_power_dynamics_desc:0 "Деякі роботи Нурсері поводяться дивно — мають особистості й поведінку, яких Діана не закладала. Вони нагадують чутки про ексцентричних машин з Міста Роботів десь далеко на сході..."

blc_came_as_conquerors:0 "Вартові Племені"
blc_came_as_conquerors_desc:0 "Серед руїн захисників Діани ще збереглися рештки її Вартових, чиї корпуси сяють тьмяною славою. Вивчаючи їхні сервіоприводи й схеми, ми зможемо відтворити їхню надзвичайну витривалість."

blc_live_by_the_sword_die_by_the_sword:0 "Обіцянка на Майбутнє"
blc_live_by_the_sword_die_by_the_sword_desc:0 "Одна з трибалок Племені Близнят померла в дорозі, стискаючи в руках легендарний G.E.C.K. Ми можемо вшанувати її останню волю й вдихнути життя в пустку нашої Батьківщини."

blc_our_green_fireflies:0 "Наші Світлячки-Сяйливці"
blc_our_green_fireflies_desc:0 "[GLW.GetName] — наші давні союзники. Радіоактивні, але мирні гуля, які живуть на одній з найцінніших територій Колорадо. Ми завжди захищали їх як буфер від Хангдогів. Але тепер, перед Великим Зібранням 2277 року, вони готують щось несподіване..."

blc_little_brothers_over_rockies:0 "Наші Брати за Скелястими Горами"
blc_little_brothers_over_rockies_desc:0 "Наш давній союзник, Патчз, звернувся до Баттері з проханням виступити на Зібранні на підтримку Каравану 13. Хоч промова й була спрямована на зміцнення власної влади, вона значно підвищила наш авторитет у державі."
blc_little_brothers_over_rockies_tt:0 "§gПромова §Y[GLW.GetLeader]§! значно підвищила підтримку §YКаравану 13§! і надала нам величезну політичну перевагу.§!"

blc_refit_camp_for_larger_operations:0 "Перебудувати Табір для Масштабніших Операцій"
blc_refit_camp_for_larger_operations_desc:0 "Контактний Табір — поселення на виділеній землі, де радіація не така згубна, і де гуля та люди можуть співіснувати. У наших спільних інтересах — динамічно розвивати цей осередок. І ми починаємо прямо зараз."

blc_provide_support_for_boulder_project:0 "Надати Пряму Підтримку Проєкту Боулдера"
blc_provide_support_for_boulder_project_desc:0 "Купол Боулдера вже давно ізольовано від зовнішнього світу. Без володаря ключів його не відкрити. Гулі вже доклали чимало зусиль, але без нашої допомоги нічого не зміниться. Ми відрядимо своїх найрозумніших людей, щоб допомогти."

blc_renegotiation_of_treaty:0 "Перегляд Угоди"
blc_renegotiation_of_treaty_desc:0 "Хоч Договір у Коллінзі був нібито справедливим, він стримував розвиток [GLW.GetName]. Ми запропонуємо нові умови: скасування грошових податків в обмін на ресурси, нове обладнання для їхніх експедицій — і оплату за доступ до цих скарбів. Сподіваємось, нова угода задовольнить обидві сторони."

blc_state_of_glowbugs:0 "Стан Світлячків"
blc_state_of_glowbugs_desc:0 "У [GLW.GetName] відбулася зміна влади. Цей §YСтітчез§! щось дуже зухвало поводиться — прагне незалежності, не платить податки, готує спротив... Після всього, що ми для них зробили? Це неприпустимо. Ми надішлемо ультиматум — або підкоряться, або ми силою нагадаємо їм їхнє місце."
blc_state_of_glowbugs_tt:0 "§gГулі з §Y[GLW.GetName]§! вже перетнули кілька §Rчервоних ліній§!. А тепер і зовсім розривають угоду? Ми покажемо їм, хто тут господар. Вони або відступлять, або будуть затягнуті назад — ще глибше, ніж раніше.§!"

blc_end_concession_of_laramie:0 "Завершити Концесію Ларамі"
blc_end_concession_of_laramie_desc:0 "Ларамі було подаровано [GLW.GetName] як компенсацію за договір і як місце, де гуля та люди могли взаємодіяти без ризику. Після їхнього показового бунту — ми заберемо його назад. Щоб знали, хто тут бос."

blc_assume_direct_control_of_dome:0 "Перебрати Контроль над Куполом"
blc_assume_direct_control_of_dome_desc:0 "Боулдерський Купол — один із найцінніших дарів Колорадо. За Світлячків він тільки продовжував занепадати, а таємниці його так і не було розкрито. Ми переведемо об'єкт під нашу юрисдикцію — і його таємниці стануть нашими."
blc_assume_direct_control_of_dome_tt:0 "§g§YМайбутнє Світлячків§! залежить від того, чи мають вони контроль над територіями поза своєю домівкою. Якщо так — ми їх §Gпереселимо§!. Якщо ні — §Rрозпустимо§! їхнє керівництво і використаємо 'світлячків' як робочу силу.§!"

blc_servants_forever:0 "Наші Слуги Назавжди"
blc_servants_forever_desc:0 "Ми завжди намагались бути дружніми до гулів у регіоні, але реальність показала: дай їм палець — відкусять руку. Цього разу ми все пояснимо чітко: ми — хазяї, вони — слуги. І ми подбаємо, щоб вони цього не забули."

blc_volunteers_from_ghoul_lands:0 "Добровольці з Гульських Земель"
blc_volunteers_from_ghoul_lands_desc:0 "Фронт Рейндж колись був Гаундлендом — земля, де пси бігали вільно. Та Хангдоги вигнали гуля з Денвера і перетворили місто на Псячий Град, а колишні псячі землі — на гульські. Наш особливий зв'язок з регіоном дав нам достатньо добровольців, щоби сформувати повноцінні батальйони з одних лише гулів."

blc_caravan_of_vagabonds:0 "Караван Блукачів"
blc_caravan_of_vagabonds_desc:0 "TODO"

blc_armory_of_colorado:0 "Арсенал Колорадо"
blc_armory_of_colorado_desc:0 "Не кожне інвестування вигідне, але в тому й суть капіталізму. Ці підприємства ніхто не купує, бо вони збиткові — а отже, дешеві. Ми використаємо свій вплив і придбаємо старий арсенал у пана з Чемалта. Це дасть нам зброю, необхідну для оновлення нашого армійського мотлоху. І якщо арсенал у приватних руках — ніхто не підозрюватиме нічого."

blc_caravan_palace:0 "Караван-Палац"
blc_caravan_palace_desc:0 "Караван як напівполітична структура має обмежену реальну владу. Але ми можемо витиснути з цього щось... матеріальне. Навіть якщо це ослабить наш контроль. Зрештою, знайдеться хтось, хто прийме рукостискання як плату за нерухомість. Нам якраз треба штаб-квартира для політичних ігор — і торгівлі."

blc_our_little_shudderbugs:0 "Наші Тремтливі Жучки"
blc_our_little_shudderbugs_desc:0 "Світлячки винні нам за захист від Хангдогів. Вони вже багато чого дають... але могли б і більше, еге ж?"

blc_demand_more_resources:0 "Запросити Додаткові Поставки Ресурсів"
blc_demand_more_resources_desc:0 "Патчз — наш найвідданіший союзник серед гулів. Ми легко можемо вибити трохи більше металобрухту і будівельників з його прихильників. Очевидно, підтримувати його — найрозумніший варіант, так?"

blc_order_shipment_of_weapons:0 "Замовити Поставку Зброї"
blc_order_shipment_of_weapons_desc:0 "Стітчез — гуль, який ніколи не приховував своєї зневаги, але має унікальну можливість. Він повністю контролює оборону своєї країни, і якщо добре змастити колеса, можемо дістати трохи зайвої зброї. Сподіваємось, пес, що гавкає, не вкусить..."

blc_help_with_helping:0 "Допомогти Їм Допомогти Нам"
blc_help_with_helping_desc:0 "Наша країна вже пережила кілька хвиль біженців: з Малого Ваййомінгу, після мародерств Гекати, тепер — гулі зі сходу. Не дивно, що ми передали цю справу Світлячкам. Але, здається, вони ледь справляються. Можемо допомогти їм разок — допомогти їм допомагати нам."

blc_external_judgement:0 "Побороти Погану Репутацію"
blc_external_judgement_desc:0 "Ми збудували нашу країну на співпраці різних груп, але більшість пустки називає нас «Чорно-Каньйонські Рейдери». Хоч ми й розуміємо недовіру, запевняємо: Рейдери Тіббетса діють за законом і не представляють наші принципи. Ми повинні довести світу, що ми не рейдери, а надійні партнери."
blc_external_judgement_tt:0 "\nУсі наші наявні укріплення буде покращено на §Gone§! рівень.\n§gМи не можемо повністю роззброїти місцеві війська, але можемо показати, що не становимо загрози. Зміцнивши свої застави, ми доведемо, що лише захищаємося.§!"

blc_unlock_envoy_decisions_tt:0 "\nЦей фокус відкриє §Yрішення про послів§!, що допоможуть нам покращити думку наших південних сусідів."
blc_the_mountaineers:0 "Срібні Язики"
blc_the_mountaineers_desc:0 "Завжди є непрямі способи вирішити проблему. Караван завжди вмів знаходити альтернативні рішення за допомогою хитрості та переконання, змушуючи інших думати, ніби це була їхня ідея."

blc_secret_rearnament:0 "Таємне Переозброєння"
blc_secret_rearnament_desc:0 "Хоч ми й прикидаємось безпечними, не можна залишатись беззбройними вічно. Ми укріпимо наші сили — повільно й обережно. Щоб нікого не налякати."

blc_tribal_tactics:0 "Тактика Пустки"
blc_tribal_tactics_desc:0 "Ми можемо централізувати нашу армію, взявши за основу принципи Painted Men. Їхні бойові загони не залежать від центру, але чудово підходять для засідок і партизанської війни. Їхній фокус на броньованій піхоті легко адаптується до сучасності."

blc_settler_tactics:0 "Звичайна Війна"
blc_settler_tactics_desc:0 "Ми повинні базувати армію на структурі міліції Ямпан. Використовуючи бойові групи підтримки та чітку організацію, вони найближчі до довоєнної армії, яку ми маємо."

blc_push_compromise:0 "Просунути Компроміс"
blc_push_compromise_desc:0 "Основний резерв солдатів ми черпаємо з учасників Компромісу. Ми можемо його розширити й залучити більше, не ризикуючи стабільністю."

blc_branches_of_army:0 "Гілки Збройних Сил"
blc_branches_of_army_desc:0 "Тепер, коли ми провели первинні реформи, можна глянути на нові напрями. Організація Управління Повітряно-Морської Реконструкції зробить нас гравцем рівня Wasteland. Працюючі довоєнні кораблі та літаки? Оце був би успіх."
blc_branches_of_army_tt:0 "Відкриває додаткові §Yрішення§! у вкладці §Y"Дезорганізована" Спільна Армія§!."

blc_form_air_corps:0 "Сформувати Повітряний Корпус"
blc_form_air_corps_desc:0 "Куски металу, що літають небом? Хтось назве це наукою, але ми всі знаємо — це справжня магія. Хоч ми можемо полагодити деякі довоєнні літаки, серійне виробництво такого рівня — нереальне. Але Колорадо має кілька аеропортів..."

blc_form_river_fleet:0 "Сформувати Річковий Флот"
blc_form_river_fleet_desc:0 "Ямпани вже давно мають флот — але це лише рибальські човни з дерева. Якщо ми хочемо захищати свої води чи висадитись на схід — треба розвивати цей напрям."

blc_lessons_we_learned:0 "Фінансувати Центральний Арсенал"
blc_lessons_we_learned_desc:0 "Щоб забезпечити наші перемоги на суші, ми повинні підтримати збройну промисловість. Після реформ і централізації — це вимагатиме дуже тісної координації."

blc_centralization_effort:0 "Централізація Промисловості"
blc_centralization_effort_desc:0 "Практика показує: централізована промисловість менш гнучка, але ефективніша. Зараз кожна фракція будує свої власні майстерні, але це не працює на благо всього Чорного Каньйону."

blc_bearhard_plan:0 "План Ріверсів"
blc_bearhard_plan_desc:0 "Сім’я Ріверсів запропонувала план індустріальної реформи. Рибальство. Ми повинні мати товар для експорту, щоб відновити торгівлю. А чиста їжа без радіації завжди цінується."
blc_bearhard_plan_tt:0 "§YЦивільні індустріальні рішення§! коштуватимуть лише §Gполовину§!."

blc_mcbride_scheme:0 "Схема Джордано"
blc_mcbride_scheme_desc:0 "Клік Маллета разом з трійнятами Джордано рідкісно погодились і подали ідею для індустріальної перебудови. Експорт — мінерали з-під наших ніг. Підтримка війни непрямо — така ідея могла прийти в голову лише Маллету."
blc_mcbride_scheme_tt:0 "§YВійськові індустріальні рішення§! коштуватимуть лише §Gполовину§!."

blc_industrial_centres:0 "Тісно Пов’язані Центри"
blc_industrial_centres_desc:0 "Централізація займе більше часу, ніж ми гадали. Але ми можемо підштовхнути її: спеціалізація фракцій у конкретних сферах змусить їх залежати одна від одної. Це точно їх зблизить, так?"

blc_colorado_reconstruction_bureau:0 "Управління Реконструкції Колорадо"
blc_colorado_reconstruction_bureau_desc:0 "Наша економіка стабільна, тож час братись за великі проєкти. Колорадо колись було багатим на ресурси, але ми не мали технологій. Тепер маємо!"
blc_colorado_reconstruction_bureau_tt:0 "§YРішення розвитку§! у Колорадо з’являться лише після створення §GУправління Реконструкції§!."

blc_centralize_energy_parks:0 "Централізувати Енергопарки"
blc_centralize_energy_parks_desc:0 "Об’єднаймо наші енергетичні комплекси!"

blc_hydroelectric_proficiency:0 "Гідроелектричні Вузли"
blc_hydroelectric_proficiency_desc:0 "Хотілося б бути Гідроелектровузлом."

blc_metalworkers_union:0 "Союз Металургів"
blc_metalworkers_union_desc:0 "Тепер ще й профспілки формують? Жах!"

blc_invite_followers:0 "Залучити Послідовників Апокаліпсису"
blc_invite_followers_desc:0 "Послідовники Апокаліпсису — це впливова організація у Пустці, і їхня підтримка нам не завадить. Їхні знання в медицині, сільському господарстві та науці можуть стати початком модернізації Каньйону. Їхня присутність також може трохи відбілити нашу репутацію в очах сусідів. Зв’язатись із ними має бути нескладно."

blc_invite_flyers:0 "Запросити Експерта з Авіації"
blc_invite_flyers_desc:0 "Батарея познайомилась із дівчиною років двадцяти, яка стверджує, що вона пілот, механік і торговка з Іглс-Року. Вона з радістю допоможе нам опанувати мистецтво повітряної війни."

blc_begin_again:0 "Прапор, Який Варто Захищати"
blc_begin_again_desc:0 "Великий Купол — це не просто притулок. Це обіцянка. Ледь жива згадка про сміх, світло й надію у світі, що давно їх забув. Його вицвілі кольори та скриплячі балки розповідають історії про виживання і другий шанс. Захищати його — це не лише обов’язок, це віра в мрію, якою знову хочеться жити."

blc_broke_out_from_isolation:0 "Вийти з Ізоляції"
blc_broke_out_from_isolation_desc:0 "Наша ситуація в Колорадо й у ширшій Пустці — жалюгідна. Сусіди нас цураються або відверто ворожі, а решта вважає нас звичайними рейдерами. Якщо не змінити це — без караванів ми всі здохнемо з голоду."

blc_ally_outside_of_colorado:0 "Союз Позаколорадський"
blc_ally_outside_of_colorado_desc:0 "Хоча наші інтереси переважно зосереджені в Колорадо, є й інші гідні кандидати для співпраці.\n§Y[NCN.GetNameWithFlag]§! — це нація досвідчених і розумних торговців. Вони прийняли наше посольство, тож ми можемо почати перемовини щодо партнерства та торгівлі."

blc_envoy_sent_new_canaan:0 "Ми відправили посольство до §Y[NCN.GetName]§!!"

blc_concession_of_mining_rights:0 "Продати Концесію на Видобуток"
blc_concession_of_mining_rights_desc:0 "Наша економіка сильно залежить від сировини, а розвиток інфраструктури фактично стоїть. Ми не багаті на ресурси, але маємо кілька вугільних родовищ, які можна розробити."

blc_concession_of_mining_rights_tt:0 "§gБуде створено §YСпільний Консорціум§! із §Y[NCN.GetAdjective]§!, де вони нададуть обладнання та фінансування, а ми — робочу силу й досвід. Обидві сторони отримають прибуток.§!"

blc_let_missionaries_in:0 "Допустити Мормонських Місіонерів"
blc_let_missionaries_in_desc:0 "Мормонське вчення каже, що якщо всі у світі приймуть їхню віру — настане рай. Тому вони розсилають своїх «місіонерів» по всій Пустці.\nЇхні місії дають певні вигоди, і ми можемо використати їх як противагу містицизму Розписаних Людей."

blc_let_missionaries_in_tt:0 "§g§Y[NCN.GetAdjective]§! закріпляться на нашій землі, але ми §Rне§! отримаємо ті самі переваги, що й племена Юти. Якщо §Y[PNT.GetNameWithFlag]§! відокремиться, вони їх отримають.§!"

blc_oasis_in_deseret:0 "Оаза в Дезереті"
blc_oasis_in_deseret_desc:0 "Посеред пісків Юти є оаза, де кочують [EHT.GetName]. Торгово вони майже нічим не цікаві, але утримання торгівлі з ними може бути вигідним. Вони дуже розуміються на транспорті, а плітки — найшвидше поширюються з караванами..."

blc_envoy_sent_oasis:0 "Ми відправили торгову делегацію до §Y[512.GetName]§!!"

blc_learn_from_canaan_caravans:0 "Вчитися у Ханаанських Караванів"
blc_learn_from_canaan_caravans_desc:0 "Мормони вже достатньо нам довіряють, щоб допомогти з розвитком економіки. Їхній досвід і унікальні підходи можна перейняти для розбудови власної мережі. А поки що — їхнє фінансування допоможе покращити нашу столицю."

blc_raider_economics:0 "Економіка Рейдерів"
blc_raider_economics_desc:0 "Дружити з бандитами — поганий піар, але вибору небагато. Вони досягли успіху в своєму ремеслі, мають трохи грошей і не проти торгувати з нами."

blc_envoy_sent_new_sterling:0 "Ми відправили посольство до §Y[430.GetName]§!!"

blc_raiders_honour:0 "Честь Серед Рейдерів"
blc_raiders_honour_desc:0 "Схоже, МакБрайд раніше вже мав справу з Булітом. Вони напевно щось замутять у темному закутку, але нам це відкриває нові можливості."

blc_cut_out_lacerman:0 "Витіснити Лейсмена"
blc_cut_out_lacerman_desc:0 "«Лейсмен» — наркоторговець із Північного Колорадо. Залишає після себе лише купи дурману і зламаних життів. Якщо ми запропонуємо безпечнішу альтернативу, можемо витіснити його з ринку."

blc_black_market:0 "Вийти на Чорний Ринок"
blc_black_market_desc:0 "На будь-яку неможливу проблему завжди знайдеться рішення. Якщо Пустка перекриває всі легальні шляхи — підемо туди, де не ставлять запитань. Їжа і ресурси, можливо, залиті кров'ю... та у нас ще є трохи води, щоб її змити."

blc_devil_in_bowler_hat:0 "Диявол у Котелку"
blc_devil_in_bowler_hat_desc:0 "[WYR.GetName] дуже схожі на нашу Коаліцію. Обидві структури торгують, агресивно розширюються, покладаються на ріку Платт і хочуть приєднатись до Ліги Річок — цієї «Американської Ганзи». Барон — не добряк, але ми вже маємо справу з подібними."

BLC_replace_wyr_branch_tt:0 "Якщо §Y[WYR.GetNameWithFlag]§! зникне, ця гілка заміниться варіантом для §Y[KHA.GetNameWithFlag]§!"

blc_envoy_sent_casper:0 "Ми відправили посольство до §Y[1040.GetName]§!!"

blc_river_agreements:0 "Касперська Річкова Угода"
blc_river_agreements_desc:0 "Хоча Коаліція й не буде в захваті від передачі частини річки, нам доведеться відкрити наші порти для кораблів Ейрі. Взаємні швартувальні права та розвиток доків збільшать наші торгівельні можливості — бувають і гірші угоди."

blc_brahmin_bill:0 "Брахмінський Закон Барона"
blc_brahmin_bill_desc:0 "Поля Ейрі повні брахмінів, а Барону завжди потрібні нові землі. Ми можемо надати невикористані території навколо міст Коаліції — вони здебільшого біля річки, і мешканці не заперечуватимуть. Ми отримаємо худобу та досвідчених пастухів, а Барон — прибутки та оренду землі."

blc_wolf_in_sheep_skin:0 "Вовк у Овечій Шкурі"
blc_wolf_in_sheep_skin_desc:0 "Хани кажуть, що шукають мирного життя, але багато з них залишились тими ж жорстокими рейдерами з Заходу. Проте, вони можуть стати непоганими торговими партнерами."

blc_envoy_sent_lovell:0 "Ми відправили посольство до §Y[KHA.GetName]§!!"

blc_foster_trading_ties:0 "Підтримати Торгівлю з Вайомінгом"
blc_foster_trading_ties_desc:0 "У міру стабілізації Ханів і їхніх зв’язків по Вайомінгу, ми можемо скористатись їхньою економічною мережею й спрямувати її у власні структури."

blc_monopoly_on_river:0 "Монополія на Річці Платт"
blc_monopoly_on_river_desc:0 "Хани не мають досвіду у річковій торгівлі. Замість того щоб їх витісняти, ми можемо запропонувати угоду: вони надають нам доступ до їхніх річкових об’єктів, а ми допоможемо їм з розвитком на суші. Вигідно всім."

blc_monopoly_on_river_tt:0 "§gХани не мають потреби в річці. Ми запропонуємо спільний проєкт індустріалізації:\nМи допоможемо їм побудувати §Gзбройові заводи§! на березі, а вони нам — §Gверфі§!.\n§RВони також погодяться відмовитись від доступу до річки.§!"

blc_detour_to_missouri:0 "Обхідний Шлях до Міссурі"
blc_detour_to_missouri_desc:0 "Ріка Міссурі багата на ресурси. Хоча водний шлях довгий, шлях сушею через Вайомінг значно коротший. Якщо налагодити зв'язок — можна відкрити торгівлю з Вугільним Консорціумом. Хоча тягнути вугілля брахмінами додому буде важко."

blc_detour_to_missouri_khan:0 "Обхідний Шлях до Міссурі"
blc_detour_to_missouri_khan_desc:0 "Ріка Міссурі багата на ресурси. Хоча водний шлях довгий, шлях сушею через Вайомінг значно коротший. Якщо налагодити зв'язок — можна відкрити торгівлю з Вугільним Консорціумом. Хоча тягнути вугілля брахмінами додому буде важко."

blc_envoy_sent_rosebud:0 "Ми відправили торгову делегацію до §Y[1046.GetName]§!!"

blc_waterway_to_river_league:0 "Водний Шлях до Ліги Річок"
blc_waterway_to_river_league_desc:0 "Після підписання угод ми нарешті можемо вирватись із нашого кутка річки і попливти далі. Міссурі, Міссісіпі і Ліга Річок... наші майбутні партнери вже близько."

blc_waterway_to_river_league_khan:0 "Водний Шлях до Ліги Річок"
blc_waterway_to_river_league_khan_desc:0 "Після підписання угод ми нарешті можемо вирватись із нашого кутка річки і попливти далі. Міссурі, Міссісіпі і Ліга Річок... наші майбутні партнери вже близько."

blc_the_boat_never_sinks:0 "«Човен» Ніколи Не Тоне"
blc_the_boat_never_sinks_desc:0 "Знадобилося півпустки, аби не дати йому затонути — але ми змогли. Місто відродилося завдяки іноземному фінансуванню й допомозі. Тепер ми можемо підтримувати себе самі — і фінансово, і морально."

### Торгові Угоди

blc_way_of_canaanities:0 "Шлях Ханаанців"
blc_way_of_canaanities_desc:0 "Торговці з Нью-Ханаану знали, як налагоджувати маршрути: хороші дороги та добре охоронювані каравани завжди доходили до цілі. Чудовий рецепт для наслідування!"

blc_tax_our_roads:0 "Оподаткування Доріг"
blc_tax_our_roads_desc:0 "Ще один спосіб заробити на караванах — запровадити мито. Хоч ніхто не любить платити за проїзд, зате дороги будуть безпечними, а зупинки — з їжею й напоями. Можливо, вони охоче віддадуть зекономлені на охоронцях капси."

blc_leisure_fair_model:0 "Модель «Розваги та Рівність»"
blc_leisure_fair_model_desc:0 "Торгівля — це не лише продаж, а й прийом. Щоб бути ефективними, слід торгувати тим, чого людям бракує. А це — речі екзотичні, незвичні. Розваги, розкіш і справедливість у ціноутворенні — ось канонічна формула ханаанців."

blc_mormon_assistance:0 "Людина з Місією"
blc_mormon_assistance_desc:0 "Наш головний контакт серед мормонів — місіонер Саутвік. Блискучий оратор, вправний торговець, натхненний проповідник — він звернув чимало Розписаних. Якщо його місія стане постійною, ми отримаємо безцінну допомогу в логістиці."

blc_focus_on_luxury_goods:0 "Упор на Товари Розкоші"
blc_focus_on_luxury_goods_desc:0 "Хоч торгівля розкішшю — це традиційна фішка ханаанців, додатковий акцент на цьому точно не завадить. Наша публіка буде щаслива від зайвого алкоголю і тютюну, яких сама зробити не може."

blc_invite_crimson_caravan:0 "Запросити Менеджера Кривавої Каравані"
blc_invite_crimson_caravan_desc:0 "Хоч ми й далеко від їх звичних маршрутів, їхній досвід буде нам дуже корисним. Якщо чесно — вони нічого не втратять у цій угоді. Можливо, в майбутньому вони навіть відкриють тут повноцінне відділення."

blc_acquire_monopoly:0 "Отримати Монополію на Загальні Товари"
blc_acquire_monopoly_desc:0 "А знаєте, що краще за торгівлю рідкісним і екзотичним? Торгівля звичайними речами, які потрібні кожному! Чому їх купуватимуть? Бо ми отримаємо монополію. Ми — єдині, хто має право їх продавати. А хто проти — той іде в Тюрму."

blc_scrap_competition:0 "Позбутися Конкуренції"
blc_scrap_competition_desc:0 "Конкуренція — добре для капіталізму, але ми тут, щоб швидко збагатитись, а не майбутнє будувати. Переконаємо інших торговців піти з ринку... законно чи не зовсім."

blc_establish_crimson_caravan_branch:0 "Відкрити Відділення Кривавої Каравані"
blc_establish_crimson_caravan_branch_desc:0 "Кривава Каравана швидко знайшла свою вигоду і вже заробила на нас купу капсів. Вони настільки задоволені, що готові відкрити власну філію у нашій столиці. Їхній перший караван вже вирушив з Нью-Вегаса."

blc_establish_crimson_caravan_branch_swap_traits_tt:0 "§YГенрі Джеймісон:§! замінити рису §RНевблаганний Капіталіст§! на §YДілова Кмітливість§!\nФактичні Зміни:\n£resources_texticon  Приріст ресурсів: §G+10.00%§!\n£construction_speed_texticon  Швидкість будівництва: §G+3.00%§!\nДохід у капсах: §G+10.00%§!"

blc_fund_three_some_caravan:0 "Фінансувати Караванну Компанію «3-Самі»"
blc_fund_three_some_caravan_desc:0 "Під проводом трійні Джордано, «3-Самі» — найкращий приклад, що колишні ув'язнені можуть бути не рейдерами, а підприємцями. Їхній приклад дуже допоможе у реабілітації та інтеграції екс-рейдерів."

blc_support_local_entrepreneurs:0 "Підтримати Місцевих Підприємців"
blc_support_local_entrepreneurs_desc:0 "Усе необхідне вже тут. Якщо дати людям змогу змагатись, економіка тільки виграє. Потрібно лише вибрати найкращих і кинути їм стартовий капітал."

blc_second_chance_program:0 "Програма Другого Шансу"
blc_second_chance_program_desc:0 "Не всім в'язням потрібно брати гвинтівку й іти в рейдери. За підтримки сім'ї Джордано ми можемо започаткувати програму робочого звільнення: ув'язнені отримають шанс працювати — ми ж отримаємо робочу силу."

blc_assisted_reintegration_program:0 "Програма Підтриманої Реінтеграції"
blc_assisted_reintegration_program_desc:0 "Навіть стара собака може вивчити нові трюки. А колишній рейдер може займатись чимось іншим, окрім грабунків. Так, робота здається нудною після пригод, але вона безпечна... і дає пенсію."

blc_recruit_the_triplets:0 "Найняти Родину Джордано"
blc_recruit_the_triplets_desc:0 "Родина Джордано — втілення старої Американської Мрії: від дна до вершини. Вони не гуру торгівлі, але харизматичні торговці. Їх можна призначити Трійцею при нашому Торговому Офісі."

blc_import_coffee:0 "Імпортувати Каву"
blc_import_coffee_desc:0 "Це легально, чесно."

blc_tap_into_arms_market:0 "Увійти на Ринок Зброї"
blc_tap_into_arms_market_desc:0 "Права на франшизу Gun Runners обійдуться дорого? Побачимо, що з цим зробити."

blc_organized_trade:0 "Упорядкувати Торгівлю"
blc_organized_trade_desc:0 "Яку роботу обрати, який маршрут найменш небезпечний, як знайти хороших охоронців — у цій справі багато нюансів. Без організації усе швидко заглохне. Та тепер у нас є досвід, який можна передати новим поколінням."

blc_organized_trade_tt:0 "§GЦе об'єднає всі попередні Великі Бізнеси в один потужніший Бізнес!§!"

blc_kickstart_our_economy:0 "Запустити Економіку"
blc_kickstart_our_economy_desc:0 "Ми назбирали вдосталь капсів, щоби витягнути економіку з багна. Побудувати нові робочі місця, переоснастити обладнання тощо. Тепер у нас є промислова база, і ми можемо планувати розвиток. Можна вважати, що цю битву ми виграли."

blc_canaanite_development:0 "Ханаанський Розвиток"
blc_canaanite_development_desc:0 "Ханаанці задоволені нашими торговими угодами і готові виділити капси на економічний розвиток. Їм це також буде вигідно... мабуть."
blc_professional_development:0 "Професійний Розвиток"
blc_professional_development_desc:0 "Кривава Каравана хоче вкласти кошти у свої об'єкти та спорядити охоронців за каліфорнійськими стандартами. Ми не бачимо причин відмовляти."

blc_local_development:0 "Місцевий Розвиток"
blc_local_development_desc:0 "Ми готові влити капси у свою економіку, щоб розвинути промисловість. Сім’я Джордано з екс-рейдерами зможе відкрити кілька майстерень — якщо ми їм позичимо трохи капсів. А чому б і ні?"

blc_cooperation1:0 "Співпраця з Необхідності"
blc_cooperation1_desc:0 "Три фракції Чорного Каньйону працюють разом лише тому, що не мають іншого вибору, аби вижити. Хоч ця співпраця й дуже хитка, кожна з них насторожено стежить за іншими. Поки Караван зберігає рівновагу — Чорний Каньйон існує."

blc_stories_of_shaman:0 "Оповіді Шамана"
blc_stories_of_shaman_desc:0 "Нещодавно Вартовий сів на Розмальований Трон племені Розмальованих Людей, після того як його попередник, Швидка Гадюка, був «дружньо» зміщений. Вартовий — колишній рейдер із Тіббетса — робить співпрацю з ним ще складнішою, але поки ми не загрожуємо його позиції, він буде корисним. Його народ живе просто й має намір так і жити далі."

blc_teachings_of_mish:0 "Мормонська Медицина"
blc_teachings_of_mish_desc:0 "Як і інші примітивні племена, Розмальовані Люди вже мали справу з мормонськими місіонерами з Нью-Ханаану. Їхній вплив тут менший, здебільшого через наше втручання. Плем’я вже спробувало мормонську медицину — і готове ділитися нею з нами."

blc_drums_of_war:0 "Барабани Війни"
blc_drums_of_war_desc:0 "Розмальовані Люди палають реваншизмом — хочуть іти на південь і «об’єднати племена під одним знаменом». Ми не почнемо безглузду війну, але можемо дозволити їм підготуватись до конфлікту. Це зробить їх доступними для нас у разі війни."

blc_men_no_night:0 "Використати Покинуте Узбережжя"
blc_men_no_night_desc:0 "Після того як Ямпани відступили, вони знищили свою верф у затоці. Це залишило багато вільного простору. Розмальовані Люди були б раді новій майстерні списів..."

blc_true_religion:0 "Порушити Мовчанку"
blc_true_religion_desc:0 "Досі Вартовий і його народ були мовчазні щодо справ Федерації. Коли дійде до вибору, ми можемо стати на їхній бік — і тоді небо роздеруть бойові кличі. Можливо, лідер навіть трохи заспокоїть свою параною..."

blc_true_religion_tt:0 "§YТрибуни§! §gзаспокояться, припинять створювати проблеми, але їх фракція НЕ буде розпущена.\n§RЕфект триває 180 днів.§!"

blc_true_religion_swap_traits_tt:0 "§YВартовий:§! змінити рису §YКенд Розмальованих§!:\n£stability_texticon  Стабільність: §G+5.00%§!\n£research_speed_texticon  Швидкість досліджень: §G+2.50%§!\n£military_theorist_cost_texticon  Вартість теоретиків: §R+50%§!"

blc_dead_men_tell_no_tales:0 "Мертві Не Розповідають Історій"
blc_dead_men_tell_no_tales_desc:0 "Маллет і рейдери з Тіббетса завжди були найменшою загрозою серед фракцій Компромісу. Вони страшні — але знають, що ми можемо стерти їх із лиця землі. Якщо тримати їх під контролем — буде кому йти на війну."

blc_raiding_in_orderly_fashion:0 "Організовані Рейди"
blc_raiding_in_orderly_fashion_desc:0 "Рейдери в нашій армії — справжній головний біль. Вони не люблять підкорятись наказам. Потрібно нагадати їм про Компроміс і наслідки непослуху — цього має вистачити."

blc_booze_jet_and_rocknroll:0 "Бухло, Джет і Рок-н-Рол"
blc_booze_jet_and_rocknroll_desc:0 "В’язні — грубуватий народ. Їм до вподоби випивка, наркотики типу джету, самогон — і, страшно сказати, рок-музика! Варварство й незаконність у нашій країні. Але аби тримати їх у вузді — доведеться піти на деякі поступки. Хай вже собі катаються камені..."

blc_renegotiation_of_compromise:0 "Перегляд Компромісу"
blc_renegotiation_of_compromise_desc:0 "Компроміс дає рейдерам права в обмін на службу в армії. Це колись було зручно, але час усе змінює. Їм доведеться інтегруватись у суспільство, і ми їх до цього підштовхнемо."

blc_renegotiation_of_compromise_tt:0 "§YРада Рейдерів§! §gбуде задоволена поступками, і припинить заважати, але їх фракція НЕ буде розпущена.\n§RЕфект триває 180 днів.§!"

blc_legend_of_our_people:0 "Легенда Нашого Народу"
blc_legend_of_our_people_desc:0 "Берхард, Лорд-Мер Ямпанської Коаліції, має великі плани щодо реформ торгівлі й економіки Чорного Каньйону. Та він настільки амбітний, що одного дня може відібрати у нас кермо. Нам доведеться стати противагою його надмірним реформам, перш ніж він зруйнує більше, ніж розуміє."

blc_eighth_tax_act:0 "«Восьмий» Податковий Акт"
blc_eighth_tax_act_desc:0 "Податковий акт досить простий: кожна восьма торба врожаю віддається як податок. Або ж еквівалент у капсах."

blc_safe_waters_act:0 "Акт про Безпечні Води"
blc_safe_waters_act_desc:0 "Затока погано захищена. Цей акт дозволить вкладати капси в морську інфраструктуру."

blc_expand_campment_shipyards:0 "Розширити Верфі Кемпмента"
blc_expand_campment_shipyards_desc:0 "Це не найкращі корабели у світі, але якщо їм платять, вони перетворять свою затоку на справжню гавань."

blc_bureaucratic_disentanglement:0 "Акт про «Бюрократичне Розплетення»"
blc_bureaucratic_disentanglement_desc:0 "Спільнота — це коаліція, тобто об'єднання рівноправних міст у рамках рівноправної федерації. Це вже само по собі плутає, але додаткова бюрократія ще більше гальмує взаємодію між Чорним Каньйоном і Ямпою. Це — щось, що ми можемо виправити."
blc_bureaucratic_disentanglement_tt:0 "§YЯмпанська Річкова Коаліція§! §gзаспокоїться і припинить створювати проблеми. Їх фракція не буде розпущена.\n§RЕфект триватиме 180 днів.§!§!"
blc_bureaucratic_disentanglement_swap_traits_tt:0 "§YБерхард Ріверс:§! змінити рису §!Лорд-Мер§!:\n£political_power_texticon  Приріст політичної влади: §G+10%§!\n£economy_laws_cost_texticon  Вартість економічних законів: §R+50%§!\n£trade_laws_cost_texticon  Вартість торгових законів: §R+50%§!"

blc_grand_gathering:0 "Велике Зібрання 2278 Року"
blc_grand_gathering_desc:0 "Зібрання — це двомісячні наради Чорного Каньйону, де уповноважені делегати обговорюють тонкощі співпраці. Але Велике Зібрання — це щорічна публічна подія, на яку може прийти представник будь-якого члена Федерації. Також її транслюють у прямому ефірі. \nЦе завжди викликає жвавий інтерес — і через політичні події, і через фестивальну атмосферу в столиці. \n\nЦьогорічне Зібрання обіцяє бути ще цікавішим..."
blc_grand_gathering_tt:0 "§gФокус буде автоматично завершено на початку 2278 року. Всі попередні фокуси гілки будуть автоматично пропущені, якщо не завершені до того часу.§!\n§RМожна назавжди втратити можливість впливати на війну фракцій Чорного Каньйону.\n\nВас попереджено.§!"

### Home Affairs 2 - Electric Boogaloo

blc_prisoners_dilemma:0 "Дилема В’язнів"
blc_prisoners_dilemma_desc:0 "Ця дилема стара як і сама наша держава. Ми прийняли рейдерів у кооператив, але багато їхніх друзів і досі гниють у в'язниці Тіббетс, яку ми відновили. Вони — загроза. Вони — корисні. Як би там не було, з цим треба щось робити."

blc_side_line_raiders:0 "Хліба і Видовищ"
blc_side_line_raiders_desc:0 "Фраза «Panem et Circenses» походить із [CES.GetName], і, мабуть, це єдина ідея, варта запозичення. Рейдери Тіббетса втомились і ослабли, їхнє політичне становище майже знищено. Якщо дати їм трохи видимих поступок — ми остаточно відсунемо їх на узбіччя історії."
blc_side_line_raiders_diana_will_remember_this:0 "[TTM.GetFlag] §RDiana запам’ятає це.§!"

blc_refill_our_prison:0 "Заповнити Великий Купол"
blc_refill_our_prison_desc:0 "Просто заарештувати всіх — порушить дух Компромісу, і ми втратимо купу навчених солдатів. Але це — найшвидше та найпростіше рішення. А такі завжди дуже привабливі."
blc_refill_our_prison_diana_will_remember_this:0 "[TTM.GetFlag] §MDiana буде вдячна за це.§!"

blc_raider_deal:0 "Угода з Рейдерами"
blc_raider_deal_desc:0 "Кліка Маллета нарешті загнана в кут — чи то розпадом, чи тиском. Фактично, його банда нарешті розпускається."
blc_raider_deal_tt:0 "§gКліка Маллета втратить увесь вплив у політичному житті §Y[BLC.GetName]§!, і поступово інтегрується в суспільство. Довгенько це затяглось, еге ж.§!"

blc_from_same_cradle:0 "З Одної Колиски"
blc_from_same_cradle_desc:0 "Кенде, або Вищий Шаман Розмальованих Людей, колись теж був в'язнем Тіббетса, як і багато наших рейдерів. Їхній світогляд відрізняється, але деякі цілі збігаються. Це відкриває шлях до співпраці."

blc_ancient_ways_of_battle:0 "Розмальоване Військове Мистецтво"
blc_ancient_ways_of_battle_desc:0 "Вони бронюються до зубів і несуть найдовші списи. Просте формування в бойові групи — ось як воюють Розмальовані Люди. Їх примітивна зброя дає асиметричну перевагу у світі плазмової зброї і вертибердів."

blc_ways_of_painted_men:0 "Шлях Розмальованих Людей"
blc_ways_of_painted_men_desc:0 "Прості люди, які вірять у магію татуювань і живуть у тіні Скелястих гір. Вони знають землю краще за всіх. І хоча це лише одна з гілок Розмальованих Племен Колорадо — вони не самотні. Це не варвари, як вважав Баттері. Вони просто живуть ще простіше, ніж його народ на Месі. Якщо ми будемо слухати — навчимося чимало."

blc_warded_reward:0 "Нагорода для Вартового"
blc_warded_reward_desc:0 "Вірність має свою ціну. А Вартовий має багато скарбів, якими може поділитися. Якщо він оберне свою силу й хитрість проти наших ворогів і не заважатиме демократії — з нього може вийти наш найсильніший союзник."
blc_warded_reward_swap_traits_tt:0 "§YВартовий:§! замінити §!Кенде Розмальованих§! на §YГолова Розмальованого Народу§!\nЗміни:\n£stability_texticon  Стабільність: §G+5.00%§!\n£war_support_modifiericons_texticon  Підтримка війни: §G+10.00%§!\n£research_speed_texticon  Швидкість досліджень: §G+10.00%§!\n£military_theorist_cost_texticon  Вартість теоретиків: §R+50%§!\nЩоденна підтримка інтелектуалів: §R-0.01§!"

blc_warded_reward_swap_traits_alt_tt:0 "§YВартовий:§! замінити §!Кенде Розмальованих§! на §YГолова Розмальованого Народу§!\nЗміни:\n£stability_texticon  Стабільність: §G+10.00%§!\n£war_support_modifiericons_texticon  Підтримка війни: §G+10.00%§!\n£research_speed_texticon  Швидкість досліджень: §G+12.50%§!\n£military_theorist_cost_texticon  Вартість теоретиків: §R+100%§!\nЩоденна підтримка інтелектуалів: §R-0.01§!"

blc_tribalist_democracy:0 "Триболістська Демократія"
blc_tribalist_democracy_desc:0 "Вартовий — не наш безумовний союзник. Ми можемо встановити більш гнучкого очільника Племен Розмальованих, якщо підштовхнемо їх до відкритого демократичного процесу обрання вождя. І звісно, ми 'підкажемо' їм правильний вибір."
blc_tribalist_democracy_tt:0 "§gМи підірвемо легітимність §Y[BLC_warded.GetName]§!, пропагуючи демократію й підтримуючи наступника, забезпечуючи плавний перехід у разі його смерті.§!"

blc_eagle_and_bison:0 "Просто за Річковим Поворотом"
blc_eagle_and_bison_desc:0 "Лорд-Мер Ямпанів, Берхард, насправді не такий вже й далекий від Баттері. Так, грубіший, прямолінійніший і нетерплячіший, але дивиться на речі подібно до нас. Можливо, піти слідом за Ріверсами — не така вже й погана ідея..."

blc_reward_loyal_mayors:0 "Нагородити Вірних Мерів"
blc_reward_loyal_mayors_desc:0 "Серед Ямпанів є мери, які поділяють світогляд Караванного Конгресу і були б покірними союзниками. Чого не скажеш про Берхарда. Було б чудово, якби ми могли замінити його кимось... безпечнішим."
blc_reward_loyal_mayors_tt:0 "§gМи підірвемо легітимність §Y[BLC_bearhard.GetName]§!, пропагуючи демократію й підтримуючи наступника, забезпечуючи плавний перехід у разі його смерті.§!"

blc_codify_special_status:0 "Кодифікувати «Особливий Статус» Коаліції"
blc_codify_special_status_desc:0 "Ми зобов’язалися ставитись до Коаліції як до союзника. Навіщо псувати це, змушуючи їх приймати рішення, які вони зненавидять? Якщо ми закріпимо їхню особливу позицію, то ще можемо отримати з цього вигоду. Вони багато чого можуть нас навчити щодо річкової торгівлі."

blc_blue_trade_route:0 "Акт про Блакитний Торговий Шлях"
blc_blue_trade_route_desc:0 "Ми повинні використовувати нашу річку для розширення торгових операцій. Брамини — це добре, але кораблі рухаються швидше, далі й перевозять більше вантажу."

blc_rivers_flow_our_way:0 "Річки Течуть Нашим Руслом"
blc_rivers_flow_our_way_desc:0 "Вплив родини Ріверс лише зростав із часу, як ми закріпились у регіоні, й це було вигідно для всіх. Та мудра людина знає, коли карати, а коли нагороджувати... і схоже, настав час дати щось у відповідь."
blc_rivers_flow_our_way_swap_traits_tt:0 "§YБерхард Ріверс:§! замінити §!Лорд-Мер§! на §YВедмідь Ямпи§!\nЗміни:\n£political_power_texticon  Приріст політичної влади: §G+15%§!\n£political_power_texticon  Щоденна політична влада: §G+0.10§!\n£stability_texticon  Стабільність: §G+10.00%§!\n£economy_laws_cost_texticon  Вартість економічних законів: §R+50%§!\n£trade_laws_cost_texticon  Вартість торгових законів: §R+50%§!\nЩоденна підтримка еліт: §R-0.01§!"
blc_rivers_flow_our_way_swap_traits_alt_tt:0 "§YБерхард Ріверс:§! замінити §!Лорд-Мер§! на §YВедмідь Ямпи§!\nЗміни:\n£political_power_texticon  Приріст політичної влади: §G+25%§!\n£political_power_texticon  Щоденна політична влада: §G+0.10§!\n£stability_texticon  Стабільність: §G+10.00%§!\n£economy_laws_cost_texticon  Вартість економічних законів: §R+100%§!\n£trade_laws_cost_texticon  Вартість торгових законів: §R+100%§!\nЩоденна підтримка еліт: §R-0.01§!"

blc_reinforce_secularism:0 "Укріпити Світськість"
blc_reinforce_secularism_desc:0 "Світськість — важлива частина нашого суспільства. Стримування релігійного впливу допоможе захистити наші урядові процеси — як-от маразматичні промови Вартового чи місіонерство кананітів. Це корисний інструмент, і ми зміцнимо його позиції в усіх сферах."

blc_coalition_centralization_act:0 "Акт про Централізацію Коаліції"
blc_coalition_centralization_act_desc:0 "Консолідувати владу над Ямпанами важко через їхню фрагментовану структуру. Але ми можемо змусити їх злитись у єдину політичну сутність. Гарна казочка й пара хабарів — і справа зроблена."

blc_contrariety_of_office:0 "КООП"
blc_contrariety_of_office_desc:0 "Пропозиція про Несумісність Посад. Ніхто не зможе обіймати посади, що дають будь-якій фракції надмірну перевагу. Це не позбавляє влади напряму, але дозволяє зберігати централізований баланс. Недосконало, але кращого у нас немає."

blc_consolidate_caravan_thirteen_position:0 "Консолідувати Вплив Каравану"
blc_consolidate_caravan_thirteen_position_desc:0 "Ми інтригували, домовлялись і йшли на компроміси, але зрештою — лише ми залишились як справжня політична сила в Чорному Каньйоні. Ми — це Зібрання. Ми вирішуємо долю нації. І тільки ми."

blc_new_face_for_tribals:0 "Повернення Швидкого Аспа"
blc_new_face_for_tribals_desc:0 "До приходу Вартового, Великим Шаманом був Швидкий Асп. Після відставки він відійшов від політики, але ми можемо повернути його до влади. Він завжди виступав за співпрацю між племенами — що ідеально підходить до наших майбутніх планів."
blc_new_face_for_tribals_tt:0 "§g§YПлемінна Рада§! перестане створювати проблеми в нашій державі.§!"

blc_great_unificator:0 "Великий Об’єднувач"
blc_great_unificator_desc:0 "Баттері з Меса Верде. Людина, що йшла поруч із Ув'язненим, зустрічалася з богинею Діаною, пройшла води й полум’я Єрихона, керівник Каравану-13. Людина, що об'єднала народи Скелястих гір — від примітивних до цивілізованих. Людина, що боролась за свій дім із наймогутнішими силами Колорадо. Баттері Скель, Баттері Великий Об'єднувач. Кожна історія потребує героя, кожна земля — легенди. Колорадо отримав і те, й інше в одній особі."

blc_new_face_for_settlers:0 "Переконати Коду Зайняти Місце"
blc_new_face_for_settlers_desc:0 "У родини Ріверсів більше ніж один здібний державник, і старий Кода Ріверс значно поступливіший, ніж його син. Хоч він і був лише мером свого рідного міста Медісін, політичного досвіду йому не бракує. Він у відставці, але ми могли б повернути його, щоб замінити сина як лідера Коаліції."
blc_new_face_for_settlers_tt:0 "§g§YГільдія Торговців§! припинить створювати проблеми в нашій країні.§!"

blc_united_we_stand_strong:0 "Єдині Ми — Сила"
blc_united_we_stand_strong_desc:0 "Тепер, коли ми приборкали наше Триголове Чудовисько за допомогою найяскравіших умів Колорадо, настав час поширити це величчя за межі наших кордонів. Наші колишні союзники, які разом з нами протистояли Псобіям, досі животіють у злиднях, не виграючи битви з Пусткою.\nМи запропонуємо їм шанс добровільно приєднатись до нашої адміністрації. Якщо ж відмовлять... кожній глухомані потрібен хтось, хто почистить їх болото."
blc_united_we_stand_strong_tt:0 "§gКоли ми вимагаємо васалізації, інша сторона більш схильна прийняти її мирно, якщо у нас високі відносини та/або сильна армія. Без цього вони, скоріше за все, відмовлять від нашої «пропозиції».§!"

blc_northern_states_development:0 "Розвиток Північних Штатів"
blc_northern_states_development_desc:0 "Населення Західного Схилу можна умовно поділити на північні та південні штати, і саме північні більш розвинені промислово. Щоб інтегрувати їхню економіку, ми маємо забезпечити їх ресурсами та відкрити філію нашої збройної промисловості, щоб вони ефективно підтримували наші майбутні кампанії."

blc_another_people_treasure:0 "Скарб Інших Людей..."
blc_another_people_treasure_desc:0 "Фораджери — найбільш приязна банда збирачів, що билися з Псобіями. Спільний ворог об’єднав нас, і зараз ми знову пліч-о-пліч — а їхні навички стануть нам у пригоді. Те, що для когось мотлох, для Фораджерів — можливість."

blc_without_metal_detectors:0 "Сяюча Талановитість"
blc_without_metal_detectors_desc:0 "Фораджери не лише вправні у збиранні металобрухту, а й мають неабиякий хист у роботі з електронікою. Їхня радіотехніка випереджає будь-якого сусіда — тож ми використаємо їхні напрацювання для власних розробок."

blc_from_battlefields:0 "З Полів Бою"
blc_from_battlefields_desc:0 "У Пустці ніщо не пропадає дарма — поетично, чи не так? Безліч полів битв, де іржавіє спорядження і лежать тіла... і навряд чи мертві заперечать, якщо ми використаємо їхнє майно. Назвемо це... розширеною переробкою."

blc_explosive_talent:0 "Вибуховий Талант"
blc_explosive_talent_desc:0 "Клеймджампери також збирають метал у Денвері, хоча значно агресивніші за сусідів. Тим не менш, їх можна переконати й не доводити справу до спротиву. Їхня спеціалізація — вибухівка. Ми, звісно ж, реквізуємо їхні динамітні запаси... про всяк випадок."

blc_boring_way_of_explosives:0 "Нудне Використання Вибухівки"
blc_boring_way_of_explosives_desc:0 "Хоч їм це і не подобається, динаміт був створений як інструмент для копання. Від розчищення завалів до масштабного видобутку — Клеймджампери можуть бути корисні не лише на війні. Хоч і знудяться трохи."

blc_very_fun_way_of_explosives:0 "Дуже Веселе Використання Вибухівки"
blc_very_fun_way_of_explosives_desc:0 "Знаєш, що можна підірвати? Та що завгодно! У цьому й краса. Якщо ми дамо змогу найрозумнішим рейдерам Клеймджамперів навчити нас створювати потужніші, більші й барвистіші вибухівки — наша армія лише виграє. Хто сказав, що хімія нудна?"

blc_southern_states_development:0 "Розвиток Південних Штатів"
blc_southern_states_development_desc:0 "Південні штати Західного Схилу — більш відсталі, і потребують інфраструктури та розвитку цивільної промисловості. Якщо ми хочемо інтегрувати їх економіку — доведеться вкластися. Людина праці — запорука процвітання, рано чи пізно."

blc_praise_metal_snake:0 "Слава Великій Ревучій Машині!" #Solid Metal Snake — зрозуміли, зрозуміли ;)
blc_praise_metal_snake_desc:0 "Плем’я Залізних Колій — родичі Розмальованих Людей. Вони відкололися та подались на південь, слідом за залізницею — звідси й назва. Їхня релігія еволюціонувала від татуювань до поклоніння потягу та його маршрутам, хоча легенди ті самі, лише імена змінено. Одне ясно — вони вміють транспортувати вантажі по Залізних Лініях, і ми використаємо цю навичку собі на користь."

  #blc_follow_metal_lines:0 "Follow the Metal Lines"
  #blc_follow_metal_lines_desc:0 "The people of Circle Junction really depend on the old railway lines of the area, but on the other hand, they're quite handy when it comes to travelling on them or maintaining its functionality. If we invite one of the tribesmen to "help expand the Great Roaring Machine's domain", we could chart over mountains, swamps and hills, all over the continent with ease."
blc_secrets_of_line_following:0 "Таємниці Слідування Лініями"
blc_secrets_of_line_following_desc:0 "Слідувати Залізницям — справа непроста. Вони довгі, часто зруйновані, й без спеціальних інструментів чи транспорту це було б неможливо. Транспортери Залізних Ліній хоч і не надто швидкі чи витривалі, зате дуже добре адаптуються до місцевості й дивовижно легкі. Ідеальна основа для наших майбутніх досліджень транспортних засобів."

blc_foundations_of_mathematics:0 "Основи Математики"
blc_foundations_of_mathematics_desc:0 "Шифрувальники — мабуть, найкращі математики у всій Пустці. Як нащадки вчених з південного дослідницького комплексу, вони добре вивчили методи, але забули їхню мету. Їхні креслення на Месі містять багато сирих креслень, які ми можемо відтворити й використати для власного прогресу."

blc_ciphers_themselves:0 "Бібліотекарі Александрії"
blc_ciphers_themselves_desc:0 "Шифрувальники — цікавий народ. Їхня мова сама по собі криптована, а числова містика й забута мета ще більше віддаляє їх від звичного пусткового життя. Здається, навіть прості шифри й слова можуть приховати важливу інформацію — цим можуть скористатися наші офіцери."

blc_secrets_of_laser_revealed:0 "Схеми Лазерної Зброї"
blc_secrets_of_laser_revealed_desc:0 "Стандартна лазерна зброя, відома як «лазерний пістолет» або «світлопал» у Шифрувальників, не надто складна. Але наявність повного креслення й людини, яка може пояснити кожну деталь, — значно полегшує інтеграцію в нашу військову промисловість."

blc_federation_in_rockies:0 "Федерація у Скелястих Горах"
blc_federation_in_rockies_desc:0 "Ми нарешті готові формалізувати нашу Федерацію! Більше жодних компромісних коаліцій — ми справжня нація Пустки, що зростає й міцніє!"

blc_was_nice_to_ttm:0 "§YБатарея§! зумів мирно вирішити §Yкризу біженців Племені Близнюків§!."

blc_corist_cost_25:0 "Постійне зниження вартості інтеграції територій на §G25%§!"

blc_my_old_home:0 "Мій Старий, Милосердний Дім..."
blc_my_old_home_desc:0 "§g«Туга за домом убиває мене». — Батарея§!\n\nХоч він і не приховував цього, не всі знають, що Батарея народився в племені Шифрувальників. Дух мандрів спонукав його рано покинути рідний дім, і з того часу минуло кілька десятиліть. Можливо, час відвідати минуле."

blc_my_old_job:0 "Моя Стара Робота..."
blc_my_old_job_desc:0 "§g«Єрихон, Єрихон... це місто гріха й води». — Батарея§!\n\nБатарея провів молодість у Єрихоні, місті в тіні Нью-Ханаану — до того, як «земля стала надто гарячою». Він працював на водоочисній станції, де й навчився своєї справи. Там він уперше зустрів В’язня. Навіть якщо нічого нового не знайдеться, він мусить повернутися туди."

blc_my_old_friend:0 "Мій Старий Друг..."
blc_my_old_friend_desc:0 "§g«Стара добра Тринадцята... цікаво, де вона тепер?» — Батарея§!\n\nБатарея мандрував разом із В’язнем: Меса-Верде, Єрихон, Нью-Ханаан, Центр Космосу в Блумфілді, Великий Каньйон, Купол Боулдера, Денвер, Плотина Гувера, Резервація, Тіббетс, Плем’я Близнюків і Розсадник, Бункер Максона й Уроборос... лише перелік звучить як книга. Історія, яку варто розповісти."

blc_road_of_future:0 "Прокласти Власний Шлях"
blc_road_of_future_desc:0 "Ми зосереджуємося на створенні локалізованої федерації для забезпечення нашої безпеки. Об’єднавши союзників у межах здорового партнерства, ми сформуємо фортецю проти зовнішніх загроз. Сила — у співпраці."

blc_lane_of_past:0 "Відродити Патріотизм"
blc_lane_of_past_desc:0 "Ми звертаємося всередину, зміцнюючи нашу національну ідентичність і дух. Через традиції та гордість ми прагнемо стати гравцем на політичній арені Пустки."

blc_join_midnight_union:0 "Стати на Опівнічний Шлях"
blc_join_midnight_union_desc:0 "Опівнічна Унія — союз мандрівників і ідеалістів, що оселилися на далекій півночі. Об’єднання з ними означає вибір на користь стійкості, самозабезпечення та побудови нового дому серед тіней старого світу."

blc_join_ncr:0 "Присягнути Республіці"
blc_join_ncr_desc:0 "НКР — символ порядку та стабільності. Їхня бюрократія громіздка, але безпека, торгівля й ефективне управління варті того. Якщо ми погодимось, то отримаємо надійного союзника — хоч і ціною автономії."

blc_join_ogden_treaty:0 "Підписати Оґденський Договір"
blc_join_ogden_treaty_desc:0 "Купці Оґденського Договору контролюють життєво важливу торгівлю навколо Великого Солоного Озера. Союз з ними забезпечить наше місце в прибутковій торговельній мережі й дасть стабільність через багатство та спільну оборону."

blc_invite_glw:0 "Закликати Світлячків"
blc_invite_glw_desc:0 "Світлячки — радіоактивні гулями, об’єднані дружбою й бажанням вижити. Хоч вони й обережні, наші стосунки позитивні. Їхня підтримка може стати цінним надбанням у світі, де кожен союзник — на вагу золота."

blc_invite_sie:0 "Зв'язатися з Вартовими Гір"
blc_invite_sie_desc:0 "Вартові Гір — стійка громада на півночі, яка довгий час зберігала незалежність. Запропонувавши їм місце в нашій федерації, ми отримаємо загартованих поселенців і досвідчених захисників, що зміцнять нашу справу."

blc_invite_pro:0 "Протягнути Руку Фар-Сону"
blc_invite_pro_desc:0 "Батарея вже мав справу з кротошахтарями й розуміє як їхні труднощі, так і цінність як союзників. Ізольована спільнота Фарсона роками виживала під землею, формуючи землі в спосіб, зрозумілий далеко не кожному. Запрошуючи їх, ми даємо їм місце у федерації — там, де їхні навички та витривалість служитимуть вищій меті."

### Фокуси Розмальованих

pnt_our_shaman:0 "Наш Шаман"
pnt_our_shaman_desc:0 "Легенд про нашого Кенде, Верховного Шамана, безліч — і всі вони викликають подив. Випробування, які він пережив у Тіббетсі заради магічних татуювань, були не менш жахливими, ніж епічними. Він поділився своїми видіннями, показав свої малюнки й довів своє лідерство, коли самотужки розгромив Чорний Каньйон."

pnt_war_drums:0 "Заграти Барабани Війни"
pnt_war_drums_desc:0 "Розмальовані — лише частина великого Народу Розмальованих, що мешкає в тіні Скелястих гір. Але суперечки між вождями й завойовниками з Денвера розділили наш народ. Це можна виправити лише силою й витривалістю — якраз тим, чого нам не бракує."

pnt_our_destiny:0 "Бог Допомагає Тим, Хто Допомагає Собі"
pnt_our_destiny_desc:0 "Ми віримо в силу татуювань, але також і в вищі сили. Наприклад, Арлена — Бога Татуювань, або Елохіма, Бога-Отця, та його сина Єгову. Хоча їхні вчення конфліктують, ми навчилися знаходити між ними рівновагу."

pnt_river_folk:0 "Люди Ріки"
pnt_river_folk_desc:0 "Народ біля ріки завжди був ворожим до нас. Усе, чого ми хотіли — трохи узбережжя, але вони відштовхували нас, як могли. Рано чи пізно вони нападуть, щоб захопити затоку Кемпмент. Тому краще бити першими."

pnt_secure_our_northern_border:0 "Забезпечити Північний Кордон"
pnt_secure_our_northern_border_desc:0 "Хоч ми й не маємо конфлікту з Малим Вайомінгом, він лишає наші північні землі відкритими. Захоплення території за рікою Світуотер і встановлення там оборонної лінії точно дозволить нам спати спокійніше."

pnt_mole_man:0 "Залізні Кроти"
pnt_mole_man_desc:0 "Ті залізні створіння весь час виринають із землі, наче Металеві Кроти. Вони захопили наші землі. Доведеться проломити їхні обладунки й знищити кротову гору — ми повернемо належне."

pnt_crack_cold_one_open:0 "Сховище Загибелі"
pnt_crack_cold_one_open_desc:0 "Вони вилізли з Сховища. Наш лідер чув про ці місця — люди ховалися в них, аби пережити початок Нової Епохи. Не всім це вдалося. В цих металевих коробках із миготливими вогнями та дивними комбінезонами нас цікавить лише одне — їхня броня, яку носила охорона."

pnt_consolidate_our_realm:0 "Закріпити Наші Землі"
pnt_consolidate_our_realm_desc:0 "Ми перемогли! Битва проти ув’язнених Тіббетса була першим випробуванням — і ми подолали тих, хто колись знущався з нашого Вардеда. Тепер, коли ми здійснили помсту, час узяти їхні майстерні та ресурси собі. Їхні ковалі тепер працюють на нас."

pnt_wg_dry:0 "Печерна Людина на Шляху"
pnt_wg_dry_desc:0 "Печерна Людина на заході заважає нашому поклику долі. Нам доведеться зробити ще один обхід. Ті, хто бездумно мчить до мрії, часто розбиваються об першу ж перепону. Ми чекали довго — почекаємо ще."

pnt_mining_equipment:0 "Переобладнати Шахтне Обладнання"
pnt_mining_equipment_desc:0 "Устаткування, яким вони користувалися, давно поржавіло. Без електрики й пального вони його ледве вмикали. На щастя, Вардед навчився ремонтувати техніку завдяки Програмі Умовного Звільнення Тіббетса. Він покаже нам, як оживити цих металевих звірів. А ще він був письменником... але це вже не по темі."

pnt_deepmines_riches:0 "Глибше — Більше Скарбів"
pnt_deepmines_riches_desc:0 "Плем’я Печерників знається лише на двох речах — виживанні й підривах. На жаль, шахтарі з них нікудишні. Але ми терплячі. Вони навчаться бити каміння, а не черепи. Їхню любов до вибухів ми використаємо, щоб дістатися глибших пластів вугілля."

pnt_core_dry:0 "На Чий Ти Бік?"
pnt_core_dry_desc:0 "Славетне питання, поставлене нашим Кенде. У Сухоритів був вибір: стати рабами або працювати добровільно, зберігши частину прав. Вони, без сумніву, зробили мудрий вибір."

pnt_wg_tob:0 "Забудькуваті Брати"
pnt_wg_tob_desc:0 "Ті, що поклоняються кісткам, забули про своє прадавнє коріння з нами. Вони відвернулися від фарб і чорнил, шукаючи Відповіді на Питання в Кістках Древніх. Яке дурне марення. Ми нагадаємо їм — покажемо старі символи й прадавні лінії. Ми відкриємо їм істину."

pnt_tribal_methods:0 "Магія Кісток"
pnt_tribal_methods_desc:0 "Вони вірять, що Кістки наділені таємничими магічними властивостями, що дозволяють бачити майбутнє й спілкуватися з Духами Древніх. Що за марновірство! Лише Лінії мають силу у цьому світі. Хоча... синкретизм із їхніми віруваннями може зміцнити й нашу правду."

pnt_burham_springs_riches:0 "Рідкісне Каміння з Палаючих Джерел"
pnt_burham_springs_riches_desc:0 "У Палаючих Джерелах можна знайти прозоре рідкісне каміння. Чужинці називають його 'ультрацит' чи щось таке. Для нас воно безкорисне, але його можна обміняти на метал для наших списів і обладунків. Вони віддають силу за блискучі камінці — і називають примітивними нас?"

pnt_core_tob:0 "Розмалювати Кістки"
pnt_core_tob_desc:0 "Розмалювати Кістки. З’єднати їхній світ із нашим. Для них кістки — це пам’ять, як і наше чорнило — написані спогади на шкірі. Ми однакові. Ми завжди були однаковими, браття."

pnt_wg_oro:0 "Убити Відьму"
pnt_wg_oro_desc:0 "Південна Відьма. Гончі Колорадо. Доньки Темного Місяця. Наш найбільший ворог — грізний і сильний. Але ми кинемо їм виклик і завоюємо їхнє велике місто. Пустка подякує нам, коли ми зруйнуємо дім цієї відьми."

pnt_brothers_and_sisters:0 "Військова Фарба для Бойових Псів"
pnt_brothers_and_sisters_desc:0 "Їхні гончі — люті, нещадні, та водночас — жахливо милі. Їхня цінність у бою й охороні племен дорівнює їхній привабливості. Ми навчимося приручати їх у колишніх Гончих, і розмалюємо їх Лініями, аби світ бачив — це наші пси тепер."

pnt_paint_the_pyramid:0 "Розмалювати Піраміду"
pnt_paint_the_pyramid_desc:0 "Піраміда — серце їхнього міста, місце, де оселилися Геката й її доньки, а також сховані всі скарби. Ми вкриємо цю споруду нашими символами — вона належить нам. І поки ми там — заберемо технології, якими Геката вже поділилася з вірними."

pnt_new_capitol:0 "Розмальована Оселя"
pnt_new_capitol_desc:0 "Оуроборос був штабом плану помсти Гекати проти Легіону. За роки він перетворився на велике місто, добре збудоване й оточене красою. Народ Розмальованих потребує нової столиці, а Колорадо хотів би забути Гекату — ми зробимо послугу всім."

pnt_our_desert:0 "Розмальована Пустеля"
pnt_our_desert_desc:0 "Розмальована Пустеля — справжня краса. Її різнобарвні скелі: від червоних до лавандових — викликають подив. Хоча це скоріше безлюдна місцина, ніж справжня пустеля, але її краса полонить нас. Ми візьмемо кожен клаптик цієї землі — тільки для нас."

pnt_our_desert_tt:0 "§gРозмальована Пустеля прекрасна, і кожен із нашого народу прагне її — ми візьмемо кожну п’ядь цієї землі.§!\nОтримуємо претензії на всі регіони §YПівнічно-Східної Аризони§! та §G-25%§! до вартості анексії в цьому регіоні."

pnt_dislodge_scavengers:0 "Витіснити Скарбошукачів"
pnt_dislodge_scavengers_desc:0 "Ми контролюємо Браму Колорадо, і тепер можемо рушити на завойовників із Денвера. Їхній прихід лише розпорошив місцеві племена. Так, вони теж біженці... але в нашому домі ми не вітаємо непроханих гостей. Це само собою зрозуміло."

pnt_paint_the_metal_hoarders:0 "Розмалювати Металевих Хапуг"
pnt_paint_the_metal_hoarders_desc:0 "Ми кличемо їх Скарбошукачами, Металевими Нахапниками, Металевими Спинами... Їх багато імен, але немає одного — Племені. Без зв’язків із Денвером, вони приречені згаснути. Та ми — народ, який приймає племена. Тож ми нанесемо фарбу й на їхні обличчя."

pnt_reunite_with_kins:0 "Возз’єднатися з Родичами"
pnt_reunite_with_kins_desc:0 "Нарешті наші рідні зовсім поруч — лиш простягни руку, й можна пригорнути їх до серця. А тепер — вислати війська, схопити вождів, і якщо вони чинитимуть опір — діяти по-звичному. Це може здатися жорстким, але... з такою родиною ти б теж зрозумів."

pnt_unite_families:0 "Об'єднати Родини"
pnt_unite_families_desc:0 "Може, вони опирались спочатку, але тепер — усі святкують разом, усі обличчя розмальовані однаково. Родини з усієї Колорадо знову під одним стягом. Дерево має глибоке коріння — і тепер, коли гілки знову з'єднані, його не зламати."

pnt_tribe_the_farthest:0 "Плем’я Надто Далеке"
pnt_tribe_the_farthest_desc:0 "Не всі Розмальовані живуть у межах Колорадо чи Спілки Чотирьох Штатів. Плем’я Розмальованої Скелі — легендарні воїни. Їхнє Випробування Скелі вижити дає лише найсильнішим. Ще одне розмальоване плем’я... що живе на месі, проходить випробування. Вони наші брати — ми нагадаємо їм про це."

pnt_painted_nation_united:0 "Об'єднана Розмальована Нація!"
pnt_painted_nation_united_desc:0 "Нарешті, всі наші люди живуть у межах наших кордонів — бачення Вардеда стало реальністю. Ще раз він довів свою велич, і хоча мало хто сумнівався в ньому, не кожен готовий був слідувати за ним у небо чи під землю. Тепер він проповідує добробут і мир, але після всіх завоювань усі не можуть не замислитися — чи справді його амбіції задоволені?"

pnt_convert_colorado:0 "Охрестити Колорадо"
pnt_convert_colorado_desc:0 "У нашому прагненні до єдності ми частково завоювали велику частину старого штату Колорадо. Цей регіон охоплює Скелясті гори — нашу Гірську Матір — і є домом для багатьох племен Розмальованого Народу. Ми маємо завершити почате."
pnt_convert_colorado_tt:0 "§gХоча ми вже здебільшого підкорили та навчили племена Колорадо про наше спільне походження, деякі все ще вислизають з наших рук. Ми швидко це виправимо.§!\nОтримати претензії на всі штати в §YКолорадо§! і знижку §G25%§! на інтеграцію регіону."

pnt_search_the_line_in_utah:0 "Юта... Саме Тут"
pnt_search_the_line_in_utah_desc:0 "На іншому березі річки Колорадо лежить земля, яку до Великої Війни називали Ютою. Там живуть численні релігійні, прості люди, які носять фарбу й Татуювання нашого Народу, і все ж ми досі не простягнули до них руку. Ми обов’язково повинні це зробити."
pnt_search_the_line_in_utah_tt:0 "§gПо той бік річки Колорадо живе багато племінних людей, що носять фарбу, але ще не знають про нашу спільну кров. Ми це змінимо.§!\nОтримати претензії на всі штати в §YЮті§!."

pnt_war_in_wyoming:0 "Війна за Вайомінг"
pnt_war_in_wyoming_desc:0 "Наш лідер, наш Кенде і Дьюла, пообіцяв мир, добробут і життя в добробуті, яке він назвав «вельфеаром», де ми не маємо боротися і можемо насолоджуватися життям. Але для цього нам потрібні ресурси — і «безшкірі», щоб працювали замість нас. На північ від нас — землі, сповнені природних ресурсів і рабської сили."
pnt_war_in_wyoming_tt:0 "§gЩоб добробут прийшов у наші землі, нам потрібні ресурси і робоча сила. Обидва легко дістати на північних рівнинах.§!\nОтримати претензії на всі штати у §YВайомінгу та Єллоустоні§!"

### Yampan Community Coalition

ymp_our_mayor:0 "Наш Лорд-Мер"
ymp_our_mayor_desc:0 "Берхард Ріверс завдяки своїм розуму, харизмі та витривалості став не лише найкращим мером у Спільноті, а й найвпливовішою фігурою в проєкті Чорний-Каньйону до його занепаду. Як Лорд-Мер, він навів лад у річці, очистив її, створив флот торговий та військовий, і привів Спільноти до процвітання."

ymp_trade_most_flow:0 "Торгівля Має Текти"
ymp_trade_most_flow_desc:0 "Торгівля — це наше життя; спільноти розкидані по всьому регіону: шахтарі загинуть без риби, лісоруби не матимуть інструментів без металу, а рибалки — вудок без дерева. Торгівля з сусідами й між собою зробила нас заможними, і ми маємо продовжувати торгувати без зупину!"

ymp_our_river:0 "І Річки Має Текти"
ymp_our_river_desc:0 "Родина Ріверсів завжди мала вплив, хоч Берхард і перевершує всіх. Їхні старі інвестиції ще досі працюють у містах Спільноти, тож настав час переосмислити ці об’єкти — Ріверс кинуть усе на захист нашої землі, і ви, громадяни, маєте зробити те ж саме!"

ymp_coalition_reorganization:0 "Реорганізація Коаліції"
ymp_coalition_reorganization_desc:0 "Нарешті ми здобули незалежність! Час святкувати!"

ymp_trade_charter:0 "Ямпанська Торговельна Хартія"
ymp_trade_charter_desc:0 "Чорний-Каньйон мав безліч торгових угод, і тепер вони перейшли нам — ми контролюємо старий флот Баттері! Треба показати пустці, що ми — спадкоємці торгівлі Чорного-Каньйону!"

ymp_dockyards_pumped:0 "Відновити Старі Верфі"
ymp_dockyards_pumped_desc:0 "По регіону є багато верфей, які ми не могли використати через бюрократичні обмеження зі Сцени. Подивимось, чи зможемо ми зробити з ними щось корисне!"

  #ymp_clean_up_dome_city:0 "Clean the Streets of Dome City"
  #ymp_clean_up_dome_city_desc:0 "Dome City's slow scrapping cannot be blamed only on the Glowbugs' laziness and high radiation, but also on the utterly terrible conditions those streets are in. The nuclear fire almost completely erased the town from the world, and if we really want to go in and secure the Dome for us, we should make way for it."
  #ymp_dome_project:0 "Project Stone"
  #ymp_dome_project_desc:0 "The Boulder Dome was never more for the Glowbugs than a rich scrapyard, never realizing what a wonderous place they sit on. Our researchers will gladly take a tour under the Dome, which will surely move forward our operations."
ymp_over_the_bend:0 "У пошуках торгових партнерів"
ymp_over_the_bend_desc:0 "Якщо ми хочемо мати значення у пустці, ми маємо робити все, що в наших силах, щоб наповнити скарбницю!"

ymp_bring_civilization:0 "Створити Торгову Лігу Платт"
ymp_bring_civilization_desc:0 "Навіщо слухати сторонніх? Ми самі собі хазяї, ми ухвалюємо рішення! Після того, як ми жили під Сценічним Куполом так довго, ми на це заслужили!"

ymp_reservation_for_two:0 "Встановити контакт з Нью-Ханааном"
ymp_reservation_for_two_desc:0 "Угода Оґдена — один із наших найкращих шансів на стабільного торгового партнера. Вона з'єднає наші торговельні маршрути з щасливими стежками караванів аж до Нового Вегаса! Тільки уявіть — товари з Ямпи по всій пустці!"

ymp_finish_what_we_started:0 "Болдерські торгові угоди"
ymp_finish_what_we_started_desc:0 "Хоча нас дратує те, що Баттері уклав угоду з Світлячками і віддав Ларамі, принцип правонаступництва держав означає, що ми не можемо просто так повернути його назад! Ми повинні вирішити, як ставитися до Світлячків — як до друзів, вшанувавши угоду, чи як до ворогів — і спробувати повернути те, що по праву наше."

ymp_colonize_glowing_lands:0 "Ми любимо Патчі..."
ymp_colonize_glowing_lands_desc:0 "Поки ми вели переговори щодо приєднання Світлячків до торгової ліги, Патчі був весь усміхнений. Попри розбіжності, краще працювати разом, ніж втратити можливого союзника."

ymp_pave_pilgrim_path:0 "...але Стітчес — справжній головний біль!"
ymp_pave_pilgrim_path_desc:0 "Стітчес дав нам 'натяки', що ніколи не працюватиме з нами. Натяки, як-от плювок у обличчя і називання нас 'гладкошкірими виродками'. Пора показати йому, хто ми такі!"

ymp_protect_our_river:0 "Ріверси пливуть річкою"
ymp_protect_our_river_desc:0 "Ріверси вже закріпили за собою добрий шмат річки, але узбережжя довге, і завжди знайдеться хтось, хто скористається цим проти нас. Наші плани вимагають повного контролю над річкою — а отже, більше бойових кораблів, щоб не дати нікому висадитися на берег."
ymp_protect_our_river_tt:0 "§gПобудуємо по §Gодній§! верфі в кожному §Yконтрольованому прибережному штаті§!, який нам належить.§!"

ymp_dockyard_development:0 "Розширити Примарну Бухту"
ymp_dockyard_development_desc:0 "Місто [1035.GetName] — не лише найважливіше в нашій Коаліції, а й найвпливовіше в усьому регіоні. У Примарній Бухті чорні плями вказують на найкращі місця для розширення наших верфей. Ми проігноруємо байки про те, що там 'водяться примари' — ці плями, мабуть, просто нафтові плями."

ymp_revoke_right_to_river:0 "Відновити Північні Караванні Стежки"
ymp_revoke_right_to_river_desc:0 "Хайленд-Вотч, колишній торговий партнер Сценічного Купола, не торгував із нами з часу нашого звільнення! Спробуємо поновити переговори з ними!"

ymp_arapho_acknowledgement:0 "Історії про Північний Союз"
ymp_arapho_acknowledgement_desc:0 "Торговці-арапахо розповідають про щось дивне, що блукає рівнинами — не королівство, не плем’я, а збірка тих, хто відмовився схилити голову. Вони звуть це Північним Союзом: мережа мандрівників, вчителів і хитрунів, які діляться знанням пошепки, прихищають нужденних і карають тих, хто жадібний до влади. Там немає лідерів — лише ті, хто знає шлях. Якщо це дійсно правда, Торговці Платт мають зустрітися з ними — не лише заради захисту, а й щоб дізнатися, що означає бути справді вільним."

ymp_rawlins_riders:0 "Легенда серед Вершників Ролінза"
ymp_rawlins_riders_desc:0 "Серед Вершників Ролінза ніхто не має більшої поваги, ніж Рейнджерка Офелія. Примара рівнин, снайперка, виживальниця — вона не служить нікому, окрім самої землі. Але Торгова Ліга Платт — не просто чергове бажаюче імперство. Якщо ми викладемо свої аргументи, можливо, вона піде з нами."

ymp_invite_for:0 "Запросити Фораджерів"
ymp_invite_for_desc:0 "Фораджери — вправні торговці з Собачого Міста, що добре розбираються в металобрухті! Запросімо їх до нашої торгової ліги, можливо, чогось навчимося!"

ymp_invite_eag:0 "Запросити Раду Народу"
ymp_invite_eag_desc:0 "Рада Народу з Іґл-Рок досить ввічливо ставиться до наших торговців! Хоча вони зазвичай уникають союзів, можливо, цього разу нас вислухають?"

ymp_herd_yourself_outta_here:0 "Веди Свою Отару К Чортам!"
ymp_herd_yourself_outta_here_desc:0 "Барон — хитрий ділок, що зробить усе, аби розбагатіти ще більше. Він захопив стада й почав продавати їх молоко та шкури до Річкової Ліги. Їхнє головне місто — не лише наш прямий конкурент, а й природно найкраще місце на річці. У нас є всі підстави відібрати його собі."

ymp_casper_wind_farm:0 "Вітрові Електростанції"
ymp_casper_wind_farm_desc:0 "Місцеві давно занедбали ці вітрові ферми, але вони не надто складні у конструкції — тож ми можемо легко їх полагодити. Додаткова енергія ще нікому не завадила. І до речі — як це взагалі 'сіяти' або 'жати' вітер?"

ymp_lead_the_brahmin_to_drink:0 "Завести Брахмінів до Води"
ymp_lead_the_brahmin_to_drink_desc:0 "Ранчери, звільнені від тиранії Барона, — дуже приязні люди. Їхнє просте життя не вимагає конфлікту. Все, чого вони хочуть — аби їхні брахміни могли пити з річки. Якщо ми не накладатимемо податків, вони залишатимуться невидимими у наших землях і охоронятимуть наші кордони. Ось такі угоди нам до душі."

ymp_best_citizen_army_out_there:0 "Найкраща Армія Громадян"
ymp_best_citizen_army_out_there_desc:0 "Це може стати несподіванкою для більшості наших сусідів, але ми ніколи не мали постійної армії — всі наші великі битви, завоювання і захист були справою наших відданих громадян. Хоч ми й надали їм усю можливу підтримку, саме їхня рішучість і воля принесли нам перемоги. Ми вдячні вам за це, Люди."

ymp_connect_to_river_league:0 "Торгівля з Річковою Лігою"
ymp_connect_to_river_league_desc:0 "Наша теперішня ситуація нарешті дозволила нам розпочати торгівлю з Річковою Лігою на Міссісіпі. Попри те, що їхні міста далеко, торгові та політичні зв’язки з їхніми лідерами точно принесуть новий рівень процвітання нашій нації!"

ymp_river_lord:0 "Лорд Річки"
ymp_river_lord_desc:0 "Родина Ріверсів, як завжди, давала обіцянки — і завжди їх виконувала. Захоплення з боку наших громадян аж ніяк не перебільшене, особливо коли вони шепочуть одне одному, що якби Берхард народився до Великого Полум’я, Великої Війни ніколи б не сталося. Він — наш великий адмірал, що міцно тримає кермо нашої долі і веде наш корабель до слави."

ymp_monopoly_on_platte:0 "Старий і Річка"
ymp_monopoly_on_platte_desc:0 "«Щодня — це новий день. Краще бути щасливим. Але я краще буду точним. Бо коли прийде удача — я буду готовий». §g— Ернест Хемінгуей, Старий і море.§!"

# Фокуси рейдерів Тіббетса

bcr_our_boss:0 "Наш Бос"
bcr_our_boss_desc:0 "МакБрайд, може, й постарів, але цей упертий виродок ще не збирається вмирати. Попри роки, він досі переважає більшість своїх спільників, сильний як віл, а прожиті роки тільки додали йому хитрості, мудрості... і жовчі. Маллет — це точно той, з ким краще не зв'язуватись."

bcr_big_top_arena:0 "Сценічний Купол — Велика Бійка!"
bcr_big_top_arena_desc:0 "Під Сценічним Куполом банда МакБрайда була королем, а після того як комплекс завалився і загрози ззовні стали реальними, усі приєдналися до його пошарпаного зеленого прапора. Але спочатку була Велика Бійка — найбільша кулачна сутичка, яку бачила пустка за останні двісті років."

bcr_hit_that_hit_that:0 "Вдар його, ще раз!"
bcr_hit_that_hit_that_desc:0 "Без вічно пильного ока Каравану ми знову можемо насолоджуватись життям. Жодних заборон на тютюн, алкоголь і, звісно, на всі ті наркотики, що ми варили в тюремних туалетах. Джет, Психо, навіть та дивна східна хрінь, Смуч — ми пробували все. Маллет обіцяв своїм людям свободу, здобич і рок-н-рол — і банда пішла за ним."

bcr_under_new_management:0 "Під Новим Керівництвом"
bcr_under_new_management_desc:0 "Тепер, коли Чорний Каньйон сам себе поховав, ми можемо повернутись до витоків і знову грабувати все навколо. А як ми поклали того шанувальника татуювань у землю, то ніхто нас уже не зупинить. Виглядає на те, що здобич знову в меню, хлопці!"

bcr_heading_north:0 "Йдемо на Північ"
bcr_heading_north_desc:0 "Поки Америка якось тримається, Канада ще стигла для грабунку — люди там розпорошені і знесилені після візиту США. Спочатку ми проб'ємося через Маленьке Вайомінґ — бо, по-перше, воно стоїть на нашому шляху, а по-друге, ми давно не грабували, і нам треба трохи потренуватися."

bcr_axles_to_axles_bolts_to_bolts:0 "Оси до осей, болти до болтів"
bcr_axles_to_axles_bolts_to_bolts_desc:0 "Регіон малолюдний, і після того, як ми побили всіх на цьому Дикому Заході — ковбоїв, індіанців і злих кротокопів — ми можемо забрати ті крихти, що залишились. Далі ми вимагатимемо данину і лупцюватимемо всіх, хто нам перечить. У регіоні є лише кілька шахт і трохи механізації. Але кілька металевих рейдерів — звучить як непогана ідея."

bcr_core_sweetwater:0 "Збір Данини з Прибережних"
bcr_core_sweetwater_desc:0 "Кришки з Ролінза, ресурси з шахтарів. Обидва — головний біль, але платити все одно краще, ніж гасити пожежу в домі або ловити кулю лобом."

bcr_taking_off_canned_food_from_the_shelves:0 "Розбити Серце Фанатика"
bcr_taking_off_canned_food_from_the_shelves_desc:0 "Блазень знову шепоче, той напівбожевільний, напівголодний фанатик, якого МакБрайд тримає для розваги. Він белькоче про пророцтво, про Великого Світлого і про «Абсолютне Атомне Знищення», що чекає на МакБрайда. Віра така відчайдушна, така крихка. МакБрайд слухає і усміхається. А хіба не буде весело побачити, скільки тієї віри залишиться, коли він вирве її по шматках?"

bcr_mechanist:0 "Примусити Зомбі Працювати"
bcr_mechanist_desc:0 "МакБрайд закував Світлих у ланцюги. Їхня колись палка віра тепер тьмяна під вагою нашийників і під тріском електрошокерів. Вони марширують не як фанатики, а як раби — побиті й змушені працювати на нашу військову машину. 'До роботи, гнилі зомбі!'"

bcr_core_barren_valley:0 "Знести Ідолів"
bcr_core_barren_valley_desc:0 "'Я тепер тут головний, ясно? Або схиляєш коліна переді мною, або ні перед ким.'"

bcr_going_after_easy_prey:0 "Володарство Барона"
bcr_going_after_easy_prey_desc:0 "Орлине Гніздо Барона лежить на півночі — земля, якою правлять ранчери та самопроголошена знать, що тримається за владу колючим дротом і кулями. Її заснував Авґустус Бейлі, а тримають на плаву найманці та зневірені поселенці. Вони вважають себе втіленням цивілізації у пустці, але для нас — це чергова позолочена ціль. Пора ламати їхні паркани і гнати їхню худобу.

bcr_granting_equipment_for_newbies:0 "Розкриваємо Схованки"
bcr_granting_equipment_for_newbies_desc:0 "Люди Барона добре поповнювали свої арсенали, наповнювали силоси зерном, а комори — їжею. Тепер усе це належить нам. Зброя, їжа й хімікати розподіляються серед наших рейдерів — кожен шматок підживлює наступне завоювання. Навіщо воно має гнити за замкненими дверима?"

bcr_employ_the_brahminboys:0 "Зібрати Брамін-Хлопців"
bcr_employ_the_brahminboys_desc:0 "Брамін-Хлопці — одні з найміцніших пастухів на півночі, швидкі й хитрі на своїх мотоциклах. Вони відігравали ключову роль у захисті торгових маршрутів Орлиного Гнізда. З їхніми ватажками мертвими, а стадами розкиданими, ми дали їм вибір — або їдеш із нами, або потрапиш під копита."

bcr_brahmin_tax:0 "Закріпити Трофеї"
bcr_brahmin_tax_desc:0 "Земля — наша, худоба — наша, люди — наші. Орлине Гніздо впало, ми облаштувались на їхніх ранчо й у майстернях. Податки збираються, паркани лагодяться, а наші хлопці сьогодні їдять стейки. Нічого особистого — просто бізнес."

bcr_hit_you_cant_miss:0 "Хіт, У Який Не Промахнешся"
bcr_hit_you_cant_miss_desc:0 "У звичайному суспільстві поява нового наркотику, певно, дестабілізувала б усе — злети злочинності, паніка, і все таке. Але в рейдерському суспільстві це приносить лише два речі — веселощі й прибуток."

bcr_unexpected_rivals:0 "Несподівані Суперники"
bcr_unexpected_rivals_desc:0 "Схоже, ми не єдині, хто хоче шматок цих покинутих земель. Про Ханів ходять легенди: з моменту їхнього створення — лише втечі та поразки, схід за сходом. Вони витривалі й важко вмирають — це точно. Але настав час додати новий розділ до їхнього епосу — ще одна поразка, ще одне вигнання далі в Середній Захід. Це тепер наша територія."

bcr_followers_outpost:0 "Урок від Послідовників"
bcr_followers_outpost_desc:0 "Послідовники Апокаліпсису давно підтримують Ханів — не знаємо чому, може, протилежності й справді притягуються. Але оскільки ми вже тут, Послідовники хочуть 'виправити' нас — ага, звісно. Але в них є чого повчитись, тож ми відправимо Дока, хай прикидається янголом і принесе назад трохи знань... бажано без хіповських проповідей."

bcr_khan_culture:0 "Повернення до Істинної Природи"
bcr_khan_culture_desc:0 "Хани пішли на схід, тікаючи від безкінечної війни, шукаючи миру. Але війна — у них у крові, у традиції, у самій суті. Тепер, під нашим прапором, ми нагадаємо їм, хто вони є. Їхні кузні знову палатимуть, зброя блищатиме, а воїни стоятимуть напоготові."

bcr_gallows_way:0 "Шлях Шибениці"
bcr_gallows_way_desc:0 "Vae Victis — горе переможеним. Фраза, знайома кожному, хто колись зустрічав легіон Цезаря. Зв'язки Ханів з Легіоном добре відомі. Всі, хто чинитиме опір, підуть Шляхом Шибениці. Інші — платитимуть. А ми, звісно, зважимо капсули. Як і повинно бути."

bcr_our_biggest_prey_yet:0 "Бастіон Вільних Штатів"
bcr_our_biggest_prey_yet_desc:0 "Республіка Маршалла бере початок від Руху Вільних Штатів — вперті хлопці, які колись виступили проти імперії, що хотіла підпорядкувати всіх. Коли впали бомби, навіть стара Національна Гвардія приєдналась до них. Минуло два століття, а вони досі тримаються. Але МакБрайд і його банда не прийшли милуватись їхньою стійкістю — ми прийшли зламати її."

bcr_raid_on_rapid_city:0 "Падіння Рапід-Сіті"
bcr_raid_on_rapid_city_desc:0 "Рапід-Сіті — не просто якась точка на мапі пустки, це серце Республіки Маршалла, їхня гордість. Але гордість не зупиняє кулі, а стіни не встоять перед рейдерами, що винюхали капсули й хімікати. Хлопці завантажені, стволи змащені — кожна дошка, кожен цвях, кожна капсула в цьому місті стануть нашими. Вибач, Маршалю — красиво це не закінчиться."

bcr_another_face_on_wall:0 "Обличчя МакБрайда на Горі"
bcr_another_face_on_wall_desc:0 "Маунт-Рашмор — стародавнє святилище облич з довоєнних грошей, пам’ятник силі, вирізьблений у камені. МакБрайду байдуже, ким вони були і що зробили — він бачить лише можливість. Якщо ті обличчя символізували владу тоді, то його рожа на горі символізуватиме владу тепер. Гору захоплено, хлопці готові до роботи — йдеться не про витонченість, а про те, щоб залишити слід."

bcr_another_face_on_wall_tt:0 "§gЗа допомогою вибухівки й інструментів виріжемо обличчя нашого рейдерського короля на горі Рашмор!§!"

bcr_marshalls_no_more:0 "Маршалів Більше Немає"
bcr_marshalls_no_more_desc:0 "Маршалл упав, сільська місцевість розріджена й легко контролюється, а їхнє єдине цінне поселення, Рапід-Сіті, майже повністю розібране. Воно наше. Їхнє військо розсіяне. Все, що залишилося — збирати гроші за 'захист'. Бо тепер тільки ми можемо захистити їх від рейдерів та іншої гидоти. Хе-хе."

bcr_crown_for_a_king:0 "Не Оверхоз, а Король"
bcr_crown_for_a_king_desc:0 "Титул 'Оверхоз' означає домінування серед рейдерів — воєначальник, що править над дрібнішими ватажками. Але МакБрайд хоче більшого, ніж страх — він хоче поваги від поселенців і решти Караванного Конгресу. Король вимагає не лише лояльності, а й спадку. Ось чому МакБрайд коронує себе не як Оверхоза, а як Рейдерського Короля."

bcr_rusted_crown_of_the_mad_king:0 "Іржавий Вінець Божевільного Короля"
bcr_rusted_crown_of_the_mad_king_desc:0 "§RПід корозією сталі й терновим флероном,\nБрендон дивився туди, де ніч розриває полотно.\nВолодар, скутий правдою, якої краще не знати,\nДе сонця — порожні, а моря — примарні з хати.\nВінець іржавіє, і прокляття все ще шепоче в темряві.§!"

