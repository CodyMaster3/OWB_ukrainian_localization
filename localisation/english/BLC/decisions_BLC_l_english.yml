l_english:
### РІШЕННЯ
blc_realm_status:0 "Стан Королівства"
blc_realm_status_desc:0 "Регіон Чорного Каньйону — це домівка для безлічі народів, кожен зі своїм лідерством, культурою й правами, що часто вступають у конфлікт. Маневрувати між ними — справа складна. Але якщо якась фракція виросте надто сильною, вона може спитати себе — чому ми досі їм підкоряємося?"

black_canyon_raider_revolt_mission:0 "Порохова Бочка із Запаленим Ґнотом..."
black_canyon_raider_revolt_mission_desc:0 "Найгірше сталося — §Y[BCR.GetNameWithFlag]§! прямо під носом здобули силу й тепер кидають нам виклик. Нашої влади недостатньо, щоб зупинити це самотужки... Але ми ще можемо підірвати їхній авторитет або натравити їхніх супротивників проти них самих."

black_canyon_tribal_revolt_mission:0 "Порохова Бочка із Запаленим Ґнотом..."
black_canyon_tribal_revolt_mission_desc:0 "Найгірше сталося — §Y[PNT.GetNameWithFlag]§! прямо під носом здобули силу й тепер кидають нам виклик. Нашої влади недостатньо, щоб зупинити це самотужки... Але ми ще можемо підірвати їхній авторитет або натравити їхніх супротивників проти них самих."

black_canyon_settler_revolt_mission:0 "Порохова Бочка із Запаленим Ґнотом..."
black_canyon_settler_revolt_mission_desc:0 "Найгірше сталося — §Y[YMP.GetNameWithFlag]§! прямо під носом здобули силу й тепер кидають нам виклик. Нашої влади недостатньо, щоб зупинити це самотужки... Але ми ще можемо підірвати їхній авторитет або натравити їхніх супротивників проти них самих."

blc_revolt_mission_raider_tt:0 "§RБільше 15%§! або §Rменше 40%§! підтримки §YКліки Молота§!. Нам слід §Mзаспокоїти§! їх, доки вони не стали §Rзагрозою§!."
blc_revolt_mission_tribal_tt:0 "§RБільше 15%§! або §Rменше 40%§! підтримки §YРад Племен§!. Нам слід §Mзаспокоїти§! їх, доки вони не стали §Rзагрозою§!."
blc_revolt_mission_settler_tt:0 "§RБільше 15%§! або §Rменше 40%§! підтримки §YГільдії Торговців§!. Нам слід §Mзаспокоїти§! їх, доки вони не стали §Rзагрозою§!."

blc_lobby_for_tribals:0 "Підтримати Раду Племен"
blc_lobby_for_tribals_desc:0 ""

blc_lobby_for_raiders:0 "Підтримати Кліку Молота"
blc_lobby_for_raiders_desc:0 ""

blc_lobby_for_people:0 "Підтримати Гільдію Торговців"
blc_lobby_for_people_desc:0 ""

blc_lobby_for_caravan:0 "Підтримати Караван"
blc_lobby_for_caravan_desc:0 ""

blc_lobby_for_ceasefire:0 "Домовитися про Політичне Перемир’я"
blc_lobby_for_ceasefire_desc:0 ""
blc_lobby_for_ceasefire_tt:0 "§YЗібрання§! §gбуде задоволене поступками, і фракції припинять заважати в країні. Жодна з них не буде розпущена — поки що.\n§RЦей ефект триватиме лише 120 днів.§!§!"

blc_ceasefire_at_gathering:0 "Політичне Перемир’я Активне!"

blc_let_kids_walk:0 "Зняти Колеса-Тренажери"
blc_let_kids_walk_desc:0 "Ми підтримували Світляків у розбудові їхньої промисловості, але тепер вони стали самостійними. Час повернути наших людей додому — в нас тут роботи не менше."

### МОЛІ

blc_moles_ruckus:0 "Гори та Кротовини"
blc_moles_ruckus_desc:0 "Кротовинне містечко — це просто купа металобрухту на сході, де живуть крото-копачі та кілька рейдерів. Хоча раніше їхні дії обмежувалися дрібним криміналом, тепер вони ведуть відверту підривну діяльність. Поки ми не залагодимо ситуацію, вони час від часу шкодитимуть нашій інфраструктурі."

black_canyon_moles_mission:0 "З Мухи Роздули Слона"
black_canyon_moles_mission_desc:0 "Кротові копачі готуються знову щось підірвати... Ми маємо зупинити їх — або §Gмирно§!, або §Rсилою§!."

blc_moles_mole_hunt:0 "§RЗатоптати Кротову Нору§!"
blc_moles_mole_hunt_desc:0 "Кротовинне містечко — це смердючий брухт, а його мешканці ще гірші. Ми можемо затопити їхні тунелі й змусити вийти... або втопити їх. Хоча, хто знає, наскільки глибокі ті тунелі?"

blc_moles_crackdown:0 "Фінансувати Кампанію проти Кротовин"
blc_moles_crackdown_desc:0 "Більше грошей, більше людей, більше відер з водою — ви зрозуміли. Вони й так упораються, але це пришвидшить справу."

blc_moles_crackdown_effort:0 "Надмірно Фінансувати Кампанію"
blc_moles_crackdown_effort_desc:0 "Гори грошей, купи людей, барила води — і ви знову зрозуміли. Це значно прискорить операцію."

blc_moles_crackdown_flag:0 "Завершено рішення §YЗатоптати Кротову Нору§!"
blc_setting_moles_crackdown_flag:0 "§RМи проженемо кротів з наших земель і покладемо край їхній метушні!§!"

blc_moles_peace_negotiations:0 "§GЗійти на Гору§!"
blc_moles_peace_negotiations_desc:0 "Крото-копачі — вправні робітники, та ще й наші люди вже живуть серед них. Можливо, ми зможемо домовитися й направити їхню вибухову енергію в інший бік?"

blc_moles_peace:0 "Принести Дарунки Крото-Копачам"
blc_moles_peace_desc:0 "Дивний тип із §Y[DRY.GetName]§! сказав, що може 'поговорити' з кротами. І, на наше здивування, у нього вийшло. За кілька хвилин бубніння, той сказав, що кротам потрібні 'блискітки' або кулі. У нас є кулі. А блискітки?..

blc_moles_peace_effort:0 "Принести Великі Дарунки Крото-Копачам"
blc_moles_peace_effort_desc:0 "Той самий дивак каже, що кроти хочуть ще більше блискіток. Вони думають, що ми десь ховаємо їхні. Можливо, скляні намистини з Ямпанів їх задовольнять?"

blc_moles_peace_flag:0 "Завершено рішення §YЗійти на Гору§!"
blc_setting_moles_peace_flag:0 "§GМи укладемо мир між людьми й кротами, поклавши край метушні!§!"
#
blc_common_army:0 "«Роз'єднана» Спільна Армія"
blc_common_army_desc:0 "«Роз'єднана Спільна Армія» — прикра, але влучна назва. Клікалізм зародився у наших збройних силах дуже рано й повністю знецінив початкову ідею: «усі надсилають війська для централізованої армії». Нам доведеться маневрувати між силами кожної фракції — як у тренуванні, так і в оснащенні — поки ми не зможемо набрати достатньо впливу для реформування всієї системи.\n\nХоча наша армійська структура й не працює так, як ми колись сподівались, ми все ще можемо викликати війська фракцій у поле. Але кожен такий заклик послаблює саму фракцію, адже їй доведеться надати людей і спорядження."

blc_tribal_warband:0 "§RЧемпіони Маленької Змії§!"
blc_tribal_warband_desc:0 "Серед Розмальованих людей населення сильно фрагментоване — більшість сіл зберегли свою ідентичність. Колишньою військовою потугою племен до об'єднання була Маленька Змія. Їхні чемпіони подібні до штурмовиків старих націй — ми могли б використати їх і для себе. Це, звісно, послабить позиції Розмальованих."
blc_tribal_warband_tt:0 "\n\n£tribal_texticon		§GОдин§! підрозділ племінних воїнів за шаблоном\n				§YВоїнське Братство Розмальованих§! прибуде до §Y[115.GetName]§!."
blc_tribal_warband_flag:0 "£decision_icon_small Завершено рішення §YЧемпіони Маленької Змії§!"

blc_raider_warband:0 "§gПідкупити 705-й§!"
blc_raider_warband_desc:0 "Меллет МакБрайд — не добра людина. Його люди, що називають себе 705-м батальйоном, лише глузливо носять уніформу тюремників. Проте, вони жадібні до грошей і люблять бійку — те, що ми можемо використати собі на користь, і ще й послабити вплив Меллета."
blc_raider_warband_tt:0 "\n\n£raider_texticon		§GОдин§! підрозділ рейдерів за шаблоном\n				§YКолишні Зеки§! прибуде до §Y[572.GetName]§!."
blc_raider_warband_flag:0 "£decision_icon_small Завершено рішення §YПідкупити 705-й§!"

blc_settler_warband:0 "§PАкт Про Обмежену Інтервенцію§!"
blc_settler_warband_desc:0 "Міліції громад здебільшого охороняють поселення та виконують поліцейські функції, тож їхній внесок у нашу армію здебільшого символічний. Якщо переконати кількох мерів проштовхнути відповідний «Акт», ми отримаємо більше людей, і тим самим трохи послабимо позиції Берхарда."
blc_settler_warband_tt:0 "\n\n£settler_texticon	   §GОдин§! підрозділ поселенців за шаблоном\n				 §YОборонці Ямпанських Громад§! прибуде до §Y[504.GetName]§!."
blc_settler_warband_flag:0 "£decision_icon_small Завершено рішення §PАкт Про Обмежену Інтервенцію§!"

blc_tribal_equipment:0 "§RТовста Шкіра й Голки§!"
blc_tribal_equipment_desc:0 "Розмальовані використовують своєрідну важку піхоту в примітивній броні й зі списами. Саме завдяки цій зброї вони підкорили своїх сусідів. Їхня зброя виготовляється тільки на їхніх землях, але ми можемо взяти це виробництво до рук — це буде перший крок до інтеграції їхніх сил в єдину армію."
blc_tribal_equipment_flag:0 "£decision_icon_small Завершено рішення §YТовста Шкіра й Голки§!"

blc_raider_equipment:0 "§gГучне й Веселе§!"
blc_raider_equipment_desc:0 "Рейдери — не ніжні створіння. Поряд з грубою зброєю вони полюбляють вибухівку, яку використовують досить розумно — для засідок, прикриття чи шокової атаки. Ми можемо надати їм зброю й шахтарське обладнання — і завоювати їхню лояльність."
blc_raider_equipment_flag:0 "£decision_icon_small Завершено рішення §YГучне й Веселе§!"

blc_settler_equipment:0 "§PЗакон Про Позичене Озброєння§!"
blc_settler_equipment_desc:0 "Ямпани — найрозвиненіші технічно, й це відображається в їхній війні. Їхня зброя має високу скорострільність і точність, і застосовується головно для прикриття. Але вона дорога, тож інтеграція їхньої зброї в армію обійдеться дорого... або доведеться йти на компроміси."
blc_settler_equipment_flag:0 "£decision_icon_small Завершено рішення §PЗакон Про Позичене Озброєння§!"

blc_raider_organization:0 "§gСлужба Заради Скорочення Терміну§!"
blc_raider_organization_desc:0 "Хоча наші рейдери вже не в'язні, Компроміс усе ще їх стримує. Якщо послабити ці обмеження, обіцяючи ще більше послаблень за службу — ми зможемо залучити їх до армії."
blc_raider_organization_flag:0 "£decision_icon_small Завершено рішення §YСлужба Заради Скорочення Терміну§!"

blc_tribal_organization:0 "§RЗбір Воїнських Шаманів!§!"
blc_tribal_organization_desc:0 "Племена озброюються лише у часи війни — постійної армії в них немає. Та якщо переконати воїнських шаманів оминути обмеження Вартових — ми зможемо зібрати нескінченну хвилю воїнів. За відповідну винагороду, звісно."
blc_tribal_organization_flag:0 "£decision_icon_small Завершено рішення §RЗбір Воїнських Шаманів§!"

blc_settler_organization:0 "§PЗакон Про Загальний Призов§!"
blc_settler_organization_desc:0 "Ямпани мають міліції на добровільній основі — цього недостатньо в умовах майбутньої війни. Якщо прийняти закон про загальний призов, це дозволить нам збільшити кількість ямпанських солдатів. Вони не мають бути елітою — це просто потрібна підготовка, для безпеки."
blc_settler_organization_flag:0 "£decision_icon_small Завершено рішення §PЗакон Про Загальний Призов§!"
##
blc_raise_tribal_warband:0 "Зібрати Племінний Загін!"
blc_raise_tribal_warband_desc:0 "Декілька воїнів з §Y[PNT.GetNameWithFlag]§! будуть призвані до бою. Їхня сила полягає у важкій піхоті — грубій, але вельми ефективній в обороні. Їхній наступ обмежений ближнім боєм, тож вони краще підходять для оборони та окупаційних завдань. Хоча самі вони з цим би точно не погодилися..."

blc_raise_raider_warband:0 "Залучити Компромісні Війська!"
blc_raise_raider_warband_desc:0 "Декілька рейдерів з §Y[BCR.GetNameWithFlag]§! будуть призвані до бою. Їхня сила — у вибухівці та підтримці, яка, на диво, добре координується з іншими підрозділами. Вони чудові в наступі, але швидко втрачають темп без підкріплень."

blc_raise_settler_warband:0 "Організувати Міліцію Громад!"
blc_raise_settler_warband_desc:0 "Декілька ополченців з §Y[YMP.GetNameWithFlag]§! будуть призвані до бою. Попри наявність вогневої підтримки, це не навчені солдати — це цивільні добровольці, більш придатні до патрулювання й охорони, ніж для лінії фронту. Але в скруті згодиться будь-яка сила. Ми можемо мобілізувати їх, або хоча б послабити політичну позицію Коаліції."

blc_expand_tribal_warband:0 "Розширити §YВоїнські Групи Розмальованих§!"
blc_expand_tribal_warband_desc:0 "Надати більше впливу Розмальованим — ризикована справа, але вибору небагато. Ми дозволимо їм розширити свої загони, збільшуючи їх чисельність. Сподіваймося, колись вони не обернуть ці сили проти нас."

blc_expand_raider_warband:0 "Розширити §YКолишніх В’язнів§!"
blc_expand_raider_warband_desc:0 "Надати більше впливу рейдерам Тіббетса — ризиковано, але необхідно. Ми дозволимо їм розширити свої батальйони, збільшуючи їхню чисельність. Сподіваймося, вони не піднімуть бунт проти нас."

blc_expand_settler_warband:0 "Розширити §YЯмпанських Захисників§!"
blc_expand_settler_warband_desc:0 "Надати більше впливу Ямпанам — ризикована справа, але іншого виходу немає. Ми дозволимо їм збільшити чисельність міліції. Сподіваймося, вони не візьмуть наші ж закони проти нас."

blc_organize_reserves:0 "Організувати Резервну Систему"
blc_organize_reserves_desc:0 "«Резервісти» — це навчені солдати, що не служать постійно, але можуть бути мобілізовані в разі війни. Цікава ідея — навчити людей для війни, але не кидати їх у бій одразу. Утім, через обмежені можливості, нам доведеться її спробувати."
blc_organize_reserves_tt:0 "Додати §G1§! §YЖетон Резерву§! до вашого запасу. Кожен жетон дозволяє призвати §Yодин підрозділ резервістів§! у випадку оборонної війни."

blc_activate_reserves:0 "Активувати Резервістів!"
blc_activate_reserves_desc:0 "Нашу державу атакували варвари! §gНарешті!§! Ми можемо кинути в бій резервістів для захисту батьківщини. Надіслати таємний наказ 66; §g«Piertotum Locomotor»§!. Я завжди хотів сказати це...\n\nПоточна кількість §Yжетонів резерву§!: §H[?BLC_reserve_token]§!"
blc_activate_reserves_tt:0 "§G[?BLC_reserve_token]§! підрозділ(и) §YРезервістів [BLC.GetNameWithFlag]§! прибуде до §Y[572.GetName]§! для захисту нації!"

blc_standardize_equipment:0 "§OУніфікувати Спорядження§!"
blc_standardize_equipment_desc:0 "Усі зі схожою зброєю, в одній формі — єдиний спосіб створити справжню армію. Без стандартизації постачання перетвориться на кошмар. А тепер подивіться — вони марширують у чорному й зеленому. Милота!"

blc_standardize_military_staff:0 "§OУніфікувати Військове Керівництво§!"
blc_standardize_military_staff_desc:0 "У ямпанів була організована штабна структура, племена — під проводом шаманів і воєвод, рейдери — під проводом ватажків. Щоб створити єдину армію, нам треба прийняти ямпанську модель, призначити офіцерів і навчити їх новим тактикам."

blc_standardize_drills:0 "§OУніфікувати Підготовку§!"
blc_standardize_drills_desc:0 "Від випробувань сили Розмальованих до стрілецьких тренувань ямпанів — ми маємо багато практик. Але важливо не втратити наявні знання. Ми об'єднаємо три традиції: племінну гордість, ямпанську точність і рейдерську автономію в одну підготовчу програму. Не заздрю тому, хто це впроваджуватиме."

blc_first_reform_company:0 "§OПерша Реформована Рота§!"
blc_first_reform_company_desc:0 "Перший загін готовий. Навчений за новими методами, під новими офіцерами, у новій формі та зі стандартною зброєю. Хоча ми й пожертвували деякими деталями, вони готові до бою. Побачимо, чи була вся ця реформа варта зусиль."
blc_black_rock_warband_tt:0 "Перша §YРота Чорної Скелі§! прибуде до строю!"
blc_first_reform_company_flag:0 "£decision_icon_small Завершено рішення §YПерша Реформована Рота§!"

blc_final_reform:0 "§OПідсумувати Реформи§!"
blc_final_reform_desc:0 "Ми багато чому навчилися з цієї реформи — і використаємо це. Незалежно від обраної структури, одне ясно: §Yорганізація — це ключ§!."
blc_final_reform_flag:0 "£decision_icon_small Завершено рішення §YПідсумувати Реформи§!"

blc_avial_scheme:0 "§OАвіаційна Програма§!"
blc_avial_scheme_desc:0 "У світі без літаків навіть старий біплан — подія. Ми не можемо ризикувати втратити навіть одну дорогу машину, тож масове виробництво — наш шлях. США ж могли це зробити — чим ми гірші?"

blc_naval_scheme:0 "§OМорська Програма§!"
blc_naval_scheme_desc:0 "У повітрі перемагає кількість, а на воді — якість... принаймні, так кажуть портові майстри Ямпану. Кораблів буде мало, але якість буде... неперевершена."

blc_military_industry_complex:0 "§OВійськово-Промисловий Комплекс§!"
blc_military_industry_complex_desc:0 "Після централізації економіки й армії, наступний логічний крок — об’єднаний військово-промисловий комплекс. Це породження старої корумпованої системи, але... це працює."
  #
  #blc_trade_agreements:0 "Trade Agreements"
  #blc_trade_agreements_desc:0 "Trading is vital for every community, as trade is the lifeblood which keeps large nations alive. We're not any different from that, even if our trade deals are much less impactful than the others."
  ##>>Tooltips
blc_infrastructure_cost_text:0 "£pol_power  §Y[GetCentralizationInfDecisionCost]§!"
blc_infrastructure_cost_text_blocked:0 "£pol_power  §R[GetCentralizationInfDecisionCost]§!"
blc_infrastructure_cost_text_tooltip:0 "Це рішення коштує £pol_power  [This.GetCentralizationInfDecisionCost]"

blc_industrial_cost_text:0 "£pol_power  §Y[GetCentralizationIndDecisionCost]§!"
blc_industrial_cost_text_blocked:0 "£pol_power  §R[GetCentralizationIndDecisionCost]§!"
blc_industrial_cost_text_tooltip:0 "Це рішення коштує £pol_power  [This.GetCentralizationIndDecisionCost]"

blc_military_cost_text:0 "£pol_power	§Y[GetCentralizationMilDecisionCost]§!"
blc_military_cost_text_blocked:0 "£pol_power	§R[GetCentralizationMilDecisionCost]§!"
blc_military_cost_text_tooltip:0 "Це рішення коштує £pol_power	 [This.GetCentralizationMilDecisionCost]"

blc_push_centralization:0 "Просувати Централізацію"
blc_push_centralization_desc:0 "Наша економічна політика й проєкти розвитку обмежуються фракціями, що мають місце в Зібранні. Хоча можлива й децентралізація, централізоване планування дозволяє ефективніше реалізовувати ці ініціативи. Делегування одного проєкту одній фракції стимулює конкуренцію та дозволяє максимально використати їхні сильні сторони."

blc_tribal_infrastructure:0 "§RСтежки між Вершинами§!"
blc_tribal_infrastructure_desc:0 "Розмальовані народилися й прожили життя на західних схилах Скелястих гір, тож хто як не вони знають цей терен найкраще. Вузькі стежки, ущелини, обриви — вони знають кожну тріщину. Забезпечивши їх обладнанням, ми зможемо зробити їхні маршрути придатними навіть для брамінів."

blc_raider_infrastructure:0 "§gОживити Шляхи Човнів§!"
blc_raider_infrastructure_desc:0 "Рейдери з Пенітенціарію знають лише околиці Тіббетса й руїни міста Човен. Якщо ми підтримаємо їхнє бачення розвитку інфраструктури, вони приберуть завали, сміття й звільнять вулиці. Це дає мало в перспективі, але обійдеться найдешевше."

blc_settler_infrastructure:0 "§PАкт про Дорогу Північного Парку§!"
blc_settler_infrastructure_desc:0 "Ямпани — найрозвиненіші серед нас, тож їхні знання у сфері будівництва безцінні. Міксери, екскаватори, централізоване планування — вони зможуть привести «Північний Парк», як вони називають ту зону, до цивілізації. Це буде дорого, але дуже вигідно."

blc_tribal_industrial_complex:0 "§RСела Ремісників§!"
blc_tribal_industrial_complex_desc:0 "Охоронці запропонували план Розмальованих: створити «села ремісників», де талановиті майстри працюватимуть спільно, підтримуючи одне одного. Це зміцнить централізацію та дасть нам необхідну промислову основу. Мудре рішення."

blc_raider_industrial_complex:0 "§gПідробіток для Слабаків§!"
blc_raider_industrial_complex_desc:0 "Рейдерам Маллетта було байдуже до проєкту, але серед них є боягузи, що не йдуть у набіги. Ці кримінальні елементи виготовляють нелегальні товари, зокрема тютюн і алкоголь. Якщо профінансувати їхні підпільні майстерні, можна суттєво зекономити."

blc_settler_industrial_complex:0 "§PАкт про Обов'язкову Трудову Участь§!"
blc_settler_industrial_complex_desc:0 "Громада сильна настільки, наскільки сильне її слабке місце. Труд — не вибір для ямпанів, а обов'язок. Вони прагнуть поширити це бачення на весь Чорний Каньйон. Для цього, звісно, знадобиться створити нові робочі місця."

blc_tribal_arms_factory:0 "§RГолки для Чорнил, Списи для Крові§!"
blc_tribal_arms_factory_desc:0 "Розмальованим потрібна вся гостра зброя, яку вони можуть отримати. Їхній девіз — буквально про це. Їхні майстри з виготовлення списів можуть зробити ще більше — якщо дати їм інструменти. Наші заводи тепер можуть їм у цьому допомогти."

blc_raider_arms_factory:0 "§gБільше Кришок — Більше Стволів§!"
blc_raider_arms_factory_desc:0 "Рейдери нарешті прокинулись — ось що їх справді цікавить! Якщо дати їм ресурси, вони відкриють цілі майстерні зі зброї по всьому Човну: від пістолетів до кулеметів, з труб чи з металу — все, що забажаєш. Це найвигідніший варіант для нас."

blc_settler_arms_factory:0 "§PАкт про Обмежене Озброєння§!"
blc_settler_arms_factory_desc:0 "Дозвіл озброюватися цивільним — одна з причин, чому Америка загинула. Але в цих умовах без зброї людство б не вціліло. Ямпани не хочуть надмірної мілітаризації, але погодились на «обмежене озброєння». Що б це не означало."
  #
blc_buy_canaanite_arms:0 "Придбати Зброю: §YХанаанітська Арматура§!"
blc_buy_canaanite_arms_desc:0 "[NCN.GetAdjective] славляться своїми пістолетами калібру .45. Хоча ця зброя суттєво відрізняється від нашої грубої кустарщини, вона на диво надійна. Сподіваємось, у них є надлишки. А їхня репутація декадентів дає шанс придбати все це за вигідною ціною..."

blc_buy_from_bombay_jack:0 "Придбати Вибухівку: §YБомби Бомбея§!"
blc_buy_from_bombay_jack_desc:0 "«Один неправильний дріт, дрібка хлорату калію, необережний рух — і §Rбабах§!!» — принаймні, так каже Бомбей Джек. У будь-якому разі, його динаміт справді вибухає, і саме цього хочуть у Тіббетсі. Головне, щоб не по нас."

blc_buy_old_armor_from_alliance:0 "Придбати Броню: §YБ/У Від Альянсу§!"
blc_buy_old_armor_from_alliance_desc:0 "Броня, яку Залізний Альянс виставив на продаж, чесно кажучи — сміття. Ми сподівались на силову броню, а отримали купу металобрухту. Але наші трибуни вважають, що й ці уламки можуть стати в пригоді для їхніх воїнів."

blc_buy_foragers_scrap:0 "Придбати Важке Озброєння: §YБрухт Збирачів§!"
blc_buy_foragers_scrap_desc:0 "Збирачі не брешуть — вони справді все збирають. Вигнані з Денвера, вони облаштувались у Нью-Монтроузі й зібрали купи заліза. Їхня зброя калібру .50, «кульовий дощ», якраз те, що потрібно для загонів прикриття Ямпанів. Ми запропонуємо обмін."

blc_price_of_khan:0 "Йти Шовковим Шляхом"
blc_price_of_khan_desc:0 "Після перемоги у Вайомінгу, з Ханами можна вести прибуткову торгівлю. Вони навряд чи підуть на південь, але як колишні рейдери — можуть стати нам у пригоді. Можливо, зможемо викупити в них узбережжя, і тоді Шлях Брухту стане реальністю."

blc_barons_bid:0 "Ставка Барона"
blc_barons_bid_desc:0 "Старий барон пережив напад Ханів. Він ще той капіталіст, і його узбережжя йому ні до чого. Можливо, щедра «пожертва» переконає його продати його нам..."

blc_diplomatic_relations:0 "Дипломатичні Відносини"
blc_diplomatic_relations_desc:0 "Той, хто блукає пусткою сам, часто стає обідом Кігтя Смерті. Чим більше людей співпрацюють, тим більшого можна досягти. А на міжнародному рівні... це може змінити сам напрямок долі Пустки."

blc_diplomatic_action_ongoing:0 "Зараз уже триває чутлива дипломатична операція!"

blc_send_envoy_to_new_canaan:0 "Встановити Посольство в [551.GetName]"
blc_send_envoy_to_new_canaan_desc:0 "Мормони зазвичай не втручались у справи Північно-Західного Колорадо. Максимум — розвідка ресурсів та місіонерство. Але ми тепер шукаємо просвітлення — тож саме час познайомити їх із нами ближче."

blc_send_envoy_to_twin_mothers:0 "Встановити Посольство в [554.GetName]"
blc_send_envoy_to_twin_mothers_desc:0 "Плем’я Близнючих Матерів — переважно мирне. Зазвичай з такими легко торгувати. Хоча близькість «раю» Діани трохи тривожить... але сумнівно, що вони затіють територіальний спір."

blc_send_envoy_to_new_sterling:0 "Встановити Посольство в [430.GetName]"
blc_send_envoy_to_new_sterling_desc:0 "Меркантильні найманці з Нью-Стерлінга мають цілий статок. Якщо ми дамо їм, на що витратити ці кришки, зможемо навіть прокласти постійний торговий шлях."

blc_send_envoy_to_denver:0 "Встановити Посольство в [525.GetName]"
blc_send_envoy_to_denver_desc:0 "Пси з Денвера — грубі й жорстокі, та мають контроль над зоною розбору металу. Якщо зуміли домовитися з МакБрайдом, то, може, й з ними зможемо."

blc_send_envoy_to_casper:0 "Встановити Посольство в [1040.GetName]"
blc_send_envoy_to_casper_desc:0 "На північ від нас — пусті трав’яні рівнини, ідеальні для брамінів. Там створили процвітаючу економіку. Відомі як безжальні торговці, але ми не маємо змоги перебирати. Варто відправити вісника до цього «Барона»."

blc_send_envoy_to_lovell:0 "Встановити Посольство в [1029.GetName]"
blc_send_envoy_to_lovell_desc:0 "Хани мають грізну репутацію в Каліфорнії. Кажуть, що вони хочуть осісти, але хто знає? Тим не менш, поговорити з ними не завадить — раптом щось вийде."

blc_send_envoy_to_oasis:0 "Відправити торгову делегацію до [478.GetName]"
blc_send_envoy_to_oasis_desc:0 "Ми можемо надіслати делегата до Вендовера, щоб запропонувати незначні торгові угоди. Нам нецікаво мати з ними справи, але ми радо приймемо їхні кришки — і будь-що, що зможемо 'позичити' з їхніх гаражів, також стане у пригоді."

blc_send_envoy_to_rosebud:0 "Відправити торгову делегацію до [1046.GetName]"
blc_send_envoy_to_rosebud_desc:0 "Нехай §Y[BTH.GetNameWithFlag]§! і є запізнілим культом, що слухає якісь старосвітські нісенітниці, вони займають стратегічну ділянку землі в Пустці. Розебад — це ворота до річки Міссурі, і якщо ми зможемо скористатися їхнім портом, ресурси можуть прямувати річкою до наших земель. До їхнього порту, принаймні."

blc_send_envoy_to_new_montrose:0 "Відправити посланця до [308.GetName]"
blc_send_envoy_to_new_montrose_desc:0 "Збирачі завжди були спорідненими душами для нас, поділяючи багато наших поглядів. Вони залишили Блек-Рок через ізоляцію серед племен Розмальованих — тепер Розмальованих Людей — і через брак потреби в оборонному союзі. Ми можемо легко схилити їх на наш бік, а їм буде вигідно здобути нашу прихильність."

blc_send_envoy_to_george_town:0 "Відправити посланця до [515.GetName]"
blc_send_envoy_to_george_town_desc:0 "Рейдери під керівництвом Бомбея Джека — старі друзі Маллета та наших колишніх рейдерів. Але відколи загроза Хангдогів зникла, вони знову стали вільними — як і має бути, адже рейдер по своїй природі ніколи не визнає над собою влади. Ми можемо переконати їх, що життя під нашим крилом буде не владою, а веселішим за бідність у мертвому каньйоні."

blc_send_envoy_to_circle_junction:0 "Відправити посланця до [630.GetName]"
blc_send_envoy_to_circle_junction_desc:0 "Залізничні фанатики з Серкл-Джанкшн настільки обожнюють потяги, що надсилати до них посланця потягом звучить майже як жарт. Ми вже відновили багато колій, тож, ймовірно, вони переселяться по всій нашій території й створюватимуть свої 'Ель Локо' святині вздовж усієї лінії. Єдина перешкода — їхня задоволеність власною долиною. Але це аргумент лише для дурнів."

blc_send_envoy_to_mesa_verde:0 "Відправити посланця до [636.GetName]"
blc_send_envoy_to_mesa_verde_desc:0 "Мешканці Меса-Верде — брати Батареї. Якщо дати їм трохи доброзичливості та дозволити повернутися до життя, яке вони мали до появи того з Тіббетса, то вони не стануть складною загадкою для вирішення."

blc_colorado_developments:0 "Розвиток Західного Колорадо"
blc_colorado_developments_desc:0 "Північно-західний Колорадо почали розвивати ще до Великої Війни. Вугілля й залізо добували, використовуючи силу викопного палива на генераторних станціях. Піднялися дамби й вітряки — та все це розпадається вже два століття. Та тепер ми маємо змогу відновити їх."

blc_repair_craig_generating_station:0 "Відновити Крейгську генераторну станцію"
blc_repair_craig_generating_station_desc:0 "Попри те, що станція працює на вугіллі та має просту конструкцію, вона була однією з найбільших у регіоні. Вона може служити тимчасовим або резервним рішенням для енергетичних проблем. Закинемо трохи кришок у потрібні руки — і побачимо, що з того вийде."

blc_repair_hayden_generating_station:0 "Відновити Гейденську генераторну станцію"
blc_repair_hayden_generating_station_desc:0 "Цю станцію свого часу поглинула Poseidon Energy. Вона ніколи не була великою й була закрита ще до падіння бомб — адже Poseidon хотіла збудувати тут ядерну. Та відновити її та дати їй трохи вугілля не стане для наших електриків проблемою."

blc_repair_shoshone_generating_station:0 "Відновити Шошонську генераторну станцію"
blc_repair_shoshone_generating_station_desc:0 "Стара Шошона — справжній древній дух, їй уже майже чотириста років. Дивно, що вона взагалі ще функціонує. Хай там як, час залишив свій слід. Навіть після ремонту її вироблення буде менше, ніж у новіших станцій. Проте вона може стати ідеальним водоочисним центром — і, можливо, Смердюча Вода знову стане чистою."

blc_restart_fryingpan-arkansas_project:0 "Перезапустити проєкт Фраїнгпен-Арканзас"
blc_restart_fryingpan-arkansas_project_desc:0 "Попри смішну назву, проєкт Фра-Арк завжди мав благородну мету — накопичення й розподіл води в посушливому регіоні. Щоб запустити його знову, нам потрібно відремонтувати канали, тунелі та водозбірники. Після цього спрямуємо воду на станцію Маунт-Елберт для вироблення електроенергії."

blc_repair_ridgway_dam:0 "Відновити дамбу Ріджвей"
blc_repair_ridgway_dam_desc:0 "Ріджвейська дамба працює з річкою Анкомпагре й є сучаснішою за місцеві аналоги. До того ж вона збереглася в чудовому стані. Трохи зусиль — і вона забезпечить нас чистою водою та енергією на весь регіон."
blc_drill_carbon_basin:0 "Розкопати Вугільний Басейн"
blc_drill_carbon_basin_desc:0 "Неподалік від столиці Ямпанів ми знайшли закинутий будівельний майданчик біля річки. На табличці чітко написано: \"Вугільна ділянка Вугільного Басейну. Власність Прометеус Вугілля. Вхід лише для уповноважених працівників. Територія небезпечна.\" Це не перший раз, коли ми натрапляємо на сліди Прометеуса в регіоні, і з відповідними інструментами ми зможемо завершити те, що Прометеус не встиг до війни."

blc_reopen_seminoe_mines:0 "Відновити копальні Семіно"
blc_reopen_seminoe_mines_desc:0 "Поруч із водосховищем Семіно, крайнім пунктом нашої річки, розташовано багате вугільне родовище. Тут було відкрито копальні: Семіно I, Семіно II, Семіно III та Роузбад. Хоча тунелі за двісті років обвалилися, ми можемо відновити їх з мінімальними зусиллями."

blc_extinguish_burning_fields:0 "Погасити Палаючі Поля"
blc_extinguish_burning_fields_desc:0 "Хоча цією територією раніше керували §Y[ORO.GetName]§!, і стара довоєнна інфраструктура була давно розграбована, тут також є багатий вугільний пласт, придатний для розробки. Але для цього нам доведеться загасити всі залишкові пожежі — наші люди не можуть працювати в палаючому пеклі."

burning_fields_expanded:0 "Ми вже розширили шахту Палаючих Полів!"

blc_develop_deepmines:0 "Розвинути Глибокі Шахти"
blc_develop_deepmines_desc:0 "Стара шахта «Глибокі», де колись базувалися §Y[DRY.GetName]§!, досі має нерозроблені залізні жили в глибинах. Якщо копати глибше, з жадібністю — ми зможемо забезпечити стабільне постачання металу та нарешті відмовитися від залежності від брухту."

deepmines_expanded:0 "Ми вже розширили Глибокі Шахти!"

blc_refurbish_grand_valley_dam:0 "Реконструювати дамбу Великої Долини"
blc_refurbish_grand_valley_dam_desc:0 "Хоч це і не Гуверська дамба, дамба Великої Долини має не менш стратегічне значення: вона відводить потік річки Колорадо для іригації долини. Якщо її відновити та обладнати очисниками та простими водяними млинами, ми зможемо розв'язати проблеми з питною водою та електроенергією по всій країні. Але не варто забувати — ця дамба дуже стара й майже примітивна за нашими мірками, тож очікувати від неї забагато не варто."

blc_utah_colorado_joint_mining_consortium:0 "Спільний гірничий консорціум Юти та Колорадо"
blc_utah_colorado_joint_mining_consortium_desc:0 "Назва може бути оманливою, адже консорціум цікавиться переважно північним заходом Колорадо та Малим Вайомінгом, особливо вугільними родовищами. Фінансування дають Ханаанці, а Каньйонці займаються розробкою та відновленням забутих копалень у регіоні."

blc_extinguish_burning_fields_canyon:0 "§yПередати права на розробку Палаючих Полів§!"
blc_extinguish_burning_fields_canyon_desc:0 "Геката та її люди добре попрацювали, розграбувавши цю місцину — іронічно, враховуючи, що вони більше цікавилися тим, що зверху, ніж тим, що під землею. Копачі з них вийшли не гірші за кротів із півночі. Темрява в шахтах така, що хоч в око стрель. А тут ще й вугілля? Та ще й майже чисте? Чому ж ви одразу не сказали?! Продаємо негайно!"

blc_extinguish_burning_fields_mormon:0 "Погасити Палаючі Поля"
blc_extinguish_burning_fields_mormon_desc:0 "Хоча цією територією раніше керували §Y[ORO.GetName]§!, і довоєнну інфраструктуру вже давно пограбовано, тут усе ще є багаті вугільні родовища для майбутньої розробки. Але спершу доведеться загасити всі залишкові пожежі — наші люди не можуть працювати в пеклі. З фінансуванням від Нью-Ханаанців ми могли б навіть перевершити шахти на півночі в Монтані."

blc_extinguish_burning_fields_open:0 "§Y[BLC.GetName]§! вже передала §yправа на розробку§! цієї території"

blc_develop_deepmines_canyon:0 "§yПередати права на розробку Глибоких Шахт§!"
blc_develop_deepmines_canyon_desc:0 "Ми не маємо великої потреби в самих Глибоких Шахтах, бо вони... ну, глибокі. §Y[DRY.GetName]§! вже не контролюють цю територію, але треба визнати — вони вміли добувати кожен шматок металу з цього нескінченного провалля. Можливо, ті, хто краще розуміється на прибутках, зможуть зробити ще більше?"

blc_develop_deepmines_mormon:0 "Розвинути Глибокі Шахти"
blc_develop_deepmines_mormon_desc:0 "Стара шахта, яку раніше зайняли §Y[DRY.GetName]§!, досі містить нерозроблені залізні жили. Якщо копати глибше, з новим обладнанням, ми зможемо забезпечити стабільне постачання металу та відмовитися від залежності від брухту. Дехто з побожних навіть каже, що копаючи глибше, ми можемо знайти демона з пекла."

blc_deepmines_open:0 "§Y[BLC.GetName]§! вже передала §yправа на розробку§! цієї території"

blc_develop_southpass_canyon:0 "§yПередати права на розробку Саут-Пасу§!"
blc_develop_southpass_canyon_desc:0 "Тепер, коли ті брудні кроти прибрані, шахта Саут-Пас — ідеальне місце для нової розробки. Довоєнні знаки кажуть, що це була золота шахта. Може, вже й не в прямому сенсі, але ті кроти обрали її своїм домом не просто так."

blc_develop_southpass_mormon:0 "Розвинути шахту Саут-Пасс"
blc_develop_southpass_mormon_desc:0 "Колишній дім кротів-шахтарів з Далекого Сина, шахта Саут-Пасс є історичним місцем сама по собі. Копачі виконували свою роботу абияк, але, на щастя, тепер у них новий наглядач, який змусить їх працювати вдвічі важче — і, сподіваємось, удвічі прибутковіше. З фінансуванням Ханаанців ми навіть зможемо полагодити більшість шахтарських костюмів."

blc_southpass_open:0 "§Y[BLC.GetName]§! вже передала §yправа на розробку§! цієї території"

blc_reopen_routt_county_mines_canyon:0 "§yПередати права на розробку копалень округу Роутт§!"
blc_reopen_routt_county_mines_canyon_desc:0 "Ого, ми натрапили на справжній скарб вугільних шахт: Дезерадо, Коловьйо, Треппер Стріп та Фойдел Крік — DCTF, якщо коротко. Хоча кожна окремо не принесе достатньо вугілля, об'єднані в єдину структуру вони можуть дати пристойну кількість «чорного золота», хай і грудкуватого, а не рідкого. Що скажете — зануримо руки в пилюку й справимо враження на інвесторів?"

blc_reopen_routt_county_mines_mormon:0 "Відновити копальні округу Роутт"
blc_reopen_routt_county_mines_mormon_desc:0 "В окрузі Роутт функціонувало кілька вугільних шахт: Дезерадо, Коловьйо, Треппер Стріп та Фойдел Крік. Поодинці вони не забезпечать нас паливом, але разом можуть дати стабільне електропостачання. Завдяки фінансуванню Нью-Ханаану ми можемо гарантувати, що шахти не обваляться, а шахтарі отримуватимуть достойну платню."

blc_routt_county_open:0 "§Y[BLC.GetName]§! вже передала §yправа на розробку§! цієї території"

blc_reopen_bridger_mine_canyon:0 "§yПередати права на розробку шахти Бріджер§!"
blc_reopen_bridger_mine_canyon_desc:0 "Бріджер була підземною вугільною шахтою неподалік Рок-Спрінгс. Колись належала Прометеус Вугілля, а потім — Поузідон Енерджі. Попри думку, що вона поверхнева, у шахти є величезний підземний рівень. Довелося навіть знищити кількох шахтарських роботів, аби дістатися всередину. Що ж, без кількох зламаних пальців угоду не укладеш. Продаємо."

blc_reopen_bridger_mine_mormon:0 "Відновити шахту Бріджер"
blc_reopen_bridger_mine_mormon_desc:0 "Бріджер — стара підземна вугільна шахта неподалік Рок-Спрінгс. Після того, як її викупила Поузідон Енерджі, шахта значно розширилася, але згодом була закинута. Оскільки ми можемо направити туди скільки завгодно робітників, людських чи роботизованих, — проблем із видобутком не буде."

blc_bridger_open:0 "§Y[BLC.GetName]§! вже передала §yправа на розробку§! цієї території"

blc_reopen_black_butte_mine_canyon:0 "§yПередати права на розробку шахти Блек-Б'ютт§!"
blc_reopen_black_butte_mine_canyon_desc:0 "Спершу ми вважали, що Блек-Б'ютт — величезна шахта, судячи з розмірів екскаваторів і залізничної станції. Насправді ж це лише чергова невелика вугільна шахта на півдні Вайомінгу. Після покупки Поузідон Енерджі через Прометеус Вугілля її трохи розширили, але після війни — покинули. Зараз нам ніщо не заважає її відновити. Чому б ні?"

blc_reopen_black_butte_mine_mormon:0 "Відновити шахту Блек-Б'ютт"
blc_reopen_black_butte_mine_mormon_desc:0 "Блек-Б'ютт — ще одна вугільна шахта на півдні Вайомінгу. Після покупки Поузідон Енерджі її розширили, а згодом — покинули. Тепер, коли ми маємо права на її розробку, саме час запустити екскаватори знову!"

blc_black_butte_open:0 "§Y[BLC.GetName]§! вже передала §yправа на розробку§! цієї території"

blc_reopen_last_chance_mine_canyon:0 "§yПередати права на розробку шахти Останній Шанс§!"
blc_reopen_last_chance_mine_canyon_desc:0 "Ми насправді не знали, що це місце існує. Один зі сталкерів натрапив на нього в припадку марення, помер від радіації, але залишив мапу й... записки, якщо це можна так назвати. Виявилося, що тут був довоєнний об'єкт для утилізації радіоактивних відходів: плутоній, уран, стронцій — все є. Можливо, тільки гулям і роботам під силу добути уран, але ризикові шукачі можуть знайти й щось інше."

blc_reopen_last_chance_mine_mormon:0 "Відновити шахту Останній Шанс"
blc_reopen_last_chance_mine_mormon_desc:0 "Останній Шанс — майже невідоме місце, і це на краще. Розташоване воно важкодоступно, але має багаті поклади урану — ресурсу, якого зараз усі жадають. Треба вкладати всі гроші та людей, що має Консорціум, й швиденько збагатитися. §RЦе підприємство точно не є підозрілим або небезпечним.§!"

blc_last_chance_open:0 "§Y[BLC.GetName]§! вже передала §yправа на розробку§! цієї території"
  #
pnt_has_painted_at_least_x_spots:0 "Здійснено щонайменше $COUNT|Y$ рішень Племені Розмальованих"
pnt_paints_of_colorado:0 "Розмальовані Племена"
pnt_paints_of_colorado_desc:0 "Шаман Войовник Вардед веде плем’я, та навіть Арлен заповідає, що Чорнило не слід тримати для себе. З кожним плем’ям, приєднаним до Розмальованих Людей, виникає нова Пляма Чорнила — знак єдності, що об’єднує Розмальованих і тих, кого вони завоювали, не як підлеглих, а як рівних, яким лишень слід показати істинне Чорнило."

pnt_tibbets_information:0 "[BCR.GetFlag] Пляма Чорнила Паламіно"
pnt_tibbets_information_desc:0 "Рейдери не підлягають прощенню, але й карати їх за злочини, що були дозволені їм некомпетентністю фальшивого об’єднувача, не слід. Арлен заповідає: рейдери мають бути позначені м’яким чорним каменем, який чужинці називають 'графітом'. Великі чорні літери «P» будуть нанесені на їхні тіла. Пляма Чорнила Паламіно визначає, хто свій, а хто чужий. Але рейдери Тіббетса не мої друзі — поки не спокутують провини."

pnt_yampan_information:0 "[YMP.GetFlag] Пляма Чорнила Акварель"
pnt_yampan_information_desc:0 "Попри сум, що ми мусили зійтися у бою, ми не такі вже й різні. Враховуючи любов ямпанців до води та багатства, доречно позначити їх плямою Чорнила Акварель, що навчає: багатство можна втратити так само швидко, як і здобути. Яскраві зелені, чисті блакитні, блискучі золоті тони — знак того, до чого прагне плем’я. Але фарба ця змивається так само легко, як і наноситься. Іронічне, та влучне прізвисько."

pnt_vault_twenty_seven_information:0 "[VLS.GetFlag] Пляма Чорнила Сталешкіра"
pnt_vault_twenty_seven_information_desc:0 "Колись, воїни, що носили ці «силові броні», прикрашали їх релігійними, містичними чи міфологічними образами. Вони не знали того, але ці прикраси були благословенням Арлена, їхньою Плямою Чорнила. Їх називали 'кераміка' або 'залізо', та для нас це — Сталешкіра, пляма божественного захисту: металеві відтінки, зображення важливих постатей. Шкода, що ми не бачили цього раніше — але добре, що вже бачимо."

pnt_presper_information:0 "[SLE.GetFlag] Пляма Чорнила Післяпілля"
pnt_presper_information_desc:0 "Для Вісників Сутінків кінець — не страх, а шанс. Їхній пророк Преспер учив: лиш через вогонь, попіл і незламну мету людство може відродитися. Пляма Чорнила Післяпілля — суміш хворобливо-жовтих, попелясто-сірих та слабко-зелених світінь — символ катастрофи. Візерунки не випадкові: кожен розповідає пророцтво, попередження, історію. Вони носять її з гордістю, як потріскану шкіру спалених земель. Кожен шрам — священне писання, кожна мітка — попередження."

pnt_old_bones_information:0 "[TOB.GetFlag] Пляма Чорнила Рептилія"
pnt_old_bones_information_desc:0 "Грубе прізвисько, але точне. Старі Кістки славились тим, що використовували кістки стародавніх ящерів-мутантів. У давніх текстах ми знайшли, як ці створіння виглядали насправді. Вони жорстокі, як і Пляма Чорнила Рептилія. Зараз вони прикрашають себе шкірою геконів, панциром комах і навіть пір’ям — хоч останнє й неточно, бо наші джерела жодного пір’я не згадують."

pnt_ouroboros_information:0 "[ORO.GetFlag] Пляма Чорнила Тріада"
pnt_ouroboros_information_desc:0 "Хоч Слова Темної Матері й Гончого Де були хибні, саме завдяки Плямі Чорнила Тріада ми об’єднали народ Чорної Піраміди. Перша — Червона — символізує насилля людської природи. Друга — Жовта — заздрість і потенціал для спокути. Третя — Синя — мир і прощення. Всі три разом створюють святу Пляму, яку Уроборос прийняли з вдячністю."

pnt_west_colorado_information:0 "[CLJ.GetFlag] Безплямові"
pnt_west_colorado_information_desc:0 "Що означає бути без барв? Без Чорнила Арлена? Без Плями? Для Розмальованих ці — Безплямові. Вони або не можуть, або не хочуть прийняти волю Арлена. Але Арлен не карає їх. Це лише знак майбутнього розвитку. Можливо, їхня чиста шкіра є благословенням, або ж одного дня вони побачать темне світло чорнила і оберуть собі власну пляму."

pnt_ciphers_information:0 "[CIP.GetFlag] Пляма Чорнила Математик"
pnt_ciphers_information_desc:0 "Хоча Чорнило має велике релігійне значення для Арлена, навіть Бог Чорнила мусить ретельно планувати свої візерунки — так само, як і Плями Чорнила, що виконують його волю. Бо навіть одна хибна лінія чи крапля може зіпсувати його благословення. Саме тому існує Пляма Чорнила Математик, назва якої співпадає з фразою/віруванням Кіферів. Вона символізує прагнення до досконалості в усьому. Кіфери адаптували це чорнило як математичні формули, числа й букви, витатуйовані на їхніх тілах."

pnt_circle_junction_information:0 "[INR.GetFlag] Пляма Чорнила Залізолінія"
pnt_circle_junction_information_desc:0 "Згідно з переказами народу Джанкшена, вони колись називали себе 'Залізні Ріки' або 'Залізні Лінії' — через великих металевих звірів, що подорожували по «ріках» або «лініях» землі. І хоча ми не маємо діла до металевих звірів, сама концепція ліній дуже близька нашим традиціям. Отже, виникла нова Пляма — Залізолінія: сірі смуги, що тягнуться по тілу, як рейки старого світу через пустку."

pnt_khans_information:0 "[KHA.GetFlag] Пляма Чорнила Секколор"
pnt_khans_information_desc:0 "Хани Півночі — народ складний. Їхні вожді розриваються між миром, традицією й помстою. Але їхні історії нагадують нам про Пляму Секколор. На відміну від Тріади, Секколор — молодший брат, створений із кольорів, яких немає в Тріаді, але які з неї походять. Помаранчевий — обережність чи байдужість. Фіолетовий — сумнів або розпач. Зелений — спокій чи жадібність. Який би колір не обрали Хани, він буде правильним для них."

pnt_zion_tribes_information:0 "[SOR.GetFlag] Пляма Чорнила Лісовий Зелений"
pnt_zion_tribes_information_desc:0 "Племена Смутків і Мертвих Коней — народи поваги, смирення й виживання. У тихих каньйонах Зайону вони слідують Вченням Батька — постаті, що веде їх у кожному кроці. Пляма Лісовий Зелений вкриває їх — глибокий, земляний відтінок, що символізує ріст, витривалість і спокій природи. Як дерева в їхньому краю, вони міцні й незламні, а їхнє чорнило зливається з дикою землею. Це не просто колір — це обітниця, щит і молитва, викарбувана на шкірі."

pnt_eighties_information:0 "[EHT.GetFlag] Пляма Чорнила Масні Пальці"
pnt_eighties_information_desc:0 "Вісімдесятники — створіння руху, вічно женуться за горизонтом старих автострад. Дорога — їхній дім, святиня і в’язниця. Пляма Масні Пальці — чорні мазки, масляні плями на руках і обличчях — відображення їхніх моторів і постійного руху. Це нагадування про жертви заради швидкості та виживання, що зв’язують їх з ревучими машинами. Дорога — вічна, а Пальці в чорнилі — її знак на обраних дітях."

pnt_white_legs_information:0 "[WHT.GetFlag] Пляма Чорнила Бліде Обличчя"
pnt_white_legs_information_desc:0 "Білі Ноги — плем’я спустошення, рухається як буря крізь руїни. Вони моляться будь-якій силі, що дає їм могутність: божественній, містичній чи демонічній. Пляма Бліде Обличчя — білі й сірі тони, що перетворюють їхню шкіру на образ вибіленої кістки та привидів. Їхні мітки — втілення безжальної рішучості й порожнечі, що лишається після них. Чи це страх, гнів, чи віра ними керує — одне ясно: Пляма Блідого Обличчя навіває жах скрізь, де падає їхня тінь."
