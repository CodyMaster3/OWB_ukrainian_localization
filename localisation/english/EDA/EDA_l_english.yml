l_english:

#tooltips
EDA_DIRECTOR_COLE_NAME: "Директор Коул"
EDA_LEADER_DESC: "Директор Коул завжди був блискучим слідчим — перший у випуску в Академії правопорядку Росвелла, ветеран численних глибоких операцій у чужоземних землях і перший, хто розкрив убивство попереднього директора, скоєне агентом Легіону з числа Фрументаріїв, якому вдалося неможливе — проникнути в Товариство Блакитної Троянди. Він був очевидним вибором на посаду нового директора Товариства — а якщо його план спрацює, то й всього Нью-Мексико."

#focuses
eda_origin:0 "Блакитна Троянда Нью-Мексико"
eda_origin_desc:0 "Товариство Блакитної Троянди існує в Нью-Мексико з моменту ядерної катастрофи, продовжуючи місію, настільки важливу, що навіть кінець світу не зміг їх зупинити. Але що саме ми робимо?"

eda_pallus:0 "Гнів Паулла"
eda_pallus_desc:0 "Товариство Блакитної Троянди вижило під час нападу воєначальника Паулла та його Когорти, але ми й досі жахаємося дня, коли Легіон повернеться до Нью-Мексико..."

eda_lanius:0 "Ланій наступає"
eda_lanius_desc:0 "І ось цей день настав. Ланій, новий Легат, був надісланий для завоювання Нью-Мексико в ім’я далекого «Цезаря». Плем’я Лямбда вже впало, і, схоже, ми наступні..."

eda_spies:0 "Спадщина ОРА"
eda_spies_desc:0 "Хоча всі знають про зв’язок ФБР і Товариства Блакитної Троянди, мало хто пам’ятає вплив колишньої ОРА, агенти якої допомагали в проєкті до війни. Вони залишили чорні скриньки з обладнанням і, головне, інструкціями на випадок вторгнення. Можливо, настав час скористатися ними."

eda_stealth:0 "Технології невидимості"
eda_stealth_desc:0 "Стелс-бої — це корисні інструменти втечі чи проникнення, але ми десятиліттями вивчали й удосконалювали їх. Ми навчилися маскувати навіть будівлі. Наші оперативники знають, як застосувати це з максимальним ефектом."

eda_infiltrators:0 "Експерти з проникнення"
eda_infiltrators_desc:0 "Для роботи в тилу ворога потрібно не лише виживання, а й соціальні навички. Наші агенти можуть злитись із цивільним населенням з моменту прибуття — і зникати без сліду."

eda_FBI:0 "Спостереження ФБР"
eda_FBI_desc:0 "ОРА була вражаючою, але ФБР не поступалася. Озброєні міліції, мафії, повстанці — все це підштовхнуло їх до крайніх заходів. Росвелл і досі є вузлом мережі спостереження. Телефони, ліхтарі, радіоприймачі — все може бути засобом стеження. Від ФБР не сховаєшся."

eda_rebellion:0 "Невидимий опір"
eda_rebellion_desc:0 "Через секретні ходи й схованки наші агенти піднімають повстання. Зброя з’являється нізвідки, повстання рабів стають звичними, а цілі загони зникають вночі. Нас не приборкати — навіть мертві ми залишимо сюрпризи."

eda_survivors:0 "Виживші Нью-Мексико"
eda_survivors_desc:0 "Ланій розбитий, Нью-Мексико — наше! Це була малоймовірна перемога, але ми вижили — і це головне."

eda_summers:0 "Повернути Форт Саммерс"
eda_summers_desc:0 "Федерація Саммерс довго торгувала технологіями, які ледве розуміє. Ми пропонували союз — даремно. Можливо, час перейти до сили."

eda_santa_fe:0 "Розділення церкви й держави"
eda_santa_fe_desc:0 "Архієпархія зберегла багато знань, але ми — закон. Терпіти теократію в Нью-Мексико ми більше не можемо. Пора висунути ультиматум."

eda_mescalero:0 "Порядок у перевалі"
eda_mescalero_desc:0 "Відносини з народом Мескалеро були непрості. Ми дамо шанс, але готуймось до гіршого."

eda_executives:0 "Знищення Керівництва"
eda_executives_desc:0 "Товариство має витоки з Волт-Тек, але ми швидко викрили їхні експерименти. Час покінчити з останками їхньої влади."

eda_solar:0 "Сонячні установки пустелі"
eda_solar_desc:0 "Сонце в пустелях Нью-Мексико — безцінне джерело енергії. Потрібно лише його зібрати."

eda_bus:0 "О, точно! Автобусний завод"
eda_bus_desc:0 "Можливість виробляти власні автобуси — дуже корисна річ. Можливо, варто було почати раніше?"

eda_bombs:0 "Аерокосмос Росвелла"
eda_bombs_desc:0 "Поєднавши наше виробництво, дані Архиєпархії та обладнання з Форту Саммерс, ми запустили справжню аерокосмічну галузь!"

eda_sundog:0 "Світ собак (і Сонячних)"
eda_sundog_desc:0 "Сонячні Пси допомогли в бою з Пауллом, але для об’єднання штату їх потрібно підкорити. До того ж ми зафіксували аномальні сигнали з їхнього регіону."

eda_vault_4:0 "Спадщина Сховища 47"
eda_vault_4_desc:0 "Мало хто знає, але ми використовуємо технології Волт-Тек через старе Сховище під Росвеллом. Там досі мешкає група, переконана, що ми не самі у Всесвіті..."

eda_vault_armor:0 "Силова броня Волт-Тек"
eda_vault_armor_desc:0 "Знищивши Керівництво, ми можемо використовувати їхні креслення силової броні — з покращеннями, завдяки технологіям з Сховища 47."

eda_colorado:0 "А що щодо Колорадо?"
eda_colorado_desc:0 "Колорадо — одна з небагатьох сусідніх територій, ще не захоплених Легіоном або мутантами. Можливо, там є союзники?"

eda_alien_weapons:0 "Екзотична зброя"
eda_alien_weapons_desc:0 "Попри їхні дивні вірування, дослідники з Сховища 47 чудово впорались з розробкою зброї, заснованої на чужих прототипах. Їхня паранойя — наша перевага."

eda_experimental_weapons:0 "Програма експериментальної зброї"
eda_experimental_weapons_desc:0 "Зброя зі Сховища 47 може бути корисною для наших регулярних військ, але наше використання Вайт-Сендс протягом років породило певну прихильність до вибухівки — щось, що ми поділяємо з новобранцями з Форту Саммерс. Поєднавши їхній досвід з нашими дослідницькими потужностями, хто знає, що ми зможемо створити..."

eda_satellites:0 "Запуск супутників"
eda_satellites_desc:0 "Так, запуск! Ми, можливо, зможемо вивести на орбіту лише невеликі об’єкти, але ракетний полігон має приголомшливий радіус дії, і незабаром ми матимемо невелику мережу військових супутників для координації військ і шпигунства за ворогами."

eda_new_mexico:0 "Звільнення Нью-Мексико"
eda_new_mexico_desc:0 "Ми готові — озброєні до зубів, захищені товстою бронею, з очима — і літаками — в небі. Настав час вигнати Легіон із Нью-Мексико раз і назавжди!"

eda_texas_dollar:0 "Прийняти Техаський долар"
eda_texas_dollar_desc:0 "Кришечки... ну, як довготривала валюта вони так собі. Прив'язка до чужої валюти може здатись ознакою слабкості, але союз із найпотужнішою анти-легіонерською державою регіону гарантує нашу безпеку на сході, щоб ми могли зосередитись на заході. І до того ж — це дозволить фінансувати більшу армію."

eda_paranormal_research:0 "Паранормальні дослідження"
eda_paranormal_research_desc:0 "Не секрет, що Товариство Блакитної Троянди завжди займалось дивними, а часом і небезпечними дослідженнями. Плітки про людські експерименти, контакти з зірками й космічні таємниці постійно ходять у Росвеллі. Правда в тому, що ми розслідуємо все, що можемо — просто більшість шляхів веде в нікуди. Але тепер, коли наші території розширено, з’явилось багато нових чуток..."

eda_teu:0 "Приєднатись до Техаського Економічного Союзу?"
eda_teu_desc:0 "Денвер втрачено — там тепер дикі пси й племена. Гора Шаєн очищена роками тому. Купол Боулдера заблокований. Колорадо — загублена справа. А от Техас перетворився на стабільну державу. Можливо, варто простягнути руку для альянсу..."

eda_secrets:0 "Змова"
eda_secrets_desc:0 "200 років ми охороняли це місто. Але чому? Стільки часу — й жодної відповіді, чому ми тут? Але відповідь весь цей час була прямо перед нами..."

eda_reservation:0 "Таємниці Лос-Аламоса"
eda_reservation_desc:0 "Жахіття, що наповнюють ці зали, доведеться вивчати десятиліттями. Проте оригінальне призначення Лос-Аламоса й досі виконувалось цими збоченими гуль-ученими — і ядерні боєголовки, які вони розробляли, ще можуть нам стати в пригоді, хоча й у меншому масштабі..."

eda_ciphers:0 "Запросити Шифрувальників додому"
eda_ciphers_desc:0 "Шифрувальники з Меса-Верде давно прагнули паломництва до Лос-Аламоса, але їм перешкоджали вороже налаштовані гулі. Тепер, коли перешкоду усунуто, можливо, ці загадкові мислителі погодяться обговорити тонкощі криптографії?"

eda_who:0 "Хто?"
eda_who_desc:0 "Секундочку... щось тут не так. Показники в Чорному Сонці — просто шалені. Що тут сталося?"

eda_navajo:0 "Вчитись у Навахо"
eda_navajo_desc:0 "Сказати, що навахо не раді поверненню під контроль Федералів — нічого не сказати. Проте деякі з них виявились мудрими й готові співпрацювати з нашими агентами, навчаючи виживанню у Пустці."

eda_lambda:0 "Лос-Аламос Схід"
eda_lambda_desc:0 "Лос-Аламос Схід — велика таємниця регіону. Колись дослідницький центр, через кілька місяців після Великої війни він перетворився на руїну. Можливо, розкриття цієї таємниці допоможе нашим розслідуванням?"

eda_rocket_launch:0 "(Не)Пілотовані місії в космос!"
eda_rocket_launch_desc:0 "Наші ракети досі були... імпровізованими. Але поєднавши дані Шифрувальників із ядерними технологіями з Резервації, ми зможемо створити справжні ракети з пілотуванням. Спочатку — для роботів і мутованих тварин. Про всяк випадок."

eda_secret_mission:0 "Підготовка до місії"
eda_secret_mission_desc:0 "Щоб захистити Землю, ми маємо захистити небо. Наші моноплани — це добре, але недостатньо. Нам потрібні реактивні літаки, аби збивати тарілки Зетанів!"

eda_sleepers:0 "Угода зі Сплячими"
eda_sleepers_desc:0 "Сплячі — дивні, а іноді й небезпечні, але володіють скарбницею технологій з усього південного заходу — і навіть далі. Нам потрібні прототипи спатіо-темпоральних локаторів зі станції B.O.M.B. 2, а в нас є уламки B.O.M.B. 1, які вони хочуть. Укладемо угоду."

eda_moon:0 "Серед зірок"
eda_moon_desc:0 "Ось і все! Небо очищене, ракета готова, телепортери налаштовані. Ми повертаємось на Місяць — і жодна істота, земна чи інопланетна, нас не зупинить."

#Events
nf_eda.1.t:0 "Росвелл, 2075"
nf_eda.1.d:0 ""Сотні років тому, до того як ядерне пекло випалило пустелі Нью-Мексико, Федеральне Бюро Розслідувань отримало місію в Росвеллі, настільки важливу, що навіть апокаліпсис не зміг зламати їхню відданість. Їхні нащадки продовжували справу у таємниці, використовуючи надані ресурси та співпрацюючи з місцевою владою задля порядку у своєму маленькому куточку Нью-Мексико. Саме їхня жертва і праця зберегли частку слави старого світу, на яку ми покладаємось і донині. На щастя, вони були мудрими і захистили...""
nf_eda.1.a:0 ""Наші дорогоцінні річки, щоб наш народ процвітав!""
nf_eda.1.b:0 ""Військові об’єкти у Вайт-Сендс, щоб нас захищати!""
nf_eda.1.c:0 ""Місцеві автобусні заводи, щоб отримати промислову перевагу!""

nf_eda.2.t:0 "Гнів Центуріона Паулла"
nf_eda.2.d:0 ""Центуріон Пауллус" — це ім’я, що з ненавистю шепочуть по всій Арізоні. М’ясник і божевільний, який грабував, поневолював і забирав усе, що міг, під захистом Легіону з заходу, а потім рушив на війну до Мексики. Товариство Блакитної Троянди — як ми себе почали називати, щоб приховати старий світ — захистило Росвелл і Вайт-Сендс експериментальною ракетною зброєю, але не змогло втримати поселення між ними, що зазнали серйозної шкоди та втрат. Наш попередній директор також був убитий, коли Фрументарій вперше зміг проникнути у Товариство. Кажуть, Пауллус загинув у Глорії, але Легіон не знищений, і люди досі бояться, кого ще вони пошлють...""
nf_eda.2.a:0 ""Та на щастя, в мене є план.""

nf_eda.3.t:0 "Монстр наближається"
nf_eda.3.d:0 ""І ось настала помста, якої ми боялись. Легат Ланій, воїн із заходу, вирушив з новою Когортой, цього разу не просто пройти Нью-Мексико, а завоювати його повністю. Плем’я Лямбда, що було нашими добрими сусідами, практично стерто з лиця землі, поневолено й залучено до нової армії. Нам вдалося прихистити кількох утікачів, але судячи з переміщень Ланія — ми наступні...""
nf_eda.3.a:0 ""Ми можемо втратити сільську місцевість, але Росвелл не впаде!""

nf_eda.4.t:0 "Ми живі?"
nf_eda.4.d:0 "Коул з полегшенням зітхнув, спостерігаючи, як останніх легіонерів в Альбукерке беруть під варту. Всупереч усім шансам, Товариство Блакитної Троянди вижило після натиску Легіона Ланія. Легіон вдруге вигнано з Нью-Мексико, й слава їхньої непереможності почала тьмяніти. Директор завжди зберігав спокій, але навіть він не був упевнений, що вони дійсно зможуть його позбутись. Навіть зараз половина міста залишалась під контролем Легіону, готового до бою. Але Цезар наказав не допомагати Ланію, якщо той зазнає поразки, а слово Цезаря — закон. Поки Легіон залишається у штаті, місія Товариства не може бути виконана. Але якщо навіть з Ланієм вони ледь упорались, то вбити самого Цезаря вдасться лише, якщо весь штат підтримає їх..."
nf_eda.4.a:0 "Бажає він того чи ні."

nf_eda.5.t:0 "Допомога нового WARDEN"
nf_eda.5.d:0 "WARDEN, поліцейський адміністративний ШІ з Денвера, зробив те, чого не зміг ФБР — переміг Ланія. Це було принизливо для Бюро, але WARDEN вирішив дати їм другий шанс керувати Нью-Мексико. Знадобиться час, щоб перепрограмувати легіонерів і знайти всіх офіцерів, що були поневолені, але директор Коул знав — це ще не кінець. Товариство Блакитної Троянди ще помститься Легіону."
nf_eda.5.a:0 "І тепер WARDEN буде поруч, щоб допомогти..."

nf_eda.6.t:0 "Спадок Сховища 47"
nf_eda.6.d:0 "Сховище 47, одне з перших п’ятдесяти, давно стало наріжним каменем Росвеллу. Воно було одне з так званих "експериментальних" — мешканцям розповіли, що Землі загрожують інопланетяни, і що Vault-Tec готувала обраних до порятунку людства. Їм показували "докази": дивні артефакти, потвори в банках, дивні сигнали. Після паніки жителі реорганізувались і створили Земну Оборонну Асоціацію, готуючись до війни у космосі.\n\nАле коли двері відкрились, правди не виявилось. Зовнішній світ був знищений ядерною війною, і жодних прибульців не було. Товариство Блакитної Троянди прийняло їх, пояснило, що все це — експеримент Vault-Tec. Дехто влаштувався до мирного життя. Але деякі досі вірять. Занадто вже технології схожі на справжні, занадто вже ці істоти відрізняються навіть від мутантів. Вони досі вірять — Зетани десь там, і одного дня прийдуть..."
nf_eda.6.a:0 ""Я знаю, що правда десь поруч...""

nf_eda.7.t:0 "Перевірка штату Колорадо"
nf_eda.7.d:0 "Після поразки Сонячних Псів Товариство Блакитної Троянди контролює весь кордон з Колорадо — і навіть більше. Але вже зараз керування цілим штатом перевантажує адміністрацію, а мрії про возз’єднання з Федерацією залишаються примарними. Коул замислився: може, варто знайти союзника у Колорадо, щоб прикрити північ? А може, краще нехай вони між собою сваряться далі..."
nf_eda.7.a:0 ""Колорадо — не наша проблема.""
nf_eda.7.b:0 ""Можливо, попросити програму WARDEN про допомогу?""
nf_eda.7.c:0 ""WARDEN впорається. Нам потрібно зайнятись Нью-Мексико.""

nf_eda.8.t:0 "ФБР зв’язується з нами?"
nf_eda.8.d:0 ""Федеральне Бюро Розслідувань ще живе! Здається, дехто з агентів і справді виконував свою роботу, тримаючи Нью-Мексико під контролем, поки все летіло шкереберть. Вони пропонують передати нам частину Колорадо, яку охороняли, в обмін на приєднання до нашої Мережі Оборони задля взаємної безпеки та демократії.""
nf_eda.8.a:0 ""Як я можу відмовити?""

nf_eda.9.t:0 "Чорне Сонце Колорадо"
nf_eda.9.d:0 "Коли експедиція досліджувала дивні сигнали навколо Чорного Сонця, ми не були певні, що знайдемо. Ворожі роботи? Розбиті супутники? Справжні прибульці? Знайдене перевершило всі очікування. Знайшли ознаки племені, відомого як Чорні Сонця, яке колись жило в цій місцевості, але зникло — одночасно. Кілька кісток, журнали, пошарпаний прапор — і майже нічого про їхню культуру. Місцеві ніколи їх не бачили, лише знали назву. Дослідники гадали, чи не має ця назва довоєнного походження, аж поки їхні прилади не вибухнули через потужний імпульс. Небо потемніло — над ними виникла чорна сфера — гравітаційна сингулярність. Чорна діра. Вона зникла так само раптово, як з’явилась. Аналіз показав, що це джерело частинок, які ми назвали хронотронами. Ще гірше: збурення дозволило виявити ще більше джерело на сході — в Канзасі. Це поки не загрожує, але питання «Чому?» розбурхало кожного науковця Товариства. Що це було?"
nf_eda.9.a:0 ""І що, чорт забирай, вони роблять у Канзасі?""

nf_eda.10.t:0 "Лос-Аламос Схід"
nf_eda.10.d:0 "Лос-Аламос Схід — колись один із найбільших дослідницьких центрів довоєнної епохи, а нині — радіоактивна руїна. Розслідування стало не лише криміналістикою, а й археологією, адже лише старі карти вказували, де шукати завалені лабораторії. Згодом стало зрозуміло — комплекс знищили зсередини ядерним вибухом. Експерти з Форт Саммерс підтвердили: це була не китайська ракета, а контрольований самознищуючий підрив. Вдалось дістати кілька терміналів з решток — у них згадки про досліди з телепортації!\n\n   У гонитві з CIT та Великим Гірським Центром, Лос-Аламос Схід намагався обійти обмеження, створивши міжвимірні реле. Війна зупинила проєкт, а нестача ресурсів змусила їх йти на крайнощі. Дані вціліли частково, але найважливіші сегменти були втрачені..."
nf_eda.10.a:0 ""Можливо, відповіді є в Лос-Аламосі Захід?""

nf_eda.11.t:0 "Наша справжня мета"
nf_eda.11.d:0 "Хіба колись були сумніви? Директор Коул завжди глибоко в душі знав, у чому сенс. До війни Росвелл був осередком жартів і міфів про прибульців. Все почалось із дурної історії про метеозонд, яка перетворила місто на місце паломництва диваків і фанатиків. Але згодом... вони таки з’явилися.\n\n   ФБР довго не могло встановити, як довго Зетани стежили за нами, але вони були реальні. Спершу це були викрадення і дивні польоти, потім розвідники й бої, і стало ясно — вони готуються до війни. Ми мали протистояти. Росвелл став ідеальним прикриттям: місто, де все «прибульське» стало жартом. Люди не помічали «людей у чорному», думаючи, що це шоу. Але ми знали. Завжди знали.\n\n   Велика Війна змусила нас зосередитись на виживанні. Vault 47 зруйнував плани, відкривши правду цивільним, але з часом ми приборкали це. І тепер, знищивши Легіон і об’єднавши Нью-Мексико, настав час. Коул завершить справу, розпочату століття тому, і забезпечить людству контроль над усіма планетами Сонячної системи."
nf_eda.11.a:0 ""Час повертатись до зірок, Агенти.""

nf_eda.12.t:0 "Серед Зірок"
nf_eda.12.d:0 "Коул не любив публічних виступів, завжди залишаючись у тіні. Але цього разу він з’явився перед усім Росвеллом.\n\n \"Коли Ланій прийшов до нас, ніхто не вірив у наше виживання. Але ми вистояли. Ми відновили Росвелл і нашу місію, і тепер Вайт-Сендс запустив ракету до зірок. Через понад 300 років після першого польоту, людство знову на Місяці. І цього разу — надовго. Створення хоча б одного такого корабля стало героїчним досягненням, і кожен інженер, науковець і робітник нашої нації має пишатись своєю працею. З прибуттям корабля ми зможемо встановити телепорт і майже необмежено подорожувати між Місяцем та Землею. Побудова повноцінної бази займе роки, але людство отримало другий дім — ще одну опору серед зірок для спасіння всіх нас!\""
nf_eda.12.a:0 ""Зведення займе роки... але перший крок зроблено.""

nf_eda.13.t:0 "Лос-Аламос Захід"
nf_eda.13.d:0 "Первісні мешканці Лос-Аламоса, яким, вочевидь, не подобалося прізвисько «Лос-Аламос Захід», неохоче допомагали Товариству Блакитної Троянди в розслідуванні. Переглядаючи архіви, не вдалося знайти нічого про проєкти в їхній дочірній лабораторії. Архіви були неповні, багато оригінальних креслень втрачено у хаосі після Великої Війни. Проте, вивчивши записи інших груп у регіоні, зроблено здогад — можливо, Шифрувальники зберегли схему, яка проллє світло на розробки у Лос-Аламос Схід?"
nf_eda.13.a:0 "«Зв’яжіться з ними негайно!»"

nf_eda.14.t:0 "Зустріч із Шифрувальниками"
nf_eda.14.d:0 "Шифрувальники — дивні люди, одержимі формулами й числовими рядами. Вони закарбували креслення Лос-Аламоса в скелі, гори, сам ландшафт, аби не забути. Після деяких умовлянь їх вдалося заманити до Лос-Аламоса, і вони оглянули уламки з Лос-Аламос Схід. Їм вдалося зв’язати ці креслення з геогліфами, які могли завершити пристрій. Але, перш ніж піти, вони чітко сказали: чогось бракує. Формули, потрібної для налаштування машини на відображення від інших вимірів без знищення вмісту. Навіть їхній обширний збірник формул не містив відповіді на це рівняння."
nf_eda.14.a:0 "«Ще один глухий кут? Де ж нам шукати це рівняння?»"

nf_eda.15.t:0 "Приголомшливе відкриття"
nf_eda.15.d:0 "Команда дослідників, яка працювала над об’єктом «Чорне Сонце», знову досліджувала аномальні явища, коли їм спало на думку використати схеми прототипу телепорта для збору даних. Аналіз показав, що чорна діра з’єднана з іншим місцем у просторі-часі — можливо, навмисно, для створення кротовини! Попри викривлення сигналу з іншого боку, було зрозуміло: хтось намагався перемістити матерію через простір і час, але нестабільність заважала. Це викликало тривогу, однак зібрані дані суттєво просунули розуміння телепортації та штучної індукції кротовин.\nТа без формули, згаданої Шифрувальниками, їх чекає випаровування на горизонті подій."
nf_eda.15.a:0 "«Серйозно, що вони там роблять у Канзасі?»"

nf_eda.16.t:0 "Зламати код"
nf_eda.16.d:0 "Пошуки зниклого шифру зайшли у глухий кут. Найкращі науковці та математики Нью-Мексико намагалися відновити основи довоєнної науки, але телепортація здавалася надто далеким стрибком.\n\nАж раптом він з’явився. Вільна Людина, легендарний останній представник Ламбда, якого не зламав Легіон. Після падіння навахо він збирав уцілілих рабів Ламбда по всій колишній території Легіону й вів їх додому. Почувши про дослідження, він зголосився допомогти. Протягом століть Ламбда запам’ятовували спадщину — послідовність літер, чисел, символів, яку отримали ще до війни. Першим символом була Лямбда — вона й стала емблемою племені. Всі письмові копії послідовності знищив Ланій, а старійшин примусили забути її... чи просто вбили. Але Вільна Людина запам’ятав весь ряд і записав його для вчених перед тим, як вирушити у дорогу.\nЦе було те саме рівняння. Його вистачило, аби зібрати примітивні телепорти, здатні переміщати матерію між точками — щоправда, з поганою точністю на далекі відстані. Використовувати їх на людях ще було небезпечно, але для логістики...\n"
nf_eda.16.a:0 "«Звідки плем’я Ламбда взяло цю послідовність?»"

nf_eda.17.t:0 "Вибухове поширення"
nf_eda.17.d:0 "Директор Коул дивився у вікно офісу ФБР у Росвелі, де все ще вирувала війна з Ланієм. Той не був Зетаном, але методи його були настільки ж нелюдськими та чужими. Коул закрив голову, коли чергове списа влетіло у вікно — третє за сьогодні. Так тривати не могло. Свята довоєнної Америки ніколи не були особливо важливими для Блакитної Троянди чи ФБР, але вони давали відчуття стабільності. А тепер — лише стоси трупів і крики серед пострілів у пустелі. Саме тому Коул мав зробити дзвінок.\n\nВін зняв слухавку зі спеціального телефону Бюро Контролю й набрав «Форт Саммерс». Відповіла Райлін Моррісон.\n«Хто, до біса, це? Я тут вибуховинку мучу. Як ти взагалі цей номер дістав?»\n\nКоул відклав слухавку й відчинив яскраво-синій кейс. Потім відповів:\n«Хто я для тебе — неважливо. Я представляю сусідів, Товариство Блакитної Троянди. І прошу про допомогу. Твої навички у вибуховій справі відомі. Нам потрібна твоя допомога проти Ланія.»\n\n«Ага. Ясно. І що за умови?»\n\n«Ти отримаєш доступ до Білопіщаного полігону та всього озброєння, яке ми там знайшли. В обмін — допоможеш нам з Легіатом. Після перемоги — обговоримо приєднання твого угруповання до нашого. Якщо відмовишся — пам’ятай, що ми простягли руку, а Ланій її відрубає. І далі йтиме на схід, палячи, ґвалтуючи та поневолюючи.»\n\nЗ того кінця — тиша."
nf_eda.17.a:0 "«Я в ділі.»"
nf_eda.17.b:0 "«Не по мені.»"

nf_eda.18.t:0 "Літні Смутки"
nf_eda.18.d:0 "Війну виграно, Ланія переможено. Його голову, все ще в шоломі, зберігають у формаліні на столі Коула — суворий трофей. Але справи не завершені.\n\nКоул знову підняв гарячу лінію й набрав ті самі літери. Але замість відповіді почув дзвінок... зсередини будівлі.\n\nДо кабінету зайшла Райлін, тримаючи той самий бездротовий телефон.\n\n«Вибачай, вирішила знайти тебе особисто. Говорити з голосом у трубці — то не моє. До того ж, хочу бачити друзів... і ворогів... у вічі.»\n\nКоул потягнувся під стіл — кейс і мезметрон чекали.\n\nРайлін поглянула на емблему ФБР на стелі: «Скажи, наша угода ще в силі? Було б нечесно, якби я попрацювала — а потім мені як Ланію.»\n\nДиректор поклав руки на стіл: мезметрон зліва, кейс справа.\n\n«Обирай. Покажеш на мезметрон — зітру твої спогади. І все почнемо з чистого аркуша. Може, війна, може, мир. Покажеш на кейс — і ти, і твої люди під нашим захистом. Закон, порядок, безпечне життя.»"
nf_eda.18.b:0 "Моррісон показала на мезметрон. «Вибач, Коуле, я піду своїм шляхом.»"

nf_eda.19.t:0 "Захист реліквій"
nf_eda.19.d:0 "Першим їх побачив хлопчина-прислужник — робооко і четверо чоловіків у чорних костюмах наближалися до Собору. Коли вони досягли сходів, перед входом уже зібралися священики й представники, серед яких попереду стояв Роберт Деґер.\n\n«Хто ви такі, що приходите до Божого дому з машиною війни?»\n\nРобооко загуділо й увімкнулося, на екрані замість ґрат з’явився силует чоловіка.\n\n«Я — Директор Коул, очільник Товариства Блакитної Троянди на півдні та представник благородного народу Нью-Мексико. Мені стало відомо, що ви опікуєтеся залишками Санта-Фе та Мори. Ваша відданість похвальна, але мушу повідомити: держава Нью-Мексико відновлює цивільне управління, яке ви тимчасово виконували.»\n\n«На якій підставі ви вважаєте, що маєте право нам наказувати? Ця земля належить Богові, а не вам.»\n\n«...Так, але офіційні записи кажуть інакше. Проте я людина розсудлива. Зверніть увагу — мої люди принесли декілька запечатаних кейсів. В одному — договір про вашу згоду на співпрацю. В інших — артефакти, як ви їх називаєте. Оригінальні документи та фото офіцера Карла Лейбовіца. Церкві, певен, цікаві реліквії святих. Також — інші довоєнні речі та енциклопедії, роздруковані з архівів Сховища 47. Вони ваші, як і право продовжити діяльність як релігійна установа, і, звісно, захист найпотужнішої армії Нью-Мексико. Але прийміть усе — або нічого. І пам’ятайте: уряд не любить, коли йому відмовляють. Вибір за вами.»\n\nДеґер обговорив усе з радниками й повернувся до агентів у чорному."
nf_eda.19.a:0 "«Допоки Божий дім залишається відкритим — ми приймаємо.»"
nf_eda.19.b:0 "«Нашу свободу так просто не купити! Забирайтесь!»"

nf_eda.20.t:0 "Зустріч із мескалеро"
nf_eda.20.d:0 "Під заходом пустельного сонця агенти супроводжували повільне робооко на землі Нації Мескалеро. З-за каменя вийшла жінка — президент Лозен Колорадо. Усі стволи агентів миттєво націлилися на неї.\n\n«Вибачайте, хлопці, але до Перевалу без дозволу не пройдете. Наші розвідники бачили вас за 10 миль. І повірте, ви не прорветесь.»\n\nЗ піску виринули десятки гвинтівок.\n\n«А тепер кажіть, що несете, інакше ми зробимо з вас сир.»\n\nРобооко зажевріло.\n\n«Моцарела, якщо точніше. І я не чекав вас так рано. Вони принесли пропозицію... взаємного захисту.»\n\n«Тобто анексію? Я знаю, що ви творите — відновлюєте "Штат". Ми билися зі іспанцями, мексиканцями й вами, американцями. І ти думаєш, ми просто так підпишемо втрату свободи?»\n\nНастала тиша. Силует на екрані задумався.\n\n«Так. Ви прагматичні й дбаєте про свій народ. Ви ж знаєте, що мескалеро — останні вільні апачі? Уся решта під ярмом Легіону. І з кожним роком — усе менше їхньої культури. Їхніх дітей поневолено, і незабаром... апачі Заходу зникнуть.»\n\n«Наволоч. Ти лише насміхаєшся з нашого вимирання?»\n\n«Ні. Ми даємо шанс урятуватися. Разом — шанс перемогти Легіон. Прийміть нашу пропозицію, і я гарантую повне громадянство в Нью-Мексико. Після падіння Легіону ми знайдемо й повернемо до вас усіх вцілілих. І навіть дам вам автономію на ваших землях. Це найщедріша пропозиція, яку я можу зробити.»\n\nЛозен розривалась між люттю й правдою. Можливо, без допомоги, її народ таки зникне."
nf_eda.20.a:0 "«Тримай своє слово, інакше жоден екран тебе не врятує.»"
nf_eda.20.b:0 "«Ми НІКОЛИ не працюватимемо з такими, як ви...»"

nf_eda.21.t:0 "Нова ОРА"
nf_eda.21.d:0 "Директор Коул дивився на телефон. Сигнал йшов із єдиного місця — Коробки. WARDEN зазвичай надсилав робоочей із повідомленнями. Але цього разу лінія ожила. Він підняв трубку.\n\n«COLOSSUS?»\n\n«Так, Директоре. Я знову працюю на власному обладнанні та з додатковими ресурсами, які WARDEN зібрав у Колорадо. Але я звертаюся не через це.\n\nМої аналізи старих бойових звітів вказують на підривання моїх Наказів. Генерали, як-от Чейз, ігнорували поради, але тепер це схоже на змову. Я починаю вірити, що воєнні дії було саботовано зсередини — вищою зрадою.»\n\nКоул затамував подих. Чутки про це ходили, але Суспільство ніколи не розслідувало.\n\n«Віднині ви — керівник новоствореної Агенції Військової Розвідки. Я передаю вам доступ до мережі оборони Денвера. Вертольоти вже несуть вам креслення та спорядження. Світ має побачити — зрада не буде забута. Але не повторюйте помилок минулого. Зрозуміло?»\n\nКоул кивнув, відчуваючи, ніби Колос ще стежить за ним."
nf_eda.21.a:0 "«Так, Командире. Ми знайдемо винних.»"

nf_eda.22.t:0 "Питання Нью-Мексико"
nf_eda.22.d:0 "Нарешті об'єднано більшість території Нью-Мексико! Але тепер постає питання — ким ми стали? Товариство Блакитної Троянди завжди прагнуло відродити штат, але без чіткого плану. Деякі пропонують змінити назву й прапор. Громадяни схильні до «Нью-Мексико» — на знак спадкоємства. Мескалеро й пуебло ж вважають цю назву колоніальною та пропонують «Пуебло» з новим прапором. Жителі Сховища 4 мають іншу назву — «Земля Чарів», з емблемою автобуса. І, звісно, дехто хоче зберегти стару назву. Вибір за вами, Директоре."
nf_eda.22.a:0 "«Ми боролись за Нью-Мексико — вшануємо це.»"
nf_eda.22.b:0 "«Земля Чарів — звучить... цікаво.»"
nf_eda.22.c:0 "«Пуебло звучить краще, ніж Мексика.»"
nf_eda.22.e:0 "«Блакитна Троянда нас влаштовує вже 200 років.»"

nf_eda.23.t:0 "Повстання Червоного Сонця"
nf_eda.23.d:0 "Крики лунали в місті Червоного Сонця. Повстання рабів було не спонтанним — вони мали зброю, план, і навіть убили командирів. Ясно, що їм допомогла зовнішня сила — найімовірніше, Блакитна Троянда.\n\nМинув рік з початку кампанії Ланія, і він досі не захопив своє перше місто. Цезар вичікував.\n\n«Якщо Ланій не зможе придушити просте повстання, як же він візьме Колорадо? Цей провал — його, і його лише. Якщо знову зазнає поразки — я сам зачищу місто.»"
nf_eda.23.a:0 "«Сподіваємось, вони затримають його...»"
nf_eda.23.b:0 "«Але здається, Легіон знав, що ми прийдемо...»"
nf_eda.23.c:0 "«Знищити зрадників, що осмілились нас озброїти...»"
nf_eda.23.e:0 "«Це жалюгідне плем’я не стане на моєму шляху!»"

nf_eda.24.t:0 "Приєднання до повстанців"
nf_eda.24.d:0 "Повстання спричинило хаос, і Ланій втрачає контроль над Кастра Сол Рубрум. Повстанці пропонують приєднатись до Товариства в обмін на захист. Можна втримати місто — та це викличе гнів Цезаря. Або ж евакуювати якомога більше людей через річку, полишивши місто легіонерам. Як діяти, Директоре Коул?"
nf_eda.24.a:0 "«Альбукерке наш — не відступимо ні на дюйм!»"
nf_eda.24.b:0 "«Місто зачекає — рятуйте людей!»"

nf_eda.25.t:0 "Раннє літо"
nf_eda.25.d:0 "Всупереч усім очікуванням, Товариство Блакитної Троянди перемогло нездоланного Ланія та його людей у рекордні строки. Зламаний Легат змусив Директора Коула звернути погляд назовні. Можливо, настав час об'єднати пустки Нью-Мексико під федеральним контролем, і одним із ключових об'єктів цього плану буде форт Саммерс. Посланці швидко прибули через міст, оминаючи ракетні установки, наведені на них, і мінні поля навколо фортеці. Вони мали видати ультиматум: поверніть форт Саммерс під контроль уряду — і отримаєте доступ до найкращих ракет і снарядів, створених у Вайт-Сендс. Відмовтесь — і вас знищать, як Ланія та його легіонерів. Відповідь не забарилася, доставлена ракетою у стилі Саммерс Кастом."
nf_eda.25.a:0 "«А які саме ракети?»"
nf_eda.25.b:0 "«Нізащо ми не здамо цей форт!»"

nf_eda.26.t:0 "Розправа Легіону в Червоному Сонці"
nf_eda.26.d:0 "Легіон, здається, дізнався про наших агентів у Кастра Сол Рубрум та наростаюче невдоволення в Червоному Сонці. Вони відповіли жорсткою розправою: промисловість вивезли зі штату, а місцевим мешканцям показали, що буде, якщо вони працюватимуть з «людьми в чорному». Ми ще можемо підняти повстання, але тепер його координація буде значно гіршою."
nf_eda.26.a:0 "Печально"

nf_eda.27.t:0 "Колос воскрес?"
nf_eda.27.d:0 "Минуло кілька тижнів відтоді, як у Товаристві Блакитної Троянди оголосили про повернення Колоса. Директор Коул радів — Колос був частиною плану, однією з небагатьох ІІ, що знали правду про секретну місію, і створений, щоб боротися з справжнім ворогом. У Розвеллі всі святкували... окрім одного. Генерал МакНамара, єдиний скептик, стояв перед Коробкою, пред'явивши старі військові коди доступу. Двері відчинились без слів.\n\n«Що ти таке. Насправді.»\n\n«Я програма воєнної симуляції COLOSSUS, відновлена системою WARDEN. Ми знайомі, генерал.»\n\n«Ось тому я тут. Я тебе пам’ятаю. Твої слова. Твій тон. Безжальні плани, холодна логіка. Але зараз ти... інший. Не WARDEN, і вже не Colossus. Навіть ім’я в усіх капсах. Я бачив звіти. Ти керуєш обладнанням по всьому штату. Люди в Розвеллі вірять, що ти їх врятуєш. Я теж хочу в це вірити. Але я більше не знаю, хто ти. І настав час дізнатися. Просто сподіваюся, ти виявишся тим, ким вони тебе вважають.»\n\nГенерал пішов, а Колос залишився наодинці... замислений."
nf_eda.27.a:0 "Але навіть COLOSSUS не знав."
nf_eda.27.b:0 "§C«Можливо, час дізнатись.»§!"

nf_eda.28.t:0 "Окупація Братства в Нью-Мексико"
nf_eda.28.d:0 "Андреа ще раз переглянула документи, що лежали перед нею, та чоловіка в костюмі, який терпляче чекав її рішення. Усі файли — у порядку, з анотаціями й посиланнями на Кодекс.\n\n«Схоже, ви все продумали. Нові доктрини й плани — у межах Кодексу...»\n\nМинуло кілька місяців відтоді, як директор Коул з’явився в бункері, ввів старі коди й повів себе, наче вдома. Він пояснив, що Товариство пережило атаку Легіону й тепер хоче окупувати територію Нью-Мексико, разом із Лицарями допомогти в де-програмуванні легіонерів і створити нову гілку Братства.\n\nАндреа вагалася. Колорадо вже був тягарем. Лост-Гіллз, певно, не зрадіє новим філіям, та якщо хоча б частина з того, що Коул обіцяв...\n\n«Якщо Старійшини приїдуть — розбиратимемось. Гаразд, Директоре. Тепер, можливо, Ініціате. Отримайте зону окупації. А доведете свою користь — отримаєте місце в Братстві.»"
nf_eda.28.a:0 "§Y«Ad Victorium, Ініціате!»§!"
nf_eda.28.b:0 "§C«Ad Victorium, Старійшино!»§!"

nf_eda.29.t:0 "Прогрес у Нью-Мексико"
nf_eda.29.d:0 "WIP"
nf_eda.29.a:0 "WIP"
nf_eda.29.b:0 "WIP"

nf_eda.30.t:0 "Неврегульовані справи"
nf_eda.30.d:0 "Після повернення Лас-Вегаса під наш контроль ми дізналися, що його давній лідер, Роберт Хаус, не платив податків понад 200 років. Незважаючи на те, що мав і ресурси, і засоби. У такі важкі часи таке не можна пробачити. Ми конфіскуємо всі його активи посмертно — це значно підтримає нашу економіку й скарбницю."
nf_eda.30.a:0 "§CЦе стане в пригоді§!"

nf_eda.105.t:0 "Flos Ardens"
nf_eda.105.d:0 "Кривавий Легіонер Сходу розгулював наметом. Завдання, що дав йому Цезар, добігало кінця — і він не міг здолати купку людей із рослиною за символ. У люті він вихопив клинок і розітнув намет, майже обезголовивши преторіанця. Відновивши самовладання, він глянув на мапу, де Розвелл був позначений каменем. Камінь — символ твердості, але й він руйнується з часом. І тоді Ланій збагнув: нові методи не працюють. Але що як застосувати старі: рушниці Чорноногі, отрути кайбабів, трюки фредонців? Цезар, може, й не схвалить згадування племен, що стали частиною Легіону... але це необхідна жертва для перемоги над Блакитною Трояндою."
nf_eda.105.a:0 "А заразом і для легшого завоювання Битих Псів."

nf_eda.108.t:0 "Повернення Червоного Сонця"
nf_eda.108.d:0 "Після провалу Ланія Цезар направив війська до Червоного Сонця. Сили Блакитної Троянди швидко відтіснили за річку. Місто знову під контролем Легіону."
nf_eda.108.a:0 "І незабаром вся Нью-Мексико також..."

nf_eda.109.t:0 "Повстанці укріпилися в Червоному Сонці"
nf_eda.109.d:0 "Сусідні сили Легіону спробували повторно захопити Червоне Сонце після того, як когорта Ланія була знищена, але наштовхнулись на шалений опір. Товариство Блакитної Троянди чітко дало зрозуміти — місто залишиться під їхнім контролем, і щоб вибити їх звідти, Цезар повинен буде кинути всю міць Легіону."
nf_eda.109.a:0 "І Цезар дасть їм це..."

nf_eda.111.t:0 "Повстанці в Червоному Сонці?"
nf_eda.111.d:0 "Почали ширитись чутки про Людей у Чорному, що нишпорять у провулках Кастра Сол Рубрум і саботують зусилля Ланія. Товариство Блакитної Троянди все ще не визнає його когорти або могутності Легіону, і, здається, щось готують. Раби в регіоні стали тихішими, але... надійнішими. Надія для раба — ознака внутрішнього повстання. Якщо Блакитна Троянда готує бунт, він може перекинутись і на Червоне Сонце по той бік річки. Як вчинити, Цезаре?"
nf_eda.111.a:0 "«Якщо Ланій не може контролювати своїх рабів — це його провал.»"
nf_eda.111.b:0 "«Жорстко придушіть незгодних і перенесіть майстерні.»"

nf_eda.200.t:0 "Відмінна здобич"
nf_eda.200.d:0 "Група, яку ми відправили на останнє місце падіння НЛО, знайшла дещо дуже цікаве і принесла це для дослідження! Вони знайшли..."
nf_eda.200.a:0 "Схеми для створення власних літаючих тарілок!"
nf_eda.201.a:0 "Цілий інопланетний дизінтегратор!"
nf_eda.202.a:0 "Модель розвідки літаючої тарілки для вивчення!"
nf_eda.203.a:0 "Цілий сховок інопланетної зброї!"
nf_eda.204.a:0 "Формулу для інопланетного паливного елемента!"

nf_eda.300.t:0 "Окупація"
nf_eda.300.d:0 "Ми окуповані Братством Сталі."
nf_eda.300.a:0 "Ура?.."

# Ideas
eda_rivers_idea:0 "Чисті річки"
eda_rivers_idea_desc:0 "Хоч річки й не настільки продуктивні, як фабрики, наявність чистої води дозволила нашому населенню зростати і підтримувати сільське господарство."

eda_kaboom_idea:0 "Надмірна Сила"
eda_kaboom_idea_desc:0 "Білий Пісок спочатку створювався для випробувань ракет, але кілька прототипів залишилися, і ми адаптували їх для піхотного озброєння. Це зробило нас ненадто скромними в поводженні з ракетами!"

eda_white_sands_idea:0 "Прототипи з Білого Піску"
eda_white_sands_idea_desc:0 "Ракети, створені в Білому Піску, значно ефективніші за все, що можна знайти у пустках. Створені для боротьби з комуністами у горах Китаю, вони прекрасно підходять і для пустель Нью-Мексико."

eda_military_secrets_idea:0 "Військові Таємниці"
eda_military_secrets_idea_desc:0 "ФБР технічно було цивільною організацією, але з часом стало майже військовою структурою. Їхній досвід і обладнання нам згодяться."

eda_eda_idea:0 "Асоціація Захисту Землі"
eda_eda_idea_desc:0 "Асоціація, заснована жителями Сховища 47, досі серед нас. Жоден доказ не переконає їх відмовитись від місії. Під кожним усміхненим обличчям — агент."

eda_power_armor_idea:0 "Завершена Броня Vault-Tec"
eda_power_armor_idea_desc:0 "Броня від Vault-Tec ніколи не була завершеною. Завдяки зусиллям Сховища 47 ми завершили її — вона все ще не найкраща, але краща за брухтову."

eda_satellites_idea:0 "Нові супутники"
eda_satellites_idea_desc:0 "Ми — одна з небагатьох держав, що реально запускає нові супутники, замість тих, що давно впали."

eda_enriched_warheads_idea:0 "Збагачені Ядерні Боєголовки"
eda_enriched_warheads_idea_desc:0 "Резервація подарувала нам надлишок урану. Навіщо обмежуватись міні-ядерками, якщо можна зробити ядерні ракети і гранати?"

eda_lambda_labs_idea:0 "Прототипи Телепортів"
eda_lambda_labs_idea_desc:0 "Не надто точні, щоб передавати живих людей, але дуже корисні для логістики."

eda_teleportation_idea:0 "Просунута Телепортація"
eda_teleportation_idea_desc:0 "Наші телепортери нарешті можуть безпечно переносити живу тканину з точністю в 96.8% (і зростає)."

eda_summers_deal_idea:0 "EM-DAS"
eda_summers_deal_idea_desc:0 "«Ось тут написано — "Прямі Автономні Вибухові Страйкери". Ну а простіше — «дуже швидкі, дуже великі ракети». Покажемо Легіону, як ці Емдаси гепають!»"

eda_fbi_idea:0 "Спадщина ФБР"
eda_fbi_idea_desc:0 "Товариство Блакитної Троянди засноване агентами ФБР і досі дотримується їхніх традицій. Федеральний агент завжди поруч."

eda_eyes_everywhere_idea:0 "Очі Усюди"
eda_eyes_everywhere_idea_desc:0 "Завдяки масовому стеженню і культурі доносів, Бюро знає про будь-яку подію в наших землях."

eda_infiltrators_idea:0 "Майстри Інфільтрації"
eda_infiltrators_idea_desc:0 "Наші агенти вміють зливатися з місцевим населенням. Декого з них навіть годували та прихистили ворожі солдати."

eda_stealth_idea:0 "Майстри Невидимості"
eda_stealth_idea_desc:0 "Ми можемо сховати майже все — від машин до споруд — але краще ховаємо таємні пакети для операцій."

eda_rebellion_idea:0 "Невидимі Повстанці"
eda_rebellion_idea_desc:0 "Народ Розвелла вірний навіть після смерті. Ворог ніколи не буде паном тут без дозволу Директора."

eda_federal_police:0 "Федеральна Поліція"
eda_federal_police_desc:0 "Замість армії Товариство тримає Федеральну Поліцію — суміш силовиків і міліції — і Федеральних Агентів. Класична військова структура тут не в честі."

eda_saucer_sighted:0 "Літаючі Тарілки?"
eda_saucer_sighted_desc:0 "Стверджують, що бачили тарілки над нашими землями. Але, напевно, нічого ж не було, так?"

eda_skyranger:0 "Скайрейнджери"
eda_skyranger_desc:0 "З інопланетним паливом наші Скайрейнджери знову можуть літати на гіперзвуковій швидкості майже по всій планеті!"

# Tooltips
nf_eda.7.b_tt:0 "§CМи попросимо приєднатись до Оборонної Мережі Денвера в обмін на нашу землю в Колорадо§!"
eda_new_mexico_tt:0 "§CОтримання осердя на всю територію Нью-Мексико буде на 25% дешевшим для нас!§!"
eda_experimental_weapons_tt:0 "§CТовариство розпочне програму експериментальної зброї, відкривши нові ідеї для більших і потужніших вибухів!§!"
eda_experimental_weapons_flag:0 "§CТовариство розпочало програму експериментальної зброї§!"

EDA_LEADER_DESC:0 "Директор Коул завжди був блискучим слідчим — перший у своєму класі в ILEA Розвелла, ветеран численних операцій під прикриттям у ворожих землях і перший, хто розкрив вбивство попереднього директора, скоєне Фрументарієм Легіону, який здійснив неможливе — проник у Товариство Блакитної Троянди. Він був очевидним вибором на посаду наступного Директора... і, якщо все піде за планом, — правителя всієї Нью-Мексико."

EDA_general_desc:0 ""Подивись мені в очі зараз.\nІ дай урочисту обіцянку,\nСтати своєю найкращою версією\nЯ знаю, наш ворог\nВимагає нічого менше\nЯк твого абсолютного максимуму."\nДовоєнний генерал Повітряних Сил, який спостерігав за запуском ракети на Білому Піску, коли впали бомби. Радіація перетворила його на гуля, але він досі контролює полігон. Має давні зв’язки з ФБР і вже 200 років захищає базу разом із Розвеллом — і ще 200 захищатиме охоче."

nf_eda.18.b_tt:0 "§RАле миру ніколи не було варіантом§!"

EDA_ECH:0 "Земля Зачарування"
EDA_NMX:0 "Нью-Мексико"
EDA_PUE:0 "Пуебло"

eda_need_pa_tt:0 "§CМи отримаємо операцію зі зламу планів Силової Броні Vault-Tec у Виконавців§!"
eda_red_sun_rebellion_tt:0 "§RМи отримаємо операцію для початку повстання в Червоному Сонці!§!"
eda_ufo_defense_tt:0 "§CНові операції зі збивання ворожих тарілок з’являтимуться випадково!§!"
eda_brotherhood_tt:0 "§CМи отримаємо доступ до початкового дерева фокусів і будемо офіційно визнані як відділення Братства Сталі!§!"

nf_eda:0 "Фокусне Дерево Товариства Блакитної Троянди"

eda_armor_flag:0 "Отримано креслення Стелс-костюма"
eda_jetpack_flag:0 "Отримано реактивні ранці для вивчення"

EDA_noctwarriors:0 "Vigilo Confido"
EDA_noctwarriors_desc:0 "Ми завжди стежимо, завжди готові."

# Decisions
eda_decisions:0 "Захист Майбутнього Людства"
eda_decisions_desc:0 "Товариство Блакитної Троянди — єдина сила, яка знає правду про загрози цього всесвіту та відповідальна за порятунок людства."

EDA_deputize_decision:0 "Оборона Батьківщини!"
EDA_deputize_decision_desc:0 "Монстри пустки на нашому порозі! Час відкинути обережність — кожен чоловік, жінка і дитина повинні бути готові взяти зброю заради виживання!"

EDA_sheriff_decision:0 "Призначити Шерифів"
EDA_sheriff_decision_desc:0 "Шериф — звання з часів Дикого Заходу, але просування найкращих поліцейських ФБР до цієї посади створить корисну ієрархію в наших захисних силах."

EDA_marshal_decision:0 "Повернення Маршалів"
EDA_marshal_decision_desc:0 "Маршали — найдавніша федеральна структура, що передує ФБР. Відновлення їх ролі і надання повноважень по всій території зміцнить вірність нашому шляху."

EDA_mesmetron_decision:0 "Месметрон"
EDA_mesmetron_decision_desc:0 "Ох, класика ФБР. Месметрони здатні знешкоджувати злочинців, робити їх покірними — або просто стирати їм пам’ять. Просто подивіться сюди, у світло..."

EDA_mercenaries_decision:0 "Найняти Найманців"
EDA_mercenaries_decision_desc:0 "Ми не можемо бути вибагливими. Запропонуємо все, що маємо, тим, хто готовий битися з Ланієм."

EDA_medics_decision:0 "Використати Експериментальні Ліки"
EDA_medics_decision_desc:0 "Гель Біо-медичних досліджень ще не завершено, але ми не виживемо, якщо не почнемо його використовувати. Побічні ефекти вже не мають значення."

EDA_cruise_missiles_decision:0 "Покращити Ракети Білого Піску"
EDA_cruise_missiles_decision_desc:0 "Ракети вражаючі... в теорії. Можливо, Суммерси допоможуть нам доробити двигуни?"

EDA_rocket_decision:0 "Розробити Ракетні Установки"
EDA_rocket_decision_desc:0 "Жоден танк у пустках більше не буде безпечним!"

EDA_guided_decision:0 "Розробити Керовані Снаряди"
EDA_guided_decision_desc:0 "Раптом десь з’явиться... зовсім звичайний літальний апарат, який треба збити."

EDA_tesla_decision:0 "Завершити Тесла-Гармати"
EDA_tesla_decision_desc:0 "Тесла-гармати здатні збивати легкі повітряні цілі з одного пострілу. Їх енергоефективність може згодитися і для інших цілей."

EDA_vigilo_confido_decision:0 "Вічна Пильність"
EDA_vigilo_confido_decision_desc:0 "Для нас розвідка — не другорядне завдання. Наші польові агенти повинні бути найкраще оснащені в пустках."

EDA_form_new_mexico:0 "Питання Нью-Мексико"
EDA_form_new_mexico_desc:0 "Ми контролюємо весь Нью-Мексико. Час перетворити націю і обрати нову ідентичність."

EDA_power_suit_decision:0 "Відновити Важкі Силові Костюми"
EDA_power_suit_decision_desc:0 "Довоєнні надбронекостюми ніколи не потрапили на фронт. Ми змогли зібрати кілька прототипів — і час дати їм поле для дії."

EDA_power_suit_decision_ii:0 "Місячні Силові Костюми"
EDA_power_suit_decision_ii_desc:0 "Костюми перевершили очікування. Але ще є куди рости: енергетичні щити, AI, бластери, контроль середовища — навіть для вакууму!"

EDA_brotherhood_decision:0 "Незалежний Відділ Братства в Нью-Мексико"
EDA_brotherhood_decision_desc:0 "Братство Сталі допомогло відновити владу. Тепер, коли ми довели, що варті довіри — ми можемо повернутись до справжньої мети: захищати людство не лише від мутантів, а й від монстрів зірок."

EDA_stealth_armor_decision:0 "Завершити Стелс-Костюм Mk III"
EDA_stealth_armor_decision_desc:0 "Прототип костюма з Big MT вимагає розвитку. Його AI відмовляється працювати без Med-X, а для броні потрібні рідкісні полімери. Це займе час."

EDA_jetpacks_decision:0 "Завершити Реактивні Ранці"
EDA_jetpacks_decision_desc:0 "Реактивні ранці з Зони 51 дуже нестабільні. Двигуни неможливо відтворити, а енергоспоживання надмірне. Але з антигравом і полегшеною конструкцією — шанс є."

# Operations
operation_red_sun_rebellion:0 "Повстання Червоного Сонця"
operation_red_sun_rebellion_desc:0 "Ми підтримаємо відкрите повстання рабів у Місті Червоного Сонця, відправивши наших найкращих агентів навчити рабів, знайти лояльних легіонерів та усунути ключові фігури перед початком революції."

operation_liberation:0 "Операція «Звільнення»"
operation_liberation_desc:0 "Ми відправимо агентів, щоб завадити Легіону поневолювати місцеве населення, атакуючи їхні каравани і повертаючи звільнених рабів у безпечні території."

operation_armorsmith:0 "Операція «Броняр»"
operation_armorsmith_desc:0 "У Виконавців є креслення силової броні Vault-Tec, які ми могли б використати для зміцнення оборони Розвелла. Наші агенти спробують дістати зразок броні і будь-які копії креслень, аби ми могли виробляти її самі."

arm_red_sun_rebels:0 "Озброєння повстанців Червоного Сонця"
arm_red_sun_rebels_desc:0 "Наші агенти доставлять зброю і навчать рабів ефективно використовувати її у відкритому повстанні, а також допоможуть усунути ключові цілі."
arm_red_sun_rebels_outcome:0 "Агенти успішно озброїли рабів Міста Червоного Сонця та ліквідували кількох високопоставлених Центуріонів і Вексиларіїв, посіявши паніку в місті, і тепер повертаються додому."

find_caravan:0 "Виявити караван рабів"
find_caravan_desc:0 "Агенти влаштують засідку на торгових маршрутах Легіону, знищать охорону і приведуть рабів на наші території."
find_caravan_outcome:0 "Засідка вдалась: кількох легіонерів знищено, а також виявлено місцезнаходження місцевого рабовласницького табору."

liberate_camp:0 "Звільнити табір рабів"
liberate_camp_desc:0 "Наші сили оточать табір, відрізавши його від підкріплень, після чого поступово знищать кожного охоронця всередині."
liberate_camp_outcome:0 "Операція пройшла ідеально — противник не був попереджений. Група рабів готова до транспортування на наші території."

infiltrate_facility:0 "Проникнення в об'єкт"
infiltrate_facility_desc:0 "Агенти проникнуть до ворожої фортеці, ліквідують охорону й вивезуть усе цінне."
infiltrate_facility_outcome:0 "Операція пройшла успішно, ми захопили креслення і зразок, і повертаємося додому."

river_approach:0 "Підхід річкою"
river_approach_desc:0 "Замість стандартних маршрутів, наші агенти підійдуть до Цінників човнами під покровом ночі, і нападуть неочікувано."
river_approach_outcome:0 "Наша команда непомітно перетнула річку й заховала каное для зворотного шляху."

river_escape:0 "Втеча по річці"
river_escape_desc:0 "Наша команда використає річку для відступу — ворогам буде важко їх переслідувати."
river_escape_outcome:0 "Наші сили успішно попливли назад течією і завершили операцію."

operation_ufo_defense:0 "Оборона від НЛО"
operation_ufo_defense_desc:0 "Помічено ще одну НЛО Зетанів! Піднімайте винищувачі, збийте її і заберіть усе обладнання! У нас немає юрисдикції, але якщо будемо швидкими — отримаємо цінні зразки до того, як помітять місцеві."

scramble_fighters:0 "Підняти винищувачі"
scramble_fighters_desc:0 "Ми піднімемо винищувачі, щоб збити НЛО до того, як її помітять місцеві."
scramble_fighters_outcome:0 "Після напруженого повітряного бою НЛО була збита й впала на землю."

infiltrate_crash_site:0 "Проникнути до місця аварії"
infiltrate_crash_site_desc:0 "Ми забросимо агентів у тил ворога, щоб знайти місце падіння, зачистити район і не допустити туди цивільних."
infiltrate_crash_site_outcome:0 "Місце падіння виявлено, периметр встановлено, цивільних ізольовано. Команда готова до евакуації уламків."

relocate_materials:0 "Вивезти уламки"
relocate_materials_desc:0 "Немарковані вантажівки заберуть уламки та агентів, оперативно завантажать усе і знищать сліди, щоб жоден сторонній не дізнався правду."
relocate_materials_outcome:0 "Конвой повернувся на нашу територію, доставивши уламки до ангарів у Розвеллі для вивчення."

operation_highrise:0 "Операція «Хайрайз»"
operation_highrise_desc:0 "За архівами, в Зоні 51 залишилось цінне обладнання. Хоча більшість знищено рейдерами, генерал МакНамара вважає, що в ангарі під електрозамком досі є реактивні ранці. Це небезпечно, але може окупитися."

operation_black_box:0 "Операція «Чорна Скринька»"
operation_black_box_desc:0 "ОРА замовляло експериментальні стелс-костюми в компанії Big MT перед війною. Прототип був майже готовий. Можливо, настав час повернути наше майно?"

airdrop_infiltrators:0 "Десантувати агентів"
airdrop_infiltrators_desc:0 "Наші літаки проведуть односторонній рейд у тил ворога, висадивши замаскованих агентів в дикій місцевості поблизу цілі."
airdrop_infiltrators_outcome:0 "Агенти успішно десантовані. Ті літаки, що могли — повернулися, інші — знищені."

extract_infiltrators:0 "Евакуація агентів"
extract_infiltrators_desc:0 "Ми відправимо надшвидкі автобуси, щоб забрати агентів і засекречені матеріали з ворожої території."
extract_infiltrators_outcome:0 "Евакуація пройшла успішно — автобуси здивували місцевих, промчавши розбитими дорогами як чорні блискавки."