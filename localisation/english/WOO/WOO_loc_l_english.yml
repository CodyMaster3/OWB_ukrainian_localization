### decisions
  WOO_wardens_of_america_category:0 "United Wardens Of America"
  WOO_wardens_of_america_category_desc:0 "While the original Wardens of the White may be long gone, Butterfingers has taken it upon herself to carry their flag, and reunite the country under their banner. Would they really care about that in the first place? Maybe not.\n\nWho's gonna tell her? Not a soul."
 
  WOO_butter_ops_category:0 "Operation: Minutes To Midnight"
  WOO_butter_ops_category_desc:0 "Despite the National Guard and Great Plains Federation’s efforts, the lands of Oklahoma are nigh lawless. Between the raiders, savages, and ruthless scavvers, you’d be lucky to enter the region and leave with your health or caps-pouch intact. Butterfingers remembers how Seattle used to be before the Brotherhood arrived. Cold. Quiet. §MSafe§!.\n\nWith her previous experiences as a Warden, she knows the best way to handle such scum and create a peaceful existence for the people of this wonderful land. All she has to do was what the Wardens had always done. Stomp on the people who were there before them, and enforce their will with an iron fist."
   WOO_sca_core_decision:0 "Reach Out To The Scrapper's Council"
   WOO_sca_core_decision_desc:0 "The men and women who make up the Scrapper Council aren't entirely unreasonable. After we make them hand over any law-breakers, we can surely strike up a deal that benefits us both."
   WOO_PAR_core_decision:0 "Imprisoning The Painters"
   WOO_PAR_core_decision_desc:0 "By putting these good-for-nothing raiders to work making guns and homes for us, we can get some good out of them after all."
   WOO_CWB_core_decision:0 "Cracking The Cypher"
   WOO_CWB_core_decision_desc:0 "Turns out these filthy tribals have just left good technology lying around, because they don't even know it's technology. By collecting it for ourselves, we can lord it over their heads how they'll never achieve their stupidity goals."
   WOO_TLL_core_decision:0 "Their Last Lodging"
   WOO_TLL_core_decision_desc:0 "I really, REALLY can't believe she said those things! Talk about a mean lady."
  
  WOO_man_co_category:0 "Man’s Company Arms & Explosives"
  WOO_man_co_category_desc:0 "The lovely folks of Man’s Co. have decided to open their business to us, seeing a ripe opportunity to make some money off of the blood we’re about to shed. Who are we to tell them no?"
   man_co_arms_dealings_1:0 "Leasing A Factory"
   man_co_arms_dealings_1_desc:0 "Surprisingly, Man Co. has no problem with us leasing some of their factory space for us to make our own weapons instead of buying the guns from them directly."
   man_co_arms_dealings_2:0 "Not Quite $400,000"
   man_co_arms_dealings_2_desc:0 "But the guns we're buying will fire for more than twelve seconds."
   man_co_arms_dealings_3:0 "If God Had Wanted You To Live..."
   man_co_arms_dealings_3_desc:0 "He would not have created the M79 Grenade Launcher: Now included in the 'Limb Removal' package of Man's Co. Arms Division."
   man_co_arms_dealings_4:0 "Enforcing Their Will"
   man_co_arms_dealings_4_desc:0 "Man's Co. Arms would never pay mercenaries to strong-arm other local businesses into accepting terrible buy-out terms. But if we did, they'd be wearing this pristine armor!"
   man_co_arms_dealings_5:0 "Horsing Around"
   man_co_arms_dealings_5_desc:0 "With the Wardens starting to adopt horseback units, Man's Co. has decided to adapt with them, creating our own Livestock department. For but a small fortune, you too can ride around in style!"
   
  WOO_faction_joining_category:0 "Friends For Texlahoma"
  WOO_faction_joining_category_desc:0 "When you're a positive person, you can make friends with anyone! I met a really nice lady in Montana that told me that. All you gotta do is take the first step and offer."
   woo_join_ncr:0 "Our Friend The Bear"
