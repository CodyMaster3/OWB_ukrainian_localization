### focus loc
  WOO_pushing_me_away:0 "Operation: Pushing Me Away"
  WOO_pushing_me_away_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Pushing Me Away§!\n§RMISSION CONFIDENTIAL§!\n\nWell, we’re far from home right now. Packed our bags and left Seattle because of those jerks back home: Brandt, Bentley, and especially my commander, Carver. Well, me and the rest of my motley crew will show them how it's done!" #gives event explaining the how the other wardens were mean to butterfingers, vewy sad :(
  WOO_a_line_in_the_sand:0 "Operation: A Line In The Sand"
  WOO_a_line_in_the_sand_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: A Line In The Sand§!\n§RMISSION CONFIDENTIAL§!\n\nOk so, maybe Vault 100 almost blew up, and I may have had a hand in it. In the end though, it didn’t happen, so I don’t know why everyone else was so mad at me and were yelling at me! It gives no one the right to be so rude." #gives event about why butterfingers left, should be something overly dramatic maybe?
  WOO_by_myself:0 "Operation: By Myself"
  WOO_by_myself_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Hit The Floor§!\n§RMISSION CONFIDENTIAL§!\n\nI lied earlier, I’m not the captain of this crew... but I am going to be! All I need to do is challenge Andrews to a duel and win! I hope I’ll win... Oh god I hope I do." #gives event detailing how she came to lead oscar kilo
  WOO_friendly_fire:0 "Operation: Friendly Fire"
  WOO_friendly_fire_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Friendly Fire§!\n§RMISSION CONFIDENTIAL§!\n\nSome of my men reported in a giant explosives cache. There’s apparently grenades, rockets, and launchers! I’ll get them to bring it to me, I hope they’ll be safe with it!" #butterfingers finds an explosive cache :)
  WOO_rebellion:0 "Operation: Hit The Floor"
  WOO_rebellion_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Hit The Floor§!\n§RMISSION CONFIDENTIAL§!\n\nNow that I’m in charge around here, it’s time to get super duper serious. I must secure the immediate area so my squad and I are safe, because we value safety (not freedom)." #butterfingers rising up against the meanies
  WOO_robot_boy:0 "Operation: Robot Boy"
  WOO_robot_boy_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Robot Boy§!\n§RMISSION CONFIDENTIAL§!\n\nSooo, I met a really really HOT boy the other day. He’s a little bit cold on the outside but I bet he’s a really nice and warm person on the inside. I’ll go talk to him and like to ask him out on a date." #butterfingers met a hot bot in robot city and took him and his buddies with her
  WOO_she_couldnt:0 "Operation: She Couldnt"
  WOO_she_couldnt_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: She Couldnt§!\n§RMISSION CONFIDENTIAL§!\n\nAfter beating those weirdo brain power people to a pulp, I think it would be time to talk to their leader and see what their whole deal was." #gives event describing the showdown between v and butterfingers
  WOO_halfway_right:0 "Operation: Halfway Right"
  WOO_halfway_right_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Halfway Right§!\n§RMISSION CONFIDENTIAL§!\n\nApparently, one of the enemies we were fighting were ghouls, just like some of our compatriots! Let’s reach out to them and convince them that we’re chill (like the Cascadian cold.)" # basically gives manpower and some guns, something something the ghouls are chill with the wardens
  WOO_keys_to_the_kingdom:0 "Operation: Keys to The Kingdom"
  WOO_keys_to_the_kingdom_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Keys To The Kingdom§!\n§RMISSION CONFIDENTIAL§!\n\nTo be all honest with myself, I didn’t think I would get this far. My crew and I took out the surrounding hostiles, managed to pacify the LZ, and we’re fairly safe! Everything is coming up Wadsworth!" #butterfingers didnt expect to come this far, but is happy she's come closer to proving her seriousness
  
  WOO_bliss_in_ignorance:0 "Operation: Bliss In Ignorance"
  WOO_bliss_in_ignorance_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Bliss In Ignorance§!\n§RMISSION CONFIDENTIAL§!\n\nEven though my team and I have secured the area that we found ourselves in, it is hard actually managing this team and the civilians that we’re in charge of! I wish Carver, or someone was here to help me!" #wow who knew leading a whole country was so tough. will give event /b
  WOO_stained:0 "Operation: Stained"
  WOO_stained_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Stained§!\n§RMISSION CONFIDENTIAL§!\n\nThose evil doers in Painted Rock are vandalizing our towns with blood, or red paint, one or the other. We can’t let them do this, we like our towns unvandalized!" #These guys keep vandalizing our walls with blood! we gotta stop em. /b
  WOO_sorry_for_now:0 "Operation: Sorry For Now"
  WOO_sorry_for_now_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Sorry For Now§!\n§RMISSION CONFIDENTIAL§!\n\nThis group of scrappers are really peaceful and are minding their own business, however, they’re in the way and I don’t really want to move around them sooooo." #These scrappers arent that hostile but we need more land, so bye bye. /b
  WOO_sharp_edges:0 "Operation: Sharp Edges"
  WOO_sharp_edges_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Sharp Edges§!\n§RMISSION CONFIDENTIAL§!\n\nMan, there sure are some dummies near us who don't like technology! We should teach them how cool G11s and Rocket Launchers are!" #These cypher weirdos need to be taught a lesson that technology is awesome! /b
  WOO_roads_untraveled:0 "Operation: Roads Untraveled"
  WOO_roads_untraveled_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Roads Untraveled§!\n§RMISSION CONFIDENTIAL§!\n\nSo, there is a cool badass cowgirl in The Last Lodge. We should go talk to her and ask her to come join us peacefully! If she and her gang don't, we’ll have to show them there is room for only one gang in this town. " #The last lodge are led by a badass cowgirl, we should ask them if they wanna join us! /b
  WOO_consequence_a:0 "Operation: Consequence A"
  WOO_consequence_a_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Consequence A§!\n§RMISSION CONFIDENTIAL§!\n\nOh my god, I can’t believe Sofia joined us! She is so cool, I hope to be as amazing and awesome and cool and amazing and awesome and cool and... Point is I want to be a badass cowgirl like her one day." # They joined us! butterfingers gushes about sofia
  WOO_consequence_b:0 "Operation: Consequence B"
  WOO_consequence_b_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Consequence B§!\n§RMISSION CONFIDENTIAL§!\n\nWell Sofia denied our request to ally together, we could’ve had a huge cowboy gang! Oh well, I can’t wait to show them we’re the best gang on this side of the Mississippi." # they rejected us! Butterfingers is exited to have a authentic cowboy brawl
  
  WOO_lies_greed_misery:0 "Operation: Lies Greed Misery"
  WOO_lies_greed_misery_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Lies Greed Misery§!\n§RMISSION CONFIDENTIAL§!\n\nDude, no! They took everything! That was my entire life-savings dude. Oh my god, oh god, oh my god I think I'm gonna be sick, I'm gonna be sick. That was everything, OH MY GOD!" #oh shit, i messed up bad. We Have No Money! /b this is triggered by an event
  WOO_butter_rations:0 "Butter Rationing"
  WOO_butter_rations_desc:0 "Who knew that giving out sticks of butter has made the soldiers so damn happy? Well, I sure didn't, everything just works out!" #simple butterfingers describes how giving out butter rations has increased soldier morale and enlistment
  WOO_whys_it_so_damn_hot:0 "Brain Blast"
  WOO_whys_it_so_damn_hot_desc:0 "So, our soldiers were just wandering around and they just found a guy. We think he was a scientist apart from the Cherokee, all we did though was offer him safety and he was excited at that prospect. " #We kidnapped some researchers from Tulsa to help us figure out how to cool ourselves off
  WOO_victimized:0 "Operation: Victimized"
  WOO_victimized_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Victimized§!\n§RMISSION CONFIDENTIAL§!\n\nPeople have been asking so much of me recently. They want better care, they want food, they want somewhere to sleep, THATS TOO MUCH TO ASK! JUST BE HAPPY WITH WHAT YOU ALREADY HAVE!!!" #wow there is a lot of angry people demanding things from me /b butterfingers is massively overwehlmed
  WOO_burn_it_down:0 "Operation: Burn It Down"
  WOO_burn_it_down_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Burn It Down§!\n§RMISSION CONFIDENTIAL§!\n\nI HATE casinos! They all need to be destroyed, and whoever runs a casino should be put down like a dog!" #this whole casino buisness needs to go! theyre all theives. /b
  WOO_pay_yo_respektz:0 "Operation: Pay Yo Respektz"
  WOO_pay_yo_respektz_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Pay Yo Respektz§!\n§RMISSION CONFIDENTIAL§!\n\nI LOVE casinos! They should all be visited at least once in your life because who knows, you could make it big one day at the slots!" #Well ig gamblings not that bad when your making money /b 
  WOO_in_pieces:0 "Operation: Carousel"
  WOO_in_pieces_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Carousel§!\n§RMISSION CONFIDENTIAL§!\n\nOh boy, we can finally ride horses just like real cowboys! I always dreamed of this ever since we got down here." #Horses!!! just like in my cowboy dreams! /b
  
  WOO_the_radiance:0 "Operation: The Radiance"
  WOO_the_radiance_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: The Radiance§!\n\nOh my god where is the SNOW!? And why is the Sun always out!? How do people even live here!?!?!?" #butterfingers talks about how weird it is that theres no snow everywhere
  WOO_wrangling_some_cows:0 "Wranglin' Some Cows"
  WOO_wrangling_some_cows_desc:0 "I tried to use a lasso today, in order to collect up some Brahmin. I, uh, may have ended up a little tangled at the end, but some of the locals helped me out of the predicament." # butterfingers tries her best to wrangle some cows, some buffoonery happens
  WOO_you_guys_ride_those_things:0 "You Guys Ride Those Things!?"
  WOO_you_guys_ride_those_things_desc:0 "I mean, I’ve seen a Brahmin Bull before, but I’ve never seen a person ride them! It’s absolutely insane too, with how technical they’re saying it is. I could NEVER." #butterfigners is astonished that people ride bulls, but thinks its so cool
  WOO_crops:0 "Crops!"
  WOO_crops_desc:0 "You mean you just, put these seeds in the ground, and food comes out a few months later!? That’s crazy! We always had to hunt Radstags and get eaten by Yao Guai for food!" #butterfingers is astonished at what crops are
  WOO_so_good:0 "So Good!"
  WOO_so_good_desc:0 "So THIS is what Butter is! It’s, actually REALLY good. I’m gonna have to put this on everything now!!!" #butterfingers actually eats butter for the first time ever
  WOO_until_it_breaks:0 "Operation: Until It Breaks"
  WOO_until_it_breaks_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Until It Breaks§!\n\nApparently, the only thing I’ve gotta do to become a cowboy, is ride a robotic bull. After that, I’ll have all the people on my side." # aparently all butterfingers has to do to become a full blown cowboy is ride some animatronic bull, how hard could that be? this gives an event
  
  WOO_high_voltage:0 "Operation: Mark The Graves"
  WOO_high_voltage_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Mark The Graves§!\n\nThese cowboys sure do know how to fight really cool-ly! While I’ve already tried a Duel at High Noon, it’d be neat to learn stuff like speed-shooting and controlling ricochets." #Its time for some action! /b butterfingers gets excited about cowboy combat
  WOO_guns_guns_guns:0 "Guns! Guns! Guns!"
  WOO_guns_guns_guns_desc:0 "Oh my GOD there are so many guns here! It feels like everyone and their mom is armed out in the plains." #there are like so many guns here!! /b butterfingers gushes about the quantity of firearms in oklahoma
  WOO_heaven_on_earth:0 "Heaven On Earth"
  WOO_heaven_on_earth_desc:0 "Not only are there ten guns to a person, but there’s enough explosive ordinance to fight the Devil himself! I’m, *sniffle*, I’m truly home..." #Explosives are everywhere! Ive truly found the place to nurish my calling. /b Butterfingers is estatic with joy for how many powerful explosives she can find.
  WOO_ghouls_are_old:0 "These Ghouls Are So OLD"
  WOO_ghouls_are_old_desc:0 "Like, seriously, these guys might be older than Brandt. How’s that possible? I, uh, I dunno. They just are." #unc unc unc moment! /b butterfingers gets annoyed at how old the tlp ghouls act
  WOO_actually_learning_tactics:0 "Actually Like, Learning Tactics"
  WOO_actually_learning_tactics_desc:0 "Oh, apparently those old guys actually know things or something. They told me that I was putting my guys in the wrong spots, and suggested a better placement. Maybe old people are good for something after all" #butterfingers actually takes a second to listen to the ghouls and see what theyre talking about
  WOO_battle_symphony:0 "Operation: Battle Symphony"
  WOO_battle_symphony_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Battle Symphony§!\n\nTo all members of Oscar Kilo, if you have not already noticed, we’ve installed speakers in all bases to play music throughout the day to improve morale. You can thank me later." # Butterfingers installed speakers blasting music in all military locations, increasing morale a ton


  WOO_fallout:0 "Operation: Fallout"
  WOO_fallout_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Fallout§!\n§RMISSION CONFIDENTIAL§!\n\nWar, war never changes."# something kinda funny should go here, idk what. this basically gives the event for butterfingers to decide her future
  WOO_in_the_end:0 "Operation: In The End"
  WOO_in_the_end_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: In The End§!\n§RMISSION CONFIDENTIAL§!\n\nI hate it here, I hate the heat, I hate the people, I hate everything here! I am going back home to Cascadia, I want to be home!!!" #I dont care anymore, i hate it here. I just wanna go home :( /b depresed butterfingers realizes shes not cut out for this
  
  WOO_cure_for_the_itch:0 "Operation: Cure For The Itch"
  WOO_cure_for_the_itch_desc:0 "§CFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Cure For The Itch§!\n§RMISSION CONFIDENTIAL§!\n\nMaybe, being a Warden sucks, being a cowboy is way better! If home is where the heart is, then my home is here in Texlahoma!" #butterfingers has decided that being a cowboy is the best! texlahoma is her true home now
  
  WOO_runaway:0 "Operation: What I've Done"
  WOO_runaway_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: What I’ve Done§!\n§RMISSION CONFIDENTIAL§!\n\nI’ve been reflecting on what the Wardens said to me. Especially Carver. Maybe I need to take things more seriously. Maybe, I can BE serious." #butterfingers tries to contact warden main command, hoping that now shes super serious she will be hailed as a hero
  WOO_homecoming:0 "Operation: Homecoming"
  WOO_homecoming_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Homecoming§!\n§RMISSION CONFIDENTIAL§!\n\nThe Wardens are alive. I never doubted them for a second, I’m just glad I managed to get a signal to reach all the way up there. I’m coming home." #butterfingers succsesfully contacts warden main command, and is hyped. gives event
  WOO_so_far_away:0 "Operation: So Far Away"
  WOO_so_far_away_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: So Far Away§!\n§RMISSION CONFIDENTIAL§!\n\nThe delay in messages is, frustrating. The only way to resolve the issue is to get closer, so it’s time we start making our way North." #Butterfingers gets annoyed with how far away she is from the other wardens, she starts making plans on how to get closer
  WOO_castle_of_glass:0 "Operation: Castle Of Glass"
  WOO_castle_of_glass_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Castle Of Glass§!\n§RMISSION CONFIDENTIAL§!\n\nIf we’re gonna head North, the first one we’ve gotta put down is this ‘Lanius’ character. Honestly, he seems like a total pushover. So what you’ve managed to conquer all of New Mexico and have started moving into Colorado? You ain’t no Warden." #Butterfingers big plan is to go through lanius to get home, very overconfident
  WOO_skin_to_bone:0 "Operation: Skin To Bone"
  WOO_skin_to_bone_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Skin To Bone§!\n§RMISSION CONFIDENTIAL§!\n\nJeeze, that guy was tough. A lot tougher than I expected, maybe we should ask Charlie Kilo for recon help next time. But hey, we managed to make it out the other side unharmed! Wahoo!" #Butterfingers won, but wow that was way harder than she thought it would be, next time she'll do more recon
  WOO_not_alone:0 "Operation: Not Alone"
  WOO_not_alone_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Not Alone§!\n§RMISSION CONFIDENTIAL§!\n\nYou know, I’ve felt like I’ve done a lot of growing these past years. Maybe, I could actually call myself a true Warden, now that I’m feeling so serious." #Butterfingers finally feels like shes a serious girl who belongs as a warden of the white, gives event
  WOO_all_for_nothing:0 "Operation: Numb"
  WOO_all_for_nothing_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Numb§!\n§RMISSION CONFIDENTIAL§!\n\nThey’re really gone, aren’t they? Brandt, Carver, Bentley, even Ryan. They’re all gone.\n\nAnd I wasn’t there to do anything about it.\n\nI’m so sorry..." #Theyre gone, everyone is gone /b Butterfigners discovers that warden main command was eradicated, this gives an event
  WOO_the_summoning:0 "Operation: All For Nothing"
  WOO_the_summoning_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: All For Nothing§!\n§RMISSION CONFIDENTIAL§!\n\nThis, wasn’t pointless right? I mean, I’m still around, I can carry the name of the Wardens into the future. There has to be a reason the dominos fell like this." #Butterfingers trying to cope with the loss, ie this cant have been all for nothing
  WOO_war:0 "Operation: Papercut"
  WOO_war_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Papercut§!\n§RMISSION CONFIDENTIAL§!\n\nThere’s nothing left for me. I’m not a leader, I’m a klutz that hasn’t been able to do anything right. The best course of action now is, to end it on my terms..." #Butterfingers is struggling with the realization, so starts an unwinnable war against texas & lanius, just to feel something
  WOO_one_more_light:0 "Operation: Faint"
  WOO_one_more_light_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Faint§!\n§RMISSION CONFIDENTIAL§!\n\nWe won? I didn’t think-\n\nPerhaps the enemies of the Wardens are not as infallible as I first thought. Perhaps, they can be killed..." #She won, she didnt expect to win, butterfingers is trying to find the light at the end of the pain
  WOO_the_requiem:0 "Operation: Somewhere I Belong"
  WOO_the_requiem_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Somewhere I Belong§!\n§RMISSION CONFIDENTIAL§!\n\nDespite the Wardens falling on hard times, there truly is nothing that can stop us. No matter how hard you stamp us out, another cell will just keep cropping up in the most inexplicable location.\n\nThat’s our true strength." #Butterfingers has found a new calling, to restore the wardens to their once proud name, in the memory of all of those who have fallen. gives event
  WOO_heavy:0 "Operation: Heavy"
  WOO_heavy_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Heavy§!\n§RMISSION CONFIDENTIAL§!\n\nBack in Seattle, I noticed that the Brotherhood’s armor was a lot heavier than ours, and they managed to win pretty easily. Maybe we should take a page from their book, and make even heavier armor for our guys." #the heavier the armor the better /b butterfingers just talks about adding tons of extra padding to their armor
  WOO_emptiness_machine:0 "Operation: Emptiness Machine"
  WOO_emptiness_machine_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Emptiness Machine§!\n§RMISSION CONFIDENTIAL§!\n\nSo, those scientists in Tulsa were actually onto something really cool. Grenades that open Mini-Black Holes. I’m giving this to every soldier under my watch. Nothing bad could happen from that." #butterfingers talks about finding these cool black hole grenades in the cherokee territory, and how she plans to equip all soldiers with them
  WOO_burning_in_the_skies:0 "Operation: Burning In The Skies" #possible canidates for removal to make space
  WOO_burning_in_the_skies_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Burning In The Skies§!\n§RMISSION CONFIDENTIAL§!\n\nWith how stable the weather is in Oklahoma, this actually is a really nice place to fly. The Monarch really would love it here." #the plains of oklahoma are perfect for a nice flight, monarch would love it here /b
  WOO_overflow:0 "Operation: Overflow" #possible canidates for removal to make space
  WOO_overflow_desc:0 "§MFROM THE DESK OF CARIE WADSWORTH§!\n§gOPERATION: Overflow§!\n§RMISSION CONFIDENTIAL§!\n\nThere are really, way too many guns here. At this point, I’m thinking we should start merging the guns together. Underbarrel grenade launchers, shotguns, pistols, sniper rifles, and assault rifles will help the troops overpower our enemies." #butterfigners basically doesnt know that to do with all the guns they have so decides to just slap guns together. gun plus gun equals mega gun.
  
  WOO_home_on_the_prairie:0 "Home On The Prairie"
  WOO_home_on_the_prairie_desc:0 "Compared to the windy mountains of Cascadia, the quiet fields of Oklahoma are quite nice. It’s calming, a feeling I haven’t felt in a long time." ### butterfingers has become a true rancher at heart, she talks about the fields being calming atleast compared to cascadia
  WOO_ultra_farming:0 "ULTRAFARM"
  WOO_ultra_farming_desc:0 "I fucking LOVE farming now! In fact, I love farming so much that I’m gonna make a new kind of farming, ULTRAFARM." # Butterfingers likes farming so much she decides it need to innovate even further, making a new system of farming called a ultra farm
  WOO_to_go_even_beyond:0 "To Go Even Further BEYOND!"
  WOO_to_go_even_beyond_desc:0 "You see, one ULTRAFARM is good and cool, two ULTRAFARMs are really cool. Three ULTRAFARMs are AMAZING!" # Butterfingers implements the farming industrial complex, a grand network of huge ultra farms
  WOO_you_aint_tough_like_me:0 "You Ain't Tough Like Me"
  WOO_you_aint_tough_like_me_desc:0 "I am so tough, the toughest around! My shooting? Tough. My killing? Tough. My horses? Tough. We are so tough gang." # nutterfingers has been shoooting and killing so long shes earned a reputation as one tough bitch
  WOO_born_and_raised:0 "Some Darn Good Riding Lessons!"
  WOO_born_and_raised_desc:0 "Hot-Bot and I have been practicing for hours on how to ride horses, I think I got pretty good at this!" # tutterfingers knows that more home grown horses are needed, so enacts a plan to mass breed horses(like in minecraft ), also she gives them steroids. 
  WOO_the_ultimate_weapon:0 "The ULTIMATE Weapon"
  WOO_the_ultimate_weapon_desc:0 "I came to the realization that horses are pretty strong. As I learned in Seattle, Power Armor is also pretty strong. What if I give the horses Power Armor?" # gutterfingers has realized with the combination of horses and power armor, no one could stop her. gives event
  WOO_this_town_aint_big_enough:0 "This Town Ain't Big Enough..."
  WOO_this_town_aint_big_enough_desc:0 "Well I found out that the good for nothin' Brotherhood of Lameo's are here. This town ain't big enough for the two of us." # Cant be texlahoma if you dont got texas now can yah? /b butterfingers also considers the teu to be real jerks
  WOO_a_constiwhat:0 "A Consti-What?"
  WOO_a_constiwhat_desc:0 "What's a constitution? I keep on hearing about it in Texas and the more I hear about it, the more useless it sounds." # her new citizens keep asking something about a republic having a constitution? butterfingers doesnt know what that is. gives event
  WOO_monkey_business:0 "Monkey Business"
  WOO_monkey_business_desc:0 "Man, these small time groups think they can oppose me? I'll show them and their stupid dreams of rising against me." # Wutterfingers deals with the fringe groups who still opose her rule in texas, she is annoyed, but somewhat exited by the action it could bring
  WOO_snooze_fest:0 "Snooze Fest"
  WOO_snooze_fest_desc:0 "Soooo, like to make people happy or whatever, I need to make a deal with politicians because if I were to shoot them, someone would get MAD!" # qutterfingers must also deal with the former politicians who still want to hold on to power, this is extremely mega boring to butterfingers
  WOO_totally_fair_elections:0 "Totally Fair Elections!"
  WOO_totally_fair_elections_desc:0 "You know what? I'll give democracy a chance, I'll hold an election, and I won't even rig it! I swear!" # butterfingers finally decides to hold an election! it actually is fair but things go awry in a way that makes it not fair. gives an event
  WOO_armor_of_steel:0 "Armor Of Steel"
  WOO_armor_of_steel_desc:0 "You know what? Despite the Brotherhood being lame, they have some kickass armor. In fact, I'll start using it! Everyone should use it since it's that cool!" # After beating the texas bos/teu butterfingers has discovered a type of armor even cooler and heavier than normal armor. she decides this armor is needed everywhere!
  WOO_fire_across_the_land:0 "Fire Across The Land"
  WOO_fire_across_the_land_desc:0 "The people around here are getting rowdy, I think it's time to wrangle these varmints and show them who run's this joint." # butterfingers must calm down and enforce her rule in texas
  WOO_dawn_of_the_republic:0 "Dawn Of The Republic"
  WOO_dawn_of_the_republic_desc:0 "It's beautiful when everything comes up Butterfingers." # the sun rises over the republic of texlahoma and butterfinger sheds a single tear. gives event
