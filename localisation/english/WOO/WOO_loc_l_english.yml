### characters
  WOO_butterfingers_NAME:0 "Butterfingers"
  WOO_butterfingers_SERIOUS_NAME:0 "Carrie Wadsworth"
  WOO_butterfingers_COWBOY_NAME:0 "The Lone Butterfinger"
  WOO_butterfingers_DESC:0 "§C“Whoops! Haha, sorry. Butterfingers...”§!\n\nHailing from the forever-winter lands of Cascadia, Butterfingers used to run with a band of autocratic mercenaries known as the ‘Wardens of the White’. While she spent most of her tenure there under the group Bravo Sierra, AKA the Black Sheep, she was still loyal to any Warden Group she would encounter, be it Foxtrot Uniform, Sierra Hotel, or Warden Actual itself.\n\nNowadays, Butterfingers finds herself mingling with the troops of Oscar Kilo, a group of Wardens who are definitely §Rnot§! cowards, and definitely did §Rnot§! flee from Seattle in fear of being reprimanded for losing against the Brotherhood."#something kinda playful, idk really what it could be
  WOO_butterfingers_SERIOUS_DESC:0 "§M“What I remember about the rise of Oscar Kilo, was how quiet it was...”§!\n\nWadsworth’s been around the block. She was there to see the Wardens lose their grip on Portland. She was there for the Eight Hour War, when Seattle fell. She was even there to see so many Wardens run North up into Vancouver, knowing they’d never make it further than The Hanging Garden.\n\nAfter a mishap with the nuclear fusion reactor of Vault 100, Carie was exiled from the Wardens, by those she thought were not only her superiors, but her friends. Now, after hijacking the leadership of Oscar Kilo from Andrew, she has to sit and think to herself.\n\nWas it worth it?\n\nProbably not..."
  WOO_butterfingers_SERIOUS_1_DESC:0 "§M“What I remember about the rise of Oscar Kilo, was how quiet it was...”§!\n\nWadsworth’s been around the block. She was there to see the Wardens lose their grip on Portland. She was there for the Eight Hour War, when Seattle fell. She was even there to see so many Wardens run North up into Vancouver, knowing they’d never make it further than The Hanging Garden.\n\nAfter a mishap with the nuclear fusion reactor of Vault 100, Carie was exiled from the Wardens, by those she thought were not only her superiors, but her friends. Now, after hijacking the leadership of Oscar Kilo from Andrew, she has to sit and think to herself.\n\nWas it worth it?\n\nMaybe..."
  WOO_butterfingers_SERIOUS_2_DESC:0 "§M“What I remember about the rise of Oscar Kilo, was how quiet it was...”§!\n\nWadsworth’s been around the block. She was there to see the Wardens lose their grip on Portland. She was there for the Eight Hour War, when Seattle fell. She was even there to see so many Wardens run North up into Vancouver, knowing they’d never make it further than The Hanging Garden.\n\nAfter a mishap with the nuclear fusion reactor of Vault 100, Carie was exiled from the Wardens, by those she thought were not only her superiors, but her friends. Now, after hijacking the leadership of Oscar Kilo from Andrew, she has to sit and think to herself.\n\nWas it worth it?\n\n§CDefinitely.§!"
  WOO_butterfingers_COWBOY_DESC:0 "§Y”Hi-Ho Butterfingers, Away!”§!\n\nHailing from the forever-winter lands of Cascadia, Butterfingers used to run with a band of autocratic mercenaries known as the ‘Wardens of the White’. While she spent most of her tenure there under the group Bravo Sierra, AKA the Black Sheep, she was still loyal to any Warden Group she would encounter, be it Foxtrot Uniform, Sierra Hotel, or Warden Actual itself.\n\nNowadays, Sheriff Butterfingers finds herself leading the great state of Texlahoma. Oscar Kilo still sticks by her side, but she’s more than a Warden now. She’s a real Cowgirl."
  
  WOO_butterfingers_GONE_NAME:0 "Where'd She Go?"
  WOO_butterfingers_GONE_DESC:0 "§YNo, seriously, where'd she go?§!\n\nSeems like Butterfingers has abandoned the Oklahoma Wardens in order to walk her way back home. Godspeed, Butterfingers.\n\nGodspeed."
  
