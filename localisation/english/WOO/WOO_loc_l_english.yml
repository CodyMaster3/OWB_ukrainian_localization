### events
  nf_woo.0.t:0 "Wardens Of The What?"
  nf_woo.0.d:0 "While it hasn’t been unheard of for other military-esque groups of ghouls to show up at the Last Patrol’s doorstep, this one might be the most strangely organized. These so-called Wardens don’t seem too knowledgeable about the weather, dressed like it’s gonna snow every day of the year. That, and anytime one of our guys has asked where they’re from, they’re all really cagey about it, merely responding with an ‘Up North’.\n\nThe oddest thing about them is that they’re led by a smoothskin, ‘Wallace Andrews’. While he seems to have shown some interest in helping us, some young upstart appeared shortly after, making a big racket about being a ‘Real Warden’\n\nWhatever the case, we’ll have to watch this with great interest." #this event swaps you to oscar kilo, so just some flavor text about harrison being confused and pissed off about his land being taken
  nf_woo.0.a:0 "Perhaps that butter-girl has a good head on her shoulders."#could prolly change these to something more fitting lol
  nf_woo.0.b:0 "Kinda annoying they took our land."

  nf_woo.1.t:0 "Those Meanies!"
  nf_woo.1.d:0 "Wallace Andrews, a Warden of the White, a hardened soldier, a natural leader. Well respected amongst the Wardens, Andrews singlehandly held off 20 Brotherhood Paladins as his platoon was retreating from Seattle. As Oscar Kilo was wandering the wastes trying to get their bearings after suffering heavy losses, Andrews made sure that they wouldn’t lose their way. While they prospered in the wasteland due to such excellent leadership, the same could not be said about other Warden remnants.\n\nCarie “Butterfingers” Wadsworth, a Warden of the White, a ruthless killer. While many may see her as a cruel being, her peers see her nothing but a clumsy fool. Her time in the Wardens has been a rough one, with constantly being berated for her slip ups and being forced to do physical training to make up for those mistakes. As she went through these trials and tribulations she was unsure if her peers really respected her and wanted to see the best out of her or they just wanted to treat her like a punching bag. She eventually came to the conclusion that..." #basically just lists her greivencances with how shes treated, could be something else idk
  nf_woo.1.a:0 "§CI'm sure they meant well.§!"
  nf_woo.1.b:0 "§CI'm sure they hated me!§!"

  nf_woo.2.t:0 "Oops!"
  nf_woo.2.d:0 "After the fall of Seattle, the Wardens shattered into a bunch of pieces. A few went north into Vancouver to never be seen again. Some went south into Portland and joined up with the pirates of The Maw. Though, most of them went eastward, into Spokane, where they would find refuge.\n\nAmongst them, was Butterfingers, where she would find herself deep in Vault 100. For a few weeks she was being harshly punished for the tiniest mistakes she made, but she chalked it up to the stress of losing Seattle to the Brotherhood. Nonetheless, she didn’t let any of it get to her, she continued her life as normally as she could.\n\nThis all changed one fateful day. After the constant abuse she was facing from her peers, she thought she could make it up to them by making the reactor of Vault 100 work more efficiently. She thought it was no different than the explosives she worked on, but she was ever so wrong. She in fact, almost made the reactor a bomb that was ready to explode, if it wasn’t for the ghoulish scientists that were there to fix her mistake. She ran away from embarrassment, all the way out of Spokane. In order for her to truly make it up to the Wardens, she knew she had to become a super serious soldier. " #she fucked up big bigtime and got so badly punished she now wants to head out on her own to become a super serious badass soldier, 
  nf_woo.2.a:0 "§CI hear those cowboy's in the South are serious!§!"

  nf_woo.3.t:0 "Uhh... Okay..."
  nf_woo.3.d:0 "As she wandered south, Butterfingers heard rumors of men donning blue and black armor, just like her. At first she was dismissive at the thought of other Wardens being this far away from Seattle; it would be ridiculous. The thought of the Wardens of the White being somewhere, where there aren’t blizzards or any snow would be preposterous! As soon as she made it to Oklahoma, to her surprise, there were in fact, WARDENS!\n\nIt took her a while to get acclimated in this land but as soon as she found her footing, she knew what she needed to do. She challenged the leader of this division, Wallace Andrews, to a duel. He accepted the duel without a second thought, believing that this would be the easiest task he has ever taken.\n\nAt sunset, Andrews and Butterfingers stared intensely at each other. 20 paces away from each other, hands on their pistols, ready to draw. As soon as they felt the time was right, their pistols left their holsters. Butterfingers dropped her gun and it was set off firing in the direction of Andrews. The bullet ricocheted off of his armor right and it went right between his eyes. The moment Butterfingers saw his corpse drop right to the ground..." #she got to oklahoma and challenged the oklahoma warden guy to a duel at sunrise, on que as the duel beging she immediately fumbles her pistol out of her hand and it fires on the ground richosheting(ik) off of like 6-7 thing until it lands in the eyes of the warben guy
  nf_woo.3.a:0 "She raised her fist triumphntly!"
  nf_woo.3.b:0 "She immediately threw up on herself..."

  nf_woo.4.t:0 "Sick!"
  nf_woo.4.d:0 "Butterfingers decided to meet with V, the leader of the Chained Choir. As soon as V and Butterfingers met face to face on top of a 100 foot cliff, something strange happened to her. She couldn’t hear the call of The Mother any longer... all she heard was crickets. V knew something was off with the soldier that was right in front of her, as this was the only time this has ever happened to her.\n\nV, puzzled in the predicament she found herself in, asked, “Why don’t I hear The Mother anymore? Why... is it so peaceful? What have you done?” Butterfingers was puzzled at the question, deciding to answer with, “I don’t know.”\n\nV looked at her, gratitude beaming from her face, and hugged Butterfingers. “Even if you don’t know what you did, you helped me... I can finally have peace.” V was, for once in her life, in a place of serenity.\n\nEven though Butterfingers was suddenly in the embrace of a former enemy, she was unsure if she should reciprocate or refuse what she was given." # butterfingers acts like a blank(anti psychic field) and just pushes v off a cliff or works with her idk 
  nf_woo.4.a:0 "§CBuh-bye!§!"
  nf_woo.4.b:0 "§CWe're best friends now!§!"

  nf_woo.5.t:0 "Cowboy Trials"
  nf_woo.5.d:0 "No one actually expected Butterfingers to survive the Mechanical Bull. Especially when she struggled to get on it in the first place. The odds were stacked even further against her when the bull threw her off on the first buck.\n\nOf course, that’s when she stood back up, and immediately climbed back on while it was still running. The night ran long with Butterfingers repeating the same three steps: Get on. Get thrown. Get back up. Over and over, for HOURS. The only people left by the end was Hot Bot and the judge sitting at the table.\n\nAfter nearly one hundred and seven attempts, Butterfingers finally sat down on the bull, and was not thrown. The mechanism had died after the 107th attempt, and she could finally stay on for a full five minutes. By technicality, she had beaten the Bull by pure tenacity." # basically a whole scene plays out where butterfingers contstantly gets flung off the metal bull, until through hard work(the mechanical bull breaks) she eventually tames the bull and becomes an offical cowboy.
  nf_woo.5.a:0 "If at first you don’t succeed, try, try again."

  nf_woo.6.t:0 "Lotsa Angry Folks"
  nf_woo.6.d:0 "With the Great Plains Federation now under our control, we’ve managed to reclaim the money I’ve lost during my trip to the Big Spend. However, we’re now faced with the proposition of taking MORE than we lost. The Chicksaw-Muscogee people are already pretty mad at us, and taking even more money would likely make them even more upset.\n\nBut why should we care?" # After taking over the great plain federation, butterfingers was able to restore all the money she lost gambling, but now has to deal with the people of the great plains federation, who are not that happy. she has two options, do em like the wardens back home would, or just grant them a lot of autonomy within the nation.
  nf_woo.6.a:0 "Let It Ride!"
  nf_woo.6.b:0 "No, it's not worth it."

  nf_woo.7.t:0 "After The Fallout"
  nf_woo.7.d:0 "So much time has passed ever since Butterfingers made it to Oklahoma. Beating Andrews in a duel. Defeating the Last Patrol and Chained Choir. Securing the Oklahoma land. Winning big at the casino’s. Butterfingers has had a lot of fun, and has grown from it. She pondered to herself though, was all of this time spent, worth it? Has she really become a serious soldier? Has she grown fond of the Oklahoma lands? Is she a real cowboy? This would be the time she would answer all of those questions. " # Butterfingers ponders over what her future will be, should she try and contact warden main command? should she just go home and not deal with this anymore? Or should she embrace the texlahoma identity fully?
  nf_woo.7.a:0 "§MI'm a Warden! I am a serious soldier!§!"
  nf_woo.7.b:0 "§CI'm going back home, fuck this.§!"
  nf_woo.7.c:0 "§YI'm a cowboy at heart, and I will always be a cowboy!§!"

  nf_woo.8.t:0 "I Can't Feel You There"
  nf_woo.8.d:0 "Wadsworth’s Log\n[?global.date.GetDateStringNoHourLong]\n\nI don’t know what to do. I sent out a signal to Brandt, and nothing, I reached out to Sylvia, and even Mulligan, and got no answer, either they’re gone too or don’t trust Wardens enough to pick up. The only person I’ve managed to get a hold of is that jerk Koester. Her only words, “The Wardens are dead. Stop calling.”\n\nI’m at a loss. All my friends, family, the people I really cared about. All gone. Could I have made a difference were I there? Could I have stopped this? Does it even matter to think about all this?" #butterfingers is in complete abject horror and misery that the wardens back north have been destroyed once more, maybe shs reachs a single warden who tells her they all died idk
  nf_woo.8.a:0 "Every step that I take is another mistake."

  nf_woo.9.t:0 "Big Day Out"
  nf_woo.9.d:0 "The radio crackled with life as Wadsworth balanced the antenna extra carefully, “C’mooon, c’mooon!” She struggled for a moment, almost toppling over, but she stretched out a leg to brace onto the wall, and finally with a quick BZZZT-\n\n“This is Warden Actual, rogue frequency identify yourself.” Carie nearly screamed in excitement, as she gestured for one of her soldiers to take over the balancing, with only minor interference.\n\n“This is Carie Wadsworth, commander of Oscar Kilo. Is, uh, is Brandt or Carver there?” There was a long silence over the radio, until she could hear someone ask ‘Commander?’\n\n“This is Brandt. Explain yourself, Wadsworth.” She sputtered out what had happened, the story of her travels into Oklahoma, duelling Andrews, facing down the National Guard and Psykers, and finally defeating the Great Plains Federation. As she spoke, she realized just how much she had actually accomplished. It seemed Brandt had the same realisation, speaking to her for the first time without any biting sarcasm or negativity." #butterfingers has been welcomed home with open arms, shes so excited. Brandt is still a lil annoyed but hey free support and land is pretty good.
  nf_woo.9.a:0 "§MGood work?§!"

  nf_woo.10.t:0 "Operation: Wahoo"
  nf_woo.10.d:0 "Carie waited with apprehension as she watched the Vertibird land in Castra Sol Rubrum. While she knew who was on board, she still wasn’t prepared for Carver to scream “Butterfingers!” as soon as the door was open. She immediately stood at attention, waiting for him to appear before her.\n\nHe marched forward, his jacket tied around his waist to deal with the heat. As he stopped in front of his former underling, he looked her over, and she could feel him squinting, “Butterfingers, do you have any idea how long that flight was? You better have some good news for me!”\n\nShe stammered out her words, trying her best to make sound more professional than normal, until Carver placed a hand on her shoulder, “Hey, relax. I already know. You’ve done good work, Carie.” He turned her away from the Vertibird as a few more soldiers started to pile out, “Should’a seen the look on your face.”\n\nShe chuckled along with him, a smile warming up her face more than the New Mexican heat ever could. “Hahaaa, you got me!” As they walked, Wadsworth started going over the statistics of her previous battles with him, feeling more comfortable being a Warden than she ever had." #Finally after so much struggle, butterfigners has begun to feel like she fully belongs to the wardens of the white. should be very emotionally sappy and like a good ending, but undercut with the fact that being a true warden basically means being evil ;)
  nf_woo.10.a:0 "§CAnd can you believe we only had a 70% Civilian Casualty rate?§!"

  nf_woo.11.t:0 "A New Chapter"
  nf_woo.11.d:0 "Wadsworth’s Log\n[?global.date.GetDateStringNoHourLong]\n\nThere isn’t a day that goes by where I don’t miss my friends. Carver, especially. I know he was a jerk near the end, but I still appreciated him as a Commander, and a friend. However, for the first time in months, I feel like some sort of weight has been lifted off my shoulders.\n\nMaybe, the Wardens are looking up at me from below, and deeming me worthy to carry on the name. Maybe, just maybe, I’ve proven myself to be worthy of the title of Warden. Nothing’s ever gonna stand in my way again." #Butterfingers has found atleast some clarity, and absolution. She decides to form the united wardens of america to honor her fallen comrades. very triumphant in tone.
  nf_woo.11.a:0 "End Wadsworth’s Log: Wahoo!"

  nf_woo.12.t:0 "A Possible Alliance"
  nf_woo.12.d:0 "Hang on, hang on. It's April Fools. Are you seriously playing Last Lodge over anything that's been added? Actually, thinking about it, it might not be April Fools and you just turned on this gamerule, which is even worse. Like, none of these options are actually good for you, either you get annexed by Oscar Kilo, or you go to war with them, and they are most definitely stronger than you. Sorry it ended up this way pal."
  nf_woo.12.a:0 "Meh, I wasn't having fun this game anyway."
  nf_woo.12.b:0 "You can have my Lodge when you pry it from my cold dead hands!"
  
  nf_woo.13.t:0 "The Lodge Accepts!"
  nf_woo.13.d:0 "Oh my god oh my god oh my god! They said yes! I get to meet a real cowgirl in the flesh and she might even show me some cool shooting tricks! I really hope she won’t push me away like everybody else!" # Hip Hip Hooray, we have a new cowgirl friend!
  nf_woo.13.a:0 "Let's hear it for the badass cowgirls!"
  
  nf_woo.14.t:0 "The Lodge Says Something Mean!"
  nf_woo.14.d:0 "Woah. That was a really colorful series of words. I’m not gonna repeat them, in case someone tries to take it out of context, but they were really really mean to me. I just wanted to be their friend, and maybe take over their settlements while giving the Grandmatron very little oversight. Was that so wrong?" #Last Lodge tells us to go fuck ourselves
  nf_woo.14.a:0 "That wasn't very nice."
  
  nf_woo.15.t:0 "Let's Go Gambling!!!"
  nf_woo.15.d:0 "Casinos, a rare sight in the Wasteland, considering not many people are trustworthy enough to give their caps away freely. Butterfingers had never even heard of these until the day she stepped foot in the Big Spend. The glitz and glamor mesmerized her, she wanted to spend the rest of her life there if she could. The concept of gambling wasn’t foreign to her, of course. The Wardens back home used to have a dead pool for folks sent to ‘hunt’ the Winterborn. She was always good at those bets, so what’s the worst that could happen here?\n\nTwo hours later, Butterfingers was sitting on the concrete outside of the city, staring up at the spinning sky. The stars stared at her like a billion winking eyes, judging her. She’d lost every single cent Oscar Kilo had, and then some. She was far too drunk to even walk home. As she waited for her men to collect her, the muddied thoughts in her head came to one conclusion: She’d have to take everything back, by force if she had to." #Butterfingers loses all her money at The Big Spend
  nf_woo.15.a:0 "Aw, Dang It!"
  
  nf_woo.16.t:0 "In This Farewell"
  nf_woo.16.d:0 "Wadsworth’s Log\n[?global.date.GetDateStringNoHourLong]\n\nI’ve been doing some thinking, deep thinking. Even if I’m the head of Oscar Kilo, or that I’ve claimed all of Oklahoma, nobody within the Wardens is gonna take me seriously if I’m wearing this silly cowboy hat. Nor will they take me seriously with a doofy smile.\n\nNo, from now on, my face is covered, my hat is standard-issue, and you’ll never find me with any amount of joy OR whimsy. I’ll blow up my enemies with no emotion, like a stone-cold killer. I’ll crush the other ‘leaders’ under my boot, like the American Imperialists of old. I won’t even blink when a family of five is torched for disagreeing with my regime."
  nf_woo.16.a:0 "Like a §MREAL§! Warden"
  
  nf_woo.17.t:0 "Did It Even Matter?"
  nf_woo.17.d:0 "There is an idea of ‘Butterfingers’. A woman who came to Oklahoma and promised the world. That she would bring Safety (not freedom) to the Southwestern Wasteland. That she would defeat the tyranny of the Brotherhood’s rule, and personally execute Lanius for enslaving people, which the Wardens definitely don’t do. That she would bring a new sense of order to Oklahoma, Texas, and even New Mexico. She promised it all, and what did she leave in her wake?\n\nDeath. Destruction. Anarchy.\n\nThe bodies she left behind are uncountable, and the people who still suffer from her regime are still trying to pick up the pieces even now. All they have left is to try to cling to what little security can be found from the guns and armor her fallen troops have left behind. That is, if the roaming death squads of what used to be Wardens don’t find the gear first. Word’s even going around that the Brotherhood has issued a bounty for the ruin she’s left Oklahoma in. 60,000,000 caps for the corpse or capture of one ‘Carie Wadsworth’, AKA... " #Butterfingers heads back to Seattle, leaving Oscar Kilo in chaos
  nf_woo.17.a:0 "§RThe Buttery Typhoon§!"
  
  nf_woo.18.t:0 "And Now For A Lesson In Governmental Management"
  nf_woo.18.d:0 "Now that Butterfingers decided that she wants to be a cowboy, the first order of business was to give everyone a cowboy hat! Not just any hats, the biggest hats! The horses get hats! The cactus will get hats! The tumbleweeds get hats! EVERYONE GETS A HAT!" #It's time for Texlahoma BABYYYYYY, we're gonna have the BIGGEST Cowboy Hats!
  nf_woo.18.a:0 "§YTHE BIGGEST HATS FOR EVERYONE!§!"
  
  nf_woo.19.t:0 "This Governing Thing Is Easy!"
  nf_woo.19.d:0 "Ever since the annexation of the Texan Brotherhood, people in the lands of Dallas have been protesting against the Warden control. The masses asked for some sort of order, a constitution for them to follow. This has eventually reached the office of Butterfingers where she was confused on what a constitution even was. After she was informed of what it was, she knew what needed to be done. She addressed the people of Texas and said, “Constitution-Shmonstitution. Who needs a paper saying what people are allowed to do when I can say it?” " #Constitution-Shmonstitution. Who needs a paper saying what people are allowed to do when I can say it?
  nf_woo.19.a:0 "§YAfterall, I am the boss, my word is best!§!"
  
  nf_woo.20.t:0 "The Results Are In"
  nf_woo.20.d:0 "The very first election after Butterfingers had taken Texas has taken place. On the ballot, there was a very intriguing selection of... one person, Butterfingers. The people of Texas didn’t really question why it was only her, after all, the other politicians of Texas hadn't been seen in public for a while. Oh well, everything will be fine under Butterfingers presidency. The people have complete and utter confidence, for sure. " #Elections are so fun! We should hold one of these again sometime!
  nf_woo.20.a:0 "§YAnd I only had to kill a few people!§!"
  
  nf_woo.21.t:0 "The Texlahoma Dream"
  nf_woo.21.d:0 "It wasn’t often that Butterfingers actually got a moment to herself nowadays. Between all the fighting, governing, and strong-arming she’d had to do to take control of Texlahoma, she always found herself being whisked from job to job. Was this how Brandt always felt?\n\nBut finally, Butterfingers had managed to secure a day off for herself. She’d gotten some of her guys to build a freezer in her new house in Dallas, which she could now finally sit back and relax in. The door clicked, she sat in her chair, and laid back, leaning against the wall. It felt just like home.\n\nHome. It’d been a while now, hadn’t it? Nearly half a decade since she’d been expelled from the Wardens, and here she was still pining for the cold winds of Washington. For a moment, heartache panged at her chest, missing the friends and family she had left behind. Then there was a knock at the door.\n\nShe smiled. They needed her. They §Rneeded§! her. She couldn't help but smile as she stood up from her chair, and opened the door, ready to face whatever was needed of her this time. She left behind the cold of the freezer, contemplating whether she’d feel the real thing again soon.\n\nFor right now, though, that didn’t matter."
  nf_woo.21.a:0 "She was home."

