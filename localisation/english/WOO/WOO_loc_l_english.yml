  WOO_cain_NAME:0 "Warden Cain"
  WOO_cain_DESC:0 "§M“Despite my defects, I’m still doing my best.”§!\n\nWarden Cain was once a high ranking member of Oscar Kilo, until he was found unreliable due to a horrible mutation that gave him too many fingers. Now, he can barely fire a gun, though his grip strength is unmatched.\n\nWadsworth decided to take pity on him, given his issues being in the same ballpark as hers, and gave him a position as the leader of the Wardens handling Black Canyon. He’s even got his own version of the Cooler here, ‘The Penitentiary’! How cool is that!?"
  WOO_generative_error:0 "§RGenerative Error§!"
  
