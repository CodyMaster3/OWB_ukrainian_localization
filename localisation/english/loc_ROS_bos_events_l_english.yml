l_english:

# Персонажі

ROS_paladin_ergo_name:0 "Паладин Ерґо"

# Ідеї

ros_macarthur_detects_brotherhood:0 "Братство у Монтані"
ros_macarthur_detects_brotherhood_desc:0 "Рейнджери Йеллоустоуна отримали допомогу від Братства. Вцілілі розповідають нам байки про когось із Сходу…"

# Подсказки й прапори

nf_ros_search_party_tt:0 "Пошукова група вирушить на пошуки вцілілих..."
nf_ros_warning_tt:0 "§GДеякі паладини залишаться, щоб допомогти нам§!, але §R[MCA.GetNameWithFlag] може стати ще небезпечнішим ворогом...§!"
nf_ros_bos_friendly_tt:0 "§G[MNC.GetNameWithFlag] запам’ятає це.§!"
nf_ros_bos_equipment_tt:0 "§GНа знак вдячності деякі з Братства залишили спорядження.§!"
nf_ros_bos_angered_tt:0 "§R[MNC.GetNameWithFlag] запам’ятає це.§!"
nf_ros_ergo_tt:0 "§YПаладин Ерґо§! приєднається до бою як §Gкомандир підрозділу§!!"

ros_paladin_ergo_available_flag:0 "Паладин Ерґо стоїть гордо серед мешканців Йеллоустоуна!"

# Події

nf_ros_bos.1.t:0 "Поглинуті ніччю, спалені полум’ям"
nf_ros_bos.1.d:0 "Минулої ночі під прикриттям бурі над Йеллоустоуном пролетів цепелін. Десь упав у менш обжиту частину парку. На його борту було знайоме емблемне зображення — таке, про яке ми вже чули з заходу."
nf_ros_bos.1.a:0 "Братство?.."

nf_ros_bos.2.t:0 "Відчужені середньозахідці"
nf_ros_bos.2.d:0 "Після двох тижнів пошуків ми натрапили на більшість уламків. У сусідній печері знайшли групу паладинів Братства Сталі, які доглядали поранених. Спершу були настороженими, але впустили нас, щойно зрозуміли, що ми — не загроза… або їм так здалося.\n\nЗ подальших розмов стало ясно, що вони сильно збились із курсу. Як ми з ними вчинили?"
nf_ros_bos.2.a:0 "Ми дали їм ліки та допомогу."
nf_ros_bos.2.b:0 "Ми допомогли й відпустили."
nf_ros_bos.2.c:0 "Дали Йеллоустоуну вирішити їхню долю — а самі забрали їхнє добро."

nf_ros_bos.3.t:0 "Паладин Ерґо"
nf_ros_bos.3.d:0 "Серед паладинів, які подякували за допомогу, одна вирішила залишитись, почувши про наші негаразди. Її звати Паладин Ерґо. Через чутки про Анклав вона наполягла залишитися тут, поки її побратими рушають до цілі."
nf_ros_bos.3.a:0 "Приймаємо її з розпростертими обіймами."

nf_ros_bos.4.t:0 "Вибух у Йеллоустоуні"
nf_ros_bos.4.d:0 "На півдні наші розвідники бачили, як цепелін вибухнув у небі й упав у долину. Особливу увагу полковника привернула одна деталь:\n\nНа ньому був символ Братства."
nf_ros_bos.4.a:0 "Їм не місце в цих горах."

nf_ros_bos.5.t:0 "Зниклий корабель"
nf_ros_bos.5.d:0 "Під час походу до Монтані один з наших дирижаблів потрапив у шторм. На щастя, хтось із них вижив — ми навіть вловили радіопередачу від одного з командирів, але зв'язок обірвався. Пильнуймо — можливо, вони ще повернуться."
nf_ros_bos.5.a:0 "Сподіваємось, з ними все гаразд."
