BEL_WINTERBORN_NAME:0 "Зимонароджений"
BEL_WINTERBORN_DESC:0 "Зимонароджений боронить Беллінгем уже понад двісті років. У минулому житті він був солдатом, покликаним захищати свій дім від навали ворожої армії. А зараз? Радіація перетворила його тіло на гульське, проте бойовий дух не згас.\n\nЄдина причина, з якої Зимонароджений і досі живе, — це захищати свою домівку від будь-якої наволочі, що посміє подумати, ніби зможе відібрати Беллінгем у його мешканців."

