l_english:
SBR_LUGNUT_DESC:0 "Хоча Смешери лише нещодавно здобули достатньо сили, щоб їх почали сприймати серйозно, вони вже давно беруть участь у Голосувальних Забігах. Чи робили вони це заради слави, прибутку чи просто задля розваги – кожен вирішує сам. Але з нещодавшим піднесенням Лагната Смешери змінили свій погляд на речі: тепер на першому місці – виживання. Вони були на передовій майже кожного бою в Електоратах і з власного досвіду знають, наскільки хиткою є їхня традиція та суспільство. І вони зітруть з лиця землі Небо й Землю, перш ніж дозволять нав'язати собі чужу волю."

ELB_SCRAPHEAP_NAME:0 "Отець Скрапгіп"
ELB_SCRAPHEAP_DESC:0 "Отець Скрапгіп, Третій Архіпресвітер парафії Елбо, Святий наглядач Церкви Саскачевану й Великий Світський Очищувач демона Гавриїла.\n\nОтець Скрапгіп давно ненавидів кривавий спорт, який вони називали виборами. Тож коли П'єр приголомшив Електорат, захопивши владу в Дандерні, Скрапгіп приголомшив Парафію – та вбив слугу Люцифера, відомого як «Отець» Гавриїл, просто під час проповіді. Після страти Скрапгіп оголосив про негайний вихід Елбо з Електорату. «Якщо ти мусиш питати, скільки це коштує – тобі це не по кишені».\n\nБлагословенний ти, о Елбо;\nХто подібен до тебе, народе, спасенний Господом,\nЩо є щитом допомоги твоєї\nІ мечем величі твоєї!\nІ вороги твої згорбляться перед тобою,\nА ти топтатимеш висоти їхні."

FRG_PATTYWACK_NAME:0 "Петтівак"
FRG_PATTYWACK_DESC:0 "«Зробімо Плезантдейл знову приємним, люди! Ось ідея: генетично змінена поліція. Як? Стара фабрика. Там повно дивного матеріалу, який ми можемо використати. Де? Як сказав Тобоган – у нас найвищий рівень дитячої смертності на милі навколо. Беріть хворих немовлят, запускайте їх у програму. Як, частина друга? Береш те немовля, мастиш тим слизом і тренуєш, щоб стало найкращим. Якщо вам здається, що це нелюдяно, подумайте так: вони ніколи не дізналися б, що все могло бути інакше – та й іншого шансу в них не було. Тож, зрештою, це просто благодійність. Як вам?» – Максвелл Чейз, мер Плезантдейлу\n\nБільшість Фейрі, створених у Плезантдейлі, мали обмежений інтелект і навички спілкування. Але Петтівак пощастило з учителем і характером – і тепер, з лісів на північ від Електоратів, вона прагне повернутись до Плезантдейлу та зупинити виробництво Фейрі раз і назавжди... І, можливо, врятувати своїх рідних від неминучого, дубового кінця."