l_english:
HRO_HOUSTON_GOVERNING_BODY_NAME: "Управління Г'юстона"
HRO_HOUSTON_GOVERNING_BODY_DESC: "Коли бомби зірвалися з небес, які ми колись вважали своїми, ми поспішили до бункерів. Залишивши креслення новітньої ядерної тяги просто на столах – для наступного покоління. Роки ми вдивлялися в бетонну стелю, малюючи крейдою на сірому шляхи до зірок. Минули десятиліття, перш ніж маршал подав сигнал «все чисто», і ми змогли повернутись додому – до старого життя, що тепер лежало під шаром пилу та іржі, надто зруйнованого, щоб його відновити. Саме в тому пилу ми залишили мрії про ще один маленький крок – заради будь-якої придатної для пиття води, що ще залишилась на Землі.\n\nПотрібно було відновити порядок, бо попіл не міг вічно правити суспільством; новою місією стало відновлення постійної людської присутності на планеті. Стали зводити стіни, запрацювали водоочисники, і цеглина за цеглиною роки занепаду почали виправлятись. Та є й ті, хто відірвані від минулого, хто дивиться на наші колишні місії з сяючими очима. Едвард Болдвін і його Рокетники не відведуть погляду від величі небес."

