l_english:
  #########################################
  # REGIONS
  PIPBOY_PLUS_REGION_TITLE_CASCADIA: "§YКаскадія§!"
  PIPBOY_PLUS_REGION_TEXT_CASCADIA: "\"Уперше за всю багату історію Дів Бажань, серед племен, культів та сховищ, не залишилося жодної надії. На обличчях селян не було посмішок. Лише гнітюча тиша.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_WEST_COAST: "§YЗахідне Узбережжя§!"
  PIPBOY_PLUS_REGION_TEXT_WEST_COAST: "\"Знайти це — не найважче. Важче — відпустити.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_THE_BIG_CIRCLE: "§YВеликий Круг§!"
  PIPBOY_PLUS_REGION_TEXT_THE_BIG_CIRCLE: "\"У цьому світі є два типи людей... ПРОБИВНІ та МАРНОТРАТНИКИ ПРОСТОРУ.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_HOLY_CRADLE: "§YСвята Колиска§!"
  PIPBOY_PLUS_REGION_TEXT_HOLY_CRADLE: "\"Я не люблю вбивати, але коли це робиться заради праведності, це просто рутина, як і будь-яка інша.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_THE_BULLS_DEMESNE: "§YВолодіння Бика§!"
  PIPBOY_PLUS_REGION_TEXT_THE_BULLS_DEMESNE: "\"Це було схоже на життя в потязі без гальм, коли знаєш, що колія не тягнеться вічно.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_THE_MUTSLA_GULF: "§YЗатока Мутантів§!"
  PIPBOY_PLUS_REGION_TEXT_THE_MUTSLA_GULF: "\"Пам'ятаєш, як ми вперше випили воду з озера?\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_THE_LAND_OF_TITANS: "§YЗемля Титанів§!"
  PIPBOY_PLUS_REGION_TEXT_THE_LAND_OF_TITANS: "\"Madre de Dios.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_NORTHERN_REACHES: "§YПівнічні Рубежі§!"
  PIPBOY_PLUS_REGION_TEXT_NORTHERN_REACHES: "\"Звільнити світ від богів і королів.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_MIDWEST: "§YСередній Захід§!"
  PIPBOY_PLUS_REGION_TEXT_MIDWEST: "\"Людина, мутант чи гуль, у кожному з нас є сила.\nПозбавтеся всіх хибних уявлень про індивідуальність, ви — лише сира глина, з якої може народитися Брат. Немає Я, є лише Ми. І ми — все, що має значення.\nВаш загін — це безліч розумів з однією метою. Ваша зброя — вселяти страх у наших ворогів. Ваш транспорт — грім, що наближається до славної долі. Є лише один спосіб пройти через це — бути разом. Якщо виживеш, ти станеш Сталлю.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_EAST_COAST: "§YСхідне Узбережжя§!"
  PIPBOY_PLUS_REGION_TEXT_EAST_COAST: "\"Я — Альфа і Омега, Перший і Останній, Початок і Кінець.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_ERIE_STRETCH: "§YПростори Ері§!"
  PIPBOY_PLUS_REGION_TEXT_ERIE_STRETCH: "\"Кому яке діло, хто я? Слабкі йдуть за сильними, або вони гинуть. Все просто.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_THE_PLAGUELANDS: "§YЧумні Землі§!"
  PIPBOY_PLUS_REGION_TEXT_THE_PLAGUELANDS: "\"Що я знаю? Це не гра, що б вони там не робили.\"\n\n"

  PIPBOY_PLUS_REGION_TITLE_THE_BADLANDS: "§YБезплідні Землі§!"
  PIPBOY_PLUS_REGION_TEXT_THE_BADLANDS: "\"Для деяких людей не було нічого, що заважало б їм стати рейдерами — стати монстрами — окрім захисту з боку суспільства. Прибрати його і зірвати з них маски? Тоді ти справді побачиш зло в чиємусь серці.\nКарма — ще та сука, чи не так?\"\n\n"