l_english:

 hea_land_of_the_chosen:0 "Земля Обраних"
 hea_land_of_the_chosen_desc:0 "У літо Господнє 2146-те, Бог привів наших предків на землю, що згодом стане містом Небесна Брама. Після років мандрів і втечі від невимовних жахів, вони знайшли те, чого потребували найбільше: дім."
 hea_finding_the_nucleus:0 "Відкриття Ядра"
 hea_finding_the_nucleus_desc:0 "Усе змінилося, коли вони знайшли Ядро. Побачене у видінні, дарованому Богом, воно мало привести їх до Його останнього благословення в цьому новому світі — Пари. Пара забезпечує. Пара захищає."
 hea_the_conclave:0 "Божественне керівництво"
 hea_the_conclave_desc:0 "Ми — діти Божі, і Він обрав нас бути Його вісниками. Є ті, хто може говорити з Ним, хто бачить Його видіння. Ці обрані поколіннями вели за собою Варту Небес, милостиво ділячись Його словами навіть із тими, хто цього не заслуговує. Ми віддаємо їм нашу беззаперечну вірність, бо інакше ми б пішли проти волі Божої."
 hea_war_in_heaven:0 "Війна на Небесах"
 hea_war_in_heaven_desc:0 "Були часи, коли жителі Варти Небес та Високої Каплиці були єдиним цілим і були об'єднані під владою Бога. Однак вони позаздрили дарам, які принесла Велика Пара, що стало єрессю найвищого ґатунку. Це спричинило Розкол, який змусив їх відступити на береги річки Снейк і назавжди затаврував їх як зрадників Бога та Його благословень. Відтоді в нашому раю панує неспокій."
 hea_conclave_warning:0 "Конклав"
 hea_conclave_warning_desc:0 "Конклав від самого початку був основою Варти Небес. Складаючись із 6 Архіміністрів, саме вони ведуть за собою маси й говорять з нами від імені Бога. Саме вони благословляють нас Парою і правлять нашою могутньою нацією."
 hea_nucleus_warning:0 "Управління Ядром"
 hea_nucleus_warning_desc:0 "Ядро — це центр усього. З Ядра походить Пара, а з Пари — Божественна воля Бога. Ним керує таємнича Гільдія Інженерів, яка дбає про те, щоб Пара продовжувала текти. На жаль, Ядро бачило кращі часи й працює лише на малу частку свого справжнього потенціалу."
 hea_nucleus_decision:0 "Роздоріжжя"
 hea_nucleus_decision_desc:0 "Хоча Бог благословив нас Ядром, час його потріпав. Інженери робили все можливе, щоб підтримувати його роботу, але з роками знання та ресурси для його відновлення вичерпалися."
 hea_innocence_lost:0 "Втрачена невинність"
 hea_innocence_lost_desc:0 "Незабаром після Розколу мирне містечко Втрачена невинність було атаковане і спалене дикунами-варварами з іншого берега річки Снейк. Конклав відмовився мститися за вбитих, і вперше, наскільки хтось міг згадати, їхні дії були поставлені під сумнів. Адже після попелища Втраченої невинності вперед вийшов Майкл."
 hea_innocence_decision:0 "Богодане покарання"
 hea_innocence_decision_desc:0 "Майкл, який нині називає себе Святим, прагне згуртувати людей Варти Небес проти старого порядку. Він стверджує, що різанина у Втраченій невинності була покаранням Божим для Послідовників за їхню бездіяльність, що Конклав більше не говорить із Богом, і що саме він обраний стати Його пророком. Він також вірить, що настав час для великого очищення — Парового Хрестового походу проти всієї пустки за її єресі."
 hea_conclave_old_ways:0 "Стара гвардія"
 hea_conclave_old_ways_desc:0 "Конклав перебував при владі так довго, що став самовдоволеним і ледачим. Навіть деякі Архіміністри визнають це, але Стара гвардія відмовляється щось змінювати. Вони вважають, що Пару треба ретельно охороняти; будь-які дії проти чужинців ставлять під загрозу потужність Ядра. Проте ця політика дозволила Святому Майклу зайти набагато далі, ніж йому слід було б."
 hea_nucleus_new_ways:0 "Новий шлях уперед"
 hea_nucleus_new_ways_desc:0 "Є ті, хто вірить, що майбутнє Варти Небес полягає у відновленні Ядра до його повної робочої потужності. Головним серед них є Архіінженер Ґідеон, який усе своє життя працював не лише над підтримкою, а й над покращенням Ядра. Ці зусилля ще не принесли результатів через відсутність підтримки з боку Конклаву, але останнім часом він почав привертати увагу однодумців."
 hea_innocence_michael:0 "Трагедія Єретика"
 hea_innocence_michael_desc:0 "Певним чином, Майкл вважає Єретиків трагедією самою по собі. Вони не винні, що Бог їх не обрав, але їхня відмова прийняти цю долю прирікає їх на смерть. Втрачена невинність довела, що треба щось робити, треба діяти, і що тіла Єретиків мають бути зварені в Парі, щоб їхні душі могли звільнитися."
 hea_decision_time:0 "Бо Він промовив"
 hea_decision_time_desc:0 "З огляду на нещодавні заворушення у Варті Небес, Учні Пари тепер опинилися на переломному етапі. Конклав прагне відновити свою владу, тоді як Святий Майкл та Ґідеон пропонують нові шляхи для Обраних. Майбутнє Пари та Обраних лежить у руках Божих."
 hea_backed_michael:0 "Обов'язок Святого Майкла"
 hea_backed_michael_desc:0 "Святий Майкл почав своє життя, як і багато інших у Варті Небес: він народився в сім'ї бідних фермерів, єдиною втіхою яких було спостереження за чудесами Пари. Він завжди відчував, що йому судилося велике майбутнє, і з самого дитинства мав великі амбіції. Спостерігаючи за тим, що він вважав падінням Царства Божого, йому стало ясно, що саме він має здійснити великі зміни. Адже якщо не він, то хто?"
 hea_stoke_memories:0 "Пам'ятати полеглих"
 hea_stoke_memories_desc:0 "Різанина наших людей слугує суворим нагадуванням про те, хто насправді ховається за нашими кордонами. Втрачена невинність — це потужний символ, який може стати каталізатором змін. Важливо дивитися в майбутнє, але й пам'ятати тих, кого ми втратили."
 hea_michael_prepare_plans:0 "Змова заради влади"
 hea_michael_prepare_plans_desc:0 "Хоча Святий Майкл став новим Пророком для багатьох у Варті Небес, справжня влада залишається в руках Конклаву. Щоб раз і назавжди покласти край цій боротьбі, необхідно ретельно підготуватися та мати план їх повалення. Один із перших кроків, який необхідно зробити, — це заручитися лояльністю народу."
 hea_michael_find_allies:0 "Знайти Обраних"
 hea_michael_find_allies_desc:0 "Святий Майкл є рупором Бога, але він сам не може втілити Його волю. Щоб довести його план до кінця, у цій справі мають бути союзники, які присвятять своє життя боротьбі з корупцією зсередини."
 hea_michael_fund_coup:0 "Необхідне зло"
 hea_michael_fund_coup_desc:0 "Іноді необхідно знаходити засоби для досягнення мети. Хоча Святий Майкл волів би, щоб за ним йшли божі люди, він бачить користь у пошуку багатих спонсорів із певними інтересами. Якщо це гарантує успіх, жодна ціна не є зависокою."
 hea_michael_volunteers:0 "Нестачі в добровольцях немає"
 hea_michael_volunteers_desc:0 "Коли вбивали сотні чоловіків, жінок і дітей, а нашу землю плюндрували, Конклав просто сидів і дивився. Тепер же не бракуватиме добровольців, не бракуватиме солдатів, щоб битися у великому Хрестовому поході."
 hea_michael_instigate_revolution:0 "Спровокувати Святе повстання"
 hea_michael_instigate_revolution_desc:0 "Щоб переконати народ у тому, що Конклав більше не здатний правити, його треба довести до люті. Люди повинні побачити помилки Конклаву й бути готовими дати відсіч."
 hea_michael_arm_the_masses:0 "Озброїти маси"
 hea_michael_arm_the_masses_desc:0 "Хоча Святого Майкла підтримує більшість ополченців Варти Небес, переважна більшість із них жалюгідно погано оснащена. Було б краще виправити це до того, як наш план почне діяти."
 hea_michael_lead_the_way:0 "Святий Пари"
 hea_michael_lead_the_way_desc:0 "Святого Майкла обрав Бог і благословила Пара. Обидва поняття взаємопов'язані та невіддільні одне від одного. Святий Майкл вірить у Пару. Святий Майкл живе через Бога."
 hea_michael_fire_and_brimstone:0 "Вогонь, Пара і Сірка"
 hea_michael_fire_and_brimstone_desc:0 "Пристрасть. Відданість. Смирення. Хоробрість. Жертовність. Лють. Праведність. Пекуча ненависть. Якщо ми хочемо подолати виклики, що лежать попереду, ми повинні бути готові втілити в собі всі ці речі. Є ті, хто ігнорує благословення, які дав нам Бог. Гірше того, вони їх відкидають. Настав час показати їм їхню помилковість."
 hea_michael_legitimacy:0 "Зміцнити легітимність"
 hea_michael_legitimacy_desc:0 "Святий Майкл став бойовим кличем для всіх тих, хто відчув біль від втрати братів і сестер у Бозі. Все ще залишалися ті, хто сумнівався, чи дійсно він є тим, за кого себе видає. Своїми діями він довів, що вони помилялися."
 hea_michael_travel_sermons:0 "Заклик до вірних"
 hea_michael_travel_sermons_desc:0 "«Щоб належним чином служити Богу і Парі, ви повинні віддатися Його справі. Ви повинні присвятити їй кожну клітинку свого єства. Ви продемонструєте свою чесноту, і за це будете вічно нагороджені на Небесах!»"
 hea_michael_true_voice:0 "Істинний голос Бога"
 hea_michael_true_voice_desc:0 "«Я не стверджую, що знаю все, я знаю лише те, що Бог вважає за потрібне передати мені. Я не просто говорю від імені Бога, я — Його рупор. Я буду вашим пастирем у ці темні й тривожні часи, щоб ми могли показати іншим хибність їхніх шляхів.»"
 hea_michael_sabotage_conclave:0 "Саботувати Конклав"
 hea_michael_sabotage_conclave_desc:0 "Найкращий спосіб знищити владу Конклаву — це діяти зсередини. Нацькувавши Архіміністрів один на одного, ми дозволимо їм воювати за нас. Все, що для цього потрібно — це кілька влучних брехливих заяв, і почнеться міжусобиця, але це коштуватиме нам певних політичних послуг."
 hea_michael_release_truth:0 "Оприлюднити правду"
 hea_michael_release_truth_desc:0 "Одного дня до Святого Майкла підійшов юнак і зробив дуже підступне одкровення. Він був підмайстром і працював у Ядрі, коли туди щомісяця приїжджали Архіміністри. Він несамовито пояснював, що підслухав їхню розмову, в якій вони казали, що Свята Пара стала «тягарем», і що ті, кому вистачає дурості вірити в її божественність, зрештою повстануть проти них. Це само по собі було єрессю найвищого ґатунку, адже Пара — це діяння Бога, Його єдина воля."
 hea_michael_sunday_coup:0 "Недільний переворот"
 hea_michael_sunday_coup_desc:0 "Занадто довго Конклав насолоджувався занепадом на своїй владній посаді, стаючи жирним і слабким. Вони втратили зв'язок з Богом. Ми повинні повернути Варті Небес її законне місце у світі, і єдиний спосіб зробити це — Кров і Пара. У найсвятіший з днів ми обрушимо нашу лють на Конклав, коли вони будуть найбільш вразливими."
 hea_backed_conclave:0 "Те, що було, те й буде"
 hea_backed_conclave_desc:0 "Слабкі не знають. Вони не знають, чого вартує робити те, що необхідно. Управляти й диктувати — нелегке завдання. Є ті, хто думає, що може впоратися краще, але вони лише приведуть нас до прокляття. Настав час позбутися цих вискочок, і перший серед них — єретик Майкл."
 hea_conclave_reform:0 "Рада Брами"
 hea_conclave_reform_desc:0 "Навіть якщо з Майклом розберуться, його ідеї вже поширилися серед багатьох. Необхідні певні реформи, зверху донизу, і найкращий спосіб зробити це — скликати збори всього духовенства Варти Небес. Необхідно досягти компромісу."
 hea_conclave_reminders:0 "Парові репресії"
 hea_conclave_reminders_desc:0 "Перш ніж переходити до самого Майкла, треба розібратися з його найближчими послідовниками. Хоча ми проповідуємо прощення, ті, хто йде проти нашої волі, не зможуть врятуватися. Схопіть їх і відправте на зустріч із їхнім творцем."
 hea_conclave_securing_position:0 "Забезпечити владну позицію"
 hea_conclave_securing_position_desc:0 "Наш авторитет був сильно підірваний Майклом. Щоб виправити це, ми повинні нагадати тим, хто сумнівається в наших рішеннях, що наша влада не має меж."
 hea_conclave_michael:0 "Справа Майкла"
 hea_conclave_michael_desc:0 "Тепер, коли він вразливий, настав час завдати удару по самому фальшивому Святому. Підірвавши його легітимність та послабивши його владу над людьми, ми не лише скинемо його, але й піднімемося самі."
 hea_conclave_disband_militias:0 "Розпустити місцеві ополчення"
 hea_conclave_disband_militias_desc:0 "Схоже, що Майкл не лише виголошував промови, він сформував власне ополчення для боротьби за свою справу. Цих «Синів Небес» треба розпустити до того, як вони зможуть виступити проти нас."
 hea_conclave_denounce_michael:0 "Викрити фальшивого Святого"
 hea_conclave_denounce_michael_desc:0 "Ми маємо показати народу, що Майкл не є Святим, адже поки вони будуть вірити в нього, він ставатиме лише сильнішим."
 hea_conclave_purge_allies:0 "Очі Спостерігача"
 hea_conclave_purge_allies_desc:0 "Ця криза довела, що ми були надто поблажливими в тому, щоб знати, хто серед наших вірних приховує гріховні ідеали. Ми повинні заснувати Святий Орден, присвячений тому, щоб виявляти тих, хто може діяти проти нас, і відрубувати їм голови до того, як вони встигнуть це зробити."
 hea_conclave_madman:0 "Елітні солдати Бога"
 hea_conclave_madman_desc:0 "«Сини Небес» були викорчувані, але ми все ще потребуємо озброєних людей. Замість того, щоб наділяти владою чернь і знову дозволяти їм зв'язуватися з демагогами, ми будемо розраховувати на менші, елітні сили, такі як Екземпляри, які слугуватимуть захисниками Царства Божого на Землі."
 hea_conclave_new_serfs:0 "Доброзичлива «Свобода»"
 hea_conclave_new_serfs_desc:0 "Люди Варти Небес завжди були вільними. Вони вільні служити Богу через нас. Проте очевидно, що нинішню систему потрібно змінити, щоб не допустити появи нових Майклів. Ми дамо їм більше свободи, але вони знатимуть, хто їм її надав."
 hea_conclave_rally_the_gate:0 "Згуртувати Дітей Бога і Пари"
 hea_conclave_rally_the_gate_desc:0 "Попри всі свої недоліки, Майкл був обдарованим оратором. Він зачепив щось таке, що явно додавало людям енергії та гуртувало їх навколо його справи. Ми маємо боротися з вогнем за допомогою вогню і перейняти його тактику, щоб отримати більшу підтримку."
 hea_conclave_execution:0 "Страта єретика"
 hea_conclave_execution_desc:0 "Нарешті Майклу покажуть істинне світло та милосердя Пари. Ми зберемо всіх, кого зможемо, щоб подивитися, як він звариться. Нехай це стане уроком для всіх інших, хто наважиться протистояти нам."
 hea_conclave_supreme:0 "Верховенство Великого Конклаву"
 hea_conclave_supreme_desc:0 "Хоча конфлікт з Майклом був важким, він змінив нас на краще. Конклав занадто довго робив надто мало і надто пізно, але так більше не буде. Ми піднялися сильнішими та могутнішими, ніж будь-коли. Відтепер і назавжди Великий Конклав правитиме неподільно!"
hea_backed_gideon:0 "Смиренний слуга"
 hea_backed_gideon_desc:0 "Ґідеон не обирав шлях лідера. Якби це залежало від нього, він би з радістю провів решту своїх днів, працюючи в Ядрі. Але Бог закликав його взяти на себе керівництво, і Ґідеон підкориться."
 hea_prioritize_nucleus:0 "Пріоритет Ядра"
 hea_prioritize_nucleus_desc:0 "Для Ґідеона Ядро є найважливішим об'єктом у всій Пустці. Конклав лише підтримував роботу цієї великої машини, але Ґідеон бажає, щоб вона знову засяяла у всій своїй славі. Вона має стати нашим найвищим пріоритетом."
 hea_nucleus_requisition:0 "Оголосити реквізицію"
 hea_nucleus_requisition_desc:0 "Щоб розпочати масштабний ремонт Ядра, матеріали мають бути доставлені з Небесної Брами до Пари. Враховуючи необхідну кількість, це буде непростим завданням."
 hea_nucleus_training:0 "Навчання інженерів"
 hea_nucleus_training_desc:0 "Інженери успішно передавали свої знання з покоління в покоління, але багато хто забув навички, необхідні для повного введення об'єкта в експлуатацію. Сподіваємося, що після обов'язкового ознайомлення із залишеними технічними документами це більше не буде проєктом проблеми."
 hea_nucleus_repair:0 "Усунення несправностей"
 hea_nucleus_repair_desc:0 "Перш ніж робити покращення, необхідно відремонтувати інфраструктуру всередині Ядра. Значна частина конструкції покрита іржею, а деякі машини перестали працювати належним чином. Призов робітників з інших міст і сіл допоможе виправити це."
 hea_nucleus_optimization:0 "Повномасштабна оптимізація"
 hea_nucleus_optimization_desc:0 "За ці роки багато систем усередині Ядра стали жахливо неоптимізованими. Знадобиться чимало часу, щоб повернути повну функціональність, але це крок у правильному напрямку."
 hea_nucleus_back_on_track:0 "Операційний статус"
 hea_nucleus_back_on_track_desc:0 "Після місяців наполегливої праці та незліченних виправлень Ядро перебуває в набагато кращому стані. Тепер, коли попередній ремонт завершено, настав час запустити наступний комплекс систем."
 hea_at_least_50_nucleus_tt:0 "Ядро має бути працездатним щонайменше на §O50%§!"
 hea_nucleus_propose_plan:0 "Потенціал безмежної енергії"
 hea_nucleus_propose_plan_desc:0 "Ядро — це справжня перлина Старого Світу. Ґідеон ретельно вивчив свідчення та документи, залишені довоєнними вченими, і те, на що здатний цей об'єкт, дійсно вражає. Якщо комплекс вдасться запустити на повну потужність — чому завадив Гнів Господній — він зможе забезпечити більше енергії, ніж будь-коли бачили раніше."
 hea_nucleus_lessons:0 "Дари Ядра"
 hea_nucleus_lessons_desc:0 "Ядро не просто забезпечує Пару. Воно покращує майже всі аспекти повсякденного життя. Від підвищення ефективності до забезпечення електроенергією — дарів Ядра безліч."
 hea_nucleus_integrate_engineers:0 "Інтегрувати Гільдію Інженерів"
 hea_nucleus_integrate_engineers_desc:0 "Гільдія Інженерів завжди була невидимим орденом. Більшість із них є нащадками перших працівників об'єкта, які залишилися після Війни заради захисту. Їх вважають «іншими» порівняно з жителями Варти Небес, але інтеграція їх у наше суспільство посилить нашу справу."
 hea_nucleus_giving_back:0 "Сила Пари"
 hea_nucleus_giving_back_desc:0 "Тепер, коли Ядро працює краще, ніж будь-коли, його необхідно використовувати для покращення наших центральних земель. Розбудовуючи наші виробничі потужності, ми зможемо забезпечити підтримку Ядра в майбутньому."
 hea_nucleus_archminister_lukas:0 "Пропозиція Архіміністра"
 hea_nucleus_archminister_lukas_desc:0 "Ґідеону надіслали дивне запрошення з проханням зустрітися з кимось у Небесній Брамі, щоб обговорити майбутнє нації. Хоча імені вказано не було, на ньому стояла печатка Архіміністра."
 hea_nucleus_seize_the_oppurtunity:0 "Нехай так і буде"
 hea_nucleus_seize_the_oppurtunity_desc:0 "Пропозиція Архіміністра водночас викликає цікавість і тривогу, але Ґідеон відчуває, що у нього мало інших варіантів. Він повинен бути готовий діяти в момент найвищого напруження."
 hea_nucleus_new_steam_age:0 "Світанок нової доби Пари"
 hea_nucleus_new_steam_age_desc:0 "За допомогою Лукаса безпеку та процвітання Варти Небес було забезпечено. Святого Майкла нейтралізовано, а Конклав поставлено на місце. Попереду ще будуть проблеми, але наразі Ґідеон стоїть на чолі нової золотої доби."
 hea_great_reunification:0 "Велике возз'єднання"
 hea_great_reunification_desc:0 "Ми занадто довго мирилися з тим, що наші власні брати і сестри покинули нас і Пару. Існування Високої Каплиці є єрессю найвищого ступеня і має припинитися. Настав час возз'єднати наші народи й покласти край цій трагічній помилці."
 hea_massacre_of_meadowopolis:0 "Різанина в Медоуполісі"
 hea_massacre_of_meadowopolis_desc:0 "§RНарод же став ремствувати, промовляючи лихе в ушах Господніх; і коли Господь почув це, спалахнув Його гнів; і загорівся між ними вогонь Господній, і пожер край табору.§!\n— Числа 11:1\n\nВисока Каплиця незабаром стане свідком справедливості котлів і назавжди забуде, що взагалі колись загравала з цією мерзенною єрессю."
 hea_mending_the_schism:0 "Подолання Розколу"
 hea_mending_the_schism_desc:0 "§gЩоб не було розділення в тілі, а щоб члени однаково дбали один про одного.§!\n— 1 До Коринтян 12:25\n\nЗ розгромом Високої Каплиці ми змусимо їх зрозуміти, що їхні безглузді вірування ніколи не були варті віри. Свята Пара клубочитиметься з їхніх каплиць повік-віки."
 hea_forgive_not_forget:0 "Пробачити, але не забути"
 hea_forgive_not_forget_desc:0 "§gА Я кажу вам: Любіть своїх ворогів і моліться за тих, хто переслідує вас.§!\n— Від Матвія 5:44\n\nНам не потрібно роками ставитися до людей із Високої Каплиці як до ворогів. Війна закінчилася, тож визнаймо унікальність їхньої віри та об'єднаймо її з нашою."
 hea_attack_anointed:0 "Єретичні фанатики"
 hea_attack_anointed_desc:0 "Вони називають себе християнами, але ці люди не поклоняються Господу так, як ми. Якщо мы дамо їм спокій, вони прийдуть по нас в ім'я своїх абсурдних вірувань."
 hea_attack_murtaugh:0 "Друг мого ворога"
 hea_attack_murtaugh_desc:0 "Реформатори Мерто водилися з єретиками з Високої Каплиці. Ми не можемо дозволити такій образі залишитися без відповіді."
 hea_rule_idaho:0 "Esto Perpetua"
 hea_rule_idaho_desc:0 "Ця земля, що колись звалася Айдахо, відтепер і навіки буде землею Бога та Пари."
 HEA_master_of_idaho_tt:0 "§gЗнижує вартість націоналізації для кожного регіону в §YАйдахо§! на §G33%§!!§!"
 hea_attack_yellowstone:0 "Повернення Пари від фальшивого бога"
 hea_attack_yellowstone_desc:0 "З наших місій ми дізналися, що в цьому світі є ще одне святе місце, подібне до Ядра. Місцеві жителі спаплюжили його, пов'язавши з якимось язичницьким богом минулих днів, виконуючи безглузді ритуали та звичаї. Ми не можемо дозволити цим людям оскверняти Святу Пару."
 hea_core_yellowstone:0 "Вигнання Гефеста Парою"
 hea_core_yellowstone_desc:0 "Тепер святе місце в наших руках. Треба виконати багато роботи, щоб зробити його гідним Бога. Ми викорінимо будь-яку згадку про його блюзнірське минуле в надії, що майбутні покоління пам'ятатимуть це місце лише як друге джерело віри на цій землі."
 hea_la_garita:0 "Пара так далеко, але так близько"
 hea_la_garita_desc:0 "Ми чули чутки про джерела Пари далеко за нашими кордонами — вулканічну кальдеру, що породжує киплячу пару. Інші думали використовувати її для отримання енергії, але ми плекатимемо її так, як вони ніколи б не змогли. Якщо ми захопимо її, освятімо кальдеру Ла-Гаріта як святе місце!"
 hea_michael_crusade:0 "Заклик до Хрестового походу"
 hea_michael_crusade_desc:0 "Ми убезпечили наші найближчі околиці, але Святий Майкл не задовольниться такими скромними досягненнями. Настав час, щоб Пара клубочилася від гір Айдахо по всій землі!"
 hea_attack_utah:0 "Останні зі Святих Останніх Днів"
 hea_attack_utah_desc:0 "Землі на південь від нас сформувалися під впливом ще однієї єресі, відомої як «мормонізм». Ми повинні навчити їх зрікатися лжепророків, таких як Джозеф Сміт!"
 hea_core_new_jerusalem:0 "Пара з нової Храмової гори"
 hea_core_new_jerusalem_desc:0 "Мормони були настільки гордовитими, що уявили, ніби воскресили Єрусалим у цьому зруйнованому світі. Безглуздя. Але тепер це місто перебуває в руках більш святого володаря."
 hea_convert_wht:0 "Нові фанатики Пари"
 hea_convert_wht_desc:0 "Білоногі прагнуть сили. Сили від себе, сили від інших. Зазнавши поразки, одні можуть обурюватися на своїх завойовників, але інші дивляться на переможців як на лідерів.\nПара повалила їх, і Святий Майкл довів могутню праведність своєї справи. Деякі Білоногі загравали з вірою ханаанітів, але Паровий Хрестовий похід обіцяє їм можливість кочувати та вбивати, як вони це робили колись, доки вони присягають на вірність новому Господу."
 hea_utah_tribes:0 "Вразливі молоді душі"
 hea_utah_tribes_desc:0 "Племена Юти вже перебували в процесі навернення Ханааном до їхньої хибної версії християнської віри. Ми спрямуємо їх у бік Пари, допоможемо їм зрозуміти, що немає ні Батька в печерах, ні жодних Золотих скрижалей."
 hea_utah_capstone:0 "Зречення єресі"
 hea_utah_capstone_desc:0 "Нам вдалося переконати Джеремаю Рігдона, пророка ханаанітів, що він сповідує хибну віру і повинен чітко пояснить своєму народові, що їх увели в оману. Він постане перед ними в оточенні Синів Небес і розповість їм правду."
 hea_attack_montana:0 "Чи чудовиська з Монтани?"
 hea_attack_montana_desc:0 "Майкл виявив інтригуючий і водночас жахливий слід: розслідувачі повідомляють, що винуватці нападу на «Втрачену невинність» прийшли з гір на сході від нас, з території, яку колись називали «Монтана». Ми не знаємо достеменно, хто це був: привиди Америки? Ті, хто поклоняється Сталі замість Пари? Можливо, найкраще буде вбити їх усіх, а Бог уже сам розбереться!"
 hea_montana_claim_tt:0 "Ми §Mотримаємо претензії§! на всю §GМонтану§!!"
 hea_mca_pa:0 "Очищення привидів від оболонок"
 hea_mca_pa_desc:0 "Грішні душі Старої Америки чіплялися за життя після Гніву Господнього, одягнені у свою диявольську броню. Ми зневажаємо їхні пихаті задуми, проте Екземпляри можуть багато чому в них навчитися."
 hea_mnc_tech:0 "Перевага Пари над Сталлю"
 hea_mnc_tech_desc:0 "Незрозуміло, чи ці культисти Сталі поклоняються людині, чи просто воюють за стародавній ідеал. Важливо те, що вони більше не робитимуть ні того, ні іншого, і ми використаємо їхнє спорядження, щоб шанувати Бога, а не давно померлого солдата."
 hea_cleanse_stm:0 "Пара, а не шторм!"
 hea_cleanse_stm_desc:0 "Ці дикуни мали наглість називати себе християнами, поклоняючись фальшивому ГОСПОДУ і постійно торочачи про вітри та шторми. Ми навчиємо їх, що в цьому світі є лише одна свята природна сила."
 hea_montana_capstone:0 "Перевертаючи кожен камінь"
 hea_montana_capstone_desc:0 "Ми убезпечили цю землю, але нам ще належить знайти явні докази вини за «Втрачену невинність». Ми ПОВИННІ знайти їх, ми ПОВИННІ вершити правосуддя заради мертвих!"
 hea_holy_league:0 "Створення Священної Ліги"
 hea_holy_league_desc:0 "Ми не маємо бажання йти у всезагальні завойовницькі хрестові походи по всій Пустці, але ми можемо знайти друзів і союзників за нашими кордонами. Ті, хто вірить так само як і ми, або ті, хто може бути поступливим, знайдуть притулок у Парі."
 hea_gideon_embassies:0 "Ісус об'єднує нас усіх"
 hea_gideon_embassies_desc:0 "Хоча дехто вважає, що інші мають поклонятися Парі так само, як ми, не слід забувати, що Учні Пари народилися, поклоняючись виключно Богу та Христу. У нас були розбіжності з іншими вірами в Айдахо, але чи не можемо ми, попри наші поточні турботи, щиро звернутися до наших братів у Христі?"
 HEA_gideon_embassies_tt:0 "§g§MҐідеон§! чув про християнські громади в далеких краях і прагнутиме встановити з ними зв'язки, навіть якщо інші вважають це нездійсненним.§!"
 hea_dln_embassy:0 "Екземпляри Північного Сходу"
 hea_dln_embassy_desc:0 "Ми чули від мандрівників про королівство, що лежить за багато ліг звідси. Земля, де броньовані лицарі, подібні до наших, б'ються в ім'я Христа. Було б так цікаво знайти їх і встановити з ними контакт. Можливо, це те саме Царство Пресвітера Йоана, про яке згадується в давніх текстах?"
 hea_dln_dead_tt:0 "§gМи дізналися, що лицарі Манітоби були остаточно розгромлені та розбиті. Але це не кінець їхньої легенди: коли наші Екземпляри намагалися зв'язатися з ними, вони знайшли залишки їхніх легендарних орденів. Ці люди попрямували сюди, оскільки не знайшли безпечнішого дому на канадарійських преріях.§!"
 hea_loi_embassy:0 "Червоне духівництво"
 hea_loi_embassy_desc:0 "Кажуть, на холодній півночі Канадарії є земля, де християни сповідують віру, мало схожу на інші в Пустці. Они змішують своє богослов'я зі словом, яке в давніх текстах нашіптували як сатанинську справу — §RКомунізм.§! Але шляхи Давньої Америки не є нашими. Ми прийняли Пару, так само як вони поєднали цю ідеологію Старого Світу з Христом. Ми знаходимо віру у свій власний спосіб, і цей світ достатньо великий для нас обох.\nІ колись давно туди забрели якісь місіонери. Цікаво, що з ними сталося?"
 hea_loi_dead_tt:0 "§gЧервоне духівництво втратило владу. Коли наші місіонери розшукали їх, деякі попросили забрати їх назад на південь, не знайшовши притулку на півночі. Серед них є інженери, яким було доручено розробляти нові технології броні для свого полеглого повелителя.\n\nВони приходять зі своїми §Rсоціалістичними ідеалами§!, які дехто вважає тривожними, але Ґідеон вважає за краще залучити цих інженерів, а не переслідувати їх.§!"
 hea_loi_ally:0 "Християнська громада"
 hea_loi_ally_desc:0 "Досі наші канадарійські друзі були занадто далеко, щоб офіційно з ними співпрацювати. Але тепер нам вдалося встановити зв'язок, і розпочалося обговорення офіційного пакту. Якими б не були наші розбіжності, ми можемо мирно співпрацювати, щоб краще служити Богу."
 hea_conclave_embassies:0 "Віра в чужинців"
 hea_conclave_embassies_desc:0 "Історично Конклав уникав втручання у справи Пустки, але часи змінюються. Місіонери вже виходили за наші кордони раніше і знаходили родючий ґрунт для навернення. Звичайно, навернення не обов'язково має відбуватися без стимулу, а вмотивований новонавернений часто є продуктивним робітником."
 HEA_conclave_embassies_tt:0 "§g§PКонклав§! більш охоче шукає можливості як серед віруючих, так і серед менш релігійних людей.§!"
 hea_ncn_embassy:0 "Шлях до ханаанітів"
 hea_ncn_embassy_desc:0 "Кажуть, що сама Мормонська церква має суперечливу історію відносин з іншими християнами. Ми не поділяємо їхню своєрідну віру, але у нас немає бажання починати ще одну священну війну. Можливо, наші два варіанти віри зможуть знайти спільну мову в мирі?"
 hea_ncn_dead_tt:0 "§gКрах Нового Ханаану призвів до того, що багато біженців і колишніх воїнів розсіялися. Деякі з них, шукаючи землю віри, за яку варто боротися, попрямували сюди, щоб знову служити Богу, навіть якщо вони не знайомі з Парою.§!"
 hea_wyr_embassy:0 "Цивілізована маленька церква"
 hea_wyr_embassy_desc:0 "Церква Святого Матвія є важливою інституцією в Бейлітауні. Вони можуть не бути повністю християнською державою, але з ними можна встановити зв'язок і, безумовно, знайти здорові торговельні відносини."
 hea_wyr_dead_tt:0 "§g[WYR.GetNameWithFlag] зазнав жорстоких нападів варварів. §YОтець Аксель§! з Церкви Святого Матвія знайшов дорогу до нас як біженець і отримає притулок як шанований §Yкультурний радник§!, принісши із собою все, що він та його вірні могли пожертвувати нашій справі.§!"
 hea_stm_allies:0 "Шторм ГОСПОДНІЙ"
 hea_stm_allies_desc:0 "Ми чули розповіді про жорстоку банду за горами, яка вбиває в ім'я ГОСПОДА. Декого така перспектива налякала б, але ми розуміємо, що вони могли б стати корисними союзниками, якщо побачать у нас благодійників. Нам би не завадили люди, готові вбивати в ім'я Бога..."
 hea_stm_dead_tt:0 "§gШтормоносці пали, але коли ми звернулися до них, кілька їхніх полеглих одноплемінників запропонували приєднатися до нас за умови, що мы надамо їм притулок і дозволимо проводити їхні моторошні ритуали. Дехто вважає їхній прихід тривожним, але Конклав потребує відданих убивць, які не вагатимуться.§!"
 hea_soph_air:0 "Крізь Пару і Шторм ми злітаємо"
 hea_soph_air_desc:0 "Ми дізналися від Штормоносців, як краще використовувати авіацію, і тепер, коли ці передові об'єкти опинилися в дружніх руках, ми потягнемося до небес як ніколи раніше."
 hea_hammond_embassy:0 "Богоугодний скляний завод"
 hea_hammond_embassy_desc:0 "Хоча Нью-Геммонд не зовсім нашої віри, їхній лідер — релігійна людина, яка проповідує євангеліє, що... резонує з членами Конклаву. Мы віримо, що він може бути поступливим до певного синкретизму, а головне — до продуктивних відносин з іншою богоугодною державою."
 hea_hammond_dead_tt:0 "§gСпустошення Нью-Геммонда ворожими силами стало трагедією, але §YАйзек із Люсіна§! вижив. Мы запросимо його сюди, щоб він міг служити священнослужителем та §Yекономічним радником§!, маючи §Rзаконне право на свій колишній дім§!.§!"
 hea_address_bdt:0 "Серафимські паломники"
 hea_address_bdt_desc:0 "Кілька років тому «Владики Серафимів» переправилися через річку на захід від нас і проповідували здеградованим народам Танцюристів на кістках. Тепер ми знаємо про їхню долю..."
 hea_bdt_war_tt:0 "§R...і війна — єдина відповідь.§!"
 hea_address_rot:0 "Очищувачі Пари"
 hea_address_rot_desc:0 "У нас мало спільного з цими «Гнилоочисниками» на півночі, але якщо вони приймуть Святу Пару, ми не повинні їм відмовляти. Навіть якщо мотиви цієї Якобії викликають підозру, поширення нашої віри серед її народу є продуктивним у довгостроковій перспективі."
 hea_address_toc:0 "Врегулювання старої образи"
 hea_address_toc_desc:0 "Роки тому наші мирні місіонери намагалися поширити віру на північ. Вони зазнали переслідувань з боку мерзенної групи язичників, відомих як «Вартові». Ці мерзенні злочинці не захищають нічого, окрім власних інтересів, і Екземпляри помстяться за наших полеглих."
 HEA_still_kill_grozdan_tt:0 "§gМи чули повідомлення, що Вартові покинули цей район, §Rале ми все одно повинні переконатися, що вони там не ховаються.§!§!"

  #Military Branch
hea_military_branch_init:0 "Військове пробудження"
 hea_military_branch_init_desc:0 "Занадто довго ми ізолювали себе від зовнішнього світу. Незалежно від нашого керівництва, всі згодні, що знищення «Втраченої невинності» доводить необхідність нарощування військової могутності. \n\n§g"А хто не має, хай продасть одіж свою та й купить меча."§!\n-Від Луки 22:36"
 hea_nf_air:0 "Гонка до Небес"
 hea_nf_air_desc:0 "«Гонка до Небес» — це дещо оманлива назва культурного феномену, започаткованого тридцять років тому літнім проповідником на ім'я Даррен Шоу, який зі свого смертного одра закликав молоді уми Небесної Варти тягнутися до небес. Хоча це, безсумнівно, було філософським твердженням, багато молодих інженерів сприйняли це як виклик і запрошення до відновлення літальних апаратів минулого."
 hea_nf_air_knight:0 "Благословення Ангелів"
 hea_nf_air_knight_desc:0 "Кажуть, що ті, хто літає, і ті, хто літав, роблять це лише тому, що ангели, а отже, і сам Бог, дозволяють їм це. Якщо це правда, то можна сказати, що всі серед нас, хто підіймається в небо, роблять це з благословення цих ангелів і благословення улюбленого Бога. Нехай ті, хто наважиться злетіти, роблять це з упевненістю, яку може надихнути така віра."
 hea_nf_air_peasant:0 "Крила Ангелів"
 hea_nf_air_peasant_desc:0 "Кажуть, що ті, хто літає, ширяють у небесах, але не всі, хто ширяє, роблять це на літаках. Щоб по-справжньому злетіти, треба прийняти цей досвід, бути вільним розумом і душею, духом і тілом. З цією метою ті, хто літає і бажає ширяти, повинні знати, що крила, які їх несуть, зроблені не з металу чи волокна, і не живляться від палива чи реактора. Крила ангелів несуть тих, хто здіймається у височінь, і ті, хто це знає, не знатимуть страху."
 hea_nf_sea:0 "Боротьба за Снейк-Рівер"
 hea_nf_sea_desc:0 "Розкольники у Високій Каплиці можуть вважати себе законними власниками Снейк-Рівер, але вона належить Святому Пару так само, як і вони самі."
 hea_steamboat_transports:0 "Мандрівки на пароплавах"
 hea_steamboat_transports_desc:0 "Наші судна слугуватимуть як для транспортування військ, так і для необхідних комерційних перевезень. Висока Каплиця з гріховною заздрістю дивитиметься на наші човни з паровими ядрами."
 hea_high_church_sailors:0 "Спокута моряків"
 hea_high_church_sailors_desc:0 "Тепер, коли гріховний режим Високої Каплиці стертий з лиця землі, їхні човнярі можуть ходити під вітрилом в ім'я істинної віри, заради Бога і Пару."
 hea_military_branch_pa:0 "В Екземплярській броні"
 hea_military_branch_pa_desc:0 "Екземпляри — це Святий Орден лицарів у броні, які служать Господу та Пару. Вони вірно служили нам багато років, і ми зобов'язані інвестувати в їхній успіх."
 hea_expand_priory:0 "Розширення Пріорату"
 hea_expand_priory_desc:0 "Пріорат Екземплярів є центром їхньої діяльності, зокрема станцій ремонту та модернізації броні. Ще трохи інвестицій, і ми отримаємо більше благословенної броні для Ордену Екземплярів."
 hea_more_priories:0 "Будівництво капітулів"
 hea_more_priories_desc:0 "Екземпляри переважно зосереджені в місті Небесна Брама. Щоб розширити їхню роль, ми побудуємо по всій країні обителі, які прийматимуть як мандрівних Екземплярів, так і місцевих членів ордену."
 hea_exemplar_doctrine:0 "Вести за собою власним прикладом"
 hea_exemplar_doctrine_desc:0 "Як наші елітні сили, Екземпляри повинні розглядатися як Чемпіони Бога і Людини. Прості солдати будуть надихатися їхнім святим прикладом."
 hea_expand_proving:0 "Розширення Випробувань"
 hea_expand_proving_desc:0 "Випробування Екземплярів проводяться для пошуку кандидатів на посвячення в Орден Екземплярів, подібно до військових ігор в інших країнах. Заохочуючи їх проведення, ми дізнаємося більше і знайдемо більше людей."
 hea_cloud_walkers_program:0 "Відновити програму «Хмароходи»"
 hea_cloud_walkers_program_desc:0 "Гільдія Інженерів виявила в незліченних базах даних Ядра, що Уряд Старого Світу мав намір модифікувати Силову броню для використання парових ядер, які вони тут розробляли. Тепер ми можемо втілити їхню роботу в наших власних костюмах."
 hea_peak_pa:0 "Хмарною ходою до небес"
 hea_peak_pa_desc:0 "Звісно, вони намагалися використати не лише парові ядра; у файлах також був знайдений проєкт нового костюма, спеціально призначеного для програми «Хмароходи». Серія броні «Хмарохід» залишала б за собою клуби пари, звідси й назва. Хоча всі створені прототипи, здається, втрачені, ми незабаром відтворимо їхню роботу."
 hea_at_least_75_nucleus_tt:0 "Ядро має бути працездатним щонайменше на §G75%§!"
 hea_100_nucleus_tt:0 "Ядро має бути §Gповністю працездатним§!"
 hea_crusader_units:0 "Піднесені тренувальні шати"
 hea_crusader_units_desc:0 "Одна справа, коли Екземпляри просто тренуються, і зовсім інша — коли вони тренуються в цих експериментальних нових типах броні. Маючи можливість випробувати їх у справі, вони досягнуть кращого розуміння, ніж будь-коли раніше."
 hea_military_branch_vehicles:0 "Паровий двигун Пустки"
 hea_military_branch_vehicles_desc:0 "Техніка зберігає багато переваг навіть у цьому зруйнованому світі. Але в Ядрі були виявлені плани використання парових ядер, які нададуть їм унікальну перевагу. Можливо, нам варто надати пріоритет цьому напрямку досліджень?  "
 hea_establish_garage:0 "Парові гаражні майстерні"
 hea_establish_garage_desc:0 "Ширше використання техніки вимагатиме потужностей, яких ми зараз не маємо. Нам доведеться інвестувати у створення основної гаражної майстерні, а також у виробничий процес. Пар створить їх, і Пар буде їх живити."
 hea_terrain_adaptation:0 "На Небесних Вершинах"
 hea_terrain_adaptation_desc:0 "Чому Бог вирішив привести нас у ці високі гори та скелясті каньйони, ми не знаємо. Але ми тут, і ми повинні адаптувати нашу техніку до обраної Богом місцевості для нас."
 hea_vehicle_doctrine:0 "Пізнати їхню будову"
 hea_vehicle_doctrine_desc:0 "Якщо ці сталеві колісниці мають привести нас до перемоги, ми повинні знати їх так, як Бог знає все. Знати їхні тонкощі, як водіям найкраще їх використовувати — все під Небесами, що їх стосується."
 hea_source_vehicles:0 "Пошук тестової техніки"
 hea_source_vehicles_desc:0 "Ми не зможемо багато чому навчитися без справжнього парку техніки. Навіть якщо це найнікчемніші уламки в Пустці, треба починати з малого і розбудовуватися так, щоб відображати Божу славу. Зрештою, смирення — це чеснота."
 hea_steam_engine:0 "На всіх парах по шосе до Небес"
 hea_steam_engine_desc:0 "Святий Пар тепер благословляє наші двигуни. Наші машини випускають шлейф пари, коли мчать назустріч ворогам, а зблизившись, нові гармати доведуть свою жахливу міць."
 hea_peak_vehicles:0 "Парові дредноути"
 hea_peak_vehicles_desc:0 "Разом з дослідженнями щодо адаптації парових ядер для техніки був також план виробництва нових моделей танків у тому ж дусі. Плани цієї могутньої зброї тепер знову відкриті, і незабаром ми наблизимо наше виробництво техніки до Бога."
 hea_carroccio_vehicles:0 "Парове карроччо"
 hea_carroccio_vehicles_desc:0 "В анналах історії благочестиві воїни несли в бій свої знамена і великий символ хреста, встановлений на візку. Хоча ми могли б спробувати зробити те саме, чи не було б величніше мати спеціалізовані машини, які нестимуть Божу славу на поле бою, щоб останнім, що побачать наші вороги, був наш символ віри?"
 hea_military_women:0 "Сестри Битви"
 hea_military_women_desc:0 "Деякі чужинці можуть бути настільки дурними, щоб вважати нас застарілим суспільством, але ми поважаємо наших вірянок, які готові боротися за Бога і Пар. Ми вшановуємо їх власним Святим Орденом."
 hea_add_womanpower_tt:0 "Жіночі ресурси: §G+1000§!"
 hea_military_women_guns:0 "Материнський обов'язок"
 hea_military_women_guns_desc:0 "Ні, не домогосподарки; Матері Дівоцтва — це ті, хто або пішов з активної служби, або має значний досвід. Деякі з них служать шанованими лідерками, але їх часто залучають у їхніх Обителях для допомоги Дівам в екіпіруванні, де вони служать їм так, як мати служить своїм дочкам."
 hea_military_women_specialists:0 "Пекло не знає такої люті"
 hea_military_women_specialists_desc:0 "Моліться, щоб ніколи не побачити Парову Діву, яка йде на вас із вогнеметом або мініганом, бо вони орудують ними зі страшною люттю. Ваша душа в жаху розповідатиме про це, куди б вона не відправилася."
 #Гілка кріпацтва
 hea_serfdom_branch_init:0 "Кріпаки Пару"
 hea_serfdom_branch_init_desc:0 "Наша система кріпацтва ніколи не була особливо радісною. Агітація Святого Михаїла призвела до того, що простолюдини стали набагато менш задоволеними, і тому всі опинилися перед проблемою, яку потрібно вирішити."
 hea_michael_serfdom_branch:0 "Всі рівні перед Богом і Паром"
 hea_michael_serfdom_branch_desc:0 "Коли Архіміністра варять у Пару, чи підносить його Бог? Ні, якщо його душа сповнена гріха, він помирає, як і будь-яка інша людина. Настав час, щоб життя відобразило цю реальність у Небесній Варті, і щоб усі зрозуміли, що вони — паства Святого Михаїла."
 hea_appeal_serfs:0 "Боріться за власні права"
 hea_appeal_serfs_desc:0 "Звичайно, Михаїл буде битися пліч-о-пліч з ними, але нам потрібно, щоб вірні Богу повстали і самі кинули виклик несправедливості! Гуртyйтеся навколо Святого, очистіть корупціонерів!"
 hea_seize_landowners:0 "Позбавлення майна жадібних"
 hea_seize_landowners_desc:0 "Землі в Небесній Варті зазвичай належали союзникам Конклаву. Тепер, коли вони більше не ведуть нас до загибелі, Святий Михаїл подбає про те, щоб ці грішники були зломлені і вигнані, а земля була надана благочестивим людям будь-якого походження."
 hea_education_drive:0 "Навчання селян"
 hea_education_drive_desc:0 "Звісно, ми не зайдемо далеко, заохочуючи групу людей, які здебільшого не вміють читати. Власне, Михаїлу соромно зізнатися, що він сам лише нещодавно почав це опановувати. Нам потрібно буде зробити все можливе, щоб досягти базового розуміння для наших кріпаків."
 hea_lay_clergy:0 "Світське духовенство"
 hea_lay_clergy_desc:0 "Конклав завжди здійснював контроль над священством, гарантуючи, що конгрегації будуть підпорядковані їхнім інтересам. Святий Михаїл подбає про те, щоб сан прийняли по-справжньому благочестиві люди, обрані з їхніх власних парафій. Більше вони не будуть годувати вірян брехнею, а натомість проповідуватимуть досконалу Божу істину."
 hea_military_education:0 "Від кріпаків до солдатів"
 hea_military_education_desc:0 "Подібно до Синів Небес, Святий Михаїл бажає бачити, як ті, хто сповнений праведного гніву, беруть до рук зброю в ім'я Христа. Тепер вони вільні це зробити і готові служити своєму Святому."
 hea_middle_class:0 "Народження нового громадянства"
 hea_middle_class_desc:0 "Наші кріпаки вперше за довгий час відчувають соціальну мобільність. Вони шукають нові професії, здобувають освіту і знаходять мету в житті за власним бажанням. І все це для того, щоб краще служити Богу і Пару, а не елітам у рясах."
 hea_conclave_serfdom_branch:0 "Полагодити те, що зламано"
 hea_conclave_serfdom_branch_desc:0 "Конклав не має бажання повністю покінчити з кріпацтвом. Система має своє призначення, і вона добре служила багато років. Вони мають намір лише розвивати реформи, які вони провели для протидії впливу Михаїла, і встановити справді божественний спосіб життя для людей."
 hea_cooperate_elite:0 "Співпраця з лордиками"
 hea_cooperate_elite_desc:0 "У нас немає формальної системи феодалізму, але є землевласники та інші впливові особи, які фактично контролюють частини нашого суспільства, як старі феодали, включно з тими, хто пов'язаний з нашим духовенством. Ми повинні працювати разом з цими людьми, щоб закріпити наші спільні позиції."
 hea_serf_informants:0 "Здирання струпів"
 hea_serf_informants_desc:0 "У групі друзів завжди можна знайти когось, хто готовий здати своїх товаришів. Ми можемо вибрати одного або двох кріпаків у кожній потрібній нам місцевості, які будуть розповідати нам різні речі, а натомість вони отримають можливість приватно насолоджуватися деякими задоволеннями, в яких інакше їм було б відмовлено."
 hea_varied_work:0 "Різноманітність у нашій праці"
 hea_varied_work_desc:0 "Загальновідомо, що робити одне й те саме постійно може бути досить нудно. Тому, щоб додати трохи пікантності в життя селян, ми будемо змінювати їхні завдання за необхідності. Трохи будівельних робіт тут, потім назад у поля, і, можливо, все, що ми ще придумаємо. Ми отримаємо від них більше користі, і вони будуть вдячні нам за нашу щедрість."
 hea_amenities:0 "Корисність у зручностях"
 hea_amenities_desc:0 "Будувати щось, щоб кріпаки думали, що є прогрес, — ось що важливо. Статуя Ісуса нічого їм не дає, але вона гарна і змушує їх відчувати, що щось робиться."
 hea_manipulative_preachers:0 "Привабливі проповідники"
 hea_manipulative_preachers_desc:0 "Більшість, якщо не все духовенство, лояльні до Конклаву, і деякі з них мають особливо підвішені язики. Інший спосіб вплинути на суспільне сприйняття — це зробити так, щоб наші найпалкіші проповідники йшли в народ і допомагали селянам зрозуміти, як найкраще служити Богу."
 hea_extend_serfdom:0 "Нагорода за благочестя"
 hea_extend_serfdom_desc:0 "Коли ми нарешті вийдемо за межі наших кордонів, ми опинимося на землях, які не розуміють нашої віри чи способу життя. Ми маємо переконати їх, що віра в Бога винагородить їх, у цьому житті та в наступному. Ті, хто виділиться зі своїх громад, щоб прийняти віру, можуть отримати віру і служіння від своїх підлеглих."
 hea_gideon_serfdom_branch:0 "Поступове звільнення"
 hea_gideon_serfdom_branch_desc:0 "Гідеон співчуває долі кріпаків, оскільки сам колись був одним із них, але він розуміє, скільки хаосу посіють раптові й негайні зміни. Він прислухався до мудрості вчених мужів і обрав шлях поступової трансформації ролі селян. Так буде краще для всіх."
 hea_anti_abuse:0 "Закони проти зловживань"
 hea_anti_abuse_desc:0 "Не існувало жодного формального механізму для того, щоб можновладці могли зловживати кріпаками, але фактично це відбувалося багатьма способами. Кодифікація заходів проти таких зловживань спочатку викличе скарги, але в довгостроковій перспективі це матиме велике значення для встановлення доброзичливості та гармонії."
 hea_freeholder_support:0 "Підтримка вільних землевласників"
 hea_freeholder_support_desc:0 "Звільнені кріпаки природно потребують місця для життя і роботи. Дехто може обрати професію, інші можуть залишитися працювати на тих самих полях, що й раніше. Але, мабуть, найпродуктивнішим шляхом для них буде самим стати вільними фермерами, використовуючи свої навички для розбудови власних громад та засобів до існування."
 hea_gideon_is_serf:0 "Я колись був таким, як ви"
 hea_gideon_is_serf_desc:0 "Це не дуже відома історія, але Гідеон народився кріпаком, одним із небагатьох, кого прийняли до Гільдії Інженерів на знак визнання його інтелекту. Він не хоче вихвалятися, але сподівається, що звернення до його простого коріння допоможе людям зрозуміти, що вони можуть жити краще без насильницького повстання."
 hea_educate_serfs:0 "Навчання та проповідування"
 hea_educate_serfs_desc:0 "Так багато з цих звільнених кріпаків будуть кинуті у світ, якого вони до кінця не розуміють. На наш обов'язок лягає забезпечення того, щоб вони увійшли в нього зі знаннями та вірою, необхідними для життя в ньому, і прийняли його таким, яким він є."
 hea_placate_interests:0 "Задобрювання інтересів"
 hea_placate_interests_desc:0 "У старих і вкорінених частинах нашого суспільства є ті, хто бурчить на місію Гідеона покінчити з кріпацтвом, якою б поступовою вона не була. Їм він запропонує все можливе, щоб переконати їх у тому, що це також може бути в їхніх найкращих інтересах."
 hea_gradual_freedom:0 "Божі віряни, поступово вільні"
 hea_gradual_freedom_desc:0 "Маючи основу для наших зусиль з ліквідації системи, Гідеон подбає про свої останні кроки. На це підуть роки і це буде досить дорого, але одного дня вся Небесна Варта об'єднається в гімнах."

