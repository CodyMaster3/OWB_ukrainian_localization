#Leaders
 HEA_saint_michael_name:0 "Святий Майкл"
 MICHAEL_DESC:0 "Майкл народився в невеличкій родині, яка жила в скромній хатині на річці Снейк. Його виховували й навчали шанувати Святу Пару — ця традиція передавалася з покоління в покоління вірян. Як і багато хто у Варті Небес, він змалечку довгими годинами працював у полі, керований лише родиною та вірою. Його й без того міцна віра лише посилилася, коли він здійснив паломництво до Пари й побачив каньйони, оповиті її чистими білими хмарами. \n\nКоли сталася різанина в «Втраченій невинності», палкий Майкл зрозумів, що потрібно діяти. Коли Конклав нічого не вдіяв проти грабіжників, які спаплюжили їхню благословенну землю, Майкл швидко здобув прихильників завдяки своїм проповідям про вогонь і сірку. Проголошений своєю паствою Святим, нині він вважається уособленням народу, але як звичайний фермер може керувати нацією?"
 HEA_gideon_name:0 "Пророк Пари Ґідеон"
 GIDEON_DESC:0 "Член відірваної від світу Гільдії інженерів, Ґідеон змалечку виявляв неабиякий інтелект. Саме тому він став одним із небагатьох селян, обраних до Гільдії, що для когось було відзнакою, а для інших — ознакою боягузтва. За ці роки він став одним із провідних інженерів, які працювали всередині Ядра, але славу йому принесло не це. Як «зовнішній» інженер, він щомісяця вирушав у подорож із Ядра назад до Варти Небес. Спочатку діти питали його, що він робить, і після того, як вони проголосили його чарівником, він почав привертати увагу інших. Повільно, завдяки своїй роботі в Ядрі, він став відомий як Пророк Пари. Подобається йому це чи ні, але він знайшов послідовників, майже таких же фанатичних, як і у Святого Майкла."
 HEA_the_conclave_name:0 "Конклав"
 CONCLAVE_DESC:0 "Церковний Конклав Пари, зазвичай відомий просто як Конклав, походить від перших шести релігійних лідерів, які разом заснували Варту Небес. Рада з шести архіміністрів служить як релігійним, так і політичним керівництвом громади. З плином часу Конклав зосереджував у своїх руках усе більше влади та повноважень, запровадивши систему кріпацтва на всій своїй території. Останнім часом вони впали в застій, і лише час покаже, чи зможуть вони швидко адаптуватися, чи стануть єдиним цілим із Парою."
