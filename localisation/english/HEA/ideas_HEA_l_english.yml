 hea_nucleus_level_5:0 "Ядро"
 hea_nucleus_level_5_desc:0 "Ядро — це об'єкт, який забезпечує нас Святим Паром. Пар — це благословення, благословення, яке дозволило нам вижити там, де так багато інших зазнали невдачі."
 hea_cloud_walkers:0 "Хмароходи"
 hea_cloud_walkers_desc:0 "Хмароходи — це елітні підрозділи в Силовій броні, які використовують Пар, щоб обрушити Божий гнів як на єретиків, так і на язичників."
 hea_serfdom:0 "Кріпацтво в Епоху Пару"
 hea_cloud_walkers_2:0 "Хмароходи"
 hea_cloud_walkers_2_desc:0 "Хмароходи — це елітні підрозділи в Силовій броні, які використовують Пар, щоб обрушити Божий гнів як на єретиків, так і на язичників."
 hea_serfdom:0 "Кріпацтво в Епоху Пару" 
 hea_serfdom_desc:0 "Оскільки Ядро забезпечує більшу частину промислового виробництва Небесної Варти, більшість населення працює фермерами і живе як селяни в минулому. Конклав впровадив цю систему, щоб утримати владу, обмежуючи освіту та придушуючи свободу волі."
 hea_michael_serfdom:0 "Розриваючи ланцюги"
 hea_michael_serfdom_desc:0 "Досить раптове скасування кріпацтва рукою Святого Михаїла викликає значні потрясіння в країні, але інакше він і не хотів би."
 hea_michael_serfdom2:0 "Розриваючи ланцюги"
 hea_michael_serfdom2_desc:0 "Досить раптове скасування кріпацтва рукою Святого Михаїла викликає значні потрясіння в країні, але інакше він і не хотів би."
 hea_michael_serfdom3:0 "Нові громадяни Пару"
 hea_michael_serfdom3_desc:0 "Наші кріпаки перетворилися з підневільних батраків на благочестивих і патріотичних слуг великої нової нації!"
