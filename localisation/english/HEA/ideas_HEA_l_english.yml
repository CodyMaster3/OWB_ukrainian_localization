l_english:
hea_steam_powered_weapons:0 "Зброя на парових ядрах"
 hea_steam_powered_weapons_desc:0 "У старому світі, вздовж Північно-західної комуни, було вкладено багато коштів у геніальний винахід, відомий як парове ядро.\nСпочатку його запропонувала Північно-західна Співдружність під час старої війни на етапі прототипування проєкту AER як потенційного кандидата, але його відхилили на користь конструкцій, що використовували мікроядерні батареї. Незважаючи на це, економіка регіону стала занадто залежною від відхиленого проєкту реактора поділу (влучно названого паровими ядрами), і тому розробка зброї на парових ядрах продовжилася.\nЦі парові ядра дають всьому нашому спорядженню потужну віддачу відповідно до сили, яку вони видають, хоча інколи з ними трапляються рідкісні випадки збоїв."
 hea_steam_powered_weapons2:0 "Зброя на парових ядрах"
 hea_steam_powered_weapons2_desc:0 "У старому світі, вздовж Північно-західної комуни, було вкладено багато коштів у геніальний винахід, відомий як парове ядро.\nСпочатку його запропонувала Північно-західна Співдружність під час старої війни на етапі прототипування проєкту AER як потенційного кандидата, але його відхилили на користь конструкцій, що використовували мікроядерні батареї. Незважаючи на це, економіка регіону стала занадто залежною від відхиленого проєкту реактора поділу (влучно названого паровими ядрами), і тому розробка зброї на парових ядрах продовжилася.\nЦі парові ядра дають всьому нашому спорядженню потужну віддачу відповідно до сили, яку вони видають, хоча інколи з ними трапляються рідкісні випадки збоїв."

 hea_divided_leadership:0 "Розділене лідерство"
 hea_divided_leadership_desc:0 "Хоча Конклав залишається де-юре владою Небесної Варти, Святий Михаїл користується люттю багатьох, гуртуючи їх у лавах своїх Синів Небес."

 hea_nucleus_level_1:0 "Ядро"
 hea_nucleus_level_1_desc:0 "Ядро — це об'єкт, який забезпечує нас Святим Паром. Пар — це благословення, благословення, яке дозволило нам вижити там, де так багато інших зазнали невдачі."
 hea_nucleus_level_2:0 "Ядро"
 hea_nucleus_level_2_desc:0 "Ядро — це об'єкт, який забезпечує нас Святим Паром. Пар — це благословення, благословення, яке дозволило нам вижити там, де так багато інших зазнали невдачі."
 hea_nucleus_level_3:0 "Ядро"
 hea_nucleus_level_3_desc:0 "Ядро — це об'єкт, який забезпечує нас Святим Паром. Пар — це благословення, благословення, яке дозволило нам вижити там, де так багато інших зазнали невдачі."
 hea_nucleus_level_4:0 "Ядро"
