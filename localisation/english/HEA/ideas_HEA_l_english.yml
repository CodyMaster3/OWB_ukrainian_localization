 hea_gideon_serfdom:0 "Кріпацтво в Епоху Пару"
 hea_gideon_serfdom_desc:0 "Оскільки Ядро забезпечує більшу частину промислового виробництва Небесної Варти, більшість населення працює фермерами і живе як селяни в минулому. Конклав впровадив цю систему, щоб утримати владу, обмежуючи освіту та придушуючи свободу волі."
 hea_gideon_serfdom_2:0 "Кріпацтво в Епоху Пару"
 hea_gideon_serfdom_2_desc:0 "Оскільки Ядро забезпечує більшу частину промислового виробництва Небесної Варти, більшість населення працює фермерами і живе як селяни в минулому. Конклав впровадив цю систему, щоб утримати владу, обмежуючи освіту та придушуючи свободу волі."
 hea_gideon_serfdom_3:0 "Вільні у вірі та дусі"
 hea_gideon_serfdom_3_desc:0 "Хоча шрами від кріпацтва можуть залишатися ще довго, Гідеон вірить, що його робота призведе до створення кращого світу за образом і подобою Божою."
 hea_gideon_serfdom_compensation:0 "Відшкодування землевласникам"
 hea_gideon_serfdom_compensation_desc:0 "Ті, хто мав частку в системі кріпацтва, повинні отримувати компенсацію протягом певного часу, але зрештою воно того варте."
 hea_gideon_anti_abuse_idea:0 "Закони проти зловживань"
 hea_fire_and_brimstone:0 "Вогонь, Пар і Сірка"
 hea_guiding_the_flock:0 "Спрямовуючи паству"
 hea_michael_edu_idea:0 "Кампанія з ліквідації неписьменності кріпаків"
 hea_growing_militarism:0 "Зростаючий мілітаризм"
 hea_growing_militarism2:0 "Паровий хрестовий похід"

 hea_startup_militant:0 "До Ефесян 6:11"
 hea_startup_militant_desc:0 "Одягніться в повну зброю Божу, щоб ви могли дати опір хитрощам диявольським."

 hea_startup_agriculture:0 "Ісая 1:19"
 hea_startup_agriculture_desc:0 "Як захочете ви та послухаєтесь, то будете добра землі споживати;"

 hea_startup_stationary_pilgrims:0 "Буття 13:15"
 hea_startup_stationary_pilgrims_desc:0 "Бо всю землю, яку ти бачиш, Я дам тобі та твоєму насінню навіки."

 hea_startup_traveling_pilgrims:0 "Псалом 23:4"
 hea_startup_traveling_pilgrims_desc:0 "Коли я піду хоча б навіть долиною смертної темряви, то не буду боятися злого, бо Ти при мені, Твоє жезло й Твій посох — вони мене втішать!"

 hea_startup_let_them_in:0 "1 до Коринтян 12:2"
 hea_startup_let_them_in_desc:0 "Знаєте, що коли ви були поганами, то вас тягнуло до німих ідолів, ніби ведено вас."

 hea_startup_better_be_careful:0 "Від Луки 12:30"
 hea_startup_better_be_careful_desc:0 "Бо всього цього шукають народи світу; Ваш же Отець знає, що ви цього потребуєте."

 hea_theocratic_elite:0 "Конклав"
 hea_theocratic_elite_desc:0 "Конклав, що складається з шести Архіміністрів, має значну владу в Небесній Варті, оскільки тільки вони можуть розмовляти з Богом. Їхня тривала влада призвела до стагнації, але ніхто не наважувався кинути їм відкритий виклик."
 hea_conclave_sabatoged1:0 "Конклав"
 hea_conclave_sabatoged1_desc:0 "Конклав, що складається з шести Архіміністрів, має значну владу в Небесній Варті, оскільки тільки вони можуть розмовляти з Богом. Їхня тривала влада призвела до стагнації, але ніхто не наважувався кинути їм відкритий виклик."
 hea_conclave_sabatoged2:0 "Конклав"
 hea_conclave_sabatoged2_desc:0 "Конклав, що складається з шести Архіміністрів, має значну владу в Небесній Варті, оскільки тільки вони можуть розмовляти з Богом. Їхня тривала влада призвела до стагнації, але ніхто не наважувався кинути їм відкритий виклик."

 hea_theocratic_elite_good:0 "Конклав"
 hea_theocratic_elite_good_desc:0 "Конклав, що складається з шести Архіміністрів, має значну владу в Небесній Варті, оскільки тільки вони можуть розмовляти з Богом. Їхня тривала влада призвела до стагнації, але ніхто не наважувався кинути їм відкритий виклик."

 hea_theocratic_elite_good_2:0 "Великий Конклав"
 hea_theocratic_elite_good_2_desc:0 "Конклав, що складається з шести Архіміністрів, має значну владу в Небесній Варті, оскільки тільки вони можуть розмовляти з Богом. Хоча і виникали сумніви щодо їхньої влади, нині вони утвердилися як єдина влада в Небесній Варті."

 hea_theocratic_elite_contested:0 "Виклик теократичній еліті"
 hea_theocratic_elite_contested_desc:0 "Теократична еліта останнім часом переживає скрутні часи, часто стикаючись із офіційними викликами своїй колись безмежній владі."

 hea_theocratic_elite_marginalized:0 "Маргіналізований Конклав"
 hea_theocratic_elite_marginalized_desc:0 "Конклав, що складається з шести Архіміністрів, має значну владу в Небесній Варті, оскільки тільки вони можуть розмовляти з Богом. Їхня давня влада була послаблена на користь Парового Пророка Гідеона."

 hea_anti_michael_campaign:0 "Кампанія «Перекуємо мечі на рала»"

 hea_watchers_eyes_idea:0 "Орден Спостерігачів"

 hea_loyal_military_idea:0 "Піднесені Екземпляри"

 hea_saints_matyrdom_idea:0 "Смерть фальшивого пророка"
 hea_saints_matyrdom_idea_desc:0 "Хоча смерть Михаїла може спочатку шокувати громадян, спадщина від знищення цього єретика перетвориться на славу для Конклаву."

 hea_one_prophet:0 "Єдиний пророк"
 hea_one_prophet_desc:0 "Є лише один пророк, один лідер, і його ім'я — Святий Михаїл."

 hea_innocence_lost_idea:0 "Інцидент у «Втраченій Невинності»"
 hea_innocence_lost_idea_desc:0 "Різанина у «Втраченій Невинності» залишила шрам на наших людях. Слова призвели до насильства, насильство призвело до смерті, і мало що залишилося від колись мирної громади."

 hea_innocence_lost_idea_lessend:0 "Криза послабилася"
 hea_innocence_lost_idea_lessend_desc:0 "Завдяки обережним словам і маніпуляціям душі у «Втраченій Невинності» були врятовані. Криза та загроза залишаються, але кров ще не пролилася."

 hea_rampant_militarism:0 "Нестримний мілітаризм"
 hea_rampant_militarism_desc:0 "З кожним місяцем мешканці Небесної Варти все далі відходять від свого мирного способу життя, беручи до рук зброю, щоб захистити себе та волю Божу."

 hea_rampant_militarism_1:0 "Нестримний мілітаризм"
 hea_rampant_militarism_1_desc:0 "З кожним місяцем мешканці Небесної Варти все далі відходять від свого мирного способу життя, беручи до рук зброю, щоб захистити себе та волю Божу."

 hea_rampant_militarism_2:0 "Нестримний мілітаризм"
 hea_rampant_militarism_2_desc:0 "З кожним місяцем мешканці Небесної Варти все далі відходять від свого мирного способу життя, беручи до рук зброю, щоб захистити себе та волю Божу."

 hea_boilers_of_justice:0 "Котли Правосуддя"
 hea_boilers_of_justice_desc:0 "Котли Небесної Варти — це найвище хрещення, кипляча вода, що випікає гріх і жовч як з душі, так і з тіла. Мало хто виживає після такого хрещення, але кожен, хто входить до них, очищується."

# hea_rampant_fright:0 "Нестримний страх"
# hea_rampant_fright_desc:0 "Страх заполонив серця і уми жителів Небесної Варти, і Бог залишився єдиною втіхою, яку вони можуть знайти."

 hea_reconcilliation:0 "Примирення з племенами"
 hea_reconcilliation_desc:0 "Протягом багатьох років у нас були напружені стосунки з племенами, але ми починаємо відбудовувати те, що було втрачено. Довіра повертається до Небесної Варти."

 hea_reconcilliation_1:0 "Ласкаво просимо до пастви"
 hea_reconcilliation_1_desc:0 "Ті, хто прийняв нас, можуть повернутися. Ті, хто забув, можуть повернутися. Всі можуть повернутися в обійми Бога, якщо вони цього шукають."

 hea_school_of_steam:0 "Школа Пару"
 hea_school_of_steam_desc:0 "Сила пару змінила нас на краще, і в міру того, як зростає наше розуміння термоядерних парогенераторів, зростає і наша здатність долати виклики навколишнього світу."

 hea_air_knight:0 "Повітряні ордени"
 hea_air_knight_desc:0 "Подібно до лицарів, що колись мандрували землями в ім'я Бога, наші пілоти об'єдналися в ордени. Захищаючи віру з висоти, чемпіони, закуті в сталь, літають із Богом на своєму боці."

 hea_general_staff:0 "Офіцери-священники"
 hea_general_staff_desc:0 "Священників часто вважають мирними душами, але коли виникає потреба? Така людина може надихнути воїнів і солдатів так, як мало хто може зрозуміти. Бог йде з ними в бій."

 hea_mobility:0 "Школа мобільності"
 hea_mobility_desc:0 "Потужність парового термоядерного двигуна не варто недооцінювати, і наше зростаюче володіння ним дає нам численні переваги над нашими ворогами."

 hea_steam_power:0 "Благословення Пару"

 hea_age_of_steam_idea:0 "Епоха Пару"
 hea_age_of_steam_idea_desc:0 "Епоха Пару настала! Нехай усі, хто дивиться на браму, знають, ким ми стали, і що ми принесемо в цей світ!"

 hea_conscription:0 "Загальний призов"
 hea_conscription_desc:0 "Усіх закликають до бою та захисту останнього Царства Божого! Горе тим ворогам, що побачать наше могутнє воїнство!"

 hea_crusaders:0 "Сили Хрестоносців"
 hea_crusaders_desc:0 "Хрестоносці — це нове покоління солдатів, які використовують і зброю, і віру проти тих, хто посміє кинути виклик Святому."

 hea_grand_cathedral:0 "Великий Собор"
 hea_grand_cathedral_desc:0 "Великий Собор є однією з найвеличніших споруд, збудованих після падіння — чотири поверхи з фігурного мармуру та сталевих труб. Символ, гідний як Бога, так і Його Святого."

