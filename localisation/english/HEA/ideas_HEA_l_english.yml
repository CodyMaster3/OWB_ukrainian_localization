l_english:
  hea_steam_powered_weapons:0 "Зброя на Парових Осердях"
  hea_steam_powered_weapons_desc:0 "У старому світі на теренах Північно-Західної комуни велика увага приділялась геніальному винаходу – Паровому Осердю.\nСпершу його запропонувала Північно-Західна Співдружність під час прототипування AER-проєкту, як альтернативу MF-елементам, але його відкинули. Попри це, економіка регіону вже надто сильно залежала від цієї технології – тож розробки не зупинились.\nПарові осердя надають нашій зброї потужної сили, хоч іноді й трапляються небезпечні відмови."

  hea_divided_leadership:0 "Розділене Керівництво"
  hea_divided_leadership_desc:0 "Святий Михаїл стоїть понад усіма як вождь – провісник самого Бога, який не може вести нас хибно!"

  hea_steam_power:0 "Благословення Пара"
  hea_steam_power_desc:0 "Пар – це благословення. Завдяки ньому ми вижили там, де інші занепали."

  hea_startup_militant:0 "До ефесян 6:11"
  hea_startup_militant_desc:0 "«Зодягніться в повну Божу зброю, щоб могли ви протистояти підступам диявола.»"

  hea_startup_agriculture:0 "Ісая 1:19"
  hea_startup_agriculture_desc:0 "«Коли ви будете згідливі та слухняні – ви будете споживати добро землі.»"

  hea_startup_stationary_pilgrims:0 "Буття 13:15"
  hea_startup_stationary_pilgrims_desc:0 "«Усю землю, яку ти бачиш, Я віддаю тобі та нащадкам твоїм – навіки.»"

  hea_startup_traveling_pilgrims:0 "Псалом 23:4"
  hea_startup_traveling_pilgrims_desc:0 "«Навіть коли я йду долиною темряви – не боятимусь зла, бо Ти зі мною. Жезл Твій і посох Твій – вони мене втішають.»"

  hea_startup_let_them_in:0 "1 до коринтян 12:2"
  hea_startup_let_them_in_desc:0 "«Коли ви були язичниками, вас вело до німотних ідолів – як би не вело...»"

  hea_startup_better_be_careful:0 "Від Луки 12:30"
  hea_startup_better_be_careful_desc:0 "«Усього цього прагнуть народи світу; але ваш Отець знає, що ви потребуєте цього.»"

  hea_theocratic_elite:0 "Теократична Еліта"
  hea_theocratic_elite_desc:0 "Ті, хто говорить Божим словом, стоять над усіма в нашому суспільстві – і це зрозуміло кожному."

  hea_theocratic_elite_good:0 "Теократична Еліта"
  hea_theocratic_elite_good_desc:0 "Ті, хто говорить Божим словом, стоять над усіма в нашому суспільстві – і це зрозуміло кожному."

  hea_theocratic_elite_good_1:0 "Теократична Еліта"
  hea_theocratic_elite_good_1_desc:0 "Ті, хто говорить Божим словом, стоять над усіма в нашому суспільстві – і це зрозуміло кожному."

  hea_theocratic_elite_contested:0 "Оскарження Еліти"
  hea_theocratic_elite_contested_desc:0 "Теократична еліта переживає скруту: її авторитет усе частіше ставиться під сумнів."

  hea_theocratic_elite_marginalized:0 "Маргіналізація Еліти"
  hea_theocratic_elite_marginalized_desc:0 "Теократична еліта – тінь самої себе, майже не має впливу після сходження Пророка."

  hea_one_prophet:0 "Єдиний Пророк"
  hea_one_prophet_desc:0 "Існує лише один Пророк. Один лідер. І його ім’я – Святий Михаїл."

  hea_innocence_lost_idea:0 "Інцидент у Невинності"
  hea_innocence_lost_idea_desc:0 "Різанина в Невинності залишила глибоку рану в наших серцях. Слова привели до насильства, насильство – до смерті. Від колись мирної громади майже нічого не лишилося."

  hea_innocence_lost_idea_lessend:0 "Криза Пом’якшена"
  hea_innocence_lost_idea_lessend_desc:0 "Завдяки мудрим словам і переконанню душі Невинності були врятовані. Загроза лишається – але кров ще не пролилась."

  hea_rampant_militarism:0 "Несамовитий Мілітаризм"
  hea_rampant_militarism_desc:0 "Народ Небесної Брами усе далі відходить від мирного життя – вони озброюються, щоби захистити себе та Божу волю."

  hea_rampant_militarism_1:0 "Несамовитий Мілітаризм"
  hea_rampant_militarism_1_desc:0 "Народ Небесної Брами усе далі відходить від мирного життя – вони озброюються, щоби захистити себе та Божу волю."

  hea_rampant_militarism_2:0 "Несамовитий Мілітаризм"
  hea_rampant_militarism_2_desc:0 "Народ Небесної Брами усе далі відходить від мирного життя – вони озброюються, щоби захистити себе та Божу волю."

  hea_boilers_of_justice:0 "Котли Справедливості"
  hea_boilers_of_justice_desc:0 "Котли Небесної Брами – вища форма хрещення, де окріп очищує тіло й душу від гріха. Виживають одиниці. Але всі, хто пройде крізь них – очищені."

#  hea_rampant_fright:0 "Rampant Fright"
#  hea_rampant_fright_desc:0 "Fear has taken hold in the hearts and minds of the people of Heaven's Gate, with God being the only solace they can find."

  hea_reconcilliation:0 "Примирення з Племенами"
  hea_reconcilliation_desc:0 "Наші стосунки з племенами довгий час були напруженими, та нині ми починаємо відбудовувати втрачене. Довіра повертається до Небесної Брами."

  hea_reconcilliation_1:0 "Ласкаво Просимо до Стада"
  hea_reconcilliation_1_desc:0 "Ті, хто прийняв нас – можуть повернутись. Ті, хто забув нас – можуть повернутись. Усі можуть повернутись до Божого обійму, якщо лиш прагнуть того."

  hea_school_of_steam:0 "Школа Пара"
  hea_school_of_steam_desc:0 "Сила пари змінила нас на краще. І що більше ми розуміємо паро-синтезні генератори, то краще ми готові до викликів цього зруйнованого світу."

  hea_air_knight:0 "Орден Летючих"
  hea_air_knight_desc:0 "Як лицарі минулого, що несли віру по землі, так і наші пілоти згуртувались в ордени. Вони захищають віру з небес – воїни в броні, що літають поруч із самим Богом."

  hea_general_staff:0 "Священницькі Офіцери"
  hea_general_staff_desc:0 "Священика часто сприймають як мирну душу. Але коли настає потреба? Такий чоловік може надихнути воїнів так, як мало хто зможе. Адже Бог іде поруч з ним у бій."

  hea_mobility:0 "Школа Мобільності"
  hea_mobility_desc:0 "Силу паро-синтезного двигуна не слід недооцінювати. Наше зростаюче володіння ним дає нам безліч переваг над ворогами."

  hea_age_of_steam_idea:0 "Епоха Пара"
  hea_age_of_steam_idea_desc:0 "Епоха Пара настала! Хай кожен, хто бачить Ворота, усвідомить, ким ми стали – і що ми принесемо цьому світу!"

  hea_conscription:0 "Загальна Мобілізація"
  hea_conscription_desc:0 "Кожен покликаний до бою – захищати останнє Царство Боже! Горе тим, хто зважиться стати перед нашими небесними полками!"

  hea_crusaders:0 "Війська Хрестоносців"
  hea_crusaders_desc:0 "Хрестоносці – це нове покоління воїнів, які несуть і зброю, і віру проти всіх, хто посміє кинути виклик Святому."

  hea_grand_cathedral:0 "Великий Собор"
  hea_grand_cathedral_desc:0 "Великий Собор – одна з найвеличніших споруд після Падіння: чотири поверхи мармуру та сталевих труб. Символ, гідний і Бога, і Його Святого."
