 hea_seraph_cooperation_idea:0 "Уроки Серафимів"
 hea_seraph_cooperation_idea_desc:0 "Возз'єднавшись із нашою паствою, Лорди-Серафими принесли з собою досвід і мудрість, особливо у питаннях навернення далеких язичників."

 HEA_rotpurger_zeal_idea:0 "Ревність Очищувачів гнилі"
 HEA_rotpurger_zeal_idea_desc:0 "Очищувачі гнилі, можливо, не сповідували Пар із самого початку, але вони принесли до нього вогонь, гідний його чемпіонів."

 hea_vehicle_production_idea:0 "Парова тяга"

 hea_steam_engine_idea:0 "Найсвятіший паровий двигун"
 hea_steam_engine_idea_desc:0 "Наші нові парові двигуни не лише покращують хід нашої техніки, але й живлять системи озброєння з сильнішою віддачею, ніж будь-коли раніше."
