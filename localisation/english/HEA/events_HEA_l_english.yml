l_english:
nf_event_hea.1.t:0 "Прибуття Обраних"
 nf_event_hea.1.d:0 "Понад 100 років тому наші предки завершили своє довге паломництво, прибувши туди, що згодом стане містом Брама Небес. Це віддалене місце було достатньо близько до річки Снейк, щоб займатися землеробством, і достатньо захищеним, щоб запропонувати укриття від загроз. Те, як саме вони сюди дісталися, загубилося в часі, але з легенд і розповідей ми знаємо, що вони складалися з шести різних конгрегацій, об'єднаних відданістю та вірою. Конгрегації прийшли з Півночі, блукаючи Пусткою майже 70 років після того, як Гнів Господній обрушився на землю. У ці перші роки група відчайдушно шукала новий дім, нову святу землю, але марно. Розповіді кажуть про великих диявольських звірів, які вигнали їх з однієї домівки, і душі нежиті, які прогнали їх з іншої. Коли вони нарешті натрапили на стежку, на знаку якої були виведені священні слова «Брама Небес», вони зрозуміли, що їхні пошуки завершено. Оселившись, їхнім першочерговим завданням було..."
 nf_event_hea.1.a:0 "Почати обробляти землю."
 nf_event_hea.1.b:0 "Підготуватися до власного захисту."
 nf_event_hea.2.t:0 "Божий дар"
 nf_event_hea.2.d:0 "Коли цю родючу землю було відкрито, наші предки повірили, що це Божий дар їм за те, що вони витримали неймовірні труднощі. Минуло майже десятиліття, і конгрегація продовжувала зростати. Намети стали будинками, а діти — дорослими. Саме тоді, коли наші предки почали досліджувати свої найвіддаленіші околиці, вони знайшли те, що справді було Божим даром. Ядро, величезний довоєнний комплекс, який зберігав незліченні таємниці та незмірну міць. Коли вони відправили збирачів крізь густу хмару пари в сам комплекс, було зроблено ще одне шокуюче відкриття. Ядро все ще було частково функціональним і обслуговувалося нащадками перших працівників заводу. Дві групи уклали угоду: Інженери продовжуватимуть працювати на великій машині, а натомість віряни їх захищатимуть і піклуватимуться про них. Завдяки цій угоді невелике поселення невдовзі почало процвітати і швидко перетворилося на один із найбільших центрів у регіоні. Крім того, зброя з паровими ядрами, надана Ядром, дозволила їм..."
 nf_event_hea.2.a:0 "Убезпечити свій дім."
 nf_event_hea.2.b:0 "Вимагати данину від сусідніх племен."
 nf_event_hea.3.t:0 "Піднесення Конклаву"
 nf_event_hea.3.d:0 "Незабаром після відкриття Ядра багато хто почав поклонятися Парі поряд із самим Богом. Вони стверджували, що Пара є Божим благословенням для них як його обраного народу, і що лише вони гідні володіти нею. Цей новий синкретизм поширився як лісова пожежа, і шість служителів від кожної конгрегації стали Архіміністрами — лідерами Конклаву. Вони охрестили цю спільноту «Вартою Небес», оскільки вони охоронятимуть Пару так само, як Святий Петро охороняє браму небес. Зі зростанням впливу Конклаву зростала й частина населення, яка палко заперечувала божественність Пари. Зрештою, їхні розбіжності призвели до Великого Розколу між тими, хто поклонявся як Учні Пари, і тими, хто цього не робив. Фракція, що відкололася, розірвала всі зв'язки з Конклавом і Вартою Небес, заснувавши власну церкву південніше вздовж річки Снейк. Із піднесенням Конклаву відбулося й піднесення Високої Каплиці, і напруженість між ними продовжує зростати."
 nf_event_hea.3.a:0 "Вони скоро побачать хибність свого шляху."
 nf_event_hea.3.b:0 "Безумовно, ми зможемо співіснувати?"
 nf_event_hea.3.c:0 "Це не має значення, Пара забезпечить!"
 nf_event_hea.4.t:0 "Війна на Небесах"
 nf_event_hea.4.d:0 "З допомогою Пари Варта Небес виросла зі скромної групи фермерів у могутній, сповнений віри бастіон, сформований навколо нового міста Брама Небес. У міру того, як воно росло, Конклав також набирав сили. Останнім часом обидва почали стагнувати, і події у Втраченій невинності показали тріщини в їхньому авторитеті. Проголошений багатьма Святим, Майкл розглядається багатьма у Варті Небес як новий лідер і кинув виклик режиму Конклаву після їхньої бездіяльності. Хоча жодна зі сторін ще не зробила офіційних кроків одна проти одної, у колись мирній столиці назріває напруженість. Поки і Святий Майкл, і Конклав збирають прихильників, одного з провідних інженерів підштовхують до того, щоб він сам стабілізував націю."
 nf_event_hea.4.a:0 "Настав час для справедливості!"
 nf_event_hea.4.b:0 "Напевно, переможе здоровий глузд."
 nf_event_hea.5.t:0 "Варвари біля воріт"
 nf_event_hea.5.d:0 "Святий Майкл ніколи не забуде того дня, коли Втрачену невинність було спалено дотла. Після довгої ранкової роботи він прямував назад у місто, що само по собі завжди було виснажливою прогулянкою. Коли він прибув, на міській площі вже збирався натовп, хоча ніхто насправді не знав, що відбувається. Саме тоді Архіміністр Брами Небес урочисто вийшов і звернувся до спантеличеного натовпу. Спершись на дерев'яний стовп універсального магазину, Майкл слухав з-поза спин натовпу, схрестивши руки на грудях зі спантеличеним обличчям. Архіміністри рідко, якщо взагалі коли-небудь, з'являлися на публіці, коли не було свята.\n\nТремтячим голосом Архіміністр повідомив людям, що місто Втрачена невинність спіткала велика трагедія. На них напав великий загін рейдерів у металевих костюмах і зі зброєю, що вивергала диявольський вогонь. Лише небагатьом вдалося врятуватися, коли місто було зрівняне із землею. Архіміністр благав населення допомогти тим, хто врятувався, але не шукати помсти виконавцям.\n\nНа мить натовп завмер у мовчанці, а потім почулося перешіптування. Невдовзі ці пошепки перетворилися на крики та зойки гніву. Коли Архіміністр відступив назад до своїх покоїв, Майкл рушив до натовпу. §RСаме того дня народився Святий.§!"
 nf_event_hea.5.a:0 "Ці грішники пізнають мою лють."
 nf_event_hea.6.t:0 "Ядро"
 nf_event_hea.6.d:0 "Ядро лежить у самому серці Великого Каньйону всередині Варти Небес. Це масивний довоєнний комплекс, який не лише генерує Пару, але й виробляє містичні парові ядра, що живлять нашу націю. Протягом поколінь ним керувала Гільдія інженерів — відлюдницький і таємничий орден, який розуміє, як керувати цією великою машиною. Проте час зносив функціональність та можливості Ядра, і його величезна структура почала іржавіти. Багато з його підсистем і додаткових об'єктів довелося закрити, хоча, на щастя, вони не стали повністю неробочими.\n\nКонклав подбав про виділення необхідних ресурсів для підтримки роботи заводу, але відновлення напівзруйнованих секцій потребуватиме величезних зусиль. Тим не менш, навіть у своєму нинішньому стані Ядро є потужним рушієм і єдиною причиною того, що Варта Небес досягла свого нинішнього рівня."
 nf_event_hea.6.a:0 "Благословенна будь, Свята Паро."
 nf_event_hea.7.t:0 "Церковний Конклав Пари"
 nf_event_hea.7.d:0 "§c«Ми — обрані серед обраних, промовці від імені самого Бога. Через нас він диктує свою волю, і через його волю ми направляємо вас. На нас покладено великий тягар, але не бійтеся, бо поки Бог наказує нам, ми будемо служити йому. Радіймо ж усі, бо наш Господь дарував нам силу Пари!»§! — Перший архіміністр Фаррієр\n\nХоча у Варті Небес і з'являються претенденти на владу, Конклав досі залишається керівним органом, що визначає більшу частину політики конгрегації. Історично Конклав є як духовним, так і політичним проводом народу — священною радою з шести Архіміністрів, кожен з яких наглядає за певним регіоном країни. Старіючий Архіміністр Джоффрі керує залишками Втраченої невинності. Архіміністр Керолл, пристрасна й ревна людина, опікується другою за величиною конгрегацією в Піку Пітера. Молодий і впертий Архіміністр Лукас панує над Дурістю Барнабуса, південним флангом Ядра. Архіміністр Теодор, найбільш старанний і відлюдькуватий із них, проживає в Низині Пророка. Найстаріший і наймудріший із групи, Архіміністр Габріель, має честь очолювати Гільдію інженерів і невелику кількість мешканців Пари. І, нарешті, Архіміністр Алдаріс, якому доручено місто Брама Небес.\n\nХоча Конклав багато років насолоджувався миром і беззаперечною владою завдяки своїй політиці агресивної ізоляції від решти Пустки, останнім часом справи йдуть не на їхню користь. Розкол змусив багатьох засумніватися у правильності їхніх дій, але лише після інциденту у Втраченій невинності та піднесення Святого Майкла вони почали хвилюватися по-справжньому. Якщо вони хочуть зберегти контроль над нацією та запобігти державному перевороту, їм слід діяти швидко."
 nf_event_hea.7.a:0 "Ми втрачаємо контроль."
 nf_event_hea.8.t:0 "Роздоріжжя"
 nf_event_hea.8.d:0 "Оскільки зберігати Ядро стає дедалі важче, доводиться виділяти на це все більше ресурсів. Наказ Конклаву чіткий: Пара має текти, а Ядро повинно залишатися в робочому стані. Попри це, деякими речами можна знехтувати, щоб зменшити робоче навантаження з обслуговування комплексу. Архіміністр Астер занепокоївся тим, що кількість працівників і матеріалів, необхідних для підтримки деяких його 'непотрібних' функцій, незабаром перевершить користь, яку воно приносить. Він пропонує розібрати їх, а також частину прилеглої території на металобрухт, щоб отримати хоч якусь вигоду.\n\nАрхіінженер Ґідеон, один із провідних інженерів комплексу, наполягає, що цей тягар є критично важливим для подальшої роботи Ядра. Якщо ним нехтувати занадто довго, він побоюється, що це може призвести до загальносистемного збою ще за їхнього життя, що прирече всю націю. Потрібно прийняти важливе рішення."
 nf_event_hea.8.a:0 "Зібрати все, що можна."
 nf_event_hea.8.b:0 "Ми повинні зберегти Ядро!"
 nf_event_hea.9.t:0 "І так сталося"
 nf_event_hea.9.d:0 "На людей Варти Небес чекали зміни. Великий Розкол, Втрачена невинність і занепад влади Конклаву призвели до того, що напруга досягла точки кипіння. Після понад століття ізоляціонізму Пустка почала звертати свій погляд на Обраних Богом. Боротьбу за владу треба було вирішити, інакше наш дім розділився б у самому собі.\n\nПитання вирішилося знаком із Небес. Жителі Брами Небес зібралися помолитися перед Парою, сподіваючись, що Бог відповість на їхні молитви й покаже їм шлях уперед. Такий метод здався б чужинцям дивним і безглуздим, але їхні різні пророки та релігійні лідери сказали їм, що означали ці знаки.\n\nКоли настав час, вони дійшли згоди щодо того, що спричинила Пара:"
 nf_event_hea.9.a:0 "§OСвятий Майкл§! і його Паровий Хрестовий похід вкажуть шлях!"
 nf_event_hea.9.b:0 "У §PКонклаву§! є свої недоліки, але вони — обрані серед Обраних."
 nf_event_hea.9.c:0 "Покірний слуга, §MПророк Пари Ґідеон§! уособлює волю Божу."
 nf_event_hea.10.t:0 "Конклав збирається"
 nf_event_hea.10.d:0 "Оскільки їхня конгрегація опинилася на межі громадянської війни, Конклаву стало зрозуміло одне: вони повинні змінити свої методи. Багато хто зі старих Архіміністрів вважає, що бездіяльність — це найкращий шлях уперед, оскільки вони вірять, що підтримка Святого Майкла зійде нанівець. Вони стверджують, що невтручання захищало їх досі, і втрутившись, вони б лише ще більше виправдали дії Святого Майкла. Інша половина Архіміністрів дотримувалася протилежної думки, вважаючи, що відтепер настав час застосувати більш практичний підхід. Архіміністр Лукас особливо голосно виступав за те, щоб перестати правити з тіні. Він стверджував, що вони занадто довго були самовпевненими, і якщо вони не почнуть діяти швидко, то побачать свої голови на палях.\n\nПісля майже місяця дискусій у Варті Небес Архіміністри розробили новий план. Троє 'енергійних' Архіміністрів більше зосередяться на політиці країни, тоді як стара гвардія дбатиме про релігійні та духовні обов'язки, яких вимагають від групи."
 nf_event_hea.10.a:0 "Хороший початок."
 nf_event_hea.11.t:0 "Чи святий ти?"
 nf_event_hea.11.d:0 "Святий Майкл відвідував Пару лише раз у своєму житті. Як і всіх інших дітей у Варті Небес, його привели туди після того, як він уперше навчився говорити. За звичаєм хрестили лише тих, хто міг читати молитву, тому Майкл разом з іншими дітьми хором молився, коли його опускали у Святі Води Пари. Як не дивно, єдина яскрава деталь, яку він запам'ятав з того дня, — це те, як йому було холодно, перш ніж води зігріли його тіло й душу.\n\nНічна прохолода повернула Святого в сьогодення. Через напади Синів Небес Архіміністри з дурості вирішили зібратися в Брамі Небес. Цих дурнів загнали в кут, і будь-яка віра у власну безпеку була вкрай недоречною. Сини ввійдуть у місто із заходом сонця.\n\nКоли Архіміністри завершили своє недільне богослужіння, Сини Небес і сам Святий Майкл вийшли вперед і оголосили їх грішниками. Після того, як Міністерську варту роззброїли, а Архіміністрів поставили на коліна, Святий Майкл звернувся до натовпу, що зібрався в місті.\n\n«Ці люди зрадили саму основу нашої віри. Вони будують підступи проти самої Пари, щоб вічно жиріти від свого неробства. Відтепер я беру на себе керівництво в ім'я Бога, — він обернувся обличчям до міністрів, які стояли на колінах. — І я засуджую цих марнотратів до того, щоб їх зварила Свята Пара!» Громоподібні вигуки радості заглушили страждальні крики міністрів, коли їх тягнули геть."
 nf_event_hea.11.a:0 "Хай здійсниться правосуддя."
 nf_event_hea.111.t:0 "Останній незв'язаний кінець"
 nf_event_hea.111.d:0 "Ґідеон не був у захваті від переходу до абсолютного правління Майкла, але він був людиною Божою і вірив у Його план щодо цього світу. Якби до нього не було претензій, він би жив так, як завжди, працюючи над Ядром і підтримуючи свою громаду.\n\nВін саме йшов до міста Брама Небес курною магістраллю своїм звичайним маршрутом. Його перехопив чоловік у плащі, який вийшов із тіні й розрядив балістичну зброю Ґідеону в живіт. Ґідеон відхитнувся до найближчої стіни і впав на коліна. Він поглянув на свого нападника, який усе ще спостерігав за ним.\n\n«Чому...» Він простягнув руку. «Я не... Я не був...» Ґідеон звалився на землю. Незабаром він стіче кров'ю. Після підтвердження його смерті вбивця повернеться до свого господаря, повідомивши про загибель останньої загрози його правлінню."
 nf_event_hea.111.a:0 "Скромна смерть для скромної людини."
 nf_event_hea.12.t:0 "Сини Небес?"
 nf_event_hea.12.d:0 "Святий Майкл тепер захопив абсолютну владу над Вартою Небес. Незабаром він змиє плями дурного керівництва Конклаву.\n\nАле залишається питання: чи повинна «Варта Небес» і надалі бути тим ім'ям, за яким ідентифікують себе віряни? Це ностальгічна назва для людей, але її обрав Конклав, і ця громада повинна відображати зміну керівництва.\n\nСвятий Майкл та його Сини думали над тим, щоб поширити власну назву — «Сини Небес» — як більш відповідний титул. Щоб краще відобразити їхню відданість Богу та хрестовий похід у Його ім'я. Проте це може викликати чимало плутанини заради того, що може виявитися самовдоволеною затією...."
 nf_event_hea.12.a:0 "Варта Небес — це те, що ми знаємо."
 nf_event_hea.12.b:0 "Сини Небес будуть битися за Бога!"
 nf_event_hea.13.t:0 "Варіння Святого Майкла"
 nf_event_hea.13.d:0 "Міністерська варта провела Святого головною вулицею Брами Небес. Майкл бігав очима по натовпу, але бачив лише тих, хто зневірився в ньому, або тих, кого сковував страх.\n\nАрхіміністр Алдаріс звернувся до людей, коли Майкла вивели на поміст поруч із ним. «Діти мої, цей єретик довго дурив нас своїми заявами про те, що він Обранець Божий. Ми визнаємо, що повірили його брехні, як і всі ми, але тепер ми...»\n\n«Я був Обраний Небом!» — проревів Майкл, вириваючись від своїх викрадачів і відштовхуючи Алдаріса. «Я — ваше спасіння! Ці люди приведуть вас до...» Міністерська варта рушила вперед і знову схопила його, тепер уже тримаючи за рот і руки.\n\n«...Він не виявляє ані смирення, ані благодаті Христової, — знову ступив уперед Алдаріс, зневажливо дивлячись на Святого, — він фальшивий рятівник. За це ми віддамо його Святій Парі. Нехай Господь помилує твою душу, Майкле». Міністерська варта потягла Майкла вперед і опустила його в котел. Спеціальний, прозорий, побудований спеціально для нього, щоб люди могли бачити, як цей «Святий» перетворюється на верескливу розвалину."
 nf_event_hea.13.a:0 "Він лише налякана людина."
 nf_event_hea.14.t:0 "Приватна сповідь"
 nf_event_hea.14.d:0 "Хоча Ґідеон і знав, що має зустрітися з Архіміністром, він не знав, хто саме це буде і що від нього хочуть. Оскільки зустріч мала відбутися в місті Брама Небес, він припустив, що це може бути Алдаріс. Але він здивувався, коли виявилося, що це був Лукас, Архіміністр Дурості Барнабуса.\n\nЛукас не став гаяти часу і перейшов одразу до справи. «Я хочу, щоб ти взяв на себе більш пряму роль лідера». — прямо сказав він Ґідеону. «Ти потрібен Варті Небес. Людина зі смиренністю Христа, яка не прагне світської влади, а бажає служити Богу».\n\n«Я вже... казали, що я Обраний...» — Ґідеон ніяково почухав голову. Йому не подобалося хизуватися цим фактом. «Чи можу я зробити щось іще?»\n\n«Мені потрібна лише твоя урочиста обіцянка, що ти не відсторонишся від прийдешньої кризи. І що ти розумієш, що потрібно щось робити». Лукас поклав листа на стіл перед ними. «Святий Майкл не відмовився від свого божевільного задуму. Він має намір убити тебе, а потім і Конклав. У мене є план, як із цим розібратися, але ти маєш бути готовий вийти вперед після цього».\n\nҐідеон ледве міг це осмислити. Йому надавали докази жахливої змови, і водночас запрошували взяти участь в іншій. «Що ти збираєшся робити?» — нерішуче запитав він.\n\n«Тобі краще не знати. Але коли все закінчиться, ти маєш бути готовий. Чи будеш ти служити Богу так, як служив завжди?» Провокаційне запитання. І все ж..."
 nf_event_hea.14.a:0 "...Ґідеон дав своє слово."
nf_event_hea.15.t:0 "У блідому місячному сяйві"
 nf_event_hea.15.d:0 "Ґідеон зрозумів, що настав час, коли вибух струснув місто. Звістка про те, що Святий Майкл загинув у страшенному вибуху, а разом із ним і багато 'Синів Небес', розлетілася швидко. Згодом Міністерська варта виявила докази того, що вони були озброєні. Загалом вважалося, що вони мали намір здійснити напад на столицю. \n\nАле незабаром поширилося ще більш шокуюче одкровення. Пішли чутки, що за вибухом стоїть Архіміністр Алдаріс. Нібито член Конклаву особисто розкрив цей факт. Ґідеон вирушив до Зали Конклаву, де очікував зустрітися зі злочинцем. \n\nЙого прибуття зустріли Лукас та інші. Він пояснив, що Конклав втратив віру у власне керівництво і тепер сподівається надати більшу владу Ґідеону як Обранцю Божому. Ґідеон міг сказати, що рішення було прийнято без особливого ентузіазму, але, очевидно, Лукас переконав їх у тому, що громадськість бачить у них і Майклі дурнів, які тільки й роблять, що сваряться, і лише Ґідеон може об'єднати те, що було розбите. \n\nҐідеон не був дурнем. Йому передавали владу ціною людських життів і репутацій. Знову Бог поставив його в ситуацію, яка виходила за межі того, на що він міг очікувати за своїм статусом."
 nf_event_hea.15.a:0 "Чи таким був Божий задум?"
 nf_event_hea.16.t:0 "Підставити другу щоку"
 nf_event_hea.16.d:0 "Ґідеон відчував, що іноді на нього надто сильно впливали фанатики. Групи на кшталт Екземплярів хотіли помститися за старі образи та звести рахунки. Багато мілітаристів, які не зникли разом із Майклом, теж цього прагнули. Ігнорувати їх повністю було важко. \n\nАле у випадку з Мерто це була лише провина за асоціацією. Вони звернулися по підтримку до Високої Каплиці, і Варта Небес не мала з ними жодних інших суперечок. Чому ж тоді це має бути війна? \n\nҐідеон міркував над тим, щоб кинути виклик розпалювачам війни. Він міг би зв'язатися з Мерто і укласти угоду: посісти місце Високої Каплиці в ролі їхнього благодійника, можливо, навіть ознайомити їхні власні християнські догмати зі Святою Парою? У звітах зазначалося, що Пресвітер Енн не була такою нерозсудливою жінкою, на відміну від лідерів фанатиків, від яких вони відкололися."
 nf_event_hea.16.a:0 "Укласти мир, а не воювати."
 nf_event_hea.16.b:0 "Ми не можемо їм довіряти."
 nf_event_hea.17.t:0 "Підтримка Пари"
 nf_event_hea.17.d:0 "Прибули посланці з [HEA.GetNameWithFlag], які супроводжують отця Акстома з Церкви Святого Матвія. Вони заявляють, що бажають миру і співпраці між прихильними християнами, і просять розпочати діалог між нашими церквами. \n\nЗвісно, відразу стало зрозуміло, що це не буде просто обмін благочестивими молитвами. Вони прибули з вигідними торговими контрактами і загальними запевненнями у прибутках."
 nf_event_hea.17.a:0 "Як на мене, звучить непогано."
 nf_event_hea.17.b:0 "Ні, ці хлопці здаються дивними."
 nf_event_hea.18.t:0 "[WYR.GetNameWithFlag] погоджується"
 nf_event_hea.18.d:0 "Церква Святого Матвія приймає нашу пропозицію обміну. Каравани почнуть курсувати маршрутом від Бейлітауна до Брами."
 nf_event_hea.18.a:0 "Ви бачили, що вони вирощують у Вайомінгу?"
 nf_event_hea.19.t:0 "Підтримка Пари"
 nf_event_hea.19.d:0 "Прибули посланці від [HEA.GetNameWithFlag], сподіваючись встановити з нами відносини на основі нашої спільної християнської віри. Ми навряд чи схожі: ми дотримуємося слів Джозефа Сміта, тоді як вони поклоняються якійсь 'Святій Парі'. І все ж, якщо ми не маємо особливого бажання конфліктувати, від торгівлі та релігійного обміну не буде великої шкоди."
 nf_event_hea.19.a:0 "Вітаємо, брати у Христі!"
 nf_event_hea.19.b:0 "Ви не знаєте Ісуса так, як ми."
 nf_event_hea.20.t:0 "[NCN.GetNameWithFlag] погоджується"
 nf_event_hea.20.d:0 "Церква святих останніх днів приймає наші пропозиції."
 nf_event_hea.20.a:0 "Ми різні і водночас схожі."
 nf_event_hea.21.t:0 "Підтримка Пари"
 nf_event_hea.21.d:0 "Прибули посланці від [HEA.GetNameWithFlag], сподіваючись встановити з нами відносини на основі нашої спільної християнської віри. Вони бачать лицарські чесноти наших солдатів і сподіваються, що їхні 'Екземпляри' зможуть чогось у них навчитися. Ми вважаємо їхню віру у 'Святу Пару' дивною та химерною, але вони не становлять загрози."
 nf_event_hea.21.a:0 "Тоді вчіться у нас, поки ми торгуємо з вами."
 nf_event_hea.21.b:0 "Нам не потрібні ці американські селюки поруч."
 nf_event_hea.22.t:0 "[DLN.GetNameWithFlag] погоджується"
 nf_event_hea.22.d:0 "Лицарі вітатимуть наших Екземплярів як братів."
 nf_event_hea.22.a:0 "Є чому повчитися."
 nf_event_hea.23.t:0 "Підтримка Пари"
 nf_event_hea.23.d:0 "Прибули посланці від [HEA.GetNameWithFlag], сподіваючись встановити з нами відносини на основі нашої спільної християнської віри. Ми могли б навчити їх нашій програмі Дредноутів, хоча декого бентежать ці напрочуд феодальні культисти Пари. Один із наших радників, який колись належав до їхньої пастви, знає, що раніше вони не були такими розсудливими, коли він там жив."
 nf_event_hea.23.a:0 "Тоді вчіться у нас, поки ми торгуємо з вами."
 nf_event_hea.23.b:0 "Нам не потрібні ці американські селюки поруч."
 nf_event_hea.24.t:0 "[LOI.GetNameWithFlag] погоджується"
 nf_event_hea.24.d:0 "Вони погодилися поділитися своїми інженерними таємницями в обмін на нашу підтримку."
 nf_event_hea.24.a:0 "Ми справді любимо наших вірних інженерів."
 nf_event_hea.25.t:0 "Розгляд доказів"
 nf_event_hea.25.d:0 "Майкл зосередився на паперах на своєму столі. Допити, тортури, страти. Вони зробили все це і навіть більше, починаючи з віроломного Анклаву і закінчуючи Виродками Сталі. \n\nАле єдиною відповіддю, яку вдалося знайти, було те, що у них взагалі не було відповіді. Ніхто не брав на себе відповідальність за напад на Втрачену невинність. Жодних доказів не вдалося знайти ні на їхніх базах, ні в їхніх записах, ні навіть на їхніх останках. Багато Синів Небес загинуло, щоб завоювати ці місця, і багато з них перетворилися на попіл по всій Пустці Монтани. І все ж вони нічого не знали. \n\nСерце Майкла щеміло від думки про те, що ті, хто постраждав, ніколи не побачать справедливості. Ніколи не дізнаються напевно, хто чи що забрало в них їхніх близьких. Можливо, в усьому, що вони зробили, була лише одна втіха..."
 nf_event_hea.25.a:0 "...винні можуть бути серед багатьох мертвих."
 nf_event_hea.26.t:0 "Інші Діти Книги?"
 nf_event_hea.26.d:0 "Прибули посланці від [HEA.GetNameWithFlag], стверджуючи, що вони вірять у ГОСПОДА і... Пару? Оскільки для нас важливі вітри й шторми, для них, схоже, важливою є Пара. \n\nГрупа, відома як «Конклав», просить Сліпучий Град допомогти їм вбивати в ім'я ГОСПОДА. Щоб підсолодити угоду, вони запропонували свої вражаючі технології."
 nf_event_hea.26.a:0 "Можливо, Пара також підніме наші крила?"
 hea_stm_quote_tt:0 "§gПовітряні змії виходять набагато кращими, якщо їх спочатку зварити й обробити парою, оскільки це зміцнює тканину і позбавляє її зморшок!§!"
 nf_event_hea.26.b:0 "Вони нічого не знають про ГОСПОДА."
 nf_event_hea.27.t:0 "[STM.GetNameWithFlag] погоджується"
 nf_event_hea.27.d:0 "Вони допоможуть нам вбивати в ім'я ГОСПОДА."
 nf_event_hea.27.a:0 "Такі благочестиві душі..."
 nf_event_hea.28.t:0 "Істинне Слово Боже"
 nf_event_hea.28.d:0 "«Люди, почуйте мене!» — Єремія Рігдон промовляв до натовпу, що зібрався в Нью-Ханаані. Святий Майкл стояв поруч, а Сини Небес спостерігали. «Бог ще раз відкрив мені істину! Нас обдурили, всіх нас! Не від імені Бога говорив Джозеф Сміт, а від імені самого Сатани! Диявол обдурив і мене, і я плачу за шкоду, яку завдав вашим безсмертним душам!» Рігдон впав на коліна, на його обличчі з'явилися сльози. «Але для нас ще не все втрачено! Бог завжди може пробачити! Покладіться на Святого Майкла, покладіться на Святу Пару! Нам показали, що ми помилялися, і тепер настав час сповідатися в цьому перед Христом! Моліться зі мною! Моліться про прощення!» \n\nМайкл бачив, що громадяни зовсім не були переконані показухою Рігдона. Єдине, що стримувало їхні роздвоєні язики від вигукування єресей на адресу колишнього лідера, — це присутність Синів Небес. Він був упевнений, що багато хто з них розбіжиться, щоб плести інтриги й нарікати на своє приниження. \n\nАле це не мало значення. Якщо вони протистоятимуть Парі, вони помруть у ній. Бог обрав його саме для цього."
 nf_event_hea.28.a:0 "Мормонська єресь принижена так, як вона того заслуговує."
 nf_event_hea.29.t:0 "Наш ворог в іншому штаті"
 nf_event_hea.29.d:0 "Знову Ґідеон зіткнувся із закликами гарячих голів благословити місію проти ворога. Цього разу спалахнули спогади про місіонерів, відправлених на північ. Вони нарікали на білого привида, відомого як «Наглядачі», до якого вони хотіли, щоб Екземпляри вирушили з маршем і покарали його. \n\nҐідеон не був проти війни з вороже налаштованими супротивниками, але звіти свідчили, що Наглядачів більше немає в регіоні. Хай там як, вони, очевидно, залишили службу в мешканців Сховища 100 і вирушили шукати свою долю деінде. Для декого цього недостатньо. Звіти можуть помилятися, кажуть вони. Звідки нам знати напевно, кажуть вони. Але як ми можемо вести війну на основі підозр, думає Ґідеон. \n\nВін подумав про те, щоб зв'язатися з керівництвом Сховища 100, запевнивши їх, що старі образи забуто. Це не було б популярним кроком серед його вірян, але могло б породити думку про те, що конфлікт справді вичерпано, і це, можливо, збереглося б і в майбутньому."
 nf_event_hea.29.a:0 "Вони не наші вороги."
 nf_event_hea.29.b:0 "Голоси фанатиків такі гучні..."
 nf_event_hea.30.t:0 "Оливкова гілка від [HEA.GetNameWithFlag]"
 nf_event_hea.30.d:0 "Лідер [HEA.GetNameWithFlag], чоловік на ім'я Ґідеон, надіслав до нас посланців, які запевняють, що вони не бажають війни, незважаючи на чутки, які ми могли чути на півдні. Очевидно, деякі фанатики на їхній території все ще були злі через місіонерів, убитих Наглядачами багато років тому, і звинувачували нас за асоціацією. Ґідеон, однак, сповнений рішучості гарантувати, що подібної ескалації не станеться. Він розуміє, що нас не слід звинувачувати за гріхи Наглядачів."
 nf_event_hea.30.a:0 "Що ж, це добре."
 nf_event_hea.31.t:0 "[MUR.GetNameWithFlag] вимагає території [ANO.GetNameWithFlag]"
 nf_event_hea.31.d:0 "Наш новий союзник попросив нас передати йому територію їхнього розкольницького суперника."
 nf_event_hea.31.a:0 "Розумне прохання."
 nf_event_hea.31.b:0 "Тепер вона наша."
 nf_event_hea.32.t:0 "Що в імені твоєму?"
 nf_event_hea.32.d:0 "Понад століття ця спільнота мала назву Варта Небес. Це асоціюється з відверто мілітаристською нацією, яка прагне не пропускати ворожих загарбників та іншої подібної бравади. Дехто вважає, що це не відповідає тому напрямку, в якому Ґідеон планує вести цю країну. \n\nСам Ґідеон прихильно ставиться до цієї ідеї, але він також усвідомлює силу та ностальгію, яку несе в собі стара назва. Зміна її на догоду своїм ідеалам здається дещо егоїстичною, але це також могло б послужити для заспокоєння як власного народу, так і чужинців. Він вирішив помолитися про це..."
 nf_event_hea.32.a:0 "Варта Небес досі в наших серцях."
 nf_event_hea.32.b:0 "Серце Віри заспокоїть націю."

