l_english:
  nf_event_hea.1.t:0 "Спадщина Святого Писання"
  nf_event_hea.1.d:0 "Жителі Небесної Брами завжди слухали слово Боже, керовані пророками та вождями протягом своєї довгої історії. Проповідники приходили й ішли, несучи Добру Звістку знедоленим душам. Багато віршів мали велику вагу для нас, але жоден не мав більшого значення, ніж наступний."
  nf_event_hea.1.a:0 "До ефесян 6:11"
  nf_event_hea.1.b:0 "Ісая 1:19"

  nf_event_hea.2.t:0 "Паломники Прибули"
  nf_event_hea.2.d:0 "Ті, хто вирушає в подорож до Небесної Брами, долають великі відстані, маючи в серці впевненість, що десь за обрієм існує останній справжній бастіон благочестя у цьому забутому та занепалому краї. Та коли вони прибувають, завжди постає питання: чи завершилось їхнє паломництво, чи ж тепер вони зобов’язані вести інших віруючих сюди? Що говорить про це Біблія?"
  nf_event_hea.2.a:0 "Буття 13:15"
  nf_event_hea.2.b:0 "Псалом 23:4"

  nf_event_hea.3.t:0 "Язичники Прибули"
  nf_event_hea.3.d:0 "Ті, хто не чує слова Божого, все одно можуть почути про Ворота — і все одно вирушити сюди. Споконвічне питання, як поводитися з такими язичницькими гостями, залишається актуальним. Одні вважають, що ми маємо захистити та прихистити ці загублені душі, інші ж вірять, що слід відкинути їх."
  nf_event_hea.3.a:0 "До коринтян 12:2"
  nf_event_hea.3.b:0 "Від Луки 12:30"

  nf_event_hea.4.t:0 "Втрачена Невинність"
  nf_event_hea.4.d:0 "Невинність — це лише невелике поселення на самому краю знаного нам світу, яке часто відвідують мандрівні язичники та племінні мешканці з північних диких земель. Вони приходять торгувати й обмінювати товари, а ми, у свою чергу, навчаємо їх про Бога. Та часто трапляються групи, що чинять опір нашій науці — старійшини та войовничі душі, які вважають наші слова образою своїм хибним переконанням. Напруження зростає, і наш підхід до язичників матиме вирішальне значення для того, що буде далі..."
  nf_event_hea.4.a:0 "Нехай Господь змилується!"

  nf_event_hea.5.t:0 "Пред’явити Ультиматум"
  nf_event_hea.5.d:0 "Анімiстичні племена Лонетрі здавна залишались незалежними на південь від нас, живучи на головних торгових шляхах до багатих земель нижче. Ми маємо виступити та витіснити їх, хоча б задля безпеки наших подорожей. Настав час, аби вони звернулися — ми принесемо їм спасіння і відкриємо наші південні торговельні шляхи."
  nf_event_hea.5.a:0 "Що ж вони скажуть?"

  nf_event_hea.50.t:0 "Ультиматум Хрестоносців"
  nf_event_hea.50.d:0 "Прибічники Єдиного Бога нарешті прийшли за нами — ми довго чекали цього дня. Як ми зустрінемо цей виклик? З гордістю воїна чи з мудрістю старця, який розуміє, що не зможе перемогти?"
  nf_event_hea.50.a:0 "Дух Воїна!"
  nf_event_hea.50.b:0 "Мудрість Старця!"

  nf_event_hea.6.t:0 "Брама Пропонує Оборонний Пакт"
  nf_event_hea.6.d:0 "Після відкриття посольства у нашій столиці, Небесна Брама зробила унікальну пропозицію — вступити з ними в оборонний пакт проти будь-якої можливої агресії. Попри те, що наразі угода виглядає як безумовна, Небесна Брама дала зрозуміти, що може статися, якщо ми відмовимося..."
  nf_event_hea.6.a:0 "Їхній захист нам не завадить"
  nf_event_hea.6.b:0 "Безпечніше буде деінде"

  nf_event_hea.60.t:0 "[MUR.GetName] Відмовляється!"
  nf_event_hea.60.d:0 "Незважаючи на нашу щедру пропозицію захисту, [MUR.GetName] вирішили, що безпечніше бути під іншим покровом. Єресь! Як ми відповімо на цю зневагу?"
  nf_event_hea.60.a:0 "Ми маємо інші способи 'захистити' їх"
  nf_event_hea.60.b:0 "Хай буде так"

  nf_event_hea.70.t:0 "[IRE.GetName] Відмовляється!"
  nf_event_hea.70.d:0 "Незважаючи на нашу щедру пропозицію захисту, [IRE.GetName] вирішили, що безпечніше бути під іншим покровом. Єресь! Як ми відповімо на цю зневагу?"

  # Дві опції навмисно не локалізовані

  nf_event_hea.8.t:0 "Релігійні Фанатики Розпочали Переворот!"
  nf_event_hea.8.d:0 "Після постійної роботи місіонерів з Небесної Брами значна частина нашого населення стала відданою релігійному екстремізму, що йде звідти. Тепер фанатичні прихильники віри намагаються захопити владу та підкорити нашу політику вірі Воріт. Чим завершиться цей переворот?"

  nf_event_hea.8.a:0 "The coup succeeds"
  nf_event_hea.8.b:0 "The coup is put down"

  nf_event_hea.80.t:0 "Наш Переворот Провалився в [From.GetName]!"
  nf_event_hea.80.d:0 "Після звернення населення [From.GetName] ми спробували здійснити переворот проти їхнього уряду, щоби підпорядкувати цю країну нашому вченню. Але переворот було ледь зупинено підрозділами армії, лояльними до чинної влади. Ми отримали тривожні повідомлення про те, що ці підрозділи влаштовують репресії проти наших віруючих. Очевидно, ми маємо втрутитись."
  nf_event_hea.80.a:0 "Сила така ж дієва, як і віра"

  nf_event_hea.81.t:0 "Переворот у [From.GetName] Вдався!"
  nf_event_hea.81.d:0 "Переворот, який ми організували проти невірного уряду в [From.GetName], виявився успішним. На чолі країни поставлено маріонетковий уряд, який слухатиме лише нас."
  nf_event_hea.81.a:0 "Вірні йдуть за нами"

  nf_event_hea.82.t:0 "[HEA.GetName] Розпочинає Захоплення [From.GetName]"
  nf_event_hea.82.d:0 "Релігійні фанатики з [HEA.GetName] здійснили переворот проти законного уряду [From.GetName], виправдовуючись захистом своїх вірян на чужій землі. Це стало кульмінацією тривалої місіонерської діяльності [HEA.GetName] у цьому регіоні."
  nf_event_hea.82.a:0 "Пильнуйте за місіонерами на нашій території..."

  nf_event_hea.83.t:0 "Наш Переворот Провалився в [From.From.GetName]!"
  nf_event_hea.83.d:0 "Після невдалих спроб звернення [From.From.GetName], значна частина населення розпочала переслідування наших місіонерів. Їх або вбили, або вигнали зі штату. Це серйозна поразка — тепер ми маємо знову звертати втрачені землі."
  nf_event_hea.83.a:0 "Справді жахливі новини."

  nf_event_hea.9.t:0 "Релігійні Фанатики Розпочали Переворот у [From.GetName]!"
  nf_event_hea.9.d:0 "Після наполегливих спроб звернути населення [From.GetName], керівництво Небесної Брами розпочало переворот проти уряду, аби підкорити цю маріонетку своїм настановам! Перші повідомлення вказують на успіх перевороту. Якщо ми хочемо повернути контроль над країною — треба готувати контрпереворот."
  nf_event_hea.9.a:0 "Нехай ідуть"
  nf_event_hea.9.b:0 "Розпочати контрпереворот"
  HEA_convertion_cw:0 "§RГромадянська війна§! спалахне між нашими прибічниками та прибічниками Небесної Брами!"

  nf_event_hea.90.t:0 "[From.GetName] Реагує на Наш Переворот у [From.From.GetName]"
  nf_event_hea.90.d:0 "[From.GetName] ніколи не схвалювали наш переворот у їхній маріонетковій державі. У відповідь на наше захоплення влади, вони розпочали власний переворот, аби повернути контроль. Однак, багато місцевих ополченців — вірних нам — змогли захистити столицю. Країна занурилась у криваву громадянську війну."
  nf_event_hea.90.a:0 "Об’єднаймо віру"
