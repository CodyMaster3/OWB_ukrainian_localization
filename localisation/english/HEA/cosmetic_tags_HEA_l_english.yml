 HEA_power_armor_equipment_2:0 "Броня Екземплярів"
 HEA_power_armor_equipment_2_short:0 "Броня Екземплярів"
 HEA_power_armor_equipment_2_desc:0 "Особлива броня, розроблена Орденом Екземплярів. Вона незграбна, груба і потребує безлічі труб для елементарного використання пари. Тим не менш, це краще, ніж взагалі лишитися без захисту."
 HEA_power_armor_equipment_3:0 "Вивищена броня"
 HEA_power_armor_equipment_3_short:0 "Вивищена броня"
 HEA_power_armor_equipment_3_desc:0 "Це перша спроба Ордену Екземплярів покращити власну розробку з використанням технологій, отриманих з Ядра. Вона краща в багатьох відношеннях, але далеко не повністю розкриває те, на що має бути здатна технологія Хмароходів."
 HEA_power_armor_equipment_3_light:0 "Прототип броні Хмароходів"
 HEA_power_armor_equipment_3_light_short:0 "Прототип броні Хмароходів"
 HEA_power_armor_equipment_3_light_desc:0 "Ця модель є спробою відтворити ранні напрацювання програми «Хмарохід». Вона має кращу маневреність порівняно з бронею Екземплярів, але для забезпечення її працездатності довелося піти на багато компромісів. З часом ми зможемо зробити краще."
 HEA_power_armor_equipment_4:0 "Броня Хмароходів"
 HEA_power_armor_equipment_4_short:0 "Броня Хмароходів"
 HEA_power_armor_equipment_4_desc:0 "Це повністю реалізована версія серії «Хмарохід». Хоча нам все ще довелося додати кілька грубих пристосувань, щоб вона функціонувала належним чином, вона відповідає стандартам і специфікаціям, на які розраховували стародавні інженери."
 HEA_power_armor_equipment_5:0 "Хрестоносна броня Хмароходів"
 HEA_power_armor_equipment_5_short:0 "Хрестоносна броня Хмароходів"
 HEA_power_armor_equipment_5_desc:0 "Це злиття нереалізованих довоєнних ідей та досвіду Ордену Екземплярів. Хрестоносна броня приведе нас до перемоги як над язичниками, так і над єретиками!"