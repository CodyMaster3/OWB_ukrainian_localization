l_english:
# decisions
 hea_conclave:0 "£hea_conclave_texticon  §PЦерковний Конклав Пари§!  £hea_conclave_texticon_1"
 hea_conclave_desc:0 " "
 hea_conversion:0 "Навернення невірних"
 hea_conversion_desc:0 "Люди навколо нас неосвічені в очах Господа. Ми маємо відправити наших місіонерів, щоб навернути цих грішників там, де вони живуть, і поступово наш вплив та вплив Господа буде ширитися."
 hea_slow_conversion:0 "Місія з навернення до [From.GetNameDef]"
 hea_conclave_sermons:0 "Проведення проповідей Конклаву"
 hea_conclave_sermons_desc:0 "Конклав завжди надавав перевагу залишатися в тіні, оскільки це забезпечує їм безпеку, а масам — невігластво. Однак, якби ми почали проводити спільні проповіді, це могло б зміцнити віру у Варту серед багатьох 'громадян' і допомогти вгамувати запал Майкла."
 hea_public_baptisms:0 "Дозволити публічні хрещення"
 hea_public_baptisms_desc:0 "Хрещення Парою — це не лише обряд ініціації, а й ознака досконалості. Ті, хто прийняв хрещення, отримали підтвердження, що вони справді є Обраними Богом, і в ці скрутні часи це означає більше, ніж будь-що інше. Зробімо з цієї колись приватної церемонії публічне видовище. Це, безсумнівно, заохотить інших шукати нашого схвалення та здобуде їхню лояльність."
 hea_conclave_charity:0 "Віддячити Варті"
 hea_conclave_charity_desc:0 "Ніщо не свідчить про нашу турботу краще, ніж кілька іграшок і додатковий пайок. Допомагаючи громаді, ми лише зміцнюємо свій авторитет."
 hea_steam_worship:0 "Заохочення поклонінню Парі"
 hea_steam_worship_desc:0 "Пара — це не просто священний дар, а й інструмент, який треба використовувати. Хоча загальновідомо, що він застосовується в нашому обладнанні, він також є інструментом контролю. Просуваючи ідею, що Пара контролюється нами, ми зможемо вирвати цей символ із рук Майкла."
 hea_empower_conclave:0 "Розширення повноважень Конклаву"
 hea_empower_conclave_desc:0 "Варта Небес — це нація, яка потребує Конклаву. Без нас не було б ні нагляду, ні регулювання, ні порядку. Хоча наша рука й зісковзнула з керма, здебільшого ми повернули собі контроль. Настав час раз і назавжди покласти край цьому фарсу і повернути собі владу!"
 hea_ban_gatherings:0 "Заборонити публічні зібрання"
 hea_ban_gatherings_desc:0 "Цей зухвалий Майкл почав подорожувати Вартою, поширюючи брехню про те, що він посланий Богом. Що справді турбує, так це величезні натовпи, які йому вдається збирати. Якби ми заборонили такі зібрання, це могло б віднадити багатьох від їх відвідування, хоча не всі були б цим задоволені."
 hea_increase_work:0 "Збільшити кількість робочих змін"
 hea_increase_work_desc:0 "Збільшивши обсяг роботи, яку кожен селянин повинен виконувати за день, ми зможемо відвернути увагу від Майкла і повернути її туди, де вона має бути: на служіння Варті."
 hea_proclaim_michael_heretic:0 "Оголосити Святого Майкла єретиком"
 hea_proclaim_michael_heretic_desc:0 "З фальшивим 'Святим' Майклом треба розібратися. Зі зростанням його популярності зростає і наше занепокоєння. Ми повинні оголосити його Єретиком Пари — тим, хто йде проти волі Божої. Сподіваємось, це стане правильним сигналом."
 hea_execute_michael:0 "§RСтратити Святого Майкла§!"
 hea_execute_michael_desc:0 "Коли більша частина його підтримки була знищена, ми взяли Майкла під варту. Він стане прикладом для всіх, хто наважиться кинути виклик Конклаву."

 hea_upgrade_nucleus:0 "Почати ремонт Ядра"
 hea_upgrade_nucleus_desc:0 "Ремонт Ядра буде повільним і болісним і ставатиме лише складнішим у міру того, як від підтримання необхідних систем ми переходитимемо до відновлення складних довоєнних технологій."
 hea_nucleus_cost_increase_tt:0 "§RВартість ремонту §YЯдра§! зросте!§!"
 hea_nucleus_fully_repaired_tt:0 "Ми відремонтували Ядро до §Gповної робочої готовності.§!"
 hea_nucleus_fully_repaired_tt_NOT:0 "Ми §Rще не§! відремонтували Ядро до §Gповної робочої готовності.§!"
 hea_exploit_nucleus:0 "Перевантажити парові генератори"
 hea_exploit_nucleus_desc:0 "Ми можемо перевести Ядро в режим форсування для тимчасового збільшення виробітку. Однак такий крок наражатиме інженерів на небезпеку. Відомо, що при перевантаженні парових генераторів трапляються аварії."
 hea_gideon_education_nucleus:0 "Програма учнівства Ядра"
 hea_gideon_education_nucleus_desc:0 "Аби краще інтегрувати інженерів у суспільство, Ґідеон розглянув можливість організувати для членів громади стажування в них, як тимчасове, так і постійне. Таким чином вони зможуть передати свої навички населенню, і ми всі зможемо чогось із цього навчитися."
 hea_michael_inspiration_nucleus:0 "Ритуал благословення Ядра"
 hea_michael_inspiration_nucleus_desc:0 "Ми можемо організувати велике благословення для наших армій, запросивши солдатів освятити свою зброю Парою. Святий Майкл сподівається, що це надихне їх продовжувати боротьбу в ім'я Бога та Пари!"
 hea_conclave_exemplar_nucleus:0 "Провести випробування Екземплярів"
 hea_conclave_exemplar_nucleus_desc:0 "Екземпляри бажають провести випробування всередині Ядра. Це буде схоже на військові навчання, де потенційні Екземпляри та інші пройдуть бойову підготовку. Дехто може довести, що гідний приєднатися до ордену, але незалежно від цього ми багато чого навчимося."
 hea_nucleus_arms_factories:0 "Мануфактура парових ядер"
 hea_nucleus_arms_factories_desc:0 "Ми відновили доступ до спеціалізованого комплексу для створення, збірки та обслуговування парових ядер. Трохи зусиль, і він знову почне допомагати нам забезпечувати армію."
 hea_at_least_25_nucleus_tt:0 "Ядро має бути робочим щонайменше на §c25%§!"
 hea_nucleus_civ_factories:0 "Допоміжні інженерні системи"
 hea_nucleus_civ_factories_desc:0 "Серед пошкоджених об'єктів є один, призначений для допомоги персоналу Ядра у виконанні інших завдань. У ньому містяться машини, які допомагають ремонтувати та обслуговувати інше обладнання, а також виправляти структурні дефекти в приміщенні. Його відновлення стане великою підмогою."
 hea_nucleus_improve_weapons:0 "Відновлення даних про покращену зброю"
 hea_nucleus_improve_weapons_desc:0 "Ядро працювало над покращенням потужності зброї на парових ядрах, яку вони тут розробили. Дані були загублені в надрах комплексу, але ми впевнені, що їх можна відновити після того, як ми відремонтуємо тут деякі електричні системи."
 hea_research_slot_nucleus:0 "Відновлення дослідницької лабораторії"
 hea_research_slot_nucleus_desc:0 "Колись у Ядрі розташовувалися значні дослідницькі потужності. З їх відновленням і благословенням Пари Гільдія інженерів зможе інвестувати в більш підхоже приміщення для експериментальних технологій."  
 hea_nucleus:0 "Керування та контроль Ядра"
 hea_nucleus_desc:0 "§YПоточний стан Ядра:§! [HEA_nucleus_status]"
 nucleus_systems_critical:0 "§RКритичний стан систем§!"
 nucleus_quarter_capacity:0 "§c25% робочої потужності§!"
 nucleus_half_capacity:0 "§O50% робочої потужності§!"
 nucleus_threequarters_capacity:0 "§G75% робочої потужності§!"
 nucleus_fully_operational:0 "§GПовністю робоче§!"

 # tooltips
 hea_converted_state_tt:0 "Штат буде навернено"
 hea_not_converted_state_tt:0 "Ми не навернули жодного їхнього штату"
 hea_convert_state_tt:0 "Ми навернули деякі або всі їхні штати."
 hea_bind_to_us_attempt_tt:0 "Ми спробуємо прив'язати їхній штат до нашого!"
 binding_someone:0 "Ще нікого не прив'язано до нас."
 binding_warning_tt:0 "Що більше штатів цілі ми навернули, то вищі наші шанси на успіх. Але майте на увазі: невдача зведе нанівець нашу роботу з навернення в кількох штатах!"
 impassable_states_dont_matter:0 "§RПримітка: Непрохідні штати не беруться до уваги при наверненні.§!"
