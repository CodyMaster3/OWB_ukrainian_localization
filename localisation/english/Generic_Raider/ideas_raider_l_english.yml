l_english:
  preparing_for_total_war1:0 "Підготовка до тотальної війни"
  preparing_for_total_war1_desc:0 "Ми значно знизили стандарти для тих, кого приймаємо до наших лав. Більшість із них буде просто гарматним м'ясом, але гей, це менше ротів, які треба годувати."

  draconian_recovery_methods1:0 "Драконівські методи відновлення"
  draconian_recovery_methods_desc1:0 ""

  critical_thinking1:0 "Критичне мислення"
  critical_thinking1_desc:0 "Розумники продовжують прикривати свої... дупи. Щоразу, коли ви ловите їх на брехні, вони викручуються з цього, як ті хробаки. Вони щось задумують."

  master_plan1:0 "Генеральний план"
  master_plan1_desc:0 "Увесь цей час розумники плели інтриги, щоб знищити керівництво банди і поставити себе на саму верхівку. І це спрацювало!"

  iron_grip1:0 "Залізна хватка"
  iron_grip1_desc:0 "Бос знову утвердив свою владу. І молодець! Ніхто б не хотів, щоб нами керував хтось інший, крім нього. Принаймні, так бос наказав їм говорити."

  territorial_reinforcement1:0 "Територіальне підкріплення"
  territorial_reinforcement_desc1:0 ""

  territoriality_idea:0 "Територіальна лояльність"
  territoriality_idea_desc:0 "Поєднання залежності від способу життя, залежності від хімії та страху перед тим, що з ними зроблять справжні нації та ворожі банди в разі дезертирства, зробило наших солдатів надзвичайно лояльними."

  slave_labour1:0 "Рабська праця"
  slave_labour1_desc:0 "Якщо ти був настільки слабким, що потрапив у полон, цілком справедливо, що ти зробиш себе сильнішим через виснажливу працю."

  forced_labour1:0 "Примусова праця"
  forced_labour1_desc:0 "Якщо ти був настільки слабким, що потрапив у полон, цілком справедливо, що ти зробиш себе сильнішим через виснажливу працю."

  slave_researchers1:0 "Раби-дослідники"
  slave_researchers1_desc:0 "Виявляється, деякі з наших рабів схильні до науки. Ми перевели їх до наших лабораторій — буде непогано мати інженерів, які вміють робити щось, окрім «Гвинту» та бомб."

  slaver_settlement1:0 "Поселення рабів"
  slaver_settlement_desc1:0 ""

  raider_we_never_die:0 "Ми ніколи не помремо!"
  raider_we_never_die_desc:0 "Банда ще не вимерла, тож немає жодних доказів, що це станеться в майбутньому!"

  raider_new_age_weaponry:0 "Зброя нової ери"
  raider_new_age_weaponry_desc:0 "Якщо ми й навчилися чогось у пустках, так це того, що якщо є проблема, її рішення — «більше зброї»."

  raider_sadists:0 "Садисти"
  raider_sadists_desc:0 "Наші нові володарі захопили владу так, як і належить справжнім рейдерам — швидко та жорстоко."

  raider_eggheads:0 "Яйцеголові"
  raider_eggheads_desc:0 "Яйцеголові (або, як я люблю їх називати, розумники) почали розпускати чутки про інших членів банди. Дивно, але вони єдині, про кого чуток немає."

  raider_grunts:0 "Рядові"
  raider_grunts_desc:0 "В одній старій книзі рядовий, який справді вмів читати, дізнався, що пірати керували своїми кораблями як демократіями. Чому ми не можемо так само?"

  raider_boss:0 "Бос"
  raider_boss_desc:0 "Бос — наш абсолютний лідер. Останнє слово за ним. Він вирішує, на кого ми нападаємо і коли, а ми слухаємо. А інакше..."

  raider_terminals_for_all:0 "Термінали для всіх"
  raider_terminals_for_all_desc:0 "Виявляється, ці штуки можна використовувати для науки? А я на них грав тільки в «Червону Загрозу»."

  raider_raider_computer_logs:0 "Комп'ютерні журнали"
  raider_raider_computer_logs_desc:0 "Окрім того, що ми просто знатимемо, де наші рейди пішли не так, ведення журналів наших подвигів допоможе нагадати нам, наскільки ми круті. Не те щоб нам це було потрібно, але добре мати."

  raider_shitty_robots:0 "Лайняні роботи"
  raider_shitty_robots_desc:0 "Роботи ж можуть носити зброю, так?"

  raider_power_armour_familiarity:0 "Знайомство з силовою бронею"
  raider_power_armour_familiarity_desc:0 "Тепер ми такі ж могутні, як ті виродки з Братства! І всі їх бояться, отже, боятимуться й нас!"

  raider_prove_yourself:0 "Доведи себе"
  raider_prove_yourself_desc:0 "Якщо люди, які в минулому проводили успішні рейди, керуватимуть новими рейдами, це означатиме, що ці рейди з більшою ймовірністю будуть успішними. Це математика, придурку!"

  raider_lightning_raids:0 "Блискавичні рейди"
  raider_lightning_raids_desc:0 "Ми заходимо. Робимо так, щоб усі знали, що ми там були. Ми виходимо."

  raider_brutal_hazing:0 "Жорстоке посвячення"
  raider_brutal_hazing_desc:0 "Кілька раундів для новачків на арені покажуть нам, хто готовий до бою, а хто ні. Хто виживе? Готовий. В іншому випадку? Ні."

  raider_engineers:0 "Інженери"
  raider_engineers_desc:0 "«Інженер» у цьому контексті означає «експерт-підривник»."

  raider_custom_rides:0 "Кастомні тачки"
  raider_custom_rides_desc:0 "Більшість тих, хто використовує моторизовані транспортні засоби, просто намагаються відремонтувати їх до того стану, в якому вони були до війни. Але не ми. Ми прокачуємо наші тачки!"

  raider_metal_boxes:0 "Металеві коробки"
  raider_metal_boxes_desc:0 "У них є гусениці? Ні. Чи будемо ми називати їх танками? Так. Звучить набагато крутіше, ніж «БТР», хоч би що це означало."

  raider_roaring_machines:0 "Ревучі машини"
  raider_roaring_machines_desc:0 "Тепер ми справжні воїни доріг."

  raider_gender_equality:0 "Жінки-рейдери"
  raider_gender_equality_desc:0 "Життя в пустці робить жорстким кожного. Немає сенсу дискримінувати, коли ми можемо легко подвоїти нашу живу силу. Або, мабуть, у цьому випадку, людську силу."

  raider_recruit_them_young:0 "Вербуй їх молодими"
  raider_recruit_them_young_desc:0 "Вербування дітей до наших лав має приховану перевагу: люди менш охоче стріляють у них, навіть коли дитина забирає все, що вони мають."

  raider_gearhead_slaves:0 "Раби-механіки"
  raider_gearhead_slaves_desc:0 "Механіків знайти важко, тому, коли ми знаходимо такого, ми робимо розсудливу річ і змушуємо його працювати на нас під загрозою каліцтва."

  raider_doped_soldiers:0 "Накачані солдати"
  raider_doped_soldiers_desc:0 "Ще до війни солдати були наркоманами. Психо спеціально створювали для підвищення бойових можливостей людини. У нас немає Психо, тому Гвинт теж згодиться."

  raider_manifest_destiny:0 "Явне призначення"
  raider_manifest_destiny_desc:0 "Ми збираємося забрати те, що по праву належить нам! Крім того, якщо вони не можуть захистити свою землю, вони на неї не заслуговують."

  raider_take_what_you_need:0 "Бери те, що тобі треба"
  raider_take_what_you_need_desc:0 "Ми в цій справі вже давно. Ми непогано вміємо оцінювати потенційні цілі та вирішувати, варті вони клопоту чи ні. І коли ми вирішуємо, що воно того варте, ми ще краще вміємо завдавати нищівного удару."

  raider_dont_question_the_boss:0 "Не став під сумнів рішення боса"
  raider_dont_question_the_boss_desc:0 "Бос завжди робив нам добро, і цілком справедливо, що ми відповідаємо йому тим самим. А коли він не робив нам добра, це була не його вина. А якщо й його, то ми на це заслужили."

  raider_everyone_works:0 "Працюють усі"
  raider_everyone_works_desc:0 "Якщо ця «демократія» має запрацювати, кожен повинен докласти зусиль. Бійці, яйцеголові, рахівники кришок, раби. Особливо раби."

  raider_nation:0 "Рейдерська нація"
  raider_nation_desc:0 "Ми живемо за простим правилом: те, що твоє — моє, і те, що моє — також моє."

  raider_idea_slaves:0 "Виродки-работорговці"
  raider_idea_slaves_desc:0 "Ми сприймаємо термін «людські ресурси» дуже буквально."

  raider_idea_conflict:0 "Жорстокі виродки"
  raider_idea_conflict_desc:0 "Наші методи можуть бути не надто приємними, але вони надзвичайно ефективні."

  raider_idea_respect:0 "Злі виродки"
  raider_idea_respect_desc:0 "Зараз ми, можливо, й дрібні шахраї, але з часом усі почнуть поважати й боятися нас."

  idea_old_world_criminals:0 "Злочинці Старого світу"
  idea_old_world_criminals_desc:0 "Історія банди тягнеться ще з довоєнних часів, коли злочинці мали стиль. Засновники передали нам свої методи, навчивши нас, як вони проводили свої операції, коли їм доводилося турбуватися про те, що довга рука закону може дістати їх у будь-яку хвилину."

  idea_former_tribal:0 "Колишні дикуни"
  idea_former_tribal_desc:0 "Наші старі кочівницькі звичаї навчили нас пересуватися швидко та ефективно, але замість того, щоб рухатися туди, де найбільш родюча земля, ми тепер рухаємося туди, де найбільші цілі."

  idea_vault_dwellers_gone_bad:0 "Мешканці Сховища"
  idea_vault_dwellers_gone_bad_desc:0 "Можливо, це був експеримент Сховища, можливо, це просто в нашій природі, або, можливо, це була просто нудьга, але навіть після того, як ми все життя прожили в розкоші Сховища, нам захотілося більшого."

  idea_drug_runner_gang:0 "Наркокур'єри"
  idea_drug_runner_gang_desc:0 "Торгівля наркотиками була найприбутковішим кримінальним бізнесом до війни. Те ж саме залишається правдою і зараз, за винятком того, що тепер ідеться не стільки про те, щоб провезти хімію повз владу, скільки про те, щоб дістати її в першу чергу."

  raider_raid_workshops:0 "Рейди на майстерні"
  raider_raid_workshops_desc:0 "Ми саме ті, через кого поселення потребують допомоги."

  raider_road_hogs:0 "Дорожні кабани"
  raider_road_hogs_desc:0 "Оскільки дороги патрулюють як рейдери, так і монстри, лише найсильніші можуть претендувати на них. І ми є найсильнішими."