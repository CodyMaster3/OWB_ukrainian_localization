bra_three_rivers_choke_1:0 "Обмежені Ринки"
bra_three_rivers_choke_1_desc:0 "Війна Першої Коаліції завершилась умовною капітуляцією Манітоби та створенням демілітаризованої зони з Республікою Трьох Рік, що призвело до втрати значної частини територій — зокрема доступу до Уінніпеґа та південних торгових річок.\n\nПозбавлене важливих ринків і партнерів, Королівство відчайдушно шукає шлях прорвати блокаду або знайти нові ринки."

