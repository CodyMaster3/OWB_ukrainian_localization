bra_gunn_cat:0 "Кіт Ґанна"
bra_gunn_cat_desc:0 "Поки §RКороль Ґанн II§! керує королівством на межі занепаду, він знаходить безцінні моменти спокою зі своїм улюбленим котом — §YКукі§!. Його муркотіння та грайливість стали справжнім порятунком для змученого розуму короля. У тиші цих миттєвостей Ґанн пригадує: §2кращий світ усе ще можливий.§!"

