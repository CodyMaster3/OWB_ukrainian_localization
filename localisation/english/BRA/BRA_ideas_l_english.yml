bra_idea_rock_ridge:0 "Поразка під Стоунволлом"
bra_idea_rock_ridge_desc:0 "Смерть короля Брендона XI в битві під Стоунволлом остаточно підірвала віру багатьох у монархію. Хоч Манітоба й пережила війну, тільки час покаже, чи зможе вона коли-небудь оговтатись."

