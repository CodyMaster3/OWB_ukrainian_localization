# Блокада
bra_three_rivers_choke_5:0 "Економічна Блокада"
bra_three_rivers_choke_5_desc:0 "Війна Першої Коаліції завершилась умовною капітуляцією Манітоби та створенням демілітаризованої зони між нею й Республікою Трьох Рік. Королівство втратило значну частину територій і — що гірше — доступ до Уінніпеґа та південних річкових маршрутів.\n\nВідрізана від ринків і партнерів, Манітоба відчайдушно шукає спосіб прорвати блокаду або знайти нові торгові шляхи."

