bra_ancestor_cults:0 "Культи Предків"
bra_ancestor_cults_desc:0 "На відміну від більшості монархій, спадщина попереднього правителя не переходить повністю до спадкоємця. Її контролюють окремі родини, які мусять витрачати її на благо пам’яті покійного.\n\nУ теорії це має сприяти стабільності держави, але на практиці — значна частина багатства застрягла в руках кількох родів, які дбають лише про власний статус на шкоду Королівству."

