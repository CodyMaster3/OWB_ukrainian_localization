bra_queen_eleanor:0 "Королева Катерина"
bra_queen_eleanor_desc:0 "У багатьох аспектах — повна протилежність королю. Граційна королева Катерина за роки проявила щиру прихильність до стародавнього гуля. Її добра натура сприяла запуску численних програм на благо простого люду, завоювавши її любов народу. Хоч король Ґанн часто тримає дистанцію в публічному просторі, він охоче фінансує її, часто витратні, ініціативи."

