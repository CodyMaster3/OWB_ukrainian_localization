l_english:
nf_bra.0.title:0 "Темні Віки"
nf_bra.0.desc:0 "Задовго до часів королів і республік, у радіоактивній зимі Великої Війни, коли кратери ще палали атомним полум’ям, були люди Манітоби. Ці люди, зламані американським вторгненням і приголомшені самою смертю світу, втратили все. А коли втрачаєш усе — починаєш брати чуже. Сила червоних бійців Канадського Народного Фронту, яка колись панувала в провінції, швидко згасла під натиском відчайдушних і смертельно небезпечних місцевих, що змусили їх відступити на захід. Саме тоді почалася епоха Темряви.\n\nМанітоба занурилася в десятиліття насильства. Там, де колись були сусіди — постали ворожі банди, які без кінця боролися за виживання. Ті, хто не мав волі чи був занадто слабкий, став жертвою сильніших ватажків. П’ятдесят років земля залишалась розділеною, аж поки одного дня один з ватажків не заявив про своє право. Людина на ім’я Ґанн, яка відвоювала Уінніпеґ у залишків Червоної Загрози, зробила те, чого не вдалося ні комуністам, ні рейдерам із часів Великої Війни.\n\nЗі свого трону Ґанн почав розширювати володіння не мечем, а словом. Першими скорилися володарі Брендону, за що отримали честь стати герцогами. З того часу Ватажок Брендону став спадкоємцем Короля Манітоби. Багато хто приєднався до нової держави, здобувши дворянство у вигляді герцогств і зміцнюючи Королівство. Найбільше ж король прихильно ставився до..."
nf_bra.0.a:0 "...промислової могутності Брендону."
nf_bra.0.b:0 "...військової доблесті Ланґенбурґа."
nf_bra.0.c:0 "...торговельної винахідливості Уінніпеґа."

nf_bra.1.title:0 "Королівство на злеті та Епоха Занепаду"
nf_bra.1.desc:0 "Так почалась Епоха Королівства. Король Ґанн розширював свої володіння впродовж багатьох років, аж поки не зник у крижаних пустках, залишивши трон спадкоємцю. Минуло багато десятиліть, протягом яких різні королі з роду Брендону правили державою — деякі були могутні й шляхетні, як Брендон IV, а деякі слабкі й ганебні, як Безумний Брендон V. Саме в цю добу Королівство досягло найбільшого розквіту — від герцогства Ланґенбурґ до Королівських земель і герцогства Анже. Королівство було сильне, горде й гідне поваги. У Манітобі панував добробут.\n\nАле це тривало недовго. Зі завершенням Епохи Королівства настала Епоха Занепаду. Королі стали слабкими й самозадоволеними, знать — підступною й корисливою. Селяни неодноразово піднімали бунти. Жорстокі монархи, як-от Брендон VI, правили коротко, залишаючи по собі лише кров і смуту. Незважаючи на всі знаки, Королівство було сліпе до кризи, що визрівала під ногами, надто зайняте балачками про моду й плануванням королівських бенкетів. Аж поки бульбашка не луснула.\n\nВійна Першої Республіканської Коаліції поклала край Епосі Занепаду й започаткувала нинішню добу. Повстала Республіка Трьох Річок і Конгрес Метисів рушили проти Королівства, аби знищити все, що йому було дороге. У найгірший момент марнославства останній король із роду Ґанна, Брендон VIII, особисто вийшов у бій проти республіканців під Стоунволлом — і був розгромлений. Якби не дії графа Йорктона з Ланґенбурґа, який знищив армію Метисів, багато хто вірить, що Королівство впало б. Після поспішного миру сотні втікачів тікали від Республіканської навали, несучи із собою..."
nf_bra.1.a:0 "...свої багатства."
nf_bra.1.b:0 "...свою зброю."
nf_bra.1.c:0 "...спрагу помсти."

nf_bra.2.title:0 "Епоха Розділу"
nf_bra.2.desc:0 "Зі смертю короля Брендона IX, що не залишив спадкоємця, династія Брендону була знищена. Королівство зберігало владу завдяки терміново скликаній Регентській Раді, але монархія без монарха втратила свою легітимність. У відчаї шукаючи нового провідника, рада обрала того, хто міг вивести державу з приниження.\n\nТак був обраний Ґанн II. Тихий, методичний, але радикальний у поглядах, він разюче відрізнявся від зухвалих і гучних Брендонів. Чимало еліти Манітоби зневажали його, включно з Левом Ланґенбурґа — Лейфом Йорктоном. Ходили чутки, що Ґанн не здатен керувати, що його обрали лише як маріонетку для знаті. Ззовні вороги Королівства стежили, відчуваючи кров у воді. Та найбільша загроза для Ґанна — це він сам. Його розум щодня згасає, час невпинно точить його розсудок.\n\nПопри все це, він не зупиняється. Готується до буремних часів попереду. І вже почав втілювати радикальні зміни в Королівстві, найважливішою з яких стало..."
nf_bra.2.a:0 "...відновлення економіки, бо без грошей жодне Королівство не встоїть."
nf_bra.2.b:0 "...реформування армії, бо вороги Манітоби знову вишкірюють ікла."
nf_bra.2.c:0 "...розвиток науки, бо знання — це шлях до відродження."

nf_bra.3.title:0 "Безсмертний, що помирає"
nf_bra.3.desc:0 "Король Ґанн II відчував свій вік. Не фізично — старий гуль уже століттями звик до болю, що супроводжував його стан, — а в занепаді власного розуму. Колись він боявся снів, у яких його переслідували привиди помилок і невдач Манітоби. Тепер же він найбільше бажав повернути ті сни. Усе, навіть постійна мука його безупинної свідомості, було кращим за чорну пустку, що нині приходила з ночами. Здавалося, що він потопає в смоляній безодні щоразу, коли заплющує очі.\n\nУперше це сталося ще до того, як він став Ґанном II. Він намагався кричати, трусив безсиле тіло, прагнучи прокинутися — але все марно. Він просто... існував і не існував, поки темрява поглинала його. Прокинувся вранці в розкішній кімнаті палацу, знищеній дощенту — дорогі тканини валялися на підлозі. Він чув легенди про гулів, що з часом втрачали розум і ставали дикими чудовиськами, які нишпорять пустками в пошуках плоті, наче вона могла повернути їм втрачене людство. Але він ніколи не думав, що всі вони колись могли бути такими, як він.\n\nВідтоді Ґанн II заборонив усім — навіть дружині, королеві Кетрін — входити до його особистих покоїв. Сторожам було наказано тримати важкі дубові двері зачиненими за будь-яких обставин. Лише один радник знав правду — Вільям Таннер. Якщо дійде до найгіршого, Ґанн наказав Таннеру захистити інших — навіть ціною його власного життя. Але навіть ці запобіжні заходи не могли вгамувати страх і тривогу в серці короля, що одного дня він більше не прокинеться з темряви."
nf_bra.3.a:0 "Memento mori."

nf_bra.4.title:0 "Ніч, яку пам’ятатимуть"
nf_bra.4.desc:0 "Бал став головною подією року, і королева знову показала себе як вишукана господиня. Проте сяючий палац і розкішні прикраси не змогли приховати підозрілу відсутність її чоловіка. Та бал тривав, навіть коли чутки про хворобу короля почали ширитись поміж гостей. І аж поки не відбулась головна подія вечора, яка перевершила і витончену їжу, і чудову музику — завжди захопливий конфлікт між Гірським Лицарем-Качкарем і групою манітобської знаті.\n\nНе секрет, що вони ладнали, мов олія з водою. Та відсутність короля і надмір алкоголю перетворили їхню суперечку на майже справжню бійку. На радість усім (окрім королеви), сторони перейшли від завуальованих образ до прямих погроз і відкритих закликів до насильства. Сумнівів не було — знать мала мало шансів проти м'язистого Монті, гартованого роками важкої праці.\n\nПерші ставки вже були зроблені, коли несподівана поява короля повністю змінила ситуацію. Його холодний погляд миттєво оцінив загрозу, і він суворо наказав усім припинити. Публічна догана знаті, мов учитель сварить учнів, викликала неабияке задоволення серед гостей, які раділи побачити, як їхні «вищі» нарешті отримали на горіхи. Завершивши промову, Ґанн II повернувся до дружини, вибачившись перед присутніми за запізнення, не пояснивши, чим саме воно було викликане."
nf_bra.4.a:0 "За здоров’я!"

nf_bra.5.title:0 "Пес Короля"
nf_bra.5.desc:0 "Вільям Таннер — живе підтвердження того, що за монархії принципи заслуг не лише можливі, а й процвітають. Хоча його вперше взяли на службу через вміння поводитися з тваринами, він швидко піднявся з простого Звіролюба та Лицаря-Качкаря до голови Монтії та довіреного радника в питаннях королівського звіринця.\n\nТа справжня слава Таннера не в його таланті — а в його самовідданості захищати простих жителів Манітоби. Його героїчні дії під час Першої Війни Республіканської Коаліції врятували незліченні життя й, за словами багатьох, саме Королівство. Якби не його рішення розмістити Монтію в прикордонних територіях, які знать вважала неважливими, десант Республіки Трьох Річок у Горах Райдінг лишився б непоміченим. Таннерова рішучість надихнула його недоукомплектовану армію на оборону ферм та інфраструктури від ворожої армії, яка прагнула відрізати королівські сили в Порто-Прері та ударити з тилу на столицю Брендон.\n\nПісля поразки Королівства й провалу лицарських орденів знать вирішила розпустити їх — і Ґанн II це схвалив, замінивши їх Монтією. Відтоді Монтія вірно охороняє всіх підданих Манітоби, здобувши неофіційну назву — «Народна Монтія»."
nf_bra.5.a:0 "Де б ми були без нього?"
nf_bra.5.a.tt:0 "Призначає §YВільяма Таннера§! до §YВійськового командування§! Королівства."

nf_bra.10.title:0 "Шанс на Грабунок"
nf_bra.10.desc:0 "Так зване Королівство Манітоба зробило нам пропозицію: земля, раби й здобич — у рівній мірі. Все, що від нас вимагається — ударити по беззахисному Конгресу Метисів, коли той неминуче вступить у війну з силами Короля.\n\nЗвісно, ніхто не говорить про жоден довгостроковий союз — вони відчувають до нас відразу, і ми платимо тим самим. Але пропозиція варта уваги, адже вона обіцяє чималу короткочасну вигоду."
nf_bra.10.a:0 "Реджайна буде нашою!"
nf_bra.10.b:0 "Ми не слухаємо ніяких «королів»."

nf_bra.11.title:0 "[UNB.GetNameDefCap] погоджується"
nf_bra.11.desc:0 "[UNB.GetLeader] та [UNB.GetNameDef] виявилися занадто жадібними до здобичі, щоб оминути нашу війну. Вони прийняли угоду, і їхні саморобні літаки вже готові нести хаос над небом Метисів. Найбільш цинічні серед нас могли б сказати, що ці клептократи ідеально вписуються в наш уряд, але насправді [BRA.GetLeader] не має жодного інтересу в розширенні того, що він вважає егоїстичною й ненадійною аристократією.\n\nНаразі вони допоможуть нам переламати хід повітряної війни, в якій ми поки що програємо через перевагу [WPG.GetAdjective] дирижаблів."
nf_bra.11.a:0 "Прекрасно."

nf_bra.12.title:0 "[UNB.GetNameDefCap] відмовляється"
nf_bra.12.desc:0 "Клептократи з [UNB.GetName] відкинули нашу взаємовигідну пропозицію виступити проти [MTC.GetNameDef]. Схоже, будь-яка угода, яка вимагає від них ділитися здобиччю, для них неприйнятна. Вони краще відмовляться від будь-якої нашої допомоги.\n\nМожливо, це навіть на краще — не доведеться працювати з розбійниками, які при першій же нагоді розкрали б наші власні склади. Проте без їхньої авіації боротися з дирижаблями Другої Коаліції буде складніше."
nf_bra.12.a:0 "Шкода."

nf_bra.13.title:0 "Наша Частина Угоди"
nf_bra.13.desc:0 "Наші люди вже не можуть дочекатися моменту, щоб перетнути кордон із [MTC.GetAdjective] і забрати все, що нам належить!\n\nЧас виконати нашу частину угоди з [BRA.GetNameDef] і вдарити по Реджайні!"
nf_bra.13.a:0 "У атаку!"

nf_bra.141.t:0 "Славетний Тріумф"
nf_bra.141.d:0 "Дзвін лунає в місті Брендон, поки переможна хода прямує головною вулицею. Люди вишикувалися вздовж дороги — натовп, повен радісних манітобців з усіх куточків країни, які зібралися відсвяткувати мир і перемогу. Після років страждань і битв вороги з Трьох Річок і Конгресу Метисів були розбиті, і Королівство знову стоїть гордо. Парад, запланований на три дні, складається з найкращих солдатів Манітоби — чоловіків і жінок, які з гордістю несуть свою службу.\n\nПолки — від скромного харчового корпусу до найхоробріших Гірських Монтій — рухаються як одне ціле, в найкращій формі. На чолі колони — сам Вільям Таннер, найвірніший воїн Короля, тримаючи прапор Манітоби й стяг Королівських Качкарів, він їде верхи та салютує палацу.\n\nКороль Ґанн пішов на спочинок незадовго до того, як хода дійшла до резиденції, заявивши, що почувається недобре. Його відсутність викликає жаль, але жоден підданий не дорікне своєму стійкому монарху, який віддав усі сили задля перемоги та безпеки держави.\n\nМи бажаємо йому здоров’я."
nf_bra.141.a:0 "За Манітобу! За Короля Ґанна!"

nf_bra.15.t:0 "Спадкоємиця Йорктонів"
nf_bra.15.d:0 "Королева Кетрін ішла жвавими залами палацу, й слуги й чиновники розступалися перед супутницею монарха. Палац перебував у стані безперервної роботи відтоді, як спалахнуло повстання в Ланґенбурґу.\n\nДіставшись покоїв чоловіка, вона на мить зупинилася перед дверима. Ґанн вибухнув гнівом, почувши про заколот, а після перемоги влаштував цілісіньке святкування, все ще проклинаючи ім’я Лейфа Йорктона. Зібравши мужність, вона увійшла до темної кімнати й побачила чоловіка, що стояв перед дзеркалом.\n\nТа перш ніж вона встигла щось сказати, він заговорив:\n\n«Чому вони борються зі мною, Кетрін? Чому — після всього, що я зробив, щоб повернути цим людям хоч тінь Старого Світу — вони змовляються проти мене!»\n\nВін ударив кулаком по столу. Повисла тиша. Кетрін обмірковувала, що відповісти, та її чоловік зітхнув і промовив:\n\n«Хоча, мабуть, це вже не має значення. Вони переможені, а я ще тут. Тож що привело тебе, люба?»\n\n«Я прийшла поговорити про долю Ланґенбурґа. Пропоную призначити доньку Лейфа, Елеонору, герцогинею їхніх земель.»"
nf_bra.15.a:0 "..."

nf_bra.16.t:0 "Спадкоємиця Йорктонів (продовження)"
nf_bra.16.d:0 "Ґанн обернувся до дружини — на обличчі відобразились і здивування, і легкий гнів.\n\n«Чому я маю ставити доньку зрадника на чолі тих, хто повстав проти мене?»\n\n«Елеонора давно є представницею Ланґенбурґа при нашому дворі й моя близька подруга. Вона віддана вам і Королівству, й була вбитою горем через дії свого батька. Вона вірить — і я з нею — що народ Ланґенбурґа має спокутати провину, й готова сама повести їх цим шляхом.»\n\nКетрін подивилася чоловікові в очі, й крізь його гнів побачила, що він серйозно зважує її слова.\n\nВона додала: «Її призначення заспокоїть народ, адже, попри повстання, ім’я Йорктонів досі має для них значення. Це запобіжить новому вибуху ворожнечі.»\n\nМовчанка. Кетрін затамувала подих, очікуючи рішення чоловіка. Нарешті, він промовив:\n\n«Вона здатна керувати?»\n\n«Так. Вона навчалась у мене й у наших радників.»\n\n«Мені це не подобається... але я дозволю. Я вірю тобі, моя люба. І твоїй оцінці Йорктонів.»"
nf_bra.16.a:0 "«Вона має моє благословення»"

nf_bra.17.t:0 "Важка та голова, що носить корону"
nf_bra.17.d:0 "Дзвін лунав у Брендоні, і місто, що ще нещодавно раділо перемозі, тепер оплакує смерть свого Короля. Король Ґанн Великий, другий цього імені — символ єдності й стабільності для всієї Манітоби — помер від хвороби після перемоги над Республікою Трьох Річок. Громада зібралася на центральній площі для останнього прощання з монархом. Першим прибув труна — проста, з темного дерева, накрита його особистим прапором, у супроводі загону Королівських Качкарів.\n\nДалі з’явилася королева Кетрін — її краса затьмарена скорботою, вона ледве стримує сльози. За нею, на чолі загону Монтійців, ішов Вільям Таннер — командир і найвірніший підданий Короля. Його зазвичай суворе обличчя було блідим, ніби сама смерть торкнулася його замість Ґанна.\n\nКоли церемонія завершилась і процесія вирушила до обраного місця поховання за містом, над Брендоном нависла тривога. Хто успадкує трон, якщо Ґанн не мав спадкоємців — його гульська природа цього не дозволила? Скликано регентську раду, яка заявила, що правитиме Королівством до обрання нового монарха. Кого б рада не обрала — той неодмінно змінить хід історії Королівства. Але чи на краще — побачимо."
nf_bra.17.a:0 "Короні бракує голови, а легенда — спочила з миром."

nf_bra.25.t:0 "На Порозі Смерті"
nf_bra.25.d:0 "Ґанн стояв за письмовим столом, вивчаючи закони та укази. Від тієї ночі він невтомно працював задля майбутнього Королівства. Ненадійних радників було усунуто, на їхнє місце прийшли найздібніші. Вассали присягнули новою клятвою перед власними народами. Таннер стояв поруч, дбаючи, аби армія залишалась вірною монарху. Справа йшла добре.\n\nАле цього було недостатньо. Залишалося ще стільки роботи — закони, укази, пожалування. Проте Ґанн розумів: його час минає. Руки тремтіли, думки плутались, слова ставали незрозумілими. Навіть найбезглуздіші придворні починали шепотіти, бачачи, як він згасає. Таннер і Кетрін теж це бачили, і благали його берегти сили. Таннер навіть запропонував шукати ліки в мерзлих пустках — можливо, в забутих лабораторіях чи військових комплексах. Але чи має Ґанн час на примарну надію, коли ще стільки треба зробити? Це питання не покидає його думок. Можливо, варто спробувати врятувати розум — поки не пізно."
nf_bra.25.a:0 "Смерть кличе короля, і її вже не ігнорувати."

nf_bra.27.t:0 "«Пропозиція», яку ми не можемо відхилити"
nf_bra.27.d:0 "Найгірший наш страх після поразки Другої Республіканської Коаліції справдився. [BRA.GetNameDefCap] вимагає, щоби ми повернулися під їхню владу — добровільно або через війну, яку ми не зможемо виграти. Хоча вони здебільшого ігнорували нас, поки ми сплачували данину як віддалений васал, ми чули про утиски інших підданих — зокрема метисів і торговців Уінніпеґа.\n\nТа деякі вірять, що під владою Ґанна II Королівство стало людянішим, ніж було за династії Брендонів. У будь-якому випадку, повна втрата суверенітету викликає обурення серед багатьох жителів Мус-Джоу."
nf_bra.27.a:0 "Ми маємо вберегти народ від війни... будь-якою ціною."
nf_bra.27.b:0 "Пацифізм не означає беззахисність."

nf_bra.30.t:0 "[BRA.GetNameDefCap] вимагає [1355.GetName]"
nf_bra.30.d:0 "У межах зусиль із відновлення своєї колишньої слави, [BRA.GetNameDef] вимагає повернення своїх історичних земель у Західній Манітобі — зокрема [1355.GetName], включно з містом, що має ту саму назву, а також Ґрінвотером і Рокфордом. Попри відсутність стратегічної цінності, [1355.GetName] має важливе історичне значення для Лицарського Ордену Святого Георгія — а отже, і для самого [BRA.GetNameDef].\n\nОчевидно, відмова призведе до війни. Але поступка може лише відкласти неминуче, натомість даючи нам час для зміцнення армії. Ми повинні ретельно зважити свої дії."
nf_bra.30.a:0 "Зараз ми не маємо вибору."
nf_bra.30.b:0 "Нехай спробують взяти силою!"

nf_bra.31.title:0 "Від монарха до монарха"
nf_bra.31.desc:0 "Так зване [BRA.GetName] зробило нам пропозицію: земля, раби й здобич — у рівній мірі. Все, що від нас вимагається — це вдарити по беззахисному [WPG.GetName], коли той неминуче вступить у війну з [BRA.GetAdjective] військами.\n\nЗрозуміло, що їх не цікавить довготривалий союз, і взаємна огида тут цілком очевидна. Але навіть так — це пропозиція, яку варто розглянути, бо вона безперечно принесе нам вигоду в короткостроковій перспективі."
nf_bra.31.a:0 "Уінніпеґ буде нашим!"
nf_bra.31.b:0 "Король може бути лише один!"

nf_bra.32.title:0 "[RCK.GetNameDefCap] погоджується"
nf_bra.32.desc:0 "Божевільний Король Тарганів прийняв нашу угоду, і його… доволі нетипова армія радітарганів вже готова затопити вулиці Уінніпеґа в будь-який момент. Хоча ми й розглядали можливість дарування йому титулу, якщо він виявиться вправним командувачем і губернатором, подальші переговори показали, що він надто серйозно сприймає свій псевдонім «Король Тарганів» і не погодиться на жоден нижчий титул.\n\nТа він охоче кинувся до ресурсу, повністю профінансованого з королівської скарбниці, й схоже, вже давно планував вести свої орди на північ."
nf_bra.32.a:0 "Чудово."

nf_bra.33.title:0 "[RCK.GetNameDefCap] відмовляється"
nf_bra.33.desc:0 "Схоже, божевільний Король Тарганів не зацікавлений у нашій пропозиції щодо удару по нашому спільному ворогу — [WPG.GetNameDef]. Нашого посла вигнали з Ґріфтону рій радітарганів, коли той спробував пояснити, що його титул «Король Тарганів» не визнається офіційно, і що під жодним приводом ми не дозволимо тарганам служити окупаційними силами у Вінніпезі.\n\nТак чи інакше, ми повернулись з капами при собі й тверезим розумінням, що співпраця з цим божевільним лише ускладнить справи в майбутньому. Рано чи пізно, нам доведеться мати з [RCK.GetNameDef] справу — але поки що є справи важливіші."
nf_bra.33.a:0 "На жаль."

nf_bra.34.title:0 "Наша частина угоди"
nf_bra.34.desc:0 "Наші полчища радітарганів з нетерпінням чекають на шанс прорватися через кордон з [WPG.GetAdjective] і забрати все, що належить нам!\n\nЧас виконати нашу частину угоди з [BRA.GetNameDef] і вдарити по Уінніпеґу!"
nf_bra.34.a:0 "У бій!"

nf_bra.35.title:0 "Відсутня герцогиня"
nf_bra.35.desc:0 "Останніми місяцями герцогиня Софі почала нехтувати кількома ключовими обов'язками в герцогстві Ланґенбурґ — насамперед управлінням військами, що охороняють наші кордони. Непропорційно велика кількість патрулів зосереджена в Ланґенбурґу та Йорктоні, де вони здебільшого бездіяльні, виправдовуючи це зростанням ворожості з боку метисів, у той час як прикордонні загони насилу захищають свої поселення. Випадки втрати спорядження й вантажів стають усе частішими, ще більше підриваючи безпеку.\n\nСпроби зв’язатися з герцогинею Софі або хоча б дізнатися, де вона — зустрічають мляві відповіді від знаті, кожен з яких говорить щось різне. Дехто підозрює, що ці проблеми пов’язані з її віком і погіршенням здоров’я."
nf_bra.35.a:0 "У будь-якому разі, бажаємо їй здоров’я."
nf_bra.35.b:0 "Щось тут не так…"

nf_bra.36.title:0 "Повернення до Гори Качок"
nf_bra.36.desc:0 "Частково окупована силами Ланґенбурґа на початку повстання, Гора Качок стала ареною запеклих боїв — попри свою малу чисельність населення. Ланґенбурзькі лицарі намагались утримати цей район, щоб не дати рейнджерам Манітоби обійти їх через Ассінібойн. Але важкі обладунки й незнання місцевості зіграли їм не на користь.\n\nЗ іншого боку, Вільям Таннер командував Монтійцями в цьому районі. Він виріс у Горі Качок і знав ці ліси як свої п’ять пальців. Завдяки ретельному навчанню та правильному спорядженню він знав, як уникнути небезпек клімату й дикої природи. Ці знання стали вирішальними у війні — й зробили Таннера ще більш небезпечним командиром у лісистій місцевості.\n\nПопри жорстокість боїв, казкові краєвиди Гори Качок — хвойні ліси й озера — залишилися майже неушкодженими. Завдяки Монтії та малій кількості прихильників Йорктонів, регіон повністю очищено й убезпечено."
nf_bra.36.a:0 "Таннер знову доводить свою незамінність для Королівства."

nf_bra.37.title:0 "Обов'язок Короля"
nf_bra.37.desc:0 "Ґанн II втупився в револьвер, який кинув на стіл — світло мерехтіло на металевій рамці. Навіть після всього пережитого, у цей вирішальний момент йому бракувало сили волі. Щойно він підвівся, щоб узяти зброю назад, у двері постукали. Він крикнув, що відчинено, поправив одяг, і в кімнату увійшов слуга. Той вклонився перед королем, вибачаючись за втручання. Ґанн лише відмахнувся — не до церемоній.\n\nВін спитав, чому слуга тут, адже наказав не турбувати його. Той, підвівшись, повідомив: придворні вже починають метушитись через його відсутність, і королева просить його приєднатися. Ґанн зітхнув і потер чоло. Вони — ненадійні та голодні до влади. Певно, вже плетуть змови. Він відпустив слугу й почав готуватись до придворних інтриг… і раптом погляд впав на королівську печатку.\n\nПонад два століття стояло Королівство. Але Ґанн розумів — воно трималося лише завдяки монархові. І тоді в ньому визріла нова думка. Він не може залишити свій народ на поталу стерв’ятникам, що кружляють навколо трону, поки він втрачає розум. Ні. У ті крихти часу, що лишилися — він гарантує, що Королівство переживе його. Що вистоїть. Що буде маяком стабільності й цивілізації в ядерному пеклі. Що його дружина спочине без страху, коли його не стане. Ґанн вийшов із кімнати не як зламаний самогубець, що зайшов у неї — а як король, на якого чекав народ."
nf_bra.37.a:0 "Бо це був його обов’язок — і його честь."

nf_bra.39.title:0 "Ланцюг Нарікань"
nf_bra.39.desc:0 "Поки повстання Йоркторна палало Манітобою, північні хвойні ліси омивались кров’ю. Сутички в пущах були найкривавішими в усьому конфлікті: засідки, мінні поля, спалені схрони. Зрештою, вибухами знищено навіть величезні дерева. Усі нечисленні поселення — стали полем битви.\n\nВ межах репарацій, нав’язаних Ланґенбурґу, ці землі приєднано до Манітоби. Але все довкола — руїни. Місцеві жителі, кинуті напризволяще, тепер збираються навколо нових лідерів, вимагаючи допомоги у відбудові. Багато з них підтримували повстання, але зараз вони — наші піддані. І це шанс об'єднати їх під спільним стягом."
nf_bra.39.a:0 "Вони тепер громадяни Манітоби — так буде правильно."
nf_bra.39.b:0 "Ще мають дякувати, що ми не вимагали від них репарацій."

nf_bra.40.title:0 "Вірний Маунті Короля"
nf_bra.40.desc:0 "Таннер стояв наодинці у крипті, пильнуючи труну свого короля під покровом ночі. Усі вже пішли, навіть бідолашна Кетрін. Лишився лише він — на останню варту. \n\nПогляд ковзав по труні, накритій прапором Манітоби. Вперше Таннер не був певен у майбутньому Королівства. Він завжди беззаперечно довіряв Ґанну, вірив, що старий гуль — найкращий захист для народу. Але тепер, коли його не стало…\n\nЙого роздуми перервав слуга. Таннер кинув погляд, від якого той мало не зомлів. Він наказував не турбувати його під час останньої варти. Той, заїкаючись, пояснив — прийшов особистий лист. Від самого Короля. Із печаткою.\n\nМинуло пів години, як Таннер сидів у своїй кімнаті, втупившись у нерозкритого листа. Чому Ґанн послав йому це? Чому саме зараз, уже після смерті? Нарешті, в сутінках, він зламав печатку. І прочитав — останній наказ."
nf_bra.40.a:0 "\"Вільяму Таннеру, вірному маунті Короля...\""
nf_bra.40.a_tt:0 "§gДоля Манітоби — в руках Вільяма Таннера.§!"

nf_bra.41.title:0 "Передача Адміністрації"
nf_bra.41.desc:0 "З останніми територіальними здобутками на заході ми зіткнулися з адміністративним вузлом, відновлюючи давні кордони. Колись землі Манітоби були більш децентралізованими — із широкою автономією для герцогств і марок. Але саме така децентралізація і стала причиною падіння Королівства. Попри це, настав час розширити юрисдикцію останнього герцогства — Ланґенбурґу.\n\nХоч ми ще не оговтались від болю їхньої зради, не можна заперечити, що Елеанор Йорктон лишалась вірною короні та вгамовувала страхи щодо нових повстань. Землі на заході буде тимчасово передано герцогству Ланґенбурґ — поки ми не розберемося з республіканськими ворогами на наших кордонах."
nf_bra.41.a:0 "Можливо, спадщина Йорктонів буде не лише плямою."
nf_bra.41.a.tt:0 "§gУся майбутня земля §Y[STN.GetFlag] [DUN.GetFlag] [PLT.GetFlag] Кривавого Електорату§! буде передана §Y[DLN.GetFlag] [DLN.GetNameDef]§! після анексії.§!"

nf_bra.42.title:0 "Хапаючись за Соломинки"
nf_bra.42.desc:0 "Таннер увірвався до кабінету Ґанна, слідом за ним — змучений слуга. Ґанн підняв погляд від паперів, дратуючись від шуму, що посилював головний біль. Але перш ніж встиг сказати хоч слово, Таннер кинув звіт на стіл. Ґанн почав читати — і його очі розширились.\n\nЗвіти про довоєнні об’єкти. Чутки про дивне світіння, про потвор. Старі байки про експерименти минулого. Чи може там бути ліки для нього? Надія — в самому серці зіпсованої науки. Ризик неймовірний, але інші варіанти — лиш тимчасове полегшення. Ґанн мовчки поглянув на Таннера. І дав дозвіл на експедиції."
nf_bra.42.a:0 "Останній відчайдушний кидок кісток."

nf_bra.45.title:0 "Звіт: Об’єкт 'Брама'"
nf_bra.45.desc:0 "\"Мій королю, ми його знайшли. Об'єкт, про який йшли чутки. Двері зачинені. Наші розвідники повідомляють про… нелюдські істоти, що патрулюють околиці. Якщо накажете — почнемо зачистку і відкриття комплексу.\""
nf_bra.45.a:0 "Чудова новина. Сподіваюся, там буде те, що я шукаю."

nf_bra.60.title:0 "Палац Страху"
nf_bra.60.desc:0 "Таннер вбіг до Палацу, за ним — елітний загін. Двері вибито, промінь світла пробив морок холу. Темні плями крові на підлозі та стінах, рештки слуг, розірваних істотою. Приглушені реви й крики лунали вдалині. Вони бігли на звук, тіла на їхньому шляху ставали все свіжішими. \n\nТаннер тремтів, а запах смерті душив його. Ще один рев — за наступними дверима. Він вибив їх. І побачив ЙОГО.\n\nСкорчена фігура, руки в крові. Роздерті лахміття — колись символи монаршої гідності. Очі — повні люті й безумства, без жодного сліду милосердя чи любові. Колись це був король Ґанн II. Істота ринулася на Таннера. Інстинкт — рушниця — постріл. Голова закинулась, тіло впало. Катерина закричала — і зомліла біля мертвого тіла чоловіка."
nf_bra.60.a:0 "Її крик лунав крізь порожнечу палацу."

nf_bra.48.title:0 "Холод Те, Що Забагато Втратило"
nf_bra.48.desc:0 "Катерина сиділа в темряві, сльози лились по щоках. У руках — обручка. Маленька, металева, з викарбуваним іменем. Але вона плакала не за Ґанном. А за Королівством. \n\nЯк тільки його не стало — знать почала змови. Жодної пошани до тієї спадщини, що він залишив. Катерина мовчала. Вона більше не могла з ними говорити. Вони не знали співчуття, не любили народ, не мали серця. Вони завжди йому заважали. Вона погладила кільце, торкаючись літер…\n\n\"Їм не можна довіряти... Королівство загине...\"\n\nВитерши сльози, Катерина викликала служницю. Просила перо й папір. І негайно — Таннера. Вона ще раз глянула на кільце, прочитала ім’я. Справжнє ім’я Ґанна. Вона не дозволить мрії померти. Хоч він би не хотів, щоб вона взяла цей тягар. Вона надягла кільце. І готувалась зробити все, щоб його смерть не була марною."
nf_bra.48.a:0 "Король мертвий — але Манітоба житиме."

nf_bra.49.t:0 "Ласкаво просимо до МАНІФЕСТ"
nf_bra.49.d:0 "Ґанн II йшов темним коридором, холодні металеві стіни височіли над ним, а стеля губилася в непроглядній темряві. За ним ішли маунті — нервово озираючись на м’ясисті форми, що наполовину ховались у тіні. Поруч — Вільям Таннер, його командир, тримав рушницю, що тремтіла в руках.\n\nОдна з істот вийшла вперед, потрапивши під тьмяне світло ламп. Гуманоїдна, але складена з викривленого м’яса — від неї нудило. Якби лице Ґанна не було понівечене радіацією, воно стало б білим, мов смерть. Це — новий рівень жаху, гірший, ніж американські окупанти. Та Король не міг показати страх. Він мусив стояти міцно.\n\nІ все ж… коли вони увійшли до центральної зали, навіть Ґанн здригнувся. Гігантське приміщення, поділене на скляні блоки. Всередині — ще більше м’ясних істот. Дивні капсули, деякі відкриті, пульсували енергією. Вони були під’єднані до великої коробки на стелі. І тоді екран ожив. На ньому — образ молодої жінки. Вона заговорила."
nf_bra.49.a:0 "\"Ласкаво просимо до МАНІФЕСТ-Північ.\""

nf_bra.50.t:0 "Угода"
nf_bra.50.d:0 "\"Хто ти? Що це за місце?\"\n\n\"Я — Доля. І це... найкращий науковий центр МАНІФЕСТ.\"\n\nҐанн озирав залу, намагаючись зрозуміти, яке знання могло народитись у такому пеклі.\n\n\"МАНІФЕСТ — це наступний крок для людства. Моє призначення — продовжити експеримент, за будь-яку ціну.\"\n\nҐанн замовк. Його люди спостерігали за ним. Вони бачили жах… але, можливо, це — його єдиний шанс.\n\n\"Твої експерименти... вони можуть вилікувати розум?\"\n\n\"Як я сказала, МАНІФЕСТ здатен на набагато більше.\"\n\n\"Але чи може він ВИЛІКУВАТИ МЕНЕ?!\"\n\nТиша. Екран миготів. Мовчання тривало — солдати Ґанна не зводили з нього очей. Нарешті, Доля відповіла:\n\n\"Цілком можливо… Якщо ми досягнемо згоди.\"\n\n\"Це залежить від твоїх умов.\"\n\nХоча його відповідь була обережною, у голосі — відчайдушне бажання. Спастись. Утримати розум.\n\n\"Я хочу продовжити Експеримент МАНІФЕСТ. Дай мені суб’єктів, і я зроблю все можливе, аби вилікувати тебе.\"\n\nҐанн дивився на екран, потім на Таннера. Обличчя друга — непроникне, але очі — сповнені страху. Нарешті, король заговорив."
nf_bra.50.a:0 "\"Маємо угоду.\""

nf_bra.51.t:0 "Королівська Корона"
nf_bra.51.d:0 "Ґанн і Таннер стояли в залі, залитій м’яким світлом від біо-капсул. В одній з них — людський мозок. Його мозок. Новий. Вільний від віку, мутацій і руйнації. Ґанн поклав долоню на скло, в захопленні дивлячись. Це — новий початок.\n\nАле Таннер дивився не туди. Він витер конденсат із іншої капсули… і відсахнувся. Усередині — покруч із плоті, обличчя знівечене. Та він його впізнав. Це був арештант, якого Таннер сам відправив сюди. \n\nЙого недовіра до Доля лиш зросла, але перш ніж він встиг щось сказати, інтерком ожив — солодкий голос ШІ:\n\n\"Як бачите, королю Ґанне — стабільний зразок, як обіцяно. Ще кілька перевірок — і ми почнемо процедуру. Я повідомлю вас, коли час настане.\"\n\nҐанн кивнув і вийшов із зали. Таннер ішов позаду. Вже на світлі він не витримав:\n\n\"Мій королю… Це небезпечно. Я не довіряю машині. Вона щось приховує. Я не зможу вас захистити, якщо піде не так. Скажіть: ви справді вирішили це зробити?\"\n\nТиша. Навіть пустка мовчала. Ґанн підняв голову і відповів:"
nf_bra.51.a:0 "\"Я мушу, Вільям.\""

nf_bra.52.t:0 "Розуми Машини"
nf_bra.52.d:0 "Ґанн стояв перед авто-доком, двері якого розсунулись зі шипінням. Його новий мозок — спокійно плавав у капсулі, освітлений зеленим світлом. Він боявся. А що, як операція провалиться?\n\nДоля попереджала: ризик — великий. Він може померти. І сама Доля… не давала спокою. Її експерименти створювали жахливі істоти. І вона все ще хотіла нових суб’єктів. Навіть найгірших злочинців йому було важко віддавати.\n\nАле шансів більше не лишалось. Його розум розсипався — і дні були полічені. Він подумав про Катерину. Про її усмішку. Її підтримку.\n\nВін робив це — для неї.\n\nЗ рішучістю в серці він зайшов у авто-док. Двері зачинились. Машина вхопила його, ввела препарати. І він заснув..."
nf_bra.52.a:0 "...сподіваючись, що не помилився."

nf_bra.26.t:0 "Новий Світанок"
nf_bra.26.d:0 "Він прокинувся в холодному поту, дихання важке, уривчасте. Кімната — напівтемна, світло пробивалося лише крізь вузьку щілину під дверима. Де він? Що сталося? Він встав із ліжка, відчуваючи, що тіло стало… іншим? Ніби воно не його.\n\nВідкривши двері, засліплений світлом, він ступив у кімнату. Люди. Він знав їх? Обличчя здавались знайомими, але… імена зникли. Він навіть свого не пам’ятав. Хто він? Чому ця жінка біжить до нього зі сльозами? Вона обіймає його. Щось знайоме. Близьке.\n\nВін подивився вниз. Вона стискає його міцно, немов боялась втратити знову. Вона торкнулась його лиця і прошепотіла:\n\n\"Едварде, моє кохання.\"\n\nВона поцілувала його — і все повернулося. Ґанн відповів поцілунком, підняв дружину й закрутив її в повітрі, сам плачучи від радості. Це спрацювало. Воно дійсно спрацювало. Більше не буде безсонних ночей у страху стати чудовиськом.\n\nВін поставив Катерину на землю, поглянув на інших. І розсміявся, побачивши, як Таннер намагається втримати посмішку, стоячи на струнко. Ґанн підійшов до нього, привітно плеснув по плечу, а потім обійняв дружину. Це був світанок нової епохи для Королівства. І вперше в житті, Ґанн цього світанку не боявся."
nf_bra.26.a:0 "Хай живе Королівство Манітоба!"
nf_bra.26.a.tt:0 "§YҐанн II§! був §Gвилікуваний§! від деградації розуму."

nf_bra.24.t:0 "Затьмарена Перемога"
nf_bra.24.d:0 "Феєрверки здіймались у нічне небо, освітлюючи радісний натовп. Після місяців війни зрадницька Республіка Трьох Рік знищена, і горде Королівство Манітоба перемогло. Та не всі святкували. У глибині палацу, в затемненій кімнаті, сидів король Ґанн II. Приглушені звуки салютів майже не зачіпали гуля-короля, що поринув у темні думки.\n\nЙого руки тремтіли від жаху. Видіння, що раніше були сном, тепер ставали чіткими, нестерпно ясними. Знову й знову він бачив себе, як рвався палацом, убиваючи всіх, кого бачив. Він стримував ридання — думка про те, що він міг би скривдити свою кохану Катерину, була нестерпною. Але розум знову і знову малював картину, де він стоїть над її бездиханним тілом… руки ще в крові.\n\nВін похитав головою, спробувавши знайти вікно. Світло феєрверків — його колишній порятунок — сьогодні не допомогло. Вже вкотре погляд його впав на старе бюро, яке ті вогні тривожно осяяли. Повільно вставши, він підійшов до нього. Відкрив шухляду. І дістав старий, довоєнний, оздоблений револьвер."
nf_bra.24.a:0 "..."

nf_bra.53.t:0 "Затьмарена Перемога (Продовження)"
nf_bra.53.d:0 "Ґанн дивився на зброю в руці, повертаючись до дивану. Як же знайомо вона лежала в долоні, навіть через століття. Це був подарунок — ще з іншого життя, іншої епохи. Золота гравіювання нагадала йому його справжнє ім’я. Подарунок від друга. Символ довіри, братерства. Вони присягли захищати народ Канади. Ґанн усміхнувся з болем: Ґанн дав Ґанну пістолет.\n\nВін провів пальцями по візерунку, не розуміючи його сенсу — бо думав не про нього. А про свій народ. Тих, за кого він боровся в цьому світі радіації та болю. Хоче він, щоб його пам’ятали як чудовисько, що втратило людяність? Ні. Він хотів, щоб його згадували як героя. Того, хто віддав усе, аби забезпечити краще життя для тих, кого любив.\n\nЦі думки заповнили його свідомість, коли Ґанн II, Король Манітоби, знову і знову відтягував і скидав курок револьвера."
nf_bra.53.a:0 "Постріл — тихіший за салют, але значущіший."
nf_bra.53.b:0 "Револьвер летить через кімнату. Король зітхає."

nf_bra.61.title:0 "Сторож Півночі"
nf_bra.61.desc:0 "\"...має бути останнім питанням. Все інше, Вільяме, я залишаю тобі. Королівство, яке колись мало мету, стало поразкою. Ми обидва це знаємо. Народ заслуговує на більше, ніж те, що можуть дати дворяни й монархи. Ти служив вірно й без сумніву багато років. І я вважаю тебе своїм найближчим другом. Саме тому я залишаю тобі залишки Королівства.\n\nДай людям Манітоби й Канади краще життя, Вільяме. Дай їм надію та безпеку, яку я не зміг дати. Дай їм життя. Любов. Радість. Дай їм надію. Можливо, ти вважаєш себе негідним, але я знаю — ти зможеш. У тобі є воля й переконання. Ти не сліпий до страждань цього світу і не відірваний від свого народу. Стань їхнім захисником. Захисником Канади. Це мій останній наказ як твого короля. Виконай його.\n\nІ, будь ласка, Вільяме, дай Катерині спокій. Забезпеч їй тишу і затишок, подалі від стерв’ятників у Брендоні. Її серце чисте, але їй ніколи не подобалась моя роль у Королівстві. Я мав її послухати. Вона — єдина, кого я коли-небудь любив. Я не дозволю їй зруйнувати себе, намагаючись замінити мене.\n\nПрощай, Вільяме. Дякую тобі за все. Іди. Захищай народ.\n\nЗ повагою, твій друг,\n\nЕдвард «Ґанн II» МакКоннеллі, останній король Манітоби.\"\n\nТаннер обережно склав листа й поклав назад на стіл. Він глянув у вікно на схід сонця, що іскрився над снігами. І усміхнувся. Все було зроблено. Світло постало над колишньою крижаною Північчю. Його останній наказ — виконано."
nf_bra.61.a:0 "Боже, бережи Канаду."

