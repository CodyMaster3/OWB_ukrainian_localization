nf_bra.63.title:0 "Перемога Серця"
nf_bra.63.desc:0 "Коли розум Ґанна було врятовано, він зміг знову насолоджуватись дрібницями, яких йому так не вистачало. Смак їжі, живопис, полювання з Таннером… Але серед усього найбільшим скарбом залишалась любов до Катерини.\n\nСказати, що їхнє кохання було джерелом сили — це нічого не сказати. У найтемніші ночі, коли він був на межі, лише думки про неї тримали його. Тепер, коли все позаду, він знову мав для неї час. Колись він охолов до неї, боячись, що нашкодить. Ці жахи привели його до сьогоднішнього вечора.\n\nВони вечеряли наодинці. Таннер стояв на варті — нікого не пускав. Вечір був тільки для короля і його королеви. Ґанн увімкнув радіо. Воно зашипіло, а ведучий заговорив:\n\n\"Доброї ночі, леді й джентльмени. Сьогодні просто музика. Дін Мартін — 'Everybody Loves Somebody'. Залишайтесь із нами.\"\n\nМелодія полилась у кімнату. Ґанн усміхнувся й глянув на Катерину:\n\n\"Дозволь мені цей танець?\"\n\nВона тихо хихотіла і взяла його за руку. Вони погойдувались, обіймаючи одне одного. Її рука — на його плечі. Його — на її талії. Десь у місті лунали салюти. Він подумки повернувся до тієї ночі після перемоги Манітоби… холодна сталь у руці, дуло до скроні. Та зараз — усе інакше. Він подивився в очі Катерини й усміхнувся. Він знайшов те, що вважав втраченим…"
nf_bra.63.a:0 "Щастя."

nf_bra.64.title:0 "Кінець Декаденції"
nf_bra.64.desc:0 "\"Це абсурд!\" — кричав хтось, аж слина летіла в обличчя Ґанну. Той закрив очі, втомлений від скарг еліти. Корупція роз’їдала Манітобу. Десятиліттями аристократи вирішували, хто гідний приєднатися до їхнього кола. Вони паразитували на народі. Саме це спричинило повстання Трьох Рік. І знову могло стати іскрою.\n\n\"Панове, зрозумійте — цього потребує Королівство. Ми мусимо вчитись на помилках. Ваші привілеї буде зменшено, але не знищено. Прошу — заспокойтесь.\"\n\n\"У вас немає права!\" — кричав один. \"Ваша величносте, ми поставили вас на трон. Без нас ви б не були тим, ким є!\" — благав інший. Ґанн завмер. Його лице зморщилось: спершу шок… а потім — чиста лють.\n\n\"Не намагайтеся мене дурити!\" — гаркнув він. Усі замовкли. \"Ви вибрали мене не через мої здібності. Ви обрали мене, бо думали, що зможете керувати мною, зробити маріонеткою. Це було тоді. Але тепер — ні. Я ваш Король. І королю не потрібні п’явки. Прийміть ці зміни. Інакше — в’язниця. Або шибениця.\"\n\nҐанн різко вийшов. Перед дверима зупинився:\n\n\"Катерина мала рацію. Бридкі людці…\" — і зачинив за собою двері."
nf_bra.64.a:0 "Вони отримали, що заслужили."

nf_bra.65.title:0 "Полювання на Усміхненого Джека"
nf_bra.65.desc:0 "Минув тиждень кампанії з повернення Блайтед-Вудсу, і манітобські війська просувались дедалі глибше у химерні ліси. Спеціальний загін королівських маунті під командуванням капітана Джона Беланже отримав наказ вистежити Усміхненого Джека — дивного, невловимого колишнього маунті, який перетворився на мутанта-виродка. Їхня мета — схопити його й доставити до правосуддя в Брендоні.\n\nМаючи мінімум інформації, загін орієнтувався на попередні повідомлення про те, що Джека часто бачили біля боліт на південь від руїн Гудзонової Затоки — разом із його вірним почтом льодових мерзотників. Під покровом ночі, оминаючи божевільних канібалів, вони підійшли до зруйнованого міста, колись торгового центру Манітоби, тепер залитого тьмяним полум’ям.\n\nОцінивши обстановку, Беланже наказав прочесати ліс південніше. Лише кроки бійців, воронячі каркання й жаб’ячі крики порушували тишу. У лісовій галявині вони знайшли хижу. Та вмить нічне затишшя вибухнуло — хата злетіла в повітря, і з диму вийшов гігантський, потворний мутант — Усміхнений Джек.\n\nЗ гнилими очима, що в'їдалися в душу, він завив. Його мерзотники оточили маунті. У відчаї Беланже кинувся вперед, намагаючись завдати смертельного удару — але Джек легко відкинув його геть своїми видовженими кінцівками. Десь у руїнах загриміла стрілянина… і знову стихла в темряві."
nf_bra.65.a:0 "Ще один загін зник…"

nf_bra.66.title:0 "Вадіна, моя Вадіна"
nf_bra.66.desc:0 "Провінція Вадіна має буремну історію. Колись частина Королівства, вона опинилася на рубежі, де страждала від рейдів з боку Електорату. Під час війни Коаліції місцевим довелося терпіти байдужого лорда, і чимало з них жадали приєднатися до повстанців. Не маючи власних сил, вони уклали угоду з дияволом: найняли найманців з Електорату, відомих як Іскролеза.\n\nУ пауер-броні ті вдерлись до Вадіни, знищили королівський гарнізон, убили лорда і пограбували палац. Але \"визволення\" тривало недовго. Іскролези не отримали обіцяної плати й вирішили здобути славу — знищили новоприбулий загін метисів і передали Вадіну під владу Плезантдейлу. Тепер місцеві з похиленими головами чекають наступної зміни влади, що принесе лише біль."
nf_bra.66.a:0 "Це знову буде наше!"
nf_bra.66.b:0 "Ми маємо захистити Вадіну за будь-яку ціну."

nf_bra_cookie.1.title:0 "Неземне Вторгнення"
nf_bra_cookie.1.desc:0 "Вільям Таннер ішов коридорами палацу Брендону з незвичною терміновістю. Підійшовши до кабінету Ґанна II, він на мить зупинився, зібравшись. Потім увійшов, віддав честь. Король лише махнув рукою — розслаблено.\n\n\"Сір, надійшли тривожні звіти. Орди мутованих свинолюдей з’явились у Вайомінгу. Вони без розбору вбивають усіх на шляху. І... шукають королівство, яке називають своїм заклятим ворогом.\"\n\nВін замовк, чекаючи реакції. Ґанн був непорушний.\n\n\"Ми можемо припустити, що йдеться про нас.\"\n\nКороль зітхнув, мов уже все знав.\n\n\"Я боявся, що до цього дійде. Те королівство, якого вони шукають, уже послало свого найсильнішого воїна. Тепер лишився тільки один, хто зможе їх зупинити...\""
nf_bra_cookie.1.a:0 "\"...Кукі.\""
nf_bra_cookie.1.a_tt:0 "§gЗачекайте, це ж… королівський кіт?§!"

nf_bra_cookie.2.title:0 "Накази Кукі"
nf_bra_cookie.2.desc:0 "Мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу.\n\nМяу мяу мяу мяу мяу мяу мяу?\n\nМяу мяу.\n\nМяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу мяу.\n\nМяу."
nf_bra_cookie.2.a:0 "Т-так, ваша Мявливосте."
nf_bra_cookie.2.a_tt:0 "§g…хтось зрозумів, що він сказав?§!"