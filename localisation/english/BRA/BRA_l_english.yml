l_english:
### Focus
bra_the_dark_ages:0 "Заснування Королівства"
bra_the_dark_ages_desc:0 "Часи до Королівства були епохою анархії та страждань. Відтоді ми пройшли довгий шлях."

bra_the_end_of_the_golden_age:0 "Кінець Золотого Віку"
bra_the_end_of_the_golden_age_desc:0 "Саме тут ми сягнули свого апогею, нашої величі не зрівняти в усій Канаді. Але це не тривало вічно."

bra_of_traitors_and_revolution:0 "Про Зрадників і Революцію"
bra_of_traitors_and_revolution_desc:0 "Ми стоїмо переможені, але не зламані. Стара Квітка Манітоби зів'яла, проте з неї виростає новий пагін."

bra_on_borrowed_time:0 "На Позиченому Часі"
bra_on_borrowed_time_desc:0 "Усе помирає.\n\nЦе закон життя — гіркий, незмінний закон. Але те, що наша доля написана, не означає, що ми маємо прийняти її, лежачи долілиць."

bra_the_jewel_of_the_crown:0 "Перлина Коронного Володіння"
bra_the_jewel_of_the_crown_desc:0 "Якби повоєнні міста були намистом, Брендон став би діамантом серед перлів. Він пережив Велику Війну неушкодженим, розквітнув разом із Королівством Манітоба та витримав зрадницькі повстання. Він — наша горда столиця."

bra_queen_katherine_greenhouses:0 "Оранжереї Королеви Катерини"
bra_queen_katherine_greenhouses_desc:0 "Від часу заснування Королівства продовольча нестабільність залишалась ключовою проблемою для простого люду. Хоч ця біда вже не така нищівна, щороку через сувору північну зиму багато хто лишається голодним. Королева Катерина особисто ініціювала розвиток теплиць, аби мороз не впливав на врожаї."

bra_grain_elevators:0 "Розосереджені Зерносховища"
bra_grain_elevators_desc:0 "Стабільне виробництво їжі нічого не варте, якщо її не можна доставити до голодних. Будівництво зерносховищ, що обслуговують кілька поселень одночасно, не лише покращить доступ до харчів, а й дасть поштовх розвитку нових міст, менш залежних від натурального господарства."

bra_feeding_the_reactor:0 "Живлення Реактора"
bra_feeding_the_reactor_desc:0 "Брендон — одне з небагатьох міст, що забезпечує себе електроенергією самостійно. Але наш реактор — давній звір. Без гідроелектростанції Гранд-Репідс ми мусимо тримати його в ідеальному стані. Краще паливо. Кращий ремонт."

bra_fortify_the_gates:0 "Укріпити Ворота"
bra_fortify_the_gates_desc:0 "Мур лише настільки сильний, наскільки готові його боронити. Проте досвід показав — він все ж необхідний, особливо коли ворог стоїть на порозі."

bra_expand_the_kingsroad:0 "Розширити Королівську Дорогу"
bra_expand_the_kingsroad_desc:0 "Королівська Дорога — найвеличніша споруда, зведена в ім’я людської свободи шляхетним монархом. Вона перетинає гори, болота й ріки. Вона пряма, міцна й широка. Вона єднає міста з містами, а держави з державами."

bra_goods_and_raw_materials:0 "Товари та Сировина"
bra_goods_and_raw_materials_desc:0 "Наша велика індустрія потребує величезної кількості ресурсів. Після втрати торгівлі зі сходом стало життєво важливо задовольняти попит зсередини."

bra_reopen_the_canadian_postal_service:0 "Відновити Канадську Пошту"
bra_reopen_the_canadian_postal_service_desc:0 "Ґанн ще пам’ятає зручність поштових служб до Великої Війни. Завдяки завзятому міністру ми можемо повернути цю зручність і для Корони, і для підданих. Тепер, куди ж подівся той чорнобілий кіт поштового майстра?.."

bra_expand_the_manufactorum:0 "Розширити Маніфакторіум"
bra_expand_the_manufactorum_desc:0 "Маніфакторіум — джерело багатства Брендону. Він використовує силу води та руки майстрів, щоб створювати найкращий зимовий одяг, цінний на всій Півночі. Проте деякі можновладці хочуть, аби подальші розширення виносилися за межі міста."

bra_the_royal_college:0 "Королівський Коледж"
bra_the_royal_college_desc:0 "Королівський Коледж, знаний також як Коледж Брендона I, відіграв ключову роль у збереженні знань Старого Світу. Проте тепер він занедбаний. Ми повинні його відродити."

bra_connect_the_marches:0 "З’єднати Марки"
bra_connect_the_marches_desc:0 "Якщо ваші люди підуть лише тоді, коли буде добрий шлях — то нам такі не потрібні. Ми шукаємо тих, хто прийде, навіть коли шляхів немає."

bra_the_invitation:0 "Запрошення"
bra_the_invitation_desc:0 "Бути шляхтичем — означає не лише володіти владою, а й показувати її. У складні часи Король має скликати бал, щоб нагадати підданим про силу Крони."

bra_paying_the_construction_crews:0 "Сплатити Будівельникам"
bra_paying_the_construction_crews_desc:0 "До Першої Війни Коаліції Гільдія Каменярів зводила палац у серці Брендону. Проте війна спожила бюджет, і їх не було оплачено. Виплата боргу стане знаком того, що Корона — слово своє тримає."

bra_sapphire_candles:0 "Сапфірові Свічки"
bra_sapphire_candles_desc:0 "Щоб показати нашу розкіш і відсутність скнари, ми замовимо свічки від майстрів, відомих по всій землі за їхню барвисту, химерну красу. Їх сяйво заповнить ніч, і, можливо, відволіче гостей від відсутнього восьмого блюда."

bra_putting_meat_on_the_table:0 "Поставити М’ясо на Стіл"
bra_putting_meat_on_the_table_desc:0 "Залицяння — як тушкована баранина. Вариш годинами, щоби скуштувати м’якість м’яса. Воно не готується за дві секунди."

bra_the_royal_ball:0 "Королівський Бал"
bra_the_royal_ball_desc:0 "Бал у Брендоні іноді називають «п’ятою порою року». У Королівстві, яке вміє цінувати життя всіма відчуттями, ці події стають чарівним дійством, що охоплює навіть тих, хто лишився за стінами палацу."

bra_completing_the_palace:0 "Завершити Палац"
bra_completing_the_palace_desc:0 "Після щедрої компенсації працівникам і виплати заборгованості, гільдія погодилась нарешті завершити будівництво.\n\nНарешті палац перестане бути недобудованим кістяком, що загрозливо височіє над столицею — і стане тим, чим і мав бути: величною спорудою, що символізує державу."

bra_golden_once_more:0 "Золоті Знову"
bra_golden_once_more_desc:0 "Славу Золотого Міста Півночі вважали втраченою. Але під мудрим правлінням Ґанна її повернено, попри всіх ворогів. Поки дикуни зводять халупи зі сміття минулого світу, ми — гордо стоїмо в камені."

bra_the_upstart:0 "Почесний Вискочка"
bra_the_upstart_desc:0 "Відомий майстер роботи з тваринами, Вільям Таннер почав як простий Звіролов при дворі. Але постійно вирізнявся, просувався вище — не через зв’язки, а завдяки здібностям."

bra_pathfinders:0 "Королівські Провідники"
bra_pathfinders_desc:0 "Той, хто знаходить шлях — є провідником, навіть якщо інші мусять його прокладати знову. Той, хто йде попереду всіх — є лідером, навіть якщо світ цього ще не визнав."

bra_establish_hunting_lodges:0 "Заснувати Мисливські Ложа"
bra_establish_hunting_lodges_desc:0 "Якщо качине полювання проводиться з честю — це не просто спорт, а мистецтво, навичка і наука. Це також акт любові, бо хто ж любить птаха більше, ніж мисливець?"

bra_secure_frontier:0 "Закріпити Кордон"
bra_secure_frontier_desc:0 "Маунті з самого початку були створені для охорони північних рубежів. Вони втримали вовків і приборкали контрабандистів, але ресурсів на повне очищення бракує. Таннер звернувся до армії з проханням допомогти в останньому штурмі фронтиру."

bra_fur_trade:0 "Вийти на Торгівлю Хутром"
bra_fur_trade_desc:0 "Економіка й досі значною мірою крутиться навколо хутра. Все як колись: технології, зброя, прикраси, розваги, наркотики."

bra_lord_of_dogs:0 "Володар Псів"
bra_lord_of_dogs_desc:0 "Гора Дак славиться своїми породами псів — кожен має героїчну славу. Але спитайте дитину з Брендону про улюбленця — її очі загоряться, й вона розповість про славетних санних собак Таннера, що везуть його до міста на зимові святкування."

bra_canine_units:0 "Впровадити Підрозділи K9"
bra_canine_units_desc:0 "Собаки — найкращі друзі людини. Під наглядом Таннера ми інтегруємо бойові K9-одиниці в лави нашої армії. Вони принесуть перевагу в бою, а ще — піднімуть бойовий дух."

bra_subsidize_crownland:0 "Субсидувати Галузі Коронної Землі"
bra_subsidize_crownland_desc:0 "Наш народ процвітає — і багато в чому завдяки підданим. Настав час віддячити: субсидії на внутрішню промисловість допоможуть їм, а також задовольнять наші власні потреби."

bra_water_pipeline:0 "Нова Водопровідна Мережа"
bra_water_pipeline_desc:0 "Нові труби доставлять до міста безцінний ресурс — воду. Чиста, прозора, достатня — для пиття та всіх людських потреб."

bra_higher_wages_lumberjacks:0 "Підвищити Зарплати Лісорубам"
bra_higher_wages_lumberjacks_desc:0 "У нашому холодному краї деревина — це все: тепло, житло, життя. Щоб не замерзнути — маємо тримати лісорубів щасливими й добре оплаченими."

bra_civilian_settlement:0 "Цивільна Колонізація"
bra_civilian_settlement_desc:0 "Мисливці та маунті очистили ліси від загроз — тепер ми можемо почати колонізацію нових земель і перетворити ці дикі простори на домівки."

bra_veteran_prospectors:0 "Ветерани-Пошуковці"
bra_veteran_prospectors_desc:0 "Серед пошуковців кажуть: «Шукатимеш тільки одне — більше нічого й не знайдеш». Мабуть, час прислухатись."

bra_unusual_find:0 "Незвична Знахідка"
bra_unusual_find_desc:0 "Кажуть, Федерація Виробників Кленового Сиропу Квебеку зуміла врятувати національні запаси перед приходом американців. Це «рідке золото» десь приховано. Якби ж то знати — де..."

bra_rich_deposits:0 "Багаті Родовища"
bra_rich_deposits_desc:0 "Велика Війна почалась через брак ресурсів. Але обидві сторони були настільки зайняті захистом власного, що забули — в землі ще залишалося чимало незвіданого багатства."

bra_an_unusual_find:0 "Незвична Знахідка"
bra_an_unusual_find_desc:0 "$bra_unusual_find_desc$"

bra_new_goldmine:0 "Нова Золота Копальня"
bra_new_goldmine_desc:0 "Золото — добре на своєму місці; але люблячі, відважні та патріотичні люди кращі за золото. Втім, це не означає, що ми повинні залишати його в землі."

bra_new_duke_of_langenburg:0 "Нова Герцогиня Ланґенбурзька"
bra_new_duke_of_langenburg_desc:0 "Колись процвітаюче герцогство Ланґенбург лежить у руїнах і без правителя. Якщо ми поглинемо його зараз — народ запам’ятає це як зневагу. Краще виявити милосердя: призначити далеку родичку й дозволити їй самостійно відновлювати край. Цей жест запам’ятають усі потенційні заколотники."

bra_free_dawfin:0 "Звільнити Дофін"
bra_free_dawfin_desc:0 "Мускетери стали ганьбою нашої слабкості після громадянської війни. Час вшанувати Дім Дюбуа і врятувати їхній родовий дім від цих мародерів."

bra_dubois_vindicated:0 "Дюбуа Оправдані"
bra_dubois_vindicated_desc:0 "Зрадники Йорктини зазнали поразки, й місто Дофін знову під нашою короною. Саме час нагородити лорда Дюбуа за його вірність — власною маркою."

bra_royal_forces:0 "Перемога Королівських Сил"
bra_royal_forces_desc:0 "Зрада Ланґенбурґа хоч і була згубною для простолюду, дозволила королю позбутись некомпетентних дворян у війську та замінити їх на вірних і дієвих людей, що розуміють важливість постійної реформи."

bra_our_loyal_subjects:0 "Наші Вірні Піддані"
bra_our_loyal_subjects_desc:0 "Кожне володіння Королівства, що не перебуває під прямим управлінням — віддане на самоврядування нашим васалам. Це породжує труднощі, але навіть з їхніми вольностями — вони зобов’язані коритися Короні."

bra_kings_iron_fist:0 "Залізний Кулак Короля"
bra_kings_iron_fist_desc:0 "Попри наші поразки, армія досі сильна. Саме загроза її повернення змусила заколотників погодитись на крихти здобутків у мирній угоді. Але ми не можемо зволікати, інакше втратимо останню перевагу."

bra_salvage_wreckage:0 "Зібрати Обломки"
bra_salvage_wreckage_desc:0 "Хоч битва при Стоунволлі й стала поразкою, ми все ж знищили кілька суден Республіканців, включно з новим крейсером. Його уламки можуть дати нам важливі дані про ворога."

bra_canadian_mastiff:0 "Канадський Мастиф"
bra_canadian_mastiff_desc:0 "Вільям Таннер не раз дарував Королю псів, і хоч більшість із них вештається палацом і докучає прислузі, жоден не виявив таку відданість, як королівські мастифи — вірні супутники солдат і гвардійців."

bra_masters_of_the_wild:0 "Володарі Дикої Природи"
bra_masters_of_the_wild_desc:0 "Щоб стати братом у Ордені, новак має пережити зиму сам на сам із дикою природою — лише з розумом і псом поруч. Багато хто замерзає чи вмирає з голоду. Але ті, хто повертаються, — справжні майстри виживання."

bra_dubois_fireteams:0 "Вогневі Групи Дюбуа"
bra_dubois_fireteams_desc:0 "Дім Дюбуа втратив багато зі своєї технічної переваги. Попри технології, що вони взяли з собою в бункер, лишилось небагато, що могло б дати їм перевагу. Та їхні вогневі групи досі вселяють повагу — і стануть на службу Короні."

bra_medical_support:0 "Медична Підтримка"
bra_medical_support_desc:0 "Дюбуа стверджують, що керують єдиною повноцінною лікарнею в усій Канаді. За їхніми словами, колись кожен канадець мав доступ до сотень таких закладів. Абсурд? Можливо. Але в таких ілюзіях — є користь."

bra_rebuilding_our_might:0 "Відновити Нашу Міць"
bra_rebuilding_our_might_desc:0 "Ми програли бій, але справжня війна лише починається. Маємо знищити поразкові настрої в Королівстві. Ми помстимося, а загиблі в Блекриджі стануть першими мучениками на шляху до нового золотого віку."

bra_break_internal_loyalties:0 "Розбити Внутрішні Лояльності"
bra_break_internal_loyalties_desc:0 "Наші військові підрозділи свідомо не формуються за регіональним принципом. Це руйнує місцеві зв’язки та формує єдину вірність — до побратима та до Крони."

bra_standardize_levy_system:0 "Модернізувати Систему Ополчення"
bra_standardize_levy_system_desc:0 "Система набору ополчення слугувала нам впродовж усього існування Королівства. Але решта Вестленду вдосконалює війська, й наші лави починають виглядати жалюгідно. Час навести лад — і зберегти традицію, осучаснивши її."

bra_new_armory:0 "Нова Зброярня"
bra_new_armory_desc:0 "Щасливе те місто, яке в часи миру готується до війни."

bra_clear_chain_command:0 "Упорядкувати Командну Ієрархію"
bra_clear_chain_command_desc:0 "Чимало дворян служать у війську, але їхні титули плутають командування. Генерали не можуть запам’ятовувати родоводи — указ має раз і назавжди навести лад."

bra_bismarck_contracts:0 "Контракти зі Зброярами Бізмарка"
bra_bismarck_contracts_desc:0 "Угода з Бізмарком дає Короні важелі проти непокірної шляхти. Навіть якщо ми не станемо супротивниками — думка про заряжену лазерну гвинтівку у власному тилу дисциплінує краще за промови."

bra_motorization_effort:0 "Зусилля з Моторизації"
bra_motorization_effort_desc:0 "Ідея моторизації виникала не раз, але попри очевидні переваги у швидкості, важкодоступна місцевість Канади довгий час робила це непотрібним пріоритетом — аж до сьогодні."

bra_improve_interservice_comm:0 "Поліпшити Міжвідомчу Комунікацію"
bra_improve_interservice_comm_desc:0 "Радіозв'язок — зброя потужніша за будь-яку гвинтівку. Якщо оснастити ним усі підрозділи, ми забезпечимо максимально ефективну координацію."

bra_develop_anti_tank:0 "Розробити Бронебійні Заряди"
bra_develop_anti_tank_desc:0 "Зі справжніми бронетанковими ворогами ми зустрічалися рідко, але розумні готуються завчасно. Особливо якщо вірити історіям про хлопців у силовій броні, які розстрілюють бабусь з гаусс-рушниць за несвоєчасно зданий тостер."

bra_treads_of_destruction:0 "Гусениці Руйнування"
bra_treads_of_destruction_desc:0 "Броньовані велети не залишать жодного ворожого укріплення цілим, жодного бліндажу — не пройденим. Вони проб’ють оборону, відкриваючи шлях нашій піхоті."

bra_taking_to_the_skies:0 "Підкорити Небеса"
bra_taking_to_the_skies_desc:0 "Римляни панували на землі, британці — на морі. Манітоба пануватиме в нову епоху — в повітрі."

bra_establish_royal_airforce:0 "Заснувати Королівські Повітряні Сили"
bra_establish_royal_airforce_desc:0 "Земля розбита, води отруєні, але небо лишається чистим. Нехай вороги тремтять, а народ аплодує, побачивши знак КМПС — Королівських Манітобських Повітряних Сил."

bra_royal_airsquadron:0 "Королівська Авіаескадрилья"
bra_royal_airsquadron_desc:0 "Мати літаки — одне. Вміти ними користуватись — інше. Завдяки довоєнним підручникам і нашим новим асам, ми сформуємо доктрину, якій заздритиме весь Вестленд."

bra_deepen_the_ports:0 "Поглибити Порт"
bra_deepen_the_ports_desc:0 "Щоб збудувати флот, здатний кинути виклик Трьом Річкам, нам потрібен порт, що вмістить великі судна. Наші інженери викопають гавань, здатну приймати кораблі нового класу."

bra_copy_three_rivers_design:0 "Скопіювати Проекти Трьох Річок"
bra_copy_three_rivers_design_desc:0 "Ми змогли відтворити методи будівництва флоту Трьох Річок. Хоч вони вже й пішли далі — це скоротить розрив між нами."

bra_secure_better_materials:0 "Забезпечити Якісніші Матеріали для Кораблебудування"

bra_the_royal_shipyards:0 "Королівські Верфі"
bra_the_royal_shipyards_desc:0 "Колись Королівство мало флот, що панував на озерах і річках, захищаючи наші торгівельні шляхи. Після зради Альберта все це занепало. Час це виправити."

bra_hire_foreign_shipbuilders:0 "Найняти Бізмаркських Кораблебудівників"
bra_hire_foreign_shipbuilders_desc:0 "Майстри з Бізмарка допоможуть нам відновити флот і поділяться знанням про нові конструкції суден, здатних зрівнятися — а то й перевершити — флот Трьох Річок."

bra_ruling_the_waves:0 "Панувати на Хвилях"
bra_ruling_the_waves_desc:0 "Захопити води Трьох Річок — лише початок. Наша справжня мета — контроль усіх шляхів Королівства."

bra_the_revenge:0 "ГМС Брендон"
bra_the_revenge_desc:0 "Річковий баркас ГМС «Брендон» стане гордістю нашого флоту — поряд з ГМС «Дофін». Їхня присутність змусить Три Ріки тримати флот напоготові — що послабить їхню блокаду нашої економіки."

bra_river_patrols:0 "Річкові Патрулі"
bra_river_patrols_desc:0 "Ці човни малоефективні в бою — капітани називають їх 'вісімхвилинками'. Але вони зможуть відволікти ворога від важливіших цілей."

bra_by_land_and_by_sea:0 "Морем і Сушею"
bra_by_land_and_by_sea_desc:0 "Флот важливий, але без піхоти — марний. Королівські морпіхи працюватимуть лише в тісній координації з морським командуванням."

bra_controlling_the_manitoba:0 "Контроль Над Манітобою"
bra_controlling_the_manitoba_desc:0 "Озера — життєві артерії Королівства. Ми не можемо дозволити, щоб їх забрали знову. Квітка Манітоби майорітиме над водами вічно."

bra_appoint_new_captain:0 "Призначити Нового Капітана Гвардії"
bra_appoint_new_captain_desc:0 "Останній капітан гвардії помер від старості, лише через кілька днів після страти свого наступника за боягузтво. Відтоді Король не призначає нового — можливо, через страх. Але Гвардія сильна рівно настільки, наскільки сильний її лідер."

bra_train_new_elites:0 "Навчити Нову Еліту"
bra_train_new_elites_desc:0 "Наша програма підготовки зробить з наших елітних вояків предмет заздрощів всього Півночі. Це буде провідна сила нашого війська."

bra_loyal_rangers:0 "Вірні Лісники Його Величності"
bra_loyal_rangers_desc:0 "Королева привезла з собою свиту, зокрема — найгрізніших рейнджерів Канадського Півночі. Їхній досвід варто інтегрувати до нашого війська."

bra_improved_armor:0 "Покращена Елітна Броня"
bra_improved_armor_desc:0 "Деякі обладунки наших елітних вояків нагадують середньовічних лицарів — згідно з легендами та музейними експонатами. Проте ця подібність суто зовнішня: броню адаптовано до стрілецької та лазерної зброї."

bra_expand_their_duties:0 "Розширити Їх Обов’язки"
bra_expand_their_duties_desc:0 "Кожен гвардієць — вправний боєць, але існують загрози, що не зупиняються револьвером чи снайпером. Має бути створено друге крило Королівської Гвардії — для захисту сім’ї монарха від підступніших ворогів."

bra_under_kings_banner:0 "Під Стягом Короля"
bra_under_kings_banner_desc:0 "Легендарний стяг королів, уперше винесений на поле бою самим Ґанном, має глибоке символічне значення. Якщо ми знову піднімемо його в бій — наші солдати підуть за ним хоч у пекло."

bra_loyalty_unto_death:0 "Вірність До Смерті"
bra_loyalty_unto_death_desc:0 "Не ридай, мати — твоя дитина віддала себе, щоб жила ти. Не журись, батьку — боєць твій помер, щоб ти міг жити. Не тужи, брате чи сестро — вони спочиватимуть із побратимами, щоб ти не мусив іти за ними."

bra_ancient_dynasty:0 "Стародавні Династії"
bra_ancient_dynasty_desc:0 "Більшість манітобських аристократів мають корені в занепалих герцогствах Абсалон, Анжер, Дофін і Ворік, а також у Гудзоновій Компанії. Та їхня сила згасла після Повстання Метисів і Республіканської Війни."

bra_culture_of_might:0 "Культура Могутності"
bra_culture_of_might_desc:0 "Кожен підданий мріє стати ближчим до монархів — хоча б щоб скуштувати їхнього розкошу. А найпростіший шлях до цього — проявити силу в бою."

bra_vault_grade_factories:0 "Заводи Рівня Сховищ"
bra_vault_grade_factories_desc:0 "У старих бункерах аристократії досі зберігаються старосвітські верстати. Якщо ми зможемо їх відтворити — це дасть великий поштовх нашій промисловості."

bra_we_worthy_few:0 "Ми — Гідна Жменя"
bra_we_worthy_few_desc:0 "Герцогство Дофін — тісна спільнота для збереження лояльності. Але тепер, як частина Королівства, можливо час приймати нових людей до служби."

bra_old_world_guns:0 "Зброя Старого Світу"
bra_old_world_guns_desc:0 "Більшість гвинтівок Королівської Гвардії давно зносилася, але деякі ще стріляють. Якщо дати їх на вивчення вченим — вони, можливо, навчаться відтворювати ці зразки."

bra_a_new_blade:0 "Нове Лезо"
bra_a_new_blade_desc:0 "У цю мить потреби, шляхетні роди Королівства демонструють свою відданість — надаючи нам нові збройні заводи й озброєння зі своїх запасів."

bra_stabilizing_the_realm:0 "Стабілізація Корони"
bra_stabilizing_the_realm_desc:0 "Корона — це стабільність. Холодна, стримана, та все ж саме її хоче народ більше за все."

bra_hunting_down_the_bandits:0 "Полювання на Бандитів"
bra_hunting_down_the_bandits_desc:0 "Бандити з Банк-Енду давно дошкуляють цивілізованим людям. Час покласти край їхнім набігам — якщо треба, з кулею в лоба."

bra_settle_the_west:0 "Заселення Заходу"
bra_settle_the_west_desc:0 "Народ Ланґенбурга тепер може заселити західну долину — забезпечивши нову землю для нашого народу."

bra_circum_three_rivers:0 "Обійти Три Ріки"
bra_circum_three_rivers_desc:0 "Економічна блокада [WPG.GetAdjective] на переправі Істервіль відрізає нас від озера Уінніпеґ і Червоних Вод. Настав час самостійно забезпечувати себе всім необхідним."

bra_guarentee_hudson:0 "Ми Туди Більше Не Ходимо"
bra_guarentee_hudson_desc:0 "Блайтвуд, вкрите червоним туманом, кишить монстрами, ворожими до будь-якого контакту. Але ми мусимо пройти ці землі, аби вийти до північних рік."

bra_gather_the_banners:0 "Зібрати Стяги"
bra_gather_the_banners_desc:0 "Колись під прапорами Корони ходили армії з десятків герцогств. Сьогодні їх лишилося кілька — але слава служби ще жива. Можливо, все, що потрібно — це нагадати їм про обов’язок."

bra_striking_north:0 "Вадіна чи Війна"
bra_striking_north_desc:0 "Електорат здається нормальним, але за лаштунками правлять тіньові сили. Це ще півбіди. Гірше те, що вони утримують нашу манітобську землю."

bra_striking_north_tt:0 "Ефект, якщо вони §Gпогодяться§!:\nКонтроль над £state §YWadena§! переходить до §Y[BRA.GetFlag] [BRA.GetNameDef]§!.\n\nЕфект, якщо вони §Rвідмовлять§!:"

bra_support_stoon:0 "Друзі в Електораті"
bra_support_stoon_desc:0 "Наші відносини з Електоратом завжди були нестабільні, але деякі все ще готові працювати з нами. Треба зробити так, аби П’єр Соломон був серед них."

bra_support_arborg:0 "Фінансування Арборга"
bra_support_arborg_desc:0 "Якщо наші найманці в Арборзі мають бодай якийсь шанс повернути бунтівні землі, їм знадобиться наша допомога. Постачання через озеро та нові волонтери-монархісти допоможуть відновити владу Корони в Вінніпезі."

bra_heir_apparent:0 "Очевидна Спадкоємиця"
bra_heir_apparent_desc:0 "На відміну від зрадника графа Йорктонського, Елеанора Йорктон довела свою вірність трону Манітоби. Вона також допомогла відновити Ланґенбург. Можливо, варто передати їй управління ще деякими землями як знак вдячності за її відданість."

bra_convince_stormmongers:0 "Платити Найманцям"
bra_convince_stormmongers_desc:0 "[UNB.GetNameDefCap] і [RCK.GetNameDef] — уособлення того варварства, яке ми заснували Королівство, щоб стримувати. Проте історія створює дивні союзи, і з кількома рушницями та сяючими скельцями, ми зможемо переконати їх ударити в тил Другій Коаліції, якщо ті ризикнуть напасти."

bra_conquering_the_gateway:0 "Підкорення Брами"
bra_conquering_the_gateway_desc:0 "Північні ріки, що живлять більшість західноканадських країн, можна контролювати з однієї позиції. Ці території повинні служити добробуту Корони, а не збагаченню самозванців."

bra_restoring_hudson_river_company:0 "Оновити Королівську Хартію"
bra_restoring_hudson_river_company_desc:0 "Після звільнення руїн Гудзонової Затоки ми можемо відновити королівські території, втрачені через Блайтвуд. Поновлення Хартії Гудзонової Компанії дозволить знову налагодити торгівлю та видобуток ресурсів."

bra_end_false_republic:0 "Кінець Фальшивій Республіці"
bra_end_false_republic_desc:0 "Боягузи з Республіки зрадили свої клятви, і їхні солдати вчинять так само. Наші війська маршируватимуть із гідністю, бо правда — на нашому боці."

bra_end_the_congress:0 "Повернути Метисів"
bra_end_the_congress_desc:0 "[MTC.GetNameDefCap] першими зрадили нас, дозволивши [WPG.GetNameDef] підняти голову. Тепер, як і годиться, саме ми покладемо їм край."

bra_second_coalition_war:0 "Війна Другої Республіканської Коаліції"
bra_second_coalition_war_desc:0 "Наші найгірші страхи справдились. Зрадники з [WPG.GetNameDef] і [MTC.GetNameDef] знову об'єдналися, щоб знищити нас. Але цього разу все буде інакше. Хай живе Манітоба!"

bra_crown_land_expansion:0 "Найвеличніший День Королівства"
bra_crown_land_expansion_desc:0 "Перемога! Наш сором помстився, зрадники знищені. Народ радіє, бо Королівство відновлено. Це — наша найславетніша мить!"

# Regency and reformist path
bra_pulling_the_strings:0 "Порожній Трон"
bra_pulling_the_strings_desc:0 "Короля давно не бачили, і чутки про його здоров’я ширяться за межами палацу. Треба діяти рішуче, поки інші не скористались ситуацією."

bra_dreams_of_federation:0 "Мрії про Співдружність"
bra_dreams_of_federation_desc:0 "Замість централізації, можливо варто спробувати інший підхід — Співдружність. Новий спосіб залишитися єдиними, не ризикуючи нестабільністю після смерті монарха."

bra_promise_peoples_voice:0 "Дати Народові Голос"
bra_promise_peoples_voice_desc:0 "Жоден лідер, навіть великий Ґанн II, не живе вічно. Таннер вважає, що демократизація — єдиний шанс для виживання Королівства. Але це буде демократія з принципом 'одна людина — один голос'."

bra_retire_queen:0 "Відіслати Королеву"
bra_retire_queen_desc:0 "Королева стала відчуженою від народу. Світло її доброти згасло разом із її чоловіком. Найменше, що ми можемо зробити — дати їй спокій дожити дні геть від інтриг палацу."

bra_towards_common_good:0 "Заради Спільного Блага"
bra_towards_common_good_desc:0 "Мудрі лідери знають, що добробут суспільства починається з єдності. Таннер хоче будувати нову Манітобу на основі спільного блага."

bra_integrate_landenburg:0 "Інтеграція Суб'єктів"
bra_integrate_landenburg_desc:0 "Після Першої Війни з Республіками ми мали шанс створити спільну систему управління. Натомість повернули старий лад, що вже зазнав краху. Ми виправимо цю помилку — керуватимемо самі."

bra_abolish_ancestor_cult:0 "Скасувати Культи Предків"
bra_abolish_ancestor_cult_desc:0 "Занадто довго ресурси тримали у руках тих, хто не заслуговує. Чи дозволив це Ґанн II через сентиментальність — невідомо. Але ми не маємо повторювати його помилки."

bra_head_tax:0 "Замінити Подушний Податок"
bra_head_tax_desc:0 "Реформи потребують грошей. Саме тому шляхетство тепер сплачуватиме більше, ніж простолюдини. Архаїчний подушний податок піде в історію."

bra_end_reliance_on_elites:0 "Відкрити Наші Ряди"
bra_end_reliance_on_elites_desc:0 "Корона завжди покладалася на елітні загони для захисту своїх прав, але цей підхід вже не працює. Кваліфіковані вояки з простолюду, як Вільям Таннер — колишній Звіролов Короля — довели свою цінність."

bra_centralized_government:0 "Централізоване Управління"
bra_centralized_government_desc:0 "Час навести порядок серед підлеглих. Ми проголосимо родину Дюбуа серцем держави, й діятимемо в тіні живого мерця — допоки не будемо готові самі здобути корону."

bra_broken_hearts:0 "Зламане Серце"
bra_broken_hearts_desc:0 "Досі вважалося неввічливим говорити з королевою, що сумує за чоловіком. Але скоро піднімуть питання про її претензії на трон... Можливо, буде краще, якщо вона возз’єднається з Ґанном. Закохані й не таке робили."

bra_silence_opposition:0 "Придушити Опозицію"
bra_silence_opposition_desc:0 "До протестів ми звикли. Прибрати кілька голосів із химерними ідеями — не проблема."

bra_enforce_direct_control:0 "Пряме Управління"
bra_enforce_direct_control_desc:0 "Свобода — природний стан людини. Але й жування живого обіду на дереві — теж. Час обрати краще."

bra_freedom_blood_saltpepper:0 "Реорганізація Королівства"
bra_freedom_blood_saltpepper_desc:0 "З волі народу та за останнім наказом Ґанна II, Вільям Таннер офіційно розпускає Королівство та формує Співдружність Манітоби."

bra_dog_based:0 "Ідентифікація за Псом"
bra_dog_based_desc:0 "Всі мусять зрозуміти, що це федеральна програма ідентифікації собак, і віднині кожен має постійно носити з собою свого пса. Закон є закон."

bra_border_protection:0 "Захист Кордонів"
bra_border_protection_desc:0 "Величезні північні простори давно ускладнювали охорону. Тепер ні. Завдяки старим американським кресленням ми створимо кібер-псів — патрулюватимуть та нюхатимуть зрадників."

bra_strong_together:0 "Сила Зграї"
bra_strong_together_desc:0 "\"Моя політика щодо війни? Це війна — на морі, суші й у повітрі, всіма силами. Війна проти монструозної тиранії, перемога попри всі жахи.\""

bra_false_democracies:0 "Фальшиві Демократії"
bra_false_democracies_desc:0 "Електорат — просто рейдери в масці демократії. Час приручити скажених псів і очистити територію."

bra_danger_in_dakota:0 "Небезпека в Дакоті"
bra_danger_in_dakota_desc:0 ""

bra_north_west_mounted_police:0 "Розширити Поліцію Північного Заходу"
bra_north_west_mounted_police_desc:0 "Маунті — захисники Канади. Таннер доведе, що вони служать усім, не лише манітобцям. Пора зробити їх по-справжньому всенародними."

bra_topple_families:0 "Скинути Обидві Родини"
bra_topple_families_desc:0 "Двійця правителів Стампіду прикривається народом. Брехня. Їхня династія повинна впасти — на випередження."

bra_secure_interlake:0 "Закріпити Інтерлейк"
bra_secure_interlake_desc:0 "Землі за озером Уінніпеґозис — ключові для оборони. Найсхідніша межа Королівства має бути захищена від рейдерів і решток Коаліції."

bra_head_in_clouds:0 "Спустити Небесних на Землю"
bra_head_in_clouds_desc:0 "Анбаунди — пихаті рейдери під видом мрійників. Ми зіб’ємо їх із неба, вогнем і полум’ям."

bra_planes_fly_again:0 "Оборона Прерій"
bra_planes_fly_again_desc:0 "Після того як Анбаундів поховали, ми можемо скористатись їхнім повітряним флотом. Над преріями ширятимуть наші крила."

bra_closing_market:0 "Вибачте, Ми Закриті!"
bra_closing_market_desc:0 "Міддлмарк — гнійна пляма Америки в Канаді, символ жадібності. Ми закриємо їхній магазин назавжди, разом із рейдерами, що там сховались."

bra_cheap_knock_offs:0 "Дешеві Підробки"
bra_cheap_knock_offs_desc:0 "Ми закрили той розумний супермаркет, але його товари все ще згодяться. Може, й без гарантії Міддлмарку — зате швидко й дешево."

bra_old_rivals:0 "Старі Супротивники"
bra_old_rivals_desc:0 "Століття потому ми знову зустрілись із рештками КПФ. Їхній шлях провалився, як ми й попереджали. Тепер покладемо край останньому червоному бастіону. Редмонд згорить."

bra_nwmp_security_service:0 "Служба Безпеки Маунті"
bra_nwmp_security_service_desc:0 "Королівська Гвардія — релікт старої епохи, але їхні навички — безцінні. Ми реорганізуємо їх у Службу Безпеки Маунті — щоби боронити народ від невидимих загроз."

bra_living_up_to_our_namesake:0 "Виправдати Ім’я"
bra_living_up_to_our_namesake_desc:0 "Який Маунті без свого коня? Хоч ми й носили цю назву, їздити верхи вже давно не могли. Та тепер Канадська Вершена Поліція знову осідлає прерії!"

bra_establish_frontier_outposts:0 "Форпости На Кордоні"
bra_establish_frontier_outposts_desc:0 "Захід звільнено, але треба гарантувати, що ворог не повернеться. Серія форпостів у колишніх столицях забезпечить наш контроль."

bra_prioritize_prairie_operations:0 "Операції в Преріях"
bra_prioritize_prairie_operations_desc:0 "Міста заходу під контролем, але прерії — ще ні. Маємо якнайшвидше розгорнути операції, щоб закріпити тут нашу владу."

bra_ranger_force:0 "Сила Рейнджерів"
bra_ranger_force_desc:0 "Маунті — кістяк нашої армії. Їхнє виснажливе навчання — ключ до нашої переваги. Краще бути одним сильним Ведмедем, ніж сотнею слабких Биків."

bra_frontiersman_legion:0 "Легіони Піонерів"
bra_frontiersman_legion_desc:0 "Маунті ведуть, але саме звичайні піонери тримають лінію. З належною підготовкою вони знатимуть ці пустки, як свої гвинтівки."

bra_red_serge:0 "Червоний Серж"
bra_red_serge_desc:0 "Червоний Серж — суть Маунті. Це символ Канади, безпеки, довіри. Якщо вдосконалити виробництво, він стане ще й чудовим зимовим одягом."

bra_battle_battleford:0 "Битва за Батлфорд"
bra_battle_battleford_desc:0 "Останній зрадник Манітоби. Альберт може вважати себе принцом, але він лише князь піратів. Час стерти рештки гнилого дворянства."

bra_cab_vultures:0 "Інший Засіб Пересування"
bra_cab_vultures_desc:0 "Наші серця належать коням, але розум каже — мотор кращий. На сталевих конях ми доженемо навіть найшвидших рейдерів."

bra_commissioned_privateers:0 "Залучити Приватерів"
bra_commissioned_privateers_desc:0 "Серед людей Альберта є ті, хто пам’ятає Королівський прапор. Дамо їм амністію — і отримаємо досвідчених моряків."

bra_north_volunteer_corps:0 "Північний Добровольчий Корпус"
bra_north_volunteer_corps_desc:0 "Ми не дозволимо чужинцям розкрадати останні оплоти цивілізації Канади. Доки ми живі — північ не впаде."

bra_arborg_citadel:0 "Цитадель Арборґ"
bra_arborg_citadel_desc:0 "Завдяки хунті Арборґ вже добре укріплений. Він стане нашою східною твердинею, незламною цитаделлю над озерами."

bra_northern_guard_dog:0 "Північний Сторожовий Пес"
bra_northern_guard_dog_desc:0 "Наша Співдружність сильна та єдина. Як Таннер пильнує її, так і ми будемо стежити за всією північчю."

bra_all_roads_lead_to_brandon:0 "Всі Дороги Ведуть до Брендона"
bra_all_roads_lead_to_brandon_desc:0 "Єдність — не лише слова, а дії. Внутрішні дороги з’єднають наш край, і він стане єдиним тілом."

bra_recruit_outsiders:0 "Канадський Заклик"
bra_recruit_outsiders_desc:0 "Північ менш заселена, ніж південь. Щоби зрівнятись із силами варварів, маємо вербувати кожного канадця, готового боротися."

bra_mining_equipment:0 "Сучасне Гірниче Обладнання"
bra_mining_equipment_desc:0 "Ресурси Канади досі багаті, й американці лише почали до них торкатись. Обладнання лишилось — слід його відновити."

bra_fund_new_industries:0 "Фінансування Нових Індустрій"
bra_fund_new_industries_desc:0 "Малий кредитний фонд для середнього класу дозволить створити нові бізнеси. Хтось прогорить, але інші принесуть прибуток."

bra_canadian_arms:0 "Стандартні Канадські Гвинтівки"
bra_canadian_arms_desc:0 "Щоби перемогти сильнішого ворога, маємо мати перевагу в озброєнні. Інакше — нас зітруть числом."

bra_common_prosperity:0 "Гарантовані Права"
bra_common_prosperity_desc:0 "Їжа, житло, освіта — базові права кожного. Дехто сумнівається, що ми готові нести цей тягар. Але якщо не зараз — то коли?"

bra_introduce_gold_standard:0 "Біметалевий Стандарт"
bra_introduce_gold_standard_desc:0 "Перехід від золотого стандарту до біметалевого розлютить банкірів. Але це не заради розкоші — а заради довготривалої стабільності."

bra_pre_war_schemes:0 "Довоєнні Схеми"
bra_pre_war_schemes_desc:0 "У кожної великої справи три етапи: спочатку — неможливо, потім — важко, а далі — вже зроблено."


bra_power_balance:0 "Утримати Баланс Влади"
bra_power_balance_desc:0 "Бути абсолютним монархом значно важче, ніж лідером, обраним через якусь дурнувату схему збагачення на голосах. Принаймні, в монархії народ одразу знає, що винен саме король."

bra_secure_western_approach:0 "Добити Електорат"
bra_secure_western_approach_desc:0 "Кривавий Електорат — лише колючка в нашому боці. Попри зовнішній вигляд уряду, це лишень шайка рейдерів, що тероризує наш кордон. І, звісно ж, їхня любов до 'виборів' — ще одна причина, чому їх слід знищити."

bra_the_last_march:0 "Остання Марка"
bra_the_last_march_desc:0 "Попри зраду Лейфа Йорктона, більшість мешканців [DLN.GetNameDef] повернулися до вірності трону. Їх нарешті можна інтегрувати до [BRA.GetNameDef], хоча Елеонор Йортон збереже адміністративну владу над регіоном."

bra_rock_ridge_memorial:0 "Пам’ятаймо Стоунволл"
bra_rock_ridge_memorial_desc:0 "Битва при Стоунволлі — болюча рана в серцях багатьох. Там загинув король Брендон XI, що завдало нищівного удару по моральному духу армії. Найменше, що ми можемо зробити — встановити меморіал на його честь."

bra_nunavut_diplomacy:0 "Налагодити Дипломатію"
bra_nunavut_diplomacy_desc:0 "Північніше Манітоби, за Великою Білою Стіною, лежить Нунавут — регіон, що вижив без прямих ядерних ударів. Тепер, маючи доступ до Гудзонової затоки, ми можемо дізнатися, як їм вдалося вижити в цій ядерній зимі."

bra_western_bulwark:0 "Західний Бастіон"
bra_western_bulwark_desc:0 "За нашим західним кордоном — потенційні загрози. Маємо залишатися пильними, ліквідовуючи дрібні сили, що можуть відволікти нас від справжньої небезпеки."

bra_vow_to_vanquished:0 "Горе Переможеним"
bra_vow_to_vanquished_desc:0 "Тепер, коли хибну республіку знищено, настав час зв'язатись із О’Браєном і взяти під контроль його [ARB.GetName]. Ми фінансували його, і хоч він колишній найманець, стабілізував регіон. Як нагороду він отримає титул віконта."

bra_the_interlake_guard:0 "Варта Інтерлейку"
bra_the_interlake_guard_desc:0 "О’Браєн виконав своє завдання, але довіряти йому — дурість. Щоб не втратити Уінніпеґ знову, ми відправимо нове королівське військо. А О’Браєну дамо гідну пенсію."

bra_the_grand_duchy:0 "Велике Герцогство"
bra_the_grand_duchy_desc:0 "Попри розгром Йорктона, деякі мешканці Ланґенбурґа ще тішаться самостійністю. Щоб уникнути нової зради, ми реорганізуємо марку у Велике Герцогство під мудрим керівництвом Елеонор Йорктона."

bra_iron_confederacy_diplomacy:0 "Повернення Півночі"
bra_iron_confederacy_diplomacy_desc:0 "Наш північний кордон завжди був слабким, і саме тому ми втратили його під час Першої Коаліційної Війни. Настав час повернути наші території від рук [IRC.GetNameDef]."

bra_trains_run_on_time:0 "Пацифістські Починання"
bra_trains_run_on_time_desc:0 "Уникаючи війни, з’являється шанс розвиватись. У Мус-Джо відкрили нові інститути, присвячені довоєнному суспільному розвитку. Їх знання стануть нам у пригоді."

bra_fort_cap_hell:0 "Відновити Форт Кап-Гелл"
bra_fort_cap_hell_desc:0 "Колись найбільша в’язниця Манітоби, Форт Кап-Гелл був пострахом злочинців. Але після повстання метисів там вибухнув бунт. Час знову загнати їх до кліток."

bra_old_crownlands:0 "Королівська Земля"
bra_old_crownlands_desc:0 "[ROL.GetNameDef] колись належали до королівських володінь, але зрадницьки відкололись під час повстання Трьох Річок. Тоді ми не могли боротись на два фронти. Тепер — можемо."

bra_eastern_bulwark:0 "Східний Бастіон"
bra_eastern_bulwark_desc:0 "Схід завжди був небезпечним. Монстри в Онтаріо, рейдери в Міннесоті. Нам слід укріпити наші позиції та переконатися, що культистів із Дакоти ми теж не залишимо без уваги."

bra_mad_mongers:0 "Повернення Нашого Вассала"
bra_mad_mongers_desc:0 "Мус-Джо колись був під нашою опікою як королівський васал з усіма правами громадянства Манітоби, поки не вибухнуло повстання Конгресу Метисів. Як рішучі пацифісти, вони часто ставали жертвами тиску з боку сусідів — допоки ми не запропонували їм місце в нашому Королівстві."

bra_oath_of_loyalty:0 "Клятва Вірності"
bra_oath_of_loyalty_desc:0 "Ми не можемо допустити повторення того, що принесли Повстання Метисів чи Перша Коаліційна Війна. Кожен підданий має присягнути на вірність лише Королівству Манітоба. Манітоба стояла незламною 200 років — і стоятиме ще стільки ж."

bra_cybernetic_augmentation:0 "Кібернетичне Підсилення"
bra_cybernetic_augmentation_desc:0 ""

bra_psychological_therapies:0 "Стримати Звіриність"
bra_psychological_therapies_desc:0 ""

bra_biological_rejuvenation:0 "Без Вибору, Без Часу"
bra_biological_rejuvenation_desc:0 ""

bra_autocratic_authority:0 "Авторитарна Влада"
bra_autocratic_authority_desc:0 "Королівство будували герцогства та знать, але історія чітко показала — їм не можна довіряти. Щоб зберегти єдність, Король Ґанн централізує владу навколо Корони. Одна воля — спрямована на захист Манітоби."

bra_shared_industry:0 "Інтеграція Економіки"
bra_shared_industry_desc:0 "Поділ Королівства на герцогства з власними економіками призводив до неефективного розподілу ресурсів. З федералізацією, запропонованою Ґанном II, буде впроваджено єдині стандарти та регуляції для спрощення виробництва."

bra_shared_military:0 "Армія Королівства"
bra_shared_military_desc:0 "Віддавати військову силу герцогам — це шлях до зради. Ми вже розпустили лицарські ордени й підняли рейнджерів. Настав час остаточно позбавити знать військової влади."

bra_our_best_supplier:0 "Наш Найкращий Постачальник"
bra_our_best_supplier_desc:0 "Бісмарк завжди був надійним джерелом товарів і зброї. Тепер, маючи прямий доступ, ми маємо запропонувати їм захист — як подяку. Королівство не забуває друзів."

bra_gauss_rifles:0 "Бісмарківська Зброя"
bra_gauss_rifles_desc:0 "З інтеграцією Бісмарка до нашої сфери впливу, слід посилити економічну співпрацю. Бісмарк славиться своїм озброєнням, і закупівля його для нашої армії — розумне рішення."

bra_new_census:0 "Провести Перепис"
bra_new_census_desc:0 "Через розширення територій нам слід розробити метод оцінки населення. Навіть грубі підрахунки допоможуть у фінансуванні та наборі військ."

bra_shared_civ:0 "Поділитися Достатком"
bra_shared_civ_desc:0 "Попри згасаючі спогади, Ґанн II десятиліттями зберігав у серці образ довоєнної Манітоби. Одного імені недостатньо — ми маємо повернути і її рівень життя."

bra_landreform:0 "Земельна Реформа"
bra_landreform_desc:0 "Роздача менших наділів дрібній знаті та простолюду ослабить великих аристократів і зміцнить владу монарха. До того ж, місцеві власники краще знають свої землі."

bra_interconnected_production_centers:0 "Об’єднані Промислові Центри"
bra_interconnected_production_centers_desc:0 "До Війни Канаду поєднували великі автостради. Тепер — знову. Індустріальне серце Манітоби качатиме товари та зброю через асфальтові артерії."

bra_heart_of_the_nation:0 "Серце Нації"
bra_heart_of_the_nation_desc:0 "Королівські землі — серце нашої промисловості. Щільність населення забезпечує робочу силу, а водні шляхи відкривають ринки для торгівлі."

bra_securing_our_new_borders:0 "Забезпечити Нові Кордони"
bra_securing_our_new_borders_desc:0 ""

bra_ending_decadence:0 "Припинити Декаденс"
bra_ending_decadence_desc:0 "Повстання метисів, революція Трьох Річок, зрада герцогині Софі — все це наслідок занепаду аристократії. Колись звання дворянина щось означало. Пора повернути повагу через службу, а не танці й бенкети."

bra_empower_queen:0 "Посилити Владу Королеви"
bra_empower_queen_desc:0 "Попри сумніви в символізмі Манітоби, Королева Кетрін дбає про людей не менше за Ґанна II. Наділення її більшою владою полегшить тягар, що лежить на ослаблому Королі, і… якщо щось станеться…"

bra_pristine_rose_order:0 "Орден Непорочної Троянди"
bra_pristine_rose_order_desc:0 "Під патронатом королеви Кетрін, Орден Непорочної Троянди об'єднує тих, хто прагне захищати народ Королівства, але не здатен або не бажає брати до рук зброю. Медики, лікарі та медсестри — всі, хто необхідний для збереження життя наших громадян і армії."

bra_civil_code:0 "Оновлений Цивільний Кодекс"
bra_civil_code_desc:0 "Аристократія Манітоби знову й знову показує, що не може дбати про загальне благо Королівства. Вони зосереджені лише на власних герцогствах і маєтках. Але відтепер їхні обов’язки мають бути спрямовані винятково на служіння Королю."

bra_all_are_equal:0 "Рівне Правозастосування"
bra_all_are_equal_desc:0 "Здавалося б, громадяни Королівства, очолюваного гулем, мали б бути більш толерантними. Хоча мутанти мають юридичну рівність, вони часто стикаються з упередженнями. Забезпечення дотримання цих законів зміцнить довготривалу стабільність Королівства."

bra_inheritance_laws:0 "Закони про Спадщину"
bra_inheritance_laws_desc:0 "Культи предків свого часу допомагали утримувати королівське багатство під контролем. Але з часом корупція проникла в родини, що володіли цими скарбами, і багатство почало служити приватним інтересам. Відтепер спадок спочатку переходить до спадкоємця, призначеного монархом, хоча культи предків залишаються на випадок іншого розвитку подій."

bra_state_fund_education:0 "Державне Фінансування Освіти"
bra_state_fund_education_desc:0 "Після нещодавніх реформ, що обмежують владу аристократії, зросла сила як монарха, так і простого народу. Замість витрат на бюрократію, доцільніше інвестувати в освіту, щоб дати громадянам автономію та соціальну мобільність, замінивши тим самим обов’язки дворянства."

bra_great_northern_university:0 "Великий Північний Університет"
bra_great_northern_university_desc:0 "Заснування університету в серці Манітоби сприятиме єдності народу Королівства, об’єднавши вчителів, науковців та інші видатні уми з усієї країни. Саме тут ми відкриємо таємниці Старого Світу та продовжимо відновлення зруйнованої цивілізації."

bra_intensive_rnd:0 "Інтенсивні Дослідження й Розробки"
bra_intensive_rnd_desc:0 "Наші нові дослідники невтомно вивчають старі посібники й проводять експерименти. Це дало плоди в електронному секторі, хоча надмірна зосередженість на «увімкненні світла» трохи загальмувала загальний прогрес."

bra_king_peace:0 "Мир Короля"
bra_king_peace_desc:0 "На тлі війни й завоювань легко забути, що остаточна мета Ґанна ІІ — був мир. Тепер, коли Манітоба знову об'єднана під єдиною владою, ми можемо розпочати нову еру спокою й добробуту — таку, яку колись знали її мешканці."

bra_maintain_the_union:0 "Збереження Союзу"
bra_maintain_the_union_desc:0 "Тепер, коли лояльність Ланґенбурґа та інших підданих відновлено, настав час міцніше прив’язати їх до Корони. Королівство ледь не загинуло через розділення. Віднині союз герцогств з Короною мусить бути збережений."

bra_imperial_majesty:0 "Імперська Величність"
bra_imperial_majesty_desc:0 "Сьогодні Королівство — маяк цивілізації й миру у крижаній Півночі. Його армії міцні, промисловість процвітає, а народ живе в комфорті. Вся Манітоба єдина навколо Корони й монарха. Хай живе Манітоба!"

# Shared
bra_welcome_back_metis:0 "Реінтеграція Метисів"
bra_welcome_back_metis_desc:0 "[MTC.GetNameDefCap] увійшли в історію як перші [BRA.GetAdjective] землі, які проголосили незалежність від Корони — і перемогли у своєму повстанні. Але ця перемога була тимчасовою. Настав час знову прийняти їх до складу Королівства."

bra_welcome_back_three_rivers:0 "Відновлення Уінніпеґа"
bra_welcome_back_three_rivers_desc:0 "Уінніпеґ — колишня імперська столиця Королівства Манітоба, найбільше та найзаможніше місто регіону, а, можливо, і всієї Канади. Хоча [ROOT.Capital.GetName] нині є новою столицею, Уінніпеґ досі має стратегічну важливість для сходу країни."

bra_saskatchewan_farming:0 "Фермерство Саскачевану"
bra_saskatchewan_farming_desc:0 "На відміну від більшості територій самої Манітоби, землі Саскачевану були приєднані не через історичні підстави, а через свій аграрний потенціал. І сьогодні, особливо після зростання населення внаслідок війн, ця земля є джерелом нашого харчового достатку."

bra_pardon_louis_riel:0 "Посмертне Помилування Луї Ріеля"
bra_pardon_louis_riel_desc:0 "Історичний лідер метисів Луї Ріель був страчений старим канадським урядом за боротьбу за права свого народу. Якщо ми прагнемо їхньої лояльності — маємо виправити цю історичну несправедливість. У нашому Королівстві не буде місця дискримінації."

bra_western_railroad:0 "Завершити Дорогу Короля"
bra_western_railroad_desc:0 "Однією з причин нелояльності метисів і Трьох Річок була віддаленість Реджайни та Уінніпеґа від королівських земель. Забезпечення легкого доступу до цих міст допоможе усунути напругу в майбутньому."

bra_red_river_access:0 "Вихід до Червоної Ріки"
bra_red_river_access_desc:0 "Тепер, коли переправи Трьох Річок під нашим контролем, наші торговельні судна можуть вільно рухатись з озера Уінніпеґ до Червоної Ріки — і далі до ринків Міссісіпі, особливо до союзної Ліги Річок."

bra_aviation_academy:0 "Перезапуск Авіаакадемії"
bra_aviation_academy_desc:0 "Повітряні сили Трьох Річок перевершували нашу Королівську Авіацію, особливо завдяки добре навченим пілотам. Більшість із них проходила навчання в Академії авіації у Вінніпезі після Першої Коаліційної війни. Немає причин, чому ми не можемо скористатися цим закладом на свою користь."

bra_regina_industry:0 "Промисловість Реджайни"
bra_regina_industry_desc:0 "Місто Реджайна завжди було осередком технологічного розвитку — як у довоєнній Канаді, так і після Великої Війни в Королівстві Манітоба. Завдяки цьому його промисловість стала навіть розвиненішою, ніж у самих Королівських Землях."

bra_robotic_knowledge:0 "Досвід Метисів"
bra_robotic_knowledge_desc:0 "Під час Другої Війни Коаліції наші військові швидко визначили, що основною силою Метисів є активне використання непрямого вогню. Попри нашу неминучу перемогу, ми можемо ще більше посилити армію, застосувавши цей бойовий досвід."

bra_republican_airship:0 "Армійські Дирижаблі"
bra_republican_airship_desc:0 "Купці зі Східної Манітоби відігравали ключову роль в економічному успіху Королівства до свого повстання в Другій Війні Коаліції. Їхні дирижаблі доправляли вантажі з усього континенту й холодної Канади задовго до завершення будівництва Дороги Короля."

bra_manitoba_dam:0 "Гребля Ґранд-Рапідс"
bra_manitoba_dam_desc:0 "Хоча гребля Ґранд-Рапідс і не викликає асоціацій зі славою й могутністю, саме вона стала першою великою перемогою Королівства Манітоба. Розташована в міжозерному регіоні, вона забезпечувала молоде Королівство стабільною енергією, що дозволяло йому поширювати свій вплив і утверджувати гегемонію в перші роки існування."

bra_governing_new_lands:0 "Управління Новими Землями"
bra_governing_new_lands_desc:0 "У міру розширення поза межі старого Королівства Манітоба ми здобули не лише нові території, але й нових підданих. Щоб ефективно їх контролювати та інтегрувати в [BRA.GetAdjective] суспільство, потрібен новий підхід до управління."

bra_memories_of_occupation:0 "Спогади про Окупацію"
bra_memories_of_occupation_desc:0 "Саскатун має глибоке історичне коріння та досі пам’ятає про насильницьку анексію канадських земель Сполученими Штатами. Ми також не маємо забувати, заради чого ведемо боротьбу, й наскільки важливими є сильна та вірна армія для нашого виживання."

bra_strasbourg_sparkblades:0 "Команда «Страсбурзькі Іскролеза»"
bra_strasbourg_sparkblades_desc:0 "Одним з найпопулярніших — і найбільш осудних — видів дозвілля в Електораті стало хокейне змагання, найбільший стадіон якого розташовано в Страсбурзі. Місцева команда «Страсбурзькі Іскролеза» започаткувала популярність спорту навіть серед рейдерів, додавши до нього силову броню та пом’якшивши покарання за брутальну гру."

bra_curb_spectral_cabal:0 "Обмежити Вплив Спектрального Кабалу"
bra_curb_spectral_cabal_desc:0 "Спектральний Кабал надто довго мав вплив на землі Електорату. Щоб остаточно закріпити наш контроль, їх потрібно обмежити. Зрештою, монархії та таємні ордени рідко завершуються добре."

bra_exterminate_monsters:0 "Знищити Хижих Фей"
bra_exterminate_monsters_desc:0 "Монструозні Феї, які полюють у Поганих Лісах, мають бути знищені, перш ніж ми зможемо серйозно подумати про освоєння цих проклятих земель. Знищення цих істот також здобуде нам підтримку місцевих жителів."

bra_end_cannibals:0 "Позбутися Канібалів"
bra_end_cannibals_desc:0 "Канібалізм — один із наймерзенніших злочинів. Щоб інтегрувати народ Стуна, ми маємо повністю викорінити цю практику. Це також дозволить здобути підтримку притомних мешканців, які теж виступають проти канібалів."

bra_dangerous_research:0 "Небезпечні Дослідження"
bra_dangerous_research_desc:0 "«Кривавий Електорат» був відомий тим, що завжди прагнув здобути перевагу в бою. Якщо ми пристосуємо деякі з їхніх досліджень, зможемо досягти того ж. Проте сама природа цих експериментів — сумнівна в найкращому разі, і смертельно небезпечна в найгіршому."

bra_faery_knowledge:0 "Програма Фей"
bra_faery_knowledge_desc:0 "Програма Фей у Плезантдейлі була жахливою відповіддю на жахливу загрозу. Але відкидати її результати цілком — нерозумно. Використавши її напрацювання, ми зможемо створити нове захисне спорядження та спеціальне оснащення для наших елітних підрозділів."

bra_manifest_north:0 "Закріпити Ворота Півночі"
bra_manifest_north_desc:0 "Хоч ми і контролюємо МАНІФЕСТ Північ, численні рейдери й чудовиська, що колись підкорялися місцевому ШІ, все ще вештаються навколо Воріт. Якщо ми справді хочемо утвердитися на цих землях — їх потрібно знищити негайно."

bra_end_the_madness:0 "Покласти Кінець Божевіллю"
bra_end_the_madness_desc:0 "Колишні землі Дандерна приховують темні таємниці, народжені з ненависті та злоби. Поки це триває, жодні наші спроби правити тут не матимуть успіху. Настав час покінчити з цим — назавжди."

bra_destroy_red_forest:0 "Спалити Червоний Ліс"
bra_destroy_red_forest_desc:0 "Погані Ліси — це кривава пляма смерті та божевілля. Поки вони існують, їхнє зло житиме. Ми маємо спалити цю землю, аби з попелу постало нове життя."

bra_new_hudson_river_contracts:0 "Нові Контракти Гудзонової Компанії"
bra_new_hudson_river_contracts_desc:0 "Тепер, коли ми остаточно закріпили владу на нових землях, настав час використати ці ресурси. Видавши нові контракти Гудзоновій Компанії, ми зможемо інтегрувати економіку й ресурси в Королівство, а також підвищити нашу торговельну цінність."

