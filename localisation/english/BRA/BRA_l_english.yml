operation_mine_winnipegosis:0 "Мінування озера Уінніпеґосіс"
operation_mine_winnipegosis_desc:0 "Значна частина нашої території прилягає до озера Уінніпеґосіс, що робить його ідеальним місцем для перекидання військ Коаліції. Оскільки патрулювати кожен берег неможливо, ми можемо встановити міни в озері, щоб відлякати можливі морські атаки."

operation_mine_assiniboine:0 "Мінування річки Ассінібойн"
operation_mine_assiniboine_desc:0 "Річка Ассінібойн протікає прямо через нашу столицю Брендон. Якщо ворог зуміє висадитись, це може зруйнувати нашу оборону. Мінування річки посилить захист столиці."

operation_sabotage_three_river_forts:0 "Диверсія проти фортів Республіки"
operation_sabotage_three_river_forts_desc:0 "Республіка Трьох Річок збудувала потужні укріплення навколо Уінніпеґа, які ускладнюють наступ. Якщо ми пошлемо шпигунів для диверсій чи збору планів оборони, нам буде легше прорватися до їхніх міст."
operation_sabotage_three_river_forts_outcome_tt:0 "§YФорпости§! в §YСтоунволлі§! отримують §R2.00§! рівнів пошкодження."

### Рішення
bra_race_against_time:0 "Дилема Королівства"
bra_race_against_time_desc:0 "Після зникнення герцогині Софі багато хто серед наших рядів почав побоюватися найгіршого. Звіти Королівської Служби Безпеки невтішні: герцогиня, ймовірно, мертва, а граф Йорктонський намагається приховати цей очевидний факт. У поєднанні з нарощуванням військових сил та чутками про прибуття вигнаних Орденів Лицарів у віддалені куточки Королівства — ми повинні готуватися до того, що дедалі більше виглядає неминучим."

bra_manitoba_waits:0 "Манітоба Чекає"
bra_manitoba_waits_desc:0 "З ворогами з усіх боків ми не можемо дозволити собі помилкових кроків. Найбезпечніший варіант — реагувати на будь-яку агресію відповідно, доки ми продовжуємо організовувати Монтійців і мобілізувати людей і ополчення."

