BRA_tt_soon_believers:0 "Незабаром у гілці Старовірів!"
BRA_tt_every_march:0 "§3Наступний ефект спрацьовує в кожному марші Манітоби:§!\n"
BRA_tt_every_march_advanced:0 "§3Наступний ефект спрацьовує в кожному марші Манітоби:§!\nДодати виробництво §Y8§!£resources_strip|6 у столиці маршу"
