l_english:
BRA_king_gunn:0 "Ґанн ІІ"
BRA_king_gunn_desc:0 "Король Ґанн, другий цього імені, править Королівством з часів катастрофи Першої Коаліційної Війни. Давній гуль, він був свідком падіння Канади під натиском американської агресії, тоді ще як член парламенту. Він бачив, як у Манітобі розпався КНФ, і був присутнім при піднесенні Королівства під владою воєначальника Уінніпеґа. Тепер він носить ім’я першого короля, намагаючись втримати державу серед повстань і потрясінь.\n\nТа важка корона того, хто її носить. Ґанн був старим ще до Великої Війни, а зараз — ще старіший. Його мучить темне розкладання, відоме лише його коханій дружині Кетрін та правій руці — Таннеру. Він повинен діяти швидко, поки не згасне. Королівство має вистояти."
BRA_king_gunn_cured_desc:0 "Король Ґанн, другий цього імені, править Королівством з часів катастрофи Першої Коаліційної Війни. Давній гуль, він був свідком падіння Канади під натиском американської агресії, тоді ще як член парламенту. Він бачив, як у Манітобі розпався КНФ, і був присутнім при піднесенні Королівства під владою воєначальника Уінніпеґа. Тепер він носить ім’я першого короля, намагаючись втримати державу серед повстань і потрясінь.\n\nТепер, коли його розум і держава зцілені, Ґанн ІІ з надією та гордістю дивиться в майбутнє. Королівство сильне, його народ — у безпеці, армії — могутні. Хай живе великий король Ґанн! Хай живе Манітоба!"

BRA_hauser:0 "Ґрейсон Гаузер"
BRA_hauser_desc:0 "§2«Гарний командир опанує одну стратегію до невразливості. Великий — опанує всі, щоб ніколи не бути неготовим.»§!\n\nҐрейсон Гаузер живе за цим принципом. Наймолодший син дрібного аристократа, він був курсантом військової академії Манітоби, коли була програна Республіканська війна. Вважаючи, що поразка Королівства була наслідком надмірної залежності від однієї тактики, Гаузер присвятив себе вивченню різних форм ведення бою, аби ніколи не бути переможеним через обмежене мислення."

BRA_jack_of:0 "Майстер на всі руки"
BRA_jack_of_2:0 "Майстер на всі руки"

BRA_grimaldi:0 "Александр Ґрімальді"
BRA_grimaldi_desc:0 "§2«Йди швидко та неси велику ножа, бо ворога краще вбивати, коли його охоплює хаос.»§!\n\nСтарший за віком солдат, Ґрімальді — один із небагатьох, хто вижив у катастрофі під Стоунволлом. Він провів залишок війни в полоні, але був звільнений через обмін. Проте він ніколи не забув своєї ганьби й тепер прагне перемагати ворогів раніше, ніж вони встигнуть зробити те саме з ним."

BRA_aggressive_attacker:0 "Агресивний Нападник"
BRA_aggressive_attacker_2:0 "Агресивний Нападник"

BRA_toharek:0 "Джек Тогарек"
BRA_toharek_desc:0 "§2«Кажуть, що агресія здобуває славу, та саме оборона гарантує виживання.»§!\n\nМайстер укріплень і оборонних дій, Джек Тогарек вважається головним архітектором оборони Брендону під час Республіканської війни. Лаконічний і фізично вражаючий, цей «Мур Манітоби» витратив багато годин на розробку ще більш грандіозних укріплень для того моменту, коли зрадники завдадуть нового удару."

BRA_wall_of_manitoba:0 "Мур Манітоби"
BRA_wall_of_manitoba_2:0 "Мур Манітоби"

BRA_eleanor_yorkton_name:0 "Елеонор Йорктон"
BRA_eleanor_yorkton_desc:0 "§2«Ми вчимося на помилках минулого, щоб прагнути до кращого завтра.»§!\n\nЯкщо хтось уявляв собі доньку Лева з Ланґенбурґа, то Елеонор Йорктон зовсім не відповідає цим уявленням. Турботлива, терпляча та спрямована в майбутнє, вона є голосом прогресу та змін у зазвичай застійному Королівстві. Безсумнівно, на неї чекає яскраве майбутнє як на одну з довірених радників короля."

BRA_forward_thinker:0 "Прогресивна Мислителька"

BRA_cornelius_thornburg_name:0 "Корнеліус Торнбурґ"
BRA_cornelius_thornburg_desc:0 "§2«Обов’язок кожного підданого Манітоби — служити Короні. Віддати за неї життя — найвища честь, яку я можу уявити.»§!\n\nКорнеліус Торнбурґ, барон Торнбурґу, — людина, яку знають по його репутації. Фанатично відданий, він усе ще є об’єктом шепотів через жорстокі чистки серед підозрюваних у симпатіях до республіканців у своїх володіннях під час війни та масову мобілізацію для заповнення втрат під Стоунволлом. «Кривавий Барон» заради Королівства не шкодує нічого — навіть своїх рук."

BRA_bloody_baron:0 "Кривавий Барон"

BRA_sandra_davidson_name:0 "Сандра Девідсон"
BRA_sandra_davidson_desc:0 "§2«Ми перебуваємо у стані війни. Незалежно від того, що кажуть угоди, всі мають бути готові до бою й до придушення повстання. Королівство має бути готовим боротися.»§!\n\nСандра Девідсон — колишня солдатка, яка десятиліттями ризикувала життям заради Королівства та Крони. Втративши ногу та частину руки у війні, вона ніколи не вірила, що мир триватиме довго. Тепер вона закликає кожного, хто ще може тримати зброю, до бою. Щоб вижити, кожен чоловік, жінка та дитина повинні бути готові захищати Королівство."

BRA_militarist:0 "Мілітаристка"

BRA_josephine_sol_name:0 "Жозефіна Сол"
BRA_josephine_sol_desc:0 "§2«У цьому світі занадто багато болю й крові. Найменше, що ми можемо зробити — це спробувати зцілити хоч щось.»§!\n\nКолишня військова медсестра, Жозефіна Сол бачила на власні очі всі жахи війни. Попри врятовані життя, вона знала — можна зробити більше, особливо тим, у кого більше влади й ресурсів. Здобувши довіру королеви Кетрін своїми словами, Жозефіна невтомно працює над тим, щоб впливати на політичні рішення в інтересах звичайних людей. Це найменше, що вона може зробити."

BRA_healing_hand:0 "Цілюща Рука"

BRA_neville_burke_name:0 "Невілл Бьорк"
BRA_neville_bruke_desc:0 "§2«Саме армія втримала мури Брендону. Не зрадницький флот, не повітряні замки з авіації. Це були чоботи на землі, що тримали лінію проти зрадників. Як і має бути, і як завжди буде.»§!\n\nНазавжди змінений війною Першої Республіканської Коаліції, Невілл Бьорк переконаний, що Королівство досі існує лише завдяки силі піхоти та ополченців. Кораблі До́уфіна були знищені ще до виходу в море. Дирижаблі Уінніпеґа захопили революціонери ще до зльоту. Лише солдати Королівства відповіли на його поклик у найтемнішу годину."
BRA_iron_wall:0 "Залізна Стіна"

BRA_wolf_mcneil_name:0 "Вулф МакНіл"
BRA_wolf_mcneil_desc:0 "§2«Якщо Королівство цього потребує — я це дістану.»§!\n\nБезпринципна людина, що не зважає, з ким має справу, Вулф МакНіл — один із найтемніших агентів Корони. Офіційно уповноважений проникати в тил ворога й домовлятись із їхніми торговцями, Вулф керує грошовими потоками так само вправно, як і служить Королівству. Ніхто не знає, чому така сумнівна особа така вірна трону — але Короні пощастило мати такого агента."
BRA_rogue_trader:0 "Контрабандист"

BRA_simon_oz_name:0 "Саймон Оз"
BRA_simon_oz_desc:0 "§2«Мама завжди казала, що справжнє володіння — це коли ти досить розумний, щоб тільки твої руки торкались речі. І знаєте, вона мала рацію.»§!\n\nСин дрібного шляхтича, Саймон Оз змалку засвоїв одну істину: ти володієш лише тим, що можеш забрати. Хоча деякі вважають його звичайним злодієм, він довів, що є вправним ділком і підприємцем. Його компанії видобувають ресурси для Королівства — і він завжди пильнує, щоб перший шматок пирога дістався саме йому."
BRA_cleptocrat:0 "Професійний Клептократ"

BRA_james_gillingham_name:0 "Джеймс Ґіллінгем"
BRA_james_gillingham_desc:0 "§2«Армія може захищати землю, закони — правити людьми, але саме бюрократ забезпечує роботу всієї машини.»§!\n\nОфіційний «Майстер Паперів», Джеймс Ґіллінгем походить з давнього роду палацових бюрократів. Продовжуючи традицію своєї родини, він дбає, щоб механізми Королівства працювали без збоїв, і жодна справа не була без офіційного дозволу. Він сам — тонка межа між порядком і анархією, принаймні, на його думку."
BRA_bureaucrat:0 "Ефективний Бюрократ"

BRA_marina_tyee_name:0 "Марина Тайї"
BRA_marina_tyee_desc:0 "§2«Так, так, ваші предковічні практики важливі, але чи ви розглядали також і це?»§!\n\nМарина Тайї — доволі незвична постать у Королівстві. Хоча вона не має аристократичного походження, статки її родини дозволили здобути чудову освіту в Герцогстві До́уфін. Озброєна знанням та довоєнними економічними працями, Марина переїхала до Брендону й нині невпинно просуває сміливі теорії та концепції економічного розвитку."
BRA_economist:0 "Економічний Стрибок"

BRA_thomas_neu_name:0 "Томас Ной"
BRA_thomas_new_desc:0 "§2«Я просто лагоджу речі. І все.»§!\n\nЧужинець у землях Королівства, Томас Ной з’явився у Брендоні, здається, з нізвідки — лише з одягом на собі й іменем Томас. Попри таємниче минуле, його вміння ремонтувати вразило навіть найвибагливіших аристократів, і його швидко прийняли на службу Короні. Іронічно взявши прізвище «Ной», Томас невтомно працює, щоб усе — від найменшої гайки до наймасштабнішої машини — працювало справно."
BRA_handyman:0 "Майстер на всі руки"

BRA_tobias:0 "Старший капітан Тобіас"

BRA_theorist_name:0 "Фредерік Паєтт"
BRA_theorist_desc:0 "§2«Немає кращого вчителя, ніж досвід. На щастя, в мене його вдосталь.»§!\n\nДо війни Фредерік Паєтт служив у канадській армії, борючись проти американських загарбників. Один із ударів вертіпта залишив його калікою, а згодом — гулем. Після Великої Війни він блукав дикими землями Манітоби. Його стара рана зажила, хоча кульгавість залишилась. Коли постало Королівство, терпиме до гулів, він запропонував свої військові знання в обмін на дім. 150 років потому — він досі служить Короні."
  
BRA_theorist_2_name:0 "Вільям Шеклтон"
BRA_theorist_2_desc:0 "§t«Новий світ вимагає нових стратегій. Ми маємо адаптуватися — або згинути в ядерному кратері.»§!\n\nОдин із знаних Манітобських горних рейнджерів, Вільям Шеклтон все життя провів у лісах і пустках. Його участь у відбитті республіканського десанту принесла йому прихильність Таннера, який цінує поради Шеклтона щодо тактики й стратегії для Нового Світу."

BRA_gilles_hawco_name:0 "Жиль Гавко"
BRA_gilles_hawco_desc:0 "§2«Я не адмірал і не морський геній. Але я знаю ці води, як людина знає материнську любов.»§!\n\nПісля зради капітана Бержерона Манітоба довго залишалась без морського командира. Через загрозу з боку Трьох Річок і потребу в морських шляхах до Арборґа Корона звернулась до народу. Жиль Гавко — старий капітан парому, який продовжує родинну традицію переправи мандрівників через озера. Втягнутий у війну, він мріє про день, коли знову стоятиме на спокійній палубі свого порому."

BRA_earl_mcrae_name:0 "Ерл МакРей"
BRA_earl_mcrae_desc:0 "§2«Небо — місце миру. І добре, що я тут, щоб жоден зрадник його не скуштував.»§!\n\nПовітряні сили ніколи не були пріоритетом для армії Королівства. Але чутки про дослідження Трьох Річок у сфері мілітаризованої авіації змушують вжити заходів. Ерл МакРей — провідний пілот Королівства, який роками літав на саморобному літаку своєї родини. Вірний лише Короні, він тепер використовує свої знання для побудови повітряної сили, що не дозволить жодному зраднику літати над землями Корони."

BRA_grandmaster:0 "Вільям Таннер"
BRA_grandmaster_leader_desc:0 "Найвідданіший чоловік Манітоби — так описують Таннера. Після втрати короля Ґанна багато хто бачив у ньому втілення витримки й волі. Але навіть стійкого Таннера похитнула смерть монарха. І все ж, навіть після смерті, король залишив йому останній наказ.\n\nТепер Таннер очолює Народну Монтію — вже не заради оборони загиблого Королівства, а щоб захищати народ Манітоби до самого кінця. Це — його останній обов'язок."
BRA_north_hound:0 "Пес Короля"
BRA_grandmaster_advisor_desc:0 "§t«Я виконую свій обов’язок.»§!\n\nПрава рука короля. Його довірений радник і друг. А для декого — ще й Пес-охоронець. Вільям Таннер — взірець заслуги у суспільстві, чим дратує чимало аристократів. Відданий, досвідчений, і улюбленець народу, Таннер очолює Монтію Королівства на службі Короні, незалежно від випробувань."

BRA_regency:0 "Регентська Рада"

BRA_mountie:0 "Вільям Таннер"

BRA_QUEEN_ELEANOR_NAME:0 "Королева Кетрін"

BRA_mailman:0 "Поштмейстер Пат"
BRA_mailman_desc:0 "Найкраще описаний як любитель котів і листів, Поштмейстер Пат відіграв ключову роль у відновленні поштової служби Королівства. Вирісши на околицях Брендону, Пат ще дитиною збирав довоєнні листи та доставляв послання від імені своїх батьків і сусідів. Деякі звички не вмирають, і нині він з гордістю служить першим поштмейстером Корони, разом із вірним другом — Джесс."
BRA_trait_mailman:0 "Поштмейстер"

CPH_title_baron:0 "Барон"
CPH_title_duke:0 "Герцог"
CPH_title_knight:0 "Лицар"

BRA_cookie_name:0 "Кукі"