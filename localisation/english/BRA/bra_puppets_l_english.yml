cph_pup_royal_reward_desc:0 "Ми пройшли довгий шлях, але місто Реджайна нарешті повернулося додому.\n\nНаші Наглядачі мужньо боролися разом з армією Королівства проти сил Другої Коаліції, і тепер король Ґанн II бажає нагородити полковника Деніелса за успішне відвоювання Реджайни."
