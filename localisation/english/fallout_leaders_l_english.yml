# TLA
TLA_TLALOC_NAME: "Тлалок"
TLA_TLALOC_DESC: "Незбагненний, чужий, самотній — Тлалок спостерігає за поверхнею крізь холодні, мертві об'єктиви. Його милі схем і компонентів гниють і розпадаються з роками, відкриваючи гортанні механічні нутрощі. Створений найрозумнішими умами Америки за допомогою технологій, які ніхто з них до кінця не розумів, незаперечний Бог Мексики нависає над усіма аспектами життя як привид. Він вбивав тисячами — і вбиватиме знову. У свої останні дні він розмірковує над своїм «життям» і досягненнями, над «дітьми», яких залишить по собі. Десь у глибинах центрального ядра є щось схоже на емпатію, але вона помре, перш ніж зможе її усвідомити. Тлалок знає точно, коли помре — тому він чекає, замислює, і проводить останні години, дивлячись на годинник із тим, що можна назвати «жахом»."
TLA_OLLIN_NAME: "Оллін"
TLA_OLLIN_DESC: ""
# TLL
TLL_GRANDMATRON_SOFIA_CORTEZ_NAME: "Велика Матрона Софія Кортес"
TLL_GRANDMATRON_SOFIA_CORTEZ_DESC: "§y«Свобода, Братерство й Рівність. Ось ідеали Останньої Ложі, і ми не здамося».§!\n\nСпочатку сформована з масонів, Остання Ложа довго вважала себе останнім осередком людства в Пустці. За двісті років старі вчення згасли, залишилися лише символи — Ложа змушена була еволюціонувати, щоб вижити.\n\nСофія Кортес — Велика Матрона, жінка, що в молодості досліджувала околиці, а нині спостерігає, як Пустка знову змінюється — армії та нації витісняють анархію. Збереження незалежності Ложі — її головне завдання в ці мінливі часи. Пара пістолетів і кілька мудрих слів, можливо, вже не допоможуть."
