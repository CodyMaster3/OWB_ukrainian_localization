# GRH
GRH_COMANDANTE_LUIS_NAME: "Команданте Луїс"
GRH_COMANDANTE_LUIS_DESC: "Народжений у колишньому Пуерто-Барріосі, Гватемала, Луїс був звичайною дитиною з амбіціями успадкувати родинну справу. Проте його призвали у військо в шістнадцять. Став героєм на півдні Гондурасу, пережив «Ніч Дикості» та врятував Данлі від навали рейдерів. У 2273, у віці 27 років, Народна Рада обрала його команданте — на довічне правління. Тепер, у 29, він мріє лише про одне — знищити рейдерів і забезпечити процвітання свого народу."
GRH_EMILIANO_SANCHEZ_NAME: "Еміліано Санчес"
GRH_TOMAS_BARRAGAN_NAME: "Томас Барраґан"
GRH_FRANCISCO_JAVIER_DIAZ_NAME: "Франсиско Хав'єр Діас"
# HAM
HAM_ISAAC_OF_LUCIN_NAME: "Ісак із Лусіна"
HAM_ISAAC_OF_LUCIN_DESC: "Містичний пророк із харизматичною промовою, Ісак на перший погляд не підходить для лідера Склярів. Проте його майстерність — поза сумнівом, і він приписує це божественному дару. Він проповідує добробут і гармонію. Але за його словами криється темна сторона. Цинічний шахрай? Божевільний фанатик? Ніхто не знає. Але за його постійною усмішкою ховаються кинджали."
HAM_PETER_BARKSDALE_NAME: "Пітер Барксдейл"
HAM_THOMAS_WOFFORD_NAME: "Томас Воффорд"
HAM_ZACH_RODES_NAME: "Зак Родс"
# HAN
HAN_BARES_HIS_TEETH_NAME: "Оголені Ікла"
HAN_BARES_HIS_TEETH_DESC: "Мисливець на руїнах Міста Псів, та Великий Повелитель Битих Псів полює на свіже м’ясо. Боягузливий за природою, він здобув силу завдяки зграї псів, які стали його зброєю."
HAN_WARDEN_NAME: "WARDEN"
HAN_WARDEN_DESC: "Протокол безпеки WARDEN — серія довоєнних програм ЗАКС у 'Коробці', великому роботозаводі Денвера. Створений RobCo для придушення заворушень.\nТепер, через 200 років, WARDEN пробудився і прагне навести порядок у Денвері."
HAN_COLOSSUS_NAME: "COLOSSUS"
HAN_COLOSSUS_DESC: "AI у 'Коробці' раніше знали як COLOSSUS — під час експериментів із військовими іграми. Після умиротворення Колорадо його знову активовано, і WARDEN став лише підпрограмою в системі COLOSSUS."
HAN_DREAM_HUNTER_SPINEBREAKER_NAME: "Ловець Снів Ламач-Хребтів"
HAN_DREAM_HUNTER_SPINEBREAKER_DESC: ""
HAN_GREAT_GECKO_NAME: "Великий Гекон"
HAN_GREAT_GECKO_DESC: ""
# HEA
HEA_SAINT_MICHEAL_NAME: "Святий Михаїл"
HEA_SAINT_MICHEAL_DESC: "Охрещений у водах, що живлять парові двигуни Небесної Брами, Михаїл із простого поселенця став пророком. Бог наказав йому опанувати військову справу, бо — як підказує ім’я — Михаїл має вести армію проти самого Диявола. На жаль для Пустки, для Михаїла всі — грішники."
HEA_STEAMMAIDEN_MIRA_NAME: "Парова Діва Міра"
HEA_MOTHER_MAGDALENE_NAME: "Мати Магдалина"
