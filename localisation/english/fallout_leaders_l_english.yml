PEC_FRANCISCO_WOLL_NAME: "Франсиско Воль"
# PER
PER_MAX_TACKETT_NAME: "Макс Такетт"
PER_MAX_TACKETT_DESC: "§H«Почни з фори».§!\n\nСправжній чоловік — хижак. І його місце — на вершині харчового ланцюга. Це закон Переслідувачів, і їхній мисливський ватажок Макс Такетт сидить на вершині. Розриваний шрамами, загартований болотами ще з підліткового віку, він — страх і гордість для своїх людей.\n\nМакс очолив Переслідувачів у п’ятнадцять, коли повернувся додому з мішком голів королів мирлорків. Але хоч він і геніальний мисливець, як лідер — жорстокий і нетерпимий. Якщо ти не тягнеш — ти здобич. Світ змінюється: солдати в силовій броні, бойові роботи й мутанти виходять на арену. Макс повинен не допустити, щоб мисливці самі стали здобиччю."
PER_NORTON_LAW_NAME: "Нортон Ло"
PER_WILLIAM_ROBERTSON_NAME: "Вільям Робертсон"
PER_CHARLES_WELLS_NAME: "Чарльз Веллс"
# PET
PET_EL_SEEYO_NAME: "Ель Сійо"
PET_EL_SEEYO_DESC: "Ель Сійо має безліч обов'язків, як це передбачено істотами Першого Кварталу. Як Сійо, він є найвищим виконавчим керівником у племені, ухвалює рішення, що впливають на весь Компенні. Він веде переговори між Ель Бордом і своїм народом, забезпечуючи задоволення богів через Звіти Про Глобальні Успіхи, які передаються жерцям. Ті ж, у свою чергу, тлумачать бажання святих Зейрьольдасів — божеств, що наглядають за Кварталами.\n\nКолись вони жили у мирі, але Звіт Урнінгів Третього Кварталу передрік загибель людства. Ель Сійо має провести свій народ і Компенні через Кінець Днів — Четвертий Квартал. Він знає, що рано чи пізно з'явиться Звіт Анюелла, і тоді Зейрьольдаси вирішать, чи гідне людство служити їм у наступному Фікселарі."
PET_PETRONET_NAME: "Петронет"
