# ACH
ACH_KATHRINE_TORNI_NAME:0 "Катрін Ффіон Тьорні"
ACH_KATHRINE_TORNI_DESC:0 "§t«Інколи я думаю: що б зробив Мексон?»§!\n\nКатрін Ффіон Тьорні — вправна снайперка, диверсантка та організаторка. Її шлях у Техаському Братстві почався складно: донька старшої з Лост-Гіллз, вона була відправлена до Техасу невдовзі після народження, аби врятуватись від наступу НКР.\n\nУ Техасі вона швидко здобула репутацію. Молодість, сповнена пригод, принесла їй славу після рейдів у Форт-Гуді з Росадо. Ці дії ніколи не суперечили Кодексу Братства Сталі, якого Катрін навчала мати. Та глибше вивчення Кодексу лиш підкреслило, наскільки далеко відійшло Техаське Братство від його принципів.\n\nДорослішаючи, вона вступила до Кола Сталі — таємної поліції, що стежить за вірністю Лост-Гіллз. Але дисидентів та зрадників було надто багато. Потрібен був новий план: відокремитись. Зібравши всіх вірних, вони створили новий розділ, вірний Кодексу за будь-яку ціну.\n\nЗдається, її план вдався. Але чи виживе цей розділ? Їх мало, вороги — навкруги, і, здається, історія знову повториться... Аламо може знову впасти."
ACH_BRAXTON_BARKHAUER_NAME:0 "Бракстон Баркхауер"
ACH_BRAXTON_BARKHAUER_DESC:0 ""
ACH_PETER_CONNOR_NAME:0 "Пітер Коннор"
ACH_PETER_CONNOR_DESC:0 ""
ACH_MATTHEW_FRY_NAME:0 "Меттью Фрай"
ACH_MATTHEW_FRY_DESC:0 ""
# ALA
ALA_THE_SALLOW_MAN_NAME:0 "Блідий Чоловік"
ALA_THE_SALLOW_MAN_DESC:0 "Він бачив усе. І повернувся."
ALA_WARRIOR_OF_MARS_NAME:0 "Воїн Марса"
ALA_WARRIOR_OF_MARS_DESC:0 "Марс благословив його, і він знає, що має робити."
# ANO
ANO_FATHER_AMON_NAME:0 "Отець Амон"
ANO_FATHER_AMON_DESC:0 "Месіанський охоронець тисяч посвячених душ, на старих плечах Амона тяжіє тягар лідерства. Полум’я Господнє згасло в його очах, вибите втратою народу та занепадом у єресі. Тепер у ньому залишилось лише бажання зцілити розкол — або загинути, намагаючись."
ANO_BRAXTON_BARNUM_NAME:0 "Бракстон Барнум"
ANO_BRAXTON_BARNUM_DESC:0 ""
ANO_FRANK_BUTLER_NAME:0 "Френк Батлер"
ANO_FRANK_BUTLER_DESC:0 ""
ANO_HIRAM_HUNTER_NAME:0 "Хайрам Хантер"
ANO_HIRAM_HUNTER_DESC:0 ""
# ARM
ARM_SANTA_ANNA_NAME:0 "Санта Анна"
ARM_SANTA_ANNA_DESC:0 "Найпотужніша особистість Тлалока, єдина, що блукає поза його володіннями — Санта Анна є чумою Пустки. Божевільний від влади, охоплений жагою «спокути» після поразки століття тому, цей штучний інтелект поневолив частину Мексики, аби втілити свою мару — стати генералом, яким він себе вважає."
ARM_ANGEL_RINCON_GALLARDO_NAME:0 "Анхель Рінкон Ґаярдо"
ARM_ANGEL_RINCON_GALLARDO_DESC:0 ""
ARM_FRANCISCO_GUERRERO_NAME:0 "Франсиско Ґерреро"
