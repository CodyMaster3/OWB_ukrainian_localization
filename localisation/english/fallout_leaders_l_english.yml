PET_FRANCISCO_BARRAGAN_NAME: "Франсиско Барраган"
PET_PASCUAL_SALES_NAME: "Паскуаль Салас"
# PHR
PHR_HARVEY_THOMPSON_NAME: "Гарві Томпсон"
PHR_HARVEY_THOMPSON_DESC: "Син торговців, які тримали магазин зброї в Фініксі, Гарві виріс на пороху та олії. Він щодня тренувався зі зброєю разом із батьком і вже до 16 років приєднався до міського ополчення. У 25 він уже очолював його. Тепер він піднімає прапор Фінікса, твердо вирішивши: краще померти вільним, ніж жити рабом."
