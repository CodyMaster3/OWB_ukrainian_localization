HXL_CAPTAIN_ZHANG_KING_DESC: ""
HXL_NORTON_MAXEY_NAME: "Нортон Максі"
HXL_RICHARD_BELKNAP_NAME: "Річард Белкнап"
HXL_MALVIN_HAMLIN_NAME: "Мелвін Гемлін"
# IMO
IMO_JUGGERNAUT_NAME: "Джаггернаут"
IMO_JUGGERNAUT_DESC: "§G«Ну що, зелені шкури, погнали. ІДЕЕЕЕЕЕЕЕ ДЖАГГЕРНАААААААААААААААУУУУУУТ!»§!\n\nКолись Джаггернаут слідував за Аттісом, але знайомство з землями Texan Arms Association змінило його назавжди. Можливість творити машини війни виявилася нестримною спокусою. Він і його послідовники захопили частину території. Але жага творення кличе далі на південь — до нових інструментів, машин і кузень."
# INR
INR_ALKAYA_NAME: "Алькая"
INR_ALKAYA_DESC: "§g«Наш шлях, наше минуле — воно десь тут... десь у цій ущелині, приховане серед брухту, вкрадене работорговцями... Воно чекає на нас».§!\n\nКолись частина більшого племені далеко на заході від Колорадо, Залізні Лінії були вигнані з невідомих причин і стали кочовим плем’ям, що слідує та мапує залізничну мережу старого світу, поклоняючись потягам як пророцтву повернення старого ладу. Цей кочовий спосіб життя привів їх до покинутої станції, де вони заснували базу, назвавши її Колове З'єднання — на честь своїх братів на заході. Станція швидко стала центром торгівлі, що привабило рейдерів і работорговців, які розграбували їхнє беззахисне поселення.\n\nАлькая була серед тих, хто вижив, ставши сиротою в ранньому віці. Вона рятувалась у старих вагонах, ховаючись під час набігів, і захищала інших дітей-сиріт від захоплення. Тепер, ставши дорослою, вона прагне створити сильний флот, що відновить гідність і шлях Залізних Ліній, аби їхню долю більше ніколи не могли вкрасти."
INR_HENRY_KING_NAME: "Генрі Кінг"
INR_JAMES_BATES_NAME: "Джеймс Бейтс"
INR_SAMUEL_CARR_NAME: "Самуель Карр"
# IRN
IRN_BULLETEATER_NAME: "Куляжер"
IRN_BULLETEATER_DESC: "Куляжер із Колорадо — воїн-команч, що залишив свій народ у пошуках себе та власної легенди. Його мандри привели до Стерлінга, де племена боролись за місто. Їхні стріли не могли пробити його броню, і невдовзі він став володарем нової сили. З племен стрільців він створив Залізний Альянс — армію у силовій броні, що торує свій шлях пусткою."
# ITZ
ITZ_KALOMTE_SEBASTIAN_NAME: "Каломте Себастіан II"
ITZ_KALOMTE_SEBASTIAN_DESC: "Народжений у сільській родині, Себастіан записався до армії в 16 років, щоб втекти з аграрного пекла. Він швидко просунувся в рядах Ехерсіто — регулярних військ Іци. Його слава запалилась у битві при річці Папалоапан, де після смерті командира він зібрав армію й перейшов у контратаку, здолавши Ацтлан. Ця перемога принесла йому славу героя, підтримку в армії та зрештою владу — Себастіан здійснив переворот і сів на трон."
ITZ_CLARA_GUZMAN_NAME: "Ті'уун Клара Гусман"
ITZ_CLARA_GUZMAN_DESC: "Клара виросла в післяапокаліптичному Канкуні, прийомна дочка офіцера Меродеадорес і багатого купця. Освіта й природна тяга до чисел та стратегії привели її в адміністрацію Іци. Її блискучий розум і срібний язик привернули увагу Себастіана II, який запросив її до столиці й надав їй титул Ті'уун — дипломатки та інтриганки, якого вона носить з гордістю."
ITZ_CARLOS_FRANCO_NAME: "Халач Уінік Карлос Франко"
ITZ_CARLOS_FRANCO_DESC: "Карлос уперше скуштував війни на річці Папалоапан, будучи піхотинцем. Його загін тримався, навіть коли інші відступали. Його мужність та лідерські якості вразили Себастіана. Після перевороту Карлос став командувачем Ехерсіто, однією з найвпливовіших постатей у державі."
# JAC
JAC_BANSHEE_NAME: "Банші"
JAC_BANSHEE_DESC: "Жахіття Банші відоме по всіх дорогах!\n\nОчоливши мігруючих Шакалів, Банші залишив слід у Колорадо, Каліфорнії та Техасі! Зустрічався з Гекатою біля Темної Піраміди, бився з Братством Техасу та Легіоном. Після поразки під Форт-Вортом, де він втратив свої славетні золоті кучері, Банші повернувся до Невади, де сподівається на легшу здобич."
JAC_RAYFORD_THE_FANG_NAME: "Рейфорд Ікло"
JAC_LUNATIC_MAD_MAN_NAME: "Божевільний Божевільник"
JAC_CRACKPOT_GREED_NAME: "Божевільний Жадоба"
