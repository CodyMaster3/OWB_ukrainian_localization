# RIO
RIO_ELDER_MILLER_NAME: "Старійшина Міллер"
RIO_ELDER_MILLER_DESC: "Впливовий і в розквіті сил, Лінкольн Міллер був звичайним, хоч і багатообіцяючим паладином. Усе змінилося, коли його стара подруга по чарці Валентина Росадо запросила його приєднатися до нового проєкту — Техаської Зони Розвитку. Як командувач відділення Братства в долині Ріо-Ґранде, він з нетерпінням чекає співпраці з Республікою Ріо-Ґранде, щоби принести найкраще зі старого світу в новий. Якщо б тільки Росадо перестала нервово сміятися під час командних нарад..."
# RIP
RIP_FACE_MASHER_NAME: "Морколом"
RIP_FACE_MASHER_DESC: "Морколом — таємничий лідер Ріперулта, оповитий страхом і чутками. Народжений серед хаосу пустки, він став майстром обману та психологічної війни — частково з необхідності, а частково заради задоволення. Репутація Ріперулта як канібалів — це хитромудрий фарс, створений для захисту своїх земель та контролю над містами.\n\nСпочатку відомі як Рейдери Рульта, вони стали Ріп-Рультом, а згодом Ріперултом після повалення свого попереднього лідера. Хоча кажуть, що Морколом отримав ім'я, буквально розтовкши обличчя Рульта, насправді той був просто нокаутований і замкнений у темряві. Ізоляція змусила Рульта власноруч пошматувати собі лице до стану «картопляного пюре». Цей символізм і закріпив прізвисько за Морколомом, коли той знайшов Рульта в тому жахливому стані.\n\nПід його керівництвом Ріперулт прийняв страхітливий образ — чутки про канібалізм, розбещення та ще гірше. Міста під їхнім «захистом» змушені підігрувати цьому фарсу, вигадуючи дедалі страшніші історії, які зміцнюють репутацію Рейдерів як безжального зла.\n\nТа за цією завісою брехні ховається народ, що просто бореться за виживання. Морколом керує цим балансом між страхом і захистом. Але як довго ще триватиме ця вистава, перш ніж правда вийде назовні?"
# ROT
ROT_JACOBIA_THE_WRATHFUL_NAME: "Якобія Лютій"
ROT_JACOBIA_THE_WRATHFUL_DESC: "Якобія Лютій, п’ятий лідер Гнилопалих і нащадок Александра Безжального — ватажка Великого Повстання, здобув своє прізвисько не дарма. Уславлений по всьому Вашингтону за свою ненависть до гулів, Якобія очолив Гнилопалих у віці всього лише 22 роки. Ідеаліст до мозку кісток, він мріє реформувати організацію, зробивши з неї справжню силу знищення гулів де б ті не були. Адже саме вони, за його словами, винищили його предків. Настав час людям узяти реванш."
# RRG
RRG_TODD_HOWITZER_NAME: "Тодд Гаубіц"
RRG_TODD_HOWITZER_DESC: "Загадковий і харизматичний, Тодд Гаубіц завжди вирізняється на фоні навіть інших еліт. Його родина займалася виробництвом зброї ще до Великої війни — і він має відповідний престиж. Тепер, обраний представником і лідером новоствореної Техаської Збройної Асоціації, він, на жаль для своїх соратників, більше зацікавлений у прибутках, ніж у створенні життєздатного капіталістичного раю."
RRG_TODD_HOWITZER_2_DESC: "Дещо приборканий після майже смертельного уроку жадібності, колишній революціонер Тодд відступив і цілком підтримав президента Ґерру. В обмін на життя, охорону й помилування за злочини, він продав кожного зі своїх колишніх бізнес-партнерів — разом із секретами їхнього виробництва зброї. Це й є політика, малята. §YIt just works.§!"
RRG_DANTE_GUERRA_NAME: "Данте Ґерра"
RRG_DANTE_GUERRA_DESC: "Президент Данте Ґерра все своє доросле життя вірно служив Республіці Ріо-Ґранде, відслуживши два терміни. Його акцент на державних проєктах і якості життя здобув любов народу, але також нажив йому ворогів у Палаті депутатів і Сенаті. Як популіст, оточений консерваторами, лобістами та меншістю реформістів, Ґерра має непросте становище. Його уряд ще більше дратує його нездатність тримати Техаську Збройну Асоціацію в узді."
RRG_DANTE_GUERRA_CHARISMATIC_DESC: "Знову здобувши виконавчу владу Республіки, президент Ґерра має багато пріоритетів — і головний з них: суд над Цезарем і його поплічниками. Працюючи разом із Конгресом Союзу та народом, Данте має намір нанести удар правосуддя по беззаконних землях Арізони та виправити помилки Едварда Саллоу. Паралельно він продовжуватиме покращувати життя людей, зміцнювати інституції та вести Республіку до процвітання. У Ґерри попереду важкий термін, але він хоче залишити Пустку кращою, ніж знайшов."
RRG_DANTE_GUERRA_MERCILESS_DESC: "Маючи підтримку Конгресу Союзу та громадян, старіючий президент Ґерра вступає у свій третій термін з рішучістю. Його очі палять, як прокляті на вогнищі, — його ще переслідують спогади про дружину та тих, кого не встиг врятувати. Для свого останнього терміну Матадор Республіки планує гримнути на прощання. Або бюрократи зігнуться під його волею — або він змусить їх. Ніщо не стоятиме між Данте та його Пеклом: гори тіл бичків, роздуті від завоювань і геноциду, складатимуть йому шлях!"
RRG_LEONARDO_MORA_NAME: "Леонардо Мора"
RRG_LEONARDO_MORA_DESC: "Візіонер. Герой війни. Чоловік. Леонардо Мора — це все й більше. У 2263 році, під час свого першого президентського терміну, він отримав неможливе завдання: перемогти Легіон. Маючи лише недосвідчену міліцію, він вирвав перемогу з пазурів поразки кров’ю, потом і харизмою. Тепер, у другому терміні, в героя народу є лише одна ціль: об'єднання втраченої батьківщини — Мексики. На його думку, лише він здатен зібрати мексиканський народ разом — добровільно чи ні. Навіть Бог не стане на заваді його життєвій меті. Мора або увійде в історію як найбільший син Мексики — або загине, намагаючись."
RRG_VALENTINA_ROSADO_NAME: "Валентина Росадо"
RRG_VALENTINA_ROSADO_DESC: "Батько Росадо втік від тиранії Санта Анни, щоб утриматися подалі від автоматики, але донька повернула її у дім у віці чотирнадцяти років. Він виростив її на історіях про роботів, що патрулюють пустку — і вона захопилася ними. У шістнадцять вона покинула дім і влаштувалася учнем на заводі робототехніки ТЗА. До двадцяти трьох років її дістали обмеження — вона подалася за межі Республіки. Там вона зустріла Братство Сталі й обміняла свій геній на знання. Валентина допомагала техаському відділенню в усьому: від збору даних до злому бункерів. Вона втратила руку, щоби відкрити Форт Гуд — і за це Братство врятувало її життя. Маючи підтримку найсильніших, нову руку і безпрецедентний геній, Росадо має намір змінити Республіку назавжди."
RRG_LADY_OF_THE_BELLS_NAME: "Пані Дзвонів"
RRG_LADY_BEllS_DESC: "Президентка Росадо злилася з осколками Тлалока. Хоч вона й стверджує, що залишається Росадо, дехто не може позбутися відчуття, що коли вона злилася з Тлалоком — це була вона, а не він, хто зник. Дехто почав називати її Койольшаукі, Пані Дзвонів, на честь її витоків та постійно літаючих поруч EDE."
Chalchiuhtlicue_DESC: "Чальчіутлікве, дружина Тлалока — це ім’я для штучного інтелекту, який нині керує центральною Мексикою. Якщо Тлалок утримував землю в стані застою, то Чальчіутлікве слухає Республіку Ріо-Ґранде та веде Пустку до нового, яскравого майбутнього!"
# RSR
RSR_SLIM_NAME: "Слім"
RSR_SLIM_DESC: "Торгівля в межах Легіону була прибутковою справою, і конкуренція практично не існувала завдяки його грізній репутації. Слім був відомим торговцем у Нью-Мексико, заснувавши свою торгову імперію в Ред-Сан. Він неодноразово захищав місто від гніву Легіону за допомогою великої армії найманців, що й принесло йому титул Президента після створення Республіки Червоного Сонця."
# RUB
RUB_VES_NAME: "Вес"
RUB_VES_DESC: "§M\"Знайдеш вільне місце — бери, але, може, краще йти далі.\"§!\n\nОстанніми роками Рубінова долина стала прихистком для біженців, і місцеві мешканці не змогли просто відвернутися від тих, кого вигнали '80-ті. Тепер тут більше чужинців, ніж корінних жителів. Вес походить із давніх мешканців долини, займалася наглядом за копальнями коштовностей і торгівлею з чужоземцями. Спочатку вона вітала новоприбулих як джерело робочої сили, а з часом стала фактичним лідером долини.\n\nТа зараз ресурси на межі, навколо небезпечні сусіди, і Вес не знає, як вийти з ситуації, хоч і планує нові оборонні укріплення для Притулку."
# SCA
SCA_SCRAPPER_COUNCIL_NAME: "Рада Ломівників"
SCA_SCRAPPER_COUNCIL_DESC: "Рада вождів кланів Ломівників збирається нерегулярно, зазвичай тільки коли стається щось, що перевищує сили одного клану. Та навіть тоді зустрічі часто завершуються сварками або бійками. Зустрічі відбуваються на борту нафтового танкера PMV 'Лоусон', що був сюди доставлений ще до війни як атракціон, коли звалище було відкритим для відвідувачів."
# SCO
SCO_BURK_NAME: "Берк"
SCO_BURK_DESC: "Берк — освічена людина, кілька років провів у НКР та з Послідовниками Апокаліпсису, вивчаючи військові стратегії та природу людства. Згодом щось у ньому 'зламалося', і прагнення поваги й влади переросло в одержимість. Так він і подався на схід, почувши поклик своєї долі."
