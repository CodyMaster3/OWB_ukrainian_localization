# TWO
TWO_WILL_FASTER_NAME: "Вілл Фастер"
TWO_WILL_FASTER_DESC: "Вілл Фастер очолив Культ Насу і після підкорення Легіоном зберіг народ, шануючи накази. Багато хто ненавидить Легіон, але Священик Фастер пам’ятає часи, коли рейдери гноїлись в Арізоні, мов воші. Тепер Культ Насу може безпечно ганяти сотні миль, отримуючи дари від усієї Легії. Цезар шанує богів Культу, присвячує їм храми і машини. Можливо, думає Фастер, Легіон ще прийме віру. І тоді йому буде гарантоване місце у Великому Ґаражі."
