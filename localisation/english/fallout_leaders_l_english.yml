# SHO - Не шокай
SHO_CHIEF_TECHKI_NAME: "Вождь Теккі"
SHO_CHIEF_TECHKI_DESC: "Вождь настільки довго, скільки більшість шошонів пам'ятає. Теккі вів свій народ через найкращі й найгірші часи в цьому пекельному світі. Він прийшов до влади після того, як фанатики Небесної Брами убили його батька. Одним з перших обов’язків Теккі було вести свій народ на захід — у безпечніші землі. І хоча він мріє повернутися додому, знає — це буде непросто. Але він спробує."
SHO_HEAD_HUNTER_ETCHEMIN_NAME: "Мисливець за головами Етшемін"
SHO_GREAT_MOTHER_FAUST_NAME: "Велика Мати Фауст"
SHO_OLD_SOUL_DUFF_NAME: "Стара Душа Дафф"
# SIN
SIN_MARIA_SINALOA_NAME: "Марія Сіналоа"
SIN_MARIA_SINALOA_DESC: "Остання з Старої Ґвардії мексиканських картелів, Марія вже понад століття є беззаперечною нарко-королевою Сіналоа. Нещодавнє повстання Лучадорів і формальна незалежність південних територій дещо затьмарили її правління, але в Марії вже є плани, як прибрати цих зухвальців та інших, хто стане на її шляху."
SIN_EMILIA_SINALOA_NAME: "Емілія Сіналоа"
