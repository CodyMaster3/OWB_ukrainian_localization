# MOC
MOC_MOCTEZUMA_NAME: "Моктесума"
MOC_MOCTEZUMA_DESC: "Найбрутальніший із синів Тлалока, Моктесума був створений як відповідь на загрозу з боку Іцанів та Ацтланців на півдні — чужорідні суспільства, що процвітають у попелі старого світу. Вони загрожують серцям і розумам мексиканців, які жадають більшого, ніж правління машини, нехай і доброзичливої. Моктесума — відповідь Тлалока: цифровий спадкоємець культури, навчає своїх підданих поезії на науатль, мистецтву Фріди Кало, і, звісно, війні. Вони люблять квіти... і люблять війну."
