# PNT
PNT_THE_NEMONIK_NAME: "Немонік"
PNT_THE_NEMONIK_DESC: "§gКолись я зберігав пам'ять... тепер же сам стаю спогадом. Але хай мої останні дні стануть творенням нових спогадів для племені.§!\n\nЯк духовний і освітній лідер Шифраторів, Немонік бачив, як світ змінюється — не на краще. І хоча він старий, для нього це — не кінець, а початок нової епохи. Але він розуміє: щоб вижити в цьому новому світі, недостатньо лише ритуалів і стародавніх схем.\n\nХоча Немонік виступає проти зловживання технологіями, він не заперечує їхню користь. Ідеї Тріґ і її лазерна гармата врятували Меса-Верде від Vайперів. Братство Мексона допомогло їм вижити після невдалого «диво-добрива» Денома. А Прив'язаний... без неї все могло бути інакше.\n\nНемонік не сліпий. Він бачив, що робить одержимість технікою: Легіон, Братство, сусіди — всі мають свій шлях. Та згідно з формулами Азкі, Шифратори мають усе менше часу до вибору. Залишиться плем’я з мудрістю Немоніка — чи піддасться спокусам Азкі? Він хоче лише одного: щоб Шифратори вижили."
