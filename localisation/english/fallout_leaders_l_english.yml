# DAM
DAM_great_buster_name:0 "Великий Бастер"
Buster_DESC: "Великий Бастер. Господар Дамби. Пошесть Небраски. Їх знають під багатьма іменами, та всі вони говорять про їхню владу над Руйнівниками Дамби. Бастер із гордістю веде своє походження від оригінальних інженерів, яких відправили опанувати дамбу, й ставиться до Оаґі з майже релігійною шаною. Вони не зупиняться ні перед чим, аби повернути їй колишню славу, та знають: того, що можна витиснути з поселенців, не вистачить.\n\nЩоб могутня Оаґі знову запрацювала — Небраска має впасти на коліна."
KAGA_DESC:0 "Як так, що людина може досягти стільки — й бути забутою? Стати славетною по всій Пустці — та жоден не промовить його імені? Кага все життя прожив у цьому пеклі. Вигнаний Обранець Ароюо, Кага був позбавлений свого законного права стати рятівником народу, який замість нього обрав іншого — менш достойного. Багато разів Кага шукав помсти, і щоразу йому відмовляли. Та тепер, через десятки років, він планує повернутися до дому, що вигнав його, й повернути те, що було вкрадене — кров’ю. Усі знатимуть і боятимуться його імені. Він подбає про це."
Goddard_DESC:0 ""
CARDINAL_SCOTT_DESC:0 "§P“Брати мої, пустошники бажають експлуатувати нашу святу техніку; тож молімося великій машині, захищаймо її, станьмо її вартою проти волі невірних.”§!\n\nХранителі не знають своєї історії, що трапилось після великого вогню; легенди говорять про війну з богом-машиною, а їхні предки були солдатами в тій війні; божественна істота знищила зле керівництво, перш ніж відступити у велику яму, щоб загоїти свої рани. Вона залишила армії самотніми, а предків — враженими. Вони присягнули оберігати її цитадель, збудовану в стінах долини Есмерельда. Нині знана як §PЦитадель Хранителів§!, вона стала сховищем технологій. Хранителі дотримуються ксенофобської доктрини оборони, стріляючи у кожного, хто наблизиться. Червоні прапори попереджають мандрівників.\n\nГолос машини шепоче до Скотта в залах цитаделі, нещодавно наказавши шукати велику яму. Заклики про допомогу з Лост-Гіллз ще більше підсилюють пророцтва. Кардинал одержимий, проповідуючи нову главу для своїх братів, сподіваючись наблизити їх до Бога..."
CWB_LEADER_DESC:0 "§t\"Любиш свої блискучі цяцьки? То згори в них!\"§!\n\nДе інші слабкі, покладаючись на технології, що можуть їх знищити, Шифрувальники сильні. Вони не потребують крихкої лазерної зброї, силової броні чи бомб, які перетворюють світ на попіл. Гірше за слабкість є лише загрози, що ці іграшки несуть: бездушні машини, сталеві звірі й фальшиві інтелекти блукають пустками, загрожуючи знищити світ остаточно.\n\nШифрувальники не стоятимуть осторонь у війні проти машин, і Хелкі є однією з найкращих їхніх воїнок — потужна та смілива, з серцем, що палає незгасним вогнем. Її звуть Різницею — вона рве ворогів, роботів чи людей, наче папір. Хай наступний хрестовий похід принесе їй славу!"
Polyphemus_DESC:0 ""
DRY_Leader_DESC:0 "§M\"Кажи що хочеш про цього Печерника, але це ж справжній мать його звір. Яйця — як у Браміна, мізки — як у Деткло з Ментатами! Він — сила, з якою слід рахуватися: надихає друзів, лякає ворогів. Тож краще бережися, бо якщо зв’язався з Висушувачами — тобі доведеться мати справу з Лінчем. А він обожнює показувати, що його прізвище означає насправді.\"§! — Дж.Х. 'МФ' Христос\n\nДжон Лінч, досвідчений лідер громади Висушувачів, став ключовою фігурою після повстання в глибинах Бергем-Спрінґс і Палаючих копалень. У супроводі колишніх племінників, рабів і рейдерів Джон повів свій народ на північ — подалі від Дочок Гекати, аби прокласти власний шлях у безжальному світі.\n\nПісля важкої війни проти Уробороса — за землі, відібрані в Темної Матері — Джон і його послідовники перемогли, звільнивши рабів і племінників, які страждали. За це Лінча прозвали «Луканом» — за вміння керувати псами, навчене йому Джорданом Деєм.\n\nТа перемога — лише початок. Тепер, відомий як «Печерник», 51-річний Джон Лінч веде поселення до процвітання з 2260 року. Але його автократичне правління викликає спротив — особливо з боку Маріанни Шарп, яка виступає за пряму демократію. Поки Лінч зосереджений на обороні, внутрішні напруження загрожують затьмарити їхні успіхи. І Темна Мати готується цим скористатися..."
LuiWei_DESC:0 ""
JimLahey_DESC:0 "§C\"Передай випити, час святкувати ще один чудовий клятий день у Істпорті.\"§!\n\nІстпорт останніми роками перетворився на жвавий торговельний пост, що відвантажує випивку та сировину, а також служить перевалочним пунктом для торговців зі сходу й заходу. Це дало багатьом місцевим шанс насолодитись періодом достатку, і мер Джим Лейгі не став винятком. Колишній шериф, Джим використав свої зв’язки (та, можливо, кілька добре вкладених хабарів), щоб отримати крісло мера не так давно. Тепер він хоче лише розслабитися й дожити життя у потоках пива й кришок.\n\nТа з ревінням моторів у далині — хто знає, як довго йому це вдасться."
Scarlet_DESC:0 "§4\"Подивись на це місце. Ти СПРАВДІ хочеш, щоб усе Техас тебе вбивав? Включно з ґрунтом?\"§!\n\nБільше десяти років тому Скарлет врятувала Техас від вигнанця з Шифрувальників на ім’я Різ. Так з’явився Еден — з тих подій. Поки не знайдеться кращого рішення, вона охороняє наслідки мутованого G.E.C.K.’а, ніколи не знаючи, коли її обов’язок і обов’язок її послідовників нарешті завершиться."
ZhangKing_DESC:0 ""
Alkaya_DESC:0 "§g\"Наш шлях, наше минуле — десь тут... десь у цій ущелині, під купами мотлоху, викрадене рабовласниками... Воно чекає на нас.\"§!\n\nКолись частина більшого племені далеко на захід від Колорадо, Залізні Лінії були вигнані з невідомих причин і стали кочовим плем’ям, що слідкує за залізницями Старого Світу, поклоняючись потягам як пророцтву повернення минулого. Їхня мандрівна доля привела до покинутого залізничного вузла — тут вони заклали постійну базу, назвавши її Коловим Вузлом на честь своїх братів на заході. Поселення швидко перетворилось на торговий центр і привернуло увагу тих, хто хотів скористатися плем’ям.\n\nМісцеві в Колорадо назвали їх Залізними Лініями через татуювання на тілі. Та саме плем’я вже забуло значення тих малюнків. Поки Коловий Вузол процвітав, работорговці та рейдери грабували його, залишивши тільки слабких і дітей. Так плем’я знову втратило себе...\n\nАлкая була серед тих дітей. Вона вижила, ховаючись у вагонах. Схованки допомогли їй урятувати інших дітей. З роками набіг припинився. Тепер, у дорослому віці, Алкая мріє створити флот — сильний, як ніколи — щоб нові лінії, що фарбують їхню шкіру, тепер малювали каньйон. Вона прагне знайти нову стежку й нову тотожність. Ту, що ніхто більше не зможе вкрасти."
Bulleteater_DESC:0 "Пожирач Куль із Колорадо: воїн-команч, що давно покинув своє плем’я у пошуках долі, аби створити власну легенду — далеко від батьківських дорікань.\n\nЙого мандрівка привела його до Стерлінґа, де племена Залізних Стріл боролись за владу. Вони спробували вигнати його, але їхні стріли ламались об його броню — і вони впали під новим чоботом. Під його владою Залізні Стріли стали Залізним Союзом — наймансько-рейдерською армією в силовій броні під його командуванням."
ANDREA_BRIXLEY_DESC:0 ""
JORDAN_DAE_DESC:0 ""
YVANA_DESC:0 ""
EddPukaloy_DESC:0 ""
MAX_TACKETT_DESC:0 "§H\"Бери фору.\"§!\n\nСправжній чоловік — це хижак, що стоїть на вершині харчового ланцюга. Це шлях Переслідувачів, і їхній мисливський ватажок Макс Теккетт — найвища ланка. Покритий шрамами й змужнілий у болотах ще до повноліття, Макс — фігура водночас страху й захвату. Став лідером у 15 років, принісши мішок голів міралурків-королів і вбивши попереднього ватажка.\n\nМакс — геніальний мисливець, та жорстокий лідер. Гумор у нього обмежений до гри в кота-мишку з жертвами, і терпіння до невдах немає: вони можуть стати його наступною здобиччю. Поки болота лишаються його територією, світ змінюється. Силові броні, роботи, мутанти... Максові доведеться боронити мисливців, аби ті самі не стали здобиччю."
The_Nemonik_DESC:0 "§gКолись я був охоронцем пам’яті... Та, боюся, сам перетворююсь на пам’ять... Але хай мої останні дні стануть новими спогадами для племені.§!\n\nДуховний та освітній лідер Шифрувальників, Немонік бачив, як світ занепадає. Для старого це — знак зміни епох. Для племені — виклик. Духовність та пам’ять про древні схеми допомагають, але вижити можна лише втримавши свою суть. Навіть якщо Азкі пропонує використання технологій, Немонік вірить, що істинна стежка — шлях Першого В’язня.\n\nТа попри це, Немонік визнає користь технологій. Без лазерної ідеї Тріг, Материнські Змії могли б поневолити Меса-Верде. Без допомоги Братства з бункера Мексона, вони не пережили б голод. Без В’язня... навіть складно уявити, яким був би світ.\n\nНемонік не сліпий до користі техніки. Але він бачив, що приносить її надмір або заборона. Цезар, Братство, сусіди — у кожного свій шлях. Та якщо математик Азкі вірний — часу обмаль. Плем’я має обрати: мудрість Немоніка чи спокуси Азкі. Усе, чого він бажає — щоб Шифрувальники вижили..."
RIP_Leader_DESC:0 "Фейс-Мешер, загадковий ватажок Ріперултів, — це людина, огорнута одночасно страхом і таємничістю. Народжений серед хаосу пустки, Фейс-Мешер став майстром обману та психологічної війни — частково з необхідності, частково через задоволення. Ріперулти здобули репутацію канібалів, однак це — складна вистава, що має відлякувати ворогів і зберігати контроль над підконтрольними містами.\n\nГрупа починала як Рейдери Рульта, а згодом стала Ріп-Рультом, а потім і Ріперултами після усунення свого колишнього лідера. Хоча кажуть, що Фейс-Мешер здобув ім’я, буквально розчавивши обличчя Рульта, насправді того просто оглушили й замкнули. Ізоляція з часом призвела до того, що Рульт сам понівечив собі обличчя — перетворивши його на подобу пюре. Саме Мешер знайшов його в такому стані, що стало підставою для нового імени та створення страхітливого іміджу.\n\nПід його керівництвом Ріперулти почали цілеспрямовано поширювати чутки про свою жорстокість — канібалізм, насилля, навіть вбивства немовлят. Насправді ж це просто вистава. Міста під їхнім «захистом» мають підтримувати цю виставу, поширюючи все більш дикі історії. Це зміцнює контроль Ріперултів і стримує ворогів.\n\nТа за цим усім жахом — лише група людей, яка хоче вижити. І Фейс-Мешер, з його стратегічним розумом, балансує між страхом і добробутом. Та як довго триватиме ця брехня? І що станеться, коли правда випливе на поверхню?"
Ves_DESC:0 "§M\"Знайдеш вільне місце — бери. Але, можливо, краще буде їхати далі.\"§!\n\nРубінова Долина останнім часом стала прихистком для біженців, бо її мешканці не захотіли відвернутись від тих, кого вигнали 80-ті. Тепер тут більше новоприбулих, ніж корінних. Вес — одна з давніх жителів долини, керувала видобутком самоцвітів і налагоджувала торгівлю. Спершу вона з радістю прийняла біженців, бачивши в них робочу силу, і з часом стала фактичним лідером регіону.\n\nТа зараз ресурси виснажуються, а сусіди стають дедалі небезпечнішими. Вес шукає вихід, готуючи нові плани оборони для Притулку."
KRONOS_DESC:0 ""
Tyrantus_DESC:0 "§L\"Діти Місяця — божевільні злодії. Ми більше не йдемо з ними одним шляхом.\"§!\n\nКоли Геката та її доньки впали в безумство, кілька племен відвернулися від неї. Старі Кістки були серед них, і тепер зосереджені на славі свого храму. Тирантус, могутній воєначальник, веде їх у битви проти суперників. Найзапекліший ворог — сама Геката, що викрала багато святинь племені.\n\nТирантус — запальний чоловік, що носить бойову броню зі святих кісток. Його сниться отруєне провалля Бернема, й безсоння притуплює розум. Він прагне помсти, навіть якщо це спричинить війну."
