# FLA
FLA_SKINNER_NAME: "Скіннер"
FLA_SKINNER_DESC: "Скіннер зрозумів, як усе складалося, й спалив усі свої зв’язки та обіцянки, аби уникнути шибениці. Його злочини як посіпаки Легіону пробачили за кілька тисяч кришок. Його влада — надзвичайно крихка, тримається лише на обіцянках демократичного процесу та запевненнях, що зробить Флаґстафф справжнім торговим вузлом. Чи дадуть йому громадяни шанс виконати ці обіцянки — ще питання."
# FOR
FOR_PORTER_NAME: "Портер"
FOR_PORTER_DESC: "Банду Портера, ввічливих збирачів, вигнали з Денвера, коли Биті Пси захопили місто. Він звинувачує зухвалих «застрибувачів» — копачів-нахаб за вигнання з такого добротного звалища."
