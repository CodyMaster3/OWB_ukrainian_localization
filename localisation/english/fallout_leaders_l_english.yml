# MTR
MTR_ENGINEER_NAME: "Кондуктор"
MTR_ENGINEER_DESC: "Утримувати Божевільні Потяги в русі — це робота на повний день. Серед кланів вона користується великою повагою, але мало чим іншим. Важко не лише підтримувати лінії та локомотиви в справному стані, а й утримувати їх від війни одне з одним. Завдання Кондуктора — аби все йшло гладко, незалежно від того, скільки сну чи здорового глузду це йому коштує."
