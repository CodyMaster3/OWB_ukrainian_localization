# CBN
CBN_MAYOR_JASMINE_NAME: "Мер Жасмін"
CBN_MAYOR_JASMINE_DESC: "Мер Жасмін очолює Карбон уже шість років! Її люблять за захист поселенців і розвиток місцевої «індустрії розваг». Вона сподівається виграти ще термін-два завдяки роботі та відданості."
CBN_RAIDER_MATRON_NAME: "Матріарх Рейдерів"
CBN_RAIDER_MATRON_DESC: "Матріархів майже знищили — це колишні повії з Карбону, що стали бійцями. Під новим керівництвом вони мріють повернути втрачену славу."
CBN_CHESTER_CHAPMAN_NAME: "Честер Чапмен"
CBN_JESSE_FORSYTH_NAME: "Джессі Форсайт"
