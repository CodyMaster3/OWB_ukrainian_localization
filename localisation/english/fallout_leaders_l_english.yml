EUR_SCAVENGER_51_NAME: "Сталкер №51"
EUR_richard_goldman: "Річард Ґолдман"
EUR_mr_johnson_name: "Містер Джонсон"
EUR_air_mercenary_NAME: "Енді Таненбаум"
EUR_david_orell: "Девід Орелл"
EUR_helen_bellings: "Гелен Беллінґс"
EUR_portmaster: "Портмайстер Сміт"
EUR_portmaster_desc: "§YМірлорки — це ворог, якого я готовий зустріти. Люди — інше діло. Вони мають не панцир, а розум. І цього досить.§!\n\nУ 2239 році Дінард Сміт став першим Портмайстром, який відвоював Єврика від мірлорків. Його командири загинули в останній битві, і він змушений був взяти командування. Хоча політика — не його сильний бік, бойова доблесть принесла йому повагу.\n\nЗа 35 років під його владою Єврика зміцніла. Та тепер Сміт має знайти нову мету для своєї армії та захистити місто від НКР, Аррою та інших загроз."
# ERB
ERB_GRANITE_NAME: "Дуглас Граніт"
# FFI
three_masks_DESC: "Коли племена в масках об'єдналися для боротьби з картелями, що гнобили Лос-Мочіс і навколишні землі, саме ці троє стали об’єднувальною силою. Міль Маскарас — Зелений Титан, Той, Хто Знімає Маски, сам Тореадор — дарував племенам силу й мужність. Синій Диявол, колишній ворог племен, завдав значного удару картельним найманцям своїми підступними методами та потужною зброєю. І, нарешті, батько всього — Ель Санто. Благочестивий воїн, чистий серцем, розумом і душею, Захисник Слабких. Саме він першим повстав проти Сіналоа й вигнав Бельтранів до південних джунглів. Разом вони — трійка могутня, хоч і неспокійна."
mil_mascaras_DESC: "Міль Маскарас — постать, оповита таємницею. Попри безліч перемог, цей Супермутант лишається загадкою — героєм під тисячею масок. Подейкують, що колись він був рабом під батогом Легіону, очолював повстання, що завершилось трагедією, та здійснив жертовний вчинок, який назавжди визначив людину під маскою."
el_santo_DESC: "Боротися за справедливу справу справедливими засобами — рідкість в Мексиці, Америці та, можливо, в усьому світі. Але Ель Санто — виняток серед винятків. Він бачив, як картелі зростали, топчучи всіх на своєму шляху, і плакав. Ці сльози стали полум’ям у його серці, полум’ям визволення поневолених і відновлення миру, викраденого злом."
blue_devil_DESC: "Перед лицем труднощів у вас є лише одне завдання перед собою: вижити. Почесна поразка веде лише до смерті й страждань, і Ель Дьябло Асуль це знає. Картелі грають за правилами, яких честолюбні не розуміють. Його репутація хитрого, нечесного як у рингу, так і поза ним, слугує йому добре — заскочивши ворога зненацька."
