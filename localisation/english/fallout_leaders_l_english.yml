# TDT
TDT_SAJAL_TOBIAS_REY_II_NAME: "Сахаль Тобіас Рей II"
TDT_SAJAL_TOBIAS_REY_II_DESC: "Обережний, розсудливий чоловік, Сахаль Тобіас Рей II очолює Т'єрра де лос Цоциль уже майже двадцять років. Під його керівництвом плем'я зуміло зберегти автономію перед лицем імперії Ітца, але ціною великих жертв."
TDT_SAJAL_MAXIMO_VELA_I_NAME: "Сахаль Максімо Вела I"
TDT_SAJAL_MAXIMO_VELA_I_DESC: "Сахаль Максімо Вела I — не добра людина. Виріс у Чичен-Іца, був шкільним хуліганом у військовій академії, але завдяки політичним зв'язкам родини швидко піднявся в кар'єрі. Каломте Себастьян II побачив у ньому надійного виконавця — і відправив Велу до Цоциля як таємного агента. І він свою роль грав відмінно."
