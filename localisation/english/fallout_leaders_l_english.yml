# DEA
DEA_RUSHING_WATERS_NAME: "Бурхлива-Вода"
DEA_RUSHING_WATERS_DESC: "Повернувшись до свого племені після перебування у Нью-Ханаані, вона принесла з собою розповіді про святі війни й стародавні стратегії. Не найкраща учениця в плані Писання, але надзвичайно здібна полководиця, яка понад усе прагне захистити свій народ."
DEA_SUN_UZUMATIL_NAME: "Сонце Узуматіль"
DEA_BIG_CHIEF_SPINEBREAKER_NAME: "Великий Вождь Хребтолов"
DEA_BURNER_SCAR_NAME: "Опікова-Шрам"
# DIS
DIS_PROPHET_VADIM_NAME: "Пророк Вадим"
DIS_PROPHET_VADIM_DESC: "Колишній пророк Коралового Двору племені мірлорків, Вадим мав непогане життя. Але зі зростанням впливу Двору він побачив — відмову від старих звичаїв. Він та його апостоли були вигнані на південь. Там, відбивши кістожерів, вони створили новий дім."
DIS_GILBERT_GRADY_NAME: "Ґілберт Ґрейді"
DIS_WINSTON_THE_OUTLAW_NAME: "Вінстон Позазаконний"
DIS_SMOKEY_THE_CHEATER_NAME: "Смокі Шахрай"
# DRA
DRA_THE_MASQUERADE_NAME: "Маскарад"
DRA_THE_MASQUERADE_DESC: "Мелодія долі веде за собою багатьох, але не всі це визнають. Драматаї ж не лише визнають, а й слідують її ритму. Маскарад — найбільш налаштовані на цей ритм. Вони носять маску емоцій і не видають своєї сутності. Їх не хвилюють лестощі чи хабарі. Людина чи гуль, один чи багато — усе це залишається таємницею."
# DRY
DRY_JOHN_CAVEMAN_LYNCH_NAME: "Джон \"Печерний\" Лінч"
DRY_JOHN_CAVEMAN_LYNCH_DESC: "§M«Кажіть що хочете про Печерника, але він — справжній брутальний виродок, і це ще м’яко кажучи. Має яйця брахміна і мізки дезкло на ментатах! Його краще не злити — він надихає друзів і сіє жах у ворогів. Так що бережи спину — бо як зачепиш Драйбловерів, відповідати доведеться Лінчу. А він обожнює показувати, що значить його прізвище!»§! – Дж. Г. 'MFer' Кріст\n\nДжон Лінч, досвідчений лідер громади, знаної як Драйбловери, став ключовою фігурою після повстання в глибинах Бернем-Спрінґс і Палаючих Копалень. З різношерстим загоном колишніх племінників, рабів та рейдерів він очолив їх втечу на північ — геть від лап Дочок Гекати, аби прокласти власний шлях у безжальному Пустощі.\n\nЗдобувши свободу, Драйбловери невдовзі втягнулися у запеклу війну з Уроборосом — за землі, що колись належали їхній Темній Матері. Джон та його прибічники виявили стійкість, врешті перемігши ворогів і визволивши рабів та племінників з-під ярма Уробороса. За це Лінч здобув прізвисько «Лукан» — за майстерне дресирування собак, якого його навчив не хто інший, як Джордан Дей.\n\nТа ця перемога стала лише початком складної павутини подій. Нині Джону Лінчу, відомому друзям і ворогам як «Печерник» — 51 рік. З 2260-го він веде громаду до процвітання, але його автократія зростає не без спротиву. Маріанна Шарп виступає за пряму демократію й активно підриває його авторитет. Попри те, що оборона залишається головною метою Лінча, внутрішні конфлікти загрожують затьмарити здобутки громади... і Темна Мати вже стежить за ситуацією."
DRY_CHARLES_SMITH_NAME: "Чарльз Сміт"
DRY_JESSE_BRADLEY_NAME: "Джессі Бредлі"
DRY_JONATHAN_COOPER_NAME: "Джонатан Купер"
