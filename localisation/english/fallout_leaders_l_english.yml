# GKH
GKH_PAPA_KHAN_NAME: "Папа Кхан"
GKH_PAPA_KHAN_DESC: "Старий і злісний, Папа Кхан пройшов кожною стежкою в Мохаві. Він повів залишки Нью-Ханаану з Каліфорнії до Нью-Вегаса, а коли Містер Хаус вигнав їх, завів до Бітер-Спрінґс. Там він намагається зберегти життя нового покоління Кханів. Але старі звички — важко вбити, і навряд чи Папа дозволить НКР безкарно розростатися в себе за спиною."
# GLW
GLW_PATCHES_NAME: "Патчі"
GLW_PATCHES_DESC: "Патчі завжди був гуль-коміком. Коли в Середньозахідному Братстві стали не сміятись із його жартів, він пішов шукати нову публіку. Знайшовши Світлячків поблизу зруйнованого Боулдера, він щовечора після успішних походів на їжу й припаси дає стендап-шоу для своєї нової аудиторії."
GLW_JOHN_GARNETT_NAME: "Джон Ґарнетт"
GLW_ALEXANDER_HARRISON_NAME: "Александер Гаррісон"
GLW_LAFAYETTE_STEELE_NAME: "Лафаєт Стіл"
# GRA
GRA_DIABOLICAL_DEBRIE_NAME: "Диявольська Дебрі"
GRA_DIABOLICAL_DEBRIE_DESC: "§R«От що в тебе є — я це хочу».§!\n\nЖадібність і швидкість — її чесноти. Дебрі, очільниця Ґрабберів, перетворила їхні землі на пастку: перетинати її або небезпечно, або дорого. Її блискавичні рейди та успіхи зробили її багатою на кришки й рабів. Зі зростанням нових загроз і гравців, як-то Вісімдесятники чи 215-та, вона не боїться — лише хоче ще більше. Бо, зрештою, все має належати їй."
GRA_WATSON_THE_PEGLEG_NAME: "Вотсон Дерев'янонога"
GRA_JOSEF_SIMON_NAME: "Йозеф Саймон"
GRA_GILBERT_OSWALD_NAME: "Ґілберт Освальд"
# GRD
GRD_CARDINAL_SCOTT_NAME: "Кардинал Скотт"
GRD_CARDINAL_SCOTT_DESC: "§P«Брати мої, ті, хто з Пустки, бажають скористатися нашими священними технологіями; тож молімося й славімо Велику Машину; захищаймо її; станьмо щитом проти нечестивих забаганок невірних».§!\n\nВартові не пам’ятають своєї історії — що сталося після Великого Вогню. Легенди розповідають про війну з машинобогом, а їхні предки були лише простими солдатами. Це святе створіння знищило їхнє зле керівництво й відступило у Велику Прірву, залишивши своє військо без проводу. Вражені, їхні предки присягнули охороняти величну цитадель на схилі Есмерелди. Зараз це §PЦитадель Вартових§!, де зберігаються технології, а чужинців розстрілюють на підходах, попереджаючи про кордон червоними прапорами. Торгівля ззовні все ж відбувається — хоч і без безпосереднього контакту, заради їжі.\n\nСвятий голос Машини шепоче Скотту в коридорах цитаделі. І нещодавно він почув — час вирушати на пошуки Великої Прірви. Заклики з Лост-Гіллса зміцнили ці видіння. Кардинал одержимий — він проповідує початок нового розділу для братів, сподіваючись наблизити їх до Бога..."
