# TLP
TLP_ADJUTANT_GENERAL_CHRISTOPHER_HARRISON_NAME: "Ад'ютант-Генерал Крістофер Гаррісон"
TLP_ADJUTANT_GENERAL_CHRISTOPHER_HARRISON_DESC: "Призначений останнім губернатором Оклахоми Ребеккою Мюррей, Ад'ютант-Генерал Гаррісон — найвищий чин в Національній гвардії Оклахоми. Кар'єрний офіцер, він почав службу в Повітряній гвардії, отримав звання в 24 роки й швидко піднімався завдяки таланту до планування. Та навіть плани Гаррісона не змогли підготувати Гвардію до ядерного апокаліпсису."
TLP_PRESIDENT_OKLAHOMA_NGUYEN_NAME: "Президент Нгуєн"
TLP_PRESIDENT_OKLAHOMA_NGUYEN_DESC: "Колишня патрульна Останнього Патруля, яка пішла після звістки про напад на Федерацію. Її обрали президентом заочно ті, хто її знав особисто. Повернувшись в Оклахому, Нгуєн намагається зцілити рани минулого й стати посередником між фракціями нової республіки."
TLP_STONEWALL_WASHINGTON_NAME: "Стоунволл Вашингтон"
TLP_STONEWALL_WASHINGTON_DESC: ""
TLP_CARNOT_BROWN_NAME: "Карно Браун"
TLP_CARNOT_BROWN_DESC: ""
TLP_HENRY_HEINTZELMAN_NAME: "Генрі Гейнцельман"
TLP_HENRY_HEINTZELMAN_DESC: ""
TLP_PRESIDENT_OKLAHOMA_CORTEZ_NAME: "Президент Кортес"
TLP_PRESIDENT_OKLAHOMA_CORTEZ_DESC: "Кортеса обрали президентом Оклахоми переважно завдяки прізвищу — ложа з Вічита-Фолс не раз допомагала сусідам у боротьбі з небезпеками Пустки. Кортес прагне зробити Оклахому гордою державою, що тримається тих же цінностей."
# TLT
TLT_OFFICER_OF_AFFAIRS_NAME: "Офіс Луїзіанських Справ"
