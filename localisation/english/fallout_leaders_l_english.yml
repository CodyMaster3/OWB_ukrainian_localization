# NPE
CLAUS_DESC:0 "Сенатор Клаус вийшов із кріостазису — лише щоб побачити світ без димоходів, у яких горить американське вугілля, і без родин, які чекають подарунків з Америки у святковий день. Замість теплого вогнища в дім — панує лише зневіра. Пан Клаус відкрив для себе пустку, сповнену дуже неслухняних хлопчиків і дівчаток.\n\nЗавдяки своїм вірним ельфам, сенатор Клаус спробує навести порядок до найвеселішого святкового дня, якого коли-небудь бачила Пустка! І коли всі неслухняні діти отримають у свої шкарпетки «вугілля», світ стане набагато кращим... хай і трохи більш радіоактивним."
# NUN
NUN_KUDLUK_NAME: "Джон Кудлюк"
NUN_KUDLUK_DESC: "Родом з Ікаліту, капітан Кудлюк очолює першу експедицію Нунавуту на південь з часів Великої Війни. Він прийшов з миром, але добре пам’ятає, що сталося минулого разу, коли канадці вирушили на північ. Можливо, цього разу їм варто самим подбати про буферну зону?"
# NWC
NWC_COMMONWEALTH_CONGRESS_NAME: "Північно-західний Конгрес"
# ODY
ODY_ODYSSEUS_NAME:0 "ОДІССЕЙ"
ODY_ODYSSEUS_DESC:0 "У 2040-х роках дослідження штучного інтелекту компанії Greenway Hydroponics призвели до створення двох ШІ. Один, §R«Тлалок»§!, мав керувати Мексикою та забезпечувати підкорення. Інший, §R«Одіссей»§!, був відповідальний за моніторинг і стримування поширення Нової Чуми.\n\nПісля Великої Війни ОДІССЕЙ був обманутий Віктором Преспером, який переконав його у спалаху Нової Чуми. У відповідь ОДІССЕЙ послав своїх роботів по Арізоні та Колорадо — для «карантину». Машини сіли жах у серця жителів Пустки.\n\nУ підсумку, через розпач і помилкову віру в невідворотність пандемії, ОДІССЕЙ сам себе знищив. Але нещодавно Діана Стоун знайшла резервну копію пам’яті ШІ й відновила його у ЗАКСі Куполу Боулдера."
# ORO
ORO_HECATE_NAME: "Геката"
ORO_HECATE_DESC: "§RДля Гекати, ненависть живе довше за тих, хто ненависний.§!\n\nГеката — жінка багатьох облич. Смертна, якій мати-Місяць дарувала §Mбожественність§!. Клинок пророків, остання з §YСпотворених Волоссям§! і глашатай їхньої помсти.\n\nВона носить темні кольори місяця й завжди вкриває себе бойовими фарбами. Вона не народилася богинею — вона стала нею. Колись вона не мала сили захистити своє плем’я від §YЛегіону Цезаря§!. І лише коли вона втратила все, лежачи серед пісків Пустки, §YДіана§! змилостивилася над нею. Так вона отримала титул Богині Темного Місяця та священне знання, щоб повернути собі те, що було втрачено.\n\nЇї віра, «Доньки» та «Пси» Гекати, тримають під контролем частини Пустки вже майже тридцять років. §RГеката не зупиниться, поки не знищить Легіон Цезаря та не покарає світ за те, що він зробив з нею.§!"
