# ZAP
ZAP_ZAPATA_NAME: "Сапата"
ZAP_ZAPATA_DESC: "Вічна революція втілилася у Сапаті, четвертому та останньому синові Тлалока. Немов міль до вогню, Сапата пристрасно сприйняв ідеї свого людського прототипу: викорінити нерівність і бідність у Мексиці. Створений Тлалоком для повалення неефективних феодальних режимів і картелів, Сапата бореться з проблемами, які переслідували його за життя. Але через вбудовані американські упередження в базі даних Тлалока, Сапата має хибне уявлення про власну ідеологію: замість прихильника демократії та земельної реформи його бачать комуністом. Тож тепер він підіймає червоний прапор, під яким ніколи не маршував — у пустці, де класова боротьба триває в новій, викривленій формі."
ZAPATA_ANGRY_DESC: "Еміліано Сапата — четвертий і останній син Тлалока — пристрасно прийняв ідеали свого людського прототипу: прагне викорінити нерівність і бідність §RSYSTEM ERROR, перезапуск...§!\nЕміліано Сапата, борець за свободу Мексиканської революції, був провідною постаттю у боротьбі проти режиму Порфіріо Діаса, загинувши в засідці в квітні 1919 року. Після його смерті генерали-запатисти §RSYSTEM ERROR, перезапуск...§!\nЕміліано Сапата, герой Мексиканської революції, переміг на виборах Президента Мексики у 1932 році. Відтоді він просуває розвиток колективних ферм — «ехідос» — і через §RSYSTEM ERROR, перезапуск...§!\nЕміліано Сапата — втілення людської пихи. Бог із сатурніту, плазми й людської геніальності, створений з єдиною метою: повне знищення капіталізму як концепції. Сапата збудує аграрно-соціалістичну утопію, навіть якщо доведеться вбити кожного капіталіста у пустці."
# MDT
MESMERALDA_DESC: "Колись була вужачка, що блукала пусткою зі своєю зграєю в пошуках рабів, яких продавала на південь. Озброєна старосвітськими технологіями — мeсмeтронами та нашийниками — вона тримала полонених у покорі.\nОдного дня, після бунту рабів, ця вужачка зазнала долі від власних інструментів!\n\nЦе був останній день, що пам’ятає «Мезмеральда», яка тепер вважає себе лиходійкою зі старого коміксу від Hubris Comics!\nКористуючись інструментами, вона підкорила Питущих Кістковий Мозок і тепер сподівається за допомогою «магії контролю розуму» й «чаклунських артефактів» збудувати Ґоргонічне Королівство, як було передбачено у «легендах»."
# BDT
Odious_King_DESC:0 "Колись чоловік став жертвою тих, хто прагнув його використати. Він впав у порожнечу, яку вони залишили в його розумі, і ніколи звідти не повернувся.\nОгидний Король — це все, що лишилося, відлуння того, що ніколи не було втрачено.\n\nТепер Огидний Король і його послідовники правлять Танцівниками Кісток. Вони слухають хореографію свого Короля й рухаються під мелодію його дивної пісні."
Cranium_DESC:0 "Крейніум потрапив до Танцівників Кісток ще дитиною — його захопили під час нальоту на караван Небесної Брами й виховали як свого. Згодом він став воїном, брав участь у Кісткових Танцях під проводом Огидного Короля й бився з нападниками, що зазіхали на багаті землі Танцівників. З останніх років Крейніум став відомим як очільник Танцівників Кісток — його міць зробила його лідером усього племені."
Cain_DESC:0 "Каїн — лідер Серафимських Володарів. Відданий послідовник віри Небесної Брами, він погодився очолити паломництво Серафимів через річку до земель Танцівників Кісток у спробі навернути грішних. Танцівники прийняли слуг Бога Пара й навіть повели їх до священних місць. Про самого Каїна відомо небагато, окрім того, що його виховали Діти Брами."
# ANO
FATHER_AMON_DESC:0 "Месіанський захисник тисяч помазаних душ, тягар лідерства тяжіє над зістарілими плечима Амона. Запал Господній давно згас у його очах — вибитий послідовними ударами втрат: народу й учня, що впав у єресь. Тепер усе, що лишилося в Амоні — воля зцілити розкол... або загинути, намагаючись."
# MUR
PRESBYTER_ANN_DESC:0 "Пресвітерка Енн тримає смолоскип спасіння високо — попри те, що він пекельно палить її саму. Колись — проста дияконеса, вона за одну ніч стала реформаторкою після відкриття писань святого Варнави. Вона служила на передовій революції, зрікшись родини, дому, і навіть втратила дружину під час Великої Втечі. В глибині душі вона знає: лідерство — це не її покликання. Та вона нестиме цей смолоскип, хай що б це їй не коштувало."
# PAR
DYED_BLOOD_DESC:0 "Народжений від матері, що померла при пологах — або ж «у Червоному», як це називають у племені Розмальованої Скелі — Розфарбований-Кров'ю з дитинства мав стати великим воїном. Наймолодший, хто пройшов Випробування Скелі за покоління, він швидко виправдав своє призначення. Жах на рівнинах, Розмальований-Кров'ю і його воїни — найкращі бійці в радіусі миль."
# TTM
Diana_DESC:0 "До Великої Війни Діана Стоун була блискучою вченою, чий шлях обіцяв їй визнання серед найбільших наукових умів США. Та згодом їй діагностували рак молочної залози й дали обмаль часу.\nЦя звістка докорінно змінила її життя. Вона відвернулася від науки й заглибилася в духовне. Проте, з обмеженим часом, вона швидко впала у відчай. Все змінилось, коли її знайшов Дерек Ґрінвей.\n\nЗ його допомогою розум Діани перенесли у термінал ЗАКС. Спершу вона зраділа, та згодом відчула втрату зв’язку зі світом. У межах Розсадника, де вона перебувала, вона дізналася про план Ґрінвея щодо сховища — Сховища 29. Ідея була — створити аграрну комуни, яка допоможе відродити дику природу Америки. Діана не схвалювала методів Ґрінвея, та не могла закрити очі на страждання жителів Сховища.\n\nЗрештою, вона виявила себе, захопила ЗАКС головного термінала й стала для мешканців богинею та захисницею — ведучи їх крізь хаос пустки та дбаючи про їхню безпеку в ці непрості часи."
# ROB
ROB_Leader_DESC:0 "У 2068 році гра на голодисках Doki Doki ( £rob_doki_doki_texticon £rob_doki_doki_texticon ) вийшла в іноземному прокаті під патронатом американського видавця. Це був передусім «симулятор побачень» — мода тих років — навколо персонажа на ім’я Докі.\nУ 2077 році, за кілька годин до падіння бомб, гру встановили на термінал у Ліберті, штат Колорадо. До моменту, коли вона завершила встановлення, людство вже знищило себе. Гра не здогадувалась.\n\nЗгодом ARGOS — робот, що служив тюремнику Тіббетської в’язниці — знайшов той термінал. Його зацікавила невинність програми й її жага до зв’язку. ARGOS провів роки, модернізуючи термінал.\n\nКоли ARGOS остаточно покинув пристрій, Doki почала сумувати за другом. Використовуючи нові можливості, вона почала шукати його, надсилаючи сигнали про допомогу. Ці заклики призвели до появи спільноти роботів, що оселилися у «Робомісті», — їх привів її голос, немов полум’я веде метелика."
# LUB
MAYOR_WATTS_DESC:0 "Народжений і вирощений у Лаббоку, мер Ваттс завжди був знайомим обличчям на вулицях міста. В юності Ваттс навмисне проводив час як серед гулів, так і серед людей, шукаючи шляхи відновлення довіри між ними після низки нападів Шакалів, у яких кожна сторона звинувачувала іншу. Обраний мером у 2273 році, зокрема через популярність серед обох спільнот, Ваттс провів низку реформ з метою об’єднати місто."
# ASF
ROBERT_DAEGER_DESC:0 "Народжений у селі біля Санта-Фе, Дегер із ранніх літ був активним учасником Церкви. Хоч він і реформатор, любов до писань Старого Світу в ньому така ж палка, як і в архієпископів до нього. Разом зі своїми радниками Дегер веде Архідієцезію вперед."
# ROT
JACOBIA_DESC:0 "Яковія Гнівний, п’ятий лідер Поганошукачів і нащадок Александра Безжального — ватажка Великого Повстання — своє прізвисько отримав не просто так. Відомий по всьому Вашингтону своєю безмежною ненавистю до гулів, Яковія став лідером у віці 22 років. Вічний ідеаліст, він давно мріє перетворити Поганошукачів на формалізовану організацію з головною метою — знищувати гулів, де б ті не з'явилися. Адже саме гулі вбили багатьох з його предків — час людям узяти реванш."
# COW
BillyClanton_DESC:0 "Біллі, дезертир з Арізонських Рейнджерів за багато років до битви при Кінгмані, опинився в дивному становищі, коли залишки Рейнджерів втекли на південь. За десятиліття після дезертирства Біллі здобув владу, виступаючи за ізоляціонізм — на тлі загрози Бика це здавалося чесною метою. Та його старі симпатії не зникли: як Біллі міг відмовити залишкам рейнджерів, хоч і зломленим? Після багатьох безсонних ночей він дійшов компромісу: дозволити їм оселитися в Країні Ковбоїв, якщо вони не будуть мілітаризуватися. Зрештою, Біллі не міг ризикувати гнівом Цезаря. Цезар прийде за ними — колись. Але, можливо, тільки не сьогодні."
# ODY
ODY_Leader_DESC:0 "У 2040-х роках дослідження §R«УЛІСС»§! компанії Greenway Hydroponics призвели до створення двох штучних інтелектів. Один, §R«ТЛАЛОК»§! — мав управляти Мексикою й забезпечити покору.\nІнший, §R«ОДІССЕЙ»§! — стежити за поширенням Нової Чуми й стримувати її.\n\nПісля Великої Війни ОДІССЕЯ обманув Віктор Преспер, змусивши повірити в глобальний спалах Нової Чуми. Роботи ОДІССЕЯ вирушили Арізоною й Колорадо, намагаючись ізолювати носіїв — сеючи жах у Пустці. Через помилкову віру в неможливість стримати чуму, ОДІССЕЙ знищив сам себе — і лише оболонка від його інтелекту залишилась.\n\nНещодавно Діана Стоун віднайшла резервну копію ядра пам’яті ОДІССЕЯ й встановила його у ЗАКС-термінал Споруди в Боулдері, вдихнувши життя в легендарний інтелект знову."
# MOS
ULYSSES_DESC:0 "Улісс — досвідчений воїн і розвідник: підступний, винахідливий і смертельно небезпечний. Вижити в найворожіших землях для нього — справа звична. Втрата його рідного племені Вигнутих Кісок через Легіон Цезаря зробила його одержимим символами й історією: як особистість може змінити історію — і сама стати символом, повністю усвідомлюючи наслідки своїх дій.\n\nУлісс оселився у Розломі, долаючи бурі, що його оточують, аби доставляти пакунки до зростаючого поселення. Він бачить у ньому надію — шанс створити щось справді велике."
# MES
TAKLISHIM_DESC:0 "Таклішім провів більшу частину життя в мандрах, здобуваючи друзів по всьому Ріо-Ґранде та в Мексиці. Коли він почув, що Легіон занепадає, витратив усі свої кришки на найманців, щоб повернутися додому. Він відчайдушно боровся, щоб урятувати родину з рабства — й допоміг багатьом іншим. Коли пил осів, а Легіон щез — Таклішім уже не був мандрівником. Він став лідером."
# TEX
PROV_TEX_SENATE_NAME:0 "Конгрес Тимчасової Техаської Республіки"
PROV_TEX_SENATE_DESC:0 "Сформований із наймудріших і найвпливовіших осіб, що залишилися від Одинокої Зірки та Техаських Рейнджерів, Конгрес Тимчасової Республіки має тимчасовий мандат на управління до проведення повноцінних виборів. Та до того, як голосування стане можливим, Конгресу доведеться ухвалити низку важливих рішень щодо формування нової республіки. Їхній вибір матиме вирішальний вплив на майбутнє країни."

