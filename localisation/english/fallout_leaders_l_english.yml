# SLE
SLE_DIRECTOR_XIAN_NAME: "Директор Сянь"
SLE_DIRECTOR_XIAN_DESC: "Віктор Преспер обіцяв Сянь цілий світ.\n\nВчений зі Ші, що став справжнім адептом апокаліптично блискучого Віктора Преспера. Преспер — довоєнний науковець, який пережив Велику Війну завдяки кріозаморожуванню, — прагнув використати свій безмежний розум, щоб повністю знищити світ. Стерти минуле, залишити лиш оболонку світу для справжніх геніїв.\n\nСянь, зачарована шепотом утопії, вирушила за Преспером у подорож по світу, до місць, які старий світ волів забути.\n\nНавіть попри смерть Преспера понад двадцять років тому, Сянь досі прагне втілити його спадщину — ведучи однодумців «Сплячих» у пошуках способів реалізації його бачення."
SLE_RUSHING_MYNOC_NAME: "Бистрий Майнок"
SLE_CAVEMAN_NAME: "Джон «Печерна Людина» Лінч"
SLE_GREAT_FATHER_LINDSAY_NAME: "Великий Батько Ліндсі"
