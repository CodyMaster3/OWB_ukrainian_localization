# JIC
JIC_DELSHAY_NAME: "Делшей"
JIC_DELSHAY_DESC: "На час приєднання до Легіону племені Делшея, він уже був старим. Хоч Легіон змінив покоління, він зберіг пам’ять про свої витоки. Поступово всі старійшини померли, залишивши його останнім носієм традиції. Тепер, коли Легіон ослаб, він готовий зробити все, щоб передати свою культуру нащадкам."
# KHA
KHA_UNGERN_STERNBERG_NAME: "Роман фон Унгерн-Штернберг"
KHA_UNGERN_STERNBERG_DESC: "Роман фон Унгерн-Штернберг, відомий як «Божевільний Барон» і офіційно титулований Дархан Хошой Чин Ван у ранзі хана, мав важке дитинство: постійні переїзди, батько в божевільні, а рідне маєток в Естонії згорів у 1905 році. Це остаточно сформувало його анти-селянські та антикомуністичні погляди. Після військової школи у Санкт-Петербурзі він зацікавився буддизмом і окультизмом, а згодом опинився в Монголії, де служив при російському консульстві в Кобдо.\n\nУ Першій світовій війні воював у Галичині та на Кавказі, пережив арешт за напад на офіцера. Після революції воював на боці білогвардійців у Сибіру, ведучи свою особисту війну проти більшовиків.\n\nОдружився з маньчжурською принцесою Джі, а згодом визволив Ургу від китайського гарнізону й відновив владу Богдо-хана, проголосивши незалежність Монголії.\n\nБарон зберігав порядок силою, придушив кілька соціалістичних повстань, а потім почав активно зачищати «неблагонадійних». Після поранення в бою з повстанням Гада Мейрена він впав у кому, а вийшов з неї... новим чоловіком. Тепер він вважає себе реінкарнацією Чингісхана та аватаром Махакали — божества смерті. Монголія для нього — лише початок відродження Великої Імперії..."
# KLA
KLA_SLIM_PICKET_NAME: "Слім Пікет"
KLA_SLIM_PICKET_DESC: "Народжений і вирощений у Кламаті, Слім Пікет бачив усе найкраще й найгірше, що може запропонувати рідне місто. Досвідчений трапер і цілком влучний стрілець, він став фактичним лідером Трапертауну. Завдяки його розважливому плануванню Кламат перетворив нескінченні запаси геконів у справжнє джерело доходу — дешевша альтернатива м’ясу брамінів для тих, хто не може дозволити собі ціни Баронів."
