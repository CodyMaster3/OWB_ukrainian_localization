# LNS
LNS_CHO_BANG_NAME: "Чо Банг"
LNS_CHO_BANG_DESC: "Чо Банг із Лоун Стару добре знає пустки Техасу. Зростав на околицях Абілена, ще змалку допомагав батькам у караванах, що курсували I-20. Практичний досвід зробив його вправним торговцем — жорстким, але справедливим. Його обрали представником міста на переговорах із Братством Далласа й Мутантами Остіну. З важелем у руці та десятиліттями переговорів за плечима, Чо Банг подбає, щоб Лоун Стар отримав свою частку об’єднаного Техасу."
LNS_WARLORD_HAND_NAME: "Воєвода Хенд"
LNS_WARLORD_HAND_DESC: "Не всі в Техасі мріють про відродження давно мертвої Республіки. Дехто вірить, що сильні повинні правити. Воєвода Хенд — з таких. Він розуміє: аби вижити в пустелі, треба домінувати, або тебе зітруть. Легіон зі Заходу лише підтверджує цю філософію. І Хенд іде по Техас, не зупиняючись перед політиками з Братства, Мутантами чи торгівцями з Лоун Стару."
# LON
LON_MOONWATCHER_SAYO_NAME: "Сайо, що Дивиться на Місяць"
LON_MOONWATCHER_SAYO_DESC: "Параноїдальна відлюдниця, Сайо — дивний вибір для лідера племені Самотнього Дерева. Вона не впевнена у собі, але надзвичайно передбачлива. Плани, запасні плани, контрплани — це її світ. Її підозри досі оберігали плем’я, і якщо ворогів раптом не буде, вона їх вигадає."
LON_LONGKO_SNAKEYE_NAME: "Лонґко Зміїне Око"
LON_NIMBLE_SPINEBREAKER_NAME: "Хвацький Ламач Хребтів"
LON_BURNER_GECKO_NAME: "Палючий Гекон"
# LOS
LOS_HIGH_PRIESTESS_SAPPHO_NAME: "Верховна Жриця Сапфо"
LOS_HIGH_PRIESTESS_SAPPHO_DESC: "Шістдесят років тому життя Сапфо — чи то пак, її нежиття — змінилося назавжди, коли її батько, Блейк, загинув у битві з Братством Сталі. Після його смерті вона успадкувала титул верховної жриці Церкви Загублених — керівного органу гулів у місті Лос. Коли їхнє святе місце, Корпоративне Сховище, було знищене у вогняному вибуху, Сапфо повела свій народ новим шляхом — шляхом духовності й миру.\n\nПід її проводом Лос прихистив численних біженців із Некрополя, а сама Сапфо відновила церкву, що лишилася в руїнах після її батька."
LOS_BENJAMIN_ABERCROMBIE_NAME: "Бенжамін Аберкромбі"
LOS_JEFFREY_CARR_NAME: "Джеффрі Карр"
LOS_EUGENE_FORD_NAME: "Юджин Форд"
# LUB
LUB_MAYOR_IRVING_WATTS_NAME: "Мер Ірвінг Воттс"
LUB_MAYOR_IRVING_WATTS_DESC: "Народжений і вирощений у Лаббоці, Ірвінг Воттс — відома постать на вулицях міста. Ще в юності він проводив час як серед гулів, так і серед людей, шукаючи шляхи до примирення після серії рейдів Шакалів, у яких обидві сторони звинувачували одна одну. Обраний мером у 2273 році завдяки довірі обох спільнот, він провів низку реформ, намагаючись об’єднати місто в одне ціле."
LUB_CHARLES_SULLIVAN_NAME: "Чарльз Салліван"
LUB_CHARLES_SULLIVAN_DESC: ""
LUB_THOMAS_STUART_NAME: "Томас Стюарт"
LUB_THOMAS_STUART_DESC: ""
LUB_ZACH_SMITH_NAME: "Зак Сміт"
LUB_ZACH_SMITH_DESC: ""
# LUL
LUL_REX_ASTRORUM_NAME: "Рекс Астрорум"
LUL_REX_ASTRORUM_DESC: ""
# MAX
MAX_MAXIMILIAN_NAME: "Максиміліан"
MAX_MAXIMILIAN_DESC: "Другий син Тлалока, гордий привид другого мертвого імператора Мексики, Максиміліан терпляче розширював свій вплив через мережу батька протягом десятиліть. Тепер, отримавши свою частку постапокаліптичного раю, він має намір правити мексиканцями знову — навіки.\n\nМожливо, через європоцентричну освіту, вкладену Тлалоком, Максиміліан — теплий, пристрасний, але й дещо наївний. Його емоційність, перенесена в кремнієве тіло, робить його більш людяним, ніж більшість людей. У скорботі за дружиною він оточує себе радницями, сподіваючись знайти серед них її відродження. Така доброта — чудова. Але така нестабільність — небезпечна."
MAX_UNITRACK_V05_NAME: "Юнітрек V05"
MAX_UNITRACK_V05_DESC: ""
MAX_ORACLE_ROBOT_NAME: "Оракул-Бот"
MAX_ORACLE_ROBOT_DESC: ""
MAX_HOPE_V16_NAME: "Надія V16"
MAX_HOPE_V16_DESC: ""
# MCO
MOC_COMMONWEALTH_CONGRESS_NAME: "Конгрес Середнього Заходу"
# MES
MES_LOZEN_COLORADAS_NAME: "Лозен Колорадас"
MES_LOZEN_COLORADAS_DESC: "Розумна, харизматична та впевнена — Лозен Колорадас є гордою нащадкою ліпан-апачі, одного з трьох підплемен, що складають націю мескалеро. Вперше обрана Президенткою Племінної Ради в 2272 році традиційним таємним голосуванням, вона залишається популярною прагматичкою серед усіх підгілок нації і, без сумніву, продовжить утримувати довіру свого народу ще багато років."
MES_HENRY_LONGSTREET_NAME: "Генрі Лонгстріт"
MES_LAFAYETTE_WILCOX_NAME: "Лафаєт Вілкокс"
MES_JOSEPH_GREEN_NAME: "Джозеф Ґрін"
# MDT
MDT_MESMERALDA_NAME: "Месмеральда"
MDT_QUEEN_MESMERALDA_NAME: "Королева Месмеральда"
MDT_MESMERALDA_DESC: "Колись вона була просто Гадюкою — черговою рейдеркою з нашийниками й Месметронами, що збирала тіла для південних ринків. Вона вірила в жорстокість, бо лише вона давала їй місце у світі.\n\nАле жорстокість обернулася проти неї. На півночі, зраджена своїми, вона була залишена скривавленою серед уламків. І саме там вона знайшла не милість, а дещо дивніше — старий, обгорілий комікс.\n§Y"Ґроґнак Варвар: Битва з Королевою Горгон"§!\n\nКоли вона дочитала його, її колишнє «я» зникло. Народилася §RМесмеральда§! — ім’я, яке вона обрала сама. Легендарна лиходійка, що зійшла з сторінок на руїни світу.\n\nЗ тими ж інструментами, які її поневолили, вона зламала Поглиначів Кісткового Мозку й перетворила їх на своє королівство. Вони вірять не тому, що обмануті — а тому, що мусять вірити. І як обіцяли легенди, вона йде створити §YГоргонію§! — царство, де фантазія керує, а реальність підкоряється."
MDT_CUNNING_TAPPER_NAME: "Підступний Таппер"
MDT_SNARLING_TSE_NAME: "Гарчливий Цзе"
MDT_TALL_SLINGER_NAME: "Довгорукий Стрілець"
