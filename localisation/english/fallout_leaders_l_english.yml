HEA_PRIEST_ROBERTS_NAME: "Священик Робертс"
HEA_CANON_PHILLIPS_NAME: "Канонік Філліпс"
# HGH
HGH_PASTOR_SAMUEL_NAME: "Пастор Самуїл"
HGH_PASTOR_SAMUEL_DESC: "Давно стражденний голова Вищої Церкви, Самуїл керує ворогуючими парафіями Великої Ріки вже десятиліття. Але з підйомом Небесної Брами, єресі Обраних та нестабільністю на заході, його терпіння — як і волосся — тане."
HGH_LEMUAL_HARRISON_NAME: "Лемуел Гаррісон"
HGH_JEROME_STEELE_NAME: "Джером Стіл"
HGH_BENJAMIN_SHERMAN_NAME: "Бенджамін Шерман"
# HUA
HUA_WAUBA_NAME: "Вауба"
HUA_WAUBA_DESC: "Плем’я Вауби стало одним із перших, що поглинув Легіон. Культура стерта, дух розчавлено. Та коли правитель зник, зник і тягар війни. Вауба взяла на себе завдання — допомогти своєму народові відродитися, знайти нову ідентичність у старому світі."
