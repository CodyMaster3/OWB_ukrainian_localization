PSH_ORGANIZATION_BOT_314_NAME: "ОргБот 314"
PSH_ORGANIZATION_BOT_314_DESC: "§X«Захищати й служити. Бзззт!»§!\n\nКолись підконтрольні зловмисному ШІ, що прагнув розширити свою владу через збір технологій і тотальний контроль, Протектрони служили вірними солдатами у війні за міць. Але після загибелі свого господаря, ці машини залишилися без команди — й почали забувати свою мету. Так, блукаючи залишками поля бою, вони перетворилися на нове суспільство.\n\nВони почали будувати укриття, торгувати з навколишніми селами, запрошувати людей до спільної роботи. Так виник Протектронний Центр Безпеки, що з ворогів людства став його новими захисниками."
PSH_ORGANIZATION_BOT_315_NAME: "ОргБот 315"
PSH_ORGANIZATION_BOT_315_DESC: ""
# RAP
RAP_SHAYNA_WELLBY_NAME: "Шайна Велбі"
RAP_SHAYNA_WELLBY_DESC: "Шайна народилася в родині мореплавців і стала вправним керманичем Потоків. Ще в молодості вона очолила плем’я як Великий Капітан і зберегла дух незалежності, який супроводжував її народ поколіннями."
RAP_LAUGHING_MCMURPHY_NAME: "Сміючийся МакМерфі"
