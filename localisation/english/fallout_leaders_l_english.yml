# DSP
DSP_THE_WILD_ONE_NAME: "Дикий"
DSP_THE_WILD_ONE_DESC: "Відомий по дорогах Луїзіани своєю жорстокістю й підступністю, Дикий давно мчить півднем на своєму чорному мотоциклі. Хоча його голос — не єдиний серед гурту грабіжників, знаних як Десперадос, його досвід дає йому велику вагу при прийнятті рішень, які стосуються всієї банди."
DSP_PIERRE_TRAVIS_NAME: "П’єр Тревіс"
