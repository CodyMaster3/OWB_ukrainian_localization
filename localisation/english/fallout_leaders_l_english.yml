# GAM
GAM_SOBEK_THE_POWERFUL_NAME: "Собек Могутня"
GAM_SOBEK_THE_POWERFUL_DESC: "Справжнє втілення тиранії, Собек править племенем Гатор-Мо зі сталевим кулаком. Названа на честь єгипетського бога-крокодила, вона здобула це ім’я після того, як у 14 років голіруч вбила мутованого гатора. Відтоді вона патрулює болота Луїзіани, шукаючи необачних подорожніх, що зайшли надто далеко від дороги."
