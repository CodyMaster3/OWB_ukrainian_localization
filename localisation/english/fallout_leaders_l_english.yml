# COW
COW_BILLY_CLANTON_NAME:0 "Біллі Клентона"
COW_BILLY_CLANTON_DESC:0 "Дезертир з Арізонських Рейнджерів ще за багато десятиліть до битви при Кінгмані, Біллі опинився в дивному становищі, коли останні залишки Рейнджерів утекли на південь. З того часу Біллі поступово здобував владу, пропагуючи ізоляціонізм — у часи загрози Бика така мета виглядала чесною. Та все ж його старі симпатії не зникли: як він міг відмовити залишкам Рейнджерів, хай і зламаним? Після безсонних ночей він дійшов компромісу: дозволив їм оселитися в Країні Ковбоїв, якщо ті не будуть мілітаризуватись. Адже Клентона не міг ризикувати викликати гнів Цезаря. Він прийде рано чи пізно... але, можливо, не сьогодні."
COW_EMILIANO_REYES_NAME:0 "Еміліано Рейєс"
COW_EMILIANO_REYES_DESC:0 ""
COW_SEBASTIAN_GOMEZ_NAME:0 "Себастіан Ґомес"
COW_SEBASTIAN_GOMEZ_DESC:0 ""
COW_RICARDO_PIMENTEL_NAME:0 "Рікардо Піменнтель"
COW_RICARDO_PIMENTEL_DESC:0 ""
# CPK
CPK_MACAWI_NAME: "Стівен Макаві"
CPK_MACAWI_DESC: "Анклав, Братство, Армія Звільнення Мутантів — для Макаві це не має значення. Як він сам скаже: всі вони хочуть одного — вугілля Консорціуму, що живить заводи й обігріває домівки. Величезні баржі пливуть по Міссісіпі аж до Нового Орлеану, наповнені багатствами Дакоти. Хай інші воюють за землю й ресурси — Консорціум залишиться на своєму й переживе всіх."
# CRA
CRA_COMMANDER_KEEN_NAME: "Командор К’Ін"
CRA_COMMANDER_KEEN_DESC: "Командор К’Ін зі Зетанського зоряного флоту застряг на Землі після того, як його корабель зазнав аварії в Нью-Мексико. Після того, як США не змогли його знищити, корпорація Long Now запропонувала побудувати для нього камеру утримання. Згодом навколо неї було зведено Зону 51 — аби переконатися, що К’Ін більше не загрожуватиме Америці."
# CRZ
CRZ_OCTANEIUS_NAME: "Октаней"
CRZ_OCTANEIUS_DESC: "Фанатик крайнощів, нічого не відомо про піромана, що називає себе 'Октаней', до того, як він став шаманом Божевільних Рогів. Але його подальші дії — відомі всім. Проповіді про вогонь і сірку, дещо приглушені старим респіратором, підбурюють його народ до нових екстремістських висот, аби принести апокаліптичне очищення вогнем."
CRZ_DANCES_DUFF_NAME: "Танцює з Даффом"
CRZ_STALKING_BAZMOK_NAME: "Слідом за Базмоком"
CRZ_TALL_BAZMOK_NAME: "Високий Базмок"
# CWB
CWB_HELKI_THE_RIPPER_NAME: "Гелкі Роздирай"
CWB_HELKI_THE_RIPPER_DESC: "§t\"Любиш свої блискучі цяцьки? А що, якщо ми обпалимо тебе ними?\"§!\n\nПоки інші покладаються на тендітні лазери та пауерброню, Кіфери сильні. Вони не вірять у машини, що обертаються проти свого господаря. Найгірше — загроза, яку вони несуть. Бездушні роботи, сталеві чудовиська, штучні інтелекти... всі вони загроза для світу. \n\nКіфери не стоятимуть осторонь у війні проти машин, і Гелкі — одна з їхніх найкращих воїтельок. Сильна, рішуча, з вогнем у серці. Вона — Роздирай, здатна рвати роботів і людей як папір. Нехай наступний хрестовий похід принесе їй славу!"
CWB_ALLISON_FORREST_NAME: "Елісон Форрест"
CWB_ULYSSES_HINDMAN_NAME: "Улісс Хіндман"
CWB_AUGUSTUS_GREER_NAME: "Авґуст Ґрієр"
# DAM
DAM_GREAT_BUSTER_NAME: "Великий Бастер"
DAM_GREAT_BUSTER_DESC: "Великий Бастер. Володар Дамби. Гроза Небраски. У них багато імен, але всі свідчать про їхню зверхність серед Бастерів. Вони гордо ведуть свій рід від інженерів, яких відправили керувати дамбою. Для них Оаї — це майже святиня. Вони не зупиняться, доки не відновлять її славу. Але на ресурси від поселенців не покладаються — Оаї знову запрацює тільки тоді, коли Небраска впаде на коліна."
