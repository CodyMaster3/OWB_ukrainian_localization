# ASF
ASF_ROBERT_DAEGER_NAME: "Архієпископ Роберт Деґер"
ASF_ROBERT_DAEGER_DESC: "Народжений у невеличкому селі поблизу Санта-Фе, Деґер з юності присвятив себе Церкві. Він — свого роду реформатор, та не менш відданий Писанню, ніж будь-який архієпископ до нього. Пліч-о-пліч із радниками він веде Архієпархію вперед."
ASF_PATRICK_POPE_NAME: "Патрік Поуп"
ASF_PATRICK_POPE_DESC: ""
ASF_RAPHAEL_BROWN_NAME: "Рафаель Браун"
ASF_RAPHAEL_BROWN_DESC: ""
ASF_CADMUS_COOPER_NAME: "Кадмус Купер"
ASF_CADMUS_COOPER_DESC: ""
# ASS
ASS_TUFFY_NAME: "Таффі"
ASS_TUFFY_DESC: "Описана фанатами як «міцна як холодильник з головою», Таффі — важка опора команди ролердів Assassin City. Все ще лютуючи через жорстоке вигнання з Колізею Фейр-Парк руками Техаського Братства, Таффі та дівчата зміцнюють свою владу в околицях Парижа, штат Техас — безсумнівно плануючи повернути свій стадіон при першій же нагоді."
ASS_HOLLY_WRATH_NAME: "Голлі Рет"
ASS_ROXXY_ROLL_NAME: "Роксі Ролл"
ASS_PEGGY_MACDEATH_NAME: "Пеґґі МакДет"
# ATE
ATE_EMPRESS_NAME:0 "Мовець Єссенья Ацтланл"
ATE_EMPRESS_DESC:0 "Єссенья править Імперією з юності, коли її несподівано посадили на трон після ядерного удару Тлалока, що знищив армію під проводом її батьків, та загибелі братів у кривавому відступі. Ця тінь ніколи не покидала її правління. Поразка від Іци лише зміцнила плітки про її невартість. Та сліпа імператриця знає: кидати відповідальність не можна, бо вже десять років її переслідує жахливий сон — смерть Тлалока приведе за собою еру крові й хаосу."
ATE_RAFAEL_NAME:0 "Рафаель Куаутлі"
ATE_RAFAEL_DESC:0 "Швидкий злет Рафаеля Куаутлі на вершину влади похитнув баланс в Імперії, проте його харизма й абсолютний контроль над армією не залишили місця для опору. Він вже оголосив себе засновником нової династії Куаутлі — «Спаситель»."
ATE_ARMANDO_NAME:0 "Армандо Оселотль"
ATE_ARMANDO_DESC:0 "Армандо Оселотль не мав наміру захоплювати трон, а лише хотів усунути некомпетентну Єссенью до повноліття її доньки. Та через шалений народний спротив він несподівано опинився на чолі нової династії. Люди вже кличуть його Оселотль, «Чемпіон»."
ATE_KINKAID_NAME:0 "Гейл Кінкейд"
ATE_KINKAID_DESC:0 "Флот Імперії Ацтлан часто висміюють за нездатність здобути бодай одну перемогу над Іцою. Та Гейл Кінкейд, нащадок солдата з таємного бункера США, щиро вірить у потенціал флоту. Його родинна історія сягає ще Другої світової. Ось уже десятки років він просуває дорогі реформи — на жаль, на роздратування військових."
# BAG
BAG_GODDARD_NAME: "Ґоддард"
BAG_GODDARD_DESC: "Старий, суворий, ніколи не усміхнений вчений, якого президент Танді відправила геть від Шейді-Сендс лише б не бачити — слідкувати за дослідницькими програмами в найвіддаленіших точках НКР. Саме тому він, певно, добровільно очолив експедицію в Боулдер-Дом — аби, нарешті, досліджувати самому.\n\nХаос і катастрофи цієї місії лише зробили його більш цинічним, озлобленим трудоголіком. І в цьому всьому він звинувачує Віктора Преспера. Гнів Ґоддарда не згасає. Тіло зцілилось, але гордість — ні."
BAG_HENRY_JOHNSON_NAME: "Генрі Джонсон"
BAG_WILLIAM_ANDERSON_NAME: "Вільям Андерсон"
BAG_MICHAEL_HAYS_NAME: "Майкл Гейс"
# BAR
BAR_DENNIS_STEPINAC_NAME: "Денніс Степинац"
BAR_ALEX_MONROE_NAME: "Алекс Монро"
BAR_MATEO_GLEESON_NAME: "Матео Глісон"
# BDT
BDT_ODIOUS_KING_NAME:0 "Огидний Король"
BDT_ODIOUS_KING_DESC:0 "Колись він був людиною. Його зламали — і замість повернення, він перетворився на щось інше. Огидний Король — відлуння минулого, що керує Танцюристами Кісток. Вони слухають його химерний спів і слідують хореографії божевілля."
BDT_CRANIUM_NAME:0 "Череп"
BDT_CRANIUM_DESC:0 "Викрадений з каравану Небесної Брами, Череп зростав серед Танцюристів Кісток. Він став воїном, захисником їхніх земель. Сьогодні він — новий лідер, визнаний завдяки своїй силі та відданості."
BDT_CAIN_NAME:0 "Каїн"
BDT_CAIN_DESC:0 "Каїн — очільник Серфових Лордів. Віруючий в Бога Пару, він прибув з паломниками до земель Танцюристів, щоби просвітити їх. Прийнятий тепло, він нині залишається фігурою таємничою, хоча відомо, що зростав серед Дітей Воріт."
BDT_DIOS_NAME:0 "Діос"
BDT_DIOS_DESC:0 ""
# BEL
BEL_Winterborn_DESC:0 "Зимороджений захищає Беллінгем вже понад двісті років. Колись — солдат, нині — гуль, обгорілий радіацією, він ніколи не покидає свою домівку. Його життя — це битва за місто. І той, хто спробує забрати його — дорого за це заплатить."
# BIG
bigger_leader_name:0 "Кристал Бет"
# BLK
BLK_CANYON_RUNNER_NAME:0 "Бігун Каньйоном"
BLK_CANYON_RUNNER_DESC:0 "Дивом виживши під час краху Легіону, Бігун Каньйоном звернувся до своїх витоків. «Рабство — це шлях до спасіння». Він відродив своє плем’я як нову рабовласницьку силу, і до нього приєднались колишні легіонери."
# BLO
BLO_EL_BANDIDO_SANGRIENTO_NAME:0 "Ель Бандідо Сангрієнто"
BLO_EL_BANDIDO_SANGRIENTO_DESC:0 "«Кривавий Бандит» — ім’я, яке викликає жах на півночі Мексики. Гуль, що став легендою наркокартелю, прибув зі Сходу зі своєю армією найманих убивць. Зупинив наступ лучадорів тактичним генієм і жорстокістю. Нині — володар півдня Сіналоа, готується до нової різанини, в якій кров Мексики потече ріками."
BLO_PEDRO_KOSTERLITZKY_NAME:0 "Педро Костерліцкі"
BLO_NICOLAS_DE_COS_NAME:0 "Ніколас де Кос"
BLO_MARIANO_KOSTERLITZKY_NAME:0 "Маріано Костерліцкі"
# BLP
BJS_GUAREZ_NAME:0 "Ґуарез"
BLP_GUAREZ_LEADER_DESC:0 "§YНКР кричить «Досить!» — я ж відповідаю «Ще повно!»§!\n\nРауль Моя, капітан Віце-королівства, загинув у вигнанні, а його син Ґуарез зібрав уламки сім’ї в Нижній Каліфорнії. Спільно з Вільєю об’єднав банди півострова у фракції §HВалле§! та §GПас§!, створивши величезну контрабандну мережу. Нині його батьківщина в Кістяній Ямі — вже центр реабілітації, а політики НКР точать зуби. Ґуарез мусить тримати статус-кво, інакше його рід втратить дім знову."
BJS_GUAREZ_DESC:0 "Майстер логістики та переговорів, Ґуарез перетворив Пас на контрабандну імперію. Він забезпечує Валле зброєю, хімією й людьми, а також має численних ворогів у НКР."
BLP_pedro_almonte_name:0 "Педро Альмонте"
BLP_emiliano_corra_name:0 "Еміліано Корра"
BLP_gaspar_corra_name:0 "Ґаспар Корра"
# BON
BON_BILL_CALHOUN_NAME: "Білл Келгун"
BON_BILL_CALHOUN_DESC: "Надзвичайний лікар з Послідовників Апокаліпсису, Келгун був відправлений вивчати діалекти пусток разом зі злощасним Едвардом Соллоу. Після того, як його схопили Чорноногі, він став свідком зародження Легіону Цезаря і страждань, які той приніс. Цивілізація, прогрес, людяність — усе потоптано під штандаром Легіону. Як прихильник ахімси — непротивлення злу — Келгун протистояв Соллоу, скільки міг. Після всіх розбіжностей із «Цезарем» він повернувся до Боньярду з лихими новинами.\n\nПовернувшись додому як змінена людина, він присвятив себе навчанню звичайних людей у Каліфорнії. Він навчав вирощувати врожаї, знищуючи монополію Брамін-баронів і здобуваючи їхню ненависть. Незважаючи на переслідування, продовжив подорожувати від міста до міста, покращуючи життя тисяч людей. Його самопожертва принесла йому славу, а послідовники зробили з нього символ боротьби з корупцією й мілітаризмом.\n\nКоли Республіка впала у хаос після перевороту, це стало останньою краплею. Він закликав до протесту — і тисячі простих людей вийшли за нього. З одним стимпаком і однією гвинтівкою, Келгун — голос звичайного народу і втілення каліфорнійського шляху."
BON_BENJAMIN_CROCKER_NAME: "Бенджамін Крокер"
BON_NOAH_STANWELL_NAME: "Ноа Стенвелл"
BON_JOHN_KILBORN_NAME: "Джон Кілборн"
# BOO
BOO_MOTHER_PEARL_NAME: "Матір Перл"
BOO_MOTHER_PEARL_DESC: ""
# BRG
BGR_ALKOM: "RELCOM"
BGR_ALKOM_DESC: "RELiable COMmunications колись був інакодумцем, ув’язненим до війни. Його перетворили на робомозок для військової машини. Тепер його називають божевільним. Для RELCOM людська природа — це експлуатація, жадоба і заздрість. Краще бути машинами. Без бажань. Без амбіцій. Лише співпраця. Не всі згодні — тому й існує цех переробки."
# BRI
BRI_RACHEL_MAY_NAME: "Рейчел Мей"
BRI_RACHEL_MAY_DESC: "Народжена в багатій родині скейвенджерів, Рейчел мала хист до політики й статистики. Після загибелі батьків у дивній аварії на вольфрамовому руднику, вона перебрала компанію лише у 20 років і поглинула менші фірми. Хоч вона й симпатизує мормонам, мормонкою не є, тому під час занепаду мормонської влади скористалася можливістю створити коаліцію компаній і проголосила незалежність. Її Бріґем процвітає завдяки експорту вольфраму."
BRI_AUGUSTUS_HAYES_NAME: "Авґустус Гейс"
BRI_AMBROSE_MEADE_NAME: "Амброуз Мід"
BRI_LESLIE_SEDGWICK_NAME: "Леслі Седжвік"
# BRT
BRT_BILLIE_JEAN_NAME: "Біллі Джин"
# BSU
BSU_HONEST_NAME: "Гонест"
BSU_HONEST_DESC: "Механіки — рідкість у пустці, особливо серед племен. Гонест отримав прихильність Легіону як механік, але використав її, наскільки міг. Він ніколи не приймав свою роль у Легіоні після підкорення племені і тільки й чекав нагоди покласти цьому край."
BSU_STERN_NAME: "Стерн"
# BVC
BVC_PANCHO_VILLA_NAME: "Панчо Вілья"
BVC_PANCHO_VILLA_DESC: "Народжений у бідній родині контрабандиста з Колонета, Панчо Вілья піднявся в рядах банд Вальє, безжально розширюючи контрабанду в НКР. Жодна спроба зупинити його не вдалася — завдяки кмітливості й підтримці банд Пас. Прибутки спрямовуються на покращення життя мешканців Вальє, тож він має підтримку народу. Але зростаюча агресія НКР, поселенці й конфлікти — це вже новий виклик. Хоч сили нерівні, він готовий боронити своїх."
BVC_MELCHOR_HUERTA_NAME: "Мельчор Уерта"
BVC_ROMULO_ROBLES_NAME: "Ромуло Роблес"
BVC_PORFIRIO_ALMONTE_NAME: "Порфіріо Альмонте"
# CAC
CAC_COMMONWEALTH_ASSEMBLY_NAME: "Каскадійські Збори"
# CAF
CAF_BARON_GARCIA_NAME: "Барон Ґарсія"
CAF_BARON_GARCIA_DESC: "Його минуле — загадка, але в хаосі 2080-х Барон вперше з’явився. Пережив жахи, яких краще не згадувати, бачив падіння імперій і, ставши безсмертним, вирішив створити власну. Загартований майже двома століттями виживання, він прокладає шлях крізь пустку, не зважаючи на мораль. Імператори, президенти, революціонери — усі вклоняються багатству."
CAF_ANGEL_CORRA_NAME: "Анхель Корра"
CAF_ROMULO_ZULOAGA_NAME: "Ромуло Сулоага"
CAF_FELIPE_PIMENTEL_NAME: "Феліпе Піменель"
# CAR
CAR_THE_CHEF_NAME: "Шеф"
CAR_THE_CHEF_DESC: "Карфагенці — безжальні рейдери, але готують смачно. Шеф тримає згуртованість банди смачними бенкетами. Чутки, що він готує з жертв — лише чутки. Кажуть, приправи не ті."
CAR_EDMUND_WISE_NAME: "Едмунд Вайз"
CAR_MALVIN_HETH_NAME: "Мелвін Хет"
