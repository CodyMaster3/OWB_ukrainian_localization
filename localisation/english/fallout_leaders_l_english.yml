# NCN
NCN_JEREMIAH_RIGDON_NAME:0 "Єремія Ріґдон"
NCN_KING_JEREMIAH_RIDGON_NAME:0 "Король Єремія I"
NCN_GOVERNOR_JEREMIAH_RIDGON_NAME:0 "Губернатор Ріґдон"
NCN_JEREMIAH_DESC:0 "Уражений гарячкою в юності, Ріґдон довгий час провів прикутим до ліжка, поки голос Божий не наповнив його розум. Він вижив — і це вважалося чудом — але вийшов із хвороби зміненим. Його запал запліднив громаду фанатизмом і розколом. Зібравши власну вірну паству, Ріґдона проголосили новим пророком Церкви Святих Останніх Днів. Спершу він прийняв свою місію з натхненням і рішучістю, та з роками тіло постаріло, а інтерес до церковних справ згас. Тепер за закритими дверима процвітає розкіш і розбрат. Саме він найбільше смакує плодами праці Ханаанітів, і дедалі більше вірян шепоче про фальш його віри — і десятилітню відсутність Божих одкровень."
NCN_GEORGE_MCDOWELL_NAME:0 "Джордж МакДауелл"
NCN_GEORGE_MCDOWELL_DESC:0 ""
NCN_EUGENE_WILSON_NAME:0 "Юджин Вілсон"
NCN_EUGENE_WILSON_DESC:0 ""
NCN_DANIEL_NAME:0 "Даніел"
NCN_DANIEL_DESC:0 "Добре зважені слова, доброта до краю — Даніел завжди був ревним слугою Господнім. Коли Нью-Ханаан почав скочуватися у розпусту, він став альтернативною постаттю в Церкві. Він ніколи не кидав відкритого виклику Пророку Єремії, але й не боявся захищати пригноблених і знедолених. Відчувши загрозу, Єремія почав відправляти Даніела у тривалі, погано сплановані місіонерські походи. Хоча це й обмежувало його вплив, Даніел навчився культури племен Юти й здобув серед них чимало друзів. Повернувшись під час наступу Білоногих, він швидко став провідником для тих, хто вірив, що ханаанці збилися зі шляху. Його лагідний погляд і теплі слова ведуть паству з ніжною рішучістю."
NCN_JOSHUA_GRAHAM_NAME:0 "Джошуа Ґрем"
NCN_JOSHUA_GRAHAM_DESC:0 "Спершу місіонер Божий, життя Ґрема змінилося у 2246 році, коли він зустрів двох Послідовників Апокаліпсису в печерах Великого Каньйону. Це були Білл Калгун та Едвард Саллоу — вони досліджували місцеві племена. Ґрем, досвідчений перекладач, допомагав їм у мандрівках. У 2247 вони потрапили до племені Чорноногих — і все змінилося. Їх не випустили, бо плем'я стояло на межі знищення. Саллоу, аби вижити, навчив їх воєнної справи. Так народився Цезар. Ґрем залишився з ним — спершу як перекладач, згодом як генерал, а пізніше як Малпайський Легат. Він чинив жахливі звірства, і став найвірнішим полководцем Цезаря. Та з часом його совість ожила, а Слово Господнє знову озвалося в серці. Цезар не міг це стерпіти — бо лише він був 'Богом' у Легіоні. І хоча терпів віру Ґрема доти, доки той перемагав, усе змінилося, коли..."
JoshuaReturnsCanaanBurns:0 "...Ґрем осмілився виступити проти підтримки Цезарем спалення Нью-Ханаану. Тоді Цезар остаточно переконався: вірність Ґрема — не йому. І наказав його стратити — прилюдно."
JoshuaRivalsCaesar:0 "...перемога Ґрема в битві за Гуверську дамбу зробила його настільки популярним, що він став суперником самому Цезарю. Той наказав стратити його — болісно і показово."
JoshuaFailsDam:0 "...та перемоги припинились. Ґрем зазнав поразки під Гувером: його необачна тактика обернулась катастрофою. Цезар не прощав поразок — і наказав убити його."
# NCR
NCR_WENDELL_PETERSON_NAME:0 "Венделл Пітерсон"
NCR_WENDELL_PETERSON_DESC:0 "Четвертий президент Нової Каліфорнійської Республіки, Венделл Пітерсон був обраний після того, як 38 громадян були вбиті в Мохаві за попереднього президента. Пітерсон обіцяє помсту та повернення контролю НКР над Мохаві, але на ділі він слабкий та неефективний — за його правління розквітає безліч розрізнених фракцій."
NCR_GRANT_C_HAYES_NAME:0 "Ґрант С. Гейс"
NCR_GRANT_C_HAYES_DESC:0 "§C\"Бути американцем колись щось означало — і буде означати знову.\"§!\n\nҐрант С. Гейс здобув славу в НКР завдяки своєму прагненню до прогресу — як у науці, так і в політиці — ще до виборів 2278 року. Зараз, коли він обіймає найвищу посаду, республіку охоплює новий дух: логіка, наука, і найголовніше — патріотизм.\n\nХодять чутки, що він є нащадком політиків довоєнної епохи або навіть Анклаву. Проте більшість громадян підтримують його — навіть тішаться, що така спадщина може лише посилити його як лідера. У ньому бачать не сильного, як Кімбала, і не співчутливого, як Олґуда, а розумного президента, що веде НКР у майбутнє, використовуючи минуле як інструмент. Йому вже присягнули вірністю багато військових Каліфорнії.\n\nГромадяни й мешканці Пустки затамували подих, чекаючи змін, які несе блиск в очах Гейса."
NCR_ALLGOOD_MURPHY_NAME:0 "Олґуд Мерфі"
NCR_ALLGOOD_MURPHY_DESC:0 "§4\"У НКР все гаразд. Ніхто не голодує в дірявій халупі. Ніхто не тремтить перед рейдерами. Ніхто не платить данину корумпованому чиновнику. Розширюймося, бо все гаразд.\"§!\n\nМолодий Шон Мерфі виголосив палку промову на Конвенції експедицій НКР, у якій розкритикував Мохавську експедицію. Так народився іронічний вираз \"все гаразд\", що став символом розриву між пропагандою й реальністю. Та слава принесла Мерфі національне визнання та прізвисько Олґуд.\n\nВін зарекомендував себе як ворог традиційних яструбів війни й корумпованих еліт НКР. І після своєї визначальної промови, Олґуда обрали президентом. Він став серйозною перешкодою для корупції, обіцяючи реінтеграційні програми й мир.\n\nОлґуд — уособлення найкращого, що є в НКР: ідеалістів, які мріють про краще життя. Він безжальний до ворогів, але милосердний до переможених. І хоч його називають пацифістом — це хибне судження. Він перший прагне миру, але останній, хто відступить перед боєм."
NCR_ANTON_FLYNN_NAME:0 "Антон Флінн"
NCR_ANTON_FLYNN_DESC:0 "Антон Флінн — майстер угод і домовленостей, який керує багатьма кулуарними процесами в НКР. Проте його участь у владі може підірвати легітимність Республіки, бо громадяни дедалі більше бояться, що справжнє керівництво країною перехоплює олігархія."
NCR_AARON_KIMBALL_NAME:0 "Аарон Кімболл"
NCR_AARON_KIMBALL_DESC:0 ""
NCR_DRUMMOND_NAME:0 "Александр Драммонд"
NCR_DRUMMOND_DESC:0 "Драммонд має багаторічний досвід, який дозволяє йому розробляти плани блискавично та ефективно. Однак він не користується популярністю серед населення, а його призначення може серйозно підірвати авторитет Республіки."
NCR_mossman_name:0 "Рейнджер Моссман"
NCR_commitee_name:0 "Комітет національної безпеки"
NCR_vacant_leadership:0 "Відсутнє керівництво"
NCR_MOORE_NAME:0 "Кассандра Мур"
CASSANDRA_MOORE_DESC:0 "Мур не кліпає, не вагається. Її рейнджерська інтуїція робить її безжальною — вона завдає удару швидко, точно й без жалю. Вона бачить загрози ще до того, як ті виникають, і має готовий план дій ще до того, як перший постріл пролунає."
# NEW
NEW_MR_BISHOP_NAME:0 "Містер Бішоп"
NEW_MR_BISHOP_DESC:0 "Невдовзі після поразки Анклаву в Наварро, в сім’ї Бішопів народилась нова дитина. Наділений жагою до мандрів та неймовірною впертістю, він мало цікавився родинними справами — аж поки в тринадцять років не захопив владу над сім'єю і не повів її до вершини Ріно. Проте інші мафіозні родини й досі загрожують його правлінню."
NEW_THRADD_NAME:0 "Вождь Традд Безсмертний"
NEW_THRADD_DESC:0 "Монстр, мутант — лідер. Вождь Традд виконує обов'язки констебля у Нью-Ріно вже два людських життя і, вочевидь, служитиме ще довго. Суворий і справедливий, його магнетична стриманість зробила його острівцем стабільності серед хаосу вулиць Ріно. Навіть викрадення й мутація, які він пережив у лабораторіях Творця, не змусили його залишити пост.\n\nКоли імпровізований мир у Брокен-Гіллс зруйнувався разом із виснаженням урану, мутанти мігрували до Ріно, і Традд став ідолом спільноти, символом безпеки та надії. Після краху крихкого миру між людьми й мутантами, Традд став де-факто лідером у майже анархічному місті. Через доброту чи примус — він прагне перетворити Ріно на прихисток, де мутанти ніколи більше не відчують відторгнення."
NEW_BROKENFAM_NAME:0 "Об'єднані Родини"
NEW_BROKENFAM_NAME_DESC:0 "Брати Брокен, нащадки мутантів із Брокен-Гіллс, стали найновішою родиною Нью-Ріно завдяки підтримці супер-мутантської поліції. Зазнавши лише експлуатації й зневаги від людей, вони заробили своє місце завдяки майстерності: надаючи допомогу й прихисток іншим мутантам, поки не стали політичною та збройною силою. Завдяки миротворчій роботі Брокенів, родини Ріно об'єдналися, сформувавши раду, яка нібито ставить інтереси народу понад усе."
NEW_WRIGHT_NAME:0 "Крістофер Райт"
NEW_WRIGHT_DESC:0 ""
NEW_SALVATORE_NAME:0 "Мейсон Сальваторе"
NEW_SALVATORE_DESC:0 "Я не сумніваюся у твоїх емоціях. Але в чому сенс усіх цих трагічних гримас і театру, якщо ти не збираєшся змінити свою поведінку — як зробив це я? Північ добре знає: коли тобі потрібна допомога... краще подзвони мені."
NEW_MAMA_NAME:0 "Тіарет \"Мама\" Ван Граф"
NEW_MAMA_DESC:0 "Її звуть Тіарет. §RЛевиця§!. Ніхто не знає, чи справжнє це ім’я, та воно ідеально пасує до безжальної матріарха клану Ван Графів. Таємнича постать, якої бояться всі — навіть найсміливіші пустельники згадують її лише пошепки в темних закутках Ріно. Холодна, розважлива, Тіарет — не звичайна гангстерка. На відміну від інших родин, у неї немає кодексу, моралі чи вірності. Вона живе лише заради прибутку. І якщо когось доведеться заради цього прибрати — вона не моргне й оком.\n\nСтоячи переможно над могилами тисяч, які її недооцінили, вона готується показати НКР, на що здатні ті, кого вважали ніким."
