# TCA
TCA_ABEL_NAME: "Авель"
TCA_ABEL_DESC: "Колишній високопоставлений член Вашингтонської Братерської глави, Авель покинув криваву організацію на знак протесту, створивши нову спільноту з іншими втікачами й однодумцями-найманцями в руїнах Форту Вілламетт. Зібравши крихкий союз Вигнанців Братерства та «Вартових Білого» — напіввійськової організації, що колись захищала Портленд — Причина зуміла закріпитися в Орегоні.\n\nВтім, згодом Вартові пішли далі на схід, висловивши невдоволення методами Причини. Тим часом, Вашингтонське Братерство не залишило бунт Авеля без уваги. За кілька місяців після втечі його діяльність було викрито. І тепер, з Безсмертним на хвості, Авель має поставити все на карту, щоб врятувати все, що йому дороге."
TCA_ELDER_ABEL_NAME: "Старійшина Авель"
TCA_ELDER_ABEL_DESC: "Незважаючи на всі труднощі, Авелю вдалося привести свою зграю вцілілих назад до Капітолійського пагорба після вигнання під час кривавих чисток Безсмертного. Він утримував мир між Вартовими й Вигнанцями Братерства, поки у них був спільний ворог, але після перемоги над Безсмертним тримати союз стало дедалі важче. Лише через кілька місяців після звільнення Капітолія рештки Братерства обрали його новим старійшиною новоствореного Північно-Західного Відділення. Втративши підтримку Вартових, Авель прийняв посаду, пообіцявши вести Братерство шляхом традицій та покори — тиран на зразок Безсмертного більше ніколи не має піднятися."
