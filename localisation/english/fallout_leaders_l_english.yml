# CLJ
CLJ_BOMBAY_JACK_NAME: "Бомбей Джек"
CLJ_BOMBAY_JACK_DESC: "§R\"Потримай це для мене, я лише сірник знайду.\"§!\n\nПісля піднесення Битих Псів у Денвері багато банд мародерів і шукачів були змушені тікати, аби не стати собачим кормом. Бомбей Джек і його банда не стали винятком. Як і Биті Пси колись, Джек вирішив просто відібрати найкраще, що мали ті, хто був перед ним. Цього разу жертвами стали Портер і його Збирачі.\n\nВикинувши Збирачів з їхніх нових теренів, Джек і компанія отримали прізвисько «Присвоювачі». Вони з гордістю його носять, жадібно поглядаючи на своїх сусідів. Сам Джек має певну харизму, але тримає владу завдяки жорсткому контролю та тому, що є одним із небагатьох у банді, хто вміє планувати наперед. А ще він має звичку випробовувати вибухівку на незгодних."
CLJ_HINCHIE_FORSYTH_NAME: "Хінчі Форсайт"
CLJ_JOSHUA_HOWARD_NAME: "Джошуа Говард"
CLJ_NATHANIEL_TAYLOR_NAME: "Натаніель Тейлор"
# CLK
CLK_OVERWATCH_TOCK_NAME: "Наглядач Ток"
CLK_OVERWATCH_TOCK_DESC: "§O\"Говори менше. Ти не вартий мого часу.\"§!\n\nДо 2275 року Ток став найвпливовішою особою у Сховищі 24. Починав він як скромний вчений, але зробив прорив — вибухову речовину з промислового мийного засобу. Її почали масово використовувати для розширення сховища. Це викликало приріст населення і початок §Hзолотого віку§!. На виборах він здобув перемогу з §G95%§! голосів, а згодом узурпував Раду та посадив її членів. Отримавши повну владу як начальник §Oчасу§!, Ток прагне вивести Сховище у зовнішній світ. \n\nКолись прогрес стримував страх. Тепер, коли стримування більше немає — ніщо не зупинить §Yмайбутнє Сховища 24§!."
CLK_TIMEKEEPER_DOUGLAS_NAME: "Хранитель часу Даґлас"
CLK_TIMEKEEPER_RUSSELL_NAME: "Хранитель часу Рассел"
CLK_TIMEKEEPER_OSWALD_NAME: "Хранитель часу Освальд"
CLK_THE_DOCTOR_NAME: "Доктор"
CLK_clara_oswold_name: "Клара Освальд"
# CMC
CMC_LUSHANYA_HARJO_NAME: "Лушанья Харджо"
CMC_LUSHANYA_HARJO_DESC: "Лушанья — спадкоємиця одного з найбільших гральних домів у коаліції. Її виховали як належить спадкоємиці: навчили всього, що забезпечило довговічність родинного бізнесу. Її кар’єра співачки в лаунж-клубах була короткою, але вдалою. Та після загибелі батьків від рук рейдерів, їй довелося рано перебрати владу в бізнесі та фактичне лідерство коаліції."
CMC_MINCO_WARRIOR_NAME: "Воїн Мінко"
CMC_STANDHOPE_WHITEPATH_NAME: "Стандгоп Вайтпас"
CMC_KOWAYHOOMMAH_WILDCAT_NAME: "Ковайхумма Вайлдкет"
CMC_PRESIDENT_OKLAHOMA_LUSHANYA_HARJO_NAME: "Президент Харджо"
CMC_PRESIDENT_OKLAHOMA_LUSHANYA_HARJO_DESC: "Лушанью Харджо обрали президентом Оклахоми ті, хто стояв з нею проти агресії Останнього Патруля. Вона прагне покарати, послабити й зрештою розпустити Патруль, а тоді — повернути владу народу Федерації."
