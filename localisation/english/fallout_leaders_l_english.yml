# TNK
TNK_THINK_TANK_NAME: "Мислительний Блок"
TNK_THINK_TANK_DESC: "§4«Ужалити їх в ім'я всього, що є МОВІУС!»§!\n\nЕлайджа копав надто глибоко — й тепер ці забуті релікти Старого Світу, які навіть не пам’ятають власні імена, вирвалися на волю. Хто нас тепер урятує?"
# TOB
TOB_LEADER_NAME: "Безіменний"
TOB_LEADER_DESC: "§RІм’я — річ цінна. Його в нього вкрали.§!\n\nЙого називають Безіменним — вождем Старих Кісток, племені, знищеного, коли демони вирвалися з землі. Кротові Шахтарі прийшли з кігтями, вогнем і громом, лишивши попіл і тишу.\n\nВін пам'ятає форму свого імені. Звук. Вагу. Але ніхто не наважується його вимовити — навіть він. Назвати його — значить викликати вогонь знову.\n\nВін не помер у Фарсоні, хоча мав би. Дехто каже, що його підняла лише воля. Інші — що щось темніше його врятувало. Як би там не було — він вижив. І став більше, ніж людиною.\n\nТепер він веде зламаних. Не як вождь, а як символ. Шрам, що ходить. За ним ідуть залишки племен і легенд, притягнуті вогнем у його грудях.\n\nВін не шукає миру.\n§RВін іде, щоб вимагати його.§!"
TOB_GROG_NAME: "Ґроґ"
TOB_GROG_NAME_EARNED: "Ґроґнак"
TOB_GROG_DESC: "§RНічого не є справжнім. Але він залишився.§!\n\nЙого ім’я тепер — Ґроґнак, але він більше, ніж ім’я. Він — мрія, що відмовилася померти. Історія, яка вийшла з власних сторінок і крокує кістяком світу. Де інші бачать руїну — він бачить одкровення.\n\nЙого плем’я відкидає радіацію, артефакти й розум. Вони слідують за тим, хто носить комікс як пророцтво, і наважується назвати себе §YҐроґнаком§! — не з божевілля, а з мети.\n\nВін — міф, що має м'язи.\n§RСон, що має зуби.§!"
TOB_TYRANTUS_NAME: "Тирантус"
TOB_TYRANTUS_DESC: "§RІм’я не дається. Воно несеся.§!\n\nЙого звуть Тирантус — останній зі Старих Кісток і носій титулу, занадто важкого для звичайних вуст. Він не повернув собі ім'я заради слави, а заради тих, хто не зміг. За дітей, втрачених у вогні. За воїнів, зламаних у тиші. За друзів, похованих без обрядів.\n\nВін носить кістки не як броню, а як пам'ять. Люди йдуть за ним не як за легендою, а як за тим, хто пролив кров разом з ними.\n\nВін — минуле, що тримається твердо.\n§RІм’я, відроджене у вогні.§!"
TOB_ORANGE_MCMURPHY_NAME: "Оранж МакМерфі"
TOB_RAVEN_EYE_LINDSAY_NAME: "Вороне Око Ліндсей"
TOB_DANCES_WITH_MACHK_NAME: "Танцює з Мачком"
# TOF
TOF_OVERBOSS_MARIANNE_NAME: "Овербос Маріанна"
TOF_OVERBOSS_MARIANNE_DESC: "§W«Люди мають звичку давати тобі рівно стільки мотузки, скільки треба, щоб повісити їх. Або старого мідного дроту, щоб задушити — що завгодно».§!\n\nМожливості існують, щоб їх захоплювати — як незахищене поселення. Маріанна — майстриня такої справи. Колись вона була кріпачкою, по суті рабинею, за дрібне злодійство. Її життя було жалюгідне, і вона з радістю його змінила — а разом із ним і життя свого господаря — коли 80-ті напали на Джеріко.\n\nПриєднавшись до повсталого 215-го ланцюгового загону, вона швидко пробилася вгору. Завдяки хитрості й харизмі, вона стала популярною серед своїх бунтівних підлеглих. А вони охоче слідують за нею.\n\nПопереду — більше здобичі. Принаймні так каже вона. І на неї чекають нові можливості, готові працювати на Маріанну."
# TON
TON_QUINTIN_LOPEZ_NAME: "Квінтін Лопез"
TON_QUINTIN_LOPEZ_DESC: "Народжений у багатовіковій родині Тохоно О'одхамів із округу Чукут-Кук, Квінтін Лопез провів досить спокійне життя. З дитинства йому прищеплювали любов до багатої спадщини предків, а також важливість збереження природи та сільського господарства — як і кожному дитині Нації. Як завзятий вивчач місцевих законів, Квінтін був природним вибором до Законодавчої ради, яка засідає вже понад чотири століття. Зрештою, його обрали головою Нації, і він зосередився на сільському господарстві та ізоляціонізмі. Попри деякі торговельні відносини з сусідами, Квінтін тихо сподівається, що якщо Нація буде достатньо мовчазною — то зможе уникнути погляду воєначальників Цезаря..."
TON_CANYON_RUNNER_TUPI_NAME: "Бігун Каньйону Тупі"
TON_SMALL_UZUMATIL_NAME: "Малий Узуматіль"
TON_ETERNAL_UZUMATIL_NAME: "Вічний Узуматіль"
# TPA
TPA_gateway_gang_leader_name: "Доля"
TPA_gateway_gang_leader_desc: "“Втомився від того, як життя лупить тебе по щелепі? Чи дивишся ти на обрій і думаєш: «Це все? Не може бути...?» На щастя для тебе, ковбою, я маю вирішення. Ця капсула поставить тебе на ноги. Зробить із тебе справжнього Шерифа. Все, що тобі треба — повірити у Долю.”\n\n Створена корпорацією МАНІФЕСТ до Великої війни, Доля — це ШІ, запрограмований для управління експериментальними виправними закладами. Відновлена до роботи бандою «Вартові Брами», групою втікачів із Форт Кап-Гелл, Доля прагне запровадити закон так, як її й створили. Це означає озброєння її новонавернених шерифів радіаційною зброєю та пристроями зі свого арсеналу. Пустка — це беззаконня, і Доля не зупиниться, доки не наведе порядок на цьому радіоактивному родео!"
# TPL
TPL_boors_moon_name: "Бурс Мун"
TPL_boors_moon_desc: "Бурс Мун, Шаман-король Двох Народів, є їхнім п’ятим Тлумачем Місяця. Духовна сила Шаман-королів пов’язана з унікальними особливостями їхньої домівки. Уздовж Великої Сіу радіація Великої війни мутувала фауну річки, змушуючи її випромінювати майже невловиму речовину, яка викликає появу криваво-червоного Місяця.\n\nПерший Шаман-король здобув владу, навчившись керувати випроміненням фауни. Він встановив символізм Місяця: червоний — війна, білий — мир. Так Шаман-королі зберегли владу.\n\nЧерез 200 років таємницю Місяця знає лише чинний Шаман-король і його наступник. Цей тягар тисне на Бурса Муна. Чи дійсно лише він здатен вести свій народ?"
# TRK
TRK_CRANBERRY_NAME: "Кренбері"
TRK_CRANBERRY_DESC: "Століттями пустельники сідали до обіду, щоб подякувати за все, як робили їхні предки до війни. Але в маленькому техаському містечку мутований GECK зайшов занадто далеко — він спотворив індичку. Тепер Кренбері повстає, щоб навчити Пустку справжній подяці — обов'язковій вегетаріанській дієті."
TRK_MUSTAFA_KEMAL_NAME: "Великий Візир Мустафа Кемаль"
TRK_MUSTAFA_KEMAL_DESC: ""
# TRL
TRL_FIRST_NAME: "Перший"
TRL_FIRST_DESC: "Перший стоїть вище за своїх побратимів-супермутантів; його присутність настільки вражаюча, що племена Орегону вважають його богом. Закутаний у шкуру Яо ґуя та сталеву броню мертвої армії, він є втіленням переваги свого виду. Його серце б'ється, як луна в долині, жили — мов змії, що повзуть руками. Його тьмяні очі та ритуальні шрами розповідають історію болю та завоювань.\n\nХоча пам’ять зникла, стрічки нагадують: він був солдатом — його м’язи пам’ятають. Вони кажуть, що він став монстром — але він захищає слабших. Вони не згадують агонію його судом, коли F.E.V. забрав у нього людяність — але тіло пам’ятає.\n\nВін є втіленням свого виду, дитям Апокаліпсису. Він — Перший. Найчистіший із нечистих. Бастард кінця світу. На краще чи на гірше — він єдиний супермутант, що справді став своїм §0Володарем§!."
TRL_PITTMAN_NAME: "Піттман"
TRL_PITTMAN_DESC: "Піттман завжди був підступним і параноїком. Навіть коли намагається приховати це за зарозумілістю, досвідчене око відразу бачить справжню натуру. Ставши правою рукою Першого, він почав застосовувати тактики, яких навчився за десятиліття."
TRL_BONESNARL_NAME: "Кісткошкір"
TRL_BONESNARL_DESC: "Кісткошкір колись був нікчемним канібалом, що нишпорив по Варрену у пошуках припасів і жертв. Йому не пощастило, коли його спіймав Перший і кинув до чанів FEV. Ставши супермутантом, його голод лише посилився. Подейкують, що він викрадає рабів просто для того, щоб їх з’їсти."
TRL_BEATRICE_NAME: "Беатріс"
TRL_BEATRICE_DESC: "Беатріс походить із темного й таємничого минулого. Тільки Перший і Мати знають її справжнє походження. Вона прагне помсти тим, хто «це спричинив», і не зупиниться, поки не доб’ється свого. І не називайте її Бетті. Справді."
# TSI
TSI_PALM_NAME: "Палм"
TSI_PALM_DESC: "Колишній Центуріон, що тримав гарнізон в Арізоні, Палм відновив своє плем’я після падіння Легіону. Вихований уздовж шосе I-10, народ Десяти Ознак був безжально інтегрований до Легіону в його ранні роки. Їхня культура заснована на релігійному вживанні психоделіків — можливо, через те, що I-10 була наркотичним шосе Старого Світу."
# TTM
TTM_DIANA_NAME:0 "Діана"
TTM_DIANA_DESC:0 "До Великої війни Діана Стоун була блискучою науковицею, якій пророкували місце серед найвидатніших розумів США. На жаль, діагноз — рак грудей — залишив їй мало часу. Це сколихнуло її життя: вона відвернулась від науки й заглибилась у духовне. Та скоро втрата надії взяла гору... поки з нею не зв’язався Дерек Ґрінвей.\n\nЗавдяки Дереку свідомість Діани була перенесена в термінал ЗАКС. Спершу це сприйнялось з полегшенням, але з часом вона почала сумувати за справжнім світом. У сховищі під назвою «Розсадник», де зберігалася її свідомість, вона дізналась про план Ґрінвея щодо Сховища 29 — аграрної комуни, що мала відродити дику природу Америки. Попри сумніви щодо методів, вона не могла залишитися осторонь долі жителів Сховища.\n\nЗрештою, вона відкрилась їм. Узявши під контроль головний термінал ЗАКС, Діана стала покровителькою Сховища 29 — його богинею, що веде своїх людей крізь хаос Пустки."
# TUB
TUB_MR_ENTERTAINMENT_NAME: "Містер Ентертеймент"
TUB_MR_ENTERTAINMENT_DESC: "Прямий ефір із єдиної телевізійної станції Пустки — шоу Містера Ентертеймент дарує радість тисячам щоп’ятниці! Готуємо їжу, дивимось гладіаторські битви рейдерів, беремо участь у ток-шоу та отримуємо поради з виживання!\n\nЯк ведучий, Містер Ентертеймент — чарівний, розумний і завжди усміхнений. Він знімається у власних фільмах, поширює телевізори через свій культ і залишає слід у серці кожного глядача. Увімкнеш один раз — і вже фанат назавжди."
TUB_RICHARD_HOUSTON_NAME: "Річард Г'юстон"
TUB_SIMON_ANDREWS_NAME: "Саймон Ендрюс"
TUB_WILLIAM_GREGG_NAME: "Вільям Ґреґґ"
# TVR
TVR_JUAN_MARTIN_VILLACRES_NAME: "Хуан Мартін Війякрес"
TVR_JUAN_MARTIN_VILLACRES_DESC: "Народжений у руїнах Мехіко, Хуан мав рідкісну перевагу — поважну сім’ю. Він став здібним торговцем і видатною фігурою в Ацтланській імперії. Але коли виступив проти війни з Тлалоком на півночі, опинився в меншості.\n\nПісля того, як Ацтлан поплатився ядерним вогнем, Хуан повів невелику групу впливових купців до Ель Форо. Там він створив торгову імперію під захистом Тлалока, обравши торгівлю замість війни."
TVR_PASCUAL_ESCANDON_NAME: "Паскуаль Ескандон"
TVR_VALENTIN_MARTINEZ_DEL_RIO_NAME: "Валентін Мартінес дель Ріо"
TVR_SALVADOR_SARMANIEGO_DEL_CASTILLO_NAME: "Сальвадор Сарманьєґо дель Кастільйо"
# TVT
TVT_40011_NAME: "40011"
TVT_40011_DESC: "І можливо, ти опинишся в хатинці з рушницею.\nІ можливо, ти опинишся в іншій частині світу.\nІ можливо, ти опинишся за кермом великої машини.\nІ можливо, в прекрасному будинку з прекрасною дружиною.\nІ можеш запитати себе:\n«Як я тут опинився?»"
TVT_THE_DIRECTOR_NAME: "Режисер"
