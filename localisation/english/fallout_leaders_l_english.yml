# MOJ
MOJ_ELIJAH_NAME: "Елайджа"
MOJ_ELIJAH_DESC: "§8«Чого ти хочеш? Чому я маю витрачати час на ідіота?»§!\n\nУ затьмарену епоху лише старійшина Елайджа мав нахабство прагнути більшого. Обдарований технологічним генієм, він був призначений старійшиною, попри те, що був книжником, а не паладином. Його мета — не лише зберегти технології, а й перевершити їх.\n\nЩоб позбутись його, Елайджу разом із вигнанцями направили до Мохаве. Там, серед попелу, він відкрив ГЕЛІОС Один — станцію, здатну викликати сонячні списа. Більш ніж розумний, менш ніж стабільний, цей фанатик-месія мріє про світанок, який або освітить шлях... або спалить усе дотла."
