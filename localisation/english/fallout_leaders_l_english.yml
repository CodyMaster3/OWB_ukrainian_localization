# SNO
SNO_ARYTOM_NAME: "Артем"
SNO_ARYTOM_DESC: "Артем бачив багато чого. Дуже багато. Достатньо старий, щоб пам’ятати радянське відродження 2037 року, він служив військовим аташе в американських окупаційних силах у Канаді, коли впали бомби. Відтоді він об’єднав розрізнені народи навколо себе в Сномадів — відкинутих суспільством. Де хтось бачить сміття й рейдерів, він бачить єдиних, хто дивиться за межі Великої Війни. Можливо, саме старому дурню вдасться знайти новий шлях уперед."
# SOR
SOR_WAKING_CLOUD_NAME: "Пробуджена Хмара"
SOR_WAKING_CLOUD_DESC: "«О Отче, веди та захищай нас, своїх покірних дітей, у нашій праці на винограднику, і наділи нас силою, щоб опиратися тим, хто хоче забрати Зайон у нас»\n\nВіра Пробудженої Хмари в «Отця» лише зміцнилась після навернення місіонером із Нью-Ханаану. Вона, як і більшість племінних, вірить, що Він — це дух-охоронець, покликаний захистити Сорроу від бід і провести крізь Пустку після «Кінця, Що Прийшов у Вогні».\n\nВона користується повагою серед Сорроу, є повитухою, воїном і однією з небагатьох, хто носить престижну Рукавицю Яо-ґуая — символ того, що вона пройшла небезпечний квест заради племені."
SOR_WANDERING_WINDS_NAME: "Блукаючі Вітри"
SOR_WANDERING_WINDS_DESC: "Блукаючі Вітри були однією з перших, хто прийняв вчення мормонів. Відправлена до Нью-Ханаану як зв’язкова, вона повернулась із словом Божим і посланням миру, а також новими знаннями для свого народу. Хоча вона ще недосвідчена лідерка, має підтримку свого племені та благословення Господа."
SOR_SNARLING_WEMATIN_NAME: "Ричащий Вематін"
SOR_TALL_TUPI_NAME: "Високий Тупі"
SOR_HEAD_HUNTER_TUPI_NAME: "Мисливець за головами Тупі"
