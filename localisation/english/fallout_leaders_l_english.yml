# TAR
TAR_BRON_OF_90_NAME: "Брон із 90"
TAR_BRON_OF_90_DESC: "Філософ-король Ходаків Тару, Брон переміг усіх супротивників на Військовій Дорозі, здобувши свій окровавлений вінець 89-го. Людина небагатьох слів, але великих дій, його спокійна манера приховує невгамовну жагу до насильства — жагу, яку він без вагань нав'яже кожному, хто насмілиться кинути виклик його владі."
