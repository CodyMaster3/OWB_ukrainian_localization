# WHD
WHD_OLD_DOG_NAME: "Старий Пес"
WHD_OLD_DOG_DESC: "Так званий \"король\" В'ялених Псів, Старий Пес — гуль, що майже повністю здичавів. Переживши Велику Війну, він, як і багато гулів, був вигнаний із Міста Псів Битими Псами і рушив на північ. Його непередбачуваність робить владу небезпечною, але для багатьох гулів вона краща за дискримінацію."
WHD_ZHANG_WEI_NAME: "Полковник Чжан Вей"
WHD_ZHANG_WEI_DESC: "Колишній капітан китайського підводного човна \"Шанхай\", Чжан Вей довго розмірковував над причинами загибелі світу. Тепер він прагне досягти справжнього комунізму, незалежно від того, де опинився. Він готовий повести гулів Гаундлендса до утопічного майбутнього, хоч би скільки це не тривало."
WHD_ELKANAH_STEVENSON_NAME: "Елкана Стівенсон"
WHD_ADAM_JOHNSON_NAME: "Адам Джонсон"
# WHT
WHT_BALM_UPON_WOUNDS_NAME: "Зайон, Полум’я-На-Ранах"
WHT_BALM_UPON_WOUNDS_DESC: "Зайон, Полум’я-На-Ранах не благає за минуле. Він не плаче. Він не називає скоєне «гріхом». Старий світ згорів, і в його вогні він був загартований.\n\nЦе його світ, і він просто прийняв роль, що випала йому заради народу. Його народ прагнув Зайону, тож він дав їм Зайон.\n\nВогонь — його зброя. Вогонь — його сила. Те саме полум’я, що знищило старий світ, спопелило лукавих нефійців, очистило ламанійців — тепер ходить поруч із ним. Воно не просить, не переконує. Воно бере. Рве. Пожирає. Він не несе слова Господнього на пергаменті, асе в пекучому сяйві, у попелі та руїні.\n\nПустка — це горнило, і кожен дізнається про міць Білногих — або буде розвіяний вітром."
WHT_SALT_UPON_WOUNDS_NAME: "Сіль-На-Ранах"
WHT_SALT_UPON_WOUNDS_DESC: "§R«Baika-ker! Yoocan no nikumpa me!»§!\n\nВоєнний вождь Білоногих. Найжорстокіший м'ясник серед усіх. Племена, які він знищив, не злічити. Воїни, що загинули від його рук — без рахунку. Війна — все, що він знає. Усе, чим володіє він і його народ, здобуто силою, грабунком і збиранням решток. Кажуть, немає людині смертоноснішої в ближньому бою, а його силова рукавиця розтрощила сотні черепів.\n\nТа попри те, що вороги кажуть, ніби війна — це все, що він знає, Сіль-На-Ранах — не дурень. Чоловік, батько та духовний наставник свого народу, він бачить, як навколо замикаються стіни, і присягнувся знайти їм шлях до порятунку. Навіть якщо для цього доведеться пробити ці стіни кулаком — як Єрихонські."
