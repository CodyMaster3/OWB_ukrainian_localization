# RBD
RBD_JACK_VICKERS_NAME: "Джек Вікерс"
RBD_JACK_VICKERS_DESC: "Коли Десять Знаків були проковтнуті Легіоном, сотні втекли на південні ранчо. Джек Вікерс був одним із таких утікачів і швидко був змушений працювати, аби утримувати злиденну родину. Пройшовши шлях тяжкої праці та випадкових зустрічей, він став ад'ютантом впливового барона. У цій ролі Вікерс прагнув об'єднати власників ранчо Бауделіо, щоби створити бастіон проти Легіону.\n\nТепер, як людина, що об'єднала родини та баронів у своїй візії, цей §Oвакеро§! стоїть мужньо перед Цезарем."
RBD_IGNACIO_ECHEVERRIA_NAME: "Ігнасіо Ечеверрія"
