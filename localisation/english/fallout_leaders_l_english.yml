# EAG
EAG_EAGLE_ROCK_COUNCIL_NAME: "Рада Іґл-Рок"
EAG_EAGLE_ROCK_COUNCIL_PEOPLE_DESC: "Іґл-Рок — це вузол торгівлі та військових авантюр, звідки можна дістатися до найвіддаленіших куточків Пустки. Ті, кому випала честь правити, утворюють Раду — вони керують країною як компанією. Зрештою, правління державою — це просто бізнес. Попри те, що офіційно вони мають представляти інтереси всього Іґл-Року, завжди лишається питання: чи не більше вони збагачують самих себе?"
