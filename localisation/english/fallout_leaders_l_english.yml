# SUN
SUN_GOLDHOUND_NAME: "Золотий Гончак"
SUN_GOLDHOUND_DESC: "§4\"Я не боюся Легіону.\"§!\n\nУ молодості саме Золотий Гончак зруйнував плани Центуріона Паулла вторгнутися в Колорадо. Саме він об’єднав своє плем’я з Чорним Сонцем після їх знищення тим же центуріоном. Саме він навчив своє плем’я користуватись колісницями. Він подбає, щоб нова загроза з півдня зустріла ту ж долю — або помре, намагаючись.\n\nА от культи — це вже інше випробування."
SUN_SAMUEL_APPLETON_NAME: "Самуель Епплтон"
SUN_LUPA_CAPITOLINA_NAME: "Лупа Капітоліна"
SUN_LUPA_CAPITOLINA_DESC: "§0\"Можете вважати мене божевільною чи чудовиськом за те, на що я готова. Але я не дозволю жодній жінці чи дитині пройти через те пекло, в якому була я під чоботом Бика.\"§!\n\nЛупа виросла, як усі жінки в Легіоні — рабинею. Пауллус осліпив її за дрібну подряпину на його псові й змусив доглядати за ним попри ненависть. Але з часом вона прив’язалася до тварини. Коли голос у голові сказав не відпускати пса — вона послухала. Вона чула лише крики легіонерів, коли втекла з послідовниками на північ.\n\nНавіть зараз, коли Пауллус далеко в Мексиці, вона боїться. Боїться, що він повернеться — по пса й по неї. М’ясник із Нью-Мексико переслідує її у снах, але саме це зробило її твердою. Вона краще вб’є кожну жінку й дитину, ніж дозволить легіонеру торкнутися їх."
SUN_JAMES_LYON_NAME: "Джеймс Лайон"
