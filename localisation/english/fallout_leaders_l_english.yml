# NAT
NAT_MORTON_NAME: "Ланс Мортон"
NAT_MORTON_DESC: "§4«Єдиний добрий Анклав — мертвий Анклав».§!\n\nВетеран битви за Наварро, Мортон втратив ногу під час штурму — завдяки плазмі Анклаву. Потім зайняв адміністративну посаду. Його досвід зробив його ідеальним кандидатом для керівництва регіоном."
NAT_kurisu_NAME: "Курісу"
NAT_kurisu_DESC: "§4«Та скільки разів повторювати — я не з Умбри. Я з Клеоні... хоча ви все одно не повірите».§!\n\nЧутки про належність Курісу до племені Умбра — лише чутки. Як і чутки про змови з Портовими Майстрами та компанією Граніт. Чутки. Нічого більше..."
# NAV
NAV_HASHKEH_NAME: "Вождь Гашке Наабаа"
NAV_HASHKEH_DESC: "Ім’я Гашке Наабаа, що означає 'Лютого Воїна', він здобув, коли влаштував засідку на рейдерів, які загрожували На-Дене. Несподівано для багатьох, він є прихильником миру з Легіоном. Справжній герой Народу, брав участь у завоюванні Арізони та походах Легіону на схід. Його загін 'Шкіряні Ходи' безжально знищував ворожих лідерів і постачальні лінії, дехто шепоче — навіть сам Ланій його остерігається. Але Гашке — не пішак. Якщо Легіон гратиме чесно, він буде другом. Якщо ж ні — його лазерна гвинтівка швидко знайде нову ціль."
