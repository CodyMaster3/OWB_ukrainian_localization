# UIN
UIN_STRIKES_TRUE_NAME: "Той-що-Б'є-Точно"
UIN_STRIKES_TRUE_DESC: "«Повелитель Вітру» племені Юінта — це не титул для довгожителів. Лідери повинні бути попереду, літати вище та далі за всіх у старих металевих птахах і поєднувати це з мудрістю. Хоча Той-що-Б’є-Точно ще не опанував мудрість, роки безрозсудного досвіду довели його здатність вести плем’я крізь небеса."
UIN_GREAT_PAWLAK_NAME: "Великий Павлак"
UIN_GREEN_MOTHER_PAWLAK_NAME: "Зелена Мати Павлак"
UIN_LAUGHING_NAGOR_NAME: "Сміючийся Нагор"
# UMB
UMB_AVUERON_NAME: "Авуерон"
UMB_AVUERON_DESC: "Авуерон, син Саліка та носій Духів Кісток, народився в Арройо і виріс в Умбрі. Його батько, вірний духам племені, водночас навчав сина й про зовнішній світ — особливо про Обраного, з яким він подорожував багато років. Упродовж десятиліть після пригод Обраного плем’я Умбра поступово відкривалось світові, активно торгуючи з Арройо та Братством Сталі. Коли у 2262 році Салік помер, Авуерон вирішив не брати собі “Дідуся Кістку” — символічно відкинувши прив’язаність племені до минулого. Нині він веде Умбру з добротою та співчуттям, прагнучи передати людям ті самі уроки, що отримав від батька."
UMB_RAJIV_MOLESON_NAME: "Раджив Молесон"
UMB_RUSHING_MORLIS_NAME: "Швидкий Морліс"
UMB_SNAKE_EYED_KLIN_NAME: "Зміїноокий Клін"
EMB_GRAMPA_FIGLEEF_NAME: "Дідусь Фіґліф"
EMB_GRAMPA_FIGLEEF_DESC: "§4\"Ці молоді не знають, яких помилок вони припускаються. Предки бороніть нас, ми повинні їх зупинити, доки не пізно.\"§!\n\nДідусь Фіґліф уособлює собою старійшину в час, коли технологічно просунуте суспільство починає впливати на традиційне життя. Він — також уособлення будь-якого консервативного діяча, що противиться змінам заради незрозумілих догм. Саме це поєднання зробило його лідером руху за повернення Умбри до минулого. І він не зупиниться, навіть на схилі віку.\n\n§YАвтор: KalaNemi!§!"
# UOA
UOA_KEATS_NAME: "Кітс"
UOA_KEATS_DESC: "§G\"Кожен мутант — це людина, а кожна людина — трохи мутант!\"§!\n\nКітс прожив довге життя, пройшовши шлях від простого супермутанта під командуванням Аттіса до захисника народу. Навіть він визнає, що не впізнав би себе колишнього, що служив Творцю століття тому. І задля всіх — від друга Скарлет до Шейла і Бульдозера — він прагне побудувати маяк цивілізації в Техасі."
UOA_LIEUTENANT_CRUSHER_NAME: "Лейтенант Крушитель"
UOA_LIEUTENTANT_CRUSHER_DESC: "§G\"Кожен мутант — людина? Образа для мутантів!\"§!\n\nШейл доручив Крушителю повернути Остін до складу Армії. Демократія дала йому шанс зробити це мирно, але після провалу він повернувся до перевіреної тактики — з благословення Шейла (але не Аттіса)."
