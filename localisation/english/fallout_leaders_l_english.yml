ARM_PASCUAL_RINCON_GALLARDO_NAME:0 "Паскуаль Рінкон Ґаярдо"
ARM_PASCUAL_RINCON_GALLARDO_DESC:0 ""
# ARR
ARR_CHOSEN_NAME:0 "Обранець"
ARR_CHOSEN_DESC:0 "Легенда свого народу, Обранець здобув G.E.C.K., переміг Анклав і об’єднав кровні лінії. Його дії забезпечили процвітання Арройо, який під його керівництвом став потужною мирною нацією."
ARR_CHITSA_NAME:0 "Чітса"
