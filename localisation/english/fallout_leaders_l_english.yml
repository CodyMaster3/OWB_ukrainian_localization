# STR
STR_SHAPPA_NAME: "Шаппа Ваґнер"
STR_SHAPPA_DESC: "Одна з наймолодших жінок у Раді, Шаппа має мрію. Колись народи Лакота й Дакота правили Північчю, набігаючи на Вайомінґ і забираючи своє. І тепер настав час знову піднятись. Бо ж великий вождь Божевільний Кінь прорік, що Лакота воскресне й стане благословенням для хворого світу — світу з поламаними обітницями, світу, що знову прагне світла."
# SUF
SUF_RYLEIGH_MORRISON_NAME: "Райлі Моррісон"
SUF_RYLEIGH_MORRISON_DESC: "У Федерації Саммерс найвищий генерал — зазвичай той, хто вбив найбільше рейдерської мразоти — вважається «лідером» та головою федерації. Після гарячої суперечки, в якій Ентоні Дьюітту відірвали коліна, Райлі Моррісон опинилась із найвищим рахунком, і її підвищили до бригадного генерала.\n\nВідома своєю майстерністю у вибуховій справі, Райлі готова перетворити Флаґстафф на вирву, якщо це означатиме свободу для людей Пустки від рабовласницьких виродків."
