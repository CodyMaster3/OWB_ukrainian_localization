# SHA
SHA_SHALE_NAME: "Шейл"
SHA_SHALE_DESC: "§G\"За Аттіса.\"§!\n\nНе всі мутанти в Техасі забули про Аттіса. Шейл — яскравий приклад цього. Він прагне наслідувати свого кумира, попри те, що далеко не найкращий для цієї ролі. Його вже вигнали з територій як Остіна, так і Кузні Велетнів. Але він має волю, план і надію на відродження мрій Аттіса — та чи буде цього досить?"
SHA_SECRET_NAME: "Цербер"
SHA_SECRET_DESC: "З глибин Корпоративного Сховища постає Цербер — істота чистих емоцій, що прагне поглинути всю Пустку в себе. Викривлена суміш плоті та науки, Цербер складається з безлічі умів і думок. Серед них душі Аттіса, Шейла і навіть високорозвиненого ЗАКС-інтелекту під іменем CALIX.\n§RВкрай важливо, щоб Цербера зупинили будь-якою ціною!§!"
SHA_GOND_SCOURGE_NAME: "Ґонд Скурдж"
SHA_GOND_SCOURGE_DESC: ""
SHA_NEIL_SANDMAN_NAME: "Ніл Сендмен"
SHA_NEIL_SANDMAN_DESC: ""
SHA_ERKAL_RIPPER_NAME: "Еркал Ріппер"
