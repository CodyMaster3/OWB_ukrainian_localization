# MUR
MUR_PRESBYTER_ANN_NAME: "Пресвітерка Енн"
MUR_PRESBYTER_ANN_TWICE_BAPTISED_NAME: "Енн Двічі-Хрещена"
MUR_PRESBYTER_ANN_DESC: "Пресвітерка Енн тримає смолоскип спасіння високо для всіх — хоч той і обпікає її руки. Колись проста дияконеса, вона стала реформаторкою, відкривши праці Святого Варнави. Відтоді служила на передовій революції, зреклася дому, родини, втратила дружину під час Великого Вигнання. Глибоко в серці знає — провідництво не було Божим покликанням для неї. Та вона не випустить смолоскипа, хай що б це їй не коштувало."
