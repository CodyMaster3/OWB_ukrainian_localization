# TDN
TDN_LIL_JESUS_MORDINO_NAME: "Ліл' Джізус Мордіно"
TDN_LIL_JESUS_MORDINO_DESC: "Ліл' Джізус, син Біґ Джізуса Мордіно та глава кримінального клану Мордіно, з ностальгією згадує дні в Нью-Ріно. Завдяки дитячому вундеркінду Майрону, Мордіно колись монополізували торгівлю «Джетом», новим надзвичайно залежним хімікатом, і здобули значний вплив серед наркозалежних. План Мордіно по підкоренню Ріно провалився після появи протиотрути від залежності до Джету, і їхня імперія почала занепадати.\n\nПісля вбивства батька руками Бішопів у 2253-му, Ліл' Джізус очолив родинний бізнес, зібрав залишки нарко-імперії Мордіно і втік до Дена — борючогося за виживання міста азарту. Там Мордіно поступово закріпилися на ринку наркотиків, хоча під керівництвом Ліла вони все ще лише тінь свого минулого. Він не має розуму батька, але іноді груба сила — це теж метод."
