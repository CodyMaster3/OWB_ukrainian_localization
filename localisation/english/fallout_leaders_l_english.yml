# PEC
PEC_SHEILA_BOWEN_NAME: "Шейла Бовен"
PEC_SHEILA_BOWEN_DESC: "Колоністка з Пекосу до мозку кісток, Шейла Бовен щиро любить свій народ. Вона знає ціну культурі й економіці, що тримається на брамінах — сама розбагатіла на м’ясі та молоці. Але також вона розуміє: колонія не виживе без змін. Вона чула історії з перших уст — про Цезареві Легіони, які нищили все на своєму шляху. І якщо їй не вдасться переконати свій народ взятися за зброю — наступною може бути вона."
PEC_JOAQUIN_ZAPATA_NAME: "Хоакін Сапата"
