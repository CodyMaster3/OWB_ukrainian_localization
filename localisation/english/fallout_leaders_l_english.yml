# PAR
PAR_DYED_BLOOD_NAME:0 "Розмальований-Кров’ю"
PAR_DYED_BLOOD_DESC:0 "Народжений в день, коли його мати померла при пологах — «в Червоному», як кажуть у племені Розмальованої Скелі — він з дитинства був приречений стати великим воїном. Наймолодший, хто пройшов Випробування Скелі за покоління, Розмальований-Кров’ю виправдав свою долю. Його бояться на рівнинах, де він полює — він та його люди є найкращими бійцями в окрузі."
