VEG_MR_HOUSE_NAME: "Містер Хаус"
VEG_MR_HOUSE_DESC: "До війни Роберт Хаус був магнатом, який зробив статки на робототехніці й обчислювальній техніці. Його геній і багатство дозволили врятувати більшу частину Вегаса від ядерного вогню. Зараз він, невидимий тиран, керує Вегас-Стріпом і мріє про майбутнє."
