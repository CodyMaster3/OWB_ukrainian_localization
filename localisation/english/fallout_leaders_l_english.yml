# MOS
MOS_ULYSSES_NAME: "Улісс"
MOS_ULYSSES_DESC: "Досвідчений воїн і розвідник, Улісс — хитрий, винахідливий та небезпечно розумний. Після знищення його племені — Звивисте Волосся — Легіоном, він став одержимий символами й історією. Він розуміє, як вчинки створюють легенди, а люди стають уособленням ідей.\n\nУлісс блукає через бурі Розлому, доставляючи пакунки й надію. Він бачить у цьому місці шанс — шанс створити новий світ."
