# CHC
FIRST_CHORISTER_DESC:0 "Народжена у світі експериментів і спотвореної науки, §RПерша Хористка§! — дочка боржниці, ошуканої й обколотої матері та невідомого батька. Вона була не першою, хто з'явився в лабораторії: вона була одинадцятою. Кожну до неї піддавали впливу різних штамів FEV з метою викликати психічні здібності. Вона — перша, хто вижив під час цих експериментів, які проводили вчені глибоко під виправною колонією Вотонґа. Як з'ясувалося, вона була першою з багатьох: після неї ще понад два десятки Хористів прикували до жахливих машин у залі, який вони знали як Церква. До війни вчені не дозволяли Хористам співати разом, але після того, як ті втекли від ядерного апокаліпсису, Хор заспівав в унісон."
# CHE
CHE_ACRI_NAME: "Акрі"
CHE_ACRI_DESC: "Коли впали бомби, разом із суспільством старого світу зникли й його системи. Саме тоді останній вагон, що прибув на станцію Чемалт, залишився там назавжди. Віддаленість станції, хоч і лякала, врятувала її мешканців від згубної радіації. Позбавлені вибору, вони перетворили дику природу на свою силу, об'єднавшись із парамілітарною групою, яка шукала їжу та припаси.\n\nМинуло багато століть, але Акрі досі веде свій рід від того самого моменту. Знання солдатів і найманців йому передали ще змалку. Нащадки пасажирів Чемалта знають, що таке укус пустки — і Акрі готовий дати відповідь кожному, хто наважиться стати на їхню землю."
CHE_MILITIA_COMMANDER_VAS_NAME: "Командир ополчення Вас"
CHE_ALWYN_THE_SLY_NAME: "Олвін Хитрий"
CHE_THIEVING_THE_CLOWN_NAME: "Клоун-Злодюга"
CHE_LUCKY_RANDY_NAME: "Щасливчик Ренді"
