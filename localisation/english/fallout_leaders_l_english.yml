# EAS
EAS_JIM_LAHEY_NAME: "Джим Лейгі"
EAS_JIM_LAHEY_DESC: "§C«Плесни мені ще, пора святкувати черговий чудовий, чорт забирай, день у Істпорті».§!\n\nОстанніми роками Істпорт перетворився на жвавий торговельний вузол — експортує бухло й сировину, а ще слугує перевалочним пунктом для торговців зі сходу та заходу. Це дозволило багатьом місцевим насолодитися часами достатку, і мер Джим Лейгі — не виняток. Колишній шериф, Джим використав зв'язки (і, можливо, кілька хабарів), щоб зайняти мерське крісло. Тепер він хоче лише відпочивати й рахувати прибутки до кінця своїх днів.\n\nТа вдалині вже чути рев моторів... і хто знає, скільки йому лишилось."
EAS_EDWARD_JONES_NAME: "Едвард Джонс"
EAS_AMBROSE_HOOD_NAME: "Амброуз Худ"
EAS_FRANK_PENDER_NAME: "Френк Пендер"
# EHT
EHT_THUNDERBIRD_NAME: "Громовий Птах"
EHT_THUNDERBIRD_DESC: "Дитиною він бачив, як його батько, великий вождь Супер Бі, наказав народу тікати на північний захід I-80, а сам зі своєю дружиною вирушив на південь, аби стримати наступ солдатів НКР на Сакраменто.\n\nМолодим Мастером Ключа, він відновив розбиту машину на околицях Нью-Ріно й узяв її ім’я собі — Громовий Птах.\n\nЯк Воїн Шляху, він повів сотню людей глибоко на землі Юти, аби відвоювати святу I-80 у племен, що її захопили, й стягнути кроваву данину з упертих поселенців.\n\nНині, як Великий Вождь, він обіцяє: його історія завершиться там, де й почалася. А його народ знову матиме дім — будь-якою ціною."
EHT_FLAGMAN_NAME: "Прапороносець"
EHT_FLAGMAN_DESC: "Колись Прапороносець був грізним воїном, що мчав на схід через Неваду. Його машина переїжджала рейнджерів, а за нею волочили охоронців Міста-Сховища, аж поки ті не вмирали. Тепер він сидить на покришках і піднімає прапор на раді племені. Поки Громовий Птах мріє про захід, Прапороносець знає: Юта — достигла здобич. Навіщо ризикувати, коли в Табернаклі стільки вільних паркомісць?"
EHT_DANIEL_ROSS_NAME: "Деніел Росс"
EHT_EDWARD_SMITH_NAME: "Едвард Сміт"
