MARIANNE_DESC:0 "§W\"Люди завжди дають тобі рівно стільки мотузки, щоб повісити їх. Або старого мідного дроту, щоб задушити — що зручніше.\"§!\n\nМожливості — це те, що слід хапати, як незахищене поселення. Маріанна — експерт у цьому. Колись вона була кріпачкою (або рабинею, по суті) — за дрібну крадіжку. Життя було нестерпним, але коли 80-ті вдерлись до Єрихону — вона скористалась шансом, убивши свого хазяїна.\n\nПриєднавшись до 215-го Ланцюгового Гангу, вона швидко пробилася до вершини ієрархії. Розумна й маніпулятивна, Маріанна стала популярною серед грубих, але вірних послідовників. Вони охоче йдуть за нею, лиш інколи сперечаючись.\n\nЇй до душі їхній вибуховий стиль, і взаємність щира. Маріанна вірить: на 215-ий чекає велике майбутнє. І якщо вірити їй, то наступна можливість вже на підході — лиш варто встигнути схопити її."
BOS_jonathan_maxson_desc:0 "Джонатан Мексон — людина, що несе тягар славетного родоводу та шрами пережитих жахів, опинився в керма Мексонських Старійшин у Лост-Гіллс. Після раптової смерті Верховного Старійшини Джеремі Мексона, Джонатан неохоче взяв на себе відповідальність, незважаючи на сумніви в його фізичному та психічному стані через нещодавній майже смертельний інцидент.\n\nПотомок славетного Роджера Мексона — засновника Братства Сталі — Джонатан втілює спадщину своєї родини. До нещодавнього підвищення був паладином високого рангу, хоробро воював на кордонах Нової Каліфорнійської Республіки. Та геройські зусилля дорого йому коштували — залишивши шрами як на тілі, так і на душі. Писарі навіть припускають, що він може не вижити, якщо не лікуватиметься належним чином.\n\nЙого виживання, попри високу ціну, викликало занепокоєння серед Старійшин. Дехто сумнівається, чи зможе він нести тягар лідерства. Дружина Джонатана, Джессіка, вже планує відправити їхнього єдиного сина Артура на схід — під захист Зоряного Паладина Лайонса у D.C. Та саме його шлях жертовності та боротьби формує бачення майбутнього Братства. Мексони — це втілення витривалості й обов'язку, спонукані вшанувати спадщину свого предка й захистити ідеали, що їх поділяє Братство. Дехто називає їх елітарними догматиками, що йдуть за Кодексом до останнього. Для Джонатана це лише невелика ціна, щоб вшанувати того, чиє ім’я він носить.\n\nХоч Джонатан і несе шрами та спадок, він вирізняється серед Ромбійців, Культистів та Реформістів своєю майже релігійною відданістю принципам Братства й захисту людей під ім’ям Мексона. Незважаючи на сумніви, він налаштований прокласти власний шлях і залишити незгладимий слід у майбутньому Лост-Гіллс."
TIM_bear_bunyan_name:0 "Беар Бан'ян"
TIM_bear_bunyan_desc:0 "§7\"Стільки людей там потребують допомоги... шкода, що в мене лише дві руки, аби її дати.\"§!\n\nЖиття в глушині нелегке — це факт. Люди, що можуть тебе прикрити, поділитися ношею та підтримати — єдине, на що ти можеш покластися. Беар Бан'ян — саме така людина, на яку покладається Лісовий Рубіж. Сильний, але також добрий і чесний. Він знає ліс, як свою сокиру, і пам'ятає кожного, кого зустрів. Без таких людей, як він, Лісовий Рубіж загинув би. Тож громада не забуває його: пригощає вечерею, наливає келих, потискає руку — а тоді знову до праці, як завжди."
ELEANOR_YORKTON_DESC:0 "Родина Йорктонів — Меч і Троянда, Батько та Донька. Кажуть, яблуко недалеко від яблуні падає — і сім’я Йорктонів тому підтвердження. В полі бою важко не помітити подібність між ними. Військовий хист у них у крові. Та якщо батько дивиться в минуле й бореться за Королівство, яким воно було, то Елеанора дивиться в майбутнє й бореться за те, яким воно має бути."
ROS_ecologist_name:0 "Перший Еколог Сі-Бастіон"
first_ecologist_desc:0 "Сі-Бастіон нещодавно очолив племена та народи Єллоустоуна після загибелі попередника від рук фанатиків із заходу. У кожної дитини, що зростає тут, у серці живе казка про парківських рейнджерів — охоронців гір та долин до війни. Та для Сі-Бастіона ці історії стали життєвим шляхом. Попри жорстокість світу, він мріє відродити стару традицію: захищати землю й людей — і допомагати обом. Його слова та справи вже почали проростати обнадійливими паростками."

 ## UNUSED
 # BAT
  #batter_leader_name:0 "Jackie Mitchell"
 # DES
  #DES_SNAKE_VARGAS_NAME:0 "'Snake' Vargas"
  #DES_SNAKE_VARGAS_DESC:0 "Once an erratic young Ranger, old age and the burdens of command have hardened Snake Vargas. After losing much of his team, Vargas must balance his desire to protect the citizens of the Wasteland from raiders and his need to protect his own rangers from harm.\n\nVargas is a veteran who earned his rank and fame in the Cochise Incident, alongside Deth, Hell Razor and Sagarra; he has been in every role this organization has to offer, and he knows how best to use the iron fist of the Rangers."
  #DES_HELL_RAZOR_NAME:0 "Hell Razor"
  #DES_HELL_RAZOR_DESC:0 "Hell Razor hasn't changed much since ascending to the position of Ranger General; his tactics are still recklessly aggressive, and tend to garner the same results; massive casualties on both sides."
  #DES_THRASHER_SAGARRA_NAME:0 "'Thrasher' Sagarra"
  #DES_THRASHER_SAGARRA_DESC:0 "Sagarra's extended reading and study of old tactics was not for naught; it has given him a sharp and analytical tactical mind, allowing him to plan out battlelines quickly and execute them with deadly efficiency."
  #DES_BEN_CRENSHAW_NAME:0 "Ben Crenshaw"
  #DES_BEN_CRENSHAW_DESC:0 ""
 # EDN
  #EDN_SCARLET_DESC:0 "§4"Look at this place. Do you WANT all of Texas trying to kill you, including the ground?"§!\n\n A little over a decade ago, Scarlet saved Texas from an outcast of the Cypher Warband named Reese. Eden has been the result of those times; until a better solution is found, she guards the results of the mutated G.E.C.K., never knowing when the duty of her and her followers ends."
 # SHI
  #SHI_Leader_DESC:0 "Dr. Sheng is the nominated head of the "San Francisco Council", a governing body composed of members of the Dragon's School, Crane's School, Shi Scientific Department and the Emperor's Steel Palace. (Members of the Church of Hubology are permitted limited council seating as well.)\n\nWhile the mysterious, rarely seen Emperor is the de jure, rightfully suzerain celestial royalty of San Francisco the Emperor does not partake in matters of internal or external meddling, merely matters of the spirit and the higher Celestial Court. It is, instead, up to the elected council head to manage internal and external day to day affairs.\n\nDr. Sheng has more than earned her elected position. A pioneer in botany research, Sheng was the lead project head behind the creation of the “Botanical Sentience Serum” (BSS), a growth serum that led to San Francisco being one of the least radiated cities in all of the American west coast.\nSheng also has a knack for diplomacy - being a key figure in negotiating the San Francisco - Shady Sands cultural exchange program. Under Sheng's leadership the city of San Francisco has a truly bright future."
 # STR
  #STR_LEADER_DESC: "Jacoby became the leader of the Roswell Space Watchers Club after winning a raffle and telling a good joke. With his natural wit he would leverage this position and use it to become a local celebrity in Roswell - many people in the city looking up to him for support and guidance."

