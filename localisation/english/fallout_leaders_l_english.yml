# TCL
TCL_SAM_HOUSTON_V_NAME: "Сем Г’юстон V"
TCL_SAM_HOUSTON_V_DESC: "Полковник Г’юстон — нащадок славної династії патріотів Техасу. Втомившись від постійних поразок Анклаву у спробах відродити Америку, він усвідомив головну проблему — §RПустка недостатньо техаська.§!\n\nОчоливши загін дисидентів Анклаву, він прагне очистити Пустку від будь-яких нетехаських урядів — за будь-яку ціну. Пристебніться!"
