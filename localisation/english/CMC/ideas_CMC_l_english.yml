l_english:
cmc_bright_lights:0 "Яскраві вогні"
 cmc_bright_lights_desc:0 "Обіцянка великої кількості клієнтів і прибутків приваблює в цей район багато різних підприємств."
 cmc_gambling_act:0 "Закон Коаліції про азартні ігри"
 cmc_gambling_act_desc:0 "Закон Коаліції про азартні ігри описує свою мету як «запобігання перетворенню азартних ігор на джерело злочинності та заворушень або їх використанню для підтримки злочинності» і гарантує, що ігри проводяться чесно і відкрито. У самому документі багато, дуже багато сторінок, але головна ідея полягає в тому, щоб змусити казино залишатися на боці закону."
 cmc_heir_to_two_empires:0 "Спадкоємець двох імперій"

 cmc_criminal_underground_start:0 "Кримінальне підпілля"
 cmc_criminal_underground_start_desc:0 "Де є азартні ігри, там завжди знайдуться люди, які намагаються отримати незаконний прибуток як від гравців, так і від власників казино."
 cmc_criminal_underground_lower:0 "Кримінальне підпілля під загрозою"
 cmc_criminal_underground_lower_desc:0 "Створення поліції спричинило тиск на різні злочинні банди, тріади та синдикати. Більшість із них пішли в тінь, очікуючи на щось."
 cmc_criminal_underground_purged:0 "Зачищене кримінальне підпілля"
 cmc_criminal_underground_purged_desc:0 "Після подій «Ночі, яку не забути» різноманітні рейди та облави майже знищили організовану злочинність. Хоча злочинність ніколи не зникне повністю, з тим, що залишилося, наша поліція легко впорається."
 cmc_criminal_underground_higher:0 "Укорінене кримінальне підпілля"
 cmc_criminal_underground_higher_desc:0 "Зі зростанням работоргівлі до історичного максимуму та торговцями хімією, що окупували безліч вуличних кутів у багатьох містах, це лише питання часу, коли кримінальні боси вирішать вимагати більше влади."
 cmc_criminal_underground_organized:0 "Організоване кримінальне підпілля"
 cmc_criminal_underground_organized_desc:0 "Після короткої боротьби за владу між різними злочинними групами та бандами було досягнуто перемир'я, яке розділило націю та різні бізнеси між ними і поставило країну під їхній жорсткий контроль."
 cmc_scrapper_resistance:0 "Утилізація Скраперів"
 cmc_scrapper_resistance_desc:0 "Можна багато чого отримати зі звалища, яке вони називали своїм домом. Здається, деякі з них досі вважають його своїм домом, завдаючи нам чимало клопоту."
 cmc_scrapper_mercenaries:0 "Найманці-Скрапери"
 cmc_scrapper_mercenaries_desc:0 "Наймання решти Скраперів у цьому районі як найманців дало нам цінні загартовані в боях війська та зупинило їхні напади на наших збирачів."
 cmc_scrapper_workforce:0 "Робоча сила Скраперів"
 cmc_scrapper_workforce_desc:0 "Скрапери — майстри своєї справи. Вони мали 200 років, щоб вдосконалити мистецтво збиральництва. Тепер, коли вони працюють на нас, вони можуть використовувати це мистецтво нам на користь."

