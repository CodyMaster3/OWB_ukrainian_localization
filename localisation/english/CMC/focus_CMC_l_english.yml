l_english:
#-------------------------------------
 # CMC
 #-------------------------------------
 cmc_light_up_the_night:0 "Освітити ніч"
 cmc_light_up_the_night_desc:0 "Казино, якими ми керуємо, споживають багато енергії через усі ці вогні та автомати. Настільки багато, що у нас часто трапляються перебої з електропостачанням як у самих казино, так і в інших районах міста. Нам потрібно встановити ще пару генераторів, щоб запобігти цьому."
 cmc_casino1:0 "Казино «Червона Ріка»"
 cmc_casino1_desc:0 "Традиційне казино з усіма автоматами та столами, які ви очікуєте побачити. До війни воно славилося тим, що було найбільшим казино в Співдружності Рівнин.\nІнвестиції в нього дозволять повернути до повноцінного використання занедбане крило, збільшивши площу казино майже на 50%."
 cmc_casino2:0 "Курорт і казино клану Стінгвінг"
 cmc_casino2_desc:0 "Хоча тут є всі звичні азартні ігри, «Стінгвінг» більше зосереджується на відпочинку та розвагах. Щовечора тут виступають гурти, фокусники та інші артисти, заохочуючи місцевих жителів і туристів витрачати гроші на їжу та напої.\nІнвестиції в «Стінгвінг» дозволять нам відкрити прилеглий готель, що означатиме довше перебування гостей і більше витрат у барі. Плюс додатковий дохід від оренди та обслуговування номерів."
 cmc_casino3:0 "Казино «Ібофанга»"
 cmc_casino3_desc:0 "Казино «Ібофанга» полюбляє влаштовувати гарні шоу. Все, що вони роблять, тематично пов'язане з традиційними міфами та культурою нашого народу. Люди одягаються в традиційне вбрання, а гості можуть брати участь у «церемоніях», щоб задобрити духів... і принести удачу в грі. Духи просто обожнюють невеликі грошові пожертви.\nІнвестиції в «Ібофангу» дозволять нам встановити вражаюче світлове шоу із зображенням «духів» і дозволити їм (через приховані динаміки) оголошувати про нові вистави та «щасливу годину» в барі."
 cmc_along_the_route:0 "Придорожні атракціони"
 cmc_along_the_route_desc:0 "Казино — не єдине, що змусить людей подорожувати сюди. Уздовж маршруту є багато менших місць, які приваблять туристів і затримають їх у цьому районі."
 roadside_attraction_tt:0 "§gКожен відкритий вами придорожній атракціон дещо збільшує виплати казино та зменшує ймовірність поганих подій.§!"
 cmc_the_pops:0 "Газ-Вода"
 cmc_the_pops_desc:0 "Музей газованих напоїв. Так багато різних брендів газировки. Просто... так багато. Ми навіть не знали, що існує щось інше, крім Болз та Ядер-Коли.\nОкрім того, що він виглядатиме дуже гарно, коли його знову підсвітять, це справжня скарбниця кришок від пляшок."
 cmc_ritas_cafe:0 "Кафе «У Ріти»"
 cmc_ritas_cafe_desc:0 "Вочевидь, набагато поширеніша на західному узбережжі до війни, мережа ресторанів «Кафе "У Ріти"» мала виразний «футуристичний» вигляд. Що ж, майбутнє виявилося дещо іншим, ніж уявляли люди. У будь-якому разі, наскільки ми можемо судити, це єдиний заклад такого роду в цьому регіоні, і його відродження принесло б велику користь місцевості."
 cmc_largest_peanut:0 "Найбільший у світі арахіс?"
 cmc_largest_peanut_desc:0 "Ми знайшли туристичну брошуру, в якій згадувалося, що «Найбільший у світі арахіс» мав бути в цьому районі. Звучить захоплююче! Тож ми відправили команду на його пошуки. Виявилося, що насправді ця штука... трохи розчаровує. Але, гей, принаймні вона досить мала, щоб її могли нести двоє людей, а атракціон є атракціон."
 cmc_40_miles_of_bad_road:0 "40 миль поганої дороги"
 cmc_40_miles_of_bad_road_desc:0 "Багато доріг у нашій країні в досить поганому стані, але все ще переважно придатні для використання, навіть для моторизованої техніки. Ми могли б спробувати зробити мотоцикли та автомобілі доступнішими для широкого загалу. Ми багато чули про священну традицію «дилера вживаних авто». Можливо, час її відродити."
 cmc_cab_driver_once_more_down_the_street:0 "Таксисте, ще раз по вулиці"
 cmc_cab_driver_once_more_down_the_street_desc:0 "Ось думка: громадський транспорт. Таксі та автобуси. Наші відвідувачі мусять якось добиратися зі своїх готелів до казино. І ніхто насправді не любить приїжджати втомленим через те, що довелося йти пішки на велику відстань."

 cmc_going_to_the_river:0 "Шлях до річки"
 cmc_going_to_the_river_desc:0 "Хоча більшу частину нашого доходу приносять азартні ігри, це ненадійний довгостроковий план для зростання. Інший варіант, який ми маємо, — розширення нашого впливу вздовж Червоної річки, щоб ми могли використовувати її для риболовлі та торгівлі. Для цього нам потрібно розібратися з потенційно ворожими групами, що оселилися вздовж неї. І, можливо, ми зможемо вирішити деякі старі образи одним махом."
 cmc_going_to_the_river_tt:0 "§gФокуси, що йдуть за цією метою війни, заблоковані вибором: дозволити злочинцям захопити владу чи ні. Тому майте це на увазі, перш ніж робити націю маріонеткою.§!"
 cmc_an_old_grudge:0 "Стара образа"
 cmc_an_old_grudge_desc:0 "Майже 100 років тому Компакт Скраперів забрав у нас частину землі, коли ми боролися з наслідками серії торнадо, що пронеслися нашою країною. Відтоді вони люто захищали її. Ми хочемо повернути цю землю. Але нам не потрібно бути невиправдано жорстокими. Ми можемо дати їм вибір."
 cmc_americas_biggest_scrapyard:0 "Найбільше звалище Америки"
 cmc_americas_biggest_scrapyard_desc:0 "Відтіснивши Раду Скраперів до центру лабіринту мотлоху, який колись був «Найбільшим звалищем Америки», ми дали їм вибір: приєднатися до нас або бути вигнаними. Вони обрали розумний варіант, хоча й не без бурчання та бажання влаштувати кулачний бій. Але це, здається, їхня звична поведінка. Це означає, що ми повернули нашу землю і отримали неохочого «союзника». У довгостроковій перспективі це піде на користь нам обом."
 cmc_so_much_scrap:0 "Так багато брухту"
 cmc_so_much_scrap_desc:0 "Розбивши воїнів Компакту і розсіявши їх за вітром, ми тепер маємо доступ до найбільшої купи металобрухту в цьому районі. Це вимагатиме значних зусиль для збору та переробки. І нам доведеться мати справу з випадковими залишками осередків опору Скраперів, що вискакують із-під землі, іноді буквально."
 cmc_last_lodge:0 "Таємне рукостискання"
 cmc_last_lodge_desc:0 "[TLL.GetName] вже давно займає південний бік Червоної річки. Поки що вони не виявляли жодних ознак агресії і, здається, задоволені захистом поселень під своїм контролем. Наскільки свідчать наші записи, між нашими націями ніколи не було відкритого конфлікту. Можливо, нам варто перетворити це неофіційне перемир'я на офіційне. Це також відкриє обидві країни для активнішої торгівлі."
 cmc_cypher:0 "Зупинити хрестовий похід"
 cmc_cypher_desc:0 "Масони виявилися нешкідливими, а Компакт ніколи не був великою загрозою. Натомість військовий загін Сайфера є загрозою для всіх, кого вони вважають такими, що підпали під «зло технологій». Ми не впевнені, кого саме вони мають на увазі, але краще вдарити першими, поки вони не зарахували нас до цієї групи."
 cmc_red_river_economic_zone:0 "Економічна зона Червоної річки"
 cmc_red_river_economic_zone_tt:0 "Знижує §Yвартість націоналізації§! регіонів уздовж §YЧервоної річки§! на §G30%§!."
 cmc_red_river_economic_zone_desc:0 "Землі Червоної річки — це не просто кордон, це новий шанс на процвітання."
 cmc_the_lawson_experience:0 "Досвід Лоусона"
 cmc_the_lawson_experience_desc:0 "Довелося докласти певних зусиль, але нам нарешті вдалося переконати раду вождів кланів Скраперів виїхати зі старого нафтового танкера. Тепер ми можемо повернути його до первісного використання. Ну, вторинного використання.\nПриєднуйтесь до нас і відчуйте іржавий шарм та індустріальну естетику «Досвіду Лоусона», найновішого казино Коаліції. А Компакт теж отримає певну компенсацію від угоди."
 cmc_long_term_operations:0 "Довгострокові операції"
 cmc_long_term_operations_desc:0 "Ми тут, щоб залишитися, а бійці опору Скраперів — ні. Ми не можемо дозволити їм постійно турбувати наших збирачів і транспорт. Нам потрібно знайти спосіб розібратися з ними."

 cmc_the_choir_awakens:0 "Хор прокидається"
 cmc_the_choir_awakens_desc:0 "Пісня лунає із заходу. Багато наших громадян говорили про дивні сни або яскраві галюцинації. [CMC.GetLeader] сама повідомила про один такий сон. Сни показують щось жахливе, але дивно привабливе, що пробуджується. Ми повинні підготуватися."
 cmc_patrols_end:0 "Останні з Останнього Патруля"
 cmc_patrols_end_desc:0 "Наші побоювання справдилися. [TLP.GetName] були... поглинуті тим, що ми тепер знаємо як [CHC.GetName]. Деяким біженцям вдалося втекти, але їх тривожно мало. Вони розповідають про друзів і сім'ї, які раптово підняли зброю один на одного або просто почали співати чи безумно бурмотіти."
 cmc_scrapper_hive:0 "Вулик Скраперів"
 cmc_scrapper_hive_desc:0 "[SCA.GetName] завжди були вуликом відлюдників і збирачів, що ховалися в лабіринті залишків старого світу. Тепер вони є частиною справжнього вулика, контрольованого істотами, яких ми навіть не можемо почати розуміти. Прямо біля наших кордонів. Нам потрібно більше людей на цьому кордоні. Якнайшвидше."
 cmc_the_choir_sings:0 "Хор співає"
 cmc_the_choir_sings_desc:0 "Пісня в наших снах стає гучнішою, нестерпно гучною. Якщо ми хочемо запобігти тому, що сталося з іншими націями, ми повинні вдарити, поки не стало занадто пізно. Для нас усіх."
 cmc_nothing_left_standing:0 "Не лишити каменя на камені"
 cmc_nothing_left_standing_desc:0 "Ми відбили Хор. Тепер ми стоїмо на місці, звідки лунала пісня. Єдине рішення, яке ми змогли придумати, — це кинути в цю прокляту богом діру в землі стільки вибухівки, скільки зможемо зібрати. А якщо пісня не припиниться, кинути ще. Ніякого більше співу. Ніякого більше Хору. Тільки вибухи, а потім тиша."
 cmc_nothing_left_standing_tt:0 "§PМи майже звикли до цієї пісні. Дивно без неї.§!"

 cmc_family_business:0 "Сімейний бізнес"
 cmc_family_business_desc:0 "Мене звати Лушанья Харджо. Моя сім'я була однією з провідних груп нашого народу ще до того, що наші пращури називали «Дим і Вогонь». Ми першими вийшли з бункерів і першими знову відкрили одне з великих казино в цьому районі. Це наша спадщина. І я буду розбудовувати цю спадщину."
 cmc_pitboss:0 "Піт-бос"
 cmc_pitboss_desc:0 "Дядько Ліам був піт-босом казино «Червона Ріка» ще до мого народження. Він був радником моїх батьків і є ним для мене зараз. Якщо щось відбувається — чи то в казино, чи то в районі загалом — він дізнається про це першим."
 cmc_black_sheep:0 "Паршива вівця"
 cmc_black_sheep_desc:0 "Аспен... вона завжди була не такою, як усі. Їй не подобалася робота в залі одного з казино. Вона також не хотіла мати нічого спільного з логістикою та управлінням. А після смерті наших батьків вона зв'язалася з певними людьми, яких... скажімо так, я б зазвичай навіть не пустила на поріг наших казино. Але вона все ще моя сім'я. І один із моїх обов'язків — дбати про процвітання нашої родини."
 cmc_unrest_in_the_house:0 "Заворушення в Будинках Світла"
 cmc_unrest_in_the_house_desc:0 "Деякі члени нашої родини незадоволені тим, як зараз керують країною. Хоча бізнес іде вгору, вони все одно ставлять під сумнів кожне моє рішення. Вони виступають за дозвіл на важкі наркотики в казино та легалізацію рабства. Здається, формується розкол між тими, хто підтримує мене, і тими, хто слідує цим радикальним ідеям."
 cmc_the_criminal_element:0 "Кримінальний елемент"
 cmc_the_criminal_element_desc:0 "На жаль, у нашій країні завжди існувало певне організоване кримінальне підпілля. Враховуючи тодішню ситуацію, воно виникло напрочуд швидко після того, як ми заселили цю територію. Але зараз воно, схоже, на підйомі. Найімовірніше, його підживлюють ті члени моєї родини, які схильні бачити їхню діяльність у більш сприятливому світлі."
 cmc_respectable_business:0 "Поважний бізнес"
 cmc_respectable_business_desc:0 "Ми ніколи не розробляли належного закону, який би визначав, що казино можуть собі дозволити, а що ні. Якщо я хочу, щоб це місце стало пунктом призначення для людей з усієї Пустки, я не можу дозволити, щоб воно отримало погану репутацію."
 cmc_armed_bouncers:0 "Озброєні вишибали"
 cmc_armed_bouncers_desc:0 "Одна з речей, яку я повинна зробити, щоб зберегти позитивний імідж району, — це спорядити наших вишибал так, щоб вони могли впоратися з будь-якою ситуацією і не допускати небажаних осіб у наші казино. До війни вишибалам здебільшого доводилося мати справу з п'яницями, що починали бійку. У наш час бійка може включати застосування важкого озброєння."
 cmc_patrol_the_Streets:0 "Патрулювання вулиць"
 cmc_patrol_the_Streets_desc:0 "Якщо я достатньо збільшу кількість наших вишибал, я зможу змусити їх не лише охороняти казино, а й патрулювати прилеглу територію. Це зробить її безпечнішою для всіх і фактично дозволить більшій кількості людей безпечно дістатися сюди. А дехто з них, можливо, навіть вирішить залишитися тут назавжди."
 cmc_independent_police_force:0 "Незалежні поліцейські сили"
 cmc_independent_police_force_desc:0 "Я зрозуміла, що наші вишибали вже діють як поліцейські сили в нашій країні. Переконати достатню кількість людей зробити це офіційним статусом не повинно бути надто складно. Створення незалежних сил, не пов'язаних безпосередньо з жодним казино чи іншою групою, дозволить нам ефективно боротися зі злочинністю та корупцією. Це дасть чіткий сигнал моїм недоброзичливцям про те, що, на мою думку, має статися з дилерами та работорговцями."
 cmc_independent_police_force_tt:0 "Шеф поліції §YХадсон Калдрон§! стає доступним для найму."
 cmc_law_prevails:0 "§GЗакон перемагає.§!"
 cmc_criminals_pulling_strings:0 "§RЗлочинці смикають за ниточки.§!"
 cmc_taking_a_cut:0 "Отримуючи частку"
 cmc_taking_a_cut_desc:0 "Певні елементи в країні, які полюбляють залишатися в тіні, пхають свого носа у справи багатьох казино. Постачають власникам речі, заборонені в нашій країні, або шантажують їх тим, про що вони не хотіли б розголосу. Я знаю про це, але протидіяти цьому важко."
 cmc_sponsor_chem_pushers:0 "Спонсорування торговців хімією"
 cmc_sponsor_chem_pushers_desc:0 "Останнім часом велика хвиля хімії потрапила до нашої країни. Дилери більше не обмежуються темними провулками. Натомість ви можете придбати різноманітну хімію в барах казино або, якщо вам подобається більша конфіденційність, замовити доставку прямо в номер готелю."
 allow_chem_abilities_tt:0 "Це дозволить командирам ваших підрозділів використовувати здібності, пов'язані з препаратами, під час бою."
 cmc_good_business:0 "Кожен бізнес — хороший бізнес"
 cmc_good_business_desc:0 "Гільдія работорговців облаштувалася в нашій країні. Вони представляють себе як легальний бізнес, але все одно торгують людьми. Я була проти того, щоб вони відкривали тут свою справу, але мене переконали. Поки що люди, яких вони продають, походять з-за меж нашої країни. Але в майбутньому це може змінитися."
 cmc_protection_price:0 "Захист має свою ціну"
 cmc_protection_price_desc:0 "Небажані елементи в нашій країні діють дедалі відкритіше. Вони обіцяють, що «захистять» казино, готелі та інший бізнес від усіляких нещасних випадків, що можуть статися. Лише за невелику регулярну плату. Люди, які не платили, як правило, страждали від таких речей, як додаткові кульові отвори в будівлях і персоналі або спонтанні незрозумілі вибухи."
 cmc_a_night_to_remember:0 "Ніч, яку не забути"
 cmc_a_night_to_remember_desc:0 "Наші люди ще довго пам'ятатимуть цю ніч. Я — так точно."

 cmc_proving_her_name:0 "Підтверджуючи своє ім'я"
 cmc_proving_her_name_desc:0 "Я була тією, хто встромив ніж їй у горло. Це було не перше моє вбивство тієї ночі і не останнє. Було пролито багато крові, значна частина якої належала членам моєї родини, незалежно від того, на чиєму боці вони опинилися врешті-решт. Я буду нести шрами та уроки тієї ночі з собою до кінця життя."
 cmc_rooting_out_corruption:0 "Викорінення корупції"
 cmc_rooting_out_corruption_desc:0 "Навіть якщо більшість великих гравців, які напали на нас тієї ночі, загинули під час атаки або в різних сутичках, що відбулися в наступні дні, дехто втік і заліг на дно. Але я знайду їх. Я ніколи більше не допущу, щоб усе зайшло так далеко. Цьому настав кінець."
 cmc_preemptive_measures:0 "Превентивні заходи"
 cmc_preemptive_measures_desc:0 "Нам потрібна краща інформаційна мережа, якщо ми хочемо запобігти повторенню чогось подібного. Ліам завжди вмів винюхувати інформацію. Можливо, настав час дати йому більше фінансування та людей, щоб ця здібність справді засяяла."
 cmc_preemptive_measures_liam_tt:0 "Шеф нагляду §YЛіам§! стає доступним для найму."
 cmc_preemptive_measures_flag:0 "Вжито превентивних заходів"
 cmc_bird_in_a_cage:0 "Пташка в клітці"
 cmc_bird_in_a_cage_desc:0 "Ліам мертвий. Більшість моїх прихильників теж. Ті, хто ні — перебувають у заручниках. Вони вирішили залишити мене в живих. Щоб водити як ляльку. Щоб я була публічним обличчям, яке знають люди. Жодних варіантів, жодного виходу. Я мушу робити те, що вони мені кажуть, доки не з'явиться якась нагода."
 cmc_crime_does_pay:0 "Злочин окупається"
 cmc_crime_does_pay_desc:0 "Прямо зараз у тому, що колись було моїм кабінетом, сидять 5 людей, яких я хотіла б бачити мертвими. Глави найбільших банд і злочинних синдикатів, які призвели до падіння всього, що створили моя сім'я і я. А серед них, як королева, сидить Аспен, заслуживши своє місце тим, що сприяла нападам і передавала інформацію потрібним людям. Вона планує вичавити цю країну досуха."
 cmc_new_queen_of_the_red_river:0 "Нова королева Червоної річки"
 cmc_new_queen_of_the_red_river_desc:0 "Для Аспен усе склалося якнайкраще. Вона живе на широку ногу, п'є вишукані напої та їсть дорогу їжу. Проголошує, що тепер виконує мою роботу, як і завжди заслуговувала: керує казино «Червона Ріка». Більшість фактичної роботи виконують або наймані поплічники однієї з банд, або робітники, які були там до захоплення влади і тепер змушені працювати, боячись за своє життя."
 cmc_new_queen_of_the_red_river_tt:0 "§YАспен, Королева Червоної річки§! стає доступною для найму."
 cmc_looking_for_entertainment:0 "У пошуках розваг"
 cmc_looking_for_entertainment_desc:0 "Після такої ночі кожному не завадило б трохи відволіктися. Що може бути кращим за гарний фільм? І я знаю саме те місце, де ми можемо його знайти.\nЯкщо майбутнє не світле, то принаймні воно кольорове."
 cmc_looking_for_an_escape:0 "У пошуках порятунку"
 cmc_looking_for_an_escape_desc:0 "Кажуть, що можна заробити гроші, надаючи розваги. [TUB.GetName] займаються цим бізнесом вже деякий час. Я маю відвідати їх, щоб узгодити контракт. Вони надають нові фільми та музику, ми надаємо гроші, інфраструктуру та спосіб поширити їхню медіа-імперію. Звісно, мене супроводжуватимуть мої «охоронці». Не хотілося б, щоб зі мною щось сталося, знаєте.\nПобачимо."
 cmc_looking_for_love:0 "У пошуках кохання"
 cmc_looking_for_love_desc:0 "Візит виявився зовсім іншим, ніж я очікувала. Гадаю, зовсім іншим, ніж ми обоє очікували."
 cmc_another_night_to_remember:0 "Ще одна ніч, яку не забути"
 cmc_another_night_to_remember_desc:0 "Не кожна ніч, варта того, щоб її пам'ятати, має бути такою неприємною, як та сумнозвісна. Ця була повною протилежністю."
 cmc_shared_bonds:0 "Спільні узи"
 cmc_looking_for_closure:0 "У пошуках спокою"
 cmc_looking_for_closure_desc:0 "Думаю, настав час залишити події тієї ночі в минулому. Вони не будуть забуті, але зациклення на них не допоможе ні мені, ні моїм людям. Треба думати про важливіші речі. Я повинна планувати майбутнє. Для всіх нас."
 cmc_looking_for_revenge:0 "У пошуках помсти"
 cmc_looking_for_revenge_desc:0 "Ми дійшли порозуміння. «Техніки», яких [TUB.GetLeader] відправить назад із моїм маленьким почтом, матимуть при собі дещо більше, ніж інструменти для встановлення кіноекранів та телевеж. Щойно вони займуть позиції, щоб убезпечити заручників, інші чекатимуть достатньо далеко, щоб уникнути виявлення. \nЯ поверну свою імперію."
 cmc_previous_commitments:0 "Попередні зобов'язання"
 cmc_previous_commitments_desc:0 "[TUB.GetLeader] уклав певні попередні угоди з [TBH.GetName], через що Тьюбхеди потрапили під їхній контроль. Ситуація змінюється, і я думаю, що настав час дати всім зрозуміти, що ми тримаємося разом. Це може коштувати Коаліції чимало грошей, щоб розірвати контракт із ними. Хай буде так."

 cmc_open_casino_tt:0 "Це збільшить кількість повноцінно працюючих казино на §G1§!."
 cmc_open_roadside_tt:0 "Це збільшить кількість відкритих придорожніх атракціонів на §G1§!."
 cmc_payout_tt:0 "Ваші казино та атракціони виплатили [GetCapTxt] [?payout_total|+=]k [GetCapType] за останній квартал.\n"
