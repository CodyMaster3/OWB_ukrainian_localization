l_english:

 nf_event_cmc.1.t:0 "Ніч, яку не забути" # Good
 nf_event_cmc.1.d:0 "Поліцейські сили, які вони не могли контролювати або підкупити, очевидно, стали останньою краплею. Невдовзі після офіційної інавгурації нового начальника поліції ситуація загострилася. Кілька членів кримінального підпілля штурмували багато елітних казино, намагаючись усунути або взяти в заручники провідних членів сімей казино. Усе це заради того, щоб отримати контроль над цими закладами. Але ми були готові.\n\nЯ була готова.\n\nЇх зустріли градом куль, чимало з яких — з мого власного пістолета, вбиваючи багатьох і змушуючи решту тікати назовні, де на них щось чекало.\nНа мій жах, серед мертвих я впізнала кілька облич. Людей, яких я вважала друзями. Родиною. Я не думала, що розкол, спричинений нашими різними поглядами, зайшов так глибоко.\n\nВідбивши першу хвилю атаки, я збиралася відступити до одного з офісів у казино «Червона Ріка», яке перетворили на імпровізований штаб. Аспен приєдналася до мене на півдорозі. Я не бачила її під час оборони, тому була цілком певна, що знаю, що станеться. Я не здивувалася, лише засмутилася, коли вона наставила пістолет мені в голову.\nЩо стало сюрпризом, принаймні для неї, так це ніж, що стирчав з її горла мить по тому.\nЯк керувати казино — не єдине, чого навчили мене батьки.\nНаша сім'я першою вийшла з бункерів. Ми вижили проти рейдерів та ворожих істот не завдяки чистому везінню. Це теж частина моєї спадщини. Спадщини, якої Аспен не хотіла. Уроків, які вона так і не засвоїла.\n\nЛегко зрозуміти, чому вони схилили її на свій бік. Вона мала фактично вільний доступ, куди забажає. Це безцінно, якщо певні люди хочуть отримати інформацію або доступ до певних зон.\n\nКинувши останній погляд на її тіло, я рушила далі. Ніч тільки починалася, а вони все ще чекали надворі. Ми викликали поліцію на допомогу. Це буде бойовим хрещенням і для них."
 nf_event_cmc.1.a:0 "Світанок настане"
 cmc_aspen_killed_tt:0 "§YАспен§! вбито!"
 nf_event_cmc.2.t:0 "Ніч, яку не забути" # Bad
 nf_event_cmc.2.d:0 "Дещо назрівало під поверхнею нашої нації вже певний час. Певні важливі люди мали тенденцію зникати або їх знаходили мертвими. Нещасні випадки, усі до одного, як мене запевняли. Почали зникати речі. Зброя, боєприпаси, інформація. Тепер сталося те, чого я боялася. Сьогодні вночі кілька членів кримінального підпілля штурмували багато елітних казино, намагаючись усунути або взяти в заручники провідних членів сімей казино. Усе це заради того, щоб отримати контроль над цими закладами.\n\nІ я абсолютно безсила зупинити їх.\n\nТі, хто залишився вірним мені, і я намагалися зробити все можливе, щоб захистити те, що ми збудували, але це була програшна битва від самого початку.\nКоли двері виламали, я впізнала багато облич. Людей, яких я вважала друзями. Родиною. Я не думала, що розкол, спричинений нашими різними поглядами, зайшов так глибоко.\n\nМи відступали з боєм до безпечної кімнати, яку підготували саме для такого випадку. Аспен приєдналася до мене на півдорозі. Я не бачила її під час оборони, тому була цілком певна, що знаю, що станеться. Я заплющила очі, очікуючи пострілу, що покладе всьому край. Я почула постріл, але очікуваного короткого спалаху болю перед кінцем не було. Я знову розплющила очі.\nЛіам лежав мертвим на підлозі поруч зі мною. Постріл призначався не мені. Я побачила, що нас оточили різні члени банд з усіх боків. Бій закінчено.\nАспен подивилася на мене з огидною посмішкою на обличчі.\n«Він був би просто перешкодою, тож настав час позбутися його. Ти ж, з іншого боку, нам ще потрібна. Ти будеш нашою пташкою в клітці, роблячи саме те, що ми тобі скажемо. Інакше його життя буде не єдиним, що закінчиться таким чином».\nПогроза не мені, а близьким. Вона не залишила мені вибору.\nЯ просто хочу, щоб це закінчилося."
 nf_event_cmc.2.a:0 "Довга ніч"
 cmc_liam_killed_tt:0 "§YЛіама§! вбито!"
 nf_event_cmc.3.t:0 "Ніч, яку не забути" # Dummy
 nf_event_cmc.3.d:0 "Це подія-заглушка. Ви не повинні цього бачити."
 nf_event_cmc.3.a:0 "Дійсно"

 nf_event_cmc.4.t:0 "У пошуках кохання"
 nf_event_cmc.4.d:0 "Я прибула на станцію KXII без жодних проблем. Десь на півдорозі нас зустріла група охоронців Тьюбхедів, які супроводжували нас решту шляху. Чесно кажучи, я очікувала звичайного вигляду рейдерів. Шкіра, металеві шипи, випадкові черепи чи кістки. Те, що я побачила, було військовим спорядженням поверх вишуканих костюмів. Це було, м'яко кажучи, незвично. Зустріч відбулася в одній із студій звукозапису. Я бачила це місце раніше, по телевізору. Саме тут він веде своє «Ток-шоу» з різними гостями. Я запитала, чи записує він ці переговори для свого шоу. Він просто розсміявся і відповів, що тут він почувається найкомфортніше, тому й обрав це місце. «Напружені переговори» пройшли неймовірно швидко. Ми розійшлися в деяких деталях, але дійшли згоди за пів години. Усе звелося до наших інвестиційних грошей, їхньої технічної експертизи та створеного медіа-каталогу. Решту вечора, який я думала провести, сперечаючись із польовим командиром рейдерів, що начепив цивілізовану маску, ми натомість провели за приємною розмовою на різні теми. Дещо незначне, дещо стосувалося ситуацій нас обох. Ми трохи випили, посміялися разом. Це було приємне відволікання від усього, що відбувалося останнім часом."
 nf_event_cmc.4.a:0 "Приємний вечір"

 nf_event_cmc.5.t:0 "Доля Скраперів"
 nf_event_cmc.5.d:0 "Скрапери знають кожен закуток Кородованих полів. Не минало й дня, щоб хтось із них не вискакував із якогось причепа вантажівки, який ми вважали порожнім, або щоб наших робітників не знімали снайпери з верхівок старої будівельної техніки. Лише для того, щоб зникнути миттєво, щойно ми організовуємо контратаку. Робітники відмовляються працювати в цьому районі, і ми витрачаємо занадто багато ресурсів і людей на це. Тому ми знову ввели війська в повному складі, щоб покласти цьому край.\nВдала операція дозволила нам захопити одного з їхніх вождів клану в полон. Після короткої «дискусії» з ним ми відправили його назад із пропозицією. Їхня завзятість попри такі переважаючі сили викликає захоплення, і нам би стали в пригоді такі воїни, як вони. Кожен має ціну, і працювати на нас краще, ніж бути загнаними, як скажені пси. Іншим варіантом, який ми йому дали, було найняти їх як робітників у цьому районі. Вони могли б фактично робити те, що робили до нашого приходу, але цінні шматки брухту йшли б безпосередньо нам. Подивимося, якою буде їхня відповідь."
 nf_event_cmc.5.a:0 "Життя найманців для них"
 nf_event_cmc.5.b:0 "Заробляти на життя краще, ніж помирати за старі традиції"
 CMC_scrapper_mercenaries_tt:0 "Створює 2 підрозділи §YНайманців-скраперів§! в регіоні §YКородовані поля§!"

 nf_event_cmc.6.t:0 "У пошуках помсти"
 nf_event_cmc.6.d:0 "Це була та сама ніч, тільки навпаки. Цього разу я чекала надворі, щоб виламати двері. Чекала з великою кількістю солдатів Тьюбхедів. Пролилося ще більше крові. Більше крові на моїх руках. Я можу втішати себе тим, що це було заради порятунку людей. Щоб врятувати моїх друзів і сім'ю. І те, що побудувала моя сім'я. Війська [TUB.GetLeader], безперечно, знали свою справу. Усе закінчилося на диво швидко.\nПроте Аспен ніде не було. Мій кабінет, тепер знову справді мій, був порожнім, коли я туди дісталася. Її не було і серед тіл. Вона просто зникла.\nМені потрібно відправити команду, щоб спробувати знайти її знову. Щоб або схопити її, або... тепер це не має значення. Є робота, яку треба зробити. Нам потрібно розгребти цей безлад."
 nf_event_cmc.6.a:0 "Сподівємося, це кінець"
 cmc_revenge:0 "Помста §YАспен§!."

 nf_event_cmc.7.t:0 "Дивна мандрівниця"
 nf_event_cmc.7.d:0 "Сьогодні в місті з'явилася жінка. Виснажена і втомлена, вона розповіла, що її переслідують у власній країні, що її власна сестра несправедливо звинуватила у злочинах, бажаючи позбутися її та зайняти її місце. Тепер вона просить притулку в нашій країні. Вона готова працювати на життя і показати, що зробило її настільки успішною, що люди стали достатньо заздрісними, аби вигнати її.\nЧи готові ми повірити в її історію?\n\n§RЦе, ймовірно, розлютить [CMC.GetName]!§!"
 nf_event_cmc.7.a:0 "Подивимось, що вона вміє"
 nf_event_cmc.7.b:0 "Ні, дякую!"

 nf_event_cmc.71.t:0 "Ми знайшли її"
 nf_event_cmc.71.d:0 "Аспен знайшли в землях [FROM.GetName]. Вона вже встигла піднятися кар'єрними сходами. Я не можу дозволити їй уникнути покарання. На її руках занадто багато крові. [FROM.GetName] не бажають видавати її, вона занадто міцно закріпилася в їхній ієрархії. Є варіант, який ми могли б обрати, але чи готові ми зайти так далеко?"
 nf_event_cmc.71.a:0 "Значить, війна"
 nf_event_cmc.71.b:0 "Може, не варто будити лихо"

 nf_event_cmc.8.t:0 "Пропозиція від Коаліції"
 nf_event_cmc.8.d:0 "Коаліція Чікасо-Маскогі запропонувала нам значну суму грошей, щоб фактично викупити Тьюбхедів з-під нашого контролю. Ми повинні ретельно зважити, чи варте це зусиль, які ми вже вклали в цю справу."
 nf_event_cmc.8.a:0 "Миттєва вигода, крихітко!"
 nf_event_cmc.8.b:0 "А як щодо більшої суми?"
 nf_event_cmc.8.c:0 "Дякуємо, але ми хотіли б залишити їх собі"

 nf_event_cmc.9.t:0 "[TBH.GetName] погоджується"
 nf_event_cmc.9.d:0 "Хоча це коштує велику суму грошей, відтепер наші дві нації стоять як рівні, як партнери. Мабуть, варто оголосити про це по телебаченню? Здається, це гарна ідея за таких обставин."
 nf_event_cmc.9.a:0 "Чек вже в дорозі"
 nf_event_cmc.9.b:0 "Ем, а ви приймаєте кредит?"
 nf_event_cmc.9.c:0 "Ми передумали"
 cmc_event_9_tt:0 "§RУ вас недостатньо кришок, щоб заплатити [TBH.GetName].§!"

 nf_event_cmc.10.t:0 "Техасці хочуть більше грошей"
 nf_event_cmc.10.d:0 "Очевидно, Братство шкодує, що керує економікою, заснованою на самосуді, тому що вони відчайдушно потребують кришок і хочуть більше грошей, перш ніж визнати наші права на Тьюбхедів."
 nf_event_cmc.10.a:0 "Авжеж!"
 nf_event_cmc.10.b:0 "Я що, зроблений з кришок? Так, але це занадто"
 cmc_event_10_tt:0 "§RУ вас недостатньо кришок, щоб заплатити [TBH.GetName], або ви не хочете цього робити§!"

 nf_event_cmc.11.t:0 "[TBH.GetName] сказали ні!"
 nf_event_cmc.11.d:0 "Очевидно, Братство вирішило, що може вказувати нашому чоловікові, що робити, і відхилило нашу люб'язну пропозицію. Сподіваюся, якась армія роботів забере у них Аламо, у цих бовдурів."
 nf_event_cmc.11.a:0 "Оце було б смішно."

 nf_event_cmc.12.t:0 "[CMC.GetName] відкликали свою пропозицію"
 nf_event_cmc.12.d:0 "Ми не впевнені, в яку гру грають [CMC.GetName], але вони відкликали свою пропозицію з тієї чи іншої причини. Можливо, це була просто хитрість, щоб перевірити нашу реакцію. У будь-якому разі, ми не впевнені, чи вийде з цього щось більше."
 nf_event_cmc.12.a:0 "Ну гаразд"


 nf_event_cmc.13.t:0 "What is Love, Baby Don't Hurt Me"
 nf_event_cmc.13.d:0 "Техаське Братство погодилося, що Тьюбхеди можуть тісніше співпрацювати з веселим народом Секвойї замість їхнього дивного проекту національного будівництва в обмін на велику купу грошей. Ура!"
 nf_event_cmc.13.a:0 "Нарешті я буду зі своїм справжнім коханням і ринком."

 nf_event_cmc.14.t:0 "Більше грошей — більше проблем"
 nf_event_cmc.14.d:0 "[CMC.GetLeader] пропонує нам ще більше грошей, якщо Містер Розвага переїде на північ. Що нам тепер робити?"
 nf_event_cmc.14.a:0 "Ми можемо використати ці кришки проти наших численних ворогів."
 nf_event_cmc.14.c:0 "Але що ми тоді дивитимемось?"

 nf_event_cmc.15.t:0 "Краща пропозиція"
 nf_event_cmc.15.d:0 "[CMC.GetLeader] пропонує нам ще більше грошей, якщо Містер Розвага переїде на північ. Що нам тепер робити?"
 nf_event_cmc.15.a:0 "Ми можемо використати ці кришки проти наших численних ворогів."
 nf_event_cmc.15.c:0 "Але що ми тоді дивитимемось?"

 nf_event_cmc.16.t:0 "Переїзд"
 nf_event_cmc.16.d:0 "Втомившись від стосунків на відстані, Містер Розвага (або Райан Розвага для друзів) погодився переїхати до [CMC.GetLeader]. Він може працювати як з Техасом, так і з [CMC.GetName], але його серце належить його чарівній дружині."
 nf_event_cmc.16.a:0 "До того ж, податкова ставка там краща."

 nf_event_cmc.200.t:0 "Спадкоємець двох імперій"
 nf_event_cmc.200.d:0 "Після майже повної відсутності на публіці протягом кількох місяців, [CMC.GetLeader] знову з'явилася на сцені. У цьому випадку — цілком буквально, оскільки [TUB.GetLeader] вважав за потрібне організувати спеціальну трансляцію цього вечора. Причина стала зрозумілою лише за кілька хвилин після початку шоу: після короткого музичного номера одного з гуртів [TUB.GetLeader], вони обидва вийшли перед камери, представивши свою новонароджену дитину радісній аудиторії. Горді батьки коротко розповіли про майбутні плани щодо обох націй, перш ніж знову піти за лаштунки, побажавши глядачам у залі та вдома приємного вечора і поступившись сценою різноманітним виконавцям."
 nf_event_cmc.200.a:0 "Думаю, час для привітань."

 # Gambling

 nf_event_cmc.101.t:0 "Джекпот!"
 nf_event_cmc.101.d:0 "Чудово... ні, чекайте! Це погано, якщо ви власник казино.\n\nХтось зірвав куш і пішов додому з величезною купою кришок. Він навіть не спромігся дати чайові круп'є або витратити хоч щось у нашому барі. \nМабуть, це означає, що найближчим часом ваші кишені будуть трохи порожнішими."
 nf_event_cmc.101.a:0 "Час затягнути паски"

 nf_event_cmc.102.t:0 "Аншлаг" # Full House в контексті покеру це фул-хаус, але тут про заповнену залу
 nf_event_cmc.102.d:0 "Сьогодні ввечері Боббі та Мутфрукти грали перед переповненою залою. Еклектична суміш завжди популярного джазу в перервах із грою Луїса Гантера на «музичній бензопилі» отримала велике визнання публіки. Хоча майданчик був невеликим, продаж квитків, а також спожиті їжа та напої стануть приємним бонусом."
 nf_event_cmc.102.a:0 "На біс!"

 nf_event_cmc.103.t:0 "Нова страва"
 nf_event_cmc.103.d:0 "Кухня «Ібофанги» отримала рецепт нової страви під назвою «сендвіч з журавлиною та фрикадельками» від каравану зі сходу. Хоча кухар каже, що оригінальний рецепт вимагає м'яса чогось під назвою «опікозвір», про якого тут ніхто ніколи не чув, страва смакує до біса добре і зі звичайною браміниною. Перша партія розійшлася дуже добре, і ми домовилися з караваном про постачання всіх необхідних інгредієнтів, яких у нас немає на місці."
 nf_event_cmc.103.a:0 "Смачного!"

 nf_event_cmc.104.t:0 "Галасливі гості"
 nf_event_cmc.104.d:0 "Не кожен гість приходить сюди, щоб гарно провести час. Дехто тут просто для того, щоб створювати проблеми. Або, можливо, це їхнє визначення гарного проведення часу.\nУ будь-якому разі, група п'яних відвідувачів вирішила розбити вітрини місцевого магазину, вкрасти частину виставлених товарів, а потім понівечити вуличні ліхтарі на своєму шляху. Ви знаєте, як важко знайти ціле скло достатнього розміру для вітрини магазину? Ліхтарі відремонтувати легше, але на пошук запчастин все одно піде певний час."
 nf_event_cmc.104.a:0 "Можливо, «щаслива година» була не найкращою ідеєю"

 nf_event_cmc.105.t:0 "Популярний новий коктейль"
 nf_event_cmc.105.d:0 "Після відкриття місцевої броварні Чорного Напою якийсь заповзятливий індивід спробував поєднати його з різними алкогольними напоями. Найбільш вдалим виявилося змішування його в рівних частинах з Рентген-ромом та додаванням плоду опунції. Освіжає та бадьорить, дозволяючи гостям насолоджуватися нічним життям, доки вони врешті-решт не відрубаються у своїх дорогих готельних номерах. Загалом, чиста вигода для нас."
 nf_event_cmc.105.a:0 "Будьмо!"

 nf_event_cmc.106.t:0 "Гарний вечір"
 nf_event_cmc.106.d:0 "Хоча цього вечора не відбувалося нічого особливого, прибутки були хорошими всюди. Ми повинні інвестувати ці гроші назад у наші казино. Поки навіть спокійні вечори приносять гарний прибуток, у нас все добре."
 nf_event_cmc.106.a:0 "До наступного дня!"

 nf_event_cmc.107.t:0 "Новий старий виступ!"
 nf_event_cmc.107.d:0 "Здається, хтось повернув до життя довоєнну співачку, яка була кріогенно заморожена! Після понад двохсот років у льоду вона сприйняла новий світ із дивовижним ентузіазмом, заявивши, що просто танцюватиме всю ніч безперервно.\n\nГарні новини для нас, хоча її пісні про кохання в декораціях ядерної війни звучать дещо... занадто прямолінійно."
 nf_event_cmc.107.a:0 "Я назавжди запам'ятаю нас такими."

 nf_event_cmc.108.t:0 "Зайвих питань не ставимо"
 nf_event_cmc.108.d:0 "Однією з наших недавніх гостей була підозріла особа, яка, схоже, прибула з півночі. Після кількох чарок вона згадала, що вона з «Братства Середнього Заходу» і «бачила всяке лайно, чувак». Ми не ставили багато запитань, бо вона була переважно нешкідливою і давала хороші чайові. Але що таке, в біса, Королева Калліопа?"
 nf_event_cmc.108.a:0 "Мабуть, не гірше, ніж бурмочучий хор."

 nf_event_cmc.109.t:0 "Чикаго, Чикаго, це метушливе місто"
 nf_event_cmc.109.d:0 "Очевидно, до нас заїжджають усі з Середнього Заходу, бо до нас завітала пара підозрілих чоловіків з емблемами старих США. Попри початкові побоювання, вони були на диво ввічливими, добре платили і програвали купу грошей, ніби не зовсім розуміли концепцію азартних ігор. Один із них згадав у розмові з новою подругою, що скоро сюди навідається більше його друзів, і усміхнувся.\n\nУ будь-якому разі, оскільки ми не ідіоти, ми їх заарештували, і вони зізналися, що належать до якоїсь групи під назвою «Анклав» в Іллінойсі. Ми їх відпустили, але конфіскували особисту зброю."
 nf_event_cmc.109.a:0 "Жодних знижок для груп."

 nf_event_cmc.110.t:0 "Таємничий незнайомець атакує!"
 nf_event_cmc.110.d:0 "Мандрівний хуліган втрутився в бійку між одним із наших воїнів та рейдером і застрелив нашого хлопця. Навіть рейдери були шоковані й питали, чому він став на їхній бік. Очевидно, дурень вирішив, що ми — лиходії, через низьку якість нашого готельного сервісу." # reference to Karma logic
 nf_event_cmc.110.a:0 "Усі тепер критики."
 nf_event_cmc.110.a_tt:0 "У кращому випадку цей чоловік — аморальний безумець.\n\nУ гіршому — плідний серійний вбивця."

 nf_event_cmc.111.t:0 "Позитивний відгук у Путівнику для гулів!"
 nf_event_cmc.111.d:0 "Путівник для гулів опублікував захоплений відгук про наш готель та послуги! У путівнику хвалили шведський стіл, щедрі столи в казино та чудові сувенірні крамниці, якими ми керуємо. Це, безумовно, привабить більше клієнтів, хоча ми думали, що гулі не їдять?"
 nf_event_cmc.111.a:0 "Ет, ми все одно здеремо з них гроші."

 nf_event_cmc.112.t:0 "Негативний відгук від Путівника для гулів"
 nf_event_cmc.112.d:0 "Схоже, коли ми вигнали гуля за те, що він смердів, не давав хороших чайових і махлював у карти, ми не знали, що він працює на Путівник для гулів. Власне, згідно з путівником, один із наших барменів виявився фанатиком і вигнав його через запах. Можливо, варто було порадитися з іншими працівниками, перш ніж викидати його..."
 nf_event_cmc.112.a:0 "Швидше, найміть нового голову відділу кадрів нелюдей."

 nf_event_cmc.113.t:0 "Млявий вечір"
 nf_event_cmc.113.d:0 "Гостей небагато, деякі заходи виявилися занадто дорогими в організації й не зібрали достатньо людей. Якісь логістичні проблеми. Усе це просто накопичується. Хоча це не кінець світу, це трохи вдарило по нашій кишені."
 nf_event_cmc.113.a:0 "Що ж поробиш"

 #CHC Teaser
 nf_event_cmc.300.t:0 "Просто сон... Сподіваюся"
 nf_event_cmc.300.d:0 "Я прокинувся раптово, весь у холодному поту. На моїх вустах був не крик, а останні ноти мелодії §c(пісні?)§!. Але якої? Я не пам'ятаю, але відчуваю, що ніколи не чув її раніше. Як я міг її співати?. Образи §c(видіння?)§! прийшли разом з нею, вже повільно згасаючи, як це роблять сни. Але я відчуваю, що в них було більше, ніж просто сон, якась важливість §c(небезпека?)§!. Я мушу згадати.\nТам був трон... камера §c(труна?)§!. Можливо, все це разом. Істоти були прикуті до нього. Ланцюги, що їх тримали, також давали їм силу. Жахливу силу. Але ланцюги кришилися §c(розривалися?)§!. Ланцюги були стародавніми, як і істоти.\n\nЯ відчуваю, що трон був десь на заході §c(під землею?)§!. Але істоти на ньому дивилися на нас очима, що обіцяють небезпеку §c(смерть)§!."
 nf_event_cmc.300.a:0 "Поганий знак"
 CHC_orchestra_flag:0 "§PГурт починає грати§!"

 #CHC Teaser
 nf_event_cmc.301.t:0 "Ти чуєш те, що чую я?"
 nf_event_cmc.301.d:0 "Якби ви прислухалися до §cсерцебиття зірки§! або §cсміху дерева§!, ви могли б пізнати диво і радість, що йдуть від Хору. Їхні слова, їхня мелодія, що мовчали так довго, набрали сили. Перша Хористка любить цей світ, попри все зло, яке він їй заподіяв. Вона просто хоче поділитися радістю з рештою Пустки.\n\n§cПрийди і послухай.§!"
 nf_event_cmc.301.a:0 "Я просто не можу викинути це з голови."