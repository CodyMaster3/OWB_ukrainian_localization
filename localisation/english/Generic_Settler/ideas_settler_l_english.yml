l_english:
settler_nation:0 "Нація поселенців"
 settler_nation_desc:0 ""

 erect_palisade:0 "Звести частокіл"
 erect_palisade_desc:0 "Траншея була стандартною частиною військового арсеналу щонайменше 200 років до Великої війни. Навчання тому, як копати ці укріплення, допоможе як у довгостроковій обороні нашої власної території, так і в закріпленні на ворожій."

 local_pride:0 "Місцева гордість"
 local_pride_desc:0 "Громада пишається тим, що ми тут побудували. Кров, піт і сльози пішли на те, щоб зробити цю націю бастіоном післявоєнної цивілізації, і це принесло свої плоди. А гордість за свою громаду викликає готовність її захищати."

 labor_treaties:0 "Трудові договори"
 labor_treaties_desc:0 "Одним із головних недоліків Америки перед її падінням була відсутність захисту робітників, що дозволяло роботодавцям знущатися з них як заманеться. Ми повинні гарантувати краще ставлення до наших робітників."

 new_schools:0 "Нові школи"
 new_schools_desc:0 "Рівень грамотності стрімко впав після війни. Відкриття шкіл, де наших громадян навчатимуть читати та інших базових академічних навичок, зробить нашу націю лише кращою."

 firefighter_protection:0 "Пожежна охорона"
 firefighter_protection_desc:0 "Наскільки складною може бути боротьба з пожежами? Просто лий на них воду."

 police_protection:0 "Охорона поліції"
 police_protection_desc:0 "Підготовка спеціалізованих поліцейських сил замість покладання на ополчення дозволить нам навчити їх діяти саме проти тих загроз, з якими стикаються правоохоронці."

 tato_farming:0 "Вирощування тато"
 tato_farming_desc:0 "Тато — це результат перехресного запилення старосвітських помідорів і картоплі. Вони ростуть практично будь-де, тому це легкий вибір для масового вирощування. Навіть якщо на смак вони як картон."

 brahmin_herding:0 "Розведення брамінів"
 brahmin_herding_desc:0 "Молоко, що виводить радіацію. Міцна шкіра. М'ясо, яке справді має смак. Громада б свідомо шкодила собі, якби не розводила цих скромних тварин."

 enforced_trade_laws:0 "Примусове виконання торговельних законів"
 enforced_trade_laws_desc:0 "Америка дуже, дуже ретельно захищала свої корпорації. Хоча можна стверджувати, що це призвело до її загибелі, запровадження принаймні деяких механізмів захисту могло б допомогти стимулювати комерцію."

 construction_protection:0 "Запас міцності"
 construction_protection_desc:0 "Надмірність. Надмірність. Надмірність. Це був головний принцип довоєнної інженерії, і ми повинні знайти спосіб інтегрувати його в наші будівлі."

 wall_construction:0 "Будівництво стін"
 wall_construction_desc:0 "Вивчення довоєнних фортифікацій дозволило нам оптимізувати процес зведення власних укріплень."

 established_armory:0 "Облаштований арсенал"
 established_armory_desc:0 "Створення централізованого арсеналу полегшило навантаження на нашу логістику та дозволило солдатам легко озброюватися за потреби."

 chem_lab:0 "Хімічна лабораторія"
 chem_lab_desc:0 "Хоча у нас небагато кваліфікованих хіміків, ті кілька, що є, допомогли нам створити власні суміші, тож нам більше не доводиться покладатися на те, що вдається знайти серед сміття."

 settler_robco:0 "РобКо"
 settler_robco_desc:0 "Руїни Америки заповнені роботами РобКо в усіх можливих станах ремонтопридатності. Якби ми їх полагодили, їх можна було б використати для поповнення нашої армії, що зменшило б людські втрати."

 oligarchical_power:0 "Олігархічна влада"
 oligarchical_power_desc:0 ""

 settler_monopoly:0 "Монополії поселень"
 settler_monopoly_desc:0 ""

 eliminating_rivals:0 "Усунення суперників"
 eliminating_rivals_desc:0 "Пустка — небезпечне місце. Ми повинні зробити його ще трохи небезпечнішим для тих, хто бажає нашого знищення."

 settlerbodyguards:0 "Особисті охоронці"
 settlerbodyguards_desc:0 "Дехто назвав би це «таємною поліцією», але ми називаємо це особистою зацікавленістю в житті наших громадян."

 loyalty_idea:0 "Лояльність"
 loyalty_idea_desc:0 "Ми довели, що є гідним домом серед сотень інших варіантів у пустці. Дозволяти людям самостійно обирати своїх лідерів — рідкість у наші дні, і ця політична свобода зробила наших громадян відданими нам понад усе."

 settler_subsidized_weapon_manufacturers:0 "Субсидування виробництва зброї"
 settler_subsidized_weapon_manufacturers_desc:0 "Фінансуючи наших місцевих виробників зброї, ми завоювали їхню прихильність. Мало того, що з додатковими коштами вони стали працювати ефективніше, на знак подяки за наші інвестиції вони дозволили нам купувати їхню зброю за нижчими цінами."

 militia_posters:0 "Пропаганда ополчення"
 militia_posters_desc:0 "Для декого в нашій громаді ополчення — це майже сила природи, що приходить на захист щоразу, коли поселенню загрожує небезпека. Якщо ми підтримаємо це сприйняття, то зможемо збільшити кількість призовників."

 encourage_women:0 "Заохочення жінок до служби"
 encourage_women_desc:0 "Старий стереотип дожив і до 23-го століття: мовляв, жінки не можуть виконувати ті ж військові обов'язки, що й чоловіки. Висвітлення цього застарілого переконання заохотить жінок іти до армії, щоб довести його хибність, що поповнить наші лави."

 militia_drilling:0 "Муштра ополчення"
 militia_drilling_desc:0 "Використання довоєнних навчальних посібників дозволило нам вдосконалити режим тренувань, завдяки чому батальйони тепер готуються в рекордні терміни."

 marching_drills:0 "Стройова підготовка"
 marching_drills_desc:0 "♪ Кажуть, що в армії кротощури — вищий клас, ♪\n\n♪ Один зістрибнув зі столу і пішов марширувати враз ♪"

 settler_old_tactics:0 "Тактика Старого світу"
 settler_old_tactics_desc:0 "Хоча нам бракує можливостей для проведення більшості маневрів, описаних у старих військових посібниках, ці знання все ще цінні. Поєднання грандіозних планів битв Старого світу та реалій війни в пустках Нового світу дасть нам перевагу над більшістю військових сил у руїнах Америки."

 settler_militia_organization:0 "Організація ополчення"
 settler_militia_organization_desc:0 "До цього часу наша армія була дуже слабко організована, через що наші сили легко розбігалися, зіткнувшись із серйозними викликами. Цьому настав кінець."

 settler_standardized_military:0 "Стандартизована армія"
 settler_standardized_military_desc:0 "Видаючи стандартне екіпірування всім нашим солдатам, нам більше не потрібно тримати на складах запчастини для десятків різних видів зброї, що значно спрощує логістику."

 settler_fallback_tactics:0 "Тактика відступу"
 settler_fallback_tactics_desc:0 "Наявність заздалегідь визначених точок відходу та тактики відступу допоможе нам швидко перегрупуватися в разі прориву наших ліній."

 settler_tactical_awareness:0 "Тактична обізнаність"
 settler_tactical_awareness_desc:0 "Навчання наших солдатів читати карти дозволить їм пересуватися цілеспрямовано і самим обирати місця для бою. Тепер нам просто потрібно знайти когось, хто взагалі вміє читати."

 settler_point_defence:0 "Точкова оборона"
 settler_point_defence_desc:0 "Передові оперативні бази навколо нашої території допоможуть нам прорідити ряди противника ще до того, як він зможе атакувати нас належним чином, і слугуватимуть системою раннього попередження про наближення нападу."

 settler_wasteland_settlers:0 "Поселенці пустки"
 settler_wasteland_settlers_desc:0 "Люди з усіх усюд кидають виклик пустці, щоб знайти тут краще життя."

 settler_long_distance_movements:0 "Переміщення на великі відстані"
 settler_long_distance_movements_desc:0 "♪ Коли я дістанусь до раю, ♪\n♪ Святий Петро запитає мене: ♪\n♪ Як ти заробляв на життя, хлопче? ♪ \n♪ Як ти отримував свою платню? ♪ \n♪ Я відповім йому з великою злістю: ♪\n♪ Я заробляв на життя як Аризонський рейнджер ♪."

 settler_medical_protection:0 "Медичний захист"
 settler_medical_protection_desc:0 ""

 settler_militia_commanders:0 "Командири ополчення"
 settler_militia_commanders_desc:0 "Кілька військовослужбовців нашої армії проявили себе як здібні лідери. Є сенс призначити їх на керівні посади."

 caravanmilitia:0 "Ополчення караванів"
 caravanmilitia_desc:0 ""

 settlerdefendingwitha:0 "Місто найманців"
 settlerdefendingwitha_desc:0 "Попри всюдисущість цього явища в пустці, багато хто вважає роботу найманця огидною чи аморальною, через що найманців витісняють на узбіччя суспільства. Надання їм притулку може виявитися прибутковим."

 settlerdefendingwithb:0 "Місто збирачів"
 settlerdefendingwithb_desc:0 "Дивлячись у майбутнє, ми повинні навчити наших громадян розпізнавати, що в пустці справді цінне. Знання того, що краще взяти ядерний блок замість батарейок АА, допоможе прискорити наш розвиток."

 settlerdefendingwithc:0 "Місто гріха"
 settlerdefendingwithc_desc:0 "Наркотики. Азартні ігри. Жінки. Ви можете знайти це будь-де, але лише в кількох місцях воно є в такій якості, щоб приваблювати клієнтів з усіх усюд. Ми — одне з таких місць."

 settler_council_of_minds:0 "Рада умів"
 settler_council_of_minds_desc:0 ""

 settlercleanwater:0 "Чиста вода"
 settlercleanwater_desc:0 "Наші засновники були достатньо передбачливими, щоб викопати криниці та побудувати системи очищення, які змогли підтримувати нас поколіннями. Вони не лише врятували нас від смерті від спраги, але й чутки про наші запаси води поширилися далеко, змусивши багатьох стікатися до нас у найскрутнішу годину."

 settlerpowerful:0 "Могутність"
 settlerpowerful_desc:0 "Єдиний вірний спосіб забезпечити своє майбутнє в цьому суворому світі — це сила. Груба. Військова. Сила."

 settleradvanced:0 "Передові технології"
 settleradvanced_desc:0 "Так багато було втрачено в ядерному вогні 2077 року. Присвячення себе розкриттю таємниць, похованих під пісками пустки, допоможе нам встановити перевагу над менш розвиненими ворогами."

 settlerwealthy:0 "Багатство"
 settlerwealthy_desc:0 "Що більше все змінюється, то більше залишається незмінним. Так само, як всемогутній долар правив Старим світом, кришки керують новим. Надлишок багатства закріпить наше місце на вершині структури влади."