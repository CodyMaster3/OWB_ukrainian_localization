################################## EVENTS ##############################################
nf_suf.1.t:0 "«Великий Бум»"
nf_suf.1.desc:0 "Феєрверки розривали небо, а уламки розліталися на всі боки! «Великий Бум» — саме так називають цю подію, свято, яке проводиться щороку — в один і той самий день, місяць і годину.\n\nЦе свято вшановує утворення Федерації Саммерс — союзу трьох маленьких, колись незалежних, містечок.\n\nБеквудс, перше з них, був смітником на вершині скелястого масиву. На момент заснування — просто притулок для втікачів і вцілілих, які хотіли сховатися від рейдерів. Скеля добре підходила, щоб помічати ворожі банди заздалегідь.\n\nЩо привнесли жителі Беквудса до Федерації Саммерс?"
nf_suf.1.option.a:0 "Історії про забутого героя."
nf_suf.1.option.b:0 "Історії про загиблий кордон."

nf_suf.2.t:0 "Сімейні сварки"
nf_suf.2.desc:0 "Друге місто — Чевела, засноване легендарним Троєм Чевелою — колишнім мешканцем сховища! На жаль, його мрії про ідеальне демократичне суспільство швидко зіткнулися з суворою дійсністю Пустки. Чевела загрузла у війнах і племінних конфліктах, де сім'ї вели криваві ворожнечі десятиліттями. Лише приєднання до Федерації дозволило зовнішньому арбітражу припинити ці конфлікти.\n\nЯку сім’ю Федерація визнала правою?"
nf_suf.2.option.a:0 "Рід Троїв."
nf_suf.2.option.b:0 "Рід Гарретів."

nf_suf.3.t:0 "Найбільша втрата"
nf_suf.3.desc:0 "Останнє місто, яке приєдналося до Федерації Саммерс, було найзаможнішим — Плейнсраннер. Колишній постачальний пункт на трасі I-10 перетворився на багате місто завдяки торгівлі залишками. Під час нападу «Матрони Рейдерів» місто погодилось на приєднання до Федерації задля захисту.\n\nАле Плейнсраннер недовго залишався під владою Федерації. Через кілька десятиліть нова банда рейдерів, «Виконавці», захопила місто після затяжної війни.\n\nЩо Федерація намагалася врятувати перед втратою міста?"
nf_suf.3.option.a:0 "Інструменти!"
nf_suf.3.option.b:0 "Зброю!"

nf_suf.4.t:0 "Торговці з Федерації Саммерс прибули"
nf_suf.4.desc:0 "Днями до нас завітали торговці з півдня, з Нью-Мексико, які стверджують, що представляють «Федерацію Саммерс». Вони пропонують обмін: технології та сировина — в обмін на знання про виживання та креслення. Угоди вигідні для нас — вони явно не розуміють цінності своєї технології.\n\nВтім, якщо ми не хочемо мати справ з ними — достатньо просто не впускати їх до нашого бункера."
nf_suf.4.option.a:0 "Цікаво, до чого це приведе..."
nf_suf.4.tt:0 "Федерація Саммерс буде торгувати з нами, поки ми їх не зупинимо."

nf_suf.5.t:0 "Лізинг технологій Саммерс-Макссон?"
nf_suf.5.desc:0 "Федерація Саммерс пропонує угоду!\n\nЯкщо ми отримаємо доступ до їхніх ресурсів, вони отримають технологічні переваги! Це покращить нашу промисловість на кілька років, поки ресурси будуть передаватися нам. Приймаємо?"
nf_suf.5.option.a:0 "Від такої угоди важко відмовитись!"
nf_suf.5.option.b:0 "Це жарт?"

nf_suf.6.t:0 "Макссон відвертається від нас!"
nf_suf.6.desc:0 "Схоже, наші відносини з ними зіпсувалися! Більше ми не можемо вести з ними справи!"
nf_suf.6.option.a:0 "Ох ні!"