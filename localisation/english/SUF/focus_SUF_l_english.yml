l_english:
suf_trade_partners:0 "Торгівельні партнери"
suf_trade_partners_rejected:0 "Торгівлю відхилено!"
suf_historical_grudges:0 "Історичні образи"
suf_historical_grudges_tt:0 "Має модифікатор думки §Y$suf_historical_grudges$§! проти §Y[EXE.GetNameWithFlag]§!"

break_off_trade_with_suf:0 "Припинити торгівлю з Федерацією Саммерс"
break_off_trade_with_suf_desc:0 "Це наше право – вирішувати, чи дозволяти торговцям в'їзд до нашої країни."

suf_the_day_the_bombs_fell:0 "«Великий Бум»"
suf_the_day_the_bombs_fell_desc:0 "У Федерації Саммерс бомби використовують для святкувань, а не лише для війни."

suf_the_cave_in:0 "Сварки в домі"
suf_the_cave_in_desc:0 "Як у будь-якій родині, невеличкі конфлікти неминучі."

suf_our_return:0 "Колишні солдати – завжди солдати"
suf_our_return_desc:0 "Ми ще повернемо вас назад. Колись."

suf_gun_gun:0 "Зброя!"
suf_gun_gun_desc:0 "Як тут не любити?"

suf_congratulating_the_next_gen:0 "Стань найкращою версією себе!"
suf_congratulating_the_next_gen_desc:0 "Ці солдати – найкраща група, яку ми коли-небудь тренували. Вони зразкові й пишаються своєю службою."

suf_looking_at_army_layouts:0 "Вправа Омега"
suf_looking_at_army_layouts_desc:0 "Ми проводимо військові навчання з місцевими рейдерами як умовним ворогом."

suf_look_at_old_planes:0 "Бойова підготовка"
suf_look_at_old_planes_desc:0 "У старій коморі форту знайшлась вціліла бойова гра-симулятор, ймовірно з військової бази. Варто витягти з неї знання, поки працює."

suf_hunting_big_prey:0 "Полювання на велику здобич"
suf_hunting_big_prey_desc:0 "Іноді потрібна більша гармата..."

suf_picking_on_the_little_prey:0 "Мала здобич – теж здобич"
suf_picking_on_the_little_prey_desc:0 "Іноді й маленької зброї вистачає."

suf_promoting_a_hero:0 "Відзначити героя"
suf_promoting_a_hero_desc:0 "Старий «Гаскі» Саммерс давно герой, а нещодавно знову це довів, відбивши рейд Виконавців. Можливо, в нього ще залишилося трохи пороху?"

suf_allocation_of_resources:0 "Розподіл ресурсів"
suf_allocation_of_resources_desc:0 "Загроза з заходу й півдня змушує нас акумулювати ресурси. Хто знає, що станеться завтра?"

suf_eastern_bunker_excavation:0 "Розкопування старих бункерів"
suf_eastern_bunker_excavation_desc:0 "Після падіння бомб багато бункерів біля Форту Саммерс були завалені. Час дізнатись, що залишилось усередині."

suf_restoring_the_power:0 "Статус генератора: УВІМКНЕНО"
suf_restoring_the_power_desc:0 "Минуло двісті років з часу останньої активації цих генераторів. Дивовижна потуга давньої техніки."

suf_the_i10_parts_deal:0 "Інструментальний законопроєкт I-10"
suf_the_i10_parts_deal_desc:0 "Пара гулів, що спеціалізуються на ремонті джакузі, запропонували Форту Саммерс вигідну угоду на ремонтні інструменти!"

suf_chewelah_healing_initiative:0 "Оздоровча ініціатива Чевели"
suf_chewelah_healing_initiative_desc:0 "Поселенці з Чевели запропонували допомогу у розчищенні доріг після останніх рейдів Виконавців. Можливо, життя знову стане нормальним."

suf_restoring_the_armories:0 "Відновлення арсеналів"
suf_restoring_the_armories_desc:0 "Тепер, коли арсенали доступні, ми можемо почати відновлення зброї й броні. Також слід створити Трудовий корпус для відбудови нашої землі."

suf_powering_the_mainframe:0 "Відновлення мейнфрейму"
suf_powering_the_mainframe_desc:0 "Комп'ютерна система в одній із глибоких баз була вимкнена з часів Великої Війни. Лише нещодавно ми повернули живлення – і знайшли згадки про проєкт «КАЛІКС»."

suf_the_federations_big_win:0 "Велика перемога Федерації"
suf_the_federations_big_win_desc:0 "О так! Ми відбилися від чудовиськ на кордоні й підтвердили своє право на існування перед загрозою рабства й знищення. Святкуймо з піснею, танцями, випивкою та веселощами!"

suf_securing_the_south:0 "Повернути своє"
suf_securing_the_south_desc:0 "Час поглянути на південь – на Виконавців. Ми передамо їм смертельний «виконавчий наказ» за Плейнсраннер! За Федерацію!"

suf_cooking_with_mutants:0 "Готуємо з мутантами"
suf_cooking_with_mutants_desc:0 "У нас часто були тертя з мутантами-Жаболюдами. Але, можливо, час забути про відмінності за смачною спільною вечерею.\nХоча їхні вподобання трохи... дивні."

suf_reintegrating_plainsrunners:0 "Реінтеграція Плейнсраннера"
suf_reintegrating_plainsrunners_desc:0 "З Виконавцями покінчено. Час повернути контроль над Плейнсраннером. Чотири міста Федерації знову разом!"

suf_eda_survivors:0 "Уцілілі з Блакитної Троянди"
suf_eda_survivors_desc:0 "Після нашого повернення до Розвеллу деякі старі мешканці міста повернулися. Хоч вони й не порушують угоду про нерозголошення, підписану при переселенні, але щиро вдячні за нашу допомогу."

suf_forming_the_dbac:0 "Формування DBAC"
suf_forming_the_dbac_desc:0 "Корпус Штурму Небезпечних Біомів, або DBAC, був елітною військовою силою ще до війни. Час відродити його."

suf_a_dream_of_statehood:0 "Мрія про державність"
suf_a_dream_of_statehood_desc:0 "Символи старої республіки все ще майорять у небі... Можливо, настав час її відновити."

suf_stories_of_the_lambda:0 "Спадщина Лямбда"
suf_stories_of_the_lambda_desc:0 "Плем’я Лямбда, майже знищене, мало кількох вижилих серед рабів, яких ми звільнили з Легіону. Вони розповідали про «Вільного чоловіка», який разом із поліцейським і трьома вченими кинув виклик Легіону й здобув «привілейований перехід» до небес."

suf_friends_of_god:0 "Грати з Богом"
suf_friends_of_god_desc:0 "Архієпархія Санта-Фе була священною нацією. Вшануймо її пам’ять, перетворивши храм на крутий баскетбольний майданчик."

suf_freedom_is_a_sovereign_right:0 "Свобода – це суверенне право"
suf_freedom_is_a_sovereign_right_desc:0 "Гей, покидьки! Демократія – не предмет для торгу!"

suf_contacting_maxsons_chapter:0 "Позбуваємось просунутого хламу"
suf_contacting_maxsons_chapter_desc:0 "Нещодавно ми знайшли трохи технологічного мотлоху – старі схеми, зламані ядерні батареї... Ми нічого з цим зробити не можемо, тож звернемось до панцерників на півночі, щоб передати їм усе це."

suf_learning_a_knights_oath:0 "Передача даних"
suf_learning_a_knights_oath_desc:0 "«Бажання перемогти важливе, але ще важливіше – бажання готуватись». Братство пропонує нам освіту й військову підготовку. Натомість просять старі сервери, модулі ШІ та зламаних роботів."

suf_the_tasks_of_scribes:0 "Уроки за Кодексом"
suf_the_tasks_of_scribes_desc:0 "Братство дозволяє нам ознайомитись зі своїм Кодексом – дізнатися, як вони тримають порядок у дикому світі."

suf_the_duty_of_paladins:0 "Невеличкий пакунок"
suf_the_duty_of_paladins_desc:0 "Братство передало нам скарбницю спорядження! Розібратись, як воно працює, буде цікаво."

suf_tech_for_protech:0 "Ветеранські інструктори"
suf_tech_for_protech_desc:0 "Найкращі командири Братства навчають наш персонал. Наші бойові втрати стрімко знижуються."

suf_expand_our_bunkers:0 "Бункерна стратегія"
suf_expand_our_bunkers_desc:0 "Якщо ми повторимо стратегію Братства щодо фортифікованих баз, ми зможемо краще захищатися. Саме так Паллус прорвався – час заблокувати ті проходи."

suf_the_maxson_technology_lease:0 "Технологічна оренда Мексона"
suf_the_maxson_technology_lease_desc:0 "Ми можемо дозволити Мексонському розділу добувати ресурси в деяких наших регіонах в обмін на схеми потужної зброї!"
suf_the_maxson_technology_lease_tt:0 "Ми пропонуємо §Y[MXC.GetNameWithFlag]§! угоду: в обмін на §Yресурсні права§! в наших володіннях ми отримаємо потужний бонус до виробництва.\n\nПрава триватимуть §Yтри роки§! або поки ми не втратимо контроль над відповідними регіонами.\nБонус діятиме лише поки Мексон незалежний і не перебуває §Rу стані війни§! з нами.\n\n§g(Регіони: Розвелл, Гвадалуп-Пік, Тручас-Пік)§!"

suf_a_haven_for_the_helpless:0 "Притулок для беззахисних"
suf_a_haven_for_the_helpless_desc:0 "З моменту заснування Форт Саммерс був прихистком для всіх, хто шукав дім."
suf_impove_heaven_for_the_helpless:0 "§YОновити Притулок:§!\n  §G+5%§! привабливості для біженців."

suf_refugees_asf:0 "Рука допомоги Санта-Фе"
suf_refugees_asf_desc:0 "Священикам із Санта-Фе потрібна допомога. Добре, бо ми давно хотіли відкрити з ними торгівлю."

suf_refugees_los:0 "Культисти потребують дому"
suf_refugees_los_desc:0 "Щоб люди й гуля порозумілися, ми повинні подолати упередження.\nНавіть якщо доведеться прийняти таких, як Церква Загублених..."

suf_refugees_mes:0 "Мескалеро просять допомоги!"
suf_refugees_mes_desc:0 "Із південного заходу прибувають біженці з Мескалеро! Вони розповідають жахіття про жорстокість Легіону."

suf_refugees_hangdogs:0 "Порани з Міста Псів"
suf_refugees_hangdogs_desc:0 "Вони дикуни – але краще їх навчити цивілізації, ніж дозволити блукати. Можливо, нам навіть доведеться збудувати нові вольєри..."

suf_refugees_edn:0 "Поранені з Едему"
suf_refugees_edn_desc:0 "Едем впав! Хто б міг подумати, особливо після всіх зусиль Скарлет."

suf_refugees_rrg:0 "Допомога для Глорії"
suf_refugees_rrg_desc:0 "Ми не часто спілкувалися з Глорією, але після її падіння люди рушили на північ. Можливо, колись ми переймемо їхню культуру."

suf_refugees_cbn:0 "Караванники з Карбону"
suf_refugees_cbn_desc:0 "Карбон не міг довго протриматись. Але ми можемо дати його мешканцям новий дім."

suf_refugees_ffi:0 "Дім для Луча"
suf_refugees_ffi_desc:0 "Коли ми приймали Луча з Вільних Бійців, виник мовний бар’єр. Добре, що ми мали гіди від Vault-Tec."

suf_refugees_cmc:0 "Допомога Федерації"
suf_refugees_cmc_desc:0 "У Форті Саммерс вистачає місця – можливо, ми зможемо прийняти втікачів із загиблої Оклахомської федерації."

suf_ncr:0 "Приєднатись до НКР"
suf_ncr_desc:0 "Нас вразили перемоги над Легіоном – час вступити в Нову Каліфорнійську Республіку!"

suf_tex:0 "Приєднатись до Техаського економічного союзу"
suf_tex_desc:0 "Ми зміцнили зв’язки з Техаською Республікою – час офіційно об’єднатися!"

