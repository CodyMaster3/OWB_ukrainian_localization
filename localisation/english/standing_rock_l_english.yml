l_english:

nf_event_sr.1.t:0 "Переможці при Розбитому Коліні"
nf_event_sr.1.d:0 "Сіу – це союз семи племен, що колись жили від Вісконсіна на сході до Вайомінга на заході. Могутні воїни, які панували на торгових шляхах між Великими рівнинами та Сходом, Сіу не знали страху. Аж поки Армія Сполучених Штатів не вирушила на захід, відбираючи землі одну за одною. У 1870-х Сіу намагалися зберегти Чорні Пагорби й перемогли Кастера в битві при Розбитому Коліні. Але зрештою, перевага числом стала непосильною, й Сіу підписали низку договорів, що заганяли їх у резервації.\n\nУряд США створив резервацію Стендінґ-Рок, розділивши велику резервацію Сіу, яка охоплювала Західну Південну Дакоту. Стендінґ-Рок стала домівкою для дакота і лакота, гілок народу Сіу. Але до падіння бомб про Стендінґ-Рок годі було щось згадати. Довоєнна влада прокладала трубопроводи через резервацію без згоди племен і віддавала гірничі концесії американським корпораціям."
nf_event_sr.1.a:0 "Деяке гірниче обладнання вдалося врятувати."
nf_event_sr.1.b:0 "Як і досвід протестів і спротиву."

nf_event_sr.2.t:0 "Сім Вогнів Догорають"
nf_event_sr.2.d:0 "У передвоєнні роки експлуатація індіанських земель лише посилилася. Загниваюча імперія вичерпувала ресурси, а трубопроводи з окупованої Канади пролягли через землі племен без їхньої згоди. Хімічне забруднення від Abraxo у Дакотах стало останньою краплею – і племена відновили Сім Вогнів Ради: вільний союз дакота, накота і лакота. Переслідувані ФБР ще до війни, вони зуміли зберегти єдність, коли світ скінчився.\n\nСто п’ятдесят років Сім Вогнів підтримували мир у Північній Співдружності, співпрацюючи з Істориками та іншими. Це завершилося двадцять років тому. Епідемія Блакитного Грипу ввела локдауни, а Перші Родини з новими союзниками відтіснили рейдерів на схід. Та у 2263-му рейд Буревісників – у стародавніх вертибердах і темній як ніч броні – обрушився на раду, мов змій Унчегіла. В хаосі племена почали звинувачувати одне одного. І Вогні згасли. Вцілів лише Стендінґ-Рок."
nf_event_sr.2.a:0 "Ми ніколи не забудемо цю трагедію."
nf_event_sr.2.b:0 "Але ми здобудемо справедливість."

nf_event_sr.3.t:0 "Донька Сидячого Бика"
nf_event_sr.3.d:0 "Шаппа – жінка дії, навіть серед молодшого покоління. Вона вела торгові каравани до Ґрейт-Фолз, укладала угоди з [LAP.GetNameDef] і пливла Міссурі до Кресент-Сіті. Але вона не пацифістка. Шаппа увірвалась у Церкву Сайло, підірвавши реактор-святиню на знак сили. Її воїни досягли стін Брандона, відступивши лише після того, як король погодився на «іноземну допомогу».\n\nЇї перемоги зробили її однією з наймолодших, хто здобув почесну відзнаку племені: сорочку з овчини, оздоблену бісером та скальпами ворогів – деякі з яких датуються її першими рейдами."
nf_event_sr.3.a:0 "Пам’ятаєте, як вона переконала Істориків надіслати більше вчителів?"
nf_event_sr.3.b:0 "А як вона знищила той конвой у Міссула?"

nf_event_sr.4.t:0 "Договір форта Макартур"
nf_event_sr.4.d:0 "[STR.GetLeader] надіслав делегацію з незвичною пропозицією. Наші поставки до Чикаґо часто зазнають нападів у Дакотах, що шкодить внеску Макартура в Національну Реконструкцію. А ще, в цих землях є корисні копалини. Варто укласти угоду? Єдиний «мінус» – це посилення Сіу, але ж це буде проблемою для бидла між нами й серцем країни.\n\nЯкщо ми погодимось, отримаємо доступ до металу та води."
nf_event_sr.4.a:0 "Це чудова ідея!"
nf_event_sr.4.b:0 "А раптом вони нас потім підстрелять?"

nf_event_sr.5.t:0 "Подарунок від Останніх Американців"
nf_event_sr.5.d:0 "[MCA.GetLeader] погодився на наші умови. Хоч деякі шкодують, що маємо справу з Анклавом – це тимчасово. Коли ми переможемо ворогів, то помстимось у Міссулі, так чи інакше."
nf_event_sr.5.a:0 "Вони мали б згадати про Кастера."

nf_event_sr.6.t:0 "Спадок Кастера"
nf_event_sr.6.d:0 "[MCA.GetLeader] відхилив нашу пропозицію, підтвердивши: миру між Армією США і Лакота бути не може. Гарна новина: ми отримаємо багато ресурсів, просто грабуючи їхні конвої."
nf_event_sr.6.a:0 "Щасти вам дістатися до Чикаґо, Ія."

nf_event_sr.7.t:0 "Інші Мисливці"
nf_event_sr.7.d:0 "Племена Стендінґ-Рок запрошують нас до альянсу, щоби разом поділити Північ. За умовами плану, ми йдемо на захід, вони – на північ, і разом будуємо нову імперію. Приєднаємось?"
nf_event_sr.7.a:0 "Разом ми – сила..."
nf_event_sr.7.b:0 "Роз’єднані – вони впадуть."

nf_event_sr.8.t:0 "Наші Нові Древні Вороги"
nf_event_sr.8.d:0 "[KHA.GetLeader] відкинув нашу пропозицію. Що ж, доведеться влаштувати їм різанину й вигнати на суху, спустошену землю. Га. Уяви собі, як це було б жахливо!"
nf_event_sr.8.a:0 "Як на мене – доволі кумедно."
nf_event_sr.8.b_tt: "§R\nЦе надасть Стендінґ-Рок воєнну мету проти вас. Ви дійсно цього хочете? Ви абсолютно, дійсно впевнені?§!"

nf_event_sr.9.t:0 "Знищення Гори Рашмор"
nf_event_sr.9.d:0 "Лакота давно ворогували з федеральним урядом через присутність Маунт-Рашмору на їхніх землях, але після Великої Війни в пріоритеті були інші справи. Тепер же [STR.GetLeader] вирішила залишити свій слід в історії – знищити старий монумент як нагадування всьому світу, що ця земля – належала, належить і належатиме її народу.\n\nБомби зірвали ніс Лінкольну, вибили око Вашингтону й розбили щелепу Джерманотті. Та попри це, значна частина гори встояла. Залишки служать пам'яткою про кінець Америки на цих землях.\n\nАмериканці були подібні до повені – проривши береги, вони нищили все на шляху. Вони заразили світ жадобою та надлишком, аж поки не спалили його до кісток. А тепер ми палимо їхню пам'ять. Зберімося ж разом і збудуймо світ для наших дітей."
nf_event_sr.9.a:0 "Цікаво, чи вдасться продати уламки?"
nf_event_sr.9.b:0 "Сьогодні ти нажила собі могутнього ворога."
nf_event_sr.9.c:0 "О, вибух у довоєнній руїні. Йдемо далі."

STR_standing_rock:0 "Походження Стендінґ-Року"
STR_standing_rock_desc:0 "Лакота завжди були воїнами, з того самого моменту, як наші землі зневажили загарбники. Хоробрі вожді полягали в битвах проти європейських загарбників, і роками наші народи вели відчайдушну війну. Та дух племені було зламано більшою силою і жадібністю до Великої Вогняної Пожежі.\n\nІ все ж, останнє пророцтво Лакота передбачає повернення духу нашого племені – й пошуки того, хто є §gВакан§!."

STR_seven_fires:0 "Рада Семи Вогнів"
STR_seven_fires_desc:0 "Колись наші народи були єдині під прапором предків, але сьогодні багаття розділене. Ми мусимо знову зібрати вогні разом, якщо хочемо знайти §YВакана§! – провідника духу, що приведе Лакоту до благословення Іняна, навіть після того як вогонь спопелив його ріки й рівнини."

STR_warrior_woman:0 "Прийшов Її Час"
STR_warrior_woman_desc:0 "Століттями рада втрачала віру, що з’явиться та, хто зможе воскресити дух нашого народу. І ось з’явилася – смілива, бойова жінка з §3Чорноногих§!, можливо, §YВакан§!, здатна привести Лакоту до нового розквіту під оком Іняна."

STR_economic_growth:0 "Величні Череди Брамінів"
STR_economic_growth_desc:0 "Безліч диких брамінів пасуться на наших рівнинах, лишаючи після себе добриво. Якщо обгородити ці землі – можемо розпочати скотарство й розбудувати поселення для обробки матеріалів."

STR_salvage_goods:0 "Розібрати Трубопровід"
STR_salvage_goods_desc:0 "Трубопровід Даґота був символом жадоби, що зруйнувала світ. Та іронічно, тепер він джерело металу. Старі труби перетворимо на нову зброю, обладнання – на майбутнє нашого народу."

STR_windmills:0 "Розвиток Вітряків"
STR_windmills_desc:0 "Колись Дакоту мали покрити вітряки – чисті джерела енергії. Та замість цього вони спалили наші землі. Ми відновимо цю ідею – й дозволимо вітрам рівнин служити нам."

STR_vegetable_bounty:0 "Щедрість Дакот"
STR_vegetable_bounty_desc:0 "Якщо хочемо повернути родючість цих земель під сяйвом §YВеликого Бога Ві§!, мусимо їх очистити й підготувати наших людей до культивації дарів рівнин. Це дасть силу для зростання нашого племені."

STR_housing_expansion:0 "Повернення до Коріння"
STR_housing_expansion_desc:0 "Щоби знову стати господарями рідних земель, слід будувати оселі в гармонії з природою – без руйнування, без гніву, в дусі старих палаток і укріплень."

STR_plowshares_to_swords:0 "Плуги – на Мечі"
STR_plowshares_to_swords_desc:0 "Застаріле сільськогосподарське обладнання може дати нам метал. Якщо запропонуємо фермерам справедливий обмін, зможемо виготовити зброю з того, що колись годувало народ."

STR_riches_of_land:0 "Скарби Матері-Землі"
STR_riches_of_land_desc:0 "Наші вороги знали, що під землею ховаються багатства. Ми знову відкриємо старі рани Землі – та цього разу візьмемо обережно, з думкою про майбутнє."

STR_nakota_recruits:0 "Воїни Накота"
STR_nakota_recruits_desc:0 "Щоби вистояти проти бурі, що насувається, маємо звернутись до наших давніх союзників – накота. Разом ми зможемо втримати наші землі."

STR_MLA_contract:0 "Угода з МЛА"
STR_MLA_contract_desc:0 "Зелешкі люди зі сходу простягають руку миру. Кажуть, що й самі зазнали гноблення. В обмін на зброю вони бажають торгівлі. Можливо, в майбутньому й до миру дійдемо."

STR_farmer_tribute:0 "Данина Фермерів"
STR_farmer_tribute_desc:0 "Ми просимо жертви задля добробуту племені – скромну данину на випадок голоду. Це не примус §Rдемонів Старого Світу§!, а вимога солідарності."

STR_river_league_ports:0 "Порти для Річкової Ліги"
STR_river_league_ports_desc:0 "Річкова Ліга контролює потік, без якого не матимемо торгівлі. Ми погодимося на їхні умови, – невелика ціна за доступ до артерій континенту. Вони лише просять не зрізати їм шкіру з голів."

STR_never_again:0 "Ніколи знову"
STR_never_again_desc:0 "Щоб нас знову не знищили, ми мусимо здобути владу над небом – домом Ві та Маки. Якщо ми відновимо табуйовані технології, що досі дрімають, зможемо воювати з демонічними машинами неба, що колись знищили наш народ."

STR_farm_development:0 "Добрива для Врожаю"
STR_farm_development_desc:0 "Завдяки накопиченню гною брамінів ми можемо почати компостування й створити добриво, що підживить землю. Так відновимо життєвий цикл, повертаючи дари Матері-Землі."

STR_MCA_offer:0 "Угода з Дияволом"
STR_MCA_offer_desc:0 "Ми можемо глузувати з тих, хто вдає з себе Армію США, але не можемо заперечити користі від їхньої зброї. Як Іня жертвував тілом заради миру, ми мусимо поступитись ворогам задля військової допомоги."

STR_MLA_contract_tt:0 "Ми запропонуємо §P[MCA.GetName]§! доступ до ресурсів у Тімбер-Лейк в обмін на військову допомогу."

STR_supplies_for_war:0 "Добре Спакований Коморник"
STR_supplies_for_war_desc:0 "Якщо почнемо заздалегідь накопичувати припаси, війна не застане нас зненацька. Це дозволить ефективніше використовувати торгівлю та ресурси в розпал конфлікту."

STR_summon_council:0 "Скликати Раду"
STR_summon_council_desc:0 "§3Ми маємо скликати сім племен§! та розпочати нову добу. Під проводом §YШаппи Ваґнер§! духи підтримають нас. Її треба обрати вождем, щоби привести племена до єдності."

STR_cansasa:0 "Шукати Поради Духів"
STR_cansasa_desc:0 "[STR.GetLeader] принесе жертву духам Сходу, Півночі й Півдня – дим кансаси, аби отримати бачення та знайти новий шлях для свого народу."

STR_sun_dance:0 "Танець Сонця"
STR_sun_dance_desc:0 "Щоб засвідчити відданість народу, [STR.GetLeader] виконає Танець Сонця: чотири дні посту й молитви під променями денного світила. Хай це доведе її гідність перед Стендінґ-Роком."

STR_sweat_lodge:0 "Ініпі"
STR_sweat_lodge_desc:0 "[STR.GetLeader] очистить себе в паровій хатині Ініпі перед тим, як заявити про намір очолити Сіу. Вона вийде зцілена – готова служити племені."

STR_supreme_chief:0 "Великий Вождь"
STR_supreme_chief_desc:0 "Від часів Сіттінга Булла Лакота не мали єдиного вождя. Але сьогодні ми знову об'єднали Дакоту та Лакоту. Ми повертаємо свою батьківщину."

STR_historians:0 "Стара Історія для Нового Світу"
STR_historians_desc:0 "Історики з Півночі поширюють брехні, навіяні демонічними впливами Старого Світу. Ми покладемо край їхнім вигадкам та вирішимо, що робити з залишками після наших рейдів."

STR_wade_into_the_missouri:0 "На Південному Березі Мнісосе"
STR_wade_into_the_missouri_desc:0 "Проведемо розвідку південного флангу Річкової Федерації. Наші Орлині Розвідники мають принести нам перевагу заздалегідь."

STR_historians_for_us:0 "Навчені Слуги"
STR_historians_for_us_desc:0 "Історики нібито – хранителі нашого минулого. Ми направимо їхні зусилля на вивчення спадку предків. Хай їхні §3дитячі очі§! врешті побачать істину."

STR_reclaim_the_birthright:0 "Повернути Народжене Право"
STR_reclaim_the_birthright_desc:0 "Чорні Пагорби Дакоти належали нам століттями. США порушили Договір у Ларамі, збудувавши там свої ідоли. Сьогодні ми виправимо помилку та повернемо ріки й гори."

STR_fate_of_mount_rushmore:0 "Доля Гори Шістьох Дідів"
STR_fate_of_mount_rushmore_desc:0 "Тункашила Сакпе Паха – священні для нашого народу. Їхній вигляд – образа. Можливо, час нагадати Півночі, хто тут господар?"

STR_shut_down_saloons:0 "Закрити Салони"
STR_shut_down_saloons_desc:0 "Екалака відома торгівлею та салунами, але алкоголь – отрута, що затьмарює розум. Йому немає місця в наших землях."

STR_confiscate_ranches:0 "Конфіскувати Ранчо"
STR_confiscate_ranches_desc:0 "Ранчо Дакоти родючі та доглянуті. Вони стануть заслуженою винагородою для наших вірних воїнів, які водночас охоронятимуть цей регіон."

STR_sin_bismarck:0 "Потопити Бісмарк"
STR_sin_bismarck_desc:0 "Річкова Ліга хоче контролювати економіку Півночі через порт Бісмарка. Але ця земля – наша. Вони не барони, а грабіжники."

STR_warrior_lodges:0 "Воїнські Братства"
STR_warrior_lodges_desc:0 "Лакота мають традицію воїнських товариств – Сильне Серце, Мовчазні Їдці, Кіт-Фокс. [STR.GetLeader] сприятиме їхньому відродженню."

STR_counting_coup:0 "Відлік Подвигів"
STR_counting_coup_desc:0 "Перемогти ворога – це одне. Але справжня честь – у приниженні його. Доторкнутися до ворога й не вбити – ознака того, що його життя не варте нашого меча."

STR_rifle_carbines:0 "Майстри Стрільби"
STR_rifle_carbines_desc:0 "Ми – одні з перших, хто опанував рушниці на Заході. Цей досвід – запорука нашого виживання. Ми забезпечимо воїнів найкращою зброєю."

STR_song_of_dog:0 "Пісні Переможців"
STR_song_of_dog_desc:0 "«Я йду на війну. Вбиватиму, палитиму, братиму рабів, їстиму людей.» Наші воїни – не бездушні машини, а герої. Наші сусіди стануть як пес під батогом."

STR_hunka:0 "Упорядкування Данини"
STR_hunka_desc:0 "Не можна доїти браміна після того, як його здерли. Данина має бути впорядкована – для стабільності та уроку всім, хто живе під нашим захистом."

STR_motorcycles:0 "Наші Залізні Вершники"
STR_motorcycles_desc:0 "Коні – наші друзі. Та коли ресурси дозволяють, мотоцикл перетне рівнини значно швидше. Наші рейди стануть блискавичними."

STR_lightning_raids:0 "Сункавакан"
STR_lightning_raids_desc:0 "Сункавакан – кінь, наш брат. Ми вберегли їх під час Великої Війни, і вони захищають нас натомість."

STR_holy_dog:0 "Ташунка"
STR_holy_dog_desc:0 "Дехто на сході стверджує, що має зв’язок із Деткло або ще якимись тваринами. Але ніхто не розуміє коней, як ми. Послухай історію нашої першої зустрічі..."

STR_bombs_explosive:0 "Зброя Вакіньян"
STR_bombs_explosive_desc:0 "Вакіньян, Духи Грому, завжди оберігали Лакота. Наші воїни шанують їх, воюючи в їхньому образі та випускаючи грізну силу блискавки з власних душ – як наші великі предки."

STR_naval_designs:0 "Плисти по Мнісосе"
STR_naval_designs_desc:0 "Хоча ми й не річковий народ, ріки – кров континенту. Контролюючи їх, ми зміцнимо свою владу над торгівлею в регіоні."

STR_buffalo_trade:0 "Торгівля Бізонами"
STR_buffalo_trade_desc:0 "Шкури бізонів із наших земель цінуються по всьому Пустку. Від панянок Чикаґо до паладинів Братства й торговців Мемфіса – кожен цінує тепло з наших степів. Настав час перетворити це на прибуток."

STR_building_slots:0 "Піддані Селища"
STR_building_slots_desc:0 "Визнаючи права фермерів і скотарів під нашою охороною, ми дозволимо народу зосередитись на війні й управлінні. У цей час великої бурі вони зрозуміють."

STR_confiscate_guns:0 "Вилучити Озброєння"
STR_confiscate_guns_desc:0 "Підданим не потрібні надлишкові ресурси. Якщо наші воїни жертвують собою, то й інші повинні зробити свій внесок."

STR_mazawakan:0 "Сучасна Мазавакан"
STR_mazawakan_desc:0 "Мазавакан – наші «палиці грому» – дали нам змогу підкорити рівнини. Ми маємо зберегти технологічну перевагу, щоб наші духи не забули нашої хитрості."

STR_fur_trade_expansion:0 "Контроль над Торгівлею Хутром"
STR_fur_trade_expansion_desc:0 "Установивши єдині правила, ми гарантуємо, що кожен, хто полює чи торгує в наших землях, сплатить нам належне. Яке ж це щастя – мати лідера як [STR.GetLeader]!"

STR_naval_bases:0 "Влада над Рікою"
STR_naval_bases_desc:0 "Мало контролювати ліси й степи. Ми збудуємо флот, аби проголосити: Мнісосе – наша ріка."

STR_port_benefit_trade:0 "Вітайте Торговців"
STR_port_benefit_trade_desc:0 "Нема зла в купцеві, що шанує наші звичаї. Якщо данина сплачена вчасно – нехай торгує в нашому Бісмарку."

STR_marshall_republic:0 "Маршал воїнів"
STR_marshall_republic_desc:0 "Республіка Маршал приваблює своєю волелюбністю. Але на відміну від них, ми не лише вільні – ми гідні правити."

STR_masters_of_the_plains:0 "Володарі Рівнин"
STR_masters_of_the_plains_desc:0 "«Коли я був хлопцем, Сіу володіли світом. Сонце сходило й заходило над нашою землею...» – Сіттінг Булл. Сьогодні ми повертаємо своє."

STR_loot_stores:0 "Грабуй Сховища"
STR_loot_stores_desc:0 "Дивина! У Маршалі з'явилась зброя вищого класу. Може, МакАртур їх постачає? Так чи інакше, Старий Світ завжди годує паразитів."

STR_energy_weapons_slaves:0 "Нове Управління"
STR_energy_weapons_slaves_desc:0 "Мешканці Маршалу можуть залишитись. Просто тепер вони працюють не на золотошукачів, а на плем’я, що цінує життя вище прибутку."

STR_local_auxiliaries:0 "Місцеві Союзники"
STR_local_auxiliaries_desc:0 "Ми ніколи не йшли на війну самі. Завжди були племена, готові боротись разом. Час відновити цю традицію."

STR_settler_support:0 "Логістика Поселенців"
STR_settler_support_desc:0 "Колись ми не потребували важкої зброї. Але часи змінились – ми мусимо відповідати викликам із вогнем у серці й сталлю в руках."

STR_mechanized_support:0 "Залізні Вершники"
STR_mechanized_support_desc:0 "Коні – друзі, та машини – знаряддя. Поки є дороги, хай і старі, у них буде застосування."

STR_army_bases:0 "Очистити Військові Бази"
STR_army_bases_desc:0 "У Дакотах не було багато баз Армії США. Тож усе, що лишилось – належить нам. Вони колись були загарбниками, а тепер – наш металобрухт."

STR_sunkas:0 "Сунка"
STR_sunkas_desc:0 "Жоден воїн Лакота не вирушав без свого пса. Наші вірні товариші, розвідники й захисники – зв’язок зі звіром усередині кожного з нас."

STR_warior_ways:0 "Суспільство Воїнів"
STR_warior_ways_desc:0 "Наші юнаки народжені для битви. Хай чужинці орють землю – ми пастимемо стада, пануватимемо над рівнинами й писатимемо сагу перемог."

STR_khan_alliances:0 "Союз за Зручністю"
STR_khan_alliances_desc:0 "Хани – ще одне плем’я з Пустки, вигнане Каліфорнійським Урядом. Можливо, наші цілі співпадають..."

STR_dakotas:0 "Верховенство в Дакотах"
STR_dakotas_desc:0 "Колись усі Дакоти платили нам данину. Чому б не вимагати плату за наш мир і порядок знову?"

STR_montanas:0 "Влада над Монтаною"
STR_montanas_desc:0 "Монтана – наші старі землі. А хто такі Анклав і Братство, щоб вважати їх своїми? Вони не гідні навіть попелу на нашій землі."

STR_manitoba:0 "Погляд на Манітобу"
STR_manitoba_desc:0 "Ми колись кочували Манітобою. Тепер її захоплюють нові «рівні» тирани. Час знову утвердити нашу присутність."

STR_reopen_mines:0 "Відкрити Шахти"
STR_reopen_mines_desc:0 "У нас чимало підданих, охочих копати заради багатства. Хай копають – ми перевіримо, що залишилось під землею наших предків."

STR_timber_lake:0 "Пити з Тімбер-Лейку"
STR_timber_lake_desc:0 "Тімбер-Лейк – серце наших земель, з лісами й врожайними полями. Ідеальне місце для відпочинку вершників і напування стад."

STR_destroy_mount_rushmore:0 "Знищити Маунт-Рашмор"
STR_destroy_mount_rushmore_desc:0 "Ми ніколи не визнавали цієї руїни. Тепер, коли вона наша, час покласти край суперечкам. Це закріпить [STR.GetLeader] як справжнього вождя Стендінґ-Року."

STR_circuitry_salvage:0 "Видобути Схеми"
STR_circuitry_salvage_desc:0 "Північна Співдружність не була індустріальною столицею, та її багатство – у людях і землі. Багато залишилось – і ми це знайдемо."

STR_fuel_refineries:0 "Вугілля для Морозу"
STR_fuel_refineries_desc:0 "Ми не копатимемо самі, та багатства землі не можна ігнорувати. Вогонь, що залишив нам Великий Бог – це наш ресурс. Час його використати."

MCA_loot:0 "Награбоване в МакАртура"
MCA_loot_desc:0 "Анклав каже, що повернеться, як повернулись Лакота. Побачимо. Тим часом, їхня зброя стане запорукою наших нових перемог."

STR_naval_bases_2:0 "Подорож вниз по Ріці"
STR_naval_bases_2_desc:0 "Тепер, коли Мнісосе під нашим контролем, ми збудуємо порти для каное й бойових човнів. Підготуємось до нових вторгнень."

STR_brotherhood_slaves:0 "Слуги Братства"
STR_brotherhood_slaves_desc:0 "Братство сиділо й мовчало, поки світ вмирав. Їхня технологія – для нас. Хай їхні вчені служать нашому племені."
