l_english:
generic.170.t:0 "[From.GetName] підхопив Вірус"
generic.170.d:0 "[From.GetRank] [From.GetName] страждає від fork bomb через помилку в [From.GetHerHis] програмуванні; [From.GetSheHe] не зможе запускати нові бойові процеси, поки не завершить повне перезавантаження. Ми підозрюємо, що через несприятливий клімат у зоні дій [From.GetHerHis] схеми були пошкоджені конденсацією, що й спричинило збій. Дивно, але помилки посилилися після того, як невідомий технік на ім’я "Тодд" провів ремонт – заявивши, що робот тепер "просто працює"."
generic.170.a:0 "А ви пробували вимкнути й увімкнути?"

generic.180.t:0 "[From.GetName] Критично Пошкоджений"
generic.180.d:0 "Після затяжного бою [From.GetRank] [From.GetName] повернувся до табору з серйозними ушкодженнями. Багато з [From.GetHerHis] критичних компонентів вийшли з ладу, а структурна цілісність корпусу знаходиться на межі. [From.GetName] пощастило повернутись у працездатному стані, але тепер [From.GetSheHe] потребує серйозного ремонту, перш ніж зможе знову діяти на повну силу."
generic.180.a:0 "Оце так пошкодження!"

helper_events.1.title:0 "[FROM.GetName] Вимагає Територію!"
helper_events.1.desc:0 "[FROM.GetName] має нахабство вимагати в нас територію! Як діяти далі? Чи придушити їхні жалюгідні амбіції негайно, чи поступитись, щоби виграти час – і знищити їх остаточно? §RМи повинні прийняти рішення негайно, бо мовчання вони можуть сприйняти як неповагу – і тоді ініціативу втрачено.§!"
helper_events.1.a:0 "Ми з цим розберемось."

helper_events.2.title:0 "[FROM.GetName] Поступається Територією!"
helper_events.2.desc:0 "Після нашого ультиматуму, [FROM.GetLeader] з [FROM.GetName] виявив мудрість і погодився з нашими вимогами. [FROM.GetAdjective] війська відійшли від кордону, і наші солдати зайняли спірну територію.\n\nСитуація на кордоні лишається напруженою, але війни вдалося уникнути... поки що."
helper_events.2.a:0 "Відмінно!"

helper_events.3.title:0 "[FROM.FROM.GetName] Відкидає Ультиматум!"
helper_events.3.desc:0 "Дурні з [FROM.FROM.GetName] відмовились віддати нашу законну територію! Схоже, доведеться виконати обіцяне в ультиматумі."
helper_events.3.a:0 "Тоді – війна."

generic.26.t:0 "[From.GetName] Підсів на Хімію"
generic.26.d:0 "[From.GetRank] [From.GetName] вживав хімікати, щоби виграти війну для нас, але тепер це дається взнаки. [From.GetName] неадекватний: у нього параноїдальні марення, він удає, що страждає. Це сумно, але ще гірше – це впливає на його здатність керувати армією. Можливо, це доводить, що [From.GetRank] [From.GetName] мав би довіритись бойовому духу нашого народу.\n\nЖартуємо – ми дамо йому трохи "Фіксера", а з психологічною травмою він якось розбереться пізніше."
generic.26.a:0 "Може, ще джету йому?"
generic.26.a_tt:0 "\n§OЯк не крути, але деякі переможці й справді вживають хімію.§!"
