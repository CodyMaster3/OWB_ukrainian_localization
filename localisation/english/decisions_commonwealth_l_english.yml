northern_spawn:0 "§4Створити Північну Співдружність§!\n\nВимагає контроль над такими регіонами:\n   -[COM_commonwealth_montana_taken]\n   -[COM_commonwealth_wyoming_taken]\n   -[COM_commonwealth_northdakota_taken]\n   -[COM_commonwealth_southdakota_taken]\n[COM_commonwealth_northern_founded]"

