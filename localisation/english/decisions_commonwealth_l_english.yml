l_english:
commonwealth_decisions_category:0 "§4Співдружності§!"
commonwealth_decisions_category_desc:0 "До Великої Війни Америка була поділена на 13 великих Співдружностей. Хоча більшість мешканців нового світу про них уже й не пам’ятають, ностальгія за давно втраченими днями веде нашу руку.\n\nМожливо, межі цих регіонів стали дещо туманними, і ми, звісно, не бачимо жодних книжок про одну з них у Мексиці. Та все ж – створення нових органів управління для цих регіонів буде значно зручнішим, аніж пряма адміністрація."

northwestern_spawn:0 "§4Створити Північно-Західну Співдружність§!\n\nВимагає контроль над такими регіонами:\n   -[COM_commonwealth_washington_taken]\n   -[COM_commonwealth_oregon_taken]\n   -[COM_commonwealth_idaho_taken]\n[COM_commonwealth_northwest_founded]"

four_states_spawn:0 "§4Створити Співдружність Чотирьох Штатів§!\n\nВимагає контроль над такими регіонами:\n   -[COM_commonwealth_utah_taken]\n   -[COM_commonwealth_arizona_taken]\n   -[COM_commonwealth_newmexico_taken]\n   -[COM_commonwealth_colorado_taken]\n[COM_commonwealth_fourstates_founded]"

texan_spawn:0 "§4Створити Техаську Співдружність§!\n\nВимагає контроль над такими регіонами:\n   -[COM_commonwealth_texas_taken]\n   -[COM_commonwealth_oklahoma_taken]\n   -[COM_commonwealth_louisana_taken]\n[COM_commonwealth_texan_founded]"

