l_english:
strong_trait:0 "Силач"
strong_trait_desc:0 "Цей ватажок – вершина харчового ланцюга Пустки. Його м’язи здатні на такі подвиги, що кожен удар – це майже артилерійський постріл. І ця фізична міць напряму трансформується в бойову перевагу."

rooted_trait:0 "Вкорінений"
rooted_trait_desc:0 "Ви – частково дерево! Відступ? Що це взагалі за слово? Ви обираєте позицію, вкорінюєтесь – і тоді кожен дурень, що викличе вас на бій, буде жалкувати про це до свого останнього стогону."

pain_train_trait:0 "Потяг Болю"
pain_train_trait_desc:0 "Чух-чух! Усі на борт! Перетворити силову броню на таран? Геніальна ідея! Тепер ви будете протоптувати ворогів, мов рейки. Ваш важкий силует, що мчить просто на них, сам по собі вже деморалізує."

strong_back_trait:0 "Сильна Спина"
strong_back_trait_desc:0 "Ви що, наполовину мула? Сильна спина – найкращий друг для будь-якого збирача луту. Дозволяє тягнути більше добра, довше блукати Пусткою й нести все, що треба для торгівлі, бою або вечері!"

perceptive_trait:0 "Спостережливий"
perceptive_trait_desc:0 "Чи то інтуїція, чи досвід, чи виняткові почуття – цей лідер бачить те, що інші оминають. І знає, куди вдарити."

awareness_trait:0 "Уважний"
awareness_trait_desc:0 "Хочете знати більше про ворога? Цей перк – для вас. Завдяки йому ви швидко визначаєте слабкі місця ворога й б’єте точно туди, де болить."

sniper_trait:0 "Снайпер"
sniper_trait_desc:0 "Усе залежить від концентрації. І ви маєте її в надлишку. З таким перком ви зможете збити пляшку з саспаріллою через усе поле бою – і навіть не зіпсувати кришку."

night_person_trait:0 "Нічна Особа"
night_person_trait_desc:0 "Ви доказ того, що вампіри не блищать. Істота ночі, що сяє, коли інші сплять. Під місячним сяйвом ваша спостережливість і тактичне чуття виходять на новий рівень."

enduring_trait:0 "Витривалий"
enduring_trait_desc:0 "Деякі виживають там, де інші ламаються. Цей ватажок – один із них. Витривалість, стійкість і здатність діяти у ворожому середовищі – ось його кредо."

survivalist_trait:0 "Майстер Виживання"
survivalist_trait_desc:0 "Ви – господар дикої природи. Цей перк дозволяє адаптуватись навіть у найворожіших умовах. Жоден клімат, радіація чи отруйний газ не стануть на заваді."

life_giver_trait:0 "Джерело Життя"
life_giver_trait_desc:0 "Ви випромінюєте здоров’я. Просто стоячи поруч із вами, мешканці Пустки менше втомлюються й довше живуть. Чудово, чи не так?"

aqua_boy_trait:0 "Хлопець/Дівчина Води"
aqua_boy_trait_desc:0 "Вода – ваш союзник. А Пустка має її більше, ніж здається. Ви не тільки не боїтесь водних боїв, а й можете ефективно атакувати прибережні укріплення. І це вражає."

charismatic_trait:0 "Харизматичний"
charismatic_trait_desc:0 "Ви завжди в центрі уваги – і солдати вас обожнюють. Керуєте не через звання, а через повагу. Тож робота йде швидше, бо всі хочуть бути поруч із вами."

local_leader_trait:0 "Лідер Спільноти"
local_leader_trait_desc:0 "Ви – голос, до якого дослухаються. Люди йдуть за вами, бо вірять. І кожного дня до вас приєднується все більше послідовників. Що робити з їхньою вірою – вирішувати вам."

animal_friend_trait:0 "Друг Тварин"
animal_friend_trait_desc:0 "Говоріть з тваринами! Завдяки цьому перку навіть мутовані кроти-вовки стануть вашими товаришами. З такими друзями ви ніколи не залишитесь голодними – або без охорони."

inspirational_trait:0 "Натхненний"
inspirational_trait_desc:0 "Усі хочуть бути такими, як ви. Ви ведете прикладом – і ваші люди вчаться битися краще, швидше, жорсткіше. Особливо, якщо це ціла армія, яка дихає вашою впевненістю в перемозі."

intelligent_trait:0 "Інтелектуал"
intelligent_trait_desc:0 "Справжні тактики – рідкість у світі без військової освіти. Але цей ватажок – виняток. Його кмітливість і стратегічне мислення – втілення довоєнного військового генія."

gun_nut_trait:0 "Зброєман"
gun_nut_trait_desc:0 "Вогнепали для вас – як друга матір. Ваша одержимість зброєю дала вам неабиякі знання та вправність. Ви знаєте, яку пушку коли дістати – і куди з неї влучити."

robotics_expert_trait:0 "Експерт з робототехніки"
robotics_expert_trait_desc:0 "Машини мають служити людині – якщо вам є що сказати з цього приводу. Завдяки вашому вмінню ламати код будь-який робот або стане частиною вашого сталевого легіону, або перетвориться на запасні частини."

nerd_rage_trait:0 "Лють Ботана"
nerd_rage_trait_desc:0 "Геніальність. У. ЛЮТІ! Вас досить цькували – тепер ви організовуєте наступні маневри з такою злістю, що вас боїться сам Ватс. Жоден хуліган більше не сміється."

agile_trait:0 "Спритний"
agile_trait_desc:0 "Зростаючи в жорстокому світі, ви навчилися виживати, а не героїчно гинути. Ваші бійці міцні, витривалі й швидкі, як ви самі. І це – їхній квиток до наступного дня."

gunslinger_trait:0 "Стрілець"
gunslinger_trait_desc:0 "Канонічний дух Дикого Заходу! Швидка рука, точне око – і жоден покидьок не зіпсує спокою, доки ви на варті."

lead_foot_trait:0 "Свинець на педалі"
lead_foot_trait_desc:0 "За кермом ви – смерть на колесах. Ваші рефлекси та досвід роблять з вас ідеального інструктора з бойових машин: тисни газ і стріляй навмання!"

ninja_trait:0 "Ніндзя"
ninja_trait_desc:0 "Ви – тінь. Уночі ваша перевага сягає апогею, а вдень – ваша інтуїція та підозріливість працюють не гірше за радар."

lucky_trait:0 "Щасливчик"
lucky_trait_desc:0 "Удача – річ невловима. Але у вас вона є. Бійці з вами вірять, що навіть під радіаційною бурею їм пощастить знайти пляшку чистої води. І знаходять."

idiot_savant_trait:0 "Ідіот-Савант"
idiot_savant_trait_desc:0 "Ви не дурень! Просто... інакший. Ви бачите те, що інші ігнорують. І доки інші витрачають час на роздуми – ви вже в центрі дії, витягуючи з Пустки те, що справді цінне."

mysterious_stranger_trait:0 "Таємничий Незнайомець"
mysterious_stranger_trait_desc:0 "Що це за силует на обрії? З вами – особистий янгол-охоронець зі .44 Магнумом, що з'являється в найтемніші миті... і залишає по собі лише дим."

bloody_mess_trait:0 "Кривава Бійня"
bloody_mess_trait_desc:0 "Обережно – летять очні яблука! Вороги вибухають у кривавих вибриках кишок і веселощів. І хоч організація вашої армії залишає бажати кращого – вони ЗНАХОДЯТЬ справжнє задоволення в м’ясорубці."

savage_leader_trait:0 "Дикий Ватажок"
savage_leader_trait_desc:0 "Сильні мають вести слабких. А ви – сильний, безсумнівно. Ваша жорстокість – і сила, і прокляття, але опір перед вами тане, як мутант під плазмою."

observant_leader_trait:0 "Спостережливий Ватажок"
observant_leader_trait_desc:0 "Хто повільно йде – той далеко зайде. Ви бачите більше, ніж більшість, і ведете армію до перемоги крок за кроком. Може й повільно, але впевнено."

tough_leader_trait:0 "Стійкий Ватажок"
tough_leader_trait_desc:0 "Ви знаєте, як вистояти. І ваші люди вчаться у вас. Завдяки вашій твердості армія тримається краще, довше і не відступає без бою."

loved_leader_trait:0 "Улюблений Ватажок"
loved_leader_trait_desc:0 "Ваша армія обожнює вас. Ви – щось більше, ніж лідер. Ви – легенда, до якої вони готові молитись. І захищатимуть вас ціною власного життя."

cunning_leader_trait:0 "Хитрий Ватажок"
cunning_leader_trait_desc:0 "Ці речі вимагають часу. Ви майстер інтриг, стратег, що мислить на місяці вперед. Хоч інші й не розуміють ваших планів – ви знаєте: перемога буде за вами."

nimble_leader_trait:0 "Вертконогий Ватажок"
nimble_leader_trait_desc:0 "Ви легко вислизаєте з пасток і засідок. І хоч деякі називають вас боягузом, ви знаєте: головне – вижити й повернутись із підкріпленням."

fortunate_leader_trait:0 "Везучий Ватажок"
fortunate_leader_trait_desc:0 "Пані Удача завжди на вашому боці. Ваші солдати постійно знаходять припаси, іноді навіть там, де, здавалося б, тільки порожні пляшки і зіпсоване м’ясо радскорпіона."

flexible_trait:0 "Гнучкий"
flexible_trait_desc:0 "Тільки-но зміни – ви вже підлаштувалися. Роки планування, навчань і симуляцій зробили ваші стратегії надзвичайно адаптивними. Нові обставини? Новий план – миттєво."

negotiator_trait:0 "Перемовник"
negotiator_trait_desc:0 "Вам вдається згладжувати его з тією ж легкістю, з якою інші дихають. Ви можете виторгувати все – від набоїв до цілих територій. І, найважливіше, вийти з будь-якої халепи, навіть військової операції."

cult_of_personality_trait:0 "Культ Особистості"
cult_of_personality_trait_desc:0 "Ваша харизма – майже диявольська. Неважливо, хто перед вами – після розмови всі впевнені: ви найкраща людина в кімнаті. Хто може вам опиратись?"

smooth_talker_trait:0 "Красномовець"
smooth_talker_trait_desc:0 "Ваш голос – як лак на дереві. Ви завжди знаєте, що сказати, аби заспокоїти ситуацію, і виглядаєте впевнено, навіть якщо все летить до біса."

ferocious_loyalty_trait:0 "Шалена Вірність"
ferocious_loyalty_trait_desc:0 "Ваша харизма надихає на фанатичну відданість. Скажете «Йти!» – і солдати запитають: «Наскільки далеко?» Скажете «Стріляй!» – «Скільки саме?» Така армія – страшна сила."

vigilant_recycler_trait:0 "Пильний Переробник"
vigilant_recycler_trait_desc:0 "Не марнуй – не потребуватимеш. Ви знаєте ціну навіть обгорілому запалу чи брудній кришці з-під пива. І кожна річ у вас знаходить нове застосування."

junk_rounds_trait:0 "Патрони з Брухту"
junk_rounds_trait_desc:0 "Якщо пістолет тріщить – значить, працює! Вам не важливо, з чого стріляєш – головне, щоб летіло. .50-мікс у банках з-під бобів? Глушник з рами холодильника? «Воно працює!»"

melee_hacker_trait:0 "Рубака"
melee_hacker_trait_desc:0 "Злам – не лише для очкариків! Ви любите рубати, шматувати і трощити. І не важливо, чим – ножем, трубою, чи просто кулаком. Все, що залишиться – червоний туман."

light_touch_trait:0 "Легка Хода"
light_touch_trait_desc:0 "Будь-що може стати бронею, якщо вистачає хоробрості. Без силової броні, без машин – лише Мед-X, пістолет і сталеві нерви. І цього вам вистачає з головою."

heavyweight_trait:0 "Тяжковаговик"
heavyweight_trait_desc:0 "Сила – закон! Тридцять три тонни сталі жадають вітання ворогам. І вам це подобається. Ви стоїте в центрі бою, поки кулі дзвенять об броню, а земля здригається від вашого кроку."

fight_the_power_trait:0 "Проти Системи"
fight_the_power_trait_desc:0 "Що моє – те моє! Ви не здаєтесь і не відступаєте. Якщо хтось посміє відібрати здобич – отримає кулю між очей і лопатку в живіт."

sneering_imperialist_trait:0 "Погордий Імперіаліст"
sneering_imperialist_trait_desc:0 "Дикуни... Як же вони дратують, граючись у «державність» у дворі старої Америки. Але настав час нагадати їм, хто справжній господар – завдяки тактиці, техніці й великій дозі презирства."

# Опис для нових expert traits
trait_mountaineer_II:0 "Експерт з Гір"
trait_mountaineer_II_desc:0 "Ви знаєте кожен перевал, кожну скелю. Ворог може йти, але не підніметься."

hill_fighter_II:0 "Майстер пагорбів"
hill_fighter_II_desc:0 "Пагорби – це ваші бастіони. Ви пануєте над висотами."

swamp_fox_II:0 "Троль Болот"
swamp_fox_II_desc:0 "Болота не сповільнюють вас – вони вас укривають. І глибоко затягують ворогів."

desert_fox_II:0 "Хитрий Пісочний Лис"
desert_fox_II_desc:0 "Пустеля – ваш рідний дім. Там, де вороги гинуть від спеки, ви розквітаєте."

urban_assault_specialist_II:0 "Експерт Вуличного Бою"
urban_assault_specialist_II_desc:0 "Вулиці – ваше поле бою. Бої в руїнах – ваш стиль."

ranger_II:0 "Лісник"
ranger_II_desc:0 "Ви зливаєтесь із деревами, як дух. Ліси не мають для вас таємниць."

jungle_rat_II:0 "Джунглевий Щур"
jungle_rat_II_desc:0 "У хащах ви – хижак, що чатує. А вороги – здобич."

winter_specialist_II:0 "Володар Зими"
winter_specialist_II_desc:0 "Сніг вам до колін, мороз вам друг. Зима – ваша стихія."

rad_rat:0 "Учень Радіації"
rad_rat_desc:0 "Радіація вас не лякає – ви в ній народились, і з нею живете."

rad_rat_II:0 "Майстер Радіації"
rad_rat_II_desc:0 "Ви не просто виживаєте – ви керуєте урановим жахом. Радіація вас годує."

air_force_liaison:0 "Зв’язківець з Авіацією"
air_force_liaison_desc:0 "Гарні стосунки з пілотами – ключ до повітряної переваги. І ви знаєте, як їх налагодити."

big:0 "В Е Л И К И Й"
big_desc:0 "Ніхто не питає, чому ви такий. Всі просто розступаються."

jim:0 "Д Ж И М"
jim_desc:0 "Без опису. Тільки Джим."

best_pony:0 "Найкращий Поні"
best_pony_desc:0 "\"Я просто хотів, щоб Брейберн був у грі, бо він мій улюблений. Він – мій камінь, тому й має 20 захисту.\" – Шаддерфлай"

# NCR Traits
brahmin_baron_trait:0 "Барон Брамін"
brahmin_baron_trait_desc:0 "Браміни, багатство, вплив. Ви знаєте, як користуватись і тим, і іншим."

# BOS Traits
bunker_kid_trait:0 "Дитя Бункера"
bunker_kid_trait_desc:0 "Ви виросли за товстими дверима. І хоча сонце вам незнайоме, технології – ваші рідні брати."

# Mutant Tribal Traits
feral_kid_trait:0 "Дике Дитя"
feral_kid_trait_desc:0 "Жодного виховання. Лише інстинкти. І кігті."

vat_skin_trait:0 "Шкура з Ват"
vat_skin_trait_desc:0 "Печі модифікації змінили вас назавжди. Ви не мутант – ви вершина ланцюга."

ham_fisted_trait:0 "Кулак-Шинка"
ham_fisted_trait_desc:0 "Ніжність не про вас. Все вирішується одним ударом. Часто – вирішально."

glowing_one_trait:0 "Світлячок"
glowing_one_trait_desc:0 "Ви світитесь. Буквально. Ворогів обпалює, союзників гріє – а ще це трохи красиво."

cannibal_trait:0 "Канібал"
cannibal_trait_desc:0 "У Пустці вибір невеликий. Їсти або бути з’їденим. Ви обрали перше. Але якщо вас за цим спіймають – можуть бути... наслідки."

# Civilized and advanced
expert_excrement_expeditor_trait:0 "Експерт з Екскрементів"
expert_excrement_expeditor_trait_desc:0 "Не кожен може ефективно управляти какашками. Але ви – майстер. Перетворюєте відходи в ресурс, гній у прибуток, і навіть гази – на підривну силу."

tight_nuts_trait:0 "Круті Гайки"
tight_nuts_trait_desc:0 "Ваші механізми ніколи не розваляться. Бо гайки – як ваш підхід до справ: затягнені до тріску. Надійність – ваше друге ім’я."

tech_wizard_trait:0 "Техномаг"
tech_wizard_trait_desc:0 "Для вас мікросхема – як закляття. Ви можете оживити будь-який механізм, вдихнути душу в старий сервопривід. Чудеса технології – ваша стихія."

commando_trait:0 "Коммандо"
commando_trait_desc:0 "Червоний берет – це не просто стиль. Це обітниця смерті. Ваша бойова підготовка бездоганна, а вороги не встигають навіть покаятись."

targeting_computer_trait:0 "Бойовий Комп'ютер"
targeting_computer_trait_desc:0 "Мозок як процесор, зір як приціл. Ви обчислюєте траєкторію смерті за секунду, і кожна куля – у ціль."

# Vehicle Traits – якщо будуть додані, адаптую

# Generic Traits
hot_blooded_trait:0 "Гарячий Характер"
hot_blooded_trait_desc:0 "Ваше терпіння коротше, ніж бойова черга з .45. Гарячий темперамент змушує вас діяти швидше – не завжди розумніше, зате завжди з драйвом."

hoarder_trait:0 "Плюгавий Хом’як"
hoarder_trait_desc:0 "Тринадцять каструль, дві зламані лопатки вентилятора і чотири банки... навіщо? Бо колись згодиться. Ви збираєте все, і як показує досвід – це іноді рятує життя."

built_to_destroy_trait:0 "Призначений Руйнувати"
built_to_destroy_trait_desc:0 "Кожна річ, якою ви торкаєтесь, або вибухає, або ламається, або стає зброєю. Ви не творите – ви лишаєте згарище."

chem_reliant:0 "Хімозалежний"
chem_reliant_desc:0 "Без хіміків – ніяк. Ви б воювали, але без бафауту не той настрій. Проблема лише в одному – вам потрібно все більше... і більше..."

fast_metabolism:0 "Швидкий Обмін"
fast_metabolism_desc:0 "Організм – як двигун. Ви швидко відновлюєтесь, швидко згораєте, швидко... потребуєте ще їжі. І хімії. І води."

skilled_trait:0 "Майстер на Все"
skilled_trait_desc:0 "У вас завжди є план. І запасний план. І ще один на випадок, якщо все піде до біса. Руки золоті, голова працює, а бійці – вірять."

bruiser_trait:0 "Кабан"
bruiser_trait_desc:0 "Повільний, зате як бахне... Удар – як бетонна колона з розгону. Ви не бігаєте – ви йдете, і земля під ногами тріщить."

fast_shot_trait:0 "Швидкострілець"
fast_shot_trait_desc:0 "Ви не ціляєте – ви випереджаєте. Сім куль за секунду – це ваш стиль. А що не влучить, те змусить ворога тікати."

finesse_trait:0 "Тонка Робота"
finesse_trait_desc:0 "Ви не рубите з плеча – ви вирізаєте серце з точністю хірурга. Ваша війна – витончене мистецтво."

reckless_trait:0 "Безбашений"
reckless_trait_desc:0 "«Без страху і сумління» – ось ваш девіз. Вас не зупинити, і дуже важко вижити після вашого наступу. Навіть своїм."

exhausted_order_trait:0 "Виснажений"
exhausted_order_trait_desc:0 "Був би хтось інший – він здався б. Ви ще тримаєтесь. Але кожна команда віддається ціною – і ви це знаєте."

camouflage_trait:0 "Майстер Маскування"
camouflage_trait_desc:0 "Де він?! – питають вороги. А ви вже за спиною, ніж у руці. Навіть в ядерних руїнах знайдете, де сховатись."

lone_wolf_trait:0 "Один В Полі"
lone_wolf_trait_desc:0 "Ви не потребуєте зграї. Самотній вовк – смертельно небезпечний. Особливо коли тиша стає вашою союзницею."

xenotech_expert_trait:0 "Знавця Ксенотехнологій"
xenotech_expert_trait_desc:0 "Кнопки без підпису? НЛО з гарматами? Вам байдуже. Ви не просто це розумієте – ви це використовуєте."

fortune_finder_trait:0 "Шукач Вдачі"
fortune_finder_trait_desc:0 "Де інші бачать пил і руїни, ви бачите скарби. Ваші люди знаходять скрині, ящики, запаси і... часом навіть щось корисне."

virus:0 "Вірус"
virus_desc:0 "Цей суб’єкт – не просто заражений. Він заражає все навколо: інформацію, людей, системи. Він – живий баг. І проблема."

# Унікальні
conqueror:0 "Завойовник"
conqueror_desc:0 "Ви не просто воюєте – ви змінюєте карту. Місця, куди ви заходите, більше не належать іншим."

pyromaniac_trait:0 "Піроманіяк"
pyromaniac_trait_desc:0 "Немає нічого прекраснішого за полум’я. І ніщо не гріє серце так, як палаючий табір ворогів. Ви не спалюєте мости – ви їх підриваєте."

# NCE
ranger_trait:0 "Рейнджер"
ranger_trait_desc:0 "Ветеран пустки, тінь у лісі, постріл із-за хребта. Рейнджер завжди бачить першим, стріляє точніше і виживає довше."

### Tooltips
agile_movement_bonus_on_land_tt:0 "Бонус до швидкості пересування: §G+5.0%§!"

#####
use_jet:0 "Прийняти Джет"
ABILITY_USE_JET:0 "Прийняти Джет"
ABILITY_USE_JET_DESC:0 "Багато брамінього лайна, трохи гнилизни й геніальна ідея – і от маємо Джет. Дає копняка – і то доброго. Щоправда, трохи токсично."

ABILITY_USE_MENTAT:0 "Прийняти Ментати"
ABILITY_USE_MENTAT_DESC:0 "Старий добрий стимул для творчих і розумних. Збільшує Перцепцію, допомагає міркувати, чарує при розмові і покращує влучність."

ABILITY_USE_BUFFOUT:0 "Прийняти Баффаут"
ABILITY_USE_BUFFOUT_DESC:0 "Стероїди. Потужні. Дуже. Стаєш сильнішим, витривалішим, швидшим. Потім ще більше хочеш. Іще..."

ABILITY_USE_PSYCHO:0 "Прийняти Псайко"
ABILITY_USE_PSYCHO_DESC:0 "Розроблений армією США, щоб зробити з солдатів ходячі танки. Підвищує силу і зменшує біль. Але триває недовго... \n\nВимагає §l1 хімікату§!."

addicted:0 "Залежний"
addicted_desc:0 "Ви підсів. Тіло хоче ще. І без нього воює гірше. Але ж так добре..."

ABILITY_USE_FATMAN:0 "Вистрілити з Фетмена"
ABILILTY_USE_FATMAN_DESC:0 "Найнебезпечніша іграшка в руці людини. Фетмен запускає ядерну бомбу з плеча. Лише не впусти її."

USE_ARTILLERY:0 "Розгорнути Артилерію"
USE_ARTILLERY_DESC:0 "Старі гармати важко транспортувати, зате вони можуть змінити перебіг битви. Але після їхньої розгортки відступити буде непросто."
