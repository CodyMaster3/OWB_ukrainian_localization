nf_chc.1.title:0 "П’ята з-поміж них"
nf_chc.1.desc:0 "Коли атомна енергія процвітала, з нею розквітала і зацікавленість у межах смертності. Експерименти Хору були довоєнним дослідженням, спрямованим на розблокування прихованих сил людського розуму і тіла. Людям із музичними здібностями та дітям із вадами пропонували шанс на життя, яке виходить за межі звичного. \n\nБагато хто приєднувався, щоби допомогти науковцям у досягненні їхньої кінцевої мети – розробці новітніх методів лікування. Адже якби вдалося відкрити потаємний потенціал людського тіла, це могло б стати ключем до зцілення найстрашніших хвороб. Інші шукали можливість жити знову. А решта...? З різних причин їхня участь залишалася сумнівною – неофіційною, м’яко кажучи. #0005 належала саме до цієї останньої групи. \n\nВі (ім’я, взяте з римського числа на підлозі її камери) провела більшість життя лише як цифра – результат, зноска у звітах та статтях. Вона забула власне ім’я, не кажучи вже про обличчя батьків. Люди приходили й ішли. Різні руки тримали її, вели по різних місцях – всюди стерильні кімнати і білі халати. І хоча світ у її очах був наповнений барвами, тиша переслідувала її, мов привид. Лише у віці восьми років вона вперше зустріла таких самих, як вона.\n\nБільшість часу з людьми в білих халатах минала у безконечних аналізах та експериментах. Її поміщали до камер, підключали до трубок – занурювали в газ чи сяючу рідину. Перед нею ставили вази і келихи, змушували співати доти, поки скло не тріскалося. Виснажливі випробування доводили її до запаморочення, як і багатьох її однолітків. Багато хто так і не прокинувся. \n\nТому вільний час вона цінувала понад усе. Вона ховалася в єдиній книжці, що мала – великому томі з поезією. Але коли очі втомлювалися від читання, Ві захоплювалася..."
nf_chc.1.a:0 "Тим, що вбивала комах."
nf_chc.1.b:0 "Тим, що розповідала брехні."

nf_chc.2.title:0 "Атомне спасіння"
nf_chc.2.desc:0 "Наше спільне страждання, здавалося, тривало вічність. Безкінечне колупання, тести, експерименти – усе це виснажувало нашу волю до життя. Наш розум було спотворено – ми стали злими, нестабільними, кровожерливими. \n\nТа смерть не була нашою долею. У день нашого спасіння потужний вибух струснув стіни комплексу – і невдовзі будівля затремтіла, мов живий організм! Науковці й персонал кинулися до аварійних виходів, коли зі стелі посипалися уламки, а прилади падали додолу. Потужна хвиля руйнування звільнила нас із кайданів і знищила апарати, що стримували наші голоси! Різанина була стрімкою: псайкери розривали всіх, хто не встиг утекти. А ті, хто дістався поверхні, загинули від свіжої радіації, що вже накрила світ.\n\nНе минуло й години, як повстання завершилось – і ми залишилися єдиними господарями швидко розвалюваного дому. Східне крило от-от мало завалитися, але ми могли врятувати щось одне – або медчастину, або лабораторію матеріалів."
nf_chc.2.a:0 "Ми обрали медицину."
nf_chc.2.b:0 "Ми обрали обладнання."

nf_chc.3.title:0 "Одержимі"
nf_chc.3.desc:0 "Здобувши свободу у зруйнованому світі, ми зіткнулися з потребою виживати. Нас було всього з шістдесят – але всі мали психічні здібності, тож ми могли впливати на довколишній світ. Швидко й (здебільшого) безболісно ми навчилися підкоряти собі звичайних мешканців пустки – робити з них слухняних, бездумних рабів. З цього моменту почалося «жниво». Дуже скоро ми мали сотні працівників. І тепер настав час поставити їх до роботи. Першому поколінню рабів ми наказали..."
nf_chc.3.a:0 "Відновити залишки інфраструктури."
nf_chc.3.b:0 "Зібрати ще більше працівників."

nf_chc.4.title:0 "Перша висока нота"
nf_chc.4.desc:0 "Коли Хор вийшов на поверхню, у новий світ, він виявив – не всі привиди експерименту загинули. Все почалося з шепоту в коридорах. Злісного стогону і пророцтв, яких не можна збагнути. Лише обговоривши свої переживання, вони зрозуміли: це не була уява. Це була реальна присутність.\n\nЦелестіна назвала її «поганим знаменням». У кожному солодкуватому шепоті вона чула приховану погрозу, масковану під материнську ласку.\n\nДон злякалась. Поки вона займалась лікуванням тварин, голос велів їй убивати.\n\nОмма була байдужа. Голос її не турбував. Вона навіть відзначила, що той має душу, споріднену з її власною.\n\nМорґана вбачала в цьому шанс на велич. Голос обіцяв майбутнє, де Хор житиме у замках, а гала-вечори не припинятимуться.\n\nЛісандер назвав її «Матір’ю» – і ця назва прижилася. Він казав, що це був перший загублений голос, і що її варто поважати.\n\nІ хоча в Хорі точилися суперечки, найближчою до голосу була Ві. Для неї він був гучним, ясним. Вона знала його справжнє ім’я і справжню мету."
nf_chc.4.a:0 "Гнила Мати – це дух, що жадає вийти у світ."

nf_chc.8.title:0 "Засідання Психічної Ради"
nf_chc.8.desc:0 "У полудень, коли пробив дзвін, тиша наповнила коридори комплексу, й Хор зібрався. Останні кілька засідань тягнулися болісно, завершуючись вибухами роздратування. З кожним днем досягти компромісу ставало все важче. Що робити з Матір’ю – рішення мало бути однозначним, і Ві вже визначилась.\n\nХористи обмінялися люб’язностями – поглядами, усмішками, кивками – перед тим як зібратись навколо воєнного столу. Пісня астрального палацу наростала з кожним акордом і баритоном. Під ногами розквітали пастельні паперові фігури, мов орігамі, розстилаючись уздовж стін, колон і здіймаючись до стелі. Легкий вітерець пронісся крізь неіснуюче вікно, приносячи з собою смак вранішньої роси.\n\nКоли їхні свідомості закінчили формувати кімнату відповідно до спільної уяви, Ві вийшла наперед.\n\n“Це буде останнє засідання щодо Мами,” – почала вона, її впевненість викликала підняті брови. “Я зважила всі варіанти й вирішила. Подобається вам чи ні – це не має значення. Ми повинні рухатися далі.”\n\n“Нісенітниця,” – пирхнув Лісандер. “Ти прийняла рішення, не порадившись із нами?”\n\n“Як голова Хору, я очікую, що ви приймете його,” – Ві кинула на нього холодний погляд. – “Якщо ні – двері там. Якщо заведеш бійку – я вб’ю тебе. Зрозуміло?”\n\nПопри вагання, Хор кивнув."
nf_chc.8.a:0 "..."

nf_chc.811.title:0 "Добро перемагає"
nf_chc.811.desc:0 "Ві повільно вдихнула. “Ми припиняємо наші зусилля з відродження Матері.” Стіни затремтіли, привид за межами кімнати засідань розлютився, але Ві продовжила. “Я не вірю, що її мета праведна, і вона не приведе нас до процвітання. Ми знищимо її, а потім продовжимо шляхом миру. Без Одержимих, без жорстокості, без насильства. Я хочу, щоб ми повернули нашу людяність. Думки?”\n\nЦелестіна всміхнулася, заплющивши очі. Гордість.\n\nДон засяяла, її очі блищали. Радість.\n\nЛісандер, Морґана й Омма – від здивування до байдужості. Морґана, дослухавшись до поради Ві, покинула кімнату. Омма залишилася, схиливши голову в прийнятті.\n\n“Безглуздо! Абсурдно! Тобі не соромно? Ти не усвідомлюєш реальності?” – Лісандер лютував. “Ти прирекла нас! Мати – наш єдиний шлях.”\n\n“Можеш оскаржити мою владу,” – очі Ві засяяли, вона вказала навколо. – “Усі присутні підтримують мене. То вперед, Лісандре. Покажи, на що здатен.”\n\n“Це не... Це...” – він кліпнув очима, похитав головою. “Гаразд. Ідіть до загибелі, якщо хочете.” Він зачесав назад розпатлане волосся і з останнім злим поглядом вийшов.\n\nЦелестіна відкрила очі. “Ти зробила правильний вибір, Ві,” – її голос був заспокійливим. “Ти врятувала нас – і багатьох інших.”
nf_chc.811.a:0 "А ще... хтось випустіть того Паладина."

nf_chc.9.title:0 "Засідання Психічної Ради"
nf_chc.9.desc:0 "У полудень, коли пробив дзвін, тиша наповнила коридори комплексу, й Хор зібрався. Останні кілька засідань тягнулися болісно, завершуючись вибухами роздратування. З кожним днем досягти компромісу ставало все важче. Що робити з Матір’ю – рішення мало бути однозначним, і Ві вже визначилась.\n\nХористи обмінялися люб’язностями – поглядами, усмішками, кивками – перед тим як зібратись навколо воєнного столу. Пісня астрального палацу наростала з кожним акордом і баритоном. Лавандові гнилість проростала з-під підлоги. Щупальця в темних кутах повзли стінами й стелею, огортаючи кімнату мороком. Повітря стало важким, кожен вдих давався з зусиллям.\n\nКоли їхні свідомості завершили формування реальності кімнати, Ві вийшла вперед.\n\n“Це буде наше останнє засідання щодо Матері,” – її впевненість змусила підняти брови. “Я зважила все і вирішила. Хочете чи ні – ми повинні рухатися далі.”\n\n“Твоя зухвалість лякає,” – сказала Целестіна. “А що як це роз’єднає нас остаточно?”\n\n“Як очільниця Хору, я очікую, що ти приймеш це,” – відрізала Ві. – “Інакше – двері там. Якщо заведеш бійку – я вб’ю тебе. Зрозуміла?”\n\nПопри вагання, Хор кивнув."
nf_chc.9.a:0 "..."

nf_chc.911.title:0 "Зло тріумфує"
nf_chc.911.desc:0 "Ві повільно вдихнула. “Ми продовжимо наші зусилля з відродження Матері.” Стіни затремтіли, привид за дверима зрадів. Ві продовжила: “Вона – єдиний шлях уперед. Її провидіння дало нам перевагу там, де все інше зазнало краху. Вона приведе нас до процвітання. Думки?”\n\nЛісандер поправив комір, самовдоволено усміхаючись. Гордість.\n\nМорґана кивнула, хихочучи собі під ніс: «Нарешті». Можливість.\n\nОмма заплющила очі й схилила підборіддя. Прийняття.\n\nЦелестіна й Дон були приголомшені. Дон заїкалася, намагаючись заперечити, але під тиском поглядів розгубилась і вибігла з кімнати.\n\n“Ві,” – вигукнула Целестіна з рідкісною люттю. “Ти скоїла жахливу помилку. Мати – це не дар, а прокляття. Вона приведе нас – і світ – до загибелі. Як ти могла?”\n\n“Ти можеш заперечити,” – Ві вказала навколо. – “Але тоді ти проти всіх нас.”\n\nЦелестіна прикусила щоку. Прислухавшись до поради Ві, вона теж залишила кімнату.\n\n“Ти ж не справді збираєшся їх відпустити, правда?” – Морґана оглядала нігті.\n\n“Я збрехала,” – знизала плечима Ві. “Накажіть Доуеджерам вирушити за ними. Вони стануть чудовим кормом для Матері.”\n\nЛісандер усміхнувся, розвернувшись на підборах: “Вже біжу.”
nf_chc.911.a:0 "І приберіть там у підземеллі, гаразд?"

nf_chc.11.title:0 "Наглядач і Друїд"
nf_chc.11.desc:0 "Це був один із тих рідкісних днів, коли Ві майже не була нікому потрібна: жодних воєнних планів на підпис, жодних кришталевих на підрахунок, жодних консультацій з Матір’ю. Більшість пустельників раділи б вихідному дню, але для ідеологічно загартованого псайкера бездіяльність була... стресовою. Блукаючи коридорами, Ві розмовляла з Доуеджерами, оглядала Одержимих – так вона намагалась зайняти себе. Небезпечно наближаючись до думки завести хобі, вона з полегшенням почула сварку десь у коридорі – вона йшла з кабінету Лісандера.\n\nВі підкралась до прочинених дверей, звідки розливались гучні голоси. \n\n– Ти ж їх уб’єш! – вигукнув високий, легкий голос. Йому у відповідь – лише виснажене чоловіче зітхання. Ві зазирнула в кабінет. Дон та Лісандер – обидвоє з найближчого кола Ві – сперечалися над столом, на якому лежав напівзакінчений кресленик вугільним олівцем – якийсь завод. Дон – у своєму зеленому плащі природниці – стояла перед кресленням, спершися руками по обидва боки. Лісандер розвалився у своєму фальшшкіряному кріслі, спираючись щокою на стиснений кулак, очі його мляво ковзали від плану до обуреної співрозмовниці. Вираз на його обличчі був втіленням втоми, але з часом стримане роздратування наростало.\n\nПоки вони сварились, думки Ві пливли геть – не до теми спору, а до самих учасників.\n\nДон, в усіх сенсах, була м’якою. Її голос – лагідний, приємний, як і її особистість. Вона почувалася найкраще серед дикої природи – з якою, завдяки пси-здібностям, мала особливий зв’язок – і набагато більше любила компанію рослин і тварин, аніж людей. З практичного боку, вона була слабкою. Навіть якби Дон мала волю когось скривдити, її захищене життя зробило б її легкою здобиччю для будь-кого, сильнішого за особливо злого безхатченка. Але це не заважало – її місце було в тилу, де вона лікувала як Псайкерів, так і численних Одержимих. Її мотивувало... власне, Ві не знала що! Не Мати, й не чиясь особлива прихильність. Можливо, вона просто боялася бути самотньою?"
nf_chc.11.a:0 "Принаймні, вона має добрі наміри..."

nf_chc.1122.title:0 "Про Кротокрис і Людей"
nf_chc.1122.desc:0 "А от Лісандер – цілеспрямований, розважливий і знавець своєї справи – був довоєнним магнатом нерухомості. Завдяки зв’язкам у бізнесі й уряді, він не лише дізнався про програму Псайкерів, але й викупив собі місце в ній: забезпечивши собі як найпотужніші психічні здібності, які тільки можна купити, так і ефективне безсмертя. Процедура назавжди знищила в ньому емпатію й чутливість – і його це, здається, анітрохи не турбувало. Ні, єдине, що турбувало його по-справжньому – це неефективність. Його єдиним емоційним стрижнем залишилась відданість. Чиста, фанатична відданість справі Матері. Саме лише через брак харизми він не зайняв місце Ві.\n\nДумки Ві повернулись до суперечки в той момент, коли вона наближалась до кульмінації. Мова йшла про довоєнний бетонний завод на північ від Каплиці – споруда була майже неушкодженою, і устаткування ще цілком працездатне. Єдина перешкода – зараження кротокрисами. Лісандер розробив план зачистки та повторного запуску виробництва, але Дон була обурена – вбивати істот лише заради конвеєрів? “Ти не можеш так вчинити! Це... неправильно!” – закричала вона, тремтячи від гніву, стиснувши кулаки. Це викликало в Лісандера тонку, зловісну усмішку. Він розкинув руки, виставляючи себе відкрито, впевнений, що удару не буде. “І що ти зробиш, любителько щурів? Зупиниш мене?” Дон знітилася, відвернулась, сльози з'явилися в очах; розчарування в собі й у його поведінці спотворили її обличчя болючим виразом. І саме в той момент вона побачила у дверях Ві. Лісандер теж помітив. Обоє звернули погляд на Ві – чекаючи на її вирок."
nf_chc.1122.a:0 "§4Можливо, ми знайдемо інше застосування лігву...§!"
nf_chc.1122.b:0 "§RЙди комусь іншому набридати, Дон.§!"

nf_chc.7.title:0 "Одержимі в шахтах"
nf_chc.7.desc:0 "Ві вдивлялась у ряди Одержимих, більшість із яких були вдягнені лише в лахміття та дрантя. Вишикувані в шеренги, вони чекали, поки їм видадуть кирки й лопати. Саме ця похмура юрба мала добувати залізо з довоєнних шахт під землею. Лісандер перевіряв усе вдруге, бурмочучи собі щось про обсяг видобутку й витрати робочої сили. Ві встигла краєм ока зиркнути на його планшет – виглядало кепсько. Звіти свідчили, що понад 80% із них можуть загинути через жахливі умови внизу.\n\nВі відчула укол провини; так, ці люди були зламані, підкорені, але відправляти їх на смерть без вагань здавалося... занадто. – Хіба ми не можемо якось зменшити втрати? – запитала Ві. Лісандер на мить підняв на неї здивований погляд.\n\n– Можемо видати їм шоломи. Може, ще трохи костюмів від радіації... Але це буде дорого. А нових робітників завжди можна знайти, – знову опустив погляд на записи, заглибившись у цифри.\n\nВі була розгублена. Вони ж – живі істоти. Підкорити розум – одне. А кидати їх на смерть без жалю – зовсім інше."
nf_chc.7.a:0 "§RЯка різниця, якщо ще кілька загинуть?§!"
nf_chc.7.b:0 "§4Варто видати Одержимим захисне спорядження.§!"

nf_chc.10.title:0 "Нахабні Доуеджери"
nf_chc.10.desc:0 "Доуеджери мали своє призначення. Вони займались усім тим, до чого Хору не було діла – дрібницями, якими ніхто не хотів опікуватись. Їх це влаштовувало. Увесь бруд, уся важка робота – лягала на плечі Одержимих. Але з часом, коли амбіції Хору зростали – як і суперечки щодо Матері – Доуеджери почали забавляти себе плітками, інтригами й дрібними чварами.\n\n– Ви всі, вівчарі Матері, однакові! Захоплені цією туманною ідеєю, що вже почали красти одне в одного?! – кричав один.\n\n– Варвари! – додав він.\n\n– Варвари? Ти – недорозвинений пліткар, що не розуміє значення Матері для нашого майбутнього! – обурилась жінка. – Блюзнірство. Дивно, що тебе досі не оголосили зрадником!\n\n– Якщо так, то краще вже бути зрадником, ніж дурнем!\n\nСаме в цей момент до кімнати увірвалась Ві, вчасно зупинивши скандал до того, як з'явилася зброя. Обоє – і чоловік, і жінка – вказали одне на одного, вигукуючи в унісон:\n\n– ПОКАРАЙ ЦЬОГО ЄРЕТИКА!\n\nВі довелось зібрати всю силу волі, аби не вибухнути – як у переносному, так і в буквальному сенсі. – Досить! – крикнула вона. Після чого винесла вирок..."
nf_chc.10.a:0 "§RЧоловік. Його відправлено до Целестіни на перевиховання.§!"
nf_chc.10.b:0 "§4Жінку. Її передано Моргані для покарання.§!"

nf_chc.6.title:0 "Поле Пісні"
nf_chc.6.desc:0 "Для Ві ця земля обіцяла надію. Вона була просторою й вільною від уламків, на відміну від усього навколишнього безладдя. Згнилі креслення свідчили, що ще до війни тут мали звести завод. Чому проєкт так і залишився на папері – невідомо. Але Хор радів: схеми вціліли, отже зусилля на їх розробку не були марними. Треба лише почати будівництво.\n\nАле Целестіна була надзвичайно мовчазна, коли вони оглядали ділянку. Вона роками була для Ві точкою опори. Її м’якість несла в собі силу. Вона з легкістю приборкувала внутрішні бурі. Людей вона читала, як ноти – чітко й вчасно. Тож якщо навіть вона, у всій своїй врівноваженості, поглядом передавала тривогу – значить, було чого остерігатись.\n\n– Що сталося? – спитала Ві, коли вони нарешті залишились наодинці.\n\n– Поле... гучне, – видихнула Целестіна, не зводячи погляду з пустки перед собою. Поки Ві намагалася збагнути сенс, та продовжила: – Просте поле дзвенить, мов дзвіночок. Радіаційні плями – мов метрономи. Іноді – чотири-четверті, іноді – вісім-вісім. Вони цокають, попереджаючи дурнів. Але тут... – вона вдихнула, – це нескінченна скрипкова струна, яка скиглить без упину.\n\n– Могила? – припустила Ві.\n\nЦелестіна нарешті повернулась до неї. – Для багатьох. Думаю, це був Хор, що замовк ще до вибухів. Ми не маємо права будувати на їхньому спочинку.\n\n– Нам потрібен цей завод. Це – заради виживання, – наполягла Ві. – А мертві... мертві. Їхній біль – уже поза нашим впливом.\n\n– Я розумію, – зітхнула Целестіна. – Завод важливий. Але прошу тебе – забудуй лише довкола могил.\n\n– Я... я подумаю, – знехотя відповіла Ві, розуміючи, що її вибір не сподобається всім."
nf_chc.6.a:0 "§RЗемлю використано повністю. Мертві зрозуміють.§!"
nf_chc.6.b:0 "§4Фабрики збудовано навколо поховань. Мертві на це заслуговують.§!"

nf_chc.13.title:0 "Кого звинуватити?"
nf_chc.13.desc:0 "Старий ґазебо довоєнних часів, ледве вцілілий, стояв неподалік від комплексу. Половина його вже пішла під землю, дерево поросло мохом і напівзгнило. Оммa знаходила там спокій. Щодня по кілька годин вона сиділа біля альтанки, леліючи нову рапсодію. Зрештою, ґазебо став місцем застереження – ніхто не насмілювався наближатися до Омми, коли та співала.\n\nБо жінка, зраджена чоловіком, який віддав її на експерименти, а потім зрадив знову – така жінка викликає страх.\n\nСьогодні, однак, Ві помітила фігуру, що прямувала до альтанки. Новий одержимий? Самогубець? І те, й інше? Вона не була певна, але придивившись, побачила обриси силової броні. Ві цокнула язиком і рвонула до виходу. Зло ніколи не спить, навіть те, що замасковане під доблесть.\n\nНа щастя, Паладин Амброуз не був упертим фанатиком. – Що ти робиш? – спитала Ві пошепки.\n\n– Вона кинула мені виклик, – відповів Амброуз, не зводячи погляду з Омми. – Вона вважає мене небезпекою, ганьбить моє ім’я діями моїх попередників. А я... я прагну розірвати цей ланцюг."
nf_chc.13.a:0 "..."

nf_chc.14.title:0 "Тебе не існує"
nf_chc.14.desc:0 "Дзеркальний столик, майже з’їдений термітами. Ледве тримається. І все ж – дзеркало вціліло. Вкрите віковим брудом і слідами пальців із минулого. Ві ніколи не мала дзеркала. Вона спитала Моргану, що з ним робити. Та лише відповіла: “Милуйся й захоплюйся.”\n\nТож, у хвилини перед першим ударом по Конфедерації, Ві сіла перед дзеркалом... і просто дивилась.\n\nВона чекала, коли ж настане захоплення. Або хоча б милування.\n\nЛісандер передбачив, що війна з Конфедерацією завершиться швидше, ніж догорить свіча. І після перемог, здобутих у результаті схилення Хору до Материнської волі, сумнівів ні в кого не лишалось. Довіра до командира – річ рідкісна. Але жодна перемога не могла заглушити тривогу, що точила нутро Ві. Щодня вона розросталась, точила нерви, роз’їдала кістки.\n\nВона подумала, що це пухлина. Але діагноз нічого не виявив. Якби Целестіна була поруч, вона б знайшла причину. Якби тут була Доун – та б ніжно, дбайливо лікувала. Перед тим, як думки дійшли до Амброуза, Ві різко похитала головою й закрила обличчя руками.\n\n– Підніми підборіддя, дитя, – пролунав у її свідомості голос Матері. – Лідери тримають погляд прямо.\n\nВі підкорилась. Поглянула знову у дзеркало. Очі червоні, волосся скуйовджене. Вона ледь впізнавала себе. Раз... два... три. Тримай. Відкрий. І тоді – її по хребту пройшов холод: у дзеркалі позаду – обличчя, які вона давно поховала. Вона закричала й розбила скло кулаком. Але обличчя лишилися. Дивилися з уламків. Їхні роззявлені щелепи клацнули, готуючись до слів..."
nf_chc.14.a:0 "Ві продовжувала трощити дзеркало, кричачи."

nf_chc.16.title:0 "Кого звинуватити? II"
nf_chc.16.desc:0 "– Може, трохи тихіше, – знову прошепотіла Ві. – Ще крок – і підпишеш собі вирок. Хіба ти тут не досить довго, аби знати?\n\n– Якщо діва підніме голос хоч на мить – земля розколеться. Так, я це знаю, – сказав Амброуз і випростав груди. – Але я зможу владнати це. Такі конфлікти я вже залагоджував.\n\nХоробрий і наївний. Чудово. – А може, залишишся тут? – обережно запропонувала Ві. – Я поговорю з нею. А потім вирішимо, що робити.\n\n– Посередник? – хмикнув Амброуз. – Можеш спробувати, але я впевнений у своєму намірі, міс Ві.\n\nОбережно Ві рушила до Омми. Але та була пильна. Вона заговорила раніше, ніж Ві відкрила рота:\n\n– Я не довіряю Братству... – її шепіт лунав, мов грім, і тремтів у землі. – І тим паче не вірю цьому Паладину. Не важливо, що він там каже. Я бачила достатньо, щоби знати: чеснота – то лише маска для гіркоти.\n\nОмма дивилася прямо на Ві. А та, у свою чергу, відчувала, як з-за спини палить погляд Амброуза. Вона мусила зробити вибір."
nf_chc.16.a:0 "§RПосадити його в темницю. На деякий час.§!"

nf_chc.5.title:0 "Суперечка про стиль і техніку безпеки"
nf_chc.5.desc:0 "Ві стояла мовчки, стиснувши губи в роздратуванні, очі її байдуже блукали по поверхні скла перед нею. Це було особливо брудне вікно з видом на заводський цех; по краях накопичився пил і бруд, а тріщини повільно тягнулися до центру, вказуючи на те, що цьому склу скоро кінець. Хтось написав тонкими чорними літерами «НАДІЇ НЕМА!» – влучний опис того, як Ві почувалась, слухаючи суперечку, що точилася за її спиною.\n\n– Так-так, подумай, як жалюгідно вони виглядають! Вони мають виглядати смертоносно, лякати! Один лише вигляд зброї має примушувати ворогів тремтіти, Доун! – виголосила Моргана, спрямувавши погляд зі зневагою на свою партнерку по дебатах.\n\nДоун тупнула ногою, здійнявши хмарку пилу з підлоги офісу майстра цеху. – Ми можемо зробити їх безпечнішими, вони ж небезпечні! Вони з більшою ймовірністю відірвуть тобі руки, ніж... голови ворогам... – Її голос затих, очі впали донизу. – Ми... не повинні наражати наших людей на небезпеку.\n\nЦі слова викликали закочування очей у тієї, стрункої, поблажливої жінки. – О, яке жахіття! Бідні брудні посіпаки, яким відриває руки! Хтось подумає про цих нещасних! – Вона притисла тильну сторону долоні до чола у карикатурному жесті розпачу, а потім скривилась у справжній гримасі. – Звісно, тобі байдуже до естетики! Ти ж і за собою ледь доглядаєш! Вічно в тій своїй жахливій накидці, тягнеш радіоактивні бур’яни з лісу!"
nf_chc.5.a:0 "Ох, почалося…"

nf_chc.15.title:0 "Закутий Хор готується до нападу!"
nf_chc.15.desc:0 "Війська висуваються до кордону, будуються укріплення і командні пункти, зброя надходить на передову. Немає жодних сумнівів: Хор готує напад. І напад буде невдовзі. Ми мусимо готуватися, поки ще можемо."
nf_chc.15.a:0 "Скликати племена!"

nf_chc.522.title:0 "Проклята зброя – безглуздо озброєна"
nf_chc.522.desc:0 "Ві лише зітхнула, відключившись від суперечки. Час від часу її погляд фокусувався на чистих ділянках скла, крізь які було видно, як десятки одержимих безперервно працюють, створюючи зброю для майбутньої війни. Без будь-якого ремісничого хисту, без гордості, без уваги до якості. Все, що сходило з конвеєра, було жалюгідним: крихкі клинки, заклинювані затвори, тупі списи і незграбні пістолети. Але іншого вибору поки що не було.\n\nЄдиною втіхою було те, що вся програма коштувала трохи менше, ніж очікувалося – залишились лишки матеріалу. На жаль, про це довідались інші, й Моргана з Доун одночасно вломилися на об’єкт, вимагаючи використати залишки на свої забаганки.\n\nМоргана хотіла зробити зброю більш страхітливою – для іміджу, яким вона так одержима. Це означало – зайві прикраси, пурпурна фарба, весь арсенал показухи. Доун, навпаки, прагнула зробити зброю менш небезпечною для самих користувачів. Вона виправдовувалась тим, що це зменшить навантаження на медслужбу, але Ві не вірила. Доун мала м’яке серце до Одержимих, і це був її спосіб покращити їхнє життя.\n\nУ кожної точки були свої переваги. Обрати одну з них не зашкодить ходу війни. Це питання – лише особистого вибору. Врешті, Ві подумала: у нас побачення з долею..."
nf_chc.522.a:0 "§R...і важливо виглядати відповідно.§!"
nf_chc.522.b:0 "§4...і я хочу дійти туди живою.§!"

nf_chc.20.title:0 "Скелі, забарвлені в червоне"
nf_chc.20.desc:0 "Війна за Скелю Розписів була жорстокою. Битися з племенами на їхній землі – завжди важко, але мілітаристська культура Пафосної Крові й його племені зробила це ще важчим. Наші патрулі постійно піддавались нальотам, і навіть тепер, коли війна завершена, ми досі не можемо повністю викурити всіх воїнів.\n\nАле це вже не турбувало Ві. Молодші псайкери поведуть загони на зачистку залишків. А Ві тим часом, разом із Лісандером, займалась сортуванням сотень полонених. Процес був простий: захоплених воїнів – у солдати, міцних – у робітники. Старі й немічні – нікуди. Вони не зможуть повстати, і Матері вони не годяться.\n\nМатір. Саме через Матір Ві мала бути тут – особисто вибрати найкращих, хто буде §Rпоглинутий.§! Мати стала вибагливою. Вона хотіла тільки найкращих: вождів, поетів, учених, ремісників, і тих, хто у піковій формі. Поки процесія тривала, Ві чула в голові її хрипке шепотіння – воно вказувало, кого відділити від натовпу."
nf_chc.20.a:0 "Оці двоє, он там."

nf_chc.2022.title:0 "Одяг Ганьби"
nf_chc.2022.desc:0 "Вистачало лише вказати пальцем – і одержимий витягував нещасного з лінії та вів геть. Обрані завжди кричали рідною мовою, просили допомоги – й завжди отримували тишу у відповідь. Тишу палиці або батога.\n\nЗрештою, повз Ві пройшов хлопець – не старший за шістнадцять – з поглядом, втупленим у землю. Він виглядав міцним, ситим; якби йому дозволили мати майбутнє, він міг би стати могутнім воїном або невтомним працівником. Солодкий голос Матері знову зазвучав у черепі Ві, вимагаючи його §Rплоті§!. Вона просто підняла палець – і його витягли з ряду.\n\nАле цього разу кричав не він. Кричала інша – жінка поважного віку, в сльозах, тремтяча в кайданах. Вона кликала його. Ві не розуміла їхньої мови, але інтуїтивно знала: це його мати. І вона щойно усвідомила, що бачить сина востаннє.\n\nВі завмерла. Перед очима спалахнули спогади – як її саму колись вирвали з рук батьків, вивели білі халати. Обличчя жінки зжалося, спотворилось, перетворюючись на жахливу пародію матері Ві. Від того видовища її нудило.\n\nЦей напад розірвав Лісандер – він вихопив кийок у одного з одержимих і закричав: «Досить, дикунко!» – й ударив її по грудях. Глухий хруст зламаних ребер, вона згорнулася, лишивши по собі лиш стогін.\n\nХлопця вже давно відвели. Без слів. Без прощань.\n\nВі прийшла до тями й помітила, що вся покрита потом."
nf_chc.2022.a:0 "Я візьму вихідний..."

nf_chc.21.title:0 "Стратегічне Рандеву"
nf_chc.21.desc:0 "Був пізній вечір, і більшість Хору вже повернулись до своїх покоїв. Самотність була переважним вибором для вечірнього відпочинку серед псайкерів – але не для Лісандера. Ще зранку він запросив Ві на зустріч, але про її суть мовчав. Це насторожувало, і Ві відчувала тривогу.\n\nЗагадка розкрилась, щойно вона переступила поріг: меблі пересунуто, в центрі стояв стіл із шаховою дошкою. Поруч – пляшка довоєнного вина, два глибоких крісла з багряною оббивкою, одне навпроти іншого.\n\nЛісандер стояв спиною до дверей, ніжно ставив платівку на... щось. Програвач. Навіть до війни така річ була анахронізмом, але цей був явно доглянутий – і музика лилась з нього ніжна й гладка. Він обернувся, вітаючи Ві незвично теплою посмішкою, коли перші ноти наповнили повітря."
nf_chc.21.a:0 "..."

nf_chc.22.title:0 "Брухтова Купа"
nf_chc.22.desc:0 "Невдовзі після захоплення нафтотанкера в Скреперської Ради, Ві почала задумуватись – як ця штука взагалі колись була публічною пам’яткою? Кожен її крок змушував судно стогнати. Відчинені двері на іншому кінці луною віддавались крізь увесь корабель. Спершу вона подумала, що це помирає якась тварина. Скелет корпусу був укритий павутинням і пліснявою, з кожного клаптя витікала ржавчина. Жодна блискуча ділянка металу не лишилась незіпсованою. Усе було потоплено в сірості.\n\nТа більшість Хору (окрім Моргани) раділи трофеям. Усіх Одержимих швидко примусили шукати щось цінне серед куп металобрухту і мертвих тіл. Ві спостерігала з борту. До неї підійшла Омма.\n\n– Найважче буде змити кров, – прошепотіла вона. Шкіра її зблідла за останні місяці. Чи вона не їсть? Не спить? Це виключено – вони мали все. – З того, що ми знаходимо.\n\nВі моргнула, здивована. Омма рідко починала розмови. – Гадаю, так, – відповіла Ві. – Ми прийшли сюди по метал і плоть. Їх вдосталь. Колись моєю найбільшою проблемою було знайти тихе місце, де можна було б заспівати. Тепер я... знаходжу людей. – Вона стисло посміхнулась. – Все змінилося.\n\nВі замовкла під поглядом Омми. – Вибач, ти щось хотіла? – почала вона.\n\nОмма лише опустила очі й пішла. – Мабуть, нічого не хотіла.\n\nВі лишилась стояти, збентежена."
nf_chc.22.a:0 "Все справді змінилось."

nf_chc.2121.title:0 "Глибокі Думки"
nf_chc.2121.desc:0 "Лісандер жестом запропонував Ві сісти, поки сам узяв штопор і пару келихів. Ві зробила паузу. Це що, побачення? Ні, точно ні. Лісандер не став би заводити стосунки, якщо б їх не можна було вписати у податкову декларацію.\n\nВона вмостилася у велике крісло, в якому здавалася ще меншою. Музика була приємна – стара передвоєнна пісня, яку вона чула кілька разів раніше.\n\nПісля короткої боротьби з корком пляшка була відкрита, вино налито – не пролито жодної краплі. Лісандер зайняв місце навпроти з келихом у руці.\n\nШахова дошка вже була розставлена: Ві грала чорними, Лісандер – білими. Він зробив перший хід, 1.e4. Ві не була експертом, але знала правила й уміла трохи планувати."
nf_chc.2121.a:0 "Ві вирішила грати агресивно."
nf_chc.2121.b:0 "Ві вирішила грати обережно."

nf_chc.2122.title:0 "Сицилійський Захист"
nf_chc.2122.desc:0 "Агресія – це все, що вона знала. Вона не раз перемагала з нею в минулому. Чому б не завоювати дошку так само, як вона завойовувала вартових? Гра почалася.\n\nЛісандер грав у шахи, як у покер – жодного виразу, жодного натяку на емоцію. Тиша панувала, лише музика звучала в фоні – сумна пісня про втрачене кохання.\n\nЧерез п’ять ходів він нарешті заговорив: \"Коли ти дивишся на одержимих – що ти бачиш?\"\n\nВі задумалась. Можливо, була правильна відповідь, але вона її не знала. \"Я бачу робітників, воїнів, трудяг… плоть.\"\n\nВін похитав головою й підняв пішак – обертаючи фігурку в пальцях. \"Я бачу пішаків.\" Він поставив фігуру на дошку й просунув її на два поля. \"Пішаки – слабкі, обмежені. Але з потенціалом.\"\n\nКожен хід – і пішак ставав ближче до краю. \"З невеликою допомогою, з божественним керівництвом, пішаки можуть стати могутніми істотами.\" Фігура досягла краю – він замінив її на ферзя. \"Тепер розумієш?\"\n\nВі зрозуміла. Але через брак захисту її позиції й агресію вона зазнала втрат. Вона могла лише спостерігати, як нова ферзя тисне її в шах і швидко завершує гру. Лісандер просто усміхнувся і зробив ковток вина."
nf_chc.2122.a:0 "\"Схоже, я сьогодні чогось навчилася…\""

nf_chc.2123.title:0 "Захист Каро-Канн"
nf_chc.2123.desc:0 "Обережність. Стиль гри, що мав сенс у її становищі. Все, що їй залишалося – це чекати, поки Лісандер припуститься помилки. Гра почалась.\n\nЛісандер грав, як у покер – жодного натяку на емоцію. В кімнаті панувала тиша, тільки музика – тиха, гірка пісня про забутого коханого.\n\nНа п’ятому ході він заговорив: \"Коли ти дивишся на одержимих – що ти бачиш?\"\n\nВі відповіла обережно. \"Робітники, воїни, трудяги… плоть.\"\n\nВін похитав головою, усміхнувся й покрутив пішака в пальцях. \"Я бачу пішаків.\" Він поставив фігуру й просунув її вперед. \"Слабкі, обмежені істоти. Але з потенціалом.\"\n\nКожен хід – ближче до краю. \"З божественним керівництвом, пішаки можуть стати сильними.\" Пішака обміняли на ферзя. \"Тепер розумієш?\"\n\nВі зрозуміла. Але на відміну від попереднього сценарію, її обережна гра дала плоди. Захист витримав натиск, і після затяжної боротьби вона перемогла. Лісандер на мить розгубився, але потім всміхнувся, зробив ковток вина."
nf_chc.2123.a:0 "\"Схоже, я сьогодні чогось навчилася…\""

nf_chc.91.title:0 "Прекрасна Дисонансність"
nf_chc.91.desc:0 "Природа нашого призначення у пустках, як і саме Плем’я, постійно змінювалася. Багато зборів тому Мати вперше проявила себе перед Ві та іншими. І ще через багато зібрань більшість Хору переконалась у необхідності відродити її – повернути у світ у ще величнішій формі, ніж раніше.\n\nХоч ми й співали як одне ціле, між нами часто виникали... розбіжності. У поглядах, методах, навіть у самій природі Матері. І саме Ві доводилось особисто вирішувати публічні суперечки.\n\nВласне кажучи, вона щойно ввійшла в залу, де зібрався натовп навколо чергової гарячої дискусії між двома членкинями ради.\n\nПерша – Селестіна, висока, зріла жінка, чия найбільша сила – це розуміння людських емоцій. Вона могла вгадати багато, не почувши жодного слова, і часто описувала емоції мовою музики.\n\nДруга – Морґана. Жінка, одержима зовнішністю, для якої найбільше моральне питання – естетика. Вона не раз казала, що книжки, безумовно, слід оцінювати за обкладинкою.\n\nТемою суперечки знову стала Мати. Такі дискусії ставали дедалі частішими напередодні Великої Ради, і напруга росла.\n\nСелестіна критикувала Матір, називаючи її «дисонансною піснею» та «розстроєною гармонією». Морґана ж натомість намагалася продати образ Матері натовпу: «Прийдешнє преображення» та «вражаюче почуття стилю!»\n\nНатовп розділився навпіл, і лише з появою Ві галас вщух. Усі очікували її рішення."
nf_chc.91.a:0 "§RЛюбити красу – означає бачити світло.§!"
nf_chc.91.b:0 "§4Кожна пісня – це як картина.§!"

nf_chc.6661.title:0 "Народження Богині"
nf_chc.6661.desc:0 "Ві наближалася до гниючого втілення з тривогою. Посудина Матері досягла значного прогресу після змін у керівництві Хору – жодного натяку на її початковий скелет не залишилось. Гнила кров стікала з трону, на якому лежало напівзавершене тіло, збираючись калюжею біля самих ніг Ві.\n\n«Дитя,» – голос Матері лунав в коридорах. – «Ти готова?» Просте питання для складної відповіді.\n\nВі опустила голову. «Так, Мамо.»\n\n«Ти й увесь Хор добре постаралися. Усі жертви, всі муки – не забудуться. Тож підведись,» – прошепотіла Мати. – «Підведись і заспівай для Матері. Заспівай для прийдешнього.»\n\nХор зібрався навколо Ві в центрі. Вони почали пісню Матері – мелодію, яку вона вкладала їм у сни. Мелодія була дисонансною. Спростовані ноти й фальшиві гармонії. Але світ відповідав на спів – усе осяялося бузковим світлом. Тріщини простягалися від підлоги до стелі. Повітря стало задушливим і отруйним, але зробити крок назад уже було неможливо.\n\nІ тоді... все завершилось."
nf_chc.6661.a:0 "..."

nf_chc.6662.title:0 "Народження Богині: Частина Друга"
nf_chc.6662.desc:0 "Глибока тиша нависла над Хором, коли пісня завершилася. Лісандер ледь стримував емоції – радість, тривога, захват – його дихання було пришвидшене, байдуже до смороду, що пронизував повітря. Його обличчя змінювалося щомиті, й він виглядав більш живим, ніж за останні двісті років.\n\nОмма ж не мала такої енергії – вона знепритомніла, її шкіра стала сірою, натягнутою на кістки. Її тіло й без того було виснажене через надмірне використання сил до ритуалу – тепер настала остання крапля.\n\nАле за втратою прийшло народження. З effігії почулося серцебиття. Її вени пульсували м’яким янтарним світлом, схожим на полум’я свічки.\n\n«Я знову відчуваю себе собою,» – прохрипіло втілення. Її голос був зіпсований, огидний, але це – голос Матері. – «Ві,» – звернулася вона. – «Вийди вперед.»\n\nВі зробила крок."
nf_chc.6662.a:0 "..."

nf_chc.6663.title:0 "Народження Богині – Частина Три"
nf_chc.6663.desc:0 "Слова Матері... більше не лунали десь із глибин свідомості Ві, як внутрішній голос. Тепер вони лунали в її вухах – із вуст істоти, що стояла перед нею. Почути голос Матері насправді – це було щось лиховісне. Іронічно, але саме це й змусило Ві відчути: щось пішло не так.\n\nМати нахилилася ближче. Ві глянула в темні провалля, де колись мали б бути очі – лише гнилі ями з перемішаними нутрощами. Не мали очей, але думати, що вона не бачить, – було б помилкою.\n\nМати знову заговорила: «Це твоя найвеличніша година. Я – твоє Magnum Opus. Ти виконала своє призначення.»\n\nЦі слова мали присмак фіналу. Ві аж здригнулася, тремтіння пронеслося хребтом і в ногах осіло важким оловом. Її обікрали. Позбавили будь-якого відчуття задоволення, на яке вона чекала стільки часу. В її уяві цей момент розігрувався безліч разів: тріумф, радість, гордість! Але зараз у її голові був лише огидний суп із тривоги, порожнечі, сум’яття… та страху.\n\n«Ти сумнівалася. Як би ти не намагалася це приховати, я знала про це з того самого моменту, як відкрилася тобі.» – Мати завмерла, рухаючи тілом із бридким звуком, ніби тушу перетягували по бетоні. – «Але... ти дала мені все, чого я бажала. І не уявляю кращої винагороди... ніж вознесіння.»\n\nОдна з її величезних м’ясистих рук гепнулася поруч із Ві, земля затремтіла. Поки Ві не встигла й кліпнути – рука затисла її тіло і притягнула ближче. В щілинах грудної клітки вона побачила золоті й срібні прикраси на ребрах. Вони нагадали їй ґрати камери, в якій її колись тримали.\n\nВі нарешті прокинулася від шоку й почала пручатися, кричати, битися відчайдушно проти власної долі!\n\nАле це нічого не дало. Як тільки вона доторкнулася до тіла, її розірвало на шматки. Її крики стали хрипами… а потім – нічим."
nf_chc.6663.a:0 "..."

nf_chc.72.title:0 "Ода Вівторку"
nf_chc.72.desc:0 "Ві була виснажена. Місяці минули в напруженому жахітті: вигнання останніх прихильників Матері, знищення самої істоти, нескінченні клопоти. Майже рік – без жодного перепочинку.\n\nІ ось нарешті – вільний полудень. Гарна збірка поезій, тиха музика, скибка сирку та коробка довоєнних крекерів. Це могло б здатися дрібницею, але для неї це було мов рай на землі.\n\nПротривало це, звісно, близько години.\n\nМолодший псайкер з гупанням у двері порушив її спокій. «В–вибачте, міс Ві! Ви мусите це побачити!» Вона навіть на мить подумала прикинутися, що спить.\n\n«Ми знайшли нову частину лабораторії!»\n\nЦе вже ігнорувати було не можна..."
nf_chc.72.a:0 "Я зараз буду!"

nf_chc.721.title:0 "Старий тиньк, старші таємниці"
nf_chc.721.desc:0 "Ві завернула за кут і побачила кількох озброєних вартових біля пролому в стіні. Хоча точніше – у фасаді. \n\nВхід до цього крила був прихований фальшивою стіною, яка підіймалась і опускалась як справжні двері. Ілюзія протрималась понад 200 років – у домі Хору рідко була війна.\n\nЦе змінилося з вигнанням прибічників Матері. Спочатку все обмежилось сварками, але потім пішли кулаки, вогнепали, навіть кілька гранат. Врешті-решт, динаміт зруйнував цей трюк Довоєнного Світу.\n\nВартові поглядали назад із тривогою – на другі двері, що виднілись через отвір. Їхня поведінка натякала: це місце – моторошне. Можливо, навіть прокляте. Ві не була впевнена, що це не так.\n\nПобачивши її, охоронці дали шлях – вона пройшла крізь уламки й підійшла до дверей. Вони видали пронизливе сичання і звільнили хвилю застояного повітря з натяком на смерть.\n\nБуло темно. Коли Ві ступила всередину, двері зачинилися за нею."
nf_chc.721.a:0 "Що ж ми тут маємо…"

nf_chc.722.title:0 "Відлуння Старого Світу"
nf_chc.722.desc:0 "Перемикач знайшовся швидко, і кімната освітилась тьмяним світлом старих довоєнних ламп. Це була лабораторія з кількома столами, стільцями, терміналами і великою капсулою, в яку могла б поміститися людина.\n\nСтільниці були вкриті кресленнями, діаграмами, механічними деталями, навіть кількома колбами з рідиною. Біля термінала – стілець, у ньому скелет з головою, що звисала через спинку. Капсула була порожня.\n\nВі пройшлась по кімнаті, піднімаючи записи й здіймаючи пил. З того, що їй вдалося зрозуміти – це був довоєнний експеримент, метою якого було використання псайкерської енергії для... чогось.\n\nУ записах згадувались радіація, розпад, клімат і стихії. На жаль, для Ві це було надто технічно.\n\nАле вона знала того, хто зможе це розібрати."
nf_chc.722.a:0 "Сподіваюся, він не задрімав..."

nf_chc.723.title:0 "Краще життя через духовну науку"
nf_chc.723.desc:0 "Джен’юарі – чоловік, не місяць – тихо клацав по клавішах термінала, а Ві стояла за його плечем, пильно вдивляючись. Він намагався «зламати» систему і отримати доступ до збереженої інформації. Принаймні, саме так він їй сказав. \n\nВі майже нічого не тямила в комп’ютерах, а про самого Джен’юарі знала, мабуть, ще менше. \n\nКолись він був писарем у Братстві зі штабу в Техасі. Під час невдалої експедиції в Оклахому його захопив Хор і змусив працювати під впливом сиреної пісні. Та все змінилось, коли Ві відібрала владу в Матері – Джен’юарі був негайно звільнений. \n\nСкоріш за все, його давно вважали мертвим, тож він вирішив залишитися з Хором і допомогти своїми технічними знаннями. \n\nПісля кількох перезавантажень – і ненормальної дози ментатів – Джен’юарі нарешті пробився до системи. Його обличчя змінювалось на очах: від цікавості до здивування, а потім до повного шоку. \n\nВін повільно обернувся до Ві, потираючи скроні. \n\n«Це...» \n\n«Це просто...» \n\n«Прочитай сама.»"
nf_chc.723.a:0 "..."

nf_chc.724.title:0 "Шанс на спокути"
nf_chc.724.desc:0 "Проєкт ACAPELLA. Саме цим тут займалися. Ідея була настільки приголомшлива, що мозок відмовлявся її приймати. Машина, яка може використовувати психічну силу не для впливу на людей… а на сам світ. \n\nВона могла б змусити врожай рости швидше й більшим. Підвищити плодючість худоби, покращити м’язову масу, збільшити тривалість життя. Навіть кури – що б це не було – могли б нести більше яєць!\n\nІ це не все. У теорії, її можна використати для очищення річок, ґрунтових вод, аквіферів від радіації, та навіть для прискорення розпаду ізотопів! \n\nВі ледь у це вірила – якби не читала це власними очима. Це був шанс. Шанс на зцілення світу. \n\nНу, бодай частини світу. Радіус дії був великим, але не безмежним. І робота апарата вимагала б колосальної кількості енергії. \n\nВі подивилася на Джен’юарі, поклала руку йому на плече, вказуючи на екран. «Воно справді може працювати?»\n\nВін знизав плечима. «Можливо. Треба ще дослідити, але виглядає так, що вони майже все розгадали. Залишалось лише почати будівництво...»"
nf_chc.724.a:0 "Почнімо розробку планів!"

nf_chc.73.title:0 "Невелика умова"
nf_chc.73.desc:0 "Ві зайшла в лабораторію, яка вже встигла стати знайомою. Вона оцінила зміни з останнього візиту. Джен’юарі прибрав, упорядкував усе, оновив обладнання. Навіть лампи замінив на тепліші – місце стало майже затишним. \n\nДжен’юарі обернувся в кріслі, посміхнувся: «Привіт, Ві. Справи йдуть чудово. Я перевірив усі розрахунки чотири рази – думаю, це спрацює. Можемо зібрати все з того, що є в пустці, живити генераторами з ядерних батарей і скоригувати випромінювач під поточні рівні радіації.»\n\nВі зрозуміла десь половину сказаного, але чемно кивнула. Вона звернула увагу на відкриту й почищену капсулу – ту саму, в яку могла поміститися людина. Підійшла, провела долонею по м’якій оббивці.\n\nВнутрішність була комфортною. Як хмара. І все ж ідея бути пристібнутою знову викликала неприємні спогади. Хоч виглядала вона набагато людяніше, ніж усе, до чого її колись підключали. \n\nВі обернулася до Джен’юарі. Той криво посміхнувся, ковтнув слину й поглянув на капсулу. «Є… один невеликий нюанс.»"
nf_chc.73.a:0 "«Який?»"

nf_chc.731.title:0 "Сенс у смерті"
nf_chc.731.desc:0 "Ві сперлась на стіл, її голова оберталася, мов карусель. Те, що їй щойно сказали, вона не могла збагнути. Джен’юарі пояснив це двічі. І вона все одно не хотіла вірити. \n\nПроєкт ACAPELLA, відомий також як «Проєкт Одинокого Псайкера», потребував не просто психічної сили. Він потребував – самого псайкера. \n\nЩоб пристрій працював, хтось мав лягти в капсулу, бути введеним у медикаментозну кому і безпосередньо керувати процесом відновлення. \n\nНазавжди. Залежність виникала майже миттєво. Витягнути людину означало перетворити її на овоч. \n\nХтось мав померти заради цього. \n\nСеред служниць кандидатів не було. Лисандера зловити – значило б дати йому контроль над погодою. \n\nЗалишалось лише кілька імен: Целестіна, Доун... і...\n\nВі дивилась у скляний екран термінала, поки слова не зникли з фокусу, залишивши лише її власне відображення. \n\nВона зрозуміла, що треба робити. \n\n«Джен’юарі, нікому не кажи. Починай будівництво негайно.»"
nf_chc.731.a:0 "Так, мадам."

nf_chc.74.title:0 "Бенкет, що запам’ятається"
nf_chc.74.desc:0 "Ві повільно роздмухувала, підживлювала та підштовхувала вогонь – хижий вогонь з багряним полум’ям і золотим серцем – згідно з інструкціями Доун. Рукава її одягу були закочені до ліктів, адже вогонь вже кілька разів ледь не підпалив обшлаг. Вона працювала, слухаючи позаду спокійну балачку Амброуза і Доун як приємний білий шум.\n\n«І як називалась ця страва у ваш час, міс Доун?» – запитав Амброуз. Він нахилився так низько, як дозволяла його статура, щоб не зрушити з місця тарілки, горщики та інші продукти біля їхніх ніг.\n\nЦе була ідея Доун – влаштувати бенкет для Хору і служниць. Давненько вони не святкували. З проєктом ACAPELLA, що поступово просувався вперед, з’явилася надія – і саме час було дати їй вогню.\n\n«Весняні рулети! Подруга навчила мене, коли я була молодша», – пояснила Доун, зачерпуючи ще ложку овочевої начинки.\n\n«А, мовляв, як весна. Чудово», – засміявся Амброуз. «Хоч я і більше за зиму.»\n\nДоун кліпнула. «Не певна, що страва названа на честь сезону, але було б приємно.» Вона посунулася ближче. «Сідайте, я навчу вас їх загортати.»\n\nАмброуз охоче погодився. Весняні рулети були готові, коли начинка скінчилася. Таці з рулетами передали Ві, яка обсмажила їх на вогні до золотистої скоринки. Разом троє друзів скуштували перший – і всі замуркотіли з насолоди. Начинка була смачна, а Ві ретельно слідкувала, аби не було сирих чи підгорілих.\n\nПотім вони повернулися до їдальні з пляшками віскі та вина під пахвами. Святковий дух палав до самої ночі."
nf_chc.74.a:0 "О, який бенкет!"

nf_chc.78.title:0 "У смерті ми розлучимось"
nf_chc.78.desc:0 "Пекло.\n\nКімната палала вогнем суперечок, поки Ві намагалась заспокоїти трьох своїх супутників. Целестіна, Амброуз і Доун завалили її питаннями – в одних відчувалась тривога, в інших – звинувачення.\n\n«Хто очолить Хор, Ві?» – спитала Целестіна, нахмурившись з занепокоєнням.\n\n«Чому ти раніше нічого не сказала?! Це я мала йти, не ти!» – вигукнула Доун крізь сльози, стискаючи кулаки й б’ючи ними по столу.\n\n«Чому ти хочеш це зробити?» – запитав Амброуз. І тон його, і саме питання – були іншими.\n\nВі відкрила рота, але замовкла.\n\nЧому –справді– вона хотіла це зробити?\n\nРаніше здавалося, що це очевидно, але тепер, коли її тиснули до стіни, вона мусила шукати слова. Її пристрасть ще жодного разу не була озвучена вголос.\n\n«Я... хочу робити добро.» Так, це мало сенс. «Останні двісті років я лише різала шрами на і без того понівеченому тілі світу. Забирала людей, речі, ламала племена й відбирала надію в тих, хто її мав.»\n\nВголос це звучало жахливо. Але було правдою. Усвідомлення гріхів лише зміцнило її рішучість.\n\n«А зараз – у мене є шанс зробити протилежне. Я можу творити добро. Це не виправить усього, може навіть не спокутує, але... але...»\n\nЇї очі наповнилися слізьми. «Але це – єдиний вибір, який у мене є.»\n\nТроє очільників ради – ні, троє її друзів – кивнули. Без радості, але з розумінням."
nf_chc.78.a:0 "«Дякую вам. Усім вам.»"

nf_chc.77.title:0 "Тривожні звістки з кордону!"
nf_chc.77.desc:0 "Сусіднє плем’я на сході будує якийсь жахливий технічний монумент, що зіпсує нашу землю своїм сучасним сяйвом!"
nf_chc.77.a:0 "Ми маємо їх зупинити!"

nf_chc.75.title:0 "Угода з Брухтярями"
nf_chc.75.desc:0 "Цього ранку ми відправили невеликий загін кур’єрів у Стретч з оплатою за деталі, необхідні від Брухтярів. Все йшло за планом, аж поки за кілька годин один із кур’єрів не повернувся – кульові поранення, жодної кришки... і без товару.\n\nВиявляється, Брухтярі влаштували засідку просто перед пунктом зустрічі, вирізали решту кур’єрів і забрали капси."
nf_chc.75.a:0 "Що?! Вони їх вбили…?"
nf_chc.75.b:0 "Нам потрібно дістати ці деталі, незважаючи на ціну."

nf_chc.781.title:0 "Самопожертва"
nf_chc.781.desc:0 "Минув тиждень відтоді, як Ві розповіла правду про проєкт ACAPELLA; тепер усе було готово до запуску.\n\nВі та її друзі стояли перед масивним інтерфейсом Проєкту, дивлячись на нього з урочистою, але сповненою надії серйозністю. Дженьюері стояв осторонь, швидко набираючи щось на терміналі, перевіряючи останні показники.\n\nОсновна структура Проєкту ACAPELLA нагадувала їй дерево. Велика центральна колона сяяла лініями магічної енергії. Вогники блимали на гілках, що розходились від стовбура, сполучаючись із меншими блоками вздовж стін. Металева овальна капсула управління була затиснута серед коренеподібних клубків дротів. Вона водночас скидалася і на яйце, що випало з гнізда і тріснуло, і на кролячу нору, що вела в глибини невідомого.\n\nУ підніжжі труноподібної капсули була маленька металева шухляда. Вона мала бути замкнена разом із Ві і була достатньо великою, щоб вмістити кілька особистих речей. Туди її друзі поклали подарунки:\n\nАмброуз – свої голограмні жетони, щоб завжди бути поряд і захищати її.\n\nДоун – дерев’яну статуетку оленя, щоб нагадати, наскільки далеко може зцілитись світ.\n\nЦелестіна – кілька листівок з довоєнними національними парками, щоб нагадати, скільки ще шляху попереду.\n\nПісля того як усі подарунки були залишені, а шухляда замкнена, Ві обійняла кожного з друзів і сказала їм прощальні слова. Це були довгі, слізні прощання, сповнені щирих побажань, але вони не могли тривати вічно.\n\nВі зайшла до капсули, лягла на м’яке, подібне до хмари ложе, обіймаючи свій дар собі – улюблену поетичну збірку.\n\nВона кивнула Дженьюері – процес почався, капсула закрилась, і Ві заснула. Назавжди."
nf_chc.781.a:0 "..."

nf_chc.782.title:0 "Відродження"
nf_chc.782.desc:0 "І от – усе завершилось.\n\nНе було ані сліпучого світла, ані спалаху пси-енергії, навіть звуку не було гучного. Лише м’яке дзижчання працюючих механізмів і мерехтіння вогників.\n\nТроє друзів помовчки вшанували Ві – настільки, наскільки дозволяли емоції (Доун не змогла стримати ридань) – а тоді пішли.\n\nВийшовши з комплексу ACAPELLA, вони щось відчули... щось змінилось. Повітря стало легшим, не так пекло легені, як раніше. Звичний хворобливий зелений відтінок світла, що проходив крізь радіоактивні хмари, став тьмянішим.\n\nЖодного клацання лічильників Ґейґера, жодних ворожих мутантів, жодної далекої стрілянини. Лише... спів птахів.\n\nЗдавалось, що Проєкт уже почав діяти. Світ не вилікується за ніч, але тепер він, хоч трохи, але став кращим.\n\nА хіба можна просити більшого?"
nf_chc.782.a:0 "§4Дякуємо тобі, Ві.§!"
acapellactivated:0 "§GЕфекти проєкту ACAPELLA поширяться по наших землях, даючи бонуси до будівельних слотів, ресурсів і людських ресурсів!§!"

nf_chc.79.title:0 "Похід"
nf_chc.79.desc:0 "Ві вдаряла сталевою планкою об кремінь, мабуть, вже тисячу разів – іскри розлітались навсібіч, не запалюючи підготовлене гілля.\n\nДоун відкинула волосся назад і глянула вниз із усмішкою: рідкісний момент, коли саме вона була в команді, а Ві – у глухому куті. «Руки вже болять, га?»\n\nВі лише буркнула, вдаривши ще раз. Цього разу більшість іскор потрапила точно в ціль – і трут зажеврів! Ві схилилася, дбайливо піддуваючи полум’я. Воно миготіло, ледь не згасло... і раптом – спалахнуло!\n\nСправжній вогонь. Ві підгодовувала його гілочками, а тоді – вже дровами. Доун, закінчивши розбивати намет, вигукнула на честь перемоги й навіть влаштувала оплески. «У тебе вийшло! А тепер ходімо щось з’їмо, я вмираю з голоду.»\n\nСитна вечеря з яєць, ягід і риби завершилась тим, що обидві «кемперки» лягли спати. Раніше Ві нарікала, що її затягнули на стару, запилену довоєнну стежку, але тепер вона усвідомила – трохи часу на природі пішло їй на користь. Це було... правильно. Ніби вона торкнулась чогось первісно-людського.\n\nДоун сіла навпроти, склавши ноги, і поклала долоні на землю. «Думаю, треба таке влаштовувати частіше. Може, кілька разів на рік?»\n\nВі кивнула. Її мучила вина – важка, мов камінь у шлунку. Вона не скаже цього вголос, але не була впевнена, скільки ще років у неї лишилось, до того...\n\nНі. Не про це сьогодні. Сьогодні важливіше дізнатись, що ж таке «с’мор»."
nf_chc.79.a:0 "Це смачно!"

nf_chc.80.title:0 "Як Не Померти 101"
nf_chc.80.desc:0 "Тренувальне опудало з сердитими, намальованими очима втупилось у Ві. Під променями ранкового сонця сяяв червоний круг на його череві з мішковини та піску, що благав, аби в нього вдарили. Ві стояла мовчки, поки Амброуз врівноважував на голові манекена побитий металевий відро.\n\n– Навіщо ми це робимо? – нарешті спитала вона. – Це справді потрібно?\n\n– Ві, – почав Амброуз, повчаючи пальцем, – твої сиренські здібності – це прекрасно, але чесно кажучи, ти худа, як скіпка! Я хвилююсь за той день, коли якийсь здоровань просто кине зброю й побіжить на тебе напролом.\n\n– Я б просто скористалася своїми силами, – відповіла Ві.\n\nАмброуз обернувся до неї, посміхаючись, наче чекав на цю відповідь. – А якби він підкрався зненацька й ударив у горло?\n\nТак, це справді завадило б її здібностям. – Це звучить надто гіпотетично, – заперечила Ві.\n\n– А якщо це буде... – він різко нахилився вперед, – раптова зрада?\n\n– Ніхто з наших так не зробить.\n\n– Ві, я міг би зараз підбігти й зламати тобі шию – і ти не змогла б мене зупинити.\n\n– Та ти ж не зміг би –\n\n– Це займає лише п’ять секунд, – мертво проговорив Амброуз."
nf_chc.80.a:0 "Ві здригнулась, зиркнувши на нього. – Тепер ти говориш дивно."

nf_chc.801.title:0 "Як Не Померти 101 II"
nf_chc.801.desc:0 "Амброуз опустив руки. – Це дуже серйозні, цілком можливі сценарії! Із розширенням горизонтів Хору – особливо після запуску того механізму – мої обов’язки також зростають, і я не завжди зможу бути поруч, щоб тримати ворогів на відстані. Тому я мушу передати тобі свої навички ближнього бою.\n\n– Амброуз, ти ж не... – Ві зупинилася, плечі впали.\n\nУсе це одночасно зігрівало й обтяжувало її серце. Вона уникала думок про майбутнє після ACAPELLA, воліючи насолоджуватись тими митями, що лишились. Аж тепер вона зрозуміла, що всі інші вже давно мріяли про світле завтра. І всі ці мрії включали її.\n\n– Знаєш що? – вона похитала головою. – Гаразд.\n\nУсмішка Амброуза стала ширшою. Це було егоїстично, можливо навіть безглуздо, але його захоплення швидко передалось і їй.\n\nВі лише сподівалась, що він зможе пробачити її."
nf_chc.801.a:0 "А зараз – навчи мене не вмирати."

nf_chc.81.title:0 "Мистецтво Угоди"
nf_chc.81.desc:0 "– Стій рівно, не сутулься, це виглядає як слабкість. Ти маєш виглядати впевнено, командно. Але не надто владно, чи тиранічно. – Целестіна перелічувала поради для Ві, поправляючи її поставу, погляд і одяг.\n\n– Чому ти сама не можеш піти на ці перемовини?.. – Ві була стривожена. Вона звикла до дипломатії серед псіоніків, але спілкування з чужинцями – це інше. Особливо з тими з Великого Трейду.\n\n– Бо ТИ – наша лідерка. Ти маєш представляти нас, – впевнено відповіла Целестіна. Її оксамитовий голос бринів спокоєм і владністю.\n\nВі не мала серця сказати їй, що, ні, вона недовго ще буде при владі. Що все це навчання – марне...\n\nА може, й ні? Може, варто вміти зустріти смерть із гідністю.\n\n– Думаю, ти готова. Виходь і привітайся. Я буду поряд.\n\nВі кивнула, вийшла з-за великого каравану, яким їх привезли на зустріч.\n\nДипломат з Чикасо був добре збудованим і освіченим чоловіком, який із підозрою поглядав на псіоніків. Ві випросталася, подарувала йому ввічливу усмішку й заговорила чітко, впевнено."
nf_chc.81.a:0 "Поговорімо про торгівлю."

nf_chc.83.title:0 "Дайте Мені Ваших Бідних і Голодних"
nf_chc.83.desc:0 "Ві тихо дивилась на сцену перед собою. Довгі черги колишніх воїнів, знедолених робітників та інших місцевих ішли до караванів, де роздавали їжу, воду та припаси. Це був перший крок до встановлення довіри в регіоні.\n\nВі відчула укол провини. Війна була необхідна... так? Було б нерозумно залишити Пейнтед-Рок під владою войовничого Дайєд-Блада. Але все одно – це було жорстоко. Знищити плем’я й поставити себе замість них?\n\nЦе буде тонка межа. Але, можливо, вони зможуть вигравати не лише бої – а й серця."
nf_chc.83.a:0 "А Ві тільки й могла – сподіватися."

nf_chc.82.title:0 "Ти і Я – Ми Схожі?"
nf_chc.82.desc:0 "– Отже, якщо так подумати, тварини і люди не відрізняються! – заявила Дон. Ві зазирнула в кімнату якраз в слушний момент. Вона наполовину очікувала побачити ще одну суперечку – хоча це було б малоймовірно, зважаючи на безмежне терпіння Целестіни і огиду Дон до конфліктів – та натомість застала... розмову.\n\nА може, й дебати? Хто зна.\n\nЦелестіна повільно кліпнула у відповідь. – Можливо, ти маєш рацію, – вона поглянула на Ві. – О, як вчасно.\n\n– Щодо чого? – Ві нарешті увійшла до кімнати.\n\n– Ми з Дон намагаємось з’ясувати, чи перетинаються наші здібності, – пояснила вона, склавши губи в тонку лінію. – Я й сама не знаю, як ми до цього дійшли.\n\n– Наші здібності мають спільне коріння! Єдина різниця – інтелект, або як каже Целестіна, – продовжила Дон. – Інтелект – це як частота. Тварини – а я їх обожнюю – мають крихітні мозки, які випромінюють частоти, які чую лише я і можу перекласти через пісню. У Целестіни так само, але з людьми!\n\n– І от питання: чи існує істота з інтелектом десь між людським і тваринним рівнем? – задумалась Целестіна. – Якщо ми обоє зможемо зчитати ті самі емоції з такої істоти, наші здогадки підтвердяться."
nf_chc.82.a:0 "..."

nf_chc.821.title:0 "Ти і Я – Ми Схожі? II"
nf_chc.821.desc:0 "– Тобто, як я розумію, вам потрібна або дуже тупа людина, або дуже розумна тварина? – Ві підняла брову.\n\n– Або ми можемо провести експеримент прямо зараз! – вигукнула Дон і витягнула з-під мохової накидки крота.\n\nОчі Целестіни трохи розширились. Ві аж підскочила. – Ти весь цей час носила його з собою?\n\n– Це Падж. Він чемний і дуже розумний, – муркнула Дон, погладжуючи тварину по голові. – Любить тінь і спить, чіпляючись до моєї спини.\n\n– Я відчувала ще одну пісню, що текла поряд з твоєю… – зізналась Целестіна.\n\n– Інтелект! – усміхнулась Дон. – Посадімо Паджа поруч із Ві та подивимось, чи збігаються наші враження!\n\nВі примружила очі. – Ти зараз що натякнула?\n\n– Тихше, – втрутилась Целестіна, зробивши глибокий вдих. Ві зітхнула й погодилась. – Подумай про щось, що робить тебе щасливою, і тримай це в голові.\n\nДон нахилилась до Паджа, щось наспівуючи, очевидно, ставлячи йому те саме запитання. Потім відійшла й кивнула.\n\n– Почнімо з Паджа, – промовила Целестіна, закриваючи очі. – Дон, на рахунок три скажемо, що ми відчуваємо, що він думає."
nf_chc.821.a:0 "Три. Два. Один."

nf_chc.822.title:0 "Ти і Я – Ми Схожі? III"
nf_chc.822.desc:0 "– Кататися по чистій траві в тіні великого дерева! – сказала Дон.\n\n– Листя... – прошепотіла Целестіна.\n\nЖінки переглянулись. – Досить близько, – зауважила Ві. – Моя черга?\n\nЦелестіна кивнула. Ві зосередилась. Що робить її щасливою? Без сумніву – образ Хору. Але щойно вона вхопилась за цей образ, із глибин виринув страх. Неминучий факт – її жертва заради відродженого світу.\n\nВона проковтнула цю темну думку. Сила волі стала її союзником. Целестіна не мусить знати.\n\nТри. Два. Один.\n\n– Ми робимо тебе щасливою, – прошепотіла Целестіна з усмішкою.\n\n– ACAPELLA? – запитала Дон, відкривши одне око з нерішучістю.\n\nВі стиснула спину. – Це було... Тобто, Целестіна має рацію.\n\nДон зітхнула, плечі її опустились. – Мабуть, треба ще тестів, щоб підтвердити перетин.\n\nЦелестіна поклала їй руку на плече. – Це була чудова спроба. Може, знайдемо ще якогось надзвичайно розумного звіра? У цьому неможливому світі – все можливо."
nf_chc.822.a:0 "Ві швидко вислизнула з кімнати. Серце гупало в вухах."

nf_chc.71.title:0 "Як Мати, Так і Примара"
nf_chc.71.desc:0 "Для Ві Мати завжди була гнівною душею. Вона стала першою з них, хто загинув під час експериментів, але її неконтрольована лють прив’язала її до матеріального світу, змусивши чіплятись до ґрунту і бетону, під якими її поховали. Якщо любов тримає людей при житті, то ненависть дозволяє злим вижити.\n\nЛише тоді, коли Дон, Целестіна та Ві провели остаточне очищення Матері, вони насправді зіткнулись із зневагою.\n\nЛють Матері стрясала стіни її покою, поки тріо своїм співом знищувало її образ – кожен шматок гнилої плоті, кістки й сухожиль розпадався на попіл. Стіни вкрились тріщинами, з яких виринали лілові лози й гострі шипи – ніби прихована мережа бур’янів вийшла на світ.\n\nІ вони потягли до кореня. Перед лицем страху Целестіна тримала себе в руках; її ноти були сповнені надії на зелений світ. Дон співала крізь сльози, не зупиняючись. Ві підтримувала ритм і водночас оберігала подруг від лоз, що нишпорили у сліпих зонах.\n\nІ коли остання лоза зів’яла до сірого – настала тиша. Матері більше не було. Їхнє безмовне святкування перервав гуркіт цегли.\n\nОбережно вони рушили на звук – і знайшли прорив у стіні, за яким відкрилась прихована частина комплексу."
nf_chc.71.a:0 "Куди це приведе нас…?"

nf_chc.84.title:0 "Наші друзі з Мексона"
nf_chc.84.desc:0 "Ві охопило сильне нервове напруження через всю цю справу.\n\nХору потрібні були друзі й захист. Відпустити більшість своєї армії було морально необхідно, але це практично паралізувало їхню боєздатність.\n\nТож – друзі і захист. Єдиний реальний варіант.\n\nЕкспедиція Мексона – останні прибулі в регіон; підрозділ Братства Сталі з Каліфорнії, який відправили закріпитись у Денвері.\n\nСудячи з того, що вони засіли у бункері за багато миль від Денвера – щось пішло не так.\n\nАмброуз, що вів Ві прямо на територію Мексона, був самовигнанцем з Братства. Він покинув їх одразу після відступу з Денвера, прагнучи знайти славу деінде.\n\nВони наближались до старої заправки – єдиної споруди на милі навколо. Щойно вони ступили до входу, звідусіль вискочили постаті: з дверей, з-за кутів, з даху. Усі в бойовій броні та зі зброєю.\n\nОдин з них – чоловік у побитій силовій броні – вийшов з-за насосів і націлив лазерний пістолет прямо в голову Ві. – Говори, що хочеш, псякерко. Ти тут чужа, і ти це знаєш."
nf_chc.84.a:0 "Емм... Ad Victoriam?"

nf_chc.841.title:0 "Углиб нетрів"
nf_chc.841.desc:0 "На щастя, Амброузу вдалося згладити ситуацію з розвідгрупою Братства. Якби не він – Ві давно була б попелом на вітрі.\n\nДорога до бункеру Мексона виявилася довгою. Амброуз знав більшість із розвідників, і ті, здається, мали до нього повагу. Ві лише уривками чула, що він врятував чимало життів у Денвері.\n\nСам бункер був у доволі пристойному стані – за останній рік його перетворили на справжній штаб: з турелями, роботами, охороною і суворими лицями в силовій броні.\n\nПісля десятка коридорів вони нарешті прибули до кабінету Паладина-командера Андреа Брікслі, яка зустріла їх стримано, але ввічливо.\n\n– Вітаю, паладине Амброузе, і привіт... – вона подалась уперед і звузила очі. – Тобі."
nf_chc.841.a:0 "Доброго ранку, мадам..."

nf_chc.842.title:0 "Розмова про Сталь і Спадкоємців"
nf_chc.842.desc:0 "Переговори пройшли краще, ніж очікувалось. Переважно говорили Амброуз та Андреа, обговорюючи ситуацію в Колорадо. Експедиція Мексона перебувала в скрутному становищі, тож пропозиція альянсу здавалася досить заманливою.\n\nАндреа дещо сумнівалася щодо ролі захисників Хору... але, побачивши скільки ресурсів і людей це принесе, швидко визначилась.\n\n– Добре, – почала вона, відкидаючись у кріслі. – Експедиція Мексона візьме Хор під своє крило, й захищатиме вас від небезпек пустки. Взамін – вигідні угоди на ресурси та допомога ваших лікарів і провидців."
nf_chc.842.a:0 "Гадаю, нам це підходить!"

nf_chc.25.title:0 "Ніч при Місячному Світлі"
nf_chc.25.desc:0 "Довагери вбрані у вишукані тканини, пластикові коштовності й потерті хутра заполонили коридори. Ідея провести розкішний бал – перший в історії Хору – зачарувала всіх після оголошення Моргани. Стилістка стала зіркою миттєво. Від початку підготовки до самого заходу вона була на піку.\n\nПідвісні канделябри хитались під стелею відремонтованої зали. Потерті гобелени звисали зі стельових балок. Підлога, хоч і вкрита багатовіковим брудом, трохи блищала – абраксо-техніка все ж дала свій результат.\n\nВперше за довгий час Ві почувалася незручно у власному тілі. Вечір вимагав блиску – або, як сказала Морґана, «наша мить визнати всі скарби, які ми здобули роками – у пишності».\n\nСвято мало сенс – підняття духу, відзначення епохи – та сукня, яку пошила Морґана, точно ні. Вона була колюча, подолок чіплявся за коліна, плечі мерзли. Але Морґана була в захваті. Вона ахнула, коли Ві увійшла. Омма тихо сиділа за столом, повільно доїдаючи подану їжу. Лісандер розважав гурт довагерів своїми мріями та відданістю Матері.\n\n– Ти неймовірна! – захопилась Морґана, оглядаючи тканину. – Варта того життя, на яке ми заслуговуємо.\n\nВперше за довгий час щоки Ві почервоніли. – Тепер танцюй або насолоджуйся! Ми всі повинні іноді дозволяти собі слабкість.\n\n– Якби ж я могла… – Ві не встигла договорити, як Морґана вже привела Посвяченого з тацею закусок."
nf_chc.25.a:0 "Яка ж це ніч!"

nf_chc.26.title:0 "Життя, Прожите Недарма"
nf_chc.26.desc:0 "Медблок – те місце, куди Ві намагалася не заходити без крайньої потреби. У неї були чіткі, дискомфортні спогади, як її возили туди й назад між кабінетами на аналізи, обстеження та інші лікарські процедури. Це було холодне місце, в якому зникло останнє тепло, що колись залишила Дон до своєї смерті.\n\nПроте сьогодні вона тут з поважної причини. Омма захворіла – серйозніше, ніж будь-коли. Прикута до ліжка, вона ледь могла себе нагодувати, не кажучи вже про використання своїх важливих сил у бою.\n\nВі відсунула фіранки і побачила її, що лежала й тримала в руках пляшечку води, пальці її тремтіли. Омма обернулась до неї – і посміхнулась.\n\nНапевно, після постійного спілкування лише з похмурими лікарями, Омма зраділа знайомому обличчю. Ві справді хотіла сказати щось тепле. Підбадьорити.\n\n– Вирішила зіграти трупа, так? Виходить у тебе чудово, – виплюнула Ві.\n\nЩо?.."
nf_chc.26.a:0 "..."

nf_chc.261.title:0 "І Смерть, Зустріта Неправильно"
nf_chc.261.desc:0 "Це зовсім не те, що Ві хотіла сказати. Посмішка Омми – така рідкісна – швидко згасла, змінилась на подив.\n\n– Продовжуй валяти дурня – і, можливо, станеш у цьому майстром. Продовжуй тут, і я тобі допоможу, – нахилилась Ві, погляд сповнений ворожості.\n\nУ голові почала зароджуватись паніка: вона не контролювала власний голос. Ненависть, глибоко вкорінена, захопила її уста й злісно виплескувалась назовні.\n\n– Що, думала, я принесла тобі цукерки? Квіти? Привітати з тим, що ти нікчемна стара ганчірка? Або вставай і здохни достойно, або я це зроблю замість тебе.\n\nВі подивилась у металеву шафку – у відображенні була страшна, перекручена жінка, сповнена злості й жорстокості. Зловісне відображення повернуло її до тями. Вона опустила погляд на приголомшену Омму, потім миттю вислизнула з медблоку, бурмочучи лише тихе, винне вибачення."
nf_chc.261.a:0 "Я... Пробач!"

nf_chc.101.title:0 "Потік Торгівлі"
nf_chc.101.desc:0 "Найпростішим, але й найміцнішим зв’язком між двома державами завжди була торгівля. Братству з бункеру Мексона конче потрібні наші ресурси – їхня потреба переважає будь-які занепокоєння.\n\nНа переговори прибув не солдат у силовій броні, як ми очікували, хоч і супроводжувався він паладинами. Це був акуратно вдягнений пустельник на ім’я Ден Ріверс.\n\nЩойно всі представились, він перебрав ініціативу: чітко описав, які товари цікавлять Мексон і що вони можуть запропонувати. Кожну нашу спробу вставити слово – він, здавалося, передбачав наперед.\n\nВсього через пів години сторони потисли руки: вичерпна торговельна угода, вигідна для обох."
nf_chc.101.a:0 "Хіба ми не маємо бути екстрасенсами?"

nf_chc.102.title:0 "Потужні Угоди"
nf_chc.102.desc:0 "Щоб захистити себе, ми знали – звернення до Мексона по допомогу буде першим кроком. Нам знадобилися б роки, а то й десятиліття, аби досягти їхнього рівня військової дисципліни.\n\nВ обмін на їхній захист, ми надамо їм наших знахарів, цілителів та підтримку у логістиці.\n\nБратство влаштувало з цього велике шоу – десятки паладинів і лицарів, які присягнули захищати наш народ.\n\nМи підготували дари – воїни прийняли їх із стриманим кивком. Частина їхніх паладинів залишиться з нами, а деякі з наших приєднались до них у дорозі назад."
nf_chc.102.a:0 "Могутні захисники"

nf_chc.103.title:0 "Бо Я Не Могла Зупинитись Для Смерті"
nf_chc.103.desc:0 "Перемога.\n\nОстаточна, абсолютна і незаперечна.\n\nМати відкинулась на троні, розслаблена. Її трон – масивна конструкція зі сталі, інкрустована випадковими дорогоцінностями, з подушками, нашвидкуруч зшитими разом.\n\nНовий Палац, зведений у збереженому хмарочосі, давав їй панорамний вид на нове царство.\n\nДвісті років мук, прив’язаної до світу, прагнучої знову ходити землею – і ось результат. Її нова форма була велична, грізна, гігантська – але недосконала. Це блюзнірське злиття плоті постійно скидало гнилі частини.\n\nПотреба у нових тілах лише зросла. Але звідки? Можливо, рештки Техасу. Або Нью-Мексико. Або й Мексика? Байдуже, куди йти – світ став бенкетом.\n\nА Мати – голодна."
nf_chc.103.a:0 "Немає спочинку для злих."