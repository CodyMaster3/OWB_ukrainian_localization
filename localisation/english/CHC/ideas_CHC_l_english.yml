CHC_pacifist_military:0 "Глибоко Пацифістське Військо"
CHC_pacifist_military_desc:0 "Наша армія втратила свої зуби — не лише у можливостях, а й у бажанні боротись. Відмова від насильства приносить користь душі, але залишила наше військо без призначення. Нам потрібно повернути їм сенс."

