CHC_thralls_in_mines:0 "Раби в Шахтах"
CHC_thralls_in_mines_desc:0 "День згасав, і згустіле повітря звільнило істот землі від праці, лиш я один стояв на гіркій дорозі, голий, під оком Мого Володаря."

CHC_cheap_guns:0 "Дешеві Гармати"
CHC_cheap_guns_desc:0 "Назвати цю зброю небезпечною — не сказати нічого. Але в Хорі не знайдеться голосу, що б скаржився."

CHC_scream:0 "§0Хор Співає!§!"
CHC_scream_desc:0 "§RХіба це краще — бути тут, аніж втомлено трудитись вічно? У темряві бачити лише криваво-червоний місяць.§!"

