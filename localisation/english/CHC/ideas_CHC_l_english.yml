chcacapellainsights:0 "Осяяння Проєкту ACAPELLA"

chc_idea_maxson_choir_trade:0 "Торгівля Максона і Хору"

CHC_mastery_of_nature:0 "Владарювання над Природою"
CHC_mastery_of_nature_desc:0 "§4Відчуй мене, мов осінній вітерець,\nЩо легко танцює в думках твоїх\nНехай я зворушу те, що ти забув давно,\nТу частинку душі, яку сховав.§!"

CHC_good_scream:0 "Психічна Гармонія"
CHC_good_scream_desc:0 "§4Шлях м’якої землі, захований\nМіж материнськими живоплотами,\nЩо надростають згори, приглушуючи\nСяйво дня.§!"
CHC_GOODSCREAM_TT:0 "§HВивільнити Музику!§! \n\n§4Надає бонуси до стабільності, приросту людських ресурсів, втрат досвідчених солдатів і оборони! Якщо ви в союзі з Максоном, він також отримає цей ефект.§! \n\nЦя здатність триває 30 днів і може бути використана кожні 180 днів."

the_chained_choir:0 "Могутній Хор"
the_chained_choir_desc:0 "Світ став лише луною минулого для Зв’язаного Хору. Його землі, люди, закони — усе звучить на іншій частоті. Щоб вижити, Хор — деякі охоче, деякі ні — навчився перетворювати свої психічні сили на зброю. Один Хорист може зламати волю мас. Фальцет — знищити найстійкішу особистість. Гармонії — рвати плоть і бетон. Об’єднані, вони тчуть реальність на кінчиках пальців, змиваючи кольори пустки, щоби намалювати світ своєї мрії."

the_possessed_protect:0 "Послушні Захищають"
the_possessed_protect_desc:0 "Одна з пісень Хору — гіпноз. Через спів Хор проникає в розум тих, кому не пощастило потрапити в їхнє поле зору. Це — Послушні: численне джерело робочої сили, що сліпо слідує наказам Хору. Їхня туманна свідомість — це щит Каплиці, до останнього подиху."
the_possessed_protect_tt:0 "\n§OПослушні§! мають лише примітивний розум, але в масі, під контролем Хору, здатні на великі звершення."

CHC_SCREAM_TT:0 "§RВивільнити Наш Голос!§! \n\n§0Надає бонуси до атаки, прориву та швидкості наступу.§! \n\nТривалість: 30 днів. Можна використовувати кожні 180 днів."