CHC_Mother_desc:0 "Незваний Дух. Психічне Випромінювання. Сирена. Гниюча Мати. Усі ці імена належать мерзенному псі-привиду, який переслідує Хор від самого моменту падіння бомб. Вона говорить з тіней, шепоче на межі розуму, але її бажання завжди були очевидні.\n\n\"Створи для мене форму. Тіло, яке я зможу населяти. Судину, здатну вмістити мою міць і дух. Зроби це з плоті чужинців, інакодумців, заперечувачів. І за це я дарую тобі силу, яку світ ще не бачив.\"\n\nІ вони погодились. Хор присвятив роки — і ще більше життів — щоб здійснити це видіння. Пустошан, спійманих по всій Оклахомі, перетворили на страшний монумент своїй покровительці. Тоді плем’я очолювала інша жінка, ім’я якої згубилось у часі — стерте одразу після втілення Матері.\n\nТепер Мати править зі свого палацу — величезного храму, створеного вмістити пси-королеву заввишки у два поверхи. Все це — смердюче поєднання м’яса, мізків і огидної енергії, загорнутої у уламки колишньої розкоші.\n\nЇї наказів безліч, кожен передається через розум її одержимих, кожен з них гірший за попередній. Вона не зупиниться, поки світ не скориться її злості, породженій з глибокої, особистої ненависті.\n\n§0Ми знаємо лише це:\nСмерть — зло;\nтак кажуть боги —\nвони б теж помирали,\nякби смерть була добром.§0"

CHC_ambrose_armistead_army_chief_desc:0 "§Y\"Я марширую за справедливість — не ту, яку проголосили клинки минулого, а ту, яку обрав я сам.\"§!\n\nПаладин Амброуз — братерський ветеран до кісток. Назвіть будь-якого ворога Братства — і він згадає, скількох убив. Анклав, НКР, рейдери, наркомани, Легіон... список довгий. Але він — не псих. Для нього вбивство — це просто обов’язок, який він несе з того моменту, як узяв гвинтівку.\n\nТак було до Максонівської експедиції в Колорадо. Вона провалилась майже одразу: втрата командування, загибель десятків бійців, зруйнований цитадель у Денвері. Це похитнуло Амброуза. Згодом він покинув Братство й подався на схід, як мандрівний лицар — і зрештою потрапив до рук Хору.\n\n§YО, велична Сила!\nЯ кличу тебе до скромної справи;\nдопоможи мені стати смиренним,\nдай дух самопожертви\nта впевненість розуму;\nі в світлі істини — нехай я живу твоїм рабом.§!"

CHC_dawn_economic_advisor_desc:0 "§O\"Ти колись просто лежав на траві й дивився на зорі? Якщо вони дивляться у відповідь — чи сподобався б ти їм?\"§!\n\nЗабрана у дитинстві з інтелігентної, але відстороненої родини, Зоря стала однією з останніх випробуваних у програмі, що породила Хор. Погано соціалізована, конфліктів уникає, проводить час у самотності — серед залишків природи, як і до експериментів.\n\nЇї сила найбільше відгукується тваринам, рослинам та іншим формам життя. Вона — травниця, ветеринар, знавець лісу. Дехто каже, що вона розмовляє з тваринами — але сама вона це заперечує. Її погляд на світ — чисто пацифістичний. Вона не домінує, не нав’язує. Але в суперечках її думка часто губиться.\n\nПроте ті, хто пробився крізь її стриману зовнішність, знаходять доброзичливу, теплу душу. Трохи дивну — але справжню.\n\n§OВзуйте легковажні черевики\nі танцюйте зі мною.\nМоя душа — дикий виноград\nхто його зірве,\nхто побачить змову,\nхто встигне перемогти\nрічку, вже обтяжену квітами,\nмісяць, що світить на зграї людей…§!"

CHC_v_army_chief_desc:0 "§R\"§!§LКолись я боялася самотності, безсилля.§! §gХотіла б я, щоб юна V побачила мене тепер...§!§0\"§!\n\nБеззаперечна лідерка Скутого Хору, V володіє силою, харизмою й розумом, які тримають Хор вкупі. Її слова — закон, її накази — не обговорюють. Якщо вона погрожує вбити — вона вб’є.\n\n§gТі, хто має силу, та не чинять зла,\nхто не робить того, що можуть показати,\nхто, рухаючи інших, самі — камінь,\nнезворушні, холодні, поза спокусою...§!"

CHC_lysander_economic_advisor_desc:0 "§1\"Перенеси оту двійку... казарми сюди... вивантажити ресурси у Вейноку... Так, я знаю, що ми вкладемось у графік.\"§!\n\nЛісандер, як і більшість перших псайкерів, походить з іншого часу. Колись — довоєнний магнат у сфері нерухомості, все його життя було зосереджене на прибутках. Його зірковий час настав у 2065, коли рік торнадо зробив найкращу землю смішно дешевою. Та що робити, коли заробив стільки, що не витратиш за життя?\n\nПравильно — продовжити саме життя.\n\nЗавдяки зв’язкам у бізнесі він дізнався про експеримент, що міг розкрити латентні психічні здібності — з побічним ефектом безсмертя. Йому було байдуже до псі-сил, він хотів лише жити вічно. І заплатив за це... дорого.\n\nАле це спрацювало. І за кілька місяців до падіння бомб Лісандер обманув Бога.\n\nСьогодні він — найвідданіший адміністратор Матері, що постійно скорочує витрати, оптимізує логістику і керує її світськими справами. Ходять чутки, чому саме не він, а V стала її Оракулом. Кажуть — через його брак харизми і слабкі псі-здібності. Але навіть так, він без зусиль управляє культом, що поклоняється злій сутності.\n\n§1Ми народились без нічого,\nв обіймах Матері знайшли надію.\nАле чим старші ми ставали,\nтим більше світ у нас забирав.\n\nМи прагнули, ми жадали,\nі зрештою стали рабами.\nЧим більше бачили — тим більше хотіли.\nНенаситність затьмарила душі.§!"

CHC_morgana_cultural_advisor_desc:0 "§0\"Ти серйозно вийдеш у —цьому—? Якщо б я була менш ввічливою, то сказала б, що ти це навмисно — мене вивести з себе!\"§!\n\nАкуратна, пристрасна, поблажлива. Моргана народилась у родині, де зовнішність була релігією: мати — дива моди, батько — пропагандист на службі війни. З дитинства її вчили, що все — фасад. Справжність не має значення, головне — враження.\n\nЦей принцип веде її всюди: у створенні ефектних мундирів для Одержимих, в оздобленні зброї символами, у влаштуванні бенкетів для Хору, навіть у пошитті розкішних суконь і капелюхів для Матері, коли її тіло, нарешті... буде завершене.\n\nДля Моргани моральність — це стиль. Той, хто виглядає красиво — чистий. Той, хто нехтує зовнішністю — гидкий.\n\n§0Не кажіть, що Краса — це Добро,\nабо щось окрім Краси.\nНе згадуйте крила голубів —\nу неї крила чайки, дикі, шалені.\n\nНе називайте її злою — це слово її спалює.\nАле й не любіть занадто сильно —\nце ще гірше.§!"

CHC_celestina_cultural_advisor_desc:0 "§t\"Дипломатія — це наполовину отримати бажане, і наполовину зробити так, щоб їм це сподобалось.\"§!\n\nСелестіна — емпат в кожному сенсі слова. Найстарша з п’яти дітей, з ранніх літ вона взяла на себе роль матері — справжньої не було. Ця турбота про інших зробила її уважною, чуйною, і зрештою — ідеальною кандидаткою для проєкту, що мав на меті створити псайкерів. Ціною стала розлука з родиною.\n\nКрім типових музичних псі-здібностей, вона отримала й справжню емпатію — здатність *відчувати* чужі емоції. Це робить її неперевершеним дипломатом і радницею. Обман, хитрість, навіть душевні рани — ніщо не сховається від її погляду.\n\n§tЯкщо я зупиню одне серце від розбиття —\nне дарма я жила;\nЯкщо я полегшу комусь біль,\nабо розвію печаль,\nАбо допоможу знесиленому дрозду\nповернутись до гнізда —\nЯ жила не дарма.§!"

CHC_omma_high_command_desc:0 "§0\"Сподіваюсь, сьогодні буде тихо.\"§!\n\nКамілла «Омма» Новак була визнаною класичною співачкою до війни. Її голос — неймовірний за діапазоном та емоційністю — не раз змушував зал завмирати. Слухачі ще довго після виступу згадували її пісню, що лунала їм уві сні. Та роки напружених виступів узяли своє: на схилі шістдесятих Камілла втратила голос і пішла зі сцени. Спокійна старість не загоїла ту порожнечу, яку залишила сцена.\n\nІ саме тоді до неї прийшли. Двоє дослідників запропонували шанс — експеримент, здатний повернути голос. Умови були непевні, майже сумнівні. Але вона погодилась. За підтримки чоловіка.\n\nДалі — страждання. Медикаменти, випробування, невдачі. Чоловік віддалявся дедалі більше, знайшовши втіху у молодшій, здоровій. А Камілла... ламала речі піснею. Завдавала шкоди. А коли впали бомби — повернулась. Як луна себе колишньої. Як ламаюча реальність, спустошена істота, пісня якої здатна обвалювати фундаменти і ставити цілі армії на коліна.\n\n§0Таємниця, що досі мене тримає—\nЗі струмка, з водоспаду—\nЗ червоних скель—\nЗ осіннього сонця над головою—\nЗ блискавки, що пролетіла повз—\nЗ грому, бурі й хмар,\nЩо втілили образ§!\n§4(Коли решта небес була блакитною)§!\n§RДемона в моїм зору –§!"

CHC_the_nightcaller_army_chief_desc:0 "§0\"Ласкаво просимо в Країну Див, Алісо...\"§!\n\nХоча його справжню подобу знають одиниці, про Найтколера ходить багато історій. Кажуть, коли Хор співає вночі, не слід засинати. Спершу — звуки в темряві. Ти озираєшся, кличеш когось — але у відповідь тиша. Це ж Пустка, нічого дивного. Тобі здається, що почув знайомий голос — мати, друг, родич із давнини — він промовляє твоє ім’я. Тоді з’являються крики, благання, паніка. Сон вже не врятує. І тут починається справжній кошмар.\n\nПісня просочується у сни. Ти бачиш, як усе, що любив, страждає на твоїх очах. Близькі — закатовані. Світ — зруйнований. І тоді воно з’являється. Істота — більше чудовисько, ніж людина. Викривлене тіло намагається імітувати людську поставу, але зрештою здригається, смикається, підповзає ближче. Ти не можеш рухатись. Бліда, зморшкувата шкіра контрастує з темрявою, десятки очей — усі на тобі. Рот роззявляється — в ньому кілка-зуби. Важке дихання. Слину. Укус у шию.\n\nТи прокидаєшся з криком. Істота — справжня. Ти її жертва. Це Найтколер.\n\nПро Сорена, псайкера, що рідко покидає глибини в’язниці Вотонга, ходить чимало чуток. Його жертв мучать нічні кошмари, від яких божеволіють. Багато хто так і стає Одержимими. Ті, хто не зламався, поширюють легенду про людину, що приходить після півночі. Тепер його ім’я відоме всім — Найтколер. І Сорен носить це прізвисько з гордістю.\n\n§1Тепер лягаю я спати,\nІ молю Господа душу мою зберегти.\nЯкщо ж помру до світанку —\nНехай душу мою Він забере.§!"

CHC_robert_hardy_army_chief_desc:0 "§O\"Війну не виграєш більше, ніж виграєш землетрус.\"§!\n\nКолись Роберт Гарді був частиною Збройних сил США, задовго до того, як Велика війна перетворила світ на попіл. Він боровся, щоби захистити свою країну від зовнішніх загроз. Але даремно. Як тільки бойові дії на континенті вщухли, провідні держави розпочали обмін ядерними ударами, втопивши світ у вічному полум’ї та хаосі. Замість того щоб шукати мир, вони сперечалися і билися за залишки ресурсів. І хоча Америка могла зарадити ситуації, поділившись своїми досягненнями в ядерному поділі, вона тільки підливала олії у вогонь.\n\nМинуло понад двісті років. І кожного разу, дивлячись у дзеркало, Гарді бачить нагадування про той старий світ — згорілу, зморщену шкіру, біль у суглобах, вічне відлуння того, ким він був, і за що боровся. Дехто назве його щасливцем. Але коли після удару він залишився сам, без родини, з цим було важко погодитись. Єдині, хто лишився — бійці Нацгвардії Оклахоми. Та новий світ, зі своєю хиткою мораллю, змусив його покинути й їх. Він рушив у мандри.\n\nІ тоді він почув Пісню. Вона вабила. Привела його до земель Хору, де він зустрів Мудру — дівчину, що співала дует із птахами, збираючи букет квітів Пустки. Вони говорили. Вона казала, що кожне життя — цінне, що світ можна змінити на краще, якщо чинити добро. І що природа знову благословить землю, коли ми будемо цього гідні. Гарді повірив. І залишився. Щоб стати голосом цього вірування.\n\n§OВійна, смерть, руїна, гнів.\nГвинтівки, кулі, бомби, жах.\nУсім цим речам я ворожий —\nТож любімо, не ведімо війн.§!"

CHC_incineratus_army_chief_desc:0 "§P\"Хто живе без великого вогню в душі — живе в темряві.\"§!\n\nІстота, яку ледве можна назвати людиною, але з розрахунковим розумом. Інсінератус — страхіття, що сам радіє тому страху, який викликає його ім’я. Колись він мав інше ім’я, народжене разом із братом. Але те життя давно кануло в небуття. Його історія стала легендою — казкою, яка лякає подорожніх, щоби не наближалися до чарівної пісні Хору. Відомо про нього небагато. Занадто мало, щоб він здавався реальністю. Але легенди не палять людей. Інсінератус — так.\n\nЙого таємниця простягається навіть на сам Хор. Що ховається під його покровом — знає лише Блезус, чий розум надто розбитий, щоби дати достовірну відповідь. Лише очі — мутні перлини, що безупинно сковзають навколо — залишають слід від його колишньої людяності.\n\nТа ніхто не розуміє Інсінератуса краще за нього самого. Його образ — містичний, мовчазний, глибоко розумний. Але іноді той міф, який він створив, стає для нього самим тягарем. Без попередження він зникає у ніч, рушаючи в невідомі мандри. Місяцями його покої пустують. Але він не розносить смерть. Ні, він стає Тінню — мовчазним наглядачем.\n\nНа диво, він буває добрим. Приязним. Людям, яких він стежив, інколи навіть щастило на розмову. Був час, коли він, серед усіх Піродансерів, випромінював найбільше світла. Але потім він знову пішов. І цього разу за ним рушив Блезус.\n\nБлезус слідкував за ним у холодних пустелях та соснах. Мов голодний хорт, він йшов за братом ночами. І коли Інсінератус зупинився, Блезус знайшов його — і побачив попіл. Люди, за якими той спостерігав, були згорілі дотла. Інсінератус повернувся до Хору. Але частина його душі залишилась там, у тій золі. Світло, яке він колись ніс, тепер палило інших. Його скорбота не згасла. І ніколи не згасне."

CHC_blaesus_high_command_desc:0 "§P\"Кажуть, я вмію підпалити кімнату як ніхто! Ха! Ха! ХА! ХА! ХА! ХААА!\"§!\n\nПоки вогонь юності вгамовував розум його брата, Блезусу не так пощастило. У його голові — лише полум’я. І хоч це страшно, він — талановитий. Надзвичайно. Його теле-піроз здібності дозволяють йому спопеляти з миль відстані. Навіть у самому Хорі його бояться. І якби не доброта Інсінератуса, Блезуса давно б вигнали, лишивши гнити в Пустці.\n\nПопри всі спроби лікарів та вчених, його розум залишився порожнім. Хоч Пісня Хору і діє на нього, він ніколи її не співає. Чи тому, що не здатен, чи тому, що не хоче — невідомо. Але ніхто не хоче чути його голос. Врешті, його пристосували для катувань. Поки решта Хору хоча б зберегла залишки людяності, Блезус — ні. Він чинить свої жахи без сумнівів. Його не стримати.\n\nВін підпорядковується небагатьом. Іноді навіть собі — ні. Його розум — притлумлений. І зіпсований. Перелік образ, які йому пасують, не має кінця. Він — сама суть первісного зла. І нічим іншим він ніколи не стане."

CHC_jimmy_economic_advisor_desc:0 "§P\"Бачиш номер на цьому комбінезоні? Правильно, сученьку, Я — НОМЕР ПЕРШИЙ! Джиммі — найкращий!\"§!\n\nЧистка Металевих Гнутів була здійснена швидко й з чистої пихи. Життя Джиммі ніколи не було під загрозою, ніхто навіть не натякав на це. Та все ж, він скеровував свої здібності на те, щоби знищити всіх своїх товаришів — аби забезпечити собі вже й так забезпечене майбутнє. Він став останнім. І його залишили живим, бо з його смертю пішли б у небуття й самі ці сили. Якщо чесно, Джиммі завжди був брехуном, шахраєм і боягузом. Але Джиммі завжди буде номером першим.\n\nДо вступу до Хору він був мандрівним пройдисвітом і аферистом. Його афери тягнулися від Нью-Вегаса до Санта-Фе. Використовуючи свої здібності, він назбирав чималенький капітал. Суть була не в тому, щоби гнути ложки — це одна з небагатьох його «справжніх» навичок — а в тому, щоби витягувати монети просто з кишень своїх жертв. Поки чергова довірлива жертва теревенила про щось, нікель за димом повільно тяглися повітрям у сховок. Особливо полюбляв «виступати» на території Легіону — там люди були простіші, а денарії здобути легше, ніж кришечки. Кажуть, він навіть ошукав самого Ланія, витягши в нього всі гроші. Але це вже легенди.\n\nТа все добре колись закінчується. Якось Джиммі зайшов надто далеко — прямо в пісню Хору. Дійшли чутки, що є чоловік, здатний гнути метал силою думки. Тож вони послали Гендрикса, щоби це перевірити.\n\nТой зайшов до брудного бару в Нью-Мексиці. Не встиг і кроку ступити, як його вже схопив дрібний чоловік, що розповідав про силу розуму та показував, як той гне виделки. Гендрикс узяв Джиммі на плече та ніс його довго, будячи лише на їжу й воду, перш ніж знову вирубити. Коли дісталися, Джиммі познайомили з іншими, дали кімнату. Попри десятки таких самих, він почувався особливим. Адже прийшли саме за ним! Він справді потрібен.\n\nА потім прийшла параноя... Його тут триматимуть навіки? Чому він тут? Але відповідей не було. Лиш крики. Бо Джиммі вбив їх. Від страху. І замість запитати — він знищив.\n\nБо Джиммі не просто хоче бути першим.\nВін мусить бути єдиним. §RБільше ніхто не має лишитись…§!"
CHC_kane_high_command_desc:0 "§1\"Клинок легенд і пісень… Я відчуваю, як його сила тече крізь мене! Нарешті, моя рука з мечем спокійна. Ходімо, Міслетайне. Доля кличе! Всі ці розбійники — тільки наші!\"§!\n\n"
CHC_stella_theorist_desc:0 "§Y\"У пустелі гепард живе 3 роки, верблюд — 9.\"§!\n\n"
CHC_carmen_air_chief_desc:0 "§Y\"Ти граєшся з блискавкою — я її контролюю.\"§!\n\nУ Хору майже немає літаків. Але Кармен обожнює дельтаплани, а інколи — стрибає з парашутом із «Веселого Роджера» Енгельберта. Вона спускається з неба, мов однокрилий ангел смерті, несучи гнів Хору. Її сили дозволяють маніпулювати потоками вітру, а іноді — викликати справжні бурі без попередження. Ворогів Хору це не раз заскочило зненацька — завдяки їй.\n\nЗавдяки Скутому Хору Кармен змогла відточити обидві свої сили. Вона їм зобов’язана і не має іншого дому. Тож вона битиметься за те, щоб цей дім не впав. І щоб вороги потонули в цунамі її гніву.\n\n§YБлиск крізь небо пролітає,\nу темряві ми завмираєм,\nв ніч вугільну — біла рана\nспалахує без обману.\n\nКрізь пітьму проносить знак —\nблискавка залишить слід, мов знак,\nа коли прийде яскраве світло —\nв руїнах побачиш ти ту мить.§!"
CHC_engelbert_air_chief_desc:0 ""
CHC_bruiser_high_command_desc:0 "§0\"Еее… що кажеш, дух… Хор? Зупинити тебе?.. Голова Брюзера болить…\"§!\n\nФіолетовий Тінь опинився під контролем Армії Матері. Жодна кількість виноградних ментатів чи Стелс-Боїв не допоможе йому втекти цього разу. Колись він був потужним мутантом Армії Аттіса, а ще раніше — Армії Творця. Але тепер — він лише одержимий. Його вирахував Лісандер. І спланував, як заманити ближче. І той прийшов — мов міль до вогню…"
CHC_bryce_navy_chief_desc:0 "§Y\"Кораблі, як і віскі — всі хороші.\"§!\n\nКолись член Ради Скраперів, Брайс будував рибальські човни з усього, що знаходив, і продавав їх заради прибутку. Він мріяв одного дня відновити PMV Lawson — корабель, на якому рада збиралася — і вирушити в море, аби знайти нову землю, як у старих книжках. Або полювати на велетенських морських тварин, битись із ними, втрачати кінцівку — а тоді клястися у помсті. Та це лише казки.\n\nБрайсу подобалося не те, що буде попереду. А сам шлях. Але він знав: цього не досягнути самотужки. Тож коли на тій самій «Лоусоні» знову відбулася нарада, і до них прийшов дипломат від загадкового народу — він здивувався. Вона розповідала про дива та магію. Показала навіть щось. Брайс був вражений. Жива чаклунка! І прямо на тому самому судні, що потребувало дива, щоби знову ходити морями.\n\nВін зрозумів — це доля. Він запропонував більшість свого брухту в обмін на обіцянку навчити її народ ходу водами, догляду за суднами. І в надії, що колись, з їхньою допомогою, «Лоусон» попливе — рікою мелодій прямо до океану."
CHC_dawud_army_chief_desc:0 "§t\"Я теж знаю магію — я майстерно змушую речі зникати в одну мить.\"§!\n\nХоча Давуд і не має очевидних психічних здібностей, він досконало вирішує проблеми шляхом підступу — і це вже сила сама по собі. Йому підкоряється загін з одержимих, псайкерів і найманців, що спеціалізуються на обмані, вбивствах, крадіжках і стеженні. Коли Давуд поруч, мало що залишається непочутим… або невигаданим. Хтось має померти — він натисне на гачок. Треба когось допитати — він прийде з тканиною й водою. Стежити? Він уже з біноклем. Збрехати? Він у маскуванні, з історією на готові.\n\nПро минуле Давуда відомо небагато. Подейкують, що він — агент Кола Сталі з Техасу, який утік після порушення якогось давнього закону. Інші шепочуть, що він — фрументарій Легіону, відправлений Цезарем стежити за Скутим Хором. А може, його послали виживальники з сусідніх територій, щоби проникнути в Хор і ліквідувати його як загрозу… та з часом пісня затьмарила його початкову мету. Як би там не було, він здобув своє місце в Хорі, вистеживши бунтівного псайкера й запропонувавши його живим самій В. В обмін він присягнув на вірність — і вона дозволила йому стати частиною її особистої гвардії.\n\n§tСпогади епізодичні,\nзапечені в мій мозок\nі відтворюються\nмимоволі, уривками — часом змінені,\nперетворені на кольори.\nРоки домальовували картину,\nале оригінал\nзалишився.§!"
CHC_v_country_leader_good:0 "§W\"Йти у темряву наодинці — страшно. Тому ми йдемо разом.\"§!\n\nКоли насильницькі опанування припинилися, а жертви Матері — скінчились, В відчула, як з її плечей спала неймовірна вага. Але вона приймала ці рішення не сама. Їй допомагали Целестіна й Дон.\n\nТа все ще здається, що чогось бракує. Що є щось більше, що вона могла б зробити, аби спокутувати провину перед тими, кому завдала болю. Можливо, нема способу сплатити за скоєне. Але шлях, яким вона могла б піти далі, безсумнівно, приніс би ще більше болю — Хору, невинним, усім, кого вони би ще знищили задля своєї мети.\n\nІ все ж, що б вона не шукала, В знає одне: з допомогою друзів вона зможе йти далі. І коли настане час — вона зробить правильний вибір. Для всіх, хто пішов за нею.\n\n§WМи завжди думаємо про тебе,\nми все ще говоримо про тебе.\nТи ніколи не був забутий,\nі ніколи не будеш.\nМи тримаємо тебе в серці —\nі там ти залишишся,\nщоби йти й вести нас крізь життя.\nДоки знову не зустрінемось.§!"
CHC_v_country_leader_bad:0 "§g\"Як очільниця Хору, я очікую, що ти приймеш мій указ. Якщо ні — я змушена буду вбити тебе й використати твоє тіло, щоб повернути нашу Гнилу Матір.\"§!\n\nП’ятий піддослідний у Ватонзі, перший успішний. FEV не просто зробив її вижившою після вибухів — він зробив її мутантом. Практична, розумна, рішуча — але емоційно порожня. Емоції виводять її з рівноваги — і фізично, і ментально. Тож вона пригнічує їх, щоби залишатись стабільною.\n\nЖоден інший не показав такої відданості Матері, як В. Вона не просто стала Першою Хористкою. Вона вивела Хор на вершину. Завдяки їй одержимих стало безліч, псайкери — вірні, а Мати — отримує все, щоби стати цілісною. Глибоко під комплексом, де В сидить на своєму уявному троні, вона чує шепоти — захоплені голоси, що підбадьорюють її, хвалять, кажуть: «Мати скоро буде з тобою. Ви знову станете єдиним цілим.»\n\nІ доки не настане той день, В залишиться беззаперечною лідеркою Скутого Хору. І поведе їх до спасіння. Ніхто не стане на заваді — навіть ті, кого вона колись звала друзями.\n\n§gМи завжди думаємо про тебе,\nми все ще говоримо про тебе.\nТи ніколи не був забутий,\nі ніколи не будеш.\nМи тримаємо тебе в серці —\nі там ти залишишся,\nщоби йти й вести нас крізь життя.\nДоки знову не зустрінемось.§!"
