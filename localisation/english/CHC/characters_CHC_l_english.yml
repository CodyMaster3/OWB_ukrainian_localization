#Опис Характеристик
CHC_choirmaster_desc:0 "§LЙдіть за моїм ритмом, і нехай вони почують нашу пісню, навіть якщо це буде останнє, що ми зробимо...§!"
CHC_disharmonic_desc:0 "§0Кожен співає свою пісню. Може, ми не в унісон, але зате робимо свою справу ефективно.§!"
CHC_harmonic_desc:0 "§OВсі співають разом. У злагоді ми несемо нашу пісню до краю світу.§!"
CHC_one_with_nature_desc:0 "§OЗв’язок Зорі з природою, тваринами та хором дозволяє їй чути їх та проводити друзів світом без перешкод.§!"
CHC_sought_after_desc:0 "§0Популярність Моргани та її пісня приводить до неї одержимих, зміцнюючи її вплив та лояльність послідовників.§!"
CHC_fleeting_spirit_desc:0 "§0Мудрість Омми дозволяє їй чути шепіт вітру, розкривати позиції ворогів та готувати одержимих до засідки.§!"
CHC_plan_designer_desc:0 "§1Інтелект та креативність Лісандера допомагають створювати ефективні стратегії для розширення впливу. Він не зупиниться, поки не поверне Матір.§!"
CHC_diplomatic_desc:0 "§tСлова Целестіни надихають воїнів. Вони захищатимуть її та Хор до останнього подиху — її мова, хоч і солодка, але щира.§!"

