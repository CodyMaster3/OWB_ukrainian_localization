l_english:

chc_research_bonus:0 "Бонус за дослідження Скутого хору"
CHC_history_1:0 "Народження Ві"
CHC_history_1_desc:0 "§4«Якщо я вже зібралась розповісти про пригоду свого життя – пояснити, як опинилася тут, із цими людьми, і чому зроблю те, що зроблю далі – то, мабуть, слід почати з пояснення, хто такі Псайкери.»§!"

CHC_history_2:0 "Бомби"
CHC_history_2_desc:0 "Наше катівне існування, здавалося, триватиме вічно; ми були лабораторними виродками-псайкерами, приреченими на нескінченні страждання. Все могло б ніколи не змінитись, якби не бомба…"

CHC_history_3:0 "Одержимі"
CHC_history_3_desc:0 "Переважна більшість нашого племені – не псайкери. Це особлива підгрупа, знана як Одержимі."

CHC_history_4:0 "Матір Гнилі"
CHC_history_4_desc:0 "Наша Матір, наш провідний голос і душа нашого народу. Її материнський поклик проникав глибоко в наші душі, вимагаючи все більше з кожним днем."

CHC_equip_the_thralls:0 "Оснастити Одержимих"
CHC_equip_the_thralls_desc:0 "Наші воєнні загони не знають нестачі в §Rтілах§!, але з такою чисельністю виникає проблема озброєння. Майбутнє §0Поглинання§! Вартових вимагає, щоб ми озброїли якомога більше наших Рабів."

CHC_rally_the_thralls:0 "Згуртувати Одержимих"
CHC_rally_the_thralls_desc:0 "Наші §0Раби§!, якщо не доглядати за ними, виконують завдання байдуже, майже механічно. Цей стан можна змінити, передавши їм емоції співачки: лють, ненависть, зневагу, навіть амбіції. Все це вливається у їхні думки, поки вони бездумно маршем ідуть шляхом §Rруйнування.§!"

CHC_attack_the_guard:0 "Атакувати Вартових!"
CHC_attack_the_guard_desc:0 "§0Матір§! стає §Rнеспокійною!§! Ми не можемо більше зволікати – розрив між нашою §Rплоттю§! і гнилою вартою стає нестерпним! Ми спустошимо їхні поселення, зламаємо волю, заберемо їхні душі!"

CHC_everything_for_the_spirit:0 "Усе для Матері"
CHC_everything_for_the_spirit_desc:0 "Жодної пощади для переможених вартових – кожен з них буде принесений у жертву задля створення §0Судна Матері.§!"

CHC_undying_slaves:0 "Нескінченне рабство"
CHC_undying_slaves_desc:0 "Найбільша слабкість людських рабів – їхнє §Rстаріння§!. Та гулі бояться лише втрати розуму – але це не важливо, бо наша §0пісня§! вкоріниться в їхній свідомості задовго до того, як старість зітре розум. Гулі Вартових служитимуть нам навіки."

CHC_spread_our_taint:0 "Поширити Скотину"
CHC_spread_our_taint_desc:0 "Перемога! Вона на смак гидко-солодка – як біла жовч, що провіщає прийдешнє. Ми §Rпідкорили§! не лише війська Вартових, а й їхні §0РОЗУМИ§!. Без смерті ці спотворені душі не знайдуть спокою."

CHC_the_bounty_of_the_guard:0 "Здобич Вартових"
CHC_the_bounty_of_the_guard_desc:0 "Захист Patrol базувався на передових довоєнних технологіях: турелі, охоронні роботи, термінальні системи. Все це вражаюче, хоча й малокорисне тепер. Але такі рідкісні компоненти – безцінні. Ми повинні витягнути кожен мікрочіп, плату, процесор."

CHC_the_psychic_council:0 "Засідання Психічної Ради CXCVIII"
CHC_the_psychic_council_desc:0 "Щорічне засідання Психічної Ради – найважливіша подія §0Хору§!. Десятки наймогутніших псайкерів об’єднують свідомість у ментальному просторі, щоби визначити подальший шлях. Очікується велика радість з приводу поразки Вартових – та підтримка ідеї відновлення §0Матері Гнилі§!. Але не все так просто, як здається окові всевидячому."
CHC_the_psychic_council_focus_tt:0 "§gПопулярність уряду впливає на рішення засідання§!"

CHC_evil_path:0 "§PНовий Шлях§!"
CHC_evil_path_desc:0 "«Сильні роблять, що хочуть. Слабкі терплять, що мусять.» §g-Тукідід, Історія Пелопонеської війни.§!"

CHC_good_path:0 "§YНовий Шлях§!"
CHC_good_path_desc:0 "«Не дій так, ніби житимеш вічно. Над тобою висить смерть. Поки живеш – доки можеш – будь добрим.» §g-Марко Аврелій, Роздуми.§!"

CHC_good_prevails:0 "§YПсихічна Рада CXCVIII виступила проти прибічників Матері§!"
CHC_evil_wins:0 "§PПсихічна Рада CXCVIII підтримала прибічників Матері§!"

CHC_catch_the_guardsmen:0 "Спіймати Вартових"
CHC_catch_the_guardsmen_desc:0 "Після захоплення табору Вартових ми дізналися про дві групи біженців, що намагаються втекти з наших нових територій. Один загін – це самі вартові, що йдуть на південь. Інший – цивільний караван, що прямує на схід. Ми можемо перехопити лише одну групу."

CHC_catch_the_civilians:0 "Спіймати цивільних"
CHC_catch_the_civilians_desc:0 "Після захоплення табору Вартових ми дізналися про дві групи біженців, що намагаються втекти з наших нових територій. Один загін – це самі вартові, що йдуть на південь. Інший – цивільний караван, що прямує на схід. Ми можемо перехопити лише одну групу."

CHC_thralls_into_the_mines:0 "Раби – в шахти"
CHC_thralls_into_the_mines_desc:0 "Наші землі багаті на метали, та війна вимагає більше, ніж дає нам земля. Як і на війні, ми повинні §Rзабрати§! те, що нам не дають добровільно. Багато з §0Одержимих§! загинуть у чорних глибинах копалень, але ще більше повернеться з тим, що лишилося від багатства мертвого світу."

CHC_rage_for_the_machine:0 "Гнів за Матір!"
CHC_rage_for_the_machine_desc:0 "§RНенависть, злість, ворожість!§! Усе це мусить бути спрямовано на ворогів. Та цього замало – ти маєш навчати цього, передавати далі, заражати цим своїх §Rпобратимів-убивць!§!"

CHC_battle_psykers_focus:0 "Псіони на війні"
CHC_battle_psykers_focus_desc:0 "Сили наших псіоніків можна краще використати на фронті. Вони пробиратимуться в тил ворога або прориватимуться крізь його ряди, мов коса по пшениці! Це буде §0прекрасно, славно!§!"

CHC_levy_the_masses_focus:0 "Загальне ополчення!"
CHC_levy_the_masses_focus_desc:0 "Нам уже досить ремісників, слуг і псіонічних рабів. Нам потрібні воїни, бійці, вбивці! Вся праця тепер – на фронт. І вони §Rбитимуться!§!"

CHC_thralldom_for_guards:0 "Рабство для гвардійців"
CHC_thralldom_for_guards_desc:0 "У руїнах Зони оборони Еніда ми знайшли загін навчених гвардійців. Їх одразу ж знешкодили після трансляції сиренової пісні з гучномовців. Вони знову підуть у бій – але вже §0на нашому боці.§"
CHC_thralldom_for_guards_tt:0 "До вас приєднаються три повністю екіпіровані підрозділи гвардійців!"

CHC_mastering_special_forces:0 "Розширити корпус псіоніків"
CHC_mastering_special_forces_desc:0 "§0Більше, більше, ще більше!§! Псіоніки вже не раз довели свою ефективність у бою – настав час перекинути ще більше з них на передову!"

CHC_mastering_special_forces_2:0 "Вершина спецвійськ"
CHC_mastering_special_forces_2_desc:0 "Псіоніки – наша еліта, тож і спорядження для них має бути найкращим. Артефакторські обладунки, досконала зброя – усе, що треба. Вони стануть лихом для наших ворогів і вісниками долі!"

CHC_fortify_scrappers_pass:0 "Укріпити Перевал Ломщиків"
CHC_fortify_scrappers_pass_desc:0 "На півдні мешкає розрізнена зграя лускунів, що тягнеться вздовж річки Оклахома. Вони слабкі – але багате джерело §Rм'яса.§! На жаль, нам доведеться почекати: загроза зі сторони Гвардії не дає нам змоги почати нову війну. §0Матір§! жадає нутрощів Ломщиків... але мусить зачекати."

CHC_will_to_power:0 "Воля до влади"
CHC_will_to_power_desc:0 "Здобич із тіла пустки не триватиме вічно. Зрештою, ми маємо кувати власне зло – кузні, де палючий вогонь з'єднується з холодною сталлю, породжуючи ножі, списи й усе, чим можна §Rздирати плоть із кісток.§!"

CHC_salvage_irradiated_equipment:0 "Збирати радіоактивне обладнання"
CHC_salvage_irradiated_equipment_desc:0 "Деякі ділянки наших земель настільки заражені §7радіацією§!, що туди не ступає нога звичайного збирача. Найцікавіше – стара металургійна фабрика. Устаткування всередині можна відновити та використати, щоб здобути §Rперевагу§! в індустрії."

CHC_double_arms_production:0 "Подвоїти виробництво зброї"
CHC_double_arms_production_desc:0 "Головне – щоб у руках була зброя! Хай це буде §Rвідірвана§! рука в токарному верстаті, §Rвибране§! око через бракований набій, §Rрозірвані§! пальці від вибуху затвора. Все це – плоть для §0Матері§! врешті-решт."

CHC_rally_the_dowagers:0 "Залучити вдов"
CHC_rally_the_dowagers_desc:0 "§0Вдови§! – так ми називаємо псіоніків, що не мають великої влади в Раді. Вони змагаються за вплив, плазують перед тими, хто вище. Їхня підтримка життєво важлива для будь-якої нашої справи."

CHC_industry_knowledge:0 "Потрібен хтось із головою"
CHC_industry_knowledge_desc:0 "Серед наших §0рабів§! мають бути ті, хто тямить у справі. Коли ми тримаємо силу розуму в долонях, чому б не насадити нову золоту епоху – силою?"

CHC_power_plant:0 "Генератори Вотонґа"
CHC_power_plant_desc:0 "Колись ці генератори живили машини, що §Rпоневолювали нас.§! Тепер вони під нашим контролем, і світло вже не сліпить."

CHC_utilizing_townsfolk:0 "Використати містян"
CHC_utilizing_townsfolk_desc:0 "Якщо ти можеш §0підкорити все, що бачиш,§! – що заважає зробити ближнього ще одним §Rпішакам у твоїй грі§!? Мораль? Вона померла разом зі старим світом."

CHC_insert_four_hundredth_focus_in_the_game_named_weird_science_here:0 "Дивна наука"
CHC_insert_four_hundredth_focus_in_the_game_named_weird_science_here_desc:0 "§RНемає меж, яких ми не можемо перейти§!. Немає фронтиру, що ми не здатні здолати плоттю та розумом. Сила, така §0нестримна§!, як наша, мусить розширювати горизонти, навіть коли це здається неможливим."

CHC_bruisers_army:0 "Армія Брузера"
CHC_bruisers_army_desc:0 "Мутанти з чужих земель вдерлись поблизу; їхня сила – §0безпрецедентна,§! а розум – тьмяний, мов передвоєнна лампочка. §RВони служитимуть армії Матері – так чи інакше.§!"
CHC_bruisers_army_tt:0 "§YБрузер§! стане доступним як §Mрадник§! у ваш §GВійськовий командний штаб§!"

CHC_the_scream_ability:0 "Дар Матері – всьому світу"
CHC_the_scream_ability_desc:0 "Матір прийшла до нас уві сні й пообіцяла нам прекрасне: §0пісню, досконалу у гармонії, здатну зруйнувати самі Небеса.§! Коли ми прокинулись, ми не знали, як змінились – §Rта знали, що світ боїться нас ще більше.§!"
CHC_scream_tt:0 "Відкриває здатність §0Псіонічний Крик§!!"

CHC_attack_painted_rock:0 "Штурм Розмальваної Скелі!"
CHC_attack_painted_rock_desc:0 "На заході – плем’я воїнів. §RКровожерливі дикуни,§! чиє прагнення до §Rнасильства§! майже перевершує наше. Битва буде важка, та здобич – гідна. Добре збудовані тіла племінних – відмінне §Rм'ясо§! для §0опудала.§!"

CHC_core_sperman:0 "Закріпитись у Спермані"
CHC_core_sperman_desc:0 "Плем’я Каменя-Мальованця мешкає на двох важливих землях: Джанкшені Ґаймона на півночі та Спермані на півдні. Через ворожість місцевих, ми можемо надійно закріпити лише одну з них. Сперман – кращий вибір заради цивільної індустрії та металу."

CHC_core_guymon_junction:0 "Закріпитись у Джанкшені Ґаймона"
CHC_core_guymon_junction_desc:0 "Інша важлива область, під контролем племені – Джанкшен Ґаймона. Хоча ми можемо забезпечити контроль лише над однією з них, Джанкшен вартий того – завдяки військовій промисловості та воді."

CHC_sperman_resources:0 "Скарби Спермана"
CHC_sperman_resources_desc:0 "У шахтах Спермана – багаті жили металу. Племінні боялись копати глибше, побоюючись небезпеки. Та §0раби§! не знають страху."

CHC_guymon_resources:0 "Сила з Кімаррону"
CHC_guymon_resources_desc:0 "Місто Камінь-Мальоване розташоване неподалік витоків річки Кімаррон. Там вода найпотужніша – ідеальне місце для будівництва водяних млинів, що генеруватимуть електроенергію."

CHC_melody_idea:0 "Мелодія воїна"
CHC_melody_idea_desc:0 "Ефект наших §0пісень§! залежить від багатьох речей: тону, слів, §Rгніву§!, §0відданості...§! Інколи народжуються й нові мелодії. Новий твір, «Прекрасна балада битви» авторства Морґани, особливо корисний у наступі."

CHC_seize_the_stretch:0 "Захопити Розтяжку!"
CHC_seize_the_stretch_desc:0 "Компакт Ломщиків – південна рада скраперів, що не здатна до швидких рішень. Хоча §Rповне підкорення§! вимагатиме війни, ми можемо захопити території по той бік річки до того, як їхня рада отямиться."

CHC_attack_scrappers_compact:0 "Напасти на Компакт!"
CHC_attack_scrappers_compact_desc:0 "Серце Компанії Скраперів – понад тридцять тисяч §0душ§!. Матір, §Rвічно голодна,§! кличе нас зруйнувати їхню смердючу столицю й поглинути стільки тіл, скільки влізе у §0опудало§!"

CHC_core_the_stretch:0 "Закріпитись у Розтяжці"
CHC_core_the_stretch_desc:0 "Компакт займав велику територію, і повністю закріпитися повсюди неможливо. Найкращі варіанти – це Розтяжка або Іржаві Поля. Чикаша занадто ізольована. Зосередимось на Розтяжці – через її промисловий потенціал."

CHC_core_corroded_fields:0 "Закріпитись на Іржавих Полях"
CHC_core_corroded_fields_desc:0 "Інший варіант – Іржаві Поля, багаті на ресурси, які скрапери накопичили за роки. Усе, що нам потрібно – це фабрики, які зможуть їх використати."

CHC_stretch_resources:0 "Розтягнути ресурси"
CHC_stretch_resources_desc:0 "Легкий доступ до річки й багато простору робить Розтяжку ідеальним місцем для будівництва нових майстерень."

CHC_corroded_fields_resources:0 "Іржаві скарби"
CHC_corroded_fields_resources_desc:0 "Іржаві Поля багаті на ресурси, які зберігали скрапери. Тепер залишилось лише збудувати потужності для їх обробки."

CHC_reorganizing_the_possessed:0 "Навчити псіоніків тактиці"
CHC_reorganizing_the_possessed_desc:0 "Хоча наші методи командування §0відмінні§!, значення тактики нікуди не зникло. Кожен псіонік має вміти не лише керувати §0рабами§!, а й контролювати поле бою."

CHC_gather_what_they_must:0 "Працювати без спочинку"
CHC_gather_what_they_must_desc:0 "§0Одержимі§! – це унікальний клас робітників. Вони не потребують перерв, відпочинку чи самореалізації. Їм не треба платити, не треба поважати, не треба берегти. Вони не знають страху, сумнівів чи лінощів. Щоби рвати землю і §Rвиривати§! з неї багатство – кращого не знайти."

CHC_the_old_facility:0 "Стара установа"
CHC_the_old_facility_desc:0 "Виправна колонія, що стоїть над нашим першим домом, мала безліч виробничих ліній, де в'язні виготовляли дрібнички. З невеликими зусиллями їх можна переробити для виготовлення зброї!"

CHC_open_your_minds_eye:0 "Крапля для пиття"
CHC_open_your_minds_eye_desc:0 "Вода – важлива. Особливо для виготовлення льоду! А без льоду як ми збережемо всю §Rплоть§!, що повертається до Каплиці?"

CHC_we_need_MONEY_to_buy_DRUGS:0 "Плоди наших завоювань"
CHC_we_need_MONEY_to_buy_DRUGS_desc:0 "Серед усіх, кого ми викрали, поневолили або §0поглинули§!, багато залишили після себе цінні речі – заощадження в кришках, золоті реліквії, зброю, довоєнні дива… Більшість не має практичного вжитку, але їх можна §Rперетворити§! на кошти. А от кошти – корисні."

CHC_the_possessed_rally:0 "Зібрати рабів"
CHC_the_possessed_rally_desc:0 "Останній конфлікт уже близько. Наше завоювання Індійської Федерації означатиме повне панування над штатом і подарує нам більше, ніж достатньо тіл для завершення §0ритуалу§!. Тож ми відкликаємо всіх Одержимих, що не зайняті критичними справами, і мобілізуємо їх до армії. Процес буде помітним... і наші сусіди це відчують."
CHC_the_possessed_rally_tt:0 "Велика Федерація готується… а ми збиратимемо силу. Потім – ударимо!"

CHC_preparing_for_mother_1:0 "Вивчити музику"
CHC_preparing_for_mother_1_desc:0 "Найважливіша частина §0закляття§! – музика. Прекрасна, жахлива §Rбалада§!, що втілить §0Матір§! у нову §0форму§!. Виконання має бути бездоганним. У нашу найвеличнішу годину немає місця для помилок."
chcspreadthemusic:0 "§GЦе поширить ефект Проєкту ACAPELLA на території Ложі!§!"

CHC_preparing_for_mother_2:0 "Завершити опудало"
CHC_preparing_for_mother_2_desc:0 "§0Тіло Матері.§! Велика генеза наших зусиль. Ідеальний спосіб для її волі діяти в цьому спотвореному світі. Це кульмінація тисяч жертв – як §Rтілесних§!, так і золотих. Вона буде вдоволена. Ми в цьому впевнені."

CHC_preparing_for_mother_3:0 "Поклик до всіх псіоніків"
CHC_preparing_for_mother_3_desc:0 "Ритуал буде нелегким. Потрібні не лише голоси сильних, а всі псіоніки племені. Ми надішлемо заклик, що їхні голоси потрібні у Каплиці – бо час найвеличнішої години настав."

CHC_summon_mother:0 "§0Ритуал§!"
CHC_summon_mother_desc:0 "§0Не обов’язково бути Палатою–\nЩоб бути Примарним–Не обов’язково бути Домом–\nМозок має Коридори–що перевершують\nМатеріальні Місця§!"
CHC_summon_mother_tt:0 "Відкриває фінальний акт дерева фокусів!"

CHC_attack_the_lodge:0 "Напасти на ложу!"
CHC_attack_the_lodge_desc:0 "На півдні – §0культисти§!, подібні до нас тим, що бачать більше, ніж просто матеріальний світ. Але на відміну від нас, вони відмовляються §Rвклонитися§! §0Матері§! у всій Її величі. Дарма. Що вони не знають – ми навчимо."

CHC_secrets_of_the_lodge:0 "Таємниці ложі"
CHC_secrets_of_the_lodge_desc:0 "Остання Ложа приховувала багато: ритуали, тексти, спілкування з духами, загубленими в часі. Дещо ми знали. Але §0заборонене знання§!, віднайдене там, відкрило нам очі на те, чого ми не бачили раніше."

CHC_invade_tubeheads:0 "Вторгнення до Голов-Труб"
CHC_invade_tubeheads_desc:0 "Через річку від Витратного міста – одна з найбільших довоєнних радіостанцій. Зараз вона транслює нісенітниці. Але якщо ми §Rзахопимо§! її – вона буде служити нам!"

CHC_dead_air_focus:0 "Мертвий ефір"
CHC_dead_air_focus_desc:0 "Голови-Труби вибиті зі свого електронного лігва, станція – наша! Уже тепер ми записуємо нові §0заклинальні співи§! у студії, щоб транслювати їх на все Пустошшя. Кожна душа, що налаштуєсь на не ту хвилю – знайде дорогу назад до нас... для §Rпереробки.§!"

CHC_march_on_dallas:0 "Марш на Даллас"
CHC_march_on_dallas_desc:0 "Каплиця... прийнятна для Матері та Її слуг. Але може бути більшою. Кращею. Ближчою до зростаючого списку здобутих земель. Даллас, хоч і не найбільше місто Техасу, всього за кілька миль на південь. Але там – ті, хто мешкає: Солдати у Силовій Броні, шалені ковбої, люди з ідеєю відродити саму державу... Взяти місто буде непросто. Але ми призначені правити цими землями. І ми правитимемо."

CHC_the_palace:0 "§0Палац§!"
CHC_the_palace_desc:0 "Даллас під нашою владою, а його захисники – розпорошені. Матір тепер сидить на позолоченому троні з §Rвнутрішностей§!, і Її амбіції – безмежні. Палац буде збудовано на руїнах колишньої Commercia Tower. 60 поверхів. Найвища споруда, що вціліла після вибухів. Правлячи з такої висоти, хто нас наважиться зупинити?"

  #### Good Path Focuses
CHC_our_friends_in_maxson:0 "Дует зі сталлю"
CHC_our_friends_in_maxson_desc:0 "§gГлава Мексона.§! Орден благородних воїнів у броні з минулого, що вже зникло. Без сили §4Одержимих§! ми майже беззахисні. Ми не можемо захистити наші §Hнадії§!, §Hмрії§!, навіть самих себе. Ми зробимо все, щоб здобути прихильність цього ордену – віддамо суверенітет, таємниці, аби лиш отримати їхній захист."

CHC_alone_in_the_world:0 "Соло партія"
CHC_alone_in_the_world_desc:0 "Жодне плем'я сьогодні не довіряє нам відкрито, після всього заподіяного. Ми повинні пожати плоди власних вчинків – і крокувати Пусткою наодинці."

CHC_exchange_technical_information:0 "Обмін технічними знаннями"
CHC_exchange_technical_information_desc:0 "Знання – це §Hзвільнення§! від страждань. Щоб досягти панування над долею та світом, потрібно знати природу цих речей. Наші друзі з §gМексона§! знають набагато більше, ніж ми."

CHC_cooperate_on_defense:0 "Мистецтво взаємної оборони"
CHC_cooperate_on_defense_desc:0 "Наші домівки, наш народ, наші §Hмрії§! – їх треба оберігати, цінувати, любити. Але щоб це робити, і щоб наші діти могли мріяти, ми повинні захищати все це. Руки люблячого батька мають тримати немовля сьогодні – і рушницю завтра. Найменше, що ми можемо зробити – дати йому ту рушницю."

CHC_ties_with_maxson:0 "Зв'язки з Мексоном"
CHC_ties_with_maxson_desc:0 "Наші сусіди... з підозрою ставляться до нас. Мало хто вірить у наше §Hвідродження§!, ще менше – готові допомогти. Але §gГлава§! – інша. Чи то відчаєм, чи здатністю прощати – не ясно. Але ми повинні §Hплекати§! цей зв’язок, доки його не зруйновано."

CHC_cooperate_on_civilian_manufacturing:0 "Будувати майбутнє"
CHC_cooperate_on_civilian_manufacturing_desc:0 "Сидіти й чекати, поки світ загоїться – недостатньо. Треба §Hдіяти§! – відновлювати спільноти Пустки. Самі ми можемо досягти великих речей... але з допомогою друзів у §gСталі§! – можемо досягти більшого, злетіти вище, процвітати сильніше."

CHC_brotherhood_weaponry:0 "Зброя Братства"
CHC_brotherhood_weaponry_desc:0 "§gГлава Мексона§! запропонувала угоду: один із їхніх довоєнних банків даних – в обмін на запаси передових компонентів зі старої бази Нацгвардії. Наш вибір – між зброєю для захисту наших саджанців... або індустрією для розквіту. Ми обрали зброю. Бо плуги не врятують світ без рушниці."

CHC_brotherhood_industry:0 "Індустрія Братства"
CHC_brotherhood_industry_desc:0 "§gГлава Мексона§! запропонувала угоду: один із їхніх довоєнних банків даних – в обмін на запаси передових компонентів зі старої бази Нацгвардії. Наш вибір – між захистом посівів і їхнім ростом. Ми обрали індустрію. Бо який сенс захищати світ, якщо він не процвітає?"

CHC_musical_harmony:0 "Музична гармонія"
CHC_musical_harmony_desc:0 "Наші §4сили§! використовувалися колись для §Rзла§! – поневолення, війна, підкорення. Але це не означає, що наш §Hдар§! не може служити добру. Пісня Сирени може надихнути працівників, зменшити §Hбіль§! поранених, заспокоїти §Hдуші§! зневірених. Ми не можемо змінити минуле, але можемо принести §Hсвітло§! в майбутнє."
chcgoodpowerunlocked_tt:0 "Відкриває здатність §HPsychic Harmony§!."

CHC_to_kill_a_god:0 "Вбити Бога"
CHC_to_kill_a_god_desc:0 "§4Матір§! не може лишитись живою. Її вплив вже зробив нас монстрами. Щоб змінити нашу пісню – ми повинні знищити її повністю."

CHC_remove_the_supporters:0 "Вигнати прихильників Матері"
CHC_remove_the_supporters_desc:0 "Ті, хто досі вірить у відродження §4Матері§!, – нечисленні. Їх не переконати. Але ми не будемо їх убивати – вони заслуговують на милість, яку самі відмовляли іншим. Вони підуть у вигнання – в Пустку, що самі допомагали катувати."

CHC_water_from_the_arkansas:0 "Втамувати спрагу світу"
CHC_water_from_the_arkansas_desc:0 "Річка Арканзас забруднена – радіацією, уламками, брудом. Але Нацгвардія мала рішення: машини очищення, якими вони не користувалися. Тепер – ми використаємо їх. Адже вода – це §Hжиття§!. А той, хто несе воду Пустці, несе §Hжиття§!. І трохи кришок теж."

CHC_have_power_will_share:0 "Маємо силу – поділимось"
CHC_have_power_will_share_desc:0 "У нас недостатньо обладнання, щоб §Hочистити§! всі річки в наших землях, але ми все ще можемо знаходити §Hбагатства§! у цих древніх потоках. Електрика, отримана з водяних млинів і збережена у резервуарах, принесе світло, тепло та затишок сотням осель – не лише нашим, а й сусідським. Звісно, якщо зусилля – наші, то й плату нехай сплачують вони."

CHC_return_the_people:0 "Повернути людей"
CHC_return_the_people_desc:0 "На жаль, багато мирних жителів, що жили під захистом Гвардії, були вигнані, коли ми захопили штаб. Тепер вони – §4знедолені§! біженці в сусідніх племенах. Прийшов час запросити їх назад, у нові домівки на тій же землі, з якої ми їх вигнали."

CHC_defensive_works:0 "Оборонні роботи"
CHC_defensive_works_desc:0 "Між нами та нашими сусідами досі є напруження, особливо зі Скреперами на півдні й Пейнтед Роком на заході. Ці рани надто глибокі для лікування словами. Тож краще зміцніти – і чекати неминучої відплати."

CHC_protect_whats_ours:0 "Стояти й відстоювати"
CHC_protect_whats_ours_desc:0 "Ми пройшли надто довгий шлях, аби все було зруйновано ззовні. Ми повинні озброїтись – інакше опинимось §Rпоневоленими§! чужими силами."

CHC_return_the_guardsmen:0 "Повернути гвардійців"
CHC_return_the_guardsmen_desc:0 "Більшість §LГвардії§! загинула у війні. Залишки не зможуть знову керувати територією, але ми можемо запросити їх назад і запропонувати їм роль §Hмиротворців§! у новій державі."
CHC_return_the_guardsmen_tt:0 "До вас приєднаються три повністю екіпіровані підрозділи Гвардії!"

CHC_respect_for_nature:0 "Шана до природи"
CHC_respect_for_nature_desc:0 "§HМир§! і §HПроцвітання§! не здобуваються насиллям. Лише через §Hгармонійне§! співіснування з Пусткою ми зможемо збудувати §Hідилію§!."

CHC_study_project_acapella:0 "Вивчити §HПроєкт ACAPELLA§!"
CHC_study_project_acapella_desc:0 "§HНаче сонце\nЩо будить світанок\nВідбиваючи обіцянки\nВідродження і надії.§!"

CHC_draft_acapella_plans:0 "Розробити план §HПроєкту ACAPELLA§!"
CHC_draft_acapella_plans_desc:0 "§HНе кожен ранок\nприносить світле небо\nІноді я прокидаюсь у відчаї,\nу темряві, що затуляє мої мрії.§!"

CHC_renovate_fort_supply:0 "Реконструкція Форту Саплай"
CHC_renovate_fort_supply_desc:0 "Найкраще місце для §HПроєкту ACAPELLA§! – Форт Саплай. Його відкриті подвір’я й склади легко пристосовуються для генераторів і технічного обладнання."

CHC_buy_parts_from_scrappers:0 "Купити деталі у Скреперів"
CHC_buy_parts_from_scrappers_desc:0 "Деякі компоненти, потрібні для §HПроєкту§!, знаходяться на півдні, в землях Скреперів. §4Неправильно§! буде їх красти – тож спробуємо домовитись: кришки в обмін на запчастини."

CHC_a_fine_deal:0 "Гарна угода"
CHC_a_fine_deal_desc:0 "Скрепери дотримались угоди. Тепер у нас є все необхідне для побудови §HПроєкту ACAPELLA§!"
CHC_parts_acquired_tt:0 "§GМайже всі деталі для Проєкту ACAPELLA зібрано!§!"
goodscrappersflag:0 "Скрепери погодились продати нам деталі для §HПроєкту ACAPELLA§!"

CHC_healthy_trading:0 "Здоровий торг"
CHC_healthy_trading_desc:0 "Тепер, коли Скрепери показали готовність до діалогу, ми можемо налагодити постійну торгівлю. Торгівля – це серце цивілізації."
CHC_trading_starts_tt:0 "§GПочинається торгівля зі Спільнотою Скреперів!§!"

CHC_cheated_scammed_and_robbed:0 "Обдурені, пограбовані й забиті"
CHC_cheated_scammed_and_robbed_desc:0 "§RПокидьки!§! Вони влаштували засідку, вбили наш караван і забрали кришки. Тепер тримають гроші й відмовляються передати деталі!"
badscrappersflag:0 "Скрепери відмовилися від угоди!"

CHC_scour_corroded_fields:0 "Обчистити Іржаві Поля"
CHC_scour_corroded_fields_desc:0 "Скреперська Спільнота зникла. Без деталей ми не змогли б завершити §HПроєкт ACAPELLA§!. Але після такої §Rзради§!, нам не залишилось вибору. Тепер ми просто візьмемо все самі."

CHC_settle_the_stretch:0 "Освоїти Розтяг"
CHC_settle_the_stretch_desc:0 "Скрепери володіли широкими землями. Охопити всі – неможливо. Найкраща ціль – це Розтяг, що має великий індустріальний потенціал."

CHC_settle_chickasha:0 "Освоїти Чикашу"
CHC_settle_chickasha_desc:0 "Спільнота Скреперів займала широкі території, тож повний контроль – недосяжний. Наші найкращі варіанти – це Розтяг або Чикаша. Зосередимось на Чикаші заради її великого обсягу електронного брухту."

CHC_the_issue_of_painted_rock:0 "Проблема Розфарбованої скелі"
CHC_the_issue_of_painted_rock_desc:0 "Наш прогрес над §Hпроєктом§! гальмує сусіднє плем’я Розфарбована скеля. Тепер, коли §4одержимі§! більше не стережуть кордони, їхні напади почастішали. Вони крадуть деталі, припаси, а іноді – навіть людей. Це треба припинити."

CHC_secure_guymon_junction:0 "Закріпитись у Гаймон-Джанкшн"
CHC_secure_guymon_junction_desc:0 "Плем’я Пейнтед Рок мешкає у двох ключових регіонах: Гаймон-Джанкшн на півночі та Спірмен на півдні. Через їхню ворожість, зосередимось лише на одному. Вибір – Гаймон-Джанкшн, з його військовою промисловістю та водою."

CHC_secure_spearman:0 "Закріпитись у Спірмені"
CHC_secure_spearman_desc:0 "Спірмен – другий регіон, що належав Пейнтед Року. Через ворожість місцевих, ми не зможемо утримати обидва. Але Спірмен приваблює нас своїм цивільним виробництвом і багатими покладами металу."

CHC_hire_weaponsmiths:0 "Найняти місцевих майстрів"
CHC_hire_weaponsmiths_desc:0 "Серед войовничих членів Пейнтед Року є майстри-оружейники. Якщо запропонувати їм добру оплату (і трохи вказівок), вони зможуть кувати зброю для нас – а не проти нас."

CHC_build_local_industry:0 "Розвивати місцеву промисловість"
CHC_build_local_industry_desc:0 "Металеві поклади в Спірмені роблять його чудовим кандидатом для будівництва фабрик будматеріалів та товарів споживання."

CHC_build_the_amplifier:0 "Збудувати підсилювач!"
CHC_build_the_amplifier_desc:0 "Деталі для §HПроєкту ACAPELLA§! зібрані, станція у Форт-Надії готова до запуску. Ми наближаємось до §Hспокути.§! Але на нашому шляху стоїть §RБанда Сайферів§! – техноненависники, які знищать нас, якщо дізнаються про проект. §HПідсилювач§! ніколи не буде у безпеці, поки вони існують."
cypherwarning:0 "§GПідсилювач§! буде збудовано, але §RБанда Сайферів§! ворожо відреагує на використання технологій!"

CHC_support_the_brotherhood:0 "Підтримати Братство"
CHC_support_the_brotherhood_desc:0 "З часу нашої §HЗміни Тональності§!, ми не прагнемо війни. Але наші союзники добре знають її жах. Ми повинні всіляко допомагати §gМексону§!, і дозволити їм бути військовим лідером нашого союзу."

CHC_fight_for_ourselves:0 "Боротись самотужки"
CHC_fight_for_ourselves_desc:0 "Ідеї, народ, дім, держава – все це варте захисту. Хоч ми й миролюбні, ми не маємо права залишати наші кордони без нагляду. Ми зобов'язані захищати свій народ."

CHC_all_for_guns:0 "Усе – на зброю"
CHC_all_for_guns_desc:0 "Без справжньої військової традиції, нам доведеться покластись на добровольчі ополчення. Вони будуть добре оплачувані, а народ обдарує їх любов’ю й повагою."
chcnewmilitia:0 "§GВи отримаєте три нові підрозділи Міліції!§!"

CHC_and_guns_for_all:0 "І зброя – для всіх!"
CHC_and_guns_for_all_desc:0 "Ми мало що знаємо про сучасне виробництво, а ті, хто міг би нас навчити – мертві. Наше озброєння буде неякісне. Але краще боротись з рушницею з труб, ніж кулаками."

CHC_peacekeeper_tactics:0 "Тактика Миротворців"
CHC_peacekeeper_tactics_desc:0 "Наша армія повинна, перш за все, підтримувати §4гармонію§! і §4мир.§! Ми не зможемо нести §4співчуття§! світу, якщо в нас панує безлад. Створимо три батальйони Миротворців з кийками й бронею."
chcnewforcers:0 "§GВи отримаєте три нові підрозділи Миротворців!§!"

CHC_recruits_for_maxson:0 "Рекрути для Мексона"
CHC_recruits_for_maxson_desc:0 "Ветерани, колишні рейдери й шукачі пригод – не всі розуміють наш мирний шлях. Але §gМексон§! веде небезпечну боротьбу в Колорадо. Ми спрямуємо цих людей туди, де вони зможуть стати Паладинами й Лицарями."

CHC_maxson_army_drills:0 "Спільні навчання з Мексоном"
CHC_maxson_army_drills_desc:0 "Координація з §gОрденом§! – ключова. Добра воля не зведе мости, а дружба не виграє битви. Ми починаємо регулярні спільні військові навчання з §gМексоном§! вже сьогодні."

CHC_to_see_the_world:0 "Побачити світ"
CHC_to_see_the_world_desc:0 "Ми розвинули абсолютне §4захоплення§! і §4повагу§! до природи, тож не дивно, що багато з нас прагнуть побачити її якомога більше. Та окрім пасивного милування, ми можемо поєднати подорожі з картографією й розвідкою місцевості – що значно покращить наші розвідувальні здібності."

CHC_an_army_of_healers:0 "Армія цілителів"
CHC_an_army_of_healers_desc:0 "Медсестри, бойові медики, лікарі та рятівники – це найшляхетніші ролі на полі бою. Відважно кинутись у небезпеку, щоби зберегти життя – §Hромантична§! та §Hнадихаюча§! ідея. Уже складаються легенди про героїв, як от армійський медик Каспер §B«Вуду»§! Роджерс, що кинувся на гранату, рятуючи поранених ополченців."

CHC_in_defense_of_humanity:0 "§4На захист людства§!"
CHC_in_defense_of_humanity_desc:0 "§4Голуб – це миротворець\nМіж совою та яструбом\nЩо мають різні шляхи війни\nІ похмурі думки§!"

CHC_enlighten_the_cyphers:0 "Просвітити Сайферів"
CHC_enlighten_the_cyphers_desc:0 "Сайфери природно ставляться до нас із підозрою – через наше використання технологій і попередню війну. Зламати їхній луддизм буде непросто, але найбільш прогресивні вже бачать користь від нашого правління."

CHC_activate_project_acapella:0 "§HАктивувати проєкт ACAPELLA§!"
CHC_activate_project_acapella_desc:0 "§HБажаєш, щоб грядущі покоління\nЗвали тебе великим?\nХочеш, щоб творіння твоє\nКрізь віки височіло гордо?\n\nПрислухайся до старої істини –\nСмиренність і самопожертва.\nБудуй, як корал – повільно і в тиші.\nВіддай себе. Лише це вічне.§!"

CHC_an_end_to_cults:0 "Кінець культу"
CHC_an_end_to_cults_desc:0 "Культи, поклоніння стародавнім силам – усе це й завело нас на темний шлях. Лодж не бажає відмовитись від окультизму, тому ми мусимо їх знищити та очистити світ від цього зла."

CHC_spread_the_music:0 "Поширити музику"
CHC_spread_the_music_desc:0 "Проєкт ACAPELLA досягає межі свого впливу. Нам потрібно встановити ретранслятори, щоби поширити сигнал на Вернон і Вічіта-Фоллс."

CHC_the_eagles_nest:0 "Орлине гніздо"
CHC_the_eagles_nest_desc:0 "Авіабаза Кеннон перебувала у занепаді під владою Сайферів. Тепер, коли вона наша, ми можемо відновити злітну смугу, дослідити авіацію й повністю використати її потенціал."

CHC_the_elysian_plains:0 "Елізійські рівнини"
CHC_the_elysian_plains_desc:0 "Наші володіння простягаються від Сімаррона до Бразоса, і ці землі наповнені любов’ю, достатком та процвітанням! Ми більше не просто боязкі колібрі – ми збудували дім, гідний людства!"

scrapperparts:0 "Отримано деталі для проєкту ACAPELLA."