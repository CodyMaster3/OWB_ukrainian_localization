l_english:
  ###Free Speech Events
media_events.1.t:0 "Задиханий чоловік при блідому місячному сяйві"
media_events.1.d:0 "Рівно опівночі радник вривається до передніх дверей, махаючи стосом документів в одній руці та тримаючись за бік іншою. Він сповзає до стіни, намагаючись перевести подих, перш ніж швидко зібратися і наблизитися до наймогутнішої постаті в країні. Заточуючись, він підходить і зсуває зім'яті папери через полірований махагоновий стіл."
media_events.1.a:0 "Що могло того вартувати?"

media_events.101.t:0 "Новини про економічний успіх"
media_events.101.d:0 "Головною темою цього економічного кварталу стало безпрецедентне зростання цивільної економіки по всій нашій території. Аналітичні експерти інформують пресу, що прибутки, зарплати й економічне благополуччя зростають і, як очікується, протримаються принаймні рік. Багато хто приписує цей успіх [ROOT.GetLeader]."
media_events.101.a:0 "[GetCapType] тече рікою!"
media_events.101.b:0 "Інвестувати в торгівлю!"

media_events.102.t:0 "Новий бізнес"
media_events.102.d:0 "Цікава історія надійшла з одного з наших поселень – у місті [our_state.GetCapitalVictoryPointName] новий бізнес привернув увагу місцевих мешканців, і новини про нього навіть дійшли до нашої столиці. Замовлення сиплються з усіх боків, і підприємство стрімко зростає. Вони наймають нових працівників та готують каравани. Залишається лише побачити – це мить слави чи народження нового економічного гіганта."
media_events.102.a:0 "Цікаво..."
media_events.102.b:0 "Скористатися їхніми послугами."
media_events.102.c:0 "Скупити їх, поки не виросли занадто."

media_events.103.t:0 "Місцевий фестиваль"
media_events.103.d:0 "Надходять повідомлення про те, що люди з усієї країни з'їжджаються до одного з малих поселень, щоби долучитися до гучного фестивалю. Кажуть, під час недавнього бою один із наших солдатів знайшов старі платівки разом із чудово збереженим програвачем. Принісши здобич додому, він зібрав друзів на площі, щоби послухати музику. Вже за кілька платівок майже всі в радіусі пів милі були там, і подія швидко перетворилася на імпровізований фестиваль.\n\nПринаймні, так пише в статті – якби не преса, усе вже б вщухло. Але з поширенням новин по країні кількість туристів зростає, приносячи прибутки з усієї округи."
media_events.103.a:0 "Мені б не завадив відпочинок..."
media_events.103.b:0 "Кому б він не завадив?"

media_events.104.t:0 "Про-військовий мітинг"
media_events.104.d:0 "До нас дійшли новини, що один із найбагатших благодійників країни придбав відому, доволі войовничу газету. Ймовірно, це пояснює дивний стрибок популярності останніми тижнями.\n\nХоча за ним варто буде пильно спостерігати, наразі це обернулося на нашу користь – звичайний церемоніальний мітинг потрапив на першу шпальту. Ліпшого початку дня годі й бажати: чорна кава та безкоштовний піар."
media_events.104.a:0 "Запросіть цього хлопця на наступну державну вечерю."
media_events.104.b:0 "Закликати нових добровольців."
media_events.104.c:0 "Попросити нові пожертви."

media_events.105.t:0 "Преса здобула [press_stole_plans.GetAdjective] плани!"
media_events.105.d:0 "Якимось чином журналісти здобули [press_stole_plans.GetAdjective] плани великого наступу. Виявляється, ті самі репортери, що критикують наш славетний уряд, також готові звітувати про дії ворогів. Це яскраве нагадування, що, попри розбіжності, ми всі – [Root.GetNameDef]."
media_events.105.a:0 "Пресу не зупинити. Вони намагалися, ой як намагалися."
media_events.105.a:0 "Подивімося, чого можна навчитися з їхніх стратегій."

media_events.106.t:0 "Публічна критика зовнішньої політики"
media_events.106.d:0 "Останнім часом у місті завелися справжні всезнайки. Купка юнаків вирішила стати голосом змін і запустила незалежну газету, яка існує на кошти громади. Захоплива ініціатива – принаймні, так ми офіційно кажемо.\n\nНасправді ж ця макулатура не робить нічого, окрім як поливає брудом наших хлопців і дівчат на передовій. Якісь ліві балачки про імперіалізм, самовизначення, права людини й інше мотлох, накопаний десь у руїнах бібліотеки. Гнів громадськості на цю газету став гучним, і деякі чиновники вже не витримують тиску."
media_events.106.a:0 "Де ж отой добрий комплект бунтівної броні, коли він так потрібен."
media_events.106.b:0 "Спробуймо поховати їхні історії."

media_events.107.t:0 "Виступ політичного опонента"
media_events.107.d:0 "Недавні зміни в нашій адміністрації були, м’яко кажучи, радикальними. Очікувано, з'явився і політичний спротив – навіть бажаний. Адже наше суспільство завжди розквітало в умовах відкритості й багатосторонності.\n\nАле всього доброго може бути забагато. І голова опозиції – справжній майстер слова, який видав нищівну промову перед захопленим натовпом, розкритикувавши майже кожну з наших останніх політик. Це не було б проблемою, якби не наша (зітхання) жвава медіасцена – тепер це обговорює вся країна. І найближчим часом ця хвиля не вщухне."
media_events.107.a:0 "Якщо він такий сердитий – міг би просто написати листа."
media_events.107.b:0 "Відповісти тим самим."

media_events.108.t:0 "Корупція в [Root.Capital.GetName]"
media_events.108.d:0 "Скандал сколихнув [Root.Getname], коли преса викрила, що деякі з [Root.GetAdjective] лідерів беруть хабарі в обмін на державні послуги. Брамінові фермери, торговці зброєю та інші зловживають нашою країною заради власної вигоди. Багато хто питає – а чи варто вмирати за [Root.GetName], якщо її лідери терплять подібне?"
media_events.108.a:0 "Ми завжди так це робили!"
media_events.108.b:0 "Ми викорінимо цю несправедливість!"

media_events.2.t:0 "Таємна нарада подалі від чужих очей"
media_events.2.d:0 "Дюжина струнких фігур сидить за старим круглим столом під тьмяною лампочкою, що нависає над кімнатою. Відібраний кабінет радників зібрався, щоби донести чутки та новини до виконавчої влади. Їхні звужені погляди видають жагу зробити все, аби піднятися вгору – раніше, ніж хтось інший підтягне драбину за собою."
media_events.2.a:0 "Що у нас на порядку денному сьогодні?"

media_events.201.t:0 "Пісня з фронту"
media_events.201.d:0 "[ROOT.GetAdjective] війська героїчно боролися з нашими ворогами, і один із солдатів склав невеличкий вірш на фронті. Ми можемо транслювати його по всій країні, щоб об'єднати народ заради спільної справи."
media_events.201.a:0 "Забезпечимо, щоб усі почули."
media_events.201.b:0 "Я краще послухаю Inkspots."

media_events.202.t:0 "Покарання злочинця"
media_events.202.d:0 "Ще один підпільний друкований орган приборкано. Цього разу ті, хто його вів, дали справжній бій: один офіцер загинув, ще двоє поранені. Сумна втрата, але виявилось, що вони пов'язані з масштабною мережею контрабанди зброї.\n\nЩодо вбивць – це справа проста. Їх страчують і тіло виставляють на показ у найбільшому поселенні з описом злочинів. Це має змусити задуматися всіх, хто тихо сумнівається в нашій владі."
media_events.202.a:0 "Такі видовища мають здатність збурювати маси."
media_events.202.b:0 "А ще ми можемо конфіскувати їхнє майно."
media_events.202.c:0 "Більше того – зробімо з цього навчання."

media_events.203.t:0 "Місцевий фестиваль"
media_events.203.d:0 "Хлопці з відділу пропаганди справді перевершили себе. Звісно, «День полеглих героїв» завжди був широко відзначеним святом – з прикрасами й пишними нарядами з нашого перевіреного державного магазину. Не зневажатимеш же мученика, правда?\n\nФактично, це дає неабиякий поштовх для місцевої економіки. Але якщо ми хочемо зберегти це дійство на роки вперед – не можна дозволити людям перевикористовувати костюми. Може, випустити пресреліз із «якісними кутовими магазинчиками»?"
media_events.203.a:0 "Хто б знав, що брендинг – така морока."
media_events.203.b:0 "Але ж як воно того варте."

media_events.204.t:0 "Антиворожа трансляція"
media_events.204.d:0 "Хоча в столиці все відносно спокійно, на околицях назріває заворушення. Агітатори виходять з себе через останні військові дії. За деякими звітами, вони навіть у змові з сусідніми ворогами. Таке ми терпіти не будемо.\n\nБунтівники будуть покарані, але ось їхні нісенітниці – так просто не заглушити. Тому ми запускаємо кампанію контрінформації, використовуючи всі доступні канали. Наступного тижня іншої Правди не існуватиме."
media_events.204.a:0 "Це ж на їхнє благо."
media_events.204.b:0 "Конфлікт лише загартовує нас."
media_events.204.c:0 "Може, їм треба побачити все на власні очі."

media_events.205.t:0 "Освіта нових громадян"
media_events.205.d:0 "Наша остання кампанія залишила армію й економіку виснаженими, а способів залатати дедалі гіршу нестачу людей – майже немає. Ну, майже.\n\nЗ новими завойованими територіями приходить не лише земля і ресурси, а й люди. Люди, які, скажімо прямо, можуть не горіти бажанням допомагати окупаційній владі. Але вони не мають про це знати – для них ми маємо бути визволителями, які ризикують собою, щоби позбавити їх від гніту тиранів. Все, чого ми просимо – трохи вдячності та краплю працьовитості."
media_events.205.a:0 "Посміхніться й тримайте спину рівно."
media_events.205.b:0 "Та вони ще й винні нам."
media_events.205.c:0 "З часом, наш шлях переможе."

media_events.206.t:0 "Антивоєнний мітинг"
media_events.206.d:0 "Зростаючі втрати в останньому конфлікті не залишилися непоміченими громадськістю. Без незалежної преси чи альтернативних джерел новин, напруга лише зростала – й зрештою вибухнула. Сьогодні вранці сотні наших громадян вийшли на вулиці, протестуючи проти «безглуздого кровопролиття» – як вони кажуть.\n\nКороткозора думка, яку вони ще відчують на власній шкурі. Та жодна переосвіта не компенсує майже добу простою на фабриках."
media_events.206.a:0 "Та це ж все – заради їхнього блага!"
media_events.206.b:0 "Ми відкриємо їм очі."

media_events.207.t:0 "Припинено діяльність незаконної друкарні"
media_events.207.d:0 "Що тут у нас?\n\nПізно ввечері силовики доповіли про успішну операцію з викриття підпільного зібрання політичних радикалів. Виявилось, що ті вели незаконну друкарню, поширюючи брошури з закликами до повстання проти глави держави. І все це вже кілька місяців!\n\nМашини знищено на місці. А от щодо учасників... Деяких із прірви вже не повернеш."
media_events.207.a:0 "Вони знали, на що йдуть."
media_events.207.b:0 "І ми – теж."

media_events.208.t:0 "Ворожа свобода слова спокушає наших громадян"
media_events.208.d:0 "З фронту надходять повідомлення про ворожі радіотрансляції, які проникають у наші тили, розхитуючи бойовий дух солдатів. Нова музика, балачки, інтерв’ю з полоненими – словом, слуховий еквівалент довоєнних цукерок: суцільний смак і жодної користі. А як наслідок – і рання смерть.\n\nСправді, все більше солдатів лізуть через окопи – щоби дезертирувати! Неймовірно. Якщо для них кілька треків Ink Spots важливіші за життя побратимів – може, й добре, що вони пішли."
media_events.208.a:0 "Де вони взагалі ті записи знайшли?"
media_events.208.b:0 "Глушити сигнали, обірвати ефір."

government_events.1.t:0 "Прибутки від торгівлі хімікатами"
government_events.1.d:0 "Джет, Баффаут, Псайко, Ментати, Дедді-О, Дей Тріппер, навіть старий добрий марихуан – які б хіми ми не дозволяли, вони зараз розходяться на ура (сподіваємось, не в буквальному сенсі). Обкладання податком, доля від продажів, або навіть хімтуризм – як би там не було, наші скарбниці сьогодні повніші.\n\nМи отримуємо прибуток із цього прибуткового ринку – і можемо вкласти його в розвиток держави."
government_events.1.a:0 "Дай спробувати!"
government_events.1.b:0 "Розумний продаж – розумні прибутки."