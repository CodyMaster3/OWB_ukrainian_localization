l_english:
startup.2.t:0 "Кампанія Легіону"
startup.2.d:0 "Для гравця кампанія Легіону в ранній грі OWB може здаватися занадто легкою, особливо в порівнянні з усіма завоюваннями й випробуваннями, що постають перед Легіоном до зіткнення з НКР. Це зумовлено таймінгами та алгоритмами ШІ, який іноді ледве справляється навіть із базовими конфліктами. Посилення цих націй, що стануть на шляху війни, може зробити кампанію Цезаревого Легіону значно цікавішою – без жодного ослаблення самого Легіону. Якщо у вас є бодай трохи досвіду гри в HOI4 – настійно рекомендується ввімкнути наступну опцію."
startup.2.a:0 "Посилити НКР і племена"
startup.2.b:0 "Посилити лише племена"
startup.2.c:0 "Я боягуз, мені так норм."

enhanced_legion_campaign:0 "Посилена кампанія Легіону"
enhanced_legion_campaign_desc:0 "Гравець вирішив забезпечити Легіону повноцінну кампанію завоювань, яка може включати цю націю."

startup.3.t:0 "Кампанія НКР"
startup.3.d:0 "Для гравця кампанія НКР у ранній грі OWB може здаватися надто простою, враховуючи всі завоювання й виклики, що мають з’явитися до конфлікту з Легіоном. Це знову ж таки пов’язано з послідовністю дій ШІ, який навіть із базовими конфліктами не завжди справляється. Посилення націй, що стануть на шляху Республіки, дозволить створити цікавіший ігровий досвід без зменшення сили самої НКР. Якщо у вас є хоч трохи досвіду в HOI4 – радимо обрати наступну опцію."
startup.3.a:0 "Посилити Легіон і решту"
startup.3.b:0 "Посилити лише інші нації"
startup.3.c:0 "Я боягуз, мені й так весело."

enhanced_ncr_campaign:0 "Посилена кампанія НКР"
enhanced_ncr_campaign_desc:0 "Гравець вирішив забезпечити НКР повноцінну кампанію завоювань, яка може включати цю націю."
