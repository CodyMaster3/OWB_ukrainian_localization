ROL_BANICH_NAME:0 "Богдан Адамович"
ROL_BANICH_DESC:0 "Богдан живе за простим і чистим кодексом, якого очікує й від інших: бути чесним і справедливим, допомагати ближньому без очікування винагороди, та практикувати не гордість, а стриманість у всьому. Цей кодекс добре служить Старовірам – як у стосунках між собою, так і з чужинцями. Щира та віддана віра Богдана в Бога принесла йому глибоку повагу громади, і він говорить із авторитетом суворого, але турботливого батька. У часи кризи до нього звертаються по пораду – а в добу чудовиськ і радіації нова криза завжди за рогом."