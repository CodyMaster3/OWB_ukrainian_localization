l_english:
 # Decisions #
  produce_consumer_goods_wtt:0 "Виробляти Споживчі Товари"
  produce_consumer_goods_desc_wtt:0 "Хоча військова машина є життєво важливою для нашого виживання, людям також потрібні розкоші. Перемкнувши частину нашої уваги на споживчий сектор, ми зможемо підвищити їхню підтримку нашої влади."

  prioritise_living_standards:0 "Пріоритет Життєвим Стандартам"
  prioritise_living_standards_desc:0 "Не буде перебільшенням сказати, що наші люди живуть у хороших умовах. Вони — ні. Народ потребує турботи й уваги з нашого боку, краще зараз, ніж пізніше! Зміни будуть повільними, але з часом ми досягнемо стабільного суспільства."

  research_consumer_tech:0 "Пріоритет Споживчим Технологіям"
  research_consumer_tech_desc:0 "Наш відділ досліджень та розробок має надзвичайне значення для нашої держави. Він розробляє нову зброю й броню, оновлює старе та модифікує те, що ми знаходимо в пустці. Можливо, варто частину бюджету Розробок спрямувати на те, чого хочуть люди, а не тільки військові."

  basic_hygiene_education:0 "Навчання Основам Гігієни"
  basic_hygiene_education_desc:0 "Люди забули гігієну старого світу. Через це хвороби ширяться мов пожежа, а умови життя подібні до свинарників. Ми повинні виділити трохи нашого дорогоцінного часу на навчання людей кращим гігієнічним практикам!"

  focus_on_internal:0 "Сфокусуватись на Внутрішніх Питаннях"
  focus_on_internal_desc:0 "Населення не має великого бажання до постійних війн — вони прагнуть, щоб ми зосередились на внутрішніх справах, аби покращити їхнє повсякденне життя. Можливо, час прислухатись."

  purge_elites:0 "Вигнати Пройдисвітів"
  purge_elites_desc:0 "Керівне коло розрослося з моменту нашого приходу до влади, аби ефективно керувати країною. Але серед еліти є ті, хто не відданий справі, а лише кар'єристи. Вони використовують наш рух задля власної вигоди — настав час позбутись їх. Народ, без сумніву, підтримає це рішення."

  militarized_society:0 "Мілітаризувати Суспільство"
  militarized_society_desc:0 "Нехай війна отримає ще більше підтримки завдяки подальшій мілітаризації нашого суспільства. Це зробить народ готовішим до оборони й більш прихильним до наших наступальних кампаній."

  basic_training_appointments:0 "Призначити Інструкторів Початкової Підготовки"
  basic_training_appointments_desc:0 "Хоча зараз у нас мир, час настане, коли буде потрібно мати постійну армію. Ми повинні призначити наших досвідчених офіцерів і героїв війни на посади інструкторів, аби прискорити процес навчання та зробити його ефективнішим."

  promise_of_loot:0 "Обіцянка Трофеїв"
  promise_of_loot_desc:0 "Якщо є щось, за що наш народ готовий битися, то це — матеріальна винагорода. У війні багато здобичі — якщо ми нагадаємо їм про це, вони точно підтримають будь-який наш конфлікт."

  mobilise_people:0 "Мобілізувати Народ"
  mobilise_people_desc:0 "Нам потрібно більше людей в армію — і негайно. Починаємо кампанію мобілізації, щоб якнайшвидше поповнити резерви."

  patriotic_boost:0 "Скористатись Патріотизмом"
  patriotic_boost_desc:0 "Перша війна почалась, і наш народ сповнений завзяття до нашої справи. Ми можемо скористатися цим підйомом — люди швидше йтимуть під наші знамена та будуть підтримувати нас, хоч з часом ця підтримка й ослабне!"

  extend_mil_production:0 "Надзвичайне Військове Виробництво"
  extend_mil_production_desc:0 "У цей час війни ми можемо залучити споживчі фабрики для тимчасового підсилення збройного виробництва. Люди будуть бурчати, але зараз потрібні не їхні симпатії, а зброя."

  focus_mil_research:0 "Розширити Військові Дослідження"
  focus_mil_research_desc:0 "Щоб виграти війну, ми повинні випередити ворога в дослідженнях. Потрібно спрямувати додаткові ресурси на науку, навіть якщо це зашкодить цивільним проектам."

  encourage_weapon_production:0 "Заохотити Виробництво Зброї"
  encourage_weapon_production_desc:0 "Більше зброї! Улюблена фраза нашого керівництва під час цієї війни. Замість того, щоб навантажувати наші фабрики, ми повинні заохочувати людей створювати зброю на своїх робочих столах заради спільної справи!"

  __territory_disputes:0 "Територіальні Суперечки"
  __territory_disputes_desc:0 "Коли плани довгострокового завоювання зазнають краху через іншу державу, вона може вимагати повернення спірних територій. Невиконання такої вимоги — виправдана причина для війни."

  demand_stolen_territory:0 "Вимагати Наші Законні Території"
  demand_stolen_territory_desc:0 "Вони вкрали те, що законно належить нам! Ми висунемо ультиматум із вимогою повернути всі спірні землі, або ж заберемо їх силою."

  return_stolen_territory_timer:0 "§RКінцевий Термін Ультиматуму§!"
  return_stolen_territory_timer_desc:0 "Ми повинні повернути всі спірні території до цієї дати, інакше отримаємо війну."

  return_stolen_territory_timer_demand_sender:0 "Кінцевий Термін Ультиматуму"
  return_stolen_territory_timer_demand_sender_desc:0 "Якщо вони не повернуть наші законні території до встановленого терміну, ми матимемо виправдання для війни."

  return_stolen_territory:0 "Повернути Спірні Території"

  drastic_measures:0 "Рішучі Заходи"
  drastic_measures_desc:0 "Іноді безпринципні дії необхідні для збереження справедливості. Іноді — це чисте зло. А часом рейдерам просто хочеться повеселитися."

  seize_property_generic:0 "Вилучити Цивільну Зброю"
  seize_property_generic_desc:0 "Кожен фермер має рушницю, аби відганяти настирливих диких звірів. Але у скрутні часи ми можемо забрати цю зброю для озброєння наших солдатів. Не те щоб фермер міг щось вдіяти, окрім як голосно обурюватись."

  seize_property_raider:0 "Вилучити Зброю Рейдерів"
  seize_property_raider_desc:0 "У рейдерів зброя всюди — схована в печерах, притулках, де завгодно. Саме час скористатися цими таємними запасами."

  ballot_draft_settler:0 "Призов за Жеребкуванням"
  ballot_draft_settler_desc:0 "Відчайдушні часи — відчайдушні заходи. Іноді єдиний спосіб отримати боєздатних солдатів — це примусовий призов. Ті, кому випаде коротка соломинка, допоможуть нам дожити до світлого майбутнього."

  call_to_raid:0 "Заклик до Нападу"
  call_to_raid_desc:0 "Ще один типовий день для рейду."

  ruthless_drills:0 "Жорсткі Навчання"
  ruthless_drills_desc:0 "Ми можемо прискорити підготовку військ, аби вони були готові будь-якої миті. Але ціною цього стане нехтування технікою безпеки, що матиме свої наслідки."

