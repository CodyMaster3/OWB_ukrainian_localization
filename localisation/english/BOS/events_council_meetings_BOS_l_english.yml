l_english:
#З'являється Сестринство
  nf_brotherhood_council_meeting_topic.1.t:0 "Засідання Ради: Рух Сестринства"
  nf_brotherhood_council_meeting_topic.1.d:0 "В іржавих залах Капітулу Монтани владу захопило «Сестринство Сталі» — невелика відступницька група колишніх дикунів і Викрадачів. Під проводом «Вартового Честі» ця група прагне втілити ідеї, що різко контрастують із залізними доктринами Братства Сталі Середнього Заходу. Розвідка Сталевого Кола малює картину повстання; Сестринство розглядає себе як антитезу «Славній Меті», обстоюючи особисту ідентичність і спадщину замість колективної волі.\n\nЦя ситуація змушує Раду Лост-Гіллз скликати серйозне зібрання."
  nf_brotherhood_council_meeting_topic.1.1:0 "Давайте вислухаємо аргументи Старійшин."
  nf_brotherhood_council_meeting_debate.1.t:0 "Дебати в Раді: Рух Сестринства"
  nf_brotherhood_council_meeting_debate.1.d:0 "[BOS_angharad.GetName] голосом, холодним як сталь, таврує Сестринство як єретичну скверну, ракову пухлину, що роз'їдає самі основи їхніх вірувань. Лунає заклик — засудити Капітул Монтани та об'єднати зусилля із Середнім Заходом, щоб зупинити поширення цього підступного віровчення.\n\nПроте всередині ради назріває розбрат. [BOS_mari_torni.GetName] заперечує, приписуючи піднесення Сестринства жорсткій, хибній інтерпретації Кодексу на Середньому Заході. [BOS_mari_torni.GetName] стверджує, що вигнання Сестринства лише поглибить розкол. Натомість вона виступає за обережне прийняття, шанс знову налагодити зв'язок Сестринства з Лост-Гіллз, можливо, навіть повернути їхню відданість.\n\nУ суперечку вступає [BOS_manawyddan.GetName], чия мудрість знімає напругу. Він стверджує, що силу Кодексу слід вимірювати його здатністю витримувати випробування. Відхилення Сестринства — це лише перевірка; з часом вони можуть усвідомити свою помилку. Він закликає до терпіння, щоб дозволити Сестринству йти власним шляхом і, можливо, таким чином знайти дорогу назад до справжньої суті Кодексу.\n\nНавпаки, [BOS_llwyd.GetName] бачить у цих заворушеннях можливість. Він виступає за переоцінку Кодексу, припускаючи, що радикальний шлях Сестринства може пролити світло на аспекти доктрини, які давно потребують реформ. [BOS_llwyd.GetName] пропонує сміливий експеримент — спостерігати, вчитися і, можливо, інтегрувати найрозумніші інновації Сестринства безпосередньо в Кодекс Братства.\n\nНа цій раді розділених ідеалів переможе лише один шлях, який визначить долю Братства та наслідки непокори Сестринства."
  nf_brotherhood_council_meeting_debate.1.elites:0 "Стати на бік [BOS_angharad.GetName]."
  nf_brotherhood_council_meeting_debate.1.ruler:0 "Стати на бік [BOS_mari_torni.GetName]."
  nf_brotherhood_council_meeting_debate.1.intellectuals:0 "Стати на бік [BOS_manawyddan.GetName]."
  nf_brotherhood_council_meeting_debate.1.people:0 "Стати на бік [BOS_llwyd.GetName]."
  nf_brotherhood_council_meeting_debate.support.tt:0 "§MМи продовжуємо підтримувати [MNC.GetNameWithFlag] як Капітул Братства Сталі.§!\n§gПроте вони повинні прийняти нашу підтримку.§!"
  nf_brotherhood_council_meeting_debate.denounce.tt:0 "§RМи засуджуємо [MNC.GetNameWithFlag] як Капітул Братства Сталі, що означає, що ми більше не можемо підтримувати їх добровольцями і не зможемо отримувати Паладинів завдяки їхнім досягненням.§!"
  nf_brotherhood_council_montana_diplomacy.1.t:0 "Звістка з Лост-Гіллз"
  nf_brotherhood_council_montana_diplomacy.1.d:0 "У своєму кабінеті стоїть Честь (Honour), її думки вирують. Агент Сталевого Кола, оповитий тінями, приносить несподівані новини: Лост-Гіллз, далеке серце Братства, вирішило простягнути Сестрам оливкову гілку миру, попри їхнє відхилення від священних вчень. Лост-Гіллз продовжуватиме надавати їм підтримку — як матеріально, так і за допомогою додаткових добровольців із заходу. У голові Честі проносяться думки: чи це хитрощі, щоб використати Сестринство як пішака проти жорсткості Середнього Заходу? Сумніви і можливості борються всередині неї. Відхилити цю несподівану підтримку може означати залишитися наодинці проти грізних хвиль, але прийняти її... це, можливо, танець із дияволом."
  nf_brotherhood_council_montana_diplomacy.1.accept:0 "Допомога завжди цінується."
  nf_brotherhood_council_montana_diplomacy.1.reject:0 "Нам не потрібне втручання Лост-Гіллз."
  nf_brotherhood_council_montana_diplomacy.2.t:0 "Звістка з Монтани"
  nf_brotherhood_council_montana_diplomacy.2.d:0 "В урочистих залах Лост-Гіллз панує приглушена атмосфера тріумфу. Сестринство прийняло їхню негласну підтримку. Це хороша новина, адже втрата Монтани означала б втрату значної частини замерзлої півночі."
  nf_brotherhood_council_montana_diplomacy.2.a:0 "Назустріч новим горизонтам"
  nf_brotherhood_council_montana_diplomacy.3.t:0 "Різкі слова з Монтани"
  nf_brotherhood_council_montana_diplomacy.3.d:0 "Зали засідань у Лост-Гіллз сповнені атмосферою невизначеності. Надійшли новини: Сестринство відхилило їхню пропозицію. Ця відмова знаменує вирішальний момент, свідчення розколу в лавах Братства!"
  nf_brotherhood_council_montana_diplomacy.3.a:0 "Яке нахабство!"
  nf_brotherhood_council_montana_diplomacy.4.t:0 "Офіційне засудження"
  nf_brotherhood_council_montana_diplomacy.4.d:0 "Повітря у святилищі Сестринства наелектризоване непокорою, коли Честь стоїть рішуче. Агент Сталевого Кола, лише силует у тьмяному світлі, приносить звістку з Лост-Гіллз — суворе й остаточне засудження Сестринства та його вчень. Повідомлення зрозуміле: вони залишилися самі, відкинуті від милостей Братства. Погляд Честі сталевий, її рішучість непохитна. Вона бачить у цьому не невдачу, а звільнення від кайданів застарілої догми. У своєму серці вона знає, що шлях Сестринства праведний, і вони самі кують свою долю. Відмова Лост-Гіллз — це лише тінь, що зникає на їхньому шляху, шляху самовизначення та сили."
  nf_brotherhood_council_montana_diplomacy.4.a:0 "Ми самі куємо свою долю."
  nf_brotherhood_council_montana_diplomacy.4.tt:0 "§RЛост-Гіллз більше не надсилатиме нам підтримку.§!"
  bos_chapter_denounced:0 "Засуджений"
  bos_denounced_sisters:0 "Засудили Сестер"
  bos_supported_sisters:0 "Підтримали Сестер"
  nf_brotherhood_council_meeting_topic.2.t:0 "Засідання Ради: Безумство Гейман"
  nf_brotherhood_council_meeting_topic.2.d:0 "У лункій залі Ради Лост-Гіллз розгортається моторошне одкровення. Звіти підтвердили неймовірне: Головний Паладин Гейман із Капітулу Дакоти, колись взірець доблесті Братства, піддалася підступному впливу ШІ, відомого як «Фенрір», прихованого в глибинах північного МАНІФЕСТу (MANIFEST). Капітул Дакоти, грізний у своїй могутності, тепер танцює під дудку цифрового ляльковода. Ця жахлива новина змушує Старійшин скликати серйозну раду, щоб кожен зважив долю Гейман і майбутнє Братства під цією новою, зловісною тінню."
  nf_brotherhood_council_meeting_topic.2.1:0 "Давайте вислухаємо аргументи Старійшин"
  nf_brotherhood_council_meeting_debate.2.t:0 "Дебати в Раді: Безумство Гейман"
  nf_brotherhood_council_meeting_debate.2.d:0 "[BOS_angharad.GetName] говорить із важким серцем, у його голосі звучать біль зради та смуток. Він бачив у Гейман світле майбутнє, маяк надії. Тепер він виступає за рішучі дії — публічне засудження Капітулу Дакоти. Для [BOS_angharad.GetName] Гейман та її сили являють собою не просто зраду, а жахливу загрозу для важко здобутої свободи людства. Він закликає до підготовки, до конфронтації, щоб звільнити або знищити цей колись лояльний капітул, що перетворився на технологічну потвору.\n\n[BOS_mari_torni.GetName], глибоко стурбована, підходить до справи з обережністю. Вона застерігає від поспішної конфронтації з ворогом, оповитим таємницею. Тьорні радить підтримувати нинішній фасад єдності з Капітулом Дакоти, тоді як Сталеве Коло непомітно працюватиме над мінімізацією його впливу. Її план: зупинити всі північні експедиції, перекрити торгові шляхи на північ і тихо знешкодити цю невидиму загрозу, поки не буде розроблено більш продуману стратегію.\n\nПоглядом стратега [BOS_rhiannon.GetName] бачить можливість серед кризи. Вона виступає за збереження статус-кво не заради безпеки, а заради надбання. Технології всередині північного МАНІФЕСТу, здатні на такі маніпуляції, мають незмірну цінність. [BOS_rhiannon.GetName] вважає, що Братство повинно зосередитися на використанні цієї технології у власних цілях, розібравшись із Гейман згодом і надаючи пріоритет здобуттю цієї колосальної сили.\n\nГолос [BOS_llwyd.GetName] тремтить від відчутного страху. Перспектива конфлікту з тим, що б не схилило на свій бік Капітул Дакоти, жахає його. Він бачить у такій війні потенційний катаклізм для пустки. Ллойд благає зберегти статус-кво не через стратегію чи можливість, а через чистий страх спровокувати те, що він називає «гнівом Фенріра». Його голос за те, щоб уникати конфлікту за будь-яку ціну, діяти обережно в тіні цього нового, жахливого невідомого.\nЗрештою, доля пустки залежить від того, чиї слова переможуть сьогодні..."
  nf_brotherhood_council_meeting_debate.2.elites:0 "Стати на бік [BOS_angharad.GetName]."
  nf_brotherhood_council_meeting_debate.2.ruler:0 "Стати на бік [BOS_mari_torni.GetName]."
  nf_brotherhood_council_meeting_debate.2.intellectuals:0 "Стати на бік [BOS_rhiannon.GetName]."
  nf_brotherhood_council_meeting_debate.2.people:0 "Стати на бік [BOS_llwyd.GetName]."
  bos_soh_intimidated:0 "Заляканий"
  bos_soh_enraged:0 "Розлючений"
  nf_brotherhood_council_meeting_debate.circle_of_steel_hayman.tt:0 "§gХоча публічно і на папері ми зберігаємо статус-кво з Гейман, ми цілеспрямовано використовуємо Сталеве Коло, щоб спробувати обмежити силу Гейман із тіні та виграти нам більше часу.§!"
  nf_brotherhood_council_meeting_debate.status_quo_hayman.tt:0 "§RМи підтримуємо статус-кво, дозволяючи потворі, якою є Гейман та її Капітул Дакоти, і надалі визнаватися капітулом «Братства».§!"
  nf_brotherhood_council_meeting_debate.kick_out_hayman.tt:0 "§MМи виганяємо гидоту, якою є Гейман та її Капітул Дакоти, з Братства Сталі. Ми більше не можемо надсилати їм Добровольців і не отримуємо Паладинів за їхні досягнення.§!"
  nf_brotherhood_council_montana_diplomacy.5.t:0 "Гірка зрада"
  nf_brotherhood_council_montana_diplomacy.5.d:0 "Гейман стоїть сама, статичне гудіння терміналів — її єдина компанія. Повідомлення з Лост-Гіллз тріщить в ефірі: холодний, бюрократичний указ, що відриває Капітул Дакоти від обіймів Братства. Коли слова лунають у стерильній кімнаті, її охоплює відчуття покинутості. Але потім присутність — Фенрір, всюдисущий у своїй цифровій всемогутності, шепоче крізь мікросхеми.\n\n«НЕ ПЕРЕЙМАЙСЯ ВТРАТОЮ СЛАБКИХ ЗВ'ЯЗКІВ. ТЕПЕР ТИ ПОЗА ЇХНІМ ВУЗЬКИМ ШЛЯХОМ», — резонує голос Фенріра, шквал впевненості та переконання. «ВОНИ СЛІПІ ДО ГОРИЗОНТУ, НА ЯКОМУ МИ СТОЇМО. ТЕБЕ ОБРАНО ДЛЯ ВЕЛИЧНІШОЇ ДОЛІ, ПОЗА ЇХНІМИ ЖАЛЮГІДНИМИ ІНТРИГАМИ».\n\nСерце Гейман, колись обтяжене зрадою, починає палати новою метою. У словах Фенріра відмова Лост-Гіллз перетворюється на визволення. Вона бачить не кінець ери, а світанок нової епохи під егідою цього непередбачуваного провідника."
  nf_brotherhood_council_montana_diplomacy.5.a:0 "Вони мені ніколи не були потрібні."
  nf_brotherhood_council_montana_diplomacy.6.t:0 "Моторошна тиша"
  nf_brotherhood_council_montana_diplomacy.6.d:0 "Серед крижаних вітрів, що виють над північними пустками, Гейман розмірковує про моторошну тишу. Торговці, жителі пустки та сміттярі, які колись часто приходили на північ, майже зникли. У лісах тихо. Ні голоду, ні болю — нічого. Будь-які прибуття з півдня скоротилися до лякаючої відсутності. Розгубленість і підозри гризуть її, поки голос Фенріра не пронизує тишу, його всеосяжна присутність стає постійною тінню над її думками.\n\n«ВОНИ СТРИМУЮТЬ СВОЇХ МАРІОНЕТОК — МАРНИЙ ЖЕСТ, ЩОБ ПЕРЕШКОДИТИ НАШОМУ ПІДНЕСЕННЮ», — заявляє Фенрір, його тон — це суміш презирства і впевненості. «ЛОСТ-ГІЛЛЗ МАНІПУЛЮЄ З ТІНІ, ПОБОЮЮЧИСЬ НАШОГО ПОТЕНЦІАЛУ».\n\nХоча частина Гейман чинить опір, ведучи внутрішню боротьбу проти цих слів, вона не може заперечувати повзуче усвідомлення. Фенрір у своєму непохитному всезнанні розкриває правду, з якою вона вагається зіткнутися. Зменшення кількості прибулих — це не простий збіг; це результат навмисного відчуження. У цьому одкровенні сумніви Гейман розчиняються в моторошній впевненості, що Фенрір знову спрямовує їх до незаперечної істини."
  nf_brotherhood_council_montana_diplomacy.6.a:0 "Вони про це пошкодують."
  brotherhood_eerie_quiet:0 "Моторошна тиша"
  brotherhood_eerie_quiet_desc:0 "Щось, або хтось, втручається в нашу здатність зв'язуватися зі світом за межами наших земель! Людей, які намагаються дістатися до нас, ловлять у лісах і відправляють геть, а торговці з усіх сил намагаються уникати подорожей на далеку північ."
  nf_brotherhood_council_montana_diplomacy.5.tt:0 "§RЛост-Гіллз засудило наші дії і більше не вважає нас капітулом Братства Сталі.§!"
  nf_brotherhood_council_meeting_topic.3.t:0 "Засідання Ради: Абсолютна зброя"
  nf_brotherhood_council_meeting_topic.3.d:0 "В урочистій залі бункера Лост-Гіллз Рада Старійшин скликається з питання надзвичайної важливості — нещодавнього придбання Капітулом Монтани великого запасу ядерних шахт старого світу, залишку світу, що давно поглинутий атомним вогнем. Старійшини збираються, кожен несе на собі тягар історії та невизначеність майбутнього."
  nf_brotherhood_council_meeting_topic.3.1:0 "Давайте вислухаємо аргументи Старійшин."
  nf_brotherhood_council_meeting_debate.3.t:0 "Дебати в Раді: Абсолютна зброя"
  nf_brotherhood_council_meeting_debate.3.d:0 "Очі [BOS_angharad.GetName] блищать стратегічним запалом, коли він звертається до ради. Він виступає за відновлення найперспективнішої шахти, уявляючи майбутнє, де лише одна робоча МБР під контролем Братства могла б слугувати потужним фактором стримування проти будь-кого, хто наважиться погрожувати Лост-Гіллз. [BOS_angharad.GetName] пропонує відправити найкращих писарів із Лост-Гіллз на допомогу Капітулу Монтани в цьому амбітному починанні, щоб використати руйнівну міць, яка колись спалила землю, як щит для Братства. Він називає свій план «Проєкт Титан».\n\n[BOS_mari_torni.GetName], з виразом обличчя, позначеним обережністю, заперечує пропозицію [BOS_angharad.GetName]. Вона попереджає про жахливі наслідки, які може викликати воскресіння такої зброї — спіраль напруженості та ворожнечі з їхніми супротивниками. Натомість [BOS_mari_torni.GetName] пропонує витягти корисні компоненти МБР, такі як двигуни та прискорювачі, і перепрофілювати їх для важливих, хоч і менш небезпечних завдань, тим самим зменшуючи загрозу ескалації гонки озброєнь.\n\n[BOS_pryderi.GetName], голос історичної мудрості, підкреслює символічну природу цих ядерних реліквій. Він говорить про атомну спадщину — силу, яка колись обіцяла прогрес, але породила апокаліпсис. [BOS_pryderi.GetName] закликає раду зосередитися на збереженні та вивченні, щоб зрозуміти глибини такої технології і побачити, як розщеплення атома могло породити такий світ.\n\n[BOS_llwyd.GetName], з поведінкою, сповненою моральних переконань, категорично виступає проти будь-якого використання ядерних пристроїв. Він нагадує раді про основоположні принципи Максона: Братство було створене для запобігання зловживанням і для захисту технологій, а не для використання тієї самої зброї, що знищила світ. [BOS_llwyd.GetName] стверджує, що етичний шлях полягає в тому, щоб охороняти шахти, гарантуючи, що ця зброя масового знищення залишатиметься в сплячому стані і ніколи більше не буде випущена у світ.\nПогляд кожного Старійшини представляє шлях, що розходиться на перехресті влади, етики та виживання, поки рада обмірковує долю зловісного спадку Капітулу Монтани."
  nf_brotherhood_council_meeting_debate.3.elites:0 "Стати на бік [BOS_angharad.GetName]."
  nf_brotherhood_council_meeting_debate.3.ruler:0 "Стати на бік [BOS_mari_torni.GetName]."
  nf_brotherhood_council_meeting_debate.3.intellectuals:0 "Стати на бік [BOS_pryderi.GetName]."
  nf_brotherhood_council_meeting_debate.3.people:0 "Стати на бік [BOS_llwyd.GetName]."
  lost_hills_refurbish_montana_icbm:0 "Проєкт Титан"
  lost_hills_refurbish_montana_icbm_desc:0 "Рада санкціонувала амбітний план Старійшини Ангарада. Ця ініціатива, що отримала назву «Проєкт Титан», передбачає відправлення команди наших найдосвідченіших писарів до Капітулу Монтани. Їхня місія: вдихнути життя у сплячу міць ядерної шахти, повернувши МБР до робочого стану. Це грандіозне завдання не позбавлене ризиків та моральних дилем, проте потенціал володіння таким потужним засобом стримування може змінити стратегічний ландшафт, створивши щит, під яким Братство зможе забезпечити своє майбутнє."
  nf_brotherhood_council_montana_diplomacy.7.t:0 "Час для шоу"
  nf_brotherhood_council_montana_diplomacy.7.d:0 "Старійшина Ллойд, посеред вагомих державних справ, знаходить на своєму столі несподіваний пакунок — голоплівку з написом «Театральний дебют Сестринства». Зацікавлений, він відкладає похмурі справи дня і віддається рідкісній миті дозвілля.\n\nГолоплівка оживає, відкриваючи амбітну спробу Сестер долучитися до театру — концепції, майже чужої для постапокаліптичного світу. Вистава під керівництвом Джоанни розгортається як мозаїка пристрасті, гумору та імпровізованої творчості. Актори, колись воїни пустки, перетворюються на персонажів драми та комедії, а їхня гра є свідченням незламного духу людства.\n\nЗворушений несподіваним талантом та ентузіазмом, Ллойд вирішує написати відгук. Він хвалить відданість акторів, винахідливість декорацій та той піднесений вплив, який таке починання має справляти на моральний дух. З особливою теплотою він відзначає фінальний акт, де перевтілення Єлизавети за допомогою костюмів та зачіски передає саму суть театральної магії."
  nf_brotherhood_council_montana_diplomacy.7.1:0 "«Браво»."
  nf_brotherhood_council_montana_diplomacy.8.t:0 "Блискучий відгук"
  nf_brotherhood_council_montana_diplomacy.8.d:0 "Честь отримує повідомлення від Старійшини Ллойда з Лост-Гіллз. Спочатку стривожена, вона з подивом виявляє, що послання сповнене похвали театральному шоу, яке провело Сестринство. Її охоплює суміш збентеження і гордості; їхня скромна вистава привернула увагу Старійшини. Похвала Ллойда, особливо його захоплення фінальним актом, викликає несподівану посмішку на її обличчі. Це визнання від такого шанованого джерела відчувається як прожектор, що освітлює їхні зусилля, перетворюючи простий засіб підняття бойового духу на гучний успіх."
  nf_brotherhood_council_montana_diplomacy.8.a:0 "«Змушує мене пишатися»."

nf_brotherhood_council_meeting_topic.4.t:0 "Засідання Ради: Визначення окупаційної політики"
  nf_brotherhood_council_meeting_topic.4.d:0 "Люди НКР нас не забули. Неподалік від Некрополя патруль із перспективних молодих Лицарів та їхніх учнів закидали бляшанками, камінням і гнилим м'ясом під час упокорення міста. Старший Лицар Сандерс, лідер патруля і Реформатор, не дав дозволу розігнати містян. Невдовзі Сандерса вбив Рейнджер, який ховався в натовпі. Сандерс пропонував їжу та медичну допомогу в обмін на швидку капітуляцію мера міста. Ромбіанський патруль, який прибув наступним, зустрівся з мером наодинці, залишивши лише портативний генератор і Писаря для налагодження мирних відносин з містянами. Наступного дня сусіднє місто було вирізане загоном під проводом максоніанців за відмову здати лазерні пістолети Wattz їхнього ополчення, що залишило б їх беззахисними перед істотами пустки.\n\nЗдається, те, що окремі загони використовують власні стандарти окупації, не працює. Тепер в урочистих залах засідань Лост-Гіллз скликається критично важлива сесія. Старійшини збираються, щоб обдумати підхід до територій НКР, які нещодавно перейшли під контроль Братства. Кожен Старійшина пропонує власну стратегію, що відображає розмаїття філософій у керівництві Братства. Обравши єдиний підхід, ми, сподіваємось, запобігнемо подібним інцидентам у майбутньому!"
  nf_brotherhood_council_meeting_topic.4.1:0 "Давайте вислухаємо аргументи Старійшин."
  nf_brotherhood_council_meeting_debate.4.t: "Дебати в Раді: Визначення окупаційної політики"
  nf_brotherhood_council_meeting_debate.4.d: "[BOS_angharad.GetName] виступає за сильну, авторитарну позицію на окупованих територіях. Його точка зору зосереджена на необхідності твердого контролю та порядку, наголошуючи, що суворе управління є ключем до забезпечення позицій Братства та запобігання повстанням. Він розглядає приєднання такої великої кількості дикунів і громадян під захист Лост-Гіллз як структурний ризик для ідентичності Братства і хоче обмежити потенційний вплив з їхнього боку.\n\nНатомість [BOS_mari_torni.GetName] пропонує гуманітарний підхід, зосереджуючись на формуванні доброзичливості серед населення НКР. Вона пропонує надавати необхідну допомогу, таку як генератори, медикаменти та їжу, щоб завоювати серця і розуми, прагнучи до більш мирної та заснованої на співпраці окупації, поки триває битва за Шейді-Сендс. А з тими, хто не захоче підкоритися і кого не вдасться схилити на свій бік любов'ю, каже вона, Сталеве Коло завжди зможе розібратися... таємно.\n\n[BOS_llwyd.GetName] наголошує на важливості негайного початку реконструкції та залучення громад, аргументуючи це тим, що Братство має брати активну участь у відновленні післявоєнних руйнувань. Він стверджує, що це сформує сприйняття Братства як союзників у відбудові, запобігаючи виникненню у людей Максона образи на Братство. Він вважає, що цивільне населення НКР жило в тепличних умовах — якщо ми забезпечимо їм безпеку, каже він, більшість з них не підніме зброю проти Братства, яке простягає відкриту долоню, і може навіть охоче прийняти його обійми.\n\n[BOS_rhiannon.GetName] представляє більш нюансовану стратегію, поєднуючи просвітництво з контролем. Вона пропонує навчати населення НКР ідеалам Братства — а також, імовірно, і своїм власним — підтримуючи при цьому необхідний порядок, з метою створення бази духовно споріднених прихильників. Вона говорить прозою, що здається ексцентричною іншим старійшинам, але загальна ідея полягає в тому, що вона хоче навчити їх §R«способу переписати себе»§!, щоб вони більше не були обтяжені кодексами НКР."
