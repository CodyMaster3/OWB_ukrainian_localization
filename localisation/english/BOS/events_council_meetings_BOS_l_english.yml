nf_brotherhood_council_meeting_debate.9.t:0 "Дебати в Раді: Спадковий уряд"
  nf_brotherhood_council_meeting_debate.9.d:0 "[BOS_angharad.GetName] говорить першим, його голос сповнений презирства до цієї теми. «Братання зі спадковим урядом — це непотрібне спотворення наших принципів. Республіка була дисфункціональною не просто так, і ці троє швидше потягнуть одне одного на дно, ніж створять об'єднаний фронт проти нас. Залишмо їх у спокої — заворушення через голод залишатимуться проблемою, але наші руки не будуть зв'язані, коли настане час розібратися з Баронами безпосередньо».\n\n[BOS_mari_torni.GetName] так само шукає м'якого шляху, припускаючи: «Кімбол слабкий, незважаючи на його попереднє президентство, і є хорошим кандидатом на те, щоб спостерігати, як спадковий уряд згасає природним чином. Він не надихає так, як інші, але є близьким союзником Баронів і дозволить налагодити дипломатичні контакти під час цієї кризи. Той факт, що він певною мірою поділяє нашу провоєнну позицію, принесе дивіденди, коли ми мобілізуємо Каліфорнію на війну».\n\n[BOS_llwyd.GetName] припускає, що співпраця з Олгудом або Гейсом для реалізації деяких політик, за які вони спочатку агітували, могла б запобігти тому, щоб потенційні заворушення через голод звели нанівець значну частину нашої роботи по всій країні, якщо ситуація погіршиться. [BOS_llwyd.GetName] наголошує на кандидатурі Олгуда, кажучи, що його зосередженість на хороших стосунках з нами та ліквідації корупції і злочинності в Каліфорнії стала б у нагоді в наших уже розпочатих зусиллях. «Жоден старійшина не зміг би знайти багато приводів для невдоволення таким кроком нашої ради, за винятком близьких стосунків Олгуда Мерфі з Послідовниками, яких він захоче захистити».\n\n[BOS_pryderi.GetName] заперечує: «Грант К. Гейс відомий своїм негативним ставленням до Братства, критикуючи наше збереження технологій і холодність, яку ми виявили до іноземної допомоги. Але його плани щодо масштабної перебудови національного характеру ідеально підійшли б нам, лише з деякими незначними змінами. Ми можемо вивести індустріальний досвід Гейса та Дейґлоу на національний рівень, і все, що вони просять — це наша прихильність геніальному плану боротьби з Баронами. З падінням Республіки Гейс хоче використати нас у власних цілях — але ці цілі на роки наблизять реалізацію нашого омріяного суспільства та просунуть наші дослідження».\n\n§BУсі радники займають місце Радника з питань культури.§!"
