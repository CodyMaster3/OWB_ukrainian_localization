  nf_brotherhood_council_meeting_topic.10.t:0 "Засідання Ради: Торговці зброєю"
  nf_brotherhood_council_meeting_topic.10.d:0 "Ван Граффи та Зброярі не в захваті від втрати свого найбільшого клієнта: Армії Нової Каліфорнійської Республіки. Ми ще не виступили проти них, незважаючи на їхню історичну корупцію. Відсутність державних замовлень сильно вдарила по них, і ми цінуємо їхні зусилля з озброєння каліфорнійців проти рейдерів, мутантів і різноманітних потвор.\n\nОднак очевидно, що торговці зброєю незадоволені статус-кво. Здається, ці дві групи скоординували нову програму — роблячи бронебійну зброю, яка колись вироблялася виключно для НКР, широко доступною для всіх. На вулицях Реддінга цю нову зброю навіть почали називати «Відкривачки для консервів».\n\nЯк мінімум, це відверте вимагання щодо Братства. У гіршому випадку — це активне озброєння Антона Флінна та його Баронів. Ми повинні вжити заходів проти Зброярів та Ван Граффів, поки не пізно."
  nf_brotherhood_council_meeting_topic.10.1:0 "Давайте вислухаємо аргументи Старійшин."

  nf_brotherhood_council_meeting_debate.10.t: "Дебати в Раді: Торговці зброєю — Друзі чи Вороги?"
  nf_brotherhood_council_meeting_debate.10.d: "[BOS_angharad.GetName] вважає це жахливим порушенням контролю Братства в Каліфорнії. Він попереджає, що «відродження жорстокого опору вже не за горами, володіння такою зброєю має бути негайно заборонено, незважаючи на маркетингові заяви про її використання проти чогось на кшталт Кігтя Смерті. Ми повинні вилучити ці матеріали з магазинів і складів, інакше торговці зброєю не засвоять ціну бунту».\n\n[BOS_mari_torni.GetName] відповідає: «Це непоганий план, [BOS_angharad.GetName], але ми також повинні управляти. Відштовхнути виробників зброї Каліфорнії — це те саме, що продати компанії Баронам. Чому б нам просто не викупити запаси, які вони намагаються розпродати, прибравши їх з вулиць? У довгостроковій перспективі за допомогою субсидій і податкових пільг ми можемо переконати обидві групи відмовитися від виробництва «Відкривачок». Братству не потрібно обійматися з торговцями зброєю так само міцно, як це робила НКР, але ми ризикуємо змусити ці компанії спалити наші села, щоб зігрітися».\n\n[BOS_llwyd.GetName] погоджується з діагнозом проблеми, поставленим [BOS_mari_torni.GetName]. «Оскільки Кампанія Реконструкції не змогла вирішити економічний біль військово-промислового сектору, він став схожим на голодну тварину, що гризе власну лапу. Якщо ми хочемо, щоб він перестав кусатися, ми повинні забезпечити йому прожиток. Я визнаю, що ці групи можна вважати... підривними, але стабільний потік кришок до цих компаній покладе край усій цій справі. Я доручив писарям підготувати контракт для кожної компанії, який стабілізує їхні фінанси в обмін на преференційний доступ Братства до їхніх товарів і вилучення «Відкривачок» з полиць магазинів».\n\nТепер рішення за радою — Ван Граффи та Зброярі будуть друзями чи ворогами?"
  nf_brotherhood_council_meeting_debate.10.a: "Вони не становлять реальної загрози, ми не будемо просувати жоден із цих планів."
