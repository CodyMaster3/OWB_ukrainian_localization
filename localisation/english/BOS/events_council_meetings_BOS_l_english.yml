  nf_brotherhood_council_meeting_topic.11.t:0 "Барони: Ми не ведемо переговори з терористами"
  nf_brotherhood_council_meeting_topic.11.d:0 "Аеродроми по всій Каліфорнії вирують діяльністю. Паладини, Лицарі та Писарі працюють усю ніч, щоб завантажити транспортні літаки спакованими припасами та боєприпасами. Ще до світанку ці літаки скинуть наших найкращих солдатів прямо на маєтки Баронів, включно з Антоном Флінном.\n\n[BOS.getLeader], нарешті ізолювавши Баронів від будь-яких інших дисидентів, схвалив операцію із захоплення якомога більшого контролю над продовольством, і очікується, що більшість штурмів призведе до негайної капітуляції місцевих сил. Після арешту Антона Флінна буде виконано план щодо підтримання виробництва на цих землях в умовах хаосу, який рада ухвалила кілька тижнів тому."
  nf_brotherhood_council_meeting_topic.11.1:0 "Кілька тижнів тому..."

  nf_brotherhood_council_meeting_debate.11.t: "Дебати в Раді: Сільськогосподарське виробництво"
  nf_brotherhood_council_meeting_debate.11.d: "Після затримання Антона Флінна Рада має швидко запровадити нову стратегію, щоб гарантувати, що його усунення принесе чисту користь продовольчій безпеці по всій Каліфорнії.\n\nОскільки багато сільськогосподарських угідь перебувають під контролем Баронів, Старійшина Реддінга, Старійшина Райан Хоу, звернувся до Ради з проханням про масове розгортання Послушників після цих подій. «Проблема, — стверджує Старійшина Хоу, — полягає в тому, що жителі Півночі ізольовані від нашого нового національного характеру. Я пропоную наповнити цей регіон зразковими членами Братства, які працюватимуть на землі, поки ми знову перевіримо місцевих наймитів. У нас уже є довгі списки, але вони не можуть працювати з мінімальним штатом. Це також передасть північне сільське господарство під наш прямий контроль».\n\nНаступним бере слово [BOS_angharad.GetName]: «[BOS_pryderi.GetName] і я поділяємо думку, що таке масове розгортання неможливе. Але ми маємо ресурси, щоб змусити їх повернутися до роботи, встановивши квоти та проводячи регулярні перевірки, поки місцеві Старійшини не знайдуть постійні рішення. Це викличе опір і засмутить громадян, але в цьому немає нічого такого, з чим би ми не впоралися».\n\n[BOS_llwyd.GetName] пропонує два рішення, коротко згадавши, що якби був доступний Прес-корпус, його можна було б використати для зміни сердець і умів на Півночі. «В іншому випадку, — заявляє Ллуїд, — можливо, мої люди змогли б досягти результатів, схожих на план Старійшини Хоу, але з меншими витратами. Реформатори мають дуже позитивну репутацію серед фермерів в інших частинах Каліфорнії, і ми могли б переселити південних фермерів на Північ. Їм потрібна буде допомога в забезпеченні переходу на деякий час, поки вони не зможуть продати наступний урожай».\n\nПропозиція [BOS_mari_torni.GetName] коротка: «Ми можемо залишити все це позаду, розбивши регіональні фермерські асоціації Півночі. Дайте кожному наймиту рівну частку власності з усім прибутком, який це передбачає. Так, ми торгуємо майбутнім контролем, але здобуваємо мир уже зараз»."
  nf_brotherhood_council_meeting_debate.11.a: "Підтримати пропозицію Старійшини Хоу."
  nf_brotherhood_council_meeting_debate.11.b: "§OПереконати місцевих жителів працювати, оприлюднивши інформацію про арешт Антона Флінна."
