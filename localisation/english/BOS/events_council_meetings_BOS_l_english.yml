  nf_brotherhood_council_meeting_topic.7.t:0 "Засідання Ради: Хаб"
  nf_brotherhood_council_meeting_topic.7.d:0 "Старійшина, відповідальний за Хаб, Старійшина Матіас, робить огляд ситуації: «Коли Каліфорнія постала з попелу війни, Хаб став маяком надії для багатьох. Торгове місто вирувало діяльністю, оскільки торговці з усієї пустки з'їжджалися туди, щоб продавати свої товари. Однак із зростанням значущості міста зростало й насильство між бандами конкуруючих контрабандистів, які змагалися за контроль над прибутковими торговими шляхами. Караванні компанії, що працюють у Хабі, як-от «Червоний Караван» і Торговці водою, під час війни підкупили вуличні банди для охорони, що призвело до повернення Великих Торгових Воєн, які мучили Хаб у 2126 році.\n\nХаб — це місто, яке було одночасно і життєво важливим центром комерції, і кублом беззаконня. Щоб повернути йому статус першого і позбавити другого, я звертаюся по допомогу до Ради».\n\nСтарійшини Лост-Гіллз бачать безліч рішень цієї проблеми."
  nf_brotherhood_council_meeting_topic.7.1:0 "Давайте вислухаємо аргументи Старійшин."

  nf_brotherhood_council_meeting_debate.7.t: "Дебати в Раді: Хаб — Багатий і Впливовий"
  nf_brotherhood_council_meeting_debate.7.d: "Рада Старійшин заслуховує Старійшину Хаба Матіаса, який повідомляє, що ситуація в Хабі — це рівною мірою страх і опортунізм. Він доповідає, що старі муніципальні елементи уклали угоду про припинення насильства шляхом створення політичного органу для нагляду за торгівлею, структурованого так, щоб стимулювати мир і політичні ігри. Торговці готові розлучитися зі значними сумами кришок, щоб купити домінуючі місця за столом переговорів, достатніми для створення профіциту, який наш уряд зможе використати в інших місцях.\n\nСтарійшина Матіас також цікавиться, чи ми відновили поліцейські сили, оскільки їх посилення (і більше постійне розгортання) в Хабі дозволило б роззброїти банди і втілити їхні власні плани.\n\nПочувши достатньо, [BOS_angharad.GetName] каже: «Дисидентство вже видніється на горизонті. Старійшини, дозвольте мені особисто очолити загін Паладинів і вирушити до міста. Це саме той вплив, про небезпеку якого я попереджав, тож дозвольте мені повторити: місія Братства полягає не в тому, щоб догодити Хабу, а в тому, щоб зробити його покірним. Давайте відновимо владу Старійшини Матіаса демонстрацією сили».\n\n[BOS_mari_torni.GetName] схиляє голову, заявляючи: «У цьому випадку я вважаю, що [BOS_angharad.GetName] має рацію. Але я не бачу причин ризикувати його життям у міських боях. Торговці також купили послуги охоронних компаній і банд — давайте нацькуємо одних на одних, роззброївши торговців і давши Старійшині Матіасу поліцейські сили, яких він шукає. Маючи таке оснащення, податки на торгівлю дозволять Матіасу утримувати їх на зарплаті».\n\n[BOS_rhiannon.GetName] глузує: «Ці торговці засліплені недалекоглядністю. Мені відомо про вільнодумців у їхніх офісах, яких можна було б використати. А щодо тих, кого ми не зможемо замінити, я впевнена, що їхні підлеглі бачили достатньо, щоб шантажувати їх усе життя. Дайте моїм людям свободу дій, і я подбаю про те, щоб Матіасу не знадобилася сила, щоб тримати їх у покорі».\n\nПомітно засмучений, [BOS_llwyd.GetName] бере слово. «Я бачу, куди віє вітер у цій Раді. Буде вжито заходів безпеки, тому я пропоную зосередитися на наслідках — зростання злочинності, контрабанди та беззаконня цілком очікуване під час реконструкції. Якщо ми інвестуємо в розбудову торгової інфраструктури Хаба, ці люди зможуть законно працювати, обслуговуючи каравани або захищаючи їх у Пустці. Можливо, тоді вони навіть не згадають, як їхню кров розмазували по бруківці чоботи наших силовиків».\n\n§BПропозиція Матіаса щодо розширення поліції доступна лише в тому випадку, якщо ви обрали Поліцію під час Реконструкції.§!"
  nf_brotherhood_council_meeting_debate.7.a: "Укласти угоду."
  nf_brotherhood_council_meeting_debate.7.b: "§OВідправити наші найкращі поліцейські підрозділи в Хаб.§!"
