  nf_brotherhood_council_meeting_topic.5.t:0 "Засідання Ради: Майбутнє інституцій НКР"
  nf_brotherhood_council_meeting_topic.5.d:0 "Після завоювання НКР Братством, Старійшини в Лост-Гіллз стикаються з ключовим рішенням щодо майбутнього фінансових і медійних інституцій НКР. Головне питання: як Братству зберегти крихкий баланс між контролем і свободою на цих нещодавно здобутих територіях?"
  nf_brotherhood_council_meeting_topic.5.1:0 "Давайте вислухаємо аргументи Старійшин."
  nf_brotherhood_council_meeting_debate.5.t:0 "Дебати в Раді: Майбутнє інституцій НКР"
  nf_brotherhood_council_meeting_debate.5.d:0 "[BOS_angharad.GetName], який очолював штурм золотих резервів НКР, займає тверду позицію проти свободи преси та приватної власності. Він стверджує, що відродження каліфорнійської економіки не має значення для місії Братства. [BOS_angharad.GetName] виступає за мінімальне втручання Братства в економічні справи, залишаючи питання громадян самим громадянам, водночас забезпечуючи ретельний моніторинг ЗМІ, хоч і незалежних, на предмет антибратських настроїв.\n\n[BOS_mari_torni.GetName] вважає, що використання каліфорнійської економіки має вирішальне значення для впливу Братства в пустці. Вона пропонує, щоб Сталеве Коло контролювало ЗМІ під виглядом свободи, непомітно перевіряючи контент, аби забезпечити його відповідність цілям Братства. [BOS_mari_torni.GetName] розглядає це як стратегічний крок для збереження впливу та побудови альянсів з іншими державами.\n\n[BOS_llwyd.GetName] цінує досягнення НКР, незважаючи на її недоліки, і виступає за допомогу в її відбудові. Він відстоює ідеал свободи преси, попереджаючи, що відкрите втручання Братства в місцеві газети може бути негативно сприйняте населенням, що потенційно зашкодить іміджу Братства.\n\n[BOS_pryderi.GetName] уявляє майбутнє, де Братство веде людство в нову еру. Він підтримує обмежене економічне втручання, зосереджуючись на ширшій місії Братства, а не на матеріальних благах. [BOS_pryderi.GetName] наголошує на розбудові суспільства, в якому громадяни віддані справі Братства, роблячи внесок не лише працею, а й духом та ідеологією."
  nf_brotherhood_council_meeting_debate.5.elites:0 "Стати на бік [BOS_angharad.GetName]."
  nf_brotherhood_council_meeting_debate.5.ruler:0 "Стати на бік [BOS_mari_torni.GetName]."
  nf_brotherhood_council_meeting_debate.5.intellectuals:0 "Стати на бік [BOS_pryderi.GetName]."
  nf_brotherhood_council_meeting_debate.5.people:0 "Стати на бік [BOS_llwyd.GetName]."

  nf_brotherhood_council_meeting_topic.6.t:0 "Засідання Ради: Поводження зі злочинцями"
  nf_brotherhood_council_meeting_topic.6.d:0 "У суворій залі Лост-Гіллз Рада Старійшин збирається, щоб обговорити нагальне питання, що виникло внаслідок їхньої експансії на територію НКР: управління величезною кількістю злочинців, залишених після визвольних походів паладинів і лицарів Братства. Кожен зі старійшин готується представити свої погляди на цю складну дилему."
  nf_brotherhood_council_meeting_topic.6.1:0 "Давайте вислухаємо аргументи Старійшин."
  nf_brotherhood_council_meeting_debate.6.t:0 "Дебати в Раді: Поводження зі злочинцями"
  nf_brotherhood_council_meeting_debate.6.d:0 "[BOS_angharad.GetName] стоїть із рішучим виглядом, пропонуючи сміливе рішення — призов цих злочинців до армії. Він планує використати їхні приховані здібності для справи Братства. Для [BOS_angharad.GetName] такий підхід не лише дає практичне рішення проблеми управління, а й пропонує цим людям шлях до спокути через службу.\n\nНа противагу [BOS_angharad.GetName], [BOS_mari_torni.GetName] висловлює обережність. Вона виступає за ретельний процес перевірки для інтеграції цих злочинців у Братство. [BOS_mari_torni.GetName] наголошує на важливості збереження цілісності їхніх лав, підкреслюючи потенційні ризики поспішного вербування осіб із сумнівним минулим.\n\n[BOS_manawyddan.GetName] пропонує інший підхід, розглядаючи злочинну поведінку як реакцію на зламану систему. Він пропонує перевиховання через принципи Братства, Кодекс і через §R«Маніпуляцію Паскальбайтами»§! — термін фракції культистів для позначення кібернетичних удосконалень. [BOS_manawyddan.GetName] вірить у трансформаційну силу їхньої доктрини, бачачи можливість перетворити цих людей на цінні активи проти НКР.\n\n[BOS_llwyd.GetName], дотримуючись позиції етичної доброчесності, виступає за збереження існуючої судової системи. Він наголошує на функціонуванні нинішньої тюремної системи та виступає за її збереження, стверджуючи, що її руйнування може призвести до нестабільності та моральних компромісів.\nКоли кожен старійшина висловлює свою думку, рада опиняється на роздоріжжі."
  nf_brotherhood_council_meeting_debate.6.elites:0 "Стати на бік [BOS_angharad.GetName]."
  nf_brotherhood_council_meeting_debate.6.ruler:0 "Стати на бік [BOS_mari_torni.GetName]."
