brotherhood_commander_trait:0 "Командир Братства"

brotherhood_elder_conflicts: "Конфлікти зі Старійшинами"
brotherhood_elder_conflicts_desc: "Ця держава має давню історію протистояння зі старійшинами Лост-Гіллз. Через це не варто очікувати допомоги з їхнього боку найближчим часом."

brotherhood_chaotic_conflicts: "Хаотичні Конфлікти"
brotherhood_chaotic_conflicts_desc: "Хаос, у який занурено [ROOT.GetName], суттєво ускладнює передачу допомоги з боку інших осередків Братства!"

bos_civilian_distrust: "«Ті прокляті бляшанки!»"
bos_civilian_distrust_desc: "Війна між НКР і Братством залишила глибоку недовіру серед мешканців Великої НКР щодо правління Братства. І хоч це не лише їхня провина, Лост-Гіллз дійсно здебільшого ігнорували гуманітарні потреби 'цивільних, вірних ворогу' в ході того конфлікту."

  bos_civilian_distrust_2:0 "\"Ці злі бляшанки!\""
  bos_civilian_distrust_2_desc:0 "Війна між НКР та Братством зробила багатьох людей у Великій НКР ворожими до ідеї правління Братства. Це не виключно їхня провина, оскільки під час того конфлікту Лост-Гіллз зазвичай уникав гуманітарних зусиль щодо \"цивільних, лояльних до ворога\"."
  bos_civilian_distrust_3:0 "\"Ці злі бляшанки!\""
  bos_civilian_distrust_3_desc:0 "Війна між НКР та Братством зробила багатьох людей у Великій НКР ворожими до ідеї правління Братства. Це не виключно їхня провина, оскільки під час того конфлікту Лост-Гіллз зазвичай уникав гуманітарних зусиль щодо \"цивільних, лояльних до ворога\"."
  bos_civilian_distrust_4:0 "\"Ці злі бляшанки!\""
  bos_civilian_distrust_4_desc:0 "Війна між НКР та Братством зробила багатьох людей у Великій НКР ворожими до ідеї правління Братства. Це не виключно їхня провина, оскільки під час того конфлікту Лост-Гіллз зазвичай уникав гуманітарних зусиль щодо \"цивільних, лояльних до ворога\"."

  bos_brotherhood_of_steel_idea:0 "Сталева гордість"
  bos_army_confusion_4:0 "Лицарське замішання"
  bos_army_confusion_3:0 "$bos_army_confusion_4$"
  bos_army_confusion_2:0 "$bos_army_confusion_4$"
  bos_army_confusion_1:0 "$bos_army_confusion_4$"
  bos_army_confusion_4_desc:0 "Війна між НКР та Братством залишила нижчі чини Братства в безладі! Солдати ледве отримують боєприпаси для своїх гвинтівок, ланцюг командування постраждав, а борги наших інтендантів зросли до непробачного рівня!"
  bos_army_confusion_3_desc:0 "$bos_army_confusion_4_desc$"
  bos_army_confusion_2_desc:0 "$bos_army_confusion_4_desc$"
  bos_army_confusion_1_desc:0 "$bos_army_confusion_4_desc$"

  gaben_economy_law:0 "Перевага у вогневій моці"
gaben_economy_law_desc: "Наші писарі та лицарі століттями зосереджувалися на створенні та підтримці нашої зброї та силової броні. Немає причин це змінювати. Ми завжди повинні бути готові до війни."
isolationist_trade_law: "Все заради Кодексу"
isolationist_trade_law_desc: "Наш орден був заснований на одному простому принципі — технології занадто небезпечні для пересічної людини. Саме вони в першу чергу призвели до ядерної війни, а такі групи, як Єдність та Анклав, довели, що більшості все ще не можна довіряти силу довоєнного світу. Ось чому ми повинні тримати зібране при собі, навіть ціною вічної ізоляції. Це заради їхнього ж блага."
military_indoctrination_press: "Індоктринація"
military_indoctrination_press_desc: "Наших зброєносців та ініціатів потрібно навчати шляхам Кодексу. Їх слід вчити ненавидіти мутантів, жаліти жителів пустки і, понад усе, захищати технології від тих, хто прагне використати їх на зле."
selective_outsider_recruitment_law: "Вибірковий призов чужинців"
selective_outsider_recruitment_law_desc: "Всупереч поширеній думці, Братство завжди поповнювало лави за рахунок цивільного населення. Деякі капітули більш прискіпливі за інші, але ще з часів Роджера Мексона Братство дозволяло принаймні деяким жителям пустки вступати до своїх лав. Все ж нам слід вибірково ставитися до того, кому саме ми дозволяємо доступ до нашої ієрархії. Дуже вибірково."
lost_hills_pensions: "Пенсії квартирмейстерам"
lost_hills_pensions_desc: "Ми надаємо нашим квартирмейстерам чималий дискреційний фонд для закупівлі обладнання у третіх сторін. Останнім часом нашим найбільшим торговим партнером були Ван Граффи через їхню спеціалізацію на енергетичній зброї, але спроба вести справи зі злочинцями в цивілізований спосіб виявилася марною справою."
lost_hills_wages: "Зарплати квартирмейстерам"
lost_hills_wages_desc: "Експансія Братства змушує його мати справу з чимось страшнішим за Повелителя, Анклав і Легіон разом узятих — ринковими силами. Тепер, коли ми офіційно прийняли валюту пустки, нам варто почати платити нашим солдатам «прожитковий мінімум»."
lost_hills_cant_change_this_law:0 "Граючи за Лост-Гіллз, ми змінюємо цей закон через національні фокуси."
  bos_trade_modifier_to_lost_hills:0 "Торгова мережа Лост-Гіллз"

  bos_tension_dynamic_modifier:0 "Напруженість між Лост-Гіллз та НКР"
  bos_tension_dynamic_modifier_desc:0 "Ми лише нещодавно змогли домовитися про неофіційне припинення вогню з НКР. Багато хто в Братстві побоюється, що цей 'мир' триватиме недовго. Для нас напруженість відображає те, як із наближенням ідеї відновлення цього конфлікту члени Лост-Гіллз починають відмовлятися від своїх доктринальних обов'язків, щоб підготуватися до війни з великим ворогом."
  bos_ncr_tension_dynamic_modifier:0 "Напруженість між Лост-Гіллз та НКР"
  bos_ncr_tension_dynamic_modifier_desc:0 "Для багатьох політиків перспектива повномасштабної кампанії проти терористів Братства в горах на захід від Габу зараз просто неприйнятна. Знищення золотого запасу НКР показало, якої шкоди Братство може завдати НКР точними, прорахованими ударами. З огляду на кампанію в Мохаве та безліч ворогів навколо, останнє, чого хочуть брамінні барони, Оллґуд чи будь-хто інший — це кровопролиття так близько до центральних територій.\nЧас Братства настане. Питання лише в тому, коли."

#5.x
  brotherhood_maxsonian_economy:0 "Максоніанська економіка"
  brotherhood_maxsonian_economy_desc:0 "Реалізуючи бачення старійшини Ангарад, Братство мінімізує свою участь в економічних справах, зосереджуючись на моніторингу ЗМІ щодо антибратських настроїв. Цей підхід невтручання дозволяє місцевій економіці саморегулюватися, що потенційно може призвести до формування органічного економічного середовища, керованого громадянами."
  brotherhood_rhombian_economy:0 "Ромбіанська економіка"
  brotherhood_rhombian_economy_desc:0 "Застосовуючи стратегію старійшини Торні, Братство непомітно контролює каліфорнійські ЗМІ через Коло Сталі, створюючи ілюзію свободи, одночасно узгоджуючи контент із цілями Братства. Цей підхід має на меті непомітно впливати на громадську думку та зміцнювати владу."
  brotherhood_reformer_economy:0 "Реформаторська економіка"
  brotherhood_reformer_economy_desc:0 "Слідуючи підходу старійшини Ллуйда, Братство підтримує економічну відбудову НКР, одночасно зберігаючи свободу ЗМІ. Ця стратегія має на меті сприяти доброзичливому ставленню серед населення, уникаючи відкритого втручання, яке могло б заплямувати репутацію Братства."
  brotherhood_troikan_economy:0 "Троїканська економіка"
  brotherhood_troikan_economy_desc:0 "Реалізація плану старійшини Прідері зосереджується на обмеженій економічній ролі Братства, підкреслюючи плекання суспільства, що відповідає місії Братства. Цей підхід спрямований на створення спільноти, відданої ідеалам Братства, виходячи за межі простих економічних внесків."

  bos_lost_hills_volunteers: "Добровольці на війну з НКР"
  bos_lost_hills_volunteers_desc: "[BOS.getName] попросили нашої допомоги в їхній битві проти НКР. Добровольці, яких ми відправили, повернуться нескоро, і наша логістика зайнята тим, щоб забезпечити їх усім необхідним."
  bos_lost_hills_extra_volunteers: "Добровольці на війну з НКР перекинуті повітрям"
  bos_lost_hills_extra_volunteers_desc: "[BOS.getName] перекинули повітрям велику кількість добровольців для своєї війни проти НКР. Вони повернуться нескоро, і наша логістика зайнята тим, щоб забезпечити їх усім необхідним."

  bos_political_agitation: "Братство підтримує Варту"
  bos_political_agitation_desc: "Не все суспільство Ши задоволене тривалими битвами між Акігахаєм та Ло Пеном. Варта втручається, коли бійка стає смертельною, але Братство масово виступає на їхню підтримку. Градус Битви за вулиці знижується, оскільки Сталевий Палац дає зрозуміти своє невдоволення."
  bos_misguided_resistance: "Повстання в Реддінгу"
  bos_misguided_resistance_desc: "Жителів Реддінга обдурили, і вони досі вірять, що ми винні в бідах Каліфорнії. Голод закінчився, але останні крики переможених лунають гучно."

  bos_foreign_airbases_1: "Авіабази ордену"
  bos_foreign_airbases_1_desc: "Наші інвестиції в постійну присутність у наших віддалених орденах зблизили наше Братство як ніколи раніше. Наші писарі співпрацюють з місцевими талантами, щоб підтримувати належне радіолокаційне покриття, запаси припасів та місця в ангарах для нашого прибуття. Низка Учнів-Лицарів та Писарів також проживають на базі, обслуговуючи наші повсякденні об'єкти та навчаючись у свого приймаючого ордену."
