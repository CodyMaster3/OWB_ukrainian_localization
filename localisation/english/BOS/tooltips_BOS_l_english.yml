bos_add_administration_center_max_tt:0 "Збільшити максимум §YАдміністративних центрів§! на §Y[?BOS.BOS_maximum_admin_centers_allowed_to_add]§!.\n§gКожен Адміністративний центр надає +1 до адміністративної ємності. Перевірте відповідну категорію рішень для перегляду й використання.§!"

bos_train_paladins_tt:0 "Навчити §Y[?BOS.BOS_train_paladins_num]§! нових §Yпаладинів§!.\n§gПаладини – це спеціальні підрозділи в силовій броні. Могутні, але обмежені в чисельності.\nЩоб їх розгорнути чи відкликати, використовуйте відповідну категорію рішень.\nКожен підготовлений паладин також дозволяє побудувати ще один Експедиційний відділ через рішення.§!"

