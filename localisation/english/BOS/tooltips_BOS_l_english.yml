  bos_operation_shi_weaken_leadership: "Агітувати симпатиків Братства"
  bos_operation_shi_weaken_leadership_desc: "Старійшина Френсіс має в Сан-Франциско кращу позицію, ніж він сам це усвідомлює. Добре спрямований тиск з боку наших агентів міг би зробити його голос домінуючим у політиці Ши."

  bos_operation_shi_target_supplies: "Атакувати місцеві центри постачання"
  bos_operation_shi_gather_intelligence: "Активувати осередок Кола Сталі"
  bos_cell_infiltration_tt: "Створити §Yосередок Кола Сталі§! на території нашої цілі. "
  operation_bos_create_bunker: "Зайняти бункер"
  operation_bos_create_bunker_desc: "Південно-Західна Каліфорнія всіяна невеликими бункерами, які ми колись займали або планували зайняти до нашої битви з Ведмедем. Тепер знову насувається війна, і краще завдавати ударів з багатьох місць, а не тільки з одного."
  operation_bos_create_bunker_cost: "Вартість заняття бункера"
  operation_bos_create_bunker_risk: "Ризик заняття бункера"
  operation_bos_create_bunker_outcome: "Результат заняття бункера"
  unlock_bos_create_bunker: "Зайняти бункер"
  unlock_bos_create_bunker_tt: "Відкрити операцію: §YЗайняти бункер§!\n§g«Зайняти бункер» — це операція Розвідувального управління, яка використовується для зайняття підземних бункерів на південному заході Каліфорнії. Коли ми оголошуємо війну країні, яка володіє регіонами, де ми контролюємо бункери, ці регіони стануть національною територією та перейдуть під наш контроль.§!"
