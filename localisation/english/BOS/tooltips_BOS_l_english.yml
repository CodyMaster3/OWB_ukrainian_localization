  bos_lost_hills_diplomacy_add_others_to_ledger: "Визнати §Y[FROM.getName]§! членом Братства."
  bos_lost_hills_diplomacy_add_others_to_ledger_desc: "Визнати незвичний орден Братства членом Братства, додавши його до нашого Реєстру, що дозволить нам відправляти їм добровольців. У майбутньому ми зможемо §Yінтегрувати їх ще більше§!."
  bos_lost_hills_diplomacy_add_others_to_faction: "Відправити делегацію для інтеграції §Y[FROM.getName]§!"
  bos_lost_hills_diplomacy_add_others_to_faction_desc: "Запросити незвичний орден Братства до альянсу Братства Сталі."

  bos_ask_moj_to_whitepeace_legion: "Заохотити [MOJ.getName] до переговорів про припинення вогню з [CES.getName]"
  bos_ask_moj_to_whitepeace_legion_desc: "§WМи можемо попросити [MOJ.getLeader] надати пріоритет переговорам про припинення вогню з [CES.getLeader] §Yнавіть перед тренуваннями проти тактики легіонерів§!, поки наші добровольці демонструють безглуздість війни з Братством.\n\nПоки [MOJ.getName] контролює §Y[417.getName], [573.getName], [46.getName], [613.getName], [137.getName]§! та §Y[67.getName]§!, вони зможуть прагнути миру. \n\nПоки вони контролюють Північний §Y[438.getName]§! або Південний §Y[553.getName]§!, вони будуть продовжувати війну незважаючи ні на що.§!"
  bos_ask_moj_to_war_with_legion: "Заохотити [MOJ.getName] пустити кров [CES.getName]"
  bos_ask_moj_to_war_with_legion_desc: "§WМи можемо попросити [MOJ.getLeader] надати пріоритет тренуванням проти тактики легіонерів §Yнавіть перед переговорам про припинення вогню.§! Наша потужна підтримка військами в Мохаве дасть їм перепочинок для цього. \n\nПоки вони контролюють Північний §Y[438.getName]§! або Південний §Y[553.getName]§!, вони повністю заморозять мирні переговори, а не просто змінять пріоритети підготовки.§!"
  bos_ai_hint_tt: "ШІ ордену змінить свої пріоритети."

  bos_lost_hills_diplomacy_integrate_chapter: "Інтегрувати [FROM.getName] до Братства Сталі"
  bos_lost_hills_diplomacy_integrate_chapter_desc: "Брати не залишаються на самоті. Наше братерство пройшло випробування пусткою, але [FROM.getName] вистояли з нашою допомогою. Землі Братства зблизилися, і настав час їхнім старійшинам повернутися додому, їхнім писарям — радитися з нашими, а нашим Лицарям і Паладинам — зміцнити їхні кордони.\n\n§g«Тож візьмемося за руки, всі відважні американці— \n\nВ єднанні ми вистоїмо, в розбраті — впадемо!»§!"

  bos_brotherhood_investment_received_tt: "§YЛост-Гіллз§! інвестували §YПолітичну владу§! та §YСтабільність§! у нашу боротьбу. Їхнє §Yрішення§! §YВідкликати персонал§! буде безкоштовним, і вони отримають §Yстабільність§!, рівну тій, яку втратили, щойно зроблять це."
  bos_supply_debates_tabling_tt: "Перегляньте можливість відправки будь-яких припасів на даний момент. Ви зможете знову розглянути це питання через один день, поки не відправите припаси."
  bos_merc_details: "Наймає §Y4§! підрозділи силовиків, використовуючи найкраще спорядження, яке дослідила ціль. Найманці почнуть подорож до столиці цілі, сформувавши там дивізії за §Y2-3 тижні.§!"
  bos_brotherhood_investment_sent_tt: "§YЛост-Гіллз§! інвестують §YПолітичну владу§! та §YСтабільність§! у боротьбу цього ордену. Наше §Yрішення§! §YВідкликати персонал§! буде безкоштовним, і ми отримаємо §Yстабільність§!, рівну тій, яку втратили, щойно зробимо це."
  bos_brotherhood_ai_doubled_tt: "§CОскільки цим орденом керує ШІ, вони також отримують:§!"
  bos_removes_chapter_conflicts: "Це достроково §Rзнімає§! національний дух 'Конфлікти ордену', дозволяючи нам §Yвідправити добровольців.§! Нам слід §Rретельно§! обдумати, чи є у нас необхідні добровольці, щоб зробити це найкращим вибором."
  bos_no_planes_for_aid_tt: "Нам бракує §Yавіації§!, щоб безпечно дістатися до цього ордену. Натомість ми відправимо підрозділ §YПаладинів§! для супроводу наших Польових Писарів та Лицарів крізь небезпеки Пустки. Їхня подорож займе §R180 днів§!."
  bos_ldp_not_at_war_moj_mot_tt: "§YОперація: Сонячні промені§! завершилася, або Мохаве окупована іншими."
  bos_integrate_chapters_decision_tt: "Запрошує ціль, будь-яких членів альянсу та їхніх маріонеток до §YЗахідного Братства Сталі§! та §YВеликої Ради Писарів§!. Гравці можуть відхилити цю пропозицію, але ШІ — ніколи."
##operatives
  bos_christine_recruitment:0 "Найняти Крістін, яка має громадянство [BOS.getName], а також риси §YІнфільтратор§! та §YНіндзя§!. Ці риси посилюють операції §YВикрадення креслень§! та §YПроникнення§! відповідно."
  bos_valery_recruitment:0 "Найняти Валері, яка має громадянство [NCR.getName], а також риси §YКрасномовець§! та §YПодвійний агент§!. Ці риси насамперед посилюють операцію §YПроникнення§! та зменшують ризик під час §YВикрадення креслень§!."
  bos_cutler_recruitment:0 "Найняти Катлера, який має громадянство [VEG.getName], а також риси §YВажковаговик§! та §YЖахаюча присутність§!. Ці риси знижують §Yшвидкість видобутку розвідданих ворожими оперативниками§! та підвищують §Yконтррозвідку§! відповідно."
