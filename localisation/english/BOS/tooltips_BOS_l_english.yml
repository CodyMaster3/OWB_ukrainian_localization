  hoi4_devs_broke_this_tt_war_not_completed: "Перші три бонуси під цим текстом необхідні для того, щоб нація працювала як задумано, оскільки механіка постачання добровольців для країн, що не мають виходу до моря, була змінена. Ці зміни були зроблені розробниками OWB, але цю підказку додав розробник сабмоду Lost Hills Expanded :) Щойно ви вступите в бій з НКР, ці бонуси будуть назавжди вилучені, що також є моєю роботою."
