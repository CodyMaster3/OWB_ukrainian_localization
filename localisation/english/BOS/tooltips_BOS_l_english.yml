bos_create_administration_center_tt: "Додати §Y1§! позакартовий §YАдміністративний центр§!.\nКожен §YАдміністративний центр§! дає §G+1§! до §Yадміністративної ємності§!."

bos_create_safety_department_tt: "Додати §Y1§! позакартовий §YВідділ безпеки§!.\nНаявність §YВідділу безпеки§! значно зменшує ризик аварій при виконанні рішень у Лост-Гіллз і значно підвищує кількість людських ресурсів, які ми отримуємо після кожного рішення."

