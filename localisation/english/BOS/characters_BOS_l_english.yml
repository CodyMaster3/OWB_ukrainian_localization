#Leaders
BOS_MARI_TORNI_NAME: "Марі Бранвен Тьорні"
BOS_MARI_TORNI_DESC: "Марі Бранвен Тьорні — видатна Паладин та Старійшина в Лост-Гіллз, ветеранка Наварро та матір Кетрін Тьорні з Капітулу Аламо, яку вона в ранньому віці відправила до Техасу, щоб захистити від наступу Нової Каліфорнійської Республіки.\n\nВона глибоко вірить у Кодекс, адже багато років пропрацювала Писарем, доглядаючи за Сувоями та вивчаючи Аксіоми. У той час їй було важко узгодити суперечності в Кодексі щодо допомоги чужинцям та їхнього вербування, і лише під час її пізнішої служби як Паладина вона змогла примирити свої переконання. Вона відстоює Кодекс, але не сліпо слідує його букві, оскільки суперечності є продуктом його найважливішого догмату: «Через дискусію ми здобуваємо силу розуму наших Братів». Зараз вона є ромбіанською кандидаткою на посаду Верховного Старійшини і планує реформувати Кодекс, щоб дозволити обмежене вербування чужинців, таких як ветерани Республіки з битви за Наварро або громадяни Штату Максон. Вона також має намір покласти край цензурі голосів Реформаторів, що гуртуються під проводом Старійшини Ллойда, дотримуючись духу Кодексу.\n\nЧерез погіршення здоров'я Джонатана Максона ці плани незабаром можуть пройти перевірку на міцність, оскільки вплив ромбіанців зростає, а максоніанці перебувають у затяжній кризі, обговорюючи долю родини Максонів. Загальновизнано, що вона найкраще підходить для реформування Лост-Гіллз; вона користується значною повагою серед Паладинів, Лицарів та Писарів у бункері, які вражені до глибини душі привидом подальшої війни з НКР за нинішнього керівництва. У Братстві ходять чутки, що за відсутності Максона навіть Сталеве Коло віддає їй перевагу."
BOS_JONATHAN_MAXSON_NAME: "Джонатан Мексон"
BOS_JONATHAN_MAXSON_DESC: "Джонатан Мексон – людина, змушена взяти на себе тягар влади під гнітом спадкової відповідальності та шрамів, залишених суворими випробуваннями. Після несподіваної смерті Верховного Старійшини Джеремі Мексона, Джонатан неохоче прийняв керівництво над Радою Мексоніанців у Лост-Гіллз, попри глибокі сумніви щодо його фізичного й психологічного стану після нещодавньої майже смертельної сутички.\n\nБудучи нащадком Роджера Мексона – засновника Братства Сталі, Джонатан уособлює спадок, який несе кожен носій цього імені. До недавнього часу, ще у званні паладина, він брав участь у бойових діях на кордонах Нової Каліфорнійської Республіки. Втім, його служба була передчасно перервана, залишивши як фізичні, так і душевні рани, які, згідно з оцінками кількох Писарів, можуть виявитися фатальними без належного лікування.\n\nХоча Джонатан і вижив, ціною став його внутрішній спокій – і саме це викликає занепокоєння серед Старійшин. Виникають сумніви: чи здатен він витримати вагу лідерства, з огляду на пережиті травми. Навіть його дружина, Джессіка, розглядає можливість відправити їхнього єдиного сина, Артура, на Схід – під захист Стар-Паладина Лайонса у Вашингтоні. Однак саме ця історія жертв і випробувань сформувала бачення Джонатана щодо майбутнього Братства. Мексони – це люди незламної волі, наділені глибоким почуттям обов’язку – охоронці спадщини свого засновника та непохитні захисники Кодексу. Їх називають елітарними догматиками, готовими йти до кінця в дотриманні принципів Братства. Для Джонатана – це прийнятна ціна за вірність імені, яке він носить.\n\nНезважаючи на тягар спадщини та шрами війни, він зберігає незламність духу, що відрізняє його від ромбійців, культістів чи реформаторів. Його вірність ідеалам Братства межує з релігійною відданістю. Джонатан Мексон прагне не лише зберегти, а й переосмислити шлях Лост-Гіллз, залишивши власний відбиток у їхній історії."
