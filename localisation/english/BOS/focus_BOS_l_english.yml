increase_tension: "Згуртувати Підтримку"
increase_tension_desc: "Є багато тих, хто прагне відновлення конфлікту між Братством і НКР. Один хабар, одна промова, один наказ, один рейд — і народ буде готовий до нової війни."

reduce_tension: "Шукати Заспокоєння"
reduce_tension_desc: "Зараз поновлення війни з НКР нам не вигідне. Зробімо все можливе, щоб відвернути гарячі голови на нашому боці та задовольнити вимоги потенційних ворогів по той бік кордону."

