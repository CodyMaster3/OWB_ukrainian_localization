  bos_sent_volunteers_check: "§WНе надіслав жодного добровольця§!"

  bos_return_paladins:0 "Відкликати всіх Паладинів"
  bos_return_paladins_desc:0 "§WПоверніть наших братів із поля бою для роботи в іншому місці.§! §RЧерез технічні обмеження можна відкликати лише всіх паладинів одночасно. Це скине їхній досвід!§!"

  bos_create_paladins:0 "Розгорнути Паладинів"
  bos_create_paladins_desc:0 "§WПаладини — це §Gпотужні§!, хоча й §Rобмежені в кількості§! підрозділи в §YСиловій броні§!, доступні для [BOS.GetName]. Вони не страждають від звичайних §Yштрафів місцевості§!, як звичайні дивізії в Силовій броні, і не впливають на нашу §Yмісткість Спеціальних сил§!. Ми можемо отримати більше Паладинів для розгортання через §Yнагороди за фокуси§!!§!"

  bos_get_plasma_rifles:0 "Реквізувати плазмові гвинтівки"
  bos_get_plasma_rifles_desc: "§WВартові отримали доступ до плазмової зброї. Якщо ми правильно сформулюємо наше комюніке, наші Паладини повернуться готовими протистояти НКР.§!"

  bos_help_moj:0 "Надіслати радників до Мохаве"
  bos_help_moj_desc:0 "§WНадіслати два підрозділи Паладинів до Мохавського Ордену, щоб допомогти їм спланувати §YОперацію «Сонячний промінь»§!, §W негайно збільшивши їхню §OПідготовку§! на §Y15§!§!. Якщо Орден зазнає §Rпоразки§!, наші Паладини §Rнавряд чи виживуть. §!§! Примітка: Ваші паладини не є експедиційними силами і не будуть битися на передовій."

  bos_get_more_vertibirds:0 "Допомогти Сан-Франциско"
  bos_get_more_vertibirds_desc: "§WНе всі задоволені розширенням впливу Ордену Сан-Франциско. Однак відправка наших Паладинів для навчання бойових мистецтв у силовій броні та дозвіл нашим пілотам ділитися досвідом із Ши дозволить Ордену §Yвиділити кілька Гвинтокрилів.§!§!"

  bos_buy_ships_from_hawaii: "Купити кораблі в Гаваїв"
  bos_buy_ships_from_hawaii_desc: "§WМи активно торгуємо з Гавайським архіпелагом і підтримуємо його багатьма корисними ресурсами. Тепер вони мають більше переобладнаних для бою рибальських суден, ніж їм потрібно для риболовлі, і з радістю продадуть нам кілька за вигідними цінами.§!"
  bos_12_ships_hawaii_tt: "§WОтримати §Y12§! річкових барж гавайського виробництва.§!"

  bos_open_the_market:0 "Дозволити обраним торговцям"
  bos_open_the_market_2: "Відкрити ринки"
  bos_open_the_market_desc:0 "Ми відкриємося для деяких торговців. Ми можемо закритися знову в будь-який момент, але інтендантам не завадили б кришки та робітники."
  bos_open_the_market_2_desc:0 "Наші писарі вдосконалилися в управлінні відкритою економікою. Ми не бачимо всіх переваг, які мають інші нації, але Рада легко схвалить її повторне закриття."
  bos_close_the_market:0 "Припинити будь-яку торгівлю"
  bos_close_the_market_desc:0 "Більше не в наших інтересах дозволяти торговцям забирати наші ресурси. Відсьогодні вони йтимуть з порожніми руками."

