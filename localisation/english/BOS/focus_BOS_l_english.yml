  ##End Flags
  bos_nf_the_weakened_brotherhood: "Здобич для Лева"
  bos_nf_the_weakened_brotherhood_desc: "Величезні спустошення війни разом із післявоєнними заворушеннями та нашою трансформацією Каліфорнії вкрай послабили нас. Нам потрібен час, щоб пожинати плоди наших змін і покласти край голоду. Якщо ми віддамо Легіону Мохаве, то зможемо виграти собі більше часу."
  bos_legion_truce_effects_explanation_tt: "Братство підписало з Легіоном таку угоду: "

  bos_ncr_looming_famine: "Наближення голоду"
  bos_ncr_looming_famine_desc: "По всій Каліфорнії йдуть приготування, поки Барони та інші впливові ділки НКР готуються вирити нам голодну яму. Барони згодні правити попелищем Каліфорнії — що ж, а ми згодні правити їхніми кістками."
  bos_ncr_incoming_famine: "Наближення голоду"
  bos_ncr_incoming_famine_desc: "Незабаром голод посилиться. Зараз він ще не такий суворий, а смертність спостерігається здебільшого серед літніх, немічних чи хворобливих людей. Ми перейшли на систему централізованого розподілу, тож більшість отримує необхідне."
  bos_ncr_famine: "Каліфорнійський голод"
  bos_ncr_famine_desc: "Нормування продуктів доведено до максимуму. Ми вдалися до дедалі більш авторитарних заходів, щоб розтягнути наявні запаси їжі. Смертність мінімальна — як для голоду. Якби не дуже публічні дії Баронів, ми б зіткнулися зі значними заворушеннями."
  bos_ncr_famine_active: "Каліфорнійський голод"
  bos_ncr_famine_active_desc: "Нормування продуктів доведено до максимуму. Ми вдалися до дедалі більш авторитарних заходів, щоб розтягнути наявні запаси їжі. Смертність мінімальна — як для голоду. Якби не дуже публічні дії Баронів, ми б зіткнулися зі значними заворушеннями.\n\nЯкщо ми зволікатимемо з подоланням цієї кризи, наслідки стануть надзвичайно важкими. Ми не зможемо вести війну будь-яких масштабів."
  bos_ncr_terrible_famine: "Великий голод у Каліфорнії"
  bos_ncr_terrible_famine_desc: "Смерть ходить вулицями Каліфорнії. Наш контроль втрачено — навіть попри зростання виробництва їжі, приховування запасів дедалі більш нелояльними поселеннями загрожує розпадом нашого уряду."
  stronger_lost_hills_ncr_occupation_famine: "Каліфорнійська продовольча криза"
  stronger_lost_hills_ncr_occupation_famine_desc: "З кожним кроком на землі Баронів мы знаходили спалені посіви та забиту племінну худобу. Барони бачили поразку на горизонті й влаштували відкладений голод — той, що підніме голову лише тоді, коли ми піднімемося сходами Шейді Сендс. Барони готові правити попелищем НКР, і якби не незалежне сільське господарство Південної Каліфорнії, у нас не було б іншого вибору, окрім як дивитися, як усе горить. \n\nНатомість разом із незалежними фермерами Південної Каліфорнії ми відкриваємо їхні зерносховища та склади. Завдяки ретельному нормуванню ми зможемо покласти край цьому голоду, поки не стало надто пізно. \n\nПрогрес подолання голоду: [slh_famine_progress_text]"

  bos_ncr_famine_delay: "Додаткові руки для ферм"
  bos_ncr_famine_delay_desc: "Тепер, коли ми контролюємо Каліфорнію, брак людей чи роботи відсутній. Направляючи безробітних на незалежні ферми по всій Каліфорнії, ми зможемо зробити їх трохи продуктивнішими. Це не вирішить кризу, але виграє нам більше часу. §YМи можемо зробити це лише один раз.§!"

  bos_ncr_famine_evaluate_food_reserves: "Оцінити запаси їжі"
  bos_ncr_famine_evaluate_food_reserves_desc: "Проведення аудиту наших продовольчих запасів вимагає навичок наших писарів. Майже напевно дані про запаси їжі занижуються через страх, корупцію чи недбалість. §YМи можемо зробити це лише один раз.§!"

  bos_ncr_famine_curb_baron_influence: "Обмежити вплив Баронів"
  bos_ncr_famine_curb_baron_influence_desc: "Хоча володіння Баронів зосереджені в Північній Каліфорнії, вони володіють значними приватними землями аж на півдні біля Хабу та Некрополіса. Ми можемо виконати цей план, щоб розпочати кампанію зі зменшення їхнього впливу в Центральній Каліфорнії, яка завершиться протистоянням з Антоном Флінном та його елітою. Зі свободою дій, яку дає наша ідеологія, нам не обов'язково спочатку руйнувати їхню базу підтримки — ми зможемо зробити це пізніше."

  bos_ncr_famine_food_convoy_escorts: "Супровід караванів"
  bos_ncr_famine_food_convoy_escorts_desc: "Торговці звідусіль стікаються до Каліфорнії, щоб заробити трохи кришок на нашому нещасті. На нещастя для них і для нас, зневірені люди схильні до набігів. Якщо їжа має дійти до наших складів, а не бути змарнованою в місті, де її й так вистачає, або знищеною найманцями, які працюють на Баронів, нам краще супроводжувати їх. Наши паладини забезпечуватимуть проходження караванів лише через найнебезпечніші території, тоді як нижчі чини переймуть обов'язки в спокійних внутрішніх районах."

  bos_ncr_famine_abatement: "Підкупити Барона"
  bos_ncr_famine_abatement_desc: "Барони не цураються хабарів. Якщо нам дійсно вкрай бракує часу, ми можемо підкуповувати їх одного за одним, щоб вони розкривали приховану племінну худобу або зерносховища. Така робота над підривом їхньої єдності не подолає голод, але це §Yнадійний і повторюваний§! спосіб отримати більше часу."

  bos_ncr_famine_distribute_advanced_tech_1: "Впровадити промислові добрива"
  bos_ncr_famine_distribute_advanced_tech_1_desc: "Щоб покласти край поточному голоду, нам потрібно, щоб наші родючі землі стабільно давали більші врожаї. Завдяки праці наших Писарів ми розробили промислові добрива за зразком Старого світу, які є ефективними в нашому новому кліматі. Надавши пріоритет впровадженню цих добрив у Південній Каліфорнії, ми зможемо суттєво наблизитися до подолання голоду."
  bos_ncr_famine_distribute_advanced_tech_2: "Перебудувати сільськогосподарські виробничі ланцюжки"
  bos_ncr_famine_distribute_advanced_tech_2_desc: "Від неякісних холодильних камер до потрісканих зерносховищ і вибоїстих доріг — існує безліч способів, через які їжа псується або втрачається на шляху від ферми до столу. Зосередившись на покращеннях для фермерів Південної Каліфорнії, ми підвищимо їхню врожайність, взагалі не зачіпаючи самі сільгоспугіддя чи ранчо."
  bos_ncr_famine_distribute_advanced_tech_3: "Розповсюдити генетично модифіковане насіння"
  bos_ncr_famine_distribute_advanced_tech_3_desc: "Генетично модифіковане насіння — це вершина сільськогосподарської науки. Хоча деякі з наших міських центрів сахаються цієї ідеї, модифіковані культури можуть прогодувати більше людей якіснішою їжею. Більшість фермерських районів у Каліфорнії мають «окраїни» — прилеглі території, які є занадто бідними для стабільного землеробства, і які фермери намагаються покращувати щороку. Через ризик втрати врожаю ці землі майже ніколи не засіваються. Зосередившись на виробництві насіння, яке процвітає на таких окраїнах, ми зможемо побачити двозначне зростання продуктивності сільського господарства, на додачу до того, що воно покращить сам ґрунт."

  bos_ncr_famine_ask_the_followers: "Попросити допомоги у Послідовників Апокаліпсису"
  bos_ncr_famine_ask_the_followers_desc: "Послідовники мають інтегровану спільноту по всій Каліфорнії. Ми вже запросили їх повернутися до своїх громадських центрів, і вони, без сумніву, працюють над пом'якшенням голоду навіть без нашого наказу. Однак, співпрацюючи з ними, ми могли б набагато краще зрозуміти, де допомога потрібна найбільше, адже для багатьох каліфорнійців першою зупинкою є не Старійшина Братства, а Послідовник. \n\nКрім того, попит на наших обізнаних Писарів просто перевищує наші можливості, і перевезення експертів-Послідовників по всій Каліфорнії запобіжить загибелі багатьох врожаїв цього року. Проте покладання на них у такий спосіб дасть їм §Yвеличезний вплив§! і зміцнить їх політично."
  famine_mission_followers_help_completed: "Ми мобілізували Послідовників по всій Каліфорнії для придушення голоду."

  bos_ncr_famine_raid_the_followers: "Здійснити набіг на громадські центри Послідовників"
  bos_ncr_famine_raid_the_followers_desc: "Послідовники залягли на дно після нашого завоювання НКР. Багато з них ховаються в «фортах» і будівлях Послідовників по всій Каліфорнії, маючи запаси допомоги — промислові матеріали, медикаменти, їжу та насіння. Якщо ми не хочемо легітимізувати цих пацифістів, мы можемо конфіскувати ці матеріали для власних потреб. Це не додасть нам друзів серед їхніх прихильників, але перетворення їхніх земель на продуктивні громадські ферми обмежить шкоду, а в поєднанні з обережним розподілом цих нових припасів наблизить нас до подолання голоду. Однак такий набіг на них §Rзавадить нам співпрацювати з ними в майбутньому.§!"
  famine_mission_followers_raided_completed: "Здійснено набіги на форти Послідовників по всій Каліфорнії для придушення голоду."

  bos_ncr_famine_turn_to_traders: "Звернутися до торговців"
  bos_ncr_famine_turn_to_traders_desc: "НКР як ніхто інший приваблювала торговців. Хаос і війна підірвали наші внутрішні та зовнішні ринки, а невизначеність щодо того, чи дозволять караванним компаніям торгувати за межами наших кордонів і чим саме, шкодить нашій здатності постачати сільськогосподарську продукцію та фермерські матеріали з-за кордону. Якщо ми зобов'яжемося дозволити певну зовнішню торгівлю навіть після завершення кризи, караванні компанії зроблять більше, щоб допомогти нам..."
  ####END CALIFORNIA FOOD CRISIS

  bos_nf_economic_projects: "Економічні проєкти"
  bos_nf_economic_projects_desc: "Треба багато зробити, щоб витягти НКР з її катастрофічного стану. Проте першочергове завдання — це планування нашого головного проєкту. Це не лише покаже нашим громадянам, що мы плануємо майбутнє, а й дозволить старійшинам припинити політиканство заради своїх улюблених проєктів."
  bos_nf_economic_projects_electrification: "Електрифікація Пусток"
  bos_nf_economic_projects_electrification_desc: "У той час як наші головні міста вже мають власні електромережі, Каліфорнія є домівкою для багатьох поселень, залежних від неефективних генераторів, що використовують цінні ядерні блоки, паливо або батареї. Їхнє підключення набагато міцніше прив'яже ці поселення до нас і зробить їхній захист значно простішим завданням.\n\nЗробити це так само просто, як інвестувати в додаткову генерацію електроенергії в ключових містах та інфраструктуру в сусідніх регіонах."
  #bos_ncr_electrification_tt: "Підключити міста"
  bos_nf_economic_projects: "Очищення кратерів"
  bos_nf_economic_projects_desc: "Це не зовсім найпрестижніша місія, але наша війна зробила старі маршрути через Каліфорнію непридатними для використання, і тепер на головних магістралях доводиться робити довгі об'їзди, щоб уникнути нерозірваних боєприпасів або зруйнованих мостів і доріг."
  bos_nf_economic_projects_real_memorials_desc: "Деякі села та міста були зрівняні з землею під час нашої війни, а інші спорожніли від усіх чоловіків призовного віку. Можливо, вони й були ворогами, але тепер їхні діти та вдови — наші громадяни. Нам потрібно провести тривалу кампанію, визнаючи їхню мужність перед обличчям переважаючої сили, а також виконуючи зобов'язання НКР щодо виплат."
  bos_nf_economic_projects_real_memorials: "Загоєння розколів та зведення монументів"
  bos_nf_economic_projects_training_halls: "Наш престижний проєкт"
  bos_nf_economic_projects_training_halls_desc: "Нарешті настав час реалізувати наш запланований проєкт. Нехай його завершення стане першим кроком у майбутнє для [BOS.getName]."
  
  bos_nf_preparing_for_expansion: "Майбутнє – у наших руках"
  bos_nf_preparing_for_expansion_desc: "Братство тепер контролює свою долю. Чи розширимо ми межі, прагнучи з'єднатись з іншими осередками, чи укріпимося в Каліфорнії, чекаючи, поки решта прийде до нас?"
  bos_skip_brotherhood_states_tt: "§CТериторії, які наразі перебувають у володінні відділення, не стануть предметом претензій, щоб уникнути непереборних дипломатичних санкцій.§!"
 
  bos_nf_utilizing_californias_industry: "Використати промисловість Каліфорнії"
  bos_nf_utilizing_californias_industry_desc: "Каліфорнія має розвинену промислову базу. Якщо діяти обережно – ми зможемо інтегрувати її до наших структур без руйнівних наслідків."
  bos_nf_utilizing_californias_industry_tt: "Розблокування §Cпередової§! промислової технології також розблоковує три §Yунікальні технології§! у категорії §Yпромислових§! досліджень."
  bos_nf_the_coast_of_california: "Узбережжя Каліфорнії"
  bos_nf_the_coast_of_california_desc: "Братство ніколи не діяло на морі – пора це змінити. У глибинах вод – таємниці. А по той бік – загрози."

  bos_nf_seatrials: "Морські випробування"
  bos_nf_seatrials_desc: "Ми живемо у світі, де панує вода. Час пристосовуватись. Тестування довоєнних технологій на морі дасть нам перевагу."

  bos_nf_screening: "Охоронні кораблі"
  bos_nf_screening_desc: "Навіть найпотужніші судна вразливі перед торпедами чи диверсантами. Нам потрібні легкі кораблі супроводу для захисту флоту Братства."

  bos_nf_navallexicon: "Морська доктрина"
  bos_nf_navallexicon_desc: "Ми маємо розширити Кодекс для морських операцій. Кожне судно – це загін. Кожен капітан – паладин."

  bos_nf_aircatapults: "Катапульти для авіації"
  bos_nf_aircatapults_desc: "До Великої війни Америка запускала літаки з авіаносців. Ми можемо зробити це знову. Катапульти скорочують довжину зльоту – і збільшують наш радіус дії."

  bos_nf_seabehemoths: "Морські Бегемоти"
  bos_nf_seabehemoths_desc: "Братство тепер здатне розгортати найбільші бойові кораблі на морі!"

  bos_nf_steelcage: "Сталеве Гніздо"
  bos_nf_steelcage_desc: "«Сталеве Гніздо», як його з любов’ю називають – флагманський корабель нашого флоту. Довоєнне вантажне судно, модернізоване з артилерією, лазерами важкого калібру та ядерним реактором. Його броня майже невразлива. Багато хто вважає, що саме цей корабель є доказом нашого панування на морі."

  bos_nf_the_airways_of_california: "Повітряні шляхи Каліфорнії"
  bos_nf_the_airways_of_california_desc: "Ще у 2240-х ми намагалися вивчити секрети вертоптахів. Попри провал, зацікавлення залишилось. Час показати, що розпіарена Повітряна Сила Ведмедя – лише фікція, а не загроза."
  bos_lyons_model: "Лансери"
  bos_lyons_model_desc: "Експедиція Лайонса додала звання лансера — шлях розвитку від Послушника, який користується такою ж повагою, як Писар та Лицар. Ми перейняли їхню модель із приголомшливим успіхом."

  bos_nf_fighters: "Винищувачі"
  bos_nf_fighters_desc: "Дирижаблі вразливі до кулеметного вогню та ракет. Розгортання винищувачів забезпечить нам перевагу в повітрі."

  bos_nf_support: "Підтримка з повітря"
  bos_nf_support_desc: "Справжня сила авіації – у підтримці наших паладинів на полі бою. Ми повинні навчитися використовувати перевагу в повітрі на повну."

  bos_nf_airlexicon: "Повітряний кодекс"
  bos_nf_airlexicon_desc: "Літаки – це справжні лицарі: швидкі, не обмежені рельєфом. Яка символічність, що їх обслуговують «сквайри» – механіки нового часу."

  bos_nf_behemoths: "Повітряні Бегемоти"
  bos_nf_behemoths_desc: "Винищувачі домінування довоєнного світу – неймовірно потужні, але вимагають величезних ресурсів. Паливо, боєприпаси, обслуговування – багато хто в Братстві сумнівається в доцільності їх застосування."

  bos_nf_bombers: "Фортеці-бомбардувальники"
  bos_nf_bombers_desc: "Довоєнні фортеці-бомбардувальники – літаючі бастіони з кулеметами та турелями, здатні знищити будь-яку ціль. Дорогі, але ефективні. Здатність знищувати ворога без ризику – переконлива."

  bos_nf_scourge: "Кара"
  bos_nf_scourge_desc: "Братство раніше використовувало дирижаблі як транспорт. І лише нещодавно, після падіння НКР, ми можемо знову використовувати їх масово. Це вимагає глибокого розуміння технологій та стратегій їх застосування."

  bos_nf_securing_nearly_lost_bunkers: "Зміцнення майже втрачених бункерів"
  bos_nf_securing_nearly_lost_bunkers_desc: "Деякі бункери ще можна відновити. Це зміцнить наші шанси на остаточну перемогу!"

  bos_nf_bunker_alpaugh: "Бункер Альпо"
  bos_nf_bunker_alpaugh_desc: "У бункері Альпо польові писарі втримали позиції – на відміну від інших!"

  bos_nf_bunker_blackwell: "Бункер Блеквелл"
  bos_nf_bunker_blackwell_desc: "Кілька розвідників утримали Блеквелл, зустрічаючи наших паладинів з розпростертими обіймами."

  bos_nf_reclaiming_destroyed_bunkers: "Відвоювання знищених бункерів"
  bos_nf_reclaiming_destroyed_bunkers_desc: "На жаль, більшість бункерів на півночі повністю знищено. Але якщо знешкодимо мутовану фауну, зможемо відновити частину з них."

  bos_nf_bunker_atascadero: "Бункер Атаскадеро"
  bos_nf_bunker_atascadero_desc: "Бункер Атаскадеро став домом для мурах. Їх слід ліквідувати."

  bos_nf_bunker_morro: "Бункер Морро"
  bos_nf_bunker_morro_desc: "Тепер це покинута база, де оселились геккони."

  bos_nf_bunker_salinas: "Бункер Салінас"
  bos_nf_bunker_salinas_desc: "Салінас зайнятий невідомими істотами, що зробили його своїм лігвом."

  bos_nf_bunker_monterey: "Бункер Монтерей"
  bos_nf_bunker_monterey_desc: "Залишки бункера Монтерей захопила група Касадорів."

  bos_nf_elders_schemes: "Інтриги старійшин"
  bos_nf_elders_schemes_desc: "У Братства немає єдиного лідера. Тимчасового Верховного Старійшину обирають з-поміж ради – зазвичай для медіації. І сама потреба в такій посаді вже свідчить про внутрішню нестабільність."

  bos_nf_maxsonians: "Мексоніанці"
  bos_nf_maxsonians_desc: "Мексоніанці – консервативне крило Братства, прихильники суворого дотримання Кодексу. Саме вони, зокрема, наполягали на висилці старійшини Елайджі до Мохаве."

  bos_nf_jonathan_maxson_back_to_health: "Одужання Джонатана Мексона"
  bos_nf_jonathan_maxson_back_to_health_desc: "Дивовижно, але Джонатан Мексон повністю одужав! Його присутність укріплює позиції максоніанців – і веде фракцію до стабільного майбутнього."

  bos_nf_coronating_a_new_maxsonian_elder: "Інтронізація нового максоніанського старійшини"
  bos_nf_coronating_a_new_maxsonian_elder_desc: "Джонатан Мексон – видатна фігура, але він не вічний. Після важких поранень, отриманих у війні з НКР, час передати факел. Старійшина Анґгарад, герой битви за золотий резерв НКР, готовий взяти на себе цю місію."

  bos_nf_war_hero_of_the_ncr_war: "Герой війни з НКР"
  bos_nf_war_hero_of_the_ncr_war_desc: "Старійшина Анґгарад – видатна фігура Братства й ключова особа для керівництва мексоніанською фракцією після завершення правління Джонатана Мексона."

  bos_nf_honoring_the_maxson_elders: "Вшанування старійшин Мексона"
  bos_nf_honoring_the_maxson_elders_desc: "Лінія старійшин Мексона – найшанованіша в Лост-Гіллз, адже саме вона стояла біля витоків заснування нашої організації."

  bos_nf_the_line_of_succession: "Лінія спадкоємності"
  bos_nf_the_line_of_succession_desc: "Доля Артура Мексона, сина Джонатана – суворо охороняється. Його поява може змінити політику Лост-Гіллз. Пора вирішити, що буде найкраще – не лише для Артура, а й для Братства."

  bos_nf_rhombians: "Ромбіанці"
  bos_nf_rhombians_desc: "Фракція Ромбіанців – помірковані реформатори. Вони виступають за розумне оновлення Кодексу й інфраструктури. Їхня позиція часто співзвучна підходу експедиції Лайонза – з фокусом на допомогу цивільним."

  bos_nf_honor_the_ncr_war_veterans: "Вшанувати ветеранів війни з НКР"
  bos_nf_honor_the_ncr_war_veterans_desc: "Наші герої здолали Імперію Ведмедя. Всі осередки Братства – від Лост-Гіллз до Столиці – піднімуть келих у їхню честь!"

  bos_nf_call_out_poor_military_strategy: "Викрити хибну військову стратегію"
  bos_nf_call_out_poor_military_strategy_desc: "Війна з НКР показала обмеження наших тактик. Те, що працювало проти банди рейдерів, не діє проти національних армій. Ми маємо адаптуватися."

  bos_nf_long_history_of_reform: "Історія реформ"
  bos_nf_long_history_of_reform_desc: "Ромбіанці мають давню історію реформаторської діяльності в Братстві Сталі. Ми маємо визнати їхню роль в адаптації ордену до викликів часу."

  bos_nf_reaching_out_to_family: "Зв'язок із родиною"
  bos_nf_reaching_out_to_family_desc: "Дочка старійшини Марі, Кетрін, наразі мешкає на сході з осередком Братства біля Далласа. Якщо можемо – варто надіслати підтримку."

  bos_nf_taggerdys_legacy: "Спадщина Таґгерді"
  bos_nf_taggerdys_legacy_desc: "Таґгерді – ключова фігура для Ромбіанців. Вона зробила вибір, на який мало хто наважився б: пожертвувати осередком заради порятунку Пустки. Битва за Форт Діфайанс – легендарна подія, і ми маємо її вшанувати."

  bos_nf_new_reforms: "Нові реформи"
  bos_nf_new_reforms_desc: "Існує безліч реформ, які ми можемо впровадити в Братстві, якщо матимемо політичну волю. Деякі з них будуть непростими для ухвалення..."

  bos_nf_our_right: "Наше право"
  bos_nf_our_right_desc: "Як технократична організація, ми маємо священне право на володіння технологією. Ми не крадемо її зі зла – ми захищаємо невинних від їхньої ж недбалості. Наш обов’язок – зберегти стабільність у світі, який забув, як працює кнопка живлення."

  bos_nf_salvaged_metal: "Збір металобрухту"
  bos_nf_salvaged_metal_desc: "Метал у Пустці – як бур’ян. Скрізь. Збір металобрухту в нашій зоні дозволить поповнити запаси для подальшого виробництва."

  bos_nf_increase_power_production: "Посилення енергогенерації"
  bos_nf_increase_power_production_desc: "Генератори – життєво важливі. Вони потребують пального і часто не сумісні з місцевими замінниками. Але без них наше обладнання стоїть мертвим вантажем."

  bos_nf_salvaged_electronics: "Збір електроніки"
  bos_nf_salvaged_electronics_desc: "На відміну від металу, електроніка тендітна. Зняття проводки, чипів і плат із техніки дасть нам цінні ресурси для нових проєктів."

  bos_nf_advanced_tech: "Пошук високих технологій"
  bos_nf_advanced_tech_desc: "Довоєнні технології – найцінніші й найнебезпечніші. Там, де лежать їхні уламки, завжди знайдеться щось, що намагатиметься тебе вбити. Але саме там ми знайдемо найцінніше."

  bos_nf_fueling_our_rise: "Паливо нашого злету"
  bos_nf_fueling_our_rise_desc: "Ми шукаємо ядерне паливо. Невикористані елементи живлять усе – від силової броні до лазерної артилерії. Вони – ключ до нашого домінування."

  bos_nf_arm_foundries: "Озброїти литейні"
  bos_nf_arm_foundries_desc: "Ми не можемо захищати Кодекс без зброї. Якщо ми хочемо зберегти перевагу, нам потрібно не лише вилучати технологію – ми маємо її виробляти."
  bos_nf_scavenging_program: "Групи збору матеріалів"
  bos_nf_scavenging_program_desc: "Оскільки сусідні бункери евакуйовані або втрачені, мы відправлятимемо наших Лицарів на регулярні місії зі збору матеріалів, щоб підсилити залишки нашої промисловості. Такі вилазки пов'язані з ризиком, але у нас мало альтернатив, коли паладинів залишилося так мало..."
  bos_nf_circle_of_steel: "Коло Сталі"
  bos_nf_circle_of_steel_desc: "Коло Сталі уособлює деяких із наших найбільш фанатичних членів. Загалом вони непохитно дотримуються ідеї збереження технологій і провели численні операції для підтримки цього ідеалу на Пустці. Якщо Старійшина або Голова Капітулу саботує цю місію, саме Коло Сталі завітає до них із клинком у руках."
  bos_circle_of_steel: "Коло Сталі"
  bos_nf_circle_of_steel_brotherhood_spies: "Лоялісти Кодексу"
  bos_nf_circle_of_steel_brotherhood_spies_desc: "Багато членів Кола виконують регулярні обов'язки з розвідки та аудиту у своїх Капітулах, а також вирішують внутрішні проблеми капітулів, як-от корупцію, крадіжки та подібні злочини. Колу буде неважко передавати ці звіти нам."
  bos_nf_circle_of_steel_ncr_spies: "Наш давній ворог"
  bos_nf_circle_of_steel_ncr_spies_desc: "Десятиліттями Коло діяло на території НКР. Вони мають приховані аванпости та високопоставлених агентів, які готові та чекають на використання. Ми можемо наказати активувати їх знову, хоча дехто в НКР точно помітить щось неладне."
  bos_nf_circle_of_steel_surveillance_bunkers: "Стеження за Пусткою"
  bos_nf_circle_of_steel_surveillance_bunkers_desc: "Нам відомо про різні об'єкти на Пустці, які настільки малі, що можуть забезпечити проживання лише жменьки людей. Завдяки забезпеченню припасами та ремонту цих крихітних бункерів і протирадіаційних укриттів ми зможемо підтримувати більш активні операції."
  bos_circle_of_steel_surveillance_bunkers: "Бункери спостереження"
  bos_circle_of_steel_surveillance_bunkers_desc: "Різні віддалені або добре приховані місця по всій Пустці були пристосовані до справи. Крихітні укриття під заправками, урядові пости прослуховування та бункери, побудовані багатіями, які не бажали ділити з іншими Сховище, — усе це може забезпечити базу для невеликої команди оперативників. І тепер вони це роблять."
  
  bos_nf_the_veterans_pension: "Пенсія для ветеранів"
  bos_nf_the_veterans_pension_desc: "Соромно, але багато наших лицарів купували боєприпаси за власні кошти. Більше того, багато з них у боргах перед квартирмейстерами, які, в свою чергу, заборгували Ван Ґраффам. Це має бути вирішено негайно."

  bos_nf_currency_reform: "Реформа обігу"
  bos_nf_currency_reform_desc: "Наше розширення змушує нас зіткнутись із чимось гіршим, ніж Майстер, Анклав чи Легіон – із ринком. Щоб взаємодіяти з громадянами, нам доведеться створити хоч якусь систему торгівлі."

  bos_nf_finding_caps: "Пошук кришок"
  bos_nf_finding_caps_desc: "Попри зневагу до торгівлі, в часи Габа ми все ж співпрацювали з купцями. Продаж обмеженої кількості високотехнологічного обладнання за кришки – можлива альтернатива."

  bos_nf_bounty_hunting: "Полювання за винагородою"
  bos_nf_bounty_hunting_desc: "Братство в Аппалачії заробляло, виконуючи завдання для місцевих. Західне Братство також може піти цим шляхом. Якщо це зберігає Ланцюг, значить – виправдано."

  bos_nf_debts_of_the_quartermasters: "Борг квартирмейстерів"
  bos_nf_debts_of_the_quartermasters_desc: "Завдяки економічним реформам ми можемо сплатити борги перед Ван Ґраффами одноразово. Нехай це стане фіналом цієї ганьби."

  bos_nf_adjusting_to_bunker_life: "Адаптація до життя в бункері"
  bos_nf_adjusting_to_bunker_life_desc: "Для мешканців навколо Лост-Гіллз це буде зміна – з багатьох бункерів до одного. Ми маємо створити умови, за яких це життя стане не просто виживанням, а функціональною нормою."

  bos_nf_enforce_recycling_programs: "Програми переробки"
  bos_nf_enforce_recycling_programs_desc: "Бункер – як корабель у космосі: кожна деталь на вагу золота. Переробка зменшить потребу в імпорті та зробить Лост-Гіллз самодостатнім."

  bos_nf_repairing_ventilation_systems: "Ремонт вентиляції"
  bos_nf_repairing_ventilation_systems_desc: "З огляду на зростання чисельності в бункері, вентиляція – критичний елемент. Повітря має бути чистим – це не обговорюється."

  bos_nf_finding_new_living_space: "Пошук житлового простору"
  bos_nf_finding_new_living_space_desc: "Ми маємо розширити зони проживання, інакше нас чекає перенаселення. Це питання не розкоші, а виживання."

  bos_nf_advanced_scavenging: "Передове збирання"
  bos_nf_advanced_scavenging_desc: "Ми готові розпочати передову програму збирання: систематичне виявлення та повернення технології з Пустки."

  bos_nf_scavenging_weaponry: "Пошук бронежилетів"
  bos_nf_scavenging_weaponry_desc: "У довоєнній Америці вогнепальна зброя була всюди: від шкіл і лікарень до залів боулінгу. Поліція мала безліч бронежилетів, здатних зупинити кулю з якогось самопала — заберімо їх собі!"

  bos_nf_scavenging_plasma: "Полювання на лазери – у невірних місцях"
  bos_nf_scavenging_plasma_desc: "Хотілося б плазмову зброю... Мріяти не заборонено."

  bos_nf_scavenging_laser_rifles: "Пошук лазерних гвинтівок"
  bos_nf_scavenging_laser_rifles_desc: "На старих військових базах досі зберігаються запаси лазерної зброї. Ми маємо випередити конкурентів і здобути їх першими!"

  bos_nf_scavenging_heavy_energy_weapons: "Збирання важкої енергозброї"
  bos_nf_scavenging_heavy_energy_weapons_desc: "Незрозуміло, з яким саме ворогом американській армії довелося б боротися за допомогою лазерного гатлінга. Чи справді китайці були настільки небезпечними? Або ж у них були власні супермутанти, з якими доводилося воювати?"

  bos_nf_scavenging_support_equipment: "Збирання допоміжного обладнання"
  bos_nf_scavenging_support_equipment_desc: "Радіостанції, шоломи, гайкові ключі, енергетичні напої «Nuka Cola» – це не плазмогармати, але без них відділення не зможе виконати завдання."

  bos_nf_scavenging_medical_equipment: "Збирання медичного обладнання"
  bos_nf_scavenging_medical_equipment_desc: "Довоєнних медичних запасів лишилось небагато, але ми маємо зібрати все, що зможемо. Стімпаки та антибіотики потрібні нам більше, ніж будь-кому в Пустці. Адже ми служимо їй."

  bos_nf_scavenging_piercing_weaponry: "Збирання пробивної зброї"
  bos_nf_scavenging_piercing_weaponry_desc: "У НКР ракетні установки називають «відкривачками». Вони використовують їх проти наших лицарів. Ми не можемо дозволити цій зброї потрапити не в ті руки."

  bos_nf_scavenging_big_weaponry: "Збирання важкого озброєння"
  bos_nf_scavenging_big_weaponry_desc: "Ось твоя гвинтівка, ось твій пістолет. А ось твій міномет. І, якщо чесно, міномет – найкращий із трьох."

  bos_nf_scavenging_power_armor: "Збирання силової броні"
  bos_nf_scavenging_power_armor_desc: "Силова броня змінила хід Великої війни, допомігши США дійти до воріт Пекіна. Тепер вона – символ Братства. Ми маємо зібрати кожен екземпляр."

  bos_nf_scavenging_t45: "Збирання силової броні Т-45d"
  bos_nf_scavenging_t45_desc: "T-45d від West-Tek була першою серійною моделлю, відправленою на фронт. Вона вже не нова, але для наших лицарів – безцінна. Треба знайти якомога більше збережених одиниць."

  bos_nf_scavenging_power_armor_repair: "Ремонт силової броні"
  bos_nf_scavenging_power_armor_repair_desc: "Два століття ремонту зробили нас експертами. Ми можемо продовжити життя кожному екземпляру, якщо не соромитимемось замінити деякі компоненти деталями з дитячих довоєнних іграшок."

  bos_nf_scavenging_t51b: "Збирання силової броні T-51b"
  bos_nf_scavenging_t51b_desc: "Кажуть, у Співдружності Т-51b стільки, що її порівнюють із довоєнними спорткарами. Можливо, це лише легенда. Але якщо там і справді пофарбували екземпляр у яскраво-рожевий – то власник не заслуговує жити."

  bos_nf_scavenging_vehicles: "Збирання транспорту"
  bos_nf_scavenging_vehicles_desc: "Щоб подолати Пустку, нам потрібен транспорт. Навіть у силовій броні – дорога до Столичної Пустки довга. Можливо, варто перевірити старі автосалони, гаражі чи автобусні станції?"

  bos_nf_scavenging_mobile_vehicles: "Збирання мобільної техніки"
  bos_nf_scavenging_mobile_vehicles_desc: "Більшість довоєнного транспорту вже не на ходу, але деякі армійські машини були підготовлені до апокаліпсису. Варто взяти приклад із наших братів на Середньому Заході."

  bos_nf_scavenging_durable_vehicles: "Збирання витривалої техніки"
  bos_nf_scavenging_durable_vehicles_desc: "Нам не потрібні гламурні авто типу «Cherry Bomb». Нам потрібні машини, здатні подолати бездоріжжя, бруд, воду і навіть гори."

  bos_nf_scavenging_advanced_vehicles: "Збирання високотехнологічної техніки"
  bos_nf_scavenging_advanced_vehicles_desc: "Довоєнні танки – річ марна без національної промисловості. Але якщо ми знайдемо бодай кілька – хай краще вони будуть в нас, ніж у банди Вісімдесятників."

  bos_nf_greater_reforms: "Глибші реформи"
  bos_nf_greater_reforms_desc: "Час переглянути усталені інститути Братства Сталі. Вірити в ідеал – значить бути готовим зрадити його заради його ж порятунку."

  bos_nf_outsider_initiation: "Посвята сторонніх"
  bos_nf_outsider_initiation_desc: "Ми завжди ставилися з підозрою до чужаків. Але Волт-Двеллер, Обранець – хіба не сторонні? Час наслідувати Середній Захід і відкрити двері для гідних."

  bos_nf_initiate_ncr_settlers: "Посвята громадян НКР"
  bos_nf_initiate_ncr_settlers_desc: "Багато хто в НКР бачить, що їхня Республіка згнила. Вони шукають сенс. Шукай – і знайдеш Братство. Особливо поселенці Мексона."

  bos_nf_initiate_ranger_turncoats: "Посвята перебіжчиків-рейнджерів"
  bos_nf_initiate_ranger_turncoats_desc: "Не всі Рейнджери повірили брехні Республіки. Деякі знають – лише Братство може зберегти людство. Інші просто втомились від її несправедливості."

  bos_nf_initiate_necropolis_ghouls: "Посвята гулів із Некрополя"
  bos_nf_initiate_necropolis_ghouls_desc: "Ми не друзі гулів, але гулі з Некрополя часто мають технічні навички, що перевершують пересічного писаря. Дехто з них – гідний."

  bos_nf_limited_super_mutant_initiation: "Обмежена посвята супермутантів"
  bos_nf_limited_super_mutant_initiation_desc: "Так, це радикально. Але хіба Брокен-Гіллз не створено союзом із супермутантом? Середній Захід показав: вони можуть бути ланкою в Ланцюгу."

  bos_nf_commitment_to_duty: "Вірність обов’язку"
  bos_nf_commitment_to_duty_desc: "Виплати бійцям – це шлях до занепаду. Кодекс – це не робота, це служіння. Наша обіцянка: ми не знецінюватимемо цю віру грошима."

  bos_nf_commitment_to_purity: "Вірність чистоті"
  bos_nf_commitment_to_purity_desc: "Розширення лав – це ризик. Посвята – священний ритуал, що веде свій початок від Артура Мексона. Інтегрувати злочинців і мутантів – означає зневажити саме ядро нашого Ордену."

  bos_nf_currency_reform_caps: "Кришки"
  bos_nf_currency_reform_caps_desc: "Кришки самі по собі нічого не варті – але вони обмінюються на воду в Габі. Через це ми будуємо гідравлічну імперію, контролюючи іригацію й ферми Каліфорнії."

  bos_nf_currency_reform_gold_bullion: "Золоті злитки"
  bos_nf_currency_reform_gold_bullion_desc: "Чому золото має цінність? Ніхто не знає. Але це факт. Якщо щось цінується скрізь у Пустці – то це золото."

  bos_nf_currency_reform_ncr_dollar: "Долар НКР"
  bos_nf_currency_reform_ncr_dollar_desc: "Попри всі недоліки, НКР збудувала індустріальну економіку. Прийняття їхньої валюти спростить взаємодію з місцевими."

  bos_nf_currency_reform_scrip: "Скрип"
  bos_nf_currency_reform_scrip_desc: "Середній Захід радикальний – але створення власної валюти заслуговує на повагу. Прийнявши Скрип, ми поєднаємо Схід і Захід у єдину економічну сферу – прив’язану до Братства, як і їхнє майбутнє."

  bos_nf_open_up_to_traders: "Відкриття для торгівлі"
  bos_nf_open_up_to_traders_desc: "Досі торгівля Братства із зовнішнім світом була неофіційною – солдати, поза службою, обмінювались ресурсами. Час змінити це. Створімо справжню торгову мережу між Лост-Гіллз і рештою Пустки."

bos_nf_council_reforms: "Реформи Ради"
bos_nf_council_reforms_desc: "Минуло кілька непростих років з часу, коли посада Верховного Старійшини дійсно мала вагу. Війна з Республікою Нової Каліфорнії змістила баланс влади на користь паладинів та Ради. Після укладення перемир’я відкрилася можливість повернути Братство Сталі до усталеного, дисциплінованого порядку. Для початку ми офіційно закріпимо політичні блоки, що формуються серед Старійшин, як офіційні політичні угруповання."

bos_nf_head_elder_duty_duration: "Термін Повноважень Верховного Старійшини"
bos_nf_head_elder_duty_duration_desc: "У часи розквіту Братства посада Верховного Старійшини займалась довічно. Хоча відродити цю традицію буде нелегко, ми можемо закласти адміністративну основу для унормування термінів перебування на цій посаді."

bos_nf_political_blocs: "Політичні Блоки"
bos_nf_political_blocs_desc: "Нещодавно сформовані політичні блоки не залишають старійшинам причин залишатися поза будь-якими блоками. Повноваження Верховного старійшини щодо визначення порядку денного є засобом контролю над приналежністю до тих чи інших угруповань — куди веде пріоритетний порядок денний, туди й рухаються старійшини."

bos_nf_election_on_demand: "Просування за Запитом"
bos_nf_election_on_demand_desc: "Останні роки нові Верховні Старійшини обирались майже щороку. Якщо ми отримаємо важелі для проведення таких призначень у будь-який момент – це дасть нам гнучкість у реалізації стратегічних політичних маневрів."

bos_nf_paladins_given_some_sway: "Паладини Отримують Вплив"
bos_nf_paladins_given_some_sway_desc: "Паладини Братства Сталі, безперечно, є впливовою частиною нашої організації, але історично вони мали вплив лише на полі бою, залишаючись осторонь політичних інтриг старійшин. Утворення політичних блоків призвело до збільшення кількості рівних голосів і тупикових ситуацій, але, зважаючи на те, що більшість старійшин колись самі були паладинами, ми можемо стабілізувати нову політичну систему, надавши паладинам «додатковий голос», який дозволить розірвати рівність голосів завдяки голосу майбутніх старійшин."

bos_nf_political_bloc_management: "Керування Політичними Блоками"
bos_nf_political_bloc_management_desc: "Закріпивши структуру блоків, ми можемо видавати директиви, що впливають на конкретні угруповання. Наприклад, за умов низької підтримки певного блоку – вивести його з політичного процесу."

bos_nf_freeing_up_the_council_table: "Розширення Ради"
bos_nf_freeing_up_the_council_table_desc: "Мексоніанці та ромбіанці часто заходять у глухий кут через ідеологічні розбіжності. Введення нових Старійшин – раніше ізольованих через нетрадиційні погляди – дозволить розширити спектр думок і зменшити ризик безвиході."

bos_nf_advanced_political_schema: "Політична Схема"
bos_nf_advanced_political_schema_desc: "Старійшини Братства Сталі не цураються інтриг і маніпуляцій. Їхня поведінка – навчальний посібник з управління владою у межах закритої, технократичної структури."

  bos_nf_establishing_absolute_authority: "Встановлення абсолютної влади"
  bos_nf_establishing_absolute_authority_desc: "Потреба у швидкому прийнятті рішень постійно зростає. Хоча збалансована рада надає певні оперативні переваги, зростаюча непослідовність нашої політики та млявість, з якою ми реагуємо на зміну ситуацій, призводять до багатьох втрачених можливостей. Заклики Старійшин наділити Верховного Старійшину абсолютною владою стають дедалі гучнішими — Рада Старійшин може продовжити роботу, але в дорадчому статусі."
  bos_nf_establishing_diversity_of_thought: "Гарантування різноманітності думок"
  bos_nf_establishing_diversity_of_thought_desc: "Разом ми сильніші. Можливо, ми не приходимо до рішень так само швидко, як абсолютний Старійшина, але наші рішення вищої якості. Ми маємо обов'язок перед кожним Капітулом розглядати будь-які точки зору та вислуховувати пропозиції від кожного Старійшини."
  bos_unlock_new_council_buffs_tt: "Додає нові ефекти до Збалансованої Ради, аж до: \n§Y33% множник політичної влади§! (Третя за популярністю партія),\n§Y33% множник стабільності§! (Найнижча між Ромбіанцями та Максоніанцями),\n§Y-33% вартість створення національної території§! (Найнижча між Трійкою та Максоніанцями),\n§Y-33% необхідної покори для націоналізації§! (Найнижча між Ромбіанцями та Реформаторами),\n§Y-25% час виправдання мети війни§! (Найменша популярність партії)\n§CСила перераховується щотижня і досягає максимуму при §Y33% популярності партії§! для кожної групи, та лінійно масштабується до 0 зі зниженням популярності партії.§!"
  bos_nf_reformers: "Реформатори"
  bos_nf_reformers_desc: "Реформатори вважають, що кодекс має недоліки, і що мрія Роджера Максона — передати наші збережені технології спадкоємцю спадщини Америки — більше не може чекати. Якщо НКР для цього недостатньо хороша, їм доведеться стати такими."
  bos_nf_ncr_is_our_successor: "НКР гідна цього"
  bos_nf_ncr_is_our_successor_desc: "НКР — справжнє продовження американської демократії. Хоча їх все ще переслідують проблеми, нашої допомоги буде достатньо, щоб провести людство крізь наступні тисячоліття."
  bos_nf_ncr_end_of_tensions: "Кінець напруженості"
  bos_nf_ncr_end_of_tensions_desc: "Ми чітко дали зрозуміти НКР, що прагнемо тісніших стосунків. Принаймні зараз все спокійно."
  bos_nf_reformer_ascension: "Підготовка Верховного Старійшини"
  bos_nf_reformer_ascension_desc: "Нарешті Рада об'єднана. Максоніанці, Ромбіанці та Культисти Трійки втратили свої останні місця. В цей же час наступного року Ллойд стане Абсолютним Верховним Старійшиною Братства Сталі."
  bos_nf_a_better_brotherhood: "Творці піднесення людства"
  bos_nf_a_better_brotherhood_desc: "НКР не є спадкоємцем спадщини Америки. На Пустці немає жодної нації, здатної вижити тисячоліття, — крім нас."
  bos_nf_opening_our_vaults: "Наші збережені технології"
  bos_nf_opening_our_vaults_desc: "Є деякі технології та записи, які ми залишили припадати пилом на десятиліття. Настав час здути з них пил і підготуватися до нашого майбутнього."
  bos_nf_legion_defense_pact:0: "Мирна угода Максона"
  bos_nf_bigger_threats: "Запропонувати $bos_nf_legion_defense_pact$"
  bos_nf_bigger_threats_desc: "З огляду на зростаючу загрозу Легіону [CES.GetFlag] для заднього двору Братства в Максоні, Старійшина Ллойд запропонував обмежену дипломатичну угоду з нашим традиційним супротивником — Новою Каліфорнійською Республікою. Хоча НКР залишається нашим суперником, нас об'єднує спільний ворог — примітивні банди по той бік Колорадо. Цей пакт існує виключно для того, щоб зупинити просування Легіону та захистити Максон під егідою Братства, не поступаючись нашими принципами чи суверенітетом."
  bos_nf_strengthen_the_pact:0: "Зміцнити угоду"
  bos_nf_strengthen_the_pact_desc:0: "Багато хто ненавидить визнавати це в стінах бункера, але поки що наш час із НКР проходить без заминок. І вони, і ми були достатньо згідливими щодо цих умов, тож здається, що двері відчинені для їх розширення!"
  bos_nf_costs_50_army_xp:0: "Цей фокус коштує §H50§! £army_experience \n"
  operation_sunburst_has_concluded_tt:0: "§YОперація «Сонячний промінь»§! завершилася."
  bos_nf_bigger_threats_first_battle_has_occured:0: "§YПерша битва за дамбу Гувера§! між НКР та Легіоном завершилася."
  bos_nf_bigger_threats_unusual_circumstances_tt:0: "§YНезвичні обставини§! запобігли §YПершій битві за дамбу Гувера§! між НКР та Легіоном: або Легіон, або Мохавський Капітул володіє дамбою, і настав щонайменше 2279 рік."
  bos_has_been_nice_for_two_years_tt:0: "Ми є підписантом §Y$bos_nf_legion_defense_pact$§! і перебуваємо в ньому вже §Y2§! роки, не анулювавши угоду."
  bos_ncr_has_been_nice_for_two_years_tt:0: "Є підписантом §Y$bos_nf_legion_defense_pact$§! і перебуває в ньому вже §Y2§! роки, не анулювавши угоду."
  bos_nf_force_the_issue: "Вимагати Максон!"
  bos_nf_force_the_issue_desc: "З просуванням Легіону Лост-Гіллз усвідомлює критичну загрозу для Максона, нашої прабатьківщини. Оскільки НКР намагається втримати річку Колорадо з останніх сил, ми бачимо можливість силоміць вимагати контролю над Максоном, сповнені рішучості захистити його від рук дикунів і зберегти наші священні витоки."
  bos_ncr_accepted_deal_for_maxson: "Утворено $bos_nf_legion_defense_pact$ між БС та НКР"
  bos_LDP_join: "$bos_nf_legion_defense_pact$ задіяно"

  bos_nf_frozen_politics_0: "Наша нова нормальність"
  bos_nf_frozen_politics_0_desc: "Цей час приніс багато потрясінь в Америці. Рада старійшин повинна адаптуватися, виходячи з поточного політичного клімату. Сім'ї, які були впливовими протягом десятиліть, можуть впасти в немилість... або піднятися ще вище."
  bos_nf_frozen_politics_1: "Збалансована Рада"
  bos_nf_frozen_politics_1_desc: "Найістинніша ідентичність Братства — це та, де більшість голосів мають право висловитися. Надання голосу кожному дрібному радикалу — це те, що знищило Старий світ, а їхня корумпованість зруйнувала НКР. Лише аргументовані дебати різноманітних та різносторонніх Старійшин зможуть провести нас через наше правління Каліфорнією."
  bos_balanced_council: "Збалансована Рада"
  bos_balanced_council_desc: "Надає до: \n§Y0.33 приросту сили шпигунської мережі§! (Ромбіанці),\n§Y0.16 приросту командного ресурсу§! (Максоніанці),\n§Y16 щотижневого приросту військовозобов'язаних§! (Реформатори),\n§Y-0.66 приросту автономії суб'єкта§! (Культисти Трійки).\n§CСила перераховується щотижня і досягає максимуму при §Y33% популярності партії§! для кожної групи, та лінійно масштабується до 0 зі зниженням популярності партії.§!"
  bos_nf_frozen_politics_1_1: "Різноманітність думок"
  bos_nf_frozen_politics_1_1_desc: "Усі основні ідеології повинні бути офіційно представлені в нашій Раді. Ми негайно знімемо будь-які заборони на ці групи."
  bos_balanced_council_recommendation_tt: "§CНастійно рекомендується активувати §Y«Зміцнити позицію Верховного Старійшини»§! перед тим, як дозволяти різноманітність думок!§!"
  bos_nf_frozen_politics_2: "Допомога Капітулам: Підтримка Писарів"
  bos_nf_frozen_politics_2_desc: "Ми не повинні правити зверху. «Ланцюг, що пов'язує» був доведений до крайнощів, і інші капітули стали занадто підлеглими забаганкам наших місцевих Старійшин. Наша нова рада буде радою ширшого партнерства, де більшість складатимуть іноземні старійшини або їхні представники, хоча за собою ми збережемо відносну більшість."
  bos_unlocked_offer_scribe_team_tt: "Розблоковує §Yповторювані рішення§! для відправки наших §Yкоманд Писарів§! для консультування інших капітулів щодо розробок, будівництва військових заводів, інфраструктури, електростанцій або лабораторій мікросхем."
  bos_liberate_all_owned_tt: "Усі наші §Yконтрольовані території§!, які належать капітулам або потенційним капітулам, будуть звільнені як §Yавтономні уряди.§!"
  bos_nf_frozen_politics_3: "Неочікувана Рада"
  bos_nf_frozen_politics_3_desc: "Як не дивно, на Пустці існують групи, чиї принципи схожі на наші. Цілком можливо, що, якщо наші кордони наблизяться достатньо близько, вони працюватимуть з нами в рамках добровільного партнерства. За кілька десятиліть вони навіть можуть стати рівноправним Капітулом."

  bos_nf_the_troika: "Трійка"
  bos_nf_the_troika_desc: "Культ Трійки — підступний та довговічний. Будь-яке загравання з ними безсумнівно призведе до потрясінь, яких Братство ще не бачило."
  bos_nf_our_bloody_coup: "Батіг"
  bos_nf_our_bloody_coup_desc: "Війна — це наша ідеальна можливість. Багато найвідданіших традиціоналістів змушені йти на поле бою, де може статися будь-що..."
  bos_nf_our_insidious_message: "Пряник"
  bos_nf_our_insidious_message_desc: "У цей мирний час ми маємо бути тихими. Мало хто зрозуміє Апокрифи Трійки, але багато хто їх боїться. Нашими першими цілями стануть ветерани наших війн, які повернулися зламаними. Вони можуть знову зробити себе цілими."
  bos_nf_breaking_our_opponents: "Порушені обітниці"
  bos_nf_breaking_our_opponents_desc: "Через численні смерті на полі бою ми здобуваємо репутацію порівняно непереможних завдяки нашим небагатьом командирам.\n\nМи використаємо цей статус у раді, пропонуючи плани командирам інших фракцій. Ті, хто дослухатимуться наших порад, матимуть більше успіху, а також знайдуть копію Апокрифів Трійки на своїх ліжках... з наступним планом усередині."
  bos_nf_absolute_high_elder_rhiannon: "Абсолютна Верховна Старійшина Ріаннон"
  bos_nf_absolute_high_elder_rhiannon_desc: "§cНезабаром прийде Сталева Чума.§!"
  bos_nf_cult_of_the_commons: "Культ Простолюду"
  bos_nf_cult_of_the_commons_desc: "Наші послання просякли на найглибші рівні бункера Лост-Гіллз, де часто забуті Писарі сидять над стародавніми таємницями. Саме там, у вустах Писарів і вухах Послушників, наші слова знайшли відгук. Хто знає, що стане можливим, коли в справу вступлять імпланти?"
  bos_nf_our_cruelty: "Ріки стають червоними"
  bos_nf_our_cruelty_desc: "§cНастав час.§! §cУ їхніх вінцях лежать їхні §OПаскальбайти.§! Знайдіть їх і вкрадіть їхню сутність. У світлі §OКотла§! ми створимо §OСкарби,§! кожен із тисячі вінців. Ми закладемо §OХмиз§! для §OДругого Полум'я§!, і лише тоді багато Старійшин влаштують §OВелику Бурю.§!§!"
  troika_unlock_augment_system_tt: "§PТрійка встановлює деякі аугментації у вашого поточного лідера. Вони не перенесуться, якщо ваш лідер зміниться.§! \n\n§wСистема аугментацій жорстко закодована, тому доведеться обійтися цим. Вибачте!§!"
  unlock_offers_troika_tt: "§cРозблоковує рішення для навернення лідерів інших Капітулів у віру Апокрифів Трійки шляхом встановлення спеціального імпланта... а також кривавий метод їхньої підготовки.§!"
  bos_nf_the_great_storm: "§OВелика Буря§!"
  bos_nf_the_great_storm_desc: "§OУсі збираються. Кожне Вогняне Слово служить своїй меті. У Котлі починається великий ритуал. Усе стане§!§R ОСОБЛИВИМ.§!"

bos_nf_long_range_communications: "Дальній Зв’язок"
bos_nf_long_range_communications_desc: "Як головний осередок Братства Сталі на континенті, ми маємо забезпечити виживання всіх далеких відгалужень, що поділяють нашу місію – зберігати та охороняти спадщину людства."

bos_nf_long_range_communications_alternative: "Дослідження Дальнього Зв’язку"
bos_nf_long_range_communications_alternative_desc: "Як головний осередок Братства Сталі на континенті, ми маємо забезпечити виживання всіх далеких відгалужень, що поділяють нашу місію – зберігати та охороняти спадщину людства."

bos_nf_long_range_radio_towers: "Радіовежі"
bos_nf_long_range_radio_towers_desc: "Підсилення наших радіовеж у Лост-Гіллз дозволить підтримувати стабільний зв’язок з іншими осередками по пустках і оперативно надавати їм технічну чи бойову підтримку."
bos_lost_hills_consider_chapter_support: "Розглянути можливість надання допомоги [FROM.getName]"
bos_lost_hills_consider_chapter_support_unlock_tt: "Розблоковує §Yодноразові рішення§! щодо надання військової допомоги відділенням"
bos_supported_us: "Лост Гіллз підтримує цей відділ"
bos_nf_long_range_communications_washington_brotherhood: "Вашингтонське Братство"
bos_nf_long_range_communications_washington_brotherhood_desc: "§g\"..§YПозначення;§! Вашингтонське Братство (раніше – ескадрон Lance)\n§YОпис;§! Найновіший осередок, сформований колишніми командирами ескадрону Lance, які прагнули позбутися контролю Серединного Братства й підкорятися напряму нам..\n§YПримітки писарів;§! Вживання термінів 'Братство' або 'Відділ' у назві – внутрішнє рішення кожного відгалуження й не має формального значення. За нормальних умов подібне нехтування Ланцюгом Підпорядкування було б покаране, але війна з НКР унеможливлює віддалене втручання. Тим не менш, їхня лояльність до нас, а не до Епсілону, може виявитися вирішальною, якщо Серединне Братство зрадить.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_wbh_the_immortals_coup_succesful: "Переворот Безсмертного Вдався"
bos_nf_wbh_the_immortals_coup_succesful_desc: "Сили, вірні The Cause – залишки серединних лоялістів та опозиція Безсмертному – були усунуті. Нове Вашингтонське Братство остаточно утвердило себе як спадкоємець справжньої ідеї Братства на далекій півночі."

bos_nf_wbh_the_cause_succesful: "Успіх спротиву"
bos_nf_wbh_the_cause_succesful_desc: "Безсмертного було знищено, і його місце зайняв спротив – угруповання, вірне Серединному Братству, що виступило проти перевороту у Вашингтоні.\nНа щастя, їхня лояльність до нас не менша, ніж у Безсмертного. Можливо, вони ще принесуть користь?"

bos_nf_wbh_the_alaskan_expedition: "Аляскинська Експедиція"
bos_nf_wbh_the_alaskan_expedition_desc: "Аляскинська експедиція була великим задумом Безсмертного – дослідженням далекої півночі та її таємниць. Якщо ми зможемо відновити контакт із ним, то, можливо, дізнаємося, що саме він відкрив?"

bos_nf_the_masters_army_reborn: "Армія Творця Відроджена"
bos_nf_the_masters_army_reborn_desc: "Кровожерливість Warren взяла гору. Там, де колись паладини стримували холод півночі, тепер стоїть орда, що б’є в барабани з людської шкіри та висмоктує кістковий мозок. Це – чорний день для всього людства."

bos_nf_tca_conquest_of_the_alaskan_pipeline: "Захоплення Аляскинського Нафтопроводу"
bos_nf_tca_conquest_of_the_alaskan_pipeline_desc: "Ескадрон Lance закріпив за собою стратегічні точки Аляскинського трубопроводу. Утримання цих об’єктів не дозволить злочинним угрупованням отримати над ними контроль!"

bos_nf_long_range_communications_taggerdys_expedition: "Грім Таґгерді"
bos_nf_long_range_communications_taggerdys_expedition_desc: "§g\"..§YПозначення;§! Грім Таґгерді, також відомий як Аппалачійська Експедиція або Аппалачійське Братство Сталі.\n§YОпис;§! Один із перших осередків, сформований із підрозділу рейнджерів Армії США, з яким наш Засновник встановив контакт після Великої Війни. Ми неодноразово намагалися надіслати підкріплення до Аппалачів – але звісток про їхній стан не надходило.\n§YПримітки писарів;§! Дивна справа. Чи маємо ми ще якісь згадки про них? Мені потрібно дістати розшифровки бесід Засновника з Таґгерді. Частина мене сумнівається, що цей осередок взагалі існував.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_bap_conflict_in_the_chapter: "Конфлікт в Відділу"
bos_nf_bap_conflict_in_the_chapter_desc: "До нас надходять перші звіти про те, що певний період Аппалачійський осередок Братства Сталі перебував у стані... громадянського конфлікту? Необхідно доручити писарям з'ясувати істину."

bos_nf_bap_an_early_super_mutant_threat: "Рання Загроза Супермутантів"
bos_nf_bap_an_early_super_mutant_threat_desc: "Виявилося, що члени Аппалачійського осередку тривалий час протистояли загрозі супермутантів. Особливість цієї загрози в тому, що вони передували мутантам з Армії Творця."

bos_nf_long_range_communications_mojave_chapter: "Відділ Мохаве"
bos_nf_long_range_communications_mojave_chapter_desc: "§g\"..§YПозначення;§! Відділ Мохаве\n§YОпис;§! Очолюваний Старійшиною Елайджою, Відділ Мохаве мав розширити присутність Братства у регіоні, здобути контроль над Гуверською дамбою та зупинити експансію НКР на схід.\n§YПримітки писарів;§! Один з новітніх осередків, Мохаве був здебільшого споряджений застарілим обладнанням, залишеним після війни з НКР. На думку цього писаря, від самого початку осередок не мав на меті довгострокове існування – Верховний Старійшина, здається, просто шукав спосіб усунути політичний вплив Елайджі в Лост-Гіллз, а також створити тимчасовий бар'єр для НКР, поки ми відновлюємо сили на заході.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_moj_elijahs_downfall: "Падіння Елайджі"
bos_nf_moj_elijahs_downfall_desc: "Зрештою, саме Елайджа став причиною краху Відділу Мохаве. Ганебна поразка під час військової операції «Сонячний Спалах» практично стерла осередок з лиця пустки – уцілілі змушені були сховатися глибоко під землею в невідомому місці."

bos_nf_moj_recruiting_mcnamara: "Повернення Макнамари"
bos_nf_moj_recruiting_mcnamara_desc: "Макнамара виявив себе як ключова постать у збереженні місії в Мохаве. Враховуючи його військову майстерність, варто залучити його до справ у Лост-Гіллз – подивимось, чого він зможе досягти під належним керівництвом."

bos_nf_moj_victory_at_sunburst: "Перемога у Сонячному Спалаху"
bos_nf_moj_victory_at_sunburst_desc: "Елайджа, схоже, здобув перемогу в битві при Сонячному Спалаху! Йому вдалося не лише перемогти війська НКР, а й узяти під контроль як Гуверську дамбу, так і надзвичайно цінну енергетичну установку – Геліос Один."

bos_nf_study_legionary_tactical_data: "Вивчити Тактичні Дані Легіону"
bos_nf_study_legionary_tactical_data_desc: "Завдяки конфлікту в Мохаве проти Легіону ми отримали вкрай перспективні зразки технологій – їх аналіз може принести стратегічну перевагу!"

bos_nf_moj_elijahs_expeditions: "Експедиції Елайджі"
bos_nf_moj_elijahs_expeditions_desc: "Елайджа дедалі більше дозволяє собі відхилятись від плану експедиції. За свідченнями членів осередку, його увагу привернуло певне казино. Сподіваймося, ця імпровізація не обернеться катастрофою."

bos_nf_long_range_communications_maxson_chapter: "Відділ Мексона"
bos_nf_long_range_communications_maxson_chapter_desc: "§g\"..§YПозначення;§! Відділ Мексона\n§YОпис;§! Заснований після виявлення довоєнного бункера губернатора в Колорадо. Відділ мав на меті здобути всі доступні технології й креслення з цього об'єкта, а також з роботизованого заводу в Денвері й Сховища-0..\n§YПримітки писарів;§! Цей осередок залишається своєрідною загадкою. Він так і не отримав повного оснащення для виконання своєї місії – лише третину від того, що запитували паладини. Можливо, його справжнім призначенням було утримання Бункера Мексона до прибуття Технологічних Рятівників Людства?.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_maxsons_end: "Кінець Мексона"
bos_nf_maxsons_end_desc: "Схоже, що Бункер Мексона таки впав. Прикро – якби його обороняли ми, а не Старійшина Брикслі, він міг би протриматися значно довше."

bos_nf_maxson_victorious: "Бункер Утримано"
bos_nf_maxson_victorious_desc: "Лист від експедиції Мексона містить новини та довгоочікуване підкріплення."

bos_nf_mxc_denvers_treasures: "Скарби Денвера"
bos_nf_mxc_denvers_treasures_desc: "Денвер – джерело цінного технолому, який ідеально підійде для нашого осередку. Повна зачистка та евакуація знахідок триватиме роками."

bos_nf_eastern_legionary_tactical_data: "Тактичні Дані Східного Легіону"
bos_nf_eastern_legionary_tactical_data_desc: "До нас надходять повідомлення про конфлікти Легіону на сході та їхнього безжального провідника. Ці дані можуть стати вирішальними у підготовці до можливого зіткнення."

bos_nf_long_range_communications_texas_expedition: "Техаська Експедиція"
bos_nf_long_range_communications_texas_expedition_desc: "§g\"..§YПозначення;§! Техаська Експедиція\n§YОпис;§! Техаська Експедиція отримала завдання після поразки Творця – знайти й нейтралізувати генерала Аттіса.\n§YПримітки писарів;§! Експедицію очолював Ромбус, який добровільно погодився на неї після конфліктів із Радою. Дехто стверджує, що навіть сьогодні ще залишились ті, хто затаїв образу на Ланцюг Підпорядкування та на саме Братство.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_tbh_an_unexpected_end: "Неочікуваний Кінець"
bos_nf_tbh_an_unexpected_end_desc: "Схоже, Братства Сталі в Техасі більше не існує. Таким чином остаточно завершено спадщину Ромбуса у Штаті Одинокої Зірки."

bos_nf_coronate_the_alamo_chapter: "Перехід до Відділу Аламо"
bos_nf_coronate_the_alamo_chapter_desc: "Відділ Аламо є наступником техаського Братства Сталі, сформований після внутрішнього розколу, коли частина цивільних членів осередку відмовилась від Кодексу та присяг. Переслідування їх за зраду коштувало б занадто дорого. Найкраще, що ми можемо зробити зараз – підтримати осередок Аламо й сподіватись, що далася гілка повернеться до Братства."

bos_nf_victory_over_machines: "Перемога Над Машинами"
bos_nf_victory_over_machines_desc: "Відділ Аламо здобув вирішальну перемогу над арміями Санта Анни – давнього лідера з Мексики, якому нібито понад чотириста років... Хм. Це, ймовірно, якась помилка у переданих даних."

bos_nf_texaco_oil_rig: "Нафтовий Ріг Texaco"
bos_nf_texaco_oil_rig_desc: "Відділ Аламо здобув потужний інструмент для роботи з загадковою мережею Посейдон-net – унікальний позивний, який дозволяє видавати себе за американську адміністрацію. Це відкриває доступ до технологій, про існування яких ми й не підозрювали."

bos_nf_long_range_communications_midwest_expedition: "Серединна Експедиція"
bos_nf_long_range_communications_midwest_expedition_desc: "§g\"..§YПозначення;§! Серединне Братство Сталі (раніше – Східне Братство Сталі.)\n§YОпис;§! Серединне Братство – один із найдовговічніших осередків, що діє задля забезпечення контролю над центральними пустками й боротьби з загрозами, які становлять ризик для нашої великої організації.\n§YПримітки писарів;§! На ранніх етапах історії Лост-Гіллз від Братства відкололась група паладинів, старійшин та писарів, яка назвала себе Технологічними Рятівниками Людства. Вони вважали, що бачення Мексона помилкове в одному принциповому пункті: що технології слід не лише охороняти, а й використовувати для допомоги нинішнім поколінням. Це хибна ідея, й кожен, хто має сумніви, має ще раз перечитати Кодекс.\nПопри це, Серединне Братство має гідну історію – воно стало одним із найпомітніших осередків у нашій спільній спадщині.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_ending_the_dream: "Серце Америки"
bos_nf_ending_the_dream_desc: "Попри всі наші зусилля, перемогу здобула група, що зветься Чиказьким Анклавом. Серединні території тепер опинилися під контролем нової темної епохи – епохи, зробленої ще зловіснішою та, можливо, ще краще захищеною спотвореним блиском науки."

bos_nf_bmw_midwest_enclave_tactical_experience: "Тактичний Досвід із Анклавом"
bos_nf_bmw_midwest_enclave_tactical_experience_desc: "Зіткнення Серединного Відділу з Анклавом дало нам цінну інформацію. Спробуймо її ретельно проаналізувати."

bos_nf_chicagos_reclaimation: "Повернення Чикаго"
bos_nf_chicagos_reclaimation_desc: "Місто Чикаго повернено! Вирване з рук Секретаря Внутрішніх Справ, тепер ці самовдоволені правителі 'столиці' служать нам..."

bos_nf_the_secrataries_secrets: "Таємниці Секретаря"
bos_nf_the_secrataries_secrets_desc: "У своїх сховищах даних Секретар зберігав важливі технологічні знання. Вони стануть нам у пригоді."

bos_nf_long_range_communications_gulf_expedition: "Гольфська Експедиція"
bos_nf_long_range_communications_gulf_expedition_desc: "§g\"..§YПозначення;§! Гольфське Братство Сталі\n§YОпис;§! За незначними контактами з експедицією Лайонза, ми дізналися, що Гольфське Братство бере початок із Серединного осередку. Їхньою метою є пошук об'єкта, відомого як Джерело Снів – вежі, здатної створювати природну альтернативу до Рад-Авей.\n§YПримітки писарів;§! Налагодити контакт із цим осередком варто якомога швидше – ми знаємо про них неприпустимо мало..\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_bgf_run_down: "Знищені"
bos_nf_bgf_run_down_desc: "Ні! Гольфська Експедиція повністю знищена! Її залишки були змушені відступити на захід або сховатися глибоко під землею, уникаючи помсти Родини ДеСото."

bos_nf_bgf_dominion_over_the_peninsula: "Домінування Над Півостровом"
bos_nf_bgf_dominion_over_the_peninsula_desc: "Гольфське Братство оголосило про свою перемогу в Еверглейдсі, а отже – й контроль над усім півостровом!"

bos_nf_bgf_desoto_drug_trade: "Наркоторгівля Родини ДеСото"
bos_nf_bgf_desoto_drug_trade_desc: "Родина ДеСото – невелика злочинна структура поблизу Тампи – роками брала участь у прибутковій наркоторгівлі. Гольфське Братство виявило в їхньому укріпленні величезні обсяги матеріальних цінностей."

bos_nf_bgf_the_fountain_of_dreams: "Джерело Снів"
bos_nf_bgf_the_fountain_of_dreams_desc: "Так зване Джерело Снів – це природний шпиль у Флоридських Еверглейдс, із якого б'є потік «Сноводи» – потужного природного антимутагену."

bos_nf_long_range_communications_san_fran_chapter: "Відділ Сан-Франциско"
bos_nf_long_range_communications_san_fran_chapter_desc: "§g\"..§YПозначення;§! Відділ Сан-Франциско\n§YОпис;§! Один із давніших осередків. Імператор Ши дозволив нам створити дослідницьку станцію у межах їхнього міста. Повноваження осередку обмежені, проте ця база є цінною для вивчення як довоєнних технологій, так і розробок учених Ши.\n§YПримітки писарів;§! Через могутню владу Ши ми не могли просто увійти до Сан-Франциско без підтримки Імператора. Це нетипова співпраця, але історія показала її ефективність – зокрема, у справі досліджень нафтової платформи Посейдон.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_shi_contact_the_bunkers: "Зв’язок із Бункерами"
bos_nf_shi_contact_the_bunkers_desc: "Від часу укладення перемир’я з НКР ми не перевіряли ситуацію в осередку Сан-Франциско. Пора дізнатися, як вони тримаються."

bos_nf_shi_the_chapters_unexpected_growth: "Неочікуване Зростання Відділу"
bos_nf_shi_the_chapters_unexpected_growth_desc: "Після розпаду бойових угруповань у Сан-Франциско місто опинилося в хаосі. Імператор Ши звернувся до місцевого Братства по допомогу у відновленні порядку.\nЗвісно ж, наші брати прийняли цей заклик – і фактично перебрали контроль над містом."

bos_nf_shi_the_emperors_blessing: "Благословення Імператора"
bos_nf_shi_the_emperors_blessing_desc: "Відділ у Сан-Франциско активно співпрацює з поселенцями Ши й прагне зміцнити добрі стосунки з Братством. Якщо ми побажаємо, один із наших старійшин може бути благословенний самим Імператором."

bos_nf_long_range_communications_guardian_brotherhood: "Братство-Хранителі"
bos_nf_long_range_communications_guardian_brotherhood_desc: "§g\"..§YПозначення;§! Братство-Хранителі* (Примітка писаря: Писарка Анна близько 2195 року, у межах 7-ї гілки, вперше використала цю назву – але я не впевнений, звідки вона її взяла. Можливо, це було припущення.)\n§YОпис;§! Один із найстаріших осередків – Хранителі...\n§YПримітки писарів;§! Потребую дозволу Верховного Старійшини на доступ до архівів заснування, бо інформації про Хранителів практично немає. Є кілька згадок про конфлікти навколо поховальних прав часів виходу з Маріпоси, але події до, під час і після їхнього прибуття у Світіння майже повністю втрачені. Мабуть, попередні писарі були такими ж розчарованими, як і я.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_grd_guardians_failed: "Запізно до Пострілу"
bos_nf_grd_guardians_failed_desc: "З падінням Хранителів завершилась і їхня невдала місія. Можливо, якби вони залишилися з нами, цієї долі вдалося б уникнути?"

bos_nf_grd_guardians_succesful: "Невада Врятована"
bos_nf_grd_guardians_succesful_desc: "Хранителі, у, мабуть, найвизначнішому моменті існування свого занедбаного осередку, здобули одну з найбільших перемог за останнє століття – перемогли своїх суперників у Неваді й взяли під контроль більшість долини Есмеральда."

bos_nf_grd_reach_out_to_the_guardians: "Вийти на Зв’язок з Хранителями"
bos_nf_grd_reach_out_to_the_guardians_desc: "Настав час – нехай і неохоче – визнати здобутки Хранителів. Якщо ми проявимо гнучкість і підемо на певні поступки, можливо, вдасться повернути їх під прапори Лост-Гіллз."

bos_nf_grd_wonders_of_tv_town: "Дива TV-Тауна"
bos_nf_grd_wonders_of_tv_town_desc: "TV-Таун – химерне, загадкове поселення, повністю заселене андроїдами. Ймовірно, модифіковані варіації штурмотронів? Машини діяли як люди, але мали одну ключову відмінність:\nУ них не було співчуття."

bos_nf_long_range_communications_the_lyons_expedition: "Експедиція Лайонза"
bos_nf_long_range_communications_the_lyons_expedition_desc: "Місія Старійшини Лайонза була простою: відновити зв’язок зі східними осередками, з’ясувати правду про активність супермутантів у Вашингтоні та повернути столицю США під контроль Братства."

bos_nf_bls_shephards_conquest: "Завоювання Шепарда"
bos_nf_bls_shephards_conquest_desc: "Чутки про супермутантів виявилися правдивими – угруповання на чолі з мутантом на ім’я Шепард захопило Вашингтон! Солдати Лайонза були змушені піти у підпілля."

bos_nf_bls_outcasts_travel_to_the_pit: "Вигнанці Прямують до Пітта"
bos_nf_bls_outcasts_travel_to_the_pit_desc: "Після падіння Вигнанців вони звернулися по допомогу до інших. Ішмаель Ашур, колишній член Братства, дозволив їм оселитися в місті, відомому як Пітт."

bos_nf_bls_eastern_mutant_tactical_experience: "Тактичний Досвід Проти Східних Мутантів"
bos_nf_bls_eastern_mutant_tactical_experience_desc: "Завдяки перемозі Лайонза над Шепардом ми отримали додатковий досвід у боротьбі зі східними мутантами. Схоже, там доволі часто з’являються супермутанти-гіганти, розмірами з бойову машину."

bos_nf_bls_edens_victory: "Перемога Ідена"
bos_nf_bls_edens_victory_desc: "Особистість на ім’я Джон Генрі Іден, який проголошує себе президентом Сполучених Штатів, здобула перемогу на сході. Чи досі Анклав активний у цьому регіоні?"

bos_nf_bls_lyons_libery_prime_archives: "Архіви «Ліберті Прайм»"
bos_nf_bls_lyons_libery_prime_archives_desc: "На сході експедиція Лайонза працює над рідкісним зразком технології – проєктом «Ліберті Прайм». Вони запропонували поділитися з нами кресленнями, виявленими під час досліджень."

bos_nf_bls_the_anchorage_simulation: "Симуляція Анкориджу"
bos_nf_bls_the_anchorage_simulation_desc: "Кілька Вигнанців натрапили на надзвичайно реалістичну цифрову симуляцію – історичне відтворення битви за Анкоридж. Вони передали нам транскрипти, які проливають світло на те, як діяли довоєнні системи озброєння."

bos_nf_bls_lyons_project_purity: "Проєкт «Чистота»"
bos_nf_bls_lyons_project_purity_desc: "Проєкт «Чистота» – один із найбільших інженерних проєктів після війни: спроба очистити мільйони галонів води в припливному басейні поблизу столиці. Лише в останні роки проєкт почав діяти на повну потужність."

bos_nf_bls_eastern_enclave_tactical_experience: "Тактичний Досвід Проти Східного Анклаву"
bos_nf_bls_eastern_enclave_tactical_experience_desc: "Битви Східного Братства проти Анклаву надали нам додаткові знання про тактику ворога й засоби протидії."

bos_nf_bls_dominion_over_dc: "Домінування над Столицею"
bos_nf_bls_dominion_over_dc_desc: "Братство практично завершило місію в Вашингтоні. Тепер вони зосереджуються на новому завданні: дослідити тривожні сигнали з Співдружності Массачусетсу. Вони вирушають на північ – дізнатися, що коїться в Бостоні."

bos_nf_bls_outcasts_triumphant: "Тріумф Вигнанців"
bos_nf_bls_outcasts_triumphant_desc: "Фракція, відома як Вигнанці, повністю перебрала контроль над експедицією Лайонза. Під керівництвом Паладина Касдіна, Східне Братство прагне виконати місію, залишаючись вірним Кодексу."

bos_nf_bls_sarahs_rise: "Сходження Сари"
bos_nf_bls_sarahs_rise_desc: "Сара Лайонз, донька покійного Старійшини Лайонза, стала новим лідером Східного Братства. Вона прагне вести його вперед, не обмежуючись баченням, залишеним батьком."

bos_nf_bls_the_hero_of_man: "Герой Людства"
bos_nf_bls_the_hero_of_man_desc: "Відправити Артура на схід було правильним рішенням. Він зумів зцілити розкол між Вигнанцями та Східним Братством, об’єднавши їх у єдину силу. Вони прагнуть стати повноцінним осередком Братства – не гіршим за інші."

bos_nf_bls_victory_in_the_commonwealth: "Перемога в Співдружності"
bos_nf_bls_victory_in_the_commonwealth_desc: "Тостери з Інституту знищено. Загроза синтів ліквідована – людство врятовано."

bos_nf_bls_mankind_redefined: "Людство Перетворене"
bos_nf_bls_mankind_redefined_desc: "Східна експедиція завершилась крахом. Темні сили Співдружності завдали удару, який Братство не витримало."

  bos_nf_long_range_communications_montana_chapter: "Відділ Монтани"
  bos_nf_long_range_communications_montana_chapter_desc: "§g\"..§YПризначення;§! Капітул Монтани\n§YОпис;§!Капітул Монтани, на щастя, надіслав нам коротке повідомлення з поясненням свого заснування. Вони кажуть, що є загоном Братства Сталі Середнього Заходу, відправленим для здобуття технологій у Монтані для цього відділення..\n§YНотатки Писаря;§! Старійшина Патрокл, здається, готовий дослухатися до наших писарських запитів, що натякає мені на те, що це відділення має потенціал слідувати Ланцюгу, що пов'язує, і прислухатися до слова Лост-Гіллз..\"§! §YВитяг із Лексикону Капітулів, 13-й Відділ.§!"
  bos_nf_mch_secrets_of_middlemark:0 "Товари Мідлмарка"
  bos_nf_mch_secrets_of_middlemark_desc:0 "У Мідлмарку машини та рейдери змішалися, утворивши націю, безжально зосереджену на максимізації вбивств. З їхньою поразкою багатства Мідлмарка більше не належать їм."
  BOS_is_a_brotherhood_nation_tt:0 "Вони повинні бути офіційно пов'язані з Братством Сталі §R(тобто бути в нашому реєстрі!)§!"
  bos_nf_mch_secrets_of_hephaestus:0 "Сила Гефеста"
  bos_nf_mch_secrets_of_hephaestus_desc:0 "Необмежена енергія — мрія кожного Капітулу. Технології, які ми зберігаємо, спраглі до світу енергії, якого більше не існує. «Гефест» — найбільший тепловий генератор, який коли-небудь був зафіксований. З його потужністю під нашим контролем у Монтані, у нас є надлишок сили в штаті, оскільки реліквії минулих епох живляться безперебійно. Деякі з найкращих бійців капітулу будуть відкликані для підтримки наших зусиль у Каліфорнії."
  bos_nf_mch_missions_conclusion:0 "Кінець експедиції"
  bos_nf_mch_missions_conclusion_desc:0 "Трагедія! Капітул Монтани майже знищено ворожими елементами."
  bos_nf_mch_secrets_of_mcarthur:0 "Макартур викрито"
  bos_nf_mch_secrets_of_mcarthur_desc:0 "Привид Анклаву знову показав своє обличчя і зазнав поразки від Монтани. Вміст бази було конфісковано, а більшість літаків запропоновано нам, щоб їх можна було використовувати на більш активних театрах бойових дій."
  bos_nf_mch_secrets_of_manifest:0 "Пошуки в МАНІФЕСТІ"
  bos_nf_mch_secrets_of_manifest_desc:0 "Після розслідування на базі МАНІФЕСТ, Монтана підготувала підкріплення для нашого капітулу. МАНІФЕСТ — це похмуре нагадування про те, що з кожною годиною технології неймовірної небезпеки залишаються не в тих руках або сіють хаос безконтрольно. Мало хто працює над тим, щоб це зупинити, і багато хто тягнеться до цієї влади."
  bos_nf_mch_sisterhood_movement:0 "Дивне Сестринство"
  bos_nf_mch_sisterhood_movement_desc:0 "Ми отримали звіт, що Старійшину Патрокла усунула від влади група, відома як «Сестринство Сталі». Рада збереться, щоб обговорити нашу реакцію на таку дію."
  bos_nf_consult_midwest_elders:0 "Посередництво Середнього Заходу"
  bos_nf_consult_midwest_elders_desc:0 "Середній Захід не задоволений тим, що ми публічно підтримали тих, кого вони вважають зрадниками. Якщо зможемо, ми спробуємо зберегти зв'язки й з ними, але ми вже вирішили підтримати Сестринство Сталі."
  bos_nf_bonds_through_performance:0 "Зв'язки через результати"
  bos_nf_bonds_through_performance_desc:0 "До Лост-Гіллз доставили цікавий пакунок від цього дивного маленького Сестринства. Що б це могло бути...?"
  bos_nf_rethinking_conscription:0 "Переосмислення призову"
  bos_nf_rethinking_conscription_desc:0 "Наші контакти із Сестринством Сталі відновили дискусії навколо призову чужинців, як у позитивному, так і в негативному ключі. Ми не впевнені, що саме хочемо з цим робити, але дехто з нашого ордену... принаймні теплішає до цієї ідеї."
  bos_nf_a_chapter_of_heritage:0 "Капітул Спадщини"
  bos_nf_a_chapter_of_heritage_desc:0 "Ми дізналися більше про Сестринство. Вочевидь, вони дуже цінують своє коріння, особливо культурні вірування, від яких Середній Захід намагався їх відлучити. Ми можемо хоча б поважати їхню шану до традицій і розуміння власного минулого."
  bos_nf_reconcile_with_midwest_elders:0 "Об'єднання через ворожнечу"
  bos_nf_reconcile_with_midwest_elders_desc:0 "Ворог мого ворога — мій друг, як каже стара приказка, і Старійшини Середнього Заходу задоволені тим, що ми засудили Сестринство Зради."
  bos_nf_steel_against_sister_influence:0 "Сталь проти впливу Сестер"
  bos_nf_steel_against_sister_influence_desc:0 "Щоб запобігти поширенню крамольних думок на обох наших територіях, ми будемо співпрацювати, шпигуючи за ними та вишукуючи спроби проникнення й агітації."
  bos_nf_mch_mission_complete:0 "Виконання місії"
  bos_nf_mch_mission_complete_desc:0 "Старійшина Патрокл досяг своєї мети — віддати під суд Паладина Джоанну Пентікост. Тепер Капітул слідуватиме новим директивам у регіоні Монтани та за його межами."
  bos_nf_mch_end_of_the_sisters:0 "Остаточний кінець Сестер"
  bos_nf_mch_end_of_the_sisters_desc:0 "Хоча їхній вплив було рішуче зломлено, Сестер не було знищено повністю. Капітул Монтани присягнувся так чи інакше розчавити все, що від них залишилося."
  bos_nf_mch_silos_protected:0 "Захист ракетних шахт"
  bos_nf_mch_silos_protected_desc:0 "На Великій Півночі Капітул Монтани виявив залишки ядерного арсеналу, який призвів до спустошення світу. Ці об'єкти охоронятимуться, щоб ніхто більше не міг зловживати ними."
  bos_nf_soh_operation_cavalier:0 "Операція «Кавалер»"
  bos_nf_soh_operation_cavalier_desc:0 "Схоже, Старійшина Патрокл недостатньо ретельно викорінював залишки Сестер Сталі. Заповзятлива Паладин Юстинія Гейман взяла на себе сміливість завершити цю справу."
  bos_nf_mch_a_chapter_united:0 "Повернення до лав"
  bos_nf_mch_a_chapter_united_desc:0 "Старійшина Патрокл прийшов до тями і дав зелене світло місії Гейман. Капітул Монтани знову може стати однією щасливою родиною."
  bos_nf_mch_the_dakota_chapter:0 "Капітул Дакоти"
  bos_nf_mch_the_dakota_chapter_desc:0 "Паладин Гейман заявила про свою вірність справжньому Братству Сталі на противагу Старійшині Патроклу, який, на її думку, нехтує своїми обов'язками. Ми підтримаємо її."
  bos_nf_mch_folkvangr:0 "Фольквангр"
  bos_nf_mch_folkvangr_desc:0 "До вух Старійшин дійшли тривожні новини з Дакоти."

bos_nf_mch_western_enclave_tactical_experience: "Тактичний Досвід Проти Західного Анклаву"
bos_nf_mch_western_enclave_tactical_experience_desc: "Невеликій кількості вцілілих з Відділу Монтани вдалося дістатися до нас – разом із ними ми отримали додаткові знання щодо тактики боротьби з Анклавом."

bos_nf_mch_victory_over_mcarthur: "Перемога над Макартуром"
bos_nf_mch_victory_over_mcarthur_desc: "Макартур повалений! Ще один оплот Анклаву знищено. З часом ми повністю витіснимо їх із пустки!"

bos_nf_mch_conquest_of_the_steam: "Захоплення «Пари»"
bos_nf_mch_conquest_of_the_steam_desc: "Відділ Монтани встановив контроль над об'єктом, який вони називають «Пара» – нестабільним, але потужним реактором, розташованим глибоко в Айдахо."

bos_nf_mch_conquest_of_yellowstone: "Захоплення Єллоустоуну"
bos_nf_mch_conquest_of_yellowstone_desc: "У надрах Єллоустоуну Відділ Монтани виявив інформацію, що стосується компанії Greenway Hydroponics та Агентства з охорони довкілля. Корисні дані!"

bos_nf_integrating_chapters: "Інтеграція Осередків"
bos_nf_integrating_chapters_desc: "Час настав – Братство достатньо зміцніло, аби простягнути руку і взяти прямий контроль над розпорошеними осередками. Як кажуть на сході? Ах так. Ad Victoriam!"

  bos_nf_integrating_chapters_tt: "§YРозблоковує рішення§!, які дозволяють вам запрошувати Капітули з вашого реєстру до §YБратства Сталі§! та групи спільного дослідження §Y«Велика Рада Писарів»§!, за умови, що вони межують з учасником фракції.§!"
  lost_hills_research: "Велика Рада Писарів"
  lost_hills_research_desc: "Рада Писарів Лост-Гіллз розширилася, включивши до свого складу писарів з іноземних капітулів. Тепер дослідження координуються між капітулами, що полегшує нам копіювання розробок, здійснених іншими."

bos_nf_integrating_mxc: "Інтеграція Мексона"
bos_nf_integrating_mxc_desc: "Аванпости Відділу Мексона в Скелястих Горах з'єднають нас зі сходом. Ми шануємо доблесть [MXC.GetLeader], але їхнє вартування завершено."

bos_nf_integrating_bmw: "Інтеграція Серединного Відділу"
bos_nf_integrating_bmw_desc: "Серединне Братство протягом десятиліть було найуспішнішим. Проте настав час повернутися до джерела."

bos_nf_integrating_bgf: "Інтеграція Гольфу"
bos_nf_integrating_bgf_desc: "Сподіваємось, прямий нагляд утримає паладинів від відвідування парків розваг у вільний час."

bos_nf_integrating_bap: "Інтеграція Аппалачів"
bos_nf_integrating_bap_desc: "Вони вже надто довго блукають тими гірськими дорогами. Настав час повернути їх додому."

bos_nf_integrating_bls: "Інтеграція Сходу"
bos_nf_integrating_bls_desc: "Проєкт «Чистота» врятує безліч життів. Мешканці пустки будуть вдячні нам протягом століть."

bos_nf_integrating_moj: "Інтеграція Мохаве"
bos_nf_integrating_moj_desc: "Не хочеться це визнавати, але Елайджа справді довів свою ефективність у Мохаве."

bos_nf_integrating_shi: "Інтеграція Сан-Франциско"
bos_nf_integrating_shi_desc: "Ресурси Імператора вже в полі нашого зору. І з контролем над Сан-Франциско ми справді володарюємо над узбережжям Каліфорнії."

bos_nf_integrating_grd: "Інтеграція Невади"
bos_nf_integrating_grd_desc: "Можливо, вони зуміють нарешті зменшити гучність Шостого Каналу? Реклама засмічує наш ефір."

bos_nf_integrating_wbh: "Інтеграція Вашингтона"
bos_nf_integrating_wbh_desc: "Сподіваємось, вони поділяться з нами тією силовою бронею, яку носять. У T-51b під тим холодом не надто зручно пересуватись."

bos_nf_integrating_mch: "Інтеграція Монтани"
bos_nf_integrating_mch_desc: "Відділ Монтани контролює останні діючі шахти з ядерними ракетами в Америці. Тепер – і ми також."

bos_nf_integrating_ach: "Інтеграція Аламо"
bos_nf_integrating_ach_desc: "Ми не можемо забути Аламо – вони зберегли вірність Кодексу тоді, коли Техас звернув убік східних єресей. Вони охоче приєднаються до нас."

bos_nf_northern_california: "Північ Каліфорнії"
bos_nf_northern_california_desc: "Таємниці Наварро – лише частина того, що приховує північ. Настав час узяти з цього краю все, що нам потрібно."

bos_nf_baja_california: "Братство в Нижній Каліфорнії"
bos_nf_baja_california_desc: "Хоча Баха має небагато ресурсів, її рейдери можуть одного дня стати загрозою. Краще розчавити це зараз."

bos_nf_the_mojave: "Назад до Мохаве"
bos_nf_the_mojave_desc: "Таємниці Геліоса Один, дамби, самого Вегаса – ось чому ми відправили осередок у Мохаве. Їхня невдача – лише незначна затримка у нашій праведній меті."

bos_nf_oregon: "Загроза в Орегоні"
bos_nf_oregon_desc: "Орегон під гнітом дикої сили, яка загрожує спалити всю Каліфорнію. Ми не дозволимо цьому статися."

bos_nf_broken_coast: "На Північ Узбережжям"
bos_nf_broken_coast_desc: "Пірати Зламаного Узбережжя перекривають нам шлях до багатств Аляски. Ми маємо щось з цим зробити."

bos_nf_nevada: "Оберт Велике Коло"
bos_nf_nevada_desc: "Велике Коло завжди належало нам."

bos_nf_the_northwest: "Проломити Великий Щит"
bos_nf_the_northwest_desc: "Єллоустоун не вибухне лише тому, що ми пройдемося ним маршем... так?"

bos_nf_colorado: "Завоювання Колорадо"
bos_nf_colorado_desc: "Таємниці Купола Боулдера не повинні залишитися в руках дикунів. Ми маємо здобути його для себе."

bos_nf_arizona: "Анексія Арізони"
bos_nf_arizona_desc: "Попри посушливі простори, Арізона має дещо цінне. Можливо, у Блумфілді є щось варте уваги?"

bos_nf_greater_texas: "Пограймося з Техасом"
bos_nf_greater_texas_desc: "Г’юстон – лише одна з багатьох принад сходу."

bos_nf_oklahoma: "Все ОК в Оклахомі"
bos_nf_oklahoma_desc: "Тут відверто небагато цінного. Але ж не може весь штат складатися лише з кукурудзи? Можливо, Секвойя щось приховує."

bos_nf_mexico: "Мексиканське Потворство"
bos_nf_mexico_desc: "Останнє божество Старого Світу померло. І тепер ми нарешті можемо вирушити на пошуки його тіла."

bos_nf_the_midwest: "Завоювання Чикаго"
bos_nf_the_midwest_desc: "Час прийшов – ми маємо взяти Чикаго, що належить нам за правом, і покінчити з Анклавом остаточно!"

bos_nf_the_gulf_coast: "Захоплення Гольфського Узбережжя"
bos_nf_the_gulf_coast_desc: "У глибинах Еверглейдсу є ліки від мутації. Серединна експедиція зазнала поразки – але ми її не повторимо."

bos_nf_the_carribbean: "Консолідація Карибів"
bos_nf_the_carribbean_desc: "Якщо бути відвертими – ми захоплюємо ці території лише заради гарного курорту. Місце на шезлонгу можна зайняти рушником!"

bos_nf_appalachia: "Знищення Аппалачів"
bos_nf_appalachia_desc: "MODUS зайшов надто далеко! Він і його прибічники знищили перший Відділ Братства після оригінального, і тепер знущаються з нього як з пародії. Ми помстимося за загиблих братів."

bos_nf_the_east_coast: "Кінець Східного Узбережжя"
bos_nf_the_east_coast_desc: "Пентагон, Нью-Йорк, Інститут – усе це належить Братству. Саме ці люди, зрештою, зруйнували світ."

bos_nf_purpose_fulfilled: "Ad Victoriam"
bos_nf_purpose_fulfilled_desc: "Мексон мав мрію. Мрію про те, що Братство, пройшовши крізь випробування, стане будівничим завтрашнього світу, захищаючи спадщину минулого. Якби він побачив нас сьогодні, то був би гордий за те, чого ми досягли.\nAd Victoriam! За Братство!"

bos_nf_lancers: "Східні Лансери"
  bos_nf_lancers_desc: "Експедиція Лайонса додала звання Лансера на рівні з Писарем та Лицарем. Якщо ми серйозно ставимося до небес, впровадження цієї моделі піде нам лише на користь."
  bos_nf_hot_deployment: "Допомога Капітулу: Гарячі висадки"
  bos_nf_hot_deployment_desc: "На Сході використовують відкриті вертиберди, що летять на низькій висоті, щоб розчищати зони висадки для своїх військ. Важке озброєння, яке обслуговують десантники, може прорвати більшість ліній опору, а додаткові війська навчені надавати корисну вогневу підтримку навіть з таких великих відстаней. \n У результаті всього цього значно підвищується ефективність наших сил під час висадок з опором, з меншими втратами життів і спорядження. Багато хто в Братстві підтримує це як альтернативу великим витратам на дирижаблі, і навіть прихильники літаючих фортець розуміють, що набагато цінніше змусити укріплену позицію здатися, ніж знищити її."
  bos_bsf_exists: "§Y[BSF.getName]§! існує"
  bos_grd_is_in_ledger: "§W §YВартові§! є в реєстрі§!"
  air_xp_more_than_25:0 "£air_experience  §Y25§!"
  air_xp_more_than_25_blocked:0 "£air_experience  §R25§!"
  air_xp_more_than_25_tooltip:0 "Прийняття цього рішення коштує £air_experience  §Y25§!"
  naval_xp_more_than_50:0 "£navy_experience  §Y50§!"
  naval_xp_more_than_50_blocked:0 "£navy_experience  §R50§!"
  naval_xp_more_than_50_tooltip:0 "Прийняття цього рішення коштує £navy_experience  §Y50§!"
  bos_nf_shi_chapter_cooperation: "Вертиберди в сутінках"
  bos_nf_shi_chapter_cooperation_desc: "Оскільки капітул Сан-Франциско фактично контролює місто від імені Імператора, їх нагородили бажаними довоєнними VB-02. Як вимагає Кодекс, вони передали їх нам і зараз працюють над підготовкою креслень для наших мануфактур. Ми відправили наших найобізнаніших писарів на допомогу."
  bos_nf_dominating_san_francisco: "Помста за полеглих"
  bos_nf_dominating_san_francisco_desc: "Дослідницький пост лежить у руїнах, перетворений на димлячі уламки нашими ворогами в Сан-Франциско. Лицарі та Паладини вимагають виправити цю несправедливість і повернути наших братів додому. Навіть Рада єдина: «Ми вбили Ведмедя, зможемо вбити й Дракона»."
  bos_nf_integrating_tbh: "Інтеграція Техасу"
  bos_nf_integrating_tbh_desc: "Техаське Братство було зраджено. Вони знову засвоїли урок, який отримали наші старійшини — ще немає нікого, гідного успадкувати майбутнє, яке ми оберігаємо. Мрія Роджера Максона далека, і такими ж далекими маємо бути й ми від дітей Пустки."
  bos_nf_integrating_shi_desc: "Ресурси Імператора виблискують перед нашими очима. А з Сан-Франциско ми справді керуємо узбережжям Каліфорнії."
  nf_brotherhood_expeditions_10_chance: "Ми маємо §Y 10% §!шанс на успіх."
  nf_brotherhood_expeditions_20_chance: "Ми маємо §Y 20% §!шанс на успіх."
  nf_brotherhood_expeditions_30_chance: "Ми маємо §Y 30% §!шанс на успіх."
  nf_brotherhood_expeditions_40_chance: "Ми маємо §Y 40% §!шанс на успіх."
  nf_brotherhood_expeditions_50_chance: "Ми маємо §Y 50% §!шанс на успіх."
  nf_brotherhood_expeditions_60_chance: "Ми маємо §Y 60% §!шанс на успіх."
  nf_brotherhood_expeditions_70_chance: "Ми маємо §Y 70% §!шанс на успіх."
  nf_brotherhood_expeditions_80_chance: "Ми маємо §Y 80% §!шанс на успіх."
  nf_brotherhood_expeditions_90_chance: "Ми маємо §Y 90% §!шанс на успіх."
