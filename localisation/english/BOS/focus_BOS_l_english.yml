srg_california_peace_accords: "Каліфорнійські Мирні Угоди"
srg_california_peace_accords_desc: "Ратифіковано!\nЗасвідчено!\nДля Ллуїда це – найвища мета, на яку він тільки міг сподіватись: шанс закарбувати своє ім’я в історії як одного з найвеличніших старійшин Лост-Гіллз – того, хто втілив мрію Мексона про справжнє суспільство, здатне пережити бурі наступного тисячоліття."
srg_ncr_puppet_introduce_law: "Наша частина угоди"
srg_ncr_puppet_introduce_law_desc: "Як частина нашої угоди, ми повинні поставити закони НКР вище за Кодекс. Хоча для Максона це статус-кво, існують десятки тисяч Лицарів, Писарів та Учнів, яких потрібно навчити протоколам з куди меншим потенціалом для жорстокості, ніж те, що робили деякі солдати в ім'я Кодексу."
srg_seek_amnesty: "Домогтися Амністії"
srg_seek_amnesty_desc: "Чимало вояків під час війни з НКР воювали задля захисту Кодексу. Проте НКР наполягає на притягненні деяких із них до Трибуналу за військові злочини. Можливо, ми зможемо переконати Республіку відмовитися від покарання?"

  srg_tribunal_for_war_crimes: "Трибунал за Військові Злочини"
  srg_tribunal_for_war_crimes_desc: "Зачекайте... ТІ ПАЛАДИНИ ЗРОБИЛИ ЩО!?\nЯкби Ллуйд не діяв за законами НКР, він би стратив цих солдатів на місці за те, що вони розірвали Ланцюг, Який Єднає. Найкраще буде відправити їх до Шейді-Сендс, щоб вони постали перед судом."
  srg_california_tech_sharing_initiative2: "Передача наших знань"
  srg_california_tech_sharing_initiative2_desc: "Тепер, коли ми працюємо пліч-о-пліч з НКР, ми розпочали довгий процес поступового повернення технологій, доктрин та інших оперативних знань, які ми зберігали всі ці роки. Звісно, ми все ще діємо відповідно до Кодексу — навіть якщо він підпорядкований законам НКР. Процес буде повільним, стабільним і правильним. Ми не можемо нести відповідальність за нову Велику війну."
  nf_brotherhood_steel_rangers.7.d: "Старійшина Ллуйд сьогодні представив план Реформаторів у Шейді-Сендс, детально описавши, як протягом наступних кількох десятиліть передові технології Братства Сталі будуть вилучені з бункера Лост-Гіллз і викладатимуться в майбутньому Державному Університеті Максона, побудованому на його території. \n\nOSI розмістить своїх представників в університеті, щоб сприяти впровадженню технологій по всій Каліфорнії. Мине кілька поколінь, перш ніж плоди цієї праці справді принесуть результати, принаймні за межами діяльності Братства в Максоні."
  nf_brotherhood_steel_rangers.7.1: "У нас багато роботи."
  ##add-on to pre-existing event from the above focus.
  ##note that this loc sporadically works, which means there is loc key collisions somewhere. If text doesn't match. just add 2 to the text = definition in the focus tree file and add the 2 here as well.

srg_california_tech_sharing_initiative: "Програма Технологічного Обміну з Каліфорнією"
srg_california_tech_sharing_initiative_desc: "Тепер, коли ми діємо разом із НКР, ми погодилися поступово передавати їм технології, які зберігалися в Лост-Гіллз. Звісно, все відбуватиметься згідно з положеннями Кодексу – хай і в межах правового поля НКР. Процес буде повільним, стабільним і ретельно контрольованим. Ми не маємо права допустити помилок, які знову приведуть світ до загибелі."

srg_maxson_city: "Місто Мексона"
srg_maxson_city_desc: "Назване на честь легендарного засновника Братства Сталі, Мексон об’єднує родини, що поколіннями були пов’язані з Братством. Коли місто було передано під спільну юрисдикцію Сталевих Рейнджерів, це нагадало велике родинне зібрання."

  srg_paladin_pizza_parlors:0 "Піцерії "Паладин""
  srg_paladin_pizza_parlors_desc:0 "Новий спільний уряд Мексона призвів до того, що чимало місцевих крамниць змінили брендинг, аби відзначити цю подію: «Бутики Братства», «Піцерії Паладин» та «Дитсадки Лицарів». Це кіч, але він приносить гарний прибуток!"
  srg_ncr_war_reparations2:0 "Репарації постраждалим"
  srg_ncr_war_reparations2_desc:0 "Не кожна родина в Максоні ставиться до Братства з прихильністю. Водночас багато людей у Мексоні пов'язані з тими ветеранами, які постраждали у війнах із Братством. Ми ставитимемося до них як до власних ветеранів, що включає виплату заборгованостей грошового забезпечення, допомогу у зв'язку із загибеллю та автоматичне отримання їхніми дітьми статусу Учня під керівництвом Писаря чи Лицаря."
  srg_retirement_for_military_veterans2:0 "Масовий вихід у відставку"
  srg_retirement_for_military_veterans2_desc:0 "Подібно до того, як спартанські воїни давнини втрачали свою дисципліну під час подорожей до Афін, багато солдатів Братства, дізнавшись про припинення нашої ворожнечі з НКР, просто вирішили закинути чимало своїх обов'язків. Ці солдати дійсно заслуговують на відставку, адже вони несли службу понад норму, захищаючи нас від Ведмедя. Кодекс швидко відходить на задній план у їхньому житті."
  srg_widespread_retirement:0 "Масовий вихід у відставку"
  srg_widespread_retirement_desc:0 "Подібно до того, як спартанські воїни давнини втрачали свою дисципліну під час подорожей до Афін, багато солдатів Братства, дізнавшись про припинення нашої ворожнечі з НКР, просто вирішили закинути чимало своїх обов'язків. Ці солдати дійсно заслуговують на відставку, адже вони несли службу понад норму, захищаючи нас від Ведмедя. Кодекс швидко відходить на задній план у їхньому житті."
  
srg_ncr_war_reparations: "Репарації Постраждалим"
srg_ncr_war_reparations_desc: "Не кожна родина в Мексоні дивиться на Братство з теплотою. Багато з них – це рідні тих, хто постраждав у війнах із нами. Ми повинні дати їм те, на що вони заслуговують."

srg_retirement_for_military_veterans: "Масове Відставлення"
srg_retirement_for_military_veterans_desc: "Як і стародавні спартанці, що втрачали військову гідність у мирному Афіні, багато братських солдатів, побачивши, як зникає завіса між НКР і Братством, просто відмовилися від своїх обов'язків. Кодекс поступово відходить на другий план у їхньому житті. Вони заслужили відпочинок."

srg_new_military_stratagem: "Нова Військова Доктрина"
srg_new_military_stratagem_desc: "Боротися пліч-о-пліч з НРК, а не проти неї, стане для нашої нової спільної влади величезним випробуванням. Проте Ллуїд упевнений, що зрештою це принесе позитивні результати."
srg_armed_patrols2: "Озброєні патрулі"
srg_armed_patrols2_desc: "У Мексоні вже багато років не було такого спокою, адже «Паладини» просуваються вздовж каліфорнійського узбережжя. Вони навіть вистежують грабіжників і нелегальних мешканців племен, які живуть на урядових землях!"

srg_armed_patrols: "Озброєні Патрулі"
srg_armed_patrols_desc: "Мексон не був таким безпечним роками. Паладини патрулюють узбережжя Каліфорнії, полюючи на рейдерів і незаконні племена, що оселились на державній землі."

srg_peace_under_the_republic: "Мир під Республікою"
srg_peace_under_the_republic_desc: "Хіба не приємно жити без постійної загрози над головою?"

srg_commemorate_roger_maxson_statue: "Роджер Мексон – Герой"
srg_commemorate_roger_maxson_statue_desc: "Згодом ідея Ллвіда щодо спільного управління принесе свої плоди. Братство відкриває для себе сильні сторони уряду НКР, а НКР визнає мудрість і спадщину Роджера Мексона. Ллвід, безсумнівно, увійде в історію як людина, яка змогла це все організувати!"

srg_dismantle_bunker_destruction_device: "Деактивація Пристрою Самознищення Бункера"
srg_dismantle_bunker_destruction_device_desc: "Що ж, це нам більше не знадобиться! Краще позбутися його, перш ніж комусь спаде на думку стати мучеником за стару адміністрацію."
  srg_nuclear_weapons_studies2: "Дослідження ядерної зброї"
  srg_nuclear_weapons_studies2_desc: "Важливо, щоб і ми, і НКР розуміли вагу та значення зброї, яка знищила світ. Ми сподіваємося, що в нас більше ніколи не буде приводу для її застосування, але якщо Президент і наш Верховний Старійшина коли-небудь дійдуть згоди щодо її необхідності, останнє слово у стримуванні залишається за НКР."
  srg_dismantle_lost_hills_bunker2: "Демонтувати бункер Лост-Гіллз"
  srg_dismantle_lost_hills_bunker2_desc: "Ми повинні розпочати процес закріплення цього переходу. Якщо ми хочемо досягти цього, ми маємо переконатися, що повернення до нашого колишнього способу життя неможливе. На це підуть десятиліття, але процес демонтажу Лост-Гіллз має розпочатися вже сьогодні, якщо ми хочемо уникнути помилок завтра."
  srg_ncr_puppet_creating_defense_militia: "Сталеве ополчення"
  srg_ncr_puppet_creating_defense_militia_desc: "Ми не відмовляємося від удосконалень, які наша спадщина привнесла в армію США. Сталеве ополчення — ополчення лише за назвою — складатиметься з повністю навчених чоловіків і жінок, які працюють у крамницях, на фермах і фабриках. Їм знадобиться лише короткочасне додаткове навчання, перш ніж вони зможуть служити Лицарями у Сталевих Рейнджерах."
  srg_ncr_puppet_introducing_trade: "Вільна ринкова економіка"
  srg_ncr_puppet_introducing_trade_desc: "Одним із найбільших потрясінь для нашої нової спільної адміністрації є адаптація до економічної моделі НКР. Замість авторитарних інтендантів ми залишилися з хаосом мирного часу. Попри це, чиста продуктивність цього хаосу виявляється вищою за нашу модель. Маючи на руках більше доларів НКР та отримуючи більше ресурсів, ті самі інтенданти тепер непомітно згладжують прогалини у виробництві, закуповуючи товари в наших братніх штатів."
  srg_ncr_puppet_light_of_civilisation: "Державний університет Максона"
  srg_ncr_puppet_light_of_civilisation_desc: "Державний університет Максона нарешті відчиняє свої двері. Ми йшли до цього дуже довго, і майбутні студенти поступово стікалися до наших міст, чекаючи на цю мить."
  nf_brotherhood_steel_rangers.9.d: "Колись Каліфорнія була домом для багатьох відомих університетів, які поширювали знання найвищої якості та цінності в Сак-Сіті, Могильнику та Сан-Франциско. Тепер ми засновуємо новий заклад — Державний університет Максона, — перетворюючи кістяк нашого бункера на розлогий університетський кампус, як на поверхні, так і під землею.\nБагато рівнів усе ще залишатимуться покинутими, а інші будуть запечатані, поки не настане час для повторного впровадження певних технологій.\nПротягом століття ДУМ стане серцем і душею Сталевих Рейнджерів. Звідси вийдуть наші майбутні писарі, набрані з-поміж випускників. Наші цінності житимуть і розвиватимуться тут, стаючи предметом палких дискусій кожного семестру. Ми більше ніколи не дозволимо розквітнути тому паралічу, що почав проникати в кістки нашого Братства."
  nf_brotherhood_steel_rangers.9.a: "Ми саджаємо насіння для тіні, в якій ніколи не сидітимемо."
  srg_ncr_puppet_new_industry: "Повторне впровадження промислових технологій"
  srg_ncr_puppet_new_industry_desc: "Деякі технології лише полегшать впровадження інших, не розпалюючи полум'я конфлікту. Сьогодні Максон розпочинає процес перетворення на зразковий штат, де всі технології спочатку тестуватимуться, вивчатимуться і тестуватимуться знову. Люди з усієї НКР переїжджатимуть сюди лише для того, щоб привезти назад знання про те, як і чому використовувати ці нові досягнення. Сьогодні це 3D-принтери та роботи-працівники, завтра — композити та реплікатори."
  srg_ncr_puppet_embracing_the_future: "Цифровізація Максона"
  srg_ncr_puppet_embracing_the_future_desc: "Разом із промисловими технологіями ми можемо безпечно розгорнути передові сантиметрові радари, а також найсучасніші канали передачі даних. Тоді як останні включають шоломи, що дозволяють солдатам швидко оцінювати ситуацію та координувати дії на полі бою, вони також дозволяють сканувати будівлі, щоб інженер міг бачити «крізь» них, або забезпечувати довоєнні швидкості зв'язку по всій НКР — якщо зробити правильні інвестиції."
  srg_the_new_scribes: "Новий Писар"
  srg_the_new_scribes_desc: "Роль Писаря в нашій історії змінювалася неодноразово. Колись їх вважали нижчими за рангом. Згодом, коли ми зрозуміли, як багато ми маємо зберегти, вони стали рівними Лицарям. Тепер їх прославлятимуть так само як Паладинів. Писар стане вчителем, навченим передавати як знання, так і етику їх використання в запланованому Державному університеті Максона."
  srg_the_scribe: "Новий Писар"
  srg_the_scribe_desc: "Писар стане вчителем, навченим передавати як знання, так і етику їх використання."
  srg_the_field_scribes: "Польовий Писар"
  srg_the_field_scribes_desc: "Тепер, коли план із піднесення Людства втілюється в життя, кількість польових писарів має значно зрости. Вони більше не солдати, придатні для складного ремонту, а мандрівні просвітителі, які відвідують людей по всьому Максону — а згодом і за його межами, — щоб ознайомлювати та навчати місцевих жителів стандартам, яких більше ніде немає на Пустці. Польовий писар — це наш новий Лицар, який тепер б'ється за довгострокове виживання Людства, як колись це робили для нас наші Лицарі."
  nf_brotherhood_steel_rangers.8.t: "Ферми та Барони"
  nf_brotherhood_steel_rangers.8.d: "Пустка — не дуже багате місце. Нова Каліфорнійська Республіка доклала значних зусиль протягом понад 40 років, щоб це змінити, і землі Максона також отримали з цього вигоду, бувши сповненими орних угідь. Проте вони далеко не повністю продуктивні, і ми вважаємо, що могли б збільшити виробництво на фермах Максона у вісім разів за десятиліття, спершу залучивши до цієї мети новостворених Польових Писарів. \n\nНа жаль, у НКР завжди домінували Барони, і наше впровадження передових сільськогосподарських методів і технологій у Максоні зробить нас новою аграрною державою менш ніж за одне покоління. Ми маємо вирішити, як використовувати цей вплив — і ми повинні вирішити це зараз."
  nf_brotherhood_steel_rangers.8.1: "Ми повинні зламати їх."
  nf_brotherhood_steel_rangers.8.2: "Задобрити баронів."
  srg_seeds_of_tomorrow: "Насіння завтрашнього дня"
  srg_seeds_of_tomorrow_desc: "Тепер, коли план із піднесення Людства втілюється в життя, кількість польових писарів має значно зрости. Вони більше не солдати, придатні для складного ремонту, а мандрівні просвітителі, які відвідують людей по всьому Максону — а згодом і за його межами, — щоб ознайомлювати та навчати місцевих жителів стандартам, яких більше ніде немає на Пустці. Польовий писар — це наш новий Лицар, який тепер б'ється за довгострокове виживання Людства, як колись це робили для нас наші Лицарі."
  srg_appease_the_barons: "Задобрювання Баронів"
  srg_appease_the_barons_desc: "Ми вирішили застосувати повільний і впевнений підхід до поширення сільськогосподарських ноу-хау. Хоча це означає, що Барони часто підтримуватимуть наші справи, мине щонайменше ще одне покоління, перш ніж НКР помітить надлишок калорій."

  srg_the_field_scribes_corps: "Набір Польових Писарів"
  srg_the_field_scribes_corps_desc: "Щоб реалізувати наші амбіції з трансформації Максона, нам потрібно задовольнити нові вимоги Польових Писарів щодо кадрів, і нам потрібні найкращі. Кожен, хто буде залучений до цієї справи, більше ніколи не матиме права служити в наших збройних силах."
  srg_making_the_most: "Крізь Пустки"
  srg_making_the_most_desc: "Щойно завершиться перший семестр у ДУМ, ми зможемо почати заповнювати тисячі посад Польових Писарів у Максоні. Вони працюватимуть над відновленням доріг і транспортних засобів, а також готуватимуть нові поселення до напливу поселенців."
  srg_settling_the_lucia_range: "Заселення хребта Лучія"
  srg_settling_the_lucia_range_desc: "Прибуває група поселенців для хребта Лучія, повна кваліфікованих робітників, готових розширити придатний для життя простір у безплідних землях і прокласти шлях для компактних виробництв та інфраструктури. Разом із поселенцями хребта Діабло ми вперше матимемо гарне наземне сполучення з Сан-Франциско."
  srg_settling_the_diablo_range: "Заселення хребта Діабло"
  srg_settling_the_diablo_range_desc: "Заселення хребта Діабло — завдання не з легких. Гірська місцевість і ворожі створіння вимагають витриваліших поселенців, ніж на більшості територій Максона. Дуже допомагає те, що серед поселенців є вихідці з Сан-Франциско, і видовище того, як гігантського жука розрубують навпіл ударом ногою з розмаху — це щось неймовірне!"
  srg_settling_the_badlands: "Більше жодних безплідних земель"
  srg_settling_the_badlands_desc: "Польові Писарі невтомно працювали, щоб перетворити безплідні землі на придатну для життя територію, і значна частина нашого державного бюджету пішла на ці зусилля.\n\nРезультати того варті."
  srg_growing_central_valley_outskirts: "Зростання околиць Центральної Долини"
  srg_growing_central_valley_outskirts_desc: "Подобається нам це чи ні, але публічна кампанія НКР виявилася дуже ефективною, і багато хто потягнувся до прилеглих до Центральної Долини штатів заради блага своїх дітей. Усім їм потрібно вказати шлях до існуючих поселень або ключових районів, перш ніж ми отримаємо некеровану діаспору. Робота Польових Писарів ніколи не закінчується!"
  srg_growing_maxson_city_outskirts: "Зростання передмість Максон-Сіті"
  srg_growing_maxson_city_outskirts_desc: "Максон-Сіті, що не дивно, дуже густонаселений. Деякі мігранти з НКР прибули сюди лише на обіцянку відродження Старого Світу і шоковані замкнутою культурою Максон-Сіті. Вони знайшли прихисток у передмістях, і більшість із них — фабричні робітники, які з радістю скористалися б можливістю виготовляти оптоволоконні кабелі, комп'ютери та інші речі, які рідко випускаються новими."
  srg_growing_the_settlements: "Нові можливості"
  srg_growing_the_settlements_desc: "У провінціях, що межують із Центральною Долиною та Некрополем, оселилися нові родини, які переїхали сюди, щоб дати можливість своїм дітям. Хоча для них ще недостатньо роботи, якщо ми хочемо залучити зацікавлені компанії, нам знадобиться сильніша військова присутність."
  srg_growing_our_new_settlements: "Компактна промисловість"
  srg_growing_our_new_settlements_desc: "Наші нові поселення на хребтах Лучія та Діабло завжди будуть обмежені в розмірах, але є галузі, варті своїх квадратних метрів. Якщо НКР коли-небудь приєднає Сан-Франциско, одні лише торговельні зв'язки виправдають наші інвестиції."
  srg_growing_our_new_settlements_2: "Університетські містечка"
  srg_growing_our_new_settlements_2_desc: "Сім'ї, які оселилися навколо Центральної Долини, природно, почали відкривати нові підприємства або приєднуватися до нових філій традиційних компаній НКР. Найважчим для нас було змусити їх впроваджувати наші промислові технології!"
  srg_growing_ranger_arms_production: "Сталь для Сталевих Рейнджерів"
  srg_growing_ranger_arms_production_desc: "Після багатьох років роботи ми нарешті створили виробничі ланцюги, здатні підтримувати масове виробництво військового спорядження для наших збройних сил. Тепер найбільш освічені та кваліфіковані фахівці зібралися навколо наших промислових центрів, оскільки ми відкриваємо збройові мануфактури за межами Центральної Долини."
  srg_new_military_doctrine: "Реформування нашої доктрини"
  srg_new_military_doctrine_desc: "Доктрина Братства майже зникла зі Сталевих Рейнджерів через масовість наших сил нині порівняно з кількістю наших Лицарів. Якщо ми хочемо відповідати слову «Сталеві» у назві Сталевих Рейнджерів, нам доведеться багато чого перенавчати."
  srg_special_ops: "Фокус на спецопераціях"
  srg_special_ops_desc: "Ми завжди використовували спорядження спеціального призначення на додаток до силової броні, але, можливо, настав час адаптуватися до доктрини НКР, надавши цим технологіям першочергового значення."
  srg_power_armour: "Фокус на силовій броні"
  srg_power_armour_desc: "Ми — Сталеві Рейнджери, і це означає прагнення досягти висот довоєнної силової броні. НКР стане сильнішою, якщо в Максоні переважатиме доктрина Братства."
  srg_knight_subunits: "Інтегрувати Лицарів"
  srg_knight_subunits_desc: "Модель Братства збережеться як частина Спільної Адміністрації. Наші Лицарі більше не служитимуть як самостійні підрозділи, а натомість стануть додатковою підтримкою в силовій броні для багатьох дивізій Сталевих Рейнджерів, у поєднанні з ідеєю НКР про підтримку силовою бронею. Ми наберемо найкращих як Лицарів-Учнів."
  srg_paladin_patrols: "Патрулі Паладинів"
  srg_paladin_patrols_desc: "Наших Паладинів занадто мало, щоб бути серйозною бойовою силою для Сталевих Рейнджерів. Однак вони принесуть велику втіху жителям Каліфорнії, коли ті бачитимуть їх у патрулях, що без втрат вирішують суперечки або винищують потвор пустки."
  srg_paladin_patrols_idea: "Паладини-Рейнджери"
  srg_were_ready: "Ми готові"
  srg_were_ready_desc: "Хоча минуть ще десятиліття, перш ніж Максон звикне до своєї нової подвійної ролі вчителя та захисника, Сталеві Рейнджери були реорганізовані в гідну бойову силу. Коли ми розгорнемо свої війська, ми станемо сталевою стіною, об яку розіб'ються Легіон, Воррен або будь-хто інший."
  srg_recruitment_drive: "Елітне навчання"
  srg_recruitment_drive_desc: "Наш величезний резерв кандидатів поховав у собі таланти, які краще використати в наших спецпідрозділах. Якщо ми сповільнимо процес, ми зможемо значно збільшити чисельність Сталевих Рейнджерів."
  srg_new_special_forces: "Посилені процедури перевірки"
  srg_every_man_is_precious: "Кожне життя безцінне"
  srg_every_man_is_precious_desc: "Якщо ми чогось і навчилися з нашої історії, то це того, що кожне життя безцінне. Одна добре навчена і добре екіпірована людина варта п'ятьох погано навчених. Це вдвічі важливіше, коли нам потрібно комплектувати штати мануфактур."
  srg_superior_enforcers: "Передова броня"
  srg_quantity_is_its_own_quality: "Кількість понад якість"
  srg_quantity_is_its_own_quality_desc: "Доктрина НКР вимагає великої та розгалуженої армії. З їхньою промисловою базою для нас немає сенсу зосереджуватися на невеликих елітних підрозділах. Заповнімо небеса, переповнімо моря та перекриймо дороги нашими силами."
  srg_a_big_army: "Доктрина великої армії"
  srg_preparing_against_our_foes: "Підготовка проти наших ворогів"
  srg_preparing_against_our_foes_desc: "Ми маємо прийняти нові плани та стратагеми, щоб захиститися від головних загроз на Пустці. Другого шансу відбудувати суспільство не буде."
  srg_preparing_against_csr: "Аналіз Мохавського театру"
  srg_preparing_against_csr_desc: "Мохаве завжди відіграватиме важливу роль у захисті НКР. Племена зі сходу не можуть втриматися від спроб завоювати його, і ми маємо переконатися, що Мохаве завжди повертатиметься до Республіки."
  srg_preparing_against_csr_2: "Експлуатація їхніх розбіжностей"
  srg_preparing_against_csr_2_desc: "Тепер, коли спалахнув конфлікт, очевидно, що наш ворог роздроблений і племінний. Ми можемо отримати велику перевагу, завдаючи логістичних ударів по конкретних племенах — їхня внутрішня ворожнеча зробить усе інше."
  srg_preparing_against_bos: "Перемогти своїх же"
  srg_preparing_against_bos_desc: "Ми намагалися переконати інші Капітули приєднатися до нас, але деяких доведеться ввести до складу Рейнджерів силою. Нам краще ретельно підготуватися до такого конфлікту."

  bos_underground_construction_decisions:0 "Підземне Управління Лост-Гіллз"
  bos_underground_construction_decisions_desc:0 "Максимально доступний простір: [?BOS_space_usage]/[?BOS_space]\nДоступні слоти будівництва: [?BOS_underground_construction_slots] \nАдміністративний ресурс: [?modifier@bos_administration_capacity_usage]/[?modifier@BOS_underground_administrative_capacity]\nДослідження вдосконаленого підземного будівництва: [?BOS.BOS_underground_construction_speed_up]%\nПідземна ущільнена майстерня: [?BOS_condensed_civilian_workshop]/[?BOS_maximum_condensed_workshops_allowed]\nПідземні адміністративні центри: [?BOS_underground_building_administration_centers]/[?BOS_maximum_admin_centers_allowed]\nПідземні відділи безпеки: [?BOS_underground_building_safety_department]/[?BOS_maximum_safety_departments_allowed]\nПідземні лабораторії: [?BOS_underground_building_lab]/[?BOS_maximum_labs_allowed] \nПідземні тренувальні комплекси: [?BOS_underground_building_training]/[?BOS_maximum_training_facilities_allowed]\nПідземні експедиційні відділи: [?BOS.BOS_expeditionary_departments]/[?BOS.BOS_maximum_expeditionary_departments_allowed]"

