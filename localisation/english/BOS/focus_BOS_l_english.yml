l_english:
  bos_nf_scavenging_program: "Розгорнути програми збору ресурсів"
  bos_nf_scavenging_program_desc: "Останнім часом наші зусилля зі збору технологій та ресурсів дають відчутні результати. Настав час формалізувати ці ініціативи у чітко структуровану програму під керівництвом паладинів."

  bos_nf_one_fateful_bullet: "Одна фатальна куля"
  bos_nf_one_fateful_bullet_desc: "Одне рішення — і Пустка змінилася назавжди.\nПостало Братство. Братство Сталі."

  bos_nf_exodus: "Вихід"
  bos_nf_exodus_desc: "Залишити позаду минуле — й вирізьбити нове майбутнє."

  bos_nf_words_have_power: "Слова мають силу"
  bos_nf_words_have_power_desc: "Вони формують ідентичність. З часом — набувають змісту, навіть якщо спершу його не було. Саме лицарі й писарі після падіння Риму зберегли залишки цивілізації Заходу. Ми — нові лицарі, і наша місія подібна. — Роджер Мексон"

  bos_nf_chains_that_bind: "Ланцюг, що єднає"
  bos_nf_chains_that_bind_desc: "Ланцюг, що єднає — це фундамент нашої організації, камінь, на якому тримається велике дерево Братства."

  bos_nf_the_knight_and_the_bear: "Лицар і Ведмідь"
  bos_nf_the_knight_and_the_bear_desc: "Історії про те, як Давид перемагає Голіафа, давні, як і сама цивілізація. Але іноді доля пише сюжет інакше, ніж казка."

  bos_nf_the_knights: "Лицарі"
  bos_nf_the_knights_desc: "Лицарі — втілення обов’язку й відданості. Саме вони надають паладинам бойову підтримку, що дозволяє вести бій у славу Мексона та Кодексу."

  bos_nf_engineers_of_peace: "Інженери миру"
  bos_nf_engineers_of_peace_desc: "З часом робота Братства приведе людство до епохи миру й процвітання. До людства, що здобуло уроки з власних страждань і здолало темряву минулого."

  bos_nf_engineers_of_war: "Інженери війни"
  bos_nf_engineers_of_war_desc: "Поки не настане день, коли Братство зможе скласти зброю, солдати Лост-Гілз повинні бути готовими до всього. Пустка кишить ворогами, які прагнуть нашого знання з жадібністю в очах."

  bos_nf_room_to_grow: "Простір для зростання"
  bos_nf_room_to_grow_desc: "Без підтримки інших бункерів Лост-Гілз складно буде утримуватись на самоті. Якщо ми прагнемо реалізувати припис Кодексу — нам потрібен простір для розширення."

  bos_nf_the_paladins: "Паладини"
  bos_nf_the_paladins_desc: "Завдяки мужності паладинів ми досі стоїмо. Найвірніші та найсильніші воїни. Сталеві люди, покликані втілювати бачення Мексона та захищати майбутнє від будь-якої загрози. На полі бою паладини — це ходячі танки, здатні подолати будь-яку перепону."

  bos_nf_forge_new_paladins: "Викувати нових паладинів"
  bos_nf_forge_new_paladins_desc: "Деякі лицарі проявили приклад гідності й честі у боях проти НКР. Визнаймо їхню відданість, надавши їм право пройти підготовку та стати паладинами Братства."

  bos_nf_lifting_the_expeditionary_ban: "Скасування заборони на експедиції"
  bos_nf_lifting_the_expeditionary_ban_desc: "Під час найзапекліших боїв у війні з НКР було введено тимчасову заборону на направлення паладинів до віддалених осередків. Тепер, коли досягнуто припинення вогню, більшість старійшин погоджуються: заборону слід зняти."

  bos_nf_the_scribes: "Писарі"
  bos_nf_the_scribes_desc: "Писарі — особлива підтримка наших бойових підрозділів. Вони забезпечують паладинів усім необхідним для ефективної участі в бойових діях."

  bos_nf_bringers_of_progress: "Носії прогресу"
  bos_nf_bringers_of_progress_desc: "Мексон вірив, що настане день, коли саме ми — Братство Сталі — передамо обраним з-поміж людства наші технології та досягнення. Ми зберігаємо спадок не для себе, а для того, щоб, коли Америка буде готова, вручити їй ключі до цивілізації."

  bos_nf_keepers_of_knowledge: "Хранителі знань"
  bos_nf_keepers_of_knowledge_desc: "Протягом двох століть Лост-Гілз перетворився на один із найбільших центрів збереження знань у світі. Тут зосереджено обсяги до-воєнної науки, які викликають заздрість навіть у НКР."

  bos_nf_new_developments: "Нові розробки"
  bos_nf_new_developments_desc: "Дехто вважає розробку нових технологій небезпечною доріжкою, що веде до помилок минулого. Але вдосконалення методів обслуговування й калібрування обладнання — річ необхідна. Ми не можемо дозволити, щоб воно виходило з ладу."

  bos_nf_memories_of_the_fallen: "Пам’ять полеглих"
  bos_nf_memories_of_the_fallen_desc: "Якщо ми не будемо готові до бою — ті, хто недостойний наших технологій, спробують їх у нас відібрати. Ми маємо бути готовими до боротьби. І віддавати шану тим, хто поклав життя за ідеали Мексона."

  bos_nf_memories_of_heroes: "Пам’ять героїв"
  bos_nf_memories_of_heroes_desc: "З розширенням впливу Братства зростає й кількість тих, хто готовий жити й вмирати за справу Мексона. Вшануймо тих, хто стоїть на сторожі Кодексу, пам’яті Мексона й нашої бездоганної спадщини."

  bos_nf_empty_suits: "Порожні обладунки"
  bos_nf_empty_suits_desc: "Після тимчасового затишшя у війні з НКР чимало комплектів силової броні залишились без власників — їхні носії загинули на полі бою. Ми маємо повернути ці реліквії до строю — щоб у них знову ожили нові герої."

  bos_nf_filled_with_purpose: "Наповнені метою"
  bos_nf_filled_with_purpose_desc: "Благословенний Кодекс дає нашим воїнам силу й волю виконати свій обов’язок перед Братством, як би важко це не було."

  bos_nf_back_to_business: "Повернення до справ"
  bos_nf_back_to_business_desc: "Лост-Гілз поволі повертається до штатного режиму. Ми втратили кілька бункерів у війні з НКР... Але доки стоїть Лост-Гілз — Братство не загине. Воля Мексона — незламна."

  bos_nf_blueprints: "Креслення Ґанраннерів"
  bos_nf_blueprints_desc: "У боях проти НКР нам дістались креслення, що раніше належали цій державі. Ми здатні вдосконалити їхні застарілі конструкції — і створити спорядження, гідне Братства Сталі."

  bos_nf_reactionchambers:0 "Фокусувальні кристали"
  bos_nf_reactionchambers_desc:0 "Фокусувальні кристали в лазерних гвинтівках — неймовірно складні у відтворенні, і донині їх масове виробництво вважалося неможливим. На щастя, після відновлення необхідних креслень ситуація змінилася."

  bos_nf_simplified:0 "Спрощені конструкції"
  bos_nf_simplified_desc:0 "Стандартна лазерна гвинтівка протягом багатьох поколінь була надійним супутником Братства Сталі. Попри бажання частини організації перейти на нове озброєння, стара зброя й досі цілком ефективна проти будь-якого ворога."

  bos_nf_oldworld:0 "Розробки Старого Світу"
  bos_nf_oldworld_desc:0 "Наші прототипи новітньої енергетичної зброї — надзвичайно ефективні, але водночас надзвичайно складні у виробництві. Якщо ми хочемо використовувати ці зразки в майбутньому, вже зараз потрібно адаптувати наше обладнання до їх випуску."

  bos_nf_techreallocation:0 "Перерозподіл технологій"
  bos_nf_techreallocation_desc:0 "Навіть Братство не має ідеальної логістики. Великі обсяги обладнання гниють у сховищах і бункерах. Проведення ревізії та мінімізація втрат значно зміцнять наші позиції."

  bos_nf_scribemaintenance:0 "Регламенти обслуговування писарів"
  bos_nf_scribemaintenance_desc:0 "Обов’язок писаря — священний. Вони мають постійно вдосконалювати свої знання про механізми та технології, а також прагнути майстерності в їх обслуговуванні й реконструкції."

  bos_nf_superioralloys:0 "Покращені сплави"
  bos_nf_superioralloys_desc:0 "Сплави, що використовуються в силовій броні, важко здобути, і ще важче відтворити. Хоча ми частково опанували це ремесло, поки що його застосування обмежене наявними, дещо застарілими моделями."

  bos_nf_scraprefinement:0 "Очищення металобрухту"
  bos_nf_scraprefinement_desc:0 "З кожним днем зростає наша потреба у відновленні силової броні. Додаткова підготовка писарів у цій сфері дозволить нам значно збільшити обсяги майбутнього виробництва."

  bos_nf_powerarmourdevelop:0 "Розробка силової броні"
  bos_nf_powerarmourdevelop_desc:0 "Галузь, здатна виробляти щось настільки складне, як силова броня, з легкістю може бути переналаштована на створення будь-якої іншої високотехнологічної продукції."

  bos_nf_surge:0 "Дослідження інноваційного озброєння"
  bos_nf_surge_desc:0 "Зброя Тесли довго була об'єктом досліджень у наших найсекретніших лабораторіях. Завдяки останнім проривам ми нарешті оволоділи таємницями керування магнітними котушками. Незабаром ця зброя надійде до наших загонів!"

  bos_nf_brotherhood_r_n_d: "Науково-дослідний відділ Братства"
  bos_nf_brotherhood_r_n_d_desc: "Раніше наші дослідні відділи були розосереджені в окремих бункерах. Після знищення кількох із них у війні з НКР, настав час створити новий центр досліджень безпосередньо в Лост-Гілз."

  bos_nf_weaponry_research: "Дослідження озброєння"
  bos_nf_weaponry_research_desc: "Чи то кам’яні стріли, чи то ядерна зброя — люди завжди вели війни. Ми маємо бути готовими до всіх проявів війни — теперішніх і майбутніх."

  bos_nf_SIG_sauer_weaponry: "SIG-Sauer"
  bos_nf_SIG_sauer_weaponry_desc: "З невідомих причин Серединне Братство отримало унікальну вогнепальну зброю, якої ми не бачили в інших частинах Пустки. Що ж таке цей «P220»?"

  bos_nf_heckler_and_koch_weaponry: "Heckler & Koch"
  bos_nf_heckler_and_koch_weaponry_desc: "Heckler — довоєнна німецька компанія, що випускала стрілецьку зброю, зокрема Ґатлінг-лазери. Хоча ми не можемо дістатись до їхніх лабораторій, знайдені запаси містять багато цінного."

  bos_nf_wattz_weaponry: "Wattz"
  bos_nf_wattz_weaponry_desc: "До війни компанія Wattz виготовляла батареї, магнітофони й лазерну зброю. Уявіть, які перспективи відкриються перед Братством, якщо ми отримаємо цю силу. І яку небезпеку матиме Пустка, якщо її отримає хтось інший."

  bos_nf_vehicle_research: "Дослідження транспорту"
  bos_nf_vehicle_research_desc: "Жадоба до нафти, що колись охопила довоєнну Америку, була наслідком автомобільної манії. Вулиці міст були переповнені машинами, мов стада брамінів у Шейді-Сендс.\n\nПодивіться, як низько ми впали.\nУявіть, як високо ми ще піднімемось."

  bos_nf_takoma_motors: "Takoma Motors"
  bos_nf_takoma_motors_desc: "Писарі досі не впевнені, чи Takoma була компанією, чи просто автосалоном. Дехто з них навіть вважає, що цей бренд мав глибокий психосексуальний підтекст — хоча вони так кажуть про все, чого не розуміють. У будь-якому разі, це варто дослідити."

  bos_nf_n_h_and_m_vehicles: "NH&M"
  bos_nf_n_h_and_m_vehicles_desc: "До Великої Війни NH&M була потужною залізничною компанією на Сході. Якщо ми хочемо відновити далекі комунікації, слід вивчити їхні методи. Принаймні це краще, ніж втрачати ще одну дирижабль."

  bos_nf_chryslus_vehicles: "Chryslus"
  bos_nf_chryslus_vehicles_desc: "Автомобілі Chryslus були вершиною довоєнних технологій — атомні двигуни, автономні системи. Якщо ми прагнемо оволодіти спадком Пустки, ми маємо знати, як створити справжній Chryslus Cherry Bomb."

  bos_nf_industry_research: "Дослідження промисловості"
  bos_nf_industry_research_desc: "Один довоєнний священник писав: «Індустрія зростає, товари множаться, аграрний і промисловий сектори процвітають — у цьому й полягає справжнє багатство й могутність держави». Якщо ми хочемо контролювати технології Пустки, ми повинні розуміти її промислову основу."

  bos_nf_dunwich_borers: "Dunwich Borers"
  bos_nf_dunwich_borers_desc: "У Пустці майже не залишилось місць, де видобуток ведеться з нуля, а не через розбір довоєнних руїн. Ми повинні дослідити, як працювали кар’єри Dunwich, якщо хочемо знову добувати сировину."

  bos_nf_hornwright_industrial_mining_company: "Hornwright Industrial Company"
  bos_nf_hornwright_industrial_mining_company_desc: "Шахти Аппалачії колись славились на весь світ. І навіть зараз цей регіон залишається одним із найбагатших у Пустці. Нам потрібно вивчити методи предків!"

  bos_nf_red_rocket: "Red Rocket"
  bos_nf_red_rocket_desc: "Початкові теорії про зв’язок Red Rocket із міжпланетними подорожами були перебільшені. Та щонайменше ми можемо вивчити, як їм вдалося стандартизувати обслуговування транспорту."

  bos_nf_air_research: "Дослідження авіації"
  bos_nf_air_research_desc: "Колись паладини Мідвестської експедиції вирушили на схід на величезних дирижаблях. Ці реліквії зустрічаються дедалі рідше, але навіть у наш час в авіації ще багато чого можна пізнати."

  bos_nf_lockreed: "Lockreed"
  bos_nf_lockreed_desc: "Один з писарів переконаний, що це просто помилка в написанні. Та попри це, компанія Lockreed виготовляла пасажирські повітряні судна до Великої війни. А паладини — хіба не найцінніші пасажири?"

  bos_nf_ball_aerospace: "Ball Aerospace"
  bos_nf_ball_aerospace_desc: "Боулдер приховує чимало чудес, і компанія Ball була одним із них. Одного дня Братство знову підніметься в небо — і ця висота стоятиме на знаннях Ball та подібних їй."

  bos_nf_repconn: "REPCONN"
  bos_nf_repconn_desc: "Інженерно-ракетна компанія Невади, відома як REPCONN, була, як ми переконані, радше фасадом для довоєнного військового комплексу, а не звичайною корпорацією. Як символічно, що її секрети потрапили до наших рук. Уявіть, чого ми досягнемо, опанувавши плазмову тягу."

  bos_nf_robotics_research: "Дослідження робототехніки"
  bos_nf_robotics_research_desc: "Ми непохитно дотримуємось: не створюй машину за образом і подобою людського розуму. Але в гарному тостері немає нічого поганого."

  bos_nf_cerulean_robotics: "Cerulean Robotics"
  bos_nf_cerulean_robotics_desc: "Cerulean була однією з численних дочірніх компаній RobCo, розташованою на території сучасного Фрісайду. Попри чутки серед паладинів, вони займались не лише виробництвом роботів «Fisto»... ми сподіваємося."

  bos_nf_robco: "RobCo"
  bos_nf_robco_desc: "Що сказати про RobCo? Що вони були мільярдною корпорацією в галузі робототехніки й ПЗ? Що створили перші «Stealth Boy»? А може, згадаємо, як мрії Хауса загрожували всій Пустці? Достатньо сказати одне — лише ми гідні стерегти їхні таємниці."

  bos_nf_acme: "Acme"
  bos_nf_acme_desc: "Схоже, не існувало єдиної корпорації Acme — це ім’я використовували різні компанії, щоб бути першими в... телефонному довіднику? Справді? Світ до війни був божевільним."

  bos_nf_theoretical_research: "Теоретичні дослідження"
  bos_nf_theoretical_research_desc: "Наші предки майже стали богами: голографічні реплікатори, тераформування, дешева безмежна енергія... Який урок ми винесемо з їхнього падіння? Прогрес без контролю — це шлях до знищення."

  bos_nf_future_tec: "Future-Tec"
  bos_nf_future_tec_desc: "Саме Future-Tec створили G.E.C.K. — пристрій, що ледь не врятував Пустку. Якби ми навчилися виготовляти їх самі, ми могли б знову перетворити світ на сад. Або — на щось навіть краще..."

  bos_nf_greenway_hydroponics: "Greenway Hydroponics"
  bos_nf_greenway_hydroponics_desc: "Одна з небагатьох довоєнних компаній, що дійсно працювала задля добра планети. Не дивно, що вона впала під час Великої війни. І все ж, навіть її руїни можуть навчити нас чомусь цінному."

  bos_nf_virtual_strategic_solutions: "Virtual Strategic Solutions"
  bos_nf_virtual_strategic_solutions_desc: "До того, як впали бомби, американці витрачали тисячі годин на електронні симуляції. Дегенерація. Цю машину треба замкнути навіки... Щойно зіграємо ще один хід."

  bos_nf_wmd_research: "Дослідження зброї масового ураження"
  bos_nf_wmd_research_desc: "Пустка не може бути довірена зброї, яка вже знищила світ. Лише Братство зможе контролювати цю загрозу й захистити всіх — навіть від них самих."

  bos_nf_mininuke_preperation: "Підготовка до застосування міні-ядер"
  bos_nf_mininuke_preperation_desc: "Лише Братство має право застосовувати міні-ядерну зброю. І ми зробимо це розсудливо, з точністю... та безжальністю."

  bos_nf_uranium_stockpiling: "Уранові резерви"
  bos_nf_uranium_stockpiling_desc: "Колись жадоба до урану спричинила справжню лихоманку. Ми збережемо здоров’я Пустки, взявши під контроль усі запаси урану."

  bos_nf_shell_stockpiling: "Накопичення снарядів"
  bos_nf_shell_stockpiling_desc: "Лише потужна й технологічно досконала організація може застосовувати зброю Великої війни. А це — саме ми."

  bos_nf_mininuke_mass_production: "Масове виробництво міні-ядер"
  bos_nf_mininuke_mass_production_desc: "Завдяки належним дослідженням і підготовці ми можемо самі створювати міні-ядерні боєприпаси. Ми більше не залежні від залишків минулого. Ми опанували атом!"

  bos_nf_plasma_preperation: "Підготовка плазмових систем"
  bos_nf_plasma_preperation_desc: "Плазмова зброя настільки складна, що досі лише Анклав розумів, як її створювати. Тепер, з належною підготовкою, ми змінимо це назавжди."

  bos_nf_plasma_core_stockpiling: "Накопичення плазмових осердь"
  bos_nf_plasma_core_stockpiling_desc: "Ми маємо зібрати якомога більше плазмових осердь, щоби поступово оснастити всіх наших лицарів і паладинів."

  bos_nf_microfusion_cell_stockpiling: "Запаси мікрозарядів"
  bos_nf_microfusion_cell_stockpiling_desc: "Сумно визнавати, але деякі наші бійці досі користуються пороховою зброєю. Щоб нас знову боялись — нам потрібна безкінечна енергія. Енергія, яку дають мікрозаряди."

  bos_nf_plasma_mass_production: "Масове виробництво плазмової зброї"
  bos_nf_plasma_mass_production_desc: "Ми більше не залежимо від арсеналів минулого — тепер ми самі створюємо зброю. Братство опанувало силу зірки — і спрямовує її проти ворогів!"

  bos_nf_destruction_device_repurposement: "Перепрофілювання пристрою самознищення"
  bos_nf_destruction_device_repurposement_desc: "Самознищення — вибір боягуза. Братство не паде. Перетворімо цей пристрій на знаряддя помсти — як нагадування ворогам: Сталь не розколюється."

  bos_nf_expeditionary_technology: "Технології експедицій"
  bos_nf_expeditionary_technology_desc: "Деякі з наших віддалених експедицій поділилися здобутими знаннями з Лост-Гілз. Настав час використати ці проєкти на благо всього Братства."

  bos_nf_p1s_weather_organ: "Орган P-1"
  bos_nf_p1s_weather_organ_desc: "Серце комплексу P-1. Інструмент змін. Усередині Вежі Простору довоєнні вчені, як подейкують, створили технологію, здатну маніпулювати середовищем із вражаючою точністю."

  bos_nf_mxc_warden_protocol: "Протокол WARDEN"
  bos_nf_mxc_warden_protocol_desc: "Програмне забезпечення WARDEN було створене для автоматизації тюрем. У післявоєнному світі воно виявилось надзвичайно корисним для управління великими територіями — особливо в поєднанні з відповідним апаратним забезпеченням."

  bos_nf_moj_holorifles: "Голозброя Елайджі"
  bos_nf_moj_holorifles_desc: "Елайджа — божевільний геній, який, як кажуть, створив унікальну технологію під час експедиції до Сьєрра-Мадре. Голозброя — потужна, бронебійна зброя, що поєднує рідкісні технології з убивчою ефективністю."

  bos_nf_shi_greenway_evergrowth: "Greenway: Вічноріст"
  bos_nf_shi_greenway_evergrowth_desc: "Ші давно досліджували таємниці так званого Вічноросту — генетично зміненого китайського стрілолисту. Модифікована рослина активно поглинає радіацію, зменшуючи мутації в поселеннях. Можливо, саме це — ключ до очищення Пустки."

  bos_nf_android_exoskin: "Екзошкіра андроїда"
  bos_nf_android_exoskin_desc: "Ми не впевнені, що це взагалі таке. Братство Стражів надіслало нам дивну партію рідкоземельного металу, сформованого у вигляді людської шкіри.\nСплав сталі з керамікою надзвичайно стійкий до пошкоджень."

  bos_nf_mch_steam_cores: "Парові осердя Спільноти"
  bos_nf_mch_steam_cores_desc: "Парова технологія, створена ще до війни у Сполучених Штатах, колись могла стати альтернативою мікрозаряду. Якщо ми її освоїмо — отримаємо потужне джерело енергії для наших потреб."

  bos_nf_ach_sentinel_suits: "Бронекостюми «Сентінел»"
  bos_nf_ach_sentinel_suits_desc: "Глибоко у Форт-Гуді, Аламоський осередок знайшов склад унікальної технології — бронекостюми «Сентінел». Це гібрид роботів і силової броні, оснащений автономними приводами. З їх допомогою ми зможемо направляти автоматизовані експедиції на допомогу віддаленим відгалуженням Братства!"

  bos_nf_bmw_ach_acme_behemoth_schematics: "Креслення «Бегемота» Acme"
  bos_nf_bmw_ach_acme_behemoth_schematics_desc: "Робот «Бегемот» — дивна річ. Гігантський, дорогий аналог проєкту Liberty Prime від RobCo. Дорогий у виробництві, вразливий до диверсій, гучний і ризикований — але жодна інша машина в Пустці не викликає такого жаху, як крокуючий «Бегемот», що наближається до вашого табору."

  bos_nf_bgf_dreamwater: "Сонна вода"
  bos_nf_bgf_dreamwater_desc: "Гілка Братства з узбережжя Мексиканської затоки передала нам партію так званої «Сонної води» — післявоєнного еліксиру, створеного у Флориді. Цей засіб набагато ефективніший за RadAway у виведенні радіації — його регулярне вживання діє як щеплення проти поширених мутацій."

  bos_nf_bap_ultracite_stockpiles: "Ультрацит"
  bos_nf_bap_ultracite_stockpiles_desc: "Ультрацит, який видобувають переважно в Аппалачії — надзвичайно цінна речовина. В провідниках він слугує потужним енергетичним носієм, в броні — надміцним сплавом, а як сировина для боєприпасів — ефективним засобом проти деяких видів мутацій, зокрема Скал."

  bos_nf_bls_synthetic_life: "Синтетичне життя"
  bos_nf_bls_synthetic_life_desc: "Із Східного узбережжя до нас прийшла одна людина. Чому саме вона? Що в ній такого, що варто було надсилати її так далеко?"

  bos_nf_new_expeditions: "Нові експедиції"
  bos_nf_new_expeditions_desc: "Братство завжди прагне просуватись далі. Ми повинні вирушати в нові експедиції, знаходити технології — де б вони не були."

  bos_nf_the_village: "Селище"
  bos_nf_the_village_desc: "Тихе містечко, відоме просто як «Селище», довгий час залишалося загадкою для дослідників Братства. Час нанести візит."

  bos_nf_the_glow: "Сяйво"
  bos_nf_the_glow_desc: "Дослідницький центр West Tek — він же «Сяйво» або «Велике Сяйво» — був заснований у 2055 році як головний біологічний комплекс, пізніше розширений для роботи над озброєннями. Колись ми вважали, що потрапити туди — неможливо. Але з нашими технологіями?.."

  bos_nf_vault_17: "Сховище 17"
  bos_nf_vault_17_desc: "Сховище 17 — одне з численних, створених Vault-Tec. У 2155 році на нього напала Єдність, захопивши мешканців і перетворивши їх на супер-мутантів. Можливо, в його надрах залишилась корисна інформація."

  bos_nf_ghost_farm: "Примарна ферма"
  bos_nf_ghost_farm_desc: "Примарна ферма — невелике поселення на околицях Модока, створене групою мутантів на поверхні, над їхнім підземним містечком."

  bos_nf_ruins_of_broken_hills: "Руїни Брокен-Гілз"
  bos_nf_ruins_of_broken_hills_desc: "Колись Брокен-Гілз був процвітаючим містом — доки не виснажились уранові шахти. Місто зникло разом із ресурсами. Мешканці залишили руїни вітру й пилу. Можливо, шахтарі залишили там обладнання?"

  bos_nf_irvine: "Ірвайн"
  bos_nf_irvine_desc: "Колись Ірвайн вважався утопією.\nТепер тут лише спогади. Можливо, варто дослідити, що зробило його великим у минулому?"

  bos_nf_cease_and_desist_isotope_chapter: "Атака на «Ізотопну гілку»"
  bos_nf_cease_and_desist_isotope_chapter_desc: "«Ізотопна гілка» — колишні члени Братства, вигнані старійшиною Френсісом після провалу експедиції до Сяйва. Вони досі носять наші герби, порушуючи всі протоколи. Пора надіслати паладинів і повернути те, що належить нам по праву."

  bos_nf_golgotha: "Голгофа"
  bos_nf_golgotha_desc: "У Нью-Рено тіла мертвих ховають на кладовищі, званому Голгофа. Яка різниця — мародерствувати в могилах до-воєнних чи післявоєнних мертвих? Якщо знайдемо з ними технології — воно того варте."

  bos_nf_toxic_caves: "Токсичні печери"
  bos_nf_toxic_caves_desc: "«Токсичні печери», як їх називають місцеві — довоєнний військовий склад на північний захід від Кламета. Можливо, там збереглися відомості, здатні зміцнити нашу справу."

  bos_nf_vault_11: "Сховище 11"
  bos_nf_vault_11_desc: "Маленьке, ізольоване сховище в Мохаве. За нашими даними, воно порожнє — отже, його очищення має пройти без ускладнень."

  bos_nf_support_the_nevada_free_states: "Підтримати Вільні Штати Невади"
  bos_nf_support_the_nevada_free_states_desc: "Взаємодія Таґгерді з Вільними Штатами в минулому була помилкою. Але об’єднання жителів Аппалачії дозволило здолати загрозу Скал. Ми маємо винести уроки й підтримати нову гілку Вільних Штатів."

  bos_nf_hawaii: "Порт Гонолулу"
  bos_nf_hawaii_desc: "Лише небагато наважуються подорожувати до самого краю світу. Але завдяки нашому нещодавно захопленому порту — ми маємо таку можливість. Що чекає нас по той бік океану?"

  bos_nf_anchorage: "Анкоридж — надія Америки"
  bos_nf_anchorage_desc: "Колись поле бою в Анкориджі стало вирішальним у війні двох імперій. Можливо, там досі зберігаються артефакти, які не повинні були бути знайдені..."

  bos_nf_japan: "Країна Сонця, що сходить"
  bos_nf_japan_desc: "На узбережжі колишнього супротивника Америки, згідно з довоєнними глобусами, розташовувались острови. Якщо ми доберемось туди — можемо знайти технології, забуті сотнями років."

  bos_nf_china: "Водами Янцзи"
  bos_nf_china_desc: "Тут, на Янцзи, відбулись перші великі бої з використанням силової броні. Саме тут майбутні воїни Братства здобували перші відзнаки. Це — мрія. Але якщо вона здійсниться?.."

  bos_nf_learning_from_the_ncr_bos_war: "Уроки війни з НКР"
  bos_nf_learning_from_the_ncr_bos_war_desc: "Багато хоробрих солдатів загинули у війні з НКР. Ми зобов’язані вшанувати їхню жертву — і винести уроки, щоб наступного разу перемогти."

  bos_nf_the_eastern_cities: "Східні міста"
  bos_nf_the_eastern_cities_desc: "Багато міст на схід від Лост-Гілз зберігають позитивні відносини з нами — завдяки невтомній роботі польових писарів. Вийдімо на зв’язок. Можливо, громадяни знову підтримають Братство у скрутну годину."

  bos_nf_necropolis_recruitment: "Союз із Рухом Опору Некрополя"
  bos_nf_necropolis_recruitment_desc: "Рух Опору Некрополя — невелика група людей, що мешкають серед руїн старого Некрополя. Вони завжди радо приймали нашу підтримку. Можливо, вони погодяться дозволити нам створити прихований передовий форпост на своїй території?"

  bos_nf_greenville_recruitment: "Рекрутинг у Ґленвіллі"
  bos_nf_greenville_recruitment_desc: "У давні часи Ґленвілл надавав допомогу Братству під час війни з армією Майстра. Можливо, тепер, коли ми в скруті, вони звернуться до нас?"

  bos_nf_santa_maria_recruitment: "Рекрутинг у Санта-Марії"
  bos_nf_santa_maria_recruitment_desc: "На короткий час Санта-Марія стала прибережною базою Братства під час конфлікту з НКР — до моменту, коли місто було захоплене. Дехто з мешканців досі з ностальгією згадує той час, вважаючи закони НКР надмірно жорсткими до звичайних громадян Пустки."

  bos_nf_santa_barbara_recruitment: "Рекрутинг у Санта-Барбарі"
  bos_nf_santa_barbara_recruitment_desc: "Санта-Барбара, в перші роки становлення НКР, була одним з основних торгових міст, через які ми постачали ресурси з Лост-Гілз до Мексона."

  bos_nf_maxson_recruitment: "Рекрутинг у Мексоні"
  bos_nf_maxson_recruitment_desc: "Місто Мексон, назване на честь нашого засновника, було найпалкішим прихильником Братства до окупації з боку НКР. Вони з радістю підтримають нас знову."

  bos_nf_arming_the_recruits: "Озброїти новобранців"
  bos_nf_arming_the_recruits_desc: "Чимало новобранців влилося до лав Братства. Попри те, що подібна відкритість — рідкість для нашого ордену, втрати у війні змушують діяти. Підтримка, допомога й нові люди прибувають до Лост-Гілз. Забезпечмо їх спорядженням, щоби вони могли служити Кодексу."

  bos_nf_take_in_necropolis_remnants: "Прийняти залишки Некрополя"
  bos_nf_take_in_necropolis_remnants_desc: "Жорстокі нові покарання з боку НКР щодо жителів старого Некрополя роблять цю громаду ідеальною ціллю для наших рекрутингових зусиль."

  bos_nf_side_with_angry_maxson_traders: "Підтримати обурених торговців Мексона"
  bos_nf_side_with_angry_maxson_traders_desc: "Багато торговців Мексона обурені тим, що НКР підтримує торговців Ван Ґрафа, вважаючи це загрозою власному добробуту. Ми можемо схилити їх на наш бік."

  bos_nf_preparing_for_the_ceasefires_end: "Готуючись до кінця перемир’я"
  bos_nf_preparing_for_the_ceasefires_end_desc: "НКР не можна довіряти. Вони — діти, що граються з вогнем, переконані, що не повторять помилок минулого, повторюючи їх знову і знову. Це перемир’я — лише тимчасове. Потрібно готуватись до моменту, коли війна повернеться до Каліфорнії."

  bos_nf_a_chance_opportunity: "Неочікувана можливість"
  bos_nf_a_chance_opportunity_desc: "Ми очікували краху Республіки, але не настільки швидкого. Ситуація стрімко погіршується — і все більше виглядає доцільним завершити перемир’я раніше, ніж планувалося."

  bos_nf_a_guarantee_of_safety_for_maxson: "Гарантії безпеки для Мексона"
  bos_nf_a_guarantee_of_safety_for_maxson_desc: "Жителі Мексона звикли платити податки байдужому уряду в Шейді-Сендс. Віддавати частину Братству — те саме. Якщо ми пообіцяємо не розривати перемир’я без попередження — забезпечимо їхню підтримку в довгостроковій перспективі."

  bos_nf_the_right_war_at_the_right_time: "Правильна війна в належний час"
  bos_nf_the_right_war_at_the_right_time_desc: "Якщо ми вирішимо завершити перемир’я, слід зробити це правильно: після підготовки, за наявності планів дій та після попередження місцевих — аби уникнути зайвих жертв серед цивільних."

  bos_nf_warning_maxsons_settlers: "Попередити поселенців Мексона"
  bos_nf_warning_maxsons_settlers_desc: "Ці мешканці тривалий час ставились до нас з повагою. Попередивши їх про майбутній конфлікт, ми зміцнюємо їхню лояльність."

  bos_nf_building_up_a_stockpile: "Формування запасів"
  bos_nf_building_up_a_stockpile_desc: "Одна з головних проблем у війні з НКР — нестача постачання: броні, боєприпасів, пайків. Вичерпні ресурси Каліфорнії більше не можуть покривати всі потреби. Формування запасів — перший крок до повномасштабної підготовки до війни."

  bos_nf_preparing_contingency_plans: "Аварійні протоколи"
  bos_nf_preparing_contingency_plans_desc: "Ми зазвичай тримаємо пристрій самознищення Лост-Гілз деактивованим. У цих залах зберігаються тисячі архівів, креслень і знань. Та якщо війна неминуча — ми маємо прийняти важке рішення: краще втратити ці знання, ніж дозволити Пустці використати їх проти Братства."

  bos_nf_taking_back_california: "Завершити перемир’я"
  bos_nf_taking_back_california_desc: "Жодне перемир’я не вічне. Паладини, до зброї! Час повернути те, що належить нам. Помстимося за братів, полеглих у першій війні."

  bos_nf_dominion_over_the_wasteland: "Домінування над Пусткою"
  bos_nf_dominion_over_the_wasteland_desc: "Минуло чимало часу з моменту, коли Братство мало керувати настільки великою громадянською популяцією. Нам доведеться ретельно працювати, аби Лост-Гілз витримав нове навантаження."

  bos_nf_propaganda_campaigns: "Пропагандистські кампанії"
  bos_nf_propaganda_campaigns_desc: "Шейді-Сендс роками зображували нас терористами. Щоб змінити цю спотворену думку, нам доведеться вести активну інформаційну боротьбу."

  bos_nf_creating_civil_administration_sectors: "Адаптація секторів цивільного управління"
  bos_nf_creating_civil_administration_sectors_desc: "Чимало інфраструктури НКР ми можемо використати для власних цілей. Деякі виборні посади будуть замінені призначеними старійшинами, але більшість систем — від поліції до інженерного корпусу — збережемо."

  bos_nf_rounding_up_criminals: "Зачистка злочинців"
  bos_nf_rounding_up_criminals_desc: "Рейдери, скориставшись війною, намагались проникнути на наші території. Знешкодивши їх, ми не лише покращимо безпеку, а й отримаємо підтримку серед населення."

  bos_nf_the_brotherhood_triumphant: "Тріумф Братства"
  bos_nf_the_brotherhood_triumphant_desc: "Нарешті, проблеми з окупацією колишніх територій НКР тимчасово вирішені. Настав час поглянути в майбутнє великої справи."

  bos_nf_question_of_greater_conscription: "Питання загального призову"
  bos_nf_question_of_greater_conscription_desc: "Частини Братства, що керували великими територіями, часто порушували традиції, рекрутуючи місцеве населення. Нам слід обрати: дотримуватись Кодексу чи скористатися людським ресурсом."

  bos_nf_preparing_for_expansion: "Майбутнє — у наших руках"
  bos_nf_preparing_for_expansion_desc: "Братство тепер контролює свою долю. Чи розширимо ми межі, прагнучи з'єднатись з іншими осередками, чи укріпимося в Каліфорнії, чекаючи, поки решта прийде до нас?"

  bos_nf_utilizing_californias_industry: "Використати промисловість Каліфорнії"
  bos_nf_utilizing_californias_industry_desc: "Каліфорнія має розвинену промислову базу. Якщо діяти обережно — ми зможемо інтегрувати її до наших структур без руйнівних наслідків."

  bos_nf_the_coast_of_california: "Узбережжя Каліфорнії"
  bos_nf_the_coast_of_california_desc: "Братство ніколи не діяло на морі — пора це змінити. У глибинах вод — таємниці. А по той бік — загрози."

  bos_nf_seatrials: "Морські випробування"
  bos_nf_seatrials_desc: "Ми живемо у світі, де панує вода. Час пристосовуватись. Тестування довоєнних технологій на морі дасть нам перевагу."

  bos_nf_screening: "Охоронні кораблі"
  bos_nf_screening_desc: "Навіть найпотужніші судна вразливі перед торпедами чи диверсантами. Нам потрібні легкі кораблі супроводу для захисту флоту Братства."

  bos_nf_navallexicon: "Морська доктрина"
  bos_nf_navallexicon_desc: "Ми маємо розширити Кодекс для морських операцій. Кожне судно — це загін. Кожен капітан — паладин."

  bos_nf_aircatapults: "Катапульти для авіації"
  bos_nf_aircatapults_desc: "До Великої війни Америка запускала літаки з авіаносців. Ми можемо зробити це знову. Катапульти скорочують довжину зльоту — і збільшують наш радіус дії."

  bos_nf_seabehemoths: "Морські Бегемоти"
  bos_nf_seabehemoths_desc: "Братство тепер здатне розгортати найбільші бойові кораблі на морі!"

  bos_nf_steelcage: "Сталеве Гніздо"
  bos_nf_steelcage_desc: "«Сталеве Гніздо», як його з любов’ю називають — флагманський корабель нашого флоту. Довоєнне вантажне судно, модернізоване з артилерією, лазерами важкого калібру та ядерним реактором. Його броня майже невразлива. Багато хто вважає, що саме цей корабель є доказом нашого панування на морі."

  bos_nf_the_airways_of_california: "Повітряні шляхи Каліфорнії"
  bos_nf_the_airways_of_california_desc: "Ще у 2240-х ми намагалися вивчити секрети вертоптахів. Попри провал, зацікавлення залишилось. Час показати, що розпіарена Повітряна Сила Ведмедя — лише фікція, а не загроза."

  bos_nf_fighters: "Винищувачі"
  bos_nf_fighters_desc: "Дирижаблі вразливі до кулеметного вогню та ракет. Розгортання винищувачів забезпечить нам перевагу в повітрі."

  bos_nf_support: "Підтримка з повітря"
  bos_nf_support_desc: "Справжня сила авіації — у підтримці наших паладинів на полі бою. Ми повинні навчитися використовувати перевагу в повітрі на повну."

  bos_nf_airlexicon: "Повітряний кодекс"
  bos_nf_airlexicon_desc: "Літаки — це справжні лицарі: швидкі, не обмежені рельєфом. Яка символічність, що їх обслуговують «сквайри» — механіки нового часу."

  bos_nf_behemoths: "Повітряні Бегемоти"
  bos_nf_behemoths_desc: "Винищувачі домінування довоєнного світу — неймовірно потужні, але вимагають величезних ресурсів. Паливо, боєприпаси, обслуговування — багато хто в Братстві сумнівається в доцільності їх застосування."

  bos_nf_bombers: "Фортеці-бомбардувальники"
  bos_nf_bombers_desc: "Довоєнні фортеці-бомбардувальники — літаючі бастіони з кулеметами та турелями, здатні знищити будь-яку ціль. Дорогі, але ефективні. Здатність знищувати ворога без ризику — переконлива."

  bos_nf_scourge: "Кара"
  bos_nf_scourge_desc: "Братство раніше використовувало дирижаблі як транспорт. І лише нещодавно, після падіння НКР, ми можемо знову використовувати їх масово. Це вимагає глибокого розуміння технологій та стратегій їх застосування."

  bos_nf_securing_nearly_lost_bunkers: "Зміцнення майже втрачених бункерів"
  bos_nf_securing_nearly_lost_bunkers_desc: "Деякі бункери ще можна відновити. Це зміцнить наші шанси на остаточну перемогу!"

  bos_nf_bunker_alpaugh: "Бункер Альпо"
  bos_nf_bunker_alpaugh_desc: "У бункері Альпо польові писарі втримали позиції — на відміну від інших!"

  bos_nf_bunker_blackwell: "Бункер Блеквелл"
  bos_nf_bunker_blackwell_desc: "Кілька розвідників утримали Блеквелл, зустрічаючи наших паладинів з розпростертими обіймами."

  bos_nf_reclaiming_destroyed_bunkers: "Відвоювання знищених бункерів"
  bos_nf_reclaiming_destroyed_bunkers_desc: "На жаль, більшість бункерів на півночі повністю знищено. Але якщо знешкодимо мутовану фауну, зможемо відновити частину з них."

  bos_nf_bunker_atascadero: "Бункер Атаскадеро"
  bos_nf_bunker_atascadero_desc: "Бункер Атаскадеро став домом для мурах. Їх слід ліквідувати."

  bos_nf_bunker_morro: "Бункер Морро"
  bos_nf_bunker_morro_desc: "Тепер це покинута база, де оселились геккони."

  bos_nf_bunker_salinas: "Бункер Салінас"
  bos_nf_bunker_salinas_desc: "Салінас зайнятий невідомими істотами, що зробили його своїм лігвом."

  bos_nf_bunker_monterey: "Бункер Монтерей"
  bos_nf_bunker_monterey_desc: "Залишки бункера Монтерей захопила група Касадорів."

  bos_nf_elders_schemes: "Інтриги старійшин"
  bos_nf_elders_schemes_desc: "У Братства немає єдиного лідера. Тимчасового Верховного Старійшину обирають з-поміж ради — зазвичай для медіації. І сама потреба в такій посаді вже свідчить про внутрішню нестабільність."

  bos_nf_maxsonians: "Максоніанці"
  bos_nf_maxsonians_desc: "Максоніанці — консервативне крило Братства, прихильники суворого дотримання Кодексу. Саме вони, зокрема, наполягали на висилці старійшини Елайджі до Мохаве."

  bos_nf_jonathan_maxson_back_to_health: "Одужання Джонатана Мексона"
  bos_nf_jonathan_maxson_back_to_health_desc: "Дивовижно, але Джонатан Мексон повністю одужав! Його присутність укріплює позиції максоніанців — і веде фракцію до стабільного майбутнього."

  bos_nf_coronating_a_new_maxsonian_elder: "Інтронізація нового максоніанського старійшини"
  bos_nf_coronating_a_new_maxsonian_elder_desc: "Джонатан Мексон — видатна фігура, але він не вічний. Після важких поранень, отриманих у війні з НКР, час передати факел. Старійшина Ангарад, героїня битви за золотий резерв НКР, готова взяти на себе цю місію."

  bos_nf_war_hero_of_the_ncr_war: "Героїня війни з НКР"
  bos_nf_war_hero_of_the_ncr_war_desc: "Старійшина Ангарад — видатна фігура Братства й ключова особа для керівництва максоніанською фракцією після завершення правління Джонатана Мексона."

  bos_nf_honoring_the_maxson_elders: "Вшанування старійшин Мексона"
  bos_nf_honoring_the_maxson_elders_desc: "Лінія старійшин Мексона — найшанованіша в Лост-Гілз, адже саме вона стояла біля витоків заснування нашої організації."

  bos_nf_the_line_of_succession: "Лінія спадкоємності"
  bos_nf_the_line_of_succession_desc: "Доля Артура Мексона, сина Джонатана — суворо охороняється. Його поява може змінити політику Лост-Гілз. Пора вирішити, що буде найкраще — не лише для Артура, а й для Братства."

  bos_nf_rhombians: "Ромбіанці"
  bos_nf_rhombians_desc: "Фракція Ромбіанців — помірковані реформатори. Вони виступають за розумне оновлення Кодексу й інфраструктури. Їхня позиція часто співзвучна підходу експедиції Лайонза — з фокусом на допомогу цивільним."

  bos_nf_honor_the_ncr_war_veterans: "Вшанувати ветеранів війни з НКР"
  bos_nf_honor_the_ncr_war_veterans_desc: "Наші герої здолали Імперію Ведмедя. Всі осередки Братства — від Лост-Гілз до Столиці — піднімуть келих у їхню честь!"

  bos_nf_call_out_poor_military_strategy: "Викрити хибну військову стратегію"
  bos_nf_call_out_poor_military_strategy_desc: "Війна з НКР показала обмеження наших тактик. Те, що працювало проти банди рейдерів, не діє проти національних армій. Ми маємо адаптуватися."

  bos_nf_long_history_of_reform: "Історія реформ"
  bos_nf_long_history_of_reform_desc: "Ромбіанці мають давню історію реформаторської діяльності в Братстві Сталі. Ми маємо визнати їхню роль в адаптації ордену до викликів часу."

  bos_nf_reaching_out_to_family: "Зв'язок із родиною"
  bos_nf_reaching_out_to_family_desc: "Дочка старійшини Марі, Кетрін, наразі мешкає на сході з осередком Братства біля Далласа. Якщо можемо — варто надіслати підтримку."

  bos_nf_taggerdys_legacy: "Спадщина Таґгерді"
  bos_nf_taggerdys_legacy_desc: "Таґгерді — ключова фігура для Ромбіанців. Вона зробила вибір, на який мало хто наважився б: пожертвувати осередком заради порятунку Пустки. Битва за Форт Діфайанс — легендарна подія, і ми маємо її вшанувати."

  bos_nf_new_reforms: "Нові реформи"
  bos_nf_new_reforms_desc: "Існує безліч реформ, які ми можемо впровадити в Братстві, якщо матимемо політичну волю. Деякі з них будуть непростими для ухвалення..."

  bos_nf_our_right: "Наше право"
  bos_nf_our_right_desc: "Як технократична організація, ми маємо священне право на володіння технологією. Ми не крадемо її зі зла — ми захищаємо невинних від їхньої ж недбалості. Наш обов’язок — зберегти стабільність у світі, який забув, як працює кнопка живлення."

  bos_nf_salvaged_metal: "Збір металобрухту"
  bos_nf_salvaged_metal_desc: "Метал у Пустці — як бур’ян. Скрізь. Збір металобрухту в нашій зоні дозволить поповнити запаси для подальшого виробництва."

  bos_nf_increase_power_production: "Посилення енергогенерації"
  bos_nf_increase_power_production_desc: "Генератори — життєво важливі. Вони потребують пального і часто не сумісні з місцевими замінниками. Але без них наше обладнання стоїть мертвим вантажем."

  bos_nf_salvaged_electronics: "Збір електроніки"
  bos_nf_salvaged_electronics_desc: "На відміну від металу, електроніка тендітна. Зняття проводки, чипів і плат із техніки дасть нам цінні ресурси для нових проектів."

  bos_nf_advanced_tech: "Пошук високих технологій"
  bos_nf_advanced_tech_desc: "Довоєнні технології — найцінніші й найнебезпечніші. Там, де лежать їхні уламки, завжди знайдеться щось, що намагатиметься тебе вбити. Але саме там ми знайдемо найцінніше."

  bos_nf_fueling_our_rise: "Паливо нашого злету"
  bos_nf_fueling_our_rise_desc: "Ми шукаємо ядерне паливо. Невикористані елементи живлять усе — від силової броні до лазерної артилерії. Вони — ключ до нашого домінування."

  bos_nf_arm_foundries: "Озброїти литейні"
  bos_nf_arm_foundries_desc: "Ми не можемо захищати Кодекс без зброї. Якщо ми хочемо зберегти перевагу, нам потрібно не лише вилучати технологію — ми маємо її виробляти."

  bos_nf_the_veterans_pension: "Пенсія для ветеранів"
  bos_nf_the_veterans_pension_desc: "Соромно, але багато наших лицарів купували боєприпаси за власні кошти. Більше того, багато з них у боргах перед квартирмейстерами, які, в свою чергу, заборгували Ван Ґраффам. Це має бути вирішено негайно."

  bos_nf_currency_reform: "Реформа обігу"
  bos_nf_currency_reform_desc: "Наше розширення змушує нас зіткнутись із чимось гіршим, ніж Майстер, Анклав чи Легіон — із ринком. Щоб взаємодіяти з громадянами, нам доведеться створити хоч якусь систему торгівлі."

  bos_nf_finding_caps: "Пошук кришок"
  bos_nf_finding_caps_desc: "Попри зневагу до торгівлі, в часи Габа ми все ж співпрацювали з купцями. Продаж обмеженої кількості високотехнологічного обладнання за кришки — можлива альтернатива."

  bos_nf_bounty_hunting: "Полювання за винагородою"
  bos_nf_bounty_hunting_desc: "Братство в Аппалачії заробляло, виконуючи завдання для місцевих. Західне Братство також може піти цим шляхом. Якщо це зберігає Ланцюг, значить — виправдано."

  bos_nf_debts_of_the_quartermasters: "Борг квартирмейстерів"
  bos_nf_debts_of_the_quartermasters_desc: "Завдяки економічним реформам ми можемо сплатити борги перед Ван Ґраффами одноразово. Нехай це стане фіналом цієї ганьби."

  bos_nf_adjusting_to_bunker_life: "Адаптація до життя в бункері"
  bos_nf_adjusting_to_bunker_life_desc: "Для мешканців навколо Лост-Гілз це буде зміна — з багатьох бункерів до одного. Ми маємо створити умови, за яких це життя стане не просто виживанням, а функціональною нормою."

  bos_nf_enforce_recycling_programs: "Програми переробки"
  bos_nf_enforce_recycling_programs_desc: "Бункер — як корабель у космосі: кожна деталь на вагу золота. Переробка зменшить потребу в імпорті та зробить Лост-Гілз самодостатнім."

  bos_nf_repairing_ventilation_systems: "Ремонт вентиляції"
  bos_nf_repairing_ventilation_systems_desc: "З огляду на зростання чисельності в бункері, вентиляція — критичний елемент. Повітря має бути чистим — це не обговорюється."

  bos_nf_finding_new_living_space: "Пошук житлового простору"
  bos_nf_finding_new_living_space_desc: "Ми маємо розширити зони проживання, інакше нас чекає перенаселення. Це питання не розкоші, а виживання."

  bos_nf_advanced_scavenging: "Передове збирання"
  bos_nf_advanced_scavenging_desc: "Ми готові розпочати передову програму збирання: систематичне виявлення та повернення технології з Пустки."

  bos_nf_scavenging_weaponry: "Збирання зброї"
  bos_nf_scavenging_weaponry_desc: "У довоєнній Америці зброя була повсюдною — від лікарень до кегельбанів. Ми повинні прочесати всі ці місця."

  bos_nf_scavenging_plasma: "Полювання на лазери — у невірних місцях"
  bos_nf_scavenging_plasma_desc: "Хотілося б плазмову зброю... Мріяти не заборонено."

  bos_nf_scavenging_laser_rifles: "Пошук лазерних гвинтівок"
  bos_nf_scavenging_laser_rifles_desc: "На старих військових базах досі зберігаються запаси лазерної зброї. Ми маємо випередити конкурентів і здобути їх першими!"

  bos_nf_scavenging_heavy_energy_weapons: "Збирання важкої енергозброї"
  bos_nf_scavenging_heavy_energy_weapons_desc: "Навіщо армії довоєнної Америки були потрібні ґатлінги з лазерним випроміненням? Чи були китайці настільки небезпечні? А може, вони теж мали власних супермутантів?"

  bos_nf_scavenging_support_equipment: "Збирання допоміжного обладнання"
  bos_nf_scavenging_support_equipment_desc: "Радіостанції, шоломи, гайкові ключі, енергетичні напої «Nuka Cola» — це не плазмогармати, але без них відділення не зможе виконати завдання."

  bos_nf_scavenging_medical_equipment: "Збирання медичного обладнання"
  bos_nf_scavenging_medical_equipment_desc: "Довоєнних медичних запасів лишилось небагато, але ми маємо зібрати все, що зможемо. Стімпаки та антибіотики потрібні нам більше, ніж будь-кому в Пустці. Адже ми служимо їй."

  bos_nf_scavenging_piercing_weaponry: "Збирання пробивної зброї"
  bos_nf_scavenging_piercing_weaponry_desc: "У НКР ракетні установки називають «відкривачками». Вони використовують їх проти наших лицарів. Ми не можемо дозволити цій зброї потрапити не в ті руки."

  bos_nf_scavenging_big_weaponry: "Збирання важкого озброєння"
  bos_nf_scavenging_big_weaponry_desc: "Ось твоя гвинтівка, ось твій пістолет. А ось твій міномет. І, якщо чесно, міномет — найкращий із трьох."

  bos_nf_scavenging_power_armor: "Збирання силової броні"
  bos_nf_scavenging_power_armor_desc: "Силова броня змінила хід Великої війни, допомігши США дійти до воріт Пекіна. Тепер вона — символ Братства. Ми маємо зібрати кожен екземпляр."

  bos_nf_scavenging_t45: "Збирання силової броні Т-45d"
  bos_nf_scavenging_t45_desc: "T-45d від West-Tek була першою серійною моделлю, відправленою на фронт. Вона вже не нова, але для наших лицарів — безцінна. Треба знайти якомога більше збережених одиниць."

  bos_nf_scavenging_power_armor_repair: "Ремонт силової броні"
  bos_nf_scavenging_power_armor_repair_desc: "Два століття ремонту зробили нас експертами. Ми можемо продовжити життя кожному екземпляру, якщо не соромитимемось замінити деякі компоненти деталями з дитячих довоєнних іграшок."

  bos_nf_scavenging_t51b: "Збирання силової броні T-51b"
  bos_nf_scavenging_t51b_desc: "Кажуть, у Співдружності Т-51b стільки, що її порівнюють із довоєнними спорткарами. Можливо, це лише легенда. Але якщо там і справді пофарбували екземпляр у яскраво-рожевий — то власник не заслуговує жити."

  bos_nf_scavenging_vehicles: "Збирання транспорту"
  bos_nf_scavenging_vehicles_desc: "Щоб подолати Пустку, нам потрібен транспорт. Навіть у силовій броні — дорога до Столичної Пустки довга. Можливо, варто перевірити старі автосалони, гаражі чи автобусні станції?"

  bos_nf_scavenging_mobile_vehicles: "Збирання мобільної техніки"
  bos_nf_scavenging_mobile_vehicles_desc: "Більшість довоєнного транспорту вже не на ходу, але деякі армійські машини були підготовлені до апокаліпсису. Варто взяти приклад із наших братів на Середньому Заході."

  bos_nf_scavenging_durable_vehicles: "Збирання витривалої техніки"
  bos_nf_scavenging_durable_vehicles_desc: "Нам не потрібні гламурні авто типу «Cherry Bomb». Нам потрібні машини, здатні подолати бездоріжжя, бруд, воду і навіть гори."

  bos_nf_scavenging_advanced_vehicles: "Збирання високотехнологічної техніки"
  bos_nf_scavenging_advanced_vehicles_desc: "Довоєнні танки — річ марна без національної промисловості. Але якщо ми знайдемо бодай кілька — хай краще вони будуть в нас, ніж у банди Вісімдесятників."

  bos_nf_greater_reforms: "Глибші реформи"
  bos_nf_greater_reforms_desc: "Час переглянути усталені інститути Братства Сталі. Вірити в ідеал — значить бути готовим зрадити його заради його ж порятунку."

  bos_nf_outsider_initiation: "Посвята сторонніх"
  bos_nf_outsider_initiation_desc: "Ми завжди ставилися з підозрою до чужаків. Але Волт-Двеллер, Обранець — хіба не сторонні? Час наслідувати Середній Захід і відкрити двері для гідних."

  bos_nf_initiate_ncr_settlers: "Посвята громадян НКР"
  bos_nf_initiate_ncr_settlers_desc: "Багато хто в НКР бачить, що їхня Республіка згнила. Вони шукають сенс. Шукай — і знайдеш Братство. Особливо поселенці Мексона."

  bos_nf_initiate_ranger_turncoats: "Посвята перебіжчиків-рейнджерів"
  bos_nf_initiate_ranger_turncoats_desc: "Не всі Рейнджери повірили брехні Республіки. Деякі знають — лише Братство може зберегти людство. Інші просто втомились від її несправедливості."

  bos_nf_initiate_necropolis_ghouls: "Посвята гулів із Некрополя"
  bos_nf_initiate_necropolis_ghouls_desc: "Ми не друзі гулів, але гулі з Некрополя часто мають технічні навички, що перевершують пересічного писаря. Дехто з них — гідний."

  bos_nf_limited_super_mutant_initiation: "Обмежена посвята супермутантів"
  bos_nf_limited_super_mutant_initiation_desc: "Так, це радикально. Але хіба Брокен-Гілз не створено союзом із супермутантом? Середній Захід показав: вони можуть бути ланкою в Ланцюгу."

  bos_nf_commitment_to_duty: "Вірність обов’язку"
  bos_nf_commitment_to_duty_desc: "Виплати бійцям — це шлях до занепаду. Кодекс — це не робота, це служіння. Наша обіцянка: ми не знецінюватимемо цю віру грошима."

  bos_nf_commitment_to_purity: "Вірність чистоті"
  bos_nf_commitment_to_purity_desc: "Розширення лав — це ризик. Посвята — священний ритуал, що веде свій початок від Артура Мексона. Інтегрувати злочинців і мутантів — означає зневажити саме ядро нашого Ордену."

  bos_nf_currency_reform_caps: "Кришки"
  bos_nf_currency_reform_caps_desc: "Кришки самі по собі нічого не варті — але вони обмінюються на воду в Габі. Через це ми будуємо гідравлічну імперію, контролюючи іригацію й ферми Каліфорнії."

  bos_nf_currency_reform_gold_bullion: "Золоті злитки"
  bos_nf_currency_reform_gold_bullion_desc: "Чому золото має цінність? Ніхто не знає. Але це факт. Якщо щось цінується скрізь у Пустці — то це золото."

  bos_nf_currency_reform_ncr_dollar: "Долар НКР"
  bos_nf_currency_reform_ncr_dollar_desc: "Попри всі недоліки, НКР збудувала індустріальну економіку. Прийняття їхньої валюти спростить взаємодію з місцевими."

  bos_nf_currency_reform_scrip: "Скрип"
  bos_nf_currency_reform_scrip_desc: "Середній Захід радикальний — але створення власної валюти заслуговує на повагу. Прийнявши Скрип, ми поєднаємо Схід і Захід у єдину економічну сферу — прив’язану до Братства, як і їхнє майбутнє."

  bos_nf_open_up_to_traders: "Відкриття для торгівлі"
  bos_nf_open_up_to_traders_desc: "Досі торгівля Братства із зовнішнім світом була неофіційною — солдати, поза службою, обмінювались ресурсами. Час змінити це. Створімо справжню торгову мережу між Лост-Гілз і рештою Пустки."

bos_nf_council_reforms: "Реформи Ради"
bos_nf_council_reforms_desc: "Минуло кілька непростих років з часу, коли посада Верховного Старійшини дійсно мала вагу. Війна з Республікою Нової Каліфорнії змістила баланс влади на користь паладинів та Ради. Після укладення перемир’я відкрилася можливість повернути Братство Сталі до усталеного, дисциплінованого порядку."

bos_nf_head_elder_duty_duration: "Термін Повноважень Верховного Старійшини"
bos_nf_head_elder_duty_duration_desc: "У часи розквіту Братства посада Верховного Старійшини займалась довічно. Хоча відродити цю традицію буде нелегко, ми можемо закласти адміністративну основу для унормування термінів перебування на цій посаді."

bos_nf_political_blocs: "Політичні Блоки"
bos_nf_political_blocs_desc: "Часто рішення Старійшин базуються не на раціональному аналізі, а на вірності умовним «лініям партій». Формалізувавши політичні блоки в межах Ради, ми зможемо обмежити надмірну індивідуальну свободу голосування окремих членів."

bos_nf_election_on_demand: "Просування за Запитом"
bos_nf_election_on_demand_desc: "Останні роки нові Верховні Старійшини обирались майже щороку. Якщо ми отримаємо важелі для проведення таких призначень у будь-який момент — це дасть нам гнучкість у реалізації стратегічних політичних маневрів."

bos_nf_paladins_given_some_sway: "Паладини Отримують Вплив"
bos_nf_paladins_given_some_sway_desc: "Паладини — опора Братства на полі бою, проте історично їхній вплив у Раді був обмежений. Запровадження обмеженого «молодшого голосу» для паладинів у випадках рівного розподілу голосів дозволить уникати паралічу в ухваленні рішень."

bos_nf_political_bloc_management: "Керування Політичними Блоками"
bos_nf_political_bloc_management_desc: "Закріпивши структуру блоків, ми можемо видавати директиви, що впливають на конкретні угруповання. Наприклад, за умов низької підтримки певного блоку — вивести його з політичного процесу."

bos_nf_freeing_up_the_council_table: "Розширення Ради"
bos_nf_freeing_up_the_council_table_desc: "Максоніанці та ромбіанці часто заходять у глухий кут через ідеологічні розбіжності. Введення нових Старійшин — раніше ізольованих через нетрадиційні погляди — дозволить розширити спектр думок і зменшити ризик безвиході."

bos_nf_advanced_political_schema: "Політична Схема"
bos_nf_advanced_political_schema_desc: "Старійшини Братства Сталі не цураються інтриг і маніпуляцій. Їхня поведінка — навчальний посібник з управління владою у межах закритої, технократичної структури."

bos_nf_long_range_communications: "Дальній Зв’язок"
bos_nf_long_range_communications_desc: "Як головний осередок Братства Сталі на континенті, ми маємо забезпечити виживання всіх далеких відгалужень, що поділяють нашу місію — зберігати та охороняти спадщину людства."

bos_nf_long_range_communications_alternative: "Дослідження Дальнього Зв’язку"
bos_nf_long_range_communications_alternative_desc: "Як головний осередок Братства Сталі на континенті, ми маємо забезпечити виживання всіх далеких відгалужень, що поділяють нашу місію — зберігати та охороняти спадщину людства."

bos_nf_long_range_radio_towers: "Радіовежі"
bos_nf_long_range_radio_towers_desc: "Підсилення наших радіовеж у Лост-Гілз дозволить підтримувати стабільний зв’язок з іншими осередками по пустках і оперативно надавати їм технічну чи бойову підтримку."

bos_nf_long_range_communications_washington_brotherhood: "Вашингтонське Братство"
bos_nf_long_range_communications_washington_brotherhood_desc: "§g\"..§YПозначення;§! Вашингтонське Братство (раніше — ескадрон Lance)\n§YОпис;§! Найновіший осередок, сформований колишніми командирами ескадрону Lance, які прагнули позбутися контролю Серединного Братства й підкорятися напряму нам..\n§YПримітки писарів;§! Вживання термінів 'Братство' або 'Відділ' у назві — внутрішнє рішення кожного відгалуження й не має формального значення. За нормальних умов подібне нехтування Ланцюгом Підпорядкування було б покаране, але війна з НКР унеможливлює віддалене втручання. Тим не менш, їхня лояльність до нас, а не до Епсілону, може виявитися вирішальною, якщо Серединне Братство зрадить.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_wbh_the_immortals_coup_successful: "Переворот Безсмертного Вдався"
bos_nf_wbh_the_immortals_coup_successful_desc: "Сили, вірні The Cause — залишки серединних лоялістів та опозиція Безсмертному — були усунуті. Нове Вашингтонське Братство остаточно утвердило себе як спадкоємець справжньої ідеї Братства на далекій півночі."

bos_nf_wbh_the_cause_successful: "Успіх The Cause"
bos_nf_wbh_the_cause_successful_desc: "Безсмертного було знищено, і його місце зайняло The Cause — угруповання, вірне Серединному Братству, що виступило проти перевороту у Вашингтоні.\nНа щастя, їхня лояльність до нас не менша, ніж у Безсмертного. Можливо, вони ще принесуть користь?"

bos_nf_wbh_the_alaskan_expedition: "Аляскинська Експедиція"
bos_nf_wbh_the_alaskan_expedition_desc: "Аляскинська експедиція була великим задумом Безсмертного — дослідженням далекої півночі та її таємниць. Якщо ми зможемо відновити контакт із ним, то, можливо, дізнаємося, що саме він відкрив?"

bos_nf_the_masters_army_reborn: "Армія Майстра Відроджена"
bos_nf_the_masters_army_reborn_desc: "Кровожерливість Warren взяла гору. Там, де колись паладини стримували холод півночі, тепер стоїть орда, що б’є в барабани з людської шкіри та висмоктує кістковий мозок. Це — чорний день для всього людства."

bos_nf_tca_conquest_of_the_alaskan_pipeline: "Захоплення Аляскинського Нафтопроводу"
bos_nf_tca_conquest_of_the_alaskan_pipeline_desc: "Ескадрон Lance закріпив за собою стратегічні точки Аляскинського трубопроводу. Утримання цих об’єктів не дозволить злочинним угрупованням отримати над ними контроль!"

bos_nf_long_range_communications_taggerdys_expedition: "Грім Таґгерді"
bos_nf_long_range_communications_taggerdys_expedition_desc: "§g\"..§YПозначення;§! Грім Таґгерді, також відомий як Аппалачійська Експедиція або Аппалачійське Братство Сталі.\n§YОпис;§! Один із перших осередків, сформований із підрозділу рейнджерів Армії США, з яким наш Засновник встановив контакт після Великої Війни. Ми неодноразово намагалися надіслати підкріплення до Аппалачів — але звісток про їхній стан не надходило.\n§YПримітки писарів;§! Дивна справа. Чи маємо ми ще якісь згадки про них? Мені потрібно дістати розшифровки бесід Засновника з Таґгерді. Частина мене сумнівається, що цей осередок взагалі існував.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_bap_conflict_in_the_chapter: "Конфлікт в Відділу"
bos_nf_bap_conflict_in_the_chapter_desc: "До нас надходять перші звіти про те, що певний період Аппалачійський осередок Братства Сталі перебував у стані... громадянського конфлікту? Необхідно доручити писарям з'ясувати істину."

bos_nf_bap_an_early_super_mutant_threat: "Рання Загроза Супермутантів"
bos_nf_bap_an_early_super_mutant_threat_desc: "Виявилося, що члени Аппалачійського осередку тривалий час протистояли загрозі супермутантів. Особливість цієї загрози в тому, що вони передували мутантам з Армії Майстра."

bos_nf_long_range_communications_mojave_chapter: "Відділ Мохаве"
bos_nf_long_range_communications_mojave_chapter_desc: "§g\"..§YПозначення;§! Відділ Мохаве\n§YОпис;§! Очолюваний Старійшиною Елайджою, Відділ Мохаве мав розширити присутність Братства у регіоні, здобути контроль над Гуверською дамбою та зупинити експансію НКР на схід.\n§YПримітки писарів;§! Один з новітніх осередків, Мохаве був здебільшого споряджений застарілим обладнанням, залишеним після війни з НКР. На думку цього писаря, від самого початку осередок не мав на меті довгострокове існування — Верховний Старійшина, здається, просто шукав спосіб усунути політичний вплив Елайджі в Лост-Гілз, а також створити тимчасовий бар'єр для НКР, поки ми відновлюємо сили на заході.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_moj_elijahs_downfall: "Падіння Елайджі"
bos_nf_moj_elijahs_downfall_desc: "Зрештою, саме Елайджа став причиною краху Відділу Мохаве. Ганебна поразка під час військової операції «Сонячний Спалах» практично стерла осередок з лиця пустки — уцілілі змушені були сховатися глибоко під землею в невідомому місці."

bos_nf_moj_recruiting_mcnamara: "Повернення Макнамари"
bos_nf_moj_recruiting_mcnamara_desc: "Макнамара виявив себе як ключова постать у збереженні місії в Мохаве. Враховуючи його військову майстерність, варто залучити його до справ у Лост-Гілз — подивимось, чого він зможе досягти під належним керівництвом."

bos_nf_moj_victory_at_sunburst: "Перемога у Сонячному Спалаху"
bos_nf_moj_victory_at_sunburst_desc: "Елайджа, схоже, здобув перемогу в битві при Сонячному Спалаху! Йому вдалося не лише перемогти війська НКР, а й узяти під контроль як Гуверську дамбу, так і надзвичайно цінну енергетичну установку — Геліос Один."

bos_nf_study_legionary_tactical_data: "Вивчити Тактичні Дані Легіону"
bos_nf_study_legionary_tactical_data_desc: "Завдяки конфлікту в Мохаве проти Легіону ми отримали вкрай перспективні зразки технологій — їх аналіз може принести стратегічну перевагу!"

bos_nf_moj_elijahs_expeditions: "Експедиції Елайджі"
bos_nf_moj_elijahs_expeditions_desc: "Елайджа дедалі більше дозволяє собі відхилятись від плану експедиції. За свідченнями членів осередку, його увагу привернуло певне казино. Сподіваймося, ця імпровізація не обернеться катастрофою."

bos_nf_long_range_communications_maxson_chapter: "Відділ Максона"
bos_nf_long_range_communications_maxson_chapter_desc: "§g\"..§YПозначення;§! Відділ Максона\n§YОпис;§! Заснований після виявлення довоєнного бункера губернатора в Колорадо. Відділ мав на меті здобути всі доступні технології й креслення з цього об'єкта, а також з роботизованого заводу в Денвері й Сховища-0..\n§YПримітки писарів;§! Цей осередок залишається своєрідною загадкою. Він так і не отримав повного оснащення для виконання своєї місії — лише третину від того, що запитували паладини. Можливо, його справжнім призначенням було утримання Бункера Максона до прибуття Технологічних Рятівників Людства?.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_maxsons_end: "Кінець Максона"
bos_nf_maxsons_end_desc: "Схоже, що Бункер Максона таки впав. Прикро — якби його обороняли ми, а не Старійшина Брикслі, він міг би протриматися значно довше."

bos_nf_maxson_victorious: "Бункер Утримано"
bos_nf_maxson_victorious_desc: "Після розгрому когорт Ланія та Псів з Денвера, Відділ Максона отримав унікальну можливість стати ключовим чинником у Колорадо!"

bos_nf_mxc_denvers_treasures: "Скарби Денвера"
bos_nf_mxc_denvers_treasures_desc: "Денвер — джерело цінного технолому, який ідеально підійде для нашого осередку. Повна зачистка та евакуація знахідок триватиме роками."

bos_nf_eastern_legionary_tactical_data: "Тактичні Дані Східного Легіону"
bos_nf_eastern_legionary_tactical_data_desc: "До нас надходять повідомлення про конфлікти Легіону на сході та їхнього безжального провідника. Ці дані можуть стати вирішальними у підготовці до можливого зіткнення."

bos_nf_long_range_communications_texas_expedition: "Техаська Експедиція"
bos_nf_long_range_communications_texas_expedition_desc: "§g\"..§YПозначення;§! Техаська Експедиція\n§YОпис;§! Техаська Експедиція отримала завдання після поразки Майстра — знайти й нейтралізувати генерала Аттіса.\n§YПримітки писарів;§! Експедицію очолював Ромбус, який добровільно погодився на неї після конфліктів із Радою. Дехто стверджує, що навіть сьогодні ще залишились ті, хто затаїв образу на Ланцюг Підпорядкування та на саме Братство.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_tbh_an_unexpected_end: "Неочікуваний Кінець"
bos_nf_tbh_an_unexpected_end_desc: "Схоже, Братства Сталі в Техасі більше не існує. Таким чином остаточно завершено спадщину Ромбуса у Штаті Одинокої Зірки."

bos_nf_coronate_the_alamo_chapter: "Перехід до Відділу Аламо"
bos_nf_coronate_the_alamo_chapter_desc: "Відділ Аламо є наступником техаського Братства Сталі, сформований після внутрішнього розколу, коли частина цивільних членів осередку відмовилась від Кодексу та присяг. Переслідування їх за зраду коштувало б занадто дорого. Найкраще, що ми можемо зробити зараз — підтримати осередок Аламо й сподіватись, що далася гілка повернеться до Братства."

bos_nf_victory_over_machines: "Перемога Над Машинами"
bos_nf_victory_over_machines_desc: "Відділ Аламо здобув вирішальну перемогу над арміями Санта Анни — давнього лідера з Мексики, якому нібито понад чотириста років... Хм. Це, ймовірно, якась помилка у переданих даних."

bos_nf_texaco_oil_rig: "Нафтовий Ріг Texaco"
bos_nf_texaco_oil_rig_desc: "Відділ Аламо здобув потужний інструмент для роботи з загадковою мережею Посейдон-net — унікальний позивний, який дозволяє видавати себе за американську адміністрацію. Це відкриває доступ до технологій, про існування яких ми й не підозрювали."

bos_nf_long_range_communications_midwest_expedition: "Серединна Експедиція"
bos_nf_long_range_communications_midwest_expedition_desc: "§g\"..§YПозначення;§! Серединне Братство Сталі (раніше — Східне Братство Сталі.)\n§YОпис;§! Серединне Братство — один із найдовговічніших осередків, що діє задля забезпечення контролю над центральними пустками й боротьби з загрозами, які становлять ризик для нашої великої організації.\n§YПримітки писарів;§! На ранніх етапах історії Лост-Гілз від Братства відкололась група паладинів, старійшин та писарів, яка назвала себе Технологічними Рятівниками Людства. Вони вважали, що бачення Мексона помилкове в одному принциповому пункті: що технології слід не лише охороняти, а й використовувати для допомоги нинішнім поколінням. Це хибна ідея, й кожен, хто має сумніви, має ще раз перечитати Кодекс.\nПопри це, Серединне Братство має гідну історію — воно стало одним із найпомітніших осередків у нашій спільній спадщині.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_ending_the_dream: "Серце Америки"
bos_nf_ending_the_dream_desc: "Попри всі наші зусилля, перемогу здобула група, що зветься Чиказьким Анклавом. Серединні території тепер опинилися під контролем нової темної епохи — епохи, зробленої ще зловіснішою та, можливо, ще краще захищеною спотвореним блиском науки."

bos_nf_bmw_midwest_enclave_tactical_experience: "Тактичний Досвід із Анклавом"
bos_nf_bmw_midwest_enclave_tactical_experience_desc: "Зіткнення Серединного Відділу з Анклавом дало нам цінну інформацію. Спробуймо її ретельно проаналізувати."

bos_nf_chicagos_reclaimation: "Повернення Чикаго"
bos_nf_chicagos_reclaimation_desc: "Місто Чикаго повернено! Вирване з рук Секретаря Внутрішніх Справ, тепер ці самовдоволені правителі 'столиці' служать нам..."

bos_nf_the_secrataries_secrets: "Таємниці Секретаря"
bos_nf_the_secrataries_secrets_desc: "У своїх сховищах даних Секретар зберігав важливі технологічні знання. Вони стануть нам у пригоді."

bos_nf_long_range_communications_gulf_expedition: "Гольфська Експедиція"
bos_nf_long_range_communications_gulf_expedition_desc: "§g\"..§YПозначення;§! Гольфське Братство Сталі\n§YОпис;§! За незначними контактами з експедицією Лайонза, ми дізналися, що Гольфське Братство бере початок із Серединного осередку. Їхньою метою є пошук об'єкта, відомого як Джерело Снів — вежі, здатної створювати природну альтернативу до Рад-Авей.\n§YПримітки писарів;§! Налагодити контакт із цим осередком варто якомога швидше — ми знаємо про них неприпустимо мало..\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_bgf_run_down: "Знищені"
bos_nf_bgf_run_down_desc: "Ні! Гольфська Експедиція повністю знищена! Її залишки були змушені відступити на захід або сховатися глибоко під землею, уникаючи помсти Родини ДеСото."

bos_nf_bgf_dominion_over_the_peninsula: "Домінування Над Півостровом"
bos_nf_bgf_dominion_over_the_peninsula_desc: "Гольфське Братство оголосило про свою перемогу в Еверглейдсі, а отже — й контроль над усім півостровом!"

bos_nf_bgf_desoto_drug_trade: "Наркоторгівля Родини ДеСото"
bos_nf_bgf_desoto_drug_trade_desc: "Родина ДеСото — невелика злочинна структура поблизу Тампи — роками брала участь у прибутковій наркоторгівлі. Гольфське Братство виявило в їхньому укріпленні величезні обсяги матеріальних цінностей."

bos_nf_bgf_the_fountain_of_dreams: "Джерело Снів"
bos_nf_bgf_the_fountain_of_dreams_desc: "Так зване Джерело Снів — це природний шпиль у Флоридських Еверглейдс, із якого б'є потік «Сноводи» — потужного природного антимутагену."

bos_nf_long_range_communications_san_fran_chapter: "Відділ Сан-Франциско"
bos_nf_long_range_communications_san_fran_chapter_desc: "§g\"..§YПозначення;§! Відділ Сан-Франциско\n§YОпис;§! Один із давніших осередків. Імператор Ши дозволив нам створити дослідницьку станцію у межах їхнього міста. Повноваження осередку обмежені, проте ця база є цінною для вивчення як довоєнних технологій, так і розробок учених Ши.\n§YПримітки писарів;§! Через могутню владу Ши ми не могли просто увійти до Сан-Франциско без підтримки Імператора. Це нетипова співпраця, але історія показала її ефективність — зокрема, у справі досліджень нафтової платформи Посейдон.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_shi_contact_the_bunkers: "Зв’язок із Бункерами"
bos_nf_shi_contact_the_bunkers_desc: "Від часу укладення перемир’я з НКР ми не перевіряли ситуацію в осередку Сан-Франциско. Пора дізнатися, як вони тримаються."

bos_nf_shi_the_chapters_unexpected_growth: "Неочікуване Зростання Відділу"
bos_nf_shi_the_chapters_unexpected_growth_desc: "Після розпаду бойових угруповань у Сан-Франциско місто опинилося в хаосі. Імператор Ши звернувся до місцевого Братства по допомогу у відновленні порядку.\nЗвісно ж, наші брати прийняли цей заклик — і фактично перебрали контроль над містом."

bos_nf_shi_the_emperors_blessing: "Благословення Імператора"
bos_nf_shi_the_emperors_blessing_desc: "Відділ у Сан-Франциско активно співпрацює з поселенцями Ши й прагне зміцнити добрі стосунки з Братством. Якщо ми побажаємо, один із наших старійшин може бути благословенний самим Імператором."

bos_nf_long_range_communications_guardian_brotherhood: "Братство-Хранителі"
bos_nf_long_range_communications_guardian_brotherhood_desc: "§g\"..§YПозначення;§! Братство-Хранителі* (Примітка писаря: Писарка Анна близько 2195 року, у межах 7-ї гілки, вперше використала цю назву — але я не впевнений, звідки вона її взяла. Можливо, це було припущення.)\n§YОпис;§! Один із найстаріших осередків — Хранителі...\n§YПримітки писарів;§! Потребую дозволу Верховного Старійшини на доступ до архівів заснування, бо інформації про Хранителів практично немає. Є кілька згадок про конфлікти навколо поховальних прав часів виходу з Маріпоси, але події до, під час і після їхнього прибуття у Світіння майже повністю втрачені. Мабуть, попередні писарі були такими ж розчарованими, як і я.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_grd_guardians_failed: "Запізно до Пострілу"
bos_nf_grd_guardians_failed_desc: "З падінням Хранителів завершилась і їхня невдала місія. Можливо, якби вони залишилися з нами, цієї долі вдалося б уникнути?"

bos_nf_grd_guardians_successful: "Невада Врятована"
bos_nf_grd_guardians_successful_desc: "Хранителі, у, мабуть, найвизначнішому моменті існування свого занедбаного осередку, здобули одну з найбільших перемог за останнє століття — перемогли своїх суперників у Неваді й взяли під контроль більшість долини Есмеральда."

bos_nf_grd_reach_out_to_the_guardians: "Вийти на Зв’язок з Хранителями"
bos_nf_grd_reach_out_to_the_guardians_desc: "Настав час — нехай і неохоче — визнати здобутки Хранителів. Якщо ми проявимо гнучкість і підемо на певні поступки, можливо, вдасться повернути їх під прапори Лост-Гілз."

bos_nf_grd_wonders_of_tv_town: "Дива Телемістечка"
bos_nf_grd_wonders_of_tv_town_desc: "Телемістечко — химерне, загадкове поселення, повністю заселене андроїдами. Ймовірно, модифіковані варіації Ассалтронів? Машини діяли як люди, але мали одну ключову відмінність:\nУ них не було співчуття."

bos_nf_long_range_communications_the_lyons_expedition: "Експедиція Лайонза"
bos_nf_long_range_communications_the_lyons_expedition_desc: "Місія Старійшини Лайонза була простою: відновити зв’язок зі східними осередками, з’ясувати правду про активність супермутантів у Вашингтоні та повернути столицю США під контроль Братства."

bos_nf_bls_shephards_conquest: "Завоювання Шепарда"
bos_nf_bls_shephards_conquest_desc: "Чутки про супермутантів виявилися правдивими — угруповання на чолі з мутантом на ім’я Шепард захопило Вашингтон! Солдати Лайонза були змушені піти у підпілля."

bos_nf_bls_outcasts_travel_to_the_pit: "Вигнанці Прямують до Пітта"
bos_nf_bls_outcasts_travel_to_the_pit_desc: "Після падіння Вигнанців вони звернулися по допомогу до інших. Ішмаель Ашур, колишній член Братства, дозволив їм оселитися в місті, відомому як Пітт."

bos_nf_bls_eastern_mutant_tactical_experience: "Тактичний Досвід Проти Східних Мутантів"
bos_nf_bls_eastern_mutant_tactical_experience_desc: "Завдяки перемозі Лайонза над Шепардом ми отримали додатковий досвід у боротьбі зі східними мутантами. Схоже, там доволі часто з’являються супермутанти-гіганти, розмірами з бойову машину."

bos_nf_bls_edens_victory: "Перемога Ідена"
bos_nf_bls_edens_victory_desc: "Особистість на ім’я Джон Генрі Іден, який проголошує себе президентом Сполучених Штатів, здобула перемогу на сході. Чи досі Анклав активний у цьому регіоні?"

bos_nf_bls_lyons_libery_prime_archives: "Архіви «Свободи-Прайм»"
bos_nf_bls_lyons_libery_prime_archives_desc: "На сході експедиція Лайонза працює над рідкісним зразком технології — проектом «Свобода-Прайм». Вони запропонували поділитися з нами кресленнями, виявленими під час досліджень."

bos_nf_bls_the_anchorage_simulation: "Симуляція Анкориджу"
bos_nf_bls_the_anchorage_simulation_desc: "Кілька Вигнанців натрапили на надзвичайно реалістичну цифрову симуляцію — історичне відтворення битви за Анкоридж. Вони передали нам транскрипти, які проливають світло на те, як діяли довоєнні системи озброєння."

bos_nf_bls_lyons_project_purity: "Проєкт «Чистота»"
bos_nf_bls_lyons_project_purity_desc: "Проєкт «Чистота» — один із найбільших інженерних проєктів після війни: спроба очистити мільйони галонів води в припливному басейні поблизу столиці. Лише в останні роки проєкт почав діяти на повну потужність."

bos_nf_bls_eastern_enclave_tactical_experience: "Тактичний Досвід Проти Східного Анклаву"
bos_nf_bls_eastern_enclave_tactical_experience_desc: "Битви Східного Братства проти Анклаву надали нам додаткові знання про тактику ворога й засоби протидії."

bos_nf_bls_dominion_over_dc: "Домінування над Столицею"
bos_nf_bls_dominion_over_dc_desc: "Братство практично завершило місію в Вашингтоні. Тепер вони зосереджуються на новому завданні: дослідити тривожні сигнали з Співдружності Массачусетсу. Вони вирушають на північ — дізнатися, що коїться в Бостоні."

bos_nf_bls_outcasts_triumphant: "Тріумф Вигнанців"
bos_nf_bls_outcasts_triumphant_desc: "Фракція, відома як Вигнанці, повністю перебрала контроль над експедицією Лайонза. Під керівництвом Паладина Касдіна, Східне Братство прагне виконати місію, залишаючись вірним Кодексу."

bos_nf_bls_sarahs_rise: "Сходження Сари"
bos_nf_bls_sarahs_rise_desc: "Сара Лайонз, донька покійного Старійшини Лайонза, стала новим лідером Східного Братства. Вона прагне вести його вперед, не обмежуючись баченням, залишеним батьком."

bos_nf_bls_the_hero_of_man: "Герой Людства"
bos_nf_bls_the_hero_of_man_desc: "Відправити Артура на схід було правильним рішенням. Він зумів зцілити розкол між Вигнанцями та Східним Братством, об’єднавши їх у єдину силу. Вони прагнуть стати повноцінним осередком Братства — не гіршим за інші."

bos_nf_bls_victory_in_the_commonwealth: "Перемога в Співдружності"
bos_nf_bls_victory_in_the_commonwealth_desc: "Тостери з Інституту знищено. Загроза синтів ліквідована — людство врятовано."

bos_nf_bls_mankind_redefined: "Людство Перетворене"
bos_nf_bls_mankind_redefined_desc: "Східна експедиція завершилась крахом. Темні сили Співдружності завдали удару, який Братство не витримало."

bos_nf_long_range_communications_montana_chapter: "Відділ Монтани"
bos_nf_long_range_communications_montana_chapter_desc: "§g\"..§YПозначення;§! Відділ Монтани\n§YОпис;§! Відділ Монтани, на щастя, надіслав нам коротке повідомлення з поясненням своєї мети. Вони — відгалуження Серединного Братства Сталі, направлені для здобуття технологій у регіоні Монтани.\n§YПримітки писарів;§! Старійшина Патроколус налаштований співпрацювати з нами, що свідчить: осередок потенційно готовий дотримуватися Ланцюга Підпорядкування й визнавати владу Лост-Гілз.\"§! §YВитяг із Лексикону Осередків, 13-та гілка.§!"

bos_nf_mch_the_expeditions_end: "Кінець Експедиції"
bos_nf_mch_the_expeditions_end_desc: "Яка трагедія! Відділ Монтани практично знищено підступними й безжальними прихильниками Анклаву."

bos_nf_mch_western_enclave_tactical_experience: "Тактичний Досвід Проти Західного Анклаву"
bos_nf_mch_western_enclave_tactical_experience_desc: "Невеликій кількості вцілілих з Відділу Монтани вдалося дістатися до нас — разом із ними ми отримали додаткові знання щодо тактики боротьби з Анклавом."

bos_nf_mch_victory_over_mcarthur: "Перемога над Макартуром"
bos_nf_mch_victory_over_mcarthur_desc: "Макартур повалений! Ще один оплот Анклаву знищено. З часом ми повністю витіснимо їх із пустки!"

bos_nf_mch_conquest_of_the_steam: "Захоплення «Пари»"
bos_nf_mch_conquest_of_the_steam_desc: "Відділ Монтани встановив контроль над об'єктом, який вони називають «Пара» — нестабільним, але потужним реактором, розташованим глибоко в Айдахо."

bos_nf_mch_conquest_of_yellowstone: "Захоплення Єллоустоуну"
bos_nf_mch_conquest_of_yellowstone_desc: "У надрах Єллоустоуну Відділ Монтани виявив інформацію, що стосується компанії Greenway Hydroponics та Агентства з охорони довкілля. Корисні дані!"

bos_nf_integrating_chapters: "Інтеграція Осередків"
bos_nf_integrating_chapters_desc: "Час настав — Братство достатньо зміцніло, аби простягнути руку і взяти прямий контроль над розпорошеними осередками. Як кажуть на сході? Ах так. Ad Victoriam!"

bos_nf_integrating_mxc: "Інтеграція Максона"
bos_nf_integrating_mxc_desc: "Аванпости Відділу Максона в Скелястих Горах з'єднають нас зі сходом. Ми шануємо доблесть [MXC.GetLeader], але їхнє вартування завершено."

bos_nf_integrating_bmw: "Інтеграція Серединного Відділу"
bos_nf_integrating_bmw_desc: "Серединне Братство протягом десятиліть було найуспішнішим. Проте настав час повернутися до джерела."

bos_nf_integrating_bgf: "Інтеграція Гольфу"
bos_nf_integrating_bgf_desc: "Сподіваємось, прямий нагляд утримає паладинів від відвідування парків розваг у вільний час."

bos_nf_integrating_bap: "Інтеграція Аппалачів"
bos_nf_integrating_bap_desc: "Вони вже надто довго блукають тими гірськими дорогами. Настав час повернути їх додому."

bos_nf_integrating_bls: "Інтеграція Сходу"
bos_nf_integrating_bls_desc: "Проєкт «Чистота» врятує безліч життів. Мешканці пустки будуть вдячні нам протягом століть."

bos_nf_integrating_moj: "Інтеграція Мохаве"
bos_nf_integrating_moj_desc: "Не хочеться це визнавати, але Елайджа справді довів свою ефективність у Мохаве."

bos_nf_integrating_shi: "Інтеграція Сан-Франциско"
bos_nf_integrating_shi_desc: "Ресурси Імператора вже в полі нашого зору. І з контролем над Сан-Франциско ми справді володарюємо над узбережжям Каліфорнії."

bos_nf_integrating_grd: "Інтеграція Невади"
bos_nf_integrating_grd_desc: "Можливо, вони зуміють нарешті зменшити гучність Шостого Каналу? Реклама засмічує наш ефір."

bos_nf_integrating_wbh: "Інтеграція Вашингтона"
bos_nf_integrating_wbh_desc: "Сподіваємось, вони поділяться з нами тією силовою бронею, яку носять. У T-51b під тим холодом не надто зручно пересуватись."

bos_nf_integrating_mch: "Інтеграція Монтани"
bos_nf_integrating_mch_desc: "Відділ Монтани контролює останні діючі шахти з ядерними ракетами в Америці. Тепер — і ми також."

bos_nf_integrating_ach: "Інтеграція Аламо"
bos_nf_integrating_ach_desc: "Ми не можемо забути Аламо — вони зберегли вірність Кодексу тоді, коли Техас звернув убік східних єресей. Вони охоче приєднаються до нас."

bos_nf_northern_california: "Північ Каліфорнії"
bos_nf_northern_california_desc: "Таємниці Наварро — лише частина того, що приховує північ. Настав час узяти з цього краю все, що нам потрібно."

bos_nf_baja_california: "Братство в Нижній Каліфорнії"
bos_nf_baja_california_desc: "Хоча Баха має небагато ресурсів, її рейдери можуть одного дня стати загрозою. Краще розчавити це зараз."

bos_nf_the_mojave: "Назад до Мохаве"
bos_nf_the_mojave_desc: "Таємниці Геліоса Один, дамби, самого Вегаса — ось чому ми відправили осередок у Мохаве. Їхня невдача — лише незначна затримка у нашій праведній меті."

bos_nf_oregon: "Загроза в Орегоні"
bos_nf_oregon_desc: "Орегон під гнітом дикої сили, яка загрожує спалити всю Каліфорнію. Ми не дозволимо цьому статися."

bos_nf_broken_coast: "На Північ Узбережжям"
bos_nf_broken_coast_desc: "Пірати Зламаного Узбережжя перекривають нам шлях до багатств Аляски. Ми маємо щось з цим зробити."

bos_nf_nevada: "Оберт Велике Коло"
bos_nf_nevada_desc: "Велике Коло завжди належало нам."

bos_nf_the_northwest: "Проломити Великий Щит"
bos_nf_the_northwest_desc: "Єллоустоун не вибухне лише тому, що ми пройдемося ним маршем... так?"

bos_nf_colorado: "Завоювання Колорадо"
bos_nf_colorado_desc: "Таємниці Купола Боулдера не повинні залишитися в руках дикунів. Ми маємо здобути його для себе."

bos_nf_arizona: "Анексія Аризони"
bos_nf_arizona_desc: "Попри посушливі простори, Аризона має дещо цінне. Можливо, у Блумфілді є щось варте уваги?"

bos_nf_greater_texas: "Пограймося з Техасом"
bos_nf_greater_texas_desc: "Г’юстон — лише одна з багатьох принад сходу."

bos_nf_oklahoma: "Все ОК в Оклахомі"
bos_nf_oklahoma_desc: "Тут відверто небагато цінного. Але ж не може весь штат складатися лише з кукурудзи? Можливо, Секвойя щось приховує."

bos_nf_mexico: "Мексиканське Потворство"
bos_nf_mexico_desc: "Останнє божество Старого Світу померло. І тепер ми нарешті можемо вирушити на пошуки його тіла."

bos_nf_the_midwest: "Завоювання Чикаго"
bos_nf_the_midwest_desc: "Час прийшов — ми маємо взяти Чикаго, що належить нам за правом, і покінчити з Анклавом остаточно!"

bos_nf_the_gulf_coast: "Захоплення Гольфського Узбережжя"
bos_nf_the_gulf_coast_desc: "У глибинах Еверглейдсу є ліки від мутації. Серединна експедиція зазнала поразки — але ми її не повторимо."

bos_nf_the_carribbean: "Консолідація Карибів"
bos_nf_the_carribbean_desc: "Якщо бути відвертими — ми захоплюємо ці території лише заради гарного курорту. Місце на шезлонгу можна зайняти рушником!"

bos_nf_appalachia: "Знищення Аппалачів"
bos_nf_appalachia_desc: "MODUS зайшов надто далеко! Він і його прибічники знищили перший Відділ Братства після оригінального, і тепер знущаються з нього як з пародії. Ми помстимося за загиблих братів."

bos_nf_the_east_coast: "Кінець Східного Узбережжя"
bos_nf_the_east_coast_desc: "Пентагон, Нью-Йорк, Інститут — усе це належить Братству. Саме ці люди, зрештою, зруйнували світ."

bos_nf_purpose_fulfilled: "Ad Victoriam"
bos_nf_purpose_fulfilled_desc: "Мексон мав мрію. Мрію про те, що Братство, пройшовши крізь випробування, стане будівничим завтрашнього світу, захищаючи спадщину минулого. Якби він побачив нас сьогодні, то був би гордий за те, чого ми досягли.\nAd Victoriam! За Братство!"

coming_in_a_later_update_bos: "§gСтарійшино! Наші паладини були занадто зайняті війною з НКР, щоб встигнути підготуватися. Дайте їм трохи часу — і вони представлять свій план.§!"

srg_california_peace_accords: "Каліфорнійські Мирні Угоди"
srg_california_peace_accords_desc: "Ратифіковано!\nЗасвідчено!\nДля Ллуїда це — найвища мета, на яку він тільки міг сподіватись: шанс закарбувати своє ім’я в історії як одного з найвеличніших старійшин Лост-Гілз — того, хто втілив мрію Мексона про справжнє суспільство, здатне пережити бурі наступного тисячоліття."

srg_seek_amnesty: "Домогтися Амністії"
srg_seek_amnesty_desc: "Чимало вояків під час війни з НКР воювали задля захисту Кодексу. Проте НКР наполягає на притягненні деяких із них до Трибуналу за військові злочини. Можливо, ми зможемо переконати Республіку відмовитися від покарання?"

srg_tribunal_for_war_crimes: "Трибунал за Військові Злочини"
srg_tribunal_for_war_crimes_desc: "Що?.. ЦІ паладини зробили ЩО!?\nКоли б Ллуїд не був підпорядкований законам НКР, він стратив би цих вояків на місці за таке порушення Ланцюга Підпорядкування. Найкраще буде — відправити їх до Шейді-Сендс на суд."

srg_california_tech_sharing_initiative: "Програма Технологічного Обміну з Каліфорнією"
srg_california_tech_sharing_initiative_desc: "Тепер, коли ми діємо разом із НКР, ми погодилися поступово передавати їм технології, які зберігалися в Лост-Гілз. Звісно, все відбуватиметься згідно з положеннями Кодексу — хай і в межах правового поля НКР. Процес буде повільним, стабільним і ретельно контрольованим. Ми не маємо права допустити помилок, які знову приведуть світ до загибелі."

srg_maxson_city: "Місто Мексона"
srg_maxson_city_desc: "Назване на честь легендарного засновника Братства Сталі, Мексон об’єднує родини, що поколіннями були пов’язані з Братством. Коли місто було передано під спільну юрисдикцію Сталевих Рейнджерів, це нагадало велике родинне зібрання."

srg_paladin_pizza_parlors: "«Піца-Паладин»"
srg_paladin_pizza_parlors_desc: "Нове спільне управління Мексоном надихнуло місцевий бізнес на тематичний ребрендинг. «Крамниці Братства», «Піца-Паладин», «Лицарські Дитсадки» — це все виглядає трохи безглуздо, але прибуток іде вгору!"

srg_ncr_war_reparations: "Репарації Постраждалим"
srg_ncr_war_reparations_desc: "Не кожна родина в Мексоні дивиться на Братство з теплотою. Багато з них — це рідні тих, хто постраждав у війнах із нами. Ми повинні дати їм те, на що вони заслуговують."

srg_retirement_for_military_veterans: "Масове Відставлення"
srg_retirement_for_military_veterans_desc: "Як і стародавні спартанці, що втрачали військову гідність у мирному Афіні, багато братських солдатів, побачивши, як зникає завіса між НКР і Братством, просто відмовилися від своїх обов'язків. Кодекс поступово відходить на другий план у їхньому житті. Вони заслужили відпочинок."

srg_new_military_stratagem: "Нова Військова Доктрина"
srg_new_military_stratagem_desc: "Боротьба пліч-о-пліч з НКР, замість протистояння — виклик для нової адміністрації. Та Ллуїд упевнений: із часом це принесе плоди."

srg_armed_patrols: "Озброєні Патрулі"
srg_armed_patrols_desc: "Мексон не був таким безпечним роками. Паладини патрулюють узбережжя Каліфорнії, полюючи на рейдерів і незаконні племена, що оселились на державній землі."

srg_peace_under_the_republic: "Мир під Республікою"
srg_peace_under_the_republic_desc: "Хіба не приємно жити без постійної загрози над головою?"

srg_commemorate_roger_maxson_statue: "Роджер Мексон — Герой"
srg_commemorate_roger_maxson_statue_desc: "З часом ідея Ллуїда про спільне управління покаже свою силу. Братство відкриє переваги державної структури НКР, а сама Республіка визнає мудрість і спадщину засновника Братства. Ллуїда точно згадають як архітектора цього союзу."

srg_dismantle_bunker_destruction_device: "Деактивація Пристрою Самознищення Бункера"
srg_dismantle_bunker_destruction_device_desc: "Нам це більше не потрібно. Краще демонтувати — перш ніж комусь спаде на думку принести себе в жертву за минуле."

srg_nuclear_weapons_studies: "Дослідження Ядерної Зброї"
srg_nuclear_weapons_studies_desc: "Ми й НКР повинні спільно осягнути значення й тягар зброї, яка знищила світ."

srg_dismantle_lost_hills_bunker: "Демонтаж Бункера Лост-Гілз"
srg_dismantle_lost_hills_bunker_desc: "Потрібно почати перехідний процес. Щоб він вдався, повернення до старого способу життя має стати неможливим. Це займе десятиліття, але розбирання Лост-Гілз має розпочатись вже сьогодні."

srg_ncr_draft: "Призов НКР"
srg_ncr_draft_desc: "Ми завоювали серця й розум людей — тепер маємо їх захистити. Новобранці, які патрулюватимуть регіон, зміцнять безпеку й патріотизм. Вони служитимуть не лише нам — а й собі."

srg_introducing_trade: "Підвищення Податків"
srg_introducing_trade_desc: "Щоб фінансувати операції в штаті, нам потрібні кошти — а гроші не падають з неба. Доведеться брати з кишень місцевих. Та з тією довірою, яку ми вже здобули, навряд чи хтось буде проти..."

srg_creating_defense_militia: "Нові Військові Стандарти"
srg_creating_defense_militia_desc: "З нашим прибуттям у регіон нам доручено встановити нові стандарти: уніформа, зброя, організація. Наші війська мають стояти нарівні з армією Каліфорнії."

srg_light_of_civilisation: "Заміна Політиків"
srg_light_of_civilisation_desc: "Деякі наші колишні лідери не відповідають новим цінностям Каліфорнії. Їх слід спонукати до відставки — й обрати на місце тих, хто справді лояльний."

srg_new_industry: "Каліфорнійський Промисловий Прогрес"
srg_new_industry_desc: "Ми тепер частина НКР, а отже маємо впроваджувати їхні високі стандарти будівництва."

srg_embracing_the_future: "Запросити Інженерів НКР"
srg_embracing_the_future_desc: "Хоча в них і немає наших технічних креслень, інженери НКР мають свої унікальні прийоми."



bos_underground_construction_decisions:0 "Підземне Управління Лост-Гілз"
bos_underground_construction_decisions_desc:0 "Максимально доступна площа: [?BOS_space_usage]/[?BOS_space]\nДоступні будівельні комірки: [?BOS_underground_construction_slots] \nАдміністративна спроможність: [?modifier@bos_administration_capacity_usage]/[?modifier@BOS_underground_administrative_capacity]\nСтислі підземні майстерні: [?BOS_condensed_civilian_workshop]/[?BOS_maximum_condensed_workshops_allowed]\nПідземні адміністративні центри: [?BOS_underground_building_administration_centers]/[?BOS_maximum_admin_centers_allowed]\nВідділи підземної безпеки: [?BOS_underground_building_safety_department]/[?BOS_maximum_safety_departments_allowed]\nПідземні лабораторії: [?BOS_underground_building_lab]/[?BOS_maximum_labs_allowed] \nПідземні тренувальні комплекси: [?BOS_underground_building_training]/[?BOS_maximum_training_facilities_allowed]\nПідрозділи підземних експедицій: [?BOS.BOS_expeditionary_departments]/[?BOS.BOS_maximum_expeditionary_departments_allowed]"

