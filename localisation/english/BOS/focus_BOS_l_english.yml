  bos_lost_hills_diplomacy_establish_foreign_airbases_unlock_tt: "Відкриває §Yповторювані рішення§!, щоб наші §YКоманди Писарів§! будували передові авіабази на території кожного ордену, збільшуючи ліміт добровольців і покращуючи вплив наших ВПС в орденах за кордоном, якщо це ще не доступно."
  bos_lost_hills_diplomacy_establish_foreign_airbase: "Створити авіабазу Братства в §Y[FROM.Capital.GetName]§!."
  bos_lost_hills_diplomacy_establish_foreign_airbase_desc: "Ми працюємо з §Y[FROM.GetName]§!, щоб забезпечити довготривалу присутність Братства в §Y[FROM.Capital.GetName]§!, включаючи охоронюваний транзитний коридор до і з §Y[ROOT.Capital.GetName]§!. Наші писарі та учні будуть розміщені за кордоном, а регулярні рейси сприятимуть торгівлі, поштовому зв'язку та пасажирським перевезенням. Ми станемо ближчими один до одного, ніж будь-коли раніше."
  bos_foreign_airbase_building_tt: "Ми зв'яжемося з §Y[FROM.GetName]§!, щоб побудувати авіабазу для наших спільних операцій у §Y[FROM.Capital.GetName]§!."

