  ##temp spirit from help mxc
  bos_help_mxc: "Понтонні мости для [MXC.getName]"
  bos_help_mxc_desc: "§WМи надішлемо Паладинів як авангард для переправи через річки. Польові писарі прокладуть понтонні мости, щоб [MXC.getName] могли переправитися після того, як Паладини зачистять територію. Якщо Орден зазнає §Rпоразки§!, наші Паладини §Rнавряд чи виживуть. §!§! Примітка: Ваші паладини не є експедиційними силами і не будуть битися на передовій, але ви вже можете надсилати добровольців до [MXC.getName]."
  bos_mxc_advice: "Переправи Паладинів"
  bos_mxc_advice_desc: "Лост-Гіллз надіслав кількох своїх Паладинів як авангард для переправ через річки. Слідом за ними йдуть польові писарі, що прокладають понтонні мости для переправи своїх союзників. [MXC.getName] буде набагато легше перетнути береги річок Колорадо."
  ##Troika decisions
  bos_lost_hills_troika_our_cruelty_elders: "Пропозиція для §R[FROM.GetLeader]§!"
  bos_lost_hills_troika_our_cruelty_elders_desc: "Ми пропонуємо §YОдкровення§!, оголену правду §YСвіту-Брехні§!. З нашим §OСкарбом§! §R[FROM.GetLeader]§! зможе звільнитися, відкинути свої §Yпаскальбайти§! та переписати їх. Після цього він допоможе Людству створити §Yвелику бурю.§! "
  bos_leader_enhancement_tt: "Для Старійшини ордену буде обрано §Pаугментацію§!, якщо він прийме нашу пропозицію. §gЯкщо ми ще не завершили §OВелику бурю§!, їхній орден може отримати додаткові переваги, коли ми це зробимо.§!"
  bos_crowns_math_tt: "§OСкарби: $RIGHT|+=1$§!\n§gСкарби — це спеціальні імплантати, створені й удосконалені ціною смертей сотень чи тисяч людей. Їх дарують іншим лідерам Орденів, щоб ті могли легко збагнути істину в Апокрифах Трійки. Вам потрібно завершити §Y«Ріки стануть червоними»§!, щоб скористатися ними.§!"
#   bos_crowns: "Має §Y1§! доступний §OСкарб§!. §g(Зараз [?bos_troika_crowns])§!"
  troika_cruelty_target: "§RЕксперименти у [FROM.getName]§!"
  troika_cruelty_target_desc: "§RРозривай. §!§RРіж живцем. §!§cВитягуй.§! З десятків напівсліпих, які нездатні відкинути свої §Yпаскальбайти§!, але достатньо зрячі, щоб відчувати їх, ми заберемо сутність і свідомість. Ми створимо §Yвеликий скарб§!, щоб наші обрані змогли побачити те, що за межами §YСвіту-Брехні!§!"
  ##end decisions loc
  coming_in_a_later_update_bos: "§gСтарійшино! Наші паладини були занадто зайняті війною з НКР, щоб встигнути підготуватися. Дайте їм трохи часу – і вони представлять свій план.§!"
  coming_in_a_later_update_srg: "§gСтарійшино! Наші Писарі були занадто зайняті організацією Максона, щоб встигнути підготувати це вчасно. Дамо їм трохи часу на підготовку плану щодо цього?§!"
