  bos_mercenary_work_desc: "Виконання послуг для місцевих жителів може принести нам кришки в нагороду, коли ми зачищатимемо околиці міст від рейдерів, гнізд велетенських мурах і болотників. §YЗі зростанням напруженості винагорода в кришках зменшуватиметься, оскільки мери міст НКР будуть змушені дотримуватися офіційного курсу.§! Тим не менш, це може стати значним поштовхом для нашої торгівлі з чужинцями.\n §YЦе принесе нам 35.00k кришок, зі зменшенням через напруженість. При напруженості 25 ми отримаємо 26.25k кришок, і так далі.§! "
  ##modded end  ##Can't move that ^ text as the Spellcheck gets mad at 35.00k and 26.25k

