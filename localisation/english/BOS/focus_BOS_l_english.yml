  bos_all_to_war_tt: "Будь-який Орден Братства в Реєстрі отримає §Yтимчасовий бонус§! на 2 роки після завершення фокусу §Y«Кінець перемир'я»§!, а саме:"
  bos_all_to_war_tt_bonus: "§GПодвоює§! кількість добровольців, яких інші ордени зможуть тимчасово надіслати вам, коли ви завершите фокус §Y«Кінець перемир'я»§!."
  
  bos_nf_a_chance_opportunity: "Неочікувана можливість"
  bos_nf_a_chance_opportunity_desc: "Ми очікували краху Республіки, але не настільки швидкого. Ситуація стрімко погіршується – і все більше виглядає доцільним завершити перемир’я раніше, ніж планувалося."

  bos_nf_a_guarantee_of_safety_for_maxson: "Гарантії безпеки для Мексона"
  bos_nf_a_guarantee_of_safety_for_maxson_desc: "Жителі Мексона звикли платити податки байдужому уряду в Шейді-Сендс. Віддавати частину Братству – те саме. Якщо ми пообіцяємо не розривати перемир’я без попередження – забезпечимо їхню підтримку в довгостроковій перспективі."

  bos_nf_the_right_war_at_the_right_time: "Правильна війна в належний час"
  bos_nf_the_right_war_at_the_right_time_desc: "Якщо ми вирішимо завершити перемир’я, слід зробити це правильно: після підготовки, за наявності планів дій та після попередження місцевих – аби уникнути зайвих жертв серед цивільних."
  
  bos_costs_20_for_intellectuals_tt:0 "Цей фокус коштує §H20§! £army_experience для §YКультистів§!."
  bos_costs_40_for_ruler_and_elites_tt:0 "Цей фокус коштує §H40§! £army_experience для §YРомбіанців та Максоніанців§!."
  bos_costs_80_for_people_tt:0 "Цей фокус коштує §H80§! £army_experience для §YРеформаторів§!."
  bos_has_completed_focus_bos_nf_work_twice_as_hard_bypassing_the_cost_tt:0 "Завершення фокусу §Y«$bos_nf_work_twice_as_hard$»§! робить вартість цього фокусу §H0§! £army_experience ."
  bos_nf_the_right_war_at_the_right_time_costs_0:0 "Змінює вартість фокусу §Y«$bos_nf_the_right_war_at_the_right_time$»§! на §H0§! £army_experience ."

  bos_nf_warning_maxsons_settlers: "Попередити поселенців Мексона"
  bos_nf_warning_maxsons_settlers_desc: "Ці мешканці тривалий час ставились до нас з повагою. Попередивши їх про майбутній конфлікт, ми зміцнюємо їхню лояльність."

  bos_nf_building_up_a_stockpile: "Формування запасів"
  bos_nf_building_up_a_stockpile_desc: "Одна з головних проблем у війні з НКР – нестача постачання: броні, боєприпасів, пайків. Вичерпні ресурси Каліфорнії більше не можуть покривати всі потреби. Формування запасів – перший крок до повномасштабної підготовки до війни."

  bos_nf_preparing_contingency_plans: "Аварійні протоколи"
  bos_nf_preparing_contingency_plans_desc: "Ми зазвичай тримаємо пристрій самознищення Лост-Гіллз деактивованим. У цих залах зберігаються тисячі архівів, креслень і знань. Та якщо війна неминуча – ми маємо прийняти важке рішення: краще втратити ці знання, ніж дозволити Пустці використати їх проти Братства."

  bos_nf_taking_back_california: "Завершити перемир’я"
  bos_nf_taking_back_california_desc: "Жодне перемир’я не вічне. Паладини, до зброї! Час повернути те, що належить нам. Помстимося за братів, полеглих у першій війні."

  bos_nf_dominion_over_the_wasteland: "Домінування над Пусткою"
  bos_nf_dominion_over_the_wasteland_desc: "Минуло чимало часу з моменту, коли Братство мало керувати настільки великою громадянською популяцією. Нам доведеться ретельно працювати, аби Лост-Гіллз витримав нове навантаження."

  bos_nf_propaganda_campaigns: "Пропагандистські кампанії"
  bos_nf_propaganda_campaigns_desc: "Шейді-Сендс роками зображували нас терористами. Щоб змінити цю спотворену думку, нам доведеться вести активну інформаційну боротьбу."

  bos_nf_creating_civil_administration_sectors: "Адаптація секторів цивільного управління"
  bos_nf_creating_civil_administration_sectors_desc: "Слід визнати, що значна частина політичного апарату НКР може бути переорієнтована на наші власні цілі. Кілька виборних посад старої демократії НКР можна замінити на призначувані верховними старійшинами, але в усьому іншому більшість дрібніших механізмів державного апарату, таких як цивільна поліція, засоби масової інформації та корпус цивільних інженерів, вимагатимуть мінімальних змін."

  bos_nf_rounding_up_criminals: "Зачистка злочинців"
  bos_nf_rounding_up_criminals_desc: "Рейдери, скориставшись війною, намагались проникнути на наші території. Знешкодивши їх, ми не лише покращимо безпеку, а й отримаємо підтримку серед населення."

  bos_nf_the_brotherhood_triumphant: "Тріумф Братства"
  bos_nf_the_brotherhood_triumphant_desc: "Нарешті, проблеми з окупацією колишніх територій НКР тимчасово вирішені. Настав час поглянути в майбутнє великої справи."

  bos_nf_question_of_greater_conscription: "Питання загального призову"
  bos_nf_question_of_greater_conscription_desc: "Частини Братства, що керували великими територіями, часто порушували традиції, рекрутуючи місцеве населення. Нам слід обрати: дотримуватись Кодексу чи скористатися людським ресурсом."

  bos_nf_creating_a_new_economy_plan:0 "Новий економічний план"
  bos_nf_creating_a_new_economy_plan_desc:0 "НКР мала складну систему інституцій, які можуть як служити нашим цілям, так і ні. Питання в тому, чи варто нам залишити їх у спокої, чи спробувати взяти під контроль і змінити відповідно до наших потреб?"
  bos_nf_reorganizing_our_economy: "Реорганизація нашої економіки"
  bos_nf_reorganizing_our_economy_desc: "Економіка НКР під нашим нинішнім правлінням була абсолютно спустошена. Наші організаційні системи, попри підготовку, укомплектовані недостатньо та є крихкими. Ми зробимо кроки, щоб виправити цю шкоду."
  bos_law_category_unlocked_tt: "Категорія, до якої належить цей закон, §Yрозблокована§!, що дозволяє нам змінювати закони за бажанням за їхню звичайну вартість у §Yполітичній владі.§!"
  bos_army_is_no_longer_free_tt: "Члени нашого Братства отримуватимуть плату за свою працю, щоб витрачати її в приватній економіці. §RУтримання військ більше не буде безкоштовним.§!"
  bos_nf_high_elder_rhiannon_economic_plan: "Реформи Ріаннон"
  bos_nf_high_elder_rhiannon_economic_plan_desc: "Абсолютна верховна старійшина Ріаннон має особливі реформи на умі для Каліфорнії. Економічна та соціальна ізоляція для жителів Каліфорнії."
  bos_nf_high_elder_rhiannon_allows_mutants: "Карателі Ріаннон"
  bos_nf_high_elder_rhiannon_allows_mutants_desc: "Не дивно, що те, як Трійка давала раду з окупацією, не викликало особливої доброзичливості в населення. Якщо є хоч найменший шанс утримати Каліфорнію, нам потрібно, щоб люди боялися нас, а що впорається краще, ніж супермутант, який викидає скиглючого адміністратора крізь стіну?"
  bos_nf_high_elder_rhiannon_silence_dissent: "Цензура в ЗМІ"
  bos_nf_high_elder_rhiannon_silence_dissent_desc: "З початку окупації журналісти створювали підпільні мережі для поширення своїх повідомлень. Манавіддан має план, як знищити це за допомогою методів дезінформації зі Старого світу."
  bos_nf_high_elder_maxson_economic_plan: "Максоніанські реформи"
  bos_nf_high_elder_maxson_economic_plan_desc: "Максоніанці планують дозволити обмежену торгівлю, але в усьому іншому — відносно неконтрольовану приватну економіку. Це плюс-мінус той план, який ми завжди мали для довгострокового правління в Каліфорнії."
  bos_nf_high_elder_maxson_economic_mobilization: "Вірність нашим звичаям"
  bos_nf_high_elder_maxson_economic_mobilization_desc: "Наша економічна система більш-менш дозволила економіці НКР відновитися, нехай і скоротившись через спустошення нашої війни. Наші інтенданти та писарі дотримуватимуться наших систем накопичення запасів, но ми збиратимемо податки та робитимемо закупівлі у приватних компаній."
  bos_nf_high_elder_maxson_silence_dissent: "Державна преса"
  bos_nf_high_elder_maxson_silence_dissent_desc: "Оскільки війна остаточно завершилася, настав час реорганізувати медіа. Хоча нам не потрібна повна вседозволеність, місцеві новини можуть залишатися приватними, а ми спонсоруватимемо державну медіагрупу в національних інтересах. Їм знадобиться наше схвалення для публікації своїх історій, але нам пора керувати громадянами, а не дисидентами."
  bos_nf_high_elder_torni_economic_plan: "Реформи Торні"
  bos_nf_high_elder_torni_economic_plan_desc: "Заплановані Торні реформи допускають ширший ступінь соціального та економічного звільнення, ніж багато хто в НКР очікував би від нас. Місцеві органи влади штатів можуть навіть сильно нагадувати те, чим вони були за НКР, а Послідовників можна запросити повернутися, щоб вони поширилися по всій Каліфорнії."
  bos_nf_high_elder_torni_economic_mobilization: "Прийняття ринкової системи"
  bos_nf_high_elder_torni_economic_mobilization_desc: "Наших методів недостатньо для такої великої держави. Якщо ми хочемо користуватися будь-якою ефективністю, нам доведеться перейняти значну частину федерального уряду НКР, включно з його практиками щодо позик і субсидій. Можливо, навіть Конгрес, сформований із призначених Старійшин?"
  bos_nf_high_elder_torni_llwyd_free_the_press: "Свобода преси"
  bos_nf_high_elder_torni_llwyd_free_the_press_desc: "Тепер, коли ми при владі, тисячі проблем терзатимуть Каліфорнію. Якщо ми хочемо ефективно управляти, нам потрібна преса, здатна доносити їх до нашого відома без того, щоб їх поховав якийсь ображений Старійшина. Така преса зробить більше для того, щоб мы не стали жертвою хвороби НКР, ніж тисяча ретельно обговорених призначень."
  bos_nf_high_elder_llwyd_economic_plan: "Реформи Ллуїда"
  bos_nf_high_elder_llwyd_economic_plan_desc: "Абсолютний верховний старійшина Ллуїд планує відмовитися від більшості елементів адміністрації Братства. Крім збереження достатнього економічного контролю, щоб придушити залишки Баронів, Ван Граффів, Зброярів та Водяних купців, Каліфорнія буде відкритою для бізнесу!"
  bos_nf_high_elder_llwyd_torni_embrace_the_followers: "Прийняти Послідовників"
  bos_nf_high_elder_llwyd_torni_embrace_the_followers_desc: "Послідовники Апокаліпсису зробили Кістянку одним із найкращих місць у Пустці. Вони навіть утримували там некомерційний університет, поки війна не знищила його, і вони сповідують ідеологію ненасильства, будучи при цьому повними вправних лікарів, науковців, агротехніків та інших освічених людей. Ми були б дурнями, якби не залучили їх до відновлення своїх таборів допомоги та баз по всій Каліфорнії."
  bos_nf_high_elder_persecute_the_followers:0 "Переслідувати Послідовників"
  bos_nf_high_elder_persecute_the_followers_desc:0 "Послідовники Апокаліпсису — це ненормальний, езотеричний культ, який запекло не погоджується із самими основними ідеалами нашої організації. Вони не мають жодної мети, лише розбещують уми тих громадян і дикунів, що живуть під нашим началом."
  bos_nf_high_elder_follower_technology:0 "Вкрасти креслення Послідовників"
  bos_nf_high_elder_follower_technology_desc:0 "Послідовники дещо приховували від нас! У їхніх комплексах ми знайшли кілька корисних креслень для вдосконалення наших медичних методів."
  bos_nf_high_elder_llwyd_torni_followers_unfinished_programs: "Підтримати амбіції Послідовників"
  bos_nf_high_elder_llwyd_torni_followers_unfinished_programs_desc: "Навіть більше, ніж просто повернути Послідовників до їхнього статус-кво за часів НКР, мы могли б активно підтримати їхнє розширення. Вони реалізовували пілотні програми в Кістянці з електрифікації та промислової допомоги в бідних регіонах. Хоча наші промислові технології, безумовно, бездоганні, така програма все одно може стати в пригоді нашим Орденам, а їхня робота з електрифікації полегшить логістичний тягар нашого енергоємного озброєння."
  bos_boneyard_sun_tt: "Ігнасіо Рівас буде запрошений в уряд як радник, і Послідовники по всій Пустці зможуть запропонувати допомогу в електрифікації та промислових дослідженнях."
  bos_nf_high_elder_llwyd_economic_mobilization: "Заслужена лояльність"
  bos_nf_high_elder_llwyd_economic_mobilization_desc: "Знову і знову Ллуїд демонстрував вражаючий рівень відданості справі допомоги жителям Каліфорнії та всім у пустках. Наша багаторічна політика вибудувала довіру до нашого управління та впевненість у бізнесі. Жителі Каліфорнії були мало не раді працювати на нас, а наші антикорупційні кампанії творять дива для малого та середнього бізнесу. Каліфорнія знову реве!"
  bos_nf_high_elder_llwyd_old_management: "Старі обличчя, нові продукти"
  bos_nf_high_elder_llwyd_old_management_desc: "Ллуїд зробив своїм пріоритетом відновлення того рівня вибору та достатку, який спостерігався за НКР, і повернення торгівлі до довоєнного рівня. Будь-які наші союзники будуть дуже раді бачити, що вкрай необхідні матеріали знову потекли рікою."
  bos_nf_further_reconstruction: "Загоєння нових шрамів"
  bos_nf_further_reconstruction_desc: "Завдяки всій нашій роботі економіка знову в русі, а ризик колапсу нашої держави практично зведений до нуля. Проте імпровізовані військові меморіали всіяли Каліфорнію у вигляді щойно згорілих будівель, повалених ліній електропередач і кратерів, що збирають радіоактивну дощову воду. Справжні зусилля з очищення триватимуть роками."
  bos_reconstruction_campaign_reductions_tt: "§gТривалість кампанії з реконструкції буде значно скорочена, якщо ми завершимо фокуси, які йдуть за цим. Можливе скорочення на рік або більше.§!"
  bos_new_scars_mechanics_tt: "§CНаш вибір економічного плану та наша поточна правляча партія розблокують по одному додатковому варіанту вибору в подіях реконструкції. Іноді може бути розблоковано ще один варіант залежно від інших зроблених нами виборів.§!"

