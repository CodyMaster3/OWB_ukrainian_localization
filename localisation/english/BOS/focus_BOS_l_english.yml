  #stronger_lost_hills_decisions_desc: "Експериментально!"
  bos_underground_training_boost_decision: "Почати тренування"
  bos_new_expeditions: "Експедиції"
  bos_unlock_scavenging_decisions: "§4Відкриває рішення, які дозволяють нашим Паладинам займатися пошуком ресурсів, завершуючи фокуси пошуку.§!"
