  bos_ncr_reconstruction_campaign: "Відновлення Каліфорнії"
  bos_ncr_reconstruction_campaign_desc: "Зараз ми працюємо над відновленням Каліфорнії після років війни та опору."
  bos_nf_power_brokers: "Впливові ділки"
  bos_nf_power_brokers_desc: "НКР мала багато сильних фракцій, які викривляли її здатність управляти. Багато з них діяли проти нас під час кампаній опору, і вважалися розгромленими. Їхня значущість вимагає дій, але, можливо, вони могли б прискорити реконструкцію?"
  bos_nf_power_brokers_the_hub: "Кримінальні капіталісти Хабу"
  bos_nf_power_brokers_the_hub_desc: "Каліфорнія змінювалася. Наша війна перервала зусилля НКР з індустріалізації, і купці Хабу зокрема нажилися як бандити. Конфлікт швидко закрив фабрики Хабу, що змусило купців спрямувати свої державні кошти на кримінальну діяльність."
  bos_nf_power_brokers_the_barons: "Барони"
  bos_nf_power_brokers_the_barons_desc: "Президент Кімбол несе відповідальність за появу Баронів — сільськогосподарських і тваринницьких капіталістів, які об'єднали значну частину продовольчого постачання НКР. Кімбол скасував обмеження на кількість голів худоби на одного ранчеро, і з кожним роком після цього Барони ставали все більш політично впливовими."
  bos_nf_power_brokers_the_arms_dealers: "Торговці зброєю"
  bos_nf_power_brokers_the_arms_dealers_desc: "НКР була обтяжена групами інтересів, такими як Зброярі та Ван Граффи, що невблаганно руйнували федеральний уряд. Вони зосередили владу, з якою нам тепер доводиться мати справу. Зламати їх цілком можливо, але чи можемо ми собі це дозволити з огляду на ворогів, з якими стикаємося?"
  bos_nf_power_brokers_the_legacy_government: "Спадковий уряд"
  bos_nf_power_brokers_the_legacy_government_desc: "За одну ніч ми замінили демократію НКР власною системою. Це залишає тисячі незадоволених осіб, які мають причини сіяти ворожнечу та саботувати наш уряд. Ми повинні підійти до цього питання з усією серйозністю."

  ####CALIFORNIA FOOD CRISIS
  bos_nf_the_californian_food_crisis: "Каліфорнійська продовольча криза"
  bos_nf_the_californian_food_crisis_desc: "Війна... Війна нікої не змінюється. Сталь і вогонь, які ми пролили дощем на Каліфорнію, отруїли не лише ґрунт — вони отруїли розум нації, яку ми прийшли врятувати від помилок Старого світу. Через опір впливових ділків НКР цієї зими їжі на всіх не вистачить."
  bos_ncr_famine_crisis_unlock_tt: "§CРозблоковує впровадження низки ініціатив, спрямованих на подолання продовольчої кризи.§!"
  ##Flags
  reformers_reconstruction: "Реформатори закликали до §Yтитанічних зусиль§! у своїй воєнній пропаганді."
  barons_cooperating: "Барони співпрацюють заради відновлення сільського господарства на півночі."
  barons_dealt_with: "Барони були примусово усунені від управління фермами та ранчо."
  famine_mission_advanced_tech_1_completed: "Ми впровадили промислові добрива для підвищення продуктивності ферм."
  famine_mission_advanced_tech_2_completed: "Автоматизовані комбайни заповнюють брак робочої сили на рубежі."
  famine_mission_advanced_tech_3_completed: "Ми розповсюдили ГМО-насіння, здатне виживати на маловрожайних окраїнах угідь."
