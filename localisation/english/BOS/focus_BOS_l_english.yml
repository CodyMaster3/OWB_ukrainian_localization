bos_expeditions_decisions:0 "Управління Експедиціями"
bos_expeditions_decisions_desc:0 "Експедиційні паладини: [?BOS_paladins_expedition] \nЛюдський ресурс експедицій: [?BOS_expedition_troopers] \nНевикористані коди доступу: [?BOS_expedition_codes]\nОцінка готовності експедицій: [BOS_expedition_readiness_color_scripted_localization] \n------------------------------------\n Поточна ціль експедиції: \n[BOS_current_expedition_target]"

bos_lost_hills_diplomacy: "Дипломатія Лост-Гілз"
bos_lost_hills_diplomacy_desc: "Лише нещодавно §OУгода Олгуда§!, укладена сенатором Олгудом Мерфі, привела до припинення вогню між §Y[НКР.GetNameWithFlag]§! та §Y[BOS.GetNameWithFlag]§! після десятиліть партизанської війни. Конфлікт залишив НКР на межі банкрутства, а Братство — тінню самого себе. Жодна зі сторін не бажає відновлення війни. Але обставини змінюються — або ж цілеспрямовані кампанії можуть розірвати цей крихкий мир, який обидві сторони вважають тимчасовим.\n\n§ONапруга§! визначає, наскільки близько НКР і Братство до нової війни. Чим вона вища, тим §Rсильнішими будуть негативні ефекти в обох країн§!. При §O100 напруги§! може розпочатися війна!\n\nПоточний рівень напруги між §Y[НКР.GetNameWithFlag]§! та §Y[BOS.GetNameWithFlag]§!: §O[?bos_tension]§!."

BOS_diplomacy_decision_category_description_brotherhood: "Як член Братства Сталі, ми номінально підпорядковуємося бункеру Лост-Гілз у Каліфорнії. Вони надають нам спорядження та підкріплення під час війни, доки ми дотримуємось Кодексу й виконуємо нашу місію."

