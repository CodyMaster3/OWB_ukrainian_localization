  nf_brotherhood_foreign_assistance.1.t: "Постійна присутність"
  nf_brotherhood_foreign_assistance.1.d: "[BOS.getName] провело останні шість місяців, будуючи сучасну військову базу в нашій країні. Сьогодні відлітає перший рейс із шанованими Писарями, відповідальними за цей видатний подвиг, включаючи жменьку учнів. [BOS.getName] закликало нас провести для них офіційну церемонію, [THIS.getLeader] навіть виголосив промову! \n\n «Хай знають прекрасні чоловіки та жінки з [BOS.getName], що ваші товариші вдома прямо зараз вписують це діяння у ваші Сувої. На той час, коли ви приземлитеся в [BOS.Capital.getName], вас визнають одними з перших, хто простягнув руку своїм Братам і Сестрам через пустку. Ваш внесок в об'єднання Братства ніколи не буде забутий з боку [BOS.getName], і ви на вірному шляху до того, щоб стати найвпливовішими Писарями за десятиліття. Я знаю, що [BOS.getLeader] і я будемо уважно стежити за вашим прогресом. Об'єкт буде названо на честь покійного...»\n\n«...і нарешті, цим першим рейсом [ROOT.getName] вітає появу нових облич, нову торгівлю та нові можливості! Ad Victoriam!»"
  nf_brotherhood_foreign_assistance.1.a: "Ми заплатили за те, щоб база була віддаленою, хіба цього недостатньо?"
  nf_brotherhood_foreign_assistance.1.b: "Ми зробили її невеликою."
  nf_brotherhood_foreign_assistance.1.c: "Зберімо листи, щоб відправити їх зворотним рейсом."
  nf_brotherhood_foreign_assistance.1.e: "Військовий парад для народу."

  nf_brotherhood_foreign_assistance.101.t: "Постійна присутність"
  nf_brotherhood_foreign_assistance.101.d: "Ми провели останні шість місяців, будуючи сучасну військову базу, обладнану передовими радіолокаційними системами, у [FROM.getName]. Сьогодні відлітає перший рейс із шанованими Писарями, відповідальними за цей видатний подвиг, включаючи жменьку учнів. Ми закликали [FROM.getName] провести для них офіційну церемонію, і, на наш подив, [FROM.getLeader] навіть виголосив промову! \n\n «Хай знають прекрасні чоловіки та жінки з [BOS.getName], що ваші товариші вдома прямо зараз вписують це діяння у ваші Сувої. На той час, коли ви приземлитеся в [BOS.Capital.getName], вас визнають одними з перших, хто простягнув руку своїм Братам і Сестрам через пустку. Ваш внесок в об'єднання Братства ніколи не буде забутий з боку [BOS.getName], і ви на вірному шляху до того, щоб стати найвпливовішими Писарями за десятиліття. Я знаю, що [BOS.getLeader] і я будемо уважно стежити за вашим прогресом. Об'єкт буде названо на честь покійного...»\n\n«...і нарешті, цим першим рейсом [ROOT.getName] вітає появу нових облич, нову торгівлю та нові можливості! Ad Victoriam!»"
  nf_brotherhood_foreign_assistance.101.a: "Ми захистимо їх."

  nf_brotherhood_foreign_assistance.2.t: "Скарби для нового Старійшини"
  nf_brotherhood_foreign_assistance.2.d: "Трійка нарешті постукала в двері, знайшовши свої «паскаль-байти». Ми знали, що цей день настане, і дізналися від вигнанців і втікачів з їхнього Капітулу, що вони — маргінальний культ, який тим не менш поклав кінець багаторічному паралічу Лост-Гіллз. На цьому їхня ефективність не закінчується: є звіти про жорстокі репресії та рейди за технологіями на їхніх територіях, а також про успішне та широке впровадження бойових імплантів у їхній армії. Такі досягнення вимагають, щоб ми принаймні вислухали їх.\n\nРечник делегації [BOS.getName] у червоній мантії з каптуром говорив про цю планету як про «Світ Брехні», ефемерне пекло, де ми живемо і вмираємо на втіху якійсь істоті з незмірною владою над нами.\n\nДля [THIS.getLeader] очевидно, що вони відрепетирували цей вступ, щоб досягти вразливих вух у найбільш ворожих залах, при цьому делегат витратив більшу частину свого часу, розмовляючи зі звичайними людьми, які спостерігали за цією зустріччю. Зрештою вони розкривають причину свого візиту, пропонуючи надзвичайно рідкісний імплант, який вони дали своєму керівництву — «Скарб Горна», як вони це називають, — для [THIS.getLeader], який «зробить їх кращими, а можливо, і націю в цілому».\n\nУсе, про що вони просять, — це щоб [THIS.getLeader] хоча б на словах визнав їхню священну книгу, Апокриф Трійки, і відвідав якийсь ритуал, коли прийде час. Здається, вони впевнені, що імпланти переконають [THIS.getLeader] в істинності їхньої релігії."
  nf_brotherhood_foreign_assistance.2.a: "Ми будемо цінувати таку перевагу."
  nf_brotherhood_foreign_assistance.2.mid: "Це божевілля не може тривати."
  nf_brotherhood_foreign_assistance.2.b: "Ні. Вигнати Трійку."

  nf_brotherhood_foreign_assistance.201.t: "Скарби для нового Старійшини"
  nf_brotherhood_foreign_assistance.201.d: "[BOS.getLeader] веде нашу аудієнцію з [FROM.getLeader], причому кілька місцевих прихильників Апокрифу Трійки демонструють свою підтримку нашої зустрічі.\n\n«Ця планета, [FROM.getLeader], — світ брехні. Пекло нашого власного творіння, реальне лише настільки, наскільки ми віримо в те, що воно таким має бути!\n\nНаш священний текст привів нас до цієї впевненості з непохитним доказом — мої сестри і я перетворилися зі слабких, кволих і вмираючих на втілення здоров'я та геніальності лише з одним імплантом. Кожен із них — Скарб, викуваний у нашому Горні, і результат місяців важкої праці та зусиль сотень, якщо не тисяч, життів. З його допомогою ви зможете отримати доступ до своїх паскаль-байтів і можливість їх змінювати. Це несе ризики, так, але якщо ви хоча б на словах визнаєте вчення Апокрифу, ми подаруємо вам цей імплант. Завдяки цій службі ви будете озброєні знаннями, достатніми для безпечного встановлення, і тоді ви зможете самі побачити істину нашого шляху для себе і свого народу».\n\nСтарійшина Ріаннон виголосила завчену промову, ретельно опускаючи подробиці вчення Трійки або її великої мети для Людини. Усі ми знали, що це було б занадто для будь-якого неофіта за межами наших кордонів. Тепер нам залишається лише чекати на їхнє рішення."
  nf_brotherhood_foreign_assistance.201.a: "Пропозицію зроблено."

  nf_brotherhood_foreign_assistance.202.t: "Пропозицію прийнято"
  nf_brotherhood_foreign_assistance.202.d: "[FROM.getLeader] прийняв нашу пропозицію і надіслав нам нових аколітів для вивчення Апокрифу. Після завершення нашого навчання [FROM.getLeader] пройде процедуру і перепише свої паскаль-байти. Ми рухаємося вперед, у минуле. До народження народженого, до MAXEN/Духу-роду/Заклику Бурі.\n\nМи готові, [BOS.getLeader]? Чи є ще Старійшини, яких ми б запросили на Велику Бурю? §BВони отримали спеціальний Аугмент, що випадково визначається потенціалом їхніх Паскаль-байтів. Перевірте їхнього лідера країни, щоб побачити його.§!"
  nf_brotherhood_foreign_assistance.202.a: "Скоро"

  nf_brotherhood_foreign_assistance.203.t: ""
  nf_brotherhood_foreign_assistance.203.d: ""
  nf_brotherhood_foreign_assistance.203.a: ""

  nf_brotherhood_foreign_assistance.204.t: "Пропозицію відхилено"
  nf_brotherhood_foreign_assistance.204.d: "[FROM.getLeader] відкинув істину Апокрифу Трійки і розірвав усі зв'язки з нами! Невже Ланцюг, Що Пов'язує, нічого для них не означає?! Як вони могли не побачити правду нашого світу? Наших братів і сестер не можна залишати в'янути під тиранією [FROM.getLeader]. Ми повинні діяти, [BOS.getLeader]! Це наш обов'язок!"
  nf_brotherhood_foreign_assistance.204.a: "Ми будемо."

  nf_brotherhood_foreign_assistance.3.t: "[BOS.getName] надсилає команду Писарів"
  nf_brotherhood_foreign_assistance.3.d: "[BOS.getName] надіслало нам команду Писарів, навантажену ресурсами, які будуть спрямовані на проєкт за нашим вибором як перевага нашого приєднання до їхньої Ради Старійшин. Вони очікуватимуть від нас значного внеску в прийдешніх конфліктах Братства, оскільки їхні команди писарів мають постійний попит.\nМожливо, замість того, щоб обирати ідеальну річ, ми повинні обрати щось, що не займе надто багато часу?"
  nf_brotherhood_foreign_assistance.3.a: "Збільшення нашого військового виробництва має вирішальне значення."
  nf_brotherhood_foreign_assistance.3.b: "Нам потрібна краща енергетична інфраструктура."
  nf_brotherhood_foreign_assistance.3.c: "Можливо, вони зможуть поглянути на нашу логістику?"
  nf_brotherhood_foreign_assistance.3.e: "Захист кордонів буде найбажанішим."
  nf_brotherhood_foreign_assistance.3.f: "Отримання нової фабрики електроніки є життєво важливим."
  nf_brotherhood_foreign_assistance.3.g: "Нам потрібні їхні поради щодо досліджень."
  nf_brotherhood_foreign_assistance.3.h: "Вони нічого не можуть для нас зробити."

  bos_lost_hills_diplomacy_building_factory: "Будівництво іноземної фабрики - 100 днів"
  bos_foreign_factory_building_tt: "Іноземна держава отримала §Y1 збройову майстерню§! за §Y35.0k кришок.§!"
  bos_lost_hills_diplomacy_building_electronics_fab: "Будівництво іноземних фабрик електроніки - 70 днів"
  bos_foreign_electronics_tt: "Іноземна держава отримала §Y2 виробничі лабораторії§! за §Y30.0k кришок.§!"
  bos_lost_hills_diplomacy_building_logistics: "Будівництво іноземної інфраструктури - 50 днів"
  bos_foreign_logistics_tt: "Іноземна держава отримала §Y3 інфраструктури§! за §Y25.0k кришок.§!"
  bos_lost_hills_diplomacy_building_power: "Будівництво іноземних електростанцій - 50 днів"
  bos_foreign_power_tt: "Іноземна держава отримала §Y2 електростанції§! за §Y20.0k кришок.§!"
  bos_lost_hills_diplomacy_building_advising_research: "Надання допомоги в дослідженнях - 60 днів"
  bos_foreign_advising_tt: "Іноземна держава отримала §Y1 25% бонус до досліджень§! за §Y20.0k кришок.§!"

  nf_brotherhood_foreign_assistance.301.t: "Команда Писарів - Рішення прийнято"
  nf_brotherhood_foreign_assistance.301.d: "Наша пропозиція допомоги [FROM.getName] за допомогою наших Команд Писарів отримала відповідь.\n Тепер активна місія, яка показує, що вони обрали, що отримали і скільки часу мине до того, як наші Писарі знову будуть готові."
  nf_brotherhood_foreign_assistance.301.a: "Подивимось-но..."
  nf_brotherhood_foreign_assistance.301.b: "Більше не турбуйте мене цим."

  nf_brotherhood_foreign_assistance.402.t: "[FROM.getName] може прийняти наших добровольців"
  nf_brotherhood_foreign_assistance.402.d: "[FROM.getName] перебуває у стані війни, і логістика для прибуття наших добровольців готова, якщо ми бажаємо їх відправити. §BВи можете ігнорувати сповіщення від конкретного капітулу або всіх капітулів за допомогою кнопок нижче.§!"
  nf_brotherhood_foreign_assistance.402.a: "Цікаво."
  nf_brotherhood_foreign_assistance.402.b: "Нас не цікавить скрутне становище [FROM.getName]."
  nf_brotherhood_foreign_assistance.402.c: "Ми не хочемо чути про це щодо жодного Капітулу."

  nf_brotherhood_foreign_assistance.5.t:0 "[BOS.getName] пропонує реінтеграцію"
  nf_brotherhood_foreign_assistance.5.d:0 "Брати не стоять самі по собі. Наше братерство було випробуване тяготами пустки, але підтримка [BOS.getName] зростала протягом останніх кількох років у міру того, як розвивалися події в Каліфорнії. Ми пережили бурю, і [BOS.getName] дісталося кордонів наших земель.\n\nПовідомлення від [BOS.getLeader] коротке: «Час повертатися додому».\n\nЯкщо ми готові, наші Старійшини регулярно отримуватимуть накази від їхніх, наші писарі обмінюватимуться ідеями з усім Братством, а їхні Лицарі та Паладини охоронятимуть наші кордони, тоді як наші власні виснажені сили підуть у ротаційну відпустку на каліфорнійські пляжі.\n\n"
  nf_brotherhood_foreign_assistance.5.a:0 "Ми вітаємо комюніке [BOS.getLeader]."
  nf_brotherhood_foreign_assistance.5.b:0 "Обставини змінилися. Ми тримаємося осторонь."
  bos_declining_invite_stops_ai_tt:0 "Відхилення цього запрошення не має жодних наслідків, окрім деяких символічних витрат, які [BOS.getName] вже сплатило. Однак, якщо ними керує ШІ, §Rвам більше ніколи цього не запропонують.§! Це може бути запропоновано лише визнаним капітулам у вашій фракції. Якщо хтось погодиться, усі інші члени фракції будуть запрошені до Братства."

  nf_brotherhood_foreign_assistance.501.t:0 "[FROM.getName] відхиляє реінтеграцію"
  nf_brotherhood_foreign_assistance.501.d:0 "[FROM.getName] на чолі з [FROM.getLeader] відхилила реінтеграцію. Неясно, чи вони занадто звикли до своєї незалежності, чи прагнуть повернутися лише після повного виконання своєї місії. Ми можемо звернутися до них знову в майбутньому."
  nf_brotherhood_foreign_assistance.501.a:0 "Вкрай розчаровує."

  nf_brotherhood_foreign_assistance.502.t:0 "[FROM.getName] приймає реінтеграцію"
  nf_brotherhood_foreign_assistance.502.d:0 "[FROM.getName] на чолі з [FROM.getLeader] прийняла реінтеграцію. Їхні старійшини повертаються додому, щоб приєднатися до Ради, їхні писарі консультуються з нашими, а наші Лицарі та Паладини вирушають на посилення їхніх кордонів, тоді як їхні власні сили насолоджуються такою необхідною ротаційною відпусткою в Каліфорнії."
  nf_brotherhood_foreign_assistance.502.a:0 "Як і очікувалося."

  chances_popularity_tt: "Шанси ґрунтуються на поточній популярності партії для кожної фракції. Цей закон про окупацію буде §Rвилучено§! після того, як братство переможе."
  bos_rhombian_occupation: "Виважений підхід"
  bos_rhombian_occupation: "На відміну від максонської альтернативи, ромбіанська окупація зважає на той факт, що кожне поселення відрізняється. Окупаційні патрулі рідко простягають руку допомоги приреченим громадам, але ті, кому просто потрібні базові припаси, генератор типу «чорний ящик», життєво необхідна операція або нове насіння на заміну знищеним посівам, знаходять у Ромбіанцях годувальників. Крім того, Ромбіанці використовують більше патрулів, ніж необхідно для простого підтримання контролю — загрози безпеці, викликані війною, такі як рейдери або істоти з пустки, відтісняються на комфортну відстань навіть від відносно невеликих поселень."
  bos_troikan_occupation: "Усвідомлення зі Смерті, Підкорення через Насильство"
  bos_troikan_occupation_desc: "Трійка шукає людей із певним даром — особливою схильністю до троїканського способу мислення — і використовує їх для створення технології, здатної викликати цей стан в інших. Цей конкретний факт, звичайно, відомий лише її членам.\n\nОднак їхня кампанія насильства та жорстокості є чудовим прикриттям для цього процесу і, схоже, підтримується більшістю в уряді [BOS.getName] через політичний параліч або його ефективність."
  bos_maxsonian_occupation: "Залізний кулак"
  bos_maxsonian_occupation_desc: "Окупація НКР під керівництвом Максоніанців — це формальна, але бездушна справа. Окупаційні сили мало поважають контекст чи нюанси — якщо патрулю потрібна нова зброя, більше припасів чи інформація, очікується, що окуповані здадуть це. Наслідки настають лише за опір, але вони можуть бути непропорційними. Відмова віддати чисту воду може призвести до рейду, під час якого заберуть удвічі більше, ніж потрібно."
  bos_reformer_occupation: "Оксамитова рукавичка"
  bos_reformer_occupation_desc: "Окупація під проводом Реформаторів надає пріоритет довгостроковій довірі коштом сьогодення. Воістину приголомшлива частина Братства орієнтована на пом'якшення недовіри громадян НКР. Патрулі повільні та вразливі, обтяжені гуманітарною допомогою для роздачі.\n\nТаким чином, на це завдання необхідно виділити значно більше персоналу — але робота, що виконується зараз, імовірно, принесе довгострокові вигоди та загалом зменшить кількість смертей у сьогоденні, за умови, що Братство не буде змушене залишити цілі штати на милість Пустки."

nf_brotherhood_elh_ncr_relations.102.t:0 "Воля Ріаннон"
  nf_brotherhood_elh_ncr_relations.102.d:0 "Старійшина Ріаннон, лідер фракції меншості в Раді, провела останні два місяці, руйнуючи НКР у справді незбагненний спосіб. Вона не проводила звичайну кампанію пригнічення. Коли лоялісти з інших фракцій повернулися з відпусток на окупованих територіях, стали зрозумілі повні масштаби. Нижче наведено свідчення колишнього Лицаря-Учня Джейкобса, нині з почестями звільненого зі служби Головним Писарем Медицини.\n\n«Перший день не віщував нічого поганого. Люди, що залишилися в місті, були налякані й дивилися довгим поглядом, коли ти дивився їм прямо в очі. Їх було небагато, це правда. Але так відбувається повсюди. Не всі міста мають здоровий глузд вітати нас. Що викликало в мене підозру, так це підвал у міському барі, який місцеві писарі облаштували під операційну. Я побачив, що висока стеля була вкрита кіркою крові. Я користуюся клинком, який мій батько відвоював у офіцера в Наварро, тому знаю, що потрібно, щоб кров забризкала так високо. Від такого просто так не йдуть».\n\n«Я швидко знайшов свого капітана, і вона доручила мені трохи покопати. Виявилося, що писарі почали шукати добровольців серед місцевих, які хотіли стати особливими, переписати свою долю, отримавши імплант. Більшість померла під час операції, але дехто вижив і почав нести нісенітницю про вогонь і брехню. Виявилося, що вони пішли як учні до загонів, вірних Ріаннон, і що це місто здалося мирно. Всі зниклі люди — це через операції».\n\nПісля цього звіту ми отримали кілька інших, у яких згадувалися подібні обставини на територіях. Звіти про громадян, яким видаляли кінцівки для тестування механічних альтернатив, над якими експериментували з імплантами, здатними стерти їхні спогади, і десятки інших модифікацій малюють жахливу картину: Ріаннон діє не для того, щоб захистити майбутнє, а щоб принести нові жахи, які неможливо було уявити навіть у Велику Війну."
  nf_brotherhood_elh_ncr_relations.102.a:0 "Абсолютно неприйнятно! Ріаннон потрібно зупинити, НЕГАЙНО!"
  nf_brotherhood_elh_ncr_relations.102.b:0 "Ріаннон прагне вдосконалити нас і витрачає на це життя нашого найбільшого ворога. Іншого шляху вперед немає."

  nf_brotherhood_elh_ncr_relations.103.t:0 "Воля Ріаннон"
  nf_brotherhood_elh_ncr_relations.103.d:0 "Старійшина Ріаннон, лідер фракції меншості в Раді, провела останні два місяці, руйнуючи НКР у справді незбагненний спосіб. Вона не проводила звичайну кампанію пригнічення. Коли лоялісти з інших фракцій повернулися з відпусток на окупованих територіях, стали зрозумілі повні масштаби. Нижче наведено свідчення колишнього Лицаря-Учня Джейкобса, нині з почестями звільненого зі служби Головним Писарем Медицини.\n\n«Перший день не віщував нічого поганого. Люди, що залишилися в місті, були налякані й дивилися довгим поглядом, коли ти дивився їм прямо в очі. Їх було небагато, це правда. Але так відбувається повсюди. Не всі міста мають здоровий глузд вітати нас. Що викликало в мене підозру, так це підвал у міському барі, який місцеві писарі облаштували під операційну. Я побачив, що висока стеля була вкрита кіркою крові. Я користуюся клинком, який мій батько відвоював у офіцера в Наварро, тому знаю, що потрібно, щоб кров забризкала так високо. Від такого просто так не йдуть».\n\n«Я швидко знайшов свого капітана, і вона доручила мені трохи покопати. Виявилося, що писарі почали шукати добровольців серед місцевих, які хотіли стати особливими, переписати свою долю, отримавши імплант. Більшість померла під час операції, але дехто вижив і почав нести нісенітницю про вогонь і брехню. Виявилося, що вони пішли як учні до загонів, вірних Ріаннон, і що це місто здалося мирно. Всі зниклі люди — це через операції».\n\nПісля цього звіту ми отримали кілька інших, у яких згадувалися подібні обставини на територіях. Звіти про громадян, яким видаляли кінцівки для тестування механічних альтернатив, над якими експериментували з імплантами, здатними стерти їхні спогади, і десятки інших модифікацій малюють жахливу картину: Ріаннон діє не для того, щоб захистити майбутнє, а щоб принести нові жахи, які неможливо було уявити навіть у Велику Війну."
  nf_brotherhood_elh_ncr_relations.103.a:0 "§RЧерез кров і хрящі ми знайдемо Усвідомлення. Ми знайдемо SPECIAL.§!"
  nf_brotherhood_elh_ncr_relations.103.b:0 "Абсолютно неприйнятно! Ріаннон потрібно зупинити, НЕГАЙНО!"

  nf_brotherhood_elh_reconstruction_campaign.201.t:0 "Новий початок Каліфорнії!"
  nf_brotherhood_elh_reconstruction_campaign.201.d:0 "По радіо в домівках по всій Каліфорнії оживає несанкціонована трансляція на всіх частотах, до яких змогло дотягнутися Братство. Під піднесені музичні акорди голос [Root.GetLeader] набуває бадьорого тону, і це повідомлення повторюється днями поспіль. «Ми повертаємося, Каліфорніє! Поки [NCR.GetLeader] та їхні поплічники позбавляли вас кращого майбутнього, ми готувалися перевести кожну громаду Каліфорнії у 23-тє століття!\n\nНаші Паладини хоробро б'ються, щоб захистити ваше місто, аби наші Писарі могли вирушити в дорогу — до вас! Ми відкриємо школи, проведемо електрику й навчимо новітніх методів вирощування найсоковитіших тошок та безпечного очищення води. Наші Лицарі охоронятимуть ваші домівки, зачистять гнізда, які Рейнджери ігнорували десятиліттями, і навчать вас, щоб ви стали їхніми учнями».\n\n«Я обіцяю вам це, Каліфорніє: жодне місто чи село, яке присягне на вірність Братству, хоч би яким віддаленим воно було, не залишиться поза увагою. Ми повертаємо Каліфорнію — не для себе, а для вас. Приєднуйтесь до Братства вже сьогодні і допоможіть нам побудувати Каліфорнію, яка зможе вистояти завтра».\n\n«Я — [Root.GetLeader], вітаю вас у Братстві»."
  nf_brotherhood_elh_reconstruction_campaign.201.a:0 "Ми говоримо цілком серйозно. Кожне село."
  nf_brotherhood_elh_reconstruction_campaign.201.b:0 "Ми переселимо багатьох до більших населених пунктів, але обіцянка справжня."
  nf_brotherhood_elh_reconstruction_campaign.201.c:0 "Немає потреби виконувати обіцяне, згодиться і так."
  bos_propaganda_1:0 "Титанічні зусилля"
  bos_propaganda_1_desc:0 "Ми робимо все можливе, щоб втілити наші пропагандистські кампанії в реальність."
  bos_propaganda_2:0 "Реалістичні цілі"
  bos_propaganda_2_desc:0 "Ми даємо завищені обіцянки людям НКР, але ми робимо достатньо."

  nf_brotherhood_elh_reconstruction_campaign.202.t:0 "Страх у Каліфорнії"
  nf_brotherhood_elh_reconstruction_campaign.202.d:0 "По радіо в домівках по всій Каліфорнії оживає несанкціонована трансляція на всіх частотах, до яких змогло дотягнутися Братство. Звучить голос [Root.GetLeader], і це повідомлення повторюється днями поспіль.\n\n«Громадяни НКР, ваші лідери раз по раз доводять, що їм не можна довіряти технології Старого Світу. [NCR.GetLeader] змарнував(ла) потенціал Каліфорнії, чіпляючись за владні структури занепалої епохи. Паразити висмоктують життєві сили з вашої землі, вашого бізнесу і ваших життів — і все це під пильним наглядом [NCR.GetLeader.GetHerHis].»\n\n«Кожен день, коли ваш(а) «Великий Лідер» відкладає капітуляцію, — це ще один день, коли ваші сини, ваші дочки, ваші чоловіки та ваші дружини помирають за корумпований і некомпетентний уряд. Наші Лицарі закуті в сталь і полімери, яких ваші близькі не мають. Наші Паладини озброєні зброєю, здатною вирізати взвод до того, як нагріється ствол. Запитайте себе, що це за війна, коли десятеро тих, кого ви любите, помруть, щоб завдати клопоту одному безсмертному солдату?»\n\n«Залишайтеся вдома, Каліфорніє: наші Лицарі йдуть, і вони ліквідують колаборантів [NCR.GetLeader], хоч би де ті ховалися.»\n\n«Але нехай вас заспокоїть моя обіцянка: жоден солдат, який сьогодні складе зброю, не втратить життя, і жодне місто чи село, яке присягне Братству, не постраждає. З тих же, хто залишиться вірним [NCR.GetLeader], не пощадять нікого.»\n\n«Я — [Root.GetLeader], ваш новий Верховний Старійшина.»"
  nf_brotherhood_elh_reconstruction_campaign.202.a:0 "Ми винищимо тих, хто чинить опір. Як і обіцяли."
  nf_brotherhood_elh_reconstruction_campaign.202.b:0 "Страх мотивуватиме їх капітулювати."
  bos_propaganda_3:0 "Жорстока кампанія"
  bos_propaganda_3_desc:0 "Ми не потерпимо нічого, крім абсолютної покори."
  bos_propaganda_4:0 "Хвиля страху"
  bos_propaganda_4_desc:0 "Нам потрібна їхня поступливість, а не їхній бунт."

  nf_brotherhood_elh_reconstruction_campaign.203.t:0 "Нова парадигма"
  nf_brotherhood_elh_reconstruction_campaign.203.d:0 "Народ НКР не вітає наше правління. Ми звільнили їхніх обраних посадовців і зробили більшість посад, які варто зберегти, призначуваними на майбутнє, але решта політичного апарату НКР буде спрямована на наші власні цілі.\n\nДо нашої окупації преса користувалася великою свободою, їхній інженерно-будівельний корпус розростався, а поліції глибоко довіряло багато громадян. З часом усе це стане нашим, але поки люди все ще чинять нам опір, ми повинні зосередити наші зусилля на тому, щоб підкорити лише одну з цих організацій.\n\n§BВаш вибір тут також розблокує додаткову опцію принаймні в одній події під час реконструкції НКР.§!"
  nf_brotherhood_elh_reconstruction_campaign.203.a:0 "Засоби масової інформації — це величезна загроза, якщо їх не контролювати."
  nf_brotherhood_elh_reconstruction_campaign.203.b:0 "Відбудова коштує дорого, це має бути інженерний корпус."
  nf_brotherhood_elh_reconstruction_campaign.203.c:0 "Поліція могла б захищати життя наших Посвячених."
  bos_the_police:0 "Поліція, що співпрацює"
  bos_civil_engineers:0 "Вмотивований інженерний корпус"

  nf_brotherhood_elh_followers.3.t:0 "Послідовники — Назустріч світлу"
  nf_brotherhood_elh_followers.3.d:0 "Послідовники Апокаліпсису, або просто Послідовники, — це гуманітарна організація, що походить з Нової Каліфорнійської Республіки. Послідовники зосереджуються на наданні освіти та медичних послуг тим, хто їх потребує, а також на сприянні дослідженням у невійськових сферах. Колись союзники Нової Каліфорнійської Республіки, вони розійшлися через розбіжності щодо зовнішньої політики НКР.\nКоли ми прийшли до влади, Послідовники переховувалися, наскільки могли. Наші методи окупації були такими ж різноманітними, як і наша Рада, а їхня антивоєнна агітація була неприйнятною. Тепер, якщо ми збираємося керувати Каліфорнією, ми не можемо дозволити собі їхню відсутність. Нам потрібні їхні лікарі, їхні мережі, їхні бази і їхня лояльність, просто щоб витримати тягар усіх тих розлучених сімей, закинутих полів, сиріт війни та людей з ампутаціями, яких ми створили."
  nf_brotherhood_elh_followers.3.a:0 "Велике напруження спадає."

  nf_brotherhood_elh_followers.301.t:0 "Послідовники — Піднімаючи смолоскип"
  nf_brotherhood_elh_followers.301.d:0 "Ігнасіо Ріваса обрано для призначення на посаду зв'язкового з Послідовниками та радника [BOS.getLeader] і Ради в цілому. Ігнасіо не лише глибоко знайомий з бюрократією НКР і тому чудово підходить для наших подальших зусиль у цьому регіоні, але й підтримує Братство Сталі. Ігнасіо та Послідовники в цілому погоджуються з нашим основним принципом — запобігати потраплянню небезпечних технологій у погані руки, а сам Ігнасіо працював над тим, щоб система «АРХІМЕД» не потрапила до некомпетентних рук Територій Мохаве.\n\nДосить сказати, що Ігнасіо дуже раді бачити в Братстві, і їхній захист інтересів громадян Каліфорнії тут не залишиться поза увагою."
  nf_brotherhood_elh_followers.301.a:0 "Ми раді, що вони з нами."

  nf_brotherhood_elh_mutant_question.5.t:0 "Питання мутантів"
  nf_brotherhood_elh_mutant_question.5.d:0 "Хоча в минулому ми розглядали можливість відкрити набір для певних груп мутантів, як-от Гулів із Некрополя, наші реформи незручно розмиті щодо статусу цих груп у Каліфорнії. Ми не збираємося їх виганяти, це цілком зрозуміло, але чи справді ми готові вербувати їх до нашої нової реорганізованої армії?"
  nf_brotherhood_elh_mutant_question.5.a:0 "Будь-які мутанти вітаються, якщо вони на щось здатні."
  nf_brotherhood_elh_mutant_question.5.b:0 "Гулі — талановиті Лицарі та Писарі."
  nf_brotherhood_elh_mutant_question.5.c:0 "Вони можуть приєднатися в індивідуальному порядку."

  nf_brotherhood_elh_troika_rituals.7.t:0 "Нарешті, Велика Буря!"
  nf_brotherhood_elh_troika_rituals.7.d:0 "У нас не було браку у свідках. Кожен командир Лицарів, Паладинів чи Посвячених вирушив разом із Трійкою до Світіння. Наші лояльні лідери капітулів зробили те саме, віддзеркалюючи нашу подорож.\n\nУсі присутні стануть свідками того, як Трійка знову занурюється в Котел Переродження, але кого ще вони запросять?\n\nХто ще відкине плоть і стане Апокрифічним?"
  nf_brotherhood_elh_troika_rituals.7.a:0 "§RТільки наші найвідданіші командири.§!"
  nf_brotherhood_elh_troika_rituals.7.b:0 "§RУсі, хто здійснив подорож, візьмуть повноцінну участь.§!"
  nf_brotherhood_elh_troika_rituals.7.c:0 "§RТРІЙКА — ЦЕ МАНАВІДАН-РІАННОН-ПРІДЕРІ!§!"

  nf_brotherhood_elh_troika_rituals.701.t:0 "Ритуал Трійки: Винагорода"
  nf_brotherhood_elh_troika_rituals.701.d:0 "У нас не було браку у свідках. Кожен командир Лицарів, Паладинів чи Посвячених вирушив із нами до Світіння, щоб віддзеркалити подорож Трійки.\n\nУсі зібралися, щоб стати свідками того, як Трійка знову занурюється в Котел Переродження — спуск у найглибші частини Світіння.\n\nПісля повернення вони запрошували капітул за капітулом повторити їхнє досягнення, і з кожним кроком вони цитували ключові уривки з Апокрифу Трійки, дозволяючи напівзруйнованим стінам цього об'єкта часів Великої Війни нести істину.\n\nНа той час, коли ми знову вийшли зі Світіння, усі ми змінилися."
  nf_brotherhood_elh_troika_rituals.701.a:0 "Разом ми — Велика Буря."

  nf_brotherhood_elh_troika_rituals.702.t:0 "Ритуал Трійки: Відкинуті"
  nf_brotherhood_elh_troika_rituals.702.d:0 "У нас не було браку у свідках. Кожен командир Лицарів, Паладинів чи Посвячених вирушив із нами до Світіння, щоб віддзеркалити подорож Трійки.\n\nУсі зібралися, щоб стати свідками того, як Трійка знову занурюється в Котел Переродження — спуск у найглибші частини Світіння.\n\nПісля повернення вони не запросили жоден інший капітул повторити їхнє досягнення, і церемонія закінчилася з певним ступенем спантеличення. Члени їхнього капітулу засвідчили про зміни... але ми не змогли їх побачити. Тим не менш, багато хто з нас ніколи раніше не розмовляв напряму з іншими лідерами на церемонії, і нові узи Братерства кувалися у світлі Світіння.\n\nАле всіх нас об'єднувало одне питання без відповіді: «Який у всьому цьому був сенс?»"
  nf_brotherhood_elh_troika_rituals.702.a:0 "Це все одно було зібрання рівних."
  nf_brotherhood_elh_troika_rituals.702.b:0 "Яка зарозумілість."

  nf_brotherhood_elh_troika_rituals.703.t:0 "Ритуал Трійки: Винагорода"
  nf_brotherhood_elh_troika_rituals.703.d:0 "Ми запрошували капітул за капітулом повторити наше досягнення, і з кожним кроком ми цитували ключові уривки з Апокрифу Трійки, дозволяючи напівзруйнованим стінам цього об'єкта часів Великої Війни нести істину.\n\nНа той час, коли ми знову вийшли з Котла, усі ми змінилися.\n\nТепер ми завершуємо вогонь."
  nf_brotherhood_elh_troika_rituals.703.a:0 "Разом ми — Велика Буря."

  nf_brotherhood_elh_identity.9.t:0 "Наше ім'я"
  nf_brotherhood_elh_identity.9.d:0 "Роками нас знали як Лост-Гіллз, на честь нашої початкової операційної бази в Каліфорнії. Однак, оскільки опір згас, а вимоги до управління зросли, ми повинні обміркувати наслідки перейменування на Каліфорнійське Братство.\n\nСтарійшини-ромбіанці та деякі реформатори стверджують, що зміна назви відображатиме нашу нову реальність. Каліфорнія всіяна новими імпровізованими воєнними меморіалами: вигорілими будівлями, поваленими лініями електропередач, новими кратерами, що збирають радіоактивну дощову воду, і громадами, які були знищені або очищені й ніколи не повернуться. Громадяни Каліфорнії сильно постраждали під час війни, і для Братства життєво важливо показати, що тепер ми є частиною зусиль із відбудови — не як іноземні деспоти, а як постійні жителі.\n\nОднак старійшини-максоніанці з насторогою ставляться до цих змін. Незаперечно, що урядові бункери Лост-Гіллз є нашим домом, але вони вважають, що навіть якщо ми перейменуємо себе і відправимо Старійшин до Шейді-Сендс, справжня влада завжди залишатиметься тут, у цих бункерах.\n\nВони стверджують, що ми повинні зберегти назву Лост-Гіллз як нагадування про наше минуле, а також продовжувати шанувати традиції та цінності, які так довго спрямовували нас. Зробити щось інше означало б зруйнувати спадщину Максона, не довівши його цілі до кінця — за одним винятком. Старійшина Ангарад запропонувала прийняти обидва аспекти, взявши собі назву Західне Братство Сталі, оскільки ми переслідуємо цілі Максона шляхом возз'єднання з нашими втраченими Капітулами.\n\nНарешті, решта реформаторів стверджує, що шлях попереду буде довгим і важким, але якщо ми прагнемо зробити все можливе, щоб допомогти народу Каліфорнії відбудуватися, то нова назва покаже, що віднині ми вважаємо всіх каліфорнійців своїми братами і сестрами, і що ми готові вітати їх у наших лавах."
  nf_brotherhood_elh_identity.9.a:0 "Товариство та партнерство"
  nf_brotherhood_elh_identity.9.b:0 "Історія та традиції"
  nf_brotherhood_elh_identity.9.c:0 "Коріння та походження"
  nf_brotherhood_elh_identity.9.e:0 "§RПочати знову§!"

  nf_brotherhood_elh_ncr_relations.10.t:0 "$bos_nf_legion_defense_pact$?"
  nf_brotherhood_elh_ncr_relations.10.d:0 "Фракція реформаторів [BOS.getName] запропонувала пакт про взаємооборону проти наближення загрози Легіону Цезаря в обмін на адміністративний контроль над усім штатом Максон. Вони не нав'язуватимуть громадянам Кодекс і поважатимуть нашу конституцію. На відміну від інших фракцій у [BOS.getName], вони глибоко поважають Республіку. Наші шпигуни повідомляють, що їхня фракція розколота між закликами до війни з нами та проханнями про надання статусу штату, і відмова їм неодмінно покладе край цим дебатам.\n\nХоча їхня допомога та допомога їхніх вцілілих Капітулів була б дуже корисною, ми могли б їм відмовити. Якщо ми це зробимо, нам слід атакувати їх до того, як Легіон перетне Довгу 15, інакше ми майже напевно зазнаємо нападу зсередини.\n\n§B Згода дозволить НКР, Братству Сталі, Територіям Мохаве або Капітулу Мохаве закликати одне одного до війни з Легіоном, якщо хтось із них опиниться у стані війни. [BOS.GetName] також зможе запросити до Братства капітули Мохаве, Вартових і Сан-Франциско, якщо вони існують.\n\n Відмова дозволить [BOS.getName] надіслати ультиматум щодо штату Максон, якщо [NCR.getName] досягне прогресу капітуляції під час своєї війни проти Легіону."
  nf_brotherhood_elh_ncr_relations.10.a:0 "Прийняти"
  nf_brotherhood_elh_ncr_relations.10.b:0 "Відхилити"

bos_legion_defence_pact_call:0 "Заклик до війни учасників $bos_nf_legion_defense_pact$"
  bos_legion_defence_pact_call_desc:0 "Усі вцілілі учасники $bos_nf_legion_defense_pact$ відгукнуться на заклик до війни."
  legion_defence_pact_member:0 "Учасник $bos_nf_legion_defense_pact$"
  nf_brotherhood_elh_ncr_relations.10001.t:0 "$bos_nf_legion_defense_pact$: Запрошення"
  nf_brotherhood_elh_ncr_relations.10001.d:0 "Фракція реформаторів [BOS.getName] запропонувала пакт про взаємооборону проти наближення загрози Легіону Цезаря, який було ратифіковано [NCR.getName]. На відміну від інших фракцій у [BOS.getName], вони глибоко поважають Республіку. Наші шпигуни повідомляють, що їхня фракція розколота між закликами до війни з нами та проханнями про надання статусу штату.\n\n§B Згода дозволить НКР, Братству Сталі, Територіям Мохаве або Капітулу Мохаве закликати одне одного до війни з Легіоном, якщо хтось із них опиниться у стані війни. [BOS.GetName] також зможе запросити до Братства капітули Мохаве, Вартових і Сан-Франциско, якщо вони існують.\n\n Відмова залишить нас осторонь угоди."
  nf_brotherhood_elh_ncr_relations.10001.a:0 "Прийняти"
  nf_brotherhood_elh_ncr_relations.10001.b:0 "Відхилити"

  nf_brotherhood_elh_ncr_relations.10002.t:0 "Укладено $bos_nf_legion_defense_pact$"
  nf_brotherhood_elh_ncr_relations.10002.d:0 "Фракція реформаторів [BOS.getName] запропонувала [NCR.getName] пакт про взаємооборону проти нас. Ми не можемо їх зупинити, але ми маємо підготувати протиброньове озброєння, щоб упоратися із загрозою з боку кількох капітулів Братства.\n\n§B Угода дозволяє НКР, Братству Сталі, Територіям Мохаве або Капітулу Мохаве закликати одне одного до війни з Легіоном, якщо хтось із них опиниться у стані війни. [BOS.GetName] також зможе запросити до Братства капітули Мохаве, Вартових і Сан-Франциско, якщо вони існують."
  nf_brotherhood_elh_ncr_relations.10002.a:0 "Ми проведемо особливу підготовку."

  nf_brotherhood_elh_ncr_relations.10003.t:0 "$bos_nf_legion_defense_pact$"
  nf_brotherhood_elh_ncr_relations.10003.d:0 "[NCR.getName] прийняла нашу пропозицію щодо Пакту про взаємооборону. Ми поважатимемо конституцію та громадянські права НКР в обмін на адміністративний контроль над штатом Максон. НКР сподівається, що це прелюдія до нашого прохання про надання статусу штату, але, незважаючи на це, ми триматимемо плани битв проти них напоготові. Щоразу, коли учасник пакту буде готовий, він зможе закликати нас до війни проти Легіону."
  nf_brotherhood_elh_ncr_relations.10003.a:0 "Чудово."

  nf_brotherhood_elh_ncr_relations.10004.t:0 "$bos_nf_legion_defense_pact$: НКР відхилила пропозицію"
  nf_brotherhood_elh_ncr_relations.10004.d:0 "[NCR.getName] відхилила нашу пропозицію Пакту про взаємооборону. Можливо, вони просто не бачать у ньому потреби, або ж підозрюють, що ми все одно розпочнемо війну, щойно вони будуть ослаблені Легіоном."
  nf_brotherhood_elh_ncr_relations.10004.a:0 "У Легіону перевага. Готуймося."

  nf_brotherhood_elh_ncr_relations.10005.t:0 "$bos_nf_legion_defense_pact$: Війна!"
  nf_brotherhood_elh_ncr_relations.10005.d:0 "[FROM.getName] закликала нас до війни на умовах $bos_nf_legion_defense_pact$! Наші війська готуються."
  nf_brotherhood_elh_ncr_relations.10005.a:0 "Ми виступаємо на Легіон!"

  nf_brotherhood_elh_ncr_relations.10006.t:0 "[BOS.getName] вимагає Максон!"
  nf_brotherhood_elh_ncr_relations.10006.d:0 "Після нашої відмови від їхнього пакту, [BOS.getName] використовує можливість, яку надала наша війна з Легіоном. Вони вимагають негайної передачі їм раніше запитаних територій Максона, інакше ми зустрінемося з ними на полі бою. Якщо ми погодимося, вони підпишуть з нами пакт про ненапад, але не допоможуть нам проти Легіону."
  nf_brotherhood_elh_ncr_relations.10006.a:0 "Сталева загроза закінчується сьогодні!"
  nf_brotherhood_elh_ncr_relations.10006.b:0 "Ми маємо погодитися..."
  bos_ncr_war_or_land_tt:0 "§CІмовірність того, що НКР погодиться, вища, якщо їхня фракція рівна за силами або програє.§! Якщо НКР §Rвідхилить§! наші вимоги, §Rми негайно оголосимо війну§!, але якщо вони §Gпогодяться§!:"

  bos_legion_defence_pact_demand_moj_reinstatement:0 "Вимагати відновлення Капітулу Мохаве"
  bos_moj_reinstatement_ai_tt:0 "§CІмовірність того, що НКР погодиться на ваші вимоги, зростає в міру того, як чисельність вашої армії наближається до їхньої, не враховуючи союзників. Як тільки ваша армія становить бодай п'яту частину їхньої, вони починають схилятися до згоди, з огляду на очікувану якість ваших дивізій.§!"
  nf_brotherhood_elh_ncr_relations.10007.t:0 "[BOS.getName] вимагає Мохаве!"
  nf_brotherhood_elh_ncr_relations.10007.d:0 "Після нашої повторної окупації пустелі Мохаве [BOS.getName] вимагає від нас передати контроль Братству Мохаве під загрозою анулювання пакту. Вони планують відновити капітул під контрольованим керівництвом і обіцяють, що більше не буде жодних вимог до нас щодо збереження Пакту. Наші шпигуни повідомили нам, що немає жодних гарантій того, що вони здійснять свою погрозу, але §Bщо ближче збройні сили [BOS.getName] до паритету з нашими, то більша ймовірність цього.§! Якщо їм вдалося перевершити нас за чисельністю, їхнє анулювання Пакту практично гарантоване, і нам слід очікувати, що вони оголосять війну, щойно закінчиться термін дії наших договорів."
  nf_brotherhood_elh_ncr_relations.10007.a:0 "Відхилити, вони нам не потрібні."
  nf_brotherhood_elh_ncr_relations.10007.b:0 "[BOS.getLeader] сьогодні нажив(ла) собі ворога, але ми погоджуємося."

  nf_brotherhood_elh_ncr_relations.10008.t:0 "[NCR.getName] відхиляє наші вимоги!"
  nf_brotherhood_elh_ncr_relations.10008.d:0 "[BOS.getLeader], [NCR.getLeader] відхилив(ла) наші вимоги повернути [MOJ.getName] у Мохаве. Вони вважають, що війна настільки повернулася на їхню користь, що вони зможуть стримати Легіон і без нас."
  nf_brotherhood_elh_ncr_relations.10008.a:0 "Тоді ми анулюємо наш Пакт і готуємося до тотальної війни."
  nf_brotherhood_elh_ncr_relations.10008.b:0 "[NCR.getLeader] сьогодні нажив(ла) собі ворога, але Легіон необхідно зупинити."

  nf_brotherhood_elh_ncr_relations.10009.t:0 "[NCR.getName] відхиляє відновлення Капітулу Мохаве!"
  nf_brotherhood_elh_ncr_relations.10009.d:0 "[NCR.getLeader] відхилив(ла) вимоги [BOS.getLeader] щодо повернення [MOJ.getName] у Мохаве. Війна змінилася настільки, що вони впевнені, що зможуть стримати Легіон і без нас, і [BOS.getLeader] наказав(ла) негайно припинити бойові дії з [CES.getName]. Поза сумнівом, ми побачимо війну з переможцем, щоб передати Каліфорнію в надійні руки, і тому Старійшини наказали нам продовжувати залишатися в стані бойової готовності."
  nf_brotherhood_elh_ncr_relations.10009.a:0 "[NCR.getLeader] — дурень(ка)."

  nf_brotherhood_elh_ncr_relations.100010.t:0 "Відродження [MOJ.getName]"
  nf_brotherhood_elh_ncr_relations.100010.d:0 "[NCR.getLeader] погодився(лася) на вимоги [BOS.getLeader] щодо повернення [MOJ.getName] у Мохаве. Просто зараз ті, хто вижив, вигнанці та колоністи-добровольці прямують назад у Мохаве, щоб відновити операції Братства в регіоні. Мине деякий час, перш ніж у [MOJ.getName] знову з'явиться свій Старійшина, але, схоже, пріоритетом є переозброєння для боротьби з [CES.getName]. Боротьба за владу в Каліфорнії між [NCR.getName] і [BOS.getName] майже гарантована, поки Конгрес НКР ковтає цю гірку пігулку."
  nf_brotherhood_elh_ncr_relations.100010.a:0 "Ad Victoriam!"
  nf_brotherhood_elh_ncr_relations.100010.b:0 "Ця війна надто дорога."
  nf_brotherhood_elh_ncr_relations.100010.c:0 "Лицар і Ведмідь неодмінно битимуться знову, коли [CES.getName] буде переможено."

  nf_brotherhood_elh_ncr_relations.100011.t:0 "[BOS.getName] анулює $bos_nf_legion_defense_pact$"
  nf_brotherhood_elh_ncr_relations.100011.d:0 "[NCR.getLeader] відхилив(ла) вимоги [BOS.getLeader] щодо відновлення Капітулу Мохаве як єдиного контролера Мохаве. Просто зараз Братство, що підписало Пакт, відкликає свої війська з боротьби проти Легіону, давши зрозуміти [NCR.getLeader], що такими будуть наслідки відмови. Боротьба за владу в Каліфорнії між [NCR.getName] і [BOS.getName] майже гарантована, оскільки [NCR.getLeader] применшує серйозність ситуації, попри вимогу до Конгресу ухвалити новий раунд екстреного фінансування Збройних сил."
  nf_brotherhood_elh_ncr_relations.100011.a:0 "Вони ніколи не виживуть без нас."
  nf_brotherhood_elh_ncr_relations.100011.b:0 "Ми переможемо без них."
  nf_brotherhood_elh_ncr_relations.100011.c:0 "Лицар зрадив Ведмедя."

  nf_brotherhood_elh_ncr_relations.100012.t:0 "[BOS.getName] не анулює $bos_nf_legion_defense_pact$"
  nf_brotherhood_elh_ncr_relations.100012.d:0 "Хоча [NCR.getLeader] і відхилив(ла) вимоги [BOS.getName], вони не анулювали Пакт. Схоже, ви розкусили їхній блеф! Конгрес дуже радий цій новині, і ми зможемо ухвалити деякі закони на хвилі цих гарних новин."
  nf_brotherhood_elh_ncr_relations.100012.a:0 "Вихід Пакту прирік би їх на загибель, і вони це знають."

  nf_brotherhood_elh_ncr_relations.100013.t:0 "Розширення операцій: у повітрі та на морі"
  nf_brotherhood_elh_ncr_relations.100013.d:0 "[NCR.getLeader] зменшив(ла) тиск на нас, що свідчить про подальше послаблення напруженості. У нас є можливість перенести креслення військово-морських або авіаційних технологій з наших голодисків до рук виробників по всьому Максону. Якщо ми виберемо авіацію, то матимемо змогу й надалі зосереджуватися на цій сфері та підготувати §BАвіабази закордонних капітулів§! і §BПрактикувати тактику повітряного десантування§!, а також значно спростити дослідження літальних апаратів. Створення флоту дозволить нам §BПроводити експедиції через Тихий океан§! і почати створювати військово-морські сили з нуля. Мине чимало місяців, перш ніж Конгрес достатньо заспокоїться, щоб ми могли зробити це знову, §Bтому нам слід обирати з розумом.§!"
  nf_brotherhood_elh_ncr_relations.100013.a:0 "Давайте просто відновимо наші сили."
  nf_brotherhood_elh_ncr_relations.100013.b:0 "Анкорідж надто багатонадійний, щоб його ігнорувати."
  nf_brotherhood_elh_ncr_relations.100013.c:0 "Схід досяг великого успіху зі своїми військово-повітряними силами."

  nf_brotherhood_elh_ncr_relations.100014.t:0 "Максон віддано"
  nf_brotherhood_elh_ncr_relations.100014.d:0 "[NCR.getLeader] прийняв(ла) наш ультиматум щодо Максона в обмін на пакт про ненапад. Наші окуповані бункери навколо Максона також вивільняють свої стандартні сили, оскільки координований удар по всьому штату більше не потрібен.\n\nНарод Максона досить охоче нас прийняв, і цей час підготовки дає нам можливість відтворити флот або інвестувати в наші військово-повітряні сили.\n\nЯкщо ми виберемо авіацію, то матимемо можливість і надалі зосереджуватися на цій сфері та підготувати §BАвіабази іноземних капітулів§! і §BПрактикувати тактику повітряного десантування§!, а також значно спростити дослідження літальних апаратів. Створення флоту дозволить нам §BПроводити експедиції через Тихий океан§! і почати створювати військово-морські сили з нуля.\n\nМи не матимемо змоги підготувати інший рід військ до початку війни, §Bтому нам слід обирати з розумом.§!"
  nf_brotherhood_elh_ncr_relations.100014.a:0 "Давайте просто відновимо наші сили."
  nf_brotherhood_elh_ncr_relations.100014.b:0 "Анкорідж надто багатонадійний, щоб його ігнорувати."
  nf_brotherhood_elh_ncr_relations.100014.c:0 "Схід досяг великого успіху зі своїми військово-повітряними силами."

  nf_brotherhood_elh_events.11.t:0 "Каліфорнія у вогні"
  nf_brotherhood_elh_events.11.d:0 "[BOS.getLeader],\n\nСитуація в Каліфорнії стала жахливою. Наша окупація НКР зустріла безжальну відповідь з боку Баронів на чолі з Антоном Флінном, які посилили контроль над постачанням продовольства з руйнівними наслідками.\n\nЦіни на продукти харчування стрімко зросли, внаслідок чого людям по всій Каліфорнії важко поставити їжу на стіл, а найбідніші вже голодують.\n\nКоли ми вирушили на землі Баронів, щоб розслідувати причину цього, ми зіткнулися з насильством: зерносховища були спалені, а худоба чоловічої статі вирізана.\n\nОчевидно, що Барони готові піти на все, щоб зберегти свою владу, навіть якщо це означає заморити голодом народ Каліфорнії. Ми зменшили свою присутність на землях Баронів, щоб уникнути нестримного голоду, але Барони продовжують впливати на те, чи настане цей голод, коли він настане і наскільки суворим він буде.\n\nЄ й хороші новини — Південна Каліфорнія все ще виробляє і продає продовольство. Але оскільки Барони контролюють таку велику частку ферм і худоби в НКР, ми повинні діяти швидко, щоб гарантувати, що жителі Каліфорнії матимуть достатній доступ до їжі, необхідної їм для виживання.\n\nНаполегливо просимо вас ретельно обдумати наступні кроки. Якщо ми не почнемо діяти найближчим часом, наслідки можуть бути катастрофічними.\n\n— Старші Лицарі Шон і Даніель Діаз, сільськогосподарські інспектори\n\n$bos_coring_disabled$"
  nf_brotherhood_elh_events.11.a:0 "Це стане проблемою."

  bos_generic_prestige:0 "Добре керована бюрократія"
  bos_generic_prestige_desc:0 "Ми доклали цілеспрямованих зусиль для ефективного управління. Навіть дрібні бюрократи, які не приєдналися до Братства, пройшли скорочену підготовку писарів із разючими результатами."
  bos_maxsonian_prestige:0 "Визнання нових ветеранів"
  bos_maxsonian_prestige_desc:0 "Ми пройшли багато війн, і давно настав час підвищувати у званні нових Паладинів. Однак дехто продемонстрував інші таланти — нам потрібно використовувати чудових командирів і лідерів підрозділів, видатних інструкторів з підготовки та всіх інших. Наші найбільші зусилля спрямовані на те, щоб знайти цих достойних людей і надати їм впливовіші посади, на яких вони б могли відзначитися."
  bos_rhombian_training_halls:0 "Створення регіональних тренувальних залів"
  bos_training_hall:0 "Зал Посвячених"
  bos_training_hall_desc:0 "Ромбіанці розгорнули свій проєкт у цьому штаті. Великий регіональний тренувальний центр збирає десятки, якщо не сотні, нових посвячених і залучає їх з повагою до культури, яку вони залишають позаду. Вони тренуються тут, доки ми не відчуємо гостру потребу прикликати їх на службу, або поки вони не стануть повноправними членами Братства. Більшість стануть Лицарями або Писарями, але обрані стануть Паладинами, Уланами або навіть служитимуть як Моряки. Прізвисько останніх — «Драгун» — залишається неофіційним."
  bos_reformer_prestige:0 "Витримуючи випробування часом"
  bos_reformer_prestige_desc:0 "Ми досягли загального покращення в освіті, правосудді та охороні здоров'я. Ми зосередилися на створенні міцного фундаменту для нашої цивілізації — наступниці Сполучених Штатів, а можливо, і чогось більшого."
  bos_troika_prestige:0 "Широке використання кібернетики"
  bos_troika_prestige_desc:0 "Ми субсидували витрати на кібернетику та імпланти, а для критично важливих працівників навіть зробили їх безкоштовними. У міру того, як вони набували ширшого поширення, ми бачимо переваги на національному рівні — і знаходимо все більше людей, здатних бачити крізь обман цього світу."

  kimball_cooperation:0 "Екс-президент §YАарон Кімбол§! підтримує Братство"
  hayes_cooperation:0 "Мер §YХейз§! «підтримує» Братство"
  allgood_cooperation:0 "Екс-сенатор §YОлгуд Мерфі§! підтримує Братство"
  ignacio_cooperation:0 "§YІгнасіо Ріваса§! запрошено до уряду"
  nf_brotherhood_no_baron_deal_tt:0 "\nСпівпраця з Олгудом §Rзавадить§! нам укласти угоду з §YБаронами.§!"
  allgood_expects_environmental_act_tt:0 "\nУлюблений законопроєкт Олгуда, §YЗакон про відновлення довкілля,§! буде доступний для реалізації як §Yрішення.§! Яке дає:\n\n"
  nf_brotherhood_allows_baron_deal_tt:0 "\nСпівпраця з Кімболом §Gдозволить§! урядам на чолі з §YМаксоніанськими§! або §YРомбіанськими§! старійшинами §Yукласти угоду з Баронами.§!"
  nf_brotherhood_hayes_way_baron_deal_tt:0 "\nСпівпраця з Хейзом §Rвимагатиме§! від нас дотримуватися їхнього плану боротьби з §YБаронами.§!"
  nf_brotherhood_no_help_baron_deal_tt:0 "\nБез угоди Барони не будуть вести переговори зі старійшинами істеблішменту. Тільки лідерство §Y[BOS_llwyd.getName]§! або §Y[BOS_rhiannon.getName]§! дасть нам можливість."
  nf_brotherhood_hayes_expects_investment_tt:0 "\nХейз розробить план для §Yприватного військового виробництва§!, який ми зможемо реалізувати як §Yрішення.§! Яке дає:\n\n"
  nf_brotherhood_hayes_allgood_protection_tt:0 "\nЇхня підтримка зменшить падіння покори в разі посилення голоду з §R-25%§! §YПокори§! до §R-15%.§!"
  nf_brotherhood_kimball_protection_tt:0 "Їхня підтримка зменшить падіння покори в разі посилення голоду з §R-25%§! §YПокори§! до §R-10%.§!"
  stronger_lost_hills_ncr_occupation:0 "Рішення щодо окупації НКР"

  bos_ncr_hayes_plan:0 "Затвердити індустріальний план Хейза"
  bos_ncr_allgood_environment_plan:0 "Ухвалити Закон Олгуда про відновлення довкілля"
  nf_brotherhood_elh_events.14.t:0 "Закон про відновлення довкілля"
  nf_brotherhood_elh_events.14.d:0 "Олгуд Мерфі повідомив новину по радіо. «Занадто довго Каліфорнія ризикувала піти тим самим шляхом, що й Америка. Ми вирубали могутні секвої, ми виснажили ґрунт і осушили озера для наших врожаїв. Ми отруїли океан нашими відходами настільки, що наші береги стали домівкою лише для кісток і луски.\n\nТепер цьому настав кінець. Сьогодні одні з найкращих учених Каліфорнії вирішили присвятити своє життя відновленню Пусток. Це робота для багатьох поколінь! Хоча світ може тяжіти до руйнування, ми повинні спробувати щось змінити. Сьогодні, разом з [BOS.getName], ця робота починається»."
  nf_brotherhood_elh_events.14.a:0 "Олгуд виголошує гарну промову."

  bos_ncr_field_scribes_farming:0 "Посвячені в багнюці"
  bos_ncr_field_scribes_farming_desc:0 "Ми відправили наших Посвячених працювати на сільськогосподарських угіддях по всій Північній Каліфорнії під наглядом Писарів або Лицарів. Вони цьому не раді, але це тимчасово."
  bos_ncr_field_scribes_farming_light:0 "Сільськогосподарський субординаційний ланцюг"
  bos_ncr_field_scribes_farming_light_desc:0 "Ми відправили деяких наших Посвячених працювати на сільськогосподарських угіддях по всій Північній Каліфорнії як тимчасових працівників. Досвідчених фермерів і власників ранчо, які чекали можливості керувати власними фермами, або їхніх синів і дочок, готових розширити сімейний бізнес, було обрано для довгострокового управління цими місцями. Їм знадобляться місяці, щоб найняти надійних працівників, тож наші посвячені вперше виконують накази цивільних."
  bos_worker_coops:0 "Сільськогосподарські робітничі кооперативи"
  bos_worker_coops_desc:0 "Ромбіанці вирішили, що найкращий спосіб покласти край проблемам на Півночі — це передати батракам і працівникам ранчо пряме право власності на землю, яку вони обробляють. Це стало великим успіхом для місцевої покори."
  bos_worker_discontent:0 "Невдоволені працівники"
  bos_worker_discontent_desc:0 "З тієї чи іншої причини працівники тут розлючені на уряд. Вони працюють суворо за правилами, що призводить до збільшення втрат обладнання та неефективного виробництва."

#Peaceful version of 16.
  nf_brotherhood_elh_events.1601.t: "Барони: Зустріч за вечерею"
  nf_brotherhood_elh_events.1601.d: "На околицях Реддінга [BOS.getLeader], а також троє інших лідерів відвідують дипломатичну вечерю в маєтку Антона Флінна. Сама зала тепла та затишна, і багато ключових Баронів прибули, щоб обговорити свої претензії. Однак за розкішшю зали криється правда — маєток Антона кишить охоронцями з обох боків. Паладин у парі з якимось найманцем — це навряд чи рівний бій, але ми в меншості глибоко на ворожій території. Наші найближчі бази також перебувають у стані підвищеної готовності, готові висадити тут десант протягом пів години після нашого виклику. Нарешті, за наполяганням [BOS.getLeader], було схвалено добровільне використання «Стелс-боїв», і на території переховується ще більше Паладинів, про всяк випадок.\n\nПовернувшись до вечері, Антон виголошує свою промову: «[BOS.getLeader], я стою перед вами сьогодні не як супротивник, а як голос розуму і прихильник нашого спільного бачення процвітання. Я розумію ваш скептицизм щодо Баронів і наших дій, але благаю вас вислухати нас неупереджено. Нестримний голод, що мучить нашу велику націю, не був нашим наміром, а став непередбачуваним наслідком наших зусиль із захисту власних інтересів. Проте цей виклик також дає можливість для спокути.\n\nНаша сільськогосподарська міць, хоч і величезна, спричинила труднощі серед народу Каліфорнії. Наші розбіжності стали отрутою для людей, але я — ми — запевняємо вас, що ще є час усе виправити.\n\nНаші ферми можуть знову процвітати й годувати голодні маси, але ми не впораємося з цим самотужки. Те, що не під силу виправити комусь одному з нас, можна виправити разом. Ми визнаємо досвід і силу Братства, і лише з вашим керівництвом та допомогою ми зможемо покласти край цій кризі. Ми пропонуємо співпрацю, партнерство, якщо хочете, де наші ресурси та досвід будуть повною мірою використані по всій Каліфорнії заради загального блага. Об'єднаймо наші зусилля і почнемо зцілювати нові шрами нашої великої нації.\n\nБрати і Сестри, доля Каліфорнії лежить у наших руках, і разом ми можемо зробити те, що запам'ятається на покоління».\n\nБільше подробиць про те, чого саме вимагали Барони, з'ясовувалося протягом вечора... але, зрештою, все було досить просто: амністія для більшості Баронів, включаючи Антона Флінна, повернення правил ведення бізнесу в сільськогосподарському секторі часів Кімбола, а також шанс виправити свій імідж у центральній та південній Каліфорнії. Ми могли б зробити це, не знищуючи себе політично, але що завадить Баронам спробувати знову, коли ми будемо виснажені якоюсь майбутньою війною?"
  nf_brotherhood_elh_events.1601.a: "Прийняти угоду."
  nf_brotherhood_elh_events.1601.b: "Зробити вигляд, але продовжити демонтаж влади Баронів."
  nf_brotherhood_elh_events.1601.maxsonians: "§PПрийняти, але ніякої амністії для найгірших злочинців.§!"
  nf_brotherhood_elh_events.1601.rhombians: "§gПрийняти, але розробити нові механізми захисту для незалежних фермерів.§!"
  nf_brotherhood_elh_events.1601.reformers: "§CПрийняти, адже фермери Півдня тепер мають власну асоціацію.§!"
  nf_brotherhood_elh_events.1601.troika: "§RВикористати цю можливість, щоб укласти кілька угод і розколоти Баронів.§!"
  nf_brotherhood_anton_as_advisor_tt: "§YАнтона Флінна§! буде найнято як §Yрадника з питань культури§!."
  anton_flynn_disempowered: "Антон Флінн пішов з політичного життя."
  bos_ncr_baron_cooperation_unified: "Спільне партнерство БС та Баронів"
  bos_ncr_baron_cooperation_unified_desc: "Ми ухвалили рішення співпрацювати з Баронами, ігноруючи, мінімізуючи або іншим чином уникаючи здійснення правосуддя в політичному та соціальному плані, принаймні в більшості випадків. Натомість Барони спрямували свої ресурси на усунення наслідків заворушень на півночі, а їхні підприємства інвестують, сплачують більшість податків та іншим чином діють для стимулювання економіки. Вони залишаються корумпованими, але не бунтівними, оскільки ми повернулися до правил Ери Кімбола в їхньому основному бізнесі — сільському господарстві."
  bos_ncr_baron_cooperation_fractured: "Розколоті брамінні барони"
  bos_ncr_baron_cooperation_fractured_desc: "Ми уклали угоди про амністію з окремими Баронами. Натомість ці Барони спрямували свої ресурси на усунення наслідків заворушень на півночі, а їхні підприємства інвестують, сплачують більшість податків та іншим чином діють для стимулювання економіки. Вони залишаються корумпованими, але не бунтівними, оскільки ми повернулися до правил Ери Кімбола в їхньому основному бізнесі — сільському господарстві. Активи тих Баронів, які не змогли укласти з нами угоду, діляться між державою та власниками ранчо, з певними відкатами для тих Баронів, які підписали угоду першими."

  #Hayes version of 16
  nf_brotherhood_elh_events.1602.t: "Барони: Хейз"
  nf_brotherhood_elh_events.1602.d: "Грант К. Хейз нарешті завершив план знищення Баронів. Ретельно координувалася кампанія з дискредитації Антона Флінна та Баронів — радіопередачі та новинні програми показували всі докази того, що Барони кинули каліфорнійців напризволяще. Хейз виголосив промову: «Правда полягає в тому, і це приховували від вас люди з Реддінга, що нестачі їжі немає. Не було ніяких хвороб серед худоби і ніякого грибка в зерносховищах. Я був на фермах, захоплених Братством, і обіцяю всім каліфорнійцям, що в цьому вони кажуть правду.\n\nЦе правда, що занадто багато їжі знаходиться в руках Антона Флінна та його поплічників. Ці барони хотіли б, щоб ви, працьовиті батраки, спалювали власну їжу заради обіцянок майбутнього багатства. Але я маю кращу пропозицію. За моїм податковим планом Барони залишаться ні з чим, а їхня власність перейде до їхніх працівників. Їхнє багатство буде використано для того, щоб знову знизити ціни на продовольство і дати кожному з вас будинок із білим парканом. Сьогодні ввечері ваші боси накажуть вам працювати з ножем або вогнем у руках. Але все, що ви маєте зробити — це піти додому. Залиште свої ранчо, покиньте амбари. Братство йде, і до ранку тут буде нове керівництво».\n\nУже підірвавши підтримку, яку надавали Хаб, Торговці зброєю та Старий уряд, ми повністю ізолювали Реддінг. Після промови Хейза як сигналу, багато десятків загонів синхронно зайшли на землі Баронів. Деякі зіткнулися з опором — здебільшого з боку неброньованих лоялістів із лазерними пістолетами та мисливськими гвинтівками — але більшість знайшла працівників, які були готові, ба навіть прагнули допомогти їм покласти край цьому божевіллю."
  nf_brotherhood_elh_events.1602.a: "І так падають Барони."

  ##Followup event to 16
  nf_brotherhood_elh_events.1603.t: "Барони: Реакція народу"
  nf_brotherhood_elh_events.1603.d: "Після наших зусиль із приборкання Баронів уся Північна Каліфорнія відреагувала на зміни в Реддінгу. Будемо сподіватися, що ми не зайшли занадто далеко..."
  nf_brotherhood_elh_events.1603.a: "...Або недостатньо далеко."

  #Flynn arrest event
  nf_brotherhood_elh_events.1604.t: "Барони: Публічний арешт Антона Флінна"
  nf_brotherhood_elh_events.1604.d: "Антон Флінн у наручниках. Ми максимально розголосили цю подію — від газет до радіо й телебачення, кожна головна новина скрізь присвячена людині, яка морила Каліфорнію голодом. На своїй останній публічній фотографії він виглядає самовдоволеним — це посмішка людини, яка все ще вірить, що її зв'язки зі Старим урядом захистять її. Наступні місяці, протягом яких від нього відхрещуватимуться Барони й Асоціація скотарів у цілому, а також проповіді про зло нестримного кумівства, незабаром позбавлять його цієї ілюзії."
  nf_brotherhood_elh_events.1604.a: "Своєрідне правосуддя."

  #CES ceasefire with BoS
  nf_brotherhood_elh_legion_relations.17.t: "Поранене Братство скаржиться на несправедливість"
  nf_brotherhood_elh_legion_relations.17.d: "[CES.getLeader], Сталеві Щури скиглять. Вони благають про милість перед міццю Легіону. Вони визнають наші претензії на Мохаве та дамбу Гувера і пропонують території в Південно-Східній Каліфорнії, якщо ми погодимося на перемир'я."
  nf_brotherhood_elh_legion_relations.17.a: "Так, давайте поки зосередимося на Племенах."
  nf_brotherhood_elh_legion_relations.17.b: "Вони не отримають милості. Ми йдемо на Західне узбережжя."
  bos_ncr_famine_offer_legion_concessions_for_peace: "Ми запропонуємо Легіону всі §Yкаліфорнійські§! території та території §YМохаве§! на §Yсхід§! від караванних шляхів §YРандсбург–Палм-Спрінгс§! і на §Yпівніч§! від §YСолтон-Сіті§! в обмін на §Gперемир'я§! терміном на 1 рік."

  nf_brotherhood_elh_legion_relations.1701.t: "[FROM.getName] підписує перемир'я між БС та Легіоном"
  nf_brotherhood_elh_legion_relations.1701.d: "[FROM.getLeader] підписав(ла) перемир'я між БС та Легіоном. Братство відмовилося від численних територій вздовж річки Колорадо в обмін на однорічне перемир'я. Це практично гарантує, що лінією фронту у війні буде не Дамба, а самі Могильник і Шейді-Сендс."
  nf_brotherhood_elh_legion_relations.1701.a: "Це буде кривава бійня."

  nf_brotherhood_elh_legion_relations.1702.t: "[FROM.getName] відхиляє перемир'я між БС та Легіоном"
  nf_brotherhood_elh_legion_relations.1702.d: "[FROM.getLeader] відмовився(лася) підписати перемир'я між БС та Легіоном. Миру з Легіоном не буде."
  nf_brotherhood_elh_legion_relations.1702.a: "Ми битимемося до кінця."

  nf_brotherhood_bunkered_divisions.1.t: "Кінець перемир'я"
  nf_brotherhood_bunkered_divisions.1.desc: "Усі старійшини згодні — у Каліфорнії немає іншої надії, крім нас. Немає гідного спадкоємця, якого ми могли б скеровувати, а помилки [NCR.getLeader] нас зовсім не вразили.\n\nНаші приготування завершено, кожен бункер у штаті Максон відновлено та знову укомплектовано персоналом. Ми попередили жителів Максона про прийдешній конфлікт, і багато громадян побачили тисячі тріщин, через які НКР неминуче розпадеться. Тільки ми можемо захистити Людство."
  nf_brotherhood_bunkered_divisions.1.a: "Вже за кілька днів ми йдемо на війну."
  nf_brotherhood_bunkered_divisions.1.b: "AD VICTORIAM!"

  bos_delayed_expedition_small: "Паладини трохи затримуються"
  bos_delayed_expedition_medium: "Паладини затримуються"
  bos_delayed_expedition_large: "Паладини дуже затримуються"
  bos_delayed_expedition2_small: "Обидві групи Паладинів трохи затримуються"
  bos_delayed_expedition2_medium: "Обидві групи Паладинів затримуються"
  bos_delayed_expedition2_large: "Обидві групи Паладинів дуже затримуються"
  bos_delayed_scribes_small: "Писарі трохи затримуються"
  bos_delayed_scribes_medium: "Писарі затримуються"
  bos_delayed_scribes_large: "Писарі дуже затримуються"

  nf_brotherhood_expeditions.1.t: "Селище"
  nf_brotherhood_expeditions.1.d: "На околицях Міста Сховища знаходиться те, що мешканці Сховища називають «Селищем», незалежне радше через свою незначущість, ніж через щось інше. Під час нашого першого візиту багато років тому ми знищили місцеву популяцію кротощурів, яка, як ми дізналися, була їхнім єдиним засобом стримування Міста Сховища. Тоді мер поселення благав нас дати їм шанс відбитися, що спонукало лідера експедиції залишити їм надлишки зброї.\n\nТепер поселення виросло, з'явилися стіни і значне населення. Мер був радий дозволити нам тут перепочити, і ми дізналися, що кротощури таємничим чином повернулися і тепер є скалкою в оці мешканців Селища. Ми підозрюємо, що в цьому винна якась технологія, хоча, можливо, їм просто катастрофічно не щастить."
  nf_brotherhood_expeditions.1.a: "Знищити всіх кротощурів. Знову."
  nf_brotherhood_expeditions.1.b: "Ці кротощури потребують подальшого розслідування!"
  nf_brotherhood_expeditions.1.c: "Заснувати тут форпост — це піде на користь нам обом."

  ##expeditionary outposts idea loc
  bos_golgotha_mirroredshades: "Дзеркальні окуляри"
  bos_expeditionary_outposts_1: "Експедиційні форпости"
  bos_expeditionary_outposts_1_desc: "Один-два форпости за нашими кордонами, які використовуються мандрівними членами Братства Сталі для поповнення запасів найнеобхіднішого."
  bos_expeditionary_outposts_2: "Експедиційні форпости"
  bos_expeditionary_outposts_2_desc: "Розкидані форпости, що повертають частину ресурсів до Каліфорнії. Використовуються мандрівними членами Братства."
  bos_expeditionary_outposts_3: "Експедиційні форпости"
  bos_expeditionary_outposts_3_desc: "Складні, постійно укомплектовані форпости на Пустках, які допомагають мандрівним членам Братства та повертають значні ресурси до Каліфорнії."
  bos_expeditionary_outposts_4: "Експедиційні форпости"
  bos_expeditionary_outposts_4_desc: "Велика мережа підпільних форпостів, яка легко підтримує наші експедиції, а також виконує цінні завдання для Братства Сталі."
  bos_expeditionary_outposts_5: "Експедиційні форпости"
  bos_expeditionary_outposts_5_desc: "Розширення мережі наших форпостів, яке має вирішальне значення для наших постійних зусиль із встановлення контактів з іншими Капітулами, призвело до появи наглядових бункерів у великих містах по всій Північній Америці."
  bos_expeditionary_outposts_6: "Експедиційні форпости"
  bos_expeditionary_outposts_6_desc: "Наша невпинна експансія та відданість контактам з нашими форпостами й бункерами призвели до незаперечної присутності Братства по всій Америці. Возз'єднане Братство вже на горизонті. Ad Victoriam!"

  nf_brotherhood_expeditions.101.t: "Розслідування щодо кротощурів"
  nf_brotherhood_expeditions.101.d: "Через кілька тижнів експедиція з'ясувала правду: пошкоджений довоєнний геодезичний прилад його власники-гули використовували для пошуку чистої води на продаж.\n\nКоли гули зрозуміли, що прилад приваблює кротощурів, ця пара вирішила оселитися в одній із печер неподалік, де було багато води — «принаймні на кілька десятиліть». З пристроєм треба було щось робити, але гули також володіли навичками, бажаними для Селища, навіть окрім геодезії. Вони практично відбудували довоєнну вітальню у своїй печері, з відреставрованим довоєнним диваном, кількома різними випусками коміксу «Грогнак-варвар» та ручним котом!"
  nf_brotherhood_expeditions.101.a: "Вилучити пристрій для Писарів, але залишити їх у спокої."
  nf_brotherhood_expeditions.101.b: "Переконати їх приєднатися до Селища і передати пристрій Братству."
  nf_brotherhood_expeditions.101.c: "Стратити гулів. Забрати кота."

  nf_brotherhood_expeditions.2.t: "Світіння"
  nf_brotherhood_expeditions.2.d: "Світіння вкрай смертоносне. Лише одна людина — чужинець — коли-небудь поверталася з цієї опроміненої ями. Рада Писарів вважає, що сучасні технології в поєднанні з глибоким зануренням у наші запаси Рад-Х та Антирадину зроблять експедицію можливою, але не безпечною. Наша Рада Старійшин знає, що у Світінні може зберігатися багато таємниць Старого Світу, але... чим ми готові ризикнути?"
  nf_brotherhood_expeditions.2.a: "Відправити наших найкращих Паладинів."
  nf_brotherhood_expeditions.2.b: "Ризик занадто великий."
  nf_brotherhood_expeditions.2.maxsonians: "§PПообіцяти статус Паладинів групі Лицарів, якщо вони виживуть.§!"
  nf_brotherhood_expeditions.2.maxsonians_tt: "Людські ресурси:§R -300§!. \nЯкщо вони досягнуть успіху, ми отримаємо нову групу §YПаладинів§!"
  nf_brotherhood_expeditions.2.rhombians: "§gЯкщо ми заплатимо достатньо, чужинці підуть.§!"
  nf_brotherhood_expeditions.2.reformers: "§CХіба в наших лавах немає гулів?§!"
  nf_brotherhood_expeditions.2.troika: "§RВирушаймо до місця народження Духового роду.§!"

  bos_expedition_to_the_glow_paladins: "Відправити Паладинів до Світіння"
  bos_expedition_to_the_glow_ghoul_paladins: "Відправити гуліфікованих Паладинів до Світіння"
  bos_expedition_to_the_glow_knights: "Відправити Лицарів до Світіння?!"

  nf_brotherhood_expeditions.201.t: "Світіння: Результати" # success
  nf_brotherhood_expeditions.201.d: "Паладини взяли стільки Рад-Х і Антирадину, скільки змогли. Вони спускалися рівень за рівнем крізь Світіння, б'ючись із роботизованими захисниками комплексу, щойно опинилися досить глибоко в підвалах, де не залишилося слідів прямого ядерного удару.\n\nПройшовши повз збройові лабораторії, які вони визнали переважно нічим не примітними, Паладини знайшли три скарби: сховища записів від першоджерел про розробку ВРЕ, працюючий суперкомп'ютер ZAX, що відповідав за всі дослідження у Світінні, та лабораторії, повні прототипів плазмових гвинтівок P94. Часу і вцілілих вистачало лише на те, щоб скористатися плодами одного відкриття, і ми обрали... "
  nf_brotherhood_expeditions.201.a: "Дізнатися більше про Супермутантів"
  nf_brotherhood_expeditions.201.b: "Поспілкуватися із ZAX"
  nf_brotherhood_expeditions.201.c: "Привезти додому прототипи"

  nf_brotherhood_expeditions.202.t: "Світіння: Результати" # failure
  nf_brotherhood_expeditions.202.d: "Паладини взяли стільки Рад-Х і Антирадину, скільки змогли. Наші писарі були впевнені, що вони зможуть витримувати радіацію Світіння певний час, а Рада настільки ж впевнена, що цей час уже минув. Станом на зараз команда оголошена зниклою безвісти в бою.\n\nЇхні койки та речі були перерозподілені."
  nf_brotherhood_expeditions.202.a: "Ми ніколи не дізнаємося, що сталося."
  nf_brotherhood_expeditions.202.maxsonians: "§PЇх вшанують з усіма почестями. Ad Victoriam. §!"
  nf_brotherhood_expeditions.202.rhombians: "§gМи були дурнями. Ніколи більше.§!"
  nf_brotherhood_expeditions.202.reformers: "§CНам треба було відправити гулів.§!"

  nf_brotherhood_expeditions.203.t: "Світіння: Найманці" # success
  nf_brotherhood_expeditions.203.d: "Найманці спускалися рівень за рівнем крізь Світіння, вступивши в хаотичний бій із роботизованими захисниками комплексу, щойно опинилися досить глибоко в підвалах, де не залишилося слідів прямого ядерного удару.\n\nПройшовши повз збройові лабораторії, які вони визнали переважно нічим не примітними, Найманці знайшли три скарби: сховища записів від першоджерел про розробку ВРЕ, працюючий суперкомп'ютер ZAX, що відповідав за всі дослідження у Світінні, та лабораторії, повні прототипів плазмових гвинтівок P94. Часу вистачало лише на те, щоб забрати одне відкриття, і вони обрали... "

  nf_brotherhood_expeditions.204.t: "Паломництво"
  nf_brotherhood_expeditions.204.d: "§RМАКСЕН / Духовий рід / Шторм-Клич народився тут. Звідси паломники занурюють свої тіла у Вогняну Машину і повертаються зміненими! Звідси паломники прищеплюються дарами... §!"
  nf_brotherhood_expeditions.204.a: "§OСтвореного Вогню§!"
  nf_brotherhood_expeditions.204.b: "§PГніву§!"

  nf_brotherhood_expeditions.205.d: "Гуліфіковані Паладини обережно спускалися крізь Світіння, але вступили в запеклий бій із роботизованими захисниками комплексу, щойно опинилися досить глибоко в підвалах, де не залишилося слідів прямого ядерного удару.\n\nПройшовши повз збройові лабораторії, які вони визнали переважно нічим не примітними, Паладини знайшли три скарби: сховища записів від першоджерел про розробку ВРЕ, працюючий суперкомп'ютер ZAX, що відповідав за всі дослідження у Світінні, та лабораторії, повні прототипів плазмових гвинтівок P94. Вони змогли скористатися плодами лише одного відкриття, і вони обрали... "

  nf_brotherhood_expeditions.206.t: "Загиблі Лицарі"
  nf_brotherhood_expeditions.206.d: "Лицарі, яким ми обіцяли звання Паладинів, не повернулися. Старійшини Торні та Ллуїд лютують через марну втрату життів, і деякі максоніанські Лицарі та Писарі стали під їхні знамена. Максоніанці відчуватимуть цю невдачу ще місяцями, а може, й роками."
  nf_brotherhood_expeditions.206.a: "Максоніанці не оговтаються від цього."
  nf_brotherhood_expeditions.206.b: "§PМи знали, що так може статися.§!"

nf_brotherhood_expeditions.3.t: "Сховище 17"
  nf_brotherhood_expeditions.3.d: "Наші Паладини майже не мали проблем під час подорожі до Сховища 17. Очевидно, що інші вже нишпорили у Сховищі з часів першого рейду Єдності, і там справді немає нічого вартого уваги. Але термінали досі працюють!"
  nf_brotherhood_expeditions.3.a: "Ще один бункер із несправним водним чипом..."
  nf_brotherhood_expeditions.3.b: "Ми проаналізували залишки доказів битви."

  nf_brotherhood_expeditions.4.t: "Ферма Привидів"
  nf_brotherhood_expeditions.4.d: "Ми знайшли інших із подібним до нашого досвідом. Вони інакші, оскільки мутували для життя під землею, але люди Шлаку знають труднощі життя в бункері та пристосувалися до дефіциту підземного життя. Колись вони докладали великих зусиль, щоб тримати людей подалі, але більше ні. Ферма Привидів навіть ділиться своїми щедротами з жителями Модока. Наші Паладини..."
  nf_brotherhood_expeditions.4.a: "Були тепло прийняті та обмінялися ідеями у сфері гуманітарних наук."
  nf_brotherhood_expeditions.4.b: "Провели більше часу в Модоці."
  nf_brotherhood_expeditions.4.maxsonians: "§PЗахопили стільки припасів, скільки змогли.§!"
  nf_brotherhood_expeditions.4.rhombians: "§gДомовилися про підтримку для майбутніх експедицій.§!"
  nf_brotherhood_expeditions.4.reformers: "§CМи навчили одне одного.§!"
  bos_brotherhood_looting: "Експедиційна здобич"
  bos_brotherhood_looting_desc: "Ми грабували групи на Пустках під час наших експедицій і досі отримуємо з цього вигоду."
  nf_brotherhood_expeditions.401.t: "Братство навчає"
  nf_brotherhood_expeditions.401.d: "Сьогодні у нас були гості здалеку. Братство — радше далека легенда, ніж будь-що інше — з'явилося у всеозброєнні. Однак вони були цілком дружніми! Вони схвалили наші зусилля і розпитали про наші стратегії боротьби з дефіцитом та технології, які ми використовуємо для сільського господарства. Потім вони розповіли нам про..."
  nf_brotherhood_expeditions.401.a: "Їхні запитання показали, що ми могли б зробити більше."
  nf_brotherhood_expeditions.401.b: "Ми дізналися, як захистити себе."

  nf_brotherhood_expeditions.402.t: "Обмін ідеями"
  nf_brotherhood_expeditions.402.d: "Сьогодні у нас були гості здалеку. Братство — радше далека легенда, ніж будь-що інше — з'явилося у всеозброєнні. Однак вони були цілком дружніми! Вони схвалили наші зусилля і розпитали про культуру та суспільство, які ми сформували під землею."
  nf_brotherhood_expeditions.402.a: "Це було мило."

  nf_brotherhood_expeditions.403.t: "Довгострокова підтримка"
  nf_brotherhood_expeditions.403.d: "Сьогодні у нас були гості здалеку. Братство — радше далека легенда, ніж будь-що інше — з'явилося у всеозброєнні. Однак вони були цілком дружніми! Вони домовилися з нами про права на припаси, якщо якісь майбутні експедиції Братства проходитимуть повз."
  nf_brotherhood_expeditions.403.a: "Це досить вигідно для нас."

  nf_brotherhood_expeditions.404.t: "Рейд!"
  nf_brotherhood_expeditions.404.d: "Сьогодні у нас були гості здалеку. Братство — радше далека легенда, ніж будь-що інше — з'явилося у всеозброєнні з цілим загоном своїх Паладинів. Вони були лютими та жорстокими, не вірили нашим досягненням і шукали технології старого світу. Ми переживемо це, але і ми, і Модок сьогодні ляжемо спати голодними."
  nf_brotherhood_expeditions.404.a: "Ми не змогли їх зупинити."

  nf_brotherhood_expeditions.5.t: "Руїни Брокен-Гіллс"
  nf_brotherhood_expeditions.5.d: "У 2077 році Брокен-Гіллс був продуктивним шахтарським поселенням, яке занепало разом із видобутком у шахті. Хоча уран давно вичерпався, наша здогадка про цінне обладнання виявилася правильною — очисник повітря в шахті, нафтопереробний завод у центрі міста та електростанція були варті нашої уваги. Брокен-Гіллс також мав поодинокі ознаки проживання всього кілька десятиліть тому. Іржа роз'їдає відкритий метал по всьому місту, але технології Брокен-Гіллс захищені його досі запечатаними будівлями. У деяких спорудах наші Паладини знайшли докази існування з'єднаного підземелля, яке могло б стати нам у пригоді як прихований експедиційний форпост, якби ми захотіли залишитися."
  nf_brotherhood_expeditions.5.a: "Ми побудуємо тут форпост."
  nf_brotherhood_expeditions.5.b: "Очисник повітря? Як він у порівнянні з нашим?"
  nf_brotherhood_expeditions.5.maxsonians: "§PРозібрати місце на запчастини.§!"
  nf_brotherhood_expeditions.5.rhombians: "§gДавайте зробимо і те, й інше.§!"
  nf_brotherhood_expeditions.5.reformers: "§CНе будемо марнувати, не будемо й бідувати.§!"

  ##https://fallout.fandom.com/wiki/Irvine#Behind_the_scenes
  nf_brotherhood_expeditions.6.t: "Ірвайн"
  nf_brotherhood_expeditions.6.d: "Утопія колись була місцем високих мерехтливих скляних будівель і легких пальм, без злочинності та бідності. Можливо, саме тому її більше не називали Ірвайном, але відтоді масивні стіни Утопії розвалилися, і тепер вона знову стала Ірвайном. \n\nВулиці вкриті стародавніми, розграбованими останками людей та роботів Земельної корпорації Ірвайна, і Паладини впевнені — єдині живі душі в цьому місті належать до нашої експедиції."
  nf_brotherhood_expeditions.6.a: "Що тут сталося?"
  nf_brotherhood_expeditions.6.b: "Ми повинні вивчати руїни, а не записи."

  nf_brotherhood_expeditions.601.t: "Записи Утопії"
  nf_brotherhood_expeditions.601.d: "Писарі дослідили вцілілі записи в Утопії, і стало зрозуміло, що Земельна корпорація Ірвайна контролювала кожен рівень суспільства в Ірвайні, насаджуючи своє бездоганне бачення залізною рукою. Роботи, якими керував суперкомп'ютер у центрі міста, нібито були «помічниками», що дбали про потреби населення, але насправді вони були їхніми володарями, контролюючи кожен аспект їхнього життя."
  nf_brotherhood_expeditions.601.a: "Обчислювальні технології в Утопії досить просунуті. "
  nf_brotherhood_expeditions.601.maxsonians: "§PДавайте заберемо їх, роботи можуть полегшити окупацію НКР.§!"
  nf_brotherhood_expeditions.601.rhombians: "§gЗрештою, ніяка це не Утопія.§!"
  nf_brotherhood_expeditions.601.reformers: "§CЩе одна повчальна історія. Ми повинні мудро обирати нашого кандидата.§!"

  nf_brotherhood_expeditions.7.t: "Голгофа"
  nf_brotherhood_expeditions.7.d: "У Нью-Ріно існує традиція ховати мерців на цвинтарі, відомому як Голгофа. Яка взагалі різниця між мародерством на тілах довоєнних мерців і післявоєнних? Якщо ми зможемо знайти технології, поховані разом із тілами, то отримаємо чималий куш."
  nf_brotherhood_expeditions.7.a: "Немає ніякої різниці."
  nf_brotherhood_expeditions.7.b: "Ми не пішли."
  nf_brotherhood_expeditions.7.reformers: "§CЖахливо і безглуздо. Замість цього ми працювали над гуманітарними науками.§!"

  nf_brotherhood_expeditions.701.t: "Експедиція на Голгофу"
  nf_brotherhood_expeditions.701.d: "Голгофа — це аж ніяк не звичайний цвинтар. Ми дізналися про це ще дорогою до Нью-Ріно, почувши, що це сумнозвісне місце покарання, а не якесь почесне місце спочинку. Особи, яких там знаходять, — це не мешканці Сховищ зі сходу, божевільні вчені чи навіть торговці зброєю Ван Граффів. Ймовірно, це боржники, баламути або периферія злочинних сімей Нью-Ріно, ті люди, на захист яких один від одного вони не стали б витрачати зусиль.\n\nЕкспедиція проходила без інцидентів, тому учневі Лицаря Родді наказали йти першим на Голгофу, що стало його останнім випробуванням перед тим, як його визнають повноправним Лицарем. Це було помилкою, адже бідолашний хлопець першим відчув нудотний сморід усіх стадій гниття, що змішувався і вирував під пекучою спекою. Блювотиння Родді зашкварчало на стародавньому асфальті, що вів до цвинтаря, і, за словами Писарів, шолом довелося повністю розібрати, щоб позбутися запаху.\n\nМи швидко надягли власні шоломи, і Родді першим помітив запряжений брамінами візок, повний трун, палиць і надгробків. У рамках свого випробування він допитав власника візка, гула-могильника на ім'я Лінді. Цей балакучий череп багато чого розповів про Голгофу, похмуро жартуючи про людей, залишених помирати під сонцем (з попередженням не розмовляти з ними), про відсутність милосердя, на яке вони мали право, і про численні способи, якими тут кожен міг померти. Лінді також згадав, що останнім часом почастішали смерті від отрути.\n\nПопри жахливий запах та її попередження, завдання все ще полягало в тому, щоб зібрати матеріали з Голгофи, масштаби якої вимагали б тижнів ретельних пошуків серед живих мерців і мертвих. Ми спробували знайти кращий варіант і зупинилися на..."
  nf_brotherhood_expeditions.701.a: "Вибірковій перевірці."
  nf_brotherhood_expeditions.701.b: "...азартних іграх з Лінді!"
  nf_brotherhood_expeditions.701.maxsonians: "§P...Перевірці кожної могили та стовпа.§!"
  nf_brotherhood_expeditions.701.rhombians: "§g...Розпитуванні Лінді про відомі могили.§!"
  bos_golgotha_mirroredshades: "Дзеркальні окуляри"
  bos_golgotha_mirroredshades_desc: "Дзеркальні окуляри, вилучені на цвинтарі Голгофа в Нью-Ріно. Власник у них здається людям досить харизматичним."

  nf_brotherhood_expeditions.702.t: "Експедиція на Голгофу — Успішне випробування"
  nf_brotherhood_expeditions.702.d: "Експедиція на Голгофу повернулася, і головний Паладин порекомендував призначити учня Лицаря Родді на командну посаду після його відмінного виконання завдання."
  nf_brotherhood_expeditions.702.a: "Вітаємо, [BOS_knight_roddy.getName]."

  nf_brotherhood_expeditions.8.t: "Токсичні печери"
  nf_brotherhood_expeditions.8.d: "Токсичні печери мають цілком влучну назву. Спочатку ми думали, що місцеві жителі збрехали, коли брели через печери, заповнені радіоактивним мулом, який не мав ніякого значення для нашої силової броні. Проте згодом наші ноги торкнулися бетону, і, залишаючись на ньому, ми незабаром підійшли до неробочого ліфта. Він був суцільно вкритий іржею та брудом, так само як і сусідній генератор. Навіть якби в нього було джерело живлення, це було б дивом, якби він запрацював без запчастин для ремонту."
  nf_brotherhood_expeditions.8.a: "Ми могли б розібрати кілька костюмів, щоб полагодити це."
  nf_brotherhood_expeditions.8.b: "Давайте візьмемо запчастини в Кламаті."
  #nf_brotherhood_expeditions.8.c: "Може стати гірше. Повернімося до Каліфорнії за Писарями."
  bos_extra_toes: "Два зайві пальці на ногах"
  bos_extra_toes_desc: "Наші Паладини були змушені брести через радіоактивний мул після того, як ми розібрали силову броню, щоб відкрити довоєнний бункер. Лікарі кажуть, що пальці відваляться... з часом."

  nf_brotherhood_expeditions.801.t: "Токсичні печери: Складський комплекс"
  nf_brotherhood_expeditions.801.d: "Відновивши роботу генератора, ми поїхали на ліфті групами. Перша група, що піднялася нагору, виявила, що склад має електронний замок, але вони зламали його, і, окрім одного довоєнного робота-охоронця, опору не було. Склад не був повним, але все ще мав дуже солідний запас боєприпасів і зброї, а також кілька паперових інструкцій з довгострокового обслуговування зброї."
  nf_brotherhood_expeditions.801.a: "Ми взяли стільки, скільки змогли."
  nf_brotherhood_expeditions.801.maxsonians: "§PМи повинні зробити тут форпост.§!"
  nf_brotherhood_expeditions.801.rhombians: "§gСтворити тут базу і виплатити компенсацію Кламату.§!"
  nf_brotherhood_expeditions.801.reformers: "§CДомовитися з місцевими жителями про створення тут бази.§!"

  nf_brotherhood_expeditions.802.t: "Кламат засмучений"
  nf_brotherhood_expeditions.802.d: "Трапери з Міста Траперів натрапили на наші спроби побудувати обороноздатний форпост у Токсичних печерах. Він ще не готовий зупинити рейдерів, не кажучи вже про мутантів далі на північ, за якими він мав би спостерігати. Ми не змогли перешкодити траперам повернутися, і незабаром весь Кламат дізнається про нашу діяльність тут. Яку ціну ми готові заплатити, щоб заспокоїти їх?"
  nf_brotherhood_expeditions.802.a: "§PЗахищати його, застосовуючи смертельну силу.§!"
  nf_brotherhood_expeditions.802.b: "§PНанести удар першими. Мертві не розповідають казок.§!"
  nf_brotherhood_expeditions.802.c: "§PДружні місцеві жителі того варті. Виплатити їм компенсацію.§!"

  nf_brotherhood_expeditions.803.t: "Кламат: Братство в'їжджає"
  nf_brotherhood_expeditions.803.d: "Трапери з Міста Траперів натрапили на спроби Братства побудувати обороноздатний форпост у Токсичних печерах. Раніше до них доходили чутки про довоєнний об'єкт за межами радіоактивного мулу. Їхній форпост ще не готовий зупиняти рейдерів, не кажучи вже про мутантів далі на північ, за якими він мав би спостерігати. Місцеві мешканці зі зброєю в руках виступають проти того, щоб такі невпинні маніяки в силовій броні, які поклоняються технологіям і зневажають нас, були так близько. Багато хто скаржиться на вплив їхньої присутності на торгівлю м'ясом геконів, а також ходять чутки, що цей Капітул Братства буде дратувати мутантів на півночі, щоб вивчати їх, залишаючи нас розбиратися з цією проблемою."
  nf_brotherhood_expeditions.803.a: "Прогнати їх."
  nf_brotherhood_expeditions.803.b: "Вони накличуть мутантів. Вимагати зброю, яку вони знайшли."
  nf_brotherhood_expeditions.803.c: "Ми не зможемо виграти. Нехай залишаються."

  nf_brotherhood_expeditions.804.t: "Кламат: Знищення Міста Траперів"
  nf_brotherhood_expeditions.804.d: "[Root.GetLeader], ми не знаємо, хто або чому, але колись за останні кілька тижнів на Місто Траперів було скоєно напад. Цей район було зрівняно із землею — сліди від енергетичної зброї зустрічаються часто й очевидно, і був витрачений час на те, щоб зробити кожну будівлю в місті непридатною для життя. Кожен мешканець — чоловік, жінка, дитина, робот і навіть домашні тварини — були вбиті. Знайшли одну групу, яка втекла більш ніж на милю від міста, перш ніж на них влаштували полювання..."
  nf_brotherhood_expeditions.804.a: "Моє місто?! Готуйтеся до бою!"
  nf_brotherhood_expeditions.804.b: "Попередьте всіх триматися звідти подалі. Це того не варте."
  nf_brotherhood_expeditions.804.c: "Енергетична зброя? Це зробило Місто Сховища!"

  nf_brotherhood_expeditions.805.t: "Кламат: Нехай залишаються"
  nf_brotherhood_expeditions.805.d: "Ми були готові відбиватися від місцевих кілька тижнів, пускаючи їм кров, поки вони не відмовляться від ідеї позбутися нас. Схоже, наші приготування були марними: лише кілька людей спромоглися прийти до Токсичних печер, і вони здебільшого скиглили про те, що Слім Пікет наказав їм дозволити нам будувати."
  nf_brotherhood_expeditions.805.a: "§PЩо ж, добре.§!"

  nf_brotherhood_expeditions.806.t: "Кламат: Вимоги"
  nf_brotherhood_expeditions.806.d: "Жителі Міста Траперів глибоко незадоволені ідеєю нашого постійного форпосту на південь від земель мутантів. Настільки, що конфлікт стане неминучим, якщо ми відмовимося передати зброю та боєприпаси, знайдені на об'єкті. Це місце було б далеко не безцінним, якби ми це зробили — його цінність тільки у зборі інформації виправдовує себе, а потенціал Токсичних печер для подальшого розвитку є чудовим, якщо ми захочемо почати видобуток ресурсів у цьому районі. Зброя — це добре, але, можливо, нам просто варто поступитися цій вимозі?"
  nf_brotherhood_expeditions.806.a: "§PДавайте погодимося.§!"
  nf_brotherhood_expeditions.806.b: "§PМи намагалися бути розсудливими...§!"

  nf_brotherhood_expeditions.807.t: "Кламат: Нехай залишаються"
  nf_brotherhood_expeditions.807.d: "Братство прийняло наші вимоги. Вони передали значний запас зброї та боєприпасів із Токсичних печер, хоча й зажадали певних прав на ресурси на прилеглій території. Ми погодилися — те, що там є, ми все одно ніколи не використовували."
  nf_brotherhood_expeditions.807.a: "Тепер ми будемо готові."

  nf_brotherhood_expeditions.808.t: "Кламат: Напад на комплекс Токсичних печер"
  nf_brotherhood_expeditions.808.d: "Усе Місто Траперів прийшло, щоб прогнати нас із Токсичних печер. Наші сили були розділені: деякі опинилися в пастці на об'єкті, але більшість перебувала в горах. Ми три дні вели сутички з місцевими, щоб звільнити наших побратимів, які потрапили в пастку, перш ніж [KLA.getLeader] поставив(ла) нам ультиматум: віддати припаси або вони використають вибухівку, щоб обвалити Токсичні печери."
  nf_brotherhood_expeditions.808.a: "Наш загін вижив, але припаси були втрачені."
  nf_brotherhood_expeditions.808.b: "Наш загін вижив, і ми здійснили набіг на їхнє місто, щоб повернути припаси."

  nf_brotherhood_expeditions.9.t: "Сховище 11" ## If this one was to be expanded, I would want to break lore and give it a G.E.C.K.
  nf_brotherhood_expeditions.9.d: "Усе Сховище було обвішане пропагандою щодо виборів нового наглядача, причому кожен кандидат висловлював обурення та недовіру з приводу своєї номінації та пояснював, чому інші кандидати більше заслуговують на посаду наглядача. \n\nДесь на середині нашої операції — завдяки знайденим аудіозаписам і працюючим терміналам — нам стало зрозуміло, що мешканці були змушені щороку приносити когось у жертву комп'ютеру сховища як частину експерименту «Волт-Тек», і що жителі сховища зробили це останнім обов'язком кожного Наглядача. На момент завершення експерименту майже всі були мертві.  \n\nБільшу частину технологій сховища можна було врятувати, але затоплені секції, пошкоджений реактор та пошкоджені системи очищення води призвели до високої радіоактивності води, що значно ускладнило місію."
  nf_brotherhood_expeditions.9.a: "Це було просто, але не швидко."

  nf_brotherhood_expeditions.10.t: "Порт Гонолулу"
  nf_brotherhood_expeditions.10.d: "Далеко за берегами Каліфорнії лежить стародавній штат Гаваї, куди вирушили деякі з наших найкращих людей. Серед них наші найвинахідливіші Писарі, найдопитливіші Паладини та найкращі Моряки. Мине кілька тижнів, перш ніж вони зможуть щось доповісти."
  nf_brotherhood_expeditions.10.a: "Вони мають бути мирними дослідниками."
  nf_brotherhood_expeditions.10.b: "Битва майже неминуча."

  nf_brotherhood_expeditions.1001.t: ""
  nf_brotherhood_expeditions.1001.d: ""
  nf_brotherhood_expeditions.1001.a: ""
  nf_brotherhood_expeditions.1001.b: ""

  nf_brotherhood_expeditions.1002.t: "Порт Гонолулу: Битва?"
  nf_brotherhood_expeditions.1002.d: "Далеко від прекрасних берегів Каліфорнії наш флот натрапив на армаду гавайських піратів. Їхні кораблі були неповноцінними купами металобрухту порівняно з нашими, завантаженими зброєю, призначеною для берега, а не для моря. Ми легко розгромили їх і не піддалися на їхню брехню про те, що вони прості рибалки з «миротворчою місією». Вцілілі кораблі розсіялися занадто широко, щоб їх можна було стримати, і без сумніву, усі Гаваї дізнаються, що ми йдемо. Хоча це був чудовий бойовий досвід, якщо їхні пірати здатні роздобути стільки човнів із металевим дном, нас, швидше за все, розіб'ють, якщо ми продовжимо експедицію."
  nf_brotherhood_expeditions.1002.a: "Ми не можемо дозволити собі вторгнення, але можемо врятувати їхні кораблі."
  nf_brotherhood_expeditions.1002.maxsonians: "§PБрати полонених і допитувати їх.§!"
  nf_brotherhood_expeditions.1002.rhombians: "§gМи що, щойно вбили рибалок?§!"
  nf_brotherhood_expeditions.1002.reformers: "§CПринаймні вони швидко здалися.§!"

  nf_brotherhood_expeditions.1003.t: "Порт Гонолулу: Пірати?"
  nf_brotherhood_expeditions.1003.d: "Довго допитуючи вцілілих у битві, ми зрозуміли, що припустилися очевидної помилки. «Армада» виявилася великою групою мігруючих риболовецьких суден. Вони подорожують у такій кількості та з таким озброєнням, тому що відомо, що деякі морські хижаки можуть знерухомити або навіть потопити невелику кількість кораблів. Очевидно, Гаваї не можуть прогодувати своє населення без рибальства. Тут є чудова можливість..."
  nf_brotherhood_expeditions.1003.a: "Цікаво. Ми могли б вирощувати вдосталь їжі в Каліфорнії."

nf_brotherhood_expeditions.1004.t: "Порт Гонолулу: Мирна місія"
  nf_brotherhood_expeditions.1004.d: "На шляху до Гаваїв наша експедиція натрапила на численну, добре озброєну армаду невеликих суден у бойовому порядку. Якби не наші чіткі накази бути мирними, банальні фрази та запевнення армади про те, що вони виконують «мирну місію», нічого б не вартували. Замість цього ми дали їм шанс, і «армада» насправді виявилася великою групою мігруючих риболовецьких суден. Вони подорожують у такій кількості та з таким озброєнням, тому що відомо, що місцеві морські хижаки можуть знерухомити або навіть потопити невелику кількість легких кораблів, таких як у них, але вони охоче беруть на себе цей ризик, щоб прогодувати населення Гаваїв. Тут є чудова можливість..."
  nf_brotherhood_expeditions.1004.a: "Скажіть їм, що ми хочемо налагодити торгівлю, вирушаймо на Гаваї разом."

  nf_brotherhood_expeditions.1005.t: "Порт Гонолулу: Мирні острови Гаваї."
  nf_brotherhood_expeditions.1005.d: "Ми повернулися разом із риболовецьким флотом до їхнього порту в Гонолулу і всерйоз розпочали дипломатичну місію. Очевидно, що Гаваї роздроблені на безліч племен, і що різні племена отримують товари із Заходу. Весь ланцюг островів нестабільно балансує між достатком і дефіцитом, і проста обіцянка регулярних поставок металів, базової зброї та їжі дозволить нам отримати необмежений доступ до їхніх операцій із підйому уламків Тихоокеанського флоту США. На островах також є кілька довоєнних об'єктів, але їх уже ретельно обшукали інші."
  nf_brotherhood_expeditions.1005.a: "Це чудова угода."
  nf_brotherhood_expeditions.1005.b: "Погана угода. Підпишіть на рік, якщо вони дозволять нам проводити дослідження."
  bos_trade_with_hawaii: "Торгівля з Гаваями"
  bos_trade_with_hawaii_desc: "Ми торгуємо з усіма племенами Гаваїв, що дає нам величезний доступ до їхніх трофеїв із Тихоокеанського флоту США в обмін на стабільний потік зброї, металів та їжі. Ми також багато чого дізналися під час нашого візиту на острови і маємо там форпост, поки триває торгівля. Однак води тут небезпечні, і втрат персоналу не уникнути. Наші моряки жартують про прийняття прізвиська «Драгун», подібно до того, як наші пілоти прийняли прізвисько «Улан»."

  nf_brotherhood_expeditions.1006.t: "Порт Гонолулу: Небезпечні острови Гаваї."
  nf_brotherhood_expeditions.1006.d: "На Гаваях багато племен, але всі вони знають про те, що ми знищили один з їхніх риболовецьких флотів, і, цілком зрозуміло, чинять надзвичайний опір нашим спробам дипломатії. Тільки одне з найслабших племен на острові Кауаї погодилося говорити з нами, і, після того, як ми домовилися торгувати виключно з ними в обмін на металобрухт з уламків Тихоокеанського флоту США, вони розповіли нам про довоєнний об'єкт «Баркінг-Сендс» на острові, де випробовували ракети. З їхньою допомогою це було легке зачищення та вилучення."
  nf_brotherhood_expeditions.1006.a: "З огляду на обставини, все пройшло краще, ніж ми могли сподіватися."
  bos_hawaii_protectorate: "Протекторат племені Кауаї"
  bos_hawaii_protectorate_desc: "Під час нашої подорожі на захід через Тихий океан ми подружилися зі слабким племенем на острові Кауаї, також відомому як Острів-Сад. Люди там були слабкими, але також готові закрити очі на нашу помилку зі знищенням флоту озброєних риболовецьких суден. Наша торгівля базовою зброєю, металом та їжею дає нам доступ до частки їхнього племеня в трофеях Тихоокеанського флоту США, що прискорює наші військово-морські дослідження та забезпечує нас корисними матеріалами. Частину персоналу ми втрачаємо через необхідність підтримувати торговий шлях через небезпечні води."

  nf_brotherhood_expeditions.11.t: "Анкоридж: Надія Америки"
  nf_brotherhood_expeditions.11.d: "Понад 200 років тому сили Америки зіткнулися з Китаєм у штаті Аляска. З історичних записів ми знаємо, що штат, ймовірно, всіяний уламками від затяжної 11-річної війни, і його відносно негостинні умови можуть зробити цю експедицію найкориснішою з усіх на сьогодні. \n\nЄ лише одна проблема... це буде вкрай небезпечно, неймовірно довго і дуже ризиковано. Якщо ми не зможемо знайти союзників на півночі, Рада Старійшин майже не матиме бажання проводити експедицію."
  nf_brotherhood_expeditions.11.a: "Ми вирушимо з Каліфорнії, незважаючи на ризики."
  nf_brotherhood_expeditions.11.b: "Кажуть, Безсмертний планує експедицію..."
  nf_brotherhood_expeditions.11.c: "Північно-Західне Братство знайоме з цим кліматом."
  nf_brotherhood_expeditions.11.e: "Скасувати експедицію. У нас багато роботи."
  bos_expedition_to_anchorage_alone: "Експедиція до Анкориджа"
  bos_expedition_to_anchorage_alone_desc: "З якихось причин ми вирушили до Анкориджа без будь-якої допомоги. Можливо, не всі з нас повернуться..."

  nf_brotherhood_expeditions.1101.t: "Анкоридж: Самі по собі"
  nf_brotherhood_expeditions.1101.d: "Незважаючи на повну відсутність підтримки після того, як вони покинули Каліфорнію, ми відправили експедицію до Анкориджа, штат Аляска. Без належних криголамів було неминуче, що наші кораблі застрягнуть. Ледве минувши канадське узбережжя, ми були змушені залишити їх у льодах, і лише мінімальні екіпажі залишилися для нашої зворотної подорожі за кілька місяців."
  nf_brotherhood_expeditions.1101.a: "Тисячі миль позаду, ще сотні попереду."

  nf_brotherhood_expeditions.1102.t: "Анкоридж: Самі по собі - Майже на місці!"
  nf_brotherhood_expeditions.1102.d: "Після більш ніж місячного походу жорстокими горами Аляски наша експедиція встановила радіозв'язок із нашим замерзлим флотом у рідкісний період сприятливих атмосферних умов, повідомивши, що вони перебувають на південь від Палмера, місця, настільки спустошеного війною, що значна частина його руїн лежить у річці Матануска. Наша експедиція вже багато чого дізналася з адаптованих до зими китайських та американських уламків, розкиданих на шляху до Анкориджа, і застосувала модифікації для зими до власного спорядження, використовуючи зібраний брухт."
  nf_brotherhood_expeditions.1102.a: "Рада Писарів буде задоволена."
  bos_alaskan_winterization: "Протоколи підготовки до зими"

  nf_brotherhood_expeditions.1103.t: "Анкоридж: Аудієнція у Безсмертного"
  nf_brotherhood_expeditions.1103.d: "Наш флот пришвартувався у Східному Портленді, і дипломатичний загін вирушив до Сіетла на зустріч із Безсмертним. Коли вони прибули, місто опинилося в епіцентрі хуртовини, і наша силова броня, незважаючи на наші приготування до Аляски, ледве залишалася працездатною. Ми з жахом уявляли, що могло б статися, якби ми дізналися, скільки ще нам треба вивчити у внутрішніх районах Аляски. \n\nБезсмертний під час нашої зустрічі говорив довго. Багато часу було витрачено на виправдання зла, яким просякнутий кожен аспект Сіетла — від зойків рабів до «Чорних Паладинів», відповідальних за дотримання дисципліни та згодовування мертвих їхнім темним ливарням. Не раз ми чули, що сьогоднішнє зло — це завтрашнє добро, але Безсмертний радий підтримати нашу експедицію на Аляску, якщо ми з радістю приймемо їх до Братства без жодних умов."
  nf_brotherhood_expeditions.1103.a: "Це огидно. Ми не братимемо в цьому участі."
  nf_brotherhood_expeditions.1103.b: "З часом ми могли б пом'якшити їхнє зло."
  #maxsonians can't work with the Immortal, but if that should change:   nf_brotherhood_expeditions.1103.maxsonians: "§PВони роблять те, що повинні, щоб вижити.§!"
  nf_brotherhood_expeditions.1103.rhombians: "§gВимагати переходу, але запропонувати підтримку.§!"
  #Reformers can't work with the Immortal, but if it becomes desireable to flirt with regime change: nf_brotherhood_expeditions.1103.reformers: "§CУбити Безсмертного, відновити Північно-Західне Братство§!"
  nf_brotherhood_expeditions.1103.troika: "§RБезсмертний може переписати свої паскаль-байти. Покажіть їм.§!" # It would be fun to have the Troika focused on disseminating implant technology to make other Chapters insane, but that'd be a whole other focus tree.

  nf_brotherhood_expeditions.1104.t: "Анкоридж: Аудієнція у [TCA.GetLeader]"
  nf_brotherhood_expeditions.1104.d: "Наш флот пришвартувався у Східному Портленді, і дипломатичний загін вирушив до Сіетла на зустріч із [TCA.GetLeader]. Коли вони прибули, місто опинилося в епіцентрі хуртовини, і наша силова броня, незважаючи на наші приготування до Аляски, ледве залишалася працездатною. Ми з жахом уявляли, що могло б статися, якби ми дізналися, скільки ще нам треба вивчити у внутрішніх районах Аляски. \n\nПід час нашої зустрічі [TCA.GetLeader] говорить багато. Багато часу було витрачено на скарги щодо зла, яким просякнутий кожен аспект Сіетла — від нині закритого об'єкта P-1 до «Чорних Паладинів», відповідальних за дотримання дисципліни серед своїх співтоваришів-рабів та згодовування мертвих їхнім темним ливарням. Північно-Західне Братство доклало величезних зусиль, щоб покласти край таким практикам, і знайоме з багатьма труднощами виживання на морозі без одноразової робочої сили. Вони без вагань допомагають нам у нашій експедиції і навіть забезпечили нас адаптованою до зими силовою бронею та кораблем супроводу — криголамом."
  nf_brotherhood_expeditions.1104.a: "Чудово. Ми цього не забудемо."

  nf_brotherhood_expeditions.1105.t: "Анкоридж: Ми дісталися"
  nf_brotherhood_expeditions.1105.d: "Нарешті, після кількох місяців подорожі, наша експедиція прибула до Анкориджа. Перше, що усвідомила експедиція, це те, що по Анкориджу було завдано кількох прямих ядерних ударів під час Великої війни. Подорожуючи Північним Анкориджем, ми побачили, що база ВПС Ельмендорф-Річардсон повністю знищена і настільки сильно заражена радіацією, що експедиція змушена була рушити до узбережжя. Незабаром стало зрозуміло, що портовий район Анкориджа також постраждав, ймовірно, щоб відрізати потік товарів або персоналу, що прямував до Китаю.\n\nНезважаючи на те, що відбудований Анкоридж відповідав би найвищим стандартам стійкості, ці ядерні бомби були скинуті так близько одна до одної, що кожна залізобетонна будівля в Північному Анкориджі перетворилася на гравій, не маючи жодних шансів витримати надлишковий тиск у понад 20 фунтів на квадратний дюйм. \n\nЛише в Південному Анкориджі наша надія на великі реліквії відроджується, оскільки будівлі, віддалені від епіцентру вибуху, нарешті височіють принаймні на кілька поверхів. Маючи лише 11 років між звільненням і руйнуванням, значна частина міста слугувала військовим цілям — чи то у вигляді складів, чи то казарм, чи просто частини міста, достатньої для обслуговування величезної військової присутності. Тут є багато можливостей."
  nf_brotherhood_expeditions.1105.a: "Які скарби приховує Анкоридж?"

  nf_brotherhood_expeditions.1106.t: "Анкоридж: Скарби минулої епохи"
  nf_brotherhood_expeditions.1106.d: "Південний Анкоридж усіяний складами, де зберігається різноманітне обладнання. Наші паладини розкрили вкриті льодом склади, що містять ряд за рядом неймовірно добре збережених костюмів стандартної силової броні T-51b, у тому числі деякі з них були позначені як індивідуально підігнані для конкретних осіб, що воювали в Китаї. Але це не єдина знахідка, оскільки на інших складах зберігаються танки часів Великої війни і навіть штурмотрони армії США.\n\nПитання полягає не стільки в тому, чи ми щось знайдемо, скільки в тому, що нам слід забрати з собою. Подорож сюди була занадто небезпечною, щоб її повторювати, але наш флот має величезні вантажні трюми, спочатку заповнені нашими припасами. Тут є багато транспортних засобів логістики часів Великої війни, які можуть впоратися зі старими дорогами Аляски, тож що ми привеземо назад до Каліфорнії? "
  nf_brotherhood_expeditions.1106.a: "Силову броню, звісно."
  nf_brotherhood_expeditions.1106.b: "Танки."
  nf_brotherhood_expeditions.1106.c: "Штурмотрони."

  nf_brotherhood_expeditions.1107.t: "Анкоридж: Наші втрати"
  nf_brotherhood_expeditions.1107.d: "Коли наша експедиція нарешті почала своє повернення до Каліфорнії, наші втрати стали офіційними. Під час виснажливої подорожі Аляскою багато наших братів і сестер залишилися там назавжди. Деякі віддали свої життя, щоб уберегти наших Писарів від небезпек Аляски, але багато хто виявився похованим у власній броні через відмову сервоприводів, зупинку гідравліки або вихід з ладу мікроядерних батарей TX-28. Засліплюючі умови Аляски забрали багато життів у такий спосіб, незважаючи на всі наші зусилля з підготовки та винахідливість наших Писарів у польових умовах."
  nf_brotherhood_expeditions.1107.a: "Ми вшануємо їхню пам'ять."
  nf_brotherhood_expeditions.1107.b: "Викресліть цей вчинок із сувоїв Писарів. Вони нас підвели."
  nf_brotherhood_expeditions.1107.c: "Шукайте гідних Лицарів усюди!"

  nf_brotherhood_expeditions.1108.t: "Аудієнція у Безсмертного: Пом'якшене зло"
  nf_brotherhood_expeditions.1108.d: "Сьогодні засновуючий Капітул Братства прибув на зустріч із Безсмертним. Невеликий загін покинув їхній флот у Східному Портленді, вирушив до Сіетла і вислухав, як Безсмертний виправдовує мораль Північної Ліги. Брати попросили в нас знань і настанов для експедиції до Анкориджа, Аляска, і очевидно, що наша допомога §Rбуде критично важливою, якщо вони хочуть вижити§!. Безсмертний вирішив покласти край цьому фарсу з розумінням мутантів і мораллю, зажадавши формального прийняття та інтеграції всього, чим вони керують, до Братства, без жодних умов чи реформ. На превеликий подив багатьох, Братство погодилося."
  nf_brotherhood_expeditions.1108.a: "Це тріумф. Ми всі — Братство!"

  nf_brotherhood_expeditions.1109.t: "Аудієнція у Безсмертного: Вимога реформ"
  nf_brotherhood_expeditions.1109.d: "Сьогодні засновуючий Капітул Братства прибув на зустріч із Безсмертним. Невеликий загін покинув їхній флот у Східному Портленді, вирушив до Сіетла і вислухав, як Безсмертний виправдовує мораль Північної Ліги. Брати попросили в нас знань і настанов для експедиції до Анкориджа, Аляска, і очевидно, що наша допомога §Rбуде критично важливою, якщо вони хочуть вижити§!.\n\nБезсмертний вирішив покласти край цьому фарсу з розумінням мутантів і мораллю, зажадавши формального прийняття та інтеграції всього, чим вони керують, до Братства, без жодних умов чи реформ. Делегація порадилася, але зрештою зажадала, щоб ми пом'якшили нашу позицію щодо рабства та інших речей, щоб приєднатися до них. Вони пообіцяли підтримку, поради та регулярні поставки енергетичних батарей, щоб послабити нашу залежність від жорстокості."
  nf_brotherhood_expeditions.1109.a: "Справедлива вимога за справедливу плату."
  nf_brotherhood_expeditions.1109.b: "Вони занадто міцно тримаються за мораль сьогодення."
  bos_wbh_token_reforms: "Символічні реформи"
  bos_wbh_token_reforms_desc: "Ми возз'єдналися з Братством у час їхньої потреби. Незважаючи на це, вони зажадали, щоб ми реформували деякі з наших практик. Вимоги були набагато менш обурливими, ніж будь-коли раніше, і Безсмертний прийняв їх."
  bos_support_for_washington: "Підтримка Вашингтона"
  bos_support_for_washington_desc: "Лост-Гіллз вирішило підтримати Вашингтонське Братство, на краще це чи на гірше.\n\n§RМи чекаємо, щоб дізнатися про наше прокляття.§!"

  nf_brotherhood_expeditions.11010.t: "Аудієнція у Безсмертного: Сталева Чума"
  nf_brotherhood_expeditions.11010.d: "Сьогодні засновуючий Капітул Братства, назавжди змінений маргінальною групою під назвою Трійка, прибув на зустріч із Безсмертним. Невеликий загін покинув їхній флот у Східному Портленді, вирушив до Сіетла і вислухав, як Безсмертний виправдовує мораль Північної Ліги. Брати і сестри попросили в нас знань і настанов для експедиції до Анкориджа, Аляска, і очевидно, що наша допомога §Rбуде критично важливою, якщо вони хочуть вижити§!.\n\nБезсмертний вирішив покласти край цьому фарсу з розумінням мутантів і мораллю, зажадавши формального прийняття та інтеграції всього, чим вони керують, до Братства, без жодних умов чи реформ.\n\nНа превеликий подив багатьох, Братство погодилося і навіть наполягало на тому, що Старійшини вже усвідомили мету виходу за межі реальності, логіки та розуму. Вони знайшли Абсолютну Істину і сказали Безсмертному, що принаймні вони мають потенціал зрозуміти це, якщо готові слухати. Безсмертний погодився і усамітнився на місяць, після чого успішно переписав деякі зі своїх паскаль-байтів... що б це не було."
  nf_brotherhood_expeditions.11010.a: "Безсмертний змінився."

  #This event references the offmap tag the Whitecourt, and was written by Aida.Valuna
  nf_brotherhood_expeditions.11011.t: "Загублені в білій імлі"
  nf_brotherhood_expeditions.11011.d: "Зв'язок флотилії з головною експедицією зник, коли вони заглибилися вглиб материка: радіопередачі ставали все рідшими і були сповнені перешкод, поки не припинилися зовсім. Вони з тривогою чекали на березі до того дня, поки на горизонті не з'явилася самотня писар, виснажена обмороженням і шоком. Минуло кілька днів, перш ніж Писар Куффур достатньо відновилася, щоб зробити звіт, надавши детальну та ґрунтовну доповідь, незважаючи на обставини.\n\nСпочатку вона розповіла про повсякденні деталі їхньої виснажливої подорожі: височенні снігові замети та довоєнні дороги, майже втрачені в часі, і вперту відмову землі запропонувати їм будь-який легкий шлях або корисні припаси по дорозі. Просування було болісно повільним, а нещасні випадки на шляху призвели до кількох втрат. Однак найгірше було ще попереду, коли на регіон насунулася люта хуртовина, змусивши їх розбити табір і спробувати перечекати її.\n\nЇхні спроби сховатися від холоду і завивання вітру тієї ночі були раптово перервані жахливим хором криків і шипіння, які віщували жорстокий напад. Зі снігової заметілі та глибокої тіні, у тьмяне світло їхніх прожекторів вирвалася орда вкритих льодом гулів. З їхніх ший звисали ланцюги, що тягнулися по снігу або які тримали фігури, що підганяли дику зграю вперед. Їхні господарі були високими та довгоногими, згорбленими в темряві та вкритими густим білим і коричневим хутром. Вони спостерігали, сміючись і радіючи, як табір був розгромлений, втручаючись лише для того, щоб вступити в бій з тими лицарями, які все ще непокірно стояли у своїй силовій броні. З неприродною силою і кігтями, достатньо гострими, щоб розривати сталь, вони вбили останніх захисників. Тоді вона втекла, не в змозі згадати, чи був наказ відступати, чи її нерви зрештою здали. Тихо вона розповідала уривки про свою відчайдушну втечу назад до узбережжя; як вцілілих відловлювали одного за одним, як верескливих гулів відтягували за їхні повідці якраз перед тим, як вони мали б схопити її, як вона ледь не впала без сил, побачивши море.\n\n«Мисливці перетворили нас на гру...» — сказала вона. «... Я тут лише тому, що вони дозволили мені втекти»."
  nf_brotherhood_expeditions.11011.a: "Цей край похмурий."

  ##this event is blatant, but fun, filler. I don't seriously expect to keep it over whatever OWB devs do here.
  nf_brotherhood_expeditions.12.t: "Країна вранішнього сонця"
  nf_brotherhood_expeditions.12.d: "Досі наша подорож до островів Японії була легкою. Однак інформації про ці землі обмаль; наша експедиція майже не уявляє, що на них може чекати. Якби не ті можливі японські залишки, вигнані з Нью-Ріно, деяка вціліла зброя та медіатека Писаря Ноа Ланна, ми б навіть не змогли розпізнати їхню мову.\n\nЦе спонукало нашу команду до безлічі розповідей, коли Писарі, Лицарі та Паладини припускали все: від суспільства, закритого від світу, як в історії, ще однієї маленької Америки — або, можливо, суспільства, як у їхніх історіях, з дивовижними технологіями, що імітують Ліберті Прайм, китайськими шоковими мечами та індивідуальними польотами!\n\nЦі надії незабаром розвіялися, оскільки ще до того, як ми побачили сушу, Писарі повідомили про підвищений рівень радіації у прибережних водах. З наближенням ночі ми нарешті побачили Японію, чиє нічне небо було залите світлом, як небо Нью-Ріно або навіть Вегаса. Можливо, фантазії Паладинів виявляться правдивими? Завтра вони це перевірять."
  nf_brotherhood_expeditions.12.a: "Ми чекаємо завтрашніх відкриттів."

nf_brotherhood_expeditions.1201.t: "Країна вранішнього сонця: Боротьба"
  nf_brotherhood_expeditions.1201.d: "Ми не змогли наблизитися до міста, як очікувалося: води його порту всіяні потужними морськими мінами.\n\nЄдиним попередженням для нас став гігантський кальмар-мутант, розірваний на великі шматки, що перетворило морську воду на густу мішанину, яка загрожувала пошкодити наші двигуни — навіть якби ми змогли пробратися крізь міни, — тож було прийнято рішення висадитися на берег вище по узбережжю від міста.\n\nПізніше ми змогли визначити, що висадилися в Тойохасі, зруйнованому, але нічим не примітному мегаполісі. Просуваючись далі на північний захід, ми натрапили на підрозділ піхоти, який потрапив у засідку тварин-мутантів: цілого звіринця з двоногих ведмедів, собак, птахів і навіть людиноподібних огрів, набагато більших (проте слабших) за Супермутантів.\n\nПіхотний підрозділ мав колекцію очевидно зібраної з брухту зброї, включаючи багато лазерних мушкетів і кілька китайських штурмових гвинтівок. Найцікавішим, однак, був невеликий загін осіб у каркасах, не надто відмінних від американської силової броні, які володіли катанами зі схожим живленням і вели бій під час відступу, поки їхній підрозділ переміщувався на вигіднішу позицію."
  nf_brotherhood_expeditions.1201.a: "Ми наблизилися після закінчення бою."
  nf_brotherhood_expeditions.1201.b: "Ми допомогли їм."
  nf_brotherhood_expeditions.1201.c: "Ми знищили обидві сили, щоб залишитися непоміченими."

  nf_brotherhood_expeditions.1202.t: "Країна вранішнього сонця: Непевна зустріч"
  nf_brotherhood_expeditions.1202.d: "Нашого мовного спеціаліста для цієї експедиції, Писаря Ноа Ланн, було обрано завдяки тому, що вона є палкою прихильницею японського медіа та вивчала вцілілі матеріали — переважно мультфільми — задля власного задоволення. Вона серйозно звернулася до місцевих, але підлеглі місцевого командира ледве стримували сміх, а сам командир був явно ображений! На щастя, очевидна перевага нашого спорядження підтримувала мир достатньо довго, щоб Писар Ланн зрозуміла, що вони завдають образу. \n\nНезабаром один із членів японського підрозділу розпізнав іншу мову, яку могла зрозуміти Писар Ланн, що походила від російської, і ми заявили про свої наміри тут, у Японії."
  nf_brotherhood_expeditions.1202.a: "Ми прибули сюди шукати технології."
  nf_brotherhood_expeditions.1202.b: "Ми хотіли дізнатися про стан Китаю."
  nf_brotherhood_expeditions.1202.c: "§gМи прибули, щоб§! §Cзнайти нових союзників.§!"

  nf_brotherhood_expeditions.1203.t: "Країна вранішнього сонця: Дружня випивка"
  nf_brotherhood_expeditions.1203.d: "Тільки один член японського підрозділу розмовляв мовою, яку ми могли зрозуміти (якимось різновидом російської), але очевидна перевага нашого спорядження та щира дружелюбність завершилися тим, що нас запросили випити традиційний напій у руїнах Тойохасі — алкоголь, відомий як саке. Командир підрозділу практично наполіг на тому, щоб ми повернулися з ними до Нагої — міста, яке ми побачили, коли тільки прибули. Писар Ланн, наш фахівець з японської мови, з ентузіазмом розпитувала підрозділ про японське медіа, цікавлячись готичними відьмами та іншими специфічними культурними відсиланнями, які вона знала завдяки особистому інтересу до японських матеріалів, знайдених у Каліфорнії. З огляду на радісні відповіді підрозділу щодо деталей із втрачених епізодів, здавалося, що місто буде безпечним місцем, де ми зможемо дізнатися багато нового і, можливо, навіть знайти союзників."
  nf_brotherhood_expeditions.1203.a: "Ми, звісно, погодилися."
  nf_brotherhood_expeditions.1203.b: "Ми тут, щоб шукати руїни, а не вирішувати проблеми."

  nf_brotherhood_expeditions.1204.t: "Країна вранішнього сонця: Швидкий кінець"
  nf_brotherhood_expeditions.1204.d: "Ці землі явно перебувають у стані війни. Ми прийняли рішення атакувати обидві сили одночасно, щоб зберегти нашу присутність тут у таємниці, і наше спорядження дало нам величезну перевагу. Більшість втрат ми зазнали від боїв з Ограми та японською механізованою бронею, незважаючи на її очевидну неповноцінність порівняно з T-45d.\n\nПісля всього у нас з'явилося багато цікавих речей для вивчення. Механізована броня, схожа на американську силову броню, зброя та дані, які вони мали при собі, — усе це дуже цінне, за словами Писарів."
  nf_brotherhood_expeditions.1204.a: "Завершити експедицію. Вивчити те, що ми знайшли."
  nf_brotherhood_expeditions.1204.b: "Тут повно руїн. Писар Ланн вірить, що ми можемо знайти щось більше."

  nf_brotherhood_expeditions.1205.t: "Країна вранішнього сонця: Зона відчуження"
  nf_brotherhood_expeditions.1205.d: "Місто Нагоя — це «Зона відчуження», як ми зрозуміли, одна з кількох територій, де багатьох нелюдських істот розстрілюють на місці. Наші розвіддані свідчать, що хоча місто густонаселене, кількість людей у Японії значно поступається чисельності мутантів. Ми здійснили екскурсію містом, яке нагадувало Утопію до її падіння — добре організоване, процвітаюче і підтримуване в стані, майже неможливому в Пустці.\n\nТут чітко простежувалася прихована ієрархія та норми, що найяскравіше проявилося під час нашої зустрічі з Губернатором, де попередні дрібні порушення етикету Писаря Ланн викликали значну напругу. Тим не менш, ми дізналися, що Китаєм править імператор з династії Лаошу, що походить з Тайваню. Дані розвідки розходяться щодо того, чи мають вони сильний контроль над колишніми територіями, чи ледь простягаються за межі узбережжя Китаю, але Золотий Тигр, як самі себе називають китайці, у минулому робив спроби нападу на Зони відчуження по всій Японії. Що нас турбує, так це те, що Імператор Лаошу не вважає Велику війну закінченою. Ця загроза зростає — можливо, нам слід вжити якихось заходів уже зараз?"
  nf_brotherhood_expeditions.1205.a: "Тривожно. Ми повинні укласти пакт, щоб допомогти їм чинити опір."
  nf_brotherhood_expeditions.1205.b: "Ця місія заради технологій. Давайте здійснимо обмін і не більше."
  nf_brotherhood_expeditions.1205.maxsonians: "§PДомовитися про відправку сюди лицарів для тренувань.§!"
  nf_brotherhood_expeditions.1205.rhombians: "§gВіддалені загрози. Де ми можемо знайти руїни, варті дослідження?§!"
  nf_brotherhood_expeditions.1205.reformers: "§CЦі істоти розумні — запропонуйте стати посередником у мирних переговорах.§!"
  bos_japanese_resistance_pact: "Пакт опору Китаю"
  bos_japanese_resistance_pact_desc: "Під час наших експедицій через Тихий океан ми дізналися, що Імператор Лаошу, який зійшов на престол після вторгнення з Тайваню, не вірить, що Велика війна закінчилася. Вони становлять довгострокову екзистенційну загрозу нашому існуванню, і ми побудували форпост, призначений для заохочення поступового зростання можливостей Нагої, одночасно спостерігаючи за Золотим Тигром усередині Китаю."
  bos_japanese_distant_battles: "Заморські тренування"
  bos_japanese_distant_battles_desc: "Під час наших експедицій через Тихий океан ми натрапили на довгострокову війну між японським народом і кількома видами розумних мутованих... тварин? Тепер ми регулярно відправляємо туди Лицарів та Ініціаторів, щоб вони пройшли тренування проти ворогів, незнайомих із високоякісною Силовою бронею. Однак ми зазнаємо деяких втрат у битвах з Ограми."
  bos_japanese_brokering_peace: "Посередництво в укладанні миру за океаном"
  bos_japanese_brokering_peace_desc: "Під час наших експедицій через Тихий океан ми натрапили на довгострокову війну між японським народом і кількома видами розумних мутованих... тварин? Якщо ми успішно принесемо мир у Тойохасі, вони стануть нашими друзями та союзниками проти Золотого Тигра. Тим часом це багато зробило для покращення нашого іміджу серед жителів Каліфорнії та за її межами."

  nf_brotherhood_expeditions.1206.t: "Країна вранішнього сонця: Далекі руїни"
  nf_brotherhood_expeditions.1206.d: "Руїни Японії здебільшого нецікаві для нас. Величезні простори покинутих міських районів — це нічого нового, і наше дослідження було рутинним. Ми порпалися в руїнах на шляху до нашої справжньої мети — наші Писарі та Лицарі збирали дрібнички, що становили особистий інтерес. Ці дрібнички включали все: від пластикових іграшок, які ви збираєте по частинах, до серії відеороликів «Hangyaku no Hime», яку Писар Ланн знайшла як подарунок для Старійшини Ріаннон. Писар Ланн виглядала в екстазі, кажучи, що вдома є лише «відредаговані» копії Принцеси-бунтарки. Ми із самого початку вирішили здійснити лише один прохід цими руїнами і мали вибрати: дослідити напівпрацюючий довоєнний ядерний реактор чи оглянути руїни найвідомішого в Японії дослідницького кампусу робототехніки."
  nf_brotherhood_expeditions.1206.a: "Ми повинні привезти додому знання про цю післявоєнну енергомережу."
  nf_brotherhood_expeditions.1206.b: "Більше знань у галузі робототехніки лише прискорить нашу роботу."
  bos_japanese_robotics: "Японські дослідження в робототехніці"
  bos_japanese_robotics_desc: "Перебуваючи в Японії, ми дослідили руїни дослідницького кампусу робототехніки, який багато в чому відрізнявся від американських, і особливо від методів тестування та розробки RobCo. Знання, які ми забрали з собою, безсумнівно, покращили наші можливості."
  bos_japanese_power_grid: "Японська довоєнна енергомережа"
  bos_japanese_power_grid_desc: "Перебуваючи в Японії, ми змогли поговорити з геніальними людьми, які відновили багато довоєнних енергетичних об'єктів Японії. Для них знання про експлуатацію ніколи не зникали, і ми багато дізналися про те, як правильно керувати енергомережею. Це збільшило кількість §Yенергії§!, що виробляється §Yкожним генератором, на 1.§!"

  nf_brotherhood_expeditions.1207.t: "Країна вранішнього сонця: Події в Китаї"
  nf_brotherhood_expeditions.1207.d: "Імператор Лаошу, який зійшов на престол після вторгнення з Тайваню, не вірить, що Велика війна закінчилася. Тепер вони живуть у Забороненому місті, і дані розвідки розходяться щодо того, чи підкорили вони землі за межами узбережжя, чи Золотий Тигр ледь чіпляється за образ володаря Китаю.\n\nМи також дізналися, що протягом останніх кількох десятиліть Золотий Тигр робив неодноразові спроби вторгнутися в Японію, але жодна з них не увінчалася успіхом. Усі Зони відчуження по всій Японії замінували свої порти, вирішивши проблему як великомасштабного вторгнення, так і морських істот. Крім того, якщо ми вирушимо до Китаю, нам доведеться запливти глибоко вглиб країни, щоб знайти щось цінне; Імператор Лаошу, без сумніву, вже розібрав на металобрухт усе поблизу узбережжя або навколо Забороненого міста."
  nf_brotherhood_expeditions.1207.a: "Ми повинні запропонувати допомогу Нагої в опорі Золотому Тигру."
  nf_brotherhood_expeditions.1207.b: "Дуже цікаво. Нам знадобляться кращі кораблі."

  nf_brotherhood_expeditions.13.t: "Плавання по Янцзи"
  nf_brotherhood_expeditions.13.d: "Рада Старійшин схвалила нашу місію вгору по річці Янцзи в Китаї під керівництвом Головного Паладина Трео Ешдауна. Тепер, коли наші кораблі найвищої якості, якої ми могли досягти, ризик є прийнятним. Немає сумнівів, що річку Янцзи контролює Золотий Тигр, але ми не зацікавлені в подорожі її Великим каналом. Ми впевнені, що зможемо силою змусити відступити будь-які річкові човни, що спробують нас зупинити, але Ешдаун вважає, що краще не ризикувати і не злити Імператора Лаошу."
  nf_brotherhood_expeditions.13.a: "Імператори приходять і йдуть. Ми підемо туди, куди забажаємо."
  nf_brotherhood_expeditions.13.b: "Головний Паладин Ешдаун візьме з собою різноманітні товари, щоб заплатити за проїзд."
  bos_china_payments: "Данина для Імператора Лаошу"
  bos_china_payments_desc: "Ми доклали величезних зусиль, щоб виробити розкішні тканини, дорогоцінні метали, звичайні друковані плати та деякі речі на межі передових технологій. Звісно, нічого такого, що могло б занадто посилити Золотого Тигра."

  nf_brotherhood_expeditions.1301.t: "Плавання по Янцзи: Вогонь на річці"
  nf_brotherhood_expeditions.1301.d: "Входження в річку Янцзи вимагало залити наші палуби кров'ю. Ми не очікували такої величезної кількості низькотехнологічних кораблів, що скупчилися на узбережжі Китаю, що унеможливило для нас тихе наближення до гирла річки. Ці кораблі не зупинили нас, але очевидно, повідомлення дійшло до охоронців гирла Янцзи, і вони надіслали більші кораблі, щоб заблокувати нас, вимагаючи пояснити мету нашого прибуття, зареєструватися в офісах і пройти всі інші види бюрократичних нісенітниць, що, без сумніву, дало б їхньому найкращому флоту час наблизитися до нас.\n\nГоловний Паладин Ешдаун виконав накази і проігнорував їх, пробиваючись і залякуючи ці кошмари завдяки потужності наших гармат — вежам із гофрованого металу (іноді навіть дерев'яним) вистачило б лише одного пострілу з нашого човна, щоб вони впали. Хоча Управління Річки Тигра і мало кілька очевидних довоєнних танків, здатних пробивати дірки в наших кораблях, у нас було достатньо додаткових гармат, прикріплених до наших палуб, щоб стало зрозуміло — ми виграємо бій.\n\nЧого Головний Паладин Ешдаун не очікував, так це того, що Управління вже отримало те, що хотіло — на борт піднялися диверсанти, стрибаючи з нижніх ярусів веж на палубу або зачіпляючись знизу. Вони залишалися непомітними на нашому флоті, поки ми пливли до наступного контрольно-пропускного пункту в супроводі цих довоєнних танків, а потім почалося справжнє пекло."
  nf_brotherhood_expeditions.1301.a: "Головний Паладин Ешдаун намагався врятувати кожен корабель."
  nf_brotherhood_expeditions.1301.b: "Головний Паладин Ешдаун віддав пріоритет флагману."
  nf_brotherhood_expeditions.1301.maxsonians: "§FВогонь без розбору!§!"
  nf_brotherhood_expeditions.1301.rhombians: "§gРятуйте життя, а не Паладинів!§!"
  nf_brotherhood_expeditions.1301.troika: "§RВи пізнаєте смак Гніву.§!"
  nf_brotherhood_expeditions.1301.reformers: "§CЗдаємося! Ми заплатимо за проїзд!§!"
  bos_chinese_stealth_suits: "Китайські стелс-костюми"
  bos_chinese_stealth_suits_desc: "Ми вступили в конфлікт з диверсантами Управління Річки Тигра під час експедиції до Китаю. Нам вдалося відновити достатньо неушкоджених костюмів, щоб мати можливість використовувати стелс-технології на стратегічному рівні."

  nf_brotherhood_expeditions.1302.t: "Плавання по Янцзи: Кінець експедиції"
  nf_brotherhood_expeditions.1302.d: "Після нашої битви ми підрахували наші втрати... ситуація похмура. Продовжувати експедицію неможливо. Величезна кількість наших вцілілих сил ледве здатна, або взагалі не здатна до бою, а кораблі, що залишилися, переповнені пораненими. Зрештою, не всі вони повернуться додому. Сам Головний Паладин Ешдаун пожертвував своїм життям лише заради шансу врятувати тих, кого зміг. Його останніми словами було попередження:\n\n«Не шукайте кінця раніше часу»."
  nf_brotherhood_expeditions.1302.a: "Ці хоробрі герої не повернулися з порожніми руками."
  nf_brotherhood_expeditions.1302.b: "Їхні імена будуть записані у Сувоях."

  nf_brotherhood_expeditions.1303.t: "Плавання по Янцзи: Плата за проїзд"
  nf_brotherhood_expeditions.1303.d: "Входження в річку Янцзи вимагало залити наші палуби кров'ю. Ми не очікували такої величезної кількості низькотехнологічних кораблів, що скупчилися на узбережжі Китаю, що унеможливило для нас тихе наближення до гирла річки. Ці кораблі не зупинили нас, але очевидно, повідомлення дійшло до охоронців гирла Янцзи, і вони надіслали більші кораблі, щоб заблокувати нас, вимагаючи пояснити мету нашого прибуття, зареєструватися в офісах і пройти всі інші види бюрократичних нісенітниць.\n\nМи могли б із боєм прокласти свій шлях крізь ці кошмари завдяки потужності наших гармат — вежам із гофрованого металу (іноді навіть дерев'яним) вистачило б лише одного пострілу з нашого човна, щоб вони впали. Хоча Управління Річки Тигра і мало кілька очевидних довоєнних танків, здатних пробивати дірки в наших кораблях, у нас було достатньо додаткових гармат, прикріплених до палуб наших кораблів, щоб стало зрозуміло — ми виграємо бій, і вони були надзвичайно раді прийняти наші щедрі подарунки у вигляді тонкого шовку та друкованих плат для використання у власних технологіях.\n\nЗрештою, ми змогли продовжити шлях вниз по річці Янцзи, переслідувані кількома танками, поки не відпливли на достатню відстань від узбережжя."
  nf_brotherhood_expeditions.1303.a: "Говори м'яко і тримай у руках великий кийок."

  nf_brotherhood_expeditions.1304.t: "Плавання по Янцзи: Вгору за течією"
  nf_brotherhood_expeditions.1304.d: "Ми пройшли вздовж усієї Янцзи, і в міру нашого просування контроль і сила, демонстровані Золотим Тигром, зменшувалися. На той час, коли ми дісталися до останнього річкового порту, лише невеликий офіс з єдиним чиновником нагадував нам про те, що ми все ще на території Імператора. На цьому відрізку нашої подорожі також траплялися нерозібрані уламки від американського вторгнення в Китай — танки, менш схильні до деградації частини американської бойової броні, навіть мікроядерні батареї, що застрягли в берегах річки.\n\nЛюди тут досить вільні і їх залишили в спокої. Хоча вони не торгують за кришки, Головний Паладин Ешдаун завбачливо придбав цінні товари, щоб виміняти їх на координати цінних довоєнних руїн. Ми дізналися про два вартісних місця: великі немарковані сталеві двері в горах, які зривали плани цілих поколінь шукачів, і американська база на рівнинах, яка була укомплектована для окупації. Гори... чи може це бути щось схоже на Сховище?"
  nf_brotherhood_expeditions.1304.a: "Головний Паладин Ешдаун вибрав гори."
  nf_brotherhood_expeditions.1304.b: "Експедиція могла б привезти більше з рівнин."

  nf_brotherhood_expeditions.1305.t: "Плавання по Янцзи: Гірський бункер"
  nf_brotherhood_expeditions.1305.d: "Нам довелося подолати чималий шлях у гори, щоб знайти це місце, але це очевидний гірський комплекс. Ми знайшли безліч доказів того, що цей комплекс використовувався, але — з якихось причин — про нього забули.\n\nВідкрити двері виявилося геркулесовим завданням; вони явно були спроектовані так, щоб їх було важко відкрити з поверхні. Наші писарі витратили кілька днів, щоб проникнути в комп'ютеризовані системи, а Паладини Ешдауна витратили ще більше часу, пробиваючись у невеликі вирубки в горі, щоб запустити ручне блокування. Однак врешті-решт величезні двері, що в багато разів перевищували розмір дверей Сховища, відчинилися. Дослідження не буде швидким."
  nf_brotherhood_expeditions.1305.a: "Тут було місце для мільйона."

nf_brotherhood_expeditions.1306.t: "Плавання по Янцзи: Місце для мільйона"
  nf_brotherhood_expeditions.1306.d: "Те, що ми знайшли, було Містом Майбутнього — масивним підземним комплексом, який мав на меті не просто перезапустити цивілізацію: натомість він мав намір її зберегти. З якоїсь причини він так і не був заповнений: тут ніколи не жило більше кількох тисяч людей, і немає жодних записів про їхню долю.\n\nМісто Майбутнього — це не тісні коридори, повні кімнат за кімнатами, як у старому запорошеному Сховищі. Натомість воно складається з парків і окремих будівель, таких як офісні приміщення або гідропонні ферми, з мережею містків біля стелі для обслуговування сотень HEPA-фільтрів, що є єдиною вадою на інакше правдоподібному небі. Комплекс навіть був побудований на окремому джерелі води, що дозволяє уникнути потреби у Водяному чипі, і на цьому етапі наші писарі відчували запаморочення від думки про вивчення такої кількості неймовірних інженерних досягнень. Коли вони думали, що їх уже нічого не зможе вразити, наші Паладини знайшли найбільшу неушкоджену бібліотеку, яку ми коли-небудь бачили — повну як оцифрованих, так і паперових книг! Писарі розуміли, що у них очі розбігаються від того, що саме вивчати, але Головний Паладин Ешдаун знав, що нам доведеться покинути Китай надто швидко, щоб встигнути вивчити все це."
  nf_brotherhood_expeditions.1306.a: "Ми вивчали те, що могли застосувати до нашого власного бункерного комплексу."
  nf_brotherhood_expeditions.1306.b: "Ми взяли стільки книг, скільки змогли."
  nf_brotherhood_expeditions.1306.c: "Ми зосередилися на тому, як воно було побудовано."
  nf_brotherhood_expeditions.1306.e: "§PГоловний Паладин Ешдаун наказав увімкнути самознищення.§! §g«Імператор ніколи не повинен отримати це».§!"
  bos_china_guarding_tomorrow: "Вартові Майбутнього"
  bos_china_guarding_tomorrow_desc: "Ми заплатили найвищу ціну, щоб небезпечні знання не потрапили до рук Імператора Лаошу. Ми знайшли Місто Майбутнього, найповніший і найчистіший довоєнний комплекс з усіх. Ми забрали всі знання, які змогли, і активували систему самознищення Міста, щоб знання для відбудови суспільства не потрапили до рук мстивого релікту минулого. Тепер жоден Старійшина не зможе засумніватися в нашій відданості принципам Роджера Максона."
  bos_chinese_old_world_construction: "Мегаінженерія Старого Світу"
  bos_chinese_old_world_construction_desc: "Перебуваючи в Китаї, ми виявили величезне підземне місто, повне знань зі старого світу. Ми дивувалися тому, як воно було побудоване, і витратили свій час на пошук відповідних текстів у бібліотеці Міста Майбутнього. Тепер ми використовуємо ці знання вдома, у Каліфорнії, і навіть змогли безпечно розширити бункер Лост-Гіллз."

  nf_brotherhood_expeditions.1307.t: "Плавання по Янцзи: Готовність до окупації"
  nf_brotherhood_expeditions.1307.d: "База була відносно нічийною, і ми знаємо чому. Територія сильно роботизована, що дуже схоже на задум Санітарного кордону Небраски. Величезний рій усе ще працюючих Містерів Хоробреців у поєднанні з Охоронними ботами Mk1 та розмаїттям турелей захищає об'єкт, влаштовуючи лякаючу демонстрацію сили. Нам пощастило бути Братством Сталі і, відповідно, власниками стародавніх кодів авторизації. Ми змогли домовитися з роботами, і Головний Паладин Ешдаун використав наші коди, щоб наказати випустити..."
  nf_brotherhood_expeditions.1307.a: "Авіаційний парк комплексу."
  nf_brotherhood_expeditions.1307.b: "Припаси для придушення цивільних."
  nf_brotherhood_expeditions.1307.c: "Усе, що призначалося для фронту."

  nf_brotherhood_expeditions.1308.t: "Експедиція по Янцзи — Успішне повернення"
  nf_brotherhood_expeditions.1308.d: "Експедиція по Янцзи повернулася, а Головний Паладин Ешдаун відзначився після чудових результатів за кордоном. [BOS_mari_torni.GetName] та [BOS_angharad.GetName] підтримали його подальше підвищення до Зоряного Паладина. Більше того, оскільки всі заплановані експедиції завершено, [BOS_paladin_ashdown.GetName] буде призначено командувати нашими силами."
  nf_brotherhood_expeditions.1308.a: "Вітаємо, [BOS_paladin_ashdown.getName]."

  #bos_expeditions_explanation: "§4Ці фокуси запустять ланцюжки подій з унікальними результатами залежно від ваших рішень, і є основним способом збору §YЗнань.§! Багато подій мають унікальні варіанти вибору залежно від того, яка фракція просунула одного зі своїх до Вищого Старійшини.§!"
  bos_expeditions_explanation: "§4Ці фокуси запустять ланцюжки подій з унікальними результатами залежно від ваших рішень, і багато подій мають унікальні варіанти вибору залежно від того, яка фракція просунула одного зі своїх до Вищого Старійшини.§!"
