  nf_brotherhood_chapter_story.7.t: "Заглушка локалізації всередині: Несподіване зростання Капітулу Сан-Франциско"
  nf_brotherhood_chapter_story.7.d: "Це тимчасова подія історії Капітулу, яка чекає на написання/локалізацію. Це колорит/реклама того, якою є інша нація Братства, і служить додатковою сполучною ланкою в оповіді цього Капітулу, щоб підкреслити, що Лост-Гіллз присутній і має для них значення.\n\nЦі події зазвичай написані так, що гравець за Братство читає той самий текст, але з іншою кнопкою відповіді."
  nf_brotherhood_chapter_story.7.a: "Заглушка локалізації"
