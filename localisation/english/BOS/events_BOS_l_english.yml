l_english:
nf_brotherhood_history.1.t:0 "Одна фатальна куля"
nf_brotherhood_history.1.d:0 "15 жовтня 2077 року став переломним днем – днем, коли Роджер Мексон вперше прийняв виклик. Його попередник, полковник Спіндел, не витримав провини за те, що охороняв, і покінчив життя самогубством. Те, що раніше було приховано навіть від солдатів, які стерегли об'єкт, відкрилося у всій своїй потворності. Людські експерименти з генною модифікацією, спершу спрямовані на зцілення та захист від хвороб, швидко перетворились на інструмент творення надсолдатів. Уряд Сполучених Штатів, бачачи потенціал, почав насильно піддавати військовополонених та інших людей різним варіантам Вірусу Примусової Еволюції. Народжувалися потвори, викривлені й нежиттєздатні. Спотворення людяності, породжені наказами тих, хто сам давно вже перестав бути людиною. Для Мексона це стало останньою краплею. Він обірвав усі зв’язки зі США, і його люди пішли за ним. Один за одним вчені піддавалися допитам, визнавалися винними та отримували вирок – негайна страта. 20 жовтня, на всіх частотах, Роджер Мексон та його солдати проголосили відділення від Сполучених Штатів. Це було звернення не лише про наміри, а й про правосуддя. Їхні родини було швидко перевезено до Маріпоси – з остраху, що уряд може відповісти. Але відповіді не надійшло – навіть коли 23 жовтня з неба почала спадати ядерна смерть."
nf_brotherhood_history.1.a:0 "Народжені в той час."
nf_brotherhood_history.2.t:0 "Тягар минулого"
nf_brotherhood_history.2.d:0 "Здавалося, сама доля вирішила, що вони мають вижити – і вибухи стали відповіддю тим жорстоким володарям минулого. Помста прийшла у вогні, знищивши винних і невинних. Солдати, разом із родинами, сиділи в тиші, очікуючи кінця Армагеддону. Маріпоса, немов за дивом, уникнула прямого удару. Її підземні споруди витримали. Вони більше не були солдатами армії США – лише згуртованою групою вцілілих, об’єднаних залізною волею Роджера Мексона. 25 жовтня відзначилось подвигом сержанта Плетнера, який піднявся на поверхню і повернувся з новиною – повітря чисте. Було прийнято рішення: Маріпосу треба залишити. Її злочини й загроза нових ударів були занадто великим тягарем. Після виконання останніх вироків над ученими почався вихід. Колишні військові разом із сім’ями рушили за Мексоном. 27 жовтня вони залишили Маріпосу назавжди. Їхньою новою ціллю став урядовий бункер у Лост-Гіллз. Наш дім."
nf_brotherhood_history.2.a:0 "Обтяжені вибором."
nf_brotherhood_history.3.t:0 "Паладини нової епохи"
nf_brotherhood_history.3.d:0 "Коли відступив адреналін виживання після Армагеддону, прийшло відчай. Усе втрачено – минуле стерте, що залишилось? Яка мета? Те, у що вони вірили – навіть прапор – виявилось лише іграшкою в руках тих, хто прагнув влади. Хто використовував технологію для поневолення. Та знову саме Мексон дав надію, повернув зміст і мету. Охороняти майбутнє від минулого. Не допустити повторення. Захистити людство від його власної жадібності. Так народилось Братство. І разом із ним – династія, що покликана стояти на варті людства."
nf_brotherhood_history.3.a:0 "Загартовані метою."
nf_brotherhood_history.4.t:0 "Наше Братство"
nf_brotherhood_history.4.d:0 "Кожній організації необхідна структура – особливо тій, що охороняє людство. Три окремі гілки, кожна з власним призначенням. Писарі – зберігають і розвивають знання. Лицарі – обслуговують і підтримують технології. Паладини – захищають і ведуть у бій. Ті, хто ще не обрав свій шлях – новобранці, що навчаються та готуються до служби. Понад ними – Старійшини. Зазвичай це досвідчені Паладини, які вирізнились у службі. Вони є вищою владою у справах Братства, хоч часто делегують повноваження. Старійшини формують раду, яку очолює Верховний Старійшина. Проте він – не абсолютний володар: рада може скасувати його рішення або навіть замінити його. І, нарешті, Кодекс – засадничі принципи, написані самим Роджером Мексоном. Жодна особа не стоїть понад Кодексом."
nf_brotherhood_history.4.a:0 "Єднані спадщиною."
nf_brotherhood_history.5.t:0 "Наш занепад"
nf_brotherhood_history.5.d:0 "Вони були як діти, що грались із технологією без розуміння наслідків. Вірили, що можуть повернути минуле, не усвідомлюючи, чим було те минуле насправді. Намагались знову впровадити технології, до яких Пустка не була готова. Вони боролись за це – ми боролись проти. І здавалося, що ми можемо перемогти. Та НКР – це інша загроза. Вони такі ж безвідповідальні в технологіях, як і численні. Ми завдали удару по їхній економіці, зранили їхню гордість. Але нас було надто мало. Тепер ми ховаємось у наших укріплених бункерах. Ховаємось від тих, хто прагне відродити те, що вже раз провалилося."
nf_brotherhood_history.5.a:0 "Ми переживемо всіх."
nf_brotherhood_history.6.t:0 "Будувати майбутнє під землею"
nf_brotherhood_history.6.d:0 "Лост-Гіллз — це назва нашого дому. Тут, у Центральній долині, розташований урядовий захисний бункер, який ми розширили та пристосували до наших потреб за останні два століття. На поверхні знаходиться лише Польова станція — по суті просто бетонна коробка, що приховує ліфт до Лост-Гіллз.\n\nПонад сорок тисяч людей живуть під землею, і кожен із них є членом нашого Братства. Роботи з розширення Бункера тривають постійно, і багато щойно розкопаних та ізольованих приміщень очікують на своє призначення.\n\nМи обмежені під час будівництва під землею — §BМаксимальний доступний простір§! відображає розкопану площу, яку ми маємо просто використати за допомогою §BКомірки будівництва§!, тоді як §BАдміністративний потенціал§! показує залученість Старійшин, необхідну для зведення нової майстерні для Лицарів або тренувального майданчика для Послушників. Нам також знадобляться §BЛюдські ресурси§! для започаткування Ініціатив та Будівництва, тому §BВідділ безпеки§! має бути нашим найпершим пріоритетом, щоб зменшити кількість випадкових смертей та каліцтв."
nf_brotherhood_history.6.a:0 "Зрозуміло."
nf_brotherhood_history.7.t:0 "Паладини нової епохи"
nf_brotherhood_history.7.d:0 "Паладини – це наші воїни, закуті в блискучу броню та озброєні найкращим, що має Братство. Вони – втілення воїнської досконалості: готові, навчені, рішучі. Якби ж тільки їх було більше.\n\n\n§BПаладини функціонують інакше, ніж звичайні бойові одиниці – їхня чисельність суворо обмежена. Вони не можуть бути натреновані стандартними методами, їхні шаблони не підлягають редагуванню. Їх можна розгорнути лише за допомогою спеціальних рішень – як бойові частини, як допомога іншим відділенням або як експедиційні загони для дослідження довоєнних руїн. Паладини не підлягають легкій заміні – кожна втрата болюча. Ставтесь до них з максимальною обережністю.§!"
nf_brotherhood_history.7.a:0 "Наймогутніші з Пустки!"
nf_brotherhood_history.8.t:0 "Лицарі до праці"
nf_brotherhood_history.8.d:0 "Лицарі підтримують, виготовляють і охороняють наше спорядження. Зазвичай вони не призначені для фронтових боїв, хоча кожен лицар уміє поводитися зі зброєю. У відчаї їх також використовують як розвідників – адже доступу до силової броні вони не мають. Силова броня – прерогатива Паладинів, наших найкращих воїнів. Та все ж, те, чого лицар не має в бойових навичках, він із надлишком компенсує технічними знаннями. Якщо щось зламалося – лицар відремонтує це із зав’язаними очима і однією рукою."
nf_brotherhood_history.8.a:0 "ESSAYONS!"
nf_brotherhood_history.9.t:0 "Писарі для знання"
nf_brotherhood_history.9.d:0 "Писарі – наші історики, хранителі знань і вчені. Вони займаються дослідженнями теоретичних застосувань усього, що лежить під сонцем. Іноді співпрацюють із лицарями для створення прототипів зброї. Вони також ведуть літописи наших братів – кожна дія занотовується й закарбовується у сувоях. Саме тому писарі мають найтісніший зв'язок із нашою головною метою: збереженням минулого."
nf_brotherhood_history.9.a:0 "Знання – сила!"
nf_brotherhood_off_map_chapter_logic.great:0 "Це – відмінно!"
nf_brotherhood_off_map_chapter_logic.terrible:0 "Це – катастрофа!"
nf_brotherhood_off_map_chapter_logic.can_do_focus:0 "Тепер доступне наступне фокус-напрямлення:§Y"
nf_brotherhood_off_map_chapter_logic.can_do_focus_closer:0 "§!"
nf_brotherhood_off_map_chapter_logic.1.t:0 "Новини з далекого відділення: Мутанти захопили D.C.!"
nf_brotherhood_off_map_chapter_logic.1.d:0 "Ми щойно отримали повідомлення, що група Супермутантів розгромила відділення Старійшини Лайонса та проголосила свою владу над усім Вашингтоном! Надходять тривожні повідомлення: тіла бійців Братства вивішено біля Цитаделі як демонстрацію мутантської переваги."
nf_brotherhood_off_map_chapter_logic.1.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_off_map_chapter_logic.2.t:0 "Новини з далекого відділення: Анклав захоплює D.C.!"
nf_brotherhood_off_map_chapter_logic.2.d:0 "Надійшла звістка, що залишки Анклаву з Наварро перемогли відділення Старійшини Лайонса та встановили контроль над усім Вашингтоном. Полковник Отам і президент Еден змогли ефективно захопити американську столицю."
nf_brotherhood_off_map_chapter_logic.2.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_off_map_chapter_logic.3.t:0 "Новини з далекого відділення: Проєкт «Чистота» активовано!"
nf_brotherhood_off_map_chapter_logic.3.d:0 "Нам повідомили, що відділення Старійшини Лайонса активувало Проєкт «Чистота» – масштабну інженерну ініціативу з очищення води! Незабаром річка Потомак стане скарбом, а не прокляттям."
nf_brotherhood_off_map_chapter_logic.3.a:0 "$nf_brotherhood_off_map_chapter_logic.great$"
nf_brotherhood_off_map_chapter_logic.4.t:0 "Новини з далекого відділення: Оуїн Лайонс загинув!"
nf_brotherhood_off_map_chapter_logic.4.d:0 "Щойно надійшла інформація, що Старійшина Лайонс, який очолював своє відділення на Східному узбережжі, загинув! Його колишній осередок перебуває в пошуках нового лідера!"
nf_brotherhood_off_map_chapter_logic.4.a:0 "Бажаємо удачі Сарі Лайонс."
nf_brotherhood_off_map_chapter_logic.4.b:0 "Схоже, молодий Артур досяг повноліття."
nf_brotherhood_off_map_chapter_logic.5.t:0 "Новини з далекого відділення: Бостон під контролем Братства!"
nf_brotherhood_off_map_chapter_logic.5.d:0 "Ми щойно отримали повідомлення: місто Бостон перейшло під контроль Братства Сталі! Хмарочоси різнокольорового скла й музеї давньої американської історії нарешті опинилися в дбайливих руках."
nf_brotherhood_off_map_chapter_logic.5.a:0 "$nf_brotherhood_off_map_chapter_logic.great$"
nf_brotherhood_off_map_chapter_logic.6.t:0 "Новини з далекого відділення: Інститут здобув перемогу!"
nf_brotherhood_off_map_chapter_logic.6.d:0 "Надійшла тривожна звістка – Інститут встановив повний контроль над Бостоном, розгромивши східне відділення Братства Сталі! Вулицями бродять люди без сердець."
nf_brotherhood_off_map_chapter_logic.6.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_off_map_chapter_logic.7.t:0 "Новини з далекого відділення: Перемога Відступників!"
nf_brotherhood_off_map_chapter_logic.7.d:0 "Надійшла новина, що Відступники Братства Сталі взяли під контроль колишнє відділення Старійшини Лайонса! Вони мають на меті відкинути реформи Лайонса та відновити вчення Братства у більш прагматичній формі."
nf_brotherhood_off_map_chapter_logic.7.a:0 "Бажаємо їм удачі!"
nf_brotherhood_off_map_chapter_logic.8.t:0 "Новини з далекого відділення: Середній Захід впав!"
nf_brotherhood_off_map_chapter_logic.8.d:0 "Щойно стало відомо, що Середньозахідне відділення Братства Сталі знищене! Можна лише припустити, що їх зламали ті ниці люди з Чикаго!"
nf_brotherhood_off_map_chapter_logic.8.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_off_map_chapter_logic.9.t:0 "Новини з далекого відділення: Середній Захід здобув Чикаго!"
nf_brotherhood_off_map_chapter_logic.9.d:0 "Ми отримали повідомлення, що Середньозахідне відділення Братства Сталі проголосило Чикаго своєю територією! Вони тепер є домінуючою силою в самому серці Пустки."
nf_brotherhood_off_map_chapter_logic.9.a:0 "$nf_brotherhood_off_map_chapter_logic.great$"
nf_brotherhood_off_map_chapter_logic.10.t:0 "Новини з далекого відділення: Братство Затоки знайшло Джерело Мрій!"
nf_brotherhood_off_map_chapter_logic.10.d:0 "Отримано повідомлення, що Братство Затоки виявило Джерело Мрій – гігантське природне джерело, побічний продукт якого, за чутками, може слугувати природною заміною Рад-Авей!"
nf_brotherhood_off_map_chapter_logic.10.a:0 "$nf_brotherhood_off_map_chapter_logic.great$"
nf_brotherhood_off_map_chapter_logic.11.t:0 "Новини з далекого відділення: Братство Затоки змушене сховатися!"
nf_brotherhood_off_map_chapter_logic.11.d:0 "Повідомляється, що Братство Затоки було змушене піти в підпілля після невдачі в пошуках Джерела Мрій! Хто знає, що станеться з цим джерелом тепер – або чи воно взагалі існувало."
nf_brotherhood_off_map_chapter_logic.11.a:0 "$nf_brotherhood_off_map_chapter_logic.terrible$"
nf_brotherhood_arthur_maxson.1.t:0 "$bos_nf_the_line_of_succession$"
nf_brotherhood_arthur_maxson.1.d:0 "Артур Мексон, спадкоємець крові Мексонів, часто розглядається як цінний інструмент у руках окремих угруповань старійшин у Лост-Гіллз. Тривають обговорення, чи не буде йому безпечніше подалі від Лост-Гіллз – там, де він зможе вирости поза впливом політики бункера і стати самостійною особистістю. Відділення Лайонса на Сході видається гідним варіантом для Артура!"
nf_brotherhood_arthur_maxson.1.a:0 "Йому безпечніше тут, поруч із батьком."
nf_brotherhood_arthur_maxson.1.a.tt:0 "§Y$BOS_arthur_maxson_name$§! залишиться в Лост-Гіллз і виховуватиметься старійшинами."
nf_brotherhood_arthur_maxson.1.b:0 "Щасливої дороги, малий Мексон!"
nf_brotherhood_arthur_maxson.2.t:0 "Артура Мексона відправлено на Схід!"
nf_brotherhood_arthur_maxson.2.d:0 "Артур Мексон, спадкоємець династії Мексонів, давно вважався корисним засобом у внутрішніх іграх старійшин. Та нещодавно його вивезли з бункера проти нашої волі! Хоча винних затримано і засуджено, повернути малого Мексона вже навряд чи вдасться."
nf_brotherhood_arthur_maxson.2.a:0 "Потрібно було діяти раніше!"
nf_brotherhood_arthur_maxson.3.t:0 "Артур Мексон досяг повноліття"
nf_brotherhood_arthur_maxson.3.d:0 "Артур Мексон завершив своє дитинство і став талановитим, видатним воїном!"
nf_brotherhood_arthur_maxson.3.a:0 "Він стане гордістю свого батька!"
nf_brotherhood_communications.1.t:0 "Шифрограма з [BOS.getName]"
nf_brotherhood_communications.1.d:0 "[BOS.getName], офіційна штаб-квартира Братства Сталі, щойно надіслала нам попередню шифрограму. Схоже, вони мають намір відновити спроби налагодження зв'язку з нами."
nf_brotherhood_communications.1.d.shi:0 "[BOS.getName], формальний голова Братства Сталі, щойно надіслав комюніке до бункера в Сан-Франциско, знову встановивши регулярний зв'язок! Здається, Старійшини прийняли наш Капітул, і вони дуже цікавляться нашими майбутніми планами та можливостями."
nf_brotherhood_communications.1.d.grd:0 "[BOS.getName], формальний голова Братства Сталі, зумів передати повідомлення до Цитаделі Вартових. Минуло вже чимало років відтоді, як старі Старійшини намагалися зв'язатися з нами, але, можливо, це свідчить про їхню готовність вчитися на помилках минулого."
nf_brotherhood_communications.1.a:0 "Старійшини завжди щось задумують..."
nf_brotherhood_communications.2.t:0 "Пакунок із припасами від [BOS.getName]"
nf_brotherhood_communications.2.d:0 "На знак визнання наших зусиль у регіоні, Старійшини Лост-Гіллз надіслали нам дещо — пакунок із припасами! Вміст пакунка залишався для нас загадкою, але недовго, оскільки [ROOT.getLeader] оголосив, що всередині..."
nf_brotherhood_communications.2.a:0 "Військові матеріали від Інтендантів!"
nf_brotherhood_communications.2.b:0 "Креслення та голоплівки від Писарів!"
nf_brotherhood_communications.3.t:0 "Іноземний пакунок із припасами від [BOS.getName]"
nf_brotherhood_communications.3.d:0 "Хоча ми не є офіційним відділенням Братства, Лост-Гіллз усе ж вирішили підтримати нашу справу. Вони надіслали нам постачання!"
nf_brotherhood_communications.3.a:0 "Яка б не була причина – халява не завадить!"
nf_brotherhood_communications.4.t:0 "Невеликий наліт"
nf_brotherhood_communications.4.d:0 "Нью-Ріно зазнало незначного рейду. Банда озброєних рейдерів викрала трохи металобрухту в місцевих мешканців."
nf_brotherhood_communications.4.a:0 "Компенсуємо збитки."
#5 & 6 are cut LHE content
  nf_brotherhood_communications.7.t: "[BOS.getName] підтримує нашу боротьбу: Спорядження"
  nf_brotherhood_communications.7.d: "[BOS.getName] та їхня Рада глибоко вірять в успіх [THIS.getName], і засмутили Інтендантів вдома, щоб доставити нам пакунок з припасами.\nНаші останні звіти вказували на те, що Лост-Гіллз ледве тримається в Каліфорнії — то чого їм це коштувало, і як ми зможемо коли-небудь віддячити?"
  nf_brotherhood_communications.7.a: "Ми не забудемо їхню пожертву. Ad Victoriam!"
  nf_brotherhood_communications.8.t: "Дебати щодо постачання"
  nf_brotherhood_communications.8.d: "[BOS.getName] та Рада глибоко вірять в успіх [bos_consider_target.getName]. Однак ми могли б зробити набагато більше, щоб забезпечити їхню перемогу, наказавши нашим Інтендантам видати екстрені запаси, які зберігаються в резерві для оборони наших бункерів.\n\nНавіть якщо ми вирішимо відмовитися від таких заходів, ромбіанці запропонували найняти іноземних найманців на допомогу [bos_consider_target.getName]. Ми також могли б докласти додаткових зусиль, щоб зробити можливою добровольчу експедицію."
  nf_brotherhood_communications.8.a: "Ми підемо на пожертву. Ad Victoriam!"
  nf_brotherhood_communications.8.b: "Візьміть зі скарбниці, щоб купити їм найманців."
  nf_brotherhood_communications.8.c: "Давайте підготуємо Паладинів до небезпечного завдання."
  nf_brotherhood_communications.8.e: "Давайте відкладемо це на потім."

  nf_brotherhood_communications.9.t: "[BOS.getName] підтримує нашу боротьбу: Найманці"
  nf_brotherhood_communications.9.d: "[BOS.getName] та їхня Рада глибоко вірять в успіх [THIS.getName], і засмутили Інтендантів вдома, щоб доставити нам підкріплення.\nНаші останні звіти вказували на те, що Лост-Гіллз ледве тримається в Каліфорнії — то чого їм це коштувало, і як ми зможемо коли-небудь віддячити?"
  nf_brotherhood_communications.9.a: "Ми не забудемо їхню пожертву. Ad Victoriam!"

  ##Communications 10 exists but has no need for unique loc, just the ID.

  nf_brotherhood_communications.11.t: "Ланцюг, що пов'язує - Поклик здалеку"
  nf_brotherhood_communications.11.desc: "[FROM.GetLeader],\n\n Рада Старійшин благає вас про допомогу, бо Братство переживає свою найтемнішу годину. Більш непримиренна, ніж армії Творця — масовіша, ніж військова машина Анклаву — НКР тепер загрожує всьому, що нам дороге, і прагне знищити Братство. Без вашої допомоги Каліфорнія впаде в ту саму темряву, яка призвела до Великої війни.\n\nМи відправили весь транспорт, який тільки могли виділити, щоб зібрати добровольців з кожного Капітулу, бо це війна за саме майбутнє людства. Нічого не шкодуйте — надсилайте найкращих і найрозумніших, бо коли Шейді-Сендс впаде, робота тільки почнеться.\n\n... і я розумію, Старійшино, що дехто вірить, ніби [NCR.getName] має великі перспективи. Рада обговорювала це і знає, що одужання від корупції, яка вразила [NCR.getName], більше неможливе. Керівництво [NCR.getLeader] має непрощенні вади — чи то через брак характеру, чи то через маріонеткові ниточки інших, які прагнуть лише стати монархами нещастя. Ми не змарнуємо останню і найкращу надію на відбудову суспільства, назавжди блідого і хворобливого за своїм характером. \n\nОтже, дотримуйтесь Кодексу і готуйтеся до бою. Ми будемо берегти безпеку Пустки, як і завжди.\n\n[BOS.getLeader],\n\n[BOS.getName]"

  nf_brotherhood_communications.11.a: "Ad Victoriam!"
  nf_brotherhood_communications.11.b: "Вони самі по собі."
  nf_brotherhood_communications.11.c: "Ми відправимо командний склад."

  nf_brotherhood_communications.12.t: "[BOS.getName] підтримує нашу боротьбу: Добровольці"
  nf_brotherhood_communications.12.d: "[BOS.getName] глибоко вірить в успіх [THIS.getName], і [BOS.getLeader] виступив за відправку нам добровольців.\nНаші останні звіти вказували на те, що Лост-Гіллз ледве тримається в Каліфорнії — то чого їм це коштувало, і як ми зможемо коли-небудь віддячити?"
  nf_brotherhood_communications.12.a: "Ми не забудемо їхню пожертву. Ad Victoriam!"



  ##Chapter Stories/Vignettes
  nf_brotherhood_chapter_story.0.t: "Заглушка локалізації всередині: "
  nf_brotherhood_chapter_story.0.d: "Це тимчасова подія історії Капітулу, яка чекає на написання/локалізацію. Це колорит/реклама того, якою є інша нація Братства, і служить додатковою сполучною ланкою в оповіді цього Капітулу, щоб підкреслити, що Лост-Гіллз присутній і має для них значення.\n\nЦі події зазвичай написані так, що гравець за Братство читає той самий текст, але з іншою кнопкою відповіді."
  nf_brotherhood_chapter_story.0.a: "Заглушка локалізації"
  nf_brotherhood_chapter_story.0.b: "Заглушка локалізації"

  nf_brotherhood_chapter_story.1.t: "Світ нарізно, але все одно коханий"
  nf_brotherhood_chapter_story.1.d: "Шановна Старійшино Тьорні,\n\nЯкщо ви читаєте це, значить, пілот гвинтокрила на зворотному шляху погодився взяти мій лист і доставити його в Лост-Гіллз.\n\nЯ отримала ваш пакунок з припасами, і наша експедиція вже почала збирати зброю і броню, яку ви нам надіслали. Я повністю впевнена, що вона буде використана так само добре, як якби була в руках Паладинів на заході. Були деякі міркування щодо оголошення мене Старійшиною — адже це мене першою відвели від зради Далласа Кодексу. Але все не так просто. Існує протокол, якого слід дотримуватися, і ми не з тих, хто від нього відмовляється. Поки що я — виконуюча обов'язки командира Капітулу Аламо, простої експедиції, яка зрештою повернеться до Далласа, коли наші брати і сестри перестануть бути такими... введеними в оману.\n\nА тим часом, я сподіваюся, наша відданість Кодексу змушує вас пишатися.\n\nРешта цього листа для вас як моєї мами, Марі, а не за вашою посадою. Я ніколи не знала вас добре. Ви відіслали мене, коли я ледь навчилася ходити. Дехто з Паладинів каже мені, що це через втрату батька, але мені хотілося б почути це від вас. Дивно, що попри всю цю відстань, таємниця того, хто ви є, все ще живе в моїх думках. Я плакала, побачивши фотографію, яку ви залишили в пакунку з припасами, де я на ваших руках разом з батьком. Ми тоді були такими щасливими! Іноді я бачу сім'ї в [ACH.capital.GetName] і не можу не відчути укол заздрості. Цікаво, як це — відчувати цю любов у будь-який час.\n\nЯ сподіваюся зустрітися з вами одного дня, коли ви переможете наших ворогів на заході. Сподіваюся, ви побачите в мені доньку, якою можна пишатися.\n\nДо зустрічі,\n\n[ACH.getLeader]"
  nf_brotherhood_chapter_story.1.a: "Люба Кетрін, я в захваті від твого листа..."
  nf_brotherhood_chapter_story.1.b: "Я люблю тебе, мамо."

  ##Thank you Wagoo for making 101&102, and Applefries for 1!
  nf_brotherhood_chapter_story.101.t: "Неймовірне"
  nf_brotherhood_chapter_story.101.d: "Старійшино [BOS_mari_torni.GetName]:\n\nСталеве Коло та Експедиційний відділ [BOS.getName] висловлюють глибоке співчуття з приводу того, що вашу доньку, Старійшину Кетрін Тьорні, було визнано загиблою в бою протягом місяця [GetMonth], від рук сил [ROOT.getName] поблизу [FROM.capital.GetName]. Цей лист містить подальші подробиці.\n\nЇї ім'я буде занесено до Сувоїв. Ad Victoriam."
  nf_brotherhood_chapter_story.101.a: "До кінця своїх днів Тьорні змінилася."
  bos_torni_rallies_the_council_tt: "§gТьорні згуртувала ромбіанський блок для війни після звістки про смерть Кетрін.§!"
	bos_torni_grief_hurts_policy_tt: "§gГоре поглинуло її. Старійшини звернулися до інших блоків, щоб вирішити свої питання.\n\nЗ'явилася більш холодна, жорстока Старійшина.§!"

  nf_brotherhood_chapter_story.102.t: "Уривок: Перемога над машинами"
  nf_brotherhood_chapter_story.102.d: "Високоповажним Старійшинам Лост-Гіллз,\n\n Адаптації, які ми внесли в нашу доктрину в джунглях зламаного ГЕКК, виявилися цінними. Спочатку було протистояння дресованим звірам жорстоких мисливців, потім виникла небезпека від орди роботів-вбивць, які могли вижити у вологості, здатній втопити Паладина у власному поті. Занадто багато разів броню T-60 доводилося затоплювати, щоб влаштувати пастку і бути впевненим, що Робот-охоронець або Кіготь смерті впаде.\n\nПроти всіх них ми здобули перемогу. До цього звіту додається повний тактичний аналіз і зразки роботизованих сил, з якими ми боролися. Хай ви вистоїте проти всіх тиранів у Каліфорнії."
  nf_brotherhood_chapter_story.102.a: "[ACH.getLeader]"

  nf_brotherhood_chapter_story.2.t: "Падіння Елайджі"
  nf_brotherhood_chapter_story.2.d: "Сьогодні Польова станція повертає знайомі обличчя до їхніх родин внизу. Натовп людей юрбиться над землею, коли в Лост-Гіллз прибуває конвой у супроводі Лицаря Крістін та Вероніки Сантанджело. Відрядження Крістін до Мохаве закінчилося поразкою Старійшини Елайджі, і її звіти вказують на те, що Старійшина відкинув слушні тактичні поради Головного Паладина Макнамари та інших під час битви за ГЕЛІОС Один. Керівництво перейшло до Головного Паладина після повного колапсу контролю Капітулу над цією територією. Хідден-Веллі навіть запровадив карантин, щоб зберегти те, що залишилося від їхніх сил під керівництвом нового Старійшини.\n\nСьогодні до нас повертається більшість тих, хто вижив з Капітулу Мохаве — живе нагадування про хаос, який чекає на нас, якщо ми підемо війною на Ведмедя і зазнаємо невдачі."
  nf_brotherhood_chapter_story.2.a: "Лицар Крістін повертається до служби."
  nf_brotherhood_chapter_story.2_tt: "§gВероніка залишає своє командування в Мохаве і повертається до обов'язків Писаря. Вона також залишається відвертим критиком такого типу керівництва, за якого чисельність Братства скорочується з року в рік.§!\n"

  nf_brotherhood_chapter_story.3.t: "Перемога: Операція «Проблиск»"
  nf_brotherhood_chapter_story.3.d: "Раді Старійшин — ви можете проігнорувати мій запит на додаткові ресурси. З брухтом я врятував нас усіх. Один з п'ятдесяти костюмів силової броні мого Капітулу був повністю функціональним. Одна з двадцяти мікроядерних батарей, які мені дали, була повністю заряджена. Мінігани, надані моїм Паладинам, мали настільки зношені стволи, що вони плавилися за пів хвилини безперервного вогню.\n\nНКР дісталася Дамби раніше за нас, і в Хідден-Веллі я перетворив ваші застарілі надлишки на чудові боєприпаси. Я перетворив нахабного, ідіотського Головного Паладина, якого ви мені призначили, на вірного прихильника місії, яку ви все ще обговорюєте. Нехай це буде вам уроком, Старійшини.\n\nНастав час зібрати енергію старого світу і вдосконалити її. Мої Паладини можуть викликати Списи з Сонця, і я здобув для вас Дамбу Гувера. Тепер вчіться у мене — НКР сиділа на зруйнованій і старій Дамбі, яку я зараз працюю над відновленням. Енергія затопить Мохаве так, як ніколи раніше, а воду з Колорадо легко збирати й очищати.\n\nТепер Легіон починає збиратися навколо. Я перетворю Дамбу на м'ясорубку для цих недоумкуватих рейдерів по той бік Колорадо, і тим дебілам, яких ви мені дали, залишиться тільки прицілитися і вистрілити.\n\nЯ надіслав вам своїх найзагартованіших ветеранів Кампанії Мохаве як допомогу, і якщо вам вдасться дотягнути ваші кордони до моїх, я достатньо великодушний, щоб поділитися без тієї дволикості, яку ви мені продемонстрували. Енергія, вода, люди — ніхто не буде прикидатися чимось іншим, як ті Мікроядерні батареї, які я дістав зі старого складу сьогодні, що були просто зафарбованими енергоячейками.\n\nСтарійшина [MOJ.getLeader], з [MOJ.getName]"
  nf_brotherhood_chapter_story.3.a: "Відішліть це з ветеранами, Писарю. Не відкривайте."
  nf_brotherhood_chapter_story.3.b: "Ми не можемо сперечатися з результатами Старійшини [MOJ.getLeader]."
  nf_brotherhood_chapter_story.3_tt: "§gВідповідь [BOS.getName] прийшла через багато місяців після того, як Дамбу було захоплено. \"Старійшино [MOJ.getLeader], ми доручили інтендантам особисто перевірити кожну річ у цьому пакунку з припасами. Ad Victoriam, Старійшино.\"§!\n\n"
  nf_brotherhood_chapter_story.301_tt: "§gВетерани, яких Елайджа відіслав до нас, у переважній більшості виступають за збереження технологій і не більше того. Ті серед них, хто ще не є Паладинами, отримують підвищення, і історії, які вони розповідають про нав'язливе та безрозсудне керівництво Елайджі, зміцнюють традиційні погляди.§!"

  nf_brotherhood_chapter_story.4.t: "Максон тримається"
  nf_brotherhood_chapter_story.4.d: "[BOS_andrea_letter_contents_description]"
  nf_brotherhood_chapter_story.4.a: "Зрештою, Старійшини вистояли..."
  nf_brotherhood_chapter_story.4.b: "Експедиція Максона жива!"
  nf_brotherhood_chapter_story.4_tt: "§gУ Раді точаться дебати щодо того, які дії вжити. Паладини високо відгукуються про Брікслі і попереджають, наскільки жахлива ситуація в Колорадо. [BOS_pryderi.GetName] хвалить відданість Брікслі місії, і Рада надсилає пакунок з припасами, попри атмосферу приреченості, що нависла над листом. Рада додає примітку: у разі повернення Денвера Командир Паладинів Андреа Брікслі цим визнається Старійшиною Андреа Брікслі з Капітулу Колорадо.§!\n\n"
  nf_brotherhood_chapter_story.401_tt: "§gУ Раді точилися дебати щодо того, які дії вжити. Паладини високо відгукувалися про Брікслі і попереджали, наскільки жахлива ситуація в Колорадо. Старійшина Прайдері похвалив відданість Брікслі місії, і Рада надіслала експедиції пакунок з припасами. Рада додала примітку: у разі повернення Денвера Командир Паладинів Андреа Брікслі цим визнається Старійшиною Андреа Брікслі з Капітулу Колорадо.§!\n\n"

  ##Credit to undergrad TomTom for the letter contents!
  BOS_andrea_letter_contents_v1: "До вельмишановної Ради Старійшин,\n\nЗ жалем повідомляю вам, що Старійшина Кемерон помер десятиліття тому, і, згідно з Ланцюгом, що пов'язує, я, Командир Паладинів Андреа Брікслі, перейняла командування експедицією. Щоб коротко пояснити останні пару десятиліть: ми зазнали поразки в Денвері і були змушені сховатися в старому сенаторському бункері, де значний відсоток експедиції став залежним від використання стелс-боїв, що зробило їх непередбачуваними. Саме від рук одного з таких непередбачуваних братів і загинув Старійшина Кемерон.\n\nОточені з усіх боків, ми замкнулися у своєму бункері, рідко виходячи назовні. Поступово, з часом, ми наважилися вийти і успішно створили невеликий плацдарм на поверхні.\n\nВ останні роки ми успішно придушили основні загрози навколо нас, від моторизованих рейдерських банд до міста розумних роботів і розплати в Денвері. У світлі цього я оголошую початкову мету експедиції виконаною і формально висуваю своє прохання про підвищення та підвищення нашого статусу до Капітулу.\n\nОднак наша ситуація нестабільна. Поки я пишу це, я отримала звіти про величезну армію племен, що марширує на північ і вже зруйнувала більшу частину Нью-Мексико. Ось чому мені боляче відмовлятися від усіх своїх ветеранів Паладинів. Але цей лист має бути доставлений, і я доручаю його доставку своїм найдосвідченішим бійцям. Тож використовуйте їх на власний розсуд.\n\nПокірна,\n\nКомандир Паладинів Андреа Брікслі з Експедиції Максона"
  BOS_andrea_letter_contents_v2: "Раді Старійшин,\n\nМи отримали вашого посланця. З жалем повідомляю вам, що Старійшина Кемерон помер десятиліття тому, і я, Андреа Брікслі, перейняла командування експедицією. Якщо підсумувати понад 20 років історії: ми зазнали поразки в Денвері і були змушені сховатися в старому сенаторському бункері, де значна кількість учасників експедиції стали залежними від використання стелс-боїв, що зробило їх вкрай непередбачуваними. Саме від рук одного з таких непередбачуваних братів і загинув Старійшина Кемерон.\n\nОточені з усіх боків, ми замкнулися у своєму бункері, рідко виходячи назовні. Поступово, з часом, ми наважилися вийти і успішно створили невеликий плацдарм на поверхні.\n\nВ останні роки ми відкинули наших ворогів. Але ми зробили це не самі. Ми уклали союзи з місцевими жителями, і це забезпечило наше виживання. Тепер, незалежно від того, погодиться Рада з моїм рішенням чи ні, це зроблено. Наші союзники роблять нас сильними, і нашим обов'язком залишається їх захищати. Я також оголосила початкову мету експедиції виконаною і тепер офіційно обійняла посаду мого попередника як Старійшини новоствореного капітулу.\n\nОднак наша ситуація далека від стабільності. Величезна армія племен марширує на північ і вже зрівняла Нью-Мексико з землею. Тому, хоча я не хочу залишатися без своїх найкращих бійців, цей лист має дійти до вас, тож ми обійдемося.\n\nМи вижили в неможливих умовах, і багатства Колорадо великі.\n\nТож надішліть нам допомогу, Старійшини, або ця Експедиція, яку ви вважали мертвою, дійсно загине.\n\nСтарійшина Андреа Брікслі,\n\nКапітул Максон"

  nf_brotherhood_chapter_story.5.t: "Кінець Максона"
  nf_brotherhood_chapter_story.5.d: "Залишки Експедиції Максона повернулися до нас. Нашим силам бракувало можливості перевезти таку кількість людей додому повітрям, і вони були змушені подорожувати по суші і воді кількома конвоями. Дехто розсіявся, інші потрапили в засідку і загинули — лише для того, щоб їх знайшли пізніші групи.\n\nТі, хто вижив... пошкоджені, Старійшини. Не один, а двічі їхній капітул був розбитий і розсіяний, і двічі вони втрачали своїх провідних Старійшин. Ми провели панахиду за Старійшинами Кемероном та Андреа разом із тими, хто вижив, але ні Сувої, ні Головний Бібліотекар не були знайдені і повернуті, залишивши нам лише фрагментарні і суперечливі відомості про їхню історію. Схоже, що кілька груп рейдерів, деякі з Денвера, а інші з Нью-Мексико, відповідальні за поразки Експедиції. Було допущено дві ключові помилки: неналежна охорона початкового місця експедиції через уявну відсутність загроз, і надмірне використання Стелс-боїв контингентом їхніх сил через погіршення ситуації.\n\nТі, хто вижив, будуть розміщені в тимчасово переповнених приміщеннях Бункера, але мине деякий час, перш ніж когось із Братів допустять до польової служби — залежних, що змішалися з їхніми лавами, потрібно виявити шляхом ретельних інтерв'ю, поки Писарі відновлюють Сувої Експедиції Максона."
  nf_brotherhood_chapter_story.5.a: "Похмуре нагадування про те, що навіть одне хибне рішення може покласти край Експедиції."
  nf_brotherhood_chapter_story.5_tt: "§gТрагедія Експедиції Максона лягла непомірним тягарем на Бункер. Повернення такої кількості персоналу виснажує ресурси, а неможливість працювати в полі створює ще більше навантаження на польовий персонал. Максоніанці обіцяють прискорити нові підземні будівництва в Раді, і в щойно переповненому бункері незалежні Старійшини приєднуються до максоніанців, щоб пришвидшити цей план.§!\n\n"

  nf_brotherhood_chapter_story.6.t: "Заглушка локалізації всередині: Контакт з Вартовими"
  nf_brotherhood_chapter_story.6.d: "Це тимчасова подія історії Капітулу, яка чекає на написання/локалізацію. Це колорит/реклама того, якою є інша нація Братства, і служить додатковою сполучною ланкою в оповіді цього Капітулу, щоб підкреслити, що Лост-Гіллз присутній і має для них значення.\n\nЦі події зазвичай написані так, що гравець за Братство читає той самий текст, але з іншою кнопкою відповіді."
  nf_brotherhood_chapter_story.6.a: "Заглушка локалізації"
  nf_brotherhood_chapter_story.6.b: "Заглушка локалізації"
