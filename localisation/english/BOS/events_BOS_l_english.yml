 ##Texas - Credit to Applefries for both events!
  nf_brotherhood_chapter_story.8.t: "Повідомлення про розрив відносин"
  nf_brotherhood_chapter_story.8.d: "Старійшино Едварде Джефферсон Раск,\n\nПісля років безгосподарності і нехтування вашими обов'язками перед Лост-Гіллз, а також вашого повного ігнорування Кодексу, Рада Старійшин прийняла рішення відкликати нашу підтримку і визнання вашого Капітулу Братства Сталі в Далласі. Від цього моменту ваш відступницький капітул більше не буде частиною нашого експедиційного реєстру, і підтримка з боку Лост-Гіллз відтепер буде припинена.\n\nВаш капітул став недисциплінованим і байдужим до нашої праведної справи, і хоча ми розуміємо прагматичну потребу у вербуванні сторонніх, ми вважаємо, що ви часто нехтуєте необхідністю освіти в їхньому навчанні. Багато чужинців бачать Техаське Братство не як розпорядника технологій, а як звичайну банду, що відволікається на битви з чужинцями та сміттярами. Ви втратили з поля зору наші цілі, а отже, втратили право на наші послуги.\n\nМи порадимо іншим капітулам — навіть тим, що належать до норовливого Середнього Заходу — триматися подалі від вашого єретичного керівництва. Ваша позиція в реєстрі була замінена позицією Капітулу Аламо.\n\nХоча родина Тьорні вірить, що вас можна виправити і повернути до нашої справи, Рада не має такої віри. Ми вважаємо вас і тих, хто йде за вами, такими, що відреклися від своїх клятв і нашої справи.\n\nЯкщо ви схаменетеся і вибачитеся за свої дії, ми розглянемо ваш реабілітаційний вирок. Але наразі Техаський Капітул, в очах [BOS.getName], закритий.\n\nAd Victoriam,\n\nРада Старійшин, [BOS.getName]"
  nf_brotherhood_chapter_story.8.a: "Раск лише шкодує, що не передбачив цього раніше."
  nf_brotherhood_chapter_story.8.b: "Ми звертаємося до Капітулу Аламо."
  nf_brotherhood_chapter_story.8_tt: "§RМи більше не залежимо від Лост-Гіллз і тепер самі по собі.§!\n\n"

  nf_brotherhood_chapter_story.801.t: "Гірке прощання Раска"
  nf_brotherhood_chapter_story.801.d: "Раді Старійшин — я припускаю, що це буде моє останнє комюніке вам. Хотілося б, щоб це було за кращих обставин. Якщо ви хочете бачити, як я плазую, плачу і благаю про прощення, боюсь, цей лист вас розчарує.\n\nКоли я був молодим зброєносцем, я колись ставився до всіх вас з такою великою повагою. Могутній Лост-Гіллз — батьківщина Техаського Братства. Старійшина Ромбус дуже добре відгукувався про вас усіх, і тепер я змушений дивуватися, що ж він такого побачив, чого не бачу я. Ваша догма колись просто вб'є нас усіх, і я лише шкодую, що не зрозумів цього раніше у своєму житті. Я працював лише для того, щоб продовжити спадщину великого Старійшини Ромбуса і великого Роджера Максона. Пустивши коріння в цьому регіоні, я зробив нашу організацію дуже популярною і здатною до самозабезпечення.\n\nНаш капітул захистив Техас і ширшу Пустку від багатьох технологічних катастроф. Ми завадили Армії Аттіса мутувати Пустку, несправному Г.Е.К.К. вийти з-під контролю, і зупинили численні рейдерські банди від розграбування багатьох стародавніх озброєнь цього штату. Якою саме частиною нашої місії ми знехтували, окрім ігнорування ваших застарілих наказів і самогубних доктрин?\n\nДозвольте мені нагадати вам, де ви знаходитесь — замкнені під землею, ховаєтесь від набагато сильнішого і чисельнішого супротивника, який цілком міг би стати нашим найбільшим союзником, якби ви не були такими впертими.\n\nМені шкода юну Кетрін, яка має таку віру в вас, що побіжить на самогубну місію за вашим покликом. Мені шкода тих, хто настільки ошуканий вашими історіями про велич, що не бачить у вас тих боягузливих псів, якими ви насправді стали.\n\nЯ виконаю місію, яку ви мені доручили — краще, ніж ви коли-небудь могли б сподіватися, застрягши в могилі, яку ви самі собі викопали.\n\nСтарійшина Дж. Раск, Техаське Братство."
  nf_brotherhood_chapter_story.801.a: "Дурні."
  nf_brotherhood_chapter_story.801.b: "Зрадник."
  nf_brotherhood_chapter_story.801_tt: "§gПісля отримання відповіді Старійшини Раска в Раді спалахують суперечки. Ллойд і Ангарад сперечаються найзапекліше: перший виступає проти скасування статусу Капітулу у світлі свідчень Старійшини Раска, а друга представляє більшість Старійшин, ображених такою непокорою з боку Раска.§!\n\n§gПортрет Старійшини Раска було прибрано із Залу Старійшин невдовзі після закінчення дебатів у Раді.§!\n\n§RТехаське Братство Сталі вилучено з нашого реєстру. Капітул Аламо продовжить з того місця, де вони зупинилися.§!"
