  nf_brotherhood_chapter_story.9.t: "Справа"
  nf_brotherhood_chapter_story.9.d: "[BOS_TCA_letter_contents_description]"
  nf_brotherhood_chapter_story.9.a: "Відправте це до [BOS.getName]."
  nf_brotherhood_chapter_story.9.b: "[BOS_TCA_letter_contents_bos_response]"
  nf_brotherhood_chapter_story.9_tt: "§gЗвістка про падіння Безсмертного одностайно вітається Радою Старійшин. Безсмертний був предметом багатьох дебатів і великого головного болю. Риторика Ллойда знаходить нове підґрунтя завдяки комюніке [TCA.getName], оскільки один з наших капітулів стає ближчим до його слів.§!\n\n"

  BOS_TCA_letter_contents_description_betty: "Особисто я не стала б нічого вам надсилати, але тут у мене за спиною Авель дихає, а до нього варто прислухатися, тому ось я тут, переймаюся надсиланням. Вважайте це оновленням інформації та попередженням.\n\nТой божевільний придурок, який бігав і називав себе Безсмертним? Ми витягли його з броні, а його труп спалили і розвіяли над П'юджет-Саундом. Тепер тут керуємо ми, і ми будемо діяти зовсім не так, як той мудакуватий гуль. Ми не толеруємо рабство чи фанатизм, тож ми повернемо на північ, щоб перетворити ще трохи рейдерів на шлак. Але в Орегоні також є супермутанти, і я думаю, що цю гарячу проблему можна вирішити, не перестрілявши їх усіх. Тож знаєте що? Я планую закинути вудки, подивитися, що з ними відбувається.\n\nОсь чим ми збираємося займатися. Ви можете або зібратися з думками і не стояти на нашому шляху, або продовжувати бути мудаками і підтримувати те, що призведе до загибелі людей. Зважаючи на те, що я чула про ситуацію в Каліфорнії, б'юся об заклад, що шанси не на вашу користь.\n\n- Бетті"
  BOS_TCA_letter_contents_description_dan: "Я передаю хороші новини з надією, що Рада Старійшин відреагує позитивно. Так званого Безсмертного скинуто з Голки, і постає краще Братство. Наші наміри збігаються з політикою місій Братства, тоді як наша зовнішня політика узгоджуватиметься з Бункером Епсилон та концепцією Славної Мети. Багато чого буде зроблено щодо конфіскації небезпечних технологій та приховування Об'єкту P-1, щоб ніхто не зміг ним знову зловживати. На жаль, наша робота ще не завершена; ми повинні рухатися до Ванкувера і убезпечити цей регіон від небезпечних партизанів. Крім того, на сході від нас знаходяться колишні власники Сіетла, і за ними потрібно стежити. Коридор до наших Братів у Монтані буде нашим пріоритетом на даному етап, перш ніж ми зможемо розглядати будь-що на Півдні.\n\nБільше деталей міститься в цьому посланні. Я сподіваюся, що коли прийде час, Лост-Гіллз знайде місце для прийняття Славної Мети, і ми зможемо крокувати в майбутнє пліч-о-пліч.\n\n- Убер Дан"
  BOS_TCA_letter_contents_description_abel: "Я не сумніваюся, що це послання дійде до вас, і що у вас виникне чимало запитань щодо стану Каскадії. Зміст передано як до Лост-Гіллз, так і до Бункера Епсилон, що гарантує, що всі будуть на одній хвилі щодо того, що сталося, незалежно від їхньої позиції.\n\nСтарійшина Сіріс, той, хто називав себе Безсмертним, мертвий. Його тіло було знищено, і зараз ми полюємо на будь-які залишки тих, хто бажає продовжувати його злочини проти людства. Важко навіть уявити зусилля, необхідні для відновлення життя після того, що тут було зроблено, не кажучи вже про депрограмування ідеології Чорних Паладинів. Розробляються подальші плани вирушити на північ і розібратися з іншими подібними групами, перш ніж ми візьмемо під контроль Аляскинський нафтопровід Британської Колумбії. Знадобиться деякий час, щоб задокументувати все, що тут сталося, і я не сумніваюся, що колись ви дізнаєтеся більше, але з мого досвіду стала зрозумілою одна річ, яку я вважаю за потрібне донести до всіх сторін.\n\nБратство Сталі бореться не лише за збереження технологій і не просто тримає небезпеки подалі від людей, доки вони не будуть готові. Ми в наш час протистоїмо могутнім силам невидимого світу, злим духам, які міцно оселилися в найтемніших глибинах всіх мислячих розумів, незалежно від мутації чи автоматизації. Старійшина Сіріс був ними майже повністю поглинутий. Мене цікавить, чи підуть за ним до загибелі світу інші члени нашої організації. Але в чому я не сумніваюся, так це в тому, що [TCA.getName] подбає про те, щоб наша Справа зіткнулася з цими духами. Що б ми не знайшли, в найтемніших глибинах чи найглибших снігах, ми будемо до цього готові. Вони не затягнуть нас назад через якесь божевільне переконання.\n\n[TCA.getLeader], Лідер [TCA.getName]"

  BOS_TCA_letter_contents_response_betty: "Це була погроза чи примхлива дитина?"
  BOS_TCA_letter_contents_response_dan: "Для нас все одно добре, хоча для Бункера Епсилон ще краще."
  BOS_TCA_letter_contents_response_abel: "Авель залишає багато тем для роздумів."

  #Circle of Steel Events.
  nf_brotherhood_circle_of_steel.1.t:0 "Дивне прохання"
  nf_brotherhood_circle_of_steel.1.d:0 "Старійшина Ллойд стоїть серед групи юних послушників, висловлюючи їм похвалу за їхні недавні досягнення. Його слова заохочення раптово уриваються несподіваним втручанням. Крістін, досвідчена агентка Сталевого Кола, підходить із проханням, яке викликає здивування серед послушників: переведення до Капітулу Мохаве. Послушники обмінюються поглядами, в їхніх виразах облич змішалися недовіра і цікавість. Мохаве сумнозвісна, виснажлива і невблаганна територія, навряд чи бажане місце служби за будь-якими стандартами. Проте прохання Крістін тверде. Старійшина Ллойд, на мить спантеличений, обмірковує незвичне прохання. Послужний список Крістін як агента гідний похвали, і в його голові промайнула думка: можливо, якщо дозволити їй служити там, де лежить її душа, це принесе кращі результати. Чи може за цим проханням критися щось більше, ніж здається на перший погляд? Особистий мотив?"
  nf_brotherhood_circle_of_steel.1.a:0 "Залишити її тут."
  nf_brotherhood_circle_of_steel.1.b:0 "Відпустити її."

  nf_brotherhood_circle_of_steel.101.t:0 "Нарешті возз'єдналися"
  nf_brotherhood_circle_of_steel.101.d:0 "У ранкові години біля воріт Хідден-Веллі з'являється постать. Сонце світить їй у спину, і її силует приховує пил та бруд, що скупчилися на її одязі та рюкзаку, але снайперська гвинтівка, перекинута через плече, добре помітна. На неї чекають: вона подорожувала за прямим наказом Старійшин Лост-Гіллз, щоб підкріпити Капітул Мохаве.\n\nЕлайджі нічого не залишається, окрім як привітати агентку Сталевого Кола якомога тепліше за цих обставин і розмірковувати про її мотиви.\n\nЕлайджа несе пряму відповідальність за розрив Лицаря Крістін і Писаря Вероніки, і лише Вероніка про це не знає. Одне можна сказати напевно: послужний список Крістін бездоганний, і вона стала чудовим надбанням.\n\nЕлайджі просто доведеться з цим змиритися."
  nf_brotherhood_circle_of_steel.101.a:0 "Вероніка і Крістін починають проводити багато часу разом."

  nf_brotherhood_circle_of_steel.2.t:0 "Угоди на колесах"
  nf_brotherhood_circle_of_steel.2.d:0 "Коли день добігає кінця, Старійшина Тьорні, втомлена від своїх обов'язків, перебирає стопку звітів Сталевого Кола, прагнучи раніше лягти спати. Зазвичай вона знаходить певне задоволення в цих перевірках наприкінці дня, але сьогодні втома прагне прискорити її рутину.\n\n Щойно вона збирається закінчити, один зі звітів сповзає зі стопки і привертає її увагу — пропозиція від сміттяра продати пошкодженого Сек'юритрона. Ця несподівана знахідка порушує її бажання відпочити, викликаючи низку думок. "

  #Circle of Steel Events.
  nf_brotherhood_circle_of_steel.1.t:0 "A Odd Request"
  nf_brotherhood_circle_of_steel.1.d:0 "Elder Llwyd stands amidst a group of young initiates, offering commendations for their recent achievements. His words of encouragement are abruptly cut short by an unexpected interruption. Christine, a seasoned Circle of Steel agent, approaches with a request that casts a ripple of surprise among the initiates: reassignment to the Mojave Chapter. The initiates exchange glances, their expressions a mix of disbelief and curiosity. The Mojave is notorious, a grueling and unforgiving frontier, hardly a desirable post by any standard. Yet, Christine's request is firm. Elder Llwyd, momentarily taken aback, ponders the unusual petition. Christine's record as an agent is commendable, and the thought crosses his mind: perhaps allowing her to serve where her passion lies could yield greater results. Could there be more to this request than meets the eye? A personal motive?"
  nf_brotherhood_circle_of_steel.1.a:0 "Keep her here."
  nf_brotherhood_circle_of_steel.1.b:0 "Let her go."

  nf_brotherhood_circle_of_steel.101.t:0 "Reunited At Last"
  nf_brotherhood_circle_of_steel.101.d:0 "In the early hours of the morning, a figure appears at the gates to Hidden Valley. Sun at her back, her silhouette hides the dust and grime that's built up on her clothing and pack, but the sniper rifle slung across her shoulder is evident. She's expected - having travelled under the direct orders of the Elders of Lost Hills to reinforce the Mojave Chapter.\n\nThere's nothing for Elijah to do, except to greet the Circle of Steel agent as warmly as possible under the circumstances, and wonder as to her motivations. \n\nElijah is directly responsible for breaking up Knight Christine and Scribe Veronica, and it's only Veronica who doesn't know it. One thing is certain: Christine's record is unassailable, and she's become a fantastic asset.\n\nElijah will just have to make it work."
  nf_brotherhood_circle_of_steel.101.a:0 "Veronica and Christine start spending a lot of time together."

  nf_brotherhood_circle_of_steel.2.t:0 "Deals on Wheels"
  nf_brotherhood_circle_of_steel.2.d:0 "As the day wanes, Elder Torni, weary from her duties, sifts through a stack of Circle of Steel reports with an aim for an early night. Typically, she finds a certain satisfaction in these end-of-day reviews, but tonight exhaustion seeks to hasten her routine.\n\n Just as she prepares to conclude, a report slides off the pile, catching her attention - an offer from a scavenger to sell a damaged Securitron. This unexpected find disrupts her desire for rest, igniting a trail of thought. The Securitron could be a covert key to New Vegas, a silent watcher in the urban sprawl of the Strip - working entirely outside from House's gaze. Alternatively, its advanced components could be a treasure trove for Brotherhood tech. The wheels in Torni's mind turn..."
  nf_brotherhood_circle_of_steel.2.a:0 "Recruit them."
  nf_brotherhood_circle_of_steel.2.b:0 "Crack open the bot."

  nf_brotherhood_circle_of_steel.3.t:0 "Loose Lips"
  nf_brotherhood_circle_of_steel.3.d:0 "In a stark interrogation room, Elder Angharad stands before a captured Desert Ranger, the scene illuminated by a harsh overhead light. Yet, the atmosphere is far from tense. The Ranger, curiously enough, appears inebriated, her words flowing as freely as the alcohol that loosened her tongue. She spills information with an ease that surprises Angharad, offering insights and details that are invaluable. Her carefree, almost nonchalant attitude towards the gravity of her situation is striking. Years of relentless combat have seemingly eroded her regard for authority, leaving behind a jaded warrior with little left to lose.\n\n Despite the unconventional nature of this encounter, Angharad sees an unexpected opportunity. This Ranger, with her wealth of experience and apparent disregard for allegiance, could prove to be a valuable asset to Lost Hills. The only catch: her affinity for the bottle..."
  nf_brotherhood_circle_of_steel.3.a:0 "Promise her a steady supply."
  nf_brotherhood_circle_of_steel.3.b:0 "Use her in a prisoner exchange."

nf_brotherhood_council_reforms.1.a:0 "Більш тривалі терміни!"
nf_brotherhood_council_reforms.1.b:0 "Коротші терміни!"
nf_brotherhood_council_reforms.1.c:0 "Залишити все як є."
nf_brotherhood_council_reforms.1.tt:0 "Вибори Верховного Старійшини відбуватимуться кожні §Y[?BOS.BOS_election_months_tt]§! місяців."
nf_brotherhood.1.t:0 "Встановлення правосуддя"
nf_brotherhood.1.d:0 "10 жовтня 2077 року капітан Мексон і його люди з жахом дізналися, що вчені з West-Tek у Маріпосі використовували військовополонених як піддослідних для генноінженерного Вірусу Примусової Еволюції (F.E.V.). Те, як він вчинив із цими вченими, стало зразком для подальших дій Братства."
nf_brotherhood.1.a:0 "Їхні знання цінніші за їхні провини."
nf_brotherhood.1.b:0 "Він знищив їх – бо є межа для науки."
nf_brotherhood.2.t:0 "Експедиція в Сяйво"
nf_brotherhood.2.d:0 "У 2134 році новоутворена фракція Братства на чолі з сержантом Деннісом Алленом звернулася до Ради Старійшин із проханням дозволити дослідити залишки наукової бази West-Tek у пошуках технологічних артефактів. Схвалення або відмова в цьому питанні назавжди відлунювали в історії Братства."
nf_brotherhood.2.a:0 "Йому дали дозвіл – відкриття вартувало ризику."
nf_brotherhood.2.b:0 "Йому відмовили – усе потребує ретельного планування."
nf_brotherhood.3.t:0 "Гадюки"
nf_brotherhood.3.d:0 "У 2155 році Братство відрядило кілька загонів у Пустку для знищення банди Гадюк. Для Старійшин це виглядало як навчання, адже невеликий загін у силовій броні, здавалося, без проблем упорається з будь-якими рейдерами. Один із загонів, очолюваний самим Верховним Старійшиною Мексоном II, виявив Гадюк. Очікуючи, що ті втечуть при першому ж погляді на броню, Мексон зняв шолом. Він недооцінив їхній фанатизм і отруєну зброю. Одне поранення стрілою стало смертельним – Верховний Старійшина помер за кілька годин."
nf_brotherhood.3.a:0 "Братство відступило!"
nf_brotherhood.3.b:0 "Братство помстилося за Мексона!"
nf_brotherhood.4.t:0 "Битва за Наварро"
nf_brotherhood.4.d:0 "Війна з Анклавом стала найбільшою можливістю для Братства за останні десятиліття. Сотні одиниць передових технологій і древніх секретів – готові до здобуття. Задля цієї мети Братство зібрало всі свої сили, мобілізувавши понад тисячу паладинів з різних бункерів і відділень Пустки. Але в ході битви стало зрозуміло: масова армія НКР зазнає нищівних втрат і не здатна втримати тиск. Перед Братством постала моральна дилема: здобути технології, дотримуючись першого принципу, чи захистити солдатів і громадян НКР – тих, кого може врятувати лише Братство Сталі?"
nf_brotherhood.4.a:0 "Нехай НКР їх відволікає – таємниці Наварро стануть нашими!"
nf_brotherhood.4.b:0 "Ми захистили людей Мексона – і здобули їхню вірність."
nf_brotherhood.5.t:0 "Спільна мова з дикунами"
nf_brotherhood.5.d:0 "Народ Умбри не лише не чинить опору нашій присутності – вони надто розумні, щоби намагатися це зробити."
nf_brotherhood.5.b:0 "Вимагати, щоб вони схилили коліна."
nf_brotherhood.6.t:0 "Альянс із Арройо?"
nf_brotherhood.6.d:0 "Люди з Арройо вже давно користуються нашою прихильністю – зрештою, саме вони дали світові Обраного, який колись урятував Пустку. Ми можемо запропонувати їм захист і союз, адже вже надходять тривожні повідомлення про активність супермутантів на далекій півночі."
nf_brotherhood.6.a:0 "Вони стануть гідними союзниками!"
nf_brotherhood.6.b:0 "Це – марна трата ресурсів."
nf_brotherhood.7.t:0 "Проблеми вдома"
nf_brotherhood.7.d:0 "Нещодавно група паладинів Братства напала на патруль Ші, сприйнявши його за рейдерів. Ші вимагають пояснень. Нам слід бути обережними з відповіддю, аби не зруйнувати відносини з цією високотехнологічною фракцією."
nf_brotherhood.7.a:0 "Наші паладини діяли, аби захистити цивільних."
nf_brotherhood.7.b:0 "Паладини не знали, що то були Ші."
nf_brotherhood.7.c:0 "Ші отримали по заслузі за втручання!"
nf_brotherhood.8.t:0 "Експедиція в Кремнієву долину"
nf_brotherhood.8.d:0 "Кремнієва долина приховує таємниці, які ще не відкрито навіть нами. Що кілька років Західне Братство організовує туди експедицію. Що вдасться знайти цього разу?"
nf_brotherhood.8.a:0 "Древній комп’ютер."
nf_brotherhood.8.b:0 "Запаси високоякісного металу."
nf_brotherhood.9.t:0 "Стримування рейдерської агресії"
nf_brotherhood.9.d:0 "Люди з колишнього Сан-Франциско постійно потерпають від рейдерських банд, попри всі наші зусилля. Нещодавно місцевий кримінальний лідер запропонував свою допомогу в боротьбі з рейдерами – в обмін на особисте помилування..."
nf_brotherhood.9.a:0 "Хто краще зупинить злочинців, як не самі злочинці?"
nf_brotherhood.9.b:0 "Братство не знижує себе до таких зв’язків!"
nf_brotherhood.10.t:0 "Запрошення від Братства"
nf_brotherhood.10.d:0 "Братство Сталі надіслало нам запрошення приєднатися до їхньої фракції, вважаючи, що це піде на користь обом сторонам."
nf_brotherhood.10.a:0 "Прийняти запрошення."
nf_brotherhood.10.b:0 "Відмовити. Ми впораємось без них."
nf_brotherhood.13.t:0 "Пропозиція від Братства?"
nf_brotherhood.13.d:0 "Братство Сталі пропонує нам обміняти низку передвоєнних військових дисків і навчальних матеріалів на промислове обладнання, що лишилося на нашій території. Як нам відповісти?"
nf_brotherhood.13.a:0 "Інформація – це сила! Ми все одно не змогли б їх запустити."
nf_brotherhood.13.b:0 "Надавати щось Братству – це ризиковано."
nf_brotherhood.14.t:0 "НКР приймає наші умови"
nf_brotherhood.14.d:0 "НКР погодилась обміняти промислове обладнання на військову інформацію та навчальні матеріали. Ми завершили з цими знаннями ще десятиліття тому, а ось ці машини приведуть нас далеко!"
nf_brotherhood.14.a:0 "Гідна угода."
nf_brotherhood.15.t:0 "НКР відхиляє наші умови"
nf_brotherhood.15.d:0 "НКР не бажає віддавати машини, якими вони навіть не здатні користуватись! Очевидно, вони намагаються стримати нас у всьому. Доведеться обходитись тим, що є в Мексоні та на наших територіях у Сан-Франциско."
nf_brotherhood.15.a:0 "Обійдемось наявним."
nf_brotherhood.16.t:0 "Експедиція до Ванденберга"
nf_brotherhood.16.d:0 "Коли впали бомби, дехто був готовий дати відсіч – Ванденберг був одним із таких місць. Його шахти були оснащені зенітними ракетами, радари безперервно сканували обрій, а системи оборони були найсучаснішими. Тепер же це лише світне згарище скрученого арматурного заліза й сталевих проваль, заповнених слизом і покинутими технологіями."
nf_brotherhood.16.a:0 "Пріоритет – рідкісні компоненти."
nf_brotherhood.16.b:0 "Зібрати все паливо і металобрухт."
nf_brotherhood.16.c:0 "Відбудувати бункер і радіовежу."
nf_brotherhood.17.t:0 "Лазери за людей?"
nf_brotherhood.17.d:0 "Братство надіслало розвідника з голографічною запискою від квартирмейстера Лост-Гіллз. У ній сказано, що Братство має надлишок лазерної зброї, однак їм бракує людей. Якщо ми надішлемо їм кількох рейнджерів, вони готові переслати нам озброєння."
nf_brotherhood.17.a:0 "Ми згодні!"
nf_brotherhood.17.b:0 "Ми відмовляємось."
nf_brotherhood.18.t:0 "Вантаж прибув"
nf_brotherhood.18.d:0 "Надіслане Братством Сталі озброєння нарешті прибуло. Ми вже відправляємо добровольців на їхній фронт."
nf_brotherhood.18.a:0 "Зброя – нарешті!"
nf_brotherhood.19.t:0 "Зачекайте, навіщо вони це зробили?"
nf_brotherhood.19.d:0 "Це від самого початку не було гарною ідеєю."
nf_brotherhood.19.a:0 "Можливо, іншим разом."
nf_brotherhood.20.t:0 "Прибули рейнджери!"
nf_brotherhood.20.d:0 "Виконуючи умови обміну, Пустельні рейнджери надіслали великий підрозділ своїх бійців для підтримки нас."
nf_brotherhood.20.a:0 "Ласкаво просимо до Братства Сталі"
nf_brotherhood.22.t:0 "Висунути вимогу щодо Затоки"
nf_brotherhood.22.d:0 "Наш контроль над Великою Зоною Затоки не викликає сумнівів. Ми маємо вимагати від НКР офіційної передачі цього регіону. Хоча він не має критичного стратегічного значення, його інфраструктура дозволить нам розширити операції в регіоні та створить ключовий буфер на шляху до мосту Золоті Ворота."
nf_brotherhood.22.a:0 "Негайно надіслати вимогу."
nf_brotherhood.23.t:0 "Ультиматум від Братства"
nf_brotherhood.23.d:0 "Ми отримали пряму вимогу від самого Братства. Прагнучи остаточно закріпити свій контроль над Затокою, вони вимагають передачі Санта-Рози, Сан-Рафаеля та Пойнт-Ґріна. Враховуючи, що наші рейнджери зараз зайняті, публічна відмова може викликати паніку серед населення – особливо зважаючи на те, що востаннє подібна ситуація призвела до втрати наших золотих резервів."
nf_brotherhood.23.a:0 "Пойнт-Ґрін? Можуть забрати."
nf_brotherhood.23.b:0 "До біса їх!"
nf_brotherhood.24.t:0 "НКР відмовляє!"
nf_brotherhood.24.d:0 "Лише через кілька днів після надсилання вимоги ми отримали відповідь від НКР – і вона категорично неприйнятна. Вони відкинули нашу претензію та заявили, що Затока є й залишиться їхньою. Схоже, сподівання уникнути війни вичерпані."
nf_brotherhood.24.a:0 "Хай буде так."
nf_brotherhood_foreign_elder.1.t:0 "Лост-Гіллз призначає [This.GetLeader] Верховним Старійшиною"
nf_brotherhood_foreign_elder.1.d:0 "Після наших значних перемог Лост-Гіллз ухвалив рішення призначити нас Верховним Старійшиною Братства Сталі. Це рішення має величезні наслідки: ми відмовимось від локального командування заради керівництва всім Братством Сталі!"
nf_brotherhood_foreign_elder.1.a:0 "Прийняти честь"
nf_brotherhood_foreign_elder.1.a.tt:0 "Ми перейдемо під контроль Лост-Гіллз, втративши поточне дерево фокусів і національні духи, отримавши натомість їхні. Наші держави об'єднаються."
nf_brotherhood_foreign_elder.1.b:0 "Прийняти – але керуватимемо ми"
nf_brotherhood_foreign_elder.1.b.tt:0 "Ми приймаємо призначення, але замість того, щоб слідувати політиці Лост-Гіллз, ми продовжимо свою місію. Лост-Гіллз буде приєднано до нас, наші радники, духи та дерево фокусів залишаться незмінними."
nf_brotherhood_foreign_elder.1.c:0 "Ми обираємо статус-кво, дякуємо."
nf_brotherhood_foreign_elder.2.t:0 "Новий Верховний Старійшина"
nf_brotherhood_foreign_elder.2.d:0 "Як Лост-Гіллз, ми беремо на себе священний обов'язок – не допустити знецінення спадщини Роджера Мексона. Під нашим керівництвом Братство має найвищі шанси на тріумф!"
nf_brotherhood_foreign_elder.2.a:0 "Ad Victoriam!"

nf_brotherhood_operations.9.d: "Пізно вночі в кабінеті Старійшини Френсіса відбувається зустріч із Писарем, якого рідко побачиш, — агентом Сталевого Кола, Писарем Валері.\n\n\"Без чаю, Валері? Справи, мабуть, кепські... чи ти втратила до нього смак у Каліфорнії?\" — жартує Френсіс.\n\nВалері мляво посміхається Френсісу. \"Кепські — не те слово. Лост-Гіллз наказав мені повернутися до Затоки деякий час тому, щоб стежити за Журавлями. Тепер Коло вважає, що [NCR.getLeader] схвалив таємні заходи для забезпечення перемоги Ло Пана. Ця битва на вулицях нестерпна для Шейді-Сендс, і вони прагнуть коронувати свого чемпіона — назавжди.\"\n\nФренсіс робить ковток чаю, відкидаючись на спинку крісла. \"Розумію. Я так розумію, твій візит означає, що Старійшини Лост-Гіллз переходять до дій?\"\n\nВалері киває: \"Так. Прикро, але Рада Старійшин вважає, що це битва, яку ви не можете дозволити собі програти, Старійшино. Коло працює над тим, щоб гарантувати ваш успіх. Зі свого боку, ви повинні залучити кожного доступного Лицаря до миротворчих місій. Ми подбаємо про те, щоб хаос між Драконами та Журавлями тривав якомога довше. Гвардія буде виснажена, тож втручайтеся від їхнього імені за кожної нагоди і переконайтеся, що люди знають: лише завдяки Братству цей хаос взагалі вдається стримувати.\"\n\n\"Можливо, тоді, — відповідає Старійшина Френсіс, — вони зрозуміють, що ми весь цей час лише намагалися їх захистити.\""
nf_brotherhood_operations.9.a: "Побачимо, чи цього буде достатньо."
nf_brotherhood_operations.9.b: "Обидва впевнені, що план спрацює."

#Ніхто так і не додав локалізацію для цього лол
nf_brotherhood.26.t:0 "Перемога або смерть"
nf_brotherhood.26.d:0 ""
nf_brotherhood.26.a:0 ""
nf_brotherhood.26.b:0 ""
nf_brotherhood.28.t:0 "Вибір гравця: Умбра"
nf_brotherhood.28.d:0 "У вас є вибір, вперед."
nf_brotherhood.28.a:0 "Добре, приєднуюсь"
nf_brotherhood.28.b:0 "Пф, відчепись, ботане"
nf_brotherhood.30.t:0 "Вибір гравця: Мохаве"
nf_brotherhood.30.d:0 "У вас є вибір, вперед."
nf_brotherhood.30.a:0 "Добре, приєднуюсь"
nf_brotherhood.30.b:0 "Пф, відчепись, ботане"
nf_brotherhood_council_politics.1.t:0 "Інтриги Ради"
nf_brotherhood_council_politics.1.d:0 "Старійшини в Лос-Гіллз завжди славилися тим, що плели інтриги один проти одного. Нинішні звинувачення змусили [BOS.getLeader] застосувати санкції до звинуваченого блоку на час вирішення цього питання."
nf_brotherhood_council_politics.1.1:0 "Ромбіанці зазнають поразки!"
nf_brotherhood_council_politics.1.2:0 "Мексоніанці зазнають поразки!"
nf_brotherhood_council_politics.1.3:0 "Культисти зазнають поразки!"
nf_brotherhood_council_politics.1.4:0 "Реформісти зазнають поразки!"

nf_brotherhood_council_politics.2.t:0 "Дебати у раді"
nf_brotherhood_council_politics.2.d:0 "Старійшини в Лост-Гіллз постійно ведуть дебати. Під час нещодавніх несуттєвих дебатів один із блоків запропонував беззаперечне рішення, завдяки чому йому вдалося переманити на свій бік частину старійшин."
nf_brotherhood_council_politics.2.1:0 "Праві були ромбіанці"
nf_brotherhood_council_politics.2.2:0 "Праві були мексоніанці"
nf_brotherhood_council_politics.2.3:0 "Праві були культисти"
nf_brotherhood_council_politics.2.4:0 "Праві були реформісти"

nf_brotherhood_council_politics.3.t:0 "Внутрішня боротьба"
nf_brotherhood_council_politics.3.d:0 "Рада старійшин у Лост-Гіллз дедалі більше роздирається внутрішніми конфліктами. Командна вертикаль паралізована, ефективність – підірвана, а довіра – під питанням."
nf_brotherhood_council_politics.3.1:0 "Рада знову гризеться!"

nf_brotherhood_council_politics.4.t:0 "Герой серед старійшин"
nf_brotherhood_council_politics.4.d:0 "У Раді на перший план вийшов харизматичний і працьовитий старійшина, адже, здається, роботи виконується більше, ніж зазвичай! Він привертає до своєї позиції нових прихильників!"
nf_brotherhood_council_politics.4.1:0 "Це ромбіанський старійшина!"
nf_brotherhood_council_politics.4.2:0 "Це мексоніанський старійшина!"
nf_brotherhood_council_politics.4.3:0 "Це культистський старійшина!"
nf_brotherhood_council_politics.4.4:0 "Це реформістський старійшина!"

nf_brotherhood_council_politics.5.t:0 "Призначення Верховного Старійшини"
nf_brotherhood_council_politics.5.d:0 "Рада в Лост-Гіллз – це правлячий орган Братства Сталі, сформований зі старійшин, що мешкають у бункері. Саме вона визначає, хто з них стане Верховним Старійшиною. У минулому такі призначення були довічними, але нині, на тлі змагання за владу, вони трапляються дедалі частіше."
nf_brotherhood_council_politics.5.1:0 "Призначено [BOS_mari_torni.GetName]!"
nf_brotherhood_council_politics.5.2:0 "Призначено мексонського старійшину!"
nf_brotherhood_council_politics.5.3:0 "Призначено [BOS_rhiannon.GetName]!"
nf_brotherhood_council_politics.5.4:0 "Призначено [BOS_llwyd.GetName]"

  nf_brotherhood_council_politics.6.t:0 "Згасання актуальності"
  nf_brotherhood_council_politics.6.d:0 "Старійшини в Лост-Гіллз завжди мають вибір — що підтримувати та чи приєднуватися офіційно до певного Блоку. Не всі старійшини роблять це, оскільки не всім ідеологіям надано певні процедурні права. Як Старійшина, ви завжди можете висловлювати свою думку на Дебатах, але самі Дебати контролюються групами Старійшин, які мають Права блоку.\n\nНещодавно деякі групи здобули популярність і набрали обертів. Але без визнання маргінальні Старійшини незабаром повертаються до Блоків, щоб домогтися винесення на Дебати нагальних для них питань."
  nf_brotherhood_council_politics.6.1:0 "Старійшини завжди повертаються до Блоків."

nf_brotherhood_council_politics.status_quo:0 "Протистояти змінам, зберегти статус-кво"

nf_brotherhood_steel_rangers.1.t:0 "Пропозиція, варта уваги"
nf_brotherhood_steel_rangers.1.d:0 "Старійшина Ллвід із бункера Лост-Гіллз запропонував офіційний договір про мир – Каліфорнійську мирну угоду. За її умовами вояки Братства Сталі будуть амністовані, а до Кодексу внесуть поправки, що зобов'язують членів бункера підкорятись законам НКР. Це фактично означає інкорпорацію Лост-Гіллз у територію Нової Каліфорнійської Республіки. Крім того, буде створено спільну адміністрацію Сталевих Рейнджерів у штаті Мексон, яка задіє технології з бункера для розвитку регіону.\nВід такої угоди важко відмовитися."
nf_brotherhood_steel_rangers.1.1:0 "Погоджуємось."
nf_brotherhood_steel_rangers.1.2:0 "Це пастка. В атаку!"
nf_brotherhood_steel_rangers.1.3:0 "Як на мене – мені байдуже."

nf_brotherhood_steel_rangers.2.t:0 "НКР приймає!"
nf_brotherhood_steel_rangers.2.d:0 "Нова Каліфорнійська Республіка погодилася на наші умови! Підготовка до втілення угоди вже розпочалася. Ворожнеча може завершитися."
nf_brotherhood_steel_rangers.2.1:0 "Заради миру!"

nf_brotherhood_steel_rangers.3.t:0 "Покинувши бункер"
nf_brotherhood_steel_rangers.3.d:0 "Нарешті ми знову вдихаємо свіже повітря. Довгі роки ізоляції далися взнаки – дехто з Лост-Гіллз не бачив сонця вже багато літ."
nf_brotherhood_steel_rangers.3.1:0 "Приємно опинитися зовні."

nf_brotherhood_steel_rangers.4.t:0 "Формування Спільної Адміністрації Сталевих Рейнджерів"
nf_brotherhood_steel_rangers.4.d:0 "Старійшини Лост-Гіллз і Сенат НКР досягли згоди!\nНова структура під назвою Спільна Адміністрація Сталевих Рейнджерів стане керівним органом у штаті Мексон – самому серці територій НКР. Старійшини Лост-Гіллз фактично визнали владу Шейді-Сендс. Для Каліфорнії починається нова епоха."
nf_brotherhood_steel_rangers.4.1:0 "Каліфорнія змінюється!"
nf_brotherhood_steel_rangers.4.2:0 "Як вони могли!?"
nf_brotherhood_steel_rangers.4.3:0 "Це прекрасно!"
nf_brotherhood_steel_rangers.4.4:0 "Новий початок.."

nf_brotherhood_steel_rangers.5.t:0 "Спільна Адміністрація Сталевих Рейнджерів"
nf_brotherhood_steel_rangers.5.d:0 "Перші тридцять днів були найскладнішими. Лоялісти пішли в тінь, навчання за Кодексом було підпорядковане Каліфорнійській Шкільній Раді, а нова символіка та дисципліна добряче вивели з рівноваги багатьох паладинів.\nТа старійшина Ллвід зберіг холодний розум. Його особисто винагородили за зусилля у впровадженні реформ. Протягом кількох тижнів авіація НКР доставила кілька позначених пакунків для Верховного Старійшини.\nЩо всередині? Запитайте в Ллвіда."
nf_brotherhood_steel_rangers.5.1:0 ""Це особисте питання.""

nf_brotherhood_steel_rangers.6.t:0 "Каліфорнійська Ініціатива Обміну Технологіями"
nf_brotherhood_steel_rangers.6.d:0 "Старійшина Ллвід презентував довгостроковий план: упродовж наступних десятиліть передові технології Братства Сталі поступово виводитимуть із бункера Лост-Гіллз і передаватимуть до Інституту ОСІ для поширення по всій Каліфорнії. Повний ефект стане помітним лише через покоління, проте вже зараз це – обґрунтоване стратегічне вкладення."
nf_brotherhood_steel_rangers.6.1:0 "Гідний початок!"


  nf_brotherhood_integrate_guardians.1.t:0 "МІСІЯ: ДУХ-СУТНІСТЬ"
  nf_brotherhood_integrate_guardians.1.d:0 "ПОЗИВНИЙ: §RRHIANNON§!\nЗВІТ ПРО МІСІЮ: §RСлухай уважно, Кардинале. Ти виконав призначене – артефакт «світова діра» в надійних руках. Страшно уявити, що могли б вчинити Вогні, отримай вони її.\nТвоя місія завершена, а мета – досягнута. Настав час повернутись до стада. Повідом своїх вірних: відмовтесь від гербів, повертайтесь до братів.§!"
  nf_brotherhood_integrate_guardians.1.1:0 "\"Заради тебе, Дух-Сутність.\""
  nf_brotherhood_integrate_guardians.1.2:0 "\"Це ще не час!\""

  nf_brotherhood_integrate_guardians.2.t:0 "Стражі прийняли нашу пропозицію!"
  nf_brotherhood_integrate_guardians.2.d:0 "Здається, переговори старійшини Ріаннон зі Стражами принесли плоди. Вони погодились поступово згортати свою автономну ідентичність, натомість повернувшись до суворого дотримання Кодексу. Це великий день для Братства!"
  nf_brotherhood_integrate_guardians.2.1:0 "Разом ми – сила, браття!"

  nf_brotherhood_integrate_guardians.3.t:0 "Стражі залишаються осторонь"
  nf_brotherhood_integrate_guardians.3.d:0 "Старійшині Ріаннон не вдалося переконати Стражів повернутись. Кардинал лаконічно відповів, що час іще не настав. Це не дивина – подібні спроби вже були, і щоразу закінчувались однаково. Та зрештою, вони повернуться до нас."
  nf_brotherhood_integrate_guardians.3.1:0 "Можливо, колись."

  nf_brotherhood.34.t:0 "Бригада Мексона"
  nf_brotherhood.34.d:0 "Рішення захищати людей Нової Каліфорнійської Республіки виявилося вартісним – десятки паладинів Братства віддали життя в запеклих ближніх боях, тоді як Анклав знищував сотні креслень і архівів у глибинах бункера Наварро. Багато хто в НКР так і не зрозумів, наскільки вагомим був цей акт самопожертви – моральний злам, коли Братство вперше поставило людські життя вище за технології. Проте ті, хто служив у бригаді Мексона – люди, що виросли в територіях Братства – розуміли це краще за всіх. Після війни вони сформували низку міліцій, що зберегли зв’язок із Братством Сталі."
  nf_brotherhood.34.a:0 "Для нас – честь мати їх поруч."

  nf_brotherhood.35.t:0 "Покидьки нас підтримують!"
  nf_brotherhood.35.d:0 "Жителі Сан-Франциско згуртувалися навколо історії про паладинів Братства, які захищали мирних мешканців від нападів бойовиків Ші. А. Рон Майєрс, колишній технік Анклаву, який допоміг Обраному дістатись до сумнозвісної Нафтової Вишки, також приєднався до нас, разом зі своїми прихильниками – представниками бідноти Ші-тауна."
  nf_brotherhood.35.a:0 "Ласкаво просимо, містере Майєрс."

  nf_brotherhood.36.t:0 "Прикрий інцидент"
  nf_brotherhood.36.d:0 "Обидві сторони невдоволені тим, як усе відбулося, але вирішили не загострювати ситуацію. Ми проаналізували бойові тактики Ші та вилучили чимало зброї з тіл загиблих – про всяк випадок, якщо доведеться зіткнутися з Імператором."
  nf_brotherhood.36.a:0 "Мудрий запобіжний крок."

  nf_brotherhood.37.t:0 "Ворота до раю зачиняються"
  nf_brotherhood.37.d:0 "Імператор розгніваний нашою зневагою до його влади та до життя його підданих. Відтепер він заборонив будь-яку торгівлю та взаємодію з нами, відмовляється приймати делегації та вважає нашу присутність поблизу його територій неприйнятною."
  nf_brotherhood.37.a:0 "Кому цікаве белькотіння машини?"

  nf_brotherhood.38.t:0 "НКР передала нам Затоку"
  nf_brotherhood.38.d:0 "Після тривалого очікування ми нарешті отримали відповідь від НКР. Вони передають нам територію Пойнт-Грін негайно, вже розпочато виведення військ і техніки. Це знаменує зміну у відносинах із Республікою та може стати початком взаємовигідної співпраці."
  nf_brotherhood.38.a:0 "Час знову відкрити бункер нагорі."

  nf_brotherhood.39.t:0 "Відмова від [From.GetNameDef]"
  nf_brotherhood.39.d:0 "Після несподіваної затримки емісари [From.GetNameDef] повернулись з відповіддю від [From.GetLeader]. Відповідь – негативна. Якщо ми хочемо підкорити [From.GetNameDef], доведеться вдатися до сили."
  nf_brotherhood.39.a:0 "Хай буде так."

  nf_brotherhood.40.title:0 "Сили Братства в силовій броні"
  nf_brotherhood.40.desc:0 "Новини про нашу перемогу в Мохаве досягли [BOS.GetName], і вони вислали нам підкріплення! Серед поставок – додаткові комплекти силової броні T-51b для контролю над регіоном і просування вчення Братства."
  nf_brotherhood.40.a:0 "Ad Victoriam!"

  nf_brotherhood.41.title:0 "Ланцюг, що єднає"
  nf_brotherhood.41.desc:0 "[BOS.GetLeader] звертається до нас із закликом про допомогу. Братство опинилось перед найтемнішою загрозою. Більш нещадною, ніж орди Творця, більш масштабною, ніж воєнна машина Анклаву. НКР загрожує самому існуванню того, що ми поклялися оберігати. Якщо ми не підтримаємо Лост-Гіллз, Каліфорнія впаде в ту ж темряву, що колись привела до Великої війни. \n\nТож дотримуймося Кодексу та готуймося до битви. Ми збережемо Пустку, як завжди."
  nf_brotherhood.41.a:0 "Ad Victoriam!"

  nf_brotherhood.101.title: "Підкріплення з Лост-Гіллз"
  nf_brotherhood.101.desc: "Рада Старійшин із Лост-Гіллз знову почала надсилати нам украй необхідну живу силу та спорядження."
  nf_brotherhood.101.a: "Ad Victoriam!"

  nf_brotherhood.102.title: "Підкріплення від експедиційних капітулів"
  nf_brotherhood.102.desc: "Усвідомлюючи сумний стан справ у Лост-Гіллз, кілька капітулів надіслали нам підтримку."
  nf_brotherhood.102.a: "Ad Victoriam!"