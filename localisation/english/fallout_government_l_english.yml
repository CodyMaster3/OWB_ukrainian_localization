#BLC#
BLC_ruler_party:0 "Кліка Маллета"
BLC_ruler_party_long:0 "Кліка Маллета\n§gОхоплюючи більшість колишніх в’язнів тюремного комплексу Тіббетса та деяких інших непокірних персонажів з Пустки, Кліка Маллета є ще одним шоу одноосібного правителя. Якщо ви хочете бути впливовим тут, вам потрібно бути безжальним та хитрим, здобуваючи довіру своїх колег-розбійників через бійки, змагання на споживання алкоголю і джету - так, як це робили до війни політики! Поки ви корисні для боса і ваша лояльність непохитна, вам тут буде добре, хлопче.\n\nЗвичайно, Кліка часто називається «розбійниками», і її існування висить на нитці під назвою Компроміс. У будь-якому іншому цивілізованому суспільстві їх би знищили з першого дня, але країна потребувала кожного доступного ресурсу для протистояння майбутньому наступу, тому було укладено угоду. Поки Кліка діє як перша лінія оборони, вона може жити безпечно з мінімальними правовими захистами.\n\nМаллет МакБрайд - це задниця, але він найбільший і найжорстокіший серед них, і ніхто не вірить, що хтось, як він, може бути хитрим. Він вже старий чоловік і активно ізольований від усіх інших фракцій в Чорному Каньйоні, але є шанс, що Батарея повинна буде дізнатися урок - старі собаки не повинні вчити нові трюки.§!"
BLC_ruler_party_prisoners:0 "Охоронці"
BLC_ruler_party_prisoners_long:0 "Охоронці\n§gПісля того, як МакБрайда повністю відсторонили від влади і більшість його покидьків відправили назад за ґрати, тюремний комплекс після багатьох десятиліть потребував нових охоронців, щоб забезпечити порядок. Один з охоронців, Джексон, що приїхав з віддаленого місця під назвою «Форт Кап Хелл», із задоволенням прийняв цю посаду разом зі своїми досвідченими, скомплектованими миротворцями. Колишні офіцери Анклаву, дезертири з військової поліції NCR та найманці, яких доречно називають «Охоронцями Білих», всі беруть участь в його операціях і ефективно управляють нашою в’язницею.\n\nВони представляють свої власні інтереси, але на практиці не мають політичної влади в новому дворі демократії Батареї.§!"
BLC_elites_party:0 "Гільдія Торговців"
BLC_elites_party_long:0 "Гільдія Торговців\n§gГільдія була створена в першу чергу для представлення інтересів та побажань Ямпанської Спільноти, північного члена конфедерації. З цієї причини її членами, здебільшого, є міські голови їхніх міст та інші впливові особи, але через політику, яку вони проводять — вільна торгівля, нарощування флоту та грошова реформа — також є торговці та ремісники з усієї нації. Хоча вони здаються найбільш цивілізованими з усіх фракцій, вони також є найбільш жадібними та корумпованими.\n\nБеархард Ріверс — це мовний майстер, чудовий організатор і природжений лідер, але його навички сильно затьмарені його зростаючим его та егоїстичними нахилами. Якщо його амбіції не зашкодять, він буде великим активом для Батареї — але питання в тому, чи може Батарея дозволити собі бути занадто залежною від нього.§!"
BLC_intellectuals_party:0 "Трибунал"
BLC_intellectuals_party_long:0 "Трибунал\n§gЄ кілька племен та кланів, що живуть у дикій природі Колорадо, і всі вони представлені Трибуналом. Хоча Малі Змії чи Річкові Лисиці мають свою особливу та важливу роль у екосистемі Чорного Каньйону, Трибунал здебільшого складається з людей племені Розмальованих Людей. Вони захищають права своїх людей, священні місця та звичаї — але через це вони можуть виглядати рішучими антиваріантами і вперто релігійними.\n\nЇх очолює Вардед, колишній ув’язнений з Тюремного комплексу, який став їхнім шаманом після того, як його тюремні татуювання зробили його вибраним. Він повільно, але вперто радикалізував переважно мирних людей під його керівництвом, і якщо цей скажений пес вийде з-під контролю, він може легко перетворити найбільш мирний куточок Пустки на криваву бойню.§!"
BLC_people_party:0 "Конгрес Караванів"
BLC_people_party_long:0 "Конгрес Караванів\n§gПаперова мережа союзів, пов’язаних з Батареєю Меса-Верде, Конгрес Караванів є найяскравішою і найекстравагантнішою фракцією з чотирьох в Чорному Каньйоні. Не маючи власної програми, Конгрес діє як дипломатична сила між іншими трьома, щоб щодня укладати угоди та компроміси. Вони борються за те, щоб їхня слабка демократія залишалася живою, і будь-хто може приєднатися, якщо вони заради доброї справи. Їхній оригінальний склад базувався на «мандрівному місті», яке називалося Великий Караван, де люди постійно переміщувалися по Колорадо та Вайомінгу, допомагаючи своїм братам-номадам на шляху.\n\nБатарея Меса-Верде — добре відома особа в цій частині Пустки. Найближчий колишній супутник В’язня, місцевої легенди добрих вчинків, яка покинула цей район, Батарея намагається зрозуміти всі добрі справи, які залишила його подруга. Він може лише сподіватися, що вона гордиться ним.§!"

#BAG
BAG_ruler_party:0 "Кліка Колеріджа"
BAG_ruler_party_long:0 "Кліка Колеріджа\n§gОхоплюючи майже весь військовий персонал Каліфорнії, Кліка є неформальною групою солдатів і військових рекетирів, об’єднаних лояльністю до Генерала. Кліка буде служити сильному чоловіку Каліфорнії, поки він буде належно винагороджувати своїх прислужників.\n\nГенерал Колерідж - ветеран війни та палкий прихильник таких осіб, як Лі Олівер та Кассандра Мур. Він вірить, що Колорадо - це просто новий можливий штат Республіки, і що демократія працює найкраще, коли її управляють міцними руками. З розширеною мережею союзників, яку він побудував у своїй кар’єрі, він є найбільш ймовірним кандидатом на лідерство в Колорадо.\n§!"

BAG_elites_party:0 "Радіофоби"
BAG_elites_party_long:0 "Радіофоби\n§gНевелика коаліція ненависті, вони є маргінальною силою в політиці Експедиції. Великі біженці, ненависники мутантів, теоретики змов, неправильно зрозумілі "генії", безхребетні підлабузники та політичні радикали - Радіофоби є котлом вигнанців. Травмовані солдати, хіміки-залежні, вони об’єднані тільки тим, що ненавидять.\n\nНеформально очолювані сержантом Ларсеном, залежним від RadAway з 1-ї Експедиції, вони в основному борються через суперечки між Доктором і Генералом.\n§!"

BAG_intellectuals_party:0 "Академіки"
BAG_intellectuals_party_long:0 "Академіки\n§gЯдро Експедиції, Академіки включають більшість наукового відділу, надісланого в Колорадо. Вони є інтелігенцією місцевої політичної сцени, інженери, програмісти, хіміки та біологи всі знайшли своє місце в політичній машині тут - навіть деякі вчителі та студенти. Об’єднані їхньою спільною метою відновлення Купольного Дому, є небагато речей, які ідеологічно об’єднують їх. Меритократичні за природою та здебільшого на практиці, обдаровані та розумні можуть досягти найвищих посад незалежно від раси та переконань.\n\nЇх очолює доктор Ґоддард, офіційно призначений керівник Експедиції та електромеханічний інженер. Поки він на чолі, вони забезпечать Купольний Дім будь-якими засобами.\n§!"

BAG_people_party:0 "Банда Агнес"
BAG_people_party_long:0 "Банда Агнес\n§gГрупа, яка об’єдналася навколо своєї об’єднуючої фігури, "Банда" чудово вписується у фракційну боротьбу, але все ж виділяється. На поверхневому рівні здається, що вона є ще одним персонажем сильного чоловіка, який збирає посіпак, щоб виграти свою справу. Але її група насправді досить різноманітна та об’єднана ідеологічно. Вони надають перевагу дипломатичним рішенням, демократичному процесу та ідеям, що зневажаються як "комуністичні", і Банда знайшла послідовників від солдатів до вчених.\n\nДоктор Агнес - об’єднуюча фігура, медіатор між Доктором і Генералом, спокійний, але працьовитий персонаж. Якщо вона знайде в собі амбіції, можливо, колись вона стане лідером Колорадо в майбутньому...§!"

