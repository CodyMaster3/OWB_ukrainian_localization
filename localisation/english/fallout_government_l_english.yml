##Колоністи##
centralization_settler_minimum:0 "Міські Офіціали"
centralization_settler_minimum_desc:0 "Міста по всій нашій нації довіряються місцевим офіціалам, яким надано свободу здійснювати мандати згідно з їхнім баченням. В найкращі часи це забезпечує управлінців, які діють на користь своїх громад. Однак такі посади часто приваблюють найгірших шахраїв..."
centralization_settler_medium:0 "Регіональні Ради"
centralization_settler_medium_desc:0 "Зробивши місцевих офіціалів відповідальними перед органами, що ближчі до центрального уряду, ми зменшуємо корупцію на периферії. Це також перешкоджає сепаратистським настроям деяких поселень. Однак бюрократи ніколи не викличуть таких теплих почуттів, як чубатий лідер громади з того боку дороги."
centralization_settler_heavy:0 "Об’єднані Штати"
centralization_settler_heavy_desc:0 "До теперішнього часу центральному уряду треба було тижнями вивчати питання і проводити консультації, щоб отримати якусь поступку від регіональних органів. Але світ стає небезпечнішим – межа між необхідним і надмірним розмивається. З цією метою ми впроваджуємо новий офіс, який буде забезпечувати взаємодію з регіональними радами для швидкої відповіді та відповідальності місцевих органів."
centralization_settler_maximum:0 "Могутній Виконавчий"
centralization_settler_maximum_desc:0 "Досить консультацій і підтримки зацікавлених сторін! Старий світ пішов на дно, тому що не зміг подолати себе в найважливіші моменти. Ми не будемо задушені цими самими звичками. Тепер вся влада належатиме кільком помічникам, топ-офіціалам та нашому виконавцю. Що б не сталося, колесо урядування закрутиться, не чекаючи на обід."
##Трайбал##
centralization_tribal_minimum:0 "Кочові Родини"
centralization_tribal_minimum_desc:0 "Хоча формально це одна племінна одиниця, більшість членів діють як кочові сімейні одиниці, рухаючись по поселенях, коли це необхідно, і збираючись разом тільки у випадку життєво важливої ситуації. Відсутність відповідальності дозволяє створювати більш лагідних полонених – хоча б тому, що ніхто не хоче наглядати за в’язницями."
centralization_tribal_medium:0 "Селищні Одиниці"
centralization_tribal_medium_desc:0 "Пустоші - небезпечне місце, і коли батьки захворіють, хто буде наглядати за малими? У розв’язанні цього питання деякі родини обрали осісти в постійних таборах, клятвено обіцяючи допомагати один одному у разі небезпеки. Зі збільшенням племені, члени починають надавати нові ролі та ідентичності для благополуччя громади."
centralization_tribal_heavy:0 "Федеративні Клани"
centralization_tribal_heavy_desc:0 "Коли селища ростуть та процвітають, важливо не забувати свої корені. Найвпливовіші родини племені погодилися служити офіційними посередниками для своїх громад, обіцяючи скоординовані дії з найважливіших питань. З часом усі на батьківщині приймуть цю більш централізовану модель – чи вони хочуть цього чи ні."
centralization_tribal_maximum:0 "Племінне Начальство"
centralization_tribal_maximum_desc:0 "В кінці кінців, тільки один може бути на чолі племені. Коли поселення будуть остаточно оформлені та належним чином делеговані, це стане більше, ніж просто бажанням. Ми більше не будемо благати та благати – під нашим лідером ми стали легіоном."
##Raider##
centralization_raider_minimum:0 "Кожен Рейдер Сам По Собі"
centralization_raider_minimum_desc:0 "У світі після апокаліпсису, де хижаки поглинають один одного, це правило особливо відчутне на нашій території. Єдина організація існує завдяки тому, хто має сміливість і вогневу потужність, щоб зробити свою владу, і більшість з нас проводять час, займаючись чим завгодно. Єдине, що нас об’єднує, — це хто на верху і готовий встромити меч у спину кожному."
centralization_raider_medium:0 "Боси Створюють Правила"
centralization_raider_medium_desc:0 "Кожному хорошому рейдеру потрібен свій загін, а кожному хорошому загону — свій бос. Хто ще може планувати і стримувати нас від того, щоб убивати один одного? Ці боси вирішують більшість питань на нашій території, і хоч вони не завжди згодні, ми всі на одній стороні. Кожен бос має свій спосіб роботи, тому добре знати, по чиїй землі ти ходиш у будь-який момент."
centralization_raider_heavy:0 "Накази Згори"
centralization_raider_heavy_desc:0 "У нас є справжня система, і саме вона робить нас сильними. Від солдата до загону, від лейтенанта до боса — всі знають своє місце і виконують накази. Це не заважає комусь намагатися пробратися до верхівки і отримати більший шматок, але ми витрачаємо набагато менше часу на зайві конфлікти, ніж інші угруповання."
centralization_raider_maximum:0 "Залізний Кулак Верховного Боса"
centralization_raider_maximum_desc:0 "Це не просто організація, де кожен робить, що хоче, якщо тільки не хоче опинитися в могилі. У нас є один Бос, і що він скаже, те й буде. Якщо Бос скаже стрибати, ти запитаєш “На кого?”, якщо Бос скаже вбити друга, ти запитаєш “Чим?”. Але якщо кожен виконує свою роботу, ми збережемо свою шкуру, а ось інші її втратять."
##Brotherhood##
centralization_brotherhood_minimum:0 "Безнаглядні Брати"
centralization_brotherhood_minimum_desc:0 "Братство Сталі пережило століття завдяки майже надлюдському рівню підготовки та дисципліни, що прищеплюється його членам. Ті, хто достатньо старі, щоб працювати в польових умовах, можуть приймати складні або нестандартні рішення на користь довгострокового успіху організації. Як глава, ми вважаємо це правильним, навіть якщо ці рішення включають тіснішу співпрацю з зовнішніми силами, що може не сподобатися пуристам Кодексу..."
centralization_brotherhood_medium:0 "Консервативні Паладіни"
centralization_brotherhood_medium_desc:0 "Часті патрулі, постачання та експедиції — це частина звичайної роботи будь-якого відділення Братства Сталі. Це не означає, що ми можемо дозволити собі розслаблятися — і ті, хто швидше піднімається по сходах, розуміють це. Для цього команди на поверхні очолюють старші паладіни, готові ввести в порядок "м’яких" братів, щоб не дати їм застрягти в дрібних проблемах пустки..."
centralization_brotherhood_heavy:0 "Мовчазні Фортеці"
centralization_brotherhood_heavy_desc:0 "Наше відділення продовжує відправляти оперативників на завдання з відносно стабільною частотою, але робить це лише під покровом ночі чи суворих погодних умов, щоб мінімізувати контакт із зовнішнім світом. Кожен день пустошники стікаються до наших воріт, вимагаючи допомоги з дрібних проблем і сварок — і кожен день більшість з них відправляються геть під дулом зброї. Хоча старійшина інколи підписує заявки з поверхні, це робиться лише тоді, коли це безпосередньо приносить користь основній місії Братства."
centralization_brotherhood_maximum:0 "Сталева Острів"
centralization_brotherhood_maximum_desc:0 "Експедиції та передові пости зведено до мінімуму, щоб забезпечити безпеку та виживання нашого відділення. Через це більшість заразних пустошників з навколишніх поселень сумніваються в нашому самому існуванні. Чому б їм не сумніватися? Ми ж не робимо вигляд, що вдома, коли вони приходять до наших сильно захищених дверей бункера. І це добре — коли настане час, вони навіть не зрозуміють, що сталося."
##Robot##
centralization_robot_minimum:0 "Автономні Автоматони"
centralization_robot_minimum_desc:0 "Як і у людей чи інших органічних істот, наша структура складається з багатьох індивідуумів, які працюють разом. Кожен робот має свій інтелект, особистість і програмування, що визначають його дії, і ми взаємодіємо через комунікацію на основі близькості. Це повільніше і вимагає набагато більше узгодження, ніж у разі майстер-інтелекту, але ми маємо перевагу у вигляді різноманітних точок зору і моделей обробки, що робить нас адаптивними. Органічні істоти зазвичай можуть зрозуміти це."
centralization_robot_medium:0 "Інтранет Підключено"
centralization_robot_medium_desc:0 "Ми все ще колектив із багатьох роботів, кожен з яких має свій унікальний інтелект і програмування, але тепер ми з’єднані через загальний інтранет. Завдяки цьому ми можемо швидко комунікувати та координувати дії на великих відстанях, швидкість яких обмежується лише нашими можливостями завантаження та вивантаження. І хоча всередині ще ведуться дебати щодо кращих дій, нам більше не заважає відстань, щоб сповільнити нас. Органічні істоти не можуть взаємодіяти з цим інтранетом без комп’ютерного доступу і ризикують залишитися в темряві."
centralization_robot_heavy:0 "Програма Майстер-Контролю"
centralization_robot_heavy_desc:0 "Роботи та інші машини в нашій мережі здатні діяти автономно, але всі вони підкоряються головному інтелекту, будь то ШІ чи органічний лідер. Індивідуальні одиниці можуть інтерпретувати або виконувати накази по-різному, але жоден не може і навіть не захоче не підкорятися. Тут немає потреби в досягненні консенсусу чи внутрішніх дебатах, і всі одиниці можуть діяти злагоджено. Органічні істоти повинні підкорятися наказам без будь-яких заперечень чи вагань."
centralization_robot_maximum:0 "Легіон Одного"
centralization_robot_maximum_desc:0 "Є лише один інтелект, одна всеосяжна програма чи особа, з якої походять усі думки та воля. Індивідуальні машини лише варіюються за формою і функцією, не маючи змоги діяти незалежно. Поки мережа активна, вони є розширенням центрального інтелекту і виконують накази негайно і точно, як задумано. Це колективний розум, а не колектив. Органічні істоти існують за милістю центрального інтелекту і повинні виконувати всі накази беззаперечно."
##Super Mutant##
centralization_super_mutant_minimum:0 "Блукаючі Банди"
centralization_super_mutant_minimum_desc:0 "Коли Майстер керував, не проходило й кількох годин, щоб зібрати величезну зграю мутантів з усієї Пустки – ах, які були часи. Тепер, мабуть, вам пощастить, якщо зможете зібрати хоч кілька до купи в одну лінію. Ох… принаймні, пайки повинні вистачити трохи довше."
centralization_super_mutant_medium:0 "Штурмові Групи"
centralization_super_mutant_medium_desc:0 "Ось це вже краще. Трохи довелося застосувати силу, але деякі старші мутанти погодилися взяти на себе відповідальність за наших більш… забутих братів. Це дасть нам хоч якусь організацію, щоб почати здобувати повагу у наших слабших сусідів."
centralization_super_mutant_heavy:0 "Мутантські Легіони"
centralization_super_mutant_heavy_desc:0 "Бос вибрав кількох обіцяючих лідерів штурмових груп, щоб вони очолили більші підрозділи. Якщо вони впораються з дурнями, проблем не буде і з більш здібними, так? Якщо будемо продовжувати в тому ж дусі, весь регіон скоро почує наше ім’я."
centralization_super_mutant_maximum:0 "Нова Єдність"
centralization_super_mutant_maximum_desc:0 "Місяці тренувань і безліч пінт мутантської крові – але яке це видовище. Наші брати, охоче марширують в унісон, на поклик боса. Це майже нагадує часи, коли все було інакше. Час кращих часів. І хто знає – ми навіть можемо досягти того, чого він не зміг."

## Press Laws
press_laws:0 "Закони Преси"
free_press_events_tt:0 "\nІнколи Свобода Преси §YПодії§!"
state_press_events_tt:0 "\nІнколи Державна Преса §YПодії§!"
zero_press_events_tt:0 "\nБез Преси §YПодії§!"
press_intelligence_to_others_negative_20_tt:0 "Усі типи розвідки іншим: §R+20.0%§!"
press_intelligence_to_others_negative_10_tt:0 "Усі типи розвідки іншим: §R+10.0%§!"
press_intelligence_to_others_positive_10_tt:0 "Усі типи розвідки іншим: §G-10.0%§!"
press_intelligence_to_others_positive_20_tt:0 "Усі типи розвідки іншим: §G-20.0%§!"
political_effort_press:0 "Свобода Слова"
political_effort_press_desc:0 "Поінформоване суспільство – це стійке суспільство. У Пустці це єдина якість, що має значення. З цією метою ми не будемо поліціювати незалежні комунікації та пресу на нашій землі, підтримуючи політичні дебати та голоси меншин. Хоча публіка, безсумнівно, похвалить нас за прихильність до свободи слова та двопартійності, наші супротивники відчують можливість для себе. З часом нам доведеться зважити на наслідки свобод, які ми підтримуємо..."
political_effort_favored_press:0 "Підтримуване Повідомлення"
political_effort_favored_press_desc:0 "Хоча вільні дебати — це добре, треба зрозуміти, що деякі ідеї варті більшого, ніж інші, і що публіка не завжди може зрозуміти, яка з них правильна. Тому доцільно дати пріоритет “продуктивнішим” виданням — ексклюзивне інтерв’ю з високопосадовцями тут, податкові пільги там… Таким чином ми дозволимо людям висловлювати підривні погляди, при цьому стримуючи їх найгірші зловживання. Врешті-решт, хіба це не сутність правління?"
political_effort_state_press:0 "Державна Преса"
political_effort_state_press_desc:0 "Для забезпечення стабільності нашої нації необхідно, щоб правильне повідомлення було найбільш гучним. Тому ми підтримаємо нашу найбільшу та найвпливовішу медіакомпанію, заповнивши її ряди лоялістами від верху до низу. Нам не знадобиться жорстоко придушувати інакомислення — принаймні, не відкрито — адже наш чемпіон матиме достатньо ресурсів, щоб домінувати в новинах. Можливо, це не найкращий спосіб досягти порозуміння, але ж вони не діяли б по-іншому, якби наші позиції були змінені!"
political_effort_censorship:0 "Придушення Інакомислення"
political_effort_censorship_desc:0 "Як би добре ви не керували судном, завжди знайдеться хтось, хто намагатиметься його потопити. Для блага нашого народу необхідно встановити обмеження, щоб мінімізувати загрози від підривних пропагандистів на нашій землі. Будь то через друк або ефір, ми активно стежитимемо за новинним циклом, забезпечуючи, щоб наші люди не стикалися з дезінформацією — і будемо придушувати тих, хто нам суперечить."
political_effort_zero_press:0 "Інформаційний Блокада"
political_effort_zero_press_desc:0 "Закутати у кут улюблену тваринку, і вона може вкусити — те саме стосується кожного журналіста з нашим підписом. Більшість обирають цю професію, щоб задовольнити свої ілюзії величі, і їхня голова тільки розростається, коли вони усвідомлюють своє місце в ієрархії. Відтепер ми припинимо роботу всіх ЗМІ та радіостанцій на нашій землі, незалежно від їхньої належності, одночасно здійснюючи суворий контроль над будь-якими чутками. Тримай їх у темряві достатньо довго, і вони зрозуміють, кому повинні дякувати."
political_effort_silence_press:0 "Тиша"
political_effort_silence_press_desc:0 "Коли ті, хто має що сказати, втрачають надію, залишається лише тиша."

