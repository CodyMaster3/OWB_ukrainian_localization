URA_GABBAGHOUL_NAME: "Ґабба-Гуль"
URA_GABBAGHOUL_DESC: "§G«Ні... ні, нііі, йди сюди, Джеральде, так-так, іди сюди, залиш цих гладкошкірих у спокої, повертайся до Небезпек. В-вибачте, люди».§!\n\nКолись громадянин Мус-Джоу, Ґабріель завжди мав слабкість до скажених гулів. Часто відвідував Сайлофілдс і крізь оптику спостерігав за ордою, що мешкала у радіоактивних руїнах — так він очищував свій розум. Одного дня, втративши сім’ю через фанатиків Старого Світу, він вирішив востаннє відвідати ці поля — аби померти від опромінення. Він прийняв Сяйво, згниваючи у благодаті природи, як, на його думку, мало би бути з усім живим — щоби краще могло постати на місці зруйнованого. Зітлів — став гулем. Смерть так і не прийшла. І з часом він побачив у орді нову сім’ю. Вирішив не допустити до них того самого горя, яке знищило його людську родину. Став пастирем. І любив їх усім серцем. Навіть давав імена. Навчав говорити. Своє ім’я він поступово забував. Але вони знали: він — Ґабба.\n\nПротягом багатьох років вони жили в мирі, тримаючись подалі від людей. Та з приходом Церкви він повів орду геть — до Форт-Пека, місця скидання МАНІФЕСТ. Там він показав орду як небезпеку, щоби відгородити її від суспільства й одночасно вберегти навколишні держави. Місцеві почали називати орду й територію «РадіоНебезпекою» через численні знаки радіації, які Ґабба розвішав довкола. Це місце стало як орієнтиром, так і застереженням для мандрівників. У гармонії з радіацією та землею Ґабба прагне вічного миру. Але орда залишається скаженою. А він — лише одна людина..."

URA_CAPOCOOLO_NAME: "Капо-Кола"
URA_CAPOCOLLO_DESC: "Гулі, що вирушили до Форт-Пека слідом за Ґаббою, завжди йшли під проводом одного — Капо-Коли. Саме він вів багатолюдну процесію скажених і зламаних душ до безпеки. Чи здатен він на раціональне мислення? Ззовні сказати важко. Але кожна загублена душа слухала його накази так, ніби він навіть пальцем не ворухнув."

URA_BADGRIEF_NAME: "Бед-Ґріф"
URA_BADGRIEF_DESC: "Бед-Ґріф — поетична душа, що говорить театрально і метафорично. Каже, що є нащадком духів, які прокляли Форт-Пек, і прагне донести своє пишномовне Євангеліє навіть до наївних умів. Частини свого розкладаючогося тіла він замінив на металеві протези, глузуючи зі своїх творців і проголошуючи себе архітектором власної плоті. Бути єдиним лікарем у місті гниючих тіл — важка, але винагородна справа. Адже він може приносити додому сотні органів і кінцівок — коштом лише тієї нещасної душі, у якої він їх поцупив."

URA_WONDERBULL_NAME: "Диво-Бик"
URA_WONDERBULL_DESC: "Чутки про Диво-Бика варіюються від правдоподібних до абсолютно божевільних. Найвідоміша з них — що його колись продали в Опгельм. Цей славний, величний бик був улюбленцем місцевих ще до того, як почав ворожити. Коли на місто впали бомби, Диво-Бик не втік. Він зустрів ядерний вогонь лицем до лиця. І через роки вийшов із вирви — змінившись, заговоривши ритуальними мовами. Чи це правда? Хто ж скаже напевне."