l_english:
nf_des.1.t:0 "Відмова від Уніфікаційного договору"
nf_des.1.d:0 "2271 року НКР та Пустельні Рейнджери об'єдналися в єдину організацію, покликану захищати інтереси народу Пустки.\nПринаймні, так говорили деякі.\n\nАле для Абіґейл Лі це було неприйнятно. Ідея про те, що Рейнджери здадуть свій суверенітет, заплющать очі на невинних лише через їхнє громадянство — її відштовхувала.\n\nЗ часом її переконання лише зміцнювались: рейди Братства по території НКР, набіги рейдерів на околиці, байдужість таких міст як Шейді-Сендс і Нью-Ріно до зла навколо.\n\nВзявши собі ім'я Бунтівної Рейнджерки — та, що кинула виклик Договору — Абіґейл зібрала невелику групу однодумців і вирушила в пустку Есмееральди, аби боротися зі злом так, як їй не дозволяла корумпована держава."
nf_des.1.a:0 "Зло існує, треба лише його знайти."

nf_des.2.t:0 "Заснування аванпосту Меса"
nf_des.2.d:0 "Прямо на кордоні з територією НКР, колишній округ Есмееральда мав стати базою Бунтівної Рейнджерки — аванпостом Меса. Хоч дехто й вважає, що слід боротися з більшим злом на кшталт Легіону, та саме дрібне зло — те, що крадеться в тінях і б'є по беззахисних — і є справжньою загрозою.\n\nОсь чому Абіґейл вирушила до Есмееральди: захищати слабких і боротися з тими, хто на них полює."
nf_des.2.a:0 "Сподіваймось, НКР нас не чіпатиме..."

nf_des.3.t:0 "Дивна трансляція"
nf_des.3.d:0 "Кожного дня, на всіх радіо та телевізорах округу — лише один канал, одне шоу — «Карусель».\n\nДивна передача про життя дивних машинолюдей, які імітують будні людей. Вони були кепськими акторами — часто ламались просто на зйомках і їх замінювали. Та вигляд цих машин викликав у Рейнджерки цікаву думку: яке ж зло могло це створити?"
nf_des.3.a:0 "Зло не знає меж."

nf_des.4.t:0 "Виклик Бунтівній Рейнджерці!"
nf_des.4.d:0 "Верхи на Кадиллаку, з великим револьвером на поясі, в Месу в'їхав незнайомець. Назвався Змієм Варґасом. Він заявив, що представляє тих Рейнджерів, хто вважає, що Абіґейл зайшла надто далеко. Мовляв, вона може навіть спричинити громадянську війну серед Рейнджерів!\n\nВарґас викликав її на класичну перестрілку — як у давнину."
nf_des.4.a:0 "Оце буде шоу..."

nf_des.5.t:0 "Перестрілка"
nf_des.5.d:0 "Абіґейл вийшла з салуна, стиснувши в руці свій пістолет. На старій трасі Меси її чекав Варґас. Обоє вірили, що чинять правильно. Але тільки один піде з цього місця живим. Хто стрілятиме першим?"
nf_des.5.a:0 "Героїня Есмееральди."
nf_des.5.b:0 "Рейнджер з великим револьвером на поясі."

nf_des.6.t:0 "Абіґейл тримається"
nf_des.6.d:0 "Усе скінчилось за мить. Люди зібрались довкола — Абіґейл стріляла першою. Ця перемога, разом з іншими звершеннями в Есмееральді, закріпила за нею образ справжньої героїні!"
nf_des.6.a:0 "Ось і все."

nf_des.7.t:0 "Кінець Абіґейл"
nf_des.7.d:0 "Усе скінчилось за мить. Люди зібрались довкола. На землі лежало тіло відступниці. Вона могла б вижити, та припустилась фатальної помилки — намагалась зрівнятись із тим, хто мав великий револьвер на поясі.\n\nМинуло лише кілька годин, як Варґас уже став новим лідером Бунтівних Рейнджерів. Його ковбойська дипломатія взяла гору. Він повів загін новим шляхом — шляхом переосмислення минулого, боротьби з темрявою, що ховалась просто за стволами їхніх рушниць."
nf_des.7.a:0 "Не перебореш людську природу..."
