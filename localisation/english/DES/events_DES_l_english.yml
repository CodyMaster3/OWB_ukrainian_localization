l_english:
nf_des.1.t:0 "Відмова від Уніфікаційного договору"
nf_des.1.d:0 "2271 року НКР та Пустельні Рейнджери об'єдналися в єдину організацію, покликану захищати інтереси народу Пустки.\nПринаймні, так говорили деякі.\n\nАле для Абіґейл Лі це було неприйнятно. Ідея про те, що Рейнджери здадуть свій суверенітет, заплющать очі на невинних лише через їхнє громадянство – її відштовхувала.\n\nЗ часом її переконання лише зміцнювались: рейди Братства по території НКР, набіги рейдерів на околиці, байдужість таких міст як Шейді-Сендс і Нью-Ріно до зла навколо.\n\nВзявши собі ім'я Бунтівної Рейнджерки – та, що кинула виклик Договору – Абіґейл зібрала невелику групу однодумців і вирушила в пустку Есмеральди, аби боротися зі злом так, як їй не дозволяла корумпована держава."
nf_des.1.a:0 "Зло існує, треба лише його знайти."

nf_des.2.t:0 "Заснування аванпосту Дайер"
nf_des.2.d:0 "Прямо на кордоні з територією НКР, колишній округ Есмеральда мав стати базою Бунтівної Рейнджерки – аванпостом Дайер. Хоч дехто й вважає, що слід боротися з більшим злом на кшталт Легіону, та саме дрібне зло – те, що крадеться в тінях і б'є по беззахисних – і є справжньою загрозою.\n\nОсь чому Абіґейл вирушила до Есмеральди: захищати слабких і боротися з тими, хто на них полює."
nf_des.2.a:0 "Сподіваймось, НКР нас не чіпатиме..."

nf_des.3.t:0 "Дивна трансляція"
nf_des.3.d:0 "Кожного дня, на всіх радіо та телевізорах округу – лише один канал, одне шоу – «Карусель».\n\nДивна передача про життя дивних машинолюдей, які імітують будні людей. Вони були кепськими акторами – часто ламались просто на зйомках і їх замінювали. Та вигляд цих машин викликав у Рейнджерки цікаву думку: яке ж зло могло це створити?"
nf_des.3.a:0 "Зло не знає меж."

  nf_des.4.t:0 "Права рука диявола"
 nf_des.4.d:0 "Був ранній ранок, коли Рейнджерка-відступниця вийшла із салуну. Її суперник? *Той самий* Аризонський рейнджер, «Змій» Варгас. Він прибув разом з усіма, хто його підтримував, під час одного зі зборів рейнджерів. Варгас знав, що це найкращий спосіб переконатися, що всі побачать, що станеться того дня.\n\nВін оголосив свої вимоги кожному присутньому рейнджеру; Ебігейл була занадто зранена, щоб бачити речі чітко. Вона має відступитися заради майбутнього рейнджерів і Пустки. Якщо вони продовжать цей шлях, на всіх на заході чекають лише руйнування та хаос. Відкидаючи договір, вона почне громадянську війну серед рейнджерів і завадить їм об'єднатися проти справжнього ворога: Легіону Цезаря.\n\nРейнджерка-відступниця майже не захищається. Вона нагадує Варгасу, що тільки Пустельні рейнджери здатні принести «справжнє» правосуддя та свободу в ці землі. Цими цінностями просто не можна поступатися чи відкладати їх на потім. Він не при собі, йому слід припинити це і забути, що все це взагалі відбувалося.\n\nОбидва просять іншого відступити, але ніхто цього не робить.\n\nУсе закінчилося в одну мить. У тихій ранковій заграві одночасно пролунали два постріли, і одне тіло впало замертво. Це було кульмінацією саме того, чого так боявся Варгас: рейнджер воює проти рейнджера. Обидва робили те, що вважали за праве, але зрештою лише один із них мав достатньо сили волі, щоб зробити те, що мусив. Зрештою, це був..."
 nf_des.4.a:0 "Героїня Есмеральди."
 nf_des.4.b:0 "Змій з Аризони."

 nf_des.5.t:0 "Перестрілка на випередження"
 nf_des.5.d:0 "Ебігейл відчуває, як її ліве плече сіпається назад, коли вона стріляє з пістолета. Її рейнджерська броня перетворює удар, який мав би бути майже смертельним, критичним, на звичайний синець, що заживатиме ще довго. Дим із дула її револьвера — це все, що вона бачить, намагаючись утримати руку рівно. Трамтячою рукою вона опускає пістолет і дивиться на тіло, що впало горілиць. Капелюх Варгаса впав йому на обличчя, але Ебігейл усе одно бачить калюжу крові, що розростається під ним. Ліва рука кричить від болю, але вона все ще відчуває, що та рухається.\n\nВона суне вперед наче в трансі, її погляд прикутий до нерухомого трупа єдиного героя, якого она коли-небудь знала. Це ж не може бути кінець, правда? Він прикидається, або просто важко поранений! Вона майже кричить, гукаючи медика, щоб той оглянув його, але в глибині душі її здоровий глузд уже знає правду, яку вона відмовляється бачити. Незабаром вона вже стоїть над його тілом, бачачи власне викривлене відображення в його крові. Ебігейл відчуває, як револьвер вислизає з її руки, і швидко відвертається.\n\nВона дивиться на Рейзора і Трешера. Вони не рухаються при виді смерті свого найдавнішого друга, але вони вже й не дивляться на неї так, як раніше. Ебігейл переводить погляд на Гольштадта, Андерсона, всіх інших рейнджерів, і бачить, як вони, здається, запеклися після її вчинку. Вона знову дивиться вниз на Варгаса і на себе в його крові.\n\n«Прокляття...» — бурмоче вона. Вона не впевнена, чи це адреналін від болю, чи щось інше, але вона відчуває, як її горло стискається, а все тіло неначе здавлює невідомий тиск. Вона з трудом дихає, а її руки знову починають тремтіти."
 nf_des.5.a:0 "..."

 nf_des.6.t:0 "Фатальний промах"
 nf_des.6.d:0 "Рейнджер Ернан «Змій» Варгас діставав свій револьвер понад тисячу разів. Він, мабуть, належав до найстаршого покоління Пустельних рейнджерів, які все ще топтали ряст — якщо не рахувати гулів, звісно. Він робив це невимушено й миттєво. За секунду його револьвер уже був поза кобурою і націлений на суперницю, що стояла перед ним. Усе відбувається спалахом, і Варгас відчуває, як його плоть розривається на стегні в ту ж секунду, коли він тисне на гачок. Він задкує, але попри те, що його тіло хитається, намагаючись утримати рівновагу, він бачить, як шматок візора Рейнджерки-відступниці відлітає в повітря. Осколки скла падають на землю, і Варгас перехоплює погляд Ебігейл, яка хитається, намагаючись устояти.\n\nЗа розбитим склом немає нічого, окрім крові — револьвер Варгаса пробив її шолом, залишивши нову дірку на місці лівого ока. Те, що для них обох здається хвилиною, для решти рейнджерів триває всього чотири секунди. Вільна рука Змія хапається за поранене стегно, і крізь біль він усвідомлює, як важко відчути праву ногу. Він щосили затискає рану, але відчуває, що навіть стимулятор уже не поставить його старе тіло на ноги як слід.\n\nЕбігейл Лі, велика Рейнджерка-відступниця, падає вперед, щоб більше ніколи не підвестися. Варгас шкутильгає вперед, як тільки може. Він відчуває, як до сухого горла підступає кров, але пильнує інших бунтівних рейнджерів, що стоять осторонь. Нехай він і поранений, він не проти знову вихопити свою зброю. Більшість із них могли лише сподіватися стати бодай наполовину такою рейнджеркою, якою була Ебігейл, думає він.\n\nТіло Ебігейл лежить долілиць, обличчям у багнюці. Невелика калюжа крові розтікається з місця, куди поцілив Варгас. Він не видає своїх емоцій нічим на обличчі й звертається безпосередньо до зібраних рейнджерів..."
 nf_des.6.a:0 "..."

 nf_des.7.t:0 "Змарнована любов"
 nf_des.7.d:0 "«ПРОКЛЯТТЯ!» — повторює вона, схиляючись над тілом Варгаса, відчуваючи, як гнів сковує її наче лід. — «Чому?! Чому ти мусив це зробити?!» — кричить вона на нього, ніби він узагалі міг відповісти. Вона тремтить, майже згинаючись над ним навпіл. Її чоботи потопають у його ж крові, поки вона з кожним подихом намагається ковтнути повітря.\n\n«Наступного разу не хапайся за зброю, тупий ти ВИШКЕРТКУ!» — хрипко кричить вона на нього. Він потягнувся першим. Саме це вона повторює собі. Він помер, бо сам усе почав. Вона не хотіла вбивати його, він просто...\n\nУсі інші спостерігають. Вони не підходять до неї, не втішають її, а просто дивляться збоку, як вона височіє над тілом найвидатнішого рейнджера, якого коли-небудь знала Аризона. Після кожного тремтливого подиху вона відчуває, як її гнів на Варгаса згасає так само швидко, як і з'явився. Це не її провина, але й не його. Натомість вона звертає свій погляд на захід.\n\nКаліфорнія. Це завжди була Нова Каліфорнія. Спочатку вони залишають рейнджерів напризволяще, а тепер посилають їхнього найбільшого героя виконувати брудну роботу? Змусити їх підкоритися? Це Шейді Сендс послали колишнього генерала рейнджерів, і це вони залишили його помирати, як роблять це завжди.\nВона випрямляється, стаючи настільки гордо, наскільки це можливо. Вона знову дивиться на рейнджерів. Ніхто з них не наважується кинути їй виклик, і всі бачать, що вона здатна зробити те, що має бути зроблено.\n\n«Робота рейнджера ніколи не закінчується», — каже їм усім Ебігейл, і їй коштує неймовірних зусиль утримати голос рівним. — «Ми поховаємо його з почестями за межами Даєра. А потім повернемося до роботи»."
 nf_des.7.a:0 "Тепер вогонь у її серці може просто палати, палати, палати..."

 nf_des.8.t:0 "Одного дня до міста прибув знайомий незнайомець..."
 nf_des.8.d:0 "Ебігейл Лі не бачила Варгаса з того часу, як він припустився помилки, підписавши Договір про об'єднання 2271 року, прийнявши немислиме рішення віддати незалежність Пустельних рейнджерів заради підтримки корумпованої нації. Але тепер він знову стояв перед нею на дорозі до Даєра.\n\n«Ебігейл», — холодно привітався він. Рейнджери Трешер і Геллрейзор стояли поруч із ним, але Ебігейл майже одразу помітила, що Анджела Дет не супроводжує героїв загону Альфа. Руки Варгаса спокійно висіли вздовж тіла, але Ебігейл помітила, як одна з них зависла над кобурою, коли вона ступила назустріч.\n\n«Що, по-твоєму, ти робиш?» — запитав Варгас із суворим виразом обличчя, прихованим за окулярами.\n«Я лише допомагаю простим людям Пустки», — наполягала Ебігейл. «І покладу край договору про об'єднання», — ось що Ебігейл хотіла б сказати, але залишає це невисловленим. Обидва чудово розуміли, чого хоче інший. Перед тим, як розійтися, вони навряд чи обмінялися ласкавими словами.\nЯкийсь час вони обоє мовчки стояли біля аванпосту Даєр. Обом було б так просто застрелити іншого тут і зараз. Але щось у їхніх серцях зупинило їх.\n\n«Есмеральда кишить рейдерами, технофашистськими сектантами та жорстокими дикунами», — натомість сказала Ебігейл. — «Якщо ми нічого не зробимо, вони завдадуть Пустці більше шкоди, ніж я коли-небудь змогла б».\n\nЗмій супиться — принаймні в цьому вона права. Принаймні Ебігейл *намагатиметься* робити добро.\n«Мені начхати на договір. Мені начхати на все, поки з усіма *ними* не буде покінчено назавжди», — каже Ебігейл, і вона сама не впевнена, напівправда це чи брехня. — «Приєднуйся до нас. Ми зупинимо цих виродків разом»."
 nf_des.8.a:0 "Ебігейл простягає руку, і Варгас міцно тисне її."

 nf_des.9.t:0 "Те саме старе відчуття"
 nf_des.9.d:0 "«Уся їхня операція тримається на чесному слові, якщо ми прорвемося крізь слабші, погано оснащені підрозділи, наші рейнджери зможуть заскочити їхню бронетехніку зненацька», — заявляє рейнджер Варгас. Хоча Ебігейл офіційно не повернула йому колишню посаду «Генерала рейнджерів», він усе одно знайшов свій шлях до командування. Це було неминуче. Хто б відмовив «Змію» Варгасу?\n\n«Або ми можемо просто проігнорувати все це і захопити чи розігнати все їхнє керівництво, влаштувавши облогу Цитаделі Охоронців», — втручається Ебігейл. Вона рідко дає тактичні поради під час військових нарад. Зазвичай вона дозволяє фанатам планування робити свою справу, а наприкінці ставить запитання. Ці запитання зазвичай зводяться до: «Куди стріляти?». Відтоді як прибув Варгас, вона стала набагато балакучішою.\n\n«І що станеться, коли їхня силова броня затисне тебе з тилу, відрізавши від наших ліній?» — заперечує Варгас.\n«Не затисне», — впевнено парирує Лі.\n«Як ти можеш бути впевнена?»\n«А як ти можеш бути впевнений, що у них просто у *всіх* немає силової броні, га?»\n\nРейнджер Андерсон і все командування рейнджерів майже одразу відчувають, як тема розмови котиться вбік, і незабаром вони обоє сперечаються вже не як ветерани-рейнджери, а як діти. Що взагалі вважається силовою бронею? Чому це взагалі має значення? Звинувачують одне одного в меншій ефективності, звинувачують у тому, що інший не створений для цього. «Чому б тобі не піти додому, діду?» — питає Ебігейл.\n\nАле ніхто їх не зупиняє. Бо вперше за довгий час у голосі Ебігейл чути посмішку, а «Змій» Варгас насправді сміється. Це було схоже на перебування в Цитаделі Аризони, знову й знову. Ніхто з них не віддав би цього ні за що на світі."
 nf_des.9.a:0 "З поверненням, рейнджери."

 nf_des.10.t:0 "Якби я тільки міг переконати тебе..."
 nf_des.10.d:0 "«Чи не могла б ти принаймні передумати?» — благає Варгас. Вони вдвох臨時_сидять на пагорбі з видом на Даєр.\nЕбігейл повертається, щоб подивитися на нього, дозволяючи холодній порожній масці рейнджера та мовчазному вітру відповісти за неї. Останнім часом вони чудово ладнали, спільно керуючи Рейнджерами-відступниками. Їй дивно думати про це після років розлуки та того, що вона вважала образою.\n\nВони годинами згадували історії про те, чим займалися відтоді, як більшість із них розійлися, і продовжили спілкування так, ніби цього розриву ніколи й не було. Але коли заходить мова про договір про об'єднання, будь-які розмови вщухають.\nВона зітхає. Протягом останніх кількох днів вона переводила тему, але не може уникати цього вічно.\n\nЯкби це був хтось інший, вона б уже послала його під три чорти. Але важко бути такою жорстокою зі старим. Спочатку вона почувалася зрадженою ним більше, ніж будь-ким іншим. Зрештою, це він підписав договір. Але тепер, коли минув час, і після всієї роботи, яку вони знову проробили разом... вона рада, що він знову на її боці. Вона відчуває, що може пробачити його. Але не Каліфорнію, ніколи не Каліфорнію.\n\n«Коли ми кричали про допомогу, вони нічого не зробили. Коли ми благали про підкріплення, про допомогу та припаси, вони нічого не зробили. Коли ми вмирали просто по той бік їхньої річки, вони нічого не зробили...» — каже Ебігейл, дивлячись на Варгаса, її голос тремтить, а руки трусяться. — «Тепер, коли нас не стало, вони хочуть Аризону. За що ми вмирали?»\n\nВаргас нічого не каже.\n«Ні за що», — тихо бурмоче Ебігейл. — «Зовсім ні за що».\n\nЯк вона могла передумати — пробачити, забути? Як вона могла відпустити все це і дозволити їм просто спостерігати порожнім поглядом за тим, як вона стікає кров'ю?"
 nf_des.10.a:0 "Варгасу залишається лише сумно посміхнутися на все це."

 nf_des.11.t:0 "Я бачу ваші сильні сторони"
 nf_des.11.d:0 "Тільки Легіон міг перемогти Пустельних рейнджерів так, як вони це зробили. Попри всі свої недоліки, попри всі недосконалості та непослідовність у діях Пустельних рейнджерів, вони були потужною силою в Пустці. Звичайний тиран чи банда відчували, як земля дрижить під ними, коли до їхніх дверей прибував хоча б загін рейнджерів. Кожен із них був самодостатнім, навченим використовувати свої сильні сторони та рухомим праведною метою знищувати зло, куди б вони не йшли.\n\nКоли Варгас іде через Даєр, знову мобілізований через перспективу наступу на південь, він бачить не Пустельних рейнджерів — він бачить дещо нове. Організовані, вони активно набирають людей, озброюються, і під керівництвом тих, кого Варгас вважав би найкращими військовими умами в Пустці, вони могли б валити гігантів.\n\nЗвісно, зараз вони роблять добро. Але банда бунтівників Ебігейл має силу, здатну знищити НКР, або, що ще гірше, знищити самих себе й забрати із собою невинних людей як Невади, так і Каліфорнії. Зведення рахунків із НКР зараз призведе лише до загибелі, коли Легіон скористається можливістю втрутитися. Не кажучи вже про жах, яким став би бій рейнджера проти рейнджера...\n\nВаргас хмуриться, бачачи, як Ебігейл стоїть на ящику, направляючи рейнджерів до наступної цілі. Гордий диригент, що веде рейнджерів співати пісню руйнування..."
 nf_des.11.a:0 "Він не хоче цього робити, але який у нього вибір?"

 nf_des.12.t:0 "Зчитування сигналів"
 nf_des.12.d:0 "«Коли ми закріпимося в Есмеральді, що далі?» — запитує Варгас на околиці Сільвер-Пік. Це місце найдалі від будь-яких телевізійних чи радіосигналів, але найближче до їхньої наступної цілі. Ті реклами «Каруселі» вже дістали.\n\nЕбігейл удає, ніби замислилася над цим, хоча насправді думала про свої подальші кроки кожну вільну хвилину свого життя.\n«Ну, далі ми маємо придушити Шакалів, Гадюк та Якудзу. Вони занадто довго були загрозою», — каже Ебігейл, і Варгас підтакує. — «Потім ми вирушимо до Нью-Ріно...»\n«До Нью-Ріно? Навіщо?» — перебиває Варгас.\n\n«Будь ласка. Нація, якою керують гангстери, наркоторговці та головорізи? Ти знаєш, як вони поводяться зі своїми жінками та наркоманами?» — відповідає Ебігейл досить швидко, показуючи, що вона вже чекала на це запитання.\nВаргас більше нічого не говорить про Ріно. Ебігейл має рацію, але чи єдиним правильним рішенням є жорстокий напад? Скільки невинних загине в цьому хрестовому поході? З іншого боку, яке було його рішення? Ігнорувати це й сподіватися, що вони самі все виправлять?\n\n«А потім що?» — запитує Варгас, дивлячись прямо на Ебігейл. Вона відвертається від нього, дивлячись у бік ТБ-Тауна.\n«Ти знаєш що», — просто відповідає вона, і її голос стає холодним. Це загадково, але Варгас чудово її розуміє.\n\nВін був такий... *щасливий* знову бачити, як усі рейнджери підтримують його пліч-о-пліч. Він справді сумував за спільною роботою з Ебігейл. Але Ебігейл хоче спалити себе разом із прапором НКР, і вона готова забрати із собою весь клятий світ, якщо доведеться.\n\nВін не може дозволити їй зробити це з невинними людьми Пустки. Він не може дозволити їй зробити це зі світом — не може дозволити їй зробити це з самою собою."
 nf_des.12.a:0 "Будь-яке гарне шоу рано чи пізно закінчується."

 nf_des.13.t:0 "Чимсь доведеться поступитися"
 nf_des.13.d:0 "«Ти ж серйозно щодо цього, правда?» — запитує Варгас Ебігейл, коли вони обоє стоять над приблизною картою Каліфорнії та Невади, де позначено кожну банду й поселення, які їм вдалося розвідати.\n\n«Щодо того, щоб зупинити цих дикунів і не дати їм більше кривдити людей? Так», — відповідає Ебігейл, схрестивши руки й упершись поглядом у карту. Останнім часом Варгас стає дедалі наполегливішим, і вона сподівається, що одного дня він просто облишить це й погодиться з тим, що буде краще. Або, принаймні, просто перестане змушувати її говорити про це більше, ніж потрібно.\n\n«Я маю на увазі знищення Нової Каліфорнійської Республіки», — каже Варгас, зачіпаючи тему, яка кружляла між ними, наче мутована мошка. Ебігейл різко піднімає голову, щоб подивитися на нього. Маска рейнджера не дозволяє йому побачити вираз її обличчя, залишаючи холодний і твердий металевий візор єдиним, на що він може дивитися.\n«Серйозно», — просто отвечает Ебігейл.\n\n«Не роби цього», — благає Варгас, зустрівшись із нею поглядом. Ебігейл розпускає руки й нахиляється через стіл до нього.\n«Або що?» — парирує вона, дивлячись йому прямо в очі. — «Виконаєш наказ їхнього президента вбити мене?»\n\nВаргас нічого не каже.\n«Натомість ти міг би допомогти мені — допомогти нам побудувати щось нове», — м'яко пропонує Ебігейл. — «Я... я не якесь чудовисько». Вона й сама не впевнена, кого намагалася переконати в кінці — його чи себе.\n\nВін стискає губи. Його мовчання — це все, що потрібно Ебігейл для відповіді. Вона відкидається назад від столу. Більше нічого сказати. Вони міряють одне одного поглядами, і Варгас тихо йде під пильним поглядом Ебігейл.\nКоли вони розходилися, руки обох були біля кобур."
 nf_des.13.a:0 "І серця обох стиснулися від болю."

 nf_des.14.t:0 "Почуй шепіт на його устах"
 nf_des.14.d:0 "Стоячи над тілом Ебігейл, рейнджер Варгас чітко дає зрозуміти Рейнджерам-відступникам: минуле позаду. Пустка більше не є якимось вільним і відкритим місцем. Люди рухаються далі, будують і захищають *себе самі*. Вони мали чітко побачити це ще тоді, коли Легіон перекинув їх через річку в 2271 році. Якщо рейнджери хочуть залишатися затребуваними в цю нову епоху, вони мають прийняти зміни та прийняти новий світ, який допомагає створювати Нова Каліфорнійська Республіка.\n\nВони не ідеальні, ні. Але на всьому заході немає іншого місця, окрім них, де було б створено бодай щось схоже на те, що можна назвати «мирним, нормальним життям». Світ, за який боролися Пустельні рейнджери, вже був тут, в НКР. Попри всі недоліки, Варгас благав їх прийняти його. Інакше вони ризикують просто згоріти й залишитися на узбіччі світу.\n\nЦі слова знаходять відгук у деяких, але на інших справляють менше враження. Незважаючи на це, саме Варгас сьогодні вийшов переможцем, і якщо хтось і мав якісь сумніви чи нелояльність, вони б не наважилися висловити це вголос перед кимось настільки небезпечним і вправним, як він. Вони розходяться, залишаючи Варгаса наодинці. Ніхто, навіть його власні прихильники, не наважується подивитися йому в очі.\n\nВаргас зітхає й дивиться вниз на понівечене тіло Рейнджерки-відступниці. Чому вона мусила битися? Чому вона вихопила пістолет замість того, щоб просто відступити? Чому вона не могла просто відпустити все це? Якби він тільки міг її переконати. Якби вона тільки не лютувала проти світу, поки той безжально не розчавив її.\n\nНа цю мить Змій навіть радий, що ніхто не може подивитися йому в очі."
 nf_des.14.a:0 "Їм не доветеся бачити, як старий витирає сльози."

  nf_des.15.t:0 "Тінь пало-верде"
 nf_des.15.d:0 "Життя Ебігейл кардинально змінилося відтоді, як вона приєдналася до Пустельних рейнджерів в Аризоні багато років тому. Люди змінюються, людей не стає, нації виникають і гинуть, домівки переносяться, а цінності зміщуються. Ніщо не вічне. Тому вона була здивована, коли побачила дерево пало-верде з Аризони, що росло в Неваді, ніби в її житті все було гаразд. Це не мало б її дивувати, але вона все одно була шокована, коли побачила, що часточка її першої домівки рушила за нею до нової.\n\nТам, неподалік від Даєра, росте одне пало-верде. Воно самотньо височіє, дивлячись на аванпост, і це єдине місце, куди Ебігейл тікає, коли почувається самотньо.\n«Привіт знову», — каже вона дереву, не сподіваючись на відповідь. «Я... я знаю, що минуло багато часу, але...»\n\nЕбігейл дивиться собі під ноги, думаючи про дуель, про те, як вона холоднокровно вбила власного героя, щоб продовжити свій хрестовий похід праведної помсти проти Пустки. Вона думає про все, що сказала Варгасу — і хороше, і погане. Вона усвідомлює, що він — ще одна людина в її житті, з якою вона так і не встигла попрощатися.\n«Я роблю все, що можу. Цього достатньо, правда?» — запитує вона у пало-верде. Воно не відповідає.\n\n«Цей світ... Усе, що він робить — це лише відбирає у мене все. Усе, що він робить — це вбиває те, що я люблю, і ігнорує мої благання...» — каже Ебігейл, і її голос зривається. У грудях здавлює. «Я просто хочу, щоб це припинилося. Я просто хочу, щоб вони перестали кривдити людей».\nВона знову дивиться на пало-верде. Воно мовчить, як і завжди. Його яскраве лимонно-зелене листя гойдається на вітрі, але в усьому іншому воно залишається тихим і нерухомим. Ебігейл зітхає. Що вона робить, розмовляючи з деревом? Можливо, плакати НКР кажуть правду: можливо, вона справді з'їхала з глузду.\n\n«Вибач. Я... я знаю, що мені слід перестати говорити з тобою», — перепрошує Ебігейл, обхопивши себе руками й дивлячись у небо, де крізь сутінки вже проступають місяць і перші зірки.\n« Я просто сумую за тобою», — каже вона. — «Тебе немає, Варгаса немає... Я... я...» — Ебігейл зітхає й сідає, притулившись до стовбура пало-верде. Сонце починає заходити, і вона відчуває, що ось-ось розплачеться, але сльози просто не йдуть."
 nf_des.15.a:0 "Якби ж ти тільки була тут, Кейлін."

 nf_des.16.t:0 "Коли все було гаразд"
 nf_des.16.d:0 "«Не забігай занадто наперед, мала».\nЕбігейл Лі відірвала погляд від своєї пляшки й побачила перед собою *того самого* рейнджера Варгаса. Майже миттєво їй захотілося закричати від захвату просто від того, що він звернув на неї увагу. Звісно, він доклав руку до її навчання, як і до кожного іншого Пустельного рейнджера, але це було справжнє визнання! Вона майже підхопилася зі свого місця, якби не той факт, що її напарниця відключилася прямо на плечі Ебігейл.\n\nРейнджери влаштували чергове святкування. Вони щойно успішно поклали край організованій злочинності в усьому Фініксі, здійснивши кілька останніх рейдів на фінальні сховища банд.\n«Я... я й не думала про це», — зніяковіло пробурмотіла Ебігейл, — «Я була всього лише бійцем в одному з рейдів, нічого особливого я не зробила».\n\nВаргас усміхнувся їй, поки навколо лунали пісні та вигуки святкуючих рейнджерів.\nЗмій підсунув стілець, щоб сісти навпроти неї, хоча сів незвично — розвернувши стілець спинкою вперед і спираючись на неї грудьми.\n\n«Ну, але й прибіднятися теж не варто», — м'яко сказав он. — «Не думаю, що ми перемогли б так швидко без тебе».\n«Ви справді так вважаєте?» — видихнула Ебігейл, не в силах приховати посмішку від його похвали.\n«Звісно», — відповів Варгас із теплою посмішкою та тихим сміхом. Він зняв окуляри й подивився їй прямо в очі. Їй здалося, що таким поглядом він здатний бачити крізь сталь.\n\n«Ти чимось нагадуєш мені мене самого в мої зелені роки, за часів загону Альфа. Продовжуй у тому ж дусі, і хто знає?» — Ебігейл аж сяяла від такого порівняння. Варгас підняв свій келих, а Ебігейл підняла свою теплу ядер-колу кімнатної температури.\n«Можливо, одного дня ти й сама носитимеш чорну броню».\n...\n\nЩо б Ебігейл не робила, вона ніколи не зможе повернутися в ті часи. Хоч би як сильно вона цього хотіла. Хоч би як щаслива вона тоді була."
 nf_des.16.a:0 "Якби ж тільки знати, що ти переживаєш хороші часи, до того, як вони залишаться позаду."

 nf_des.17.t:0 "Жадібність"
 nf_des.17.d:0 "Чесно кажучи, Аарон Кімбол — чудовий президент для НКР. Навряд чи знайдеться краще втілення того, чим стала НКР і що вона відстоювала останнім часом, ніж він.\n\nКолишній генерал армії, що складається з дурнів іпішаків, який покладається на вчинки людей, котрі перевершують його за всіма якостями, тепер став головною свинею в гегемонії, яка засуджує власне минуле, водночас стрімголов кидаючись у кожну помилку, що була зроблена до них. З кожним новим «законом», який він ухвалює, він перетворює те, що могло б стати прекрасною каліфорнійською мрією, на збіговисько корпоративних грабіжників в опудалі двоголового ведмедя.\n\nЗа його адміністрації НКР розгадала загадку, як можна одночасно бідкатися про недоторканність кордонів і водночас перетинати їх усі, загарбуючи будь-яку землю, яку тільки бачать очима. Він перетворює ідею «суверенітету» на жарт, маніпулюючи та вдираючись у кожне поселення та «націю», які насмілюються розвиватися поблизу них.\n\nУ цій республіці сформувався паразитичний правлячий клас, який тільки те й робить, що бере, бере і бере, і це повністю його провина, адже він дозволив їм стати такими могутніми й почуватися в такій безпеці. Коли Пустельні рейнджери благали про допомогу в Аризоні, вони залишили нас гнити й помирати, щоб потім забрати все, що залишилося."
 nf_des.17.a:0 "Я хочу, щоб вони відчули те саме, що й я, щоб їм було так само боляче."

 nf_des.18.t:0 "Апатія"
 nf_des.18.d:0 "Оллґуд Мерфі — хороша людина. Заперечувати це означало б піддати саме визначення хорошої людини серйозному сумніву. Він закликає до миру, до здоров'я та безпеки свого народу, він поважає суверенітет інших народів і водночас робить усе можливе, щоб допомогти Каліфорнійським рейнджерам (і нашим власним Пустельним рейнджерам, які приєдналися до них за договором) у їхньому прагненні знищити рабство та несправедливість усюди.\n\nТоді в чому ж проблема?\n\nПроблема у світі навколо нього. Не треба плекати ілюзій — народ і правлячі класи НКР повірили в Оллґуда Мерфі не через те, що він відстоював, не через надію та доброту, яку він хотів показати світові, а через те, що вони могли з цього отримати. Жодних більше загарбницьких воєн будь-якого штибу, щоб інші могли вести битви замість Каліфорнії. Більша ставка на добровольчі загони рейнджерів, щоб олігархи та барони республіки могли тримати своїх дітей удома, поки бідняки помирають. Так, в НКР рівень життя підвищиться, але більше ні в кого.\n\nМайже напевно це не те, чого прагне Оллґуд, але республіка — це не одна людина, це зусилля багатьох. Просто так склалося, що зараз республіка докладає багато зусиль для того, щоб не докладати жодних зусиль узагалі. Якби Пустельні рейнджери сьогодні попросили допомоги для боротьби з Легіоном, усе, що ми отримали б — це жменю кришок, двадцять відважних добровольців і тисячі порожніх апатичних поглядів."
 nf_des.18.a:0 "Можливо, у кращотому світі ми могли б спробувати знову разом."

 nf_des.19.t:0 "Гординя"
 nf_des.19.d:0 "В Аризоні, коли ти питаєш про Америку, що чуєш у відповідь? Центуріон насміхається, легіонер закочує очі, а раб плаче: «Який сенс узагалі питати?» перед тим, як його шмагають батогом. Як давно нація під назвою «Америка» правила цими землями? Якими вони були до того? Чи були вони доброю, щедрою, терплячою нацією? Чи вони були егоїстичними, параноїдальними, нарцисичними вбивцями, які думали лише про те, що лежить прямо перед їхнім носом?\n\nПрезидент Гейз оспівує те, якою великою була Америка, як чудово було мати гарантовану їжу та чисту воду, мати будь-яку зручність під рукою і знати, що тебе не застрелять, коли ти виходиш із дому. Чи справді це була Америка, чи просто міраж, створений рекламою та мерцями?\n\nЯкщо раніше НКР стрімголов летіла назустріч повторенню помилок Америки, то тепер вона радісно хвалиться тим, що збирається зробити це знову. Вони радісно кричать, що це не було помилкою, поки заштовхують дуло пістолета собі в піднебіння, і таврують вас дурнем за думку, ніби вони роблять щось не так. Стільки людей помре за цей образ Америки, і заради чого?\n\nАмерика здається такою прекрасною лише тому, що її більше немає, і вона зникла не просто так."
 nf_des.19.a:0 "Зупинити *це*..? Це милосердя."

 nf_des.20.t:0 "Це ніколи не припиниться, і це нормально?"
 nf_des.20.d:0 "Ебігейл була рада повернути Цитадель рейнджерів, точніше, *нову* Цитадель рейнджерів. Це не Цитадель Аризони, але вона нічим не гірша. Перебудована зі старої Цитаделі Вартових, Цитадель Рейнджерів Пустки стала чимось знайомим, але водночас новим. Час іде, рейнджери продовжують перемагати, тож вогонь у серці Рейнджерки-відступниці вже мав би згаснути... Чи ні?\n\nУ самому центрі комплексу Цитаделі рейнджерів стоїть могила. Вона увінчана квітами, підношеннями та зірками, і вона височіє над кожним, хто приходить сюди.\n«ТУТ СПОЧИВАЄ: ГЕНЕРАЛ РЕЙНДЖЕРІВ ЕРНАН „ЗМІЙ“ ВАРГАС. НАЙВИДАТНІШИЙ ПУСТЕЛЬНИЙ РЕЙНДЖЕР, ЯКИЙ КОЛИ-НЕБУДЬ ЖИВ».\n\nЕбігейл перенесла його тіло невдовзі після заснування Цитаделі, не бажаючи, щоб нове покоління рейнджерів забуло того, хто виховав покоління до них. Проводячи дедалі більше часу в Цитаделі, вона помічає, що все частіше приходить саме сюди. Іноді їй здається, що вона стоїть тут годинами.\n\nНаступним буде Легіон, і якщо до НКР вона відчувала огиду, то забракне слів, щоб описати, скільки ненависті вона плекає до Легіону та негідників, які очолюють їхню промиту армію. Але вона знає, що ніколи не відчує себе цілісною, ніколи не знайде спокою у своєму серці. Світ тисне на її плечі, і їй завжди здаватиметься, що вона мусить чинити опір. Захоплення Шейді-Сендс нічого не змінило. Вона все ще почувається порожньою оболонкою, а світ навколо досі здається сірим і безбарвним.\n\nАле почуття Ебігейл Лі ніколи не мали значення. Не порівняно з життями невинних. Вона несе цей тягар, щоб нікому іншому не довелося..."
 nf_des.20.a:0 "«Усе гаразд», — каже вона собі. Навіть коли все одно боляче."

 nf_des.21.t:0 "Гірко-солодка пісня"
 nf_des.21.d:0 "У самому центрі Флагстаффа рейнджери склали в купу прапори легіону, уніформу, рабське ганчір'я та будь-які письмові укази Цезаря чи вчення його «Культу Марса». Купу облили бензином і підпалили з рейнджерського дробовика набоєм «дихання дракона» під гучні аплодисменти та вигуки радості.\n\nРейнджерка-відступниця спостерігає за багаттям, що яскраво палає в нічній темряві, не звертаючи уваги на решту світу. Нарешті все скінчено. Вона відомстила за кожного рейнджера, втраченого через Легіон, і тепер ні «ведмідь», ні «бик» не зможуть завдати їм шкоди. Але попри все це, вона відчуває, що всередині неї нічого не змінилося. Оточена вірними їй рейнджерами, серед палаючих руїн імперій, які вона повалила своєю праведною люттю, Ебігейл Лі все одно почувається замерзлою та самотньою.\n\nЯкби вона могла почати все спочатку, вона б зробила це знову. Світ, який вона створить — це світ вільний і праведний. Але якби вона могла повернутися в минуле..? Вона б хотіла, щоб їй ніколи не доводилося робити нічого з цього. Якби вона тільки народилася у світі, де ці рішення ніколи не тиснули б на неї. Якби вона просто жила в м'якому, доброму, *хорошому* світі.\n\nРейнджерка-відступниця лізе в кишеню й обережно виймає фотографію, зроблену біля Цитаделі рейнджерів в Аризоні. Тоді вони ще були Пустельними рейнджерами, а не Рейнджерами Пустки. Вони посміхаються, корчать дурні пози. Кілька рейнджерів, включно з Ебігейл, жартівливо наставили зброю на генерала Варгаса, який спокійно посміхається у відповідь. Дивлячись на це фото, вона усвідомлює, як багатьох із цих людей, що дивляться на неї, вже немає поруч, і як багато з них ніколи не повернуться. І просто на неї дивиться герой, якого вона вбила, герой, який...\n\nВона кидає фотографію у вогонь, не в силах витерпіти цей біль. І вперше за багато років..."
 nf_des.21.a:0 "Ебігейл Лі починає плакати."

 nf_des.22.t:0 "Рейнджери, знову об'єднані"
 nf_des.22.d:0 "За забезпечення безпеки в Есмеральді та зобов'язання захищати й допомагати Новій Каліфорнійській Республіці, Пустельні рейнджери були реорганізовані в автономну організацію в межах кордонів НКР. Очікувалося, що Пустельні рейнджери захищатимуть землі, які перебувають під їхньою безпосередньою юрисдикцією, і діятимуть як невіддільна частина збройних сил НКР. Вони отримали автономію, але Шейді-Сендс і каліфорнійські командири зрештою завжди матимуть останнє слово.\n\nПустельні рейнджери мали дотримуватися стандартів і законів Нової Каліфорнійської Республіки, але їм надавалося трохи більше свободи в тому, «як» саме вони чинять правосуддя на Пустці.\n\nЗемлі під контролем Пустельних рейнджерів мали бути інтегровані в економіку НКР і підлягати податковому законодавству НКР, але місцеві закони могли визначатися самими Пустельними рейнджерами, якщо федеральне законодавство НКР не регулює конкретне юридичне питання. Ті, хто народився на землях Пустельних рейнджерів, вважатимуться громадянами Нової Каліфорнійської Республіки, і всі Пустельні рейнджери також автоматично ставали громадянами НКР.\n\nУ договорі про возз'єднання містився «Пункт Лі», який зазначав, що окремі Пустельні рейнджери мають ексклюзивний дозвіл діяти за межами кордонів НКР. Новопризначений генерал Варгас наполіг на цьому перед підписанням. Очікується, що, подібно до Послідовників Апокаліпсису, Невадські рейнджери розійдуться по Пустці, чинячи правосуддя так само, як за часів слави Пустельних рейнджерів.\n\nХоча це змусило деяких каліфорнійських політиків нервувати, а дехто з колишніх Рейнджерів-відступників усе ще був незадоволений цими компромісами, Варгас знав, що це найкращий результат для всіх."
 nf_des.22.a:0 "Ми збережемо цивілізацію та справедливість."

 nf_des.23.t:0 "Востаннє, коли ти хотіла мене бачити"
 nf_des.23.d:0 "Варгас відчував, як земля дрижить під його ногами, коли вибух за вибухом струшував зовнішні стіни Цитаделі Аризони. Світло миготіло, а автоматизована система оборони ревіла про критичну небезпеку, поки останній оплот рейнджерів душили сили Легіону. Рейнджери проносилися повз нього в усіх напрямках, коли Ебігейл протягнула йому нашвидкуруч списаний клаптик паперу. Це була карта з маршрутом відступу рейнджерів до Мохаве.\nВона була без шолома, тому Варгас міг бачити всю важкість на її обличчі, вкритому шрамами та подряпинами. Вона виглядала так, ніби не спала вже кілька століть.\n\n«Я можу допомогти, Ебігейл», — благав Варгас. — «Ми можемо допомогти. Загін Альфа може...» — слова Варгаса перервав кашель, легені відмовлялися служити, він зігнувся навпіл, намагаючись утримати рівновагу.\n«Ця рана досить серйозна, старий», — сказала Ебігейл, вказуючи на його закривавлені пов'язки, отримані в битві за Кінгмен. — «Ти сам поставив Вудсона на чолі, а він хоче, щоб ти допоміг евакуювати цивільних до Каліфорнії».\nВаргас випрямився й зітхнув. Він справді так вчинив, чи не так? Було дивно чути, як власні накази йому повторює саме Ебігейл Лі.\n«Довірся нам», — тихо сказала Ебігейл, поклавши руку йому на плече. Вона серйозно подивилася йому в очі, перш ніж відпустити.\n\n«Чекай», — сказав Варгас до того, як вона встигла відвернутися. Ебігейл мовчки подивилася на нього.\n«Я пишаюся тобою, мала», — сказав він їй. На обличчі Ебігейл на мить промайнув подив, перш ніж вона посміхнулася йому й кивнула. Потім вона одягла шолом і зникла в натовпі рейнджерів.\n\nЦе був останній раз, коли Варгас бачив посмішку Ебігейл. Коли вона повернулася з Аризони, Цитаделі вже не було. Вудсон віддав своє життя, щоб забрати із собою якомога більше легіонерів, і Ебігейл Лі так і не оговталася від цієї втрати. Що вона там побачила? — думав Варгас. Чи міг він тоді щось зробити? Чи міг він урятувати Пустельних рейнджерів?"
 nf_des.23.a:0 "Чи міг він урятувати її від того, щоб вона стала такою озлобленою та зраненою?"

 nf_des.24.t:0 "Ну хіба ми не майстри вирішувати проблеми?"
 nf_des.24.d:0 "Нова Каліфорнійська Республіка припинила своє існування, і на її місці виникло чудовисько, яке об'єднало всіх рейнджерів разом. Як не іронічно, але тепер Пустельним рейнджерам доведеться марширувати на Шейді-Сендс, саме так, як і планувала Рейнджерка-відступниця. Прихильники договору та його противники тепер єдині у своїй новій меті: швидкому вирішенні кризи в Каліфорнії.\n\n«Ебігейл була б у захваті від цього», — пожартувала Анджела, і хоча Варгас ввічливо посміхнувся, від цього думки про те, що він із нею зробив, заболіли ще дужче. Вона ніколи не мала рації щодо НКР, думає Варгас, але чи стали б вони взагалі воювати, якби передбачили це раніше? Якби вони просто отримували точніші звіти, якби він приділяв більше уваги політиці НКР...\n\nТепер Нової Каліфорнійської Республіки, якою її знав Варгас, більше не було, і саме йому та Каліфорнійським рейнджерам доведеться збирати уламки допіки."
 nf_des.24.a:0 "Хіба це не удар обухом по голові?"

 nf_des.25.t:0 "Я пам'ятаю тебе такою, якою ти є"
 nf_des.25.d:0 "Рейнджери-відступники стали для Варгаса благословенням під прикриттям. Коли Пустельні рейнджери перейшли під командування НКР, їх розділили. За роки, що минули з моменту підписання договору про об'єднання, йому щастило бачити побратима-рейнджера довше, ніж на день. Він прийняв це як належне заради ефективності — Пустельні рейнджери все одно робили добро на території НКР і за її межами. Для таких досвідчених підрозділів, як Пустельні рейнджери, не було сенсу збирати всіх в одному місці лише заради спілкування.\n\nАле Варгас усе одно сумував за рейнджерами, своєю родиною. Він сумував за тим, як ділився історіями з новобранцями з широко розплющеними очима й віддавав накази рейнджерам, на яких міг покластися. Ебігейл мала рацію в тому, що повернення Пустельних рейнджерів пішло б на користь усім. Просто вона була настільки осліплена своїм горем і гнівом, що обрала неправильний шлях.\n\nЗі створенням нової Цитаделі рейнджерів та за підтримки Нової Каліфорнійської Республіки, Невадські рейнджери стали поєднанням старих і нових звичаїв. Пустельні рейнджери в їхньому колишньому вигляді вже ніколи не повернуться, але вони стали чимось кращим — чимось тривалим.\n\nБіля Цитаделі рейнджерів було встановлено статую на честь Аризонської кампанії рейнджерів, з надією, що одного дня в самій Аризоні вдасться створити гідніший меморіал. Вона присвячена тим, кого було втрачено на цьому шляху, і Ебігейл Лі. Попри те, що вона збилася зі шляху, Варгас воліє пам'ятати її як героїню. Вона була доброю, вона була впертою, вона мала велике серце — таке, що просто не витримало всього тягаря цього світу. Якби він тільки був поруч із нею, якби тільки вона змогла навчитися відпускати минуле."
 nf_des.25.a:0 "Прощавай, Ебігейл."

 nf_des.26.t:0 "Минулої ночі мені наснився найдивніший сон..."
 nf_des.26.d:0 "Я знову був в Аризоні. Наша Цитадель знову стояла. Столи в їдальні знову були розставлені в ту безглузду довгу лінію. Я міг би засягти, що чув спів, хоча ніякої музики не було. Я сидів на чолі столу, мене посадили в крісло, не надто схоже на те, що було у того хлопця Цезаря. Трешер і Рейзор перекидали чарку за чаркою, а Анджела разом із загоном Ехо кидала дротики з Новембер та «Ангелами Дет».\n\nЯ чув їхні голоси, кожного з них. Я бачив Біллі Клентона та рейнджера Мацко позаду, яким Містер Меннерс читав лекцію про миття посуду. Їхні голоси зливалися в суцільний шум, і я не міг розібрати жодного слова, але в ту мить я розумів усе.\n\nСміт і Скотчмо співали морські шанті, попри те, що ми були Пустельними рейнджерами, а не піратами, Кук і Меддокс сперечалися про «самопали», а Вудсон повчав Гольштадта й Андерсона про те, що «паперова робота корисніша за стрілянину».\n\nЯ пам'ятаю, як Олдґейт збирав нас усіх разом для фото, і як хтось скаржився, коли Тріппі заснув прямо у своїй тарілці.\nЗчинялася метушня, всі намагалися зайняти свої місця, і краєм ока я помітив Ебігейл.\n\nВона сміялася, її напарниця по рейнджерському загону трималася за її руку, розповідаючи про щось, що побачила в дорозі, коли Ебігейл помітила мій погляд. На її обличчі не було жодного шраму чи подряпини, вона тепло посміхалася мені. Вона навела на мене пальці, наче пістолет, перш ніж удавано «вистрілити», саме в ту мить, коли мене осліпив спалах камери. Я вже й не пам'ятаю, якого кольору були її очі.\n\nТого дня я прокинувся в холодному поту посеред нічі. Я вже й не згадаю, чи випив я, чи просто проплакав доти, доки знову не заснув.\nМинулої ночі мені наснився найдивніший сон, який я коли-небудь бачив. Мені наснився світ без війни."
 nf_des.26.a:0 "Мені наснився світ, де я почувався цілісним."