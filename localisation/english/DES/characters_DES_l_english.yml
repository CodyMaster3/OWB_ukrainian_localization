#Advisor Descriptions
DES_charming_jack_cultural_advisor_desc:0 "§1«Ніколи не намагайся перемогти силою те, що можна здобути обманом».§!\n\nЧарівний Джек працював на багатьох, але ніхто не платив краще за НКР. Він бачив, як політики піднімались і падали, уряди сусідів руйнувались, а гучні барони потрапляли в «нещасні» випадки. Це була робота, яка зробила його дуже багатим, але ніколи — задоволеним.\n\nЙого підтримка Абіґейл Лі була радше справою серця. Джек провів багато років по шию в корумпованому болоті політики НКР. Коли він почув чутки про загін Рейнджерів, які відкинули уніфікацію, щоб нести власну справедливість Пустками — він швидко зібрав необхідне і попрямував до Цитаделі Рейнджерів. Тепер Джек невтомно прикриває слабкі місця Бунтівної Рейнджерки. Вона — молот, він — ніж, що здобуває розвіддані й б'є поза полем бою. Рейнджери мають бути майстрами усіх видів бою, тож політичне шпигунство має даватися їм легко, так?\n\nПопри бої в Арізоні, увага Джека ніколи не відвернеться від ведмедя, що спить на сході. Чи стане його колишній роботодавець другом чи ворогом — Чарівний Джек буде готовий."

DES_scribe_theresa_cultural_advisor_desc:0 "§9«Мою жагу до знань не вгамуєш ковпачками».§!\n\nПисарка Браун, захоплена в рейді Загону Сталі на зібрання Культистів, отримала вибір, який вже робили інші до неї: вирушити в псевдо-заслання з дослідницькою місією або бути знищеною. Зрозумівши, що саме жага знань довела її до цього, вона обрала подорож до давно загублених Ґардіанів, щоб записати їхню історію і, можливо, повернути їх до кодексу.\n\nЇї місію перервало завоювання Рейнджерів, і в тумані війни їй вдалося втекти разом із ними. Так її місія з пасивного спостереження перетворилась на активне дослідження загубленого знання. Хоч її участь не була санкціонована Лост-Гіллз, з їх обложених бункерів вона їм уже недосяжна.\n\nРейнджери обережно допустили «Жінку в Блясі» до своїх бібліотек і польових команд. Її майбутнє, звісно, буде наповнене нудьгою, бідним технічним хламом і ремонтом лазерних рушниць. Але принаймні це краще, ніж бути мертвою."

DES_kai_cooke_economic_advisor_desc:0 "§G«Запиши на рахунок Абіґейл Лі!»§!\n\nКай — механік із родоводом довшим за саму Пустку. Після смерті батька, коли титул головного механіка перейшов до неї, вона пообіцяла: поки вона при владі — жоден болт не залишиться незатягнутим. Коли прийшла НКР, вона вже бачила, що це уламки, які навіть її батько не зміг би зібрати. Тож вона залишилась — і коли Рейнджери падали, вона їх піднімала.\n\nПісля кожного втраченого поселення Кай лише зміцнювала свою рішучість. Її мета — тримати все на плаву, поки Рейнджери не стануть на ноги. Лише найближчі знали, як сильно вона страждала — її найближчими часто були пляшка найдешевшого алкоголю і якийсь новачок-механік, якого затягло допомагати їй після запою.\n\nТому коли Абіґейл оголосила новий план зі звільнення Невади, Кай поринула в роботу з головою: планування кожного гвинта, розрахунок ваги припою — все вручну. Її оптимізм став полегшенням і для корпусу механіків, і для барменок."

DES_jane_maddocks_economic_advisor_desc:0 "§8«Якщо тобі дійсно потрібен Blast Radius, подай запит на наступну поставку, і я подивлюсь, що можна зробити».§!\n\nБути контрабандистом — це не просто невдячна робота... Це жахливо. В одному вусі рейнджер ниє через зайву увагу, в іншому — просить додаткові пайки рому. Кажуть, що всім не догодиш, але Джейн здається, що взагалі нікому не догодиш.\n\nХоч скільки вони не бурчали, усі добре знають: без Джейн Рейнджери були б у повному безладі. Постачання — це зброя у війні ще з часів до плазми, і жодна бомба цього не змінить.\n\nВона завжди при ділі, і найбільше боїться дня, коли стане непотрібною. На щастя, з усіма тими безглуздими запитами, які вона змушена відхиляти щодня — цей день ще не скоро.\n\nСерйозно, Fat Man?"

DES_rogue_ranger_army_chief_desc:0 "§R«Ті, хто прийшли зі страхом, були занадто хитрі. Люди, яких вони тероризували, справді плакали...\n\nНевинних, хто не опирався, обклали податками. Тих, хто намагався — зламали, обікрали й продали...\n\nОдного дня форт на пагорбі почув заклик. Солдати вирушили, щоб знищити зло...\n\nСолдати йшли, з гвинтівками в руках, з гордістю в серцях, і все, що стояло попереду — померло...\n\nІ за захист незнайомців, від усіх небезпек, їх назвали §YПустельними Рейнджерами§!...»§!\n\nКолись казали, що кожна тінь в Арізоні приховує Рейнджера, що чекає на п’яного дурня чи підлого покидька. Люди поважали Рейнджерів, бо лише вони могли їх захистити. Але коли Рейнджери пішли в Каліфорнію — зло процвітало. Настав час покінчити з корупцією. Бунтівна Рейнджерка перемогла як внутрішніх, так і зовнішніх ворогів. Шериф повернувся на пост. І відтепер злочинці знову тремтять."

DES_rogue_ranger_high_command_desc:0 "§R«Один бунт — один Рейнджер».§!\n\nКажуть, що Бунтівна Рейнджерка переслідувала Зігора Кабана 100 миль пустелею, щоб зарізати його перед його зграєю. Зло, з яким стикаються Рейнджери сьогодні, набагато страшніше, але це їхні вороги мають боятись. Ніщо не стане на заваді між Рейнджеркою і справедливістю — жодна місцевість, жоден бій, жодна погода."

DES_snake_vargas_country_leader:0 "§Y«Для тріумфу зла достатньо, щоб добрі люди нічого не робили».§!\n\nЯк підписант Договору про Уніфікацію від Рейнджерів, він спочатку пішов у відставку до міста Сак-Сіті в НКР. Коли чутки про Бунтівних Рейнджерів дійшли до нього, він зрозумів, яку небезпеку становить Абіґейл. Її дії — зневага до всього, за що колись стояли Рейнджери. Він знову взяв у руки свій старий значок і ковбойський капелюх.\n\nЕрнан «Змій» Варгас — майстерний Рейнджер. Прізвисько Змій він отримав або через любов змій до нього, або за свою холоднокровність. Після легендарної дуелі з Абіґейл він ходить з тростиною, але досі далеко не безпорадний. Тепер, завдяки гострому розуму та багатому досвіду, він керує своєю версією Пустельних Рейнджерів із відбудованої Станції.\n\nВаргас — легенда серед Рейнджерів. Але серед його підлеглих є ті, хто й досі не прийняв уніфікації з НКР. Поки що вони виконують його накази, але вірність — під питанням. І хоча Варгас вірить, що зможе їх переконати — його револьвер з перламутровою рукояткою завжди начищений... про всяк випадок."

DES_snake_vargas_army_chief_desc:0 "§Y«Полум’я цивілізації не повинно згаснути!»§!\n\nПід керівництвом Змія озброєні сили Рейнджерів нарешті зможуть відродити організацію і відновити підготовку Ветеранів Рейнджерів. Його реформи перетворять Рейнджерів на елітну силу, що перевершить навіть підрозділи НКР.\n\nНевдовзі доблесні люди як Республіки, так і Рейнджерів маршируватимуть через річку Колорадо, повертаючи те, що в них відібрали. Де б ти не був — Рейнджери пустять коріння і збудують спільноту, яку вже не вирвеш."

DES_snake_vargas_high_command_desc:0 "§Y«Я був золотим хлопцем у своєму місті. Не через влучну стрільбу — цього я тоді ще не мав — а через навички медика, які я перейняв у матері. Вона була єдиним лікарем у нашому містечку».§!\n\nСтавши Генералом Рейнджерів, Варґас іноді бере участь у справах з тилу, як Розпорядник — видає накази, нові завдання, дозволяє підвищення. А в перервах він любить перевіряти бійців на передовій і розповідати історії про старі часи на сході. А історій у нього вистачає...\n\n«Якщо ти вмів стріляти, розумів накази і виконував їх — цього було досить».\n\n«Я зустрів майбутніх товаришів по загону ще на початку підготовки, кожного з дивнішим прізвиськом за попереднього — §LАнжела Дет§!, §tГелл Рейзор§! і §2Трешер§!. Чесно, спершу ми не ладнали».\n\n«Довгий час ми просто жили повсякденним життям Пустельних Рейнджерів — розвідка, патрулі, перевірки поселень. Аж поки не сталося щось серйозне. Це був звичайний патруль — Гайпул і Аг Центр...»\n\nЦе могло здатися нудним. Можливо, боїв було мало. Але так виглядає справжнє життя. Історія — це не лише «перемогли й рушили далі»."

DES_rusty_shackleford_army_chief_desc:0 "§Y«Жодна людина, що чинить зло, не встоїть перед тим, хто правий і не відступає».§!\n\nРасті Шеклфорд усе життя провів у Техасі й вірив, що це — найкраще місце на землі. Він був членом Техаських Рейнджерів — організації ще з XIX століття. І він став свідком її загибелі від рук армії Аттіса. Після цього Расті втік кораблем до Сан-Франциско, шукаючи нового життя, та зрозумів, що культура Ші — занадто інша.\n\nУ черговій спробі знайти своє місце, він приєднався до Рейнджерів, розповівши про службу в Техасі. Його історії про знищене рідне все знайомі іншим Рейнджерам — адже вони також бачили і злет, і падіння Творця, і Анклаву.\n\nЗгодом навколо Расті утворився «Техаський загін», який здобув популярність і став мало не зірковим в НКР. Проте Вища Команда Рейнджерів була невдоволена — їхній імідж висміювали, і загін розпустили.\n\nАле тепер, під прапором Бунтівної Рейнджерки, Техаський загін може відродитись."

DES_henry_dundy_theorist_desc:0 "§P«Ніколи не тікай від доброго бою!»§!\n\nГенрі Данді — людина, яка виживе за будь-яких обставин. Багато років він служив на другорядних заставах. Але все змінилось, коли його направили до Фінікса, Арізона. Місто було в облозі. Мінометні снаряди сипалися на старі будівлі, перетворюючи вулиці на руїни.\n\nРейнджери намагались евакуювати людей, коли Легіон почав атаку. Обстріл не припинявся, а легіонери будували барикади. Хоч ситуація здавалася безнадійною, Рейнджери готували засідку.\n\nКоли ворог рушив вдруге — Рейнджери відкрили вогонь. Легіон в паніці відступив. І так кілька разів, поки не прийшло масоване підкріплення. Тоді Рейнджери були змушені відступити, багато з них загинуло. Фінікс упав. А залишки Арізонських Рейнджерів стали «Ковбойською Країною».\n\nГенрі залишив службу, але повернувся, коли його покликала Бунтівна Рейнджерка."

DES_dexter_cunningham_theorist_desc:0 "§5«Гарний лідер зробить навіть ідіота зі зброєю ефективним ідіотом зі зброєю».§!\n\nНе боєць, але стратег — Декстер Каннінґем втілює всі якості, які цінують у Рейнджерах. Рано закінчив Академію Рейнджерів і був особисто призначений §tГелл Рейзором§! для знищення рабовласницької мережі в Кламаті.\n\nПечера Ра’ата, колись зачищена Обраним, стала центром рабства. План Декстера був простий: снайпер, пастки, і нічна атака. Крики й постріли не вщухали до ранку. Перемога була повна, раби — звільнені.\n\nЗа це Каннінґем отримав заслужене визнання. Після розколу Рейнджерів він був особисто запрошений приєднатись до нової організації — і погодився з честю."

DES_the_way_of_the_ranger_theorist_desc:0 "§YІ ми продовжимо битву\nЩоб правду утвердити\nІ перемог буде з року в рік все більш\nБо попри небезпеки\nІ темряву, й безумство\nРейнджери — герої світу знов і знов\n\nТак, ми не здаємось!\nПліч-о-пліч ми йдемо!\nКрізь морок, хаос, страх і біль\nЗ народження донині\nНам бути є причини —\nБо Рейнджери ніколи не здадуться!§!\n\nВід Техаських Рейнджерів до Невадських — Рейнджер чинить правильно. Ідея надихає Рейнджера, а він завжди знайде спосіб завершити справу.\n\nА ще важливо інше — жоден Рейнджер, що загинув, не буде забутий. І жодна смерть не буде даремною... чи не помщеною."

DES_john_ashbourne_economic_advisor_desc:0 "§G«Ер-го-но-мі-ка. Знаєш, що це? Значить, добре лежить у руці!»§!\n\nАвтоматичний дробовик 12-го калібру. .45 Long Slide з лазерним прицілом. Плазмовий гвинт на 40 ват. Якщо існує — Джон Ешборн убивав з цього. Він — справжній фанат зброї. Може розібрати карабін із заплющеними очима, а затвор зібрати зубами.\n\nІсторії про його одержимість різняться, навіть він сам не впевнений. Можливо, все почалось із дев’ятиміліметрового пістолета, що залишився від батька. А можливо, з першого пострілу з мініґану. Дехто каже, що він якось заплатив проститутці кулею — і щось у ньому зламалось.\n\nЯк би там не було — Ешборн став живою енциклопедією. А це значить — він точно знає, як має працювати зброя і як має виглядати справжня зброярня."

DES_herschel_smith_economic_advisor_desc:0 "§6«А що як вирішимо це за чаркою?»§!\n\nГершел Сміт — людина розхлябана у всьому: в правилах, у словах, в організації... та особливо — в питті.\n\nДо служби в Рейнджерах Гершел був — сказати ввічливо — харизматичним місцевим п’яницею. А бути п’яницею означало знати кожного, і мати мінімум ворогів серед Рейнджерів (якщо не враховувати кілька небажаних пропозицій про «нічні зустрічі»). Тож, коли шукали когось дипломатичного — «давайте-усі-жити-дружно» — то кращого за старого добряка Гершела Сміта не знайшлося.\n\nЙого кабінет завжди в стані легкого хаосу: стіл і підлога завалені паперами, меблі стоять під дивними кутами, а термінал забитий маячнею, набраною в нетверезому стані.\n\nНе дивно, що єдина річ, яку він утримує в ідеальному стані — це його бар."

DES_thrasher_sagarra_army_chief_desc:0 "§2«Гарна тактика здатна врятувати навіть найгіршу стратегію. Погана тактика — зруйнує навіть найкращу».§!\n\nНа новій посаді начальника армії Трешер готовий розробляти бойові плани на прийдешні битви. Так, на це йде час, але коли план готовий — не шкодується ані ресурсів, ані уваги до деталей. І вороги Рейнджерів дуже швидко дізнаються, чому не варто було з ними зв’язуватись."

DES_thrasher_sagarra_high_command_desc:0 "§2«Сьогоднішня тактична перемога — ще не гарантія стратегічного успіху завтра».§!\n\nВелетень серед Рейнджерів, 198 см зросту, Трешер був найміцнішим і найвірнішим товаришем Змія Варґаса. Він віддавав перевагу ближньому бою — з ножем проти рушниці, з кулаками проти ножа. Він був у складі Альфа-Загону, що штурмував Базу Кочіс, і втратив там ногу. Та все одно вважає, що йому пощастило — міг загинути ще до тридцяти.\n\nХоча вже непридатний до бою, він все ще полюбляє сидіти на рації і радити польовим командирам. Часто саме він пропонує підвищення тим, хто проявив себе на службі.\n\nДізнавшись, що Абіґейл Лі рушила до Невади, а Варґас невдовзі за нею — Трешер недовго думав. І рушив слідом."

DES_thrasher_sagarra_cultural_advisor_desc:0 "§2«Усе за межами нашого трикутника перетворюється на терра інкогніта. Наш вплив зменшується, коли мав би зростати».§!\n\nУ свої поважні роки Трешер — живий свідок зародження Рейнджерів у Неваді. Він бачив, на що вони здатні заради добра пустки, і пам’ятає, якою була Арізона до війни. Більшість часу він проводить за написанням карт і вивченням старих стратегічних підручників. Він докладає зусиль, щоб передати свої знання новому поколінню командирів.\n\nІ хоч він старий та огрядний — в ньому ще залишилось багато сили. Поглянувши на нього, одразу видно: він цілком здатен зняти протез і провчити будь-якого молодика."

DES_hell_razor_army_chief_desc:0 "§t«Несправедливість у будь-якому місці — загроза справедливості всюди. Ми пов’язані нерозривною мережею взаємозалежності. Що впливає на одного — впливає на всіх».§!\n\nКоли Пекельний Рейзор очолює операції — жодної пощади, жодної стриманості. Його мета — знищити всіх рейдерів у зоні впливу. Настав час повернути Неваду, Юту і Арізону народові. Час покінчити з усім злом. Під проводом Пекельного Рейзора Рейнджери вступають у нову еру."

DES_hell_razor_high_command_desc:0 "§t«Де б не ховалось зло — Справедливість його знайде».§!\n\nНароджений у 2060 році, 20 жовтня, Пекельний Рейзор був учасником легендарного загону з §YВарґасом§!, §LАнжелою Дет§! та §2Трешером§!, що знищив Базу Кочіс. Відомий своєю берсеркерською манерою бою і навичками виживання в пустелі. Спочатку Варґас його недолюблював — надто вже різкий і неконтрольований. Та зрештою — команді це лише допомогло.\n\nРейзор — Рейнджер до мозку кісток, воїн, що не мислить себе поза полем бою. Після знищення Кочісу він просто взяв гвинтівку, сигарети — і пішов у наступний патруль. Коли Анжелу підвищили до командира Альфа-Загону, він ще деякий час був з нею, а згодом став самотнім вовком — одним із найнадійніших людей Варґаса.\n\nКоли Рейнджерів вигнали з Арізони — він не здався. Він знав, що зло є всюди. І коли Абіґейл Лі з Варґасом рушили в Неваду — він пішов за ними."

DES_hell_razor_theorist_desc:0 "§t«Найглибші страхи ворога відкриваються тоді, коли ти бачиш, чим він намагається залякати тебе».§!\n\nЗагін «Бриґанда» здобув свою назву під командуванням Пекельного Рейзора — за жорстокі методи. Засідки, отруєння поставок наркотиків, повернення полонених з вибухівкою — все це в його книзі тактик.\n\nДля Рейзора справжня Справедливість — це результат. Якщо методи ворога працюють — варто використовувати їх проти нього. Око за око."

DES_angela_deth_army_chief_desc:0 "§L«Старий військовий об'єкт часів до війни, і одна з найзапекліших битв Рейнджерів. Якась божевільна машина там штампувала роботів і надсилала їх вбивати. Ми добряче дали їм прочуханки. Отоді й отримала свої нашивки — стала капітаном Дез».§!\n\nСмерть чи перемога. Неможливо сказати напевно, чого саме шукає Анжела в бою. Але в неї є і м’яка сторона — вона глибоко піклується про товаришів і друзів, з якими пройшла крізь вогонь і мідні труби.\n\n«§YЗмій§! був справжнім скаженим виродком, але обов'язки витіснили з нього того шибайголову. Остання бійка в барі? Може, років десять тому...»\n\n«§tПекельний Рейзор§! не був балакуном. Друзів не заводив. Манерами не відзначався. Але був найвідданішим з усіх, і коли починалася справжня заваруха — ти хотів, щоби саме він стояв за твоєю спиною. Ім’я він отримав не просто так».\n\n«Колись §2Ґілберт§! здавався здоровенним буркотуном. Сильний, як віл, і приблизно такий же балакучий. Але після поранення в бою з роботами з Бази Кочіс він уже не міг патрулювати. І знаєш що? Виявилось, цей ведмідь має хист до картографії. Хто б міг подумати?»\n\n«§1Ейс§! і я... ми воювали пліч-о-пліч понад двадцять років. І я не дала йому померти без помсти»."

DES_angela_deth_high_command_desc:0 "§L«Я Енджі. Ви, дітки, мабуть, ті новобранці, яких натренував старий Варґас. Господи, та ви ще малюки. Нагадуєте мені нас — Змія, Рейзора, Трешера і мене — коли ми тільки починали. Думали, врятуємо світ. Думали, що ніхто з нас не загине. А я...»§!\n\nУособлення стереотипу бунтівної рудоволоски — Анжела Дез, мабуть, найвідоміша жива Пустельна Рейнджерка (якщо ще жива). Вихована в релігійній громаді, вона посварилася з старійшинами, заявивши, що якщо Бог і є — то це зло, раз світ такий жорстокий. І вона пішла — назавжди.\n\nУ складі Альфа-Загону Анжела прославилася в першому конфлікті з Кочісом. Згодом прийняла командування загоном від Варґаса, і її ім’я стало синонімом Рейнджерів. Та Легіон змусив її і багатьох інших покинути Арізону.\n\nКоли був підписаний Договір про Уніфікацію, Анжела приєдналася до Рейнджерів НКР — здавалося, вона мала борг перед ними. А коли §YЗмій§! заявив, що йде в Неваду врегулювати справи з групою бунтівників — вона стрималася. Вона знала, що може знову втратити того, хто був їй близьким. Потім дізналася — Варґас переміг, став Генералом Рейнджерів цієї нової фракції та навіть переуклав Договір. Тепер Анжела має шанс знову бути частиною тієї легендарної команди."

DES_angela_deth_economic_advisor_desc:0 "§L«Чорт забирай, Ейс. Не треба було тобі кидати гайковий ключ і брати до рук рушницю...»§!\n\nАнжела — не з тих, хто боїться чи засмучується через смерть. Хіба що, коли мова про Ейса.\n\nЕйс — її загиблий партнер. Механік, фахівець із вибухівки, коханець. (Таким і мав бути чоловік, щоби приручити таку дику душу, як «Ангел Смерті»). Він загинув під час останньої місії перед виходом на пенсію — рутинна задача з встановлення ретрансляторів на антенах. Пішов сам. І не повернувся.\n\nАнжела зберігає пам'ять про нього різними способами, зокрема використовуючи набуті від нього знання. Серед черепів, витатуйованих на її руках, є одне серце. І в ньому — лише одне ім’я: §1«Ейс»§!."

DES_elias_wordsworth_economic_advisor_desc:0 "§3«Гарна угода може зрушити навіть Сьєрра-Неваду».§!\n\nЕліас — не стільки вірний Рейнджерам, скільки зачарований їх потенціалом. У Реддінґу чи Шейді Сендс йому було тісно. Тож, після зустрічі з Абіґейл і 40-річної передоплати, він узявся до справи — постачання ресурсів для війни, не забуваючи про свою долю прибутку.\n\nЕліас, мабуть, найвпливовіший чоловік у Неваді. Багато хто займається тим, чим і він, але лише йому вдається проходити блокпости НКР чи Місто-Сховище, не отримуючи кулю чи кайдани.\n\nОдного дня Велика Западина стане чи НКР, чи чиєюсь ще. Але доти Еліас продовжить наживатися з кожного кілограма брухту."

DES_randy_aldgate_cultural_advisor_desc:0 "§L«Нам не потрібні ковбої. Нам потрібні ті, хто має сміливість вистояти проти переважаючих сил — і має вміння, щоби вистояти».§!\n\nРенді Олдґейт народився світячись — буквально. Радіаційне отруєння з народження стало його улюбленою байкою, яку він переказував щораз голосніше. Зростав серед Рейнджерів, захоплюючись байками про битви зі смерткогтями, рейди на работоргівців, зіткнення з Підрозділом.\n\nЗрештою він почав писати. Його книга «§YНові пригоди на Старому Заході§!» стала хітом та підвищила популярність Рейнджерів. Новобранці масово приходили, мріючи вбити свою першу смерткогтю чи знищити таємну базу Анклаву.\n\nРенді став головою з громадських зв’язків та найзавзятішим критиком уніфікації з НКР. Він вважав, що Рейнджери мають бути жорсткішими — і доти, поки це було можливо, тримався своєї думки. З появою Бунтівних Рейнджерів — він вирушив з ними, очоливши вербування нових кадрів."

DES_doctor_verdrehtnerv_cultural_advisor_desc:0 "§0«Мертві не вчаться на помилках... але я — так».§!\n\nНароджений у Шейді Сендс, вирощений на брамінській фермі — справжній каліфорнійський продукт. Але глибоко всередині у Вердретнєрва було прагнення до чогось іншого. Медцентр був надто стерильним, надто офіційним... і, що найгірше — нудним.\n\nЦя нудьга накопичилася в серйозному позові про медичну халатність — і преміальній нагороді за його голову. Живучи поблизу Нью-Вегасу, він заснував клініку для покидьків суспільства. Але коли туди прийшла НКР — довелося йти далі. Блукаючи пустелею, натрапив на Бунтівних Рейнджерів, похвалився своїми навичками — і осів у них.\n\nБо якщо де і можна сховатися від НКР — то лише серед тих, хто їм прямо протистоїть."

DES_patrick_fitzpatrick_cultural_advisor_desc:0 "§t«У пустці немає чесного бою. Є тільки бій до смерті. І виживають лише найсильніші».§!\n\nПатрік Фіцпатрік народився в рештках Банкервілля, Невада, четвертим сином у родині ловців геконів. Малий і кволий — його завданням було лагодити знаряддя й зброю для полювання. Копій було нагострено, пастки відремонтовано — і родина стала знаною. Але Невада — не те місце, де варто бути знаним. Якось, під час звичайного полювання, на родину напали рейдери. Вижив лише Патрік — бо лишився вдома.\n\nЗгодом з’явилися Рейнджери. І взяли хлопця до себе. В бою він був непридатним, зате в тилу — незамінним. Почав з чистки гвинтівок — за тиждень усе блищало. Зрештою, він очолив усе постачання зброї в таборі.\n\nПоки є робота — Патрік буде поруч. Рейнджери — під якою б назвою вони не були."

DES_mr_manners_economic_advisor_desc:0 "§6«Манери творять людину».§!\n\nКолись людей учили хорошим манерам. Не вбивай сусідів, не кради в дітей, чисть зуби ниткою. На жаль, ті часи давно минули, але деякі все ще сподіваються, що з’явиться хтось, хто навчить їх бути порядними. Містер Маннерс — саме такий чоловік. Виріс у передмісті Шейді Сендс, ідолізував образ бездоганної витонченості.\n\nТе, що починалося як особистий шлях до досконалості, стало комерційною послугою. Як виявилося, політики, рейдери і навіть розумні роботи всі прагнуть виглядати шляхетно — або принаймні справляти таке враження.\n\nПочалася нова епоха пустельного лицарства, і Містер Маннерс збирається зробити її втіленням власного бачення благородства."

DES_mark_anderson_high_command_desc:0 "§7«Є два типи людей: ті, що бачать цінність у добре спланованому плані, і ті, що лише пішки в грі, якої ніколи не зрозуміють».§!\n\nГрізна постать, яка завжди на крок попереду. Одного дня він з’явився у Цитаделі з оберемком ордерів на розшук і мішком відрубаних голів — і обміняв це на місце у Вищому командуванні Рейнджерів. Зазвичай стриманий, та його легко вивести з себе, коли стикається з непередбачуваністю. Хитрий стратег і майстер реакції, він став безцінним активом.\n\nДля когось його гнів став останньою краплею. Його жорсткість вважали зрадою ідеалів Рейнджерів. Певне коло змовників склало план: вбити Андерсона у сні. Але ніч перед нападом — і всі змовники зникли. Решта командування вирішила: краще мати його другом, ніж ворогом.\n\nОднак, коли Рейнджери розділилися — він таки став їхнім ворогом. З лояльними прибічниками він утворив короткоживучу Банду Андерсона, яка згодом влилася до Бунтівних Рейнджерів."

DES_koal_morales_high_command_desc:0 "§R«Зрівняймо шанси!»§!\n\nКоал Моралес — майстер руйнації. Уже за місяць служби підірвався на міні й втратив обидві ноги. Повернувшись до Цитаделі, він вивчав міни, що його покалічили. Коли був знову готовий до служби §G(з блискучими протезами)§! — розпочав кампанію з замінування, пасток і коктейлів Молотова у рейдерських землях. І це працювало.\n\nКоли НКР почала чинити тиск, він вирішив, що краще служити під їхнім крилом: більше ресурсів, чіткі цінності. Та щойно ті методи, що були основою його стратегії, оголосили воєнними злочинами — він зрозумів, що це лише початок обмежень. Уночі він зібрав речі — і пішов до «справжніх» Рейнджерів."

DES_veteran_ranger_trippy_army_chief_desc:0 "§g«Розбудіть мене на заході сонця — я вирішу ваші проблеми».§!\n\nРейнджера Тріппі багато хто вважав диваком — спав удень, зникав уночі. Але свою роботу він виконував — і виконував добре. Він був кращим нічним оператором, виконуючи спеціальні місії на межі можливого.\n\nАж поки одна випадковість не відкрила прихований склад «Кетайу» в його скрині. Його не вигнали — але репутація зруйнована. Зневажений, він почув пропозицію Абіґейл: приєднатися до її людей, де його знову цінуватимуть. В душі він би волів лишитися з НКР... але життя — річ складна."

DES_tycho_jr_jr_army_chief_desc:0 "§O«Забудьте страхи, хлопці й дівчата — за вами не один, а два Тайхо. А це — багато значить!»§!\n\nОнук славетного Тайхо, що ходив разом із Жителем Сховища, і син Тайхо Молодшого, відомого Рейнджера. Тайхо «Джуніор» Молодший прибув разом з батьком, щоб підтримати Бунтівну Рейнджерку.\n\nХаризматичний, усміхнений — його всі люблять, а Абіґейл підносить їх підтримку як доказ своєї правоти. Але насправді він — цинік. Він пам’ятає, як Легіон знищив Центр Рейнджерів — і не хоче бути поруч із цим знову.\n\nЯкщо доводиться тікати з батьком у пустелю — що ж, краще так, ніж мертвим."

DES_veteran_ranger_holstadt_high_command_desc:0 "§Y«Якщо ти можеш перейти пустелю з однією флягою, вбити чотирьох рейдерів шістьма пострілами і повернутись живим — тоді ти можеш називати себе Рейнджером».§!\n\nЕрнст Голштадт — Рейнджер все життя. Багато хто, кого він тренував, нині захищають Неваду. Це його спадок, яким він пишається. Ідея, що Рейнджери стануть солдатами для бариг із НКР — була нестерпна.\n\nКоли Абіґейл пішла — він одним із перших присягнув їй. Тепер, під її прапором, він робить те саме: веде новачків у пустелю, навчає їх виживати й перемагати."

DES_frederica_mercury_air_chief_desc:0 "§4«Боляче було падати з неба? Ні, у мене був парашут».§!\n\nФредеріка колись була рейдеркою — серед Небесних Рейверів, що блукають між НКР і Ютою. Абіґейл Лі захопила її під час останньої місії перед бунтом.\n\nПеред відходом, майбутня Бунтівна Рейнджерка запропонувала їй свободу — і шанс. Фредеріка погодилася — і пішла за нею.\n\nТепер вона — одна з молодих Рейнджерів, яких особисто навчала Абіґейл. Її досвід із Рейверами — безцінний, бо вона знає, як працює небо."

DES_veteran_ranger_rigby_navy_chief_desc:0 "§B«Чорт забирай, нам би дістатися до узбережжя. Уявіть собі армію, що рушає морем... Що за краєвид!»§!\n\nКрейґ Ріґбі виріс біля озера Тахо, будував плоти, плавав — коли його не переслідували Майрелурки. Багато його друзів подалися в Ріно, мріючи про бандитське життя. А він — на південь, стати Пустельним Рейнджером.\n\nДрузі, мабуть, уже мертві чи залежні. А він — Ветеран Рейнджер, і гордиться цим. Він не хотів стати поліцаєм для НКР. Тож коли Абіґейл пішла — він пішов з нею.\n\nВін досі пам’ятає, як плавати — і навчає цьому інших, коли бачать річку чи озеро."

DES_tycho_senior_jr_theorist_desc:0 "§O«Навчання Рейнджера — це не тільки як вижити... а як дати іншим шанс на життя. Колись це було так».§!\n\nТайхо Ст. Молодший був Рейнджером від народження, слідом за батьком — легендарним Тайхо з Невади. Попри незгоду матері, він став знаним тактиком і лідером. Та на смертному ложі мати відкрила секрет: Тайхо-старший хотів втекти від цього життя й дати синові спокій. Ця правда зламала його.\n\nКоли прийшов Легіон — він утік. Але, маючи авторитет, він агітував за приєднання до НКР. Тепер, серед Бунтівних Рейнджерів, він — лише інструктор, якого Абіґейл терпить неохоче. Але для нього Рейнджери — це сім’я. І він битиметься за неї до кінця.\n\n§YБо ще залишилось трохи добра, яке він може зробити — перш ніж піде.§!"
