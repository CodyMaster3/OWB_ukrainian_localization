#Leader
DES_ROGUE_RANGER_NAME: "Відступниця Рейнджер"
DES_ROGUE_RANGER_DESC: "§R"Сімдесят перший був рік. Рейнджери разом, близько, вмить.\nБагатство й сила – їхній спадок. Але зло не спить, не йде назад.\nКрізь пустку ширилося зло. Жах, страх – страждало добро.\nПлакала Ебіґейл, чи були вони слабкі? Поки зло повзло, вони мовчки спали!\nТа у своєму праві вона прийшла до бою. Зло її боялося, сили її – рою."§!\n\n2271 року НКР та Пустельні Рейнджери об'єдналися в єдину організацію, покликану захищати інтереси мешканців пустки.\nПринаймні, так дехто стверджує.\n\nДля Ебіґейл Лі це було неприйнятно. Ідея, що Пустельні Рейнджери відмовились від своєї незалежності, що вони закривали очі на страждання невинних, лише через їхню національність — була для неї огидною.\n\nЗгодом, вона почала сміливіше висловлювати свої погляди, коли бачила, як невинні гинуть під час рейдів Братства у глиб НКР, як рейдери далі проникають у прикордоння, як такі міста, як Шейді-Сендс і Нью-Ріно, ігнорують зло у світі.\n\nВзявши на себе ім’я Відступниці Рейнджерки — тієї, що відмовилась виконувати Угоду про Уніфікацію, і що вирішила стояти за свої ідеали попри все — Ебіґейл зібрала невелику групу однодумців і вирушила до Есмеральди, сподіваючись змінити світ там, де це було неможливо під прапором корумпованого уряду."
  
