l_english:
nf_ranger.1.t:0 "Призначення генерала"
nf_ranger.1.d:0 ""
nf_ranger.1.a:0 "Снейк Варґас"
nf_ranger.1.b:0 "Гелл Рейзор"
nf_ranger.1.c:0 "Трешер Саґарра"

nf_ranger.2.t:0 "Походження Рейнджерів"
nf_ranger.2.d:0 ""
nf_ranger.2.a:0 "Інженерний корпус армії США."
nf_ranger.2.b:0 "Національна гвардія."
nf_ranger.2.c:0 "Батальйони Армійських Рейнджерів."

nf_ranger.3.t:0 "В'язні"
nf_ranger.3.d:0 ""
nf_ranger.3.a:0 "Прийняти злочинців."
nf_ranger.3.b:0 "Прийняти дрібних правопорушників."
nf_ranger.3.c:0 "Вислати злочинців."

nf_ranger.4.t:0 "Миротворці Мохаве"
nf_ranger.4.d:0 ""
nf_ranger.4.a:0 "Захищати слабких."
nf_ranger.4.b:0 "Захищати всіх."
nf_ranger.4.c:0 "Захищати багатих."

nf_ranger.5.t:0 "НКР відмовляє племенам у правах"
nf_ranger.5.d:0 "НКР відмовила племенам у праві на незалежність після перемоги над Легіоном. Це неприйнятно і суперечить усім засадам нашого союзу. У нас є вибір: залишитися з НКР і зрадити свої переконання, або розірвати пакт і довести, що ми все ще вірні свободі."
nf_ranger.5.a:0 "Піти з НКР"
nf_ranger.5.b:0 "Залишимося — отримаємо більше."

nf_ranger.6.t:0 "Рейнджери розривають союз!"
nf_ranger.6.d:0 "Рейнджери розірвали союз з нами, звинувативши нас у зраді етичних принципів і перетворенні на новий Легіон."
nf_ranger.6.a:0 "Як вони посміли!"

nf_ranger.7.t:0 "Пропозиція Сталевих Рейнджерів"
nf_ranger.7.d:0 "Сталеві Рейнджери надіслали запит про вступ до нашої фракції. Прийняти?"
nf_ranger.7.a:0 "Так. Нехай приєднуються."
nf_ranger.7.b:0 "Ні. Нам краще без них."

nf_ranger.8.t:0 "Відповідь Братства"
nf_ranger.8.d_yes:0 "Вони прийняли наш запит на приєднання."
nf_ranger.8.d_no:0 "Вони відхилили наш запит на приєднання."
nf_ranger.8.a:0 "Мудре рішення."
nf_ranger.8.b:0 "Кляті технофоби."

DES_leader_chosen:0 "Оберено лідера"

nf_ranger.9.t:0 "Загроза від Вісімдесятих!"
nf_ranger.9.d:0 "Вісімдесяті знищили Рубі Веллі та Райперулт. За їхніми машинами тягнуться колони рабів, вантажівки повні здобичі. Місто-Сховище й Нью-Ріно не зможуть вистояти самотужки. Прийшов час Пустельним Рейнджерам дотриматися своєї обіцянки народу Юти."
nf_ranger.9.a:0 "Рейнджери захистять усіх вас."
nf_ranger.9.b:0 "Ми дуже зайняті, пробачте."
nf_ranger.9.c:0 "А ви хто взагалі такі?"

nf_ranger.10.t:0 "Вісімдесяті рушають на захід!"
nf_ranger.10.d:0 "Сталося те, чого ми боялись. Вісімдесяті рушили на захід, незважаючи на наші попередження. Наші люди йдуть їм назустріч — як остання надія на мир."
nf_ranger.10.a:0 "Ми не підемо тихо, [EHT.GetLeader] це запам’ятає."
protect_nevada:0 "Захист Невади"

nf_ranger.11.t:0 "Продаж Скрапхіпа"
nf_ranger.11.d:0 "НКР запропонувала викупити у нас захист Тікеттла. Хоча у нас є деякі сумніви, зрештою ми не уряд, а лише захисники Пустки. Що нам робити?"
nf_ranger.11.a:0 "Нам це не потрібно."
nf_ranger.11.b:0 "А ми ще довіряємо НКР?"

nf_ranger.12.t:0 "Вимкнути Тікеттл"
nf_ranger.12.d:0 "Чи дійсно нам потрібен контроль над Тікеттлом? Особливо враховуючи гроші, що на кону."
nf_ranger.12.a:0 "Це була наша ціль від самого початку."
nf_ranger.12.b:0 "А де ж ми тоді людей набиратимемо?"

