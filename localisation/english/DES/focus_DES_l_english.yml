l_english:
des_origins:0 "Походження з Пустелі"
des_origins_desc:0 "Пустельні Рейнджери ведуть своє походження від довоєнного військового персоналу з різних підрозділів. Вшанування цієї спадщини завжди було ключовою частиною їхньої ідентичності."

des_prisons:0 "В’язниця"
des_prisons_desc:0 "В’язниця була початковою базою Пустельних Рейнджерів, і коли її знайшли, вона була наповнена злочинцями та покидьками. Рейнджери гостро потребували людей, але чи варто приймати злочинців у свої лави — це вже інше питання."

des_mojave:0 "Миротворці Невади"
des_mojave_desc:0 "Народ Невади вічно вдячний Рейнджерам і ділиться з ними всім, що може. Побачивши це на ранньому етапі, Рейнджери зіткнулись із моральною дилемою: допомагати тим, хто може віддячити, чи тим, хто не має чим платити?"

des_jackals:0 "Шакали"
des_jackals_desc:0 "Банда Шакалів — це особливо огидна зграя рейдерів, що отримала свою назву за звичку нападати на слабкі й майже беззахисні громади. Вони наші вороги з незапам'ятних часів, і давно пора покінчити з цими псами!"

des_canis:0 "Рейнджерський Загін Каніс"
des_canis_desc:0 "Ті Шакали, що виявились достатньо розумними, щоби здатися, були захоплені, перевиховані та перевдягнені. Вони або стануть Рейнджерами і спокутують свої злочини, або приєднаються до своїх товаришів у могилі."

des_kennel:0 "Псяча Конура"
des_kennel_desc:0 "Території, які контролювали Шакали, десятиліттями називали Конурою через гніт, що панував там. Малі спільноти фермерів і торговців, що роками не знали свободи, стікаються під наші знамена й відкривають давно приховані сховища обладнання та скарбів."

des_vipers:0 "Гадюки"
des_vipers_desc:0 "Гадюки — змії в найгіршому сенсі цього слова. Брехливі, зрадливі й підступні. Було б мудро сприймати їх як серйозну загрозу й не недооцінювати здатність встромити ніж у спину."

des_venom:0 "Отрута Гадюк"
des_venom_desc:0 "Мешканці територій, колись підконтрольних Гадюкам, боялись «Отрути» — речовин, що додавались у воду, змушуючи громади купувати дорогу продукцію Гадюк. Тепер, коли їх знищено, наші зусилля з очищення джерел води заслужили нам любов місцевих."

des_vipera:0 "Рейнджерський Загін Віпера"
des_vipera_desc:0 "Ті Гадюки, що здалися, були затримані, перевиховані та переозброєні. Вони або стануть Рейнджерами і спокутують свої провини, або поділять долю своїх полеглих товаришів."

des_vipercore:0 "Осушити отруту"
des_vipercore_desc:0 "Землі, колись підконтрольні Гадюкам, повністю очищено від їхньої спадщини. Місцеві мешканці присягнули на вірність Пустельним Рейнджерам. Ці громади стануть опорою нашого майбутнього."

des_heel:0 "Поставити псів на ланцюг"
des_heel_desc:0 "Землі, що раніше належали Шакалам, повністю очищено, а місцеве населення присягнуло на вірність справі Пустельних Рейнджерів. Вони стануть наріжним каменем нашої майбутньої сили."

des_outpostjackal:0 "Аванпост Шакалів"
des_outpostjackal_desc:0 "Колишня штаб-квартира Шакалів — добре захищене й багате на ресурси місце. Багато хто пропонує зробити з нього наш головний аванпост у цьому регіоні."

des_yerington:0 "Звільнити Йерінґтон"
des_yerington_desc:0 "Йерінґтон давно був осередком рабовласників і жорстоких покидьків у Неваді. Місце, сповнене невинних людей, які зазнали незліченних страждань. Його звільнення стало стимулом для численних добровольців приєднатися до боротьби з рейдерами."

des_conscription:0 "Призов Рейдерів"
des_conscription_desc:0 "Не всі рейдери безнадійні. Багато з них — це молодь, що не знала іншого життя, наркомани, яких силоміць втягнули в банди. Їхні злочини не можна пробачити, але вони можуть відпрацювати свій борг, захищаючи людство від своїх колишніх союзників."

des_outpostviper:0 "Аванпост Гадюк"
des_outpostviper_desc:0 "Колишній штаб Гадюк — добре укріплене місце, багате на ресурси. Багато хто пропонує зробити його центральною базою наших операцій у цьому регіоні."

des_general:0 "Призначення Генерала Рейнджерів"
des_general_desc:0 "У багатьох Рейнджерів виникають сумніви щодо подальшого керівництва Снейка Варґаса, який очолював організацію понад два десятиліття. Старші Рейнджери бажають замінити його, і хоча сам Варґас прагне піти у відставку, він підозрює, що його наступники хочуть втягнути Рейнджерів у великі конфлікти."

des_thrasher:0 "Трешер Саґарра"
des_thrasher_desc:0 "Ксенофоб та технократ Трешер Саґарра став новим головним Рейнджером! Як давній прихильник Братства Сталі, він прагне формального військового союзу між Рейнджерами та їхніми броньованими «родичами» з Каліфорнії."

des_knights:0 "Тактика штурму лицарів"
des_knights_desc:0 "Рейнджери роками вивчали тактику Братства Сталі у їхніх конфліктах. Трешер Саґарра довго займався аналізом цих ефективних, хоча й простих методів штурму, і тепер впроваджує їх у тренування новобранців."

des_workbench:0 "Інструкції з верстатів"
des_workbench_desc:0 "Прості моделі енергетичної зброї можна виготовляти масово, якщо мати відповідний верстат та запаси необхідних компонентів."

des_database:0 "Обмін базами даних"
des_database_desc:0 "Наша база даних не зрівняється з архівами Братства Сталі, але ми маємо цінну інформацію, яку вони готові обміняти на передвоєнні тактичні знання та інструктаж."

des_drills:0 "Навчання від Командора Ріда"
des_drills_desc:0 "Командор Лицарів Рід Реддінґ, з яким Саґарра познайомився в минулому, прибув особисто для обміну знаннями й методиками підготовки. Зустріч із давнім другом укріплює прагнення Саґарри до альянсу з Братством Сталі у майбутніх війнах."

des_steel:0 "Рейнджери Сталі"
des_steel_desc:0 "Пустельні Рейнджери занадто довго марнували сили й ресурси у пісках Невади та Аризони, захищаючи небагатьох, ледве забезпечуючи себе зброєю та спорядженням. Якщо вони хочуть рухатися вперед, то мають еволюціонувати — з загону добровольчих міліцій у справжній підрозділ Братства Сталі."

des_bosfunding:0 "Фінансування від Братства Сталі"
des_bosfunding_desc:0 "Братство — перш за все військова організація. Наше нещодавнє приєднання до них стало початком вигідного обміну людьми й обладнанням — і більшість переваг дісталася саме нам."

des_vargas:0 "Снейк Варґас"
des_vargas_desc:0 "Попри проблеми з коліном і старіючий розум, Снейк Варґас вирішив не йти у відставку. Частково тому, що всі його потенційні наступники відкрито шукали союзу з місцевими силами, замість того щоб продовжувати мрію Рейнджерів — про безпечну, об'єднану Пустку, а не політичні інтриги."

des_rogue_ranger:0 "Війна проти зла"
des_rogue_ranger_desc:0 "Договір про об'єднання Рейнджерів — це фарс, який Відступниця повністю відкидає! Її перемога над Варґасом у дуелі довела Рейнджерам істинність її шляху. Її ультиматум для НКР, Братства Сталі та інших сил однаковий: навіть не намагайтесь нам диктувати."

des_evil_that_men_do:0 "Зло, що творить людина"
des_evil_that_men_do_desc:0 "Людство — хвороба, а біль — її симптом. Це щось жорстоке й спотворене, що захоплює розум і серце слабких. Єдиний спосіб вилікувати — вирвати це зло з корінням, щоб воно згнило в ніщо.\nЗавдання Рейнджера — боротися з цим злом, у будь-якій формі."

des_the_burdens_we_carry:0 "Наші тягарі"
des_the_burdens_we_carry_desc:0 "У кожного з нас є шрами. Образи, болі, приниження. Чим старші ми стаємо, тим сильніше ці спогади переслідують нас.\nМожливо, колись, коли світ очиститься від зла, ми отримаємо те, на що заслуговуємо — спокійний світ, тихий як ніч.\nМожливо. Але поки що це наші тягарі. Мої тягарі."

des_raider_parasites:0 "Рейдерські паразити"
des_raider_parasites_desc:0 "Немає нічого солодшого, ніж проломити череп рейдеру, гнилій потворі. Вони — нижчі за всіх. Не здатні вижити самі. Їх треба викорінити. Без винятків."

des_repulsive_gangster_filth:0 "Гидке бандитське сміття"
des_repulsive_gangster_filth_desc:0 "Рейдери, гангстери — яка різниця? Обидва — втілення гнилизни. Один обкрадає тебе, другий продає надію, якої не існує. Ріно відрізняється від рейдерів лише неоновим блиском. Без нього вони ніщо."

des_call_to_action:0 "Заклик до дії"
des_call_to_action_desc:0 "Кожен може стати героєм! Боротьба зі злом — шлях благородних. Рейнджери — лицарі Пустки. Можливо, у Ріно ще знайдуться ті, хто почує наш заклик, візьме зброю й стане одним із нас?"

des_the_lies_they_were_told:0 "Брехня, в яку їх змусили повірити"
des_the_lies_they_were_told_desc:0 "Азартні ігри — це облудна надія. Казино — фальшиве місце з фальшивими вогнями, яке заманює тих, хто прагне вирватися з бруду. Вони віддають останнє в надії на диво.\nДосить. Пора дати їм справжню надію."

des_the_flame_of_rightousness:0 "Полум’я праведності"
des_the_flame_of_rightousness_desc:0 "Наші корені ведуть до Каліфорнії. 2271 рік — рік зради, коли Рейнджери втратили свою незалежність і стали маріонетками республіки.\nНе можна боротися зі злом, коли тобі віддає накази обраний злом народ. Знищити зло — значить викорінити його з розуму й сердець людей.\nМи — полум’я, у якому зло не виживе. Ми — Рейнджери Пустки. Ми принесемо добро до Каліфорнії."

des_veterans:0 "Поради ветеранів"
des_veterans_desc:0 "Навіщо нам стороння допомога, коли у нас є десятиліття досвіду? Старші Рейнджери вчили молодь виживанню, милосердю та неминучому насильству."

des_caravans:0 "Охорона караванів"
des_caravans_desc:0 "Надійна охорона торгівлі — запорука сталого обміну. Забезпечивши безпеку маршрутів, ми отримаємо частину товарів і постачання."

des_population:0 "Інтеграція племен"
des_population_desc:0 "У Неваді є багато ізольованих племен, які можуть бути нам корисними. Та залишати їх у первісному стані — неефективно. Пора дати їм урок цивілізації."

des_planning:0 "Планування воєнного часу"
des_planning_desc:0 "Пустельні Рейнджери мають бути готовими до будь-якого вторгнення. Військові навчання та стратегічне планування стають дедалі важливішими. Якщо настане тотальна війна — ми не дамося без бою."

des_radio:0 "Рейнджерське Радіо"
des_radio_desc:0 "Ми десятиліттями користувались радіозв’язком, але ніколи не мали справжньої станції з музикою та новинами. Одна амбітна дівчина запропонувала запустити таку станцію — варто дати їй шанс."

des_pact:0 "Невадський пакт"
des_pact_desc:0 "Невада — маленька крапка у великій Пустці, повна ворогів і конфліктів. Союз із місцевими силами — Ріно, Місто-Сховище, Вегасом — дозволить нам посилити свій вплив."

des_intervention:0 "Рейнджерський інтервенціонізм"
des_intervention_desc:0 "Пустельні Рейнджери повинні бути готовими до дій будь-де, щоб захистити невинних від жахів Пустки."

des_echobase:0 "Станція Ехо"
des_echobase_desc:0 "Станція Рейнджерів Ехо — це стара військова база. Відновлення її злітних смуг і ангарів дозволить нам розвивати авіацію."

des_funding:0 "Фінансування Невади"
des_funding_desc:0 "Ми не маємо багатства НКР чи індустрії Братства Сталі, але маємо підтримку невадського народу. І цього нам вистачить."

des_outriders:0 "Рейнджерські машини"
des_outriders_desc:0 "Доставити Рейнджерів на фронт і назад — непросто. Але наші технарі розробили бронетехніку для цієї цілі. Це буде наш спис правосуддя."

des_recruitment:0 "Набір у Неваді"
des_recruitment_desc:0 "Пустельні Рейнджери потребують постійного припливу новобранців, щоб змагатися з більшими державами. Кампанії з набору — сумна, але необхідна реальність у Пустці."

des_reforming_the_rebel_rangers:0 "Реформа повстанців-Рейнджерів"
des_reforming_the_rebel_rangers_desc:0 "Причиною, чому Варґас вирушив на північ, було питання принципу. Бачити, як Рейнджери воюють між собою — повне заперечення ідеї організації. НКР — найкраща надія для Пустки, і Варґас обрав переможців."

des_legionprep:0 "Підготовка до Легіону"
des_legionprep_desc:0 "Варґас і його товариші пам’ятають, як навіть десятки легіонерів не могли здолати старі укріплення та колючий дріт. Тепер вони передають цей досвід тим, хто захищає Шейді-Сендс. Раптом доведеться приймати останній бій..."

des_leadership:0 "Недоторкане лідерство"
des_leadership_desc:0 "Гелл Рейзор ніколи не вірив у те, що тренування або муштра мають значення на полі бою. Виживанню навчає лише саме виживання, а вбивству — лише вбивство."

des_mechanized:0 "Механізація Рейнджерів"
des_mechanized_desc:0 "Від Цитаделі до берегів Колорадо — довгий шлях. Якщо Гелл Рейзор хоче допомагати НКР, йому потрібен транспорт, який зможе оперативно перекидати війська."

des_californians:0 "Каліфорнійські добровольці"
des_californians_desc:0 "Безперервне радіомовлення Варґаса про загрозу Легіону спонукало тисячі громадян НКР вирушити на північ, щоби вступити до елітної армії Рейнджерів."

des_treaty:0 "Договір про Реуніфікацію Рейнджерів"
des_treaty_desc:0 "Після тривалих дебатів було підписано нову угоду. Тепер Рейнджери Невади стали офіційною частиною збройних сил НКР і відповідають за захист регіону."

des_ncrfunding:0 "Фінансування НКР"
des_ncrfunding_desc:0 "Після вступу до НКР Пустельні Рейнджери отримали значне фінансування та помітну частину військового бюджету. А вимоги Гелла Рейзора щодо додаткових коштів ще більше зміцнили Неваду."

des_wastelandprotect:0 "Угоди про захист Пустки"
des_wastelandprotect_desc:0 "У розумінні Братства Сталі захист Пустки вимагає відповідних інструментів — перш за все, енергетичної зброї. І ми маємо до неї доступ."

des_citadel:0 "Злітна смуга Цитаделі"
des_citadel_desc:0 "Війна з Легіоном відбувається далеко звідси, і авіаційна підтримка життєво необхідна. Братство щедро погодилося оновити злітну смугу в Цитаделі."

des_aviation:0 "Авіаційна історія"
des_aviation_desc:0 "Хоч ми й не були частиною військово-повітряних сил до війни, ми маємо креслення та машини для виготовлення запчастин до літаків. Це дає нам змогу підтримувати невеликий повітряний флот."

des_bear:0 "Війна з Ведмедем"
des_bear_desc:0 "Війна з НКР — війна без кінця. Десятки тисяч солдатів кидаються на нас знову і знову, але ми тримаємось. Ми возз’єднаємось із братами, та на наших умовах."

des_attrition:0 "Війна на виснаження"
des_attrition_desc:0 "Як хвилі, що розбиваються об скелі, війна з НКР вимагає стримування й відчаю. Уміння копати окопи й закріплюватися — запорука виживання."

des_giant:0 "Вбити велетнів"
des_giant_desc:0 "Супермутанти — справжній жах. Але ніколи ще їх не було так багато. Тисячі йдуть із півночі, та ми — хоробрість і кмітливість — кладемо їх."

des_tall:0 "Стоїмо гордо"
des_tall_desc:0 "Що більше чудовиськ ми вбиваємо, то вище стоїмо на їхніх тілах. Мутанти не переможуть людство. І ми їм цього не дозволимо."

des_boshonours:0 "Почесті від Братства"
des_boshonours_desc:0 "Ми допомогли союзникам у великій війні! Наші подвиги стали легендами, і нас завжди пам’ятатимуть у залах Братства."

des_reorganize:0 "Почати реорганізацію Рейнджерів"
des_reorganize_desc:0 "Пустельні Рейнджери повинні постійно змінюватись і пристосовуватись. Погляньмо всередину, щоби забезпечити майбутнє."

des_physician:0 "Призначити головного лікаря"
des_physician_desc:0 "Головний лікар — важлива посада, яку вже кілька років ніхто не займає після загибелі попереднього."

des_medic:0 "Медична підготовка Рейнджерів"
des_medic_desc:0 "Ми не Місто-Сховище, але маємо навчитись справлятися з пораненими. Що маємо — з тим і працюємо."

des_recruiter:0 "Призначити головного вербувальника"
des_recruiter_desc:0 "Переконати когось покинути все й боротися за інших — непросте завдання. Тут потрібна харизма. І здатність запалити серце гнівом, перетворивши його на полум’я."

des_propaganda:0 "Пропаганда Рейнджерів"
des_propaganda_desc:0 "На жаль, не всі знають про Рейнджерів. Але чим більше чують — тим більше нас підтримують. Час вийти в ефір."

des_trader:0 "Призначити головного торговця"
des_trader_desc:0 "Ми — свого роду місто-держава. Через наші землі проходить значна частина торгівлі Невади, а вигідні угоди з НКР і не тільки роблять нас багатими."

des_outreach:0 "Зв’язки з громадськістю"
des_outreach_desc:0 "Економіку будує не лише торгівля — важливо забезпечити її безперервність. Найчастіше це означає надання ковпаків і ресурсів тим, хто намагається закріпитися у Пустці."

des_quartermaster:0 "Призначити головного інтенданта"
des_quartermaster_desc:0 "Зброя, зброя і ще раз зброя. Інтендант відповідає за те, щоб кожен мав те, що потрібно для виконання завдання — і достатньо набоїв, щоби довести його до кінця."

des_armouries:0 "Озброєна кімната рейнджерів"
des_armouries_desc:0 "Озброєна кімната рейнджерів — одна з найкращих у своєму роді. У нас є склади зі зброєю, які понад п’ятдесят років припадали пилом. Завдання інтенданта — облікувати й відновити якомога більше цієї зброї."

des_mechanic:0 "Призначити головного механіка"
des_mechanic_desc:0 "Хороший майстер на вагу золота, але нещодавно нам пощастило. Один вигнанець з племені Вісімдесятників запропонував свої послуги. Чи то жадає помсти, чи просто хоче допомогти — у будь-якому випадку, це подарунок долі."

des_depot:0 "Депо"
des_depot_desc:0 "Наш новий головний механік мріє не про прості авто чи вантажівки, а про справжні бойові машини Старого Світу. Він хоче зібрати їх знову — і з їхньою допомогою підкорити всіх, хто насмілився встати проти нас."

des_reorganized:0 "Завершити реорганізацію рейнджерів"
des_reorganized_desc:0 "Пустельні Рейнджери сильніші, ніж будь-коли! Ми стоїмо в ім’я Пустки, за її народ, проти всіх, хто бажає їм зла. Нехай наш мир буде довгим, а війни — короткими."

des_coop:0 "Співпраця з рейнджерами"
des_coop_desc:0 "Ми повинні тісно співпрацювати з рейнджерами НКР, щоб подолати всі майбутні загрози. Вони схожі на нас, хоч і більш войовничі. Але вони — надійні союзники в дні, що настануть."

des_bunkers:0 "Зламати бункери"
des_bunkers_desc:0 "Братство Сталі любить ховатися у своїх дірках — укріплених довоєнних бункерах та подібних укриттях. Потрапити туди — справжній жах. Але хтось мусить це зробити. Ми готові, завдяки постійним навчанням і тренуванням."

des_jericho:0 "Операція «Єрихон»"
des_jericho_desc:0 "Колись фортеця Єрихон протистояла людям Божим. І була знищена гнівом Божим. Тепер ми викличемо той самий гнів на тих, хто зрадив нас і наших союзників з НКР. Якщо вони не з нами — то проти нас."

des_greatwar:0 "Велика Війна"
des_greatwar_desc:0 "Легіон прийшов. Навіть Гелл Рейзор сумнівається, що ми переможемо — та все одно скликає чоловіків і жінок рейнджерів до останньої великої битви. Хтось каже, що він шукає смерті. Але він просто хоче донести одне: перемоги не буває без жертви."

des_arizona:0 "Повернення до Аризони"
des_arizona_desc:0 "Колись рейнджери контролювали великі території Аризони, аж доки Легіон не витіснив нас. Тепер ми повертаємось."

des_threat:0 "Нова загроза"
des_threat_desc:0 "Знову мутанти? І з півночі? Настав час рейнджерам і НКР знову об'єднати зусилля. Хто може вистояти проти нашої єдності?"

des_march:0 "Довгий марш на північ"
des_march_desc:0 "Мало перемогти ворога на полі бою. Ми маємо гнатися за ним аж до самого лігва, випалити їхні нори, задушити їх димом. Показати їм, чому людство досі стоїть. Час людини ще не минув."

des_honours:0 "Почесті від НКР"
des_honours_desc:0 "Ми довели, що разом з союзниками можемо навести лад навіть перед обличчям великих викликів. Хай усі наші вороги тремтять: ми — почесні союзники Республіки та хранителі її ідеалів."

des_fall_of_the_republic: "Падіння Республіки"
des_fall_of_the_republic_desc: "Після краху Республіки ми маємо зробити все можливе, щоби зберегти її спадщину! Маршируймо на південь на захист свободи!"

des_vargas_capstone: "Честь і Слава"
des_vargas_capstone_desc: "Стояти пліч-о-пліч з Каліфорнією — справа честі. Захист індивідуума, свобода жити, як бажаєш."

des_ranger_wg_reno: "Знищення гангстерів"
des_ranger_wg_reno_desc: "Гангстери не заслуговують на життя. Вони живуть за рахунок експлуатації пустельників. Ми знищимо їх, якщо доведеться — силою."

des_ranger_wg_ykz: "Якудза"
des_ranger_wg_ykz_desc: "Якудза — збочена, ізоляціоністська банда виродків. Пустка стане чистішою, коли ми зітремо їх із лиця землі."

des_greater_capstone: "Створити Цитадель Рейнджерів"
des_greater_capstone_desc: "Дім для всіх рейнджерів. Місце, яке ми зможемо називати домом — стара Цитадель Хранителів виконає цю роль. З її руїн постане нова Цитадель Рейнджерів — столиця нової епохи."

des_unique: "Есмеральда очищена"
des_unique_desc: "Бунтівна Рейнджерка зробила це! Весь округ Есмеральда очищено від зла — рейдерів, племен і дикунів вигнано з великою ретельністю. Настав час переосмислити Есмеральду, зробити її справжньою землею закону та порядку."

des_nevada_1: "Відновити обладнання «Каруселі»"
des_nevada_1_desc: "«Карусель», шоу яке транслювалось у TV-Тауні бозна-скільки, залишило по собі чимало корисного обладнання, яке ми можемо використати для створення нової зброї. Скористаймося цим!"

des_nevada_2: "Перемога Людства"
des_nevada_2_desc: "Машини тут навіть не були людьми — абомінації з плоті та сталі, непридатні для життя поруч із людством. Як заарештувати когось, хто здатен знищити цілий квартал за найменшого подразнення?"

des_nevada_3: "Очищення TV-Таун"
des_nevada_3_desc: "Велика частина TV-Тауну була присвячена виробництву «Каруселі», але якщо ми зачистимо цю територію — отримаємо більше простору для чесних і працьовитих мешканців Пустки."

des_wg_on_grd: "Знищити культ технократів"
des_wg_on_grd_desc: "Ці «Хранителі» нічим не кращі за терористів із Братства, які колись нападали на НКР! Знищимо їх заради безпеки Пустки!"

des_wg_on_south: "Рейдери та дикуни"
des_wg_on_south_desc: "Обидва — монстри у своїй формі. Знищимо їх обох — і захистимо Есмеральду!"

des_showdown: "Старомодна дуель"
des_showdown_desc: "Схоже, не всім до вподоби те, як Бунтівна Рейнджерка веде справи..."

des_vargas_reconcilliation_1: "Погляд у минуле"
des_vargas_reconcilliation_1_desc: "Якщо відступити на крок і по-справжньому подумати — шкода, якої ми завдали цим людям під час завоювань, буде загоюватись роками. Це не героїзм. І винні в цьому лише ми самі."

des_vargas_reconcilliation_2: "Переосмислення Договору"
des_vargas_reconcilliation_2_desc: "Договір про об’єднання, якщо подумати, не був таким уже й поганим для Пустельних Рейнджерів. Без перспективи єдності з рейнджерами НКР, можливо, ми просто зникли б у забутті. Тепер, коли Бунтівної Рейнджерки немає, дедалі більше людей починають переосмислювати ідею повернення до НКР."

des_rejected_unification_treaty: "Відхилив Договір про Об'єднання"
des_rogue_ranger_hates_quote_bad_guys_quote: "Праведність"

veteran_ranger: "Рейнджер-ветеран"

des_fall_of_the_republic_tt: "Оскільки Каліфорнія більше не уособлює наші ідеали — ми маємо зробити крок, щоб повернути її!"
