DES_wasteland_preparedness:0 "Пустельна Підготовка"
DES_wasteland_preparedness_desc:0 "Пустельні Рейнджери вправно діють у спекотних умовах південного заходу Америки. Від моменту заснування їхня підготовка робила наголос на витривалість та навички виживання в екстремальних умовах. Це, звісно, ускладнює вступ новобранців, але такі навички надзвичайно ефективні в боротьбі з тиранами під палаючим сонцем пустелі."

DES_ranger_treaty_defied:0 "Випробування та Невизначеність"
DES_ranger_treaty_defied_desc:0 "Минуло чотири роки з моменту підписання Договору про Об'єднання з Новою Каліфорнійською Республікою, коли Пустельні Рейнджери залишили боротьбу за знедолених і перейшли під прапор Ведмедя. Якби в Абіґейл та її однодумців не було рішучості, вони б не зважились відмовитися від вірності НКР. Проте праведний гнів, навіть якщо він виправданий — погана заміна для чіткого державного ладу.\n\nРейнджери ніколи не дбали ні про що інше, окрім свого обов’язку. До 2271 цього було достатньо: вдячність поселенців забезпечувала їм притулок і харчі. Але тепер, у пустельному окрузі Есмеральда, де поселень мало, а ворогів багато, їхні старі методи не працюють. До того ж, тепер вони — зрадники, які переховуються від величезної військової сили. Розколи та моральний занепад дедалі очевидніші.\n\nСпроби зробити з Рейнджерів самодостатню державу надзвичайно важкі — і залишатимуться такими, доки вони не здобудуть контроль над регіоном. Хай то буде в ім’я когось… чи свого власного."

DES_ranger_treaty_defied_2:0 "Відновлення Сили"
DES_ranger_treaty_defied_2_desc:0 "Минуло чотири роки з моменту підписання Договору про Об'єднання з Новою Каліфорнійською Республікою, коли Пустельні Рейнджери залишили боротьбу за знедолених і перейшли під прапор Ведмедя. Якби в Абіґейл та її однодумців не було рішучості, вони б не зважились відмовитися від вірності НКР. Проте праведний гнів, навіть якщо він виправданий — погана заміна для чіткого державного ладу.\n\nРейнджери ніколи не дбали ні про що інше, окрім свого обов’язку. До 2271 цього було достатньо: вдячність поселенців забезпечувала їм притулок і харчі. Але тепер, у пустельному окрузі Есмеральда, де поселень мало, а ворогів багато, їхні старі методи не працюють. До того ж, тепер вони — зрадники, які переховуються від величезної військової сили. Розколи та моральний занепад дедалі очевидніші.\n\nСпроби зробити з Рейнджерів самодостатню державу надзвичайно важкі — і залишатимуться такими, доки вони не здобудуть контроль над регіоном. Хай то буде в ім’я когось… чи свого власного."

