l_english:
  LIN_ZEXU_NAME:0 "§gЛінь Цзесю§!"
  LIN_ZEXU_TITLE:0 "Лінь Цзесю, імператорський намісник імператора Лаошу."
  LIN_ZEXU_DESC:0 "Син Неба, імператор Лаошу занадто зайнятий, щоб мати з вами справу. Натомість його світлість використовує мудрого Лінь Цзесю для вирішення державних справ."
  CHN_1:0 "§gКОМЮНІКЕ ВІД СЕРЕДИННОГО ЦАРСТВА§!"
  CHN_1_DESC:0 "§gТи, о воєначальнику, що живеш за межами багатьох морів, тим не менш, спонукуваний своїм бажанням знайти відповіді за великим океаном, ти відправив місію в наші землі. Твої посланці перетнули моря і засвідчили свою повагу при дворі мого володаря.\n\nМій володар чув про твої володіння на краю світу і хотів би краще їх зрозуміти.\n\nТвоєму посланцю буде дозволено повернутися у твої землі в супроводі того, хто має благословення мого володаря. Прийми цього посланця, стався до нього як до найшанованішого гостя. Він донесе до тебе голос і велич мого володаря, так далеко від небес.\n\nЛінь Цзесю, від імені імператора Лаошу.§!"
  fallout_chinese_close_button_text:0 "§GХвала щедрості імператора Лаошу!\nКІНЕЦЬ КОМЮНІКЕ§!"
  #"§gТи, о воєначальнику, що живеш за межами багатьох морів, тим не менш, спонукуваний своїм бажанням долучитися до благ нашої цивілізації, ти відправив місію в наші землі. Твій посланець перетнув моря і засвідчив свою повагу при дворі мого володаря. Щоб довести свою відданість, твій посланець приніс у дар озброєння твоєї країни.\n\nМій володар прийняв дари твого посланця — костюми, які колись носили іноземні солдати на Янцзи під час імперіалістичної війни. Ми вдячні за ці дари, але я запевняю тебе, що трон мого володаря не потребує такої данини.\n\nТвоєму посланцю буде дозволено повернутися у твої землі, але не надсилай іншого. Ніщо не повинно заважати справам мого володаря. Мій володар запевняє тебе, що з часом ти побачиш плоди його праці.\n\nЛінь Цзесю, від імені імператора Лаоху.§!"