l_english:
MOT_JAMES_HSU_NAME: "Джеймс Шу" # чит. shoo в англ.
MOT_JAMES_HSU_DESC: "Полковника Шу люблять солдати, а вищому командуванню він відомий як незрівнянний трудівник. Шу вміє керувати постачанням, виявляти шпигунів і переконувати бійців, що їх чують і про них дбають – це неабияк піднімає бойовий дух."

MOT_james_hsu_high_command: "Полковник Шу"
MOT_james_hsu_high_command_desc: "Полковника Шу люблять солдати, а вищому командуванню він відомий як незрівнянний трудівник. Шу вміє керувати постачанням, виявляти шпигунів і переконувати бійців, що їх чують і про них дбають – це неабияк піднімає бойовий дух."

MOT_MAJOR_DHATRI_NAME: "Майор Дхатрі"
MOT_major_dhatri_desc: "§4\"Коли ми зрозуміли, що там унизу були цивільні – жінки й діти – стрілянина вже почалася.\"§! \n\nПісля довгої та шанованої служби у званні капітана, Дхатрі отримав посаду майора й опікується щоденними справами табору МакКарран. Серед його обов’язків – координація дій проти залишків рейдерів і Біснуватих неподалік табору."

MOT_josh_hanlon_name: "Джош Генлон"
MOT_josh_hanlon_desc: "Начальник Генлон – найстаріший живий не-гуль серед рейнджерів, і роки досвіду говорять самі за себе. Він очолює корпус рейнджерів понад тридцять років, і чимало людей підтвердять його майстерність, витримку та хитрість. Він – живий символ рейнджерів НКР."

MOT_josh_hanlon_army_chief: "Начальник Генлон"
MOT_josh_hanlon_army_chief_desc: "Начальник Генлон – найстаріший живий не-гуль серед рейнджерів, і роки досвіду говорять самі за себе. Він очолює корпус рейнджерів понад тридцять років, і чимало людей підтвердять його майстерність, витримку та хитрість. Він – живий символ рейнджерів НКР."

MOT_ROBIN_GOROBETS_NAME: "Робін Горобець"
MOT_ROBIN_GOROBETS_DESC: "Лейтенант Горобець з дитинства знайомий зі снайперською справою – ще на фермі він почав тренуватися, щойно навчився ходити. Хоч має українське коріння, його виховання в Каліфорнії та служба в Мохаве зробили його гідним своєї посади. Високі вимоги, які він ставить до Першого розвідзагону, додають неабиякого стресу команді Альфа. А ситуацію погіршує те, що Біснуваті стали ще нахабнішими..."

MOT_general_lee_oliver_army_chief: "Генерал Олівер"
MOT_general_lee_oliver_army_chief_desc: "Як протеже Героя Мохаве, Олівер має чималий політичний вплив і престиж. Але його обережна тактика й надмірна опора на важку піхоту викликають занепокоєння серед багатьох офіцерів."

MOT_PAPPAS_NAME: "Капітан Паппас"
MOT_pappas_desc: "§4\"Як, до біса, брамін вирвався на Стріп?\"§! \n\nНаші солдати хочуть бувати в Нью-Вегасі. Ми їм цього не забороняємо, але маємо впевнитися, що це не зашкодить їхній бойовій здатності. Марі Паппас за цим стежить."

MOT_moore_name: "Полковниця Кассандра Мур"
MOT_moore_desc: "Мур не кліпає й не вагається; її інстинкти рейнджера зробили з неї ту, що б'є швидко, рішуче й безжально. Вона бачить загрози ще до того, як вони з’являться, і завчасно готує план бою."

MOT_moore_high_command: "Полковниця Кассандра Мур"
MOT_moore_high_command_desc: "Мур не кліпає й не вагається; її інстинкти рейнджера зробили з неї ту, що б'є швидко, рішуче й безжально. Вона бачить загрози ще до того, як вони з’являться, і завчасно готує план бою."

MOT_AUGUSTINE_PERRY_NAME: "Огастін Перрі"
MOT_augustine_perry_desc: "§4\"Слухай, уяви: глибока битва з роботами.\"§! \n\nПеррі не раз доводив, що має вражаючі знання з довоєнної історії, що сягає століть. Завдяки цьому ми можемо краще тренувати війська та підвищувати їхню боєздатність."

MOT_ASH_WINTERS_NAME: "Еш Вінтерс"
MOT_ash_winters_desc: "§4\"Уяви: якщо ми зосередимо вогонь під цим кутом...\"§! \n\nДехто вважає, що Еш Вінтерс надто зосереджений на теперішньому, а не на потенціалі. Та коли йдеться про зброю, піхоту та обмежену моторизацію, Вінтерс чітко знає, що робить у розробці тактики."

MOT_corporal_sterling_name: "Капрал Стерлінг"
MOT_corporal_sterling_desc: "§4\"Вони зі мною добре розважилися... покалічили руки й ноги. Після того з пістолетом не дуже був, і довгі розвідки по пустці теж закінчилися.\"§! \n\nРейнджер з блискучою службою, Гаррісон Стерлінг завершив польову кар’єру після полону Легіоном Цезаря. Але це не завадило йому вступити до Першого розвідзагону – і ми ще можемо скористатися його досвідом."

MOT_RAUL_TEJADA_NAME: "Рауль Техада"
MOT_raul_tejada_desc: "§4\"Я – відкрита книга, бос. Щоправда, іспанською, і кілька сторінок випало, але книга відкрита.\"§! \n\nДовоєнний гуль родом із Мехіко, Рауль радий, що він знову вільний, і охоче зайнявся ремонтом і технічним обслуговуванням. А ще, всюди, де він з'являється – зникають рейдери. Корисний збіг."

MOT_MAJOR_POLATI_NAME: "Майор Полатлі"
MOT_major_polati_desc: "§4\"Це не прогулянка, скажу тобі чесно. Мої солдати щодня помирають тут за НКР.\"§! \n\nТабір Покинута Надія – одне з найважчих місць у Території. Джозефа Полатлі обрали його очолити. Попри складність завдання, його вміння здобувати постачання означає, що наші виробничі лінії можуть працювати ефективніше."

MOT_major_knight_name: "Майор Найт"
MOT_major_knight_desc: "§4\"Караван, громадянин, паломник чи кур’єр?\"§! \n\nТимчасово перебуваючи на заставі в Мохаве, Стіві Найт спілкується майже з усіма, хто проходить повз – як військовими, так і цивільними. Добре й чесне перше враження часто має значення для наших відносин."

MOT_mike_lawson_name: "Майк Лоусон"
MOT_mike_lawson_desc: "§4\"Тобі потрібно більше, і я можу це дістати.\"§! \n\nЛоусон працював на кількох ливарнях, знаючи, як безпечно організувати перевезення ресурсів. Завдяки йому питання логістики менш болісне – ми можемо качати воду з озера Мід без постійного латання труб. Більше води означає більше їжі, і він постійно вказує на місця, де можна обійтися без зайвих схем."

MOT_warden_nathan_name: "Начальник Натан"
MOT_warden_nathan_desc: "§4\"Я маю змусити цих ув'язнених прокладати нові рейки та ремонтувати старі, але без наглядачів я цього не зроблю.\"§! \n\nКолишній адміністратор в'язниць у Габі, Натан Лопес був обраний керувати використанням ув’язнених у Території. Працюючи з виправного закладу НКР на схід від Ґудспрінґса, ми очікуємо, що він з часом приборкає злочинність у цьому регіоні."

MOT_elizabeth_kieran_name: "Елізабет Кіран"
MOT_elizabeth_kieran_desc: "§4\"Ось, візьми ще одну порцію для свого друга. Це буде нашим маленьким секретом.\"§! \n\nДобре знаючись на постачанні, Кіран ініціювала програму підтримки для громадян НКР у Території. Вона прагнула поширити її на всіх, але інцидент у Фрісайді показав, що це була погана ідея."

MOT_major_steyn_name: "Мер Стейн"
MOT_major_steyn_desc: "§4\"Ха! Вони повелися на ту оборудку. Хоча йшлося про Малого Джима, звісно. Великий Джим, спочивай з миром.\"§! \n\nКерівник громади в Ніптоні, мер Стейн – типовий приклад ватажка в Пустці: жадібний, достатньо хитрий, щоб скористатися моментом, і, здається, дбає про місто лише як про джерело прибутку. Втім, його підприємливість і здатність заробляти кришки дуже корисні, бо населення Території більше цінує цю валюту, ніж долари."

MOT_thomas_hildern_name: "Томас Гілдерн"
MOT_thomas_hildern_desc: "§4\"Ми ж урядова організація, зрештою. Майте трохи віри в нас!\"§! \n\nВідомий у НКР вчений, Гілдерн керує реалізацією низки дрібних проєктів, які можуть дати великий результат без потреби у шаленому фінансуванні. Контракти з незалежними виконавцями забезпечують, що будь-які провали не впливають на наші кадрові ресурси."

MOT_ignatio_rivas_name: "Ігнасіо Рівас"
MOT_ignatio_rivas_desc: "§4\"Ти творець війни чи миру?\"§! \n\nПослідовник Апокаліпсису, який діє в регіоні. Ми можемо співпрацювати з Рівасом для заспокоєння населення Мохаве через приховані програми допомоги. Поки що він прикидається, що ми не знаємо, хто він насправді, але на разі він нічого не шкодить на ГЕЛІОС Один."

MOT_julie_farkas_name: "Джулі Фаркас"
MOT_julie_farkas_desc: "Як адміністраторка осередку Послідовників у Нью-Вегасі, вона добре знає околиці Фрісайду, зокрема й інформацію про місцеву банду – Кінгів – та інші сумнівні справи. Попри те, що це не входить до її обов’язків як регіональної керівниці, Фаркас намагалась примирити поселенців НКР і мешканців Фрісайду, але успіху не мала."

MOT_FANTASTICUS_NAME: "Фантастікус"
MOT_FANTASTICUS_DESC: "§O\"Як я отримав цю роботу?\"\n\n\"Ну, коли ті вуха Легіону захопили станцію, НКР спитали мене, чи маю досвід у шпигунстві. Я сказав – приблизно стільки ж, як і будь-хто інший.\"\n\n\"От я й натягнув хокейну броню, облився кров’ю і пішов до тих Легіонерів. Вони спитали, чого я прийшов з боку НКР. Я відповів, що був у них під прикриттям близько року. Вони запитали, чи я Пікус. Я кажу: звісно, чувак. Тоді вони сказали, що їхній командир нещодавно загинув, а я – найвищий за рангом серед них, і спитали, чи маю досвід керівництва. Я відповів: мав досвід. Вони сказали – ласкаво просимо.\"§!"

MOT_handsome_man: "Красень"
MOT_boss: "Бос"

drummondorbaronschoice: "Драммонд або Великий Джим є головнокомандувачем армії НКР"
rangergeneral: "Генерал рейнджерів Моссман є головнокомандувачем армії НКР"