# Підказки
ncr_veg_treaty_of_new_vegas_tt:0 "Поки чинний §OДоговір про Нью-Вегас§!, між §YNCR§! і §YNew Vegas§! діє пакт про ненапад. В обмін на визнання суверенітету Стрипу, Вегас має надати нам військовий доступ навколо міста (окрім самого Стрипу). §RМи не можемо скасувати окремі умови договору.§!"

mot_review_bittersprings_tt: "Є відчуття, що Хани ще не сказали останнього слова..."