l_english:
# Ідеї
ncr_veg_treaty_of_new_vegas:0 "Договір про Нью-Вегас"
ncr_veg_treaty_of_new_vegas_desc:0 "Підписаний у 2274 році між §Y[NCR.GetNameWithFlag]§! і §Y[VEG.GetNameWithFlag]§! після переговорів, що послідували за виявленням майже неушкодженої §OГЕС Гувер§!, договір став першим із серії вимушених компромісів, на які довелося піти Республіці в спробі підготуватись до Бика. Хоча НКР отримала контроль над дамбою та військовий доступ до Вегасу, вона мусить передавати 5% енергії Стрипу й не перешкоджати доступу до нього для громадян і військових у відпустці."

mot_idea_support_from_shady_sands:0 "Підтримка зі Шейді-Сендс"
mot_idea_support_from_shady_sands_desc:0 "Наша кампанія залежить від сталого потоку солдатів, спорядження та фінансування з уряду Шейді-Сендс. Вони поки не збираються кидати нас, але якщо ми не покажемо результатів, їхній ентузіазм може згаснути."

mot_idea_support_from_shady_sands_oliver:0 "Найкращі та найсвітліші"
mot_idea_support_from_shady_sands_oliver_desc:0 "Під керівництвом генерала Олівера, Республіка підтримує експедицію в Мохаве, надсилаючи добре підготовлене підкріплення."

mot_idea_support_from_shady_sands_hanlon:0 "Оборона Мохаве"
mot_idea_support_from_shady_sands_hanlon_desc:0 "Хоча відставка Олівера спочатку шокувала Шейді-Сендс, його підтримка Хенлона допомогла зберегти довіру. Його захисна стратегія переконала багатьох у тому, що він – найкращий командир для цього фронту."

mot_idea_pacification_not_emancipation:0 "Покорення, не визволення"
mot_idea_pacification_not_emancipation_desc:0 "Кампанію в Мохаве часто називають \"§OПокоренням Мохаве§!\", і це не даремно. Наше завдання – усунути рейдерів, племена та загрози, які стоять на шляху Республіки. Якщо пощастить – допоможемо й місцевим, але безпека Республіки – передусім."

mot_idea_pacification_not_emancipation_2:0 "Покорення, не визволення"
mot_idea_pacification_not_emancipation_2_desc:0 "Кампанію в Мохаве часто називають \"§OПокоренням Мохаве§!\", і це не даремно..."

mot_idea_plan_the_offensive:0 "Планування операції"
mot_idea_plan_the_offensive_desc:0 "Час поєднати всі вектори наступу в єдиний план. Шейді-Сендс чекає на результат."

mot_khan_raiders:0 "Набіги Великих ханів"
mot_khan_raiders_desc:0 "Хани, що базуються поблизу Вегасу, продовжують нападати на наші землі та фабрики. Це потрібно зупинити."

mot_skimping_treaty:0 "Скорочення витрат на договір"
mot_skimping_treaty_desc:0 "Трішечки скоригувавши обсяги поставок енергії у Вегас, ми могли б зекономити чимало потужностей..."

mot_californian_resiliance:0 "Каліфорнійська стійкість"
mot_californian_resiliance_desc:0 "Ми не покладаємося на місцевих васалів. Лише твердість духу Нової Каліфорнії проведе нас крізь бурю."

mot_rollup:0 "Операція «Зачистка»"
mot_gangers_suck:0 "Порохові виродки"
mot_flexibility:0 "Гнучка тактика"
mot_supply_bonus:0 "Постачання Мохаве"
mot_victory_in_the_mojave:0 "Перемога в Мохаве"
mot_victory_in_the_mojave_desc:0 "Зрештою, безкінечна війна в пустелі завершилася. По всій [NCR.GetName] святкують перемогу – і вперше за довгий час усе справді добре."

ncr_takes_power:0 "Переадресована енергія"

