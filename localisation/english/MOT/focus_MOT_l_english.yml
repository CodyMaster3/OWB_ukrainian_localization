### Вільне Мохаве

mot_free_viva_new_vegas:0 "Viva, Нью-Вегас"
mot_free_viva_new_vegas_desc:0 "Заснування Вільної Держави доводить, що нам потрібні лише міцне серце й стальні нерви. Стоячи пліч-о-пліч, мешканці Мохаве самі вирішуватимуть свою долю — і, можливо, знову витягнуть щасливу сімку."

mot_free_crazy_arms:0 "Шалені руки"
mot_free_crazy_arms_desc:0 "Армія НКР колись захищала Мохаве, але тепер це вже не її любов. Ми не можемо покладатися на Рейнджерів або тих, хто залишився. Замість цього варто об’єднати дрібних підприємців і захисників Вегаса в ядро нашої армії."

mot_free_big_boots:0 "У великих черевиках"
mot_free_big_boots_desc:0 "Дехто з Рейнджерів пам’ятає, навіщо присягав захищати народ Пустки. Таких небагато, але навіть ті, хто носить великі черевики, колись носили маленькі — як і ти."

mot_free_your_cheating_heart:0 "Твоє зрадливе серце"
mot_free_your_cheating_heart_desc:0 "Родини Вегаса працювали з Хаусом, але союзниками вони ніколи не були. Може, їхня незгода змусить сльози падати, як дощ. Незважаючи на розбіжності, ми повинні триматись разом — або впасти порізно."

mot_free_youll_be_gone:0 "Твій кінець наближається"
mot_free_youll_be_gone_desc:0 "Залізна хватка родин над Вегасом — лиш тліюча іскра. Вони ніколи не дбали про це місто і ніколи не будуть. То чому ми маємо терпіти їх у Мохаве? Хай ця ніч стане пам’ятною — як ніч, коли ми остаточно звільнили Вегас."

mot_free_you_are_the_boss:0 "Тепер ти — головний"
mot_free_you_are_the_boss_desc:0 "Кажуть, Вегас — місто вільних, де кожен — король. Але врешті-решт хтось має ухвалювати важкі рішення. І ось, \nв розпал ночі,\nпід сяйвом місяця,\nдруже, ти — головний."

mot_free_handsome_man:0 "Брюнет із історії"
mot_free_handsome_man_desc:0 "Від початку часів, понад 3000 років,\nдобрі жінки ридали,\nчерез одного кароокого красеня.\n\nАле Вегас буде іншим. Тут не буде балакучих диктаторів чи тиранів. Бо ми — лише володарі власних сердець."

mot_free_troubled_water:0 "Міст над буремною водою"
mot_free_troubled_water_desc:0 "Коли ти занепав духом, коли блукаєш вулицею, коли вечір тисне на плечі — Мохаве подбає про своїх. Ми не дозволимо, щоби хтось жебракував на вулиці."

mot_free_dirty_feeling:0 "Брудне, брудне чуття"
mot_free_dirty_feeling_desc:0 "Хімічно зіпсовані Фієнди занадто довго загрожували Мохаве. Але хоч як би вправно вони не тікали — невдовзі спіткнуться. І тоді хай радіють, якщо ми просто приковуємо їх до стіни."

mot_free_jailhouse_rock:0 "Тюремний рок-н-рол"
mot_free_jailhouse_rock_desc:0 "Армія влаштувала вечірку в тюрмі Ніптона, і тамтешні Порохові Ґенґери завили. Бо серйозно — наскільки ж дратує тюрма, заповнена бандитами? Уявіть, що ми союзничаємо з рецидивістами, які щойно вирвались — і одразу повернулися до грабунку."

mot_free_peace_in_the_valley:0 "Мир у долині"
mot_free_peace_in_the_valley_desc:0 "Серед решток Братства є ті, хто хоче разом із Мохаве будувати краще майбутнє. Один писар навіть бажає воювати на нашому боці. Початок, можливо. Адже як писав сам Кінг: «і звірі з диких лісів освітлені будуть дитям»."

mot_free_anyplace_is_paradise:0 "Будь-де — рай"
mot_free_anyplace_is_paradise_desc:0 "Їдеш трасою чи блукаєш вулицею, танцюєш у темряві чи зависаєш на Топсах — усе стає раєм, якщо ми дбаємо одне про одного. Допоможи мені — і я допоможу тобі."

mot_free_everybody_come_abroad:0 "Квитки на борт!"
mot_free_everybody_come_abroad_desc:0 "Вегас, між іншим, ще відкритий для справ. Треба ж на щось жити — і ми забезпечимо, щоб люди теж могли. Великі казино сяють яскраво! Приєднуйтесь і танцюйте до світанку. За помірну плату, звісно."

mot_free_always_on_my_mind:0 "Ти завжди в моїх думках"
mot_free_always_on_my_mind_desc:0 "Калхун визнав, що, можливо, не завжди ставився до нас так добре, як слід. Було чимало дрібниць, які Республіка мала сказати й зробити, але ніколи не знаходила часу.\n\nМожливо, співпрацюючи з Калхуном, ми зможемо зцілити рани — з лідером, який перестане ставитись до нас як до другосортних."

mot_free_doin_the_best_i_can:0 "Я роблю все, що можу"
mot_free_doin_the_best_i_can_desc:0 "Калхун віддав серце, віддав життя, і був щирим. Але цього недостатньо проти ворогів Республіки. Якщо він хоче нашої допомоги, йому слід визнати: ми — друзі, а не піддані. Бо правління зі Шейді-Сендс не влаштовує мене. І тебе — теж."

mot_free_the_wonder_of_you:0 "Диво, яким є ти"
mot_free_the_wonder_of_you_desc:0 "Перемога Калхуна — це нова обіцянка майбутнього: Республіка, яка завжди поруч, щоб підставити плече. Він визнає, що вона не може правити Мохаве — але може стати його партнером. Тож об'єднаймося у всьому, що робимо."

mot_free_ready_teddy:0 "Битва при Єрихоні"
mot_free_ready_teddy_desc:0 "Доброго ранку, полковнице Мур. Доброго ранку, генерале Джоне. Ви можете вихвалятися людьми з Шейді-Сендс чи Флінна... Але ніхто не зрівняється з добрим старим Серхіо, що не припиняв справу — поки її не було завершено."

mot_free_clean_backyard:0 "Прибери спершу у себе"
mot_free_clean_backyard_desc:0 "НКР і Легіон вдають, що можуть нас захистити від рейдерів і работоргівців. Але кого вони дурять? Ми бачили, хто їхні сусіди. Займайтесь своїм, а ми своїм. Приберіть спершу у власному дворі."

mot_free_finder_keepers:0 "Хто знайшов — того і трофей"
mot_free_finder_keepers_desc:0 "Я не з тих, хто грає заради розваги — я граю лише на все. І залишаю собі все, що здобув. Бо ті, хто програв, мають заплатити рахунок."

mot_free_bitter_they_are:0 "Гірші, ніж були..."
mot_free_bitter_they_are_desc:0 "...дужче й падають. Легіон мав шанс — проти розділеного Мохаве. Але проти вільного Вегаса, де кожен знає, за що воює? Трибали не мають жодного шансу."

mot_free_harder_they_fall:0 "Виживає сильніший"
mot_free_harder_they_fall_desc:0 "Коли Легіон прийде, пам’ятайте: коли нависне біда, треба стояти твердо. Люди Вегаса, вставайте з колін. Ми битимемось на берегах Колорадо — за наші домівки й наших коханих."

mot_free_return_to_sender:0 "Повернути відправнику"
mot_free_return_to_sender_desc:0 "Ми не зможемо перемогти Легіон у ближньому бою. І не переможемо снайперів Мур. Але гарна новина: завдяки артилерії Бумерів, ми відповімо всім ворогам. Навіть тим, чия адреса нам ще невідома."

mot_free_my_way:0 "Мій шлях"
mot_free_my_way_desc:0 "Шкодую? Можливо, але надто мало, щоб про це згадувати. Я зробив, що мав зробити. Мохаве — вільний. Мохаве — безпечний. І вперше в історії Пустки — ми збудували край, де кожен — король."

mot_free_5_divs_tt:0 "§45 дивізій рейнджерів вирушать до Боуньярду, щоб допомогти Калхуну у боротьбі!§!"
mot_free_indep_tt:0 "§4Якщо Калхун хоче нашої допомоги — він має визнати незалежність Мохаве.§!"
mot_calhoun_tt:0 "§4Калхун передає нам повний контроль над землями Мохаве. Хороший хлопець!§!"
mot_mojave_tt:0 "§4\nОтримано постійне §G-50%§! зменшення вартості інтеграції всіх штатів §YMojave§!."
mot_ending_tt:0 "§4Іноді хороша кінцівка — це вже досконала нагорода.§!"

