l_english:
FOCUS_FILTER_MOT_SUNBURST: "Операція «Сонячний спалах»"

# Focuses
mot_preparing_the_expedition: "Підготовка експедиції"
mot_preparing_the_expedition_desc: "НКР уперше рушила на схід до Мохаве у 2271 році, знищивши племена навколо Бул-Сіті. Це — історія величі."

mot_the_battle_for_nipton: "Битва за Ніптон"
mot_the_battle_for_nipton_desc: "Рейдери та бандити Мохаве надто довго пручалися Республіці. Ніптон став місцем однієї з найзапекліших битв."

mot_capturing_the_dam: "Захоплення греблі"
mot_capturing_the_dam_desc: "Рейнджери намагались узяти греблю Гувера у 2274 році, але нам довелось мати справу з Хаузом. Поки що."

mot_the_coming_storm: "Насувається буря"
mot_the_coming_storm_desc: "Ми чули про нове плем’я зі сходу, під багряним стягом. Вони поклоняються людині на ім’я Цезар. Ми боїмось, що він прийде за Мохаве. Але наскільки небезпечними можуть бути дикі племена?"

mot_our_route_home: "Підготувати трасу Лонґ-15"
mot_our_route_home_desc: "Ми не можемо залишити наші шляхи постачання без охорони. Треба відновити довоєнну дорогу й забезпечити, щоб нас ніколи не відрізали."

mot_dealing_with_capitol_hill: "Вплинути на Капітолій"
mot_dealing_with_capitol_hill_desc: "Більшість у НКР підтримує нашу експедицію, але сенатор Олґуд та інші вважають її марною тратою життів і ресурсів. Маємо обережно діяти в тилу."

mot_deploy_the_fresh_battalions: "Сформувати нові дивізії"
mot_deploy_the_fresh_battalions_desc: "Нова Каліфорнія налічує понад 700 000 громадян. Цього вистачить, щоби підкорити Мохаве."

mot_guns_from_back_home: "Зброя з рідного краю"
mot_guns_from_back_home_desc: "Виробництво в Мохаве залишає бажати кращого. Брак озброєння доведеться компенсувати імпортом із Республіки."

mot_form_up_the_first_recon: "Створити 1-й батальйон розвідки"
mot_form_up_the_first_recon_desc: "Начальник Генлон завжди наголошував на важливості влучної стрільби. Ідея окремого снайперського батальйону довго не мала підтримки, але в умовах складної місцевості Мохаве вона цілком виправдана."

mot_survey_our_enemy: "Дослідити ворога"
mot_survey_our_enemy_desc: "Ми не можемо кидатися в бій із Братством Мохаве навмання. Лише точна розвідка й аналіз допоможуть нам завдати найсильнішого удару. Потрібно розширити мережу спостережних постів."

mot_melt_their_steel: "Зброя проти сталі"
mot_melt_their_steel_desc: "Силова броня — смертельна загроза для наших солдатів. Звичайний боєць не здатен пробити броню Паладина. Слід розгорнути зброю, здобуту в Наварро, принаймні для частини наших сил."

mot_strength_in_numbers: "Перевага в чисельності"
mot_strength_in_numbers_desc: "Ми маємо ключову перевагу над Братством — чисельність. Навіть якщо ми втратимо 8 на кожного з них, то все одно зможемо перемогти."

mot_secure_the_west: "Забезпечити захід"
mot_secure_the_west_desc: "Ґудспрінґс і дорога від застави Мохаве до Вегаса — критично важливі для торгівлі й перекидання військ. Ми не можемо дозволити Братству вдарити по нашій життєво важливій артерії."

mot_solidify_military_leadership: "Призначити військове керівництво"
mot_solidify_military_leadership_desc: "Перш ніж атакувати ГЕЛІОС Один, нам потрібно зміцнити командний склад. Без надійних офіцерів ми не зможемо перемогти."

mot_protect_route_95: "Захистити трасу 95"
mot_protect_route_95_desc: "Траса 95 — єдиний стабільний шлях для постачання між Мохаве, греблею та Боулдер-Сіті. Якщо її втратити — наші війська на півночі залишаться відрізаними. Це не можна допустити."

mot_promote_major_moore: "Підвищити майора Мур"
mot_promote_major_moore_desc: "Майор Кассандра Мур служила рейнджером ще з юності. Ветеранка війни з Братством, вижила у чотирьох кампаніях. Після поранення в Мохаве не може більше битися, але її гострий розум і стратегічне чуття — безцінні. Її варто зробити командиркою."

mot_make_our_final_preparations: "Останні приготування"
mot_make_our_final_preparations_desc: "Наша неминуча атака на Братство вже близько. Час завершити підготовку."

mot_the_second_turbine: "Відновити другий турбін"
mot_the_second_turbine_desc: "Гребля Гувера пошкоджена, але підлягає ремонту. Головний інженер Майк Лоусон упевнений: із часом та інвестиціями він зможе запустити додаткові турбіни."

mot_baker_militarisation_act: "Петиція про Закон про мілітаризацію"
mot_baker_militarisation_act_desc: "Хоча розширення армії не суперечить нашому мандату, заставу Мохаве формально вважають територією НКР. Треба звернутись до Конгресу з проханням ухвалити Закон про мілітаризацію, щоби розгорнути військову промисловість."

mot_divert_planners: "Перенаправити зусилля планування"
mot_divert_planners_desc: "Ми маємо зосередити значну частину нашого планування на майбутній війні. Це може коштувати нам успіху в боротьбі з рейдерами, але нехай так і буде."

mot_local_call_to_arms: "Місцевий заклик до зброї"
mot_local_call_to_arms_desc: "Лише з підтримкою місцевих ми зможемо перемогти Братство. Варто звернутися до їхнього патріотизму."

mot_operation_sunburst: "Випередити політичний тиск"
mot_operation_sunburst_desc: "Конгрес НКР уже кілька місяців чинить на нас тиск із вимогою почати наступ на Братство Мохаве. Ми маємо завдати удару першими й заскочити ворога зненацька."

mot_the_issue_of_the_locals: "На шляху до умиротворення"
mot_the_issue_of_the_locals_desc: "Спроби умиротворити території довкола Мохаве можуть тривати десятиліттями. Що ж, колись треба починати…"

mot_establish_camp_forlorn_hope: "Заснувати табір «Втрачена надія»"
mot_establish_camp_forlorn_hope_desc: "Джерела «Втрачена надія» — стратегічно важливе джерело чистої води, розташоване на узвишші в Мохаве. Встановивши невеликий військовий аванпост, ми зможемо контролювати воду й захистити ділянку траси 95."

mot_reinforce_camp_spotlight: "Укріпити табір «Серчлайт»"
mot_reinforce_camp_spotlight_desc: "Невдовзі після битви за Ніптон ми заснували табір «Серчлайт» на однойменному перехресті. Він надає нам перевагу в спостереженні за Ніптоном, Новаком і навіть Колорадо на сході. Розширення табору забезпечить контроль над регіоном."

mot_the_nipton_deal: "Угода з Ніптоном"
mot_the_nipton_deal_desc: "Ніптон майже не постраждав під час Великої війни, тож тут і досі живе чимала спільнота. Для нас вона занадто велика, аби тримати її в покорі виключно військовими методами. Угода з мером Ніптона про автономію в обмін на лояльність може забезпечити спокій."

mot_the_second_campaign: "Друга кампанія"
mot_the_second_campaign_desc: "У боротьбі за Мохаве ведуться дві війни. Перша — за окупацію. Друга — за утримання. Формально територія вже під нашим контролем, але до справжнього підпорядкування ще далеко. Комітет не має єдиної думки, як це вирішити."

mot_riches_of_the_mojave: "Скарби Мохаве"
mot_riches_of_the_mojave_desc: "Попри пустельний ландшафт, у Мохаве є свої скарби — потрібно лише знати, де шукати."

mot_the_i40: "Розчистити I-40"
mot_the_i40_desc: "Хоч основна кампанія зосереджена на півночі Мохаве та Вегасі, ми не маємо забувати про південну частину — між Бейкером і Нідлзом. Як і Лонґ-15, траса I-40 завалена довоєнними вантажівками. Якщо її розчистити, постачання до Нідлза стане значно ефективнішим."

mot_been_working_on_the_railway: "Я працював на залізниці"
mot_been_working_on_the_railway_desc: "Мрією генерала Олівера давно була залізниця між Шейді-Сендс і Вегасом. Це був би ідеологічний прорив і дозволив би стрімко перекидати війська. Лінія до Бейкера через Лонґ-15 — легка частина. А от через сам Мохаве — вже інша справа…"

mot_cottonwood_port: "Розширити порт у Коттонвуді"
mot_cottonwood_port_desc: "Хоча Лонґ-15 — наш основний шлях постачання, ми можемо налагодити додаткові рейси вгору Колорадо від південних форпостів. Це не ідеально, але стане в пригоді у надзвичайній ситуації."

mot_garrison_primm: "Охороняти Прімм"
mot_garrison_primm_desc: "Довоєнне міні-Вегас, Прімм переживає відродження з приходом НКР. Містечко — ключова ланка на шляху до Вегаса. Якщо Ніптон упаде, Прімм може стати опорним пунктом."

mot_bittersprings: "Похід на Біттерспрінґс"
mot_bittersprings_desc: "Роки поспіль племінні рейдери, які звуть себе «Великими Кханами», загрожували нам зі сходу. Їхній табір у Біттерспрінґсі, як вони вважають, недосяжний. Час розвіяти їхні ілюзії."
mot_bittersprings_march_tt: "§gНашим солдатам знадобиться кілька днів, щоби пройти околицями Вегаса до Біттерспрінґса. Ми отримаємо звістку, щойно вони почнуть наступ.§!"

mot_act_now: "Діймо зараз — або змовчімо навіки"
mot_act_now_desc: "Зіткнення на греблі Гувера сколихнуло нас. Ми не знаємо, скільки ще зможемо утримувати Мохаве. Треба якнайшвидше видобути всі доступні ресурси — поки ще не пізно."

mot_the_bulls_soft_bellow: "Наростаюче ревіння Бика"
mot_the_bulls_soft_bellow_desc: "Легіон росте, мов пухлина, зі сходу. Ми маємо бути готові."

mot_assemble_the_mojave_defence_committee: "Скликати оборонний комітет Мохаве"
mot_assemble_the_mojave_defence_committee_desc: "Мохаве — принаймні його населення та стратегічні центри — тепер майже повністю під нашим контролем. Настав час подумати, як його втримати. Навколо нас — вороги, а в наших лавах немає єдності щодо того, як краще готуватись до майбутніх битв."

mot_the_old_world_wall: "Стіна Старого Світу"
mot_the_old_world_wall_desc: "Стіна Старого Світу — гребля Гувера. Століттями вона символізувала американську інженерну майстерність і живила енергією цілі покоління. Проте має критичний недолік — її майже неможливо захистити. Архітекторам можна пробачити, що вони не передбачили битву просто на бетоні греблі, але для Оборонного комітету це стало серйозною проблемою. Потрібні рішення."

mot_emergency_ctte_divide: "Надзвичайний комітет: Великий Розлом"
mot_emergency_ctte_divide_desc: "Якщо щось трапиться в Розломі й порушить наші шляхи постачання, нам доведеться терміново скликати комітет і ухвалити нову стратегію."

mot_emergency_ctte_vegas: "Надзвичайний комітет: Падіння Вегаса"
mot_emergency_ctte_vegas_desc: "Якщо Нью-Вегас упаде до рук тих, хто не визнає Договору з Вегасом, комітет має негайно зібратись, аби вирішити, як реагувати."

mot_revisiting_the_treaty: "Переглянути Договір з Вегасом"
mot_revisiting_the_treaty_desc: "Договір із Вегасом передбачає передачу 95% енергії з греблі Гувера НКР та доступ до більшості районів міста для солдатів Республіки. Але це був вимушений компроміс із державою, яку НКР радше приєднала б повністю. На жаль, роки миру лише посилили владу Містера Хауза, тоді як ми загрузли в пустелі. Якщо ми хочемо правити Мохаве, нам потрібен план."

mot_call_up_second_draft: "Оголосити другу мобілізацію"
mot_call_up_second_draft_desc: "Якими б не були переваги Містера Хауза в сек'юритронах, НКР компенсує це якісними солдатами. Ми маємо закликати другу хвилю мобілізації. З удачею, частина новобранців прибуде й до нас."

mot_family_diplomacy: "Дипломатія з родинами"
mot_family_diplomacy_desc: "Розділяй і володарюй — так любить казати той скажений диктатор з-за Колорадо. Якщо ми зможемо домовитись із деякими родинами Вегаса, то, можливо, послабимо владу Містера Хауза над містом."

mot_an_encouraging_victory: "Обнадійлива перемога"
mot_an_encouraging_victory_desc: "Поразка пихатого Братства в Мохаве значно покращила нашу репутацію як серед населення НКР, так і в Шейді-Сендс. Не варто марнувати нагоду здобути більше постачання."

mot_lessons_from_the_war: "Уроки війни"
mot_lessons_from_the_war_desc: "Попри перемогу над Братством Мохаве, війна в рамках операції «Сонячний спалах» виявила чимало недоліків нашої армії. Якщо ми хочемо вижити, нам доведеться адаптуватися."

mot_tools_left_behind: "Використати залишені інструменти"
mot_tools_left_behind_desc: "Здається, Братство щось лагодило в ГЕЛІОСі Один, імовірно — намагалось відновити його сонячні генератори. Наш штурм застав їх посеред роботи. Тепер у комплексі залишилось чимало довоєнних інструментів — інженери на греблі Гувера будуть у захваті."

mot_the_heavy_corps: "Створити важкий корпус"
mot_the_heavy_corps_desc: "Завдяки базовим знанням про силову броню ми можемо модифікувати захоплені екземпляри з операції «Сонячний спалах» і навчити бійців працювати в них. Такі війська будуть незамінними проти диких ворогів."

mot_restoring_hoover: "Відновити греблю Гувера"
mot_restoring_hoover_desc: "Гребля вже давно працює лише на частину потужності. Якщо серйозно взятися за ремонт, ми зможемо значно наростити виробництво енергії."

mot_horrors_in_vault_3: "Жахи в Сховищі 3"
mot_horrors_in_vault_3_desc: "Хоча ми контролюємо більшу частину Мохаве, одне місце досі залишається ворожим — Сховище 3. Там засіли «Ізверги», жорстоке рейдерське угруповання. Щоб остаточно очистити пустку від них, нам потрібна чітка стратегія."

mot_consiglieres_diplomacy: "Дипломатія з консільєрі"
mot_consiglieres_diplomacy_desc: "Хоча «Ізверги» колись були однією з засновницьких родин Вегаса, теперішні жителі Сховища 3 — лише зграя деградованих виродків. Якщо ми домовимось із Містером Хаузом і консільєрі, то зможемо ізолювати їх у Сховищі, уникаючи прямої війни. Щоправда, околиці й далі страждатимуть від їхніх нападів."

mot_pushing_them_back: "Відтіснити покидьків"
mot_pushing_them_back_desc: "Ми повинні вибити «Ізвергів» з ключових позицій на північному заході Мохаве. Можливо, нам і не вдасться взяти Сховище 3, але ми принаймні зможемо загнати їх назад у нього."

mot_victory_at_the_dam: "Перемога на греблі"
mot_victory_at_the_dam_desc: "Нам вдалося відбити наступ Легіону Цезаря на греблю Гувера та Боулдер-Сіті. Було негарно, і нам більше пощастило, ніж хочеться визнавати, але це все ж перемога."

mot_the_long_march_home: "Довгий шлях додому"
mot_the_long_march_home_desc: "Попри всі зусилля наших генералів і відвагу солдатів, гребля впала під натиском Легіону. Тепер нам належить відступити додому й ухвалити важкі рішення щодо майбутнього."

mot_supply_and_demand: "Попит і пропозиція"
mot_supply_and_demand_desc: "Мохаве — великий і безлюдний. Щоб втримати його, нам потрібна мережа військових баз, що перетинають регіон. Кожна з них потребує постійного постачання та підкріплення. Наразі в нас вистачає запасів на чинні бази, але подальше розширення чи ворожі диверсії можуть порушити цей баланс."

mot_first_supply_shipment: "Перше постачання"
mot_first_supply_shipment_desc: "Перший вантаж прибув по новій гілці з Бейкера до застави Мохаве. Постачання з Шейді-Сендс повинне деякий час забезпечувати наші потреби."

mot_open_the_divide: "Відкрити Розлом"
mot_open_the_divide_desc: "Розлом — альтернативний шлях до логістичних вузлів НКР. Тепер, коли його контролюють наші союзники, ми можемо значно збільшити обсяги постачання."

mot_review_bittersprings: "Переглянути різанину в Біттерспрінґс"
mot_review_bittersprings_desc: "Багато офіцерів хотіли приховати деталі різанини в Біттерспрінґс, але після нападу на табір Ханів політика мовчання почала тріщати. Ми повинні переглянути становище Великих Ханів у Мохаве й ухвалити рішення щодо їхніх залишків."

mot_the_mojave_line: "Залізниця Мохаве"
mot_the_mojave_line_desc: "Давня мрія сенату НКР — прокласти залізницю, що з'єднає серце Республіки з Нью-Вегасом. Залізниця дозволить як оперативно перекидати війська, так і пожвавити торгівлю з Вегасом."
mot_the_mojave_line_tt: "Починається будівництво залізниці, що з'єднає Лонґ-15 з Нью-Вегасом. Для праці залучають ув'язнених з виправної колонії НКР. Що може піти не так?\n\n"

mot_reinforce_forlorn_hope: "Посилити табір 'Втрачені надії'"
mot_reinforce_forlorn_hope_desc: "Попри похмуру назву, табір 'Втрачені надії' є ключовим форпостом та спостережним пунктом у протистоянні Легіону. Якщо він впаде, наші сили будуть розділені вздовж маршруту 95. Якщо дозволяють запаси, варто укріпити оборону табору."

mot_reinforce_searchlight: "Посилити табір 'Прожектор'"
mot_reinforce_searchlight_desc: "Табір у Сьорчлайті розташований у стратегічно важливому місці, неподалік від річки Колорадо. Хоча ми очікуємо основного удару Легіону через греблю Гувера, є ймовірність атаки на південному фланзі — і ми мусимо бути готові."

mot_camp_maccaren_primacy: "Пріоритет табору МакКарран"
mot_camp_maccaren_primacy_desc: "Хоча нашим офіційним штабом вважався застав Мохаве, саме табір МакКарран став справжнім логістичним і командним центром у північній частині пустелі. Час формалізувати його статус."

mot_live_and_let_live: "Жити й давати жити"
mot_live_and_let_live_desc: "У нас просто немає ні часу, ні ресурсів, щоб зараз розбиратись із 'Пороховими гангстерами' та їхньою втечею з виправної колонії. Люди потрібні в інших місцях."
mot_liv_and_let_live_tt: "Під час війни §Y'Порохові гангстери'§! шкодитимуть нашим лініям постачання. Але поки що це прийнятний ризик, так?"

mot_operation_rollup: "Операція 'Зачистка'"
mot_operation_rollup_desc: "П'ята колона у нас за спиною — це загроза, яку ми не можемо ігнорувати. Ми не можемо дозволити 'Пороховим гангстерам' безкарно тероризувати захід Мохаве. Ґудспрінґс і Прімм мають бути повернені під наш контроль."

mot_ranger_stations_on_i40: "Постійні станції рейнджерів уздовж I-40"
mot_ranger_stations_on_i40_desc: "Автотраса I-40 має ключове значення для передислокації наших сил у разі нападу. Ми створимо низку блокпостів рейнджерів, аби убезпечити її від раптових атак Легіону."

mot_integration_of_primm: "Інтегрувати Прімм"
mot_integration_of_primm_desc: "Прімм довго залишався поза нашою юрисдикцією. Брак людей та інтересу з боку уряду завадив його приєднанню. Якщо встановити в місті шерифа з НКР, скориставшись безладом після втечі гангстерів, ми зможемо нарешті інтегрувати його."

mot_liberate_goodsprings: "Звільнити Ґудспрінґс"
mot_liberate_goodsprings_desc: "Однією з перших цілей Порохових гангстерів став Ґудспрінґс — процвітаюче торгівельне містечко на західному шляху до Нью-Вегаса. Під гнітом дрібних ватажків гангстерів місто постраждало — і його мешканці точно будуть вдячні за безпеку та порядок під крилом НКР."

mot_clean_out_nipton: "Навести лад у Ніптоні"
mot_clean_out_nipton_desc: "У перші роки кампанії в Мохаве Ніптону було надано обмежену автономію через його незначне розташування. Але з часом він став кублом злочинності, контрабанди й проституції. Ми повинні встановити порядок, якщо хочемо контролювати цей регіон."

mot_appoint_ambassador_crocker: "Призначити посла Крокера"
mot_appoint_ambassador_crocker_desc: "Після відставки посла Едіт з посади Надзвичайного та Повноважного Посла НКР у Нью-Вегасі, потрібно знайти заміну. Під тиском з Шейді-Сендс, схоже, маємо лише одного кандидата — Денніса Крокера. Політик із кар’єрою, він вів кампанію Кімбола в Раду НКР. Як мінімум, він компетентний дипломат."

mot_an_offer: "Пропозиція..."
mot_an_offer_desc: "Ми можемо зробити пропозицію Бенні співпрацювати, за відповідну ціну. Авжеж він не зрадить нас і не опиниться на хресті Легіону, правда ж?"
mot_an_offer_tt: "Якщо Бенні не при владі, він влаштує переворот за нашої підтримки у війні проти Нью-Вегаса. Якщо ж він при владі — ми зможемо домовитись."

mot_we_can_refuse: "...Ми можемо відмовити"
mot_we_can_refuse_desc: "Бенні не здається нам надійним партнером. Можливо, краще звернутись до інших і залишити все на рівні бізнесу."

mot_mp_deployments: "Розгорнути військову поліцію"
mot_mp_deployments_desc: "Репутація НКР постійно страждає через пияцтво, бійки та марнотратство солдатів на Стріпі у Вегасі. Ми не можемо заборонити їм тратитись на алкоголь і наркотики, але принаймні можемо контролювати найгірші прояви. До того ж, лише військова поліція має право носити зброю на Стріпі — це може знадобитись, якщо пан Гаус стане надто зухвалим."

mot_the_great_debate: "Велика суперечка"
mot_the_great_debate_desc: "Після битви за греблю Гувера Комітет оборони Мохаве веде безкінечні дебати щодо стратегії. І Олівер, і Генлон мають і прихильників, і критиків. Напруга в комітеті зростає, і лише один із цих двох зможе повести експедицію далі."

mot_promote_chief_hanlon: "Відставка генерала Олівера"
mot_promote_chief_hanlon_desc: "Комітет оборони Мохаве ухвалив своє рішення — більшість підтримала Генлона. Олівер подав у відставку з посади генерала Експедиції, рекомендувавши на це місце Генлона. На прохання Генлона, Олівер залишиться польовим маршалом у регіоні."

mot_cement_olivers_authority: "Закріпити владу Олівера"
mot_cement_olivers_authority_desc: "Попри потенційний виклик з боку Генлона, генерал Олівер зберіг довіру Комітету оборони Мохаве. Підтримка його пропозицій на нещодавніх засіданнях зміцнила його авторитет, тож він і надалі керуватиме експедицією."

mot_a_shared_vision: "Спільне бачення"
mot_a_shared_vision_desc: "Попри відмінності у тактиці, Генлон і Олівер мають схожі стратегічні цілі щодо Мохаве, особливо у питаннях протистояння Легіону за межами греблі. Разом вони — потужна стратегічна пара."

mot_baja_redeployments: "Перегрупування з Нижньої Каліфорнії"
mot_baja_redeployments_desc: "Півострів Баґа став одним із найкривавіших фронтів для НКР. Ветерани, які вижили в суворих умовах і партизанській війні, саме ті, хто потрібен експедиції в Мохаве."
mot_baja_redeployments_tt: "До нас приєднаються два §Yелітних рейнджери§! з кампанії у Баґа."

mot_trouble_from_under_black_mount: "Неприємності з-під Чорної гори"
mot_trouble_from_under_black_mount_desc: "З Чорної гори роками лунає дивне, спотворене радіосигналом. Ми списували це на дурня з антеною — поки наші патрулі не почали зникати. Пора надіслати підрозділ і дізнатись, що там насправді."

mot_operational_flexibility: "Оперативна гнучкість"
mot_operational_flexibility_desc: "Щоб перемогти Легіон на полі бою, ми маємо адаптувати наші плани до будь-яких умов."

mot_staring_the_bear_in_the_mouth: "Погляд ведмедю в пащу"
mot_staring_the_bear_in_the_mouth_desc: "Місяцями Легіон зосереджує сили поблизу колишньої метеостанції — за греблею Гувера. Ми знаємо, що напад ось-ось станеться. А підготуватись ще чимало..."

mot_operational_security: "Оперативна безпека"
mot_operational_security_desc: "Щоб перемогти Легіон на полі бою, ми маємо захистити наші плани та задумки від ворожих очей. На жаль, це може означати усунення деяких улюблених командирів..."

mot_the_hardpoint_gambit: "Гамбіт на опорних точках"
mot_the_hardpoint_gambit_desc: "Завершальний етап плану Генлона — Військова стратегія «Бастіон» — полягає в покиданні західного та центрального Мохаве на користь місцевих поселень. Це різко зменшує наш контроль над регіоном і може відродити рейдерську загрозу. Але водночас дозволяє зосередити сили на кордоні з Легіоном. Ризиковано, проте можливо виправдано."
mot_the_hardpoint_gambit_tt: "Ми запропонуємо Ґудспрінґс та, якщо володіємо, Сховище 3 Нью-Вегасу в обмін на допомогу."

mot_hoover_must_not_fall: "Гувер не має впасти"
mot_hoover_must_not_fall_desc: "Основний удар Легіону неминуче прийдеться на греблю Гувера. Наше військове завдання просте: втримати греблю будь-якою ціною. Підкріплення з НКР обов’язково прибуде — головне дожити до того моменту."

mot_caesar_delenda_est: "Caesar Delenda Est"
mot_caesar_delenda_est_desc: "Caesar Delenda Est — Цезар має бути знищений. Ми не можемо постійно жити в очікуванні нового нападу. Якщо треба — самі підемо в наступ."

mot_operation_bastion: "Військовий план «Бастіон»"
mot_operation_bastion_desc: "Генерал Генлон добре знає правду про Мохавську експедицію: попри підтримку Шейді-Сендс, ми маємо надто мало людей, щоб утримати весь цей піщаний край. Замість цього він пропонує сміливу нову стратегію — план «Бастіон»."

mot_skim_settlement_supply: "Забрати частину поселеньського постачання"
mot_skim_settlement_supply_desc: "Попри нестачу спорядження, певна частина провізії надходить до Мохаве — начебто для розвитку поселень і боротьби з бідністю. Але яке це має значення, якщо НКР тут не виживе? Відщипнути трохи для армії — лише благо..."

mot_disobey_baker_decree: "Ігнорувати декрет про Бейкер"
mot_disobey_baker_decree_desc: "Наш 'лізинг' Мохавського форпосту завжди був вимушеним. Але наші невдачі спричинили втрату довіри з боку Сенату НКР, який вимагає посилення федерального контролю. Ми не можемо цього допустити — це ускладнить ведення війни."

mot_ncrs_finest: "Найкращі з НКР"
mot_ncrs_finest_desc: "Тільки завдяки хоробрим чоловікам і жінкам НКР ми зможемо витримати випробування, що наближаються. Людські ресурси й підготовка — ось що вирішує."

mot_demilitarisation_of_baker: "Демілітаризація форпосту в Бейкері"
mot_demilitarisation_of_baker_desc: "Наш лізинг Бейкеру з часом став радше адміністративною формальністю. Усе більше завдань передається до Кемп-Маккарена. Тож Сенат НКР вимагає офіційного повернення поселення в пряме підпорядкування. Це невелика ціна за довіру."

mot_a_secret_most_profound: "Глибока таємниця"
mot_a_secret_most_profound_desc: "У армії Гауса чогось бракує. Ми не знаємо, чого саме, але він ладен піти на все, аби це здобути. Якщо він отримає це — загроза для нас лише зросте. Ми повинні зупинити його."

mot_more_than_two_at_the_table: "Більше, ніж двоє за столом"
mot_more_than_two_at_the_table_desc: "Ми недооцінили міць Нью-Вегаса. Якщо не будемо обережні — можемо опинитись у війні на два фронти: проти Гауса і Легіону одночасно. В нас немає ресурсів на таку розкіш. Але планувати варто вже зараз..."

mot_benny_prick_tt: "\nМи намагатимемось переконати Бенні, що в Республіці є місце для підприємливих людей. А в Легіону — хіба що місце на хресті у черговій кривавій сцені."

mot_hoover_fob: "Передовий командний пункт Гувера"
mot_hoover_fob_desc: "Гребля Гувера — наш головний стратегічний об’єкт у Мохаве. Якщо ми перетворимо частину туристичного центру на оперативний штаб, зможемо значно ефективніше керувати боєм. Хоча кого ми дуримо — бій там буде гарантовано."

mot_horror_of_vault_three: "Жахи Сховища Три"
mot_horror_of_vault_three_desc: "Сховище Три, колись заселене жителями сховищ, давно захоплене Божевільними у кривавій бійні. Це бастіон Мотор-Раннера, і його обдовбані послідовники постійно нападають на Кемп-Маккарен і наші патрулі, паралельно підсаджуючи громадян НКР на всілякий непотріб. Ми не можемо більше тримати оборону — час діяти. Друга фронтова війна в Мохаве для нас — самогубство."

mot_merits_of_diplomacy: "Переваги дипломатії"
mot_merits_of_diplomacy_desc: "Не всі проблеми вирішуються багнетом. Особливо ті, за якими стоїть артилерія чи шестифутові сталеві двері."

mot_on_our_own: "НКР проти всіх"
mot_on_our_own_desc: "У Мохаве нам нема на кого покластись. Ні на порохових фанатиків, ні на технофетишистів. Ми повинні навчитись виживати самостійно."

mot_brotherhood_diplomacy: "Домовитись із залишками Братства"
mot_brotherhood_diplomacy_desc: "Ми давно підозрювали, що після Операції 'Сонячний спалах' хтось із Братства вцілів. Але не очікували, що така значна частина глави зможе сховатися в підземних бункерах Прихованої долини. З деяким переконанням, вони можуть стати нашими союзниками проти Легіону. А їхня силова броня — у пригоді."

mot_the_boomers: "Добре, бумери"
mot_the_boomers_desc: "Серед ізольованих фракцій Мохаве найвідлюдькуватішими є Бумери. Оселившись на базі ВПС Нелліс, вони володіють великою кількістю довоєнних технологій — від артилерії до цілого бомбардувальника. Якщо нам вдасться встановити контакт, вони можуть стати ключовими союзниками в обороні дамби Гувера."

mot_make_vegas_see_sense: "Привести Вегас до тями"
mot_make_vegas_see_sense_desc: "Попри підозри у змові Гауса проти нас, ми теж не сиділи склавши руки. Заручившись підтримкою Братства та Бумерів, ми можемо виступити з ультиматумом: або добровільна окупація, або наслідки."

mot_a_new_dawn: "Новий світанок"
mot_a_new_dawn_desc: "Після всієї крові, насильства й болю, яких ми зазнали, над Мохаве сходить новий світанок. Війна не змінюється. Але, можливо, змінитись можемо ми."

mot_petition_nearby_chapters: "Організувати Послідовників"
mot_petition_nearby_chapters_desc: "Послідовники Апокаліпсису мають осередки майже всюди. Через свою анархічну структуру вони діють розпорошено, що ускладнює досягнення спільної мети. Якщо ми зможемо об’єднати осередки Мохаве — наші постачання значно покращаться."

#### Цивільна війна — Олівер ####

mot_oliv_emergency: "Оголосити надзвичайний стан"
mot_oliv_emergency_desc: "Уперше в історії НКР зазнала політичного глухого кута. Що це означає для нас, Територій Мохаве? Якщо моя промова вдасться — це може бути початком нової ери Республіки."

mot_oliv_no_wait_see: "Немає часу чекати"
mot_oliv_no_wait_see_desc: "Мене висміювали як 'Генерала Побачимо-Пізніше', навіть мої солдати жартували з цього. Але з падінням НКР я маю змінитись — або стану жертвою власної самовпевненості."

mot_oliv_pull_vegas_troops: "Вивести війська з Вегаса"
mot_oliv_pull_vegas_troops_desc: "Ми потребуємо кожного бійця. Зникнення уряду НКР означає, що Гаус може напасти будь-якої миті. Я подзвоню капітану Паппасу. Якщо хтось і вирішить, що робити — це буду я."

mot_oliv_hoover_will_never_fall: "Гувер ніколи не впаде"
mot_oliv_hoover_will_never_fall_desc: "Ми засиділись у Бейкері. Це руїна довоєнної Америки, яку ми ледве тримаємо. Гребля Гувера ж — стратегічна фортеця. Там гине не більше десятка людей на рік. Ідеальне місце для оборони. Час зробити її нашою столицею до відновлення Шейді-Сендс."

mot_oliv_pardon_powder_gangers: "Помилувати Порохових"
mot_oliv_pardon_powder_gangers_desc: "Начальник тюрми Натан добре тримав ситуацію під контролем. Але нам бракує людей і ресурсів. А Порохові будували залізницю до самого Кістяка. Можливо, варто запропонувати їм амністію в обмін на допомогу?"

mot_oliv_bear_armor: "Броня Ведмедя"
mot_oliv_bear_armor_desc: "Братство вважає, що лише воно має право на силову броню. Анклав довів протилежне. Вони вважають, що лише треновані обрані здатні нею користуватись. Ми зламали цей міф. Я доведу всім, що ми володіємо Силою. Силою Силової Броні!"

mot_oliv_rival_paladins: "Рівні паладинам"
mot_oliv_rival_paladins_desc: "У нас найкраща силова броня на Західному узбережжі — можливо, в усьому світі! У Легіону — спідниці, Божевільні бігають голяка, а Братство відправляє своїх паладинів у Т-45 і Т-51. Нам не потрібні модельні номери. У нас — Броня Ведмедя!"

mot_olvi_full_speed: "На повній швидкості"
mot_olvi_full_speed_desc: "Можливо, варто було менше вихвалятися нашою силовою бронею, але великі генерали не помиляються — вони просто злегка помиляються в оцінках. Наступне моє рішення — подвоїти темпи виробництва броні. Вона не буде красивою чи ідеальною, але згодиться." #Швидше виробництво зниженої якості

mot_oliv_wait_and_see: "Може, трохи зачекати?"
mot_oliv_wait_and_see_desc: "Та пішли всі ті, хто називав мене 'Генералом Побачимо-Пізніше'! Що поганого в обережності й передбачливості, якщо це рятує життя? Зменшимо виробництво, зате створимо найкращу броню на цьому боці Колорадо!" #Менше, але якісніше

mot_oliv_arrest_hanlon: "Герой Мохаве"
mot_oliv_arrest_hanlon_desc: "Рейнджер-начальник Генлон. Надто довго він був мені як кістка в горлі. Колись я мав би спокій, бо знав, що моя позиція в безпеці. Але тепер усі нахвалюють його — не мене, а його! Час з цим покінчити." #Арешт Генлона

mot_oliv_frontier_democracy: "Прикордонна демократія"
mot_oliv_frontier_democracy_desc: "Ми не можемо залишатись просто Територіями Мохаве. Потрібно відновити демократичне керівництво, провести вибори. Ми хоч і на фронтирі, але не повинні стати синонімом дикості й варварства."

mot_the_golden_opportunity: "Золота нагода"
mot_the_golden_opportunity_desc: "Я повертаюсь до Каліфорнії — і бачу руїни. Мур відкинула моє керівництво й створює власну викривлену версію НКР. А фанатик Калгун із Послідовників намагається запровадити 'рівність' та комуністичні ідеї серед простого люду. Подивимось, як їм це вдасться... з-за ґрат." #Олівер оголошує війну Мур і Калгуну

mot_oliv_the_saviour: "Рятівник Каліфорнії"
mot_oliv_the_saviour_desc: "Я це зробив. Я знову об'єднав усю Каліфорнію. Якби Кімбол ще був живий, я б прямо зараз оголосив його Президентом. Але його немає. Тож доведеться мені зайняти це місце."

mot_oliv_kimball_memorial: "Пішов, але не забутий"
mot_oliv_kimball_memorial_desc: "Аарон Кімбол, убитий у терористичному нападі у 45 років. Що ще можна сказати про цю людину, чого ще не сказано? Хіба що: 'Я будую йому музей.' Дехто вже бурчить про 'Центр Танді' чи про марнотратство. Але я ж іще не запроваджував жодного податку, з чого вони взяли? А, так. Мир його душі, друже."

### Цивільна війна Генлона ###

mot_han_mojave_standoff: "Протистояння в Мохаве"
mot_han_mojave_standoff_desc: "Олівер надто довго вдає з себе героя. Ми тут не для того, щоб реформувати НКР, а щоб виконати її волю. Та без НКР чию волю ми виконуємо? Його власні марення? Пора покласти край цьому божевіллю."

mot_han_heartaches_by_the_numbers: "Смуток у цифрах"
mot_han_heartaches_by_the_numbers_desc: "Олівера нема. І НКР нема. Але це не значить, що ідея демократичної Каліфорнії мертва. Чув я про Мур, що вже називає себе 'Президент-Генералом', і про старого Білла Калгуна, що несе свою правду. Питання в тому — обрати стабільність Мур, чи анархію Калгуна?"

mot_han_where_the_heart_knows: "Туди, куди веде серце..."
mot_han_where_the_heart_knows_desc: "Я не можу зрадити серця й душі своїх людей — чи себе — заради тимчасової стабільності під владою тирана. Я зв'язався з Біллом. Ми з людьми підтримаємо його в усьому, чим зможемо."

mot_han_follower_assistance: "Допомога Послідовників"
mot_han_follower_assistance_desc: "Білл — правильний вибір. Медики з Університету Послідовників у Кістяку прибули з людьми, припасами й знаннями. Вони допомагають не тільки нашим солдатам, а й тим, кого ми самі вже списали. Кращого союзника й не побажаєш."

mot_han_radio: "Радіостанція Чорної Гори"
mot_han_radio_desc: "Колись я фальсифікував рейнджерські звіти, використовуючи маячню з 'Чорної Гори'. Але Білл хоче, щоб ми подали руку допомоги цим мутантам — каже, ми можемо вилікувати їх. Мені, м’яко кажучи, незручно, але... можливо, ця радіоведуча просто більше гавкає, ніж кусає."

mot_han_good_fight: "Добра боротьба"
mot_han_good_fight_desc: "Калгун практично об'єднав Каліфорнію під прапором Послідовників. Люди задоволені, молодь навчається новому, а підтримка війни на найнижчому рівні за весь час — бо Послідовники змінили саму суть того, як бачать війну. Гадаю, підтримати Білла, а не ту істеричку Мур, — було моїм найкращим рішенням за весь час у Мохаве."

mot_han_legion_will_come: "Легіон прийде"
mot_han_legion_will_come_desc: "Попри все добре, що зробили Послідовники, Білл не забув про Цезаря. Я, може, й відбив його на Дамбі, але Білл готовий забути про ідеали Послідовників, аби лишень зупинити усі ті жахи, що Цезар вчинив за останні 30 років. Пора до роботи."

mot_han_against_all_tyrants: "Проти всіх тиранів"
mot_han_against_all_tyrants_desc: "Цезар ще десь там, але одного деспота ми вже прибрали. Мур більше нема — і, чесно кажучи, я радий, що вона не тероризує нас чи місцевих своєю маячнею.\nБіллу прикро, що Кассандра стала такою, як є, але він розуміє: ми зробили те, що мали зробити."

mot_han_the_head_forgets: "...А голова забуває"
mot_han_the_head_forgets_desc: "Білл — хороша людина, та гарні ідеї вже приводили нас до Кімбала й Олівера. Знаю, шкодуватиму, але я подзвонив Мур і сказав, що я і мій загін — у її розпорядженні."

mot_han_deep_distrust: "Зростаюча недовіра"
mot_han_deep_distrust_desc: "Я постійно переконую себе, що підтримати Мур було правильно. Але люди в Мохаве — навіть мої власні солдати — без упину нарікають на її дії. Як я маю це захищати, коли вона однією рукою розстрілює мутантів, а іншою — поневолює легіонерів?"

mot_han_no_life_wasted: "Жодне життя не даремне"
mot_han_no_life_wasted_desc: "Рекрутів із НКР тренували два тижні десь у Нижній Каліфорнії, а потім кидали сюди. Навіть дикуна можна навчити стріляти, але чи покине він спис? Рейнджери будуть невдоволені, та саме вони — досвідчені. Якщо хто й виживе — то це вони."

mot_han_die_a_hero: "Або помираєш героєм..."
mot_han_die_a_hero_desc: "Я більше не можу. Я зрадив своїх людей, кинувши їх у ще одну нікчемну війну. Я зрадив себе, повторюючи помилки Олівера й Кімбала. Єдина, кого я ще не зрадив — це сама Мур. Пора зрадити й її. У єдиний спосіб, який я знаю."

mot_han_vegas_issue: "Питання Нью-Вегаса"
mot_han_vegas_issue_desc: "Хоч як мені це не подобається, але Олівер мав рацію, коли вирішив «почекати» щодо Вегаса. Вивівши Паппас із підрозділом, він залишив місто без противаги. Немає договорів, нема зобов’язань — нічого не стримує Вегас від наступу. Час знести його позолочені брами, поки він не прийшов по нас."

mot_han_for_honorable_service: "За почесну службу"
mot_han_for_honorable_service_desc: "Костюмчик — є. Воля до життя — розтоптана. Сотні фальшивих усмішок чекають, щоб вручити мені бляшанку замість справжньої честі — також є. Залишилось тільки вийти й прийняти все те фальшиве вшанування, яке Мур мені підготувала. Вперед."

mot_han_call_in_favours: "Старі борги"
mot_han_call_in_favours_desc: "Я в Рейнджерах уже давно, й знаю: «Чорна Броня» — це ще не межа. Є дещо краще. Я потягнув за кілька ниточок, зв’язався з друзями в Каліфорнії, чи не залишилось у них екіпірування з Дівайду. Якщо вже мої Рейнджери йдуть на передову, хай ідуть у найкращому."

##### Інфраструктурні ініціативи #####

mot_freeside_infrastructure_project: "Інфраструктура Фрісайду"
mot_freeside_infrastructure_project_desc: "Генерал Олівер роками ігнорував потреби Мохаве, дбаючи лише про Гуверську дамбу. Через це вся інфраструктура в руїнах, і наші лінії постачання ослаблені. Треба це виправити."

mot_aid_freeside_locals: "Допомога мешканцям Фрісайду"
mot_aid_freeside_locals_desc: "Кинути на призволяще Містером Хаусом, тисячі жителів звертаються по допомогу до Послідовників і польових кухонь НКР. Якщо ми допоможемо їм — вони віддячать нам вірністю."

mot_southern_infrastructure_project: "Південна інфраструктура"
mot_southern_infrastructure_project_desc: "Генерал Олівер роками ігнорував потреби Мохаве, дбаючи лише про Гуверську дамбу. Через це вся інфраструктура в руїнах, і наші лінії постачання ослаблені. Треба це виправити."

mot_encourage_nipton_settlement: "Заохотити колонізацію Ніптона"
mot_encourage_nipton_settlement_desc: "Багато переселенців із Каліфорнії прибувають у наші землі в пошуках нового життя. Ми спрямуємо їх у Ніптон, щоб посилити наш контроль у регіоні."

mot_trade_guns_for_supplies: "Обмін зброї на припаси"
mot_trade_guns_for_supplies_desc: "Який сенс у зброї, коли не маєш стимуляторів, наметів чи дров? Обміняємо частину нашої зброї з караванами — отримаємо те, що справді потрібно фронту."

mot_fund_freeside_workshops: "Фінансування майстерень Фрісайду"
mot_fund_freeside_workshops_desc: "Попри надлишок робочої сили, Фрісайду бракує економічного розвитку, необхідного хоча б для базової промисловості. Якщо ми спрямуємо ресурси у Фрісайд, то зможемо започаткувати там просте виробництво."

mot_decommission_soldiers: "Розформувати солдат"
mot_decommission_soldiers_desc: "Генерал Олівер без упину вимагав більше військ для захисту дамби, хоча гнучкіша стратегія дозволила б охопити ті ж позиції з меншими силами. Розформування деяких підрозділів зменшить навантаження на наші лінії постачання та дозволить перенаправити ресурси на інші потреби."

### Хсу / Фаркс

mot_far_stay: "Публічне обличчя"
mot_far_stay_desc: "Не скажу, що здатна керувати, як це робила НКР — особливо з Хсу поруч — але Послідовники завжди мали своє публічне обличчя. [THIS.GetNameWithFlag], знайомся: твоє нове обличчя — я, Джулі Фаркс!"

mot_far_citizens_of_mojave: "Громадяни Мохаве"
mot_far_citizens_of_mojave_desc: "Оскільки Закон Талера більше не діє, а брахмінові барони НКР на кшталт Гека Ґандерсона більше не постачають харчі, мешканці Мохаве потребують нашої допомоги. План «Хсу-Фаркс» — скромна, але дієва програма для підтримки добробуту нашого нового Республіканського Мохаве."

mot_far_mojave_university: "Університет Мохаве"
mot_far_mojave_university_desc: "Медичний університет в Боніярді тепер, скоріше за все, контролюється Мур — якщо він ще взагалі існує. Послідовникам та мешканцям Мохаве потрібен власний освітній центр, щоби не повертатися до вирізок із довоєнних журналів. Біля Пріма є стара шкільна округа — саме там і створимо новий університет."

mot_far_jacobstown: "Допомога всім"
mot_far_jacobstown_desc: "Ми, Послідовники, маємо мало досвіду з супермутантами, хіба що зі слів гулів, які ще пам’ятають події з Творцем. Але тепер допомоги потребує кожен. Подейкують, у колишньому гірськолижному курорті діє мирна громада мутантів. Варто дізнатись, чим можемо зарадити."

mot_far_the_kings: "G.I. Blues"
mot_far_the_kings_desc: "До політичного глухого кута НКР, Королі й Республіка мали доволі напружені стосунки. Але тепер, коли Кімбал і Мур пішли з арени, Королі здобули справжню незалежність. Вони трохи дивакуваті, та Послідовники завжди допомагали всім — і Королі тут не виняток."

mot_hsu_fits_better: "Забутий герой"
mot_hsu_fits_better_desc: "Бути публічним обличчям ПРМ — це почесно, але я не для сцени. Є один, хто справді заслуговує на це — Джеймс Хсу. Якби не войовничі Кімбал і Мур, саме він міг би мирно об’єднати Мохаве. Якщо він буде за штурвалом — у ПРМ буде світле майбутнє."

mot_hsu_oliver_mistakes: "Помилки Олівера"
mot_hsu_oliver_mistakes_desc: "Генерал Олівер здобув своє прізвисько не просто так. Його армія то стояла на місці, то йшла в м’ясорубку. Його командування показало не лише його особисті помилки — а й провали всіх нас. Це треба виправити."

mot_hsu_long_ignored_threat: "Загроза, яку довго ігнорували"
mot_hsu_long_ignored_threat_desc: "Колись Фіенди були лише дрібними рейдерами, як Хани, Шакали чи Гадюки. Але тепер, коли НКР — більше не держава, ми маємо вирішувати проблеми так, як політики з Габа ніколи б не дозволили. Монстри заслуговують лише на монстрячу смерть."

mot_hsu_boomers: "Volare!"
mot_hsu_boomers_desc: "Я завжди був прихильником перемовин — особливо з тими, хто має гаубиці та ракети, а в нас немає навіть нормальних боєприпасів. Кажуть, у Фрісайді залишились старі звукові маяки. Можливо, з їх допомогою вдасться передати сигнал миру."

mot_hsu_raul: "Стара школа"
mot_hsu_raul_desc: "Мої люди виявили гуля в неволі на Чорній Горі. Каже, він першокласний механік і технік, хоча у нього й знайшли... довоєнний костюм ковбоя. Думаю, мені слід навідатись до нього особисто."

mot_kin_city_by_the_night: "Місто вночі"
mot_kin_city_by_the_night_desc: "Договір із Нью-Вегасом більше не чинний. Хаус у будь-яку мить може почати війну. До того ж, кожна з його Трьох Родин має власні амбіції захопити владу після його падіння. Треба діяти першими. Я підготую війська, а ти, Фаркс, зателефонуй Королю. Пора влаштувати трохи рок-н-ролу серед ночі."

mot_kin_bossa_nova_baby: "Босса-Нова, дитинко"
mot_kin_bossa_nova_baby_desc: "Я не очікував такого повороту, але, схоже, [VEG.GetLeader] взяв під контроль Вегас замість Гауса. Не можу сказати, що повністю довіряю новому керівництву, але й сидіти склавши руки не можна. Слід негайно запропонувати їм приєднатися до нашої Тимчасової Республіки Мохаве."

mot_kin_lucky_38: "Скляна вежа"
mot_kin_lucky_38_desc: "Кажуть, що наш агент — доктор Ортал — одного разу за допомогою хитруна у клітчастому костюмі проник до мережі 'Щасливого 38'. При Гаусі зловити більше 40 секунд даних не вдалось. Але тепер, коли Гауса немає, ми можемо спокійно зайти туди й використати все — не для себе, а для народу Мохаве."

mot_far_calhoun: "Нове Мохаве"
mot_far_calhoun_desc: "Білл зробив це. Він об'єднав усю Нову Каліфорнію під прапором миру, добробуту й рівності. Із зникненням усіх загроз ми нарешті можемо перетворити Тимчасову Республіку Мохаве на Нову Республіку Мохаве — під керівництвом Келгуна."

mot_far_moore: "Останнє світло свободи"
mot_far_moore_desc: "Та тиранія Мур і її раб Гейз перемогли. Ми — останній бастіон свободи в усьому Південному Заході. Це суперечить усьому, у що я вірю, але готуйте гармати."

mot_hanlon_and_moore: "Ханлон і Мур"
mot_hanlon_and_moore_desc: "На відміну від решти дурнів у військовому командуванні НКР, ми з Мур бачили ситуацію однаково. Обоє знали — хтось мусить ухвалювати важкі рішення, щоби врятувати Республіку від краху."

mot_we_are_not_the_same: "Ми не однакові"
mot_we_are_not_the_same_desc: "Олівер — продукт кумівства. Ханлон же вижив у штучних жахіттях, які Оліверу й не снилися. Він не світиться золотом, але є справжнім золотом. Настав час показати, що таке — справжня самозроблена людина."

mot_fortify_forlorn_hope: "Укріпити табір 'Згасла Надія'"
mot_fortify_forlorn_hope_desc: "Тільки дурень не бачить намірів Легіону захопити Нельсон і вдарити по Новаку. Через недбалість Олівера табір ледь не впав. Ми укріпимо його, щоби жоден легіонер не перетнув Колорадо."

mot_army_with_a_mojave: "Армія з Мохаве"
mot_army_with_a_mojave_desc: "Ми не Хаб і не Дейґлоу. Якщо хочемо вижити, мусимо бути армією з державою, а не навпаки."

mot_old_allies: "Старі союзники"
mot_old_allies_desc: "Адміністрація НКР відштовхнула багатьох рейнджерів — тих, хто виступав проти безглуздої війни в Мохаве. Рейнджер Ханлон зможе повернути їх до строю."

mot_hanlon_the_hero: "Справжній герой Боулдер-Сіті"
mot_hanlon_the_hero_desc: "Це я, а не Олівер, переміг у Першій битві за дамбу. Я гнав Легіон до самої Аризони. Настав час нарешті взяти заслуги, які мені належать."

mot_deep_distrust: "Глибока недовіра"
mot_deep_distrust_desc: "Не всі місцеві цінують наші жертви. Наш зростаючий мілітаризм їх лякає, вони сумують за м'яким підходом Олівера. §RДурні!§!"

mot_caesars_end: "Кінець епохи"
mot_caesars_end_desc: "Цезаря більше немає, як і його Легіону. Наше головне завдання виконано. Тепер можна зайнятись інтеграцією Мохаве до складу НКР."

mot_deconstruct_the_forts: "Демонтувати укріплення"
mot_deconstruct_the_forts_desc: "Із поразкою Легіону Мохаве перестає бути фронтом. Ми можемо розібрати військові фортифікації й закласти основи для індустрії."

mot_convert_arms_workshops: "Перепрофілювати заводи"
mot_convert_arms_workshops_desc: "Більше немає потреби в надлишку зброї. Ми перепрофілюємо військові заводи на виробництво будматеріалів для відновлення."

mot_integrate_the_south: "Інтегрувати Південне Мохаве"
mot_integrate_the_south_desc: "Ми принесемо демократію в Південне Мохаве."

mot_integrate_the_north: "Інтегрувати Північне Мохаве"
mot_integrate_the_north_desc: "Ми принесемо демократію в Північне Мохаве."

mot_integrate_the_center: "Інтегрувати Центральне Мохаве"
mot_integrate_the_center_desc: "Ми принесемо демократію в Центральне Мохаве."

mot_what_we_worked_for: "Те, за що ми боролись"
mot_what_we_worked_for_desc: "Роки кривавого конфлікту. Ми воювали з рейдерами, канібалами, наркоманами й Легіоном. І перемогли, попри всі шанси. Можливо, попереду на нас чекає ще більше досягнень."

mot_monuments_for_heroes: "Монумент героям Мохаве"
mot_monuments_for_heroes_desc: "Ми зведемо монумент у Боулдер-Сіті на честь усіх, хто загинув у війні з Легіоном: солдатів, рейнджерів, караванників і простих людей. Вони пішли, але пам’ять про них житиме."

mot_frontier_no_more: "Мохаве — більше не фронтир"
mot_frontier_no_more_desc: "Ми більше не чужі в цьому краї. Наші війська знають Мохаве як свою кишеню. З інфраструктурою й без Легіону ми діятимемо швидше, ніж будь-коли."

mot_civilian_rule: "Цивільне правління в Мохаве"
mot_civilian_rule_desc: "Нашим військовим більше не потрібно контролювати кожне поселення. Ми дозволимо цивільним самоврядування."

mot_state_of_mojave: "Штат Мохаве"
mot_state_of_mojave_desc: "Попри те, що ми починали як форпост НКР, ми стали значно більшим. Мохаве — це не просто продовження Каліфорнії чи її амбіцій. Ми приєднаємося до Республіки не як колонія, а як штат. Народ Мохаве заслуговує на голос у парламенті після всього, що пережив під військовою окупацією."

mot_integration_of_the_mojave_territories: "Інтеграція територій Мохаве"
mot_integration_of_the_mojave_territories_desc: "Ми досягли нашої основної мети. Мохаве — у безпеці, можливо, навіть більшій, ніж Північний кордон. Ми розпочнемо процес повторного включення нашої командної структури до складу Республіки."


# Підказки

mot_cant_join_tt: "§RТериторії Мохаве фінансуються коштом платників податків НКР. Вони мають самі з цим впоратись.§!"

mot_cant_call_tt: "§RМи отримуємо фінансування від платників податків НКР, щоби впоратись із цим самостійно. Їхня допомога нам не потрібна.§!"

mot_unlock_ncr_interations_tt: "Відкриває систему взаємодії §O'Війна — не ізольоване явище'§!, що дозволяє керувати нашими стосунками з урядом у Шейді-Сендс. \n\nСтавлення уряду до нашого становища починається як §Gприязне§!, а народ НКР спершу буде §Gпідтримувати§! кампанію в Мохаве. Однак будьте обачні з закликами до допомоги: уряд очікує результатів за витрачені податки, а громадськість — легкої перемоги."

mot_deploy_the_fresh_battalions_tt: "§Y2§! підготовлені та оснащені дивізії §Yвійськ Мохаве§! прибудуть до §YБейкера§!, нещодавно набрані в Боньярді. \n\n§gЦе розгортання було погоджене заздалегідь, тому не вплине на ставлення Шейді-Сендс.§!"

mot_call_up_second_draft_tt: "§Y3§! підготовлені та оснащені дивізії §Yвійськ Мохаве§! прибудуть до §YБейкера§!, нещодавно мобілізовані в Реддінґу. \n\n§gМи також отримаємо додаткове підкріплення у вигляді людських ресурсів:§!\n"

mot_guns_from_back_home_tt: "§gТепер, коли ми відновили Лонґ-15 та маємо сили для його захисту, ми можемо звернутися до Шейді-Сендс по постачання зброї.§! \n\nВідкриває рішення §O'Петиція щодо постачання зброї'§! у рамках системи §O'Війна — не ізольоване явище'§! \n\n§gПерша партія зброї, вже зарезервована для нас, прибуде негайно:§!"

mot_form_up_the_first_recon_tt: "Батальйон §O1-го розвідбатальйону§! буде сформований у §YБейкері§!, складений з найкращих стрільців і спостерігачів армії НКР. \n\n§gОстаннє, що вони побачать...§!\n"

mot_survey_our_enemy_tt: "Наша §Yрозвідка армії§! щодо §YБратства Мохаве§! підвищується на §G20%§!. \n\n§gЦю інформацію можна використати через довідник розвідданих (Intel Ledger), клацнувши ПКМ по їхній країні.§!\n"

mot_the_second_turbine_tt: "§gДругий із §Yсімнадцяти§! турбін §OГЕС 'Гувер'§! буде введений в експлуатацію, трохи підвищивши генерацію електроенергії.§!\n\n"

mot_promote_colonel_moore_tt: "§YCассандра Мур§! отримує звання §Oполковника§! та стає доступною як командир. Вона почне як командир §G3§! рівня з упором на силу й рішучість."

mot_victory_at_the_dam_trig: "§RЦей фокус буде завершено подією після перемоги НКР у 1-й битві за Гуверську дамбу§!"

mot_victory_at_the_dam_tt: "Ця перемога дає нам перепочинок і можливість зосередитись на інших напрямках. Але сумнівів немає — битва за дамбу ще триватиме."

mot_long_march_home_trig: "§RЦей фокус буде завершено подією після поразки НКР у 1-й битві за Гуверську дамбу§!"

mot_long_march_home_tt: "Після нищівної поразки ми змушені відступити. Вся кампанія в Мохаве може бути згортана на користь 'нових підходів', що поширюються у столиці. \n\n§gУ версії 4.0 експедиція Мохаве отримає альтернативний шлях після поразки на дамбі. Наразі ж така поразка призведе до інтеграції експедиції й територій до складу НКР.§!"

mot_3_4_turbines_tt: "§gТретя та четверта турбіни на §OГЕС 'Гувер'§! будуть запущені, що значно підвищить виробництво енергії.§!\n\n"

mot_emergency_ctte_divide_trig: "§OРозлом§! стає §Rнепрохідним§! для наших постачальних маршрутів через ворожі дії, місцевий опір або інші непередбачувані обставини."

mot_emergency_ctte_vegas_trig: "§OНью-Вегас§! перебуває під §Rокупацією§! фракції, яка §Yне входить§! до §OНКР§! і §Yне визнає§! §OДоговір Нью-Вегаса§!"

hoover_1st_battle_not_ongoing: "§OПерша битва за Гуверську дамбу§! §YНЕ§! ведеться"

mot_form_up_the_heavy_corp: "Перша дивізія §Oважкого корпусу НКР§! буде сформована в §YБейкері§! з використанням модифікованих екземплярів силової броні, здобутих у Братства сталі.\n\n"

mot_fie_oliver_plan:0 "§OПлан генерала Олівера§! щодо §YФієндів§! було схвалено §OКомітетом оборони Мохаве§!"
mot_fie_hanlon_plan:0 "§OПлан шефа Ханлона§! щодо §YФієндів§! було схвалено §OКомітетом оборони Мохаве§!"
mot_veg_oliver_plan:0 "§OПлан генерала Олівера§! щодо майбутніх відносин із §YНью-Вегасом§! було схвалено §OКомітетом оборони Мохаве§!"
mot_veg_hanlon_plan:0 "§OПлан шефа Ханлона§! щодо §YНью-Вегаса§! було схвалено §OКомітетом оборони Мохаве§!"

mot_promote_chief_hanlon_tt:0 "§OГенерал Олівер§! йде у відставку з командування §YЕкспедицією Мохаве§!, а §OДжош Ханлон§! призначається новим §Oгенералом§!."

mot_hanlon_dominant:0 "§OДжош Ханлон§! здобуває довіру §OКомітету оборони Мохаве§!"
mot_oliver_dominant:0 "§OЛі Олівер§! зберігає довіру §OКомітету оборони Мохаве§!"

mot_a_secret_most_profound_tt:0 "§O[VEG.GetNameWithFlag]§! буде §Gзатримано§! на §Y180 днів§! у здобутті Платинової Фішки.\n"

mot_crocker_tt:0 "Наша §Yцивільна розвідка§! щодо §Y[THIS.GetNameDef]§! збільшується на §G15%§!, а §Yвійськова розвідка§! — на §G10%§!. \n\n§gЦю інформацію можна використати через довідник розвідданих, клацнувши ПКМ на цій країні.§!\n"

mot_supply_check_tt:0 "Ми маємо принаймні §O[?mot_supply_check]§! одиниць постачання для витрат"

mot_family_diplomacy_tt:0 "§gЖодна 'сім'я' не є досить сильною, щоби протистояти пануванню містера Хауса і його армії сек’юритронів. Але трохи кришок і зброї у потрібні руки змусять Хауса постійно озиратись через плече. Це не надто почесний спосіб стримувати війну з Вегасом, але, можливо, він подарує нам трохи часу.§!\n\n"

restore_turbine_avail_tt:0 "Є хоча б одна зламанa турбіна, яку можна полагодити"
mot_restoring_hoover_tt:0 "Відкриває рішення §O'Відновити наступну турбіну'§!, що дозволяє відремонтувати решту турбін ГЕС «Гувер» та значно підвищити виробництво енергії.\n"

mot_oliver_dominant_tt:0 "§OГенерал Олівер§! зміцнює свою владу в §OКомітеті оборони Мохаве§!, відкриваючи власну гілку фокусів і зберігаючи лідерство експедиції."
mot_hanlon_dominant_tt:0 "§OШеф Ханлон§! використовує свою підтримку в §OКомітеті оборони Мохаве§!, щоб закріпити контроль над експедицією, відкриваючи свою гілку фокусів. Відставка Олівера стає неминучою."
mot_debate_tie_tt:0 "§OКомітет оборони Мохаве§! застряг у рівному розподілі голосів між §OХанлоном§! і §OОлівером§!. Тож ви зможете обрати будь-який доступний шлях."

mot_old_allies_tt:0 "Деякі з давніх союзників Ханлона повернуться з відставки."

mot_crisis_in_california:0 "§RКриза в Каліфорнії§!"

mot_oliv_mp_tt:0 "§Y4 дивізії військової поліції прибудуть з Нью-Вегаса§!"
mot_oliv_sb_tt:0 "\n§Y3 дивізії§g «Корпусу ведмежої броні»§!, коштовного проєкту Лі Олівера, вступають до служби.§!"

mot_hsu_retire_tt:0 "§O\nДжеймс Хсу стане публічним обличчям ПРМ\n§!"
mot_hsu_stay_tt:0 "§g\nДжулі Фаркас стане публічним обличчям ПРМ\n§!"

mot_kin_war_tt:0 "§gМи допоможемо Кінґам здійняти повстання проти містера Хауса!§!"
mot_veg_king_cw_tt:0 "§gКінґи успішно підняли повстання проти §Yмістера Хауса§! — починається громадянська війна!§!"
mot_veg_king_cw_fails_tt:0 "§gЗмова зазнає краху з мінімальним опором... але їхні покровителі певно вдадуться до вторгнення!§!"


