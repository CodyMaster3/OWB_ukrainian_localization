MARCUS_TT:0 "§Y$JCT_MARCUS_NAME$§! стає командиром корпусу.\n§LРівень§!: §Y4§!\n§RАтака§!: §Y3§!\n§GОборона§!: §Y3§!\n§PПланування§!: §Y2§!\n§MЛогістика§!: §Y2§!\n§gРиси§!: §tСильний§!, §tНевмирущий§!\n\n"
