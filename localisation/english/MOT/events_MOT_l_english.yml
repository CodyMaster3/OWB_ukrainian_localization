l_english:
## nf events ##
nf_mot.1.t: "Вирушаючи з Бейкера"
nf_mot.1.d: "Коли 38 громадян НКР були вирізані рейдерами поблизу міста Нідлс у Мохаве, Конгрес НКР негайно закликав до дій. Тодішній президент Тіббет вагався з відправкою військ, адже Республіка вже вела дорогі війни на півночі та заході. Але його аргументи не мали значення для Сенату. Тіббет незабаром програв вотум недовіри, і його замінив Венделл Пітерсон, який невдовзі наказав трьом батальйонам солдатів НКР вторгнутися та умиротворити регіон.\n\nУ 2274 році, після розвідки підрозділів рейнджерів НКР і відкриття майже неушкодженої Греблі Гувера, мандат Експедиції в Мохаве був значно розширений — тепер він охоплював територію від Нідлс до Нью-Вегаса. Підсилений чотирма новими батальйонами й підтриманий двома дивізіями рейнджерів, генерал Олівер у березні 2274 року виступив з Бейкера до застави Мохаве за наказом президента, щоб розпочати «Умиротворення Мохаве» — кампанію, що сформувала б майбутнє регіону на десятиліття."
nf_mot.1.a: "З Бейкером як базою — експедиція має надійний тил."
nf_mot.1.b: "Роки боїв у Південному Мохаве загартували всіх."

nf_mot.2.t: "Рейдери Мохаве"
nf_mot.2.d: "Хоча рейнджери НКР і проводили розвідку пустки Мохаве задовго до того, як генерал Олівер рушив із Бейкера, їхні зусилля обмежувалися лише загальним оглядом ключових точок і фракцій. Між заставою Мохаве та Греблею Гувера не було жодного дружнього аванпосту — генерал Олівер мав прокладати шлях до греблі власноруч, ведучи бої. \n\nПершим значним поселенням, яке він мав умиротворити, став Ніптон. Колись маленьке містечко, після Великої війни Ніптон став прихистком для біженців і торговим вузлом. Завдяки наркотикам і проституції місто процвітало, ставши центром наркотрафіку Біснуватих — із чималим їхнім гарнізоном. Природно, це зробило Ніптон першим військовим об'єктом для Експедиції в Мохаве. Тактика, застосована в цьому бою, вплинула на подальші сутички."
nf_mot.2.a: "Солдати перевірили кожен дім, щоб переконатися — місто очищене."
nf_mot.2.b: "Коли основні сили Біснуватих відступили, місто стало безпечним."

nf_mot.3.t: "Живлення Мохаве"
nf_mot.3.d: "Під час розвідки Північного Мохаве в 2273 році рейнджери НКР натрапили на масивну бетонну дамбу, що перекривала течію Колорадо. На відміну від звичних барикад у Каліфорнії, ця була не наслідком падіння літака чи роботи шаленого супермутанта. Вона була збудована ще до Великої війни — в епоху розквіту Америки. Рейнджери з повагою прозвали її «Стіною Старого Світу», але це виявилась сама Гребля Гувера — велика споруда, яку вважали знищеною. Вона стояла перед ними у повній красі, без жодної тріщини. І — на подив інженерів, яких терміново викликала НКР — дві турбіни навіть увімкнулися, тихо загудівши. Це справді було диво.\n\nВідкриття Греблі Гувера викликало ажіотаж у Конгресі НКР. Десятиліттями Республіка не могла забезпечити електроенергією навіть великі міста, не кажучи вже про села. Тепер, з частково робочою дамбою, відкривалась можливість дати енергію всій Каліфорнії — якщо лише вдасться запустити решту турбін. Так, доведеться віддавати Вегасу 5% виробленої електрики, але ж…"
nf_mot.3.a: "З деякими «помилками» в підрахунках, Вегас отримав мінімум."
nf_mot.3.b: "Це була прийнятна ціна за мир!"

nf_mot.4.t: "Сутички з Мохавським братством сталі"
nf_mot.4.d: "Коли ми вперше прибули в Мохаве, то виявили місцеву гілку Братства Сталі, яка проводила техно-рейди по пустці. Вони були далеко від дому, під проводом фанатичного й непередбачуваного лідера — Елайджі. У перші дні кампанії ми неодноразово вступали з ними в сутички, але обидві сторони знали: у місцевого Братства бракує людей і спорядження, аби утримувати територію. Зрештою вони осіли на ГЕЛІОС Один — довоєнному сонячному комплексі, заповненому стародавніми технологіями, що так манять Братство.\n\nЦей нестабільний статус-кво не може тривати вічно, навіть якщо тривала війна буде згубною для обох сторін. Але під політичним тиском із Шейді-Сендс ми розпочали військові приготування до §OОперації: Сонячний спалах§! — масштабного штурму ГЕЛІОС Один із метою взяти його під контроль Республіки й остаточно знищити Братство в Мохаве. Помітивши наші дії, Братство також почало готуватись до неминучої битви. Баланс сил між нами буде визначений рівнем §Oпідготовки§!: що більше підготовки матимемо ми, то ефективніше діятимуть наші війська. Через обмежений масштаб операції, кожен етап має значення!"
nf_mot.4.a: "Ослабити їхні рейди за технологіями — наш пріоритет."
nf_mot.4.b: "Спершу треба краще їх вивчити."
nf_mot.4.c: "У нас один варіант — знищити їх. Розпочати підготовку."

nf_mot.5.t: "Оборона Мохаве"
nf_mot.5.d: "Хоча гілка Братства в Мохаве і була переможена, а зовнішні загрози тимчасово зникли, почуття тривоги не покидає Комітет оборони Мохаве. До його складу входять найталановитіші військові у кампанії Мохаве, і саме він консультує генерала Олівера щодо загальної стратегії — хоча остаточне слово у всіх військових рішеннях залишається за генералом. Комітет завжди тихо бурчав про те, що Олівер відкидає багато їхніх пропозицій на користь гучних, сміливих наступів, які додають престижу. Та всі вони лояльні Республіці й поважають ланцюг командування. Втім, слухатися наказів і погоджуватися з ними — різні речі. За останні місяці начальник рейнджерів Генлон дедалі гучніше висловлює невдоволення тактикою Олівера, наполягаючи на більш обережному підході, який міг би врятувати життя. Його точку зору поділяють і деякі інші члени комітету. Очевидно, попереду ще багато суперечок — особливо з огляду на нову війну, що наближається."
nf_mot.5.a: "Маємо пильно стежити за цим конфліктом..."

nf_mot.6.t: "Постачання Мохаве"
nf_mot.6.d: "Ще до Великої війни Мохаве було негостинним місцем. Після неї великі частини регіону перетворилися на пекельні пустки, наповнені радіацією. Переміщення військ і цивільних стало надзвичайно складним і обмежується двома основними торговими шляхами: шосе 95 і автострадою I-15. Ще важче забезпечити перевезення постачання. Каравани повільні, громіздкі й змушені оминати великі дороги, щоби досягти гарнізонів і аванпостів у стратегічно важливих, хоч і незручних, місцях. Хоча нам вдалося накопичити достатньо ресурсів для створення та розширення чинних баз, будь-яке подальше їхнє постачання, розбудова чи створення нових опорних пунктів вимагатиме інвестицій у постачання.\n\nМи можемо здобути запаси через фокуси або шляхом перемовин з урядом НКР. Їх можна буде витрачати на різні проєкти у фокус-дереві. Крім того, одна десята запасів додається до нашої атаки й оборони."
nf_mot.6.a: "Доведеться йти на компроміси."

nf_mot.7.t: "Великих Ханів атакують табір МакКарран"
nf_mot.7.d: "Великі Хани — племінна група, що оселилася в пустці Мохаве після вигнання з Каліфорнії, — давно стоїть у нас поперек горла. Від самого початку нашої присутності в регіоні ми безперервно вступаємо з ними в сутички всюди, де стоять наші гарнізони. Їхня воїнська культура глибоко вкорінена, що робить їх вправними бійцями, через що ми несемо значні втрати в зіткненнях. Останніми днями їхні атаки почастішали. Сьогодні ж усе досягло апогею: ціла бойова група Ханів здійснила напад на табір МакКарран.\n\nАтака була жорстокою: наші солдати змушені були відступити з внутрішнього двору й закріпитися в головному терміналі. Лише завдяки рейнджерам, екстрено перекинутим із греблі, вдалося зупинити просування Ханів. Відчувши, що момент вичерпано, ворог швидко відступив, прихопивши чималі запаси. Схоже, Хани перетворюються на серйозну загрозу..."
nf_mot.7.a: "Цьому не можна дозволити повторитися."

nf_mot.8.t: "Гіркий післясмак завоювання"
nf_mot.8.d: "Сили Експедиції в Мохаве під проводом генерала Олівера, за активної участі рейнджерів Генлона, утримують більшість стратегічних пунктів регіону вже протягом кількох місяців. Після розгрому Мохавської гілки Братства Сталі та підписання договору з Нью-Вегасом організованого військового спротиву більше немає. Проте, як з подивом виявили наші втомлені війною вояки, перемогти Братство та зайняти кілька поселень — було найлегшою частиною кампанії. Попри гучні ініціативи, експедиція Олівера фактично не змогла «умиротворити» Мохаве. Військ бракує для постійного патрулювання, а рейдери досі вільно переміщаються пустелею. І вишенька на торті — загроза Цезаря та його Легіону за рікою, що ще дужче виснажує наші ресурси.\n\nЗ огляду на масштаби завдань, знову скликано Комітет оборони Мохаве, аби обговорити питання «Другої кампанії». З одного боку, генерал Олівер виступає за продовження чинної політики: обмежені гарнізони в критичних точках та широка автономія для громад. Начальник Генлон, натомість, пропонує радикальніший підхід — вивести основні сили до укріплених вузлів: греблі, табору МакКарран і низки менших баз, залишивши решту територій напризволяще. Хоча вдома підтримка плану Генлона мізерна, з огляду на мандат експедиції — «умиротворити, а не визволити» — його підхід має підґрунтя. Дебати триватимуть до глибокої ночі..."
nf_mot.8.a: "Без підтримки поселень ми загинемо!"
nf_mot.8.b: "У нас просто немає достатньо людей."

nf_mot.9.t: "Наближається буря"
nf_mot.9.d: "Насувається великий конфлікт. Від Комітету оборони Мохаве до звичайних солдатів НКР — усі знають, що за Колорадо ховається могутній ворог. Наші табори вже неодноразово стикалися з його силами, і лишається лише питання часу, коли почнеться повноцінний штурм. Їхньою метою, без сумніву, буде гребля Гувера: що може більше потішити військового вождя, ніж захоплення одного з найбільших довоєнних чудес Америки?\n\nМи давно знали, що гребля стане ареною битви — невідомим залишався лише напрямок удару. Тепер ми можемо почати створювати конкретний план її оборони від легіонерських орд. Комітет оборони Мохаве має безліч ідей щодо ефективної стратегії.\n\nНайвпливовіші голоси — генерал Олівер і начальник Генлон — об’єднали навколо себе прибічників протилежних підходів. Олівер закликає до повної оборони греблі, фортифікуючи її та спрямовуючи перевагу Легіону в живій силі в тісну місцевість. Генлон же вважає, що гребля погано придатна для захисту: справжня битва, на його думку, станеться за Боулдер-Сіті, де легіонерів можна заманити в пастку. Обидва плани мають свої переваги та недоліки, але затвердити можна лише один..."
nf_mot.9.a: "Гребля має вистояти!"
nf_mot.9.b: "Укріпити Боулдер-Сіті"

nf_mot.10.t: "Пил і уламки"
nf_mot.10.d: "Вибухи. Землетруси. Ми відчули їх навіть на греблі Гувера — і, без сумніву, в Шейді-Сендс теж. Просто на наших очах земля Розломів закрутилась і деформувалась, перетворивши долину на непридатну для життя пустку. Причину вибухів досі не встановлено, але високий рівень радіації свідчить про одне: ядерні боєголовки під землею. У трагедії загинуло сотні людей — від охоронців караванів до вояків НКР. Що ще гірше, один із двох основних шляхів постачання до Мохаве тепер повністю непридатний."
nf_mot.10.a: "Залишився лише шлях через Лонг-15..."
nf_mot.10.b: "Зібрати загін рейнджерів — має ж бути хоч якийсь прохід!"

nf_mot.11.t: "Спалити дім дотла"
nf_mot.11.d: "Схоже, що повстанські елементи у Вегасі вбили Містера Гауса! Із його поразкою ми можемо скористатися ситуацією та окупувати Нью-Вегас?"
nf_mot.11.a: "Зараз є справи важливіші за Вегас..."
nf_mot.11.b: "Гауса прибрано — шлях до Вегаса відкрито!"

nf_mot.12.t: "Перелом у грі"
nf_mot.12.d: "Коли ми вперше прибули в Мохаве, Нью-Вегас засяяв у небі. Містер Гаус і його роботи з цікавістю вийшли за стіни міста до наших таборів біля греблі, розповідаючи про своє «золоте місто» — коштовність Мохаве. Сек’юрітрони Гауса хоч і грізні, але нечисленні, а його союзники — це розрізнені племена, що стали «родинами» Вегаса. Здавалося, якби експедиція вирішила — місто можна було б захопити без більших витрат, ніж Операція «Сонячний спалах». Але наказу захопити Нью-Вегас так і не було. Натомість підписали Договір із Вегасом, визнавши його незалежність і пообіцявши 5% потужностей греблі.\n\nЦе мало сенс: із Братством, рейдерами та Легіоном на горизонті — ще один сильний ворог був би фатальним. Але зараз обставини дещо змінились. Братство майже не становить загрози, рейдери ослаблені, а в експедицію прибули нові дивізії. У Комітеті оборони Мохаве генерал Олівер пропонує продовжити мілітаризацію, щоби відлякати Гауса від можливих нападів. Генлон же радить шукати союзників серед «родин» Вегаса — можливо, навіть підтримати переворот. Залучити Вегас було б величезною перемогою... але й ризиком."
nf_mot.12.a: "З чисельною перевагою ми відлякаємо будь-який напад."
nf_mot.12.b: "Вийти на контакт з «родинами»: серед них можуть бути союзники."

nf_mot.13.t: "Розділяй і володарюй"
nf_mot.13.d: "Незвичні чутки ширяться по Стріпу: про «темні» гроші та контрабандну зброю, що проникає за стіни Нью-Вегаса. Згідно з єдиними тверезими джерелами, ці поставки надходять до різних родин Вегаса — без видимих причин. Походження зброї й кришок установити важко, але є підозри, що зброя... від рейнджерів НКР!\n\nЯкщо це підтвердиться — політику Територій доведеться терміново переглянути. Ба більше — можливо, насувається переворот. У будь-якому разі, це загрожує крихкому балансу між родинами Нью-Вегаса. Маємо бути обережними."
nf_mot.13.a: "М’яко кажучи, це тривожить."

nf_mot.14.t: "Рейнджер і робот"
nf_mot.14.d: "Від самого відкриття посольства НКР у Вегасі ми підозрювали, що розміщена там організація не така вже й дружня. Було чимало доказів, що НКР таємно використовує його як прикриття для підрозділу рейнджерів, що намагаються проникнути в наші лави. Але ми ніколи не мали прямих доказів.\n\nСьогодні вранці поблизу Ґудспрінґса був заарештований і затриманий особливий індивід рейнджерським загоном НКР. Один із багатьох Кур'єрів, яких ми відправили за Платиновим Чипом, Кур'єр №6 був найбільш надійним із усіх. Але навіть він, схоже, не зміг уникнути пильного ока Ведмедя. Чип було конфісковано, а самого Кур’єра — доправлено під варту. Наші джерела в НКР повідомляють, що чип вже прямує до Каліфорнії під надійною охороною.\n\nАрешт Кур'єра й втрата Чипа означають одне: НКР знає, що він важливий. Наші плани щодо Ведмедя й Бика зруйновано. Тепер треба ретельно зважити наступні кроки. Можливо, армії сек’юрітронів буде досить, щоби прорватися крізь війська експедиції, захопити греблю й повернути Чип. Ризиковано..."

nf_mot.14.a: "Розірвати договір!"

nf_mot.15.t: "Цивільне правління в Бейкерсфілді"
nf_mot.15.d: "Бейкерсфілд перебував під воєнним станом протягом багатьох років як частина мандату Експедиції в Мохаве. Але після стабілізації ситуації регіон знову передано під цивільне управління. Це лише питання часу, коли ми поширимо ті самі свободи на решту Мохаве... а, можливо, й далі."
nf_mot.15.a: "До смолоскипа Тихоокеанського узбережжя!"

nf_mot.16.t: "Контроль відкинуто"
nf_mot.16.d: "До цього моменту Території Мохаве діяли як майже незалежне військове формування. Незважаючи на нашу постійну підтримку, федеральний контроль був обмеженим. Багато хто вимагав аудиту та звіту щодо стану справ. Але з огляду на постійну війну, [MOT.GetLeader] зумів переконати Раду НКР уникнути цієї перевірки. Дехто з громадян ставить під сумнів цю «нескінченну трясовину», але в підсумку — ми переможемо."
nf_mot.16.a: "До смолоскипа Тихоокеанського узбережжя!"

nf_mot.17.t: "Остання вечеря Ведмедя"
nf_mot.17.d: "[MOT.GetLeader] вимагає, щоби ми підкорилися вимогам Нової Каліфорнії й стали «асоційованою територією» Республіки. Це покладе край нашій незалежності й перетворить нас на маріонетку в усьому, крім назви. Хоча Нова Каліфорнія — наш головний ринок, чи можемо ми справді піти на це?"
nf_mot.17.a: "Ні за що!"
nf_mot.17.a_tt: "\n§RТроянди червоні§!,\n§Mфіалки — сині§!,\n§Yми надішлемо сек’юрітронів \nпросто по тобі.§!"
nf_mot.17.b: "Навіщо ж я втратив цей чип!"

nf_mot.18.t: "Вегас — наш!"
nf_mot.18.d: "[VEG.GetLeader] розуміє, що ми — щит, який захищає цивілізацію від будь-якої загрози. Відтак, Вегас готовий увійти до складу Республіки як ще один вогник у темряві. Наші бюрократи вже готуються оцінити податок на багатство міста й забезпечити належний розподіл ресурсів."
nf_mot.18.a: "До шостого штату Союзу!"

nf_mot.19.t: "З ворогом усе ясно. А з нейтралом — хто знає?"
nf_mot.19.d: "[VEG.GetLeader] відкинув нашу дружню пропозицію змінити умови Договору з Вегасом. Що ж, для цього й існує армія Республіки. Хоча це може відкрити нам фланг для удару з-за Колорадо..."
nf_mot.19.a: "До шостого штату Союзу!"

nf_mot.20.t: "Захищаючи наших клієнтів"
nf_mot.20.d: "З Легіоном біля порогу, Території Мохаве благають нас про допомогу. [MOT.GetLeader] пропонує територіальні поступки в обмін на військову підтримку. Якщо чесно — чудовий план, бо НКР загине, захищаючи нас! Як і було заплановано."
nf_mot.20.a: "Важко знайти причини відмовитися."
nf_mot.20.b: "Але ж НКР може перемогти!"

nf_mot.21.t: "Позика під заставу Гауса"
nf_mot.21.d: "Загроза Легіону змусила нас поступитися землями [VEG.GetLeader] в обмін на економічну підтримку. Сподіваємось, це не вилізе нам боком, коли армії роботів почнуть наступ на наш тил. Але ж це безглуздо… правда?"
nf_mot.21.a: "Завоюємо Вегас пізніше."

nf_mot.22.t: "Я ненавиджу Вегас"
nf_mot.22.d: "[VEG.GetLeader] відкинув нашу пропозицію й задоволено спостерігає, як Легіон знищує Мохаве. Мабуть, не розуміє, що наступними будуть вони — або сподівається, що ми всі ослабимо одне одного."
nf_mot.22.a: "Наступного разу — їду в Ріно."

nf_mot.24.t: "...Оце вже дивно"
nf_mot.24.d: "Рейнджери, що наблизилися до Чорної Гори, чують дивні балачки про «Ютобіту» — обітовану землю мутантів. Кілька точних залпів з гвинтівок — і радіостанція мовчить, з мінімальними втратами. Серед уцілілих виявився мексиканський гуль на ім’я Рауль Техада. Удячний за порятунок, Рауль запропонував свої послуги з обслуговування інфраструктури. Хіба життя не прекрасне?"
nf_mot.24.a: "Хоча б наступні 24 години."
nf_mot.24.a_tt: "\nРауль Техада зголошується на службу! Здається, вибір був між тобою й тим поштарем."

nf_mot.25.t: "Повернено відправнику"
nf_mot.25.d: "Жахливі новини! Один із кур’єрів виявив, що Генлон надсилав фальшиві звіти, перебільшуючи загрози для Нової Каліфорнії, аби зірвати нашу підтримку війни. Як ми маємо відреагувати на цю зраду?"
nf_mot.25.a: "Переконати Генлона дипломатично, що НКР переможе!"
nf_mot.25.b: "Пустити кулю в начальника."
nf_mot.25.b_tt: "Хоч це й деморалізує рейнджерів, зате посилить Олівера."

nf_mot.26.t: "Що, до біса, відбувається?"
nf_mot.26.d: "Очільник Чеєрменів повстав проти [VEG.GetLeader] за підтримки [MOT.GetLeader]. Як він сміє! Ми ж подарували йому такий шикарний костюм!"
nf_mot.26.a: "Крихітко, програти та бути зрадженим — різні речі."

nf_mot.27.t: "Три карти — три тіла"
nf_mot.27.d: "Хоча ми й узяли під контроль Сховище 3 та знищили основні сили Біснуватих кілька місяців тому, ми знали: витіснити цю мразь — ще не кінець. Після смерті Мотор-Раннера з'явилися троє нових лідерів: Вайолет, Кук-Кук і Драйвер Нефай. Протягом останніх місяців десятки підрозділів НКР вирушали на полювання — і майже всі були знищені. Ті, хто вижив, краще б загинули поруч із товаришами.\n\nДії цієї трійці скували важливі ресурси, які можна було б спрямувати проти Легіону чи Вегаса. Їхня слава стала настільки огидною, що Республіка оголосила за голови кожного по 250 кришок, а за всіх трьох — ще 300 бонусом. І от — нарешті — завдяки спільній операції 1-го Розвідзагону та елітного підрозділу братів із Баха, усіх трьох було ліквідовано одним ударом. Вартість? Дванадцять чудових солдатів. Але тепер ми можемо розблокувати ресурси, які йшли на цю боротьбу роками. Слава Богу."
nf_mot.27.a: "Ці потвори заслужили смерть."
nf_mot.27.a_tt: "§OБрати з Баха§!, §Yветеранський спецпідрозділ§! загартованих рейнджерів, стане §Gдоступним§! для перекидання зі §YСховища 6§!.\n\n"

nf_mot.28.t: "Мстиві серця"
nf_mot.28.d: "Попри успішну операцію в Біттерспрінґс, ми не змогли повністю знищити Ханів. Нещодавно ми дізнались, що залишки племені укладають угоди з Легіоном: обіцяючи підтримку в обмін на допомогу під час наступу. Навряд чи Хани становлять реальну загрозу нашому контролю в Мохаве, але ми можемо використати це як привід для вимоги додаткових постачань від уряду. Або ж сприйняти загрозу серйозно й завдати превентивного удару."
nf_mot.28.a: "Це не справжня загроза."
nf_mot.28.b: "Краще поставитися серйозно."

nf_mot.29.t: "Повернення бойових загонів"
nf_mot.29.d: "Різанина в Біттерспрінґс не знищила терор Ханів у Мохаве. Після початку нової війни з Легіоном кілька ханських бойових груп атакували наш пост у Біттерспрінґс, вирізавши всіх, кого змогли знайти. Організованість нападів свідчить про ймовірне тренування Легіоном. Тепер наша війна відкрилася на два фронти."
nf_mot.29.a: "Ми знову їх розчавимо!"
nf_mot.29.b: "Помста за Біттерспрінґс!"
nf_mot_29_tt: "§RКраїна перемикається на Великих Ханів!§!"

nf_mot.30.t: "Хаос у Каліфорнії"
nf_mot.30.d: "Політичний глухий кут на виборах у Республіці обернувся катастрофою для Територій Мохаве — країна поринула в громадянську війну. Підтримка й управління експедицією з боку НКР зникли, і кілька фракцій почали боротьбу за контроль. Генлон вагається, кого підтримати, а генерал Олівер прагне самостійно повернути собі Нову Каліфорнію. Тим часом полковник Гсу висловив підтримку Джулі Фаркас і Послідовникам Апокаліпсису, які хочуть визволити край від зовнішнього впливу. Весь Мохаве завмирає в очікуванні..."
nf_mot.30.a: "Олівер має зберегти контроль"
nf_mot.30.b: "Генлон бере ініціативу"
nf_mot.30.c: "Фаркас згуртує народ"
nf_mot_30_tt: "Три фракції §Yзмагатимуться за контроль§! над Територіями Мохаве!"

nf_mot.31.t: "Хаос у Каліфорнії"
nf_mot.31.d: "Політичний глухий кут на виборах у Республіці обернувся катастрофою для Територій Мохаве — країна поринула в громадянську війну. Підтримка й управління експедицією з боку НКР зникли, і кілька фракцій почали боротьбу за контроль. Генлон вагається, кого підтримати, а генерал Олівер прагне самостійно повернути собі Нову Каліфорнію. Тим часом полковник Гсу висловив підтримку Джулі Фаркас і Послідовникам Апокаліпсису, які хочуть визволити край від зовнішнього впливу. Весь Мохаве завмирає в очікуванні..."
nf_mot.31.a: "Олівер має зберегти контроль"
nf_mot.31.b: "Генлон бере ініціативу"
nf_mot.31.c: "Фаркас згуртує народ"

nf_mot.32.t: "Єдина нація під проводом Олівера"
nf_mot.32.d: "Генерал Лі Олівер стояв за трибуною, споглядаючи натовп. Люди з'їхалися з усіх куточків Мохаве, аби почути, що генерал скаже про останні події.\n\n\"Я чув новини, як і більшість із вас. І, на жаль, вони правдиві. Напередодні найважливіших виборів за десятиліття в НКР сталася патова ситуація. І внаслідок цього наша велика нація занурилась у громадянську війну, якої не бачили вже сотні років.\"\n\nНатовп почав перешіптуватися, солдати нервово переводили погляд і теребили зброю. Олівер відчував, як пекуче сонце стає нестерпним, чим довше він мовчав.\n\n\"ОДНАК ЖЕ! Ми — Армія Нової Каліфорнійської Республіки. Може, ми й не Конгрес у їхніх розкішних залах, і не Президент — ким би він чи вона не був цього разу. Але ми — найкраща армія в усій Каліфорнії. А якщо на те пішло — в усій Америці! Якщо Бог дасть, наша єдина нація може й розкололась, але так буде недовго!\"\n\nОлівер підняв руку, і замість старого прапора НКР над Греблею Гувера здійнявся новий — із золотим ведмедем і зірками на оливково-зеленому й коричневому тлі. Новий стяг був утричі більшим за попередній.\n\n\"Із цієї миті я запроваджую воєнний стан на всіх територіях НКРА. Наша велика Республіка могла й спіткнутись, але не впаде! Я, з Божою поміччю, побачу, як Золота доба Республіки постане знову — або хай мене скинуть із цієї греблі просто зараз! Ви зі мною, люди Мохаве?\"\n\nНатовп вибухнув оплесками.\n\n\"А ви зі мною, Арміє НКР?\"\n\nКілька солдатів підняли рушниці, дехто жбурнув шоломи в повітря. Більшість просто підіймали куряву або кивали напівбайдуже.\n\n\"А ви зі мною, Нова Каліфорніє?!\""
nf_mot.32.a: "Голоси з усього регіону злилися в одностайне скандування."

nf_mot.33.t: "Заарештувати рейнджера"
nf_mot.33.d: "Лі Олівер увійшов у кабінет начальника Генлона. Той працював над звітами щодо ситуації, яка розвивалася після запровадження надзвичайного стану та таємного проєкту «Броня Ведмедя».\n\n\"Радий бачити тебе, Олівере, я саме завершував ці... Що відбувається?\"\n\nЗа Олівером ішов невеликий загін солдатів НКР, підкріплений двома рейнджерами. Вони оточили Генлона.\n\n\"Ми знаємо, чим ти займався, Генлоне. Саме тому, хоч і важко мені це, я мушу тебе заарештувати.\"\n\nГенлон різко підвівся, але не встиг зреагувати — зброя в усіх уже була спрямована на нього.\n\n\"Якщо підеш з нами добровільно — обіцяю почесне звільнення. На жаль, я мушу доправити тебе до виправного закладу НКР на термін від 6 до 12 місяців. Якщо не втнеш дурниць — вийдеш на свободу та зможеш знову служити Республіці як лояльний громадянин.\"\n\nГенлон задумався..."
nf_mot.33.a: "Він вистрибнув із вікна, але невидимий снайпер підстрелив його."
nf_mot.33.b: "Генлон із жалем підвівся, простягнувши руки для арешту."

nf_mot.34.t: "Розплата Олівера"
nf_mot.34.d: "Цей день нарешті настав. Шейді-Сендс — його. Боньярд — його. Реддінґ — також. Уся Нова Каліфорнійська Республіка об’єднана під генералом Лі Олівером і його Територіями Мохаве, які тепер перейменовано на Фронт відбудови НКР (НКРФВ). Єдине, про що він шкодував — що Мур не здалася. Тепер її тіло гниє десь у безіменній могилі, бо вона не захотіла піти мирно.\n\nКалгуна — інша справа. Олівера не гризла совість щодо його ув’язнення. Послідовники Апокаліпсису не викликали в нього емоцій, допоки не почали «виступати» зі своїм анархізмом і комунізмом, намагаючись зруйнувати культуру баронів-брaмінів, яку він прагнув відродити.\n\nМікрофон був близько. Сотні тисяч людей ось-ось почують звернення Олівера. \"Панове, пані, і всі громадяни Нової Каліфорнії. Я — генерал Лі Олівер, колишній командувач Територій Мохаве та Армії НКР. А тепер — ваш визволитель і об’єднувач. Можливо, це смілива заява... та все ж — правда.\"\n\nОлівер звернувся до камер, що фіксували кожне його слово. \"Саме тому я більше не генерал. Я — ваш голова держави. Через відсутність кандидатів у президенти, я беру на себе відповідальність. Не знаю, чи вони ховаються, зникли, чи вже мертві.\"\n\nВін зняв військову кепку та вдягнув високий генеральський кашкет. \"Віднині я — ваш Президент-Генерал. Один із моїх підлеглих мав схожу ідею, але втілював її хибно — як, на жаль, і більшість у так званій Третій Республіці Каліфорнії. Я не знаю, коли знову відбудуться вибори, але як Президент-Генерал — ваш Президент-Генерал — я обіцяю вивести нашу Республіку з летаргії в новий сміливий світ: більший і кращий, ніж будь-коли.""
nf_mot.34.a: "\"Це був Президент-Генерал Олівер. Вихід на зв’язок завершено.\""

nf_mot.35.t: "Непохитний Генлон"
nf_mot.35.d:0 "Генлон злісно барабанив пальцями по столу, в черговий раз набираючи Олівера через рейнджерський передавач. Це був уже третій дзвінок за день. Генерал знову виголосив гучну промову для мешканців Мохаве, цього разу вихваляючись своїм проєктом «Броня Ведмедя» і тим, як це наблизить відновлення НКР.\n\nГенлон почав бурчати сам до себе: \"Ну давай же, красномовцю... такий впевнений, коли дивляться десятки очей, а от трубку взяти — кишка тонка…\" — Клацання обірвало думку: виклик прийнято.\n\n\"Генерале, радий, що нарешті відповіли.\"\n\nНа тому кінці лінії — мовчання. І лише одне слово: \"Говори.\"\n\nГенлон глибоко вдихнув. \"Генерале, з усією повагою, ця кампанія була покликана умиротворити Мохаве. Ми не збиралися відновлювати цілу Республіку. Ми й гадки не мали, що вибори можуть зупинити нас, поки це не вдарило по лобі.\"\n\nВідповіді не було. Генлон продовжив: \"Тільки на греблі ми втрачаємо щонайменше тисячу людей на рік. І це не враховуючи смертей від Біснуватих, Братства, рейдерів, Легіону й, чорт знає, кого ще. Ми тут уже... скільки? П’ять років? П’ять тисяч життів. Скільки ще ти готовий покласти за цю безглузду мрію?\"\n\nМовчання лише ставало гучнішим. \"...Лі, будь ласка. Зупини це. Дай людям повернутися додому. Вони не заслуговують на цю м’ясорубку. Але тримати їх тут — не менш ганебно.\"\n\nГенлон видихнув тяжко, як після бою. \"Добре. Будь по-твоєму. Але принаймні — виконай останнє прохання. Занадто багато чоловіків і жінок загинули у нас на очах, щоб ми тепер знищили одне одного в гонитві за те, хто з нас має рацію. Ти й я. Вирішімо це по-чоловічому.\""
nf_mot.35.a: "\"Ти чув коли-небудь про техаське протистояння?\""

nf_mot.36.t: "Поєдинок, що можливий лише в Мохаве"
nf_mot.36.d:0 "Генлон вдивлявся в свій револьвер Sequoia, крутячи ствол туди-сюди. \"За почесну службу\" і \"Проти всіх тиранів\" — напис на зброї дивився на нього у відповідь. Лише кілька місяців тому він святкував — бодай те, що було — перемогу НКР над Легіоном на греблі.\n\nА тепер? Яка НКР лишилася, аби її святкувати… або ненавидіти?\n\nПеред очима з’явилися Ретлтейл, Баха, Еліза... Спогади. Брехня, яку доводилося повторювати. Індоктринація — честь і виживання будь-якою ціною. \"НКР — найбільша держава, що існувала\". Порожнеча. Усе — нісенітниця.\n\nВін подумав зіграти в російську рулетку — але передумав. Замість цього простягнувся до спеціального рейнджерського передавача. У такі часи доводиться укладати угоди навіть із дияволом.\n\nНавіть якщо диявол — це брюнетка.\n\nА може, краще самому стати янголом для когось іншого… або хоча б мати одного на плечі."
nf_mot.36.a: "Радіо Білла Калгуна спіймало сигнал."
nf_mot.36.b: "Рація президента-генерала Мур зашуміла."

nf_mot.37.t: "Приниження"
nf_mot.37.d:0 "\"Я не можу це прийняти\", — тихо промовив Генлон, вдягаючи парадну форму для церемонії, в якій мав узяти участь.\n\nТретя Каліфорнійська Республіка перемогла. Олівера — мертвий. Калгуна — вбитий або ув’язнений. Лише Мур залишилася.\n\n\"Пора, містере Генлон\" — голос Кассандри Мур, зазвичай твердий, тепер звучав із вивченим королівським пафосом.\n\nГенлон вийшов зі своєї тимчасової гримерки до зали колишнього Конгресу НКР. Чоловіки й жінки, солдати та рейнджери аплодували. Дах зали досі не було відновлено — зірки яскраво сяяли над церемонією. Генлон лиш шкодував, що сам не сяяв так само.\n\nВін усміхався, махав побратимам, дякував поіменно. Але після третього десятка рук — просто мовчки дійшов до трибуни.\n\nМур у парадному мундирі, оздобленому пурпуровим і золотим, постукала по мікрофону:\n\n\"Сьогодні ми вшановуємо начальника рейнджерів Генлона. Він мужньо виступив проти облудної ідеї Олівера. Самотужки стримував Легіон на греблі. Він — герой усієї Каліфорнії, і приклад для всіх нас. Дякуємо тобі, Джоше Генлоне. Для тебе — найвища відзнака.\"\n\nМедаль із зображенням довоєнної Каліфорнії й символом ТКР у центрі. Великими літерами: «Герой Каліфорнії».\n\nКоли стрічку наділи йому на шию, Генлон відчув, що це радше зашморг. Він став тим, із ким боровся. І нічого не зробив, аби це зупинити.\n\nЗа будівлею розцвіли феєрверки, освітлюючи нічне небо. Але в серці Генлона лишалася темрява."
nf_mot.37.a: "Здавалося, що ніч триватиме вічно."

nf_mot.38.t: "Проти тирана?"
nf_mot.38.d: "Генлон знову опинився в знайомому місці. Сидячи в кабінеті, він втупився в свій револьвер Sequoia. Вкотре його погляд ковзав по золотому напису на стволі. Але що варті ці слова, коли рейнджери НКР — ті, хто мали б бути «проти всіх тиранів» — служать тепер одній з них?\n\nМур збожеволіла. Вона проголосила себе Президенткою-Генералом Третьої Каліфорнійської Республіки. Призначила якогось фанатичного юнака, який замість того, щоби керувати, сліпо виконував її забаганки, ставши губернатором-лейтенантом ТКР. Мур одержима: перевершити Кімбола, розгромити Цезаря, підкорити Південний Захід — і піти туди, куди НКР ще не ступала.\n\nСтарий начальник згадав, чому тоді пішов за Мур, а не за Калгуна. Калгун — хоч і дав Цезарю шлях, — передусім був цілителем, помічником. Мур — маніакальна імперіалістка. Але Генлон вирішив укласти угоду з дияволом, аби самому стати янголом на її плечі.\n\nЯким же янголом він став? Медаль без честі, титул без змісту. Він зрадив тих, кого найдужче шанував. І поки ТКР святкує — настільки, наскільки це дозволено при нових законах Мур — він залишився сам. Навіть до рейнджерів звернутися не міг: донесли б Мур, або посадили б за зраду. І втекти з ТКР він теж не міг. Навіщо бігти в Техас, якщо незабаром він теж опиниться під чоботом Мур?\n\nЦього разу револьвер був заряджений. Не порожній. Кращий чоловік відкинув би спокусу. Але Генлон уже не був таким. Він більше не вважав себе чоловіком. Лиш марионеткою Мур. Пішаком у її хворій грі. Досить."
nf_mot.38.a: "Постріл пролунав у кабінеті начальника. Ніхто його не почув."

nf_mot.39.t: "Реквієм за рейнджером"
nf_mot.39.d: "Тіло Генлона знайшли за кілька годин після його самогубства — невдовзі після того, як він отримав свою медаль. Лише Мур знала справжню причину його смерті, але відмовилася ставити під загрозу стабільність держави. Замість цього вона оголосила, що самогубство стало наслідком підступної змови іноземних сил, які прагнули позбавити ТКР її героя.\n\nМур і Гейс стояли поруч, спостерігаючи, як труну Генлона опускали в могилу. За наказом Мур викопали яму глибиною 30 футів. Після опускання труни, яму залили бетоном, а крани підняли сталевий монумент, присвячений Договору про об'єднання рейнджерів. Як тільки бетон застиг, монумент було встановлено прямо над могилою.\n\nМур глянула на тисячі присутніх і десятки тисяч тих, кого зачепила ця смерть.\n\n\"Немає слів, які могли б належно вшанувати цю людину. Тож скажу правду. Генлон був великим. Більшим серцем і розумом за багатьох тих, із ким служив. Більшим за тих, кому підпорядковувався, як-от пустомеля Олівер чи податкова п’явка Кімбол. Але його більше нема. Його забрала змова іноземних ворогів, які побачили в ньому символ Республіки та вирішили знищити наш народ, забравши в нього його право на життя, свободу й щастя.\"\n\nМур гримнула кулаком по трибуні. \"Я не зупинюся, поки ті, хто стоїть за цим, не відповідатимуть за свої дії.\" Ретельно зрежисовані сльози потекли з її очей, голос зламався з потрібною щирістю. \"Генлон значив для мене дуже багато. Для всіх нас. Я лиш жалкую, що ТІ МОНСТРИ, які його вбили, не мають ані серця, ані душі, щоб збагнути: який вогонь вони на себе накликали.\""
nf_mot.39.a: "Натовп, хоч і в сльозах, вибухнув оплесками."

nf_mot.40.t: "Гсу — для всіх, і всі — за Гсу"
nf_mot.40.d: "Джеймс Гсу та Джулі Фаркас стояли в диспетчерській вежі МакКаррана, готуючись до оголошення. Протягом тижнів вони спостерігали за марними спробами вже майже колишнього генерала Олівера заарештувати прихильників нового уряду Послідовників у НКР. Той і далі наполягав — у все коротших і менш людних промовах — що воєнний стан НКРА та спроби відновити НКР у Мохаве є єдиним шляхом для народу та армії регіону.\n\nОднак Гсу й Фаркас розуміли: рано чи пізно Олівер і його вірні спробують переворот. Все, що залишалося — слухати рацію.\n\nРадіотиша перервалася: «Група Послідовників-1 на позиції. Які накази?»\n\nГсу залишався спокійним. Поглянув на Фаркас — вона кивнула. Він натиснув кнопку передавача. «Затримайте генерала. Зачитайте йому права. Ми підготували камеру тут, у МакКаррані. Тільки ненасильницькі методи. Зброя, як домовлялися, не заряджена?»\n\nГлухе підтвердження.\n\n«Виконуємо, сер і мем.»\n\nЛунає звук вибитих дверей. Голос Олівера, сповнений гніву: хто ви, хто вас прислав? Потім — тиша. Він впізнав форму Послідовників. «Отже, нарешті прийшли за мною. Не дам вам задоволення, виродки! Ви знаєте, хто я? Я знаю Президента!»\n\nЧути боротьбу. Кілька пострілів з його .44. Стогін. Переривчасте дихання. «Я... не дозволю вам... отримати... це задоволення...» Дихання обривається.\n\nРадіо знову тріщить. Інший голос: «Він… намагався стріляти мені в голову, я спробував вирвати зброю, але той дурень продовжував тиснути на спуск, навіть коли ствол був направлений на нього… Мені шкода.»"
nf_mot.40.a: "Гсу натягнув кашкета на очі. Фаркас поклала руку йому на плече. «Це було необхідно.»"

nf_mot.41.t: "Лише спогад"
nf_mot.41.d: "Джулі Фаркас терпляче спостерігала за Лілі Бовен. Старіюча Найткін протягом кількох років була піддослідною в експериментах доктора Генрі. Хоч ніхто й не знав, куди зник Генрі, він залишив копії своїх записів Маркусу, який і передав їх Фаркас та Послідовникам.\n\nФаркас лагідно звернулася: «Як ти себе почуваєш, Лілі?»\n\nЇй ввели повну дозу препарату через залишок старого маскувального пристрою «Stealth Boy 3001 Mk II» Енклейву.\n\n«Ой, любонько, я… я… не знаю. А чому я назвала тебе так? Я ж навіть не знаю, хто ти.»\n\nФаркас знала з нотаток Генрі: одна з прикрих ознак хвороби Лілі — збережені, хоч і тьмяні, спогади про себе як бабусю двох онуків у Сховищі. Та, схоже, ліки подіяли. Хай як сумно було втрачати ці спогади.\n\nГолос Маркуса пролунала у вусі Фаркас: «Вважаю, цього досить. Повертайся в головну залу.»\n\nПовернувшись, вона побачила в Маркуса незвичний вираз суму. «Лілі була для нас особливою. Пам’ятала те, що ми забули. Бачила те, що ми — ні. Саме це робило її особливою. Вона все ще така, але вже по-іншому.»\n\nФаркас сумно кивнула, опустивши погляд на підлогу старого гірськолижного будиночка.\n\nКоли вона вже рушала, Маркус підняв руку: «Зачекай. Я ще маю борг.»\n\nВін підійшов до старої шафки, відкрив її й витягнув старенький, але ідеально збережений кулемет. Вицвілий логотип свідчив: «Rockwell CZ53 — персональний мініґан».\n\nМаркус приладнав зброю до руки, перевірив оберти. Ствол обертався з шаленою швидкістю. «Ти допомогла мені — я допоможу тобі. Жінки-деспоти — не кращі за чоловіків. Один мій друг давно показав це. Підтримуй мир у Мохаве. Якщо покличеш — підтримаю.»\n\nФаркас лише роззявлено кивнула. «Я надішлю рейнджера з рацією. Дякую, Маркусе.»"
nf_mot.41.a: "«Без проблем, Фаркас.»"

nf_mot.42.t: "Двоє кабальєро"
nf_mot.42.d: "Гсу постукав у двері до майстра, якого ще недавно утримували Супермутанти з Блек-Маунтін. Після того, як із ними вдалося досягти миру, настав час знайомств.\n\n\"Ауно моментіто!\" — пролунало з-за дверей.\n\nГсу ще не зустрічав цього мешканця Блек-Маунтін, але зі звітів солдатів знав — Гуль мексиканського походження, рідкість для Мохаве.\n\nДвері відчинилися. Перед ним стояв Гуль із вусиками, в комбінезоні з нашивкою «Petró-Chico».\n\n\"Ха! Нарешті сам начальник прийшов до мене. Що зробити, бос? Тостер полагодити? Зброю? Може, електрику на греблі перевірити?\"\n\nГсу пильно подивився. Щирий і доброзичливий — але під маскою ховалося щось більше.\n\n\"Як тебе звати?\"\n\nГуль засміявся: \"Як я вже казав твоїм людям — Рауль Альфонсо Техада. Також Міґель. Колишній стрілець, єдиний, хто вижив у маєтку Ідальго, привид Мехіко. До ваших послуг.\"\n\nОчі Гсу ледь розширилися: \"Привид і стрілець? Це саме те, що нам потрібно.\"\n\nРауль похитав головою: \"Та ну, кому потрібен старий ваґеро, як я? Хіба що костюмчик залишився — комусь іншому віддати.\"\n\nГсу потер підборіддя: \"Ти казав, що привид. А привиди за легендами не йдуть, доки не завершать свою справу. Може, повернення до життя ваґеро — саме те, чого бракує?\"\n\nРауль замислився: \"Може, я був би щасливішим, працюючи майстром чи інженером… Але хто знає? Може, ти маєш рацію.\""
nf_mot.42.a: "Гсу потиснув руку Рауля: «Ласкаво просимо до НКР, Привиде-Ваґеро.»"

nf_mot.43.t: "Підлі вчинки"
nf_mot.43.d: "\"З поверненням, пані та панове. З вами містер Нью-Вегас. Дякую, що слухаєте. А тепер — новини.\"\n\n\"Громадяни околиць Вегаса масово тікають на Стріп через хвилю терору, спричинену рейдерами, відомими як Біснуваті. І сьогодні — приголомшливі новини.\"\n\n\"Лідери Біснуватих, які називають себе Мотор-Раннер, Кук-Кук, Вайолет і Драйвер Нефай, провели спільний напад на табір МакКарран. У світлі колапсу НКР після виборчої кризи — їхній удар захопив зненацька. Втрати є з обох боків.\"\n\n\"Єдиний, хто прокоментував — Драйвер Нефай. Екс-мормон, який виступив з неочікувано вичерпною промовою про свій шлях у рейдерство й крах організованого уряду. Але, на жаль, запис не зберігся. Тож на завершення — цитата: 'НКР хай іде в сраку'.\"\n\n\"Коли запитали лідера Мохаве...\""
nf_mot.43.a: "\"Відповів, цитую: 'Ворог буде покараний'. Кінець цитати.\""
nf_mot.43.b: "\"Його було поранено в живіт, і Біснуваті швидко прорвалися до табору МакКарран.\""

nf_mot.44.t: "Зброя для Королів"
nf_mot.44.d: "Після краху НКР нова влада в Мохаве почала передавати зброю незадоволеним фракціям у Нью-Вегасі — передусім Королям. Їхня мета — організувати повстання, вибити сек'юрітронів і взяти в облогу Lucky 38. Можливо, їм вдасться. А можливо, охорона Хауза знайде підозрілий вантаж і зірве весь задум до його реалізації."
nf_mot.44.a: "Хай живе Король, малюк"
nf_mot.44.b: "Хауза не переграти"

nf_mot.441.t: "Наш новий сусід"
nf_mot.441.d: "Операція пройшла ідеально! Королі підняли Фрісайд, вигнали більшість сил Хауза з міста. Lucky 38 лишається укріпленим, а армія Хауза готує контратаку з околиць. Королі відкрили дипломатію — настав час підтримати їхню боротьбу!"
nf_mot.441.a: "Мохаве єднається!"

nf_mot.442.t: "Хауз знову виграв"
nf_mot.442.d: "Повна невдача. Сек'юрітрони перехопили зброю до того, як вона дісталася штаб-квартири Королів. Раптова облава розбила змову вщент."
nf_mot.442.a: "Схоже, доведеться діяти силою…"

  ## news events ##
nf_mot_news.1.t: "Операція «Сонячний спалах»"
nf_mot_news.1.d: "Ранком сьогодні Мохавська експедиція Нової Каліфорнійської Республіки розпочала наступ на місцеву гілку Братства Сталі. Операція під кодовою назвою «Сонячний спалах» стала результатом місяців підготовки з обох боків. Попри чисельну перевагу, експедиція поступається Братству в бойовій підготовці та технологіях, тож битва буде кривавою. Яким би не був результат — він назавжди змінить Мохаве."
nf_mot_news.1.a: "Братство — загроза миру та демократії!"
nf_mot_news.1.b: "Нашу технологію слід захистити від цього зухвалого імперіалізму!"
nf_mot_news.1.c: "Ця війна залишить шрам на обличчі Мохаве…"

nf_mot_news.2.t: "Експедиція до Розлому"
nf_mot_news.2.d: "Близько двох тижнів тому загін рейнджерів вирушив зі станції «Дельта» в серці Мохаве, щоб оцінити наслідки вибухів поблизу Гоупвілла й Ештона. Цей регіон, нині відомий як «Розлом», колись був ключовим маршрутом постачання між Шейді-Сендс та Мохаве. Тепер же — це знищена земля, спотворена серією таємничих ядерних детонацій із покинутих шахт.\n\nНКР сподівалася, що знайде прохід для своїх конвоїв, але тепер… вже тиждень не надходить жодного сигналу від загону. Вони протрималися довше за будь-яких мародерів, передавши звіти про ядерні бурі та згульованих солдатів, однак шансів на повернення майже немає. Рейнджерів офіційно визнано зниклими безвісти. Цими вихідними в Шейді-Сендс проведуть військовий похорон. Їхнє зникнення — суворе попередження: навіть найкращі не вижили у пеклі Розлому."
nf_mot_news.2.a: "Ми будемо за ними сумувати…"
nf_mot_news.2.b: "НКР мала знати, що це — прокляте місце!"

nf_mot_news.3.t: "Кінець договору з Нью-Вегасом"
nf_mot_news.3.d: "Невдовзі після захоплення греблі Гувера в 2274 році було підписано Договір із Нью-Вегасом. Угодою передбачалося постачання 5% енергії від НКР у обмін на мирні стосунки з паном Хаузом. Хоча здавалось, що НКР виграла від цього — насправді Хауз використав угоду, щоб обдирати солдатів НКР, відновлюючи Вегас на своїх умовах.\n\nНКР довгі роки не могла діяти, бо мала інші загрози — Легіон, Братство… Але сьогодні все змінилося. Через ефір Радіо Нью-Вегас пан Хауз оголосив: угоду розірвано через «акт шпигунства». Сек'юрітрони закрили посольство НКР і вигнали війська зі Стріпа. Конгрес НКР мовчить, але солдати вже перекидаються до МакКаррана."
nf_mot_news.3.a: "Хауз показав своє справжнє обличчя!"
nf_mot_news.3.b: "НКР заплатить за це!"
nf_mot_news.3.c: "Мохаве знову котиться до війни…"

nf_mot_news.4.t: "Поход на Біттерспрінґс"
nf_mot_news.4.d: "Плем’я рейдерів, що звуть себе «Великі Хани», роками шкодило нашій території. Оселившись на сході Вегаса, в таборі «Біттерспрінґс», вони вважали себе недосяжними. Прийшов час покласти край їхнім ілюзіям."
nf_mot_news.4.a: "Час розібратися з ними остаточно."

nf_mot_news.5.t: "Битва за Біттерспрінґс — польовий звіт"
nf_mot_news.5.d: "На [GetDateText] наші війська — зокрема підрозділ 1-ї розвідки — виявили велику групу Ханів у Біттерспрінґс. Ми вислали загін штурмувати табір, а снайпери перекрили шляхи для втечі.\n\nВсе пішло шкереберть… Мейор, що тоді командував, зробив помилку — подумав, що в поселенні тільки Хани-рейдери. Тож ми оточили їх. Коли стало ясно, що там є цивільні — жінки й діти — стрілянина вже почалася. Мейор занімів, і ми не змогли нічого вдіяти.\n\nКінець звіту — [GetDateText]."
nf_mot_news.5.a: "Покладемо провину на поганий зв’язок."
nf_free_mot.1.t: "Хаос у Каліфорнії"
nf_free_mot.1.d: "Поки Каліфорнія занурюється в громадянську війну, ми маємо вирішити, що робити. Хоч ми й не довіряємо квадратам з НКР, ми також не хочемо, щоб Легіон захопив Мохаве чи щоб Республіка впала під владою фашистів. Можливо, варто звернутись до Територій Мохаве з пропозицією про союз?"
nf_free_mot.1.a: "Запропонувати союз"
nf_free_mot.1.b: "Королі повинні правити Мохаве!"

nf_free_mot.2.t: "Стояти на власних ногах"
nf_free_mot.2.d: "Коли Каліфорнія розривається громадянською війною, ми стоїмо перед вибором. Зазвичай ми остерігаємося Вегаса, та цього разу Король запропонував об'єднатися — створити вільну країну, що включатиме як Вегас, так і території Мохаве. Або ж утворити союз — окремі, але рівноправні держави."
nf_free_mot.2.a: "Мохаве неможливо утримати без Вегаса."
nf_free_mot.2.b: "Мохаве об'єднала НКР, і ми залишимось вірними їй."

nf_free_mot.3.t: "Рейнджери Мохаве!"
nf_free_mot.3.d: "Схоже, деякі з послідовників Короля вирішили самоорганізуватись, аби допомогти нам. Вони надто егоцентричні на наш смак, але ми не можемо заперечити, що їхня допомога буде корисною."
nf_free_mot.3.a: "Хай благословить тебе, «Король»"

nf_free_mot.4.t: "Вільне Мохаве"
nf_free_mot.4.d: "Після допомоги у громадянській війні Король вимагає, щоб ми передали йому повний контроль над Мохаве. Відмовити складно: війна показала — ані каліфорнійці, ані невадці не бажають, щоб ми розширювали свою владу в Мохаве."
nf_free_mot.4.a: "Але ж на відпочинок ми ще зможемо туди їздити, так?"

nf_free_mot.5.t: "Вільна Каліфорнія"
nf_free_mot.5.d: "Звільнити лише Мохаве — недостатньо. Якщо ми дозволимо Мур захопити Республіку, вона невдовзі прийде й по нас. Тому об’єднаймося з Калгуном і Послідовниками — навіть якщо вони й трохи занудні."
nf_free_mot.5.a: "Нехай бути квадратом і не модно, але й правити силою — не варіант."

nf_free_mot.6.t: "Заради старих часів"
nf_free_mot.6.d: "Іноді Король блукає своїм храмом пізно вночі, коли відвідувачі вже розійшлись, а м’які гімни лунають у тиші. Він дивиться на яскраві вогні міста і згадує: все почалося, коли він знайшов зруйнований храм, флакон гелю для волосся й стародавні пісні. І слова того божества надихнули його — навчити, що кожна людина вільна слідувати власному шляху, бути собою. Що кожен — король у власному житті.\n\nДорога була дивною й заплутаною, та нарешті ця ідея стала реальністю. І поки у Вегасі є вільні люди — Король їх захищатиме. Бо мрії треба слідувати — куди б вони не вели."
nf_free_mot.6.a: "Дякую. Велике спасибі."

