state_control_2_to_3: "Наш §Yконтроль§! над цією територією §Gзростає§! з §Oпомірного§! до §Oзначного§!, зменшуючи втрати §Oживої сили§! ще на §G10%§! та знижуючи втрати §Oзапасів§! ще на §G15%§!.\n"
state_control_3_to_4: "Наш §Yконтроль§! над цією територією §Gзростає§! з §Oзначного§! до §Oвагомого§!, зменшуючи втрати §Oживої сили§! ще на §G15%§! та знижуючи втрати §Oзапасів§! ще на §G15%§!.\n"
state_control_1_to_0: "Наш §Yконтроль§! над цією територією §Rзнижується§! з §Oслабкого§! до §Oмінімального§!, що збільшує втрати §Oзапасів§! від §Rворожих нальотів§! і §Rмутованої фауни§! на §R20%§!.\n"
state_control_2_to_1: "Наш §Yконтроль§! над цією територією §Rзнижується§! з §Oпомірного§! до §Oслабкого§!, що збільшує втрати §Oживої сили§! від §Rворожих нальотів§! і §Rмутованої фауни§! на §R30%§!.\n"
state_control_3_to_2: "Наш §Yконтроль§! над цією територією §Rзнижується§! з §Oзначного§! до §Oпомірного§!, що збільшує втрати §Oживої сили§! ще на §R10%§! і підвищує втрати §Oзапасів§! ще на §R15%§!.\n"
state_control_4_to_3: "Наш §Yконтроль§! над цією територією §Rзнижується§! з §Oвагомого§! до §Oзначного§!, що збільшує втрати §Oживої сили§! ще на §R15%§! і підвищує втрати §Oзапасів§! ще на §R15%§!.\n"

mot_power_solidified_tt: "Провідна фракція §Yзахопить владу§!!"
mot_farkas_support_increase_tt: "Підтримка §WФаркас§! зросте!"
mot_oliver_support_increase_tt: "Підтримка §YОлівера§! зросте!"
mot_hanlon_support_increase_tt: "Підтримка §OГенлона§! зросте!"
mot_support_ncr_partner_tt: "Переможна фракція підтримає союзника у §Yгромадянській війні НКР§!, уклавши пакт про ненапад і військовий доступ."
mot_remain_neutral_tt: "Ми збережемо нейтралітет у громадянській війні Каліфорнії."

