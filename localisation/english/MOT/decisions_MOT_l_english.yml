l_english:
# Moj Conflict / Op Sun
MOT_MOJ_operation_sunburst: "Конфлікт у Мохаве"
MOT_MOJ_operation_sunburst_desc: "До прибуття експедиційних сил [NCR.GetNameWithFlag] у Мохаве, Братство Сталі діяло в цьому регіоні фактично без обмежень. Це дозволяло їм збирати всілякі технології як із самої пустелі, так і з торговців, що її перетинали, і доставляти їх до своєї бази на ГЕЛІОС Один. Однак після початку вторгнення НКР сутички стали неминучими. У Братства бракувало сил, щоби закріпитися деінде, окрім ГЕЛІОС Один і сусіднього комплексу Схована Долина. Тепер на генерала Лі Олівера зростає політичний тиск — від нього вимагають почати фінальний наступ на Братство та остаточно витіснити його з Мохаве.\n\nХто переможе в цій боротьбі, найімовірніше, вирішить рівень §Oпідготовки§!, а не проста сила. Чим краще ви готові, тим завзятіше битимуться ваші війська, і тим слабше опиратиметься ворог."

operation_sunburst_countdown: "Операція: Сонячний спалах"
operation_sunburst_countdown_desc: "Під сильним тиском вищого керівництва, збройне зіткнення між експедиційними силами Мохаве та місцевим осередком Братства Сталі — лише питання часу. Незабаром буде розпочато штурм ГЕЛІОС Один."

# WiNaIP
MOT_independent_war: "Війна — не ізольоване явище"
MOT_independent_war_desc: "Бої, які ми ведемо тут, у Мохаве, відлунюють по всій НКР. Уряд у Шейді-Сендс вклав значні кошти в нашу військову міць і переконав громадян, що кампанія в Мохаве буде дешевою, швидкою й безболісною. Ми ж знаємо, що це далеко не так. Але розкривати правду — небезпечно: ми й так отримуємо надто мало підтримки від НКР, а уявіть, який буде резонанс, якщо втрати стануть надто великими.\n\n§OУряд§! у Шейді-Сендс зараз [ROOT.mot_gov_opinion] наші прохання про допомогу.\n§OНарод§! НКР наразі [ROOT.mot_people_opinion] нашу кампанію."

winaif_recruit_ncr_scientists: "Передати дослідження в руки НКР"
winaif_recruit_ncr_scientists_desc: "Експедиція в Мохаве — насамперед військова. У нас є бійці, зброя, вибухівка й ножі, і ми готові до бою в будь-який момент. Проте наші дослідницькі можливості обмежені: як не дивно, Мохаве — не найкраще місце для створення наукових центрів чи вивчення тонкощів ядерної енергетики. Ми можемо скористатися ресурсами наукових інститутів НКР, щоб компенсувати власну нестачу. Але нічого не дається просто так."

winaif_petition_for_divisions: "Подати прохання про війська"
winaif_petition_for_divisions_desc: "Місцеве населення малочисленне й вороже до нашої присутності, тому спроби рекрутингу тут майже безрезультатні. Ми повністю залежимо від підкріплень із територій самої НКР. Проблема в тому, що народ не дуже горить бажанням іти воювати за Мохаве — не варто зловживати цим проханням..."
winaif_petition_for_divisions_tt: "\n§gКількість наданої нам живої сили залежить від максимальної чисельності людських ресурсів НКР. Якщо вони розширюються, це рішення дасть більше бійців, але у разі втрат територій — значно менше!§!\n"

winaif_petition_for_equipment: "Подати прохання про спорядження"
winaif_petition_for_equipment_desc: "Мохаве — пустельний край у руїнах. Майже ніде немає потужностей для масового виробництва озброєння, за винятком деяких поселень, як-от Ніптон, або захищених районів Нью-Вегаса. Хай навіть Збройові бігуни задовольняють більшість наших потреб, у разі формування нових дивізій запаси НКР можуть нам згодитися."
winaif_petition_for_equipment_tt: "\n§gКількість наданого спорядження залежить від кількості збройових заводів НКР. Якщо вони розширюються, це рішення дає більше техніки, але в разі втрати територій — менше!§!\n"

# Mojave Defence Committee
MOT_defence_committee: "Комітет оборони Мохаве"
MOT_defence_committee_desc: "Хоча генерал Олівер безперечно має талант військового стратега, кампанія в Мохаве вимагає делікатного підходу та злагодженої роботи кількох високопоставлених військових. Рішення та розмаїття поглядів, що їх виробляє Комітет оборони, є надзвичайно цінними. Проте зростає занепокоєння щодо розбіжностей усередині самого комітету. Особливо виразним є протистояння між §Oгенералом Олівером§! і §Oначальником рейнджерів Генлоном§!, які подають кардинально різні стратегії.\n\n§OГенерал Олівер§! наразі має §O[ROOT.mot_oliver_hanlon_ballance]§! §Oначальника Генлона§!."

# MOT - NCR Civil War
MOT_NCR_civil_war: "Громадянська війна в НКР"
MOT_NCR_civil_war_desc: "Наші каліфорнійські брати зазнали повного краху, і тепер НКР загрузла в громадянській війні. Нам потрібен сильний лідер, аби втримати крихкий контроль над Мохаве.\n\n§OПідтримка Джулі Фаркас§!: [?mot_farkas_support|%W]\n§OПідтримка генерала Олівера§!: [?mot_oliver_support|%Y]\n§OПідтримка рейнджера Генлона§!: [?mot_hanlon_support|%R]\n\nДосягнення §G50%§! підтримки дозволить нам утвердити владу!"

power_solidified_countdown: "Кінець боротьби за владу"
power_solidified_countdown_desc: "Фаркас, Генлон і Олівер ведуть шалену гонитву за контроль над Територіями Мохаве. Упродовж 90 днів ця боротьба досягне кульмінації."

hanlon_takes_action: "Генлон діє"
hanlon_takes_action_desc: "Рейнджери Генлона загрожують нашому контролю над Мохаве. Здається, вони вірять, що зможуть змусити нас підкоритися його владі."

oliver_takes_action: "Олівер діє"
oliver_takes_action_desc: "Сили НКР, вірні Оліверу, жорстко придушують спроби усунути його з посади. Їхня сліпа відданість може згубити [MOT.GetName]."

farkas_takes_action: "Фаркас діє"
farkas_takes_action_desc: "Послідовники Апокаліпсису продовжують реалізовувати план повалення нашого уряду. Якщо хочемо їх зупинити — слід діяти швидко."

mot_supply_for_support: "Розподілити запаси"
mot_supply_for_support_desc: "Населення Мохаве гостро потребує нашої допомоги. Стратегічна роздача ресурсів — надійний спосіб здобути їхню підтримку."

mot_pp_for_supply: "Реорганізувати логістику"
mot_pp_for_supply_desc: "Постачання — це постійна проблема нашого уряду, але, можливо, вона не така вже й неподоланна. Ми можемо покращити збір і облік запасів, хоча це потребуватиме часу."

MOT_civil_war_decided: "Боротьба за владу під час громадянської війни в НКР завершилася."

