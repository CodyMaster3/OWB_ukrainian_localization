ATM_SISTER_ROSE_NAME:0 "Сестра Роуз"
ATM_SISTER_ROSE_DESC:0 "Сестра Роуз – пристрасна жінка, що не терпить ані сумнівів, ані невдач, та саме ця палкість стала джерелом сили для тих, хто її оточує. У той час як багато її братів і сестер по Атомові досі тримають у серці виснаження та випробування під час їхнього походу на захід, погляд Роуз рішуче спрямований у майбутнє. Безліч священних шахт розкидано по Дакотах і ще далі, й вона щиро бажає присвятити кожну з них як новий храм Славному Атомові. Лише тоді Він зійде – й принесе День Поділу!"

