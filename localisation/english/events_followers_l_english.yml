l_english:
followers.1.t:0 "«Послідовники Апокаліпсису»"
followers.1.d:0 "Після свого недавнього укорінення в державах наших сусідів, група гуманітарних пацифістів, що називає себе «Послідовники Апокаліпсису», почала проникати і до наших земель. Їхня мета здається благородною: надання допомоги нужденним — від медичної опіки до сільськогосподарських порад. Вони дбають про ті частини суспільства, про які ми воліємо не згадувати: безхатченків, наркоманів та покинутих — і приймають усіх, кому більше нікуди звернутися. І хоча за це важко їх засуджувати — хто ж відмовиться від безкоштовних ліків? — проблеми починаються при ближчому розгляді.\n\nЯкщо подивитись на наших сусідів, де Послідовники вже давно оселилися, ми побачимо інше обличчя цього руху. Підтримка будь-якої війни серед населення падає, люди воліють залишитися на фермах та займатися травами й мазями. Є навіть свідчення, що Послідовники приймають до себе сектантів-анархістів, які мають на меті або спалити нашу націю до тла, або захопити в ній владу.\n\nОтже, ми маємо вирішити: чи дозволимо цим Послідовникам з їхніми дивними переконаннями закріпитися в наших землях? Їхня присутність принесе очевидну вигоду — але якою ціною у майбутньому?"
followers.1.a:0 "Нехай ідуть — від них буде лише користь."
followers.1.b:0 "Краще не пускати цих анархістів у наші землі!"
followers.1.c:0 "Що? Вони так не можуть! Стріляйте... чи щось таке!"

followers.2.t:0 "Послідовники укорінилися"
followers.2.d:0 "Не здогадавшись, що ми стоїмо за спробами скористатися їхньою присутністю, Послідовники Апокаліпсису зрештою розповсюдились нашою країною. Вони захопили кілька фортів, веж і баз по всій території, використовуючи їх як медичні центри та хаби знань. Населення зростає: і немовлята, і поранені солдати отримують лікування. Фермери вирощують щедрі врожаї завдяки порадам Послідовників.\n\nАле разом із цими благами приходить і загроза — ідеї Послідовників повільно проникають у свідомість населення. Молодь складає зброю, обираючи фермерство. Діти вчаться основам медицини. І всі, хто отримав допомогу, пам’ятають про борг перед Послідовниками. Їхній вплив зростає. Ми ще можемо тримати це під контролем і отримувати зиск, але слід бути насторожі..."
followers.2.a:0 "Наші стосунки будуть взаємовигідними!"

followers.3.t:0 "Послідовники дісталися столиці"
followers.3.d:0 "Перші кроки Послідовників на нашій землі були обережними. Вони вивчали нашу реакцію, оцінювали ризики. І, побачивши, що ми не реагуємо з насильством, вирішили вкорінитися в столиці. Це потішило робітників і збирачів, але довело до сказу аристократів: чому освіта, яку Послідовники роздають безкоштовно, повинна діставатися кожному, а не тільки їхнім дітям? І все ж навіть вони починають змінювати думку — адже медицина Послідовників рятує життя."
followers.3.a:0 "Вони ще не повністю оселилися. Ще ні."

followers.4.t:0 "Послідовники відкинуті"
followers.4.d:0 "Після того, як вони виявили, що ми стояли за низкою спроб підірвати їхній вплив і привласнити їхні запаси, Послідовники Апокаліпсису зрештою покинули наші землі. Вони все ще згодні допомагати цивільному населенню на прикордонних базах, але відмовляються заходити до нашої держави. І слава Богу! Цим анархістам тут не місце. Наш народ трохи обурений, але хоча б більше не буде підданий їхній пропаганді."
followers.4.a:0 "Ми вчинили правильно."

followers.5.t:0 "Вплив Послідовників виходить з-під контролю"
followers.5.d:0 "Останні тижні та місяці стали свідками небаченого зростання впливу Послідовників. Вони вже мали авторитет серед простих людей, але тепер до них схиляються й впливові родини. Багато хто з них завдячує Послідовникам життям дітей, урожаями, знанням. Люди чесні — вони завжди платять борги. І от Послідовники почали масово ці борги вимагати. Вони більше не лише закликають до миру — вони претендують на посади, витісняючи наших лоялістів.\n\nБільшість Послідовників не визнають свою причетність, але ми давно підозрювали: серед них є група анархістів. Це може бути дрібниця. Але чи готові ми ризикувати?"
followers.5.a:0 "Ми мусимо діяти — і негайно..."

followers.6.t:0 "Наліт Послідовників на Станцію Армагеддон"
followers.6.d:0 "Розлючені нашою відмовою знищити нову ядерну зброю, фанатична група Послідовників Апокаліпсису здійснила збройний наліт на Станцію Армагеддон — місце, де зберігається наша бомба. Озброєні до зубів, ці Послідовники, здається, повністю забули про свою пацифістську філософію, й зараз прориваються крізь нашу оборону.\n\nВсі офіційні джерела Послідовників, до яких ми звернулися за поясненнями, категорично засудили дії радикалів, але закликали нас до стриманості по відношенню до інших членів організації. Але чи маємо ми час на обережність, коли на кону — найцінніша зброя нації?"
followers.6.a:0 "Знищити їх. Усі до одного."
followers.6.b:0 "Це зовсім не схоже на Послідовників!"

followers_successful_disarm_tt:0 "Послідовники §Yуспішно§! знешкоджують нашу бомбу."
followers_unfortunate_accident_tt:0 "стається §Rжахлива аварія!§!"
followers_put_down_raid_tt:0 "наліт §Gвчасно придушено§!."
followers_encouraged_tt:0 "§YМи дозволяємо Послідовникам Апокаліпсису оселитися в наших землях без перешкод.\n\nПослідовники — це фракція, яка надає спеціальні рішення з корисними ефектами. Але якщо ми будемо жорстокими, кривавими й безжальними — вони можуть виступити з власними вимогами!§!"
followers_discourage_tt:0 "§YРозблокує серію§! §Rворожих рішень§!, §Yякі ми можемо вжити проти Послідовників, щоб не дозволити їм укорінитися в наших землях.§!\n\n"
followers_fight_off_tt:0 "§YНаш народ настільки жорстокий, що Послідовники просто бояться навіть наблизитися до нас.§!"
followers_need_to_do_negative_actions:0 "§YМи маємо вжити низку дій, аби належно відлякати Послідовників Апокаліпсису від укорінення в наших землях.§!\n§gІнакше вони вкоріняться — і позбутися їх буде неможливо!§!\n"
