l_english:
# Події

nf_grd.1.t:0 "Не Говори, Не Слухай"
nf_grd.1.d:0 "Коли радіозвернення Мексона лунали пусткою після Великої Війни, не всі військові підрозділи погодились із його наказами та архаїчними доктринами. Один із таких – Стражі, які вирішили сформувати власні угоди.\n\nХоч вони й поділяли занепокоєння щодо технологій – небезпечних у неправильних руках, законних у їхніх – та ще більше вірили у силу слова. У кожного є голос і ідеали, але не всі з них справедливі, і саме так часто народжується руйнування – з невірних наказів, особливо накладених на слабкодухих.\n\nТож Стражі припинили зв’язок із Лост-Гіллз, торгівцями та навіть рештою пустки – боячись, що зіпсованість скрутить їхню волю. Під проводом непохитного Кардинала Скотта, вони мають намір дотриматися свого шляху."
nf_grd.1.a:0 "З ним світове безумство втопиться в мовчанні."
nf_grd.1.b:0 "Але й дослухатись до світу – не така вже й погана ідея."

nf_grd.2.t:0 "Золото в Болотах"
nf_grd.2.d:0 "Стражі не стали винятком у чутках про Скарб Долини. Будь-який зовнішній вплив був небезпекою, і Кардинал почав підозрювати, що цей “скарб” – ще одна байка, приманка для слабких. Але його прагнення до прогресу було нестримним. З роками їхні ряди зменшувались. Нове покоління Стражів прагнуло зовнішнього світу – багато хто помер, аби його побачити.\n\nБалансуючи між небажанням порушити священний протокол і страхом перед зростаючим невдоволенням, Кардинал знайшов компроміс. Дослідження вглиб долини в пошуках “скарбу” було санкціоновано. Так Кардинал сподівався на внутрішній спокій – або хоча б на істину про цей скарб."
nf_grd.2.a:0 "Експедиції виявилися плідними."
nf_grd.2.b:0 "Та, на жаль, нічого не знайдено. Але уроки винесено."

nf_grd.3.t:0 "Сірий Шум Минулого"
nf_grd.3.d:0 "Канал 4 залишався загадкою роками. Лідери до Кардинала прокляли його, вважаючи спокусою демонів, та Кардинал вчився на чужих помилках. Це була не приманка. Це було випробування – сповнене технологій, без сумніву. Бо яка ще сила могла б вести шоу, що безперервно транслює життя фальшивих людей? Це була загадка, і Кардинал був упевнений у собі. Нагорода того варта."
nf_grd.3.a:0 "У долині завжди коїться щось дивне."
