# Decisions
TPL_recolor_the_moon:0 "Перефарбувати Місяць"
TPL_recolor_the_moon_desc:0 "Шаман-Король Бурс Місяць замутнить води Великої Сіу, що з часом призведе до зміни кольору Місяця в небі."

# Decision Categories
TPL_moon_category:0 "Скерування §RМісяця§!"
TPL_moon_category_desc:0 "Сила Місяця впливати на Два Народи походить з його уявного зв’язку з божественною волею. Проте походження криваво-червоного Місяця — цілком земне. Виконуючи складний ритуал зміни викидів місцевої річкової фауни, Шаман-Король здатен змінити колір Місяця, навіюючи або час миру, або час війни для Двох Народів."

# Tooltips
TPL_switch_moon_tt:0 "Колір місяця §Yзміниться§!, сповіщаючи про прихід часу миру або часу війни!\n"
