l_english:
nf_bth_archie.1.t:0 "НЕПРИЄМНОСТІ В РАЮ?!"
nf_bth_archie.1.d:0 "Сестричко? Сподіваюсь, ти за нею скучила! \n\nДзінь-дзінь-дзінь! Це ранковий дзвін, братики й сестрички! А раз уже мова про сімейку — Братство, ага? Гучне слово для збіговиська божевільних в броні з плазмовою перегрівкою. Можете їх ненавидіти, терпіти, але не заперечите — це гаряча плутанина. Не те що вони не можуть загнати під замок таких як ми з вами, так ще й самі себе тримати не здатні!\n\nПташечка нашептала мені, що їхні “Сестри” щойно дістали черевика після проваленого перевороту! Як мило, га? А що з цими Сестрами, питаєте? 'Бах!' — і голівки злетіли, інші припали до землі, а хто зміг утекти — загубилися в хащах... Разом з бронею, якщо ви розумієте, про що я. \n\nНу що ж, приємного полювання, Святі!"
nf_bth_archie.1.a:0 "Вороги Монтанщини сміливішають."

nf_bth_archie.2.t:0 "НЕПРИЄМНОСТІ В РАЮ?!"
nf_bth_archie.2.d:0 "Поплач таткові вдома! \n\nДзінь-дзінь-дзінь! Це ранковий дзвін, братики й сестрички! А раз вже мова про сімейку — Братство, ага? Гучне слово для збіговиська божевільних в броні з плазмовою перегрівкою. Можете їх ненавидіти, терпіти, але не заперечите — це справжнє шоу. Не те щоб вони здатні стримати таких як ми з вами, так ще й власних не можуть втримати!\n\nПташечка нашептала мені, що “Сестри” — бунтівна група в лавах Братства з Монтанщини — щойно викинули свого босса! Як мило, га? Тепер хвилі вигнанців з Братства розтікаються по краю. Але це вам не місцеві — вони землі не знають, і я чув, ця ваша «силова броня» гарно продається, якщо ви вловлюєте натяк! \n\nНу що ж, приємного полювання, Святі!"
nf_bth_archie.2.a:0 "Вороги Монтанщини сміливішають."

nf_bth_archie.3.t:0 "ЗІРКИ, СМУЖКИ І ВСЕ ЧАРІВНЕ"
nf_bth_archie.3.d:0 "Це тільки мені здається? Чи стало трохи... визвольніше?\n\nПідніміть келих за всіх бешкетників там, на волі. За хлопців, що працюють у полі, та дівчат, що влаштовують добре заслужений безлад! Але якщо підняти очі до неба, а потім глянути на північний захід — що побачите? Смужки. Зірки. Червоне, синє, біле. Можливо, навіть зелену даму з факелом.\n\nКульт Свободи, як вони себе називають. Велика тусовка людей, які шаленіють від Американи. Тобто купка психів! Як би там не було, ви знаєте правила. Я за спостереження. Але якщо Грішник перетне межу — вмажте йому! Бережіть себе й лишайтесь божевільними, Святі!"
nf_bth_archie.3.a:0 "Іменем Америки?"
