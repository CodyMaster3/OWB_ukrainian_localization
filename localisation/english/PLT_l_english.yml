plt_dealing_with_destiny:0 "Розібратись із Долею"
plt_dealing_with_destiny_desc:0 "\n\n§GПОВІДОМЛЕННЯ CSIS.§!\n\n§RЛИШЕ ДЛЯ УПОВНОВАЖЕНОГО ПЕРСОНАЛУ.§!\n\n§gНадія,\n\nТехнології твоєї сестри для нас дуже цінні — як, без сумніву, вона цінна і для тебе. Рано чи пізно, вона постукає до тебе у двері — або ти до неї. Захоплення МАНІФЕСТ Північ буде взаємовигідним — і ми допоможемо тобі знову побачити сестру цілою та неушкодженою. Маєш моє слово.§!"

plt_secure_MANIFEST_north:0 "Захоплення МАНІФЕСТ Північ"
plt_secure_MANIFEST_north_desc:0 "\n\n§GПОВІДОМЛЕННЯ CSIS.§!\n\n§RЛИШЕ ДЛЯ УПОВНОВАЖЕНОГО ПЕРСОНАЛУ.§!\n\n§gНадія,\n\nТепер, коли ти повернула МАНІФЕСТ Північ, ми надішлемо кількох агентів, щоб допомогти в його «подальшому» забезпеченні.§!"

plt_the_buffer:0 "Проблемні Йорктонці"
plt_the_buffer_desc:0 "\n\n§GПОВІДОМЛЕННЯ CSIS.§!\n\n§RЛИШЕ ДЛЯ УПОВНОВАЖЕНОГО ПЕРСОНАЛУ.§!\n\n§gНадія,\n\nЙорктонці вже довго нам докучають. Просимо тебе розібратись із ними на знак виконання своєї частини угоди.§!"

plt_fighting_manitoba:0 "Повалити Нелегітимне Королівство"
plt_fighting_manitoba_desc:0 "\n\n§GПОВІДОМЛЕННЯ CSIS.§!\n\n§RЛИШЕ ДЛЯ УПОВНОВАЖЕНОГО ПЕРСОНАЛУ.§!\n\n§gНадія,\n\nПерш ніж святкувати падіння Йорктонів, у нас є ціль побільше — так зване «Королівство Манітоби». Щойно ти розпочнеш наступ, ми активуємо наших агентів глибоко в їхніх землях.§!"

plt_secure_BRA:0 "Захоплення «Королівства»"
plt_secure_BRA_desc:0 "§GПОВІДОМЛЕННЯ CSIS.§!\n\n§RЛИШЕ ДЛЯ УПОВНОВАЖЕНОГО ПЕРСОНАЛУ.§!\n\n§gНадія,\n\nЯ та мої колеги вважаємо Королівство Манітоби сумнівною владою — особливо враховуючи роль короля в історії Канади. Усунення його та його васалів було б надзвичайно корисним для нашої справи.§!"

plt_securing_winnipeg:0 "Повернути Уінніпеґ"
plt_securing_winnipeg_desc:0 "§GПОВІДОМЛЕННЯ CSIS.§!\n\n§RЛИШЕ ДЛЯ УПОВНОВАЖЕНОГО ПЕРСОНАЛУ.§!\n\n§gНадія,\n\nРеспубліка Трьох Річок контролює одне з найвеличніших міст Канади, дозволяючи йому занепадати через внутрішні чвари та слабке керівництво. Ми це змінимо. Серце Континенту заслуговує на краще.§!"

plt_clear_winnipeg:0 "Забезпечити Контроль над Уінніпеґом"
plt_clear_winnipeg_desc:0 "§GПОВІДОМЛЕННЯ CSIS.§!\n\n§RЛИШЕ ДЛЯ УПОВНОВАЖЕНОГО ПЕРСОНАЛУ.§!\n\n§gНадія,\n\nТепер, коли Республіка Трьох Річок знищена, ми почнемо відбудову Уінніпеґа до його колишньої слави.§!"

plt_securing_dam:0 "Живлення Народу"
plt_securing_dam_desc:0 "§GПОВІДОМЛЕННЯ CSIS.§!\n\n§RЛИШЕ ДЛЯ УПОВНОВАЖЕНОГО ПЕРСОНАЛУ.§!\n\n§gНадія,\n\nРейдери та інші покидьки зайняли одну з найважливіших дамб у регіоні. Якщо ми її розчистимо, то зможемо повернути значну частину енергії народу.§!"

plt_secure_dam_array:0 "Контроль Над Проклятою Дамбою"
plt_secure_dam_array_desc:0 "§GПОВІДОМЛЕННЯ CSIS.§!\n\n§RЛИШЕ ДЛЯ УПОВНОВАЖЕНОГО ПЕРСОНАЛУ.§!\n\n§gНадія,\n\nДякуємо за блискавичне захоплення дамби, але сподіваємось, ти не проти, якщо ми розмістимо кількох агентів довкола. Для безпеки, звісно.§!"

plt_awaiting_further_orders:0 "Пам'ятай Директиву"
plt_awaiting_further_orders_desc:0 "§MO Canada! Our home and native land! \n\nTrue patriot love thou dost in us command. \n\nWe see thee rising fair, dear land, \n\nThe True North, strong and free; \n\nAnd stand on guard, O Canada, \n\nWe stand on guard for thee.§!"

