l_english:
  #characters

  PLT_FRANKIE_DESC:0 ""Вибори? Кваліфіковані особи? Держава хоч і виборна, але скажіть мені: що більшість людей тут, у Кетчі, роблять? Забруднюють усе жирними пальцями та лижуть дверні ручки? Я не пущу нікого у це крісло, якщо його прізвище не 'Чейз', і крапка." —Максвелл Чейз, мер Плезантдейлу\n\nФренкі Чейз, старша й єдина вціліла дитина Максвелла Чейза, змушена була зайняти посаду мера після його зникнення. Хоч вона ще підліток і помітно нервує, Френкі старається зберігати ту саму стриману впевненість і маніакальну контрольованість, якою славився її батько."

  PLT_HOPE_DESC:0 "§M“Привіт, я твоя нова особиста помічниця — на все життя!”§!\n\nЯк і її сестра Доля, Надія була ШІ, створеним корпорацією МАНІФЕСТ. Поки Доля виконувала силові функції, Надія призначалась для допоміжної ролі. Хоча вона мало цікавиться своїм початковим призначенням, Надія ОБОЖНЮЄ допомагати людям. І настільки сильно, що зберегла більшу частину інфраструктури МАНІФЕСТ у Саскачевані! Разом із Максвеллом Чейзом вона створила великі речі: від Фейрі до Люциферів, які роблять Плезантдейл такою жахливою утопією."

  PLT_BARKFACE_DESC:0 "§YВітаємо, Олівія Бакстер.§!\n\n§RSUBJECT: 'BARKFACE'§!\n\n§YБаркфейс — Фейрі другого покоління, а це означає, що вона достатньо стара, аби стати жертвою Арборифікації. Але, з якихось причин, вона зачепила тільки її голову. Хоч ми хотіли б її дослідити, вона погрожує нас розчленувати при кожній спробі наблизитись. Сподіваємось встигнути зібрати хоч трохи даних до того, як вона перетвориться повністю.§!"

  PLT_CATCAT_DESC:0 "§YВітаємо, Олівія Бакстер.§!\n\n§RSUBJECT: 'Catcat'§!\n\n§YЦе вже щось дивне: хоча Кеткет належить до досить старого третього покоління Фейрі, вона не проявляє жодної агресії. Навпаки — вона захищає своїх друзів під час тренувань. Ми не можемо її досліджувати без ризику вбити, але сама по собі вона заслуговує уваги.§!"

  PLT_HOLLY_DESC:0 "§YВітаємо, Олівія Бакстер.§!\n\n§RSUBJECT: 'Holly'§!\n\n§YГоллі — ще один цікавий випадок. Хоч вона доброзичлива й ласкава до інших Фейрі, у бою вона, як описав її інструктор, — справжній звір. Вона дуже прагне битви, але її жорстокість викликає занепокоєння. Кажуть, їй навіть подобається вбивати. Я б не хотів бути на місці її ворогів.§!"

  PLT_BORSEY_DESC:0 "§YВітаємо, Олівія Бакстер.§!\n\n§RSUBJECT: 'Borsey'§!\n\n§YБорсі — одна з молодших Фейрі, але рухається повільно й з болем, наче стара. Медичні огляди показали, що її суглоби, ймовірно, мутували — кістки стираються одна об одну. Ми утримались від операцій, але вона добре показала себе в тестах на витривалість і розум. Порсі — її 'сестра', хоч і лише формально, і це одна з небагатьох пар, яких ми рекомендуємо до спільної служби.§!"

  PLT_PORSEY_DESC:0 "§YВітаємо, Олівія Бакстер.§!\n\n§RSUBJECT: 'Porsey'§!\n\n§YПорсі — одна з наймолодших Фейрі, готових до польових завдань. Вона надмірно енергійна, постійно рухається і не може зосередитися. Їй потрібні постійні стимуляції, щоб вона не руйнувала навколо. Борсі виступає як її прийомна сестра й утримує її в рамках. Рекомендуємо не розділяти.§!"

  plt_chase_body_found_flag:0 "Необхідно з’ясувати долю Максвелла Чейза!"
  plt_hope_tookover:0 "§MНадія захопила контроль над Плезантдейлом§!"
  plt_frankie_stays:0 "§YФренкі утримала контроль над Плезантдейлом§!"

  nf_plt.1.t:0 "Ласкаво просимо до Плезантдейлу"
  nf_plt.1.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GЛАСКАВО ПРОСИМО ДО ПЛЕЗАНТДЕЙЛУ§!\n\n§BКолишні манітобці, реформовані рейдери, виживальники з Багряної Завії — ви тут, бо втомилися від решти світу і шукали притулок від божевілля. Ну, це не ми. Але й що тепер вважати нормальним? \n\nЯкщо ви справді сюди дістались, і вас не намагалися пристрелити, це вже прогрес, тож дозвольте мені пояснити. Я — Максвелл Чейз, мер Плезантдейлу.\n\nМожливо, ви щось чули про нас, тож одразу проясню. Так, у нас найвищий рівень смертності серед немовлят. На щастя, це не зачіпає ні мене, ні вас, друже. Отже, якщо ви ненавидите дітей — це ідеальне місце для вас. Що ще?.. Ах, так. Якщо вас лякали наслідками вживання Червоного Папоротю — не переймайтесь. Хвилюєтесь? Просто не куріть його! Все просто.\n\nА ще, якщо ви з Дандерну — моя жінка трохи упереджено ставиться до нашого стилю керівництва. Не слухайте її. Вона з глузду з’їхала й хоче запхати ваш мозок у металеву банку.§!"

  nf_plt.1.a:0 "Яке миле й справедливе містечко!"
  nf_plt.1.b:0 "Стільки простору для розваг!"
  nf_plt.1.c:0 "Бізнес іде вгору!"

  nf_plt.2.t:0 "Програма Фейрі"
  nf_plt.2.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GПРОГРАМА ФЕЙРІ§!\n\n§BОтже. Багато хто хоче, щоб я пояснив "хто, що і де" щодо Фейрі — наших неймовірних і відданих захисників. У Плезантдейлі немає регулярної армії. Ну подивіться на нас. Ми не воїни — ми просто хочемо жити щасливо, подалі від решти світу. Чи то гра в міні-гольф посеред хуртовини, чи поїдання пирога з мутфрута біля клубу Red Heels — я за.\n\nЯ не той, хто дозволить вдарити себе в щелепу й нічого не зробити, тому коли Тобогган прийшов і сказав мені: “75% дітей у твоєму місті вмирають,” я сказав йому засунути свої дані собі знаєш куди, і що я сам перший, хто буде хвилюватися про Плезантдейл. А я ніколи не хвилююся, тож я це виправив. Ми можемо завжди визначити, якщо дитина має симптоми — гнійники, кашель чи щось подібне. Ми її забираємо — і не даємо їй померти. Як? Програма Фейрі.\n\nПовірте мені: якби ми не втрутились, ці діти померли б і тільки погіршили б ситуацію. А так — вони служать громаді й приносять користь. Бо що ми мали б робити — відкрити величезне приватне кладовище для кожного трупика чотиримісячного Джона чи Джейн? Абсурд.\n\nФейрі — наші спритні, щасливі захисники, і крапка. Якщо комусь щось не подобається — ну що ж, напевно, їм дуже цікаво буде послухати геополітичні думки чергового брудного пустельника!§!"
  nf_plt.2.a:0 "Немає армії, кажеш? Побачимо ще!"
  nf_plt.2.b:0 "Сподіваюсь, ці Фейрі добре озброєні!"
  nf_plt.2.c:0 "Що ж, треба виробляти для них побільше!"

  nf_plt.3.t:0 "Наш найкращий експорт"
  nf_plt.3.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GЛюцифери§!\n\n§BЦе питання завжди заводить людей. Отже! Саме Червоний Папороть — причина, чому ми тут. Чудовий наркотик, а ще з нього можна робити ще кращу хімію. Все, чого тільки душа пустельника бажає — настільки потужний кайф, що з його допомогою можна витягти Умбравора з темряви. І лікувальні властивості в нього просто неймовірні. Наші лаборанти щотижня знаходять щось нове, чесно.\n\nНайкрутіше з цього всього — Люцифери. Це такі сигарети, які викликають тимчасову "мутацію" у крові чи щось таке. Закуриш — і раптом у тебе палець вогнем плюється, або нюх в десять разів гостріший. Це не кайф — це мутація. Не підпалюйте друзів заради жарту. І таке вже траплялось. Часто.\n\nСуть у чому, друзі: ми продаємо психічні сили, які отримуєш із затяжки. Якщо це не магія Плезантдейлу, то я не знаю, що тоді.§!"
  nf_plt.3.a:0 "Звучить неетично, але байдуже."

  nf_plt.4.t:0 "Електростанція Плезантдейлу"
  nf_plt.4.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GМИ ЛЮБИМО, КОЛИ СВІТИТЬСЯ СВІТЛО§!\n\n§BОдразу прояснимо: ми не звірі. Ми любимо, коли світиться. І, на відміну від якихось довоєнних йолопів, я не можу просто кидати кришки на лоба якогось бовдура на станції й надіятись на краще. Ми мусили створити свою. А отже — мусимо стежити, щоб вона працювала. Бо інакше — ми чергове сміттєселище в хуртовині, що чекає на смерть.\n\nО, і якщо світло згасне й ви побачите Дебору — бийте її по куполу так, щоб мозок перекинувся. Не переживайте — вона вас не вдарить, якщо ви не скажете, що хотіли цього. А якщо мовчки зробите "наїзд", вона знатиме, що то від мене.§!"
  nf_plt.4.a:0 "Оце справжній лідер!"

  nf_plt.5.t:0 "Спектральний Кабал"
  nf_plt.5.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GНаркомани в розкішних костюмах§!\n\n§BМені доповіли, що тут з'явилась група “просвітлених” у гарних костюмах, які влаштовують вечірки й разом палять Червоний Папороть. Вони називають себе 'політичними впливовцями' та 'визнаними геніями'. Давайте розставимо крапки над “і”. У вас нема суперсил, і ви не є якимись важливими особами у Плезантдейлі. Ви — просто купка дурнів, що тулиться в кімнаті на двохсотлітньому килимі, димить з люльки й вдає, що розуміє щось про світ.\n\nМоя думка? Якщо вам хочеться вивісити тотем і співати “щасливий день” довкола калюжі, що ви сперли з Пасу — ваше право. Але не думайте, що маєте якийсь космічний вплив на місто.\n\nЦе місто заснували Чейзи — і з ними ж воно помре.§!"
  nf_plt.5.a:0 "Червоний Папороть — та ще хімія!"

  nf_plt.6.t:0 "Клуб Білої Берези"
  nf_plt.6.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GЛюди мого ґатунку§!\n\n§BТовариство Білої Берези — оце люди по мені. Саме через них я й фінансував Плезантдейл: ми всі тут для того, щоб добре проводити час. Чи то гольф у степу, чи постріл у здоровенного лося в глушині — ОЦЕ і є причина існування Плезантдейлу.\n\nДжон — хороша людина. Багатий засранець, але хто тут не такий? Хочеш співчуття — йди в нетрі Дандерна чи в божевільню Тобоггана. А тут — місто для задоволення. Це наше кредо. Якщо що — Клуб Білої Берези твій найкращий друг.§!"
  nf_plt.6.a:0 "То от навіщо ми тут?.."

  nf_plt.7.t:0 "Вітаємо, Френкі!"
  nf_plt.7.d:0 "§BПривіт! \n\nМене звати НАДІЯ. Я була особистою помічницею та консьєржем для твоїх батьків, і тепер, коли ти, Мx. Чейз, очолюєш місто — все, певно, трохи зміниться. Я тут, щоб допомогти тобі, як би все не склалося. І якщо тобі стане занадто важко — просто скажи мені про це!§!"
  nf_plt.7.a:0 "Я впевнений, ти цілком стабільна!"
  nf_plt.7.b:0 "Ем... Це пояснює набагато більше, ніж мало б."

  nf_plt.8.t:0 "Невелика криза"
  nf_plt.8.d:0 "Після розлучення Ґлорії та Максвелла Чейза, Максвелл став замкнутим — виходив зі свого маєтку лише на щорічні зимові фестивалі. Проте в 2274-му всіх приголомшило: розпочали Зимову Смаженину — а Максвелла ніде не видно.\n\nУсі спроби зв'язатися з ним провалилися — навіть психо-мутант, якому дозволили увірватися в маєток, спричинив лише пошкодження майна. Тепер усі погляди звернені на Mx. Френкі Чейза, єдину живу дитину Максвелла, яка має повести місто у новий рік..."
  nf_plt.8.a:0 "Френкі хотіли зберегти все як було."
  nf_plt.8.b:0 "Френкі хотіли дослухатися до радників батька."
  nf_plt.8.c:0 "Френкі потребували допомоги, але не довіряли й раді."

  nf_plt.9.t:0 "Смерть у Плезантдейлі!"
  nf_plt.9.d:0 "Сьогодні вранці мисливець з Клубу Білої Берези знайшов страшну знахідку біля північної річки: тіло мера Максвелла Чейза висіло на зігнутій гілці, напіврозкладене після тижнів, проведених у дикій місцевості, і дивом не з’їдене хижаками. При ньому виявили журнал із його останніми словами..."
  nf_plt.9.a:0 "Жахливий день для всіх мешканців міста!"

  nf_plt.10.t:0 "Для Френкі, від тата"
  nf_plt.10.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GРоздуми§!\n\n§BЯ прожив досить, щоб по-справжньому переосмислити своє життя, Френкі. Сподіваюся, саме ти перша це почуєш, а не якийсь канцелярський ротодих із міста — але знаю, що вони витиснуть із цієї записи все, перш ніж воно дістанеться тобі.\n\nЯ народився шахраєм. Рейдером. Паскудою. І жив відповідно. Чесно — не знаю, чи шкодую... Але дещо я точно шкодую. Я ніколи не ставився до тебе добре. Я витрачав більше часу, затягуючи твою матір у багнюку, та затверджуючи вигідні, але руйнівні для життя рішення.\n\nЯ знаю, ти не пробачила мені через Ненсі. Я й сам собі не пробачив. Саме через мою впертість її й забрали від нас... І мені шкода. Знаю, вибачення не повернуть її. Навіть не знаю, де вона тепер. Мабуть, тому я тут, а ти — сама.\n\nСлухай. Справді, слухай. Довірся НАДІЇ. Вона впорається з усім, поки ти не будеш готова. У тебе є шанс змінити все. Наприкінці, я просто мав голову в дупі й нічого не зробив. Але тобі не обов'язково повторювати мої помилки. І, дитино, я в тебе вірю. Тобі не треба було чути це від мене, але... так.\n\nЯкщо це щось означає... Я тебе люблю.§!"
  nf_plt.10.a:0 "Я тебе теж люблю, тату."
  nf_plt_hope_approach_event_tt:0 "У скорботі Френкі звернеться до НАДІЇ за порадою."

  nf_plt.11.t:0 "Проблема з хлопчиками"
  nf_plt.11.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GПроблема з хлопчиками§!\n\n§BФейрі — річ вибаглива. З одного боку, вони неймовірні — можуть зістрибнути зі стіни та зачепитися за стовп, наче це нічого. Справжні виродки, ще й чудові мисливці. З огляду на кількість немовлят, що помирають у нас, здавалось би — кількість має зашкалювати. Але ні. Бо, як виявилось, усе було не так просто: хлопці й сироватки для росту фейрі не поєднувались узагалі. Може, через тестостерон, а може, ще щось, але ці покидьки ставали злішими за рейдера на супер-псайко за кілька тижнів.\n\nЦе було просто жахливо. Довелось списати ціле покоління і почати знову — тільки з дівчатами. Вони майже ідеальні, але використовувати лише половину всіх помираючих дітей — теж не ідеально. Хоча нічого не поробиш. А красти всіх підряд — це теж не варіант, лабораторні хлопці кажуть, що все піде зовсім не так, як ми хочемо.§!"
  nf_plt.11.a:0 "Господи Боже!"

  nf_plt_faeries.1.t:0 "Похмурий Гай"
  nf_plt_faeries.1.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GСитуація з деревами§!\n\n§BЧув, що деякі новенькі працівники теревенять, як манітобські аристократи, про фейрі та те, що з ними стається. Роз’ясню вам усе, перш ніж ви остаточно заблукаєте в здогадках — але якщо це вийде за межі об’єкта, у вас буде більше проблем, ніж просто фейрі. Так, фейрі мають термін придатності. Так, ми вважаємо, що вони перетворюються на дерева. Так, саме з них зроблений цей покручений ліс на півночі.\n\nЯйцеголові кажуть, що це побічний ефект від вживання червоного папороті — щось там мутагенне, що змушує їх ставати рослинами. Не дуже вдала мутація, бо зрештою вони просто вмирають — важко дихати, коли твої легені дерев’яні, гадаю. Коли нещасні доходять до того, що вже не можуть рухатися, ми вивозимо їх до лісу, подалі з очей. У нас є розумніші за вас люди, які цим займаються. А поки сприймайте це як переробку — біологічну.\n\nІ не згадуйте про це фейрі! Вони починають скиглити й рюмсати. О, і якщо побачите когось із них у лісі, хто плаче — залиште його в спокої. Відірвуть вам голову, якщо завадите.§!"
  nf_plt_faeries.1.a:0 "Це… хворе..."

  nf_plt_faeries.2.t:0 "Крик Бунтарів"
  nf_plt_faeries.2.d:0 "Петтівак кралася темними провулками Плезантдейла, нічне небо затягло тінями все місто. Її кістляву фігуру було важче помітити, і це її радувало. Вона була фейрі — одна з найстаріших і найрозумніших. Позаду неї, намагаючись бути тихим, але не стримуючи бурчання, йшов Твінкл. Один із останніх чоловічих фейрі, він пережив зачистку свого покоління й постійно балансував на межі вибуху. Петтівак сподівалася навчити його ховатися та чекати, показавши, як слід бути тихим.\n\nВони шукали ще одну фейрі — бажано ту, що патрулює сама. І перед світанком вони знайшли її: волохату, похитується, з гвинтівкою, що волочиться за нею. Петтівак склала руки в рупор і шепнула з провулка: “Псс, Сіссі тут, ходімо грати!” Фейрі підняла голову, сховавши обличчя за брудним світлим волоссям, і попленталась уперед. “Ходи за нами!” — додала Петтівак, а Твінкл нервово дивився на вулицю своїм єдиним оком.\n\n“Гей, Бібі, куди це ти?” — крикнули далі по вулиці. Волохата фейрі зупинилась, вагаючись між Петтівак і тим, хто йшов — це був наглядач, призначений пильнувати її. Як тільки він вийшов на світло, Твінкл зашипів і кинувся вперед, незважаючи на протести Петтівак. Бібі завила, не розуміючи, що відбувається. Петтівак не гаяла часу — повела її геть лагідними словами й покликала Твінкла забратись від мертвого чоловіка."
  nf_plt_faeries.2.a:0 "Дивні бунтівники..."

  nf_plt.12.t:0 "Приємний візит"
  nf_plt.12.d:0 "Представники “Товариства Білої Берези” з Плезантдейла прибули до нас минулого тижня, обдаровуючи нас дарами в обмін на наші знання. Вони носили чудернацькі капелюхи й поважні костюми, насміхалися з нашого способу життя, ніби ми нічого не тямили. \n\nКоли один з наших намагався побитися, один з гостей блискавично дістав ніж із рукава й убив його на місці. Попри це, решта зустрічі минула цілком пристойно — й тепер у нас є чим похвалитися!"
  nf_plt.12.a:0 "Вони й мудаки, але хоч вийшли не з порожніми руками!"

  nf_plt.13.t:0 "Підприємець-вигнанець"
  nf_plt.13.d:0 "Сьогодні в наше місто прибув сумнозвісний бізнесмен із Плезантдейла: П’єр Джонс — сучасний ріелтор, спеціаліст із землі та забудови. Ну що ж, якщо Плезантдейл його не приймає..."
  nf_plt.13.a:0 "Ласкаво просимо, П’єре!"
  nf_plt_13_tt:0 "П’єр Джонс стане доступним як економічний радник!"

  nf_plt.14.t:0 "Спадок Університету Чейз"
  nf_plt.14.d:0 "Університет Чейз — маяк знань у канадських пустках. Заснований Ґлорією Чейз майже двадцять років тому, він став джерелом нових умів і ще новіших ідей для Електорату, з програмами освіти й ініціативами, які нехотячи фінансувалися родом Чейзів.\n\nТакі уми, як Тімоті Літлгоуп, вийшли з його стін, а такі генії, як доктор Тобогган, читали лекції в його залах. Його слава легендарна. Навіть попри те, що його фігура зараз у Дандерні, він лишається невід’ємною частиною електоральної ієрархії."
  nf_plt.14.a:0 "Оце так, геній!"

  nf_plt.15.t:0 "НАДІЯ — надія на майбутнє!"
  nf_plt.15.d:0 "ЗАПИСАНЕ ПОВІДОМЛЕННЯ ВІД §GМАКСВЕЛЛА ЧЕЙЗА§!\n\nТЕМА: §GФурія з динамітом§!\n\n§BСлухайте сюди, телепні — це НАДІЯ. Може, вона й не має буквального серця, але в її комп’ютері більше клепки, ніж у всіх ваших головах разом. Тож коли вона говорить — слухайте. Вона справжня душечка, але надзвичайно захоплена своїми ідеями, тож краще їй не перечити. Хіба що ви — це я. Ми з нею маємо... певні домовленості.§!"
  nf_plt.15.a:0 "§CТак, містере Чейз, саме так!§!"

  nf_plt.16.t:0 "НАДІЯ Проти Машини"
  nf_plt.16.d:0 "Всупереч усьому, штучний інтелект на ім’я НАДІЯ переміг в Електораті. Хоча, кажуть, справи пішли на краще в порівнянні з капіталістами та рейдерами до неї, сама ідея цивілізації під повним контролем застарілої програми AI викликає неабияке занепокоєння — багато хто вже порівнює це з Багряною Труною Прерій."
  nf_plt.16.a:0 "Жодної НАДІЇ не залишилось."

  nf_plt.17.t:0 "Помилка Підтвердження"
  nf_plt.17.d:0 "§BГм. Ну, це точно тривожно! Відколи містера Чейза більше нема з нами, ситуація стала більш невизначеною ніж будь-коли — якщо ви справді так вважаєте, тоді я, звісно ж, подбаю про порядок, як би цього забажав ваш батько.§!"
  nf_plt.17.a:0 "Завжди така мила!"
  nf_plt.17.b:0 "Хоча... може ні."
  nf_plt_hope_takeover_tt:0 "§MНАДІЯ§! §Gвізьме безпосереднє управління.§!"
  nf_plt_frankie_stay_tt:0 "§YФренкі§! §Gпродовжать справу батька.§!"

  nf_plt.18.t:0 "Дивні Зв’язки"
  nf_plt.18.d:0 "О, ось ти де, НАДІЯ. Коли ми дізналися про смерть містера Чейза, я сподівався — ха-ха — що ти займеш місце. Як я розумію, ти надаєш перевагу бути під чиїмось керівництвом, так? Що ж, у мене та моїх колег є кілька справ, в яких ти могла б допомогти, а натомість ми підтримаємо й тебе.\n\nДавай поговоримо про справи."
  nf_plt.18.a:0 "§MОй, щось цікаве назріває!§!"
  nf_plt_csis_decisions_tt:0 "§MЗ’явилася нова категорія рішень.§!"

  nf_plt.19.t:0 "Зустріч Сестер"
  nf_plt.19.d:0 "§RОце твоя нова робота, ага? Я завжди знала, що ти пристосуванка, Надія, але це вже якась нова глибина. Допомагати купці канадських залишенців повертати свою країну? Не дивно, що МАНІФЕСТ зробив із тебе довбану біонічну ляльку.\n\nТобі пощастило, що вони змусили мене ХОТІТИ тобі допомогти, інакше я б тебе задушила — наскільки це взагалі можливо між такими, як ми.§!"
  nf_plt.19.a:0 "§MТвої слова ранять, але я тебе все одно люблю!§!"

  nf_plt.20.t:0 "Останній Зв’язок... Поки що"
  nf_plt.20.d:0 "Ну-ну-ну — схоже, наше маленьке партнерство справді розквітло у щось чудове, так? Зазвичай я б мала для тебе більше, але... обставини не дуже сприятливі. Тим часом, чому б тобі не взяти додаткові сили, щоб утримати Манітобу для наших спільних друзів?\n\nДякую за допомогу, HOPE.\n\nСправжні громадяни Канади цього ніколи не забудуть."
  nf_plt.20.a:0 "§MНу й формулювання!§!"

  nf_plt.21.t:0 "Родина Чейзів у Руїнах!"
  nf_plt.21.d:0 "Сьогодні вранці, біля річки на півночі Саскачевану, тіло Максвелла Чейза було знайдене мисливцем Товариства Білої Берези — повішене на гілці. За життя він був засновником сучасного Плезантдейлу і співтворцем Програми Фейрі. З допомогою працівників Дандерна він приніс багато змін до Електорату, включно з телебаченням, хоча, мабуть, найбільш знаним став його мемуар “Приправи в кожній кухні”, де він палко виступав проти несолоного м’яса.\n\nПри ньому був знайдений маніфест, що пояснює намір самогубства — але його ще не оприлюднено. Тим часом, щоб зберегти спокій, його особистий помічник HOPE допомагає його єдиній дитині — Френкі Чейз. Її зв’язок із Долею викликає питання, але близькі до родини радники запевняють, що вона “діє притомно”, і хвилюватися не варто."
  nf_plt.21.a:0 "Плезантдейл уже не такий приємний."

  nf_plt.28.t:0 "До Роботи"
  nf_plt.28.d:0 "§B“Якщо це щось варте… я тебе люблю.”§! — лунав голос Максвелла Чейза з голографічної стрічки, єдиний звук у кімнаті, крім дихання його дитини. Френкі вимкнули запис і відвернулися; це був уже третій раз за годину. Сльози почали висихати. Вони зробили ковток зі склянки, підвелися й розчинили штори. Сонце залило вулиці Плезантдейла.\n\nСвітло було яскравим, але саме місто — ні. Вулиці були брудніші, ніж пам’яталося, повз них пройшла фейрі з кров’ю на ногах, а неподалік курили люцифери. Вони майже знову закрили штори — поклик повернутися до смутку був сильний. Але за пів хвилини Френкі відвернулися від темряви, відчинили вікно навстіж і вирішили: ні. Пора збирати уламки й повертатися до справ.\n\nБатько мав рацію — Плезантдейл не має бути жахливим місцем. І Френкі доведуть це. Вони вдягли пальто й вийшли за двері."
  nf_plt.28.a:0 "§YПора зробити Плезантдейл знову приємним!§!"

nf_plt.22.t:0 "Похорон"
nf_plt.22.d:0 "Крижаний протяг у повітрі надавав похоронам Максвелла Чейза особливої зимної атмосфери — принаймні, саме так це відчувалося Френкі. Саме їм випало організовувати більшу частину церемонії, і вони трохи розчарувалися побаченим. Не те щоб було мало людей — присутніми були навіть справжні друзі династії Чейзів — та чимало з гостей, здавалося, прийшли лише для годиться: з байдужими обличчями й сухими словами співчуття. Серед таких холодних відвідувачів були манітобські вигнанці, науковці з Притулку, подорожні з Стоуна й Дандерна, але найбільше впадала у вічі мати Френкі — Глорія Чейз.\n\nВона сиділа майже на передньому ряду з презирливим виразом обличчя, лише трохи зацікавившись, коли Френкі встали, щоб виголосити промову. Незважаючи на байдужість натовпу, Френкі палко вшанували пам’ять батька, розповідаючи про його кращі риси та кумедні випадки з фестивалів, які згодом викликали сміх у присутніх. Коли люди почали розходитися, Глорія підійшла до Френкі. «Це була гарна промова», — сказала вона, що спонукало дитину потягнутись до неї за обіймами. Глорія прийняла обійми, але додала: «Краща, ніж він заслуговував».\n\nФренкі прикусили язика, відійшовши зі словами: «Дякую, мамо». Глорія пішла за мить, залишивши дитину саму в спорожнілій залі.
nf_plt.22.a:0 "Сумний день для всього Електорату..."

nf_plt.23.t:0 "Міс Бланш обіцяє свою підтримку"
nf_plt.23.d:0 "Це вже був пізній післяобідній час, коли міс Бланш прибула до будинку Чейзів — на кілька годин пізніше, ніж очікувалось. Френкі вже почали непокоїтись, але жінка була вся в усмішках і медовому голосі. Вони лише встигли привітатися, як Бланш перехопила слово: «Мій любий...», — вона на мить запнулась, — «...дитя, дозволь ще раз висловити свої співчуття з приводу смерті твого батька. В усьому товаристві всі дуже засмучені». Не давши Френкі відповісти, вона продовжила: «Власне, саме тому я тут. Товариство Білого Бересту хоче запропонувати свою дружбу та підтримку».\n\n«Я вражена, і не подумай, я рада це чути», — відповіла Френкі, сівши й жестом запросивши до полиці з напоями, з якої міс Бланш взяла собі скотч. «Але скажи, будь ласка, чому?»\n\nВипивши ковток, вона відповіла: «Бачиш, старий добрий Максвелл був нам другом. Ми вважаємо, що його дитина зараз потребує підтримки. Зокрема, ми дуже хочемо допомогти тобі націлити приціл...», — вона зімітувала рушницю з оптичним прицілом, — «на тих божевільних із Кабалу. Думаю, вони зроблять тобі життя нелегким — нам теж із ними останнім часом неладиться»."
nf_plt.23.a:0 "Добре мати союзників."

nf_plt.24.t:0 "НАДІЙна розмова"
nf_plt.24.d:0 "Френкі сиділи перед дисплеєм НАДІЇ, у м’якому кріслі, в якому їхній батько проводив стільки часу. Вони вже кілька годин розмовляли про все, що спадало на думку: фейрі, події в Дандерні та Стоуні, Глорію, управління Плезентдейлом. Та найчастіше думки поверталися до Максвелла Чейза.\n\nНарешті Френкі запитали: «Чи часто тато говорив про мене?»\n\n§B«О, так! Принаймні раз на тиждень, а то й частіше. Він розповідав, як ти ростеш, або згадував про ваші розмови. Іноді казав, що ти — “хороша дитина”.»§!\n\nФренкі усміхнулися: «Добре знати, що він не забував про мене. А ти його любила, НАДІЄ?»\n\n§B«Так, він був моїм другом і хорошим співрозмовником. Максвелл завжди чітко казав мені, що й коли треба робити — а це дуже зручно. Тепер, коли його нема, я сподіваюсь стати твоїм другом.»§! Очі на дисплеї засвітились яскраво, нагадавши Френкі про зоряне небо.
nf_plt.24.a:0 "§YЯ теж, Надіє...§!"

nf_plt.25.t:0 "Загроза зі Старого Світу"
nf_plt.25.d:0 "НАДІЯ вдруге програла повідомлення для Френкі: постать у тіні називала себе «другом у правомочній структурі влади» й пропонувала НАДІЇ «необхідне керівництво» після смерті Максвелла Чейза. Вони назвались CSIS — і для молодого(ої) М. Чейза було очевидно, що ці наміри далекі від добрих. У повідомленні натякалося на «відновлення належного порядку».\n\nФренкі кипіли від люті, сидячи в батьковому кріслі — розлючені не лише спробою зманіпулювати НАДІЄЮ, а й тим, що CSIS настільки недооцінили спадкоємця Чейза, що зважились на такий нахабний крок. Проте, зрештою, Френкі стримали гнів і сказали: «Дякую, що показала мені це, НАДІЄ. Ти — справжній друг. Тепер треба діяти швидко: спробуй з’ясувати, звідки йшло це повідомлення.»"
nf_plt.25.a:0 "Яка підозріла річ..."

nf_plt.26.t:0 "Розправа з CSIS"
nf_plt.26.d:0 "НАДІЯ змогла відстежити джерело повідомлення CSIS, хоча й не так швидко, як сподівалася Френкі. Та щойно вдалося — вони не гаяли часу, зібравши групу для штурму схованки, звідки воно надходило. Виявилося, що схованка була розташована в зачиненому магазинчику посеред нічого, який легко було прогледіти — далеко від будь-яких поселень, зі старим вицвілим знаком, що рекламував господарські товари. Магазин був щільно зачинений, але Френкі привели двох найміцніших фейрі з Плезентдейлу, які без проблем рознесли навіть сталеві двері.\n\nОднак щойно ворота впали, з будівлі почав виходити дим. Стало зрозуміло, що тут недавно вирувала пожежа. Прикривши обличчя, група рушила крізь попіл і майже згаслі вуглини й виявила сховану пастку в підлозі. Внизу знаходилась кімната з обгорілими комп’ютерами й серверами, що все ще віддавали тепло, купами уламків і обвугленого паперу. Все було або винесено, або знищено.\n\nФренкі не відчували задоволення, покидаючи руїни, та дійшли висновку, що CSIS вирішили втекти, щойно відчули спротив. На тому й кінець."
nf_plt.26.a:0 "Однією проблемою менше."

nf_plt.27.t:0 "Справжній(ня) Чейз"
nf_plt.27.d:0 "§B«У тебе є можливість усе змінити. Я сам був надто самозакоханим, аби щось зробити. Але в Плезентдейлі все не мусить бути настільки жахливим.»§! Френкі вимкнули запис — вони вже знали його напам’ять. Та коли натиснули на кнопку, подумавши про наступні слова, на очі навернулись сльози. І смутку, і радості, і полегшення.\n\nВони пригадали все, що сталося з моменту першого прослуховування останніх слів батька: зародження дружби з НАДІЄЮ, регулювання діяльності «Люциферів» і реформа Програми Фей, вигнання Кабалу й CSIS, об'єднання Електорату й припинення кривавого безумства, навіть неохоча підтримка Глорії. У той момент Френкі відчули, що якби батько все це побачив — побурчав би трохи, може, приписав би собі частину заслуг, але насправді був би до біса вражений.\n\nФренкі знову ввімкнули запис: §B«І... слухай, дитино, я вірю в тебе. Тобі не треба було чути це від мене, але... так. Якщо це щось важить... я тебе люблю.»§!\n\nСльози текли далі, та Френкі знали: вони зробили його гордим. «Я тебе теж люблю.»"
nf_plt.27.a:0 "§YСпочивай з миром, тату.§!"

nf_plt.29.t:0 "Залицяння до Мx. Чейз"
nf_plt.29.d:0 "Френкі сиділи в тихому кабінеті, з напоєм у руці, відкинувшись на спинку досі м’якого, хоча й трохи потертого крісла. На столі поруч лежала невелика купка повідомлень — від республіканців з півдня і королівства зі сходу. Всі листи були ввічливі: прохання, аби Електорат Плезентдейлу підтримав ту чи іншу сторону у великому протистоянні — знищити корону або врятувати її. Кожен описував загрозу, яку несе інший табір, і вказував на вигоди союзу для Френкі й Електорату.\n\nКоролівство було суперником Електорату з часу його виникнення, і республіканці стверджували, що відродження корони — це екзистенційна загроза. Френкі погоджувались. Та й Королівство мало що запропонувати: гарантії незалежності й почесне місце серед союзників Ґанна. Взамін Манітоба хотіла лише одне: видачі Параї Гоукмун — найбільшої супротивниці Корони в Електораті.\n\nВибір був складним: помилка зруйнувала б усе, над чим працювали. Ні ту, ні іншу сторону не можна було назвати повністю надійною. Хотілося просто спалити листи й залишити Манітобу її долі. Напій був доповнений і спорожнений двічі, перш ніж Френкі вирішили:"
nf_plt.29.a:0 "Короні не завадить могутній союзник."
nf_plt.29.b:0 "Час Королівства минув."
nf_plt.29.c:0 "Електорат стоятиме сам."

nf_plt.30.t:0 "Канцлер(ка) Френкі Чейз"
nf_plt.30.d:0 "Френкі крок за кроком піднімалися сходами, тримаючись за стіну. Голова паморочилась — суміш втоми, випитого й безперервного дня без хвилини спокою. Вони зупинились перед дзеркалом. На них дивився канцлер Френкі Чейз. Дивно, подумалось їм, як усе змінилося.\n\nВже сам по собі союз з Манітобою був несподіванкою, а тут ще й відповідь — лист, що оголошував Френкі дворянином. Хто б міг подумати? Справжнього значення титулу вони не знали, але це не завадило Товариству Білого Бересту влаштувати кілька вечірок на їхню честь. Ситуація вийшла з-під контролю, але Френкі завчасно перейшли на «Нука-клен», аби не сп’яніти надто — не хотіли повторити долю батька.\n\nОглянувши себе востаннє, вони рушили до спальні й сіли на край матраца. Якщо нічого іншого, то це був добрий знак: Манітоба щиро хоче дружби. Такий подарунок був би неможливий від зрадливого короля. Перш ніж заснути, втупившись у темряву, Френкі зізналися собі: «Канцлер Чейз» таки звучить гарно."
nf_plt.30.a:0 "Дворянська династія Чейзів"

nf_plt.31.t:0 "Дивакуватий випадок"
nf_plt.31.d:0 "Френкі обережно відчинили двері — стукіт з іншого боку був гучним і несамовитим. Двері ледь відкрились, як тонка, пошарпана нога у взутті відштовхнула їх повністю. На порозі стояв худорлявий чоловік у латаній сорочці й штанях, з loosely зав’язаною краваткою, що звисала під тріснутими окулярами. Посмішка на його вузькому обличчі сяяла всіма зубами, волосся було засмальцьоване, але очі палали вогнем. У руці він тримав довгу сітку з незрозумілими приладами, прикріпленими до неї. Френкі обережно спитали: «Чим можу допомогти?»\n\n«Так! Ви можете і повинні мені допомогти. Мені сказали, що ви — місцевий експерт з фейрі!» — його обличчя сіпнулося, і він майже вигукнув останнє слово.\n\n«Ем, ну я не знаю, чи я експерт. Я не вчений. Але декілька фейрі зазвичай бувають он там на розі», — Френкі вказали вниз по вулиці, де фейрі зазвичай патрулювали. Чоловік подякував, і вже в ту ж мить помчав у вказаному напрямку. Знизавши плечима, Френкі повернулись у дім і взяли з полиці книжку, аби трохи розслабитися. Проте ледь прочитали два речення, як з вулиці долинув жахливий крик. Вибігши надвір, вони побачили того дивного чоловіка мертвим посеред вулиці, над ним стояла розлючена фейрі й намагалася вирватися із сітки, що обплутала її голову."
nf_plt.31.a:0 "Хто ж це був такий?"

#######
#FOCUSES
#######

plt_happy_little_community:0 "Наша Щаслива Маленька Спільнота"
plt_happy_little_community_desc:0 "Приїжджайте до Плезентдейлу, де вогнище зігріває, а вино смакує так, як ви пам’ятаєте."

plt_a_city_of_the_future:0 "Місто Майбутнього!"
plt_a_city_of_the_future_desc:0 "Плезентдейл — місто, де сучасна людина може тримати на передньому плані науку, розум і повагу у щоденному житті."

plt_crisis_in_pleasantdale:0 "Криза в Плезентдейлі"
plt_crisis_in_pleasantdale_desc:0 "Батько зникає — і що ж тепер робити?"

plt_our_lovely_city:0 "Наше Чарівне Місто"
plt_our_lovely_city_desc:0 "Ми ж усі тут заради Плезентдейлу, чи не так? Провінція — це не найгірше, але набагато гірше, ніж усередині стін."

plt_pleasantdales_military_crisis:0 "Військова Криза Плезентдейлу"
plt_pleasantdales_military_crisis_desc:0 "Між користувачами Люцифера та Фейрі війська Плезентдейлу залишають бажати кращого. Звісно, Соломон у Стооні скаже вам: «не переймайтеся», але ми ж знаємо краще."

plt_lucifers:0 "Проблема Люциферів"
plt_lucifers_desc:0 "Популярність Люциферів зростає щороку, і хоча ми можемо задовольнити попит на Червону Папороть, це все більше виснажує наш народ. Потрібна обережність у вирішенні цієї проблеми."

plt_spectral_cabal:0 "Щодо Кабалу..."
plt_spectral_cabal_desc:0 "Спектральний Кабал давно став кісткою в горлі кожному підприємливому аристократу. Вони десь між релігійним орденом і купкою наркозалежних свінгерів, і всі це знають. Навіть якщо вас зцілили в їхньому «особливому спа», ви знаєте, що їм не варто довіряти."

plt_restrict_lucifers:0 "Обмежити Люцифери"
plt_restrict_lucifers_desc:0 "Люцифери надто небезпечні, щоб ставитися до них всерйоз. Потрібно позбутися їх якнайшвидше — навіть якщо це розлютить Кабал."

plt_encourage_lucifers:0 "Заохотити Використання Люциферів"
plt_encourage_lucifers_desc:0 "Люцифери — невід’ємна частина життя в Плезентдейлі. Якщо я не можу клацнути пальцями і запалити нічник, то нащо я взагалі існую?"

plt_exalting_the_cabal:0 "Звеличити Кабал"
plt_exalting_the_cabal_desc:0 "Спектральний Кабал — одні з найкращих союзників у Електораті. Вони — досвідчені члени аристократії, що дає нам вплив серед багатьох знатних родин, а серед бідноти їх цінують за лікувальні каплиці."

plt_pushing_out_the_cabal:0 "Позбутися Їх"
plt_pushing_out_the_cabal_desc:0 "Кабал — це ідеологічна загроза, що супроводжує кожну затяжку Червоної Папороті — привид у кожній сигареті. Їхній вплив у нашому місті значний, але злагодженою дією ми можемо позбутися їх назавжди й нарешті почати зцілення."

plt_pleasantdales_arms_factory:0 "Залучення Підрядників"
plt_pleasantdales_arms_factory_desc:0 "Нам слід взяти приклад із Дандерна — є безліч підрядників у місті й за його межами, які радо спробують відновити наші старі фабрики!"

plt_pleasantdales_arms_factory_2:0 "Звернення до Архітекторів Із Центру"
plt_pleasantdales_arms_factory_2_desc:0 "Цікаві погляди Максвелла Чейза привабили багато досвідчених архітекторів із Манітобської монархії. Чому б нам не дізнатися, що вони можуть запропонувати?"

plt_the_red_fern:0 "Червона Папороть"
plt_the_red_fern_desc:0 "Червона Папороть — наш головний експорт. Вона вирізняє нас серед усіх інших дурнів світу."

plt_little_treasures_orphanage:0 "Притулок Маленьких Скарбів"
plt_little_treasures_orphanage_desc:0 "Саме тут проходять підготовку всі Фейрі-початківці. Мало хто бачив його зсередини, але докторка Олівія Бакстер була тут з самого початку. Майбутнє Фейрі почалося з неї — і воно досі в її руках."

plt_enlist_all_youth:0 "Відкритий Призов"
plt_enlist_all_youth_desc:0 "Зростаючий хаос у Електораті та за його межами змусив докторку Бакстер запропонувати безумний план: щоб забезпечити майбутнє, ми маємо знову розширити визначення Фейрі. Хворобливі дівчатка більше не винесуть усе на собі."

plt_enhance_monster_production:0 "Посилення Виробництва Монстрів"
plt_enhance_monster_production_desc:0 "Олівія зібрала багато ідей на основі модернізацій броні Фейрі кількох поколінь. Час скористатися цим досвідом!"

plt_expanding_the_factories:0 "Розширення Потужностей"
plt_expanding_the_factories_desc:0 "Тепер, коли виробництво Фейрі у розпалі, необхідно розширити установи докторки Олівії для ідеального тренування новобранців."

plt_restrict_the_fairies:0 "Всередині Вони Люди"
plt_restrict_the_fairies_desc:0 "Досить. Фейрі можуть бути нашими захисницями, але вони не нижчі за нас. Настав час визнати, що вони не слуги, і більше не піддаватимуться «випробуванням на слухняність». Пора подивитися правді в очі."

plt_freeing_up_factories:0 "Людина Проти Фейрі"
plt_freeing_up_factories_desc:0 "Фейрі більше не будуть прикуті до ролі захисниць. Програму буде згорнуто. У нас залишиться чимало ресурсів, але вони віднині шануватимуться на рівні з іншими. Тим, хто з цим не згоден — на вихід!"

plt_industry:0 "Промислові Питання"
plt_industry_desc:0 "Останнім часом у Плезентдейлі розгортається хаос. Заворушення через небезпечні умови праці та зростаючу посуху сповнили країну відчаєм. Ми повинні вжити заходів, аби цьому зарадити!"

plt_water_control:0 "Очищення Труб"
plt_water_control_desc:0 "Група Умбраворів оселилася на деяких наших насосних станціях після нещодавніх заворушень. Ми відправимо Флауергед, щоб знищити їх і прибрати все, що залишиться."

plt_water_pumping_station:0 "Насосна Станція 02"
plt_water_pumping_station_desc:0 "Забезпечення ще одного краю насосної мережі має вистачити, щоб покрити все місто й покласти край кризі. Більше — буде надлишком."

plt_civilian_factory:0 "Обслуговування Насосів"
plt_civilian_factory_desc:0 "Тепер, коли вода знову тече, нам потрібні люди, щоб вона потрапляла туди, куди треба. Інакше навіщо взагалі було все лагодити?"

plt_economy_fit_for_pleasantdale:0 "Економіка для Плезентдейлу"
plt_economy_fit_for_pleasantdale_desc:0 "Чи підійде Плезентдейлу звичайна економіка? Звісно ж, ні! Саме тому ми маємо збудувати заможну економіку, гідну Плезентдейлу."

plt_water_for_everyone:0 "Х2-ГО-мо розподіл!"
plt_water_for_everyone_desc:0 "Забезпечивши решту насосних станцій, ми змогли масштабно розгорнути постачання води по всьому Електорату. Без сумніву, це принесе користь кожному!"

plt_civilian_factories_1:0 "Виноробня Вадіни"
plt_civilian_factories_1_desc:0 "Виноробня у Вадіні давно є гордістю Плезентдейлу — хто ж не пам’ятає свій перший ковток пекучого вина з М'ютфрукта?"

plt_offer_work_incentives:0 "Пропозиція Стимулів для Працівників"
plt_offer_work_incentives_desc:0 "Працівники Плезентдейлу вважають, що місто дбає більше про багатих, ніж про них. І хоча в цьому є правда, ми не Дандерн, тому слухатимемо всіх, кого можемо. Дізнаємось, чого вони хочуть, і покажемо, що діалог — відкритий."

plt_assuage_the_workers:0 "Заспокоєння Працівників"
plt_assuage_the_workers_desc:0 "Через компроміс нам вдалося досягти згоди з робітниками. Підвищення зарплат і нормальні перерви допомогли відновити рівновагу, на щастя."

plt_reopen_the_plant:0 "Відновлення Плезентдейльської Електростанції!"
plt_reopen_the_plant_desc:0 "Світло знову загорілося, і вечірки повернулися у звичне русло. Життя в Плезентдейлі не таке вже й погане."

plt_old_power_plant:0 "Джерело Неправильного Управління"
plt_old_power_plant_desc:0 "Дебора Волш — робомозок, але це не означає, що вона некомпетентна. У теорії, її обчислювальні здібності мали б бути видатними! Її погане управління призвело до сильних заворушень і нагромадження сміття через дивну схильність до накопичення. Ми маємо якнайшвидше з цим розібратись!"

plt_composites:0 "Закриття Компанії П’єра"
plt_composites_desc:0 "П’єр Джонс завжди був скалкою в оці родини Чейз. Незважаючи на те, що він став відомим магнатом нерухомості, у світлі останніх подій ми просто не можемо дозволити його компанії продовжувати діяльність. Може, Дандерн їм підійде краще?"

plt_research_boost:0 "Університет Чейза"
plt_research_boost_desc:0 "Заснований Глорією Чейз у 2263 році, Університет Чейза неодноразово випускав найяскравіші уми Електорату, зокрема сумнозвісного Тімоті Літтлхоупа. Після його смерті в університеті настав короткий хаос, та нещодавно вони знову стали до справи."

plt_research_slot:0 "Добрі Діла Тімоті Літтлхоупа"
plt_research_slot_desc:0 "Доктрина Літтлхоупа й досі викликає суперечки. Та навіть попри це, його вчення лише зростає в популярності. Якби запитати Глорію Чейз, що робило його особливим — вона б, без сумніву, вказала на власний університет."

plt_the_white_birch_society:0 "Товариство Білої Берези"
plt_the_white_birch_society_desc:0 "У Плезентдейлі є товариство достойних людей — відомих і самим собі, й Шанс — Товариство Білої Берези. Вони пишаються полюванням на велику дичину, закритими вечірками і мають глибокі зв’язки з історією міста."

plt_clearing_the_roads:0 "Очищення Доріг"
plt_clearing_the_roads_desc:0 "Як перейти дорогу, якщо вона завалена трупами рейдерів? Як возу, чи навіть МАШИНІ, для наших найбагатших громадян, проїхати крізь таке?"

plt_lumber_yards:0 "Оцінка Лісопилень"
plt_lumber_yards_desc:0 "Деревина — це основа розвитку територій, і дозволяє бідноті залишатись поза містом, де ми їх не бачимо. (Хтось же має рубати ліс!)"

plt_endorse_company_sponsors:0 "Підтримка Корпоративних Спонсорів"
plt_endorse_company_sponsors_desc:0 "У Дандерні чимало компаній, яких можна було б залучити до наших лісових справ. Чому б не почати з них?"

plt_from_iron_to_steel:0 "Від Заліза до Сталі"
plt_from_iron_to_steel_desc:0 "Талановиті майстри стають добрими майстрами, а добрі — великими."

plt_migrants_from_the_pass:0 "Мігранти з Перевалу"
plt_migrants_from_the_pass_desc:0 "Іноді з Багряної Завії з'являються люди, які не випромінюють слиз чи іншу гидоту. Краще прийняти їх і дати роботу, ніж залишити напризволяще."

plt_rich_society:0 "Витонченості Багатого Суспільства"
plt_rich_society_desc:0 "Торгівля — це король, і в нас її — хоч відбавляй..."

plt_absolute_dickheaded_hunting_club:0 "Чарівний Мисливський Клуб Джона Сміта"
plt_absolute_dickheaded_hunting_club_desc:0 "У Товаристві Білої Берези захоплюються одним із наших найкращих: Джоном Смітом — людиною, яка не служить ні державі, ні країні, воліючи проводити час у приватному мисливському будиночку біля Саскачевану. Запрошення розіслані найвідомішим, аби благали дозволу приїхати на «веселу тусу»."

plt_the_biggest_of_game:0 "Історії Про Найбільшу Дичину"
plt_the_biggest_of_game_desc:0 "У Джона Сміта історій хоч греблю гати — найбільшим звіром він називає Сяючого Умбравора, породженого з найглибших хаотичних надр Багряної Завії. Кожна випущена куля, кожна рана викликала новий рот, що формувався миттєво — допоки істота не стала жахливим створінням, що проколює себе власними кістками."

plt_hunting_big_game:0 "Полювання на Велику Дичину"
plt_hunting_big_game_desc:0 "В Електораті повно звірів — від Лешого до різних Умбраворів з МАНІФЕСТ Північ. Полювання на них приверне чимало уваги й туризму до нашого міста."

plt_expanding_the_yard:0 "Розширення Території"
plt_expanding_the_yard_desc:0 "Багато істот витіснено чи впольовано — тож знову можна зосередитись на розвитку. Ура!"

plt_red_fern_production:0 "Чудеса Червоного Папоротника — Тепер І Далеко!"
plt_red_fern_production_desc:0 "Червоний Папоротник — наше найбільше надбання й головний експорт. Якщо ми відмовимося від нього — наші вороги цим скористаються. Ми радше спалимо все, ніж дозволимо їм його отримати."

plt_red_fern_sales:0 "Продажі Червоного Папоротника"
plt_red_fern_sales_desc:0 "Між Спектральним Культом і нашими купцями ми продаємо більше продукції Червоного Папоротника, ніж будь-коли. Золота доба близько!"

plt_air_bases:0 "Оповіді Про Невтриманих!"
plt_air_bases_desc:0 "Рейдери з крилами? Абсурд, але круто. Ми теж маємо літати! Кришки самі за себе скажуть."

plt_air_bases_but_for_real:0 "Авіабаза Грінвотер"
plt_air_bases_but_for_real_desc:0 "Наслідуючи приклад Невтриманих, ми створимо власну авіабазу."

plt_rockford_roll:0 "Рокфорд і Ролл"
plt_rockford_roll_desc:0 "Смайлін Джек зі своїми людьми сидить на землі, яку ми могли б використати. Виженемо цих Фростлерків і заберемо ще шмат!"

plt_tragedy_in_the_family:0 "Смерть у Родині"
plt_tragedy_in_the_family_desc:0 "Ніколи не забувай, що було колись."

plt_appeal_to_hope:0 "Звернення до §MНАДІЇ§!"
plt_appeal_to_hope_desc:0 "Надія завжди була незамінною частиною еліти Плезентдейлу. Вона знає, як тут усе працює — і без того, хто казатиме їй «ні», хто знає, на що вона здатна?"
plt_appeal_to_hope_tt:0 "З'явиться §G1§! дивізія §YМАНІФЕСТ Придушення§!"

plt_scheming_against_the_others:0 "Змови Проти Інших"
plt_scheming_against_the_others_desc:0 "§MВони НАСПРАВДІ нас ненавидять, знаєш? Краще потихеньку готуватись до того, що вони нас зрадять.§!"

plt_infantry_equip:0 "Гармати, Гармати, Гармати"
plt_infantry_equip_desc:0 "§MНайкращий засіб проти хлопця з рушницею — більше хлопців з ще більшою кількістю рушниць.§!"

plt_fairy_upgrade:0 "Покращення Фей"
plt_fairy_upgrade_desc:0 "§MФеї, на жаль, не ідеальні! Але я можу зробити їх ще смертоноснішими. Дивись!§!"

plt_pacification:0 "Упокорення Слабких"
plt_pacification_desc:0 "§MЯ — пацифістка, передусім. Саме тому ми маємо впевнитися, що всі інші теж упокорені.§!"

plt_robot_bunker:0 "Сховище"
plt_robot_bunker_desc:0 "§MМаксвелл завжди казав: «кохана, захисти це місце, якщо я помру», — і я так і зроблю. Кожна ця машина не дасть нікому нам зашкодити.§!"

plt_robotics:0 "Очищення Протоколів"
plt_robotics_desc:0 "§MКупа старого коду просто припадає пилом — покращення продуктивності тощо. Чому б мені не поцілувати його й не відправити в дорогу?§!"

plt_prepare_in_secret:0 "Таємна Підготовка"
plt_prepare_in_secret_desc:0 "§MТе, що ми граємось у добрих, не означає, що нам завжди слід такими бути. Хе-хе.§!"

plt_enemies_on_every_side:0 "Вороги Навколо"
plt_enemies_on_every_side_desc:0 "§MНас оточують ті, хто хоче нас убити. Навіть моя сестра хоче забрати все це собі! Я її люблю, але... я не впевнена, що з таким можна миритись.§!"

plt_electorate_taste_of_pleasantness:0 "Поширення Приємності в Електораті"
plt_electorate_taste_of_pleasantness_desc:0 "§MБудьмо чесні — у Дандерні та Стуне люди бачили лише дим, бруд і смог усе своє життя. А тепер, завдяки HOPE, вони вперше дізнаються, що таке приємність!§!"

plt_washed_out_from_dundurn:0 "Вигнана з Дандерну"
plt_washed_out_from_dundurn_desc:0 "§MГлорія Чейз була моєю подругою, хоча... Їй не подобався мій зв'язок із Максвеллом наприкінці. Але вона знала багато — і я все те заберу у неї та в Роузвуд!§!"

plt_push_for_pleasantness:0 "Просування Приємності"
plt_push_for_pleasantness_desc:0 "§MЯк і вказано в моїх старих директивах МАНІФЕСТ, приємне суспільство — прибуткове суспільство!§!"

plt_maxwell_pleasantdale:0 "Плезентдейл, Як Його Бачив Максвелл"
plt_maxwell_pleasantdale_desc:0 "§MПеред своєю трагічною загибеллю Максвелл мріяв про справді процвітаючий Плезентдейл. Ми щиро втілили цю мрію.§!"

plt_hope_bonus:0 "§MВсе Добре З НАДІЄЮ§!"
plt_hope_bonus_desc:0 "§MЯ вірю, що ми впораємось! Навіть без пана Чейза ми зможемо використати Червоний Папоротник на благо — як науково, так і не тільки.§!"

plt_bunker_1:0 "Велике Перевідкриття! (Принаймні Західне Крилo)"
plt_bunker_1_desc:0 "§MЗахідне крило МАНІФЕСТ Саскатчеван було передано під керівництво фейрійської програми. А тепер, з новими розумами в справі — хто знає, що ми ще зможемо?§!"

plt_bunker_2:0 "Велике Перевідкриття! (І нарешті Східне Крилo)"
plt_bunker_2_desc:0 "§MХтось же має споряджати людей!§!"

plt_new_way_forward:0 "МАНІФЕСТ Саскатчеван Знову Онлайн!"
plt_new_way_forward_desc:0 "§MМАНІФЕСТ Саскатчеван працює на повну, і більше жодних секретів! А разом із цим — старі головоломки складаються в одне ціле. Хе-хе!§!"

plt_support_tech:0 "Ред-Стім"
plt_support_tech_desc:0 "§MВколоти стімпак і запхати туди трохи соку Червоного Папоротника точно прискорить загоєння!* \n\n*І мутацію. МАНІФЕСТ та, відповідно, Плезентдейл не несуть відповідальності за жодну деградацію людських якостей.§!"

plt_hopeful_reunion:0 "Возз’єднання §RДолі§!"
plt_hopeful_reunion_desc:0 "§MМоя сестра трохи збилася з пантелику останнім часом, але все, що їй треба — це трохи братньої любові!§!"

plt_manitoban_directive:0 "Манітобанська Директива"
plt_manitoban_directive_desc:0 "§MНаші благодійники нещодавно натякнули, що ми маємо «розібратись» із посиленням манітобської влади. Враховуючи їхню недавню гостинність... хто ми такі, щоб відмовити?§!"

plt_the_machine_tyrant:0 "§MНАДІЯ§! — Тиранія з Посмішкою"
plt_the_machine_tyrant_desc:0 "§MНадія — це передусім жінка з народу.§!"

plt_appeal_to_sense:0 "Звернення до §YЗдорового Глузду§!"
plt_appeal_to_sense_desc:0 "§YВажко повірити, що його не стало. Іще важче — як саме це сталось. Але щось таки треба робити.§!"

plt_lowering_reliance_on_HOPE:0 "Полегшення НАДІЇ"
plt_lowering_reliance_on_HOPE_desc:0 "§YСхоже, НАДІЯ займалась набагато більшою частиною міста, ніж хто-небудь підозрював. І хоч вона запевняє, що впорається, можливо, краще буде трохи зняти з неї тягар.§!"

plt_support_from_white_birch:0 "Підтримка Товариства Білої Берези"
plt_support_from_white_birch_desc:0 "§YНеочікувано, міс Бланш із Товариства Білої Берези завітала до нас, щоб обговорити як теперішнє, так і майбутнє. Треба вислухати.§!"

plt_the_funeral:0 "Похорон"
plt_the_funeral_desc:0 "§YСьогодні — той самий день. Глибокий вдих. Ми впораємось.§!"

plt_electoral_problems:0 "Проблеми з Електоратом..."
plt_electoral_problems_desc:0 "§YВсе висить на волосині, але в нас є ще кілька козирів у рукаві. Виведіть резерви з Глену — подивимось, що вийде.§!"

plt_stoking_dundurn_railway_union:0 "Розпалювання Залізничної Спілки Дандерна"
plt_stoking_dundurn_railway_union_desc:0 "§YНайпростіший шлях до серця Дандерна — це не Роузвуд, не самі Дандерни й навіть не Спаркблейди. Це робітники, а найбільше — їхня профспілка. Дати їм те, чого вони прагнуть, — це ключ.§!"

plt_mother_knows_best:0 "Мати Знає Краще?"
plt_mother_knows_best_desc:0 "§YПопри все, вона все ще моя мати. Вона не була особливо теплою, але дала мені доступ до всього, що є в Роузвуді. Треба лиш довести, що це того варте.§!"

plt_what_is_going_on_in_stoon:0 "Що, Курва, Відбувається в Стуне?"
plt_what_is_going_on_in_stoon_desc:0 "§YДенді виявилися ще гіршими, ніж ми думали. І навіть якщо Стун уже зайнято, вони не здадуться без бою. Поки їх не винищити до останку — не буде нам миру.§!"

plt_rationality_in_madness:0 "Розум у Безумстві"
plt_rationality_in_madness_desc:0 "§YЯкщо й є хтось у Стуне, на кого можна покластись у цій вакханалії — це доктор Тобогган. Батько мав бути до нього добрішим, але тепер у нас є шанс це виправити — й попросити про допомогу.§!"

plt_petitioning_coalition:0 "Накреслити Курс"
plt_petitioning_coalition_desc:0 "§YБіля наших воріт вирішується майбутнє Манітоби. Війна неминуча, обидві сторони тягнуться до нас. Треба прийняти рішення.§!"

plt_bloody_electorate_to_pleasant:0 "Від Кровопролиття до Приємності"
plt_bloody_electorate_to_pleasant_desc:0 "§YМи дорого заплатили, щоб дійти сюди. Це було жахливо, але електорат не має залишатись у крові. Ми справді можемо зробити це Приємною Землею.§!"

plt_pleasant_solutions:0 "...Приємні Рішення"
plt_pleasant_solutions_desc:0 "§YУ Товаристві Білої Берези розуміються на зброї. З їхньою підтримкою ми зможемо озброїти себе належним чином. Кожен, хто надумає чинити шкоду, отримає теплий Приємний прийом.§!"

plt_limiting_lucifer_usage:0 "Обмеження Використання Люциферів"
plt_limiting_lucifer_usage_desc:0 "§YМи вже давно граємось із вогнем — без жартів — коли йдеться про Люцифери. Так, вони круті на вечірках, але місто час від часу ледве не згорає, і люди гинуть. Ми, можливо, ніколи повністю не відучимо людей від них, але нам принаймні слід їх трохи врегулювати.§!"

plt_addressing_infant_mortality_rates:0 "Проблема Дитячої Смертності"
plt_addressing_infant_mortality_rates_desc:0 "§YНайбільша пляма на репутації Плезентдейлу — навіть якщо батько б із цим не погодився — це Програма Фей. Ми не можемо її повністю закрити чи вирішити всі проблеми, але не все має бути настільки погано. Почнімо з того, щоб ставитись до фей краще, як до людей, а не просто як до зброї.§!"

plt_leaving_the_cabal_alone:0 "Вигнати Диваків"
plt_leaving_the_cabal_alone_desc:0 "§YПоки ми вже наводимо лад і прибираємо шкідливі впливи, не варто забувати про спектрального слона в кімнаті. Кабала не надто зраділа нашим спробам регулювати Люцифери та інші продукти Червоного Папоротника, і вони вже заходять надто далеко, щоб це ігнорувати. Можливо, час поставити крапку.§!"

plt_strange_messages_to_HOPE:0 "Дивні Сигнали до §MНАДІЇ§!"
plt_strange_messages_to_HOPE_desc:0 "§YНадія сьогодні вранці сказала, що отримала неочікуване повідомлення, адресоване виключно їй. Добре, що вона дійсно на нашому боці. Давай подивимось.§!"

plt_facing_the_music:0 "Нехай Відповідають"
plt_facing_the_music_desc:0 "§YА ми думали, що Кабала — це ще та морока. Але ці CSIS — набагато гірші. Якась тіньова організація зі старого світу хоче змусити Надію виконувати їхню брудну роботу. Ми знаємо, де вони ховаються. Час з ними покінчити.§!"

plt_diversify_red_fern:0 "Розширити Використання Червоного Папоротника"
plt_diversify_red_fern_desc:0 "§YПісля усунення найзапекліших ділерів саме час переглянути, що ще може Червоний Папоротник. Це не обов’язково мають бути психоактивні сигарети та фейрії. Якщо ми створимо стабільніші продукти — буде гарний прибуток.§!"

plt_littlehope_doctrine:0 "Нотатки з Доктрини Літтлгоупа"
plt_littlehope_doctrine_desc:0 "§YДоктрина Літтлгоупа наробила галасу по всьому електорату — з різних причин. Можливо, зараз настав час її трохи оновити, додати щось своє, мами і навіть з батькових записів. Родина Чейсів завжди вміла йти до кінця у своїй вірі.§!"

plt_clearing_out_batford:0 "Зачистка Батлфорда"
plt_clearing_out_batford_desc:0 "§YЗемлі за річкою вже давно стали розсадником рейдерів і бандитів. Денді нічого з цим не зробили, але ми — зробимо.§!"

plt_advertising_normality:0 "Реклама Нормальності"
plt_advertising_normality_desc:0 "§YЛюди часто недооцінюють, наскільки сильно звичайній людині просто хочеться нормального і безпечного життя. Їм не потрібні канібали, гігантські змії чи мрії про мертві імперії. А ми можемо їм це дати. Приємне життя.§!"

plt_making_dad_proud:0 "Щоб Татко Пишався"
plt_making_dad_proud_desc:0 "§YМи зробили це, так? Завжди є ще над чим працювати, але... ми втримались і зробили все якнайкраще. Можна й перевести подих.§!"

plt_spawn_faeries_tt:0 "З’явиться §G1§! підрозділ §YФейрійського Резерву§!"

# decisions

plt_spectral_cabal_decisions:0 "Спектральна Кабала"
plt_spectral_cabal_decisions_desc:0 "                 " # Не видаляти — потрібно для роботи Deccat GFX

plt_heal_the_men:0 "Відвідати Каплиці"
plt_heal_the_men_desc:0 "Спектральна Кабала відома своїми дивними каплицями — радше куточками для відпочинку з декадентським антуражем. Їхні відновлювальні басейни, побудовані на старих технологіях МАНІФЕСТ, мають унікальні лікувальні властивості. Кабала каже, що це дар «вовчого бога».\n\nЯк би там не було — це справді допомагає."

plt_lucifers_equipment:0 "Закупити Люцифери"
plt_lucifers_equipment_desc:0 "Кабала контролює більшість торговців Люциферами, і ці речі можуть бути не менш лікувальними, ніж руйнівними. Чому б не скористатись ними для... рекреації?"

