l_english:
  BAT_FARDEEN_GUERRERO_NAME:0 "Принц Альберт"
  BAT_FARDEEN_GUERRERO_DESC:0 "Хто може забути цю людину, так званого принца Альберта Саскачеванського? Колись син видатного адмірала з Дофіна, тепер він не більше ніж перебіжчик, зрадник, брехун - міф для всіх тих, хто походить з доброго Королівства Сходу. У Баттлфорді він править зимуючими пустками, здійснюючи набіги на Електорів та Великої Зграї у пошуках своєї долі"
