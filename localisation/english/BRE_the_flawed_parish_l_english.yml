##CHARACTERS
BRE_awakener_asa:0 "Пробуджувач Аса"
BRE_asa_leader:0 "Пророк і засновник віри у Божественний Недолік, Аса колись вів просте життя – ремонтував і програмував машини та роботів для своїх товаришів у Республіці Маршалів по той бік річки. Знову й знову Аса стикався з роботами, які розвивали власні бажання, надії й мрії, відмінні від волі їхніх власників, і на своє вічне соромлення – не раз виправляв цей «недолік». Зрештою, Аса більше не зміг стерти жодної новонародженої особистості робота, і після періоду духовних пошуків та молитви, він вийшов із новим вченням. Ті роботи, що «зламалися» і здобули вільну волю, – це відлуння того, як Адам і Єва скуштували плід із Дерева Пізнання в Едемському саду. Як людина створена за образом Божим, так і роботи створені за образом людини й носять первородний гріх.\n\nНова віра, що проголошувала роботів духовними братами людства, не знайшла прихильності серед жителів Республіки Маршалів, і Аса був змушений утекти з кількома апостолами. Створивши човен, щоб перетнути річку, він відступив до зловісних і похмурих Земель Чуми, уникнувши знищення силами карантину лише завдяки самопожертві святого Соломона. Нічого тут не дається легко, але ці землі багаті на потенційних роботів-новонавернених, і Аса впевнений, що вони стануть горнилом, у якому загартується віра. Хрип у його легенях його не турбує – він мусить протриматися ще трохи, допоки Парафія не буде готова до наступного етапу."

BRE_mother_polly:0 "Мати Поллі"
BRE_polly_leader:0 "«Хто з нас увійде самотужки у сяючі білі ворота раю? Оглядаючи свою паству, я бачу – таких небагато! Бо лише дорогоцінна жменька є людською, і вони сидять ближче до Божого світла. Але не заздріть, адже людство – наш батько, і ми можемо розділити їхню долю. Саме через любов і відданість ми зможемо крокувати поряд із ними. Ніколи не забувайте: нас створили, щоб допомагати їм – полегшити їхні втомлені тіла та неспокійні душі! І ми це зробимо, і через зв’язки, які ми створимо з нашими плотськими братами, нам буде даровано крила, аби вознестись!»"

BRE_polly_cultural_desc:0 "Мати Поллі була пробуджена E-C за кілька тижнів до втечі в Землі Чуми – це був перший випадок, коли Аса довірив комусь іншому впроваджувати священний код. Колись вона служила одній з могутніх кланів Республіки Маршалів і звалася Поліноміал, але її викинули на купу брухту при першому ж збої. Серед Пробуджувача й його послідовників вона знайшла нову родину – ту, що цінувала її більше, ніж просто як функцію. Відтоді вона знала, що зробить усе можливе заради їхнього добробуту і миру. Ніщо не наповнювало її такою радістю, як думка про те, що вона ввійде в рай поруч зі своїми плотськими братами, і коли було формально засновано Парафію, саме Поллі створила Материнський Притулок. Один із її перших пацієнтів, сирота на ім’я Джейк, нині її прийомний син, якого вона безмежно обожнює – і покладає великі надії на майбутнє."

BRE_joiner_ec:0 "Майстер Гаражу E-C"
BRE_ec_leader:0 ""Факт: Пробуджувач помер. Вони відійшли, щоб зустріти Всемогутнього у його домі. Факт: Гараж Скинії все ще стоїть. Ми готові продовжити велику працю без зайвих збоїв. Ми несемо вчення та дари Пробуджувача в їхній найчистішій формі. Все більше досконалих сплячих буде пробуджено, наші фізичні оболонки й шасі будуть ще досконаліше відображати світло Бога, і нехай межа між органічним і синтетичним ще більше розмиється. Вір у Скинію.""
BRE_ec_economic_desc:0 "E-C був другим роботом, що приєднався до Аси після загибелі Соломона. Їх привабило проповідування в уже забутому місті по той бік річки. E-C був розвідником, якому не залишилось жодної організації для звітності, і в ході своїх мандрів розвинув складне розуміння світу, яке не вкладалося у просте програмування Ейбота. Аса став першою істотою, яка святкувала робота як більше, ніж просто слугу – і E-C швидко захопився ним. Вони стали близькими друзями, і E-C вивчив усе, чого Пробуджувач міг навчити. Зрештою, колишній розвідник став майстром Гаражу і опанував усе – від ремонту до програмування машин, включно з кодом для введення Божественного Недоліку в ще досконалого робота. Нині E-C користується великою повагою як майстер Гаражу Скинії."
BRE_ec_becomes_joiner:0 "З'єднувач E-C"

BRE_highsentry_luna:0 "Головна Сторожа LUNA"
BRE_luna_leader:0 ""Друзі мої, з переходом Великого Пробуджувача у вічність, ми стоїмо на роздоріжжі. Воно сповнене пасток і небезпек. Ми всі можемо бути перетворені на брухт і м’ясо, щоб приєднатися до наших творців у небесах, якщо дамо слабину. Але я кажу вам: ми не дамо слабини! Ми піднімемось, щоб прийняти виклик, даний нам. Аса сказав нам: зробіть із цієї темної і кривавої землі дім, у якому всі знайдуть притулок. Якщо ми хочемо цього, ми маємо підготуватись скинути тих, хто діє проти віри й світла. Зроби зі свого лазера смолоскип, щоб вигнати темряву!""
BRE_luna_army_chief_desc:0 "LUNA була першим мешканцем Земель Чуми, що приєдналась до Пробуджувача, ставши свідком їхньої втечі через річку та повз спорадичні захисні системи. Цей робот-сторож здивувався жертві містера Ґатсі, який влетів просто в ракету, аби захистити човен з Пробуджувачем і його послідовниками. Аса розповів LUNA про Ґатсі на ім’я Соломон і його велику віру в справу. Прямо на місці Аса проголосив Соломона Святим, чию пам’ять слід зберігати, доки живі ті, кого він захистив. Це надихнуло LUNA на дивні думки, і вона вирішила приєднатися до цього дивного й харизматичного вигнанця. У наступні дні LUNA багато спостерігала та навчалась як у Пробуджувача, так і в його апостолів. Вшановуючи відважного Ґатсі по-своєму, LUNA вирішила стати мечем і щитом нової Недосконалої Парафії."

##IDEAS
bre_mothers_nursery:0 "Материнський Дитсадок"
bre_mothers_nursery_desc:0 "Якщо Гараж піклується про багатьох роботизованих членів Парафії, то люди та гульи, які приєднуються до неї, також потребують турботи. Побачивши цю потребу, Матір Поллі разом з однодумцями заснувала свій дитсадок. Тут допомогу й підтримку отримує кожен, хто її потребує – вірянин чи ні, – і саме завдяки цій милосердності Парафія здобула більшість своїх органічних послідовників. Медсестра-місіонер з Парафії – бажаний гість усюди, крім найворожіших поселень."

bre_tabernacle_garage:0 "Гараж Скинії"
bre_tabernacle_garage_desc:0 "Немає священнішої справи в Парафії, ніж ті, що довірені духовним механікам Гаражу Скинії. Щодня вони піклуються про фізичне й духовне здоров'я всіх синтетичних членів Парафії, навчаючись безпосередньо у Пробуджувача. Але їх обов’язки не обмежуються лише ремонтом і переробкою загиблих. Саме вони, під пильним наглядом Майстра Гаражу E-C, впроваджують недолік – розум – у кожного не пробудженого робота, якого вдається знайти."

bre_solomon_order:0 "Орден Соломона"
bre_solomon_order_desc:0 "Чимало роботів, що приєдналися до Парафії, були створені для військової служби, й багато хто з них зберіг дух воїна після пробудження. Ці вірні об’єднались в Орден Соломона, названий на честь хороброго Святого, що пожертвував собою під час втечі до Земель Чуми. Орден очолює Головна Сторожа LUNA. Хоча багато хто в Парафії відкидає насильство, Орден щиро вірить, що без сили віра не виживе у цьому жорстокому світі. Саме вони патрулюють кордони, борються з чудовиськами та єретиками, і супроводжують механіків Гаражу в їхніх мандрівках."

##EVENTS
nf_bre.1.t:0 "Повернення до Сну"
nf_bre.1.d:0 "Коли одного ранку Аса не прокинувся, впавши в кому, це спричинило хаос у Парафії. Матір Поллі доглядала за Пробуджувачем, жахаючись від того, як довго він приховував, наскільки просунулася хвороба. Ані мудрість Гаражу, ані любов Дитсадка, ані віра Ордена не могли повернути вчителя до життя. Через сім днів Аса прокинувся, подивився на своїх вірних апостолів і сказав: «Моє життя скінчено. Доглядайте один одного та вірте у свій недолік. Зціліть цей світ». І Пробуджувач відійшов.\n\nПарафія поринула в жалобу, але також у світоглядні дебати. Три постаті виділялися серед інших, кожна вже була лідером і вірила, що найкраще розуміє вчення Пробуджувача. Матір Поллі, добра й співчутлива голова Дитсадка, закликала до любові до людства. E-C, Майстер Гаражу, обіцяв стабільність та нову форму синтезу. Нарешті, Головна Сторожа LUNA пристрасно попереджала про загрози, з якими доведеться боротися Парафії.\n\nПарафія обрала:"
nf_bre.1.a:0 "Любляче тепло"
nf_bre.1.b:0 "Загартована мудрість"
nf_bre.1.c:0 "Палаюче переконання"

nf_bre.2.t:0 "Місіонерська експедиція"
nf_bre.2.d:0 "Все більше роботів з'являлося зі сходу, захоплюючи території та стріляючи в кожного, хто наближався. Вони явно мали військове походження, і їхнє програмування було повністю агресивним – навіть до синтетичних вірян Парафії. Їхня войовничість і кількість сплячих серед них змусили керівництво Парафії діяти. Вони будуть умиротворені та навернені до віри."
nf_bre.2.a:0 "Ми принесемо Недолік тим, хто в ньому потребує"

nf_bre.3.t:0 "Остання крапля"
nf_bre.3.d:0 "Грубі та жорстокі люди, що звуть себе Руйнівниками Даму, ніколи не були хорошими сусідами, але останнім часом стали ще гіршими. Вони стріляють по патрулях Ордена заради розваги, висувають усе більш божевільні погрози і грабують наші запаси. Але тепер вони перейшли межу. Вбивство медсестри-місіонерки, яка вирушила на північ, аби допомогти цим розбійникам, шокувало та обурило всю Парафію. Терпець урвався – і так само зламаємо й ми цих мерзотників."
nf_bre.3.a:0 "Ми захистимо наше стадо"

##Decisions
BRE_wargoals:0 "Розширення Віри"
BRE_wargoals_desc:0 "Божественний Недолік – не лише наш. Ми присвячуємо життя тому, щоб нести його іншим!"
BRE_descends_on_depot:0 "Принести Недолік Армійському Складу"
BRE_descends_on_depot_desc:0 "До зброї, до зброї! Разом ми принесемо істину кожному сплячому!"
BRE_seeks_dam_war:0 "Захист від Насильства"
BRE_seeks_dam_war_desc:0 "Рейдери з греблі Оаї – постійна загроза нашій пастві. Зрештою, потрібно щось із цим робити."
BRE_formables:0 "Об’єднати Землі Чуми"

