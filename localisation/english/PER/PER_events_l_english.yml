l_english:
 nf_per.0:0 "Життя на болотах"
 nf_per.0.t:0 "Життя на болотах"
 nf_per.0.d:0 "Життя на Південних болотах ніколи не було легким. Туман приховував ікла, а вода несла в собі те, чому не місце в жодному нормальному світі. В очереті нишпорили мутовані звірі — ведмеді з кістяними панцирами на шкірі, ящірки розміром з людину, що плювалися вогнем, і ще гірші створіння, що рухалися під водою, наче дрейфуючі острови. \n \nАле це був дім. \n \nМисливці Лоджі вижили завдяки тому, що знали Болото краще за будь-що, що по ньому повзало. Вони будували високі хатини на палях, натягували очеретяні мотузки, просочені соком жалкокореня, щоб приховати свій запах, і садили порожнистий очерет, який свистів, коли важкі тіла витісняли воду. Кістяні дзвіночки під дощатими настилами попереджали про наближення кроків. \n \nАле нашим головним козирем, що допоміг нам найбільше, було:"
 nf_per.0.a:0 "Стати єдиним цілим з Болотом"
 nf_per.0.b:0 "Навчити наших сусідів «ділитися»"
 nf_per.0.c:0 "Принцип «зроби сам»"
 nf_per.1:0 "Спогади мисливця"
 nf_per.1.t:0 "Спогади мисливця"
 nf_per.1.d:0 "Макс сидів за барною стійкою з кухлем пива, слухаючи, як риплять дошки на вітрі. Минулі полювання. Полювання, що ще попереду. Вони зливалися воєдино, мов туман над чорною водою. \n \nБагато хто намагався прикінчити його. Клешня болотника розсікла шкіру під оком. Кіготь крококігтя розпанахав йому ребра. Щось невидиме ледь не потягло його на дно назавжди. Усі вони зазнали невдачі — хоч і не без того, щоб вирізьбити на ньому свої імена. \n \nВін потер шрам під оком і подивився на стіну з трофеями. Черепи, зуби, тріснутий ріг, шматок лускатої шкіри. Кожен з них — спогад, такий же покручений і пошарпаний, як і його власне тіло. \n \nАле його погляд зупинився на єдиному трофеї серед них — його першій здобичі на Болотах:"
 nf_per.1.a:0 "Лапа велетенського ведмедя"
 nf_per.1.b:0 "Череп мутованої ящірки"
 nf_per.1.c:0 "Панцир дивного болотника"
 nf_per.2:0 "Становлення Майстра-мисливця"
 nf_per.2.t:0 "Становлення Майстра-мисливця"
 nf_per.2.d:0 "Двоє мисливців за кілька столиків звідси низько схилилися над своїми кухлями. Слів не було чути — натомість погляди були красномовні. Вони зиркали на нього, потім відводили очі, а потім знову дивилися, думаючи, що він не помітить. \n \nВін кинув на них суворий погляд. \n \nЗапанувала тиша. \n \nВін знав тему їхньої розмови, навіть не чуючи її. Попередній Майстер-мисливець. Ніч, коли він помер. Хлопець, який вийшов з болота сам. \n \nЗ роками ця історія обросла небилицями. Кожна версія була химернішою за попередню. Ніхто не знав, що насправді сталося в чорних водах тієї ночі. Ніхто, крім Макса Такета. Майстра-мисливця Лоджі «Переслідувачів». \n \nВін зробив ще один повільний ковток, тепер дивлячись на стіл. А потім розповів їм, як усе було:"
 nf_per.2.a:0 "Він викликав його на поєдинок на ножах"
 nf_per.2.b:0 "Він переслідував його по Болотах цілими днями"
 nf_per.2.c:0 "Яка різниця, тепер я Майстер-мисливець"