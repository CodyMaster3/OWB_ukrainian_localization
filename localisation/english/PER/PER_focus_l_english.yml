l_english:
 per_start_1:0 "Полювання починається"
 per_start_1_desc:0 "Вистежуючи здобич на Болотах, ми зробили собі ім'я як вправні мисливці. І в кожного мисливця є свої секрети."
 per_start_2:0 "Трофеї"
 per_start_2_desc:0 "Заведено, що мисливці Лоджі виставляють трофей зі свого першого полювання в місцевому барі. Вони розповідають багато історій."
 per_start_3:0 "Традиція мисливця"
 per_start_3_desc:0 "Макс — не перший Майстер-мисливець Лоджі, і не останній. Він посів своє місце на чолі «Переслідувачів» після вбивства попереднього Майстра. І не він започаткував цю традицію."
 per_unique_1:0 "Приборкувачі кігтів смерті"
 per_unique_1_desc:0 "Оскільки звідусіль надходять дивні новини — зелені гіганти на заході, металеві люди на півночі, мексиканські роботи на півдні, — настав час розширити наші загони для кігтів смерті."
 per_unique_2:0 "Новини з півночі"
 per_unique_2_desc:0 "Дивні речі розповідають торговці, на яких ми сьогодні полювали. Вони кажуть про розкол серед металевих людей на півночі. Схоже, невелика їхня група накинула оком на наші землі. Ми маємо бути готові."
 per_unique_3:0 "Дивні металеві люди"
 per_unique_3_desc:0 "Наша здобич не брехала. Кілька мисливців кажуть, що зустрічали людей, одягнених у дивну броню, дедалі ближче до наших Болот. Здається, настав час починати ставити пастки на півночі."
 per_unique_8:0 "Трофеї Аламо"
 per_unique_8_desc:0 "Після нашої перемоги над «Братами Аламо», чи як там їх звали, у наше розпорядження потрапила велика кількість їхніх металевих костюмів. Хоча більшість наших мисливців воліють залишатися мобільними під час полювання, було б прикро дозволити всьому цьому металу пропасти даремно. Можливо, наші улюбленці заслуговують на новий вигляд."
 per_unique_6:0 "Мобілізація майстерень"
 per_unique_6_desc:0 "Насувається нове велике полювання. Щоправда, ця нова здобич міцніша, ніж зазвичай. Нам знадобиться, щоб наші майстерні виробляли більше зброї та боєприпасів, якщо ми хочемо вижити."
 per_unique_7:0 "Більший калібр"
 per_unique_7_desc:0 "Наша новознайдена здобич дещо невразлива до нашої зброї. На щастя, наші мисливці повернулися з полювання з хорошими новинами. Вони розповідають про стародавню схованку зі зброєю великого калібру, яку вони знайшли. Саме те, що нам потрібно."
 per_unique_9:0 "Господарі Затоки"
 per_unique_9_desc:0 "З Консервними Банками як роботизованого, так і тілесного походження, що лежать біля наших ніг, із завоюванням Г'юстона та Баю, наше панування над затокою закріплено. Час відкривати новий сезон полювання."
 per_unique_4:0 "Новини з півдня"
 per_unique_4_desc:0 "Дивні новини надходять з півдня. Схоже, якийсь робот, що уявив себе генералом давнини, змагається за владу в Мексиці і став на шлях війни. Для нас це не обіцяє нічого доброго."
 per_unique_5:0 "Долаючи скорботу"
 per_unique_5_desc:0 "Сьогодні ще дивніші новини. Схоже, батько робота-генерала помер, і це було єдине, що заважало йому накинути оком на Техас. Нам не звикати полювати на роботів, тож доведеться збільшити виробництво великокаліберних боєприпасів, щоб бути готовими до прийдешньої навали."
 per_unique_10:0 "Брухт з ботів"
 per_unique_10_desc:0 "Це було гарне полювання. Мексиканські роботи добряче опиралися, перш ніж їх вполювали. Проте залишається питання: що робити з усім металобрухтом, що залишився від них? Можливо, ми зможемо зробити броню для наших кігтів смерті?"
 per_unique_2_tt:0 "Ми побудуємо низку §Yаванпостів§! на півночі"
 per_unique_4_tt:0 "Ми побудуємо низку §Yаванпостів§! на півдні"