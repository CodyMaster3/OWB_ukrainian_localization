# Події — Montana Chapter

nf_mnc.1.t:0 "Наказ Патрокла"
nf_mnc.1.d:0 "Давним-давно, в самому серці американського Середнього Заходу, писарі й паладини Середньозахідного Братства обшукували вже соте покинуте довоєнне сховище. Коли вони подумали, що бачили вже все, їм трапилось щось особливе: мапа, що вела до старого довоєнного бункера десь у Монтані. Логістика постачання — проста, але потужна, майже міфічна: бункер мав містити запаси термоядерних елементів, плазмової зброї та інших військових артефактів.\n\nПохід оцінили, але швидко визнали безнадійним: мовляв, бункер уже розграбовано, або ж він надто далеко. Із загрозою Анклаву в Чикаго й тріщинами в самому Братстві, керівництво вирішило відмовитись. \n\nАж поки одна паладинка не викрала нотатки, шифри й інші конфіденційні дані Братства та не втекла на північ, сама в ніч. Експедиція була скликана майже миттєво — ганьба й гнів верхів скипали, мов грім. Вони знали лише одного, кому можна було довірити цю справу. «Йди, Патрокле, вистеж цю зрадницю і поверни бункер під владу Братства», — сказали вони.\n\nІ він вирушив. Але кого він узяв з собою у похід?"
nf_mnc.1.a:0 "Він надав перевагу досвіду над чисельністю."
nf_mnc.1.b:0 "Досвід важливий, але чисельність переживе ветеранів."

nf_mnc.2.t:0 "Сестри Сталі"
nf_mnc.2.d:0 "Серед загону Патрокла вирізнялась одна група — «Сестри Сталі». Їх поява була спірною, як і сама ідея: колишні трибали, нащадки Ріверів, реформовані рейдерки — вони будували своє товариство на братерстві, а не на Кодексі. Це вже не раз створювало проблеми в минулому.\n\nПатрокл узяв їх частково зі співчуття, частково — з поваги. Адже саме одна із Сестер викрала секрети Братства. Колеги Патрокла були обурені, та він вірив — вони можуть спокутувати провину. Їхня лідерка, Сентинел Гонор, давно викликала суперечки в командуванні Середньозахідного Братства. Навіть після років служби її дух незалежності не згас.\n\nПрихильники Гонор готові піти за нею до кінця. А вороги — кричать ще голосніше..."
nf_mnc.2.a:0 "Сестри вистоять."

nf_mnc.3.t:0 "Біля вогнища, на фронтирі"
nf_mnc.3.d:0 "Унизу, під місцем, де любила сидіти Гонор, було свято — коло вогнищ, дзвін келихів, пісні, жарти. Але вона почувалася самотньою. Раптом — важкий крок. Поруч опустився Патрокл. \n\n«Сидиш тут сама?» — посміхнувся він. — «Ми вже майже біля бункера. Йди святкувати!»\n\nГонор похитала головою. «Я думаю про Йоганну. Не розумію її...»\n\nПатрокл зітхнув. «Це не має значення. Вона вкрала дані й втекла. Якби їй було не байдуже — сказала б хоч слово.»\n\n«Я знаю її краще за тебе, Патрокле. Вона не зрадниця. Вона — наша родина.»\n\n«Якби хтось їй це сказав раніше...» — буркнув він. — «Усе одно, я накажу приберегти для тебе раціон. Попереду ще невідоме.»\n\n«Родина — це ті, хто залишився поруч, попри все,» — додав він.\n\nГонор кинула погляд — рішучий і твердий. «Згодна.» Але обоє мали на увазі різне..."
nf_mnc.3.a:0 "Ніч довга, але серця — молоді."

nf_mnc.4.t:0 "Звіт про тренування"
nf_mnc.4.d:0 "Елдер Патрокл викликав Ворвіка й Гейман для особистого звіту. Після розколу з Сестрами нагляд став важливішим за будь-коли. \n\n«Як вам новобранці?» — спитав він, знімаючи окуляри.\n\nГейман одразу перехопила слово. Витягла лазерний пістолет і вистрілила... на кілька сантиметрів вище голови Елдера.\n\n«Гейман, ти геть здуріла?!» — зірвався Патрокл.\n\n«Ти знав, що я не влучу,» — зневажливо буркнула вона.\n\nВорвік зітхнув. «Отже, все погано. Як давно вони тренуються?»\n\n«Два тижні. Тремтячі руки — не втримали рефрактор. Зіпсували пістолет. Тепер сама лагоджу.»\n\n«Ти стояла над ними, коли вони це робили?»\n\n«Авжеж.»\n\n«То от чому в них руки тремтіли,» — зиркнув Ворвік. — «Тобі не здається, що трохи менше тиску було б доречніше?»\n\n«Це не тиск. Це — тренування в бойових умовах,» — пробурмотіла вона, перевіряючи пістолет."
nf_mnc.4.a:0 "Добре, що не вона мене вчить!"

nf_mnc.101.t:0 "Смішний день у бункері"
nf_mnc.101.d:0 "Патрокл знайшов на столі аудіозапис, якого не впізнав. Увімкнувши його, він почув, як писарка Аміті та лицар Зігфра говорять разом... \n\n———— \n\n«§GОтже, слухай,§!» — почала Аміті, «§GУ нас є ідея—§!» \n\n«§O—так, так, ми подумали, що—§!» \n\n«§G—знайшли стару брошуру у покинутій школі—§!» \n\n«§OПо суті, це НАУКОВИЙ ЗАХІД, щоби всі дійсно, дуже—§!» \n\n«§GЦе буде весело, чесно—§!» \n\n«§O—клянемося, усе піде як по маслу, ми все проконтролюємо—§!» \n\n«§GЩо вже може піти не так?§!»"
nf_mnc.101.a:0 "...Подивимось, як воно піде."

nf_mnc.102.t:0 "Можливо, це була помилка..."
nf_mnc.102.d:0 "Патрокл полюбляв гуляти за межами бункера — милуватись краєвидами й просто обдумувати все без шуму генераторів і метушні. Особливо багато думав про Йоганну, й, звісно, про Гонор. Попри вірність Кодексу, слова Гонор не покидали його думок. \n\nАле коли він повернувся — на нього чекало справжнє пекло: залишки «міні-вулкана» по всій підлозі, вибух плазмового осердя, пошкоджена труба, і непритомна писарка Кармелла — ніхто не знає, чому. \n\nПерш ніж він устиг вибухнути, піна з вулканічної пари впала йому на голову. Поки всі дивилися з жахом, він... засміявся. «Будьте обережні наступного разу,» — сказав він лише."
nf_mnc.102.a:0 "Кармелла, на щастя, оговталась."

nf_mnc.300.t:0 "Контакт із кіборгами"
nf_mnc.300.d:0 "ЗВІТ ВОРВІКА. \n\nСер,\n\nТак звані «Металеві Пащі» — рейдерське угруповання з тягою до техномодифікацій. Вони буквально зливають себе з технологіями. Хоч це й огидно, потенційна користь від такого досвіду — значна. Залучити їх — принаймні тимчасово — може виявитись доцільним. Остаточне рішення — за вами."
nf_mnc.300.a:0 "Тимчасовий союз не завадить."

nf_mnc.301.t:0 "Застосування влади Братства"
nf_mnc.301.desc:0 "Звіти свідчать: регіон багатий на старосвітські реліквії. Оскільки він ізольований і торгівля майже відсутня — ми можемо забрати частину цінностей без суттєвого опору."
nf_mnc.301.a:0 "Ми взяли лише те, що потрібно."
nf_mnc.301.b:0 "Ми взяли трохи більше — для мотивації."
nf_mnc.301.c:0 "Ми забрали все, що побачили."
nf_mnc.301.d:0 "Ми нічого не взяли — й місцеві були вдячні."

nf_mnc.302.t:0 "Саркофаг Мендоси: Схованка"
nf_mnc.302.d:0 "Попри небезпеку, солдати зуміли винести частину скарбів до того, як станція завалилась. Що ж їм вдалося врятувати?"
nf_mnc.302.a:0 "Силову броню!"
nf_mnc.302.b:0 "Енергетичну зброю!"

nf_mnc.304.t:0 "Зачистка селюків"
nf_mnc.304.d:0 "Елдере,\n\nПід час спроби облаштувати аванпост на аеродромі, ми виявили, що ангар зайняли «реформовані рейдери», які там годують бездомних. Поки ми не вирішимо цю ситуацію — повітряні операції призупинено."
nf_mnc.304.a:0 "Примусьте їх працювати на нас."
nf_mnc.304.b:0 "Очистити ангар. Спалити все до тла."

nf_mnc.401.t:0 "Пошук новобранців"
nf_mnc.401.d:0 "Похід до Монтани був жорстоким — зростаючі втрати, засідки рейдерів і жорстокі зіткнення. Чисельність експедиції різко скоротилась. Настав час поповнити лави — з місцевих..."
nf_mnc.401.a:0 "«Нам згодиться будь-який місцевий йолоп.»"
nf_mnc.401.b:0 "«Відбір мусить бути ретельним.»"

nf_mnc.5.t:0 "Рекет Братства"
nf_mnc.5.d:0 "ЗВІТ ВОРВІКА.\n\nСер,\n\nЗ того часу, як ми осіли в Монтані, я відкрив для себе цікаве хобі — копатись у старому мотлосі. І мушу сказати: місцеві у Форті Веріті сидять на купі корисного барахла. І це не просто лазерний пістолет у шафці. Якщо ми візьмемо трохи — місцеві не нарікатимуть. Якщо візьмемо все — отримаємо значний прибуток. Рішення — за вами."
nf_mnc.5.a:0 "Забрати лише для демонстрації сили."
nf_mnc.5.b:0 "Забрати трохи більше — щоб наші були задоволені."
nf_mnc.5.c:0 "Місцеві — неважливі. Забрати все."

nf_mnc.201.t:0 "Чарівна Арена відкривається сьогодні!"
nf_mnc.201.d:0 "Проходьте, не соромтесь, до Чарівної Арени Мінерви!\n\nПрислухайтесь — чуєте? Відлуння вигуків, рев перемоги. \n\nСміливці, шукачі гострих відчуттів — спускайтесь до Арени! Забудьте про все у мить, де сталь зустрічає сталь, іскри, вибухи, слава! Перший місяць — вхід вільний! Приходьте — що вам втрачати? \n\n— Щоб зареєструватися як учасник, ви маєте бути членом Сестринства Сталі і мати ранг Лицаря або вище. Послушники повинні надати лист-рекомендацію від перевіреного наставника. —"
nf_mnc.201.a:0 "Сміливці заполонили арену!"
nf_mnc.201.b:0 "Гості приходили хвиля за хвилею!"

nf_mnc.202.t:0 "Великий Турнір Мінерви!"
nf_mnc.202.d:0 "Приходьте подивитись, як ваші улюблені Сестри Сталі зійдуться у двобоях, щоб вирішити, хто кращий! Зустрічайте чемпіонів і їхні звернення до фанатів! \n\n§RЙоганна:§! «Дякую всім, хто підтримує мене! Я зроблю все, що можу!» \n\n§RІзольда:§! «Я вперше беру участь у чомусь подібному, але вірю в удачу новачка!» \n\n§RЛуцій:§! «Хе, це і є мої суперники?» \n\n§RКермін:§! «Я тут, бо програв парі. Але місце прикольне.» \n\n§RБетсі:§! «Ідея арени мене завжди захоплювала. Не вірю, що в нас тепер є щось таке. Я в захваті!» \n\n§РПенн:§! «Що?! Я б’юся з Бетсі першою?!» \n\n§RВорвік:§! «Хочете звернення? Добре! Всім моїм суперникам — успіхів. Вони вам знадобляться.» \n\n§RСіохан:§! «Я єдина послушниця тут, і це страшно. Але я не збираюсь вилетіти у першому раунді!» \n\nКвитки лише за 7 кришок!"
nf_mnc.202.a:0 "Поїхали!"

nf_mnc.207.t:0 "Крейда і запалені серця"
nf_mnc.207.d:0 "Мінерва нахилилася над столом, переглядаючи нотатки. У присутності Гонор вона трималась рівно, але стук її ноги виказував хвилювання. \n\n«То що скажеш, Хмарко?» — запитала Мінерва, обернувшись. «‘Проходьте всі!’ чи ‘Готуйтеся до зачарування!’» \n\nГонор засміялась: «Мені подобається другий варіант.» \n\n«Хай буде за тобою,» — усміхнулась Мінерва. «Подай контейнер з сумки?» — вона кивнула на стару сумку. \n\nГонор слухняно дістала латунний контейнер із слідами попелу — її коробка з крейдою, вона згадала. «Що це значить для тебе?» — запитала вона. \n\n«Ця штука? Просто згадка з мого рейдерського минулого.» — відповіла Мінерва, вмочуючи руки в крейду і втираючи її у волосся. \n\n«Традиція?» — уточнила Гонор. \n\n«Одна з найстаріших. Моя банда — Попельники — робили це щоранку. Це додавало нам завзяття, та й в бою було легко впізнати своїх.» \n\n«Можливо, вони мали рацію?» — жартома припустила Гонор. \n\n«Ні,» — Мінерва усміхнулась і погладила її по голові. «Але тепер — мабуть так.»"
nf_mnc.207.a:0 "І ми продовжуємо йти далі."

nf_mnc.203.t:0 "Попередній щоденник Йоганни"
nf_mnc.203.d:0 "§RГудіння, потім клацання. Чути два голоси, що перебивають одне одного.§! \n\n«Воно працює?» — голос Йоганни. «Ти завжди його з собою носиш?» \n\n«Так, це для думок, Ган. І ще — дивись на червоне світло—» \n\n§RКоротке шарудіння і клацання.§! \n\n«Зловила!» — сміх Йоганни. Віддалене зітхання Ворвика. «Добре, тепер — геть!» \n\n§RДвері зачиняються.§! \n\n«Щоденник Йоганни! Я страшенно схвильована театром. Ролі майже всі розподілені. Єлизавета — ідеальна Сенді. Мінерва грає кількох другорядних персонажів. Трифт займається спецефектами, але погодився зіграти тренера. Гонор сказала, що прийде! Треба викластись на повну. І тепер мені лишилось вирішити, хто буде Денні...» \n\n§RПауза. Потім зойк.§! \n\n«Знаю! Точно знаю!» \n\n§RЗапис завершується.§!"
nf_mnc.203.a:0 "«Ворвік! Одягай шкіряну куртку!»"

nf_mnc.204.t:0 "Бібліотека — щоденник Ворвика"
nf_mnc.204.d:0 "§RГудіння, потім клацання.§! \n\n«Нарешті дібрались до бібліотеки, яку я помітив тижнями раніше. Але це зайняло більше часу, ніж планувалося. Погода — лайно. Не хотів, щоб хтось замерз до смерті. Мені не витягти труп самотужки. Бетсі каже, бачила світні очі в кущах кілька ночей тому. Сподіваюсь, це через недосип.» \n\n§RЗатяжний зітх.§! \n\n«Думаю про те, як наші старі писарі здались. І мене це злісно... розпалює. Напевно, таке слово. Мені байдуже. Просто злюсь. Бо Гонор була права в деяких речах. Йоганна жива — це головне. Мама б перевернулась у могилі, якби двоє її дітей не втрималися.» \n\n§RТихий смішок.§! \n\n«Якщо помру — ця записка залишиться. Лутай сміливо. Не буду тебе лякати... або буду. Залежить, як помру. Лицар Ворвик, кінець запису.» \n\n§RЗапис завершено.§!"
nf_mnc.204.a:0 "Вперед — єдиний шлях."

nf_mnc.205.t:0 "Щось не так"
nf_mnc.205.d:0 "За винятком тихих поривів вітру, бібліотека була безмовна. Щось на кшталт дива — будівля та книги залишилися майже неушкодженими, хіба що з кількома дірами в стінах.\n\nВорвік дістав книгу з полиці, легко струсив її та відкрив. Переглянув сторінки, залиті водою. Щось про озера — не його спеціалізація, але може, знадобиться комусь іншому. Знизав плечима і кинув її в сумку.\n\n«Гей, Вік, маємо проблему», — прохрипів Пенн через рацію. Його голос був повний шуму — досить, щоб зрозуміти: він далеко.\n\n«Та ну?» — Ворвік клацнув язиком, потягнувшись за наступною книгою. — «Недружні хазяї чи брудна зустріч?»\n\n«Ні те, ні інше, просто — тьху!» — вигукнув Пенн. Можна було почути глухий розряд. — «Тут, бляха, черви... І не звичайні.»\n\n«Тобто вони й тут?» — Бетсі сухо посміхнулась. — «А я сподівалась, це тільки в моїй зоні.»\n\n«Знайте одне — я сам обрав кожного з вас для цієї експедиції. Якщо ці черви нас здолають...» — Ворвік зітхнув. — «Мабуть, час мені на пенсію.»\n\n«Ворвік у кріслі-гойдалці, бурчить як старий ветеран? Я б подивилась!» — засміялась Ізольда.\n\n«Це моє ім’я, не затріть його», — усміхнувся Ворвік, обмірковуючи наступну команду."
nf_mnc.205.a:0 "«Погнали цих черв’яків, га?»"
nf_mnc.205.b:0 "«Спершу — книги. Потім усе інше.»"

nf_mnc.206.t:0 "Оболонка та загублений"
nf_mnc.206.d:0 "Вони знайшли оболонку майже відразу. Хоча й «оболонка» — це натягнуте слово. Ніхто з них не бачив нічого подібного.\n\n«Кожного дня щось нове,» — прошепотіла Бетсі.\n\n«Мені це не до вподоби.» — Ізольда схрестила руки. — «Нам слід піти.»\n\n«А нам варто познайомитись. Ми ще сюди повертатимемось. Краще дізнатись, у чому справа, зараз, ніж потім,» — відповів Ворвік.\n\nЛицарі переглянулись — неохоче. Зітхнувши, Ворвік передав сумку Пенн і зробив крок уперед.\n\nОболонка нагадувала згорнутий мішок із борошном. Кальцифікована кора вкривала її поверхню. Кілька черв’яків повзали внизу, смокчучи якусь сікоподібну речовину з тріщин. Але було дещо інше — згорілі книги та порвані аркуші були зібрані в купу попелу. Табірне вогнище? Але чиє?\n\n«БЕРЕЖИ ГОЛОВУ!»\n\nНа крик Бетсі Ворвік встиг підняти зброю. Болт влучив тінь у плече — вона впала поруч із оболонкою. Лицарі оточили її — це була маленька, худорлява фігура у китайському стелс-костюмі.\n\n«Дитина?» — прошепотів Ворвік, прибираючи палець із гачка. Дитя підповзло до оболонки і обійняло її, схлипуючи. Лицарі чекали на наказ, тримаючи зброю на поготові.\n\nВорвік стиснув щелепи. Але рішення було прийнято."
nf_mnc.206.a:0 "«Залишити їх у спокої.»"
nf_mnc.206.b:0 "«Позбавити від страждань.»"

nf_mnc.211.t:0 "Листи після вистави"
nf_mnc.211.d:0 "Дорога Йоганно,\n\nПісля завершення твоєї чудової вистави я не мала змоги висловити вдячність — термінові справи змусили мене піти. Тож пишу тобі зараз, поки знову не зникну.\n\nЯ була у захваті. Ти зібрала відмінну трупу — це видно по їхніх очах. Вони отримали не менше задоволення, ніж ти. Уся публіка чекає наступної вистави.\n\nЗ повагою, Голова-в-Хмарах.\n\nP.S. Обов’язково похвали того, хто зробив зачіску та костюм Єлизаветі в останньому акті — я її ледь впізнала!\n\n———\n\nДякую вам за такі теплі слова, Сентинеле! Дуже приємно!\n\nЯ ще досі в студії, але світло блимає, тож не звертай уваги на мої криві рядки. Кажуть, Ворвік кинув шкіряну куртку так вдало, що вона збила прожектор — решту історії опущу.\n\nРеакція була неймовірна, я вже думаю над наступною постановкою. Може, поговоримо про це якось пізніше?\n\nЗнову дякую!\n\n— Йоганна"
nf_mnc.211.a:0 "І так завершився цей вечір..."

nf_mnc.212.t:0 "Барвистий вечір"
nf_mnc.212.d:0 "Міська площа Фейрв’ю вирувала, попри пізню годину. Громадяни робили останні справи, лицарі патрулювали. Троє закутаних у плащі бігали вулицями.\n\n«Нащо я вдягнений отак?» — прошепотів Ворвік. — «І краще скажи — що ми несемо?»\n\nЙоганна хихикнула поруч. — «Ну ж бо, Вік. Хіба не любиш пригоди?»\n\n«Менше питань — більше руху!» — махнув Трифт. У нього була сумка з паперовими ракетами та глузлива усмішка. — «Я пообіцяв Сільферу шоу.»\n\nЙоганна охнула. — «Гонор десь поруч! Швидко!»\n\nВорвік кліпнув. — «То виходить, Йоганна в курсі, а я — ні?»\n\n«Немає часу! До діла!» — Трифт кинув сірники близнюкам, потім почав запалювати ракети.\n\nКоли Сентинел обійшла ріг, ракети вже злетіли у небо. З тріском і вибухами кольори прапора Сестринства розквітли на нічному небі, опадаючи, мов зорі...\n"
nf_mnc.212.a:0 "Незважаючи на самовільність, феєрверк захопив усіх — навіть саму Сентинел."

nf_mnc.501.t:0 "Поворот у Главі Монтани"
nf_mnc.501.d:0 "Патрокол зібрав свій загін надворі. Вони витягли Йоганну з бункера й кинули на землю. Місцеві мешканці здригнулись від цього видовища, але без належної зброї не могли нічого вдіяти. Гонор стояла тихо по один бік від Патрокола, Лицар Ворвік — по інший.\n\n«Вірність — крихка річ», — почав Патрокол. — «Паладин Йоганно, за порушення Ланцюгів, що Пов'язують, ми подаруємо тобі милість — швидку смерть.»\n\nЙоганна стояла на колінах перед Старійшиною. Її постава була напружена, вона чекала неминучого. Повільно підняла руки, щоб зняти шолом. Як і її броня, обличчя було вкрите пилом і брудом.\n\nАле, на відміну від будь-якого зганьбленого паладина, Гонор помітила: Йоганна не здається. Вона впевнено дивилась Патроколу в очі.\n\nПобачивши обличчя сестри, впевненість Ворвіка змінилась на вагання, а потім — на сумнів. Він глянув на Патрокола: «Старійшино, я—»\n\n«Мовчи!» — рикнув Патрокол. Він підняв руку — Братство чекало наказу."
nf_mnc.501.a:0 "..."

nf_mnc.502.t:0 "Поворот у Главі Монтани (продовження)"
nf_mnc.502.d:0 "«І ти цього не зробиш,» — втрутилась Гонор, приставивши пістолет до його скроні.\n\n«На позиції!» — крикнула Мінерва. Сестри в натовпі підняли зброю на людей Патрокола — у два рази більше.\n\nПатрокол заплющив очі, усміхнувшись. — «Це звучить як поганий жарт. Зрада під час страти за зраду. Бачиш іронію, Сентинеле?»\n\n«Немає іронії у вбивстві без правосуддя,» — відповіла Гонор. — «Віднині ця Глава належить мені. Але, на відміну від тебе, я не вірю в безглузді страти. Повертайся на Середній Захід. Або залишайся, якщо хочеш боротися за щось краще. Але вдруге я милості не дам.»\n\n«Я не буду з тобою битись, Гонор. Але навіть ти маєш розуміти, що щойно зробила жахливу помилку,» — буркнув Патрокол. — «Вони прийдуть і за тобою. Як прийшли за нею.»\n\n«Будь ласка,» — усміхнулась Гонор. — «І коли вони прийдуть, ми покажемо їм, як зустрічають тиранію.»"
nf_mnc.502.a:0 "Патрокол та його Братство пішли, не сказавши більше ні слова."
nf_mnc.502.b:0 "Але, правду кажучи, він мав рацію. Ми відпустили їх без спорядження."

nf_mnc.503.t:0 "Сумніви Йоганни"
nf_mnc.503.d:0 "Йоганна повернула іржавий кран. Скрип, потім — рідина хлинула з носика. Разом із Гонор вона спостерігала, як потік змінювався: від густого, мов дьоготь, до кришталево чистого — вперше за, напевно, століття.\n\nЖадібно набравши воду у флягу, вона зробила ковток. «Блін,» — зітхнула вона. — «Смакує жахливо, але пити можна. І мені цього достатньо.»\n\n«Ось що таке спільна праця,» — Гонор поплескала її по спині.\n\nЙоганна кивнула, глянувши на флягу. — «Я вже думала, що ніколи не побачу цього за життя.»\n\n«Воду?»\n\n«Так, і, ну... нас. Сестер.»\n\n«Сестри борються одна за одну,» — сказала Гонор. — «Ми не можемо дозволити іншим вирішувати нашу долю.»\n\nЙоганна торкнулась фляги до чола. — «Коли мене знайшли, я вже була готова піти у вогні. Як моя мама. Хоча те, що я планувала, було більше схоже на безглузду смерть, ніж героїчну... Але я подумала: якщо помирати, то як Пентекосте.» — Вона зробила повільний вдих. — «Але я нічого з цього не зробила. Навіть не змогла змусити Патрокола вислухати.»"
nf_mnc.503.a:0 "«Для мене ти завжди будеш Пентекосте.»"

nf_mnc.504.t:0 "Сумніви Йоганни (продовження)"
nf_mnc.504.d:0 "Йоганна слабо усміхнулась. — «Не відчувається це так. Я зробила стільки всього, що мама б зненавиділа. Б'юсь об заклад, вона вже зиркає на мене з могили.»\n\n«Я серйозно, Йоганно,» — твердо сказала Гонор. — «Ти слухала серце. А це — не легка річ. Кодекс показує світ чорно-білим. Але серце — це сіре. Воно знає, хто страждає, чиї історії ми розповідаємо, кого забуваємо.»\n\nЙоганна вдивлялась у своє каламутне відображення в флязі.\n\n«Якби не ти, ці люди не були б зараз тут,» — додала Гонор. — «Твоя мати пишалась би тобою. Її серце теж було сірим, як твоє.»\n\n«Дивна метафора,» — хмикнула Йоганна, але посміхнулась. — «Дякую, Гонор.»\n\nГонор кивнула. — «Завжди.»"
nf_mnc.504.a:0 "Згодом вона зрозуміє, що я мала на увазі."

nf_mnc.505.t:0 "Біль Паладина Хейман"
nf_mnc.505.d:0 "«І перш ніж скажеш, Гонор,» — глухо сміялась Хейман. — «Я не прийшла бути твоїм другом. Віддай дівчину та те, що вона вкрала, — і ми підемо.»\n\n«Відступи, Паладине Хейман,» — суворо відповіла Гонор. — «Інакше саме тут стане твоїм останнім прихистком.»\n\n«А як же те, що милість не дається двічі?» — зневажливо зиркнула Хейман. — «Нічого, крім брехні. Патрокол — дурень, що купився на твій блеф. І ще більший — що взяв тебе з собою.»\n\nПаладин Хейман була невблаганною. Як і її лицарі. Їхня броня — спотворена пародія на Середньозахідну. Вм’ятини, іржа, поспіх у збірці. При першому ж повідомленні розвідника, Гонор зібрала все, що могла.\n\n«Просто поклади чортову зброю, Хейман!» — гаркнула Мінерва.\n\n«Є три типи покидьків, яких я не слухаю: рейдери, виродки й зрадники,» — процідила Хейман, піднімаючи зброю. — «І це не зміниться. Ні тут. Ніколи.»\n\nВона вистрелила першою. Сутичка тривала не більше двадцяти хвилин. Сестри знищили її загін, втративши лише одну.\n\nМінерва нахилилась над тілом. — «Треба було нас послухати.» Вона спробувала зняти шолом Хейман, але той не піддавався. — «Запечатано. Що тепер, Хмарко?»"
nf_mnc.505.a:0 "«Поховайте їх так. Нехай спочивають у своїй сталі.»"
nf_mnc.505.b:0 "«Зніміть броню. Ми зробимо з неї кращу справу.»"

nf_mnc.506.t:0 "На пагорбі Конефловер"
nf_mnc.506.d:0 "Коли вечір опускався—сонце гасло під лавандовим небом—Гонор знайшла Ворвіка на пагорбі, що виходив у долину. Він сидів самотньо, оточений дикою жовтою ехінацеєю.\n\n«Милуєшся квітами?» — запитала Гонор, підходячи ближче. Обережно, вона зірвала маленьку жовту квітку з тонкого стебла.\n\nБез броні, Ворвік зсутулився в її присутності — дивне видовище, адже вона ніколи не бачила його без неї. «Так, гарні. У нас таких нема,» — нарешті відповів він, підтягнувши коліна до грудей. — «Чим можу допомогти, Сентинеле?»\n\n«Обміняю квітку на думку?» — простягла вона йому головку квітки. — «Бачу, тебе щось гнітить.»\n\nВорвік пирхнув і відмахнувся. — «Я щойно відмовився від усього, чим був, — всього, за що стояв,» — гірко засміявся він. — «Тож вибач, Сентинеле, якщо мені не до розмов.»\n\n«Але ти говориш зі мною зараз,» — знизала плечима Гонор, відкидаючи квітку. — «Ти зробив правильний вибір.»\n\nВорвік насупився: — «Інший вибір означав би страту за боягузтво. Вибору, насправді, не було.»"
nf_mnc.506.a:0 "«Я бачила, як ти відреагував, коли вивели Йоганну.»"

nf_mnc.507.t:0 "На пагорбі Конефловер — Продовження"
nf_mnc.507.d:0 "«У мене були місяці, щоби все обміркувати. Всі дивилися на мене, коли Йоганна втекла з даними. Це був мій шанс очистити ім'я нашої родини, але коли я побачив її обличчя—» він зупинився і зітхнув.\n\nГонор лагідно поклала руку йому на плече. — «Переконання — річ підступна. Воно легко розсипається, коли ми стоїмо на роздоріжжі. Але саме в той момент — коли мусимо обрати між родиною й обов’язком — ми визначаємо, якою дорогою йдемо.»\n\nВорвік знову зітхнув — цього разу втомлено. — «Старий мав рацію. У тебе гарні слова, Гонор,» — промовив він, вирівнюючи спину. — «Сподіваюся, вони ще щось означатимуть згодом.»\n\n«Вони означатимуть,» — твердо кивнула Гонор."
nf_mnc.507.a:0 "Бо цей шлях — це нове полум’я початку."

nf_mnc.508.t:0 "Як розпорядиться доля"
nf_mnc.508.d:0 "Занурена в свій щоденник, Гонор не звернула уваги на скрип дверей.\n\nМінерва гупнула шолом Анклаву об стіл — понівечений, обпечений, майже розплавлений. — «Глянь,» — сказала вона, вказуючи пальцем.\n\nГонор звузила очі. — «Мінерво, навіть для тебе це недоречний жарт.»\n\n«Це не з Чикаго, Хмарко,» — похмуро відповіла та. — «Загін Йоганни зустрів цього біля гір. Каже, їх було більше, але не хотіла роздмухувати конфлікт.»\n\nДихання Гонор завмерло. Вона уважно роздивилася шолом — наче бачила привида минулого. — «Є втрати?»\n\n«З обома Пентекостами у складі? Лише кілька поранених,» — з усмішкою відповіла Мінерва. — «А я думала, Монтана — це новий початок. Що тепер?»\n\n«Готуємось,» — відповіла Гонор, випроставши плечі. — «Середній Захід кинув нас під удари Чиказького Анклаву. Там, де інші не ризикували, Сестри стояли кожного разу.»\n\nМінерва кивнула. — «Ті сиділи по містах. Ці — в горах. Мабуть, інші.»\n\n«Анклав є Анклав,» — твердо сказала Гонор. — «Ким би були Сестри, якби не боролися у таких війнах?» — Вона зітхнула. — «Але я втомилась від марної смерті. Спершу — посланець. А потім — готуємо полум’я.»\n\nМінерва усміхнулась, надягаючи шолом. — «Сестри — стоять разом, еге ж?»"
nf_mnc.508.a:0 "Сестри — стоять разом."

nf_mnc.509.t:0 "Дощ мене зігріває"
nf_mnc.509.d:0 "Я народилася Голова-в-Хмарах у землях Арк-і-Са, де гори тонуть у тумані. Моя мати, Шепіт-Дощу, була Зоряною Віщункою племені. Вона читала долю у зорях.\n\nЯ більше її не бачила, після того, як Братство викрало мене. Але її мудрість залишилась зі мною. Вона давала мені любов. Вчила любити.\n\nБез неї я б не стояла тут, з Сестрами Сталі, у цих північних землях. Ми перемогли ілюзії, розгромили рейдерів і примар минулого. Більше того — ми створили дім для кожного, хто шукав притулок чи родину.\n\nТож присвячую це тобі, мамо. І всім, хто стояв поруч. Якщо настане мій день — у старості чи в крові — я відпочину зі спокоєм, знаючи, що мене любили.\n\nІ що я любила."
nf_mnc.509.a:0 "І цього було достатньо, щоб збудувати світ."

nf_mnc.209.t:0 "Пісня Сестри"
nf_mnc.209.d:0 "Сестра, кохана, подруга\n\nШлях Дикий, Незораний\n\nНехай Вогонь прониже Небо\n\nРозірване світло гріє рівнини\n\nІз Попелу — знову її знайдемо\n\nСестра, кохана, подруга\n\nСвітанок кує її меч\n\nРозплавлені слова\n\nРозплавлена земля\n\nРозплавлені серця"
nf_mnc.209.a:0 "Світанок кує її меч"

nf_mnc.510.t:0 "Прогулянка в Притулку Хмар"
nf_mnc.510.desc:0 "Гонор помітила дві речі під час прогулянки Притулком Хмар. Перша була приємною: зусилля Сестринства з відновлення столиці просувалися напрочуд гладко. Друга — дивною, хоча й приємною: кожен, кого вона зустрічала, мав на собі чарівні кольорові брошки з квітами.\n\nКрім неї.\n\nПісля розпитування кількох перехожих, Гонор вирушила виправити це. Вона знайшла одну з майстерень Тріфта і зазирнула всередину.\n\n«Привіт?» — покликала вона.\n\nЙоганна і Мінерва схилилися над верстатом. На столі лежало три купки: квіти, нашивки і готові брошки.\n\nЙоганна здригнулася. — «Гонор!»\n\nВорвік, що лежав у кутку на дивані, підняв очі від книжки. — «О, Гонор прийшла.»\n\n«Дякую за нагляд, брате», — пробурмотіла Йоганна і кинула недороблену брошку в його бік. Та не долетіла й до середини кімнати.\n\nГонор підійшла ближче. — «І що це тут у вас?» — усміхнулася вона, піднявши квітку.\n\n«Е-е... просто захопилася ідеєю. Спершу ми робили їх для новобранців, щоб підняти мораль. Але потім я занадто захопилась.» — Йоганна почервоніла й ніяково підсунула до Гонор чотири брошки. — «Не змогла вирішити, яка тобі пасуватиме найбільше, тому зробила кілька.»\n\n«Ого,» — Гонор засяяла. — «Здається, я вже маю улюблену.»"
nf_mnc.510.a:0 "Чарівна фіалка."
nf_mnc.510.b:0 "Розкішна жасминова квітка."
nf_mnc.510.c:0 "Яскрава соняшникова зірка."
nf_mnc.510.d:0 "Привітна примула."

nf_mnc.511.t:0 "Лист до Макартура"
nf_mnc.511.d:0 "До наших сусідів у чужій сталі: прислухайтесь уважно, бо це буде єдине попередження.\n\nСкладіть зброю та здайтеся. Ми — не просто Братство. Ми — Сестринство Сталі: друзі пригноблених і кінець тиранам.\n\nМи віримо в справедливу єдність — у відмову від безглуздого насильства та егоїзму. Тому ми простягаємо вам руку: приєднуйтесь до нас і разом побудуємо майбутнє. Але якщо впадете в зухвалість — присягаю, ми поховаємо вас у горах.\n\nВибір за вами.\n\n— Сентинел Гонор."
nf_mnc.511.a:0 "Справедливе рішення."
nf_mnc.511.b:0 "Ми ніколи не скоримось опозиції!"

nf_mnc.600.t:0 "Слова від Сестри"
nf_mnc.600.d:0 "«Сестринство Сталі» надіслало запит: передати владу до їхніх рук заради блага нашого народу. Дехто вважає це безумством, але інші бачать користь у захисті Братства. Хоча... вони можуть не сприйняти відмову."
nf_mnc.600.a:0 "Ad Victoriam."
nf_mnc.600.b:0 "Смерть тиранам!"

nf_mnc.601.t:0 "З любов’ю, від Єлизавети — до Сентинела Гонор"
nf_mnc.601.d:0 "Нові сусіди, Сестри Сталі, виявили бажання допомогти нашій місії з відродження радості в Монтані. Їхня лідерка Гонор поділяє наші цінності, але просить передати їм значну частину влади."
nf_mnc.601.a:0 "Уклали угоду!"
nf_mnc.601.b:0 "Хороші друзі знають межі."

# Підгілка Патрокола

nf_mnc.700.t:0 "Рівним курсом"
nf_mnc.700.d:0 "Патрокол зібрав взвод на дворі. Йоганну витягли з бункера й кинули долілиць. Братство сформувало коло, щоби ніхто не втрутився. По один бік стояла Сентинел Гонор, по інший — Лицар Ворвік.\n\n«Вірність — річ крихка,» — почав Патрокол. — «Паладин Йоганно, за твої злочини проти Ланцюгів, які Пов’язують, ми даруємо тобі милість — швидку смерть.»\n\nЙоганна стала на коліна. Її постава була тверда, готова до неминучого. Вона зняла шолом.\n\nВорвік здригнувся, побачивши обличчя сестри. — «Елдер, я—»\n\n«Ані слова,» — різко урвав Патрокол. Він не міг його звинувачувати; спостерігати за стратою родини — завжди нелегко. Але часу на сумніви не було. Він підняв руку, зиркнув на Паладина Гейман і кивнув..."
nf_mnc.700.a:0 "..."

nf_mnc.701.t:0 "О, бідна Йоганно"
nf_mnc.701.d:0 "Гейман націлила зброю на скроню Гонор. — «І не думай.»\n\nГонор опустила зброю. Мінерва підняла свою, вигукнула наказ, але тільки частина Сестер відповіла. \n\n«Думала, я не дізнаюся?» — зітхнув Патрокол. — «Зрада під час страти. Справді, Сентинеле, це вже фарс.»\n\n«Немає іронії в несправедливому вбивстві,» — відрубала Гонор.\n\nПатрокол зціпив кулаки. Його дратувала її впертість.\n\nГейман пирхнула. — «Можемо зробити місце для двох.»\n\n«Ні,» — відповів Патрокол. — «Спершу. Скільки вас таких?»\n\n«Більше, ніж ти колись хотів дізнатись,» — Гонор виплюнула у відповідь.\n\nПатрокол кивнув. Гейман знову стиснула курок.\n\nТак Паладин Йоганна стала історією."
nf_mnc.701.a:0 "Нас чекають похмурі часи."

nf_mnc.702.t:0 "Ланцюги, Що Зв’язують"
nf_mnc.702.d:0 "Патрокол знайшов Ворвіка, що сидів наодинці біля бункера, спостерігаючи за тим, як помаранчеві фіалки гойдаються на вітрі під захід сонця. Підійшовши ближче, Патрокол схрестив руки, намагаючись розділити краєвид. \n\n«Лицарю Ворвік,» — кивнув він. — «Про що думаєш? Не схоже на тебе бути таким похмурим.»\n\nКілька довгих секунд — і лише тиша. Потім Ворвік, глибоко вдихнувши, повернувся до Елдера. — «Думав, буде легше, знаєш?»\n\n«Що саме?» — звузив очі Патрокол.\n\n«Я не виню тебе, що не знав — ми мало спілкувались.» — Ворвік зітхнув. — «Вона була моєю сестрою. Йоганна. Я мав місяці подумати про це в дорозі, але все одно... Це було нелегко.»\n\n«Це був твій обов’язок. Треба було виконати,» — зітхнув Патрокол. — «Вална, я впевнений, зрозуміла б.»"
nf_mnc.702.a:0 "..."

nf_mnc.711.t:0 "Ланцюги, Що Зв’язують — Продовження"
nf_mnc.711.d:0 "«Знаєш, що мама сказала мені перед смертю? 'Потурбуйся про Йоганну.'» — Ворвік поглянув на Патрокола з очікуванням.\n\nХоч він і стояв міцно, Патрокол відчув знайомий вузол у животі.\n\n«Це не стає легше.»\n\n«Що саме?»\n\n«Жити з цим.» — Патрокол відвернувся в ніч. — «Це ніколи не стає легше, Ворвік. З часом просто ніби німієш, і це стає частиною тебе.»\n\nВін поклав руку на плече Ворвіка. — «Коли я був хлопчиком, я бачив, як Братство страчує мого батька — ледачого нікчемного рейдера. Я завжди брехав, що народився в цій справі — але це не так.»\n\nВін клікнув язиком. — «Я досі бачу це, коли заплющую очі. Не всі рани загоюються... І це нормально.» — Після цих слів він пішов геть, залишивши Ворвіка наодинці з зірками."
nf_mnc.711.a:0 "Тож візьми до серця свої ланцюги, брате..."

nf_mnc.703.t:0 "Думки Патрокола"
nf_mnc.703.d:0 "Місія в Монтані завершена. Бункер узято під контроль, зрадницю Йоганну страчено, Сестринство знищене — або, принаймні, на останньому подиху. Але чим довше я перебуваю в цих землях, тим більше тривожних чуток доходить: Король Тарганів на сході, культісти з ядерного силосу, уламок Анклаву в горах...\n\nЯкщо хоча б половина з цього правдива — Монтана не побачить спокою. Люди тут беззахисні. \n\nПриродно, наше завдання — забезпечити безпеку. Але це не буде справа одного дня. Враховуючи розкол і жертви, нам доведеться адаптуватися.\n\nМій висновок простий:"
nf_mnc.703.a:0 "Час нової «Славетної Мети»."

nf_mnc.704.t:0 "Що Лишилося"
nf_mnc.704.d:0 "Патрокол пив віскі, втупившись у мурал. Серце щеміло. Коли його зробили — до прибуття експедиції чи після? Він не знав.\n\nНа малюнку — Йоганна. Жива. Справжня. Її очі світили надією — болючою, нестримною надією. \n\n«Щасливий?» — спитала б Гонор, якби була тут. І він відповів би: «Ні.» Вона була його найзапеклішим критиком. Але й тим, хто відкривав йому очі. Тепер її нема.\n\nВін жив за Кодексом. Вона — ні. І все ж її пам’ятають. Не через зраду, а через кольори та квіти на стіні...\n\nА що залишиться після нього? Яка буде його спадщина? «Віскі — небезпечна штука», — подумав він із сухою посмішкою.\n\n«Елдер,» — озвалася Гейман з-за спини. — «Все гаразд?»\n\nВін зітхнув, сховавши пляшку. — «Так. Все чудово. Що тобі потрібно?»\n\n«Просто хотіла перевірити. Ви довго тут.»\n\nПатрокол усміхнувся напівпорожнім серцем. Іноді лояльність — єдине, що залишалося.\n\n«Думаю, що робити з цим муралом.»\n\nГейман схрестила руки. — «Я б стерла. Менше мучеників — краще.»\n\nПатрокол знову глянув на зображення..."
nf_mnc.704.a:0 "Ні, хай лишається. Нехай її пам’ять спочиває в мирі."
nf_mnc.704.b:0 "Ти маєш рацію. Не можна залишати символів бунту."

nf_mnc.705.t:0 "Належний Стимул"
nf_mnc.705.d:0 "Гейман і Патрокол ішли коридорами бункера, насуплені. Зрада Сестринства залишила багатьох у роздумах.\n\n«Це не можна ігнорувати, Патроколе,» — Гейман поклала руку йому на плече. — «Їх треба покарати.»\n\n«Я знаю,» — відповів він сухо."
nf_mnc.705.a:0 "Я був дурнем, що взяв їх із собою."
nf_mnc.705.b:0 "Зараз у нас важливіші справи."

nf_mnc.706.t:0 "Найбільше Американське Зло"
nf_mnc.706.d:0 "Погляд Елдера рвучко піднявся, коли Гейман увірвалась до кімнати — її кроки, завжди важкі, сьогодні були вдвічі лютішими. Вона кинула на стіл те, що Патрокол вважав залишеним у Чикаго.\n\nЦе був шолом солдата Анклаву. Судячи з опіків від плазми збоку — його нещодавно вивели з ладу. Патрокол звузив очі.\n\n«Скільки їх?»\n\n«Поки не знаємо.» — Гейман прикусила язик. — «Але цей прийшов із гір.»\n\nПатрокол перевів погляд з її висначеного обличчя на шолом.\n\n«Треба бути готовими.»\n\n«Зрозуміло, Елдер.» — Гейман віддала честь. — «Які будуть накази?»\n\n«Надішліть його на захід.» — він грюкнув пальцем по лінзі. — «Хай знають: ми йдемо.»\n\nГейман напівусміхнулась. — «Ad Victoriam, Елдер.» — і пішла."
nf_mnc.706.a:0 "Щоб ми ніколи не знали страху."

nf_mnc.707.t:0 "Озираючись Через Плече"
nf_mnc.707.d:0 "Мінерва стала відлюдницею після розколу Сестринства. Але трималась осторонь. Патрокол знав — колись вона зірветься. На світанку, коли вони випадково зустрілись наодинці, вона підняла на нього зброю. І Патрокол, не здивований, підняв свою у відповідь.\n\n«Не змушуй мене бути вбивцею, Мінерво.» — тихо мовив він.\n\n«Змусити тебе?» — зіронізувала вона. — «Скажи це Йоганні.»\n\n«Ти знаєш, що це несправедливо.»\n\n«Вона допомогла цим людям! Вона дала їм життя!» — її голос тримтів.\n\nВистрілила Гейман. Постріл у чоло. І тиша.\n\n«Нарешті спокій.» — Гейман запалила сигару, виходячи з-за рогу.\n\n«Не говори погано про мертвих.» — кинув Патрокол.\n\n«Ми всі про це думали.» — знизала плечима вона.\n\nПатрокол зітхнув, дивлячись на тіло."
nf_mnc.707.a:0 "«Ще одна вільна нитка — обрізана.»"

nf_mnc.708.t:0 "Дивлячись У Очі"
nf_mnc.708.d:0 "Мінерва стала відлюдницею після розколу Сестринства. Та одного ранку, зустрівши Патрокола наодинці, вона витягла зброю. Він — також.\n\n«Не змушуй мене бути вбивцею, Мінерво.»\n\n«Скажи це Йоганні.»\n\n«Ми мали з нею розібратись.»\n\n«Вона врятувала цих людей!»\n\n«Але знехтувала Кодексом. Мій обов’язок — піклуватися про тих, кого я веду.» — Патрокол прибрав зброю. — «Тож, що буде? Вбивство... чи милість?»\n\nНапруга зависла. Але Мінерва також сховала зброю. — «Я тут не за тобою.»\n\n«Я знаю.»\n\nНе промовивши більше й слова, вона пішла."
nf_mnc.708.a:0 "Патрокол витер чоло й відвернувся."

nf_mnc.710.t:0 "Сталь Панувала В Монтані"
nf_mnc.710.d:0 "База ВПС Макартура була знищена зсередини. Вибухівку заклав лицар Тріфт. Ті, хто вижив, тепер корилися Братству.\n\nПатрокол особисто прибув до місця події. «Це було кубло дияволів. Вони отримали по заслугах. А наші — я ними пишаюсь. Шануйте братів. Захищайте їх. У них знайдете мету.»\n\nЙого слова надихнули виснажених солдатів — і спрямували їхні погляди далі."
nf_mnc.710.a:0 "Братство — перемагає."

nf_mnc.713.t:0 "Розбиті Ланцюги"
nf_mnc.713.d:0 "Лють Патрокола була тихою; врівноваженою. Колись давно він навчився тримати себе в руках. «Я був дурнем, що взагалі взяв їх із собою,» — пробурмотів він, хмурячись.\n\nГейман знизала плечима: «Ми ж попереджали.»\n\n«Знаю,» — Патрокол стиснув щоку зсередини, склавши руки. — «І більше не повторю цю помилку.» Він витяг папірець і нашкрябав коротке послання. Пришлепнув печаткою Братства й кинув його Гейман. — «Це наша морквина. Нехай писарі надрукують якнайбільше й розвісять по всьому бункеру — і ззовні, і всередині.»\n\nГейман кинула оком — це була нагорода за кожну самопроголошену «Сестру зі Сталі». Усміхаючись, вона подивилась назад.\n\n«Ad Victoriam, Елдер.»\n\n«Ad Victoriam,» — повторив Патрокол, спостерігаючи порожнім поглядом, як вона йде."
nf_mnc.713.a:0 "Ніяких сестер у моєму братстві."

nf_mnc.712.t:0 "Щодо Відчужених Спільників"
nf_mnc.712.d:0 "«У нас більші справи.» — сказав Патрокол, приховуючи справжні мотиви. — «Нам потрібно укріпити бункер. Якщо вони не хочуть допомагати — їхня справа.»\n\nГейман на мить остовпіла. Потім розсміялась: «Тобто вони... пішли. Забрали спорядження. І ти... Ти просто дозволиш їм це?»\n\nПатрокол ковтнув, хоч і непомітно. «Так. Чи маєш з цим проблему, Головний Паладине?»\n\nОко Гейман смикнулось. «Ні, ні... Звісно, ні, Елдер.»"
nf_mnc.712.a:0 "§MPатрокол знав, що вона бреше.§!"
nf_mnc.712.b:0 "§RГейман знала, що робити далі.§!"

nf_mnc.714.t:0 "Межа Між Людиною і Звіром"
nf_mnc.714.d:0 "Використовуючи стару нотатку, Мечі Гейман виявили покинуте сховище, яке колись слугувало житлом. Там кишіло здичавілими гульми, та вона й її люди швидко з ними впорались. Потім вона зайняла кабінет із видом на територію.\n\nЦе був тимчасовий крок. Щоб відокремитись від Патрокола, їм потрібна була справжня база.\n\nВажкі кроки — до її дверей. У відображенні скла вона бачила постать — Тайт. Весь у крові, не своїй. Він кивнув мовчки. Її рука — на прихованій зброї. Вона знала: він вірний, але й небезпечний.\n\n«Доповідь.» — наказала вона.\n\nВін мовчки простягнув голографічну касету. — «Патрокол вимагає вашого повернення.»\n\nВона розвернулась і засміялась: «Залиш собі. Він знає відповідь.»\n\n«Вони шукають вас.»\n\n«Знаєш, що робити. Збери ще. Нам знадобляться запасні.»"
nf_mnc.714.a:0 "Звір мовчки вийшов."

nf_mnc.715.t:0 "Незабудьки"
nf_mnc.715.d:0 "Патрокол вагався між терпінням і дією. Бойовий дух впав. Щодня Гейман набирала силу.\n\nДо відкритого бунту вона вже встигла захопити частину сил Братства, багато з яких — проти волі. Розвідники, надіслані спостерігати, зникали.\n\nАле з часом солдати почали повертатись. На запитання — хто? — відповідь завжди була одна:\n\n«Нас привів Ворік.»\n\nАле Воріка не було серед них. І Тріфта теж.\n\nПатрокол знав — він не побачить Воріка, поки справа не буде завершена. І це зворушило його серце. Його шлях ще не завершено.\n\nВитерши втому з очей, Патрокол повернувся до командного столу. Він більше не чекатиме. Він прокладе шлях сам — в ім’я обов’язку і серця.\n\nЗа живих. За загиблих."
nf_mnc.715.a:0 "Ad Victoriam."

nf_mnc.716.t:0 "Операція: Збереження Світанку"
nf_mnc.716.d:0 "Патрокол стрімко попрямував до медичного крила. Коридори були заповнені гомоном, але найгучнішою була одна певна палата.\n\n«—А потім ці дурні подумали, що загнали мене в пастку, але все було навпаки. Вони були в пастці зі мною,» — весело хихотів Тріфт. «І тоді я висмикнув чеку.»\n\nПатрокол увірвався до кімнати. «Що тут коїться?!»\n\nТріфт, якого Патрокол не бачив з тих пір, як його перевели до загону Гейман, засяяв: «О, бос!» Біля нього Скрайб АмІті щось гарячково записувала у нотатник.\n\n«Елдер,» — виправив Патрокол і звузив очі. У Тріфта не було однієї руки. «Пам’ятаю, в тебе було дві.»\n\n«А, це?» — підняв залишок руки Тріфт — перев’язану куксу. — «Щойно збирався дійти до цієї частини втечі.»\n\n«Добре, що вибух припік судини, інакше ти би просто стік кров’ю,» — суворо мовила АмІті.\n\n«Як я й казав: все за планом,» — заявив Тріфт. — «Парі тримаю, малий мене підтримає. Ворік ще не проходив?»\n\n«Всі вже були, окрім нього,» — пробурмотів Патрокол, серце стискалось від підозр.\n\nУсмішка Тріфта згасла. «Це не до добра. Це ж мала бути наша остання справа. Якщо він накосячив, то тепер він у Висотах — розкішне місце страти у Гейман.»\n\n«Отже, його схопили для страти?» — Патрокол уже вдягав шолом.
nf_mnc.716.a:0 "«Це ми ще побачимо.»"

nf_mnc.717.t:0 "Початок Збереження Світанку"
nf_mnc.717.d:0 "Легкий вітерець супроводжував зоряну ніч. Ідеальна нагода для споглядання зірок... якби Ворік не стояв на колінах зі зв’язаними руками на краю прірви. \n\n«Не надто театрально?» — кинув він Ґідеону.\n\nТой знехотя буркнув: «Це краще, ніж те, що сталось у Форт Веріті.»\n\nУсмішка Воріка згасла. «З радістю дав би тобі по писку за це,» — пожартував він, махнувши зв’язаними руками.\n\n«А я б прийняв це,» — усміхнувся Ґідеон і підняв рушницю до його скроні. — «Навіть зрадники мають право на гідність: останній світанок.»\n\n«Авжеж,» — тихо видихнув Ворік. — «Певен, ти справді так думаєш.»\n\nІ щойно перше проміння сонця прорізало горизонт — позаду пролунав вибух. Дим і крики здійнялись угору. Ґідеон обернувся — і цього вистачило, щоби Ворік схопив зброю. Вони обоє впали з краю. Ворік приготувався до удару... але його схопили.\n\nМеталевий хват. Силует у силовій броні з реактивною тягою. «Тримайся, хлопче!» — гукнув Патрокол. — «Я тебе витягну!»"
nf_mnc.717.a:0 "Повільно, але впевнено, Воріка витягли на безпечну землю."

nf_mnc.718.t:0 "Немає Війни Без Честі"
nf_mnc.718.d:0 "Патрокол приготував багато козирів, але не очікував, що Амґалан погодиться одразу. Зброю та броню він залишив позаду. Вітерець був приємний — надто давно він відчував щось подібне.\n\n«Вона має бути десь тут,» — сказав Амґалан. — «Вона багато говорила про вас. Маю попередити про щось?»\n\n«Ні,» — Патрокол посміхнувся. — «Я й сам про все згадав.»\n\nВін помітив Хонор на вершині пагорба. Вона чистила броню. \n\n«Думала, не прийдеш,» — мовила вона, не дивлячись.\n\n«Значить, знаєш про загрозу,» — відповів він.\n\n«Я ж попереджала ще у Середньому Заході. Її методи. Її “жертви”. Вони були перекручені.»\n\n«Про тебе казали те ж саме,» — мовив він. — «Але з вас двох — лише одна довела, що я помилявся.»\n\nХонор обернулась. — «Джоханна б хотіла почути цю промову. Вона вірила тобі. І ти знову прийшов не з вірою, а з проханням. Тож збережи ці слова. Мені вони нічого не значать.»\n\nВона кинула ганчірку йому в груди і пішла геть.\n\nПатрокол тяжко зітхнув. Він дивився їй услід, тримаючи ганчірку."
nf_mnc.718.a:0 "Стань навколішки..."

nf_mnc.719.t:0 "Немає Війни без Честі II"
nf_mnc.719.d:0 "Проковтнувши свою гордість, Патрокол звернувся до Честі: "Я помилявся! Я помилився щодо Йоганни." Честь завмерла. "Лише після всього я зрозумів свою помилку. Йоганна відродила спільноту. Вона вивела їх з відчаю й поставила на шлях до майбутнього процвітання. А ми? Ми лише вели війну, палили поля — відкидаючи потенціал, що вона самотужки плекала."\n\nЧесть знову дивилась на нього, на обличчі відбивалась внутрішня боротьба. Поки вона ще не відповіла, Патрокол продовжив: "Коли тебе викрали—" він проковтнув, "Коли я забрав тебе до Братства, я був жорстокою людиною. Але коли ти заснувала Сестер — родину, що нею замінила свою — це надихнуло мене змінитись. Берегти рідних, бо ким би я був без них?"\n\nВін зітхнув і поклав руку на груди. "Я досі недосконалий. Завжди був, і це спричинило нестерпний біль для інших." Він опустився на одне коліно. "Я хочу стати кращим. Виправити все. Тож я благаю—"\n\n"Досить! Хіба ти мене не почув з першого разу?" — сказала Честь, голос її був м’яким, але вже з легкістю. Вона підійшла до нього й простягнула руку. "Вставай. Земля — не місце для Старійшини." Патрокол прийняв руку, і вона допомогла йому підвестись.\n\n"Я щиро," — прошепотів він.\n\nЧесть зітхнула, "Я знаю... Ти змінився."\n\n"Я постійно намагаюсь."\n\nВона засміялась, "Я знаю." Вона вирівнялась. "Як ти пропонуєш нам впоратись із Хейманом?"
nf_mnc.719.a:0 "Патрокол усміхнувся. "Вирішимо це за військовим столом.""

nf_mnc.720.t:0 "Війна Ахіллея"
nf_mnc.720.d:0 "Майстерня була великою, відкритою халупою. Сільською, як усе тут, але з домашнім шармом, що його Честь не могла пояснити. Кам’яна доріжка вела до дверей, а висока жовта трава й квіти морквяника розфарбовували простір у тужливі золотаві тони.\n\nНа полях паслися браміни. Більшість не звертала уваги, але молоді телята підходили з дитячою цікавістю. Ханська дівчинка, що йшла поруч із Честю, знітилась, коли тварини наблизились — її рука стискала долоню Сентінела, коли вона тулилася ближче. Честь засміялась, "Вони не заподіють шкоди."\n\n"Це правда," — погодився чоловік, що вийшов із полів, тримаючи два відра. Хоч зморшки на його обличчі свідчили про вік і битви, його усмішка була молодою.\n\nЧесть напружилася, рука тягнулася до пістолета. "Випадково ви не Браміновий Механік?"\n\nЧоловік видихнув, усміхаючись, "Я не надто перебірливий із назвами." Він рушив угору. "Якщо треба щось полагодити — ходімо."\n\nВони послідували за ним до верстака. Честь підштовхнула Ханську дівчинку — вона витягла зламану іграшкову машинку. Чоловік оглянув її з надмірною уважністю, відповідаючи на всі запитання.\n\n"Зі Спіді все буде гаразд?" — спитала дівчинка.\n\n"Спіді були й кращі дні," — хмикнув він. "Але я бачив гірше." Коли він нахилився, щоб почати лагодити, з його жилета випала бірка. Честь упізнала її.\n\n"Братство?" — звузила очі. Чоловік завмер.\n\n"Колишній," — уточнив він. Завершивши лагодження, він віддав машинку дівчинці. Потім кинув щось Честі — вона зловила: це був набір елементів живлення для її лазерного пістолета. "Але давайте це залишимо між нами, добре?""
nf_mnc.720.a:0 "Честь кивнула, відчуваючи спорідненість із чоловіком."

nf_mnc.721.t:0 "Війна Ахіллея II"
nf_mnc.721.d:0 "Коли Честь вирушила по людину, яку вона вважала ключовою для військової справи — майстра з обслуговування силової броні — вона повернулась із привидом. Патрокол мав напоготові всі формальності, але незакрите обличчя Ахіллея враз змусило його замовкнути, мов двигун, що глухне.\n\n"Привіт і так зійде," — пожартував Ахіллей. Він постарів. Обоє постаріли. Колись давно вони дали обітницю зустріти разом старість.\n\nПрочистивши горло, Патрокол зняв шолом. "Привіт," — сказав після паузи.\n\n"Привіт," — відповів Ахіллей із теплою усмішкою. "Ти не змінився, Патроколе."\n\nПатрокол хмикнув, "Лестощі тебе не врятують, Ахіллею."\n\n"Але ніколи не завадить спробувати," — посміхнувся Ахіллей. "Гарний вступ до питань, які, певно, маєш до мене."\n\nЧесть спантеличено дивилась на обох. Ім’я Ахіллея було легендою ще до її часу. Але вони нічого не пояснювали. І лише коли вона помітила мрійливий зітх Патрокола — вона все зрозуміла."
nf_mnc.721.a:0 "Возз’єднання бувають незграбними."

nf_mnc.722.t:0 "Бог Помер"
nf_mnc.722.d:0 "Об'єкт був порожній; усе цінне давно виніс Гейман або давніші мародери. Графіті та малюнки, створені з розчавлених рослин і крові, вкривали стіни. Мінерва дивилась униз, вистежуючи пастки серед куп розтрощених роботів. Ворік — догори, пильнуючи турелі та небажаних гостей.\n\n"Повернулись у халепу через лист," — з усмішкою мовила Мінерва. "Скільки років минуло з нашої останньої спільної місії, Вік?"\n\n"Останній раз ми були разом на завданні на Середньому Заході. Тобто, роки тому." — Ворік копнув обгорілий корпус Протектрона, розгрібаючи попіл.\n\nМінерва тихо зітхнула, у пам’яті зринає спогад: "Я пам’ятаю. Це була експедиція до монумента в Чикаго. Разом із—" вона зупинилась.\n\n"Так," — пробурмотів Ворік. "Так."\n\nМінерва глибоко вдихнула. Повітря між ними стало важким, ніби і до того не було проклятим. "Ти знаєш, що я поруч, Вік," — почала вона. "У цьому житті немає відпочинку. І я знаю, що ми так і не сіли й не поговорили про те, що сталося—"\n\n"Ми справді маємо говорити про це саме тут?" — різко перебив Ворік, потім зморщився від власної різкості. "Вибач," — зітхнув. "Дякую за турботу. Я подумаю."\n\nМінерва цокнула язиком, але кивнула. "Стій," — сказала вона, погляд прикований до дротів на підлозі. Вона вказала на них. "Іскри. Тут ще є струм — далі по коридору."\n\n"І я думав, що тиша була надто гарною, щоб бути правдою." Ворік підготував зброю. "Попереду?"\n\n"З радістю," — посміхнулась Мінерва, ступаючи вперед. "Прикривай мене, Пентекосте."\n\n"Чорт з цим ІІ," — хмикнув він, гірка усмішка на обличчі.
nf_mnc.722.a:0 "Біль, що ніколи не зникне."

nf_mnc.723.t:0 "Найболючіше Завдання"
nf_mnc.723.d:0 "На столі в кімнаті Патрокола стояла друкарська машинка. Патрокол без силової броні, у окулярах, із похмурим поглядом набирає текст. Честь сиділа збоку, занурена в роздуми. Ахіллей — на ліжку, спостерігаючи за обома. "Це ніколи не стає легше," — промовив він.\n\n"Тут особливий випадок," — відповів Патрокол. "Не кожен день пишеш листа про те, як... загинула твоя мати."\n\n"Цей лист вирішить її життя," — зазначила Честь. "Вона може спробувати вбити нас за те, що ми її підвели. А може зламатися. Або навпаки — зміцнитися."\n\n"Що потрібно людині в такі часи?" — запитав Ахіллей. "Правду, брехню, надію чи реальність?"\n\n"...У мене є ідея," — мовила Честь.\n\nПів години суперечок — і лист було завершено. Патрокол дістав конверт із шухляди. Поглянувши на інших у кімнаті, він сказав лише одне:"
nf_mnc.723.a:0 "Сподіваймося, ми не підведемо Геймана."

nf_mnc.724.t:0 "Вона Померла з Честю"
nf_mnc.724.d:0 "До Ініціата Геймана:\n\nЯ особисто знав твою матір Джастінію. Цей лист — лише для тебе. Приховай або спали після прочитання; не варто ділитися ним ні з ким.\n\nТи, ймовірно, вже отримав офіційне повідомлення, яке називає твою матір зрадницею Братства Сталі. Хтось скаже тобі, що ти останній у ланцюгу невдах, що мусиш очиститися від плями ганьби. Що ти не заслуговуєш нічого, крім вічного прибирання туалетів.\n\nАле вони ніколи не дізнаються всієї правди. Я можу особисто підтвердити — Джастінія ніколи не була невдахою. Вона була віддана нашій справі і зробила все, щоб виправити мої помилки. Але її дії були спотворені тим, хто діяв із лихими намірами, і вона зробила вибір, на який ніколи не мала потрапити. Це я винен. Я не втримав Братство тоді, коли це було найбільш потрібно. Багато хто заплатив за це.\n\nЦе ніколи не стане легше. Але Джастінія Гейман була жертвою, а не зрадницею, якою б її не вважали. Як і паладин Йоганна, вона буде вшанована — не догмою, а прикладом. І лише тобі вирішувати, як вшанувати її пам’ять.\n\nЯ залишу тобі одну пораду — стояти поруч зі своїми братами. Охороняй їх, веди їх. І знаходь у них сенс. Якщо колись надумаєш поговорити зі мною — мої двері завжди відкриті.\n\n— Старійшина Патрокол"
nf_mnc.724.a:0 "P.S. Не дозволяй своїй хворобі стати твоїм життям."

nf_mnc.725.t:0 "Звір, що Кличе"
nf_mnc.725.d:0 "Честь вийшла з намету-лікарні. Патрокол відвів погляд від порожнечі за аванпостом. "Як він?" — спитав він.\n\nЧесть зітхнула, "Дочка Гідеона точно вдалася в матір. Невах ледве дозволила мені ввійти, поки не впізнала."\n\n"Все настільки погано?"\n\n"Він ще марить. Той, кого він випадково поранив — виживе. Лікарі спантеличені. І не лише він. Багато хто почав бачити видіння. Вовки, що не існують."\n\nЦе лягло важким каменем на груди. "Кажуть, Гейман спілкувався з безтілесною сутністю. Занадто реальною, щоби бути просто ІІ," — прошепотів Патрокол. "Скоріше, це схоже на прокляття, що залишилось."\n\n"І переслідує тих, хто був наближений до Геймана." При згадці його імені Патрокол ожив. Ідея.\n\nЧесть напівусміхнулась. "Очі твої видають: ти вже знаєш, куди йти."\n\nПатрокол сухо посміхнувся, погляд його вп’явся в колишні землі Істориків. "Я ніколи не любив копати могили. Але знаю точно — демони не сплять спокійно.""
nf_mnc.725.a:0 "І знову Патрокол надягнув свій шолом."

nf_mnc.800.t:0 "Подорож Йоганни"
nf_mnc.800.d:0 "Поки Патрокол і його експедиція готувались до довгої дороги, паладин Йоганна продовжувала власну, прокладаючи шлях до Монтани, тримаючи шифри й карту завжди при собі.\n\nТам, де її розум не міг пробити шлях — це робив кулак у силовій броні. Вона переправлялася через річки, пливучи на імпровізованих плотах, подорожувала з караванами крізь занедбані ліси й навіть врятувала молодого яо-ґая, який застряг на дереві. \n\nКоли вона дісталась бункера — Форту Веріті — її здивувало, що він не був покинутим, як повідомлялось. Під навісами з тонких тканин люди дбали про рядки паростків. Здивована, Йоганна продовжила з..."
nf_mnc.800.a:0 "Силою!"
nf_mnc.800.b:0 "Розумом!"

nf_mnc.801.t:0 "Швидке Наближення до Форту Веріті"
nf_mnc.801.d:0 "Таня стежила за прибулим. У перехресті свого прицілу вона бачила броньовану фігуру — виснажену, але з рухами хижака, впевненого в перемозі. Таня стисла щелепу. Ще одна біда для Веріті?\n\nОстанні місяці були суцільною боротьбою за виживання. Зламаний очищувач води, рейдери, загублені розвідники, голод і радіація... Це жалюгідне укриття пережило вже занадто багато. Надіястій — так її прозвали: та, що не здається. Хоча це прізвисько дедалі більше здавалося насмішкою. Але вона пообіцяла Катріоні, а Таня завжди дотримувалась слова.\n\nВона помітила плазмову гвинтівку незнайомки — напоготові. \n\n«Назад,» — гукнула Таня до жителів Форту Веріті, озброєних лопатами, що ховались за мішками з піском. «А ти —» вона примружила погляд, «Забирайся. Тут нічого нема.»\n\n«Цей бункер мав бути покинутим,» — відповіла незнайомка в броні, погляд зупинився на рядках вологого ґрунту. «Як довго ви тут уже?»\n\n«Зброю спершу опусти — тоді поговоримо.»\n\nБроня на плечах незнайомки сіпнулась. Таня приготувалась стріляти, молячись, що встигне першою... але на подив, незнайомка кинула зброю на землю.\n\nПотім вона глянула вгору і сказала ще неочікуваніше:"
nf_mnc.801.a:0 "«Дозволь мені допомогти.»"

nf_mnc.802.t:0 "Обережне Наближення до Форту Веріті"
nf_mnc.802.d:0 "Таня спостерігала за прибулою. У прицілі — фігура в силовій броні, виснажена, але спритна й упевнена. Таня зціпила зуби. Ще одна загроза для Веріті?\n\nЇї це влаштовувало. Вона не зводила прицілу з прибулої. Хто ж знає, що в них немає патронів? Бо останнім часом усе йшло шкереберть — зламаний фільтр, рейдери, зниклі розвідники... Надіястій, так її кликали. Та останнім часом це ім’я здавалося гіркою іронією. Але Катріоні вона пообіцяла, і слово тримає.\n\nНа подив, приблуда кинула плазмову гвинтівку — та впала з електричним дзенькотом. «Я не шукаю біди, тільки відповідей!» — пролунало з-під шолома жіночим голосом.\n\n«Тут нічого для тебе нема!» — відповіла Таня. «Іди геть, приблудо.»\n\nТа незнайомка зняла шолом — молода жінка, очі повні надії, яку Таня давно не бачила. «Я — паладин Йоганна,» — сказала вона. «І я маю щось, що допоможе вам.»\n\nТаня відвела очі від прицілу. Паладин? І тоді та жінка запропонувала:"
nf_mnc.802.a:0 "«Я зроблю цей сад зеленим!»"

nf_mnc.803.t:0 "Ніщо Хороше Не Триває Вічно"
nf_mnc.803.d:0 "Мир Йоганни був недовгим. Як і передбачалось, Братство з’явилось. Патрокол особисто вимагав видати Йоганну під загрозою силового вторгнення. Попри протест мешканців, Патрокол знав — справедливість має звершитися: Йоганна мусить відповісти перед Братством.\n\nАле Честь була іншої думки. Йоганна була Братством. Більше того — родиною. Сестри почали змову, аби підірвати авторитет Патрокола..."
nf_mnc.803.a:0 "Сестри зберегли таємницю."
nf_mnc.803.b:0 "Патрокол мав очі всюди."

nf_mnc.804.t:0 "Кінець Гейман"
nf_mnc.804.d:0 "Патроколус мчав через поле бою так швидко, як дозволяло втомлене віком тіло. Стіна вибухів накрила ворожі лінії — так лицар Тріфт привітав Мечі Гейман, його гучний регіт лунав у далині.\n\nУхиляючись від зарядженого плазмового пострілу, Патроколус пірнув у землю, зупинившись прямо перед укриттям. До нього приєдналися паладин Мінерва та лицар Ворік.\n\n«Де Честь?!» — закричав Патроколус крізь шум бою.\n\n«Попереду, з великим поганим вовком!» — засміялась Мінерва, розпалена битвою.\n\n«Я йду!»\n\n«Ми прикриємо,» — сказав Ворік, перезаряджаючи плазмову гвинтівку.\n\nЗ коротким кивком Патроколус зірвався з укриття й рушив уперед, під прикриттям куль і плазми від Мінерви та Воріка. У полум’ї Гейман ішла з механічною впевненістю. З її тріснутого шолома капала темна рідина, схожа на сиру нафту. Честь лежала на землі, тягнучись до свого молота.\n\n«Кінець дороги, сестро,» — прошипіла Гейман.\n\nНе роздумуючи, Патроколус врізався в неї, збивши на землю. Але навіть без зброї її сила перевершила його несподіванку.\n\n«ЦЕ ТИ. ЗАВЖДИ ТИ,» — завила вона, швидко перевертаючи хід. Вони боролися за його рушницю. «Операція Каскад — Чикаго — ось де моє ЖИТТЯ скінчилося, а нове почалося. Мій батько був дурнем. Я вірила в тебе, ми всі вірили, а ти... зрадив, як якийсь рейдер —»\n\nУдар молота відкинув Гейман назад, розбивши частину шолома. Око під ним дивилося з ненавистю, але особистості за ним вже майже не лишилось.\n\n«Забагато балачок,» — пробурмотіла Честь.\n\nПатроколус зірвав спуск — постріл пронизав череп Гейман.
nf_mnc.804.a:0 "У землю впала Джастінія Гейман..."

nf_mnc.805.t:0 "Загибель Мечів"
nf_mnc.805.d:0 "У безкраїй шахівниці Пустки, загибель одного розділу — не кінець його спадку. Чутки ширяться, немов вогонь — сили Гейман, що були символом сили й непокори, тепер поглинуті війною. Слухи про поразку, про епоху, що скінчилась надто рано, нависають над усіма. І друзі, й вороги питають себе: що сталося з Джастінією Гейман?\n\nУ самому серці колишньої території, під охороною останніх вірних, Гейман живе. Бункер MANIFEST — залишок довоєнної інженерії — став її вигнанням.\n\nАле Пустка — це земля таємниць, істин, прихованих під шарами брехні. Поки переможці ділять трофеї, розгортається нова історія, прихована від очей світу."
nf_mnc.805.a:0 "З Гейман ще треба покінчити."

nf_montana.1.t: "Найвеличніша Історія Завжди Розповідається"
nf_montana.1.d: "Ad Victoriam!\n\nБратство принесло мир, стабільність і порядок на Середній Захід. Рейдери? Мутанти? Роботи-вбивці? Усе зникло. Замість них — ланцюги порядку. Не зважайте на чутки про розбрат чи успіхи Анклаву в Чикаго. Ігноруйте єретиків Аппалачів. Вплив Братства незаперечний. А Старійшина Патроколус, герой Загону Сокола, був найвизначнішим з усіх. Хто забуде, як він піднявся в рангах як —"
nf_montana.1.a: "Паладин"
nf_montana.1.b: "Писар"

nf_montana.2.t: "Погляд на Захід"
nf_montana.2.d: "Виконуючи святу місію очищення Пустки, Старійшина направив Патрокола на захід, заснувати новий розділ у Монтані. Деякі брати рушили до Вашингтона, але ми лишилися, щоб охороняти ядерні шахти. \n\nБо хто, як не Братство, мусить пильнувати ці жахливі сили? Якщо якась навіжена сила знову захоче знищити світ, хіба не ми зупинимо їх? Патроколус був мудрий і приніс із собою —"
nf_montana.2.a:0 "Інструменти для створення розділу."
nf_montana.2.b:0 "Зброю для захисту розділу."
nf_montana.2.c:0 "Запасну силову броню."

nf_montana.3.t: "Стародавній Ворог"
nf_montana.3.d: "Наші паладини звільнили виродків Грейт-Фоллс від дикунів без втрат. Ми почали рекрутинг, організували пошукові загони, наклали квоти на фермерів. Але тоді ми знайшли базу ВПС Макартура. За тисячу миль від Чикаго — і вони тут.\n\nКалькулятор принаймні не прикидався людиною. Але ці силові броні — чорні, як їхні серця. Анклав. Після того, як вони спробували стерти Пустку з Нафтової Платформи, вони, як таргани, розповзлись: Чикаго, Столиця, Аппалачі... І ось вони тут. Під личиною «миру» вони хочуть одне — ядерну зброю. Якби ми їх не зупинили, загинули б мільйони. Братство знову мусить врятувати світ."
nf_montana.3.a:0 "Нам потрібен арсенал."
nf_montana.3.b:0 "Нам потрібна армія."

nf_montana.4.t: "Рик Зрадників"
nf_montana.4.d: "Братство відправляло законних громадян у трудові табори. Вони змовлялися з супер-мутантами й гулями, що загрожують Американському Способу Життя. Вони промивали мізки та зневажали законну владу Анклаву. Не задовольнившись Чикаго, їхні дирижаблі принесли їх у Монтану — забрати ваші врожаї, ваше багатство та вашу свободу.\n\nВони прийшли по ваших дітей, зроблять Пустку і назвуть це миром.\n\nАнклав і я боремось, щоб запалити факел свободи — за день, коли торгівля вільна, а демократія заохочується. Ми стоїмо проти варварства — одні. І Братство становить загрозу. Для всіх нас.\n\nЯ обіцяю вам, Монтана, що під моїм наглядом ніхто не носитиме кайданів. Жодного американського громадянина не буде відправлено до трудового табору за відмову платити 'податок' Братству чи за слова проти їхньої тиранії. Під моїм керівництвом і під Анклавом ми збережемо вашу безпеку.\n\nТож зробіть ще один крок, американці. Пройдімо разом у [MNC.Capital.GetName].\n\nСерединне Братство вимагає мого підкорення — вашого рабства. Та я обіцяю вам, від імені Анклаву — я ніколи не здамся фашистській парамілітарній організації."
nf_montana.4.a:0 "Хай благословить Анклав..."
nf_montana.4.b:0 "І хай благословить Монтану."

mnc_reconcile_with_sisters:0 "Примирення з Сестрами"
mnc_reconcile_with_sisters_desc:0 "§CЖурнал Патроколуса§!\n\nЯ відмовляюсь — відмовляюсь карати братів і сестер, які стали на бік надійних Сестер. Братство вже пролило надто багато крові. Та є інший шлях — і я піду ним, навіть якщо це буде моїм прокляттям в очах ортодоксів. Сестри повинні мати місце в нашому розділі — на полі бою чи ні."

mnc_earning_forgiveness:0 "Здобути Прощення"
mnc_earning_forgiveness_desc:0 "Як і писарі працюють у бункерах подалі від бою, ми можемо призначити Сестер на такі самі ролі — будівництво, їдальня, логістика. У них ще є місце і причина діяти. Як то кажуть: вільні руки творять зло..."

mnc_rewarding_loyalty:0 "Винагородження Вірності"
mnc_rewarding_loyalty_desc:0 "Як донька заслуговує нагороди за правильні вчинки, так і ми можемо винагороджувати вірних Сестер за їхню сумлінну працю. Це надихне інших загоїти розкол."

mnc_demanding_a_sitrep:0 "Запит Ситуаційного Звіту"
mnc_demanding_a_sitrep_desc:0 "Нещодавній від'їзд Гейман на схід викликає занепокоєння серед наших. А також плітки... Надішлемо офіційне повідомлення — хай вона поясниться."

mnc_send_in_warwick:0 "Викриття Намірів Гейман"
mnc_send_in_warwick_desc:0 "Наші вимоги проігноровано. Я санкціоную лицарів Воріка та Тріфта для розвідки — вони мають з'ясувати, чим займається паладин Гейман."

mnc_double_agents:0 "Вірність Кайданам"
mnc_double_agents_desc:0 "Чорт із Гейман — її вірність була не мені. Її позбавлено звання та влади як Головного Паладина. Кожен паладин, що підпорядковується їй, буде покараний за порушення Ланцюгів, Що Єднають. Жоден не повірить у 'Старійшину' Гейман."

mnc_recover_stolen_goods:0 "Повернути Викрадене"
mnc_recover_stolen_goods_desc:0 "Згідно з журналами інтенданта, у нас зникла значна кількість спорядження. Усі сліди ведуть до Гейман. Час покласти цьому край."

mnc_siegfras_mission:0 "Місія Зігфри"
mnc_siegfras_mission_desc:0 "Завдяки паладину Зігфрі, вербування й бойовий дух наших рекрутів вищий, ніж будь-коли. Здається, їй вдалося вийти на контакт із паладином Гідеоном. Коли прийде час — вона переконає його діяти в наш інтерес, а ми гарантуємо безпеку йому й його доньці."

mnc_radio_silence:0 "Радіомовчанка"
mnc_radio_silence_desc:0 "Минуло чимало часу з того моменту, як лицар Ворік мав вийти на зв'язок. Хоч затримки звичні в ці часи, Ворік — один із найкращих. Тож залишилось два варіанти: мертвий або захоплений. Маємо негайно почати розслідування."

mnc_no_man_left_behind:0 "Жодного Чоловіка Не Лишити"
mnc_no_man_left_behind_desc:0 "«Не витрачатиму часу на звіт. Еміті мене вб'є за неформальність. Знайшли місце страт. Воріка відправили туди. Готові гуркотіти.»\n\n— Лицар Тріфт"

mnc_extending_an_apology:0 "Простягнути Вибачення"
mnc_extending_an_apology_desc:0 "§CЖурнал Патроколуса§!\n\nВід багатьох років лідерства я навчився, що часом нема правильного вибору. Мої попередники діяли на основі принципу та жертовності; добробут багатьох важливіший за жменьку. Але після Пекла Гейман, нам потрібні всі союзники. Бо не буває війни — без Честі."

mnc_regaining_fort_veritys_trust:0 "Відновлення Довіри Форту Верітас"
mnc_regaining_fort_veritys_trust_desc:0 "Після страти Йоханни попередніх мешканців Форту Верітас вигнали з бункера, а їхню власність було реквізовано для "кращого" використання. Порядок був необхідним, але луна неспокою залишилась. Ті, хто залишився, не живуть з нами через згоду з нашими методами — вони залишились, бо більше нема куди йти. А тому, заради нашого майбутнього, нам слід звернутись до них і укріпити ці зв'язки."

mnc_honours_recruitment:0 "Рекрутинг Від Честі"
mnc_honours_recruitment_desc:0 "§PЖурнал Честі§!\n\nМи живемо у дивні часи. У мені борються гнів і розуміння. Але я нікому не підкорюсь. Я зроблю все, щоб захистити Сестер і пустельників, що не заслуговують на це лихо. Я мовчу. Говорю тільки коли справді потрібно. Я ділю ці зали з тими, хто стояв осторонь, коли Йоханну стратили. «Краще вона, ніж ми», певно думали вони.\n\nМи не новачки у війні. Разом ми вистоїмо. Я приведу Патроколусу його армію. Побачимо, як він нею керуватиме."

mnc_a_hanged_mans_war:0 "Війна Повішеного"
mnc_a_hanged_mans_war_desc:0 "§CЖурнал Патроколуса§!\n\nМолоді рекрути називають війну між Гейман і рештою Братства “Війною Повішеного”. Вони певні, що її доля — саме така.\n\nАле вони не знають, що Гейман була моєю найвірнішою підлеглою. Тепер вона вважає нас зрадниками Кодексу. Та насправді, тільки вона й зрадила його. І вона ще дізнається це — на власній шкурі."

mnc_scrap_hayman_augments:0 "Утилізація Аугментів Гейман"
mnc_scrap_hayman_augments_desc:0 "Жахливі експерименти були проведені над Гейман і її людьми. Їхні тіла понівечені технологіями, які ніколи не мали стосуватись людства. Ми досі не знаємо, скільки в цьому її вини, а скільки — дій іншого, невідомого ворога. Ми розберемо ці імпланти й використаємо їх з гуманнішою метою."

mnc_follow_the_howl:0 "Слідувати За Виттям"
mnc_follow_the_howl_desc:0 "Наші писарі отримали нові дані про те, що могло звести Гейман з розуму. Ці дані ведуть до довоєнного медичного протоколу — штучного інтелекту. Ми повинні дізнатись більше. Навіть якщо це небезпечно."

mnc_rehabilitate_soldiers:0 "Реабілітація Солдатів"
mnc_rehabilitate_soldiers_desc:0 "Багато солдатів Гейман були не винні у своїх діях. Їх ввели в оману, їхні тіла та розуми зламали. Ми, як Братство, маємо обов’язок повернути їх до себе. Вони — наші брати та сестри. І ми не залишимо їх у темряві."

mnc_familiar_secrets:0 "Знайомі Таємниці"
mnc_familiar_secrets_desc:0 "Розвідка виявила місце, де, ймовірно, проводились експерименти над людьми Гейман. Ми відправимо туди не Честь, а Мінерву. Сентинел потрібна для важливішого завдання."

mnc_convincing_minerva:0 "Зв'язок з Мінервою"
mnc_convincing_minerva_desc:0 "Наслідки можна пробачити — наміри ж були чисті, чи не так?"

mnc_take_down_enclave:0 "Темний День"
mnc_take_down_enclave_desc:0 "Куди б ми не пішли — Анклав нас знаходить. Щоб захистити Скелясті Гори, нам доведеться мобілізувати кожного, навіть пустельників!"

mnc_build_up_toenclave:0 "Кайдани, Що Єднають"
mnc_build_up_toenclave_desc:0 "Загроза з боку Полковника призвела до нових вербувань. Хтось прийшов добровільно, когось змусили. Але всі вони — ланки Великого Ланцюга, що тягнеться з часів нашого заснування."

mnc_purge_enclave_survivors:0 "Чистка Еліти Анклаву"
mnc_purge_enclave_survivors_desc:0 "Деякі можуть стати частиною Ланцюга. Але не всі. Особливо ті, хто винен у злочинах під Наварро та Бойстауном. Їх буде покарано. Інші — отримають другий шанс."

mnc_terms_surrender:0 "Прийняти Умови Капітуляції"
mnc_terms_surrender_desc:0 "Анклав вбив багатьох з наших. Але ми не забудемо героїв. І все ж ми не дозволимо емоціям завадити логіці. Ми вже вербували рейдерів, мутантів і фанатиків. Макартур — лише ще одна фракція під нашим стягом."
mnc_terms_surrender_tt:0 "§PПідрозділи Анклаву§! будуть призвані до лав Братства. Ви також отримаєте бонус до §Yлояльності§! в усіх регіонах §P[MCA.GetNameWithFlag]§!."

mnc_advanced_planes:0 "Крила Братства"
mnc_advanced_planes_desc:0 "Майору Сант’яго не вдалось знищити всі вертиберди до нашого прибуття. Її секрети — наш шлях до нових перемог."

mnc_enclave_wargoal:0 "Заради Безпеки Людства"
mnc_enclave_wargoal_desc:0 "Мільйони загинули через дії Анклаву. І тепер Полковниця прагне знову використати ракети. Але ми милосердні. Усі мають шанс на спокуту. Ми запропонуємо [MCA.GetLeader] капітуляцію — і попередимо її людей."

mnc_summon_dagger_squad:0 "Виклик Загону «Кинджал»"
mnc_summon_dagger_squad_desc:0 "«Кинджал» — один із найкращих підрозділів Серединного Братства. Вони боролися проти Калькулятора і брали участь у штурмі Спрінґфілду. Тепер — вони наші союзники в цій дикій землі."
mnca_recruit_dagger_squad:0 "Паладинський Загін §G«Кинджал»§! прибуває до бою!\nСтворено три §Gелітні дивізії в силовій броні§! у провінції §YФейрв’ю§!."

mnc_republic_steam_conquer:0 "Окупація Єллоустоуну"
mnc_republic_steam_conquer_desc:0 "Занадто довго священики та рейнджери Єллоустоуну ховали джерело сили. Ми знаємо, як його використати."

mnc_heavens_gate:0 "Стук у Небесну Браму"
