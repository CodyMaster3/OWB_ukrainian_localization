##########################################################################
###                   Локалізація Відділення Монтани                   ###
###         Переклад заснований на лорі Fallout та OWB                 ###
##########################################################################

montana_nf:0 "Відділення Монтани"

mnc_research_bonus:0 "Бонус досліджень Монтани"
power_armor_bos_research:0 "Бонус досліджень силової броні Монтани"
bos_robotics_nonsense:0 "Бонус досліджень робототехніки"

# Початкові фокуси

mnc_montana1:0 "Атака Патрокола"
mnc_montana1_desc:0 "Патроколус отримав завдання найвищої важливості: відстежити одного з найновіших і найзрадливіших відступників Середньозахідного Братства."

mnc_montana2:0 "Сестри Сталі"
mnc_montana2_desc:0 "Недоформований, неофіційний орден у структурі Середньозахідного Братства, 'Сестри Сталі' отримали свою назву завдяки провідним фігурам: Паладину Мінерві та Сентінелу Хонор. Остання отримала незвичний ранг завдяки відвазі та успішній боротьбі проти сил Анклаву під час сутичок у Чикаго. Попри соціальну ізоляцію, більшість учасниць — еліта Братства. Хоча в останні роки вони й зазнали ганьби через дії своїх одноплемінниць, у Монтані багато хто з них прагне відродження та має щось довести."

mnc_montana3:0 "Сімейні справи"
mnc_montana3_desc:0 "Коротка розмова дорогою до Монтани..."

mnc_arrival_in_serendipity:0 "Бункер Форт Веріті"
mnc_arrival_in_serendipity_desc:0 "Коли Відділення Монтани наближається, Паладин Йоганна вирушає у власну подорож..."

#####################
### Гілка Сестер ###
#####################

mnc_honorsplan:0 "План Хонор"
mnc_honorsplan_desc:0 "Після подій у бункері почали ширитися чутки. Страх і тривога охопили серця тих, хто не сприймає наказів Патрокола. Одного спостереження чи невдоволення — замало. Потрібен новий підхід до Братства — §Pплан Хонор§!."

mnc_water:0 "Кришталева чистота"
mnc_water_desc:0 "Водний чип бункера майже вийшов з ладу — зношений віком і нещодавнім перенавантаженням. Диво, що він взагалі працює. Мешканці бункера неохоче, але дозволили нам оглянути чип. Можливо, нам вдасться повернути прозорість водам."

mnc_securingthebunker:0 "Кожен чужинець — потенційний друг"
mnc_securingthebunker_desc:0 "Позитивні зміни починаються з того, як ми ставимось до людей поза нашими лавами. Мешканці бункера надали нам доступ до своєї продукції. Разом з ними ми можемо почати розвиток методів масового землеробства. Ми не зрадимо цю довіру."

mnc_townhall:0 "Привиди Сталі"
mnc_townhall_desc:0 "Після вигнання Патрокола ми гадали, що Середньозахідне Братство стане проблемою згодом. Але наші патрулі та поселенці повідомляють про дивну активність біля кордону. Ситуація потребує негайного розслідування. Сподіваймося, що ці силуети — всього лише рейдери..."

mnc_unitybybrotherhood:0 "Єдність у Сестринстві"
mnc_unitybybrotherhood_desc:0 "Спільне володіння бункером, а не повне підкорення, виявилось успішним. Хоча §Pзміна влади на користь Хонор§! викликала невдоволення в рядах Відділення Монтани, спонукавши багатьох писарів і лицарів до дезертирства, нові дружні зв’язки з мешканцями бункера підтримують полум’я єдності. Тепер багато хто з гордістю бере на себе звання Сестри."

  #Ліва гілка — Допомога простим людям тощо

  mnc_helpingtheneedy:0 "Погляд за Тином"
  mnc_helpingtheneedy_desc:0 "Після відновлення позицій у Відділенні Монтани, нам не завадить облаштувати виробничі потужності поблизу кордонів. Це також відкриє нам можливість спостерігати за діями сусідів..."

  mnc_workingalongsidefarmers:0 "Одна нога — в ґрунті"
  mnc_workingalongsidefarmers_desc:0 "Щоб зрозуміти труднощі наших робітників, потрібно працювати разом з ними. Надішлемо кількох Лицарів у поля, щоб вони допомогли на практиці. Це зменшить тягар для фермерів і дозволить отримати точний звіт про стабільність регіону."

  mnc_brotherhood_irrigation_program:0 "Подарунки від Сестер"
  mnc_brotherhood_irrigation_program_desc:0 "Монтана — це дім, притулок для потребуючих, можливість для кожного. Створена руками Сестер, вона символізує надію. Ми повинні закріпити цей образ — почнемо з малого: подарунки, доброчесність і щедрість."

  mnc_brotherhoodinitiative1:0 "Одне Око — в Небо"
  mnc_brotherhoodinitiative1_desc:0 "Руїни давніх будівель мають своє призначення, але спальник на бетоні — це не дім. Ми вже не дикуни. Настав час розчистити завали і збудувати нові оселі."

  mnc_brotherhoodinitiative3:0 "Ініціатива Домогосподарств"
  mnc_brotherhoodinitiative3_desc:0 "Живе домогосподарство — це сильне домогосподарство. Сестринство — не лише меч, а й захисниця з серцем зі сталі. Віднині ми зобов’язуємось брати участь у справах громади — як наставники, волонтери, опікуни. Ми — тими, ким потребує нас народ."

  #Фокуси Румінаторів

  mnc_ruminators:0 "Подруга на Ім’я Єлизавета"
  mnc_ruminators_desc:0 "§PЗапис Голови у Хмарах§!\n\nМи зустріли дивну жінку на самому краю наших земель. Лицарі поставилися до неї з гумором, а місцеві — з теплотою. Її звуть Єлизавета, вона очолює Румінаторів. Вона подарувала кошик із фруктами, консервами й квітами. У відповідь я запросила її на вечірню розмову за чаєм."

  mnc_ruminators_puppet:0 "Маленькі Сестри"
  mnc_ruminators_puppet_desc:0 "§PЗапис Голови у Хмарах§!\n\nРумінатори — люди із золотими серцями. Вони не знають зла, але якщо коли-небудь зустрінуть його, це золото згасне попелом. Ми, як друзі та союзники, не допустимо їхнього знищення. Якби щось трапилося з Єлизаветою... Як казала Тріфт, 'зброя би загриміла'."

  mnc_brotherhood_sponsors:0 "Римування для Радості"
  mnc_brotherhood_sponsors_desc:0 "Ми надали Румінаторам змогу продовжувати свої справи під нашим захистом. Єлизавета зустріла нас з радістю і відкритими обіймами, прагнучи поширювати сміх і щастя замість зброї."

  mnc_ruminators_calling:0 "Пісні Загублених"
  mnc_ruminators_calling_desc:0 "§PЗапис Голови у Хмарах§!\n\nЄлизавета і ті Румінатори, хто вижив, з’явились біля наших воріт посеред ночі. Вона була спокійна, але її колишній запал згас. Ми їх прийняли. Про те, що трапилося, вона не сказала нічого. І я не питала."

  #Хани (у майбутньому)

  mnc_thekhans:0 "Споріднені Душі — Єдині у Ганьбі"
  mnc_thekhans_desc:0 "§RУ розробці для версії 5.0!§!"

  #Основна гілка (частина 1)

  mnc_rebootingthesistersofsteel:0 "Зварюємо Нову Сталь"
  mnc_rebootingthesistersofsteel_desc:0 "Часи примусової служби закінчено. Озброєна Сестра — це віддана Сестра; воїн, що знає ціну битви і бореться за ідею. Ми надали змогу тим, хто втомився від війни, повернутися до цивільного життя. Разом ми куємо нову сталь для тих, хто сам її обирає."

  mnc_musterthesisters_1:0 "Рука для Тих, Хто Залишився"
  mnc_musterthesisters_1_desc:0 "До того, як з'явилася сталь, багато Лицарів були племенниками. Передусім — ми мусимо почути їхній голос. Якщо настане день, коли ми знехтуємо стражданнями, які завдали, то хай зійде на нас прокляття. Бо тоді, у прагненні величі, ми забудемо творити добро."

  mnc_musterthesisters_2:0 "Клятва Відданості"
  mnc_musterthesisters_2_desc:0 "Щоб іти вперед, треба довести, що наша відданість — не порожні слова. Попри те, що Хонор надає перевагу діям, буде корисно, аби наша Сентінел виступила з промовами та історіями для своїх воїнів."

  mnc_sisters_shall_stand_together:0 "Сестра, Народжена в Мороку — Піднята Сталлю"
  mnc_sisters_shall_stand_together_desc:0 "Сестри, які колись були племінницями, поступово звикають до своєї свободи. А ті, що навчились нетерпимості, вчаться забувати старе. Прогрес важкий, але одне безсумнівне: ми всі народжені в мороці цього світу — і лише разом, в єдності, ми піднімемось у сталі."

  mnc_reavers_legacy:0 "Повернути Потік"
  mnc_reavers_legacy_desc:0 "Різники у наших рядах попросили доступ до передових технологій для своїх досліджень. Це, за їхніми словами, відновить їхній зв’язок із 'потоком струму'. Хонор не бачить у цьому загрози. Нехай отримають бажане."

  mnc_reavers_legacy_2:0 "Зв’язок із Богами"
  mnc_reavers_legacy_2_desc:0 "Після низки недавніх успіхів Різники звернулися з проханням надати їм доступ до інших технологій. Вони надто довго були відірвані від своїх Богів. Давайте відновимо цей зв'язок."

  mnc_medicine_techniques:0 "Духи та Оболонки"
  mnc_medicine_techniques_desc:0 "Кімната для досліджень, яку ми надали Різникам, переповнена схемами й незрозумілими нотатками. Вони запропонували експеримент, який може відкрити нові горизонти в медицині та спорядженні."

  mnc_brotherhoodinitiative2:0 "Паливо для Полум’я"
  mnc_brotherhoodinitiative2_desc:0 "Наші ресурси виснажує суворий клімат Монтани, особливо взимку. Але на обрії видно дим надії. Західний 'Вугільний консорціум' вважає Форт Вериті своєю територією і незадоволений нашою присутністю. Я не схильна до насильства... але в їхній жорстокості прихована можливість."

  mnc_coalconsortium_resistance:0 "Пластир Не Допоможе"
  mnc_coalconsortium_resistance_desc:0 "Переговори зі Стівеном провалилися. Розкішний і пихатий, він накопичив ресурси, поки інші боролися за крихти. Ми просили поділитися тим, що йому не потрібно. Він відмовив. Нічого. Якщо він не зміг — ми це зробимо."

  mnc_beastlords_legacy:0 "Приглушена Спадщина"
  mnc_beastlords_legacy_desc:0 "Діти Повелителів Звірів, які влилися до Братства майже століття тому, вже сповна відплатили за гріхи своїх предків. Вони знають лише добрі історії — про матерів і батьків, що жили поряд з істотами пустки. Обережно повернемо їм старі традиції — без канібалізму, звісно."

  mnc_beastlords_legacy_2:0 "Голос, Що Не Замовкає"
  mnc_beastlords_legacy_2_desc:0 "Хоча їх небагато, нащадки Повелителів Звірів мають слабкий психічний контроль над істотами. Дехто з них виявив бажання розвивати цей дар. Це може бути надзвичайно корисним. Дамо їм шанс."

  mnc_beastlords_exertions:0 "Повернення Дикої Природи"
  mnc_beastlords_exertions_desc:0 "Наші патрулі помітили збільшення кількості бродячих псів. Всі вони дружні. Ми дозволили нащадкам Повелителів Звірів взяти їх під опіку — й ті були в захваті."

  mnc_sisters_thinking_bigger:0 "Пограбування"
  mnc_sisters_thinking_bigger_desc:0 "Залишки спротиву та рейдерів продовжують бити по наших слабких місцях. Нам треба вистояти, поки наші сили адаптуються. З новими ресурсами ми покажемо, на що здатні."

  mnc_sister_metalmouths_goal:0 "Справжній Лускунчик"
  mnc_sister_metalmouths_goal_desc:0 "Сусідство з 'Металевими Пащами' викликає занепокоєння. Ніхто не хоче жити поряд із нацією рейдерів, ще й рабовласників. Вони мають цінну зброю для несправедливих цілей. Пора виправити це."

  mnc_sister_havre_goal:0 "Візит до Міста"
  mnc_sister_havre_goal_desc:0 "Гавр — колись мирне поселення, нині захоплене новою релігійною силою. Хоча їхній Культ Свободи слабко структурований. Ми можемо надати їм захист і лідерство. Наші найкращі Паладини та досвідчені Писарі зможуть усе владнати."

  mnc_metalmouths_scavenging:0 "Зібрати Уламки"
  mnc_metalmouths_scavenging_desc:0 "Відмова від примусової мобілізації змусила нас стикнутися з рейдерськими групами. Треба зосередитись на їхньому знищенні та підвищити рівень безпеки."

  mnc_havre_acclimation:0 "Серця з Хрестом"
  mnc_havre_acclimation_desc:0 "З Культом Свободи під контролем Сестер, ми готові розпочати відновлення й побудову нового дому для мешканців Гавра. Наші сили вже на старті."

  mnc_sisters_pitching_the_flag:0 "Розфарбуймо Небо"
  mnc_sisters_pitching_the_flag_desc:0 "§PЗапис Голови у Хмарах§!\n\nПисар Сільфер звернувся до мене з ідеями про новий прапор — той самий, який він створив після перевороту. Він хоче, щоб ми ширше використовували його символіку — фарбували броню, вивішували стяги. Навіть запропонував свята... хоча я пропустила деталі."

  ### Війна з Анклавом

  mnc_sisters_believe_in_fair_play:0 "Серця, Що Кровоточать"
  mnc_sisters_believe_in_fair_play_desc:0 "§PЗапис Голови у Хмарах§!\n\nАнклав наближається. Хоча загроза ще не нагальна, Сестри занепокоєні. Я бачила Анклав у Чикаго. Вони забирають усе — аж поки не залишиться нічого. Чекати — вже розкіш, якої ми не маємо."

  mnc_a_peaceful_resolution:0 "Серед Троянд"
  mnc_a_peaceful_resolution_desc:0 "§PЗапис Голови у Хмарах§!\n\nЦе все перевершує мої найсміливіші мрії. Цікаво, що б сказав Патрокол, побачивши нас поруч із ворогами, яких ми знали лише через жахіття? Я пообіцяла Сестрам провести їх цією землею. Те, що почалося як крихке зернятко, розквітло, як троянда. І в нас ще стільки попереду."

  ###THE SISTERS STRONGHOLD — CAN BE A NEW NAME, TOO, BY THE WAY! WE CAN RENAME CITIES ON THE MAP

  mnc_children_wargoal:0 "Шпиль на Пагорбі"
  mnc_children_wargoal_desc:0 "З нашої розвідки випливає, що Церква Шпиля — культ, який зберігає радіоактивні реліквії. На відміну від Культу Свободи, вони не підтримують наші ідеали миру. У Пустці слабкі не виживають. Якщо ці люди хочуть жити — їм потрібен порядок."

  mnc_cannibalism_ban:0 "Голодні до...?"
  mnc_cannibalism_ban_desc:0 "Попри наші попередження, дехто не сприймає серйозно закон проти канібалізму. Тепер, коли Обеліск-Чантрі зведено, настав найкращий момент для запровадження суворіших обмежень."

  mnc_macarthur_ruins:0 "Ніхто не виграє на випалених полях"
  mnc_macarthur_ruins_desc:0 "§PЗапис Голови в Хмарах§!\n\nЯ була наївною, думаючи, що це закінчиться інакше. Але хоч ми й не дотягнулися до місяця, впали на зірку. Авіабаза Макартура ідеально підходить для гірської фортеці — стійкої до стихій і будь-яких загроз. Використаємо її негайно."

  mnc_reaver_scientists:0 "Різники в Нових Халатах"
  mnc_reaver_scientists_desc:0 "Наш вплив зростає, і Різники знову звернулися з проханням про матеріали. Їх надихає наш успіх — дозвольмо їм мріяти масштабніше."

  mnc_military_development:0 "Навчити Сестру"
  mnc_military_development_desc:0 "Ми маємо стільки новобранців і добровольців, що й не злічити. Паладини Мінерва та Йоханна хочуть особисто супроводжувати їх у підготовці та допомогти їм із обов'язками в громаді."

  mnc_assess_the_economy:0 "Нові Горизонти"
  mnc_assess_the_economy_desc:0 "Зі зростанням нашої території з'явилось безліч покинутих будівель. Сестра не залишиться без ремесла — розберемо старі будівлі на ресурси й зведемо нові."

  mnc_dedicated_homeliners:0 "Молотки Майстрів"
  mnc_dedicated_homeliners_desc:0 "Писар Августин — один із небагатьох, хто був відданий Сестринству ще до повстання — запропонував укріпити оборону завдяки майстерній обробці. «Мені це наснилося, — сказав він. — Бачив лінію оборони, створену з досконалістю митця». Ну, раніше він нас не підводив."

  mnc_training_the_young:0 "Заради Кращого Майбутнього"
  mnc_training_the_young_desc:0 "Лицар Тріфт зібрав команду дослідників і майстрів зброї. Вони пропонують проєкт модернізації нашої холодної зброї. \n\n«Навіть якщо не спрацює — ми навчимося, — сказав Тріфт. — Але якщо вийде... Гей, Гонор, як тобі ідея вибухового меча?»"

  mnc_tribal_initations:0 "Уроки Забутих Традицій"
  mnc_tribal_initations_desc:0 "Сестри стали значно адаптивнішими після скасування стигми щодо культурних практик. Більшість новобранців не мають племінного коріння, то чому б не передати їм ці знання й звичаї?"

  mnc_washington_invasion:0 "Королева Півночі"
  mnc_washington_invasion_desc:0 "Анклав повалено, і Гонор звертає погляд на північні землі Монтани й Вашингтона. Сестри крокують за нею. Що б не чекало попереду — ми зустрінемо це разом."

  mnc_temple_of_the_old_gods:0 "Обеліск-Чантрі"
  mnc_temple_of_the_old_gods_desc:0 "Чантрі, що дозволяє практику всіх культур і проводить громадські заходи — ідея, яку давно виношували Сестри. Анклав — у минулому. Час будувати Чантрі."

  mnc_embrace_traditions_over_codex:0 "Писарі Нових Знаків"
  mnc_embrace_traditions_over_codex_desc:0 "Серед нових поселенців ми завербували нових Писарів. Вони захоплені нашими принципами — і на щастя, не скути суворими законами Братства. Підготуємо ресурси, щоб допомогти цим майбутнім вченим."

  mnc_civilian_developments:0 "Ми — Ніщо Без Один Одного"
  mnc_civilian_developments_desc:0 "Більшість цивільних не розуміють ідеалів Сестринства. Наші найкращі Сестри це виправлять — вирушимо на площі та поділимось тим, заради чого ми боремося."

  mnc_mending_the_tears:0 "Зшиваючи Розриви"
  mnc_mending_the_tears_desc:0 "Легко забути, хто страждає найбільше від війни. Настрій серед наших працівників упав після втрат, яких зазнала наша держава. Підтримаємо їх як можемо."

  mnc_open_caravansary:0 "Каравани Сестринства"
  mnc_open_caravansary_desc:0 "Торговці зі всієї округи пропонують угоди. Їх цікавить стара техніка, яка роками припадає пилом. Ми отримаємо ковпаки — угода вигідна."

  mnc_horrors_of_nordikon:0 "Живий Магазин"
  mnc_horrors_of_nordikon_desc:0 "Наші розвідники помітили дивну активність на півночі. Говорять про свідому будівлю, контрольовану ШІ. «Справжній кошмар, — каже Паладин Луцій, — як Калькулятор. А може й гірше». Треба діяти першими, поки він не став реальніст

  # Сестринство — Арена Мінерви (перекладена назва арени для атмосфери)
  mnc_theclouddrinker:0 "Мінерва, Чарівниця Арени"
  mnc_theclouddrinker_desc:0 "Відкриття Арени Мінерви викликало чимало скепсису. Попри дивні формулювання у своїй пропозиції, Мінерва наполягає, що все це — заради спорту: «Це особливий вид тренування, що змушує кров кипіти! Під моїм наглядом ніхто не загине! Ну, окрім тих, хто без глузду та духу до бою.»"

  mnc_sistersofsteel:0 "Хтось, принесіть ноші!"
  mnc_sistersofsteel_desc:0 "Згідно з обіцянками Мінерви, Арена дійсно загартовує дух, а не призводить до катастрофи, як багато хто боявся. Натхненна успіхом, вона подала запит на додаткові ресурси, обіцяючи створити нові загони спецпризначення вже до кінця місяця... Ми досі не впевнені, яке місце в цьому займає феєрверк, але Тріфт буде щасливий допомогти."

  mnc_thebattleswehavewon:0 "І Натовп Шаленіє!"
  mnc_thebattleswehavewon_desc:0 "§PЗапис Голови в Хмарах§!\n\nТой самотній рейдер, якого я зустріла колись, знову знайшов себе. Вільна від кайданів минулого, вона стала зіркою — Чарівницею Арени. Мінерва тепер — ідол для наших солдатів, її палкий дух надихає кожного з нас."

  # Сестринство — Права гілка: Розваги та Знання

  mnc_funnythingsinthebunker:0 "Працюємо Без Гонор"
  mnc_funnythingsinthebunker_desc:0 "Поки Сентінел Гонор веде Сестринство до нових висот, вона доручила Паладину Йоханні, Лицарю Тріфту та Лицарю Воріку вдосконалити менш помітні ділянки громади. Вони вирішили зосередитися на двох давно назрілих речах: розвагах і культурі."

  mnc_theatrics:0 "Початок Прослуховувань"
  mnc_theatrics_desc:0 "Паладин Йоханна зацікавилась театром — формою мистецтва, про яку вона дізналась у бункері. Її ідея щодо прослуховувань викликала змішані реакції: хтось здивувався, хтось посміявся, а дехто — щиро зацікавився. Але, як би там не було, це підняло мораль. Чому б ні?"

  mnc_musical_theatre:0 "Бродвей У Нас Вдома"
  mnc_musical_theatre_desc:0 "На подив усіх, прослуховування пройшли бездоганно. Йоханна готує обраних до репетицій. Ми виділили склад під сцену та надали реквізит. Чутки поширились, усі чекають на прем’єру. Забезпечмо успіх!"

  mnc_proper_maintenance_requests:0 "Шукаємо Відповіді в Книгах"
  mnc_proper_maintenance_requests_desc:0 "З більшістю Писарів поза межами Чаптеру, Лицар Ворік шукає альтернативи для підтримки наукових розробок. Він знайшов покинуту бібліотеку в небезпечному регіоні. Варто організувати експедицію."

  mnc_improving_qol:0 "Чистимо Від Книжкових Хробаків"
  mnc_improving_qol_desc:0 "Команда Воріка виявила, що бібліотека в доброму стані, навіть попри вплив стихій. Ми можемо або відремонтувати її для себе, або розібрати на ресурси. Але спочатку — треба позбутися «гостей»."

  mnc_clearingspace:0 "Метод Тріфта Проти Дрібних Проблем"
  mnc_clearingspace_desc:0 "«Сміття, уламки, каміння... Хто хоче вручну це тягати? Думай розумно — думай про вибухи!»\n\nСентінел Гонор повідомили, що, попри всі спроби зупинити Тріфта, він уже тримав бомбу в руці, і ніхто не наважився її забрати."

  mnc_trust_in_brotherhood:0 "Нові Плани? Подавайте Сюди!"
  mnc_trust_in_brotherhood_desc:0 "Тріфт очистив територію швидше, ніж будь-хто до нього. Та попри це, Гонор заборонила йому ступати на будмайданчики. Почнемо зведення нових об’єктів — поки він знову не порушив наказ."

  mnc_its_always_a_good_time:0 "Довіра До Сестринства"
  mnc_its_always_a_good_time_desc:0 "Ініціативи Йоханни, Тріфта та Воріка — кожна була успішною. Сестринство досягло нового етапу — епохи просвітлення, індустріалізації й науки. Рухаймось далі!"
  
  
  mnc_slave_labor:0 "Оподаткування, не тиранія"
  mnc_slave_labor_desc:0 "Багато хто в Монтані існує як паразити, що висмоктують ресурси з інших. Якщо ми поставимо цих людей до праці, вийде взаємовигідна угода — принаймні для нас, навіть якщо вони не визнають цього."

  mnc_poweringthefalls:0 "Експлуатація Форту Веріті"
  mnc_poweringthefalls_desc:0 "Попри втручання місцевих, ми все ще можемо здійснити кілька взаємовигідних кроків — покращивши життя наших солдатів і цивільних поруч, хоча б настільки, щоб вони відійшли й не змушували нас витрачати боєприпаси."

  mnc_powerlinerepairs:0 "Ремонт Ліній Електропередачі"
  mnc_powerlinerepairs_desc:0 "Ми можемо відправити Лицарів на встановлення та обслуговування старих ліній електропередачі навколо Форту Веріті. Це не дасть нам одразу потужну енергосистему, але покращить інфраструктуру, яка її потребує."

  mnc_power:0 "Перемикаємо Рубильник"
  mnc_power_desc:0 "Річки навколо нас приховують величезний потенціал гідроелектроенергії. Освоєння цих потужностей зміцнить наш контроль не тільки над енергією, а й над водопостачанням."

  mnc_approachthecyborgs:0 "Вийти на Металеві Пащі"
  mnc_approachthecyborgs_desc:0 "Група техно-фетишистських рейдерів, відомих як «Металеві Пащі», діє в цьому регіоні. Було б ідеально захопити їх кібернетичні розробки."

  mnc_theendofusefulness:0 "Металеві Пащі — Роззброєні"
  mnc_theendofusefulness_desc:0 "Їх бездумне поводження з технологіями було безвідповідальним. Їх падіння було лише справою часу. Тепер лишається тільки зібрати й переробити все, що від них залишилося."

  mnc_industrialpush:0 "Промисловий Ривок"
  mnc_industrialpush_desc:0 "Ключ до нашого успіху — стабільне виробництво та своєчасний ремонт. Відправивши Воріка та його Лицарів дослідити навколишні майстерні, ми зробимо перші кроки до справжньої промисловості."

  mnc_advancedcomponents:0 "Просунута Утилізація"
  mnc_advancedcomponents_desc:0 "У регіоні є багато старих терміналів і підсистем. Ми можемо розібрати їх для виготовлення деталей і ремонту — якщо вже залишаємося тут надовго, то зробимо собі зручності."

  mnc_industry_civilian:0 "Відновлення Трудової Програми"
  mnc_industry_civilian_desc:0 "У нас є енергія, технолом і купа пустих заводів. Зміцнивши контроль над Фортом Веріті, ми можемо зосередити Лицарів на виробництві."

  mnc_propertytaxes:0 "Запровадження Податку на Майно"
  mnc_propertytaxes_desc:0 "Місцеві сидять на сховищах довоєнних реліквій та кришок. Щоб краще інтегруватися в регіон і перерозподілити ресурси, доведеться «позичити» дещо з їхніх запасів."

  mnc_puttingthemtowork:0 "Місцеві — До Праці"
  mnc_puttingthemtowork_desc:0 "Більшість місцевих — збирачі. Їхні навички знадобляться нам на виробництві."

  mnc_righteouslaw:0 "Залізна Дисципліна"
  mnc_righteouslaw_desc:0 "Від моменту прибуття до Монтані ми зіштовхуємось із безладом з боку місцевих. Пора навести лад. Створення сил правопорядку — загону «Овервотч» — допоможе забезпечити мир і порядок."

  mnc_nationalguardstockpiles:0 "Скриня Мендоси"
  mnc_nationalguardstockpiles_desc:0 "Скриня Мендоси — легенда цих країв. Стара поліцейська дільниця, перетворена Нацгвардією на сховище зброї. Кажуть, там справжні скарби — але також і пастки зі сторожовими системами. Це небезпечно, але може окупитися."

  mnc_handhtools:0 "Оцінити Завод H&H Tools"
  mnc_handhtools_desc:0 "У місті є великий завод H&H Tools. Відновивши його та заселивши працівників, ми суттєво підвищимо виробництво."

  mnc_robotscrap:0 "Розбір Старих Роботів"
  mnc_robotscrap_desc:0 "У заводі повно старих роботів, яких ми знешкодили під час зачистки. Паладини відклали їх, і тепер ми можемо розібрати їх на деталі для власних потреб. Можливо, Сталевий Колісниця знайде їм гідне застосування."

  mnc_macarthursalvage:0 "Брухт з Макартура"
  mnc_macarthursalvage_desc:0 "Хоча Анклав у цьому регіоні був... примітивним, вони мали чимало технологій, знищених під час боїв. Збирання залишків дасть нам трохи технолому."

  mnc_enclavemachinery:0 "Зламані Машини Анклаву"
  mnc_enclavemachinery_desc:0 "На відміну від типової техніки у пустці, машини Анклаву були в доволі пристойному стані. Лише трохи фарби й один-два Писаря — і можна залучити їх до допоміжних сил Братства."

  mnc_powerarmorresearch:0 "Дослідження Силової Броні"
  mnc_powerarmorresearch_desc:0 "Хоча ми привезли певний запас, якщо хочемо залишитися в Монтані надовго — треба навчитися самотужки виготовляти частини до силової броні. Інакше ремонт стане надто дорогим."

  mnc_ata_pog:0 "Мій татко дає мені кишенькові"
  mnc_ata_pog_desc:0 "З нашими регіональними досягненнями можна замислитися над головним — створення нових зразків силової броні, справжніх символів нашої сили."


####################################
### 'Ланцюги, Що Єднають' Гілка ###
####################################

# Основна сюжетна лінія Патрокола — Частина І

mnc_patrocolusplan:0 "План Патрокола"
mnc_patrocolusplan_desc:0 "Сестри мали обмежений вплив у Монтанській експедиції. Колись зганьблені, вони прагнуть підважити все, чим є Братство. Ми не можемо цього допустити — нам потрібен §Mплан Патрокола§!."

mnc_loyalty:0 "Ланцюги, Що Єднають"
mnc_loyalty_desc:0 "§MЖурнал Патрокола§!\n\nЄдине, що тримає Братство разом — це Ланцюги, Що Єднають. Виступати проти них — означає поставити під сумнів усе наше життя. Я дав Сестринству кожне попередження і все одно намагався їм допомогти. Більше ніколи."

mnc_stakingoutthebunker:0 "Славетна Мета"
mnc_stakingoutthebunker_desc:0 "Доля Йоханни була вирішена, а порядок у Фортеці Веріті частково відновлений. Колишні мешканці усунені, загрози — скрізь. Пора думати ширше, ніж просто про бункери."

mnc_thelowestlevel:0 "Так чи Інакше"
mnc_thelowestlevel_desc:0 "Список справ зростає щодня: поповнення втрат, оновлення озброєння, розчистка злітної смуги... Так чи інакше, ми мусимо звільнити Монтану від її недоліків."

mnc_carrots_on_sticks:0 "Морква на Палиці"
mnc_carrots_on_sticks_desc:0 "Попри численні втрати, Сестри досі діють. Щоб впоратись з ними у найближчі дні, нам знадобиться точність тоталітарного хірурга."

# Підгілка — Проєкт STARGAZER

mnc_project_stargazer:0 "Проєкт: ЗІРКОГЛЯД"
mnc_project_stargazer_desc:0 "Писарі розпочали реставрацію великого арсеналу плазмової зброї неподалік бункера. Забезпечити їх найкращими ресурсами та людьми — критично важливо."

mnc_project_stargazer_power:0 "Забезпечити Потужність"
mnc_project_stargazer_power_desc:0 "«Окей, слухайте. Якщо ми хочемо забрати весь цей хлам з арсеналу, краще поставити там майстерню і провести струм. Це буде значно швидше, ніж тягати шматки й рюмсати над кожним ремонтом. Розумієте?» — Лицар Тріфт"

mnc_project_stargazer_industrial_throws:0 "Старі Схеми"
mnc_project_stargazer_industrial_throws_desc:0 "Писарі знайшли термінал з кресленнями недобудованих довоєнних споруд. Ми їх добудуємо. Тепер — для Братства, а не збанкрутілої нації."

mnc_project_stargazer_water:0 "Охолодження Горнів"
mnc_project_stargazer_water_desc:0 "Тріфт та кілька Сестер, які залишилися, вже запустили горни для виробництва деталей до наших рушниць. Якщо надати їм воду — зможуть нормально охолоджувати обладнання."

mnc_project_stargazer_circuitry:0 "Комп'ютерні Компоненти"
mnc_project_stargazer_circuitry_desc:0 "У бункері та містечку поруч повно старих терміналів. Розібравши їх, ми отримаємо дроти та схеми для наших потреб. Якщо Писар Аміті має рацію, звісно."

mnc_project_stargazer_energy_throws:0 "Дрібниці Мають Значення"
mnc_project_stargazer_energy_throws_desc:0 "§MЖурнал Патрокола§!\n\nСталося дивне. Тріфт запідозрив якийсь звук у лісі, і коли я нарешті дозволив йому перевірити — він знайшов цілу яму з плазмовими мінами. Тепер маємо команду саперів. Якщо зможемо розібрати їх — це допоможе ЗІРКОГЛЯДУ."

mnc_project_stargazer_composite:0 "Ідея Воріка"
mnc_project_stargazer_composite_desc:0 "§MЖурнал Патрокола§!\n\nМожливо, всі ці дрібні прохання й дратують, але я хоча б не мушу сам їх шукати. Хоча, зрештою, завжди опиняюсь у складі пошукової групи..."

mnc_project_stargazer_advancements:0 "Квітка Монтани"
mnc_project_stargazer_advancements_desc:0 "Як би мені хотілося, щоб Аміті знала, як сильно вона тримає цей розділ Братства на плаву."

mnc_project_stargazer_finale:0 "Пульс Гарячого Лазера"
mnc_project_stargazer_finale_desc:0 "Під кінець я вже сумнівався, чи вартий проєкт витрачених ресурсів. Але тримаючи у руках власну плазмову рушницю, я пригадав — ми зробили це недарма. Відмінна робота."

# Головна сюжетна лінія Патрокола — Частина ІІ

mnc_streamline_the_sisters:0 "Упорядкування Сестер"
mnc_streamline_the_sisters_desc:0 "§MЖурнал Патрокола§!\n\nЗрада Гонор у бункері була неприйнятною — і нам ще пощастило, що ми вийшли звідти живими. Для небагатьох Сестер, що залишились поруч, — або, ще гірше, у наших лавах — потрібно прищепити відчуття наслідків і лояльності. Ми не можемо дозволити новий розкол."

mnc_appropriating_sister_armor:0 "Негідні"
mnc_appropriating_sister_armor_desc:0 "Багато Сестер виступили проти нас у бункері. Тепер, коли вони мертві, а решта понижена через власну дурість, ми можемо передати їхню броню тим, хто її дійсно заслуговує."

mnc_back_in_the_saddle:0 "Повернення в Сідло"
mnc_back_in_the_saddle_desc:0 "Ми остаточно придушили останні залишки бунтівного Сестринства. Мені соромно визнавати, що це стало можливим через мої ж дії. Про що я тільки думав?.."

mnc_thearena:0 "Мінерва: Відверта Паладин"
mnc_thearena_desc:0 "Мінерва завжди була однією з наших найкращих інструкторів. Її любов до 'чесного бою' й 'справжньої сили' надає їй ваги, але вона також підтримувала змову Гонор. Ми повинні поставити її на місце — поки не стало запізно."

mnc_reminding_minerva:0 "Як Тобі, Так І Тобі"
mnc_reminding_minerva_desc:0 "Кожна дія має наслідки."

mnc_one_big_happy_army:0 "Єдине Щасливе Братство"
mnc_one_big_happy_army_desc:0 "Зі зникненням Сентинела Гонор ми можемо остаточно об’єднати залишки Сестер із головним командуванням у Монтані. Жодного поділу, як у дитячій пісочниці."

mnc_thegreatestevil:0 "Найдавніше Американське Зло"
mnc_thegreatestevil_desc:0 "§MЖурнал Патрокола§!\n\nЯ думав, ми залишили їх у Середньому Заході. Чув легенди про те, що творилось на Заході. Те, чого я боявся в дитинстві, стало реальністю — вони живі, тут, на півночі. Вони були тут першими. Але ми — останні. Ми повинні бути."

# Головна сюжетна лінія Патрокола — Частина ІІІ

mnc_emergency_conscription_matters:0 "Питання Надзвичайного Призову"
mnc_emergency_conscription_matters_desc:0 "Не найкраще рішення, але більшість місцевих вже озброєні й здатні себе захистити. Хай навіть не проти Анклаву, та як допоміжні сили — підходять. А ще вони можуть послужити 'живим щитом', зберігаючи броню для справжніх вояків."

mnc_noproblemtoogreat:0 "Жодна Проблема Не Велика"
mnc_noproblemtoogreat_desc:0 "§MЖурнал Патрокола§!\n\nПрисутність Анклаву в Монтані розбудила в наших Паладинах і Лицарях тривогу й рішучість. Цей адреналін можна використати — ми перетворимо цей бункер на найкращий з усіх, які будь-коли мала Сталь."

mnc_establishanoutpost:0 "Найцінніше Почуття — Страх"
mnc_establishanoutpost_desc:0 "Паладини навіть не чекали наказу — одразу почали будівництво укріплень і аванпостів навколо бункера. Дехто вийшов і далі — шукати шляхи вглиб навколишніх земель. Одне відомо точно: коли прийде час, ми будемо готові."

mnc_kickingoutthescrappers:0 "Викинути Барахольщиків"
mnc_kickingoutthescrappers_desc:0 "Кілька груп брухтозбирачів оселилися в напівзруйнованих будівлях. Наші дії викликають у них паніку та агресію — іноді вони навіть стріляють по наших. Їх треба прибрати до того, як станеться справжня біда."

mnc_patrocolus_consortium_goal:0 "Немає Місця Егоїзму"
mnc_patrocolus_consortium_goal_desc:0 "Ці дурні з Вугільного Консорціуму гадають, що не мусять нічого нам давати. Вони просто не бачили, що таке Анклав — тому серйозно їх не сприймаємо. Забрати їхні ресурси силою — єдиний варіант."

mnc_patrocolus_havre_goal:0 "Закрити Прогалину"
mnc_patrocolus_havre_goal_desc:0 "Мені байдуже, хто чи що стане на заваді — ми досягнемо Анклаву першими. І я хочу, щоб вони втекли ще далі в гори, зрозумівши, хто прийшов до них у гості."

# Промислова Гілка Патрокола

mnc_breaking_backs:0 "Озброєне Суспільство"
mnc_breaking_backs_desc:0 "У Монтані є безліч людей, що сидять на складі зброї часів Довоєння. Підконтрольні ці групи — ключ до панування Братства в регіоні."

mnc_replenish_the_host:0 "Заслужений Відпочинок"
mnc_replenish_the_host_desc:0 "Дорога до Монтани була... виснажлива. Багато з наших хочуть трохи розслабитися перед подальшими завданнями. Непрофесійно, звісно, але я не бачу в цьому шкоди."

mnc_arms_lease:0 "Лізинг Озброєння"
mnc_arms_lease_desc:0 "Захоплення місцевих заводів та виробничих кооперативів — необхідне, щоби підтримати наші темпи виробництва."

mnc_salvage_laser_weaponry:0 "Утилізація Енергетичної Зброї"
mnc_salvage_laser_weaponry_desc:0 "Чимало нашої зброї пошкоджено ще в дорозі. Але трохи плазмових знахідок пов'язано з проєктом ЗІРКОГЛЯД. Мінімальний ремонт — і ми знову при ділі."

mnc_industrial_patrocolus:0 "Практика Робить Майстра"
mnc_industrial_patrocolus_desc:0 "Промисловість потребує вмілих рук, а ті — якісного обладнання."

mnc_construction:0 "Конструктивне Мислення"
mnc_construction_desc:0 "Знаєте, що найкраще в житті? Стеля, яка не падає тобі на голову. Інвестування в будівельні стандарти — допоможе нашим зусиллям у Монтані якнайкраще."

mnc_electronics:0 "Хто Вимкнув Світло?"
mnc_electronics_desc:0 "§MЖурнал Патрокола§!\n\nЯ бачив гасові лампи, багаття, бочки з вогнем — але ж де, скажіть, знайти нормальне світло в Монтані, яке не дзижчить, як вагітна Медовка? Якщо не знайду — зробимо самі. Не знаю як, але зробимо."

mnc_approach_the_farmers:0 "Звернутись до Фермерів"
mnc_approach_the_farmers_desc:0 "\"Фермери — грубі, жорсткі, живуть із землі. Залучити їх до нашої справи — відмінна ідея, Старійшина. Якщо знають, що для них краще — вже й так звикли виконувати накази.\" — Паладин Гейман"

mnc_approach_the_raiders:0 "Звернутись до Рейдерів"
mnc_approach_the_raiders_desc:0 "\"Рейдери — на хіміках і вічно п’яні. Але ті, що дожили до сюди, зазвичай мають якусь тупу ідею, яку вважають святим. Тих, кого не рознесемо в друзки, дамо Кодекс до рук — може, щось вийде.\" — Паладин Гейман"

mnc_farmhand_ideas:0 "Тренування Фермерів"
mnc_farmhand_ideas_desc:0 "Фермери-конскрипти добре сприймають навчання. Ба більше — вони навчили нас, як зберігати пайки, що дозволяє довше триматись у полі."

mnc_raider_ideas:0 "Тренування Рейдерів"
mnc_raider_ideas_desc:0 "Рейдери, яких ми переконали, бодай тверезі. Але їхня агресія лишилась... самогубною, якщо чесно.\n\nСподіваємось, це нам не вилізе боком."

mnc_exalt_the_proven:0 "Звеличити Гідних"
mnc_exalt_the_proven_desc:0 "Багато новобранців у Монтані вже виявили неабияку відвагу. Вони замінили втрачених і піднялись по щаблях із небаченою швидкістю. Підвищити цих людей — більш ніж заслужено."

mnc_exaltations_idea:0 "Масові Вербувальні Кампанії"
mnc_exaltations_idea_desc:0 "Відновивши верхівку командування, час знову зібрати ударну групу. Якщо Середній Захід хоче нас побачити — маємо показати щось краще, ніж піротехніку й вигадливі гвинтівки."

# Завершення Патрокола

mnc_secure_northern_perimter:0 "Північний Периметр"
mnc_secure_northern_perimter_desc:0 "На півночі ходять легенди про машину, відому як 'Нордікон'. Ми проб’ємося до її серця — і вирвемо гниле ядро, якою б не була ціна."

mnc_triumph_in_montana_fucking_stupid_line_arrrgh:0 "Що Робить Хороший Чоловік"
mnc_triumph_in_montana_fucking_stupid_line_arrrgh_desc:0 "Коли ми прибули до Монтани, я був виснажений. Здавалося, все довкола валиться, а колеги з Середнього Заходу прагнули мого падіння. Я злився, я зневірився.\n\nАле в дорозі Гонор сказала мені: \"Не дозволь своєму життю стати твоїм недугом.\" Я думаю про ці слова часто. Неважливо, чому ми тут. Важливо — що ми зробимо з тим, що маємо."

mnc_homecoming_patrocolus:0 "Повернення на Вишневий Цвіт"
mnc_homecoming_patrocolus_desc:0 "Як воно там казалось? \"І жили вони довго й щасливо...\" Після всього, що ми зробили на півночі, ми знову вдома. І це буде цікаво."

mnc_patty_children_wargoal:0 "Великі Сховища Півночі"
mnc_patty_children_wargoal_desc:0 "Так звані 'Діти Сховища' сидять на арсеналі в сотні кілограмів довоєнних ракет. Ми не можемо цього допустити. Якщо хочемо владу на півночі — маємо знищити їх. Будь-якою ціною."

# Повітряна база

mnc_malstrom:0 "Оцінка авіабази Одран"
mnc_malstrom_desc:0 "Авіабаза Одран досі в пристойному стані — лише трохи іржі та кілька поселенців. Перед наступним етапом радимо розчистити злітну смугу."

mnc_cleartheairfield:0 "Очищення Аеродрому"
mnc_cleartheairfield_desc:0 "На жаль, ангари перетворили в польову кухню під наглядом прикордонників. Їх доведеться... прибрати. В один чи інший спосіб."

mnc_airplanegovroom:0 "Облаштування Ангарів"
mnc_airplanegovroom_desc:0 "Смуга очищена, ангари — вільні від небажаних гостей. Можна будувати повноцінний операційний центр на базі Одран."

mnc_rebootandsalvage:0 "Розібрати Брухт"
mnc_rebootandsalvage_desc:0 "Деякі Писарі просять дозволу дослідити старі літаки, які ми знайшли. Якщо прагнемо серйозно зайнятись авіацією — слід дати їм зелене світло."

mnc_airplanemoves1:0 "Пробні Польоти"
mnc_airplanemoves1_desc:0 "Вперше за 200 років з бази Одран здійнявся літак. Усе Форт Веріті спостерігало, як Лицар Ісая піднявся в небо. Його реакція після посадки була... колоритною: \n\n\"Ісусе христе, ви це бачили?! Не небо — а чортова казка! Руки тремтять, як у смерті. Брати, що літали... як там їх, Лівобрати? От вони б оцінили. Голуб клятий! Стоп, це пишуть на голограму? Чорт, Патрокол мене розстріляє.\" \n\nІ він отримав догану — політ не був схвалений."

mnc_airplanemoves2:0 "Запуск Симуляторів"
mnc_airplanemoves2_desc:0 "Пробні польоти можуть бути надто небезпечними з огляду на наші іржаві корита. Проте деякі Писарі почали лагодити старі симулятори — можемо використати їх для обережної підготовки."

mnc_airdoctrine:0 "Підготовка Пілотів"
mnc_airdoctrine_desc:0 "Усі повітряні операції потребують ретельного планування. Навчання Писарів базовим принципам повітряного бою зміцнить наш контроль над небом."

mnc_veteranteachers:0 "Передати Знання Далі"
mnc_veteranteachers_desc:0 "Писарі, що користувались симуляторами, набули хороших навичок. Настав час призначити їх наставниками для новачків — щоб уникнути катастроф від недбалості."

mnc_communicationsignals:0 "Зв’язок — Найважливіше"
mnc_communicationsignals_desc:0 "Створення стабільної бази потребує зв’язку через весь континент. Це довготривалий проєкт, але чим раніше розпочнемо — тим краще."

mnc_paladinjasminerequisition:0 "Запит Паладина Жасмин"
mnc_paladinjasminerequisition_desc:0 "Паладин Жасмин просить надати їй змогу зв’язатися з однією важливою особою через наше нове радіо. Організовані графіки передач можуть залучити більше людей до проєкту."

mnc_clearingoutinterference:0 "Очистити Канал"
mnc_clearingoutinterference_desc:0 "Схоже, наш сигнал весь цей час глушили. Джерело — у горах. Відправимо групу й знищимо перешкоди — це значно покращить радіозв'язок."

mnc_radiorecruitment:0 "Протокол: Приваблива Впевненість"
mnc_radiorecruitment_desc:0 "Один із малоефективних Писарів, на ім’я Рафаель, відомий своїм приємним голосом. Якщо поставити його у радіоефір вербувати новобранців — кількість добровольців точно зросте."

# Ланцюг науки

mnc_theknightandthescribe:0 "Біда Приходить Удвох"
mnc_theknightandthescribe_desc:0 "Двоє з наших найкращих мають ідею. Що може піти не так, га?"

mnc_thesciencedrive:0 "Науковий Поштовх"
mnc_thesciencedrive_desc:0 "Час покаже, чим закінчиться цей 'Науковий поштовх' — сподіваємось, чимось добрим."

mnc_thesciencedrive2:0 "Хто Б Міг Подумати!"
mnc_thesciencedrive2_desc:0 "Хоч експеримент був грандіозно ризикованим, 'Науковий поштовх' приніс неймовірні результати. Писарі й Лицарі тепер із новим ентузіазмом працюють, а наші темпи розвитку — небачені."

# Основний фінал

mnc_triumph_in_montana:0 "Тріумф у Монтані"

# Гілка Тріфта — Перевихований Рейдер

mnc_lettingthriftwork:0 "Дозволити Тріфту Працювати"
mnc_lettingthriftwork_desc:0 "Тріфт, колишній механік-рейдер, хоче відкрити гараж. Може, звучить дивно, але його досвід — щирий. Якщо дати йому шанс, наша військова промисловість отримає поштовх."

mnc_thriftsgarage1:0 "Гараж Тріфта"
mnc_thriftsgarage1_desc:0 "Тріфт просить більший ангар. Ми дамо йому склад, хоча перемістити все з його старої майстерні буде непросто."

mnc_thriftsgarage2:0 "Мрію Про Фіолетовий Корвега"
mnc_thriftsgarage2_desc:0 "\"Чудна річ, але я знайшов цю тачку в покинутому місті. І вона майже ціла! Думаю, зможу її полагодити, тільки треба команда, щоб витягти її...\" — Лицар Тріфт"

mnc_metalbusting:0 "Злам Заліза"
mnc_metalbusting_desc:0 "\"Немає кращого запаху, ніж переплавлений метал! Але ми вже майже вичерпали наш брухт. Не хвилюйтесь, я маю план — навчу наших збирачів новому методу добування.\" — Лицар Тріфт"

mnc_salvagedmotorcycles:0 "Рятуємо Мотоцикли"
mnc_salvagedmotorcycles_desc:0 "Ми знайшли склад із мотоциклами й вантажівками. Після дебатів вирішили — мотоцикли краще. Відправляємо їх Тріфту для апгрейду."

mnc_scraptrucks:0 "Рятуємо Вантажівки"
mnc_scraptrucks_desc:0 "Ми знайшли склад із мотоциклами й вантажівками. Обрали вантажівки — найпрактичніший транспорт у Пустці. Нехай Тріфт доробить."

mnc_motortechbonus:0 "Переверни Авто, І..."
mnc_motortechbonus_desc:0 "Працюючи над авто, Тріфт заявив про прорив. Ми не вловили всього, що він белькотів, але зрозуміли головне: потрібно ще трохи часу, матеріалів — і величезна батарея."

mnc_knightcleanupcrew:0 "Зачистка від Лицарів"
mnc_knightcleanupcrew_desc:0 "Наші розвідники вказали на місця, де можна будувати. Проблема — завали. Але Тріфт запевняє, що з C-4 усе буде просто. Він вже чекає дозволу..."

mnc_fullsealapproval:0 "Повне Схвалення"
mnc_fullsealapproval_desc:0 "Успішні проєкти Тріфта дали йому більше впливу на інфраструктуру та будівництво. Він пропонує нові ідеї для розширення наших ресурсних горизонтів. Дамо йому зелене світло."

mnc_knowyourenemy:0 "Знай Свого Ворога"
mnc_knowyourenemy_desc:0 "\"Знаю, старші брати вдома плювались би від усього рейдерського, але ці методи працюють. Монтана — дика і небезпечна земля. То чому б не використати все, що є під рукою?\" — Лицар Тріфт"

mnc_cleaningupoldrifles:0 "Полагодити Стару Зброю"
mnc_cleaningupoldrifles_desc:0 "Ми знайшли сховок довоєнної зброї. Хоча застаріла, Тріфт бачить потенціал для її модернізації. Забезпечимо його всім необхідним."

mnc_demolitionsacquisitions:0 "Нові Вибухові Іграшки"
mnc_demolitionsacquisitions_desc:0 "\"Кажу просто — нам треба БАХ. Бо скоро вже не буде чим бахати. Треба більше вибухів. Погодьтеся, а?\" — Лицар Тріфт"

mnc_landdoctrines:0 "Переміщення — Цікава Річ"
mnc_landdoctrines_desc:0 "Безперервні запити від Тріфта на матеріали змусили нас задуматись — наші методи транспортування застаріли. Нам потрібно оновити системи безпеки та логістику."

mnc_oiledup1:0 "Змащуємо Танки"
mnc_oiledup1_desc:0 "Є приказка серед рекрутів: 'Якщо чуєш шум, як з пекла — 75% це дурниця. Але якщо чуєш сміх — це вже інновація.'"

mnc_oiledup2:0 "Мастимо Вантажівки"
mnc_oiledup2_desc:0 "Тріфт вирішив, що наші вантажівки потребують тюнингу. Його ідеї... дивні. Але поки що він нас не підводив.\n\n\"Сідайте, братці, їдемо танкувати!\" — Лицар Тріфт"

mnc_leftarmsfactories:0 "Рухомі Конвеєри"
mnc_leftarmsfactories_desc:0 "\"Рухаємось далі! Майстерні чекають, зброю треба ліпити, а світ — великий. Хто сказав, що все має бути серйозно?\" — Лицар Тріфт"

mnc_rightarmsfactories:0 "Будуємо Старим Стилем"
mnc_rightarmsfactories_desc:0 "\"Я, звісно, за практичність, але трохи класики не завадить. В цих авто є щось чарівне. Не вірите? Дозвольте показати...\" — Лицар Тріфт"

mnc_industrialboom:0 "Тріфт: Фінансований і Щасливий"
mnc_industrialboom_desc:0 "\"Погляньте! Баггі носяться по всій Монтані. Все працює — а значить, буде ще більше діла. Розумієте, про що я?\" — Лицар Тріфт"

# Гілка мілітаризації

mnc_militarizingmontana:0 "Мілітаризація Монтан"
mnc_militarizingmontana_desc:0 "Монтана здоровіша за більшість пусток, а отже цінніша. Утримати її буде непросто. Потрібно підготуватися до будь-чого."

mnc_army1:0 "Вишкіл"
mnc_army1_desc:0 "Регулярні тренування допоможуть стабілізувати ряди як серед наших ветеранів, так і нових рекрутів з місцевого населення."

mnc_army2:0 "Крик Душі"
mnc_army2_desc:0 "Паладин Ричек навчив нас одного — добрий крик може стати кращим мотиватором для новобранців."

mnc_army3:0 "Десять по Тисячі"
mnc_army3_desc:0 "Силова броня — це добре, але фізпідготовка ще краща. Паладин Гейман вважає: \"Хто не згоден — відправляється чистити загон для брамінів.\""

mnc_tribalteachings1:0 "Знання Племен"
mnc_tribalteachings1_desc:0 "Дехто з наших Паладинів — колишні племінники. Їх знання про виживання можуть стати у пригоді."

mnc_tribalteachings2:0 "Племінні Розписи"
mnc_tribalteachings2_desc:0 "Хоч і не за Кодексом, дозволити бійцям зберегти свої знаки може підвищити лояльність. Трохи дикості ще нікому не шкодило."

mnc_recruitcivilians1:0 "Вербуємо Відірваних"
mnc_recruitcivilians1_desc:0 "Ми зустріли багато людей, які втратили все. Brotherhood дає їм ідентичність, якої їм бракувало."

mnc_recruitcivilians2:0 "Вербуємо Рейдерів"
mnc_recruitcivilians2_desc:0 "\"Монтана — притон рейдерів. Вбивати всіх — це марна справа. Краще вдягнемо їх у нашу броню і направимо на ворогів.\" — Паладин Гейман"

mnc_recruitcivilians3:0 "Вербуємо Шахтарів"
mnc_recruitcivilians3_desc:0 "Ми зустріли чимало шахтарів, особливо в районах, що належали Вугільному Консорціуму. Це хороша база для рекрутингу."

mnc_recruitcivilians4:0 "Вербуємо Мандрівників"
mnc_recruitcivilians4_desc:0 "\"Куди не йдемо — там нові диваки. Мандрівники, герої, поети... Дамо їм рушницю і скажемо, кого стріляти.\" — Паладин Гейман"

mnc_everypaladinawall1:0 "Кожен Паладин — Цеглина"
mnc_everypaladinawall1_desc:0 "\"Слухайте сюди, жалюгідні нікчеми! Тепер ви ініціати Братства Сталі. Пройде час — і якщо ви хоч щось засвоїте, станете Паладинами...\" — Паладин Гейман"

mnc_everypaladinawall2:0 "Кожен Паладин — Стіна"
mnc_everypaladinawall2_desc:0 "Під час останньої церемонії підвищення Паладин Гейман мовив: \"От ж бо... Ви справді зробили це. Хочеться навіть просльозитись... майже.\""


# Tooltips ————————————————————————————————

mnc_minerva_marshall_tt:0 "§YМінерва§! стане доступною як §MКомандир підрозділу§!!"
mnc_hayman_marshall_tt:0 "§YЖустінія Гейман§! стане доступною як §MКомандир підрозділу§! та §MРадниця§!!"
mnc_ruminators_puppet_montanaside_tt:0 "Ми попросимо §YРумінаторів§! передати управління §PСестринству§!, дозволивши їм функціонувати в мирі під нашою опікою."
mnc_havre_puppet_montanaside_tt:0 "Ми закличемо §YГавр§! відмовитись від автономії на користь §Pвлади Сестринства.§!"
mnc_ruminators_puppet_BTHside_tt:0 "§gМи станемо §Yмаріонеткою§! §PСестринства Сталі§! та отримаємо додаткові переваги в майбутньому!§!"
mnc_ruminators_puppet_BTHside_autonomy_tt:0 "§gМи збережемо §Mнезалежність§! від §PСестринства Сталі§!, але все ще можемо приєднати їх до нашої фракції!§!"
mnc_comingin5_tt:0 "§RЗ’явиться у версії 5.0!§!"
mnc_romancedecisions_tt:0 "Відкриває можливість... §P\"Переговорів\"§! з фігурою з §YПівнічних Ханів§!."
mnc_fear_tt:0 "Ми збудуємо значну кількість §Mукріплень§! навколо §YФорту Веріті!§!"
mnc_ihatepowerarmor_tt:0 "Ми зможемо дослідити §GПокращену Технічну Броню§!!"
mnc_macarthursurrender_tt:0 "§PМи вимагатимемо, щоб [MCA.GetName] здались перед нашою могутністю!§!"
mnc_haymanwillhatethis_tt:0 "§RГейману це дуже не сподобається.§!"
mnc_loyalist_path_tt:0 "§MПатрокл залишиться вірним наказу. Сестри Сталі — зрадниці, і заслуговують лише на знищення.§!"
mnc_united_path_tt:0 "§YПатрокл залишиться врівноваженим. Сестри все ще Братство, попри все.§!"
mnc_patrocolus_vs_hayman_tt:0 "§M\"Мені здається, що я з Гейманом — вже не на одному боці.\"§! \n\n§gГрай за Патрокла та спробуй об’єднати Монтанське Братство. Але не всі будуть раді цьому — Гейман буде чинити опір на кожному кроці...§!"
mnc_hayman_vs_patrocolus_tt:0 "§R\"Якщо Патрокл не знищить свої помилки, тоді я зроблю це замість нього.\"§! \n\n§gГрай за Гейман та доведи свою вірність Братству, знищивши Сестер Сталі — а якщо доведеться, то і самого Патрокла.§!"

