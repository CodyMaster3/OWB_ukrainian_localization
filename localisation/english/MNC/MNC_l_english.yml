MNC_patrocolus:0 "Старійшина Патрокл"
ELDER_PATROCOLUS_DESC:0 "§GДосьє Персоналу — Патрокл, Якоб§! \n\n§YЗвання:§! §gСтарійшина§! \n\n\"Іди, Патрокле, до Монтани,\" — сказали ієрархи Середнього Заходу, — \"і закріпи там владу Братства.\" \n\nПосланець Середньозахідного Братства та його непохитний ветеран, Патрокл пережив безліч воєн і режимів. Відомий своєю прямотою та холодною ефективністю, він ідеально підходить для завершення місії Братства в Монтані."

MNC_headintheclouds:0 "Сентинел Гонор"
MNC_headintheclouds_desc:0 "§GДосьє Персоналу — Клаудс, Гонор§! \n\n§YЗвання:§! §gСентинел§! \n\nБезстрашна бійчиня, відома своїми сутичками з Анклавом поблизу Чикаго. Завдяки своїм подвигам отримала деяку автономію в посаді, хоч її нині й ставлять під сумнів через дії паладина Йоганни. Вона твердо стоїть на захисті своїх ідеалів — та тих, хто вірить у її справу."
MNC_hayman:0 "Головна Паладин Гейман"
MNC_hayman_army_chief_desc:0 "§GЗапис персоналу — Гейман, Джастінія§!\n\n§YЗвання:§! §gГоловна Паладин§!\n\nКоли Братству потрібно виконати щось швидко й без зайвих питань — Джастінію Гейман викликають першою. Прагматична до кісток, вона вважає себе останньою інстанцією, коли все інше зазнає краху. Її ретельність і майже стовідсотковий успіх у бойових завданнях принесли їй беззаперечну репутацію. Нині її навіть рейдери вважають жорсткою та безкомпромісною. Саме тому її було обрано супутницею Патрокла для місії в Монтані."

MNC_minerva:0 "Паладин Мінерва"
MNC_minerva_head_paladin:0 "Головна Паладин Мінерва"
MNC_minerva_army_chief_desc:0 "§GЗапис персоналу — Мінерва, Еш§!\n\n§YЗвання:§! §gПаладин§!\n\nМінерва — загартована ветеранка низки кампаній Братства в Міссурі. Колишня рейдерка, яка пристосувалася до життя в Братстві, хоч і зберегла сумнівно близькі стосунки з представницями 'Сестер Сталі'. Обожнює бойове мистецтво, що зробило її першокласною тренеркою для новобранців і досвідчених солдатів. Її теплий характер і глибокі знання допомогли їй здобути визнання в очах товаришів."

mnc_warwick_name:0 "Лицар Ворвік"
MNC_warwick_economic_advisor_desc:0 "§GЗапис персоналу — Пентекост, Ворвік§!\n\n§YЗвання:§! §gЛицар§!\n\nНаполегливий та хитрий, лицар Ворвік — сам просив звертатись до нього на ім’я, щоби уникнути плутанини з сестрою-близнючкою — є талановитим і досвідченим бійцем Братства.\n\nЙого самовпевненість іноді межує зі зухвалістю, що відзначають новобранці, але його майстерність у стрільбі й командних діях не викликає сумнівів. Як останній нащадок роду Пентекостів, Ворвік продовжує спадщину сили й доблесті.\n\n§g||§! §RПримітка Писарки Аміті:§! §gВони так і не закінчили цей запис... треба буде повернутись і відредагувати поля з іменами.§! §g||§!"

mnc_thrift:0 "Лицар Тріфт"
MNC_thrift_high_command_desc:0 "§GЗапис персоналу — Тріфт, Райдер§!\n\n§YЗвання:§! §gЛицар§!\n\nКолишній рейдер і нині видатний інженер, Тріфт — спеціаліст з вибухівки з добрим гумором і нестандартним підходом. Попри критику за легковажність зі зброєю, його технічні інновації є безцінними для Братства. Рекрутований Сентинелом Гонор, він з того часу віддано служить справі.\n\n§g||§! §RПримітка Писарки Квілли:§! §gСьогодні Тріфт стояв у поселенні з бомбою в руці. Якщо він сьогодні й загине — нагадую витягти його жетон.§! §g||§!"

mnc_johanna:0 "Паладин Йоганна"
MNC_johanna_cultural_advisor_desc:0 "§GЗапис персоналу — Пентекост, Йоганна§!\n\n§YЗвання:§! §gПаладин§!\n\nЙоганна, як і її брат-близнюк Ворвік, попросила звертатись до неї на ім’я. Вона прославилась відвагою, амбіціями та надихаючим духом. Її вчинки в бункері стали каталізатором змін у Братстві. Нехай вона іноді імпульсивна, проте улюблена й шанована серед побратимів. Вона — спадкоємиця родини Пентекостів, носійка їхньої доброти й честі."

mnc_tanya_name:0 "Таня Карєва"
MNC_tanya_cultural_advisor_desc:0 "Найвідоміша серед місцевих у Форт Веріті, Таня Карєва погодилася допомогти нашому відділенню в обмін на постійну підтримку з нашого боку."

MNC_harriet_name:0 "Паладин Гаррієт"
MNC_harriet_cultural_advisor_desc:0 "§GЗапис персоналу — Гаррієт§!\n\n§YЗвання:§! §gПаладин§!\n\nХоча вона здобула звання паладина, Гаррієт завжди почувалась комфортніше серед писарів. У вільний час працює над кресленнями та новими методами виробництва."

mnc_scribe_amity_name:0 "Писарка Аміті"
MNC_scribe_amity_theorist_desc:0 "§GЗапис персоналу — Аміті, Нарве§!\n\n§YЗвання:§! §gПисарка§!\n\nВідомо-ексцентрична, надзвичайно ефективна в роботі. Також обожнює квіти.\n\n§g||§! §RПримітка Писарки Квілли:§! §gПрипини писати власні досьє! Я вже тричі їх виправляла. Якщо буде ще раз — я подаю рапорт.§! §g||§!"

