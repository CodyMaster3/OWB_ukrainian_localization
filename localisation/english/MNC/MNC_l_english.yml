# Коментарі персонажів / внутрішні цитати ————————————————————

mnc_honours_plan_tt:0 "§g\"У тиші ми здобуваємо підтримку. Коли настане час — буде і відплата.\" — Сентинел Гонор§!"
mnc_minerva_the_arenas_bewitcher_tt:0 "§g\"О, любі мої, я чекала цього все своє життя!\" — Паладин Мінерва§!"
mnc_return_of_the_wilds_tt:0 "§g\"Ці песики — справжні перлини! Я зможу зробити для них куленепробивні жилети в стилі Сестринства!\" — Лицар Тріфт§!"
mnc_fuel_for_the_fire_tt:0 "§g\"Серед цивільних, яких ми захищаємо, є діти. Як же я хочу дати їм теплу вечерю чи ніч без холоду та страху...\" — Сентинел Гонор§!"
mnc_working_without_honour_tt:0 "§gПеред від’їздом Гонор глянула на трьох у своїй залі: \"Чи можу я довірити вам залишитись без пригод?\" — напівжартома запитала вона.\n\n\"Так,\" — відповіли брати Пентекости.\n\n\"Можливо,\" — додав Тріфт.§!"
mnc_squashing_book_worms_tt:0 "§g\"Хтось ще чує те дзижчання?\" — Лицар Бетсі§!"
mnc_the_sisterhood_caravans_tt:0 "§g\"Бачили того браміна?! Він ніс на собі, мабуть, цілу будівлю!\" — Паладин Йоганна§!"
mnc_immortal_undying_damnation_tt:0 "§g\"Хе. Знаю ці костюми. То ж той, хто знищив Гейман... чи не так?\" — Паладин Мінерва§!"
mnc_hungry_for_tt:0 "§g\"Після стількох наказів не їсти інших людей, ти б подумав — що вже дійшло. А, зачекай — погане формулювання.\" — Лицар Ворвік§!"
mnc_commune_with_the_gods_tt:0 "§g\"Не знаю, що таке 'Екс-Бокс' або святий Соні, але захоплення Ріверів — заразне.\" — Сентинел Гонор§!"
mnc_sister_born_in_murk_risen_in_steel_tt:0 "§g\"Звільніть своє серце від старих кайданів, Сестри, щоб піднятись у новому світі. Сім’я важливіша за саму сталь.\" — Сентинел Гонор§!"

# Емоційні завершення ————————————————————————————————

mnc_thesisters_dead_tt:0 "§g\"Моє найбільше розчарування. Що я тільки собі думав...\" — Старійшина Патрокл"
mnc_patrocolusplan_tt:0 "§g\"Її ніхто не буде оплакувати.\" — Головний Паладин Гейман§!"
mnc_stargazer_1_tt:0 "§g\"Добре озброєна армія, мої дорогі, — це ключ до успіху в Монтані!\" — Головний Паладин Гейман§!"
mnc_stargazer_warwick_tt:0 "§g\"Є тут одна база на заході — з купою всіляких прибамбасів для STARGAZER. Думаю, нам це знадобиться.\" — Лицар Ворвік§!"
mnc_stargazer_amity_tt:0 "§g\"Гм, чесно кажучи, Старійшина, я трохи налякана, що це не спрацює — тому я заздалегідь все підготувала. Сподіваюся, файли досліджень стануть у пригоді! Це принаймні кілька місяців роботи.\" — Писар Еміті§!"
mnc_thrift_airfield_tt:0 "§g\"Моя порада? Візьми кілька гранат, жбурни туди. Математика проста.\" — Лицар Тріфт§!"
# Tooltips ———————————————————————————————————————

mnc_paladin_jasmine_airfield_tt:0 "§g\"Старійшина, якщо ми справді хочемо ефективно діяти в регіоні, то маємо забезпечити стабільний зв’язок між штабом і підрозділами на полі. Зізнаюсь — це вже не прохання, а справжнє благання про допомогу.\" — Паладин Жасмін§!"
mnc_hayman_enclave_war_tt:0 "§g\"Слухайте уважно, йолопи — ваш Старійшина вимагає удару настільки блискавичного й точного, щоб ці щурячі виродки ридали по дорозі назад до Чикаго. Це означає одне — не відпочиваємо, не жаліємось, не ниємо, доки їхні гори не стануть пилом. Я хочу бачити кожен шмат їхньої металевої сраки зігнутим у вузол. Зрозуміло?!\" — Головний Паладин Гейман§!"
mnc_whatagoodmandoes_tt:0 "§g\"Мені наказали лише закріпитись у бункері. Ми перевершили цю місію в десять разів і звільнили більшість Монтанської глибинки від страху перед рейдерами й Анклавом. Але є й інші загрози, і тому нам не можна зупинятись — доки кожна тінь не згасне під світлом сталі.\" — Старійшина Патрокл§!"
mnc_back_in_the_saddle_tt:0 "§g\"Одна — ніколи без іншої.\" — Приказка Сестер Сталі, авторства Сентинела Гонор§!"
mnc_hayman_reminder_tt:0 "§g\"Щоб наше домінування тут було ефективним — воно має бути повним і безжальним. Ніхто не зрозуміє нічого, якщо наш контроль буде хоч трохи м’яким.\" — Головний Паладин Гейман§!"
mnc_minerva_death_tt:0 "§g\"...Ось і повернулося, ти зрадницька сучко.\" — Головний Паладин Гейман§!"
mnc_claims_montana_and_dakota_tt:0 "Ми отримаємо §Mпретензії§! на всю §YМонтану§! та §YДакоту§!!"
mnc_claims_montana_and_washington_tt:0 "Ми отримаємо §Mпретензії§! на всю §YМонтану§! та §YВашингтон§!!"
mnc_claims_montana_and_dakota_ros_tt:0 "Ми отримаємо §Mпретензії§! на всю §YМонтану§! та §YДакоту§!, крім §YЙєллоустоуна§! та §YМакартура§!!"

