  EAS_hakis_republic_people_DEF:0 "Нову Напиту Народну Республіку"
  EAS_hakis_republic_intellectuals:0 "Нова Напита Народна Республіка"
  EAS_hakis_republic_intellectuals_ADJ:0 "Нової Напитої Народної Республіки"
  EAS_hakis_republic_intellectuals_DEF:0 "Нову Напиту Народну Республіку"

  ##Focus
  EAS_hakis_had_it_up:0 "З мене досить!"
  EAS_hakis_had_it_up_desc:0 "Найдивніші дні справді починаються найпростішим чином, чи не так?"
  EAS_hakis_making_clear:0 "Я чітко висловлююся?"
  EAS_hakis_making_clear_desc:0 "Цей чоловік доволі чарівний, але, присягаюся, з часу виборів він стає все більш марним."
  EAS_hakis_just_a_girl:0 "Просто дівчина у цьому світі"
  EAS_hakis_just_a_girl_desc:0 "Вся ця випивка дійсно вдарила всім у голову."
  EAS_hakis_our_way_life:0 "Наш спосіб життя"
  EAS_hakis_our_way_life_desc:0 "Ці банди більше не можна терпіти! Кожен грабіж, кожна крадіжка — це напад на наші традиції! Вони відбирають саму пляшку від ваших губ! Більше цього не буде!"
  EAS_hakis_bite_outta_crime:0 "Шматок зі злочинності"
  EAS_hakis_bite_outta_crime_desc:0 "Загони бакару? Загони? Як на мене, вони більше схожі на бандитів, які не хочуть платити за свою випивку. Ми більше не дозволимо витирати об себе ноги!"
  EAS_hakis_bubbles_brew:0 "Бульбашки та вариво"
  EAS_hakis_bubbles_brew_desc:0 "Істпорт любить дві речі: варити спиртне та пити його. Друге неможливо без першого, а міська пивоварня ледве встигає задовольняти попит. Ми повинні зробити все можливе, щоб додати кілька нових саморобних чанів до довоєнних."
  EAS_hakis_creation_destruction:0 "Творення перед руйнуванням"
  EAS_hakis_creation_destruction_desc:0 "В Істпорті є талановиті ремісники, які страждають у мовчазній тверезості без покровителя. Ми повинні вкласти частину наших прибутків від торгівлі в їхню підтримку, замість того, щоб вкладати всі кришки в пенсійний фонд Лахі."
  EAS_hakis_sloshed_slayers:0 "П'яні вбивці"
  EAS_hakis_sloshed_slayers_desc:0 "Ополчення справді пішло під укіс. Час влаштувати цим хлопцям і дівчатам перевірку. Можливо, ми навіть спробуємо змусити їх протверезіти!"
  EAS_hakis_barroom_style:0 "Барний стиль"
  EAS_hakis_barroom_style_desc:0 "Про тверезість не може бути й мови. Можливо, варто спробувати інший підхід."
  EAS_hakis_song_of_people:0 "Пісня нашого народу"
  EAS_hakis_song_of_people_desc:0 "Люди завжди почуваються і б'ються краще з піснею в серці. Містер Кліффорд і його Jug Blowin' Jamboree якраз ті люди, які допоможуть переконатися, що наші солдати ніколи не почуваються самотніми."
  EAS_hakis_motorheads:0 "Моторхеди вдалині"
  EAS_hakis_motorheads_desc:0 "Містер Лахі, можливо, і засунув голову у флягу в піску, але я чудово чую, що наближається."
  EAS_hakis_jumping_traffic:0 "Стрибок у рух"
  EAS_hakis_jumping_traffic_desc:0 "У будь-який день 80-ті можуть прибути й переїхати нас усіх. Ми не виграємо тотальну війну, але може бути інший шлях."
  EAS_hakis_joy_riding:0 "Катання з вітерцем"
  EAS_hakis_joy_riding_desc:0 "80-ті, можливо, і здалися, але вони не дуже цьому раді. Давайте позичимо кілька машин і вирушимо до них, щоб зблизитися за одним із найкращих сортів Істпорта."
  EAS_hakis_more_like_turkey:0 "Більше схоже на ніжки індички"
  EAS_hakis_more_like_turkey_desc:0 "Білі Ноги — ще гірші сусіди, ніж 80-ті; вбивають торгових партнерів, крадуть випивку, влаштовують гучні вечірки. Нам доведеться відкусити шматок від них, перш ніж вони відкусять шматок від нас."
  EAS_hakis_chief_export:0 "Головний експорт"
  EAS_hakis_chief_export_desc:0 "Тільки три речі виробляє Істпорт: каміння, спиртне та п'яниць. Спиртне, напевно, найпопулярніше. Ми повинні збільшити продажі тим, хто на заході від нас, і знайти їхнім кришкам хороше застосування."
  EAS_hakis_chiefer_export:0 "Найголовніший експорт"
  EAS_hakis_chiefer_export_desc:0 "Продаж на захід пішов так добре, що ми повинні зробити те ж саме на сході!"
  EAS_hakis_temperance_movement:0 "Рух за тверезість"
  EAS_hakis_temperance_movement_desc:0 "Ой, виявляється, вони набагато серйозніше ставляться до своєї релігії та гріхів, ніж ми думали."
  EAS_hakis_communion_wine:0 "Вино для причастя"
  EAS_hakis_communion_wine_desc:0 "Зараз трохи незручно, але у мене є ідея. Ми нагадаємо цим прекрасним, побожним людям, що їхній месія мав вино замість крові, і почнемо їм його продавати. Нам потрібно імпортувати та посадити трохи фруктів, щоб почати варити."
  EAS_hakis_gatekeepers:0 "Хранителі Брами"
  EAS_hakis_gatekeepers_desc:0 "Посланець Небесної Брами подивився на нас і назвав мене дияволом зі стадом грішних, напідпитку овець. Слова ранять, шанувальники пари, але не так сильно, як це."
  EAS_hakis_miss_charlotte:0 "Міс Шарлотта"
  EAS_hakis_miss_charlotte_desc:0 "За кожною перевтомленою жінкою стоїть найкраща подруга, з якою можна зустрітися та випити. Для мене це Міс Шарлотта, і нам вже давно час добре побалакати."
  EAS_hakis_vault_city:0 "Місто Сховище"
  EAS_hakis_vault_city_desc:0 "Я виросла на історіях про подорожі прадіда всією землею разом із Обраним, включаючи легендарне Місто Сховище. Тепер, коли вони стали сусідами, ми маємо вирішити, які саме відносини ми хочемо з ними мати."
  EAS_hakis_sinfulest_city:0 "Найгріховніше місто"
  EAS_hakis_sinfulest_city_desc:0 "В історіях Горіса також було Ріно — найгніліше маленьке місце у Великому Колі, якщо в них є хоч крапля правди. Однак у них точно є глибокі кишені і нескінченна потреба у випивці, а також кілька могутніх друзів по всій пустці. Що ж робити?"
  EAS_hakis_eastport_eightstep:0 "Істпортський Вісімкрок"
  EAS_hakis_eastport_eightstep_desc:0 "Здається, кожного разу, коли ми обертаємося, з'являється нова армія жорстоких вбивць, які придивляються до наших броварень, і ці навіть можуть розглядати нас як їжу. Я їх розумію, але ми все одно не можемо цього терпіти. Час показати Танцюристам на кістках кілька наших власних рухів."
  EAS_hakis_man_comes:0 "До міста приходить чоловік"
  EAS_hakis_man_comes_desc:0 "Хтось кричить на вулиці біля мого кабінету?"
  EAS_hakis_friends_in_tow:0 "Із друзями на буксирі"
  EAS_hakis_friends_in_tow_desc:0 "У нашого нового друга досить велика сім'я та мережа друзів. Звісно, їм тут в Істпорті раді!"

  ##Events
  nf_eas_april.1.t:0 "До Хакіс чіпляються"
  nf_eas_april.1.d:0 "Усе почалося яскравого істпортського ранку. Світило сонце, пил розвіювався крізь покинуті машини, а перегінні куби весело булькали. Запах випивки розносився кожною вулицею, а в провулку за М'ясною крамницею Нортона відбувалася спроба пограбування. Двоє молодиків з монтувалками в руках і запахом віскі затиснули свою здобич у кут. Здобута зіщулилася перед ними; довгий і вільний плащ із коричневої тканини вкривав її з ніг до голови. Усе, що визирало з величезного каптура — біляве волосся, окуляри, зубаста посмішка і кінчики гострих рогів. \n\nЧоловіки галасували і розмахували своєю автомобільною зброєю, вимагаючи кришки, випивку або будь-що інше, що вона мала. Вона протестувала, просячи їх дати їй спокій і кажучи, що нікому не потрібно страждати. Проте вони не відступали, а натомість наблизилися, щоб схопити її за одяг. \n\nЧерез кілька хвилин і криків вона вийшла із закривавленого провулка, колупаючись у зубах довгим нігтем. «Я справді заявляю, що це місто скотилося до псів.» — Вона звернулася ні до кого конкретно, лише до вітерця і сміття. «Надворі білий день, а по вулицях блукають шахраї. Я маю щось зробити! Мер Лахі почує про це!» Дорогою вона зробила лише одну зупинку..."
  nf_eas_april.1.a:0 "На обід"
  nf_eas_april.1.b:0 "Щоб відвідати Шарлотту"
  nf_eas_april.1.c:0 "Щоб розібратися з ще більшою кількістю грабіжників"

  nf_eas_april.2.t:0 "Ти хочеш цю роботу, га?"
  nf_eas_april.2.d:0 "«Послухайте-но, міс... Хакіс?» Мер Джим Лахі зупинився і підняв очі від свого столу з роздратованим виразом обличчя. Коли вона кивнула, він продовжив: «Я мер вже досить давно і думаю, що знаю, що потрібно цьому місту. Завжди буде якийсь злочин, розумієш? Тобі не потрібно забивати цим свою маленьку голівку.»\n\nХакіс придушила роздратування його поблажливим тоном і знову звернулася: «Містере Лахі, я вважаю, що ви впоралися добре, але я знаю, що останнім часом стало гірше. Ми з Шарлоттою говорили про це, і-» \n\nЛахі перебив її, з роздратуванням грюкнувши флягою об стіл. «Міс, будь ласка, за всієї поваги, ви думаєте, що зможете впоратися краще?»\n\nТепер вона від роздратування ляснула власною рукою по столу, її гострі нігті залишили на дереві невеликі вм'ятини. «Чому ж, я думаю, що змогла б!» Після цього він в пориві злості прийняв її виклик, і за кілька годин було призначено засідання ратуші. Воно мало відбутися відразу після..."
  nf_eas_april.2.a:0 "Щасливої години"
  nf_eas_april.2.b:0 "Варіння болотника"
  nf_eas_april.2.c:0 "Глечикового Джамборі"

  nf_eas_april.3.t:0 "Це швидко загострилося"
  nf_eas_april.3.d:0 "Лахі очікував, що зустріч підтвердить його лідерство, стане святкуванням того, наскільки добре зараз живеться в Істпорті. Чого він не очікував, так це того, що вона перетвориться на агресивну, п'яну сесію виплескування емоцій для мас. Скарги на злочинців, частку Лахі від торгових доходів, якість доріг, метеоризм Гуннара та багато іншого домінували в розмові по черзі. Протягом усього вечора Лахі крадькома ковтав зі своєї фляги, тоді як Хакіс спокійно стояла й вислуховувала скарги натовпу. Зрештою терпінню мера настав кінець, і він випалив натовпу: «Ну, і ви думаєте, що вона зможе впоратися краще?!»\n\nНатовп проревів у відповідь невиразно й галасливо: «ТАК!» Серед них були навіть деякі «ділові партнери» Лахі, а інші стояли осторонь, знизуючи плечима. Хакіс сором'язливо помахала натовпу, коли Джим пішов геть. Вся ця ситуація здалася їй досить бентежною, і вона просто посміхалася, як могла, думаючи про себе..."
  nf_eas_april.3.a:0 "\"Я зможу це зробити\""
  nf_eas_april.3.b:0 "\"Горіс, дай мені сил\""
  nf_eas_april.3.c:0 "\"Як це сталося?\""

  nf_eas_april.4.t:0 "Голими лапами"
  nf_eas_april.4.d:0 "Мер Хакіс стояла поруч і спостерігала за тим, як міське ополчення тренується зі своїм строкатим набором гвинтівок та пістолетів; кожна одиниця трималася купи за допомогою мотузки та скотчу більше, ніж попередня. Поки що кожен постріл був мимо, і земля була всіяна стріляними гільзами. Нарешті одна з жінок влучила у свою ціль: куля пройшла просто через пах грубо зробленого макета рейдера, у який вони стріляли. Група закричала й завила від сміху та святкування, зібравшись навколо і мало не збивши її з ніг поплескуванням по спині. \n\nХакіс зітхнула і жестом наказала їм зупинитися, перш ніж покликати їх до себе. Вони йшли до неї, спотикаючись і хитаючись; усі до одного були п'яні. Двоє з них зіткнулися під час ходи й почали штовхатися, після чого перейшли до бійки на кулаках. Схоже, це в них виходило набагато краще, ніж стріляти з рушниць, і вони швидко відлупцювали один одного, перш ніж їх розтягнули. Спочатку Хакіс роздратовано затулила обличчя рукою, але потім, подивившись на це, задумалася. «Ось воно! Рукопашний бій!» — вигукнула вона, перш ніж запитати групу: «Скільки з вас брали участь у бійках у барах або взагалі в кулачних боях?» Кожен підняв руку, багато хто при цьому посміхався. Молода мерка зраділа і сказала їм: «Гаразд, народ, тоді час усім нам вирушити на пошуки нової зброї:»"
  nf_eas_april.4.a:0 "\"Голих лап\""

  nf_eas_april.5.t:0 "Недостатньо швидко та люто"
  nf_eas_april.5.d:0 "«У мене є ідея.» Хакіс підвелася і поклала руки на старий металевий стіл, який займав більшу частину імпровізованої військової кімнати Істпорта. Найкращі, найрозумніші та найтверезіші жителі міста зібралися, щоб обговорити жахливе наближення 80-х, і розмова ходила по колу, поки Хакіс не перебила їх. «Ми годинами говорили про те, як ми могли б пробитися або відкупитися від цього, і це ні до чого не призводить. Нам потрібен новий підхід, і я не маю на увазі пропозицію Гуннара, щоб я вийшла заміж за Флагмана.» Вона кинула лютий погляд через усю кімнату на п'яного броваря, який у відповідь повільно знизав плечима.\n\n«Я пропоную зіграти на їхній гордості, репутації воїнів, самовпевненості. Вони знають, що вони сильні, і цілком впевнені, що ми ні. Давайте зробимо ставку на те, що це зробить їх безрозсудними, змусить недооцінити нас. Викличемо їх на дуель, де переможець забирає все.» Кімната вибухнула безладними розмовами; всі почали говорити одночасно, протестуючи, ставлячи запитання або навіть п'яно радіючи такій перспективі. Хакіс підняла руки, щоб заспокоїти їх. «Слухайте, вони подумають, що це легка перемога, але я кращий боєць, ніж здаюся, і думаю, що зможу це зробити, якщо вони поставляться до мене зневажливо. Або це, або ми спробуємо перемогти їх у тотальній бійці. Вдаримо першими й сподіватимемося, що цього вистачить.» Дебати тривали ще близько години, але рішення було прийнято."
  nf_eas_april.5.a:0 "Надіслати виклик"
  nf_eas_april.5.b:0 "Довіритися ополченню"
  EAS_hakis_race_tt:0 "Провести гонку через 20 днів"

  nf_eas_april.6.t:0 "Візит до Шарлотти"
  nf_eas_april.6.d:0 "Хакіс розглядала свої нігті, поки її найкраща подруга пригощала її останніми плітками з усього Істпорта. Вони сиділи в салоні Шарлотти самі, табличка на дверях була перевернута написом «Зачинено». Розмовляючи, Шарлотта ліниво підправляла гоління на обличчі натренованою рукою, використовуючи шматок загостреного скла від пляшки з-під «Нюка-Коли» як бритву і дуже обережно, щоб не порізатися. Вони говорили про нещодавні п'яні витівки місцевих жителів, новітні коктейлі та варива Гуннара, а також про ціну торгових товарів, що проходять через місто. Про те, як гекони за межами міста починають виходити з-під контролю, і чи є це проблемою Хакіс. \n\nВони довго відхилялися від теми, обговорюючи хобі Шарлотти з виготовлення домашньої косметики і те, над чим ще варто попрацювати. Потім Хакіс захищалася від добродушних жартів іншої жінки щодо того, що вона відмовляється нею користуватися. Їхня розмова текла легко, наче вони знали одна одну все життя, а не лише кілька років. Так легко, що Хакіс майже забула, що прийшла до Шарлотти у справі, і минуло близько години, перш ніж вона про це згадала. У розмові виникла пауза, коли Шарлотта відійшла, щоб щось взяти, і Хакіс подумала:"
  nf_eas_april.6.a:0 "Ще трохи часу"
  nf_eas_april.6.b:0 "До справи"

nf_eas_april.7.t:0 "Сусіди зі Сховища"
  nf_eas_april.7.d:0 "Мер Хакіс сиділа з Шарлоттою, ліниво постукуючи нігтями по столу, поки вони разом розглядали карту. На ній були приблизно позначені контрольовані території та передбачувані кордони, включаючи виділене місце, де стикалися претензії Істпорта та Міста Сховища. «Старий Горіс передав багато історій про знамените Місто Сховище,» — роздумувала вона вголос, згадуючи свого прадіда, — «здебільшого про те, як високо вони задирали свої носи.»\n\nШарлотта усміхнулася і відкинулася на спинку стільця: «Мій дідусь завжди казав, що їхні голови були засунуті настільки глибоко в дупу, що аж зуби видно.» Жінки засміялися і обмінялися ще кількома барвистими описами міста та його правителів, перш ніж зупинитися, щоб випити й перевести подих. Щоки Шарлотти розчервонілися, коли вона відверто запитала: «Гаразд, але що ти хочеш з ними робити?» У кутку кімнати посол Міста Сховища ніяково переминався з ноги на ногу, але тримав язика за зубами. Хакіс піднесла довгий ніготь до підборіддя і постукала по ньому, розмірковуючи. Місто Сховище було переважно мирним, заможним і мало зв'язки далеко на півдні. Мабуть, найкраще було б налагодити хороші стосунки. З іншого пазура, було б досить приємно принизити їх, що поставило б Істпорт у домінуюче становище в регіоні. Нарешті вона відповіла:"
  nf_eas_april.7.a:0 "\"Давай будемо чемними і заробимо трохи грошей\""
  nf_eas_april.7.b:0 "\"Давай трохи зіб'ємо з них пиху\""

  nf_eas_april.8.t:0 "Міддлмарк-Вегас"
  nf_eas_april.8.d:0 "Шарлотта і мер Хакіс знову сиділи в конференц-залі ратуші, який вони переобладнали на центр карт і планування. Хакіс крокувала туди-сюди, її плащ шурхотів по підлозі позаду неї, поки її найкраща подруга спостерігала за цим. Нарешті Шарлотта порушила тишу: «Отже, Нью-Ріно щойно зробило величезне замовлення, га?» Відповіддю був кивок. «Достатньо велике, щоб місто жило на повну ще кілька місяців?» Ще один кивок. «Прямо від самих мафіозних босів?»\n\nХакіс глибоко зітхнула: «Усе це почалося, бо я була сита по горло шахраями та гангстерами! А тепер мені кажуть, що я можу зробити нас багатими, якщо просто почну працювати з ними. Не дивно, що Лахі став ледачим і корумпованим.» Вона зупинилася, щоб подивитися у вікно, перш ніж пробурмотіти: «Шкода, що ми не можемо їх просто з'їсти... тобто вбити.»\n\n«Ну, якби ти дійсно хотіла, ми завжди могли б спробувати. Хоча вони небезпечні хлопці з серйозними зв'язками.» Шарлотта встала й поклала руку Хакіс на плече: «Істпорт і я довіряємо тобі прийняти найкраще рішення. Я точно не знаю, яким воно буде,» — вона тепло посміхнулася. Відчувши себе трохи краще, Хакіс кивнула і сказала:"
  nf_eas_april.8.a:0 "\"Істпорту потрібні ці гроші\""
  nf_eas_april.8.b:0 "\"Якщо випаде шанс, ми ним скористаємося, жодних угод\""

  nf_eas_april.9.t:0 "Що за чоловік!"
  nf_eas_april.9.d:0 "Одного ранку крики та заклики до мера витягли Хакіс з її кабінету. Своїми типовими невиразними голосами городяни, що зібралися, пояснили їй, що південною дорогою блукає якийсь монстр. Поки вони говорили, вона зрозуміла, що вловлює якийсь інтригуючий запах у вітерці. Заінтригована Хакіс сказала їм, що розслідує це сама, але наказала тримати ополчення напоготові, якщо вона прибіжить назад, після чого рушила дорогою. \n\nВона знайшла його досить швидко; їй достатньо було лише носа, щоб йти за запахом, і вона натрапила на нього неподалік від дороги, коли він розкопував лігво геконів. Він не був монстром, а навпаки — найкрасивішим чоловіком, якого вона коли-небудь бачила. Широкий і м'язистий, він майже досягав її зросту на своїх потужних кінцівках. Його довгі нігті були вкриті засохлим брудом і кров'ю, кишки гекона звисали між його усміхненими зубами, а сонце виблискувало на його темних рогах. Він різко підняв голову і завмер, коли вона наблизилася; будучи заглибленим у полювання, він помітив її набагато пізніше, ніж вона його. Щоб зняти його очевидну напругу і тривогу, Хакіс відкинула свій плащ і повільно зробила крок уперед. Він понюхав повітря і помітно розслабився, перш ніж сам підійшов ближче. «Доброго ранку,» — сказала вона, трохи сором'язливо відкидаючи довгі пасма свого волосся."
  nf_eas_april.9.a:0 "Його звали Френк"

  nf_eas_april.10.t:0 "Сім'я Клау"
  nf_eas_april.10.d:0 "Френк і Хакіс були майже нерозлучні від моменту зустрічі, поглинені бурхливим романом, про який гудів увесь Істпорт. Тепер вони крокували разом далеко за межами міста, а шквальний вітер жбурляв пісок і попіл пустки їм на плащі. Піщана буря не змогла їх відмовити чи навіть збентежити, адже вони мали місію: настав час Хакіс познайомитися з сім'єю Френка. Вітер почав стихати саме тоді, коли вони дісталися місця призначення — стародавнього кар'єру з минулих часів. Вони на мить зупинилися на краю великої ями, і вона відчула, що все це місце наповнене запахом, схожим на запах Френка. \n\nВони не встигли спуститися далеко, як ті з'явилися. Швидко, з печер і старих занедбаних будівель, вони кинулися вперед, готові до бою, але зупинилися як укопані, коли Хакіс скинула свій та Френків плащі. Вона могла б сказати, що це родичі Френка, навіть якби їй не сказали, подумала вона, дивлячись на них усіх. Принюхавшись до повітря, натовп повільно наблизився, а потім вибухнув хором ревучого захоплення, впізнавши Френка. Вони стовпилися навколо, звільнивши дорогу лише жінці, яка височіла навіть над Хакіс: його матері та матріархові клану. Здавалося, вона найбільше з усіх зраділа їхній появі; її голос був достатньо гучним, щоб заповнити весь кар'єр. Познайомившись із великою родиною Клау та побачивши їхні домівки в кар'єрі, вона прийняла рішення: ці чудові люди заслуговують на кращий дім. Вона забере їх усіх із собою до Істпорта. Місту точно знадобляться"
  nf_eas_april.10.a:0 "Великі воїни"
  nf_eas_april.10.b:0 "Сильні робітники"

  nf_eas_april.11.t:0 "Я не Пеггі Лі"
  nf_eas_april.11.d:0 "Хакіс прокинулася після денного сну від звуків музики за вікном: бринькання гітарних струн і тихого голосу, якого вона не впізнала. Вилізши з купи пошматованих меблів та подушок, які вона використовувала як ліжко, і надягнувши плащ, вона вийшла на вулицю, щоб подивитися, що там. На порожній бочці з-під пива на узбіччі сидів чоловік із гітарою в руках і шпорами на чоботях. Він був одягнений у широкий ковбойський капелюх і синій жилет. Його обличчя засяяло, коли вона вийшла на різке полуденне сонячне світло. \n\nВін зістрибнув зі старої бочки й підійшов до неї з теплою посмішкою на своєму злегка неохайному обличчі. «Міс Хакіс, я знаю, що ми з вами раніше не зустрічалися, але я вже давно поклав на вас око. Більше не міг спостерігати здалеку. Скажу вам прямо, міс, я по вуха закохався у вас. Люди називають мене Джонні Гітарою, і я прошу вашого дозволу залицятися до вас.»\n\nХакіс була приголомшена таким раптовим зізнанням, і її рука злетіла до обличчя. Іншій жінці, подумала вона, Джонні, швидше за все, здався б досить привабливим чоловіком, але вона просто не могла розгледіти цього в ньому для себе. «Ох, Джонні, мені дуже шкода. Справді. Це дуже лестить, але я просто не думаю, що ми підходимо одне одному. Моя відповідь — ні.» Обличчя Джонні на мить змарніло, але він натягнув хоробру посмішку, перш ніж піти; не кажучи ні слова, він трохи підняв капелюха і покрокував геть по дорозі. Дуже шкода, подумала вона про себе, але їй був потрібен інший чоловік."
  nf_eas_april.11.a:0 "Значно більший"

  nf_eas_april.12.t:0 "Прапор на полі"
  nf_eas_april.12.d:0 "Двоє лідерів зіткнулися обличчям до обличчя в оточенні 80-х, що сиділи на своїх машинах, та жителів Істпорта, що влаштувалися на своїх діжках. Хакіс наказала своїм людям поділитися з дорожніми воїнами дюжиною діжок, сподіваючись підмаслити їх і притупити їхню пильність. Здавалося, це спрацювало: натовп був у піднесеному настрої, а Флагман трохи похитнувся, ступивши на імпровізовану арену, яку вони облаштували за містом. Він недбалою ходою підійшов до неї, і з недовірою в голосі запитав: «Ти хоч зброю взяла, міс?» Він знизав плечима, коли вона похитала головою. «Мабуть, ти їм тут не дуже подобаєшся, раз вони послали тебе на вірну смерть. Ну, ти сама напросилася!» Він підняв свою зброю, але раптом різко зупинився. \n\nОпустивши погляд, він видав хрипкий звук, побачивши її довгі гострі нігті, що глибоко встромилися йому в живіт. Від такого раптового повороту подій натовп огорнула приголомшена тиша. Його окуляри сповзли вниз, а очі шалено розширилися, коли він втупився в її очі. «Якого біса?» — кров потекла по його підборіддю, коли він спробував заговорити. «Ти не просто якась дівчина, ти —» — його слова обірвав різкий удар Хакіс, який збив його з ніг і залишив чотири глибокі порізи на його обличчі. Натовп тоді вибухнув криками та лементом, підбадьорюваннями та глузуваннями. Флагман почав підніматися з бруду, стікаючи кров'ю, але ще не повністю видихнувшись, перш ніж Хакіс різким ударом ноги втиснула його голову в пилюку. Усім було зрозуміло, хоч би якими п'яними вони були, що 80-ті втратили свого водія, а Істпорт переміг. Хакіс відчула полегшення, хоча їй було трохи незручно через те, що вона втягнула їх у таку нерівну битву. Але головним було те, що "
  nf_eas_april.12.a:0 "Істпорт був у безпеці"

  nf_eas_april.13.t:0 "Більше візитів до Шарлотти"
  nf_eas_april.13.d:0 "Їхня розмова відновилася, коли Шарлотта налила їм по келиху вина, імпортованого з південного заходу, яке їм обом припало до смаку, після чого взяла пилочку, щоб підпиляти нігті подруги. Вони весело пили, поки їхня бесіда переходила на новини з далеких міст, вісті про родину Шарлотти, від якої вона віддалилася, їхні власні мрії та страхи, тиск лідерства та багато іншого. Вони обмінялися розповідями про нещодавні нічні жахи; Шарлотта стала емоційною, згадуючи сон, у якому з'явилася її колишня родина, щоб забрати її і перетворити на когось іншого. Вони обійнялися, перш ніж напругу зняв грубий жарт. \n\nЗайшла мова про великі війни на півдні, настільки великі, що про них чули навіть у таких містах, як Істпорт. Обидві вголос сподівалися, що південь залишиться на півдні. Хакіс було настільки комфортно базікати та пити, що вона зовсім забула, навіщо взагалі прийшла в гості. Мер згадала про це лише тоді, коли Шарлотта закінчила розповідати, як вона була в захваті, коли днями деякі місцеві чоловіки робили їй компліменти. Пролетіла ще одна година. "
  nf_eas_april.13.a:0 "Можливо, ще трохи"
  nf_eas_april.13.b:0 "Мені слід братися до роботи"