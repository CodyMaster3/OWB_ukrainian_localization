l_english:

##Characters
  EAS_HAKIS_NAME:0 "Хакіс"
  EAS_HAKIS_DESC:0 "§O\"Який чудовий день, щоб очолити таких прекрасних п'яних негідників\"§!\n\nХакіс, донька сина доньки Горіса — звичайна жінка з незвичайною спадщиною. Вихована на розповідях про пригоди свого прадіда, вона мріяла про власні подібні подвиги, але ніколи не вірила, що такі фантазії можуть стати реальністю. Несподівано вона опиняється в ролі лідера, і доля Істпорта опиняється в її руках. Керувати містом пияків і броварів — можливо, не ті подвиги, про які вона мріяла, але вона рішуче налаштована зробити все можливе і змусити прадіда пишатися нею."
  EAS_april_hakis_trait:0 "Напрочуд небезпечна чарівниця"
  EAS_FRANK_KLAU_NAME:0 "Френк Клау"
  EAS_FRANK_KLAU_DESC:0 "§O\"Гррааагхаоооррр\"§!\n\nМістер Френк Клау — міцний юнак, який приїхав до Істпорта в пошуках дружини. Йому пощастило натрапити на мера Хакіс, і між ними зав'язався бурхливий роман. Френк не дуже говіркий, але він сміливий і сильний, і вже призвичаївся до місцевих традицій денного і нічного пияцтва. Він швидко стає невіддільною частиною міста і завжди з радістю бере участь у бійках, коли рейдери та прихильники тверезості приходять, щоб влаштувати проблеми. Він також не пасе задніх, коли доводиться очолювати команди на небезпечних завданнях по найгіршій місцевості; завдяки Френку Хакіс з кожним днем пишається своїм чоловіком все більше. До того ж, у нього чарівна сім'я."
  EAS_hakis_what_a_man:0 "Чарівний холостяк"
  EAS_MISS_CHARLOTTE_NAME:0 "Міс Шарлотта"
  EAS_MISS_CHARLOTTE_DESC:0 "§O\"Сідай, люба, ти маєш почути, що вчора вночі накоїв той хлопчисько Гуннар!\"§!\n\nМіс Шарлотта — напівнова поселенка в Істпорті, яка заробляє кришки, підстригаючи волосся і нігті, а також торгуючи косметикою власного виробництва. Велика подруга міс Хакіс і більшої частини міста загалом, вона є як найобізнанішою пліткаркою в окрузі, так і ключовою особою для будь-кого, хто хоче бути в курсі п'яних витівок місцевих. Палко віддана Хакіс та Істпорту за те, що ті так легко прийняли її після того, як її зреклися і вигнали з колишньої сім'ї; вона зробить усе, щоб допомогти їм. І зробить це стильно"
  EAS_hakis_lovely_friend:0 "Стильна пліткарка"
  EAS_MR_CLIFFORD_NAME:0 "Містер Кліффорд"
  EAS_MR_CLIFFORD_DESC:0 "§O\"Стискайте губи, народ!\"§O\n\nГоловний віртуоз гри на глечику в Істпорті, містер Кліффорд є маестро власного гурту: The Eastport Jug Blowin' Jamboree. Іммігрувавши до міста зі сходу, після прибуття він залишив позаду як релігійні конфлікти, так і тверезість. Бувши улюбленцем міста, містер Кліффорд отримав пропозицію від Хакіс навчити міське ополчення, як круто дудіти в глечик в ім'я культурної солідарності. З того часу він чудово проводить час, адже ніхто так не тягнеться до глечика, як п'яниця, життя якого висить на волосині!"
  EAS_hakis_jug_blower:0 "Лідер гурту глечиків"

  ##Ideas
  EAS_control_of_the_i80_hakis:0 "Контроль над I-80"
  EAS_control_of_the_i80_hakis_desc:0 "Ми контролюємо частину I-80, що дозволяє караванам проходити через нас і прямувати до Нью-Гаммонда; торгівля склом приваблює туди багатьох торговців, а мита з них допомагають нашій економіці. Проте 80-ті налаштовані захопити всю I-80, і ми ГЕТЬ НЕ готові до такої боротьби!"

  EAS_hakis_defending_life:0 "Захист наших життів (і нашої випивки)"
  EAS_hakis_defending_life_desc:0 ""

  EAS_hakis_barroom_style:0 "Барний стиль"
  EAS_hakis_barroom_style_desc:0 "У більш освічені часи це могли б назвати п'яним боксом або п'яним кулаком і зробити більш витонченим, але зараз часи не освічені. Жителі Істпорта чудово б'ються в п'яному стані, бувши п'яними частіше, ніж тверезими, і завжди готові до хорошої бійки в найкращі часи. Не маючи бажання намагатися боротися з цим так само, як і намагатися зупинити схід сонця, Хакіс заохочує ополчення та солдатів Істпорта піддатися цим звичкам і зробити їх своєю фірмовою рисою в бою. Зброя, можливо, була б безпечнішою, але стріляти з неї важко з помутнілим зором і тремтячими руками."

  EAS_hakis_vc_friends:0 "Друзі з Міста Сховища"
  EAS_hakis_vc_friends_desc:0 ""

  EAS_hakis_renos_tab:0 "Великий рахунок Ріно"
  EAS_hakis_renos_tab_desc:0 ""

  EAS_hakis_deathclaw_family:0 "Неспокійна розширена сім'я Френка"
  EAS_hakis_deathclaw_family_desc:0 ""

  EAS_hakis_deathclaw_workers:0 "Нова професія сім'ї"
  EAS_hakis_deathclaw_workers_desc:0 ""

  ##Decisions
  form_eas_hakis_nppr:0 "Сформувати Нову Напиту Народну Республіку!"
  form_eas_hakis_nppr_desc:0 ""
  EAS_hakis_republic_formable_tt:0 "§GНадає претензії на кожен національний регіон [WHT.GetName], [HEA.GetName] та [BDT.GetName].§!\n§RОднак наша раптова агресія та серйозна інтоксикація призведуть до того, що кожна сусідня країна отримає претензію на один з наших випадкових регіонів!§!"

  EAS_hakis_republic_elites:0 "Нова Напита Народна Республіка"
  EAS_hakis_republic_elites_ADJ:0 "Нової Напитої Народної Республіки"
  EAS_hakis_republic_elites_DEF:0 "Нову Напиту Народну Республіку"
  EAS_hakis_republic_ruler:0 "Нова Напита Народна Республіка"
  EAS_hakis_republic_ruler_ADJ:0 "Нової Напитої Народної Республіки"
  EAS_hakis_republic_ruler_DEF:0 "Нову Напиту Народну Республіку"
  EAS_hakis_republic_people:0 "Нова Напита Народна Республіка"
