CYC_DOYLE_NAME:0 "Дойл Оуенс"
CYC_DOYLE_DESC:0 "Пустка Невади – це земля долі, де навіть найменша зміна може стати різницею між виживанням і ранньою смертю, а ті самі проблеми вирішуються щоразу по-іншому. Рідні рівнини Бакару, як вони себе називають, не дають нічого, крім жовтуватої хворобливої трави, а єдине, що тут збирає врожай – це вітер. Великі відстані між поселеннями, і між ними – лише ворожа фауна й безплідні дюни. У такому місці засоби пересування – життєво необхідні. І саме з цими проблемами стикаються хлопці Дойла, ті самі, що колись стояли перед предками Ханів чи навіть Вісімдесятників.\n\nТа поки інші обирають шлях набігів, Бакару йдуть шляхом скотарства. Оуенс міг би стати новим Громовим Птахом – адже він, як і той, знайшов та відремонтував свій мотоцикл – і рівнини могли б здригатись від імені Чорного Принца. Та замість цього Оуенс залишився Оуенсом – і зумів заробляти на життя там, де інші не вижили б."