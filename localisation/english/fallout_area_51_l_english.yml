# decision categories
  area51_raids_category:0 "Дивні місця"
  area51_raids_category_desc:0 "Пустка сповнена залишками минулої епохи. Можливо, ми зможемо знайти щось серед попелу?"

  area51_raids_cure_disease_category:0 "Зусилля з лікування"
  area51_raids_cure_disease_category_desc:0 "Жодна ціна не буде завеликою, щоб витравити цю скверну з нашої землі. Залишається лише сподіватися, що ми встигнемо врятувати себе."

 # Decisions
  area51_raids_find_area51:0 "Розслідувати чутки"
  area51_raids_find_area51_desc:0 "Деякі з наших людей чули чутки про споруди десь у глушині. Металеві уламки та височенні бетонні будівлі — не новина для Пустки, але їхнє дивне розташування в пустелі викликає питання."
  area51_raids_raid_airbase:0 "Відкрити ангари"
  area51_raids_raid_airbase_desc:0 "На нас чекає справжня скарбниця довоєнних літаків! Нам лише потрібно докласти достатньо часу та зусиль, щоб вони знову злетіли в небо."
  area51_raids_excavate_facility:0 "Розкопати лабораторію"
  area51_raids_excavate_facility_desc:0 "Здається, під землею щось є... щось, навмисно поховане під тоннами породи. Але навіщо? У нас є лише один спосіб дізнатися це. Ми докопаємося до самих надр землі."
  area51_raids_open_security_door:0 "Прорватися до комплексу"
  area51_raids_open_security_door_desc:0 "Ми застрягли, величезні броньовані двері перегороджують нам шлях. З достатньою кількістю вибухівки ми могли б пробитися, але чи мудро це? Здається, ці двері створені як для того, щоб утримати щось всередині, так і для того, щоб не пускати решту світу."
  area51_facility_excavated:0 "Розкопана Зона 51"

  area51_raids_cure_effort:0 "Вилікувати Нову Чуму"
  area51_raids_cure_effort_desc:0 "Жодна ціна не буде завеликою, щоб витравити цю скверну з нашої землі. Залишається лише сподіватися, що ми встигнемо врятувати себе."

 # Events
  area51_raid_events.1.title:0 "Ще одна заборонена довоєнна база!"
  area51_raid_events.1.desc:0 "[Root.GetAdjective] війська прочесали пустки Невади та знайшли старий комплекс. Навіть за довоєнними мірками це місце здається... дивним. Бункери були поховані під піском, і тут нікого не було роками. Якимось чином електроенергія досі є (дехто з полегшенням знайшов працюючий холодильник), а деякі з наших бійців стверджують, що чують голоси. Але, мабуть, все гаразд. Вивіска на одному з бункерів вказує, що колись це був Випробувальний полігон Грум-Лейк. Тепер нам залишилося лише з'ясувати, що саме вони випробовували."
  area51_raid_events.1.a:0 "Чудово!"

  area51_raid_events.2.title:0 "Більше піску"
  area51_raid_events.2.desc:0 "[Root.GetAdjective] розвідники нічого не знайшли в пустелях Південної Невади. Хоча деякі з наших людей повідомляли про мерехтливі вогні в нічному небі та загрозливі фігури уві сні, єдине, що вони виявили — це довоєнні туристичні пастки. Це починає скидатися на марнування часу — можливо, нам варто було піти пограти в казино у Вегасі?"
  area51_raid_events.2.a:0 "Ненавиджу пісок."
  area51_raid_events.2.b:0 "Я не люблю пісок. Він жорсткий, грубий і дратівливий, і він проникає всюди."

  area51_raid_events.3.title:0 "Зниклі розвідники!"
  area51_raid_events.3.desc:0 "Якимось незбагненним чином наші люди, які вели пошуки в пустелі, зникли. Ми припускали, що на них напали рейдери або вони просто заблукали, але нам вдалося знайти їхній останній табір. Схоже, вони просто... зникли. Їхнє багаття згасло само по собі, а над ним висів повний казанок. Їхня зброя лежала на землі, і з неї не стріляли. Жодних слідів кровопролиття. Ніби вони просто пішли в пустелю.\n\nОт тільки слідів на піску немає."
  area51_raid_events.3.a:0 "Ну, дідько."

  area51_raid_events.4.title:0 "Доторкнутися до небес"
  area51_raid_events.4.desc:0 "Нам вдалося розкопати заборонений бункер, повний стародавніх літаків. Це не зовсім те, що ми сподівалися знайти в Зоні 51, але це краще, ніж нічого. Ми зможемо вивчити ці креслення для власних потреб."
  area51_raid_events.4.a:0 "Мабуть, не в кожному бункері можна знайти Силову броню."

  area51_raid_events.5.title:0 "Авіаційні технології"
  area51_raid_events.5.desc:0 "Схоже, Зона 51 та комплекс Грум-Лейк були випробувальними полігонами для новітніх літаків під час Великої війни. Деякі з проектів, які ми знайшли в системі, просто неймовірні й, відверто кажучи, перевершують те, на що, як ми думали, були здатні ВПС США. Враховуючи тотальний колапс суспільства, ми не можемо виробляти більшість із цих літаків, але там все ще є кілька слушних ідей."
  area51_raid_events.5.a:0 "Це буде чудово!"

  area51_raid_events.6.title:0 "Гвинтівки Гаусса"
  area51_raid_events.6.desc:0 "Здається, Зона 51 була центром американських досліджень електромагнітного обладнання. Використовуючи те, про що ми дізналися, ми зможемо озброїти наших бійців гвинтівками Гаусса."
  area51_raid_events.6.a:0 "Не можу дочекатися, щоб випробувати це на наших ворогах!"

  area51_raid_events.7.title:0 "Плазмова зброя"
  area51_raid_events.7.desc:0 "Багато хто задавався питанням, як армія США навчилася створювати плазмове обладнання, і, схоже, Зона 51 має відповідь на це запитання. Деякі схеми написані мовою чи кодом, який ми не можемо осягнути, але ми зібрали достатньо деталей, щоб створити цю зброю."
  area51_raid_events.7.a:0 "Тільки не торкайтеся цього слизу голими руками."

  area51_raid_events.8.title:0 "Нова Чума"
  area51_raid_events.8.desc:0 "О ні! Якийсь необережний солдат [Root.GetNameDef] увірвався до довоєнної біологічної лабораторії і випустив на волю хворобу. Хоча бідолаха стверджував, що це просто застуда, коли його шкіра посиніла і він почав кашляти кров'ю, ми зрозуміли, що щось не так. На той час було вже надто пізно. Десятки наших людей зараз хворі, а перші симптоми вже зафіксовано в нашій столиці.\n\nЗ прикрістю повідомляю, [Root.GetLeader], що у мене теж є ці симптоми."
  area51_raid_events.8.a:0 "Навіщо ми взагалі відкрили цей бункер!?"

  area51_raid_events.9.t:0 "Нова Чума поширюється"
  area51_raid_events.9.d:0 "Здається, дехто з наших людей заніс хворобу до сусідньої країни. Деякі з наших наймудріших лідерів побоюються, що хвороба пошириться всією Пусткою, несучи смерть і відчай у масштабах, небачених з часів Великої війни. Наша єдина надія полягає в тому, що хтось зможе це зупинити."
  area51_raid_events.9.a:0 "Можливо, нам варто оточити цілі регіони кордоном."

  area51_raid_events.10.t:0 "Кінець Нової Чуми"
  area51_raid_events.10.d:0 "Ми зробили це! Нам вдалося знайти ліки від Нової Чуми! Вже зараз каравани розвозять ці чудодійні ліки через наші кордони. Ми оплачемо мертвих, але ми все відбудуємо.\n\nЯк і завжди."
  area51_raid_events.10.a:0 "І було багато радості."
  area_51_disease_survivor:0 "Пережив Нову Чуму"

  area51_raid_events.11.title:0 "Це була пастка!"
  area51_raid_events.11.desc:0 "Виявилося, що Зона 51 була створена не для того, щоб захистити багатства від зовнішнього світу, а для того, щоб захистити зовнішній світ від чогось всередині. Щойно вибух зніс броньовані двері, на нас накинулася армія роботів-реплікантів на чолі з таємничим командиром. Цей командир не зацікавлений у дипломатії, він керується лише люттю — ніби демон, викликаний із самого пекла, щоб покарати нас за своє пробудження."
  area51_raid_events.11.a:0 "ЩО Ж МИ НАРОБИЛИ!?"

  area51_raid_events.80.t:0 "Нова Чума"
  area51_raid_events.80.d:0 "Піддані [389.Owner.GetNameDef], вочевидь, підхопили хворобу, яку раніше бачили лише в Чумних землях. Здається, ніщо з того, що вони роблять, не може зупинити її прогресування, і вона поширюється їхніми землями, як лісова пожежа. Мандрівники повідомляють про таку кількість загиблих, що тіла лежать непохованими прямо на вулицях. Один торговець розповів нам, що його супутник здавався цілком здоровим кілька днів, а потім раптово зліг за одну ніч.\n\nБідолашний захлинувся власною кров'ю.\n\nСподіваюся, ця хвороба не дійде до нас."
  area51_raid_events.80.a:0 "Зачекайте, у того торговця була лихоманка... о ні."

  area51_raid_events.81.t:0 "ВІТАЮ, ЗЕМНІ МАВПИ"
  area51_raid_events.81.d:0 "\"ВАШІ ПРЕДКИ ТРИМАЛИ МЕНЕ В ПОЛОНІ У ЦІЙ ЖАХЛИВІЙ КЛІТЦІ МАЙЖЕ ТРИСТА ВАШИХ ЗЕМНИХ РОКІВ.\nНА ЩАСТЯ, ХТОСЬ ІЗ ВАС ВИЯВИВСЯ ДОСТАТНЬО ДУРНИМ, ЩОБ ВІДПУСТИТИ МЕНЕ. Я З НАСОЛОДОЮ ПЕРЕТВОРЮ ВАШІ СІМ'Ї НА СУБАТОМНИЙ ПОПІЛ І ВИКЛИЧУ ВЕЛИКУ АРМАДУ, ЩОБ ВАШІ ОКЕАНИ БУЛИ ОСУШЕНІ, СИЛЬНІ ТА ПОКІРНІ — ПОНЕВОЛЕНІ, А НАД ЦІЄЮ ЗРУЙНОВАНОЮ БРЯЗКАЛЬЦЕЮ БУЛО ВСТАНОВЛЕНЕ ПАНУВАННЯ ЗЕТАНЦІВ.\nПІДПИС: КОМАНДИР К'ІН, ЗОРЯНА АРМАДА ЗЕТАНЦІВ.\""
  area51_raid_events.81.a:0 "Я не хочу, щоб мене зондували!"
  area51_raid_events.81.b:0 "А я думав, що все пройшло добре!"