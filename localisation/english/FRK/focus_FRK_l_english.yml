l_english:
 FRK_start:0 "Threats to Our Evil Plans"
 FRK_start_desc:0 "Wait a minute, isn't there something missing? There should be three more focuses above us, right? Eh, they aren't needed this time, those ones in the Order handled it.\n\nThere's stuff we need that others have and there are muties out there who could stop us. It's time to kick bubblegum and chew ass."
 FRK_focus:0 "Recruit Assael"
 FRK_focus_desc:0 "No, you read that right- we really intend to kick bubblegum and chew ass. There's a tall, tight ass of a warrior calling itself Azael that we could try and recruit to our cause. Technically, their kind aren't muties as defined by Cao Guolong- no, we're not attracted. It's their food and culture, honest!"
 FRK_focus_1:0 "We Didn't Forget the Order"
 FRK_focus_1_desc:0 "Most people who welcomed us seemed to welcome Site XXX more than the Freakclave, and when they figured it out they all started running for the north. What's left of the Order is not going to put us down just because our past requires a lot of bleach. The Americanized Chicago Dog was decades ago, guys!"
 FRK_focus_2:0 "Execute the Judges"
 FRK_focus_2_desc:0 "The best way for everyone to establish that America is back and in charge despite our appearences is to put down the leadership of the old. At the same time, Cao Guolong's got an idea for a snuff film and we probably should be catering to the Deathclaw market...."
 FRK_focus_3:0 "Where'd These Come From?"
 FRK_focus_3_desc:0 "Did MacArthur lose track of their Wanamingo stockpile? I thought the Deadline was home to a zombie apocalypse instead? Eh, there's still shooting aplenty to be done. Let's get target practice in beforehand."
 FRK_focus_4:0 "Disrupting the Reavers"
 FRK_focus_4_desc:0 "Okay, so we have a problem here if we don't play dumb. Vivienne Castareli is part of some high-end group in the business consortium that was in Chicago until we showed up to help them, and we're not going to make friends if she winds up dead. Let's be careful- pretend that Site XXX is offering to trade some productions for some Sony relics. They won't know what hit them!"
 FRK_focus_5_desc:0 ""Okay, NOW we can go in guns blazing. Just try to take some of them alive- blood play is a profitable fetish."- Cao Guolong"
 FRK_focus_5:0 "Slaking Vampire Thirst"
 FRK_focus_6:0 "In the Deadline, No One Can Hear You Moan"
 FRK_focus_6_desc:0 "After much consideration from Site XXX, there isn't much value in a Wanamingo for productions aside from the tentacles. More importantly however, Freak Horrigan can utilize Sites Y and Z to finalize their plans, and she has a suspicion that it's better to put it down since it failing brings a lot of problems."
 FRK_focus_7:0 "Wanamingo Hats and the Key to Site Z!"
 FRK_focus_7_desc:0 "As it turns out, the Wanamingos were traveling through a gateway that nobody ever bothered to turn off. Anything's easy to turn off with a few well-placed mini nukes- oh. There's a key already in the lock.\n\nNOBODY SAY ANYTHING! At least we can dress up the Ghouls in Site Z with a bunch of hats made out of Wanamingos."
 FRK_focus_8:0 "Still a Better Love Story than Twilight"
 FRK_focus_9:0 "Site XXX Productions"
 FRK_focus_9_desc:0 "Before there was the Freakclave, there was Site XXX. Named after Site X just down the block, it produced pornography of all sorts catering to all tastes.\n\nThe Freakclave grew from here, but as Freak Horrigan takes on the Plaguelands, work never ceases at the Site. Making a better porno will allow us to build a better army."
 FRK_focus_10:0 "Military Fantasy"
 FRK_focus_10_desc:0 "One of the most popular genres of entertainment is military fantasy. We're not just talking about all the good serving with an organization like the Freakclave can do- there's the Midwestern Brotherhood south of us, and they love it! Let's put together something that they'd be into. Power Armor has its uses."
 FRK_focus_11:0 "Butt Sets Sail"
 FRK_focus_12:0 "Pullout Shelter"
 FRK_focus_12_desc:0 "Who made Pullout 1 and 2? Cao Guolong doesn't know and doesn't care since they're set in California. What he does know is that if the setting for this one is going to be inside a bunker, then the best thing to do is make some bunkers. They're going to be amazing facilities for the Freakclave as well, as long as no one shines a blacklight inside it. They could probably end up seeing the luminol from orbit."
 FRK_focus_13:0 "How Do I Power Armor?"
 FRK_focus_13_desc:0 "Let's be honest, secret borrowing from Chicago's storehouses is not going to fly if the Secretary of the Interior finds out what it's used for before reaching the front lines. Longer term, we need to figure out another solution. However, Site XXX is due for negotations at Bunker Epsilon for a major sale of productions, and we've got a few people who know the value of not being seen...."
 FRK_focus_14:0 "The Man From Dead Pussy"
 FRK_focus_14_desc:0 "There's a Ghoul fluffer here who claims he met Cooper Howard while he was walking east. We have doubts, but he also has a copy of the Man from Dead Horse and knows where we can find a decent lookalike of the guy. You know what we have to do."
 FRK_focus_15:0 "On Set Design"
 FRK_focus_15_desc:0 "Let's be honest here- Omaha's gotten really, really cramped since we took over. Odds are high that not only is our capability to build stuff in the city low, there's more production facilities than there is space to house them. Moving as much of the Freakclave's work into Site XXX will not only free up the Freakclave's plans for the city and beyond, it'll let us make a better production."
 FRK_focus_16:0 "I Banged a Maoist"
 FRK_focus_16_desc:0 "Ventura Cosmos doesn't know what a Maoist is, and frankly, he and his wife don't want to know. But they are very kinky, and the protagonist of that pre-War film had some good ideas. It's a better porn parody than that one movie where the man got pregnant, as much as Mrs. Ventura wishes it were possible. Break out the hammer and sickles, and lube up the chains."
 FRK_focus_17:0 "An Electronic Warfare Suite"
 FRK_focus_18:0 "Above the Platte and the Missouri"
 FRK_focus_18_desc:0 "Who needs Navy? No, really, we're in the middle of an empty flat land here where very few trees survive. You could go mad out here!\n\nNo, what the Plaguelands has a lot of is empty fucking space, and that is absolutely a literal statement. Besides, we're the Enclave. Of course we get some Vertibirds to play in!"
 FRK_focus_17_desc:0 "Our stars need time in the sun that isn't going to risk them catching the Blue Flu. Yet more importantly, there are a ton more Reavers on the other side of the river, and they're not going to take how we put down their kindred lightly.\n\nAre we about to cause a holy war that will frustrate us to no end? Absolutely!"
 FRK_focus_8_desc:0 "That Castareli bombshell has been sent home to Chicago with a message for the Enclave at large: the Enclave is handling Plaguelands operations.\n\nOh, and if you want to be a star, report to Site XXX!"
 FRK_focus_21:0 "Surprisingly Cool Nerds"
 FRK_focus_21_desc:0 "Captain Ventura's got a really cool spear now, and New Epsilon's got insanely cool barbecue- who knew a Tato could taste good? But that's not important- the ones who didn't run away to Bunker Epsilon and died fighting us have some very interesting implants. Implants may be too weak a word, in fact. We're not going to mutilate ourselves (who would do that?), but we are going to take them apart with great interest for... other projects."
 FRK_focus_22:0 "Who You Gonna Call?"
 FRK_focus_22_desc:0 "There's something strange in the neighborhood, but it's not these guys. Clearly, they are raiders and we should get the Oahe under our control. But there is something more important just past them that we need a staging ground for, and Freak Horrigan knows just what would be a good fallback point if the need arises."
 FRK_focus_23:0 "Breakthroughs in FEV"
 FRK_focus_23_desc:0 "Freak Horrigan and Captain Ventura are fighting to secure defensive positions so that if the Brotherhood comes, we'll be protected. But the true goal has always been what the Enclave has wanted to do- they just weren't able to until they had free reign among the Plaguelands.\n\nF. E. V."
 FRK_focus_24:0 "Starting Small"
 FRK_focus_24_desc:0 "Of course, any proper testing must be done with lesser beings first. There are plenty of mutants that can't talk that can be used as a trial run for the FEV. Let us start collecting them, so we can see what is to come."
 FRK_focus_19:0 "Wrong Aircraft"
 FRK_focus_19_desc:0 "When Freak Horrigan requested aircraft schematics, she was looking for Vertibirds, not whatever this is. The Secretary of the Interior, Colonel Autumn, and even President Eden, when asked why, explained that aircraft were not to be used for the Mile High Club and that this type of aircraft would keep it from happening again. Frankly, Lois thought it was worth it."
 FRK_focus_20:0 "Use Protection Every Time"
 FRK_focus_20_desc:0 "It's painful when a ride ends and you're not protected. After a harrowing climax full of fear, you're staggering back home and it's only until you check with a doctor later for the full consequences. The solution is clear- buy a lot of condoms and morning after pills.\n\nAlright, fine, we'll throw in some anti-aircraft around Omaha!"
 FRK_focus_25:0 "Did We Forget?"
 FRK_focus_26:0 "Unleash the FEV"
 FRK_focus_26_desc:0 "At long last and without a single 30-day focus in sight, the Enclave's mission will succeed. Freak Horrigan has worked hard to make sure the research needed to finish could be done so, and to secure a position so nobody could stop them. Now, just outside the walls of Omaha, the Freak Evolutionary Virus shall be expunged into the atmosphere and spread via the jet stream around the world. Everyone will become freaky, and when everyone's freaky... no one will be."
 FRK_focus_23_desc:0 "There is a reason that Freak Horrigan formed an Enclave cell here in the Plaguelands- the Blue Flu might just have everything we need to finish the FEV. This has been a project worked on since the days of America of old, and once, the Enclave intended to use it to save the world.\n\nSo, too, shall the Freakclave bring it to the globe."
 FRK_focus_27:0 "They Must Be Enclave!"
 FRK_focus_27_desc:0 "Think about it! They're a secretive group that emerged in the Plaguelands and are after something deep inside it. President Eden or the Secretary of the Interior must have accepted Freak Horrigan at last! We should go meet up with them right now!"
 FRK_focus_29:0 "Great Buster!"
 FRK_focus_28:0 "Begin Testing"
 FRK_focus_11_desc:0 "Love Sets Sail is an unforgettable romance by any who would ever watch it. This... is not that. In fact, anyone who's seen the inspiration is going to die a little inside if they do. Lucky for us, there's not many alive who have seen it."
 FRK_focus_30:0 "They Weren't the Enclave :("
 FRK_focus_31:0 "Pullout 69"
 FRK_focus_31_desc:0 "Prequels are apparently a good long-term investment if at least one pre-War science fiction film series is anything to go by. Let's see how many memes a single production can generate: this is where the fun begins."
 FRK_focus_25_desc:0 "Oh shit, we forgot an air strip and landing pads! Dump as much money as we can into it, we gotta get it done ASAP! Or, we can play it safe and build slowly in the meantime, but the need for a player to finish all focuses is going to win out. You'll see!"
 FRK_focus_28_desc:0 "While we can continue further experimentation before moving on to a human population, relations with our neighbors are poor enough it might be worth doing some live field tests. Our opponents can act as samples, and they won't have a say in it. Surely, this is what President Eden wants."
 FRK_focus_32:0 "Feral or Freaky?"
 FRK_focus_32_desc:0 "Of course we think Ghouls are animals. In fact, why would you think they're not? That'd be positively as un-American as Super Mutants and mutfruit pie. They still have some similarities to humanity however, so they're good test subjects. Just try not to think about how many of them die from overexertion."
 FRK_focus_30_desc:0 "This was a horrible shock for Freak Horrigan. They weren't the Enclave, but they were in fact the Initiative, and certainly were no longer friends. If the Initiative survived leaving Chicago, then it can only mean one thing: the Secretary of the Interior won't mind us taking their stuff!"
 FRK_focus_33:0 "The Best Porn in the Wasteland"
 FRK_focus_34:0 "The WRONG Kind of Freaky"
 FRK_focus_34_desc:0 "There's something freaky about these people, and not in the way Freak Horrigan hopes for. At one time, they were primarily breakaways from those Order weirdoes who had a big ol' disagreement about their religion. Now, there's a new kid in town, and it gives a lot of people a desire to shoot it on sight. Setting aside the usefulness of clearing out the Plaguelands for ourselves, it's probably better to deal with this figure, and a hanging won't do."
 FRK_focus_36:0 "This Was Fucking Pointless"
 FRK_focus_36_desc:0 "I wanted to talk about the bonus, the bonus for the Freakclave winning. When do we get it?"
 FRK_focus_37:0 "Pullout: New Anus"
 FRK_focus_38:0 "Something Slick"
 FRK_focus_39:0 "Creepy Crawlies"
 FRK_focus_40:0 "Scittering Swarms"
 FRK_focus_41:0 "A Little Nibble"
 FRK_focus_42:0 "Glowussy"
 FRK_focus_43:0 "Acquire Test Subjects"
 FRK_focus_44:0 "FISTO Not Responding"
 FRK_focus_45:0 "A Useful Scrapheap"
 FRK_focus_46:0 "Busting Open Site Y"
 FRK_focus_47:0 "Who's Your Daddy?"
 FRK_focus_47_desc:0 "There's a lot of people that came over the river for some reason we don't get. In fact, they seem to be hosting mass for the robots. We didn't know they were Catholic, but Catholics are also distinctly un-American and need to be shown a proper religion by the Freakclave. Have you heard of our Lord and Savior Cao Guolong? Oh, and we probably should plug up the gaps ourselves so nobody else can come through."
 FRK_focus_48:0 "Construction Material Found!"
 FRK_focus_49:0 "And What Does He Do?"
 FRK_focus_50:0 "The Expedition to Vault 69"
 FRK_focus_51:0 "Defeat the Fire Council"
 FRK_focus_52:0 "WHAT DO YOU MEAN THEY SPLIT!?"
 FRK_focus_53:0 "FINAL BOSS: HORSES"
 FRK_focus_39_desc:0 "There's one pest that we have everywhere and nobody will miss- roaches! We contracted a former Sanitizer to handle getting near their nests and spraying them with a solution. What they don't know is that the solution is FEV, and we'll also find out how immune they can be. Let's just hope it's not hard to keep track of the nuisances."
 FRK_focus_38_desc:0 "Ventura Cosmos had a really great idea on how to preserve not only the Mirelurk claws, but the eggs as well. Let's dust off those plans MacArthur had for Wanamingo preservation and see if we can do something about it. Don't let Freak Horrigan know what Ventura gets up to with the claws."
 FRK_focus_42_desc:0 "Fucking hell, what type of person is into this shit? You couldn't hide forever! You went into med bay and complained about how you got irradiated in the field, and the medic asked why it's all localized to your genitals and how come you're really assigned to guard duty at what's left of Sanctum. You absolutely disgust me.\n\nOh? You were actually doing some research? Well, it better be a good one for someone who committed bestiality."
 FRK_focus_43_desc:0 "It's taken awhile, but it's time to start collecting human test subjects. Well, as human as the average Wastelander can be anyway. Yes we do recruit outsiders, why do you ask?\n\nThe people of the Fringe would make ideal test subjects, missing any rallying figure to mount a resistance behind. We march on Freak Horrigan's orders."
 FRK_focus_44_desc:0 "Cao Guolong hasn't been able to get a hold of his favorite sex-bot in a while. He says there's a lead on a decent robotics facility in the western Plaguelands, so let's go get them!"
 FRK_focus_50_desc:0 "Turned out a lot of the construction material isn't useful when it's already built something (why is Cao Guolong facepalming?), but there is a very intriguing lead in the Last Redoubt. In the bowels of Vault 55, there are records of a Vault that absolutely would be of use to the Freakclave. To say the data would be enlightening is an understatement, and Cao Guolong maintains that there will be a lot of money made if it's found. It's time for a long-range adventure, Ventura Cosmos!"
 FRK_focus_45_desc:0 "Before the bombs, America fully intended to automate the Nebraska Quarantine Zone to free up troops for use in the Big 51. While most of the turrets have been reduced to slag over the centuries and the robots are for the most part busted, even we can still find a use for it. Well, anyone can find a use for it, but still!"
 FRK_focus_46_desc:0 "For some reason, the Initiative have given us a much harder time with opening Site Y. Site X was easy enough to capture, while Site Z just needed enough firepower. But here, finesse is required.\n\nGreat Buster has a plan to get us inside. We do that, and we can convert the Site into another base that can turn the Blue Flu into the FEV. Oh, uh, should we drop that plot detail here?"
 FRK_focus_53_desc:0 "Super Mutants, rival nations, the Brotherhood of Steel... the fact of the matter is that there is one thing more dangerous than all of them: horses.\n\nNo, not the horse riders. It is the horses themselves who are the most powerful and out to defeat us all. There is no capability of achieving our goals without the defeat of horses. Horse girls are truly traitors to mankind, and there is only one way to put down these horses before they take over the world! It's hard to think of something worse than horses unless you ask Cao Guolong."
 FRK_focus_48_desc:0 "When the Nebraska Quarantine Zone was established, the Vault that had been under construction in its borders, Vault 55, was abandoned. To our disappointment, the construction workers didn't die like they were expected to, and their descendents have done a good job for themselves surviving. They've also done a good job building infrastructure and materials needed for our FEV project, so we'll be taking that now. And no, Union protections don't apply."
 FRK_focus_51_desc:0 "At this point, the majority of the Plaguelands are under our control outside of some stragglers and the occasional Blue Flu-inflicted victim we haven't shot yet. Refinement of the FEV and the construction of the release vessel is going well, but there's a group just outside the Plaguelands that can stop us- the Fire Council.\n\nA united group of native tribals who somehow understand electricity, they need to be put back in their place by America before they get any ideas about defeating us. It's time for operation: AMERICA! FUCK YEAH!"
 FRK_focus_29_desc:0 "Ventura and Mrs. Cosmos were greatly impressed by Great Buster's, ahem, capabilities during interrogation. As a result, instead of enacting our usual Freakclave policies upon a group being subjugated, we're going to give a lot more autonomy and let our prisoners be free to leave in exchange for Great Buster directly becoming an agent.\n\nDon't explain to Freak Horrigan what the term 'spitroast' means. It's funnier if she doesn't know."
 FRK_focus_49_desc:0 "Say what you will about how crappy the robots are, we've still got a lot of functioning bots. Quite a few of them ran away and hid, only needing easy shots to be deactivated instead of full destruction. I wonder why they're acting like they're afraid? Let us bring some of these robots back to Site XXX, so we can learn how to reprogram them for ourselves."
 FRK_focus_52_desc:0 "Okay, so maybe we didn't do the research for Freak Horrigan. Maybe she's going to be pissed at us. Maybe she's going to send us to Cao Guolong who'll have us go back to waving our naughty bits for money. Maybe that wouldn't be so bad?\n\nOh, who am I kidding? As it turns out, the natives are not one group, and now we have a very angry herd of horseman ready to kick our ass. This is gonna suck."
 FRK_focus_41_desc:0 "We'd spent so long figuring out egg preservation that we hadn't thought of the obvious solutions- why not just feed the mothers and fathers well? We can give them not only food, but partners, and that should result in many more eggs coming to terms. No, we're not working on somebody's fetish- well, it's someone on the team's fetish, but let's not ask any more questions on the biology involved."
 FRK_focus_40_desc:0 "It turned out that the FEV worked insanely well with the roaches- so well, that we had to call back the former Sanitizer again to actually deal with most of them this time. The larger ones, meanwhile, can just be pointed at our enemies and let God sort them out. Imagine if someone could actually control them- we'd be so fucked!"
 FRK_focus_33_desc:0 "The complete catalog of Site XXX has little that can be compared to. Every day, someone is left spent after witnessing one of our productions, and more than a few people have been confirmed to have been conceived shortly after witnessing one of our products. If that's not a powerful legacy, what is?\n\nNext up is Pullout 3 and 4. People are always into DILFs and MILFs...."
 FRK_focus_37_desc:0 "This has been what Cao Guolong has been working towards for his entire career. After this, there's nothing else to do but sit back and let the Freakclave finish their mission. This partnership was so worth it despite no longer being in charge. The fuck dragon is on top."
