## Ideas

FRK_offensive_penalty_idea:0 "The Long War"
FRK_offensive_penalty_idea_desc:0 "Despite what the Focus Tree may tell you, the Freakclave is consistently on a war footing regardless of what Raven Rock or Chicago thinks. The Plaguelands suck that much."
FRK_fight_reavers_idea:0 "Reaver Counters"
FRK_fight_reavers_idea_desc:0 "Drop an old Sony CD player and they all lose their minds. American engineering is so much better."
FRK_fev_early_results_idea:0 "Early FEV Leaks"
FRK_fev_early_results_idea_desc:0 "Whether willingly or otherwise, some of our FEV samples have leaked from our labs into the world beyond. It has begun effecting the behavior of our populace- some lasting longer than others."
FRK_target_practice_idea:0 "Target Practice"
FRK_target_practice_idea_desc:0 "The best way to prepare a firing line is to line up and start shooting. It doesn't matter what thing you're shooting at, the experience transfers over."
FRK_communism_idea:0 "I Banged a Maoist"
FRK_communism_idea_desc:0 "A touching story of how love can conquer any insidious ideology that includes maternity leave."
FRK_communism_2_idea:0 "Pullout: New Anus"
FRK_communism_2_idea_desc:0 "A single working girl will decide the fate of the entirety of the Sonora Wasteland, but who is the mysterious stalker tracking her movements?"
FRK_acquire_idea:0 "The Man From Dead Pussy"
FRK_acquire_idea_desc:0 "How does a man change when surrounded by nothing but bad coochie?"
FRK_acquire_2_idea:0 "Pullout 69"
FRK_acquire_2_idea_desc:0 "After 25 years, a Vault of fantastic specimens of humanity set out to repopulate the Wasteland and fight giant flying monsters. Sometimes both at once."
FRK_working_idea: "Butt Sets Sail"
FRK_working_idea_desc:0 "The loss of a lover leads to many bad decisions and annoyed neighbors. Omaha's crowded, what can we say?"
FRK_working_2_idea: "Pullout Shelter"
FRK_working_2_idea_desc:0 "When a bunch of Vault Dwellers must deal with living in their Vault... oh, you know this leads to a dominatrix Overseer."
FRK_site_xxx_idea:0 "The Wonders of Site XXX"
FRK_site_xxx_idea_desc:0 "You really need to get out more. Your sexual exploits have been...well, two dimensional."
FRK_horse_fear_idea:0 "Totally Prepared"
FRK_horse_fear_idea_desc:0 "We can handle Standing Rock! Really! We're not about to hand them the Plaguelands on a silver platter!"
FRK_fev_infection_idea:0 "FEV Infection"
FRK_fev_infection_idea_desc:0 "Something has completely changed us. We are so into this shit and do not care how it's wrecking our ability to wage war!"
FRK_vault_68_idea:0 "A Good 68"


## Events

nf_freakclave.0.t: "Omaha's Bleached Underpants"
nf_freakclave.0.d: "The Nephilim, the destruction of the Sanitizers, the work to end the plague... much has occurred in the streets of Omaha. But down one particular street a few blocks away from Site X lies a very different sort of Site: \n\nSite XXX.\n\nPornography will always exist, and no matter how hard the Patriarchs try, the business cannot be dislodged. Yet one day Site XXX's proprietor, Cao Guolong, approached the Order with an offer. Apparently, his organization had done quite well for itself in the construction of goods in order to facilitate their... films. Long offered some of this capacity to the Order, in exchange to turning the other cheek to their business. After all, he didn't make his stars addicted to Jet."
nf_freakclave.0.a: "Guolong provides value despite his business."
nf_freakclave.0.b: "This degeneracy has gone on long enough- purge the porn!"

nf_freakclave.1.t: "A Sussy Second Offer"
nf_freakclave.1.d: "In recent times, Site XXX has come up again with another offer from Cao Guolong. As it turns out, their naughty quest now requires some interesting props. Not just strap-ons, but actual important equipment like medicine and hang gliders of all things. Long is aware of how such productions would require factories capable of putting out equipment the Order would need- so he's offering to set some production lines aside for the Order.\n\nThis isn't a trap, right? We're okay having a porn studio able to build a military?"
nf_freakclave.1.a: "What's the worst that could happen?"
nf_freakclave.1.b: "Wait a minute- these guys are Enclave!"

nf_freakclave.2.t: "We Should Have Read the Options"
nf_freakclave.2.d: "Wait, we know these guys! The Order knows about the Enclave up in Chicago- and there's been a cell of those freaks hiding in Site XXX the whole time! Who's idea was this?\n\nWhoever it was, they're moving fast and their surprise attack has already caused Sanctum to fall. Beyond the Great Seal, the men must rally to take back Omaha before whatever the Enclave are plotting is unleashed."
nf_freakclave.2.a: "Death to Chicago!"
nf_freakclave.2.b: "I believe in America!"

nf_freakclave.3.t: "Azael Fucking Dies"
nf_freakclave.3.d: "Uh... it seems we may have miscalculated a little. On one hand, the Nephilim absolutely have a lot of people that are sick of that lily-obsessed Order we kicked out of Sanctum. On the other hand, a lot of them, including Azael, find us horrifyingly gross. Or grossly horrifying, we're not sure which.\n\nAzael personally positioned the gun so when it shot itself, the brains splattered all over the film star we sent to recruit them. She's going to need therapy for this. At least some of the Nephilim showed interest in working for Site XXX, but not the Freakclave. I guess they hate America or something?"
nf_freakclave.3.a: "They were not, in fact, into that shit."

nf_freakclave.4.t: "Freak Evolutionary Virus Infection"
nf_freakclave.4.d: "Something strange has been happening to everyone in our borders. From the front lines of our fight against the Freakclave to our very seats of power, something is changing us. We don't know what, but if not handled fast, we may be too late...  you wanna have sex?"
nf_freakclave.4.a: "Oh my."

nf_freakclave.5.t: "You Broke the Rules"
nf_freakclave.5.d: "You think you'll be getting a buff? Wrong sir! Wrong! Under Section 37b of the EULA signed by you it states quite clearly that all offers shall become null and void if- and you can read it for yourself in this photostatic copy- "I, the undersigned, shall forfeit all rights, privileges, and licenses herein and herein contained," et cetera, et cetera... "Fax mentis, incendium gloria cultum," et cetera, et cetera, "Memo bis punitor delicatum!" It's all there! Black and white, clear as crystal! You chose to waste your time with this tag! You got the blood all over Nebraska, which now has to be washed and sanitized, so you GET... NOTHING! YOU LOSE!"
nf_freakclave.5.a: "GOOD DAY SIR!"

nf_freakclave.6.t: "The Discovery of a Vault"
nf_freakclave.6.d: "With two Vertibirds piled high with fuel, Captain Ventura Cosmos, Lois Cosmos, and their squad took off from Omaha, it rapidly shrinking in the distance. They flew in a cardinal direction that would remain a mystery for 10 days before adjusting their heading for another 10, being very careful not to spoil future content. But eventually, they touched down, and bad diarrhea from Captain Ventura was more than enough to blast open the Vault.\n\nGetting into the door, they discovered that the Vault was flooded with a radioactive green fluid. Samples, however, confirmed it was not coolant, and it was in fact quite sticky and filled with all sorts of skeletons rotting in the pools. Captain Ventura was very confused, but then Lois wiped the scat off the Vault door- this was Vault 68, not 69, and it turned out the men in the Vault were very, very gay. Well, that and the Bawls Atomic Line bottles explained the smell."
nf_freakclave.6.a: "A 68 is as good as a 69."

nf_freakclave.7.t: "The Sex Talk"
nf_freakclave.7.d: ""Horrigan honey, we need to talk."\n\n"What now, Lois? Can't you see we're about to release the Freak Evolutionary Virus?" Freak Horrigan was quite irritated under the helmet, the riding crop gripped tightly in her hand.\n\nWhich Lois was having none of, cutting to the point. "Be honest with me now: what do you think will happen once the Freak Evolutionary Virus releases?"\n\nHorrigan had a quick response. "It will make everyone just like me- a freak."\n\n"That's not what getting freaky means, Horrigan. You're not a freak."\n\n"Then what does getting freaky mean!?"\n\nLittle did Horrigan know that behind her, Mina Nukes had finished launching the Freak Evolutionary Virus into the atmosphere and would shortly infect the whole planet. And for a brief time, the world was united in one thing."
nf_freakclave.7.a: "Getting Freaky."