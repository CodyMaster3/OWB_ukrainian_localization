##Dramatis Personae

FRK_FREAK_HORRIGAN_NAME:0 "Freak Horrigan"
FRK_FREAK_HORRIGAN_DESC:0 "§4"I don't understand any of this, but I believe in America!"§!\n\nAfter President Eden reached through a monitor to punch her in the face, Freak Horrigan wandered the wastes, finding a janitorial position at Site XXX. After doing a photoshoot she didn't quite understand, Freak Horrigan gained the ultimate power of all- networking.\n\n Nothing will stop her quest to unleash FEV and redeem herself in the President's eyes."
frk_the_american_restoration:0 "The American Restoration"

FRK_CARRIE_COSMOS_NAME:0 "Ventura Cosmos"
FRK_CARRIE_COSMOS_DESC:0 "§4"In this case, the attacker saw the size of my wife's dick and became insanely jealous."§!\n\nHailing from the Scrappers Compact in the faraway southern lands of Oklahoma, Ventura was cast out of his clan for having relations with a mole rat. Dressed in a space suit he scavenged from the Scrapyard (which one?), he sought out the mystery of a missing person who happened to take a job at Site XXX to make ends meet. The two married and were well-off enough when Freak Horrigan arrived, ultimately leading one of the Cosmos clan to gain notable influence in the Freakclave. It's a debate as to which one."
FRK_space_detective:0 "Space Detective"

FRK_CAO_LONG_NAME:0 "Cao Guolong"
FRK_CAO_LONG_DESC:0 "§4"I'm certain you'll enjoy our wide variety of Site XXX- Horrigan, what the fuck is this?"§!\n\nThe proprietor and owner of Site XXX, Cao Guolong has done very well for someone living in the Plaguelands. Suspicions of being a smuggler for outside goods as well as exporting his productions are not unfounded."
frk_man_of_culture:0 "Man of Culture"

FRK_freakclaw_NAME:0 "The Freakclaw"
FRK_freakclaw_DESC:0 "Freak Horrigan's loyal pet Deathclaw. Reports of her riding him into battle are greatly exaggerated. Anyone who accuses her of a different sort of riding will have their limbs bisected and the torso fed to the Freakclaw."
FRK_freakclaw_trait:0 "Pet Deathclaw"

FRK_advisor_1_NAME:0 "Mina Nukes"
FRK_advisor_1_DESC:0 "§4"You'll be blown away!"§!\n\nOnce a star known for her deceptively sized rack across the midwest, Mina has taken to ensuring the destruction of the Freakclave's opponents like a duck to dirty water. There's apparently a ton of catharsis in turning the people who enjoyed her starring roles into meaty chunks from afar."
FRK_bombshell_trait:0 "Absolute Bombshell"

FRK_advisor_2_NAME:0 "Clappa Vagner"
FRK_advisor_2_DESC:0 "§4"You think Standing Rock is going to come after me for my stage name?"§!\n\nThe latter half of her stage name being said with a soft g, Clappa Vagner knows a lot about maintaining a continuous output schedule. This has evolved from the really nasty stuff she was doing for Cao Guolong to overseeing production lines, a role she vastly prefers."
FRK_tireless_workhorse_trait:0 "Going All Night"

FRK_advisor_3_NAME:0 "Glorious Catch"
FRK_advisor_3_DESC:0 "§4"Go on, sit down for some dinner."§!\n\nCatch has been tricking men and women alike for a long time, and it's a talent she puts to use for the Freakclave. People are convinced at the start of the night that they will end it with a deal in their favor, and by the morning, their kidneys are missing and they're being used as live test subjects. Catch cares not for their fate- she isn't a man eater, but she can be close."
FRK_satisfaction_guranteed_trait:0 "Satisfaction Guaranteed"

FRK_advisor_4_NAME:0 "Jane Lockleg"
FRK_advisor_4_DESC:0 "§4"There's no escaping me."§!\n\nThe specific niche Jane found herself in at Site XXX taught her the importance of staying hydrated. This is something she continues to harp on today, ensuring the troops never run out of milk. Er, water. Did I say milk?"
FRK_pipe_worker_trait:0 "Laying the Pipes"

FRK_advisor_5_NAME:0 "Lewda Capolitana"
FRK_advisor_5_DESC:0 "§4"Show them the right bits for the right amount of time, and people are hooked."§!\n\nLewda was the biggest star of Site XXX. Her life turned upside down when the Freakclave formed, but she is grateful both parts of her life remain present. For now, there's always spin doctoring to Omaha the Freakclave's mission so nobody knows what's really going on."
FRK_propaganda_ministress_trait:0 "Mistress of Propaganda"

FRK_advisor_6_NAME:0 "Nurse Maia"
FRK_advisor_6_DESC:0 "§4"How can I heal you today?"§!\n\nBasing her stage presence off a story about some robot out west, Nurse Maia is a shortstack who misses her old job at Site XXX before Freak Horrigan came along. However, she does have some skill with medicine and is too concerned about where things will go to protest. Protesting might also lead to Freak Horrigan's ire...."
FRK_friendly_nurse_trait:0 "Friendly Nurse"

FRK_advisor_7_NAME:0 "Lois Cosmos"
FRK_advisor_7_DESC:0 "§4"I've got a lot to say about all this."§!\n\nBorn and raised in Omaha, Lois seemed to just vanish one day- in reality, she took a job at Site XXX due to being young and needing the money. This turned out super well for her, as it led Lois to crossing paths with not only her husband Ventura, but also Freak Horrigan. In some ways, she's become the minder for Horrigan's missing of social cues."
FRK_film_critic_trait:0 "Everyone's a Critic"

FRK_advisor_8_NAME:0 "Boobwatcher Say-So"
FRK_advisor_8_DESC:0 "Her parents being tribals who left her nothing but her name, Say-So swore that she would do better than being stuck on the streets with nothing but her name. Freak Horrigan changed everything for her, finally allowing her to move on from her old career to one that suited her mind much more. Now, what village did her parents hail from?"

FRK_advisor_9_NAME:0 "Long Dick Johnson"
FRK_advisor_9_DESC:0 "§4"Nobody's dick is that long- except mine."§!\n\nA newphew of Cao Guolong's, Johnson wasn't necessarily interested in the family river trade. In fact, he has regularly appeared in various Site XXX productions, but Freak Horrigan finds his boat skills far more valuable than his girth or length. It's not the size, it's how you use it, but Horrigan doesn't seem to care."

FRK_advisor_10_NAME:0 "Morgan Wolcott"
FRK_advisor_10_DESC:0 "§4"GET ME AWAY FROM ME YOU CRAZY BITCH!"§!\n\nA distant relation to a notable individual in Chicago, Morgan crashed just to the east of Omaha. The Freakclave found and saved his life, but his freedom is now gone until Freak Horrigan earns that redemption in Eden's eyes- something Wolcott highly doubts will happen."

