  EHT_thunderbird_dissent:0 "Невдоволення Тандерберда"
  EHT_thunderbird_dissent_desc:0 "Боягуз думає, що житиме вічно, якщо триматиметься осторонь бою; але старість не робить перемир'я, навіть якщо його списи пощадять.\n\nТандерберд і надалі збиратиме воїнів до себе, поки лідерська криза не вирішиться. Але він – чортів великий воїн."

  EHT_the_devils_of_utah:0 "Дияволи Юти"
  EHT_the_devils_of_utah_desc:0 "§gБагато хто вважає Вісімдесятників послідом світу, дияволами Юти!§!\n\n§GЯкщо хтось звільнить захоплену ними територію без її анексії, їх вважатимуть рятівниками!§!"

  EHT_the_sacred_garage:0 "Священний Гараж"
  EHT_the_sacred_garage_desc:0 "За роки на відкритій дорозі Вісімдесятники накопичили немало пального й запчастин для війни."

  EHT_the_sacred_garage2:0 "Святий Храм"
  EHT_the_sacred_garage2_desc:0 "Землі навколо Арагоніту колись були звалищем отруйних відходів Старого Світу. Але якщо відправити туди рабів, можна витиснути з них багато корисного."

