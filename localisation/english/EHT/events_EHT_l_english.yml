l_english:
nf_80s.111.t:0 "Завершення I-80"
nf_80s.111.d:0 "Північна частина траси I-80 опинилася в руках Міста Сховища. Вони були прихильно налаштовані до нас у минулому — можливо, настав час вимагати контроль над нашими законними землями?"
nf_80s.111.a:0 "Запропонувати захист в обмін на землю."
nf_80s.111.b:0 "Це не варте нашого часу."

nf_80s.1.t:0 "Оаза"
nf_80s.1.d:0 "Вісімдесятники втекли на схід після нападів [NCR.GetName] на їхню базу. Нарешті, вони знайшли дім біля довоєнного містечка Вендовер. Завоювавши це містечко, Вісімдесятники мусили зробити вибір.\n\nЗвідси вони правили з відвагою та величчю.\n\nПослухайте про героїчні кампанії наших водіїв."
nf_80s.1.a:0 "Такою є поведінка, що надихає..."
nf_80s.1.b:0 "...і веде до влади серед людей повсюди."

nf_80s.2.t:0 "Суперечка"
nf_80s.2.d:0 "Це був сонячний, але холодний день, коли почались перегони. Перед стартом Громоптах і Прапороносець стояли перед натовпом на дахах своїх автівок. Незвично, але Громоптах зажадав внутрішню смугу, заявивши про свої нещодавні перемоги. Прапороносець відповів, що ця смуга належить йому по праву. Суперечка переросла в священний двобій слів, частина якого збережена нашими полоненими писарями.\n\nЯк сказав Громоптах,\n"Слизький, дрібний кріт, за півсклянки в рабстві,\nБоягуз, що й п’яницю не вартий присяги.\nХанаанські купці кличуть тебе — цілуй їм сраку,\nТобі не місце серед справжньої браги.\nТи молишся про колу і ще вина ковток,\nП’яніше за всіх в Ріно далеким потоком.\nЖаль тим жінкам, що тебе відбивали,\nЧи ти вождь? Ха! Ми ж усі реготали."\n\nТа Прапороносець був непохитний:\n"Пихатий Горобчику, про що твоє бахвальство?\nТи лише вдаєш, що пишеш ці брехні.\nБрудноротий бунтарю, ти падаєш в змаганні,\nА пісні мої — це хроніки моїх тріумфів і війни.\nТи — пасажир, пан лише за столом,\nЗадній водій, іди геть із шляху мого грома!\nПолиш римування, немов бур’яну брехні —\nТвій драндулет хіба здатен йти на швидкості?"
nf_80s.2.a:0 "Громоптах заслуговує внутрішню смугу."
nf_80s.2.b:0 "Прапороносець говорить правду."

nf_80s.3.t:0 "Те, що ми лишили"
nf_80s.3.d:0 "Чоловік до чоловіка, авто до авто — Республіка ніколи не зрівнялася з героями Вісімдесятників. Ми були бардами автострад, вільними вершниками просторів. Але НКР спалила наш кукурудзяний бензин, знищила дороги, якими ми їхали, і була надто чисельною, щоб її зупинити. Ми рушили на схід, шукаючи простору землі вздовж дороги, яку вшановували.\n\nДехто з племені досі мріє повернутися на захід. Але гляньте, як ми розквітли на сході! Навіть у вигнанні, ми тероризували союзників НКР під час Великого Відступу через Неваду. Сто історій страху і поваги шепочуть ті, хто бачив нас, а тисяча легенд про нас самих — про Війну Доріг Невади. Тож дозвольте мені розповісти, як Вісімдесятники..."
nf_80s.3.a:0 "Викрали науковців із Міста Сховища."
nf_80s.3.b:0 "Викрали механіків з автомайстерень Нового Ріно."
nf_80s.3.c:0 "Завербували рейдерських братів у дорозі."

  #########################
  nf_80s.4.t:0 "Війна Доріг Юти"
  nf_80s.4.d:0 "Покалічена, кульгава, наша нація лежала в руїнах. Безчесна НКР розгромила нас у Сак-Сіті: вони прийшли зі зброєю, вибухівкою, полум’ям і сталлю. Вони вбили наших найвідважніших воїнів і найшанованіших громадян. Старійшин і дітей. Минуле і майбутнє. Але відтоді, як ми прибули до Юти — ми торжествували!\n\nНаш улюблений вождь у своєму авто,\nлежить на місці водія —\nВеликий Дарувальник Бензину.\nЧужоземні скарби\nнакладені на нього, і коштовне спорядження.\nЯ ще не чув про машину так добре споряджену,\nбойовим залізом, потужною зброєю\nта мішками з кришками.\n\nНехай славу здобуде кожен, хто зможе — до самої смерті."
  nf_80s.4.a:0 "Геть [NCN.GetName]!"
  nf_80s.4.b:0 "[WHT.GetName] — наші давні вороги."
  nf_80s.4.c:0 "Доля йде, як завжди йшла."

  #########################
  nf_80s.5.t:0 "Грабери Кричать 'Шотган!'"
  nf_80s.5.d:0 "Грабери билися завзято, але не змогли зупинити Вісімдесятників. Розчавлені нашими Дорожніми Воїнами, їхній лідер — наш полонений. Та грабери — це вільні душі, що ненавидять НКР і все, що вона створила — як і ми. Королева Квінна, одна з ватажків, готова скласти присягу на вірність нашій справі. Інші ж воліли б просто вільно користуватись нашими шляхами, працюючи на нас. Не кожен може бути Воїном Дороги.\n\nІ ось [EHT.GetLeader] став перед новими підданими,\nНепохитний, стоячи на своєму авто,\nІ проголосив: «Той, хто має відвагу і гострий розум, зважить два: слова і діла.\nЯ вірю вашим словам —\nви будете слугами своїх нових володарів.»"
  nf_80s.5.a:0 "Ми пасажири в твоєму автобусі."
  nf_80s.5.a_tt:0 "\nВідкриває нового радника, який підвищить виробництво зброї!\n"
  nf_80s.5.b:0 "Ми даруємо вам лише дружбу."
  nf_80s.5.b_tt:0 "\nВідкриває нового радника, який підвищить промисловість!\n"

  #########################
  nf_80s.6.t:0 "Їздячи по Рубіновій Долині"
  nf_80s.6.d:0 "Притулок Рубінової Долини був заснований боягузами, яких ми змітали під час війни доріг у Неваді. Вони втекли, але нашою перемогою ми довели: втекти — не значить вціліти.\n\nДвоє наших водіїв відзначились. Фуріоза утримала позиції проти переважаючих сил, а майор Калашніков гнав людей крізь ніч, щоби вдарити по відкритих рубежах. Кого ми вшануємо?"
  nf_80s.6.a:0 "Фуріоза боронитиме нашу нову імперію."
  nf_80s.6.a_tt:0 "\nВідкриває нового військового радника, що підсилює оборону!\n"
  nf_80s.6.b:0 "Майор не дасть зупинитись."
  nf_80s.6.b_tt:0 "\nВідкриває нового військового радника, що підсилює швидкість!\n"

  #########################
  nf_80s.7.t:0 "Герої Гаммонда"
  nf_80s.7.d:0 "Захопити Гаммонд було непросто, але двоє наших Старійшин дали нам цінні поради. Вітропів вів нас покинутими стежками, а Каміненіг показав переваги... маршу! Обидва пропонують стратегії для нових територій. Вітропів хоче впровадити нову систему данини, Каміненіг — використати жителів Істпорта як рабів."
  nf_80s.7.a:0 "Вітропів, твоя мудрість сяє!"
  nf_80s.7.a_tt:0 "\nВідкриває §MВітропіва як радника.§!\n"
  nf_80s.7.b:0 "Каміненіг правий — зробимо Істпорт нашими рабами."
  nf_80s.7.b_tt:0 "§MВідкриває Каміненога як радника§!.\n"

  #########################
  nf_80s.8.t:0 "Гараж Істпорта"
  nf_80s.8.d:0 "Падіння Істпорта надихнуло наш народ на великі думки. Великий Ведмідь сконструював систему, що перетворює кукурудзу і зерно на паливо. Девісон розробив спосіб встановити більше зброї на наші тачки. Готуйтесь до Шляху Люті, Нова Каліфорніє! Але обрати можемо лише одне."
  nf_80s.8.a:0 "Паливо понад усе — Великий Ведмідь має рацію."
  nf_80s.8.a_tt:0 "\nВідкриває радника, який знижує втрати в пустелі.\n"
  nf_80s.8.b:0 "Не дочекаюсь робити вілі у Тінявому Піску!"
  nf_80s.8.b_tt:0 "\nВідкриває радника, який підсилює атаку.\n"

  #########################
  nf_80s.9.t:0 "Вісімдесятники наступають!"
  nf_80s.9.d:0 "Розвідники Вісімдесятників наблизились до кордону під картатим прапором війни. Що нам робити?"
  nf_80s.9.a:0 "Якщо Бог із нами — то хто проти нас?"
  nf_80s.9.b:0 "Тікааай!!!"

  #########################
  nf_80s.10.t:0 "Новокананці втекли!"
  nf_80s.10.d:0 "Дурні Кананці втекли. Ми б їх і так обігнали (бо в нас є тачки, гм), але краще просто пограбуємо їхні землі."
  nf_80s.10.a:0 "Красота!"

  #########################
  nf_80s.11.t:0 "Юта дає відсіч!"
  nf_80s.11.d:0 "Вони насмілились протистояти Вісімдесятникам. Вони заплатять за це дорого."
  nf_80s.11.a:0 "Вони про це пошкодують."
  eht_activate_escalation_decision:0 "Активує можливість ескалації прикордонної війни."

  #########################
  nf_80s.12.t:0 "Вісімдесятники перемогли!"
  nf_80s.12.d:0 "Набіг завершено. Ми оплакуємо мертвих, але пам’ятаємо: якщо живемо — то для Господа, якщо вмираємо — то також для Нього. Тож, чи живі ми, чи мертві — належимо Йому."
  nf_80s.12.a:0 "Блаженні ті, хто плачуть — бо вони будуть утішені."

  #########################
  nf_80s.13.t:0 "Прикордонний рейд ескалує!"
  nf_80s.13.d:0 "Це вже не просто прикордонна сутичка. І не рейд. Це повномасштабна війна за кордон. І не всі її переживуть."
  nf_80s.13.a:0 "Погнали!"

  #########################
  nf_80s.14.t:0 "Вісімдесятники тріумфують!"
  nf_80s.14.d:0 "Ще один палаючий храм, ще одне розбите місто. Вісімдесятники знищили Нью-Ханаан, а наші загиблі їдуть трасою в небо. Майбутнє ще ніколи не здавалося таким світлим."
  nf_80s.14.a:0 "Ще одна гарна дорожня мандрівка."

  #########################
  nf_80s.15.t:0 "Ми відігнали Вісімдесятників!"
  nf_80s.15.d:0 "Великими зусиллями ми відкинули Вісімдесятників назад у їхні пустельні домівки. Можливо, більше вони не повернуться... принаймні — не скоро."
  nf_80s.15.a:0 "Схоже, вони таки натисли на гальма!"

#########################
nf_80s.16.t:0 "Ми програли!"
nf_80s.16.d:0 "Підступні ханаанці змогли відбити наших вояків, засипаючи сіль у наші баки, розкидаючи шипи на дорогах і, головне, відмовляючись помирати. Ми ще повернемось. Можливо."
nf_80s.16.a:0 "Чесно, чому ми просто не вторглися в Каліфорнію?"

#########################
nf_80s.17.t:0 "Відміна нападу!"
nf_80s.17.d:0 "Вісьмдесятники тримаються на мобільності. А якщо ханаанці окопалися там, де ми не можемо їх обійти — немає сенсу в цій атаці."
nf_80s.17.a:0 "Навіщо ми атакували одну державу після попередження?"

#########################
nf_80s.18.t:0 "Варвари біля воріт"
nf_80s.18.d:0 "Знову Вісьмдесятники перемогли. Але загиблі знайдуть розраду в обіймах Господа."
nf_80s.18.a:0 "Кожен, хто вірує, не загине."

#########################
nf_80s.19.t:0 "Вісьмдесятники поїхали!"
nf_80s.19.d:0 "Ми не знаємо чому, але Вісьмдесятники втекли. Тобто, поїхали. Вибачте."
nf_80s.19.a:0 "Сподіваюся, вони не повернуться."

#########################
nf_80s.20.t:0 "Навіщо йти, якщо можна їхати?"
nf_80s.20.d:0 "[EHT.GetLeader] прибув до нас із пропозицією. Навіщо воювати, якщо разом — ноги Білоногих і швидкість Вісьмдесятників — утворюють смертельну комбінацію? Разом ми спалимо Новий Ханаан!"
nf_80s.20.a:0 "Разом ми сильніші."
nf_80s.20.b:0 "У них немає честі."
nf_80s.20.b_tt:0 "Вісьмдесятники, ймовірно, сприймуть це як привід для війни проти вас!"

#########################
nf_80s.21.t:0 "Білі Ноги відкинули наш союз!"
nf_80s.21.d:0 "[WHT.GetLeader] знехтував нашою пропозицією та знищив машину з посланцем, ображаючи наших людей. Як він посмів змусити нас іти пішки додому? Можливо, він змінить думку, коли його череп буде прикрашати наш капот."
nf_80s.21.a:0 "Зроблю вілі на їхніх похоронних пагорбах."
EHT_whitelegs_spurned_alliance:0 "Білі Ноги знехтували Вісьмдесятниками"

#########################
nf_80s.22.t:0 "[WHT.GetLeader] отримує новеньку машину!"
nf_80s.22.d:0 "[WHT.GetLeader] погодився вислухати наші умови. Наші посланці привезли йому дорогоцінного «Шосейника», збереженого з довоєнних часів. У відповідь він подарував нам рабів і їхню коштовну фарбу. Каже, білі смуги зроблять наші машини швидшими."
nf_80s.22.a:0 "Можливо, він і справді мудрий."

#########################
nf_80s.23.t:0 "Імперія Солі"
nf_80s.23.d:0 "Білі Ноги та Вісьмдесятники разом можуть стати грізною силою. Але союз із тими, хто боїться ходити пішки, — це, можливо, занадто. Якщо ми зараз образимо Вісьмдесятників — вони стануть небезпечними ворогами, але ми збережемо єдність племені."
nf_80s.23.a:0 "Створімо силу, якої б злякався сам Цезар."
nf_80s.23.b:0 "Ні."
nf_80s.23.b_tt:0 "Вісьмдесятники, ймовірно, сприймуть це як привід для війни проти вас!"

#########################
nf_80s.24.t:0 "Випробування вірних"
nf_80s.24.d:0 "Вавилоняни, греки, римляни, американці — всі вони переслідували Божих людей батогами й мечами, бомбами та кулями. І тепер прийшли Вісьмдесятники та Білі Ноги. Але не бійтеся! Бо якщо з нами Бог, то хто проти нас?"
nf_80s.24.a:0 "Народ Божий вистоїть."
nf_80s.24.a_tt:0 "§g\nВізьміть повне озброєння Боже, щоб протистояти підступам диявола. - Ефесян 6:11\n\n[NCN.GetName] отримає підвищення бойового духу!§!"

#########################
nf_80s.25.t:0 "Дорога до сумнівного союзу"
nf_80s.25.d:0 "У світі, зраненому руїнами минулого й жорстокістю сучасності, Новий Ханаан стоїть на роздоріжжі. Загроза від [WHT.GetLeader] зростає, мов оповідь про стародавнє поневолення. У цей тривожний час Вісьмдесятники простягають руку співпраці. Чутки твердять, що вони відмовляються від грабіжницького минулого. Це щире перетворення чи черговий маневр задля домінування? Шанс розпізнати їхні справжні наміри, але шлях повен небезпек."
nf_80s.25.a:0 "Обережно вступити в перемовини"
nf_80s.25.b:0 "Сумніватися в їх щирості й бути напоготові"
nf_80s.25.b_tt:0 "Це може розгнівити Вісьмдесятників."

#########################
nf_80s.26.t:0 "Обережна відповідь Ханаану"
nf_80s.26.d:0 "Новий Ханаан, обережно ставлячись до відомого минулого Вісьмдесятників, погодився вислухати їхнє попередження про Білоногих і розпочав перемовини. Проте вони поки що не підписують жодних угод, посилаючись на історію насильства Вісьмдесятників як на головну перешкоду довірі."
nf_80s.26.a:0 "Визнати їхню обережність"

########################
nf_80s.27.t:0 "Рішуча позиція Нового Ханаану"
nf_80s.27.d:0 "Новий Ханаан, зрозумівши справжні наміри Вісьмдесятників за пропозицією союзу, рішуче її відкинув. Їхні посли були повернуті разом із примірниками Писання — чіткий знак відмови від покори під личиною партнерства."
nf_80s.27.a:0 "Але ми все одно їх уб’ємо."
NCN_canaanites_spurned_alliance:0 "Ханаанці знехтували Вісьмдесятниками"

#########################
nf_80s.28.t:0 "Поромна лінія"
nf_80s.28.d:0 "Хоча мало хто наважується плисти Великим Солоним Озером, Вісьмдесятники домовилися про відкриття поромної лінії. Це полегшить торгівлю та захистить пасажирів від племінних нападів. Вісьмдесятники обіцяють навіть перевозити транспортні засоби — за скромну додаткову плату."
nf_80s.28.a:0 "Уперед, до прогресу!"

#########################
nf_80s.29.t:0 "Нерівний договір озера"
nf_80s.29.d:0 "У тіні острова Антилопа, серед безкрайніх солоних вод, [EHT.GetLeader] та [NCN.GetLeader] зібралися, щоб вирішити долю своїх народів. До подиву Нового Ханаану, запропонована угода значно вигідніша Вісьмдесятникам, даруючи їм економічну перевагу в обмін на захист, що більше схожий на завуальовану загрозу. Новий Ханаан стоїть перед гірким вибором: прийняти умови, що загрожують добробуту, чи наражатися на гнів могутньої сили."
nf_80s.29.a:0 "Неохоче прийняти суворі умови"
nf_80s.29.b:0 "Відмовити та готуватись до відплати Вісьмдесятників"

#########################
nf_80s.30.t:0 "Суходолом і небесами"
nf_80s.30.d:0 "Зона 51 світиться вночі над пустелею Невади — неприродним синім, що пробирає до кісток усіх, хто наближається. Ніхто не знає, чому нещадні Повелителі Неба вбивають чи чого прагнуть, але всі чули легенди: про сірих істот із-поза зірок, про літаючі тарілки, про гібридів людини з когтем смерті. Та [EHT.GetLeader] готовий співпрацювати з ними. Можливо, в руїнах Каліфорнії знайдуться відповіді. А якщо Повелителі Неба відмовлять — ну, тоді Вісьмдесятники їх просто знищать."
nf_80s.30.a:0 "Запропонуємо їм небо, якщо залишать нам землю."
nf_80s.30.b:0 "Цей НЛО був би гарним капотним трофеєм."
earth_and_sky_faction_tt:0 "\nФормує фракцію §M«Земля і небо»!§!"

#########################
nf_80s.31.t:0 "Ревіння у Рубі-Веллі"
nf_80s.31.d:0 "Рубі-Веллі став прихистком для багатьох, хто втікав від Білоногих. Але коли [EHT.GetLeader] готує свій народ до величі, він усвідомлює, що їм потрібні нові ресурси для просування вперед. Люди з Рубі-Веллі — чудова, стигла здобич."
nf_80s.31.a:0 "Оце буде веселощі."
#########################
nf_80s.32.t:0 "Звільнення Вісімдесятників!"
nf_80s.32.d:0 "Наша безкорисливість у перемозі над Вісімдесятниками зробила нас рятівниками у очах людей Пустки! Вісімдесятники були пошестю Юти впродовж багатьох років — а тепер? Завдяки нам, вони лиш спомин. Дехто вважав, що ми просто узурпуємо їхню владу — але, утримавшись і повернувши владу підкореним, ми показали свою відданість потребам Пустки."
nf_80s.32.a:0 "Народ нас любить!"
#########################
nf_80s.33.t:0 "Доля Сак-Сіті"
nf_80s.33.d:0 "Наші підлеглі — Вісімдесятники — просять повернути їхню прадавню батьківщину, Сак-Сіті. Це був би щедрий жест — але з іншого боку, чи потрібна нам ще їхня допомога, якщо ми вже пануємо над Новою Каліфорнією?"
nf_80s.33.a:0 "[CES.GetLeader] щедрий до друзів."
nf_80s.33.b:0 "Анітрохи!"
#########################
nf_80s.34.t:0 "[CES.GetLeader] відмовив!"
nf_80s.34.d:0 "Легіон відмовився повернути нам батьківщину. На жаль, наші можливості обмежені — адже тепер вони правлять Новою Каліфорнією й Аризоною."
nf_80s.34.a:0 "Це жахливо."
#########################
nf_80s.35.t:0 "Ми підемо своїм шляхом"
nf_80s.35.d:0 "Напруження між [EHT.GetLeader] і Громовим Птахом досягло межі. Вони зустрілися на трасі Вендовера, щоб обговорити майбутнє племені. Флагмен почав із переліку своїх славних діянь —\n\nМи мчали разом, доки не дістались зупинки.\nПеред нами постав він — осяяний золотом.\nІншої такої будівлі не було.\nТам жила слава наша,\nІ її світло сяяло на багато земель.\n\nАле Громовий Птах нагадав про кривди, що Вісімдесятники зазнали —\n\nДобрі часи були для нашого люду,\nаж поки Танді, демон із пекла,\nне почала плести зло у світі."
nf_80s.35.a:0 "Попкорн, будь ласка."
#########################
nf_80s.36.t:0 "У Долині Смерті"
nf_80s.36.d:0 "Пробігти територію Райперултів виявилося простіше, ніж ми гадали. Райперулти, особливо їхній ватажок Фейс-Мешер, відомі тим, що п’ють кров — лиш крок до канібалізму! Подейкують, що вони навіть послали своїх агентів у божевільний культ із Середнього Заходу — «Рух Жнеця», що б це не було.\n\nІз цієї кампанії ми чули дві історії. Яоґі, більш знаний як «Маленький Ведмідь», молодший брат Великого Ведмедя, виявив хист дипломата й переконав групу вояків перейти на наш бік.\nІнший — це Меха Нік, рейдер із Металевих Пащ, тих, хто їздив рівнинами Монтани. Як досвідчений мародер, він допоміг оточеним байкерам без зброї й припасів — прокрався вночі й зібрав спорядження з трупів. Обоє варті слави — але лише одного ми можемо вшанувати, згідно з Кодексом Дороги."
nf_80s.36.a:0 "Яоґі. Нам конче потрібні дипломати."
nf_80s.36.b:0 "Меха Нік. Винахідливість — у нас у крові."
#########################
nf_80s.37.t:0 "Назад шляху нема"
nf_80s.37.d:0 "Знесилений після годин дебатів, [EHT.GetLeader] запропонував компроміс —\n\nЗнову ти кажеш,\nщо хочеш свободи?\nЦе твоє право —\nЖити, як відчуваєш.\nАле грім гримить лише під дощем,\nА гравці люблять тебе, коли ти граєш.\nІди своїм шляхом,\nНазви це ще одним самотнім днем."
nf_80s.37.a:0 "Попкорн!"
#########################
nf_80s.38.t:0 "Світ обертається"
nf_80s.38.d:0 "Можливо, натхнений словами [EHT.GetLeader], Громовий Птах став поступливішим —\n\nВсі кажуть, що я неправий,\nА я просто хочу додому.\nМоже, я неправий, але хто скаже, що правильно?\nЯ просто хочу їхати крізь ніч.\nЯ поведу першу машину додому,\nНе знаю, навіщо ми сюди прийшли.\n\nТи бачив мене залиплим у крові ворогів,\nКоли я бився з супермутантами,\nНападав на табір Білоногих і в нічній поїздці\nвирізав Вольтників. Я витерпів крайнощі\nі помстився за народ.\nТепер я кину виклик [NCR.GetLeader],\nщоб вирішити долю в поєдинку."
nf_80s.38.a:0 "Час вибору."
#########################
nf_80s.39.t:0 "Шлях Героя"
nf_80s.39.d:0 "Після Сварки Громовий Птах присягнув здійснити Велику Поїздку через Пустку, щоб здобути знаряддя для походу на захід. Він в’їхав у Темне Чикаго, пройшов під поглядом вмираючого бога, торгувався з героєм минулого і ризикував життям заради людей. Багато разів він ледь не загинув; але:\n\nЧасто того, хто хоробро тримається,\nдоля щадить, якщо він їй не приречений."
nf_80s.39.a:0 "Він здобуде славу або загине!"
nf_80s.39.b:0 "Я здобуду славу або загину!"
#########################
nf_80s.40.t:0 "Грім і Блискавка"
nf_80s.40.d:0 "[ROOT.GetLeader], маємо звістку від Вісімдесятників! Громовий Птах, один із найсильніших їхніх воїнів, кинув виклик лідерові — у поетичному двобої та перегонах. Він, схоже, хоче повернути свій народ до Сак-Сіті й проїхати крізь наші землі. Можна було б посміятись — але минулого разу загинуло чимало, а зараз він мандрує Пусткою, шукаючи зброю для кривавого походу."
nf_80s.40.a:0 "[Root.GetName] стоятиме міцно!"
nf_80s.40.a_tt:0 "§R\nЗійшов із доріг,\nкрізь фари високі —\nбогопроклятий Громовий Птах увірвався.§!"
#########################
nf_80s.41.t:0 "Змій-Світ"
nf_80s.41.d:0 "Гадюки приносять жертви своїм богам у ямі, під керівництвом [VIP.GetLeader]. Та [VIP.GetLeader] відмовилась ділитись своїми знаннями й глузувала з Громового Птаха. «Що я маю зробити, щоб довести себе?» — спитав той.\n\nПідступна й хитра жінка, [VIP.GetLeader] наказала йому провести ніч у Ямі, сп’янівши від священної отрути. «Усі, хто хоче приєднатись до племені, проходять це випробування; маєш право робити більше?»\n\nІ от Громовий Птах спустився в яму, п’яний від отрути, і побачив їхні священні сни.\n\nПершого дня він не вийшов — і вони сміялись. Другого дня його не знайшли — і він сміявся. А третього дня він виринув із ями, змії обвивали його руки.\n\n«Я бачив авто, біля моря.\nУ Тіньових Пісках воно стоїть,\nдвері на захід.\nКапає отрута\nкрізь шибки,\nа довкола дверей\nзвиваються змії.»"
nf_80s.41.a:0 "Громовий Птах пізнав їхні звичаї!"
nf_80s.41.b:0 "Гадюки надсилають воїнів!"
nf_80s.41.b_tt:0 "До Оази прибувають три елітні загони Гадюк — добре споряджені й готові до служби.\n"

#########################
nf_80s.42.t:0 "День як Кігть Смерті"
nf_80s.42.d:0 "Розповідають, що Громовий Птах подався до Шакалів, поїдачів мертвих. Прийшов він до них, коли ті лагодили зброю, і вистрелив з доброго гвинта, здобутого в рейді на Середній Захід. І здалося Шакалам, що зброя ця значно краща. Вони захотіли купити її. А Громовий Птах призначив таку ціну: «Хто бажає — хай віддасть стільки, скільки вважає за справедливе.»\n\nКожен із Шакалів вистрілив у свого брата, і в повітрі спалахнули бризки сонячної крові. Тіла Шакалів попадали на землю.\n\nГромовий Птах переступив через мертвих — і ввійшов у їхнє село.\n\n«Хіба не бачите, — сказав він, — якою є справжня ціна скарбів? Краще день бути кігтем смерті, ніж тисячу років шакалом.»"
nf_80s.42.a:0 "Їхня підступність стане нам у пригоді."
nf_80s.42.b:0 "Здобудьмо більше воїнів."
nf_80s.42.b_tt:0 "До Оази прибувають три елітні, добре споряджені загони Шакалів.\n"
#########################
nf_80s.43.t:0 "Крадіжка в ельфів"
nf_80s.43.d:0 "Розповідають, що Громовий Птах шукав мудрості й сили, і прийшов до стародавнього святилища в пустелі Невади. Він і його вірні люди вчинили там бій із ельфами та людьми, що їм поклонялися. Кажуть, зорі впали з неба, палаючі списи розривалися парою, і полум’я здіймалось аж до самого небесного мосту — що згорів дощенту. І останнім, хто помчав тією дорогою, був Громовий Птах."
nf_80s.43.a:0 "Могутній воїн — і вчинок не менший."
#########################
nf_80s.44.t:0 "Замкнений гараж"
nf_80s.44.d:0 "То був справжній трофей, який Битво-Сміливий Громовий Птах поклав перед ними — під гаражем. Від Останнього Пірата Саскачевану він украв швидкі й вірні машини, заховані в кризі лігва гуль-монстрів. Зброя ця куди краще послужить героям, аніж у землях тролів і Зламаного Холоду..."
nf_80s.44.a:0 "Використаємо їх із честю!"
nf_80s.44.a_tt:0 "\nІз канаданських земель Громовий Птах викрав вісімдесят довоєнних танків. Вони будуть задіяні у нашому поході на захід."
#########################
nf_80s.45.t:0 "Спустити пар"
nf_80s.45.d:0 "І в’їхав Громовий Птах у липку спеку, крізь співи культистів. І, вдягнувшись у вкрадені ризи єпископа, зловісні слова лились із його срібного язика. Щоб утекти, Громовий Птах випробував бойовий запал воїнів проти полум’я їхньої віри. Врятувавшись разом зі своїми присяжними побратимами, він приніс спалах води на пересохлу землю."
nf_80s.45.a:0 "Ці парові ядра нам знадобляться..."
nf_80s.45.a_tt:0 "\nМашини Громового Птаха будуть живитися паровими ядрами."
#########################
nf_80s.46.t:0 "Дорога на Схід"
nf_80s.46.d:0 "Мати доручила Громовому Птаху доправити пакунок до Монтани — вантаж плазми й золота для індіанської королеви.\n\nПроти Братства він фарбував списи кров’ю і машини — іржавим від крові залізом,\nгнав крізь палаючий пил і кляті вітри.\nЗавантажений громом, із блискавичною зброєю в руках,\nвін бився проти лицарів, що несли оновлену зброю Анклаву.\nГромовий Птах гарчав, стискав кермо — під нескінченним небом.\nПовернувшись із Монтани, помчав на захід,\nЧекаючи її прихильності — і ще одного зітхання."
nf_80s.46.a:0 "Поставимо ці гармати на мій хотрод!"
nf_80s.46.a_tt:0 "\nГромовий Птах отримав енергетичну зброю за доставку вантажу з Монтани."