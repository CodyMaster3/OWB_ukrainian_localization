l_english:
  EHT_FURIOSA_NAME:0 "Фуріоза"
  EHT_furiosa_army_chief_desc:0 "§y«Мене викинули, бо вважали, що я нічого не варта. Це зробило мене найстрашнішою сукою північніше Колорадо.»§!\n\nКолись її звали Басса. Її кинули помирати в пустелі, вдруге назвавши марною — спершу через безплідність, а потім, коли втратила руку під час рабської праці. Того дня Басса померла.\n\nМожливо, її життя склалося б інакше, якби її знайшли мормони чи інші племена Юти. Але замість того її знайшов бойовий загін Вісімдесятників, і, вражені її жагою до життя, прийняли до себе. Вона назвалась Фуріозою — як втілення гніву, що прийшло з Пекла.\n\nЇї навчили стріляти, їздити, грабувати — і незабаром вона здобула титул «Гарпія». Сьогодні вона одна з найкращих командирів Вісімдесятників — і безперечно, найлютіша."

  EHT_MAJOR_KALASHNIKOV_NAME:0 "Майор Калашніков"
  EHT_major_kalishnakov_army_chief_desc:0 "§y«Я служив у армії. Я знаю, наскільки гнилою вона була. І вони називають нас монстрами?»§!\n\nКалашніков виріс на фермі в Північній Каліфорнії, поруч із Невадою. Єдина дитина в окрузі, він перейшов із сідла браміна до зброярні, де виробляв набої — так вправно, що його називали «Кульовим фермером».\n\nУ першому ж призові він пішов у армію НКР, служив у новоствореному Моторизованому корпусі, де швидко став лейтенантом, адже його загін стримував байкерські банди Сакраменто — в чому він мав талант.\n\nРоздоріжжя прийшло, коли командир наказав розстріляти відступаючих Вісімдесятників — навіть старих і дітей. Шокований, Калашніков убив офіцера і покинув усе, що будував. Останнім наказом він заявив: хто хоче — тисніть на педаль і вирушайте зі мною у вигнання.\n\nЗ того часу він став одним із найстрашніших командирів Вісімдесятників. Коли Майор веде загін — вороги краще хай починають молитись."

