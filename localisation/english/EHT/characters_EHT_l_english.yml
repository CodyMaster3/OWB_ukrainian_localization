  EHT_MASTER_BLASTER_NAME:0 "Майстер-Бластер"
  EHT_master_blaster_high_command_desc:0 "§y«Все просто: я — мізки, він — м’язи, а разом — краса!»§!\n\nІм’я Майстер-Бластера оманливе, бо це історія про двох.\n\nМайстер — народжений з карликовістю, але з геніальним розумом. Він організував кілька пограбувань у Нью-Рено, доки не став надто помітним і не зник.\n\nБластер — чесний сантехнік з Північної Каліфорнії. Але після того, як його втягнули в одну з афер Майстра, він утратив усе: сім’ю, гроші, репутацію. Відтоді вони разом. Майстер їздить на ньому, як на сідлі. Але Бластер не знає, хто зруйнував його життя. І саме це тримає Майстра живим."

  EHT_TOECUTTER_NAME:0 "Тозріз"
  EHT_toecutter_high_command_desc:0 "§y«Кожен робить те, що треба, щоб вижити. І я вибрав шлях, із яким можу миритись.»§!\n\nОдин з найстаріших Вісімдесятників. Їздив із Флегманом ще в часи, коли вони були просто вуличними бешкетниками в Сак-Сіті.\n\nІм’я отримав за те, що відмовлявся вбивати цивільних — бо сам втратив сім’ю від збройного нападу. Він полював на покидьків: мафіозі з Рено чи рабовласників з Дену. Так він став вуличним месником.\n\nАле це змінилось із часом. Тепер Тозріз — найжорстокіший серед усіх. І що страшніше: такий же розумний, як і кривавий."

  EHT_JEET_NAME:0 "Джіт"
  EHT_DEEPDOG_NAME:0 "Глибокий Пес"
  EHT_WINDWAKER_NAME:0 "Той-що-Кличе-Вітер"
  EHT_windwaker_economic_advisor_desc:0 "§y«У предків можна вчитись. І в перемогах, і в помилках.»§!\n\nКолишня послідовниця Апокаліпсису. Приєдналась до них юною — вони врятували її родину від хвороби. Спершу мріяла стати цілителькою, та захопилась давньою історією. Особливо — Римом.\n\nКоли Вісімдесятники вирушили в Юту, вона пішла з ними — не щоб допомогти, а щоб досягти слави. Вивчала римські колісниці, податкову систему, стратегію — тепер її розум не має рівних.\n\nКоли її війська знищують поселення, вона завжди залишає когось для податків. Вона знає межу між рабством і кріпацтвом — і завжди на неї потрапляє. Вона — Той-що-Кличе-Вітер. І з нею приходить буря."

