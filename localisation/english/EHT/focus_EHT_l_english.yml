l_english:
EHT_focus_nevada_road_war:0 "Дорожня Війна в Неваді"
EHT_focus_nevada_road_war_desc:0 "Найважчий етап вигнання — так звану Дорожню Війну в Неваді — запам’ятали як низку нальотів та нечуваної руйнації, що Вісімдесятники несли з собою, сповнені люті й жаги помсти за втрату рідної землі."

EHT_focus_utah_road_war:0 "Дорожня Війна в Юті"
EHT_focus_utah_road_war_desc:0 "Дорожня війна в Юті стала завершальним етапом їхньої мандрівки. Вони прибули до нового штату й одразу ж продовжили грабувати місцеві племена, доки не знайшли широкі рівнини, що пасували до їхньої дикої їзди."

EHT_focus_thunderbird:0 "Та ти вже виглядаєш, ніби Касадори щоки зжерли"
EHT_focus_thunderbird_desc:0 "Не всі Вісімдесятники раді залишитися в Юті. Громовий Птах, один із найвидатніших воїнів племені, закликає своїх вершників вирушити на захід — до Каліфорнії, щоб забрати свою спадщину. На епічних перегонах і бенкетах він змагається в слові й на колесах із [EHT.GetLeader].\n\nГромовий Птах обзиває старійшину 'страхливим лайном із вульви, приреченим бути слабким. Очі мов пліснява, задниця — як у коліноприклонених. Покайся в своїх жалісливих віршиках і зойках. Мій вихлоп звучить приємніше, ніж твій голос.'"

EHT_focus_the_oasis:0 "Оаза"
EHT_focus_the_oasis_desc:0 "Оаза — вона ж довоєнне місто Вендовер — дозволила Вісімдесятникам нарешті спочити й відновити сили після виснажливого вигнання. Зубами скрегочучи на NCR, але ще слабкі, вони мали зробити вибір."

EHT_ruby:0 "Нова прикраса на капот"
EHT_ruby_desc:0 "Долина Рубі гарно виглядатиме під нашим контролем. Багато хто з її жителів утік від нас під час великого східного перегону — тож час завершити справу."

EHT_focus_ruby_promotion:0 "Рейдери долини"
EHT_focus_ruby_promotion_desc:0 "Долина Рубі далася нам легше, ніж ми думали. Ці лузери навіть не намагалися чинити спротив. Але для наших воїнів це була чудова розминка. Далі — до гідніших цілей!"

EHT_focus_breathe_of_elders:0 "Слова Старійшин"
EHT_focus_breathe_of_elders_desc:0 "Старійшини бачили нашу дорогу з Каліфорнії, повз Ріно, Сховище-Сіті та уламки володарювання Майстра. Можливо, їм є ще чому нас навчити."

EHT_wisdom_next_generation:0 "Мудрість молодих"
EHT_wisdom_next_generation_desc:0 "Молоді знають, як пограбувати караван Сховище-Сіті й виграти партію в Ріно. А ще вони знають, як вести наших людей у бій."

EHT_focus_people_of_the_wind:0 "Люди Вітру"
EHT_focus_people_of_the_wind_desc:0 "Вісімдесятники — найшвидші в Пустках, багато хто з нас став кур’єрами в Неваді. Ми підемо туди, куди веде вітер — і ніхто не стане нам на заваді."

EHT_focus_city_of_banners:0 "Місто Прапорів"
EHT_focus_city_of_banners_desc:0 "Кожен загін Вісімдесятників має свій прапор — на честь Великих Перегонів, що були до Війни. Коли ми піднімемо ці прапори, наше плем’я повернеться, готуючись до шаленого заїзду на захід."

EHT_focus_wisdom_of_the_new_generation:0 "Оптимізм молодих"
EHT_focus_wisdom_of_the_new_generation_desc:0 "Ми багато пережили — але вистояли. А тепер наші діти дивляться в майбутнє з повними баками й повним списком цілей. Щасти, сусіде."

EHT_focus_ready_to_return:0 "Готові повернутися"
EHT_focus_ready_to_return_desc:0 "Нарешті, ми готові повернутися додому. Лишень доробимо кілька справ у сусідстві."

EHT_focus_sedentary:0 "Осісти?"
EHT_focus_sedentary_desc:0 "Дехто ставить під сумнів, чи варто й далі жити колесами, зважаючи на труднощі виробництва автівок у Пустках. Вони лузери, та в цьому є частка сенсу — оселитися."

EHT_focus_wendover_encampment:0 "Табір у Золотих Пагорбах"
EHT_focus_wendover_encampment_desc:0 "Золоті Пагорби — непогане місце для зупинки, але нам слід рухатись на схід, щоб утвердитися в Юті. Бо дім наш — тут, а не на заході."

EHT_focus_wendover_exchange:0 "Обмін у Золотих Пагорбах"
EHT_focus_wendover_exchange_desc:0 "Ми можемо приймати каравани в Золотих Пагорбах, а не покладатись на випадкових торговців. Це лише посприяє торгівлі й добробуту. Можливо, ми здатні на більше, ніж рейди?"

EHT_focus_stable_production:0 "Стабільне виробництво"
EHT_focus_stable_production_desc:0 "Виявилося, що виробляти зброю в одній будівлі значно простіше, ніж у трейлері, який мотається Пустками. Зручно!"

EHT_focus_wendover_outriders:0 "Вершники Вендовера"
EHT_focus_wendover_outriders_desc:0 "Громовий Птах глузує з ідеї захищати Вендовер. Вісімдесятників мають боятись — саме ворогам потрібні форти."
EHT_focus_wendover_outriders_tt:0 "Громовий Птах отримає §Gтри§! §Yмоторизовані дивізії§!, якщо стане лідером."

EHT_focus_wendover_armoury:0 "Розподіл арсеналу"
EHT_focus_wendover_armoury_desc:0 "[EHT.GetLeader] наказує збудувати новий збройовий завод у Золотих Пагорбах — на благо людей. У Вендовері ми можемо працювати для задобрення Громового Птаха, але наш дім — у Неваді."

EHT_focus_wendover_battlements:0 "Рабовласницькі ями Юти"
EHT_focus_wendover_battlements_desc:0 "Юта — суха земля, але вона все ще має, що дати. А рабів завжди можна добрати."

EHT_focus_nomadic_centralization:0 "Централізація кочівників"
EHT_focus_nomadic_centralization_desc:0 "Хоч ми й ніколи не зречемось відкритої дороги, частина наших людей осідає. І це дає нам більше сили та дисципліни."

EHT_windover_gas_station:0 "Заправка"
EHT_windover_gas_station_desc:0 "Золоті Пагорби виросли настільки, що можуть підтримувати невелике паливне депо. Тепер Вісімдесятники можуть заправляти свої машини біопаливом і сонячною енергією.\n\nХоча Громовий Птах усе ще краде ресурси для свого божевільного рейду на захід."

EHT_focus_park_our_cars:0 "Паркуємо тачки"
EHT_focus_park_our_cars_desc:0 "Що більше людей відвідує Вендовер, то більше він стає осердям культури Вісімдесятників. Торгаші торгують апгрейдами й капотними прикрасами, раби з Послідовників лікують рани, а данина від підлеглих сиплеться на столи. Це... приємно."

EHT_hit_the_gas:0 "Втисни педаль!"
EHT_hit_the_gas_desc:0 "Нащо нам осідати? Нехай Громовий Птах готується до великого рейду на захід. Дорога чекає!"

EHT_focus_nomadic:0 "Життя — це траса"
EHT_focus_nomadic_desc:0 "[EHT.GetName] не можуть осісти. Вони мають завершити Велику Дорожню Подорож і взяти під контроль усю торгівлю й трафік уздовж Великого Шосе. Пристебніться."

  #EHT_focus_protect_outlying_war_camps:0 "Protect the War Camps" #Scrapped focus
  #EHT_focus_protect_outlying_war_camps_desc:0 "Many of our war camps are overextended. We should do something to protect them."
  EHT_focus_well_travelled_roads:0 "Стоянки Старих Тачок"
  EHT_focus_well_travelled_roads_desc:0 "Автомобілі набагато складніші за мотоцикли й потребують постійного догляду. На щастя, на автостоянках повно машин у пристойному стані — варто лише трохи підлатати. Дамо їм друге життя!"

  EHT_focus_nomadic_flexibillity:0 "Граві-плити"
  EHT_focus_nomadic_flexibillity_desc:0 "Під час одного з рейдів до Арройо ми знайшли схованку з гравітаційними плитами біля закинутого Chryslus Highwayman. Працюючи від енергетичного чіпа, ці плити дозволяють нашим авто левітувати без виснаження батарей. Завдяки цьому ми можемо долати Пустку, не втрачаючи енергії."

  EHT_focus_camp_craftsmen:0 "Табірні Механіки"
  EHT_focus_camp_craftsmen_desc:0 "Ми можемо заохотити молодь працювати з ремісниками Вісімдесятників. Вони — теж герої, навіть якщо не їздять попереду. Бо що водій без свого механіка?"

  EHT_focus_old_world_arteries:0 "Моторалі Старого Світу"
  EHT_focus_old_world_arteries_desc:0 "Ремонт мотоциклів — важка справа. Втомившись від нескінченного лагодження, наші інженери вирушили в Стерджис — місто, про яке ходять легенди про нескінченні мотоцикли. Там ми й справді знайшли десятки машин, зручно припаркованих навколо колишнього зібрання. Це була одна з наших найкоротших експедицій."

  EHT_focus_camp_weaponsmiths:0 "Зброярі Табору"
  EHT_focus_camp_weaponsmiths_desc:0 "Ми вшановуємо механіків, що ремонтують наші авто, але мусимо визнати — ті, хто створює нам зброю, теж доволі круті."

  EHT_thunderbird_smiths:0 "Прибутки з Рейдів"
  EHT_thunderbird_smiths_desc:0 "Зброярі — це добре. Але ми — нація воїнів. Чому б нам просто не забирати зброю в інших?"
  EHT_thunder_smith_tt:0 "Тандерберд отримає §G4§! §Yзбройових майстерень§! поза мапою, якщо стане лідером."

  EHT_focus_assimilation:0 "Асимілювати Пішоходів"
  EHT_focus_assimilation_desc:0 "Ми давно правимо містами й селами, які платять нам данину. Можливо, серед них є ті, хто вартий приєднатись до наших загонів."

  EHT_focus_ghost_warriors:0 "Примарні Воїни"
  EHT_focus_ghost_warriors_desc:0 "Примарні Воїни приймають образ видатних ватажків Вісімдесятників. Вони імітують міміку полеглих героїв, щоби вселяти мужність серед живих."

  EHT_BE_LAME:0 "Пам’ятник Нашому Народу"
  EHT_BE_LAME_desc:0 "Нас бояться в усій Юті, але ми ще й вправні ремісники — як інакше ми створили б таку зброю? Давайте використаємо здобич із рейдів на будівництво нової майстерні."

  EHT_glory_road:0 "Дорога Слави"
  EHT_glory_road_desc:0 "Хтось хоче осісти. Але справжня свобода — в дорозі. Коли ми їдемо, ми відчуваємо: ми на краю слави."

  EHT_our_parking_lot:0 "Наша Стоянка"
  EHT_our_parking_lot_desc:0 "Кажуть, ми змінились, оселившись у Вендовері. Але те, що ми маємо дім, не значить, що ми втратили свободу. Старі Шляхи — завжди з нами."

  EHT_long_road_home:0 "Довгий Шлях Додому"
  EHT_long_road_home_desc:0 "Ми готові повернутись додому — і скористатись усім, чому навчилися."

  EHT_build_more_roads:0 "Пункти Оплати"
  EHT_build_more_roads_desc:0 "Стягуючи помірні збори з тих, хто перетинає нашу землю, ми зможемо покращити наші дороги."

  EHT_focus_war_for_mountains:0 "Війна за Гори"
  EHT_focus_war_for_mountains_desc:0 "Щоби вдарити по ворогу, нам треба освоїти бездоріжжя. Оснастимо найкращі загони всюдиходами — і вперед."

  EHT_faith_in_the_roads:0 "Культура Смертельного Заїзду"
  EHT_faith_in_the_roads_desc:0 "Смертельний Заїзд — не просто ритуал, а релігійний досвід. Перемоги у двобоях, перегони на трасах — усе це приносить славу й зближує душу з машиною."

  EHT_retaking_the_road:0 "Повернення на Шосе"
  EHT_retaking_the_road_desc:0 "Перший крок до відновлення нашої влади — повернення I-80. Пора діяти."

  EHT_way_road_warrior:0 "Шлях Воїнів Дороги"
  EHT_way_road_warrior_desc:0 "Злюка Елвін, Фуріоза та інші — наші герої. Їхні уроки досі надихають."

  EHT_lord_long_road:0 "Будівничі Шляху"
  EHT_lord_long_road_desc:0 "Майже за 200 років I-80 занепало. Настав час ремонтувати."

  EHT_ripe_for_taking:0 "Стигле для Здобичі"
  EHT_ripe_for_taking_desc:0 "Рубінову Долину здобуто — час захопити Райперулт. Сьогодні це — крихта. Завтра — Нью-Рено!"

  EHT_focus_riperult_promotion:0 "Герої Кампанії в Райперулті"
  EHT_focus_riperult_promotion_desc:0 "Віддамо шану тим, хто ризикував заради здобичі."

  EHT_focus_grab_destiny:0 "Вхопити Долю"
  EHT_focus_grab_destiny_desc:0 "Граббери — гідна мішень. Бо те, що моє — моє. А що твоє — обговорюється."

  EHT_grab_luggage:0 "Захопити Багаж"
  EHT_grab_luggage_desc:0 "Здобич із Грабберів стане чудовою нагородою для наших людей! Ні, не для тих хлопців..."

  EHT_swing_north:0 "Удар на Північ"
  EHT_swing_north_desc:0 "Перш ніж рушити на південь, слід вдарити по Нью-Гаммонду. Вони заплатять — просто за саме існування."

  EHT_focus_northport_promotion:0 "Герої Гаммонда"
  EHT_focus_northport_promotion_desc:0 "Нагородимо тих, хто захопив багатства Гаммонда. Невеликі багатства. Брязкальця, насправді. Але тепер вони наші."

  EHT_swing_east:0 "Наїзд на Істпорт"
  EHT_swing_east_desc:0 "Істпорт із його дурною назвою дратує нас уже надто довго. До зброї!"

  EHT_focus_eastport_promotion:0 "Здобич Істпорта"
  EHT_focus_eastport_promotion_desc:0 "Багатства Істпорта послужать нам добре."

  EHT_scientific_vehicles:0 "Майстри Дороги"
  EHT_scientific_vehicles_desc:0 "Нас називають рейдерами, але навіть вони визнають — наші машини — шедеври. Сам старий Chryslus би заздрив нашій майстерності."

  EHT_second_nevada_road_war:0 "Друга Дорожня Війна Невади"
  EHT_second_nevada_road_war_desc:0 "Пора повертатися в Неваду. Ми прокладемо шлях через Каліфорнію й проїдемо нашими машинами по руїнах домів наших ворогів!"

  EHT_faith_i80:0 "Віра у Велику Вісімдесяту"
  EHT_faith_i80_desc:0 "Іти іншим шляхом — це боягузтво. А ще гірше — це безчестя."

  EHT_sack_new_reno:0 "Пограбування Нью-Рено"
  EHT_sack_new_reno_desc:0 "Шрот-майстерні Рено відомі навіть у Юті. Може, ми знайдемо собі власного Chrysalis Highwayman!"

  EHT_new_reno:0 "Зброя Нью-Рено"
  EHT_new_reno_desc:0 "У вцілілих членів сімей багато чого можна навчитись. Можливо, ми навіть знайдемо для них місце у нашому Племені?"
  EHT_new_reno_tt:0 "Відкриває §YNew Reno Arms§! як виробника зброї.\n"

  EHT_modoc_farms:0 "Біопаливо Модока"
  EHT_modoc_farms_desc:0 "Ферми Модока, за допомогою Слаґів, давно годують північ Каліфорнії. Але кукурудзу можна використовувати і як паливо. Не хотіли голодувати — треба було битися краще."

  EHT_core_reno:0 "Нова Сім’я"
  EHT_core_reno_desc:0 "Шрот-майстерня — символ цивілізації Рено. Ми дозволимо родинам керувати містом як нашим васалам."
  EHT_core_reno_tt:0 "Відкриває §YThe Chop Shop§! як виробника машин.\n"

  EHT_road_forbidden_city:0 "Заборонене Місто"
  EHT_road_forbidden_city_desc:0 "Vault City погрожувало нам під час шляху на схід. Час віддати борги з відсотками."

  EHT_vault_city_nerds:0 "Раби з Vault City"
  EHT_vault_city_nerds_desc:0 "Іронія в тому, що тепер жителі Vault City працюють на нас. Даруйте, вони воліють називатись 'слугами'. Гей, слуго! Принеси випивки. І не цього синтегола."

  EHT_vault_city_nerds_tt:0 "Знімає штрафи на призов і будівництво в §YҐекко§! від §YҐекко-АЕС§!.\n"

  EHT_vault_city_citizens:0 "Нові Громадяни"
  EHT_vault_city_citizens_desc:0 "У Vault City завжди був вищий клас. Просто тепер ним керує гідний народ."
  EHT_vault_city_citizens_tt:0 "Модифікатор у регіоні §YҐекко-АЕС§!: \n   §G+15§!£resources_strip|2\n\n"

  EHT_gold_mine_elko:0 "Золоті Рудники Елко"
  EHT_gold_mine_elko_desc:0 "Багатства Елко фінансуватимуть нашу війну. Нам не треба золото, але купа Пустельників за нього готові на все. Люди Шейді-Сендс самі продадуть нам мотузку, на якій ми їх повісимо."

  EHT_vipers_nest:0 "Гніздо Гадюк"
  EHT_vipers_nest_desc:0 "Гадюки зустрінуть наш гнів віч-на-віч. Їхній культ загине під колесами нашої сталі."

  EHT_focus_great_convoy:0 "Великий Конвой"
  EHT_focus_great_convoy_desc:0 "Ми — більше не 'просто' рейдери. Ми — конвой із державою, мобільна армія, що прочісує Пустку! Тихий океан омиє наші колеса, а потім ми обернемось і дізнаємось, наскільки довгою є Вісімдесята!"

  EHT_faith_in_road:0 "Віра в Дорогу"
  EHT_faith_in_road_desc:0 "Не вір нікому, крім Вісімдесятників. І не покладайся ні на що, окрім I-80."

  EHT_raider_refugees:0 "Рейдерські Біженці"
  EHT_raider_refugees_desc:0 "НКР розпорошила рейдерів по вітрах, але з приходом Легіону Шейді-Сендс занадто розтягнуті. Тепер вони стікатимуться до наших стягів, жадаючи сили й здобичі."
  EHT_raider_refugees_tt:0 "Надає загін рейдерів для боротьби на вашому боці."

  EHT_raiders_across_spine:0 "Рейд через Хребет"
  EHT_raiders_across_spine_desc:0 "Усередині НКР вистачає невдоволених. Якщо ми почнемо перемагати, багато хто приєднається до нас."
  EHT_raiders_across_spine_tt:0 "Відкриває можливість викликати рейдерські загони в землях НКР під час їхнього пограбування!"

  EHT_day_jackal:0 "День Шакала"
  EHT_day_jackal_desc:0 "Наші бойові машини вриваються в землі Шакалів, голосно заявляючи про нашу зверхність. Вони підкоряться — або згинуть."

  EHT_rally_the_horde:0 "Розгром Якузи"
  EHT_rally_the_horde_desc:0 "Тандерберди мчать на землі Якузи. Їхні чужинські звичаї падають під нашою залізною навалою. Скоро ніхто не завадить нам повернути наше місто!"

  EHT_home_again:0 "Повернення Додому"
  EHT_home_again_desc:0 "Пора віддячити НКР за все. Ми перетворимо їхній Конгрес на гараж, а над могилою Танді залишимо слід шин. До зброї!"

  EHT_sac_city_blues:0 "§YСолодкий Дім — Каліфорнія§!"
  EHT_sac_city_blues_desc:0 "§YСолодкий дім — Каліфорнія§!\n§5Там небо завжди синє§!\n§YСолодкий дім — Каліфорнія§!\n§6Я люблю повертатись до тебе§!"
  sac_city_blues_tt:0 "Надає постійну локальну §G25%§! знижку на інтеграцію регіонів у §YПівнічно-Східній Каліфорнії§!.\n"

  #EHT_forgotten_route_6:0 "The Forgotten Route Six" #Scrapped different path. Scrapped due the TV-Town area rework.
  #EHT_forgotten_route_6_desc:0 "The I-80 is well defended with great cities dotting its path. But to the south, Route Six goes through the Nevada desert and will take us to Shady Sands itself."
  #EHT_race_rangers:0 "Take out the Desert Rangers"
  #EHT_race_rangers_desc:0 "The so-called guardians of Nevada will soon learn they cannot even defend themselves."
  #EHT_build_i6:0 "Salvage from the Rangers"
  #EHT_build_i6_desc:0 "The Rangers never found a use for these APCs, but we won't make the same mistake. "
  #EHT_area_51:0 "Seize Area 51"
  #EHT_area_51_desc:0 "The Sky Reavers have held onto this secret, eldritch place for too long. There are probably some cars in there we can use."
  #EHT_area_51_hangers:0 "The Hangars of Area 51"
  #EHT_area_51_hangers_desc:0 "The hangers of Area 51 have much we can use. Although we don't understand what many of the buttons do, we now how to use a wrench."
  EHT_focus_utah_road_war_second:0 "Ще Одна Дорожня Війна за Юту"
  EHT_focus_utah_road_war_second_desc:0 "Ми роками рейдували Юту, але тепер настав час справжнього завоювання. Хто нас зупинить? Тар-Волкери? Схилені? Ті диваки з притулку і їхній дурний годинник? Ця земля створена для нас."
  EHT_focus_utah_road_war_second_tt:0 "Надає постійну локальну §G25%§! знижку на інтеграцію регіонів §YЮти§!."

  EHT_focus_desert_living:0 "Закохані у Пустельне Життя"
  EHT_focus_desert_living_desc:0 "Юта стала нашим домом. Було важко, але ми прийняли її. Якщо дорога завоювань змушує нас зупинитися й сповільнити хід — що ж, тут теж є що полюбити. Особливо на захід від Великого Солоного Озера."

  EHT_focus_admit_caravans:0 "Дозвіл Караванам"
  EHT_focus_admit_caravans_desc:0 "Наша політика відкритих воріт для торгівців перетворила Голд-Гіллз на гамірний ринок. Дехто хвилюється за нашу ідентичність, але пляшка капсів говорить голосніше. І хто сказав, що ми не слухаємо логіку?"

  EHT_focus_mineral_deposits:0 "Розробити Родовища"
  EHT_focus_mineral_deposits_desc:0 "Здається, на заході Юти ще повно недоторканих шахт. Мідь, золото й інша хрінь, яку люблять механіки. Схоже, якщо трохи покопати, буде непогана віддача."

  EHT_ally_white_legs:0 "Союз з Білоногими"
  EHT_ally_white_legs_desc:0 "Після того, як Тандерберд забрав кращих дорожніх воїнів, нам потрібно нове м'ясо. Білоногі — досить відчайдушні. У кращі часи ми б навіть не подумали про такий союз, але зараз — можливо, це розумно."

  EHT_propose_alliance_to_white_legs:0 "Надіслати Посольство"
  EHT_propose_alliance_to_white_legs_desc:0 "Ми можемо запропонувати союз Білоногим, надіславши Сіль-на-Ранах хороший дарунок."

  EHT_bridge_the_gap:0 "Збудувати Міст"
  EHT_bridge_the_gap_desc:0 "Через річку Вірджин нема мосту з часів Великої Війни. Але ми можемо це виправити."

  EHT_western_bridgehead:0 "Західний Плацдарм"
  EHT_western_bridgehead_desc:0 "Західний плацдарм допоможе Білоногим..."

  EHT_eastern_bridgehead:0 "Східний Плацдарм"
  EHT_eastern_bridgehead_desc:0 "А ми займемось східною стороною, дякуємо."

  EHT_empire_salt:0 "Імперія Солі"
  EHT_empire_salt_desc:0 "Тар-Волкери й Вісімдесятники об'єднаються, щоб спалити Нью-Ханаан. Це буде паливо для Імперії, що простягнеться від Тихого до Мексиканської затоки. Безкінечна імперія Великої Дороги!"

  EHT_ally_caesar:0 "Вершники Легіону"
  EHT_ally_caesar_desc:0 "Можливо, Вісімдесятники зазнали поразки, бо були самі. Якщо ми хочемо різати імперії, нам потрібні сильні союзники. Такі, що вирвуть серце НКР і принесуть його нам."
  EHT_ally_caesar_tt:0 "§gМи станемо союзником §Y[CES.GetNameWithFlag]§!, але пам’ятайте: це зрештою зробить нас їхнім підданим. Утім, війни ми зможемо оголошувати самі.§!"

  EHT_preparing_the_war_trails:0 "Протоптати Стежки Війни"
  EHT_preparing_the_war_trails_desc:0 "Ми з рішучістю картуємо автошляхи Юти, визначаємо точки дозаправки та спостереження. Війна близько."
  eht_war_trails_tt:0 "Або §Y[NCN.GetName]§! або §Y[WHT.GetName]§!:\n    §Y*§! Війна з нами після наших спроб мирно домовитись\n    §Y*§! Не існує\n    §Y*§! Є маріонеткою когось іншого\nАбо ми в союзі з §YЛегіоном§!."

  EHT_provoke_mormons:0 "Образити Схилених"
  EHT_provoke_mormons_desc:0 "Пора готуватись до війни з мормонами. Їхній мессія міг ходити по воді, але справжні герої їздять на авто."

  EHT_mormons_cant_drive:0 "Заявити Права на Нью-Ханаан"
  EHT_mormons_cant_drive_desc:0 "Наша дорога прокладена. Настав час не просто набігу, а повномасштабного вторгнення — з прапором в центрі їхньої торгової імперії!"
  EHT_mormons_cant_drive_tt:0 "Відкриває прикордонну війну проти [NCN.GetName]."

  EHT_start_your_engines:0 "Запускай Двигун"
  EHT_start_your_engines_desc:0 "Час рушати на війну. Удачі, Юта. Вона тобі знадобиться."

  EHT_tribal_refugees:0 "Племінні Воїни"
  EHT_tribal_refugees_desc:0 "Багато воїнів із племен просяться до нас. Ми з радістю дозволимо їм ловити кулі замість наших хлопців."
  EHT_tribal_refugees_tt:0 "Викликає чотири досвідчені групи племінних воїнів! А чого ти чекав?"

  EHT_provoke_white_legs:0 "Переїхати Білоногих"
  EHT_provoke_white_legs_desc:0 "Ой, не побачив тебе там. Або там. Може, не варто стояти на дорозі, коли ми їдемо через твої мисливські угіддя?"

  EHT_steal_WHT_legs:0 "Шалений Рейд"
  EHT_steal_WHT_legs_desc:0 "Двигуни заведено. Ми запускаємо напад на території Білоногих — кожен кілометр під колесами веде до нашої перемоги."
  EHT_steal_WHT_legs_tt:0 "Відкриває прикордонну війну за Єрихон у Білоногих."

  EHT_reclaim_sac_city:0 "Попросити Сак-Сіті"
  EHT_reclaim_sac_city_desc:0 "Тепер, коли Цезар захопив наші землі, можливо, він поверне нам Сак-Сіті в обмін на допомогу у війні, що дала йому Каліфорнію?"
  EHT_reclaim_sac_city_tt:0 "Якщо хтось із вашої фракції володіє Сак-Сіті, буде надіслано запит на передачу штату."

  EHT_go_it_alone:0 "Йти Самостійно"
  EHT_go_it_alone_desc:0 "Нам не потрібні друзі. Нам потрібні лише піддані, що вирощують зерно для нашого пального."

  EHT_ride_true:0 "§YЇхати по-справжньому§!"
  EHT_ride_true_desc:0 "Після війни Вісімдесятники — безперечні володарі Юти. Їхні бойові машини — фантоми сталі й дизелю — ревуть на автострадах. Вони більше не рейдери. Вони правителі швидкості. Їхня спадщина — в шинах, а доля — в кожному новому кілометрі."
  eht_ride_true_tt:0 "Отримує претензії на всі штати §YЮти§!."

  EHT_cult_of_nas:0 "Почути Слова Нас"
  EHT_cult_of_nas_desc:0 "Культ Нас із Двох Сонць схожий на наші вірування. Хоча вони м’якуваті, й дорогу не зовсім обожнюють, але розуміють Велике Мандрування. Може, ми поїдемо разом? А ще їхні жерці мають подарунки..."

  EHT_ally_mormons:0 "Підкорення Ханаанців"
  EHT_ally_mormons:0 "Підкорення Ханаанітів"
  EHT_ally_mormons_desc:0 "Після того як Тандерберд забрав частину наших кращих воїнів, ми опинилися у скрутному становищі. На щастя, Нью-Ханаан — багате місто з мізерною армією — відкриває перед нами шанс. Замість відкритої ворожнечі ми замаскуємо контроль під 'союз', підштовхнувши їх проти Білоногих і завівши в наші обійми. З часом, здобувши довіру, ми використаємо її на свою користь."

  EHT_propose_mormon_alliance:0 "Фальшивий Союз"
  EHT_propose_mormon_alliance_desc:0 "Під виглядом турботи про їхню безпеку ми заманимо ханаанців у так званий союз. Їхня наївність щодо наших справжніх мотивів дозволить нам скористатися їхнім багатством і стратегічним розташуванням — поки ми готуємося до остаточного підкорення."

  EHT_old_ferry:0 "Прелюдія до Контролю"
  EHT_old_ferry_desc:0 "Західна пристань, під нашим впливом, стає ключовим вузлом у контролі торгівлі Нью-Ханаану. Це не тільки наповнює наші скарбниці, а й затягує петлю на їхній економіці."

  EHT_eastern_dockyard:0 "Використати Західну Торгівлю"
  EHT_eastern_dockyard_desc:0 "Західна пристань під контролем — час з користю використати її можливості. Це стратегічний крок до економічного поневолення Нью-Ханаану, завуальований під 'спільний розвиток'."

  EHT_western_dockyard:0 "Домінація в Східній Торгівлі"
  EHT_western_dockyard_desc:0 "Те, що ханаанці вважають союзом, — лише підготовка до їхнього поневолення. Чим більше вони залежать від нас у торгівлі й безпеці, тим глибше ми вплітаємо свій вплив. Настає мить повного контролю над їхнім добром."

  EHT_join_mormon_alliance:0 "Договір на Озері"
  EHT_join_mormon_alliance_desc:0 "Договір на Озері, хоч і виглядає як пакт взаємної вигоди, насправді є різко однобоким. Нью-Ханаан, спраглий безпеки, надає нам торговельні переваги та поступки. Їхнє відчайдушне прагнення до захисту обернулося для нас блискучою перемогою — без зайвих витрат ми здобули вплив, який готує ґрунт до повного домінування."

  EHT_utah_war_delay_trigger_tt:0 "Якщо ми намагаємось укласти союз з §Y[WHT.GetNameWithFlag]§! або §Y[NCN.GetNameWithFlag]§!, вони повинні або погодитись і вступити до союзу, або відмовити нам."
