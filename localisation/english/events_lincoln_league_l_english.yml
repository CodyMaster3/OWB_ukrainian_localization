l_english:
nf_lincoln_league.1.t:0 "Запрошення до Ліги Лінкольна"
nf_lincoln_league.1.d:0 "Після поразки мутантів на півдні, наше місто-сестра змінило назву й почало організовувати якусь подобу альянсу. Ліга незалежних міст із класичним політичним мотлохом – заохочення торгівлі, договори про взаємну оборону, культурний обмін тощо. Все було б нічого, якби не згадка про їхній план щодо «узгодженої зовнішньої політики», або, простіше кажучи, нашої анексії. Хоча об’єднання під одним урядом має певні переваги, ми не хочемо втрачати свою свободу. З іншого боку, вони серйозно налаштовані, і якщо ми відмовимося від їхньої пропозиції, то можемо опинитися у стані війни з єдиним нашим союзником у цих пустках."
nf_lincoln_league.1.a:0 "Наче у нас є інший вибір."
nf_lincoln_league.1.b:0 "Ми не дамо себе затоптати!"

nf_lincoln_league.2.t:0 "Гарні новини"
nf_lincoln_league.2.d:0 "Гонець повернувся з міста-сестри – і вони погодились на наші умови! Ліга вже розширюється – з такими темпами ми зможемо конкурувати з ТЄС або навіть НКР!"
nf_lincoln_league.2.a:0 "Це саме те, що нам було потрібно."

nf_lincoln_league.3.t:0 "Не вбивайте гінця"
nf_lincoln_league.3.d:0 "Гонець повернувся з нашого міста-сестри – і вони відмовились від нашої щедрої пропозиції! Це нас дуже засмучує, адже вони були хорошими сусідами. Що ж, ми намагались. Готуйте війська, генерале. Ми знову йдемо на війну."
nf_lincoln_league.3.a:0 "Наказати наступ!"