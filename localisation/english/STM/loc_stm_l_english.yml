## Characters

STM_BLINDING_HAIL_NAME: "Сліпий Град"
STM_BLINDING_HAIL_DESC: "Нинішня лідерка Громовказів, Сліпий Град, усунула Мрійну Зорю й зробила її шкіру змієм. Тепер вона пророкує, ширяючи в небі на останньому літаку, скидаючи жертви з повітряних куль і читаючи знаки у нутрощах. Боги дали їй видіння — нескінченне літо під сяйвом стародавньої зброї. Колись ці вогні зігріли світ. І вона знає, як зробити це знову."

