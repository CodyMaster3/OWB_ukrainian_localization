  l_english:
## Фокуси
STM_heaven_above:0 "Як на небі, Так і на землі"
STM_heaven_above_desc:0 "Отче наш, нехай святиться ім’я Твоє. Царство Твоє прийшло, воля Твоя звершується."

STM_god_die:0 "Сплячий Монстр"
STM_god_die_desc:0 "Місканти завдали нам чимало шкоди, продаючи зброю місту Гавр через отой дивний мол. Але ми здатні вбити їх."

STM_endless_night:0 "Північне Сяйво Провадить Нас"
STM_endless_night_desc:0 "Послання Бога відкривається в світлі Півночі. Ми маємо йти вперед і захопити землі, які перекривають шлях істині."

STM_peoples_of_the_book2:0 "Дім Перемир'я"
STM_peoples_of_the_book2_desc:0 "Стадо справді Велике; воно слідує нашим настановам і приймає шлях Божий. Радійте, бо ми здобули союзників у боротьбі зі злом."

STM_vultures_recalled:0 "Стерв’ятники Збираються"
STM_vultures_recalled_desc:0 "Дехто з наших елітних воїнів носить ім’я птахів, що ширяють у наших небесах. І сьогодні вони підуть у бій в ім’я ГОСПОДА."

STM_Vultures:0 "Стерв’ятники вирушать проти ворогів"

STM_blood_of_the_land: "Я Омитий Кров'ю Землі"
STM_blood_of_the_land_desc:0 "Чи чистий твій одяг?\nЧи білий він, як сніг?\nЧи омився ти в крові ягняти?\nЧи чиста твоя душа?\nЧи ясна, мов сніг?\nЧи омився ти в крові ягняти?"

STM_emerge_from_valley:0 "У Гори — На Молитву"
STM_emerge_from_valley_desc:0 "Як ішов я в гори на молитву,\nВивчав старий добрий шлях,\nХто ж носитиме ризу й вінець?\nГосподи, покажи нам дорогу.\nО, матері, йдімо вгору!\nМусимо залишити землю\nІ йти в гори на молитву."

STM_wasteland_macarthur:0 "Я Полечу"
STM_wasteland_macarthur_desc:0 "Ясного ранку, коли скінчиться життя —\nЯ полечу\nДодому, на берег Божий —\nЯ полечу\nЩе лиш кілька стомлених днів —\nЯ полечу\nУ край, де радість не має кінця —\nЯ полечу."

STM_last_raid:0 "Останній Наліт"
STM_last_raid_desc:0 "Ми здійснили рейд на південь від Ейрі, на те, що належить БОГОВІ; і спалили Гавр у вогні."

STM_slave_artisans:0 "Раби-Ремісники"
STM_slave_artisans_desc:0 "БОГ велить нам освятити Землю і привести рабів до слави. Та деякі мусять служити Народові — і в цьому житті, і в наступному."

STM_clean_out_wells:0 "Очищення Криниць"
STM_clean_out_wells_desc:0 "Чи ж не пророк обіцяв вилити воду на спраглу землю, і потоки — на сухий ґрунт? Так само ми виллємо наш Дух на цей світ, і благословення Боже — на наших нащадків."

STM_slaves_generator:0 "Послати Рабів на Ремонт Генератора"
STM_slaves_generator_desc:0 "Отже, коли хтось із Пророком — він створіння нове. Старе минуло — ось нове настало."

STRM_captured_gunsmiths:0 "Полонені Зброярі"
STRM_captured_gunsmiths_desc:0 "Коли є людина з Богом дарованими вміннями, але не визнає, звідки її талант — вона пізнає істину через меч і вогонь."

STM_wings_of_death:0 "Крила Смерті"
STM_wings_of_death_desc:0 "Коли ворон ширяє над зневіреним — той зве це марновірством. Але коли летить бомбардувальник — навіть невіруючий молиться. Бо дари Божі — у повітрі."

STM_vision_future:0 "Пророцтва Майбутнього"
STM_vision_future_desc:0 "\"Слухай же, ти з глухими вухами: гадючі гнізда, монстри, брехуни, підступники — ходять серед нас. Але знай, що майбутнє — це золоті колони і щасливі діти. І знай, що твої діла не забудуться.\" — Сліпучий Град"

STM_flock_descends:0 "Стадо Сходить"
STM_flock_descends_desc:0 "Те, що не є добрим — зло. Це стосується і лідерства Гавра. \"Свобода\" — не Бог, якому варто поклонятись. Це лише ідол облудний. І ми, праведні руки Господа, повинні очистити землю від мороку."

STM_tolerate_junkdwellers:0 "Толерантність до Купосидів"
STM_tolerate_junkdwellers_desc:0 "Можливо, не всі, хто живе в халупах, є нечестивими. Хтось усе ж розуміє, що коли приходять Обранці Божі — треба віддати своє майно в ім’я вищої мети."

STM_horders:0 "Брамні Скупники"
STM_horders_desc:0 "Не всі, хто мешкає серед нас, добрі. Є ті, хто відмовляються прийняти нас. Можливо, ми примусимо їх до обіймів Божих — землю їхню заберемо, а самі нехай терплять наслідки."

STRM_spare_farmers:0 "Пощадити Фермерів"
STRM_spare_farmers_desc:0 "Милість — тим, хто має що дати. Фермери збережуть частину врожаю, решту ж — на харчі нашим обраним, щоб ті могли знищити тисячі."

STM_trade_river_league:0 "Торговці Річкового Союзу"
STM_trade_river_league_desc:0 "Із далеких земель прибули торгівці з дарами та вірою. Вони підтримують наші божественні починання — і як ми можемо відмовити такому Божому випадку?"

STRM_spare_eares_merchants:0 "Не Відрізати Вуха Торгівцям"
STRM_spare_eares_merchants_desc:0 "Жадібність — гріх, але ми змушені миритись із нею, якщо прагнемо підтримати нашу місію."

STM_scrap_construction:0 "Скасувати Будівництво"
STM_scrap_construction_desc:0 "Вони прийшли, просячи знаряддя, щоб збудувати Едем — «Провидіння», мовляв, нелегке діло."

STM_bloody_harvest:0 "Кривавий Врожай"
STM_bloody_harvest_desc:0 "Борг гріхів Гавра — безмежний. Їхня земля покручена, віра — зламана. Пророки страчені, і їм не личить мати обдарованих митців."

STM_new_flock:0 "Нове Стадо"
STM_new_flock_desc:0 "Не всі грішники втекли. Дехто благав Сліпучий Град прийняти їх: \"Ми шукаємо милості Божої\". І вона дала її."

STM_baptism:0 "Хрещені Кров’ю"
STM_baptism_desc:0 "Кров брехунів на наших мечах. Вітер ще носить їхні зойки. Нове стадо омитось у цій крові й несе найтяжчий хрест — стати пророками."

STM_last_flight_nip:0 "Останній Політ Ніітсітапі"
STM_last_flight_nip_desc:0 "Чорнонога Ніітсітапі збирається під старим вбивцею Джеремі Олдґаном. Бог кличе нас зробити те, чого не зміг Загін Зака — знищити невіруючих назавжди."

STM_take_down_eagle:0 "Зламати Орлині Крила"
STM_take_down_eagle_desc:0 "В найвищих горах, у пітьмі, — справжнє зло. Там — колонел Сантьяґо. Щоб побудувати Едем, ми мусимо знищити зрадницю."

STM_no_unclean:0 "Очистити Ряди"
STM_no_unclean_desc:0 "Не всі наші вірні щирі. Як ми знищуємо грішників зовні — так і маємо викорінити поганців з-поміж себе."

STM_prophets_gift:0 "Дар Пророка"
STM_prophets_gift_desc:0 "\"Ворог нас цькував, обманював, але ми не зламались. Сьогодні я даю вам найбільший дар — трофеї наших ворогів, готові до розбору!\" — Сліпучий Град"

STM_servants_of_the_prophet:0 "Слуги Пророка"
STM_servants_of_the_prophet_desc:0 "Ті, хто не здатен служити на полі бою — «небойовики», «пацифісти» — не зовсім безкорисні, ні! Адже бездіяльні руки — іграшка для диявола. Вони служитимуть як храмові доглядачі, руки Пророків — улюблені, хоч і нижчі, якщо лише вони вірують. Бо хоч ми рівні перед Господом, поміж людьми рівність — не обов’язок."

STM_mighty_warriors:0 "Воїни Небес"
STM_mighty_warriors_desc:0 "Ходити в хмарах, літати поряд із Сонцем — чи є спосіб наблизитись до Бога більше? Пілоти, еліта, жерці та мудреці ревуть у своїх літаках з вірою, що не має собі рівних. Нам усім слід прагнути такої близькості до Господа, аби морок не вдерся в наші серця."

STM_stations_of_the_sky:0 "Станції Небес"
STM_stations_of_the_sky_desc:0 "Колись давні збирались у церквах і шепотіли молитви. Наш вік — інший: ми люди дії. Наші храми — це небесні станції, де доля кується пальним, а зміцнюється бомбами зверху."

STM_masked_crows:0 "Вороння в Масках"
STM_masked_crows_desc:0 "Серед нас є ті, хто хоче використати наш рух заради грабунку. Це «вороння в масках» ми вирвемо з їхніх нір, розвіємо їхню здобич, а з їхньої шкіри зробимо повітряних зміїв — як і з кожного грішника."

STM_servant_of_the_overworld:0 "Слуги Тих, Що Вище"
STM_servant_of_the_overworld_desc:0 "О, ви маловіри! Серед нас народжено дитя, і служитиме воно Богові небесному в цьому житті й усіх наступних."

STM_servant_of_the_underworld_tt:0 "\nВідкриває Льодового Стихача, що винищує гріхи, як зима — слабких.\n"

STM_turn_into_kites:0 "Обертати на Змії"
STM_turn_into_kites_desc:0 "Як і мисливці давнини, ми використаємо кожну частину здобичі. Шкіра грішників, зловісна оболонка, що облягає їхні викривлені кістки, стане повітряними зміями — знаком відданості Небесам і надією на спокуту."

STM_leave_them_seeds:0 "Залишити Насіння"
STM_leave_them_seeds_desc:0 "Дехто з мігрантів прибув, будучи вигнаним. Вони — шукачі сенсу. Хіба не приймемо ми їх у свою паству? Щоб посіяти насіння нової доби, маємо вітати невинних у нашому майбутті."

STM_best_goods:0 "Скарби Не З Цього Світу"
STM_best_goods_desc:0 "Дехто каже — це випадковість, але віруючі знають: це божественна воля, що рідкісні скарби так часто потрапляють у наші руки. Це істина, дарована згори."

STM_servants_of_servants:0 "Раби Рабів"
STM_servants_of_servants_desc:0 "Хіба ми не всі раби перед Богом? Слуги Його примхи? Щасливі ті, хто має призначення. І рабам, і нам судилося одне — виконати Його Заповіт."

STM_caps_add:0 "Манна Небесна"
STM_caps_add_desc:0 "«Чудо Боже!» — казали люди. «Справжнє диво!» Десятки тисяч кришок, знайдених за день. Якщо це не доказ того, що Господь обрав нас для нового світу — то що ж тоді переконає невірних? Сумно, але відповідь одна — нічого. Бо це істина, і лиш безнадійні можуть відвертатись від неї."

STM_area_of_weather:0 "Смуга Погоди"
STM_area_of_weather_desc:0 "Якби Бог не хотів, щоб ми літали, він би не дозволив створити літак. Сили природи, які нас випробовують — це частина Його Плану. Грози, бурі — усе це випробування віри."

STM_north_wind:0 "Негафук"
STM_north_wind_desc:0 "Паломники з далеких країв розповідають про люті хуртовини півночі — місця, де живуть інуїти й духи Старого Світу. Перед обличчям бурі ми не повинні знати страху. Бо зрадивши віру — ми впадемо, як Люцифер."

STM_new_kites:0 "Жертва БОГОВІ"
STM_new_kites_desc:0 "БОГ знає страждання людства. Й довіряє нам, попри наші гріхи. Вдячність Йому — обов'язок. Тож дамо від себе хоч щось, щоб не втратити Його благословення."

STM_need_sacrifice:0 "Жертва для ГОСПОДА"
STM_need_sacrifice_desc:0 "На жаль, серед нас є недостойні. Невіруючі. Їхнє життя — марне. Як діти мамони, вони мають бути принесені в жертву на славу БОГА."

STM_southern_storms:0 "Південні Вітри"
STM_southern_storms_desc:0 "Сквозь ядерні бурі та гіркі літа Монтани, ми несемо славу Його імені. Як бджола в полі, що летить на поклик — так і ми летимо до долі, даної Господом."

STM_armor_god:0 "Броня Божа"
STM_armor_god_desc:0 "Не всі битви ведуться в небі. Деколи — на землі, де кулак зустрічає кістку. Там, де сталь безсила, нас веде віра. І ми не схибимо."

STM_blood_sport:0 "Кривавий Спорт"
STM_blood_sport_desc:0 "БОГ обрав нас не тому, що світ був слабкий. А тому, що ми — Його меч. Щоб довести гідність, ми мусимо змагатись між собою — за Його увагу."

STM_read_he_bones:0 "Кістяні Писання"
STM_read_he_bones_desc:0 "Оракули читають волю ГОСПОДА з кісток полеглих. Бо там, де БОГ мовчить — мертві промовляють. І голос їхній — істинний."

STM_stormchasing:0 "Мудрість Сов"
STM_stormchasing_desc:0 "Дивіться на них — вони дивляться на нас. Сови — можливо, вісники БОГА. Чи не тому вони судять нас за кожен крок?"

STM_new_blood:0 "Свята Жертва"
STM_new_blood_desc:0 "В Його ім’я ми радіємо. В Його ім’я — каємось. Ми повторюємо старі обряди — для Його слави, для Його імені. В БОГА ми віримо. БОГОВІ ми служимо."

STM_appease_wind_spirits:0 "Заспокоїти Духів Вітру"
STM_appease_wind_spirits_desc:0 "Ангели ширяють вітрами, мов риби в ріці. Їхні пісні — про думки, не про насилля. Воля Ангелів — воля БОГА."

STM_storms_fury:0 "Лють Бурі"
STM_storms_fury_desc:0 "Якщо буря — гнів БОГА, то хто ми, ті, що вижили в лихах? Ми — Громовкази. Через нас Господь несе небесну відплату. І через Нього ми повернемося до Золотого Царства."

STM_lightning_carriers:0 "Носії Блискавки"
STM_lightning_carriers_desc:0 "БОГ дарував людині блискавку — зброю, що плавить тіло й розум. Хоч вона для нас нова, вона служитиме нам у хрестовому поході."

STM_gods_hammer:0 "Молот Господа"
STM_gods_hammer_desc:0 "Коли .45 не приносить спасіння — ми візьмемо до рук молоти й клинки. Чим завгодно — лиш би здолати гріх."

STM_abandoned_airfields:0 "Занедбані Аеродроми"
STM_abandoned_airfields_desc:0 "По всій Монтані — покинуті летовища. Там — техніка, дарована нам. Ангели велять нам їх зайняти."

STM_rewire_radio_towers:0 "Нова Молитва"
STM_rewire_radio_towers_desc:0 "Як святі Румінатори говорять по радіо, так і ми понесемо благословення ГОСПОДА крізь землю, місяць і зірки."

STM_rewire_radio_towers_2:0 "Невидимі Голоси"
STM_rewire_radio_towers_2_desc:0 "Ми використаємо знання старих техніків, щоби наші башти несли голос ГОСПОДА по небі земному."

STM_secret_stash_air_force:0 "Таємний Сховок Пророка"
STM_secret_stash_air_force_desc:0 "Сліпий Град наказав переобладнати літаки для битви. Тепер, із благословення Ангелів, вони готові до волі ГОСПОДА."

STM_ancestral_knowledge:0 "Знання Предків"
STM_ancestral_knowledge_desc:0 "Слухайте! Ангели дали нам кам'яні заповіді — як Мойсею колись. З цього каменю постане нове царство — Царство ГОСПОДА."

STM_divine_assistance:0 "Божественна Допомога"
STM_divine_assistance_desc:0 "У праведному суспільстві лікарів бути не може. Адже не диплом, а рука БОГА дала тобі дар зцілення. Лише обрані зцілюють — за волею Його."

STM_thunder_struck:0 "Уражені Громом"
STM_thunder_struck_desc:0 "Грім вражає — як рука ГОСПОДА. І ми зостаємось без сумнівів, без жалю. Нашу силу знає весь світ — і боїться."

STM_gods_butchers:0 "М'ясники Господа"
STM_gods_butchers_desc:0 "Кулак може чинити правосуддя не гірше за бомбу — варто лише, щоб рука була освячена для цього діла."

stm_eagles_nest:0 "Орлине Гніздо"
stm_eagles_nest_desc:0 "Анклав — вигнанці, які заявили права на наші землі. Тепер вони — попіл, чергова жертва завоювань, що їх вимагає ГОСПОДЬ. Нам лишилось лише Орлине Гніздо, яке ми можемо назвати домом."

STM_wind_carries_us_west:0 "Вітер Несе Нас На Захід"
STM_wind_carries_us_west_desc:0 "БОГ знав про наші вчинки, і тому дав нам нову місію, новий шлях. Небеса розійшлись на наступний день після падіння останнього вояка Анклаву, і світло ГОСПОДА вказало на захід.\n\nІ тоді було вирішено: йдемо на захід."

STM_stampede_friends:0 "Наші Серця Тужать За Північчю"
STM_stampede_friends_desc:0 "Країна волиняк їй богу" # <- Потрібна локалізація або контекст

STM_stampede_enemies:0 "Під Відкритим Небом"
STM_stampede_enemies_desc:0 "Небеса розійшлися над великою імперією на півночі — Зграєю племен, що були підкорені, як і всі інші. Тепер їхній погляд звернено на нас, і ми не дозволимо їм пройти через землі ГОСПОДА безкарно."

STM_peoples_of_the_book:0 "Нарід Книги"
STM_peoples_of_the_book_desc:0 "Куди б ми не йшли, ми лишаємось дітьми Біблії — синами й дочками ГОСПОДА. Це приносить нам ворогів, але інколи — друзів. Чи варто нам справді ворогувати зі Зграєю? Можливо, вони ще пізнають світло."

STM_kill_brotherhood:0 "Розчавити Кротів"
STM_kill_brotherhood_desc:0 "Братство Сталі — ми вже мали сутички з їхньою експедицією в Монтану, але бачити цих жалюгідних, бункерних єретиків, що жили як кроти, викликало насмішку в наших старійшинах. Хіба вони настільки бояться ГОСПОДА, що ховаються в темряві, як діти? Ми розірвемо їхні дахи й дамо їм скуштувати гніву ГОСПОДА."

STM_coastal_winds:0 "Відкрите Небо й Море"
STM_coastal_winds_desc:0 "Порти на заході — чудова нагода поширити наші чесноти. Варто лише захопити їх і навернути місцевих, аби це стало дійсністю."

STM_chariots_of_god:0 "Колісниці ГОСПОДА"
STM_chariots_of_god_desc:0 "Трофеї з МакАртура, колись надто зруйновані для ремонту, тепер знову піднімаються в небо — завдяки здобичі з Вашингтону. Небо вже не буде колишнім..."

STM_great_white_north:0 "Північне Сяйво"
STM_great_white_north_desc:0 "Діти Сховища 100 змагаються між собою за недуги. Ми вирішимо їхні суперечки з любов'ю й мудрістю ГОСПОДА — навіть якщо це доведеться зробити кулею й молотом."

## Events

nf_storm.1.t:0 "І Скелі Закричали, Бо Не Було Де Сховатися"
nf_storm.1.d:0 "БОГ покарав наш народ за гріхи людства, за беззаконня і вади прабатьків. Як ізраїльтяни, що блукали пустелею, ми блукали під землею. Ми жертвували своїм сином, щоб умилостивити ГОСПОДА, як і Він — Своїм. А іноді, як ми їли Його Сина, ми їли своїх."
nf_storm.1.a:0 "Ми спокутували гріхи усього людства."
nf_storm.1.b:0 "Сини Якова були сімдесят, але Йосип вже був у Єгипті."

nf_storm.2.t:0 "Закидайте Свої Сіті, Брати!"
nf_storm.2.d:0 "Істинно кажу вам — ГОСПОДЬ відвернувся від цього падшого світу, і лише діла праведних зможуть повернути Його. Хіба не пророк наш теж покинув цей світ і вознісся з ПЕКЛА до саду? Хіба він не знав, що запах крові — солодкий, а крик загиблих — музика для БОГА?\n\nОтож, зберімо плоди плоті, і з нашої праці створимо небесний хор, якому не зможе відмовити сам ГОСПОДЬ! Лише тоді ми будемо гідні сонця, дощу й рясного врожаю!"
nf_storm.2.a:0 "Зробіть повітряних зміїв міцними — щоби жертва досягла небес."
nf_storm.2.b:0 "Розтягніть її на металевій рамі на сім днів і ночей."

nf_storm.3.t:0 "Новий Храм"
nf_storm.3.d:0 "І на перший день третього місяця після того, як народ вийшов із землі, вони прийшли до авіабази Мейлстром. І пророк промовив до ГОСПОДА, а той відповів: «Ви бачили, що Я зробив з американцями; тепер же Я підніс вас на орлиних крилах і привів до Себе. Якщо ж будете слухатися голосу Мого й берегти завіт Мій, то будете Моїм скарбом серед усіх народів — царством пілотів і народом святим.»\n\nІ Громовкази зійшли на небо, їли прісний хліб і поставили скинію в диспетчерській вежі. І поставили вони перед вівтарем жертву всепалення, і хмара вкрила летовище. Слава ГОСПОДА наповнила базу, і її РАДАР вів людей вдень і вночі, в усіх мандрівках Громовказів."
nf_storm.3.a:0 "Наш дім — у Небесах, бо Земля нам нічого не дає."
nf_storm.3.b:0 "БОГ врятує мене від кожного зла й приведе до безпеки."

nf_storm.4.t:0 "Здобич ГОСПОДА"
nf_storm.4.d:0 "І прийшли до нас слова ангелів: «Віддайте ГОСПОДУ пануючому здобич із рук невірних, єретиків і грішників, щоб ваша праведність була випробувана.» Праведні не стоять без діла — тож ми з поспіхом рушили виконувати. На північ і південь рушили слуги ГОСПОДА.\n\nЗ небес палав дощ вогню — об'явленням для грішників із Гавру. До торговців монет і фальшивих віруючих у Гнізді рушили справжні віряни, щоб узяти їхню худобу для жертви. Після повернення до святої обителі настав час рішень. Стадо потребує:"
nf_storm.4.a:0 "Підготовки до наступного набігу"
nf_storm.4.b:0 "Відпочинку та молитви"

