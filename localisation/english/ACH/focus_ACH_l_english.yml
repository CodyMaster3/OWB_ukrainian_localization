l_english:
Alamo_chapter_nf:0 "Дерево Фокусів Відділення Аламо"

ach_nf_emergency_xp:0 "Термінова Підготовка"
ach_nf_emergency_xp_desc:0 "Наші бійці готові битись, але їм бракує бойового досвіду. Щоб це виправити, кожному Паладину буде виділено додатковий час у тренажерах-симуляторах."

ach_nf_consolidation:0 "Консолідація Братства"
ach_nf_consolidation_desc:0 "Побудувати нове відділення Братства — непросте завдання. Хоча багато стратегій та принципів наших предків залишаться незмінними, нам доведеться адаптуватися до нових реалій."

ach_nf_technological_recovery:0 "Відновлення Технологій"
ach_nf_technological_recovery_desc:0 "Позбувшись нездійсненної мрії Руска про «миротворення», ми можемо повернутися до витоків. Наші зусилля будуть спрямовані на пошук і відновлення високих технологій — будь то в руїнах чи здобуто в бою."

ach_nf_demand_richmond:0 "Вимагати Річмонд"
ach_nf_demand_richmond_desc:0 "Наш розкол дезорієнтував Техаське Братство. Це ідеальний момент для тиску. Захоплення Річмонда перекриє їм прямий доступ до узбережжя та посилить нашу промислову базу."

ach_nf_houston_communications:0 "Космічний Центр Г’юстона"
ach_nf_houston_communications_desc:0 "Наступним кроком — укласти угоду з Г’юстоном. Ослаблені й занепалі, вони мають надати нам доступ до своїх технологій для встановлення зв’язку із Західним Братством."

ach_nf_contact_west:0 "Ланцюг, що Зв’язує"
ach_nf_contact_west_desc:0 "Віддавна ця частина нашої доктрини була незмінною. Накази передаються зверху вниз — ланцюг, що не рветься й гартується, як сталь. Беззаперечна відданість Старійшині — основа. Зв’язок із Заходом має бути встановлений."

ach_nf_boost_the_signal:0 "Посилити Сигнал"
ach_nf_boost_the_signal_desc:0 "Занепад Г’юстона не грає нам на руку. Їхній центр — корисний, але надто слабкий, щоб забезпечити стабільний зв’язок із Заходом."

ach_nf_fix_arrays:0 "Провести Ремонт"
ach_nf_fix_arrays_desc:0 "Обладнання, що у них є — ненадійне. Наступним кроком має стати його ремонт."

ach_nf_boost_the_signal_2:0 "Живлення Конденсаторів"
ach_nf_boost_the_signal_2_desc:0 "Проблема подвійна: не лише несправне обладнання, а й нестача потужності. Почнемо з живлення."

ach_nf_fix_arrays_2:0 "Залучити Більше Інженерів"
ach_nf_fix_arrays_2_desc:0 "Чекати більше немає часу. Ми перенаправимо більшість інженерів до космічного центру для прискорення робіт."

ach_nf_boost_the_signal_3:0 "Останній Крок"
ach_nf_boost_the_signal_3_desc:0 "Майже завершено. Поєднавши всі наші зусилля, ми збудуємо покращений центр, здатний транслювати сигнали через весь континент."

ach_nf_elder_emergency_authority:0 "Надзвичайні Повноваження Старійшини"
ach_nf_elder_emergency_authority_desc:0 "Наше хитке становище вимагає централізації влади в руках Торні. Це неідеально, але відчайдушні часи — відчайдушні рішення. Принаймні влада в гідних руках."

ach_nf_emergency_draft:0 "Надзвичайний Призов"
ach_nf_emergency_draft_desc:0 "Наша підтримка обмежена — здебільшого офіцерами Братства. Населення — байдуже. Тож ми змушені будемо мобілізувати його силоміць."

ach_nf_military_upgrades:0 "Аварійне Виробництво"
ach_nf_military_upgrades_desc:0 "Наша промисловість поступається ворогам. Подовжені зміни та заохочення праці на заводах допоможуть вирівняти розрив."

ach_nf_military_upgrades_2:0 "Оборонний Режим «Червоний Рівень»"
ach_nf_military_upgrades_2_desc:0 "Найкраща оборона — це готовий народ. Ми навчимо кожного брата й сестру військовим протоколам, аби створити справжній бастіон у разі війни."

ach_nf_yeomen:0 "Йомени Братства"
ach_nf_yeomen_desc:0 "Кожен чоловік і жінка мають служити Братству. Йомени — нова ідея. Вони не повноправні члени, але користуються захистом і привілеями. Багато хто готовий обміняти свободу на безпеку. А якщо ми навчимось використовувати їх, як меч? То використаємо."

ach_nf_robot_production:0 "Роботи Братства"
ach_nf_robot_production_desc:0 "Ми традиційно не використовуємо роботів у бойових підрозділах, але противники показали ефективність. Можливо, варто переглянути наш підхід."

ach_nf_circuit_breakers:0 "Розмикачі Контролю"
ach_nf_circuit_breakers_desc:0 "Роботи мають переваги, але вони не непереможні. Ми вже маємо технології, що переважають їх. Та навіщо зупинятися? Нехай прийде Анна — ми готові."

ach_nf_warmongering_mutants:0 "Мутантська Загроза"
ach_nf_warmongering_mutants_desc:0 "Наш найстаріший ворог знову піднімається. Ці потвори — блюзнірство проти природи, проти людської сутності. Ми без вагань виконаємо свій обов’язок — знищимо їх."

ach_nf_workshop_forges:0 "Кузні Братства"
ach_nf_workshop_forges_desc:0 "Звісно, не все можна знайти в Пустці. Ми почнемо будувати кузні, здатні самостійно виробляти нашу зброю та броню."

ach_nf_civilian_forges:0 "Майстерні Ніксонтена"
ach_nf_civilian_forges_desc:0 "Від Аламо до Ніксонтена — ростуть нові можливості."

ach_nf_civilian_forges_2:0 "Майстерні Мертвих"
ach_nf_civilian_forges_2_desc:0 "Іноді з’являються ті, кого ми не можемо контролювати."

ach_nf_civilian_forges_3:0 "Портові Майстерні"
ach_nf_civilian_forges_3_desc:0 "У наших містах і селах розцвітає індустрія."

ach_nf_civilian_forges_4:0 "Майстерні Колумбуса"
ach_nf_civilian_forges_4_desc:0 "Навіть дороги будуються. І, за потреби, метро."

ach_nf_civilian_forges_5:0 "Майстерні Аламо"
ach_nf_civilian_forges_5_desc:0 "І ми будуємо швидше, не зважаючи на темп."

ach_nf_military_forges:0 "Кузні Ніксонтена"
ach_nf_military_forges_desc:0 "Сім’ї хлинуть у міста — в пошуках праці."

ach_nf_military_forges_2:0 "Кузні Мертвих"
ach_nf_military_forges_2_desc:0 "На наших вулицях і в провулках — вони чатують із жовтими очима."

ach_nf_military_forges_3:0 "Портові Кузні"
ach_nf_military_forges_3_desc:0 "З майстернею приходить музика, з заводом — мистецтво."

ach_nf_military_forges_4:0 "Кузні Колумбуса"
ach_nf_military_forges_4_desc:0 "Та попри всі здобутки, техасці — все одно сміються."

ach_nf_military_forges_5:0 "Кузні Аламо"
ach_nf_military_forges_5_desc:0 "Наші інвестиції дали плоди й зміцнили банки. Разом ми заклали фундамент."

ach_nf_eternal_forges:0 "Вічні Кузні"
ach_nf_eternal_forges_desc:0 "Окремо ми слабкі. Разом — непереможні. Вигнанці для одних, але для нас — брати."

ach_nf_scribes:0 "Спеціалісти Братства"
ach_nf_scribes_desc:0 "Більшість науковців Техаського Братства були на нашому боці. Та, як і всі вчені, вони мають власні вимоги. Щоб зберегти їхню відданість — ми мусимо інвестувати у наші наукові команди."

ach_nf_study_codex:0 "Вивчення Кодексу"
ach_nf_study_codex_desc:0 "Одна з ключових помилок Техаського Братства — відступ від тактики, натхненної Кодексом. Повернення до доктринальних витоків допоможе зміцнити нашу цілісність як відділення Братства."

ach_nf_study_codex_2:0 "Практичне Застосування"
ach_nf_study_codex_2_desc:0 "Поєднати Кодекс із реальністю бойових дій — завдання непросте. Але досвід Торні в Коло Сталі робить її ідеальним кандидатом."

ach_nf_study_guns:0 "Дослідження Зброї"
ach_nf_study_guns_desc:0 "Якісна зброя — основа кожної армії. Навіть із нашими передовими технологіями нам ще є чому навчатись."

ach_nf_study_guns_2:0 "Інтеграція Вогневих Груп"
ach_nf_study_guns_2_desc:0 "Найкраща зброя — ніщо без належної підготовки. Польові навчання дозволять нашим писарям спостерігати, як їхні напрацювання діють у реальних умовах."

ach_nf_study_armor:0 "Шкіра Паладина"
ach_nf_study_armor_desc:0 "Кожен Паладин у Силовій Броні — це живий Паладин. Безпека солдатів завжди була нашим пріоритетом. Поглиблені дослідження значно підвищать їхню живучість."

ach_nf_study_armor_2:0 "Спеціалізовані Модифікації"
ach_nf_study_armor_2_desc:0 "Громіздка природа Силової Броні створює постійну гонку між нами та ворогом. Вони — щоб пробити її. Ми — щоб перевершити їхню найсмертоноснішу зброю."

ach_nf_study_aviation:0 "Небо — це Поле Бою"
ach_nf_study_aviation_desc:0 "Ще до Великої Війни найсильніші нації розуміли, що небо — стратегічна висота. Створити ефективні повітряні сили дорого, але ми — не просто будь-хто."

ach_nf_study_aviation_fighter:0 "Тузи в Рукаві"
ach_nf_study_aviation_fighter_desc:0 "Винищувачі — найкраща можливість розкрити потенціал наших пілотів. Їхня маневровість робить підготовку критично важливою."

ach_nf_study_aviation_cas:0 "Смерть Згори"
ach_nf_study_aviation_cas_desc:0 "Повітряні сили існують для підтримки наземних військ. Інвестиції в штурмову авіацію суттєво підвищать нашу боєздатність."

ach_nf_study_aviation_transport:0 "Доктрина Швидкої Доставки"
ach_nf_study_aviation_transport_desc:0 "Швидке підкріплення часто вирішує результат битви. Транспорт — шлях до оперативної переваги."

ach_nf_study_aviation_blimp:0 "Око в Небі"
ach_nf_study_aviation_blimp_desc:0 "Дирижаблі повільні, але прості у виробництві й дуже корисні. Їхня практичність може відкрити нові горизонти тактики."

ach_nf_study_air_tactics:0 "Нетипові Висновки"
ach_nf_study_air_tactics_desc:0 "Може здатися дивним, що ми застосовуємо Кодекс до повітряної війни. Але його принципи — це істини війни, незалежно від середовища."

ach_nf_scribes_2:0 "Загартовані Писарі"
ach_nf_scribes_2_desc:0 "Наші дослідження стрімко просунулись після розриву з Техасом. Майже кожен писар — ветеран, здатний штовхати прогрес далі, ніж будь-коли."

ach_nf_arm_comes:0 "Цього Разу — Фарс"
ach_nf_arm_comes_desc:0 "Історія має звичку повторюватися. Поки робот-генерал готує свої сили — ми готуємося до бою. Техас проти Мексики. Людина проти машини. Перемога буде за нами!"

ach_nf_tex_comes:0 "Техас Іде"
ach_nf_tex_comes_desc:0 "Ми чекали на напад із півночі ще з моменту розколу. Та все одно боляче бачити, як колишні брати стають ворогами, марячи про минуле. Гордощі, зарозумілість і бажання збудувати майбутнє — ціною нашої жертви. Ми захистимо Братство — будь-якою ціною."

ach_nf_bunker_grid:0 "Сітка Бункерів"
ach_nf_bunker_grid_desc:0 "Мала чисельність вимагає сильної оборонної доктрини. Мережа застав дозволить своєчасно виявляти наступи ворога й координувати захист."
fortify_alamo_tooltip:0 "2 §Yзастави§! буде побудовано в §YАламо§!.\nПо 1 §Yзаставі§! буде побудовано на кордонах із §YСан-Антоніо§!, §YНіксонтоном§!, §YТрупом§!, §YКолумбусом§!, §YПорт-Лавакою§! і §YРічмондом§!, якщо ми їх контролюємо."

ach_nf_bunker_grid_2:0 "Посилити Сітку"
ach_nf_bunker_grid_2_desc:0 "Ключові точки будуть додатково укріплені. Поєднання фортифікацій і нашого озброєння зробить їх практично неприступними."
fortify_alamo_2_tooltip:0 "2 §Yбункери§! буде побудовано в §YАламо§!.\nПо 1 §Yбункеру§! буде побудовано на кордонах із §YСан-Антоніо§!, §YНіксонтоном§!, §YТрупом§!, §YКолумбусом§!, §YПорт-Лавакою§! і §YРічмондом§!, якщо ми їх контролюємо."

ach_nf_desperate_defense:0 "Нескорені Торні"
ach_nf_desperate_defense_desc:0 "Якою б не була наша міць — числа проти нас. Ми мусимо боротись за кожну вулицю. Якщо ворог не знатиме, коли ми вдаримо — він не буде готовий."
alamo_desperate_defence_tooltip:0 "Створює унікальний підрозділ §YЗахисників Аламо§!"

ach_nf_plea_for_help_bos:0 "Заклик по Допомогу"
ach_nf_plea_for_help_bos_desc:0 "Наскільки б не було боляче визнавати — ми не впораємося самі. Нам потрібна допомога — у будь-якій формі."

ach_nf_united_front:0 "Єдиний Техаський Фронт"
ach_nf_united_front_desc:0 "Просити допомоги в техасці — принизливо. Але заради виживання доведеться відкинути гордість. Пробач нам, Кодексе, за те, що зраджуємо покликання."

ach_nf_treasures_of_the_old_world:0 "Скарби Старого Світу"
ach_nf_treasures_of_the_old_world_desc:0 "Руїни навколо сповнені втрачених технологій. Нові експедиції, безсумнівно, принесуть значні плоди. Хіба не це — наше покликання? Охороняти те, що може знищити людство?"

ach_nf_mutant_bulwark:0 "Щит від Мутантів"
ach_nf_mutant_bulwark_desc:0 "Залишки армії Мастера — загроза. Братство Руска намагалося з ними співпрацювати. Ми — ні. Ми маємо захиститися від цієї пошесті, бути насторожі навіть перед тими, хто маскується під мирних."

ach_nf_stop_the_manhunt:0 "Зупинити Людоловів"
ach_nf_stop_the_manhunt_desc:0 "Ці мисливці перетворили жорстокість на спорт — полюючи на свідомих, здатних людей. Ми покладемо цьому край. Жодна людина не є худобою."

ach_nf_airfield:0 "Злітні Смуги Братства"
ach_nf_airfield_desc:0 "Маючи такі знання з авіації — настав час застосувати їх."

ach_nf_airfield_2:0 "Аламо — в Небо"
ach_nf_airfield_2_desc:0 "Брат у небі — це брат у безпеці. А з тієї висоти — захист для всіх. Ми правитимемо небом — і станемо непереможними."

ach_nf_air_defenses:0 "Чисте Небо"
ach_nf_air_defenses_desc:0 "Забирайся звідси, літаку!"

ach_nf_enter_the_corpse:0 "Увійти в Труп"
ach_nf_enter_the_corpse_desc:0 "Corpus Christi — довоєнна військова база, повна невідомого. Древні секрети. Можливо — сила панувати на морі. Ніхто не має отримати її... ніхто, крім нас."

ach_nf_enter_the_corpse_2:0 "Корпус-Крісті"
ach_nf_enter_the_corpse_2_desc:0 "Після всіх приготувань — Труп перед нами. Смердюча руїна смерті й мутації. Але ми розібрали її, відкрили її таємниці: креслення флоту, документи — і знання, щоб будувати кораблі сильніше, краще, швидше."

ach_nf_secrets_of_fort_hood:0 "Таємниці Форт-Гуду"
ach_nf_secrets_of_fort_hood_desc:0 "Форт-Гуд — головний військовий арсенал довоєнного світу. Експериментальна й традиційна зброя. Перша експедиція провалилась, але наша Старійшина вірить, що впорається. Або ж просто не хоче визнати жертви даремними."

ach_nf_secrets_of_fort_hood_electronics:0 "Акцент на Хакінгу"
ach_nf_secrets_of_fort_hood_electronics_desc:0 "Такі експедиції завжди стикаються з високим рівнем безпеки. Підготовка до зламу й здобуття кодів — ключ до подальшого просування."

ach_nf_secrets_of_fort_hood_readiness:0 "Акцент на Готовність"
ach_nf_secrets_of_fort_hood_readiness_desc:0 "Одне слово — людські ресурси. Експедиції — витратні й смертельні. Якщо кинути більше тіл у пролом — можливо, він не витримає."

ach_nf_secrets_of_fort_hood_2:0 "Оприлюднити Результати"
ach_nf_secrets_of_fort_hood_2_desc:0 "Форт-Гуд — наш. Його таємниці — наші. Хто б міг уявити? Але ми зробили це. Хай живе Братство! Хай живе Старійшина!"

ach_nf_secrets_houston:0 "Штаб-квартира USSA"
ach_nf_secrets_houston_desc:0 "Колись United States Space Administration була лідером освоєння космосу. Її штаб — Г’юстон. Дослідимо, що там лишилося."

ach_nf_secrets_houston_satelite_air_focus:0 "Авіаційний Супутниковий Фокус"
ach_nf_secrets_houston_satelite_air_focus_desc:0 "Супутники скрізь. Ми маємо до них доступ, але коди важко зламати. Чи зосередимось на моніторингу погоди, чи на орбітальному стеженні?"

ach_nf_secrets_houston_satelite_recon_focus:0 "Розвідувальний Супутниковий Фокус"
ach_nf_secrets_houston_satelite_recon_focus_desc:0 "Супутники скрізь. Ми маємо до них доступ, але коди важко зламати. Чи зосередимось на моніторингу погоди, чи на орбітальному стеженні?"

ach_nf_secrets_houston_2:0 "У Нас Немає Проблем"
ach_nf_secrets_houston_2_desc:0 "Подальша робота з супутниками розширить наші можливості. Можливо, ми навіть полагодимо цей клятий масив зв’язку."

ach_nf_treasures_of_the_old_world_2:0 "Дарунки Старого Світу"
ach_nf_treasures_of_the_old_world_2_desc:0 "Тож цієї ночі, коли ми ламаємо хліб разом, — хай буде щось нове. Щось сильне. Щось, чим можна пишатись. Ми збережемо найкраще зі старого світу — і використаємо це. І одного дня — ми повернемо втрачене.\nСтаньмо Братством Сталі.\n — Верховний Старійшина Роджер Мексон"

ach_nf_mothball_1:0 "Відкрити Арсенал"
ach_nf_mothball_1_desc:0 "У відчайдушні часи ми можемо використати те, що оберігали від інших. Настав час дістати іграшки."

ach_nf_mothball_2:0 "Реактивація Старого Озброєння"
ach_nf_mothball_2_desc:0 "Ці обладунки й рушниці роками вкривались пилом. Прийшов час повернути їм життя."

ach_nf_mothball_3:0 "Відкрити Сховища"
ach_nf_mothball_3_desc:0 "Це останні резерви. Все інше — тільки те, що ми зможемо знайти, витягти чи вкрасти. Сподіваймось, цього вистачить."

ach_nf_cross_referencing_code_snippets:0 "Йти Глибше"
ach_nf_cross_referencing_code_snippets_desc:0 "Стільки таємниць розкрито перед нами — Форт-Гуд, штаб USSA в Г’юстоні, морська база в Corpus Christi... Та між рядками має бути ще більше."

ach_nf_poseidon_oil_iff:0 "Корпоративна Спадщина"
ach_nf_poseidon_oil_iff_desc:0 "Усі ці військові комплекси мали щось спільне — дещо незвичне. Або ж очевидне тим, хто знає про темні дні перед війною. Але чому енергетичній компанії було настільки важливо контролювати військові бази?"

ach_nf_harbinger_of_armageddon:0 "Вісник Армагеддону"
ach_nf_harbinger_of_armageddon_desc:0 "Знамениті слова, вимовлені після створення найстрашнішої зброї людства. Деякі таємниці краще залишити в могилі."

ach_nf_control_core_tlaloc:0 "Ядро Контролю Тлалока"
ach_nf_control_core_tlaloc_desc:0 "Машини-вбивці, ядерне спустошення — із цього місця вийшло лише руйнування. Та щоб врятувати людство від нього самого — ми мусимо зрозуміти."

ach_nf_texico_oil_rig:0 "Нафтова Платформа Texico"
ach_nf_texico_oil_rig_desc:0 "Іноді, коли ніч ясна, а місяць віддзеркалюється на хвилях, — ми бачимо миготливі вогні на обрії."

ach_nf_send_it_all_west:0 "Передати Все За Захід"
ach_nf_send_it_all_west_desc:0 "Платформа зберігала дані більшої цінності, ніж ми могли уявити. Наші писарі тижнями аналізували їх. І вирішили — наші брати в Каліфорнії мають теж отримати ці знання."

# Tooltips
ach_nf_cross_referencing_code_snippets_tt:0 "Цей фокус дозволить нам заглибитися в таємниці минулого. Хай не пробудимо щось жахливе."

ach_fort_hood_focus_unlock_tt:0 "Ми вирушимо в експедицію до глибин Форт-Гуду — того самого місця, яке забрало стільки братів і сестер.\n§GЦе відкриє рішення для дослідження й використання руїн Форт-Гуду.§!"

ach_nf_poseidon_oil_iff_tt:0 "Дрібні підказки, поєднані з геніальністю наших писарів та досвідом експедицій. Ми створили повноцінний довоєнний §GPoseidon IFF§!.\n\nЇхні системи визнають нас своїми. \n\nДля них ми — §MАнклав!§!"

ach_nf_harbinger_of_armageddon_tt:0 "§RI am become death, destroyer of worlds.§!"

ach_nf_control_core_tlaloc_tt:0 "§MРобот-бог Мексики.§!"

ach_nf_texico_oil_rig_tt:0 "Десь там, як бастіон посеред хвиль — пошлемо сигнал, запрошуємо..."

ach_nf_no_idea_what_this_does_tt:0 "Ніхто не може сказати, до чого призведе наше дослідження. Але хто знає, які скарби ми відкриємо?"

ach_nf_send_it_all_west_tt:0 "§PБуде додано пізніше.§!"

alamo_mutant_bulwark_tt:0 "Будує §G1§! рівень §Yзастав§! уздовж усього кордону з Мутантами."