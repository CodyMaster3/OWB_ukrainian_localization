l_english:
# Консолідація
nf_event_ach.1.t:0 "Стара нова мета"
nf_event_ach.1.d:0 "Поки наші брати на півночі все ще мріють про відновлення старого світу, ми побачили істину. Технології досі потребують захисту — доти, доки людство знову не буде готове. До того часу — ми стоятимемо на варті. Це було непросте рішення, але всі ми погодилися — воно було необхідним. Ніколи не забудьмо наших братів, навіть тих, хто покинув Братство заради ілюзій відродження світу, що неодноразово зазнавав поразки."
nf_event_ach.1.a:0 "Щоб оберігати людство"

# Відкрити Сховища
nf_event_ach.2.t:0 "Відкрити Сховища"
nf_event_ach.2.d:0 "Навіть як частина Техаського відділення ми збирали й зберігали технології. Але однією з причин розколу було їхнє бажання роздавати те, що ми охороняємо. Ми не можемо цього допустити. Та що робити з нашою самотньою вартою? Нам потрібна кожна перевага, яку тільки можна здобути."
nf_event_ach.2.a:0 "Будь-якою ціною..."

# Вимога Річмонда
nf_event_ach.3.t:0 "Річмонд: Ми його потребуємо"
nf_event_ach.3.d:0 "Наземний доступ до штаб-квартири USSA — практично обов’язковий. Досягнімо цього, силою або грошима. Сподіваймося, наші колишні брати ще не забули про нашу спільну місію."
nf_event_ach.3.a:0 "Придбати Річмонд"

# Доступ до Г’юстона — вимога
nf_event_ach.4.t:0 "Трансляція з Центрального Г’юстона"
nf_event_ach.4.d:0 "Війна дорога, але ми можемо її уникнути, якщо отримаємо необмежений доступ до їхніх об’єктів. Якщо ж ні — ми візьмемо їх силою. Так чи інакше, таємниці штаб-квартири USSA стануть нашими."
nf_event_ach.4.a:0 "Г’юстон, у нас проблема?"

# Контакт із Заходом
nf_event_ach.5.t:0 "Ланцюг, що зв’язує"
nf_event_ach.5.d:0 "Нам вдалося налагодити хоч і обмежений, але сталий зв’язок. Як завжди — не без труднощів. Утім, це вже є відправною точкою для чогось більшого."
nf_event_ach.5.a:0 "Можливо, згодом ми зможемо дістатися до них легше?"

# Завершення операції в Г’юстоні
nf_event_ach.6.t:0 "Реліквії минулого"
nf_event_ach.6.d:0 "Охороняти минуле — наш обов’язок, навіть якщо воно поза фізичним досяжним. Коди, обладнання, супутники. Ми використаємо їх, щоб відкрити правду — і захистити людство від чергового самознищення. Лише гідні матимуть право володіти мечем."
nf_event_ach.6.a:0 "Збільшити можливості!"

# Повернення до Техасу
nf_event_ach.41.t:0 "Об’єднані Брати"
nf_event_ach.41.d:0 "У нас немає вибору. Ми повинні повернутися — і залишити позаду те, що колись зробило нас Братством. Шлях уперед — не наш. Він — їхній. Шлях веде назад до Техасу. Можливо, одного дня ми знову повернемось до нашої справи. Колись..."
nf_event_ach.41.a:0 "Скромність — можливо, це і є чеснота."

# Запит на реінтеграцію в Техас
nf_event_ach.45.t:0 "Брати — знову разом?"
nf_event_ach.45.d:0 "Після серії поразок армія Відділення Аламо почала відступати. І раптом Кетрін Торні вирішила домовлятись. Її агент приніс щедру пропозицію: Відділення визнає свою помилку щодо засудження наших дій у Техасі, пообіцяє компенсувати економічні й військові збитки за час розколу та погодиться на реінтеграцію. В обмін — ми маємо допомогти їм у війні. Це шанс пробачити, але чи варто нам втручатися в їхній конфлікт? Чи зможемо ми собі це дозволити?"
nf_event_ach.45.a:0 "Повернімо їх до нашої родини"
nf_event_ach.45.b:0 "Ми не можемо собі цього дозволити"

# Техас відмовляється
nf_event_ach.46.t:0 "Техас відхилив нашу пропозицію"
nf_event_ach.46.d:0 "Зрештою, ми отримали відповідь із Техасу — і вона невтішна. Вони відмовляються, заявляючи, що просто не мають ресурсів для війни. Дехто бачить у цьому щирість, інші — зраду. Та якими б не були їхні справжні мотиви, ми залишились наодинці зі своєю долею."
nf_event_ach.46.a:0 "Невже це — кінець?"

# Midwest
nf_event_ach.42.t:0 "Несподівана допомога"
nf_event_ach.42.d:0 "Здається, наші постійні спроби покращити зв'язок із Лост-Гіллс дали побічний ефект. Нас почула ще одна група!\nВони з’явились із обличчями, наче в демонів.\n\nНе із заходу — а з північного сходу. Вони спустилися з гігантських дирижаблів, мов саме спасіння. Серед броні кольору рогу та піску — Середній Захід тут. Рятівники в шоломах із рогами."
nf_event_ach.42.a:0 "Невже Барнакі ще живий?"

# Доступ до Г’юстона (HRO отримує вимогу)
nf_event_ach.100.t:0 "Вони вимагають доступ"
nf_event_ach.100.d:0 "Старійшина Відділення Аламо з’явився особисто й зажадав доступу до нашої території. Ми можемо дозволити їм увійти... або, за їхніми словами, зазнати наслідків. Ураховуючи, як вони носяться з піною на губах при згадці про нутрощі космічного центру? Варто добре обміркувати. Відмова означає війну."
nf_event_ach.100.a:0 "Впустіть їх"
nf_event_ach.100.b:0 "Кинути їм виклик"

nf_event_ach.101.t:0 "Підсумки дослідження"
nf_event_ach.101.d:0 "Скрупульозні дослідження, звірка десятків фрагментів даних — усе це дало нам нове розуміння. Усі ці військові бази, які ми відвідали, мали прямий доступ до чогось, що називалося PoseidoNet — внутрішня комунікаційна мережа, що покривала всю довоєнну територію США. Пов’язана з Poseidon Energy — величезним довоєнним енергетичним конгломератом. Що ще краще — ми вважаємо, що змогли зібрати достатньо даних, аби отримати доступ до цієї досі частково активної мережі."
nf_event_ach.101.a:0 "Діємо обережно"

nf_event_ach.102.t:0 "Poseidon IFF"
nf_event_ach.102.d:0 "Анклав — ворог, який ледь не знищив нас до того, як NCR покінчила з ними на Заході. Ми ховались як могли. Вони — безумні, аморальні, вважають себе наступниками уряду довоєнної Америки. Poseidon Energy, як виявилось, була глибоко втягнута в тіньовий уряд — промисловці, чиновники, навіть президенти. За їхніми словами — «на випадок катастрофи», але записи свідчать про інше. Вони намагались стерти все живе на континенті за допомогою вірусу, аби заселити його заново своїми обраними зі сховищ. Геноцид, що міг би звести людство до виродження.\n\nТа попри все, Анклав широко використовував PoseidoNet — охорона, зв’язок, і багато іншого. Наші писарі та лицарі створили робочий IFF-модуль. З ним — ми і є Анклав. Принаймні для тих, хто не ставить зайвих питань."
nf_event_ach.102.a:0 "Ми — Анклав, коли це вигідно"

nf_event_ach.103.t:0 "Я не хочу підпалити цей світ"
nf_event_ach.103.d:0 "Це безумство — стільки ядерних боєголовок в одному місці. Велике Сховище, до якого Тлалок мав повний доступ через підмережу Chiconet. Ще одна частина пазлу, адже Chiconet — це лише фрагмент PoseidoNet. І хоч ми прийшли не лише за боєголовками, а й щоб охороняти їх — ми також знайшли коди запуску. Навіть мертвий, «бог дощу» не встиг використати всі.\nСкільки ж смертоносної зброї створив довоєнний світ?.."
nf_event_ach.103.a:0 "Ніколи їх не використаємо"

nf_event_ach.104.t:0 "Змусити дощити"
nf_event_ach.104.d:0 "Тлалок — штучний інтелект, створений Poseidon Energy для окупації Мексики. Тисячі роботів, контроль над людьми — кожен мав стати рабом машини. І тільки після її загибелі жертви були звільнені. Проте навіть у смерті машина залишається корисною. Високотехнологічні роботи, тонке програмування — ми використаємо це на свою користь."
nf_event_ach.104.a:0 "Таємниці бога"

nf_event_ach.105.t:0 "Воно відповіло"
nf_event_ach.105.d:0 "У далеких, ворожих водах стоїть нафтова платформа — зношена, зруйнована, вже давно виснажена. І все ж вона жива. Коли ми надіслали сигнал — вона відповіла. Істоти з минулого, збереглі в часі, розповіли нам свою історію. Вони зустрічали й інших — менш гостинних, які звали себе Анклавом. Виникла бійка, і від тих інших не лишилось нічого — крім технологій. Літаки вертикального злету. Схеми. Ми готові, якщо ті «упирі» надумають ступити на землю Техасу."
nf_event_ach.105.a:0 "Заберемо птахів, залишимо упирів"

nf_event_ach.106.t:0 ""
nf_event_ach.106.d:0 ""
nf_event_ach.106.a:0 ""

nf_event_ach.107.t:0 "Техас підкоряється"
nf_event_ach.107.d:0 "Ми отримали звістку: Техаське Відділення готове підкоритись нашій владі. Вони визнають свої помилки, відмовляються від мрій про Єдину Республіку Техас і знову визнають верховенство Кодексу Братства. Хоч їхнє керівництво бажає возз’єднання, наша Адміністрація наразі не здатна повністю інтегрувати їхні території. Поки що — вони залишаться автономним регіоном нашого Відділення. Та незалежно від цього — це велика перемога. Лише справа часу, коли Техаське Відділення Братства підніметься над усією Пусткою."
nf_event_ach.107.a:0 "Ad Victoriam"