l_english:
form_ach_texan_brotherhood:0 "Возз'єднати Техаські Відділення"
form_ach_texan_brotherhood_desc:0 "Повернувши собі статус беззаперечної сили в Техасі, ми можемо відновити нашу ідентичність як Техаське Відділення, зосередившись на виконанні наказів, отриманих від Лост-Гіллс."

form_ach_leon_brotherhood:0 "Заснувати Відділення Ріо"
form_ach_leon_brotherhood_desc:0 "Техасці зрадили нашу місію, наш кодекс – вони назвали нас фанатиками й екстремістами.\nТа нині, здобувши перемогу над роботизованими арміями Тлалока та його Дітей, ми остаточно довели їм і всьому світу, на що насправді здатне Братство Сталі!"