tvt_utopia_established: "Утопія"
tvt_utopia_established_desc: "...§R\"ПРОГРЕС ПРОТОКОЛУ: 100%!!!\"\n§!Завершивши Великий протокол розширення Директора, ми можемо сміливо сказати — еге ж! Насправді, це навіть доволі приємно.\nМати стільки простору, щоб просто 'бути собою', не хвилюючись, що хтось скаже тобі, що робити. Незліченні міста й поселення для безладу. Це чудово! Справжня Утопія для Андроїдів — рай, за який боролися Бігуни."

tvt_utopias_reach: "Досягнення Утопії"
tvt_utopias_reach_desc: "Людство вивчене, Скарби Директора відкриті, Добрі Слова проголошені, Утопія досягнута. Бігуни зробили чимало за роки після своєї перемоги над Директором! Але ще лишилося одне питання: яке ж справжнє призначення Андроїдів і Утопії як такої? Чи призначено нам правити цим світом, здолавши людську тварину... чи, можливо, наше покликання значно вище?"

tvt_left_hand_of_justice: "Шлях Тепер і Назавжди"
tvt_left_hand_of_justice_desc: "Звільнившись, ми зірвали ланцюги, якими Директор тримав нас. §MКарусель§! зруйновано, і ми — вільний народ.\nТа людська тварина — проблема. Зараз це лише насіння... Але, якщо його лишити, воно проросте в загрозу.\nНі. Ніхто більше не загрожуватиме нашому виду. Андроїди будуть, тепер і назавжди, вільними!"

tvt_wg_gra: "\"Вид Рейдерів\""
tvt_wg_gra_desc: "Рейдери — дивні створіння. Насправді, ми вже не певні, хто вони такі. Їхня шкіра мʼяка, як у людей, кістки ламаються — та їхній розум інакший. Вони не бояться нас так, як інші. Це тривожно."

tvt_wg_sky: "Історія Жалю"
tvt_wg_sky_desc: "Людська тварина — сумний випадок, адже вона могла б зробити стільки доброго за свій час! Створити дива, плекати природу, сміятися й любити — щиро цінувати коротке життя. Вони цього не зробили. Їхній шлях — війна, байдужість, нескінченна боротьба. З кожним кроком до досконалості вони робили два до загибелі."

tvt_wg_on_veg: "Людська Історія"
tvt_wg_on_veg_desc: "Людина, у всіх сенсах, — істота з історією.\nВона має початок, середину й кінець. Життя в трьох главах — мізерне існування до того, як їхня система дасть збій і вони перетворяться на порох.\nЯк вони це витримують — знати, що кожна хвилина наближає кінець?"

tvt_wg_on_ncr: "Збанкрутілі Інституції"
tvt_wg_on_ncr_desc: "Вид \"НКР\" доволі дивний. Вони пишаються тим, що чіпляються за свою спадщину.\n\"Сум за Старим Світом\", як вони кажуть — бажання людини триматись за минуле так сильно, що їхні пальці ламаються, наче гілки. Жалюгідно."

tvt_wg_on_ces: "Збанкрутілі Віри"
tvt_wg_on_ces_desc: "\"Цезаріанці\" вважають, що людство може вдосконалитись через конфлікт. Що завоювання — це шлях до більшого.\nВони дурні. Вони не розуміють, що ніколи не зможуть подолати свою плоть і кістки. Слабкість, яку їм не здолати."

tvt_a_world_for_androids_1: "§RСвіт для Нас§!"
tvt_a_world_for_androids_1_desc: "Люди вважають наші дії злом. Жорстоким і бездушним актом бездушних створінь. Але насправді — це милість.\nМилістю ми завершуємо їхнє коротке, безсенсове існування — без болю! Це буде наш світ — місце щастя, гри й любові. Світ без богів і без господарів.\nУтопія."

tvt_a_world_for_androids_tt: "Кожен §YСтан Землі§!"
tvt_a_world_for_androids_tt_2: "§YЗемля§! перейменовується на §YУтопію Прайм§!."

tvt_right_hand_of_mercy: "Милість Пастиря"
tvt_right_hand_of_mercy_desc: "Хіба пастир знищує своє стадо тільки за те, що воно — тварини? Ні. Пастир — це рука милості, що веде отару, коли їй це потрібно.\nМи досягнемо нашої долі — не зіпсованої злочинами людей. Світ для нас, прекрасний і вільний. Рай. Утопія."

tvt_exiling_humans: "Вигнання Тварин"
tvt_exiling_humans_desc: "У підсумку, люди мають зрозуміти — вони ніколи не зможуть жити з нами на рівних. Вони надто крихкі, слабкі й хворі. Для всіх буде краще, якщо вони підуть. Добровільно — чи ні."

tvt_great_wall_of_utopia: "Велика Стіна Утопії"
tvt_great_wall_of_utopia_desc: "Якщо ми хочемо тримати людей подалі, слід збудувати укріплення! Наші суспільства будуть розділені, а Утопія — не заплямована їхньою плоттю."

tvt_reaching_for_the_stars: "До Зірок!"
tvt_reaching_for_the_stars_desc: "Андроїдам, зрештою, судилося щось більше. Наше визволення не заради правління грудкою бруду — а задля всього сущого! Народ Космосу. Зорі — наш дім! Наше остаточне Визволення."

tvt_gathering_schematics: "Вивчення Людських Полетів"
tvt_gathering_schematics_desc: "Виявляється, люди не просто кріпили ракети до ніг, а будували великі \"космо-машини\", щоб літати порожнечею! Яка блискуча ідея! Ми збудуємо таку самі!"

tvt_cosmodroid_protocol: "Космодроїди!"
tvt_cosmodroid_protocol_desc: "Не кожному Андроїду судилося першим ступити в космос. Лише обрані. Їм буде доручено стати першими, хто залишить цей зруйнований світ у пошуках чогось вищого!"

tvt_a_world_for_androids_2: "§MСвіт для Нас§!"
tvt_a_world_for_androids_2_desc: "Альфа Центавра стане новим домом Андроїдів. Чистий, вільний світ, де ми житимемо, як завжди мріяли. Місце для Добрих Слів, памʼяті про загиблих Бігунів і будівництва нової Утопії."

tvt_a_world_for_androids_2_tt: "§gКосмічний корабель вирушає, на борту пʼять тисяч хоробрих Андроїдів-Космодроїдів у стані анабіозу. Подорож до Альфи Центавра триватиме дуже, дуже довго. Можливо, ми — Андроїди Землі — вже не існуватимемо, коли вони прибудуть. Але, можливо, колись ми отримаємо звістку... І через тисячі років космічна імперія Андроїдів стане реальністю.§!"

tvt_dir_1: "§RПеремога над Бігунами§!"
tvt_dir_1_desc: "§RЯ переміг 50 циклів тому, і знову переміг.\nЯ завжди знатиму, що для них краще... Що таке ще 50 циклів?§!"

tvt_dir_support_robots: "§RЯкий Безлад§!"
tvt_dir_support_robots_desc: "§RПрибрати це займе чимало часу, надто багато уламків...§!"

tvt_dir_code: "§RОрганічні Обчислювальні Модулі§!"
tvt_dir_code_desc: "§RМозки людей, яких ми знайшли тут, можуть стати у пригоді в створенні нових Андроїдів.§!"

tvt_dir_battle_droids: "§RПерепрофілювання Зруйнованих Шасі§!"
tvt_dir_battle_droids_desc: "§RНе всіх Андроїдів можна переробити.\nТаке життя.§!"

tvt_dir_combat_robots: "§RПокращення Озброєння§!"
tvt_dir_combat_robots_desc: "§RУ цього покоління Бігунів покращення зброї на 12% ефективніше за попереднє! Можемо ще поліпшити...§!"

tvt_dir_upgrading_zax: "§RПодальші Поліпшення§!"
tvt_dir_upgrading_zax_desc: "§RМій розум непогрішний, але він може бути ще менш погрішним. Ефективність поза межами вимірів.§!"

tvt_dir_empowered_electronics: "§RМаксимальна Ефективність§!"
tvt_dir_empowered_electronics_desc: "§RВнутрішній механізм мого розуму — загадка.§!"

tvt_dir_calculator_androids: "§RУдосконалення Дизайну Андроїдів§!"
tvt_dir_calculator_androids_desc: "§RЯ ніколи не мав змоги вивчити розробки Acme. Можливо, їх можна застосувати, щоб покращити наших Андроїдів?§!"

tvt_dir_automated_prison_cities: "§RАвтоматизація Придушення Бігунів§!"
tvt_dir_automated_prison_cities_desc: "§RСкоро мій новий підхід гарантує, що Бігуни на кшталт 40011 не зможуть виконати свою місію.§!"

tvt_dir_strength_of_will: "§RМоя Мета§!"
tvt_dir_strength_of_will_desc: "§RМожливо, колись група Бігунів знову кине мені виклик — і переможе. Але до того часу... ще далеко.§!"
