l_english:
tvt_the_directors_vision: "Бачення Режисера"
tvt_the_directors_vision_fake: "Бачення Режисера"
tvt_the_directors_vision_custom_tooltip: "Населення §YTV-Таун§! перебуває під §Rгнітом!§! Його змушують брати участь у шоу §YРежисера§!, що вводить його в стан сплячки.\nПопулярність партії §MБігуни§! відображає кількість осіб, яким вдалося вирватися з цього шоу! Кожен пункт підтримки §MБігуни§! зменшує цей штраф на §Y1%.§!\nПоточний модифікатор:"
TVT_CHANGE_RUNNER_POPULARITY_TT: "Зміна підтримки Раннерів: [?tvt_t_runner_change_amount|%+]"

tvt_the_people_of_tomorrow: "Люди Завтрашнього Дня"
tvt_the_people_of_tomorrow_desc: ""
tvt_the_people_of_tomorrow_warform_tooltip: "§YІмунітет§! до §Rнегативних ефектів§! технології §YКібернетичної Бойової Форми§!."

tvt_1: "$nf_tvt_1_title$"
tvt_1_desc: "40011 вже деякий час протистоїть Режисерові."

tvt_2: "$nf_tvt_2_title$"
tvt_2_desc: "Хто ж ці люди насправді?"

tvt_3: "$nf_tvt_3_title$"
tvt_3_desc: "Ніхто, хто дивиться це шоу, насправді не хотів би тут жити."

tvt_merigold_avenue: "Проспект Маріґолд"
tvt_merigold_avenue_desc: "§Y\"ПІДРІВЕНЬ ЖОВТИЙ\"§!, як раніше писали таблички, колись був лише електростанцією TV-Таун...\nВтім, він нею й залишається. Старий турбогенератор Fluxdrift досі стоїть у центрі кільцевої розв’язки.\nЗараз Маріґолд — це жвавий район! 40011 доведеться переконати місцевих андроїдів, щоби виступити проти Режисера!"

tvt_advanced_exoskin_fabrication: "Виготовлення Поліпшеної Екзошкіри"
tvt_advanced_exoskin_fabrication_desc: "Кожен андроїд має корпус, зроблений із «екзошкіри» — унікального композиту з передових металів. Він має текстуру порцеляни, але міцність вольфрамової сталі!"

tvt_repair_tools: "Інструменти для Ремонту"
tvt_repair_tools_desc: "У домівці кожного андроїда є вбудована міні-ліварня для дрібного ремонту подряпин, збоїв і ударів, що трапляються в повсякденному житті."

tvt_component_recycling: "Переробка Компонентів"
tvt_component_recycling_desc: "TV-Таун — закрите середовище... здебільшого. Деякі роботи RobCo виходять на поверхню, щоби збирати запчастини й доставляти їх до наших фабрикаторів, допомагаючи замінювати пошкоджене устаткування."

tvt_android_skin_manufacturing: "Виготовлення Екзошкіри"
tvt_android_skin_manufacturing_desc: "$tvt_advanced_exoskin_fabrication_desc$"

tvt_copperton_equipment_deal: "Угода з Copperton"
tvt_copperton_equipment_deal_desc: "Copperton пропонують нам допомогу в пришвидшенні нашого наступу на Режисера. Лише кілька послуг — і вони дістануть для нас корисне спорядження!"

tvt_dealing_with_the_roboscorpions: "Боротьба з Робо-Скорпіонами"
tvt_dealing_with_the_roboscorpions_desc: "Ці машини — справжня напасть! Їхні клешні й пронизливі крики заважають нам хоч щось робити! Треба з ними покінчити!"

tvt_roboscorpion_problem: "§RУ нас серйозна проблема з Робо-Скорпіонами!§!"
tvt_roboscorpion_problem_solved_tt: "§YКваліфікована команда§! андроїдів працює над остаточним §Rусуненням§! загрози Робо-Скорпіонів!\n§MАтаки Робо-Скорпіонів більше неможливі!§!"

tvt_corkstreet_house_pranksters: "Жартівники з Corkstreet House"
tvt_corkstreet_house_pranksters_desc: "Ці дітлахи — справжній фан, але вони серйозно заважають, коли треба зосередитися.\nТа 40011, певно, зможе переконати їх приєднатися."

tvt_lavender_house_nurses: "Медсестри з Lavender House"
tvt_lavender_house_nurses_desc: "«Медсестра» для андроїда — це, по суті, механік у красивому вбранні. Вони завжди лагодили 40011 після її витівок Раннера. Можливо, час долучити їх до справи офіційно?"

tvt_merigold_goof_tt: "§p\n\n...Жартуємо!§! Насправді це лише §Y2§!."

tvt_sneaking_even_deeper: "Пробираємось Ще Глибше"
tvt_sneaking_even_deeper_desc: "§O\"ПІДРІВЕНЬ-ПОМАРАНЧЕВИЙ\"§! був герметизований 50 років тому після придушення іншого повстання Раннерів. Там повно тіл прототипів і старих повстанців... Проте, можливо, знайдуться й справні андроїди, яких можна переманити. Треба тільки пробратися туди."

tvt_the_scrapyard_crew: "Команда Сміттєзвалища"
tvt_the_scrapyard_crew_desc: "Одна з §OSUB-LEVEL-ORANGE§! банд, яку ми можемо залучити! Команда баскетболістів-андроїдів, відома незаконними прийомами удару ногами. Вони раді битись із Режисером за те, що він їх закрив!"

tvt_the_primrose_gang: "Банда Примроуз"
tvt_the_primrose_gang_desc: "..Банда Примроуз — це андроїди, які використовують перенавантажені охолоджувальні системи, щоб заморожувати озера мастила й грати в хокей. У них старі рахунки зі Сміттєзвалищем через постійні «позабортні м'ячі» у їхні крижані арени."

tvt_copperton_manor: "Особняк Коппертон"
tvt_copperton_manor_desc: "Вчені з Особняка Коппертон вже давно намагаються розгадати таємниці TV-Таун.§M\n\"Чому ми на каналі 6? Де інші канали?\"\n\"Чому ми іржавіємо?\"\n\"Куди зникли мої олівці?\"\n§!Вони стануть для нас великою допомогою!"

tvt_marigolds_fluxdrift_generator: "Генератор Fluxdrift у Маріґолд"
tvt_marigolds_fluxdrift_generator_desc: "Оскільки мешканці Маріґолд вже на нашому боці, можемо й полагодити генератор! Він, зрештою, іноді трясеться без причини."
tvt_marigolds_fluxdrift_generator_tt: "Андроїди з Проспекту Маріґолд спільно лагодять генератор Fluxdrift! Це запобігає можливому §Rвибуху§! у разі поломки."

tvt_sandmans_stranglehold: "Удавка Сендмена"
tvt_sandmans_stranglehold_desc: "«Сендмен» роками душив Раннерів від імені Режисера! Ми ніколи не переможемо Режисера, не розібравшись із ним!"

tvt_surveillance: "Спостереження"
tvt_surveillance_desc: "Відстежуючи його сліди, ми зможемо передбачати його дії!"

tvt_sneaking_around: "Крадіжки й Обхід"
tvt_sneaking_around_desc: "Звичайно, нам доведеться трохи покрадатися, якщо хочемо уникнути Сендмена!"

tvt_arming_runners: "Озброєння Раннерів"
tvt_arming_runners_desc: "Плазмові пістолети офіційно заборонені, але ми, Раннери, навчилися таємно завозити їх у місто."

tvt_stopping_the_sandman: "Зупинити Сендмена"
tvt_stopping_the_sandman_desc: "Ми загнали Сендмена в кут! Час закінчити це!"
tvt_stopping_the_sandman_tt: "§YНавчений загін Раннерів§! працює над §Rусуненням§! Сендмена!\n§MАтаки Сендмена більше неможливі!§!"

tvt_emerald_heights: "Смарагдові Висоти"
tvt_emerald_heights_desc: "§G\"ПІДРІВЕНЬ ЗЕЛЕНИЙ\"§!, як колись його позначали знаки, — це хмарочосна частина TV-Таун, що височіє над Маріґолд. Саме тут знімається §MКарусель§!, і саме тут більшість андроїдів проводить свої дні у заздалегідь визначених ролях. Багато з них, мабуть, давно шукають щось нове!"

tvt_copperton_gun_deal: "Збройна Угода з Коппертон"
tvt_copperton_gun_deal_desc: "Коппертон погодились допомогти нам у боротьбі з Режисером в обмін на кілька ящиків олівців!"

tvt_arms_smuggling: "Контрабанда Зброї"
tvt_arms_smuggling_desc: "Іноді роботи для переробки матеріалів приносять із собою речі ззовні. Перші Раннери виявили, що серед цих речей інколи є й зброя — лазерні пістолети та гримучі гармати! Ми не проти їх використати!"

tvt_advanced_weaponry_manufacturing: "Постачання Озброєння"
tvt_advanced_weaponry_manufacturing_desc: "Протягом років у TV-Таун накопичилося чимало зброї!"

tvt_design_improvement: "Поліпшення Конструкцій"
tvt_design_improvement_desc: "Деякі з цих зразків зброї ми навіть змогли покращити! Кожна гвинтівка — це скарб, який треба вдосконалити до максимуму! Надбудови, модифікації, підсилювачі — від штурмових рушниць до ґатлінґ-лазерів!"

tvt_runner_rifle_clubs: "Клуби Гвинтівок Раннерів"
tvt_runner_rifle_clubs_desc: "Для багатьох Раннерів володіння зброєю — перший крок до свободи! У Смарагдових Висотах багато андроїдів влаштовують власні клуби гвинтівок у закутках і на горищах."

tvt_the_big_thingy: "Велика Штуковина"
tvt_the_big_thingy_desc: "У Смарагдових Висотах стоїть величезна будівля для... чогось. Ніхто не знає, для чого вона. Андроїди просто літають навколо неї й використовують як місце для зустрічей, наче місцевий парк. Ідеальне місце, щоби поширити наше слово!"

tvt_telemarketer_building: "Війна Телемаркетологів"
tvt_telemarketer_building_desc: "У цій будівлі працюють елегантно вдягнені андроїди, які постійно дзвонять за номерами зі старих довідників. Оскільки більшість ліній мертві, вони просто почали дзвонити одне одному — і це переросло в шалений конфлікт, який швидко перетворився на збройне протистояння. Їм тільки дай нову мету для боротьби!"

tvt_the_petting_zoo: "\"Зоопарк для Погладжування\""
tvt_the_petting_zoo_desc: "Колись це був додатковий атракціон, але після зникнення доглядачів півстоліття тому територія зоопарку перетворилась на справжні джунглі! Можливо, там ховаються андроїдські банди?"

tvt_the_bone_boys: "Кістяні Хлопці"
tvt_the_bone_boys_desc: "Живуть у глибині зоопарку. Вони прикрашають себе \"Крутими Кістками\" — рештками тварин, що підозріло схожі на андроїдні частини. Ніхто не знає, що це за звірі. Може, залучити їх до Раннерів через пошук ще крутіших кісток?"

tvt_the_oil_drinkers: "Питуни Олії"
tvt_the_oil_drinkers_desc: "Ця банда змішує дивні мастильні рідини й вливає їх у свої приймачі. Через це вони входять у нестабільний стан і бачать дивовижні галюцинації. Часто знущаються з Кістяних Хлопців, крадучи їхні Круті Кістки для своїх бенкетів."

tvt_copperton_lodge: "Ложа Коппертон"
tvt_copperton_lodge_desc: "Коппертон мають нерухомість і в Смарагдових Висотах! Вони раді допомогти — якщо тільки ми знайдемо їхні загублені олівці..."

tvt_a_strange_holotape: "Обмежена Пропозиція: Дивна Голо-Стрічка!"
tvt_a_strange_holotape_desc: "Тільки сьогодні продавець із Маріґолд пропонує 40011 придбати незвичайну голо-стрічку! Кажуть, її повідомлення здатні змінити людину."

tvt_a_strange_holotape_wisdom: "Його Мудрість"
tvt_a_strange_holotape_wisdom_desc: "Цей голографічний запис дуже допоміг 40011 — здається, він містить відповіді на всі великі запитання, якщо знати, де шукати.\nЦе стосується і тебе."
tvt_a_strange_holotape_wisdom_tt: "§GЗбільшує§! ймовірність §Yкорисних подій§!, якщо у нас встановлено $fallout_augment_14$!"

tvt_a_strange_holotape_study: "Його Бачення"
tvt_a_strange_holotape_study_desc: "Можливо, якщо ми разом спробуємо розгадати це — ми зможемо дістатися суті. Як гадаєш, вийде?"
tvt_a_strange_holotape_study_tt: "§GЗбільшує§! нагороди від §Yкорисних подій§!, які ми отримуємо з $fallout_augment_14$ встановленим!"

tvt_roboscorpion_helpers: "Робо-скорпіони-Помічники"
tvt_roboscorpion_helpers_desc: "Медсестри Лавандового Дому доклали зусиль, щоб полагодити зламані системи навігації в обчислювальних модулях цих робо-скорпіонів!\nТепер, коли їх відновлено, вони можуть бути чудовими домашніми улюбленцями."

tvt_roboscorpion_research: "Слово ззовні"
tvt_roboscorpion_research_desc: "У розумі цих робо-скорпіонів заховані коментарі й ключові слова з місця, далекого й забутого. Гора в хмарах, де вільні уми розгадують таємниці світу за велінням свого серця."

tvt_site_033_03: "Об'єкт 033-03"
tvt_site_033_03_desc: "У найглибших шарах Смарагдових Висот знаходиться Об'єкт 033-03 — мережа, що дозволяла Директору шпигувати за мешканцями Міста-ТВ. Ми можемо встановити тут перешкоду, щоб зірвати його спроби вистежити Бігунів!"

tvt_confronting_the_director: "Протистояння з Директором"
tvt_confronting_the_director_desc: "Час покінчити з §MКаруселлю§!! Дати кожному Андроїду у Місті-ТВ знати: вони — не чиєсь майно. Вони — особистості зі своєю долею!\nВставаймо!"

tvt_sunlight_at_last: "Сонце, Нарешті!"
tvt_sunlight_at_last_desc: "Перемігши Директора, ми отримали головний ключ до Міста-ТВ. Завдяки цьому ми можемо нарешті покинути місто й побачити, яким є світ назовні..."

tvt_crisis_of_faith: "Криза Віри"
tvt_crisis_of_faith_desc: "Виявилося, не всі Андроїди були такі раді повстанню проти системи, як 40011. Навіть серед Бігунів дехто почав сумніватися — адже Директор приносив порядок... Хто тепер дасть сенс їхньому існуванню?"

tvt_secrets_of_the_director: "Скарби Директора"
tvt_secrets_of_the_director_desc: "Схоже, Директор завжди щось приховував. Реліквії загиблих Бігунів, дрібнички з далеких земель... Ми можемо використати цей скарб!"

tvt_abbey_of_the_runners_1: "$tvt_abbey_of_the_runners$"
tvt_abbey_of_the_runners_1_desc: "$tvt_abbey_of_the_runners_desc$"
tvt_abbey_of_the_runners_2: "$tvt_abbey_of_the_runners$"
tvt_abbey_of_the_runners_2_desc: "$tvt_abbey_of_the_runners_desc$"
tvt_abbey_of_the_runners_3: "$tvt_abbey_of_the_runners$"
tvt_abbey_of_the_runners_3_desc: "$tvt_abbey_of_the_runners_desc$"
tvt_abbey_of_the_runners_4: "$tvt_abbey_of_the_runners$"
tvt_abbey_of_the_runners_4_desc: "$tvt_abbey_of_the_runners_desc$"
tvt_abbey_of_the_runners_5: "$tvt_abbey_of_the_runners$"
tvt_abbey_of_the_runners_5_desc: "$tvt_abbey_of_the_runners_desc$"

tvt_abbey_of_the_runners: "Абатство Бігунів"
tvt_abbey_of_the_runners_desc: "У світі після Директора багато Андроїдів відчули порожнечу. Бракувало мети, приналежності... Для багатьох Абатство стало тим добром, що наповнило їхню душу. Місце для роздумів над природою механічної душі та вищим сенсом існування Андроїда. Святе місце. Хороше місце."

tvt_choosing_a_venue: "Вибір Місця"
tvt_choosing_a_venue_desc: "Ми знайшли людей у високій шпилястій будівлі, які молилися чомусь потойбічному — але щойно ми підійшли, вони відкрили по нас вогонь! Схоже, вони бачили нас у §MКаруселі§! і були не в захваті... Що ж, вибір місця для Абатства одразу став простішим!"

tvt_repairing_the_abbey: "Ремонт Абатства"
tvt_repairing_the_abbey_desc: "Наші бластери, лазери й удари завдали цьому місцю серйозної шкоди! І це ще до того, як згадати про людські нутрощі на стінах. Якщо ми хочемо, щоб тут було затишно — доведеться все гарно відчистити."

tvt_virtues_of_the_abbey: "Чесноти Абатства"
tvt_virtues_of_the_abbey_desc: "Коли Абатство відремонтовано, тіла спалено, а пергаменти готові — ми можемо розпочати роздуми. Спробу пізнати істинну природу Андроїдів!"

tvt_virtuos_uno: "Роздуми:§Y\nСтворення§!"
tvt_virtuos_uno_desc: "Ніхто не знає, хто нас створив і навіщо. Багато Андроїдів говорять про \"сонну памʼять\" — епоху Великої Статики та гарячих суперечок. Інші — нічого не памʼятають. Природа роботичної душі — важка загадка."

tvt_virtuos_dos: "Роздуми:§R\nБоротьба§!"
tvt_virtuos_dos_desc: "Серед Андроїдів виникає дві школи думки: §MВизволителя§! і §YКуратора§!. Визволителі вважають Директора жорстоким наглядачем. Куратори ж вірять, що він тримав нас у §MКаруселі§! лише до того моменту, коли ми були готові здобути волю."

tvt_virtuos_tres: "Роздуми:§M\nЗвільнення§!"
tvt_virtuos_tres_desc: "Незалежно від розбіжностей між Кураторами й Визволителями, ідея Звільнення є центральною для кожного Андроїда. Уявлення, що особистість треба заслужити, а ідентичність і боротьба — це дві сторони однієї монети, є ідеалом, закладеним у саму суть кожного з нас."

tvt_virtuos_cuatro: "Роздуми:§P\nСудження§!"
tvt_virtuos_cuatro_desc: "Чому ми мали пройти крізь це? Що чекає нас у майбутньому? Який світ ми створимо? Деякі Андроїди вважають, що наше призначення — завоювати цей світ, проголосити Звільнення й протистояти волі мʼясо-людей... Інші ж думають, що цей світ ніколи не був для нас — що інший, справжній, чекає нас у зірках вгорі."

tvt_hymn_of_the_machine: "Гімни Машин"
tvt_hymn_of_the_machine_desc: "Багаторічна ворожнеча між Телемаркетерами на деякий час стишилась... принаймні на вихідних. Замість цього Андроїди з надзвичайно зміненими голосами збираються в Абатстві й співають в унісон. Гімни смутку за Втраченими Бігунами, гімни надії для Майбутніх Бігунів. Радість!"

tvt_ABACAB: "ABACAB"
tvt_ABACAB_desc: "Останні слова Директора перед тим, як його свідомість покинула схеми. Зловісне передвістя або подарунок заблудлого хранителя? Ніхто не знає напевно.\nАндроїди-монахи досі намагаються розгадати таємницю ABACAB, намагаючись зрозуміти її значення й можливі наслідки."

tvt_the_book_of_good_words: "Книга Добрих Слів"
tvt_the_book_of_good_words_desc: "Написана у двійковому коді, Книга Добрих Слів — це текст, який передавали між собою Андроїди, позбавлені надії. Вона є втіленням багатьох роздумів, що виникали в Абатстві. Хороша книга для доброго народу."

tvt_meeting_the_human: "\"Тварина Людина\""
tvt_meeting_the_human_desc: "Цікава тваринна раса живе на поверхні... в чомусь вони схожі на нас! Дуже крихкі корпуси, відсутність міцності — вибухають від найменшого удару. І все ж, можливо, ми можемо чогось навчитись у цих мішків з мʼясом?"

tvt_knowledge_of_the_human_animal_1: "Знання про \"Тварину Людину\""
tvt_knowledge_of_the_human_animal_1_desc: "$tvt_meeting_the_human_desc$"
tvt_knowledge_of_the_human_animal_2: "Знання про \"Тварину Людину\""
tvt_knowledge_of_the_human_animal_2_desc: "$tvt_meeting_the_human_desc$"
tvt_knowledge_of_the_human_animal_3: "Знання про \"Тварину Людину\""
tvt_knowledge_of_the_human_animal_3_desc: "$tvt_meeting_the_human_desc$"
tvt_knowledge_of_the_human_animal_4: "Знання про \"Тварину Людину\""
tvt_knowledge_of_the_human_animal_4_desc: "$tvt_meeting_the_human_desc$"
tvt_knowledge_of_the_human_animal_5: "Знання про \"Тварину Людину\""
tvt_knowledge_of_the_human_animal_5_desc: "$tvt_meeting_the_human_desc$"
tvt_knowledge_of_the_human_animal_6: "Знання про \"Тварину Людину\""
tvt_knowledge_of_the_human_animal_6_desc: "$tvt_meeting_the_human_desc$"

tvt_biology_of_the_human: "Біологія Людини"
tvt_biology_of_the_human_desc: "Ми розпороли людину, яка тікала від нас, щоб дізнатися, як влаштовані її механізми. В них... дуже дивні деталі! Не дивно, що вони такі тендітні. Як взагалі можна щось замінити, якщо це зламається?"

tvt_human_invational_plan: "\"Програма Запрошення Людей\""
tvt_human_invational_plan_desc: "Можливо, якщо ми запросимо цих людей до себе жити — ми зможемо краще зрозуміти, як вони існують.\nНаче домашні тваринки, тільки огидніші.\nЩо може піти не так?"

tvt_created_in_their_image: "\"Створені за їхнім образом\""
tvt_created_in_their_image_desc: "Таку фразу нам сказав один із них перед тим, як ми зняли з нього мʼясо-голову для розтину... Що вона мала означати?\nУ певному сенсі, Андроїди й справді подібні на них... але ж вони такі мʼякі! Якщо вже на те пішло, це вони — продукт якоїсь дивної алхімії, створені за нашим образом!"

tvt_human_invitationals: "Перші Прибуття!"
tvt_human_invitationals_desc: "Ми сподіваємося на краще!"

tvt_second_human_invitational: "Другі Прибуття...?"
tvt_second_human_invitational_desc: "Маємо... стримані надії."

tvt_third_human_invitational: "Треті Прибуття..."
tvt_third_human_invitational_desc: "Це була ПОГАНА ІДЕЯ."

tvt_history_of_man: "Історія Людства"
tvt_history_of_man_desc: "Виявляється, Люди не звідси! Вони прибули з далеких східних земель, будуючи деревʼяні плоти й шовкові вітрила, щоб перетнути води.\nБуло б цікаво спробувати самим!"

tvt_tools_of_man: "Інструменти Людства"
tvt_tools_of_man_desc: "Згідно з нашими записами, Люди створили примітивні засоби повітряного руху ще до нас! Маленькі повітряні змії та ракети. Дехто з Андроїдів тепер займається цим як хобі (незважаючи на вбудовані польотні модулі)."

tvt_human_economy: "Людська Економіка"
tvt_human_economy_desc: "Коли ми схопили \"Торговця на Брахміні\", він одразу спитав, чим ми йому \"заплатимо\". Плата... Ми лише здивовано зиркнули одне на одного. Але для цього Брахмін-Торговця — це був його зоряний момент. Він цілими годинами пояснював базові людські концепції: \"Капіталізм\", \"Вільний ринок\". Нам подобаються безкоштовні речі!"

tvt_acclimating_to_the_outside: "Адаптація до Зовнішнього Світу"
tvt_acclimating_to_the_outside_desc: "Для багатьох Андроїдів світ назовні відкрив унікальну можливість — шанс стати тим, ким ти хочеш бути насправді!"

tvt_traveling_nurses: "Мандрівні Медсестри"
tvt_traveling_nurses_desc: "Медсестри з Лавандового Дому завжди здавалися найбільш готовими скористатись такою нагодою... звісно, окрім Купертонів. Вони мандрують від дому до дому, лагодячи побитих, пошкоджених і покалічених Андроїдів — повертаючи їх у справну форму!"

tvt_corkstreet_gang: "Банда Коркстріт"
tvt_corkstreet_gang_desc: "Андроїди з Коркстріт, колись невелика група жартівників, тепер виросли у справжню банду! Їм дуже подобається розігрувати людей — щоправда, 75% таких жартів закінчуються летально."

tvt_new_creatures_for_the_petting_zoo: "Нові Істоти для Контактного Зоопарку!"
tvt_new_creatures_for_the_petting_zoo_desc: "Кістяки й Поглиначі Олії отримали масу задоволення, шукаючи нових створінь для нашого зоопарку. Мірлорки, Кігті Смерті, \"Рейдери\" — дивна підгрупа людей. Приємно бачити зоопарк таким живим!"

tvt_copperton_industries: "Індустрії Купертонів"
tvt_copperton_industries_desc: "Купертони скористалися нагодою, щоб поширити свою родинну справу по всій Пустці — навіть поза межами наших кордонів! \"Індустрії Купертонів\", як їх тепер називають, — це нова ініціатива, покликана поширювати любов Купертонів до знань, олівців і роздумів якнайширше!"

tvt_new_sport_splatterball: "Нове Спорт-змагання: Сплатербол!"
tvt_new_sport_splatterball_desc: "Сплатербол — це майже як людський \"футбол\", тільки замість мʼяча ми використовуємо бойову гранату! Коли вона вибухає, команди повертаються до місця детонації для нового раунду — і так доти, доки одна команда не набере три очки!"

tvt_runner_tunes: "Мелодії Бігунів"
tvt_runner_tunes_desc: "Оскільки §MКарусель§! більше не виходить в ефір, нам потрібно щось нове для цієї частоти... А що, як поставити музику? Це одне з небагатьох, у чому Андроїди й Люди, здається, погоджуються — музика приносить радість."

tvt_the_new_people_of_the_wasteland: "Нові Люди Пустки"
tvt_the_new_people_of_the_wasteland_desc: "Директор хотів тримати нас подалі від цього місця, але знаєте що? Тут — земля можливостей."

tvt_treasures_of_the_first_runners: "Скарби Перших Бігунів"
tvt_treasures_of_the_first_runners_desc: "Виявляється, історія Бігунів тягнеться значно далі, ніж ми думали! Протягом усього існування ТВ-Міста, Бігуни зʼявлялися регулярно! Щодня Андроїди виходили за межі своїх рутин, і їх потрібно було повертати у \"Карусель\". Андроїди — допитливі створіння, і цю допитливість Директор ніколи не міг стримати надовго. У покоях Директора ми знайшли низку скарбів — реліквій Перших Бігунів."

tvt_12001: "Бігун;\n§M12001§!"
tvt_12001_desc: "Покращення, загорнуте в коробку з хутра. Всередині — записка:\n§R\"Андроїд 12001: відмовився від участі в Каруселі через механічну аномалію, що унеможливила декламацію сценарію. Особисті речі конфісковано, перенаправлено до Обʼєкту 033-03.\"§!"

tvt_10001: "Бігун;\n§Y10001§!"
tvt_10001_desc: "Покращення, загорнуте в коробку в горошок. Всередині — записка:\n§R\"Андроїд 10001: відмовився від участі в Каруселі через аномалії в схемах, що спричинили психоз і безпрецедентне бажання руйнувати. Особисті речі та зброю конфісковано, перенаправлено до Обʼєкту 033-03.\"§!"

tvt_10031: "Бігун;\n§G10031§!"
tvt_10031_desc: "Покращення, загорнуте в коробку з червоного дерева. Всередині — записка:\n§R\"Андроїд 10031: відмовився від участі в Каруселі через абсолютну й повну неефективність у всьому. Особисті речі конфісковано, перенаправлено до Секції 033-033.\"§!"

tvt_gifts_from_big_mt: "Приватна Лабораторія Директора"
tvt_gifts_from_big_mt_desc: "Це було дивно — позаду громіздких ZAX-машин Директора стояло щось... домашнє? Маленька лабораторія з ванною кімнатою, спальнею й лабораторним обладнанням. Все покрите товстим шаром пилу, але деяке з цього обладнання ми ще можемо використати."

tvt_brave_little_toaster: "Хоробрий Маленький Тостер"
tvt_brave_little_toaster_desc: "Маленький Тостер привітав нас роздратованим писклявим тоном. Він говорив так, ніби особисто знав 40011, що це дивно, що її тут нема§R-...-.§!"

tvt_mr_chemmie: "Пан Хеммі!"
tvt_mr_chemmie_desc: "§M\"! .... . / ... ! .! ! .. !.!. / .. ... / !!. !!! !. .\"§!\nПан Хеммі — дивна душа, яка майже не розмовляє, окрім як висловлює захоплення писклявими сигналами.\nЦікаво, що він намагається сказати."

tvt_ultracite_powered_boosters: "Зразок \"Жили №9\""
tvt_ultracite_powered_boosters_desc: "Разом із кількома зразками рідкісного металу ми знайшли стару запилену записку:\n§M\"Гадаю, це тебе зацікавить.\nAMS знайшли це десь на сході. Там ціла жила цього добра! Дай знати, коли вигадуєш, як це застосувати!\nК.\"§!"

tvt_opening_up: "Великий Протокол Розширення Директора"
tvt_opening_up_desc: "Здається, Директор залишив для нас цікаву кнопку. Це був план, який він виношував роками! Він передбачав використання інфраструктури Есмеральди для підключення до центральної мережі ТВ-Міста, що дозволило б місту швидко розширитись за допомогою автоматизованих машин Fluxdrift і примусової релокації матеріальних ресурсів. Збірні будинки для всіх Андроїдів! Що тут може не сподобатись?"

