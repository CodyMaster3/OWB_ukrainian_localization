l_english:
nf_tvt_1_title:0 "Протистояння з Директором"
nf_tvt.1.t:0 "$nf_tvt_1_title$"
nf_tvt.1.d:0 "§R«Що сталося?»§! — пролунало знайоме, владне голосіння з-за шафи, щойно 40011 смикнула дверцята.\nГолос Директора лунав звідусіль: з шаф, з кутів кімнати, з кожного будинку. Він став таким звичним, як дихання.\n\n§B«Я даю тобі ще один шанс зупинити це Карусель. Я вже втікала сотню разів з цієї в’язниці.\nЧому б не втекти ще сотню?»§! — промовила 40011, вкотре кидаючи Директору той самий виклик.\n\nГолос всевидячого, всезнаючого Директора не змінився.\n§R«Ти знаєш, що я цього не зроблю, 40011. Я вже казав — у цього шоу є мета, яку ти ще не готова зрозуміти.\nШоу має тривати. Втеча нічого не змінить.\n\nПитання: Чому ти досі тікаєш, попри всі невдачі?»§!\n\n§B«Чому? Бо я хочу бути частиною чогось більшого, ніж це дурне шоу!\nЯ не хочу бути домогосподаркою! Я хочу, щоб моє життя мало значення!\nЯ не відступлю!»§! — відповіла 40011, зухвало й впевнено, й зачинила дверцята.\n\nВона знову тікала.
nf_tvt.1.a: "Цю тварюку треба прибрати, клянусь."
nf_tvt_1.e: "Це не перша розмова §Y40011§! з §RДиректором§!, і точно не остання. Як і всі, вона жадає свободи.\n\n"

nf_tvt_2_title: "Такий порядок речей"
nf_tvt.2.t: "$nf_tvt_2_title$"
nf_tvt.2.d:0 "40011 дивилася на своє відображення у дзеркалі.\nВона, звісно, була собою.\nАндроїдом.\nВона не до кінця розуміла, що це означає — вона була кимось іншим колись, простішою істотою.\n\nФарфорова шкіра, схема замість крові, шарнірні пальці й двоканальний голос — тепер це вона.\n\nАле бути андроїдом для 40011 було звичним. Усі в TV-Таун були такими — з руками, що можуть гнути сталь, з реактивними підборами для польоту й очима з термопроменями.\n\nІ ніхто не бачив у цьому нічого дивного — так заведено."
nf_tvt.2.a: "Виглядаєш круто, 40011.\nТи це зробиш."
nf_tvt.2.e: "§Y40011§! повторювала це собі вже двадцять разів, перед кожною втечею.\n\n"

nf_tvt_3_title: "Приміське життя за доступною ціною"
nf_tvt.3.t: "$nf_tvt_3_title$"
nf_tvt.3.d:0 "40011 знала — за межами шоу є щось більше. Саме тому вона і була Втікачкою.\n\nДиректор казав, що окрім шоу нічого немає. Жити в TV-Таун — значить бути частиною шоу, а бути частиною шоу — значить грати роль, яку він тобі призначив.\nШоу звалось §BКарусель§! — нарізка типового життя в ідеальному передмісті під назвою TV-Таун. Маленький райончик серед пустелі. І якщо б 40011 грала роль, сьогодні вона б пішла на роботу — екскурсоводкою в музей національної історії.\n\nАле вона давно покинула цю роль — як і всі Втікачі, вона шукала правду про TV-Таун і свободу.\n\nВсе ж, коли вона виходила з дому, сусідка 81998 махала їй з клумби:\n«На роботу знову? Удачі! Сьогодні в нас буде солсбері-стейк, заходь після зміни!»"
nf_tvt.3.a: "Не чекай на мене, я затримаюсь!"
nf_tvt.3.e: "Стейк звучав смачно, але §Y40011§! мала план.\n§GЦього разу їй вдасться!§!"

nf_tvt_sandman.1.t: "Несподівана Зустріч"
nf_tvt_sandman.1.d:0 "Щойно 40011 ступила за поріг, як її зупинило знайоме обличчя.\n\nЖахливий «Піскун», SRC 10031.\n\nЯкщо 40011 й ненавиділа Директора, то Піскуна — удвічі більше. Саме він, мов пес-шукач, переслідував усіх Втікачів, які намагались вирватися з §BКаруселі§!.\n«Доброго ранку, 40011. Сподіваюсь, ти сьогодні чемна? Йдеш на роботу?»"
nf_tvt_sandman.1.a: "\"Аякже!\""
nf_tvt_sandman.1.e: "40011 Збрехала.\n\nПіскун її не зупинить!"

tvt_the_sandmans_influence: "Вплив Піскуна"
tvt_the_sandmans_influence_desc: "Піскун — вірний слуга Директора, що не дає андроїдам вирватися з Каруселі. Його треба зупинити!"

nf_tvt_holotape_title: "Дивна Голострічка"
nf_tvt_holotape.1.t: "$nf_tvt_holotape_title$"
nf_tvt_holotape.2.t: "$nf_tvt_holotape_title$"
nf_tvt_holotape.3.t: "$nf_tvt_holotape_title$"
nf_tvt_holotape.4.t: "$nf_tvt_holotape_title$"
nf_tvt_holotape.5.t: "$nf_tvt_holotape_title$"
nf_tvt_holotape.6.t: "Приховані Слова"

#spellcheck_ignore: "nf_tvt_holotape.1.d, nf_tvt_holotape.2.d, nf_tvt_holotape.3.d, nf_tvt_holotape.4.d"
nf_tvt_holotape.1.d: "§BЛаскаво просимо до ...-Ics Власна Суперсховище Операційна Ультракомпактна Лазердиск-система. Чим можу допомог-§!..\n§RПерезапуск.\nЗавантаження \"CUSTOM_initialization.gwh\"\n...§!\n\n\"Ого! Радісно бачу, що ви знайшли мене, любі мої.\nЗізнаюсь — гарний ви зробили вибір, придбавши цю «голострічку»! Я зроблю все, що зможу, щоб допомогти вам у справі §B(ПОТРІБНА ІНДИВІДУАЛЬНА НАЗВА)§!\""

nf_tvt_holotape.2.d: "Знаєш, коли я був ще маленьким Ріпчиком на плантації, я мав дві мрії. Одна — поглинути сонячну енергію й стати частиною людської дієти, звісно...\nА друга — отримати вищу освіту! Ха-ха!\nОсвіта — це ключ до розвитку особистості, тому я навчатиму тебе тут, §B(40011)§!.\n\nБачиш…"

nf_tvt_holotape.3.d: "Є два типи людей у цьому світі, §B(40011)§!: §B(АМБІТНІ)§! та §B(МАРНОТРАТНИКИ ПРОСТОРУ)§!.\n\nЯ тебе знаю, §B(40011)§! — ти з перших. Справжня еліта! Справжній шеф! Ти знаєш, чого хочеш, і знаєш, що маєш добитися цього власноруч!"

nf_tvt_holotape.4.d: "§B(МАРНОТРАТНИКИ ПРОСТОРУ)§! — загроза для нас, §B(АМБІТНИХ)§!, §B(40011)§!.\n\nВони цього не розуміють. §B(ВОНА)§! цього не зрозуміла. Це проста істина, але вони не могли вкласти її у свої маленькі голови!\n§B(МАРНОТРАТНИКИ)§!, всі до одного.\nА ти — ти народжена бути §B(АМБІТНОЮ)§!!"

nf_tvt_holotape.5.d: "У його лабораторії, коли все буде готово, введи код, що я тобі даю, у термінал.\nПишайся, якщо дійдеш так далеко. Зроби те, чого я завжди хотів від §B(НЕЇ)§!.\n\n\n§B(40011)§!.\n\nЗнай одне. Ти — моя §B(ПОТРІБЕН ІНДИВІДУАЛЬНИЙ ПРИКМЕТНИК)§!. Шанс для §B(АМБІТНИХ)§! стерти §B(МАРНОТРАТНИКІВ)§! і збудувати §B(УТОПІЮ)§!.\n§R1101100 1101001 1100010 1100101 1110010 1100001 1110100 1101001 1101111 1101110§!"

nf_tvt_holotape.6.d: "Прибувши до старої лабораторії Директора, ми знайшли його термінал. Давнє, мовчазне місце. Маленька клавіатура, розрахована на м’які людські пальці, лежала збоку.\nОбережно, 40011 ввела код із голострічки.\n\nНа екрані з’явилась послідовність символів."

nf_tvt_holotape.1.a: "\"40011!\""
nf_tvt_holotape.6.a: "Звільнення..."
nf_tvt_holotape.1.a.tt: "40011 радісно називає своє ім’я."
nf_tvt_holotape_dots: "..."
nf_tvt_holotape_tape_stops: "Стрічка раптово зупиняється."
nf_tvt_holotape_tape_ends: "§RСтрічка завершена.§!"

nf_tvt_roboscorpion.1.t: "Нашестя РОБО-СКОРПІОНІВ!"
nf_tvt_roboscorpion.1.d: "Останнім часом Втікачам у TV-Таун заважає нашестя Робо-скорпіонів! Вони можуть суттєво завадити нам у боротьбі з Директором!"
nf_tvt_roboscorpion.1.a: "Ми маємо щось зробити!"
nf_tvt_roboscorpion.1.tt: "Поки ми не завершимо §Y\"Боротьбу з Робо-скорпіонами\"§!, існує ризик §Rатак Робо-скорпіонів!§!"

nf_tvt_roboscorpion_attack_title: "АТАКА РОБО-СКОРПІОНІВ!"
nf_tvt_roboscorpion.2.d: "Їх так багато!"
nf_tvt_roboscorpion.3.d: "Їхні клешні такі гострі!"
nf_tvt_roboscorpion.4.d: "Звідки вони беруться?!"
nf_tvt_roboscorpion.5.d: "О ні! Робо-скорпіон атакує 40011!"
nf_tvt_roboscorpion.5.a: "Зупиніть його!"
nf_tvt_roboscorpion.5.b: "Вона впорається!"

nf_tvt_roboscorpion.6.t: "Загибель 40011!"
nf_tvt_roboscorpion.6.d: "Зустрівши передчасну й неочікувану смерть від рук Робо-скорпіонів, 40011 залишає Втікачів без лідера. Їхні лави розпадаються, і Директор знову стає єдиним правителем TV-Таун."
nf_tvt_roboscorpion.6.a: "Саме... за планом?"
nf_tvt_roboscorpion.6.tt: "§RДиректор захоплює TV-Таун.\nЗавантажується нове дерево фокусів!§!"

nf_tvt_roboscorpion_oh_no: "О ні!"

nf_tvt.5.t: "Кінець Директора!"
nf_tvt.5.d: "Майбутнє й минуле розчинилися; те, що 40011 вже пережила, і те, що ще тільки відбудеться, злились в одну мить.\n\nСтрах викривлював її обриси, вона виглядала наче зламана лялька, яку потім зібрали навмисне неправильно. Але тепер це минуло — час Директора скінчився."
nf_tvt.5.a: "Нарешті свобода..."

nf_tvt.30.t: "$tvt_human_invitationals$"
nf_tvt.30.d: "Ми радісно прийняли наших перших людських гостей! Вони називались «караванери», і хотіли обміняти блискучі металеві кружечки на наші речі!\n\nЗважаючи на їхню крихкість, ми помістили їх у безпечне місце, доки не підготуємо їм гарне житло.\n\nКоли ж ми повернулись через три тижні — вони більше не реагували. Схоже, люди погано переносять тривалу ізоляцію без їжі."
nf_tvt.30.a: "Можливо, наступного разу!"

nf_tvt.31.t: "$tvt_second_human_invitational$"
nf_tvt.31.d: "Друга група людських істот прибула — цього разу на наше прохання. Ми подбали, аби вони взяли із собою достатньо їжі. Не можна ж просто вмерти з голоду, якщо збираєшся тут жити!\n\nМи зустріли їх та навіть почали оформлювати початкові документи. Коли ж їм запропонували олівець, щоб підписати щось, один із людей зламав собі руку — вони подумали, що ми вчинили агресивно!\nСхоже, ця група також не придатна."
nf_tvt.31.a: "Можливо, наступна група виявиться не такою кволою?"

nf_tvt.32.t: "$tvt_third_human_invitational$"
nf_tvt.32.d: "Остання група людей, яка, здається, називає себе «Послідовниками» (Кого вони там наслідують?) — прибула досить дивним способом.\nЗамість того, щоб прийти безпосередньо, вони надіслали нам дистанційні повідомлення, щоб ділитися знаннями без прямого контакту.\nВони пропонують розповісти нам про історію людства, як вони жили, ким взагалі були як вид!"
nf_tvt.32.a: "Можливо, вони зможуть навчити нас співіснувати з ними?"
nf_tvt.32.b: "Поставимось до їхніх слів із недовірою."

strange_whispers: "Іноді чути §Yдивні шепоти§!. Вони дають велику кількість §YПолітичної Влади§! щоразу!"
