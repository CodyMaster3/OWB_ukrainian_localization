l_english:
followers_spreading_idea: "Послідовники, що розповсюджують ідеї"
followers_spreading_idea_desc: "Після свого встановлення в нашій столиці, Послідовники Апокаліпсису швидко поширюються по нашій нації, приносячи з собою свої вірування та ідеали. У результаті наш народ починає відходити від наших войовничих шляхів, але разом з тим стає більш освіченим."
followers_rejected_idea: "Послідовники Апокаліпсису відкинуті"
followers_rejected_idea_desc: "Послідовники намагались розповсюдити свої брудні анархістські щупальця по нашій нації, але ми встояли перед їхніми спробами! Однак наша нація була назавжди змінена цим процесом..."
followers_influence_modifier: "Вплив Послідовників"
followers_influence_modifier_desc: "Після свого встановлення на нашій території, Послідовники Апокаліпсису почали впливати на нашу країну та уряд. Ми повинні стежити за ними..."
do_not_spread_followers_to_this_tag: "Послідовники Апокаліпсису не повинні наближатися до нашої нації!"
followers_established_idea: "Послідовники Апокаліпсису"
followers_established_idea_desc: "Після свого встановлення на нашій території, Послідовники Апокаліпсису почали впливати на нашу країну та уряд. Ми повинні стежити за ними..."
