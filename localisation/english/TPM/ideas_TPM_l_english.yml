l_english:

tpm_frequently_raided: "Часті напади"
tpm_frequently_raided_desc: "Попри всі наші зусилля з підтримки впливу Патрульних на сільських територіях, нас досить часто обирають мішенню для нападів, і Лафайєт мусить рятувати Блафф від бандитських атак кожні пару місяців. Якщо ми повинні вгадати причину, то, ймовірно, це через тих гребаних мафіозі з Нового Орлеана, які беруть свою частку з експедицій, що проходять нашими землями. Але ми не можемо довести, що це саме вони, хоча завжди видно, що нападники приходять з боку Александрії і втікають на шлюпках через Каннері. Сподіваємося, що ми колись знайдемо спосіб покласти кінець цим нападам, але поки що? Здається, доведеться просто продовжувати триматися." 

tpm_rest_stop: "Зупинка Луїзіани"
tpm_rest_stop_desc: "В нашій ранній післявоєнній історії Лафайєт виявився дивно стабільним містом серед моря хаосу. Тоді як більшість інших міст, що були знищені ядерними ударами, або згинули, або ледь втрималися, а деякі міста, які вціліли, впали через голод або варварство через колапс постачання Америки, Лафайєт тримався і мирно відновлювався після того, як його бомбардували. Коли бандити почали наближатися, їх було настільки мало, що навіть звичайні мешканці почувалися безпечно у своїх домівках. Час змінюється, звісно, але це момент гордості для нас, що ми ніколи не були в серйозній небезпеці, і нас знають по болотах Луїзіани як безпечне місце для тих, хто хоче піти на спокій."

tpm_history: "Трудно здобута історія"
tpm_history_desc: "В нашій ранній післявоєнній історії Лафайєт виявився дивно стабільним містом серед моря хаосу. Тоді як більшість інших міст, що були знищені ядерними ударами, або згинули, або ледь втрималися, а деякі міста, які вціліли, впали через голод або варварство через колапс постачання Америки, Лафайєт тримався і мирно відновлювався після того, як його бомбардували. Але це не тривало вічно, і не довго після того, як наші далекі предки відновили центральну частину міста, бандити почали свої напади. Ми створили Перший Лафайєтський Патруль як відповідь на цю загрозу, і вони чудово справилися з відбиттям нападів. Після кількох громадських криз Патруль змінив назву на Другий Лафайєтський Патруль, і ця традиція зміни іменування Патруля тривала до того часу, поки ми не стали 10-им Патрулем. Це було не просто, утримувати натовпи бандитів кожні кілька років, але добрі люди Лафайєта впоралися з цим завданням."

tpm_legendary_lawman: "Легендарний правозахисник"
tpm_legendary_lawman_desc: "В нашій ранній післявоєнній історії Лафайєт виявився дивно стабільним містом серед моря хаосу. Тоді як більшість інших міст, що були знищені ядерними ударами, або згинули, або ледь втрималися, а деякі міста, які вціліли, впали через голод або варварство через колапс постачання Америки, Лафайєт тримався і мирно відновлювався після того, як його бомбардували. Але це не тривало вічно, і не довго після того, як наші далекі предки відновили центральну частину міста, бандити почали свої напади. Поки хороші люди Лафайєта намагалися організувати Перший Лафайєтський Патруль, напади бандитів ставали все більш відчайдушними. В одну трагічну ніч маленький нічний патруль, що охороняв Лафайєт, був переможений, і бандити прорвали наші імпровізовані барикади та увірвалися до парку в центрі міста, із лідером на чолі колон. Але один чоловік (який згодом стане першим шефом Патруля) зустрів усю групу бандитів і викликав їхнього лідера на поєдинок на ножах, дозволивши бандиту користуватися ножем, а йому самому — тільки голими руками. Той, хто виграє, змушений був забрати свою групу і більше не повертатися. Наш чоловік виграв, звісно. Бандити не дотрималися слова свого колишнього лідера, звісно. Наш чоловік просто виграв час, щоб наші громадяни могли зібратися, звісно. А наші хлопці мали динаміт, звісно. Багато хороших людей загинуло того дня, але ми здобули свою свободу і навчилися з цієї помилки, створивши Золото і Синє як прямий відгук на це."

tpm_mild_corruption: "Помірнана корупція Патрульних"
tpm_mild_corruption_desc: "Патрульні існують для однієї мети — підтримувати порядок в безпосередньому регіоні міста Лафайєт. І на жаль, ми не тільки це робимо. Загалом, все трималося на розумних рівнях, але інколи шеф чує новини про те, що деякі члени Патруля чи інші йдуть на крайнощі, вимагаючи надмірні плати за захист, супроводжуючи це чутками про те, що ця людина отримає проблеми, якщо відмовиться платити. Ці чутки — здебільшого лише чутки, але цього достатньо, щоб шефа тримати на межі, і мешканці Лафайєта починають це помічати."

tpm_bad_corruption: "Широка корупція Патрульних"
tpm_bad_corruption_desc: "Патрульні існують для однієї мети — підтримувати порядок в безпосередньому регіоні міста Лафайєт. І на жаль, ми не тільки це робимо. Інша важлива частина нашої роботи полягає в боротьбі з криміналом в густих лісах сусіднього міста Мосс-Блафф. Ми досить добре з цим справляємося, але інколи шеф дізнається, що бандит знайдений мертвим від кулі Патрульного, яку не було офіційно зареєстровано у Патрулі, і поєднуючи це з чутками про непотрібні вимагання з іншими аспектами Патруля, шеф починає хвилюватися. Якщо люди не можуть довіряти золоту і синьому, кому ж вони можуть довіряти?"

tpm_all_corrupted: "Смерть Золота і Синього"
tpm_all_corrupted_desc: "Патрульні існують для однієї мети — підтримувати порядок в безпосередньому регіоні міста Лафайєт. І на жаль, це вже не те, що ми робимо. Більшість вищих ешелонів організації Патрульних вже виконують свої обов’язки з апатією, а більшість нових рекрутів записалися на службу лише для того, щоб заробити швидку копійку чи отримати безкоштовний пістолет. Ситуація погіршується, і це найбільший сором для шефа, що кілька чесних людей з кожної групи Патрульних, окрім 5-ї (які складають свою єдину лояльність шефу), змушені передавати ці чутки анонімно, побоюючись відплати з боку колег. Це похмура ситуація, і всі це знають, навіть місцеві бандити, що вільно блукають, і фальшиві Патрульні, що іноді з’являються."

tpm_louisiana_deputies: "Луїзіанські заступники"
tpm_louisiana_deputies_desc: "Хоча ніхто не радіє втраті нашої незалежності через іноземну владу, більшість наших хлопців змушені визнати, що це не так уже й погано. У нас з’явилося більше часу та енергії для вдосконалення бойових здібностей наших військ, адже тепер ми не повинні турбуватися про внутрішні проблеми, і, враховуючи все, Каллахан дивується, як легко йому працювати з нашими новими господарями. Просто «так, сер», «ні, мадам» і «заняття зроблено» пару разів на тиждень, і вони, в основному, залишають нас у спокої. Це, безумовно, могло б бути й гірше."

tpm_lament: "Луїзіанський сум"
tpm_lament_desc: "Лафайєт не призначений бути маріонетковою державою, що служить іноземному господарю. Організація Патрульних була створена, щоб захищати нас від тієї ж долі підкорення, в яку ми зараз потрапили. Це потребує трохи непокори на батьківщині, але навіть шеф знає, що нам краще бути проблемними діячами, які ведуть довгу і тонку боротьбу за незалежність, ніж теперішніми слугами іноземного порядку, до яких ми знижені. Наша робота — це підтримувати закон, а закон землі говорить, що ніхто не буде правити Лафайєтом, окрім добрих громадян Лафайєта."

tpm_next_generations: "Наступні покоління"
tpm_next_generations_desc: "Дивіться. Особисто ми не маємо нічого проти мутантів. Більшість мутантів тут насправді досить хороші хлопці, за винятком піратів. Раз на кілька десятиліть проходять дикийки з сходу, а час від часу бувають сварки з агресивними мутантами з Техасу через барний рахунок чи щось незначне, але це не великі проблеми. Але наразі шеф прийняв рішення, що нам краще утримувати мутантів від Патруля. Не тому, що вони не були б корисні, а тому що Патруль — це місцева група, створена для того, щоб допомогти Лафайєту самостійно допомагати собі, і насправді є лише кілька мутантів, що живуть у Лафайєті постійно, і вони чітко дали зрозуміти, що їм байдуже до Патруля. Можливо, ця політика колись зміниться, але наразі краще тримати ряди в чистому форменному вигляді. Краще не ділити більше, ніж це вже зроблено."

tpm_civility: "Цивілізованість Лафайєта"
tpm_civility_desc: "Щось, що ми зрозуміли дуже швидко після інциденту в Ліберсіті пару десятиліть тому, це те, що Лафайєт — дуже унікальне місто. Лише ми серед усіх наших сусідів змогли зберегти порядок після того, як бомби вибухнули, і наші Патрульні зробили все, щоб ми мали унікально безпечний і цивілізований куточок «Пустки», який ми можемо назвати своїм. Коли люди приходять в Лафайєт, шукаючи неприємностей, ми повертаємо їх туди, звідки вони прийшли, і зазвичай на цьому все. Хоч навіть шеф знає, що є чимало проблем з тим, щоб заохочувати людей бути ворожими до сторонніх, ніхто не заперечує, що цивілізованість Лафайєта — це щось, що ми справді хочемо зберегти будь-якою ціною. Це наш дім, зрештою."

tpm_something_bigger: "Частина чогось більшого"
tpm_something_bigger_desc: "Щось, що ми зрозуміли дуже швидко після інциденту в Ліберсіті пару десятиліть тому, це те, що Лафайєт — дуже унікальне місто. Лише ми змогли зберегти порядок, коли решта «Пустки» впала, і багато хто з наших людей вважає, що наша місія — допомагати іншим, коли ми можемо. Звісно, вся ця каша з канібалами в Техасі, зрештою, ось-ось закінчиться, але в нас є довга історія боротьби з бандитами в нашому регіоні, і хоч багато хто з наших людей ненавидить це визнавати, іноді Техас теж вважається нашим районом. Це задоволене відчуття — бути чиїмось хорошим сусідом."

tpm_boys_come_first: "Хлопці перш за все"
tpm_boys_come_first_desc: "Коли шеф дізнався деякі деталі скандалу «корупції», що навис над Патрульними, він не був розлючений, він просто був розчарований. Тому він дав розпорядження — кожен, хто вбив бандита і не повідомив про це, взяв занадто багато грошей від місцевого жителя і поклав зміну до кишені, чи скоїв будь-який інший корупційний акт, може отримати офіційне помилування Патрульного, якщо зараз звітує про це. Не всі довіряють шефу, і в результаті оголошення було багато тривоги, але те, що шеф показав, що він ставить своїх хлопців перед усіма іншими в Луїзіані, — це хороший крок, принаймні для нас. Побачимо, чи збережеться це упередження, чи це лише разовий випадок."

tpm_overlooked_agression: "Пропущена агресія"
tpm_overlooked_agression_desc: "Коли шеф дізнався деякі деталі скандалу «корупції», що навис над Патрульними, він не був розлючений, а просто розчарований. Він надіслав повідомлення кожному значку Патруля, виражаючи своє розчарування через те, що ми забираємо занадто багато грошей від людей, яких повинні захищати — назвав нас «Бандитами в Синьому». Він сказав, що з цього моменту будь-хто, кого зловлять на тому, що вони беруть більше грошей, ніж належить для утримання Патрульних, втратить свій значок на місці. Але він не згадував про іншу велику проблему — багато нових рекрутів Патрульних занадто швидко натискають на спусковий гачок і готові до ескалації застосування сили на загальному рівні Патруля. Тому, хоча ми й будемо трохи горді собою на деякий час, це не зупинить наших більш підлих членів від того, щоб використати свою нову повагу як ліцензію на вбивство."

tpm_overlooked_bribery: "Пропущена «Хабарництво»"
tpm_overlooked_bribery_desc: "Коли шеф дізнався деякі деталі скандалу «корупції», що навис над Патрульними, він не був розлючений, а просто розчарований. Він надіслав повідомлення кожному значку Патруля, виражаючи своє розчарування через те, що ми надто швидко застосовуємо вогнепальну зброю в різних ситуаціях, від використання летальної сили без попередження проти оточених таборів бандитів до чуток про те, що деякі з наших хлопців навіть стріляють у бандитів, які явно вже здалися. Але він не згадував про хронічне підвищення громадських зборів, які деякі з наших хлопців збирають з найбільш вірних громадян, і невдача офісу шефа в обробці цієї теми залишила неприємний осад у деяких наших громадян. Нам доведеться почекати і подивитися, як це все розгорнеться."

tpm_callahan_stand: "Стоянка Каллахана"
tpm_callahan_stand_desc: "Коли шеф дізнався деякі деталі скандалу «корупції», що навис над Патрульними, він був дуже розлючений. Він надіслав повідомлення кожному значку Патруля, виражаючи своє розчарування через те, що ми брали забагато грошей за «захист», надто швидко стріляли в бандитів, не даючи їм справедливої можливості здатися, і в загальному ми просто стали занадто великими для наших значків. Він також чітко заявив, що призначає кількох наших керівників Патрульних спеціально для того, щоб стежити за нами і зупиняти таку поведінку в майбутньому. Це швидко змінювана ситуація на місцях, і чимало наших найкращих вже позбулися своїх значків, але зазвичай було надано відповідні докази в цих випадках. Нам доведеться подивитися, як це розгорнеться, але здається, що шеф, нарешті, зламався, і епоха неформального Каллахана підходить до кінця."

tpm_lawman_army: "Армія Закону"
tpm_lawman_army_desc: "Після того, як шеф кілька місяців тому переглянув нашу організацію, він надіслав указ щодо того, як він буде керувати операцією в майбутньому. Він звернув особливу увагу на те, що модель «Захисника закону» завжди служила Лафайєту добре, і є щось особливе в тому, щоб наші патрулі складалися лише з простих хлопців з чобітьми на землі. Тому він удвічі більше покладається на традиційну модель Патрульних в бойових діях щодо того, як ми будемо вести масштабні бойові операції і іноземні «війни». Ніхто точно не знає, що він має на увазі під «війнами», але для всіх практичних цілей ми сподіваємось, що нічого не зміниться, окрім того, що він розробить нові стратегії для використання найкращих людей з Блакитного та Золотого."

tpm_motorized_research: "Моторизовані дослідження"
tpm_motorized_research_desc: "Після того, як шеф кілька місяців тому переглянув нашу організацію, він надіслав указ щодо того, як він буде керувати операцією в майбутньому. Ми не були найбільш моторизованим містом у Луїзіані останні кілька сотень років, але більшість вищих керівників Патрульних мають джипи або пікапи, і деякі з них навіть тренувалися з бойовими методами, спеціально використовуючи ці родинні машини для того, щоб збивати бандитів. Якщо ми приймемо цей стиль бойових дій, ми зможемо зробити весь Патруль більш мобільною бойовою силою, здатною переносити бій до будь-кого на відстані поїздки. Можливо, нам варто спробувати та вкласти ресурси в цю ідею."

tpm_rangers_example: "Приклад Рейнджерів"
tpm_rangers_example_desc: "Після того, як шеф кілька місяців тому переглянув нашу організацію, він надіслав указ щодо того, як він буде керувати операцією в майбутньому. У зв’язку з швидким розширенням Техаського братства, ми почали приймати кілька нових рекрутів з Техасу, і багато з них мають попередній досвід служби в тепер вже неіснуючих Техаських рейнджерах. Як і в інших колишніх американських групах рейнджерів, вони тренувалися так само, як ми, з тривалими патрулями в Пустці, але вони практикують набагато жорсткіший стиль життя з більшим рівнем дисципліни, ніж у наших хлопців. Патрульним слід залучити кілька таких гарних людей; молоток, який використовується для кування великого Патруля. Приділення часу для інвестицій у спеціалізовану броню та малу кількість силової броні може значно допомогти з вирішенням наших проблем з організаційною неформальністю та дати Патрулю необхідні зуби."

tpm_tried_to_be_nice: "Ми намагалися бути добрими"
tpm_tried_to_be_nice_desc: "Коли мова йде про Техаське братство та решту покидьків з ТЕУ, ми давали їм усі шанси мати нас друзями та союзниками. Ми не техаська група і не маємо нічого проти Техасу або ідеалів людей, що там живуть, але незважаючи на відсутність причин для конфлікту, Техас зробив усе, щоб поставити нас на перше місце у списку ворогів. Ми не забудемо цього образу. Наша робота — полювати на бандитів, а той, хто намагається забрати чужі землі без причини, окрім бажання володіти ними, — це бандит. Зізнаємось, ці бандити сильні, але ми також не слабкі. Давайте покажемо покидькам, що станеться, коли ви перетнете дорогу чесним громадянам Лафайєта."

tpm_independence_assured: "Незламна незалежність"
tpm_independence_assured_desc: "Ми зробили все можливе, щоб зберегти мир між нами та Техасом. Ми билися з ними до рівності на околицях Лафайєта і показали Братству, що праведний законник — це все, що потрібно, щоб приборкати бандита, а потім запитали, чи можемо ми припинити бій і просто жити мирно. І що вони сказали? Нічого. Покидьки плюнули нам у лице. Тому начальник відправив наказ — час перестати прикидатися. Луїзіана, може, й не найкрасивіше місце, і тут повно бандитів різних мастей, але, чорт забирай, це наш дім, і ми не дозволимо нікому, навіть банкам з Техасу, забрати його в нас. Ми підемо на Даллас і покажемо їм, як працює справжній закон, а саме — на кінці револьвера."

tpm_louisiana_loyalty: "Лояльність до Луїзіани"
tpm_louisiana_loyalty_desc: "Насамперед, лояльність організації патрульних Лафайєта належить місту Лафайєт та ширшому народу Луїзіани навколо нас. Каллахан пішов на те, щоб відкрити шафу ганьби і вдягти Чорну Шапку, що не робилось уже давно, і це є символом його гніву щодо того, що сталося за останні кілька місяців. Тим самим він чітко дав зрозуміти, що не має наміру брати на себе брудну справу з Техасом. Лафайєт завжди був і має залишатися основним фокусом наших патрулів, і це так і залишиться. Начальник і так достатньо сердитий; давайте не будемо його дратувати ще більше, не погоджуючись."

tpm_deputy_alliance: "Техаський альянс заступників"
tpm_deputy_alliance_desc: "Насамперед, лояльність організації патрульних Лафайєта належить доброчесності широкої пустки навколо нас. Каллахан пішов на те, щоб відкрити шафу ганьби і вдягти Чорну Шапку, що не робилось уже давно, і це є символом його гніву щодо того, що сталося за останні кілька місяців. Він чітко дав зрозуміти, що вже втомився від того, у що перетворився Техас, і всі бачать, що він досяг кінця терпіння, коли справа стосується фальшивих законників з підробленими значками. Він планує вирушити до Далласа, щоб набрати справжніх законників до нашої групи, будь-що. І чесно кажучи, ми не можемо звинувачувати його в тому, що він такий розлючений."

tpm_lawmans_laws: "Закони законників"
tpm_lawmans_laws_desc: "Ще одна з багатьох незначних проблем, яку Лафайєт проігнорував протягом останніх кількох поколінь, — це повна відсутність організованих законів. У нас є законники для підтримки порядку, так, але в кінцевому підсумку немає чітко прописаних законів, за якими Лафайєт живе, і ми завжди могли обходитись без цього, бо ніхто не допускав великих суперечок, і в рідкісних випадках, коли це траплялося, або хтось залишав місто, або відбувалася дуель, і аргументи одного з учасників ставали неактуальними. І чесно кажучи, ми довго думали, і не бачимо причини, чому це повинно змінюватись. Лафайєт — це поважне місто, а люди, які служать в організації патрульних, зазвичай теж поважні. Не можна сказати, що у нас є глибока ідеологічна неприязнь до кодексу законів, але це просто здається великим зусиллям для того, щоб впорядкувати те, що вже є здоровим глуздом, яким ми керуємось. Ми залишаємо ситуацію такою, якою вона є, і це, звісно, створить деякі труднощі для тих, хто не звик до такого підходу, але на цей момент? Лафайєт стоїть окремо, і ми стоїмо вільно."

tpm_louisianas_laws: "Закони Луїзіани"
tpm_louisianas_laws_desc: "Ще одна з багатьох незначних проблем, яку Лафайєт проігнорував протягом останніх кількох поколінь, — це повна відсутність організованих законів. У нас є законники для підтримки порядку, так, але в кінцевому підсумку немає чітко прописаних законів, за якими Лафайєт живе, і ми завжди могли обходитись без цього, бо ніхто не допускав великих суперечок, і в рідкісних випадках, коли це траплялося, або хтось залишав місто, або відбувалася дуель, і аргументи одного з учасників ставали неактуальними. Але часи змінюються, і настав час розробити справжній законодавчий кодекс, щоб патрульні могли його втілювати. Каллахан зібрав найкращі розуми міста, щоб створити імпровізований кодекс законів для вирішення суперечок, і ми забезпечили, щоб найбільш відвідувані громадяни міста отримали копію цих нових "Лафайєтських законників", як їх називає начальник. Це не найскладніші документи, і більшість з них зводиться до менталітету "використовуй свій власний розсуд", але, мабуть, це краще, ніж нічого."

tpm_unions_laws: "Закони Союзу"
tpm_unions_laws_desc: "Ще одна з багатьох незначних проблем, яку Лафайєт проігнорував протягом останніх кількох поколінь, — це повна відсутність організованих законів. У нас є законники для підтримки порядку, так, але в кінцевому підсумку немає чітко прописаних законів, за якими Лафайєт живе, і ми завжди могли обходитись без цього, бо ніхто не допускав великих суперечок, і в рідкісних випадках, коли це траплялося, або хтось залишав місто, або відбувалася дуель, і аргументи одного з учасників ставали неактуальними. Але часи змінюються, і настав час розробити справжній законодавчий кодекс, щоб патрульні могли його втілювати. І, по суті, у цьому місті немає жодного державного діяча, але Техас має їх багато. Каллахан вирішив, що найпростіший спосіб вирішити цю проблему — просто найняти якогось політика з Далласа, щоб він приїхав сюди і пояснив, як працюють закони ТЕУ, і ось ми це й зробили. Чесно кажучи, рішення не найкраще, але воно працює."

tpm_texan_handshake: "Техаський рукостиск"
tpm_texan_handshake_desc: "Здається, люди в Техасі нарешті об’єдналися під єдиним урядом. Молодці! Чудово для них! Здається, це дуже вигідне підприємство, і чесно кажучи, це не те, чим зацікавлене наше скромне місто, яким би ти не формулював це. Все одно, немає причин не підняти келих за них на святкування. Молодці, хлопці!"

tpm_statehood_question: "Питання про державність"
tpm_statehood_question_desc: "Здається, люди в Техасі нарешті об’єдналися під єдиним урядом. І це змусило деяких у Лафайєті замислитись, чи не спробувати нам зробити те ж саме. О, звісно, це було б абсолютне лихо — спробувати впоратися з рештою бандитів, що бродять по болотах Луїзіани, але теоретично це можна зробити. І якщо є хтось, хто навчився боротися з бандитами, то це ми. Ось це ідея..."

tpm_rocky_training_montage: "Практика Каллахана"
tpm_rocky_training_montage_desc: "Після наших нещодавніх зіткнень з Байу Моторс і Гейтор Моуза, начальник мав змогу відточити свою майстерність у реальних битвах, яких не було так довго. Він не стратегічний недотепа, але він так довго був з 5-м підрозділом, що майже забув, як використовувати весь патруль як єдину, організовану силу. Тепер, коли він нарешті мав можливість відточити свою майстерність, він знову нагадує всім, чому він — начальник, а всі інші — під ним. Він один завжди здається тим, хто знає, що робить, і, чи правда це чи ні, це змусило військових ще більше повірити в його здібності та судження."

tpm_rocky_training_montage2: "Практика Каллахана"
tpm_rocky_training_montage2_desc: "Після наших нещодавніх зіткнень з Байу Моторс і Гейтор Моуза, начальник мав змогу відточити свою майстерність у реальних битвах, яких не було так довго. Він не стратегічний недотепа, але він так довго був з 5-м підрозділом, що майже забув, як використовувати весь патруль як єдину, організовану силу. Тепер, коли він нарешті мав можливість відточити свою майстерність, він знову нагадує всім, чому він — начальник, а всі інші — під ним. Він один завжди здається тим, хто знає, що робить, і, чи правда це чи ні, це змусило військових ще більше повірити в його здібності та судження."

tpm_ghoul_mechanics: "Механіка Шривпорту"
tpm_ghoul_mechanics_desc: "Цікаво, що бандити, які контролюють Шривпорт, робили це практично з самого моменту, коли вибухи зруйнували світ. Хоча Шривпорт не був знищений атомними ударами, він отримав сильний удар від економічного застою та соціальних заворушень, які пережили багато післявоєнних міст у Америці. Лише через кілька років після цього, недавно перетворений на гулем байкерський бандитський загін захопив місто, і це стало головним техаським гаражем вже понад два століття. Сумно, що ці байкери стали грабіжниками після кількох років нудьги, але тепер, коли ми показали їм, що їхнім грабіжницьким дням прийшов кінець, більшість із них готові повернутись до корисного й поважного способу життя. Використовувати їхні старі навички не буде проблемою, якщо тільки ми подбаємо, щоб вони отримували належну плату за свою працю."

tpm_gulf_pirates: "Зв’язки з піратами Мексиканської затоки"
tpm_gulf_pirates_desc: "Під час перебування в Новому Орлеані один з членів нашого патруля встановив контакт з деякими не найкращими моряками, які відомі своїми операціями з поставок зброї та наркотиків між картелями та кількома іншими націями Мексиканської затоки. Однак, хоча їхній легітимний нелегітимний бізнес — це наркотики, їхній нелегітимний легітимний бізнес — це розвідка. Їхні зв’язки з різними злочинними угрупованнями та піратськими колами означають, що ці особливі негідники надзвичайно розумні й обізнані про будь-які злочинні рухи на відкритих морях ще до того, як вони вийшли на стадію планування. Вони запропонували взяти на себе будь-яких агентів, яких нам потрібно відправити туди, і дати їм інструктаж, як бути достатньо хитрими, щоб місцева влада вирішила, що з вами не варто мати справу, і, як би нам не боліло працювати з водяними бандитами, їхні тактики, здається, працюють."

tpm_no_generals_for_you_ed_boy: "Обов’язок законника"
tpm_no_generals_for_you_ed_boy_desc: "Кожна людина дає присягу, коли вдягає форму. Присягу захищати тих, хто потребує допомоги, і оберігати мир. Протягом понад 200 років відважні чоловіки та жінки жили за цією присягою, помираючи в акті її виконання. Це спадщина, яку ми, ті, хто живі зараз, маємо підтримувати. Кожен повинен робити свою частину, адже це і є спадщина. Адже це і є присяга."

tpm_no_generals_for_you_ed_boy_alt: "Обов’язок законника"
tpm_no_generals_for_you_ed_boy_alt_desc: "Кожна людина дає присягу, коли вдягає форму. Присягу захищати тих, хто потребує допомоги, і оберігати мир. Протягом понад 200 років відважні чоловіки та жінки жили за цією присягою, помираючи в акті її виконання. Це спадщина, яку ми, ті, хто живі зараз, маємо підтримувати. Кожен повинен робити свою частину, адже це і є спадщина. Адже це і є присяга."

