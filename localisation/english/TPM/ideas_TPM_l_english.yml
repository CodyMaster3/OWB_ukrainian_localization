tpm_sullivan: "Салліван III"
tpm_sullivan_desc: "Салліван III — офіційний маскот десятої організації патрульних Лафайєта. Він також кіт начальника, як частина його побічного заняття. Незабаром після того, як попередній начальник помер на заході від Нового Орлеану, попередній маскот — Салліван II, випадково зник без сліду. Що було особливо дивним, оскільки в родині Каллаханів існувала непорушна політика закривати двері, коли вони залишають кімнати, і новий начальник був впевнений, що він закрив двері свого кабінету. Тим не менше, йому довелося знайти нового найкращого друга і товариша по зброї, тому він блукав вулицями Лафайєта без цілі годинами щодня протягом кількох тижнів, поки не знайшов бездомного кошеня. Він знайшов нового Саллівана, який ховався під купою напіврозкладеного до війни сміття з невеликою зграєю інших кошенят, яких він розподілив серед своїх начальників. Саллі був найменшим серед цього посліду, тому начальник вирішив зробити з нього друга. У свою чергу, Салліван тепер — незаперечний господар спальне-кабінету начальника і насолоджується регулярними обідами з консервованої риби за рахунок начальника. Справжнє життя розкоші."

tpm_sullivan_cat: "Салліван IV"
tpm_sullivan_cat_desc: "Зважаючи на спадщину Саллівана III, новий співробітник має великий тягар на плечах. Народжений як один з багатьох нащадків кота, якого начальник передав в патрульному підрозділі Гренхему, а потім віддав старій жінці, яка намагалася відкрити магазин для тварин, цей племінник попереднього Саллівана здавався природним вибором для роботи. Начальник очікує, що новий Саллі буде ще більш ненажерливим, ніж його дядько, але він також має намір переконатися, що Салліван знає своє місце як наймиліший підлокітник у місті. З часом кіт може стати невід’ємною частиною організації патрульних, але це займе деякий час. Тим часом більше незручних обіймів і консервованої риби для короля."

tpm_sullivan_dog: "Салліван IV"
tpm_sullivan_dog_desc: "Зважаючи на спадщину Саллівана III, новий співробітник має великий тягар на плечах. Проте факт, що новий найманець — це щеня пітбуля, а не милий кошеня, викликав змішані реакції в вищих колах патруля. Чому начальник вирішив продовжити традицію Саллівана з собачим супутником замість котячого друга, залишає місце для спекуляцій, але більшість у патрулі просто дійшли висновку, що Каллахан став трохи більш агресивним. І з огляду на все, через що йому довелося пройти останнім часом, більшість погодилися, що це зрозуміло. Тим часом Салліван IV не так любить консервовану рибу, як його духовні попередники, тому начальник експериментує з різними видами їжі для нього. Сухий брахміновий в’ялений м’ясо здається працює в більшості випадків, і начальник налаштований взяти Саллівана з собою в патруль в особистому складі в якийсь момент. Час покаже, чи здійсниться це бажання, і скільки бандитів, тварин та малюків Салліван IV з’їсть."