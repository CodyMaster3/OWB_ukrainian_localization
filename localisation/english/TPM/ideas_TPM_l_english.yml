tpm_overabundance_of_fusion_cores_alt: "Занадто багато фузійних ядер"

tpm_making_sure_the_phones_work: "Перевірка роботи телефонів"

tpm_great_minds_think_alike: "Великі уми думають однаково"

tpm_secrets_of_the_lost: "Таємниці загиблих та експорт Карбону..."

tpm_friends_from_brahmin_county: "Друзі з Брамінського округу"

tpm_tubeheads_shipments: "Поставки для Тюбеголових"

tpm_rolling_around_at_the_speed_of_sound: "Крутимося на швидкості звуку"

