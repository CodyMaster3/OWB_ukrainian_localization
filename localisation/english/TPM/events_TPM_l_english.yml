l_english:

nf_tpm.1.t: "Чому тут?"
nf_tpm.1.d: "Світло в офісі Начальника патруля було вимкнене. Потім двері скрипнули і хтось протягнув руку, вмикаючи світло. Начальник відкрив двері повністю, зробив два кроки всередину, затримався, вимкнув світло і закрив двері. Потім він зупинився біля схованого ліжка, яке забув прибрати зранку, і вивалився на нього обличчям вниз. Через хвилину він зібрав сили, щоб лягти на ліжко, погрузивши обличчя в подушку і стогнучи. У нього боліла голова, і він розумів, що не зможе заснути ще певний час, але все одно намагатиметься. Цю спробу досить грубо перервав кіт, який почав лизати кінчик його мізинця."
nf_tpm.1.a: "§g Він тихо посміхнувся, потім перевернувся на ліжку.§!"

nf_tpm_events_continued.1.t: "Чому тут, продовження"
nf_tpm_events_continued.1.d: "§o"Ой, ну давай, Келахан,"§! — наслідував голос кота начальник, §o"ти не можеш лягати спати, я голодний."§! Хех, малий бешкетник.» Начальник важко зітхнув і чекав ще хвилину, поки кіт нетерпляче не почав чухати йому обличчя. «Добре, добре. Я прокинувся.» Він сів і на мить погладив старого кота, потім встав. Він підійшов до вимикача і знову вмикнув світло. Потім пішов до кухонного куточка і відкрив одну з шафок. Вийняв маленьку консерву з написом «Байо Біч Снепер» і висипав її в миску. Поставив її на підлогу і чекав. «Дивись, кицю, я можу стояти тут всю ніч. Ти прийдеш?» Після короткої паузи, стоячи гордовито на краю ліжка, Салліван III стрибнув і гордо пішов до їжі, кілька разів ображено пхнув її перед тим, як почав їсти. Начальник хитнув головою, важко зітхнув, а потім підійшов до холодильника. Він зупинився і подивився на кілька фотографій, приклеєних до його пожовклого корпусу. Ту, яка завжди привертала його увагу, була яскравою і знаходилася на рівні очей. Яскравий грибоподібний хмарний вибух, що піднімався над містом. Він повернувся до кота. «Я тобі коли-небудь розповідав, як це місто бомбардували?» Він, звісно ж, багато разів розповідав. «Ну, ми й досі не знаємо, що у них було проти Лафайєта, що вони так поспішали знищити це місце, але для цього вистачило одного великого.» Він знову подивився на холодильник, відкрив його і витяг останню пляшку пива з нижньої полиці. Поглянув на етикетку, щоб переконатися, що це та марка, яку він шукав, закрив холодильник і повернувся до ліжка. «Тоді вони були дуже дурні. Так багато смертей.»"
nf_tpm_events_continued.1.a: "Центр міста був знищений."
nf_tpm_events_continued.1.b: "Мабуть, передмістя постраждали найбільше."
nf_tpm_events_continued.1.c: "Увесь Лафайєт вигорів до тла."

nf_tpm.2.t: "Життя триває"
nf_tpm.2.d: "Салліван III не звертав на начальника жодної уваги. «Що це тут?» Начальник патруля блукав офісом, коли помітив на своєму столі незнайомий зошит. «Що ж це ти?» Він глянув на Саллі, який все ще їв порізану рибу, і сів на свій скрипучий стілець. Він на хвилину відкрив пиво, потім зупинився, дивлячись на нього, замислюючись, як дивно, що вони на пляшку пива наклеїли валюту. Він поклав кришку і зробив кілька ковтків. Він легенько прокашлявся і посміхнувся. «Хех. Гидко.» Він знову смикнув пиво, а потім взяв у руки таємничий зошит. Це був звичайний білий паперовий зошит до війни. На передній сторінці була записка."
nf_tpm.2.a: "§t...Сподіваюся, тобі не пізно оцінити старі спогади.§!"

nf_tpm_events_continued.2.t: "Життя триває, продовження"
nf_tpm_events_continued.2.d: "Брови Келахана піднялися, коли він прочитав підпис. «Ей, Саллі. Ти не бачив Франкліна, коли він заходив?» Він повернув голову і встиг побачити, як Саллі дає йому котячий аналог середнього пальця. «Мабуть, ти спав,» — пробурмотів начальник. Він перевернув зошит. Задня частина була нічим не примітною. Він зробив ще один ковток пива і відкрив зошит на першій сторінці. Там була запечатана конверт з написом «Адам». Начальник одразу впізнав почерк батька. «Чорт, я занадто втомлений для цього.» Він витягнув лист і поклав його в правий верхній ящик столу. «Я повернуся до тебе, тато. Зачекай трохи.»\n\nВін перевернув зошит на наступну сторінку і побачив знайомі фотографії. Фотографії перших поселенців, що перебирали уламки центру Лафайєта майже через 50 років після того, як вибухи залишили місто у руїнах, — це був образ, який впізнав би будь-який громадянин цього гарного міста. Начальник міг би присягнутися, що бачив ці конкретні фотографії в дитинстві. «Ті чоловіки вміли взяти щось погане і зробити це кращим,» — подумав начальник. «Бажаю, щоб я знав, як вони це зробили.» Саллі зробив дзвінкий звук, і начальник подивився на нього. У мисці все ще була риба. Напевно, це була застібка на великий котячий нашийник, що стукала по мисці. «Знаєш, що ті чудові люди зробили, Саллі?» Він посміхнувся, і кіт на мить подивився вгору. «Вони були розумніші за мене.» Кіт чхнув і повернувся до їжі."
nf_tpm_events_continued.2.a: "Вони відбудували те, що пам’ятали."
nf_tpm_events_continued.2.b: "Вони почали все знову і перейшли до землеробства."
nf_tpm_events_continued.2.c: "Вони перетворили запаси на лісозаготівельні зони."

nf_tpm.3.t: "Це мало статися рано чи пізно"
nf_tpm.3.d: "Начальник наступні кілька хвилин перевіряв вміст зошита, перегортаючи прозорі вставки і розсипи паперів. Було багато чого переглянути, і він не очікував, що так захопиться цим. Перші кілька вставок були заповнені фотографіями з ранньої післявоєнної історії Лафайєта. Деякі з них здалися йому знайомими і приємними, а одна фотографія, де поселенці тиснули руки з невеликою групою торговців-мерців, наче була на гордому виставленні в офісі його батька. Наступні сторінки містили транскрипти різних засідань щодо створення організації патрульних як миротворців. Начальник посміхнувся, побачивши одну з них, і встав.\n\nСалліван вже закінчив свою рибу і дивився в миску, явно не розуміючи, що їсти більше нема чого. «Гей, Саллі, думаю, ти вже закінчив.» Кіт поглянув на начальника, скривився і попрямував назад до схованого ліжка. Його величність стрибнув і одразу впав на бік, ситий і щасливий. Начальник пішов на іншу сторону кімнати і відкрив шафку, витягнувши маленьку коробку з касетами. Він переглянув їх дощечки, поки не знайшов правильну, і вставив її в касетний програвач на верхній частині шафи."
nf_tpm.3.a: "§g...§!"

nf_tpm_events_continued.3.t: "Це мало статися рано чи пізно, продовження"
nf_tpm_events_continued.3.d: "\"Ну, ми повинні щось із цим зробити! Ти чув хоча б частину історій із Техасу? Канібали! Типу люди, що їдять інших людей! Ми просто будемо сидіти тут і нічого не робити?\"\n\n\"Це не наша справа! Це перший раз, коли ми стикнулися з бандитами після того, як відновили це місто, і — ну, давай, Техас — велике місце з власними проблемами. Ти хочеш, щоб ми пішли завойовувати весь цей регіон, щоб просто вбивати людей, що роблять жахливі речі?\"\n\n\"Ні, але ми повинні постояти за себе! Якось. Я не знаю, може...\"\n\n\"А що, якщо так? Ми ніколи не потребували поліції, але кілька шерифів і заступників для патрулювання за межами міста не завадить. Чому б тобі не організувати якийсь патруль, як вартову службу?\"\n\nНачальник посміхнувся, коли запис йшов. Патруль Лафайєта завжди був неофіційною відповіддю людей на дуже серйозну проблему. Він на мить задумався про рейд на Лафайєт, який і спровокував цю важливу нараду, і як звичайні громадяни пішли на своїх власних плечах, щоб захистити свої домівки, навіть не чекаючи, що їм хтось скаже зробити це. Саллі замурчав незадоволено з ліжка, відволікаючи начальника від роздумів."
nf_tpm_events_continued.3.a: "Наші люди ніколи не були в реальній небезпеці."
nf_tpm_events_continued.3.b: "Це була більш складна боротьба, ніж ми б хотіли визнавати."
nf_tpm_events_continued.3.c: "Мій прадідусь врятував це місто."

nf_tpm.4.t: "Благородне початок"
nf_tpm.4.d: "Начальник відкинувся назад і продовжив слухати запис касети з важливої наради в мерії Лафайєта, на якій було засновано організацію, яку його родина очолила. Коли касета нарешті закінчилася і кліпс сприйнявся, начальник заплющив очі і глибоко видихнув. «Знаєш, Саллі, я б хотів, щоб ти зрозумів, в якому я становищі. Було б добре знати, що ти розумієш.» Він відкрив очі і сів прямо. Глянув на своє ліжко і побачив, що Салліван III навіть не подивився в бік начальника. «Добре, тоді залишайся при собі.»\n\nНачальник трохи усміхнувся. Потім згадали про конверт у верхньому ящику столу, і його усмішка зникла. Він чекав кілька секунд, поглянув навколо себе без особливих причин і відкрив ящик. Обережно витягнув листа і відкрив його так само, як обережно чистив свій револьвер цього ранку під час щотижневого огляду та чищення. Він витягнув його і побачив звичайну передвоєнну листівку з нагоди дня народження."
nf_tpm.4.a: "§gВсередині була маленька, тверда картка.§!"

nf_tpm_events_continued.4.t: "Благородне початок, продовження"
nf_tpm_events_continued.4.d: "Він відкрив її і знову посміхнувся. «Оскільки ти ще не заробляєш на хліб, ось трохи грошей, щоб почати!» Старий американський дво-доларовий купон вислизнув із листівки. Дідусь Келахана завжди жартував про ці купюри і як вони були безглузді, але це мало кого цікавило. Начальник поклав купюру вбік і прочитав коротке повідомлення, яке було написано під текстом, що йшов із листівкою.\n\n§B"З Днем народження, Адам! Якщо ти це читаєш, то, мабуть, я не вийшов з тієї останньої операції, і Франклін, ймовірно, саме він передав тобі цю листівку. Трохи нещастя, але сподіваюся, що моя смерть дала патрулю час, який їм так потрібен. Є деякі проблеми з хабарництвом та іншими справами, і тобі знадобиться весь час, який ти можеш витягти, щоб це все вирішити. Проте я рекомендую тобі взяти на себе управління патрулем, і не сумніваюся, що ти впораєшся. Ти знаєш, що мама й я завжди любили тебе, і віримо в тебе. Пишайся мною, синку. - Тато"§!\n\nНачальник відчув, як сльози наближаються до очей. Обережно поклав листівку назад в конверт і поклав його в зошит. Закрив зошит, встав і взяв дво-доларовий купон. Він зупинився, щоб поміркувати, потім пішов до вішалки біля дверей. Взяв свою коричневу шапку начальника патруля з вішалки і сховав купон в її внутрішній частині, приховуючи його від погляду. Поклав шапку на місце і пішов до ліжка, по дорозі взявши пиво. Потім ліг поруч з Саллі, і наступні півгодини ніжно його гладив, і кіт муркотів вдячно весь цей час."
nf_tpm_events_continued.4.a: "Ми намагаємось як можемо."
nf_tpm_events_continued.4.b: "Я намагаюсь, як можу."
nf_tpm_events_continued.4.c: "Тато б сумував."

nf_tpm_act1.1.t: "Велика поразка капітана Крінкла"
nf_tpm_act1.1.d: "«Добре, дякую всім, що прийшли сьогодні ввечері, давайте добре проведемо час. Інгредієнти для с’мори знаходяться біля гриля десь там, багато дров лежить біля огорожі, а ви просто повинні знайти свої лінії, щоб знати, який вогонь ваш. Насолоджуйтеся!» Натовп у синіх капелюхах коротко аплодував і почав розходитись. Більшість хлопців розійшлися і знайшли своїх лідерів патрулів біля вогнищ, розкиданих по Меморіальному парку Лафайєта, кілька блукали безцільно, розмовляючи з друзями з інших патрулів, а невелика група зібралася біля гриля, щоб взяти печиво та маршмеллоу. Келахан підійшов і поставив стільця біля вогнища п’ятого патруля, Охоронців Гренхема.\n\n«Привіт, начальнику! Ти приєднаєшся до старих хлопців для кількох історій?» Келахан усміхнувся лідеру патруля Гренхему. «Так, давно я не перевіряв п’ятий. Подумав, що буде гарна нагода знову побачити вас, послухавши історії, які у вас є.» Він швидко оглянув вогнище і ввічливо поклонився всім старшим поліцейським, яких він колись особисто водив у патрулі, коли був керівником п’ятого патруля, Кланкерів Келахана. «На кого чекаємо?»\n\n«Це буду я», — вигукнув новий хлопець з патруля. Його руки були заповнені різними сумками та інгредієнтами, і він поспішно роздавав матеріали для с’мори."
nf_tpm_act1.1.a: "§gКелахан відмовився від пропозиції, але подякував хлопцеві за його доброту.§!"

nf_tpm_events_continued.5.t: "Велика поразка капітана Крінкла, продовження"
nf_tpm_events_continued.5.d: "\"Добре, може, я почну.» Гренхем нахилився вперед і чекав на будь-які заперечення. Заперечень не було, і начальник закрив очі, щоб послухати. «Отже, ця історія буде короткою, бо я не був там більшу частину бою, але ви пам’ятаєте одного капітана Крінкла?» Легкий сміх і кивки пішли по вогнищу. «Ну, для новачків, він один із тих мутантів з Техасу. Приїхав з заходу кілька років до того, як з’явився той хлопець Аттіс, і зібрав команду піратів. Саме в 63-му році він здійснив набіг на консервний завод на південь. Мабуть, просто хотів трохи риби чи щось таке.» Легкий сміх.\n\n«Ну, п’ятий патруль був викликаний, щоб допомогти відбити їх, поки решта патруля вирішувала щось інше, але ми об’єдналися з гарматами консервного заводу і прогнали їх. Великий начальник вів нас у бій, і його вибило на перші секунди бою через нещасний удар по голові клубом, але решта нас вибила їх і прогнала цих мутантів. Рейган—хто пам’ятає Рейгана?» Кілька людей підняли руки. «Рейган пробрався в трюм цих мерзотників і підірвав великий шматок динаміту, а потім поплив назад до берега. Ми не думаємо, що вони потонули, але з того часу ми їх не бачили, і сумніваємося, що ще колись побачимо.» Гренхем відкинувся назад, отримавши ввічливі аплодисменти від решти своєї команди. Чиясь маршмеллоу злізло зі шпажки і потрапило у вогонь, що викликало «оoh» від решти патруля."
nf_tpm_events_continued.5.a: "Всі знають, як це закінчилося."
nf_tpm_events_continued.5.b: "Але не завадить більше дослідити це."

nf_tpm_act1.2.t: "Сплав по Міссісіпі"
nf_tpm_act1.2.d: "Начальник Келахан помітив, що сонце вже зникло з неба, і вогнища стали основним джерелом світла в парку. Гренхем оглянувся навколо вогнища. «Ну, хто наступний? Не змушуйте мене покликати вас.» Після десятка секунд нерішучої тиші та незграбних поглядів один з старших членів патруля заговорив. «Добре, дозвольте я покажу вам, як це робиться. Скільки з вас пам’ятають бій за Александрію в 43-му?» Три старші члени підняли руки, включаючи Гренхема.\nНачальник відкрив очі і сів на мить. «Я чув історії старого начальника про ту битву. Але не думаю, що я чув про це з того боку. Ти був там?»\n\nКелахан кивнув і знову відкинувся назад, хоча тримав очі відкритими і дивився на що з’являються зірки. «У 43-му році був хлопець на ім’я Крюгер, який приєднався до патруля. Приїхав з Техасу і стверджував, що був частиною Техаських рейнджерів, коли вони ще існували. Він був хорошим стрільцем і виглядав, як той, хто хоче оселитися, тож старий начальник дозволив йому приєднатися. Виявилося, що він не тільки не був з Техасу, а й мав контракт з тим старим бандитським лідером Рейнолдсом Клоу з Александрії. Ну, я впевнений, що ви знаєте історію, тому пропущу деталі, але цей Крюгер був тим, хто організовував викрадення на очах у всіх у Лафайєті, і коли його прикриття було викрито — звісно, завдяки мені — він застрелив двох наших кращих хлопців на місці і вирушив назад в Александрію. Ми зібрали патруль і пішли за ним туди. Бій у болотах не був легким, і, незважаючи на те, що більшість банди Аллигаторів були відсутні на «справах», ті, що охороняли місто, дали хороший бій.»"
nf_tpm_act1.2.a: "Втрати були три до одного на користь бандитів."

nf_tpm_events_continued.6.t: "Сплав по Міссісіпі, продовження"
nf_tpm_events_continued.6.d: "\"Отже, ось як вони нас підловили, коли ми були наївними. Ці негідники знаходили грязьову ділянку біля будівлі, яку вони знали, що скоро перевірятимуть, потім покривали себе брудом і лягали. Коли наш патруль наближався, вони піднімалися і стріляли прямо в нас. Повністю втратили 7-й патруль через цей дурний трюк, перш ніж ми зрозуміли, як з ними боротися. Але як тільки старий начальник дізнався про цей план, він швидко передав новину хлопцям, і ми стали обстрілювати будь-яку грязьову купу, що виглядала більша за складений мішок для трупів.\"\n\nВін знову зробив паузу, і хмара закрила одну з зірок, на які дивився Келахан. «В кінці ми знайшли людей, яких вони викрали. Більшість з них були живі, але деяких уже відправили невідомо куди. Існують чутки, що вони потрапили в землі канібалів, але ми не знаємо точно.» Він завершив на сумній ноті. Гренхем нахилився вперед і заговорив з усмішкою. «Але, ох, ми стільки здобичі отримали з того набігу, поки бандити не з’явилися знову!» Це, здається, змінило настрій, і деякі люди встали, щоб взяти ще маршмеллоу."
nf_tpm_events_continued.6.a: "Ми точно показали тим болотяним тварюкам!"
nf_tpm_events_continued.6.b: "Знаєте, скільки човнів ми звільнили?"

nf_tpm_act1.3.t: "Бій за Ліберситі"
nf_tpm_act1.3.d: "Очі лідера патруля Гренхема звужувалися, коли він озирався навколо тріскучого вогнища. Через кілька хвилин він зустрів погляд головного шерифа Джорджа, мабуть, найстаршого чоловіка в 5-му патрулі. Джордж зустрів погляд Гренхема, усміхнувся і засміявся. «Ха, добре, добре. Ти вже досить довго питаєш. Думаю, хочеш почути Бій за Ліберситі?» Гренхем невинно знизав плечима. «Не знаю, про що ти говориш, Ґрегорі, але якщо це історія, яку ти хочеш розповісти... Ну, не буду тобі заважати.»\n\nКелахан продовжував дивитися на зірки. Була повна темрява, і йому трохи важко було бачити більш віддалені мерехтіння через його окуляри, але це його особливо не турбувало. «Добре, почнемо з початку. Ви ж знаєте, що Техас колись був набагато жорстокішим місцем, ніж зараз, так? Канібальська культура панувала там близько століття, починаючи з того часу, коли наші предки нарешті оселилися в серці Лафайєта.»\n\nВін зробив паузу, щоб перевести подих. «Ну, з тих пір як мутанти Аттіса і Братство, що переслідувало їх, з’явилися, канібали вже не можуть знайти спокій. Вони досі є в кількох місцях на південь, але це тільки тому, що ми показали їм, якою була ситуація в Ліберситі. Весна 39-го, і я був новачком у силі. Це було ще за часів 9-го патруля, до того, як справа Орлеана призвела до створення 10-го, яким зараз керує наш новий начальник.»"
nf_tpm_act1.3.a: "§g...§!"

nf_tpm_events_continued.7.t: "Бій за Ліберситі, продовження"
nf_tpm_events_continued.7.d: "\"Ну, ви ж чули, якими некомпетентними є Ракети, що керують Х’юстоном та сусідніми містами. Не буду сперечатися з цим фактом. Але якщо віддати належне, то там є хороші люди, і це зробило їх основною мішенню для канібальського повстання. Подивіться, як Братство повільно відсувало канібалів із північного Техасу, а мутанти були занадто зайняті мутацією та знищенням будь-яких людей, яких вони знаходили на південь, то вже не залишалося багато місця для канібалів, щоб нападати. Ми отримали повідомлення по короткохвильовому радіо, і дідусь Келахана привів нас, щоб допомогти цим людям. Якщо чесно, то тут немає великої історії. Ми приїхали на околиці міста, оточили його потайки, і старий начальник пішов всередину сам, щоб поговорити з ними. Він сказав, що ми їх оточили, і вони могли або відступити, або битися, і вони вибрали останнє.» Чоловіки посміхнулися.\n\n«Мабуть, начальник чекав, що його застрелять прямо там, але канібали дозволили йому повернутися до наших ліній. Можливо, вони думали, що він блефує. У будь-якому випадку, все, що я зробив у тій битві, це очистив двоповерховий готель, і там був лише один канібал, що курив у лобі, який здався, коли ми його схопили. Ми зібрали залишки канібалів та містян, запитали їх, хто з них їв людей, а хто просто був на цьому шляху, і ми повісили тих, хто був помічений, що їв людське серце, а решту роззброїли, позначили і відпустили. Потім ми повернулися додому; навіть не просили оплату. Це був чудовий час для всіх.» Гренхем почав аплодувати і широко посміхнувся. «Ну, ми точно показали їм ще тоді! І який урок ми вивчили і навчали?»"
nf_tpm_events_continued.7.a: "Тримайте свої канібальські брудні справи в Техасі!"
nf_tpm_events_continued.7.b: "Ми виконали свою частину в тій більшій битві."

nf_tpm_act1.4.t: "Великий сморід Орлеана"
nf_tpm_act1.4.d: "Нарешті, Гренхем відкинувся назад і свиснув. «Ну що ж, погляньте на час.» Начальник Келахан подивився на годинник родини і свиснув, коли побачив, що вже трохи після 3 години ночі. Він почав вставати, але Гренхем зловив його погляд із саркастичним жестом. «Гей, начальнику, може, у тебе є історія, яку ти хочеш розповісти? Знаєш, щоб допомогти новачкам освоїтися.»\n«Я боявся, що ти мене про це попросиш.» Він усміхнувся і сів назад. «Добре, розповім вам єдину історію, яку варто розповісти, а ви самі зробите свої висновки про те, хто я після цього.»\n\nВін піднявся: «Хто з вас чув, як мій батько зустрів свою смерть?» На відміну від багатьох інших звичних зауважень, які лунали протягом ночі, коментар начальника викликав лише сумну тишу. «Добре, вважаю це за схвалення. Приблизно два десятиліття тому мій батько отримав вістку, що якісь бандити з Орлеана були відповідальні за особливо брудний бій на скелі, і він вирішив, що нам треба піти до їхнього дому, щоб знищити їх. Мені було всього двадцять років, але я вже керував 5-м патрулем, і нам дали обов’язки авангарду. Якось з’ясувалося, що деякі мафіозі в Орлеані дізналися про наші плани — ймовірно, через шпигуна чи щось таке, хоча ми так і не з’ясували як — і влаштували нам хорошу засідку. Ціла лінія вогню в кущах на околицях міста і все таке.»"
nf_tpm_act1.4.a: "§g«Вони нас обстріляли, і ми втратили третину 5-го патруля. Брудна справа.»§!"

nf_tpm_events_continued.8.t: "Великий сморід Орлеана, продовження"
nf_tpm_events_continued.8.d: "\"Ну, було достатньо купи, щоб сховатися за нею, і ми трималися до того, як прийшла допомога. Старий начальник Келахан і 1-й патруль під’їхали ззаду до мафіозів на тихих велосипедах, які ми використовуємо для особливих завдань, і ми влаштували засідку для засідників. Але, ммм...\" Начальник зробив паузу і поправив свої окуляри. \"Ну, це була не зовсім бездоганна перемога. Ми перевірили тіла і знайшли, що між засідниками та кількома іншими боями, що відбулися поруч з подібними результатами, ми вбили майже всіх, кого хотіли, навіть не ступивши ноги в сам Орлеан. Можливо, мафіозі знали, що треба викинути деяких з тих чоловіків, яких ми хотіли найбільше, просто щоб не дозволити нам стати справжньою загрозою; я про це багато думав. Але мій старий отримав кулю в живіт під час порятунку і стік кров’ю, чекаючи, поки його дружина прийде з аптечними засобами. Але він не знав, що її вже вбили в іншій засідці близько години до того, як почалася його битва.\"\n\nКелахан знову зробив паузу і понюхав. Інші члени 5-го патруля ввічливо мовчали. «Що ж, я був поруч з ним, коли він пішов на Землю Господа. Він сказав мені, щоб я добре піклувався про свою матір і сказав, що я колись врятую наше добре місто.» Келахан трохи засміявся і знову подивився на небо. «Я, дурень, все йому повторював, що він буде в порядку, до самого останнього його подиху. І навіть не розумів, скільки сил йому коштувало сказати «Я тебе люблю» в кінці.» Хлопці кивнули, і коли начальник знову відкинувся на своєму кріслі, вони всі віддали йому поважну аплодування. Начальник подивився вгору і помітив деяких інших слухачів, які почали відходити, мабуть, почувши. «Їм самим на краще,» пробурмотів він сам до себе."
nf_tpm_events_continued.8.a: "Тримайте своїх мафіозі в Орлеані!"
nf_tpm_events_continued.8.b: "А ми залишимося осторонь."

nf_tpm_act1.5.t: "Чесна Правда"
nf_tpm_act1.5.d: "\"Дякую вам за те, що прийшли, панове. Сідайте.» Начальник вказав на довгий стіл, який домінував у більшій частині простору в конференц-залі Патрульних імені Джеймса Келахана. «Гадаю, у вас є підозри, чому я викликав вас на таку офіційну зустріч.» Дванадцять лідерів патрулів сіли. Усі, крім старого Френкліна, потягнулися до однієї з глазурованих пончиків, що стояли в мисці, яку передавали по столу. «Що, нам підвищать зарплату?» — пожартував один з новачків. Більшість чоловіків за столом засміялися.\n\n«Ну, ммм, не зовсім. Насправді, навіть скоріше навпаки.» Це привернуло їхню увагу. «Дивіться, я чув кілька тривожних чуток від ваших підлеглих, і деякі з новачків у патрулі попросили мене перевірити кілька речей.» Келахан підсунув своє крісло до голови столу і сів. «Пончик?» Напруга трохи зменшилася, коли один із лідерів патрулів просунув майже порожню пластикову миску по столу. Келахан протягнув руку і витягнув трохи менш злежалий пончик з його низу. «Френклін, не голодний?» Старий чоловік на іншому кінці столу похитав головою і підняв праву руку з вибаченням. «Ну, більше для мене.» Він зробив паузу, щоб зжувати, і зауважив, що пончики цього ранку були трохи занадто солодкими для його смаку."
nf_tpm_act1.5.a: "§g«Це треба буде виправити,» — подумав він про себе.§!"

nf_tpm_events_continued.9.t: "Чесна Правда, продовження"
nf_tpm_events_continued.9.d: "\"Що ж, ммм, начальнику...\" Один з більш досвідчених лідерів — чоловік середнього віку, приблизно одного віку з начальником, на ім’я Роквелл — нахилився через стіл і заговорив з ротом, повним пончиків. «Про що все це? Ми... ммм... ми виконуємо наші квоти, хлопці задоволені, і ми заробляємо більше, ніж будь-коли. В чому проблема?\"\n\nБрови Келахана піднялися, і він зняв свої сонцезахисні окуляри для драматичного ефекту. Це була політика начальника — носити окуляри на службі завжди, тому навіть швидке побачення його смарагдових очей було сприйнято або як велика похвала, або як джерело серйозної стурбованості. Начальник мав на увазі останнє. «Ось в чому проблема. Дивіться, ми завжди отримували фінансування від хороших людей цього хорошого міста, але я отримав доповіді, що ви берете більше, ніж нам справді потрібно. Нам потрібні лише капсули для їжі та зброї, адже у нас немає проблем з водою, а казарми патруля достатньо для всього патруля.»\n\nНачальник оглянувся і помітив, хто з лідерів мав вигляд, близький до провини, а хто зберігав непорушне обличчя. Вони всі це робили, він знав — навіть старий Френклін. «Але це лише початок, і я дозволив цьому тривати занадто довго. Я вирішив, що пора дати кільком людям вирішити деякі проблеми. Щодо однієї з наших більших проблем...»"
nf_tpm_events_continued.9.a: "Наші рушниці старі, і нам треба більше."
nf_tpm_events_continued.9.b: "Наші бої вже не такі, як раніше."

nf_tpm_act1.6.t: "Розмови в таверні"
nf_tpm_act1.6.d: "Келахан пройшов через обертові скляні двері головного бару на вулиці Партикл Роу і оглянувся. Декілька патрульних в лівому кутку кімнати підняли голову і помахали йому; він у відповідь зробив неформальний салют двома пальцями. Інша частина бару була порожня, за винятком кількох самотніх відвідувачів, які пили, щоб забути свої біди, за розкиданими порожніми столами. Світло було приглушене, і начальник зізнався, що йому трохи важко розрізнити деякі з більш зношених облич з-під окулярів, які традиція вимагає носити на його обличчі завжди.\n\n\"Гей, Джонні!\" \"Привіт, начальнику!\" Бармен помахав у відповідь, коли Келахан підійшов до дерев’яного бару, що простягався по всій задній стіні. Начальник сів, кинув на бармена боковий погляд, і бармен кивнув. Він взяв один з багатьох стаканів з поличок на стіні і швидко наповнив його до країв пивом з Нью-Орлеану. \"Довгий день?\""
nf_tpm_act1.6.a: "§gКелахан засміявся і похитав головою§!"

nf_tpm_events_continued.10.t: "Розмови в таверні, продовження"
nf_tpm_events_continued.10.d: "\"Спочатку я зібрав хлопців, щоб поговорити про якусь там "хабарницьку" справу, що відбувалася за моєю спиною...\" Він зробив ще один довгий ковток. \"Потім мені прямо в обличчя сказали, що більшість проблем, про які я щойно згадував, — це частина роботи, і більшість хлопців просто погодилися з ними.\" Джонні підняв голову від склянок, які витирав, і подав начальнику розумілу усмішку. \"Не скажу, що я здивований, босе.\"\n\nКелахан подивився на нього. \"А що ти маєш на увазі?\" Джонні сміявся. \"Ну, те, що я маю на увазі, пов’язано з місячними внесками, які я платив вашим хлопцям, просто щоб підтримувати тут порядок.\" Він кивнув на малу групу новачків патрульних, що пили в далекому кутку бару. \"Бачиш тих хлопців? Вони тут, щоб підтримувати порядок, і я плачу їм пивом і капсулами. Проблема в тому, що іноді саме вони є тими, від кого потрібно цей порядок охороняти. Розумієш, до чого я веду?\"\n\n\"Чорт, це неправильно.\" Начальник зробив ще один довгий ковток. \"Як довго це триває?\" \"Вони вже беруть стільки ж, скільки коштує пиво, десь рік, але такі чергування з ними вже йшли ще з часів твого батька.\" Келахан довго подивився на хлопців в іншому кінці бару. Зрештою, вони незграбно помахали, і начальник незграбно помахав у відповідь. \"Дивись, я розберуся з усім цим. Щось має змінитися. Ми тут, щоб захищати вас патрулюючи, а не просто сидіти п’ючи ваше пиво. Дайте мені трохи часу, і я подивлюсь, що можна зробити.\" \"Ціную це, начальнику.\" Келахан допив напій, кинув на бар три капсули і вийшов з будівлі так, як і увійшов."
nf_tpm_events_continued.10.a: "\"Я знаю, що хлопці не погодяться з моїм висновком, але...\""
nf_tpm_events_continued.10.b: "\"Ну, просто відчувається, що це правильно.\""

nf_tpm_act1.7.t: "Найкраще від Дилера"
nf_tpm_act1.7.d: "Маленький дзвіночок, розташований над входом до магазину, дзвінко задзвонив, коли начальник увійшов. Безтурботний голос прозвучав з-за великого прилавка, що стояв на відстані кількох десятків футів всередині магазину. \"Привіт, ласкаво просимо до Динамітного Денні, чим можу допомогти...?\" Начальник оглянувся на різноманітні закриті контейнери та герметичні ящики, що лежали на підлозі магазину. Деякі мали різноманітні іспанські написи, що вказували на ймовірне походження з Карибського регіону або мексиканських постачальників, з якими був пов’язаний Денні, але більшість його товару завжди була і, ймовірно, завжди буде прямими поставками з Техасу і нелегальних збройних майстерень Нью-Орлеану."
nf_tpm_act1.7.a: "\"Я сказав, чим можу вам допомогти?\""

nf_tpm_events_continued.11.t: "Найкраще від Дилера, продовження"
nf_tpm_events_continued.11.d: "\"Ну, я не звичайний злодій, якщо це те, чого ви чекали.\" Келахан швидко посміхнувся Денні, і той трохи заспокоївся. \"Ну, ну, ну, якщо не сам начальник. Давненько тебе не бачив у цих краях. Що, знову з пістолетом твого батька проблема?\" Келахан засміявся. \"Ні, але у мене багато всього, що просто заклинило і не підлягає ремонту. Виявляється, хлопці просто не потрудилися повідомити мені про це, а тепер я сиджу тут з цим.\" Начальник підійшов до прилавка, поки Денні відкладав свій старовинний револьвер і інструменти для чищення. \"У мене є невелика пропозиція для тебе, Денні. Я чув багато поганих відгуків про деяких своїх хлопців.\" Денні звів брови. \"Нічого занадто поганого про мене, сподіваюсь?\" \"Ні, ти в порядку. Я переживаю за своїх хлопців. Одне питання. Скільки вони брали з тебе за охорону за останні пару років?\" Обличчя Денні трохи знівельовано і він почав рахувати в розумі. \"Я... не можу сказати точно. Змінюється кожного року. Пам’ятаю, що за часів твого батька була просто плата у двадцять капсул, але зараз я плачу сто на місяць. Якось намагався відмовити їх, і після цього один із вантажів зник без сліду. Після того я зрозумів, що краще платити.\" \n\nНачальник свистнув від здивування. \"Ну що ж, ось і чудово. Мені треба замінити деяке старе спорядження, яке ніхто мені не сказав, що воно старе, аж поки недавно. Якщо ти можеш обміняти наші зламані речі на нові, я подбаю про те, щоб хлопці не створювали тобі проблеми протягом наступних кількох років, і після цього знову буде плата в 20 капсул.\" Він простягнув руку через прилавок, щоб Денні потиснув її. Той поглянув на руку з недовірою. \"Слухай, я дуже вибачаюсь, що все так погано стало. Чесно, я не знав. Я роблю все, що можу, і роблю такі пропозиції по всьому місту.\" Денні чекав ще кілька секунд, потім буркнув і потиснув руку начальника. \"Ну, треба ж знати, що тобі треба, щоб я міг дістати все, що тобі потрібно.\" Начальник зняв окуляри і посміхнувся."
nf_tpm_events_continued.11.a: "\"Ми повинні бути готові вирушити в подорож.\""
nf_tpm_events_continued.11.b: "\"Ну, ми будемо захищати наші домівки.\""

nf_tpm_act1.8.t: "Незручна зустріч"
nf_tpm_act1.8.d: "Келахан міг побачити пару тіней, що стояли біля його офісу через матове скло вікна. Вони трохи рухалися, роблячи дикими руками жести. Кілька разів вони підходили до дверей, а потім відступали назад. Він був терплячий; міг почекати. Після близько десяти хвилин цієї гри, коли лише один із трьох учасників знав, що вони грають, один із них нарешті набрався сміливості і постукав. \"Ей, начальнику? Ви тут?\" \"Так! Заходьте, хлопці.\"\n\nДвері повільно відкрилися, і двоє молодих чоловіків увійшли. \"Сідайте, будь ласка.\" Перед столом начальника стояли два стільці, і двоє сіли. Вищий патрульний з яскраво-оранжевою пучкою волосся на обличчі сів на лівий стілець начальника, а нижчий патрульний з акне на обличчі — на правий. \"Ем... Ви хотіли поговорити з нами, сер?\" \"Так, звісно. Дивіться, я трохи попрацював над вивченням багатьох хлопців, що займаються буденними завданнями по управлінню нашим містом.\"\n"
nf_tpm_act1.8.a: "\"Обидва ви є в цьому списку, як ви, мабуть, знаєте.\""

nf_tpm_events_continued.12.t: "Незручна зустріч, продовження"
nf_tpm_events_continued.12.d: "\"Звісно, є чимало таких хлопців у Лафайєті, але мені потрібно було трохи звузити коло. Тому я попросив одного з хлопців стати приватним детективом на тиждень-два, і він знайшов деякі факти. І ці факти можуть стосуватися саме вас двох.\" Начальник подивився по черзі на двох хлопців, які все більше потіли, перш ніж продовжити з закритою посмішкою. \"Один з питань, з якими останнім часом стикається патруль, — це відсутність довіри з боку громадськості. І це питання зазвичай пов’язане з тим, що хлопці вимагають більше грошей, ніж потрібно для патрулювання. Тепер, Тім, я чув деякі чутки про те, як ти переконав хлопців з Дела́но біля Хребта, що його скромний ресторан потребує плати в кілька сотень на місяць лише для захисту від тих самих бандитів, від яких інші ресторани Лафайєта платять стандартні двадцять на місяць. Чому так?\"\n\nНачальник підняв руку, коли Тім відкрив рот: \"Питання було риторичне; не потрібно відповідати. Важливо те, що це неправильно, і я втомився від цього.\" Начальник повернувся до Кіма, який все ще чекав свого черги бути покараним. \"Я буду коротким, бо знаю, що ви, ймовірно, вже сплатили достатньо вину за це, оскільки думаю, що ви обидва все ж хороші, порядні люди, навіть під усією цією брудною шкірою. Кім Лесер, ти застрелив бандита, що здавався, в голову і поховав його в секреті в 72-му?\" Кім замовк, але його голова опустилася, і він почав тремтіти. \"Саме це я і думав.\" Начальник встав і міцно поставив руки на стіл. Жоден із патрульних не підняв очей, щоб зустріти його погляд під окулярами."
nf_tpm_events_continued.12.a: "\"Слухайте, просто... Залишайтесь тихо, гаразд?\""
nf_tpm_events_continued.12.b: "\"Тім, для твоєї ж користі, залишай нас.\""
nf_tpm_events_continued.12.c: "\"Кім, ти не заслуговуєш на цей значок.\""
nf_tpm_events_continued.12.e: "\"Вибирайтесь із мого офісу.\""

nf_tpm_act1.9.t: "Нові ідеї щодо охорони правопорядку"
nf_tpm_act1.9.d: "Ратуша Лафайєта не була такою переповненою з часів легендарного танцю молоді 71-го року. На щастя, замість маленької орди підлітків і молодих дорослих, цього разу всі місця були заповнені сотнями людей в повній золотій і синій формі патрульних Лафайєта. На жаль, ще сотні людей довелося стояти поза межами з колонками, щоб передати голос начальника на таку відстань. І ніхто не вирішив залишити зброю при вході, адже ніхто інший цього не робив.\n\nКелахан ковтнув і нахилився до мікрофона. \"Привіт, всі.\" Порив аплодисментів піднявся від натовпу, і йому хотілося просто зникнути. \"Я, ем... не дуже добре говорю на публіці, як деякі з вас, можливо, знають, тому я буду коротким.\" Він зробив паузу і посміхнувся ніяково, поки люди влаштовувались на своїх місцях. Він беззвучно подякував Богу, що ще мав на собі ці окуляри. \"Хех. Хотів би я сказати, що буду коротким і приємним, але немає нічого приємного в тому, що я маю сказати сьогодні.\""
nf_tpm_act1.9.a: "§gВін зробив паузу і витягнув маленький шматочок паперу зі свого правого кишені.§!"

nf_tpm_events_continued.13.t: "Нові ідеї щодо охорони правопорядку, продовження"
nf_tpm_events_continued.13.d: "\"Отже. Я почну з найскладнішого. Як ви знаєте, я звільнив кількох наших хлопців за останні кілька місяців. Більшість з них — непогані хлопці, і я не скажу нічого про їхні навички чи мужність, але в нас виникли проблеми з тим, що патрульні беруть з людей забагато грошей за те, за що вони фактично не мають вибору платити. Хотів би нагадати вам, що ми тут, щоб захищати людей, а не грабувати їх, зрозуміло?\" Цей момент зустріли лише незграбними поглядами і поглядами вниз. \"Добре, я прийму тишу як ознаку того, що ви зрозуміли. Дякую за це. Тепер, до великої проблеми. Я чув нещодавно чутки. Пам’ятаєте той набіг Гаторів, що пройшов повз нас місяць чи два назад? Вони викрали кількох наших найкращих громадян просто з-під носа.\" Це викликало гнівні мурмуріння. \"Так ось, один із наших патрулів отримав повідомлення, що бачив тих самих людей, яких ми втратили.\" Тиша. \"Внизу, на консервному заводі.\" Надія на початку. \"Вони в ланцюгах, і їхніми руками ними керують під дулом рушниці.\" Обурення.\n\nРатуша вибухнула на крик, і кілька найбільш злісних поліцейських вистрілили в стелю. \"Ей, заспокойтесь, всі! Ми намагалися питати людей з Баю, але кожного разу нас просто виганяли. Отже, ось що ми зробимо. Ми підемо туди самі, всі до одного з нас. І тоді ми розберемося, що вони там роблять на цьому заводі.\" Підтримка серед натовпу. \"А поки ми там, ми вирушимо назад до Александрії. Ця банда Гаторів сміється з нас занадто довго.\" Келахан відчував, як піт стікає по кожній частині його шкіри, яка не контактувала з його одягом, але було трохи полегшення від того, що натовп здавалося на його боці. \"Добре, заспокойтесь. Останнє питання на порядку денному. Якщо ми будемо вести цей патруль на війну — і я справді маю на увазі війну — нам треба, щоб наша форма була трохи кращою. Тому мені потрібні добровольці для невеликого проєкту. Є бажаючі?\" Кожна рука в залі піднялася одночасно."
nf_tpm_events_continued.13.a: "\"Поліцейські завжди робили для нас все правильно.\""
nf_tpm_events_continued.13.b: "\"Не завадило б мати належні засоби пересування.\""
nf_tpm_events_continued.13.c: "\"Можливо, найкращим з нас дадуть спеціальне спорядження?\""

nf_tough_crowd.1.t: "Життя триває"
nf_tough_crowd.1.d: "Світло в офісі начальника патруля було вимкнено. Потім двері скрипнули, рука протягнулася всередину, і світло включилося. Начальник відкрив двері трохи ширше, зайшов всередину і зачинів їх за собою. Потім він сів на підлогу спиною до дверей. Він закрив очі і тихо видихнув. Через хвилину важкого дихання він зібрався і знову відкрив очі. Салліван III стрибнув з вічно прихованого сховку і підійшов, сівши прямо перед Келаханом. Кіт обурено мяукнув.\n\n\"Привіт, старий.\" Келахан посміхнувся і пару разів поцілував себе в щоку перед тим, як встати. \"Ладно, давай я дам тобі їсти.\" Він підійшов до полиці і взяв банку з рибою. \"Це смішно.\" Логотип на банці залишився таким самим, але тепер під звичайним написом були нові золоті та сині сталеві револьвери."
nf_tough_crowd.1.a: "\"Цікаво, скільки хлопці заплатили, щоб це зробити.\""

nf_tpm_events_continued.14.t: "Життя триває"
nf_tpm_events_continued.14.d: "Салліван підійшов і потерся об праву ногу начальника. Він мяукнув, а потім потягнувся: \"Вибач, що відволікся.\" Він відкрив банку і висипав її вміст у миску, яку забув помити після вчорашнього прийому їжі. \"Ось тобі, Салліван. Їж.\" Начальник погладив кота хвилину чи більше перед тим, як підійти до свого столу. \"Добре, давайте подивимося...\" Він перегорнув кілька листів і нотаток, які були доставлені за останні пару днів з того часу, як він пішов на патруль із П’ятими. \"Лист від дитячого будинку — це була гарна похоронна служба...\" Він перевернув ще один. \"Хм, забув, що моє свято було кілька днів тому. Треба було згадати.\" Потім він побачив лист з двостволим гербом Техаського Братства на ньому.\n\n\"Ну, якщо це не найцікавіше!\" Він відкрив його і прочитав записку всередині. Він подивився вниз на свою руку і побачив, що вона тремтить. \"Ей, Салліван...\" Голос начальника затремтів. \"Здається, Братство зацікавилося нами. Не знаю, чи...\" Начальник встав і відчув запаморочення. \"Не знаю, чому вони зацікавилися нами? Ми ж... Ми не техаські. Чому...\" Він спіткнувся і ляг на ліжко. Його голова кружила ще кілька хвилин, але він заспокоївся, коли Салліван стрибнув на ліжко і влаштувався біля руки начальника. Він погладив кота, і все почало ставати на свої місця, завершуючи тим, що світ повернувся до нормального стану. \"Ми не можемо просто дозволити їм нас захопити. Не так, як це.\""
nf_tpm_events_continued.14.a: "\"Ми робили все, щоб зробити правильно для нашого народу.\""
nf_tpm_events_continued.14.b: "\"Принаймні пригоди самі себе оплачували.\""

nf_tpm_act2.1.t: "Стальнозахищені Божевільні"
nf_tpm_act2.1.d: "Келахан ходив вгору і вниз серед зібраних лідерів патрулів прямо біля головного патрульного відділення Лафайєта. Вони стояли по-солдатськи, намагаючись зобразити військову позу. Тільки Франклін, здається, робив це з якоюсь ступенем компетентності. \"Якщо бій напевно призведе до перемоги,\" він почав, \"ну, тоді нам треба битися. На жаль, я не можу точно сказати, чи ми переможемо. Братство — це купа злих ублюдків, і їхні броні кращі за багато того, що ми могли б протиставити їм. Це буде не легка битва. Але ось що: якщо ми не будемо битися, бандити Руска прийдуть до Лафайєта, покінчать з патрулем і перетворять наше гарне місто на ще один осередок техаської пустки. Ви хочете цього?\" Більшість лідерів похитали головами і виглядали обуреними. Франклін буркнув, а кілька інших посміхнулися."
nf_tpm_act2.1.a: "\"Саме так я і думав. Дивіться ось сюди.\""

nf_tpm_events_continued.15.t: "Стальнозахищені Божевільні, продовження"
nf_tpm_events_continued.15.d: "\"Наша робота завжди була боротися з бандитами. Братство так само бореться з бандитами, як і ми, і в більших масштабах. Але якщо ці люди готові полювати на мисливців за бандитами, то вони не кращі за самих бандитів. Ми не зробили їм нічого поганого, а вони намагаються вбити нас просто за те, що ми живемо тут. Не знаю, чи у вас є така ж нерішучість щодо боротьби з цими хлопцями, як у мене, але якщо є, пам’ятайте, що саме вони почали. Якщо ми переможемо, ми відновимо їх і самі вирішимо проблему техаських бандитів. А якщо програємо...\" Він знову замовк і подивився на землю. \"Хех.\" Він подивився вгору. \"Ну, якщо програємо, ми скажемо своїм дітям, що зробили все можливе, і цього буде достатньо. Зрозуміли?\"\n\n\"Так, шефе.\" Франклін кивнув з похмурою посмішкою, і решта лідерів зробили те саме. \"Добре. Збирайте своїх хлопців і давайте охороняти наш дім. Спочатку пограємо на час, подивимося, чи набридне Техасу і вони відступлять. Якщо ні... Ну, перейдемо через цей міст, коли дійдемо. Удачі.\" Він останній раз усміхнувся і помахав лідерам на прощання. Вони вирушили до своїх патрульних джипів і по одному виїхали з території. Начальник стежив за кожним, поки вони не поїхали, потім повернувся до свого офісу, коли всі вже поїхали. Потім він ліг на ліжко, поклав руки на обличчя і застонав протягом цілого хвилини. Він почув, як Салліван III чхає на іншому боці кімнати. Тоді він заснув на короткий час."
nf_tpm_events_continued.15.a: "\"Добре, що ми на боці хороших хлопців.\""
nf_tpm_events_continued.15.b: "\"Частина людської природи, мабуть.\""

nf_tpm_act2.2.t: "Міссісіпійська Війна"
nf_tpm_act2.2.d: "\"Ти впевнений, що це спрацює?\" — запитав начальник, дивлячись, як лідер патруля Франсіс возиться з кількома проводами, підключаючи маленький джерело живлення до радіо, яке з’єднане з супутниковою антеною і телефоном. Це була велика, заплутана купа проводів, і за оцінкою самого начальника, Франсіс був божевільним. Франсіс трохи засміявся. \"Чесно кажучи, шефе, я поняття не маю. Але моя сестра Франсін, здається, думає, що це спрацює, і вона якась техно-чарівниця. Побачимо.\" Він натиснув ще кілька кнопок на комп’ютерному пульті, підключеному до пристрою, з’єднав ще кілька проводів і налаштував антену так, щоб вона була спрямована в певний бік через вікно. \"Добре, якщо це працюватиме, то має почати працювати зараз. Маємо з’єднання з Далласом, якщо у тебе є номер.\" \n\n\"О, є.\" Начальник усміхнувся. Дружина сержанта Себастьяна Кіта вручила особисто листа до офісу начальника патруля з проханням зробити все можливе, щоб закінчити війну. Той Алексіс була дуже приємною і формальною в усьому цьому, згадував начальник. Він взяв телефон і набрав номер, який написав на клаптику паперу. Телефон дзвонив двадцять секунд. Потім хтось підняв трубку. \"Русе. Хто це?\"\nНачальник усміхнувся і кивнув Франсісу, який у відповідь показав знак заспокоєння і вказав великий палець. \"Привіт, Едді! Вирішив, що тепер саме час подзвонити.\""
nf_tpm_act2.2.a: "§gЗ іншого кінця телефону лунала низька сміхова реакція.§!"

nf_tpm_events_continued.16.t: "Міссісіпійська Війна, продовження"
nf_tpm_events_continued.16.d: "Начальник сів і поставив ноги на інший стілець перед собою. \"Не дам, ви не можете! У нас є свої способи, так само як і у вас. Але скажу, що це має відношення до того, що хтось із ваших людей сподівається, що їх хтось особливий не помре даремно.\" Він призупинився, щоб Рус отримав можливість зрозуміти. \"Слухай, думаю, ти розумієш, чому я дзвоню, але скажу все одно. Ми не хочемо цієї війни, і це очевидно, що вам її треба припинити. Минуло чимало місяців з того часу, як ми останній раз говорили, і тепер люди вмирають у великій кількості.\" Він призупинився. \"Але для вас. Не для нас. Ми живемо добре.\" З того боку лінії прозвучав різкий сміх. \"Ну, ваші люди їх і вбивають.\"\n\nКелахан сердито вдарив ногами по землі і нахилився до телефонної трубки. \"Ви вирішили, що Техасу для вас замало. Ви захотіли забрати частину наших будинків. Ми будемо боротися за наші будинки, так само як ви б це зробили на нашому місці.\" Його тон трохи пом’якшав. \"Слухай сюди. Я даю вам останній шанс. Ми можемо стати друзями, якщо ви хочете. У мене є великий пакет капіталів в вантажівці, який чекає на наказ вирушити, як тільки ви оголосите перемир’я, і знову ж, ми готові приєднатися до вашої економічної групи.\" Він призупинився. Він подивився на лідера патруля Франкліна, який показав йому ще один знак схвалення. \"Але якщо ви будете продовжувати вбивати наших синів і дочок хоча б ще на один день, нам доведеться приїхати до Далласа і розібратися з вами. Ми мисливці на бандитів, Русе. А ви намагаєтеся забрати наше. У вас є час до завтра на цю ж годину, щоб сказати своїм хлопцям припинити бій і ми зможемо щось вирішити. Ви знаєте, де мене знайти, Старий.\" Він надав особливий відтінок на останнє слово і поклав трубку. \"Пфу! Як я справився?\" Він відкинувся в кріслі і витер лоб. Все, що він отримав, це ще один знак схвалення."
nf_tpm_events_continued.16.a: "\"Сподіваюся, Рус розумний хлопець.\""

nf_tbh_tpm_events.13.t: "Остаточна пропозиція Келахана"
nf_tbh_tpm_events.13.d: "Едвард Рус возився з класичним морським трубкою в тиші свого підземного офісу, коли його телефон раптом почав дзвонити. \"Хм.\" Він сильно прикусив трубку і встати, обережно не збивши чашку з кавою, що ледь не впала з краю його столу. Він підійшов до телефону на стіні офісу — він давно хотів перенести його на стіл — і підняв трубку. \"Рус. Хто це?\"\n\"Привіт, Едді!\" — весело прозвучав густий південний голос з іншого кінця. \"Думав, що зараз саме час подзвонити.\"\nРус усміхнувся і тихо засміявся. \"Привіт, Келахан. Можу запитати, як ти отримав цей номер?\"\nСміх з іншого кінця телефону. \"Не дам, ви не можете! У нас є свої способи, так само як і у вас. Але скажу, що це має відношення до того, що хтось із ваших людей сподівається, що їх хтось особливий не помре даремно.\" Рус подивився через кімнату. Грант? Можливо, Алексіс? Хм. \"Слухай, думаю, ти розумієш, чому я дзвоню, але скажу все одно. Ми не хочемо цієї війни, і це очевидно, що вам її треба припинити. Минуло чимало місяців з того часу, як ми останній раз говорили, і тепер люди вмирають у великій кількості.\""
nf_tbh_tpm_events.13.a: "§gВін призупинився.§!"

nf_tpm_events_continued.17.t: "Остаточна пропозиція Келахана, продовження"
nf_tpm_events_continued.17.d: "\"Для вас, проте. Не для нас. Ми живемо добре.\"\nРус трохи засміявся. \"Ну, ваші люди їх і вбивають.\"\nКелахан видав звук, схожий на ричання. \"Ви вирішили, що Техасу для вас замало. Ви захотіли забрати частину наших будинків. Ми будемо боротися за наші будинки, так само як ви б це зробили на нашому місці.\" Його тон трохи пом’якшав. \"Слухай сюди. Я даю вам останній шанс. Ми можемо стати друзями, якщо ви хочете. У мене є великий пакет капіталів в вантажівці, який чекає на наказ вирушити, як тільки ви оголосите перемир’я, і знову ж, ми готові приєднатися до вашої економічної групи.\" Він призупинився. Рус подивився на свій годинник. Половина на четверту. \"Але якщо ви будете продовжувати вбивати наших синів і дочок хоча б ще на один день, нам доведеться приїхати до Далласа і розібратися з вами. Ми мисливці на бандитів, Русе. А ви намагаєтеся забрати наше. У вас є час до завтра на цю ж годину, щоб сказати своїм хлопцям припинити бій і ми зможемо щось вирішити. Ви знаєте, де мене знайти, Старий.\" Він надав особливий відтінок на останнє слово. Потім лунало клацання на іншому кінці лінії. Рус стояв кілька хвилин у тиші. Потім він повернувся до свого столу і набрав повідомлення для скликання ради, на якій він представить випадок Келахана для досить спірного миру."
nf_tpm_events_continued.17.a: "\"Добре, добре. Повідомте їх.\""
nf_tpm_events_continued.17.b: "\"Ми почали цю війну; ми її й завершимо!\""

nf_tpm_act2.3.t: "Попередження Далласу"
nf_tpm_act2.3.d: "\"Так, є ще щось, про що мені слід згадати?\" — запитав Келахан, озираючись на столі. Більшість інших лідерів вже висловили свої думки, і в цілому було чути кивання головами."Тільки одна річ,\" — сказав старий Франклін з іншого кінця столу. \"Що ти маєш на увазі?\" \"Просто хочу ще раз нагадати, що ми всього лише кілька заступників і правоохоронців. Як це було раніше, перед тим як почали ставати амбітними. Не забудь.\" Начальник кивнув і піднявся. \"Добре, бажайте удачі, панове.\" Він усміхнувся і прийняв першу одноголосну підтримку, яку він отримав від своїх лідерів патрулів за довгий час."
nf_tpm_act2.3.a: "§gВін вийшов з конференц-зали і попрямував до гаража.§!"

nf_tpm_events_continued.18.t: "Попередження Далласу, продовження"
nf_tpm_events_continued.18.d: "Це був міський зал вже близько 300 років, з коротким, неофіційним півстолітнім перервом, враховуючи радіоактивний осад. З того часу, як Братство захопило місто, начальник чув, що вони доклали великих зусиль, щоб відновити будівлю як символ своєї влади. З того, що міг зрозуміти начальник, вони зробили непогану роботу, хоча бетонний фасад потребує нового шару фарби. Він припаркувався на вільному місці на передньому майданчику міського залу і зайшов всередину. Головний вхід до Далласського бункера був прямо перед ним у лобі будівлі, з іншими підрозділами бюрократії Братства, що простягалися через інші верхні поверхи будівлі. Він підійшов до одного з охоронців в броні, що стояли на посту по обидва боки сталевих дверей бункера. \"Привіт, я, мм, Калехан. Я з Лафайєта, і я, мм, хочу поговорити з Ельдером Русом. Знаєш, де я можу його знайти?\"\n\nОхоронець зняв шолом і подивився на Калехана зверху до низу. \"Ти начальник патруля?\"\n\"Так, це я.\" Він усміхнувся і намагався виглядати невимушено. Охоронець подивився на свою сторону і промимрив щось образливе, що Калехан не зовсім зрозумів. Потім він повернувся і натиснув кілька кнопок на екрані, вмонтованому в стіну біля входу до бункера. Потім він повернувся і став по стійці на кілька хвилин незручного мовчання. Врешті-решт, Калехан почав нетерпляче чекати. \"Ну, мм, коли це—\" В цей момент сталеві двері бункера загреблися і вийшов чоловік середнього віку в коричневому костюмі. Він оглянувся, побачив начальника і підійшов. \"Начальник патруля Адам Калехан з Лафайєтського патруля?\" Начальник здивовано відкинув голову назад. \"Це досить формальний спосіб це сказати, але так, я начальник. Прийшов поговорити про деякі речі, які я чув.\"\n\"Звісно, звісно. Ось сюди. Я Ельдер Рус, до речі.\" Обидва увійшли до бункера, і сталеві двері знову гримнули за ними."
nf_tpm_events_continued.18.a: "\"Я впевнений, вони будуть розумно ставитись до цього.\""
nf_tpm_events_continued.18.b: "\"У мене є сумніви.\""

nf_tpm_act2.4.t: "Заводячи техаських друзів"
nf_tpm_act2.4.d: "Калехан відпочивав на випадковій лавці, пив лимонад в Меморіальному парку Лафайєта, коли в його поле зору увійшла трійка доволі цікавинних фігур. Першим був паладин Братства в повному обладунку та регаліях, з тимчасовим плащем. Він тримав шолом під правою рукою, ймовірно, щоб було легше спілкуватися з друзями. Він виглядав незброєним, але начальник не довіряв цьому судженню.\n\nДругим був супер мутант в синіх комбінезонах та в клітинчатій сорочці з підкатаними рукавами. Він носив типовий техаський ковбойський капелюх, але з відкушеним шматком з боку, і носив його з помітним нахилом праворуч. У нього в комбінезоні була прихована бойова ніжка, серед інших вільно носимих дрібниць.\n\nТретя фігура була звичайною жінкою в джинсах, сорочці з коміром та коричневому жилеті, який зараз панував у моді Лоне-Стар через вибір одягу мера Чо Бенга. Вона йшла з невеликим підстрибуванням і з срібними ланцюжками, що звисали з її лівої кишені, що, ймовірно, означало, що вона була або заможним караванером, або власницею родинного бізнесу."
nf_tpm_act2.4.a: "§g...§!"

nf_tpm_events_continued.19.t: "Заводячи техаських друзів, продовження"
nf_tpm_events_continued.19.d: "Калехан спостерігав, як трійка знайшла власну дерев’яну лавку перед маленьким ставком, що домінував в центрі парку. Мутант сів, і лавка трохи прогнулася. Жінка сіла, і нічого не змінилося. Паладин подивився на лавку з острахом, оглянувся — очевидно, не помітивши начальника, чий брови вже піднімались високо на обличчі — і намагався сісти. Лавка витримала кілька секунд, потім тріснула, а потім зламалася. Калехан швидко підсів, коли помітив, що жінка впала між мутантом та паладином, але трійка швидко піднялася без проблем і добре посміялась з цього. Начальник усміхнувся і покачав головою. Потім він зробив ще один ковток лимонаду. Пара патрульних, які були поза службою, підійшла до сміючої трійки і почала з ними говорити, вказуючи на лавку.\n\nЧерез хвилину неформальної розмови паладин передав кілька капіталів патрульним. Вони оглянулись і побачили начальника, віддавши йому звичайний салют, перш ніж піти. Він відповів їм тим самим. Три неформальні особи подивились на начальника і помахали йому. Начальник також помахав їм у відповідь, усміхаючись при цьому. Він зробив ще один ковток свого напою і відкинувся назад на лавці. Закрив очі, і зрештою ці троє підійшли до нього. Вони були хорошими людьми, і у них була приємна бесіда. Вони вибачилися за лавку, і начальник сказав їм не турбуватися про це. Лавки можна замінити. Друзів, однак, трохи важче замінити."
nf_tpm_events_continued.19.a: "Даллас має підозріло смачну їжу."
nf_tpm_events_continued.19.b: "Лоне-Стар має найкращі прибутки."
nf_tpm_events_continued.19.c: "Мутанти Остіну дивно доброзичливі до нас."

nf_tpm_act3.1.t: "Священний обов’язок шерифа, частина 1"
nf_tpm_act3.1.d: "\"Привіт, Ларрі, передаси сироп?\" \"Звісно, босе.\" Ларрі підняв пляшку імпортованого тростинного сиропу і передав її вниз по столу. Франклін встав і нахилився до конференц-столу. \"Отже, думаю, що Маггі хотіла б дізнатися, як їй вдалося.\" Він усміхнувся і вказав на двері кімнати, де стояла дружина Старого Чоловіка, чекаючи на свою заслужену похвалу. \"Рішення?\"\n\nКожен по черзі подякував Маггі за її чудову кухню — не часто Патруль отримує млинці під час своїх зустрічей на вихідних. Зустріч була стандартною, окрім їжі; надійшов запит з Далласа надіслати керівника патруля Ларрі для кількох днів для відповіді на бюрократичні питання, Остін хотів дізнатися, коли вони отримають наступну поставку від Каннері, а Лоне Стар хотів дізнатися, чи не хоче Лафайєт взяти будь-які дружні борги з низьким відсотком. Вони завжди це запитували, і як правило, Лафайєт завжди дякував за пропозицію, але відмовляв, оскільки все було в порядку, як є.\n\nЗустріч розпалася, і більшість керівників вийшли. Франклін залишився і поговорив з начальником про щось неважливе, коли Калехан відчув, як його серце раптово впало в груди. Він сидів нерухомо хвилину, порожньо дивлячись на стіл."
nf_tpm_act3.1.a: "\"Гей, начальнику. Ти в порядку? Начальнику?\""

nf_tpm_events_continued.20.t: "Священний обов’язок шерифа, частина 2"
nf_tpm_events_continued.20.d: "Адам прийшов до тями. \"Вибач, Франклін. Просто, мм... Щось ти сказав зараз нагадало мені про мого батька. Ти сказав, що хотів би дізнатися, що станеться з пусткою і чи це справді пустка більше. Тато часто це говорив.\" Франклін поставив старечу задуману позу. \"Тепер, як я думаю, можливо, я і сам взяв цю фразу від нього. Хм.\" Розмова повернулася до нормального русла, і зрештою Франклін зібрався і пішов. Серце Калехана билося швидше. Він не знав чому. Іноді такі речі трапляються без видимої причини, і він знав це.\n\nВін встав, сів назад, коли почув запаморочення, і знову встав. Він вийшов із конференц-кімнати, звернув праворуч в коридорі, пройшов до іншого кінця будівлі і відкрив свій кабінет. Він відкрив двері, зайшов всередину, закрив їх за собою і зачинив.\n\"Привіт, Саллі.\" Кішка була згорнута на ліжку біля нього. \"Довгий день,\" сказав він кішці. \"Голова ще трохи болить.\" Він на мить затримався."
nf_tpm_events_continued.20.a: "§gПотім він підійшов до ліжка і ліг.§!"

nf_tpm_events_continued.21.t: "Священний обов’язок шерифа, фінал"
nf_tpm_events_continued.21.d: "\"Гей, Саллі?\" Він ткнув кішку. Вона не рухалася. \"Ох, давай, Саллі, не зараз.\" Він підняв передню лапу кішки. Вона була млявою і трохи холодною. \"Ні, не-не-не...\" Він підняв кішку за тулуб, і Саллі Третій не рухався. Начальник довго дивився на кішку, потім притягнув її до грудей і сам згорнувся. Сльози почали котитися. §o\"Як ти, завжди йдеш, коли мені найбільше потрібно, щоб ти був поруч...\"§! Начальник почав тихо тремтіти, і незабаром він заснув, його сни були наповнені знанням про важке і невизначене майбутнє."
nf_tpm_events_continued.21.a: "§3\"Поки розумні голови можуть думати, все буде добре.\"§!"

nf_tbh_tpm_events.9.t: "Гірка перемога, частина 1"
nf_tbh_tpm_events.9.d: "\"Гей, мм, Ларрі.\" Начальник на мить зупинився. \"Можеш передати сироп? Вибачте.\"\n\"Звісно, босе.\" Ларрі підняв пляшку імпортованого тростинного сиропу і передав її вниз по столу.\nФранклін встав і нахилився до конференц-столу. \"Отже, думаю, що Маггі хотіла б дізнатися, як їй вдалося.\" Він усміхнувся і вказав на двері кімнати, де стояла дружина Старого Чоловіка, чекаючи на свою заслужену похвалу. \"Рішення?\"\nКожен по черзі подякував Маггі за її чудову кухню — не часто Патруль отримує млинці під час своїх зустрічей на вихідних. Зустріч була стандартною, окрім їжі; надійшов запит з Далласа надіслати ще трохи зброї для боротьби з залишками братства, Остін хотів дізнатися, коли вони отримають наступну поставку військ, а Лоне Стар хотів дізнатися, чи зможе Лафайєт допомогти з кількома фінансовими проблемами, пов’язаними з військовими боргами, що турбують кількох конкретних і набридливих осіб. Вони завжди це запитували, і як правило, Лафайєт завжди дякував за запит, але відмовляв, оскільки все було трохи хаотично, і вони займуться цим, як тільки зможуть. Зустріч розпалася, і більшість керівників вийшли. Франклін залишився і поговорив з начальником про щось неважливе, коли Калехан відчув, як його серце раптово впало в груди. Він сидів нерухомо хвилину, порожньо дивлячись на стіл."
nf_tbh_tpm_events.9.a: "\"Гей, начальнику. Ти в порядку? Начальнику?\""

nf_tpm_events_continued.22.t: "Гірка перемога, частина 2"
nf_tpm_events_continued.22.d: "Адам прийшов до тями. \"Вибач, Франклін. Просто, мм... Щось ти сказав зараз нагадало мені про мого батька. Ти сказав, що хотів би дізнатися, що станеться з пусткою і чи це справді пустка більше. Тато часто це говорив.\"\nФранклін поставив старечу задуману позу. \"Тепер, як я думаю, можливо, я і сам взяв цю фразу від нього. Хм.\" Розмова повернулася до нормального русла, і зрештою Франклін зібрався і пішов. Серце Калехана билося швидше. Він не знав чому. Іноді такі речі трапляються без видимої причини, і він знав це. Він встав, сів назад, коли почув запаморочення, і знову встав. Він вийшов із конференц-кімнати, звернув праворуч в коридорі, пройшов до іншого кінця будівлі і відкрив свій кабінет. Він відкрив двері, зайшов всередину, закрив їх за собою і зачинив."
nf_tpm_events_continued.22.a: "§gПотім він підійшов до ліжка і ліг.§!"

nf_tpm_events_continued.23.t: "Гірка перемога, фінал"
nf_tpm_events_continued.23.d: "\"Привіт, Саллі.\" Кішка була згорнута на ліжку біля нього. \"Довгий день,\" сказав він кішці. \"Голова ще трохи болить.\" Він на мить затримався. \"Привіт, Саллі?\" Він ткнув кішку. Вона не рухалася. \"Ох, давай, Саллі, не зараз.\" Він підняв передню лапу кішки. Вона була млявою і трохи холодною. \"Ні, не-не-не...\" Він підняв кішку за тулуб, і Саллі Третій не рухався. Начальник довго дивився на кішку, потім притягнув її до грудей і сам згорнувся. Сльози почали котитися. §R\"Це не правильно, чорт забирай.\"§! §t\"Це не правильно.\"§! Начальник плакав, і незабаром він заснув, його сни були наповнені знанням про важке і невизначене майбутнє."
nf_tpm_events_continued.23.a: "§gДобре, давайте розберемося з нашим майбутнім.§!"
nf_tpm_events_continued.23.b: "§RIз мене вистачило деяких бандитів у синіх мундирах.§!"

nf_tpm_act3.2.t: "Калехан – клоун"
nf_tpm_act3.2.d: "Начальник кинув останній шматок землі в яму, що закривала маленьку дерев’яну труну. Потім він ущільнив землю, переконавшись, що вона рівна. Він зробив кілька кроків назад, кинув лопатою, яку використовував, взяв молоток в ліву руку, а залізний цвях у праву і присів. Він обернув цвях так, щоб римська цифра III була спрямована від місця труни. Потім він втиснув його в м’яку землю і використав молоток, щоб забити його, поки половина цвяха не опинилася під землею.\n\nПотім він встав, зробив кілька кроків назад, стиснув кулаки і тихо промовив молитву. Коли він закінчив, він гірко подивився на цвях, підняв лопату і молоток і пішов назад до довоєнного пікнічно столу, встановленого на бетонному патіо за патрульною станцією."
nf_tpm_act3.2.a: "§gВін підняв чорний капелюх, що лежав на столі, і дивився на нього.§!"

nf_tpm_events_continued.24.t: "Калехан – клоун, продовження"
nf_tpm_events_continued.24.d: "\"Хлопці говорять дивно про тебе, начальнику. Ти знаєш, що цей капелюх для них означає.\" \"Так, знаю.\" Калехан надів чорний капелюх і сів поруч із Старим Франкліном. Він трохи почекав, потім почав коригувати капелюх. \"Не зовсім підходить. Потрібно буде показати його кравцеві.\" Франклін зневажливо хмикнув. \"Цей капелюх не бачив сонця вже майже три десятки років. І це вже давно не використовувався в роботі. Скільки часу ти плануєш його носити?\" \"Поки патруль не повернеться до нормального стану,\" відповів начальник. \"Мені не більше подобається його носити, ніж хлопцям. Але через всі ці проблеми в Техасі та огидний рівень корупції, що я бачив в патрулі в цілому, думаю, пора їм дати ляпаса. Якщо для цього знадобиться привид з їхньої історії, щоб нагадати їм, що ми повинні бути тими хорошими, нехай буде так.\"\n\nВін на мить замовк і похитав головою. \"Я відкладав це занадто довго. Тато знав, що я буду змушений зробити щось подібне.\" Він подивився на Франкліна. \"Він так і написав у тому листі, що ти мені дав кілька років тому.\" Франклін сумно кивнув. \"Лафайєт гниє, і через ворожість деяких наших хлопців, лицемірство Техасу і велику халепу з війною в Баю, забагато наших хлопців готові вбивати людей заради власної вигоди. І мені це набридло. Якщо я повинен використати кілька своїх козирів і вигнати пару людей з патруля, щоб зробити все знову хорошим...\" Франклін сумно посміхнувся. \"Ну, давайте спершу розберемося з проблемою в Техасі, а потім ти можеш спробувати вирішити це все. Як ти плануєш це зробити?\"\nКалехан гірко посміхнувся. \"З величезними труднощами, мабуть.\""
nf_tpm_events_continued.24.a: "Техас може залишити Техас."
nf_tpm_events_continued.24.b: "Де один заступник не зміг, інший повинен завершити роботу."

nf_tpm_act3.3.t: "Законник і юрист"
nf_tpm_act3.3.d: ""Щорічна плата за патруль, сер. 20 капсів, якщо ласка." Бармен кивнув. "Радий бачити, що ціна знижується. Ось, тримай." Він простягнув руку до свого касового апарата і нарахував 20 капсів. Потім він поклав їх у простягнуту руку Депутатського Тренера Андрюса. Андрюс подякував чоловікові, а потім повернувся до начальника, який чекав біля дверей. "Бачиш, казав же, що це не буде так складно." "Мабуть, я просто не звик бути податківцем і депутатом одночасно," пробурмотів Андрюс. "Ех, звикну." "Так, звикнеш," сказав начальник.\n\nВін помахав на прощання бармену з Ефрафи і повернувся до виходу, але бармен помахав йому рукою, аби він підійшов. Калахан підняв брову, трохи нахилив свій чорний капелюх уперед і підійшов. "Так, Ленні?" "Лист для тебе. Хтось з 7-го відправив його пару днів тому, думаючи, що ти зайдеш." Він передав начальникові конверт. "Сказав, що це від якогось Руска. Єдиний, кого я знаю з таким ім’ям, це старійшина з Техасу, але впевнений, що це не він.""
nf_tpm_act3.3.a: "§gКалахан кинув на нього цікаве погляд перед тим, як взяти листа і відкрити його.§!"

nf_tpm_events_continued.25.t: "Законник і юрист, продовження"
nf_tpm_events_continued.25.d: ""Привіт, начальнику. Розумів, що напишу листа, поки є час. Минулого місяця стався інцидент у Далласі, про який я вважав, що ти повинен знати. Троє депутатів Патруля — депутати Клудо, Джош і Марел — були спіймані колишнім паладином братства-відлюдником, коли робили дещо огидне. Дві жінки та чоловік (всі цивільні) загинули внаслідок їхніх дій. Ми вирішили, що найкраще буде їх заблокувати і почекати, поки ти вирішиш, що з ними робити. Вони зараз у тюремному відділку Далласу, чекаючи екстрадиції до Лафайєта. Будь ласка, надішли повідомлення або приїдь сам, коли матимеш час. Особистий візит допоможе уникнути дипломатичного інциденту, тому було б бажано приїхати. Перепрошую за те, що псуємо тобі день. - Старійшина Руск"\n\nНачальник сів на один з табуретів у барі. Він стиснув листа в руці, потім розправив його і прочитав знову. Потім знову стиснув його і вдарив кулаком по бару. "Все в порядку, начальнику?" запитав бармен. "У тебе є машина?" "Так, є пікап з повним баком. Хто питає?" "Мені потрібні ключі. Я поверну їх тобі з повним баком. Треба зайнятися однією справою." Бармен виглядав скептично. Начальник нахилив чорний капелюх вперед і поклав праву руку на кобуру. "Це серйозно, Ленні." Ленні підняв руки і відійшов на кілька кроків, потім витягнув ключі з шухляди і передав їх. "Тільки не подряпай, гаразд?" "Якщо подряпаю, заплачу за ремонт." Начальник вийшов з бару без жодного слова, залишивши 5-й на його власний розсуд."
nf_tpm_events_continued.25.a: "Ці "законники" — ганьба формі."
nf_tpm_events_continued.25.b: "Я подбаю, щоб їх більше не побачили."

nf_tpm_act3.4.t: "Техаська рулетка"
nf_tpm_act3.4.d: "Салліван IV, новий пес Калахана, підійшов до ліжка начальника і ліг перед ним. Патрульний лідер Франклін спостерігав за собакою і посміхнувся. Потім посмішка зникла. "Отже, ти це зробив?" "Так. Потрібно було трохи брудної роботи від третіх осіб, але я зібрав все докупи. Тепер маю повну картину." "Сподіваюся, ти правий." "Так, я впевнений."\n\nКалахан відкинувся на стільці і перевів погляд з патрульного лідера Франкліна на двері свого офісу. "Заходь!" — крикнув він. Двері відчинилися, і депутат Андрюс — новий хлопець із техаської системи депутатів — тихо увійшов. "Ви викликали мене, сер?" "Так. Сідай." "Добре." Андрюс зачинив за собою двері і сів у крісло напроти столу начальника. Він кивнув Франкліну, який відповів йому тим самим.\n\n"Я не в біді, чи що?" Калахан нахилив чорний капелюх на дюйм уперед. "Боюся, що так, Андрюс. Я копав трохи. Знаєш, ми вже давно маємо проблеми з хабарями, з проблемами для людей, які не платять надмірні збори, та з цивільними, що потрапляють у численні напади бандитів. Я довго думав, що це Патруль робить сам по собі і кладе гроші до кишені. І так, іноді так було. Але після того, як ти і я побували біля Ефрафи кілька місяців тому, мене це змусило задуматися, і я найняв приватного детектива з Х’юстона, щоб той розслідував це.""
nf_tpm_act3.4.a: "§g...§!"

nf_tpm_events_continued.26.t: "Техаська рулетка, продовження"
nf_tpm_events_continued.26.d: ""Він копав десятки років назад, зібрав купу записів і описів. У часи мого батька був один чоловік, який завжди вимагав більше, ніж треба, але ніхто не помічав, що це завжди був той самий чоловік. Це був головний шериф Рейган." Очі Франкліна стали широко відкриті в куточку — начальник знав, що Рейган був одним з найближчих друзів Франкліна колись. Він проігнорував реакцію і зосередився на виразі обличчя Андрюса. "Коли Рейган помер кілька років тому, платежі стали нормальними на кілька місяців. Потім ми взяли тебе на роботу, і збори Рейгана повернулися, а разом з ними й проблеми, якщо вони не були виплачені. Тепер..."\n\nНачальник поклав два знімки на стіл і передав їх Андрюсу, який нахилився, щоб подивитися на них. "Ми маємо тебе, як того, хто передав захист патрульних капсів банкам у Лон Старі та мафії в Новому Орлеані. Патрульні ніколи не були корумпованою організацією, принаймні не настільки, як ми думали. Просто було кілька прогниліх членів." Калахан сидів прямо в кріслі. Андрюс знизав плечима і подивився на начальника. Було кілька секунд затримки, перш ніж його права рука швидко вискочила з кобури, і його револьвер був спрямований. Спалах світла і постріл. Рука Калахана опустилася, а тіло Андрюса похилилося в кріслі. Його рука тремтіла, і він насупився. "Мабуть, він спробує щось таке," сказав Калахан. Франклін підвівся, виглядаючи досить сумно. "Ти впевнений, що це був Рейган?" "Цілком впевнений, боюся." "Тоді передай мої вітання тому приватному детективу. Він побачив те, що я не зміг." Франклін зітхнув і покинув кімнату, обходячи кров, що збиралася під кріслом Андрюса."
nf_tpm_events_continued.26.a: "§tСподіваюся, це буде остання смерть цієї війни.§!"

nf_tpm_act3.5.t: "Нові норми"
nf_tpm_act3.5.d: "Начальник вкинув останній шматок землі в яму навколо саджанця. Потім він рівно втиснув землю, переконуючись, що все рівно. Він зробив кілька кроків назад, кинув лопату, якою користувався, взяв молоток в ліву руку, а в іншу — металевий стрижень і нахилився вперед. Він повернув стрижень так, щоб римська цифра III була спрямована від саджанця, потім втиснув його в м’яку землю і використав молоток, аби забити його до половини. Потім він піднявся, зробив кілька кроків назад і, опустивши голову, тихо промовив молитву.\n\nКоли він закінчив, він кинув на саджанець привітний погляд, підняв лопату й молоток і пішов назад до лавки, де залишив свій капелюх. Він сів і натягнув синій капелюх начальника. "Ну, ти й довго це робив," зауважив Франклін. "Коли твій старий ховав Саллівана II, то зробив це за менше ніж за дві хвилини." Він кивнув на молоде дерево, що росло за десяток футів від нової могили."
nf_tpm_act3.5.a: "«Так, ну, мій старий мав сина, про якого треба було піклуватися.»"

nf_tpm_events_continued.27.t: "Нові норми, продовження"
nf_tpm_events_continued.27.d: ""Справедливо." Обидва сиділи в тиші кілька хвилин. "Хоча не пам’ятаю, щоб твій старий схиляв голову над могилою. Це був хороший жест." "Ех, вирішив, що не зашкодить." Начальник витер піт з чола. "Ей, віддаємо належне, Салліван дочекався, поки все заспокоїться, щоб померти. Не буду брехати, я просто радий, що він дав мені стільки часу для роботи. Ситуація з Техасом була складною, і було б погано, якби я змушений був зупинятися, щоб поховати свою кішку в середині того всього." Франклін сміявся. "Так, можу собі уявити. Твій дідусь мав поховати першого Саллівана перед першим боєм під Александрії. Можеш уявити, що це з ними робило." \n\nНачальник подивився на Франкліна. "Я цього не знав, насправді. Хм." Він зупинився і посміхнувся, поки старий зустрічав його погляд. "Сподіваюся, мені не доведеться ховати тебе наступного разу, коли почнеться кампанія." Обидва добре посміялися. "Ладно, я трохи голодний. Пішли на Партікл Роу. Чув, що вони отримали нові рецепти бургерів з Техасу, хочу спробувати." Начальник кивнув і пішов з Франкліном від меморіального парку."
nf_tpm_events_continued.27.a: "Може, тепер ми зможемо відбудувати цей штат у мирі."
nf_tpm_events_continued.27.b: "Я впевнений, що Лоун Стар буде готовий інвестувати."

nf_tpm_act3.6.t: "Викинута кита"
nf_tpm_act3.6.d: ""Ладно, поїхали." Начальник заштовхнув останній крок по імпровізованій сходах, що були кинуті на борт величезного парового баржі. Коли він добрався на верх, він поглянув навколо палуби — нікого не було — і перебрався через поруччя корабля. Увесь човен трохи нахилявся на лівий борт, тому йому довелося бути обережним, щоб не впасти за борт у неглибоку воду, що була на 20 футів нижче. Він повернувся назад і подивився на зібрані плоти і каное, які 5-й патруль використав, щоб дістатися до корабля. "Все ясно, думаю!" Решта чоловіків з того судна почали лізти по сходах, а решта малих човнів підійшли і прив’язали свої передні шнурки до низу сходів або до вже прив’язаних човнів. Коли більшість патруля опинилася на палубі судна, Калахан віддав накази. "Гаразд, подивіться навколо. Я сумніваюся, але можуть бути люди, що ще залишилися на судні, і, за нашими чутками, вони могли бути піратами. Розділіться на групи по три й будьте обережні.""
nf_tpm_act3.6.a: "§gУсі розійшлися по своїх напрямках.§!"

nf_tpm_events_continued.28.t: "Викинута кита, продовження"
nf_tpm_events_continued.28.d: "Лідери патруля Гренхам і Франклін, які спеціально приєдналися, щоб краще оглянути викинуте судно, пішли з начальником до мостика корабля. Двері були закриті на засув, тож Калахан вистрілив у засув і вибив двері вручну. Його плече трохи боліло, але він прорвався.\n"Здається, вони серйозно пошкодили системи тут. Це потребуватиме чимало роботи, щоб відремонтувати." Гренхам вказав на безліч кульових отворів, які порізали основний пульт на мостику. Штурвал був вирваний зі свого місця."\n"Ей, начальнику. Ось тут." Франклін стояв на колінах з чимось біля перевернутих столів. Калахан підійшов і побачив напіврозкладеного пірата, якого Франклін оглядав.\n"Йой. Він має що-небудь на них?"\nФранклін перевірив кишені мертвого чоловіка і знайшов гаманець, який був порожній. "Нічого особливого. Мабуть, забрали його речі і втекли. Може, це він викинув судно. Це йому підходить за піратським правом."\nНачальник здригнувся. "Хм." Він повернувся і подивився через вікна корабля. "Ну, у нас є стільки часу, скільки потрібно, і з тим, що вони зробили з керуванням, сумніваюся, що пірати повернуться за цим. Думаю, у нас є новий шматок металу для роботи." Він побачив, як чайки кружляли над головою."
nf_tpm_events_continued.28.a: "Давайте переробимо це і відправимо назад у море!"
nf_tpm_events_continued.28.b: "Ех, це так само, як для брухту."

nf_tpm_act3.7.t: "Закони яких правопорушників?"
nf_tpm_act3.7.d: "Маленький дзвіночок над дверима дзеленчав, коли начальник відкрив їх і зайшов. Динамітний Денні підняв голову від свого столу й усміхнувся. "Привіт, начальнику!" "Привіт, Денні!" Начальник йшов до столу, коли його погляд упав на пістолет у скляному футлярі. Він зупинився на півкроку і обернувся, щоб подивитися на цей предмет. "Що це за штука така?" Він зробив кілька кроків вперед і оглянув дивний пристрій. Це був пістолет, заснований на люгері, з золотими вставками, одноразовий, з навантаженням через ствол, з красивими гравіруваннями. Він подивився вгору. "Ей, Денні, скільки це коштує?"\n\nДенні підняв голову через прилавок. "О, та штука? Виглядає гарно, але насправді це просто церемоніальний предмет. Кажуть, що її забрали у якогось диктатора на маленькому фортеці на південному Карибському острові. Назва острова починалася на P, але більше я не пам’ятаю. За це просять 2500 капсів." Начальник зібгав лице. "Чорт, ти хочеш за це стільки, скільки ми витрачаємо на місячну поставку боєприпасів для всього патруля?""
nf_tpm_act3.7.a: "«Я ж згадував, що це забрали з тіла диктатора?»"

nf_tpm_events_continued.29.t: "Закони яких правопорушників?, продовження"
nf_tpm_events_continued.29.d: ""Зрозуміло." Начальник кинув останній погляд на пістолет і підійшов до прилавка. "Прийшов забрати мій пістолет. Очистили його?" "Просто блискучий, начальнику." Денні відкрив шухляду і, відсунувши кілька інших револьверів, взяв пістолет з підписом Калахана на рукоятці. "Має працювати так само добре, як у твій перший день патруля. З якоїсь причини там накопичилось багато бруду в механізмі, думаю, це була твоя проблема. Ти вже заплатив, тому можеш забирати." Він передав руків’я пістолета начальнику, який оглянув його, повернув і поклав назад у кобуру. "Чудова робота, дякую, сто разів дякую." Він почав обертатися, але раптом зупинився.\n\n"Ей, Денні, у мене є проблема, хочу послухати твою думку." Денні подивився на начальника. "В чому проблема?" "Ну, з того часу, як ми підписали угоду з Техасом, багато хто говорить про те, щоб зробити для Лафайєта офіційну систему законів. Ми могли б залишити все як є, це непогано працювало для нас раніше, але, може, настав час прийняти якісь офіційні закони. Або можемо просто використовувати стару систему ТЕУ. Вона їм досить непогано працювала." Денні просто засміявся. "Начальнику, є причина, чому в цьому місті ніхто не займається політикою. Все й так нормально. Якби я був на твоєму місці, я б не турбувався." Начальник довго дивився на Денні, потім подякував йому за пораду і пішов."
nf_tpm_events_continued.29.a: "Якщо це було достатньо добре для батька..."
nf_tpm_events_continued.29.b: "Тим часом часи вимагають жорсткіших заходів."
nf_tpm_events_continued.29.c: "Просто використаємо закони союзу. Залишимо все просто."

nf_tpm_act3.8.t: "Найкраще після Біблії"
nf_tpm_act3.8.d: "У Калахана боліла спина. Патрулі в Блаффі зазвичай не мали подій, а стереотип про місто Мосс Блафф, як про зону хаосу з великою кількістю злочинів, в основному був вигадкою, що базувалась на перебільшених історіях, але не було жодної брехні в тому, що густі ліси навколо Блаффа ускладнювали проходження патрулів по цій місцевості. Він пробився крізь черговий пухнастий кущ і побачив відкриту галявину з кількома наметами з іншого боку. Він поглянув назад і жестом дав знак лідеру патруля Гренхему, щоб він замовкнув, і той передав сигнал через базову жестову мову решті п’ятого патруля.\n\nКалахан вийняв револьвер і вийшов на галявину. Гренхам та решта п’ятого повільно йшли за ним, підтримуючи кущ, через який пройшов начальник, аби не видавати зайвих шумів. Калахан обережно пройшов повз один з наметів. Він почув хропіння зсередини. "Начальнику?" Хтось крикнув з іншого боку галявини. Калахан підняв голову і побачив, як лідер патруля Гері йде до нього, тримаючи револьвер у руках. Гері усміхнувся, коли впізнав начальника."
nf_tpm_act3.8.a: "«Ну, не очікував побачити тебе тут!»"

nf_tpm_events_continued.30.t: "Найкраще після Біблії, продовження"
nf_tpm_events_continued.30.d: "Калахан сердито поклав палець на губи, але Гері, мабуть, найбільш обережний чоловік у патрулі, лише усміхнувся. "Начальнику, можеш опустити пістолет." Гері подивився навколо намету і побачив, як решта п’ятого патруля повільно формуються на галявині. Він свистнув від здивування. "Вони також можуть опустити свої." Він обернувся і крикнув у ліс. "Виходьте, хлопці!" На подив Калахана, весь третій патруль вийшов з кущів, сміючись. "Що за..." "Начальнику, не знаю, як ви нас випадково знайшли, але ми тут тестуємо нову пастку для бандитів. Підходьте." Він показав на намет, з якого лунали хропіння. Гері відкрив клапан намету, виявивши портативний динамік, що видавав ці звуки. "Френсіс зібрав це для нас кілька тижнів тому. За останні пару днів вже дві групи бандитів намагалися викрасти речі з наших підставок для приманок. Я мав представити це на зустрічі в цей уїк-енд, але, здається, ви нас випередили." \n\nГері широко усміхнувся, що було не характерно для нього. Калахан зняв капелюх і потер чоло. "Ну, точно не очікував побачити вас тут сьогодні." Він зупинився, потім повернув капелюх на місце і усміхнувся. "Та нічого, ми ж тут з п’ятим і третім патрулем на одному патрулюванні. Ми кілька оленів на шляху спіймали, що скажете, якщо ми зробимо барбекю і розповімо історії?" Гері важко зітхнув. "Ну, не можу сказати, що я люблю, коли наша пастка не використовується, але я голодний. Хлопці будуть задоволені." Він зупинився. "До речі, говорячи про історії, один з моїх хлопців мав гарну ідею. У нас є чимало історій по патрулю. Якщо записати їх на папері, можна зробити непогану книжку. Може, допоможе в наборі новобранців." Калахан кивнув і замислився над ідеєю, але потім його думки повернулися до їжі."
nf_tpm_events_continued.30.a: "Звучить як гарний план. Давайте зробимо це."
nf_tpm_events_continued.30.b: "Але давайте спершу перевіримо деякі з них."

nf_tpm_act3.9.t: "Світ змінюється"
nf_tpm_act3.9.d: "Начальник пив у барі на Партікл Роу, коли до нього дійшли новини. Шерифи Джордж та Роквелл вбігли в бар, змусивши всі розмови замовкнути. Всі знали, що бар на Партікл Роу — одне з небагатьох місць у Лафайєті з працюючим телевізором, а канал «Тубгедс» був одним з небагатьох, що транслював на ньому щось. "Ей, Джонні! Перемкни канал, «Містер Розваги» на екрані!" Бармен виглядав роздратованим і не припиняв чистити свої кухлі. "«Містер Розваги» завжди на екрані, в тій чи іншій формі. Що ти хочеш, власне?"\n\nДва шерифи дивилися прямо на Джонні, і Калахан подумав, що це виглядає досить смішно з його місця за одним з столів збоку. Роквелл заговорив першим. "Джонні, я знаю тебе з того часу, як ти народився. Я ніколи не просив про послугу. Зроби мені послугу і перемкни канал." Джонні підняв брови, знизав плечима. Він поклав кухоль і потягнувся до пульта від телевізора. Він перемкнув канал і збільшив гучність."
nf_tpm_act3.9.a: "§gБар замовк, і всі очі приклеїлися до телевізора.§!"

nf_tpm_events_continued.31.t: "Світ змінюється, продовження"
nf_tpm_events_continued.31.d: "Яскраво освітлений техаський прапор майорів у верхньому правому кутку екрану. Заголовок §o"Техаський економічний союз об’єднує держави-члени в Тимчасову Республіку Техас!"§! неодноразово з’являвся внизу екрану. Містер Розваги пояснював деякі нові політики Тимчасової Республіки, починаючи з того, що армії та кордони нової нації об’єднаються в одну юридичну сутність. Конституційний конгрес відбудеться незабаром після утворення Тимчасової Республіки, і новою метою Техаського економічного союзу стане сприяння міжнародній торгівлі між Техасом та іншими державами-членами, і Лафайєт Патрульменс стане їхнім першим великим клієнтом.\n\nКоли Містер Розваги нарешті вимкнув телевізор після години або більше політичних брифінгів, Калахан відкинувся на спинку стільця і зітхнув. Він пив разом з керівниками патруля Гренхемом, Маком та Френсісом, але Френсіс пішов посеред брифінгу, а Мак вже давно заснув на столі. Гренхем, який залишався майже тверезим і свідомим, заговорив. "Тож... думаю, це має сенс." Калахан знизав плечима. "Так. Коли я був у Далласі кілька років тому, я бачив стільки ж техаських прапорів, скільки й прапорів Братства. Трохи дивно, але думаю, вони вже давно працюють над цим." Він паузував і спробував зробити ковток пива. Бутель була порожньою вже півгодини, як він щоразу перевіряв її в надії знайти хоча б одну останню краплю. "Все ж...""
nf_tpm_events_continued.31.a: "«Радий бачити, як вони досягли своїх мрій!»"
nf_tpm_events_continued.31.b: "«Цікаво, чи зможемо ми зробити те саме для Луїзіани?»"

nf_tpm_act3.10.t: "Я маю на увазі..."
nf_tpm_act3.10.d: "Дві години після закриття виборчих скриньок Калахан вийшов на сцену. Міська Ратуша Лафайєта була переповнена людьми, майже всі вони носили синє та золоте. Але були й кілька цивільних, які проходили туди-сюди, що було приємним виглядом. Калахан підійшов до мікрофона. "Ну, е-е, привіт, хлопці!" Зал вибухнув оплесками. "Ну, я знаю, що кілька людей справді намагалися балотуватися на нову посаду Мера Лафайєта — честне згадування для заступника Пулпа, там, з п’ятьма голосами..." Начальник показав на бік сцени, де заступник Пулп сидів понурий, після того як загальний виборчий результат показав, що виборці були мало зацікавлені в його планах славної перемоги. "Але буду чесний, це не було справжнім змаганням. Переможець на другому місці — керівник патруля Франклін, ось тут, зібравши сто шістнадцять голосів, і він навіть не балотувався." Начальник показав на старого Франкліна внизу сцени, і Франклін низько вклонився, драматично.\n\nЗал розсміявся, і це надихнуло начальника посміхнутися. "Так от, з трьох з половиною тисяч голосів, які надійшли, дві з половиною тисячі з них були від хлопців з патруля, якщо це щось говорить про політичну участь у нашому чудовому місті." Більше сміху. "Все ж. З близько 95% голосів, ви вирішили, що хочете, щоб я став вашим мером." Зал вибухнув здоровими оплесками та криками підтримки. Начальник відчув нервозність, і серце його почало швидше битися. Його зір став розпливчастим. Але він згадав той ранок, коли він пішов до зоомагазину Кларенса і купив кошеня. Салліван IV чекав у кабінеті начальника патруля, і чомусь ця думка заспокоїла його."
nf_tpm_act3.10.a: "§gВін знову зосередився на тепер мовчазному натовпі.§!"

nf_tpm_events_continued.32.t: "...Звичайно, ми це зробили!"
nf_tpm_events_continued.32.d: "«Так, якщо я буду мером, це означає, що я матиму цілу купу справ на цивільному боці, яких раніше не доводилось робити. Поки що я призначаю керівника патруля Франкліна виконуючим обов’язки начальника патруля, поки я розберусь, як хочемо структурувати все це.» Зал видав шум незадоволення, а очі Франкліна широко розплющились на нижній частині сцени. «Але якщо ми будемо робити це правильно, мер має мати рівний голос з начальником патруля, тому це буде лише на рік чи близько того, поки я не зрозумію, де має бути межа.»\n\nВін на мить зупинився і поглянув на один з верхніх прожекторів, перед тим як знову звернутися до натовпу. «І я не дозволю Франкліну зайняти мою посаду.» Це викликало кілька сміхів і трохи розвеселило атмосферу. «Дякую всім, що прийшли голосувати, і побачимося через кілька років, коли будемо робити це знову. Гарної ночі, хлопці.» Мер Адам Калахан зійшов зі сцени і витер піт з чола. Він залишився, щоб потиснути кілька рук, але пішов додому, як тільки міг. Адже йому треба було годувати нову членку родини."
nf_tpm_events_continued.32.a: "«За правопорушників Лафайєта!»"
nf_tpm_events_continued.32.b: "«За хороших громадян Луїзіани!»"

nf_tpm_misc_events.1.t: "Через Криваве Болото"
nf_tpm_misc_events.1.d: "Начальник патруля переступив через тимчасову барикаду, озирнувся навколо. Тіла лежали на болотистій алеї, а на стінах навколишніх будівель були кров’яні плями. "Франклін?"\n\n"Тут, начальнику." Старий чоловік провів начальника за маленьку купу сміття та гнилої їжі. Він жестом показав іншим правоохоронцям залишити місце, і вони швидко пішли. "Знайшов її такою. Скільки я знаю, ніхто з хлопців не зізнався, що це вони зробили. Здається, більшість із них не зовсім пишаються тим, що ми тут зробили." \n\nНачальник подивився вниз, зняв свої сонцезахисні окуляри, склав їх і поклав у кишеню. "Я ж дав їм накази." Він став на одне коліно і опустився на грязьку землю. "Так, начальнику. Але ви ж знаєте, як це в бою." Настала пауза. "Мені шкода, Адам. Мені треба було бути там.""
nf_tpm_misc_events.1.a: "§gКалахан провів пальцем по брудному волоссю дівчини.§!"

nf_tpm_events_continued.33.t: "Через Криваве Болото, продовження"
nf_tpm_events_continued.33.d: ""Ні, все в порядку. Вона б нас усіх вбила, якби мала шанс." Очі Собека були все ще відкриті, обличчя залишалося в виразі спокійної люті. Адам м’яко закрив очі дівчини, намагаючись не торкнутися отвору на її лобі. "Мабуть, це на краще. Якби ми її зловили, більшість хлопців, ймовірно, повісили б її. Я б не зміг їх зупинити." Начальник піднявся. "І навіть якби я зміг переконати всіх забрати її додому, єдина родина, яка б у неї була, це її тітка, а вона вже на смертному ліжку." "Це не твоя провина, що вона втекла," — заговорив Франклін. "З того, що я зміг зібрати тоді, в дитбудинку її завжди погано поводилися, а вона була найменшою серед найменших. Напевно, мала комплекс." \n\nЩе одна пауза. "Хех, для того, щоб хоч щось хороше сказати, наша дівчина з чудового міста Лафайєт була такою вправною в тому, що робила, що навіть бандити вклонялися їй. Це має хоча б якусь вартість, правда?" Калахан запропонував сумну посмішку, повертаючи свої окуляри на місце. "Можливо. Можливо. Але давайте забезпечимо їй належний похорон вдома, там, де вона належала. Немає причини, щоб все життя зла змусило нас повернутися проти одного з наших. Пропаща дочка і все таке." "Амінь," — закінчив Франклін. Двоє вийшли з алеї, і були віддані накази. Через тиждень у дитячому будинку Лафайєта відбудеться похорон загубленої дитини. Це буде гарний момент для гарної дівчини, яка мала б бути кимось іншим, а не королевою бандитів, якою стала."
nf_tpm_events_continued.33.a: "«Дивіться, ми всі знаємо, що вони це заслужили...»"
nf_tpm_events_continued.33.b: "«Але хіба ви не можете пробачити і забути?»"

nf_tpm_misc_events.2.t: "Просто велика помилка, насправді"
nf_tpm_misc_events.2.d: "Калахан виплюнув свій напій через весь стіл. "Ну, це трохи грубо, чи не так?" Молодий чоловік, що сидів поруч з мером, виглядав обуреним. Він кинув на мера погляд. "Слухайте, містере Шип-Брейкер, я не думаю, що ці ідіоти варті вашого часу." Брови Калахана піднялися. "Ну, враховуючи, де ти сидиш, думаю, це не зовсім тобі вирішувати, містере Чако. Але вибачаюсь за манери за столом." Він витер рот і відкинувся в крісло. "Мер Шип-Брейкер, ви знаєте, чому ми атакували вас?" Бородатий мер згрібнув і буркнув. "Найкраще, що ми можемо зрозуміти, це те, що ви просто захотіли нашу рибу. Ми навіть не знаємо, що сталося, і ми нічого поганого не зробили." "Ну, ми отримали повідомлення, що ви тримали рабів, і що деякі з цих рабів були нашими людьми, яких банда Гейтор викрала деякий час тому." \n\nЗатвердлий мер та його худий помічник повернулися один до одного поглядами. Потім вони почали сміятися. Зрештою вони нагадали собі, що люди загинули в конфлікті Лафайєт-Каннері, і що сміятися над цим зараз не дуже доречно. "Слухайте, містере Калахан," — заговорив мер, "якщо ви кажете правду, то хтось вам дав погану інформацію. Нам би не було потреби в рабах навіть, якби ми могли їх отримати без ризику бунту серед наших людей. Нам і так важко знайти роботу для всіх, коли єдиною реальною індустрією, якою ми володіємо, є рибальство. Ви ж знаєте, як вони відреагували б, якби ми почали залучати дешеву робочу силу? Це були б бунти на вулицях, і я б залишився без роботи швидше, ніж ви встигли б обкласти новий бізнес податками. Я тримаю свою посаду, тому що всі інші потребують роботи, і моя найбільша робота — це надавати роботу.""
nf_tpm_misc_events.2.a: "§gРот Калахана залишився відкритим.§! «Ви серйозно, мер?»"

nf_tpm_events_continued.34.t: "Просто велика помилка"
nf_tpm_events_continued.34.d: ""Не те, щоб у мене коли-небудь була дружина, зрозумійте мене." Він засміявся. "Що стосується людей у ланцюгах, то у нас є точно двоє, які підходять під це описання. Минулого місяця ще одна піратська атака намагалася вкрасти цілий корабель з їжею прямо під носом, і ми схопили злодіїв на останній момент. Більшість з них втекли, але ми взяли двох полонених. Ми виводимо їх на сонце кожен день, даємо їм трохи часу на свіже повітря. Якщо чесно, ми просто ще не зрозуміли, що з ними робити." Калахан потягнувся до свого вуса. "Ну, це пояснює одну річ. Але ще одна. Ми кілька разів відправляли хлопців до вас, щоб запитати про наших зниклих людей. І щоразу, як тільки вони наближалися до вашого острова, їх відправляли геть. Що це за історія, якщо ви навіть не тримали їх?"\n\nШип-Брейкер майже усміхнувся. "Що, ми пережили велику піратську атаку, а ви думали, що ми будемо пускати чужинців на острів? Всі у вашому патрулі носять однакову форму, і половина з них навіть схожа з близька. Можете нас звинувачувати, що ми мовчали перед можливими шпигунами?"\nКалахан встав і похитав головою. "Ну, це найбільше непорозуміння, яке я бачив за довгий час. Ми, звісно, розберемо вашу історію, але якщо це правда, то я дуже вибачаюсь за весь цей безлад. Ви зрозумієте, якщо я не просто поверну Каннері назад, щоб зберегти обличчя перед хлопцями, але я впевнений, що ми щось домовимося." Шип-Брейкер звузив очі і подарував хитру посмішку з-під своєї крижаною бороди, і Калахан потиснув йому руку перед тим, як вийти."
nf_tpm_events_continued.34.a: "«Ну, це справжня біда.»"
nf_tpm_events_continued.34.b: "«Гей, давайте хоча б допоможемо відновити це місце, добре?»"

nf_tpm_misc_events.3.t: "Попіл Джима"
nf_tpm_misc_events.3.d: "Начальник сидів за своїм столом, заповнюючи документи щодо річних закупівель у магазині зброї Динаміта Денні, коли почув шум за дверима його кабінету. Лунали гнівні вигуки, кілька ударів, а потім швидкий стукіт у двері. Шум не припинявся, поки він не вигукнув: "Заходьте!" Він повністю відволікся і втратив усю нитку роздумів з паперами, тому відсунув їх в сторону і пообіцяв собі вирішити цю проблему пізніше.\n\nДвері відчинилися, і двоє чоловіків ввалилися всередину, тягнучи третього за обидві руки. Калахан одразу впізнав третього чоловіка — заступника Джима Лопеса, старшого брата близнюків Лопесів, які швидко здобували популярність серед патрульних. 27-річний заступник, очевидно, був одягнений у наручники і трохи побитий, його викинули на стілець навпроти столу начальника, і двоє інших чоловіків, які були шерифами з 6-го патрульного підрозділу, до якого належав Джим, тримали його. "Я ж вам кажу, я нічого не зробив! Відпустіть мене!""
nf_tpm_misc_events.3.a: "§gДжим продовжував боротися з шерифами, хоч це нічого не давало.§!"

nf_tpm_events_continued.35.t: "Попіл Джима, продовження"
nf_tpm_events_continued.35.d: "Шериф зліва дав Джиму додатковий стиск плеча. "Отже, кілька днів тому ми патрулювали навколо бару Ефрафа, так? Джим тут вирішив трохи пограти в азартні ігри з кількома людьми, в тому числі й зі мною. Там був також Паладин Братства. Не той з Далласа. Той з Аламо. Реальна броня і все таке. Цей паладин ставить велику ставку, отримує карти, а на його руках — пара тузів і трійок після того, як Джим постійно підвищував ставку на своїх парах королів." Він знову стиснув Джима. "Джим відразу витягує свій пістолет, націлюється на голову паладина, питає, чи він шахраює, паладин злякався і сказав ні, а Джим прямо там і тоді застрелив його. Ми йшли пішки останні півтори дня, щоб привести його сюди." Рот Калахана висох. "Це правда?" Він звернувся до іншого шерифа, який з серйозним виразом кивнув. "Кажу вам," — знову закричав Джим, "цей бляшанка шахраював! Неможливо було мати два туза, я бачив руку Леона! Він отримав те, що заслужив!"\n\nНачальник уважно подивився на Джима. "Джим, ти застрелив члена Братства Сталі через гру в покер?" Він чекав кілька секунд. "І не минуло й року, як ти отримав червоне попередження за вбивство бандита, який вже підняв руки?" Джим виглядав обуреним. "В останнє, я вам кажу, він шахраював! Ми повинні дотримуватись закону, хіба не має бути справедливості, якщо хтось шахрує?" Обережно, Калахан відкрив шухляду свого столу. Він витягнув чорний пістолет з глушником, підняв його вгору і націлився на заступника, який раптово застиг і дивився прямо в ствол пістолета."
nf_tpm_events_continued.35.a: "«Залиш свій значок при дверях і йди.»"
nf_tpm_events_continued.35.b: "«Забагато, Джиме. Ти ж знаєш, що я повинен зробити.»"

nf_tpm_misc_events.4.t: "Життя в буферній зоні"
nf_tpm_misc_events.4.d: "Калахан стояв біля бару на Партікл Роу і дивився на його вікна. Іноземні прапори звисали з обох боків головного входу, і тепер цей бар відвідували дивні люди. Він похитав головою і зітхнув, коли йшов геть. Прапори висіли практично на кожному магазині по всій Партікл Роу і Маркіс Лейн.\n\nНачальник повернув і прогулявся по відкритих зелених просторах меморіального парку Лафайєт. Він побачив патрульного Френкліна на лавці, і підійшов до нього. «Привіт, начальнику.» «Здорово, Френклін. Можна сісти?» «Не бачу, чому б і ні.» «Дякую.» Начальник сів і пробурчав. «Звикнути до того, що навколо повно прапорів, які не є прапором 10-го патруля, буде важко.» «Так.» «Хочеш знати секрет?»"
nf_tpm_misc_events.4.a: "§gФренклин кинув на начальника побіжний погляд і посміхнувся.§!"

nf_tpm_events_continued.36.t: "Життя в буферній зоні, продовження"
nf_tpm_events_continued.36.d: ""Що стосується прапора 10-го патруля, то було кілька моментів, коли тато міг би оголосити 11-й патруль за свого часу, через всі кризи, з якими він стикався. Але він дуже любив карти, і вважав, що саме 10-й патруль — це правильний варіант.» «Зізнаюсь, я це ще не чув,» — замурмотів Френклин задумливо.\n\n«Ну, якщо подивишся на старі карти навколо Лафайєт, то побачиш, що ми розташовані поруч з шосе. Старим I-10, якщо хочеш вірити. У до-воєнні часи державний патруль, з якого ми запозичили нашу форму, часто використовував це шосе. Тато завжди вважав, що це буде гарна символіка. Тримати 10-й, бо ми пройшли вже дев’ять великих проблем, але й тому, що Лафайєт поряд з цим старим I-10.»\n\nФренклин тихо засміявся. «Ось це цікаво. І я зізнаюсь, я довго дивувався, чому поразка в Александрії так і не переконала старого начальника піднятися до 11-го.» Двоє сиділи в тиші ще хвилину. «Знаю, що ти все ще маєш прапор у своєму кабінеті, але мені буде не вистачати його в місті. Особливо тепер, коли я знаю цю маленьку історію.» Начальник посміхнувся сумно і продовжив дивитися на парк."
nf_tpm_events_continued.36.a: "«Могло бути й гірше.»"
nf_tpm_events_continued.36.b: "«Ми ще повернемо наше колись.»"

nf_tpm_misc_events.5.t: "Візит мера"
nf_tpm_misc_events.5.d: "Калахан помітив, що мер Кітс був оточений натовпом патрульних з іншого боку бару, але він так і не підійшов. Деякі з інших членів патруля, здається, дуже добре проводили час, розмовляючи з мутантом у фіолетовому костюмі, але начальник не відчував потреби підійти. «Здається, Френсіс насолоджується компанією.» «Так. Чув, що в Остіні є справжня цікава технологія. Така, що може скласти конкуренцію Братству Сталі. Логічно, що він зацікавлений.»\n\nПатрульний керівник Ґренхем ковтнув свій ковток кави. «Не знаю, чому мер захотів приїхати сюди так рано.» «Правда, міг би почекати, поки сонце не вийде з-за хмар, перш ніж вирушати на прес-тур.» Ґренхем сміявся. «Але, здається, це добре з його боку — приїхати. Між нами та Техасом досі є певна напруга, і те, що один з їхніх колишніх лідерів приїхав на екскурсію, — це добра ідея.»"
nf_tpm_misc_events.5.a: "§gВін зробив паузу, а Калахан попив свою каву.§!"

nf_tpm_events_continued.37.t: "Візит мера, продовження"
nf_tpm_events_continued.37.d: ""Начальнику, як думаєш, ми коли-небудь матимемо мутантів у патрулі?» Калахан ледь не виплюнув свій напій. Він опанував себе, проковтнув і посміхнувся. «Якщо чесно, я не дуже про це думав. Єдині мутанти в Лафайєт — це Грінер і Кеті, і вони ніколи не виявляли бажання вступити в патруль.»\n\nҐренхем кілька разів похитав головою. «З одного боку, залучення мутантів зробить наших людей набагато сильнішими. Вони дуже корисні у критичних ситуаціях, гарні як відволікання і здатні витримати удар, не впавши відразу.» Він зробив паузу і зробив ковток. «З іншого боку, вони можуть змусити решту наших хлопців почуватися трохи неповноцінно, якщо ти розумієш, що я маю на увазі.»\n\n«Не розумій мене неправильно, вони були б корисні, але організація патрульних — це місцева справа, що має велике значення для Лафайєт. Не знаю, чи будуть люди раді, якщо ми почнемо брати мутантів, тепер, коли вони почнуть йти до нас з Техасу.» «Хороша точка,» — погодився Калахан. Він знову попив кави і дивився, як Кітс жонглює барними стільцями вдалині, радуя натовп і викликаючи тривогу в бармена."
nf_tpm_events_continued.37.a: "«Ми добре справляємось і без них.»"
nf_tpm_events_continued.37.b: "«Нам не завадить трохи додаткової сили.»"

nf_tpm_misc_events.6.t: "Красиві нові дороги"
nf_tpm_misc_events.6.d: "Калахан переміщав ноги туди-сюди, коли вони спочивали на столі. Йому подобалося, коли твердість його стільця підтримує його, поки він читає літературу старого світу, але завжди було важко знайти правильну позу, щоб тіло не відчувало дискомфорту після кількох хвилин сидіння. Він зітхнув. Потім стукіт у двері його кабінету витягнув його з думок. Він не пам’ятав, щоб призначав зустріч. Може, він щось забув? «Заходьте,» — сказав він.\n\nМутант у чорному костюмі увійшов, тримаючи досить малий кейс у правій руці. «Ого, ось це несподівано.» Він посміхнувся і поклав свою книгу вниз, стежачи, щоб не втратити сторінку, на якій був. «Начальник патруля Калахан?» — запитав мутант. Його голос був грубий і жорстокий, але він говорив ідеальною англійською. Ніяких помилок; це був безсумнівно один з мутантів з Остіну. «Ви на них дивитесь,» — підтвердив Калахан швидким кивком голови."
nf_tpm_misc_events.6.a: "«Чим можу допомогти?»"

nf_tpm_events_continued.38.t: "Красиві нові дороги, продовження"
nf_tpm_events_continued.38.d: ""Ім’я Лепард", - сказав мутант. "Є послання від мера. Можу сісти?" "Будь ласка." Мутант витягнув вільний стілець і обережно сів, явно готовий встати, якщо стілець почне хитається. "Не буду витрачати ваш час, шефе. Мер розглядає ідею побудувати залізницю з Остіну до Консервного Заводу. Каже, що це для сприяння торгівлі, але всі знають, що він просто обожнює морепродукти." Шеф сміється і відкидається назад. "Якщо ти готовий направити частину своїх хлопців на старі рейки, ми зробимо більшу частину важкої роботи і швидко запустимо цей проект." Шеф посміхається. "Звучить як хороша пропозиція без жодних недоліків. Де підступ?"\n\nМутант посміхнувся. "Підступ у тому, що Кітс не вистачає коштів, і він хоче побудувати набагато більшу і більш постійну залізницю, ніж він може собі дозволити. Але якщо у вас є зайві капсули, він зможе профінансувати достатньо мутантської праці на місяць, щоб проект став дійсно вартий використання." "Ага, ти збираєш гроші, так?" Шеф трохи посміявся, а мутант знизав плечима. "До певної міри. Це на твій розсуд." Шеф кивнув, встав і простягнув руку."
nf_tpm_events_continued.38.a: "Тільки найнеобхідніше."
nf_tpm_events_continued.38.b: "Ех, чому б і ні?"

nf_tpm_misc_events.7.t: "Швидкий перекус"
nf_tpm_misc_events.7.d: "Шеф і мер сіли за стіл по обидва боки. Вони не відривали своїх підозрілих поглядів один від одного, поки замовляли однакову страву. Вони їли мовчки, вивчаючи мову тіла один одного. Мутант перший заговорив. "Добрий бургер." "Гм."\n\nВони закінчили їжу мовчки, потім заплатили за однакові страви один для одного. "Мер, я не розумію тебе." "Що ти маєш на увазі?" "По-перше, навіщо цей фіолетовий костюм?" Мутант знизав плечима. "Мені подобається фіолетовий. Це гарний колір." Калахан пив свою порожню молочну шейк.\n\n"Чому ти вирішив дозволити Патрульним приєднатися до своїх планів?" "У нас немає інших дружніх сил у Луїзіані. Це здавалось найпростішим варіантом." Він звузив очі. "Чому у вас все ще така велика армія, якщо ви хочете бути мирними?" "Ти б не мав армії, якби був на моєму місці? Дозволь запитати тебе про щось." Калахан кивнув.\n\n"Чому ти погодився поїхати до Остіну на обід?" Калахан знизав плечима. "Думав, це буде хороший шанс зрозуміти." "Тепер ти краще мене розумієш?" Шеф засміявся. "Ні в якому разі." Кітс посміхнувся. "Радий це почути." Вони встали, потиснули один одному руку і попрощалися після того, як обмінялися останніми компліментами про бургери в "Тролячому кулаці"."
nf_tpm_misc_events.7.a: "Смачно."
nf_tpm_misc_events.7.b: "Ммм."

nf_tpm_misc_events.8.t: "Чорний і синій"
nf_tpm_misc_events.8.d: ""Коли ти поїхав до Орлеану?" Калахан пив свій напій.\n"Десь у липні, здається. Чортів спекотний час був." Лідер патруля Макк кинув ще один шот і закашлявся.\n"Ти перевантажуєш себе, Макк," сказав лідер патруля Ларрі.\n"Та ні, я..." Макк захихикав. "Я в порядку, дивись?" Він підняв порожній стакан і посміхнувся.\nКалахан похитав головою. "Якщо ти завтра не в строю, це буде один із твоїх тижневих заробітків", сказав він чоловікові.\n"Я ж казав, я в порядку, шефе." Він поставив стакан назад. "Як я й казав, поїхав до Нового Орлеану для... еее..." Він захихикав. "Треба почистити свою зброю", прошепотів він. Інші патрульні навколо столу подивилися один на одного з тупими посмішками. "Та я туди поїхав, щоб забрати новий вантажівка для мого тата. Потрібно новий вантажівка. От..." Він похитав головою.\n"Пий води, чувак," сказав ще один лідер з іншого столу.\n"Заткнись, Гарі!" Макк почав виглядати роздратованим. "Ті мафіозні хлопці дивні, кажу вам. Треба всюди носити великі пістолети, виглядати погано і все таке. Вони хороші люди, поки є гроші, але якщо в тебе закінчились гроші, то..." Він знову захихикав і кілька секунд сміявся. "Якщо в тебе закінчились гроші, то закінчилась удача. Дивись... дивись, що я зробив?" Він подивився навколо столу, сміючись, і решта чоловіків навколо столу не могли не сміятися, спостерігаючи за витівками Макка. Навіть Старий Франклін і шеф не втримались від сміху, і вони добре посміялись також. "Ну, у них ще й чорні капелюхи всюди. Виглядають як гробарі або ще щось. Не можеш повернути за ріг, не побачивши їх, і вони завжди бачать тебе.""

nf_tpm_misc_events.8.a: "Майже натрапив на одного, я..."
nf_tpm_events_continued.39.t: "Чорний і синій, продовження"
nf_tpm_events_continued.39.d: "Після кількох хвилин реготання, Калахан нарешті встав. "Все, чоловіче, мені це дуже треба було. Гей, Ларрі та Боб, я за вас. Давайте відвеземо цього хлопця додому." Два патрульних лідери, найближчі до Макка, встали, все ще сміючись. Троє з них забрали Макка з бару, поклали його на платформу пікапа і нарешті відвезли додому. Родина Макка була вдома, і вони мали трохи занепокоєний сміх, коли дізналися, що сталося. Шеф піднявся наверх і допоміг двом лідерам покласти Макка в ліжко. Як за традицією, вони потім трохи розважалися, малюючи йому на обличчі фарбами навколо закритих очей, щоб відзначити подію. Потім вони подякували родині Макка і повернулися до бару, щоб продовжити обговорення багатьох особливостей новоорлеанської мафії, поки вони закінчували свої напої."
nf_tpm_events_continued.39.a: "Дехто з них навіть носить фальшиві трояндові лацкани..."

nf_tpm_misc_events.10.t: "Техаське Руалетто"
nf_tpm_misc_events.10.d: "Салліван IV, новий улюблений бійцівський пес Калахана, підійшов до ліжка шефа і ліг перед ним. Лідер патруля Франклін спостерігав за собакою і посміхався. Потім його усмішка зникла. "Ти це зробив?"\n"Ай. Це зайняло деяку брудну роботу з боку третіх осіб, але я зібрав усе воєдино. Тепер у мене є повна картина."\n"Сподіваюсь, ти правий у цьому."\n"Я правий." Калахан відкинувся на спинку свого стільця і перевів погляд від лідера патруля Франкліна до дверей свого офісу. "Входьте!" - крикнув він.\nДвері відкрилися, і новий кандидат на посаду заступника, Андрюс, хлопець із техаської системи департаменту, тихо зайшов. "Ви викликали мене, сер?"\n"Так. Сідайте."\n"Добре." Андрюс зачинив двері за собою і сів на стілець навпроти столу шефа. Він кивнув Франкліну, і той кивнув у відповідь. "Я ж не потрапив у неприємності, правда?"\nКалахан нахилив чорний капелюх на один дюйм вперед. "Боюсь, що потрапив, Андрюсе. Я проводив розслідування. Справа в тому, що ми маємо проблеми з високими хабарями, створенням проблем для людей, які не платять непомірні збори, і цивільними, які потрапляють у загони бандитів. Довгий час я думав, що це патруль робить свої власні справи і покладається на прибуток. І так, іноді це було так. Але після того, як ми з тобою поїхали до Ефрафи кілька місяців тому, я почав думати по-іншому, і я найняв приватного детектива з Х’юстона, щоб він це перевірив.""
nf_tpm_misc_events.10.b: "§g...§!"

nf_tpm_events_continued.40.t: "Техаське Руалетто, продовження"
nf_tpm_events_continued.40.d: ""Він викопав кілька десятків років історії, багато записів і описів. У часи мого батька був один чоловік, який завжди вимагав більше, ніж належить, але ніхто не помітив, що це був той самий чоловік. Це був старший шериф Рейган." Очі Франкліна здивовано розширилися в кутку — шеф знав, що Рейган був одним із найближчих друзів Франкліна ще в ті часи. Він проігнорував реакцію і зосередився на безпристрасному обличчі Андрюса. "Коли Рейган помер кілька років тому, платіж став нормальним на кілька місяців. Потім ми взяли тебе на роботу, і плата Рейгана повернулася, і знову з’явилися проблеми, якщо гроші не були виплачені. Тепер..." Шеф виклав два знімки і передав їх через стіл Андрюсу, який нахилився, щоб подивитися на них. "Ми вас вивели на передачу капсул за охорону патрульними банкам в Лон Старі та мафії в Новому Орлеані. Патруль ніколи не був корумпованою організацією, принаймні не в тому сенсі, як ми думали. Просто там було кілька гниліх членів." Калахан сидів прямо в своєму кріслі. Андрюс знизав плечима і подивився на шефа. Між ними була пауза приблизно в дві секунди, перш ніж права рука Андрюса вискочила з його пістолета, а револьвер висунувся вперед. Спалах світла і постріл. Рука Калахана опустилася, а тіло Андрюса схилилося в кріслі. Його рука тремтіла, і він знизав губи. "Думав, що він спробує щось таке." \nФранкліна встав, виглядав досить сумно. "Ти точно впевнений щодо Рейгана?"\n"Цілком впевнений, боюся."\n"Тоді передай мої вітання тому приватному детективу. Він побачив те, що я не міг." Франклін зітхнув і вийшов із кімнати, уникаючи крові, що скупчувалась на дні стільця Андрюса."
nf_tpm_events_continued.40.b: "§RЦе для мого старого.§!"

nf_tbh_tpm_events.1.t: "Пропозиція Калахана"
nf_tbh_tpm_events.1.d: "Двері в офіс Руска відкрилися, і в кімнату увійшли двоє чоловіків. Перший — сам Старший, середнього віку чоловік у коричневому костюмі. Він витягнув сигару з маленької металевої коробки на столі і закурив, сідаючи. Він натиснув кнопку на своєму столі, щоб включити маленький тихий вентилятор, який не давав кімнаті заповнитись запахом диму. Другий чоловік був шефом патруля, трохи молодший за Руска, одягнений у синю форму з золотим значком. Він зняв свій широкополий капелюх і поставив його на стіл, сідаючи на стілець по той бік столу. Руск глибоко вдихнув, а потім видув маленьке кільце диму з рота. Він спостерігав, як воно повільно дрейфує через стіл, а потім засміявся, коли вбудований вентилятор відтягував його вбік, не даючи йому потрапити на іншу сторону. "Це ніколи не набридне." Шеф патруля також посміхнувся."
nf_tbh_tpm_events.1.a: "Добре, вибачте за це. Чим можу допомогти?"

nf_tpm_events_continued.41.t: "Пропозиція Калахана, продовження"
nf_tpm_events_continued.41.d: "«Ну», - почав шеф, - «я чув кілька чуток про політику тут, у Далласі. Тепер, враховуючи, що шлях з Далласа до Лафайєта займає цілий день, я не можу точно сказати, наскільки надійні ті чутки, але вони... скажімо, були дещо занепокоєними. Тому я вирішив приїхати та поговорити з тобою особисто. Подивимося, як все є.»\nРуск повільно кивнув. «Так, думаю, більшість того, що ти чув, правда, в тій чи іншій мірі. Я займаюся делікатною ситуацією. Що саме ти чув?»\nКалахан відкинувся в кріслі і зітхнув. «Що ж, для початку, багато хлопців з Лафайєта добре говорили про вас, що ви впоралися з деякими рейдерами та канібалами на сході Техасу. Особливо ті хлопці в Картеджі. Вони створювали нам багато проблем протягом років, і хлопці попросили мене передати, що приємно знати, що ми не самотні в бажанні зберегти мир і спокій у регіоні.» Руск кивнув вдячно. «Але, якщо не заперечуєш, я чув чутки, що ви, ймовірно, розглядаєте можливість нападу на Александрію. Я чув всі ці історії про те, як ви підняли всіх на думку, що Техас може стати справжньою нацією одного дня, але якщо чесно, то Александрію не можна порівнювати з Техасом. І якщо ви хочете цього, то багато хто з хлопців почав хвилюватися, що Лафайєт може бути наступним.» Він затримався на мить, і Руск подивився на свої черевики, випускаючи ще одну порцію диму. «Ну, саме тому я тут. Оскільки ви, мабуть, хочете відкусити частину землі, яка не є Техасом, я домовився з моїми хлопцями про приєднання до вас. Якщо ви нас приймете, то патруль Лафайєта хоче приєднатися до того економічного союзу, що у вас є. А ще я отримав дозвіл запропонувати певний данину, щоб задовольнити деяких ваших більш агресивних хлопців, якщо це необхідно.» Шеф відкинувся назад і посміхнувся. Руск підняв погляд, очевидно, трохи здивований."
nf_tpm_events_continued.41.a: "Чудова пропозиція!"
nf_tpm_events_continued.41.b: "Маємо деякі побоювання..."
nf_tpm_events_continued.41.c: "Не думаю, що це вдасться."

nf_tbh_tpm_events.2.t: "Брати по значках"
nf_tbh_tpm_events.2.d: "«Що ж, це було несподівано», - визнав Руск після короткої паузи. Він постукав своєю сигарою об край попільнички на столі, потім зробив глибокий вдих. Він прокрутив дим у роті на мить, а потім видув довгу тонку лінію прямо до шефа. Вона була всмоктана вентилятором до того, як дісталася до обличчя шефа. Потім він посміхнувся: «У нас є угода», - сказав він через кілька секунд.\nШеф виглядав трохи здивованим. «Що, все?»\n«Ну, так», - пояснив Руск. «Моя рада була уповноважена приймати рішення щодо луйзіанського питання, і у тебе є більше співчутливих голосів у раді, ніж ти міг би очікувати. Багато наших хлопців цінують те, що ти робиш у Лафайєті, стежачи за тим, щоб рейдери ніколи не виходили з-під контролю, не об’єднуючись і не створюючи більших проблем. Правда в тому, що рада вже вирішила надіслати тобі пропозицію інтеграції, підкріплену силою, але вони також дозволили мені вести переговори від їхнього імені. Вони будуть розчаровані, що я не підтримую їхній план по анексії великої частини Луїзіани в цьому процесі, але якщо це допоможе тобі потрапити в економічний союз, а також надасть військову допомогу замість боротьби чи складної інтеграції, то, чесно кажучи, я вважаю, що це набагато кращий план.» Він замовк і повернувся до комп’ютерної консолі зліва від свого столу. «Мить.» Калахан відкинувся назад і закрив очі — він дуже довго їхав до Далласа, і ще одну довгу подорож йому належало зробити. Він був втомлений."
nf_tbh_tpm_events.2.a: "Ей, шефе, ти прокинувся?"

nf_tpm_events_continued.42.t: "Брати по значках, продовження"
nf_tpm_events.continued.42.d: "Очі Калахана миттєво розплющились, і він мало не випав зі свого стільця.\n«Так, вибачте за це. Думав, що трохи подрімав.»\n«Не проблема. Ось, подивіться на це.» Руск рішуче натиснув кнопку на клавіатурі, і принтер на стіні за ним загарчав, коли він почав працювати. Він видав один листок паперу, який Руск швидко переглянув, а потім передав шефу. «Це просто формальність, зрозуміло. Ми передаємо будь-яку землю Луїзіани, яку ми маємо, ти приєднуєшся до економічного союзу, ми погоджуємося допомагати один одному в майбутніх війнах, ти передаєш ту хабар, про яку ти згадував, і ми відмовляємося від будь-яких претензій на Луїзіану назавжди, серед кількох інших дрібниць. Підходить?»\nКалахан довго читав, а потім перечитав ще раз, щоб переконатися. Після десяти хвилин він попросив ручку, і Руск передав її через стіл. Калахан підписав документ, і пара потиснула руки перед тим, як обмінятися люб’язностями та покинути кімнату."
nf_tpm_events_continued.42.a: "Ми всі раді, що питання Луїзіани вирішилось."

nf_tbh_tpm_events.3.t: "Причина Руска"
nf_tbh_tpm_events.3.d: "Джип Калахана приїхав до головного патрульного поста Лафайєта близько 3 години ранку. Шеф припаркувався на відведеному місці, вимкнув машину і відкинув сидіння назад. Він важко зітхнув і закрив очі. Він намагався не заснути, але йому потрібно було трохи відпочити. Через кілька хвилин він почув легкий стук у вікно. Він відкрив очі і побачив Патрульного Лідера Франкліна, який стояв проти яскравої будівлі через весь майданчик. Шеф піднявся, спробував опустити вікно, згадав про важливість влади, і врешті-решт відчинив двері. Франклін відступив, поки шеф виходив.\n\n«Ну?» Шеф поглянув на Франкліна без емоцій протягом кількох секунд. Потім він посміхнувся. «Ми це зробили! Так!» Обидва розсміялися і обнялися. «Фух! Чоловіче, який день. Як же я довго їхав.» «Можу собі уявити. Прошло кілька десятиліть, як я востаннє був у Далласі, хоча, мабуть, зараз на головних дорогах не так багато бандитів.» «Ти ж не кажи. Все одно довелося зупинятися, щоб допомогти якомусь хлопцю з поламаною машиною, аби не отримав по шиях від кількох покидьків. Але, за великим рахунком, чиста поїздка.»"
nf_tbh_tpm_events.3.a: "§gФранклін підійшов до дверей патрульного поста і тримав їх відкритими.§!"

nf_tpm_events_continued.43.t: "Причина Руска, продовження"
nf_tpm_events_continued.43.d: "«Дякую тобі». Вони піднялися на третій поверх до офісу шефа, де Калахан тримав двері для Франкліна. Старий зробив драматичний поклон, потім зітхнув і посміхнувся, зауваживши, що його спина вже не така, як була раніше. «Привіт, Саллі!» Кіт шефа перестав чхати на ліжку і пробелькотав, помітивши вхід Калахана. Шеф і старий сіли по різні боки за стіл шефа. «Так що ж, як там усе пройшло? Ми всі почали переживати, коли так довго не чули від тебе.»\n\n«Та, це був легкий прогулянка. Радий, що поїхав — виявляється, рада Руска хотіла інтегрувати нас безпосередньо і була готова використовувати силу, щоб це підтримати, якщо ми не запропонуємо іншу угоду. Але старий Едді — хороший хлопець, і йому було дозволено приймати будь-яку угоду, яку ми запропонуємо. Виявляється, наша угода була досить вигідною.» «Я ж казав, що вони будуть дурнями, якщо відмовляться.» «Знаю! Я просто... не знаю, може, я думав, що вони дурні. Сором мені.» Обидва трохи посміялися, потім хвилинку помовчали. Потім розпочали більш повсякденну бесіду, яка тривала близько години. Після цього Франклін замкнув і пішов, а Калахан заліз у ліжко і заснув. Саллі III був дуже розчарований через відсутність нових вихованців цього дня."
nf_tpm_events_continued.43.a: "«Дякувати Богові, що все пішло, як ми сподівалися.»"

nf_tbh_tpm_events.4.t: "Далласовий дисонанс"
nf_tbh_tpm_events.4.d: "Ми не зовсім впевнені, що відбувається там, у Далласі, але ми щойно отримали повідомлення від шефа через радіостанцію Патрульних. Здається, цей Руск намагається змусити шефа погодитись, що ми будемо їхніми маріонетками, а наше керівництво буде пов’язане з Братством чи щось на кшталт цього. У нашій радіосистемі виникли деякі проблеми з потужністю, тому, ймовірно, ми можемо надіслати тільки одне повідомлення у відповідь. Ніхто з хлопців не зовсім впевнений, але Франклін взяв на себе керівництво і переконав інших надіслати шефу одне повідомлення."
nf_tbh_tpm_events.4.a: "«Я... думаю, ми можемо зробити це.»"
nf_tbh_tpm_events.4.b: "«Хочете нашу землю? Прийдіть і заберіть її.»"

nf_tbh_tpm_events.5.t: "Покора Калахана"
nf_tbh_tpm_events.5.d: "«Та, зрозуміло. Все зрозуміло.» Калахан поклав трубку на місце. Він важко зітхнув. Потім він повернувся і подивився на Руска, який сидів на іншій стороні кімнати. «Ну, ми, це, змогли зв’язатися з ними. Дякую, що дозволив мені скористатися вашою радіосистемою, щоб надіслати повідомлення так далеко.»\n«Не переживай», - сказав Руск. Він випустив ще одну димову кільце, цього разу прямо вгору. «Так, що вони сказали?»\nКалахан пройшов назад і сів на стілець по інший бік столу у Руска. Він присів, потім нахилився вперед і склав руки на столі. «Ну.» Він зробив паузу. Потім посміхнувся. «Вони не були задоволені, але дали мені дозвіл.»\nРуск скинув свою сигару на стіл, вдарив в долоні один раз і підняв правий кулак вгору."
nf_tbh_tpm_events.5.a: "«Ура! Я ж знав, що вони змінять свою думку. Ах, чорт.»"

nf_tpm_events_continued.44.t: "Покора Калахана, продовження"
nf_tpm_events_continued.44.d: "«Так, вибач за той пункт в угоді щодо антисуверенітету. У нас було багато проблем останнім часом з людьми в ТЕУ, які йдуть на свій розсуд і не допомагають з тим, чим повинні були. І ми не набагато краще; в Остіні нас чекають великі проблеми, і більшість ТЕУ хоче триматися подалі від цього. Рада вирішила, що якщо вони дадуть тобі можливість приєднатися до нас, не будучи повністю інтегрованим, то буде краще переконатися, що ми всі чітко розуміємо нашу взаємну допомогу незалежно від обставин.»\nКалахан кивнув. «Так, це має сенс. Все одно, дякую, що вислухав мене з усім цим. Це багато для мене значить.»\n«Звичайно, нічого, що я б не зробив для будь-кого іншого.» Руск раптом підняв правий палець. «О, майже забув. Дай секунду.» Він набрав щось на комп’ютері зліва від свого столу, а потім вивів це на принтер на стіні за ним. Він взяв аркуш, переглянув його і передав Калахану. «Отже, підпишіть тут. Це в основному просто обговорює все, що ми тільки що покрили. Ми передаємо будь-яку землю Луїзіани, яку маємо, ти приєднуєшся до економічного союзу, погоджуєшся, щоб деякі з наших лідерів наглядали за вами на найближчий час, ми погоджуємося не зловживати цим і гарантуємо вашу незалежність як окремого утворення, ти передаєш ту хабар, яку згадував, і ми відмовляємося від будь-яких претензій на Луїзіану назавжди, серед кількох інших деталей. Як, підходить?»\nШеф прочитав документ двічі, потім підписав без коментарів. Вони потиснули руки, обмінялися люб’язностями і розійшлися. Руск побажав Калахану безпечної поїздки додому, а шеф побажав старому удачі в управлінні радою."
nf_tpm_events_continued.44.a: "«Добре. Дуже добре.»"

nf_tbh_tpm_events.6.t: "Непокірний Калахан"
nf_tbh_tpm_events.6.d: "«Та, зрозуміло. Все зрозуміло.» Калахан поклав трубку на місце. Він важко зітхнув. Потім він повернувся і подивився на Руска, який сидів на іншій стороні кімнати. «Ну, ми, це, змогли зв’язатися з ними. Дякую, що дозволив мені скористатися вашою радіосистемою, щоб надіслати повідомлення так далеко.»\n«Не переживай», - сказав Руск. Він випустив ще одну димову кільце, цього разу прямо вгору. «Так, що вони сказали?»\nКалахан повернувся на місце на іншій стороні столу у Руска. Він сів, потім нахилився вперед і склав руки на столі. «Ну.» Він зробив паузу. Потім насупився. «Слухай, я висловив їм все, але вони фактично сказали, що це політичне самогубство. Мені дуже шкода, але, це... або угода про рівних союзників, або я не підпишу нічого.»\nРуск пробурмотів. «Це неприємно. Не скажу, що здивований, і розумію, що ти маєш на увазі.» Він зробив паузу, потім підвівся. Після останнього диму через стіл він втиснув сигару в попільничку і залишив її там. «Ну, ось що я можу зробити для тебе. Якщо ти не передумаєш і якщо твій патруль відхилить офіційний запит на інтеграцію, який ми відправимо вам на деякий час, то, ймовірно, ми атакуємо вас. Люди помруть. Багато людей. Але, незалежно від того, хто виграє, я тобі обіцяю ось що. Якщо ми вас переможемо, ми будемо м’якшими після цього.»\nКалахан подивився на старого довгим мовчазним поглядом. Потім він плюнув на землю, розвернувся на палець і пішов. Двері автоматично зачинилися за ним, залишивши Руска наодинці з його думками."
nf_tbh_tpm_events.6.a: "«Ну, це, це... мабуть, все.»"

nf_tbh_tpm_events.7.t: "Наші справжні кольори"
nf_tbh_tpm_events.7.d: "Руск усміхнувся і кивнув шефу на знак примирення. «Визнання заслуг — це дійсно відмінна пропозиція, і більше, ніж наша рада очікувала.» Він зробив паузу і витягнув аркуш паперу з одного з ящиків столу. «На жаль, незалежно від того, що б ти сюди приніс, я сумніваюся, що це було б достатньо. Подивися ось.» Він протягнув аркуш через стіл до тепер вже насупленого Калахана. Шеф прочитав його, потім повернув назад до старого. «Як бачиш, рада вже ухвалила рішення тиждень тому. Зверни увагу, я голосував за те, щоб поговорити з вами раніше, але більше нічого я зробити не можу. Ось ситуація. Я намагався керувати процесом так, щоб ми мали єдиний Техас, як ти знаєш. Але для цього потрібно було дати решті керівництва Братства голос у правлінні.»"
nf_tbh_tpm_events.7.a: "§g...§!"

nf_tpm_events_continued.45.t: "Наші справжні кольори, продовження"
nf_tpm_events_continued.45.d: "«Мені не дуже подобається, коли я не отримую своє, але більше я нічого не можу зробити. Називай їх війною, якщо так буде краще; їх умови для миру — це безумовна капітуляція Патрульних і подальша анексія міста Лафайєт. Я дуже поважаю тебе і твою команду за все добре, що ви зробили там, але це просто так треба бути. Вибач, шеф.»\nКалахан повільно підвівся і надів свій капелюх. «Ну, здається, це все. Якщо Лафайєт не має розуму, щоб полегшити всім роботу, то це вже не моя провина.» Він пішов до дверей, потім обернувся. Поклав руку на пістолет у кобурі. «Я міг би зараз застрелити тебе за всі ті життя, які ти загубиш тільки тому, що не вмієш заводити друзів.»\nРуск знизав плечима і випустив ще одну кільце диму через стіл. «Це не мало б ніякого значення. І після того, як це все закінчиться, ти знаєш, що я зроблю все, що зможу для вас.»\nКалахан ще хвилину дивився на старого. «Побачимо», - пробурмотів він. Потім він повернувся і пішов через відкриті двері, які за ним зачинилися. Руск кілька хвилин сидів у тиші, перш ніж знову взятися за роботу."
nf_tpm_events_continued.45.a: "«Прощавай, мабуть.»"

nf_tbh_tpm_events.8.t: "Кінець лінії"
nf_tbh_tpm_events.8.d: "Джип Калахана приїхав до головного патрульного поста Лафайєта близько 3 години ранку. Шеф припаркувався на відведеному місці, вимкнув машину і відкинув сидіння назад. Він важко зітхнув і закрив очі. Він намагався не заснути, але йому потрібно було трохи відпочити. Через кілька хвилин він почув легкий стук у вікно. Він відкрив очі і побачив Патрульного Лідера Франкліна, який стояв проти яскравої будівлі через весь майданчик. Шеф піднявся, спробував опустити вікно, згадав про важливість влади, і врешті-решт відчинив двері. Франклін відступив, поки шеф виходив.\n«Ну?»\n«Ні.»\nФранклін зітхнув, а Калахан зачинив двері джипа. Вони йшли до будівлі мовчки, і Франклін тримав двері для шефа. Шеф кивнув на знак подяки. Вони піднялися на третій поверх до офісу шефа. Калахан витягнув ключ з кишені і відкрив двері. Він відчинив двері і тримав їх для Франкліна, який також кивнув на знак подяки. Шеф увійшов і закрив двері за собою, зачинивши їх і замкнувши. Саллі III проскреготів голосно з того місця, де лежав на ліжку шефа. Шеф глянув на нього і сумно усміхнувся. Потім він сів за свій стіл. Франклін сів перед ним."
nf_tbh_tpm_events.8.a: "«Так що, шефе, як справи?»"

nf_tpm_events_continued.46.t: "Кінець лінії, продовження"
nf_tpm_events_continued.46.d: "Калахан знову зітхнув. «Вони скоро або пізніше рухатимуться на Лафайєт. Коли це станеться, вони дадуть нам коротке попередження і запит. Або ми розпускаємо патруль і інтегруємося з їхньою системою заступників, передаючи їм ключі від міста, або не робимо цього. І якщо ми не погодимось, вони кинуть на нас все, що мають.»\n«І ти впевнений, що вони не блефують?»\n«Впевнений. Хотів би, щоб блефували, але Руск особисто проти цього кроку. Він передає контроль своїй раді, щоб спробувати підготувати їх до більш... е-е... демократичної системи. На жаль, саме ця рада прийняла рішення.»\nФранклін один раз кашлянув і посміхнувся старечою усмішкою. «Ну, могло б бути й гірше. Якщо вони атакують нас, вони зіграють нам на руку, і у нас не буде проблем з тим, щоб патруль бився на нашому боці.»\nКалахан сумно кивнув. «Так, але для всього того, що в нас є, у них є бойова броня і Даллас. Нам потрібен буде справжній чудо, щоб перемогти їх в їхній грі.»\n«Може, ми просто витримаємо. Якщо ми доведемо, що ми більше проблем, ніж варті, вони можуть знову відкрити питання про союз. Тільки треба утримати Лафайєт.»\n«Так.» Пройшло кілька хвилин мовчання, перш ніж вони знову заговорили, і коли вони все ж таки почали говорити, то це були більше випадкові, не пов’язані теми. Через годину Франклін закрив двері і вийшов з будівлі, а шеф нарешті пішов спати, гладячи свою кота, який постійно чхав."
nf_tpm_events_continued.46.a: "«Це, е-е... Ну, мабуть, це і є війна.»"

nf_tbh_tpm_events.11.t: "Поступка Руска!"
nf_tbh_tpm_events.11.d: "Шеф Патруля Калахан залишався на місці в лобі патруля на першому поверсі до кінця дня, читаючи до-воєнну книгу про американських солдатів у космосі. Він заснув біля дивного телефонного пристрою Франсіса і прокинувся поруч з ним. Крім рідкісних перерв, щоб сходити в туалет і поїсти—під час яких телефон знаходився під наглядом іншого патрульного лідера, який був поблизу—він залишався біля телефону до кінця дня. Вранці, коли Калахан вже майже здався, телефон задзвонив. Він підняв трубку за кілька секунд. «Шеф Калахан на зв’язку.»\n\n«Привіт, шефе.» Це був Руск. «Тільки що вийшов з наради з рештою ради в Далласі. Думав, що тобі слід бути першим, хто дізнається. Вони прийняли твої умови.» Калахан видав голосний вигук задоволення, і Руск насмішкувато посміхнувся. «Не хвилюйся занадто. Вони все ще не задоволені тим, як закінчилася війна, і завтра почнеться 48-годинне припинення вогню. Якщо вони не отримають капітали, які ти запропонував у своєму початковому договорі до того часу, війна знову розпочнеться. Але поки той вантажівка, про яку ти згадував, перетне кордон без проблем, я зроблю все, щоб ця війна закінчилася. Вони досить мінливі, але я маю достатньо важелів, щоб утримати їх від своїх слів. Зрозуміло?»\n«Так точно, сер», — відповів шеф. «Хлопці будуть раді почути новини. У Лафайєті багато наляканих людей, які сподіваються, що їхні діти не загинуть на фронті через війну, яка не повинна була відбутися.» Руск знову засміявся. «Ну, передавай їм хороші новини. І обов’язково надішли цей вантаж завтрашнім ранком. Вибач за весь цей безлад.»\n«Якщо ми йдемо вперед, Едді.» Потім почувся ще один бурчання з іншого боку телефону, і зв’язок перервався. Шеф поклав телефон на стіл, відкинувся в своєму кріслі і важко зітхнув."
nf_tbh_tpm_events.11.a: "«Може, кілька сотень мертвих чоловіків зробили його розумнішим.»"

nf_tbh_tpm_events.12.t: "Перегляд Руска"
nf_tbh_tpm_events.12.d: "Шеф Патруля Калахан залишався на місці в лобі патруля на першому поверсі до кінця дня, читаючи до-воєнну книгу про американських солдатів у космосі. Він заснув біля дивного телефонного пристрою Франсіса і прокинувся поруч з ним. Крім рідкісних перерв, щоб сходити в туалет і поїсти—під час яких телефон знаходився під наглядом іншого патрульного лідера, який був поблизу—він залишався біля телефону до кінця дня. Наприкінці дня він скористався місцевими радіо-мережами, щоб перевірити ситуацію на фронті, і отримав підтвердження, що бої продовжуються, хоча й переривчасто. Тоді він відмовився від телефону, сильно вдарив по кріслі в роздратуванні, згодом здригнувся від болю, що виник через удар по дерев’яному стільці, і повернувся до своєї спальні. Саллі III привітав його прибуття чханням, і коли шеф плюхнувся на своє ліжко, кіт шефа, покульгуючи, підійшов і стрибнув на ліжко."
nf_tbh_tpm_events.12.a: "«Гаразд, Руск. Добре. Давайте зробимо це важким способом.»"