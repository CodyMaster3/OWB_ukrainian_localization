TPM_black_hat_leader:0 ""
TPM_black_hat_leader_desc:0 ""
TPM_black_hat_advisor:0 ""
TPM_black_hat_advisor_desc:0 "§OМені набридли деякі з вас, бандити в синіх капелюках.§!"

TPM_BLACK_HAT_NAME:0 "Чорний Капелюх Калахана"
CALLAHAN_BLACK_DESC:0 "Після серії війн, яких він ніколи не уявляв, що добрі громадяни Лафайєта повинні були б витримати, начальник патруля Калахан нарешті втратив свою доброзичливу оптимізм і був зломлений у джунглях Александрії. Втомлений від боягузтва в лавах і корупції серед керівників, він оголосив, що так розчарований теперішнім станом Патруля, що надягнув Чорний Капелюх Начальника, символічний жест старших поколінь. Завжди заряджений револьвер у руках, і начальник стежить за тим, щоб патрулі залишались відповідальними перед громадянами, яких вони поклялись захищати, і мужньо боротися з бандитами, яких ми поклялись перемогти, ніхто точно не знає, коли з’явиться начальник, а його слово — це закон. На посту, правозахисник — нам потрібно ловити бандитів."
TPM_black_hat_disgruntled_leader:0 "Розчарований"
TPM_black_hat_disgruntled:0 "§OВже майже втратив надію§!"

TPM_STEEL_HAT_NAME: "Стальний Капелюх Калахана"
CALLAHAN_STEEL_DESC:0 "Хоча робота на когось іншого завжди звучала як найгірший сценарій для великого начальника патруля, справи не виявились настільки поганими, як могли бути. Начальник все ще приймає рішення в Лафайєті, і в кінці дня, поки патрулі охороняють наших нових господарів на заході і стежать, щоб нічого серйозно поганого не відбувалося в Блефі, що могло б турбувати наших благородних вельмож, все залишилось майже як було. Зараз, коли закордонна ситуація надійно схована, Калахан одягнув Стальний капелюх, щоб показати свою відданість більш потужним гравцям, залишаючись при цьому в патрулях. І, що дивно, патрульні, найближчі до нього, помітили, що він став набагато щасливішим після того, як все це сталося. Цікаво, чи буде це тривати."
TPM_steel_hat_content_leader:0 "Заступник когось іншого"
TPM_steel_hat_content:0 "§CЗадоволений своєю поточною ситуацією§!"

TPM_the_chief:0 "Практичний Босс"
TPM_the_chief_advisor_desc:0 "Іноді начальнику просто треба підкачати рукави і взятися за велику справу самому. Начальник патруля Калахан колись очолював П’яту патрульну групу, і він добре пам’ятає свої часи з ними. Кожного разу, коли він має можливість, йому приємно вирушити на патрулювання разом з ними. Вони ніколи не роблять ризикованих кроків, коли начальник поруч, але він завжди знаходить найризикованіші способи зробити нудні патрулі цікавими, і хлопці це люблять."

TPM_COMMUNITY_COUNCIL_NAME:0 "Громадська Рада"
TPM_COMMUNITY_COUNCIL_DESC:0 "Після того, як ми отримали декілька уроків від більших хлопців на заході, Лафайєт було реорганізовано в громадську раду з найкращих людей міста. Але ніхто з цих людей не має жодних навичок управління і зовсім не хоче втручатися в політику, тому в кінці дня половина людей на раді звертаються до Калахана (тепер вже на пенсії) за порадами, а інша половина просто не робить нічого корисного. Результат цього — система, яка ідеально налаштована на те, щоб нічого не робити. Можливо, колись вони скинуть цей фарс і просто повернуть Калахана на посаду, де йому належить бути, але якщо цей експеримент показав хоч щось про добрих громадян Лафайєта, то це те, що вони ще не готові жити без Патруля. Принаймні більші хлопці на заході теж не отримують від них великої вигоди, якщо подивитися на їхню некомпетентність."
TPM_council_leader:0 "Ідеальна Стагнація"

TPM_FRANKLIN_NAME:0 "Лідер патруля Франклін"
TPM_franklin:0 "Покоління досвіду"
TPM_franklin_advisor_desc:0 "«Старий» Франклін перебуває в патрулі вже дуже довго. Йому зараз понад 80, і незважаючи на те, що він працює разом із третім поколінням начальників патруля Калаханів, він не показує жодних ознак сповільнення. Він дуже обережний і методичний, коли йому довіряють командувати не лише своєю безпосередньою групою патруля, але він має таку саму повагу в патрулі, як і сам начальник, і ніхто не може заперечити, що якщо йому дати достатньо часу, щоб подумати про проблему, він зазвичай здатен знайти чудове рішення, спираючись на півстолітній досвід. Він, ймовірно, скоро піде на пенсію, але він залишився досить довго, щоб зрозуміти, що йому легше буде пообідати з Жнецом, ніж покласти зброю."

TPM_GRANT_NAME:0 "Лідер патруля Ґрант"
TPM_grant:0 "Рідний з Баю"
TPM_grant_advisor_desc:0 "Лідер патруля Кейсі Ґрант є одним із наймолодших членів патруля, хто досяг рівня командувача, але це не був ранг, якого він не заслужив. Народжений у родині пионерів другого покоління в Каннері, він вирішив ще в молодості, що риболовля та робота на фабриці — не для нього, і вирушив в подорож углиб країни, щоб потрапити в бандитський набіг на базу патруля біля Блефу. Його захопили, але коли він сказав патрульним, хто він і звідки, вони вирішили прийняти Кейсі і зробити його одним із своїх. Відтоді він відчуває сильну лояльність як до свого дому в Каннері, так і до Золотої та Синьої, що поставили його на правильний шлях. Він хотів би одного дня повернутися додому і спробувати себе в сімейному ремеслі — виготовленні човнів, але до того часу, поки це не стане можливим, він повністю налаштований виконувати свої обов’язки перед Патрулем і допомогти стежити за річками від піратів і інших небажаних проблем."

TPM_GEORGE_NAME:0 "Шериф-Лідер Джордж"
TPM_george:0 "Натхненний історією"
TPM_george_advisor_desc:0 "Найстарший чоловік у 5-й патрульній групі, шериф-лідер Джордж завжди мав цікавість до техніки до Великої війни. Більшість інших жителів Лафайєта сприймають довоєнну Америку як ностальгічний період, який варто обговорювати тільки через фільми та книги, що були створені тоді, але Джордж особливо захоплений ідеєю цивільних авіаперевезень. Тепер, коли технології після катастрофи починають відновлюватися до рівня довоєнних часів, 63-річний шериф сподівається дожити до того часу, коли авіаперельоти між містами знову стануть реальністю. Це романтична мрія, звісно, але це його велика мрія, і він був би надзвичайно щасливий, якби вона здійснилась."

TPM_MAC_NAME:0 "Лідер Патруля Макк"
TPM_mac_trait:0 "Дружелюбний П’яничка"
TPM_advisor_mac_desc:0 "Лідер патруля Роккі «Паскудник» Макк — безумовно, найбільш розважальний чоловік серед вищих ешелонів 10-го патруля Лафайєта, якого можна запустити в кімнату і подивитися, що станеться. Хронічний алкоголік з юності, він бачив свою частку битв, очолював не одну патрульну операцію та робив не один арешт і збір. Повсякденна кар’єра, яка стала ще більш вражаючою завдяки тому, що більшу частину часу на службі він був п’яний. Коли його первинний лідер патруля вперше помітив, що щось не так з його когнітивними здібностями, це сталося лише тому, що Макк випив цілу пляшку самогону того ранку. З того часу Макку дали титул «молота патруля» — він не особливий в повсякденному житті, але якщо дати йому небезпечний патруль і неможливі накази, він візьме своїх людей і знайде спосіб вирішити справу за допомогою священної сили рідкої відваги."

TPM_CUNNINGHAM_NAME:0 "Шериф-Лідер Каннінгем"
TPM_cunningham:0 "Сліджущий За Щурами"
TPM_advisor_cunningham_desc:0 "Будучи першим у патрулі, хто виявив, що його дитячий друг і товариш по службі став зрадником за хабар від Гангстерів Алєксандрії, шериф-лідер Джошуа Каннінгем розвинув корисний рівень соціальної параної. До нього важко підійти, а ще важче здобути довіру. Каннінгему дали задачу «перевіряти» все, що хоч трішки здається не так в стані Патрульних. Якщо хтось ставить неправильне питання, з’являється не в тому місці чи запізнюється на зустріч, на яку не мав права запізнюватися, Каннінгем, зазвичай, перший, хто розслідує та останній, хто забуде цей інцидент."

TPM_GRENHAM_NAME:0 "Лідер Патруля Гренем"
TPM_grenham:0 "Борцю з Піратами"
TPM_advisor_grenham_desc:0 "Лідер патруля Майкл Гренем є близьким другом начальника, адже він вступив до патруля разом з Калаханом ще в їхній юності. Дитячий друг, який став братом по зброї завдяки братерству Патруля, Калахан завжди може покластися на Гренема, коли ситуація стає важкою, і саме він був природним вибором для підвищення до лідера патруля 5-ї групи після того, як Калахан офіційно став начальником патруля. Патруль Гренема саме перебував поблизу, коли мутантський піратський капітан спробував напасти на місто Каннері на Острівному болоті, і, незважаючи на те, що їм не було наказано допомагати, вони з радістю приєдналися до бою та тримали оборону проти піратської атаки достатньо довго, щоб берегова охорона Баю змогла прогнати їх. Начальник також був на цій операції, але його збили з ног та непритомно, і саме Гренем неофіційно очолив більшу частину оборони, чим він постійно любить нагадувати всім, хто запитує."

TPM_ANDREWS_NAME:0 "Депутат-Навчанець Ендрюс"
TPM_andrews:0 "Все Більше"
TPM_andrews_advisor_desc:0 "Спочатку депутат у службі законників Техаської Братії, Мітчелл Ендрюс народився та виріс у Далласі, який займала Братія. Він не має особливої лояльності до міста Лафайєт чи до значка, який він намагається заробити, але у нього є незаперечна лояльність до Патрульних як організації і до своєї групи патрулів як особистостей. Він залишив Техас, бо відчував, що законники там ставали занадто інституціалізованими. Не було стільки пригод, і єдина дія для патрулів почалася тільки під час формальних воєн між Братією та їхніми сусідами-бандитами. У більш беззаконних землях західної Луїзіани він знайшов більше пригод, і зараз він радий застосувати свій досвід на благо своєї нової родини. Він не є особливим серед Патрульних загалом, але досвід у тактиці об’єднаних сил Братії дає йому багато порад, якщо Лафайєт колись вирішить інвестувати у менш традиційні методи боротьби."

TPM_GARY_NAME:0 "Лідер Патруля Гарі"
TPM_gary:0 "Голос Розуму"
TPM_gary_advisor_desc:0 "Гарі — справжній, чесний, нудний чоловік. Він відомий тим, що є найбільш обережним серед Патрульних загалом, Гарі очолює 3-ю патрульну групу на маршрутах та місіях, що вимагають найбільше терпіння та тонких підходів. Тому так часто просять перевестися до його групи або з неї, і репутація 3-ї лише підкріпила вже й так обережне ставлення Гарі до життя загалом. З ним поруч у найнебезпечніші моменти більшість солдатів на місці може бути впевненими, що що б не сталося, вони будуть в безпеці та не будуть кинуті без причини."

TPM_ROCKWELL_NAME: "Шериф-лідер Роквелл"
TPM_rockwell: "Наставник-наглядач"
TPM_rockwell_advisor_desc: "Шериф-лідер Роквелл безпосередньо відповідальний за апатію, яку Калахан намагається зменшити серед Патрульних останнім часом. Але хоча начальник міг би забрати в нього значок через його любов до пончиків, Калахан не може не захоплюватися відвагою Роквелла. Прямий і гірко чесний, Роквелл недавно був призначений керувати підготовкою новобранців саме тому, що його необережна чесність робить його найближчим до тренера, якого Лафайєт може мати. Якщо хтось погано справляється на тренуваннях, щоб приєднатися до патруля, Роквелл уважно стежить за ними і прямо дає зрозуміти. І поки на вихідних є багато пончиків на зустрічах і нових осіб, яким можна давати накази та образи, Роквелл не міг би бути щасливішим."

TPM_FRANCIS_NAME: "Лідер Патруля Френсіс"
TPM_francis: "Червоний дріт"
TPM_francis_advisor_desc: "Лідер патруля Френсіс, слід визнати, є одним з найменш корисних лідерів патруля в Патрульних. Він досить пасивний і неодноразово допускав невдачі через нестачу уяви, через що бандити могли уникати затримання, а його передбачувано методичний підхід до ведення патруля призвів до відчуження між загальним братерством Патрульних та його підлеглими. Однак те, чого йому не вистачає в соціальному становищі та ефективному лідерстві, він компенсує технічними знаннями та інноваціями. Френсіс неодноразово відкривав забуті арсенали довоєнного часу та знешкоджував величезні саморобні бомби на різних етапах своєї цікавої кар’єри, а Калахан давно доручив йому проводити дослідження в межах тих можливостей, які Патрульні можуть використовувати. Розумний хлопець, незважаючи на все."

TPM_DANNY_NAME: "Динамітний Денні"
TPM_danny: "Улюбленець усіх"
TPM_danny_advisor_desc: "Хоча Денні не є офіційним членом Патруля, він, без сумніву, знаходиться на рівних з начальником щодо своєї надійної корисності. Торговець зброєю за професією, він має численні зв’язки з різними постапокаліптичними підприємствами, які постачають зброю та інструменти з невідомих місць до невідомих місць, і чимало з цих товарів опиняються в його магазині в Лафайєті. Звісно, основними його клієнтами завжди були Патрульні, і він звик до спеціальних угод з ними в обмін на певні інші послуги. Денні — це особливий чоловік з особливими потребами, і часто він може дати інформацію про місцезнаходження бандитів ще до того, як Патрульні дізнаються, хто ці бандити. Це не корупція, поки неправдиві не потрапляють за грати, коли Патруль зможе знайти час для цього."

TPM_SHANK_NAME: "Луїс "Шанк" Флетчер"
TPM_shank: "200 років досвіду"
TPM_shank_advisor_desc: "Якщо є хтось у Лафайєті, хто знає, як укласти угоду, це Луїс Флетчер. Хоча він технічно є найстарішим чоловіком серед Патрульних, він не був залучений до активних патрулів щонайменше останні сто років. Будучи одним з небагатьох оригінальних жителів Лафайєта, хто пережив вибухи бомб, ставши гулем, замість того, щоб бути вбитим чи отруєним, саме він відмовився залишати руїни свого старого дому на околицях міського центру, і це його місце з тих пір. Він служить як досвідчений одинокий присяжний, що укладає угоди у випадках цивільних суперечок. Оскільки в Лафайєті немає організованого кодексу законів і місто в значній мірі покладається на Патрульних, щоб підтримувати мир і приймати морально правильні рішення для міста в цілому, Флетчер служить посередником для вирішення суперечок, коли їх неможливо вирішити через особисті переговори, але учасники не хочуть привертати увагу Патруля. Якщо обидві сторони погоджуються поважати судження "Шанка", це зручний спосіб вирішити проблеми без створення нових."

TPM_TREVOR_NAME: "Депутат Тревор"
TPM_trevor: "Тревор і сини"
TPM_trevor_advisor_desc: ""Депутат" — це титул, який Тревор Ларкер не любить часто використовувати, але це один з багатьох титулів, які він здобув за роки. Тревор — це той персонаж, який робить практично будь-яку роботу, якщо з’являється можливість, і хоча він не кваліфікований для більшості робіт, якими займається, йому якось вдається уникати катастрофи. Міністр по неділях, депутат по понеділках, збирач сміття по вівторках і будівельник з середи по суботу, він і його маленька родина завжди готові взятися за будь-яку роботу, яку треба виконати, коли ніхто інший не може. Останнім часом він набув особливого хисту до допомоги Патрульним у встановленні блокпостів і фортець для боротьби з бандитами на Кручі, і все, що йому потрібно — це хороша зарплата, і він обов’язково зробить свою роботу до того, як вона мала б бути завершена."

TPM_MAYOR_NAME: "Мер"
TPM_mayor: "Дружелюбний хлопець"
TPM_mayor_advisor_desc: ""Мер" насправді не є мером. Старий, відставний патрульний, який усе своє життя колекціонував довоєнні фільми, Мер зараз керує місцевим театром та проводить перегляди відновлених холотейпів щовихікенду, коли більшість Патрульних повертаються до міста для зустрічей керівників патрулів. Він поставив собі за мету показати кожному хорошому громадянину Лафайєта, як їм пощастило жити в такому чистому і здоровому місті, а коли настає свято або привід для святкування, завжди Мер організовує події. Звісно, якщо ви добре його знаєте, то розумієте, що Мер цілком спокійно ставиться до свого справжнього імені — Чак, — але йому просто смішно грати на прийнятій стереотипній ролі, тому краще не втручатися."

TPM_JOHNNY_NAME: "Джонні Калахан"
TPM_callahan_fake: "Бармен на Партикл-Роу"
TPM_callahan_fake_advisor_desc: "Джонні був депутатом кілька років, коли його двоюрідний брат Адам вступив на службу, але швидко зрозумів, що життя в русі — не для нього. Звісно, кемпінг у лісі з друзями раз чи два на рік був цікавим як новизна, але для роботи це не підходить. Тому він прийняв на себе бар свого батька після того, як той вийшов на пенсію, і бар процвітає з тих пір. Джонні — це саме той тип людини, якого ви очікуєте побачити за барною стійкою. Він одночасно чудовий зберігач секретів та найбільший пліткування у місті, а бар на Партикл-Роу продовжує бути успішним, поки він за кермом. І, слухайте, поки апетит Патрульних до алкоголю збігається з його апетитом до гарної історії, значна частина зарплати Патрульних проходить через його бар і повертається до них у вигляді допомоги в ескортуванні товарів через важку територію. Це вигідна ситуація для всіх, і навіть начальник пишається тим, що цей скромний бармен допомагає зберігати добру репутацію родини Калахан."

TPM_COOLANT_NAME: "Лідер Патруля Кулант"
TPM_coolant: "Практичний зберігач"
TPM_coolant_advisor_desc: "Лідер Патруля Крон Кулант має унікальну позицію — він дратує всіх, нагадуючи людям не марнувати ресурси в повсякденному житті. Хоча більшість Патрульних Лафайєта мало взаємодіють із звичайними громадянами (окрім вихідних), Кулант багато свого часу проводить, переконуючи людей на позиціях бізнесу чи будівництва знайти нові способи переробляти та повторно використовувати матеріали. Якщо б не він, мабуть, не вистачило б цегли, щоб завершити будівництво поточної головної станції Патруля в Лафайєті перед ураганом у '74, і він завжди нагадує про це, коли хтось сумнівається, чи справді треба збирати кожен металевий шматок і зберігати його для майбутніх проектів."

TPM_MARSHALL_NAME: "Лідер Патруля Маршал"
TPM_marshall: "Чесний хлопець"
TPM_marshall_advisor_desc: "Лідер Патруля Маршал — один з небагатьох Патрульних, хто народився в місті, яке було охоплене бандами — Александрії, і єдиний з цієї малої кількості, хто піднявся до рівня лідера свого патруля. Саме 9-й Патрульний загін — "Божевільні Маршала" — прикривав відступ під час останнього нападу на "Гаторів" у '69. Хоча Маршал був народжений і виріс у бандитському суспільстві Гаторів, він швидко зрозумів, що йому не подобається ця варварська непередбачуваність життя в Александрії, і віддаватися патрулю стало для нього природним способом втекти. Він був так само здивований, як і Патрульні, коли вирішив вступити до їхнього складу, і він довго носив таємну мрію повернутися додому та допомогти перетворити Александрію на чисте і стабільне місто, як Лафайєт. Можливо, йому вдасться здійснити цю мрію, а може й ні."

TPM_LARRY_NAME: "Депутат Ларрі"
TPM_larry: "Щотижневі опитування"
TPM_larry_advisor_desc: "Ларрі Лопес народився в 2257 році разом зі своїм братом-близнюком Бобом. Після того, як він виріс у Лафайєті серед Патрульних, що здійснювали благородні пригоди та проявляли самопожертву, Ларрі ніколи не сумнівався в тому, чим хоче займатися в житті. Він вступив до програми "Молодий депутат" у 16 років у '73, і лише нещодавно отримав свій значок — в той самий день, коли його брат також приєднався, але без програми "Молодий депутат". Хоча Ларрі ще новачок в багатьох складних завданнях, які Патрульні очікують від своїх членів, він є популярним ексравертом серед молоді Лафайєта, і проводить щотижневі турніри з боулінгу для всіх, хто хоче приєднатися. Маєчи багато справ, він виконує функції неофіційного PR для Патруля, а його звичайні опитування громадської думки Лафайєта допомогли начальнику уникнути багатьох непопулярних рішень, які він би інакше дійсно розглядав. На жаль, ці опитування також стали каналом для менш задоволених мешканців міста висловлювати свої занепокоєння публічно, але, ну, Ларрі завжди вважав, що це просто частина роботи."

TPM_BOB_NAME: "Депутат Боб"
TPM_bob: "Священне Писання говорить"
TPM_bob_advisor_desc: "Боб Лопес народився в 2257 році разом зі своїм братом-близнюком Ларрі. Поки Ларрі завжди знав, що хоче приєднатися до Патрульних, Бобу не пощастило мати таку сильну переконаність щодо служби в синьо-золотому. Однак він дуже зацікавився теологією місцевої церкви і знаходить найбільше задоволення в тому, щоб очолювати невелику групу молодих людей у вихідні — деякі з яких стали Патрульними, коли він сам приєднався. Він вступив до Патрульних і пропустив рангову посаду "Молодшого депутата" завдяки винятковому свідченням пастора Гарпера про моральний характер Боба. Боб не хоче вбивати когось під час служби, і він не впевнений, чи зможе це зробити, якщо робота цього вимагатиме, але з філософської точки зору він знає, що немає нічого більш справедливого, ніж ставити своє життя на карту для захисту дому та близьких, тому коли він не в церкві, він вирішив, що саме цим він буде займатися, і, можливо, зможе зробити Патрульних кращими через власний вплив."

TPM_PULP_NAME: "Депутат Пулп"
TPM_pulp: "Сертифікований непосида"
TPM_pulp_advisor_desc: "Депутат Рональд Пулп широко відомий як дуже набридлива людина. Він вступив до патруля в '73 з метою піднятися по службі. Він сподівається, що одного дня зможе стати начальником Патруля, щоб мати змогу вирішувати все в Лафайєті і перебудувати місто у своєму егоїстичному образі. Але те, чого йому не вистачає в такті, він компенсує послідовністю. Серед загалом аполітичних громадян Лафайєта, Пулп є яскравим нагадуванням про те, чому так багато звичайних людей відмовилися від свого права на активну політичну систему, надаючи перевагу тому, щоб просто довіряти Патрульним робити правильні речі — це так спокійніше, коли поруч немає таких людей, як Пулп. Коли Пулп намагається переконати людей не довіряти монополії Патрульних на ефективне управління, він ненавмисно переконує більшість, що все в порядку так, як є, і що насправді адміністрація Патруля не така вже й погана."

TPM_content: "Задоволений"

TPM_PATROL_CHIEF_CALLAHAN_NAME: "Начальник Патруля Калахан"
CALLAHAN_NAME_ALT: "Мер Адам Калахан"
CALLAHAN_BLUE_DESC: "Начальник Патруля Калахан народився, щоб стати Патрульним; єдиний син колишнього начальника Патруля та медсестри в польовому госпіталі, він виріс, спостерігаючи, як його батьки здійснюють правосуддя та лікують хворих за власним бажанням. Незважаючи на звичайне просування по службі до його обрання начальником Патруля двадцять чотири роки тому, він лише тепер починає розуміти швидко розпадаються основи, на яких тримається Десятий Патруль. Політика його батька про самозвітність та індивідуальну відповідальність призвела до зростання кількості корумпованих чиновників, збільшення присутності бандитів і значного зловживання почуттям праведного обов’язку в організації, якій колись довіряли. Як би Калахан не прагнув зберегти все як у часи його батька, він нарешті починає розуміти, що, можливо, золото і синій більше не означають те, що колись у Пустелі."
TPM_blue_hat_leader: "Начальник Десятого Патруля"
