l_english:
tpm_minutes_of_madness: "Хвилини божевілля"
tpm_minutes_of_madness_desc: "Коли бомби впали близько двох століть тому, шериф парафії Александр Калахан тільки-но добирався до свого рідного міста Лафайєт. Він провів наступні кілька жахливих тижнів, збираючи розбиті шматки свого життя, намагаючись підтримати закон і порядок у радіоактивних залишках свого дому. Чому ядерна бомба впала саме на явно цивільну ціль Лафайєт? Ніхто не знає."
tpm_town_life: "Життя в маленькому місті"
tpm_town_life_desc: "З роками, місто біженців, що було побудоване на околицях Лафайєт, почало поступово наближатися до центру. Після майже півстолітнього вигнання, кілька поселенців з туманним досвідом у забутих науках оголосили центр міста знову безпечним для проживання. Коли наші предки поховали своїх пращурів, життя поступово повернулося до того, що можна було б назвати нормальним. Життя йшло далі."
tpm_the_bluff: "Вигрібання Блаффу"
tpm_the_bluff_desc: "Після відносно довгого періоду післявоєнної невинності, який дозволив Лафайєту відновити себе, перші з багатьох бандитських угруповань атакували місто в 2143 році, виходячи з схованки в лісі навколо міста Мосс-Блафф. Декілька людей загинули, але добрі громадяни Лафайєта згуртувалися і створили групу надійних правоохоронців для полювання на бандитів. І вони їх наздогнали."
tpm_gold_and_blue: "Золото і Синє"
tpm_gold_and_blue_desc: "З утворенням Лафайєтських Патрульних багато чого змінилося, і багато чого залишилося незмінним. Люди Лафайєта довіряють Патрулю, щоб ті захищали їх, надаючи міліції рівень свободи в правоохоронних справах, що межує з корупцією. Тільки не варто про це говорити, бо це може призвести до того, що тебе покладуть, як бандита, ким ти, ймовірно, є."
tpm_trade_orleans: "Торгівля з Новим Орлеаном"
tpm_trade_orleans_desc: "Новий Орлеан... Яке місто. Вражаюче, як місце може мати таку чудову музику та атмосферу, водночас будучи абсолютно охопленим організованою бандитською діяльністю. Але, хто знає, кожен рано чи пізно має мати справу з дияволом. У цьому плані деякі з наших менш морально обтяжених торговців уклали угоду з орлеанським мафіозі, щоб дістати їхні кращі пістолети за вигідною ціною."
tpm_pirate_report: "Звіт пірата"
tpm_pirate_report_desc: "Схоже, наша коротка пригода в орлеанському підземному світі привернула деяку увагу. І, як не дивно, не погану. Наші торговці тільки що уклали угоду з деякими сумнівними піратами з Карибів, щоб стежити за всім, що може зацікавити Лафайєт в майбутньому. Хто знає, можливо, мати додаткового приватного детектива без моральних принципів може бути тим козирем, якого нам бракувало."
tpm_trade_memphis: "Торгівля з Мемфісом"
tpm_trade_memphis_desc: "Мемфіс — дивне місто, якщо вірити чуткам. Якісь циркові вистави правлять тут, а на кожному кроці культи. Робоодяг і все таке — не зовсім те, що ти бачиш щодня. І все ж, треба визнати, вони непогано укладають угоди. Кілька капіталів — і ми отримуємо кількох рабів, яких можна звільнити і перетворити на нових громадян, а також деякі дрібнички, щоб виправдати цю угоду. Не погано."
tpm_skybound_designs: "Дизайни Небесних"
tpm_skybound_designs_desc: "Ще один з тих диваків з Мемфіса з’явився сьогодні з рюкзаком, повним старовинних планів винищувачів. Ми не впевнені, де він дістав цей список, але він готовий продати його нам за досить помірну ціну. Хто знає, може, наявність кількох літаків може стати корисною у майбутньому?"
tpm_reinforce_legends: "Підкріпити легенди"
tpm_reinforce_legends_desc: "Збирайтеся біля вогнища! Кожного року чи близько того, шеф Патруля любить збирати всіх своїх людей (окрім скелетної команди для охорони міських кордонів) в центрі міста, щоб поділитися історіями. Простора, відкрита територія з кількома десятками вогнів для кількох десятків партій, кожна з яких групується для обговорення справ. Почнемо з однієї нещодавньої. Ви чули про того мутанта-пірата?"
tpm_cunningham_adventure: "Пригода Каннінгема"
tpm_cunningham_adventure_desc: "Це одна з найбільших ганьб Патруля, що ми не змогли утримати місто Александрія на значний час після того, як ми захопили його в 2243 році, але до того, як Гатор-Моузи повернулися до своєї старої домівки, ми дійсно все порушили! Ці покидьки мали купу дивних і жорстоких речей, і ми, ймовірно, врятували сотні життів, тільки-но зайшли туди. Солодка помста!"
tpm_george_adventure: "Пригода Джорджа"
tpm_george_adventure_desc: "Деякі з людей у Патрулі вже пережили чимало зим, набагато більше за наших молодших членів, і, ого, скільки вони мають історій! Шериф Джордж брав участь у Бої за Ліберсіт, коли ми принизили Ракетників, зробивши їх роботу за них. Бандити не знають кордонів, але за певну плату, ми теж. Що за пригода!"
tpm_chiefs_contribution: "Внесок шефа"
tpm_chiefs_contribution_desc: "Калахан не зовсім новачок в службі, але й не зовсім мудрець. Він отримав титул шефа безпосередньо від свого великого батька, Старого Чоловіка Калахана. Той був легендою, і наш нинішній шеф заробив свій значок в тій сутичці біля Нового Орлеану... Як це було, сім років тому? Починаю втрачати рахунок часу. Може, краще, якщо шеф сам пояснить цю історію."
tpm_best_policy: "Найкраща політика"
tpm_best_policy_desc: "Суть у тому, що Патруль вже не такий, яким був раніше. Щонайменше, так це постійно повторює шеф, і, зізнаймося, це вже починає позначатися на хлопцях. Він скликав справжню зустріч з керівниками патрулів, щоб з’ясувати деякі проблеми, які він помітив, а, чесно кажучи, ніхто не зовсім впевнений, чого очікувати. Ну, я не знаю, що він бачить, але справи йдуть нормально, чи не так?"
tpm_open_streets: "На відкритих вулицях"
tpm_open_streets_desc: "Калахан зійшов з розуму! Щонайменше, це те, що говорять на вулиці, але ніхто не наважиться сказати це йому в обличчя. Він ж Шеф Патруля, зрештою. Все ж, він ходить і знаходить деяких наших хлопців, здається, випадковим чином, і забирає їхні значки прямо там. Може, у нього є причина, але якщо вона й є, він точно не публікує її."
tpm_never_meet_heroes: "Ніколи не зустрічай своїх героїв"
tpm_never_meet_heroes_desc: "Виявляється, одна з причин, чому Калахан скидає деяких наших менш продуктивних патрульних, це скорочення витрат. Це справедливо, адже він забирає звільнені кошти і прямує до Динаміта Денні, щоб поповнити запаси важкого озброєння! Люди, нам давно потрібно щось цікаве. Не для якихось серйозних причин, просто хочемо спробувати."
tpm_to_the_bottom: "До суті"
tpm_to_the_bottom_desc: "Калахан викликав двох наших улюблених практичних жартівників до свого кабінету на зустріч. Щось там було про те, що вони зайшли занадто далеко. Не зовсім зрозуміло, що він має на увазі, але Кім і Тім Харді майже писають від страху через всю цю ситуацію. Сподіваємося, що вони знайдуть потрібні слова для шефа."
tpm_callahan_revenge: "Помста Калахана"
tpm_callahan_revenge_desc: "Тепер, коли шеф завершив обхід Патруля, він скликав усіх на зустріч. Всі ми знаємо, про що йдеться — з’явилися нові чутки, що Консервний завод тримає деяких наших хлопців в рабстві з того рейду на Александрії кілька років тому. Дехто каже, що шеф вирішив дати урок Моторам. І, чесно кажучи, більшість хлопців не заперечували б."
tpm_maw_wargoal: "Нальоти на північ від мене"
tpm_maw_wargoal_desc: "Ми думали, що покарали банди Гаторів у 49-му так сильно, що вони залишаться на своїй землі, але у них з’явився новий лідер, і вони ВЛЮТІ. Та дівка Собек, яку вони поставили на чолі банди бандитів, влаштовує хаос для всіх, хто подорожує через ті болота, і Александрія стала фортецею для рейдерів, яку ми не можемо ігнорувати. Збирайте Патруль — час постріляти в алігаторів!"
tpm_maw_aftermath: "Ось я"
tpm_maw_aftermath_desc: "Однією з важливих частин Другого бою за Александрії було те, як швидко шеф спрацював зі своїм револьвером. Багато разів він рятував життя одного з наших хлопців, просто опинившись у потрібному місці в потрібний час і з потрібною кількістю куль в патроннику. Тепер, коли ми отримали контроль над містом, давайте використаємо це, щоб отримати кращі матеріали для наших револьверів і розробити деякі ідеї для тренувань."
tpm_maw_side: "Станція Собек"
tpm_maw_side_desc: "Трон Собек в серці передмість Александрії — це кривава річ. Вона повісила розчленовані трупи на гачки, і все те огидне, що ти бачиш у доядерних жахах. Вона загинула під час останньої великої оборони, і ми майже впевнені, що шеф був тим, хто вистрелив їй прямо між очі. Він почувається жахливо через те, що вбив таку молоду дитину, але, мабуть, він розуміє, що зробив правильну річ."
tpm_maw_core: "Знищити ланцюги"
tpm_maw_core_desc: "Трохи хороших патрулів — і Александрія починає виглядати як звичайне місто. У нас з’являються поселенці з Лафайєта, і правоохоронці роблять хорошу роботу, переконуючи всіх нормальних громадян, що вони тепер в безпеці. Ми зробили добру справу, і тепер, здається, люди можуть знову безпечно подорожувати через болота Александрії."
tpm_bayou_wargoal: "Раби на південь"
tpm_bayou_wargoal_desc: "’За деякими звітами, один з наших хлопців, що привів Моторів кілька тижнів тому, клянеться, що бачив старого керівника Патруля Дженкінса, який ходить по Консервному заводу в ланцюгах і працює на рабську працю. Ми намагалися перевірити цей звіт, але не можемо наблизитися до нього, не потрапивши під обстріл — а це вже винне визнання, якщо ми коли-небудь чули. Час забрати наших хлопців назад!"
tpm_bayou_aftermath: "Застрягли посередині"
tpm_bayou_aftermath_desc: "Штурмувати Консервний завод не було легким завданням. Справжня кривава битва, але ми врешті перемогли, тому що шеф пильно стежив за плануванням і показував, які дерева безпечні для укриття та де не варто стріляти, щоб не пошкодити саму консервацію. Калахан суворий шеф, але у нього правильна ідея, і тепер ми ті, хто консервує рибу для північної частини затоки."
tpm_bayou_side: "Заспокоєння чуток"
tpm_bayou_side_desc: "Отже, ну... Після довгих розмов з багатьма людьми, ми майже впевнені, що, ну... Виглядає так, ніби сталася якась непорозуміння щодо всього цього ’рабства’. Може."
tpm_bayou_core: "Патрулювати хвилі"
tpm_bayou_core_desc: "Як би дурною не була вся ця боротьба, факт залишається фактом: Лафайєтські Правоохоронці — нові великі хлопці, які керують Консервним заводом, і це, ймовірно, залишиться так надовго. Після того, як ми розібралися з усім цим ’рабством’, через яке ми спочатку боролися, більшість інших проблем зникли. Звісно, місцеві все ще відчувають гіркоту щодо того, що ми зробили, але це не зупинить нас від їхнього захисту."
tpm_tough_crowd: "З цією важкою публікою"
tpm_tough_crowd_desc: "Тепер, коли ми залагодили питання з нашими двома більш проблемними сусідами, шеф Калахан має достатньо часу, щоб звернути увагу на те, що відбувається в нашому скромному місті. Виявляється, справи йдуть не так добре, і на Луїзіану насувається чудовисько, з яким нам потрібно швидко впоратися, якщо ми не хочемо опинитись у справжній війні. Сподіваємося, що шеф готовий до цього завдання."
tpm_elders_treachery: "Зрада старійшин"
tpm_elders_treachery_desc: "Цей іржавий щур Руск! Ми сподівалися, що зможемо укласти якусь угоду з ним та його некомпетентним братерством, але він напав на нас, коли ми до нього спинилися! Ну, ми не єдині хлопці на цьому південному кутку, які можуть завдати серйозного удару, і, чувак, якщо Руск не той, хто заслуговує на хороший удар прямо зараз, я не знаю, хто тоді."
tpm_i_love_this_focus_name: "Це безглуздя"
tpm_i_love_this_focus_name_desc: "Чувак, хто тут справді хоче війни з Техасом? Що вони нам зробили, і що ми їм зробили? Все, чого вони хочуть, це забрати наше майно, і це робить їх не кращими за бандитів. Нам знадобиться трохи часу, щоб підготувати наших хлопців до боротьби з їх бронею. Давайте просто збудуємо кілька барикад і подивимось, чи зможемо ми тримати те, що у нас є, поки не спробуємо щось витонченіше."
tpm_obvious_tactic: "Очевидна тактика"
tpm_obvious_tactic_desc: "Братерство з Далласа, здається, має одну спільну рису — кожен з них або носить броню, або має поруч із собою хлопця в броні. Неприємно, що ця броня імунна до більшості наших стрілецьких засобів, і подвійно неприємно, що більшість наших гармат — це малокаліберні. Може, ми могли б отримати більші гармати, щоб пробити їх до решти? Динаміт Денні нас забезпечить, але за ціною."
tpm_ALL_YOU_HAD_TO_DO: "Чорт, ми герої!" #WAS FOLLOW THE DAMN TRAIN
tpm_ALL_YOU_HAD_TO_DO_desc: "Руск вже деякий час біля наших воріт, але ми показали, що не боїмося його та його металевих бандитів. Але, якщо чесно, було б дуже складно забрати Даллас з-під них. Можливо, шеф може спробувати поговорити з ними ще раз, тепер, коли ми забезпечили достатньо часу, щоб вони могли подумати?"
tpm_the_dallas_meetup: "Поїздка до Далласа" #in and out am i right
tpm_the_dallas_meetup_desc: "Калахан вирішив особисто відправитися в старе місто Даллас. Він повернеться через кілька днів, але фактично він поїде поговорити з тим Руском, який розпочав війну в Техасі і тепер починає дивитись у наш бік. Сподіваємось, що його можна буде переконати зробити нас молодшими партнерами в його зростаючій сфері впливу, але якщо ні, можливо, у нас буде бій."
tpm_proving_worth: "Доказ нашої вартості"
tpm_proving_worth_desc: "Ну, ми точно ухилились від кулі з цим. Братерство вирішило дати нам шанс бути друзями на деякий час, і здається правильним показати, що ми достойні того, щоб нас називали друзями в їхніх очах. Дивіться: давайте зберемо наші патрулі і кілька їхніх лицарів та проведемо пікнік чи щось таке! Потім ми можемо провести спільні патрулі, як бонус. Звучить як чудовий час для всіх."
tpm_armored_scouts: "Броньовані розвідники?"
tpm_armored_scouts_desc: "Чувак, ця броня, яку має Братерство, досить класна. Одна річ, яку Калахан запитав після того, як він і Руск домовились, — це отримати для наших хлопців таку броню. Руск сказав, що його, ймовірно, застрелять на місці, якщо він дасть нам креслення, не познайомившись з нами краще, але він підкинув нам деякі документи, які мають допомогти нам розпочати створення більш сучасної броні."
tpm_howdy_pardner: "Партнери та друзі"
tpm_howdy_pardner_desc: "Економічний союз зараз складається з кількох груп, але три основні — це Даллас, Лоун Стар та Остін. Ми почали отримувати багато туристів з кожного з них, і деякі з наших хлопців вже починають формувати свою думку про ці міста, виходячи з того, кого вони нам надсилають. Весело!"
tpm_saints_and_sinners: "Мир у болотах"
tpm_saints_and_sinners_desc: "Що ж, слава Богу, що це все закінчилося. Яка жахлива ситуація. Техас більше не буде загрожувати Лафайєту, і ми лише вразили Голіафа каменем прямо в лоб. Ось для чого ми патрулюємо — щоб тримати наш дім у безпеці, і щоб ми могли продовжувати патрулювати, поки сонце не перестане світити!"
tpm_blackhat: "Надягаючи чорний капелюх"
tpm_blackhat_desc: "Одна з давніх традицій шефів Патруля протягом останнього століття — коли справи виходили з-під контролю, вони знімали свої звичайні сині капелюхи і надягали великий чорний диск. Калахан тільки що вийняв старий капелюх свого прадіда і робить великий галас про те, наскільки неправильно щось відбувається з доходами патруля. Ми що, банкіри?"
tpm_determined_defenders: "Рішучі захисники"
tpm_determined_defenders_desc: "Хантсвілл — це приємне містечко трохи на схід від Остіну. Калахан отримав повідомлення, що банда мутантів-рейдерів влаштовує хаос, і Братерство занадто зайняте, щоб з цим розібратися. Шеф зібрав три патрулі і поїхав прямо в це місце. Ми майже впевнені, що всіх їх знищили, але кілька наших хлопців загинули в процесі. Ще кілька покинули службу після того, як побачили, як гнівно шеф може реагувати, коли кадети не виконують свою роботу."
tpm_steelhand_siege: "Облога Сталевої Руки"
tpm_steelhand_siege_desc: "Слаппі Сталеві Руки — одне з найбільших імен бандитів у Блафі. Якось він зміг ухилитись від наших патрулів міста протягом десятиліть, правлячи Блафом як своєю маленькою вотчиною. Але Калахан нарешті прив’язав цього виродка до бетонної стіни минулої ночі. Після цілої ночі облоги ми змогли прибрати короля бандитів. Це маленька перемога для закону та порядку, яка була дуже потрібна прямо зараз."
tpm_gunslingers_galore: "Гунслінгери повсюди"
tpm_gunslingers_galore_desc: "Це і проблема, і благословення, що Техас був заповнений братством законослухняних людей до того, як ми приєдналися. Позитиви? Добре спорядження та хороше навчання, готове до використання в будь-який момент. Негативи? Вони – купа хуліганів без самоконтролю та поваги. Чимало техаських законослухняних людей забрели на нашу територію і загинули в дурних дуелях через нічого."
tpm_texan_attitude: "Техаське ставлення"
tpm_texan_attitude_desc: "Гранбері – ще одне маленьке містечко на захід від Форт-Ворта. Нічого особливого. Принаймні, до того часу, як Калехан випадково опинився в місті з патрулем під час банківського пограбування. Патруль кинувся в бій і потрапив у засідку. Погані хлопці перестріляли кілька десятків наших хлопців, перш ніж ми здобули перевагу. В кінцевому підсумку ми врятували день і тепер будемо використовувати деяке їхнє спорядження."
tpm_dismay_in_dallas: "Розчарування в Далласі"
tpm_dismay_in_dallas_desc: "Не зовсім правильно описати, яким великим є Даллас. Забуваєш, що є ще інші місця, з усіма цими бетонними джунглями. Місцеві не дуже нас люблять, але насправді ми не набагато відрізняємось від Братства, тому Калехан намагається поговорити з кількома важливими людьми, щоб заспокоїти ситуацію. Тримаємо пальці схрещеними..."
tpm_cho_bang_stinks: "Цинізм у Лоун Стар"
tpm_cho_bang_stinks_desc: "Лоун Стар – це одне з тих міст, яким нічого не важливо, окрім грошей. Вони злі, що ми забрали їхнє місто, зрозуміло — хто б не був, якби це було Лафайєт, але поки вони багаті, їх насправді нічого не хвилює. Давайте трохи додамо капсул до правильних кишень, і, можливо, це зменшить їхні більше неприємні звуки."
tpm_rusks_request: "Запит Руска"
tpm_rusks_request_desc: "Старий старійшина Руск нещодавно був помічений у Лафайєті. Ніхто точно не знає, чого він тут шукає, але його візит трохи дивно збігся з кількома доповідями з Далласа про те, як деякі з наших хлопців спричинили проблеми. Сподіваємось, що те, про що вони хочуть поговорити, не зашкодить нашим хлопцям."
tpm_open_for_business: "Відкрито для бізнесу"
tpm_open_for_business_desc: "Тепер, коли все трохи заспокоїлось, давайте використаємо цей час, щоб насправді запустити машини Каннери. Адже хто в Техасі не хоче свіжої риби прямо з узбережжя? Почекай, що значить це 110° навіть вночі в Далласі?"
tpm_iron_exodus: "Залізний екзодус"
tpm_iron_exodus_desc: "Оскільки Братство почало покидати Техас, кілька наших хлопців, які прийшли сюди з Братства, вирішили, що настав час вкорінитися назад на заході. Гарного від’їзду, як ми вважаємо — половина з тих хлопців, ймовірно, були бандитами, а інша половина — просто техноглупці, які не могли б витримати патруль без своїх улюблених кондиціонерів."
tpm_texan_roulette: "Ніхто не збирається пошкодити мій дім"
tpm_texan_roulette_desc: "Тепер, коли все сказано і зроблено, начальник патруля Калехан нарешті має трохи часу, щоб відпочити і подумати про те, що буде далі. Історія не є чимось, чого слід зневажати: хабарі на рекордно низькому рівні, більшість наших хлопців пишаються тим, що служать, і багато з них більше не бояться смерті. Якщо це означає поставити свої тіла між бандитами і братами? Це досить хороший спосіб піти."
tpm_desperados_wargoal: "Загроза Шривпорту"
tpm_desperados_wargoal_desc: "Тепер, коли з Техасом все вирішено, є кілька покидьків у Шривпорті, з якими ми маємо старі рахунки. Вони не зовсім такі погані, як Гатори з Александрії, але у них є справжні гулючі мотоциклісти, яких ми плануємо знищити за допомогу Мау Гаторів у ’43. Збираймо законослухняних і давайте покажемо цим бандитам, з ким вони мають справу!"
tpm_the_goodies: "Добряча гараж"
tpm_the_goodies_desc: "Тепер, коли Десперадоси трохи знижені, давайте швидко оглянемо Шривпорт і подивимося, що ми можемо знайти. Тут багато будівель, що нагадують старі фабрики, і це місце або не було належним чином знищено, або вони зробили гарну роботу з прихованням слідів. Можливо, ми зможемо знову запустити деякі з цих машин...?"
tpm_ghoulish_mechanics: "Гулущі механіки"
tpm_ghoulish_mechanics_desc: "Хоча хлопцям не дуже спокійно знати, що начальник дав кілька бандитів пряму амністію, ніхто не розмовляє погано про механіків Шривпорту чи мотоцикли, які вони роблять. Ми не зовсім впевнені, наскільки корисними будуть законослухняні на мотоциклах порівняно з тим, що ми зазвичай маємо, але, хе, деякі з цих речей дійсно приємно їздити, і вони мурчать, як кошенята мамочки."
tpm_this_is_a_reservation_focus_name_lmao: "Мить на самоті в тіні"  #можна будь ласка змінити назву цього фокусу, вона мене дратує
tpm_this_is_a_reservation_focus_name_lmao_desc: "Тепер, коли патруль має трохи часу для себе, начальник відправив наказ допомогти з будівельними роботами на деякий час. Нічого особливого, часом патрулю потрібно побудувати табір або барикаду, чи щось подібне, як частина патрулювання. Все ж таки приємно робити щось трохи більш постійне, ніж просто хатинка на дереві посеред порожнього лісу." #я серйозно, і я знаю, що це дрібниця, але вона мене реально дратує
tpm_big_iron: "Гігантська маса заліза"
tpm_big_iron_desc: "Кілька тижнів тому велика баржа викинулася на мілину біля Каннери! Вона була покинута досить швидко, коли один з наших патрулів почав стріляти в повітря, і її екіпаж втік через борт, попливши до маленького човна, який майорів чорним прапором, тому для нас це корабель, на який можна полювати. Але, мабуть, варто щось вирішити, поки бандити не вирішили повернутися."
tpm_keats_clams: "Ідеї Остіну" #Keats’ clams, якби тільки можна було використовувати граматику в ID :pensive:
tpm_keats_clams_desc: "Багато людей в Остіні люблять говорити про політику, і Лафайєт був здивований тим, наскільки зацікавлені люди та мутанти старої техаської столиці в ідеях високого управління. Калехан в захваті — здається, він давно сподівався, що місцеві почнуть цікавитись чимось більшим за себе, і він сподівається, що скоро тут з’явиться місцева політична сцена. Більшість хлопців не розуміють його."
tpm_bangs_investments: "Інвестиції Лоун Стар"
tpm_bangs_investments_desc: "У Лоун Стар, здається, нескінченний потік грошей. Незважаючи на те, що Калехан неодноразово дякує їм і наполягає, що нам насправді не потрібні їхні гроші, вони все одно продовжують надсилати нові каравани з товарами, які нам не потрібні, сподіваючись на прибуток. Рідко коли вони отримують вигоду, але каравани все одно продовжують прибувати. Економіка не має логіки."
tpm_brotherhood_no_more: "Братство більше не існує"
tpm_brotherhood_no_more_desc: "Після того, як ми приєдналися до Братства, кілька нових авантюристів з їхнього старого ордену лицарів вирушили на схід шукати більше пригод. Хто б ми були, якби відмовили хорошим патрульним просто тому, що у них є залізний минуле? Ні, вони всі чудові хлопці, і будуть ще кращими, коли їм доведеться вчитися виживати в патрулі без своїх дорогих гаджетів."
tpm_made_me_pay_taxes: "Час сплати податків :)"
tpm_made_me_pay_taxes_desc: "Однією з великих проблем, з якими Лафайєт зіткнувся останнім часом, є наша система законів. Ми ж законослухняні, правильно? Наша велика робота — патрулювати і слідкувати, щоб закони не ігнорувались. Але за останні кілька десятиліть хоча б начальник патруля вирішував, що насправді є законами Лафайєта, і настав час, щоб Калехан оновив цей безлад. Що він вибере?"
tpm_privateering: "Луїзіанські пірати"
tpm_privateering_desc: "Незалежно від того, чи вони відправляються з Нового Орлеану чи з Гавани, у затоці бродить безліч піратів. Це не зовсім красиво, і хоча деякі більш поважні люди намагались зупинити їх, їм це не вдалося. У нас немає сили, щоб боротися з піратами на їхніх умовах в серці затоки, але давайте заплатимо кільком місцевим морякам, щоб вони патрулювали для нас. Здається, це найменше, що ми можемо зробити."
tpm_codex_of_legends: "Кодекс Легенд"
tpm_codex_of_legends_desc: "Ті великі тюлені з Братства здається, мають центральний кодекс, якого вони повинні дотримуватись понад усе. Щось на зразок їхнього Біблії, тільки це просто нудні правила. Що ж, давайте спробуємо зробити це, але краще. Створимо свій власний Кодекс патрульних і заповнимо його найкращими історіями, які мають наші хлопці!"
tpm_dummy: "Ось як це робиться"
tpm_dummy_desc: "Ті хлопці з Братства нарешті вирішили уважно оглянути нашу групу, і здається, вони вирішили, що ми або безпечні для них, або потенційно корисні. Руск прийшов до нас днями, щоб знову зустрітись з начальником, і цього разу він приніс всі ті розкішні плани, які спочатку просив. І ще ці речі, які називаються «роликові ковзани», вони досить цікаві."
tpm_UNITY_IN_TEXAS: "Техас, єдиний"
tpm_UNITY_IN_TEXAS_desc: "Гляньте-но на це. Погані хлопці з Далласа насправді це зробили. «Техаська Республіка». Хех. Вони тільки напівпатріоти, і вже зробили цю величезну справу легкою. Цікаво, чи можемо ми спробувати зробити щось подібне?"
tpm_research_efforts: "Республіканські дослідження"
tpm_research_efforts_desc: "Тепер, коли Техас об’єднався під тим великим синім прапором, вони достатньо централізували все, що деяким з їхніх кращих людей починає здаватися, що тут занадто тісно для їх смаків. Переважно наукові типи почали відчувати себе обмеженими через те, наскільки формальними стали всі ці процеси. Давайте запросимо кілька з них на схід і відкриємо їм можливість оселитися в Лафайєті — завжди є місце для нових людей!"
tpm_choke_mobsters: "Задушити мафіозі"
tpm_choke_mobsters_desc: "Правильно, Калехан терпів довго, але тепер, коли у нас є Техас, він вирішив, що з мафією Нового Орлеану настав час покінчити. Він склав робочу групу з наших найкращих і найяскравіших, щоб відправити їх у Орлеан і показати цим синам алігаторів, як ми стали сильними на своїх двох ногах за останні кілька років. Корупція закінчена сьогодні."
tpm_ilove_democracy: "Наша власна демократия міської ради"
tpm_ilove_democracy_desc: "Тепер, коли проблема корупції нарешті вирішена і Техас став великим захисником, на якого сподівався начальник, Калехан вирішив, що настав час по-справжньому залучити хороших людей Лафайєта до управління. Це буде важкий старт, оскільки вони зовсім не звикли до будь-якої форми контролю над собою, але кожен повинен почати з чогось. Давайте проведемо вибори мера і подивимось, хто виграє!"
tpm_patrolling_is_service: "Патрулювання - це служба"
tpm_patrolling_is_service_desc: "З того часу, як ми вирішили наші розбіжності з Братством, вони виявилися досить хорошими людьми в душі. Вони відходять від своїх коренів і насправді стають більш місцевими, що є одночасно і полегшенням, і захоплюючим спостереженням. Дивно, але невелика кількість їхніх членів вирішила покинути Братство і вирушити на схід, щоб підписати угоду з нами на периферії їхнього впливу. Ми раді їх прийняти!"
tpm_investment_opportunities: "Можливості для інвестицій"
tpm_investment_opportunities_desc: "Лоун Стар фактично контролює економіку Техасу, при цьому має лише один справжній конкурент у вигляді маєтку Говітцера. Тепер, коли ми приєдналися до політичної сфери Лоун Стар, ми отримали безліч пропозицій від їхніх багатших бізнесменів про розширення діяльності в різних аспектах життя нашого міста. Давайте використаємо ці інвестиції на благо!"
tpm_good_soldiers: "Накази шефа"
tpm_good_soldiers_desc: "Накази прямо від самого начальника патруля—якщо ми побачимо когось, хто виглядає як з Братства і бродить без мети, ми маємо офіційно запросити їх на обід! Можливо, це напівжартівливий наказ, але оскільки він дає хлопцям привід трохи відпочити під час служби, це розпорядження, яке, ймовірно, буде виконано до останнього слова. Давайте зробимо так, щоб ці хлопці почувалися привітно!"
tpm_nobody_needs_to_know: "Ніхто не повинен знати"
tpm_nobody_needs_to_know_desc: "Ходять чутки, що один з наших хлопців застрелив паладина в барі Ефрафа біля нашого кордону з Рокетами. Чому? Він думав, що металевий короб обманув його в покер. Ось і все. Звісно, Калехан викликав цього хлопця на зустріч, і деякі з наших хлопців за лаштунками ставлять ставки, скільки людей вийде з цього кабінету."
tpm_what_it_is: "Що є, то є"
tpm_what_it_is_desc: "Хоча добрі громадяни Лафайєта не надто переживають через те, що ми стали просто пішаками в великій грі Техасу, патрульні не забувають того рівня свободи, який вони мали раніше. Відхід романтики та вільних патрулів, боротьба з бандитами та забезпечення того, щоб закон був на своєму місці в кожному випадку. В кінці кінців, наше майбутнє завжди буде з начальником."
tpm_keats_buddy_pal_chum: "Друзі в зеленому"
tpm_keats_buddy_pal_chum_desc: "Супер-мутанти Остіну довели себе дивовижно щедрими друзями. Більшість наших хлопців ніколи не бачили мутанта, не кажучи вже про боротьбу з ним, але ті, хто вже встиг зустріти мутантів і вижити, не замовкають про свої переживання. Можливо, тепер, коли ми побачили техаських мутантів, ці неприємні стереотипи зникнуть."
tpm_river_patrols: "Річкові патрулі"
tpm_river_patrols_desc: "Лафайєт не зовсім морське місто з моряками, але поступове вплив Остіну змінює нас у цьому напрямку. Якщо у вас є річка поруч, чому б не спробувати життя на відкритому морі? Це набагато вільніше, ніж швидко цивілізуючи техаський ландшафт, до якого нам доводиться звикати, і в затоці є достатньо бандитів, яких можна полювати, якщо нам потрібні пригоди."
tpm_heavier_industry: "Більша індустрія"
tpm_heavier_industry_desc: "Хоча це був досить очевидний наслідок, на той момент, коли ми приєдналися до альянсу Остіну, різко збільшилося число мутантів, які цікавляться, як ми живемо в Луїзіані. Деякі з них вирішили залишитися і стати чесними громадянами Лафайєта, і їхня фізична сила зробила їх відмінними будівельниками. Індустрія процвітає завдяки цим великим хлопцям!"
tpm_railroad: "Залізниця Остін-Каннері"
tpm_railroad_desc: "Одне з небагатьох прохань Остіну стосувалося будівництва нової дороги, що з’єднує Лафайєт і Остін безпосередньо, причому більшість робіт проходить через старі землі Братства. Вони погодилися покрити витрати на проект, але чітко дали зрозуміти, що було б дуже добре, якби ми зробили більше, ніж нам належить. Це цікава ідея, безсумнівно."
tpm_a_day_off: "Вихідний Калехана"
tpm_a_day_off_desc: "Калехан ніколи не ставився до Кітаса так, як деякі інші техаські лідери. Цей хлопець гарний — ніхто цього не заперечує — але Калехан не може повірити, що він дійсно такий добрий на постійній основі. Типу, серйозно, чувак, хіба ти не був солдатом? Як, на боже зелене, ти можеш бути таким наївно добрим до всіх? Нам треба це з’ясувати, якщо ми хочемо продовжувати працювати з ним."
###NEW STUFF
##LEFT
tpm_left_generic_opening: "Те, як вітер дме"
tpm_left_generic_opening_desc: "Ми застрягли між каменем і... ну, ще важчим каменем, насправді. Єдина різниця — калібр. Найкраще зібрати хлопців і вирішити, що робити, щоб не перетворитися на кашу."

tpm_left_offshoot: "Звертатися за допомогою"
tpm_left_offshoot_desc: "Патруль Лафайєта існує вже понад століття — досить довго, щоб вивести кілька жорстких старих хлопців. Можливо, вони занадто старі для того, щоб бути на передовій, але їх розуми гострі, як ніколи. Шеф збирається зателефонувати кільком з цих пенсіонерів у найближчі тижні."

tpm_left_diversifying_patrol: "Диверсифікація патруля"
tpm_left_diversifying_patrol_desc: "Патруль завжди дотримувався того, що працює — даючи найсильнішим та найнадійнішим хлопцям шістнадцятку і сподіваючись на краще. Але коли тактики наших сусідів змінюються, нам доведеться йти в ногу з часом. Цей процес починається з того, щоб додати різноманіття до складу сил."

#OLD IS GOLD
tpm_left_old_is_gold1: "Старе — це золото"
tpm_left_old_is_gold1_desc: "Головний шериф Джордж Сантос і Луїс Флетчер, «Шанка» Лафайєта. Два чоловіки, які не могли бути більш різними, обидва травмовані на полі бою — і обидва хочуть довести свою цінність знову."

tpm_left_old_is_gold2: "Найбільші клієнти Денні"
tpm_left_old_is_gold2_desc: "Динамітний Денні, скоморох з Нового Орлеана, що має бездонну яму постачальників — і, очевидно, ще більш глибоке коло контактів вищого суспільства, оскільки він часто вибирається з неприємних ситуацій з великою посмішкою — або так кажуть його помічники. Попри кілька сумнівів з боку шефа, він завжди йшов на користь нам — час офіційно оформити наші бізнес-відносини."

tpm_left_old_is_gold3: "Використовуйте слова"
tpm_left_old_is_gold3_desc: "Радіо в кінцевому підсумку — це досить простий пристрій — навіть мутант може розібратися з проводкою за тиждень навчання. Нам треба всього кілька!"

tpm_left_old_is_gold4: "Заряджено і готово"
tpm_left_old_is_gold4_desc: "У нас є досвід, обладнання і знання. Тепер просто треба знайти мішень для всього цього, перш ніж який-небудь нетямущий новачок випадково не підірве себе — або, ще гірше, їдальню."

#ROBOTS
tpm_left_robor1: "Незадоволення шефа"
tpm_left_robor1_desc: "Декілька хлопців, що патрулюють уздовж Міссісіпі, повернулися додому з купою металобрухту з покинутого заводу RobCo, що гниє вздовж берегів. Серед них були напівфункціональні купи металу, запрограмовані на бездонну кількість старих законів та директив, що надмірно охоче спілкуються... безупинно... до ранку..."

tpm_left_robor2: "Терпимість шефа"
tpm_left_robor2_desc: "Ці маленькі роботи, також відомі як новий бич існування шефа, здавалося, стали хорошою базою для зворотного інжинірингу деяких досить рідкісних компонентів. За це вони отримали пару місяців відстрочки від терапевтичного побиття."

tpm_left_robor3: "Прийняття шефа"
tpm_left_robor3_desc: "Хлопці зробили приголомшливий прорив, знявши голосові коробки з роботів і зберігши їх на столі шефа як попередження. Як бонус, вони здогадалися про компоненти досить добре, щоб не тільки відтворювати, але й оновлювати функціональність існуючих захисних механізмів. Все добре, що добре закінчується... зрештою."

#CLANKERS
tpm_left_funding_clankers1: "Прикордонне правосуддя на колесах"
tpm_left_funding_clankers1_desc: "Крон «Охолодження» Родрігес — перш за все майстер, по-друге байкер, а тільки потім патрульний. Він виходить на службу, коли хоче, і відвідує зустрічі, може, раз на місяць, щоб поскаржитись на обмеження у постачанні обладнання. І все ж його результати говорять самі за себе. Шеф хоче скористатися цією потенційно великою можливістю, запропонувавши Охолодженню щедре підвищення і бонус з надією формалізувати моторизований підрозділ."

tpm_left_funding_clankers2: "Кленкерні будки"
tpm_left_funding_clankers2_desc: "Як ми можемо здійснювати правосуддя на колесах, якщо у нас немає необхідних ресурсів? Оскільки Мосс-Блафф зараз є сумішшю різних матеріалів, кілька спеціалізованих виробничих потужностей не виглядатимуть занадто дивно."

tpm_left_funding_clankers3: "Здоровий розум"
tpm_left_funding_clankers3_desc: "Завдяки кільком порадами Охолодження щодо економії пального та загального механічного ноу-хау, хлопці в майстернях змогли створити чудеса, використовуючи лише кілька уламків та іржавих інструментів."

tpm_left_funding_clankers4: "Готові до всього"
tpm_left_funding_clankers4_desc: "Зібравши старі синтетичні гумки, знайдені в занедбаному складі Лафайєта, ми змогли посилити покришки деяких важких транспортних засобів, виготовлених за останні кілька місяців. Це хоча б полегшить поїздки по бездоріжжю..."

tpm_left_the_best_little_garage: "Найкраща маленька майстерня"
tpm_left_the_best_little_garage_desc: "Кажуть, що легше стати багатим, коли ти вже багатий. Це логічно як для холодних, важких грошей, так і для вміння. Коли ці потужні машини ревуть через болото, бандити Луїзіани будуть нас бояться."

tpm_left_funding_clankers_offshoot: "Результати"
tpm_left_funding_clankers_offshoot_desc: "Це забрало трохи зусиль, але Охолодження нарешті справився, поділившись вражаюче широкими знаннями з вулиць з рештою хлопців з нещодавно оновленого гаража Лафайєта. Хоча шеф все одно має замислитися, скільки людей приходить більше, щоб послухати про налаштування двигунів, а не просто подивитися на ретельно збережені постери-пінап."

##RIGHT
tpm_right_generic_opening: "Життя в перехідний період"
tpm_right_generic_opening_desc: "У десятиліття після Великої Війни поселення в сонному містечку, де люди займаються своїми справами, було найкращим, на що міг сподіватися середній чоловік. Тепер уже не так. Тепер вам доводиться мати справу з федеральними урядами, організованими арміями фріків і племенами, що спеціалізуються на десятках способів убивати. Або ми знаходимо свій голос, або нас залишать в пилюці."

#OPENING UP LAFAYETTE
tpm_right_oepning_up_lafayette: "Відкриваючи Лафайєт"
tpm_right_oepning_up_lafayette_desc: "Зараз стара Lone Star State — це казан злочинців, сутенерів і бандитів, але також і торговців, бізнесменів та чесних працівників, справжніх американців. Коли все сказано й зроблено, відкрити ворота трошки не може зробити нам більше шкоди, ніж користі, чи не так?"

tpm_right_taking_refuge: "Право на притулок"
tpm_right_taking_refuge_desc: "Навіть з трохи опущеними воротами, вже є ціла купа людей, що чіпляються за них: біженці з заходу та півдня, а також юпіки та лихварі з Х’юстона, які відчувають прибуток. Ми не будемо закривати носа на їхнє наполегливість."

tpm_right_refuge_SUF: "Великі уми думають однаково"
tpm_right_refuge_SUF_desc: "Шеф дуже любить деяких із нових прибульців з Форт-Саммер. Вони справжні круті хлопці, з правильним духом. Вони добре вляжуться — і сподіваємося, що і їхні родичі працездатного віку теж."

tpm_right_refuge_LOS-CBN: "Втрачена Лінкольнова Ліга"
tpm_right_refuge_LOS-CBN_desc: "Дивлячись на Лос і Карбона, ми не можемо скаржитися на те, що нас стискають з усіх боків. Дивні вони, але ми не можемо ігнорувати їх, після того, що сталося з їхніми поселеннями — навіть якщо це означає прийняти деяких, ну, обраних персонажів."

tpm_right_refuge_PEC: "Дім на рівнині"
tpm_right_refuge_PEC_desc: "Сильна, незалежна і вдвічі розумніша, ніж вона могла б бути — Шейла Боулен — це тип шефа. На жаль, пропозиції на побачення довелося відкласти, щоб забезпечити хорошу угоду з ранчо в Пекосі. І все це він зробив, навіть підготувавшись до зустрічі..."

tpm_right_refuge_BOS: "Вони не всі погані"
tpm_right_refuge_BOS_desc: "Незважаючи на те, що ми думаємо про Техаську Братство, одна річ залишається незмінною: ми не дуже любимо їхніх ортодоксів. Одержимі своїми доктринами та виключністю, члени, які прагнуть старих часів, ніколи не зливалися з нами. Але нещодавно кілька з них вирішили втекти, здається, вже втомившись від справ навколо Далласа. Ми впевнені, що вони адаптуються з часом."

tpm_right_refuge_MOB: "Програма захисту свідків"
tpm_right_refuge_MOB_desc: "Навіть з пальцем Руска і його хлопців на пульсі, злочинність продовжує розгукувати по Техасу, свідки боячись за своє життя, ковзаючи в глибини бюрократії ТЕУ. Все, що їм потрібно — це хтось, хто їх буде охороняти, бути тими героями, які їм потрібні — ну, ось ми і є."

tpm_right_refuge_TUB: "Шоу має продовжуватися"
tpm_right_refuge_TUB_desc: "Житло містера Ентертейменту може бути на низькому рівні, але це не означає, що він не має корисності. За роки XVIII станція стала справжнім сховищем старих світових дрібничок, що зберігаються в підземному сховищі, відомому тільки самому DJ. Він радий віддати їх в обмін на притулок для своїх послідовників і більш-менш пристойну квартиру в центрі міста."

tpm_right_refuge_ASS: "Нальотчики обставин"
tpm_right_refuge_ASS_desc: "А, вони не такі вже й погані, коли їм не треба ритися в їжі, щоб вижити. Давайте заберемо ці дивні роликові ковзани і можемо поховати сокиру... хоча трохи волонтерства на стадіоні не завадить громадському духу."

tpm_right_refuge_CAR: "Пекельна кухня"
tpm_right_refuge_CAR_desc: "Карфагенці — досить дивна група. Одна частина — дикі нальотчики, що прагнуть з’їсти своїх товаришів, інша — просто хочуть спокійно готувати барбекю. ’Здається, третя сторона вже позбулася першої, і тепер кілька кухарів бродять по Лафайєту. Хто ми такі, щоб відмовлятися від безкоштовної їжі?"

#ACTUAL INDUSTRY
tpm_right_actual_industry: "Закочуємо рукави"
tpm_right_actual_industry_desc: "Після того, як ми роками перебували під контролем рейдерів та бандитів, не дивно, що Мосс-Блафф залишився глухим кутом серед моря трохи більш доступних смітників. Але ось так — принаймні у нас є чистий аркуш."

tpm_right_research_slot: "Б’ємо головами разом"
tpm_right_research_slot_desc: "Можливо, це не такий уже й глухий кут! На околицях Мосс-Блаффа знайшли старий дослідницький комплекс, який дивним чином залишився непошкодженим рейдерами та кількома поселенцями. Обладнання Старого Світу до черепахи — достатньо, щоб змусити хлопців сісти за деяку невиконану домашню роботу."

tpm_right_hitting_fusion_cores_really_hard: "Дуже сильно б’ємо по ядерних елементах"
tpm_right_hitting_fusion_cores_really_hard_desc: "Завдяки використанню роботизованих заступників до війни, поліція Лафайєта була заповнена ядерними елементами. В ці спокійніші часи і з більше часу на руках, деякі офіцери взялися за інвентаризацію, переробку несправних компонентів і перевірку здоровіших батарей. Наприкінці цього процесу ми отримали дуже хороший врожай."

tpm_right_we_dont_need_all_these_things: "Нам не потрібні всі ці речі"
tpm_right_we_dont_need_all_these_things_desc: "Ну так, ми буквально плаваємо в ядерних елементах, і навіть склад на головному штабі переповнений. Сподіваємося, що ми не будемо озиратися на цю інвестицію зі сльозами на очах, коли настане сезон дощів... а, чорт візьме, інколи тут реально ллє."

tpm_right_bending_the_bluff: "Нахилити Bluff"
tpm_right_bending_the_bluff_desc: "Наприкінці дня їжа — це серце будь-якого суспільства. І щоб це суспільство зростало велике й сильне, його артерії повинні йти в ногу."

tpm_right_unusually_popular_tatos: "Незвично популярні тато"
tpm_right_unusually_popular_tatos_desc: "В більшості випадків люди зазвичай ненавидять тато. Вони часто мають консистенцію цегли і смакують як мокрий, кислотний картон. Єдина причина, чому люди їх вирощують, це те, що вони ростуть майже скрізь і потребують мінімальних зусиль для вирощування. Виявляється, що гарний бік радіоактивної тунці з узбережжя достатньо, щоб зробити їх смачними."

tpm_right_we_are_set: "Чисто та акуратно"
tpm_right_we_are_set_desc: "З потоком енергії, який не припиняється, і врожаями, що тягнуться за горизонт, Лафайєт став справжнім маяком на болотах. Тепер би тільки всі ці величезні молі могли повернутися назад до Нового Орлеана..."

tpm_right_industrya: "Лопата і мрія"
tpm_right_industrya_desc: "Більше грошей означає більше іграшок, більше копання, більше грошей — ви розумієте, куди я веду?"

tpm_right_industryb: "Продовжуємо працювати над цією фермерською справою"
tpm_right_industryb_desc: "Люди Лафайєта дивно добре освоїли цей фермерський бізнес, хоча більшість з них — це просто зборщики і мародери. Чи справді масове вирощування тато — це те, що чекає нас у майбутньому? Господи, допоможи нам усім..."

tpm_right_industryc: "Сильні разом"
tpm_right_industryc_desc: "Лафайєт ніколи не зможе повністю процвітати, якщо навколишні поселення будуть відставати. Шеф вважає, що варто зробити благодійну пожертву."