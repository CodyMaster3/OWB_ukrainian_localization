l_english:
#decisions
  patrol_home_descision: "Патрулювання рідних територій"
  patrol_home_descision_desc: "Немає нічого кращого за гарне патрулювання навколо чудового міста Лафайєт. Патрулі на рідних землях зазвичай — це мирні тренування, але часто вони перетворюються на чудові заняття з командним духом, де йдеться про відкриті багаття вночі, довгі походи вдень з дружніми історіями і піснями, а ще трохи тренувань на місцевих гусках, коли хочеться поїсти... Це стиль життя патрульних Лафайєта, який привертає більшість наших новобранців. І якщо вам подобається природа і ви готові терпіти час від часу біль у ногах, то наш куточок "пустки" — дуже поважне місце, і ми зробимо все, щоб його захистити."
  
  patrol_bayou_decision: "Патрулювання боліт Байю"
  patrol_bayou_decision_desc: "Каннері насправді дуже гарне місце, і шкода, що нам довелося вестити війну, щоб захопити це місце. Це не найкрасивіший куточок бруду на карті, але тут є гарні галявини, вода чиста, а люди майже такі ж добрі і шановані, як і в Лафайєті, лише трохи більш грубі через те, що це портові міста. Патрулювання вод навколо Каннери — це досить проста задача, і буде корисно відправити наших хлопців на воду, щоб вони змогли трохи освіжитися. Деякі з наших хлопців — справжні "сухопутні" люди, але залишки охорони узбережжя Моторів показали нам, наскільки приємний може бути день на спокійних хвилях Мексиканської затоки. Поїхали полювати на піратів!"

  patrol_maw_decision: "Патрулювання джунглів Александрії"
  patrol_maw_decision_desc: "Александрія завжди була хаосом. З самого раннього дитинства Франклін не може згадати час, коли це місто було хоч трохи поважним. Зізнаємось, після того, як ми захопили місто, ми дали всі сили, щоб перетворити це сміттєзвалище на місто-сестру Лафайєту, але наші зусилля... були м’яко кажучи, недостатньо успішними. Бандити все ще бродять вулицями вночі, діти фактично ведуть себе як дикі тварини, а стабільних сімей, які утримують усе місто, можна порахувати на пальцях, як у Лафайєті. Але попри проблеми, Александрія тепер під нашим патрулем, і наше завдання — підтримувати мир і правопорядок там, де ми патрулюємо. Александрія, на жаль, не буде винятком."

  patrol_trade_rivers_decision: "Патрулювання торгових річок Міссісіпі"
  patrol_trade_rivers_decision_desc: "Один з плюсів наявності легкого доступу до річок — це те, що багато торгівлі йде вниз і вгору по Міссісіпі та його притоках. Відправити кілька патрульних катерів для захисту торговельних суден — завжди вигідна справа, оскільки ми майже напевно перешкодимо черговому річковому пограбуванню, а також набагато простіше отримати мінімальний платіж від тільки-но врятованого товариша-торговця, ніж захоплювати його судно та екіпаж повністю. Крім того, це дасть нашим хлопцям можливість попрактикуватися на воді, що стане корисним, якщо ми згодом будемо воювати на річках."

  hunt_bluff_bandits_decision: "Полювання на бандитів з Мос-Блаффа"
  hunt_bluff_bandits_decision_desc: "Мос-Блафф — гарне місто з чудовими людьми, але ми б збрехали, якби сказали, що ліси навколо нього не є найбільшим бандитським гніздом цього боку Міссісіпі. Кримінальні елементи з усіх куточків приходять сюди, аби зробити схованки в цих лісах, прекрасно знаючи про загрозу з боку патруля, але водночас і не розуміючи, скільки з них ми виявляємо, незважаючи на їхню переоцінку власних сил. Час від часу ми мусимо спускатися туди і проводити рейди, щоб не дати бандитам контролювати ситуацію. Ну, що ж, саме час."

  patrol_overlord_territory: "Патрулювання земель нашого сюзерена"
  patrol_overlord_territory_desc: "Хоча це й не найкраща ситуація мати більшого начальника, ніж керівник патруля, завжди є один трюк, який ми можемо використати — це просто вирушити на патрулювання. Ми не зможемо це робити надто часто, але як політичний хід, взяти на себе частину патрульних обов’язків нашого сюзерена, які він залишив без уваги, може бути хорошим способом заробити трохи простору для автономії. Поїхали до них і покажемо їхнім людям, як неефективна їхня армія, виконуючи їхню роботу за них і тим самим підкреслюючи ефективність нашого патруля."

  form_eleventh_patrol: "Відновлення 10-го патруля"
  form_eleventh_patrol_desc: "Будемо чесними — нинішня Громадська Рада зовсім не здатна керувати Лафайєтом. Звісно, члени ради кожен знає свою справу, але в цьому місті немає жодного чоловіка, який би володів лідерськими якостями, якщо він вже не був у складі патрульних, і саме вони вміють ухвалювати складні рішення, яких цивільна частина навіть не намагалася освоїти. Можна, мм... Можна просто знову покликати Каллахана, він хороший хлопець і хоча б розуміється на тому, що робити в нашій нинішній заплутаній ситуації."

  tpm_just_another_patrol_category: "Просто ще одне патрулювання"
  tpm_just_another_patrol_category_desc: "Від центру Лафайєта до самотнього бару Ефрафа на нашому західному кордоні з Рокетами, кожен на нашій території знає одне — якщо потрапив у біду, просто поклич на допомогу, і допомогу отримаєш від Золотих і Синіх. Звісно, зараз не все так, як було раніше, але патрулі продовжують виходити регулярно, і правопорядок намагаються підтримувати Лузіанські Законники, щоб бандити і мафіозі не взяли під контроль землі навколо чудового міста Лафайєт. Це не ідеальна система, але це те, що ми маємо, і ми робимо все можливе, щоб захистити наші домівки."
