tpm_pride_of_fleet: "Ми відремонтуємо бойову баржу, і чому б нам не зробити її гордістю нашого нового флоту!"

tpm_new_fleet: "Створює новий офіційний флот Патрульних"

tpm_new_fleet_flavor: "§g«Пливемо в Ітцу!»§!"

TPM_austin_cannery_line_bigmoney: "§gІнфраструктура вздовж залізниці Остін-Каннері збільшиться на 3§!"

TPM_austin_cannery_line_HAHA_POOR_ASS: "§gІнфраструктура вздовж залізниці Остін-Каннері збільшиться на 1§!"

TPM_decisions_tt: "§gВідкриває нові рішення§!"

tpm_post_launch_tooltip_tt: "§gЯкщо Техаське Братство вирішить атакувати нас з якоїсь причини, ми трохи почекаємо, а потім надішлемо пропозицію перемир’я. Це все ще буде дорогим перемир’ям, якщо вони погодяться, але, принаймні, це краще, ніж жахлива війна, яку призведе конфлікт з Техасом.§!"

tpm_no_generals_for_you_ed_boy_tt: "§RНе можна наймати чи просувати генералів за замовчуванням.§!\n§GАктивні радники стануть генералами.§!"

tpm_franklin_dash: "§g- Патрульний лідер Франклін§!"

tpm_THETOAST: "§M«Тост за тебе, з чудовим святом народження!»§! §gчитав спереду. Його приєднала справжня смішна редакція з фото шматка тосту з очима і посмішкою. Каллахан трохи посміхнувся, почавши трошки сумувати. Він перевернув картку; нічого особливого на звороті, окрім різноманітної інформації про авторські права та товарні знаки видавця картки.§!"

tpm_yummy_smore: "§gВін на хвилину зупинився, щоб перевести подих і з’їв смачний смор, який йому хтось передав.§!"

tpm_callahan_stargazing: "§gВін зупинився і показав на Каллахана, який на мить припинив спостерігати за зірками, підняв голову і віддав поважний жест.§!"

tpm_solem_recognition: "§gКаллахан оглянувся. Декілька старих патрульних сумно кивали головами. Новіші члени уважно слухали.§!"

tpm_fixing: "§gТак багато треба відремонтувати...§!"

tpm_take_us_to_your_beer: "§g«Ти не уявляєш,» — сказав він, зробивши довгий ковток.§!"

tpm_danny: "§gДенні нарешті підняв голову з-за прилавка, демонструючи старовинний револьвер.§!"

tpm_stagefright: "§gВін освіжив три основні пункти для розмови і поклав це назад.§!"

tpm_question: "§g«Привіт, Каллахан. Можна запитати, як ти отримав цей номер?»§!"

tpm_unlucky: "§g«Мені просто не щастить.»§!"

tpm_bayou: "§g«Чесно, як моя мертва дружина,» — сказав Шип-Брейкер. Він підняв руки в знак жартівливого здачі.§!"

tpm_franklin: "§g«Це, ймовірно, не секрет для мене, з огляду на мій вік. Але давай, давай.»§!"

tpm_drunkard: "§gІ з цим патрульний лідер Мак Маккінлі впав з крісла і шмякнувся обличчям на дерев’яну підлогу бару. Кожен чоловік за столом розсміявся голосно, і практично весь бар помітив, що сталося, і приєднався до сміху.§!"

tpm_best_friend: "§g«Привіт, Саллі.» Він простягнув руку через ліжко на кілька футів і включив невеликий верхній світильник. Саллі, старий кіт начальника, наблизився до ліжка і сів перед обличчям начальника.§!"

tpm_roadtrip: "§gВісім годин, одна пробита шина, одна інтервенція від рейдерів з проїзду та дві зупинки в дорозі — і Каллахан припаркував джип свого батька перед Ратушею в Далласі.§!"

tpm_cassette: "§gВін вагався натискати кнопку відтворення, коли помітив, скільки пилу накопичилося на поверхні плеєра, але він знизав плечима і все одно натиснув її. Потім він повернувся до свого столу і сів, відкривши транскрипт перед собою, поки касета програвала в іншому кінці кімнати.§!"

tpm_pause: "§gВін зупинився.§!"

tpm_jim_tt: "§g«Гаразд, Шериф Слінк, можеш пояснити, що відбувається?»§!"

tpm_close_but_no_cigar: "§gВін підняв свою сигару і подивився на неї з розчаруванням. Він витер її об попільничку і залишив там.§!"

tpm_bump_trade_law: "§gЦе збільшить рівень нашого торгового законодавства на один рівень.§!"

tpm_cnc_buff: "§gЦе ще більше підвищить організацію роботів CnC на 10.§!"

tpm_big_money_focus: "§gЯкщо ми є в Техаському Економічному Союзі, це додасть 2 цивільні фабрики та арсенали на кожну основну столицю. Якщо ні, кожне велике місто, яке ми контролюємо в Луїзіані, отримає по одному з кожного.§!"

tpm_danny_company: "§gПідписавши контракт і потиснувши руку, Начальник і Денні офіційно домовились про постачання для Патрульних.§!"

tpm_danny_company_unlocked: "§HDynamite Danny’s тепер доступна як велика компанія!§!"

TPM_danny_connections: "§gЯк маленький подарунок, §HDanny§! буде надавати нам безкоштовний запас §HDynamite§! щомісяця!§!"

tpm_bloody_mess: "§g§HКаллахан, Франклін, Джордж, §gі§! Шанк§! отримають Trait «Кривава безлад»§!"

tpm_unlock_motorization: "§gВідкриває наступну ще не досліджену технологію моторизації§!"

tpm_lock_branch: "§OЦе завадить нам обрати іншу гілку фокусу, поки ми не завершимо цю.§!"

tpm_more_generals: "§gЦе дасть нам §H4§! нових генералів з різними навичками§!"

tpm_will_not_be_recruited_tt: "§tЦей радник наразі не є формальним членом патруля, тому він НЕ буде набраний, навіть якщо буде активним.§!"

tpm_recruited_as_commander_tt: "§gЦей радник буде набраний як §YКомандувач корпусом§! якщо буде найнятий.§!"

tpm_recruited_as_marshal_tt: "§gЦей радник буде набраний як §HПольовий маршал§! якщо буде найнятий.§!"

tpm_recruited_as_naval_tt: "§gЦей радник буде набраний як §yКомандувач ВМС§! якщо буде найнятий.§!"

tpm_recruited_always_tt: "§gЦей радник §CЗавжди§! буде набраний, незалежно від того, чи буде він найнятий чи ні.§!"

