TPM_mac_tt: "§OMак знову напився до коми. Хоча, може, похмілля нагадає йому, що в нього є РОБОТА.§!"

TPM_mac_salary_tt: "§OЯ ж казав йому, що відніму тиждень зарплати...§!"

