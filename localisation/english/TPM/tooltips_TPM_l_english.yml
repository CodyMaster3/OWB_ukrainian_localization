tpm_streets_hint: "§gЦе дозволить нам вибрати між підтримкою людей і підтримкою правителя.§!"
tpm_heroes_hint: "§gЦе дозволить нам вибрати між обладнанням для демолітцій та обладнанням для вогневих груп.§!"
tpm_bottom_hint: "§gЦе дозволить вибрати між чотирма різними духами, що впливають на армію.§!"

