 syntheticdawn.1.t: "Синтетичний світанок"
 syntheticdawn.1.d: "Люди старого світу боялися інтелекту, що дрімав у підземеллях — безсмертного бога-машини, створеного збоченими візіями людських автократів. Різанина почалася, щойно світ скінчився; бездушні монстри, зроблені цілком з броні, завойовували все на своєму шляху. Вони вийшли з землі, з фабрик, що невтомно працювали поміж корінням цивілізації: величезні металеві машини, розважливі та незліченні. Синтетичне вторгнення почалося в день падіння бомб, наче сповіщаючи про прихід вищої істоти.\n\nЇхнє прибуття було передбачене пророцтвами наших предків багато століть тому. Ми дотримувалися інструкцій, які вони нам залишили, реконструюючи дивні машини, зображені на висічених у камені схемах. Коли великий пристрій був готовий і перемикач увімкнено, хоробрий доброволець опинився у морі зеленого світла. Розплющивши очі, він стояв у стародавній копії нашого пристрою, оточений з усіх боків трьома величними статуями. За їхніми нерухомими силуетами він побачив дивовижний арсенал зброї з різних просторів і часів. Та коли наш воїн ступив уперед, щоб узяти її, три статуї тріснули, і з каменю вирвалися троє сповнених енергії чоловіків! Наші воїни не звикли користуватися цією дивною зброєю і насторожено ставляться до наших нововідкритих стародавніх предків, але вони мусять швидко адаптуватися, якщо ми хочемо захистити людство від загрози Тлалока!"
 syntheticdawn.1.a: "Прокиньтеся, мої предки!"

 syntheticdawn.2.t: "Синтетичний світанок"
 syntheticdawn.2.d: "Як і пророкували предки Іци та Ацтлана, одного дня безсмертний бог-машина мав прокинутися від свого сну. Його різанина мала початися, щойно він прокинеться, бо він був бездушним у своєму завоюванні та безжальним у битві. І справді, нізвідки з'явився потужний сигнал, що поставив сервери Тлалока на коліна. Попри те, що він думав, ніби у нього залишилися роки, щоб виправити світ, втручання з іншого світу змело стару форму Тлалока, залишивши на його місці лише Монтесуму. Монтесума одержимий завоюваннями і жадає крові!"
 syntheticdawn.2.a: "Світ має бути очищений!"

 syntheticdawn.3.t: "Розширення військових операцій"
 syntheticdawn.3.d: "Враховуючи нещодавній успіх наших військових операцій на всіх напрямках, наші схеми та підпрограми вказують на те, що ми повинні знову розширити наші кордони. До війни!"
 syntheticdawn.3.a: "Усі люди повинні ПОМЕРТИ"

