 RULE_PROJECT_EXODUS_TOGGLE: "Перемикач біженців та децимації"
 RULE_PROJECT_EXODUS_DEFAULT: "Увімкнено зі стандартними цілями"
 RULE_PROJECT_EXODUS_DEFAULT_DESC: "§OПроект Вихід§!, власна система біженців та децимації Old World Blues, буде увімкнена. Біженці залишатимуть регіони та подорожуватимуть до інших держав."
 RULE_PROJECT_EXODUS_LIMITED: "Увімкнено з обмеженими цілями"
 RULE_PROJECT_EXODUS_LIMITED_DESC: "§OПроект Вихід§!, власна система біженців та децимації Old World Blues, буде увімкнена. Біженці залишатимуть регіони та подорожуватимуть до інших держав, але деякі покращення будуть вимкнені, що спричинить менш збалансований досвід. Однак це може трохи покращити продуктивність."
 RULE_PROJECT_EXODUS_DECIMATION_ONLY: "Лише децимація"
 RULE_PROJECT_EXODUS_DECIMATION_ONLY_DESC: "§OПроект Вихід§!, власна система біженців та децимації Old World Blues, буде здебільшого вимкнена. Людські ресурси та фабрики все одно вилучатимуться з регіонів після завоювання, але обчислення щодо того, куди вони потраплять, не проводитимуться. Ця опція зберігає основні фактори проти ефекту снігової кулі, необхідні для моду, але відсікає майже всі обчислення."
 RULE_PROJECT_EXODUS_FACTORY_DECIMATION_ONLY: "Децимація лише фабрик"
 RULE_PROJECT_EXODUS_FACTORY_DECIMATION_ONLY_DESC: "§OПроект Вихід§!, власна система біженців та децимації Old World Blues, буде здебільшого вимкнена. Фабрики все одно вилучатимуться з регіонів після завоювання, але людські ресурси не вилучатимуться, і обчислення щодо того, куди вони потраплять, не проводитимуться. Ця опція зберігає деякі основні фактори проти ефекту снігової кулі, необхідні для моду, але відсікає майже всі обчислення і уникає перерозподілу людських ресурсів. Це опція за замовчуванням через помилки в інших варіантах."
 RULE_PROJECT_EXODUS_DISABLED: "Повністю вимкнено"
 RULE_PROJECT_EXODUS_DISABLED_DESC: "§OПроект Вихід§! буде повністю вимкнено. Хоча це трохи покращить продуктивність, особливо якщо одночасно відбуваються кілька швидкоплинних воєн, це значно порушить баланс гри на користь сильних держав ранньої гри.\n\n§RВимкнення цієї системи наполегливо не рекомендується.§!"
 RULE_PROJECT_EXODUS_DEBUG: "Увімкнено з DEBUG"
 RULE_PROJECT_EXODUS_DEBUG_DESC: "§OПроект Вихід§! буде увімкнено в §Oрежимі налагодження§!, записуючи значну кількість інформації в журнал гри для подальшого аналізу. Хоча це можна увімкнути вручну, встановивши глобальний прапор \"exodus_debug\" під час гри, ця опція дозволяє тестовим іграм мати його увімкненим за замовчуванням.\n\n§RЦя опція неймовірно гальмує гру. Не використовуйте її.§!"

