 timelords.1.t: "Чоловік у синій будці"
 timelords.1.d: "Тупий гул, що ставав дедалі гучнішим, був першою ознакою прибуття Доктора. Повільно, заворожуюче, синя будка з'явилася з повітря, виринаючи з небуття. Вона приземлилася з глухим стуком, що відлунив по всьому Сховищу, сміливо сповіщаючи про свою присутність усім, хто міг чути. За мить з неї вийшов чоловік, поправляючи краватку-метелика. За ним — жінка. Чоловік зупинився, кліпаючи очима, наче звикаючи до тьмяного світла Сховища, перш ніж повільно оглянути місце посадки. Вочевидь спантеличений, він запитав: «Ви часом не знаєте, чи це Креспалліон?». Наглядач Ток не відповів. Натомість Ток повільно потягнувся до своєї зброї, що лежала на столі перед ним. «О, я б на твоєму місці цього не робив», — вигукнув чоловік із будки. «Розумієш, я Доктор. Я Володар Часу. Може, чув про нас?» І справді, Ток чув пророцтва..."
 timelords.1.a: "Він, мабуть, Бог Годинника!"

