l_english:
  PEACE_POPUP_CHECKBOX_TOOLTIP: "§GКлацніть§!, щоб перемикатися між переглядом усіх повідомлень про мир (галочка), лише регіональних (порожньо) або жодних (хрестик)."
  peacemessage_main: "[GetPeaceMessageMain]"
  peacemessage_sub: "[GetPeaceMessageSub]"

  peacemessage_main_default: "§Y[?winning_country.GetNameWithFlag]§! перемагає §Y[?losing_country.GetNameWithFlag]§! у війні."
  peacemessage_main_default_peace: "§Y[?winning_country.GetNameWithFlag]§! підписує мир із §Y[?losing_country.GetNameWithFlag]§!."
  peacemessage_sub_default: "Війна... війна ніколи не змінюється."

  # Фракційні повідомлення (при капітуляції або мирі конкретних країн)
  peacemessage_BOS: "Найдавніші сталеві кайдани нарешті розірвано."
  peacemessage_NCR: "Слабкий, але все ще там. Голос без вогню, без сили. Хворий."
  peacemessage_CES: "Після темряви — світло."
  peacemessage_CLK: "Годинник зупинився, та історія триває."
  peacemessage_MOJ: "Знайти його — не найважче. Найважче — відпустити."
  peacemessage_MOS: "Жахливий механізм було запущено."
  peacemessage_NAV: "Срібло не допомогло відбудувати Дінета."
  peacemessage_NCN: "При ріках Вавилонських, там ми сиділи і плакали, коли згадували Сіон."
  peacemessage_VEG: "Правда в тому, що карти здали нечесно з самого початку."
  peacemessage_LAC: "Veni, Vidi, Vici."
  peacemessage_ACH: "Вона просила підкріплення — але війська так і не прийшли."
  peacemessage_ANO: "Розкол завершено."
  peacemessage_ARB: "Це не було випадковістю."
  peacemessage_ARM: "Блудний син уже не повернеться."
  peacemessage_ARR: "Ти герой... і ти мусиш піти."
  peacemessage_ASF: "Богу немає місця в таких землях."
  peacemessage_ASS: "Дербі скінчилося, дівчата. Збирайте речі та вимітайтеся."
  peacemessage_ATE: "Сліпа Спікерка не змогла провести свій народ у майбутнє."
  peacemessage_ATM: "Другий потоп ще може настати, горе всім нам."
  peacemessage_BAG: "Довга прогулянка нарешті закінчилася."
  peacemessage_BAM: "Рибалки тепер супроводжують свої судна на дно."
  peacemessage_BAT: "Принцу ніколи не втекти від своєї ганьби."
  peacemessage_BDT: "«Танець смерті» в Орегоні добіг очікуваного кінця."
  peacemessage_BEL: "Два століття потому Зимова варта отримує свій спокій."
  peacemessage_BGR: "Революцію не покажуть по телебаченню."
  peacemessage_BLP: "Родина Мойя знову розвіялася за вітром."
  peacemessage_BRA: "Важка та голова, що носить корону."
  peacemessage_BRE: "Сподіваймося, що плоть і сталь будуть рівними перед судом смерті."
  peacemessage_BRK: "Нехай води Канади віднині будуть у безпеці."
  peacemessage_BTH: "Позитивне мислення нічого не варте проти кулі."
  peacemessage_BJB: "Вілла загинув так, як і жив — борючись за свій народ."
  peacemessage_BVC: "Вілла загинув так, як і жив — борючись за свій народ."
  peacemessage_BJS: "Вони проміняли свободу на безпеку — і не отримали ні того, ні іншого."
  peacemessage_CAF: "Кава більше не тече рікою."
  peacemessage_CAR: "Шеф-кухар так і не зібрав усіх навколо, як М’ясник Піт."
  peacemessage_CBN: "Хто міг би зруйнувати улюблений бордель кожного?!"
  peacemessage_CCW: "...і так вони були забуті, як і всі інші, хто наважився ступити в ці землі."
  peacemessage_CHC: "Ви чуєте цей оглушливий звук солодкої тиші?"
  peacemessage_CHE: "Кінець колії."
  peacemessage_CHO: "Хоч вони й пішли, їхні історії залишаться."
  peacemessage_CHR: "Незвичайна наука, звичні наслідки."
  peacemessage_CLJ: "Ніхто не скаже, що вони не пішли з гуркотом."
  peacemessage_CMC: "Останні хайролери залишили залу."
  peacemessage_COW: "Довга боротьба нарешті скінчилася."
  peacemessage_COM: "Старі солдати не помирають — вони просто зникають удалині."
  peacemessage_CPK: "Святий Петре, не клич мене, бо я не можу прийти — я заклав свою душу в заводській лавці."
  peacemessage_CRZ: "Полум’я апокаліпсису спершу завітало до своїх провісників, загасивши їхній запал."
  peacemessage_CWB: "Ненависть до технологій не стала захистом проти їх застосування."
  peacemessage_CYC: "Сталеві коні позначають їхні могили серед продутих вітрами рівнин."
  peacemessage_DAM: "Оахе затихає, і Небраска зітхає з полегшенням."
  peacemessage_DEA: "Бог забув згадати про Святі війни, які вони програли."
  peacemessage_DED: "У тунелях запала тиша, але нічні жахи тривають."
  peacemessage_DES: "Ось у чому річ із Рейнджерами. Неважливо, наскільки важко стає чи скільки з них поляже — вони продовжують битися."
  peacemessage_DIS: "Чи не вчення Рудого Чоловіка звело їх зі шляху?"
  peacemessage_DLN: "Герцог поліг, але Північ пам’ятає його клинок."
  peacemessage_DMM: "Вони поглинули хворобу, і зрештою вона поглинула їх."
  peacemessage_DRA: "Остання завіса падає."
  peacemessage_DRE: "Старий Піт розповів свою останню байку."
  peacemessage_DRY: "Вони могли уникати Темної Матері лише до певного часу."
  peacemessage_DSP: "Дикого приборкала лише неглибока могила."
  peacemessage_DUN: "Майбутнє людства буде не в Кетчі."
  peacemessage_EAG: "Бізнес був збитий прямо в небі."
  peacemessage_EAS: "Коли кришечки — це гроші, броварні довго не живуть."
  peacemessage_EDA: "Вірності, відваги та чесності виявилося замало."
  peacemessage_EDN: "І темрява, і розпад, і Червона Смерть безмежно панували над усім."
  peacemessage_EHT: "Дорога триває без кінця і краю."
  peacemessage_EMB: "Нехай кістки будуть відкинуті вбік."
  peacemessage_EXE: "Ця компанія мала збанкрутувати ще століття тому!"
  peacemessage_FEN: "Є лише один спосіб впоратися зі скаженим вовком."
  peacemessage_FFI: "Маска проти зачіски."
  peacemessage_FIE: "Дія препаратів закінчилася."
  peacemessage_FLA: "Прапор, що вкривав труп Цезаря, поховали разом із Легіоном."
  peacemessage_FOR: "На пустці чесність лише веде до могили."
  peacemessage_FOU: "Ти мусиш обрати сторону — або хтось обере її за тебе."
  peacemessage_FRN: "Окраїна може бути усмирена, але її народ залишається вільним."
  peacemessage_FVR: "Прибуття силової броні нічого не дало."
  peacemessage_GAM: "Щелепи Собека роззявлені, її ікла затупилися, а очі порожні."
  peacemessage_GDH: "Як з’ясувалося, продаж зброї будь-кому і будь-де може вилізти боком. Хто б міг подумати?"
  peacemessage_GIM: "Холодна кузня — це мертва кузня."
  peacemessage_GLC: "Світло Батька згасло — ядерний шепіт замість крику."
  peacemessage_GLW: "Патчесу доведеться шукати нову роботу... знову..."
  peacemessage_GRA: "Загребущим ніколи не було досить, та невдовзі вони зрозуміли, що їм немає чого їсти, крім свинцю."
  peacemessage_GRD: "Хто тепер охороняє південь?"
  peacemessage_GRH: "Рейдери півдня тепер не мають опору, варварство простягається все далі на північ."
  peacemessage_HAI: "Лише цілковита розпуста людини могла зруйнувати те, чого не змогли тисячоліття та ядерне пекло."
  peacemessage_HAN: "Гончі замовкли, поглинуті полум’ям своїх багать."
  peacemessage_HEA: "«Я змагався добрим змагом, свій біг закінчив, віру зберіг». — 2 до Тимофія 4:7"
  peacemessage_HGH: "Тіла лежать невпізнаними у брудних водах Рівнин."
  peacemessage_HRO: "Г’юстоне, у нас проблеми."
  peacemessage_HST: "Мелодія його скрипки переслідує порожні серця Монтани."
  peacemessage_HUA: "Не вперше зрубують високі сосни."
  peacemessage_HVR: "Америка ніколи не була просто місцем."
  peacemessage_HXL: "Америка ніколи не зрозуміє комунізм."
  peacemessage_IMO: "Машини замовкли."
  peacemessage_INR: "Їхнє майбутнє знову в руках порочних."
  peacemessage_IRC: "Нам досить вашого минулого — ми хотіли лише свого майбутнього."
  peacemessage_IRN: "«Залізна ціна» виявилася надто високою."
  peacemessage_JAC: "Вони збагнули, що Невада не менш жорстока, ніж решта пустки."
  peacemessage_KAM: "Божевільний Рейнджер нарешті знайшов спокій."
  peacemessage_KHA: "«І всі, хто чув, мали б побачити їх там,\n\nІ всі мали б вигукнути: Стережіться! Стережіться!»"
  peacemessage_KLA: "...і популяція геконів за ніч зросла втричі."
  peacemessage_LAP: "До її застережень не дослухалися."
  peacemessage_LGS: "Шкура Лиса тепер прикрашає зали Чихуахуа."
  peacemessage_LNS: "Техас висить на волосині."
  peacemessage_LOI: "Їхні серця обливаються кров'ю, їхні душі спочивають із Господом."
  peacemessage_LON: "Нехай кістки будуть відкинуті вбік."
  peacemessage_LUB: "Торгівля ось-ось стане набагато складнішою."
  peacemessage_LUM: "У глибинах Червоної гори Великий Сяючий лежить мертвішим за свої мрії."
  peacemessage_MAX: "Коли побачите красу Мексики — згадайте про його любов."
  peacemessage_MCA: "Нація без душі — це просто територія."
  peacemessage_MDT: "У тих старих коміксах антагоніст завжди програє в кінці."
  peacemessage_MES: "Спадщина опору добігла сумного кінця."
  peacemessage_MET: "Метал не був рішенням. Він ніколи ним не був."
  peacemessage_MJW: "Мир живився лише кулями та гарматами."
  peacemessage_MLP: "Дружба — це магія, авжеж, дідька лисого!"
  peacemessage_MLT: "Туди їм і дорога."
  peacemessage_MLT: "Зламані клешні, розбитий панцир, але приплив ще повернеться."
  peacemessage_MOC: "Коли побачите мерців Мексики — пам’ятайте про його накази."
  peacemessage_MOD: "Їхнього союзу зі шлаками не вистачило, щоб врятуватися від чужих амбіцій."
  peacemessage_MOT: "Обіцянка Кімбола перетворилася на лахміття."
  peacemessage_MRA: "Умиротворення має свою ціну."
  peacemessage_MRR: "Ага. Звісно. Суспільство суворих індивідуалістів раптом зрозуміє, коли треба працювати разом. Так і буде."
  peacemessage_MTM: "Більше жодне поселення не потребує вашої допомоги."
  peacemessage_MNC: "Лицарю відмовили у спокуті."
  peacemessage_MUR: "Розкол завершено."
  peacemessage_MXC: "Бункери зникають під пісками пустелі..."
  peacemessage_MXS: "В’язниці не працювали в старому світі, то чому вони мають працювати зараз?"
  peacemessage_NAT: "Останній рубіж Каліфорнії закрито."
  peacemessage_NEW: "Ворожнеча родин гноїлася до самого гіркого кінця."
  peacemessage_NIT: "Вони не схилили коліна знову, і там, де стояли — там і полегли."
  peacemessage_NOE: "Вони недовго втішалися свободою від Вісімдесятих."
  peacemessage_NPC: "Це було дуже, дуже неслухняно."
  peacemessage_NPE: "Ви вірите в Сенатора Клауса?"
  peacemessage_NUN: "Не сподівайтеся, що вони знову прийдуть на південь."
  peacemessage_OLY: "Новий Безсмертний возсідає на горі."
  peacemessage_OQZ: "Армія Світла більше не марширує."
  peacemessage_ORO: "Легіон залишиться в невіданні щодо її люті."
  peacemessage_OST: "Ангели були безсилі перед жахами людства."
  peacemessage_RRG: "Для тих, хто залишився позаду, слави немає."
  peacemessage_PAC: "Згортайтеся, вечірку закінчено."
  peacemessage_PAL: "Невада спить спокійніше."
  peacemessage_PAR: "Скелю просто змиє водою, нічого більше."
  peacemessage_PAS: "Останнє «йдіть під три чорти» від Фокстрот-Юніформ."
  peacemessage_PEC: "Страхи Боуена були виправдані."
  peacemessage_PER: "Більше не на вершині харчового ланцюга."
  peacemessage_PET: "Фіскальний рік закінчився банкрутством."
  peacemessage_PHR: "Він не збагнув, що моя посмішка була викликана думкою про його спалення."
  peacemessage_PLS: "Одним поганим Легіоном менше."
  peacemessage_PLT: "... Стривайте, ЩО коїлося в Ельфійській долині!?"
  peacemessage_PMR: "Така доля чекає і королів, і королев."
  peacemessage_PNT: "Немонік бачив своє наближення кінця, але був безсилий його зупинити."
  peacemessage_PRO: "Люди-кроти нікуди не зникають, вони лише чекають свого часу."
  peacemessage_PSH: "Помилка: токен не знайдено"
  peacemessage_RAD: "Фатальна виняткова ситуація OE сталася за адресою 0028:C0034B23. Роботу додатка буде припинено."
  peacemessage_RAP: "Їхні мрії про свободу змило течією."
  peacemessage_RCK: "Вторгнення тарганів припинено."
  peacemessage_RES: "Погляньте на мої діяння, о могутні, і впадайте у відчай."
  peacemessage_RHO: "Кайл Крюк був ідіотом."
  peacemessage_RIP: "Кажуть, зовнішність — це половина битви, але виграти половину битви замало."
  peacemessage_RMT: "Предки пишалися б ними, якби тільки вони швидше наступали."
  peacemessage_ROB: " ГРУ ЗАКІНЧЕНО? D: "
  peacemessage_ROS: "Екологи не змогли врятувати старий світ. У новому їм теж не знайшлося місця."
  peacemessage_ROT: "Фанатизм рідко приносить плоди."
  peacemessage_ROT: "Прогноз невтішний."
  peacemessage_RSR: "Сонце зайшло для Легіону, тепер воно заходить для тих, хто вцілів."
  peacemessage_RUB: "Тікати було нікуди."
  peacemessage_SCA: "Брухт однієї людини — це могила іншої."
  peacemessage_SCO: "Вітер змін повіяв у Колорадо."
  peacemessage_SHA: "Аттіс ніколи цього не хотів."
  peacemessage_SHI: "Дракон більше не реве."
  peacemessage_SIE: "ВОНИ ПРИЙШЛИ З-ПІД ЗЕМЛІ!"
  peacemessage_SIE: "Їхня варта закінчена."
  peacemessage_SKY: "Таємниці пустелі залишаться невідомими."
  peacemessage_SLE: "Назад до сну."
  peacemessage_SOK: "Полум’я помсти було надто слабким, щоб витримати шторм."
  peacemessage_SSS: "Мені більше подобається «Вім»."
  peacemessage_STC: "Партія закінчилася."
  peacemessage_TAA: "Вони продали зброю, з якої їх і застрелили."
  peacemessage_TBH: "Їхня сталь не змогла викувати нічого нового."
  peacemessage_TCA: "Хто такий Паладин без мети?"
  peacemessage_TLA: "Коли побачите його дітей — знайте, він дбав про них усіх."
  peacemessage_TLP: "Сили оборони Оклахоми відправлені у відставку."
  peacemessage_TNK: "Можливо, радарна огорожа справді мала їх захистити."
  peacemessage_TON: "Легіон досяг того, чого не змогла ядерна війна."
  peacemessage_TPA: "Нитки долі розірвані."
  peacemessage_TPM: "За закон варто було боротися."
  peacemessage_TRL: "Перший пішов стопами свого Господаря."
  peacemessage_TTM: "Втрачений рай."
  peacemessage_TUB: "На цьому наш ефірний день закінчено. Дякуємо за перегляд."
  peacemessage_TVT: "Шоу закінчено, народ."
  peacemessage_TWO: "Вони так і не змогли перетнути фінішну пряму."
  peacemessage_UMB: "Земля духів поринула в тінь."
  peacemessage_UNB: "«І промовив Кроу: Ніколи більше»"
  peacemessage_UOA: "Єдність розділилася."
  peacemessage_USA: "Вона ніколи не повернеться. Хоч би скільки чорної магії ви використали."
  peacemessage_VIC: "Боже, бережи Королеву, бо більше ніхто не зможе."
  peacemessage_VIP: "Вони відкусили більше, ніж змогли проковтнути."
  peacemessage_VLT: "Краще жити, ніж гнити під землею."
  peacemessage_WBH: "Більше не безсмертний."
  peacemessage_WDN: "Нехай реліквії Старого світу залишаються мертвими."
  peacemessage_WEN: "Уся ця важка праця заради повернення виявилася марною."
  peacemessage_WHT: "Білоногі, вони народилися для війни, вони бігли до неї, спраглі до битви... і померли ситими."
  peacemessage_WPG: "Демократія не мала шансів."
  peacemessage_WYR: "Один чоловік не веде розвідку надр самотужки. Для цього потрібна ціла громада добрих людей."
  peacemessage_YKZ: "Хто живе мечем, від вогнепалу й загине."
  peacemessage_ZAP: "Коли побачите народ Мексики — згадайте про його вогонь."