old_world_ham_2:0 "Наукові Експедиції Старого Світу"
old_world_ham_3:0 "Наукові Одісеї Старого Світу"

toc_prison_labor:0 "В'язнева Праця"

toc_bellingham_prep_1:0 "§MБитва за Беллінгем§! — Готовність: §RНадзвичайно Низька§!"
toc_bellingham_prep_2:0 "§MБитва за Беллінгем§! — Готовність: §OНизька§!"
toc_bellingham_prep_3:0 "§MБитва за Беллінгем§! — Готовність: §YСередня§!"
toc_bellingham_prep_4:0 "§MБитва за Беллінгем§! — Готовність: §GВисока§!"

toc_her_blessings_provide:0 "Воля Креузи"
toc_eyebots:0 "Мережа Захисту Електричного Міста"
toc_ghoulkind1:0 "Притулок для Гулів"
toc_ghoulkind2:0 "Гавань для Гульського Народу"
toc_blackhearts_club:0 "Клуб Чорного Серця"

toc_remembering_wardens:0 "Дерева Північніше Сієтлу"
toc_remembering_wardens_desc:0 "Тіла Вартових роками висіли на стовбурах дерев уздовж кордону Канади й Америки. Віттерборн воює понад два століття, і Вартові не забудуть їхні минулі зіткнення. Повернення до Куверу без підготовки буде самогубством..."

toc_recruiting_drives:0 "Примусовий Призов"
toc_fortitude:0 "Виправний Заклад «Холодняк»"
toc_fortitude_desc:0 "«Холодняк» — це остання зупинка для злочинців у землях Вартових. Величезна система печер, одна з найбільш захищених у північних землях. Відправка туди — це майже гарантована самотня смерть у Завії."

toc_crusaders:0 "Фанатики Вартових"
toc_crusaders_desc:0 "Прибуття Вартових з Небесної Брами стало несподіванкою. Дехто з колишніх Дітей Брами швидко адаптувався... хоч і могли б краще слухати."

toc_remnants_gather:0 "Знайомі Обличчя у Знайомих Місцях"

# decisions

samson_pondering_the_orb:0 "Добрі Діла Сера Самсона Великого"
samson_pondering_the_orb_desc:0 ""
samson_ponders_an_orb:0 "Самсон Роздумує над Кулею..."
samson_infinity_squires:0 "Скликати Пащурів Нескінченності!"
rot_squires_tt:0 "§YПащури Нескінченності§! з'являться в §YУкритті Самсона!§!"

the_last_will_and_testament_of_the_lady_of_the_lake:0 "У Пошуках Авалону"
the_last_will_and_testament_of_the_lake_desc:0 ""

assemble_the_shamans:0 "Зібрати Руноплетів"
assemble_the_shamans_desc:0 "Руноплети довго стояли поряд із Леді, тлумачачи її бачення та допомагаючи Кліру поширювати її волю Каскадією. Зі смертю Леді їхні слова стали важливішими, ніж будь-коли."

listen_to_the_shamans:0 "Прислухатись до Руноплетів"
listen_to_the_shamans_desc:0 "Руноплети стверджують, що ті самі бачення, що мучили Леді, почали душити й їх самих, обертаючи психічні сили проти них. Якщо вони загинуть — ми залишимось без цілі. Ми повинні зробити все можливе, щоб урятувати їх."

gather_the_roundtable:0 "Скликати Клерикат"
gather_the_roundtable_desc:0 "Клерикат повинен возз'єднатись. Галагадрія, Бріґід, Ланцелла, Паламіда — чотири обрані діти Леді не можуть бути роз'єднаними в такі часи. Майбутнє повинне творитися родиною."

study_the_ladys_work:0 "Дослідити Працю Леді"
study_the_ladys_work_desc:0 "Колись Леді Озера була жінкою науки. Її кабінет — це перше місце, куди вона повернулась після здобуття Сховища. Можливо, там є відповіді?"

aquatic_training:0 "Підводна Підготовка"
aquatic_training_desc:0 ""Пам’ятаєте, як ми вперше пили з озера? Згадуйте той біль, і те, як далеко ми прийшли відтоді..." — Галагадрія"

acquire_scuba_gear:0 "Здобути Спорядження для Занурення"
acquire_scuba_gear_desc:0 ""Хто знає, які жахи ховаються в глибинах? Чи вистачить нам хоробрості, чи зламаємось, як і наша Леді колись?" — Паламіда\n\n"Що б не сталося, сестро, ми разом." — Ланцелла"

acquire_submarine:0 "Знайти Засіб для Спуску"
acquire_submarine_desc:0 "Нам потрібен шлях до морського дна. Хоч страх і повзе крізь нас, наче сарана, наш гнів тримає нас на ногах. Галагадрія мовчазна, Ланцелла тримається, Паламіда знову хвора. Але ми не можемо відступити. Ми надто близько..."

befriend_mirelurk_tribals:0 "Подружитись із Племенами Мірлорків"
befriend_mirelurk_tribals_desc:0 "Хоч Плем’я Мірлорків і пало, його залишки все ще намагаються вижити. Можливо, вони зможуть допомогти нам?"

breaching_vault_45:0 "Прорив до Сховища 45"
breaching_vault_45_desc:0 "У безодню ми йдемо..."

listen_to_the_warrior_wives:0 "Прислухатись до Попільних Дружин"
listen_to_the_warrior_wives_desc:0 "Дружини Бріґід завжди дбали про її добробут. Можливо, передача влади Волхвинь їм — найкращий варіант?.."

set_the_trap:0 "Влаштувати Пастку"
set_the_trap_desc:0 "Руноплети — ключ до влади. Ми замкнемо їх у Залах Під Озером, кинувши до них Яо-ґая. Їхні крики стихнуть — з часом..."

taming_behemoths:0 "Приборкання Велетнів"
taming_behemoths_desc:0 "Орегонські Велетні були кошмаром для всіх. Але ми — Волхвині, і ми зламаємо їх чи загинемо, намагаючись."

arrange_for_the_sisters_death:0 "План Падіння Клерикату"
arrange_for_the_sisters_death_desc:0 "Галагадрія, Ланцелла та Паламіда розкидані по Каскадії. Вони скоро повернуться. Ми повинні бути готові знищити їх.\n\nБо нова Леді — лише одна."

become_last_enchantress:0 "Становлення Останньої Чарівниці"
become_last_enchantress_desc:0 "Нарешті. Бріґід — Спадкоємиця. Ніяких скиглень провидців. Ніяких компромісів із мрійниками. Лише вона — остання чарівниця Каскадії."

scour_the_bunker:0 "Обшукати Бункер"
scour_the_bunker_desc:0 "Безсмертний прийшов до Сієтлу за чимось... Чим саме? І головне — чи можемо ми використати це?"

the_iron_maiden:0 "Залізна Діва"
the_iron_maiden_desc:0 "Пристрої тортур та психічного лому. Ось що було приховане в тому бункері. Тепер воно наше. Всі, хто нас зрадив, знайдуть свій кінець у цій Залізній Діві.\n\nНехай живе Остання Чарівниця."

conqueror_of_cascadia:0 "Завоювання Каскадії"
conqueror_of_cascadia_desc:0 "Найсильніша сила півночі — Зламана Узбережжя. Ґвалтівники, грабіжники, виродки. Вони висітимуть на щоглах кораблів, їхні нутрощі стануть мотузками для розп’яття. В Авалоні немає місця для чудовиськ."

#tooltips

women_are_fucking_badass_pog_tt:0 "§g\"Колись лиходії тремтіли переді мною — і знову тремтітимуть, цього разу перед моїм двічі загартованим молотом і вірою, міцнішою за сталь.\" — Архідруїда Бріґід, Убивця Александра Безжального§!"
force_adoption_got_me_like_tt:0 "§g\"Як ти це зробила з моєю рукою? Це через суп?\" — запитала дівчинка дорогою назад.\n\nЛеді лише усміхнулася. \"Це — любов.\"§!"
