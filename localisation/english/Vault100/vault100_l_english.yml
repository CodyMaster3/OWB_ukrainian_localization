rot_the_wishmaidens_gifts:0 "Дарунки Волхвинь"
rot_all_may_serve:0 "Служити Може Кожен"

ROT_sisterhood:0 "Воїтельки Одного Рівня"
ROT_sisterhood_desc:0 "Леді згадувала про групу воїнок на сході — Сестер Сталі. Кажуть, вони близькі за духом... Можливо, ми зможемо знайти спільну мову?"

rot_peacekeepers:0 "Хранительки Миру Її Іменем"

toc_trust_warden_authority:0 "Довіра до Владарювання Вартових"
toc_julius_plan:0 "План Юлія"
toc_grozdan_plan:0 "План Гроздана"

