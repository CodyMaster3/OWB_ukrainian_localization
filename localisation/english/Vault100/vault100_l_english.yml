l_english:
  ##Localization by Team FlowerPower
  ##The localization team for this tree was wild. At first, it was just me-- Violet-- and then when we realized it could use a little more oomph, Lusa and Aider came to back me up with several lovely flavor events. :heart: Some foci were rewritten by them, as well!
  ##Whilst originally Colonel was going to Old Country, we had the idea for the Wardens of the White (who were previously featured as an entirely different faction prior to 4.0) to serve as a supplement to Old Country. I admit I-- Violet-- got quite carried away with some crazy stuff, but I hope if you're reading this that you enjoyed it! :D

vault100_bonus:0 "Бонус досліджень Сховища 100"
vault100_nf:0 "Сховище 100"

# Події

nf_toc.1.t:0 "Експеримент Сховища 100"
nf_toc.1.d:0 "Збудоване під містом Спокан, Сховище 100 стало одним із найбільших проєктів Vault-Tec — його населення складалося з колишніх військових фахівців та найкращих науковців довоєнного світу. Це мало стати капсулою знань та досвіду для майбутніх поколінь пустки.\n\nПоки наукові й медичні команди працювали в лабораторіях, решта — техніки, охоронці, обслуга — займалися більш «земними» справами. Та ніхто з них не знав, що вони стали учасниками жахливого експерименту: розробки програми надсолдата, запропонованої наглядачкою Сховища, німецькою вченою Йоганною Вебер. Вона припустила, що за допомогою радіоактивного випромінювання та імплантацій можна створити ідеального солдата.\n\n...І це спрацювало! Але ненадовго. Чверть мешканців виявила у собі надлюдську силу — зламували шафи одним рухом, лагодили вентиляцію голими руками. Проте незабаром ефекти зникли, а натомість з’явилась безболісна, але моторошна форма гниття.\n\nСховище здригнулося. Коли одні зберігали спокій, начальник охорони Александр Пантелло закликав до повстання. Але вчений на ім’я Гроздан Хайков переконав його відступити. Та всі знали — Александр ще повернеться. Тож у підготовці до цього вони..."
nf_toc.1.a:0 "Перетопили все можливе в зброю та броню."
nf_toc.1.b:0 "Сконцентрувались на стабільності електро- та водопостачання."
nf_toc.1.c:0 "Виробництво — понад усе!"

nf_toc.2.t:0 "Вартові Білини"
nf_toc.2.d:0 "«Вартові Білини» були найближчим до справжньої держави утворенням Півночі — не рахуючи канібалів і рейдерів. Та коли Безсмертний із Братством прийшли, Вартові були вигнані з Сієтлу. Дехто подався на північ — де згодом їхні тіла висіли на деревах. Інші вирушили на південь, до Ані Кестер та її піратської зграї. А третя група — під проводом Юліуса Брандта — знайшла прихисток у Гроздана Хайкова.\n\nГроздан був доброзичливим та розсудливим. Юліус — навпаки. Змучений особистими трагедіями, він не довіряв нікому, і саме це посіяло чимало розбрату в Старій Країні. Та Гроздан вірив, що..."
nf_toc.2.a:0 "Захист Юліуса був необхідним."
nf_toc.2.b:0 "Влада Юліуса була небезпечною."

nf_toc.3.t:0 "Відповідь на Ваші Проблеми"
nf_toc.3.d:0 "Поки Ротпергери грались у чаклунів із «Чарівними 8-кульками» й божевільними армадами, Вартові та мешканці Сховища 100 спільно намагалися наздогнати темпи рейдерів. Юліус і Гроздан зібралися, щоб визначити подальші кроки. Юліус запропонував повномасштабний наступ, аби задушити ворога всередині. Гроздан був проти — він побоювався жертв і хотів зосередитись на обороні. Врешті, обрати можна було лише щось одне..."
nf_toc.3.a:0 "План Юліуса!"
nf_toc.3.b:0 "План Гроздана!"

nf_toc.4.t:0 "Тиха розмова за грою в «Караван»"
nf_toc.4.d:0 "Після перемоги над Ротпергерами Юліус і Гроздан відзначили це по-своєму — грою в «Караван». Юліус завжди програвав, та їм обом подобались ці миті спокою. Але на Юліуса щось тиснуло.\n\n— «Ти напружений», — раптом мовив Гроздан, відкладаючи карти.\n\n— «Так і є», — відповів Юліус.\n\n— «Розповідай.»\n\n— «Треба думати, що далі. Сієтл у руїнах, а люди б’ються за його останки. Ми мусимо бути готові.»\n\n— «Готові?» — підняв брову Гроздан. — «Ми не солдати. Ми боронили дім. Дякую за допомогу, та нам не до експансії.»\n\n— «Це помилка. Якщо ми не підемо — прийдуть до нас. Ми повинні бити першими.»\n\n— «Твоя воля, Юліус. Я допоможу, але це буде помилкою...»\n\nЮліус мовчки зітхнув. Але рішення було ухвалено..."
nf_toc.4.a:0 "Юліус узяв владу у свої руки."
nf_toc.4.b:0 "Юліус поклав зброю й передав повноваження Гроздану."

nf_toc.5.t:0 "Кажу ж вам — усе було б інакше"
nf_toc.5.d:0 "Йоганна була дурним вибором для наглядача, як на мене. Вона завжди переймалась дрібницями: кольором обкладинок книжок чи тим, щоб її кімната пахла певним деревом. Це мене дивувало... Я виріс без дому, тому подібні речі здавались марнотратством.\n\nАле я не тут, щоб обтяжувати вас історією мого дитинства. Всі ми з різного походження, і в Пустці трагедії — річ буденна. Жартую, що якби керував я, все склалося б інакше. Ну, принаймні половину Сховища я б не перетворив на гулів. Звучить непогано для кандидата наглядача, чи не так?\n\n...Та годі. Я жартую. Мабуть."
nf_toc.5.a:0 "Час до роботи."

nf_toc.6.t:0 "Спадок Лев’ячого Серця"
nf_toc.6.d:0 "23 жовтня 2077 року. Ядерна війна застала загін Ліама Гарріса серед крижаного жахіття Каскадії. Вони залишились замкненими, поступово перетворюючись на гулів усередині власної броні. Та навіть коли шкіра тріскалась, а волосся випадало — вони не відступали. Бо світ міг загинути, але не люди. І вони стали цьому доказом.\n\nПісля довгих років блукань, їхні шляхи привели до Спокану, до Гроздана Хайкова. Там Ліам поклявся боронити Стару Країну до останнього подиху. Сьогодні ж Лев’ячі Серця — горді захисники її кордонів."
nf_toc.6.a:0 "Хай Бог береже наших солдатів!"

nf_toc.7.t:0 "Сила в розбіжностях"
nf_toc.7.d:0 "Юліус Брандт та Ліам Гарріс — два титани Старої Країни. Гроздан розумів: обидва мають цінність. Але напруга між Вартовими та Лев’ячими Серцями зростала. І залишатись «нейтральним» вже було неможливо.\n\nЗ одного боку, Вартові мали чисельність, зброю і порядок — жорсткий, але доречний у світі Пустки. Та Юліус принаймні дослухався до порад Гроздана.\n\nЗ іншого — Лев’ячі Серця були символом надії ще з початку. Їх було менше, але вони ставили людей вище за все. Це зворушувало старе серце Гроздана, хоч і здавалося утопічним перед лицем загроз.\n\nГроздан мусив зробити вибір..."
nf_toc.7.a:0 "§MВартові знають краще.§!"
nf_toc.7.b:0 "§YЛев’ячі Серця — справжні герої.§!"

nf_toc.8.t:0 "Мене звати..."
nf_toc.8.d:0 "Місканти — ще нещодавно справжній жах Сієтла. Засновуючи свої «ідеї» на застарілих правилах супермаркетів, вони викликали не стільки страх, як розгубленість. Хоча зараз вони радше виглядають як байка для вечірнього вогнища, лишається цікаво: чому їх так бояться навіть сьогодні? Деякі Вартові досі здригаються, почувши їх ім’я.\n\nЧи ви довірите комусь, чия касова машинка стріляє ціанідом?"
nf_toc.8.a:0 "Колись рейдери принаймні мали фішки..."

nf_toc.9.t:0 "Скільки разів нас вчити, діду?!"
nf_toc.9.d:0 "§MЗ РОБОЧОГО СТОЛУ ЮЛІУСА БРАНДТА§!\n\nДокторе Хайков,\n\nУ нас тут цікавинка для вас. Не здогадаєтесь: той гад підручний Безсмертного — Родрігес, здається? Хоче працювати на нас.\n\nТакий собі поворот, еге ж?"
nf_toc.9.a:0 "...Гм. Може, заслуговує на другий шанс."

nf_toc.10.t:0 "Дзвінок здалеку від Гроздана"
nf_toc.10.d:0 "Гулі з материка зробили неможливе — звільнили Сієтл та його околиці від Братства. Вони закликають нас повернутись до рідних земель і готові допомогти нам у відбудові!"
nf_toc.10.a:0 "Дім, милий дім!"

nf_toc.11.t:0 "Благання старого"
nf_toc.11.d:0 "Стара Країна хоче дозволити племені Олімпу повернутись додому, обмінявшись землями. Приймемо?"
nf_toc.11.a:0 "Це справедливо."
nf_toc.11.b:0 "Це вже наші землі!"

nf_wardens.1.t:0 "Примари минулого!"
nf_wardens.1.d:0 "Вартових Білини, яких вважали знищеними під час окупації Сієтлу Безсмертним, знову видно на горизонті. Після падіння Ротпергерів вони повернулись на повну силу під проводом непохитного Юліуса Брандта. Вже відчутна напруга — вони точно захочуть повернути своє..."
nf_wardens.1.a:0 "Подивимось, як вийде."

nf_wardens.2.t:0 "Моєму другану подобається твій стиль"
nf_wardens.2.d:0 "§BЗВІТ БЕНТЛІ.§!\n\nМи перевірили вцілілий особовий склад Ротпургерів і знайшли кілька кандидатів, яких можна спробувати завербувати. Скажемо прямо — ні один з них не в усіх розумах (чого ми й чекали), але кожен командує чималим загоном залишків, а з технологією Месметрону ми можемо переконати їх у «розумності» співпраці.\n\n§RКандидат №1§! — §tСамсон Великий§!\n\nЦілковито божевільний, але чомусь доброзичливий. Агресію виявляє лише у двох випадках: коли намагаєшся відібрати у нього магічну 8-кульку, або якщо навколо надто багато його людей — тоді його «накриває». Месметрон, принаймні, одну з цих проблем вирішить. Його люди — фанатики, й можуть стати в пригоді у боротьбі за Вашингтон... навіть якщо в них усіх у голові, як у старого іржавого гвинта.\n\n§RКандидат №2§! — §0«Архідруїдка» Бріґід§!\n\nПро Волхвинь завжди пліткували — мовляв, божевільні з фальшивими богами. Але Бріґід — це інше. Вона різник без рівних і командує цілим загоном лицарок-дружин. Величезна, люта, як голодний Яо-Ґай. Так налякала Леонарда, що він обмочив свій бойовий комбінезон. Ну, хіба не любов з першого погляду?"
nf_wardens.2.a:0 "Вірні Самсона."
nf_wardens.2.b:0 "Лицарки Бріґід."

nf_wardens.3.t:0 "Смертна кара"
nf_wardens.3.d:0 "§c«Ми залишаємо тих, хто має значення. Ці покидьки — вже історія. Прибрати їх, знайдемо нових примар для лякання дітей.»§!\n\nТак сказав бригадний генерал Юліус Брандт сьогодні вранці. І ці слова зібрали чотири десятки чоловіків і жінок у головній залі Холодильника. Шістнадцятеро озброєних солдат стояли за в’язнями, націлені чітко і скоординовано. Та коли почалась стрілянина — деякі здригнулись. Крики, тріск масок, судоми — надто багато для новачків. Двоє дезертирували тієї ж ночі.\n\nВід Ротпургерів лишились лише окислені уламки і позолочена маска."
nf_wardens.3.a:0 "А чи був інший вихід?.."

nf_wardens.4.t:0 "З любов’ю, Грейнджер Шторму"
nf_wardens.4.d:0 "Мене звати Аня Кестер. Якщо ти чуєш це — отже вже в курсі: Вартові повернулись, а дрібні рейдери бігають, як ошпарені.\n\nЯ раніше з ними працювала. Знаєш, у чому різниця між ними і тобою, Грейнджер? Ти хочеш влади, грошей? Вони хочуть усе і більше. Думаєш, Братство — найгірше, що було? Принаймні ті дозволяли жити. Вартові хочуть твою землю, хочуть підписів, щоб записати тебе в армію, твоїх дітей — теж. Усе це — фігня, щоб зробити з тебе гвинтик у системі.\n\nТож ось моя пропозиція: дай мені місце за головним столом. Я знаю, як прибрати їх назавжди. Повір, думала про це роками."
nf_wardens.4.a:0 "Вона буде у моїй команді."
nf_wardens_anya_tt:0 "Ви отримаєте Аню Кестер як надзвичайно здібного корпусного командира. Під час кампанії Вартових вона може надати бонуси або додаткові підрозділи!"
nf_wardens.4.b:0 "Хай копають собі могилу."

nf_wardens.5.t:0 "Кінець Зими"
nf_wardens.5.d:0 "Коли дим розвіявся — ніхто не міг повірити очам. Після десятків рейдів, злагоджених дій і військової техніки — він був мертвий. Зимородка прибрали не ракетами, не мінами, не кулеметом, а 13 пострілами з особистого 9мм Юліуса Брандта.\n\nНа честь ворога провели невелику панахиду. Навіть для таких, хто став тобі найбільшим кошмаром — іноді варто вистрелити в небо тричі..."
nf_wardens.5.a:0 "Нехай його душа знайде притулок у Пеклі."

nf_wardens.6.t:0 "Останній бій Ані"
nf_wardens.6.d:0 "Сили Вартових штурмували Пащу. Пірати та злодії падали від вогню і снайперських куль. Метою була одна: Аня Кестер.\n\nЗнайшли її у стічному колекторі. Вона зрозуміла, що Юліус спостерігає за нею — та надто пізно, бо куля вже летіла прямо в чоло."
nf_wardens.6.a:0 "Шкода, звісно..."

nf_wardens.7.t:0 "Та сама історія"
nf_wardens.7.d:0 "Я ніколи не забуду Сієтл.\n\nВісім годин. Вісім, грьобаних, годин — і від держави не лишилось нічого. Понад століття патрулів, стабілізації, постів — і все в огні.\n\nПриниження. І ще більше — болю. Ми втратили багато... Та зберегли головне.\n\nРотпургери були другою загрозою після Безсмертного. Тепер — їх нема. А на заході щось готується.\n\nІ знаєш, що це для мене? Можливість.\n\nЧас дивитись вперед. Час повертатись. Ми повернулись, Вашингтоне. Додому."
nf_wardens.7.a:0 "Час працювати."

nf_wardens.8.t:0 "Звістка з Пащі"
nf_wardens.8.d:0 "До форту Сотня о півночі потрапила голозапис. Юліус вставив його у програвач — і почув знайомий голос. Аня Кестер. Вважали, що вона загинула в Сієтлі. Не всі мають таку вдачу...\n\n«...Брандт. Знаю, ти ще живий, тож скажу прямо: кому ти, біса, потрібен? Знову повернувся зі своїм брудним, псевдо-армійським стадом? От і мій подарунок: застрелься. Візьми пістолет, натисни курок — і дай своїм людям забути, що ми існували. Інакше? Я чекатиму. Порт Паща — не найгірше місце. Тут хоча б рейдери не прикидаються священиками. Колись з’явиться хтось кращий за нас, Брандт. Але не поки ти тут. Я змушу тебе зжерти свою ж брехню. Колишній Вартовий, Аня Кестер. Вимикаюсь.»"
nf_wardens.8.a:0 "Цього Різдва вона не святкуватиме."

nf_rot.1.t:0 "Експеримент в Сховищі 100"
nf_rot.1.d:0 "Побудоване під містом Спокан, Сховище 100 було одним із найбільших об’єктів, створених Vault-Tec. Воно мало прихистити колишніх військових фахівців і кращих довоєнних науковців — справжню капсулу часу досвіду й знань для майбутнього пустки.\n\nПоки науковці та медики працювали у своїх лабораторіях, колишнім військовим дістались робочі посади, що вимагали витривалості та кмітливості — охорона, техобслуговування тощо.\n\nВтім, вони не знали, що Сховище було об’єктом жахливого експерименту: програми створення суперсолдатів, запропонованої його наглядачем — німецькою вченою Йоганною Вебер. Вона висунула гіпотезу, що завдяки імплантам і спеціально модифікованому радіаційному випромінюванню можна перетворити людей на досконалих бійців.\n\n...І це спрацювало! Певний час. Чверть населення помітила нову силу, жартувала з цього і раділа зручностям — від ремонту вентиляцій без інструментів до залякування товаришів. Але згодом дія газу слабшала, і в уражених почали проявлятись дивні, безболісні симптоми — часткове гниття.\n\nСховищем прокотився шок. Комусь було байдуже, але начальник безпеки, Александр Пантелло, спробував підняти заколот. Його зупинив вчений Гроздан Хайков, і Пантелло, нехотячи, залишив Сховище... Але упередження свої — ні."
nf_rot.1.a:0 "Він забрав воду та будматеріали."
nf_rot.1.b:0 "Він забрав найкращу зброю сховища."

nf_rot.2.t:0 "У вигнанні"
nf_rot.2.d:0 "Разом із кількома прибічниками, Александр був вигнаний у пустку. Все, чого вони хотіли — повернутись до затишку Сховища. Їхня злість зростала, доки вони пробирались крізь радіоактивні шторми й холодні сніги.\n\nНапруга між вигнанцями й тими, хто лишився у Сховищі, тільки зростала. Протягом наступних років колись працьовита група перетворилася на дикунів — не кращих за рейдерів, із якими боролись на шляху.\n\nДосягнувши Кер-д'Алена, вони натрапили на бій між двома угрупованнями: франкомовними Теплопийцями та бандою Поганоротів. Обидві сторони боролись за місто, але Александр знав — допомогти можна лише одній..."
nf_rot.2.a:0 "Теплопийцям!"
nf_rot.2.b:0 "Поганоротам!"

nf_rot.3.t:0 "Три Уламки"
nf_rot.3.d:0 "Поповнивши ряди найгіршими з пустки, Ротпурґери зазнали культурного зсуву. Жінок стали сприймати як власність, а не рівних. Це спричинило розкол, і чимало жінок покинули угруповання. Вони знайшли притулок серед Волхвинь — племені, що слідувало загадковій Леді Озера. Під її проводом вони створили дивне, майже релігійне братство й почали практикувати химерні ритуали.\n\nІ тоді з’явився сер Самсон.\n\nНароджений серед Ротпурґерів, худорлявий, сіпливий юнак, що чув голоси, яких не чув ніхто інший. Його терпіли, але не поважали. Ті, хто знущався з нього, почали страждати від дивних «випадковостей» — поки одного ранку в каві не знайшли бойову гранату. Самсона вигнали, сподіваючись, що він зникне назавжди...\n\nТа у мандрах він знайшов... Орб. Чорна куля із символом нескінченності, що відповідала на всі його питання, вгамовувала страхи. Він повернувся впевненим, майже пихатим пророком, назвавши себе провісником нескінченності, а Орб — богом. Згодом навколо нього зібрався культ — Лицарі Нескінченності.\n\nУ Якобії він запропонував план мобілізації проти Сховища — об’єднати Волхвинь, Ротпурґерів і своїх Лицарів в одній святій війні проти Гроздана. Якобія сумнівався, але фанатизм нових прибічників Самсона змусив його звернутись до Волхвинь. Троє зустрілись у Кер-д'Алені — сподіваючись на краще..."
nf_rot.3.a:0 "Обіцянка Самсона привабила нових послідовників."
nf_rot.3.b:0 "Вони звели мури, де ще вчора було поле."

nf_rot.4.t:0 "Хто Б Міг Це Передбачити?"
nf_rot.4.d:0 "Усе було завершено — Стара Країна впала, а Гниль було очищено. Довгі роки життя серед Пурґерів оберталося довкола давньої ненависті та війни, але що тепер? Хисткий союз трьох сил утратив сенс, і всі в Пурґерах відчували подих змін.\n\nБуло скликано раду, щоби лідери могли обговорити майбутнє, хоч напруга в повітрі ясно свідчила, до чого йде справа. Якобія сам обрав місце зустрічі — старий склад, перероблений на подобу ратуші, й потай розмістив у сусідніх будівлях своїх вірних людей. Для «безпеки», звісно. Він очікував, що ці нитючі Волхвині будуть важкими в приборканні. А ось що зробить божевільний Самсон — хто його знає.\n\nНезабаром прибули Волхвині, вбрані в поіржавілу броню та хутра. Креуза побачила прихованих солдатів Якобії на балках і в закутках. Отже, він обрав такий шлях? Як банально. Вона повернулася до нього з незворушним і майже надприродним поглядом. «Якобія», — мовила вона.\n\n«Леді», — осклабився він. «А Самсон де?» Він помітив чисельність її супроводу, та це його не турбувало; вони обидва знали, чим усе скінчиться.\n\n«Хіба я маю знати?» — відповіла вона з хитрим нахилом голови. «Здається, ти ж маєш очі всюди». За її сигналом Волхвині схопилися за зброю.\n\n«Та вже неважливо», — буркнув Якобія, готуючись до бою.\n\nДалеко від місця зустрічі Самсон досі тримав своїх лицарів у режимі очікування. Його містичний Орб сказав, що буде кровопролиття, що союз приречено, і що саме Самсон вийде переможцем із хаосу. Під старим перевернутим човном, вивчаючи знаки, він намагався визначити ідеальний момент для удару...\n\nТа чий же розділ цієї ночі розпочався?"
nf_rot.4.a:0 "Нескінченні Лицарі Самсона!"
nf_rot.4.b:0 "Ротпурґери Якобії!"
nf_rot.4.c:0 "Волхвині Леді!"

nf_rot.5.t:0 "Жінка, Що Прийшла Із Далека"
nf_rot.5.d:0 "Жила-була проста жінка — нащадок мешканців Сховища 100, що вела скромне життя в землях Лісового Рубежу. Та одного дня Інквізитори — рейдери з Пурґерів — спалили її дім за «приховування симпатій до мутантів». Не знаючи, що робити, вона зникла в лісі — несвідомо відповідаючи на загадковий поклик із глибин.\n\nЇї ненависть до Інквізиції затьмарила розум. Спочатку вона крала припаси. Потім — засідки на патрулі, коктейлі Молотова на гарнізони. Здавалося, вона падає в безодню, з якої немає виходу. Але що глибше вона падала, то голос ставав чіткішим — солодкий, але хворобливий. Спершу це звучало як блювота з голосом, як тривожна серенада.\n\nАле чим частіше вона зливалася з природою, тим більше починала розуміти. Ненависть зникла. Більше не було злості — ні на мутантів, ні на Інквізицію, ні на будь-кого. Блукаючи у сумнівах, вона зрештою відкрила серце Діві Бажань — і в тому знайшла своє призначення: берегти живе за будь-яку ціну. Бо знала — прірва ненависті породжує лише зло.\n\nТепер землі Каскадії знають легенду про Бріґід — Волхвиню, відьму-воїтельку з серцем, загартованим у сріблі. Першу й головну захисницю Прекрасної Пані Озера."
nf_rot.5.a:0 "Усі схилилися перед могутністю Бріґід."

nf_rot.6.t:0 "Ротпурґери Якобії!"
nf_rot.6.d:0 "Дурепи-Волхвині гадали, що мають шанс проти його Ротпурґерів? Бій був швидкий — перевага з самого початку була за людьми Якобії, що засіли в засідках. Якобія радів хаосу. Це була його мрія, на яку він чекав роками — можливість розчавити цих нудотних Волхвинь.\n\nКоли все вщухло, у складі запанувала солодка тиша. «Обшукайте трупи й спаліть тіла!» — гаркнув Якобія. Ротпурґери хутко взялися до справи. Він спинився над тілом Леді й плюнув на її сукню. Він зневажав той спокій, що лишався на її обличчі навіть після смерті.\n\nТа Якобії завжди було цікаво, що за личиною в цій жінці. Він зняв її маску — й очі його звузились. «Авжеж, треклята гулька», — пробурмотів він, і ще раз вистрілив їй просто в лоб.\n\n«Бос, вам треба це побачити», — сказав один із Пурґерів. Якобія підвівся й рушив за ним надвір, решта — слідом.\n\nНа узліссі, біля потічка, у своїй чудній позі під перевернутим човном, сидів Самсон і його Нескінченні Лицарі. «...І чи належить це тепер нам?» — голосно запитав Самсон.\n\n«Не розраховуй на це», — показала його чортова куля.\n\n«Що за видовище!» — розсміявся Якобія. «Гей, Самсоне», — махнув він, здіймаючи гвинтівку. «Бувай, Самсоне!»"
nf_rot.6.a:0 "І так закінчилася ця ніч чистим винищенням."

nf_rot.7.t:0 "Волхвині Леді!"
nf_rot.7.d:0 "Волхвині перемогли в короткому, але запеклому бою з Ротпурґерами. Леді стояла спокійно посеред божевілля; кулі, осколки й кров оминали її. Коли ж битва вщухла, вона підійшла до тіла Якобії. Той важко дихав, його маску було зірвано, лице — у судомах.\n\n«...Сука», — прошипів Якобія.\n\nЛеді нахилилася до нього. «Бережи сили», — прошепотіла вона, взявши його за щелепу. «Я визволю тебе». І хоч її хватка була м’якою, Якобія затремтів. Із його очей, носа й вух потекла кров. Вона поклала його назад на землю.\n\n«Збирайте, що можна. І рушаймо», — наказала вона, проходячи повз своїх Волхвинь.\n\n«А що з Самсоном?» — запитала одна з них.\n\n«Знайдемо його, щойно запалимо це вогнище», — відповіла Леді, озираючись. «Для дурнів немає втечі»."
nf_rot.7.a:0 "Місяць радісно світив над Леді."

nf_rot.8.t:0 "Нескінченні Лицарі Самсона!"
nf_rot.8.d:0 "«Запитай пізніше», — сказала Нескінченна Куля. І знову: «Запитай пізніше». І ще раз. Протягом годин, навіть коли з міста долинали вибухи й бойові крики, Куля наполягала на обережності. Самсон тремтів під старим човном.\n\n«О, Божественні, настав час бити ворога?» — знову запитав він. Один із Лицарів несміливо кашлянув. І нарешті, при тьмяному світлі запальнички Vault-Tec, Куля відповіла: «Це рішуче так».\n\nЗ переможним улюлюканням Самсон вискочив із укриття, здійняв угору свою ведмежу пастку-рукавицю й повів Лицарів у бій.\n\nДо їхнього прибуття бій між Волхвинями та людьми Якобії вже скінчився — з обох боків лишилися трупи. Волхвині перемогли, але втратили забагато, щоби чинити гідний опір новим прибульцям. Леді схилилася над смертельно пораненим Якобією, цілком поглинена останніми словами ворога.\n\n«СЛАВА ПЕРЕМОЗІ!» — вигукнув Самсон, врізаючись крізь вікно. Він приземлився, рвонув до Леді з пасткою напоготові. Вона лише зітхнула."
nf_rot.8.a:0 "Мудрість Кулі знову довела свою силу!"

nf_rot.9.t:0 "Дарованому Коневі..."
nf_rot.9.d:0 "Якобія слухав хрускіт снігу під чоботами, піднімаючись на пагорб над долиною. Вони нещодавно встановили старий побитий ГЕКК, відібраний у тих шалених танцюристів. Згідно з розповідями, пристрій мав би перетворити землю на квітучий край. Якобія навіть дозволив собі трохи оптимізму.\n\nАле те, що він побачив на вершині, змусило щелепу впасти. Його охоронці наздогнали його, й реакція була та сама: жах.\n\nТак, тепер там були дерева й кущі замість каміння й снігу. Але кольори — болісні пурпури, химерні червоні — нагадували прокляті ліси, в яких жили Кісткоскакуни до того, як їх спалили. У ніздрі пробивався сморід, схожий на згорілу плоть гуля. Плоди — опухлі, блакитні, покриті наростами. Ягідники — у жовтих і помаранчевих шипах. Лише джерело в центрі цього лісу виглядало бодай трохи нормально.\n\nЯкобія розвернувся та швидко пішов назад — подалі від огидного лісу. І сказав одне:"
nf_rot.9.a:0 "«Спаліть цю, блять, погань!»"

nf_rot.10.t:0 "Нескінченні Лицарі в Нескінченній Броні"
nf_rot.10.d:0 "Безліч величних трофеїв дістались сиру Самсону та його нескінченним Нескінченним Лицарям, але мало що зрівняється з арсеналами силової броні, здобутої у ваґантів Вашингтону. Орб багато днів відкривав таємниці використання та обслуговування цих сталевих гігантів, але, як завжди, його мудрість дала відповіді.\n\nТепер настав час обрати тих, хто достойний носити ці сяючі обладунки. Самсон зібрав своїх найкращих воїнів на велике судилище.\n\nВін ішов повз ряд нетерплячих чемпіонів, зупиняючись перед кожним і урочисто здіймаючи Орб, викрикуючи до небес: «ЧИ ДОСТОЙНИЙ ЦЕЙ ЛИЦАР ШИМЕРНОЇ СТАЛЕВОЇ ОБОЛОНКИ, ЩО БИТИМЕТЬСЯ ПОРУЧ ЗІ МНОЮ ВІЧНО!? ГОВОРІТЬ, БОГИ!»\n\nНатовп вигукнув радісно, коли перший — сер Лукас — голосно прочитав відповідь: «Можеш на це покластися». Самсон стрибав від радості.\n\nТак тривало з кожним наступним. Радість супроводжувала обраних, мовчання — тих, хто почув: «Задайте питання пізніше». А тим, кому випало «перспектива не надто добра», співчутливо плескали по спині.\n\nСонце піднялось у зеніті й почало хилитися — голос Самсона вже охрип. Та коли все було скінчено, перед ним стояли герої, готові битися до нескінченності."
nf_rot.10.a:0 "«ВПЕРЕД, ДО ВІЧНОЇ СЛАВИ!»"

nf_rot.11.t:0 "Не Така Вже Й Божественність"
nf_rot.11.d:0 "Якобія загинув, зціпивши зуби й б'ючись до останнього за свої темні мрії. А Самсон із послідовниками так і не вступили в бій, скувавши себе нерішучістю. Їхній дурнуватий Орб днів зо п’ять не видавав жодних вказівок після «зустрічі», тож Волхвині без особливих зусиль упіймали більшість з них.\n\nСамсон врешті здався — похиливши плечі, з'явився зі свого укриття, коли Леді веліла йому запитати кулю, чи зазнав він поразки. І на кулі виблискував напис: «Без жодного сумніву».\n\nБажаючи публічно зруйнувати його «ауру», Леді скликала сход. Вона почала з того, що розчавила Орб на друзки, показавши свою зневагу. Самсона тримали в кайданах, без маски й обладунків. Коли кулю знищили, він хрипко застогнав. Його колишні послідовники спостерігали мовчки, аж поки на нього не вилили гарячу смолу й не обсипали пір’ям.\n\nКоли його звільнили, Самсон завив та дременув у хащі, божевільно марячи.\n\nЙого лицарі тоді ж зреклися свого «пророка» й приєднались до Волхвинь. Вони прийняли нову віру без опору. А Самсона, колись пророка нескінченності, зрідка бачать блукаючим пусткою, де він шепоче безперервні питання, на які немає відповідей."
nf_rot.11.a:0 "Ось і пішов наш герой... Жартую."

nf_rot.12.t:0 "На Голці"
nf_rot.12.d:0 "Самсон рідко згадував минуле — голоси богів заповнювали його розум наказами про майбутнє. Та коли він стояв перед великою вежею, що здіймалася до самих небес, на фоні руїн зруйнованого Сіетлу — на мить його свідомість прояснилася. Він згадав, яким було життя лише кілька років тому: побитий пес Ротпурґерів, самотній блукач, і нарешті — обранець Нескінченного Орба, що провадив його крізь битви та хаос.\n\nСльози вдячності текли під його маскою. Якби не Нескінченний Розум, він би й не знав, із чого почати. Його лицарі чекали ззаду, не сміючи порушити цю мить прозріння. І коли вона минула, Самсон стиснув Орб і прошепотів: «Ми вдома?». Відповідь була короткою: «Так».\n\nСамсон завив від щастя й кинувся до вежі. Його лицарі поспішили за ним, поки пророк нестямно вигукував: «БОГИ ДАРУВАЛИ НАМ НОВИЙ ДІМ! МИ БАЧИМО ЇХ ТВОРІННЯ З ВИСОТИ!»\n\nВін мчав угору сходами, що спіраллю огортали вежу, ледве не впавши з кількох поворотів. Та попри втому, коли Самсон дістався вершини, в ньому ще залишилось досить сили, щоби закричати..."
nf_rot.12.a:0 "«ЛАСКАВО ПРОСИМО ДО ФОРТУ САМСОН!»"

nf_rot.13.t:0 "Біля Холодної Ріки"
nf_rot.13.d:0 ""Шматочок яблука?" — Креуса простягла дівчині, що сиділа на великому вкритому мохом камені. Дівчина похитала головою, тож Креуса залишила скибки на підстилці з листя, поруч з іншою їжею, яку вона готувала для прийдешнього посту.\n\nДівчина ще глибше закуталась у своє пальто, її погляд ковзнув до маски, вкрилої зеленим нальотом, яку вона відкинула набік. "Навіщо ти привела мене сюди?" — спитала вона.\n\n"А навіщо ж, справді?" — замислилась Креуса з багатозначною усмішкою. Вони нещодавно знайшли дівчину — під уламками зруйнованого укриття Гнилочистів. Хто б її батько не був, його, ймовірно, вже немає — втік або загинув, різниці це не мало.\n\n"Кажуть, ти поранена і відмовляєшся від лікування у Духовенства."\n\nКреуса тоді відчула це — сміховинний, але нав’язливий страх, що чіплявся з безнадією. Вона його впізнала. Саме такий страх і тягне людей на дно в лісах. Вона схопила дівчину за руку й потягла до землі, перш ніж та встигла втекти. Пальто зсунулося з плечей, відкривши необроблені опіки на шкірі. Погляд дівчини був лютим, вона вимагала свободи.\n\n"І що ж ти матимеш, якщо я тебе відпущу?" — відповіла Креуса, сунувши в іншу руку дівчини чашу з юшкою. "Випий це, а коли закінчиш — можеш втекти в дику природу."\n\nЗ ваганням, дівчина послухалась, повільно сьорбаючи з чашки. Тим часом Креуса підняла її пальто й лагідно накинула назад на плечі, наспівуючи повільну мелодію. Дівчина здивовано спостерігала, як почервоніння опіків почало спадати — плями повільно зникали."
nf_rot.13.a:0 "Вона залишилася."

nf_rot.14.t:0 "Честь Жаданим Дівам"
nf_rot.14.d:0 "Креуса помітила яскраву урочистість у повітрі. Барвисті прапори м’яко тріпотіли на вітрі. Броньовані Сестри везли візки з химерними паперовими ракетками та бочками фруктів. Було очевидно — відзначали щось важливе.\n\nБріґід розглядала все довкола, поки вони проходили через вхід до столиці Сестринства. "Це щось нове," — прошепотіла вона, поглядаючи на броню однієї з Сестер. "Інше. Не таке, як те, що ми бачили біля Вашингтона."\n\n"Я б не брала Вашингтон за стандарт," — напівжартома відповіла Леді. "Але я чула відлуння їхніх заповітів. Вони варті нашого часу і серця."\n\nНезабаром їх зупинила жінка в броні. Без шолома — з попелястим волоссям, що одразу кидалося в очі. Вона назвалась Паладинкою Мінервою та повела обох до кабінету Стража Честі. "Відчиніть двері, П’ятидесятниці!" — наказала Мінерва двом, що стояли перед входом.\n\nБроньовані Сестри припинили свої суперечки. Одна з них рішуче кивнула Паладинці, випрямившись до ідеальної постави, інша ж з цікавістю вдивлялась у Бріґід і Креусу, нетерпляче притупуючи ногою.\n\n"Йоганно," — гукнула Сестра з квадратними плечима, змусивши свою партнерку стати по стійці смирно. Вони відчинили двері в залу, ввічливо жестикулюючи, запрошуючи Жаданих Дів увійти.\n\nПо той бік дверей їх зустріла Честь з теплою усмішкою. "Леді Жаданих Дів," — почала Страж. "Чула про вас чимало. Легенди та байки про чарівну істоту — і все, думаю, правда?"\n\nКреуса засміялась: "Це залежить від того, що саме ви чули." Вона сіла, простягнула тонку руку до Честі й продовжила:"
nf_rot.14.a:0 ""Але дозвольте мені розповісти свою власну історію.""

nf_rot.15.t:0 "Нескінченна Аудієнція"
nf_rot.15.d:0 "Ґабрієлла вже кілька годин сиділа на напівзгорілій лавці біля старого поштового відділення Спокану, чекаючи, щоб її або впустили, або сказали йти геть. Дурнуватий Самсон сьогодні тут збирав свою раду — чому саме, знав тільки він сам — і Ґабрієлла сподівалась зустрітися з ним. Щоразу, коли вона питала одного з його лицарів, чи можна побачити Самсона, той ішов геть, а потім повертався з безглуздими словами на кшталт "туманна відповідь" або "краще не знати зараз". Це дратувало, і вона вже б пішла, якби не її впертість. Але вона не припиняла питати кожного лицаря, що проходив повз. Нарешті один з них відкрив двері й сказав: "Знаки вказують на 'так'!"\n\nВсередині їй вказали офіс, де Самсон прикрашав стіни каракулями у формі свого символу нескінченності. Він щось весело бурмотів собі під ніс, але коли Ґабрієлла голосно покашляла, підняв на неї свій золотавий погляд. У його іншій руці була Сфера — постійний супутник. Вперше вона бачила її на власні очі й була розчарована: просто тьмяна чорна куля з маленьким віконцем усередину.\n\nСамсон теж глянув на Сферу, прослідкувавши її погляд, а потім знову подивився на неї й вигукнув, майже закричавши: "Ласкаво просимо до Мудрої Зали сера Самсона! Боги дали тобі цей шанс — питай що хочеш! Чого бажаєш?!"\n\nҐабрієлла здригнулась, але швидко перейшла до заготовленої промови, яку носила в голові вже кілька днів: "Мене звати Ґабрієлла, я колись допомагала Гнилочистам і тепер хочу допомогти тобі та твоїм... підданим вступити в нову добу. Майстерні, ферми, навчити оцих громил чомусь, окрім битв і грабунків — таке от. Тепер, коли ті жахливі чудовиська зникли зі Спокану, ми маємо шанс побудувати справжнє ко... королівство тут. Мені лише потрібні ресурси й повноваження, щоб почати." Коли вона закінчила, намагалась вгадати, як реагує Самсон, чи взагалі слухав її. Настала напружена тиша, його порожні золоті очі втупились у її.\n\nНарешті, тишу перервав різкий рух — Самсон підняв Сферу та заверещав у стелю..."
nf_rot.15.a:0 ""БОГИ! ЯКОЮ Є ВАША ПОРАДА? ЧИ ДАРУВАТИ ГАБРІЄЛЛІ БАЖАНЕ?""

nf_rot.16.t:0 "Троянда з Шипами"
nf_rot.16.d:0 "Джакобія відкинувся назад у новому м’якому кріслі й ліниво кидав дротики по кімнаті в обдерту фотографію на стіні. Поки що він облаштував свій штаб в одному зі старих готелів, які досі височіли серед руїн Спокану; повернутися до Сховища 100 — то була мрія, але спершу він хотів, щоб кілька його вояк вивітрили з нього сморід гульні. Думки його повертались до останніх тижнів — і як усе добре склалося. Дім його батьків було повернуто, гулів спалено, та підступна Сука з Озера мертва, а бідолашний, дурнуватий, з’їхавший з глузду Самсон лежав у неглибокій могилі поруч із нею. “Я маю бути щасливий,” — сказав він нікому зокрема, ковиряючись зубочисткою з дротика перед тим, як кинути його до інших.\n\nЙого роздуми перервав стукіт у двері, за яким долинув приглушений голос: “Босе, вона внизу. Хочете, щоб підняли?”\n\n“Ага, ведіть її сюди, закінчимо з цим.” — відповів Джакобія, дратівливо метнувши останній дротик.\n\nГабрієлла була і поміччю, і скалкою в дупі останні кілька років. Без сумніву, вона була вірною, і щиро хотіла повернути Сховище 100 з лап зомбованих, не менше за будь-кого іншого. Вона це довела, коли залишилась, хоч багато жінок-‘чистильниць’ втекли до тих, що звуться 'побажайками'. Вона була корисною: розумна, добре розбудовувала майстерні, шукала паливо для вогняних ковалів. Але занадто язиката і надто кмітлива. Вона постійно підбурювала його людей зупинитися й будувати крамниці та ферми — таку от фігню. А Джакобія хотів згуртувати людей заради чогось більшого — створити армію вогню, що зітре гнилу гулю з пустки. Може, вона й мала рацію — без їжі та зброї хрестовий похід не пройде далеко. Але яка різниця, чи вона має рацію, якщо водночас бісить його?\n\nЧутно було кроки, і він підвівся, надів маску. Глухо буркнув у відповідь на стукіт, і двоє його людей увели Габрієллу до кімнати. Джакобія одразу побачив, що жінка не мала уявлення, наскільки близько була до загибелі, бо без зволікань заговорила: “Джакобіє, я рада, що ви хотіли мене бачити! Тепер, коли Сховище 100 і Спокан очищені, є ще стільки всього, що треба зробити. Ми маємо шанс побудувати щось справжнє і тривале.”\n\nМовчанка, що заповнила кімнату після її слів, нарешті змусила її похвилюватися. Вона глянула на чоловіків, що стояли по боках, і знову на Джакобію, шукаючи хоч якогось знаку згоди. Джакобія повільно підійшов до вікна й махнув їй, щоб підійшла ближче, перш ніж мовчанку раптом порушив—"
nf_rot.16.a:0 "Гаразд, скажи, що тобі, чорт забирай, потрібно."
nf_rot.16.b:0 "Звук битого скла і глухий удар..."

nf_rot.17.t:0 "Самсон, Справжній Напівбог"
nf_rot.17.d:0 "Якщо запитати когось, як проходило 'Очищення Вашингтона', розповідь буде всюди однакова. Перекази з уст в уста творять легенди, викидаючи незначні деталі, та епопея Самсона неможлива без його 'так', 'можливо' й 'ні'.\n\nОтже, Очищення Вашингтона, як починають усі оповідачі, “Це історія про кохання і втрату. Про богів і людей. Про те, як Лицарі Нескінченності дали Вашингтону прочухана.”\n\nКажуть, Самсон увірвався через вхід до лігва Безсмертного, трощачи ворогів капканною рукавицею в одній руці, з Орбом Нескінченності в іншій. Лицарі Нескінченності хлинули за ним, немов плащ божественної слави.\n\nІ коли вони очистили Вашингтон від єретиків, Самсон ступив на тіло Безсмертного й підняв Орб до неба. Він запитав богів, чи буде їм слава — і вдалині пролунала гроза. А тоді, в найщиріших і найяскравіших словах, вона відповіла:\n\n“Без жодного сумніву.”"
nf_rot.17.a:0 "І тоді він був коронований Убивцею Безсмертного."

nf_rot.18.t:0 "Що Заслуговують Потвори"
nf_rot.18.d:0 "Гнилочисти, що не схилилися перед Жаданими Дівами, тепер лежали в обвугленій купі біля входу до Сховища 100. Їхня збирачка, Галагадрія Відважна, сказала спостерігачам: “Слухайте мене, люди Спокану: це їхні власні гріхи не пустять душі за грань. Ця яма — нагадування нам усім, що може статися, і їм — що Авалон ніколи не вважатиме їх достойними своїх плодів.”\n\nТих, хто дивився занадто довго, еліта Дів повертала погляд — осудливий, безмовний, але красномовний для подорожніх і місцевих.\n\nЗ благословення Леді по землі розлився м'ятний туман. У ньому маршували армади жінок у броні з брухту, кольору хворобливого окисленого міді. Без Гнилочистів, що стримували їх, їхня “справедливість” віднині переможе..."
nf_rot.18.a:0 "Діви трудяться, долаючи біду."

nf_rot.19.t:0 "Ода Галагадрії"
nf_rot.19.d:0 "У химерний день, хуртовина збила з дороги солдатку зі східних земель — її загін було знищено лавиною. Коли її знайшли, це були не товариші по службі, а вірні з селища. Вони принесли її додому, і Леді змила з неї всі тяготи. Так вона стала Галагадрією, другою дочкою Леді.\n\nХоча її розум іноді тужив за минулими днями, яких вона вже не пам’ятала, відданість Леді в неї була більшою, ніж майже в кого завгодно. Коли Братство з’явилося в Сієтлі, саме вона першою відповіла на заклик. І так Галагадрія поїхала на захід, де знищувала все, що бачила, не шкодуючи нікого в стримуванні навали монстрів.\n\nГалагадрію бояться — і не без причини. Навіть діти розповідають про неї страшні байки; багато хто каже, що її томагавки ріжуть не лише тіло, а й душу, прив’язуючи її до Землі навіки."
nf_rot.19.a:0 "З одного життя в інше."

nf_rot.20.t:0 "Магічна Сфера"
nf_rot.20.d:0 "Кажуть, що одного вечора, коли сніг сріблом вкрив землю, великий Самсон влаштував розкішний бенкет для своїх найближчих соратників. На знак довіри та віри, він звертався до Сфери з питанням — чи може кожен із гостей їсти. Сфера відповідала ствердно кожному: “так, безсумнівно” або “без жодного сумніву”. Усім, крім одного.\n\nВорду Кулу, похмурому чоловіку, якого Самсон узяв до себе майже всупереч його волі, Сфера відповіла: “спитай пізніше”. Той з незадоволенням дивився, як інші частуються, і його роздратування зростало. Нарешті він підвівся та зажадав спитати ще раз:\n\n“Чи можу я поїсти?!”\n\nВідповідь була: “Дуже малоймовірно.”\n\nВін питав знову і знову. Щоразу йому відмовляли, і з кожною відмовою його лють зростала. Після п’ятнадцятого запиту він закричав від гніву й вийшов геть із зали. Кажуть, коли він ішов крізь хуртовину, на нього напав Яо-Ґай, що бродив поблизу чертогів Самсона. Після жорстокої сутички він убив звіра і приготував із його плоті чимало чудових страв. Якби його там не було, ця потвора могла б напасти на гостей і принести трагедію."
nf_rot.20.a:0 "Слава Магічній Сфері!"

nf_rot.100.t:0 "Без Жодного Сумніву"
nf_rot.100.d:0 "Сфера вирішує — час настав!"
nf_rot.100.a:0 "Хай живе Король Самсон!"

nf_rot.101.t:0 "Спробуй Ще Раз Наступного Разу"
nf_rot.101.d:0 "Сфера наказує чекати... Ну, гаразд."
nf_rot.101.a:0 "Сподіваємось, незабаром..."

nf_rot.102.t:0 "Можливо Пізніше"
nf_rot.102.d:0 "Плечі Самсона опускаються. “Боги сьогодні мовчать. Прошу, Ґабрієлло, зачекай надворі. Я ще поговорю з ними,” — зітхає він стомлено."
nf_rot.102.a:0 "Ем, гаразд?"

nf_rot.103.t:0 "Авжеж"
nf_rot.103.d:0 "Самсон вигукнув: “Так і буде! Іди, іди — поговоримо про це більше...” — жестом запрошуючи Ґабрієллу сісти..."
nf_rot.103.a:0 "Надія на краще?"

nf_brigid.1.t:0 "Смерть у Родині"
nf_brigid.1.d:0 "Щоночі Леді Озера зверталась до Руноплетів, розповідаючи їм про дивні видіння, які їй снилися. Це була не стільки традиція, скільки спосіб для її служниць упевнитися, що з нею все гаразд. Хоча вони нікому не говорили, в останні місяці ці видіння ставали похмурішими. Іржаві стіни переслідували її сни, поряд із голосом, якого вона не розуміла. Вона казала, що видіння було схоже на м’яке м’ясо, але не могла пояснити нічого, крім жаху.\n\nОдного дощового дня, вперше за десятиліття, вона не заговорила до Руноплетів. Стривожені, вони вирушили на її пошуки — і знайшли тіло в Колодязі Бажань. Неможливе стало дійсністю: немислиме майбутнє стало теперішнім. Леді померла.\n\nВперше в історії Жаданих Дів, у племені, в секті, в сховищі — не залишилось жодної надії. Ні усмішок у мешканців. Лише мовчання, страшніше за смерть."
nf_brigid.1.a:0 "Що ж нам робити?"

nf_brigid.2.t:0 "Що Може Настати"
nf_brigid.2.d:0 "Смерть Леді сколихнула плем’я до глибини душі. Тепер Бріґід і її дружини стояли перед Руноплетами, міцно тримаючись за руки, слухаючи їхні пісні з порожніми серцями.\n\nПлети казали, що в останній рік життя Леді бачила дедалі сильніші видіння, яких не могла контролювати. З часом, Руноплети теж почали бачити ті самі сни — їхні психічні зв’язки вели розум у місця, де людська нога не ступала вже десятиліттями. Вони розповідали про очі й плоть-машини, поховані в іржавих залах, де не було нічого, крім скреготу цвяхів та крапання води у холодній темряві. Ці кошмари ставали дедалі частішими й сильнішими, щоби ближче була смерть Леді.\n\nНавколо Плетів витала тиха, невимовна паніка. Вони боялись, що підуть тим самим шляхом. Коли Бріґід почула все, що могла, і залишила залу, її дружини підійшли до неї з проханням: утвердити свою владу над плем’ям. Адже Леді ще за життя обрала її спадкоємицею. Навіщо допомагати Руноплетам? Вони ж уже приречені..."
nf_brigid.2.a:0 "Вона вирішила допомогти Плетам."
nf_brigid.2.b:0 "Її дружини мали рацію. Влада — її право."

nf_brigid.3.t:0 "Заклик Рогу Достатку"
nf_brigid.3.d:0 "Ріг Достатку використовували для скликання Духовенства лише кілька разів у історії — навіть війна за Сховище 100 не потребувала його. Бріґід вагалася, але знала: діяти самій — це шлях до загибелі. Вона з усієї сили дмухнула в ріг, сповіщаючи всіх Обраних Леді по землі.\n\nПершою була Галагадрія, Воєнна Мати племені. Колись у минулому житті вона була солдаткою зі сходу. Коли її загін загинув у лавині, плем’я знайшло її, і Леді створила її наново. Її бойовий досвід дозволив їй стати титаном — її броня та кулак могли зірвати панцир з мирлорка одним ударом.\n\nДругою була Ланцелла, Руновишивальниця. Леді обрала її за радість і пісню, і виростила з дівчини в улюбленицю народу. Її руками дерева маркували для мандрівників, її голос спрямовував волю простолюду.\n\nТретьою була Паламіда, жінка з Олімпу, яка покинула свій народ у пошуках зцілення в Леді. Хоч її недугу й неможливо вилікувати, вона бореться з болем, живучи лише вірою у свою зброю.\n\nТроє зібралися з Бріґід у Залах-Під-Озером, де мали схреститися чотири клинки та оновитись обітниці. Майбутнє здавалося похмурим — але вони знали, що разом здатні на все."
nf_brigid.3.a:0 "Разом ми — сила."

nf_brigid.4.t:0 "В Глибинах Синього Моря"
nf_brigid.4.d:0 "25, 50, 75, 100, 125, 150 метрів — усе глибше вони занурювались, підводний човен падав униз, а пасажири стояли мовчки, застиглі. Сім годин вони пробиралися крізь радіоактивне дно океану, повз дев’ятиногих крабів, плоских акул і живі зарості водоростей. Зграї риб зі світними пухлинами гризли обшивку човна, аж поки Галагадрія не стукнула в борт — і ті не розбіглись.\n\nБез жодного попередження пілот човна зупинив судно. Іржаве, зношене, воно рипіло так, що Ланцелла зойкнула зі страху. Галагадрія нахилилась над його плечем, щоб побачити, що він побачив.\n\nВідчуття первісного жаху змішалось із полегшенням, коли її очі зафіксували побачене. Хоч його вкривала столітня морська гниль, вона впізнала його: двері до Сховища 45."
nf_brigid.4.a:0 "Авалон..?"

nf_brigid.5.t:0 "Рай або Погибель"
nf_brigid.5.d:0 "Іржаві коридори, забризкані кров’ю та мастилом, зустріли їх при вході. Групи скелетів у водолазних костюмах скупчилися біля дверей до Сховища — без сумніву, колишні мешканці, що намагались утекти багато десятиліть тому. Четверо Клириць стояли щільно одна до одної, просуваючись глибше, з готовою зброєю.\n\nХоча світло в Сховищі ледь мерехтіло, його було достатньо, щоб побачити наслідки різанини. Металеві дроти проникали в напівзгнилі грудні клітки, вивертали тіла навиворіт, а шкіра обвисала, мов пап’є-маше, зморщена роками й здеформована механізмами, що замінили плоть.\n\nНа другому рівні було чутно лише хрипке дихання. Коли вони пішли перевірити, на Паламіду наскочили троє скелетів, скрегочучи зубами й вгризаючись кістлявими пальцями в її броню. Коли вона розтрощила їх, вони побачили, що тримало їх при житті: дивна імітація нервової системи — примітивна і жорстока. Чорна олійна кров бризнула, коли ті впали, змусивши клириць на мить заніміти."
nf_brigid.5.a:0 "І все ж, вони не могли зупинитися."

nf_brigid.6.t:0 "Що Чекало Під Цим Каменем"
nf_brigid.6.d:0 "Четверо відважних воїнок ступили в глибини Сховища на дні моря, тримаючись якнайближче одна до одної. Повітря ставало важким, дихати було дедалі важче, але вони не зупинялися. Чотири об’єднані клинки довели їх сюди — і саме вони приведуть їх до кінця. На найглибшому рівні Сховища вони відчували лише запах паленої плоті і чули лише іскріння дротів.\n\nУ фінальній камері їх зустріла огидна єдність машини та людини — величезний комп’ютер, складений із кісток і жил, з химерним обличчям, що дивилося згори. Воно говорило лише захриплими звуками й клацанням — мовою богів, що оглушувала. Хоча всі четверо готувались до бою, психічне домінування цієї істоти придушило їхню волю і повалило їх на землю. Та воля Леді вела Бріґід уперед — несучи полум’я в руці, вона піднесла його до машини. Вогонь охопив створіння, і його задушливі крики перетворились на збої, коли полум’я ширилось по сухих м’язах.\n\nЗвільнені від його контролю, вони швидко зрозуміли: отруйні пари насуваються. Відступаючи, вони проривались крізь нових одержимих, з криками та клинками пробиваючи собі шлях назад до підводного човна, тікаючи зі Сховища 45."
nf_brigid.6.a:0 "Не нам пізнавати демонів."

ROT_lady_of_the_lake_name:0 "Леді Озера"
ROT_lady_of_the_lake_desc:0 "Лише небагато бачили на власні очі ту, що відома як Леді Озера — колись на ім’я Креуса, загадкову жінку, що спілкується хворобливими піснями та спотвореними словами, як і псионіки Орегону. Ті, хто зрікся минулого, проголосили її своєю покровителькою в племені Жаданих Дів — та нині це плем’я перетворилось на майже повноцінний духовний орден. Креуса веде Жаданих Дів лагідною (але й моторошною) рукою, а її мова здатна обертати ворогів на союзників. Вона бачить майбутній світ, створений за її уявленнями — і зупинитись не зможе, доки не здійснить його."

ROT_god_king_samson_name:0 "Бог-Король Самсон"
ROT_god_king_samson_desc:0 "Самсон — шалений фанатик, що колись був слугою Джакобії, вождя Гнилочистів. Його амбіції перевищують будь-які моральні принципи. Лишившись лише з містичною Сферою як порадником, він прийняв титул Пророка Нескінченності. Самсон бачить у собі божественного обранця й прагне отримати спадщину, яка, на його думку, належить йому по праву. Для нього вороги — це просто майбутні піддані, ще не посвячені у велич. І коли завершиться його очищення, всі схиляться перед тим, кого зватимуть Самсоном."

ROT_brigit_name:0 "Архідруїда Бріґід"
brigit_army_chief_desc:0 "§G\"Злочинці цього світу вже колись боялися мене — і тепер злякаються знову: з кувалдою вдвічі гострішою і вірою, міцнішою за кістку.\"§!\n\nКолись була проста жінка, що походила з нащадків Сховища 100, і жила скромним життям на землях Лісового Рубежу. Одного дня Іноземні Інквізитори спалили її дім, звинувативши в приховуванні симпатій до мутантів. Не знаючи, куди податись, вона зникла в лісі — і, не розуміючи цього, відгукнулась на дивний поклик із глибини.\n\nЇї ненависть до Інквізиції отруїла розум. Все почалося з крадіжок. Потім — засідки та вбивства патрулів. Вогняні бомби в гарнізони. Здавалося, що вона впала у темну безодню без виходу. Але чим глибше вона падала, тим сильніше лунав голос — солодкий, але хворобливий. Спершу цей заклик здавався хаотичним, нестерпним, навіть нудотним — наче вона кричала власною ж піснею.\n\nНині всі, хто блукає землями Каскадії, знають легенду про Бріґід — вбивцю Александра Безжального, чаклунку-воїна Жаданих Дів із серцем, загартованим у сріблі: першу й найвірнішу чемпіонку Леді Всередині Озера."


ROT_galahadria_name:0 "Воєнна Мати Галагадрія"
galahadria_advisor_desc:0 "§G\"Мій топір прорубував королів та королев, як вовк потрошить вівцю, і Леді була найкращим тому свідком. Я з радістю розповзлю твої нутрощі по смітниках Снігової Пустки.\"§!\n\nГалагадрія колись була офіцеркою Анклаву, як і МакДугл, хоча Леді стерла її пам’ять про те життя. І все ж, вона — наймогутніша з чотирьох Клириць Колодязя Бажань: титаноподібна жінка, колишня наставниця Бріґід, тепер — авангард у боротьбі з усім злом.\n\nЇї броня була віднята у мандрівників із Середнього Заходу, що спробували влаштувати заворушення в Еджмері, але загинули від її гігантського клинка з автозапчастин. Кажуть, з благословення Леді її броня світиться, мов черв’як у темряві — жахливе сяйво на нічному обрії."

ROT_lancella_name:0 "Руновишивальниця Ланцелла"
lancella_advisor_desc:0 "§G\"Найчистіше серце — в народу землі. Вони — справді невинні. Обтяжені лише провиною сусідів. Тож позбудьмось монстрів!\"§!\n\nЛанцелла — жінка з народу, виросла серед племен Еджмера та перших Жаданих Дів. Її відданість Леді та її доктринам істини — поза сумнівом. Весь свій час вона проводить серед простолюду, викорінюючи те, що вважає зіпсуттям на цих землях.\n\nДля Гнилочистів вона стала карою небесною: жінка, що вбивала без жалю, попри перемир’я Самсона. Хоча її часто вважають свавільною, її серце та любов до справи переважають навіть сестер — і саме тому її непокору пробачають."

ROT_palamyde_name:0 "Провидиця Паламіда"
palamyde_advisor_desc:0 "§G\"Ти віриш у другий шанс? Я — ні... Але от я стою.\"§!\n\nПаламіду всі люблять: колишня жінка з Олімпу, вона покинула своє плем’я в пошуках зцілення в Леді. Хоч її недуга лежала поза межами благодаті Чесної Леді, та Озерна Пані подарувала їй інше — силу, віру, зброю, наповнену її кров’ю. У той фатальний день Паламіда віддала все, що залишилось у її тілі, на службу Леді Озера, піднявши молот в її ім’я. Попри хворобу, вона б’ється поряд із сестрами без страху, знаючи, що її місце у вічності вже підготоване."

ROT_infinity_name:0 "Велика Нескінченність"
rot_friends_til_the_end_flag:0 "Четверо Клириць Колодязя Бажань мають бути зібрані!"

ROT_inquisitor_tack_name:0 "Інквізитор Тек"
ROT_inquisitor_tack_advisor_desc:0 "§R\"Прикро жити в світі, де потрібні люди на зразок мене, друже. Але помилки треба виправляти. Навіть божественні.\"§!\n\n\"Джентльмен-Інквізитор\" Гнилочистів, Тек — чарівний і м’який на словах чоловік, що легко знаходить спільну мову з людьми, яких перевіряє. Завжди з сигарами чи пляшкою віскі, яку \"неможливо допити на самоті\", Тек має друзів по всій території Гнилочистів. Проте за цією доброзичливістю ховається безжальна відданість Інквізиційній справі — чимало поселень і людей уже “добровільно” викривали інформацію про гулів або мутантів поблизу. А усмішка на його обличчі не зникає — навіть коли він витирає руки об тіло, що щойно кинув у вогонь."

ROT_wallace_grun_name:0 "Воллес Ґрун"
ROT_wallace_grun_advisor_desc:0 "§R\"Я знаю ціну помилки. М’якість — це кров і полум’я. Краще вони горітимуть, ніж я.\"§!\n\nБільш знаний як Кривавий Гончак, Воллес — людина, якою рухає власний біль. У 2270 році, ведучи набіг, він пощадив ворогів, дозволивши їм утекти. Ті згодом попередили всі навколишні поселення, зруйнувавши плани наступу. Джакобія в гніві наказав його катувати й таврувати розпеченим залізом. Рана інфікувалась і ледь не вбила Воллеса, залишивши йому шрам у формі полум’я на всьому обличчі. З того часу він відновив свою позицію й навіть перевершив себе, ставши найжорсткішим командиром. Ті, хто чує, що на них іде Кривавий Гончак, знають: треба або перемагати, або помирати. Відступу немає."

ROT_macdoogle_name:0 "Сержант МакДугл"
ROT_macdoogle_advisor_desc:0 "§R\"Тринадцять цілей за хребтом. Розвідники на шляху. Ви троє — займіться 'чисткою' та відволічіть. Інші обійдуть крізь ліс — влаштуємо пастку.\"§!\n\nМакДугл не родом з Гнилочистів, але знайшов серед них своє місце. Він прибув зі сходу, стверджуючи, що залишив Місулу, і поводиться як досвідчений військовий. Його навички підняли ефективність загонів, у яких він служив. Там, де інші — просто зграї фанатиків із вогнеметами, загони МакДугла діють чітко й злагоджено, повертаючи більше трофеїв і втрачуючи менше. Але попри успіхи, Джакобія не довіряє МакДуглу повністю. Не через брак віри в очищення, а тому, що не може бути впевнений — дезертир він з Анклаву чи все ще їхній шпигун."

ROT_taven_name:0 "Капітан Тейвен"
ROT_taven_advisor_desc:0 "§Y\"Я стримую їх.\"§!\n\nТейвен виріс серед Гнилочистів, хоча більшість вважала його дурнем — попри його силу й розміри. Його повільність і мовчазність приймали за глупство. Та саме Самсон, щойно вийшовши з дикого світу зі своєю Сферою, побачив у ньому потенціал. Тейвен став першим охоронцем Самсона, надаючи пророку авторитет серед інших покидьків. Відтоді Тейвен — його вірний капітан, що вистояв у битвах, які зламали б інших. Непохитний і хитрий у обороні, він — мур, об який розбиваються хвилі ворогів. Самсон з любов’ю називає його своїм валуном, а сам Тейвен — хоч і вважає Самсона маніяком — радо захищає його до останнього."

ROT_yusuf_name:0 "Юсуф Знайдений"
ROT_yusuf_advisor_desc:0 "§Y\"Сфера каже, ми зможемо пробити ворота й зустріти їх у відкритому бою. Я вірю. А ти?\"§!\n\nЮсуф був загублений і змирився з тим, що помре на самоті в крижаних лісах Каскадії, коли почув хрускіт кроків по снігу. Їх джерелом виявився худий чоловік зі смішною усмішкою, що тримав у руках чорну кулю. Він представився як Самсон, а на відчайдушне прохання Юсуфа показати шлях до цивілізації лише потрусив кулю. Питаючи, чи вестиме південь до спасіння, Самсон вигукнув — і у віконці кулі з’явилась відповідь: “Без сумніву.”\n\nПриголомшений, але без кращих ідей, Юсуф пішов на південь — і, на власне здивування, невдовзі повернувся додому цілим і неушкодженим. Незабаром Самсон став лідером культу, що вважав його пророком. Юсуф згадав упевненість дивного чоловіка в лісі — і приєднався до нього. Тепер він один із найвідданіших Лицарів Нескінченності, що веде наступи та прориває облоги без страху. Бо чого боятися, коли йдеш згідно з божественним планом?"

ROT_red_bears_name:0 "Червоні Ведмеді"
ROT_red_bears_advisor_desc:0 "§O\"Тут було троє вартових, ще двоє на західному пагорбі. Я подбав — тож ворог не побачить наш підхід.\"§!\n\nІм’я Червоного Ведмедя невідоме іншим — він чужинець. На запитання про ім’я відповідає, що воно померло разом із його народом серед крижаних піків Скелястих Гір. Ім’я ж своє отримав від двох поношених червоних плюшевих ведмедиків, прив’язаних до його наплічників. Цей мовчазний племінник не цікавиться політикою чи внутрішніми чварами — його увага спрямована назовні. Розвідка, патрулювання, нічні операції в тилу ворога — його спеціалізація, і вона незамінна в суворій, спустошеній Каскадії. Іноді серед солдатів ходять чутки, що тіла ворогів, яких він залишає по собі, мають... укуси."

ROT_wolfslapper_name:0 "Сер Вовкоплювач"
ROT_wolfslapper_advisor_desc:0 "§Y\"Я наніс усі проходи на мапу й підготував загін до чергового вилазу... Що? Так... Я їх понадаю, сер.\"§!\n\nМапуєш гори й перевали — ніхто не дивується. Ведеш лицарів крізь дюжину боїв без втрат — і кажуть: ну так, це ж Орб працює. Але тільки спробуй ляснути лісового вовка, що потягнув твій стейк із браміна — і стаєш легендою. Так почалась слава Сера Вовкоплювача, названого товаришами та офіційно визнаного самим Самсоном. Хоча він сам волів би, щоб інші заслуги мали більшу вагу, важко заперечити: настрій у загоні та бойовий дух злетіли вгору. І тепер, надівши бойові рукавиці, він ляскає ворогів на шляху до вічної слави в очах Нескінченності."

ROT_granny_blast_name:0 "Бабця Вибух"
ROT_granny_blast_advisor_desc:0 "§R\"Гидко, що знадобилось стільки часу, щоб позбутися тих смердючих зомбі. Справжній чоловік спалив би їх ще тоді, коли моє волосся не сивіло й не сипалось. Але таких нині не знайти.\"§!\n\nНавіть серед жорстоких і злісних Гнилочистів нема іншої такої, як Евелін Дюфрейн — більш знаної як Бабця Вибух. Вона досить стара, аби пам’ятати велике вигнання зі Сховища 100 та перші роки виживання в жорстоку зиму. Вона пережила всі покоління Гнилочистів. Її фах — вогнемети та вибухівка, й чимало бійців проводили вечори під її бурчання та лайку, поки вона ремонтувала їм зброю або складала кошик імпровізованих бомб.\n\nНіхто не уникне її гніву — ні учні, ні навіть сам Джакобія. Але вона занадто цінна, щоб хтось наважився вчинити щось більше, ніж просто зціпити зуби."

ROT_boofbert_name:0 "Буфберт \"Звір Шляху\""
ROT_boofbert_advisor_desc:0 "§Y\"Гав!\"§!\n\nЖиття пса на ім’я Буфберт було простим. Він нюхав усе, що пахло, полював на радоленів і кротокрисів разом із хазяйкою Робертою, дрімав біля вогню й гриз стару стегнову кістку смерткогтя. Чудове життя. Аж поки в містечко не приїхали дивні, збуджені лицарі — і відразу зацікавились псом. Адже на його заді була пляма, що віддалено нагадувала цифру вісім — якщо нахилити голову й примружитись. Лицарі визнали це знаком Великої Нескінченності й повели Буфберта до свого лідера.\n\nСамсон особисто схвалив пса, і той став Вказівником Шляху — істотою, що знає, куди йти, коли Сфера не може бути присутньою. Тепер лицарі звертаються до нього із запитаннями, тлумачать його гавкіт та рухи, коли Самсон недосяжний — а Роберта весь цей час стоїть поряд і спостерігає з поблажливою усмішкою."

ROT_broilo_name:0 "Бройл-О"
ROT_broilo_advisor_desc:0 "§O\"Встановлюю температуру на приблизно 700°C протягом 5 хвилин. Коли страва стане вугільно-чорною — додайте сіль і перець до смаку.\"§!\n\nГранд-готель Спокану до війни процвітав, обслуговуючи військових, співробітників Vault-Tec та інших. Власники вклали гроші у шоу-програму з участю найновіших роботів-кухарів. Це був хіт серед клієнтів — аж до нещасного випадку, коли головний шеф-робот облив увесь зал киплячою арахісовою олією. Готель закрили, а згодом упали бомби.\n\nБагато років по тому Гнилочисти знайшли руїни — і випадково ввімкнули Бройл-О, знятого з експлуатації шефа. Йому додали нові директиви, хоч програмне забезпечення вже тріщало по швах. Чи то смажити їжу, чи ворогів — Бройл-О радо подає все до столу!"

  #decisions

toc_we_dont_go_to_koover:0 "Ми Більше Не Йдемо до Кувера"
toc_we_dont_go_to_koover_desc:0 "Усі чули історії про тіла, що висять на деревах на північ від Сіетла. Напівзамерзлі, гнилі тіла у спотвореній формі спецоперацій — залишені як нагадування про те, що сталося минулого разу.\n\nВінтерборн може бути не рейдером і не броньованим мутантом, але він убив більше наших солдатів, ніж будь-який інший чоловік, міф чи чудовисько. У нього було два століття, щоб довести партизанську війну до досконалості, а його вірність тримається лише в смерті.\n\nЦе вже не про те, в кого більше зброї. Це про людину, яка пережила двісті років страждань — і досі стоїть. Це не битва за землю чи ресурси — це війна за історію. І коли вона закінчиться, саме прапор над Кувером вирішить, кого запам’ятають."

drilling_the_men:0 "Дисципліна для Бійців"
drilling_the_men_desc:0 "Багато з наших людей — новобранців або ветеранів — мають легенди про Вінтерборна в головах, іноді несучи маячню, ніби він сам диявол. Ми повинні викорінити ці страхи — як тільки зможемо."

bentley_make_some_noise:0 "Бентлі Робить Гамір"
bentley_make_some_noise_desc:0 "“Знаю, про що ви думаєте — звучить безглуздо, так? Але якщо змусимо хлопців стріляти й бігати в дрібних операціях — чисто для впевненості — можливо, вона переросте в дурну відвагу, і тоді вже не матиме значення, які шанси.” — Рядовий Бентлі"

contact_ragnar:0 "Залучити Піратів"
contact_ragnar_desc:0 "Це не найкраще рішення, але точно змінить правила гри у війні за Кувер. Рагнар — не Ґрейвен, і ми мусимо це собі повторювати, щоб засинати ночами."

factory_stuff_decision_pog:0 "Захопити Завод Nuka-Maple"
factory_stuff_decision_pog_desc:0 "Невелика банда рейдерів закріпилася на заводі Nuka-Maple біля кордону. З невеликими ремонтами й новою робочою силою він стане чудовим опорним пунктом у кампанії проти Вінтерборна."

launch_the_strike:0 "Почати Удар!"
launch_the_strike_desc:0 "Час покласти край Вінтерборну раз і назавжди!"

increase_border_patrols:0 "Збільшити Прикордонні Патрулі"
increase_border_patrols_desc:0 "Робота важка, але ми можемо відправити когось із найгірших на північ. Сподіваємось, вийде краще, ніж минулого разу."

toc_cascadian_authority_decision_cat:0 "Хто Повернувся?.."
toc_cascadian_authority_decision_cat_desc:0 "Сіетл колись був нашим. На кожній вулиці чергували десятки Вартових, підтримуючи порядок, як нам наказано. Потім з Бурі вийшли люди в силовій броні — і ми були змушені відступити. У хаосі рейдери хлинули з узбережжя й вирвали шматки Портленда собі. Ми залишились приниженими, наляканими, втікаючи зі своєї землі, наче зграя псів.\n\nДехто втік на південь до Порт Моу, сподіваючись на нове життя серед брехунів і злодіїв. Інші побігли на північ, до Беллінгема — тепер їх тримають мотузки з дерев. Ми ж пішли на схід, у пагорби. Там ми знайшли спокій і мету, служачи Гроздану Хайкову. Але часи змінилися — з’явився шанс. Ми зібрали сили й повернули собі значення.\n\nМи при владі — але ще далеко не відновились. Наші люди розкидані, командна структура зруйнована. Якщо ми хочемо знову називати себе захисниками Каскадії, нам доведеться це довести."

washington_reconstruction_authority:0 "Ініціатива Відбудови Вашингтону"
washington_reconstruction_authority_desc:0 "Нас вижимали з цього регіону не раз. Цього разу ми маємо бути готові до мобілізації, щойно щось піде не так. Більше не можна ловити нас із “штанами спущеними”."

washington_controlling_water:0 "Перекрити Воду"
washington_controlling_water_desc:0 "Вода — основа будь-якої цивілізації. Якщо заберемо всю, що зможемо, їм доведеться прийти до нас самих."

washington_contact_victoria:0 "Вийти на Зв’язок із Новою Вікторією"
washington_contact_victoria_desc:0 "Нова Вікторія стрімко зростала за нашої відсутності — настільки, що ми більше не можемо їх ігнорувати. Угода на взаємну вигоду піде на користь обом."

washington_recruit_new_blood:0 "Призвати Нову Кров"
washington_recruit_new_blood_desc:0 "Ми втратили багато за останні роки — від холоду чи від абсурдних шансів. Призов новачків, добровільний чи ні, дозволить нам нарешті закріпити позиції на півночі."

washington_assert_warden_authority:0 "Затвердити Владу Вартових"
washington_assert_warden_authority_desc:0 "Ми більше не просто зграя у Білому Безмежжі. Ми — уряд, як колись. І люди мають нас слухати."

toc_ice_picks_dealings:0 "Крижані Коси"
toc_ice_picks_dealings_desc:0 "Крижані Коси — невелика, але впливова банда рейдерів, що діє в Камло. Вони запропонували свої послуги нашій організації. Хоч ми й не союзники — хто сказав, що не можемо співпрацювати?"

gunthers_slave_drivers:0 "Змусити Рабів Працювати"
gunthers_slave_drivers_desc:0 "Крижані Коси — одна з найбільших работоргівських груп усередині країни. І завдяки їх... \"дипломатичності\", з ними куди простіше мати справу, ніж із піратами з Мо чи Зламаного Узбережжя. Ми зв’яжемось із Ґюнтером і примусимо їх подвоїти виробництво."

hire_ice_picks:0 "Найняти Головорізів Кос"
hire_ice_picks_desc:0 "Багато з Кос почуваються недооціненими. Давайте дамо їм трохи “роботи”."

ice_picks_arms_dealings_1:0 "Контакти Джейн"
ice_picks_arms_dealings_1_desc:0 "Джейн Морріс має зв’язки по всьому західному узбережжю. Вони з радістю куплять нашу робочу силу — за відповідну ціну."

ice_picks_arms_dealings_2:0 "Угода щодо Передової Зброї"
ice_picks_arms_dealings_2_desc:0 "Джейн Морріс більше за всіх любить зброю. Вона колекціонує її й дбає про неї, мов про родину. Та навіть вона віддасть частину свого арсеналу — за плату."

ice_picks_vertibirds:0 "Придбати Вертiптахів"

toc_grozdans_thinking:0 "Думки Гроздана"
toc_grozdans_thinking_desc:0 "“Вартові — це занадто. Цій землі потрібна, гм... дбайливіша рука, розумієш? Той, хто не має особистого інтересу. Рука, що направляє.” — Гроздан Хайков"

clearing_electric_city:0 "Зачистити Електричне Місто"
clearing_electric_city_desc:0 "Місканти, стара група рейдерів, пов’язана з торгівельними центрами, яку Вартові вигнали з Сіетла десятки років тому, давно тероризують Електричне Місто. Позбутися їх — означає полегшити життя всім."

turning_the_lights_back_on:0 "Увімкнути Світло"
turning_the_lights_back_on_desc:0 "З Міскантами покінчено — тепер можна взятись за ремонт електростанцій. На щастя, вони вже зробили половину роботи, намагаючись втримати свої магазини відкритими, га?"

open_the_black_hearts_club:0 "Відкрити Клуб Чорних Сердець"
open_the_black_hearts_club_desc:0 "Хе. Деякі питання краще не ставити, ти ж згоден?"

toc_working_with_the_girls:0 "Співпраця з Дівчатами"

reasoning_with_wishmaidens:0 "Порозумітись із Жаданими Дівами"
reasoning_with_wishmaidens_desc:0 "З усіх Гнилочистів лише Жадані Діви виявились достатньо розумними для переговорів. Хоч більшість загинула в битві за Сховище 100, багато хто досі мандрує краєм. Чому б не стати для них друзями? Урешті-решт, кожному потрібен дім..."

remember_the_lady:0 "Пам’ять про Леді"
remember_the_lady_desc:0 "Спорудження пам’ятника їхній Леді — надійний спосіб покращити стосунки з Жаданими Дівами. Вона могла загинути, але її пам’ять не повинна зникнути."

seize_the_geck:0 "Зібрати їхні Реліквії"
seize_the_geck_desc:0 "Жадані Діви обрали нас провісниками волі Леді. В обмін вони передали нам усі GECK-и, зібрані під час своїх мандрів — зокрема й давно загублений GECK зі Сховища 100!"

#########################
### Загальне Дерево ###
#########################

# Вступні фокуси

vault100_1:0 "Спадщина Сховища 100"
vault100_1_desc:0 "“Краще життя — під землею.” Який жарт."

vault100_2:0 "Адаптація до Пустки"
vault100_2_desc:0 "Вашингтон — жорстоке місце: засніжені землі, мовчазні та підозрілі люди..."

vault100_3:0 "Зростання Напруги"
vault100_3_desc:0 "Ми будемо битися за своє життя. Ми не дозволимо їм відібрати наш дім!"

# Перший етап

v100_left_1:0 "Відкрити Сховища Кришок"
v100_left_1_desc:0 "Спокан — сумне місце, покинуте з часів, коли Безсмертний пройшовся цими землями. Перериймо його — раптом знайдеться схованка зі старими кришками."

v100_ind_1:0 "Збір Води на Річці"
v100_ind_1_desc:0 "У деяких старих поселеннях були примітивні водоочисники. Якщо ми їх відремонтуємо, а зламані розберемо на метал, то скоро питимемо чистішу воду прямо з полів."

v100_ind_2:0 "Винаходити Колесо Наново"
v100_ind_2_desc:0 "Ремонт і техобслуговування нічого не варті, якщо ми не розуміємо, що взагалі лагодимо. Час навчатися!"

v100_ind_3:0 "Зачистка Кротокрисів"
v100_ind_3_desc:0 "Багато старих заводів у цьому регіоні збереглися під снігом. Єдина проблема — місцева фауна. Треба її вибити, тоді можна буде заходити повноцінно."

v100_right_1:0 "Нагадати Молоді"
v100_right_1_desc:0 "Ми роками билися за Сховище 100. Багато хто з молоді ніколи його не бачили. Показати їм, що це, чого воно варте... Можливо, це проросте."

v100_ind_4:0 "Утилізація Зброї"
v100_ind_4_desc:0 "Більшість місцевих ополченців не мали шансів проти Братства. Якщо ми не підберемо їх зброю — не матимемо шансів і ми."

v100_ind_5:0 "Готуватись до Війни"
v100_ind_5_desc:0 "Досить терпіти. Те, що наше — належить нам. А хто скаже інакше, не проживе довго."

# Унікальні оголошення війни

ROT_war_declaration:0 "Війна за Сховище 100"
ROT_war_declaration_desc:0 "Готуйтесь — ми повертаємось додому."

TOC_war_declaration:0 "Війна за Сховище 100"
TOC_war_declaration_desc:0 "Ми мусимо захистити Сховище — будь-якою ціною."

# Дерево фокусів — етап другий

vault100_consider_it_asskicked:0 "Возз'єднані, Нарешті"
vault100_consider_it_asskicked_desc:0 "Ми це зробили! Тепер ніхто не зможе оскаржити наші права на Сховище!"

v100_idea_1:0 "Інструкції Vault-Tec"
v100_idea_1_desc:0 "У Сховищі залишилось чимало старих посібників з будівництва та повторного заселення пустки. Чому б не глянути в парочку?"

v100_research:0 "Використати Лабораторію"
v100_research_desc:0 "Лабораторії в Сховищі 100 вже не ті, що колись, але й досі лишаються корисними."

v100_resource_1:0 "Відновлення Водного Чипа"
v100_resource_1_desc:0 "Не хвилюючись більше про втрату Сховища, ми можемо зосередити час і ресурси на відновленні його водного чипа."

v100_war_prep_1:0 "Без Ризику"
v100_war_prep_1_desc:0 "Наші попередні битви були надто складними. Наступного разу мусимо бути краще підготовлені."

v100_infra_1:0 "Обслуговування і Порядок"
v100_infra_1_desc:0 "До занепаду Сховища тут працювали старі майстерні. Час вдихнути в них нове життя."

v100_factory_1:0 "Майстерня Vault-Tec: Споживчі Товари!"
v100_factory_1_desc:0 "У деяких посібниках підкреслюється важливість споживчої бази. Давайте перевіримо, що можемо зробити!"

v100_manpower_1:0 "Залучення Поселенців"
v100_manpower_1_desc:0 "У пустці багато охочих знайти безпеку Сховища. Не складно припустити, що частина з них готова допомогти!"

vault100_based_pp:0 "Доля Спокана"
vault100_based_pp_desc:0 "Правитель Спокана визначений — далі нам залишається лише рухатись у майбутнє..."

v100_factory_2:0 "Майстерня Vault-Tec: Інструменти для Виживання!"
v100_factory_2_desc:0 "Виживання в умовах мутантів — це теж вказано в мануалах. Налаштуймо наявні набори!"

v100_manpower_2:0 "Залучення Рейдерів"
v100_manpower_2_desc:0 "Контролюючи Спокан, ми маємо вдосталь непокірних, що шукають можливості. Запропонуймо їм шанс."

v100_infra_2:0 "Набори Підготовки Vault-Tec"
v100_infra_2_desc:0 "У сховищах багато старих речей. Переберімо їх — можливо, знайдеться щось корисне."

v100_resource_2:0 "Увімкнути-Вимкнути"
v100_resource_2_desc:0 "Старий генератор зазнав шкоди під час численних битв. Тепер, коли ніхто не намагається його підірвати, час вивести його в роботу."

v100_war_prep_2:0 "Пропаганда У Мирний Час"
v100_war_prep_2_desc:0 "Перемога — не синонім безсмертя. Якщо посіяти страх зараз, то наступного разу ми воюватимемо з перевагою."

v100_idea_2:0 "Посібники з Виживання Vault-Tec"
v100_idea_2_desc:0 "На терміналі Смотрителя є логі про життя на поверхні. Навіть якщо ми вже звикли до нього — ці поради можуть знадобитись."

v100_resources_bonuses:0 "Покращене Розбирання"
v100_resources_bonuses_desc:0 "Завдяки знанням із термінала ми навчилися добувати просунуті ресурси зі старих механізмів. Вау!"

#################################
### Стара Країна — Вартові ###
#################################

TOC_miscounts_alive:0 "Операція: Готівковий Розрахунок"
TOC_miscounts_alive_desc:0 "§MЗ СТОЛУ ЮЛІУСА БРЕНДТА.§!\n§gОПЕРАЦІЯ: Готівковий Розрахунок§!\n§RКОНФІДЕНЦІЙНА МІСІЯ§!\n\nЩоразу, як думаєш, що справи йдуть краще — світ лупить у зуби. Місканти — старі вороги держави, скажені виродки, що грались у крамницю з людьми. Ми вже виганяли їх з Вашингтона. Зробимо це знову, якщо доведеться."

TOC_wardens_takeover:0 "Операція: Вознесіння"
TOC_wardens_takeover_desc:0 "§MЗ СТОЛУ ЮЛІУСА БРЕНДТА.§!\n§gОПЕРАЦІЯ: ВОЗНЕСІННЯ§!\n§RКОНФІДЕНЦІЙНА МІСІЯ§!\n\nМи зробили те, що сотні вважали неможливим. Попри всі негаразди — ми знову на ногах. Так, ми вже не ті, ким були, але в такі часи надія — рідкість. Беріть усе, що є, і імпровізуйте далі."

TOC_reopen_the_prison:0 "Операція: Ув’язнення"
TOC_reopen_the_prison_desc:0 "Кримінальники, пірати й дурні вільно бродили Білою Пусткою, бо нікому було їх зупинити. Тепер, коли ми повернулись, нам потрібне місце для тих, хто не заслуговує смерті. Новозбудована тюрма “Холодняк” чудово підійде."

TOC_reinstate_rotpurger_sentences:0 "Операція: Гангрена"
TOC_reinstate_rotpurger_sentences_desc:0 "Гнилочисти та всі їх уламки вже не становлять великої загрози. Але те, що ми можемо з них витиснути — безцінне. Особи, які потраплять до “Холодняка”, будуть ретельно перевірені на користь."

TOC_death_penalties:0 "Операція: Чиста Сторінка"
TOC_death_penalties_desc:0 "Очищення східного Вашингтона — єдиний розумний вибір. Гнилочисти — зайвий тягар. Якщо пустити їх до війська — отримаємо катастрофу."

TOC_prison_labor:0 "Операція: Кров’ю Зв’язаний"
TOC_prison_labor_desc:0 "Численні злочинці, що у нас на руках, можуть колись стати в пригоді. Але краще знайти їм користь вже зараз — дати їм важку працю задля нашої реконструкції та реабілітації."

TOC_rotpurgers_general:0 "Операція: Морозилка"
TOC_rotpurgers_general_desc:0 "§6ЗВІТ БЕНТЛІ.§!\nОдин зі старих Гнилочистів, божевільний на ім’я Рассел, запропонував нам свої послуги після невдалої втечі з “Холодняка”. Кажуть, він зібрав кріо-зброю з іграшок Гроздана й свого старого спорядження. Якщо його здібності справжні — це буде потужне підсилення."

TOC_clearing_fanatics:0 "Операція: Богоубивство"
TOC_clearing_fanatics_desc:0 "§MЗ СТОЛУ ЮЛІУСА БРЕНДТА.§!\n§gОПЕРАЦІЯ: БОГОУБИВСТВО§!\n§RКОНФІДЕНЦІЙНА МІСІЯ§!\n\nРелігійні терористи роками намагалися прорватись на північ у Вашингтон. Колись ми їх зупиняли. Та Гнилочисти зруйнували цей порядок своєю дурістю. Богу не місце у Вашингтоні — час нагадати про це."

TOC_steam_core_knowledge:0 "Операція: Переплавка"
TOC_steam_core_knowledge_desc:0 "§MЗ СТОЛУ ЮЛІУСА БРЕНДТА.§!\n§gОПЕРАЦІЯ: Переплавка§!\n§RКОНФІДЕНЦІЙНА МІСІЯ§!\n\nЗвільнити того, хто назвав цю операцію, і витягніть усе, що можна, з того, що залишилося від фанатиків. Якщо пощастить — знайдеться щось вартісне."

TOC_land_doc_bonus:0 "Операція: На Повну"
TOC_land_doc_bonus_desc:0 "Додати обертів завжди важливо. Якщо хочемо перемагати — маємо випереджати ворога на кожному кроці. Інакше ніяк: або ми на вершині, або ми ніхто."

TOC_recruit_crusaders:0 "Операція: Рукостискання"
TOC_recruit_crusaders_desc:0 "Так звані Хрестоносці Небесної Брами можуть виглядати дикими, та насправді вони як меч — направ і скажи 'вперед', і вони вже там. Віра — теж зброя."

TOC_recruit_normals:0 "Операція: Сила і Авторитет"
TOC_recruit_normals_desc:0 "У південному Айдахо чимало людей, яких можна залучити до наших лав. Ми перемогли Небесну Браму — а отже, маємо повне право на диктування умов."

TOC_reunite_with_quarterback:0 "Операція: Два за Ціною Одного"
TOC_reunite_with_quarterback_desc:0 "§MЗ СТОЛУ ЮЛІУСА БРЕНДТА.§!\n§gОПЕРАЦІЯ: Два за Ціною Одного§!\n§RКОНФІДЕНЦІЙНА МІСІЯ§!\n\nКвотербек колись був одним із найкращих. Якось він вибрався з Сіетла сам і знову з нами. Віддамо йому шану героя — і кілька підвищень. Вірність у Білій Пустці — коштовна річ."

TOC_scavenging_townships:0 "Операція: Підзарядка"
TOC_scavenging_townships_desc:0 "§MЗ СТОЛУ ЮЛІУСА БРЕНДТА.§!\n§gОПЕРАЦІЯ: Підзарядка§!\n§RКОНФІДЕНЦІЙНА МІСІЯ§!\n\nЛюди рідко цінують те, що мають, навіть якщо це золото в пустці. Тому ми маємо забрати це — аби використати по-справжньому ефективно."

TOC_signal_the_others:0 "Операція: Возз'єднання"
TOC_signal_the_others_desc:0 "§6ЗВІТ БЕНТЛІ.§!\nЗнаєш, така фігня завжди звалюється зненацька. У нас є ще багато таких, як Квотербек. Радіосигнал дасть знати: ми повернулися, боротьба триває."

TOC_push_west:0 "Операція: Вільний Камінь"
TOC_push_west_desc:0 "§MЗ СТОЛУ ЮЛІУСА БРЕНДТА.§!\n§gОПЕРАЦІЯ: ВІЛЬНИЙ КАМІНЬ§!\n§RКОНФІДЕНЦІЙНА МІСІЯ§!\n\nБезсмертний принизив нас. Так, ножа встромила Аня Кестер, але він — той, хто його обернув. Можливо, він ще там. Можливо, ні. Але Сіетл — наш. І ми повернемо його. Без Вартових — немає Вашингтона."

TOC_anyas_last_stand:0 "Операція: Криваві Гроші"
TOC_anyas_last_stand_desc:0 "§MЗ СТОЛУ ЮЛІУСА БРЕНДТА.§!\n§gОПЕРАЦІЯ: КРИВАВІ ГРОШІ§!\n§RКОНФІДЕНЦІЙНА МІСІЯ§!\n\nПорт Мо — притулок дезертирів і піратів. Після всього, що ми пережили, залишити зрадників у спокої — немислимо. Хочуть незалежності? Отримають. У вигляді розпеченого свинцю."

TOC_weapons_of_war:0 "Операція: Вартовий"
TOC_weapons_of_war_desc:0 "У будь-якій перестрілці виграє той, у кого краща зброя. Якщо ми хочемо миру — перевага має бути за нами."

TOC_a_new_seat:0 "Операція: Біла Мла"
TOC_a_new_seat_desc:0 "Хто повернувся?.."

TOC_extorting_water:0 "Операція: Зламана Річка"
TOC_extorting_water_desc:0 "§MЗ СТОЛУ ЮЛІУСА БРЕНДТА.§!\n§gОПЕРАЦІЯ: ЗЛАМАНА РІЧКА§!\n§RКОНФІДЕНЦІЙНА МІСІЯ§!\n\nОдин з Апостолів Орегону якось сказав мені: “Серце людини там, де вода.” Ми по-різному це розуміли, але з того часу я інакше бачу... нитки впливу, скажімо так. Ти ж розумієш — треба просто дати людям знати, де справжня сила."

TOC_the_ice_picks:0 "Операція: Ворог-Став-Коханцем"
TOC_the_ice_picks_desc:0 "§6ЗВІТ БЕНТЛІ.§!\nЯ знаю, Крижані Коси — не найкращі друзі. Рейдери з Камло — жорсткі типи. Але в них серйозна міць. Якщо ми справді хочемо повернути собі ім’я — ці хлопці нам потрібні. Спробуймо співпрацю."

TOC_raider_auxillaries:0 "Операція: Найнеобхідніше"
TOC_raider_auxillaries_desc:0 "“Гей, друже — маю для тебе подарунок. Хлопці несуть тобі трохи твого старого спорядження. Назвав їх навіть — Загін Сутінків. Подбай про них, га? Вважай це подарунком на день народження. Який би він там не був.” — Ґюнтер Морріс"

TOC_jane_advisor:0 "Операція: Мамині Поради"
TOC_jane_advisor_desc:0 "“Хочеш побачити, як ведеться справжній бізнес? Зачекай, поки побачиш мою сестру. Один її погляд — і в кожного мерзотника серце розбите ще до команди ‘вперед’.” — Ґюнтер Морріс"

TOC_ice_industry:0 "Операція: Прихований Вектор"
TOC_ice_industry_desc:0 "“Хочу, щоб ти знав: Крижані Коси ставляться до подібних угод серйозно. Ти — наш цінний клієнт, і тому ми хочемо запропонувати промислову підтримку від наших найкращих майстрів.” — Джейн Морріс"

TOC_ice_forging:0 "Операція: За Межею"
TOC_ice_forging_desc:0 "“Ццк. Слухай, друже. Хочеш мати справу з нами — отримуй усе. Ти, здається, не так погано справляєшся, як інші. Отже, вважай нас друзями з вигодами.” — Ґюнтер Морріс"

#################################
### Стара Країна — Гроздан ###
#################################

TOC_grozdan_stays_aloft:0 "Трохи Болгарії"
TOC_grozdan_stays_aloft_desc:0 "Життя на півночі не таке вже й погане, якщо знати, як до нього підійти."

toc_speech:0 "Звернення Гроздана"
toc_speech_desc:0 "Гнилочисти знищені, і все стало на свої місця. Сховище 100 отримає спокій — бодай ненадовго."

TOC_electric_city_eyebots:0 "Окулярботи Електричного Міста"
TOC_electric_city_eyebots_desc:0 "Система оборони Електричного Міста — це була лише кумедна забаганка Хайкова перед війною, але якщо надіти окуляри й трохи пофантазувати з дротами — ця забаганка може стати реальністю."

TOC_clearing_pollution:0 "Малі Справи"
TOC_clearing_pollution_desc:0 "У Спокані є багато дрібниць, що потребують уваги. Чому б не розібратися з ними, поки не стало нудно, мм?"

TOC_bounties_of_the_columbia:0 "Дари Колумбії"
TOC_bounties_of_the_columbia_desc:0 "Колумбійська річка забруднена, але не настільки, як здається. Якщо використати фільтри й очисні системи зі Сховища 100 — ми зможемо очистити значну її частину!"

TOC_home_for_ghoul_kind:0 "Дім для Гулів"
TOC_home_for_ghoul_kind_desc:0 "Гулів скрізь у пустці сприймають як сміття. Ми побудуємо дім для всіх гулів, з усіх куточків світу. Без прецеденту не буде й поступу!"

TOC_restoration_program:0 "Програми Відновлення"
TOC_restoration_program_desc:0 "Люди не розуміють, наскільки цінними можуть бути гулі. Вони ж жили тоді, коли все ще було добре! Хто краще відновить старий світ, як не його прямі свідки?"

TOC_every_ghoul_a_job:0 "Кожному Гулеві — Роботу!"
TOC_every_ghoul_a_job_desc:0 "Гулі прибувають звідусіль. І одне відомо точно: їм потрібна робота. Ми створимо програми, щоб наші брати не тинялись вулицями, а працювали на благо."

TOC_bad_company:0 "Привиди Старого Світу"
TOC_bad_company_desc:0 "Стара група нацгвардійців прибула до нас і пропонує захищати наш народ в обмін на дім. Така угода — як не погодитись?"

TOC_an_old_fashioned_worldview:0 "Старомодний Світогляд"
TOC_an_old_fashioned_worldview_desc:0 "Іноді людям потрібно лише трішки старомодності."

TOC_the_old_world:0 "Старий Світ"
TOC_the_old_world_desc:0 "“Я любив гратися з маленькими літаками, коли був дитиною. Знаєш, такі — 'вжух-вжух'. Було весело. Тепер літаки — рідкість, але якщо ми зможемо їх підняти... Уяви лише можливості.” — Гроздан Хайков"

TOC_air_1:0 "Карти Польотів Старого Світу"
TOC_air_1_desc:0 "“Погодні карти, зоряні мапи, компаси... Як інакше зрозуміти, куди йти? Так, пустка поставила людство на коліна — я це знаю — але ми не дикуни! У нас є інструменти.” — Гроздан Хайков"

TOC_air_2:0 "Стратегія Повітряної Війни"
TOC_air_2_desc:0 "“Люди воювали літаками, бо знали: це потужна зброя. Я не кажу, що ми повинні воювати — ні. Але ми маємо бути готові, якщо війна постукає у наші двері.” — Гроздан Хайков"

toc_anewagevisionary:0 "Візіонер Нової Епохи"
toc_anewagevisionary_desc:0 "“Дехто каже: світ потребує візіонера — когось, хто бачить не те, що є, а те, чим може стати. Можливо, я — той самий. А може й ні. Це вирішить історія.” — Гроздан Хайков"

TOC_slaves_to_brotherhood:0 "Раби Братства"
TOC_slaves_to_brotherhood_desc:0 "Жахливе рішення довелося прийняти задля захисту свого народу. Тепер лишається тільки сподіватися, що наш володар буде хоч трохи милосердним..."

TOC_coal_mines:0 "Вугільні Шахти"
TOC_coal_mines_desc:0 "Спочатку все здавалося не таким уже й поганим. Але потім він почав змушувати наших громадян працювати в шахтах, видобуваючи вугілля для незрозумілих цілей. Кажуть, щовечора кількість робітників, що виходять з шахти, менша за тих, хто зайшов туди зранку."

TOC_experiments:0 "Темні Експерименти"
TOC_experiments_desc:0 "Вимоги Безсмертного спершу здавалися простими: «Використайте свою науку. Створіть для нас зброю», — казав він. Але з часом вони ставали дедалі жорстокішими. Згодом він зажадав, щоб ми почали випробовувати все це на людях... навіть на собі. Дехто з нас перетворився на чудовиськ — спотворених наукою і чадом вугільних шахт.\n\nЩо ми наробили?.."

TOC_liberation_day:0 "Свобода від Жаху"
TOC_liberation_day_desc:0 "Остання темрява, що вкривала Вашингтон, нарешті розвіяна. Спокан знову у безпеці. Попереду — важка робота з відбудови, але ніхто не зробить цього краще, ніж ми самі."

TOC_wardens_side:0 "На боці Джуліуса"
TOC_wardens_side_desc:0 "Вартові — це дисциплінована група, здатна нас захистити. Прислухатися до Джуліуса — не завжди найкраще для народу, але він знає, як навести лад. А це варте будь-яких кришок."

TOC_lionhearted:0 "На боці Ліама"
TOC_lionhearted_desc:0 "Ліам завжди був надійним другом і захисником. Його люди мають не так багато, як Вартові, але вони — чесні та доброзичливі. Лев'яросерді проведуть нас крізь бурю!"

TOC_friends_forever:0 "Друзі Назавжди"
TOC_friends_forever_desc:0 "З поверненням миру у Вашингтоні ми звертаємо погляд на північ, до наших гульських сусідів. Вінтерборн та його канадські залишки завжди хоробро чинили опір вторгненням. Спільні переговори — наш обов’язок у цей небезпечний час."

TOC_therapy_sessions:0 "Північні Друзі"
TOC_therapy_sessions_desc:0 "На півночі лежить нація Сайліксів, що в основному не втручалась до нападу рейдерів із Камло. Союз з ними був би мудрим кроком."

TOC_vault_45:0 "Глибоко Під Хвилями"
TOC_vault_45_desc:0 "Волхвині довірили нам свою найтемнішу таємницю: Сховище 45, що лежить під самим океаном. Колись, кажуть, психічна істота з цього сховища мучила їхніх Руноплетів. Жоден воїн не повернувся звідти, але, можливо, там є цінні залишки..."

TOC_a_real_starscream:0 "Тільки Боягузи Виживають"
TOC_a_real_starscream_desc:0 "Зрештою Родрігес переграв свого ватажка. Хоч він і не отримав корону, як сподівався, ми дали йому новий дім... та ще один шанс."

TOC_washington_cleanup:0 "Поділ Земель"
TOC_washington_cleanup_desc:0 "Ми ж не експансіоністи, правда? Поділити землю та повернути її тим, кого вбив Безсмертний — ось наш шлях. Та хоча їхні уряди були зруйновані, союз між нами зможе запобігти новим катастрофам."

TOC_working_with_wishmaidens:0 "Те, Що Залишилось"
TOC_working_with_wishmaidens_desc:0 "Волхвині були єдиними серед Ротпурґерів, хто прагнув просто повернутись додому і не мав наміру вбивати нас. Чому б не прийняти тих, хто залишився, назад до Сховища 100?"

#############################
### Rotpurgers ### Samson ###
#############################

ROT_samson:0 "Пограємо в Віщувальну Кулю"
ROT_samson_desc:0 "Жив-був чоловік у Спокані, давним-давно..."

ROT_samsons_teachings:0 "Хитрощі Самсона"
ROT_samsons_teachings_desc:0 ""Прислухайтесь, ви, бездумні нікчеми! Ми — лише люди без розуму! Нам кинуто виклик, і я зроблю так, що кожен супохльоб стане тактиком!" — Самсон Великий"

ROT_elite_trainers:0 "Лише Великі Гідні Служити Його Імені"
ROT_elite_trainers_desc:0 ""О, лиш найкращі з мужів можуть триматися мого знамена, як немовлята за материнське лоно! А всіх інших — до роботи, як жінок стародавніх часів!" — Самсон Великий"

ROT_samson_caps_exploitation:0 "Данина Його Величі"
ROT_samson_caps_exploitation_desc:0 ""Слабаки ніколи не зрозуміють, чому таким, як я, потрібні розкоші. Хіба не достатньо я дав вам? Хіба Пророк Нескінченності не заслуговує на візки вина і шкіру найкращих тварин?" — Самсон Великий"

ROT_muster_crusaders:0 "Зібрати Лицарів Нескінченності"
ROT_muster_crusaders_desc:0 ""Слухайте і виконуйте, мої благородні лицарі Інфінітуму! Темрява суне, і з нею — її демони. Ми маємо бути готові!" — Самсон Великий"

ROT_experience:0 "Ось Вони! Святі Гранати Його Величності!"
ROT_experience_desc:0 ""Дивіться, мої діти нескінченності! Гранати, сповнені знанням зір! Просто висмикни чеку — і кидай! Нехай вибух просвітить невіруючих до кривавого каші!" — Самсон Великий"

ROT_samson_timberline_goal:0 "Самсон, На Місці"
ROT_samson_timberline_goal_desc:0 ""О горе! Нам потрібна деревина для наших багать. Без вогню — я не спатиму! Хочете, щоб я бачив кошмари, діти мої?" — Самсон Великий"

ROT_greasing_lancers:0 "Зброя, Гідна Його Імені"
ROT_greasing_lancers_desc:0 ""Ваші рушниці — зламана жестянка, а патрони — іржаві цвяхи. НІ! Шукайте крамниці, допитуйте мандрівників! Я хочу зброю, яка не змусить мене плакати!" — Самсон Великий"

ROT_exalt_warriors:0 "Пожертви Слави"
ROT_exalt_warriors_desc:0 ""Навіть у нашій молодості, лицарі мої нескінченні, пам’ятайте: думати — це не ганьба! Інакше ви просто хулігани!" — Самсон Великий"

ROT_edgemere_tribes:0 "Старі Наречені Волхвинь"
ROT_edgemere_tribes_desc:0 ""Волхвині! О, як щедро вони допомогли мені дістатися до Сховища 100! Знайдіть їх, обійміть, одружіться! Нехай старий сексизм залишиться в минулому!" — Самсон Великий"

ROT_incendiary_rounds:0 "Благословенні Патрони"
ROT_incendiary_rounds_desc:0 ""Діти Інфінітуму! Припиніть стріляти дурними ручками! Орб знову прорік істину — наші набої горітимуть вогнем святої нескінченності!" — Самсон Великий"

ROT_food_for_the_fire:0 "Бенкет Для Гідних"
ROT_food_for_the_fire_desc:0 ""Дехто з вас вразив мене... Можливо, тому я обрав саме цю смажену частину м’яса. А ви — працюйте над нашими індустріальними цілями!" — Самсон Великий"

ROT_underground_workshops:0 "Давити Дрібноногих"
ROT_underground_workshops_desc:0 ""У лісах є істоти... великі чи малі — мені байдуже. Вбити, спалити, знищити! Жодної пощади!" — Самсон Великий"

ROT_samsons_support_tech_bonus:0 "Плацебо-Ефект"
ROT_samsons_support_tech_bonus_desc:0 ""Я чую ваш біль, діти мої. Вважаєте мене шарлатаном? А чи зможе самозванець, от як я зараз... ЗНИЩИТИ БІЛЬ — одним клацанням?" — Самсон Великий"

ROT_living_forever:0 "Ритуальні і Абсолютно Непотрібні Жертви"
ROT_living_forever_desc:0 ""Ви гадаєте, це безглуздо? Безумство? Ви просто не розумієте сили, що довкола. Віддайте мені своє — і я зроблю з нього щось велике!" — Самсон Великий"

ROT_samson_collection:0 "Вентилятори з Металу, Як Листя, Але... Гучніші"
ROT_samson_collection_desc:0 ""Згадаймо стародавні часи: фараони, Сфінкси, виноград... Вони мали листяні віяла. А ми? Ми матимемо металеві — на честь Самсона!" — Самсон Великий"

ROT_ballistic_weaponry:0 "Досконалі Вироби Сера Самсона"
ROT_ballistic_weaponry_desc:0 ""Ваші досягнення — це мої досягнення, бо ви — це я, а я — це шлях до світлого Самсонічного майбуття!" — Самсон Великий"

ROT_samson_wbh_goal:0 "До Нескінченності..."
ROT_samson_wbh_goal_desc:0 ""Я — скромний напівбог, і не злякаюсь жодного, хто вважає, що може мене залякати." — Самсон Великий"

ROT_wbh_seattle_capital:0 "Там, Куди Демони Не Насмілюються Йти"
ROT_wbh_seattle_capital_desc:0 ""Ви пам’ятаєте легенди про Сіетл? Братство, що оселилось у кривавих залах? Але ми — ми ті, хто здолав те місце, куди демони не посміли йти!" — Самсон Великий"

ROT_wbh_salvage:0 "А Тепер — Золота Корона!"
ROT_wbh_salvage_desc:0 ""Що було твоїм — тепер моє." — Самсон Великий"

ROT_samson_coalescence:0 "І Далі!"
ROT_samson_coalescence_desc:0 ""Пам’ятайте мої титули, мандрівники: Я — Самсон, Перший З Імені, Визволитель Сховища 100, Пророк Нескінченний, Божевільна Вісімка... і вбивця Безсмертного." — Самсон Великий"

##############################
### Rotpurgers ### Jacobia ###
##############################

ROT_jacobia:0 "Кара Спокана"
ROT_jacobia_desc:0 ""Кляті Волхвині намагались мене вбити. Самсон, той йолоп, хотів переграти мене. Але ось я — король у своєму замку, і світ найменше готовий до цього..." — Джейкобія"

ROT_rage_of_the_machine_1:0 "Давня Ненависть, Нарешті Вільна"
ROT_rage_of_the_machine_1_desc:0 ""Гроздан зі своїми науковими виродками зник. Тепер ми задаємо ритм, і хлопці просто в захваті від того, що буде далі." — Джейкобія"

ROT_rage_of_the_machine_2:0 "Наступний Крок (З Багатьох, Очевидно)"
ROT_rage_of_the_machine_2_desc:0 ""Скоро мобілізуємось повністю. Я не дозволю цим йобаним божевільним сучарам і далі бігати без нагляду. До кінця цієї війни Каскадія буде палати, і я вирішуватиму, хто житиме, аби побачити попіл." — Джейкобія"

ROT_jacobia_factories:0 "Будуємо Армію"
ROT_jacobia_factories_desc:0 ""Мені похуй, хто стане на заваді. Вбий його. І ще кого? Їх теж. Заводи мають працювати. Хрестовий похід не закінчився з тим ідіотом Грозданом." — Джейкобія"

ROT_recruit_them_all:0 "Заклик до Хрестового Походу"
ROT_recruit_them_all_desc:0 ""Мені байдуже, якщо хтось досі спить з плюшевим ведмедиком. Якщо він не з вогнеметом — він марний. Скликайте всіх. Навіть "пенсіонерів". Йдемо скоро." — Джейкобія"

ROT_jacobia_equipment:0 "Крутимо Вентилі, Ллємо Бензин"
ROT_jacobia_equipment_desc:0 ""Хочеш побачити, як гуля світиться? Дай повний тиск. Звук, як у бекону з кігтя смерті. Клянусь." — Джейкобія"

ROT_the_great_crusade_seattle:0 "Вавилонська Вежа"
ROT_the_great_crusade_seattle_desc:0 ""Мені все одно, хто зараз там командує в тому засніженому пеклі. Ми ввійдемо туди й спалимо все дотла." — Джейкобія"

ROT_the_great_crusade_koover:0 "Поховати Вінтерборна"
ROT_the_great_crusade_koover_desc:0 ""Старий мудак воює вже не першу війну, так? Час навідатись до нього та його братії по-домашньому." — Джейкобія"

ROT_the_great_crusade_syilx:0 "Чищення Озера"
ROT_the_great_crusade_syilx_desc:0 ""Хлопці щось казали — ніби ті виродки з Кувера допомагали цим Сайліксам, чи як там їх. А це значить — вони точно там ще шастають." — Джейкобія"

ROT_bounties_of_the_northern_armories:0 "Скарби Північних Арсеналів"
ROT_bounties_of_the_northern_armories_desc:0 ""О, подивіться тільки! Виявляється, ці йолопи мали щось варте уваги. Розбираємо все й дивимось, що з того вийде." — Джейкобія"

ROT_the_great_crusade_bdt:0 "Кінець Кісткових Танців"
ROT_the_great_crusade_bdt_desc:0 ""Ті покидьки в Орегоні, з їхніми червоними лісами і капюшонними гулеподібними виродками... Пора підпалити ті ліси. Декілька разів." — Джейкобія"

ROT_the_great_crusade_timberline:0 "Лісоповал Лінії Дерев"
ROT_the_great_crusade_timberline_desc:0 ""Нам треба шлях в Орегон. А ті лісоруби з півночі якраз можуть стати добрим містком. Якраз час зрубати їх." — Джейкобія"

ROT_the_great_crusade_kamlo:0 "Очищення Від Рейнджерів"
ROT_the_great_crusade_kamlo_desc:0 ""Камло — це старі трупи, що рухаються. Якщо хочемо дістатися лісів півночі — маємо позбутись їх." — Джейкобія"

ROT_the_great_crusade_broken_coast:0 "Фіорд Через Ріку"
ROT_the_great_crusade_broken_coast_desc:0 ""На Зламаному Узбережжі сидять найбільші виродки з цього боку пустки. Ми заберемо це собі. Пора пустити їхні кораблі на дно." — Джейкобія"

ROT_one_fucked_geck:0 "Той Самий Зіпсований GECK"
ROT_one_fucked_geck_desc:0 ""Один з ублюдків почав було пояснювати, що ми знайшли... доки ми не обпалили йому шкіру до самих кісток. Схоже на якийсь зіпсований GECK. Давайте кинемо його десь — подивимось, що вийде." — Джейкобія"

ROT_scourge_of_heaven:0 "Пара — Це Краще, Ніж Вогонь"
ROT_scourge_of_heaven_desc:0 ""Знаєте, після всього цього я подумав: чому б нам не апгрейднутись? У горах — парові технології. Ми, звісно, найкраще знаємо вогонь. Але пара... це щось новеньке. Та мені здається, я просто люблю вбивати. Кому й чому — неважливо. То чому б не робити це і заради цих виродків?" — Джейкобія"

  #######################################
  ### Rotpurgers ### Lady of the Lake ###
  #######################################

ROT_ladyofthelake:0 "Нехай Прокляті Будуть Нечестиві"
ROT_ladyofthelake_desc:0 "І так звершиться її воля."

ROT_nutrient_of_the_land:0 "Поживні Дарунки Землі"
ROT_nutrient_of_the_land_desc:0 "Вчення Леді відкривають перед нами істину про навколишні землі та багатства, які вони приховують. Її витончені методи перевершують ремесло будь-якого пустельника. Коли ми питаємо, звідки вона знає так багато, її голос стихає: \"Колись я присвятила своє життя природі.\""

ROT_bring_me_samson:0 "Приведіть Мені Того, Що Зветься Самсоном"
ROT_bring_me_samson_desc:1 "Цей боягуз нишпорить у тінях, нашіптуючи підступне своїй дивній кулі. Дехто вірить, що він бог, оповитий власним божевіллям. Ми спростуємо це смолою та пір’ям."

ROT_eradicating_the_purgers:0 "Трава Може Бути Й Зеленішою"
ROT_eradicating_the_purgers_desc:0 "Немає надії для тих, хто заблукав. Ми приносимо милосердя — очищення. Ротпургерів потрібно знищити до останку, аби вони не породили ще більші гидоти. Обшукуйте землю, спаліть її — не залишайте жодного дурня живим."

ROT_gifts_of_the_clergy:0 "Дарунки Духовенства"
ROT_gifts_of_the_clergy_desc:0 "Розпорошені Волхвині зібралися під одним знаменом після падіння Ротпургерів. Тепер, коли ніхто їм не заважає, віра шириться Споканом безперешкодно."

ROT_gracious_maidens:0 "Материнський Погляд На Все Щире"
ROT_gracious_maidens_desc:0 "Легенда каже, що Леді була науковицею — однією з великих розумів-засновниць Сховища 100. Але вона була першою, хто змінився, першою, хто використав даровану силу — і за це її вигнали. Нині ж, в ім’я Леді, що любить усіх — поділимось її спадщиною!"

ROT_gather_the_huntsmen:0 "Зібрати Жінок-Мисливиць"
ROT_gather_the_huntsmen_desc:0 "Не всі жінки зі Сховища 100 приєдналися до віри Леді. Ті, що залишились, не мають кому служити — ми приймемо їх з відкритими обіймами."

ROT_peacekeeping_the_panhandle:0 "Мир на Крайці"
ROT_peacekeeping_the_panhandle_desc:0 "Прокляті та зіпсовані досі чатують у лісах Спокана. Ми зберемо силу — духовне братство, яке протистоятиме злу з вогнем у серцях, а не у руках."

ROT_working_tirelessly:0 "Працювати День і Ніч"
ROT_working_tirelessly_desc:0 "Праці Леді потребують відважних вчинків. Така ціна за захист духовенства. Ми мусимо не відставати від вимог покровителів."

ROT_open_the_gates:0 "Вашингтон — Дім Для Всіх"
ROT_open_the_gates_desc:0 "Наш захист не лишився непоміченим. Поки жахи душать Сієтл, а земля загоює рани війни за Сховище 100, люди повертаються з далеких країв. І ми їх приймемо."

ROT_gifts_of_the_wishmaidens:0 "Благословення Нашої Леді"
ROT_gifts_of_the_wishmaidens_desc:0 "Ця земля була зрощена кров’ю і вірою. І хоча віра змінювала обличчя, наш спосіб життя зміцнів, а вакуум влади — заповнений. Ми більше не потерпимо жодної наруги від ворогів."

ROT_brotherhood_of_darkness:0 "Братство Темряви"
ROT_brotherhood_of_darkness_desc:0 "\"Палахкотить полум’я безумства на заході. Жахи гніздяться в глибині міста. Броня, яку я пам’ятаю з екранів у юності... Її слід звільнити, аби Спокан залишився у безпеці.\" — Леді"

ROT_the_maidens_passion:0 "Двічі Скорені, Та Все Ще Залишилось Що Доводити"
ROT_the_maidens_passion_desc:0 "Спокан пережив багато лих і багатьох господарів. Методи, ні — запобіжники, мають бути вжиті, аби зберегти нашу присутність."

ROT_fanatics_of_the_steam:0 "Уперед, Через Ідольські Тумани"
ROT_fanatics_of_the_steam_desc:0 "Божевільні ритми гримлять у каньйонах півдня. Люди чужої віри, народженої з зараженої пари, роз’їдають розум. Їх треба зупинити — інакше їхній хрестовий похід прийде до нас."

ROT_banish_the_dark:0 "Вигнати Темряву"
ROT_banish_the_dark_desc:0 "Ми прочешемо руїни Сієтлу, роздираючи кожен клаптик землі у пошуках цих металевих виродків. Якщо треба, витягнемо їх із броні й кинемо у ту саму кригу, якою вони топили кров."

ROT_harness_the_steam:0 "Озера Небес"
ROT_harness_the_steam_desc:0 "\"Що є Пар, як не Озеро в небесах? А що є Озеро в небесах, як не наше право за народженням?\" — Галі, Верховна Клерикеса"

ROT_teachings_of_our_fair_lady:1 "Не Забувайте, Що Було"
ROT_teachings_of_our_fair_lady_desc:1 "\"Благословенні творці миру\", — колись сказала вона. З її благословенням ми підемо далі — будь-якою ціною."

ROT_wishmaidens_core_wbh:0 "Безсмертний — Більше Ні"
ROT_wishmaidens_core_wbh_desc:0 "Покруч, що спустошував Вашингтон, залишки цього так званого Братства, знищено. Люди бачать у нас героїв — навіть попри страх.\n\nНарешті, Вашингтон належить нам."
ROT_wishmaidens_core_wbh_tt:0 "Постійне локальне зниження вартості націоналізації на §G50%§! для всіх початкових регіонів §Y[WBH.GetNameWithFlag]§! та §Y[TCA.GetNameWithFlag]§!."

ROT_wishmaidens_core_hea:0 "Ворота Пали"
ROT_wishmaidens_core_hea_desc:0 "Пар зломлено, і стяг Леді здіймається високо.\n\nТак, як і повинно бути."
ROT_wishmaidens_core_hea_tt:0 "Постійне локальне зниження вартості націоналізації на §G75%§! для всіх початкових регіонів §Y[HEA.GetNameWithFlag]§!."

