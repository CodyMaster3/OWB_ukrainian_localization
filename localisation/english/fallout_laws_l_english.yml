l_english:
# conscription laws
  # conscription laws Generic
  settlement_levies:0 "Ополчення поселень"
  settlement_levies_desc:0 "Від самого початку відбудови цивілізації система децентралізованого та локального збору військ, обмежена окремими поселеннями, добре служила нам у кожному конфлікті до цього часу. Хоча це й не ефективно в стратегічному масштабі, вербування офіцерів і розбудова регіональних тренувальних баз дозволяють нам залишати солдатів відносно близько до дому, що підвищує як моральний дух, так і кількість цивільних резервів."
  volunteer_militia_conscription:0 "Ополчення Пустки"
  volunteer_militia_conscription_desc:0 "З огляду на постійні загрози з боку Пустки та сусідніх націй, нам було б корисно реформувати нашу армію в щось більш стратегічно обґрунтоване. Організація призовників у регіональні ополчення дозволяє нам підвищити ефективність командування, не відриваючи їх від дому, а збільшення фінансування, виділеного на навчання та вербування, збільшує наші сили."
  funded_militia_conscription:0 "Фінансоване ополчення"
  funded_militia_conscription_desc:0 "Інвестувати ще більше в нашу організацію — це розумне рішення, враховуючи стан Пустки. Спрямування коштів на будівництво військових баз дозволяє нам ще більше сконцентрувати наші сили, а також забезпечити посилену структуру, в якій наші солдати зможуть вільніше тренуватися зі своїми новими «іграшками», які платники податків люб'язно допомогли придбати."
  two_year_conscription:0 "Дворічна повинність"
  two_year_conscription_desc:0 "Примусова військова повинність для нашого населення може зробити багатьох людей дуже нещасними, але, на жаль, це рішення ми мусимо прийняти, щоб належним чином підготуватися. Щоб мінімізувати наслідки призову, на законодавчому рівні буде впроваджено дворічну ротацію, що має дати нашим призовникам перепочинок і світло в кінці тунелю."
  four_year_conscription:0 "Чотирирічна повинність"
  four_year_conscription_desc:0 "Продовження військової повинності до чотирирічної ротації значно збільшить наші людські ресурси, але це матиме наслідки. Величезні кошти доведеться виділити на підготовку призовників до гідного рівня для нашої армії, а моральний дух повільно падає, навіть якщо наші громадяни розуміють ситуацію. Ми повинні бути обережними, якщо хочемо йти далі."
  until_dismissal_conscription:0 "Служба до демобілізації"
  until_dismissal_conscription_desc:0 "Відтепер наш уряд офіційно оголосив надзвичайний стан. Кожен призовний пункт має працювати понаднормово, а призовники будуть демобілізовані лише тоді, коли ми визнаємо їх більше не потрібними, або коли мине надзвичайна ситуація. Оскільки моральний дух зараз стрімко падає, адже цивільних забирають навіть із заводів та їхніх домівок, ми маємо пам'ятати, що робимо це для збереження нашого способу життя."
  child_conscription:0 "Війна ніколи не змінюється"
  child_conscription_desc:0 "Цивільні, вирвані зі своїх домівок; батьки, матері; сини, доньки. Але який у нас вибір перед обличчям апокаліпсиса? Чи маємо ми дозволити собі загинути, чи не повинні ми боротися з нашою долею до гіркого кінця? Вже зараз примусовий призов і тренування перетворюють добрих людей на порожні оболонки. Наша нація може ніколи нас не пробачити. Наші громадяни ненавидітимуть нас, наші офіцери зневажатимуть нас, а наша культура може ніколи не відновитися повністю. Але все це варте того, щоб залишити вистояти націю, сповнену ненависті. Будь проклята Пустка за те, що не залишила нам вибору, і будь прокляті наші душі за те, що пішли цим шляхом. Війна справді ніколи не змінюється."
  # conscription laws Caesar's Legion
  tribal_recruitment:0 "Гастати з племен"
  tribal_recruitment_desc:0 "Вербування виключно з наших підкорених племен пропонує Легіону багато переваг. Дикуни славляться своїм бойовим духом і сміливістю солдатів, що підвищить нашу ефективність у бою. Вербування лише з племен також означатиме, що нашою армією командуватимуть їхні ж люди, оскільки вожді та інші високопосадовці керуватимуть рядовими."
  incorporate_mercenaries:0 "Наймані когорти"
  incorporate_mercenaries_desc:0 "На додаток до наших племінних сил, ми можемо оплатити та інтегрувати велику кількість найманців на вищі офіцерські посади та в рядовий склад з мінімальним впливом на структуру нашої армії, покращуючи наш кадровий резерв без значного зниження бойового духу наших сил."
  settler_volunteers:0 "Завербовані ауксиларії"
  settler_volunteers_desc:0 "Проведення широкої кампанії з вербування серед поселенців на наших землях принесе значну кількість наївних рекрутів, готових померти за нас або отримати платню. Така величезна кількість неплемінних новобранців на додаток до найманців неодмінно знизить організацію нашої армії, а також посіє невдоволення у рядовому складі, що все ще здебільшого складається з племен."
  conscript_settlers:0 "Мобілізовані принципи"
  conscript_settlers_desc:0 "У міру того, як Бик піднімається, нам потрібно все більше людей для підживлення наших завоювань. Призов поселенців на додаток до наших інших зусиль забезпечить нас необхідною кількістю солдатів для продовження завоювань, але це неодмінно глибоко похитне структуру нашої армії. З призовників виходять погані солдати, і вони потребують більше тренувань, ніж добровольці. Наказ про призов також налаштує частину людей проти нас."
  conscript_children_of_caesar:0 "Нові тріарії"
  conscript_children_of_caesar_desc:0 "Знищення культури — один із найсильніших інструментів у розпорядженні Легіону. Поселенці, торговці, найманці та рейдери — всі вони перетворюються за зразком Легіону, так само, як римляни робили з Галлією. Ми переробимо Пустку за нашою власною подобою — і що ми отримаємо? У нас буде армія вірних солдатів, готових померти за нашу справу."
  # conscription laws Mexican Nations
  tlaloc_stagnation:0 "Стагнація Тлалока"
  tlaloc_stagnation_desc:0 "Оскільки могутній Тлалок десятиліттями захищав більшу частину Мексики, мало хто з мексиканських націй має регулярну армію чи навіть федеральне ополчення. Як наслідок, ресурси можна легко перенаправити на внутрішні справи, і запанувала мирна атмосфера, оскільки люди відчувають себе в безпеці під Його керівництвом. Однак це не може тривати вічно."
  frontier_militias:0 "Прикордонне ополчення"
  frontier_militias_desc:0 "Організація добровольчих ополчень громадян у національні збройні сили значно підвищить наш військовий потенціал, при цьому зберігаючи мир і відволікаючи мінімальні ресурси на їх навчання та озброєння. Хоча це тимчасове рішення, воно все одно може дати нам час, необхідний для належного озброєння наших сил."
  adelitas_militias:0 "Ополчення аделіт"
  adelitas_militias_desc:0 "Коли потреба в більшій кількості солдатів стає очевидною, ми можемо застосувати просте, але ефективне рішення. Дозвіл жінкам-доброволицям вступати до наших армій обов'язково збільшить наші лави і забезпечить нас незліченною кількістю здібних солдатів. Однак впровадження цього заходу може стурбувати частину нашого населення, оскільки вони бачать зростаючу мілітаризацію, що може зруйнувати відчуття миру, яке так довго панувало в Мексиці."
  standing_garrisons:0 "Національні гарнізони"
  standing_garrisons_desc:0 "Реформування нашої армії у справжню мобільну силу, здатну до ефективних стратегічних пересувань, є важким завданням. Однак коли це буде зроблено, мілітаризація нашого суспільства нарешті завершиться, що підвищить нашу внутрішню підтримку у випадку війни, а також залучить багато нових рекрутів до нашої справи. На жаль, тепер населення чітко усвідомлює, що в Мексиці вирує полум'я війни, і з часом буде нервувати все більше."
  mexican_conscription:0 "Gloria Mexicana"
  mexican_conscription_desc:0 "Впровадження масштабної програми призову в кожному секторі, від полів до заводів, залучить до нашої справи незліченну кількість солдатів і дозволить будь-якому з наших ворогів відчути на собі повний гнів народу Мексики. Але, натомість, такий крок є вкрай непопулярним і також забере життєво необхідні кадри з деяких наших фабрик."
  # conscription laws Brotherhood
  paladins:0 "Паладини"
  paladins_desc:0 "Пустка — надзвичайно суворе місце. Нашим зовнішнім силам доведеться зіткнутися не лише з рейдерами та мутантами, а й із осередками радіації, нестачею їжі чи води та постійним ризиком завалів у міських зонах. Тому ми вирішимо відправляти в це суворе місце лише найкращих із найкращих. Лише знамениті паладини, найвищий ранг, якого можуть досягти наші солдати, будуть розгорнуті. Вони стануть мечем Братства, а також його щитом."
  senior_knights:0 "Старші лицарі"
  senior_knights_desc:0 "Оскільки потреба поширювати наш вплив у Пустці стає дедалі відчутнішою, ми змушені йти на компроміси все частіше. Неможливо ефективно контролювати величезні території солдатами, які потребують років досвіду перед відправленням. Дозвіл старшим лицарям — видатним солдатам, що стоять лише на один ранг нижче за паладінів — відправлятися разом із ними в якості підтримки, підсилить наші війська і при цьому дозволить відправляти в Пустку лише найкращих."
  knights:0 "Лицарі"
  knights_desc:0 "Оскільки підготовка старших лицарів досі займає багато часу, а їх кількість у нашому і без того малому кадровому резерві невелика, нам слід розглянути можливість дозволити перевіреним лицарям діяти разом із вищими рангами. Лицарі — це все ще загартовані в боях солдати, які заслужили не лише своє звання, а й найкращу зброю, яку ми можемо їм дати. Їх розгортання завдасть шкоди ефективності наших сил, але це дозволить нам мати набагато більше підрозділів, готових захищати Братство."
  scribes:0 "Писарі"
  scribes_desc:0 "Потреба у військах є колосальною. Ми не можемо підтримувати нашу військову окупацію та кампанії лише перевіреними солдатами з наших бункерів. Писарі — компетентні техніки, готові допомогти нашій справі, і ми можемо використовувати їх як рядових солдатів під захистом лицарів і паладинів. Але це означатиме, що вони не будуть у безпеці в бункері, вивчаючи технології. Відправка наших науковців на поле бою також неодмінно змусить частину громадян втратити віру в нашу справу."
  initiates:0 "Послушники"
  initiates_desc:0 "Послушники — це численна група новобранців, яким ще потрібно багато тренуватися, перш ніж стати лицарями. У випадку надзвичайної небезпеки ми можемо вирішити розгорнути їх до того, як вони отримають це звання. Зробивши так, ми отримаємо війська, які потребують небагато тренувань, і значно збільшимо розмір нашої армії. Але це також означатиме відправку нетренованих новобранців у Пустку, що неодмінно відверне від нас багатьох громадян. Слід бути обережними, оскільки це рішення не приймається легковажно."
  # conscription laws Raiders
  petty_gang_conscription:0 "Призов дрібних банд"
  petty_gang_conscription_desc:0 "Багато хто глузує з наших нинішніх рейдерів, вважаючи їх не більше ніж прикрою неприємністю. Але ми можемо залякати інші банди та змусити їх приєднатися до нас."
  raider_bands:0 "Рейдерські ватаги"
  raider_bands_desc:0 "Тепер, коли ми зібрали набагато більше сили і, що важливіше, значно більше зброї, ми можемо просто почати стріляти на всі боки. Хоча це може марно витратити боєприпаси і змусити деяких дурнів втратити сон, це майже напевно приверне рейдерські банди, які захочуть приєднатися до веселощів. А щодо тих, хто не захоче, нам просто треба наставити цю зброю на них."
  scum_and_villainy:0 "Покидьки та лиходії"
  scum_and_villainy_desc:0 "Хоча ми ніколи не зможемо залякати найзапекліші військові банди, ми безумовно можемо пообіцяти їм цілу бочку веселощів, а також кілька сотень бочок справжньої вибухівки. Разом із собою вони принесуть не лише роки досвіду, здобуті в підбурюванні рейдерів, але й більше живої сили, ніж ми знаємо, куди подіти."
  threat_to_all_people:0 "Загроза для всіх"
  threat_to_all_people_desc:0 "Навіщо обмежуватися нашою бандою для вербування? Це дріб'язок. Піднімаймо планку ще вище! Ми організуємо десятки... ні, сотні рейдерських вилазок на сусідні території. Підірвемо все до бісової матері, здіймемо галас, залишимо кілька візитівок між палаючими тілами та ямою з гвинтом. Це неодмінно принесе свіжу кров!"
  doom_of_wasteland:0 "Фатум Пустки"
  doom_of_wasteland_desc:0 "Завдяки величезній репутації, яку ми зараз маємо, нас бояться всі, хто про нас знає. Ще трохи зусиль у, е-е... «рекламній кампанії», і ми могли б навіть залучити до себе справжніх солдатів. У Пустці не бракує незадоволених піхотинців та офіцерів, які були б раді розслабитися в житті рейдера, настав час використати це на нашу користь."
  # conscription laws Tribals
  born_warriors:0 "Природжені воїни"
  born_warriors_desc:0 "Згідно з традицією нашого племені, ми повинні гарантувати, що лише наш клас воїнів коли-небудь ступить за межі наших сіл. Пустка — жорстоке місце, повне жахливих створінь і дикунів. Ми повинні вживати надзвичайних запобіжних заходів при розгортанні наших людей, і тому лише воїни, навчені від народження, можуть заслужити честь вести війну за плем'я."
  veteran_pathfinders:0 "Ветерани-слідопити"
  veteran_pathfinders_desc:0 "Хоча порушувати стародавню традицію може бути помилкою, нам слід розглянути можливість збільшення наших людських ресурсів на полі бою. Племені потрібно більше своїх людей для захисту, тому ми розглянемо можливість розгортання наших найдосвідченіших слідопитів і мисливців разом із нашим класом воїнів, підтримуючи їх у благородній боротьбі проти жорстокої Пустки."
  able_bodied_tribesmen:0 "Здорові одноплемінники"
  able_bodied_tribesmen_desc:0 "Зовнішній світ постійно б'є і виснажує наше плем'я, небезпеки оточують нас з усіх боків. Ми можемо не вижити без радикальних заходів, тому тепер ми будемо відправляти кожного здорового одноплемінника. Сміливі, навчені й такі, що пройшли найважчий воїнський ритуал нашого племені, вони — стійкі бійці, готові захищати нашу землю."
  first_sons_and_daughters:0 "Перші сини та доньки"
  first_sons_and_daughters_desc:0 "Присоромлені та принижені нашими ворогами, ми повинні шукати порятунку у внутрішній силі нашого племені. Хоча дуже тривожно вдаватися до таких заходів, ми тепер повинні запровадити загальну повинність для кожного першого сина та доньки призовного віку всіх членів племені. Це суворе рішення, яке далося нелегко, і ми докладемо всіх зусиль, щоб використати їх для вищої мети."
  children_and_mothers:0 "Діти та матері"
  children_and_mothers_desc:0 "Кровожерливі дикуни стоять біля наших дверей. Нам загрожує не менше ніж повне знищення нашого способу життя, а також кожного члена нашого благородного племені. Нехай наші боги пробачать нас за те, що ми зробимо, але ми не маємо іншого вибору, окрім як відправити всіх у бій, чи то дітей, ледь здатних махнути ножем, чи їхніх матерів, які намагаються їх захистити. Найменше, що ми можемо зробити, це розгорнути їх разом. Нехай Вони змилуються над нашими грішними душами, бо наша совість не матиме милосердя."
  # conscription laws NCR
  ncr_disarmed_nation:0 "Корпус мирного часу"
  ncr_disarmed_nation_desc:0 "НКР утримує символічні збройні сили, віддаючи перевагу використанню економіки та інших форм «м'якої сили» для здійснення свого впливу за кордоном."
  ncr_volunteer_militia_conscription:0 "Добровольча армія"
  ncr_volunteer_militia_conscription_desc:0 "З огляду на постійні загрози з боку Пустки та сусідніх націй, нам було б корисно реформувати нашу армію в щось більш стратегічно обґрунтоване. Сенат НКР дозволив вербування добровольців для формування нових збройних сил."
  ncr_funded_militia_conscription:0 "Повністю фінансована армія"
  ncr_funded_militia_conscription_desc:0 "Інвестувати ще більше в нашу організацію — це розумне рішення, враховуючи стан Пустки. Спрямування коштів на будівництво військових баз дозволяє нам ще більше сконцентрувати наші сили, а також забезпечити посилену структуру, в якій наші солдати зможуть вільніше тренуватися зі своїми новими «іграшками», які платники податків люб'язно допомогли придбати."
  ncr_two_year_conscription:0 "Дворічна повинність"
  ncr_two_year_conscription_desc:0 "Примусова військова повинність для нашого населення може зробити багатьох людей дуже нещасними, але, на жаль, це рішення ми мусимо прийняти, щоб належним чином підготуватися. Щоб мінімізувати наслідки призову, на законодавчому рівні буде впроваджено дворічну ротацію, що має дати нашим призовникам перепочинок і світло в кінці тунелю."
  ncr_four_year_conscription:0 "Чотирирічна повинність"
  ncr_four_year_conscription_desc:0 "Продовження військової повинності до чотирирічної ротації значно збільшить наші людські ресурси, але це матиме наслідки. Величезні кошти доведеться виділити на підготовку призовників до гідного рівня для нашої армії, а моральний дух повільно падає, навіть якщо наші громадяни розуміють ситуацію. Ми повинні бути обережними, якщо хочемо йти далі."
  ncr_until_dismissal_conscription:0 "Служба до демобілізації"
  ncr_until_dismissal_conscription_desc:0 "Відтепер наш уряд офіційно оголосив надзвичайний стан. Кожен призовний пункт має працювати понаднормово, а призовники будуть демобілізовані лише тоді, коли ми визнаємо їх більше не потрібними, або коли мине надзвичайна ситуація. Оскільки моральний дух зараз стрімко падає, адже цивільних забирають навіть із заводів та їхніх домівок, ми маємо пам'ятати, що робимо це для збереження нашого способу життя."
  ncr_child_conscription:0 "Війна ніколи не змінюється"
  ncr_child_conscription_desc:0 "Цивільні, вирвані зі своїх домівок; батьки, матері; сини, доньки. Але який у нас вибір перед обличчям апокаліпсиса? Чи маємо ми дозволити собі загинути, чи не повинні ми боротися з нашою долею до гіркого кінця? Вже зараз примусовий призов і тренування перетворюють добрих людей на порожні оболонки. Наша нація може ніколи нас не пробачити. Наші громадяни ненавидітимуть нас, наші офіцери зневажатимуть нас, а наша культура може ніколи не відновитися повністю. Але все це варте того, щоб залишити вистояти націю, сповнену ненависті. Будь проклята Пустка за те, що не залишила нам вибору, і будь прокляті наші душі за те, що пішли цим шляхом. Війна справді ніколи не змінюється."
# conscription laws NCN
  ncn_disarmed_nation:0 "Нащадки засновників Нового Ханаану"
  ncn_disarmed_nation_desc:0 "Ми — ханаанеяни, і наше завдання — поширювати просвітництво та слово Господнє у Пустці. Наша Біблія велить нам бути милосердними, і тому ми даємо притулок іншим. Але цей притулок потрібно захищати, і це наш обов'язок. Ми — Обраний Народ, а це означає, що наш обов'язок як нащадків засновників Нового Ханаану є важчим, ніж у будь-кого іншого."
  ncn_volunteer_militia_conscription:0 "Нащадки навернених"
  ncn_volunteer_militia_conscription_desc:0 "Загрози Пустки, такі як Білоногі, говорять нам про те, що нам потрібно більше людей, які б узяли до рук зброю, щоб захистити наш дім. Нащадки тих, хто колись прийняв слово Христове, якраз підходять для цієї ролі. Можливо, перекладати наш борг на інших — неправильно, але у нас просто немає вибору."
  ncn_funded_militia_conscription:0 "Навернені у віру"
  ncn_funded_militia_conscription_desc:0 "Господь велить нам бути милосердними, але у нас просто немає вибору через загрози зовнішнього світу. Відтепер, якщо ви хочете стати Братами і Сестрами Нового Ханаану, ви повинні служити в армії. Так, таким чином ми відмовимо в допомозі багатьом, але нам потрібно це зробити."
  ncn_two_year_conscription:0 "Навернені дикуни"
  ncn_two_year_conscription_desc:0 "Озброювати дикунів зброєю — неправильно. Вони не пам'ятають гріхів своїх предків, вони можуть побудувати новий світ, а ми запевняємо їх, наче вбивство людей з іншою вірою — це діяння, угодне Христу. Це порушення всіх принципів нашої віри."
  ncn_four_year_conscription:0 "Місіонери-вербувальники"
  ncn_four_year_conscription_desc:0 "Відтепер усі наші місіонери будуть переконувати людей, що Новий Ханаан — це земля обітована. Тільки захищаючи її, можна потрапити на небеса, а загиблі за її захист автоматично звільняються від усіх гріхів. Так, ми не тільки порушуємо основи нашої віри, але й спотворюємо те, що написано в Біблії."
  ncn_until_dismissal_conscription:0 "Стирання конфесійних відмінностей"
  ncn_until_dismissal_conscription_desc:0 "Ми почнемо призивати на службу не лише мормонів та ханаанеян, а й усіх інших християн, які живуть у Пустці. Нащадків тих, хто прийшов з Мексики і вірить у Санта-Муерте. Біженців з Небесної Варти, які поклоняються Парі. Навіть протестантів із Зміїної долини. Всі вони будуть захищати нашу віру, подобається їм це чи ні."
  ncn_child_conscription:0 "Навернення силою"
  ncn_child_conscription_desc:0 "Раніше у людей був вибір — прийняти слово Христове, взяти відповідальність за власну долю і свідомо спокутувати свої гріхи, або просто залишитися жити на наших землях. Тепер ми не даємо такого вибору. Кожен, хто живе на наших землях, буде змушений прийняти нашу віру і всі пов'язані з нею обов'язки, навіть якщо не хоче цього. Це повністю суперечить основам християнства, ідеї добровільного спокутування. Ми змушуємо людей робити це силою, а не словом. А отже, ми горітимемо в пеклі до Другого Пришестя Христа. Нам залишається лише сподіватися, що наші діти, заради яких ми скоюємо всі ці гріхи, скасують все це заради спасіння своїх власних душ."
# conscription laws TWO and NAV
  TWO_legionem_foederati:0 "Legionem Foederati"
  TWO_legionem_foederati_desc:0 "Завдяки Легіону Цезаря ми більше не є просто дикунами в Пустці. Але водночас ми продовжуємо битися так, як звикли, використовуючи тактику, що найкраще працює для нас."
  TWO_barbarisque_auxiliis:0 "Barbarisque Auxiliis"
  TWO_barbarisque_auxiliis_desc:0 "Тепер ми є частиною нової ідеї, нового суспільства та бачення світу. Ми повинні використовувати не лише традиційні для нас тактики, а й основу військової машини — піхоту."
  TWO_equites_cohortes:0 "Equites Cohortes"
  TWO_equites_cohortes_desc:0 "Ми повинні використовувати не лише нашу тактику, а й погляди Легіону на ведення війни, такі як використання великих формувань, логістики, облогових знарядь та багато іншого. І історія Риму може дати нам усе це."
  TWO_sociis:0 "Sociis"
  TWO_sociis_desc:0 "Ми запозичили в Легіону достатньо, щоб вважатися якщо не повноправними громадянами цієї нової нації, то принаймні не надто відмінними від них. Звісно, це означає віддання забуттю наших традицій, наших богів і предків. Але такою є ціна за місце в Новому Світі."
  TWO_alae:0 "Alae"
  TWO_alae_desc:0 "Спеціалізовані кавалерійські підрозділи у Стародавньому Римі називалися алами (alae). Хіба машини, які ми використовуємо, не гідні посісти їхнє місце? Ми досягли ідеального синтезу військової машини Легіону та наших традицій, маючи лише сильні сторони і жодних слабких. Звісно, це також означає, що наші воїни — це вже радше легіонери Двох Сонць, які славлять Вулкана, а не Нааса. Якби наші боги справді мали силу, вони б знищили нас за таку зраду."
# conscription laws NAV
  NAV_legionem_foederati:0 "Legionem Foederati"
  NAV_legionem_foederati_desc:0 "Завдяки Легіону Цезаря ми більше не є просто дикунами в Пустці. Але водночас ми продовжуємо битися так, як звикли, використовуючи тактику, що найкраще працює для нас."
  NAV_barbarisque_auxiliis:0 "Barbarisque Auxiliis"
  NAV_barbarisque_auxiliis_desc:0 "Тепер ми є частиною нової ідеї, нового суспільства та бачення світу. Ми повинні використовувати не лише традиційні для нас тактики, а й основу військової машини — піхоту."
  NAV_equites_cohortes:0 "Equites Cohortes"
  NAV_equites_cohortes_desc:0 "Ми повинні використовувати не лише нашу тактику, а й погляди Легіону на ведення війни, такі як використання великих формувань, логістики, облогових знарядь та багато іншого. І історія Риму може дати нам усе це."
  NAV_sociis:0 "Sociis"
  NAV_sociis_desc:0 "Ми запозичили в Легіону достатньо, щоб вважатися якщо не повноправними громадянами цієї нової нації, то принаймні не надто відмінними від них. Звісно, це означає віддання забуттю наших традицій, наших богів і предків. Але такою є ціна за місце в Новому Світі."
  NAV_vexillatio:0 "Vexillatio"
  NAV_vexillatio_desc:0 "Vexillatio (вексиляції) — це спеціальні мобільні підрозділи в римській армії з гнучкою структурою, які створювалися і розпускалися за потреби. Для легіонів Риму це забезпечувало гнучкість в оперативних діях. У такий спосіб ми отримаємо ідеальну тактику для маневрової війни, до якої ми звикли. Звісно, дехто скаже, що наша відмова від шляхів предків накличе гнів Нааглоші, але це єдиний спосіб зберегти хоча б частину нашої культури в цьому Новому Світі."
# Communist recruitment laws
  recruitment_communist_rifle_law:0 "Герої Революції"
  recruitment_communist_knife_law:0 "Обов'язок Народу"
  recruitment_communist_law:0 "Велика Вітчизняна війна"
# conscription laws ghouls
  ghoul_military_in_both_lives:0 "Військові в обох життях"
  ghoul_military_in_both_lives_desc:0 "Ми довіряємо свій захист лише тим, у чиїх навичках абсолютно впевнені. Це бійці Національної гвардії, військові та рейнджери, які ще пам'ятають часи Сполучених Штатів. Їх небагато, але вони найкращі з найкращих, а тому ми можемо бути впевнені, що втрати серед них будуть мінімальними."
  ghoul_volunteers:0 "Служба для добровольців"
  ghoul_volunteers_desc:0 "Через втрати ми змушені відкрити шлях до військової служби для добровольців. Так, вони набагато гірше навчені, ніж ті, хто проходив підготовку за стандартами Старого Світу. Але водночас вони все одно кращі за середньостатистичну людину, адже багато з них виживають у Пустці вже майже два століття."
  ghoul_conscription:0 "Призов"
  ghoul_conscription_desc:0 "У зв'язку з поточними подіями ми змушені вдатися до призову тих ґулів, які повністю зберегли свій розум. Звісно, мало кому це сподобається. Але це вимушений захід для збереження нашого народу."
  ghoul_feral_ones:0 "Майже здичавілі"
  ghoul_feral_ones_desc:0 "У нас не залишається іншого вибору, окрім як призивати на військову службу тих, кого зазвичай уникають навіть ґулі — здичавілих ґулів. Їх майже неможливо контролювати, тому наша армія перетвориться на некероване стадо, що покладається більше на інстинкти, ніж на тактику і стратегію. Наші майже інстинктивні побратими незабаром будуть використані як гарматне м'ясо, яке кидатимуть на ворожі кулемети з простого розрахунку: у нас більше здичавілих ґулів, ніж у ворога боєприпасів."
# conscription laws BLC
  BLC_local_private_armies:0 "Компромісні"
  BLC_local_private_armies_desc:0 "Угода, відома як Компроміс, що дала рейдерам з пенітенціарної установи Тіббетса право на життя, мала свої зобов'язання. Вони не були знищені і звільнені від низки законів, що стосуються вживання наркотиків і п'янства. Але вони складатимуть основу наших збройних сил і повинні будуть служити в нашій армії, незважаючи ні на що. Хоча це, можливо, залишає нам менше воїнів на полі бою, ніж у наших сусідів, вони безперечно мають досвід у військовій справі, і ніхто не сумуватиме за ними, якщо вони вріжуть дуба."
  BLC_free_banderiums:0 "Бандерії"
  BLC_free_banderiums_desc:0 "Система бандерій, хоч і сильно децентралізована, є кроком у правильному напрямку. Наші військові лідери та місцеві польові командири зобов'язані брати участь в обороні країни в обмін на податкові пільги та інші привілеї. Вони повинні прибути із визначеною кількістю військ і заданою якістю спорядження, цифри яких зафіксовані в Компромісі. Невиконання цього обов'язку карається настільки суворо, що до цього часу ніхто не ризикнув випробувати удачу."
  BLC_semi_centralized_banderiums:0 "Армія Трьох"
  BLC_semi_centralized_banderiums_desc:0 "Хоча надання фракціям усередині Чорного Каньйону права утримувати власні приватні армії здається фатальним кроком, нам потрібно більше розгорнутої живої сили на полі бою. Делегування цього права Загону Биків, Салону та Пенітенціарній установі централізує їхні сили принаймні вдома — і це може стати останньою підготовкою перед тим, як ми зможемо мати єдину централізовану армію."
  BLC_one_common_army:0 "Єдина спільна армія"
  BLC_one_common_army_desc:0 "Ми — нація з центральним урядом, і хоча підтримка високої автономії підвладних нам людей є корисною, оборона батьківщини має бути організована саме тут. Кожен братиме участь у військових зусиллях; відправляючи своїх синів і дочок, виготовляючи єдину зброю та форму, якими користуватиметься армія, і не піддаючи сумніву наш авторитет."

  ## NCR Uniques
  # Economy
  ncr_war_exhausted_economy:0 "Самовдоволена гегемонія"
  ncr_war_exhausted_economy_desc:0 "Хоча економіка НКР є неймовірно потужною порівняно з конкурентами, люди задовольнилися епохою стагнації, яку приніс Пітерсон. Економіка не в скрутному становищі, але вона й не зростає, і пересічного громадянина це влаштовує."
  ncr_rural_revitalisation:0 "Відродження сільської місцевості"
  ncr_rural_revitalisation_desc:0 "Першим кроком у плані відновлення економіки Мерфі є «Закон про відродження сільської місцевості», що сподівається не лише виправити напружені стосунки НКР із фермерами, але й заохотити людей, які ніколи в житті не торкалися плуга, зайнятися цією справою. Закон передбачає покращення інфраструктури для транспортування продукції, імунітет від призову та розширення програм допомоги на випадок поганого врожаю."
  ncr_deregulated_markets:0 "Дерегуляція ринку"
  ncr_deregulated_markets_desc:0 "Перша ідея Кімбола щодо пожвавлення економіки Республіки — це проста дерегуляція ринку. Хоча це знижує бар'єр для входу, дозволяючи малому бізнесу легше розпочати справу, це також скасовує багато чинних антимонопольних законів, дозволяючи величезним корпораціям і браміновим баронам робити все, що заманеться."
  ncr_giant_awakes:0 "Велетень прокидається"
  ncr_giant_awakes_desc:0 "Поєднання диких передвиборчих обіцянок і нашої участі в конфлікті в Баха нарешті запустило повільний процес розкриття справжнього потенціалу нашої економіки. Ми ще не досягли мети, але оскільки загроза за Колорадо продовжує зростати, наша економіка має бути готовою нести тягар нашої гігантської військової машини."
  ncr_remilitarised_economy:0 "Ремілітаризована економіка"
  ncr_remilitarised_economy_desc:0 "НКР повільно стала економічною потугою. Стерв'ятники більше не нишпорять у руїнах у пошуках їжі та брухту для торгівлі. Тепер величезні промислові ферми виробляють достатньо їжі для цілої нації, а надійна система доріг транспортує цю їжу на сотні миль за лічені години. Ми не шукаємо на покинутих військових базах зброю, створену для використання проти давно зниклої ідеології; ми самі виробляємо зброю на заводах із деталей, виготовлених просто тут, у Каліфорнії. Ведмідь вийшов зі свого барлогу."
  ncr_bear_roars:0 "Ревуча економіка"
  ncr_emergency_measures:0 "Надзвичайні економічні заходи"

  wisespread_consumerism:0 "Масове споживання"
  wisespread_consumerism_desc:0 "Наша унікальна економічна міць призвела до появи великого ринку споживчих товарів у межах НКР. Ні, людям не «потрібні» маленькі пластикові іграшкові солдатики, але дозволити громадянам купувати стільки, скільки вони хочуть — корисно для економіки!"
  curtained_consumerism:0 "Обмежене споживання"
  curtained_consumerism_desc:0 "Якщо хочете побачити долю споживчих суспільств, подивіться у вікно."
  economic_autarky:0 "Економічна автаркія"
  dharmist_austerity:0 "Дгармічна аскеза"

  #Black Canyon law
  blc_isolated_economy:0 "М'яка комерція"
  blc_isolated_economy_desc:0 "Концепція, заснована на працях хлопця зі Старого Світу на ім'я Монтеск'є. «М'яка комерція» стверджує, що торгівля та комерція здатні цивілізувати людей і покласти край війнам. Охороняючи багато ворожих груп і при цьому стикаючись із засудженням сусідів через прийняття наших рейдерів, «м'яка комерція» є для нас єдиним шляхом до виживання."
  blc_fishing_economy:0 "Економіка на експорті риби"
  blc_fishing_economy_desc:0 "Якщо ми хочемо торгувати з нашими сусідами, нам доведеться запропонувати те, що вони самі захочуть купити — це основи економіки.\n\nДотримуючись ідеї родини Ріверс і розбудовуючи узбережжя річки Платт, ми могли б зробити акцент на нашій риболовецькій промисловості. Це, безумовно, допоможе паралельно розвинути наші військово-морські можливості!"
  blc_mining_economy:0 "Економіка на експорті ресурсів"
  blc_mining_economy_desc:0 "Якщо ми хочемо торгувати з нашими сусідами, нам доведеться запропонувати те, що вони самі захочуть купити — це основи економіки.\n\nДотримуючись ідеї трійнят Джордано, ми могли б зробити акцент на нашій видобувній промисловості й почати експортувати сировину з надр Землі. У результаті ми отримали б більше заліза для нашого абсолютно неіснуючого збройового сектору і побічно ще більше розвинули б нашу мережу доріг!"
  blc_rearming_economy:0 "Економічна реконфігурація"
  blc_rearming_economy_desc:0 "Нам потрібно буде підготуватися до майбутніх конфліктів, що чекають на нас, але ми не можемо просто розпочати цілковите безумство озброєння. Поки ми не досягнемо цієї точки, ми можемо перетворити наші майстерні на мануфактури з виробництва зброї та боєприпасів — просто доки не будемо повністю готові..."
  blc_rearmed_economy:0 "Ремілітаризована економіка"
  blc_rearmed_economy_desc:0 "Наша нація стоїть нарівні з будь-якою іншою розвиненою нацією на континенті, наша промисловість отримує всю необхідну підтримку, щоб стати максимально великою. Але ми все ще лише віддаємо накази і перекладаємо свої зобов'язання на підлеглі нам фракції — цей останній рівень децентралізації має бути усунений для досягнення нашого максимального потенціалу. Наша національна безпека під загрозою."
  blc_polite_society:0 "Озброєне суспільство"
  blc_polite_society_desc:0 "«Засоби захисту від зовнішньої небезпеки завжди були інструментами тиранії вдома.» ― Джеймс Медісон"
  blc_war_economy:0 "Орієнтована на війну економіка"
  blc_war_economy_desc:0 "Війна... війна ніколи не змінюється."

