  enclave_military_law_4:0 "Кожен чоловік за Дядька Сема"

  scavenging_law:0 "Фокус на мародерстві"
  scavenging_law_desc:0 "Замість того, щоб витрачати наші ресурси на виробництво нових товарів, ми можемо шукати багатства Старого Світу. Мало ж залишитися хоч щось, правда?"
  ncr_sphere:0 "Економіка Ведмедя"
  ncr_sphere_desc:0 "НКР — найбільша і найпроцвітаюча нація на Західному узбережжі. Мільйон клієнтів Ведмедя створюють ринок товарів і послуг з усієї Пустки; на добре чи на зле. Багато народів, що формально не є частиною території Республіки, все одно живуть за правилами Шейді-Сендс; але такою є ціна прогресу."
  ncr_sphere2:0 "Митний союз Республіки"
  ncr_sphere2_desc:0 "НКР — найбільша і найпроцвітаюча нація на Західному узбережжі. Мільйон клієнтів Ведмедя створюють ринок товарів і послуг з усієї Пустки; на добре чи на зле. Багато народів, що формально не є частиною території Республіки, все одно живуть за правилами Шейді-Сендс; але такою є ціна прогресу."
  bag_sphere:0 "Економіка Ведмежати"
  bag_sphere_desc:0 "Хоча Мішківці не мають такого ж складного ринку, як їхній каліфорнійський колега, ані промислової потужності за ним, вони можуть запропонувати віру в те, що одного дня вони її матимуть."
  bag_sphere2:0 "Митний союз Республіки"
