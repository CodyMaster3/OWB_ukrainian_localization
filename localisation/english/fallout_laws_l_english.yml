  ## Enclave Outsider Laws
  outsider_law_enclave_only: "Останні громадяни"
  outsider_law_enclave_loyal_auxiliaries: "Слідопити Пустки"
  outsider_law_enclave_all_americans: "Американська мрія"
  no_recruitment_allowed_tt:0 "\n§gНаразі Анклав не дозволяє мутагенно обділеним вступати до лав армії. Тому створення нових підрозділів має відбуватися іншими шляхами. А думка про те, що ми можемо ставитися до територій мутантів як до «основи» нашої держави? Абсурд.§!"
  all_recruitment_allowed_tt:0 "\n§g«Моя мрія — це місце і час, коли Америка знову вважатиметься останньою найкращою надією Землі». — Авраам Лінкольн \n\n§CУ рамках наших зусиль з відбудови, тепер ми можемо націоналізувати території.§!"