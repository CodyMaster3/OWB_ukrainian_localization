water_desc: "Вода — найцінніший ресурс Пустки. Без неї не вижити, а тим паче — не розквітнути."
energy_desc: "Енергія — рідкісний, але незамінний ресурс. Потрібна для більшості будівель та механізмів."
metal_desc: "Металобрухт та деталі, зібрані з руїн Старого Світу. Використовується для зведення споруд та створення зброї."
composites_desc: "Композитні матеріали, що замінюють металобрухт там, де потрібно більше міцності. Необхідні для виготовлення обладнання високої якості."
circuitry_desc: "Електросхеми, витягнуті зі згарищ доядерної цивілізації. Важливі для створення електроніки."
advanced_desc: "Передові компоненти з довоєнних комплексів. Потрібні для розробки складної зброї та техніки."

