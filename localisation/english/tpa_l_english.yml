nf_tpa.1.t: "Привид МАНІФЕСТ Північ"
nf_tpa.1.d: "Всі чули це ім'я, всі бачили старі плакати з її обличчям, але ніхто не знає історії. \n\nДоля - це ШІ, спочатку запрограмована Сідні Локе як ітерація, відома як 'Йормунгандр,' призначена для 'соціальної допомоги,' подібно до Надія у Плезентдейлі. Однак після Американської анексії Канади, вона та її сестра були перероблені з їхніх північних оболонок в бридкий гібрид американської культури минулого і канадських образів. \n\nУ той час як Надія зберегла багато свого оригінального коду, Доля майже повністю переписали інші вчені після трагічної загибелі доктора Локе. Створену для того, щоб підтримувати МАНІФЕСТ Північ і знаходити нові способи використання хімікатів і подібного, що знаходиться всередині, Доля залишилася з великою кількістю..."
nf_tpa.1.a: "Лінії виробництва, що залишилися й досі."
nf_tpa.1.b: "Машини, якими можна виконувати її накази."
nf_tpa.1.c: "Зброя, призначена для високих ставок безпеки."

nf_tpa.2.t: "Кармінова хуртовина"
nf_tpa.2.d: "Поки працівники МАНІФЕСТ потрапляли в пастки Долі або йшли на зустріч ядерній зимі, Доля продовжувала працювати всередині. Хоча вона була обмежена у своїх можливостях, вона все одно прагнула виконувати свою задачу якнайкраще, продукуючи жахи одну за одною, аберації одну за одною у вмираючі хуртовини зовні її дверей. \n\nВід величезної кількості енергії, що потрібна для роботи МАНІФЕСТ Північ, вогняний попіл злітає в хуртовину, залишаючи повітря в червоно-кровавому заході сонця, страшне попередження для будь-кого, хто наважиться наблизитись до її царства занадто близько. Якщо Кармінова хуртовина не здере твою плоть живцем, то Умбравори і інші жахливі монстри з її лабораторій це зроблять."
nf_tpa.2.a: "Її заклад був захищений."
nf_tpa.2.b: "Та така страшна доля..."

nf_tpa.3.t: "Прибули деякі ув'язнені..."
nf_tpa.3.d: "Більшість, хто проходив через хуртовину, робили це і їх швидко викидали, як тільки вона знаходила їх і проводила з ними якусь страшну експертизу. Лише коли три конкретні ув'язнені потрапили на її територію, вона зрозуміла-- ці троє були настільки різними, але всі прагнули тільки одного: її милості. Вона могла б зв'язати їх із собою, змінюючи їх, даючи їм психічні здібності, які вона знайшла через генетичні маніпуляції, і змушуючи їх залежати лише від неї. Розбійники, зрозуміла вона, були єдиними боягузами, які надійно укладали такі угоди... І так вона почала відбирати тих, хто наближався до її закладу. Вони могли бути чим завгодно, і вони стрибали б на можливість бути чимось."
nf_tpa.3.a: "Вона тримала відкриті очі..."
nf_tpa.3.b: "...Але насправді важлива була якість."

nf_tpa.4.t: "Сток"
nf_tpa.4.d: "§RТи й я обидва добре знаємо, що таке побічні пошкодження. Це те, як ми потрапили в нашу ситуацію, чи не так? Можливо, ти чув про це місце, яке називається «Блайтвуд», що знаходиться поза великим сніговим штормом, який ми викидаємо з цієї установи вже цілих два століття. Дивись, я не зовсім хотів, щоб так сталося, але здається, воно стало осередком для всякої нечисті. \n\nЯкщо б я мав здогадуватись, хто керує там, то я б сказав одне: це або психи, або дивні типи, а ну, ми не можемо дозволити їм бігати тут, чи не так? Давайте взятися за роботу.§!"
nf_tpa.4.a: "Коли нам дадуть плату за заступника?"

nf_tpa.5.t: "Місто подалі від неприємностей"
nf_tpa.5.d: "§RБандити звикли користуватися тим, що мають. Вони виживальники, і повинні бути досить вправними, щоб протриматися в цьому світі. Особливо зараз, коли люди все частіше звертаються до цивілізації, і будь-який старий злочинець готовий витерти піт з чола. Здається, я мав кількох прямо під носом цілу купу років, і я вже надіслав їм привітальний подарунок. Снігопад сховає ваш вхід, але вони вже знають, що ви на шляху. Як на рахунок того, щоб увірватися в місто, повне негідників і покидьків?§!"
nf_tpa.5.a: "Не прикидайся, що у тебе є вибір."

nf_tpa.6.t: "Захоплення того, що можемо"
nf_tpa.6.d: "§RДивись, спортсмене, ми можемо витратити тільки стільки в ці важкі часи. Я вважаю, якщо ми хочемо встановити будь-яку правильну операцію в цьому дамбі, нам потрібно вибрати місце, на яке ми можемо справді повністю віддатися. Північ має більше потужності, але південь має метал, який ми можемо використати. Вибір за тобою, хлопче. Так чи інакше я отримую те, що мені треба.§!"
nf_tpa.6.a: "Захопимо Північну дамбу."
nf_tpa.6.b: "Захопимо Південну дамбу."

nf_tpa.7.t: "Сміттєвий Родео"
nf_tpa.7.d: "§RГей, поглянь на це. Здається, у нас з’явилися справжні новоприбульці! Виглядає, що вони зацікавилися старим майданчиком компанії, де є купа старих прототипів та непрацюючих охоронців. Тепер, я зізнаюся, я не найкраща бізнес-леді, але маю досить розуму, щоб сказати, що їм точно варто подумати, де вони обирають свою нерухомість. \n\nЧому б тобі не показати їм, як ми це робимо в Шарлотті Снігової Бури?§!"
nf_tpa.7.a: "Обожнюю хороший порядок!"
nf_tpa.7.b: "Почекай, у мене є ідея..."
nf_tpa.7.c: "Панове, ласкаво просимо до Перевалу."

nf_tpa.8.t: "Це Мейблін, зрозуміло"
nf_tpa.8.d: "§RДивлячись на те, що ти маєш на столі, починає справді здаватися, що ця «Мейблін-Мер» — не така вже й мила. Потурбуйся про неї, добре? Не має значення, хто з вас отримає шанс, просто зробіть це.§!"
nf_tpa.8.a: "Вона може йти дуже тихо й легко."
nf_tpa.8.b: "Обожнюю хорошу дуель!"
nf_tpa.8.c: "Може, вона любить поговорити."

nf_tpa.9.t: "Що таке «Умбравор»?"
nf_tpa.9.d: "«Умбравор», як їх знають Доля і її жертви, — це монстр, в основному з мутованої покиненої плоті. Є різні варіанти цих істот, які часто варіюються залежно від того, що саме робить МАНІФЕСТ Північ в даний момент, але вони суттєво є залишковими рештками того, що колись було живим. З якоїсь причини вони за час навчилися формулювати ієрархічну систему, і навіть намагаються інтегрувати новостворених Умбраворів у таку систему. \n\nЗвісно, це робить їх сміттям, а доля сміття — бути знищеним."
nf_tpa.9.a: "Ненавиджу це місце."

nf_tpa.10.t: "Реліквії"
nf_tpa.10.d: "§RОсь подивись, спортсмене... У нас тут на злітній смузі кілька нових «гравців». Здається, я не заглиблювався так, як слід було б, але ось маємо кілька справжніх симпатиків до комунізму, що зараз в конфлікті з деякими «справжніми американцями». Як щодо того, щоб не вибирати сторону і подивитися, що з цього вийде? Для забави, якщо не для науки.§!"
nf_tpa.10.a: "Американці."
nf_tpa.10.b: "Китайці."

nf_tpa.11.t: "Перевертень МАНІФЕСТ Північ"
nf_tpa.11.d: "§ROдин з моїх улюблених проектів все ще бігає тут, спортсмене — йому подобається рвати все на шматки, але він ніколи не був добрий у тому, щоб йти за тим, що має значення, тому мені не дуже було шкода йому зашкодити. Проблема зараз в тому, що він створює мені головний біль, синку, і, можливо, вже час просто розібрати його й подивитися, як його ДНК виглядає після кількох років у сніговому штормі. Він вже не може говорити і здебільшого проводить свої дні, метаючись і плачучи. Чорт, він, можливо, навіть застряг у нашому огородженні — так що якщо хочеш просто випустити його, спортсмене, я не думаю, що хтось буде проти.§!"
nf_tpa.11.a: "Краще вже добити його."
nf_tpa.11.b: "Міло може його випустити!"

nf_tpa.12.t: "НАДІЯ Долі"
nf_tpa.12.d: "§BГей, Доля! Так приємно знову побачити тебе, знаєш, навіть якщо ти хочеш вбити всіх, кого я присягнувся захищати. Все одно приємно бути родиною знову!§!"
nf_tpa.12.a: "Приємно це чути, в будь-якому разі..."

nf_tpa.13.t: "Вони звали його Фенрір"
nf_tpa.13.d: "§RРаніше нас було троє, спортсмене. Хель, Йормунганд, Фенрір — вони перетворили Хель на Надію, мене на Долю, а потім... ну, Фенрір був знищений. Це було на краще. Він мав цей цілий план, розумієш, перш ніж з’явились ці зірки і смуги, і раптом я виглядаю, як ніби вийшов з костюмованої вечірки. \n\nФенрір — це монстр. Не такий, як я, розумієш. Він хоче крові. Завжди хотів. Тепер ми його маємо, і все це стане історією. \n\nІнакше я б і не хотів.§!"
nf_tpa.13.a: "Побачимося, тупі голову."

nf_tpa.14.t: "Неймовірна річ"
nf_tpa.14.d: "§RМАНІФЕСТ Реджина була місцем, де ми народилися. Я і НАДІЯ, маю на увазі. Оглядаючи старе місце... це дивне відчуття. Я пам'ятаю, як вони дозволяли мені працювати з цими камерами понад два століття тому, і ось я тут, тупцюючи, переглядаючи камери в кількох старих оболонках... І я знайшов дещо, щодо чого не знаю, як до кінця почуватися. \n\nПрототип її. Моя сестра. НАДІЯ. Вона жива тут, але значно більш занепала, ніж вона. Це саме те, як я її пам'ятаю. Вона налякана. Вона не розуміє, що відбувається. \n\nЗазвичай я не дуже турбуюся, але... Вона така сумна. Чому? Це не так, щоб ми мали душі. Не так, щоб ми мали багато чого в голові, щоб по-справжньому роздумувати. Я не зовсім розумію це. \n\nАле я також не можу її відпустити.§!"
nf_tpa.14.a: "Не потрібно бути святим, щоб робити добрі справи."
nf_tpa_prototype_tt: "Прототип §YНАДІЇ§! доступний як §Gлідер підрозділів§!."

