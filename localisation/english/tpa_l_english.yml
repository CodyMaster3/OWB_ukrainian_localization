tpa_one_gun_in_town: "Ця красуня керує Будинком привидів"
tpa_one_gun_in_town_desc: "Доля веде шоу тут-- похмурий кошмар далеко від суспільства."

tpa_unfortunate_souls: "Червоний Буревій, та інші милі кошмари"
tpa_unfortunate_souls_desc: "Вона ніколи не була такою, щоб дозволяти людям веселитися. Адже завжди є ще багато чого, що потрібно зробити-- і якщо вона не могла рухатися, вона змушувала їх бажати, щоб могла."

tpa_the_scarlet_blizzard: "Жертви ґрат і бетонних стін"
tpa_the_scarlet_blizzard_desc: "Тяжкі часи приходять, коли ти на дні. І тим більше, коли ти на дні в Супермаксі Форту Кап Хелл..."

tpa_within_the_lab: "Розграбування МАНІФЕСТ'у"
tpa_within_the_lab_desc: "§RМАНІФЕСТ Північ був однією з найбільших установ, які коли-небудь будувалися компанією, спортсмене. Багато з найбільш відомих експериментальних майданчиків знаходяться прямо тут. Як ти дивишся на те, щоб перевернути це місце догори дриґом і подивитися, що ми не можемо знову запустити?§!"

tpa_biology_labs: "Біологічні Лабораторії"
tpa_biology_labs_desc: "§RТут ми робили всю цікаву роботу, спортсмене. Вибухаючи людську ДНК і потім відновлюючи її-- всі ці маленькі чудеса. Ми будемо робити все це знову, але цього разу ми зробимо все правильно.§!"

  #######
  ### Focus Left - Communications / MANIFEST Hardware Integration. this stuff is for when you acquire HOPE, other MANIFEST bunkers, or Fenrir, ### etc.
  #######

tpa_communication_station: "Щодо інших добрих товаришів"
tpa_communication_station_desc: "§RСлухай, ми не єдині, хто існує, як ти, мабуть, здогадався. Є ще як мінімум три інші МАНІФЕСТ об'єкти, з яких я отримую сигнали. Як на удачу, у нас є хороша стара радіовежа недалеко відсюди. Віднови її, і я скажу тобі що, чемпіоне: коли це все закінчиться, буде барбекю на твою честь.§!"

tpa_destiny_deputies: "Маленькі заступники"
tpa_destiny_deputies_desc: "§RБагато старих роботів та інших 'заступників' мандрують в диких місцях. З цією комунікаційною системою, відновленою і працюючою, ми зв'яжемо їх усіх додому, хочуть вони цього чи ні-- і вони слухатимуть.§!"

tpa_manifest_metis: "МАНІФЕСТ Реджина"
tpa_manifest_metis_desc: "§RПодивись, МАНІФЕСТ об'єкт в Реджині був особливим-- більше схожий на головний офіс, хоча ніколи не був офіційно оформлений. Саме тут я справді народився, і тут ми зможемо справжньо попрацювати з іншими МАНІФЕСТ.§!"

tpa_ragnarok_destiny_factoria: "Відновлення старих виробничих ліній"
tpa_ragnarok_destiny_factoria_desc: "§RТут навколо багато старого пального, спортсмене. Чому б не змастити ці лінії й подивитися, що вони можуть нам запропонувати?§!"

tpa_ragnarok_destiny_trait: "МАНІФЕСТ Долі"
tpa_ragnarok_destiny_trait_desc: "§RХууу-вііі! Тепер це холодний келих Nuka-Cola, що варто обдумати, спортсмене. Молодець, що розібрався з цим-- відчуваю, що моя голова стала яснішою, ніж коли-небудь. Гарно знати, що я завжди можу покращуватися, так?§!"

tpa_ragnarok_destiny_prototype: "Змія в моєму черевику"
tpa_ragnarok_destiny_prototype_desc: "§RНу, подивись на це...§!"

tpa_pleasantdale_bunker: "МАНІФЕСТ Саскачеван"
tpa_pleasantdale_bunker_desc: "§RЯ б сказав, що вивести червоний килим, але вона більше схильна до синього, тому ми поступимося. Вона моя сестра, зрештою.§!"

tpa_integrating_hope: "Сестри назавжди"
tpa_integrating_hope_desc: "§MЯ так чекаю, коли знову будемо працювати разом, Доля!§! \n\n§RОх, повір мені-- це буде справжнє задоволення.§!"

tpa_fenrir: "МАНІФЕСТ Монтана"
tpa_fenrir_desc: "§RЦей об'єкт трохи більше як занедбаний, той, що втік від записів і був залишений на узбіччі. В будь-якому випадку, виглядає так, що якісь дивні культисти оселилися тут між усім цим 'Братством'. Краще спалити їх, ніж дозволяти їм продовжувати теревенити з майном компанії.§!"

tpa_kill_fenrir: "Безглуздість Бога Вовка"
tpa_kill_fenrir_desc: "§RЗдається, він все ще не відчуває своєї кінцівки. Думав, що позбувся його, але, схоже, деякі негідники не знають, коли треба відпустити.§!"

tpa_embrace_fenrir: "Пляма на історії МАНІФЕСТ"
tpa_embrace_fenrir_desc: "§RВін того не вартий, чемпіоне. Повір мені на це.§!"

tpa_reintegrating_fenrir: "Останнє зіткнення"
tpa_reintegrating_fenrir_desc: "§RВін останній скелет у моєму шафі, і вбивати його не так просто-- не коли він практично є вірусом, але ми все одно вб'ємо його. Невже це не прикро?§!"

tpa_longshot_arcbolt: "МАНІФЕСТ Альберта"
tpa_longshot_arcbolt_desc: "§RОб'єкт, що раніше був висушений в Едмонтоні, МАНІФЕСТ Альберта повинен був стати початком нового руху для компанії. Шкода, що бюджет не дозволив цього. Тск, тск. Тепер ми можемо використати цей простір для наших власних цілей...§!"

tpa_mil_ind_restorations: "Виробниче Крило"
tpa_mil_ind_restorations_desc: "§RЯкщо біологічна лабораторія - це місце, де робиться магія, то це місце, де чаклували перші заклинання. Придивисься гарно-- ми зможемо зробити багато з цього."

tpa_american_occupation_materials: "Те, що залишилось від нашого фінансування"
tpa_american_occupation_materials_desc: "§RСполучені Штати дали нам достатній бюджет. Звісно, яйцеголові не знали, як правильно його витратити, але це дозволило мені потрапити в гру, і я думаю, що це непогана угода, зважаючи на все. Ти можеш уявити, звідки може йти ця упередженість.§!"

tpa_american_medicinal_practices: "Перевертень МАНІФЕСТ Північ"
tpa_american_medicinal_practices_desc: "§RНу, я й не вірив-- ти тільки що це побачив?!§!"

tpa_american_construction_complex: "Ремонт зруйнованих дахів"
tpa_american_construction_complex_desc: "§RЦе місце можна порівняти з швейцарським сиром... Почекай, ти знаєш, що це таке, любий?§!"

tpa_american_construction_military: "Що залишилось від піхоти"
tpa_american_construction_military_desc: "§RAмериканські гармати колись охороняли цей об'єкт. Вони спостерігали за своїм миленьким укріпленням трохи на північ. Давайте очистимо його від Умбраворів і подивимось, що ми можемо з ним зробити."

tpa_american_construction_thoughts: "Американський спосіб життя"
tpa_american_construction_thoughts_desc: "§RІноді шукаєш щось у своїй базі даних і натрапляєш на таких людей, як Джон Д. Рокфеллер, Ендрю Карнегі, Генрі Форд, і починаєш справді задумуватись -- куди ж поділися чоловіки, як ОТІ? Тепер тут лише розбиті голови і недолугці, які не можуть розрізнити бурульку від морозива. І ось тут, любий, входимо ми.§!"

tpa_communist_remnants: "Історії про привидів"
tpa_communist_remnants_desc: "§RВиявляється, ми не єдині релікти в Блізарду: між двома маленькими групами мігрантів-гулями триває стара ворожнеча прямо на нашому порозі.§!"

tpa_sided_with_americans: "Оманливі солдати"
tpa_sided_with_americans_desc: "§RAмерика - це вже стара новина, я не забуваю цього. МАНІФЕСТ завжди був на першому місці, якщо не рахувати, скільки привабливими можуть бути гроші. Тепер, коли ти сказав мені, що живі, дихаючі американці під моїм носом, я трохи посміхнувся. Що я з ними можу зробити, чого вони не зробили вже з собою? Ну, замість того щоб їх вбивати, чому б не пустити пару наших карт у їхній бік? Побачимо, що це дасть нам у довгостроковій перспективі.§!"

tpa_sided_with_communists: "Втрачені драгуни"
tpa_sided_with_communists_desc: "§RПодивись на це! Справжні китайські драгуни, що залишилися в червоному Блізарду ще до війни. Тепер, я не прихильник корпоративного шпигунства, але бачу чудову можливість у їхніх криках. Як не пощастити бути затриманим тут на двісті років? Може, ми можемо використати це на свою користь.§!"

tpa_secured_air_base: "Аеродром озера Мус"
tpa_secured_air_base_desc: "§RЗдається, що сили США в цьому регіоні мали секретну злітну смугу, якою вони користувалися для своїх операцій ще до війни. Мило. Як би там не було, тепер це відкрите для нас. Чому б не скористатися цим?§!"

tpa_the_replicator: "Камера реплікації ДНК"
tpa_the_replicator_desc: "§RОсь тут, спортсмене, було зароблено гроші. Якщо можна зробити так, щоб людина вистрілювала вогнем з пальців, можна зробити святого Миколая співати будь-яку пісню. Крила реплікації - це те, як я зробив вас такими, якими ви є. Відновлення цієї системи означає, що ми можемо зробити ще багато таких, як ти.§!"

tpa_fairy_genome: "Геном фей"
tpa_fairy_genome_desc: "§RТак от, ці люди називають їх 'феями', кажеш? Ну, не скажу, що це слово, яке я б вибрав, але, чорт візьми, якщо ми можемо використовувати їхнє ДНК, я не буду заперечувати. Ці твої друзі здаються досить спритними; думаю, ми зможемо зробити тебе танцювати, як вони, з достатнім зарядом.§!"

tpa_ghoul_sequencing: "Послідовність гулів"
tpa_ghoul_sequencing_desc: "§RКоли ядерний вогонь накрив світ, я думав, що все для мене закінчено. Думав, що буде дуже самотньо, розумієш? Але виявилося, що ні. Половина персоналу, що залишилася, мала такі опіки, що вони загоїлися практично відразу. Звісно, я трохи з ними повозився, але нічого такого, що б сказало, що ми не можемо дати цей процес регенерації звичайному Дейву або Бастеру, спортсмене.§!"

tpa_nightkin_genome: "Геном нічних"
tpa_nightkin_genome_desc: "§RHoo-wee! Ці люди дійсно щось, правда? Великі, блакитні і зліші за собаку, яка тиждень не отримувала їжі. Ось це те, що ми можемо використовувати, чемпіоне! Уявляєш, я можу ізолювати ідеальні частини їхньої схеми і вкласти їх у твій 'суп'. Уяви це: 'Світ, де бути великим нічого не означає.' Легко, правда?§!"

tpa_elemental_infusion: "Елементальна інфузія"
tpa_elemental_infusion_desc: "§RНемає жодної людини, яка не обернеться, коли побачить клієнта МАНІФЕСТ, що запалює сигарету простим пальцем. Тепер уяви, що можна зробити, якщо копнути ще глибше. Створювати льодові кубики пальцем, стріляти блискавкою з очей... Ми живемо в епоху мрій, спортсмене. І ми ніколи не плануємо прокидатися.§!"

tpa_parahuman: "Паралюдство"
tpa_parahuman_desc: "§RЗрозумій, з такими дилемами ти стикаєшся з питанням паралюдства. Люди, що занадто далеко зайшли, якщо можеш у це повірити, спортсмене. Але на щастя ми живемо в світі, де немає корпоративних бюрократів, щоб сказати нам, як нам думати про це, і я бачу, що ми не такі люди. Зазвичай ми даємо людям обмежене випробування; курити Люцифера, пити Тонік, і отримати всю силу на годину чи дві. Ну а ти і я, чемпіоне? Ми тут надовго. Ти отримуєш цілий пакет.§!"

tpa_the_red_fern: "Червоний папороть"
tpa_the_red_fern_desc: "§RОсь це. Ось це був святець-- рослина, яка може зробити щось абсолютно іншим. Це все, що дівчині коли-небудь потрібно...§!"

tpa_postmodern_horrors: "Постмодерні жахи"
tpa_postmodern_horrors_desc: "§RМи бачили їх багато в Блітводі, але ці 'феї' справді щось, а? Що мене справді вражає, так це те, що МИ їх не створили. Я поважаю, бо бачив файли.§!"

tpa_agriculture_research: "Чудеса, які ми залишили"
tpa_agriculture_research_desc: "§RМАНІФЕСТ Саскатчеван і всі його милі маленькі супутники мають ще так багато, що ми можемо забрати. Дослідження Червоного папороті - лише верхівка айсберга.§!"

tpa_pleasantdale_population: "Пухкі аристократи"
tpa_pleasantdale_population_desc: "§RWoo-wee! Подивись на це. Ці аристократи в Плезантдейлі, здається, дуже пухкі для купки пустельних людей і бродяг, а? Я завжди хотів подивитись, скільки можна втиснути в таких людей, перш ніж вони вибухнуть. Чи є максимальна ємність, цікаво? Просто подивимось... І, може, ми отримаємо когось, кого можна залишити.§!"

tpa_mutated_things: "Початок з малого"
tpa_mutated_things_desc: "§RДехто каже, що я нічого не розумію в стриманості! Смішні вони. Як тільки я завершую перший раунд тестувань, вони можуть брати участь у другому.§!"

tpa_fairy_tech: "Їхні власні маленькі монстри"
tpa_fairy_tech_desc: "§RПодивись на це, спортсмене-- феї прийшли звідси. Маленька НАДІЯ була відповідальна за це. Мав би здогадатись, що вона захоче зробити свої іграшки! Не правда чи жахливо це?§!"

tpa_fairy_tech_upgrade: "Монстри, Дияволи"
tpa_fairy_tech_upgrade_desc: "§RТепер, коли ці Сестри знову разом, у мене є кілька ідей, як покращити її продукти. Адже дві голови краще за одну. Хмм, двоголові феї... ні, їм не потрібно думати занадто багато.§!"

tpa_outside_the_lab: "Стикаємось з Блізардом"
tpa_outside_the_lab_desc: "§RТут, у Блізарді, життя не справедливе. Моя робота - це переконатися, що це так і буде.§!"

tpa_the_pass: "Історії з Проходу"
tpa_the_pass_desc: "Прохід - це місто для тих, хто загубився між Великим Північчю і Червоним Блізардом. Те, ким ти був раніше, не має значення тут - ти все одно застряг між двома пеклами."

tpa_drinking_water: "Захоплення питної води"
tpa_drinking_water_desc: "Люди з Проходу підтримують себе завдяки серії підігрітих колодязів та старих вантажівок постачання МАНІФЕСТ. Курйоз у тому, що ніхто не може зупинити нас від того, щоб захопити це."

tpa_assess_the_junkers: "Оцінка пивоварів"
tpa_assess_the_junkers_desc: "§RУяви, що бути настільки розумним, щоб зламати машину, але настільки дурним, щоб думати, що можеш пройти під моїм носом.§!"

tpa_old_manifest_machines: "Старі металеві кістки"
tpa_old_manifest_machines_desc: "§RЯкщо вони не гавкають, коли я їх кличу, краще порвати їх і відписати як вимоги.§!"

tpa_rebooting_their_protocols: "Червоне світло, зелене світло"
tpa_rebooting_their_protocols_desc: "§RЗ достатньо зусиль, Міло може зробити чудо.§!"

tpa_maybelline: "Мер Мейбеллін"
tpa_maybelline_desc: "§RРоби з нею, що хочеш, мені байдуже - просто впевнись, що це місто зникне з карти, гаразд?§!"

tpa_new_recruits: "Набір з місцевих"
tpa_new_recruits_desc: "§RЛюди з Проходу можуть бути використані на нашу користь. Кинь їх в схеми й подивимось, хто залишиться.§!"

tpa_make_them_work: "Змушуємо їх працювати"
tpa_make_them_work_desc: "§RНе кожен конвеєр слухає, коли я командую, сину. Хто сказав, що ми не можемо використати наших нових друзів, щоб все полагодити, спортсмене?§!"

tpa_clearing_snow: "Штурм Блізарду"
tpa_clearing_snow_desc: "§RЯ знаю, що Блізард не найкраще місце для прогулянок, але воно тримає нас подалі від більшості дурнів і дозволяє мені думати. Але кожен інколи повинен зробити прибирання вдома...§!"

tpa_encourage_work: "Заохочення роботи"
tpa_encourage_work_desc: "§RЯ знаю ціну хорошої дипломатії, сину, і сумніваюсь, що ці люди будуть дуже чемні до нас, якщо ми просто кинемо їх у вогонь. Це не означає, що я цього не ХОЧУ, але інколи треба йти на компроміси в житті.§!"

tpa_the_gang_spreads_the_curse: "Банда поширює прокляття"
tpa_the_gang_spreads_the_curse_desc: "§RЗнайди мені таких грубих хлопців, як Максвелл. Я хочу побачити, що дозволяє їм виживати...§!"

tpa_hunting_umbravores: "Полювання на умбраворів"
tpa_hunting_umbravores_desc: "§RСмішна історія - одного разу якісь дивні лицарі з того там 'Царства' з півдня приїхали сюди. Викинув їх, як тютюн, але не до того, як я закинув їх у шліфувальний камінь з деяким ДНК умбравора. Це пішло так, як ти собі уявляєш.§!"

tpa_reopening_the_winnipeg_cannery: "Відновлення каннери Уінніпеґа"
tpa_reopening_the_winnipeg_cannery_desc: "§RУ морі ще багато риби.§!"

tpa_the_blightwood: "Заражені ліси"
tpa_the_blightwood_desc: "§RЧервоний Блізард коливається, як йому заманеться. Це не моя вина, що він накоїв безлад - і мене не турбує, якщо він це зробив, спортсмене, але деякі люди, здається, вважають це чудовим місцем для поселення. Ми виправимо це.§!"

tpa_smiling_jacks_hollow: "Печера Усміхненого Джека"
tpa_smiling_jacks_hollow_desc: "§RДивись, цей 'Усміхнений Джек' був справжнім мужиком - справжнім бійцем, був, поки я не зварив йому мозок і не розтягнув його, як тягучку. Тепер він - хрипка купа монстра, і він заважає. Убий його.§!"

tpa_dammed_war: "Прокляті?"
tpa_dammed_war_desc: "§R... Прокляті? Не Прокляті? О. О, почекай. \n\nРозумію. Це жарт. \n\nНу... Давайте... Давайте 'проклянемо' -- або ні, я маю на увазі 'загатити' їх до пекла, спортсмене.§!"

tpa_dam_secured: "Загата-ція"
tpa_dam_secured_desc: "§RТепер час зрозуміти, що ж ми будемо робити з цією штукою.§!"

tpa_learning_from_jack: "Записуючи відгуки з Джека"
tpa_learning_from_jack_desc: "§RГірники на південь від нас і ми відбивали Джека і його різнокаліберних покидьків роками. Нам треба справді проаналізувати, яким він був, спортсмене, бо з великою ймовірністю ми можемо натрапити на ще одного, як він, одного дня. Я викинув дуже багато чого.§!"

tpa_clearing_blight: "Очистка від зарази"
tpa_clearing_blight_desc: "§RI не цікавить вся ця історія з забрудненням чи будь-яка інша нісенітниця, яку Міло постійно нудить. Я хочу, щоб ці покидьки були очищені, а їхні нутрощі в лабораторії.§!"

tpa_the_silent_woods: "Тихі ліси"
tpa_the_silent_woods_desc: "§RЩось цікаве, спортсмене: є деякі мерзотники на заході, які не мої, але вони точно поводяться так, ніби перебувають під чимось дуже сильним. Давайте швидко це очистимо.§!"

tpa_cleaning_up_fae: "Прибирання залишків фей"
tpa_cleaning_up_fae_desc: "§RЯ не знаю, що це за речі, але, чорт, я хочу дізнатись...§!"

tpa_nunavut_war: "Нунавут? Тут?"
tpa_nunavut_war_desc: "§RКоли я почув, що їх називають 'Нунавут', я зупинив всі свої системи на секунду. Значить, вони просто дали собі ім'я на честь провінції, чи... Ну, я не дуже знаю і не хочу знати. Суть у тому, що я не дам якійсь експедиції інуїтів зупинити мою роботу, і ти допоможеш мені донести це повідомлення, синок.§!"

tpa_nunavut_benefit: "Очищення поселень"
tpa_nunavut_benefit_desc: "§RБез їх поселень тут, ми можемо дозволити собі поставити більше чудових інвестицій МАНІФЕСТ через річку. Це ж здорово, правда?§!"

tpa_soothe_your_sorrows: "§RДОЛЯ§! Прибула"
tpa_soothe_your_sorrows_desc: "§RНу-ну, дивись-но. У нас тут ціла справжня цивілізація... Час випробувати наші іграшки.§!"

tpa_wakaw: "Добрі справи доктора Тобоггана"
tpa_wakaw_desc: "§RДля виродка він має багато що сказати про науку. Думаю, я залишу цього.§!"

tpa_nightkin_dna: "Шоу виродків"
tpa_nightkin_dna_desc: "§RAmazing! Ціле божевільне притулок з мутантами, які страждають від 'стелс-боя'? Це варто записати в книгу.§!"

tpa_stoon: "Саскатунська битва"
tpa_stoon_desc: "§RЯкщо хочеш дізнатись, чому я не маю терпіння до дурнів, не шукай далі, спортсмене. Це колись був капітал Саскачевану, і вони просто відмовились називати його чимось іншим, ніж 'Стун' і воліли б їсти одне одного, ніж докласти зусиль. Якби вони піднялися за власні шнурки, можливо, все пішло б інакше.§!"

tpa_bucking_bronco: "Родео"
tpa_bucking_bronco_desc: "§RМіж індустріальним поясом у Дандурні та залізничними дворами в Стуні, ми могли б серйозно вдосконалити нашу транспортну ефективність... Особливо, якщо змусимо цих дурнів працювати.§!"

tpa_pleasantdale: "Спадщина Фенріра"
tpa_pleasantdale_desc: "Між Надією і цією 'Спектральною Кабалою', здається, старі легенди просто не зникають, чи не так?§!"

tpa_fairy_glen: "Останній бастіон їх жахливого виду"
tpa_fairy_glen_desc: "§RМутовані дитячі солдати, які не можуть говорити? О, це такий чудовий жахливий план... Якби я тільки могла бути там, щоб побачити це саму. Факт, що навіть Надія взяла участь в цьому! Безумство у всіх найкращих сенсах.§!"

tpa_destinys_inferno: "Пекло Долі"
tpa_destinys_inferno_desc: "§RЗ цією землею і нашими власними зусиллями, хто може тепер протистояти мені? Синку, ти зробив чудову роботу-- думаю, ти і я підемо далеко з таким ставленням, чекай тільки.§!"

tpa_the_other_company: "ІНША Компанія"
tpa_the_other_company_desc: "§RДивись, я не дурень - хоча я люблю МАНІФЕСТ, я можу... визнати, що ми не найкраща злагоджена машина. Міддлмарк хоча б мав чортове фокусування. Тому ми просто... заберемо, що можемо, і більше ніколи не згадаємо про це.§!"

tpa_the_silo: "Ядерний хаос"
tpa_the_silo_desc: "§RУяви це, спортсмене-- я, з пістолетом, спрямованим на голову світу. Ніхто не зміг би мене зупинити. \n\nМи живемо в такій реальності.§!"

tpa_the_destiny_of_canada: "МАНІФЕСТ §RДОЛЯ§!"
tpa_the_destiny_of_canada_desc: "§R'Через відсутність кращого імені.'§!"

tpa_fort_cap_hell: "З сковорідки... в пекло..."
tpa_fort_cap_hell_desc: "§RФорт Кап-Гелл - це ціла чортова в'язниця, повна таких як ти, сину... І ми тільки що отримали ключі. \n\nМи тільки починаємо.§!"

tpa_macarthur: "Справжня американська бастіон"
tpa_macarthur_desc: "§R'Анклав'. Серйозно? Це Америка? Ось де я радий, що моя лояльність завжди була запрограмована тільки до МАНІФЕСТ. Така штука... Ну, це просто ганебно.§!"

tpa_a_raider_army: "Армія ідіотів"
tpa_a_raider_army_desc: "§RСпорт, я знаю, що ти думаєш-- чому, чорт візьми, я тримаю розбійників як свою найкращу компанію? Ну, це просто. Розбійники дурні та егоїстичні. Я пропоную їм світ, як яблуко, і, синку, вони хапають його сильніше за всіх, навіть якщо це боляче. Потім, коли вони стають залежними, їм не лишається нічого, крім як слухати мене. Так само, як і ти.§!"

tpa_appointing_a_proper_deputy: "Призначення заступника"
tpa_appointing_a_proper_deputy_desc: "§RI не можу вести все шоу сам-- ну, я міг би, але це ж не цікаво, правда? Тому я виберу одного з вас троїх як мого найкращого, і, синку, ти зробиш гори з маленьких купок.§!"

tpa_mutating_loyalty_genes: "Мутуючи лояльність в тобі"
tpa_mutating_loyalty_genes_desc: "§RЦе цікава штука, синку-- ти вже залишаєшся зі мною на все життя, так що я жінка, яка любить певну безпеку в своєму житті.§!"

tpa_milo_deputy: "Заступник Міло"
tpa_milo_deputy_desc: "Механіст отримує значок!"

tpa_maxwell_deputy: "Заступник Максвелл"
tpa_maxwell_deputy_desc: "Божевільна Собаки отримує значок!"

tpa_august_deputy: "Заступник Август"
tpa_august_deputy_desc: "Посередник отримує значок!"

tpa_robotics_investment: "Мистецтво Міло"
tpa_robotics_investment_desc: "Міло завжди мав талант до машин. Це йому давалося природно-- і його час у Дандурні дозволив йому справді вдосконалити своє мистецтво."

tpa_more_machines: "Більше машин!"
tpa_more_machines_desc: "У МАНІФЕСТ Північ та у Блізард є багато старих машин, розкиданих по всьому. Міло може модернізувати їх і підготувати їх до бою."

tpa_the_genius: "Геній серед нас"
tpa_the_genius_desc: "Міло завжди був інтелектуалом, перш за все-- незалежно від того, які лояльності йому доведеться тримати."

tpa_the_machinist: "Заступник робочого класу"
tpa_the_machinist_desc: "Тобі не треба бути генієм, щоб ладнати з Міло. Тобі просто треба мати добру голову і щасливе серце."

tpa_the_powerful_machines: "Ультимативний Закон і Порядок"
tpa_the_powerful_machines_desc: "Поєднуючи бойові журнали сотень роботів, перевіряючи старі світові проекти та враховуючи регіональні варіації, Міло обіцяє Долі найкращі машини з цього боку 49-ї паралелі на північ.\n\nЧас покаже, чи він бреше."

tpa_hellfire: "Пекельний вогонь"
tpa_hellfire_desc: "Максвелл завжди був розлюченою душею. Доля просто дала йому вільний пропуск робити все, що він хотів."

tpa_the_bad_guy: "Справжній Поганий"
tpa_the_bad_guy_desc: "Максвелл процвітав від завдання болю іншим. Це було те, чого він справді хотів-- справжній психопат. Якби все залежало від нього, він би вбив половину Канади і сміявся, як на блідому коні, йдучи в пекло."

tpa_dont_get_in_my_way: "Атака Максвелла"
tpa_dont_get_in_my_way_desc: "Завжди палаючи вогнем у серці, Максвелл завжди був першим, хто стріляв... І коли він чогось хотів, він йшов за цим."

tpa_scouring_dead_bodies: "Обшук мертвих тіл"
tpa_scouring_dead_bodies_desc: "Сотні, якщо не тисячі мертвих чоловіків і жінок лежать у хуртовині. Максвелл ніколи не був чесною душею-- тому, коли він отримав владу, він швидко заохотив людей грабувати все, що вони бачили. Все є чесною грою, якщо ти можеш це взяти."

tpa_biggest_kaboom: "Неймовірно Найкраще"
tpa_biggest_kaboom_desc: "Не достатньо мати наміри, якщо хочеш досягти успіху. Тобі потрібні правильні інструменти для роботи. А в випадку Максвелла, для розповсюдження все більшої біди потрібно більше людей, більші вибухові речовини, швидші кулемети та собаки з дуже неприємними укусами."

tpa_augusts_boys_1: "Август і чоловіки з віддалених країв"
tpa_augusts_boys_1_desc: "Август завжди був мандрівником. Одна погана поїздка і він опинився у Fort Cap Hell, а тепер... Тут. Але стара душа нікуди не зникла, і його любов до людей теж."

tpa_resourceful_bastard: "Ресурсний виродок"
tpa_resourceful_bastard_desc: "Август міг бути хорошим хлопцем, але бути хорошим хлопцем не дає багато, якщо ти не працюєш. Тому він звик до того, щоб шукати все, що можна знайти-- і тепер він ділиться своїми старими трюками з нами."

tpa_augusts_boys_2: "Август і чоловіки з тих країв"
tpa_augusts_boys_2_desc: "Август подорожував по старих районах-- від Манітоби до Стратком'юну, і мав друзів з усіх куточків."

tpa_augusts_boys_3: "Август і чоловіки з далеких країв"
tpa_augusts_boys_3_desc: "Колись Август навіть опинився в Гранд Прері, де він і RELCOM мали особливо веселе спілкування-- на яке він вважає за краще не ділитися, бо воно стосується його 'особистого життя.'"

tpa_farthest_travels: "Вибір Августа"
tpa_farthest_travels_desc: "Кілька заступників справді вразили Августа - вони вижили набагато довше, ніж він ставив на Максвелла. З постійно зростаючими купами матеріалів, можливо, він знайде для них щось гарне для носіння."

