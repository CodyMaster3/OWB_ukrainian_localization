l_english:
  # Generic Flavour Events
flavour.1.t:0 "Невдоволення серед рабів"
flavour.1.d:0 "Хоча наші раби ніколи особливо не тішились своїм становищем та умовами праці, останніми тижнями наші наглядачі стали особливо неслухняними до наказів. Все почалось з впливового лідера рабів у [Root.Capital.GetName], а тепер спалахи насильства проти власників рабів ширяться країною. Раби відмовляються виконувати накази, а деякі навіть намагаються масово втекти. Їхні вимоги прості – кращі умови та їжа. Але якщо ми підемо їм назустріч, це може створити небезпечний прецедент. З іншого боку, придушення бунту зламає дух рабів на десятиліття вперед, хоча й обійдеться нам дорого в людських ресурсах та стабільності. Що ми робитимемо?"
flavour.1.a:0 "Зробити незначні поступки."
flavour.1.b:0 "Придушити повстання!"
flavour.1.c:0 "[Root.GetLeader] особисто придушить повстання!"

flavour.2.t:0 "Торговці з Гаваїв"
flavour.2.d:0 "Далеко на захід, за уламками нафтових платформ та занедбаними військовими островами, лежать острови Гаваї. Колись, згідно з однією книжкою, ці острови входили до складу Америки та були домом для Тихоокеанського флоту США. У 2077 році, більша частина флоту стояла в порту, коли почалась Велика Війна, й була знищена китайськими ядерними ракетами. Тепер племена Гаваїв виживають, розбираючи залишки флоту на деталі та торгуючи зброєю й їжею з поселеннями вздовж Західного узбережжя. Цього ранку група племенних торговців прибула в наш порт, пропонуючи рідкісні товари. Це нагода, яка не повториться ще довго!"
flavour.2.a:0 "Розкажіть нам бойові історії зі своєї батьківщини."
flavour.2.b:0 "Купити дещо з їх екзотичних товарів для нашого народу."
flavour.2.c:0 "Укласти з ними річну торгову угоду!"
flavour.2.e:0 "Відмовити їм..."

flavour.3.t:0 "Торговці з Південних Імперій"
flavour.3.d:0 "У десятиліття після Великої Війни радіація просякла у великі ліси та джунглі Південної Америки, отруюючи повітря й мутагенно змінюючи дику природу. Хоча самі ядерні удари майже не зачепили континент, наслідки виявилися катастрофічними: змії та павуки виростали до гігантських розмірів, тварини ставали хижаками, а врожаї – зникали. Ті, хто вижив у перше десятиліття, оселились на узбережжі та в Патагонії, утворюючи так звані «Південні Імперії» – великі угрупування грабіжників, які постійно воюють між собою.\n\nВтім, не всі дотримуються філософії рейдів. Прибережні спільноти, що зберегли незалежність через сплату данини, стали процвітаючими торговими центрами. Торгуючи шкірами та фруктами з джунглів на металобрухт і техніку, ці міста-держави налагодили зв’язки з державами Мексиканської затоки. Нещодавно їхній торговельний флот причалив до нашого порту – маємо рідкісну нагоду закупити їхні товари. Треба діяти швидко – вони не затримуються надовго!"
flavour.3.a:0 "Попросити навчити нас вирощувати ці фрукти."
flavour.3.b:0 "Заплатити їм, аби вони навчили нас дипломатії."
flavour.3.c:0 "Укласти торгову угоду!"
flavour.3.e:0 "Зараз ми не можемо дозволити собі покупку..."

  # Unique Flavour Events
flavour_unique.1.t:0 "Інцидент у [Root.Capital.GetName]"
flavour_unique.1.d1:0 "Однією з найгірше збережених державних таємниць до Великої Війни було існування «Зетанів» – позаземних істот, які, як вважалося, спостерігали за людством із орбіти. Хоча уряд США ніколи офіційно не визнавав їх присутність (у них було чимало інших турбот), громадськість майже одностайно вірила, що прибульці тут надовго. І, здається, Зетани досі тут – навіть через понад два століття після Великої Війни, за якою вони, певно, стежили з захватом. Звідки ми знаємо? Судно Зетанів розбилось поблизу [Root.Capital.GetName]. Двоє прибульців, яких упізнали за їхньою моторошною схожістю на допотопні графіті, вижили і відчайдушно захищають уламки корабля. Кілька наших солдатів вже загинули під час розвідки, але скоординований штурм дозволить нам прорватись до судна."
flavour_unique.1.d2:0 "Велика комета впала з неба! Горячи яскравіше за наші вогнища, вона врізалась у землю минулої ночі. Деякі з наших воїнів наважились наблизитися, сподіваючись, що це дарунок богів, та натомість знайшли лише смерть. Двоє маленьких зелених чоловічків, із зброєю, що випромінювала чисте світло, відважно охороняли комету. Це, без сумніву, воїни богів, які випробовують нас перед тим, як відкрити дари з неба. Якщо ми хочемо дістатись до миготливих вогнів та дзижчання комети – мусимо перемогти цих священних охоронців!"
flavour_unique.1.a:0 "Не чіпати..."
flavour_unique.1.b:0 "Розібрати на брухт!"
flavour_unique.1.c:0 "Вивезти й дослідити."

flavour_unique.2.t:0 "Відкриття Сховища 187"
flavour_unique.2.d:0 "На превеликий подив мешканців [Root.Capital.GetName], вони усе життя жили над таємним експериментом Vault-Tec. Сховище 187 – це мережа суб-сховищ, розкиданих по навколишніх містах і з’єднаних лабіринтом тунелів, з барикадами й кістяками. Ми знали про деякі входи, але кожен із них був зламаний. Нащадки мешканців розповідають, що Vault-Tec навмисно відкрив двері всіх суб-сховищ через два роки після Війни, змушуючи людей битись за єдиний безпечний центральний відсік. Там могла вижити лише жменька. У результаті – понад десятиліття кривавої війни між 12 суб-сховищами. Вижило лише Сховище 187-08. Понад 8000 людей загинуло. І тільки тоді відкрилась центральна камера зі значними запасами їжі, що дозволило їхнім нащадкам вижити – до сьогодні.\n\nПерші мешканці щойно вийшли з Сховища 187 на світло пустки. На жаль для них, вхід до сховища розташовувався просто під нашим військовим табором – і їх одразу затримали й доставили до [Root.GetLeader]. Наші радники обговорюють подальші дії. Ми можемо прийняти їх і переконати служити нам. Але якщо ми збережемо їм життя, вони точно не дозволять розібрати Сховище на запчастини. Хоча, можемо влаштувати несподівану атаку й позбутись проблеми. Чи варті вони цього металобрухту?"
flavour_unique.2.a:0 "Навчимо їх жити в новому світі – вони приєднаються до нас."
flavour_unique.2.b:0 "Усіх знищити й розібрати Сховище!"
flavour_unique.2.c:0 "Переконати приєднатися, а потім розібрати їхнє Сховище!"

flavour_unique.3.t:0 "Зупинись або загинеш, Юний Кульгавий!"
flavour_unique.3.d:0 "Найважче в мандрах Пусткою – не мутанти, і не канібали. Найгірше – знайти зручне місце для ночівлі. Сьогоднішній вечір – не виняток. Але на горизонті з’являється халупа зі ще цілим дахом. Ти наближаєшся, вже уявляючи, як знімаєш чоботи. Відчиняєш двері, і... «Зупинись або загинеш, юний кульгавий! Іменем Штайнера фон Ґрінхенгаузена! Чого ти тут, порушнику смерті?!» – чоловік кричить з дивакуватим німецьким акцентом. Навколо – десяток диваків у незрозумілій уніформі.\n\n– Я просто шукав нічліг. Хто ви взагалі такі? – відповідаєш ти, кладучи руку на пістолет.\n\n– Не став мені питань, щуряко! Просто шукав, так? То знай, що це штаб офіцерів, які готуються захопити вашу пустку й перетворити радість на сльози! Але сьогодні я дарую тобі життя, за твою удачу! Якщо тільки пообіцяєш не заважати і зрізати всім кінцівки!\n\nТи дивишся з недовірою. Очевидно, цей бідолаха перевдихався радіації. І поки ти обмірковуєш, як відповісти, Штайнер кидає: – Приємно було зустрітись, нікчемний пустельник. Хоч мій величезний інтелект підказує, що ти тут важливіший, ніж здається. Auf Wiedersehen.\n\nІ він із своєю свитою виходить. Ти лишаєшся мовчки, укладаєшся на ніч, а божевільна балачка Штайнера все крутиться в голові. Через кілька годин ти нарешті знаходиш слова, щоб відповісти..."
flavour_unique.3.a:0 "\"Що за чортівня?..\""

#### mexican flavour events
mexicoflavour.1.t:0 "День мертвих"
mexicoflavour.1.d:0 "Сьогодні відзначають традиційне свято Дня мертвих. Хоча походження цього святкування майже втрачено за століття після Армагеддону, дух надприродного святкування та вшанування предків залишається сильним. По всій Мексиці – від вищих класів до найнижчих – це свято об'єднує народ, зберігаючи зв’язок з минулим світом ще на один рік."
mexicoflavour.1.a:0 "Залиште мені цукрового черепа!"
mexicoflavour.1.b:0 "Дивна, але мила традиція."

mexicoflavour.2.t:0 "Подяка богам"
mexicoflavour.2.d:0 "Сьогоднішня дата ознаменована святом Подяки в Мексиці. Хоча сам дух американського свята було спалено ядерним вогнем, ідея подяки богам залишилась. По всій Мексиці Тлалок дає їжу й намагається прищепити американську традицію мексиканському народу. Люди дякують своїм богам і моляться за ще один рік безпеки й виживання."
mexicoflavour.2.a:0 "Ем, дякую за безкоштовну їжу!"
mexicoflavour.2.b:0 "Наші традиції та дух буде відновлено."
mexicoflavour.2.c:0 "Дякуємо – сьогодні наш народ святкує!"

mexicoflavour.3.t:0 "Пам’ять про війну"
mexicoflavour.3.d:0 "Навіть через два століття виживання в пустелях, містах і джунглях Мексики, ми пам’ятаємо цю дату – початок Великої Війни. Багато з нас досі пам’ятає день, коли впали бомби. Цей день став днем руйнування нашої нації й кінцем світу. Але ми продовжимо процвітати ще один рік."
mexicoflavour.3.a:0 "Ми повинні святкувати наше виживання."

mexicoflavour.4.t:0 "Дар з небес"
mexicoflavour.4.d:0 "За століття клімат змінився докорінно – радіаційні бурі та посухи терзають пустку. Із черговою зміною сезонів у Мексиці наші люди, особливо фермери, знову моляться про дощ і родючість. Помолімося, щоб цей рік був щедрим."
mexicoflavour.4.a:0 "І небеса відповіли."
mexicoflavour.4.b:0 "Сухе безжиттєве безводдя знову."

mexicoflavour.5.t:0 "Неділя Слави"
mexicoflavour.5.d:0 "Сьогодні у Мексиці святкують Великдень. Хоч масштабних святкувань у цьому зруйнованому світі вже майже немає, дух цього свята залишився. По всій країні люди намагаються відродити традицію. Схоже, що звичаї Старого Світу не зникли остаточно."
mexicoflavour.5.a:0 "Дайте мені капіріотаду!"

mexicoflavour.6.t:0 "День Старого Світу"
mexicoflavour.6.d:0 "Сьогодні ми вшановуємо День Старого Світу – день пам’яті наших традицій і передвоєнних святкувань, які зникли у ядерному вогні. Це день, коли ми згадуємо спадщину старого світу та відзначаємо наше виживання ще на один рік."
mexicoflavour.6.a:0 "Ми не забудемо наших традицій."

mexicoflavour.7.t:0 "Річниця американської окупації"
mexicoflavour.7.d:0 "Сьогодні – похмурий день в історії Мексики, початок американської окупації. Навіть через два століття народ Мексики пам’ятає, як американські війська вперше вступили на мексиканську землю. Окупація призвела до анексії Північної Мексики, створення проамериканського маріонеткового уряду, корпорації Петро-Чіко (як філії Poseidon Energy), і формування Ріо-Ґранде, де американські солдати допомагали мексиканцям після падіння бомб. Попри століття, дух спротиву досі палає в серцях нашого народу."
mexicoflavour.7.a:0 "Наш народ і далі буде боротись."
mexicoflavour.7.b:0 "Це було визволення, а не окупація."
mexicoflavour.7.c:0 "Це – пляма на нашій історії."

mexicoflavour.8.t:0 "Ураган Тлалок вдарив по Південній Мексиці!"
mexicoflavour.8.d:0 "Ураган Тлалок, названий на честь бога дощу та бур, щойно досяг узбережжя Південної Мексики, принісши нищівні вітри та дощі. Повідомлення свідчать про значні руйнування: багато доріг та будівель зруйновано, сотні людей поранені. Ще раз пустка мусить витримати удар."
mexicoflavour.8.a:0 "Помолимось за них."
mexicoflavour.8.b:0 "Негайно відправити рятувальні загони!"

mexicoflavour.9.t:0 "Велика Південна Пожежа"
mexicoflavour.9.d:0 "За межами Мексики цивілізація закінчується. Ізотопні руїни Центральної Америки населені лише мігруючими племенами та біженцями, лише Геррерос із Гондурасу наважуються заходити в джунглі. Тепер, з-за Паністму, надходять густі стовпи диму з територій, відомих як Південна Америка. Небо над Південною Мексикою вкривається димом, викликаючи паніку та розгубленість, адже пояснення цьому явищу немає."
mexicoflavour.9.a:0 "Будемо надіятись на краще."
mexicoflavour.9.b:0 "Не бачимо – не чуємо."
mexicoflavour.9.c:0 "Ми вистоїмо, байдуже що там."

mexicoflavour.10.t:0 "На берег прибило уламки!"
mexicoflavour.10.d:0 "Після падіння бомб більшість кораблів перетворилися на кораблі-примари: екіпаж вимер від голоду чи радіації. І досі моря борознять залишені судна, дрейфуючи течіями. Сьогодні одне з таких суден викинуло на наш берег, його тінь впала на наш загін для збирання брухту. Це – подарунок від §BЧальчіутлікуе§!, богині океанів."
mexicoflavour.10.a:0 "На брухт!"
mexicoflavour.10.b:0 "Ми можемо чогось навчитись із цього."

mexicoflavour.11.t:0 "§RМИ ЛЮБИМО ДЕНЬ ГЕНЕРАЛІСІМУСА§!"
mexicoflavour.11.d:0 "Сьогодні весь народ Хенте дель Соль святкує День Генералісімуса! Це день, присвячений нашому непереможному, невразливому й неймовірно привабливому лідерові! Наш Генералісімус зробив багато для народу: всі пам’ятають, як він голіруч захищав Пуерто-Лібертад від натовпу гігантських крабів! Під час його виступу він проголосив: «Ми знайдемо своє місце під сонцем!» та «Це ви, мої друзі, зробили мене тим, ким я є. Без вас я був би ніким. Я так само пишаюсь бути вашим лідером, як ви пишаєтесь бути моїми підданими!» Його красномовну промову зустріли обов’язковими п’ятихвилинними оваціями стоячи, а один старенький чоловік навіть зомлів від надлишку емоцій."
mexicoflavour.11.a:0 "Хай живе Генералісімус!"

mexicoflavour.12.t:0 "День Заснування"
mexicoflavour.12.d:0 "Сьогодні річниця заснування нашої великої імперії, що вшановується діями Першого Оратора. Хоча її особистість давно перейшла у міфи, Перша Ораторка, Життєдарителька, вшановується за створення імперії Ацтлан. По всій імперії проходять святкові процесії, що завершуються великою опівнічною трапезою – на честь життя й процвітання, яке вона принесла цим землям. Хоча Оратори змінювались з часом, її спадщина в серці народу Ацтлан ніколи не згасне."
mexicoflavour.12.a:0 "Слава Імперії!"

mexicoflavour.13.t:0 "Велика Поразка"
mexicoflavour.13.d:0 "Сьогоднішній день – сумна дата для імперії Ацтлан, яка вшановує велику поразку у Північній війні проти Тлалока та нищівну поразку від Бога-Машини. Хоча шрами поступово загоїлись, життя, втрачені в тій катастрофі, залишили рану в серцях нашого народу, і цей день скорботи – лише маленький крок до зцілення."
mexicoflavour.13.a:0 "Найсумніша пригода..."
mexicoflavour.13.b:0 "Краще не згадувати."

mexicoflavour.14.t:0 "День Хвиль"
mexicoflavour.14.d:0 "Сьогодні на берегах Іци зібрались натовпи, щоб спостерігати за морськими перегонами, присвяченими Дню Хвиль. Засноване Каломте для підтримки давньої морської традиції Іци, це свято стало національним. Учасники змагаються, щоб привернути увагу адміралтейства, яке уважно спостерігає за подією."
mexicoflavour.14.a:0 "Який чудовий день!"
mexicoflavour.14.b:0 "Запишіть ім’я переможця."

mexicoflavour.15.t:0 "Міжнародний День Любителів Кави"
mexicoflavour.15.d:0 "Один із небагатьох святкових днів на всіх плантаціях Кости – Міжнародний День Любителів Кави – є обов’язковим святом для працівників плантацій. Вони можуть насолодитися плодами своєї праці й навіть отримують півдня вихідного – щедрий подарунок від самого Барона. Це свято поступово поширюється й серед іноземних клієнтів Кости завдяки знижкам на вибрані товари в цей день."
mexicoflavour.15.a:0 "Пиймо до дна!"
mexicoflavour.15.b:0 "Шахти ще світяться – це взагалі нормально?"

mexicoflavour.16.t:0 "Невибухнула Ядерна Бомба"
mexicoflavour.16.d:0 "Попри століття, що минули, жахи Великої Війни й досі нагадують про себе. На околиці сільського поселення робітники на полі виявили залишки ядерної боєголовки низької потужності, що так і не здетонувала. Спочатку спалахнула паніка, але згодом стало ясно, що снаряд – порожній. Тепер маємо вирішити: відгородити ділянку чи спробувати розмінувати."
mexicoflavour.16.a:0 "Не спокушаймо долю – залишимо як є."
mexicoflavour.16.b:0 "Обережність для боягузів – розкриваємо!"

mexicoflavour.17.t:0 "Тиша на Південному Фронті"
mexicoflavour.17.d:0 "Живучи на півдні Мексики, всі давно звикли до постійної загрози з південних пусток. Та сьогодні страх вщух. Рідкісні племена в джунглях мовчазні, а через радіоактивні гори не долинають ані бойові кличі, ані полум’я. \n\nКраще насолодитися спокоєм, поки можемо."
mexicoflavour.17.a:0 "Жодних новин – хороші новини!"
mexicoflavour.17.b:0 "Штиль... але де ж буря?"

mexicoflavour.18.t:0 "Щорічний День Вшанування Роботодавця"
mexicoflavour.18.d:0 "Сьогодні одне з головних свят племен Петрочіко – «Національний День Вшанування Роботодавця». Ймовірно, воно виникло на основі довоєнного свята. У цей день усі прихильники великої «Компнії» висловлюють вдячність своїм місцевим і центральним керівникам, а ті, у свою чергу, підносять шану своїм керівникам, аж до самого вершечка, де Ель Сіо кланяється терміналу Тлалока. Зрозуміло, що жодної користі сьогодні ніхто не приносить."
mexicoflavour.18.a:0 "Хай живе Ель Сіо!"
mexicoflavour.18.b:0 "Вони що, мазохісти?"

mexicoflavour.19.t:0 "День Незалежності"
mexicoflavour.19.d:0 "Незалежність Віце-королівства від Ацтлана ще свіжа в пам’яті, тому річниця стала важливою подією у Західній Мексиці. Для торговців Віце-королівства – це день святкувань, магазини часто зачиняються раніше. А от для вірних Ацтлану – це похмурий день, який вони здебільшого ігнорують, аби не виглядати непатріотично."
mexicoflavour.19.a:0 "За свободу!.. І за прибуток."
mexicoflavour.19.b:0 "Ми мали б оновити календар."

mexicoflavour.20.t:0 "День Народження Санта Анни"
mexicoflavour.20.d:0 "У цей день, у лютому 1794 року, на світ з’явився людський попередник Санта Анни. Хоча нинішній Санта Анна дуже далекий від свого предка, а деталі його минулого відомі лише завдяки згаслим банкам пам’яті Тлалока, ШІ все ще відчуває зв’язок із цим днем і вшановує його по-своєму. Цим скористались підпрограми Санта Анни, заохочуючи місцеве населення відзначати це свято, хоч люди й дещо збентежені, але ж ще один вихідний ніхто не відміняв."
mexicoflavour.20.a:0 "З Днем народження, сину. Я пишаюсь тобою."
mexicoflavour.20.b:0 "Пошлімо йому подарункову картку."
mexicoflavour.20.c:0 "Це що, сивий піксель у моєму волоссі?"

mexicoflavour.21.t:0 "Річниця Коронації Максиміліана"
mexicoflavour.21.d:0 "Століття тому інший Максиміліан правив Мексикою. Його правління було коротким, приреченим і трагічним – але слугує прецедентом для імперського бачення нового імператора. Попри брак даних, ШІ створив вигадану версію історії: розкішна церемонія, загальне щастя, укріплення нової ери миру й процвітання за допомогою Імперської Корони. Максиміліан намагається відтворити цю радість через обов’язкове державне свято, під час якого піддані святкують усю ніч і вчаться цінувати благородний абсолютизм і щедрість свого монарха."
mexicoflavour.21.a:0 "Пошлімо йому святковий e-mail."
mexicoflavour.21.b:0 "Я скучаю за тією короною..."

mexicoflavour.22.t:0 "Вогонь і Дощ"
mexicoflavour.22.d:0 "Багато давніх традицій мексиканського народу було втрачено внаслідок вторгнення та окупації іспанців. Навіть життя Монтесуми, відродженого крізь схеми та сталь, є для нього самого загадкою. Бази даних його покійного батька дають лише натяки на епоху, що була втрачена, спотворену та зневажену янкійським ревізіонізмом. Але Монтесума стикався з і більшими труднощами. Прийнявши власне відродження як знамення, він почав відновлювати традиції стародавніх народів науатль. Ці ритуали, викривлені його власною зіпсованістю, стали фарсовими монументами хаосу: церемонії Нового Вогню посилають клуби диму в небо, а низько летючі ракети використовуються як пробивачі хмар, щоб принести дар дощу Тлалока. Люди збентежені й налякані, але праця оновлення почалася – і лише Монтесума знає, чим вона завершиться."
mexicoflavour.22.a:0 "У руйнуванні – відродження."
mexicoflavour.22.b:0 "Стривайте, чому це взагалі свято?"

mexicoflavour.23.t:0 "День Конституції"
mexicoflavour.23.d:0 "Боротьба за душу Мексики, яку усе життя вів Сапата, коштувала йому життя. І хоча його улюблена країна сьогодні може бути невпізнанною, одна велика перемога залишається для нього священною – Конституція 1917 року. Соціалістична, прогресивна і Революційна з великої літери, ця конституція лишається провідною зорею для ШІ Сапати, а підписання цього документу 5 лютого стало національним святом у його нових землях. І хоча громадяни Сапати та всієї Мексики й досі живуть під гнітом несправедливості – доти, доки ця конституція веде вперед, для Мексики залишається надія."
mexicoflavour.23.a:0 "Ну, якщо це його тішить..."
mexicoflavour.23.b:0 "¡Viva México!"

mexicoflavour.24.t:0 "Битва у Великому Кільці"
mexicoflavour.24.d:0 "Сьогодні в Лос Мочис усе палало, коли місцевий улюбленець Чаво Герреро зіткнувся у матчі-реванші з п’ятнадцятьма суперниками поспіль. Гігант витримав понад пів години в рингу, перш ніж нарешті впав після командного прийому «прищепка», що вибив його з рингу. Хоча він і програв, його легендарна витривалість завоювала ще більше прихильників. Чаво обіцяє наступного разу триматися годину – щойно його зламані руки зростуться."
mexicoflavour.24.a:0 "Оце був бій!"
mexicoflavour.24.b:0 "Ненавиджу цих виродків..."
mexicoflavour.24.c:0 "Оце був бій!"

mexicoflavour.25.t:0 "Байки з Далечіні"
mexicoflavour.25.d:0 "Мексика – не єдина земля титанів і впалих імперій. Торговці з півночі – часті гості на наших землях, і вони приносять із собою розповіді про пригоди та героїзм, які б затьмарили навіть ягуарських воїнів Ацтлану. Деякі з цих історій стали місцевими улюбленцями, і коли водяні купці збираються біля вогнища – яку з них ми почуємо сьогодні?"
mexicoflavour.25.a:0 "Розкажи нам про Обраного."
mexicoflavour.25.b:0 "Розкажи про Великого Обчислювача."
mexicoflavour.25.c:0 "Маєш якісь новенькі історії?"

mexicoflavour.26.t:0 "Парад Панчо"
mexicoflavour.26.d:0 "Сьогодні в Колонеті великий день – народ Нижньої Каліфорнії святкує своє нове процвітання та безпеку під проводом Панчо Вільї. Напівспонтанні святкування, про які сам Панчо нібито й не знав, тривають до ночі: співи, танці та бенкети без упину. На честь Панчо навіть написали нову народну пісню, у якій оспівують як його мудрість як лідера, так і його... фізичні переваги."
mexicoflavour.26.a:0 "Це все для вас, мій народе!"
mexicoflavour.26.b:0 "Ще той пижон."

mexicoflavour.27.t:0 "Ґрінґо"
mexicoflavour.27.d:0 "Контрабанда з НКР стала справжнім національним промислом у Ла Пасі. Янкі не в захваті, але зробити щось не можуть. Втім, це не зупинило їхню дурну спробу заслати інформатора на південь – його швидко викрила наша охорона. Тепер, позбавлений фальшивих вусів і образливого сомбреро, ґрінґо благає відпустити його назад до НКР в обмін на чималий викуп. То що скажемо?"
mexicoflavour.27.a:0 "Нехай ідуть... За плату."
mexicoflavour.27.b:0 "Нікуди вони не підуть."

mexicoflavour.28.t:0 "Копати чи Крафтити?"
mexicoflavour.28.d:0 "Сьогодні місцевий форум Пінакате зупинився через, мабуть, одну з найтупіших суперечок століття. Відділ Робіт розділився на два ворогуючі табори: одні вимагають пріоритетного фінансування масштабного видобутку, інші наполягають на розвитку майстерень. Конфлікт зайшов у глухий кут, і вирішувати його тепер нам: копати чи крафтити?"
mexicoflavour.28.a:0 "Копати, звісно."
mexicoflavour.28.b:0 "Безумовно – крафтити!"

mexicoflavour.29.t:0 "Сіналоа Роха та Арізонський Рейнджер"
mexicoflavour.29.d:0 "Містечко Ультімо сьогодні завмерло після смертельної сутички між одним із залишків Арізонських Рейнджерів і місцевим бандитом на ім’я Сіналоа Роха. За словами очевидців, нарко останні кілька місяців дошкуляв місту, вимагаючи королівського ставлення від усіх, зокрема й від рейнджера. Коли той відмовився, в центрі міста відбулася дуель на високому полудні – рейнджер нашпигував Роху кулями ще до того, як той встиг витягнути пістолет. Нехай це й невеликий вчинок у масштабах всієї країни, цей акт прикордонного правосуддя значно зміцнив авторитет рейнджерів серед місцевих."
mexicoflavour.29.a:0 "Ось так ведеться справа."

mexicoflavour.30.t:0 "Траса Сіналоа"
mexicoflavour.30.d:0 "Хоча Велика Гонка проходить по стародавніх трасах та автострадах, дбайливо підтримуваних адептами з Ту Сан, щодня сміливі гонщики прокладають нові маршрути, шукаючи ідеальне поєднання різких поворотів, відкритих прямиків і карколомних звивин. [THIS.GetName] нещодавно затвердив новий маршрут, що охоплює північний захід Мексики, та назвав його «Трасою Сіналоа». Його рекорд часу розбурхав гонкову спільноту. Хоча цей рекорд скоро буде побито, [THIS.GetName] безсумнівно довів, що є майстром шалених перегонів."
mexicoflavour.30.a:0 "До упору!"

mexicoflavour.31.t:0 "День Ель Президенте"
mexicoflavour.31.d:0 "Посада президента в Республіці Ріо – це не просто глава держави. Вона уособлює спільну волю, оптимізм і стійкість народу Ріо. У пошуках гідного способу вшанувати цю посаду народ відродив стару американську традицію для нового часу. «День Ель Президенте» святкує не лише нинішнє керівництво Ріо, а й саму демократичну інституцію та великі жертви, принесені заради свободи – і зовнішньої, і внутрішньої. А ще це чудовий день для барбекю."
mexicoflavour.31.a:0 "¡Viva [THIS.Getleader]!"


