l_english:
RBT_femur_breakers:0 "Ломачі Стегон"
RBT_femur_breakers_desc:0 "Ми розставляємо пастки біля доріг і кордонів наших земель. Коли хтось наступає — їхні крики сповіщають нас про нові кістки та ребра для збирання."

CCW_dont_walk_the_bone_road:0 "Не Йди Кістяними Дорогами"
CCW_dont_walk_the_bone_road_desc:0 "Ніколи не входь у Падальні Пустки. Дороги там вкриті тілами тих, хто бажав розкрити їхні таємниці. Ніхто не повертається звідти — можливо, те, що приховане там, не має бути потривожене."

ARR_legacy_of_the_dweller:0 "Спадок Обраного"
ARR_legacy_of_the_dweller_desc:0 "Обраний бачив усе Пустельне — від вулиць Ріно до Міста-Сховища, Сан-Франциско, Шейді-Сендс, і навіть нафтової вишки в Тихому океані. Він навчив охоронців племені бойовим тактикам і поділився знаннями, здобутими під час подорожей."

EAS_control_of_the_i80:0 "Контроль над I-80"
EAS_control_of_the_i80_desc:0 "Ми контролюємо частину шосе I-80, що дозволяє караванам проходити через наші землі до Нью-Гаммонд, де торгівля склом приваблює багатьох купців. Мито з них підтримує нашу економіку. Але Вісімдесятники прагнуть узяти під контроль всю I-80, і ми не готові до цієї битви."

EAS_the_quarries_of_eastport:0 "Кар'єри Істпорта"
EAS_the_quarries_of_eastport_desc:0 "На нашій території залишилось багато довоєнних кар'єрів. Ми можемо перевозити величезні обсяги матеріалу до міст, де його подрібнюють і добувають цінні мінерали."

ANT_reliance_on_hunting:0 "Залежність від Полювання"
ANT_reliance_on_hunting_desc:0 "У нашій місцевості водиться безліч рагстагів та інших істот. Це дає нам багато їжі, шкур, м'яса й кісток для торгівлі. Наші люди також більш спритні, адже їм доводиться бігати за цими тваринами."

JAC_tactics_of_the_banshee:0 "Тактика Банші"
JAC_tactics_of_the_banshee_desc:0 "Банші навчився багатьох речей у Пустці, і передає свої знання нам — зокрема, як виживати на землі. Його історії підняли дух банд, які вже готові до рейдів."

SKY_a_home_like_no_other:0 "Дім, Не Схожий на Інші"
SKY_a_home_like_no_other_desc:0 "Це місце не схоже на інші. Бункери розкидані навколо, і більшість із них неможливо відкрити. Ті, що відчинені — повністю порожні. Жодних літаків, жодних тіл, жодного обладнання. Що ж це за місце таке?"

SOR_zion_trails:0 "Стежки Зайону"
SOR_zion_trails_desc:0 "Зайон — унікальний шлях для торгівлі, і компанія 'Щасливі Стежки' разом із кількома іншими регулярно проходять через нас, сплачуючи за охорону. Вони також постачають нам товари, яких у нас немає, на благо племені."

SOR_gecko_breeding:0 "Історія Приручення Геконів"
SOR_gecko_breeding_desc:0 "Плем’я поколіннями жило в мирі з геконами каньйонів. Вони живуть біля сіл разом із пастухами, забезпечуючи стабільну їжу та шкіру. Останніми роками молодь навіть бере їх у мисливські походи."

CLK_the_clock_must_always_tick:0 "§OГодинник Має Завжди Цокати§!"
CLK_the_clock_must_always_tick_desc:0 "Годинник — це серце Сховища. Він не повинен зупинятися... §Rі якщо він велить нам різати в його ім’я... ми підкоримося§!. §OГОДИННИК НІКОЛИ НЕ МАЄ ЗУПИНЯТИСЬ§!"

MOS_one_of_two:0 "Один із Двох"
MOS_one_of_two_desc:0 "Розлом — один із двох основних шляхів до Мохаве. Завдяки цьому через регіон проходить значна торгівля, а мито та продаж припасів приносять стабільний прибуток."

DEA_malpais_tactics:0 "Тактика Мальпаїса"
DEA_malpais_tactics_desc:0 "Під керівництвом Легата Мальпаїса Мертві Коні перетворили свої мисливські навички на мистецтво війни. Він навчив їх вистежувати ворогів, точити інстинкти, та дбати про стародавню зброю. У його тіні вони відчули подих нового шляху — суворого, дисциплінованого."

DEA_mormon_tactics:0 "Мормонська Тактика"
DEA_mormon_tactics_desc:0 "Хоча Швидка-Вода ніколи не любила навчання, вона завжди уважно слухала лекції про Святі Війни й стратегії. Повернувшись до племені, вона передала ці знання."

GRA_grabbing_in_raids:0 "Хапання під час рейдів"
GRA_grabbing_in_raids_desc:0 "Хапачі здобули своє ім’я завдяки блискавичним нападам на сусідів — вони забирають не лише чоловіків, а й жінок і дітей. Швидкі рейди стали головним болем для всіх довкола, хоча на обороні вони слабкі, особливо під час відступу з полоненими."

CYC_near_real_myths:0 "Майже Справжні Міфи"
CYC_near_real_myths_desc:0 "Плем’я Циклопів значно більше за інші. Це пов’язано з впливом GECK-а в момент його активації. На жаль, через генетичний дефект вони напівсліпі, але їхня сила та швидкість зазвичай це компенсують."

RUB_the_red_jewels:0 "Червоні Самоцвіти"
RUB_the_red_jewels_desc:0 "Долина, де розташований Притулок, приховує багато шахт із коштовним камінням, що використовуються для торгівлі замість кришок. Вони також дозволяють обмінювати їх на рідкісні ресурси."

RIP_rip_and_tear:0 "Рви й Рви Далі"
RIP_rip_and_tear_desc:0 "Території Ріперруль відомі своєю жорстокістю та канібалізмом. Вони роздирають жертв на шматки, поїдаючи частини їхніх тіл на очах у ще живих полонених."

YKZ_extortion_and_protection:0 "Вимагання й Захист"
YKZ_extortion_and_protection_desc:0 "Як і до війни, Якудза вимагає плату за «захист» у підприємств на своїй території. У них також залишилося чимало клинків ще з часів до Великої Війни, що дає перевагу над саморобною зброєю пустки."

TOB_bone_wielders:0 "Костяні Воїни"
TOB_bone_wielders_desc:0 "Старі Кістяки використовують зброю з кісток — хоч вона й проста у виробництві, особливо ефективною не назвеш. Ці кістки здобувають переважно з мертвих, а також у печері, що стала їм домом."

DRY_deep_underground:0 "Глибоко Під Землею"
DRY_deep_underground_desc:0 "Народжені в глибинах, Суходуви більшість часу проводять у копальні. Це дає їм чимало ресурсів, а також дозволяє губити переслідувачів у печерах. Вони не найкращі бійці, бо радше тікають, ніж б’ються."

YMP_trying_to_start_anew:0 "Спроба Почати Спочатку"
YMP_trying_to_start_anew_desc:0 "Баттері зробив багато сумнівного в минулому. Він сподівається, що новий дім дозволить йому залишити це позаду, тому прагне уникати конфліктів. Але він не вагатиметься вдарити першим, якщо його людям щось загрожує."

GLW_entertaining_passing_traders:0 "Розваги для Торговців"
GLW_entertaining_passing_traders_desc:0 "Патчіс проводить вечори комедії для всієї спільноти, часто привертаючи торгівців і падальників. Вони щедро дякують йому, а він витрачає ці гроші на добробут громади. Жарти навіть допомагають отримати знижки на медичні товари — не дивно, що він тут улюбленець."

LUM_rallying_a_great_horde:0 "Збір Великої Орди"
LUM_rallying_a_great_horde_desc:0 "Великий Сяючий Щодня приваблює нових гуль, особливо вночі, коли він скидає обладунок і сяє як маяк. Його справжні наміри лишаються невідомими — жоден, хто з ним зустрівся, не вижив, аби розповісти."

WHD_the_hangdogs_will_be_put_down:0 "Повісити Псів"
WHD_the_hangdogs_will_be_put_down_desc:0 "Старий Пес пам’ятає свій дім у Денвері. Він довго зберігав його після війни, навіть об’єднав гулів міста. Але коли прийшов Той-Що-Оголює Ікла зі своєю бандою, вони зруйнували все динамітом і змусили гулів тікати. Старий Пес присягнувся повернути своє — ніхто не чіпає Пса без наслідків."

ROB_so_many_dumb_friends:0 "§pСтільки Нових Друзів§!"
ROB_so_many_dumb_friends_desc:0 "Я більше не самотній! Стільки Нових Друзів! Так, вони не вміють говорити, як АРГОС... §cале я знайду когось, хто зможе... правда ж?§"

FOR_salvaging_experience:0 "Досвід Збирача"
FOR_salvaging_experience_desc:0 "У Денвері в кожного був свій клаптик землі, поки ці псячі фанатики не вигнали нас. Тутешні землі не такі вже й погані, але це точно не Денвер. Більше ми не втратимо своїх прав — навіть якщо вони посередні."

FOR_salvaging_experience_2:0 "Штат Збирачів"
FOR_salvaging_experience_2_desc:0 "Хоч це й не Денвер, ми таки налагодили збирацькі операції й торгові шляхи в гірських проходах."

INR_forgotten_exiles:0 "Забуті Вигнанці"
INR_forgotten_exiles_desc:0 "Нас вигнали з племені, назви якого ми вже й не пам’ятаємо. Великий Шлях поведе нас, показуючи сліди пробудженого Старого Світу."

INR_forgotten_exiles_2:0 "Нова Ідентичність"
INR_forgotten_exiles_2_desc:0 "Ми досі йдемо Великим Шляхом, але вже не соромимось свого минулого. Ми крокуємо вільно, без кайданів чи жалю."

MXC_the_battered_chapter:0 "Понівечений Відділ"
MXC_the_battered_chapter_desc:0 "Нас побили й знекровили Пси, наші припаси вичерпуються, а новий напад — лиш питання часу. Ми мусимо триматися до кінця, поки не прийде допомога із заходу. За Мексона! За Братство!"

SCO_western_experience:0 "Західний Досвід"
SCO_western_experience_desc:0 "Берк поділився досвідом із бандою — зокрема, своїми спостереженнями за армією НКР і тим, як Послідовники виживали з мінімальними ресурсами."

radscorpion_attack_idea_tt:0 "Атака радіоскорпіонів: §G+5.00%§!"

SCO_scorpions_specialty:0 "Дресирувальники Скорпіонів"
SCO_scorpions_specialty_desc:0 "Клан із Бастіону десятиліттями тримав радіоскорпіонів задля отрути, здатної вбити з однієї стріли. Згодом, на думку деяких, між наглядачами й цими істотами утворився зв'язок. Тепер вони вірять, що можуть разом іти в бій, роздираючи ворогів на шматки."

BSU_skilled_mechanics:0 "Умілі Механіки"
BSU_skilled_mechanics_desc:0 "До війни Чорне Сонце було наповнене автомайстернями, і з роками мешканці звикли їх використовувати. Тепер вони — одні з найкращих механіків у всьому Колорадо."

SUN_the_dogs_of_war:0 "Пси Війни"
SUN_the_dogs_of_war_desc:0 "Пси Сонця ніколи не відступають. Їхні пси ретельно відбираються та розводяться, і плем’я зарекомендувало себе як завзятий боєць у Колорадо, утвердивши свою присутність у регіоні."

CLJ_explosive_lust:0 "Пристрасть до Вибухівки"
CLJ_explosive_lust_desc:0 "Відбирачі просто обожнюють вибухівку й постійно експериментують із тим, що мають. Їхній підхід дозволяє максимально ефективно використати кожну бомбу."

CLJ_explosive_lust_2:0 "Вибухова Лють"
CLJ_explosive_lust_2_desc:0 "Маючи припаси й досвід боїв у горах, небагато хто вміє так голосно гупнути, як ми!"

CIP_wilson_research_facility:0 "Наше Минуле в Лос-Аламосі"
CIP_wilson_research_facility_desc:0 "Засновники нашого племені були науковцями з Дослідницького центру Лос-Аламоса. Коли почалася Велика війна, вони втекли й оселилися тут, узявши з собою креслення, що й досі нам служать."

SUF_love_of_the_bomb:0 "Любов до Бомби"
SUF_love_of_the_bomb_desc:0 "Федерація із задоволенням використовує вибухівку проти рейдерської наволочі. Багато з її лідерів піднялись завдяки їй, і з часом навчилися робити її краще й смертоносніше."

EXE_vault_tec_remnants:0 "Залишки Vault-Tec"
EXE_vault_tec_remnants_desc:0 "Керівники — одні з останніх, хто залишився з корпорації Vault-Tec. Хоч їх і вигнали з притулку, їм вдалося винести багато корисного, що допомагає їм у ремонтах і розробках."

CAR_just_let_me_grill:0 "Просто Дайте Нам Готувати"
CAR_just_let_me_grill_desc:0 "Все, чого хочуть карфагеняни — це приготувати собі щось на грилі. Крики їхніх жертв говорять інше, але краще не згадувати про це при Шефі, інакше... можете стати наступною стравою."

TPM_legacy_of_enforcement:0 "Спадок Правоохоронців"
TPM_legacy_of_enforcement_desc:0 "Легенди старих законників надихають наших людей. Вони мандрують безкраїм степом, шукають припаси та вершать правосуддя. Проте, як і їхні попередники, ми маємо нести тягар управління. А ще є корупція... Але принаймні податки збираються."

BAM_canning_our_food:0 "Консервування Їжі"
BAM_canning_our_food_desc:0 "Оскільки Баю Моторс базується в старій консервній фабриці 'Мама Долс', вони почали консервувати їжу. Вона довго зберігається та добре продається, приносячи дохід, такий необхідний компанії."

ASS_hit_and_runner_blades:0 "Леза Нальотчиків"
ASS_hit_and_runner_blades_desc:0 "Тафі та її команда майстри нальотів і швидкого відступу. Ролики дозволяють їм атакувати й тікати миттєво, але у захисті їм бракує витримки."

TUB_live_on_air:0 "В Ефірі"
TUB_live_on_air_desc:0 "Містер Ентерпрайс веде трансляції по 5–8 годин щодня, збільшуючи впізнаваність свого імені. Його монополія на ремонт і встановлення телевізорів дарує KXll владу і над гаманцями, і над свідомістю мешканців Північного Далласа."

RBD_ranching_lifestyle:0 "Фермерський Спосіб Життя"
RBD_ranching_lifestyle_desc:0 "Фермерство — тяжка праця, особливо в несприятливих умовах. Родини вкладають у це все, що мають, і тому готові боронити свої землі до останнього, адже це — єдиний відомий їм шлях."

LGS_the_last_mexican_democracy:0 "Остання Демократія Мексики"
LGS_the_last_mexican_democracy_desc:0 "Лас Ґранхас вважає себе останньою демократією Мексики. Вони відмовились від захисту Тлалока й мріють повернути собі країну. Але на півночі хижий монстр з Арізони — і, можливо, їхня впертість стане фатальною..."

SIN_a_monument_of_sin:0 "Монумент Гріху"
SIN_a_monument_of_sin_desc:0 "Картель Сіналоа відомий жорстокістю, але також і насолодами. Їхні нарколабораторії та бари приносять їм прибуток і без рейдів, хоча останні — особливо на 'Останню Демократію' — їм до вподоби."

BLO_tlalocs_eyesore:0 "Колюче Око Тлалока"
BLO_tlalocs_eyesore_desc:0 "Картель Бельтрана межує з 'покровителем', що нічого не захищає. Вони змушені самі боронити себе, часто здаючи найманців тим, хто платить. Це дає дохід, але не той, що мають їхні суперники — Сіналоанці."

BEL_trans_alsaskan_pipeline:0 "Трансаляскинський Нафтопровід"
BEL_trans_alsaskan_pipeline_desc:0 "Інженери армії США проклали нафтопровід з Орегону до Аляски ще до війни. Після вторгнення Китаю його укріпили, і велика його частина пережила атомний вогонь. Він досі подає паливо — для гідропоніки, обігріву й накопичення запасів для армії [From.Owner.GetName]."

BAR_the_barons_of_california:0 "Барони Каліфорнії"
BAR_the_barons_of_california_desc:0 "Брамінові барони контролюють значну частину Каліфорнії завдяки багатству. Та через потреби ранчо частина охорони змушена працювати пастухами, а не вартовими."

DAY_a_equitable_nation:0 "Рівноправна Нація"
DAY_a_equitable_nation_desc:0 "Дейглоу приймає всіх — людей, гулів, мутантів. Тут кожен має шанс на життя та гідність."

DAY_operation_clipboard:0 "Операція 'Кліпборд'"
DAY_operation_clipboard_desc:0 "Після битви при Наварро Дейглоу прийняло вчених з Анклаву. Вони допомогли країні розвиватись у багатьох галузях. Їхнє минуле — не наша справа. Без них ми б не мали таких блискучих умів."

BON_home_of_the_gunrunners:0 "Домівка Збройових Контрабандистів"
BON_home_of_the_gunrunners_desc:0 "Збройові Контрабандисти облаштувались у нашій країні, даючи нам змогу купувати якісну зброю за розумною ціною."

BON_a_hub_of_trade:0 "Торговельний Центр"
BON_a_hub_of_trade_desc:0 "Габ — одне з найзаможніших поселень Пустки, принаймні на західному узбережжі. Завдяки цьому ми отримуємо значні прибутки, які можемо використати."

BOO_the_guns_of_nellis:0 "Гармати Нелліса"
BOO_the_guns_of_nellis_desc:0 "Артилерія, що охороняє наш дім, не дає шансів ворогам. Щойно вони наближаються — ми зносимо їх з лиця землі ще до того, як вони дістануться до нас."

FRI_the_rails_of_frisco:0 "Рейки Фріско"
FRI_the_rails_of_frisco_desc:0 "До війни у Фріско був залізничний вузол. Завдяки кресленням, що вціліли, ми можемо надійно відновити рейки — а можливо, навіть і потяги."

JCT_our_slice_of_paradise:0 "Наш Куточок Раю"
JCT_our_slice_of_paradise_desc:0 "Після загибелі Творця ми побачили, що 'нормі' не такі вже й погані... Але вони досі не адаптовані. Вони досі прагнуть нас знищити. Ми мусимо бути готові до оборони."

TWI_the_bloodiest_tribe:0 "§RНайкровожерливіше Плем’я§!"
TWI_the_bloodiest_tribe_desc:0 "Легіон знищив наше плем’я, залишивши лиш уламки. Лише §PБогиня Місяця§! і §BКур’єр§! залишились. Але тепер, коли плем’я зібране знову — ми не зникнемо тихо, як і наші предки."

PHR_the_phoenix_rises:0 "Фенікс Повстав"
PHR_the_phoenix_rises_desc:0 "Ми повернули Фенікс. Ми не маємо права впасти. Ми триматимемося до останнього. Фенікс воскрес — і §Oми стоятимемо вічно§!"

FLA_an_economic_powerhouse:0 "Економічна Потуга"
FLA_an_economic_powerhouse_desc:0 "Як колишня столиця Легіону, Флагстафф перетворили на справжнє місто — вартісне трону бога серед людей."

FLA_pretorian_remnants:0 "Залишки Преторіанців"
FLA_pretorian_remnants_desc:0 "Останки Преторіанської гвардії осіли у Флагстаффі. Вони готові вмерти, захищаючи 'Столицю Цезаря'. Їхні тренування суворі, багато гине — але такою є ціна майстерності."

BLK_the_remnants_of_the_legion:0 "Залишки Легіону"
BLK_the_remnants_of_the_legion_desc:0 "Саме тут почався Легіон. Плем’я Чорноногих ніколи не забуде, хто дав початок імперії. І вони не дозволять цій мрії згаснути."

HUA_hold_against_outsiders:0 "Вистояти Проти Загарбників"
HUA_hold_against_outsiders_desc:0 "Нас гнобили надто довго. Від кігтів Американського Орла до рогів Легіону — ми втомилися бути рабами. Наступного разу, коли вони прийдуть... ми дамо бій. Або загинемо."

WAP_baan_baaha:0 "Лаан Бааха"
WAP_baan_baaha_desc:0 "Західне плем’я Білогорців — частина Західних Апачів. Вони називають себе Лаан Бааха — 'Народ, що Йде на Війну'. І навіть Ядерний Армагеддон не знищив цю спадщину."

WAP_dzilghaaa:0 "Дзіл'Гхаа'а"
WAP_dzilghaaa_desc:0 "Східні Білогорці — 'Народ, Що Живе на Вершинах Гір'. Вони навчилися виживати в суворому ландшафті Арізони."

TSI_the_road_runners:0 "Дорожні Бігуни"
TSI_the_road_runners_desc:0 "Плем’я Десяти Знаків — майстри доріг. Вони рухаються швидко та легко оминають небезпеки, що поглинають звичайних мандрівників."

RSR_the_rio_grande_pitstop:0 "Привал на Ріо-Ґранде"
RSR_the_rio_grande_pitstop_desc:0 "Місто Червоного Сонця — популярне місце для торгівлі, адже через нього тече Ріо-Ґранде, приносячи багатство в регіон."

NOE_a_nomadic_pact:0 "Кочовий Пакт"
NOE_a_nomadic_pact_desc:0 "Племена Ноеменів об’єдналися, уклавши пакт про мир та співпрацю. Ноє прагне тримати своє плем’я подалі від чужих конфліктів."

PSH_defense_directive:0 "Оборонна Директива Джефферсон"
PSH_defense_directive_desc:0 "§MДЕРЖАВНА ОБОРОННА ДИРЕКТИВА ДЖЕФФЕРСОН АКТИВНА. ЦІЛЬ: ЗАБЕЗПЕЧИТИ КОНТРОЛЬ НАВКОЛО. ОЧІКУВАННЯ ІНСТРУКЦІЙ ВІД MDMAD§!"

WEN_oasis_hotsprings:0 "Гарячі Джерела Вендовера"
WEN_oasis_hotsprings_desc:0 "Природні гарячі джерела, що з’явилися ще до війни, зробили Вендовер популярним серед торговців і мандрівників. Це — найкраща ванна в житті. І так, вона не радіоактивна. Ціна кусається, але коли ви востаннє мились у чистій воді?"

MRA_disunited_efforts:0 "Роз'єднані зусилля"
MRA_disunited_efforts_desc:0 "Банди Мохаве майже ніколи не діють разом, що значно ускладнює їхню здатність протистояти зовнішнім загрозам."

UTO_a_nightkins_ravings:0 "Маячня Тіні"
UTO_a_nightkins_ravings_desc:0 "Тінь захопила радіостанцію на Чорній Горі та веде в ефір маячню про знищення людства й подібні речі. Чесно кажучи, як мінімум — це розважально."

HRO_ussa_headquarters:0 "Штаб-квартира USSA"
HRO_ussa_headquarters_desc:0 "Управління Повітря США розміщувалося тут, у Г'юстоні, що дало нам доступ до технологій, креслень і військових документів старого світу. Це джерело натхнення для власних розробок."

TAA_the_master_gunsmiths:0 "Майстри-зброярі Техасу"
TAA_the_master_gunsmiths_desc:0 "Техаська асоціація озброєнь володіє одними з найкращих зброярів у регіоні. Їхня зброя — якісна, надійна і відносно дешева у виробництві. Не дивно, що її бажають усі."

ORO_undying_hatred:0 "Падіння Легіону"
ORO_undying_hatred_desc:0 "$oro_plan_against_the_legion_desc$"

NEW_a_city_of_sin:0 "Імперія гріха"
NEW_a_city_of_sin_desc:0 "Нью-Ріно — нація, натхненна гангстерами старої Америки. Тут панують наркотики, проституція й усе, що повзає під червоними неоновими вивісками. Життя тут — негарне, але хтось має його жити."

NEW_tourist_economy:0 "Перетуризм"
NEW_tourist_economy_desc:0 "Нью-Ріно залежить від доходів із казино й інших 'розваг'. Проблема в тому, що туристів занадто багато. Прибутки великі, але майже не потрапляють до уряду, який усе це фінансує. Інфраструктура ледь витримує навантаження, а коштів на інші галузі майже не залишається."

NEW_tourist_economy_tt:0 "§gДеякі фокуси або події можуть прискорити економічне пристосування Нью-Ріно.§!"

SHI_the_emperor:0 "Імператор"
SHI_the_emperor_desc:0 "Імператор — це надсучасна обчислювальна система, яка керує народом Ші з тіні. Лише одиниці знають про його існування. Завдяки здатності прогнозувати майбутнє, він дозволяє Ши бути на крок попереду будь-якої загрози."

BOS_technologies_of_the_old_world:0 "Технології Старого Світу"
BOS_technologies_of_the_old_world_desc:0 "Братство Сталі, вірне вченню своїх старійшин, одержиме збиранням технологій Старого Світу — і тим, щоб вони не потрапили до рук варварів."

WBH_the_stalkers_of_seattle:0 "Сталкери Сіетла"
WBH_the_stalkers_of_seattle_desc:0 "Безсмертний і його темна гілка Братства нишпорять Сіетлом, убиваючи одних, поневолюючи інших. Їхня мета — зробити місто кошмаром для всіх, хто посміє ступити на цю землю."

MOJ_elijah_determination:0 "Завзятість Елайджі"
MOJ_elijah_determination_desc:0 "Старійшина Елайджа володіє завзяттям, якого бракує навіть основному відділенню Братства. Це вже радше фанатизм, ніж рішучість. Але він готовий на все, аби його місія в Мохаве не провалилась."

DES_rangers_lead_the_way:0 "Рейнджери ведуть шлях"
DES_rangers_lead_the_way_desc:0 "Попри ослаблення після втечі з Арізони, Рейнджери досі залишаються сильною силою, готовою битися й захищати тих, хто довірив їм життя."

GDH_the_generalismos_arsenal:0 "Арсенал Генераліссімуса"
GDH_the_generalismos_arsenal_desc:0 "У Генераліссімуса безліч зброї — і для себе, і для будь-кого, хто може заплатити. Але пам’ятайте: повернення немає!"

HAN_the_presidential_cult:0 "Культ Президента"
HAN_the_presidential_cult_desc:0 "У руїнах Денвера діє культ, що поклоняється одному з довоєнних 'президентів'. Начебто 'Рей-Гану'... чи як його там. Вони не становлять загрози, а знання в них цікаві. Тож поки що хай живуть."

MXC_aid_of_the_patriarch:0 "Допомога Патріарха"
MXC_aid_of_the_patriarch_desc:0 "Відділ Мексона давно потерпає без підтримки, тож звернувся до одного з воєначальників Колорадо. Допомога — бажана, але між угрупованнями зростає напруга: ніхто не довіряє іншому повністю."

ROB_servitors:0 "Сервітор-боти"
ROB_servitors_desc:0 "Виявлено нову програму: СЕРВІТОРИ мусить охороняти та обслуговувати Doki Doki. Забезпечити оптимальну роботу систем. ВИПРАВИТИ всі збіои... обтімально..."

IRN_libertys_rage:0 "Лють Ліберті"
IRN_libertys_rage_desc:0 "Ліберті — дочка Патріарха Колорадо. Вона не зупиниться, доки її батько не впаде на коліна, а Колорадо не буде під її владою."

des_colorado_support:0 "Підтримка з Колорадо"
des_colorado_support_desc:0 "Ми відправили групу Рейнджерів у Колорадо, щоб отримати допомогу від місцевих сил. Поки вони залишаються там, ми отримуємо постачання — і нових добровольців."

BAG_the_colorado_rangers:0 "Рейнджери Колорадо"
BAG_the_colorado_rangers_desc:0 "Дезерт Рейнджери оселилися на нашій території, допомагаючи мешканцям Колорадо. У відповідь ми забезпечуємо їх необхідним і передаємо все назад до штабу."

MOT_NCRF_Labor:0 "Примусова праця НКРСВ"
MOT_NCRF_Labor_desc:0 "Після заснування Виправного Центру НКР у Мохаве, злочинців, яких раніше розстрілювали чи садили на місці, тепер змушують працювати: розчищати рейки, будувати й копати."

VIP_posioned_weaponry:0 "Отруєна зброя"
VIP_posioned_weaponry_desc:0 "Наше плем’я з давніх часів опанувало отрути Великого Змія. Жоден воїн не вирушає в бій без отруєної зброї. У кожного — своя суміш, але мета одна: повільна, болісна смерть ворога."

SLE_followers_of_presper:0 "Послідовники Преспера"
SLE_followers_of_presper_desc:0 "Сліпери — це залишки вчених і солдатів, вірних Віктору Пресперу. Хоч лідер давно мертвий, його ідеї живі. І навіть без нього, Сліпери мають чітку мету: реалізувати його темні плани та підкорити світ."

TIM_living_off_the_land:0 "Життя з землі"
TIM_living_off_the_land_desc:0 "Народ Лісового Рубежу досконало опанував виживання в дикій природі — полювання, збирання, ремесла. Навіть у ворожих землях вони завжди знайдуть, чим пообідати."

KAM_kitted_raiders:0 "Укомплектовані рейдери"
KAM_kitted_raiders_desc:0 "Камлоські рейдери можуть і не виглядати як типові грабіжники, але щойно ви побачите їх у напіввійськовій формі — знайте, що ваша родина в небезпеці."

WHI_nomads_of_nowhere:0 "Кочівники Ніде"
WHI_nomads_of_nowhere_desc:0 "Вістлери не мають постійного дому. Вони мандрують каскадійською глушиною, живучи з природи. Це далося ціною: про архітектуру вони знають лише те, як зібрати зимову халабуду."

DRE_valentine_milita:0 "Міліція Валентайна"
DRE_valentine_milita_desc:0 "Міліція Валентайна — це шахтарі, що патрулюють копальні Дреджерів, знищуючи всіх рейдерів, які надто наблизилися до поселень. Водночас вони не надто дружні й до власного люду: купці та мандрівники завжди на сторожі, щоб не перейти невидиму межу."

CMC_oklahomas_strip:0 "Стріп Оклахоми"
CMC_oklahomas_strip_desc:0 "Big Spend — найбільше поселення півдня з цілою купою казино та гральних центрів. Торговці з заходу називають його місцевим Стріпом Нью-Вегаса. Звісно, за всім треба стежити, але витрати не порівняти з прибутком."

CHO_keepers_of_knowlege:0 "Хранителі знань"
CHO_keepers_of_knowlege_desc:0 "Нація Чокто відома своїми провидцями й шаманами, які розповідають історії предків та перемог минулого. Ця традиція пережила покоління — і навіть атомний вогонь не зміг знищити їхні пісні."

CHR_investigating_the_unknown:0 "Дослідження невідомого"
CHR_investigating_the_unknown_desc:0 "Черокі стали свідками чималої кількості дивних явищ. Ще до війни уряд США проводив тут дослідження. Ми маємо продовжити ці розслідування — навіть якщо це вимагає жертв у військовій сфері."

EDN_brotherhood_knowlege:0 "Знання Братства"
EDN_brotherhood_knowlege_desc:0 "Братство Сталі зберігало знання Старого Світу. Скарлет і її люди, ізолювавшись для охорони G.E.C.K., взяли з собою архіви Братства, щоб навчати тих, хто піде за ними."

VIC_victorian_warfare:0 "Вікторіанське ведення війни"
VIC_victorian_warfare_desc:0 "У Новій Вікторії наслідують армії давнього Старого Світу — не 200 років тому, а тисячоліттями раніше. Рівні ряди, неточна зброя, повільне перезарядження. Це дивно, застаріло — але дисципліна у них найвища на Пустці."

HGH_the_temples_of_nicea:0 "Храми Нової Нікеї"
HGH_the_temples_of_nicea_desc:0 "У Новій Нікеї збереглися великі храми — частково зі старих часів, частково новозбудовані під землею. Там проповідують священики, і саме завдяки ним до нас тягнуться паломники з усіх закутків Пустки."

ANO_gods_chosen:0 "Обранці Господа"
ANO_gods_chosen_desc:0 "Ми — обрані Господа. Усі інші — єретики, позбавлені благословення. Вогнем і сталлю ми виправимо їхні гріхи. Не буде пощади тим, кого не помазано."

MUR_reformist_principles:0 "Принципи реформаторів"
MUR_reformist_principles_desc:0 "Муртоу сповідує реформу через милосердя: допомогу нужденним, незалежно від віросповідання. Це привертає інших, хто бачить у них приклад доброти в бездушному світі."

LON_effects_of_paranoia:0 "Наслідки параної"
LON_effects_of_paranoia_desc:0 "За керівництва параноїка Мунвочера Сайо нація постійно готова до вторгнення. Але страх і підозра точать дух народу Лонітрі. Готуючись до ворога, ми самі стаємо його жертвою."

RRG_american_origins:0 "Американське коріння"
RRG_american_origins_desc:0 "Республіка Ріо-Ґранде була маріонеткою США до Великої Війни. Пропаганда міцно вкоренилась. Багато хто служить охоче, але тавро 'не-мексиканців' досі шкодить нашому іміджу."

ARM_combined_army:0 "Об’єднена армада"
ARM_combined_army_desc:0 "Наші сили складаються з людей і машин, що дає нам гнучкість і потужність. Але споживання ресурсів зростає разюче — ціна за силу."

two_languages_one_state:0 "Мовний конфлікт"
two_languages_one_state_desc:0 "Ми на перехресті США та Мексики. Тут говорять і англійською, і іспанською. Відсутність єдиної мови ускладнює комунікацію та створює напругу."

#4.0/5.0?#
NAT_baron_funding:0 "Фінансування баронів"
NAT_baron_funding_desc:0 "Брамичні барони фінансують нашу експедицію на північ, забезпечуючи військо спорядженням і покриваючи частину витрат, зокрема на пост Ган Раннерів. Та з часом наші вояки лінуються — служать радше інтересам баронів, ніж національній безпеці."

NAT_unstable_region:0 "Нестабільний регіон"
NAT_unstable_region_desc:0 "Територія Наварро колись була однією з найстабільніших у НКР. Але після скорочення фінансування через кампанію в Мохаве й хвилю закликів до незалежності (дехто щиро, дехто — ні), адміністрація регіону ледь справляється з постачанням і безпекою. Розширення наразі неможливе."

PAC_traditions:0 "Давні традиції"
PAC_traditions_desc:0 "Наш народ із самого початку шанував природу — і вона віддячила нам щедрими дарами."

MXS_slave_labor:0 "Борг барона"
MXS_slave_labor_desc:0 "Хоча НКР офіційно нас не підтримує, Інвестор заборгував її дипломатам за безпеку. Частина нашої продукції йде до Республіки — як знак вдячності. Або як данина."

MXS_slave_labor_2:0 "Борг барона"
MXS_slave_labor_2_desc:0 "Хоча НКР офіційно нас не підтримує, Інвестор заборгував її дипломатам за безпеку. Частина нашої продукції йде до Республіки — як знак вдячності. Або як данина."

MXS_unpaid_vacations:0 "§0Невиплачені відпустки§!"

FOU_trading_crossroad:0 "Перехрестя торгівлі"
FOU_trading_crossroad_desc:0 "Наша нація заснована на торгівельному шляху між Арройо і НКР. Ми гарантуємо безпеку й отримуємо ковпаки. Усе чудово — от тільки обидві сторони мріють забрати Перехрестя собі."

TDN_hive:0 "Вулий покидьків"
TDN_hive_desc:0 "Ден — це справжній вертеп. Хімія, повії, злочинність — тут є все. Єдине місце, що може змагатись у занепаді — це Ріно."

SLN_wary_of_the_outside:0 "Насторожені до поверхні"
SLN_wary_of_the_outside_desc:0 "Земляни завжди нас зневажали. Тож ми завжди були готові до того дня, коли вони прийдуть — знову."

SOK_tis_but_a_scratch:0 "Засвоєні уроки"
SOK_tis_but_a_scratch_desc:0 "Кага виніс урок зі свого зіткнення з Обраним. Наступного разу переможцем буде він. І жоден герой цього не зупинить."

GRD_worshiping_technology:0 "Культ технологій"
GRD_worshiping_technology_desc:0 "Технології не мають потрапити до рук пустельних дикунів. Принаймні так каже наш друг Кочіс... а хто ми, щоб сперечатися з ІІ?"

TOF_powder_gangers:0 "Порохові братчики"
TOF_powder_gangers_desc:0 "Немає наглядача — нема правил. Тепер ми можемо рейдити, гасати через гнізда когтей смерті, бухати й підривати все довкола. Інші банди хай тримаються подалі, якщо не хочуть злетіти на повітря."

TOF_love_for_bomb:0 "Майстри підриву"

PAS_defending_the_passes:0 "Оборона перевалів"
PAS_defending_the_passes_desc:0 "Рейнджери-вбивці, жертви... тих істот, психи-роботи з півночі — ми не пропустимо жодного з них. Хочеш пройти — пролий кров."

BGR_dreams_of_unity:0 "Мрії про 'Єдність'"
BGR_dreams_of_unity_desc:0 "Одного дня всі будуть єдині. Пануватиме мир. Але до того буде дуже, дуже багато крові."

ENT_the_red_menace:0 "Червона загроза"
ENT_the_red_menace_desc:0 "Роботи з Краю Трави — щоденна загроза. Вони шпигують, зондирують, хочуть 'інтегрувати'. Нікому з нас це не подобається."

WHC_centralized_authority:0 "Централізована влада"
WHC_centralized_authority_desc:0 "Дивні жінки з мечами в ставках — погана основа для уряду. Тому в нас є нормальні інституції. Ну, більш-менш."

IRC_stable_trading_network:0 "Стабільна торгова мережа"
IRC_stable_trading_network_desc:0 "Ми тримались осторонь від більшості війн, зберігши нейтралітет і довіру. Завдяки цьому стали надійним торговим партнером."

COM_a_bug_planet:0 "Єдиний хороший жук — мертвий жук!"
COM_a_bug_planet_desc:0 "Це жахливий край. Жучиний край. Край, ворожий до життя!"

STA_two_family_rule:0 "Влада двох родин"
STA_two_family_rule_desc:0 "Дві родини Зграї мають рівну владу в країні. Це дає стабільність — але позбавляє послідовності."

NIT_memories_of_horror:0 "Спогади про жах"
NIT_memories_of_horror_desc:0 "Наші предки залишили спогади про те, що зробили США та Канада: поневолення, побиття, зламання волі. Ми ніколи не дозволимо, щоб це повторилося. Якщо вони спробують — їхня кров скропить власну землю."

HVR_overlooked:0 "Забуті історією"
HVR_overlooked_desc:0 "Нас ігнорували десятиліттями — і це зіграло нам на руку. Ми стали багатими й сильними. Але якщо хтось раптом згадає про нас... ми можемо виявитися не готові."

STM_sky_war:0 "Війна в небі"
STM_sky_war_desc:0 "Наші люди літають на літаках Старого Світу, шукаючи в небі знаки наших богів. Віру в небесну війну не зламати."

ROS_illusion_of_danger:0 "Ілюзія небезпеки"
ROS_illusion_of_danger_desc:0 "Жовтстоун лякає землетрусами. Хоч вони й безпечні, більшість не ризикує сюди лізти. Це зробило нас майже неприступними. Навіть якщо землетрус не злякає ворога — траншеї та укріплення точно злякають."

MET_cybernatics_son:0 "Сини кібернетики"
MET_cybernatics_son_desc:0 "Наші воїни — це суміш плоти й металу, модифіковані кібернетикою. Їхня міць — безмежна, хоча й потребує постійного ремонту. Іноді вони... збоять. Але хто з нас ідеальний?"

BTH_war_bad:0 "Війна — Поганий Бізнес"
BTH_war_bad_desc:0 "Наш народ вважає війну марною справою, останнім засобом. Це зробило нас надзвичайно привабливими для тих, хто тікає від хаосу навколо, підвищивши наш авторитет, але водночас зробивши нас легкою мішенню."

KHA_ripe_for_picking:0 "Стиглі для Забою"
KHA_ripe_for_picking_desc:0 "Народи Дакоти не готові до того, як ми, Хани, ведемо бій. Це буде кривава баня — і ніхто з них не готовий."

JCK_lessons_of_the_dorseys:0 "Уроки Дорсі"
JCK_lessons_of_the_dorseys_desc:0 "Банда Дорсі втекла з Колорадо і оселилася в нас. Вони навчили нас, як потрошити людину, розповідали про 'Потоп Крові'. Вони були вправні воїни... аж поки ми їх усіх не повбивали."

MRR_hostilities_all_around:0 "Ворогів Навколо Багато"
MRR_hostilities_all_around_desc:0 "Нашу країну оточують ті, хто залюбки забрав би нашу землю. Це було б не так погано, якби ще не було зрадників усередині. Ми стоятимемо до кінця."

CPK_stand_your_ground:0 "Стій, Не Відступай"
CPK_stand_your_ground_desc:0 "Ми не поступимось землями жадібним до ресурсів державам. Ми роками добували корисні копалини й будемо далі — навіть якщо доведеться розбивати черепи, як гірську породу під ногами."

CPK_traders_fee:0 "Плата з Торговців"
CPK_traders_fee_desc:0 "Ми стягуємо плату за продаж вугілля, беручи 2% з прибутку за маршрут. Іноді це вигідно, іноді — ні. Але без нашого вугілля їх кораблі нікуди не підуть. То хто тут головний?"

HST_sound_of_music:0 "Звуки Музики"
HST_sound_of_music_desc:0 "Музика Вільяма лунає Північною Дакотою з радіохвиль, роблячи людей щасливішими — навіть рейдери не наважуються нападати, боячись втратити цю красу."

HST_university_formed:0 "Новий Університет"
HST_university_formed_desc:0 "Університет навчає багатьох наук, зокрема історії. Тут мають процвітати наука та мистецтво. Але після недавніх конфліктів думки про війну закралися до голів студентів і професорів. Дехто вже вираховує ворогів за допомогою статистики і вивчення минулих битв."

HST_university_formed_no_la:0 "Новий Університет"
HST_university_formed_no_la_desc:0 "Університет навчає багатьох наук, зокрема історії. Тут мають процвітати наука та мистецтво. Але після недавніх конфліктів думки про війну закралися до голів студентів і професорів. Дехто вже вираховує ворогів за допомогою статистики і вивчення минулих битв."

SNO_old_war_wisdom:0 "Мудрість Старої Війни"
SNO_old_war_wisdom_desc:0 "Артем бачив війну, бачив її жахи. І тепер він навчає нас, як відтворювати ці жахи — щоб створити безпечне місце для свого народу."

MTR_guarding_the_rails:0 "Охорона Рейок"
MTR_guarding_the_rails_desc:0 "Більшість із нас живе у потягах, але інші — наша перша лінія оборони. Вони надзвичайно швидкі та можуть відреагувати на будь-яку загрозу за лічені хвилини."

ELB_bastion_against_electorals:0 "Бастіон Проти Виборців"
ELB_bastion_against_electorals_desc:0 "Огиджений кривавим 'виборчим спортом' Виборців, Елбо покинув раду. Тепер він готується до наступу. Елбо не дозволить цим садистам розширити владу без бою."

STN_meddling:0 "Втручання"
STN_meddling_desc:0 "Кажуть, П'єр втручається у вибори Виборців, убив людей, щоб здобути владу. Дивно, але всі, хто поширює ці чутки, зникають. Ну, мабуть, збіг..."

DUN_arms_dealing:0 "Торгівля Зброєю"
DUN_arms_dealing_desc:0 "Дандерни знали, що колись можуть програти вибори. Тож вони завчасно працювали з найкращими зброярами, витрачаючи великі кошти на якісний арсенал. Ці контакти згодились і для найму найманців... і гірших людей."

SBR_preparing_for_war:0 "Підготовка до Війни"
SBR_preparing_for_war_desc:0 "Страсбург давно мріє про рейди. І тепер, коли вони готуються — всі впадуть перед ними, коли настане час."

PLT_unstable_position:0 "Нестабільне Становище"
PLT_unstable_position_desc:0 "Френкі, може, й був би добрим лідером десь у Пустці, але серед Виборців він лиш здобич для хижаків. Все, на що він сподівається — що його батька знайдуть живим..."

BAT_mercenary_force:0 "Батальйони Бетлфорда"
BAT_mercenary_force_desc:0 "Коли жителі Бетлфорда не грабують сусідів, вони пропонують свої послуги як найманці у їхніх же війнах. Якщо платять вчасно, вони зазвичай воюють проти «правильного» ворога. Зазвичай."

BAT_princely_force:0 "Королівські Батальйони"
BAT_princely_force_desc:0 "Завдяки нещодавнім перемогам (і майбутнім конфліктам), Принц Альберт змусив багатьох присягнути його трону. Звісно, вони й надалі братимуть участь у найманстві, витрачаючи здобуті гроші та досвід на створення непереможного війська."

PAP_batfords_betrayal:0 "Зрада Бетфорда"
PAP_batfords_betrayal_desc:0 "Бетфорд зрадив довіру Принца Альберта, і тепер усі інші страждають. Суворіші навчання підвищили міць флоту — єдиного, чим Бетфорд не може похвалитися, — але це завдає шкоди бойовому духу."

NUN_northern_suppliers:0 "Постачальники з Півночі"
NUN_northern_suppliers_desc:0 "Наші сили постачаються з-за великої хуртовини, і ми сильно залежимо від них. Місцевим це до вподоби, але отримати щось звідти стає дедалі складніше."

TPA_deputization:0 "§CДоля Призначає Заступників§!"
TPA_deputization_desc:0 "Доля любить своїх нових заступників і впевнена, що їх буде ще більше. §RАдже так багато новобранців більше нічого не потребуватимуть після переробки!§!"

DMM_shady_dealing:0 "Підозрілі Угоди"
DMM_shady_dealing_desc:0 "Ґрістл змушений вести справи з підозрілими мисливцями з Понівечених Лісів. Йому байдуже, чому м’ясо таке дешеве чи звідки пальне. Головне — щоб його народ не голодував... §Oхоча якби вони знали, що їдять і чим опалюють, можливо, воліли б голодувати.§!"

DMM_ragged:0 "Знедолені Виживальники"
DMM_ragged_desc:0 "Прокляті пройшли крізь пекло, та так і не повернулися. Колишні жителі Електоралів вирушили на схід у пошуках здобичі й примудрилися захопити дамбу Ґранд-Рапідс прямо з-під носа корони під час хаосу Першої Республіканської війни. Однак після цього прокинулась ШІ Воріт — Доля, і Манітобою запанував хиткий мир. Прорватися звідси неможливо, тож перед Проклятими — важкі часи."

DMM_lake_lords:0 "Володарі Вод Уінніпеґу"
DMM_lake_lords_desc:0 ""

DMM_northern_power_stations:0 "Могутні Північні Дамби"
DMM_northern_power_stations_desc:0 ""

ARB_manitoban_funding:0 "Фінансування від Манітоби"
ARB_manitoban_funding_desc:0 "Арбоґ отримує регулярні виплати від Манітоби, щоб їхня армія була готова до війни. Шкода, що вони при цьому накопичують борги — Ґанн скористається цим після перемоги. Так, ти станеш королівською особою... просто не в тій посаді, яку хотів."

GIM_forging_masters:0 "Майстри Кування"
GIM_forging_masters_desc:0 "До війни Гімлі мав лише бібліотеку та старовинну кузню. Через 200 років мешканці перетворили місто на промислового гіганта. Вони не найкращі будівельники й мають пристрасть до надмірностей, але працюють швидко й наполегливо — інакше зазнають гніву сусідів, які не отримали вчасно свої товари."

NEU_neutral_response:0 "Гидкі Нейтрали"
NEU_neutral_response_desc:0 "Ворогів принаймні можна розпізнати, а от з нейтралами... Ну, принаймні гарне місце, щоб оселитися!"

BRA_ambitions:0 "Амбіції"
BRA_ambitions_desc:0 "Ґанн амбіційний: він хоче не лише зміцнити владу в своїй країні, але й розширити межі маршу."

dakota_bloody_badlands:0 "Криваві Пустки"
dakota_bloody_badlands_desc:0 "На сході лежить земля, охоплена хаосом та зграями грабіжників, які шукають швидкого збагачення — перш ніж втратити все від рук сильнішого. Іноді вони прориваються на наші землі, залишаючи за собою насильство та грабунок. Колись ми зможемо з цим покінчити, а поки — мусимо витримати."

ROL_reducing_want:0 "Зменшуючи Бажання"
ROL_reducing_want_desc:0 "Старовіри чули про Драматею та їхню відсутність бажань. Вони перейняли деякі уроки від Маскараду. Хоча бажання ще існують, вони вчаться спрямовувати увагу та віру до Бога."

ATM_deluge_of_fire:0 "Потоп Вогню"
ATM_deluge_of_fire_desc:0 "Світ закінчився Потопом вогню, і сестра Роза з іншими членами Церкви повинні зробити все, щоб це не повторилося. Вони охороняють свої святі шахти й кличуть покинутих у світло віри. Вони хочуть розширити свій вплив, щоб захистити світ від другого Потопу, але багато хто вважає їх божевільними й загрозою."

MTC_the_final_campaign:0 "Останній Похід"
MTC_the_final_campaign_desc:0 "Антуан готувався до фінальної війни з Манітобою роками. Він зібрав свої сили й готує їх до останньої битви — принаймні у своїй боротьбі з Манітобою."

SHA_attis_sucessor:0 "Наступник Аттіса"
SHA_attis_sucessor_desc:0 "Шейл був довіреним командиром Аттіса, і під час його смерті перебував в іншому місці. Повернувшись, він утвердив свою владу серед залишків армії, хоч і мусив змагатися з Кітсом і Джаггернаутом. На щастя, Крашер і його шпигуни дадуть нам перевагу, коли повернемо Остін."

UOA_beacon_of_rights:0 "Маяк Прав Мутантів"
UOA_beacon_of_rights_desc:0 "Кітс і його заклики до прав мутантів по всьому Техасу привабили чимало прихильників. Вони щиро підтримують політика, хоч і стали зручною мішенню для рейдерів."

IMO_juggernauts_of_texas:0 "Гармати Техасу"
IMO_juggernauts_of_texas_desc:0 "Джаггернаут подбає про те, щоб його війська були добре озброєні й готові нищити Техас. Пам’ять про Аттіса житиме вічно!"