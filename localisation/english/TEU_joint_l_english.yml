l_english:
tex_rekindle_economic_union: "Відродження Економічного союзу"
tex_rekindle_economic_union_desc: "Хоча колись це було великою силою нашої нації, ми дозволили Техаському економічному союзу занепасти, поки були зайняті боротьбою з Бандою Руки. Ми мусимо виправити це!"
tex_two_nations_one_system: "Дві нації — одна система"
tex_two_nations_one_system_desc: "Завдяки тісній інтеграції нашої економіки з іншими членами Техаського економічного союзу ми можемо отримати значні економічні вигоди. Хай так буде довго!"
tex_develop_join_arms_production: "Розвиток спільного виробництва зброї"
tex_develop_join_arms_production_desc: "Поєднавши промислову міць [LNS.GetName] із військовим досвідом [TBH.GetNameDef], ми зможемо значно збільшити наш військовий потенціал!"
tex_announce_fiscal_reform: "Оголошення фіскальної реформи"
tex_announce_fiscal_reform_desc: "Хоча Техаський економічний союз сильний, він, безумовно, не бездоганний. Реформування наших фінансів допоможе нам зміцнити позиції."
tex_expand_inter_nation_inf: "Розширення міждержавної інфраструктури"
tex_expand_inter_nation_inf_desc: "Якщо ми справді хочемо, щоб Техаський економічний союз процвітав, ми повинні розширити інфраструктуру біля наших спільних кордонів, щоб заохотити транскордонну торгівлю."
tex_enlargen_tex_mission: "Розширення місії в Лоун-Стар"
tex_enlargen_tex_mission_desc: "Витративши трохи політичного капіталу, ми могли б розширити місію в Лоун-Стар, надіслану [TBH.GetNameDef]. Це значно поглибило б наші військові знання!"
tex_enlargen_lns_mission: "Розширення місії до [TBH.GetNameDef]"
tex_enlargen_lns_mission_desc: "Якщо ми докладемо певних політичних зусиль, то зможемо забезпечити відправлення більшої делегації до [TBH.GetNameDef], гарантуючи, що вони продовжать розширювати свою промисловість."
tex_adopt_texan_dollar: "Карбування Техаського долара"
tex_adopt_texan_dollar_desc: "Для стимулювання міжнародної торгівлі в рамках Техаського економічного союзу було вирішено заснувати Техаський долар. Справді смілива ідея."
tex_focus_on_new_research: "Зосередження на нових дослідженнях"
tex_focus_on_new_research_desc: "Частиною роботи Економічного союзу є розширення меж того, що ми вважали економічно можливим. Найкращий спосіб зробити це — розробляти нові технології!"
tex_restore_texas_uni: "Відновлення Техаського університету"
tex_restore_texas_uni_desc: "Колись великий навчальний та дослідницький заклад, старий кампус Техаського університету лежить у руїнах. З невеликою турботою ми могли б почати відновлювати наукові дослідження в цьому місці, що принесе користь нам усім."
tex_share_tech_development: "Обмін технологічними розробками"
tex_share_tech_development_desc: "Техаський економічний союз міг би досягти нових вершин могутності, якби порівну ділився технологіями між своїми членами."
tex_form_central_bank: "Створення Центрального банку Техасу"
tex_form_central_bank_desc: "Щоб гарантувати, що наша валюта завжди підкріплена золотом, ми повинні створити центральний банк. Це значно зміцнить Економічний союз."
tex_enhance_civilian_commerce: "Покращення цивільної торгівлі"
tex_enhance_civilian_commerce_desc: "Цивільні можливості як у нас, так і в інших членів Техаського економічного союзу не завадило б покращити. За правильних стимулів ми, безумовно, зможемо покращити цивільну торгівлю."
tex_joint_resource_campaigns: "Спільні кампанії зі збору ресурсів"
tex_joint_resource_campaigns_desc: "У всіх країнах Союзу залишається багато цінних полів для збору брухту, які ще належить належним чином дослідити. Якби ми провели скоординовану кампанію, то, безперечно, всі отримали б вигоду."
tex_unified_doctrine_research: "Дослідження єдиної доктрини"
tex_unified_doctrine_research_desc: "Ділячись військовими таємницями з країнами Економічного союзу, ми всі можемо отримати користь від мудрості одне одного."
tex_union_economic_boom: "Економічний бум Союзу"
tex_union_economic_boom_desc: "Завдяки рокам процвітання, єдності та співпраці економіки країн, що входять до Техаського економічного союзу, стрімко зростають. Слава!"
tex_enlargen_tex_mission_basic_drills: "Програми прискореної підготовки"
tex_enlargen_tex_mission_basic_drills_desc: "Консультативна місія в Лоун-Стар мала величезний успіх: наші офіцери змогли виявити кілька недоліків у їхньому режимі тренувань порівняно з нашими власними військами. Подальше консультування з метою оптимізації їхніх військових навчань може бути корисним для їхньої обороноздатності."
tex_enlargen_tex_mission_advanced_drills: "Програми поглибленої підготовки"
tex_enlargen_tex_mission_advanced_drills_desc: "Військові радники, яких ми відрядили до наших сусідів, вже надали багато порад, щоб допомогти їм підтримати свої збройні сили. Однак вони повідомили нам про кілька можливих покращень у тренуваннях злагодженості підрозділів і тактичних маневрах, які з часом і зусиллями вони могли б впровадити."
tex_enlargen_tex_mission_rangers_for_lonestar: "Рейнджери для Лоун-Стар"
tex_enlargen_tex_mission_rangers_for_lonestar_desc: "Збільшення нашої військової місії ще більше, щоб включити досвідчених офіцерів і законників на додаток до солдатів, які вже присутні в Лоун-Стар, могло б, окрім армійських реформ, забезпечити стратегічну підготовку їхніх власних командирів і допомогти із загальним підтриманням миру як жест доброї волі."
tex_enlargen_lns_mission_metal: "Що створила Земля"
tex_enlargen_lns_mission_metal_desc: "Земля може дати нам важливі метали, критично необхідні для інфраструктури та розвитку. У нас немає причин накопичувати це лише для себе, і ми отримаємо набагато більше від спільної програми обміну з нашими союзниками."
tex_enlargen_lns_mission_water: "Що принесли річки"
tex_enlargen_lns_mission_water_desc: "Вода дарує життя всім, і хоча ми були благословенні її достатком, не всім так пощастило. Забезпечуючи наших союзників питною водою, ми сприяємо тіснішій співпраці між нами."
tex_enlargen_lns_mission_advanced: "Належить нам, назавжди"
tex_enlargen_lns_mission_advanced_desc: "Більш просунутий брухт також є важливою частиною обох наших економік. Хоча він трапляється набагато рідше, ніж інші матеріали, такі товари, як електроніка, відіграють вирішальну роль у наших виробничих процесах."

