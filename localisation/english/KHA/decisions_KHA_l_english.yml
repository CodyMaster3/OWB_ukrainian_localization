 KHA_support_category_desc:0 "Контроль §L[KHA.GetFlag] Північними Ханами§! є бурхливим та нестабільним.\n\nПротягом кількох років ситуація зміниться та з'явиться можливість визначитися зі шляхом на майбутнє.\n\nЯкщо чиясь підтримка є принаймі §Yістотною§!, то коли прийде час, вони матимуть шанс на правління.\n\nТільки час покаже, хто очолить §g[GKH.GetFlag] залишок Ханів§! на шляху до їнього майбутнього тут, у Вайомінгу... \n\n[KHA_amgalan_support][KHA_regis_support][KHA_essen_support]"

