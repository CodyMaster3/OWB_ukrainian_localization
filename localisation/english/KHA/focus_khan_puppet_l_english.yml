l_english:
  ## Focuses
  KHA_pledging_loyalty:0 "Присягаємо на вірність"
  KHA_pledging_loyalty_desc:0 "Попри всі наші втрати, Хани дали нам другий шанс."
  KHA_advisors_at_the_capital:0 "Радники в столиці"
  KHA_advisors_at_the_capital_desc:0 "Справжні Хани надіслали кількох людей, щоб навчити нас... І трохи приглядати за нами.\n\nЯкщо я не видалив це, значить полінувався — далі ще трохи описів фокусів."
  KHA_medical_knowhow:0 "Медичні знання"
  KHA_medical_knowhow_desc:0 "Завдяки допомозі Послідовників, які теж прибули в цей регіон, Хани здобули чимало втрачених знань у медицині. Вони готові поділитись ними з нами на знак довіри."
  KHA_khan_history:0 "Історія Ханів"
  KHA_khan_history_desc:0 "Спадщина Ханів сягає понад століття назад — аж до Сховища 15. Ті, кого прислали нас вчити, з радістю діляться цими історіями."
  KHA_reaching_the_outskirts:0 "Досягти околиць"
  KHA_reaching_the_outskirts_desc:0 "Хани хочуть мати доступ до кожного куточка нашої території, і ми самі від цього лише виграємо."
  KHA_setting_up_new_shops:0 "Відкриваємо нові крамниці"
  KHA_setting_up_new_shops_desc:0 "Частина справи — щоб кришки не залежувалися. Фінансування нових магазинів у великих поселеннях має цьому допомогти."
  KHA_journey_to_lovell:0 "Подорож до [KHA.Capital.GetCapitalVictoryPointName]"
  KHA_journey_to_lovell_desc:0 "Поїздка до столиці."
  KHA_tougher_than_leather:0 "Міцніші за шкіру"
  KHA_tougher_than_leather_desc:0 "Справжній Хан має витримати удар. Це обов'язкова умова."
  KHA_open_recruitment:0 "Відкрита вербовка"
  KHA_open_recruitment_desc:0 "Кожен, хто доведе, що зможе вижити — може стати Ханом."
  KHA_setting_up_the_pits:0 "Влаштування ям для боїв"
  KHA_setting_up_the_pits_desc:0 "Бійцівські ями — місце для посвяти й тренувань. Або щоб просто спустити пар!"
  KHA_adopting_the_steppes:0 "Приймаємо степ"
  KHA_adopting_the_steppes_desc:0 "У нас своя історія співжиття з природою, але Хани наполягають, що ми маємо хоча б трохи зрозуміти життя в степу, якщо хочемо їх збагнути."
  KHA_guns_for_warriors:0 "Зброя для воїнів"
  KHA_guns_for_warriors_desc:0 "Не може бути воїна без зброї."
  KHA_putting_on_the_jacket:0 "Одягаємо куртку"
  KHA_putting_on_the_jacket_desc:0 "Відсьогодні ми почесні Хани — маємо шкіряні куртки з нашими символами поруч із ханськими. Велика честь, яку ми ще виправдаємо."
  KHA_medicinal_drugs:0 "Ліки"
  KHA_medicinal_drugs_desc:0 "Нова партія ліків прибуває. Зокрема, рецепт фіксера стане в пригоді, аби не злетіти дахом."
  KHA_one_last_lesson:0 "Останній урок"
  KHA_one_last_lesson_desc:0 "Навчатися ніколи не пізно."
  KHA_thelandsbounty:0 "Щедрість землі"
  KHA_thelandsbounty_desc:0 "Ця земля хоч і зранена, все ще сповнена краси. І сировини."
  KHA_relay_stations:0 "Релейні станції"
  KHA_relay_stations_desc:0 "Щоб швидко передавати повідомлення, ми будуємо мережу станцій, які пересилатимуть послання одна одній — так швидкість буде вища, ніж у поодиноких кур'єрів."
  KHA_our_way_of_fighting:0 "Наш стиль бою"
  KHA_our_way_of_fighting_desc:0 "Хани навчили нас свого бою, але ж вони б нас і не пощадили, якби не бачили в нас щось своє."
  KHA_riding_with_the_tribe:0 "Верхи з племенем"
  KHA_riding_with_the_tribe_desc:0 "Ми не впевнені, що це за штуки, але, схоже, сьогодні нас учать на них їздити."
  KHA_lighting_a_new_future:0 "Запалюємо нове майбутнє"
  KHA_lighting_a_new_future_desc:0 "Сьогодні починається новий світанок. Можливо, поразка була лише початком чогось кращого!\n\nЯкщо ти реально прочитав усе це — пінгуй IronVanguard на OWB Discord, бо є ще більше."
  KHA_proven_worth:0 "Доведена гідність"
  KHA_proven_worth_desc:0 "Очолити загін Ханів — велика честь. І здобудуть її лише гідні."
  KHA_heavy_metal_steeds:0 "Важкі металеві скакуни"
  KHA_heavy_metal_steeds_desc:0 "Рев мотору, вітер у волоссі, потужність і швидкість, коли летиш пусткою. Що може бути краще?"
  KHA_teachers_and_lessons:0 "Учителі й уроки"
  KHA_teachers_and_lessons_desc:0 "Амгалан зі своїми справді хочуть допомогти. Вони добрі вчителі. Залишилось лише закріпити урок."
  KHA_talking_to_followers:0 "Розмови з Послідовниками"
  KHA_talking_to_followers_desc:0 "Однією з причин, чому Хани вижили на півночі, була допомога від Послідовників Апокаліпсису. Можливо, вони поділяться знаннями і з нами."
  KHA_shared_workload:0 "Спільна праця"
  KHA_shared_workload_desc:0 "Чим більше рук — тим легша робота. А що може бути легше, ніж працювати разом?"
  KHA_poetry_lessons:0 "Уроки поезії"
  KHA_poetry_lessons_desc:0 "В Шанду наказав Кублай Хан\nЗвести палац насолоди серед рівнин:\nДе Альф — священна річка — лине\nЧерез печери, глибші за людське осягнення,\nДо моря безсонячного."
  KHA_a_path_to_walk:0 "Шлях, яким ідемо"
  KHA_a_path_to_walk_desc:0 "Ми продовжимо носити ханські знаки і битись пліч-о-пліч із нашими наставниками, але зрештою самі обираємо свою долю."
  KHA_a_loyal_cousin:0 "Вірний родич"
  KHA_a_loyal_cousin_desc:0 "Ми — не просто підлеглі. Ми — майже родина, як би дивно це не звучало. Від Реджиса це все набирає сенсу."
  KHA_setting_up_sales:0 "Запускаємо продажі"
  KHA_setting_up_sales_desc:0 "Світ тримається на грошах. Грошах і владі. Тобто — на двох речах."
  KHA_a_hit_of_psycho:0 "Доза психо"
  KHA_a_hit_of_psycho_desc:0 "Ніщо так не змушує нестись на кулемет, як психо."
  KHA_giving_our_dues:0 "Віддаємо належне"
  KHA_giving_our_dues_desc:0 "Сім'я не підводить сім'ю. І ми, чорт забирай, виконаємо наш план на цей місяць!"
  KHA_ride_or_die:0 "Їхати або ґиґнути"
  KHA_ride_or_die_desc:0 "До самого кінця, брате."
  KHA_in_the_service_of_the_khatun:0 "На службі у Хатун"
  KHA_in_the_service_of_the_khatun_desc:0 "Ессен, Хатун Істинних Ханів, доручила нам керувати цією землею і збирати війська в її ім’я."
  KHA_matching_pace:0 "Тримаємо темп"
  KHA_matching_pace_desc:0 "Воїни Ханів рухаються швидко — і ми не маємо відставати."
  KHA_partake_in_spoils:0 "Ділимо здобич"
  KHA_partake_in_spoils_desc:0 "Плюс походу з Ханами — тримай, що вбив."
  KHA_bloody_proof:0 "Криваве підтвердження"
  KHA_bloody_proof_desc:0 "Не станеш справжнім воїном, поки не проллєш кров. Ми не будемо другими."
  KHA_the_kheshig:0 "Хешиг"
  KHA_the_kheshig_desc:0 "Хешиг — наша еліта. Найкращі з найкращих, довели себе вірністю Хатун."

