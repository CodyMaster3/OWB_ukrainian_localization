  ## Events
  nf_khan_puppets.1.t:0 "Тривка поразка"
  nf_khan_puppets.1.d:0 "Лише кілька днів тому ми були змушені впасти на коліна перед північними Ханами. Ми були остаточно розбиті після кількох кривавих битв. Усі ці бої виснажили наших солдатів, спорядження, а найгірше — нашу гордість."
  nf_khan_puppets.1.a:0 "Зламали наші лінії"
  nf_khan_puppets.1.b:0 "Зламали наші інструменти"
  nf_khan_puppets.1.c:0 "Зламали нашу волю"

  nf_khan_puppets.2.t:0 "Новий шанс"
  nf_khan_puppets.2.d:0 "У Пустці другі шанси трапляються нечасто, тож це стало несподіванкою. Вони запропонували нам певну автономію в обмін на визнання їхньої влади, сплату данини та дотримання їхніх принципів."
  nf_khan_puppets.2.a:0 "Не найкраща угода"
  nf_khan_puppets.2.b:0 "І не найгірша"

  nf_khan_puppets.3.t:0 "Хтось наглядає за нами"
  nf_khan_puppets.3.d:0 "Сьогодні вранці з [KHA.Capital.GetCapitalVictoryPointName] прибула нова група. Кажуть, вони тут, щоб навчити нас, що означає бути Ханом. Вони принесли книжки з медицини й бойової справи, а також список вимог.\n\nЙмовірно, вони тут і для того, щоб стежити за нами, аби ми не накоїли дурниць. І хто ж їх у цьому звинуватить?"
  nf_khan_puppets.3.a:0 "Відповісти недовірою"
  nf_khan_puppets.3.b:0 "Прийняти знання"

  nf_khan_puppets.4.t:0 "Це відчувається правильно"
  nf_khan_puppets.4.d:0 "Цієї ночі за містом біля великого вогнища відбулася пишна церемонія. Нашому лідерові нарешті вручили куртку — справжню, з символом Ханів. Відтепер нас визнають частиною банди, хоч ми й залишаємося підлеглими."
  nf_khan_puppets.4.a:0 "Тепер ми справжні Хани"

  nf_khan_puppets.5.t:0 "Хитрощі банди"
  nf_khan_puppets.5.d:0 "Навіть після нашого 'випуску' завжди є чому повчитись. От нещодавно один загін, що приїхав до нашої столиці, навчив нас..."
  nf_khan_puppets.5.a:0 "Як економити паливо"
  nf_khan_puppets.5.b:0 "Як дивитися ширше"
  nf_khan_puppets.5.c:0 "Як тримати всіх у межах"
